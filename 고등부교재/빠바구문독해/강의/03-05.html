</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"01 문장의 머리를 찾아라","title":"빠른독해 바른독해 구문독해 해석기법03 적용독해05","audioDir":"03-05_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">해석기법03\u003cbr>적용독해05\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">빠른독해 바른독해 구문독해\u003c/div>\u003ch1>Rethinking Columbus Day: From Celebration to Reflection\u003c/h1>\u003ch2>Columbus Day에 대한 재고: 축하에서 성찰로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>미국은 전통적으로 \u003cb class=\"key\">Columbus \u003c/b>\u003cb class=\"key\">Day\u003c/b>를 기념해 왔으나, 콜럼버스가 원주민에게 가한 \u003cb class=\"key\">학대\u003c/b>와 파괴적인 결과를 고려하여 이를 \u003cb class=\"key\">Native \u003c/b>\u003cb class=\"key\">American \u003c/b>\u003cb class=\"key\">Day\u003c/b>로 대체해야 한다는 목소리가 커지고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Columbus Day should be replaced with a new holiday honoring Native Americans to address the explorer's cruel legacy and the suffering he caused.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 미국의 공휴일인 Columbus Day를 둘러싼 논란과 그 변화의 필요성을 다룬 지문을 함께 살펴보겠습니다. 이 글은 전통적인 기념일이 왜 비판받는지, 그리고 어떤 대안이 필요한지를 논리적으로 설명하고 있어요. 오늘 수업을 통해 역사적 사건을 바라보는 균형 잡힌 시각을 길러봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">Columbus \u003c/b>\u003cb class=\"key\">Day\u003c/b>는 1492년 크리스토퍼 콜럼버스의 아메리카 대륙 도착을 기리기 위해 1937년 미국의 연방 공휴일로 지정되었습니다. 하지만 최근 역사학계에서는 이를 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">수정주의\u003c/b>(Historical Revisionism) 관점에서 재조명하며, 그가 행한 원주민 \u003cb class=\"key\">착취\u003c/b>와 유럽발 질병 전파로 인한 인구 급감 문제를 심각하게 다룹니다. 마치 우리 동네를 처음 발견했다고 칭송받는 사람이 알고 보니 우리 조상들을 괴롭히고 쫓아낸 가해자였던 상황에 비유할 수 있습니다. 이에 따라 미국 내 많은 주와 도시에서는 이 날을 \u003cb class=\"key\">Indigenous \u003c/b>\u003cb class=\"key\">Peoples' \u003c/b>\u003cb class=\"key\">Day\u003c/b>(인주민의 날)로 명칭을 바꾸어 원주민의 역사를 기리고 있습니다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 먼저 알아볼까요? Columbus Day는 콜럼버스가 아메리카에 도착한 것을 기리는 날이지만, 최근에는 역사적 재평가가 활발하게 이루어지고 있습니다. 그 이유는 콜럼버스의 등장이 원주민들에게는 잔혹 행위와 질병이라는 재앙의 시작이었기 때문이죠. 이런 시각을 역사적 수정주의라고 부르는데, 마치 우리가 누군가의 성공을 축하하는 파티를 열었는데 알고 보니 그 성공이 타인의 눈물 위에 세워진 것이라는 사실을 알게 된 상황과 비슷합니다. 그래서 현재 미국 내 많은 곳에서는 이 날을 Indigenous Peoples' Day, 즉 원주민의 날로 바꿔 부르고 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>현재의 관습\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>미국이 매년 10월 두 번째 월요일에 \u003cb class=\"key\">Columbus \u003c/b>\u003cb class=\"key\">Day\u003c/b>를 공휴일로 지키며 콜럼버스의 아메리카 \u003cb class=\"key\">발견\u003c/b>을 기린다는 사실을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문제 제기\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>하지만 원주민에 대한 \u003cb class=\"key\">학대\u003c/b>와 파괴적인 영향을 고려할 때, 그를 기리는 것은 전혀 \u003cb class=\"key\">타당하지 \u003c/b>\u003cb class=\"key\">않다\u003c/b>고 비판합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>구체적 근거\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>콜럼버스가 원주민을 \u003cb class=\"key\">노예\u003c/b>로 만들고 죽였으며, 유럽인들이 가져온 \u003cb class=\"key\">질병\u003c/b>으로 인해 원주민 인구가 급감했다는 사실을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>대안 제시\u003csmall>주장 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>원주민의 고통을 기억하는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">공휴일\u003c/b> 제정을 지지해야 하며, 이를 \u003cb class=\"key\">대안\u003c/b>으로 삼아야 한다고 결론짓습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름은 통념적인 기념일 소개에서 시작해 강력한 비판을 거쳐 대안을 제시하는 구조로 이어집니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 미국의 익숙한 풍경을 보여줍니다. 매년 십 월의 두 번째 월요일에 미국인들이 Columbus Day를 지키며 이탈리아 탐험가 콜럼버스의 공로를 기린다는 배경을 설명하죠.","hl":"f0"},{"n":5,"text":"세 번째 문장에서 분위기가 확 바뀝니다. However라는 신호탄과 함께, 콜럼버스의 학대와 파괴적인 영향을 생각하면 그를 기리는 것이 전혀 타당하지 않다는 날카로운 비판을 던집니다.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장은 그 비판의 근거를 뒷받침합니다. 원주민들을 노예로 삼아 죽음에 이르게 하고, 외부에서 들어온 질병으로 그들의 인구를 급격히 줄어들게 했던 아픈 역사를 구체적으로 언급하죠.","hl":"f2"},{"n":7,"text":"마지막 여섯 번째와 일곱 번째 문장은 결론입니다. 그러므로 이제는 원주민의 고통을 기억하는 새로운 공휴일을 지지해야 하며, Columbus Day 대신 Native American Day를 기념해야 한다고 제안합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박 및 문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">초반부에는 Columbus Day라는 기존의 \u003cb class=\"key\">통념적 \u003c/b>\u003cb class=\"key\">관습\u003c/b>을 소개하지만, 세 번째 문장의 \u003cb class=\"key\">However\u003c/b>를 기점으로 비판적 시각을 드러냅니다. 이후 구체적인 역사적 \u003cb class=\"key\">근거\u003c/b>를 제시한 뒤, 마지막에 원주민을 기리는 새로운 날을 만들자는 작가의 \u003cb class=\"key\">주장\u003c/b>을 강력하게 펼칩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (3)\u003c/b>\u003cspan>통념에 대한 반전 및 비판 시작\u003c/span>\u003cb>Additionally (5)\u003c/b>\u003cspan>비판적 근거 추가\u003c/span>\u003cb>Therefore (6)\u003c/b>\u003cspan>결론 및 주장 도출\u003c/span>\u003cb>As an alternative to (7)\u003c/b>\u003cspan>구체적인 해결책 제안\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Columbus Day\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Christopher Columbus\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the Italian explorer\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the explorer\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Native American Day\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Indigenous Peoples' Day\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Columbus Day\u003c/th>\u003cth>Native American Day\u003c/th>\u003c/tr>\u003ctr>\u003ctd>콜럼버스의 발견 기념\u003c/td>\u003ctd>원주민의 고통 기억\u003c/td>\u003c/tr>\u003ctr>\u003ctd>학대와 파괴의 역사\u003c/td>\u003ctd>존중과 대안의 역사\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 초반에 일반적인 사실을 제시하다가 중간에 이를 뒤집는 통념 비판 구조를 가지고 있어요. 특히 마지막에 작가의 주장이 강력하게 나타나는 미괄식 구성이 돋보입니다. 문제 해결의 관점에서 보면 Columbus Day라는 문제를 새로운 기념일 제정이라는 해결책으로 연결하고 있습니다.","hl":"ty"},{"n":9,"text":"문장들 사이의 연결 고리를 잘 보세요. 세 번째 문장의 However는 글의 흐름을 완전히 바꾸는 결정적인 역할을 합니다. 또한 다섯 번째 문장의 Additionally는 콜럼버스의 잘못을 하나 더 추가하는 나열의 기능을 하고, 여섯 번째 문장의 Therefore는 앞선 근거들을 바탕으로 작가의 최종 결론을 이끌어내는 아주 중요한 신호어입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>every year\u003c/b>\u003cem>부사\u003c/em>\u003cspan>매년\u003c/span>\u003c/div>\u003cdiv>\u003cb>celebrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기념하다, 축하하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>holiday\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공휴일\u003c/span>\u003c/div>\u003cdiv>\u003cb>honor\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경의를 표하다, 기리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>explorer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>탐험가\u003c/span>\u003c/div>\u003cdiv>\u003cb>be credited with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~한 공을 인정받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>접속부사\u003c/em>\u003cspan>하지만, 그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>considering\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 고려하면\u003c/span>\u003c/div>\u003cdiv>\u003cb>mistreatment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>학대, 혹사\u003c/span>\u003c/div>\u003cdiv>\u003cb>devastating\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>파괴적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>effect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영향, 효과\u003c/span>\u003c/div>\u003cdiv>\u003cb>arrival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도착\u003c/span>\u003c/div>\u003cdiv>\u003cb>make sense\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>타당하다, 말이 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>not... at all\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전혀 ~이 아니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>continent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대륙\u003c/span>\u003c/div>\u003cdiv>\u003cb>enslave\u003c/b>\u003cem>동사\u003c/em>\u003cspan>노예로 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>additionally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>disease\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질병\u003c/span>\u003c/div>\u003cdiv>\u003cb>severely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>심하게, 가혹하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>reduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>줄이다, 감소시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>population\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인구\u003c/span>\u003c/div>\u003cdiv>\u003cb>therefore\u003c/b>\u003cem>접속부사\u003c/em>\u003cspan>그러므로\u003c/span>\u003c/div>\u003cdiv>\u003cb>entire\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전체적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>support\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>creation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>창조, 건립\u003c/span>\u003c/div>\u003cdiv>\u003cb>suffering\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고통\u003c/span>\u003c/div>\u003cdiv>\u003cb>alternative\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대안\u003c/span>\u003c/div>\u003cdiv>\u003cb>indigenous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>토착의, 원산의\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 짚어볼까요? mistreatment는 학대를 뜻하고, devastating은 아주 파괴적이고 충격적이라는 의미로 쓰였습니다. 또한 make sense라는 표현은 타당하다, 혹은 말이 된다는 뜻으로 독해에서 아주 자주 활용되니 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">mistreatment\u003c/b class=\"lp-chunk\">\u003cspan class=\"ko\">매년\u003c/span>\u003cspan class=\"en\">Every year\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">10월의 두 번째 월요일,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">second \u003c/span>\u003cspan class=\"tgt\">Monday \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">October\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국은\u003c/span>\u003cspan class=\"en\">the United States\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Columbus Day를 기념한다.\u003c/span>\u003cspan class=\"en\">celebrates Columbus Day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">매년 10월의 두 번째 월요일, 미국은 Columbus Day를 기념한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 도입부로 \u003cb class=\"key\">Columbus \u003c/b>\u003cb class=\"key\">Day\u003c/b>가 매년 언제 열리는지 행사 날짜를 소개하고 있습니다. 독자에게 잘 알려진 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 제공하며 이야기를 시작합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">날짜와 전치사\u003c/span> : on [전치사] + the second Monday [특정한 날] : \"10월의 두 번째 월요일에\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Every year, 매년. on the second Monday of October, 10월의 두 번째 월요일. the United States, 미국은. celebrates Columbus Day, Columbus Day를 기념한다.. 이 문장 전체를 해석하면, 매년 10월의 두 번째 월요일, 미국은 Columbus Day를 기념한다.","hl":"m"},{"n":13,"text":"미국의 공휴일인 콜럼버스 데이에 대한 기본 정보를 소개하고 있어요. 글의 배경을 설명하는 도입부 문장입니다.","hl":"mn"},{"n":14,"text":"첫 번째 문법 포인트로 전치사 on을 살펴봅시다. 특정한 날이나 요일 앞에는 전치사 on을 쓰는 것이 원칙이에요. 그래서 여기에서도 두 번째 월요일이라는 날짜 앞에 on이 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 공휴일은 크리스토퍼 콜럼버스에게 경의를 표한다,\u003c/span>\u003cspan class=\"en\">This holiday honors Christopher Columbus,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이탈리아인 탐험가인\u003c/span>\u003cspan class=\"en\">the Italian explorer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공을 인정받는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">credited \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아메리카 대륙을 발견한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">discovering \u003c/span>\u003cspan class=\"tgt\">America\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1492년 10월 12일에.\u003c/span>\u003cspan class=\"en\">on October 12, 1492.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 공휴일은 1492년 10월 12일에 아메리카 대륙을 발견한 공을 인정받는 이탈리아인 탐험가 크리스토퍼 콜럼버스에게 경의를 표한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 콜럼버스 데이의 유래를 설명하며, 그가 \u003cb class=\"key\">대륙 \u003c/b>\u003cb class=\"key\">발견\u003c/b>이라는 역사적 업적을 세운 인물로 \u003cb class=\"key\">평가\u003c/b>받고 있음을 서술합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사와 수동태\u003c/span> : the Italian explorer [선행사] + who [관계대명사] + is credited with [수동태] : \"공을 인정받는 탐험가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사(전치사의 목적어)\u003c/span> : with [전치사] + discovering [동명사] + America [목적어] : \"아메리카 대륙을 발견한 것에 대해\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"This holiday honors Christopher Columbus, 이 공휴일은 크리스토퍼 콜럼버스에게 경의를 표한다. the Italian explorer, 이탈리아인 탐험가인. who is credited with, 공을 인정받는. discovering America, 아메리카 대륙을 발견한. on October 12, 1492, 1492년 10월 12일에.. 이 문장 전체를 해석하면, 이 공휴일은 1492년 10월 12일에 아메리카 대륙을 발견한 공을 인정받는 이탈리아인 탐험가 크리스토퍼 콜럼버스에게 경의를 표한다.","hl":"m"},{"n":16,"text":"이 공휴일이 왜 만들어졌는지 그 이유를 설명하고 있어요. 콜럼버스가 아메리카 대륙을 발견했다는 역사적 업적을 기린다는 내용이죠.","hl":"mn"},{"n":17,"text":"첫 번째로 who is credited with 부분을 주목하세요. 관계대명사 who가 앞의 탐험가를 꾸며주면서, 동시에 무엇무엇으로 공을 인정받다라는 수동태 표현 be credited with가 사용되었습니다. 두 번째로 전치사 with 뒤에 discovering이 온 이유는 전치사 뒷자리에 명사가 와야 하기 때문에 동사를 동명사 형태로 바꿔준 것이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아메리카 원주민들에 대한 그의 학대를 고려하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">considering\u003c/span> his mistreatment of Native Americans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그의 도착의 파괴적인 영향을 (고려하면),\u003c/span>\u003cspan class=\"en\">and the devastating effect of his arrival,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 탐험가에게 경의를 표하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">honoring \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">explorer\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전혀 타당하지 않다.\u003c/span>\u003cspan class=\"en\">does not make any sense at all.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 아메리카 원주민들에 대한 그의 학대와, 그의 (미 대륙) 도착의 파괴적인 영향을 고려하면, 그 탐험가에게 경의를 표하는 것은 전혀 타당하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 흐름을 뒤집는 \u003cb cla ive American Day 또는 Indigenous Peoples’ Day를.\u003c/span>\u003cspan class=\"en\">Native American Day or Indigenous Peoples' Day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Columbus Day의 대안으로, 미국인들은 Native American Day 또는 Indigenous Peoples’ Day를 기념해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비판받는 기존의 기념일을 대체할 수 있는 구체적인 \u003cb class=\"key\">대안\u003c/b>을 제시하며 글을 마무리합니다. 원주민들의 역사와 권리를 존중하자는 필자의 강력한 \u003cb class=\"key\">권고와 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이 담긴 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 (대안으로서)\u003c/span> : [As an alternative to] + [명사] : \"~의 대안으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should + 동사원형\u003c/span> : [should] + [celebrate (동사원형)] : \"기념해야 한다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"As an alternative to Columbus Day, Columbus Day의 대안으로. Americans should celebrate, 미국인들은 기념해야 한다. Native American Day or Indigenous Peoples' Day, Native American Day 또는 Indigenous Peoples’ Day를.. 이 문장 전체를 해석하면, Columbus Day의 대안으로, 미국인들은 Native American Day 또는 Indigenous Peoples’ Day를 기념해야 한다.","hl":"m"},{"n":31,"text":"이 문장은 글 전체의 최종 결론이에요. Columbus Day가 가진 문제점을 해결하기 위해 어떤 기념일을 대신 챙겨야 하는지 명확한 해결책을 제시하며, 원주민을 존중하는 문화를 만들자고 제안하며 글을 맺고 있습니다.","hl":"mn"},{"n":32,"text":"첫 번째로 문장 맨 앞의 As an alternative to라는 덩어리 표현을 봐 주세요. 무언가에 대한 대안을 제시할 때 쓰는 아주 중요한 전치사구입니다. 두 번째 포인트는 조동사 should입니다. 필자가 독자들에게 무엇을 해야 하는지 자신의 주장을 가장 직접적으로 드러내고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>미국은 매년 10월 \u003cb class=\"key\">Columbus \u003c/b>\u003cb class=\"key\">Day\u003c/b>를 통해 콜럼버스의 신대륙 발견을 기념하는 전통을 가지고 있습니다.\u003c/li>\u003cli>하지만 콜럼버스가 원주민에게 가한 \u003cb class=\"key\">학대\u003c/b>와 잔혹한 통치 방식은 역사적 비판의 대상이 됩니다.\u003c/li>\u003cli>유럽인의 유입으로 인한 \u003cb class=\"key\">전염병\u003c/b>은 원주민의 인구를 급격히 감소시키는 비극적인 결과를 낳았습니다.\u003c/li>\u003cli>따라서 원주민의 고통을 기억하고 기리는 \u003cb class=\"key\">Native \u003c/b>\u003cb class=\"key\">American \u003c/b>\u003cb class=\"key\">Day\u003c/b>로 기존 공휴일을 대체해야 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Columbus Day should be replaced with a new holiday honoring Native Americans to address the explorer's cruel legacy and the suffering he caused.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">미국은 전통적으로 \u003cb class=\"key\">Columbus \u003c/b>\u003cb class=\"key\">Day\u003c/b>를 기념해 왔으나, 콜럼버스가 원주민에게 가한 \u003cb class=\"key\">학대\u003c/b>와 파괴적인 결과를 고려하여 이를 \u003cb class=\"key\">Native \u003c/b>\u003cb class=\"key\">American \u003c/b>\u003cb class=\"key\">Day\u003c/b>로 대체해야 한다는 목소리가 커지고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘은 콜럼버스라는 인물을 기리는 전통에 대한 비판과 그 대안을 다룬 글을 공부했습니다. 역사는 누구의 관점에서 보느냐에 따라 승리의 기록이 될 수도, 고통의 기억이 될 수도 있다는 점이 인상적이죠? 오늘 배운 However와 Therefore 같은 연결어들을 중심으로 글의 논리 구조를 다시 한번 복습해 보세요. 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
