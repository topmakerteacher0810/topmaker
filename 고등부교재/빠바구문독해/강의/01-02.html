</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"01 문장의 머리를 찾아라","title":"빠른독해 바른독해 구문독해 해석기법01 적용독해02","audioDir":"01-02_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">해석기법01\u003cbr>적용독해02\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">빠른독해 바른독해 구문독해\u003c/div>\u003ch1>Directional Effects on Jet Lag Severity\u003c/h1>\u003ch2>이동 방향이 시차증의 심각도에 미치는 영향\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>시차증은 체내 시계와 현지 시간의 \u003cb class=\"key\">불일치\u003c/b>로 발생하며, 동쪽으로 여행할 때 낮밤 주기가 \u003cb class=\"key\">단축\u003c/b>되어 서쪽 여행보다 적응이 더 어렵습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Jet lag is caused by desynchronization of the internal clock, and traveling east results in more severe symptoms because it shortens the circadian rhythm.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 해외여행의 불청객, 시차증에 대해 다룬 지문을 함께 분석해 볼 거예요. 이 글은 시차증이 왜 발생하는지, 그리고 왜 이동 방향에 따라 그 심각도가 달라지는지를 논리적으로 설명하고 있어요. 특히 동쪽으로 갈 때와 서쪽으로 갈 때 우리 몸이 어떻게 반응하는지에 집중해서 들어보세요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 흔히 겪는 시차증(Jet lag)은 몸속의 보이지 않는 시계인 \u003cb class=\"key\">생체 \u003c/b>\u003cb class=\"key\">리듬(Circadian \u003c/b>\u003cb class=\"key\">Rhythm)\u003c/b>이 현지 시간과 충돌하면서 일어나는 현상입니다. 우리 뇌는 빛의 양을 감지해 잠잘 시간과 깰 시간을 스스로 결정하는데, 비행기로 빠르게 이동하면 이 시스템에 \u003cb class=\"key\">과부하\u003c/b>가 걸리게 되죠. 이것은 마치 \u003cb class=\"key\">해외 \u003c/b>\u003cb class=\"key\">여행\u003c/b>을 갔을 때 한국 시간에 맞춰진 손목시계를 보며 현지 일정에 적응하려 애쓰는 것과 비슷합니다. 흥미로운 점은 우리가 어느 방향으로 가느냐에 따라 고통의 정도가 달라진다는 것인데, 우리 몸은 하루를 \u003cb class=\"key\">늘리는 \u003c/b>\u003cb class=\"key\">것\u003c/b>보다 앞당겨서 \u003cb class=\"key\">줄이는 \u003c/b>\u003cb class=\"key\">것\u003c/b>에 훨씬 더 큰 피로를 느낍니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 독해에 앞서 시차증의 원리를 알아볼까요. 우리 몸 안에는 하루 이십사 시간을 주기로 돌아가는 생체 리듬, 즉 circadian rhythm이라는 시스템이 있어요. 이 시스템은 빛을 통해 지금이 낮인지 밤인지를 판단하고 잠을 잘 시간을 정하죠. 그런데 비행기를 타고 아주 먼 거리를 순식간에 이동하면, 내 몸의 시계는 아직 한국인데 도착한 곳은 이미 아침인 상황이 벌어져요. 이때 발생하는 몸의 혼란이 바로 시차증입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>시차증의 정의\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>시차증은 \u003cb class=\"key\">체내 \u003c/b>\u003cb class=\"key\">시계\u003c/b>와 현지 시간대가 일치하지 않아 생기는 수면 문제이며, 이 시계는 수면과 각성 주기를 조절하는 \u003cb class=\"key\">생체 \u003c/b>\u003cb class=\"key\">리듬\u003c/b>을 의미합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>이동 방향의 영향\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>새로운 장소에 적응하는 데는 시간이 걸리는데, 특히 \u003cb class=\"key\">동쪽\u003c/b>과 \u003cb class=\"key\">서쪽\u003c/b> 어느 방향으로 여행하느냐에 따라 몸에 미치는 효과가 달라집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>방향별 차이와 결론\u003csmall>결론 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>서쪽 이동은 주기를 \u003cb class=\"key\">연장\u003c/b>하지만, 동쪽 이동은 주기를 \u003cb class=\"key\">단축\u003c/b>시켜 생체 리듬 조절을 더 힘들게 하고 더 심한 시차증을 유발합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 총 일곱 개의 문장으로 이루어져 있으며, 시차증의 정의에서 시작해 방향에 따른 차이점으로 내용을 전개합니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장은 시차증의 기본 정의를 내려줍니다. 시차증은 내부 시계와 시간대가 어긋날 때 발생하며, 이 시계를 바로 생체 리듬이라고 부른다는 점을 명시하고 있죠.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 새로운 장소에 적응하는 시간이 사람마다 다르다는 점을 언급하며, 특히 동쪽과 서쪽 여행이 몸에 주는 영향이 다르다는 핵심 주제를 던집니다.","hl":"f1"},{"n":6,"text":"마지막 다섯 번째 문장부터 일곱 번째 문장까지는 구체적인 대조가 나타납니다. 서쪽 여행은 주기를 늘려주어 비교적 쉽지만, 동쪽 여행은 주기를 줄여버리기 때문에 우리 몸이 훨씬 더 적응하기 힘들어한다는 결론을 보여주네요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">시차증의 정의에서 시작하여 동쪽과 서쪽 여행의 차이점을 \u003cb class=\"key\">대조\u003c/b>적으로 설명합니다. 글의 후반부에서 동쪽 이동이 더 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">시차증\u003c/b>을 유발한다는 결론을 내리며 독자의 이해를 돕고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Interestingly (4)\u003c/b>\u003cspan>화제 전환 및 주의 환기\u003c/span>\u003cb>Traveling west (5)\u003c/b>\u003cspan>대조군 A 제시\u003c/span>\u003cb>Traveling east, however (6)\u003c/b>\u003cspan>대조군 B 제시 및 역접\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">internal clock\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">body's circadian rhythm\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this cycle\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>서쪽 여행 (Traveling West)\u003c/th>\u003cth>동쪽 여행 (Traveling East)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>정상적인 낮밤 주기를 연장함\u003c/td>\u003ctd>정상적인 낮밤 주기를 단축함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상대적으로 적응이 용이함\u003c/td>\u003ctd>시차증이 더 심각하게 나타남\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 전형적인 비교 대조의 전개 방식을 취하고 있습니다. 서쪽 여행과 동쪽 여행이라는 두 가지 상황을 나란히 놓음으로써, 우리가 왜 특정 방향으로 여행할 때 더 힘든지 그 이유를 선명하게 드러내죠. 주제문은 마지막 일곱 번째 문장으로, 동쪽 여행이 시차 적응을 더 어렵게 만든다는 결론을 담고 있는 미괄식 구조입니다.","hl":"ty"},{"n":8,"text":"글의 흐름을 바꾸는 신호어들을 잘 보세요. 네 번째 문장의 Interestingly는 독자의 호기심을 자극하며 새로운 정보를 줄 준비를 하죠. 그리고 여섯 번째 문장의 however는 앞서 설명한 서쪽 여행과 반대되는 동쪽 여행의 상황을 강조하며 대조의 효과를 극대화합니다. internal clock이 circadian rhythm으로, 다시 this cycle로 이어지는 단어의 사슬도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>jet lag\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시차증\u003c/span>\u003c/div>\u003cdiv>\u003cb>temporary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일시적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>occur\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>internal clock\u003c/b>\u003cem>명사\u003c/em>\u003cspan>체내 시계\u003c/span>\u003c/div>\u003cdiv>\u003cb>synchronize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동기화하다, 일치시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>time zone\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시간대\u003c/span>\u003c/div>\u003cdiv>\u003cb>be referred to as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~라고 불리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>circadian rhythm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생체 리듬, 24시간 주기 리듬\u003c/span>\u003c/div>\u003cdiv>\u003cb>catch up with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 적응하다, ~을 따라잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>varying\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>각기 다른, 다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>amount\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양\u003c/span>\u003c/div>\u003cdiv>\u003cb>interestingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>흥미롭게도\u003c/span>\u003c/div>\u003cdiv>\u003cb>effect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>효과, 영향\u003c/span>\u003c/div>\u003cdiv>\u003cb>lengthen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>늘리다, 연장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경험\u003c/span>\u003c/div>\u003cdiv>\u003cb>normal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>day-night cycle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>낮밤 주기\u003c/span>\u003c/div>\u003cdiv>\u003cb>shorten\u003c/b>\u003cem>동사\u003c/em>\u003cspan>단축하다, 줄이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tend to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 경향이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>adjust\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조절하다, 적응하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>resulting in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결국 ~을 초래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>serious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>심각한\u003c/span>\u003c/div>\u003cdiv>\u003cb>case\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사례, 경우\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"여기서 중요한 단어는 synchronize입니다. 시간대를 맞춘다는 뜻이죠. 그리고 lengthen과 shorten이라는 반대 의미의 동사를 통해 서쪽과 동쪽 이동의 차이를 명확히 구분하고 있습니다. 마지막에 결과로 이어지다라는 뜻의 resulting in 표현도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">temporary\u003c/b>\u003cspan class=\"m\">일시적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">transient\u003c/span>\u003cspan class=\"s\">short-term\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">permanent\u003c/span>\u003cspan class=\"a\">lasting\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">synchronize\u003c/b>\u003cspan class=\"m\">동기화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">coordinate\u003c/span>\u003cspan class=\"s\">match\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">mismatch\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lengthen\u003c/b>\u003cspan class=\"m\">연장하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">extend\u003c/span>\u003cspan class=\"s\">prolong\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">shorten\u003c/span>\u003cspan class=\"a\">abbreviate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">adjust\u003c/b>\u003cspan class=\"m\">조절하다, 적응하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adapt\u003c/span>\u003cspan class=\"s\">accommodate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">serious\u003c/b>\u003cspan class=\"m\">심각한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">severe\u003c/span>\u003cspan class=\"s\">grave\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">mild\u003c/span>\u003cspan class=\"a\">slight\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어와 반의어도 정리해 볼까요. temporary는 일시적인이라는 뜻으로 transient와 바꿔 쓸 수 있지만, 영구적인이라는 뜻의 permanent와는 반대됩니다. lengthen은 늘리다라는 뜻이니 prolong과 비슷하고 shorten과는 반대겠죠. 심각한이라는 뜻의 serious는 severe로 대체할 수 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시차증은 ~이다\u003c/span>\u003cspan class=\"en\">Jet lag is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일시적인 수면 문제\u003c/span>\u003cspan class=\"en\">a temporary sleep problem\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발생하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">occurs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 체내 시계가 ~할 때\u003c/span>\u003cspan class=\"en\">when your body's internal clock\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맞춰 움직이지 않을 (때)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">synchronized \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간대에\u003c/span>\u003cspan class=\"en\">the time zone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현재 있는\u003c/span>\u003cspan class=\"en\">that you are in.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시차증은 당신의 체내 시계가 현재 있는 시간대에 맞춰 움직이지 않을 때 발생하는 일시적인 수면 문제이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">시차증\u003c/b>의 정의를 설명하며, 우리 몸의 내부 시계와 외부 시간의 \u003cb class=\"key\">불일치\u003c/b>가 그 원인임을 밝히는 도입부입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a temporary sleep problem [선행사] + that [주격 관계대명사] + occurs [동사] : \"발생하는 수면 문제\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be [동사] + synchronized [과거분사] + with : \"~에 맞춰지지 않다\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Jet lag is, 시차증은 ~이다.  a temporary sleep problem, 일시적인 수면 문제.  that occurs, 발생하는.  when your body's internal clock, 당신의 체내 시계가 ~할 때.  is not synchronized with, 맞춰 움직이지 않을 (때).  the time zone, 시간대에.  that you are in, 현재 있는. 이 문장 전체를 해석하면, 시차증은 당신의 체내 시계가 현재 있는 시간대에 맞춰 움직이지 않을 때 발생하는 일시적인 수면 문제이다.","hl":"m"},{"n":12,"text":"시차증이 무엇인지 정의를 내리는 첫 번째 문장이에요. 우리 몸 안의 시계와 우리가 실제로 있는 장소의 시간이 서로 맞지 않을 때 발생하는 일시적인 문제라고 설명하고 있죠.","hl":"mn"},{"n":13,"text":"첫 번째 포인트는 that occurs 부분으로 수면 문제를 꾸며주는 주격 관계대명사예요. 두 번째는 is not synchronized with입니다. 체내 시계가 외부 시간대에 맞춰지는 수동의 상태를 표현하기 위해 수동태가 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 내부 시계는\u003c/span>\u003cspan class=\"en\">This internal clock,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라고도 불리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">referred \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">as\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몸의 생체 리듬이라(고도)\u003c/span>\u003cspan class=\"en\">the body's circadian rhythm,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 몸에게 알려준다\u003c/span>\u003cspan class=\"en\">tells your body\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언제 잠들\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sleep\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 일어날지를\u003c/span>\u003cspan class=\"en\">and wake up.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몸의 생체 리듬이라고도 불리는 이 내부 시계는 당신의 몸에게 언제 잠들고 일어날지를 알려준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 내부 시계를 \u003cb class=\"key\">생체 \u003c/b>\u003cb class=\"key\">리듬\u003c/b>이라는 전문 용어로 보충 설명하며, 그것이 수행하는 \u003cb class=\"key\">수면 \u003c/b>\u003cb class=\"key\">조절\u003c/b> 역할을 상세히 다룹니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법 (수동태 포함)\u003c/span> : comma [,] + which [관계대명사] + is referred to as [수동태 관용구] : \"그리고 그것은 ~라고도 불린다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 + 주어 + 동사 (간접의문문)\u003c/span> : when [의문사] + it [주어] + is [동사] + time to sleep : \"언제 잠들 시간인지\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"This internal clock, 이 내부 시계는.  which is also referred to as, ~라고도 불리는.  the body's circadian rhythm, 몸의 생체 리듬이라(고도).  tells your body, 당신의 몸에게 알려준다.  when it's time to sleep, 언제 잠들.  and wake up, 그리고 일어날지를. 이 문장 전체를 해석하면, 몸의 생체 리듬이라고도 불리는 이 내부 시계는 당신의 몸에게 언제 잠들고 일어날지를 알려준다.","hl":"m"},{"n":15,"text":"이 문장은 체내 시계의 다른 이름인 생체 리듬을 소개하고 있어요. 이 리듬이 우리 몸에 언제 자고 언제 깨야 할지 신호를 보내는 역할을 한다고 설명합니다.","hl":"mn"},{"n":16,"text":"첫 번째로 콤마 뒤에 나온 which는 생체 리듬에 대한 보충 설명을 하는 관계대명사의 계속적 용법이에요. 두 번째로 when it is time 부분은 의문사 주어 동사의 어순을 가진 명사절로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\ ">\u003cb>의미\u003c/b> 동쪽으로 여행할 때 하루 주기가 짧아지는 현상이 우리 몸에 끼치는 부정적 영향을 설명합니다. \u003cb class=\"key\">동쪽으로의 \u003c/b>\u003cb class=\"key\">이동\u003c/b>은 우리 몸의 \u003cb class=\"key\">생체 \u003c/b>\u003cb class=\"key\">리듬\u003c/b>이 적응하는 것을 방해하여 결국 더 심한 시차증을 유발한다는 결론을 내리고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가목적어-진목적어 구문\u003c/span> : make [타동사] + it [가목적어] + more difficult [목적격 보어] + for one's circadian rhythm [의미상 주어] + to adjust [진목적어] : \"생체 리듬이 조절하는 것을 더 어렵게 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 분사구문 (결과)\u003c/span> : resulting [현재분사] + in [전치사] : \"결과적으로 ~로 이어진다\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"This tends to make it, 이는 ~하게 만드는 경향이 있다. more difficult, 더 어렵게. for one's circadian rhythm to adjust, 생체 리듬이 조절하는 것을. resulting in more serious cases of jet lag, 더 심각한 시차증의 사례로 이어진다.. 이 문장 전체를 해석하면, 이는 생체 리듬이 조절하는 것을 더 어렵게 만드는 경향이 있어, 더 심각한 시차증의 사례로 이어진다.","hl":"m"},{"n":30,"text":"동쪽으로 여행을 가면 하루의 주기가 짧아지는데, 이것이 우리 몸에 어떤 결과를 초래하는지 보여주는 문장이에요. 생체 리듬이 새로운 환경에 맞추는 게 힘들어져서 시차 적응이 더 고통스러워진다는 뜻이죠.","hl":"mn"},{"n":31,"text":"첫 번째로 make it more difficult 부분을 보세요. it은 가목적어이고 진짜 목적어는 뒤에 있는 to adjust입니다. 그 앞에 있는 for one's circadian rhythm은 to부정사의 행동 주체를 나타내는 의미상 주어예요. 두 번째로 콤마 뒤의 resulting in은 분사구문으로, 앞 절의 상황 때문에 결국 이런 결과가 생겼다는 흐름을 자연스럽게 연결해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>시차증은 \u003cb class=\"key\">체내 \u003c/b>\u003cb class=\"key\">시계\u003c/b>와 현재 위치의 시간대가 맞지 않아 생기는 일시적인 문제이다.\u003c/li>\u003cli>\u003cb class=\"key\">생체 \u003c/b>\u003cb class=\"key\">리듬\u003c/b>으로 불리는 내부 시계는 몸의 수면과 기상 주기를 결정한다.\u003c/li>\u003cli>서쪽 여행은 낮밤 주기를 \u003cb class=\"key\">연장\u003c/b>하여 상대적으로 몸이 적응하기에 수월하다.\u003c/li>\u003cli>동쪽 여행은 주기를 \u003cb class=\"key\">단축\u003c/b>시켜 생체 리듬의 조절을 방해하고 심한 시차증을 부른다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Jet lag is caused by desynchronization of the internal clock, and traveling east results in more severe symptoms because it shortens the circadian rhythm.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">시차증은 체내 시계와 현지 시간의 \u003cb class=\"key\">불일치\u003c/b>로 발생하며, 동쪽으로 여행할 때 낮밤 주기가 \u003cb class=\"key\">단축\u003c/b>되어 서쪽 여행보다 적응이 더 어렵습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":32,"text":"자, 오늘 지문을 통해 시차증의 과학적 원리와 방향에 따른 차이를 잘 이해하셨나요? 결국 동쪽으로 가는 것이 우리 생체 주기를 앞당겨야 하기 때문에 더 큰 부담을 준다는 것이 핵심이었습니다. 독해할 때 이런 대조 구조를 파악하면 글의 요지를 훨씬 빠르게 잡을 수 있어요. 고생 많으셨고 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
