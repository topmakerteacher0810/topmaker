</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"01 문장의 머리를 찾아라","title":"빠른독해 바른독해 구문독해 해석기법02 적용독해04","audioDir":"02-04_audio","preview":false,"count":49,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">해석기법02\u003cbr>적용독해04\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">빠른독해 바른독해 구문독해\u003c/div>\u003ch1>Understanding Restless Leg Syndrome: Symptoms and Management\u003c/h1>\u003ch2>하지불안증후군(RLS)에 대한 이해: 증상과 관리\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: \u003cb class=\"key\">하지불안증후군\u003c/b>(RLS)은 다리를 움직이고 싶은 강한 충동과 통증을 유발하는 \u003cb class=\"key\">신경 \u003c/b>\u003cb class=\"key\">장애\u003c/b>로, 완치법은 없으나 \u003cb class=\"key\">약물\u003c/b>을 통해 증상을 관리할 수 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Restless Leg Syndrome is a chronic neurological disorder that causes discomfort in the legs but can be managed with medication.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 신경 장애 중 하나인 하지불안증후군에 대해 배워볼 거예요. 이 글은 하지불안증후군의 증상부터 시작해서 이를 어떻게 관리할 수 있는지까지 전반적인 정보를 담고 있습니다. 다리가 불편해서 잠 못 이루는 분들의 고충과 그 해결책을 함께 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">하지불안증후군(RLS)은 주로 밤에 증상이 심해지는 \u003cb class=\"key\">신경계 \u003c/b>\u003cb class=\"key\">질환\u003c/b>(neurological disorder)입니다. 다리 속에 벌레가 기어가는 듯한 근지러움이나 바늘로 찌르는 듯한 통증을 느끼는 것이 특징입니다. 이는 뇌의 신경전달물질인 \u003cb class=\"key\">도파민\u003c/b>(dopamine) 불균형과 관련이 있는 것으로 알려져 있습니다. 일상생활에서 마치 \u003cb class=\"key\">자동차 \u003c/b>\u003cb class=\"key\">브레이크\u003c/b>(car brake)가 고장 나 서 있어야 할 때 자꾸 움직이려 하는 상황에 비유할 수 있습니다. 고등학생 수험생들에게도 수면 부족의 원인으로 종종 언급되며, \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>(genetic factor)이나 철분 부족이 영향을 줄 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 좀 쌓아볼까요? 하지불안증후군은 주로 밤에 증상이 심해져서 수면의 질을 크게 떨어뜨리는 신경계 질환이에요. 다리 속에 벌레가 기어가는 듯한 느낌이 드는 것이 특징인데, 마치 자동차 브레이크가 멋대로 풀리는 상황과 비슷하죠. 우리 뇌 속의 도파민 시스템 이상이나 유전적 요인이 원인으로 꼽히기도 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>정의와 증상\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>다리를 움직이고 싶은 충동과 통증을 동반하는 \u003cb class=\"key\">하지불안증후군\u003c/b>의 개념과 \u003cb class=\"key\">신경 \u003c/b>\u003cb class=\"key\">장애\u003c/b>로서의 정의를 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>발생 시기 및 부작용\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>주로 장시간 \u003cb class=\"key\">앉거나 \u003c/b>\u003cb class=\"key\">누워 \u003c/b>\u003cb class=\"key\">있을 \u003c/b>\u003cb class=\"key\">때\u003c/b> 발생하며, 이로 인한 수면 부족이 \u003cb class=\"key\">낮 \u003c/b>\u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">피로\u003c/b>로 이어진다는 점을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>증상 정도에 따른 차이\u003csmall>예시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>가벼운 경우는 움직임으로 해결되지만, \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">경우\u003c/b>는 영화 관람이나 비행기 탑승 같은 \u003cb class=\"key\">일상적 \u003c/b>\u003cb class=\"key\">활동\u003c/b>이 불가능해집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>원인 및 질환의 성격\u003csmall>상세 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>원인은 여전히 미스터리이며 \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>일 가능성이 있고, \u003cb class=\"key\">영구적인 \u003c/b>\u003cb class=\"key\">질환\u003c/b>으로 간주된다는 점을 명시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>관리 가능성 제시\u003csmall>결론 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>완치는 불가능하지만, \u003cb class=\"key\">증상을 \u003c/b>\u003cb class=\"key\">관리\u003c/b>할 수 있는 \u003cb class=\"key\">약물 \u003c/b>\u003cb class=\"key\">치료\u003c/b>라는 대안이 존재함을 알리며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름은 질환의 정의에서 시작해서 증상의 정도를 비교한 뒤, 현실적인 관리법으로 마무리됩니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 다리를 움직이고 싶은 충동과 통증을 설명하며 이 병을 하지불안증후군이라고 정의하고 있어요.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장은 주로 앉거나 누워 있을 때 발생한다는 점과 이로 인해 낮 시간의 피로가 생긴다는 결과를 보여주죠.","hl":"f1"},{"n":6,"text":"다섯 번째에서 일곱 번째 문장은 가벼운 사례와 심각한 사례를 대조하며 일상생활의 어려움을 강조합니다.","hl":"f2"},{"n":7,"text":"여덟 번째에서 열 번째 문장은 원인이 여전히 미스터리이며 완치가 불가능한 영구적 질환이라는 점을 제시해요.","hl":"f3"},{"n":8,"text":"마지막 열한 번째와 열두 번째 문장은 하지만 약물 치료를 통해 증상을 충분히 관리할 수 있다는 희망을 줍니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">하지불안증후군이라는 \u003cb class=\"key\">질환의 \u003c/b>\u003cb class=\"key\">고충\u003c/b>과 완치 불가능이라는 문제 상황을 먼저 제시합니다. 이후 마지막 부분에서 증상을 관리할 수 있는 \u003cb class=\"key\">약물의 \u003c/b>\u003cb class=\"key\">존재\u003c/b>를 언급하며 해결책을 주는 \u003cb class=\"key\">미괄식\u003c/b> 구조를 취하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>however (6)\u003c/b>\u003cspan>가벼운 사례에서 심각한 사례로의 내용 전환\u003c/span>\u003cb>still (8)\u003c/b>\u003cspan>지속되는 의문점 강조\u003c/span>\u003cb>However (11)\u003c/b>\u003cspan>부정적 상황에서 관리 가능성으로의 반전\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">restless leg syndrome (RLS)\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">neurological disorder\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">severe RLS\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">genetic condition\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">permanent condition\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Mild cases (가벼운 사례)\u003c/th>\u003cth>Severe RLS (심각한 사례)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Relieve symptoms by walking or shaking legs\u003c/td>\u003ctd>Sitting through a movie or flight is nearly impossible\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 하지불안증후군이라는 질환의 고충을 문제로 제기하고 해결책을 제시하는 구조예요. 특히 마지막 문장에서 관리 방법을 알려주며 끝나는 미괄식 구성을 취하고 있습니다.","hl":"ty"},{"n":10,"text":"여섯 번째 문장의 however는 증상의 심각성에 따라 내용이 전환되는 신호예요. 그리고 열한 번째 문장의 However는 완치가 안 된다는 절망적인 상황을 관리 가능하다는 긍정적인 방향으로 바꿔주는 아주 중요한 역할을 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>urge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>충동\u003c/span>\u003c/div>\u003cdiv>\u003cb>itchiness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가려움\u003c/span>\u003c/div>\u003cdiv>\u003cb>burning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화끈거림\u003c/span>\u003c/div>\u003cdiv>\u003cb>neurological\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신경의\u003c/span>\u003c/div>\u003cdiv>\u003cb>disorder\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장애\u003c/span>\u003c/div>\u003cdiv>\u003cb>known as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 알려진\u003c/span>\u003c/div>\u003cdiv>\u003cb>restless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가만히 못 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>syndrome\u003c/b>\u003cem>명사\u003c/em>\u003cspan>증후군\u003c/span>\u003c/div>\u003cdiv>\u003cb>commonly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>흔히\u003c/span>\u003c/div>\u003cdiv>\u003cb>occur\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>period\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기간\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause\u003c/b>\u003cem>동사\u003c/em>\u003cspan>초래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>daytime\u003c/b>\u003cem>명사\u003c/em>\u003cspan>낮 시간\u003c/span>\u003c/div>\u003cdiv>\u003cb>tiredness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>피로\u003c/span>\u003c/div>\u003cdiv ge\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 다리를 움직이고자 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">move\u003c/span> their legs,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라는 느낌과 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">along \u003c/span>\u003cspan class=\"tgt\">with\u003c/span> feelings of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가렵고, 화끈거리고, 아픈\u003c/span>\u003cspan class=\"en\">itchiness, burning, and pain.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 사람들은 가렵고, 화끈거리고, 아픈 느낌과 함께, 자신의 다리를 움직이고자 하는 강한 충동을 자주 경험한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 하지불안증후군을 겪는 사람들이 느끼는 구체적인 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">증상\u003c/b>들을 나열하며 글을 시작하고 있어요. 다리를 움직이고 싶은 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">충동\u003c/b>이 이 질환의 핵심 특징임을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : urge [명사] + [to move (to부정사구/형용사 역할)] : \"움직이고자 하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : [along with] + [명사(구)] : \"~와 함께\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Some people often experience, 어떤 사람들은 자주 경험한다. a strong urge, 강한 충동을. to move their legs, 자신의 다리를 움직이고자 하는. along with feelings of, ~라는 느낌과 함께. itchiness, burning, and pain, 가렵고, 화끈거리고, 아픈. 이 문장 전체를 해석하면, 어떤 사람들은 가렵고, 화끈거리고, 아픈 느낌과 함께, 자신의 다리를 움직이고자 하는 강한 충동을 자주 경험한다.","hl":"m"},{"n":14,"text":"첫 번째 문장은 하지불안증후군이 어떤 증상을 동반하는지 설명합니다. 단순히 다리가 아픈 게 아니라 다리를 움직이고 싶은 강한 충동과 함께 여러 불쾌한 감각이 나타난다는 점이 핵심이에요.","hl":"mn"},{"n":15,"text":"첫 번째 문법 포인트는 to move입니다. 앞에 나온 명사 urge를 꾸며주는 형용사적 용법으로 쓰였어요. 두 번째로 along with는 전치사구로 어떤 증상들이 동시에 일어나는지 덧붙여 설명할 때 사용합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 ~이다\u003c/span>\u003cspan class=\"en\">This is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신경 장애\u003c/span>\u003cspan class=\"en\">a neurological disorder\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~로 알려진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">known \u003c/span>\u003cspan class=\"tgt\">as\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지불안증후군(RLS)\u003c/span>\u003cspan class=\"en\">restless leg syndrome (RLS).\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 하지불안증후군(RLS)으로 알려진 신경 장애이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급한 특이한 증상들을 \u003cb class=\"key\">신경 \u003c/b>\u003cb class=\"key\">장애\u003c/b>의 일종인 \u003cb class=\"key\">하지불안증후군\u003c/b>으로 공식 정의하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : disorder [명사] + [known as (과거분사구)] : \"~로 알려진\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"This is, 이것은 ~이다. a neurological disorder, 신경 장애. known as, ~로 알려진. restless leg syndrome (RLS), 하지불안증후군(RLS). 이 문장 전체를 해석하면, 이것은 하지불안증후군(RLS)으로 알려진 신경 장애이다.","hl":"m"},{"n":17,"text":"두 번째 문장에서는 이 증후군을 공식적으로 명명합니다. 이 질환이 단순한 근육 문제가 아니라 신경 계통의 장애라는 사실을 알려주고 있어요.","hl":"mn"},{"n":18,"text":"여기서 주목할 부분은 known as입니다. 과거분사구가 앞에 있는 disorder를 뒤에서 꾸며주며 무엇으로 알려졌는지를 설명하는 수동의 의미를 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 가장 흔히 일어난다\u003c/span>\u003cspan class=\"en\">It most commonly occurs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 앉거나 누워 있었을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when\u003c/span> people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">sitting \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">lying \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장시간\u003c/span>\u003cspan class=\"en\">for long periods of time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 사람들이 장시간 앉거나 누워 있었을 때 가장 흔히 일어난다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 질환이 주로 어떤 \u003cb class=\"key\">특정 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에서 발생하는지 밝히고 있습니다. 특히 몸이 \u003cb class=\"key\">비활동적\u003c/b>인 상태일 때 증상이 심해진다는 특징을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절 접속사\u003c/span> : [when] + [주어 + 동사] : \"~했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 진행형과 병렬 구조\u003c/span> : [have been] + [v-ing (sitting)] or [v-ing (lying)] : \"앉거나 누워 있어 왔다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"It most commonly occurs, 그것은 가장 흔히 일어난다. when people have been sitting or lying down, 사람들이 앉거나 누워 있었을 때. for long periods of time, 장시간. 이 문장 전체를 해석하면, 그것은 사람들이 장시간 앉거나 누워 있었을 때 가장 흔히 일어난다.","hl":"m"},{"n":20,"text":"세 번째 문장은 이 증상이 주로 나타나는 때를 설명합니다. 가만히 오래 앉아 있거나 누워 있는 휴식 상태일 때 증상이 가장 빈번하게 발생한다는 정보를 줍니다.","hl":"mn"},{"n":21,"text":"첫 번째 문법 포인트는 시간의 접속사 when입니다. 두 번째는 have been sitting or lying down 부분인데요. 현재완료 진행형을 사용하여 앉아 있거나 누워 있는 상태가 지속되는 것을 표현했고, 두 현재분사가 병렬 구조를 이루고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 일으킬 수 있다\u003c/span>\u003cspan class=\"en\">It can cause\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수면 문제를,\u003c/span>\u003cspan class=\"en\">sleep problems,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이어지며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">leading \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낮 동안의 피로로.\u003c/span>\u003cspan class=\"en\">daytime tiredness.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 수면 문제를 일으켜 낮 동안의 피로로 이어질 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 하지불안증후군이 수면의 질을 떨어뜨리고, 그로 인해 낮에 \u003cb class=\"key\">피로감\u003c/b>을 느끼게 되는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (결과)\u003c/span> : [앞 문장], + [v-ing (현재분사구문)] : \"그 결과 ~로 이어지는\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"It can cause, 그것은 일으킬 수 있다. sleep problems, 수면 문제를. leading to, 이어지며. daytime tiredness, 낮 동안의 피로로.. 이 문장 전체를 해석하면, 그것은 수면 문제를 일으켜 낮 동안의 피로로 이어질 수 있다.","hl":"m"},{"n":23,"text":"하지불안증후군이 수면에 어떤 부정적인 영향을 주는지 보여주는 문장이에요. 밤에 잠을 잘 못 자니까 결국 낮 동안 피로감이라는 결과로 이어진다는 인과 관계를 설명하고 있죠.","hl":"mn"},{"n":24,"text":"여기서 leading to는 분사구문으로 쓰였어요. 앞 문장의 내용 때문에 결국 어떠어떠한 결과가 발생했다는 의미를 나타내는 현재분사 형태라는 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가벼운 하지불안증후군 사례를 보이는 사람들은\u003c/span>\u003cspan class=\"en\">People with mild cases of RLS\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 증상을 완화할 수 있다\u003c/span>\u003cspan class=\"en\">can \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">relieve\u003c/span> their symptoms\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걷거나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">walking \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다리를 떨어서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">shaking\u003c/span> their legs.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가벼운 하지불안증후군 사례를 보이는 사람들은 걷거나 다리를 떨어서 증상을 악화시킬(→ 완화할) 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 증상이 가벼운 경우, 간단한 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">움직임\u003c/b>을 통해 스스로 \u003cb class=\"key\">증상 \u003c/b>\u003cb class=\"key\">완화\u003c/b>가 가능하다는 해결책을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 뒤의 동사원형\u003c/span> : can [조동사] + relieve [동사원형] : \"완화할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사의 목적어 병렬 구조\u003c/span> : by + [v-ing①] + or + [v-ing②] : \"걸어 다니거나 흔듦으로써\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"People with mild cases of RLS, 가벼운 하지불안증후군 사례를 보이는 사람들은. can relieve their symptoms, 그들의 증상을 완화할 수 있다. by walking around, 걷거나. or shaking their legs, 다리를 떨어서.. 이 문장 전체를 해석하면, 가벼운 하지불안증후군 사례를 보이는 사람들은 걷거나 다리를 떨어서 증상을 악화시킬(→ 완화할) 수 있다.","hl":"m"},{"n":26,"text":"모든 환자가 다 힘든 건 아니라는 뜻이죠. 증상이 가벼운 사람들은 걷거나 다리를 흔드는 것 같은 단순한 동작으로도 충분히 증상을 줄일 수 있다는 해결 방법을 알려줍니다.","hl":"mn"},{"n":27,"text":"두 가지 포인트를 볼게요. 첫 번째로 조동사 can 뒤에는 동사원형 relieve가 왔고요. 두 번째로 전치사 by 뒤에 walking과 shaking이 나란히 연결된 병렬 구조를 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심각한 하지불안증후군에 대처하는 것은,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Dealing \u003c/span>\u003cspan class=\"tgt\">with\u003c/span> severe RLS,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 힘들다.\u003c/span>\u003cspan class=\"en\">is more challenging.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 심각한 하지불안증후군에 대처하는 것은 더 힘들다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가벼운 증상과 달리 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">증상\u003c/b>은 관리하기가 훨씬 \u003cb class=\"key\">까다롭고 \u003c/b>\u003cb class=\"key\">어렵다\u003c/b>는 점을 강조하며 내용의 흐름을 전환합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : Dealing [동명사 주어] + with ... + is [단수 동사] : \"~에 대처하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">연결 부사 (대조)\u003c/span> : S + V, however, ... : \"그러나\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Dealing with severe RLS, 심각한 하지불안증후군에 대처하는 것은. however, 그러나. is more challenging, 더 힘들다.. 이 문장 전체를 해석하면, 그러나 심각한 하지불안증후군에 대처하는 것은 더 힘들다.","hl":"m"},{"n":29,"text":"앞 문장에서는 가벼운 증상일 때의 해결책을 말했죠? 하지만 이번 문장에서는 however를 써서 증상이 심각해지면 상황이 완전히 달라져서 훨씬 대처하기 까다롭다는 점을 말하고 있어요.","hl":"mn"},{"n":30,"text":"첫 번째로 문장 맨 앞의 Dealing with는 동명사 주어예요. 이렇게 동명사가 주어 자리에 오면 단수 취급을 하기 때문에 동사 자리에 are가 아닌 is를 썼다는 점이 정말 중요합니다. 두 번째로 however는 문장 중간에 끼어 있지만 문장 전체 흐름을 반전시키는 역할을 하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 만들 수 있다\u003c/span>\u003cspan class=\"en\">It can \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영화 내내 앉아 있는 것이나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">sitting \u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">movie \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 장거리 비행을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">flight \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 불가능하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">nearly \u003c/span>\u003cspan class=\"tgt\">impossible\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 영화나 장거리 비행 내내 앉아 있는 것을 거의 불가능하게 만들 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> RLS(하지불안증후군)의 \u003cb class=\"key\">심각성\u003c/b>을 일상적인 사례를 들어 설명하며, 가만히 있는 것이 고통스러운 증상의 \u003cb class=\"key\">특징\u003c/b>을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장(목적격 보어)\u003c/span> : make [동사] + sitting ... [목적어] + impossible [목적격 보어(형용사)] : \"영화 관람이나 비행 내내 앉아 있는 것을 불가능하게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"It can make, 그것은 만들 수 있다. sitting through a movie, 영화 내내 앉아 있는 것이나. or a long flight, 혹은 장거리 비행을. nearly impossible, 거의 불가능하게. 이 문장 전체를 해석하면, 그것은 영화나 장거리 비행 내내 앉아 있는 것을 거의 불가능하게 만들 수 있다.","hl":"m"},{"n":32,"text":"이 문장은 하지불안증후군이 환자의 일상을 얼마나 힘들게 만드는지 보여줍니다. 영화관이나 비행기처럼 가만히 앉아 있어야 하는 상황이 가장 고통스러운 순간이 된다는 점을 강조하고 있어요.","hl":"mn"},{"n":33,"text":"여기서 make는 오형식 동사로 쓰였어요. 목적어인 sitting through a movie가 길게 이어지고 그 뒤에 나오는 impossible이 목적격 보어입니다. 보어 자리에는 반드시 형용사를 써야 하므로 부사 형태인 impossibly를 쓰면 틀린다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지불안증후군이 왜 발생하는지는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">RLS \u003c/span>\u003cspan class=\"tgt\">happens\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 수수께끼이다.\u003c/span>\u003cspan class=\"en\">is still a mystery.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지불안증후군이 왜 발생하는지는 여전히 수수께끼이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 질환의 증상과 고통을 설명한 뒤, 아직 명확한 \u003cb class=\"key\">원인\u003c/b>이 밝혀지지 않았음을 나타내며 \u003cb class=\"key\">미해결\u003c/b> 상태임을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문(명사절 주어)\u003c/span> : Why [의문사] + RLS [주어] + happens [동사] : \"하지불안증후군이 왜 발생하는지\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Why RLS happens, 하지불안증후군이 왜 발생하는지는. is still a mystery, 여전히 수수께끼이다.. 이 문장 전체를 해석하면, 하지불안증후군이 왜 발생하는지는 여전히 수수께끼이다.","hl":"m"},{"n":35,"text":"앞서 질환의 증상을 다뤘다면 이제는 그 원인에 대해 이야기할 차례예요. 안타깝게도 현대 의학에서도 아직 이 병이 왜 생기는지 정확한 이유는 모른다는 뜻입니다.","hl":"mn"},{"n":36,"text":"문장 맨 앞의 Why RLS happens는 의문사 주어 동사의 어순을 가진 간접의문문이에요. 이 덩어리 전체가 문장의 주어 역할을 하고 있죠. 간접의문문은 항상 평서문 어순인 주어와 동사 순서로 써야 한다는 것이 핵심 포인트예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~일 수도 있다\u003c/span>\u003cspan class=\"en\">It might be\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유전 질환\u003c/span>\u003cspan class=\"en\">a genetic condition,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 가질 수도 있다\u003c/span>\u003cspan class=\"en\">or it could have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 원인들을\u003c/span>\u003cspan class=\"en\">other causes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 유전 질환일 수도 있고, 다른 원인이 있을 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 원인은 불분명하지만 \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>이나 그 외의 다양한 \u003cb class=\"key\">가능성\u003c/b>이 열려 있음을 추측하는 내용입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">조동사의 추측 표현 및 병렬 구조\u003c/span> : might [조동사] + be [동사원형] / could [조동사] + have [동사원형] : \"~일 수도 있다 / 가질 수도 있다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"It might be, 그것은 ~일 수도 있다. a genetic condition, 유전 질환. or it could have, 혹은 가질 수도 있다. other causes, 다른 원인들을. 이 문장 전체를 해석하면, 그것은 유전 질환일 수도 있고, 다른 원인이 있을 수도 있다.","hl":"m"},{"n":38,"text":"정확한 원인을 모른다고 앞에서 말했으니, 이번에는 가능성 있는 원인들을 추측해보고 있어요. 유전 때문일 수도 있고 아니면 우리가 아직 모르는 또 다른 이유가 있을 수도 있다는 거죠.","hl":"mn"},{"n":39,"text":"여기서는 might와 could라는 조동사가 쓰였는데요. 둘 다 강한 확신이 아니라 어쩌면 그럴지도 모른다는 약한 추측을 나타내요. 두 개의 절이 or라는 접속사로 연결되어 두 가지 가능성을 나란히 보여주는 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치유법이 없으며,\u003c/span>\u003cspan class=\"en\">There is no cure,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 여겨진다\u003c/span>\u003cspan class=\"en\">and it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">considered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평생의 질환으로.\u003c/span>\u003cspan class=\"en\">a permanent condition.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">치유법이 없으며, 그것은 평생의 질환으로 여겨진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 하지불안증후군은 완치할 수 없는 \u003cb class=\"key\">만성 \u003c/b>\u003cb class=\"key\">질환\u003c/b>이며, 평생 지속되는 특성을 가졌음을 강조하여 질병의 \u003cb class=\"key\">심각성\u003c/b>을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + p.p.(과거분사) : \"여겨진다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"There is no cure, 치유법이 없으며. and it is considered, 그것은 여겨진다. a permanent condition, 평생의 질환으로.. 이 문장 전체를 해석하면, 치유법이 없으며, 그것은 평생의 질환으로 여겨진다.","hl":"m"},{"n":41,"text":"이 문장은 하지불안증후군이 완전히 낫는 방법이 없는 만성 질환이라는 점을 설명하고 있어요. 질병이 일시적인 것이 아니라 평생 지속되는 심각성을 강조하는 내용이죠.","hl":"mn"},{"n":42,"text":"첫 번째 어법 포인트는 is considered입니다. 주어인 it이 질환을 의미하는데, 질환이 직접 생각하는 게 아니라 사람들에 의해 여겨지는 것이죠. 그래서 수동태 형태를 썼다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지불안증후군이 치유될 수 없다는 사실이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fact \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> RLS cannot be cured\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미하지는 않는다\u003c/span>\u003cspan class=\"en\">doesn't mean\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무것도 할 수 없다는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">nothing \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">done\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 하지불안증후군이 치유될 수 없다는 사실이 아무것도 할 수 없다는 것을 의미하지는 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 완치가 불가능하다는 앞 문장의 비관적인 상황을 \u003cb class=\"key\">반전\u003c/b>시키며, 환자가 취할 수 있는 \u003cb class=\"key\">대처 \u003c/b>\u003cb class=\"key\">방안\u003c/b>이 있음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 접속사 that\u003c/span> : the fact (명사) + that (접속사) + 완전한 문장 : \"~라는 사실\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : nothing (주어) + can be done (조동사 + be + p.p.) : \"아무것도 할 수 없다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"However, 그러나. the fact that RLS cannot be cured, 하지불안증후군이 치유될 수 없다는 사실이. doesn't mean, 의미하지는 않는다. nothing can be done, 아무것도 할 수 없다는 것을.. 이 문장 전체를 해석하면, 그러나 하지불안증후군이 치유될 수 없다는 사실이 아무것도 할 수 없다는 것을 의미하지는 않는다.","hl":"m"},{"n":44,"text":"앞에서 완치가 안 된다고 했지만, 여기서 반전이 일어나요. 비록 병을 완전히 뿌리 뽑지는 못해도 우리가 할 수 있는 대처 방안이 분명히 있다는 희망적인 메시지를 전달하죠.","hl":"mn"},{"n":45,"text":"첫 번째로 the fact that을 주목하세요. 이때 that은 뒤에 완전한 문장을 이끌면서 앞의 명사와 같은 내용을 나타내는 동격 역할을 합니다. 구체적인 내용이라는 뜻이죠. 두 번째로 nothing can be done은 어떤 조치가 취해질 수 없다는 의미인데, 주어와 수동태의 결합을 잘 봐두어야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약들이 있다\u003c/span>\u003cspan class=\"en\">There are medicines\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 관리하는 데 도움이 되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">manage\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 증상을.\u003c/span>\u003cspan class=\"en\">their symptoms.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들이 자신의 증상을 관리하는 데 도움이 되는 약들이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 완치는 아니더라도 \u003cb class=\"key\">증상 \u003c/b>\u003cb class=\"key\">완화\u003c/b>를 돕는 구체적인 방법으로 \u003cb class=\"key\">약물 \u003c/b>\u003cb class=\"key\">치료\u003c/b>가 존재함을 설명하여 실제적인 해결책을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(medicines) + that (관계대명사) + 동사(help) : \"도움이 되는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">준사역동사 help의 목적격 보어\u003c/span> : help + 목적어(people) + 목적격 보어(manage: 동사원형/to부정사) : \"사람들이 관리하는 것을 돕다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"There are medicines, 약들이 있다. that help people manage, 사람들이 관리하는 데 도움이 되는. their symptoms, 자신의 증상을.. 이 문장 전체를 해석하면, 사람들이 자신의 증상을 관리하는 데 도움이 되는 약들이 있다.","hl":"m"},{"n":47,"text":"완치는 안 되지만 실질적으로 도움을 줄 수 있는 해결책을 말하고 있어요. 약을 통해서 불편한 증상을 조절하고 관리하며 일상생활을 할 수 있다는 뜻입니다.","hl":"mn"},{"n":48,"text":"첫 번째 포인트인 that help는 앞에 있는 약들을 꾸며주는 주격 관계대명사예요. 관계대명사가 주어 역할을 하고 있죠. 두 번째로 help people manage 부분에서 manage는 동사원형 형태인데, help가 준사역동사이기 때문에 목적어 뒤에 동사원형을 쓴 것입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">하지불안증후군\u003c/b>은 다리를 움직이고 싶은 충동과 불쾌한 통증을 동반하는 \u003cb class=\"key\">신경 \u003c/b>\u003cb class=\"key\">장애\u003c/b>입니다.\u003c/li>\u003cli>주로 앉거나 누워 있을 때 발생하며, 수면 장애로 인한 \u003cb class=\"key\">낮 \u003c/b>\u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">피로\u003c/b>를 유발합니다.\u003c/li>\u003cli>가벼운 경우는 움직임으로 해결되지만, \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">경우\u003c/b>는 일상적인 사회 활동에 지장을 줍니다.\u003c/li>\u003cli>완치법은 없으나 \u003cb class=\"key\">약물 \u003c/b>\u003cb class=\"key\">치료\u003c/b>를 통해 증상을 충분히 조절하고 관리할 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Restless Leg Syndrome is a chronic neurological disorder that causes discomfort in the legs but can be managed with medication.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: \u003cb class=\"key\">하지불안증후군\u003c/b>(RLS)은 다리를 움직이고 싶은 강한 충동과 통증을 유발하는 \u003cb class=\"key\">신경 \u003c/b>\u003cb class=\"key\">장애\u003c/b>로, 완치법은 없으나 \u003cb class=\"key\">약물\u003c/b>을 통해 증상을 관리할 수 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":49,"text":"오늘 배운 하지불안증후군은 완치는 안 되지만 약물로 관리가 가능하다는 점이 핵심이었어요. 글의 마지막 부분에 핵심 메시지가 담겨 있었죠? 오늘 배운 내용 다시 한번 복습해 보시고, 다음 시간에 더 유익한 지문으로 만나요!","hl":null}]}]});</script></body></html>
