</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"일등급샘","title":"빠른독해 바른독해 구문독해 해석기법01 적용독해01","audioDir":"01-01_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">해석기법01\u003cbr>적용독해01\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">빠른독해 바른독해 구문독해\u003c/div>\u003ch1>Gen Z's Workforce Expectations: Flexibility over Salary\u003c/h1>\u003ch2>Z세대의 노동 시장 기대치: 급여보다 유연성\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Z세대는 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">원주민\u003c/b>으로서 직장 생활에서 급여보다 \u003cb class=\"key\">업무 \u003c/b>\u003cb class=\"key\">유연성\u003c/b>과 일과 삶의 \u003cb class=\"key\">균형\u003c/b>을 최우선 가치로 여기며, 기업은 이들의 가치관에 맞춘 환경을 제공해야 합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>To successfully recruit Gen Z workers, companies must understand and provide work environments that prioritize flexibility and work-life balance over salary.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 Z세대라고 불리는 새로운 세대가 직장 생활에서 무엇을 중요하게 생각하는지 함께 살펴보겠습니다. 이번 지문은 디지털 원주민인 Z세대의 가치관과 기업이 그들을 잡기 위해 해야 할 노력을 담고 있어요. 핵심 내용을 요약하자면 Z세대는 급여보다 업무의 유연성과 워라밸을 중시한다는 것이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">Z세대는 천구백구십칠 년부터 이천십이 년 사이에 태어난 이들을 지칭하며, 어린 시절부터 디지털 기기를 접한 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">원주민\u003c/b> (Digital Natives) 세대입니다. 이들은 \u003cb class=\"key\">노동 \u003c/b>\u003cb class=\"key\">시장\u003c/b> (Labor Market)에서 기존 세대와 달리 개인의 행복과 자율성을 매우 중요하게 생각합니다. 마치 정해진 코스 요리 대신 자신이 원하는 재료만 골라 넣는 \u003cb class=\"key\">커스터마이징\u003c/b> (Customizing) 방식을 선호하는 것처럼, 업무 방식도 본인의 삶에 맞추길 원하죠. 그래서 이들에게는 \u003cb class=\"key\">워라밸\u003c/b> (Work-Life Balance)이 직장 선택의 가장 중요한 기준이 됩니다. 기업들이 유능한 Z세대 인재를 영입하려면 이러한 세대적 변화를 반드시 이해해야 합니다.\u003c/div>","segs":[{"n":2,"text":"Z세대는 천구백구십칠 년부터 이천십이 년 사이에 태어난 세대를 말합니다. 이들은 태어날 때부터 인터넷과 스마트폰을 접한 디지털 원주민이라서 기술 활용 능력이 아주 뛰어나죠. 이제 이들이 사회에 나와 노동 인구의 주축이 되고 있는데, 부모 세대와는 직업을 고르는 기준이 완전히 다릅니다. 돈보다는 나의 시간과 개인적 가치를 더 소중하게 여기는 경향이 강하거든요. 마치 정해진 식단표를 따르기보다 내가 원하는 재료를 골라 담는 커스터마이징 방식의 삶을 추구한다고 볼 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>Z세대의 정의와 배경\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>Z세대가 누구인지 정의하며 이들을 인터넷과 함께 성장한 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">원주민\u003c/b>으로 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>노동 시장 진입과 고용주의 과제\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>이들이 \u003cb class=\"key\">노동 \u003c/b>\u003cb class=\"key\">인구\u003c/b>에 진입하고 있으므로 고용주가 이들의 독특한 기대를 이해하는 것이 중요해졌음을 알립니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>Z세대의 핵심 요구 사항\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>높은 급여보다 \u003cb class=\"key\">업무 \u003c/b>\u003cb class=\"key\">유연성\u003c/b>과 일과 삶의 \u003cb class=\"key\">균형\u003c/b>을 중시하는 이들의 구체적인 가치관을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>기업의 대응 방안과 결론\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>이러한 \u003cb class=\"key\">선호도\u003c/b>를 무시하면 채용이 어려워지므로, 그들의 가치에 맞는 \u003cb class=\"key\">근무 \u003c/b>\u003cb class=\"key\">환경\u003c/b>을 제공해야 한다고 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 지문의 내용을 첫 번째 문장부터 마지막 일곱 번째 문장까지 순서대로 따라가며 핵심 흐름을 짚어봅시다.","hl":null},{"n":4,"text":"처음 두 문장에서는 Z세대가 누구인지 정의합니다. 이들을 디지털 원주민이라고 부르는 이유는 인터넷을 사용하며 성장했기 때문이라는 점을 명시하고 있어요.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 이들이 노동 인구에 진입하고 있다는 시의적절한 변화를 언급합니다. 그래서 고용주들이 이들의 독특한 기대를 이해하는 것이 필수적인 과제가 되었다고 설명하죠.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장은 Z세대의 구체적인 요구 사항을 보여줍니다. 이들은 높은 연봉보다 업무 유연성을 우선시하며, 일과 삶의 균형을 맞출 수 있는 직업을 원한다는 점이 핵심입니다.","hl":"f2"},{"n":7,"text":"여섯 번째와 일곱 번째 문장은 기업들에게 주는 경고이자 조언입니다. 이러한 선호를 무시하면 채용이 어려워질 것이니, 그들의 가치관에 맞는 환경을 제공해야 한다고 강조하며 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">Z세대의 등장이라는 사회적 변화와 그들의 특성을 분석한 뒤, 기업이 직면할 수 있는 \u003cb class=\"key\">채용의 \u003c/b>\u003cb class=\"key\">어려움\u003c/b>을 언급하며 최종적으로 \u003cb class=\"key\">해결책\u003c/b>을 제시하는 구조입니다. 마지막 일곱 번째 문장에서 기업이 취해야 할 필수적인 조치를 명시하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>because (2)\u003c/b>\u003cspan>이유/원인 제시\u003c/span>\u003cb>so (3)\u003c/b>\u003cspan>결과/인과 관계\u003c/span>\u003cb>so (4)\u003c/b>\u003cspan>결과/인과 관계\u003c/span>\u003cb>also (5)\u003c/b>\u003cspan>추가 정보 제공\u003c/span>\u003cb>so (5)\u003c/b>\u003cspan>결과/인과 관계\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Generation Z\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">digital natives\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Gen Z\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these preferences\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Gen Z workers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>전통적 가치 (Traditional)\u003c/th>\u003cth>Z세대의 가치 (Gen Z)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>급여 중심의 보상\u003c/td>\u003ctd>업무 유연성 중심의 가치\u003c/td>\u003c/tr>\u003ctr>\u003ctd>회사 중심의 일정\u003c/td>\u003ctd>본인 중심의 일정 통제권\u003c/td>\u003c/tr>\u003ctr>\u003ctd>단순 경제적 목표\u003c/td>\u003ctd>개인과 직업적 목표의 균형\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 Z세대의 특징과 요구 사항을 나열한 뒤 기업의 대응을 촉구하는 미괄식 구조입니다. 주제문은 마지막 일곱 번째 문장으로, Z세대의 가치에 맞는 환경 제공이 필요하다는 결론을 내리고 있습니다.","hl":"ty"},{"n":9,"text":"이 지문에서는 인과 관계를 나타내는 접속사 so가 세 번이나 쓰이면서 논리적인 결론을 이끌어내고 있어요. 또한 prioritize A over B라는 표현을 통해 Z세대가 연봉보다 무엇을 더 중요하게 생각하는지 대조해서 보여주고 있죠. also라는 단어를 사용해 추가적인 요구 사항인 일과 삶의 균형까지 자연스럽게 연결하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>generation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세대\u003c/span>\u003c/div>\u003cdiv>\u003cb>made up of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 구성되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>digital natives\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디지털 원주민\u003c/span>\u003c/div>\u003cdiv>\u003cb>workforce\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노동 인구\u003c/span>\u003c/div>\u003cdiv>\u003cb>unique\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특유의\u003c/span>\u003c/div>\u003cdiv>\u003cb>expectation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기대\u003c/span>\u003c/div>\u003cdiv>\u003cb>employer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고용주\u003c/span>\u003c/div>\u003cdiv>\u003cb>prioritize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>우선시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>flexibility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유연성\u003c/span>\u003c/div>\u003cdiv>\u003cb>salary\u003c/b>\u003cem>명사\u003c/em>\u003cspan>급여\u003c/span>\u003c/div>\u003cdiv>\u003cb>request\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통제권\u003c/span>\u003c/div>\u003cdiv>\u003cb>schedule\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일정\u003c/span>\u003c/div>\u003cdiv>\u003cb>balance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>균형\u003c/span>\u003c/div>\u003cdiv>\u003cb>personal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>개인적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>seek\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enable\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~을 가능하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fulfill\u003c/b>\u003cem>동사\u003c/em>\u003cspan>달성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>professional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>직업적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>goal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목표\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn a blind eye to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 무시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>preference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선호\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenging\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>recruit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>채용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>match\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~에 부합하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>value\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가치\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들도 다시 한 번 짚어볼게요. prioritize는 우선순위를 정해 먼저 처리한다는 뜻이고, turn a blind eye to는 무엇을 못 본 척 무시한다는 아주 중요한 표현입니다. 그리고 recruit는 회사가 직원을 뽑는 채용 과정을 말한다는 것도 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">unique\u003c/b>\u003cspan class=\"m\">특유의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">peculiar\u003c/span>\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">prioritize\u003c/b>\u003cspan class=\"m\">우선시하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rank\u003c/span>\u003cspan class=\"s\">prefer\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">flexibility\u003c/b>\u003cspan class=\"m\">유연성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adaptability\u003c/span>\u003cspan class=\"s\">elasticity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rigidity\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">seek\u003c/b>\u003cspan class=\"m\">찾다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pursue\u003c/span>\u003cspan class=\"s\">search\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">avoid\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fulfill\u003c/b>\u003cspan class=\"m\">달성하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">achieve\u003c/span>\u003cspan class=\"s\">accomplish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">recruit\u003c/b>\u003cspan class=\"m\">채용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hire\u003c/span>\u003cspan class=\"s\">employ\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dismiss\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어를 함께 정리해 볼까요? 우선 특유의라는 뜻을 가진 unique는 peculiar나 distinct로 바꿔 쓸 수 있고 흔하다는 뜻의 common과는 반대됩니다. 우선시하다라는 뜻의 prioritize는 rank나 prefer와 의미가 통하지만 무시하다라는 뜻의 neglect와는 반대되죠. 채용하다라는 의미인 recruit은 hire나 employ와 같고 해고하다라는 뜻의 dismiss와 대조를 이룹니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Z세대는(Z세대란)\u003c/span>\u003cspan class=\"en\">Generation Z (Gen Z)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구성되어 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들로\u003c/span>\u003cspan class=\"en\">people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1997년에서 2012년 사이에 태어난\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">born\u003c/span> between 1997 and 2012.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Z세대는 1997년에서 2012년 사이에 태어난 사람들로 구성되어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본문의 주제인 \u003cb class=\"key\">Z세대\u003c/b>의 정의를 출생 연도를 기준으로 명확하게 제시하며 글을 시작합니다. 글의 도입부로서 뒤에 나올 특징들의 \u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 설정하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (구성되다)\u003c/span> : be [be동사] + made up of [과거분사구] : \"구성되어 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : people [명사] + born [과거분사] : \"태어난\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Generation Z (Gen Z), Z세대는(Z세대란). is made up of, 구성되어 있다. people, 사람들로. born between 1997 and 2012, 1997년에서 2012년 사이에 태어난. 이 문장 전체를 해석하면, Z세대는 1997년에서 2012년 사이에 태어난 사람들로 구성되어 있다.","hl":"m"},{"n":13,"text":"이 문장은 이 글의 주인공인 Z세대가 누구인지를 출생 연도로 정의하고 있습니다. 글의 흐름상 전체적인 배경을 깔아주는 아주 중요한 기본 정보를 전달하는 문장이에요.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 is made up of라는 수동태 표현이에요. 주어가 특정 범위로 정의되거나 구성될 때 쓰는 표현이죠. 두 번째 포인트는 born이라는 과거분사입니다. people이라는 명사 뒤에서 그들이 태어난 시기를 꾸며주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 종종 불린다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">called\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘디지털 원주민’이라고\u003c/span>\u003cspan class=\"en\">&quot;digital natives&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~때문에\u003c/span>\u003cspan class=\"en\">because\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 자랐기\u003c/span>\u003cspan class=\"en\">they grew up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인터넷을 사용하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">using\u003c/span> the internet.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 인터넷을 사용하며 자랐기 때문에 종종 ‘디지털 원주민’이라고 불린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Z세대의 가장 큰 특징인 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">친화성\u003c/b>을 설명합니다. '디지털 원주민'이라는 별명을 통해 그들이 \u003cb class=\"key\">인터넷\u003c/b> 환경에 매우 익숙함을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장의 수동태\u003c/span> : be [be동사] + called [과거분사] + 목적격 보어 [명사] : \"~라고 불린다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (부대상황)\u003c/span> : grew up [동사] + using [현재분사] : \"사용하면서\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"They are often called, 그들은 종종 불린다. \"digital natives\", ‘디지털 원주민’이라고. because, ~때문에. they grew up, 그들이 자랐기. using the internet, 인터넷을 사용하며. 이 문장 전체를 해석하면, 그들은 인터넷을 사용하며 자랐기 때문에 종종 ‘디지털 원주민’이라고 불린다.","hl":"m"},{"n":16,"text":"Z세대가 왜 디지털 원주민이라는 별명을 갖게 되었는지 그 이유를 설명하는 문장입니다. 어릴 때부터 인터넷을 쓴 환경이 그들의 정체성을 만들었다는 뜻이죠.","hl":"mn"},{"n":17,"text":"첫 번째로 are often called라는 수동태를 보세요. 뒤에 나오는 디지털 원주민이라는 명사는 원래 보어 자리에 있던 말이에요. 두 번째 포인트는 using이라는 현재분사입니다. 자라나는 과정에서 인터넷 사용이라는 동작이 동시에 일어나는 부대상황을 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 이제 시작하고 있다\u003c/span>\u003cspan class=\"en\">They are now beginning\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노동 인구에 진입하기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">enter\u003c/span> the workforce,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로\u003c/span>\u003cspan class=\"en\">so\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 특유의 기대를 이해하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">understanding \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">unique \u003c/span>\u003cspan class=\"tgt\">expectations\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고용주에게 중요하다\u003c/span>\u003cspan class=\"en\">is important for employers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들이 이제 노동 인구에 진입하기 시작하고 있으므로, 그들 특유의기대를 이해하는 것이 고용주에게 중요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Z세대의 사회 진출로 인해 \u003cb class=\"key\">고용주\u003c/b>가 준비해야 할 점을 시사합니다. 이 글이 단순히 세대 특징을 나열하는 것이 아니라 \u003cb class=\"key\">조직 \u003c/b>\u003cb class=\"key\">관리\u003c/b> 관점의 조언임을 보여주는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법\u003c/span> : beginning [타동사] + to enter [to부정사구/목적어] : \"진입하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : understanding [동명사] + 목적어 ~ [구] : \"그들 특유의 기대를 이해하는 것\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They are now beginning, 그들이 이제 시작하고 있다. to enter the workforce, 노동 인구에 진입하기. so, 그러므로. understanding their unique expectations, 그들 특유의 기대를 이해하는 것이. is important for employers, 고용주에게 중요하다. 이 문장 전체를 해석하면, 그들이 이제 노동 인구에 진입하기 시작하고 있으므로, 그들 특유의기대를 이해하는 것이 고용주에게 중요하다.","hl":"m"},{"n":19,"text":"이제 Z세대가 직장 생활을 시작하는 나이가 되었다는 현실적인 변화를 언급하고 있어요. 그래서 이들을 뽑아야 하는 사장님들, 즉 고용주들이 이 세대를 잘 알아야 한다는 필요성을 강조하는 문장입니다.","hl":"mn"},{"n":20,"text":"첫 번째 문법은 to enter입니다. begin이라는 동사의 목적어로 쓰인 명사적 용법이에요. 두 번째는 아주 중요한데, understanding으로 시작하는 주어 부분입니다. 동명사구가 주어 자리에 오면 항상 단수 취급을 하기 때문에 뒤에 동사를 are가 아닌 is로 써야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Z세대는 우선시하므로\u003c/span>\u003cspan class=\"en\">Gen Z \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">prioritizes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">급여보다 업무 유연성을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003cspan class=\"tgt\">flexibility \u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">salary\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그들은 요구한다\u003c/span>\u003cspan class=\"en\">so they request\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 업무 일정에 대한 통제권을\u003c/span>\u003cspan class=\"en\">control over their work schedule.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Z세대는 급여보다 업무 유연성을 우선시하므로, 그들은 자신의 업무 일정에 대한 통제권을 요구한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Z세대가 직장 생활에서 가장 중요하게 생각하는 \u003cb class=\"key\">가치관\u003c/b>을 설명합니다. 높은 연봉보다는 자신의 시간을 자유롭게 활용할 수 있는 \u003cb class=\"key\">자율성\u003c/b>을 더 선호한다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 수 일치\u003c/span> : Gen Z [3인칭 단수 주어] + prioritizes [단수 동사] : \"우선시하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">prioritize A over B\u003c/span> : prioritize [동사] + A [목적어] + over [전치사] + B [비교 대상] : \"급여보다 업무 유연성을 우선시하다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Gen Z prioritizes, Z세대는 우선시하므로. work flexibility over salary, 급여보다 업무 유연성을. so they request, 그래서 그들은 요구한다. control over their work schedule, 자신의 업무 일정에 대한 통제권을. 이 문장 전체를 해석하면, Z세대는 급여보다 업무 유연성을 우선시하므로, 그들은 자신의 업무 일정에 대한 통제권을 요구한다.","hl":"m"},{"n":22,"text":"Z세대가 직업을 선택할 때 가장 중요하게 생각하는 가치관을 설명하고 있습니다. 돈보다는 시간 활용의 자율성을 더 선호한다는 구체적인 특징을 보여주죠.","hl":"mn"},{"n":23,"text":"첫 번째로 주어가 3인칭 단수인 Gen Z이므로 동사 prioritize 뒤에 S를 붙인 prioritizes 형태를 썼습니다. 두 번째로 prioritize A over B라는 표현은 B보다 A를 우선시하다라는 뜻으로 여기서는 유연성을 급여보다 더 높게 평가한다는 의미예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균형을 찾는 것도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> a balance\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 업무와 개인 생활 사이의\u003c/span>\u003cspan class=\"en\">between their work and personal lives\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게 중요하므로\u003c/span>\u003cspan class=\"en\">is also important to them,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 일자리를 찾는다\u003c/span>\u003cspan class=\"en\">so they seek jobs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 달성할 수 있게 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">enable \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fulfill\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인적인 그리고 직업적인 목표를 모두\u003c/span>\u003cspan class=\"en\">both their personal and professional goals.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자신의 업무와 개인 생활 사이의 균형을 찾는 것도 그들에게 중요하므로, 그들은 개인적인 그리고 직업적인 목표를 모두 달성할 수 있게 하는 일자리를 찾는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이른바 \u003cb class=\"key\">워라밸\u003c/b>이라 불리는 업무와 사생활의 조화를 강조하는 문장입니다. 단순히 돈을 버는 것을 넘어 개인의 성장과 \u003cb class=\"key\">성취감\u003c/b>까지 보장받고 싶어 하는 욕구를 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(주어)\u003c/span> : To find [주어] + is [단수 동사] : \"찾는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : jobs [선행사] + that [관계사] + enable [동사] : \"~하게 하는 (일자리)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 동사 enable\u003c/span> : enable [동사] + them [목적어] + to fulfill [목적격 보어] : \"그들이 달성할 수 있게 하다\"\u003c/div>\u003c/div>","segs":[{"n":2 b> 기업이 새로운 세대의 가치관에 적응하지 못할 때 겪게 될 \u003cb class=\"key\">구인난\u003c/b>을 경고합니다. 인재 채용을 위해서는 기업의 \u003cb class=\"key\">태도 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 필수적임을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사구\u003c/span> : Companies [명사] + turning [현재분사] : \"무시하는 (기업)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가목적어 it 구문\u003c/span> : find [동사] + it [가목적어] + challenging [목적격 보어] + to recruit [진목적어] : \"뽑는 것이 어렵다는 것을 알게 되다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Companies turning a blind eye, 무시하는 기업은. to these preferences, 이러한 선호를. will find it challenging, 어렵다는 것을 알게 될 것이다. to recruit Gen Z workers, Z세대 근로자를 뽑는 것이. 이 문장 전체를 해석하면, 이러한 선호를 무시하는 기업은 Z세대 근로자를 뽑는 것이 어렵다는 것을 알게 될 것이다.","hl":"m"},{"n":28,"text":"Z세대의 선호도를 무시하는 기업이 겪게 될 부정적인 결과를 경고하고 있습니다. 인재 확보를 위해서는 기업이 이들의 요구 사항에 맞춰 변화해야 한다는 것을 암시하죠.","hl":"mn"},{"n":29,"text":"첫 번째로 turning이라는 현재분사구가 앞의 Companies를 수식하고 있는데 turning a blind eye to는 무엇을 못 본 척하다라는 뜻입니다. 두 번째로 find it challenging to recruit 구문에서 it은 가목적어이고 to recruit 이하가 진목적어로 쓰였으니 이 구조를 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">필요하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">necessary \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게 제공하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">offer\u003c/span> them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">업무 환경을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003cspan class=\"tgt\">environments \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 가치에 맞는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">match\u003c/span> their values.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들의 가치에 맞는 업무 환경을 그들에게 제공하는 것이 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 Z세대의 특징과 선호도를 고려했을 때, 기업이 그들의 \u003cb class=\"key\">가치관\u003c/b>에 부합하는 환경을 조성해야 함을 강조하는 \u003cb class=\"key\">결론\u003c/b> 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It과 진주어 to부정사\u003c/span> : It [가주어] + be동사 + 형용사 + to-v [진주어] : \"제공하는 것이 필요하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 명사(선행사) + that [주격 관계대명사] + 동사 : \"~에 맞는 업무 환경\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"It is necessary, 필요하다. to offer them, 그들에게 제공하는 것은. work environments, 업무 환경을. that match their values, 그들의 가치에 맞는. 이 문장 전체를 해석하면, 그들의 가치에 맞는 업무 환경을 그들에게 제공하는 것이 필요하다.","hl":"m"},{"n":31,"text":"이 문장은 전체 지문의 내용을 마무리하는 핵심 문장이에요. 기업들이 Z세대를 채용하고 싶다면, 그들이 중요하게 생각하는 가치관과 잘 어울리는 업무 환경을 반드시 만들어 주어야 한다는 점을 강조하고 있죠.","hl":"mn"},{"n":32,"text":"첫 번째로 문장의 시작에 나온 It은 해석하지 않는 가주어이고, 진짜 주어는 뒤에 있는 to offer부터 끝까지예요. 긴 주어를 뒤로 보내서 문장의 균형을 맞춘 가주어 진주어 구문이죠. 두 번째로 that match their values 부분은 바로 앞에 있는 명사인 업무 환경을 수식하는 주격 관계대명사절이에요. 어떤 환경인지 구체적으로 설명해 주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Z세대는 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">원주민\u003c/b>으로서 기술에 능숙하며 이제 노동 시장에 진입하기 시작했습니다.\u003c/li>\u003cli>이들은 높은 급여보다 \u003cb class=\"key\">업무 \u003c/b>\u003cb class=\"key\">유연성\u003c/b>과 업무 일정에 대한 통제권을 더 중요하게 생각합니다.\u003c/li>\u003cli>일과 삶의 \u003cb class=\"key\">균형\u003c/b>을 통해 개인적 목표와 직업적 목표를 동시에 달성하고자 노력합니다.\u003c/li>\u003cli>기업이 인재를 채용하려면 이들의 \u003cb class=\"key\">가치관\u003c/b>에 부합하는 근무 환경을 반드시 제공해야 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>To successfully recruit Gen Z workers, companies must understand and provide work environments that prioritize flexibility and work-life balance over salary.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Z세대는 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">원주민\u003c/b>으로서 직장 생활에서 급여보다 \u003cb class=\"key\">업무 \u003c/b>\u003cb class=\"key\">유연성\u003c/b>과 일과 삶의 \u003cb class=\"key\">균형\u003c/b>을 최우선 가치로 여기며, 기업은 이들의 가치관에 맞춘 환경을 제공해야 합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 수업은 여기까지입니다. 새로운 세대의 등장은 기업에게 위기가 아니라 새로운 문화를 만들 성장 기회가 될 수 있어요. 여러분도 미래의 주역으로서 여러분만의 가치관을 잘 정립해 나가길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
