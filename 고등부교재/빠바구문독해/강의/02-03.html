</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"01 문장의 머리를 찾아라","title":"빠른독해 바른독해 구문독해 해석기법02 적용독해03","audioDir":"02-03_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">해석기법02\u003cbr>적용독해03\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">빠른독해 바른독해 구문독해\u003c/div>\u003ch1>The Distinct Boundaries Between Law and Ethics\u003c/h1>\u003ch2>법과 윤리의 뚜렷한 경계\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">윤리\u003c/b>와 \u003cb class=\"key\">법\u003c/b>은 기원, 변화 방식, 집행 수단에서 차이가 있으며, 한쪽 영역에 속한다고 해서 반드시 다른 쪽에도 속하는 것은 아닙니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Laws and ethics are distinct systems that differ in their origins, methods of change, and enforcement mechanisms.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 일상에서 정말 자주 쓰는 두 단어, '합법'과 '윤리'가 어떻게 다른지에 대해 공부해 볼 거예요. 많은 사람이 이 둘을 비슷하다고 생각하지만, 실제로는 아주 큰 차이가 있답니다. 오늘 수업을 통해 이 두 개념이 어떻게 생성되고, 어떻게 우리 삶에 적용되는지 요지와 핵심 내용을 완벽하게 정리해 드릴게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">법과 도덕의 관계를 다룰 때 흔히 '법은 \u003cb class=\"key\">도덕의 \u003c/b>\u003cb class=\"key\">최소한\u003c/b>'이라는 표현을 사용합니다. 법(Law)은 국가 권력에 의해 강제되는 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">규범\u003c/b>인 반면, 윤리(Ethics)는 사회 구성원들이 공유하는 \u003cb class=\"key\">내면적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>와 양심에 기초합니다. 예를 들어, 무거운 짐을 든 노인을 돕지 않는 것은 \u003cb class=\"key\">비윤리적\u003c/b>일 수 있지만, 그것이 \u003cb class=\"key\">처벌\u003c/b>을 받는 불법 행위는 아닙니다. 이처럼 두 개념은 서로 겹치는 부분이 많지만, 이 글에서는 그 사이의 명확한 \u003cb class=\"key\">차이점(difference)\u003c/b>에 주목하고 있습니다. 일상 속에서 우리가 '나쁜 일'이라고 부르는 것들이 모두 '불법'은 아니라는 점을 이해하는 것이 핵심입니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 학습에 앞서 법과 윤리의 배경지식을 알아볼까요? 흔히들 법은 도덕의 최소한이라고 말해요. 법은 국가가 질서를 유지하기 위해 강제로 정해둔 사회 규범이고, 윤리는 우리 마음속 양심이나 사회적 약속에 가깝죠. 예를 들어, 어른에게 예의 없게 행동하는 건 비윤리적이지만 법으로 처벌받지는 않아요. 이처럼 법적 정당성과 도덕적 정당성은 때로는 겹치기도 하지만, 때로는 완전히 따로 놀기도 한답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>개념의 불일치\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>'합법'과 '윤리'가 동일하지 않다는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>를 제시합니다. 겉으로 보기에는 \u003cb class=\"key\">비슷해 \u003c/b>\u003cb class=\"key\">보일지라도\u003c/b> 하나가 성립한다고 해서 다른 하나가 반드시 성립하는 것은 아님을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>기원과 변화의 차이\u003csmall>근거1 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>윤리는 세대 간 \u003cb class=\"key\">전승\u003c/b>을 통해 형성되지만, 법은 \u003cb class=\"key\">정부\u003c/b>에 의해 인위적으로 만들어집니다. 법은 사회 전체의 믿음보다는 \u003cb class=\"key\">권력자\u003c/b>의 결정에 따라 바뀔 수 있다는 점을 대조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>집행 방식의 차이\u003csmall>근거2 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>윤리는 주변에서 \u003cb class=\"key\">자연스럽게\u003c/b> 배우는 반면, 법은 국가라는 \u003cb class=\"key\">공식 \u003c/b>\u003cb class=\"key\">권위\u003c/b>에 의해 강제됩니다. 사람들이 법을 지키는 이유는 정부의 \u003cb class=\"key\">강제성\u003c/b> 때문임을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사례와 결과\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>비윤리적이지만 \u003cb class=\"key\">불법이 \u003c/b>\u003cb class=\"key\">아닌\u003c/b> 구체적인 예시들을 들어 차이를 보여줍니다. 법을 어길 때만 정부로부터 \u003cb class=\"key\">직접적인 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>을 받게 된다는 점을 명시하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 법과 윤리의 차이점을 여러 기준을 통해 조목조목 짚어주는 흐름으로 구성되어 있습니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장과 두 번째 문장에서는 '합법'과 '윤리'가 동일하지 않다는 핵심 주제를 던집니다. 겉으로 보기에는 비슷해 보일지라도 한쪽이 맞다고 해서 다른 쪽까지 항상 맞는 것은 아니라는 개념의 불일치성을 먼저 강조하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 세 번째와 네 번째 문장에서는 기원과 변화에 대해 설명합니다. 윤리는 세대 간 전승을 통해 자연스럽게 형성되지만, 법은 정부와 권력자의 결정에 의해 인위적으로 만들어지고 바뀔 수 있다는 점을 대조하며 설명하고 있어요.","hl":"f1"},{"n":6,"text":"세 번째 단계인 다섯 번째부터 일곱 번째 문장에서는 집행 방식의 차이를 다룹니다. 윤리는 우리가 주변 사람들에게서 자연스럽게 배우는 것이지만, 법은 정부라는 공식 권위가 강제성을 가지고 집행하기 때문에 사람들이 의무적으로 지키게 된다는 점을 짚어줍니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계인 여덟 번째와 아홉 번째 문장에서는 구체적인 예시와 결과를 보여줍니다. 허위 소문을 퍼뜨리는 것처럼 비윤리적이지만 불법은 아닌 사례를 들면서, 오직 법을 어겼을 때만 정부로부터 직접적인 처벌을 받게 된다는 결론으로 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 'Legal'과 'Ethical'이 다르다는 점을 명시한 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다. 이후 두 개념을 기원, 주체, \u003cb class=\"key\">집행 \u003c/b>\u003cb class=\"key\">방식\u003c/b>이라는 기준에 따라 \u003cb class=\"key\">대조(Contrast)\u003c/b>하며 논리를 전개합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Although (2)\u003c/b>\u003cspan>양보를 통한 대조 강조\u003c/span>\u003cb>Another important difference (5)\u003c/b>\u003cspan>추가적인 대조 포인트 도입\u003c/span>\u003cb>On the other hand (7)\u003c/b>\u003cspan>반대 사례 제시\u003c/span>\u003cb>However (9)\u003c/b>\u003cspan>강조 및 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Legal\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Ethical\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Society's ethics\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Laws\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Unethical actions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Illegal\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Ethics (윤리)\u003c/th>\u003cth>Laws (법)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>세대 간 전승됨\u003c/td>\u003ctd>정부에 의해 생성됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사회 전체의 믿음 기반\u003c/td>\u003ctd>권력자의 결정 기반\u003c/td>\u003c/tr>\u003ctr>\u003ctd>주변 사람들에게서 학습\u003c/td>\u003ctd>정부에 의해 집행됨\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 Legal과 Ethical이라는 두 핵심 개념을 나란히 놓고 비교하는 비교 대조의 전개 방식을 취하고 있습니다. 글의 가장 처음에 주제가 드러나는 전형적인 두괄식 구조를 가지고 있어서 독자가 글의 방향을 아주 쉽게 파악할 수 있도록 쓰였습니다.","hl":"ty"},{"n":9,"text":"문장 곳곳에 단서들이 숨어 있어요. 두 번째 문장의 Although는 양보를 통해 대조를 강조하고, 다섯 번째 문장의 Another important difference는 추가적인 차이점을 예고합니다. 일곱 번째 문장의 On the other hand와 마지막 문장의 However는 두 개념의 경계를 명확히 가르는 결정적인 신호어 역할을 하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>legal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>합법적인, 법률과 관련된\u003c/span>\u003c/div>\u003cdiv>\u003cb>ethical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>윤리적인, 도덕적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>similar\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비슷한\u003c/span>\u003c/div>\u003cdiv>\u003cb>not always\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>항상 ~인 것은 아닌 (부분 부정)\u003c/span>\u003c/div>\u003cdiv>\u003cb>society\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회\u003c/span>\u003c/div>\u003cdiv>\u003cb>pass down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전수하다, 물려주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>generation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세대\u003c/span>\u003c/div>\u003cdiv>\u003cb>government\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정부\u003c/span>\u003c/div>\u003cdiv>\u003cb>be based on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 근거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decision\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결정\u003c/span>\u003c/div>\u003cdiv>\u003cb>in power\u003c/b>\u003cem>형용사구\u003c/em>\u003cspan>권력이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>rather than\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~라기보다는\u003c/span>\u003c/div>\u003cdiv>\u003cb>belief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>믿음, 신념\u003c/span>\u003c/div>\u003cdiv>\u003cb>as a whole\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>전체로서의\u003c/span>\u003c/div>\u003cdiv>\u003cb>enforce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>집행하다, 강요하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>authority\u003c/b>\u003cem>명사\u003c/em>\u003cspan>권위, 권한, 당국\u003c/span>\u003c/div>\u003cdiv>\u003cb>simply\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그저, 단순히\u003c/span>\u003c/div>\u003cdiv>\u003cb>obey\u003c/b>\u003cem>동사\u003c/em>\u003cspan>복종하다, 따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unethical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비윤리적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>charge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(값을) 청구하다, 부과하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>false\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>허위의, 잘못된\u003c/span>\u003c/div>\u003cdiv>\u003cb>rumor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소문\u003c/span>\u003c/div>\u003cdiv>\u003cb>illegal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불법적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>break a law\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>법을 어기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>consequence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결과, 대가\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문에서 중요한 단어 몇 개만 살펴볼까요? 법을 집행한다는 뜻의 Enforce, 그리고 행동에 따르는 결과나 대가를 의미하는 Consequence라는 단어는 독해에서 아주 자주 나오니 꼭 기억해 두세요. 또한 세대를 뜻하는 Generation도 필수 어휘입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">legal\u003c/b>\u003cspan class=\"m\">합법적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lawful\u003c/span>\u003cspan class=\"s\">legitimate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">illegal\u003c/span>\u003cspan class=\"a\">illicit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ethical\u003c/b>\u003cspan class=\"m\">윤리적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">moral\u003c/span>\u003cspan class=\"s\">principled\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unethical\u003c/span>\u003cspan class=\"a\">immoral\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enforce\u003c/b>\u003cspan class=\"m\">집행하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">implement\u003c/span>\u003cspan class=\"s\">execute\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">obey\u003c/b>\u003cspan class=\"m\">따르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comply\u003c/span>\u003cspan class=\"s\">follow\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disobey\u003c/span>\u003cspan class=\"a\">defy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">false\u003c/b>\u003cspan class=\"m\">허위의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fake\u003c/span>\u003cspan class=\"s\">untrue\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">true\u003c/span>\u003cspan class=\"a\">genuine\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consequence\u003c/b>\u003cspan class=\"m\">결과\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">result\u003c/span>\u003cspan class=\"s\">outcome\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. Legal의 동의어로는 Lawful이 있고, 반의어는 Illegal입니다. Ethical은 Moral과 비슷하게 쓰이고 Unethical과는 반대되는 개념이죠. Obey는 Comply와 같은 의미로 쓰이며 따르다라는 뜻이고, 반대로 따르지 않을 때는 Disobey를 씁니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘합법적’과 ‘윤리적’은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">&quot;Legal&quot; \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">&quot;ethical&quot; \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 것이 아니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">are\u003c/span> not the same thing.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘합법적’과 ‘윤리적’은 같은 것이 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 도입부로, 흔히 혼동하기 쉬운 \u003cb class=\"key\">법\u003c/b>과 \u003cb class=\"key\">윤리\u003c/b>의 개념적 \u003cb class=\"key\">차이\u003c/b>를 명확히 선언하며 주제를 제시하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : [A and B (복수 주어)] + [are (복수 동사)] : \"‘합법적’인 것과 ‘윤리적’인 것은 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"\"Legal\" and \"ethical\", ‘합법적’과 ‘윤리적’은. are not the same thing, 같은 것이 아니다.. 이 문장 전체를 해석하면, ‘합법적’과 ‘윤리적’은 같은 것이 아니다.","hl":"m"},{"n":13,"text":"이 글의 첫 문장은 우리가 평소에 비슷하다고 느끼는 법과 윤리가 실제로는 서로 다른 개념이라는 점을 짚어주며 시작합니다. 앞으로 이 둘이 어떻게 다른지 구체적으로 설명하겠다는 신호를 주는 문장이죠.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 주어의 수 일치예요. Legal과 ethical이라는 두 가지 형용사적 명사가 and로 묶여서 복수 주어가 되었기 때문에, 동사 자리에 is가 아니라 are를 사용한 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비슷해 보이지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although\u003c/span> they seem similar,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘합법적’인 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">&quot;legal&quot;\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 ‘윤리적’이지는 않고,\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">always\u003c/span> &quot;ethical,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘윤리적’인 것이\u003c/span>\u003cspan class=\"en\">and what is &quot;ethical&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 ‘합법적’이지는 않다.\u003c/span>\u003cspan class=\"en\">is not always &quot;legal.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비슷해 보이지만, ‘합법적’인 것이 항상 ‘윤리적’이지는 않고, ‘윤리적’인 것이 항상 ‘합법적’이지는 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 법과 윤리의 관계를 \u003cb class=\"key\">부분 \u003c/b>\u003cb class=\"key\">부정\u003c/b>을 통해 설명하며, 두 영역이 서로 \u003cb class=\"key\">불일치\u003c/b>할 수 있다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사\u003c/span> : Although + [주어 + 동사], [주절] : \"~임에도 불구하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what이 이끄는 명사절\u003c/span> : what [주어 역할] + is [동사] : \"합법적인 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부분 부정\u003c/span> : not + always/every/both : \"항상 ~인 것은 아니다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Although they seem similar, 비슷해 보이지만. what is \"legal\", ‘합법적’인 것이. is not always \"ethical,\", 항상 ‘윤리적’이지는 않고. and what is \"ethical\", ‘윤리적’인 것이. is not always \"legal.\", 항상 ‘합법적’이지는 않다.. 이 문장 전체를 해석하면, 비슷해 보이지만, ‘합법적’인 것이 항상 ‘윤리적’이지는 않고, ‘윤리적’인 것이 항상 ‘합법적’이지는 않다.","hl":"m"},{"n":16,"text":"두 개념의 차이를 구체화하는 문장이에요. 합법과 윤리는 겹치는 부분도 있지만, 어느 한쪽이 다른 쪽을 완벽하게 포함하지 않는 예외적인 상황들이 존재한다는 의미입니다.","hl":"mn"},{"n":17,"text":"첫 번째로 양보 접속사 Although를 써서 대조의 느낌을 살렸고요. 두 번째로 관계대명사 what이 이끄는 명사절이 주어 자리에 쓰였습니다. 세 번째로 not always는 항상 그런 것은 아니라는 부분 부정을 나타내므로 해석할 때 반드시 주의해야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 사회의 윤리는\u003c/span>\u003cspan class=\"en\">A society's ethics\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전해진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">passed \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 세대에서 다른 세대로\u003c/span>\u003cspan class=\"en\">from one generation to the next,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">법이 ~인 반면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">while\u003c/span> laws\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정부에 의해 만들어지는\u003c/span>\u003cspan class=\"en\">are created by governments.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">법이 정부에 의해 만들어지는 반면, 한 사회의 윤리는 한 세대에서 다른 세대로 전해진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 윤리와 법의 \u003cb class=\"key\">발생 \u003c/b>\u003cb class=\"key\">기원\u003c/b>을 대조하고 있습니다. 윤리는 \u003cb class=\"key\">전통\u003c/b>의 산물인 반면, 법은 \u003cb class=\"key\">인위적\u003c/b>인 제도라는 차이를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 수동태\u003c/span> : be동사 (are) + 과거분사 (passed down) : \"전해지다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대조의 접속사\u003c/span> : [문장 A], while [문장 B] : \"~인 반면\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"A society's ethics, 한 사회의 윤리는. are passed down, 전해진다. from one generation to the next, 한 세대에서 다른 세대로. while laws, 법이 ~인 반면. are created by governments, 정부에 의해 만들어지는. 이 문장 전체를 해석하면, 법이 정부에 의해 만들어지는 반면, 한 사회의 윤리는 한 세대에서 다른 세대로 전해진다.","hl":"m"},{"n":19,"text":"윤리와 법이 어디서 왔는지를 비교하는 문장입니다. 윤리는 역사와 전통을 통해 자연스럽게 흐르는 것이라면, 법은 정부라는 특정 기관에 의해 의도적으로 만들어진다는 특징을 보여줍니다.","hl":"mn"},{"n":20,"text":"첫 번째로 are passed down을 보면, 윤리가 전해지는 수동적인 입장이기 때문에 수동태를 썼다는 점을 알 수 있어요. 두 번째로 while은 여기서 시간의 의미가 아니라 두 대상을 비교하는 대조의 접속사로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">법은 바뀔 수 있다\u003c/span>\u003cspan class=\"en\">Laws \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">changed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결정에 근거하여\u003c/span>\u003cspan class=\"en\">based on the decisions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">권력이 있는 사람들의\u003c/span>\u003cspan class=\"en\">of people in power,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿음에 의해서라기보다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than\u003c/span> by the beliefs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회 전체의\u003c/span>\u003cspan class=\"en\">of society as a whole.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">법은 사회 전체의 믿음에 의해서라기보다는 권력이 있는 사람들의 결정에 근거하여 바뀔 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 법이 지닌 \u003cb class=\"key\">가변성\u003c/b>과 \u003cb class=\"key\">인위성\u003c/b>을 설명하는 문장입니다. 사회 구성원 모두가 동의하는 가치보다 \u003cb class=\"key\">권력자\u003c/b>의 의도에 따라 법이 좌우될 수 있음을 지적합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 수동태\u003c/span> : can [조동사] + be changed [be+p.p.] : \"바뀔 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관 접속사(대조)\u003c/span> : A rather than B : \"~라기보다는\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Laws can be changed, 법은 바뀔 수 있다. based on the decisions, 결정에 근거하여. of people in power, 권력이 있는 사람들의. rather than by the beliefs, 믿음에 의해서라기보다는. of society as a whole, 사회 전체의. 이 문장 전체를 해석하면, 법은 사회 전체의 믿음에 의해서라기보다는 권력이 있는 사람들의 결정에 근거하여 바뀔 수 있다.","hl":"m"},{"n":22,"text":"법은 윤리와 달리 영구적이지 않고 사람에 의해 변할 수 있다는 가변성을 강조하고 있어요. 특히 사회 전체의 동의보다는 권력자의 의도라는 인위성에 의해 바뀔 수 있다는 점을 지적하는 내용입니다.","hl":"mn"},{"n":23,"text":"첫 번째로 can be changed는 조동사가 포함된 수동태 표현이에요. 주어인 법은 사람에 의해 바뀌는 수동적 대상이라서 이 형태를 썼죠. 두 번째로 rather than은 무엇이라기보다는 이라는 뜻의 비교 대조 표현으로, 권력자의 결정과 사회의 믿음을 대비시키고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 중요한 차이는\u003c/span>\u003cspan class=\"en\">Another important difference\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">윤리와 법 사이의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">ethics \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">laws\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 시행되는 방식이다.\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">enforced\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">윤리와 법 사이의 또 다른 중요한 차이는 그것들이 시행되는 방식이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 차이점 외에 \u003cb class=\"key\">강제성\u003c/b> 유무라는 새로운 기준을 도입합니다. 글의 논의 주제가 구체적인 \u003cb class=\"key\">시행 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 전환되는 지점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : between [전치사] + A and B : \"윤리와 법 사이의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문(명사절)\u003c/span> : 의문사(how) + 주어(they) + 동사(are enforced) : \"그것들이 어떻게 시행되는지\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Another important difference, 또 다른 중요한 차이는. between ethics and laws, 윤리와 법 사이의. is how they are enforced, 그것들이 시행되는 방식이다.. 이 문장 전체를 해석하면, 윤리와 법 사이의 또 다른 중요한 차이는 그것들이 시행되는 방식이다.","hl":"m"},{"n":25,"text":"이제 윤리와 법이 실제로 어떻게 사람들에게 지켜지게 만드는지, 즉 강제성이라는 시행 방식 측면에서의 차이점을 소개하고 있습니다.","hl":"mn"},{"n":26,"text":"첫 번째로 between ethics and laws는 전치사구로서 앞의 주어를 수식하여 두 대상 사이의 관계를 보여줍니다. 두 번째로 how they are enforced는 간접의문문 덩어리인데요, 의문사 다음에 주어와 동사의 어순이 온다는 것과 그것들이 시행되는 대상이므로 수동태를 쓴 점에 주목하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 권력은 없다\u003c/span>\u003cspan class=\"en\">There are no special authorities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 윤리를 따르도록 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">follow\u003c/span> ethics—\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">윤리는 그저 것이다\u003c/span>\u003cspan class=\"en\">they are simply \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 배우는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span> from\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 주변 사람들에게서\u003c/span>\u003cspan class=\"en\">the people around us.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 윤리를 따르도록 하는 특별한 권력은 없다. 윤리는 그저 우리가 주변 사람들에게서 배우는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 윤리가 \u003cb class=\"key\">자발성\u003c/b>에 기초하며, 외부의 강압이 아닌 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">학습\u003c/b>을 통해 내재화됨을 설명합니다. 법과 달리 물리적 \u003cb class=\"key\">처벌\u003c/b>이나 강제력이 없다는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사와 사역동사\u003c/span> : who [주격 관대] + make [사역동사] + us [목적어] + follow [원형부정사] : \"우리가 따르도록 만드는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : something + [that/which 생략] + 주어 + 동사 : \"우리가 배우는 무언가\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"There are no special authorities, 특별한 권력은 없다. who make us follow ethics—, 우리가 윤리를 따르도록 하는. they are simply something, 윤리는 그저 것이다. we learn from, 우리가 배우는. the people around us, 우리 주변 사람들에게서. 이 문장 전체를 해석하면, 우리가 윤리를 따르도록 하는 특별한 권력은 없다. 윤리는 그저 우리가 주변 사람들에게서 배우는 것이다.","hl":"m"},{"n":28,"text":"윤리는 누가 시켜서 억지로 지키는 것이 아니라, 주변 사람들과 어울리며 자연스럽게 배우는 사회적 학습과 자발성의 영역이라는 설명입니다. 법처럼 처벌을 주는 주체가 없다는 특징을 보여주죠.","hl":"mn"},{"n":29,"text":"첫 번째로 who make us follow 부분을 보세요. 주격 관계대명사 who가 권력자를 꾸며주고 있고, 사역동사 make는 목적어 다음에 동사원형 follow를 쓴다는 규칙이 적용되었습니다. 두 번째로 something we learn 사이에는 목적격 관계대명사가 생략되어 우리가 배우는 대상이 무엇인지 뒤에서 수식해주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">법은, \u003c/span>\u003cspan class=\"en\">Laws,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면에, \u003c/span>\u003cspan class=\"en\">on the other hand,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집행되므로, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">enforced\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정부에 의해 \u003c/span>\u003cspan class=\"en\">by the government,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 안다 \u003c/span>\u003cspan class=\"en\">so people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">know \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 지켜야 한다는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they\u003c/span> must obey them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반면에, 법은 정부에 의해 집행되므로, 사람들은 법을 지켜야 한다는 것을 안다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">윤리\u003c/b>와 대조적으로 \u003cb class=\"key\">법\u003c/b>은 강력한 \u003cb class=\"key\">강제성\u003c/b>을 가진다는 점을 강조합니다. 법을 집행하는 구체적인 주체로 \u003cb class=\"key\">정부\u003c/b>를 언급하며 그 영향력을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be + 과거분사(p.p.) : \"집행된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that의 생략\u003c/span> : know + (that) + 주어 + 동사 : \"그들이 ~라는 것을 안다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Laws, 법은. on the other hand, 반면에. are enforced, 집행되므로. by the government, 정부에 의해. so people know, 사람들은 안다. they must obey them, 그것들을 지켜야 한다는 것을.. 이 문장 전체를 해석하면, 반면에, 법은 정부에 의해 집행되므로, 사람들은 법을 지켜야 한다는 것을 안다.","hl":"m"},{"n":31,"text":"앞선 문장에서 윤리는 주변 사람들에게 배우는 것이라고 했죠? 이번 문장에서는 법이 윤리와 달리 정부라는 강력한 기관에 의해 강제되는 특징이 있다는 점을 강조하고 있어요.","hl":"mn"},{"n":32,"text":"첫 번째 포인트로 are enforced를 보세요. 주어인 법이 집행되는 대상이므로 수동태를 사용했습니다. 두 번째는 know와 they 사이인데요. 목적어 절을 이끄는 접속사 that이 생략된 형태라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 비윤리적인 행동들이 있다, \u003c/span>\u003cspan class=\"en\">There are many unethical actions,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물건 가격을 너무 높게 책정하거나 \u003c/span>\u003cspan class=\"en\">like \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">charging \u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">products \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">허위 소문을 퍼뜨리는 것과 같이, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">spreading \u003c/span>\u003cspan class=\"tgt\">false \u003c/span>\u003cspan class=\"tgt\">rumors\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불법적이진 않아도.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">illegal\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">물건 가격을 너무 높게 책정하거나 허위 소문을 퍼뜨리는 것과 같이, 불법적이진 않아도 많은 비윤리적인 행동들이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 윤리적이지는 않지만 \u003cb class=\"key\">법적 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>의 대상은 아닌 구체적인 \u003cb class=\"key\">사례\u003c/b>들을 제시합니다. \u003cb class=\"key\">윤리\u003c/b>와 \u003cb class=\"key\">법\u003c/b>의 영역이 항상 일치하지 않는다는 것을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사의 병렬 구조\u003c/span> : like + V-ing (A) or V-ing (B) : \"가격을 높게 책정하거나 소문을 퍼뜨리는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사 + that + V : \"불법적이진 않은\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"There are many unethical actions, 많은 비윤리적인 행동들이 있다. like charging too much for products, 물건 가격을 너무 높게 책정하거나. or spreading false rumors, 허위 소문을 퍼뜨리는 것과 같이. that are not illegal, 불법적이진 않아도.. 이 문장 전체를 해석하면, 물건 가격을 너무 높게 책정하거나 허위 소문을 퍼뜨리는 것과 같이, 불법적이진 않아도 많은 비윤리적인 행동들이 있다.","hl":"m"},{"n":34,"text":"이 문장은 비윤리적이지만 법으로 금지되지 않은 예시들을 보여줘요. 가격을 너무 높게 매기는 것이나 소문을 퍼뜨리는 것은 나쁘지만, 항상 감옥에 가는 법 위반은 아닐 수 있다는 거죠.","hl":"mn"},{"n":35,"text":"첫 번째 포인트는 전치사 like 뒤에 오는 동명사들입니다. charging과 spreading이 병렬 구조로 연결되어 예시들을 나열하고 있어요. 두 번째는 that are not illegal 부분인데요. 주격 관계대명사 that이 앞에 있는 여러 가지 행동들을 꾸며주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만, \u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 법을 어긴다면, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">break\u003c/span> a law,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 마주하게 될 것이다 \u003c/span>\u003cspan class=\"en\">you will face\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직접적인 결과를 \u003c/span>\u003cspan class=\"en\">direct \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">consequences\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정부로부터.\u003c/span>\u003cspan class=\"en\">from the government.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 당신이 법을 어긴다면, 당신은 정부로부터 직접적인 결과를 마주하게 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 법을 어겼을 때 따르는 \u003cb class=\"key\">직접적인 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>의 필연성을 강조하며 글을 맺습니다. 윤리와 달리 법은 공적인 \u003cb class=\"key\">책임\u003c/b>이 뒤따름을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 시제\u003c/span> : if + 주어 + 현재시제 : \"당신이 (법을) 어긴다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사\u003c/span> : direct + consequence (명사) : \"결과\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"However, 하지만. if you break a law, 당신이 법을 어긴다면. you will face, 당신은 마주하게 될 것이다. direct consequences, 직접적인 결과를. from the government, 정부로부터.. 이 문장 전체를 해석하면, 하지만 당신이 법을 어긴다면, 당신은 정부로부터 직접적인 결과를 마주하게 될 것이다.","hl":"m"},{"n":37,"text":"앞 문장에서는 비윤리적이어도 불법이 아닐 수 있다고 했지만, 이 문장에서는 법을 직접 어기면 정부로부터 즉각적이고 직접적인 처벌이 따른다는 경고를 하고 있어요.","hl":"mn"},{"n":38,"text":"첫 번째로 if 절을 주목하세요. 아직 법을 어기지 않은 미래의 상황을 가정하고 있지만, 조건의 부사절 규칙에 따라 will break가 아닌 현재형 break를 썼습니다. 두 번째 단어 consequence는 이 문맥에서 법을 어긴 뒤에 따르는 처벌이라는 의미를 내포하고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">합법\u003c/b>과 \u003cb class=\"key\">윤리\u003c/b>는 서로 다른 개념으로, 항상 일치하지 않습니다.\u003c/li>\u003cli>윤리는 \u003cb class=\"key\">전통\u003c/b>에 의해 형성되지만, 법은 \u003cb class=\"key\">정부\u003c/b>의 결정에 따라 만들어집니다.\u003c/li>\u003cli>윤리는 \u003cb class=\"key\">주변 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>에게서 배우지만, 법은 국가 권력에 의해 \u003cb class=\"key\">강제\u003c/b>됩니다.\u003c/li>\u003cli>비윤리적인 행동이 모두 \u003cb class=\"key\">불법\u003c/b>인 것은 아니며, 법 위반 시에만 직접적인 \u003cb class=\"key\">처벌\u003c/b>이 따릅니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Laws and ethics are distinct systems that differ in their origins, methods of change, and enforcement mechanisms.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">윤리\u003c/b>와 \u003cb class=\"key\">법\u003c/b>은 기원, 변화 방식, 집행 수단에서 차이가 있으며, 한쪽 영역에 속한다고 해서 반드시 다른 쪽에도 속하는 것은 아닙니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 우리는 법과 윤리가 왜 다른지, 그리고 그 차이가 어디서 오는지에 대해 깊이 있게 살펴보았습니다. 윤리는 우리 스스로 배우는 가치이고 법은 정부가 강제하는 규칙이라는 점, 이제 명확히 구분되시나요? 오늘 배운 대조 구조를 다른 지문에서도 적용해 보길 바라며, 다음 시간에 더 유익한 내용으로 만나요! 수고하셨습니다.","hl":null}]}]});</script></body></html>
