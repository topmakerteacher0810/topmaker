</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"01 문장의 머리를 찾아라","title":"빠른독해 바른독해 구문독해 해석기법03 적용독해06","audioDir":"03-06_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">해석기법03\u003cbr>적용독해06\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">빠른독해 바른독해 구문독해\u003c/div>\u003ch1>Artificial Reefs: Building New Life Underwater\u003c/h1>\u003ch2>인공 암초: 바닷속에 피어나는 새로운 생명\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>천연 산호초가 없는 해역에 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">암초\u003c/b>를 조성하여 해양 생태계를 복원하고, 이를 통해 \u003cb class=\"key\">인간과 \u003c/b>\u003cb class=\"key\">환경\u003c/b> 모두에게 다양한 이득을 제공하는 과정을 다룹니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Artificial reefs are constructed in areas without coral reefs to restore marine ecosystems and provide social and environmental benefits.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 바닷속의 신비로운 변화, 인공 암초에 대해 함께 공부해 볼 거예요. 이 지문은 산호초가 없는 바다를 어떻게 되살리는지, 그리고 그게 우리 인간에게 어떤 유익을 주는지 설명하고 있어요. 생태계 복원이라는 흥미로운 주제를 통해 영어 독해 실력을 키워봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">산호초는 전 세계 해양 생물의 약 25%가 살아가는 터전으로, '바다의 열대우림(\u003cb class=\"key\">Ocean's \u003c/b>\u003cb class=\"key\">Rainforests\u003c/b>)'이라는 별명을 가질 만큼 생태적 가치가 높습니다. 하지만 모든 해저 지형이 산호초를 형성하기에 적합한 것은 아니며, 기후 변화로 인해 기존 산호초가 파괴되기도 합니다. 이러한 문제를 해결하기 위해 인간은 인위적으로 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">암초(Artificial \u003c/b>\u003cb class=\"key\">Reefs)\u003c/b>를 만드는데, 이는 마치 황무지에 집을 짓는 것과 같습니다. 낡은 버스나 배가 바다에 들어가면 단순한 쓰레기가 아니라 생물들이 붙어 살 수 있는 \u003cb class=\"key\">기질(Substrate)\u003c/b> 역할을 하게 됩니다. 이 과정은 생태계의 \u003cb class=\"key\">선순환\u003c/b>을 유도하며, 인간에게는 풍부한 어장과 관광 자원이라는 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">혜택\u003c/b>을 동시에 안겨줍니다.\u003c/div>","segs":[{"n":2,"text":"산호초는 바다의 열대우림이라고 불릴 만큼 생물 다양성이 엄청난 곳이에요. 하지만 모든 바다에 산호초가 있는 건 아니죠. 그래서 인간은 인공 암초를 직접 만들기로 했답니다. 마치 텅 빈 바닷속에 물고기들을 위한 아파트를 지어주는 것과 비슷해요. 낡은 물체가 어떻게 생명의 요람이 되는지 그 과정을 상상해 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>산호초의 가치와 부재\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">열대우림\u003c/b>에 비유되는 산호초의 생태적 가치를 언급하며, 산호초가 \u003cb class=\"key\">부재\u003c/b>하는 지역의 상황을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>인공 암초의 도입\u003csmall>해결책 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>해양 환경 개선을 위한 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">암초\u003c/b>의 필요성과, 버스나 배 등 \u003cb class=\"key\">낡은 \u003c/b>\u003cb class=\"key\">물체\u003c/b>를 활용하는 설치 방식을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>작동 원리와 생태적 효과\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>암초의 \u003cb class=\"key\">단단한 \u003c/b>\u003cb class=\"key\">표면\u003c/b>이 조개와 산호의 부착을 돕고, 이것이 결국 물고기들에게 \u003cb class=\"key\">먹이와 \u003c/b>\u003cb class=\"key\">보금자리\u003c/b>를 제공하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>인간 사회에 주는 혜택\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>어민, 환경 운동가, 다이버 등 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">사회\u003c/b>의 다양한 구성원들이 인공 암초를 통해 얻는 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 나열하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 산호초의 가치부터 인공 암초의 설치 원리와 그 결과까지 네 단계로 차근차근 설명하고 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 산호초가 아주 많은 종의 서식지라 소중하지만, 불행히도 산호초가 없는 곳들이 있다는 점을 짚으며 글을 시작해요.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장은 해결책을 제시하죠. 산호초가 없는 곳에 환경을 개선하려고 인공 암초를 만드는데, 통학 버스나 배 같은 커다란 물건을 바다 밑바닥에 가라앉히는 방식이에요.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장은 원리 설명이에요. 구조물의 단단한 표면에 조개나 산호가 달라붙고, 이게 쌓이면서 결국 물고기들에게 풍부한 먹이와 쉴 곳을 만들어 주는 원리죠.","hl":"f2"},{"n":7,"text":"마지막 일곱 번째와 여덟 번째 문장에서는 인공 암초가 인간에게 주는 혜택을 나열해요. 어부들에게는 풍부한 어장을, 다이버들에게는 멋진 탐험 장소를 제공한다는 내용으로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">산호초가 없는 지역의 문제(2번)에 대해 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">암초\u003c/b>라는 해결책(3번)을 제시하는 구조입니다. 이후 해결책의 구체적인 \u003cb class=\"key\">작동 \u003c/b>\u003cb class=\"key\">방식\u003c/b>과 그로 인한 \u003cb class=\"key\">파급 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 순차적으로 나열하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (2)\u003c/b>\u003cspan>천연 산호초의 가치와 대비되는 부재 상황 제시\u003c/span>\u003cb>In addition (8)\u003c/b>\u003cspan>인간에게 주는 추가적인 이점 나열\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Coral reefs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Artificial reefs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these areas\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">large, old objects\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결의 구조를 가지고 있어요. 산호초가 없다는 문제를 인공 암초라는 해결책으로 극복하는 모습을 보여주죠. 중심 문장은 세 번째 문장으로, 인공 암초의 목적을 명확히 밝히는 중괄식 구성을 취하고 있습니다.","hl":"ty"},{"n":9,"text":"두 번째 문장의 However는 분위기를 반전시켜 산호초가 없는 상황을 강조해요. 그리고 여덟 번째 문장의 In addition은 환경 보호 활동가나 다이버 같은 추가적인 수혜자들을 나열하며 내용을 확장하는 역할을 하죠. Artificial reefs에서 they와 them으로 이어지는 대명사 연결도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>coral reef\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산호초\u003c/span>\u003c/div>\u003cdiv>\u003cb>rainforest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우림, 열대우림\u003c/span>\u003c/div>\u003cdiv>\u003cb>species\u003c/b>\u003cem>명사\u003c/em>\u003cspan>(생물) 종\u003c/span>\u003c/div>\u003cdiv>\u003cb>exist\u003c/b>\u003cem>동사\u003c/em>\u003cspan>존재하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>artificial reef\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인공 암초\u003c/span>\u003c/div>\u003cdiv>\u003cb>improve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>개선하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>marine environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해양 환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>numerous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다수의, 수많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>sea creature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해양 생물\u003c/span>\u003c/div>\u003cdiv>\u003cb>basically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>기본적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>involve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수반하다, 포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>object\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물체\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean floor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해저\u003c/span>\u003c/div>\u003cdiv>\u003cb>regardless of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 상관없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>shellfish\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조개류, 갑각류\u003c/span>\u003c/div>\u003cdiv>\u003cb>hard surface\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단단한 표면\u003c/span>\u003c/div>\u003cdiv>\u003cb>attach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>붙이다, 첨부하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>accumulation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>누적, 축적\u003c/span>\u003c/div>\u003cdiv>\u003cb>attract\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유인하다, 끌어들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shelter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보금자리, 피난처\u003c/span>\u003c/div>\u003cdiv>\u003cb>aside from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~외에도, ~을 제외하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>helpful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>도움이 되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>appreciated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가치를 인정받는\u003c/span>\u003c/div>\u003cdiv>\u003cb>coastal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>해안의\u003c/span>\u003c/div>\u003cdiv>\u003cb>resident\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주민\u003c/span>\u003c/div>\u003cdiv>\u003cb>fisherman\u003c/b>\u003cem>명사\u003c/em>\u003cspan>어부\u003c/span>\u003c/div>\u003cdiv>\u003cb>conservationist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경 보호 활동가\u003c/span>\u003c/div>\u003cdiv>\u003cb>habitat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>서식지\u003c/span>\u003c/div>\u003cdiv>\u003cb>restoration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>복구, 복원\u003c/span>\u003c/div>\u003cdiv>\u003cb>ecosystem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생태계\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어 몇 개만 살펴볼까요? rainforests는 우림이라는 뜻인데 여기서는 산호초를 비유하고 있어요. regardless of는 무엇무엇에 상관없이 라는 뜻으로 아주 자주 쓰이는 숙어니까 꼭 기억하세요. 그리고 accumulation은 누적이나 축적을 뜻하는 멋진 단어랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">numerous\u003c/b>\u003cspan class=\"m\">수많은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">many\u003c/span>\u003cspan class=\"s\">countless\u003c/span>\u003cspan class=\"s\">abundant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">few\u003c/span>\u003cspan class=\"a\">scarce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">attach\u003c/b>\u003cspan class=\"m\">부착하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fasten\u003c/span>\u003cspan class=\"s\">affix\u003c/span>\u003cspan class=\"s\">stick\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">detach\u003c/span>\u003cspan class=\"a\">separate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">shelter\u003c/b>\u003cspan class=\"m\">보금자리\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">refuge\u003c/span>\u003cspan class=\"s\">haven\u003c/span>\u003cspan class=\"s\">sanctuary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exposure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">restore\u003c/b>\u003cspan class=\"m\">복구하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recover\u003c/span>\u003cspan class=\"s\">renovate\u003c/span>\u003cspan class=\"s\">reinstate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">damage\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">diverse\u003c/b>\u003cspan class=\"m\">다양한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">various\u003c/span>\u003cspan class=\"s\">varied\u003c/span>\u003cspan class=\"s\">manifold\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uniform\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어 공부도 해볼까요? numerous는 수많은이라는 뜻으로 many나 countless로 바꿔 쓸 수 있어요. attach는 붙이다라는 뜻인데 반대말은 떼어내다라는 뜻의 detach입니다. 그리고 restore는 복구하다라는 의미로 생태계 관련 지문에서 자주 등장하는 핵심 어휘예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산호초는\u003c/span>\u003cspan class=\"en\">Coral reefs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때때로 불리는데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">sometimes \u003c/span>\u003cspan class=\"tgt\">called\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다의 우림이라고\u003c/span>\u003cspan class=\"en\">the ocean's rainforests,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 서식지이기 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as\u003c/span> they are home\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 많은 (생물) 종의\u003c/span>\u003cspan class=\"en\">to so many species.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">산호초는 때때로 바다의 우림이라고 불리는데, 그것이 아주 많은 (생물) 종의 서식지이기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 산호초의 엄청난 생물 다양성을 \u003cb class=\"key\">열대우림\u003c/b>에 비유하여 그 중요성을 강조하고 있습니다. 뒤의 절은 왜 그런 비유가 쓰였는지에 대한 \u003cb class=\"key\">이유\u003c/b>를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + 과거분사(p.p.) : \"불린다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 (이유)\u003c/span> : as + 주어 + 동사 : \"~이기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Coral reefs, 산호초는. are sometimes called, 때때로 불리는데. the ocean's rainforests, 바다의 우림이라고. as they are home, 그것이 서식지이기 때문이다. to so many species, 아주 많은 (생물) 종의. 이 문장 전체를 해석하면, 산호초는 때때로 바다의 우림이라고 불리는데, 그것이 아주 많은 (생물) 종의 서식지이기 때문이다.","hl":"m"},{"n":13,"text":"산호초가 얼마나 많은 생명체의 보금자리인지 보여주기 위해 바다의 열대우림이라는 멋진 비유를 썼어요. 풍부한 생태계를 가진 산호초의 가치를 설명하는 도입부입니다.","hl":"mn"},{"n":14,"text":"첫 번째로 are called 부분을 보면 주어인 산호초가 불리는 대상임을 나타내는 수동태가 쓰였어요. 두 번째로 접속사 as는 여기에서 ~이기 때문이라는 이유의 의미로 사용되었습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곳들도 있다\u003c/span>\u003cspan class=\"en\">there are places\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산호초가 없는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">where\u003c/span> no coral reefs exist.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 산호초가 없는 곳들도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 긍정적인 가치와 대조되는 \u003cb class=\"key\">현실적인 \u003c/b>\u003cb class=\"key\">한계\u003c/b>를 제시하며 글의 방향을 전환합니다. 자연 산호초가 존재하지 않는 \u003cb class=\"key\">지역\u003c/b>이 있음을 언급하여 다음 문장의 해결책을 이끌어냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사\u003c/span> : 선행사(장소) + where + 완전한 문장 : \"~하는 (곳)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"However, 하지만. there are places, 곳들도 있다. where no coral reefs exist, 산호초가 없는. 이 문장 전체를 해석하면, 하지만, 산호초가 없는 곳들도 있다.","hl":"m"},{"n":16,"text":"앞에서 산호초의 중요성을 말했지만 모든 곳에 산호초가 있는 건 아니라는 예외 상황을 보여주고 있어요. 이 문장은 자연적으로 산호초가 부족한 지역이 있다는 점을 짚어줍니다.","hl":"mn"},{"n":17,"text":"여기서 where는 관계부사로 쓰였어요. 앞에 나온 장소인 places를 꾸며주면서 뒤에 산호초가 존재하지 않는다는 완전한 문장을 이끌고 있지요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인공 암초가\u003c/span>\u003cspan class=\"en\">Artificial reefs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때때로 만들어진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">sometimes \u003c/span>\u003cspan class=\"tgt\">built\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 지역들에\u003c/span>\u003cspan class=\"en\">in these areas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해양 환경을 개선하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">improve\u003c/span> the marine environment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 해양 생물들을 위한\u003c/span>\u003cspan class=\"en\">for numerous sea creatures.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 해양 생물들을 위한 해양 환경을 개선하기 위해 때때로 이런 지역들에 인공 암초가 만들어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 산호초가 없는 곳에 생태계를 조성하려는 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">암초\u003c/b>의 도입 목적을 설명합니다. 인간이 개입하여 \u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">환경\u003c/b>을 인위적으로 개선하려는 노력을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + 과거분사(p.p.) : \"만들어진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + 동사원형 : \"개선하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Artificial reefs, 인공 암초가. are sometimes built, 때때로 만들어진다. in these areas, 이런 지역들에. to improve the marine environment, 해양 환경을 개선하기 위해. for numerous sea creatures, 많은 해양 생물들을 위한. 이 문장 전체를 해석하면, 많은 해양 생물들을 위한 해양 환경을 개선하기 위해 때때로 이런 지역들에 인공 암초가 만들어진다.","hl":"m"},{"n":19,"text":"자연 산호초가 없는 곳에 사람들이 직접 구조물을 설치한다는 내용이에요. 바로 수많은 해양 생물들이 살 수 있는 환경을 만들어 주려는 목적 때문이죠.","hl":"mn"},{"n":20,"text":"첫 번째 포인트로 are built는 암초가 만들어진다는 의미의 수동태 표현이에요. 두 번째로 to improve는 해양 환경을 개선하기 위해라는 목적을 나타내는 to부정사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 기본적으로 수반한다\u003c/span>\u003cspan class=\"en\">This basically \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">involves \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크고 낡은 물체들을 놓아두는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">placing\u003c/span> large, old objects,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통학 버스나 배와 같이\u003c/span>\u003cspan class=\"en\">such as school buses and ships,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해저에\u003c/span>\u003cspan class=\"en\">on the ocean floor.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 기본적으로 통학 버스나 배와 같이 크고 낡은 물체들을 해저에 놓아두는 것을 수반한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인공 암초를 만드는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 설명하는 문장입니다. 버스나 배 같은 \u003cb class=\"key\">대형 \u003c/b>\u003cb class=\"key\">폐기물\u003c/b>이 해양 생물의 서식지가 될 수 있음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : involve [동사] + placing [동명사/목적어] : \"놓아두는 것을 수반한다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"This basically involves, 이것은 기본적으로 수반한다. placing large, old objects, 크고 낡은 물체들을 놓아두는 것을. such as school buses and ships, 통학 버스나 배와 같이. on the ocean floor, 해저에. 이 문장 전체를 해석하면, 이것은 기본적으로 통학 버스나 배와 같이 크고 낡은 물체들을 해저에 놓아두는 것을 수반한다.","hl":"m"},{"n":22,"text":"이 문장은 인공 암초를 만드는 구체적인 방법을 설명해 줍니다. 학교 버스나 배 같은 대형 폐기물들이 바다 밑바닥에서 인공 암초 역할을 한다는 점이 핵심이죠.","hl":"mn"},{"n":23,"text":"동사 involves 뒤에는 동명사가 목적으로 와야 해요. 그래서 placing이라는 동명사 형태가 쓰였고, 이 단어가 전체 문장의 목적어 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상관없이\u003c/span>\u003cspan class=\"en\">Regardless of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 무엇으로 만들어졌는지에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인공 암초는 기능한다\u003c/span>\u003cspan class=\"en\">artificial reefs work\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조개류와 산호들에게 제공함으로써\u003c/span>\u003cspan class=\"en\">by giving shellfish and corals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단단한 표면을\u003c/span>\u003cspan class=\"en\">hard surfaces\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 몸체를 붙일 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">attach \u003c/span>\u003cspan class=\"tgt\">themselves \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들이 무엇으로 만들어졌는지에 상관없이, 인공 암초는 조개류와 산호들에게 자신들의 몸체를 붙일 수 있는 단단한 표면을 제공함으로써 기능한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인공 암초가 작동하는 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">원리\u003c/b>를 설명합니다. 생물들이 몸을 고정할 수 있는 \u003cb class=\"key\">부착 \u003c/b>\u003cb class=\"key\">표면\u003c/b>을 제공하는 것이 핵심 역할입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사절)\u003c/span> : 의문사(what) + 주어(they) + 동사(are made from) : \"무엇으로 만들어졌는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사(surfaces) + to부정사(to attach themselves to) : \"자신들을 붙일 (표면)\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Regardless of, 상관없이. what they are made from, 그것들이 무엇으로 만들어졌는지에. artificial reefs work, 인공 암초는 기능한다. by giving shellfish and corals, 조개류와 산호들에게 제공함으로써. hard surfaces, 단단한 표면을. to attach themselves to, 자신들의 몸체를 붙일 수 있는. 이 문장 전체를 해석하면, 그것들이 무엇으로 만들어졌는지에 상관없이, 인공 암초는 조개류와 산호들에게 자신들의 몸체를 붙일 수 있는 단단한 표면을 제공함으로써 기능한다.","hl":"m"},{"n":25,"text":"인공 암초가 어떤 원리로 작동하는지 보여주는 문장이에요. 재료가 무엇이든 상관없이 생물들이 몸을 고정하고 살 수 있는 부착 표면을 만들어주는 게 가장 중요하죠.","hl":"mn"},{"n":26,"text":"첫 번째로 Regardless of 뒤에 나오는 what they are made from을 볼게요. 무엇으로 만들어졌는지를 뜻하는 간접의문문으로 전치사의 목적어 역할을 하고 있어요. 두 번째 포인트는 to attach themselves to입니다. 앞에 있는 명사 surfaces를 꾸며주는 형용사적 용법으로 쓰였고, 전치사 to가 빠지지 않게 주의해야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 생물들의 누적은\u003c/span>\u003cspan class=\"en\">The accumulation of these creatures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 물고기들을 암초로 유인하고\u003c/span>\u003cspan class=\"en\">then attracts fish to the reef\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게 제공한다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">provides \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹이와 보금자리를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">food\u003c/span> and shelter.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러고 나서 이러한 생물들의 누적은 물고기들을 암초로 유인하고 그들에게 먹이와 보금자리를 제공한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인공 암초로 인해 발생하는 생태계의 \u003cb class=\"key\">연쇄 \u003c/b>\u003cb class=\"key\">반응\u003c/b>을 설명합니다. 작은 생물들이 모이면서 더 큰 물고기들이 살 수 있는 \u003cb class=\"key\">서식지 \u003c/b>\u003cb class=\"key\">환경\u003c/b>이 조성됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">provide A with B 구문\u003c/span> : provide + 대상(them) + with + 제공물(food) : \"그들에게 먹이를 제공한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">주어-동사 수 일치 및 병렬 구조\u003c/span> : 단수 주어(accumulation) + 동사1(attracts) + and + 동사2(provides) : \"유인하고 제공한다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The accumulation of these creatures, 이러한 생물들의 누적은. then attracts fish to the reef, 그러고 나서 물고기들을 암초로 유인하고. and provides them, 그들에게 제공한다. with food and shelter, 먹이와 보금자리를. 이 문장 전체를 해석하면, 그러고 나서 이러한 생물들의 누적은 물고기들을 암초로 유인하고 그들에게 먹이와 보금자리를 제공한다.","hl":"m"},{"n":28,"text":"앞에서 말한 조개와 산호가 많아지면 어떤 일이 생길까요? 바로 물고기들이 모여들게 되고, 그 물고기들에게 먹을 것과 쉴 곳이 생기면서 생태계가 풍성해진다는 내용이에요.","hl":"mn"},{"n":29,"text":"첫 번째로 주어인 accumulation이 단수라서 attracts와 provides에 모두 s가 붙은 병렬 구조라는 점을 기억하세요. 두 번째로 provide A with B 표현이 쓰였는데, 물고기들을 뜻하는 them 뒤에 전치사 with를 써서 제공하는 물건인 먹이와 보금자리를 연결했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도움이 되는 것 외에도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Aside \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">being\u003c/span> helpful\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해양 생물에\u003c/span>\u003cspan class=\"en\">to marine life,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인공 암초는 또한 가치를 인정받는다\u003c/span>\u003cspan class=\"en\">artificial reefs \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">appreciated\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해안 주민들에게\u003c/span>\u003cspan class=\"en\">by coastal residents,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어부를 포함하여\u003c/span>\u003cspan class=\"en\">including fishermen.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">해양 생물에 도움이 되는 것 외에도, 인공 암초는 어부를 포함하여 해안 주민들에게도 가치를 인정받는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인공 암초가 자연 생태계뿐만 아니라 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">공동체\u003c/b>에게도 유익한 존재임을 설명합니다. 특히 경제적, 실질적 이익을 얻는 \u003cb class=\"key\">해안 \u003c/b>\u003cb class=\"key\">거주민\u003c/b>들의 긍정적인 반응을 강조하는 흐름입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사의 목적어로 쓰인 동명사\u003c/span> : Aside from [전치사] + being [동명사] : \"~인 것 외에도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be [be동사] + appreciated [과거분사] : \"가치를 인정받는다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Aside from being helpful, 도움이 되는 것 외에도. to marine life, 해양 생물에. artificial reefs are also appreciated, 인공 암초는 또한 가치를 인정받는다. by coastal residents, 해안 주민들에게. including fishermen, 어부를 포함하여. 이 문장 전체를 해석하면, 해양 생물에 도움이 되는 것 외에도, 인공 암초는 어부를 포함하여 해안 주민들에게도 가치를 인정받는다.","hl":"m"},{"n":31,"text":"일곱 번째 문장에서는 인공 암초가 해양 생태계에 도움을 줄 뿐만 아니라 우리 인간 공동체에도 큰 혜택을 준다는 점을 강조하고 있어요. 특히 어부처럼 바다와 함께 살아가는 해안 거주민들에게 그 가치를 인정받고 있다는 점이 핵심이죠.","hl":"mn"},{"n":32,"text":"중요한 어법을 살펴볼까요? 첫 번째로 Aside from이라는 전치사 뒤에 being이라는 동명사가 와서 첨가의 의미를 전달하고 있어요. 두 번째로 주어인 인공 암초가 사람들에 의해 평가받는 대상이기 때문에 are appreciated라는 수동태를 썼다는 점도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한\u003c/span>\u003cspan class=\"en\">In addition,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경 보호 활동가들은 그것들을 이용하며\u003c/span>\u003cspan class=\"en\">conservationists use them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서식지 복구에\u003c/span>\u003cspan class=\"en\">for habitat restoration,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스쿠버 다이버들은 즐긴다\u003c/span>\u003cspan class=\"en\">and scuba divers \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">enjoy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 다양한 생태계를 탐험하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">exploring\u003c/span> these diverse ecosystems.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한, 환경 보호 활동가들은 그것들을 서식지 복구에 이용하며, 스쿠버 다이버들은 이 다양한 생태계를 탐험하는 것을 즐긴다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인공 암초를 활용하는 구체적인 주체들을 나열하며 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">활용도\u003c/b>를 보여줍니다. \u003cb class=\"key\">서식지 \u003c/b>\u003cb class=\"key\">복구\u003c/b>라는 환경적 목적과 탐험이라는 레저 목적이 공존하는 모습을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : enjoy [타동사] + exploring [동명사/목적어] : \"탐험하는 것을 즐긴다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"In addition, 또한. conservationists use them, 환경 보호 활동가들은 그것들을 이용하며. for habitat restoration, 서식지 복구에. and scuba divers enjoy, 스쿠버 다이버들은 즐긴다. exploring these diverse ecosystems, 이 다양한 생태계를 탐험하는 것을. 이 문장 전체를 해석하면, 또한, 환경 보호 활동가들은 그것들을 서식지 복구에 이용하며, 스쿠버 다이버들은 이 다양한 생태계를 탐험하는 것을 즐긴다.","hl":"m"},{"n":34,"text":"여덟 번째 문장은 인공 암초의 또 다른 긍정적인 역할들을 나열하며 글을 마무리하고 있네요. 환경 보호 활동가들에게는 서식지 복구의 수단이 되고, 스쿠버 다이버들에게는 아름다운 탐험의 장소가 된다는 구체적인 사례를 들고 있습니다.","hl":"mn"},{"n":35,"text":"여기서 어법 포인트 하나만 짚어볼게요. 문장 뒷부분에 enjoy exploring이 보이죠? 동사 enjoy는 목적어 자리에 반드시 동명사 형태만 써야 하는 특징이 있어요. 그래서 탐험한다는 뜻의 explore 뒤에 ing를 붙인 동명사 형태가 온 것이랍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">천연 \u003c/b>\u003cb class=\"key\">산호초\u003c/b>가 부족한 지역의 해양 환경을 개선하기 위해 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">암초\u003c/b>를 설치합니다.\u003c/li>\u003cli>낡은 버스나 배 같은 대형 물체들이 해저에서 생물들이 붙어 살 수 있는 \u003cb class=\"key\">단단한 \u003c/b>\u003cb class=\"key\">표면\u003c/b>을 제공합니다.\u003c/li>\u003cli>이러한 구조물에 조개와 산호가 쌓이면서 물고기들에게 \u003cb class=\"key\">먹이와 \u003c/b>\u003cb class=\"key\">보금자리\u003c/b>를 주는 생태계가 형성됩니다.\u003c/li>\u003cli>환경 복원뿐만 아니라 어민, 환경 보호가, 스쿠버 다이버 등 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">사회\u003c/b>에도 큰 가치를 제공합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Artificial reefs are constructed in areas without coral reefs to restore marine ecosystems and provide social and environmental benefits.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">천연 산호초가 없는 해역에 \u003cb class=\"key\">인공 \u003c/b>\u003cb class=\"key\">암초\u003c/b>를 조성하여 해양 생태계를 복원하고, 이를 통해 \u003cb class=\"key\">인간과 \u003c/b>\u003cb class=\"key\">환경\u003c/b> 모두에게 다양한 이득을 제공하는 과정을 다룹니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"자, 오늘 우리는 인공 암초가 어떻게 바다를 풍요롭게 만드는지 배웠습니다. 낡은 물건이 생명의 터전이 된다는 점이 참 감동적이죠? 오늘 배운 주요 구문들과 어휘들을 다시 한번 복습하면서 여러분의 실력으로 만드시길 바랍니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
