</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"01 문장의 머리를 찾아라","title":"빠른독해 바른독해 구문독해 해석기법04 적용독해08","audioDir":"04-08_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">해석기법04\u003cbr>적용독해08\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">빠른독해 바른독해 구문독해\u003c/div>\u003ch1>Why Ambiguity Actually Improves Communication\u003c/h1>\u003ch2>모호함이 실제로는 의사소통을 개선하는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>흔히 모호함이 의사소통의 장애물이라 생각하지만, 사실 \u003cb class=\"key\">맥락\u003c/b> 속에서 짧고 간단한 단어를 사용하게 함으로써 화자의 \u003cb class=\"key\">효율성\u003c/b>과 청자의 \u003cb class=\"key\">이해\u003c/b>라는 두 목적을 모두 충족한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Ambiguity contributes to efficient communication by allowing the use of simple words that are easily interpreted within a specific context.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 우리가 보통 의사소통의 적으로 생각하는 ambiguity, 즉 모호함에 대해 완전히 새로운 시각을 보여주는 지문을 배워볼 거예요. 대부분의 사람들은 모호함이 소통을 방해한다고 믿지만, 사실은 그 덕분에 우리가 더 효율적으로 대화할 수 있다는 것이 이번 글의 핵심 요지입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">언어학에서는 화자가 최소한의 노력으로 최대한의 정보를 전달하려는 '경제성의 원리'가 중요하게 다뤄집니다. 이를 위해 언어는 상황에 따라 여러 의미를 가질 수 있는 \u003cb class=\"key\">다의어(polysemy)\u003c/b>를 발달시켰습니다. 마치 친구들 사이의 \u003cb class=\"key\">줄임말\u003c/b>이 외부인에게는 모호하지만 당사자들에게는 매우 빠르고 효율적인 의사소통 수단이 되는 것과 비슷하죠. 의사소통의 \u003cb class=\"key\">효율성(efficiency)\u003c/b>은 단순히 단어의 정확한 사전적 정의보다는 주변의 \u003cb class=\"key\">맥락(context)\u003c/b>을 얼마나 잘 활용하느냐에 달려 있습니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 앞서 배경지식을 좀 쌓아볼까요? 언어에는 경제성의 원리라는 게 있어요. 말하는 사람은 최대한 적은 에너지를 써서 많은 정보를 전하고 싶어 하죠. 이걸 가능하게 하는 게 바로 context, 즉 맥락입니다. 마치 우리가 친구와 있을 때 '그거 가져와'라고만 해도 무엇인지 바로 아는 것처럼, 다의어의 모호함을 맥락이 해결해 주는 거죠. 이런 효율성이 바로 오늘 지문의 핵심 키워드인 efficiency와 연결됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>통념과 반박\u003csmall>통념-반박 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>의사소통에서 \u003cb class=\"key\">모호함\u003c/b>이 가장 큰 문제라는 일반적인 생각에 대해, 한 연구팀이 \u003cb class=\"key\">반대 \u003c/b>\u003cb class=\"key\">의견\u003c/b>을 제시하며 글을 시작함.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>연구팀의 주장\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>모호함이 오히려 \u003cb class=\"key\">맥락\u003c/b>을 통한 짧고 단순한 단어의 사용을 가능하게 하여 소통에 도움을 주며, 이는 \u003cb class=\"key\">소통의 \u003c/b>\u003cb class=\"key\">본질\u003c/b> 때문임.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>화자와 청자의 목적\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>최소한의 단어로 정보를 전달하려는 화자와 정확히 이해하려는 청자의 목적은 \u003cb class=\"key\">길고 \u003c/b>\u003cb class=\"key\">복잡한\u003c/b> 방식으로는 달성되기 어려움.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>최종 결론\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>화자가 쉬운 \u003cb class=\"key\">다의어\u003c/b>를 쓰고 청자가 주제에 근거해 \u003cb class=\"key\">의미를 \u003c/b>\u003cb class=\"key\">추론\u003c/b>하는 것이 가장 타당하고 효율적인 방식임.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 일반적인 생각인 통념을 먼저 보여준 뒤, 그것을 뒤집는 연구 결과를 소개하며 논리적으로 전개됩니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 도입부답게 통념과 반박이 나타납니다. 보통 사람들은 communication에서 모호함이 가장 큰 문제라고 말하지만, 한 연구팀은 however를 사용해서 그 의견에 disagree, 즉 동의하지 않는다고 명확히 밝히고 있어요.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장이 이 글의 핵심 주장입니다. 모호함이 실제로는 짧고 단순한 단어를 쓰게 해 줌으로써 소통을 돕는다고 claim하고 있죠. 그 단어들의 의미가 context 안에서 충분히 이해될 수 있기 때문이라는 nature of communication, 즉 소통의 본질을 언급합니다.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장은 그 이유를 더 자세히 설명합니다. 화자는 가능한 한 적은 단어를 쓰려 하고, 청자는 정확히 이해하려고 하죠. 만약 long and complicated하게 설명해야 한다면, 이 두 가지 목적은 neither, 즉 어느 쪽도 달성되지 못한다는 점을 짚어줍니다.","hl":"f2"},{"n":7,"text":"마지막 일곱 번째 문장은 결론을 내립니다. 화자가 여러 의미를 가진 easy words를 사용하고, 청자가 대화의 topic에 근거해서 그 의미를 figure out 하는 것이 가장 합리적이고 make sense 하다는 내용으로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 모호함이 문제라는 \u003cb class=\"key\">통념\u003c/b>을 제시한 뒤, 두 번째 문장에서 이를 \u003cb class=\"key\">반박\u003c/b>하며 등장합니다. 세 번째 문장이 글의 핵심 \u003cb class=\"key\">주제문\u003c/b>으로, 모호함의 긍정적 기능을 구체적으로 밝히고 있습니다. 마지막 문장은 앞선 근거들을 바탕으로 화자와 청자의 바람직한 \u003cb class=\"key\">역할 \u003c/b>\u003cb class=\"key\">분담\u003c/b>을 정리하며 마무리됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>however (2)\u003c/b>\u003cspan>통념을 뒤집는 역접의 연결어\u003c/span>\u003cb>They claim that (3)\u003c/b>\u003cspan>연구자들의 핵심 주장 도입\u003c/span>\u003cb>because of (4)\u003c/b>\u003cspan>이유와 근거 제시\u003c/span>\u003cb>while (5)\u003c/b>\u003cspan>화자와 청자의 목적 대조\u003c/span>\u003cb>It therefore makes sense (7)\u003c/b>\u003cspan>최종 결론 유도\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">ambiguity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">short, simple words\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these ambiguous words\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">easy words with multiple meanings\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Ambiguous/Short words\u003c/th>\u003cth>Long and complicated way\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Efficiency met\u003c/td>\u003ctd>Goals not met\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Context-dependent\u003c/td>\u003ctd>Explicitly detailed\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 지문의 구조는 전형적인 통념-반박 구조입니다. 처음에 모호함이 나쁘다는 통념을 던지고, 두 번째 문장의 however로 이를 뒤집은 뒤 세 번째 문장에서 주제를 던지는 중괄식 패턴을 보이고 있어요.","hl":"ty"},{"n":9,"text":"글의 흐름을 잡아주는 신호어들을 잘 보세요. 두 번째 문장의 however는 반전의 신호이고, 일곱 번째 문장의 therefore는 최종 결론을 알리는 장치입니다. 또한 ambiguity가 short, simple words로, 다시 easy words with multiple meanings로 재진술되는 과정을 따라가는 것이 중요합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>communication\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의사소통\u003c/span>\u003c/div>\u003cdiv>\u003cb>ambiguity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모호함\u003c/span>\u003c/div>\u003cdiv>\u003cb>disagree\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의견이 다르다, 반대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>claim\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>사실상, 실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>allow A to V\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A가 ~하게 해 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>simple\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>간단한\u003c/span>\u003c/div>\u003cdiv>\u003cb>whose\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>그것의 (소유격 관계대명사)\u003c/span>\u003c/div>\u003cdiv>\u003cb>context\u003c/b>\u003cem>명사\u003c/em>\u003cspan>맥락, 전후 사정\u003c/span>\u003c/div>\u003cdiv>\u003cb>nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>본질, 특성\u003c/span>\u003c/div>\u003cdiv>\u003cb>goal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목적, 목표\u003c/span>\u003c/div>\u003cdiv>\u003cb>speaker\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화자, 말하는 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>deliver\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as ... as possible\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가능한 한 ~하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>listener\u003c/b>\u003cem>명사\u003c/em>\u003cspan>청자, 듣는 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>accurately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정확하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>complicated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>복잡한\u003c/span>\u003c/div>\u003cdiv>\u003cb>neither\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>둘 다 ~아닌\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(목표 등을) 충족시키다, 달성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make sense\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>타당하다, 말이 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>multiple\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다수의, 복합적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>figure out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이해하다, 파악하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>intended\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의도된\u003c/span>\u003c/div>\u003cdiv>\u003cb>based on\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에 근거하여\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어를 몇 개 볼까요? ambiguity는 모호함이라는 뜻으로 이 글의 주인공입니다. context는 맥락인데, 이 단어 덕분에 모호함이 해결되는 거예요. 그리고 complicated는 복잡한이라는 뜻으로 효율성을 떨어뜨리는 상황을 설명할 때 쓰였습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">ambiguity\u003c/b>\u003cspan class=\"m\">모호함\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">vagueness\u003c/span>\u003cspan class=\"s\">obscurity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clarity\u003c/span>\u003cspan class=\"a\">precision\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">complicated\u003c/b>\u003cspan class=\"m\">복잡한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">complex\u003c/span>\u003cspan class=\"s\">intricate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003cspan class=\"a\">straightforward\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disagree\u003c/b>\u003cspan class=\"m\">반대하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">object\u003c/span>\u003cspan class=\"s\">differ\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">agree\u003c/span>\u003cspan class=\"a\">concur\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accurately\u003c/b>\u003cspan class=\"m\">정확하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">precisely\u003c/span>\u003cspan class=\"s\">correctly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inaccurately\u003c/span>\u003cspan class=\"a\">falsely\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">intended\u003c/b>\u003cspan class=\"m\">의도된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deliberate\u003c/span>\u003cspan class=\"s\">planned\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unintentional\u003c/span>\u003cspan class=\"a\">accidental\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 보아요. ambiguity의 동의어로는 vagueness가 있고, 반의어는 명확함인 clarity입니다. complicated의 반의어는 simple이라는 것도 꼭 기억하세요. intended는 의도된이라는 뜻인데, deliberate와 비슷한 의미로 시험에 자주 나옵니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔히들 말한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사소통에서 가장 큰 문제가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> the biggest problem in communication\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모호함이라고.\u003c/span>\u003cspan class=\"en\">is ambiguity.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">의사소통에서 가장 큰 문제가 모호함이라고들 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의사소통의 가장 큰 장애물은 의미가 불분명한 \u003cb class=\"key\">모호함\u003c/b>이라는 일반적인 \u003cb class=\"key\">통념\u003c/b>을 제시하며 글을 시작하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It과 진주어 접속사 that\u003c/span> : It [가주어] + has been said + that [진주어 접속사] + 주어 + 동사 : \"~라고들 말해져 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 수동태\u003c/span> : has been [현재완료] + said [과거분사/수동태] : \"말해져 왔다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"It has been said, 흔히들 말한다. that the biggest problem in communication, 의사소통에서 가장 큰 문제가. is ambiguity, 모호함이라고.. 이 문장 전체를 해석하면, 의사소통에서 가장 큰 문제가 모호함이라고들 한다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 의사소통을 방해하는 주범이 바로 모호함이라는 일반적인 통념을 소개하고 있어요. 사람들은 보통 뜻이 분명하지 않으면 대화가 어렵다고 생각하죠.","hl":"mn"},{"n":14,"text":"여기서 It은 아무런 뜻이 없는 가주어이고 진짜 주어는 that부터 문장 끝까지예요. 또한 말해져 왔다는 의미를 전달하기 위해 현재완료와 수동태를 합친 has been said 형식을 사용했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 연구팀은,\u003c/span>\u003cspan class=\"en\">A group of researchers,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의견이 다르다.\u003c/span>\u003cspan class=\"en\">disagrees.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 한 연구팀은 의견이 다르다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 일반적인 통념에 대해 \u003cb class=\"key\">반전\u003c/b>을 주는 문장으로, \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">결과\u003c/b>는 다를 수 있음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">역접의 연결어\u003c/span> : 주어, however, 동사 : \"하지만 / 그러나\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"A group of researchers, 한 연구팀은. however, 하지만. disagrees, 의견이 다르다.. 이 문장 전체를 해석하면, 하지만, 한 연구팀은 의견이 다르다.","hl":"m"},{"n":16,"text":"두 번째 문장에서는 분위기가 확 바뀌죠. 앞선 사람들의 생각과는 달리 연구원들은 모호함이 나쁜 게 아니라고 말하려 합니다.","hl":"mn"},{"n":17,"text":"문장 중간에 콤마와 함께 들어간 however는 하지만이라는 뜻으로 앞뒤 맥락을 뒤집어주는 역할을 해요. 주어인 A group of researchers가 단수 취급되어 동사에 s가 붙은 것도 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 ~라고 주장한다\u003c/span>\u003cspan class=\"en\">They claim that\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모호함이 사실상 우리가 의사소통하는 데 도움을 준다고\u003c/span>\u003cspan class=\"en\">ambiguity actually \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">helps \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">communicate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 짧고 간단한 단어들을 사용하게 해 줌으로써\u003c/span>\u003cspan class=\"en\">by \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">allowing \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> short, simple words\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맥락 속에서 뜻이 이해될 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">whose \u003c/span>\u003cspan class=\"tgt\">meanings\u003c/span> can be understood in context.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 모호함이 우리로 하여금 맥락 속에서 뜻이 이해될 수 있는 짧고 간단한 단어들을 사용하게 해 줌으로써 사실상 우리가 의사소통하는 데 도움을 준다고 주장한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모호함이 오히려 짧고 쉬운 단어 사용을 가능하게 하여 \u003cb class=\"key\">의사소통의 \u003c/b>\u003cb class=\"key\">효율성\u003c/b>을 높여준다는 이 글의 \u003cb class=\"key\">주제문\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">준사역동사 help\u003c/span> : help [준사역동사] + us [목적어] + communicate [목적격 보어(원형부정사)] : \"우리가 의사소통하는 것을 돕다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">allow + 목적어 + to부정사\u003c/span> : allow [타동사] + us [목적어] + to use [목적격 보어(to부정사)] : \"우리가 사용하도록 허용함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">소유격 관계대명사\u003c/span> : words [선행사] + whose [소유격 관계대명사] + meanings [명사] : \"그 단어들의 의미가\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They claim that, 그들은 ~라고 주장한다. ambiguity actually helps us communicate, 모호함이 사실상 우리가 의사소통하는 데 도움을 준다고. by allowing us to use short, simple words, 우리가 짧고 간단한 단어들을 사용하게 해 줌으로써. whose meanings can be understood in context, 맥락 속에서 뜻이 이해될 수 있는. 이 문장 전체를 해석하면, 그들은 모호함이 우리로 하여금 맥락 속에서 뜻이 이해될 수 있는 짧고 간단한 단어들을 사용하게 해 줌으로써 사실상 우리가 의사소통하는 데 도움을 준다고 주장한다.","hl":"m"},{"n":19,"text":"세 번째 문장은 이 글의 핵심이에요. 모호한 단어라도 맥락만 있으면 짧고 쉬운 표현으로 의사소통을 더 편하게 해준다는 놀라운 주장입니다.","hl":"mn"},{"n":20,"text":"첫 번째로 help 뒤에 목적격 보어로 원형부정사 communicate가 쓰인 걸 확인하세요. 두 번째로 allow는 목적격 보어로 반드시 to use처럼 to부정사를 씁니다. 마지막으로 단어의 의미라는 소유 관계를 나타내기 위해 소유격 관계대명사 whose가 사용되었습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 모호한 단어들은\u003c/span>\u003cspan class=\"en\">These ambiguous words\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도움이 된다\u003c/span>\u003cspan class=\"en\">are helpful\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사소통의 본질\u003c/span>\u003cspan class=\"en\">the nature of communication.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 모호한 단어들은 의사소통의 본질 때문에 도움이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모호함이 의사소통의 장애물이 아니라, 오히려 효율적인 소통을 가능하게 하는 \u003cb class=\"key\">의사소통의 \u003c/b>\u003cb class=\"key\">본질\u003c/b>과 깊게 연관되어 있다는 점을 강조합니다. 즉, \u003cb class=\"key\">언어의 \u003c/b>\u003cb class=\"key\">경제성\u003c/b> 측면에서 모호한 단어가 긍정적인 역할을 수행함을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 (이유)\u003c/span> : because of + [명사/명사구] : \"~때문에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"These ambiguous words, 이 모호한 단어들은. are helpful, 도움이 된다. because of, ~때문에. the nature of communication, 의사소통의 본질. 이 문장 전체를 해석하면, 이 모호한 단어들은 의사소통의 본질 때문에 도움이 된다.","hl":"m"},{"n":22,"text":"일반적으로 모호함은 나쁜 것이라고 생각하기 쉽지만, 이 문장에서는 의사소통의 본질 덕분에 이런 단어들이 오히려 도움이 된다고 말하고 있어요. 모호함이 소통을 돕는 긍정적인 도구가 될 수 있다는 내용이죠.","hl":"mn"},{"n":23,"text":"중요한 어법 포인트는 because of예요. 뒤에 the nature라는 명사구가 왔기 때문에 전치사가 필요하죠. 만약 뒤에 문장이 왔다면 of를 뺀 접속사 because를 써야 하니 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화자의 목적은 ~이다\u003c/span>\u003cspan class=\"en\">The goal of a speaker is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전달하려고 노력하는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">deliver\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능한 한 많은 정보를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">information \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">possible\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능한 한 적은 단어를 사용해서\u003c/span>\u003cspan class=\"en\">using as few words as possible,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청자의 목적은 ~인 반면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">while\u003c/span> the goal of a listener is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화자의 메시지를 정확히 이해하는 것\u003c/span>\u003cspan class=\"en\">to accurately understand the speaker's message.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">청자의 목적은 화자의 메시지를 정확히 이해하는 것인 반면, 화자의 목적은 가능한 한 적은 단어를 사용해서 가능한 한 많은 정보를 전달하려고 노력하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의사소통의 양측인 화자와 청자가 각각 추구하는 \u003cb class=\"key\">목적의 \u003c/b>\u003cb class=\"key\">차이\u003c/b>를 설명합니다. 화자는 적은 노력으로 많은 정보를 주려는 \u003cb class=\"key\">효율성\u003c/b>을, 청자는 정확한 파악을 목표로 한다는 것을 \u003cb class=\"key\">대조\u003c/b>합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (보어)\u003c/span> : be동사 + [to-v (보어)] : \"전달하려고 노력하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">as ~ as possible 구문\u003c/span> : as + [형용사/부사] + as possible : \"가능한 한 많은 정보\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 (대조)\u003c/span> : [문장], while [대조되는 문장] : \"~인 반면\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The goal of a speaker is, 화자의 목적은 ~이다. to try to deliver, 전달하려고 노력하는 것. as much information as possible, 가능한 한 많은 정보를. using as few words as possible, 가능한 한 적은 단어를 사용해서. while the goal of a listener is, 청자의 목적은 ~인 반면. to accurately understand the speaker's message, 화자의 메시지를 정확히 이해하는 것. 이 문장 전체를 해석하면, 청자의 목적은 화자의 메시지를 정확히 이해하는 것인 반면, 화자의 목적은 가능한 한 적은 단어를 사용해서 가능한 한 많은 정보를 전달하려고 노력하는 것이다.","hl":"m"},{"n":25,"text":"화자는 가성비를 따지듯 적은 단어로 많이 말하고 싶어 하고, 청자는 그걸 정확히 알아듣고 싶어 한다는 내용이에요. 말하는 사람과 듣는 사람의 입장을 대조해서 보여주는 아주 중요한 문장입니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 to try와 to understand예요. 주어인 goal을 설명하는 보어로 쓰인 명사적 용법이죠. 두 번째는 as much information as possible인데, information이 셀 수 없는 명사라 much를 썼어요. 세 번째로 while은 여기서 반면이라는 뜻의 대조를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 화자가 무언가를 설명해야 할 때\u003c/span>\u003cspan class=\"en\">When a speaker has to explain something\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">길고 복잡한 방식으로\u003c/span>\u003cspan class=\"en\">in a long and complicated way,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 두 목적 모두\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">neither \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">goals\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달성되지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">met\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 화자가 길고 복잡한 방식으로 무언가를 설명해야 하면, 이 두 목적 모두 달성되지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자가 모호하고 단순한 단어 대신 길고 복잡한 방식을 택하면, 화자의 \u003cb class=\"key\">효율성\u003c/b>도 청자의 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">이해\u003c/b>도 모두 실패하게 된다는 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 서술합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양자 부정\u003c/span> : neither of + [복수 명사] : \"이 두 목적 중 어느 것도 ~않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be + [과거분사(p.p.)] : \"달성된다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"When a speaker has to explain something, 어떤 화자가 무언가를 설명해야 할 때. in a long and complicated way, 길고 복잡한 방식으로. neither of these goals, 이 두 목적 모두. is met, 달성되지 않는다. 이 문장 전체를 해석하면, 어떤 화자가 길고 복잡한 방식으로 무언가를 설명해야 하면, 이 두 목적 모두 달성되지 않는다.","hl":"m"},{"n":28,"text":"단순하게 말하지 않고 구구절절 길고 복잡하게 말하면 어떻게 될까요? 화자의 효율성도, 청자의 이해도라는 두 마리 토끼를 다 놓치게 된다는 뜻이에요.","hl":"mn"},{"n":29,"text":"첫 번째로 neither of these goals를 봐주세요. neither는 둘 다 아니다라는 부정의 의미를 담고 있어서 뒤에 is met과 합쳐져 달성되지 않는다라고 해석해야 해요. 두 번째로 is met은 수동태예요. 목표는 달성되는 것이니까 meet의 과거분사인 met을 쓴 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서 ~하는 것이 타격하다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> therefore makes sense\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화자가 '쉬운' 단어들을 사용하는 것이 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">speakers\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> &quot;easy&quot; words\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다의어를 (여러 의미를 가진) \u003c/span>\u003cspan class=\"en\">with multiple meanings,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 청자가 이해하는 것이 \u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">listeners \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">figure \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들의 뜻하는 의미를 \u003c/span>\u003cspan class=\"en\">their intended meaning\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대화의 주제에 근거하여.\u003c/span>\u003cspan class=\"en\">based on the topic of the conversation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서, 화자가 ‘쉬운’ 다의어를 사용하고 청자는 대화의 주제에 근거하여 뜻하는 의미를 이해하는 것이 타당하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모호함이 의사소통에 방해가 되는 것이 아니라 오히려 도움이 된다는 앞선 주장의 \u003cb class=\"key\">결론\u003c/b>을 도출합니다. 화자와 청자가 각각 노력을 분담하여 효율적으로 \u003cb class=\"key\">의사소통\u003c/b>하는 방식을 요약하며 마무리하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어\u003c/span> : It [가주어] + makes sense [동사/보어] + for ~ to ... [진주어] : \"그것은 (해석하지 않음)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어\u003c/span> : for + 목적격 [의미상 주어] + to use [to부정사] : \"화자가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(진주어)\u003c/span> : to + use [동사원형] : \"사용하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">의미상 주어와 to부정사의 병렬\u003c/span> : and + for + 목적격 + to + 동사원형 : \"청자가 이해하는 것\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"It therefore makes sense, 따라서 ~하는 것이 타격하다. for speakers to use \"easy\" words, 화자가 '쉬운' 단어들을 사용하는 것이. with multiple meanings, 다의어를 (여러 의미를 가진). and for listeners to figure out, 그리고 청자가 이해하는 것이. their intended meaning, 그것들의 뜻하는 의미를. based on the topic of the conversation, 대화의 주제에 근거하여.. 이 문장 전체를 해석하면, 따라서, 화자가 ‘쉬운’ 다의어를 사용하고 청자는 대화의 주제에 근거하여 뜻하는 의미를 이해하는 것이 타당하다.","hl":"m"},{"n":31,"text":"이 문장은 모호함이 소통을 방해하는 게 아니라 오히려 효율적이라는 앞선 내용의 결론을 내리고 있어요. 화자는 짧고 쉬운 단어를 써서 에너지를 아끼고 청자는 맥락을 통해 의미를 파악하는 효율적인 의사소통 방식을 설명하며 글을 마무리하죠.","hl":"mn"},{"n":32,"text":"첫 번째로 문장 맨 앞의 It은 가주어입니다. 해석은 하지 않고 문장 뒤쪽의 진짜 주어를 찾아야 해요. 두 번째로 for speakers는 뒤에 나오는 to use의 의미상 주어입니다. 단어를 사용하는 주체가 화자라는 것을 보여주죠. 세 번째로 to use는 이 문장의 진짜 주어인 진주어입니다. 마지막으로 for listeners to figure out 부분은 앞의 구조와 대등하게 연결된 두 번째 병렬 구조입니다. 청자가 이해하는 것이 타당하다는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>통념과 달리 \u003cb class=\"key\">모호함\u003c/b>은 의사소통을 방해하는 요소가 아니라 오히려 돕는 역할을 수행함.\u003c/li>\u003cli>모호한 단어는 \u003cb class=\"key\">맥락\u003c/b>을 활용하여 의미를 전달하므로 화자가 짧고 단순한 표현을 쓸 수 있게 함.\u003c/li>\u003cli>화자의 \u003cb class=\"key\">경제성\u003c/b>과 청자의 \u003cb class=\"key\">정확성\u003c/b>이라는 두 가지 소통 목적은 길고 복잡한 설명으로는 달성하기 어려움.\u003c/li>\u003cli>따라서 화자가 \u003cb class=\"key\">다의어\u003c/b>를 사용하고 청자가 상황에 맞게 \u003cb class=\"key\">추론\u003c/b>하는 것이 가장 효율적인 소통 방식임.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Ambiguity contributes to efficient communication by allowing the use of simple words that are easily interpreted within a specific context.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">흔히 모호함이 의사소통의 장애물이라 생각하지만, 사실 \u003cb class=\"key\">맥락\u003c/b> 속에서 짧고 간단한 단어를 사용하게 함으로써 화자의 \u003cb class=\"key\">효율성\u003c/b>과 청자의 \u003cb class=\"key\">이해\u003c/b>라는 두 목적을 모두 충족한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"자, 오늘 지문을 통해 모호함이 우리 소통을 얼마나 효율적으로 만드는지 이해하셨나요? 결국 언어는 화자와 청자가 맥락을 공유하며 함께 완성해가는 과정이라는 점을 잊지 마세요. 오늘 배운 구문들과 어휘들 다시 한번 복습하면서 마무리하겠습니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
