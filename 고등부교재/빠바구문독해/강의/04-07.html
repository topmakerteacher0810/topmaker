</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=encodeURI(cands()[bi])+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"01 문장의 머리를 찾아라","title":"빠른독해 바른독해 구문독해 해석기법04 적용독해07","audioDir":"04-07_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.553em\">해석기법04\u003cbr>적용독해07\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">빠른독해 바른독해 구문독해\u003c/div>\u003ch1>From Black Boxes to Transparency: The Future of AI Security and Copyright\u003c/h1>\u003ch2>AI 블랙박스에서 투명성으로: AI 보안과 저작권의 미래\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>폐쇄적인 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">블랙박스\u003c/b>는 저작권 침해와 보안 취약점이라는 문제를 야기하므로, 보안 강화와 저작권 보호를 위해 알고리즘의 \u003cb class=\"key\">투명성\u003c/b>을 높여야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Greater transparency in AI systems is essential for protecting copyrights and improving security against hacking.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 인공지능 기술의 이면에 숨겨진 보안과 저작권 문제를 다룬 아주 흥미로운 지문을 공부해 볼 거예요. 우리가 흔히 사용하는 AI가 사실은 그 내부를 알 수 없는 AI black boxes, 즉 블랙박스 상태라는 점을 지적하며 시작하죠. 이번 시간에는 왜 AI 알고리즘의 transparency, 즉 투명성을 높이는 것이 저작권 보호와 해킹 방지라는 두 마리 토끼를 잡는 해결책이 되는지 함께 알아볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">AI 블랙박스(AI black box)는 인공지능이 결과를 도출하는 과정이 외부로 드러나지 않는 \u003cb class=\"key\">불투명\u003c/b>한 상태를 뜻합니다. 비유하자면 자판기 안에서 어떤 로봇이 어떻게 음료를 섞는지 전혀 모르는 채 결과물만 받는 것과 같습니다. 초기 AI 개발자들은 \u003cb class=\"key\">해킹 \u003c/b>\u003cb class=\"key\">방지\u003c/b>를 위해 내부 구조를 철저히 숨겼으나, 이는 오히려 문제 해결을 어렵게 만들었습니다. 최근에는 AI가 저작권이 있는 데이터를 무단 사용하는 \u003cb class=\"key\">저작권 \u003c/b>\u003cb class=\"key\">침해\u003c/b> 이슈가 대두되면서 알고리즘 공개의 필요성이 커졌습니다. 전문가들은 보안을 위해 오히려 \u003cb class=\"key\">오픈 \u003c/b>\u003cb class=\"key\">소스\u003c/b>처럼 내부를 공개하여 약점을 빨리 보완하는 것이 효과적이라고 주장합니다.\u003c/div>","segs":[{"n":2,"text":"인공지능 블랙박스라는 개념이 조금 낯설 수 있는데요. 마치 자판기 안에서 어떤 로봇이 음료를 어떻게 조합하는지 모른 채 우리는 결과물만 받는 상황을 상상해 보세요. 초기 AI 개발자들은 해커들이 내부 구조를 알면 공격하기 쉬울까 봐 보안을 위해 정보를 철저히 숨겼습니다. 하지만 이런 폐쇄적인 구조 때문에 AI가 저작권이 있는 남의 데이터를 몰래 쓰는지 알 길이 없게 되었고, 오히려 보안 취약점을 찾는 것도 더 어려워졌죠. 그래서 요즘은 전문가들이 내부를 검토할 수 있게 공개하는 방식이 더 주목받고 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>AI 블랙박스의 특징\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>인공지능 시스템 중 일부는 내부 작동 방식이 숨겨진 \u003cb class=\"key\">블랙박스\u003c/b> 형태이며, 사용자는 결과만 볼 뿐 \u003cb class=\"key\">알고리즘\u003c/b>에 접근할 수 없습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>블랙박스의 부작용\u003csmall>문제 제기 · 문장 3\u003c/small>\u003c/h4>\u003cp>내부를 알 수 없기에 결과 도출 과정을 파악하기 어렵고, \u003cb class=\"key\">저작권\u003c/b>이 있는 정보의 무단 사용 가능성이 존재합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>알고리즘 공개의 이점\u003csmall>해결책 제시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>알고리즘을 공개하면 \u003cb class=\"key\">저작권 \u003c/b>\u003cb class=\"key\">허가\u003c/b>를 받기 수월해지며, 이는 제작자와 사용자 모두를 \u003cb class=\"key\">보호\u003c/b>하는 길이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>기존 전략의 실패\u003csmall>반박 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>원래 해킹을 막으려고 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">작동\u003c/b>을 숨겼지만, 이러한 은폐 전략은 실제로는 \u003cb class=\"key\">효과적\u003c/b>이지 않았습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>투명성 강화의 필요성\u003csmall>최종 주장 · 문장 8\u003c/small>\u003c/h4>\u003cp>오히려 시스템의 \u003cb class=\"key\">투명성\u003c/b>을 높여 전문가들이 \u003cb class=\"key\">잠재적 \u003c/b>\u003cb class=\"key\">약점\u003c/b>을 찾아내게 하는 것이 보안에 더 효과적입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 AI 블랙박스의 문제점부터 시작해서 왜 투명성이 중요한지로 이어지는 논리적인 흐름을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 AI 블랙박스의 특징을 설명합니다. 사용자는 정보를 넣고 결과는 받지만, 정작 그 핵심인 algorithm, 즉 알고리즘에는 접근할 수 없다는 점을 짚어주고 있네요.","hl":"f0"},{"n":5,"text":"세 번째 문장은 그래서 생기는 문제점을 제기합니다. 결과가 어떻게 만들어졌는지 정확히 알 수 없다 보니, AI가 혹시 copyrighted information, 즉 저작권이 있는 정보를 몰래 쓰고 있는 건 아닌지 우려가 생기는 거죠.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장은 이에 대한 해결책을 제시합니다. 알고리즘에 접근이 가능해지면 저작권 허가를 받기도 쉬워지고, 결국 창작자와 사용자 모두를 보호할 수 있다는 논리예요.","hl":"f2"},{"n":7,"text":"여섯 번째와 일곱 번째 문장은 과거의 통념을 반박합니다. 원래는 해킹을 막으려고 내부 작동 원리를 숨겼지만, 이 전략이 사실은 잘 통하지 않았다는 점을 솔직하게 밝히고 있죠.","hl":"f3"},{"n":8,"text":"마지막 여덟 번째 문장은 결론이자 필자의 강력한 주장입니다. 해킹을 막으려면 오히려 transparency, 즉 투명성을 높여서 전문가들이 약점을 쉽게 찾아내게 하는 것이 더 효과적이라는 대안을 제시하며 마무리합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">초반부에서 AI 블랙박스로 인한 \u003cb class=\"key\">저작권 \u003c/b>\u003cb class=\"key\">문제\u003c/b>를 제기하고, 기존의 폐쇄적 보안 전략이 실패했음을 밝힙니다. 마지막 문장에서 해킹 방지와 보안 강화를 위해 \u003cb class=\"key\">투명성\u003c/b>을 높여야 한다는 구체적인 \u003cb class=\"key\">해결책\u003c/b>을 제시하며 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Therefore (3)\u003c/b>\u003cspan>인과관계 유도\u003c/span>\u003cb>When (4)\u003c/b>\u003cspan>조건 및 해결의 시점\u003c/span>\u003cb>Originally (6)\u003c/b>\u003cspan>과거의 관점 소개\u003c/span>\u003cb>But (7)\u003c/b>\u003cspan>역접 및 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">AI black boxes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">secretive internal operations\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">algorithm\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">inner workings\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">greater transparency\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>AI 블랙박스 (폐쇄)\u003c/th>\u003cth>투명한 AI (공개)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>알고리즘 접근 불가\u003c/td>\u003ctd>알고리즘 접근 가능\u003c/td>\u003c/tr>\u003ctr>\u003ctd>저작권 침해 우려\u003c/td>\u003ctd>저작권 허가 용이\u003c/td>\u003c/tr>\u003ctr>\u003ctd>해킹 방지 실패\u003c/td>\u003ctd>전문가의 약점 보완 가능\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전체적인 전개 방식은 문제 해결 구조를 따르고 있어요. 글의 도입부에서 AI 블랙박스의 폐쇄성 때문에 발생하는 저작권 문제를 언급한 뒤, 마지막에 투명성 강화라는 해결책을 강조하고 있죠. 주제문이 가장 마지막 문장에 위치한 미괄식 구성이라고 볼 수 있습니다.","hl":"ty"},{"n":10,"text":"글의 흐름을 보여주는 신호어들을 잘 보세요. 세 번째 문장의 Therefore는 앞서 말한 폐쇄성 때문에 생기는 결과를 보여줍니다. 그리고 일곱 번째 문장의 But은 과거의 은폐 전략이 실패했다는 전환점을 만들어주죠. 또한 AI black boxes라는 표현이 뒤에서 secretive internal operations나 inner workings로 재진술되다가 마지막에 greater transparency와 대조를 이루는 점도 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>referred to as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~라고 불리는\u003c/span>\u003c/div>\u003cdiv>\u003cb>secretive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비밀스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>internal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>내부의\u003c/span>\u003c/div>\u003cdiv>\u003cb>operation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작동, 운영\u003c/span>\u003c/div>\u003cdiv>\u003cb>input\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입력하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>receive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>access\u003c/b>\u003cem>동사\u003c/em>\u003cspan>접근하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>algorithm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>알고리즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>determine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아내다, 결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>exactly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정확히\u003c/span>\u003c/div>\u003cdiv>\u003cb>generate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>copyrighted\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>저작권이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>accessible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>접근 가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>obtain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얻다, 획득하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>proper\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>적절한\u003c/span>\u003c/div>\u003cdiv>\u003cb>permission\u003c/b>\u003cem>명사\u003c/em>\u003cspan>허가\u003c/span>\u003c/div>\u003cdiv>\u003cb>address\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다루다, 해결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>concern\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우려, 관심사\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>original creator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원작자\u003c/span>\u003c/div>\u003cdiv>\u003cb>inner workings\u003c/b>\u003cem>명사\u003c/em>\u003cspan>내부 작동 원리\u003c/span>\u003c/div>\u003cdiv>\u003cb>strategy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전략\u003c/span>\u003c/div>\u003cdiv>\u003cb>prevent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방지하다, 예방하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>effective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효과적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>transparency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>투명성\u003c/span>\u003c/div>\u003cdiv>\u003cb>examine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>검사하다, 점검하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>identify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾아내다, 확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>potential\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잠재적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>weakness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>약점\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어 몇 개만 짚어볼까요? secretive는 비밀스러운이라는 뜻으로 블랙박스의 특징을 잘 보여줍니다. address라는 단어는 여기선 주소가 아니라 문제를 다루다 혹은 해결하다라는 뜻으로 쓰였으니 꼭 기억해 두세요. 마지막으로 transparency는 투명성이라는 뜻으로 이 글의 핵심 키워드입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">secretive\u003c/b>\u003cspan class=\"m\">비밀스러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hidden\u003c/span>\u003cspan class=\"s\">concealed\u003c/span>\u003cspan class=\"s\">private\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">open\u003c/span>\u003cspan class=\"a\">transparent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">obtain\u003c/b>\u003cspan class=\"m\">얻다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"s\">gain\u003c/span>\u003cspan class=\"s\">get\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">forfeit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">address\u003c/b>\u003cspan class=\"m\">다루다, 해결하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">handle\u003c/span>\u003cspan class=\"s\">tackle\u003c/span>\u003cspan class=\"s\">deal with\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">effective\u003c/b>\u003cspan class=\"m\">효과적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">efficient\u003c/span>\u003cspan class=\"s\">productive\u003c/span>\u003cspan class=\"s\">useful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003cspan class=\"a\">ineffective\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">transparency\u003c/b>\u003cspan class=\"m\">투명성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">openness\u003c/span>\u003cspan class=\"s\">clarity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">opacity\u003c/span>\u003cspan class=\"a\">ambiguity\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. secretive는 hidden이나 concealed와 비슷한 의미지만, 반대로 공개된 상태인 open이나 transparent와는 반대됩니다. 무언가를 얻다라는 뜻의 obtain은 acquire나 gain으로 바꿔 쓸 수 있고요. 효과적이라는 뜻의 effective는 효율적이라는 efficient와 결을 같이 하지만, 쓸모없다는 뜻의 useless와는 반대말 관계가 됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일부 AI 시스템은,\u003c/span>\u003cspan class=\"en\">Some AI systems,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 AI 블랙박스라고 불리는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">referred \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> AI black boxes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내부 작동이 비밀스럽다.\u003c/span>\u003cspan class=\"en\">have secretive internal operations.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">종종 AI 블랙박스라고 불리는 일부 AI 시스템은 내부 작동이 비밀스럽다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인공지능의 내부 작동 방식이 공개되지 않는 상황을 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">블랙박스\u003c/b>라는 용어로 정의하며, 시스템의 \u003cb class=\"key\">폐쇄성\u003c/b>을 소개하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : [명사] + [p.p. (과거분사구)] : \"종종 ~라고 불리는\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Some AI systems, 일부 AI 시스템은. often referred to as AI black boxes, 종종 AI 블랙박스라고 불리는. have secretive internal operations, 내부 작동이 비밀스럽다.. 이 문장 전체를 해석하면, 종종 AI 블랙박스라고 불리는 일부 AI 시스템은 내부 작동이 비밀스럽다.","hl":"m"},{"n":14,"text":"이 문장은 인공지능이 결과를 내는 과정이 밖에서 보이지 않는다는 특징을 AI 블랙박스라는 용어를 사용해 설명하고 있어요. 인공지능의 내부 작동 방식이 가진 폐쇄성을 강조하는 도입부입니다.","hl":"mn"},{"n":15,"text":"첫 번째 포인트는 often referred to as 부분입니다. 명사인 ts, 결과값을 받을 수 있지만. but they cannot access, 그들은 접근할 수는 없다. the system's algorithm, 시스템의 알고리즘에.. 이 문장 전체를 해석하면, 사용자는 정보를 입력하고 결과값을 받을 수 있지만, 시스템의 알고리즘에 접근할 수는 없다.","hl":"m"},{"n":17,"text":"사용자가 겉으로는 AI를 잘 활용하는 것처럼 보여도, 실제로 그 안에서 어떤 일이 벌어지는지 즉 알고리즘에는 접근할 수 없다는 한계를 지적하고 있습니다.","hl":"mn"},{"n":18,"text":"첫 번째로 볼 부분은 조동사 can 뒤에 연결된 input과 receive입니다. 두 동사가 병렬 구조를 이루고 있어서 조동사의 영향을 같이 받고 있죠. 두 번째로 access는 우리말로 해석할 때 어디어디에 접근하다라고 해서 전치사를 쓰기 쉽지만, 뒤에 목적어를 바로 쓰는 타동사라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서 그들은 정확히 알아낼 수 없으며,\u003c/span>\u003cspan class=\"en\">Therefore, they cannot determine exactly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 결과값이 어떻게 생성되었는지,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">results \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">generated\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동시에 AI가 사용하고 있을 수도 있다\u003c/span>\u003cspan class=\"en\">while the AI could be using\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저작권이 있는 정보를.\u003c/span>\u003cspan class=\"en\">copyrighted information.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 그들은 그 결과값이 어떻게 생성되었는지 정확히 알아낼 수 없으며, 동시에 AI가 저작권이 있는 정보를 사용하고 있을 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 결과 도출 과정이 불투명하여 발생하는 \u003cb class=\"key\">저작권 \u003c/b>\u003cb class=\"key\">침해\u003c/b> 가능성과 관리의 \u003cb class=\"key\">어려움\u003c/b>을 언급합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\ \u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">콘텐츠의 원작자와\u003c/span>\u003cspan class=\"en\">both the original creators of the content\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI 사용자 모두를.\u003c/span>\u003cspan class=\"en\">and the AI users.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 콘텐츠의 원작자와 AI 사용자 모두를 보호한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급한 알고리즘의 \u003cb class=\"key\">접근 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>이 가져오는 긍정적인 효과로, \u003cb class=\"key\">원작자\u003c/b>와 \u003cb class=\"key\">사용자\u003c/b> 모두의 권리를 보장함을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">상관접속사 both A and B\u003c/span> : both [A (명사구)] + and [B (명사구)] : \"원작자와 사용자 모두\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"This protects, 이는 보호한다. both the original creators of the content, 콘텐츠의 원작자와. and the AI users, AI 사용자 모두를.. 이 문장 전체를 해석하면, 이는 콘텐츠의 원작자와 AI 사용자 모두를 보호한다.","hl":"m"},{"n":26,"text":"알고리즘의 접근 가능성이 가져오는 긍정적인 효과를 설명하고 있어요. 원작자와 사용자 모두의 권리를 보장한다는 점이 핵심이죠.","hl":"mn"},{"n":27,"text":"여기서는 both A and B라는 상관접속사가 쓰였습니다. 콘텐츠의 원작자와 AI 사용자라는 두 집단을 하나로 묶어서 둘 다 보호받는다는 사실을 나열해주고 있네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원래,\u003c/span>\u003cspan class=\"en\">Originally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI의 내부 작동 원리는\u003c/span>\u003cspan class=\"en\">the inner workings of AI\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숨겨졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">hidden\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해커로부터 그들을 보호하기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">protect\u003c/span> them from hackers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">원래, AI의 내부 작동 원리는 해커로부터 그들을 보호하기 위해 숨겨졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI가 초기에는 왜 \u003cb class=\"key\">블랙박스\u003c/b>처럼 폐쇄적으로 운영되었는지 그 \u003cb class=\"key\">보안상\u003c/b>의 이유를 밝히는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사(과거) + 과거분사(p.p.) : \"숨겨졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : in order to + [동사원형] : \"보호하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Originally, 원래. the inner workings of AI, AI의 내부 작동 원리는. were hidden, 숨겨졌다. in order to protect them from hackers, 해커로부터 그들을 보호하기 위해.. 이 문장 전체를 해석하면, 원래, AI의 내부 작동 원리는 해커로부터 그들을 보호하기 위해 숨겨졌다.","hl":"m"},{"n":29,"text":"AI가 초기에 왜 블랙박스처럼 폐쇄적으로 운영되었는지 그 이유를 설명합니다. 보안상의 문제로 해킹을 막으려고 내부를 숨겼던 것이죠.","hl":"mn"},{"n":30,"text":"첫 번째로 were hidden이라는 수동태를 보세요. 작동 원리가 누군가에 의해 숨겨진 것이니 be동사와 과거분사 p.p.를 썼습니다. 두 번째는 in order to인데, 이건 목적을 아주 분명하게 나타내는 표현으로 보호하기 위해서라고 해석하면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 전략은\u003c/span>\u003cspan class=\"en\">this strategy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘 통하지 않았다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">worked\u003c/span> well.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 이 전략은 잘 통하지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 보안을 위해 AI 내부를 숨기는 기존의 \u003cb class=\"key\">비공개 \u003c/b>\u003cb class=\"key\">전략\u003c/b>이 실패했음을 지적하며, 내용의 \u003cb class=\"key\">반전\u003c/b>을 이끄는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 시제\u003c/span> : have/has + p.p. (부정) : \"통하지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"But, 하지만. this strategy, 이 전략은. has not worked well, 잘 통하지 않았다.. 이 문장 전체를 해석하면, 하지만 이 전략은 잘 통하지 않았다.","hl":"m"},{"n":32,"text":"앞서 언급된 AI의 비밀스러운 작동 방식이 실제로는 보안에 큰 도움이 되지 않았다는 반전을 보여줍니다. 이 문장을 기점으로 글의 흐름이 보안을 강화하기 위한 새로운 방법론으로 넘어가게 됩니다.","hl":"mn"},{"n":33,"text":"여기서 주목할 표현은 has not worked입니다. 과거에 세운 전략이 지금까지도 효과를 거두지 못하고 있는 상태를 나타내기 위해 현재완료 시제를 사용했네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해킹을 방지하기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">prevent\u003c/span> hacking,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 효과적일 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">effective \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI 시스템의 더 큰 투명성을 갖추는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> greater transparency in AI systems\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전문가들이 그것들을 쉽게 점검할 수 있도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">experts \u003c/span>\u003cspan class=\"tgt\">could\u003c/span> easily examine them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 잠재적인 약점을 찾아낼 수 있도록.\u003c/span>\u003cspan class=\"en\">and identify potential weaknesses.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">해킹을 방지하기 위해, 전문가들이 AI 시스템을 쉽게 점검하고 잠재적인 약점을 찾아낼 수 있도록 AI 시스템의 더 큰 투명성을 갖추는 것이 더 효과적일 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비공개 대신 \u003cb class=\"key\">투명성\u003c/b>을 높여 전문가의 점검을 받는 것이 보안에 더 유리하다는 \u003cb class=\"key\">해결책\u003c/b>을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : in order to + 동사원형 : \"방지하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가주어 it - 진주어 to부정사\u003c/span> : it [가주어] + be동사 + 형용사 + to부정사 [진주어] : \"~을 갖추는 것이 더 효과적일 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적의 부사절\u003c/span> : so that + 주어 + can/could + 동사원형 : \"전문가들이 ~할 수 있도록\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"In order to prevent hacking, 해킹을 방지하기 위해. it, 그것은. would be more effective, 더 효과적일 것이다. to have greater transparency in AI systems, AI 시스템의 더 큰 투명성을 갖추는 것이. so that experts could easily examine them, 전문가들이 그것들을 쉽게 점검할 수 있도록. and identify potential weaknesses, 그리고 잠재적인 약점을 찾아낼 수 있도록.. 이 문장 전체를 해석하면, 해킹을 방지하기 위해, 전문가들이 AI 시스템을 쉽게 점검하고 잠재적인 약점을 찾아낼 수 있도록 AI 시스템의 더 큰 투명성을 갖추는 것이 더 효과적일 것이다.","hl":"m"},{"n":35,"text":"이 문장은 기존 방식의 한계를 넘어선 새로운 대안을 제시하고 있어요. 해킹을 막기 위해 꽁꽁 숨기기만 하는 것보다, 오히려 정보를 공개해서 전문가들이 점검하게 하는 투명성이 더 강력한 보안책이 될 수 있다는 내용이죠.","hl":"mn"},{"n":36,"text":"문법을 살펴볼까요? 첫 번째로 In order to prevent는 목적을 나타내는 표현으로, 해킹을 방지하기 위해서라고 해석해요. 두 번째로 it would be more effective to have는 가주어 it과 진주어 to have가 쓰인 구문이에요. 투명성을 갖추는 것이 더 효과적이라는 뜻이죠. 마지막으로 so that experts could는 전문가들이 할 수 있도록이라는 의미의 목적절로 쓰였어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">블랙박스\u003c/b>는 알고리즘을 공개하지 않아 저작권 위반 여부를 확인하기 어렵다는 문제를 가진다.\u003c/li>\u003cli>알고리즘의 \u003cb class=\"key\">접근성\u003c/b>을 높이면 저작권 허가를 받는 절차가 쉬워져 원작자와 사용자 모두 보호받는다.\u003c/li>\u003cli>보안을 위해 내부를 숨겼던 기존의 \u003cb class=\"key\">은폐 \u003c/b>\u003cb class=\"key\">전략\u003c/b>은 실제 해킹 방지에 큰 도움이 되지 않았다.\u003c/li>\u003cli>시스템의 \u003cb class=\"key\">투명성\u003c/b>을 강화하여 전문가들이 수시로 약점을 찾아내게 하는 것이 보안에 더 유리하다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Greater transparency in AI systems is essential for protecting copyrights and improving security against hacking.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">폐쇄적인 \u003cb class=\"key\">AI \u003c/b>\u003cb class=\"key\">블랙박스\u003c/b>는 저작권 침해와 보안 취약점이라는 문제를 야기하므로, 보안 강화와 저작권 보호를 위해 알고리즘의 \u003cb class=\"key\">투명성\u003c/b>을 높여야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"자, 오늘 지문을 통해 AI 기술이 발전함에 따라 보안의 패러다임이 비밀주의에서 투명성으로 변하고 있다는 점을 배웠습니다. 알고리즘을 투명하게 공개하는 것이 오히려 저작권을 보호하고 해킹을 막는 더 똑똑한 방법이라는 것이 이 글의 요지였죠. 오늘 배운 투명성, 저작권, 보안 같은 핵심 개념들을 꼭 다시 복습해 보길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
