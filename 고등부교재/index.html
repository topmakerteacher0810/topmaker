<style>
/* 부교재 선택 카드 (첫 화면 카드와 같은 모양) */
.bk-label{display:inline-block;font-size:14px;font-weight:800;color:#1f3a3a;padding-bottom:4px;border-bottom:2px solid #d9963a;margin:6px 0 16px}
.bk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:28px}
.bk-card{display:block;position:relative;box-sizing:border-box;min-height:150px;padding:22px 22px 20px;background:#eef8f7;border:1px solid #cfe6e3;border-top:3px solid #d9963a;border-radius:10px;color:inherit;text-decoration:none;transition:box-shadow .15s,transform .15s}
a.bk-card:hover{box-shadow:0 6px 18px rgba(15,118,110,.18);transform:translateY(-2px)}
.bk-icon{width:36px;height:36px;border-radius:50%;background:#0f766e;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.bk-icon svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bk-title{font-size:19px;font-weight:700;line-height:1.35;margin:0 0 8px}
.bk-sub{font-size:13px;color:#5d6a70;margin:0}
.bk-tag{display:inline-block;margin-top:12px;font-size:12px;font-weight:700;color:#0f766e;background:#fff;border:1px solid #cfe6e3;border-radius:999px;padding:2px 10px}
.bk-card.soon{background:#fff;border:1px dashed #c9ccd2;border-top:3px solid #c9ccd2;cursor:default}
.bk-card.soon .bk-icon{background:#e8eaf8}
.bk-card.soon .bk-icon svg{stroke:#5a64b8}
.bk-card.soon .bk-title{color:#8a8e96;font-size:17px}
@media(max-width:640px){.bk-grid{grid-template-columns:1fr}}
</style>
</head>
