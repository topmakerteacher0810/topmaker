@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 24번","audioDir":"24_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">24번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>The Fine-Tuning of the Universe: Why Life Exists\u003c/h1>\u003ch2>우주의 미세 조정: 생명체가 존재하는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우주는 물리학적 \u003cb class=\"key\">상수와 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>들이 아주 정밀하게 설정되어 있어, \u003cb class=\"key\">중력과 \u003c/b>\u003cb class=\"key\">전자\u003c/b>의 값이 조금만 달랐어도 생명체가 존재할 수 없었을 것입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The precise values of physical laws and constants are essential conditions that allowed the emergence and evolution of life in the universe.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 우주라는 광활한 공간에서 어떻게 존재할 수 있는지, 그 과학적 근거를 다룬 흥미로운 지문을 공부해 보겠습니다. 이 글은 우주의 물리 상수들이 아주 정밀하게 설정되어 있다는 점을 강조하며, 생명 탄생의 필수 조건을 설명합니다. 한 문장으로 요약하면 정밀한 물리 법칙들이 고등 생명체의 진화를 가능하게 했다는 내용이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우주가 생명체가 살기에 적합하도록 아주 정밀하게 조정되어 있다는 이론을 \u003cb class=\"key\">미세 \u003c/b>\u003cb class=\"key\">조정 \u003c/b>\u003cb class=\"key\">우주\u003c/b> (Fine-tuned Universe)라고 합니다. 물리학의 기본 힘들이 아주 조금만 강하거나 약했다면 별이 형성되지 않거나 원자가 결합하지 못했을 것입니다. 마치 라디오 채널을 맞출 때 \u003cb class=\"key\">미세한 \u003c/b>\u003cb class=\"key\">다이얼\u003c/b> 조절이 필요한 것처럼, 우주의 상수들도 아주 정확한 지점에 고정되어 있습니다. 이러한 과학적 관점은 \u003cb class=\"key\">인류 \u003c/b>\u003cb class=\"key\">원리\u003c/b> (Anthropic Principle)와도 연결되며, 우리가 관찰하는 우주의 모습이 인간이라는 관찰자가 존재할 수 있는 조건과 일치해야 함을 설명합니다. 이는 우연인지 혹은 다른 이유가 있는지에 대해 현대 물리학과 철학에서 활발히 논의되는 주제입니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 미세 조정 우주라는 개념을 알아둘 필요가 있습니다. 영어로는 Fine-tuned Universe라고 하는데요. 마치 우리가 정교한 시계의 톱니바퀴를 아주 미세하게 조정하는 것처럼, 우주의 중력이나 전자의 값 같은 물리 상수들이 생명체가 살 수 있는 딱 적합한 값으로 설정되어 있다는 이론입니다. 조금이라도 어긋났다면 별도, 지구도, 우리도 없었을 거라는 아주 신비로운 이야기예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>물리 상수들의 정밀성\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>우리 우주의 물리 법칙과 상수들은 매우 \u003cb class=\"key\">정밀한 \u003c/b>\u003cb class=\"key\">값\u003c/b>을 가지고 있으며, 이 값이 아주 조금만 달랐어도 \u003cb class=\"key\">생명체\u003c/b>는 존재할 수 없었을 것이라고 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>중력의 사례\u003csmall>예시 · 문장 3\u003c/small>\u003c/h4>\u003cp>정밀한 중력의 값 덕분에 먼지와 가스가 뭉쳐 \u003cb class=\"key\">원시 \u003c/b>\u003cb class=\"key\">항성\u003c/b>과 행성들이 생겨났고, 지구가 태양 주위를 \u003cb class=\"key\">공전\u003c/b>하는 환경이 만들어졌습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>전자의 사례\u003csmall>예시 · 문장 4\u003c/small>\u003c/h4>\u003cp>전자의 값이 미세하게 달랐다면 \u003cb class=\"key\">화학 \u003c/b>\u003cb class=\"key\">반응\u003c/b> 자체가 불가능했을 것이며, 유기 화학에 기반한 \u003cb class=\"key\">생명의 \u003c/b>\u003cb class=\"key\">시작\u003c/b>도 없었을 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>우주의 환경과 진화\u003csmall>결론 · 문장 5\u003c/small>\u003c/h4>\u003cp>우주가 인간을 위해 설계된 것은 아닐지라도, 물리적 \u003cb class=\"key\">법칙과 \u003c/b>\u003cb class=\"key\">상수\u003c/b>들이 결과적으로 고등 생명체의 \u003cb class=\"key\">진화\u003c/b>를 가능하게 했습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 일반적인 물리 법칙의 정밀함에서 시작해서, 중력과 전자의 구체적인 사례를 거쳐 결론으로 이어지는 구조를 가지고 있습니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 도입부로 우리 우주의 물리 법칙과 상수들이 매우 precise, 즉 정밀한 형태를 띠고 있다고 말합니다. 만약 이 값들이 slightly different, 아주 약간만 달랐더라도 생명체는 가능하지 않았을 거라는 점을 짚어주고 있네요.","hl":"f0"},{"n":5,"text":"세 번째 문장은 중력에 대한 구체적인 예시입니다. 중력의 정밀한 값 덕분에 먼지와 가스 입자들이 응집되어 별이 만들어졌고, 지구가 태양 주위를 orbit, 즉 공전하는 환경이 조성될 수 있었다는 설명입니다.","hl":"f1"},{"n":6,"text":"네 번째 문장에서는 전자의 값을 가정법으로 설명합니다. 전자의 값이 조금이라도 달랐다면 chemistry, 화학 반응이 불가능했을 것이고, 결국 유기 화학에 기반한 생명체도 시작될 수 없었을 것이라는 강력한 근거를 제시하죠.","hl":"f2"},{"n":7,"text":"마지막 다섯 번째 문장은 결론입니다. 우주가 우리를 위해 특별히 설계된 것은 아니고 우리가 특권적 지위를 가진 것도 아니지만, 결과적으로 물리 법칙들이 advanced life, 즉 고등 생명체의 진화를 허용했다는 사실을 전달하며 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 우주의 물리 상수들이 \u003cb class=\"key\">정밀한 \u003c/b>\u003cb class=\"key\">형태\u003c/b>를 띤다는 핵심 주장을 제시하고, 이후 중력과 전자의 사례를 통해 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">근거\u003c/b>를 설명합니다. 마지막 문장에서 다시 한번 물리 법칙이 \u003cb class=\"key\">생명체의 \u003c/b>\u003cb class=\"key\">진화\u003c/b>를 허용했다는 사실을 정리하며 마무리하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>This means that (2)\u003c/b>\u003cspan>앞 문장의 구체적 의미 상술\u003c/span>\u003cb>For instance (3)\u003c/b>\u003cspan>중력의 구체적 사례 도입\u003c/span>\u003cb>If... had been (4)\u003c/b>\u003cspan>가정법을 통한 전자의 중요성 강조\u003c/span>\u003cb>however (5)\u003c/b>\u003cspan>특권적 지위 부재와 진화 가능성 사이의 대조적 연결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">laws and constants of physics\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">precise forms and values\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">precise value of gravity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">value of the electron\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">laws and constants of physics\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 먼저 핵심 주장을 던지고 구체적인 과학적 근거를 제시한 뒤 다시 결론을 맺는 전형적인 주장과 근거의 구조를 따릅니다. 처음과 끝에서 주제를 강조하는 양괄식 구성이라고 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"신호어를 살펴보면 두 번째 문장의 This means that으로 앞 내용을 풀어서 설명하고 있고, 세 번째 문장의 For instance로 중력이라는 예시를 들고 있습니다. 네 번째 문장에서는 If와 had been을 사용한 가정법 과거완료 구문을 통해 실제와 반대되는 상황을 가정하며 전자의 중요성을 강조했네요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>law\u003c/b>\u003cem>명사\u003c/em>\u003cspan>법칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>constant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상수\u003c/span>\u003c/div>\u003cdiv>\u003cb>physics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물리학\u003c/span>\u003c/div>\u003cdiv>\u003cb>fundamental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>근본적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>precise\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정밀한\u003c/span>\u003c/div>\u003cdiv>\u003cb>form\u003c/b>\u003cem>명사\u003c/em>\u003cspan>형태\u003c/span>\u003c/div>\u003cdiv>\u003cb>value\u003c/b>\u003cem>명사\u003c/em>\u003cspan>값\u003c/span>\u003c/div>\u003cdiv>\u003cb>slightly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>약간\u003c/span>\u003c/div>\u003cdiv>\u003cb>for instance\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>gravity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>중력\u003c/span>\u003c/div>\u003cdiv>\u003cb>enable\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가능하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>arise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생겨나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>permit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>허용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>aggregation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>응집\u003c/span>\u003c/div>\u003cdiv>\u003cb>particle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>입자\u003c/span>\u003c/div>\u003cdiv>\u003cb>protostar\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원시 항성\u003c/span>\u003c/div>\u003cdiv>\u003cb>orbit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공전하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>electron\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전자\u003c/span>\u003c/div>\u003cdiv>\u003cb>organic chemistry\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>유기 화학\u003c/span>\u003c/div>\u003cdiv>\u003cb>design\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설계하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>evolve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>privileged\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특권적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>advanced\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고등의\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 살펴볼까요? precise는 정밀한이라는 뜻으로 이 글의 핵심입니다. aggregation은 응집이나 모임을 뜻하며 중력의 역할을 설명할 때 쓰였죠. 그리고 advanced는 여기서 진보된 혹은 고등의라는 뜻으로 고등 생명체를 표현할 때 사용되었습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">precise\u003c/b>\u003cspan class=\"m\">정밀한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accurate\u003c/span>\u003cspan class=\"s\">exact\u003c/span>\u003cspan class=\"s\">minute\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">imprecise\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fundamental\u003c/b>\u003cspan class=\"m\">근본적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">basic\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">primary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">secondary\u003c/span>\u003cspan class=\"a\">superficial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enable\u003c/b>\u003cspan class=\"m\">가능하게 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">allow\u003c/span>\u003cspan class=\"s\">permit\u003c/span>\u003cspan class=\"s\">facilitate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prevent\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">aggregation\u003c/b>\u003cspan class=\"m\">응집\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accumulation\u003c/span>\u003cspan class=\"s\">collection\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dispersion\u003c/span>\u003cspan class=\"a\">separation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">privileged\u003c/b>\u003cspan class=\"m\">특권적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">special\u003c/span>\u003cspan class=\"s\">favored\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어 정리도 잊지 마세요. precise는 accurate나 exact로 바꿔 쓸 수 있고, fundamental은 essential과 의미가 통합니다. 무언가를 가능하게 하는 enable은 allow나 permit과 같은 맥락에서 이해하면 좋습니다. 반대로 aggregation의 반대말은 흩어짐을 뜻하는 dispersion 정도가 되겠네요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물리학 법칙들과 상수들\u003c/span>\u003cspan class=\"en\">The laws and constants of physics\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 근본 힘들은\u003c/span>\u003cspan class=\"en\">and the fundamental forces\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 우주의\u003c/span>\u003cspan class=\"en\">in our universe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 정밀한 공식의 형태들과 값들을 가진다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have\u003c/span> very precise forms and values.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">물리학 법칙들과 상수들 그리고 우리 우주의 근본 힘들은 매우 정밀한 공식의 형태들과 값들을 가진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리 우주가 우연이 아니라 아주 \u003cb class=\"key\">정밀한 \u003c/b>\u003cb class=\"key\">수치\u003c/b>와 법칙에 기반하여 존재한다는 사실을 도입부에서 설명합니다. 이 값들이 지금의 세상을 만드는 데 필수적인 \u003cb class=\"key\">전제 \u003c/b>\u003cb class=\"key\">조건\u003c/b>임을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : The laws and constants ... and the fundamental forces [복수 주어] + have [복수 동사] : \"가진다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The laws and constants of physics, 물리학 법칙들과 상수들. and the fundamental forces, 그리고 근본 힘들은. in our universe, 우리 우주의. have very precise forms and values, 매우 정밀한 공식의 형태들과 값들을 가진다.. 이 문장 전체를 해석하면, 물리학 법칙들과 상수들 그리고 우리 우주의 근본 힘들은 매우 정밀한 공식의 형태들과 값들을 가진다.","hl":"m"},{"n":13,"text":"우리 우주가 무작위로 만들어진 게 아니라 아주 정밀한 수치로 이루어져 있다는 걸 말해요. 이게 바로 글 전체의 핵심적인 전제 조건이 됩니다.","hl":"mn"},{"n":14,"text":"주어 부분을 보면 여러 항목이 and로 길게 연결된 복수 주어 형태예요. 그래서 동사 자리에 has가 아닌 have를 써서 수 일치를 시켜준 것에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 대절을 의미한다\u003c/span>\u003cspan class=\"en\">This means \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그것들이 아주 약간만 다르다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">slightly \u003c/span>\u003cspan class=\"tgt\">different\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생명체가 가능하지 않았을 것임을\u003c/span>\u003cspan class=\"en\">life would not have been possible.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는, 만약 그것들이 아주 약간만 다르다면, 생명체가 가능하지 않았을 것임을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 말한 물리 법칙들의 \u003cb class=\"key\">정밀함\u003c/b>이 생명체의 존재에 얼마나 \u003cb class=\"key\">결정적인 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 하는지 강조합니다. 미세한 변화조차 생명이 탄생할 수 없는 환경을 만들 수 있다는 \u003cb class=\"key\">가정\u003c/b>을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사\u003c/span> : means [동사] + that [접속사] + S + V [목적어 절] : \"~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가정법 과거\u003c/span> : if + 주어 + 과거동사(were) : \"만약 그것들이 아주 약간만 다르다면\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"This means that, 이는 대절을 의미한다. if they were only very slightly different, 만약 그것들이 아주 약간만 다르다면. life would not have been possible, 생명체가 가능하지 않았을 것임을. 이 문장 전체를 해석하면, 이는, 만약 그것들이 아주 약간만 다르다면, 생명체가 가능하지 않았을 것임을 의미한다.","hl":"m"},{"n":16,"text":"물리 수치가 조금만 틀어졌어도 우리는 존재할 수 없었다는 결정적인 역할을 강조해요. 현재의 실제 사실과 반대되는 상황을 가정해서 설명하고 있죠.","hl":"mn"},{"n":17,"text":"첫 번째로 means 뒤의 that은 목적어 역할을 하는 절을 이끄는 명사절 접속사예요. 두 번째로 if 절에 과거 동사인 were를 써서 현재 사실과 다른 일을 상상하는 가정법 구조를 만들었습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 중력의 정밀한 값은 우리 우주가 생겨나는 것을 가능하게 했다 먼지와 가스 입자들이 응집하는 것을 허용함으로써 원시 항성들로 행성들이 나중에 그 주위를 공전하게 되는 태양 주위의 지구를 포함하여\u003c/span>\u003cspan class=\"en\">For instance, the precise value of gravity \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">enabled \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">universe \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">arise\u003c/span> by permitting the aggregation of dust and gas particles to proto­stars \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">which\u003c/span> planets later came to orbit, including the Earth around the Sun.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 중력의 정밀한 값은 태양 주위의 지구를 포함하여 행성들이 나중에 그 주위를 공전하게 되는 원시 항성들로 먼지와 가스 입자들이 응집하는 것을 허용함으로써 우리 우주가 생겨나는 것을 가능하게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중력이라는 구체적인 \u003cb class=\"key\">사례\u003c/b>를 통해 우주의 형성 과정을 설명합니다. 중력이 먼지를 뭉치게 해 별과 행성을 만든 모든 과정이 중력의 \u003cb class=\"key\">정밀한 \u003c/b>\u003cb class=\"key\">값\u003c/b> 덕분임을 보여주는 \u003cb class=\"key\">상세 \u003c/b>\u003cb class=\"key\">설명\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장 (enable)\u003c/span> : enable [동사] + A [목적어] + to arise [목적격 보어(to부정사)] : \"우리 우주가 생겨나는 것을 가능하게 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 관계대명사\u003c/span> : protostars [선행사] + around [전치사] + which [관계대명사] : \"그 주위를 (~하는)\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"For instance, the precise value of gravity, 예를 들어, 중력의 정밀한 값은. has enabled our universe to arise, 우리 우주가 생겨나는 것을 가능하게 했다. by permitting the aggregation of dust and gas particles, 먼지와 가스 입자들이 응집하는 것을 허용함으로써. to protostars, 원시 항성들로. around which planets later came to orbit, 행성들이 나중에 그 주위를 공전하게 되는. including the Earth around the Sun, 태양 주위의 지구를 포함하여. 이 문장 전체를 해석하면, 예를 들어, 중력의 정밀한 값은 태양 주위의 지구를 포함하여 행성들이 나중에 그 주위를 공전하게 되는 원시 항성들로 먼지와 가스 입자들이 응집하는 것을 허용함으로써 우리 우주가 생겨나는 것을 가능하게 했다.","hl":"m"},{"n":19,"text":"중력이라는 구체적인 사례를 들어서 설명하는 부분이에요. 중력이 먼지를 뭉치게 해서 별과 행성을 만들었다는 과학적 과정을 보여줍니다.","hl":"mn"},{"n":20,"text":"첫 번째로 enable A to arise 구조는 A가 생겨나는 것을 가능하게 한다는 오형식 문장이에요. 두 번째로 around which는 전치사와 관계대명사가 결합한 형태로 뒤에 완전한 문장이 따라와서 선행사를 수식합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 전자의 값이\u003c/span>\u003cspan class=\"en\">If the value of the electron\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 약간이라도 더 크거나 작았더라면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">been\u003c/span> ever so slightly larger or smaller,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 알고 있는 대로의 화학 반응은 가능하지 않았을 것이며\u003c/span>\u003cspan class=\"en\">chemistry, as we know it, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been\u003c/span> possible\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유기 화학 반응에 기반을 둔 생명체는\u003c/span>\u003cspan class=\"en\">and life, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">based \u003c/span>\u003cspan class=\"tgt\">on\u003c/span> organic chemistry,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시작될 수 없었을 것이다.\u003c/span>\u003cspan class=\"en\">could not have started.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 전자의 값이 아주 약간이라도 더 크거나 작았더라면, 우리가 알고 있는 대로의 화학 반응은 가능하지 않았을 것이며 유기 화학 반응에 기반을 둔 생명체는 시작될 수 없었을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전자의 수치라는 구체적인 사례를 통해 생명체 탄생을 위한 우주의 조건이 매우 \u003cb class=\"key\">미세 \u003c/b>\u003cb class=\"key\">조정\u003c/b>되어 있음을 강조합니다. 과거의 사실과 반대되는 가정을 통해 물리 상수가 생명의 \u003cb class=\"key\">필수 \u003c/b>\u003cb class=\"key\">조건\u003c/b>임을 설명하는 흐름입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거완료 (If절)\u003c/span> : If + 주어 + had p.p. : \"했었더라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가정법 과거완료 (주절)\u003c/span> : 주어 + would/could/might + have p.p. : \"가능하지 않았을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사의 계속적 용법\u003c/span> : 명사(선행사) + , which + 동사 : \"그런데 그것은 ~에 기반을 둔\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"If the value of the electron, 만약 전자의 값이. had been ever so slightly larger or smaller, 아주 약간이라도 더 크거나 작았더라면. chemistry, as we know it, would not have been possible, 우리가 알고 있는 대로의 화학 반응은 가능하지 않았을 것이며. and life, which is based on organic chemistry, 유기 화학 반응에 기반을 둔 생명체는. could not have started, 시작될 수 없었을 것이다.. 이 문장 전체를 해석하면, 만약 전자의 값이 아주 약간이라도 더 크거나 작았더라면, 우리가 알고 있는 대로의 화학 반응은 가능하지 않았을 것이며 유기 화학 반응에 기반을 둔 생명체는 시작될 수 없었을 것이다.","hl":"m"},{"n":22,"text":"전자의 값이 아주 조금만 달랐어도 우리가 아는 화학 법칙이 성립하지 않아 생명이 시작조차 못 했을 거라는 이야기예요. 우주가 생명을 위해 얼마나 미세 조정되어 있는지 보여주는 핵심적인 문장입니다.","hl":"mn"},{"n":23,"text":"첫 번째로 If절에 had been을 쓴 점을 보세요. 과거의 사실과 반대 상황을 가정하는 가정법 과거완료의 시작이에요. 두 번째로 주절에도 would not have been과 could not have started를 써서 과거에 대한 추측을 나타내야 합니다. 마지막으로 콤마 which는 생명체에 대해 덧붙여 말하는 부연 설명의 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주는 설계되지 않았고,\u003c/span>\u003cspan class=\"en\">The universe was not designed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 진화하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">evolve\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 우주에서 어떠한 특권적인 지위를 가지지 않는다.\u003c/span>\u003cspan class=\"en\">we have no privileged position in the universe;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나, 물리학 법칙들과 상수들은\u003c/span>\u003cspan class=\"en\">however, the laws and constants of physics\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고등 생명체가 진화하는 것을 가능하게 했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">allowed \u003c/span>\u003cspan class=\"tgt\">advanced \u003c/span>\u003cspan class=\"tgt\">life \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">evolve\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우주는 우리가 진화하도록 설계되지 않았고, 우리는 우주에서 어떠한 특권적인 지위를 가지지 않는다. 그러나, 물리학 법칙들과 상수들은 고등 생명체가 진화하는 것을 가능하게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우주가 인간만을 위해 \u003cb class=\"key\">의도적\u003c/b>으로 만들어진 것은 아니지만, 정교한 물리 법칙들이 결과적으로 생명체가 살 수 있는 \u003cb class=\"key\">적합한 \u003c/b>\u003cb class=\"key\">환경\u003c/b>을 조성했음을 설명하며 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어\u003c/span> : for + 목적격 + to부정사 : \"우리가 진화하도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 allow + 목적어 + to부정사\u003c/span> : allow + 목적어 + to부정사 : \"고등 생명체가 진화하는 것을 가능하게 했다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The universe was not designed, 우주는 설계되지 않았고. for us to evolve, 우리가 진화하도록. we have no privileged position in the universe, 우리는 우주에서 어떠한 특권적인 지위를 가지지 않는다.. however, the laws and constants of physics, 그러나, 물리학 법칙들과 상수들은. allowed advanced life to evolve, 고등 생명체가 진화하는 것을 가능하게 했다.. 이 문장 전체를 해석하면, 우주는 우리가 진화하도록 설계되지 않았고, 우리는 우주에서 어떠한 특권적인 지위를 가지지 않는다. 그러나, 물리학 법칙들과 상수들은 고등 생명체가 진화하는 것을 가능하게 했다.","hl":"m"},{"n":25,"text":"우주가 인간을 위해 의도적으로 설계된 것은 아니지만, 기막히게 맞아떨어지는 물리 법칙들 덕분에 우리가 존재할 수 있게 되었다는 역설을 말합니다. 인간의 특별함보다는 우주가 제공한 적합한 환경의 기적을 강조하는 것이죠.","hl":"mn"},{"n":26,"text":"첫 번째로 designed 뒤에 나온 for us는 to부정사의 의미상 주어입니다. 진화라는 행동을 하는 주체가 우리라는 걸 밝혀줍니다. 두 번째로 문장 끝부분의 allow 동사를 보세요. 목적어 뒤에 to부정사를 목적격 보어로 써서 고등 생명체가 진화하는 결과로 이어졌음을 보여주는 5형식 구조입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우주의 물리학적 \u003cb class=\"key\">법칙과 \u003c/b>\u003cb class=\"key\">상수\u003c/b>들은 생명체 존재를 위해 매우 \u003cb class=\"key\">정밀한 \u003c/b>\u003cb class=\"key\">값\u003c/b>을 유지하고 있습니다.\u003c/li>\u003cli>\u003cb class=\"key\">중력\u003c/b>의 정밀한 수치는 먼지와 가스가 뭉쳐 별과 행성이 형성되는 데 필수적인 역할을 했습니다.\u003c/li>\u003cli>\u003cb class=\"key\">전자\u003c/b>의 값이 아주 조금만 달랐어도 생명체의 기초인 \u003cb class=\"key\">유기 \u003c/b>\u003cb class=\"key\">화학\u003c/b> 반응이 일어날 수 없었을 것입니다.\u003c/li>\u003cli>우주가 우리를 위해 설계된 것은 아니지만, 물리 법칙들은 \u003cb class=\"key\">고등 \u003c/b>\u003cb class=\"key\">생명체\u003c/b>의 진화를 가능하게 한 토대입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The precise values of physical laws and constants are essential conditions that allowed the emergence and evolution of life in the universe.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우주는 물리학적 \u003cb class=\"key\">상수와 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>들이 아주 정밀하게 설정되어 있어, \u003cb class=\"key\">중력과 \u003c/b>\u003cb class=\"key\">전자\u003c/b>의 값이 조금만 달랐어도 생명체가 존재할 수 없었을 것입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"자, 이렇게 해서 우주의 정밀한 설계가 생명체의 진화에 어떤 영향을 주었는지 정리해 보았습니다. 물리 법칙이라는 딱딱한 소재지만, 우리 존재의 근원을 설명하는 아주 흥미로운 지문이었죠? 오늘 배운 정밀한 값들과 가정법 문장들을 다시 한번 복습하면서 마무리하시기 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
