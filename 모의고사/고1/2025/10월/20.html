@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 20번","audioDir":"20_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">20번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>The Secret to Lasting Bonds: The Power of Consistent Communication\u003c/h1>\u003ch2>지속되는 관계의 비결: 일관된 소통의 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>장기적인 관계 유지를 위해서는 \u003cb class=\"key\">의식적인 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 통해 상대방에게 \u003cb class=\"key\">정기적으로 \u003c/b>\u003cb class=\"key\">연락\u003c/b>하며 관심을 표현하는 \u003cb class=\"key\">일관된 \u003c/b>\u003cb class=\"key\">소통\u003c/b>이 필수적이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>To maintain long-term relationships, one must make a conscious and consistent effort to stay in touch by sharing value and checking in.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 인간관계를 오랫동안 건강하게 유지하는 비결에 대해 이야기해 보려고 합니다. 장기적인 관계에서 가장 중요한 것은 무엇일까요? 바로 communication, 즉 소통입니다. 오늘 지문을 통해 우리가 어떻게 관계를 관리해야 하는지 그 구체적인 방법을 함께 살펴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간관계는 정적인 상태가 아니라 생명체처럼 가꾸어야 하는 대상입니다. 사회학에서는 이를 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">자본(Social \u003c/b>\u003cb class=\"key\">Capital)\u003c/b>의 유지라고 부르는데, 아무리 친했던 사이라도 교류가 없으면 그 가치는 점차 소멸하게 됩니다. 마치 정원에 물을 주지 않으면 식물이 시드는 것처럼, 관계도 \u003cb class=\"key\">사후 \u003c/b>\u003cb class=\"key\">관리(Follow-up)\u003c/b>가 없으면 정체될 수밖에 없습니다. 고등 영어 독해에서는 이러한 관계의 지속성을 위한 \u003cb class=\"key\">능동적인 \u003c/b>\u003cb class=\"key\">상호작용(Proactive \u003c/b>\u003cb class=\"key\">Interaction)\u003c/b>의 중요성을 자주 다룹니다. 이 글은 단순히 연락을 자주 하는 것보다 '의미 있는 연결'을 유지하는 구체적인 방법을 제시하고 있습니다.\u003c/div>","segs":[{"n":2,"text":"사회학에서는 인맥을 관리하고 유지하는 노력을 사회적 자본의 축적이라고 합니다. 마치 화초에 주기적으로 물을 주어야 하듯이, 인간관계도 가만히 둔다고 유지되는 것이 아니에요. follow-up, 즉 사후 관리가 없으면 소중한 인연도 어느새 멀어지게 되죠. 오늘 공부할 내용은 이런 일상적인 관계의 원리를 아주 명확하게 설명해 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>소통의 중요성\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>장기적인 관계를 유지하는 데 있어 가장 핵심적인 요소가 \u003cb class=\"key\">소통(communication)\u003c/b>임을 명시하며 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>관계 정체의 원인\u003csmall>문제 제기 · 문장 2\u003c/small>\u003c/h4>\u003cp>친해진 후 \u003cb class=\"key\">사후 \u003c/b>\u003cb class=\"key\">관리(follow-up)\u003c/b>가 부족하면 관계가 \u003cb class=\"key\">정체(stuck)\u003c/b>되기 쉽다는 현실적인 문제를 지적합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>의식적인 노력\u003csmall>주장 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>관계를 유지하기 위해 \u003cb class=\"key\">의식적인 \u003c/b>\u003cb class=\"key\">노력(conscious \u003c/b>\u003cb class=\"key\">effort)\u003c/b>을 기울여야 하며, 이는 거창한 것이 아니라 \u003cb class=\"key\">안부 \u003c/b>\u003cb class=\"key\">확인(check \u003c/b>\u003cb class=\"key\">in)\u003c/b>이나 가치 공유 같은 작은 행동임을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>구체적인 실천법\u003csmall>예시 · 문장 6\u003c/small>\u003c/h4>\u003cp>상대방이 관심을 가질 법한 \u003cb class=\"key\">기사나 \u003c/b>\u003cb class=\"key\">자료(article \u003c/b>\u003cb class=\"key\">or \u003c/b>\u003cb class=\"key\">resource)\u003c/b>를 공유하는 구체적인 사례를 들어 방법을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>행동의 의미\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>이러한 작은 노력이 상대방에 대한 \u003cb class=\"key\">배려와 \u003c/b>\u003cb class=\"key\">투자(invested)\u003c/b>를 보여줌으로써 관계를 지속시킨다는 점을 정리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 소통의 중요성을 먼저 강조한 뒤, 실제적인 실천 방법과 그 긍정적인 효과를 차례대로 설명하고 있어요.","hl":null},{"n":4,"text":"첫 번째 문장에서는 장기적 관계 유지의 가장 중요한 측면이 소통이라고 선언하며 글을 시작합니다. One of the most important aspects라는 표현으로 핵심 주제를 강력하게 제시하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째와 세 번째 문장에서는 문제가 되는 상황과 그 해결책을 제시합니다. 연락 부족 때문에 관계가 stuck, 즉 정체되기 쉽다는 점을 경고하면서, 관계를 유지하기 위해 의식적인 노력을 기울여 stay in touch, 연락하며 지내라고 조언합니다.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장은 소통의 올바른 방식을 정의합니다. 무언가 부탁하거나 자기 소식만 전하는 게 아니라, consistent, 즉 일관된 선을 유지하는 것이 중요하다고 말하죠. 안부를 묻는 간단한 메시지 하나가 관계를 reinforcement, 강화하는 데 큰 도움이 된다는 뜻이에요.","hl":"f2"},{"n":7,"text":"여섯 번째 문장에서는 아주 구체적인 예시를 들어줍니다. 상대방이 좋아할 만한 article이나 resource를 발견했을 때, 비록 한동안 연락하지 않았더라도 그것을 공유해 보라는 것이죠.","hl":"f3"},{"n":8,"text":"마지막 일곱 번째 문장에서는 이런 행동의 본질적인 의미를 짚어줍니다. 내가 당신을 생각하고 있고, 이 관계를 유지하는 데 invested, 즉 정성을 쏟고 있다는 것을 보여주는 증거가 된다는 결론입니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 관계 유지의 핵심이 \u003cb class=\"key\">소통\u003c/b>이라는 핵심 주제를 던지는 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다. 이후 연락 부족으로 인한 \u003cb class=\"key\">관계의 \u003c/b>\u003cb class=\"key\">정체\u003c/b>라는 문제를 언급하고, 이를 해결하기 위한 \u003cb class=\"key\">의식적인 \u003c/b>\u003cb class=\"key\">노력\u003c/b>과 구체적인 예시를 제시하는 \u003cb class=\"key\">문제-해결\u003c/b> 방식으로 전개됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>One of the most important aspects (1)\u003c/b>\u003cspan>주제 강조\u003c/span>\u003cb>due to (2)\u003c/b>\u003cspan>원인 분석\u003c/span>\u003cb>To keep the connection alive (3)\u003c/b>\u003cspan>목적 제시\u003c/span>\u003cb>This doesn't mean... but rather (4)\u003c/b>\u003cspan>개념 대조 및 강조\u003c/span>\u003cb>For example (6)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003c/div>\u003cdiv cl  약화시키다는 뜻의 weaken은 반의어로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 중요한 측면들 중 하나는 장기적인 관계를 유지하는 것의 소통이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">One \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">aspects\u003c/span> of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sustaining\u003c/span> long­term relationships is communication.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">장기적인 관계를 유지하는 데 가장 중요한 측면 중 하나는 소통이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 장기적인 관계 유지의 핵심이 \u003cb class=\"key\">소통\u003c/b>임을 밝히며 글의 주제를 제시합니다. 여러 요소 중 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">측면\u003c/b>을 강조하며 독자의 주의를 끕니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">One of the + 복수명사\u003c/span> : One of the [최상급] + [aspects (복수명사)] : \"가장 중요한 측면들 중 하나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사\u003c/span> : of [전치사] + [sustaining (동명사)] : \"유지하는 것의\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"One of the most important aspects, 가장 중요한 측면들 중 하나는. of sustaining long-term relationships, 장기적인 관계를 유지하는 것의. is communication, 소통이다.. 이 문장 전체를 해석하면, 장기적인 관계를 유지하는 데 가장 중요한 측면 중 하나는 소통이다.","hl":"m"},{"n":14,"text":"장기적인 관계를 유지하기 위해서 무엇이 가장 중요한지에 대해 이야기하고 있어요. 글 전체의 주제인 소통을 강조하는 첫 번째 문장입니다.","hl":"mn"},{"n":15,"text":"첫 번째로 One of the 뒤에는 반드시 aspects처럼 복수 명사가 와야 한다는 점을 기억하세요. 두 번째로 전치사 of 뒤에는 동명사 형태인 sustaining을 써서 유지하는 것이라는 의미를 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉽다 누군가와 친해지고 나서 그러고 나서 그 관계가 정체되도록 내버려두는 것은 추후 연락 부족으로 인해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's \u003c/span>\u003cspan class=\"tgt\">easy \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">connect\u003c/span> with someone and then \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">let \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">relationship \u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">stuck\u003c/span> due to a lack of follow­up.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">누군가와 친해지고 나서 추후 연락 부족으로 인해 그 관계가 정체되도록 내버려두기 쉽다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 관계가 단절되는 원인이 \u003cb class=\"key\">추후 \u003c/b>\u003cb class=\"key\">연락\u003c/b>의 부족에 있음을 설명합니다. 시작은 쉬우나 지속적인 관심이 없으면 관계가 \u003cb class=\"key\">정체\u003c/b>되기 쉬운 현실을 지적합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어·진주어 구문\u003c/span> : It [가주어] + is [동사] + easy [형용사] + to connect [진주어] : \"친해지는 것은 쉽다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 + 목적어 + 목적격 보어\u003c/span> : let [사역동사] + the relationship [목적어] + get stuck [목적격 보어(형용사구)] : \"관계가 정체되도록 내버려두다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"It's easy, 쉽다. to connect with someone, 누군가와 친해지고 나서. and then let the relationship get stuck, 그러고 나서 그 관계가 정체되도록 내버려두는 것은. due to a lack of follow-up, 추후 연락 부족으로 인해.. 이 문장 전체를 해석하면, 누군가와 친해지고 나서 추후 연락 부족으로 인해 그 관계가 정체되도록 내버려두기 쉽다.","hl":"m"},{"n":17,"text":"누군가와 처음 연결되는 것은 어렵지 않지만 그 이후의 노력이 없으면 관계가 멈춰버린다는 경고를 담고 있어요. 추후 연락이 없어서 관계가 정체되는 상황을 묘사하고 있습니다.","hl":"mn"},{"n":18,"text":"첫 번째로 가주어 It을 앞에 두고 진짜 주어인 to connect를 뒤로 보냈어요. 두 번째로 let은 사역동사로 쓰여서 관계가 정체된 상태가 되게 내버려 둔다는 의미를 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관계를 유지하기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">connection \u003c/span>\u003cspan class=\"tgt\">alive\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의식적인 노력을 기울여라\u003c/span>\u003cspan class=\"en\">make a conscious effort\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연락하고 지내려는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stay \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">touch\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">관계를 유지하기 위해, 연락하고 지내려는 의식적인 노력을 기울여라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 관계 유지를 위해 필요한 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">행동\u003c/b> 지침을 제시합니다. 막연한 기대보다 의도적인 \u003cb class=\"key\">의식적인 \u003c/b>\u003cb class=\"key\">노력\u003c/b>이 필요함을 강조하는 핵심 조언입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : To keep [to부정사] + the connection [목적어] + alive [목적격 보어] : \"관계를 유지하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : effort [명사] + to stay in touch [to부정사구] : \"연락하고 지내려는\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"To keep the connection alive, 관계를 유지하기 위해. make a conscious effort, 의식적인 노력을 기울여라. to stay in touch, 연락하고 지내려는.. 이 문장 전체를 해석하면, 관계를 유지하기 위해, 연락하고 지내려는 의식적인 노력을 기울여라.","hl":"m"},{"n":20,"text":"관계를 생생하게 유지하기 위해서는 가만히 있으면 안 된다는 뜻이에요. 연락하고 지내겠다는 의식적인 노력을 직접적으로 권유하고 있습니다.","hl":"mn"},{"n":21,"text":"첫 번째로 문장 맨 앞의 to부정사는 하기 위해서라는 목적을 나타내는 부사적 용법이에요. 두 번째로 명사인 effort 뒤의 to stay는 노력을 꾸며주는 형용사적 용법으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 의미하지 않는다\u003c/span>\u003cspan class=\"en\">This doesn't mean\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끊임없이 연락을 취하는 것을\u003c/span>\u003cspan class=\"en\">constantly \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">reaching \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요청이나 최근 소식을 가지고\u003c/span>\u003cspan class=\"en\">with requests or updates\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오히려 유지하는 것을\u003c/span>\u003cspan class=\"en\">but rather maintaining\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친근하고 일관된 소통의 끈을\u003c/span>\u003cspan class=\"en\">a friendly and consistent line of communication.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 요청이나 최근 소식을 가지고 끊임없이 연락을 취하는 것이 아니라 오히려 친근하고 일관된 소통의 끈을 유지하는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 관계를 유지하기 위해 \u003cb class=\"key\">용건\u003c/b>이 있을 때만 연락하기보다는, 평상시에 \u003cb class=\"key\">꾸준한 \u003c/b>\u003cb class=\"key\">소통\u003c/b>을 이어가는 것이 중요하다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 (목적어)\u003c/span> : mean [동사] + [reaching out (동명사구/목적어)] : \"연락을 취하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">상관접속사 (not A but B)\u003c/span> : not [A] but rather [B] : \"A가 아니라 오히려 B\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"This doesn't mean, 이는 의미하지 않는다. constantly reaching out, 끊임없이 연락을 취하는 것을. with requests or updates, 요청이나 최근 소식을 가지고. but rather maintaining, 오히려 유지하는 것을. a friendly and consistent line of communication, 친근하고 일관된 소통의 끈을. 이 문장 전체를 해석하면, 이는 요청이나 최근 소식을 가지고 끊임없이 연락을 취하는 것이 아니라 오히려 친근하고 일관된 소통의 끈을 유지하는 것을 의미한다.","hl":"m"},{"n":23,"text":"단순히 할 말이 있을 때만 연락하는 것은 진정한 소통이 아니에요. 평소에 친근하고 꾸준하게 대화의 통로를 열어두는 것이 핵심입니다.","hl":"mn"},{"n":24,"text":"첫 번째로 not A but rather B 구문을 보세요. A가 아니라 오히려 B라는 뜻으로 필자가 강조하고 싶은 부분은 뒤에 나오는 B입니다. 두 번째로 reaching out과 maintaining은 모두 동명사 형태로 mean의 목적어 역할을 하며 나란히 병렬을 이루고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간단한 메시지가\u003c/span>\u003cspan class=\"en\">A simple message\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안부를 확인하거나 공유하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">check \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">share\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가치 있는 무언가를\u003c/span>\u003cspan class=\"en\">something of value\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도움이 될 수 있다\u003c/span>\u003cspan class=\"en\">can go a long way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 관계를 강화하는 데\u003c/span>\u003cspan class=\"en\">in \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">reinforcing\u003c/span> your relationship.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안부를 확인하거나 가치 있는 무언가를 공유하는 간단한 메시지가 여러분의 관계를 강화하는 데 도움이 될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거창한 것이 아니더라도 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">안부\u003c/b>나 \u003cb class=\"key\">유익한 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 나누는 것만으로도 관계가 훨씬 \u003cb class=\"key\">단단\u003c/b>해질 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : message [명사] + [to check in or share (to부정사구)] : \"확인하거나 공유하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 (전치사의 목적어)\u003c/span> : in [전치사] + [reinforcing (동명사)] : \"강화하는 데\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"A simple message, 간단한 메시지가. to check in or share, 안부를 확인하거나 공유하는. something of value, 가치 있는 무언가를. can go a long way, 도움이 될 수 있다. in reinforcing your relationship, 여러분의 관계를 강화하는 데. 이 문장 전체를 해석하면, 안부를 확인하거나 가치 있는 무언가를 공유하는 간단한 메시지가 여러분의 관계를 강화하는 데 도움이 될 수 있다.","hl":"m"},{"n":26,"text":"아주 짧은 메시지라도 상대방을 생각하는 마음이 담겨 있다면 관계 유지에 큰 힘이 됩니다. 유용한 정보를 나누는 것도 좋은 방법이죠.","hl":"mn"},{"n":27,"text":"첫 번째로 to check in or share는 앞에 있는 명사를 꾸며주는 형용사처럼 쓰였어요. 두 번째로 something of value는 가치 있는 것이라는 뜻인데, 전치사 of와 추상명사가 합쳐져 형용사 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어 여러분이 우연히 발견하면\u003c/span>\u003cspan class=\"en\">For example, if you come across\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기사나 자료를\u003c/span>\u003cspan class=\"en\">an article or resource\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관계가 있는 사람의 흥미를 끌 수 있다고 여기는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">interest\u003c/span> a connection,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들과 그것을 공유하라\u003c/span>\u003cspan class=\"en\">share it with them,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한동안 이야기하지 않았다고 할지라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">if\u003c/span> you haven't spoken in a while.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 여러분이 자신과 관계가 있는 사람의 흥미를 끌 수 있다고 여기는 기사나 자료를 우연히 발견하면, 한동안 이야기하지 않았다고 할지라도 그들과 그것을 공유하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상대방이 좋아할 만한 것을 발견했을 때 먼저 \u003cb class=\"key\">공유\u003c/b>하는 행동은, \u003cb class=\"key\">어색한 \u003c/b>\u003cb class=\"key\">공백기\u003c/b>를 깨고 관계를 이어주는 가교 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사와 삽입절\u003c/span> : [선행사] + that + [you think (삽입절)] + might interest [동사] : \"~라고 생각하는 (~할 수도 있는)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">양보의 접속사\u003c/span> : even if + [주어 + 동사] : \"~라고 할지라도\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"For example, if you come across, 예를 들어 여러분이 우연히 발견하면. an article or resource, 기사나 자료를. that you think might interest a connection, 관계가 있는 사람의 흥미를 끌 수 있다고 여기는. share it with them, 그들과 그것을 공유하라. even if you haven't spoken in a while, 한동안 이야기하지 않았다고 할지라도. 이 문장 전체를 해석하면, 예를 들어, 여러분이 자신과 관계가 있는 사람의 흥미를 끌 수 있다고 여기는 기사나 자료를 우연히 발견하면, 한동안 이야기하지 않았다고 할지라도 그들과 그것을 공유하라.","hl":"m"},{"n":29,"text":"오랫동안 연락을 안 해서 쑥스러울 수도 있겠지만, 상대방에게 도움이 될 만한 기사를 보내는 것은 아주 좋은 소통의 시작이 됩니다.","hl":"mn"},{"n":30,"text":"첫 번째로 that you think might interest 부분을 주의 깊게 보세요. that은 주격 관계대명사이고 중간에 you think가 삽입되어 생각의 느낌을 더해줍니다. 두 번째로 even if는 설령 무엇일지라도라는 양보의 의미를 가진 접속사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 보여 준다\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shows \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 그들을 생각하고 있으며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> you're thinking of them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관계를 지속하는 데 노력을 쏟고 있다는 것을\u003c/span>\u003cspan class=\"en\">and are invested \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">maintaining\u003c/span> the relationship.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 여러분이 그들을 생각하고 있으며 관계를 지속하는 데 노력을 쏟고 있다는 것을 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급한 작은 연락이 상대방에게 주는 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">인상\u003c/b>을 설명합니다. 단순히 정보를 주는 것을 넘어 상대와의 관계를 \u003cb class=\"key\">소중하게\u003c/b> 여기고 있다는 진심을 전달하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : show [타동사] + that [접속사] + 주어 + 동사 : \"~라는 것을 보여 준다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사의 목적어로 쓰인 동명사\u003c/span> : in [전치사] + maintaining [동명사] : \"지속하는 데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : 주어(you) + are [동사1] ... and + are [동사2] : \"생각하고 있으며 ... 노력을 쏟고 있다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"This shows, 이는 보여 준다. that you're thinking of them, 여러분이 그들을 생각하고 있으며. and are invested in maintaining the relationship, 관계를 지속하는 데 노력을 쏟고 있다는 것을. 이 문장 전체를 해석하면, 이는 여러분이 그들을 생각하고 있으며 관계를 지속하는 데 노력을 쏟고 있다는 것을 보여 준다.","hl":"m"},{"n":32,"text":"이 문장은 앞서 말한 작은 연락이 상대방에게 어떤 의미로 다가가는지 정리해 주는 결론이에요. 내가 상대를 여전히 소중히 여기고 있고 이 관계에 진심이라는 긍정적인 인상을 심어준다는 내용이죠.","hl":"mn"},{"n":33,"text":"첫 번째로 shows 뒤에 나오는 that은 목적어 자리를 채워주는 명사절 접속사예요. 두 번째로 are thinking과 are invested는 접속사 and를 사이에 두고 주어 you에 함께 걸리는 병렬 구조라는 점을 기억하세요. 마지막으로 전치사 in 뒤에는 maintain을 동명사 형태인 maintaining으로 써야 한다는 점도 아주 중요합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>장기적인 관계를 유지하기 위한 가장 핵심적인 요소는 \u003cb class=\"key\">소통\u003c/b>이다.\u003c/li>\u003cli>사후 연락의 부족은 관계를 \u003cb class=\"key\">정체\u003c/b>되게 만들므로 \u003cb class=\"key\">의식적인 \u003c/b>\u003cb class=\"key\">노력\u003c/b>이 필요하다.\u003c/li>\u003cli>끊임없는 요청보다는 \u003cb class=\"key\">일관성\u003c/b> 있고 친근한 연락을 유지하는 것이 중요하다.\u003c/li>\u003cli>안부 확인이나 가치 있는 자료를 공유하는 작은 행동이 관계를 \u003cb class=\"key\">강화\u003c/b>한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>To maintain long-term relationships, one must make a conscious and consistent effort to stay in touch by sharing value and checking in.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">장기적인 관계 유지를 위해서는 \u003cb class=\"key\">의식적인 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 통해 상대방에게 \u003cb class=\"key\">정기적으로 \u003c/b>\u003cb class=\"key\">연락\u003c/b>하며 관심을 표현하는 \u003cb class=\"key\">일관된 \u003c/b>\u003cb class=\"key\">소통\u003c/b>이 필수적이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"결국 좋은 관계를 만드는 것은 거창한 이벤트가 아니라, 평소에 나누는 작은 관심과 일관된 연락이라는 사실을 잊지 마세요. 오늘 배운 표현들을 복습하면서 여러분의 소중한 인연들을 떠올려 보는 것도 좋겠네요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
