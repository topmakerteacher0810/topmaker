@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 32번","audioDir":"32_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">32번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>Animals' Approximate Number System: Why Size Matters\u003c/h1>\u003ch2>동물의 어림 수 짐작 능력: 숫자의 크기가 중요한 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>동물들은 수량을 분별할 때 \u003cb class=\"key\">어림 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">짐작 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 사용하는데, 이는 숫자가 커질수록 \u003cb class=\"key\">정확성\u003c/b>이 떨어지는 특징을 보입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Animals possess an approximate number system where the accuracy of number discrimination decreases as the quantities increase.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 동물의 흥미로운 수학적 능력을 다룬 지문을 함께 공부해 볼 거예요. 이 글은 동물들이 숫자를 어떻게 인식하는지, 그리고 그 한계는 무엇인지 설명하고 있어요. 핵심은 어림 수 짐작 능력이라는 개념과 숫자의 크기에 따른 정확성의 변화입니다. 자, 동물의 머릿속으로 한번 들어가 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">동물들이 숫자를 인식하는 방식인 \u003cb class=\"key\">어림 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>(Approximate Number System)은 인간의 수리 능력과는 조금 다릅니다. 이 시스템은 하나하나 정확히 세는 것이 아니라 전체적인 \u003cb class=\"key\">양의 \u003c/b>\u003cb class=\"key\">차이\u003c/b>를 직관적으로 느끼는 감각입니다. 일상에서 우리가 콩 주머니 두 개의 무게 차이를 느낄 때, 가벼울 때는 미세한 차이도 알지만 무거워지면 큰 차이만 알 수 있는 \u003cb class=\"key\">베버의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>(Weber's Law)과 유사합니다. 이는 포식자를 피하거나 먹이가 더 많은 곳을 빠르게 골라야 하는 \u003cb class=\"key\">야생의 \u003c/b>\u003cb class=\"key\">생존\u003c/b> 상황에서 발달한 본능적인 능력입니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 시작하기 전에 배경지식을 하나 알아두면 좋아요. 여러분, 사과 두 개와 세 개는 한눈에 구분이 가죠? 하지만 사과 백 개와 백 한 개를 눈으로만 보고 구분하기는 정말 어렵습니다. 이런 현상을 심리학에서는 베버의 법칙이라고 하는데요. 동물들도 우리처럼 대략적인 양을 파악하는 어림 수 시스템을 가지고 있어요. 이건 하나하나 세는 게 아니라 직관적으로 느끼는 감각이라서 숫자가 커질수록 헷갈리게 된답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>ANS의 정의\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>동물의 수 분별력을 설명하는 \u003cb class=\"key\">어림 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>을 소개하며, 이 시스템에는 \u003cb class=\"key\">정확성\u003c/b>이 결여되어 있음을 명시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>공통적 오류 패턴\u003csmall>원리 · 문장 3\u003c/small>\u003c/h4>\u003cp>모든 종에서 나타나는 특징으로, 숫자가 \u003cb class=\"key\">커질수록\u003c/b> 판별 능력이 \u003cb class=\"key\">부정확\u003c/b>해지는 패턴을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>동물 실험 사례\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>붉은털원숭이와 쥐의 실험을 통해, 특정 수치 이상의 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">숫자\u003c/b>에서 반응이 \u003cb class=\"key\">불분명\u003c/b>해짐을 입증합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>관찰의 결론\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>결국 동물의 수 감각에 있어 가장 결정적인 요소는 \u003cb class=\"key\">숫자의 \u003c/b>\u003cb class=\"key\">크기\u003c/b>라는 점을 강조하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 어림 수 시스템의 정의에서 시작해서 구체적인 실험 예시를 거쳐 결론으로 이어지는 아주 논리적인 구조를 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 전문 용어인 approximate number system을 소개합니다. 동물의 수 판단 능력을 말하는데, 이 시스템의 가장 큰 특징은 바로 precision, 즉 정확성이 없다는 점이라고 강조하며 글을 시작하죠.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 모든 종에서 공통으로 나타나는 특징적인 오류 패턴을 설명해요. 수량이 더 커질수록 discrimination, 즉 판별이 덜 정확해진다는 원리를 보여줍니다.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장은 구체적인 증거를 제시하는 단계예요. 붉은털원숭이는 다섯 이상의 숫자부터 헷갈리기 시작하고, 쥐 역시 숫자가 커질수록 레버를 누르는 횟수의 정확도가 두드러지게 떨어진다는 실험 결과를 보여주죠.","hl":"f2"},{"n":7,"text":"마지막 여섯 번째 문장은 전체 내용을 요약하는 결론이에요. 동물의 수 감각을 테스트할 때 가장 중요한 것은 결국 숫자의 크기라는 점을 다시 한번 못 박으며 끝을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">용어\u003c/b>인 어림 수 시스템을 정의하고, 마지막 문장에서 숫자의 크기가 중요하다는 \u003cb class=\"key\">주제\u003c/b>를 다시 한번 강조합니다. 중간 부분은 원숭이와 쥐의 구체적인 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>를 근거로 제시하여 주장의 신뢰도를 높이는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>What it does not provide (2)\u003c/b>\u003cspan>특성 강조\u003c/span>\u003cb>For example (implied) (4)\u003c/b>\u003cspan>예시 시작\u003c/span>\u003cb>It is a common observation (6)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">approximate number system\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">less accurate\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">markedly less and less precise\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">size of the numbers matters\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>작은 수 (Small quantities)\u003c/th>\u003cth>큰 수 (Larger quantities)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>높은 정확성\u003c/td>\u003ctd>낮은 정확성\u003c/td>\u003c/tr>\u003ctr>\u003ctd>1부터 5까지 구별\u003c/td>\u003ctd>5 이상은 실패\u003c/td>\u003c/tr>\u003ctr>\u003ctd>목표 숫자 적중\u003c/td>\u003ctd>목표 주변에 흩어짐\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 지문은 처음과 끝에 주제를 배치한 양괄식 구조를 취하고 있어요. 전개 방식은 개념을 먼저 제시하고 이를 뒷받침하는 구체적인 예시를 나열하는 주장과 근거 방식이죠. 덕분에 독자는 어려운 전문 용어를 실험 사례를 통해 쉽게 이해할 수 있습니다.","hl":"ty"},{"n":9,"text":"문장 곳곳에 단서가 숨어 있어요. 두 번째 문장의 What it does not provide는 이 시스템의 한계를 명확히 짚어주고요. 네 번째 문장부터는 별도의 연결어는 없지만 원숭이와 쥐의 사례가 나오며 예시 역할을 합니다. 마지막 문장의 common observation은 앞선 실험들을 통해 도출된 일반적인 결론임을 알려주는 아주 중요한 신호예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>technical term\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전문 용어\u003c/span>\u003c/div>\u003cdiv>\u003cb>describe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기술하다, 묘사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>judgement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>판단, 분별력\u003c/span>\u003c/div>\u003cdiv>\u003cb>approximate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어림잡은, 대략적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>precision\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정확성\u003c/span>\u003c/div>\u003cdiv>\u003cb>species\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종\u003c/span>\u003c/div>\u003cdiv>\u003cb>characteristic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특징적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>discrimination\u003c/b>\u003cem>명사\u003c/em>\u003cspan>판별, 구별\u003c/span>\u003c/div>\u003cdiv>\u003cb>accurate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정확한\u003c/span>\u003c/div>\u003cdiv>\u003cb>quantity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수량, 양\u003c/span>\u003c/div>\u003cdiv>\u003cb>Rhesus monkey\u003c/b>\u003cem>명사\u003c/em>\u003cspan>붉은털원숭이\u003c/span>\u003c/div>\u003cdiv>\u003cb>tell A from B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A와 B를 구별하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>upwards\u003c/b>\u003cem>부사\u003c/em>\u003cspan>위로, 이상으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>press\u003c/b>\u003cem>동사\u003c/em>\u003cspan>누르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lever\u003c/b>\u003cem>명사\u003c/em>\u003cspan>레버, 지렛대\u003c/span>\u003c/div>\u003cdiv>\u003cb>given\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주어진, 정해진\u003c/span>\u003c/div>\u003cdiv>\u003cb>markedly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>두드러지게, 현저하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>precise\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정확한\u003c/span>\u003c/div>\u003cdiv>\u003cb>response\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>top end\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상한선\u003c/span>\u003c/div>\u003cdiv>\u003cb>range\u003c/b>\u003cem>명사\u003c/em>\u003cspan>범위\u003c/span>\u003c/div>\u003cdiv>\u003cb>merely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>단지, 그저\u003c/span>\u003c/div>\u003cdiv>\u003cb>spread\u003c/b>\u003cem>명사\u003c/em>\u003cspan>확산, 퍼짐\u003c/span>\u003c/div>\u003cdiv>\u003cb>target\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목표\u003c/span>\u003c/div>\u003cdiv>\u003cb>observation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관찰\u003c/span>\u003c/div>\u003cdiv>\u003cb>accuracy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정확도\u003c/span>\u003c/div>\u003cdiv>\u003cb>number sense\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수 감각\u003c/span>\u003c/div>\u003cdiv>\u003cb>matter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>중요하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 꼭 기억해야 할 단어는 precision과 accuracy입니다. 둘 다 정확성이라는 뜻으로 이 글의 핵심 키워드죠. 또한 tell A from B는 구별하다라는 뜻의 숙어로 monkey 실험 문장에서 아주 중요하게 쓰였으니 반드시 외워두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">precision\u003c/b>\u003cspan class=\"m\">정확성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accuracy\u003c/span>\u003cspan class=\"s\">exactness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inaccuracy\u003c/span>\u003cspan class=\"a\">imprecision\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">approximate\u003c/b>\u003cspan class=\"m\">대략적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rough\u003c/span>\u003cspan class=\"s\">estimated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">precise\u003c/span>\u003cspan class=\"a\">exact\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discrimination\u003c/b>\u003cspan class=\"m\">판별, 구별\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distinction\u003c/span>\u003cspan class=\"s\">differentiation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">markedly\u003c/b>\u003cspan class=\"m\">두드러지게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significantly\u003c/span>\u003cspan class=\"s\">noticeably\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slightly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">matter\u003c/b>\u003cspan class=\"m\">중요하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">count\u003c/span>\u003cspan class=\"s\">be important\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어 정리도 해볼까요? precision의 동의어로 accuracy와 exactness를 꼭 챙기시고요. 대략적이라는 뜻의 approximate는 rough나 estimated로 바꿔 쓸 수 있습니다. 반대로 정확하다는 뜻의 precise나 exact는 반의어가 되겠죠? 마지막으로 중요하다는 뜻의 matter는 count와 의미가 통한다는 것도 기억하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전문 용어는\u003c/span>\u003cspan class=\"en\">The technical term\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자주 사용되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물들의 수에 대한 분별력을 기술하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">describe\u003c/span> animals' judgement of numbers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘어림 수 짐작 능력’이다.\u003c/span>\u003cspan class=\"en\">is the approximate number system.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">동물들의 수에 대한 분별력을 기술하는 데 자주 사용되는 전문 용어는 ‘어림 수 짐작 능력’이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물들이 숫자를 어떻게 인식하고 판단하는지를 설명하기 위해 \u003cb class=\"key\">어림 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">짐작 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이라는 용어를 도입하며 글을 시작합니다. 동물들이 정확한 수치보다는 \u003cb class=\"key\">대략적인 \u003c/b>\u003cb class=\"key\">수\u003c/b>를 느낀다는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : 명사(term) + [used (과거분사구)] : \"자주 사용되는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적/용도)\u003c/span> : used + [to describe (to부정사)] : \"기술하는 데 / 기술하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The technical term, 전문 용어는. often used, 자주 사용되는. to describe animals' judgement of numbers, 동물들의 수에 대한 분별력을 기술하는 데. is the approximate number system, ‘어림 수 짐작 능력’이다.. 이 문장 전체를 해석하면, 동물들의 수에 대한 분별력을 기술하는 데 자주 사용되는 전문 용어는 ‘어림 수 짐작 능력’이다.","hl":"m"},{"n":13,"text":"이 글은 동물이 숫자를 어떻게 인식하는지에 대한 이야기예요. 동물의 수 판단 방식을 전문 용어로 approximate number system, 즉 어림 수 짐작 능력이라고 부른다는 점을 먼저 소개하고 있죠.","hl":"mn"},{"n":14,"text":"첫 번째로 used는 앞의 명사를 꾸며주는 과거분사예요. 수동의 의미로 쓰여서 사용되는 이라고 해석하면 자연스러워요. 두 번째로 is는 이 문장의 진짜 동사예요. 주어가 The technical term이라는 단수 형태이기 때문에 단수 동사로 수를 일치시켰습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 제공하지 않는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">provide\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정확성이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is\u003c/span> precision.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것이 제공하지 않는 것은 정확성이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어림 수 시스템의 가장 큰 \u003cb class=\"key\">한계\u003c/b>를 명확히 짚어주는 문장입니다. 대략적인 양은 알 수 있어도 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">수\u003c/b>는 알지 못한다는 특징을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what이 이끄는 명사절\u003c/span> : What [관계대명사] + it [주어] + does not provide [동사] : \"그것이 제공하지 않는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 주어의 단수 취급\u003c/span> : What 절 [단수 주어] + is [단수 동사] : \"~이다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"What it does not provide, 그것이 제공하지 않는 것은. is precision, 정확성이다.. 이 문장 전체를 해석하면, 그것이 제공하지 않는 것은 정확성이다.","hl":"m"},{"n":16,"text":"앞에서 말한 시스템의 특징을 보완하는 문장이에요. 대략적인 건 알지만, 정확성, 즉 precision은 없다는 것이 이 시스템의 핵심적인 단점이라는 걸 강조하고 있습니다.","hl":"mn"},{"n":17,"text":"첫 번째로 What은 무엇이 아니라 것 이라고 해석하는 관계대명사예요. 뒤에 목적어가 빠진 불완전한 문장을 이끌며 문장 전체의 주어가 되죠. 두 번째로 명사절이 주어로 쓰일 때는 단수 취급을 하기 때문에 동사 자리에 are가 아닌 is를 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 보여주는데 ―\u003c/span>\u003cspan class=\"en\">It shows ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 동일하다\u003c/span>\u003cspan class=\"en\">and this is the same\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실험된 모든 종에서\u003c/span>\u003cspan class=\"en\">in every \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">species \u003c/span>\u003cspan class=\"tgt\">tested\u003c/span> ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특징적인 오류 패턴을\u003c/span>\u003cspan class=\"en\">a characteristic pattern of errors,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">판별이 덜 정확해지며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">discrimination \u003c/span>\u003cspan class=\"tgt\">becoming\u003c/span> less accurate\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수량이 더 커질수록.\u003c/span>\u003cspan class=\"en\">as the quantities get bigger.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 수량이 더 커질수록 판별이 덜 정확해지는 특징적인 오류 패턴을 보여 주는데, 이것은 실험된 모든 종에서 동일하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물의 수 인식이 가진 공통된 \u003cb class=\"key\">오류 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>을 설명합니다. 숫자가 \u003cb class=\"key\">커질수록\u003c/b> 변별력이 떨어지는 현상이 거의 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">종\u003c/b>에서 발견된다는 내용입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : 명사(species) + [tested (과거분사)] : \"실험된 종\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">with + 목적어 + 분사 (부대상황)\u003c/span> : with + 명사(discrimination) + [becoming (현재분사)] : \"판별이 ~해지는 가운데\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It shows ―, 그것은 보여주는데 ―. and this is the same, 이것은 동일하다. in every species tested ―, 실험된 모든 종에서. a characteristic pattern of errors, 특징적인 오류 패턴을. with discrimination becoming less accurate, 판별이 덜 정확해지며. as the quantities get bigger, 수량이 더 커질수록.. 이 문장 전체를 해석하면, 그것은 수량이 더 커질수록 판별이 덜 정확해지는 특징적인 오류 패턴을 보여 주는데, 이것은 실험된 모든 종에서 동일하다.","hl":"m"},{"n":19,"text":"숫자가 커질수록 실수가 많아진다는 구체적인 원리를 설명해요. 재미있는 건 이런 현상이 특정 동물 한 종류가 아니라, 실험을 거친 모든 생물 종에서 똑같이 나타난다는 점이죠.","hl":"mn"},{"n":20,"text":"첫 번째로 tested는 명사 species를 뒤에서 꾸며주는 과거분사예요. 실험된 종이라고 해석해야 하죠. 두 번째로 with discrimination becoming 부분은 아주 중요한데요. with 뒤에 명사와 분사가 와서 어떤 상황이 동시에 벌어지는지를 설명하는 부대상황 구문입니다. 판별이 덜 정확해지면서라고 해석하면 완벽합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">붉은털원숭이는\u003c/span>\u003cspan class=\"en\">Rhesus monkeys\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구별할 수 있지만\u003c/span>\u003cspan class=\"en\">can \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1과 2, 2와 3, 3과 4, 4와 5는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">two\u003c/span>, two from three, three from four, four from five ...\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실패하기 시작한다\u003c/span>\u003cspan class=\"en\">but start to fail\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">5위로는.\u003c/span>\u003cspan class=\"en\">from five upwards.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">붉은털원숭이는 1과 2, 2와 3, 3과 4, 4와 5는 구별할 수 있지만, 5위로는 실패하기 시작한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 붉은털원숭이가 적은 숫자는 정확히 인식하지만 숫자가 커지면 인지 능력이 떨어진다는 \u003cb class=\"key\">한계\u003c/b>를 보여줍니다. 숫자가 5를 넘어가면 동물들의 수 분별력이 급격히 낮아지는 \u003cb class=\"key\">증가\u003c/b>에 따른 정확도 하락의 예시입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">tell A from B 구문\u003c/span> : tell [동사] + A [목적어] + from [전치사] + B [대상] : \"1과 2를 구별하다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Rhesus monkeys, 붉은털원숭이는. can tell, 구별할 수 있지만. one from two, two from three, three from four, four from five, 1과 2, 2와 3, 3과 4, 4와 5는. but start to fail, 실패하기 시작한다. from five upwards, 5위로는.. 이 문장 전체를 해석하면, 붉은털원숭이는 1과 2, 2와 3, 3과 4, 4와 5는 구별할 수 있지만, 5위로는 실패하기 시작한다.","hl":"m"},{"n":22,"text":"붉은털원숭이의 사례를 통해 동물의 수 감각에 한계가 있다는 점을 설명해요. 작은 숫자는 잘 알지만 숫자가 증가함에 따라 그 능력이 어떻게 변하는지 보여주는 문장입니다.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 tell A from B 구문이에요. 여기서 tell은 말하는 게 아니라 A와 B를 구별하다라는 뜻으로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">레버를 누르도록 학습했던 쥐는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Rats \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">learned\u003c/span> to press a lever\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주어진 횟수만큼\u003c/span>\u003cspan class=\"en\">a given number of times,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네 번에서 스물네 번까지\u003c/span>\u003cspan class=\"en\">from four up to twenty­four,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두드러지게 점점 덜 정확해졌다\u003c/span>\u003cspan class=\"en\">became markedly \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">precise\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 반응에 있어서\u003c/span>\u003cspan class=\"en\">in their responses\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숫자가 커질수록\u003c/span>\u003cspan class=\"en\">as the number increased:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 범위의 상한선에 다다랐을 때\u003c/span>\u003cspan class=\"en\">by the top end of the range\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 단지 산출하곤 했다\u003c/span>\u003cspan class=\"en\">they would merely produce\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">퍼져 있는 숫자들을\u003c/span>\u003cspan class=\"en\">a spread of numbers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">목표(숫자) 주변에.\u003c/span>\u003cspan class=\"en\">around the target.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">네 번에서 스물네 번까지 주어진 횟수만큼 레버를 누르도록 학습했던 쥐는 숫자가 커질수록 그들의 반응에 있어서 두드러지게 점점 덜 정확해졌다. 그 범위의 상한선에 다다랐을 때, 그들은 단지 목표(숫자) 주변에 퍼져 있는 숫자들을 산출하곤 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실험 대상인 쥐가 숫자가 커질수록 \u003cb class=\"key\">정확성\u003c/b>이 떨어져 정확한 횟수가 아닌 목표 근처의 어림잡은 \u003cb class=\"key\">범위\u003c/b> 내의 행동을 보인다는 상세 설명입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : Rats [선행사] + that [관계대명사] + learned [동사] : \"학습했던 쥐\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 and 비교급\u003c/span> : less and less [부사구] + precise [형용사] : \"점점 덜 정확한\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Rats that learned to press a lever, 레버를 누르도록 학습했던 쥐는. a given number of times, 주어진 횟수만큼. from four up to twenty­four, 네 번에서 스물네 번까지. became markedly less and less precise, 두드러지게 점점 덜 정확해졌다. in their responses, 그들의 반응에 있어서. as the number increased, 숫자가 커질수록. by the top end of the range, 그 범위의 상한선에 다다랐을 때. they would merely produce, 그들은 단지 산출하곤 했다. a spread of numbers, 퍼져 있는 숫자들을. around the target, 목표(숫자) 주변에.. 이 문장 전체를 해석하면, 네 번에서 스물네 번까지 주어진 횟수만큼 레버를 누르도록 학습했던 쥐는 숫자가 커질수록 그들의 반응에 있어서 두드러지게 점점 덜 정확해졌다. 그 범위의 상한선에 다다랐을 때, 그들은 단지 목표(숫자) 주변에 퍼져 있는 숫자들을 산출하곤 했다.","hl":"m"},{"n":25,"text":"쥐를 대상으로 한 실험 결과네요. 숫자가 커지면 쥐들도 정확한 숫자를 맞추지 못하고 목표값 근처에서 대략적인 횟수만 채운다는 점을 아주 구체적으로 설명하고 있어요.","hl":"mn"},{"n":26,"text":"첫 번째로 Rats 뒤에 오는 that은 주격 관계대명사로 쥐가 어떤 상태인지 꾸며줍니다. 두 번째로 less and less precise는 점점 더 정확도가 떨어진다는 점을 강조하는 비교급 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공통된 관찰이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">common \u003c/span>\u003cspan class=\"tgt\">observation \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">측정할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> when testing\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물의 수 감각의 정확성을\u003c/span>\u003cspan class=\"en\">the accuracy of animals' number sense,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숫자의 크기가\u003c/span>\u003cspan class=\"en\">the size of the numbers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요하다는 것은.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">matters\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">동물의 수 감각의 정확성을 측정할 때, 숫자의 크기가 중요하다는 것은 공통된 관찰이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전체 지문의 내용을 요약하며, 동물의 수 인지에서 가장 핵심적인 요인이 \u003cb class=\"key\">숫자의 \u003c/b>\u003cb class=\"key\">크기\u003c/b>임을 밝히는 \u003cb class=\"key\">공통된 \u003c/b>\u003cb class=\"key\">관찰\u003c/b> 결과입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 진주어 구문\u003c/span> : It [가주어] + is [동사] + observation [보어] + that [접속사/진주어] : \"~라는 것은 흔한 관찰 내용이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 matter의 용법\u003c/span> : the size [주어] + matters [동사] : \"중요하다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It is a common observation, 공통된 관찰이다. that when testing, 측정할 때. the accuracy of animals' number sense, 동물의 수 감각의 정확성을. the size of the numbers, 숫자의 크기가. matters, 중요하다는 것은.. 이 문장 전체를 해석하면, 동물의 수 감각의 정확성을 측정할 때, 숫자의 크기가 중요하다는 것은 공통된 관찰이다.","hl":"m"},{"n":28,"text":"이 글의 최종 결론이에요. 여러 동물을 테스트해 보니 결국 숫자가 커지느냐 작으냐가 정확도를 결정하는 가장 중요한 요소라는 것을 정리해 줍니다.","hl":"mn"},{"n":29,"text":"문장 맨 앞의 It은 가주어이고 뒤에 나오는 that절 전체가 진짜 주어예요. 그리고 마지막 단어 matters는 중요하다라는 뜻의 동사로 쓰였으니 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>동물들의 수 판단 능력을 일컫는 전문 용어는 \u003cb class=\"key\">어림 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">짐작 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이다.\u003c/li>\u003cli>이 능력은 완벽하지 않으며, 숫자가 커질수록 판별의 \u003cb class=\"key\">정확도\u003c/b>가 떨어진다.\u003c/li>\u003cli>붉은털원숭이와 쥐 실험 결과, 수치가 커질수록 \u003cb class=\"key\">오류 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>이 뚜렷해졌다.\u003c/li>\u003cli>결국 동물의 수 감각에서 \u003cb class=\"key\">숫자의 \u003c/b>\u003cb class=\"key\">크기\u003c/b>는 정확성을 결정하는 핵심 요소이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Animals possess an approximate number system where the accuracy of number discrimination decreases as the quantities increase.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">동물들은 수량을 분별할 때 \u003cb class=\"key\">어림 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">짐작 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 사용하는데, 이는 숫자가 커질수록 \u003cb class=\"key\">정확성\u003c/b>이 떨어지는 특징을 보입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 수업은 여기까지입니다. 동물의 수 감각은 숫자가 커질수록 부정확해진다는 핵심 내용을 잘 정리했나요? 시험에서는 숫자의 크기와 정확도의 관계를 묻는 문제가 자주 나오니 그 부분을 중점적으로 복습하세요. 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
