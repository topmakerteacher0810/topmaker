@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 19번","audioDir":"19_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">19번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>A Funny Mistake: Where Is My Car?\u003c/h1>\u003ch2>유쾌한 실수: 내 차는 어디에?\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>식료품 쇼핑을 마친 후 주차장에서 자신의 차를 찾지 못해 당황했으나, 알고 보니 남편의 차를 타고 왔음을 깨닫고 \u003cb class=\"key\">실소\u003c/b>를 터뜨린 \u003cb class=\"key\">해프닝\u003c/b>에 관한 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The narrator realized her car wasn't missing but that she had driven her husband's car to the store.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 일상에서 누구나 한 번쯤 겪을 법한 아주 유쾌한 실수에 관한 지문을 함께 공부해 볼 거예요. 이 글은 쇼핑을 마친 한 여성이 주차장에서 겪은 당황스러운 사건과 그 반전 결말을 담고 있습니다. 전체적인 요지는 주인공이 차를 잃어버린 줄 알았지만, 알고 보니 남편의 차를 타고 왔다는 사실을 깨닫게 된다는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 일상에서 흔히 겪는 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">오류\u003c/b>(Cognitive Error) 중 하나인 \u003cb class=\"key\">기억의 \u003c/b>\u003cb class=\"key\">착오\u003c/b>(Memory Lapse)를 다루고 있습니다. 인간의 뇌는 익숙한 습관을 수행할 때 \u003cb class=\"key\">자동 \u003c/b>\u003cb class=\"key\">조종\u003c/b>(Autopilot) 모드로 작동하기 쉬운데, 주인공은 평소처럼 자기 차를 탔다고 믿었지만 사실은 남편의 차를 타는 \u003cb class=\"key\">부주의\u003c/b>(Inattention)를 범한 것이죠. 이는 마치 항상 쓰던 \u003cb class=\"key\">리모컨\u003c/b>이 제자리에 없어서 당황하다가, 어제 다른 곳에 두었던 사실을 뒤늦게 깨닫는 상황과 비슷합니다. 고등 영어 독해에서는 이러한 주인공의 \u003cb class=\"key\">심경 \u003c/b>\u003cb class=\"key\">변화\u003c/b>(Psychological Change)를 파악하는 것이 중요하며, 당혹감에서 안도로 이어지는 흐름을 이해해야 합니다.\u003c/div>","segs":[{"n":2,"text":"우리가 무언가에 집중하거나 너무 익숙한 일을 할 때 가끔 뇌가 자동 조종 모드로 작동하곤 하죠. 심리학에서는 이를 인지적 오류나 기억의 착오라고 부릅니다. 오늘 지문의 주인공도 평소 습관대로 자기 차를 찾았지만, 사실은 다른 차를 타고 온 것을 깜빡했어요. 마치 TV 리모컨을 냉장고에 넣어두고 찾는 것처럼, 우리 일상에서 흔히 일어나는 인지적 편향 현상 중 하나라고 볼 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>상황 발생\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>쇼핑을 마치고 나온 주인공이 지정된 \u003cb class=\"key\">주차 \u003c/b>\u003cb class=\"key\">장소\u003c/b>에 자신의 \u003cb class=\"key\">차가 \u003c/b>\u003cb class=\"key\">없음\u003c/b>을 발견하며 이야기가 시작됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>혼란과 확신\u003csmall>전개 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>자신의 \u003cb class=\"key\">기억력\u003c/b>에 대한 강한 확신이 있었기에, 상황을 도무지 \u003cb class=\"key\">이해\u003c/b>할 수 없어 당황하는 모습이 묘사됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>전화와 반전\u003csmall>전환 · 문장 6–10\u003c/small>\u003c/h4>\u003cp>남편에게 전화를 걸어 도움을 청하지만, 남편은 웃으며 주인공이 \u003cb class=\"key\">남편의 \u003c/b>\u003cb class=\"key\">차\u003c/b>를 타고 갔다는 \u003cb class=\"key\">진실\u003c/b>을 알려줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>해결과 안도\u003csmall>결론 · 문장 11–14\u003c/small>\u003c/h4>\u003cp>눈앞에 있는 남편의 차를 확인하고, 주인공은 자신의 실수에 \u003cb class=\"key\">실소\u003c/b>를 터뜨리며 \u003cb class=\"key\">안도의 \u003c/b>\u003cb class=\"key\">숨\u003c/b>을 내쉽니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 시간의 흐름에 따라 주인공의 심리가 어떻게 변하는지를 중심으로 총 네 단계로 나누어 볼 수 있습니다.","hl":null},{"n":4,"text":"첫 번째 단계인 도입부에서는 쇼핑을 마친 주인공이 주차장으로 향하지만, 있어야 할 곳에 자동차가 보이지 않아 당황하는 긴박한 상황이 그려집니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 주인공의 심리적 갈등이 깊어집니다. 본인은 절대 주차 위치를 잊어버릴 사람이 아니라고 확신하기 때문에, 눈앞의 상황이 도무지 이해되지 않는 혼란스러운 상태죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 드디어 사건의 실마리가 풀립니다. 남편에게 전화를 걸자, 남편이 웃으면서 오늘 당신이 내 차를 가져갔다는 사실을 상기시켜 주며 반전이 일어납니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계에서는 남편의 차를 발견하고 자신의 어처구니없는 실수에 웃음을 터뜨리는 안도와 결말로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 14번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 시간의 흐름에 따른 \u003cb class=\"key\">서사적 \u003c/b>\u003cb class=\"key\">구성\u003c/b>을 취하고 있으며, 마지막에 가서야 모든 \u003cb class=\"key\">오해\u003c/b>가 풀립니다. 주인공이 겪은 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">위기\u003c/b>가 남편의 대답을 통해 해소되는 \u003cb class=\"key\">반전\u003c/b> 구조를 가지고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>After finishing (1)\u003c/b>\u003cspan>시간적 배경 설정\u003c/span>\u003cb>But (2)\u003c/b>\u003cspan>예상치 못한 문제 발생\u003c/span>\u003cb>Not knowing (6)\u003c/b>\u003cspan>행동의 원인 제시\u003c/span>\u003cb>remember? (10)\u003c/b>\u003cspan>핵심 정보 제공\u003c/span>\u003cb>after all (14)\u003c/b>\u003cspan>최종 결론 암시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the grocery store\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the spot\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">my car\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">my car\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Your car\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mine\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 지문의 전개 방식은 시간의 순서에 따라 사건이 진행되는 서사적 구조입니다. 처음부터 끝까지 하나의 에피소드가 이어지다가, 마지막 열네 번째 문장에서 모든 것이 괜찮아졌다는 결론을 내리는 미괄식 구성을 취하고 있어요.","hl":"ty"},{"n":9,"text":"문장 곳곳에 단서가 숨어 있어요. 두 번째 문장의 But은 예상치 못한 문제의 시작을 알리고, 여섯 번째 문장의 Not knowing은 주인공의 막막한 상태를 보여줍니다. 특히 열 번째 문장의 remember라는 질문이 이 모든 미스터리를 푸는 핵심 신호어 역할을 하고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>finish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>마치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shopping\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쇼핑\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk out of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 걸어 나가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grocery store\u003c/b>\u003cem>명사\u003c/em>\u003cspan>식료품 가게\u003c/span>\u003c/div>\u003cdiv>\u003cb>head to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 향하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>spot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장소, 지점\u003c/span>\u003c/div>\u003cdiv>\u003cb>park\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주차하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>kind of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일종의, ~할 법한\u003c/span>\u003c/div>\u003cdiv>\u003cb>forget\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잊어버리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>right place\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정확한 장소\u003c/span>\u003c/div>\u003cdiv>\u003cb>look around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>주위를 둘러보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make sense\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이해가 되다, 타당하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>call\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>missing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>없어진, 분실된\u003c/span>\u003c/div>\u003cdiv>\u003cb>find\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>laugh\u003c/b>\u003cem>동사\u003c/em>\u003cspan>웃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>on the other end\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>(전화기) 반대편에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>line\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전화선, 통화\u003c/span>\u003c/div>\u003cdiv>\u003cb>outside\u003c/b>\u003cem>부사\u003c/em>\u003cspan>밖에\u003c/span>\u003c/div>\u003cdiv>\u003cb>take\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가져가다, 타다\u003c/span>\u003c/div>\u003cdiv>\u003cb>remember\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기억하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>돌아보다, 몸을 돌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cannot help but\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하지 않을 수 없다\u003c/span>\u003c/div>\u003cdiv>\u003cb>laugh at oneself\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자신의 실수에 실소하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sigh\u003c/b>\u003cem>명사\u003c/em>\u003cspan>한숨\u003c/span>\u003c/div>\u003cdiv>\u003cb>relief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안도, 안심\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk over to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 걸어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>after all\u003c/b>\u003cem>부사\u003c/em>\u003cspan>결국, 결국에는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 표현도 살펴볼까요? ~로 향하다라는 의미의 head to와 도무지 이해가 안 될 때 쓰는 make sense, 그리고 ~하지 않을 수 없다는 뜻의 cannot help but laugh 같은 표현은 꼭 익혀두어야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">spot\u003c/b>\u003cspan class=\"m\">장소\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">place\u003c/span>\u003cspan class=\"s\">location\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">missing\u003c/b>\u003cspan class=\"m\">없어진\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lost\u003c/span>\u003cspan class=\"s\">gone\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">present\u003c/span>\u003cspan class=\"a\">found\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sense\u003c/b>\u003cspan class=\"m\">이해, 의미\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">logic\u003c/span>\u003cspan class=\"s\">meaning\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nonsense\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb cla an class=\"ko\">내가 차를 주차했던.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">I'd \u003c/span>\u003cspan class=\"tgt\">parked\u003c/span> my car.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">쇼핑을 마친 후에, 나는 식료품 가게를 걸어 나가 내가 차를 주차했던 장소로 향했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 쇼핑을 마치고 차로 돌아가는 일상적인 상황으로 글의 \u003cb class=\"key\">배경\u003c/b>을 설정하고 있습니다. 자신이 차를 세워둔 \u003cb class=\"key\">특정한 \u003c/b>\u003cb class=\"key\">위치\u003c/b>를 기억하고 그곳으로 이동하는 화자의 모습이 나타납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : After [접속사] + finishing [현재분사] : \"마친 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사 where와 과거완료\u003c/span> : the spot [선행사] + where [관계부사] + I'd parked [과거완료] : \"내가 차를 주차했던\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"After finishing my shopping, 쇼핑을 마친 후에. I walked out of, 나는 걸어 나갔다. the grocery store, 식료품 가게를. and headed to the spot, 그리고 장소로 향했다. where I'd parked my car, 내가 차를 주차했던.. 이 문장 전체를 해석하면, 쇼핑을 마친 후에, 나는 식료품 가게를 걸어 나가 내가 차를 주차했던 장소로 향했다.","hl":"m"},{"n":13,"text":"쇼핑을 다 끝내고 나서 기분 좋게 자신의 차를 세워둔 곳으로 걸어가는 상황이에요. 주인공이 자신의 차가 어디 있는지 정확히 알고 그 장소로 향하고 있다는 점이 중요해요.","hl":"mn"},{"n":14,"text":"첫 번째로 After finishing은 접속사 After를 살려둔 분사구문이에요. 주어인 내가 직접 쇼핑을 마치는 것이니까 능동형인 현재분사를 썼죠. 두 번째로 where I'd parked에서는 관계부사 where가 앞의 장소를 꾸며주고 있어요. 여기서 I'd는 I had의 줄임말로, 가게 밖으로 나오기 전인 과거보다 더 이전에 주차를 했다는 과거완료 시제를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 \u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 거기에 없었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it\u003c/span> wasn't there.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 그것이 거기에 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 당연히 있어야 할 차가 사라진 \u003cb class=\"key\">반전\u003c/b>의 상황을 짧고 강렬하게 제시합니다. 독자에게 주인공의 \u003cb class=\"key\">당혹감\u003c/b>과 궁금증을 즉각적으로 전달하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사의 지칭\u003c/span> : it = my car : \"그것 (내 차)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But, 그러나. it wasn't there, 그것이 거기에 없었다.. 이 문장 전체를 해석하면, 그러나 그것이 거기에 없었다.","hl":"m"},{"n":16,"text":"아주 짧지만 강력한 문장이에요. 차가 있어야 할 자리에 없다는 걸 알게 되면서 평화롭던 분위기가 갑자기 긴장감 있게 바뀝니다.","hl":"mn"},{"n":17,"text":"여기서 대명사 it은 바로 앞 문장에서 말했던 나의 차, 즉 my car를 가리킵니다. there는 내가 주차를 했다고 생각해서 찾아갔던 그 특정한 장소를 의미해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 아니었다 \u003c/span>\u003cspan class=\"en\">I wasn't\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 사람이 \u003c/span>\u003cspan class=\"en\">the kind of person\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잊어버릴 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">forget\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 주차했던 장소를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">I'd \u003c/span>\u003cspan class=\"tgt\">parked\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 내가 주차했던 장소를 잊어버릴 그런 사람이 아니었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공이 평소에 꼼꼼하거나 \u003cb class=\"key\">기억력\u003c/b>이 나쁘지 않다는 성격을 보여줍니다. 자신의 \u003cb class=\"key\">기억\u003c/b>에 대한 확신이 있기 때문에 차가 없어진 상황이 더 \u003cb class=\"key\">비현실적\u003c/b>으로 느껴지게 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : person [명사] + to forget [to부정사] : \"잊어버릴\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문과 과거완료\u003c/span> : where [의문사] + I [주어] + 'd parked [동사(과거완료)] : \"내가 주차했던 곳을\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"I wasn't, 나는 아니었다. the kind of person, 그런 사람이. to forget, 잊어버릴. where I'd parked, 내가 주차했던 장소를.. 이 문장 전체를 해석하면, 나는 내가 주차했던 장소를 잊어버릴 그런 사람이 아니었다.","hl":"m"},{"n":19,"text":"주인공은 평소에 건망증이 있는 사람이 아니라는 걸 강조하고 있어요. 내가 내 차 위치를 잊어버릴 리가 없는데 차가 없으니까 훨씬 더 당황스러운 거죠.","hl":"mn"},{"n":20,"text":"첫 번째로 to forget은 앞의 명사 person을 꾸며주는 to부정사의 형용사적 용법이에요. 잊어버릴 사람이라고 해석하죠. 두 번째로 where I'd parked는 forget의 목적어 자리로 쓰인 간접의문문이에요. 의문사, 주어, 동사 순서로 쓰고 있고, 주차한 것이 과거보다 더 옛날 일이라 여기서도 과거완료 시제를 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 알았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">knew \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 정확한 장소에 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">was\u003c/span> in the right place\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">― 그렇다면 내 차는 어디에 있는 걸까?\u003c/span>\u003cspan class=\"en\">― so where was my car?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 내가 정확한 장소에 있다는 것을 알았지만, 그렇다면 내 차는 어디에 있는 걸까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공은 자신의 기억이 틀리지 않았다고 확신하지만, 눈앞의 현실과 달라 \u003cb class=\"key\">당혹감\u003c/b>을 느끼고 있습니다. 자신이 주차한 곳이 맞음에도 차가 보이지 않는 상황을 통해 이야기의 \u003cb class=\"key\">긴장감\u003c/b>을 고조시킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : knew + [(that) + 주어 + 동사] : \"내가 ~라는 것을 알았다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"I knew, 나는 알았다. I was in the right place, 내가 정확한 장소에 있다는 것을. ― so where was my car?, ― 그렇다면 내 차는 어디에 있는 걸까?. 이 문장 전체를 해석하면, 나는 내가 정확한 장소에 있다는 것을 알았지만, 그렇다면 내 차는 어디에 있는 걸까?","hl":"m"},{"n":22,"text":"주인공은 자기가 주차한 장소가 여기가 맞다고 확신하는데 차가 없으니까 아주 당황스러워하고 있어요. 이 질문을 통해서 독자들도 차가 대체 어디로 갔을지 궁금하게 만드는 부분이죠.","hl":"mn"},{"n":23,"text":"첫 번째로 I knew와 I was 사이에는 접속사 that이 생략되어 있어요. 동사 뒤에 새로운 주어와 동사가 나오면 무엇무엇을 알았다는 의미로 that이 숨어 있다고 생각하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 주위를 둘러보았지만,\u003c/span>\u003cspan class=\"en\">I looked around,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도무지 아무것도 이해되지 않았다.\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">nothing \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">sense\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 주위를 둘러보았지만, 도무지 아무것도 이해되지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주변을 확인해 봐도 차가 사라진 이유를 찾지 못해 상황이 \u003cb class=\"key\">비논리적\u003c/b>으로 느껴짐을 표현합니다. 아무리 생각해도 원인을 알 수 없는 주인공의 \u003cb class=\"key\">혼란스러운 \u003c/b>\u003cb class=\"key\">심경\u003c/b>을 잘 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 주어를 활용한 전체 부정\u003c/span> : nothing + [동사] : \"아무것도 이해되지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"I looked around, 나는 주위를 둘러보았지만. but nothing made sense, 도무지 아무것도 이해되지 않았다.. 이 문장 전체를 해석하면, 나는 주위를 둘러보았지만, 도무지 아무것도 이해되지 않았다.","hl":"m"},{"n":25,"text":"주변을 아무리 살펴봐도 왜 차가 없는지 도통 알 수가 없어서 머릿속이 하얘진 상태를 말하고 있어요. 말이 안 되는 상황에 놓인 주인공의 혼란이 느껴지시나요?","hl":"mn"},{"n":26,"text":"첫 번째로 주어 자리에 nothing이 쓰인 점에 주목해 보세요. 영어에서는 주어에 부정을 나타내는 말이 오면 동사를 부정해서 아무것도 이해되지 않았다고 해석하는 전체 부정의 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몰라,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Not \u003c/span>\u003cspan class=\"tgt\">knowing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇을 해야 할지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 집에 있는 남편에게 전화를 걸어\u003c/span>\u003cspan class=\"en\">I called my husband at home\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“내 차가 없어졌어요!”라고 말했다.\u003c/span>\u003cspan class=\"en\">and said, &quot;My car is missing!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무엇을 해야 할지 몰라, 나는 집에 있는 남편에게 전화를 걸어 “내 차가 없어졌어요!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스스로 해결책을 찾지 못하는 \u003cb class=\"key\">당혹감\u003c/b> 때문에 남편에게 도움을 요청하는 장면입니다. 문장 앞부분의 분사구문은 주인공이 전화를 건 \u003cb class=\"key\">이유\u003c/b>를 설명해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 분사구문\u003c/span> : Not + [현재분사(V-ing)] : \"알지 못해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사\u003c/span> : what + [to-v] : \"무엇을 해야 할지\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Not knowing, 몰라. what to do, 무엇을 해야 할지. I called my husband at home, 나는 집에 있는 남편에게 전화를 걸어. and said, \"My car is missing!, “내 차가 없어졌어요!”라고 말했다.. 이 문장 전체를 해석하면, 무엇을 해야 할지 몰라, 나는 집에 있는 남편에게 전화를 걸어 “내 차가 없어졌어요!","hl":"m"},{"n":28,"text":"어떻게 해야 할지 몰라서 남편에게 전화해 차가 없어졌다고 다급하게 말하는 장면이에요. 이 당황스러운 목소리가 남편에게는 어떻게 들렸을지 상상해 보세요.","hl":"mn"},{"n":29,"text":"첫 번째로 문장 맨 앞의 Not knowing은 이유를 나타내는 분사구문이에요. 원래 As I did not know였던 문장이 짧아진 것인데 분사구문의 부정은 앞에 not을 쓴다는 게 중요합니다. 두 번째로 what to do는 무엇을 할지라는 뜻으로 knowing의 목적어 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할 수 없어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">찾을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">find\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내\u003c/span>\u003cspan class=\"en\">my\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차를.&quot;\u003c/span>\u003cspan class=\"en\">car.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 차를 못 찾겠어요.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자가 자신의 차가 없어졌다고 확신하며 \u003cb class=\"key\">절박함\u003c/b>을 드러내는 장면입니다. 주차 위치를 잊어버리지 않는다고 자신했기에 현재의 상황에 더욱 \u003cb class=\"key\">당혹감\u003c/b>을 느낍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cs \u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">웃는 것 외에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">laugh\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나 자신에 대해.\u003c/span>\u003cspan class=\"en\">at \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">myself\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 실소를 금할 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신이 저지른 황당한 실수에 대해 스스로 어이가 없어 \u003cb class=\"key\">웃음\u003c/b>을 터뜨리는 모습입니다. 당황스러웠던 감정이 \u003cb class=\"key\">해소\u003c/b>되는 마무리 부분입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">cannot help but + 동사원형\u003c/span> : cannot help but + [laugh (동사원형)] : \"웃지 않을 수 없었다 (실소를 금할 수 없었다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사 (재귀적 용법)\u003c/span> : laugh at + [myself (재귀대명사/목적어)] : \"나 자신을\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"I couldn't help, 나는 할 수 없었다. but laugh, 웃는 것 외에는. at myself, 나 자신에 대해.. 이 문장 전체를 해석하면, 나는 실소를 금할 수 없었다.","hl":"m"},{"n":46,"text":"자신의 어처구니없는 착각을 깨닫고 스스로를 비웃으며 허탈해하는 장면이에요. 긴박했던 상황이 웃음으로 마무리되는 따뜻하고 유머러스한 문장입니다.","hl":"mn"},{"n":47,"text":"이 문장은 서술형으로 나오기 정말 좋아요. 첫 번째로 couldn't help but laugh 표현을 보세요. ~하지 않을 수 없다는 뜻의 관용구인데, laugh 자리에 동사원형을 써야 한다는 것이 가장 중요합니다. 두 번째로 myself는 주어인 나 자신이 다시 목적어 자리에 왔기 때문에 쓰는 재귀 용법입니다. me라고 쓰면 틀리니 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안도의 숨을 내쉬며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">sigh \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">relief\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 걸어갔다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">walked \u003c/span>\u003cspan class=\"tgt\">over\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차로.\u003c/span>\u003cspan class=\"en\">to the car.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안도의 숨을 내쉬며, 나는 차로 걸어갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 당황했던 마음을 가라앉히고 \u003cb class=\"key\">안도감\u003c/b>을 느끼는 장면입니다. 자신의 착각을 깨닫고 상황이 평화롭게 \u003cb class=\"key\">마무리\u003c/b>되는 지점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(부수 상황)\u003c/span> : With + 명사구 : \"안도의 숨을 내쉬며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사\u003c/span> : walk + over : \"걸어가다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"With a sigh of relief, 안도의 숨을 내쉬며. I walked over, 나는 걸어갔다. to the car, 차로.. 이 문장 전체를 해석하면, 안도의 숨을 내쉬며, 나는 차로 걸어갔다.","hl":"m"},{"n":49,"text":"차를 잃어버린 줄 알고 깜짝 놀랐던 주인공이 남편의 말을 듣고 안심하는 모습이에요. 드디어 안도감을 느끼며 자신의 차가 아닌 남편의 차를 향해 가는 상황을 보여주는 장면이죠.","hl":"mn"},{"n":50,"text":"첫 번째로 With a sigh of relief 부분을 보세요. 전치사 With를 써서 주인공이 어떤 상태로 행동하는지를 보충 설명하고 있어요. 두 번째로 walked over는 어디를 향해 성큼성큼 다가가는 대상이 있음을 강조하는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것이 괜찮았다\u003c/span>\u003cspan class=\"en\">Everything was fine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결국 모든 것이 괜찮았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소동이 벌어졌지만 결국 큰 문제 없이 해결되었음을 나타내는 \u003cb class=\"key\">결말\u003c/b>입니다. 일상의 소소한 \u003cb class=\"key\">해프닝\u003c/b>을 긍정적인 어조로 끝맺음합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사구(결과 강조)\u003c/span> : after + all : \"결국, 결국에는\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Everything was fine, 모든 것이 괜찮았다. after all, 결국.. 이 문장 전체를 해석하면, 결국 모든 것이 괜찮았다.","hl":"m"},{"n":52,"text":"모든 걱정이 사라지고 평온한 일상으로 돌아온 결말이에요. 차를 잃어버린 줄 알았던 소동이 즐거운 해프닝으로 끝났음을 보여줍니다.","hl":"mn"},{"n":53,"text":"마지막으로 after all을 주목해 보세요. 이 표현은 문장 끝에서 우리가 처음에 걱정했던 것과는 다르게 최종적인 결과가 아주 좋게 마무리되었다는 사실을 강조해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>쇼핑을 끝내고 \u003cb class=\"key\">주차 \u003c/b>\u003cb class=\"key\">장소\u003c/b>로 갔으나 자신의 차가 없음을 발견하고 당황함\u003c/li>\u003cli>자신의 기억력을 믿었기에 차를 찾지 못하는 상황이 \u003cb class=\"key\">이해되지 \u003c/b>\u003cb class=\"key\">않음\u003c/b>\u003c/li>\u003cli>남편에게 전화하자 주인공이 오늘 \u003cb class=\"key\">남편의 \u003c/b>\u003cb class=\"key\">차\u003c/b>를 가져갔다는 사실을 알려줌\u003c/li>\u003cli>자신의 실수를 깨닫고 \u003cb class=\"key\">실소\u003c/b>를 터뜨리며 안도하며 마무리됨\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The narrator realized her car wasn't missing but that she had driven her husband's car to the store.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">식료품 쇼핑을 마친 후 주차장에서 자신의 차를 찾지 못해 당황했으나, 알고 보니 남편의 차를 타고 왔음을 깨닫고 \u003cb class=\"key\">실소\u003c/b>를 터뜨린 \u003cb class=\"key\">해프닝\u003c/b>에 관한 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"자, 오늘 지문은 아주 재미있으면서도 문장 구조가 명확해서 공부하기 좋았죠? 주인공의 당황스러운 감정이 안도로 바뀌는 과정을 잘 이해하셨길 바랍니다. 마지막 문장의 after all이라는 표현처럼 결국 모든 해프닝은 웃음으로 끝났네요. 오늘 배운 표현들 복습하는 것 잊지 마세요! 수고하셨습니다.","hl":null}]}]});</script></body></html>
