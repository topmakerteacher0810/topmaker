<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고1 모의고사 41~42 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고1 모의고사 41~42","audioDir":"41-42_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.935em\">41~42\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>The Paradox of AI: Why Convenience Could Kill Human Creativity\u003c/h1>\u003ch2>AI의 역설: 편의성이 인간의 창의성을 죽일 수 있는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">창의성\u003c/b>은 수많은 시행착오와 실험을 거치는 고통스러운 과정 속에서 발달하지만, \u003cb class=\"key\">AI\u003c/b>의 즉각적인 해결책과 기존 데이터 기반의 모방적 생성 방식은 인간의 독창적인 \u003cb class=\"key\">재능 \u003c/b>\u003cb class=\"key\">발달\u003c/b>을 저해할 위험이 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>While AI offers efficiency in content generation, it risks undermining human creativity by skipping the essential trial-and-error process and fostering a cycle of imitation.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 인공지능 시대에 우리가 반드시 고민해봐야 할 주제인 창의성에 대해 함께 공부해 보겠습니다. 이번 지문은 AI가 창의적인 도구로서 가지는 편리함 이면에 숨겨진 위험성을 경고하고 있어요. 핵심은 AI가 인간의 독창성과 재능 발달을 어떻게 방해할 수 있는지를 이해하는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">최근 챗GPT와 같은 \u003cb class=\"key\">생성형 \u003c/b>\u003cb class=\"key\">AI\u003c/b>(Generative AI)가 등장하며 누구나 쉽게 결과물을 만들어낼 수 있게 되었습니다. 하지만 AI는 본질적으로 기존 데이터를 학습하여 확률적으로 다음 단어나 이미지를 예측하는 \u003cb class=\"key\">확률적 \u003c/b>\u003cb class=\"key\">앵무새\u003c/b>(Stochastic Parrot)의 특성을 가집니다. 마치 미리 손질된 재료와 레시피로 만드는 \u003cb class=\"key\">밀키트\u003c/b>(Meal Kit) 요리가 편리하지만 요리사의 실력을 키워주지는 못하는 것과 같습니다. 이 글은 진정한 \u003cb class=\"key\">독창성\u003c/b>(originality)을 얻기 위해 필요한 고통스러운 \u003cb class=\"key\">시행착오\u003c/b>(trial and error)의 가치를 강조하고 있습니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 학습에 앞서 배경지식을 좀 알아볼까요? 요즘 생성형 AI는 소설도 쓰고 그림도 그리죠. 하지만 AI는 새로운 것을 무에서 창조하는 게 아니라, 이미 존재하는 방대한 데이터를 분석해서 그 패턴을 따라 하는 겁니다. 그래서 이 글에서는 AI에 너무 의존하면 우리가 직접 고민하고 실패하며 배우는 과정이 사라져버릴 수 있다는 점을 강조하고 있어요. 마치 내비게이션에만 의존하다 보면 스스로 길을 찾는 능력을 잃어버리는 것과 비슷하답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>창의성의 정의\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">창의성\u003c/b>을 새롭고 가치 있는 아이디어를 내는 능력으로 정의하며, \u003cb class=\"key\">확산적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>와 위험 감수라는 핵심 요소를 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>AI의 잠재적 위험\u003csmall>전환 및 문제 제기 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>AI가 강력한 도구이긴 하지만, 기존 데이터에 의존하기 때문에 \u003cb class=\"key\">독창성\u003c/b>을 제한하고 창작자를 \u003cb class=\"key\">모방\u003c/b>의 굴레에 가둘 수 있음을 경고합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>창의적 과정의 본질\u003csmall>근거 및 강조 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>진정한 돌파구는 지저분하고 반복적인 \u003cb class=\"key\">실험\u003c/b>과 \u003cb class=\"key\">어려움\u003c/b>을 통해 자신의 기술을 연마할 때 비로소 얻어지는 것임을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>학습 과정의 생략\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>AI의 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>이 필수적인 \u003cb class=\"key\">시행착오\u003c/b> 과정을 건너뛰게 만들어 결국 창의적 재능 발달을 가로막는다는 결론을 내립니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 지문의 전체적인 흐름을 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장인 도입부에서는 창의성의 본질을 정의합니다. 창의성은 단순히 새로운 것을 만드는 게 아니라, 확산적 사고와 위험을 감수하려는 의지가 필요하다고 설명하죠.","hl":"f0"},{"n":5,"text":"세 번째 문장부터 여섯 번째 문장까지는 AI의 위험성을 경고합니다. AI는 기존 데이터를 기반으로 작동하기 때문에 우리를 모방의 순환 속에 가두고 독창성을 제한할 수 있다는 문제를 제기하고 있어요.","hl":"f1"},{"n":6,"text":"일곱 번째 문장부터 아홉 번째 문장에서는 창의적인 과정의 진짜 가치를 강조합니다. 혁신적인 결과는 고통스러운 노력과 수많은 실패, 즉 시행착오를 통해서만 얻을 수 있다는 점을 분명히 합니다.","hl":"f2"},{"n":7,"text":"마지막 열 번째 문장은 결론입니다. AI가 주는 즉각적인 해결책이 학습에 꼭 필요한 시행착오라는 본질적인 과정을 건너뛰게 만들어서, 결국 우리의 창의적 재능이 자라나는 것을 막는다는 강력한 경고를 던집니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 전반부에서는 창의성의 정의와 AI의 특징을 \u003cb class=\"key\">비교\u003c/b>하며 문제를 제기합니다. 이후 후반부에서 창의성의 본질적 과정을 설명하며, AI의 \u003cb class=\"key\">편의성\u003c/b>이 가져올 부정적 결과인 10번 문장을 통해 최종적인 \u003cb class=\"key\">주장\u003c/b>을 전달하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>While (3)\u003c/b>\u003cspan>대조를 통한 문제 제기 시작\u003c/span>\u003cb>Moreover (7)\u003c/b>\u003cspan>추가적인 부작용 열거\u003c/span>\u003cb>If (10)\u003c/b>\u003cspan>조건을 통한 최종 경고\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">creativity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">novel and valuable ideas\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">originality and innovation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">genuine originality\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">unique perspectives\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">true creative talent\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>인간의 창의적 과정\u003c/th>\u003cth>AI 기반 콘텐츠 생성\u003c/th>\u003c/tr>\u003ctr>\u003ctd>시행착오와 수많은 실패 수반\u003c/td>\u003ctd>즉각적인 해결책 제공\u003c/td>\u003c/tr>\u003ctr>\u003ctd>독창성과 경계를 넓힘\u003c/td>\u003ctd>기존 데이터의 모방과 제약\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 인간의 창의적 과정과 AI의 작동 방식을 비교하며 대조하는 구조를 가지고 있습니다. 처음에는 창의성을 정의하고 마지막에 AI의 위험성을 경고하는 미괄식 구성을 취하고 있죠.","hl":"ty"},{"n":9,"text":"문장 연결 고리를 주목해 보세요. 세 번째 문장의 While은 AI의 장점과 단점을 대조하기 시작합니다. 일곱 번째 문장의 Moreover는 AI의 또 다른 부정적 측면을 추가하며 논의를 심화시키죠. 마지막 열 번째 문장의 If는 조건문을 활용해 AI가 미칠 결정적인 악영향을 요약해 주고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>creativity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>창의성\u003c/span>\u003c/div>\u003cdiv>\u003cb>ability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>generate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들어 내다, 발생시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>novel\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>새로운, 참신한\u003c/span>\u003c/div>\u003cdiv>\u003cb>valuable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가치 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>divergent thinking\u003c/b>\u003cem>명사\u003c/em>\u003cspan>확산적 사고\u003c/span>\u003c/div>\u003cdiv>\u003cb>willingness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의지, 기꺼이 하는 마음\u003c/span>\u003c/div>\u003cdiv>\u003cb>experiment\u003c/b>\u003cem>동사\u003c/em>\u003cspan>실험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take risks\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>위험을 감수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>originality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>독창성\u003c/span>\u003c/div>\u003cdiv>\u003cb>innovation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>혁신\u003c/span>\u003c/div>\u003cdiv>\u003cb>algorithm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>알고리즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>existing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기존의\u003c/span>\u003c/div>\u003cdiv>\u003cb>dataset\u003c/b>\u003cem>명사\u003c/em>\u003cspan>데이터 세트\u003c/span>\u003c/div>\u003cdiv>\u003cb>identify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>식별하다, 확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>derivative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>모방적인, 파생적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>genuine\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진정한, 진짜의\u003c/span>\u003c/div>\u003cdiv>\u003cb>rely on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 의존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inspiration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영감\u003c/span>\u003c/div>\u003cdiv>\u003cb>imitation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모방\u003c/span>\u003c/div>\u003cdiv>\u003cb>constraint\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제한, 제약\u003c/span>\u003c/div>\u003cdiv>\u003cb>break free from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 벗어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>breakthrough\u003c/b>\u003cem>명사\u003c/em>\u003cspan>획기적인 발전, 돌파구\u003c/span>\u003c/div>\u003cdiv>\u003cb>messy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>골치 아픈, 지저분한\u003c/span>\u003c/div>\u003cdiv>\u003cb>setback\u003c/b>\u003cem>명사\u003c/em>\u003cspan>좌절, 차질\u003c/span>\u003c/div>\u003cdiv>\u003cb>refine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연마하다, 정제하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unique perspective\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고유한 관점\u003c/span>\u003c/div>\u003cdiv>\u003cb>instant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>즉각적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>trial and error\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시행착오\u003c/span>\u003c/div>\u003cdiv>\u003cb>inhibit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방해하다, 억제하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어를 몇 개 짚어볼게요. divergent thinking은 창의성의 핵심인 확산적 사고를 뜻하고, derivative는 독창성이 없는 모방적인이라는 뜻으로 AI의 한계를 설명할 때 아주 중요한 표현입니다. 마지막 문장의 inhibit는 방해하다 혹은 억제하다라는 뜻으로 글의 주제를 완성하는 단어니까 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">novel\u003c/b>\u003cspan class=\"m\">새로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">innovative\u003c/span>\u003cspan class=\"s\">original\u003c/span>\u003cspan class=\"s\">fresh\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">traditional\u003c/span>\u003cspan class=\"a\">conventional\u003c/span>\u003cspan class=\"a\">old\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inhibit\u003c/b>\u003cspan class=\"m\">방해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hinder\u003c/span>\u003cspan class=\"s\">stifle\u003c/span>\u003cspan class=\"s\">impede\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">facilitate\u003c/span>\u003cspan class=\"a\">promote\u003c/span>\u003cspan class=\"a\">encourage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">derivative\u003c/b>\u003cspan class=\"m\">모방적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">imitative\u003c/span>\u003cspan class=\"s\">unoriginal\u003c/span>\u003cspan class=\"s\">copied\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unique\u003c/span>\u003cspan class=\"a\">creative\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">genuine\u003c/b>\u003cspan class=\"m\">진정한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">authentic\u003c/span>\u003cspan class=\"s\">real\u003c/span>\u003cspan class=\"s\">legitimate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fake\u003c/span>\u003cspan class=\"a\">counterfeit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">refine\u003c/b>\u003cspan class=\"m\">연마하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">improve\u003c/span>\u003cspan class=\"s\">perfect\u003c/span>\u003cspan class=\"s\">polish\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 봅시다. novel은 새로운이라는 뜻으로 innovative와 바꿔 쓸 수 있지만, traditional과는 반대되는 개념이에요. inhibit는 무언가를 방해하는 것이니 hinder와 비슷하지만, 촉진하는 facilitate와는 반대말입니다. 이 단어들은 시험 문제에서 바꿔치기 되어 나올 확률이 높으니 세트로 외워두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창의성이란 ~이다\u003c/span>\u003cspan class=\"en\">Creativity is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">능력\u003c/span>\u003cspan class=\"en\">the ability\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새롭고 가치 있는 아이디어를 만들어 내는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">generate\u003c/span> novel and valuable ideas.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">창의성이란 새롭고 가치 있는 아이디어를 만들어 내는 능력이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 창의성의 정의를 내리는 문장으로, 단순히 새로운 것뿐만 아니라 \u003cb class=\"key\">가치\u003c/b>까지 포함해야 진정한 창의성임을 강조합니다. 글의 \u003cb class=\"key\">도입부\u003c/b>로서 핵심 소재인 창의성을 명확히 규정합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : ability [명사] + [to generate (to부정사구/수식어)] : \"만들어 내는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Creativity is, 창의성이란 ~이다. the ability, 능력. to generate novel and valuable ideas, 새롭고 가치 있는 아이디어를 만들어 내는. 이 문장 전체를 해석하면, 창의성이란 새롭고 가치 있는 아이디어를 만들어 내는 능력이다.","hl":"m"},{"n":13,"text":"이 글의 주인공인 창의성이 무엇인지 정의하며 시작하고 있어요. 단순히 남다른 것만 아니라 가치까지 있어야 한다는 점이 핵심입니다.","hl":"mn"},{"n":14,"text":"명사인 ability 뒤에 나온 to generate는 형용사적 용법으로 쓰였습니다. 무엇을 하는 능력인지 설명해 주는 구조를 잘 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 포함한다\u003c/span>\u003cspan class=\"en\">It involves\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확산적 사고, 상상력,\u003c/span>\u003cspan class=\"en\">divergent thinking, imagination,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 의지\u003c/span>\u003cspan class=\"en\">and a willingness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실험을 하고 위험을 감수하려는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">experiment \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">take\u003c/span> risks.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 확산적 사고, 상상력, 그리고 실험을 하고 위험을 감수하려는 의지를 포함한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 창의성을 구성하는 구체적인 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>들을 나열하고 있습니다. 특히 실패를 두려워하지 않는 \u003cb class=\"key\">도전 \u003c/b>\u003cb class=\"key\">정신\u003c/b>이 창의성의 바탕이 됨을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법과 병렬 구조\u003c/span> : willingness [명사] + [to experiment and (to) take (to부정사구/수식어)] : \"실험을 하고 감수하려는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"It involves, 그것은 포함한다. divergent thinking, imagination, 확산적 사고, 상상력. and a willingness, 그리고 의지. to experiment and take risks, 실험을 하고 위험을 감수하려는. 이 문장 전체를 해석하면, 그것은 확산적 사고, 상상력, 그리고 실험을 하고 위험을 감수하려는 의지를 포함한다.","hl":"m"},{"n":16,"text":"창의성이 구체적으로 어떤 과정을 거쳐 나오는지 설명하고 있어요. 특히 위험을 감수하려는 의지가 중요하다는 점을 짚어주고 있네요.","hl":"mn"},{"n":17,"text":"여기서 to experiment and take 부분은 willingness를 꾸며주는 형용사적 용법이에요. 접속사 and가 두 동사를 나란히 연결하고 있는 병렬 구조도 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI는 강력한 도구가 될 수 있지만\u003c/span>\u003cspan class=\"en\">While AI can be a powerful tool\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창의적인 노력을 위한\u003c/span>\u003cspan class=\"en\">for creative efforts,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 위험을 수반한다\u003c/span>\u003cspan class=\"en\">it also carries the risk\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독창성과 혁신을 제한할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">limiting\u003c/span> originality and innovation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">AI는 창의적인 노력을 위한 강력한 도구가 될 수 있지만, 또한 독창성과 혁신을 제한할 위험을 수반한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 흐름이 반전되는 부분으로, AI의 \u003cb class=\"key\">양면성\u003c/b>을 제시합니다. 유용한 도구이지만 동시에 인간의 \u003cb class=\"key\">독창성\u003c/b>을 해칠 수 있다는 경고를 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사의 목적어(동명사)\u003c/span> : risk [명사] + [of (전치사)] + [limiting (동명사/목적어)] : \"제한할\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"While AI can be a powerful tool, AI는 강력한 도구가 될 수 있지만. for creative efforts, 창의적인 노력을 위한. it also carries the risk, 또한 위험을 수반한다. of limiting originality and innovation, 독창성과 혁신을 제한할. 이 문장 전체를 해석하면, AI는 창의적인 노력을 위한 강력한 도구가 될 수 있지만, 또한 독창성과 혁신을 제한할 위험을 수반한다.","hl":"m"},{"n":19,"text":"이제 이 글의 핵심 화두인 인공지능이 등장합니다. 인공지능이 도움은 되지만, 자칫하면 우리의 독창성을 깎아먹을 수 있다는 양면성을 보여주는 아주 중요한 문장이에요.","hl":"mn"},{"n":20,"text":"전치사 of 뒤에 동명사 limiting이 온 것을 보세요. 어떤 위험인지 구체적으로 설명해 주는 동격의 느낌으로 해석하면 매끄럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI 알고리즘은\u003c/span>\u003cspan class=\"en\">AI algorithms\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기존의 데이터 세트를 바탕으로 훈련된다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">trained\u003c/span> on existing datasets,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 패턴과 경향을 식별하며\u003c/span>\u003cspan class=\"e \u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 콘텐츠를 만들어 내는 데\u003c/span>\u003cspan class=\"en\">for generating new content\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유사한 스타일이나 형식으로,\u003c/span>\u003cspan class=\"en\">in similar styles or formats,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 또한 ~로 이어질 수 있다\u003c/span>\u003cspan class=\"en\">it can also lead to\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모방적인 작품들로\u003c/span>\u003cspan class=\"en\">derivative works\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진정한 독창성이 부족한.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">lack\u003c/span> genuine originality.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 유사한 스타일이나 형식으로 새로운 콘텐츠를 만들어 내는 데 유용할 수 있지만, 그것은 또한 진정한 독창성이 부족한 모방적인 작품들로 이 어질 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI의 효율성이라는 \u003cb class=\"key\">장점\u003c/b>과 기존의 것을 따르는 \u003cb class=\"key\">파생물\u003c/b>에 불과하다는 \u003cb class=\"key\">단점\u003c/b>을 대조하여 AI 창작의 한계를 지적합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사(대조)\u003c/span> : While [접속사] + S + V, S + V : \"~이지만, ~인 반면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : derivative works [선행사] + that [관계사] + lack [동사] : \"부족한\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"While this can be useful, 이것은 유용할 수 있지만. for generating new content, 새로운 콘텐츠를 만들어 내는 데. in similar styles or formats, 유사한 스타일이나 형식으로. it can also lead to, 그것은 또한 ~로 이어질 수 있다. derivative works, 모방적인 작품들로. that lack genuine originality, 진정한 독창성이 부족한.. 이 문장 전체를 해석하면, 이것은 유사한 스타일이나 형식으로 새로운 콘텐츠를 만들어 내는 데 유용할 수 있지만, 그것은 또한 진정한 독창성이 부족한 모방적인 작품들로 이 어질 수 있다.","hl":"m"},{"n":25,"text":"AI가 비슷한 스타일을 찍어내는 데는 편리하지만, 결국 진짜 독창성이 빠진 가공품만 만들게 될 수 있다는 경고를 담고 있어요.","hl":"mn"},{"n":26,"text":"첫 번째로 문장 맨 앞의 While은 양보나 대조를 나타내서 유용할 수는 있어도 문제가 있다는 점을 부각해요. 두 번째로 that lack은 앞에 있는 명사 작품들을 꾸며주는 주격 관계대명사로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술가와 디자이너가 AI에 지나치게 의존한다면\u003c/span>\u003cspan class=\"en\">If artists and designers rely too heavily on AI\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영감과 콘텐츠 생성을 위해,\u003c/span>\u003cspan class=\"en\">for inspiration and content generation,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 갇힌 자신을 발견할지 모른다\u003c/span>\u003cspan class=\"en\">they may \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">themselves \u003c/span>\u003cspan class=\"tgt\">trapped\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모방의 순환에,\u003c/span>\u003cspan class=\"en\">in a cycle of imitation,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벗어날 수 없는 상태에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">unable \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">break \u003c/span>\u003cspan class=\"tgt\">free\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI의 훈련 데이터라는 제한에서.\u003c/span>\u003cspan class=\"en\">from the constraints of the AI's training data.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예술가와 디자이너가 영감과 콘텐츠 생성을 위해 AI에 지나치게 의존한다면, 그들은 AI의 훈련 데이터라는 제한에서 벗어날 수 없는 상태에서 모방의 순환에 갇힌 자신을 발견할지 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI에 대한 \u003cb class=\"key\">과도한 \u003c/b>\u003cb class=\"key\">의존\u003c/b>이 인간의 창의적 주체성을 뺏고, 결국 학습 데이터의 \u003cb class=\"key\">범위 \u003c/b>\u003cb class=\"key\">안\u003c/b>에만 머물게 할 위험이 있음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문형(목적격 보어)\u003c/span> : find [동사] + themselves [목적어] + trapped [과거분사/목적격 보어] : \"자신들이 갇힌 것을 발견하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사구의 부수적 설명\u003c/span> : trapped [과거분사] + (being) unable [형용사] : \"벗어날 수 없는 (상태의)\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"If artists and designers rely too heavily on AI, 예술가와 디자이너가 AI에 지나치게 의존한다면. for inspiration and content generation, 영감과 콘텐츠 생성을 위해. they may find themselves trapped, 그들은 갇힌 자신을 발견할지 모른다. in a cycle of imitation, 모방의 순환에. unable to break free, 벗어날 수 없는 상태에서. from the constraints of the AI's training data, AI의 훈련 데이터라는 제한에서.. 이 문장 전체를 해석하면, 예술가와 디자이너가 영감과 콘텐츠 생성을 위해 AI에 지나치게 의존한다면, 그들은 AI의 훈련 데이터라는 제한에서 벗어날 수 없는 상태에서 모방의 순환에 갇힌 자신을 발견할지 모른다.","hl":"m"},{"n":28,"text":"AI를 너무 많이 쓰면 인간 창작자가 AI가 배운 데이터 틀 안에 갇혀서, 계속 남의 것만 흉내 내는 늪에 빠질 수 있다는 무서운 경고예요.","hl":"mn"},{"n":29,"text":"첫 번째로 find themselves trapped 부분을 보세요. 자신들이 갇혀 있는 수동의 상태를 나타내기 위해 과거분사 trapped를 썼죠. 두 번째로 unable to break free는 주어의 상태를 덧붙여 설명해주는 형용사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더욱이, 편의성은\u003c/span>\u003cspan class=\"en\">Moreover, the ease\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI로 콘텐츠를 생성할 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">which\u003c/span> AI can generate content\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 종류의 노력과 실험을 방해할 수 있다\u003c/span>\u003cspan class=\"en\">can discourage the kind of struggle and experimentation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 획기적인 발전으로 이어지는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> often leads to breakthroughs.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">더욱이, AI로 콘텐츠를 생성할 수 있는 편의성은 종 종 획기적인 발전으로 이어지는 그런 종류의 노력과 실험을 방해할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI가 주는 편리함이 인간이 거쳐야 할 치열한 \u003cb class=\"key\">고민의 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 생략하게 만든다는 경고입니다. 이러한 과정의 결핍은 결국 진정한 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">도약\u003c/b>을 가로막는 장애물이 될 수 있음을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 + 관계대명사\u003c/span> : the ease [선행사] + with which [전치사+관계대명사] + AI can generate content [완전한 문장] : \"AI로 콘텐츠를 생성할 수 있는 (편의성)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : struggle and experimentation [선행사] + that [주격 관계대명사] + leads [동사] : \"발전으로 이어지는 (노력과 실험)\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Moreover, the ease, 더욱이, 편의성은. with which AI can generate content, AI로 콘텐츠를 생성할 수 있는. can discourage the kind of struggle and experimentation, 그런 종류의 노력과 실험을 방해할 수 있다. that often leads to breakthroughs, 종종 획기적인 발전으로 이어지는. 이 문장 전체를 해석하면, 더욱이, AI로 콘텐츠를 생성할 수 있는 편의성은 종 종 획기적인 발전으로 이어지는 그런 종류의 노력과 실험을 방해할 수 있다.","hl":"m"},{"n":31,"text":"AI가 모든 것을 너무 쉽게 만들어주면, 우리가 무언가를 만들어내기 위해 겪어야 하는 치열한 고민인 struggle이 사라지게 됩니다. 하지만 역설적이게도 그런 고생스러운 과정이 있어야만 진짜 획기적인 발전인 breakthrough가 나올 수 있다는 내용이에요.","hl":"mn"},{"n":32,"text":"첫 번째로 with which는 전치사와 관계대명사가 합쳐진 형태로 뒤에 완전한 문장이 나오면서 앞의 ease를 꾸며줍니다. 두 번째로 나오는 that은 주격 관계대명사로, 뒤에 바로 동사 leads가 나오는 것을 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창의적인 과정은\u003c/span>\u003cspan class=\"en\">The creative process\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 골치 아프고 반복적이며\u003c/span>\u003cspan class=\"en\">is often messy and repetitive,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수많은 실패와 좌절을 수반한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">involving\u003c/span> numerous failures and setbacks.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">창의적인 과정은 종종 골치 아프고 반복적이며 수많은 실패와 좌절을 수반한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 창의성은 한 번에 완성되는 것이 아니라, \u003cb class=\"key\">지저분한 \u003c/b>\u003cb class=\"key\">과정\u003c/b>과 수많은 시행착오를 통해 만들어지는 것임을 강조합니다. AI의 깔끔하고 빠른 결과물과는 대조되는 인간만의 \u003cb class=\"key\">성장 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 분사구문\u003c/span> : [주절] + , [콤마] + involving [현재분사/부대상황] : \"수반하면서, 수반한다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The creative process, 창의적인 과정은. is often messy and repetitive, 종종 골치 아프고 반복적이며. involving numerous failures and setbacks, 수많은 실패와 좌절을 수반한다. 이 문장 전체를 해석하면, 창의적인 과정은 종종 골치 아프고 반복적이며 수많은 실패와 좌절을 수반한다.","hl":"m"},{"n":34,"text":"창의적인 결과물을 내는 과정은 절대 깔끔하지 않습니다. 아주 복잡하고 엉망인 상태인 messy를 거치고, 계속 반복되는 실패를 겪어야만 비로소 완성된다는 뜻이에요.","hl":"mn"},{"n":35,"text":"문장 끝부분에 콤마와 함께 쓰인 involving은 분사구문입니다. 주어인 창의적 과정이 실패를 포함하고 수반한다는 능동의 의미를 나타내고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 ass=\"key\">시행착오\u003c/b>를 겪는 복잡한 과정을 통해서만 이루어집니다.\u003c/li>\u003cli>AI가 제공하는 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>은 필수적인 학습 과정을 생략하게 만들어 인간의 \u003cb class=\"key\">재능 \u003c/b>\u003cb class=\"key\">발달\u003c/b>을 저해할 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>While AI offers efficiency in content generation, it risks undermining human creativity by skipping the essential trial-and-error process and fostering a cycle of imitation.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">창의성\u003c/b>은 수많은 시행착오와 실험을 거치는 고통스러운 과정 속에서 발달하지만, \u003cb class=\"key\">AI\u003c/b>의 즉각적인 해결책과 기존 데이터 기반의 모방적 생성 방식은 인간의 독창적인 \u003cb class=\"key\">재능 \u003c/b>\u003cb class=\"key\">발달\u003c/b>을 저해할 위험이 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"자, 오늘 수업을 정리해 볼까요? 편리한 AI가 우리 대신 모든 걸 해결해 줄 때, 정작 우리 자신의 창의적 근육은 퇴화할 수 있다는 것이 이 글의 핵심입니다. 힘들고 지저분한 시행착오의 과정이 사실은 여러분의 재능을 키워주는 가장 소중한 시간이라는 점을 잊지 마세요. 오늘 공부하느라 정말 고생 많았습니다!","hl":null}]}]});</script></body></html>
