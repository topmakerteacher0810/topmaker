</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 31번","audioDir":"31_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">31번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>The Accidental Birth of the Spinach Iron Myth\u003c/h1>\u003ch2>시금치 철분 통념의 우연한 탄생\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>시금치에 철분이 많다는 \u003cb class=\"key\">통념\u003c/b>은 1890년의 단순한 \u003cb class=\"key\">계산 \u003c/b>\u003cb class=\"key\">착오\u003c/b>에서 비롯되었으며, 뽀빠이와 같은 대중문화의 영향으로 오늘날까지 지속되고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A long-standing myth about spinach's iron content originated from a scientific error and was perpetuated by popular culture despite being corrected.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 상식이라고 믿었던 시금치에 대한 이야기가 사실은 작은 실수에서 시작되었다는 재미있는 지문을 배워볼 거예요. 이 글의 핵심은 잘못된 정보가 어떻게 상식이 되어 오래 살아남는지를 보여주는 통념의 탄생과 지속에 대한 이야기입니다. 요지는 과학적 오류가 대중문화와 결합하여 아주 긴 시간 동안 생명력을 유지한다는 내용이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 흔히 진실이라고 믿는 상식 중에는 과학적 오류에서 비롯된 \u003cb class=\"key\">과학적 \u003c/b>\u003cb class=\"key\">통념(Scientific \u003c/b>\u003cb class=\"key\">Myth)\u003c/b>이 많습니다. 19세기 생리학자의 소수점 실수나 측정 조건의 차이가 대중에게 전달되는 과정에서 \u003cb class=\"key\">왜곡\u003c/b>되어 굳어진 것이죠. 이는 마치 \u003cb class=\"key\">전화기 \u003c/b>\u003cb class=\"key\">게임(Telephone \u003c/b>\u003cb class=\"key\">Game)\u003c/b>에서 첫 사람이 한 말이 마지막 사람에게 전혀 다르게 전달되는 것과 비슷합니다. 한 번 형성된 \u003cb class=\"key\">고정관념\u003c/b>은 수정된 사실이 발표되어도 대중의 인식 속에서 쉽게 사라지지 않는 \u003cb class=\"key\">인식의 \u003c/b>\u003cb class=\"key\">관성\u003c/b>을 가지고 있습니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 앞서 배경지식을 좀 쌓아볼까요? 과학계에서는 작은 실수가 큰 오해를 낳는 일이 종종 있어요. 이를 과학적 통념이라고 부르는데, 마치 우리가 어릴 때 하던 전화기 게임처럼 처음의 진실이 전달 과정에서 왜곡되는 현상과 비슷합니다. 한 번 사람들의 머릿속에 박힌 고정관념은 인식의 관성 때문에 쉽게 바뀌지 않는다는 특징이 있어요. 오늘 지문에서도 이런 현상이 시금치를 통해 어떻게 나타나는지 확인해 봅시다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>통념의 정의와 예시\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>통념이 단순히 꾸며낸 이야기가 아님을 밝히며, 오늘날까지 이어지는 \u003cb class=\"key\">시금치 \u003c/b>\u003cb class=\"key\">철분\u003c/b> 사례를 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>오류의 기원\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>1890년 구스타프 폰 붕게의 \u003cb class=\"key\">계산 \u003c/b>\u003cb class=\"key\">착오\u003c/b>를 언급하며, 신선한 시금치가 아닌 \u003cb class=\"key\">말린 \u003c/b>\u003cb class=\"key\">시금치\u003c/b>를 분석했던 것이 원인이었음을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>수정 실패와 고착\u003csmall>전환 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>오류는 즉시 수정되었으나 대중은 그 수정을 \u003cb class=\"key\">잊어버렸고\u003c/b>, 결국 잘못된 정보가 \u003cb class=\"key\">확고히 \u003c/b>\u003cb class=\"key\">자리를 \u003c/b>\u003cb class=\"key\">잡게\u003c/b> 되었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>지속의 원동력\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>만화 캐릭터 \u003cb class=\"key\">뽀빠이\u003c/b>와 부모들의 \u003cb class=\"key\">교육적 \u003c/b>\u003cb class=\"key\">활용\u003c/b>이 이 통념을 150년 가까이 유지시킨 힘이 되었음을 보여줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글이 어떤 순서로 전개되는지 흐름을 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 통념이 단순히 지어낸 이야기가 아님을 강조하며 시금치 사례를 소개합니다. 우리 모두가 알고 있는 시금치 철분 이야기가 사실은 하나의 예시로 등장하는 것이죠.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장은 이 오해의 뿌리를 찾아갑니다. 천팔백구십년 구스타프 폰 붕게라는 학자가 계산 착오를 일으켰는데, 말린 시금치를 분석한 결과값을 신선한 시금치 값으로 오해한 것이 비극의 시작이었습니다.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장에서는 반전이 일어납니다. 오류는 금방 수정되었지만 사람들은 그 수정을 잊어버렸고, 결국 이 통념은 확고히 자리를 잡게 됩니다. 사실보다 믿고 싶은 것을 믿는 대중의 심리가 엿보이는 대목이죠.","hl":"f2"},{"n":7,"text":"마지막 일곱 번째 문장에서는 이 통념이 백오십 년 가까이 지속된 이유를 설명합니다. 만화 캐릭터 뽀빠이가 주는 강렬한 이미지와 아이들에게 시금치를 먹이려는 부모들의 설득 도구로 쓰이면서 이 이야기는 생명력을 얻었습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과 및 예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 \u003cb class=\"key\">통념\u003c/b>에 대한 일반적 진술을 한 뒤, 두 번째 문장에서 시금치라는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 제시합니다. 이후 그 통념이 발생하게 된 \u003cb class=\"key\">원인\u003c/b>과 그것이 사라지지 않고 유지된 \u003cb class=\"key\">결과\u003c/b>를 시간 순서대로 서술하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (2)\u003c/b>\u003cspan>구체적 사례 도입\u003c/span>\u003cb>Although (5)\u003c/b>\u003cspan>양보/대조의 연결\u003c/span>\u003cb>contributed to (7)\u003c/b>\u003cspan>인과 관계 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">well-known myth\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">high iron content in spinach\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">legend\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">simple miscalculation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this tale\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Dried Spinach (말린 시금치)\u003c/th>\u003cth>Fresh Leafy Greens (신선한 채소)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>35 milligrams of iron\u003c/td>\u003ctd>3.5 milligrams of iron\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ten times more iron\u003c/td>\u003ctd>Original amount\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 인과 관계와 예시의 구조를 띠고 있습니다. 글의 앞부분에 주제가 나오는 두괄식 패턴으로, 두 번째 문장이 핵심 주제문이라고 할 수 있어요. 시금치라는 구체적인 사례를 통해 통념의 무서운 생명력을 보여주고 있습니다.","hl":"ty"},{"n":9,"text":"문장 속 신호어들을 잘 봐야 해요. 두 번째 문장의 For example은 구체적인 사례의 시작을 알리고, 다섯 번째 문장의 Although는 오류 수정과 대중의 망각이라는 대조적인 상황을 연결합니다. 마지막 문장의 contributed to는 뽀빠이가 이 통념을 유지시키는 원인이 되었음을 직접적으로 나타내고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>myth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통념, 근거 없는 믿음, 신화\u003c/span>\u003c/div>\u003cdiv>\u003cb>persist\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지속되다, 집요하게 계속하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>supposed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>소위 ~라고 생각되는, 가정된\u003c/span>\u003c/div>\u003cdiv>\u003cb>content\u003c/b>\u003cem>명사\u003c/em>\u003cspan>함유량, 내용물\u003c/span>\u003c/div>\u003cdiv>\u003cb>spinach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시금치\u003c/span>\u003c/div>\u003cdiv>\u003cb>legend\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전설, 전해 오는 이야기\u003c/span>\u003c/div>\u003cdiv>\u003cb>date back to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 거슬러 올라가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>originate from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 비롯되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>miscalculation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>계산 착오\u003c/span>\u003c/div>\u003cdiv>\u003cb>physiologist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생리학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>accurately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정확하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>determine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>밝혀내다, 결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>contain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>함유하다, 포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>analyze\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분석하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dried\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>말린, 건조한\u003c/span>\u003c/div>\u003cdiv>\u003cb>leafy greens\u003c/b>\u003cem>명사\u003c/em>\u003cspan>푸른 잎 채소\u003c/span>\u003c/div>\u003cdiv>\u003cb>swiftly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>신속히, 빠르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>correction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정정, 수정\u003c/span>\u003c/div>\u003cdiv>\u003cb>take hold\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>확고히 자리를 잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>superhuman\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>초인적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>strength\u003c/b>\u003cem>명사\u003c/em>\u003cspan>힘, 근력\u003c/span>\u003c/div>\u003cdiv>\u003cb>defend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방어하다, 지키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주먹\u003c/span>\u003c/div>\u003cdiv>\u003cb>contribute to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 기여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>endurance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지속, 인내\u003c/span>\u003c/div>\u003cdiv>\u003cb>persuade\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설득하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 중요한 단어들을 짚어볼까요? persist는 끈질기게 지속된다는 뜻이고, miscalculation은 이번 사건의 원인인 계산 착오를 의미합니다. take hold는 어떤 생각이 확고히 자리를 잡는다는 아주 중요한 표현이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">persist\u003c/b>\u003cspan class=\"m\">지속되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">continue\u003c/span>\u003cspan class=\"s\">endure\u003c/span>\u003cspan class=\"s\">remain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cease\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accurately\u003c/b>\u003cspan class=\"m\">정확하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">precisely\u003c/span>\u003cspan class=\"s\">correctly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inaccurately\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">swiftly\u003c/b>\u003cspan class=\"m\">신속히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rapidly\u003c/span>\u003cspan class=\"s\">quickly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">persuade\u003c/b>\u003cspan class=\"m\">설득하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">convince\u003c/span>\u003cspan class=\"s\">induce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dissuade\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">endurance\u003c/b>\u003cspan class=\"m\">지속\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">longevity\u003c/span>\u003cspan class=\"s\">persistence\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 정리해 봅시다. persist는 continue나 endure로 바꿔 쓸 수 있고, 반대말로는 중단하다라는 뜻의 cease가 있어요. 빠르게라는 뜻의 swiftly는 rapidly와 비슷하고, 설득하다라는 persuade는 convince와 같은 맥락으로 쓰입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통념은 아니다\u003c/span>\u003cspan class=\"en\">Myths \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">aren't\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 이야기가.\u003c/span>\u003cspan class=\"en\">only stories.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">통념은 단지 이야기가 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 흔히 믿는 \u003cb class=\"key\">통념\u003c/b>이 단순히 지어낸 이야기에 그치지 않고 실제 현실에 영향을 미친다는 점을 시사하는 \u003cb class=\"key\">도입부\u003c/b> 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사의 부정문\u003c/span> : [주어(복수)] + [are not(aren't)] + [보어] : \"아니다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Myths aren't, 통념은 아니다. only stories, 단지 이야기가.. 이 문장 전체를 해석하면, 통념은 단지 이야기가 아니다.","hl":"m"},{"n":13,"text":"우리가 흔히 사실이라고 믿는 통념이 단순히 지어낸 이야기에 그치지 않고 우리 삶에 실제 영향을 미친다는 것을 알려주는 도입부 문장이에요.","hl":"mn"},{"n":14,"text":"주어인 Myths가 복수 형태이기 때문에 be동사는 are를 썼고요, 뒤에 not을 붙여서 통념은 이야기가 아니라는 부정문을 만들었죠. are와 not을 줄여서 aren't라고 표현했네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 잘 알려진 하나의 통념은 오늘날에도 지속되는 여겨지는 것이다 시금치에 있다고 (여겨지는) 높은 철분 함량이다.\u003c/span>\u003cspan class=\"en\">For example, a well­known myth \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">pers\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ists \u003c/span>\u003cspan class=\"tgt\">today\u003c/span> is the supposed high iron content in spinach.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 오늘날에도 지속되는 잘 알려진 하나의 통념은 시금치에 있다고 여겨지는 높은 철분 함량이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장의 구체적인 \u003cb class=\"key\">예시\u003c/b>로 시금치의 철분 함량을 들고 있으며, \u003cb class=\"key\">관계대명사\u003c/b>를 통해 통념이 여전히 존재함을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : [선행사(a well-known myth)] + [that(주격 관계대명사)] + [동사(persists)] : \"오늘날에도 지속되는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : [주어(a well-known myth)] ... [동사(is)] : \"~이다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"For example, 예를 들어. a well-known myth, 잘 알려진 하나의 통념은. that persists today, 오늘날에도 지속되는. is the supposed, 여겨지는 것이다. high iron content in spinach, 시금치에 있다고 (여겨지는) 높은 철분 함량이다.. 이 문장 전체를 해석하면, 예를 들어, 오늘날에도 지속되는 잘 알려진 하나의 통념은 시금치에 있다고 여겨지는 높은 철분 함량이다.","hl":"m"},{"n":16,"text":"앞에서 말한 통념의 구체적인 예시로 시금치를 들고 있어요. 사실이 아님에도 불구하고 오늘날까지 여전히 많은 사람들이 믿고 있는 이야기를 소개하는 부분이죠.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 주격 관계대명사 that입니다. 선행사인 myth를 꾸며주고 있는데 선행사가 단수라서 뒤에 오는 동사 persists에 에스를 꼭 붙여야 해요. 두 번째는 문장 전체의 동사인 is입니다. 수식어구를 다 제외하면 진짜 주어는 a well-known myth 하나이므로 단수 동사인 is를 쓴 것이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 전해오는 이야기이다\u003c/span>\u003cspan class=\"en\">This is a legend\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1890년으로 거슬러 올라가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">dates \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">1890 \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비롯된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">originates \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순한 계산 착오에서\u003c/span>\u003cspan class=\"en\">a simple miscalculation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생리학자 Gustav von Bunge에 의한.\u003c/span>\u003cspan class=\"en\">by physiologist Gustav von Bunge.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 1890년으로 거슬러 올라가 생리학자 Gustav von Bunge의 단순한 계산 착오에서 비롯된 전해오는 이야기이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시금치 통념이 발생하게 된 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>과 원인이 된 \u003cb class=\"key\">실수\u003c/b>를 설명하며 이야기의 신빙성을 분석합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사절 내의 동사 병렬 구조\u003c/span> : [that] + [동사1(dates...)] + [and] + [동사2(originates...)] : \"1890년으로 거슬러 올라가 ~에서 비롯된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">숙어(동사구)\u003c/span> : [date back to] + [과거의 시점] : \"~으로 거슬러 올라가다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"This is a legend, 이것은 전해오는 이야기이다. that dates back to 1890, 1890년으로 거슬러 올라가. and originates from, 비롯된. a simple miscalculation, 단순한 계산 착오에서. by physiologist Gustav von Bunge, 생리학자 Gustav von Bunge에 의한.. 이 문장 전체를 해석하면, 이것은 1890년으로 거슬러 올라가 생리학자 Gustav von Bunge의 단순한 계산 착오에서 비롯된 전해오는 이야기이다.","hl":"m"},{"n":19,"text":"시금치에 철분이 많다는 소문이 대체 어디서 시작되었는지 그 역사적 배경을 설명하는 문장이에요. 과학자의 아주 단순한 실수에서 시작되었다는 점이 핵심이죠.","hl":"mn"},{"n":20,"text":"여기서 가장 중요한 건 주격 관계대명사 that 뒤에 나오는 동사의 병렬 구조예요. dates back to와 originates from이라는 두 개의 동사 덩어리가 and로 연결되어 선행사인 a legend를 함께 꾸며주고 있어요. 기원을 나타내는 표현인 date back to와 originate from도 꼭 세트로 외워두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 정확하게 밝혀냈지만\u003c/span>\u003cspan class=\"en\">He accurately \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">determined \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시금치 100그램이 철분 35밀리그램을 함유하고 있다는 사실을\u003c/span>\u003cspan class=\"en\">100 grams of spinach contained 35 milligrams of iron\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 말린 시금치를 분석하고 있었고,\u003c/span>\u003cspan class=\"en\">but he was analyzing dried spinach,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 열 배 많은 철분을 갖고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">held\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">ten \u003c/span>\u003cspan class=\"tgt\">times \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">iron\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 양의 말리지 않은 푸른잎채소(시금치)보다.\u003c/span>\u003cspan class=\"en\">than the same amount of fresh leafy greens.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 시금치 100그램이 철분 35밀리그램을 함유하고 있다는 사실을 정확하게 밝혀냈지만, 그는 말린 시금치를 분석하고 있었고, 그것은 같은 양의 말리지 않은 푸른잎채소(시금치)보다 열 배 많은 철분을 갖고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시금치의 철분 함량이 높다는 통념이 생긴 결정적인 원인인 \u003cb class=\"key\">수치 \u003c/b>\u003cb class=\"key\">오해\u003c/b>를 설명합니다. 신선한 상태가 아닌 \u003cb class=\"key\">말린 \u003c/b>\u003cb class=\"key\">시금치\u003c/b>를 분석했기 때문에 철분 농도가 훨씬 높게 측정되었던 것입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : determined [동사] + that [접속사] + S + V [목적어절] : \"~라는 사실을 밝혀냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : dried spinach [선행사] + , which [관계대명사] : \"그런데 그것은 (~을) 갖고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">배수 표현 (배수사 + 비교급)\u003c/span> : ten times [배수사] + more [비교급] + iron [명사] : \"열 배 더 많은 철분\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He accurately determined that, 그가 정확하게 밝혀냈지만. 100 grams of spinach contained 35 milligrams of iron, 시금치 100그램이 철분 35밀리그램을 함유하고 있다는 사실을. but he was analyzing dried spinach, 그는 말린 시금치를 분석하고 있었고. which held ten times more iron, 그것은 열 배 많은 철분을 갖고 있었다. than the same amount of fresh leafy greens, 같은 양의 말리지 않은 푸른잎채소(시금치)보다.. 이 문장 전체를 해석하면, 그가 시금치 100그램이 철분 35밀리그램을 함유하고 있다는 사실을 정확하게 밝혀냈지만, 그는 말린 시금치를 분석하고 있었고, 그것은 같은 양의 말리지 않은 푸른잎채소(시금치)보다 열 배 많은 철분을 갖고 있었다.","hl":"m"},{"n":22,"text":"왜 시금치 철분 수치가 높게 알려졌는지 그 이유를 말해주는 문장이에요. 과학자가 수치 자체는 맞게 쟀지만, 신선한 시금치가 아니라 말린 시금치를 쓰는 실수를 한 거죠. 이 한 번의 계산 착오가 시금치에 대한 거대한 오해를 불러왔다는 흐름입니다.","hl":"mn"},{"n":23,"text":"첫 번째로 determined 뒤의 that은 목적어 역할을 하는 명사절 접속사예요. 두 번째로 dried spinach 뒤에 콤마와 함께 나온 which는 관계대명사의 계속적 용법으로, 말린 시금치에 대해 추가 설명을 덧붙여 주죠. 마지막으로 ten times more는 배수사를 이용해 양이 몇 배나 더 많은지를 강조하는 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 오류는 빠르게 수정되었지만\u003c/span>\u003cspan class=\"en\">Although the error \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">swiftly \u003c/span>\u003cspan class=\"tgt\">corrected\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 수정은 그만큼 빠르게 잊혀졌다.\u003c/span>\u003cspan class=\"en\">the correction was \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">swiftly\u003c/span> forgotten.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 오류는 빠르게 수정되었지만 그 수정은 그만큼 빠르게 잊혀졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 잘못된 정보가 바로잡혔음에도 불구하고 \u003cb class=\"key\">대중의 \u003c/b>\u003cb class=\"key\">인식\u003c/b>에는 변화가 없었음을 나타냅니다. \u003cb class=\"key\">수정된 \u003c/b>\u003cb class=\"key\">사실\u003c/b>보다 처음의 강렬한 오해가 더 강하게 남았음을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be+p.p.)\u003c/span> : the error [주어] + was [be동사] + corrected [과거분사] : \"빠르게 수정되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 강조 표현\u003c/span> : just as [강조] + swiftly [부사] : \"그만큼 똑같이 빠르게\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Although the error was swiftly corrected, 그 오류는 빠르게 수정되었지만. the correction was just as swiftly forgotten, 그 수정은 그만큼 빠르게 잊혀졌다.. 이 문장 전체를 해석하면, 그 오류는 빠르게 수정되었지만 그 수정은 그만큼 빠르게 잊혀졌다.","hl":"m"},{"n":25,"text":"오류가 발견되어 금방 고쳐지긴 했어요. 하지만 문제는 사람들이 그 고쳐진 사실을 너무나도 빨리 잊어버렸다는 점입니다. 결국 잘못된 정보가 계속 살아남게 된 배경을 설명하죠.","hl":"mn"},{"n":26,"text":"첫 번째로 was swiftly corrected는 오류가 수정된 것이니까 be동사와 과거분사를 쓴 수동태 문장이에요. 두 번째로 just as swiftly는 앞에서 쓴 부사를 다시 한 번 강조하며, 수정된 것만큼이나 똑같이 빠르게 잊혔다는 의미를 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 통념은\u003c/span>\u003cspan class=\"en\">The myth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확고히 자리를 잡았다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">taken \u003c/span>\u003cspan class=\"tgt\">hold\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 통념은 확고히 자리를 잡았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거짓 정보가 사람들의 마음속에 깊이 각인되어 \u003cb class=\"key\">고정관념\u003c/b>이 되었음을 뜻합니다. 한 번 자리를 잡은 오해는 \u003cb class=\"key\">쉽게 \u003c/b>\u003cb class=\"key\">변하지 \u003c/b>\u003cb class=\"key\">않음\u003c/b>을 강조하는 짧고 강렬한 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료 (had+p.p.)\u003c/span> : had [조동사] + taken [과거분사] : \"자리를 잡았었다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The myth, 이 통념은. had taken hold, 확고히 자리를 잡았다.. 이 문장 전체를 해석하면, 이 통념은 확고히 자리를 잡았다.","hl":"m"},{"n":28,"text":"아주 짧지만 강력한 문장이네요. 이제 시금치에 대한 오해는 단순한 실수를 넘어, 사람들의 머릿속에 완전히 뿌리를 내리고 상식이 되어버렸다는 선언입니다.","hl":"mn"},{"n":29,"text":"여기서는 had taken hold라는 과거완료 시제가 쓰였어요. 수정된 사실이 잊히는 시점보다 이 통념이 사람들을 장악해버린 것이 시간상으로 앞서거나 그 당시에 이미 완료된 상태였음을 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">푸른잎채소(시금치)에서 초인적인 힘을 얻고\u003c/span>\u003cspan class=\"en\">Popeye, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">gained \u003c/span>\u003cspan class=\"tgt\">superhuman \u003c/span>\u003cspan class=\"tgt\">strength \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">leafy \u003c/span>\u003cspan class=\"tgt\">greens \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강철 주먹으로 자신을 방어했기에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">defended\u003c/span> himself with iron fists,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 지속에 기여했고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">contributed \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> its endurance\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 150년이 지난 오늘날에도,\u003c/span>\u003cspan class=\"en\">and even today, some nearly 150 years later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계 부모들은 이 이야기를 이용한다\u003c/span>\u003cspan class=\"en\">parents the world over use this tale\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자녀들이 건강한 그 채소를 먹도록 설득하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">persuade \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">children \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">eating\u003c/span> the healthy vegetable.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Popeye는 푸른잎채소(시금치)에서 초인적인 힘을 얻고 강철 주먹으로 자신을 방어했기에, 그것의 지속에 기여했고, 약 150년이 지난 오늘날에도 전 세계 부모들은 자녀들이 건강한 그 채소를 먹도록 설득하기 위해 이 이야기를 이용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유명 캐릭터 Popeye가 시금치를 먹고 힘을 내는 모습이 \u003cb class=\"key\">대중 \u003c/b>\u003cb class=\"key\">문화\u003c/b>에 깊이 각인되어, 시금치에 대한 잘못된 정보가 오랫동안 \u003cb class=\"key\">지속\u003c/b>되게 만들었습니다. 이 \u003cb class=\"key\">근거 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>은 오늘날까지도 부모님들이 자녀의 식습관을 훈육하는 수단으로 활용되고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사의 계속적 용법과 동사 병렬\u003c/span> : 선행사(Popeye), [who + 동사1 ... and + 동사2] : \"초인적인 힘을 얻고 자신을 방어했던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사+전치사 구문\u003c/span> : contribute [자동사] + to [전치사] + 명사 : \"~에 기여했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : 동사(use) ... + to try [to부정사(목적)] : \"노력하기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">persuade A into B(동명사)\u003c/span> : persuade [A(목적어)] + into [전치사] + [B(동명사)] : \"자녀들을 먹도록 설득하다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Popeye, who gained superhuman strength from the leafy greens, 푸른잎채소(시금치)에서 초인적인 힘을 얻고. and defended himself with iron fists, 강철 주먹으로 자신을 방어했기에. contributed to its endurance, 그것의 지속에 기여했고. and even today, some nearly 150 years later, 약 150년이 지난 오늘날에도. parents the world over use this tale, 전 세계 부모들은 이 이야기를 이용한다. to try to persuade their children into eating the healthy vegetable, 자녀들이 건강한 그 채소를 먹도록 설득하기 위해. 이 문장 전체를 해석하면, Popeye는 푸른잎채소(시금치)에서 초인적인 힘을 얻고 강철 주먹으로 자신을 방어했기에, 그것의 지속에 기여했고, 약 150년이 지난 오늘날에도 전 세계 부모들은 자녀들이 건강한 그 채소를 먹도록 설득하기 위해 이 이야기를 이용한다.","hl":"m"},{"n":31,"text":"시금치를 먹으면 힘이 세지는 뽀빠이 캐릭터가 큰 인기를 끌면서, 시금치에 철분이 아주 많다는 잘못된 정보가 오랫동안 사라지지 않고 지속될 수 있었어요. 백오십 년이 흐른 지금까지도 전 세계 부모님들이 아이들에게 시금치를 먹일 때 이 이야기를 교육용으로 활용하고 있다는 내용입니다.","hl":"mn"},{"n":32,"text":"이 문장에는 중요한 문법이 아주 많아요. 첫 번째로 Popeye 뒤의 who는 계속적 용법의 관계대명사로, 뽀빠이에 대한 추가 정보를 줘요. 여기서 gained와 and 뒤의 defended는 과거 시제로 똑같이 맞춰준 병렬 구조예요. 두 번째로 기여하다라는 뜻의 contribute는 전치사 to와 항상 짝을 이룬다는 걸 기억하세요. 세 번째로 문장 끝에 나오는 to try는 ~하기 위해서라는 목적의 의미를 담고 있어요. 마지막으로 persuade A into B 구문에서는 전치사 into 뒤에 반드시 eating처럼 동명사 모양을 써야 한다는 것이 시험 포인트입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>시금치 철분 함량에 대한 정보는 1890년의 \u003cb class=\"key\">계산 \u003c/b>\u003cb class=\"key\">착오\u003c/b>에서 시작된 대표적인 \u003cb class=\"key\">통념\u003c/b>입니다.\u003c/li>\u003cli>생리학자가 \u003cb class=\"key\">말린 \u003c/b>\u003cb class=\"key\">시금치\u003c/b>의 수치를 신선한 시금치의 수치로 착각하면서 철분이 열 배나 많게 기록되었습니다.\u003c/li>\u003cli>오류는 수정되었으나 대중은 수정을 무시했고, 이 잘못된 믿음은 사회적으로 \u003cb class=\"key\">확고히 \u003c/b>\u003cb class=\"key\">자리를 \u003c/b>\u003cb class=\"key\">잡았습니다\u003c/b>.\u003c/li>\u003cli>만화 \u003cb class=\"key\">뽀빠이\u003c/b>의 인기와 자녀에게 채소를 먹이려는 부모들의 노력이 이 이야기를 오늘날까지 \u003cb class=\"key\">지속\u003c/b>시켰습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A long-standing myth about spinach's iron content originated from a scientific error and was perpetuated by popular culture despite being corrected.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">시금치에 철분이 많다는 \u003cb class=\"key\">통념\u003c/b>은 1890년의 단순한 \u003cb class=\"key\">계산 \u003c/b>\u003cb class=\"key\">착오\u003c/b>에서 비롯되었으며, 뽀빠이와 같은 대중문화의 영향으로 오늘날까지 지속되고 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 우리는 시금치 철분 신화가 단순한 실수와 대중문화의 결합으로 만들어졌다는 것을 배웠습니다. 과학적 사실이 수정되어도 대중의 통념을 바꾸기는 참 어렵다는 교훈도 얻었네요. 오늘 배운 중요한 표현들과 글의 흐름을 다시 한번 복습하면서 마무리하겠습니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
