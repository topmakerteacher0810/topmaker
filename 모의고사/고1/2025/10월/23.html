</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 23번","audioDir":"23_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">23번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>Rome: The Eternal City Built on Openness and Diversity\u003c/h1>\u003ch2>로마: 개방성과 다양성 위에 세워진 영원한 도시\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>로마는 건국 초기부터 \u003cb class=\"key\">비차별 \u003c/b>\u003cb class=\"key\">정책\u003c/b>을 통해 다양한 이민자를 수용하며 성장한 \u003cb class=\"key\">다문화적\u003c/b> 용광로였으며, 이러한 \u003cb class=\"key\">개방성\u003c/b>이 도시 성공의 근본적인 토대가 되었습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Rome's initial openness to immigrants and diverse cultures laid the foundation for its long-term strength and success.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 고대 로마가 어떻게 강력한 대제국으로 성장할 수 있었는지 그 비밀을 파헤쳐 볼 거예요. 로마는 시작부터 우리가 흔히 말하는 melting pot, 즉 용광로 같은 도시였다고 해요. 이번 시간에는 로마의 개방성과 다문화적 특징이 가진 강력한 힘을 함께 살펴보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">로마는 건국 신화에서부터 \u003cb class=\"key\">다문화주의\u003c/b>(Multiculturalism)적 성격을 띠고 있습니다. 건국자 로물루스는 인구를 늘리기 위해 범죄자나 노예 등 신분에 상관없이 누구나 받아들이는 \u003cb class=\"key\">아실룸\u003c/b>(Asylum) 정책을 펼쳤습니다. 이는 비빔밥처럼 다양한 재료가 섞여 새로운 맛을 내는 \u003cb class=\"key\">용광로\u003c/b>(Melting Pot) 비유와 잘 들어맞습니다. 이처럼 외부인을 적극적으로 받아들이는 로마의 태도는 이탈리아의 작은 도시 국가였던 로마가 세 대륙을 지배하는 \u003cb class=\"key\">대제국\u003c/b>으로 성장하는 결정적인 \u003cb class=\"key\">원동력\u003c/b>이 되었습니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 비빔밥 좋아하시나요? 비빔밥은 여러 재료가 섞여서 아주 맛있는 조화를 이루죠. 고대 로마도 이와 비슷했습니다. 건국자 로물루스는 도시를 세우면서 신분에 상관없이 누구나 환영하는 Asylum, 즉 비차별 정책을 펼쳤어요. 이런 개방적인 태도가 로마를 단순히 이탈리아의 작은 도시가 아닌, 거대한 제국으로 만든 원동력이 되었답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>로마의 기원과 이민자\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>로마는 시작부터 \u003cb class=\"key\">용광로\u003c/b>였으며, 로물루스의 의도적인 \u003cb class=\"key\">비차별 \u003c/b>\u003cb class=\"key\">정책\u003c/b>으로 인해 사방에서 \u003cb class=\"key\">이민자\u003c/b>들이 몰려들어 인구를 구성했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>개방성과 성공의 토대\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>리비우스는 이러한 초기의 \u003cb class=\"key\">개방성\u003c/b>이 로마의 성공을 위한 \u003cb class=\"key\">토대\u003c/b>가 되었다고 강조하며, 로마인들이 스스로를 \u003cb class=\"key\">다문화적\u003c/b>이라 여겼음을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>이민자 출신 왕들의 사례\u003csmall>근거 · 문장 5\u003c/small>\u003c/h4>\u003cp>로마의 전설적인 왕들 중 상당수가 로마 태생이 아닌 \u003cb class=\"key\">이민자\u003c/b> 출신이었고, 오직 \u003cb class=\"key\">덕성\u003c/b>과 \u003cb class=\"key\">공로\u003c/b>만으로 왕위에 올랐다는 사실을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>제국 확장과 문화 수용\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>제국이 확장되면서 로마는 새로운 문화를 적극적으로 \u003cb class=\"key\">흡수\u003c/b>했으며, 일부의 불평에도 불구하고 이러한 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>는 계속되었습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 로마의 탄생 배경부터 성공의 비결, 그리고 구체적인 역사적 사례까지 논리적으로 설명하고 있습니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 로마가 처음부터 이민자들로 구성된 용광로였다는 점을 강조해요. 역사학자 Livy의 말을 빌려 로물루스의 deliberate policy of nondiscrimination, 즉 의도적인 비차별 정책이 사방에서 사람들을 끌어모았음을 보여줍니다.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 이러한 초기의 openness, 즉 개방성이 로마의 성공을 위한 토대가 되었다는 핵심 주장을 펼칩니다. 로마인들 스스로도 자신들의 도시가 multicultural, 즉 다문화적이라는 점을 아주 당연하게 여겼죠.","hl":"f1"},{"n":6,"text":"다섯 번째 문장에서는 흥미로운 근거를 제시하는데요. 전설적인 로마의 왕들 중 대다수가 로마 태생이 아닌 이민자 출신이었고, 오직 virtues and merits, 즉 덕성과 공로라는 실력만으로 왕위에 올랐다는 사실입니다.","hl":"f2"},{"n":7,"text":"마지막 여섯 번째 문장에서는 제국이 확장되면서 로마가 새로운 문화를 얼마나 적극적으로 흡수했는지 설명합니다. 비록 변화의 속도가 너무 빨라 불평하는 사람도 있었지만, 로마의 적극적인 문화 수용은 멈추지 않았죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 로마를 \u003cb class=\"key\">용광로\u003c/b>로 정의하며 주제를 던진 뒤, 리비우스의 주장을 통해 \u003cb class=\"key\">개방성\u003c/b>이 성공의 토대임을 강조합니다. 이후 왕들의 사례를 구체적인 \u003cb class=\"key\">근거\u003c/b>로 제시하며 논리를 보강하고, 제국 확장기의 \u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">수용\u003c/b> 사례로 마무리하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>was said to have been (1)\u003c/b>\u003cspan>사회적 통념 및 전제 제시\u003c/span>\u003cb>claimed (2)\u003c/b>\u003cspan>역사적 사실에 기반한 주장\u003c/span>\u003cb>Livy asserts (3)\u003c/b>\u003cspan>핵심 논지 강조\u003c/span>\u003cb>Tradition held (5)\u003c/b>\u003cspan>전통적 근거 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">melting pot\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">immigrants\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">initial openness\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">multicultural\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">new cultural influences\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 로마의 정체성을 먼저 정의하고 이를 뒷받침하는 역사적 근거를 나열하는 두괄식 구조를 취하고 있습니다. 특히 세 번째 문장이 글 전체의 요지를 명확하게 담고 있는 주제문이라고 할 수 있어요.","hl":"ty"},{"n":9,"text":"문장 곳곳에 Livy asserts나 tradition held 같은 표현을 사용해서 자신의 주장이 역사적 사실에 근거하고 있음을 보여줍니다. 또한 initial openness라는 표현을 통해 로마의 성공 비결을 한 단어로 요약하고 있네요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>melting pot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>용광로(다양한 인종·문화가 섞인 곳)\u003c/span>\u003c/div>\u003cdiv>\u003cb>historian\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역사학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>original\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>원래의\u003c/span>\u003c/div>\u003cdiv>\u003cb>population\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인구\u003c/span>\u003c/div>\u003cdiv>\u003cb>comprised of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 구성된\u003c/span>\u003c/div>\u003cdiv>\u003cb>immigrant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이민자\u003c/span>\u003c/div>\u003cdiv>\u003cb>flood in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>밀려들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>direction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방향\u003c/span>\u003c/div>\u003cdiv>\u003cb>attracted by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 의해 이끌려\u003c/span>\u003c/div>\u003cdiv>\u003cb>deliberate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의도적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>policy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정책\u003c/span>\u003c/div>\u003cdiv>\u003cb>nondiscrimination\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비차별\u003c/span>\u003c/div>\u003cdiv>\u003cb>initial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>초기의\u003c/span>\u003c/div>\u003cdiv>\u003cb>openness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개방성\u003c/span>\u003c/div>\u003cdiv>\u003cb>assert\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lay the foundation\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>토대를 놓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>strength\u003c/b>\u003cem>명사\u003c/em>\u003cspan>힘, 강점\u003c/span>\u003c/div>\u003cdiv>\u003cb>multicultural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다문화의\u003c/span>\u003c/div>\u003cdiv>\u003cb>generation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세대\u003c/span>\u003c/div>\u003cdiv>\u003cb>foundation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설립, 기초\u003c/span>\u003c/div>\u003cdiv>\u003cb>tradition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전통\u003c/span>\u003c/div>\u003cdiv>\u003cb>legendary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전설적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>throne\u003c/b>\u003cem>명사\u003c/em>\u003cspan>왕위, 보좌\u003c/span>\u003c/div>\u003cdiv>\u003cb>virtue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>덕성\u003c/span>\u003c/div>\u003cdiv>\u003cb>merit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공로, 장점\u003c/span>\u003c/div>\u003cdiv>\u003cb>expand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>adopt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>채택하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>absorb\u003c/b>\u003cem>동사\u003c/em>\u003cspan>흡수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>complain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>불평하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rapid\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>급격한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"가장 중요한 단어는 역시 melting pot입니다. 여러 문화가 조화롭게 섞이는 곳을 의미하죠. 그리고 deliberate policy는 의도적인 정책이라는 뜻으로, 로마의 개방성이 우연이 아니라 철저한 계획이었음을 알려줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">comprised of\u003c/b>\u003cspan class=\"m\">~로 구성된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">composed of\u003c/span>\u003cspan class=\"s\">made up of\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">deliberate\u003c/b>\u003cspan class=\"m\">의도적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">intentional\u003c/span>\u003cspan class=\"s\">planned\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accidental\u003c/span>\u003cspan class=\"a\">unintentional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">initial\u003c/b>\u003cspan class=\"m\">초기의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">early\u003c/span>\u003cspan class=\"s\">original\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">final\u003c/span>\u003cspan class=\"a\">last\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">strength\u003c/b>\u003cspan class=\"m\">힘, 강점\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">power\u003c/span>\u003cspan class=\"s\">might\u003c/span>\u003cspan class=\"s\">force\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weakness\u003c/span>\u003cspan class=\"a\">frailty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">adopt\u003c/b>\u003cspan class=\"m\">채택하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accept\u003c/span>\u003cspan class=\"s\">embrace\u003c/span>\u003cspan class=\"s\">take up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003cspan class=\"a\">discard\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"구성되다라는 뜻의 comprised of는 composed of로 바꿔 쓸 수 있습니다. 의도적인이라는 뜻의 deliberate는 intentional과 동의어이고, 반대말로는 accidental이 있어요. 초기의라는 뜻의 initial은 final과 반대되는 개념이라는 점도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로마는\u003c/span>\u003cspan class=\"en\">Rome\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일컬어졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">였다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">용광로\u003c/span>\u003cspan class=\"en\">a melting pot\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맨 처음부터\u003c/span>\u003cspan class=\"en\">from the very start.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">로마는 맨 처음부터 용광로였다고 일컬어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로마가 초기부터 다양한 문화와 인종이 섞인 \u003cb class=\"key\">용광로\u003c/b> 같은 도시였음을 강조하며 글의 주제를 제시합니다. 과거에 대한 전언을 \u003cb class=\"key\">완료 \u003c/b>\u003cb class=\"key\">부정사\u003c/b>를 사용해 표현했습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : be [동사] + said [과거분사] : \"일컬어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">\u003c/span> : to [부정사] + have been [완료형] : \"였다고\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Rome, 로마는. was said, 일컬어졌다. to have been, 였다고. a melting pot, 용광로. from the very start, 맨 처음부터. 이 문장 전체를 해석하면, 로마는 맨 처음부터 용광로였다고 일컬어졌다.","hl":"m"},{"n":13,"text":"로마는 건국 초기부터 다양한 사람들이 모여 섞이는 용광로 같은 곳이었다는 뜻이에요. 이 문장은 로마의 개방성과 다문화적 특성을 보여주는 아주 중요한 도입부입니다.","hl":"mn"},{"n":14,"text":"첫 번째로 was said는 수동태예요. 로마가 스스로 말하는 게 아니라 그렇게 전해진다는 뜻이죠. 두 번째로 아주 중요한 부분인데 바로 to have been입니다. 사람들이 말하는 시점보다 로마가 용광로였던 과거의 사실을 더 강조하기 위해 완료 부정사를 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역사학자 Livy는 주장했다\u003c/span>\u003cspan class=\"en\">The historian Livy claimed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 도시의 원래 인구가\u003c/span>\u003cspan class=\"en\">the city's original population\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이민자들로 구성되었다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">comprised \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> immigrants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사방에서 몰려든\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">flooding \u003c/span>\u003cspan class=\"tgt\">in\u003c/span> from all directions,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Romulus의 의도적인 비차별 정책에 의해 이끌려\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">attracted\u003c/span> by Romulus's deliberate policy of nondiscrimination.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">역사학자 Livy는 그 도시의 원래 인구가 Romulus의 의도적인 비차별 정책에 의해 이끌려 사방에서 몰려든 이민자들로 구성되었다고 주장했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로마 인구의 기원이 다양한 곳에서 온 이민자들이며, 이는 통치자의 \u003cb class=\"key\">비차별 \u003c/b>\u003cb class=\"key\">정책\u003c/b> 덕분이었음을 설명합니다. \u003cb class=\"key\">과거분사\u003c/b>를 사용해 이민자들이 정책에 매료되었음을 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : be [동사] + comprised [과거분사] + of : \"구성되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">\u003c/span> : flood [동사원형] + ing [현재분사] : \"몰려든\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">\u003c/span> : attract [동사원형] + ed [과거분사] : \"이끌려\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The historian Livy claimed, 역사학자 Livy는 주장했다. the city's original population, 그 도시의 원래 인구가. was comprised of immigrants, 이민자들로 구성되었다고. flooding in from all directions, 사방에서 몰려든. attracted by Romulus's deliberate policy of nondiscrimination, Romulus의 의도적인 비차별 정책에 의해 이끌려. 이 문장 전체를 해석하면, 역사학자 Livy는 그 도시의 원래 인구가 Romulus의 의도적인 비차별 정책에 의해 이끌려 사방에서 몰려든 이민자들로 구성되었다고 주장했다.","hl":"m"},{"n":16,"text":"역사학자 리비는 로마 시민들이 처음부터 여러 곳에서 온 이민자들이었다고 말했어요. 로마 건국자인 로물루스가 일부러 차별하지 않는 정책을 펴서 사람들이 모여들었다는 점이 핵심이죠.","hl":"mn"},{"n":17,"text":"첫 번째로 was comprised of는 무엇으로 구성되었다는 뜻의 수동태 표현이에요. 두 번째로 flooding in은 이민자들이 직접 밀려 들어오는 능동의 의미라 현재분사를 썼고요. 세 번째인 attracted는 이민자들이 정책에 이끌림을 당한 것이라 과거분사를 썼답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 이러한 초기의 개방성이었다\u003c/span>\u003cspan class=\"en\">It was this initial openness,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Livy가 주장하길\u003c/span>\u003cspan class=\"en\">Livy asserts,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">토대를 놓은 것은\u003c/span>\u003cspan class=\"en\">that \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">laid\u003c/span> the foundations\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 도시의 이후의 힘과 성공을 위한\u003c/span>\u003cspan class=\"en\">for the later strength and success of the city.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Livy가 주장하길, 그 도시의 이후의 힘과 성공을 위한 토대를 놓은 것은 바로 이러한 초기의 개방성이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로마가 나중에 강력하고 성공적인 도시가 될 수 있었던 결정적인 이유가 바로 \u003cb class=\"key\">초기 \u003c/b>\u003cb class=\"key\">개방성\u003c/b>이었음을 강조합니다. \u003cb class=\"key\">강조 \u003c/b>\u003cb class=\"key\">구문\u003c/b>을 사용하여 문장의 핵심 요소를 부각합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : lay [타동사] 의 과거형 : \"놓은 (것은)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">\u003c/span> : It is/was [강조 대상] + that [나머지 문장] : \"~한 것은 바로 ...이었다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It was this initial openness, 바로 이러한 초기의 개방성이었다. Livy asserts, Livy가 주장하길. that laid the foundations, 토대를 놓은 것은. for the later strength and success of the city, 그 도시의 이후의 힘과 성공을 위한. 이 문장 전체를 해석하면, Livy가 주장하길, 그 도시의 이후의 힘과 성공을 위한 토대를 놓은 것은 바로 이러한 초기의 개방성이었다.","hl":"m"},{"n":19,"text":"로마가 나중에 성공한 비결은 결국 처음에 가졌던 열린 마음 덕분이었다는 뜻이에요. 중간에 들어간 Livy asserts는 리비가 말하길 정도의 삽입절로 이해하면 돼요.","hl":"mn"},{"n":20,"text":"첫 번째로 it was와 that이 보이죠. 바로 강조하고 싶은 말을 그 사이에 넣은 이때 강조 구문이에요. 초기의 개방성이라는 말을 정말 강조하고 싶었던 거죠. 두 번째로 laid는 기초를 쌓다 할 때 쓰는 단어 lay의 과거형으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로마인들은\u003c/span>\u003cspan class=\"en\">Romans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 도시를 묘사했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">described \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">city \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다문화적이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">multicultural\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 세대에 걸쳐\u003c/span>\u003cspan class=\"en\">in the generations after\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도시의 설립 이후\u003c/span>\u003cspan class=\"en\">its foundation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">로마인들은 도시의 설립 이후 여러 세대에 걸쳐 자신들의 도시를 다문화적이라고 묘사했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로마인들이 자신들의 도시를 \u003cb class=\"key\">다문화적\u003c/b>인 공간으로 인식했음을 보여주며, 건국 초기부터 이어진 \u003cb class=\"key\">개방적\u003c/b>인 정체성을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">describe A as B\u003c/span> : describe [타동사] + A [목적어] + as [전치사] + B [목적격 보어/형용사] : \"자신들의 도시를 다문화적이라고 묘사했다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Romans, 로마인들은. described their city, 자신들의 도시를 묘사했다. as multicultural, 다문화적이라고. in the generations after, 여러 세대에 걸쳐. its foundation, 도시의 설립 이후. 이 문장 전체를 해석하면, 로마인들은 도시의 설립 이후 여러 세대에 걸쳐 자신들의 도시를 다문화적이라고 묘사했다.","hl":"m"},{"n":22,"text":"이 문장은 로마인들이 스스로의 정체성을 어떻게 규정했는지 보여줍니다. 혈통 중심이 아니라 여러 문화가 섞인 다문화적인 도시라는 점을 자기 인식의 핵심으로 삼았다는 것이죠.","hl":"mn"},{"n":23,"text":"문법을 보면 describe A as B 구조가 쓰였는데요. 목적어인 their city를 보충 설명하는 자리에 as와 함께 multicultural이라는 형용사가 온 형태입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전통적으로 ~라고 한다 그 도시의 전설적인 왕들 중 소수만이 로마 태생이었고, 나머지 왕들은 모두 이민자로 이주해 왔다고 왕위에 선택되기 전에 그들의 덕성과 공로로\u003c/span>\u003cspan class=\"en\">Tradition held that only a minority of the city's legendary kings were Roman­born, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">others \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">arriving \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">immigrants\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">chosen\u003c/span> for the throne for their virtues and merits.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전통적으로, 그 도시의 전설적인 왕들 중 소수만이 로마 태생이었고, 나머지 왕들은 그들의 덕성과 공로로 왕위에 선택되기 전에 모두 이민자로 이주해 왔다고 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 로마의 최고 권력자인 왕들조차 외부 출신이었다는 전통을 통해, 출신보다 \u003cb class=\"key\">능력(덕성과 \u003c/b>\u003cb class=\"key\">공로)\u003c/b>을 중시했던 로마의 \u003cb class=\"key\">포용성\u003c/b>을 구체적으로 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">with + 목적어 + 분사 (부대상황)\u003c/span> : with [전치사] + the others [목적어] + arriving [현재분사] : \"나머지 왕들은 모두 이민자로 이주해 오면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 뒤의 수동형 동명사\u003c/span> : before [전치사] + being [동명사] + chosen [과거분사/수동] : \"선택되기 전에\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Tradition held that, 전통적으로 ~라고 한다. only a minority of the city's legendary kings, 그 도시의 전설적인 왕들 중 소수만이. were Roman-born, 로마 태생이었고. with the others all arriving as immigrants, 나머지 왕들은 모두 이민자로 이주해 왔다고. before being chosen for the throne, 왕위에 선택되기 전에. for their virtues and merits, 그들의 덕성과 공로로. 이 문장 전체를 해석하면, 전통적으로, 그 도시의 전설적인 왕들 중 소수만이 로마 태생이었고, 나머지 왕들은 그들의 덕성과 공로로 왕위에 선택되기 전에 모두 이민자로 이주해 왔다고 한다.","hl":"m"},{"n":25,"text":"로마의 전설적인 왕들조차 외부인이었다는 점을 강조하며 능력주의적인 면모를 부각합니다. 로마가 얼마나 개방성을 가진 사회였는지 왕의 혈통이라는 사례로 증명하는 대목이에요.","hl":"mn"},{"n":26,"text":"첫 번째로 with 뒤에 목적어 the others와 능동 관계인 분사 arriving이 쓰인 부대상황 구문이 중요하고요. 두 번째로 전치사 before 뒤에 동명사 being chosen을 써서 수동의 의미를 나타낸 부분도 꼭 챙겨야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제국이 세 대륙에 걸쳐 확장되면서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">empire \u003c/span>\u003cspan class=\"tgt\">expanded\u003c/span> across three continents,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">로마는 적극적으로 새로운 문화적 영향을 채택하였고\u003c/span>\u003cspan class=\"en\">Rome eagerly adopted new cultural influences\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유입되는 집단들을 흡수했다 ―\u003c/span>\u003cspan class=\"en\">and absorbed incoming groups ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 아마도 어떤 사람들에게는 다소 지나치게 적극적이었을지도 모르는데,\u003c/span>\u003cspan class=\"en\">perhaps a little too eagerly for \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">some, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 시인 Juvenal 처럼,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">who, \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">poet \u003c/span>\u003cspan class=\"tgt\">Juvenal, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 급격한 문화 변화 속도에 대해 불평했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">complained\u003c/span> about the rapid rate of cultural change.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">제국이 세 대륙에 걸쳐 확장되면서, 로마는 적극적으로 새로운 문화적 영향을 채택하였고, 유입되는 집단들을 흡수했다. 이것은 아마도 어떤 사람들에게는 다소 지나치게 적극적이었을지도 모르는데, 그들은 시인 Juvenal 처럼 그 급격한 문화 변화 속도에 대해 불평했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 영토 확장과 함께 더욱 가속화된 \u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">수용\u003c/b> 과정을 보여주며, 급격한 변화에 대한 \u003cb class=\"key\">저항\u003c/b>의 목소리도 있었음을 덧붙입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 As (~함에 따라)\u003c/span> : As [접속사] + the empire [주어] + expanded [동사] : \"제국이 확장됨에 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : some [선행사] + , [콤마] + who [관계대명사] : \"어떤 사람들, 그런데 그들은 불평했다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"As the empire expanded across three continents, 제국이 세 대륙에 걸쳐 확장되면서. Rome eagerly adopted new cultural influences, 로마는 적극적으로 새로운 문화적 영향을 채택하였고. and absorbed incoming groups ―, 유입되는 집단들을 흡수했다 ―. perhaps a little too eagerly for some, 이것은 아마도 어떤 사람들에게는 다소 지나치게 적극적이었을지도 모르는데. who, like the poet Juvenal, 그들은 시인 Juvenal 처럼. complained about the rapid rate of cultural change, 그 급격한 문화 변화 속도에 대해 불평했다.. 이 문장 전체를 해석하면, 제국이 세 대륙에 걸쳐 확장되면서, 로마는 적극적으로 새로운 문화적 영향을 채택하였고, 유입되는 집단들을 흡수했다. 이것은 아마도 어떤 사람들에게는 다소 지나치게 적극적이었을지도 모르는데, 그들은 시인 Juvenal 처럼 그 급격한 문화 변화 속도에 대해 불평했다.","hl":"m"},{"n":28,"text":"영토 확장기에 로마가 보여준 문화적 흡수력을 설명하면서 그 이면에 존재했던 변화에 대한 저항도 함께 언급합니다.","hl":"mn"},{"n":29,"text":"첫 번째로 접속사 As는 제국의 확장과 문화 채택이 동시에 일어났음을 나타내는 ~함에 따라라는 의미로 쓰였어요. 두 번째로 콤마 뒤의 관계대명사 who는 앞의 some을 보충 설명하는 계속적 용법으로 쓰여서 문장을 자연스럽게 이어줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>로마는 건국 초기부터 다양한 출신의 인종이 조화를 이루는 \u003cb class=\"key\">용광로\u003c/b>와 같았습니다.\u003c/li>\u003cli>로물루스는 \u003cb class=\"key\">비차별 \u003c/b>\u003cb class=\"key\">정책\u003c/b>을 통해 이민자들이 사방에서 몰려오도록 유도했습니다.\u003c/li>\u003cli>이러한 초기의 \u003cb class=\"key\">개방성\u003c/b>은 로마가 대제국으로 성장하는 결정적인 \u003cb class=\"key\">토대\u003c/b>가 되었습니다.\u003c/li>\u003cli>로마는 \u003cb class=\"key\">실력\u003c/b> 위주로 왕을 선출하고 외래문화를 적극적으로 \u003cb class=\"key\">흡수\u003c/b>하며 발전했습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Rome's initial openness to immigrants and diverse cultures laid the foundation for its long-term strength and success.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">로마는 건국 초기부터 \u003cb class=\"key\">비차별 \u003c/b>\u003cb class=\"key\">정책\u003c/b>을 통해 다양한 이민자를 수용하며 성장한 \u003cb class=\"key\">다문화적\u003c/b> 용광로였으며, 이러한 \u003cb class=\"key\">개방성\u003c/b>이 도시 성공의 근본적인 토대가 되었습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"결국 로마의 진정한 힘은 폐쇄적인 태도가 아니라 모든 것을 받아들이는 개방성에서 나왔다는 것을 알 수 있습니다. 다양성을 인정하고 실력을 중시했던 로마의 지혜는 오늘날 우리에게도 큰 교훈을 주네요. 오늘도 공부하느라 정말 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
