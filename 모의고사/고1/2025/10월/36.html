</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 36번","audioDir":"36_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">36번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>The Remarkable World of Multisensory Experiences in Daily Life\u003c/h1>\u003ch2>일상생활 속 놀라운 다중 감각 경험의 세계\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>다중 감각 경험은 일상에서 당연하게 여겨지지만, 식사와 같은 평범한 활동도 사실 여러 \u003cb class=\"key\">감각의 \u003c/b>\u003cb class=\"key\">융합\u003c/b>과 상호작용으로 이루어진 복합적인 과정이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Our daily experiences, such as eating, are not simple but involve a complex fusion of multiple senses.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 우리가 매일 겪으면서도 미처 깨닫지 못했던 놀라운 감각의 세계를 다룬 동아 윤 삼십육번 지문을 함께 살펴볼 거예요. 이 글의 요지는 우리가 평범하다고 생각하는 식사조차 사실은 여러 감각이 어우러진 복합적인 경험이라는 것입니다. 과연 우리 감각이 어떻게 조화를 이루는지 요약과 함께 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 사물을 인식할 때 여러 감각을 동시에 사용하는 현상을 \u003cb class=\"key\">다감각 \u003c/b>\u003cb class=\"key\">통합\u003c/b>(Multisensory Integration)이라고 합니다. 예를 들어 영화를 볼 때 시각과 청각이 합쳐져 하나의 생생한 현실을 만들어내는 것과 같습니다. 이 글은 평소 인지하지 못하던 \u003cb class=\"key\">교차 \u003c/b>\u003cb class=\"key\">모드 \u003c/b>\u003cb class=\"key\">지각\u003c/b>(Cross-modal Perception)이 일상의 평범한 식사 과정에 어떻게 깊게 관여하는지 설명합니다. 마치 오케스트라의 여러 악기가 모여 하나의 곡을 연주하듯, 우리 뇌는 \u003cb class=\"key\">감각 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 실시간으로 결합하여 세상을 경험합니다.\u003c/div>","segs":[{"n":2,"text":"강의에 앞서 다감각 통합이라는 개념을 알아두면 좋아요. 우리는 보통 눈으로는 보고 입으로는 맛을 본다고 따로 생각하지만, 사실 우리 뇌는 이 정보들을 실시간으로 합쳐서 하나의 경험으로 만들어내요. 마치 영화관에서 화면과 스피커 소리가 합쳐져야 진짜 영화처럼 느껴지는 것과 같죠. 오늘은 이런 다감각 통합이 식사라는 일상에서 어떻게 일어나는지 배워볼 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>일상적 통념\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>다중 감각 경험이 일상의 주요 부분이지만, 감각이 정상일 때는 이를 \u003cb class=\"key\">당연하게 \u003c/b>\u003cb class=\"key\">여기는\u003c/b> 경향이 있다고 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>인식의 전환\u003csmall>전환 · 문장 2\u003c/small>\u003c/h4>\u003cp>하지만 자세히 관찰해보면 우리가 사는 세상이 놀라운 \u003cb class=\"key\">다중 \u003c/b>\u003cb class=\"key\">감각 \u003c/b>\u003cb class=\"key\">세계\u003c/b>임을 깨닫게 된다고 역설합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>구체적 예시\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>식사를 예로 들어, 눈으로 먼저 먹고 \u003cb class=\"key\">질감, \u003c/b>\u003cb class=\"key\">맛, \u003c/b>\u003cb class=\"key\">냄새\u003c/b> 등 수많은 신호에 노출되는 과정을 묘사합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>감각의 확장\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>심지어 주변의 분위기나 \u003cb class=\"key\">음식을 \u003c/b>\u003cb class=\"key\">씹는 \u003c/b>\u003cb class=\"key\">소리\u003c/b>, 도구의 소리까지 식사 경험에 영향을 준다며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 당연하게 여기던 통념에서 시작해 식사라는 구체적인 예시로 나아가는 아주 논리적인 흐름을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 도입부로 우리가 일상에서 다중 감각 경험을 당연하게 여기는 경향을 지적해요. 하지만 문장 중간에 나오는 However를 기점으로, 자세히 들여다보면 우리 일상이 얼마나 놀라운 다중 감각 세계인지 강조하며 주제를 제시합니다.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장은 식사를 예시로 들어 설명을 이어가요. 처음에는 평범한 일처럼 보이지만 실제로는 감각의 융합인 fusion이 일어나는 과정임을 보여주죠. 우리는 눈으로 먼저 먹고, 그다음 맛과 냄새, 질감 같은 수많은 신호에 노출됩니다.","hl":"f1"},{"n":6,"text":"마지막으로 여섯 번째와 일곱 번째 문장에서는 감각의 범위를 더 확장해요. 단순히 입과 코뿐만 아니라 음식을 씹는 소리나 식당의 분위기, 수저 같은 도구의 소리까지도 우리의 식사 경험에 영향을 준다며 글을 마무리합니다.","hl":"f2"},{"n":7,"text":"심지어 주변의 분위기나 음식을 씹는 소리, 도구의 소리까지 식사 경험에 영향을 준다며 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거(예시)\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 통념을 제시한 후, 두 번째 문장에서 글쓴이의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주장\u003c/b>을 명확히 드러냅니다. 이후 '식사'라는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 통해 주장을 뒷받침하며 내용을 확장하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>yet (1)\u003c/b>\u003cspan>앞의 내용과 반대되는 통념 제시\u003c/span>\u003cb>However (2)\u003c/b>\u003cspan>글쓴이의 주장 시작\u003c/span>\u003cb>Consider (3)\u003c/b>\u003cspan>구체적 예시 도입\u003c/span>\u003cb>And it does not stop there (6)\u003c/b>\u003cspan>내용의 추가 및 확장\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Multisensory experiences\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">remarkable multisensory world\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fusion of the senses\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">eating experience\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 두괄식 구조를 취하고 있어요. 두 번째 문장에서 우리가 사는 세상이 놀라운 다중 감각 세계라는 핵심 주장을 먼저 던집니다. 그 후에 식사라는 익숙한 상황을 예로 들어 주장을 뒷받침하는 예시 위주의 전개 방식을 보여줍니다.","hl":"ty"},{"n":9,"text":"글의 흐름을 잡아주는 신호어들에 주목해 보세요. 첫 번째 문장의 yet과 두 번째 문장의 However는 우리의 무관심을 일깨우는 반전의 역할을 하죠. 세 번째 문장의 Consider는 구체적인 사례를 들어보자는 신호이고, 여섯 번째 문장의 And it does not stop there는 이야기가 더 심화될 것임을 알려주는 아주 중요한 표현입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>multisensory\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다중 감각의\u003c/span>\u003c/div>\u003cdiv>\u003cb>central\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주요한, 중심적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>everyday lives\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일상생활\u003c/span>\u003c/div>\u003cdiv>\u003cb>take A for granted\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 당연하게 여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>especially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>특히\u003c/span>\u003c/div>\u003cdiv>\u003cb>function\u003c/b>\u003cem>동사\u003c/em>\u003cspan>작동하다, 기능을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>corrected\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>교정된\u003c/span>\u003c/div>\u003cdiv>\u003cb>aid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보조 도구, 도움\u003c/span>\u003c/div>\u003cdiv>\u003cb>closer inspection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>더 자세한 조사(관찰)\u003c/span>\u003c/div>\u003cdiv>\u003cb>ordinary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>평범한\u003c/span>\u003c/div>\u003cdiv>\u003cb>reveal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>드러내다, 보여주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>remarkable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>regular meal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>평상시의 식사\u003c/span>\u003c/div>\u003cdiv>\u003cb>at first\u003c/b>\u003cem>부사\u003c/em>\u003cspan>처음에는\u003c/span>\u003c/div>\u003cdiv>\u003cb>fusion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>융합\u003c/span>\u003c/div>\u003cdiv>\u003cb>exposed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>노출된\u003c/span>\u003c/div>\u003cdiv>\u003cb>countless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>sensory signals\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감각 신호\u003c/span>\u003c/div>\u003cdiv>\u003cb>influence\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>texture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질감\u003c/span>\u003c/div>\u003cdiv>\u003cb>atmosphere\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분위기, 상황\u003c/span>\u003c/div>\u003cdiv>\u003cb>interaction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상호작용\u003c/span>\u003c/div>\u003cdiv>\u003cb>chewing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>씹기\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 꼭 기억해야 할 표현은 take it for granted입니다. 무엇을 당연하게 여기다라는 뜻으로 시험에 아주 자주 나와요. 그리고 여러 감각이 하나로 합쳐진다는 의미의 fusion이라는 단어도 이 글의 핵심 키워드이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">ordinary\u003c/b>\u003cspan class=\"m\">평범한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"s\">usual\u003c/span>\u003cspan class=\"s\">normal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">extraordinary\u003c/span>\u003cspan class=\"a\">unique\u003c/span>\u003cspan class=\"a\">special\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reveal\u003c/b>\u003cspan class=\"m\">드러내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show\u003c/span>\u003cspan class=\"s\">disclose\u003c/span>\u003cspan class=\"s\">exhibit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">cover\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fusion\u003c/b>\u003cspan class=\"m\">융합\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mixture\u003c/span>\u003cspan class=\"s\">combination\u003c/span>\u003cspan class=\"s\">blend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">separation\u003c/span>\u003cspan class=\"a\">division\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remarkable\u003c/b>\u003cspan class=\"m\">놀라운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">amazing\u003c/span>\u003cspan class=\"s\">extraordinary\u003c/span>\u003cspan class=\"s\">notable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">unimpressive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">influence\u003c/b>\u003cspan class=\"m\">영향을 주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">affect\u003c/span>\u003cspan class=\"s\">impact\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어 정리도 해볼까요? ordinary는 평범한이라는 뜻인데 usual이나 common으로 바꿔 쓸 수 있고, 반대말로는 extraordinary가 있어요. 놀라운이라는 뜻의 remarkable은 amazing과 비슷하고, fusion은 mixture나 combination으로 이해하면 쉽습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다중 감각 경험은\u003c/span>\u003cspan class=\"en\">Multisensory experiences are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 일상생활의 주요한 부분이지만,\u003c/span>\u003cspan class=\"en\">a central part of our everyday lives,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 그것들을 종종 당연하게 여긴다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">yet\u003c/span> we often \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">granted\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특히 우리의 감각이 정상적으로 작동하거나\u003c/span>\u003cspan class=\"en\">especially when our senses function normally\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정상으로 교정될 때\u003c/span>\u003cspan class=\"en\">or \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">corrected\u003c/span> to normal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안경과 같은 보조 도구로\u003c/span>\u003cspan class=\"en\">with aids like glasses.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다중 감각 경험은 우리 일상생활의 주요한 부분이지만, 우리는 특히 감각이 정상적으로 작동하거나 안경과 같은 보조 도구로 정상으로 교정될 때 그것들을 종종 당연하게 여긴다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리 삶의 대부분이 \u003cb class=\"key\">다중 \u003c/b>\u003cb class=\"key\">감각\u003c/b>으로 이루어져 있지만, 너무 익숙해서 그 소중함을 \u003cb class=\"key\">당연하게\u003c/b> 여기고 있다는 도입부입니다. 감각이 정상일 때는 그 복합적인 작용을 깨닫기 어렵다는 점을 \u003cb class=\"key\">역설\u003c/b>적으로 표현합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사\u003c/span> : [절] + [yet] + [절] : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용구(take A for granted)\u003c/span> : take [목적어] [for granted] : \"그것들을 당연하게 여기다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be + [p.p.] : \"교정된다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Multisensory experiences are, 다중 감각 경험은. a central part of our everyday lives, 우리 일상생활의 주요한 부분이지만. yet we often take them for granted, 우리는 그것들을 종종 당연하게 여긴다. especially when our senses function normally, 특히 우리의 감각이 정상적으로 작동하거나. or are corrected to normal, 정상으로 교정될 때. with aids like glasses, 안경과 같은 보조 도구로. 이 문장 전체를 해석하면, 다중 감각 경험은 우리 일상생활의 주요한 부분이지만, 우리는 특히 감각이 정상적으로 작동하거나 안경과 같은 보조 도구로 정상으로 교정될 때 그것들을 종종 당연하게 여긴다.","hl":"m"},{"n":13,"text":"이 문장은 우리 삶의 많은 부분이 다중 감각으로 채워져 있다는 사실을 말해 줘요. 하지만 우리가 안경 같은 보조 도구로 감각을 교정하거나 평소에 아무 문제가 없을 때는 그 중요성을 당연하게 느끼며 지나친다는 점을 강조하고 있습니다.","hl":"mn"},{"n":14,"text":"첫 번째로 yet은 문장 사이에서 하지만이라는 의미로 대조를 보여 주는 접속사예요. 두 번째로 take them for granted는 목적어인 그것들을 당연하게 여기다라는 아주 중요한 숙어입니다. 마지막 세 번째로 are corrected는 수동태 표현으로 우리의 감각이 안경 등에 의해 교정되는 상황을 잘 설명하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 더 자세히 살펴보는 것은\u003c/span>\u003cspan class=\"en\">However, closer inspection\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤, 심지어는 가장 평범한 경험조차\u003c/span>\u003cspan class=\"en\">to any, even the most ordinary experiences,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라운 다중 감각 세계를 보여 준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">reveals\u003c/span> the remarkable multisensory world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 살고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">which\u003c/span> we live.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(B) 그러나 어떤, 심지어는 가장 평범한 경험조차 더 자세히 살펴보는 것은 우리가 살고 있는 놀라운 다중 감각 세계를 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 익숙함에서 벗어나 \u003cb class=\"key\">자세히 \u003c/b>\u003cb class=\"key\">관찰\u003c/b>하면, 아주 평범한 일조차 사실은 수많은 감각이 얽힌 \u003cb class=\"key\">놀라운 \u003c/b>\u003cb class=\"key\">세계\u003c/b>임을 깨닫게 된다는 내용입니다. 글의 분위기를 반전시키며 상세 설명으로 들어가는 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : [단수 주어(inspection)] + [단수 동사(reveals)] : \"보여 준다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 관계대명사\u003c/span> : [선행사] + [in which] + [완전한 절] : \"우리가 살고 있는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"However, closer inspection, 그러나 더 자세히 살펴보는 것은. to any, even the most ordinary experiences, 어떤, 심지어는 가장 평범한 경험조차. reveals the remarkable multisensory world, 놀라운 다중 감각 세계를 보여 준다. in which we live, 우리가 살고 있는. 이 문장 전체를 해석하면, (B) 그러나 어떤, 심지어는 가장 평범한 경험조차 더 자세히 살펴보는 것은 우리가 살고 있는 놀라운 다중 감각 세계를 보여 준다.","hl":"m"},{"n":16,"text":"하지만 아무리 평범한 일이라도 조금만 자세히 들여다보면 우리가 얼마나 복합적인 감각의 세계에서 살고 있는지 알 수 있다는 뜻이에요. 익숙한 일상 속에 숨겨진 놀라움을 발견하라는 메시지를 던지고 있습니다.","hl":"mn"},{"n":17,"text":"첫 번째로 핵심 주어는 inspection이라는 단수 명사예요. 그래서 동사로 s가 붙은 reveals를 써서 수 일치를 해 주어야 합니다. 두 번째로 in which는 전치사와 관계대명사가 합쳐진 형태로 뒤에 완전한 문장이 나오며 앞의 세상을 수식하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각해 봐라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Consider\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경험을 하는\u003c/span>\u003cspan class=\"en\">the experience \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">eating\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상의 식사를\u003c/span>\u003cspan class=\"en\">a regular meal.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일상의 식사를 하는 경험을 생각해 봐라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 '평범한 경험'의 구체적인 \u003cb class=\"key\">예시\u003c/b>로 '식사'를 제시합니다. 독자에게 직접 \u003cb class=\"key\">상상\u003c/b>해 보라고 권유하며 글의 집중도를 높입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : [동사원형] ~ : \"생각해 봐라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사(전치사의 목적어)\u003c/span> : [전치사 of] + [동사-ing] : \"먹는 것의\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Consider, 생각해 봐라. the experience of eating, 경험을 하는. a regular meal, 일상의 식사를. 이 문장 전체를 해석하면, 일상의 식사를 하는 경험을 생각해 봐라.","hl":"m"},{"n":19,"text":"이제 본격적인 예시를 들어줄 차례예요. 우리가 매일 하는 아주 평범한 식사가 사실은 얼마나 대단한 감각의 결합인지 설명하기 위해 질문을 던지는 것이죠.","hl":"mn"},{"n":20,"text":"첫 번째로 문장이 Consider라는 동사원형으로 시작되었죠. 이건 독자에게 제안하는 명령문 형태입니다. 두 번째로 of eating을 보면 전치사 뒤에는 명사가 와야 하기 때문에 동사를 동명사 형태로 바꿔 준 것을 확인할 수 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan
