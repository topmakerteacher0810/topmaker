@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 40번","audioDir":"40_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">40번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>The Power of Illusory Progress: How a 'Head Start' Boosts Motivation\u003c/h1>\u003ch2>착각된 진전의 힘: '앞선 출발'이 동기 부여를 높이는 방법\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>실제 조건은 동일하더라도, 보너스 도장을 통해 목표에 이미 근접했다는 \u003cb class=\"key\">착각된 \u003c/b>\u003cb class=\"key\">진전\u003c/b>을 느끼게 하면 사람들은 더 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">동기\u003c/b>를 얻어 목표를 빠르게 달성한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Creating a sense of artificial progress toward a goal significantly enhances people's motivation to complete it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 카페에서 흔히 받는 쿠폰 도장에 숨겨진 놀라운 심리 법칙을 배워볼 거예요. 바로 illusory progress, 즉 착각된 진전이 우리를 얼마나 부지런하게 만드는지에 대한 이야기입니다. 오늘 수업을 통해 우리가 왜 보너스 도장에 열광하는지 그 이유를 명확히 정리해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">심리학의 \u003cb class=\"key\">목표 \u003c/b>\u003cb class=\"key\">구배 \u003c/b>\u003cb class=\"key\">효과\u003c/b>(Goal Gradient Effect)에 따르면, 생명체는 목표 지점에 가까워질수록 더 열심히 노력하는 경향이 있습니다. 예를 들어, 마라톤 선수가 \u003cb class=\"key\">결승선\u003c/b>이 보일 때 마지막 스퍼트를 내는 것과 같죠. 이 지문은 이를 마케팅에 응용한 \u003cb class=\"key\">착각된 \u003c/b>\u003cb class=\"key\">진전\u003c/b>(Illusory Progress) 실험을 다룹니다. 사람들에게 '0'에서 시작하게 하는 대신 '2'를 채워주고 시작하게 함으로써, 심리적으로 \u003cb class=\"key\">성취감\u003c/b>을 먼저 맛보게 하여 행동을 유도하는 전략입니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 목표 구배 효과라는 말을 들어본 적 있나요? 결승선이 가까워질수록 힘이 불끈 솟는 현상을 말하죠. 마케팅 전문가들은 이 원리를 이용해 우리가 목표에 이미 발을 들여놓았다는 기분을 느끼게 합니다. 지문 속 실험에서도 아무것도 없는 상태보다는 이미 무언가 이루어진 상태라는 느낌, 즉 head start가 사람들을 어떻게 움직였는지 주목해 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>실험 설계\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>카페와 협력하여 \u003cb class=\"key\">착각된 \u003c/b>\u003cb class=\"key\">진전\u003c/b>이 동기 부여에 미치는 영향을 확인하기 위한 실험을 설계하고 \u003cb class=\"key\">보상 \u003c/b>\u003cb class=\"key\">카드\u003c/b>를 배부함.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>대조 조건 제시\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>10칸 빈 카드와 2개가 채워진 12칸 카드를 제공했으나, 두 그룹 모두 10잔을 사야 하는 조건은 \u003cb class=\"key\">실질적으로 \u003c/b>\u003cb class=\"key\">동일\u003c/b>했음.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>실험 결과\u003csmall>결과 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>보너스 도장을 받은 고객들은 이미 16%를 \u003cb class=\"key\">달성했다는 \u003c/b>\u003cb class=\"key\">착각\u003c/b>을 하여 대조군보다 더 자주, 더 빨리 카페를 방문함.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>최종 결론\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>보상에 더 \u003cb class=\"key\">가까워졌다고 \u003c/b>\u003cb class=\"key\">믿는\u003c/b> 심리가 목표 지점에 도달하려는 동기를 더욱 강화한다는 사실이 입증됨.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"자, 이제 카페에서 벌어진 흥미로운 실험의 전개 과정을 함께 따라가 볼까요?","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 실험의 시작을 알립니다. Kivetz와 동료들은 카페와 손을 잡고 illusory progress, 즉 착각된 진전이 실제로 사람들을 움직이게 하는지 확인하기 위해 보상 카드 실험을 준비했습니다.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장은 실험의 구체적인 설계 내용입니다. 한 그룹은 빈칸 열 개짜리 카드를, 다른 그룹은 보너스 두 개가 미리 찍힌 열두 개짜리 카드를 받았죠. 하지만 엄밀히 말하면 두 그룹 모두 커피 열 잔을 사야 하는 조건은 완전히 똑같았습니다.","hl":"f1"},{"n":6,"text":"여섯 번째부터 여덟 번째 문장은 실험의 결과입니다. 보너스 도장을 받은 사람들은 자신이 남들보다 앞서 출발했다고 생각했고, 이미 십육 퍼센트나 목표를 달성했다고 착각했습니다. 그래서 다른 사람들보다 카페에 더 자주 왔고 카드도 더 빨리 채웠죠.","hl":"f2"},{"n":7,"text":"마지막 아홉 번째 문장은 이 모든 실험의 결론입니다. 보상에 더 가까워졌다고 믿을수록, 사람들은 결승선에 도달하려는 동기를 더 강하게 부여받는다는 핵심 메시지를 던지고 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시를 통한 원리 도출\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">카페 고객들을 대상으로 한 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">실험\u003c/b> 과정을 상세히 나열한 후, 마지막 문장에서 실험이 시사하는 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">심리 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>을 정리하며 마무리하는 구조임.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Yet (4)\u003c/b>\u003cspan>외견상 차이와 실질적 동일함의 대조\u003c/span>\u003cb>But (6)\u003c/b>\u003cspan>심리적 매력이 행동에 미치는 영향 강조\u003c/span>\u003cb>When (8)\u003c/b>\u003cspan>특정 조건이 충족된 상황 제시\u003c/span>\u003cb>Believing (9)\u003c/b>\u003cspan>이유를 나타내는 분사구문\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">illusory progress\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">preexisting bonus stamps\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">head start\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">16 percent finished\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">closer to the reward\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>10-slot card (Empty)\u003c/th>\u003cth>12-slot card (2 bonus)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>진전도 0%로 인식\u003c/td>\u003ctd>진전도 16%로 착각\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상대적으로 느린 카드 채우기\u003c/td>\u003ctd>더 자주 방문하여 빠르게 채움\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 구체적인 실험의 과정을 먼저 보여준 뒤에 마지막에 일반적인 결론을 내리는 미괄식 구조를 취하고 있습니다. 전형적인 예시를 통한 원리 도출 방식이죠.","hl":"ty"},{"n":9,"text":"네 번째 문장의 Yet은 겉보기엔 달라 보이지만 실제로는 identical, 즉 똑같은 프로그램이라는 점을 대조하며 강조합니다. 그리고 마지막 문장의 분사구문 Believing은 그런 믿음이 동기 부여의 원인이 되었음을 아주 잘 보여줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>partner with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 협력하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>motivating\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>동기를 부여하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>illusory\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>착각의, 환상에 불과한\u003c/span>\u003c/div>\u003cdiv>\u003cb>progress\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진전, 발전\u003c/span>\u003c/div>\u003cdiv>\u003cb>experiment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실험\u003c/span>\u003c/div>\u003cdiv>\u003cb>reward\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보상\u003c/span>\u003c/div>\u003cdiv>\u003cb>slot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>칸, 구멍\u003c/span>\u003c/div>\u003cdiv>\u003cb>preexisting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이미 존재하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>strictly speaking\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>엄밀히 말하면\u003c/span>\u003c/div>\u003cdiv>\u003cb>identical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>동일한\u003c/span>\u003c/div>\u003cdiv>\u003cb>purchase\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구매\u003c/span>\u003c/div>\u003cdiv>\u003cb>collect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모으다, 수집하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>appeal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>매력, 호소력\u003c/span>\u003c/div>\u003cdiv>\u003cb>head start\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유리한 시작, 앞선 출발\u003c/span>\u003c/div>\u003cdiv>\u003cb>fill in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 채우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>out of\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 중에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>goal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목표\u003c/span>\u003c/div>\u003cdiv>\u003cb>motivated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>동기가 부여된\u003c/span>\u003c/div>\u003cdiv>\u003cb>reach\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>finish line\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결승선\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 살펴볼까요? illusory는 착각을 일으킨다는 뜻이고, head start는 유리한 시작을 의미합니다. 그리고 strictly speaking이라는 표현은 엄밀히 말하자면이라는 뜻으로 아주 자주 쓰이니 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">motivate\u003c/b>\u003cspan class=\"m\">동기 부여하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inspire\u003c/span>\u003cspan class=\"s\">encourage\u003c/span>\u003cspan class=\"s\">stimulate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discourage\u003c/span>\u003cspan class=\"a\">deter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">identical\u003c/b>\u003cspan class=\"m\">동일한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">same\u003c/span>\u003cspan class=\"s\">equivalent\u003c/span>\u003cspan class=\"s\">matching\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">distinct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">illusory\u003c/b>\u003cspan class=\"m\">착각의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deceptive\u003c/span>\u003cspan class=\"s\">false\u003c/span>\u003cspan class=\"s\">misleading\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">real\u003c/span>\u003cspan class=\"a\">genuine\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">appeal\u003c/b>\u003cspan class=\"m\">매력\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">attraction\u003c/span>\u003cspan class=\"s\">charm\u003c/span>\u003cspan class=\"s\">allure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repulsion\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">progress\u003c/b>\u003cspan class=\"m\">진전\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">advancement\u003c/span>\u003cspan class=\"s\">improvement\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">regression\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 챙겨 봅시다. identical은 동일한이라는 뜻으로 same이나 matching과 비슷하지만 different와는 반대되는 개념입니다. 또한 motivate의 반대말인 discourage나 deter도 시험에 자주 나오니 함께 정리해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Kivetz, Urminsky, 그리고 Zheng은\u003c/span>\u003cspan class=\"en\">Kivetz, Urminsky, and Zheng\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 카페와 협력했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">partnered \u003c/span>\u003cspan class=\"tgt\">with\u003c/span> a café\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동기 부여 효과를 시험해 보기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">test\u003c/span> the motivating effect\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">착각된 진전이 주는\u003c/span>\u003cspan class=\"en\">of illusory progress\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실험에서.\u003c/span>\u003cspan class=\"en\">in an experiment.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Kivetz, Urminsky, Zheng은 착각된 진전이 주는 동기 부여 효과를 실험에서 시험해 보기 위해 한 카페와 협력했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실험의 목적과 연구진을 소개하는 도입부입니다. 실제로는 차이가 없지만 마치 진행이 더 많이 된 것 같은 \u003cb class=\"key\">착각된 \u003c/b>\u003cb class=\"key\">진전\u003c/b>이 사람들에게 어떤 \u003cb class=\"key\">동기 \u003c/b>\u003cb class=\"key\">부여\u003c/b>를 하는지 밝히는 것이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사+전치사\u003c/span> : partner [자동사] + with [전치사] + 대상 : \"~와 협력했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + test [동사원형] : \"시험해 보기 위해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Kivetz, Urminsky, and Zheng, Kivetz, Urminsky, 그리고 Zheng은. partnered with a café, 한 카페와 협력했다. to test the motivating effect, 동기 부여 효과를 시험해 보기 위해. of illusory progress, 착각된 진전이 주는. in an experiment, 실험에서.. 이 문장 전체를 해석하면, Kivetz, Urminsky, Zheng은 착각된 진전이 주는 동기 부여 효과를 실험에서 시험해 보기 위해 한 카페와 협력했다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 이 실험의 배경을 설명해요. Kivetz와 그의 동료들이 착각된 진전이라는 심리적 현상이 어떻게 동기 부여에 영향을 주는지 연구하려고 카페와 손을 잡았죠.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 partnered with입니다. 누구와 협력하다라는 뜻으로 실험 주체를 나타내고요. 두 번째 to test는 협력한 목적을 나타내는 to부정사의 부사적 용법으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고객들은 보상 카드를 받았다\u003c/span>\u003cspan class=\"en\">Customers received a reward card\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무료 커피 한 잔을 제공하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">offered\u003c/span> one free coffee\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열 잔을 산 후에.\u003c/span>\u003cspan class=\"en\">after \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">they'd \u003c/span>\u003cspan class=\"tgt\">bought\u003c/span> ten.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고객들은 열 잔을 산 후에 무료 커피 한 잔을 제공하는 보상 카드를 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실험 대상자들에게 주어진 공통 조건을 설명합니다. \u003cb class=\"key\">열 \u003c/b>\u003cb class=\"key\">잔 \u003c/b>\u003cb class=\"key\">구매 \u003c/b>\u003cb class=\"key\">시 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">잔 \u003c/b>\u003cb class=\"key\">무료\u003c/b>라는 보상 시스템의 기본 규칙을 정의합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a reward card [선행사] + that [관계사] + offered [동사] : \"제공하는 (보상 카드)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료 (had + p.p.)\u003c/span> : had + bought [과거분사] : \"그들이 샀던 (후에)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Customers received a reward card, 고객들은 보상 카드를 받았다. that offered one free coffee, 무료 커피 한 잔을 제공하는. after they'd bought ten, 열 잔을 산 후에.. 이 문장 전체를 해석하면, 고객들은 열 잔을 산 후에 무료 커피 한 잔을 제공하는 보상 카드를 받았다.","hl":"m"},{"n":16,"text":"두 번째 문장에서는 모든 고객에게 적용되는 기본 규칙을 알려줍니다. 열 잔을 사면 무료 커피 한 잔을 준다는 보상 카드에 대한 내용이죠.","hl":"mn"},{"n":17,"text":"첫 번째로 that offered를 주목하세요. reward card를 꾸며주는 주격 관계대명사 절입니다. 두 번째 they'd bought는 had bought의 줄임말로, 보상을 받기 전에 커피를 먼저 샀어야 하기에 과거완료 시제를 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고객들 중 절반은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While\u003c/span> half of the customers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카드를 받은 반면에\u003c/span>\u003cspan class=\"en\">received a card\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열 개의 빈칸이 있는\u003c/span>\u003cspan class=\"en\">with ten open slots,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나머지 절반은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">half\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카드를 받았다\u003c/span>\u003cspan class=\"en\">got a card\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열두 개의 빈칸이 있는.\u003c/span>\u003cspan class=\"en\">with twelve open slots.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고객들 중 절반은 열 개의 빈칸이 있는 카드를 받은 반면에, 나머지 절반은 열두 개의 빈칸이 있는 카드를 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실험의 핵심 변인인 \u003cb class=\"key\">카드 \u003c/b>\u003cb class=\"key\">칸수의 \u003c/b>\u003cb class=\"key\">차이\u003c/b>를 대조하여 설명합니다. 전체를 둘로 나눌 때 쓰는 \u003cb class=\"key\">While\u003c/b>과 \u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">other\u003c/b> 구문이 중요합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대조의 접속사\u003c/span> : While [접속사] + S1 + V1, S2 + V2 : \"~인 반면에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정대명사(특정 집단)\u003c/span> : the other [정해진 나머지] + half [절반] : \"나머지 절반\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"While half of the customers, 고객들 중 절반은. received a card, 카드를 받은 반면에. with ten open slots, 열 개의 빈칸이 있는. the other half, 나머지 절반은. got a card, 카드를 받았다. with twelve open slots, 열두 개의 빈칸이 있는.. 이 문장 전체를 해석하면, 고객들 중 절반은 열 개의 빈칸이 있는 카드를 받은 반면에, 나머지 절반은 열두 개의 빈칸이 있는 카드를 받았다.","hl":"m"},{"n":19,"text":"세 번째 문장에서는 실험 집단을 두 부류로 나눕니다. 한 쪽은 열 칸짜리 카드를, 다른 한 쪽은 열두 칸짜리 카드를 받았다는 점이 이 실험의 결정적인 차이입니다.","hl":"mn"},{"n":20,"text":"첫 번째 어법인 While은 여기에서 두 집단을 비교하는 대조의 접속사로 쓰였습니다. 두 번째 the other half는 전체 고객 중 한쪽 절반을 제외한 나머지 절반을 정확히 가리키는 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 열두 칸짜리의 카드에는 있었습니다 이미 찍힌 두 개의 '보너스' 도장이 그래서 엄밀히 말하면 이것들은 동일한 보상 프로그램이었습니다\u003c/span>\u003cspan class=\"en\">Yet the twelve­slot card had two preexisting &quot;bonus&quot; stamps, so, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">strictly \u003c/span>\u003cspan class=\"tgt\">speaking\u003c/span>, these were \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">identical\u003c/span> reward programs.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 열두 칸짜리의 카드에는 이미 찍힌 두 개의 ‘보너스’ 도장이 있어서, 엄밀히 말하면, 이것들은 동일한 보상 프로그램이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 12칸 카드에 도장 2개가 이미 찍혀 있어 사실상 10칸 카드와 \u003cb class=\"key\">동일한 \u003c/b>\u003cb class=\"key\">조건\u003c/b>임을 설명합니다. 이 문장은 겉모습은 다르지만 본질은 같다는 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">설계\u003c/b>의 핵심을 짚어줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비인칭 독립분사구문\u003c/span> : 부사구 [strictly speaking] : \"엄밀히 말하면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사(주격 보어)\u003c/span> : be동사 [were] + 형용사 [identical] : \"동일한\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Yet the twelve-slot card had, 하지만 열두 칸짜리의 카드에는 있었습니다. two preexisting \"bonus\" stamps, 이미 찍힌 두 개의 '보너스' 도장이. so, strictly speaking, 그래서 엄밀히 말하면. these were identical reward programs, 이것들은 동일한 보상 프로그램이었습니다. 이 문장 전체를 해석하면, 하지만 열두 칸짜리의 카드에는 이미 찍힌 두 개의 ‘보너스’ 도장이 있어서, 엄밀히 말하면, 이것들은 동일한 보상 프로그램이었다.","hl":"m"},{"n":22,"text":"도장이 찍힌 개수는 다르지만 결국 둘 다 열 번을 더 찍어야 하죠. 겉으로 보이는 조건은 다르지만 실제로는 동일한 상황이라는 점이 중요해요.","hl":"mn"},{"n":23,"text":"첫 번째로 strictly speaking은 엄밀히 말하면이라는 뜻의 독립분사구문 관용 표현이에요. 두 번째로 identical은 동일한이라는 뜻으로 문장에서 보어 역할을 하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">카드를 받은 모든 고객은\u003c/span>\u003cspan class=\"en\">Every customer \u003cspan class=\"mk\">1\u003c/ >\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">customers \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이미 목표의 16퍼센트를 끝낸 것처럼\u003c/span>\u003cspan class=\"en\">they were already 16 percent finished with the goal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시작도 하기 전에\u003c/span>\u003cspan class=\"en\">before they'd even started.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">열두 칸 중 두 칸이 이미 채워진 채로 카드가 손에 들어왔을 때, 그것은 고객들에게 시작도 하기 전에 이미 목표의 16퍼센트를 끝낸 것처럼 느껴졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실제로는 10개를 더 채워야 하는 같은 조건임에도, \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">수치\u003c/b>가 주는 \u003cb class=\"key\">착각된 \u003c/b>\u003cb class=\"key\">진전\u003c/b>이 강력한 심리적 효과를 발휘함을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">with + 목적어 + 분사 (부대상황)\u003c/span> : with + two out of twelve slots [목적어] + filled [과거분사] : \"열두 칸 중 두 칸이 채워진 채로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비인칭 주어 it과 접속사 like\u003c/span> : it [주어] + felt [동사] + like [접속사] + S + V : \"고객들에게 ~인 것처럼 느껴졌다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"When the card came, 카드가 손에 들어왔을 때. with two out of twelve slots already filled, 열두 칸 중 두 칸이 이미 채워진 채로. it felt to customers like, 그것은 고객들에게 ~처럼 느껴졌다. they were already 16 percent finished with the goal, 이미 목표의 16퍼센트를 끝낸 것처럼. before they'd even started, 시작도 하기 전에. 이 문장 전체를 해석하면, 열두 칸 중 두 칸이 이미 채워진 채로 카드가 손에 들어왔을 때, 그것은 고객들에게 시작도 하기 전에 이미 목표의 16퍼센트를 끝낸 것처럼 느껴졌다.","hl":"m"},{"n":34,"text":"공짜 도장 두 개가 찍혀 있으면, 사람들은 시작도 하기 전에 벌써 16퍼센트나 해냈다는 기분을 느껴요. 이런 수치상의 착각이 사람들의 마음을 움직이는 포인트죠.","hl":"mn"},{"n":35,"text":"첫 번째로 with 다음에 목적어가 나오고 filled라는 과거분사가 온 것은 칸이 채워진 상태를 나타내는 부대상황 표현이에요. 두 번째로 it felt like 구문은 주어 자리에 it을 써서 어떤 기분이 드는 상황임을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿었기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Believing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들이 보상에 더 가까워졌다고\u003c/span>\u003cspan class=\"en\">they were closer to the reward,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 더 큰 동기를 부여받았다\u003c/span>\u003cspan class=\"en\">they were \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">motivated\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결승선에 도달하는 데\u003c/span>\u003cspan class=\"en\">to reach the finish line.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자신들이 보상에 더 가까워졌다고 믿었기 때문에, 그들은 결승선에 도달하는 데 더 큰 동기를 부여받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 보상에 가까워졌다는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">거리감\u003c/b>이 과업을 완수하려는 \u003cb class=\"key\">동기 \u003c/b>\u003cb class=\"key\">부여\u003c/b>의 핵심 원동력이 됨을 결론지으며 요약하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (이유)\u003c/span> : Believing [현재분사] ~, S + V : \"믿었기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (감정/상태)\u003c/span> : be [동사] + motivated [과거분사] : \"더 동기 부여된\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Believing, 믿었기 때문에. they were closer to the reward, 자신들이 보상에 더 가까워졌다고. they were more motivated, 그들은 더 큰 동기를 부여받았다. to reach the finish line, 결승선에 도달하는 데. 이 문장 전체를 해석하면, 자신들이 보상에 더 가까워졌다고 믿었기 때문에, 그들은 결승선에 도달하는 데 더 큰 동기를 부여받았다.","hl":"m"},{"n":37,"text":"목표에 다 왔다는 믿음이 생기면 끝까지 해내고 싶은 마음이 더 커지기 마련이죠. 보상과의 거리가 가깝다고 느끼는 게 동기 부여에 정말 중요해요.","hl":"mn"},{"n":38,"text":"첫 번째로 문장 맨 앞의 Believing은 이유를 나타내는 분사구문이에요. 두 번째로 motivated는 감정이나 상태를 나타낼 때 쓰는 과거분사 형태라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">문제 해설\u003c/span>\u003cdiv class=\"lp-box\">\u003cspan class=\"lp-big\">요지 파악\u003c/span>\u003cspan class=\"lp-pill\">정답 보상에 더 가까워졌다는 심리적 착각이 목표 달성 의지를 강화한다.\u003c/span>\u003cdiv style=\"margin-top:8px\">실험 결과, 10잔을 사야 하는 조건은 같았지만 보너스 도장으로 인해 \u003cb class=\"key\">진전\u003c/b>이 있었다고 믿은 그룹이 더 빠르게 카드를 채웠습니다. 이는 보상에 \u003cb class=\"key\">가까워졌다는 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>이 동기를 높여준다는 \u003cb class=\"key\">주제문\u003c/b>인 아홉 번째 문장과 일치합니다.\u003c/div>\u003cul style=\"font-size:14.5px;margin:8px 0 0;padding-left:20px\">\u003cli>무료 도장의 개수가 많을수록 고객의 충성도가 높아진다는 내용은 지엽적입니다.\u003c/li>\u003cli>카페의 커피 맛이 고객 방문 빈도에 미치는 영향은 언급되지 않았습니다.\u003c/li>\u003cli>보상 프로그램의 공정성이 고객 만족에 미치는 영향은 본문의 핵심이 아닙니다.\u003c/li>\u003c/ul>\u003c/div>","segs":[{"n":39,"text":"문제 풀이를 해보겠습니다. 이 글의 요지는 무엇일까요? 결국 실험의 결과인 마지막 문장에 정답이 있습니다. 보상에 더 가까워졌다고 믿게 만드는 착각이 목표 달성 의지를 높인다는 내용이 정답이 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>카페에서 \u003cb class=\"key\">착각된 \u003c/b>\u003cb class=\"key\">진전\u003c/b>이 동기 부여에 미치는 영향을 실험한 결과, 사람들은 시작 시점의 심리적 상태에 영향을 받았다.\u003c/li>\u003cli>실질적으로는 10잔을 사야 하는 \u003cb class=\"key\">동일한 \u003c/b>\u003cb class=\"key\">조건\u003c/b>이었으나, 12칸 중 2칸을 채워준 카드가 더 큰 매력을 발휘했다.\u003c/li>\u003cli>자신이 목표의 \u003cb class=\"key\">16퍼센트\u003c/b>를 이미 달성했다고 믿은 사람들은 더 자주 카페를 방문하여 카드를 빨리 채웠다.\u003c/li>\u003cli>결국 보상에 더 \u003cb class=\"key\">가까워졌다고 \u003c/b>\u003cb class=\"key\">느끼는\u003c/b> 심리가 목표 달성을 위한 강력한 원동력이 됨을 시사한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Creating a sense of artificial progress toward a goal significantly enhances people's motivation to complete it.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">실제 조건은 동일하더라도, 보너스 도장을 통해 목표에 이미 근접했다는 \u003cb class=\"key\">착각된 \u003c/b>\u003cb class=\"key\">진전\u003c/b>을 느끼게 하면 사람들은 더 \u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">동기\u003c/b>를 얻어 목표를 빠르게 달성한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"오늘 배운 지문은 마케팅뿐만 아니라 우리의 학습에도 적용할 수 있어요. 공부를 시작할 때 '아직 할 게 너무 많아'라고 생각하기보다 '이미 이만큼 해냈어'라고 스스로를 격려해 보세요. 그러면 동기 부여가 훨씬 더 잘 될 거예요. 오늘 수업 여기서 마칠게요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
