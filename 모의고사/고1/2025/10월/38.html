</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 38번","audioDir":"38_audio","preview":false,"count":38,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">38번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>Fixed Instinct vs. Dynamic Culture: Human and Insect Sociality\u003c/h1>\u003ch2>고정된 본능 대 역동적 문화: 인간과 곤충의 사회성\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>곤충은 유전적으로 고정된 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">본능\u003c/b>에 따라 행동하지만, 인간은 \u003cb class=\"key\">양육과 \u003c/b>\u003cb class=\"key\">문화\u003c/b>를 통해 훨씬 더 자유롭고 역동적인 사회적 패턴을 형성합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>While insect sociality is genetically and pheromonally programmed, human social patterns are more diverse and dynamic, shaped primarily by nurture.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 인간과 곤충의 사회성이 어떻게 다른지에 대해 흥미로운 지문을 공부해 볼 거예요. 이 글은 인간이 가장 사회적인 존재라는 통념을 깨면서 시작합니다. 인간의 사회적 패턴이 곤충과 달리 왜 더 다양하고 역동적인지를 밝히는 것이 오늘의 핵심 요지입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">생물학적 관점에서 사회적 행동은 \u003cb class=\"key\">본성(Nature)\u003c/b>과 \u003cb class=\"key\">양육(Nurture)\u003c/b>의 상호작용으로 설명됩니다. 곤충의 사회성은 철저히 \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">프로그래밍(Genetical \u003c/b>\u003cb class=\"key\">Programming)\u003c/b>과 화학 신호인 페로몬에 의존하여 수만 년 동안 변하지 않는 패턴을 유지합니다. 이는 악보에 적힌 대로만 연주해야 하는 \u003cb class=\"key\">오케스트라\u003c/b>와 같습니다. 반면 인간은 같은 종이라도 문화에 따라 다른 행동 양식을 보이는데, 이는 고정된 본능보다 환경적 학습인 \u003cb class=\"key\">양육\u003c/b>의 영향이 크기 때문입니다. 인간의 사회성은 마치 연주자들의 합에 따라 매번 달라지는 \u003cb class=\"key\">재즈 \u003c/b>\u003cb class=\"key\">합주\u003c/b>처럼 자유롭고 창의적인 특성을 가집니다.\u003c/div>","segs":[{"n":2,"text":"우리가 흔히 본성과 양육이라는 말을 쓰죠. 곤충의 행동은 태어날 때부터 정해진 유전적 프로그래밍 즉 본성에 따릅니다. 페로몬이라는 화학 물질에 반응하며 정해진 규칙대로만 움직이는 거예요. 하지만 우리 인간은 문화적 학습인 양육을 통해 세대마다 다른 사회적 규칙을 만들어 냅니다. 마치 정해진 악보대로 연주하는 오케스트라와 즉흥 연주가 가능한 재즈 밴드의 차이로 이해하면 쉽습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>사회성의 지표\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>인간이 가장 사회적인 동물은 아니며, 개미나 벌 같은 곤충이 \u003cb class=\"key\">사회성 \u003c/b>\u003cb class=\"key\">지표\u003c/b> 면에서 인간을 앞서기도 한다는 점을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>곤충의 사회적 특징\u003csmall>근거 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>곤충은 조화롭게 협동하지만, 그들의 행동은 \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">프로그래밍\u003c/b>과 페로몬에 의해 고정되어 있어 예측 가능하고 반복적입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>인간의 차별점과 결론\u003csmall>주장 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>인간은 유전적 제약에서 비교적 자유로워 \u003cb class=\"key\">다양하고 \u003c/b>\u003cb class=\"key\">역동적인\u003c/b> 패턴을 만들며, 이는 본성보다 \u003cb class=\"key\">양육\u003c/b>에 의해 형성됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 곤충의 뛰어난 사회성을 먼저 인정하고, 그 한계를 짚어낸 뒤 인간만의 독특한 사회성을 강조하는 순서로 전개됩니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 인간보다 사회성이 뛰어난 개미와 벌 같은 곤충들을 언급하며 사회성 지표라는 개념을 소개합니다. 곤충들이 사회성 기준에서 인류를 압도한다는 흥미로운 사실로 글을 시작하죠.","hl":"f0"},{"n":5,"text":"세 번째부터 여섯 번째 문장까지는 곤충들의 조화로운 행동 뒤에 숨겨진 원리를 설명합니다. 이들의 행동은 유전적 프로그래밍과 페로몬에 의해 통제되기 때문에 항상 고정된 패턴이 예측 가능하게 반복됩니다.","hl":"f1"},{"n":6,"text":"일곱 번째부터 마지막 아홉 번째 문장에서는 드디어 인간의 이야기가 나옵니다. 인간은 유전적 제약에서 더 자유로워 다양하고 역동적인 사회적 패턴을 보이며, 이것이 본성보다 양육에 의해 형성된다는 결론을 내립니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">곤충의 사회성과 인간의 사회성을 \u003cb class=\"key\">대조\u003c/b>하여 설명하는 구조입니다. 초반에는 곤충의 \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">고정성\u003c/b>을 설명하고, 네 번째 문장의 전환점을 거쳐 일곱 번째 문장부터 인간의 \u003cb class=\"key\">자유로운 \u003c/b>\u003cb class=\"key\">역동성\u003c/b>을 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But while (4)\u003c/b>\u003cspan>대조를 통한 화제 전환\u003c/span>\u003cb>because (6)\u003c/b>\u003cspan>곤충 행동의 원인 제시\u003c/span>\u003cb>so (7)\u003c/b>\u003cspan>인간의 특성에 따른 결과 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">social animal\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sociality\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">social places\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">social life\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">social patterns\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Insects (Bees, Ants, Termites)\u003c/th>\u003cth>Humans\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Genetically programmed\u003c/td>\u003ctd>Less tightly programmed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Predictably recur\u003c/td>\u003ctd>Diverse and dynamic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Propelled pheromonally\u003c/td>\u003ctd>Shaped by nurture\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 곤충과 인간을 대조하는 전개 방식을 취하고 있습니다. 글의 중심 내용이 중간인 일곱 번째 문장에 명확히 드러나는 중괄식 구조라고 볼 수 있어요.","hl":"ty"},{"n":8,"text":"네 번째 문장의 But while은 곤충에서 인간으로 화제를 돌리는 중요한 신호어입니다. 여섯 번째 문장의 because는 곤충 행동의 원인을, 일곱 번째 문장의 so는 인간 행동의 결과를 인과 관계로 연결해 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>social\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사회적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>termite\u003c/b>\u003cem>명사\u003c/em>\u003cspan>흰개미\u003c/span>\u003c/div>\u003cdiv>\u003cb>put to shame\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 부끄럽게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>metric\u003c/b>\u003cem>명사\u003c/em>\u003cspan>측정 기준\u003c/span>\u003c/div>\u003cdiv>\u003cb>sociality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회성\u003c/span>\u003c/div>\u003cdiv>\u003cb>variety\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다양성\u003c/span>\u003c/div>\u003cdiv>\u003cb>relative\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동족, 친척\u003c/span>\u003c/div>\u003cdiv>\u003cb>harmonious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>조화로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>collectively\u003c/b>\u003cem>부사\u003c/em>\u003cspan>집단으로, 공동으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>colony\u003c/b>\u003cem>명사\u003c/em>\u003cspan>군집\u003c/span>\u003c/div>\u003cdiv>\u003cb>impressively\u003c/b>\u003cem>부사\u003c/em>\u003cspan>인상적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>hexagonal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>육각형의\u003c/span>\u003c/div>\u003cdiv>\u003cb>hive\u003c/b>\u003cem>명사\u003c/em>\u003cspan>벌집\u003c/span>\u003c/div>\u003cdiv>\u003cb>march\u003c/b>\u003cem>동사\u003c/em>\u003cspan>행진하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>formation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대형\u003c/span>\u003c/div>\u003cdiv>\u003cb>recur\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반복되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>predictably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>예측할 수 있게\u003c/span>\u003c/div>\u003cdiv>\u003cb>tightly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>긴밀하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>programmed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>프로그램된\u003c/span>\u003c/div>\u003cdiv>\u003cb>genetically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>유전적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>propelled\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>추진되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>pheromonally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>페로몬에 의해\u003c/span>\u003c/div>\u003cdiv>\u003cb>diverse\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>dynamic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>역동적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>choreography\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안무\u003c/span>\u003c/div>\u003cdiv>\u003cb>generation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세대\u003c/span>\u003c/div>\u003cdiv>\u003cb>in harmony with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 조화를 이루는\u003c/span>\u003c/div>\u003cdiv>\u003cb>nurture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양육\u003c/span>\u003c/div>\u003cdiv>\u003cb>nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>본성, 본능\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"여기서 metrics라는 단어는 측정 기준이라는 뜻으로 쓰였고, nurture는 선천적인 본성을 뜻하는 nature와 대비되는 양육 혹은 후천적 환경이라는 아주 중요한 단어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">sociality\u003c/b>\u003cspan class=\"m\">사회성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sociability\u003c/span>\u003cspan class=\"s\">gregariousness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">isolation\u003c/span>\u003cspan class=\"a\">asociality\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">harmonious\u003c/b>\u003cspan class=\"m\">조화로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">peaceful\u003c/span>\u003cspan class=\"s\">concordant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discordant\u003c/span>\u003cspan class=\"a\">hostile\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">recur\u003c/b>\u003cspan class=\"m\">반복되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">repeat\u003c/span>\u003cspan class=\"s\">reappear\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dynamic\u003c/b>\u003cspan class=\"m\">역동적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">active\u003c/span>\u003cspan class=\"s\">energetic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">static\u003c/span>\u003cspan class=\"a\">passive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">nurture\u003c/b>\u003cspan class=\"m\">양육\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">upbringing\u003c/span>\u003cspan class=\"s\">training\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nature\u003c/span>\u003cspan class=\"a\">instinct\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"sociality는 사회성이라는 뜻으로 sociability와 비슷하게 쓰입니다. harmonious는 조화로운이라는 의미로 concordant와 같은 단어로 바꿔 쓸 수 있고, 반대말은 hostile 즉 적대적인이 있습니다. dynamic은 역동적인이라는 뜻인데 반대말인 static 즉 정적인이라는 단어도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간이 아니다\u003c/span>\u003cspan class=\"en\">Humans are not\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 사회적인 동물은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">social\u003c/span> animal.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인간이 ‘가장’ 사회적인 동물은 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간이 지구상에서 가장 사회성이 발달한 존재라는 일반적인 \u003cb class=\"key\">통념\u003c/b>을 깨뜨리며 글을 시작합니다. 이어질 내용에서 인간보다 더 철저한 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">구조\u003c/b>를 가진 곤충들과의 비교를 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 최상급\u003c/span> : the + most + [3음절 이상의 형용사] : \"가장 사회적인\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Humans are not, 인간이 아니다. the most social animal, 가장 사회적인 동물은. 이 문장 전체를 해석하면, 인간이 ‘가장’ 사회적인 동물은 아니다.","hl":"m"},{"n":12,"text":"인간이 세상에서 가장 사회적인 존재일 거라는 생각은 착각이라는 말로 글을 시작하고 있어요. 우리보다 더 지독하게 사회적인 존재들이 있다는 사실을 예고하는 도입부 문장입니다.","hl":"mn"},{"n":13,"text":"첫 번째 문법 포인트는 최상급 표현입니다. social처럼 긴 단어는 앞에 the most를 붙여서 가장 무엇무엇하다는 의미를 만들죠. 여기서는 가장 사회적인이라는 뜻으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미, 벌, 그리고 흰개미는\u003c/span>\u003cspan class=\"en\">Ants, bees, and termites\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인류를 부끄럽게 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">humanity \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">shame\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사회성 측정 기준에서\u003c/span>\u003cspan class=\"en\">on many metrics of sociality.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">개미, 벌, 그리고 흰개미는 많은 사회성 측정 기준에서 인류를 부끄럽게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사회성의 기준을 따져봤을 때, 곤충들이 인간보다 훨씬 더 \u003cb class=\"key\">조직적\u003c/b>임을 강조합니다. \u003cb class=\"key\">put \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">shame\u003c/b>이라는 강한 표현을 써서 곤충의 사회적 정교함이 인간을 능가함을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(put A to shame)\u003c/span> : put + [대상 A] + to shame : \"인류를 부끄럽게 하다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"Ants, bees, and termites, 개미, 벌, 그리고 흰개미는. put humanity to shame, 인류를 부끄럽게 한다. on many metrics of sociality, 많은 사회성 측정 기준에서. 이 문장 전체를 해석하면, 개미, 벌, 그리고 흰개미는 많은 사회성 측정 기준에서 인류를 부끄럽게 한다.","hl":"m"},{"n":15,"text":"개미나 벌 같은 곤충들이 사회성이라는 잣대로 보면 인간보다 훨씬 뛰어나서 인간이 무색해질 정도라는 뜻이에요. 곤충들의 완벽한 사회 시스템을 치켜세우는 표현입니다.","hl":"mn"},{"n":16,"text":"첫 번째로 put humanity to shame이라는 표현에 주목하세요. 에이(A)를 부끄럽게 만들다라는 뜻으로 인류보다 곤충이 더 낫다는 점을 강조하는 관용구입니다. 두 번째로 전치사 on은 기준을 나타낼 때 사용되어 여러 측정 기준에서라는 의미를 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 다양한 동족들이\u003c/span>\u003cspan class=\"en\">A wide variety of relatives\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께 산다\u003c/span>\u003cspan class=\"en\">live together\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완벽하게 조화로운 행동으로\u003c/span>\u003cspan class=\"en\">with perfectly harmonious behavior\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 집단으로 그들의 어린 새끼들을 돌본다\u003c/span>\u003cspan class=\"en\">and collectively \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">for\u003c/span> their young.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">매우 다양한 동족들이 완벽하게 조화로운 행동으로 함께 살고 집단으로 그들의 어린 새끼들을 돌본다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 곤충들이 보여주는 \u003cb class=\"key\">공동체 \u003c/b>\u003cb class=\"key\">생활\u003c/b>의 구체적인 예시입니다. 개별적인 이익보다 \u003cb class=\"key\">집단의 \u003c/b>\u003cb class=\"key\">생존\u003c/b>과 조화를 우선시하는 그들의 본능적인 사회성을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어동사(구동사)\u003c/span> : care + for + [목적어] : \"~을 돌보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : 주어 + [동사1] + ... + and + [동사2] : \"함께 살고 ... 그리고 집단으로 돌본다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"A wide variety of relatives, 매우 다양한 동족들이. live together, 함께 산다. with perfectly harmonious behavior, 완벽하게 조화로운 행동으로. and collectively care for their young, 그리고 집단으로 그들의 어린 새끼들을 돌본다. 이 문장 전체를 해석하면, 매우 다양한 동족들이 완벽하게 조화로운 행동으로 함께 살고 집단으로 그들의 어린 새끼들을 돌본다.","hl":"m"},{"n":18,"text":"수많은 곤충 가족들이 서로 싸우지 않고 완벽하게 발을 맞추어 살면서 새끼도 다 같이 키운다는 내용이에요. 인간 사회보다 더 철저한 협동의 모습을 묘사하고 있죠.","hl":"mn"},{"n":19,"text":"첫 번째 문법 포인트는 동사 병렬 구조입니다. live라는 첫 번째 동사와 care for라는 두 번째 동사가 and로 연결되어 하나의 주어에 걸려 있어요. 두 번째로 care for는 무엇을 돌보다라는 뜻의 덩어리 표현이니 꼭 함께 외워두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 ~인 반면\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">while\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곤충 군집들이 ~인\u003c/span>\u003cspan class=\"en\">insect colonies are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인상적으로 사회적인 장소들인\u003c/span>\u003cspan class=\"en\">impressively social places,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ~이 아니다\u003c/span>\u003cspan class=\"en\">it's not\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 종류의 사회생활\u003c/span>\u003cspan class=\"en\">our kind of social life.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 곤충 군집들이 인상적으로 사회적인 장소인 반면, 그것은 ‘우리의’ 사회생활의 종류가 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 곤충들도 사회적인 특성이 강하지만 인간의 사회성과는 \u003cb class=\"key\">본질적\u003c/b>으로 다르다는 것을 강조하며 글의 \u003cb class=\"key\">흐름\u003c/b>을 전환하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 while (~인 반면)\u003c/span> : while [주어] + [동사], [주절] : \"~인 반면\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"But while, 하지만 ~인 반면. insect colonies are, 곤충 군집들이 ~인. impressively social places, 인상적으로 사회적인 장소들인. it's not, 그것은 ~이 아니다. our kind of social life, 우리의 종류의 사회생활. 이 문장 전체를 해석하면, 그러나 곤충 군집들이 인상적으로 사회적인 장소인 반면, 그것은 ‘우리의’ 사회생활의 종류가 아니다.","hl":"m"},{"n":21,"text":"곤충들의 집단도 아주 사회적이지만, 우리 인간이 영위하는 사회생활과는 확실히 다르다는 점을 보여주는 문장이에요. 이제부터 인간과 곤충의 차이점이 본격적으로 나오기 시작하죠.","hl":"mn"},{"n":22,"text":"첫 번째로 while은 반면이라는 뜻의 접속사로 쓰였어요. 곤충의 사회성을 인정하면서도 우리와는 대조된다는 점을 분명히 하죠. 두 번째로 it's not은 앞서 말한 곤충의 사회적 모습이 우리 인간의 종류는 아니라는 점을 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벌들은 항상 짓는다\u003c/span>\u003cspan class=\"en\">Bees always build\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">육각형의 벌집들을\u003c/span>\u003cspan class=\"en\">hexagonal hives,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미들은 줄지어 행진하며\u003c/span>\u003cspan class=\"en\">ants march in lines,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 흰개미들은 움직인다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> termites move\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지그재그 대형으로\u003c/span>\u003cspan class=\"en\">in zigzag formations.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">벌들은 항상 육각형의 벌집을 짓고, 개미들은 줄지어 행진하며, 흰개미들은 지그재그 대형으로 움직인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 곤충들이 따르는 \u003cb class=\"key\">고정된\u003c/b> 행동 패턴들을 나열하여, 그들의 사회적 행동이 \u003cb class=\"key\">천편일률적\u003c/b>임을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사의 병렬 구조\u003c/span> : [A], [B], and [C] : \"그리고\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Bees always build, 벌들은 항상 짓는다. hexagonal hives, 육각형의 벌집들을. ants march in lines, 개미들은 줄지어 행진하며. and termites move, 그리고 흰개미들은 움직인다. in zigzag formations, 지그재그 대형으로. 이 문장 전체를 해석하면, 벌들은 항상 육각형의 벌집을 짓고, 개미들은 줄지어 행진하며, 흰개미들은 지그재그 대형으로 움직인다.","hl":"m"},{"n":24,"text":"벌과 개미 그리고 흰개미가 어떻게 행동하는지 구체적인 예시를 들어주고 있어요. 이들은 모두 정해진 규칙대로만 행동한다는 것이 핵심이죠.","hl":"mn"},{"n":25,"text":"세 가지 문장이 콤마와 and를 통해 나열되고 있어요. 주어와 동사 목적어 혹은 부사구가 반복되는 구조를 통해 곤충들의 정형화된 행동을 리듬감 있게 표현했답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 패턴들은 예측 가능하게 반복된다\u003c/span>\u003cspan class=\"en\">These patterns recur predictably\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그것들이 ~이기 때문에\u003c/span>\u003cspan class=\"en\">because they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유전적으로 긴밀하게 프로그램되어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">tightly \u003c/span>\u003cspan class=\"tgt\">programmed \u003c/span>\u003cspan class=\"tgt\">genetically \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 페로몬에 의해 추진되기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">propelled \u003c/span>\u003cspan class=\"tgt\">pheromonally\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 패턴들은 그것들이 유전적으로 긴밀하게 프로그램되어 있으며 페로몬에 의해 추진되기 때문에 예측할 수 있게 반복된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 곤충의 행동이 변하지 않는 근본적인 이유가 \u003cb class=\"key\">유전\u003c/b>과 \u003cb class=\"key\">화학적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>에 의한 것임을 명시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태의 병렬 구조\u003c/span> : [be동사] + [과거분사1] and [과거분사2] : \"유전적으로 프로그램되고 페로몬에 의해 추진된다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"These patterns recur predictably, 이러한 패턴들은 예측 가능하게 반복된다. because they are, 왜냐하면 그것들이 ~이기 때문에. tightly programmed genetically, 유전적으로 긴밀하게 프로그램되어. and propelled pheromonally, 그리고 페로몬에 의해 추진되기. 이 문장 전체를 해석하면, 이러한 패턴들은 그것들이 유전적으로 긴밀하게 프로그램되어 있으며 페로몬에 의해 추진되기 때문에 예측할 수 있게 반복된다.","hl":"m"},{"n":27,"text":"앞서 말한 곤충들의 행동이 왜 매번 똑같은지 이유를 설명하는 아주 중요한 문장이에요. 유전자에 기록되어 있고 페로몬이라는 화학 물질에 의해 등 떠밀리듯 일어나는 일이라는 거죠.","hl":"mn"},{"n":28,"text":"첫 번째로 are 뒤에 programmed와 propelled가 and로 연결된 수동태 병렬 구조를 잘 보세요. 곤충의 행동이 본인들의 의지가 아니라는 점을 강조합니다. 두 번째로 genetically와 pheromonally처럼 부사들이 과거분사를 꾸며주고 있다는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 인간은\u003c/span>\u003cspan class=\"en\">We humans are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 자유롭고,\u003c/span>\u003cspan class=\"en\">more free,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유전적으로 덜 긴밀하게 프로그램되어 있어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">tightly \u003c/span>\u003cspan class=\"tgt\">programmed\u003c/span> genetically,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 사회적 패턴들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so\u003c/span> our social patterns\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 다양하고 역동적일 수 있다.\u003c/span>\u003cspan class=\"en\">can be more diverse and dynamic.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 인간은 더 자유롭고, 유전적으로 덜 긴밀하게 프로그램되어 있어서 우리의 사회적 패턴들은 더 다양하고 역동적일 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본능에 따라 움직이는 곤충과 달리 인간은 \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">제약\u003c/b>에서 상대적으로 자유롭습니다. 그 덕분에 인간의 사회적 관계는 고정되지 않고 \u003cb class=\"key\">다양성\u003c/b>과 변화하는 \u003cb class=\"key\">역동성\u003c/b>을 갖게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : [부사] + [부사] + [과거분사(programmed)] : \"덜 긴밀하게 프로그램된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 (결과)\u003c/span> : [원인 문장] + , so + [결과 문장] : \"그래서\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"We humans are, 우리 인간은. more free, 더 자유롭고. less tightly programmed genetically, 유전적으로 덜 긴밀하게 프로그램되어 있어서. so our social patterns, 우리의 사회적 패턴들은. can be more diverse and dynamic, 더 다양하고 역동적일 수 있다.. 이 문장 전체를 해석하면, 우리 인간은 더 자유롭고, 유전적으로 덜 긴밀하게 프로그램되어 있어서 우리의 사회적 패턴들은 더 다양하고 역동적일 수 있다.","hl":"m"},{"n":30,"text":"앞선 문장의 곤충들과 인간을 대조하는 문장이에요. 인간은 본능이라는 유전적 제약에서 벗어나 있기 때문에 사회적 모습이 아주 다양하게 나타날 수 있다는 점을 강조하고 있죠.","hl":"mn"},{"n":31,"text":"두 가지 포인트를 볼게요. 첫 번째로 less tightly programmed는 인간이 유전자에 의해 설계된 상태임을 나타내기 위해 과거분사 programmed를 사용했어요. 두 번째로 접속사 so는 앞의 유전적 자유가 원인이 되어 결과적으로 다양성이 생긴다는 인과관계를 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 집단은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Every \u003c/span>\u003cspan class=\"tgt\">group \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약간 다른 춤을 추는데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">dances \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">slightly \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">dance\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 안무들은\u003c/span>\u003cspan class=\"en\">and these choreographies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세대에 걸쳐 변한다.\u003c/span>\u003cspan class=\"en\">change across generations.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 집단은 약간 다른 춤을 추는데 이러한 안무들은 세대에 걸쳐 변한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여기서 '춤'과 '안무'는 인간의 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 비유한 표현입니다. 인간의 문화적 행동은 집단마다 다르고 시간이 흐르며 \u003cb class=\"key\">세대 \u003c/b>\u003cb class=\"key\">간 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 겪는다는 특징을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Every + 단수 명사/동사\u003c/span> : Every + [단수 명사(group)] + [단수 동사(dances)] : \"모든 집단은 춤을 춘다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동종 목적어 구문\u003c/span> : [동사(dance)] + [동사어원과 같은 명사 목적어(dance)] : \"춤을 추다\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Every group, 모든 집단은. dances a slightly different dance, 약간 다른 춤을 추는데. and these choreographies, 이러한 안무들은. change across generations, 세대에 걸쳐 변한다.. 이 문장 전체를 해석하면, 모든 집단은 약간 다른 춤을 추는데 이러한 안무들은 세대에 걸쳐 변한다.","hl":"m"},{"n":33,"text":"인간의 사회적 행동을 춤과 안무에 비유했어요. 집단마다 문화가 다르고 그 문화가 시간이 지나면서 계속 바뀐다는 것을 아주 문학적으로 표현했네요.","hl":"mn"},{"n":34,"text":"첫 번째로 Every group dances 부분을 보세요. Every 뒤에는 반드시 단수 명사가 오고 동사에도 s를 붙여 단수 취급한다는 게 시험 단골 문제입니다. 두 번째로 dances a dance처럼 동사와 똑같이 생긴 명사를 목적어로 써서 동작을 풍부하게 설명하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 여전히 생각하고 행동하지만\u003c/span>\u003cspan class=\"en\">We still think and act\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조화를 이루는 방식으로\u003c/span>\u003cspan class=\"en\">in \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ways \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> in harmony\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 주변의 다른 사람들과\u003c/span>\u003cspan class=\"en\">with others around us,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 패턴들을 통해서이다\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">patterns \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">양육에 의해 더 많이 형성되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> are more \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">shaped \u003c/span>\u003cspan class=\"tgt\">by\u003c/span> nurture,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 본성만이 아니라.\u003c/span>\u003cspan class=\"en\">not just nature.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 여전히 우리 주변의 다른 사람들과 조화를 이루는 방식으로 생각하고 행동하지만, 그것은 단지 본성만이 아니라 양육에 의해 더 많이 형성되는 패턴들을 통해서이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간의 사회성 또한 타인과의 조화를 추구하지만, 그 근원은 타고난 본능인 \u003cb class=\"key\">nature(본성)\u003c/b>보다 후천적인 학습과 환경인 \u003cb class=\"key\">nurture(양육)\u003c/b>에 더 큰 영향을 받는다는 결론입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : [선행사(ways)] + [that(주격 관계대명사)] + [동사(are)] : \"~인 방식들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">It is ~ that 강조구문\u003c/span> : It is + [강조어구(through patterns)] + that + [나머지 문장] : \"바로 패턴들을 통해서이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 수식\u003c/span> : [명사(patterns)] + [that are shaped (수동태/관계사절)] : \"~에 의해 형성되는\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"We still think and act, 우리는 여전히 생각하고 행동하지만. in ways that are in harmony, 조화를 이루는 방식으로. with others around us, 우리 주변의 다른 사람들과. but it is through patterns, 그것은 패턴들을 통해서이다. that are more shaped by nurture, 양육에 의해 더 많이 형성되는. not just nature, 단지 본성만이 아니라.. 이 문장 전체를 해석하면, 우리는 여전히 우리 주변의 다른 사람들과 조화를 이루는 방식으로 생각하고 행동하지만, 그것은 단지 본성만이 아니라 양육에 의해 더 많이 형성되는 패턴들을 통해서이다.","hl":"m"},{"n":36,"text":"마지막 문장은 이 글의 핵심이에요. 인간도 다른 동물처럼 집단생활을 하지만 그 방식은 타고난 본성인 nature보다 후천적으로 배우는 nurture의 영향을 훨씬 더 많이 받는다는 내용입니다.","hl":"mn"},{"n":37,"text":"중요한 게 많아요. 첫 번째로 ways를 꾸며주는 주격 관계대명사 that이 쓰였고요. 두 번째로 이 문장의 핵심인 It is through patterns that 구문은 강조하고 싶은 말을 It is와 that 사이에 넣은 강조구문입니다. 세 번째로 양육에 의해 형성되는 패턴이라는 뜻을 전하기 위해 수동의 의미인 shaped를 썼다는 점도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>인간은 가장 사회적인 동물이 아니며, 개미나 벌 같은 곤충들이 다양한 \u003cb class=\"key\">사회성 \u003c/b>\u003cb class=\"key\">지표\u003c/b>에서 인간을 압도합니다.\u003c/li>\u003cli>곤충 군집의 행동은 유전적으로 고정되고 페로몬에 의해 유도되므로 매우 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능한 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>을 보입니다.\u003c/li>\u003cli>인간은 곤충보다 유전적 프로그래밍에서 자유롭기 때문에 사회적 패턴이 훨씬 더 \u003cb class=\"key\">다양하고 \u003c/b>\u003cb class=\"key\">역동적\u003c/b>입니다.\u003c/li>\u003cli>인간의 사회적 행동은 선천적인 본성보다는 환경적 요인인 \u003cb class=\"key\">양육\u003c/b>에 의해 더 많은 영향을 받아 형성됩니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>While insect sociality is genetically and pheromonally programmed, human social patterns are more diverse and dynamic, shaped primarily by nurture.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">곤충은 유전적으로 고정된 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">본능\u003c/b>에 따라 행동하지만, 인간은 \u003cb class=\"key\">양육과 \u003c/b>\u003cb class=\"key\">문화\u003c/b>를 통해 훨씬 더 자유롭고 역동적인 사회적 패턴을 형성합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":38,"text":"결국 인간의 사회성이 특별한 이유는 고정된 본능에 갇혀 있지 않고 양육을 통해 변화할 수 있기 때문입니다. 여러분도 오늘 배운 diverse와 dynamic이라는 단어를 꼭 기억하면서 복습해 보세요. 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
