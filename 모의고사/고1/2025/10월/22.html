@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 22번","audioDir":"22_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">22번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>The Necessity of Ocean Literacy: Understanding Before Action\u003c/h1>\u003ch2>해양 소양의 필요성: 조치 이전에 선행되어야 할 이해\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>해양 환경 변화에 적절히 대응하기 위해서는 \u003cb class=\"key\">기초적인 \u003c/b>\u003cb class=\"key\">작동 \u003c/b>\u003cb class=\"key\">원리\u003c/b>와 \u003cb class=\"key\">맥락\u003c/b>에 대한 이해가 반드시 선행되어야 합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>To effectively discuss and address marine issues, it is essential to first understand the fundamental mechanisms and context of the ocean ecosystem.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 해양 환경 문제를 다룰 때 왜 단순한 관심 이상의 공부가 필요한지 설명하는 지문을 배워볼 거예요. 이 글은 해양 보존을 위해 가장 먼저 해결해야 할 장애물이 무엇인지 짚어주고 있죠. 요지는 명확합니다. 해양이 어떻게 작동하는지 그 원리를 알아야 제대로 된 해결책도 논의할 수 있다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 흔히 '아는 만큼 보인다'라고 하듯, 환경 보호도 해당 시스템의 \u003cb class=\"key\">메커니즘\u003c/b>(mechanism)을 모르면 구호에 그칠 수 있습니다. 해양 생태계에 대한 지식 수준을 의미하는 \u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">소양\u003c/b>(Ocean Literacy)은 현대 시민의 필수 역량 중 하나입니다. 마치 \u003cb class=\"key\">자동차 \u003c/b>\u003cb class=\"key\">엔진\u003c/b>의 구조를 모르는 사람이 엔진 오일을 언제 갈아야 할지 토론할 수 없는 것과 같은 이치입니다. 이 글은 인체의 \u003cb class=\"key\">생명 \u003c/b>\u003cb class=\"key\">유지 \u003c/b>\u003cb class=\"key\">체계\u003c/b>(life-support system)와 해양을 비유하여 지식의 결핍이 실질적인 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정\u003c/b>의 장애물이 되고 있음을 지적합니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 앞서 배경지식을 좀 쌓아볼까요? 요즘 Ocean Literacy, 즉 해양 소양이라는 말이 중요하게 다뤄지고 있어요. 우리가 몸이 아플 때 어디가 아픈지 아는 것처럼, 지구가 아플 때도 그 구조를 알아야 고칠 수 있겠죠. 오늘 지문은 인체의 생명 유지 체계인 신장과 해양의 엔진인 크릴을 비교하며 이 개념을 아주 쉽게 설명해 줍니다. 마치 자동차 구조를 모르면 수리를 할 수 없는 것과 같은 이치라고 생각하면 쉬워요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 문제 제기\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>해양에 대한 인식이 높아지고 있지만, 동시에 거대한 \u003cb class=\"key\">장애물\u003c/b>에 직면해 있습니다. 단순히 관심을 갖는 것을 넘어 수십 년간 미뤄온 \u003cb class=\"key\">심도 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">대화\u003c/b>가 시작되려 하고 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>핵심 전제 제시\u003csmall>주장 · 문장 3\u003c/small>\u003c/h4>\u003cp>어떤 대상이 \u003cb class=\"key\">어떻게 \u003c/b>\u003cb class=\"key\">작동하는지\u003c/b> 모른다면, 그 대상의 변화에 대해 무엇을 할지 논의하는 것은 \u003cb class=\"key\">불가능\u003c/b>에 가깝습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>유추를 통한 비교\u003csmall>비유 및 예시 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>사람들은 학교에서 \u003cb class=\"key\">신장\u003c/b>과 같은 인체 기관의 역할을 배워서 이미 알고 있지만, \u003cb class=\"key\">해양\u003c/b>의 경우에는 그렇지 못하다는 점을 대조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>구체적 사례(크릴)\u003csmall>근거 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>남극해 \u003cb class=\"key\">크릴\u003c/b>의 감소를 단순한 먹이사슬의 문제를 넘어 \u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">엔진\u003c/b>의 일부로 이해해야 함을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>최종 결론\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>변화를 논의하고 \u003cb class=\"key\">적절한 \u003c/b>\u003cb class=\"key\">조치\u003c/b>를 취하기 위해서는 최소한의 \u003cb class=\"key\">맥락\u003c/b>적 이해가 선행되어야 합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름을 보면, 인식의 확산으로 시작해서 인체와의 비유를 거쳐 구체적인 해양의 예시로 이어집니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 해양에 대한 대중의 인식이 높아지고 있지만, 동시에 해결하기 힘든 큰 장애물이 버티고 있다고 화두를 던집니다.","hl":"f0"},{"n":5,"text":"세 번째 문장은 이 글의 핵심적인 전제입니다. 작동 원리, 즉 how it works를 모르면 변화에 대해 논의하는 것은 불가능하다는 아주 단호한 어조를 사용하고 있죠.","hl":"f1"},{"n":6,"text":"네 번째부터 여섯 번째 문장은 우리 몸의 신장을 예로 듭니다. 신장이 어디 있고 무슨 일을 하는지 우리는 학교에서 배워서 알지만, 해양에 대해서는 그만큼 알고 있지 못하다는 대조를 보여줍니다.","hl":"f2"},{"n":7,"text":"일곱 번째부터 아홉 번째 문장에서는 크릴을 예로 들어 설명해요. 크릴의 감소가 단순히 고래가 배고픈 문제를 넘어 해양 엔진이라는 시스템의 문제임을 알아야 한다고 강조합니다.","hl":"f3"},{"n":8,"text":"마지막 열 번째 문장에서 결론을 내립니다. 우리가 적절한 조치를 취하고 변화를 논의하기 위해서는 최소한의 맥락, context를 반드시 이해해야 한다는 것이죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">인체의 \u003cb class=\"key\">신장\u003c/b>에 대한 지식과 해양의 \u003cb class=\"key\">크릴\u003c/b>에 대한 무지를 대조하여 지식의 필요성을 강조합니다. 3번 문장에서 원리를 알아야 한다는 \u003cb class=\"key\">전제\u003c/b>를 깔고, 10번 문장에서 \u003cb class=\"key\">맥락 \u003c/b>\u003cb class=\"key\">이해\u003c/b>를 다시 강조하며 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>인식 확산과 대조되는 장애물 제시\u003c/span>\u003cb>If (4)\u003c/b>\u003cspan>이해를 돕기 위한 가정적 예시 시작\u003c/span>\u003cb>But (6)\u003c/b>\u003cspan>인체와 해양의 차이점 부각\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>표면적 현상 너머의 심층적 의미 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">how it works\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">at least a vague idea\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">learned about that part\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">understand at least some of the context\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>인체 (신장)\u003c/th>\u003cth>해양 (크릴/엔진)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>학교에서 배워서 알고 있음\u003c/td>\u003ctd>작동 원리를 잘 모름\u003c/td>\u003c/tr>\u003ctr>\u003ctd>문제 발생 시 막연한 이해라도 있음\u003c/td>\u003ctd>단순히 나쁜 일로만 치부함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 인체와 해양을 비교하고 대조하는 전개 방식을 취하고 있어요. 처음과 끝에 주제를 배치한 양괄식 구조로 볼 수 있는데, 특히 마지막 문장이 전체 내용을 강하게 요약하고 있습니다.","hl":"ty"},{"n":10,"text":"문장 중간중간에 쓰인 But이라는 신호어에 주목하세요. 두 번째 문장에서는 인식의 확산 뒤에 숨은 장애물을, 여섯 번째 문장에서는 인체와 다른 해양의 상황을, 여덟 번째 문장에서는 크릴 감소의 더 깊은 의미를 강조할 때 사용되었습니다. 또한 kidneys와 krill이 지식의 유무를 대조하는 핵심 소재로 연결되고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>increasing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>커지는, 증가하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>awareness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인식, 의식\u003c/span>\u003c/div>\u003cdiv>\u003cb>effect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영향, 효과\u003c/span>\u003c/div>\u003cdiv>\u003cb>seep into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 스며들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>public agenda\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공공 안건\u003c/span>\u003c/div>\u003cdiv>\u003cb>dragging\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끌고 오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>overdue\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기한이 지난, 미뤄진\u003c/span>\u003c/div>\u003cdiv>\u003cb>obstacle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장애물\u003c/span>\u003c/div>\u003cdiv>\u003cb>impossible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>discuss\u003c/b>\u003cem>동사\u003c/em>\u003cspan>논의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>initially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>처음에, 애초에\u003c/span>\u003c/div>\u003cdiv>\u003cb>kidney\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신장\u003c/span>\u003c/div>\u003cdiv>\u003cb>vague\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>막연한, 모호한\u003c/span>\u003c/div>\u003cdiv>\u003cb>life-support system\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생명 유지 체계\u003c/span>\u003c/div>\u003cdiv>\u003cb>not the case\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사실이 아니다, 그렇지 않다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decline\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감소, 쇠퇴\u003c/span>\u003c/div>\u003cdiv>\u003cb>generally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>일반적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>risk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위험\u003c/span>\u003c/div>\u003cdiv>\u003cb>context\u003c/b>\u003cem>명사\u003c/em>\u003cspan>맥락\u003c/span>\u003c/div>\u003cdiv>\u003cb>appropriate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>적절한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어들을 살펴볼까요? awareness는 인식이라는 뜻이고, obstacle은 장애물을 의미해요. 그리고 context라는 단어가 아주 중요한데, 여기서는 사건이 일어나는 배경이나 맥락을 뜻합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">obstacle\u003c/b>\u003cspan class=\"m\">장애물\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">barrier\u003c/span>\u003cspan class=\"s\">hindrance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">catalyst\u003c/span>\u003cspan class=\"a\">aid\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">vague\u003c/b>\u003cspan class=\"m\">막연한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">obscure\u003c/span>\u003cspan class=\"s\">ambiguous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clear\u003c/span>\u003cspan class=\"a\">definite\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">initially\u003c/b>\u003cspan class=\"m\">애초에\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">originally\u003c/span>\u003cspan class=\"s\">at first\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">finally\u003c/span>\u003cspan class=\"a\">ultimately\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decline\u003c/b>\u003cspan class=\"m\">감소\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reduction\u003c/span>\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">growth\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">appropriate\u003c/b>\u003cspan class=\"m\">적절한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">suitable\u003c/span>\u003cspan class=\"s\">proper\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inappropriate\u003c/span>\u003cspan class=\"a\">unsuitable\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어 정리도 해볼게요. obstacle은 barrier나 hindrance와 같이 무언가를 막는다는 단어로 바꿔 쓸 수 있고, 반대로 촉매제라는 뜻인 catalyst와는 반대되는 개념입니다. vague는 막연하고 모호하다는 뜻인데, 명확하다는 뜻의 clear와 함께 기억해 두세요. 적절한이라는 뜻의 appropriate는 suitable과 동의어입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해양에 미치는 우리의 영향에 대한 커지는 인식이\u003c/span>\u003cspan class=\"en\">An increasing awareness of our effect on the ocean\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서서히 스며들면서\u003c/span>\u003cspan class=\"en\">is slowly seeping\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공공 안건으로\u003c/span>\u003cspan class=\"en\">into the public agenda,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것 뒤로 대화를 끌고 온다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">dragging\u003c/span> behind it a conversation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수십 년 동안 안 미뤄 온\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">decades \u003c/span>\u003cspan class=\"tgt\">overdue\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">해양에 미치는 우리의 영향에 대한 커지는 인식이 공공 안건으로 서서히 스며들면서, 수십 년 동안 안 미뤄 온 대화를 그것 뒤로 끌고 온다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 드디어 \u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">환경\u003c/b>에 관심을 가지기 시작했다는 뜻입니다. 이 인식은 너무 늦게 시작된 \u003cb class=\"key\">논의의 \u003c/b>\u003cb class=\"key\">시발점\u003c/b> 역할을 하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사구문\u003c/span> : [부대상황 분사구문] , + [현재분사(v-ing)] : \"끌고 오면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : [선행사 a conversation] + [that (주격 관계대명사) + 동사] : \"수십 년 동안 연체된(미뤄 온)\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"An increasing awareness of our effect on the ocean, 해양에 미치는 우리의 영향에 대한 커지는 인식이. is slowly seeping, 서서히 스며들면서. into the public agenda, 공공 안건으로. dragging behind it a conversation, 그것 뒤로 대화를 끌고 온다. that is decades overdue, 수십 년 동안 안 미뤄 온. 이 문장 전체를 해석하면, 해양에 미치는 우리의 영향에 대한 커지는 인식이 공공 안건으로 서서히 스며들면서, 수십 년 동안 안 미뤄 온 대화를 그것 뒤로 끌고 온다.","hl":"m"},{"n":14,"text":"우리가 바다에 어떤 영향을 주는지 이제야 대중들이 진지하게 고민하기 시작했다는 흐름을 보여줍니다. 너무 늦게 시작된 논의지만, 이제라도 공론화가 되고 있다는 점이 핵심입니다.","hl":"mn"},{"n":15,"text":"첫 번째 포인트인 dragging은 분사구문으로, 앞 문장의 내용 때문에 뒤이어 어떤 결과가 일어나는지 설명합니다. 두 번째로 that is decades overdue 부분은 주격 관계대명사절로, 수십 년이나 늦어진 대화라는 점을 강조하며 앞의 명사를 꾸며줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 이 대화는\u003c/span>\u003cspan class=\"en\">But this conversation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직면한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">faces\u003c/span>\u 3c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 여러분이 애초에 알지 못한다면\u003c/span>\u003cspan class=\"en\">if you don't initially know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 어떻게 작동하는지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">works\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 여러분이 그것이 어떻게 작동하는지를 애초에 알지 못한다면 변화하는 어떤 것에 대해 무엇을 해야 할지를 논의하는 것은 거의 불가능하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어떤 시스템의 \u003cb class=\"key\">작동 \u003c/b>\u003cb class=\"key\">원리\u003c/b>를 모르면, 그 안에서 발생하는 변화를 대처하는 대화는 불가능하다는 뜻입니다. 즉, \u003cb class=\"key\">기초 \u003c/b>\u003cb class=\"key\">지식\u003c/b>의 중요성을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어\u003c/span> : It (가주어) + is + 형용사 : \"그것은 (~하다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">진주어\u003c/span> : to + 동사원형 : \"논의하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사\u003c/span> : what + to + do : \"무엇을 해야 할지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사(how) + 주어(it) + 동사(works) : \"그것이 어떻게 작동하는지\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"It's almost impossible, 거의 불가능하다. to discuss, 논의하는 것은. what to do about something changing, 변화하는 어떤 것에 대해 무엇을 해야 할지를. if you don't initially know, 만약 여러분이 애초에 알지 못한다면. how it works, 그것이 어떻게 작동하는지를. 이 문장 전체를 해석하면, 만약 여러분이 그것이 어떻게 작동하는지를 애초에 알지 못한다면 변화하는 어떤 것에 대해 무엇을 해야 할지를 논의하는 것은 거의 불가능하다.","hl":"m"},{"n":20,"text":"우리가 무엇을 해결하려면 그것이 원래 어떻게 돌아가는 시스템인지부터 알아야 한다는 뜻이에요. 기본 지식이 없으면 해결책도 논의할 수 없다는 비판적인 시각을 보여줍니다.","hl":"mn"} > 해양 생태계에 대한 지식이 부족한 일반인들이 뉴스를 접할 때 느끼는 \u003cb class=\"key\">막연한 \u003c/b>\u003cb class=\"key\">인식\u003c/b>을 보여줍니다. 크릴 감소가 왜 문제인지 구체적으로 알지 못한 채 그저 \u003cb class=\"key\">부정적인 \u003c/b>\u003cb class=\"key\">상황\u003c/b>으로만 받아들인다는 의미입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 접속사\u003c/span> : When [접속사] + 주어 + 동사 : \"~할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사 + like + 명사\u003c/span> : sound [감각동사] + like [전치사] + 명사 : \"일반적으로 ~처럼 들린다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"When we see a news story, 우리가 신문 기사를 볼 때. about the long­term decline, 장기적 감소에 관한. in the numbers of krill, 크릴 수의. in the Southern Ocean, 남극해에서의. it sounds generally, 일반적으로 그것은 들린다. like a bad thing, 나쁜 일처럼. 이 문장 전체를 해석하면, 우리가 남극해 크릴 수의 장기적 감소에 관한 신문 기사를 볼 때, 일반적으로 그것은 나쁜 일처럼 들린다.","hl":"m"},{"n":32,"text":"이 문장은 우리가 바다의 변화를 뉴스로 접할 때 느끼는 막연한 감정을 설명해요. 크릴이 줄어든다는 소식이 그저 안 좋은 일이라는 정도로만 단편적으로 이해되고 있음을 보여주죠.","hl":"mn"},{"n":33,"text":"첫 번째로 When은 시간의 접속사로 ~할 때라고 해석해요. 두 번째로 sounds generally like는 감각동사 sound 뒤에 명사구가 올 때 전치사 like를 쓴 형태인데, 중간에 부사인 generally가 끼어들어 의미를 수식하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 거기에는 훨씬 더 많은 것이 있다\u003c/span>\u003cspan class=\"en\">But there's \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">far \u003c/span>\u003cspan class=\"tgt\">more\u003c/span> to it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위험보다\u003c/span>\u003cspan class=\"en\">than the risk\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고래가 굶주리는\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">whales \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">hungry\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 거기에는 고래가 굶주리는 위험보다 훨씬 더 많은 것이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 크릴의 감소가 단순히 고래의 먹이 부족 문제로 끝나는 것이 아니라, 훨씬 더 \u003cb class=\"key\">광범위한 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 끼친다는 점을 암시합니다. 눈에 보이는 현상 너머에 더 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">맥락\u003c/b>이 있음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 강조\u003c/span> : far [부사] + more [비교급] : \"훨씬 더 많은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 의미상 주어\u003c/span> : of [전치사] + whales [의미상 주어] + going [동명사] : \"고래가 굶주리는 것\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"But there's far more to it, 하지만 거기에는 훨씬 더 많은 것이 있다. than the risk, 위험보다. of whales going hungry, 고래가 굶주리는. 이 문장 전체를 해석하면, 하지만 거기에는 고래가 굶주리는 위험보다 훨씬 더 많은 것이 있다.","hl":"m"},{"n":35,"text":"크릴의 감소가 단순히 고래의 먹이 부족 문제에 그치지 않는다는 점을 강조하고 있어요. 눈에 보이는 현상 너머에 더 중요한 본질이 숨어있다는 뜻이죠.","hl":"mn"},{"n":36,"text":"첫 번째로 far는 비교급인 more를 강조하며 훨씬이라는 뜻을 나타내요. 두 번째로 of whales going hungry에서 whales는 동명사인 going의 의미상 주어로 쓰여서 고래가 굶주리는 것이라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크릴은 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Krill \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일부\u003c/span>\u003cspan class=\"en\">a part of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해양 엔진의\u003c/span>\u003cspan class=\"en\">the ocean engine.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">크릴은 해양 엔진의 일부이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 크릴을 '엔진'에 비유하여, 이들이 바다 생태계가 원활하게 작동하도록 돕는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">원동력\u003c/b>임을 설명합니다. 기계에서 엔진이 없으면 안 되듯 바다에서 크릴이 \u003cb class=\"key\">필수적인 \u003c/b>\u003cb class=\"key\">존재\u003c/b>임을 뜻합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복수 취급 명사\u003c/span> : Krill [주어/복수] + are [동사/복수] : \"크릴은 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Krill are, 크릴은 ~이다. a part of, 일부. the ocean engine, 해양 엔진의. 이 문장 전체를 해석하면, 크릴은 해양 엔진의 일부이다.","hl":"m"},{"n":38,"text":"크릴을 해양 엔진에 비유하여 바다 생태계가 돌아가게 하는 핵심적인 역할을 한다는 것을 설명해요. 엔진이 멈추면 배가 못 가듯 크릴이 사라지면 바다 전체가 무너질 수 있다는 비유죠.","hl":"mn"},{"n":39,"text":"여기서 Krill은 단수와 복수 형태가 같지만, 문맥상 복수 개념으로 쓰였기 때문에 복수 동사인 are를 사용했다는 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 이해할 필요가 있다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최소한 어느 정도의 맥락은\u003c/span>\u003cspan class=\"en\">at least some of the context\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 변화에 대해 논의할 수 있기 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">before\u003c/span> we can \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">discuss \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">change \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 적절한 조치를 취할 수 (있기 전에).\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">take\u003c/span> appropriate action.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 변화에 대해 논의하고 적절한 조치를 취할 수 있기 전에 최소한 어느 정도의 맥락은 이해할 필요가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바다의 문제를 해결하기 위해서는 그 시스템이 어떻게 작동하는지에 대한 \u003cb class=\"key\">배경지식\u003c/b>이 필수적이라는 점을 역설합니다. 단순한 현상 파악을 넘어 문제 해결을 위한 \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">이해\u003c/b>의 중요성을 강조하며 글을 마무리하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : need + [to understand (to부정사구/목적어)] : \"이해할 필요가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간의 접속사\u003c/span> : before + 주어(we) + 동사(can discuss...) : \"우리가 논의할 수 있기 전에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 뒤 동사원형 병렬 구조\u003c/span> : can + [discuss (동사원형 1)] + and + [take (동사원형 2)] : \"논의하고 조치를 취하다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"We need to understand, 우리는 이해할 필요가 있다.  at least some of the context, 최소한 어느 정도의 맥락은.  before we can discuss the change, 우리가 변화에 대해 논의할 수 있기 전에.  and take appropriate action, 그리고 적절한 조치를 취할 수 (있기 전에).. 이 문장 전체를 해석하면, 우리는 변화에 대해 논의하고 적절한 조치를 취할 수 있기 전에 최소한 어느 정도의 맥락은 이해할 필요가 있다.","hl":"m"},{"n":41,"text":"이 문장은 바다의 문제를 해결하기 위해 가장 먼저 필요한 것이 무엇인지 알려주는 결론이에요. 변화를 논의하고 조치를 취하기에 앞서 바다가 어떻게 돌아가는지에 대한 배경 지식인 맥락을 이해하는 것이 우선이라는 점을 강조하고 있죠.","hl":"mn"},{"n":42,"text":"어법을 살펴볼까요? 첫 번째로 need 다음에 나오는 to understand는 목적어 자리에 쓰인 to부정사예요. 두 번째로 시간의 접속사 before가 문장을 연결해 주고 있고요. 마지막으로 discuss와 take를 보세요. 접속사 and가 이 두 단어를 연결하고 있는데, 조동사 can에 함께 걸려 있는 병렬 구조이기 때문에 둘 다 동사원형으로 써야 한답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>해양 영향에 대한 인식이 높아졌지만, 실질적인 대화를 가로막는 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">장애물\u003c/b>이 존재합니다.\u003c/li>\u003cli>시스템이 \u003cb class=\"key\">작동하는 \u003c/b>\u003cb class=\"key\">원리\u003c/b>를 모른다면 그 시스템의 변화에 대해 대응 방안을 논의하는 것은 불가능합니다.\u003c/li>\u003cli>인체 기관인 \u003cb class=\"key\">신장\u003c/b>에 대해서는 기초 지식이 있지만, 해양의 구성 요소인 \u003cb class=\"key\">크릴\u003c/b> 등에 대해서는 지식이 부족합니다.\u003c/li>\u003cli>변화에 대한 적절한 조치를 취하기 위해서는 해양 생태계의 \u003cb class=\"key\">맥락\u003c/b>을 이해하는 과정이 필수적입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>To effectively discuss and address marine issues, it is essential to first understand the fundamental mechanisms and context of the ocean ecosystem.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">해양 환경 변화에 적절히 대응하기 위해서는 \u003cb class=\"key\">기초적인 \u003c/b>\u003cb class=\"key\">작동 \u003c/b>\u003cb class=\"key\">원리\u003c/b>와 \u003cb class=\"key\">맥락\u003c/b>에 대한 이해가 반드시 선행되어야 합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"오늘 배운 내용을 정리해 봅시다. 해양 환경을 지키는 것은 단순한 마음가짐의 문제가 아니라, 해양이 어떻게 작동하는지 공부하는 것에서 시작된다는 점을 잊지 마세요. context와 how it works라는 표현을 꼭 기억하면서 복습하시길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
