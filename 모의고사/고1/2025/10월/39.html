</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 39번","audioDir":"39_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">39번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>Strategies for Continuous Consumption: The Power of Fashion\u003c/h1>\u003ch2>지속적인 소비를 위한 전략: 패션의 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>기업들이 소비자가 물건을 더 많이, 더 자주 구매하도록 \u003cb class=\"key\">유행\u003c/b>이라는 개념을 이용해 멀쩡한 물건을 \u003cb class=\"key\">구식\u003c/b>으로 인식하게 만드는 전략을 설명합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Companies drive continuous consumption by creating the perception that functional items are outdated through trends and marketing.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 기업들이 어떻게 우리의 지갑을 열게 만드는지, 그 영리한 전략을 다룬 지문을 함께 공부할 거예요. 이 글은 소비자들이 물건을 더 자주 사게 하려고 기업들이 사용하는 유행이라는 마법에 대해 이야기하고 있어요. 요지는 간단해요. 기업들은 유행을 통해 멀쩡한 물건을 구식으로 보이게 만들어 끊임없는 소비를 유도한다는 내용이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">경제학에는 \u003cb class=\"key\">계획적 \u003c/b>\u003cb class=\"key\">구식화\u003c/b>(Planned Obsolescence)라는 개념이 있습니다. 제품이 충분히 쓸 만함에도 불구하고, 디자인이나 기능을 살짝 바꾸어 기존 제품을 \u003cb class=\"key\">구식\u003c/b>처럼 보이게 만들어 교체를 유도하는 전략이죠. 마치 작년에 산 패딩이 멀쩡한데도 올해 새로운 색상이 유행하면 촌스럽게 느껴지는 것과 같습니다. 기업의 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">부서\u003c/b>(marketing divisions)는 이러한 심리적 기제를 활용해 끊임없는 \u003cb class=\"key\">소비\u003c/b>를 만들어냅니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 전에 배경지식을 하나 알아볼까요? 여러분, 계획적 구식화라는 말을 들어보셨나요? 영어로는 Planned Obsolescence라고 하는데요. 제품이 고장 나지 않았는데도 유행이나 디자인을 바꿔서 옛날 물건처럼 보이게 만드는 전략이에요. 마케팅 부서는 바로 이런 심리를 이용해서 우리가 계속해서 소비하도록 만듭니다. 마치 우리가 매년 새로운 휴대폰이나 유행하는 옷을 사고 싶어 하는 것과 같은 원리죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>정의\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>상품을 구매하는 \u003cb class=\"key\">고객\u003c/b>과 개인적인 용도로 물품을 사용하는 \u003cb class=\"key\">소비자\u003c/b>의 개념을 정의하며 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>기업의 목표\u003csmall>주장 · 문장 3\u003c/small>\u003c/h4>\u003cp>기업은 고객들이 물건을 더 많이, 더 \u003cb class=\"key\">자주\u003c/b> 소비하게 만들기 위해 다양한 방법을 \u003cb class=\"key\">고안\u003c/b>해 왔다는 핵심 내용을 전달합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>식품의 경우\u003csmall>예시 · 문장 4\u003c/small>\u003c/h4>\u003cp>음식은 먹으면 사라지는 속성 때문에 자연스럽게 \u003cb class=\"key\">재구매\u003c/b>가 발생하여 소비 유도가 비교적 쉽다는 점을 언급합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>영구재의 전략\u003csmall>전환 및 구체화 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>오래 쓰는 물건은 \u003cb class=\"key\">유행\u003c/b>이 지났다는 인식을 심어 \u003cb class=\"key\">구식\u003c/b>으로 느껴지게 함으로써 구매를 유도하며, 패션 산업이 그 대표적 사례임을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>영역의 확장\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>오늘날 이러한 유행 전략은 의류를 넘어 자동차, 전자제품 등 \u003cb class=\"key\">거의 \u003c/b>\u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">영역\u003c/b>으로 끝없이 확장되고 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 이 글이 어떤 순서로 우리의 소비 심리를 파고드는지 흐름을 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 글의 기초를 다집니다. 상품을 사는 고객과 개인적으로 물건을 사용하는 소비자의 개념을 정의하면서 이야기를 시작하고 있죠.","hl":"f0"},{"n":5,"text":"세 번째 문장은 이 글의 핵심입니다. 기업들이 고객에게 물건을 더 많이, 그리고 더 자주 소비하게 하려고 여러 가지 방법을 고안해 왔다는 점을 강조하고 있어요.","hl":"f1"},{"n":6,"text":"네 번째 문장에서는 식품의 사례를 듭니다. 음식은 먹으면 말 그대로 사라지기 때문에 새로운 음식을 사야 할 필요가 항상 생겨서 소비 유도가 쉽다고 설명하죠.","hl":"f2"},{"n":7,"text":"다섯 번째와 여섯 번째 문장에서는 반전을 보여줍니다. 하지만 오래 쓰는 물건은 다르죠. 그래서 기업들은 유행이 지났다는 점을 설득해서 멀쩡한 물건을 구식으로 만들고 새 옷을 사게 만든다고 해요.","hl":"f3"},{"n":8,"text":"마지막 일곱 번째 문장에서는 이 유행의 범위가 얼마나 넓은지 보여줍니다. 옷뿐만 아니라 자동차, 휴대폰까지 마케팅 부서의 창의력이 닿는 곳이라면 어디든 끝없이 확장된다고 결론지어요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">세 번째 문장에서 기업의 목표를 제시한 후, 성격이 다른 \u003cb class=\"key\">식품\u003c/b>과 \u003cb class=\"key\">영구재\u003c/b>를 대조하며 기업의 전략을 설명합니다. 특히 영구재가 어떻게 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">구식화\u003c/b>를 거치는지 구체적으로 분석하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Therefore (3)\u003c/b>\u003cspan>앞의 정의를 바탕으로 기업의 행동 결론 도출\u003c/span>\u003cb>But (5)\u003c/b>\u003cspan>식품과 대조되는 영구재의 상황 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">goods\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">produced items\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">food\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">permanent things\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">stuff\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">clothing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">automobiles\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mobile phones\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">computers\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Food (식품)\u003c/th>\u003cth>Permanent things (영구재)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>실제로 소비되어 사라짐\u003c/td>\u003ctd>물리적으로 오래 유지됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>필요에 의한 재구매\u003c/td>\u003ctd>유행에 의한 심리적 재구매\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 식품과 영구재라는 두 대상을 대조하는 비교와 대조의 방식을 사용하고 있어요. 문장 구성으로 보면, 세 번째 문장에서 주제를 던지고 뒤에서 구체적인 예시를 들어 설명하는 중괄식 구조를 띄고 있습니다.","hl":"ty"},{"n":10,"text":"문장 사이의 연결고리를 주목해 보세요. 세 번째 문장의 Therefore는 앞의 정의를 바탕으로 기업의 행동 원인을 요약해 줍니다. 그리고 다섯 번째 문장의 But은 식품과 달리 오래 쓰는 물건들은 다른 전략이 필요하다는 전환점을 확실히 짚어주고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>purchase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구매하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>goods\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상품, 물품\u003c/span>\u003c/div>\u003cdiv>\u003cb>personal use\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>개인적인 용도\u003c/span>\u003c/div>\u003cdiv>\u003cb>consumer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소비자\u003c/span>\u003c/div>\u003cdiv>\u003cb>beings\u003c/b>\u003cem>명사\u003c/em>\u003cspan>존재\u003c/span>\u003c/div>\u003cdiv>\u003cb>consume\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소비하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>invent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고안하다, 발명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>multiple\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한, 다수의\u003c/span>\u003c/div>\u003cdiv>\u003cb>ensure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반드시 ~하게 하다, 보장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>produced\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>생산된\u003c/span>\u003c/div>\u003cdiv>\u003cb>quantity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양\u003c/span>\u003c/div>\u003cdiv>\u003cb>frequently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자주\u003c/span>\u003c/div>\u003cdiv>\u003cb>literally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>말 그대로\u003c/span>\u003c/div>\u003cdiv>\u003cb>permanent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>영구적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>approach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>접근법\u003c/span>\u003c/div>\u003cdiv>\u003cb>outdated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>구식의\u003c/span>\u003c/div>\u003cdiv>\u003cb>convince\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설득하다, 납득시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fashionable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유행하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>entire\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전체의\u003c/span>\u003c/div>\u003cdiv>\u003cb>functionable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기능할 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>indefinitely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>무기한으로, 끝없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>creative minds\u003c/b>\u003cem>명사\u003c/em>\u003cspan>창의적 사고\u003c/span>\u003c/div>\u003cdiv>\u003cb>marketing division\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마케팅 부서\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어 몇 개만 짚어볼게요. 물건이 더 이상 유행하지 않는다는 뜻의 outdated는 이 글의 핵심 단어예요. 그리고 설득하다라는 뜻의 convince는 기업이 소비자의 마음을 어떻게 움직이는지 잘 보여주는 표현이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">purchase\u003c/b>\u003cspan class=\"m\">구매하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">buy\u003c/span>\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sell\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">frequently\u003c/b>\u003cspan class=\"m\">자주\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">often\u003c/span>\u003cspan class=\"s\">repeatedly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rarely\u003c/span>\u003cspan class=\"a\">seldom\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">permanent\u003c/b>\u003cspan class=\"m\">영구적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lasting\u003c/span>\u003cspan class=\"s\">durable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">temporary\u003c/span>\u003cspan class=\"a\">brief\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">outdated\u003c/b>\u003cspan class=\"m\">구식의\u003c/sp >\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (be+과거분사)\u003c/span> : be동사 (are) + 과거분사 (called) : \"~라고 불린다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Those who purchase, 구매하는 사람들은. the goods of a company, 어떤 회사의 상품을. are called customers, 고객이라 불린다.. 이 문장 전체를 해석하면, 어떤 회사의 상품을 구매하는 사람들은 고객이라 불린다.","hl":"m"},{"n":14,"text":"첫 번째 문장에서는 물건을 사는 행위에 초점을 맞춰서 고객이라는 단어를 정의하고 있어요. 이후에 나올 소비자라는 개념과 비교하기 위한 기초 작업이라고 볼 수 있죠.","hl":"mn"},{"n":15,"text":"첫 번째 포인트는 Those who예요. 여기서 Those는 저것들이 아니라 뭐뭐 하는 사람들이라는 뜻으로 뒤에 오는 who purchase의 수식을 받고 있어요. 두 번째 포인트는 are called라는 수동태 표현이에요. 주어인 사람들이 스스로를 부르는 게 아니라 다른 사람들에 의해 고객이라고 불리는 수동적인 관계를 나타내고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상품을 구매하는 개인들은\u003c/span>\u003cspan class=\"en\">Individuals \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">purchase\u003c/span> goods\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인적인 용도로\u003c/span>\u003cspan class=\"en\">for personal use\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소비자라 불린다.\u003c/span>\u003cspan class=\"en\">are called consumers:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 소비하는 존재라 (불린다).\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">beings \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">consume\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">개인적인 용도로 상품을 구매하는 사람들은 소비자, 즉 소비하는 존재라 불린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고객 중에서도 특히 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">사용\u003c/b>을 위해 물건을 사서 쓰는 사람을 \u003cb class=\"key\">소비자\u003c/b>로 구체화하여 정의합니다. 콜론(:) 뒤의 어구는 소비자를 \u003cb class=\"key\">소비하는 \u003c/b>\u003cb class=\"key\">존재\u003c/b>라고 한 번 더 쉽게 풀이해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사 (Individuals) + who [주격 관계대명사] + 동사 (purchase) : \"구매하는 (개인들)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격의 보충 설명\u003c/span> : consumers (명사) + : (콜론) + beings who consume (명사구) : \"소비하는 존재\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Individuals who purchase goods, 상품을 구매하는 개인들은. for personal use, 개인적인 용도로. are called consumers, 소비자라 불린다.. beings who consume, 즉 소비하는 존재라 (불린다).. 이 문장 전체를 해석하면, 개인적인 용도로 상품을 구매하는 사람들은 소비자, 즉 소비하는 존재라 불린다.","hl":"m"},{"n":17,"text":"두 번째 문장은 고객보다 조금 더 좁은 범위인 소비자를 설명해요. 단순히 사는 것에서 끝나는 게 아니라 개인적인 용도로 직접 사용하는 사람이라는 점을 강조하고 있죠.","hl":"mn"},{"n":18,"text":"첫 번째로 Individuals who purchase 부분을 보세요. 주격 관계대명사 who가 구매하는 개인들이라는 의미로 앞의 명사를 꾸며주고 있어요. 두 번째는 문장 끝에 있는 콜론이에요. 이 기호는 앞에서 말한 소비자라는 단어가 바로 소비하는 존재라는 뜻이라는 걸 보충해서 설명해주는 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서 기업들은 고안해 왔다\u003c/span>\u003cspan class=\"en\">Therefore, companies \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">invented\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확실히 하기 위한 다양한 방법들을\u003c/span>\u003cspan class=\"en\">multiple \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ways \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">ensure\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 고객이 소비하도록\u003c/span>\u003cspan class=\"en\">that their customers consume\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspa 돈을 벌 수 있다는 논리적인 결론을 보여줘요.","hl":"mn"},{"n":21,"text":"첫 번째로 살펴볼 부분은 have invented예요. 기업들이 예전부터 지금까지 계속해서 방법을 만들어왔다는 현재완료 시제를 썼죠. 두 번째는 ways to ensure입니다. 명사 뒤의 to부정사가 형용사처럼 쓰여서 확실하게 만드는 방법들이라고 해석해요. 마지막으로 larger and larger처럼 비교급 두 개를 and로 연결하면 점점 더 뭐뭐한이라는 뜻으로 강조의 의미를 담게 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식을 판매하는 사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Those \u003c/span>\u003cspan class=\"tgt\">who\u003c/span> sell food\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수월한 편인데,\u003c/span>\u003cspan class=\"en\">have an easy time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 음식은 말 그대로 소비되므로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for\u003c/span> food is literally consumed,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 음식을 구매할 필요는 항상 있기 때문이다\u003c/span>\u003cspan class=\"en\">so there is always a need\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">purchase\u003c/span> new food.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">음식을 판매하는 사람들은 수월한 편인데, 왜냐하면 음식은 말 그대로 소비되므로, 새로운 음식을 구매할 필요는 항상 있기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 음식은 먹으면 사라지는 \u003cb class=\"key\">필수소비재\u003c/b>이기 때문에, 판매자가 굳이 새로운 소비 이유를 만들어낼 필요가 없다는 뜻입니다. 즉, 인간의 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">본능\u003c/b> 덕분에 식품 산업은 지속적인 수요가 발생한다는 흐름입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\ chunk\">\u003cspan class=\"ko\">한 가지 접근법은 물건을 만드는 것이다\u003c/span>\u003cspan class=\"en\">One approach is to make the stuff\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 이미 가지고 있는 물건이 구식이 되게\u003c/span>\u003cspan class=\"en\">that people already have outdated\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 설득함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">convincing \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 더 이상 유행하지 않는다고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> it is no longer fashionable.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 보다 영구적인 물건의 경우, 기업들은 고객이 그것들을 계속 소비할 이유를 만들어 내야 한다. 한 가지 접근법은 사람들이 이미 가지고 있는 물건이 더 이상 유행하지 않는다고 설득하여 그것을 구식이 되게 하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오래 쓰는 가전이나 옷 같은 물건은 잘 망가지지 않기 때문에, 기업은 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">결핍\u003c/b>을 만들어내야 합니다. 멀쩡한 물건을 \u003cb class=\"key\">구식\u003c/b>으로 느끼게 만들어 다시 지갑을 열게 한다는 전략을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어\u003c/span> : for [목적격] + to [동사원형] : \"고객이 계속하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">by ~ing 및 4형식 구조\u003c/span> : by [전치사] + convincing [동명사] + them [간접목적어] + that절 [직접목적어] : \"그들에게 ~라고 설득함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">5형식 문장 (사역/상태 변화)\u003c/span> : make [동사] + the stuff [목적어] + outdated [목적격 보어/형용사] : \"물건을 구식으로 만들다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"But with more permanent things, 그러나 보다 영구적인 물건의 경우. companies must invent reasons, 기업들은 이유를 만들어 내야 한다. for their customers to continue to consume them, 고객이 그것들을 계속 소비할.. One approach is to make the stuff, 한 가지 접근법은 물건을 만드는 것이다. that people already have outdated, 사람들이 이미 가지고 있는 물건이 구식이 되게. by convincing them, 그들을 설득함으로써. that it is no longer fashionable, 그것이 더 이상 유행하지 않는다고.. 이 문장 전체를 해석하면, 그러나 보다 영구적인 물건의 경우, 기업들은 고객이 그것들을 계속 소비할 이유를 만들어 내야 한다. 한 가지 접근법은 사람들이 이미 가지고 있는 물건이 더 이상 유행하지 않는다고 설득하여 그것을 구식이 되게 하는 것이다.","hl":"m"},{"n":26,"text":"오래 쓰는 물건은 기업 입장에서 골칫거리일 수 있어요. 그래서 멀쩡한 물건을 두고도 새것을 사고 싶게끔 유행이 지났다는 최면을 거는 거예요. 심리적인 압박을 가하는 마케팅 전략이죠.","hl":"mn"},{"n":27,"text":"첫 번째로 to continue 앞에 있는 for their customers는 의미상 주어라고 불러요. 계속하는 주체가 바로 고객이라는 뜻이죠. 두 번째로 make 뒤에 목적어와 형용사 outdated를 써서 물건을 구식인 상태로 만든다는 5형식 구조를 썼어요. 세 번째로 by ing는 수단을 뜻하고요, convince A that 구조는 A에게 이 내용을 설득한다는 뜻입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전체 패션 산업은 만들어져 있다\u003c/span>\u003cspan class=\"en\">The entire fashion industry \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">built\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유행이 중요하다는 것을 사람들에게 설득하기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">convince\u003c/span> people \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">fashion \u003c/span>\u003cspan class=\"tgt\">matters\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 그들이 새 옷을 사야 한다고,\u003c/span>\u003cspan class=\"en\">so they must purchase new clothing,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기존 옷이 ~하더라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">though\u003c/span> the old\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 완벽하게 기능하더라도.\u003c/span>\u003cspan class=\"en\">is still perfectly functionable.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전체 패션 산업은 기존 옷이 여전히 완벽하게 기능하더라도, 유행이 중요하고 그래서 그들이 새 옷을 사야 한다고 사람들을 설득하기 위해 만들어져 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 패션 산업의 본질은 물건의 \u003cb class=\"key\">기능성\u003c/b>이 아니라 \u003cb class=\"key\">상징성\u003c/b>에 있다는 뜻입니다. 헌 옷이 여전히 입을 만해도, '유행'이라는 가치를 주입해 끊임없이 새로운 소비를 이끌어낸다는 점을 비판적으로 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + p.p.)\u003c/span> : The industry [주어] + is [be동사] + built [과거분사] : \"만들어져 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : is built + to convince [to부정사] : \"설득하기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : convince [동사] + people [간목] + that절 [직목] : \"유행이 중요하다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">양보의 접속사\u003c/span> : even though + 주어 + 동사 : \"~임에도 불구하고\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"The entire fashion industry is built, 전체 패션 산업은 만들어져 있다. to convince people that fashion matters, 유행이 중요하다는 것을 사람들에게 설득하기 위해. so they must purchase new clothing, 그래서 그들이 새 옷을 사야 한다고. even though the old, 기존 옷이 ~하더라도. is still perfectly functionable, 여전히 완벽하게 기능하더라도.. 이 문장 전체를 해석하면, 전체 패션 산업은 기존 옷이 여전히 완벽하게 기능하더라도, 유행이 중요하고 그래서 그들이 새 옷을 사야 한다고 사람들을 설득하기 위해 만들어져 있다.","hl":"m"},{"n":29,"text":"패션계는 사실 우리가 옷을 필요로 해서 사기보다는 유행에 뒤처지면 안 된다는 생각을 하도록 정교하게 설계되어 있어요. 옷이 찢어지지 않아도 유행이 지났다는 이유만으로 버리게 만드는 게 그들의 목표죠.","hl":"mn"},{"n":30,"text":"첫 번째로 is built는 수동태로 산업이 그렇게 구축되었다는 의미예요. 두 번째로 to convince는 설득하기 위해서라는 목적을 나타내죠. 세 번째로 that fashion matters는 유행이 중요하다는 사실을 묶어주는 명사절 접속사예요. 마지막으로 even though는 옷이 멀쩡하다는 반대 상황을 연결하는 양보의 접속사랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날 유행은 확장된다\u003c/span>\u003cspan class=\"en\">Fashion today extends\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옷을 넘어 훨씬 많은 것들로:\u003c/span>\u003cspan class=\"en\">to \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">far \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003cspan class=\"tgt\">than\u003c/span> clothes:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자동차, 휴대 전화, 컴퓨터 등 ―\u003c/span>\u003cspan class=\"en\">automobiles, mobile phones, computers ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 목록은 끝없이 확장되며,\u003c/span>\u003cspan class=\"en\">the list \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">extended\u003c/span> indefinitely,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다만 창의적 사고의 한계에 의해서만 제한될 뿐이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">limited\u003c/span> only by the limits of the creative minds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기업에 속한 마케팅 부서의.\u003c/span>\u003cspan class=\"en\">of the marketing divisions of companies.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날 유행은 옷을 넘어 자동차, 휴대 전화, 컴퓨터 등 훨씬 많은 것들로 확장된다. 그 목록은 끝없이 확장되며, 다만 기업에 속한 마케팅 부서의 창의적 사고의 한계에 의해서만 제한될 뿐이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 패션이라는 개념이 의류를 넘어 현대 사회의 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">소비재\u003c/b>로 확장되었음을 설명합니다. 소비자의 욕구를 자극하는 \u003cb class=\"key\">마케팅의 \u003c/b>\u003cb class=\"key\">영향력\u003c/b>이 상품의 수명을 결정하는 핵심 요소임을 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 강조와 비교 구문\u003c/span> : far [비교급 강조어] + more [비교급] ~ than [비교 대상] : \"옷보다 훨씬 많은 것들로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + extended [과거분사] : \"확장된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사구(수동 분사구문)\u003c/span> : [(being) + limited (과거분사)] : \"제한될 뿐이다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Fashion today extends, 오늘날 유행은 확장된다. to far more things than clothes, 옷을 넘어 훨씬 많은 것들로:. automobiles, mobile phones, computers ―, 자동차, 휴대 전화, 컴퓨터 등 ―. the list is extended indefinitely, 그 목록은 끝없이 확장되며. limited only by the limits of the creative minds, 다만 창의적 사고의 한계에 의해서만 제한될 뿐이다. of the marketing divisions of companies, 기업에 속한 마케팅 부서의.. 이 문장 전체를 해석하면, 오늘날 유행은 옷을 넘어 자동차, 휴대 전화, 컴퓨터 등 훨씬 많은 것들로 확장된다. 그 목록은 끝없이 확장되며, 다만 기업에 속한 마케팅 부서의 창의적 사고의 한계에 의해서만 제한될 뿐이다.","hl":"m"},{"n":32,"text":"이 문장은 패션이라는 전략이 이제는 옷에만 국한되지 않는다는 점을 보여줍니다. 마케팅 부서가 기발한 아이디어를 내놓는 한, 모든 소비재가 유행의 대상이 되어 소비를 자극하게 된다는 마케팅의 영향력을 다루고 있어요.","hl":"mn"},{"n":33,"text":"첫 번째로 far more things than을 보세요. 비교급 more를 훨씬이라는 뜻으로 강조하기 위해 far를 썼고, than을 통해 옷과 비교하고 있습니다. 두 번째로 is extended는 수동태 표현이에요. 목록이라는 주어가 마케팅 전략에 의해 확장되는 대상이기 때문에 수동태를 썼죠. 마지막으로 limited는 과거분사구로, 수동의 의미를 담아 앞의 내용을 보충 설명하고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>기업은 고객들이 생산된 상품을 더 많이, 그리고 더 \u003cb class=\"key\">자주 \u003c/b>\u003cb class=\"key\">소비\u003c/b>하도록 여러 전략을 사용합니다.\u003c/li>\u003cli>음식처럼 바로 사라지는 상품과 달리, \u003cb class=\"key\">영구적인 \u003c/b>\u003cb class=\"key\">물건\u003c/b>은 소비자가 계속 살 이유를 만들어야 합니다.\u003c/li>\u003cli>패션 산업은 멀쩡한 물건을 \u003cb class=\"key\">구식\u003c/b>이라고 느끼게 만들어 새 상품 구매를 유도하는 대표적 전략입니다.\u003c/li>\u003cli>이런 유행 전략은 의류를 넘어 자동차와 정보 기기 등 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">분야\u003c/b>로 무한히 확장되고 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Companies drive continuous consumption by creating the perception that functional items are outdated through trends and marketing.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">기업들이 소비자가 물건을 더 많이, 더 자주 구매하도록 \u003cb class=\"key\">유행\u003c/b>이라는 개념을 이용해 멀쩡한 물건을 \u003cb class=\"key\">구식\u003c/b>으로 인식하게 만드는 전략을 설명합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"자, 오늘은 유행이라는 전략이 어떻게 소비를 유도하는지 알아봤습니다. 기업은 우리의 창의적인 한계를 시험하며 끊임없이 새로운 유행을 만들어내죠. 여러분도 이제 물건을 살 때 이것이 정말 필요한지, 아니면 마케팅의 마법에 걸린 건지 한 번 더 생각해보는 계기가 되었으면 좋겠네요. 오늘 수업은 여기서 마칠게요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
