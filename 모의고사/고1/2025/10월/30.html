@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 30번","audioDir":"30_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">30번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>Beyond Technology: Gen Z's Value-Driven Financial Decisions\u003c/h1>\u003ch2>기술을 넘어선 가치: Z세대의 가치 중심적 금융 결정\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Z세대는 금융 기관을 선택할 때 기술적 편리함뿐만 아니라 자신의 \u003cb class=\"key\">가치관\u003c/b>에 부합하는지, 그리고 운영 과정이 \u003cb class=\"key\">투명\u003c/b>하고 \u003cb class=\"key\">윤리적\u003c/b>인지를 최우선으로 고려한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Gen Z prioritizes personal values, transparency, and ethical practices over mere technology when making financial decisions.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 Z세대가 돈을 어디에 맡길지 결정할 때 무엇을 가장 중요하게 생각하는지에 대해 배워볼 거예요. 단순히 앱이 편하다고 선택할까요? 이 지문의 요약과 요지를 먼저 살펴보면, Z세대는 편리함보다 자신의 가치관과 투명성을 훨씬 더 중요하게 여긴다는 것을 알 수 있습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">Z세대는 소비를 단순한 물건 구매로 보지 않고 자신의 신념을 드러내는 \u003cb class=\"key\">미닝아웃\u003c/b>(Meaning Out)의 수단으로 삼습니다. 이들은 디지털 환경에 익숙하면서도 기업의 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">책임\u003c/b>(Corporate Social Responsibility, CSR)을 매우 엄격하게 따집니다. 마치 투명한 유리병 속의 내용물을 꼼꼼히 확인하고 구매하는 쇼핑객처럼, 금융 서비스에서도 \u003cb class=\"key\">책무성\u003c/b>(Accountability)과 정직함을 요구하죠. 따라서 기술력만 앞세우기보다 환경과 사회를 생각하는 \u003cb class=\"key\">ESG \u003c/b>\u003cb class=\"key\">경영\u003c/b>을 실천하는 기업이 이들의 선택을 받게 됩니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 전에 배경지식을 좀 쌓아볼까요? 요즘 Z세대는 소비를 통해 자신의 신념을 표현하는 Meaning Out, 즉 미닝아웃을 실천합니다. 기업이 사회적 책임을 다하는지, 즉 Corporate Social Responsibility를 잘 지키는지 아주 꼼꼼하게 따지죠. 마치 유리병 속을 들여다보듯 투명한 정보를 요구하는데, 이걸 Accountability, 즉 책무성이라고 부릅니다. 최근 유행하는 ESG 경영이 바로 이런 맥락과 닿아 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>금융 결정의 새로운 요인\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>편리함과 기술보다 더 중요한 것은 \u003cb class=\"key\">가치 \u003c/b>\u003cb class=\"key\">지향\u003c/b>적인 성향임을 밝힙니다. Z세대는 자신의 \u003cb class=\"key\">신념\u003c/b>과 일치하는 기관을 원합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>투명성의 중요성\u003csmall>근거 1 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>Z세대는 기업의 \u003cb class=\"key\">책무성\u003c/b>을 중시하며 정보의 \u003cb class=\"key\">투명한 \u003c/b>\u003cb class=\"key\">공개\u003c/b>를 요구합니다. 수수료나 데이터 처리 방식 같은 구체적인 정보 소통이 필수적입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>윤리적 은행 업무\u003csmall>근거 2 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>환경과 사회 정의를 고려한 \u003cb class=\"key\">윤리적 \u003c/b>\u003cb class=\"key\">함의\u003c/b>가 중요해집니다. \u003cb class=\"key\">지속 \u003c/b>\u003cb class=\"key\">가능한 \u003c/b>\u003cb class=\"key\">투자\u003c/b>와 사회적 책임을 다하는 은행이 이들의 관심을 끕니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 따라가 보며 Z세대의 마음을 사로잡는 법을 알아볼까요?","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 도입부가 시작됩니다. 편리함과 기술이 중요하긴 하지만, Z세대의 결정을 이끄는 유일한 요인이 아니라고 선을 그어요. 이들은 가치 지향적이라 자신의 개인적 신념과 가치에 부합하는 기관을 원한다고 말하죠.","hl":"f0"},{"n":5,"text":"세 번째 문장부터 여섯 번째 문장까지는 첫 번째 핵심인 투명성에 대해 이야기합니다. Z세대는 책임감이 부족한 대기업에 회의적이에요. 그래서 은행이 수수료나 데이터 처리 방식을 투명하게 전달해야만 그들을 지지한다고 설명합니다.","hl":"f1"},{"n":6,"text":"마지막 일곱 번째 문장부터 열 번째 문장까지는 두 번째 핵심인 윤리적 가치를 다룹니다. 환경 보호나 사회 정의, 지속 가능한 투자 같은 윤리적 함의를 따지는 거죠. 결국 사회적 책임을 다하고 환경에 전념하는 은행만이 Z세대의 관심을 끌 수 있다는 결론으로 마무리됩니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 기술적 요인 외에 다른 중요한 요인이 있음을 시사하며 \u003cb class=\"key\">주제\u003c/b>를 던집니다. 이후 투명성과 \u003cb class=\"key\">윤리성\u003c/b>이라는 두 가지 핵심 근거를 들어 Z세대의 특징을 구체적으로 \u003cb class=\"key\">설명\u003c/b>하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>While (1)\u003c/b>\u003cspan>대조를 통한 주제 강조\u003c/span>\u003cb>For example (6)\u003c/b>\u003cspan>구체적 사례 제시\u003c/span>\u003cb>Moreover (7)\u003c/b>\u003cspan>추가적인 근거 나열\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Gen Z\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">values-driven\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">personal beliefs and values\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">transparency\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ethical banking practices\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sustainable investing\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>단순 기술적 요인\u003c/th>\u003cth>가치 및 윤리적 요인\u003c/th>\u003c/tr>\u003ctr>\u003ctd>편리함, 기술 (Convenience, Tech)\u003c/td>\u003ctd>신념, 투명성 (Beliefs, Transparency)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 전형적인 주장과 근거의 구조를 가지고 있어요. 첫 문장에서 주제를 던지는 두괄식 패턴이죠. 기술이 전부가 아니라는 주장을 먼저 펼친 뒤에, 투명성과 윤리성이라는 구체적인 근거를 나열하고 있습니다.","hl":"ty"},{"n":8,"text":"글의 흐름을 잡아주는 신호어들을 보세요. 첫 문장의 While은 대조를 통해 주제를 강조하고 있고, 여섯 번째 문장의 For example은 투명성의 예시를 보여줍니다. 일곱 번째 문장의 Moreover는 윤리성이라는 추가적인 근거를 덧붙이는 역할을 하죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>convenience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>편리함\u003c/span>\u003c/div>\u003cdiv>\u003cb>crucial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>factor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>요인\u003c/span>\u003c/div>\u003cdiv>\u003cb>financial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>재정상의\u003c/span>\u003c/div>\u003cdiv>\u003cb>values-driven\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가치 지향적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>institution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기관\u003c/span>\u003c/div>\u003cdiv>\u003cb>match\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부합하다, 일치하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>transparency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>투명성\u003c/span>\u003c/div>\u003cdiv>\u003cb>vital\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매우 중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>skeptical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>회의적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>accountability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>책무성\u003c/span>\u003c/div>\u003cdiv>\u003cb>available\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이용 가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>support\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>communicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전달하다, 의사소통하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fee\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수수료\u003c/span>\u003c/div>\u003cdiv>\u003cb>terms and conditions\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>약관과 조항\u003c/span>\u003c/div>\u003cdiv>\u003cb>handle\u003c/b>\u003cem>동사\u003c/em>\u003cspan>처리하다, 다루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>more important than ever\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 어느 때보다 중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>social justice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회 정의\u003c/span>\u003c/div>\u003cdiv>\u003cb>implication\u003c/b>\u003cem>명사\u003c/em>\u003cspan>함의, 영향\u003c/span>\u003c/div>\u003cdiv>\u003cb>sustainable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지속 가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>fund\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자금을 대다\u003c/span>\u003c/div>\u003cdiv>\u003cb>practice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관행\u003c/span>\u003c/div>\u003cdiv>\u003cb>responsible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>책임 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>attract\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끌다, 유인하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"중요한 단어 몇 개만 짚어볼게요. values-driven은 가치 지향적이라는 뜻이고, transparency는 이 글의 핵심 키워드인 투명성입니다. skeptical은 의심이 많은, 회의적인이라는 뜻인데 Z세대의 태도를 잘 보여주는 단어죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">crucial\u003c/b>\u003cspan class=\"m\">중요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">vital\u003c/span>\u003cspan class=\"s\">critical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">insignificant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">transparency\u003c/b>\u003cspan class=\"m\">투명성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">openness\u003c/span>\u003cspan class=\"s\">clarity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">opacity\u003c/span>\u003cspan class=\"a\">obscurity\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">skeptical\u003c/b>\u003cspan class=\"m\">회의적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">doubtful\u003c/span>\u003cspan class=\"s\">suspicious\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trusting\u003c/span>\u003cspan class=\"a\">convinced\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ethical\u003c/b>\u003cspan class=\"m\">윤리적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">moral\u003c/span>\u003cspan class=\"s\">principled\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unethical\u003c/span>\u003cspan class=\"a\">immoral\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">attract\u003c/b>\u003cspan class=\"m\">끌다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">draw\u003c/span>\u003cspan class=\"s\">entice\u003c/span>\u003cspan class=\"s\">allure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repel\u003c/span>\u003cspan class=\"a\">deter\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어와 반의어도 챙겨볼까요? crucial은 필수적이라는 의미의 essential이나 vital로 바꿔 쓸 수 있고, 반대말은 사소하다는 뜻의 trivial입니다. attract는 관심을 끌다라는 뜻으로 draw나 entice와 비슷하고, 반대말은 물리치다라는 뜻의 repel이 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">편리함과 기술이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While\u003c/span> convenience and technology\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요하지만,\u003c/span>\u003cspan class=\"en\">are crucial,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 ~은 아니다\u003c/span>\u003cspan class=\"en\">they are not\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유일한 요인들은\u003c/span>\u003cspan class=\"en\">the only factors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Z세대의 재정상 결정을 이끄는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">driving\u003c/span> Gen Z's financial decisions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">편리함과 기술이 중요하지만, 그것들이 Z세대의 재정상 결정을 이끄는 유일한 요인들은 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Z세대가 금융 생활에서 기술적 편리함만 따지는 것이 아니라, 다른 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">요소\u003c/b>가 더 있다는 것을 암시하며 \u003cb class=\"key\">글의 \u003c/b>\u003cb class=\"key\">방향\u003c/b>을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사(양보/대조)\u003c/span> : While [주어] + [동사], [주어] + [동사] : \"~이지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사(후치 수식)\u003c/span> : factors [명사] + driving [현재분사구] : \"이끄는 요인들\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"While convenience and technology, 편리함과 기술이. are crucial, 중요하지만. they are not, 그것들이 ~은 아니다. the only factors, 유일한 요인들은. driving Gen Z's financial decisions, Z세대의 재정상 결정을 이끄는. 이 문장 전체를 해석하면, 편리함과 기술이 중요하지만, 그것들이 Z세대의 재정상 결정을 이끄는 유일한 요인들은 아니다.","hl":"m"},{"n":12,"text":"Z세대는 편리함과 기술을 중요하게 여기지만, 그게 전부는 아니라는 뜻이에요. 이 문장 뒤에는 그럼 진짜 중요한 게 뭔지에 대한 내용이 나오겠죠.","hl":"mn"},{"n":13,"text":"첫 번째로 While은 두 문장을 연결하면서 비록 뭐뭐이지만이라는 반전의 느낌을 줍니다. 두 번째로 driving은 현재분사로 쓰여서 앞에 있는 factors라는 명사를 꾸며주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 세대는 매우 가치 지향적이며, 거래하기를 원한다 기관과 개인의 신념과 가치에 부합하는\u003c/span>\u003cspan class=\"en\">This generation is incredibly values­driven, and they want to bank with institutions \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">match\u003c/span> their personal beliefs and values.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 세 대는 매우 가치 지향적이며, 개인의 신념과 가치에 부 합하는 기관과 거래하기를 원한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Z세대의 핵심 특징인 \u003cb class=\"key\">가치 \u003c/b>\u003cb class=\"key\">중심적\u003c/b> 성향을 설명하며, 자신의 \u003cb class=\"key\">철학\u003c/b>과 맞는 은행을 선택한다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : institutions [선행사] + that [관계사] + match [동사] : \"부합하는 기관\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">복합 형용사\u003c/span> : values [명사] + driven [과거분사] : \"가치 지향적인\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"This generation is, 이 세대는. incredibly values-driven, 매우 가치 지향적이며. and they want to bank, 거래하기를 원한다. with institutions, 기관과. that match their personal beliefs and values, 개인의 신념과 가치에 부합하는. 이 문장 전체를 해석하면, 이 세 대는 매우 가치 지향적이며, 개인의 신념과 가치에 부 합하는 기관과 거래하기를 원한다.","hl":"m"},{"n":15,"text":"Z세대는 돈만 보는 게 아니라 자신의 가치관과 맞는 곳과 거래하고 싶어 한다는 거예요. 그들의 소비가 일종의 신념 표현이라는 거죠.","hl":"mn"},{"n":16,"text":"첫 번째로 values-driven은 가치에 의해 움직인다는 의미의 형용사로 쓰였어요. 두 번째로 that match 부분은 앞에 있는 기관들이 어떤 곳인지 설명해 주는 관계대명사 마디입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">투명성이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Transparency\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 중요하다.\u003c/span>\u003cspan class=\"en\">is vital.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">투명성이 매우 중요 하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Z세대가 금융 기관을 선택할 때 가장 필수적으로 고려하는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">가치\u003c/b>인 \u003cb class=\"key\">투명성\u003c/b>을 단도직입적으로 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">추상명사 주어\u003c/span> : Transparency [주어] + is [be동사] : \"투명성은\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"Transparency, 투명성이. is vital, 매우 중요하다.. 이 문장 전체를 해석하면, 투명성이 매우 중요 하다.","hl":"m"},{"n":18,"text":"이 짧은 문장은 Z세대가 무엇을 가장 중요하게 보는지 한 번에 보여줘요. 바로 투명성입니다.","hl":"mn"},{"n":19,"text":"문장의 주어인 Transparency는 이 글의 핵심 소재예요. 단수 명사 주어라서 뒤에 동사로 is가 왔습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Z세대는 ~이다\u003c/span>\u003cspan class=\"en\">Gen Z is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 회의적이다\u003c/span>\u003cspan class=\"en\">skeptical of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대규모의 기업과 기관에\u003c/span>\u003cspan class=\"en\">large corporations and institutions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">책무성이 부족한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">lack \u003c/span>\u003cspan class=\"tgt\">accountability\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Z세대는 책무성이 부족한 대규모의 기업과 기관에 회의적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Z세대가 단순히 규모가 큰 기업을 선호하는 것이 아니라, 사회적 \u003cb class=\"key\">책임감\u003c/b>과 \u003cb class=\"key\">도덕성\u003c/b>을 중요하게 평가한다는 것을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사절\u003c/span> : [선행사] + [that (주격 관계대명사) + 동사] : \"책무성이 부족한\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Gen Z is, Z세대는 ~이다. skeptical of, ~에 회의적이다. large corporations and institutions, 대규모의 기업과 기관에. that lack accountability, 책무성이 부족한. 이 문장 전체를 해석하면, Z세대는 책무성이 부족한 대규모의 기업과 기관에 회의적이다.","hl":"m"},{"n":21,"text":"Z세대는 덩치만 큰 기업이라고 해서 무조건 신뢰하지 않아요. 기업이 자신의 행동에 대해 얼마나 책임지는지, 즉 책무성을 아주 중요하게 따진다는 뜻이죠.","hl":"mn"},{"n":22,"text":"여기서 중요한 문법은 주격 관계대명사입니다. that lack accountability 부분이 앞에 있는 기업과 기관을 꾸며주고 있어요. 여기서 that은 주어 역할을 대신하는 주격 관계대명사라고 부릅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 자라 왔다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">grown \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상에서\u003c/span>\u003cspan class=\"en\">in a world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정보를 자유롭게 이용할 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">information \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">freely \u003c/span>\u003cspan class=\"tgt\">available\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들은 완전한 투명성을 기대한다\u003c/span>\u003cspan class=\"en\">and they expect complete transparency\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 지지하는 브랜드로부터\u003c/span>\u003cspan class=\"en\">from the \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">brands \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">support\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 정보를 자유롭게 이용할 수 있는 세상에서 자라 왔고, 자신이 지지하는 브랜드로부터 완전한 투명성을 기대한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 디지털 환경에서 자란 세대의 특성상, 정보에 대한 접근성이 높아 기업에 \u003cb class=\"key\">솔직함\u003c/b>과 \u003cb class=\"key\">투명성\u003c/b>을 강력하게 요구한다는 배경 설명입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 (계속/완료)\u003c/span> : have + [과거분사(p.p.)] : \"자라 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사절\u003c/span> : [선행사(장소)] + [where + 완전한 문장] : \"정보를 자유롭게 이용할 수 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : [선행사] + [(which/that) + 주어 + 동사] : \"자신이 지지하는 브랜드\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"They have grown up, 그들은 자라 왔다. in a world, 세상에서. where information is freely available, 정보를 자유롭게 이용할 수 있는. and they expect complete transparency, 그리고 그들은 완전한 투명성을 기대한다. from the brands they support, 자신이 지지하는 브랜드로부터. 이 문장 전체를 해석하면, 그들은 정보를 자유롭게 이용할 수 있는 세상에서 자라 왔고, 자신이 지지하는 브랜드로부터 완전한 투명성을 기대한다.","hl":"m"},{"n":24,"text":"Z세대는 태어날 때부터 인터넷으로 정보를 쉽게 접하며 자랐어요. 그래서 기업이 무언가를 숨기는 것을 참지 못하고, 아주 사소한 부분까지 투명하게 공개하기를 원한답니다.","hl":"mn"},{"n":25,"text":"첫 번째로 have grown up은 과거부터 지금까지 계속 성장해 왔다는 현재완료 시제예요. 두 번째로 관계부사 where가 나오는데, 정보를 자유롭게 얻을 수 있는 세상이라는 의미로 world를 수식하죠. 세 번째로 brands 뒤에는 목적격 관계대명사 that이나 which가 생략되어 있다는 점도 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 은행은\u003c/span>\u003cspan class=\"en\">Banks, for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">투명하게 전달해야 한다\u003c/span>\u003cspan class=\"en\">must clearly communicate\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수수료, 약관, 조항을\u003c/span>\u003cspan class=\"en\">fees, terms, and conditions,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~뿐 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">as\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 고객의 데이터를 처리하는 방식\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">handle \u003c/span>\u003cspan class=\"tgt\">customers' \u003c/span>\u003cspan class=\"tgt\">data\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 은행은 그들이 고객의 데이터를 처리하는 방식뿐 아니라 수수료, 약관, 조항을 투명하게 전달해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 구체적인 사례로 은행을 들어, 금융 거래의 조건뿐만 아니라 \u003cb class=\"key\">개인정보 \u003c/b>\u003cb class=\"key\">보호\u003c/b>와 같은 민감한 사항도 \u003cb class=\"key\">명확하게 \u003c/b>\u003cb class=\"key\">소통\u003c/b>해야 함을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사\u003c/span> : B as well as A (A뿐만 아니라 B도) : \"~뿐 아니라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사(how) + 주어(they) + 동사(handle) : \"그들이 고객의 데이터를 처리하는 방식\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"Banks, for example, 예를 들어, 은행은. must clearly communicate, 투명하게 전달해야 한다. fees, terms, and conditions, 수수료, 약관, 조항을. as well as, ~뿐 아니라. how they handle customers' data, 그들이 고객의 데이터를 처리하는 방식. 이 문장 전체를 해석하면, 예를 들어, 은행은 그들이 고객의 데이터를 처리하는 방식뿐 아니라 수수료, 약관, 조항을 투명하게 전달해야 한다.","hl":"m"},{"n":27,"text":"은행이 신뢰를 얻으려면 돈과 관련된 수수료는 물론이고, 요즘 가장 예민한 문제인 개인 데이터를 어떻게 다루는지까지 전부 솔직하게 말해줘야 한다는 예시입니다.","hl":"mn"},{"n":28,"text":"첫 번째 포인트인 as well as는 뒤에 나오는 A뿐만 아니라 앞에 있는 B도라는 뜻으로 해석해요. 두 번째는 how they handle 부분인데, 의문문이 문장 안으로 쏙 들어간 간접의문문이에요. 그래서 의문사, 주어, 동사의 순서가 아주 중요합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가, \u003c/span>\u003cspan class=\"en\">Moreover,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">윤리적인 은행 업무는 \u003c/span>\u003cspan class=\"en\">ethical banking practices\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 중요하다 \u003c/span>\u003cspan class=\"en\">are \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 어느 때보다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">ever\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가, 윤리적인 은행 업무는 그 어느 때보다 중요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Z세대가 금융 기관을 선택할 때 중요하게 생각하는 새로운 기준인 \u003cb class=\"key\">윤리적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 제시하며, \u003cb class=\"key\">기업의 \u003c/b>\u003cb class=\"key\">책임\u003c/b>이 강조되고 있음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급을 이용한 최상급 의미 강조\u003c/span> : [more + 형용사/부사] + [than ever] : \"그 어느 때보다 더 중요한\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"Moreover, 게다가. ethical banking practices, 윤리적인 은행 업무는. are more important, 더 중요하다. than ever, 그 어느 때보다.. 이 문장 전체를 해석하면, 게다가, 윤리적인 은행 업무는 그 어느 때보다 중요하다.","hl":"m"},{"n":30,"text":"이번 문장에서는 Z세대가 금융 기관을 선택할 때 중요하게 생각하는 기준이 바뀌었다는 것을 알려주고 있어요. 단순히 편리함이 아니라 기업이 얼마나 도덕적인지를 따지는 윤리적 은행 업무가 강조되고 있죠.","hl":"mn"},{"n":31,"text":"여기서는 비교급 표현인 more important 뒤에 than ever가 붙어서 그 어느 때보다 더 중요하다는 최상급의 의미를 강조하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Z세대는 관심이 있다 \u003c/span>\u003cspan class=\"en\">Gen Z cares about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경, 사회 정의, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">environment, \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">justice, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 윤리적 함의에 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ethical \u003c/span>\u003cspan class=\"tgt\">implications\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 재정상 결정의.\u003c/span>\u003cspan class=\"en\">of their financial decisions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Z세대는 환경, 사회 정의, 그리고 자신의 재정상 결정의 윤리적 함의에 관심이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Z세대가 금융 결정을 내릴 때 단순히 이익만을 따지는 것이 아니라 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>와 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 깊이 고려한다는 구체적인 사례입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사구의 병렬 구조\u003c/span> : A, B, and C : \"환경, 사회 정의, 그리고 윤리적 함의\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Gen Z cares about, Z세대는 관심이 있다. the environment, social justice, 환경, 사회 정의. and the ethical implications, 그리고 윤리적 함의에. of their financial decisions, 자신의 재정상 결정의.. 이 문장 전체를 해석하면, Z세대는 환경, 사회 정의, 그리고 자신의 재정상 결정의 윤리적 함의에 관심이 있다.","hl":"m"},{"n":33,"text":"Z세대는 돈을 쓰는 것 자체를 하나의 목소리를 내는 행위로 봐요. 환경을 보호하고 사회 정의를 실현하는 것과 자신의 돈 관리가 연결되어 있다고 믿는 것이 핵심이에요.","hl":"mn"},{"n":34,"text":"첫 번째로 동사 cares about 뒤에 세 가지 명사구가 콤마와 and로 연결된 병렬 구조를 확인해야 해요. 두 번째로 ethical implications of their financial decisions라는 표현에서 전치사 of가 뒤에서 앞을 수식하며 재정적 결정의 함의라는 뜻을 완성하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 관심이 있다 \u003c/span>\u003cspan class=\"en\">They are interested in\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지속 가능한 투자, \u003c/span>\u003cspan class=\"en\">sustainable investing,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기업을 지지하는 것, \u003c/span>\u003cspan class=\"en\">supporting businesses\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 가치에 부합하는, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">match\u003c/span> their values,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 확실히 하는 것에 \u003c/span>\u003cspan class=\"en\">and ensuring\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 돈이 사용되고 있지 않음을 \u003c/span>\u003cspan class=\"en\">that their money \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유해한 관행에 자금을 대는 데.\u003c/span>\u003cspan class=\"en\">to fund harmful practices.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 지속 가능한 투자, 자신의 가치에 부합하는 기업을 지지하는 것, 그리고 자신의 돈 이 유해한 관행에 자금을 대는 데 사용되고 있지 않음을 확실히 하는 것에 관심이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Z세대의 가치 중심적 투자 방식을 \u003cb class=\"key\">지속 \u003c/b>\u003cb class=\"key\">가능한 \u003c/b>\u003cb class=\"key\">투자\u003c/b>와 \u003cb class=\"key\">신념 \u003c/b>\u003cb class=\"key\">일치\u003c/b>라는 키워드로 상세히 설명하며, 이들의 구체적인 행동 양식을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : businesses [선행사] + that [주격 관계대명사] + match [동사] : \"~에 부합하는 (기업들)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행 수동태\u003c/span> : be + being + p.p. (과거분사) : \"사용되고 있지 않은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동명사의 병렬 구조\u003c/span> : in [전치사] + [V-ing(1), V-ing(2), and V-ing(3)] : \"투자하는 것, 지지하는 것, 그리고 확실히 하는 것\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"They are interested in, 그들은 관심이 있다. sustainable investing, 지속 가능한 투자. supporting businesses, 기업을 지지하는 것. that match their values, 자신의 가치에 부합하는. and ensuring, 그리고 확실히 하는 것에. that their money is not being used, 자신의 돈이 사용되고 있지 않음을. to fund harmful practices, 유해한 관행에 자금을 대는 데.. 이 문장 전체를 해석하면, 그들은 지속 가능한 투자, 자신의 가치에 부합하는 기업을 지지하는 것, 그리고 자신의 돈 이 유해한 관행에 자금을 대는 데 사용되고 있지 않음을 확실히 하는 것에 관심이 있다.","hl":"m"},{"n":36,"text":"이 문장은 Z세대가 실제로 어떤 행동을 하는지 아주 자세하게 보여줘요. 자신의 돈이 나쁜 곳에 쓰이지 않도록 감시하고 자신의 가치관과 맞는 곳에 투자하려는 의지를 잘 나타내고 있죠.","hl":"mn"},{"n":37,"text":"첫 번째로 전치사 in의 목적어로 동명사인 investing, supporting, ensuring 세 가지가 병렬로 연결되어 있어요. 두 번째로 businesses를 꾸며주는 that match는 주격 관계대명사절로 선행사가 복수라서 동사 match에 s를 붙이지 않았어요. 세 번째로 is not being used 부분은 현재진행 수동태로 지금 이 순간에도 돈이 쓰이지 않고 있다는 진행의 의미를 강조하고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">은행은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Banks \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적으로 책임 있는 투자 기회를 제공하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">offer\u003c/span> socially responsible investment opportunities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경적 지속 가능성에 전념하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">committed \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> environmental sustainability\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Z세대의 관심을 끌 것이다.\u003c/span>\u003cspan class=\"en\">will attract Gen Z's attention.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사회적으로 책임 있는 투자 기회를 제공하고 환경적 지속 가능 성에 전념하는 은행은 Z세대의 관심을 끌 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Z세대가 은행을 선택할 때 자신의 신념을 실천하는 \u003cb class=\"key\">가치 \u003c/b>\u003cb class=\"key\">소비\u003c/b>를 중시한다는 점을 보여줍니다. 단순히 자산을 관리하는 곳을 넘어 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">책임\u003c/b>과 환경을 생각하는 기관에 매력을 느낀다는 결론입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 (수 일치)\u003c/span> : 선행사(Banks) + that [관계대명사] + offer [동사] : \"제공하는 은행\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조 및 수동태 관용 표현\u003c/span> : that [offer (동사1)] + and + [are committed to (동사2)] : \"그리고 ~에 전념하는\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"Banks, 은행은. that offer socially responsible investment opportunities, 사회적으로 책임 있는 투자 기회를 제공하고. and are committed to environmental sustainability, 환경적 지속 가능성에 전념하는. will attract Gen Z's attention, Z세대의 관심을 끌 것이다.. 이 문장 전체를 해석하면, 사회적으로 책임 있는 투자 기회를 제공하고 환경적 지속 가능 성에 전념하는 은행은 Z세대의 관심을 끌 것이다.","hl":"m"},{"n":39,"text":"이 문장은 Z세대가 어떤 은행에 마음을 여는지 구체적인 조건을 설명하며 글을 마무리하고 있어요. 그들은 단순히 이득을 주는 곳이 아니라 사회적 책임과 환경 보호라는 가치를 실천하는 곳을 선택한다는 결론을 내리고 있죠.","hl":"mn"},{"n":40,"text":"첫 번째 포인트는 주격 관계대명사 that입니다. 선행사인 Banks가 복수이기 때문에 뒤에 오는 동사 offer에 s를 붙이지 않는 수 일치에 꼭 주의해야 해요. 두 번째는 접속사 and를 중심으로 offer와 are가 연결되는 병렬 구조예요. 은행이 제공도 하고 전념도 한다는 두 가지 특징을 한꺼번에 설명하고 있네요. 마지막으로 be committed to는 어디에 헌신하거나 전념한다는 뜻으로 아주 자주 쓰이는 표현이니까 통째로 외워두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Z세대는 금융 결정에서 기술적 편리함보다 개인의 \u003cb class=\"key\">신념과 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 더 중시한다.\u003c/li>\u003cli>이들은 기업의 \u003cb class=\"key\">투명성\u003c/b>과 책무성을 요구하며 모호한 태도를 취하는 거대 기관에 회의적이다.\u003c/li>\u003cli>수수료, 약관, 데이터 처리 방식 등에 대한 명확한 \u003cb class=\"key\">의사소통\u003c/b>이 신뢰의 핵심이다.\u003c/li>\u003cli>환경, 사회 정의 등 \u003cb class=\"key\">윤리적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 실천하고 지속 가능한 투자를 제안하는 은행이 선택받는다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Gen Z prioritizes personal values, transparency, and ethical practices over mere technology when making financial decisions.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Z세대는 금융 기관을 선택할 때 기술적 편리함뿐만 아니라 자신의 \u003cb class=\"key\">가치관\u003c/b>에 부합하는지, 그리고 운영 과정이 \u003cb class=\"key\">투명\u003c/b>하고 \u003cb class=\"key\">윤리적\u003c/b>인지를 최우선으로 고려한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":41,"text":"자, 정리해봅시다. Z세대에게 선택받고 싶은 은행이라면 기술력은 기본이고, 투명한 운영과 윤리적인 태도를 보여주어야 합니다. 이 지문은 현대 금융 시장의 변화를 잘 보여주는 아주 좋은 글이었어요. 오늘 배운 투명성과 가치 지향이라는 키워드 꼭 기억하세요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
