lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 21번","audioDir":"21_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">21번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>The Paradox of Urban Green Space: When Improvement Leads to Displacement\u003c/h1>\u003ch2>도시 녹색 공간의 역설: 환경 개선과 주민 퇴거\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>낙후 지역의 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">재생\u003c/b> 프로젝트가 주거비 상승을 유발하여, 정작 혜택을 받아야 할 \u003cb class=\"key\">저소득층\u003c/b> 주민들이 쫓겨나게 되는 \u003cb class=\"key\">녹색 \u003c/b>\u003cb class=\"key\">공간의 \u003c/b>\u003cb class=\"key\">역설\u003c/b>을 설명하는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Environmental improvements in low-income neighborhoods can paradoxically lead to the displacement of original residents by driving up housing costs.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 도시를 더 살기 좋게 만들려는 노력이 예상치 못한 결과를 가져오는 현상에 대해 배워볼 거예요. 바로 도시 녹색 공간의 역설이라는 주제인데요. 환경 개선이 왜 가난한 주민들에게는 오히려 독이 될 수 있는지, 그 논리적인 과정을 함께 살펴보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">재생(Urban \u003c/b>\u003cb class=\"key\">Regeneration)\u003c/b>이란 쇠퇴한 도시 지역에 새로운 기능을 도입해 활성화하는 사업입니다. 하지만 최근 학계에서는 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">젠트리피케이션(Environmental \u003c/b>\u003cb class=\"key\">Gentrification)\u003c/b>이라는 현상을 경고하고 있습니다. 이는 동네에 공원이 생기고 깨끗해지면 땅값이 올라 원래 살던 가난한 사람들이 밀려나는 현상입니다. 마치 \u003cb class=\"key\">낡은 \u003c/b>\u003cb class=\"key\">골목에 \u003c/b>\u003cb class=\"key\">예쁜 \u003c/b>\u003cb class=\"key\">카페\u003c/b>들이 들어서면서 월세가 올라 원래 있던 작은 가게들이 떠나야 하는 상황과 비슷합니다. 이 글은 그중에서도 공원 조성과 같은 \u003cb class=\"key\">녹색 \u003c/b>\u003cb class=\"key\">기반 \u003c/b>\u003cb class=\"key\">시설(Green \u003c/b>\u003cb class=\"key\">Infrastructure)\u003c/b>이 가져오는 역설적 결과를 다룹니다.\u003c/div>","segs":[{"n":2,"text":"혹시 젠트리피케이션이라는 말을 들어봤나요? 낙후된 동네에 예쁜 가게들이 들어오면서 유명해지면, 갑자기 땅값이 올라서 원래 그곳을 지키던 상인들이 쫓겨나는 현상이죠. 오늘 지문은 이 현상이 환경 개선과 결합된 환경적 젠트리피케이션을 다루고 있어요. 공원이 생기고 나무가 많아지면 분명 좋은 일인데, 이게 어떻게 저소득층 주민들에게 위협이 되는지 배경지식을 가지고 접근해 봅시다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도시 재생의 목표\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>현재 낙후된 지역에서 진행되는 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">재생\u003c/b>은 주민 복지와 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">불평등\u003c/b> 해결을 목표로 추진되고 있음을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>녹색 공간의 역설 등장\u003csmall>전환 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>하지만 이런 개선이 오히려 \u003cb class=\"key\">녹색 \u003c/b>\u003cb class=\"key\">공간의 \u003c/b>\u003cb class=\"key\">역설\u003c/b>을 만드는데, 녹지 조성이 지역의 \u003cb class=\"key\">매력도\u003c/b>를 높여 수요를 증가시키기 때문입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>주거비 상승과 배제\u003csmall>결과 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>그 결과 주거비가 올라 가난한 주민들은 임대료를 감당하지 못하고, 결국 혜택 대상이었던 이들이 동네에서 \u003cb class=\"key\">퇴거\u003c/b>당하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>빈곤과 열악함의 악순환\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>결국 쫓겨난 주민들은 다시 녹색 시설이 부족한 또 다른 \u003cb class=\"key\">낙후된 \u003c/b>\u003cb class=\"key\">지역\u003c/b>으로 옮겨가게 되어 \u003cb class=\"key\">불평등\u003c/b>이 반복됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 도시 재생의 선한 의도로 시작해서, 경제적 원리로 인한 씁쓸한 결말로 이어지는 흐름을 보여줍니다.","hl":null},{"n":4,"text":"첫 번째 문장에서는 도시 재생 프로젝트의 원래 목적을 말합니다. 낙후된 지역 주민들의 복지를 높이고 환경적 불평등을 해결하겠다는 아주 긍정적인 목표를 가지고 시작되었다는 점을 짚어주고 있네요.","hl":"f0"},{"n":5,"text":"두 번째와 세 번째 문장에서는 분위기가 반전됩니다. However라는 단어와 함께 녹색 공간의 역설이 등장하죠. 새로운 녹지가 조성되면 동네가 너무 예뻐지고 매력적으로 변해서 사람들이 살고 싶어 하는 탐나는 곳이 되어 버립니다.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장은 그에 따른 부정적 결과를 보여줍니다. 대조적으로 주거비는 치솟게 되고, 결국 임대료를 낼 수 없는 가난한 주민들은 그 좋은 생태계 서비스를 누리기도 전에 동네에서 쫓겨나게 되는 배제 현상이 일어납니다.","hl":"f2"},{"n":7,"text":"마지막 여섯 번째 문장은 안타까운 결론입니다. 결국 쫓겨난 주민들은 다시 예전처럼 환경 시설이 부족하고 낙후된 비슷한 지역으로 옮겨갈 수밖에 없게 되며, 불평등이 반복된다는 것을 보여줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과 및 대조\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 도시 재생의 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">의도\u003c/b>를 언급한 뒤, 두 번째 문장에서 \u003cb class=\"key\">However\u003c/b>를 통해 글의 핵심인 \u003cb class=\"key\">역설적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 제시합니다. 이후 환경 개선이 어떻게 \u003cb class=\"key\">주거비 \u003c/b>\u003cb class=\"key\">상승\u003c/b>과 \u003cb class=\"key\">주민 \u003c/b>\u003cb class=\"key\">퇴거\u003c/b>라는 부정적 결과로 이어지는지 인과 관계로 설명합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (2)\u003c/b>\u003cspan>전환: 앞의 긍정적 목표와 대조되는 부작용 소개\u003c/span>\u003cb>By contrast (4)\u003c/b>\u003cspan>대조: 지역의 매력 상승과 상반되는 주민의 경제적 고충\u003c/span>\u003cb>This results in (5)\u003c/b>\u003cspan>인과: 주거비 상승으로 인한 최종 결과(배제/퇴거) 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">urban regeneration projects\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">environmental improvements\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">new, high-quality green spaces\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ecosystem services\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">green infrastructure\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>의도된 수혜자\u003c/th>\u003cth>실제 결과\u003c/th>\u003c/tr>\u003ctr>\u003ctd>지역 거주민의 복지 향상\u003c/td>\u003ctd>주거비 상승으로 인한 임대료 부담\u003c/td>\u003c/tr>\u003ctr>\u003ctd>생태계 서비스 혜택 향유\u003c/td>\u003ctd>지역에서의 배제 및 퇴거\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 인과 관계와 대조의 구조를 가지고 있습니다. 글 중간에 주제문이 위치한 중괄식 구조로 볼 수 있는데, 두 번째 문장에서 제시된 역설이라는 개념이 전체 내용을 관통하고 있습니다.","hl":"ty"},{"n":9,"text":"문장 연결 고리를 잘 보세요. 두 번째 문장의 However는 앞의 긍정적 의도를 뒤집고, 네 번째 문장의 By contrast는 환경적 장점과 경제적 고통을 대비시킵니다. 마지막으로 다섯 번째 문장의 This results in은 주거비 상승이 가져온 최종적인 비극을 인과 관계로 연결해 주고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>currently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>현재\u003c/span>\u003c/div>\u003cdiv>\u003cb>urban\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>도시의\u003c/span>\u003c/div>\u003cdiv>\u003cb>regeneration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재생\u003c/span>\u003c/div>\u003cdiv>\u003cb>degraded\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>낙후된, 퇴보한\u003c/span>\u003c/div>\u003cdiv>\u003cb>promote\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추진하다, 촉진하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wellbeing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>복지, 안녕\u003c/span>\u003c/div>\u003cdiv>\u003cb>resident\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거주자\u003c/span>\u003c/div>\u003cdiv>\u003cb>solve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environmental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>환경의\u003c/span>\u003c/div>\u003cdiv>\u003cb>injustice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불평등, 부당함\u003c/span>\u003c/div>\u003cdiv>\u003cb>ethnic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>민족의, 인종의\u003c/span>\u003c/div>\u003cdiv>\u003cb>household\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가구, 세대\u003c/span>\u003c/div>\u003cdiv>\u003cb>paradox\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역설\u003c/span>\u003c/div>\u003cdiv>\u003cb>creation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조성, 창조\u003c/span>\u003c/div>\u003cdiv>\u003cb>attractiveness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>매력\u003c/span>\u003c/div>\u003cdiv>\u003cb>desirable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>탐나는, 바람직한\u003c/span>\u003c/div>\u003cdiv>\u003cb>by contrast\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>대조적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>afford\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~할 형편이 되다, 지불할 여유가 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>임대료\u003c/span>\u003c/div>\u003cdiv>\u003cb>exclusion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배제\u003c/span>\u003c/div>\u003cdiv>\u003cb>displacement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>퇴거, 이주\u003c/span>\u003c/div>\u003cdiv>\u003cb>intend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>benefit from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로부터 혜택을 얻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ecosystem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생태계\u003c/span>\u003c/div>\u003cdiv>\u003cb>infrastructure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회 기반 시설\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 살펴볼까요? degraded는 낙후된이라는 뜻으로 환경이 열악한 상태를 말합니다. paradox는 역설인데, 논리적으로 모순되는 상황을 뜻하죠. 마지막으로 displacement는 퇴거 혹은 강제 이주를 의미하는 아주 핵심적인 단어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">degraded\u003c/b>\u003cspan class=\"m\">낙후된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deteriorated\u003c/span>\u003cspan class=\"s\">ruined\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">improved\u003c/span>\u003cspan class=\"a\">refined\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">desirable\u003c/b>\u003cspan class=\"m\">탐나는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">attractive\u003c/span>\u003cspan class=\"s\">appealing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unattractive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">afford\u003c/b>\u003cspan class=\"m\">~할 형편이 되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">manage\u003c/span>\u003cspan class=\"s\">bear\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exclusion\u003c/b>\u003cspan class=\"m\">배제\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">elimination\u003c/span>\u003cspan class=\"s\">rejection\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inclusion\u003c/span>\u003cspan class=\"a\">incorporation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">displacement\u003c/b>\u003cspan class=\"m\">퇴거\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eviction\u003c/span>\u003cspan class=\"s\">removal\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 체크해 보세요. afford는 감당하다라는 뜻으로 manage와 비슷하게 쓰였고, exclusion은 배제라는 뜻으로 inclusion과 반대되는 개념입니다. degraded의 반의어로는 개선된 상태를 뜻하는 improved나 refined를 기억하면 좋겠네요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현재, \u003c/span>\u003cspan class=\"en\">Currently,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도시 재생 프로젝트는 \u003c/span>\u003cspan class=\"en\">urban regeneration projects\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낙후된 지역에서 \u003c/span>\u003cspan class=\"en\">in degraded areas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">추진되어 왔다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">promoted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거주자들의 복지를 향상시키고 \u003c/span>\u003cspan class=\"en\">as improving the wellbeing of residents\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경적 불평등 문제를 해결하는 것으로서.\u003c/span>\u003cspan class=\"en\">and solving environmental injustice problems.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">현재, 낙후된 지역에서 도시 재생 프로젝트는 거주자들의 복지를 향상시키고 환경적 불평등 문제를 해결하는 것으로서 추진되어 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 낙후된 지역을 다시 살리는 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">재생\u003c/b> 사업이 주민의 삶의 질을 높이고 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">불평등\u003c/b>을 해결하려는 긍정적인 목적으로 시행되고 있음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 수동태\u003c/span> : have/has + been + p.p. : \"추진되어 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동명사의 병렬 구조\u003c/span> : as + V-ing(1) + and + V-ing(2) : \"향상시키고 해결하는 것으로서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Currently, 현재. urban regeneration projects, 도시 재생 프로젝트는. in degraded areas, 낙후된 지역에서. have been promoted, 추진되어 왔다. as improving the wellbeing of residents, 거주자들의 복지를 향상시키고. and solving environmental injustice problems, 환경적 불평등 문제를 해결하는 것으로서.. 이 문장 전체를 해석하면, 현재, 낙후된 지역에서 도시 재생 프로젝트는 거주자들의 복지를 향상시키고 환경적 불평등 문제를 해결하는 것으로서 추진되어 왔다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 좋은 의도로 시작되는 도시 재생 사업에 대해 말하고 있어요. 낙후된 곳의 환경을 고쳐서 주민들이 더 행복하게 살게 하고 환경적 불평등도 없애려는 거죠.","hl":"mn"},{"n":14,"text":"여기서 첫 번째 포인트인 have been promoted는 과거부터 지금까지 사업이 추진되고 있다는 의미를 담은 현재완료 수동태예요. 두 번째로 as 뒤에 나오는 improving과 solving은 병렬 구조를 이루며 도시 재생의 두 가지 목적을 설명하고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,  그러한 환경 개선은  소수 민족 공동체들 및/또는 저소득층 가구에서  만들 수 있다  도시 녹색 공간의 역설을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However\u003c/span>, such environmental improvements in ethnic communities and/or low­income households \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">create\u003c/span> an urban green space paradox.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 소수 민족 공동체들 및/또는 저소득층 가구에서 그러한 환경 개선은 도시 녹색 공간의 역설을 만들 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 긍정적 의도와 달리, 특정 지역에서는 환경 개선이 오히려 \u003cb class=\"key\">부작용\u003c/b>을 낳을 수 있다는 \u003cb class=\"key\">반전\u003c/b>을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">역접의 연결사\u003c/span> : However, [주어] + [동사] : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사\u003c/span> : can + [동사원형] : \"만들 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"However, 하지만. such environmental improvements, 그러한 환경 개선은. in ethnic communities and/or low-income households, 소수 민족 공동체들 및/또는 저소득층 가구에서. can create, 만들 수 있다. an urban green space paradox, 도시 녹색 공간의 역설을.. 이 문장 전체를 해석하면, 하지만, 소수 민족 공동체들 및/또는 저소득층 가구에서 그러한 환경 개선은 도시 녹색 공간의 역설을 만들 수 있다.","hl":"m"},{"n":16,"text":"하지만 두 번째 문장에서 분위기가 바뀌죠. 좋은 의도의 환경 개선이 소외 계층에게는 오히려 역설적인 문제를 일으킬 수 있다는 점을 경고하고 있어요.","hl":"mn"},{"n":17,"text":"첫 번째 포인트인 However는 내용의 흐름을 바꾸는 반전의 신호탄으로 쓰였어요. 두 번째인 can create는 이러한 역설적인 문제가 실제로 생길 수도 있다는 가능성을 말해줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조성은  새로운 양질의 녹색 공간의  매력을 증가시킬 수 있어  이 지역을 더 탐나게 만든다.\u003c/span>\u003cspan class=\"en\">The creation of new, high­quality green spaces can increase attractiveness, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">making\u003c/span> these neighbourhood \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">desirable\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">새로운 양질의 녹색 공간의 조성은 매력을 증가시킬 수 있어 이 지역을 더 탐나게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 녹지가 생기면 동네가 예뻐져서 외부 사람들에게도 \u003cb class=\"key\">매력적인 \u003c/b>\u003cb class=\"key\">곳\u003c/b>이 된다는, 역설이 발생하는 \u003cb class=\"key\">첫 \u003c/b>\u003cb class=\"key\">단계\u003c/b>를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 결과 구문\u003c/span> : [주절] , [V-ing] : \"만든다(그 결과 ~하게 만들다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 문장의 목적격 보어\u003c/span> : make + [목적어] + [형용사 비교급] : \"더 탐나게\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The creation of, 조성은. new, high-quality green spaces, 새로운 양질의 녹색 공간의. can increase attractiveness, 매력을 증가시킬 수 있어. making these neighbourhood more desirable, 이 지역을 더 탐나게 만든다.. 이 문장 전체를 해석하면, 새로운 양질의 녹색 공간의 조성은 매력을 증가시킬 수 있어 이 지역을 더 탐나게 만든다.","hl":"m"},{"n":19,"text":"세 번째 문장에서는 역설이 시작되는 과정을 보여줘요. 좋은 공원이 생기면 동네가 예뻐지고 매력적인 곳으로 변해서 누구나 살고 싶어 하는 곳이 된다는 뜻이에요.","hl":"mn"},{"n":20,"text":"첫 번째 포인트인 making은 앞 문장의 결과로 일어난 일을 설명하는 결과의 분사구문이에요. 두 번째 more desirable은 동사 make와 함께 쓰여서 이 지역의 상태가 어떻게 변했는지를 설명해 주는 형용사 보어 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대조적으로, \u003c/span>\u003cspan class=\"en\">By contrast,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주거비가 오를 수 있고, \u003c/span>\u003cspan class=\"en\">the cost of housing \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">rise\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거주자들은 임대료를 지불할 여유가 없을지도 모른다.\u003c/span>\u003cspan class=\"en\">and residents may not \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> afford the rent.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대조적으로, 주거비가 오를 수 있고, 거주자들은 임대료를 지불할 여유가 없을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 녹색 공간 조성이라는 긍정적인 변화 이면에 숨겨진 \u003cb class=\"key\">주거비 \u003c/b>\u003cb class=\"key\">상승\u003c/b>이라는 부작용을 제시합니다. 살기 좋아진 환경 때문에 집값이 오르면서 기존 주민들이 겪게 되는 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">압박\u003c/b>을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 + 동사원형\u003c/span> : can [조동사] + rise [동사원형] : \"오를 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">능력/가능의 표현\u003c/span> : be able to + afford [동사원형] : \"지불할 여유가 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"By contrast, 대조적으로. the cost of housing can rise, 주거비가 오를 수 있고. and residents may not be able to afford the rent, 거주자들은 임대료를 지불할 여유가 없을지도 모른다.. 이 문장 전체를 해석하면, 대조적으로, 주거비가 오를 수 있고, 거주자들은 임대료를 지불할 여유가 없을지도 모른다.","hl":"m"},{"n":22,"text":"마을이 좋아지는 줄 알았는데, 오히려 대조적으로 주거비가 비싸지는 문제가 생긴다는 내용이에요. 환경 개선이 불러온 주거비 상승이라는 경제적 역설을 보여줍니다.","hl":"mn"},{"n":23,"text":"첫 번째로 can rise는 조동사 뒤에 동사원형을 써서 주거비가 상승할 수도 있다는 가능성을 말해요. 두 번째로 be able to는 조동사 may와 함께 쓰여서 임대료를 감당할 능력이 안 될 수도 있다는 추측을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 야기하는데, \u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">results \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배제 혹은 퇴거를, \u003c/span>\u003cspan class=\"en\">the exclusion or displacement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가난한 지역 거주자들의, \u003c/span>\u003cspan class=\"en\">of the poor neighbourhood's residents,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 혜택을 얻도록 의도되어 있었다, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">intended \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> benefit from\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생태계 서비스로부터, \u003c/span>\u003cspan class=\"en\">the ecosystem services\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 녹색 공간에 의해 제공되는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">provided \u003c/span>\u003cspan class=\"tgt\">by\u003c/span> the new green space.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 가난한 지역 거주자들의 배제 혹은 퇴거를 야기하는데, 그들은 새로운 녹색 공간에 의해 제공되는 생태계 서비스로부터 혜택을 얻도록 의도되어 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 원래 혜택을 받아야 할 가난한 주민들이 정작 \u003cb class=\"key\">배제\u003c/b>되거나 \u003cb class=\"key\">쫓겨나는\u003c/b> 역설적인 상황을 강조합니다. 정책의 \u003cb class=\"key\">의도\u003c/b>와 실제 \u003cb class=\"key\">결과\u003c/b>가 상충하는 비극적인 상황입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">인과관계 동사구\u003c/span> : This [주어] + results in [동사구] + 명사 [목적어/결과] : \"~을 야기하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법과 수동태\u003c/span> : residents [선행사] + , who [관계대명사] + were intended [수동태] : \"그들은 ~하도록 의도되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사구\u003c/span> : services [명사] + provided [과거분사] + by ~ : \"~에 의해 제공되는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"This results in, 이는 야기하는데. the exclusion or displacement, 배제 혹은 퇴거를. of the poor neighbourhood's residents, 가난한 지역 거주자들의. who were intended to benefit from, 그들은 혜택을 얻도록 의도되어 있었다. the ecosystem services, 생태계 서비스로부터. provided by the new green space, 새로운 녹색 공간에 의해 제공되는.. 이 문장 전체를 해석하면, 이는 가난한 지역 거주자들의 배제 혹은 퇴거를 야기하는데, 그들은 새로운 녹색 공간에 의해 제공되는 생태계 서비스로부터 혜택을 얻도록 의도되어 있었다.","hl":"m"},{"n":25,"text":"혜택을 받아야 할 가난한 주민들이 오히려 쫓겨나게 되는 주객전도의 상황을 설명하고 있어요. 원래 의도는 좋았지만 실제로는 배제라는 슬픈 결과가 나왔다는 거죠.","hl":"mn"},{"n":26,"text":"첫 번째로 results in은 뒤에 결과가 오는 표현으로 문장 전체의 결론을 이끌어요. 두 번째로 쉼표 다음에 나온 who는 관계대명사의 계속적 용법으로 그 주민들에 대한 설명을 덧붙여 줍니다. 세 번째로 provided는 과거분사로 쓰여서 앞에 있는 서비스를 꾸며주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국, 그 거주자들은, \u003c/span>\u003cspan class=\"en\">In turn, the residents\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거주할 형편이 될 수 있을지도 모른다, \u003c/span>\u003cspan class=\"en\">may only be able to afford to live\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비슷한 낙후된 지역에나, \u003c/span>\u003cspan class=\"en\">in a similar degraded neighbourhood\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 떠났던 곳과, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">left\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">녹색 사회 기반 시설에 접근성이 낮은 채로.\u003c/span>\u003cspan class=\"en\">with low access to green infrastructure.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결국, 그 거주자들은 녹색 사회 기반 시설에 접근성이 낮은 채로, 그들이 떠났던 곳과 비슷한 낙후된 지역에나 거주할 형편이 될 수 있을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 밀려난 주민들이 다시 열악한 환경으로 돌아가는 \u003cb class=\"key\">악순환\u003c/b>을 묘사합니다. 녹색 시설에 대한 \u003cb class=\"key\">접근성 \u003c/b>\u003cb class=\"key\">불평등\u003c/b>이 해소되지 않고 지속됨을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : the one [명사] + (which/that) + they left [주어+동사] : \"그들이 떠났던 곳과 (비슷한)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정대명사\u003c/span> : the one [대명사] = the neighbourhood : \"그곳(지역)\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"In turn, the residents, 결국, 그 거주자들은. may only be able to afford to live, 거주할 형편이 될 수 있을지도 모른다. in a similar degraded neighbourhood, 비슷한 낙후된 지역에나. to the one they left, 그들이 떠났던 곳과. with low access to green infrastructure, 녹색 사회 기반 시설에 접근성이 낮은 채로.. 이 문장 전체를 해석하면, 결국, 그 거주자들은 녹색 사회 기반 시설에 접근성이 낮은 채로, 그들이 떠났던 곳과 비슷한 낙후된 지역에나 거주할 형편이 될 수 있을지도 모른다.","hl":"m"},{"n":28,"text":"쫓겨난 주민들이 결국 다시 예전처럼 환경이 좋지 않은 곳으로 가게 된다는 악순환을 보여줍니다. 결과적으로 녹색 시설의 혜택으로부터 영영 멀어지게 되는 상황이죠.","hl":"mn"},{"n":29,"text":"첫 번째로 the one은 앞에 나온 단어인 neighbourhood를 다시 가리키는 부정대명사예요. 두 번째로 the one 뒤에는 목적격 관계대명사가 생략되어 있어서 그들이 떠났던 곳이라는 의미로 해석하면 됩니다. 세 번째로 with는 뒤에 명사를 데려와서 어떠한 상태를 가진 채로라는 의미를 더해줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">재생\u003c/b> 프로젝트는 원래 거주자의 복지 증진과 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">불평등\u003c/b> 해소를 목적으로 시작됩니다.\u003c/li>\u003cli>하지만 환경이 개선되면 해당 지역의 \u003cb class=\"key\">매력도\u003c/b>가 높아져 주거 비용이 상승하는 \u003cb class=\"key\">녹색 \u003c/b>\u003cb class=\"key\">공간의 \u003c/b>\u003cb class=\"key\">역설\u003c/b>이 발생합니다.\u003c/li>\u003cli>이로 인해 정작 혜택을 입어야 할 가난한 주민들이 임대료를 감당하지 못하고 지역에서 \u003cb class=\"key\">퇴거\u003c/b>당하게 됩니다.\u003c/li>\u003cli>결국 쫓겨난 이들은 환경이 열악한 또 다른 \u003cb class=\"key\">낙후된 \u003c/b>\u003cb class=\"key\">지역\u003c/b>으로 몰리며 불평등이 고착화되는 결과를 낳습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Environmental improvements in low-income neighborhoods can paradoxically lead to the displacement of original residents by driving up housing costs.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">낙후 지역의 \u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">재생\u003c/b> 프로젝트가 주거비 상승을 유발하여, 정작 혜택을 받아야 할 \u003cb class=\"key\">저소득층\u003c/b> 주민들이 쫓겨나게 되는 \u003cb class=\"key\">녹색 \u003c/b>\u003cb class=\"key\">공간의 \u003c/b>\u003cb class=\"key\">역설\u003c/b>을 설명하는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"자, 오늘은 환경 개선이 가져오는 경제적 역설에 대해 공부했습니다. 도시 재생이 단순히 나무를 심는 것에 그치지 않고, 그곳에 사는 사람들을 보호하는 정책이 왜 필요한지 생각해보게 하는 지문이었어요. 복습할 때 이 인과 관계를 꼭 머릿속에 그려보세요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
