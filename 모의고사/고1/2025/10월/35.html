@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 35번","audioDir":"35_audio","preview":false,"count":28,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">35번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>How Social Media Boosts Our Autobiographical Memory\u003c/h1>\u003ch2>소셜 미디어가 자전적 기억력을 높여주는 방식\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>소셜 미디어에 게시된 개인적 사건은 \u003cb class=\"key\">되풀이\u003c/b>와 이해의 과정을 거치고, 다양한 \u003cb class=\"key\">기억 \u003c/b>\u003cb class=\"key\">단서\u003c/b>들이 제공되기에 게시되지 않은 것보다 더 \u003cb class=\"key\">장기 \u003c/b>\u003cb class=\"key\">기억\u003c/b>에 잘 유지됩니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Sharing personal experiences on social media enhances memory retention by providing opportunities for rehearsal and technological memory cues.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 매일 사용하는 소셜 미디어가 우리의 기억력에 어떤 영향을 미치는지에 대해 배워볼 거예요. 이 지문의 제목은 '소셜 미디어가 자전적 기억력을 높여주는 방식'입니다. 한 문장으로 요약하자면, 소셜 미디어에 일상을 공유하면 더 잘 기억되고 덜 잊힌다는 내용이죠. 왜 그런 결과가 나타나는지 그 구체적인 이유와 메커니즘을 함께 살펴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">자전적 기억이란 자신의 인생에서 일어난 사건들에 대한 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">기억\u003c/b>을 의미합니다. 과거에는 일기장에 글을 적는 것이 기억을 돕는 유일한 방법이었지만, 이제 소셜 미디어가 일종의 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">일기장\u003c/b> 역할을 하게 되었습니다. 이것은 단순한 기록을 넘어 타인과의 소통을 통해 기억을 \u003cb class=\"key\">정교화\u003c/b>하는 과정을 포함합니다. 마치 우리가 사진을 찍어 앨범에 정리하면 나중에 그 사진을 볼 때마다 기억이 새록새록 떠오르는 것과 같은 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">자극\u003c/b> 원리입니다. 소셜 미디어의 다양한 기능은 뇌가 정보를 잊지 않도록 지속적인 신호를 보냅니다.\u003c/div>","segs":[{"n":2,"text":"자전적 기억이라는 용어가 조금 생소할 수 있는데, 쉽게 말해 내 인생의 역사, 즉 내가 겪은 일들에 대한 기억을 뜻합니다. 여러분이 어릴 적 쓴 일기장을 떠올려 보세요. 일기를 쓰면 그날의 일이 더 생생하게 기억나죠? 소셜 미디어는 이 일기장의 디지털 버전과 같습니다. 특히 소셜 미디어는 다른 사람의 댓글이나 알고리즘의 알림처럼 나를 자극하는 외부 요인들이 많아서 인지적 정교화가 더 활발하게 일어납니다. 일종의 디지털 발자국이 우리 뇌의 기억 시스템을 자극하는 것이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입: 소셜 미디어의 역할\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>소셜 미디어가 개인의 경험인 \u003cb class=\"key\">자전적 \u003c/b>\u003cb class=\"key\">기억\u003c/b>을 촉진하는 중요한 \u003cb class=\"key\">맥락\u003c/b>이자 환경으로 기능한다고 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>현상: 게시 여부에 따른 차이\u003csmall>주장 · 문장 2\u003c/small>\u003c/h4>\u003cp>사건의 성격과 상관없이 소셜 미디어에 올린 일이 그렇지 않은 일보다 \u003cb class=\"key\">기억 \u003c/b>\u003cb class=\"key\">유지\u003c/b> 측면에서 훨씬 유리함을 명시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>원인 1: 인지적 재연\u003csmall>근거 · 문장 3\u003c/small>\u003c/h4>\u003cp>온라인 공유가 사건을 \u003cb class=\"key\">되풀이\u003c/b>하고 의미를 구성하게 하여 \u003cb class=\"key\">장기 \u003c/b>\u003cb class=\"key\">기억\u003c/b>을 돕는 심리적 이유를 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>원인 2: 기술적 단서\u003csmall>근거 · 문장 4\u003c/small>\u003c/h4>\u003cp>댓글, 좋아요와 같은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">피드백\u003c/b>과 알고리즘, 알림 같은 \u003cb class=\"key\">기술적 \u003c/b>\u003cb class=\"key\">기능\u003c/b>이 기억의 단서가 됨을 언급합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>결론: 최종 결과 비교\u003csmall>결론 · 문장 5\u003c/small>\u003c/h4>\u003cp>결과적으로 공유된 정보는 \u003cb class=\"key\">안정화\u003c/b>되는 반면, 공유되지 않은 정보는 \u003cb class=\"key\">망각\u003c/b>될 가능성이 높다는 결론을 내립니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 소셜 미디어의 역할부터 시작해서 기억이 강화되는 원인과 최종 결과를 순서대로 대조하며 설명합니다.","hl":null},{"n":4,"text":"첫 번째 문장에서는 소셜 미디어가 자전적 기억을 돕는 중요한 맥락으로 작용한다는 주제를 제시합니다.","hl":"f0"},{"n":5,"text":"두 번째 문장에서는 실제로 게시된 사건이 게시되지 않은 것보다 기억에 훨씬 잘 남는다는 현상을 강조하죠.","hl":"f1"},{"n":6,"text":"세 번째 문장에서는 그 원인 중 하나로 온라인 공유를 통해 사건을 되풀이하고 이해하게 되는 인지적 과정을 설명합니다.","hl":"f2"},{"n":7,"text":"네 번째 문장에서는 댓글, 좋아요, 알고리즘과 같은 기술적 기능들이 기억을 떠올리게 하는 단서가 된다고 덧붙입니다.","hl":"f3"},{"n":8,"text":"다섯 번째 문장에서는 결론적으로 공유된 기억은 안정화되지만, 그렇지 않은 것은 잊히기 쉽다는 차이점을 명확히 하며 마무리합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 소셜 미디어가 \u003cb class=\"key\">자전적 \u003c/b>\u003cb class=\"key\">기억\u003c/b>을 촉진한다는 핵심 주제를 던진 후, \u003cb class=\"key\">공유된 \u003c/b>\u003cb class=\"key\">사건\u003c/b>과 \u003cb class=\"key\">공유되지 \u003c/b>\u003cb class=\"key\">않은 \u003c/b>\u003cb class=\"key\">사건\u003c/b>의 결과를 대조하며 글을 전개합니다. 후반부에는 왜 그런 차이가 발생하는지 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">원인\u003c/b>과 \u003cb class=\"key\">기술적 \u003c/b>\u003cb class=\"key\">원인\u003c/b>을 나누어 분석하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>independent of (2)\u003c/b>\u003cspan>변수 통제 (대조 강조)\u003c/span>\u003cb>This may be because (3)\u003c/b>\u003cspan>원인 제시\u003c/span>\u003cb>as well as (4)\u003c/b>\u003cspan>나열 (추가 근거)\u003c/span>\u003cb>As a result (5)\u003c/b>\u003cspan>결과 요약\u003c/span>\u003cb>whereas (5)\u003c/b>\u003cspan>대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Social media\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">social media platforms\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">online\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">technological features\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">social media\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>공유된 사건 (Posted events)\u003c/th>\u003cth>공유되지 않은 사건 (Not posted/shared)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>더 잘 기억되고 덜 잊힘\u003c/td>\u003ctd>접근할 수 없게 되거나 잊힘\u003c/td>\u003c/tr>\u003ctr>\u003ctd>되풀이와 이해(rehearse, make sense) 과정 거침\u003c/td>\u003ctd>인지적 정교화 기회 부족\u003c/td>\u003c/tr>\u003ctr>\u003ctd>피드백, 알림 등 기억 단서 존재\u003c/td>\u003ctd>기억 단서 부족\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 지문은 전형적인 두괄식 구조를 취하고 있습니다. 첫 번째 문장에서 주제를 던지고 그 뒤를 뒷받침하는 근거들을 나열하죠. 특히 공유된 기억과 공유되지 않은 기억을 대비시키는 비교와 대조의 전개 방식이 사용되었습니다.","hl":"ty"},{"n":10,"text":"글의 흐름을 보여주는 신호어들에 주목해 보세요. 두 번째 문장의 independent of는 사건의 특징과 무관하게 공유 여부 자체가 중요하다는 것을 보여줍니다. 세 번째 문장의 This may be because는 원인을 설명하기 시작하고, 마지막 문장의 As a result는 전체 내용을 요약하는 결과 신호입니다. 특히 whereas를 사용해서 공유된 것과 공유되지 않은 것의 대조적인 결말을 선명하게 보여주고 있네요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>social media\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소셜 미디어\u003c/span>\u003c/div>\u003cdiv>\u003cb>serve as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로서 작용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>context\u003c/b>\u003cem>명사\u003c/em>\u003cspan>맥락, 환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>facilitate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>촉진하다, 용이하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>autobiographical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자전적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>remembering\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기억\u003c/span>\u003c/div>\u003cdiv>\u003cb>personal event\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인적 사건\u003c/span>\u003c/div>\u003cdiv>\u003cb>post\u003c/b>\u003cem>동사\u003c/em>\u003cspan>게시하다, 올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>platform\u003c/b>\u003cem>명사\u003c/em>\u003cspan>플랫폼\u003c/span>\u003c/div>\u003cdiv>\u003cb>independent of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 무관하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>characteristic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특성\u003c/span>\u003c/div>\u003cdiv>\u003cb>share\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>individual\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인\u003c/span>\u003c/div>\u003cdiv>\u003cb>rehearse\u003c/b>\u003cem>동사\u003c/em>\u003cspan>되풀이하다, 연습하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make sense of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 이해하다, 파악하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>retention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유지, 보유\u003c/span>\u003c/div>\u003cdiv>\u003cb>feedback\u003c/b>\u003cem>명사\u003c/em>\u003cspan>피드백, 반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>comment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>댓글\u003c/span>\u003c/div>\u003cdiv>\u003cb>technological\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기술적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>feature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기능, 특징\u003c/span>\u003c/div>\u003cdiv>\u003cb>algorithm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>알고리즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>periodic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주기적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>reminder\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상기시켜 주는 것, 알림\u003c/span>\u003c/div>\u003cdiv>\u003cb>cue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단서, 신호\u003c/span>\u003c/div>\u003cdiv>\u003cb>as a result\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>stabilize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>안정화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inaccessible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>접근할 수 없는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어를 몇 개 짚어볼까요? facilitate는 촉진하다라는 뜻으로 기억을 더 잘하게 만든다는 의미로 쓰였습니다. autobiographical은 자전적인이라는 뜻인데, 자기 자신의 경험을 다룰 때 쓰는 표현이죠. retention은 유지를 뜻하며 여기서는 기억을 잃지 않고 가지고 있는 것을 의미합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">facilitate\u003c/b>\u003cspan class=\"m\">촉진하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">promote\u003c/span>\u003cspan class=\"s\">expedite\u003c/span>\u003cspan class=\"s\">further\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003cspan class=\"a\">impede\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">independent of\u003c/b>\u003cspan class=\"m\">~와 무관하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">regardless of\u003c/span>\u003cspan class=\"s\">irrespective of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dependent on\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">retention\u003c/b>\u003cspan class=\"m\">유지, 보유\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">maintenance\u003c/span>\u003cspan class=\"s\">preservation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">loss\u003c/span>\u003cspan class=\"a\">forgetting\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">periodic\u003c/b>\u003cspan class=\"m\">주기적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">regular\u003c/span>\u003cspan class=\"s\">recurrent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">irregular\u003c/span>\u003cspan class=\"a\">random\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stabilize\u003c/b>\u003cspan class=\"m\">안정화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">settle\u003c/span>\u003cspan class=\"s\">fix\u003c/span>\u003cspan class=\"s\">solidify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destabilize\u003c/span>\u003cspan class=\"a\">weaken\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 봅시다. facilitate는 promote나 further로 바꿔 쓸 수 있고, 방해하다라는 뜻의 hinder와는 반대됩니다. independent of는 regardless of와 같은 의미로 쓰였죠. stabilize는 안정화하다라는 뜻인데, 굳건하게 만든다는 뜻의 solidify와 비슷하고 약화시킨다는 뜻의 weaken과는 반대되는 개념입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소셜 미디어는\u003c/span>\u003cspan class=\"en\">Social media\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 맥락으로 작용한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">serves \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> an important context\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">촉진하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">facilitate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자전적 기억을\u003c/span>\u003cspan class=\"en\">autobiographical remembering.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소셜 미디어는 자전적 기억을 촉진하는 중요한 맥락으로 작용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소셜 미디어가 개인의 \u003cb class=\"key\">자전적 \u003c/b>\u003cb class=\"key\">기억\u003c/b>을 돕는 중요한 역할을 한다는 주제를 제시합니다. SNS에 기록을 남기는 행위가 단순히 재미를 넘어 \u003cb class=\"key\">기억 \u003c/b>\u003cb class=\"key\">보조\u003c/b> 수단이 됨을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용적 표현\u003c/span> : serve as + 명사 : \"~로서 작용하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : context [명사] + to facilitate [to부정사] : \"촉진하는\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Social media, 소셜 미디어는. serves as an important context, 중요한 맥락으로 작용한다. to facilitate, 촉진하는. autobiographical remembering, 자전적 기억을. 이 문장 전체를 해석하면, 소셜 미디어는 자전적 기억을 촉진하는 중요한 맥락으로 작용한다.","hl":"m"},{"n":14,"text":"소셜 미디어가 우리 삶의 경험을 기억하는 데 아주 중요한 배경이 된다는 내용이에요. 우리가 일상을 기록하는 행위가 결국 자전적 기억을 돕는 도구가 된다는 뜻이죠.","hl":"mn"},{"n":15,"text":"첫 번째로 serves as는 어떤 역할을 수행한다는 표현이에요. 두 번째로 to facilitate는 앞에 있는 명사인 context를 수식해서 촉진하는 맥락이라고 해석하는 형용사적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인적 사건들은\u003c/span>\u003cspan class=\"en\">Personal events\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소셜 미디어 플랫폼에 게시된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">posted\u003c/span> on social media platforms\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 잘 기억되고 덜 잊힌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">remembered \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">forgotten\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게시되지 않은 것들보다\u003c/span>\u003cspan class=\"en\">than \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">those\u003c/span> not posted,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~와 무관하게\u003c/span>\u003cspan class=\"en\">independent of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사건들의 특성과\u003c/span>\u003cspan class=\"en\">the characteristics of the events.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소셜 미디어 플랫폼에 게시된 개인적 사건들은 그 사건들의 특성과 무관하게, 게시되지 않은 것들보다 더 잘 기억되고 덜 잊힌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> SNS 게시 여부에 따른 \u003cb class=\"key\">기억의 \u003c/b>\u003cb class=\"key\">효율성\u003c/b> 차이를 설명하며, 사건의 내용보다 \u003cb class=\"key\">게시 \u003c/b>\u003cb class=\"key\">여부\u003c/b> 자체가 기억에 더 큰 영향을 미친다는 점을 밝힙니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : Personal events [명사] + posted [과거분사구] : \"게시된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태의 병렬 구조\u003c/span> : be + [p.p. 1] and [p.p. 2] : \"더 잘 기억되고 덜 잊히는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정대명사\u003c/span> : those = personal events : \"것들\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Personal events, 개인적 사건들은. posted on social media platforms, 소셜 미디어 플랫폼에 게시된. are better remembered and less forgotten, 더 잘 기억되고 덜 잊힌다. than those not posted, 게시되지 않은 것들보다. independent of, ~와 무관하게. the characteristics of the events, 그 사건들의 특성과. 이 문장 전체를 해석하면, 소셜 미디어 플랫폼에 게시된 개인적 사건들은 그 사건들의 특성과 무관하게, 게시되지 않은 것들보다 더 잘 기억되고 덜 잊힌다.","hl":"m"},{"n":17,"text":"인터넷에 올린 일들은 올리지 않은 일들보다 훨씬 더 오래 기억에 남는다는 뜻이에요. 사건 자체가 특별해서가 아니라 단순히 게시했다는 사실이 중요합니다.","hl":"mn"},{"n":18,"text":"첫 번째로 posted는 수동의 의미로 앞에 있는 명사를 꾸며주는 과거분사예요. 두 번째로 are better remembered and less forgotten 부분은 수동태가 나란히 연결된 병렬 구조이고요. 세 번째로 those는 앞에 나온 복수 명사인 events를 가리키는 대명사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 ~이기 때문일 수 있다\u003c/span>\u003cspan class=\"en\">This may be because\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온라인에서 기억을 공유하는 것이\u003c/span>\u003cspan class=\"en\">sharing memories online\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인이 ~하도록 해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">allows \u003c/span>\u003cspan class=\"tgt\">individuals \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">되풀이하고 이해하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">rehearse\u003c/span> and make sense of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일어난 일을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">happened\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">촉진하기 (때문이다)\u003c/span>\u003cspan class=\"en\">thus \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">facilitating\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장기 기억 유지를\u003c/span>\u003cspan class=\"en\">long­term memory retention.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 온라인에서 기억을 공유하는 것이 개인이 일어난 일을 되풀이하고 이해하도록 해서 장기 기억 유지를 촉진하기 때문일 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소셜 미디어가 기억에 도움을 주는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">원인\u003c/b>을 분석합니다. 정보를 \u003cb class=\"key\">재구성\u003c/b>하고 되풀이하는 과정이 장기 기억으로 이어진다는 논리적 근거를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장 (allow A to B)\u003c/span> : allow [동사] + individuals [목적어] + to rehearse [to부정사/목적보어] : \"개인이 되풀이하도록 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : what [관계사] + happened [동사] : \"일어난 일\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : [절] + , facilitating [현재분사] : \"촉진하면서\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"This may be because, 이것은 ~이기 때문일 수 있다. sharing memories online, 온라인에서 기억을 공유하는 것이. allows individuals, 개인이 ~하도록 해서. to rehearse and make sense of, 되풀이하고 이해하도록. what happened, 일어난 일을. thus facilitating, 촉진하기 (때문이다). long­term memory retention, 장기 기억 유지를. 이 문장 전체를 해석하면, 이것은 온라인에서 기억을 공유하는 것이 개인이 일어난 일을 되풀이하고 이해하도록 해서 장기 기억 유지를 촉진하기 때문일 수 있다.","hl":"m"},{"n":20,"text":"왜 SNS 공유가 기억에 도움이 될까요? 온라인에 글을 올리면서 내용을 정리하고 다시 생각해보게 되는데, 이 과정이 장기 기억으로 넘어가는 걸 돕기 때문이에요.","hl":"mn"},{"n":21,"text":"첫 번째로 allow A to B 구조를 확인하세요. 개인이 되풀이하게 만든다는 뜻으로 목적보어 자리에 to부정사가 왔습니다. 두 번째로 what happened는 일어난 일이라는 뜻의 관계대명사 절이에요. 세 번째로 쉼표 뒤에 나온 facilitating은 결과적으로 촉진하게 된다는 의미의 분사구문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">댓글과 '좋아요'와 같은 온라인 피드백도\u003c/span>\u003cspan class=\"en\">Online feedback \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> comments and likes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기술적 기능들뿐만 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> technological features\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알고리즘과 주기적인 알림과 같은\u003c/span>\u003cspan class=\"en\">such as algorithms and periodic reminders\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기억 단서로 한층 더 작용할 수 있다\u003c/span>\u003cspan class=\"en\">can further serve as memory cues\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게시된 사건의 세부 사항에 대한.\u003c/span>\u003cspan class=\"en\">for the \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">posted\u003c/span> event details.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">알고리즘과 주기적인 알림과 같은 기술적 기능들뿐만 아니라, 댓글과 '좋아요'와 같은 온라인 피드백도 게시된 사건의 세부 사항에 대한 기억 단서로 한층 더 작용할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소셜 미디어상의 \u003cb class=\"key\">상호작용\u003c/b>과 시스템적 기능이 기억을 떠올리게 돕는 \u003cb class=\"key\">기억 \u003c/b>\u003cb class=\"key\">단서\u003c/b> 역할을 한다는 내용입니다. 단순히 올리는 행위를 넘어 타인의 반응과 \u003cb class=\"key\">알림\u003c/b>이 기억을 강화함을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">예시의 전치사구\u003c/span> : 명사 + such as + 예시들 : \"~와 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 (B as well as A)\u003c/span> : B [명사구/강조대상] + as well as + A [명사구/비교대상] : \"~뿐만 아니라 ~도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 수식\u003c/span> : the + [posted (과거분사)] + event details (명사구) : \"게시된\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Online feedback such as comments and likes, 댓글과 '좋아요'와 같은 온라인 피드백도. as well as technological features, 기술적 기능들뿐만 아니라. such as algorithms and periodic reminders, 알고리즘과 주기적인 알림과 같은. can further serve as memory cues, 기억 단서로 한층 더 작용할 수 있다. for the posted event details, 게시된 사건의 세부 사항에 대한.. 이 문장 전체를 해석하면, 알고리즘과 주기적인 알림과 같은 기술적 기능들뿐만 아니라, 댓글과 '좋아요'와 같은 온라인 피드백도 게시된 사건의 세부 사항에 대한 기억 단서로 한층 더 작용할 수 있다.","hl":"m"},{"n":23,"text":"우리가 올린 게시물에 누군가 댓글을 달거나 시스템이 예전 기억을 다시 보여주면 그 사건이 더 잘 기억나죠. 이렇게 외부의 반응과 기술적 도움을 받으면 우리 뇌 속에 기억이 더 확실히 자리를 잡게 된다는 뜻이에요.","hl":"mn"},{"n":24,"text":"첫 번째로 as well as 표현을 보세요. 비뿐만 아니라 에이도라는 뜻으로 주어 부분을 길게 연결하고 있어요. 두 번째로 such as는 예시를 들 때 쓰는 말로 뒤에 구체적인 내용들이 나옵니다. 세 번째로 event details를 꾸며주는 posted를 보세요. 게시된이라는 수동의 의미를 가진 과거분사 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 결과,\u003c/span>\u003cspan class=\"en\">As a result,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소셜 미디 어떻게 공유된 사건 세부 사항들은\u003c/span>\u003cspan class=\"en\">event details \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shared\u003c/span> on social media\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간이 지나면서 안정화되고 기억될 가능성이 높은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">stabilized \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">remembered\u003c/span> over time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면에, 공유되지 않는 것들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">whereas\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">those\u003c/span> not shared\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">접근할 수 없게 되거나 잊힐 수 있다.\u003c/span>\u003cspan class=\"en\">may become inaccessible or forgotten.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 결과, 소셜 미디 어떻게 공유된 사건 세부 사항들은 시간이 지나면서 안 정화되고 기억될 가능성이 높은 반면에, 공유되지 않는 것들은 접근할 수 없게 되거나 잊힐 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 정보를 공유하면 기억이 \u003cb class=\"key\">안정화\u003c/b>되어 오래 남지만, 공유하지 않으면 \u003cb class=\"key\">망각\u003c/b>될 수 있다는 결론을 제시합니다. SNS 활용 여부에 따른 \u003cb class=\"key\">기억의 \u003c/b>\u003cb class=\"key\">생존\u003c/b> 차이를 대조하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : event details [명사] + [shared (과거분사구)] : \"공유된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사와 수동태의 병렬 구조\u003c/span> : are likely [보어] + stabilized and remembered [과거분사 병렬] : \"안정화되고 기억될 가능성이 높은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대조의 접속사\u003c/span> : Sentence A, whereas Sentence B : \"반면에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">부정대명사\u003c/span> : those [대명사] = event details : \"것들\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"As a result, 그 결과. event details shared on social media, 소셜 미디 어떻게 공유된 사건 세부 사항들은. are likely stabilized and remembered over time, 시간이 지나면서 안정화되고 기억될 가능성이 높은. whereas those not shared, 반면에, 공유되지 않는 것들은. may become inaccessible or forgotten, 접근할 수 없게 되거나 잊힐 수 있다.. 이 문장 전체를 해석하면, 그 결과, 소셜 미디 어떻게 공유된 사건 세부 사항들은 시간이 지나면서 안 정화되고 기억될 가능성이 높은 반면에, 공유되지 않는 것들은 접근할 수 없게 되거나 잊힐 수 있다.","hl":"m"},{"n":26,"text":"결국 남들과 공유한 기억은 반복적으로 노출되면서 머릿속에 단단히 고정되지만 혼자만 간직한 일들은 시간이 흐르면 점차 희미해진다는 이야기예요. 공유라는 행위가 기억의 수명을 결정한다는 핵심 결론이죠.","hl":"mn"},{"n":27,"text":"첫 번째로 details 뒤에 나온 shared를 보세요. 앞에 나온 명사를 뒤에서 수식하는 과거분사구예요. 두 번째로 be likely stabilized and remembered 부분은 가능성을 나타내는 표현에 수동태 병렬 구조가 결합된 형태입니다. 세 번째로 whereas는 두 가지 사실을 대조할 때 쓰는 접속사로 반면에라고 해석합니다. 네 번째로 those는 앞에서 말한 사건의 세부 사항들을 대신 받는 부정대명사입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>소셜 미디어는 \u003cb class=\"key\">자전적 \u003c/b>\u003cb class=\"key\">기억\u003c/b>을 강화하는 중요한 역할을 담당합니다.\u003c/li>\u003cli>사건의 중요도와 상관없이 온라인에 \u003cb class=\"key\">공유된 \u003c/b>\u003cb class=\"key\">내용\u003c/b>은 기억에 더 오래 남습니다.\u003c/li>\u003cli>기억을 공유하며 내용을 \u003cb class=\"key\">재구성\u003c/b>하고 이해하는 과정이 기억 유지를 돕습니다.\u003c/li>\u003cli>댓글이나 알림 같은 \u003cb class=\"key\">기술적 \u003c/b>\u003cb class=\"key\">단서\u003c/b>들이 게시된 사건에 대한 기억을 불러일으킵니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Sharing personal experiences on social media enhances memory retention by providing opportunities for rehearsal and technological memory cues.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">소셜 미디어에 게시된 개인적 사건은 \u003cb class=\"key\">되풀이\u003c/b>와 이해의 과정을 거치고, 다양한 \u003cb class=\"key\">기억 \u003c/b>\u003cb class=\"key\">단서\u003c/b>들이 제공되기에 게시되지 않은 것보다 더 \u003cb class=\"key\">장기 \u003c/b>\u003cb class=\"key\">기억\u003c/b>에 잘 유지됩니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":28,"text":"오늘 우리는 소셜 미디어가 단순한 소통 도구를 넘어 우리의 장기 기억을 돕는 보조 장치가 될 수 있다는 점을 배웠습니다. 정보를 공유하고 피드백을 주고받는 과정이 뇌에는 강력한 자극이 된다는 점이 흥미롭지 않나요? 오늘 배운 비교와 대조의 구조를 잘 기억하면서 복습해 보세요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
