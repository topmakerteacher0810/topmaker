</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 37번","audioDir":"37_audio","preview":false,"count":43,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">37번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>Why the Principle of Opposites is Foreign to Children\u003c/h1>\u003ch2>아이들에게 반대의 원리가 생소한 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>아이들은 단어와 의미를 분리하여 인식하므로, \u003cb class=\"key\">반대의 \u003c/b>\u003cb class=\"key\">원리\u003c/b>나 단어 사이의 \u003cb class=\"key\">논리적 \u003c/b>\u003cb class=\"key\">연결\u003c/b>을 이해하는 데 발달상의 시간이 필요합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Children do not inherently understand the logical connection between opposites because they perceive words separately from their meanings.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 중학교 2학년 동아 윤정미 교과서의 서른일곱 번째 지문을 함께 공부해보겠습니다. 이 글은 아이들이 왜 반대 개념을 어려워하는지에 대한 흥미로운 인지 발달 이야기를 다루고 있어요. 단어와 의미를 분리해서 생각하는 아이들의 특징과 그로 인해 발생하는 재미있는 상황들을 요약과 요지를 통해 먼저 살펴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문은 아동의 \u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">발달(Cognitive \u003c/b>\u003cb class=\"key\">Development)\u003c/b> 특성을 설명합니다. 어린아이들은 추상적인 사고 능력이 완성되지 않아, 한 단어를 배울 때 그와 대조되는 개념을 동시에 떠올리는 \u003cb class=\"key\">이분법적 \u003c/b>\u003cb class=\"key\">사고(Dichotomous \u003c/b>\u003cb class=\"key\">Thinking)\u003c/b>에 서툽니다. 마치 우리가 처음 보는 \u003cb class=\"key\">외국어(Foreign \u003c/b>\u003cb class=\"key\">Language)\u003c/b>를 배울 때 단어 하나하나의 뜻은 외우지만, 그 단어들 사이의 복잡한 관계망을 즉각 파악하지 못하는 것과 비슷합니다. 예를 들어 '낮'이라는 단어를 안다고 해서 자동으로 '밤'이라는 반대 개념을 \u003cb class=\"key\">논리적 \u003c/b>\u003cb class=\"key\">세트\u003c/b>로 묶어 이해하지 못하는 것이죠. 이러한 \u003cb class=\"key\">개념적 \u003c/b>\u003cb class=\"key\">통합\u003c/b>은 뇌가 성장하며 나중에야 이루어지는 고등 사고 과정입니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 학습에 앞서 배경지식을 좀 쌓아볼까요? 아이들의 인지 발달 과정을 이해하는 것이 핵심이에요. 여러분도 어릴 때 부모님이 하지 말라고 하는 걸 왜 안 해야 하는지, 그럼 대신 뭘 해야 하는지 몰라서 당황했던 적이 있을 거예요. 이건 아이들의 뇌가 이분법적 논리, 즉 어떤 개념의 대척점을 바로 연결하지 못하기 때문입니다. 외국어를 처음 배울 때 단어 하나하나의 뜻만 겨우 아는 것과 비슷한 원리라고 생각하면 이해하기 쉬울 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입: 반대 원리의 생소함\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>아이들에게 \u003cb class=\"key\">반대의 \u003c/b>\u003cb class=\"key\">원리\u003c/b>는 낯설며, 단어와 의미를 서로 \u003cb class=\"key\">분리\u003c/b>하여 인식한다는 점을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>핵심 개념: 발달에 따른 연결\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>단어들이 서로 \u003cb class=\"key\">직접 \u003c/b>\u003cb class=\"key\">연결\u003c/b>되어 있다는 사실은 나중의 \u003cb class=\"key\">발달 \u003c/b>\u003cb class=\"key\">단계\u003c/b>에서야 이해하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>예시 1: 자전거 타기\u003csmall>예시 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>왼쪽으로 가지 말라는 지시를 받아도 \u003cb class=\"key\">자동으로\u003c/b> 오른쪽으로 방향을 틀지 못하는 자전거 타기 사례를 듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>예시 2: 식사 예절과 혼란\u003csmall>예시 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>손으로 먹지 말라는 말을 들었을 때, \u003cb class=\"key\">식사 \u003c/b>\u003cb class=\"key\">지속 \u003c/b>\u003cb class=\"key\">여부\u003c/b>와 방법에 대해 아이들이 겪는 \u003cb class=\"key\">혼란\u003c/b>을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>결론: 나중에 깨닫는 연관성\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>시간이 흐른 뒤에야 비로소 단어 간 \u003cb class=\"key\">연관성\u003c/b>을 인식하고 올바른 \u003cb class=\"key\">대안\u003c/b>을 이해하게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 아이들의 일반적인 인지 특성에서 시작해서 구체적인 사례를 거쳐 결론으로 이어지는 구조를 가지고 있습니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 도입부로, 아이들에게 반대의 원리가 왜 낯설게 느껴지는지 설명합니다. 아이들은 단어와 그 의미를 서로 분리해서 받아들인다는 점이 포인트예요.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 핵심 주장이 나옵니다. 우리가 개별 단어들이 직접 연결되어 있다는 걸 알게 되는 건 나중의 발달 단계라는 거죠. 예를 들어, 왼쪽의 반대가 오른쪽이라는 걸 아이들은 바로 알지 못합니다.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장은 자전거 타기라는 생생한 사례를 보여줍니다. 왼쪽으로 가지 마라는 말을 들어도 아이들은 곧장 앞으로만 갈 뿐, 자동으로 오른쪽으로 꺾지 못한다는 내용이에요.","hl":"f2"},{"n":7,"text":"일곱 번째부터 아홉 번째 문장에서는 식사 예절이라는 또 다른 사례를 들려줍니다. 손으로 먹지 마라는 말을 들었을 때, 아이들은 계속 먹어야 하는 건지 아니면 어떻게 먹어야 하는 건지 몰라 혼란스러워한다는 거죠.","hl":"f3"},{"n":8,"text":"마지막 열 번째 문장은 결론입니다. 시간이 흘러서야 비로소 우리는 그 연관성을 인식하게 되고, 손이 아니라 포크나 숟가락을 써야 한다는 사실을 완벽하게 이해하게 됩니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시를 통한 설명\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부인 세 번째 문장에서 \u003cb class=\"key\">단어 \u003c/b>\u003cb class=\"key\">간 \u003c/b>\u003cb class=\"key\">연결성\u003c/b>은 나중의 발달 과정에서 이해된다는 핵심 주제를 던집니다. 이후 자전거 타기와 식사 예절이라는 두 가지 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 통해 아이들이 겪는 인지적 혼란을 뒷받침합니다. 마지막 문장에서 이러한 혼란이 해결되는 \u003cb class=\"key\">성장 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 다시 한번 강조하며 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>for instance (4)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>A vivid example (5)\u003c/b>\u003cspan>구체적 사례 제시\u003c/span>\u003cb>The same applies to (7)\u003c/b>\u003cspan>추가 사례 확장\u003c/span>\u003cb>Only later did we (10)\u003c/b>\u003cspan>시간적 대조 및 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">principle of opposites\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">individual words directly connect\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">logical connection\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">recognize the connection\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>어린 시절의 인지\u003c/th>\u003cth>이후의 인지 발달\u003c/th>\u003c/tr>\u003ctr>\u003ctd>단어와 의미를 분리하여 인식\u003c/td>\u003ctd>단어 간의 직접적 연결을 이해\u003c/td>\u003c/tr>\u003ctr>\u003ctd>반대 지시에 혼란을 느낌\u003c/td>\u003ctd>반대 개념(A가 아니라 B)을 파악\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 전반적으로 구체적인 사례를 통해 일반적인 원리를 설명하는 예시 중심의 구조를 띠고 있습니다. 주제문이 중간에 나오고 마지막에 다시 확인되는 중괄식 구조라고 볼 수 있어요.","hl":"ty"},{"n":10,"text":"글의 흐름을 잡아주는 신호어들을 잘 보세요. 네 번째 문장의 for instance와 다섯 번째 문장의 A vivid example이 사례의 시작을 알리고 있죠. 일곱 번째 문장의 The same applies to는 논리를 확장해주는 아주 중요한 표현입니다. 마지막 문장의 Only later는 시간의 흐름에 따른 인지 변화를 극적으로 보여줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>principle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원리, 원칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>opposite\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반대(의 것)\u003c/span>\u003c/div>\u003cdiv>\u003cb>foreign\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>낯선, 이질적인, 외국의\u003c/span>\u003c/div>\u003cdiv>\u003cb>perceive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다, 인지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>separately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>분리하여, 따로따로\u003c/span>\u003c/div>\u003cdiv>\u003cb>development\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발달, 발전\u003c/span>\u003c/div>\u003cdiv>\u003cb>individual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>개별적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>directly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>직접적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>connect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for instance\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>clear\u 세요. 예시가 스스로 보는 게 아니라 우리에 의해 보일 수 있다는 의미예요. 두 번째로 learn 동사가 목적어로 to부정사인 to ride를 취하고 있는 점도 중요합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부모들이 자녀에게 말하면 \u003c/span>\u003cspan class=\"en\">If parents tell their child\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“왼쪽으로 가지 마.”라고 \u003c/span>\u003cspan class=\"en\">&quot;Don't go to the left,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부모는 종종 보게 될 것이다 \u003c/span>\u003cspan class=\"en\">they will often \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이가 계속 가고 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">child \u003c/span>\u003cspan class=\"tgt\">will\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">continue \u003c/span>\u003cspan class=\"tgt\">riding\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧장 앞으로 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">straight \u003c/span>\u003cspan class=\"tgt\">ahead \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자동적으로 방향을 틀지 않는 것을 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">automatically \u003c/span>\u003cspan class=\"tgt\">turn\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오른쪽으로.\u003c/span>\u003cspan class=\"en\">to the right.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">부모들이 자녀에게, “왼쪽으로 가지 마.”라고 말하면, 부모는 아이가 곧장 앞으로 계속 가고 자동적으로 오른쪽으로 방향을 틀지 않는 것을 종종 보게 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 하지 말라는 지시만으로는 아이가 그 \u003cb class=\"key\">반대 \u003c/b>\u003cb class=\"key\">동작\u003c/b>을 자동으로 수행하지 못한다는 것을 증명하는 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">사례\u003c/b>의 묘사입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that\u003c/span> : find [동사] + that [접속사] + S + V : \"~라는 것을 알게 될 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 목적어\u003c/span> : continue [동사] + riding [동명사] : \"계속 타다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사구의 병렬 구조\u003c/span> : will [조동사] + continue [원형1] + and + not turn [원형2] : \"똑바로 가고 그리고 돌지 않다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"If parents tell their child, 부모들이 자녀에게 말하면. \"Don't go to the left,\", “왼쪽으로 가지 마.”라고. they will often find, 부모는 종종 보게 될 것이다. that the child will continue riding, 아이가 계속 가고. straight ahead and, 곧장 앞으로. not automatically turn, 자동적으로 방향을 틀지 않는 것을. to the right, 오른쪽으로.. 이 문장 전체를 해석하면, 부모들이 자녀에게, “왼쪽으로 가지 마.”라고 말하면, 부모는 아이가 곧장 앞으로 계속 가고 자동적으로 오른쪽으로 방향을 틀지 않는 것을 종종 보게 될 것이다.","hl":"m"},{"n":29,"text":"부모가 왼쪽으로 가지 말라고 했을 때, 아이가 그 반대인 오른쪽으로 가는 대신 직진을 해버리는 상황을 묘사하고 있어요. 아이들에게 반대 개념이 아직 부족하다는 증거인 실제 사례입니다.","hl":"mn"},{"n":30,"text":"첫 번째로 find 뒤의 접속사 that은 목적어 역할을 하는 명사절을 연결합니다. 두 번째로 continue 뒤에 동명사 riding이 온 것을 확인하세요. 마지막 세 번째로 조동사 will 뒤에 동사원형 continue와 not turn이 병렬 구조를 이루고 있다는 점이 아주 중요합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 원리가 적용된다\u003c/span>\u003cspan class=\"en\">The same \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">applies \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">논리적 관계에도\u003c/span>\u003cspan class=\"en\">the logical connection\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘예’와 ‘아니요’ 사이의\u003c/span>\u003cspan class=\"en\">between 'Yes' and 'No'\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부모가 인식하는 대로의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">perceived \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">parents\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(A) 같은 원리가 부모가 인식하는 ‘예’와 ‘아니요’ 사이의 논리적 관계에도 적용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 자전거 사례와 마찬가지로 \u003cb class=\"key\">반대되는 \u003c/b>\u003cb class=\"key\">개념\u003c/b>인 'Yes'와 'No' 사이의 관계도 아이들은 즉각 이해하지 못합니다. 부모의 입장에선 당연한 \u003cb class=\"key\">상관관계\u003c/b>가 아이들의 사고방식에서는 다르게 작동할 수 있음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 구문(apply to)\u003c/span> : apply [자동사] + to [전치사] + [대상] : \"~에 적용되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구(수동)\u003c/span> : as + [p.p.(과거분사)] + by + [행위자] : \"부모에 의해 인식되는 대로\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"The same applies to, 같은 원리가 적용된다. the logical connection, 논리적 관계에도. between 'Yes' and 'No', ‘예’와 ‘아니요’ 사이의. as perceived by parents, 부모가 인식하는 대로의. 이 문장 전체를 해석하면, (A) 같은 원리가 부모가 인식하는 ‘예’와 ‘아니요’ 사이의 논리적 관계에도 적용된다.","hl":"m"},{"n":32,"text":"자전거를 탈 때 왼쪽으로 가지 말라고 하면 오른쪽으로 가야 한다는 걸 바로 모르는 것처럼 예와 아니요의 관계도 마찬가지라는 거예요. 부모님은 당연하게 생각하는 반대 개념의 상관관계를 아이들은 낯설어할 수 있다는 뜻이죠.","hl":"mn"},{"n":33,"text":"첫 번째로 applies to는 어디에 적용된다는 뜻의 자동사 구문이에요. 두 번째로 as perceived by parents는 부모에 의해 인식되는 것이라는 수동의 의미를 담고 있어요. 여기서 과거분사 perceived는 인식의 주체가 부모라는 점을 강조해주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 아이였을 때\u003c/span>\u003cspan class=\"en\">When we were children\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, ~라는 말을 들었을 때\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">told\u003c/span>, for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“안 돼, 손으로 먹지 마.”\u003c/span>\u003cspan class=\"en\">&quot;No, don't eat with your hands,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 혼란스러웠고\u003c/span>\u003cspan class=\"en\">we were \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">confused\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몰랐다\u003c/span>\u003cspan class=\"en\">and didn't know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 부모가 우리로부터 기대하는 것이 무엇인지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">parents \u003c/span>\u003cspan class=\"tgt\">expected \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 아이였을 때, 예를 들어, “안 돼, 손으로 먹지 마.”라는 말을 들었을 때, 우리는 혼란스러웠고, 우리 부모가 우리로부터 기대하는 것이 무엇인지 몰랐다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 구체적인 식사 예절 사례를 통해 아이들이 \u003cb class=\"key\">부정어\u003c/b>의 의도를 파악하는 데 겪는 어려움을 보여줍니다. 부모는 행동의 수정을 요구하지만, 아이는 그 너머의 \u003cb class=\"key\">대안적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 연상하지 못해 혼란을 느낍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(4형식)\u003c/span> : be + told [p.p.] : \"~라는 말을 듣다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정의 분사(과거분사)\u003c/span> : be + confused [p.p.] : \"혼란스러워하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : what [의문사] + our parents [주어] + expected [동사] : \"우리 부모님이 우리에게 무엇을 기대하셨는지\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"When we were children, 우리가 아이였을 때. and were told, for example, 예를 들어, ~라는 말을 들었을 때. \"No, don't eat with your hands,\", “안 돼, 손으로 먹지 마.”. we were confused, 우리는 혼란스러웠고. and didn't know, 몰랐다. what our parents expected from us, 우리 부모가 우리로부터 기대하는 것이 무엇인지. 이 문장 전체를 해석하면, 우리가 아이였을 때, 예를 들어, “안 돼, 손으로 먹지 마.”라는 말을 들었을 때, 우리는 혼란스러웠고, 우리 부모가 우리로부터 기대하는 것이 무엇인지 몰랐다.","hl":"m"},{"n":35,"text":"부모님은 손으로 먹지 말라고만 하시지만, 아이들은 그 말을 들었을 때 대신 무엇을 써야 하는지 바로 떠올리지 못한다는 거예요. 금지 명령 뒤에 숨겨진 부모님의 진짜 의도나 대안적 행동을 찾는 게 아이들에겐 어렵거든요.","hl":"mn"},{"n":36,"text":"첫 번째로 were told는 텔의 과거분사인 톨드를 써서 말을 듣다라는 수동의 의미를 만들어요. 두 번째로 confused는 우리가 혼란을 느끼는 상태이므로 감정을 느끼는 과거분사를 썼죠. 마지막으로 what our parents expected는 노우의 목적어 자리에 온 간접의문문으로 의문사 주어 동사 순서가 아주 중요해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 혼란은 ~에 대한 것이었다\u003c/span>\u003cspan class=\"en\">Our confusion was about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계속 먹어야 하는 건지 아닌지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">continue \u003c/span>\u003cspan class=\"tgt\">eating \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 먹는다면 어떻게 해야 하지?에 대한\u003c/span>\u003cspan class=\"en\">and if so, how?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(C) 우리의 혼란은 계속 먹어야 하는 건지 아닌지, 만약 먹는다면 어떻게 해야 하지?에 대한 것이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아이들의 혼란이 단순한 반항이 아니라, \u003cb class=\"key\">선택지\u003c/b>의 부재에서 오는 것임을 밝힙니다. 하지 말라는 명령 후에 뒤따라야 할 \u003cb class=\"key\">올바른 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 스스로 찾지 못하는 아이들의 사고방식을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 whether\u003c/span> : whether + 주어 + 동사 + (or not) : \"계속 먹어야 할지 말지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : continue + [eating (v-ing)] : \"계속 먹다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Our confusion was about, 우리의 혼란은 ~에 대한 것이었다. whether we should continue eating or not, 계속 먹어야 하는 건지 아닌지. and if so, how?, 만약 먹는다면 어떻게 해야 하지?에 대한. 이 문장 전체를 해석하면, (C) 우리의 혼란은 계속 먹어야 하는 건지 아닌지, 만약 먹는다면 어떻게 해야 하지?에 대한 것이었다.","hl":"m"},{"n":38,"text":"아이들은 부모님이 손으로 먹지 말라고 하면 아예 밥 먹는 걸 멈춰야 하는 건지 고민에 빠져요. 만약 계속 먹어도 된다면 도대체 어떤 올바른 방법으로 먹으라는 건지 선택지를 찾지 못해 당황하는 상황을 묘사하고 있습니다.","hl":"mn"},{"n":39,"text":"첫 번째로 whether절은 전치사 어바웃의 목적어로 쓰여서 인지 아닌지라는 뜻을 나타내요. 두 번째로 continue eating은 계속해서 먹는다는 의미로 동사 컨티뉴 뒤에 동명사 목적어를 쓴 형태입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에서야\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Only \u003c/span>\u003cspan class=\"tgt\">later \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 그 연관성을 인식했고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">recognize\u003c/span> the connection\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 ~라는 것을 이해하게 되었다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">understand \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 계속 먹어야 한다는 것을,\u003c/span>\u003cspan class=\"en\">we should continue eating,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손이 아니라\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">hands \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포크나 숟가락으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">fork \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">spoon\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나중에서야 우리는 그 연관성을 인식했고, 우리가 손이 아니라 포크나 숟가락으로 계속 먹어야 한다는 것을 이해하게 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 성장하면서 아이들이 '안 돼'라는 부정적인 지시 속에 숨겨진 긍정적인 행동 대안을 파악하는 \u003cb class=\"key\">논리적 \u003c/b>\u003cb class=\"key\">연결\u003c/b> 과정을 보여줍니다. 단순히 금지를 이해하는 것을 넘어, \u003cb class=\"key\">반대 \u003c/b>\u003cb class=\"key\">개념\u003c/b>을 통해 올바른 도구 사용법을 깨닫는 발달 단계를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사구 강조에 의한 도치\u003c/span> : Only + [부사/부사구/부사절] + [do/does/did (조동사)] + [주어] + [동사원형] : \"나중에서야 우리는 인식했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : understand [타동사] + that [접속사] + [주어 + 동사 (완전한 문장)] : \"~라는 것을 이해하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">상관접속사 not A but B\u003c/span> : not + [A (전치사구)] + but + [B (전치사구)] : \"우리 손이 아니라 포크나 숟가락으로\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Only later, 나중에서야. did we recognize the connection, 우리는 그 연관성을 인식했고. and understand that, 그리고 ~라는 것을 이해하게 되었다. we should continue eating, 우리가 계속 먹어야 한다는 것을. but not with our hands, 손이 아니라. but with a fork or a spoon, 포크나 숟가락으로.. 이 문장 전체를 해석하면, 나중에서야 우리는 그 연관성을 인식했고, 우리가 손이 아니라 포크나 숟가락으로 계속 먹어야 한다는 것을 이해하게 되었다.","hl":"m"},{"n":41,"text":"이 문장은 아이들이 자라면서 반대 개념 사이의 논리적 연결을 어떻게 깨닫게 되는지 결론을 내리는 부분이에요. 부모님이 손으로 먹지 말라고 하신 말씀의 진짜 의도는 도구를 사용해서 계속 먹으라는 뜻임을 이제야 알게 되었다는 반대 개념의 완성을 보여줍니다.","hl":"mn"},{"n":42,"text":"첫 번째로 문장 맨 앞의 Only later를 주목하세요. Only와 부사구가 문장 앞에 오면 주어와 동사의 순서가 바뀌는 도치가 일어나요. 그래서 we recognized가 아니라 did we recognize라는 의문문 순서가 된 거죠. 두 번째는 understand 뒤에 오는 that이에요. 뒤에 주어와 동사가 모두 갖춰진 문장을 이끌어 목적어 역할을 하는 명사절 접속사로 쓰였습니다. 마지막으로 not A but B 구조가 사용되었는데, 손이 아니라 포크나 숟가락이라는 두 대상을 대조하며 의미를 분명하게 해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>어린아이들에게는 \u003cb class=\"key\">반대의 \u003c/b>\u003cb class=\"key\">원리\u003c/b>가 매우 낯설고 생소한 개념입니다.\u003c/li>\u003cli>아이들은 단어와 그 의미를 상호 연결된 것이 아니라 \u003cb class=\"key\">개별적\u003c/b>으로 인식합니다.\u003c/li>\u003cli>왼쪽의 반대가 오른쪽이라는 \u003cb class=\"key\">논리적 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 이해하려면 발달 시간이 필요합니다.\u003c/li>\u003cli>성장 후에는 손이 아닌 도구로 먹으라는 식의 \u003cb class=\"key\">부정 \u003c/b>\u003cb class=\"key\">지시\u003c/b> 속 숨은 의도를 파악하게 됩니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Children do not inherently understand the logical connection between opposites because they perceive words separately from their meanings.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아이들은 단어와 의미를 분리하여 인식하므로, \u003cb class=\"key\">반대의 \u003c/b>\u003cb class=\"key\">원리\u003c/b>나 단어 사이의 \u003cb class=\"key\">논리적 \u003c/b>\u003cb class=\"key\">연결\u003c/b>을 이해하는 데 발달상의 시간이 필요합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":43,"text":"오늘은 아이들의 인지 발달과 반대 개념의 습득 과정을 알아보았습니다. 단어 사이의 논리적 연결이 아이들에게는 시간이 필요한 숙제였다는 점이 인상적이죠? 오늘 배운 연관성이라는 단어 connection과 혼란이라는 confusion 같은 핵심 표현들을 꼭 복습하시길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
