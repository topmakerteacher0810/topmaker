@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 33번","audioDir":"33_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">33번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>The Inseparable Loop: How Thinking Shapes Your Emotions\u003c/h1>\u003ch2>떼려야 뗄 수 없는 고리: 생각이 감정을 형성하는 방식\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>감정과 인지는 서로 독립된 것이 아니라 \u003cb class=\"key\">양방향성\u003c/b>을 가지고 영향을 주고받으며, 우리가 상황에 대한 \u003cb class=\"key\">사고방식\u003c/b>을 바꿈으로써 감정을 조절하고 유리하게 활용할 수 있다는 내용의 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Cognition and emotion are bi-directionally linked, allowing us to manage our emotional states by consciously reframing our thoughts.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 느끼는 감정이 어디서 오는지, 그리고 그 감정을 어떻게 하면 우리 마음대로 조절할 수 있는지에 대한 흥미로운 지문을 공부해 볼 거예요. 이 글의 핵심은 감정이 단순히 가슴에서 오는 게 아니라 우리가 흔히 생각이라고 부르는 인지에서 시작된다는 점입니다. 즉, 생각이 감정을 만들고 감정이 다시 생각을 만드는 순환 구조를 이해하는 것이 오늘의 목표예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">전통적으로 서구 철학에서는 이성과 감정을 칼로 무르듯 나누는 \u003cb class=\"key\">이분법적(dichotomous)\u003c/b> 사고가 강했습니다. 하지만 현대 심리학의 \u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">평가 \u003c/b>\u003cb class=\"key\">이론(Cognitive \u003c/b>\u003cb class=\"key\">Appraisal \u003c/b>\u003cb class=\"key\">Theory)\u003c/b>에 따르면, 우리가 어떤 사건을 어떻게 해석하느냐에 따라 느끼는 감정이 달라진다고 봅니다. 마치 같은 롤러코스터를 타면서도 누구는 '공포'를 느끼고 누구는 '스릴'을 느끼는 것과 같죠. 이 글은 이러한 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">재구성(Cognitive \u003c/b>\u003cb class=\"key\">Restructuring)\u003c/b>을 통해 우리가 감정의 주인이 될 수 있다는 점을 강조합니다. 즉, 감정은 통제 불가능한 본능이 아니라 \u003cb class=\"key\">사고의 \u003c/b>\u003cb class=\"key\">산물\u003c/b>이라는 관점을 제시하고 있습니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 하나 알아볼까요? 옛날 사람들은 차가운 머리는 이성, 뜨거운 가슴은 감정이라고 생각하며 이 둘을 완전히 나누어 보았죠. 이를 철학에서는 이분법적 사고라고 해요. 하지만 현대 심리학의 인지 평가 이론에서는 우리가 어떤 상황을 어떻게 해석하고 이름 붙이느냐에 따라 감정이 결정된다고 가르칩니다. 예를 들어, 무대 위에 오르기 전 심장이 뛰는 것을 불안이라고 해석하면 떨리지만, 준비되었다는 신호인 흥분으로 해석하면 힘이 나는 것과 같은 이치랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>통념 반박 및 주제 제시\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>감정과 이성이 반대라는 일반적인 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">비유\u003c/b>와 달리, 인지가 감정의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">구성 \u003c/b>\u003cb class=\"key\">요소\u003c/b>임을 선언하며 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>인지와 감정의 상호작용\u003csmall>근거 · 문장 2\u003c/small>\u003c/h4>\u003cp>사고방식이 감정을 형성하고, 다시 그 감정이 사고에 영향을 미치는 \u003cb class=\"key\">양방향성(bi-directionality)\u003c/b>의 원리를 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>시험 불안의 악순환 예시\u003csmall>예시 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>시험을 못 본다는 생각이 \u003cb class=\"key\">불안\u003c/b>을 키우고, 그 결과가 다시 부정적 생각의 \u003cb class=\"key\">근거\u003c/b>가 되어 인지와 감정이 분리될 수 없음을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>능동적 감정 조절과 활용\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>생각하는 방식을 바꿈으로써 어려운 감정을 \u003cb class=\"key\">조정\u003c/b>하고, 상황을 자신에게 \u003cb class=\"key\">유리하게\u003c/b> 이끌 수 있다는 해결책을 제시합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"자, 이제 지문이 어떻게 흘러가는지 전체적인 지도를 그려봅시다.","hl":null},{"n":4,"text":"첫 번째 문장에서는 감정과 이성이 반대라는 흔한 생각을 뒤집으며 인지가 감정의 핵심 구성 요소라는 강력한 주장을 던집니다. 우리가 생각하는 방식이 감정의 토대가 된다는 말이죠.","hl":"f0"},{"n":5,"text":"두 번째 문장에서는 인지와 감정의 양방향성을 설명합니다. 우리가 상황을 어떻게 생각하는지가 감정을 만들고, 그 만들어진 감정이 다시 우리의 사고방식에 메아리처럼 되돌아와 영향을 미치게 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 문장부터 다섯 번째 문장까지는 시험을 예로 들어 이 과정을 보여줍니다. 시험을 못 본다는 부정적인 생각은 불안을 키우고, 그 기분이 다시 부정적 생각의 근거가 되어 감정과 인지가 한 몸처럼 묶여버리는 악순환을 보여주죠.","hl":"f2"},{"n":7,"text":"마지막 여섯 번째와 일곱 번째 문장에서는 해결책을 제시합니다. 인지와 감정은 서로 연결되어 있으니까, 거꾸로 우리가 생각하는 방식을 바꿈으로써 힘든 감정을 조절하고 상황을 우리에게 유리하게 만들 수 있다고 강조하며 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 인지가 감정의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">요소\u003c/b>라는 핵심 주장을 던지고, 중간 부분에서 구체적인 시험 상황의 \u003cb class=\"key\">예시\u003c/b>를 통해 인지와 감정의 긴밀한 관계를 증명합니다. 마지막에 다시 한번 이러한 원리를 이용해 감정을 \u003cb class=\"key\">조절(adjust)\u003c/b>할 수 있다는 실용적인 결론을 내리고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For instance (3)\u003c/b>\u003cspan>구체적 예시 도입\u003c/span>\u003cb>In this way (5)\u003c/b>\u003cspan>앞선 내용 요약 및 결론 유도\u003c/span>\u003cb>By thinking differently (7)\u003c/b>\u003cspan>구체적 실천 방법 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">cognition\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">what we commonly refer to as thinking\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">how we think about our circumstances\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">changing the way we think\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">thinking differently\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음에 핵심 주장을 던지고 중간에 예시를 든 뒤 마지막에 다시 결론을 내리는 양괄식 구조를 취하고 있어요. 특히 원인과 결과가 서로 꼬리에 꼬리를 무는 인과 관계의 순환을 아주 잘 보여주는 글입니다. 주제문은 인지와 감정의 양방향성을 이용해 감정을 조절할 수 있다고 말하는 여섯 번째 문장으로 볼 수 있겠네요.","hl":"ty"},{"n":9,"text":"글의 흐름을 잡아주는 신호어들을 살펴볼까요? 세 번째 문장의 For instance는 시험이라는 구체적인 사례로 들어가는 문을 열어줍니다. 다섯 번째 문장의 In this way는 앞선 예시를 정리하며 감정과 인지가 뗄 수 없다는 점을 확정 짓죠. 마지막 일곱 번째 문장의 By thinking differently는 우리가 실질적으로 어떻게 행동해야 하는지 구체적인 방법을 알려주는 아주 중요한 표현입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>despite\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에도 불구하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>cultural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>문화적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>trope\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비유, 관용구\u003c/span>\u003c/div>\u003cdiv>\u003cb>depict\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묘사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opposite\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반대\u003c/span>\u003c/div>\u003cdiv>\u003cb>rational\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>합리적인, 이성적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>cognition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인지\u003c/span>\u003c/div>\u003cdiv>\u003cb>refer to A as B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B라고 일컫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>사실은\u003c/span>\u003c/div>\u003cdiv>\u003cb>building block\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구성 요소, 토대\u003c/span>\u003c/div>\u003cdiv>\u003cb>circumstance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상황, 환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>shape\u003c/b>\u003cem>동사\u003c/em>\u003cspan>형성하다, 모양을 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>echo back\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반향하다, 되돌아오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>influence\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anxiety\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불안\u003c/span>\u003c/div>\u003cdiv>\u003cb>increased\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>증가된\u003c/span>\u003c/div>\u003cdiv>\u003cb>performance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수행, 성과\u003c/span>\u003c/div>\u003cdiv>\u003cb>evidence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>근거, 증거\u003c/span>\u003c/div>\u003cdiv>\u003cb>pull apart\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>분리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bi-directionality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양방향성\u003c/span>\u003c/div>\u003cdiv>\u003cb>adjust\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조정하다, 조절하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nervous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긴장한, 초조한\u003c/span>\u003c/div>\u003cdiv>\u003cb>anticipation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기대, 예상\u003c/span>\u003c/div>\u003cdiv>\u003cb>pathway\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경로\u003c/span>\u003c/div>\u003cdiv>\u003cb>advantage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유리함, 이점\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 중요한 단어들을 몇 개 짚어볼게요. cognition은 인지라는 뜻으로 이 글의 주인공입니다. bi-directionality는 양방향성이라는 뜻인데, 인지와 감정이 서로 영향을 주고받는다는 이 글의 핵심 개념이죠. 그리고 adjust는 조정하다라는 뜻으로, 우리가 능동적으로 감정을 다스릴 수 있다는 점을 보여줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">cognition\u003c/b>\u003cspan class=\"m\">인지\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">perception\u003c/span>\u003cspan class=\"s\">awareness\u003c/span>\u003cspan class=\"s\">reasoning\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rational\u003c/b>\u003cspan class=\"m\">합리적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">logical\u003c/span>\u003cspan class=\"s\">sensible\u003c/span>\u003cspan class=\"s\">reasonable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">irrational\u003c/span>\u003cspan class=\"a\">illogical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">adjust\u003c/b>\u003cspan class=\"m\">조정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">regulate\u003c/span>\u003cspan class=\"s\">modify\u003c/span>\u003cspan class=\"s\">alter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">anxiety\u003c/b>\u003cspan class=\"m\">불안\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">apprehension\u003c/span>\u003cspan class=\"s\">unease\u003c/span>\u003cspan class=\"s\">nervousness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">confidence\u003c/span>\u003cspan class=\"a\">calmness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">shape\u003c/b>\u003cspan class=\"m\">형성하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mold\u003c/span>\u003cspan class=\"s\">form\u003c/span>\u003cspan class=\"s\">determine\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해봅시다. cognition은 생각이나 지각을 뜻하는 thinking이나 perception과 같이 쓰일 수 있어요. 불안을 뜻하는 anxiety는 nervousness로 바꿔 쓸 수 있고, 반대말은 자신감인 confidence나 평온함인 calmness가 되겠죠. 조절하다라는 뜻의 adjust는 regulate나 modify 같은 단어로도 시험에 자주 등장하니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문화적인 비유적 표현에도 불구하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Despite\u003c/span> the cultural trope\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 감정을 합리적인 사고의 반대로 묘사하는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">depicting\u003c/span> emotions as the opposite of rational thought,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 우리가 흔히 생각이라고 일컫는 것, 즉 인지는\u003c/span>\u003cspan class=\"en\">cognition ― \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">commonly \u003c/span>\u003cspan class=\"tgt\">refer \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> thinking ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 사실 감정의 핵심 구성 요소이다.\u003c/span>\u003cspan class=\"en\">is actually a key building block of emotion.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">감정을 합리적인 사고의 반대로 묘사하는 문화적인 비유적 표현에도 불구하고, 우리가 흔히 생각이라고 일컫는 것, 즉 인지는 사실 감정의 핵심 구성 요소이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 감정과 이성을 대립 관계로 보는 통념과 달리, \u003cb class=\"key\">인지\u003c/b>가 감정을 형성하는 본질적인 \u003cb class=\"key\">구성 \u003c/b>\u003cb class=\"key\">요소\u003c/b>임을 강조하는 도입부입니다. 감정의 발생 원리에 \u003cb class=\"key\">생각\u003c/b>이 깊게 개입하고 있음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사\u003c/span> : Despite + 명사(구) : \"~에도 불구하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 (명사 수식)\u003c/span> : 명사(trope) + 현재분사(-ing) : \"~를 묘사하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 what (선행사 포함)\u003c/span> : what + 주어 + 동사 + 전치사(as) : \"우리가 흔히 ~라고 일컫는 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Despite the cultural trope, 문화적인 비유적 표현에도 불구하고.  depicting emotions as the opposite of rational thought,  감정을 합리적인 사고의 반대로 묘사하는.  cognition ― what we commonly refer to as thinking ―,  우리가 흔히 생각이라고 일컫는 것, 즉 인지는.  is actually a key building block of emotion,  사실 감정의 핵심 구성 요소이다.. 이 문장 전체를 해석하면, 감정을 합리적인 사고의 반대로 묘사하는 문화적인 비유적 표현에도 불구하고, 우리가 흔히 생각이라고 일컫는 것, 즉 인지는 사실 감정의 핵심 구성 요소이다.","hl":"m"},{"n":13,"text":"보통 우리는 감정과 이성이 반대라고 생각하죠. 하지만 이 문장은 인지 즉 생각이 감정을 만드는 아주 중요한 기초가 된다고 설명하며 글을 시작하고 있어요.","hl":"mn"},{"n":14,"text":"첫 번째로 Despite는 전치사라서 뒤에 명사구만 와야 해요. 두 번째로 나오는 depicting은 앞에 있는 trope를 꾸며주는 현재분사로 능동의 의미를 담고 있죠. 세 번째로 what은 우리가 무엇이라고 부르는 것이라는 의미로 쓰여서 cognition의 의미를 보충 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 우리의 상황에 대해 생각하는 방식은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">think\u003c/span> about our circumstances\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 우리가 경험하는 감정을 형성한다;\u003c/span>\u003cspan class=\"en\">shapes the \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">emotions \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">experience\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그다음에 그 감정들은 반향되어\u003c/span>\u003cspan class=\"en\">then those emotions echo back\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 우리가 생각하는 방식에 영향을 미친다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">influence\u003c/span> how we think.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 우리의 상황에 대해 ‘생각하는’ 방식은 우리가 경험하는 감정을 형성한다. 그다음에 그 감정들은 반향되어 우리가 생각하는 방식에 영향을 미친다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인지와 감정의 \u003cb class=\"key\">상호작용\u003c/b>을 설명합니다. 생각이 감정을 만들고, 그 감정이 다시 \u003cb class=\"key\">사고 \u003c/b>\u003cb class=\"key\">방식\u003c/b>에 영향을 주는 \u003cb class=\"key\">양방향성\u003c/b>을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문/명사절\u003c/span> : 의문사(How) + 주어(we) + 동사(think) : \"우리가 생각하는 방식\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : 명사(emotions) + (which/that) + 주어 + 동사 : \"우리가 경험하는 감정\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (결과)\u003c/span> : echo back + to부정사 : \"(결국) ~에 영향을 미친다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"How we think about our circumstances, 우리가 우리의 상황에 대해 생각하는 방식은.  shapes the emotions we experience,  우리가 경험하는 감정을 형성한다;.  then those emotions echo back,  그다음에 그 감정들은 반향되어.  to influence how we think,  우리가 생각하는 방식에 영향을 미친다.. 이 문장 전체를 해석하면, 우리가 우리의 상황에 대해 ‘생각하는’ 방식은 우리가 경험하는 감정을 형성한다. 그다음에 그 감정들은 반향되어 우리가 생각하는 방식에 영향을 미친다.","hl":"m"},{"n":16,"text":"생각이 감정을 만들고 그 감정이 다시 우리의 생각으로 되돌아오는 순환 구조를 보여줍니다. 즉 인지와 감정은 서로 떼어놓을 수 없는 관계라는 것이죠.","hl":"mn"},{"n":17,"text":"첫 번째로 How we think는 문장 전체의 주어로 쓰인 명사절이에요. 두 번째로 emotions와 we experience 사이에는 목적격 관계대명사가 숨어 있어서 뒤에서 앞으로 수식하죠. 세 번째로 to influence는 감정이 되돌아와서 결국 영향을 미치게 된다는 결과의 의미를 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 만약 여러분이 시험을 보러 걸어 들어간다면\u003c/span>\u003cspan class=\"en\">For instance, if you walk into a test\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 여러분이 시험 보는 것을 잘 못한다고 생각하며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">thinking\u003c/span> you are bad at taking tests,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 여러분의 불안은 증가할 것이다.\u003c/span>\u003cspan class=\"en\">your anxiety will \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">increased\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 만약 여러분이 시험 보는 것을 잘 못한다고 생각하며 시험을 보러 걸어 들어간다면, 여러분의 불안은 증가할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인지가 감정에 영향을 미치는 구체적인 \u003cb class=\"key\">예시\u003c/b>를 제시합니다. '시험을 못 본다'는 부정적인 \u003cb class=\"key\">인지\u003c/b>가 '불안'이라는 \u003cb class=\"key\">감정\u003c/b>을 증폭시키는 과정을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : V + -ing : \"~라고 생각하며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be + 과거분사(p.p.) : \"증가될 것이다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"For instance, if you walk into a test, 예를 들어, 만약 여러분이 시험을 보러 걸어 들어간다면.  thinking you are bad at taking tests,  여러분이 시험 보는 것을 잘 못한다고 생각하며.  your anxiety will be increased,  여러분의 불안은 증가할 것이다.. 이 문장 전체를 해석하면, 예를 들어, 만약 여러분이 시험 보는 것을 잘 못한다고 생각하며 시험을 보러 걸어 들어간다면, 여러분의 불안은 증가할 것이다.","hl":"m"},{"n":19,"text":"시험을 잘 못 볼 것 같다는 부정적인 생각이 실제로 우리 마음속의 불안감을 더 키울 수 있다는 예시를 들어주고 있어요.","hl":"mn"},{"n":20,"text":"첫 번째로 thinking은 문장 중간에 쓰여서 뭐뭐라는 생각을 하면서라는 부연 설명을 하는 분사구문이에요. 두 번째로 be increased는 불안감이 스스로 늘어나는 게 아니라 생각 때문에 늘어나게 되는 거라서 수동태로 표현했어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 기분이 좋지 않고\u003c/span>\u003cspan class=\"en\">you don't feel good\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 시험에서 자신의 수행에 대해\u003c/span>\u003cspan class=\"en\">about your performance on the test,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 근거가 된다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">becomes \u003c/span>\u003cspan class=\"tgt\">evidence\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각하는 것을 지속하는\u003c/span>\u003cspan class=\"en\">for \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">continuing \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 시험 보는 것을 잘 못한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">you're \u003c/span>\u003cspan class=\"tgt\">bad\u003c/span> at test taking.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 여러분은 그 시험에서 자신의 수행에 대해 기분이 좋지 않고, 그것은 여러분이 시험 보는 것을 잘 못한다고 ‘생각하는’ 것을 지속하는 근거가 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부정적인 생각이 실제 수행 결과에 영향을 미치고, 그 결과가 다시 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 정당화하는 \u003cb class=\"key\">악순환\u003c/b>의 과정을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사\u003c/span> : [that (지시대명사)] + [becomes (동사)] : \"그것은 근거가 된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사와 to부정사의 목적어\u003c/span> : [for (전치사)] + [continuing (동명사)] + [to think (to부정사/목적어)] : \"생각하는 것을 지속하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : [think (타동사)] + [that (접속사)] + [S + V (완전한 문장)] : \"여러분이 잘 못한다고 생각하다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Then, 그러면. you don't feel good, 여러분은 기분이 좋지 않고. about your performance on the test, 그 시험에서 자신의 수행에 대해. and that becomes evidence, 그것은 근거가 된다. for continuing to think, 생각하는 것을 지속하는. that you're bad at test taking, 여러분이 시험 보는 것을 잘 못한다고. 이 문장 전체를 해석하면, 그러면 여러분은 그 시험에서 자신의 수행에 대해 기분이 좋지 않고, 그것은 여러분이 시험 보는 것을 잘 못한다고 ‘생각하는’ 것을 지속하는 근거가 된다.","hl":"m"},{"n":22,"text":"시험 결과가 안 좋으면 '거봐, 나는 역시 시험을 못 봐'라며 스스로의 부정적인 생각을 정당화하게 된다는 내용이에요. 생각이 감정에 영향을 주고, 그 결과가 다시 부정적 생각을 굳히는 증거가 되는 과정을 보여주죠.","hl":"mn"},{"n":23,"text":"첫 번째로 that은 앞 문장 내용을 가리키는 지시대명사로 쓰였어요. 두 번째로 전치사 for 뒤에는 동명사 continuing이 와야 하고, 마지막으로 think 뒤에 나오는 that은 명사절 접속사로 쓰였다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 식으로\u003c/span>\u003cspan class=\"en\">In this way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결코 할 수 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there's \u003c/span>\u003cspan class=\"tgt\">simply \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감정과 인지를 분리하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">pulling\u003c/span> emotion and cognition apart.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 식으로 감정과 인지는 결코 분리할 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 감정과 인지가 서로 꼬리에 꼬리를 물고 영향을 주고받으므로, 둘을 \u003cb class=\"key\">독립된 \u003c/b>\u003cb class=\"key\">개체\u003c/b>로 \u003cb class=\"key\">분리\u003c/b>하는 것이 불가능하다는 결론입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 관용 표현 (There is no -ing)\u003c/span> : There is no [동사-ing] = It is impossible to [동사원형] : \"분리하는 것은 결코 불가능하다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In this way, 이런 식으로. there's simply no, 결코 할 수 없다. pulling emotion and cognition apart, 감정과 인지를 분리하는 것은. 이 문장 전체를 해석하면, 이런 식으로 감정과 인지는 결코 분리할 수 없다.","hl":"m"},{"n":25,"text":"앞서 말한 순환 관계 때문에 감정과 인지는 결코 따로 떼어 생각할 수 없다는 뜻이에요. 이 글의 핵심인 인지와 감정의 밀접한 관계를 요약하는 문장이지요.","hl":"mn"},{"n":26,"text":"여기에서 There is no pulling은 동명사 관용 표현으로 무엇을 하는 것이 불가능하다는 의미를 전달해요. pull apart는 분리하다라는 뜻의 구동사라는 것도 함께 체크해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 양방향성은\u003c/span>\u003cspan class=\"en\">This bi­directionality\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인지와 감정의\u003c/span>\u003cspan class=\"en\">of cognition and emotion\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 가능하게 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">allows \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어려운 감정들을 조정하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">adjust\u003c/span> difficult emotions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방식을 바꿈으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">changing\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 생각하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인지와 감정의 이러한 양방향성은 우리가 생각하는 방식을 바꿈으로써 어려운 감정들을 조정하는 것을 가능하게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인지와 감정이 서로 영향을 주고받는 성질을 이용해, \u003cb class=\"key\">생각의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 통해 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 제어할 수 있다는 핵심 해결책을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">allow + 목적어 + to부정사\u003c/span> : allow [목적어] + [to-v (목적격 보어)] : \"우리가 조정하는 것을 가능하게 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">by + 동명사\u003c/span> : by [동사-ing] : \"바꿈으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계부사의 대용/생략\u003c/span> : the way + [S + V (관계부사절)] : \"우리가 생각하는 방식\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This bi­directionality, 이러한 양방향성은. of cognition and emotion, 인지와 감정의. allows us, 우리를 가능하게 한다. to adjust difficult emotions, 어려운 감정들을 조정하는 것을. by changing the way, 방식을 바꿈으로써. we think, 우리가 생각하는. 이 문장 전체를 해석하면, 인지와 감정의 이러한 양방향성은 우리가 생각하는 방식을 바꿈으로써 어려운 감정들을 조정하는 것을 가능하게 한다.","hl":"m"},{"n":28,"text":"감정이 생각을 바꾸듯 생각도 감정을 바꿀 수 있다는 양방향성을 강조해요. 우리가 생각하는 방식을 능동적으로 바꾼다면 힘든 감정도 다룰 수 있다는 희망적인 메시지죠.","hl":"mn"},{"n":29,"text":"첫 번째로 allow는 목적격 보어로 to부정사를 취하는 대표적인 동사예요. 두 번째로 the way 뒤에는 관계부사 how를 함께 쓸 수 없어서 생략되어 있다는 점이 시험에 아주 자주 나옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다르게 생각함으로써 ―\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">thinking\u003c/span> differently ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘나는 때때로 긴장하지만, 여전히 시험 보는 것을 잘하는 사람이다,’\u003c/span>\u003cspan class=\"en\">I get nervous sometimes, but I'm still a good test taker,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘혹은 그 긴장되는 느낌은 단지 흥분과 기대이며,’\u003c/span>\u003cspan class=\"en\">or that nervous feeling is just excitement and anticipation,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘그것은 내가 준비되었다는 것을 의미한다’라고 ―\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">ready\u003c/span> ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 그러한 경로들을 여러분에게 유리하게 작동시킬 수 있다.\u003c/span>\u003cspan class=\"en\">you can work those pathways \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">advantage\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘나는 때때로 긴장하지만, 여전히 시험 보는 것을 잘하는 사람이다.’ 혹은 ‘그 긴장되는 느낌은 단지 흥분과 기대이며, 그것은 내가 준비되었다는 것을 의미한다.’라고 다르게 생각함으로써, 여러분은 그러한 경로들을 여러분에게 유리하게 작동시킬 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인지가 감정을 조절할 수 있다는 원리를 구체적인 \u003cb class=\"key\">사고의 \u003c/b>\u003cb class=\"key\">전환\u003c/b> 사례를 통해 보여주는 문장입니다. 스스로에게 긍정적인 \u003cb class=\"key\">프레이밍\u003c/b>을 함으로써 감정적 반응을 조절하고 상황을 자신에게 \u003cb class=\"key\">유리하게\u003c/b> 이끌 수 있음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">by + 동명사\u003c/span> : by + [V-ing (동명사구)] : \"생각함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that의 생략\u003c/span> : means [동사] + [(that) + S + V (목적어절)] : \"그것은 내가 준비되었다는 것을 의미한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 관용 표현\u003c/span> : to + [one's advantage] : \"여러분에게 유리하게\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"By thinking differently ―, 다르게 생각함으로써 ―. I get nervous sometimes, but I'm still a good test taker, ‘나는 때때로 긴장하지만, 여전히 시험 보는 것을 잘하는 사람이다,’. or that nervous feeling is just excitement and anticipation, ‘혹은 그 긴장되는 느낌은 단지 흥분과 기대이며,’. it means I'm ready ―, ‘그것은 내가 준비되었다는 것을 의미한다’라고 ―. you can work those pathways to your advantage, 여러분은 그러한 경로들을 여러분에게 유리하게 작동시킬 수 있다.. 이 문장 전체를 해석하면, ‘나는 때때로 긴장하지만, 여전히 시험 보는 것을 잘하는 사람이다.’ 혹은 ‘그 긴장되는 느낌은 단지 흥분과 기대이며, 그것은 내가 준비되었다는 것을 의미한다.’라고 다르게 생각함으로써, 여러분은 그러한 경로들을 여러분에게 유리하게 작동시킬 수 있다.","hl":"m"},{"n":31,"text":"이 문장은 우리가 인지, 즉 생각하는 방식을 바꾸면 감정도 조절할 수 있다는 것을 아주 구체적으로 보여줍니다. 긴장을 부정적인 불안이 아니라 긍정적인 흥분이나 준비 상태로 다시 이름 붙이는 사고의 전환이 핵심이에요.","hl":"mn"},{"n":32,"text":"첫 번째로 문장 맨 앞의 By thinking은 전치사 By와 동명사가 만나서 방법을 나타내는 수단이나 방법의 의미를 전달합니다. 두 번째로 it means 뒤에는 접속사 that이 생략되어 있는데, 내가 준비되었다는 것을 의미한다는 목적어 절을 이끌고 있어요. 세 번째로 to your advantage는 수거처럼 외워두면 좋은 표현으로, 여러분에게 유리하게라고 해석하면 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>감정은 이성과 반대되는 개념이 아니라, \u003cb class=\"key\">인지\u003c/b>가 감정을 구성하는 핵심적인 토대이다.\u003c/li>\u003cli>상황에 대한 우리의 해석인 사고방식이 감정을 만들고, 형성된 감정은 다시 \u003cb class=\"key\">사고\u003c/b>에 피드백을 준다.\u003c/li>\u003cli>시험 불안의 예시처럼 부정적인 생각과 감정은 서로를 강화하며 결코 \u003cb class=\"key\">분리될 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 관계를 맺는다.\u003c/li>\u003cli>이러한 상호 관계를 이해하고 \u003cb class=\"key\">사고방식\u003c/b>을 긍정적으로 전환함으로써 우리는 감정을 다스리고 활용할 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Cognition and emotion are bi-directionally linked, allowing us to manage our emotional states by consciously reframing our thoughts.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">감정과 인지는 서로 독립된 것이 아니라 \u003cb class=\"key\">양방향성\u003c/b>을 가지고 영향을 주고받으며, 우리가 상황에 대한 \u003cb class=\"key\">사고방식\u003c/b>을 바꿈으로써 감정을 조절하고 유리하게 활용할 수 있다는 내용의 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"자, 오늘 공부한 내용을 정리해봅시다. 감정은 통제할 수 없는 본능이 아니라, 우리의 생각에 의해 형성되는 인지적 산물입니다. 따라서 시험이나 중요한 일을 앞두고 떨릴 때, 그 떨림을 불안이 아닌 준비된 열정으로 다르게 생각해보세요. 여러분의 인지를 바꾸면 감정도 여러분의 편이 될 것입니다. 오늘 수업 듣느라 고생 많았어요!","hl":null}]}]});</script></body></html>
