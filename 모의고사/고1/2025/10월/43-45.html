<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고1 모의고사 43~45 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고1 모의고사 43~45","audioDir":"43-45_audio","preview":false,"count":88,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.935em\">43~45\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>The True Measure of Wealth: Giving When You Have Little\u003c/h1>\u003ch2>부의 진정한 척도: 가진 것이 없을 때 베푸는 것\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>억만장자 제임스가 과거 자신이 어려웠을 때 대가 없이 신문을 주었던 데이비드에게 보답하려 하나, 데이비드는 \u003cb class=\"key\">풍요\u003c/b> 속의 베풂보다 \u003cb class=\"key\">결핍\u003c/b> 속의 베풂이 진정한 \u003cb class=\"key\">부\u003c/b>임을 일깨워 줍니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>True wealth is defined not by how much money one has, but by the willingness to give to others even when one has very little.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 억만장자 제임스 워커와 신문 가판대 소년 데이비드의 감동적인 이야기를 통해 진정한 부의 의미를 배워볼 거예요. 이 지문의 핵심은 우리가 무엇을 가졌을 때보다, 가지지 못했을 때의 행동이 우리를 정의한다는 점입니다. 오늘 수업을 통해 나눔의 가치와 부의 재정의를 함께 살펴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 도덕 철학에서 다루는 \u003cb class=\"key\">이타주의\u003c/b>(Altruism)와 '진정한 희생'의 가치를 다루고 있습니다. 흔히 우리는 경제적 여유가 생겼을 때 남을 돕는 것을 \u003cb class=\"key\">자선\u003c/b>(Charity)이라고 생각하지만, 이 지문은 결핍의 상황에서 행하는 나눔이 더 큰 가치를 지닌다고 설명합니다. 마치 배가 아주 고픈 상태에서 자신의 마지막 빵 한 조각을 나누는 것이, 배부른 사람이 남은 빵을 주는 것보다 훨씬 더 큰 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>(Moral Value)를 지니는 것과 같은 이치입니다. 현대 사회에서는 이를 \u003cb class=\"key\">편의적 \u003c/b>\u003cb class=\"key\">관대함\u003c/b>(Generosity at convenience)과 진정한 나눔으로 구분하여 성찰하게 합니다.\u003c/div>","segs":[{"n":2,"text":"혹시 이타주의라는 말을 들어본 적 있나요? 보통 우리는 엄청난 부자들이 기부하는 것을 보고 대단하다고 생각하죠. 하지만 사회 심리학적으로 보면, 모든 것을 가진 사람이 일부를 떼어주는 것보다, 당장 내일 먹을 것이 없는 사람이 자신의 절반을 나누는 것이 훨씬 더 큰 도덕적 에너지를 필요로 합니다. 일상적인 비유를 들자면, 지갑에 만 원밖에 없는데 친구에게 오천 원짜리 밥을 사주는 친구가 진짜 의리 있는 친구인 것과 비슷해요. 이런 관점을 영어로는 Generosity at convenience, 즉 편의적 관대함과 대비해서 생각해볼 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>과거의 기억\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>억만장자 제임스가 기자에게 자신보다 더 \u003cb class=\"key\">부유한\u003c/b> 사람인 데이비드와의 첫 만남을 \u003cb class=\"key\">회상\u003c/b>하며 이야기를 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>호의의 경험\u003csmall>예시 · 문장 3–12\u003c/small>\u003c/h4>\u003cp>무일푼이었던 제임스에게 가판대 소년 데이비드가 아무런 \u003cb class=\"key\">보답\u003c/b>도 기대하지 않고 두 번이나 신문을 \u003cb class=\"key\">선물\u003c/b>로 주었던 일화입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>재회와 제안\u003csmall>전환 · 문장 13–16\u003c/small>\u003c/h4>\u003cp>세월이 흘러 성공한 제임스가 데이비드를 찾아가 원하는 것은 무엇이든 주겠다며 \u003cb class=\"key\">보답\u003c/b>하겠다고 \u003cb class=\"key\">제안\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>거절의 이유\u003csmall>주장 · 문장 17–22\u003c/small>\u003c/h4>\u003cp>데이비드는 제임스의 제안이 \u003cb class=\"key\">편의에 \u003c/b>\u003cb class=\"key\">따른 \u003c/b>\u003cb class=\"key\">관대함\u003c/b>일 뿐이라며, 자신이 베풀었던 \u003cb class=\"key\">희생적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>와는 비교될 수 없다고 거절합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>부의 진정한 정의\u003csmall>결론 · 문장 23–25\u003c/small>\u003c/h4>\u003cp>제임스는 돈이 아닌, \u003cb class=\"key\">가진 \u003c/b>\u003cb class=\"key\">게 \u003c/b>\u003cb class=\"key\">없을 \u003c/b>\u003cb class=\"key\">때\u003c/b>조차 나누려는 \u003cb class=\"key\">의지\u003c/b>가 사람을 부유하게 만든다는 진리를 깨닫습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 시간의 흐름에 따라 제임스와 데이비드의 두 번의 만남과 그로 인한 깨달음을 보여주고 있습니다.","hl":null},{"n":4,"text":"첫 번째 단계에서는 억만장자가 된 제임스가 한 기자로부터 누가 당신보다 부자냐는 질문을 받고 과거를 회상하며 데이비드를 소개하는 도입부입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 과거 회상 장면이죠. 제임스가 무일푼으로 공항에 있었을 때, 데이비드라는 소년이 아무런 대가 없이 두 번이나 신문을 선물로 주었던 따뜻한 경험을 설명합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서 세월이 흘러 부자가 된 제임스는 데이비드를 찾아가 감사를 표하며 그가 원하는 것은 무엇이든 주겠다고 제안하지만, 예상치 못한 답변을 듣게 됩니다.","hl":"f2"},{"n":7,"text":"네 번째 단계가 이 글의 핵심인 클라이맥스입니다. 데이비드는 제임스의 보답이 풍요로운 상태에서 하는 편의적 관대함일 뿐이라며, 진정으로 자신에게 보답할 수는 없다고 말하며 거절합니다.","hl":"f3"},{"n":8,"text":"마지막 다섯 번째 단계에서 제임스는 큰 깨달음을 얻습니다. 진정으로 사람을 부유하게 만드는 것은 많이 가진 상태가 아니라, 아주 적게 가졌을 때조차 베풀려는 기꺼이 하는 마음이라는 사실을요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시 및 비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 24번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">제임스와 데이비드의 과거와 현재 상황을 \u003cb class=\"key\">비교\u003c/b>하며 이야기가 전개됩니다. 특히 데이비드의 대사를 통해 '가진 게 없을 때의 나눔'과 '모든 게 있을 때의 나눔'을 \u003cb class=\"key\">대조\u003c/b>하여 주제를 부각합니다. 마지막 문장에서 제임스가 깨달은 바를 명시하며 \u003cb class=\"key\">주제\u003c/b>를 완성하는 미괄식 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Years ago (3)\u003c/b>\u003cspan>과거 시점 제시\u003c/span>\u003cb>Three months later (11)\u003c/b>\u003cspan>시간의 경과\u003c/span>\u003cb>Years passed (13)\u003c/b>\u003cspan>시간의 경과 및 상황 반전\u003c/span>\u003cb>Because (19)\u003c/b>\u003cspan>이유 설명\u003c/span>\u003cb>And so (25)\u003c/b>\u003cspan>최종 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">David\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the young man\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the richest person\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">James\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">billionaire\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">wealthy businessman\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>데이비드의 나눔\u003c/th>\u003cth>제임스의 보답\u003c/th>\u003c/tr>\u003ctr>\u003ctd>가진 게 거의 없을 때\u003c/td>\u003ctd>모든 것을 가졌을 때\u003c/td>\u003c/tr>\u003ctr>\u003ctd>진정한 희생\u003c/td>\u003ctd>편의에 따른 관대함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>보답을 기대하지 않음\u003c/td>\u003ctd>과거의 빚을 갚으려 함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 지문은 과거와 현재를 오가는 시간 순 구성과 동시에, 두 인물의 상반된 상황을 대조하는 방식을 취하고 있습니다. 마지막에 주인공의 깨달음을 배치한 전형적인 미괄식 구조를 보여주고 있네요.","hl":"ty"},{"n":10,"text":"문장 곳곳에 시간의 흐름을 나타내는 표현들이 보입니다. 세 번째 문장의 Years ago나 열한 번째 문장의 Three months later, 그리고 열세 번째 문장의 Years passed 같은 표현들이 이야기의 전개를 이끌고 있어요. 또한 열아홉 번째 문장의 Because와 마지막 문장의 And so는 원인과 결론을 명확히 짚어주는 신호어 역할을 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>billionaire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>억만장자\u003c/span>\u003c/div>\u003cdiv>\u003cb>journalist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기자\u003c/span>\u003c/div>\u003cdiv>\u003cb>reply\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대답하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>broke\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무일푼의\u003c/span>\u003c/div>\u003cdiv>\u003cb>stuck\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>갇힌, 꼼짝 못 하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>kill time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시간을 때우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>headline\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표제, 기사 제목\u003c/span>\u003c/div>\u003cdiv>\u003cb>newsstand\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신문 가판대\u003c/span>\u003c/div>\u003cdiv>\u003cb>catch one's eye\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>눈길을 끌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hesitate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주저하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in return\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>보답으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>wealthy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부유한\u003c/span>\u003c/div>\u003cdiv>\u003cb>bookstore\u003c/b>\u003cem>명사\u003c/em>\u003cspan>서점\u003c/span>\u003c/div>\u003cdiv>\u003cb>introduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소개하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wish\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소원, 바라는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>truly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>진정으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>compensate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보상하다, 보답하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>offer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다, 제안하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>generosity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관대함\u003c/span>\u003c/div>\u003cdiv>\u003cb>convenience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>편의, 편리함\u003c/span>\u003c/div>\u003cdiv>\u003cb>accept\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수락하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>realize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨닫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>remember\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기억하다, 회상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>willingness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기꺼이 하려는 마음, 의지\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어들을 살펴볼까요? 우선 broke는 돈이 한 푼도 없는 상태를 말합니다. 또 David가 제임스의 제안을 거절하며 쓴 표현인 generosity at convenience, 즉 편의에 따른 관대함이라는 표현은 이 글의 주제와 직결되는 핵심 문구이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">wealthy\u003c/b>\u003cspan class=\"m\">부유한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rich\u003c/span>\u003cspan class=\"s\">affluent\u003c/span>\u003cspan class=\"s\">prosperous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">poor\u003c/span>\u003cspan class=\"a\">broke\u003c/span>\u003cspan class=\"a\">penniless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">broke\u003c/b>\u0 lass=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">once \u003c/span>\u003cspan class=\"tgt\">asked\u003c/span> by a journalist,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;당신보다 더 부유한 사람이 있습니까?&quot;라고,\u003c/span>\u003cspan class=\"en\">&quot;Is there anyone richer than you?&quot;,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 대답했다,\u003c/span>\u003cspan class=\"en\">he replied,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;네, 한 젊은이가 있습니다\u003c/span>\u003cspan class=\"en\">&quot;Yes, there is one young man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 결코 잊지 못할.&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I'll \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">forget\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공항에서 David를 처음 만났을 때의 이야기를 들려주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부의 진정한 의미에 대한 \u003cb class=\"key\">호기심\u003c/b>을 자극하며 이야기를 시작하는 도입부입니다. 자신보다 더 \u003cb class=\"key\">부유한 \u003c/b>\u003cb class=\"key\">존재\u003c/b>가 있다는 답변을 통해 독자의 관심을 집중시킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 (was) + 과거분사 (asked) : \"질문을 받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : 명사 (one young man) + [주어 + 동사] : \"내가 결코 잊지 못할\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"When billionaire James Walker, 억만장자 James Walker가. was once asked by a journalist, 한 기자로부터 질문을 한 번 받았을 때. \"Is there anyone richer than you?\", \"당신보다 더 부유한 사람이 있습니까?\"라고. he replied, 그는 대답했다. \"Yes, there is one young man, \"네, 한 젊은이가 있습니다. I'll never forget.\", 제가 결코 잊지 못할.\". 이 문장 전체를 해석하면, 공항에서 David를 처음 만났을 때의 이야기를 들려주었다.","hl":"m"},{"n":14,"text":"이 문장은 억만장자가 자신보다 더 부유한 사람이 있다고 말하며 시작됩니다. 독자들에게 진짜 부자란 무엇인지 호기심을 느끼게 만드는 장치죠.","hl":"mn"},{"n":15,"text":"첫 번째 문법 포인트는 was once asked입니다. 주어가 질문을 받은 수동의 상태라서 수동태를 썼어요. 두 번째는 young man 뒤에 목적어가 빠진 구조인 I'll never forget인데요. 목적격 관계대명사가 생략되어 젊은이를 수식하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 이야기를 들려주었다\u003c/span>\u003cspan class=\"en\">He told the story\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 David를 처음 만났을 때의\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">met \u003c/span>\u003cspan class=\"tgt\">David\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뉴욕 공항에서.\u003c/span>\u003cspan class=\"en\">at a New York airport.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수년 전, James는 무일푼으로 공항에 묶인 채, 신문 가판대에 있는 신문 제목들을 읽으며 무료한 시간을 보내고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 본격적인 일화가 시작되는 \u003cb class=\"key\">장면 \u003c/b>\u003cb class=\"key\">전환\u003c/b> 문장입니다. 이야기의 배경이 되는 \u003cb class=\"key\">뉴욕 \u003c/b>\u003cb class=\"key\">공항\u003c/b>과 핵심 인물인 David를 소개합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사절(간접의문문)\u003c/span> : 전치사 (of) + [의문사 (when) + 주어 + 동사] : \"그가 처음 데이비드를 만났을 때\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"He told the story, 그는 이야기를 들려주었다. of when he first met David, 그가 David를 처음 만났을 때의. at a New York airport, 뉴욕 공항에서.. 이 문장 전체를 해석하면, 수년 전, James는 무일푼으로 공항에 묶인 채, 신문 가판대에 있는 신문 제목들을 읽으며 무료한 시간을 보내고 있었다.","hl":"m"},{"n":17,"text":"이제 이야기는 과거의 뉴욕 공항으로 거슬러 올라갑니다. 두 사람의 인연이 시작된 시점과 장소를 명확하게 보여주는 부분이에요.","hl":"mn"},{"n":18,"text":"여기서 of 뒤에 나오는 when he first met David는 전치사의 목적어 자리에 쓰인 명사절입니다. 의문사 주어 동사의 어순으로 쓰여 그가 언제 만났는지에 대한 내용을 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수년 전,\u003c/span>\u003cspan class=\"en\">Years ago,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">James는 무일푼으로 묶여 있었다\u003c/span>\u003cspan class=\"en\">James was \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">broke \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">stuck\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공항에,\u003c/span>\u003cspan class=\"en\">at the airport,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무료한 시간을 보내며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">killing \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신문 제목들을 읽으며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">reading\u003c/span> newspaper headlines\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신문 가판대에 있는.\u003c/span>\u003cspan class=\"en\">at the newsstand.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 기사 제목이 (a)그(James)의 시선을 사로잡았지만, 그는 신문을 살 돈이 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 성공하기 전 James의 \u003cb class=\"key\">어려웠던 \u003c/b>\u003cb class=\"key\">처지\u003c/b>를 묘사합니다. 돈이 없어 신문을 읽는 것으로 시간을 보내는 \u003cb class=\"key\">대조적인 \u003c/b>\u003cb class=\"key\">과거\u003c/b>를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사 보어의 병렬 구조\u003c/span> : be동사 (was) + [형용사 (broke) + and + 과거분사 (stuck)] : \"무일푼이고 묶여 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : [v-ing (killing)] + [v-ing (reading)] : \"시간을 때우며 ... 읽으며\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Years ago, 수년 전. James was broke and stuck, James는 무일푼으로 묶여 있었다. at the airport, 공항에. killing time, 무료한 시간을 보내며. reading newspaper headlines, 신문 제목들을 읽으며. at the newsstand, 신문 가판대에 있는.. 이 문장 전체를 해석하면, 한 기사 제목이 (a)그(James)의 시선을 사로잡았지만, 그는 신문을 살 돈이 없었다.","hl":"m"},{"n":20,"text":"지금의 억만장자와는 정반대로, 과거의 제임스는 돈도 없고 공항에 갇혀 할 일도 없는 아주 초라한 상태였음을 보여줍니다.","hl":"mn"},{"n":21,"text":"먼저 broke and stuck은 제임스의 상태를 보충 설명하는 형용사들이 병렬로 연결된 거예요. 그 뒤에 나오는 killing time은 주어의 동작을 나타내는 분사구문입니다. 시간을 보내면서 신문을 읽었다는 두 가지 동작이 연속적으로 이어지고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 헤드라인이\u003c/span>\u003cspan class=\"en\">One headline\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 눈길을 끌었지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">caught \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">eye\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 돈이 없었다\u003c/span>\u003cspan class=\"en\">but he had no money\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 신문을 살.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">buy \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">paper\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">바로 그때, 신문 가판대에서 일하고 있던 David가 James를 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공이 처한 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">빈곤\u003c/b> 상태를 구체적으로 보여주는 문장으로, 신문을 사고 싶어도 살 수 없는 상황을 묘사합니다. 이 문장은 이후 이어질 David의 \u003cb class=\"key\">호의\u003c/b>가 얼마나 큰 의미를 갖게 될지를 강조하는 복선 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용적 표현 (숙어)\u003c/span> : catch + [소유격] + eye : \"그의 눈길을 끌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : no money [명사] + [to buy (to부정사구/형용사 역할)] : \"그 신문을 살 (돈)\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"One headline, 한 헤드라인이. caught his eye, 그의 눈길을 끌었지만. but he had no money, 그는 돈이 없었다. to buy the paper, 그 신문을 살.. 이 문장 전체를 해석하면, 바로 그때, 신문 가판대에서 일하고 있던 David가 James를 발견했다.","hl":"m"},{"n":23,"text":"이 네 번째 문장은 주인공 James가 처한 아주 절박한 상황을 보여줘요. 신문을 너무 읽고 싶지만 그 한 장을 살 돈조차 없는 경제적 빈곤을 강조하며, 나중에 David가 베풀게 될 호의의 가치를 더 크게 느끼게 하죠.","hl":"mn"},{"n":24,"text":"문법을 보면 첫 번째로 caught his eye라는 표현이 눈에 띄네요. 눈길을 끌다라는 아주 유용한 숙어예요. 두 번째로는 to buy the paper가 앞에 있는 money를 꾸며주는 to부정사의 형용사적 용법으로 쓰여서 '신문을 살 돈'이라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 그때,\u003c/span>\u003cspan class=\"en\">Just then,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">David가,\u003c/span>\u003cspan class=\"en\">David,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신문 가판대에서 일하고 있던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">newsstand\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">James를 발견했다.\u003c/span>\u003cspan class=\"en\">noticed James.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“선생님, 이거 사고 싶으신가요?”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 결정적인 인물인 \u003cb class=\"key\">David\u003c/b>가 처음으로 등장하는 문장입니다. 분사구를 사용하여 David의 당시 \u003cb class=\"key\">상황\u003c/b>을 설명하며 James와의 관계가 시작됨을 알립니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사구 (후치 수식)\u003c/span> : David [명사] + [working (현재분사구)] : \"신문 가판대에서 일하고 있던 (David)\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Just then, 바로 그때. David, David가. working at the newsstand, 신문 가판대에서 일하고 있던. noticed James, James를 발견했다.. 이 문장 전체를 해석하면, “선생님, 이거 사고 싶으신가요?”","hl":"m"},{"n":26,"text":"다섯 번째 문장은 드디어 이 글의 또 다른 핵심 주인공인 David가 등장하는 장면이에요. 아무도 관심 갖지 않던 주인공 James를 David가 처음으로 발견하면서 이야기의 흐름이 완전히 바뀌게 되죠.","hl":"mn"},{"n":27,"text":"여기서 중요한 문법 포인트는 쉼표 사이에 들어간 working at the newsstand예요. 이 부분은 현재분사구로서 앞에 있는 David를 수식해 줍니다. David가 당시 가판대에서 일하는 중이었음을 설명하면서 문장 전체의 진짜 동사인 noticed와 잘 구분해서 해석해야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라고 그(David)가 물었다,\u003c/span>\u003cspan class=\"en\">He asked,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;선생님, 하고 싶으신가요\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Would \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이거 사고, ?&quot;\u003c/span>\u003cspan class=\"en\">buy this, sir?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">라고 (e)그(David)가 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> David가 James에게 건네는 첫마디로, 타인에 대한 \u003cb class=\"key\">배려\u003c/b>와 정중함이 느껴집니다. 이 짧은 질문이 두 사람 사이의 \u003cb class=\"key\">친절의 \u003c/b>\u003cb class=\"key\">교환\u003c/b>을 이끌어내는 발단이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">정중한 제안의 표현\u003c/span> : Would like to + [동사원형] : \"~하고 싶으신가요\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"He asked, 라고 그(David)가 물었다. \"Would you like to, \"선생님, 하고 싶으신가요. buy this, sir?\", 이거 사고, ?\". 이 문장 전체를 해석하면, 라고 (e)그(David)가 물었다.","hl":"m"},{"n":29,"text":"여섯 번째 문장은 David의 친절한 성격이 잘 드러나는 대사예요. James가 돈이 없어 망설이는 것을 보고 먼저 다가가 정중한 태도로 말을 건네는 장면으로, 두 사람의 긴 인연이 시작되는 아주 따뜻한 순간이죠.","hl":"mn"},{"n":30,"text":"문법적으로는 Would you like to라는 표현을 꼭 기억하세요. 상대방의 의향을 정중하게 물을 때 쓰는 표현인데, 뒤에 buy라는 동사원형이 와서 '사고 싶으신가요'라고 해석합니다. 마지막에 붙은 sir는 모르는 사람에게 예의를 갖추는 호칭이라는 점도 알아두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만, James는 주저했다,\u003c/span>\u003cspan class=\"en\">But, James hesitated,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">saying\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈이 없다고.\u003c/span>\u003cspan class=\"en\">he had no money.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, James는 돈이 없다고 말하며 주저했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> James가 자신의 어려운 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">상황\u003c/b> 때문에 제안을 거절하는 장면으로, 그가 과거에 겪었던 \u003cb class=\"key\">가난\u003c/b>을 사실적으로 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 분사구문\u003c/span> : 주절, [v-ing (분사구문)] : \"말하며\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"But, James hesitated, 하지만, James는 주저했다.  saying, 말하며. he had no money, 돈이 없다고.. 이 문장 전체를 해석하면, 하지만, James는 돈이 없다고 말하며 주저했다.","hl":"m"},{"n":32,"text":"제임스가 돈이 없어서 신문을 사지 못하고 망설이는 장면이죠. 과거에 그가 처했던 어려운 경제적 상황을 보여주는 대목입니다.","hl":"mn"},{"n":33,"text":"여기서 핵심 어법은 현재분사 saying입니다. 분사구문으로서 주어인 제임스의 능동적인 동작을 설명하며 문맥상 동시에 일어나는 부대상황을 표현하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">David는 미소 지으며 말했다, “저도 그래요.\u003c/span>\u003cspan class=\"en\">David \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">smiled \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>, &quot;Me, too.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">David는 미소 지으며 “저도 그래요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신문판매원인 David가 James의 처지에 \u003cb class=\"key\">공감\u003c/b>을 표하며, 긴장을 풀어주기 위해 \u003cb class=\"key\">미소\u003c/b>를 짓는 따뜻한 모습입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거동사의 병렬구조\u003c/span> : [V1(과거)] + and + [V2(과거)] : \"미소 지으며 말했다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"David smiled, David는 미소 지으며. and said, 말했다. \"Me, too.\", “저도 그래요.. 이 문장 전체를 해석하면, David는 미소 지으며 “저도 그래요.","hl":"m"},{"n":35,"text":"데이비드가 제임스의 처지에 공감하는 장면이에요. 본인도 돈이 없다는 것을 밝히며 상대방의 마음을 편안하게 해주는 미소를 보여줍니다.","hl":"mn"},{"n":36,"text":"동사 smiled와 said가 and로 연결된 병렬구조입니다. 주어의 두 가지 행동이 과거 시제로 일치되어야 한다는 점에 유의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 저는 가지고 있어요\u003c/span>\u003cspan class=\"en\">But I have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것을 살 정도는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">enough\u003c/span> for this.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 이것을 살 정도는 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> David가 비록 넉넉하지는 않지만 남을 돕기 위해 자신의 \u003cb class=\"key\">최선\u003c/b>을 다하는 \u003cb class=\"key\">나눔\u003c/b>의 자세를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">enough의 대명사적 용법\u003c/span> : have + [enough (목적어/대명사)] : \"충분한 양\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"But I have, 하지만 저는 가지고 있어요. enough for this, 이것을 살 정도는.. 이 문장 전체를 해석하면, 하지만 이것을 살 정도는 있어요.","hl":"m"},{"n":38,"text":"데이비드가 비록 부자는 아니지만 신문 한 권 정도는 선물할 수 있다는 나눔의 의지를 보여주는 문장입니다.","hl":"mn"},{"n":39,"text":"여기서 enough는 충분한 양이라는 의미의 대명사로 사용되었습니다. 신문 한 권을 살 수 있는 충분한 돈이 있다는 것을 목적어 자리에 써서 표현하고 있네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 가져가세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Take\u003c/span> it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선물로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as\u003c/span> a gift.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">선물로 가져가세요.”라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 돈이 없어 신문을 사지 못하는 James에게 David가 대가 없이 호의를 베푸는 장면입니다. David의 \u003cb class=\"key\">순수한 \u003c/b>\u003cb class=\"key\">친절\u003c/b>과 배려심이 잘 드러나는 문장으로, 이야기의 핵심 주제인 \u003cb class=\"key\">진정한 \u003c/b>\u003cb class=\"key\">부\u003c/b>의 의미를 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : 동사원형 ~ . : \"가져가라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as\u003c/span> : as + 명사 : \"~로서(선물로)\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Take it, 그것을 가져가세요. as a gift, 선물로.. 이 문장 전체를 해석하면, 선물로 가져가세요.”라고 말했다.","hl":"m"},{"n":41,"text":"David가 돈이 없는 James에게 아무런 대가 없이 신문을 주는 장면이에요. 이 짧은 말 한마디에 David의 순수한 친절이 담겨 있고, 나중에 James가 깨닫게 될 진정한 부의 의미를 미리 보여주는 중요한 대목이죠.","hl":"mn"},{"n":42,"text":"첫 번째 포인트로 문장 맨 앞에 동사원형 Take를 써서 명령문 형태를 만들었어요. 두 번째로 전치사 as는 여기서 선물이라는 자격을 나타내어 선물로 가져가라는 의미를 더해줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3개월 후,\u003c/span>\u003cspan class=\"en\">Three months later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">James는,\u003c/span>\u003cspan class=\"en\">James,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 무일푼인,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">still \u003c/span>\u003cspan class=\"tgt\">broke\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 만났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">met\u003c/span> him\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 신문 가판대에서\u003c/span>\u003cspan class=\"en\">at the newsstand\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 한번.\u003c/span>\u003cspan class=\"en\">once more.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">3개월 후, 여전히 무일푼인 James는 그 신문 가판대에서 그를 다시 한번 만났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간이 흘렀음에도 James의 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>이 나아지지 않았음을 보여줍니다. \u003cb class=\"key\">still \u003c/b>\u003cb class=\"key\">broke\u003c/b>라는 표현을 통해 두 인물이 다시 조우하게 되는 배경을 설정합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사구의 삽입\u003c/span> : 주어, [형용사구], 동사 : \"여전히 무일푼인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거 시제 동사\u003c/span> : meet의 과거형 : \"만났다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Three months later, 3개월 후. James, James는. still broke, 여전히 무일푼인. met him, 그를 만났다. at the newsstand, 그 신문 가판대에서. once more, 다시 한번.. 이 문장 전체를 해석하면, 3개월 후, 여전히 무일푼인 James는 그 신문 가판대에서 그를 다시 한번 만났다.","hl":"m"},{"n":44,"text":"삼 개월이라는 시간이 지났지만 James는 여전히 가난한 상태였어요. 이런 힘든 경제적 상황 속에서 두 사람이 신문 가판대에서 다시 마주치게 되는 상황을 묘사하고 있습니다.","hl":"mn"},{"n":45,"text":"첫 번째로 주목할 부분은 주어 James 뒤에 콤마를 찍고 들어간 still broke예요. 형용사구가 중간에 끼어들어 주어의 상태를 설명해주는 구조죠. 두 번째로 동사 met은 과거의 완료된 사건을 나타내는 과거 시제로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또다시,\u003c/span>\u003cspan class=\"en\">Again,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">David는 그에게 주었다\u003c/span>\u003cspan class=\"en\">David \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">gave \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신문 한 부를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">newspaper\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기대하지 않고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">expecting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무런 보답도.\u003c/span>\u003cspan class=\"en\">anything in return.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또다시, David는 그에게 아무런 보답도 기대하지 않고 신문 한 부를 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> David의 선행이 우연이 아닌 그의 \u003cb class=\"key\">변함없는 \u003c/b>\u003cb class=\"key\">성품\u003c/b>임을 보여줍니다. 보답을 바라지 않는 \u003cb class=\"key\">대가 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">베풂\u003c/b>의 고결함을 강조하며 이야기의 감동을 더합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 수여동사\u003c/span> : give + 간접목적어(him) + 직접목적어(a newspaper) : \"그에게 신문을 주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : without + V-ing : \"기대하지 않고\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Again, 또다시. David gave him, David는 그에게 주었다. a newspaper, 신문 한 부를. without expecting, 기대하지 않고. anything in return, 아무런 보답도.. 이 문장 전체를 해석하면, 또다시, David는 그에게 아무런 보답도 기대하지 않고 신문 한 부를 주었다.","hl":"m"},{"n":47,"text":"David는 이번에도 대가를 전혀 바라지 않고 James에게 친절을 베풀었어요. 이렇게 보답을 바라지 않는 대가 없는 베풂이야말로 David의 변함없는 성품을 가장 잘 보여주는 부분이죠.","hl":"mn"},{"n":48,"text":"첫 번째로 gave him a newspaper는 누구에게 무엇을 주다는 의미의 사형식 수여동사 문장이에요. 두 번째로 without 뒤에 동명사 expecting이 와서 무엇을 하지 않은 채로라는 조건을 설명하고 있습니다. 마지막으로 보답이라는 뜻의 관용구 in return도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수년이 흘러서\u003c/span>\u003cspan class=\"en\">Years passed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">James는 ~가 되었다\u003c/span>\u003cspan class=\"en\">and James became\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부유한 사업가가\u003c/span>\u003cspan class=\"en\">a wealthy businessman,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그는 결코 잊지 못했다\u003c/span>\u003cspan class=\"en\">but he never forgot\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 청년을\u003c/span>\u003cspan class=\"en\">the young man\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 공항에서 만났던\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">met\u003c/span> at the airport.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수년이 흘러서 James는 부유한 사업가가 되었지만, 그는 그가 공항에서 만났던 그 청년을 결코 잊지 못했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세월이 흘러 James가 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">성공\u003c/b>을 거두었음에도 불구하고, 힘들 때 도움을 준 David를 잊지 않았음을 강조합니다. 이는 이후 전개될 \u003cb class=\"key\">보답의 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 이끄는 중요한 배경이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료 시제\u003c/span> : had + [과거분사(p.p.)] : \"만났던\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Years passed, 수년이 흘러서. and James became, James는 ~가 되었다. a wealthy businessman, 부유한 사업가가. but he never forgot, 하지만 그는 결코 잊지 못했다. the young man, 그 청년을. he had met at the airport, 그가 공항에서 만났던. 이 문장 전체를 해석하면, 수년이 흘러서 James는 부유한 사업가가 되었지만, 그는 그가 공항에서 만났던 그 청년을 결코 잊지 못했다.","hl":"m"},{"n":50,"text":"세월이 흘러 제임스가 사회적 성공을 거두었음에도 불구하고, 힘들 때 도움을 준 데이비드를 잊지 않았음을 강조하고 있어요. 이 문장은 이후 전개될 보답의 과정을 이끄는 중요한 배경이 됩니다.","hl":"mn"},{"n":51,"text":"어법을 보면 문장 끝부분에 had met이 쓰였는데요. 제임스가 잊지 못한 시점인 과거보다 공항에서 데이비드를 만난 사건이 시간상 앞서기 때문에 대과거를 나타내는 과거완료를 사용한 것입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 David를 알아냈고\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">David \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 서점을 운영하고 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">running\u003c/span> a small bookstore\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거기로 그를 방문했다\u003c/span>\u003cspan class=\"en\">and visited him there.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 David가 작은 서점을 운영하고 있다는 것을 알아냈고 거기로 그를 방문했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> James가 David를 찾기 위해 노력했음을 보여주며, 두 사람의 \u003cb class=\"key\">재회\u003c/b>를 묘사합니다. David가 여전히 소박한 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 유지하고 있음을 짐작게 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장 (목적격 보어: 현재분사)\u003c/span> : find + [목적어] + [현재분사(~ing)] : \"David가 운영하고 있는 것을 발견하다\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"He found David, 그는 David를 알아냈고. running a small bookstore, 작은 서점을 운영하고 있다는 것을. and visited him there, 거기로 그를 방문했다. 이 문장 전체를 해석하면, 그는 David가 작은 서점을 운영하고 있다는 것을 알아냈고 거기로 그를 방문했다.","hl":"m"},{"n":53,"text":"제임스가 데이비드를 찾기 위해 노력했음을 보여주며 두 사람의 재회를 묘사하는 부분이에요. 데이비드가 여전히 소박한 삶의 태도를 유지하고 있음을 짐작게 하죠.","hl":"mn"},{"n":54,"text":"여기서 found David running 부분을 주목해 보세요. 목적어인 데이비드가 서점을 운영하고 있는 진행 중인 상태를 발견한 것을 표현하기 위해 목적격 보어 자리에 현재분사를 쓴 오형식 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(b)그(James)는 자기를 소개하며, 말했다, “David, 당신은 나를 두 번이나 도와주었어요 당신이 가진 게 거의 없을 때”\u003c/span>\u003cspan class=\"en\">He introduced \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">himself\u003c/span>, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">saying\u003c/span>, &quot;David, you helped me twice when you had almost nothing.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">(b)그(James)는 자기를 소개하며, “David, 당신은 당신이 가진 게 거의 없을 때 나를 두 번이나 도와주었어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> James가 과거에 받은 친절의 가치를 \u003cb class=\"key\">재확인\u003c/b>시켜 주는 대목입니다. 특히 David가 \u003cb class=\"key\">넉넉하지 \u003c/b>\u003cb class=\"key\">못한 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에서도 남을 도왔다는 점이 이 글의 주제 의식과 연결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">재귀대명사의 재귀 용법\u003c/span> : 주어(He) = 목적어(himself) : \"자기 자신을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : [동사원형-ing] (부대상황) : \"말하며\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"He introduced himself, (b)그(James)는 자기를 소개하며. saying, 말했다. \"David, “David. you helped me twice, 당신은 나를 두 번이나 도와주었어요. when you had almost nothing.\", 당신이 가진 게 거의 없을 때”. 이 문장 전체를 해석하면, (b)그(James)는 자기를 소개하며, “David, 당신은 당신이 가진 게 거의 없을 때 나를 두 번이나 도와주었어요.","hl":"m"},{"n":56,"text":"제임스가 과거에 받은 친절의 가치를 재확인시켜 주는 대목입니다. 특히 데이비드가 넉넉하지 못한 상황에서도 남을 도왔다는 점이 이 글의 전체 주제 의식과 아주 밀접하게 연결되죠.","hl":"mn"},{"n":57,"text":"어법상 중요한 포인트가 두 개 있어요. 첫 번째로 himself는 소개를 하는 주체와 소개를 받는 대상이 동일 인물인 제임스이기 때문에 목적어 자리에 반드시 써야 하는 재귀대명사입니다. 두 번째로 saying은 제임스가 자신을 소개하면서 동시에 말을 하는 상황을 나타내는 분사구문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 당신에게 주고 싶어요\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">give\u003c/span> you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 원하는 것은 무엇이든.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">anything \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">wish\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 당신이 원하는 것은 무엇이든 당신에게 주고 싶어요.”라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> James는 자신이 성공한 후 과거의 은혜를 갚기 위해 David에게 \u003cb class=\"key\">물질적 \u003c/b>\u003cb class=\"key\">보상\u003c/b>을 제안하며 \u003cb class=\"key\">보상 \u003c/b>\u003cb class=\"key\">심리\u003c/b>를 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : want [타동사] + to give [to부정사구/목적어] : \"주는 것을 원하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : anything [선행사] + (that/which) [관계사 생략] + you wish [절] : \"당신이 원하는 것은 무엇이든\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"I want to give you, 나는 당신에게 주고 싶어요. anything you wish, 당신이 원하는 것은 무엇이든.. 이 문장 전체를 해석하면, 나는 당신이 원하는 것은 무엇이든 당신에게 주고 싶어요.”라고 말했다.","hl":"m"},{"n":59,"text":"James가 이제는 큰 부자가 되어서 예전에 도움을 주었던 David에게 보답하겠다고 제안하는 장면이에요. 본인이 가진 풍요로움을 이용해 무엇이든 주겠다는 태도에서 James의 감사함과 동시에 물질적인 보상 심리를 볼 수 있습니다.","hl":"mn"},{"n":60,"text":"첫 번째로 want to give 부분을 보세요. 동사 want는 뒤에 동명사가 아닌 to부정사만을 목적어로 가지는 대표적인 동사입니다. 두 번째로 anything you wish 구문에서는 anything 뒤에 목적격 관계대명사인 that이나 which가 생략되어 있어요. 당신이 바라는 것은 무엇이든이라는 의미로 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그를 바라보았고\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말했다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“당신은 나에게 진정으로 보답할 수 없어요.”\u003c/span>\u003cspan class=\"en\">&quot;You can't \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">truly \u003c/span>\u003cspan class=\"tgt\">compensate\u003c/span> me.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 (c)그(James)를 바라보았고, “당신은 나에게 진정으로 보답할 수 없어요.”라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> David는 단순한 돈으로는 과거 자신이 베풀었던 \u003cb class=\"key\">순수한 \u003c/b>\u003cb class=\"key\">친절\u003c/b>의 가치를 \u003cb class=\"key\">대체\u003c/b>하거나 갚을 수 없음을 선언합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : looked [과거동사 1] + and + said [과거동사 2] : \"그를 바라보았고 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 동사 수식\u003c/span> : truly [부사] + compensate [동사] : \"진정으로 보답하다\"\u003c/div>\u003c/div>","segs":[{"n":61,"text":"He looked at him, 그는 그를 바라보았고. and said, 말했다. \"You can't truly compensate me.\", “당신은 나에게 진정으로 보답할 수 없어요.”. 이 문장 전체를 해석하면, 그는 (c)그(James)를 바라보았고, “당신은 나에게 진정으로 보답할 수 없어요.”라고 말했다.","hl":"m"},{"n":62,"text":"David의 거절이 담긴 중요한 문장입니다. 그는 James가 주는 어떠한 보상도 자신이 가난할 때 베풀었던 그 마음을 대신할 수는 없다는 아주 단호하고 깊은 철학을 말하고 있어요.","hl":"mn"},{"n":63,"text":"첫 번째 포인트는 looked와 said의 병렬 구조입니다. 두 동사 모두 과거형으로 쓰여 주어인 He의 동작을 순서대로 나타내고 있죠. 두 번째로 truly는 부사로서 뒤에 나오는 동사인 compensate를 수식하고 있습니다. 진심으로 보답한다는 의미를 강조하기 위해 부사 형태를 쓴 것입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">James가 물었다,\u003c/span>\u003cspan class=\"en\">James asked,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“왜 할 수 없죠?”\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">not?\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">James가 “왜 할 수 없죠?”라고 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신의 제안이 거절당하자 James는 당혹감을 느끼며, David가 거절하는 \u003cb class=\"key\">이유\u003c/b>에 대해 강한 \u003cb class=\"key\">의문\u003c/b>을 가집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문의 생략 구조\u003c/span> : Why [의문사] + (can you) not (compensate me)? : \"왜 안 되나요?\"\u003c/div>\u003c/div>","segs":[{"n":64,"text":"James asked, James가 물었다. \"Why not?\", “왜 할 수 없죠?”. 이 문장 전체를 해석하면, James가 “왜 할 수 없죠?”라고 물었다.","hl":"m"},{"n":65,"text":"James 입장에서는 본인이 가진 것이 아주 많기 때문에 보답을 못 할 이유가 없다고 생각합니다. 그래서 이해가 가지 않는다는 표정으로 짧고 강하게 질문을 던지는 장면입니다.","hl":"mn"},{"n":66,"text":"여기서 Why not은 생략된 형태입니다. 원래 문장으로 풀면 Why can you not compensate me 정도로 볼 수 있죠. 영어에서는 앞에 나온 내용이 명확할 때 이처럼 핵심적인 의문사만 남기고 나머지는 생략하는 경우가 많습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">David는 대답했습니다, &quot;내가 당신에게 베풀었기 때문이에요 내가 가진 게 거의 거의 없을 때.&quot;\u003c/span>\u003cspan class=\"en\">David replied, &quot;Because I gave to you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">almost \u003c/span>\u003cspan class=\"tgt\">nothing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">David는 “나는 가진 게 거의 없을 때 당신에게 베풀었기 때문이에요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> David가 과거에 James를 도왔던 행위는 자신이 \u003cb class=\"key\">결핍\u003c/b>된 상태에서 행한 진정한 \u003cb class=\"key\">희생\u003c/b>이었음을 강조합니다. 단순한 베풂을 넘어, 주는 이의 상황에 따른 \u003cb class=\"key\">진정성\u003c/b>의 차이를 설명하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절\u003c/span> : when [접속사] + I [주어] + had [동사] : \"내가 거의 아무것도 가지고 있지 않았을 때\"\u003c/div>\u003c/div>","segs":[{"n":67,"text":"David replied, David는 대답했습니다.  \"Because I gave to you, \"내가 당신에게 베풀었기 때문이에요.  when I had almost nothing.\", 내가 가진 게 거의 거의 없을 때.\". 이 문장 전체를 해석하면, David는 “나는 가진 게 거의 없을 때 당신에게 베풀었기 때문이에요.","hl":"m"},{"n":68,"text":"David는 자신이 과거에 베풀었던 친절이 단순한 호의가 아니라, 본인도 매우 힘든 상황에서 행한 진정한 희생이었다는 점을 강조하고 있어요. 주는 사람의 형편이 어려울 때의 베풂이 더 큰 가치를 지닌다는 뜻이죠.","hl":"mn"},{"n":69,"text":"첫 번째 포인트는 접속사 when이 이끄는 시간의 부사절입니다. David가 과거에 가졌던 결핍의 상태를 구체적으로 설명하며 동사 gave의 배경을 만들어줍니다. 두 번째로 almost nothing이라는 표현은 완전히 영은 아니지만 사실상 아무것도 없는 빈털터리 상태를 아주 강조해서 표현한 것입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 나에게 무언가를 주려고 하고 있어요\u003c/span>\u003cspan class=\"en\">You're \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">offering \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 당신이 모든 것을 가졌으니.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> you have everything.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 이제 모든 것을 가졌으니, 나에게 뭔가를 주려고 하는 거잖아요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> James의 보상 제안이 그에게는 \u003cb class=\"key\">부담 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 행위임을 지적하며, David의 과거 행위와 \u003cb class=\"key\">대조\u003c/b>를 이룹니다. 현재 James의 \u003cb class=\"key\">풍요로움\u003c/b>이 베풂의 가치를 다르게 만든다는 점을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 수여동사 구조\u003c/span> : offer [동사] + me [간접목적어] + something [직접목적어] : \"나에게 무언가를 제안하다/주다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유의 접속사\u003c/span> : now that [접속사] + S [주어] + V [동사] : \"~이니까, ~인 이상\"\u003c/div>\u003c/div>","segs":[{"n":70,"text":"You're offering me something, 당신은 나에게 무언가를 주려고 하고 있어요.  now that you have everything, 이제 당신이 모든 것을 가졌으니.. 이 문장 전체를 해석하면, 당신은 이제 모든 것을 가졌으니, 나에게 뭔가를 주려고 하는 거잖아요.","hl":"m"},{"n":71,"text":"David는 James의 제안을 냉철하게 분석하고 있어요. James가 지금 베푸는 것은 본인이 모든 것을 가진 상태에서 하는 것이라, 과거 David가 했던 희생과는 그 성격이 다르다는 점을 지적하는 것이죠.","hl":"mn"},{"n":72,"text":"첫 번째 포인트는 4형식 구조인 offer me something입니다. 나에게 무언가를 제안한다는 의미로, 수혜자와 내용을 순서대로 썼습니다. 두 번째는 now that이라는 접속사입니다. 이제는 당신이 모든 것을 다 가진 상황이 되었으니라는 뜻으로, 현재 변화된 상황을 근거로 제시할 때 사용합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 21 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그건 그저 관대함일 뿐이죠\u003c/span>\u003cspan class=\"en\">That's just generosity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">편의에 따른.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">convenience\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그건 그저 편의에 따른 관대함일 뿐이죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> James의 호의가 자신의 생활에 전혀 지장을 주지 않는 \u003cb class=\"key\">편리한\u003c/b> 선에서 이루어지는 것임을 비판합니다. 진정한 \u003cb class=\"key\">관대함\u003c/b>은 자기 편의를 희생할 때 나타난다는 메시지를 담은 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : generosity [명사] + at convenience [전치사구] : \"편의에 따른 관대함\"\u003c/div>\u003c/div>","segs":[{"n":73,"text":"That's just generosity, 그건 그저 관대함일 뿐이죠.  at convenience, 편의에 따른.. 이 문장 전체를 해석하면, 그건 그저 편의에 따른 관대함일 뿐이죠.","hl":"m"},{"n":74,"text":"David는 James의 제안이 자신에게 아무런 부담이 없는 상황에서 하는 행동이라고 꼬집고 있어요. 진정한 부자는 돈이 많은 사람이 아니라, 부족할 때도 나눌 줄 아는 사람이라는 이 글의 주제와 맞닿아 있는 부분입니다.","hl":"mn"},{"n":75,"text":"여기서 짧지만 강력한 표현인 at convenience를 주목하세요. 앞의 명사 generosity를 꾸며주는 전치사구로, 당신이 하기 편리한 때에, 즉 당신의 상황이 좋을 때 베푸는 방식이라는 점을 한정해서 설명해 주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 22 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러니, \u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 받아들일 수 없어요 \u003c/span>\u003cspan class=\"en\">I can't \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">accept\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 제안을.\u003c/span>\u003cspan class=\"en\">your offer.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러니, 저는 당신의 제안을 받아들일 수 없어요.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 데이비드는 진정한 나눔의 가치는 물질적인 보상이 아니라 \u003cb class=\"key\">베푸는 \u003c/b>\u003cb class=\"key\">순간의 \u003c/b>\u003cb class=\"key\">마음\u003c/b>에 있다고 믿습니다. 그는 제임스의 보상이 자신의 과거 행위에 대한 진정한 \u003cb class=\"key\">대가\u003c/b>가 될 수 없음을 분명히 하며 거절합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 뒤의 동사원형\u003c/span> : can't [조동사] + accept [동사원형] : \"받아들이다\"\u003c/div>\u003c/div>","segs":[{"n":76,"text":"So, 그러니. I can't accept, 저는 받아들일 수 없어요. your offer, 당신의 제안을.. 이 문장 전체를 해석하면, 그러니, 저는 당신의 제안을 받아들일 수 없어요.”","hl":"m"},{"n":77,"text":"데이비드는 자신이 아주 어려울 때 베풀었던 그 순수한 마음이, 제임스가 성공한 후에 주는 보상으로 대체될 수 없다고 생각해요. 그래서 제임스의 호의를 정중하게 거절하며 자신의 가치관을 지키는 모습입니다.","hl":"mn"},{"n":78,"text":"여기서 accept는 받아들이다라는 뜻의 동사인데요. 바로 앞에 부정의 의미를 담은 조동사 can't가 쓰였기 때문에 반드시 뒤에 동사원형 형태를 유지해야 한다는 점을 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 23 / 25\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">James는 깨달았다 \u003c/span>\u003cspan class=\"en\">James realized\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈이 만들지 않는다는 것을 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> money doesn't \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가를 부유하게.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"tgt\">rich\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">James는 돈이 누군가를 부유하게 만들지 않는다는 것을 깨달았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부유함의 기준이 단순히 통장의 잔고나 \u003cb class=\"key\">물질적 \u003c/b>\u003cb class=\"key\">소유\u003c/b>에 있지 않음을 보여줍니다. 제임스는 데이비드와의 대화를 통해 \u003cb class=\"key\">진정한 \u003c/b>\u003cb class=\"key\">부\u003c/b>의 의미를 새롭게 정립하게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사\u003c/span> : realized [타동사] + that [접속사] + S + V : \"~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 문장(목적격 보어)\u003c/span> : make [사역동사] + someone [목적어] + rich [목적격 보어/형용사] : \"누군가를 부유하게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":79,"text":"James realized, James는 깨달았다. that money doesn't make, 돈이 만들지 않는다는 것을. someone rich, 누군가를 부유하게.. 이 문장 전체를 해석하면, James는 돈이 누군가를 부유하게 만들지 않는다는 것을 깨달았다.","hl":"m"},{"n":80,"text":"제임스는 큰 부자가 되었지만, 여전히 자신이 가지지 못한 고귀한 정신을 데이비드가 가지고 있다는 걸 깨달아요. 돈이 많다고 해서 무조건 마음까지 부유한 사람은 아니라는 교훈을 얻는 중요한 지점이죠.","hl":"mn"},{"n":81,"text":"첫 번째로 동사 realized 뒤에 나오는 that은 목적어 자리에 문장을 연결해 주는 명사절 접속사예요. 두 번째로 make는 오형식 동사로 쓰였는데요. 누군가를 어떤 상태로 만든다고 할 때 보어 자리에는 반드시 rich 같은 형용사를 써야지 부사를 쓰면 안 된다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 24 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 순간을 회상하며,  그는 그 기자에게 말했다,  &quot;베풀려는 의지인 거죠  거의 가진 게 없을 때조차도  당신을 부유하게 만드는 것은.&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Remembering\u003c/span> that moment, he said to the journalist, &quot;It's the \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">willingness \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">give\u003c/span> even when you have very little that makes you wealthy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 순간을 회상하며, (d)그(James)는 그 기자에게 “당신을 부유하게 만드는 것은 거의 가진 게 없을 때조차도 베풀려는 의지인 거죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 핵심 주제를 담은 문장으로, \u003cb class=\"key\">it \u003c/b>\u003cb class=\"key\">is \u003c/b>\u003cb class=\"key\">~ \u003c/b>\u003cb class=\"key\">that \u003c/b>\u003cb class=\"key\">강조구문\u003c/b>을 활용하고 있습니다. 진정한 부유함이란 넉넉할 때 나누는 것이 아니라 \u003cb class=\"key\">부족한 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에서도 나누고자 하는 마음가짐임을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : Remembering [현재분사] ~, S + V : \"회상하며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : willingness [명사] + to give [to부정사] : \"베풀려는 의지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">It is ~ that 강조구문\u003c/span> : It is [강조 대상] + that [나머지 문장] : \"~하는 것은 바로 ...이다\"\u003c/div>\u003c/div>","segs":[{"n":82,"text":"Remembering that moment, 그 순간을 회상하며. he said to the journalist, 그는 그 기자에게 말했다. \"It's the willingness to give, \"베풀려는 의지인 거죠. even when you have very little, 거의 가진 게 없을 때조차도. that makes you wealthy.\", 당신을 부유하게 만드는 것은.\". 이 문장 전체를 해석하면, 그 순간을 회상하며, (d)그(James)는 그 기자에게 “당신을 부유하게 만드는 것은 거의 가진 게 없을 때조차도 베풀려는 의지인 거죠.","hl":"m"},{"n":83,"text":"제임스가 기자의 질문에 대해 내린 최종적인 답이자 이 글의 결론이에요. 돈의 액수가 아니라, 내가 아주 부족한 상황에서도 남을 돕고자 하는 그 마음가짐이 사람을 진짜 부자로 만든다는 핵심 주제가 담겨 있습니다.","hl":"mn"},{"n":84,"text":"첫 번째로 문장 맨 앞의 Remembering은 분사구문으로, 제임스가 과거를 회상하면서 동시에 말을 했다는 상황을 보여줘요. 두 번째로 It is와 that이 쓰인 강조구문을 잘 보세요. 당신을 부유하게 만드는 진짜 원인인 베풀려는 의지를 아주 강하게 강조하고 있습니다. 마지막 세 번째로 willingness 뒤의 to give는 형용사처럼 앞에 있는 명사를 꾸며주는 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 25 / 25\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로, David가 ~입니다\u003c/span>\u003cspan class=\"en\">And so, David is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 부유한 사람\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">richest\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">person \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 이제껏 만난.”라고 말했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">I\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"tgt\">met\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로, David가 제가 이제껏 만난 가장 부유한 사람입니다.”라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 제임스는 진정한 부란 소유한 돈의 양이 아니라 \u003cb class=\"key\">나누고자 \u003c/b>\u003cb class=\"key\">하는 \u003c/b>\u003cb class=\"key\">의지\u003c/b>에 달려 있다는 것을 깨닫습니다. 자신에게 아무것도 없던 시절 조건 없이 베풀었던 데이비드야말로 세상에서 가장 \u003cb class=\"key\">풍요로운 \u003c/b>\u003cb class=\"key\">마음\u003c/b>을 가진 사람이라는 결론으로 글을 맺고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 최상급\u003c/span> : the + 형용사-est : \"가장 부유한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : 명사(선행사) + [whom/that 생략] + 주어 + 타동사 : \"내가 ~한 사람\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재완료의 경험 용법\u003c/span> : have + ever + p.p. (과거분사) : \"이제껏 만난 적이 있는\"\u003c/div>\u003c/div>","segs":[{"n":85,"text":"And so, David is, 그러므로, David가 ~입니다. the richest person, 가장 부유한 사람. I have ever met, 제가 이제껏 만난.”라고 말했다.. 이 문장 전체를 해석하면, 그러므로, David가 제가 이제껏 만난 가장 부유한 사람입니다.”라고 말했다.","hl":"m"},{"n":86,"text":"제임스는 진정한 부란 소유한 돈의 양이 아니라 나누고자 하는 의지에 달려 있다는 것을 깨닫습니다. 자신에게 아무것도 없던 시절 조건 없이 베풀었던 데이비드야말로 세상에서 가장 풍요로운 마음을 가진 사람이라는 결론으로 글을 맺고 있습니다.","hl":"mn"},{"n":87,"text":"첫 번째로 the richest는 형용사 rich에 est를 붙인 최상급 표현으로 가장 부유한이라는 뜻입니다. 두 번째로 person과 I 사이에는 목적격 관계대명사가 생략되어 있어 뒤의 절이 person을 수식하고 있어요. 세 번째로 have ever met은 현재완료의 경험 용법으로 태어나서 지금까지 만난 사람 중 최고임을 강조합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>과거 무일푼이었던 제임스는 가판대 소년 데이비드에게 대가 없는 \u003cb class=\"key\">신문 \u003c/b>\u003cb class=\"key\">선물\u003c/b>을 두 번 받았습니다.\u003c/li>\u003cli>훗날 성공한 제임스는 데이비드를 찾아가 보답을 제안했지만, 데이비드는 이를 \u003cb class=\"key\">거절\u003c/b>했습니다.\u003c/li>\u003cli>데이비드는 모든 것을 가졌을 때 베푸는 것은 그저 \u003cb class=\"key\">편의에 \u003c/b>\u003cb class=\"key\">따른 \u003c/b>\u003cb class=\"key\">관대함\u003c/b>일 뿐이라고 말했습니다.\u003c/li>\u003cli>진정한 부유함이란 가진 것이 거의 없을 때조차 남에게 베풀려는 \u003cb class=\"key\">나눔의 \u003c/b>\u003cb class=\"key\">의지\u003c/b>에서 나옵니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>True wealth is defined not by how much money one has, but by the willingness to give to others even when one has very little.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">억만장자 제임스가 과거 자신이 어려웠을 때 대가 없이 신문을 주었던 데이비드에게 보답하려 하나, 데이비드는 \u003cb class=\"key\">풍요\u003c/b> 속의 베풂보다 \u003cb class=\"key\">결핍\u003c/b> 속의 베풂이 진정한 \u003cb class=\"key\">부\u003c/b>임을 일깨워 줍니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":88,"text":"오늘 우리는 데이비드의 말을 통해 진정한 부란 통장의 잔고가 아니라 우리 마음속의 나눔의 의지라는 점을 배웠습니다. 여러분도 공부하느라 힘들고 시간이 부족하겠지만, 그럴 때일수록 친구에게 건네는 따뜻한 말 한마디가 데이비드의 신문처럼 더 큰 가치를 지닐 수 있다는 점을 기억하세요. 오늘 수업 여기서 마칩니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
