lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 지문 18","audioDir":"18_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">지문\u003cbr>18\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>A Request for Customer Feedback for a New Ad Campaign\u003c/h1>\u003ch2>새로운 광고 캠페인을 위한 고객 후기 요청\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">Lomos \u003c/b>\u003cb class=\"key\">Tours\u003c/b>의 매니저가 우수 고객에게 내년 \u003cb class=\"key\">광고 \u003c/b>\u003cb class=\"key\">캠페인\u003c/b>에 사용할 \u003cb class=\"key\">여행 \u003c/b>\u003cb class=\"key\">경험\u003c/b> 공유를 정중하게 요청하는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The manager of Lomos Tours is asking a loyal customer to share their travel experience for an upcoming promotional advertisement.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 이천이십오년 고일 십모 십팔번 지문을 함께 살펴보겠습니다. 이 글은 Lomos Tours의 매니저가 고객에게 보내는 정중한 편지글이에요. 전체적인 내용은 우수 고객에게 새로운 광고 캠페인을 위해 여행 경험을 나누어 달라고 부탁하는 것이 핵심입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">기업이 새로운 광고를 만들 때 실제 고객의 후기를 사용하는 방식을 \u003cb class=\"key\">추천 \u003c/b>\u003cb class=\"key\">광고(Testimonial \u003c/b>\u003cb class=\"key\">Advertising)\u003c/b>라고 부릅니다. 소비자들은 기업의 일방적인 홍보보다 자신과 같은 \u003cb class=\"key\">일반 \u003c/b>\u003cb class=\"key\">고객\u003c/b>의 실제 경험담을 더 신뢰하는 경향이 있습니다. 이는 심리학적으로 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">증거(Social \u003c/b>\u003cb class=\"key\">Proof)\u003c/b> 원리가 작용하는 것인데, 타인의 선택을 보고 그 서비스의 품질을 판단하는 것입니다. 우리가 물건을 살 때 \u003cb class=\"key\">리뷰\u003c/b>를 꼼꼼히 읽어보는 것과 같은 이치입니다. 본문에서도 고객의 \u003cb class=\"key\">피드백\u003c/b>을 홍보에 활용하여 서비스의 신뢰도를 높이려는 전략을 보여줍니다.\u003c/div>","segs":[{"n":2,"text":"우리가 맛집을 고를 때나 물건을 살 때 실제 사용자의 후기를 찾아보는 것처럼, 기업들도 고객의 생생한 목소리를 홍보에 활용하곤 해요. 이걸 추천 광고, 영어로는 Testimonial Advertising이라고 하죠. 사람들은 기업이 직접 말하는 장점보다, 자신과 같은 일반인 고객의 경험을 더 믿기 때문입니다. 오늘 지문에서도 이런 마케팅 전략이 어떻게 정중한 요청으로 표현되는지 주목해 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인사와 감사\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>자신의 \u003cb class=\"key\">신분\u003c/b>을 밝히고 고객의 지속적인 \u003cb class=\"key\">신뢰와 \u003c/b>\u003cb class=\"key\">충심\u003c/b>에 대해 감사를 표하며 정중하게 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>광고 계획 발표\u003csmall>배경 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>내년에 진행할 새로운 \u003cb class=\"key\">홍보 \u003c/b>\u003cb class=\"key\">캠페인\u003c/b>을 언급하며, 광고에 고객의 \u003cb class=\"key\">경험\u003c/b>을 담겠다는 구체적 계획을 전달합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>정중한 요청\u003csmall>주장 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>지난 여행 경험을 \u003cb class=\"key\">공유\u003c/b>해 줄 수 있는지 묻고, 그 피드백이 서비스 홍보에 \u003cb class=\"key\">매우 \u003c/b>\u003cb class=\"key\">소중함\u003c/b>을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>후속 조치와 인사\u003csmall>결론 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>직원이 곧 \u003cb class=\"key\">연락\u003c/b>할 것임을 알리고, 도움에 \u003cb class=\"key\">미리 \u003c/b>\u003cb class=\"key\">감사\u003c/b>하며 편지를 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름은 아주 깔끔하게 네 단계로 나누어 볼 수 있습니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째와 두 번째 문장에서는 매니저인 Mark Smith가 자기소개를 하고, 고객이 보여준 지속적인 신뢰에 대해 진심 어린 감사를 전하고 있어요. 본격적인 부탁을 하기 전에 관계를 부드럽게 만드는 과정이죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 세 번째와 네 번째 문장에서는 상황을 설명합니다. 내년에 새로운 홍보 캠페인의 일환으로 광고를 만들 예정인데, 거기에 소중한 고객들의 경험을 담고 싶다는 구체적인 계획을 공유하고 있어요.","hl":"f1"},{"n":6,"text":"세 번째 단계인 다섯 번째와 여섯 번째 문장이 바로 이 글의 핵심입니다. 지난 여름의 여행 경험을 짧게라도 공유해 줄 수 있는지 정중하게 묻고 있죠. 이런 피드백이 서비스를 홍보하는 데 얼마나 소중한지도 강조하고 있습니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계인 일곱 번째부터 아홉 번째 문장에서는 향후 절차를 안내합니다. 직원이 곧 연락할 것이라는 말과 함께, 기꺼이 도와줄 것에 대해 미리 감사하며 안부 인사로 글을 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">요청-이유\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부에는 관계 형성을 위한 \u003cb class=\"key\">감사 \u003c/b>\u003cb class=\"key\">인사\u003c/b>가 먼저 나옵니다. 중간인 다섯 번째 문장에서 여행 경험 공유를 부탁하는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">요청\u003c/b>이 등장합니다. 그 뒤로 이 요청이 왜 필요한지, 즉 홍보에 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 한다는 근거를 덧붙이는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Dear (1)\u003c/b>\u003cspan>편지의 수신자를 밝히는 시작어\u003c/span>\u003cb>Next year (3)\u003c/b>\u003cspan>새로운 계획을 제시하는 시점의 전환\u003c/span>\u003cb>Since (5)\u003c/b>\u003cspan>요청의 배경이 되는 이유 제시\u003c/span>\u003cb>Thank you in advance (8)\u003c/b>\u003cspan>미래의 협조에 대한 미리 감사와 마무리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Lomos Tours\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">our team\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">we\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your experience\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a few words\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Your feedback\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your contributions\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 핵심 요청사항이 글의 중간 부분에 위치한 중괄식 구조를 가지고 있어요. 처음부터 다짜고짜 부탁을 하는 게 아니라, 감사 인사를 먼저 전한 뒤에 왜 이런 요청을 하는지 배경을 설명하고 본론으로 들어가는 요청과 이유의 전개 방식을 따르고 있습니다.","hl":"ty"},{"n":9,"text":"문장들 사이에 연결고리를 잘 봐야 하는데요. 다섯 번째 문장에 나오는 Since는 이유를 나타내는 접속사로, 당신이 우리와 여행했기 때문에 부탁한다는 논리를 만들어줍니다. 또한 마지막 부분의 Thank you in advance는 비즈니스 영어에서 상대방의 수락을 전제로 미리 고마움을 표하는 아주 세련된 표현입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Dear\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친애하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>manager\u003c/b>\u003cem>명사\u003c/em>\u003cspan>매니저, 관리자\u003c/span>\u003c/div>\u003cdiv>\u003cb>express\u003c/b>\u003cem>동사\u003c/em>\u003cspan>표현하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sincere\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진심 어린\u003c/span>\u003c/div>\u003cdiv>\u003cb>appreciation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감사\u003c/span>\u003c/div>\u003cdiv>\u003cb>continued\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지속적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>trust\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신뢰\u003c/span>\u003c/div>\u003cdiv>\u003cb>loyalty\u003c/b>\u003cem>명사\u003c/em>\u003cspan>충심, 충성\u003c/span>\u003c/div>\u003cdiv>\u003cb>as part of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 일환으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>promotional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>홍보의\u003c/span>\u003c/div>\u003cdiv>\u003cb>campaign\u003c/b>\u003cem>명사\u003c/em>\u003cspan>캠페인\u003c/span>\u003c/div>\u003cdiv>\u003cb>air\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방영하다, 방송하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>advertisement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>광고\u003c/span>\u003c/div>\u003cdiv>\u003cb>plan to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 계획이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>include\u003c/b>\u003cem>동사\u003c/em>\u003cspan>담다, 포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경험\u003c/span>\u003c/div>\u003cdiv>\u003cb>valued\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>소중한, 귀중한\u003c/span>\u003c/div>\u003cdiv>\u003cb>client\u003c/b>\u003cem>명사 ass=\"en\">My name is Mark Smith,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 매니저입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> I am the manager\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Lomos Tours의.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of\u003c/span> Lomos Tours.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">친애하는 Kelly 씨께, 제 이름은 Mark Smith이며, 저는 Lomos Tours의 매니저입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지 수신자에게 자신의 이름과 직책을 밝히며 \u003cb class=\"key\">자기소개\u003c/b>를 하는 첫인문입니다. 글의 목적을 말하기 전 \u003cb class=\"key\">신뢰감\u003c/b>을 형성하는 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사\u003c/span> : [문장 1] + and [등위접속사] + [문장 2] : \"그리고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 (소속/소유)\u003c/span> : the manager + of [전치사] + Lomos Tours : \"~의\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Dear Mr. Kelly, 친애하는 Kelly 씨께. My name is Mark Smith, 제 이름은 Mark Smith이며. and I am the manager, 저는 매니저입니다. of Lomos Tours, Lomos Tours의.. 이 문장 전체를 해석하면, 친애하는 Kelly 씨께, 제 이름은 Mark Smith이며, 저는 Lomos Tours의 매니저입니다.","hl":"m"},{"n":13,"text":"이 문장은 편지의 시작 부분으로 필자가 누구인지 밝히는 단계예요. 자신이 Lomos Tours라는 여행사의 매니저라는 점을 명확히 해서 신뢰감을 주는 역할을 하죠.","hl":"mn"},{"n":14,"text":"첫 번째로 접속사 and가 앞뒤의 문장을 대등하게 연결하고 있어요. 두 번째로 전치사 of는 매니저가 소속된 곳이 어디인지 뒤에서 앞으로 수식하며 범위를 좁혀 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 표합니다\u003c/span>\u003cspan class=\"en\">I express\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 진심 어린 감사를\u003c/span>\u003cspan class=\"en\">our sincere appreciation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 지속적인 신뢰와\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for\u003c/span> your \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">continued\u003c/span> trust\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충심에.\u003c/span>\u003cspan class=\"en\">and loyalty.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 당신의 지속적인 신뢰와 충심에 우리의 진심 어린 감사를 표합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오랜 기간 서비스를 이용해 준 고객에게 \u003cb class=\"key\">공식적인 \u003c/b>\u003cb class=\"key\">감사\u003c/b>를 표하는 문장입니다. \u003cb class=\"key\">비즈니스 \u003c/b>\u003cb class=\"key\">레터\u003c/b>에서 흔히 쓰이는 정중한 격식체 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유의 전치사\u003c/span> : appreciation + for [전치사] + [명사(이유)] : \"~에 대한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : continued [과거분사] + trust [명사] : \"지속적인, 계속된\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"I express, 저는 표합니다. our sincere appreciation, 우리의 진심 어린 감사를. for your continued trust, 당신의 지속적인 신뢰와. and loyalty, 충심에.. 이 문장 전체를 해석하면, 저는 당신의 지속적인 신뢰와 충심에 우리의 진심 어린 감사를 표합니다.","hl":"m"},{"n":16,"text":"그동안 회사를 믿고 이용해 준 고객에게 깊은 고마움을 전하는 문장이에요. 격식을 차린 비즈니스 편지의 전형적인 말투를 보여주고 있죠.","hl":"mn"},{"n":17,"text":"첫 번째로 continued는 신뢰라는 뜻의 trust를 꾸며주는 과거분사 형용사예요. 두 번째로 전치사 for는 우리가 왜 감사를 느끼는지 그 구체적인 이유를 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내년에,\u003c/span>\u003cspan class=\"en\">Next year,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 홍보 캠페인의 일환으로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as\u003c/span> part of a new promotional campaign,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Lomos Tours는 예정입니다\u003c/span>\u003cspan class=\"en\">Lomos Tours \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">광고를 방영할.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">airing\u003c/span> an advertisement.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내년에, 새로운 홍보 캠페인의 일환으로, Lomos Tours는 광고를 방영하려고 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지를 쓴 구체적인 배경인 \u003cb class=\"key\">홍보 \u003c/b>\u003cb class=\"key\">캠페인\u003c/b> 계획을 밝히는 문장입니다. 앞으로 일어날 일을 알리며 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">화제\u003c/b>를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 (자격)\u003c/span> : as [전치사] + part [명사] : \"~로서, ~의 일환으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">미래진행 시제\u003c/span> : will [조동사] + be [동사원형] + airing [현재분사] : \"방영할 것이다, 방영하는 중일 것이다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Next year, 내년에. as part of a new promotional campaign, 새로운 홍보 캠페인의 일환으로. Lomos Tours will be, Lomos Tours는 예정입니다. airing an advertisement, 광고를 방영할.. 이 문장 전체를 해석하면, 내년에, 새로운 홍보 캠페인의 일환으로, Lomos Tours는 광고를 방영하려고 합니다.","hl":"m"},{"n":19,"text":"내년에 새로운 캠페인을 시작한다는 구체적인 계획을 소개하고 있어요. 이 문장을 통해 필자가 왜 편지를 보냈는지 그 배경을 알 수 있습니다.","hl":"mn"},{"n":20,"text":"첫 번째로 전치사 as는 어떤 활동의 성격이나 자격을 나타내어 무엇의 일환이라는 뜻을 만들어요. 두 번째로 will be airing은 미래진행 시제로 가까운 미래에 진행될 확정된 계획을 생동감 있게 표현합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 계획입니다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">plan \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">담을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">include\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경험을\u003c/span>\u003cspan class=\"en\">the experiences of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 가장 소중한 몇몇 고객님들의\u003c/span>\u003cspan class=\"en\">some of our \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">valued\u003c/span> clients.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 우리의 가장 소중한 몇몇 고객님들의 경험을 담을 계획입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 광고에 실제 고객의 사례를 활용하겠다는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">계획\u003c/b>을 밝히고 있습니다. 신뢰도를 높이기 위해 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">소중한 \u003c/b>\u003cb class=\"key\">고객\u003c/b>을 선정했음을 강조하는 흐름입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : plan [동사] + to include [to부정사구/목적어] : \"담을 계획이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : most [최상급] + valued [과거분사/형용사] + clients [명사] : \"가장 소중한\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"We plan, 우리는 계획입니다. to include, 담을. the experiences of, 경험을. some of our most valued clients, 우리의 가장 소중한 몇몇 고객님들의. 이 문장 전체를 해석하면, 우리는 우리의 가장 소중한 몇몇 고객님들의 경험을 담을 계획입니다.","hl":"m"},{"n":22,"text":"회사가 새로운 광고를 만들 건데, 거기에 실제 고객들의 이야기를 넣겠다는 구체적인 계획을 말하는 단계예요. 가장 소중한 고객이라는 표현으로 상대방을 치켜세워주고 있죠.","hl":"mn"},{"n":23,"text":"첫 번째로 plan to include 부분을 보면, plan이라는 동사는 앞으로 할 일을 계획하는 거라 목적어 자리에 반드시 to부정사를 써야 해요. 두 번째로 most valued는 고객이 소중하게 여겨지는 존재라는 수동의 의미를 담기 위해 과거분사 형태의 형용사를 사용했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 지난 여름에 우리와 함께 여행하셨기에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Since\u003c/span> you traveled with us last summer,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 정중히 부탁드리고 싶습니다\u003c/span>\u003cspan class=\"en\">I would like to kindly ask\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기꺼이 ~해 주실 수 있는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">willing \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 마디 말씀을 공유해\u003c/span>\u003cspan class=\"en\">share a few words\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 경험에 대해\u003c/span>\u003cspan class=\"en\">about your experience.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 지난 여름에 우리와 함께 여행하셨기에, 저는 당신의 경험에 대해 몇 마디 말씀을 기꺼이 공유해 주실 수 있는지 정중히 부탁드리고 싶습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지를 보낸 \u003cb class=\"key\">직접적인 \u003c/b>\u003cb class=\"key\">이유\u003c/b>와 구체적인 요청 사항을 전달하는 문장입니다. \u003cb class=\"key\">공손한 \u003c/b>\u003cb class=\"key\">표현\u003c/b>인 would like to와 if절을 사용하여 상대방의 의사를 정중히 묻고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사\u003c/span> : Since [접속사] + 주어 + 동사 : \"~했기에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 if\u003c/span> : ask [동사] + if [접속사] + 주어 + 동사 [목적어절] : \"~해 주실 수 있는지\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Since you traveled with us last summer, 당신은 지난 여름에 우리와 함께 여행하셨기에. I would like to kindly ask, 저는 정중히 부탁드리고 싶습니다. if you would be willing to, 기꺼이 ~해 주실 수 있는지. share a few words, 몇 마디 말씀을 공유해. about your experience, 당신의 경험에 대해. 이 문장 전체를 해석하면, 당신은 지난 여름에 우리와 함께 여행하셨기에, 저는 당신의 경험에 대해 몇 마디 말씀을 기꺼이 공유해 주실 수 있는지 정중히 부탁드리고 싶습니다.","hl":"m"},{"n":25,"text":"이번 편지의 핵심 문장이에요. 지난 여행 경험을 바탕으로 광고에 들어갈 짧은 소감을 남겨달라고 아주 정중하게 부탁하는 내용입니다.","hl":"mn"},{"n":26,"text":"첫 번째로 문장 맨 앞의 Since는 이유를 나타내는 접속사로 쓰여서 때문에라고 해석해야 자연스러워요. 두 번째로 ask 다음에 나오는 if는 만약이라는 뜻이 아니라 뭐뭐인지 아닌지라는 뜻으로, 부탁의 내용을 연결하는 명사절 접속사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 피드백은\u003c/span>\u003cspan class=\"en\">Your feedback\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 소중 할 것입니다\u003c/span>\u003cspan class=\"en\">would be \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">invaluable\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 도와주는 데\u003c/span>\u003cspan class=\"en\">in helping us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서비스를 홍보하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">promote\u003c/span> our services.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신의 피드백은 우리가 서비스를 홍보하는 것을 도와주는 데 매우 소중 할 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고객의 참여가 회사의 \u003cb class=\"key\">홍보 \u003c/b>\u003cb class=\"key\">활동\u003c/b>에 결정적인 도움이 됨을 역설합니다. 피드백의 \u003cb class=\"key\">가치와 \u003c/b>\u003cb class=\"key\">중요성\u003c/b>을 언급하며 고객이 도와주기를 유도합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">반어적 의미의 형용사\u003c/span> : in- [부정 접두사] + valuable [가치 있는] : \"매우 소중한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">준사역동사 help의 목적격 보어\u003c/span> : help [동사] + us [목적어] + promote [동사원형/목적격보어] : \"홍보하는 것을\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Your feedback, 당신의 피드백은. would be invaluable, 매우 소중 할 것입니다. in helping us, 우리가 도와주는 데. promote our services, 서비스를 홍보하는 것을. 이 문장 전체를 해석하면, 당신의 피드백은 우리가 서비스를 홍보하는 것을 도와주는 데 매우 소중 할 것입니다.","hl":"m"},{"n":28,"text":"고객님의 한마디가 우리 회사를 알리는 데 얼마나 큰 힘이 되는지 강조하는 문장이에요. 상대방의 가치를 높여주면서 참여를 독려하고 있죠.","hl":"mn"},{"n":29,"text":"첫 번째로 invaluable이라는 단어를 조심해야 해요. 부정의 뜻을 가진 in이 붙었지만 가치가 없다는 뜻이 아니라, 값을 매길 수 없을 만큼 매우 가치 있는이라는 강력한 긍정의 뜻이 됩니다. 두 번째로 help us promote 부분을 보면, help는 목적어 다음에 동사원형인 promote를 써서 우리가 홍보하는 걸 돕는다는 의미를 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 팀의 직원 한 명이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">member \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">team\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧 연락드릴 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">touch \u003c/span>\u003cspan class=\"tgt\">with\u003c/span> you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧.\u003c/span>\u003cspan class=\"en\">shortly.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 팀의 직원 한 명이 곧 연락드릴 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고객의 요청이나 질문에 대해 \u003cb class=\"key\">후속 \u003c/b>\u003cb class=\"key\">조치\u003c/b>가 곧 이루어질 것임을 안내하는 문장입니다. 담당자가 직접 연락할 것임을 명시하여 상대방에게 \u003cb class=\"key\">신뢰감\u003c/b>을 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사구 주어\u003c/span> : A member [주어/핵심 명사] + of our team [수식어] : \"우리 팀의 직원 한 명이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">미래 시제와 관용 표현\u003c/span> : will + be in touch with [대상] : \"연락할 것입니다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"A member of our team, 우리 팀의 직원 한 명이. will be in touch with you, 곧 연락드릴 것입니다. shortly, 곧.. 이 문장 전체를 해석하면, 우리 팀의 직원 한 명이 곧 연락드릴 것입니다.","hl":"m"},{"n":31,"text":"이 문장은 편지의 목적을 전달한 뒤에 실제적인 다음 단계가 어떻게 진행될지 알려주는 역할을 해요. 담당자가 연락을 줄 거라는 확신을 주어 신뢰감을 쌓는 문장이죠.","hl":"mn"},{"n":32,"text":"첫 번째 포인트로 미래 시제를 나타내는 will be in touch with를 확인해 보세요. 여기서 be in touch with는 연락을 취하다라는 아주 중요한 표현입니다. 두 번째로는 주어를 보셔야 하는데 우리 팀 전체가 주어가 아니라 그중 한 명인 member가 핵심 주어라는 점을 짚어 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미리 감사드립니다\u003c/span>\u003cspan class=\"en\">Thank you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">advance\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 기여에 대해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for\u003c/span> your contributions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신의 기여에 미리 감사드립니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상대방이 요청에 응해줄 것을 기대하며 미리 \u003cb class=\"key\">고마움\u003c/b>을 전하는 표현입니다. 글을 마무리하며 상대의 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">협조\u003c/b>를 정중하게 유도하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사구(관용 표현)\u003c/span> : in + advance : \"미리, 사전에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유의 전치사\u003c/span> : Thank you + for + [명사/동명사] : \"~에 대해\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Thank you in advance, 미리 감사드립니다. for your contributions, 당신의 기여에 대해.. 이 문장 전체를 해석하면, 당신의 기여에 미리 감사드립니다.","hl":"m"},{"n":34,"text":"상대방이 아직 도움을 주기 전이지만 미리 고맙다고 말함으로써 정중하게 부탁을 들어줄 것을 요청하는 아주 세련된 인사법이에요.","hl":"mn"},{"n":35,"text":"첫 번째로 in advance라는 표현을 꼭 기억하세요. 미리라는 뜻으로 문장 중간에 삽입되어 감사의 타이밍을 말해줍니다. 두 번째로는 전치사 for를 봐주세요. 감사의 구체적인 이유를 나타낼 때 쓰는 단어입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따뜻한 안부를 전하며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Warm \u003c/span>\u003cspan class=\"tgt\">regards\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마크 스미스\u003c/span>\u003cspan class=\"en\">Mark Smith\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따뜻한 안부를 전하며, Mark Smith\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지나 이메일을 끝낼 때 사용하는 \u003cb class=\"key\">맺음말\u003c/b>입니다. 격식을 차리면서도 \u003cb class=\"key\">친근함\u003c/b>을 담아 보내는 사람의 이름을 밝힙니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">편지의 맺음말\u003c/span> : [형용사] + [명사], : \"따뜻한 안부를 전하며\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Warm regards, 따뜻한 안부를 전하며. Mark Smith, 마크 스미스. 이 문장 전체를 해석하면, 따뜻한 안부를 전하며, Mark Smith","hl":"m"},{"n":37,"text":"편지를 다 쓰고 나서 마지막에 정중하게 작별 인사를 하는 부분이에요. 따뜻한 마음을 담아 안부를 전한다는 뜻으로 이해하면 됩니다.","hl":"mn"},{"n":38,"text":"이 부분은 하나의 덩어리 표현으로 알아두면 좋아요. Warm regards 뒤에는 반드시 쉼표를 찍고 그 아래에 보낸 사람의 이름을 쓰는 것이 편지의 규칙이랍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Lomos Tours의 매니저가 우수 고객에게 \u003cb class=\"key\">감사 \u003c/b>\u003cb class=\"key\">인사\u003c/b>를 전하며 편지를 시작합니다.\u003c/li>\u003cli>내년 새로운 \u003cb class=\"key\">광고 \u003c/b>\u003cb class=\"key\">캠페인\u003c/b>에 실제 고객의 여행 경험을 활용할 계획임을 밝힙니다.\u003c/li>\u003cli>고객의 \u003cb class=\"key\">피드백\u003c/b>이 서비스 홍보에 매우 소중하므로 정중하게 후기 공유를 \u003cb class=\"key\">요청\u003c/b>합니다.\u003c/li>\u003cli>우리 팀 직원이 곧 연락할 것을 알리고 미래의 \u003cb class=\"key\">기여\u003c/b>에 대해 미리 감사합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The manager of Lomos Tours is asking a loyal customer to share their travel experience for an upcoming promotional advertisement.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">Lomos \u003c/b>\u003cb class=\"key\">Tours\u003c/b>의 매니저가 우수 고객에게 내년 \u003cb class=\"key\">광고 \u003c/b>\u003cb class=\"key\">캠페인\u003c/b>에 사용할 \u003cb class=\"key\">여행 \u003c/b>\u003cb class=\"key\">경험\u003c/b> 공유를 정중하게 요청하는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"자, 이렇게 해서 Lomos Tours의 정중한 요청 편지를 모두 분석해 보았습니다. 비즈니스 레터의 격식 있는 표현들과 상대방에게 무언가를 부탁할 때의 논리적인 순서를 잘 익혀두면 좋겠죠? 오늘 배운 invaluable 같은 단어들은 시험에 정말 자주 나오니까 꼭 복습해 보세요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
