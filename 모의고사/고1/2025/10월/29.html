</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 29번","audioDir":"29_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">29번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>The Wisdom of Tradition and Humility in Nutrition\u003c/h1>\u003ch2>전통의 지혜와 영양학에 대한 겸손\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>수천 년간 검증된 \u003cb class=\"key\">전통적인 \u003c/b>\u003cb class=\"key\">식습관\u003c/b>의 지혜를 존중하고, 아직 역사가 짧은 \u003cb class=\"key\">영양학\u003c/b>의 잣대로 판단하기보다는 가공식품 대신 전통 음식을 우선시해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>We should value time-tested traditional diets over modern processed foods because our understanding of nutritional science is still limited.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 먹는 음식과 영양학을 바라보는 관점에 대해 아주 깊이 있는 통찰을 주는 지문을 함께 공부해 볼 거예요. 이 글은 우리가 현대의 가공식품보다 왜 전통적인 식습관을 더 존중해야 하는지, 그리고 왜 영양학 앞에서 겸손해야 하는지를 잘 설명해주고 있습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간은 오랜 세월 특정 환경의 자원을 활용하며 그에 맞춰 \u003cb class=\"key\">진화(evolution)\u003c/b>해 왔습니다. 급격한 식단의 변화는 우리 몸이 수천 년간 적응해 온 체계에 혼란을 줄 수 있는데, 이를 \u003cb class=\"key\">영양 \u003c/b>\u003cb class=\"key\">전환(nutrition \u003c/b>\u003cb class=\"key\">transition)\u003c/b>이라고 부르기도 합니다. 마치 구형 컴퓨터에 너무 무거운 \u003cb class=\"key\">최신 \u003c/b>\u003cb class=\"key\">소프트웨어\u003c/b>를 설치하면 오류가 나듯, 우리 몸도 갑작스러운 현대식 가공식품에 제대로 대응하지 못할 수 있습니다. 영양학은 아직 모든 영양소의 상호작용을 다 밝혀내지 못한 \u003cb class=\"key\">역사가 \u003c/b>\u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">과학(young \u003c/b>\u003cb class=\"key\">science)\u003c/b>입니다. 따라서 우리는 조상들의 지혜가 담긴 식단을 대할 때 더 \u003cb class=\"key\">겸손함(humility)\u003c/b>을 가져야 합니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 시작에 앞서 배경지식을 좀 알아볼까요? 인간은 수천 년 동안 특정 지역에서 나는 음식을 먹으며 그에 맞게 몸이 진화해 왔어요. 그런데 최근 들어 식단이 너무 빠르게 변하면서 우리 몸이 적응하지 못하는 영양 전환 현상이 일어나고 있죠. 영양학은 우리 몸의 비밀을 다 밝혀내기에는 아직 역사가 짧은 과학이에요. 마치 오래된 기계에 맞지 않는 새로운 부품을 억지로 끼워 넣으면 문제가 생기듯이, 우리 몸도 전통 식단에서 벗어날 때 큰 혼란을 겪을 수 있다는 점을 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인간의 진화\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>인간은 주어진 자원을 복잡하고 미묘하게 활용하도록 \u003cb class=\"key\">진화\u003c/b>해 왔음을 언급하며 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>식단 변화의 위험성\u003csmall>전환 · 문장 2\u003c/small>\u003c/h4>\u003cp>급격한 식단 변화는 우리 몸에 대한 거대한 \u003cb class=\"key\">영양 \u003c/b>\u003cb class=\"key\">실험\u003c/b>과 같다는 경고를 던집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>겸손과 영양학의 한계\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>아직 모르는 것이 많은 \u003cb class=\"key\">영양학의 \u003c/b>\u003cb class=\"key\">한계\u003c/b>를 인정하고 더 \u003cb class=\"key\">겸손함\u003c/b>을 가져야 한다고 주장합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>전통의 타당한 이유\u003csmall>근거 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>수천 년간 이어진 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">식단\u003c/b>에는 그럴만한 이유가 있으므로 가공식품보다 \u003cb class=\"key\">우선 \u003c/b>\u003cb class=\"key\">선택\u003c/b>해야 한다고 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>영양 전환의 부작용\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>전통 사회가 현대적 식단으로 바뀌며 겪는 \u003cb class=\"key\">부작용\u003c/b>을 보며 우리 식단을 \u003cb class=\"key\">성찰\u003c/b>해야 함을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"자, 그럼 지문이 어떤 순서로 이야기를 풀어가는지 단계별로 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째 단계에서는 인간이 가용 자원을 최대한 활용하도록 미묘하고 복잡하게 진화해 왔다는 기초 사실을 제시합니다. 우리 몸이 환경에 아주 정교하게 맞춰져 있다는 뜻이죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 경고입니다. 식단을 너무 빠르게 바꾸는 것은 우리 몸을 대상으로 거대한 영양 실험을 하는 것과 다름없다는 위험성을 지적하고 있어요.","hl":"f1"},{"n":6,"text":"세 번째 단계가 이 글의 핵심인 주장 부분인데요. 영양학은 아직 모르는 것이 너무 많은 젊은 학문이기에 우리는 더 겸손해져야 한다고 말합니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 수천 년간 지속된 전통 음식에는 다 그럴만한 이유가 있다는 점을 강조하며, 가공식품보다 전통 음식을 선택하는 것이 더 낫다는 구체적인 근거를 제시합니다.","hl":"f3"},{"n":8,"text":"마지막 다섯 번째 단계는 결론으로, 식단 변화를 겪으며 고통받는 전통 사회의 모습을 통해 현재 우리의 식단이 너무 멀리 온 것은 아닌지 되돌아보게 합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 중반부인 세 번째 문장에서 \u003cb class=\"key\">겸손함\u003c/b>이라는 핵심 주제를 던지고, 이후 다섯 번째 문장부터 구체적인 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">음식\u003c/b>의 사례와 근거를 제시합니다. 영양학의 \u003cb class=\"key\">미완성성\u003c/b>을 근거로 전통의 가치를 옹호하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>We ought to (3)\u003c/b>\u003cspan>필자의 강한 주장 표현\u003c/span>\u003cb>If ... we should assume (5)\u003c/b>\u003cspan>가정후 결론 도출\u003c/span>\u003cb>Witnessing (8)\u003c/b>\u003cspan>객관적 증거 제시를 통한 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Human beings\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">we\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">traditional foods\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">traditionally made fatty blood sausages\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">traditional societies\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Traditional foods\u003c/th>\u003cth>Highly processed ones\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Millennia of experience\u003c/td>\u003ctd>Quickly changed diets\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fatty blood sausages / Honey\u003c/td>\u003ctd>Factory-made salamis / Sweeteners\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글의 전개 방식은 필자의 주장을 먼저 던지고 이를 뒷받침하는 구체적인 예시와 근거를 나열하는 주장 근거 구조예요. 특히 글의 중간에 핵심 주장이 나오는 중괄식 구성을 취하고 있습니다.","hl":"ty"},{"n":10,"text":"세 번째 문장의 We ought to have more humility라는 표현은 필자가 독자에게 강력하게 전달하고 싶은 메시지를 담고 있어요. 또한 다섯 번째 문장의 If로 시작하는 조건문은 수천 년의 전통이 가진 가치를 가정하며 그 정당성을 부여하는 신호어 역할을 하죠. 마지막 문장의 Witnessing은 객관적인 관찰 결과를 통해 주장에 쐐기를 박는 역할을 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>evolved\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진화했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>make the most of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>최대한 이용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>resources\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원\u003c/span>\u003c/div>\u003cdiv>\u003cb>available\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이용 가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>subtle\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>미묘한\u003c/span>\u003c/div>\u003cdiv>\u003cb>complicated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>복잡한\u003c/span>\u003c/div>\u003cdiv>\u003cb>conduct\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시행하다, 수행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nutrition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영양\u003c/span>\u003c/div>\u003cdiv>\u003cb>humility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>겸손\u003c/span>\u003c/div>\u003cdiv>\u003cb>millennia\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수천 년\u003c/span>\u003c/div>\u003cdiv>\u003cb>assume\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추측하다, 가정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>proven\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>증명된\u003c/span>\u003c/div>\u003cdiv>\u003cb>otherwise\u003c/b>\u003cem>부사\u003c/em>\u003cspan>다르게, 그렇지 않게\u003c/span>\u003c/div>\u003cdiv>\u003cb>contemporary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>현대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>dietary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>식단의\u003c/span>\u003c/div>\u003cdiv>\u003cb>plate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>접시, 식사\u003c/span>\u003c/div>\u003cdiv>\u003cb>processed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가공된\u003c/span>\u003c/div>\u003cdiv>\u003cb>fatty\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지방이 많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>blood sausage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>블러드 소시지(순대 같은 음식)\u003c/span>\u003c/div>\u003cdiv>\u003cb>preferable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>선호되는, 더 나은\u003c/span>\u003c/div>\u003cdiv>\u003cb>lean\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지방이 적은, 살코기의\u003c/span>\u003c/div>\u003cdiv>\u003cb>superior\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>우월한, 더 나은\u003c/span>\u003c/div>\u003cdiv>\u003cb>sprinkle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소량, 뿌리기\u003c/span>\u003c/div>\u003cdiv>\u003cb>sweetener\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감미료\u003c/span>\u003c/div>\u003cdiv>\u003cb>witnessing\u003c/b>\u003cem>동사\u003c/em>\u003cspan>목격하는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>faring\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살아가는 것, 지내는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>undergo\u003c/b>\u003cem>동사\u003c/em>\u003cspan>겪다\u003c/span>\u003c/div>\u003cdiv>\u003cb>transition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전환, 변화\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어들을 살펴볼까요? humility는 겸손이라는 뜻으로 이 글의 핵심 키워드입니다. millennia는 수천 년이라는 긴 시간을 의미하는데, 전통의 가치를 설명할 때 쓰였죠. 그리고 contemporary는 현대의라는 뜻으로 전통과 대조되는 개념을 설명할 때 자주 등장합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">humility\u003c/b>\u003cspan class=\"m\">겸손\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">modesty\u003c/span>\u003cspan class=\"s\">humbleness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">arrogance\u003c/span>\u003cspan class=\"a\">pride\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">complicated\u003c/b>\u003cspan class=\"m\">복잡한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">complex\u003c/span>\u003cspan class=\"s\">intricate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003cspan class=\"a\">plain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">assume\u003c/b>\u003cspan class=\"m\">추측하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">suppose\u003c/span>\u003cspan class=\"s\">presume\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">superior\u003c/b>\u003cspan class=\"m\">우월한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">better\u003c/span>\u003cspan class=\"s\">paramount\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inferior\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contemporary\u003c/b>\u003cspan class=\"m\">현대의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">modern\u003c/span>\u003cspan class=\"s\">current\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ancient\u003c/span>\u003cspan class=\"a\">old-fashioned\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">transition\u003c/b>\u003cspan class=\"m\">전환\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">change\u003c/span>\u003cspan class=\"s\">shift\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stability\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼게요. humility는 modesty와 비슷하지만 오만함을 뜻하는 arrogance와는 반대예요. complicated는 복잡하다는 뜻으로 complex와 바꿔 쓸 수 있고, 간단하다는 simple과는 반대입니다. superior는 더 낫다는 뜻인데, 반대말인 inferior도 꼭 함께 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간은\u003c/span>\u003cspan class=\"en\">Human beings\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진화해 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">evolved\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최대한 이용하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게 이용 가능한 자원들을\u003c/span>\u003cspan class=\"en\">the resources \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">available\u003c/span> to them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방식들로\u003c/span>\u003cspan class=\"en\">in ways\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미묘하고 복잡한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> subtle and complicated.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인간은 그들에게 이용 가능한 자원들을 미묘하고 복잡한 방식들로 최대한 이용하도록 진화해 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간이 오랜 시간 생존을 위해 주변 환경에 적응해온 과정을 설명합니다. 자원을 활용하는 능력이 단순히 본능을 넘어 매우 \u003cb class=\"key\">정교\u003c/b>하고 \u003cb class=\"key\">복잡하게 \u003c/b>\u003cb class=\"key\">진화\u003c/b>해 왔음을 강조하는 도입부입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 시제\u003c/span> : have + [과거분사(p.p.)] : \"진화해 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적/결과)\u003c/span> : to + [동사원형] : \"최대한 이용하도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사의 후치 수식\u003c/span> : [명사] + [형용사구] : \"이용 가능한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : [선행사(ways)] + [that(주격 관계대명사)] + [동사(are)] : \"~한 (방식들)\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Human beings, 인간은. have evolved, 진화해 왔다. to make the most of, 최대한 이용하도록. the resources available to them, 그들에게 이용 가능한 자원들을. in ways, 방식들로. that are subtle and complicated, 미묘하고 복잡한. 이 문장 전체를 해석하면, 인간은 그들에게 이용 가능한 자원들을 미묘하고 복잡한 방식들로 최대한 이용하도록 진화해 왔다.","hl":"m"},{"n":14,"text":"인간은 아주 오랜 시간 동안 주변의 자원을 낭비 없이 사용하기 위해 몸과 지혜를 발달시켜 왔어요. 이런 과정은 우리가 생각하는 것보다 훨씬 더 정교하고 복잡한 진화 단계를 거쳐 완성된 것이라는 뜻이에요.","hl":"mn"},{"n":15,"text":"첫 번째로 have evolved는 과거부터 지금까지 이어져 온 변화를 보여주는 현재완료 시제예요. 두 번째로 to make the most of는 진화의 목적을 나타내는 to부정사의 부사적 용법이고요. 세 번째로 available은 뒤에서 앞의 명사를 꾸며주는 후치 형용사입니다. 마지막으로 that은 ways를 자세히 설명해주는 주격 관계대명사로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 우리의 식단을 바꿀 때,\u003c/span>\u003cspan class=\"en\">When we change our diets,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특히 우리가 매우 빠르게 그렇게 할 때,\u003c/span>\u003cspan class=\"en\">especially when we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">so\u003c/span> quickly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 실질적으로 시행하고 있는 것이다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">effectively \u003c/span>\u003cspan class=\"tgt\">conducting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 실험을\u003c/span>\u003cspan class=\"en\">huge experiments\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영양 섭취에서\u003c/span>\u003cspan class=\"en\">in nutrition.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 우리의 식단을 바꿀 때, 특히 우리가 매우 빠르게 그렇게 할 때, 우리는 실질적으로 영양 섭취에서 거대한 실험을 시행하고 있는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현대인들이 전통적인 식단을 급격히 바꾸는 행위가 가져올 수 있는 위험성을 경고합니다. 아무런 검증 없이 식단을 바꾸는 것을 우리 몸을 담보로 한 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">실험\u003c/b>에 \u003cb class=\"key\">비유\u003c/b>하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대동사 구문\u003c/span> : do + so (대용어) : \"그렇게 할 (때)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행 시제\u003c/span> : be동사 + [현재분사(~ing)] : \"실질적으로 시행하고 있는 것이다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"When we change our diets, 우리가 우리의 식단을 바꿀 때. especially when we do so quickly, 특히 우리가 매우 빠르게 그렇게 할 때. we are effectively conducting, 우리는 실질적으로 시행하고 있는 것이다. huge experiments, 거대한 실험을. in nutrition, 영양 섭취에서. 이 문장 전체를 해석하면, 우리가 우리의 식단을 바꿀 때, 특히 우리가 매우 빠르게 그렇게 할 때, 우리는 실질적으로 영양 섭취에서 거대한 실험을 시행하고 있는 것이다.","hl":"m"},{"n":17,"text":"우리가 오랫동안 먹어온 음식을 갑자기 바꾸는 건 우리 몸이 어떻게 반응할지 모르는 상태에서 하는 행동이죠. 그래서 필자는 이것을 우리 건강을 가지고 위험한 영양 실험을 하는 것과 같다고 비유하고 있어요.","hl":"mn"},{"n":18,"text":"첫 번째로 do so는 앞 문장의 change our diets라는 말을 반복하지 않기 위해 대신 쓴 대동사 표현이에요. 두 번째로 are conducting은 현재 우리가 하고 있는 행동의 의미를 생생하게 전달하기 위해 쓴 현재진행 시제입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는\u003c/span>\u003cspan class=\"en\">We\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가져야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ought \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 겸손해져야 (한다)\u003c/span>\u003cspan class=\"en\">more humility.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 더 겸손해져야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 영양학적 지식이 완벽하지 않다는 것을 인정해야 한다는 저자의 핵심 주장입니다. 인간의 짧은 지식으로 자연스러운 전통 식단을 함부로 바꾸는 것에 대해 \u003cb class=\"key\">반성\u003c/b>과 \u003cb class=\"key\">겸손\u003c/b>을 촉구합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사\u003c/span> : ought to + [동사원형] : \"~해야 한다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"We, 우리는. ought to have, 가져야 한다. more humility, 더 겸손해져야 (한다). 이 문장 전체를 해석하면, 우리는 더 겸손해져야 한다.","hl":"m"},{"n":20,"text":"우리가 영양에 대해 모든 것을 다 안다고 착각해서는 안 된다는 뜻이에요. 자연이 물려준 지혜 앞에서 우리의 지식은 아직 부족할 수 있으니 훨씬 더 겸손한 태도를 가져야 한다고 강하게 주장하는 문장입니다.","hl":"mn"},{"n":21,"text":"여기서 ought to는 우리가 흔히 쓰는 should와 뜻이 거의 같아요. 당연히 그렇게 해야 한다는 의무감을 표현하는 조동사로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영양학은 \u003c/span>\u003cspan class=\"en\">Nutritional science\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 역사가 짧고 \u003c/span>\u003cspan class=\"en\">is still young\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무나 많은 것이 있다 \u003c/span>\u003cspan class=\"en\">and there is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 모르는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">영양학은 여전히 역사가 짧고 우리가 모르는 것이 너무나 많다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 영양학이 학문으로서 아직 \u003cb class=\"key\">초기 \u003c/b>\u003cb class=\"key\">단계\u003c/b>에 있음을 언급하며 지식의 한계를 인정해야 한다고 말합니다. 우리가 현재 알고 있는 지식이 전부가 아닐 수 있으므로 \u003cb class=\"key\">신중한\u003c/b> 태도가 필요함을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : 명사(선행사) + [ (which/that) + 주어 + 동사 ] : \"우리가 모르는 너무나 많은 것\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Nutritional science, 영양학은. is still young, 여전히 역사가 짧고. and there is so much, 너무나 많은 것이 있다. we do not know, 우리가 모르는.. 이 문장 전체를 해석하면, 영양학은 여전히 역사가 짧고 우리가 모르는 것이 너무나 많다.","hl":"m"},{"n":23,"text":"영양학이 아직 학문적으로 초기 단계에 있다는 점을 강조하고 있어요. 그래서 우리가 아는 게 전부가 아닐 수 있으니 신중한 태도를 가져야 한다는 뜻이죠.","hl":"mn"},{"n":24,"text":"세 번째 조달인 so much 뒤에는 목적격 관계대명사 that이 생략되어 있어요. 우리가 모르는 대상이 바로 so much라는 것을 꾸며주고 있네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 우리가 특정한 음식들을 먹어 왔다면 \u003c/span>\u003cspan class=\"en\">If we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">eaten\u003c/span> certain foods\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정한 방식들로 \u003c/span>\u003cspan class=\"en\">in certain ways\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수천 년 동안, \u003c/span>\u003cspan class=\"en\">for millennia,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 추측해야 한다 \u003c/span>\u003cspan class=\"en\">we should assume\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 다르게 증명될 때까지는 \u003c/span>\u003cspan class=\"en\">until \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">proven\u003c/span> otherwise\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 그렇게 하는 타당한 이유가 있을 것이라고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> probably a good reason why.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 우리가 수천 년 동안 특정한 방식들로 특정한 음식들을 먹어 왔다면, 우리는 그것이 다르게 증명될 때까지는 아마도 그렇게 하는 타당한 이유가 있을 것이라고 추측해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오랜 시간 지속된 \u003cb class=\"key\">식습관\u003c/b>은 단순히 우연이 아니라 생존과 관련된 \u003cb class=\"key\">진화적 \u003c/b>\u003cb class=\"key\">이유\u003c/b>가 있을 것이라는 가설을 제시합니다. 입증되기 전까지는 전통적인 방식을 존중해야 한다는 논리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 (계속)\u003c/span> : have + [과거분사(p.p.)] : \"먹어 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + [과거분사(p.p.)] : \"그것이 증명되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : assume [타동사] + [that (접속사) + 주어 + 동사] : \"~라는 것을\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"If we have eaten certain foods, 만약 우리가 특정한 음식들을 먹어 왔다면. in certain ways, 특정한 방식들로. for millennia, 수천 년 동안. we should assume, 우리는 추측해야 한다. until it is proven otherwise, 그것이 다르게 증명될 때까지는. that there is probably a good reason why, 아마도 그렇게 하는 타당한 이유가 있을 것이라고.. 이 문장 전체를 해석하면, 만약 우리가 수천 년 동안 특정한 방식들로 특정한 음식들을 먹어 왔다면, 우리는 그것이 다르게 증명될 때까지는 아마도 그렇게 하는 타당한 이유가 있을 것이라고 추측해야 한다.","hl":"m"},{"n":26,"text":"수천 년간 이어진 식습관에는 분명히 그럴만한 식습관상의 진화적 이유가 있을 거라는 뜻이에요. 무언가 잘못됐다는 게 확실해지기 전까진 조상들의 지혜를 믿어야 한다는 거죠.","hl":"mn"},{"n":27,"text":"첫 번째로 have eaten은 수천 년 동안 계속 먹어왔다는 현재완료의 계속적 용법이에요. 두 번째로 it is proven은 주어가 증명되는 대상이니까 수동태를 썼죠. 마지막으로 that은 assume이라는 동사의 목적어 문장을 이끌어주는 명사절 접속사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전통 음식이 \u003c/span>\u003cspan class=\"en\">Traditional foods\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">딱 들어맞지 않는 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">fit\u003c/span> neatly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현대의 균형 잡힌 식단의 식사에 \u003c/span>\u003cspan class=\"en\">on the contemporary dietary food plate\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반적으로 선택되어야 한다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">generally \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">chosen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 가공된 음식보다 \u003c/span>\u003cspan class=\"en\">over highly processed \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">ones \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">딱 들어맞는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일반적으로 현대의 균형 잡힌 식단의 식사에 딱 들어맞지 않는 전통 음식이 딱 들어맞는 매우 가공된 음식보다 우선 선택되어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현대 과학이 정한 \u003cb class=\"key\">영양 \u003c/b>\u003cb class=\"key\">기준\u003c/b>에 부합하지 않더라도, 검증되지 않은 \u003cb class=\"key\">가공식품\u003c/b>보다는 오랜 시간 검증된 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">음식\u003c/b>이 더 낫다는 구체적인 지침을 제공합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 명사(선행사) + [that (주격 관계대명사) + 동사] : \"딱 들어맞지 않는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 수동태\u003c/span> : should + be + [과거분사(p.p.)] : \"일반적으로 선택되어야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정대명사와 대동사\u003c/span> : ones [부정대명사] + that [관계사] + do [대동사] : \"딱 들어맞는 것들(음식들)\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Traditional foods, 전통 음식이. that don't fit neatly, 딱 들어맞지 않는. on the contemporary dietary food plate, 현대의 균형 잡힌 식단의 식사에. should generally be chosen, 일반적으로 선택되어야 한다. over highly processed ones, 매우 가공된 음식보다. that do, 딱 들어맞는.. 이 문장 전체를 해석하면, 일반적으로 현대의 균형 잡힌 식단의 식사에 딱 들어맞지 않는 전통 음식이 딱 들어맞는 매우 가공된 음식보다 우선 선택되어야 한다.","hl":"m"},{"n":29,"text":"요즘 영양 기준에 안 맞는 것처럼 보여도 전통 음식이 가공식품보다 몸에 더 좋을 수 있다는 말이에요. 즉 가공식품보다는 오랜 시간 검증된 전통 음식을 먹으라는 조언이죠.","hl":"mn"},{"n":30,"text":"첫 번째로 that은 앞에 나온 전통 음식을 꾸며주는 주격 관계대명사예요. 두 번째로 should be chosen은 선택받는 입장이니까 조동사 뒤에 수동태를 썼고요. 마지막에 ones는 앞에 나온 foods를 대신하는 부정대명사, do는 fit이라는 동사를 대신하는 대동사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 추측해야 한다 전통적으로 만들어진 지방이 많은 블러드 소시지가 지방이 적고 공장에서 만들어진 살라미 소시지보다 더 선호되며, 그리고 몇 스푼의 꿀이 소량의 감미료보다 더 나은 것으로\u003c/span>\u003cspan class=\"en\">We should assume \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> traditionally made fatty blood sausages are \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">preferable \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> lean, factory­made salamis; that spoonfuls of honey are \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">superior \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> sprinkles of sweeteners.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 전통적으로 만들어진 지방이 많은 블러드 소시지가 지방이 적고 공장에서 만들어진 살라미 소시지보다 더 선호되며, 그리고 몇 스푼의 꿀이 소량의 감미료보다 더 나은 것으로 추측해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 만들어진 음식이 가공된 식품보다 건강에 더 이로울 수 있다는 점을 강조합니다. 성분을 단순화한 현대식보다 복잡하고 오래된 \u003cb class=\"key\">식습관의 \u003c/b>\u003cb class=\"key\">지혜\u003c/b>를 신뢰해야 한다는 맥락입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 (목적어)\u003c/span> : assume + [that + 주어 + 동사] : \"~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교 표현\u003c/span> : [A] is preferable to [B] : \"~보다 더 선호되는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교 표현\u003c/span> : [A] is superior to [B] : \"~보다 더 나은\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"We should assume, 우리는 추측해야 한다. that traditionally made fatty blood sausages, 전통적으로 만들어진 지방이 많은 블러드 소시지가. are preferable to lean, factory-made salamis, 지방이 적고 공장에서 만들어진 살라미 소시지보다 더 선호되며. that spoonfuls of honey, 그리고 몇 스푼의 꿀이. are superior to sprinkles of sweeteners, 소량의 감미료보다 더 나은 것으로. 이 문장 전체를 해석하면, 우리는 전통적으로 만들어진 지방이 많은 블러드 소시지가 지방이 적고 공장에서 만들어진 살라미 소시지보다 더 선호되며, 그리고 몇 스푼의 꿀이 소량의 감미료보다 더 나은 것으로 추측해야 한다.","hl":"m"},{"n":32,"text":"일곱 번째 문장은 가공된 음식보다 전통적인 음식이 더 좋다는 것을 당연하게 받아들여야 한다는 뜻이에요. 지방이 많은 전통 소시지가 공장식 살라미보다 낫고, 천연 꿀이 인공 감미료보다 우월하다는 구체적인 예시를 들고 있죠.","hl":"mn"},{"n":33,"text":"첫 번째 포인트로 접속사 that이 두 번 쓰여서 assume의 목적어 덩어리 두 개를 연결하고 있어요. 두 번째와 세 번째 포인트는 비교 표현인데, preferable to와 superior to 모두 than이 아니라 전치사 to를 써서 대상을 비교한다는 점을 꼭 기억해야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">목격하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Witnessing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전통 사회들이 얼마나 형편없이 살아가고 있는지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">poorly \u003c/span>\u003cspan class=\"tgt\">traditional \u003c/span>\u003cspan class=\"tgt\">societies \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">faring\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영양 전환을 겪으면서\u003c/span>\u003cspan class=\"en\">as they undergo a nutrition transition\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이미 그것을 완료한 이들로 하여금 ~하게 만들어야 할 것이다\u003c/span>\u003cspan class=\"en\">should \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">already \u003c/span>\u003cspan class=\"tgt\">completed \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 식단이 너무 멀리 간 것은 아닌지 의문을 제기하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">question\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">whether\u003c/span> their diets have moved too far.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전통 사회들이 영양 전환을 겪으면서 얼마나 형편없이 살아가고 있는지를 목격하는 것은 이미 그것(전환)을 완료한 이들로 하여금 자신들의 식단이 너무 멀리 간 것은 아닌지 의문을 제기하도록 만들어야 할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 급격한 영양 변화를 겪는 사회의 부작용을 보며, \u003cb class=\"key\">현대적 \u003c/b>\u003cb class=\"key\">식단\u003c/b>의 위험성을 깨달아야 한다는 경고입니다. 이미 전환을 끝낸 서구식 식단이 \u003cb class=\"key\">전통의 \u003c/b>\u003cb class=\"key\">지혜\u003c/b>에서 너무 멀어진 것은 아닌지 성찰을 촉구합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [Witnessing (동명사)] + [동사(should make)] : \"목격하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : [의문사(how poorly) + 주어 + 동사] : \"얼마나 형편없이 살아가고 있는지를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">사역동사 구문\u003c/span> : make + 목적어(those...) + 목적격보어(question) : \"~로 하여금 의문을 제기하도록 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">명사절 접속사\u003c/span> : question + [whether + 주어 + 동사] : \"~인지 아닌지\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Witnessing, 목격하는 것은. how poorly traditional societies are faring, 전통 사회들이 얼마나 형편없이 살아가고 있는지를. as they undergo a nutrition transition, 영양 전환을 겪으면서. should make those who have already completed it, 이미 그것을 완료한 이들로 하여금 ~하게 만들어야 할 것이다. question whether their diets have moved too far, 자신들의 식단이 너무 멀리 간 것은 아닌지 의문을 제기하도록. 이 문장 전체를 해석하면, 전통 사회들이 영양 전환을 겪으면서 얼마나 형편없이 살아가고 있는지를 목격하는 것은 이미 그것(전환)을 완료한 이들로 하여금 자신들의 식단이 너무 멀리 간 것은 아닌지 의문을 제기하도록 만들어야 할 것이다.","hl":"m"},{"n":35,"text":"여덟 번째 문장은 영양 전환을 겪는 사회들이 건강을 잃는 모습을 보면서, 이미 서구화된 식단을 가진 우리도 '우리가 너무 잘못된 방향으로 온 건 아닐까?'라고 반성해야 한다는 뜻이에요.","hl":"mn"},{"n":36,"text":"첫 번째로 문장의 주어는 동명사 Witnessing이 이끌고 있어요. 두 번째로 그 뒤에는 의문사, 주어, 동사 순서인 간접의문문이 나옵니다. 세 번째로 사역동사 make가 쓰여서 목적격 보어 자리에 동사원형인 question이 왔고요, 마지막으로 whether는 ~인지 아닌지라는 의미로 question의 목적어절을 이끌고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>인간은 주변 자원을 정교하게 활용하며 \u003cb class=\"key\">진화\u003c/b>해 온 존재임을 이해해야 합니다.\u003c/li>\u003cli>빠른 식단 변화는 신체에 대한 위험한 \u003cb class=\"key\">영양 \u003c/b>\u003cb class=\"key\">실험\u003c/b>이 될 수 있으므로 주의가 필요합니다.\u003c/li>\u003cli>\u003cb class=\"key\">영양학\u003c/b>은 아직 초기 단계이므로 인간은 식습관에 대해 더 \u003cb class=\"key\">겸손함\u003c/b>을 가져야 합니다.\u003c/li>\u003cli>오랜 시간 검증된 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">음식\u003c/b>이 가공식품보다 건강에 더 이로울 수 있음을 인정해야 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>We should value time-tested traditional diets over modern processed foods because our understanding of nutritional science is still limited.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">수천 년간 검증된 \u003cb class=\"key\">전통적인 \u003c/b>\u003cb class=\"key\">식습관\u003c/b>의 지혜를 존중하고, 아직 역사가 짧은 \u003cb class=\"key\">영양학\u003c/b>의 잣대로 판단하기보다는 가공식품 대신 전통 음식을 우선시해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"오늘 배운 내용을 정리하자면, 영양학의 한계를 인정하고 수천 년 동안 검증된 전통 식단의 지혜를 따르는 것이 중요하다는 것입니다. 여러분도 오늘 점심에 너무 가공된 음식보다는 건강한 전통 음식을 선택해 보는 건 어떨까요? 오늘 강의는 여기서 마치겠습니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
