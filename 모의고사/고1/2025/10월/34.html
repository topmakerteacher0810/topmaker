@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 34번","audioDir":"34_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">34번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>Beyond Human Likeness: The Capabilities Approach to Animal Justice\u003c/h1>\u003ch2>인간과의 유사성을 넘어: 동물의 정의를 위한 능력 접근법\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: \u003cb class=\"key\">능력 \u003c/b>\u003cb class=\"key\">접근법\u003c/b>(CA)은 동물을 인간과의 \u003cb class=\"key\">유사성\u003c/b>으로 평가하는 대신, 각 생명체가 종 고유의 방식대로 \u003cb class=\"key\">번영\u003c/b>할 기회를 가져야 한다고 주장합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The Capabilities Approach emphasizes that animals should be allowed to flourish according to their own species-specific nature, rather than being judged by their likeness to humans.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 동물의 권리를 바라보는 아주 특별하고 따뜻한 시선인 능력 접근법에 대해 배워볼 거예요. 이 글은 동물을 인간의 잣대로 평가하지 말고, 각자의 모습 그대로 존중해야 한다는 내용을 담고 있죠. 지문의 요지는 동물이 인간과 닮았는지 여부가 아니라, 각 생명체가 고유한 본성에 따라 번영할 수 있도록 해야 한다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문은 철학자 마사 누스바움이 제시한 \u003cb class=\"key\">능력 \u003c/b>\u003cb class=\"key\">접근법\u003c/b>(Capabilities Approach)을 동물 권리에 적용한 내용을 담고 있습니다. 기존의 동물 보호 논의가 주로 고통을 느끼는 능력에 집중했다면, 이 이론은 각 생명체가 타고난 \u003cb class=\"key\">잠재력\u003c/b>을 실현할 수 있는 조건을 강조합니다. 예를 들어, 새가 날 수 있고 물고기가 헤엄칠 수 있는 환경을 보장받는 것이 \u003cb class=\"key\">동물 \u003c/b>\u003cb class=\"key\">정의\u003c/b>(Animal Justice)의 핵심입니다. 마치 \u003cb class=\"key\">오케스트라\u003c/b>의 악기마다 고유한 소리를 내야 하듯, 모든 생명체는 인간의 기준이 아닌 그들만의 \u003cb class=\"key\">고유성\u003c/b>을 존중받아야 한다는 철학적 배경을 가지고 있습니다.\u003c/div>","segs":[{"n":2,"text":"이 이론은 마사 누스바움이라는 유명한 철학자가 발전시킨 능력 접근법이라는 개념이에요. 우리가 보통 동물을 보호할 때, 우리랑 비슷하게 지능이 높거나 귀여운 동물들을 더 챙겨주는 경향이 있잖아요? 하지만 이 이론은 그런 인간 중심적인 생각에서 벗어나라고 말합니다. 모든 생명체는 각자 타고난 잠재력을 발휘할 권리가 있다는 거예요. 마치 오케스트라에서 바이올린은 바이올린다운 소리를, 북은 북다운 소리를 내야 아름다운 음악이 완성되는 것과 같은 원리라고 생각하면 이해하기 쉬울 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 문제 제기\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>능력 접근법(CA)의 개념을 소개하며, 이것이 \u003cb class=\"key\">동물 \u003c/b>\u003cb class=\"key\">정의\u003c/b>에 왜 중요한지에 대한 \u003cb class=\"key\">질문\u003c/b>을 던집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>기존 방식과의 차이\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>CA는 인간과의 \u003cb class=\"key\">유사성\u003c/b>으로 순위를 매기지 않으며, 모든 생명체에 대해 \u003cb class=\"key\">동등한 \u003c/b>\u003cb class=\"key\">관심\u003c/b>을 기울입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>인간 중심주의 비판\u003csmall>주장 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>동물의 권리를 생각할 때 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">삶\u003c/b>을 기준으로 삼는 것은 \u003cb class=\"key\">무관하며\u003c/b>, 그들 자신의 삶이 중요하다고 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>종별 고유성 인정\u003csmall>예시 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>핀치나 고래가 각자의 삶을 추구하듯, 동물을 \u003cb class=\"key\">열등한 \u003c/b>\u003cb class=\"key\">인간\u003c/b>으로 보지 말고 그 자체로 \u003cb class=\"key\">이해\u003c/b>해야 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>핵심 결론\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>모든 \u003cb class=\"key\">지각 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">생명체\u003c/b>는 자신의 종적 특성에 맞게 \u003cb class=\"key\">번영\u003c/b>할 기회를 가져야 한다는 최종 결론을 내립니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 흐름을 따라가며 능력 접근법이 무엇인지 구체적으로 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장은 능력 접근법이 무엇인지 질문을 던지며 시작해요. 법률가들이 왜 여기에 관심을 가지는지 궁금증을 유발한 뒤, 우선 이 이론이 무엇이 아닌지부터 설명하며 명확한 정의를 내릴 준비를 합니다.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장은 대조를 보여줍니다. 기존의 이론들이 인간과 얼마나 닮았는지에 따라 동물에게 등급을 매겼다면, 능력 접근법은 핀치새나 고래나 똑같은 관심을 가져야 한다고 말합니다. 어떤 동물이 더 우월하다는 편견을 버리라는 것이죠.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장에서는 아주 중요한 주장을 해요. 우리가 동물의 권리를 생각할 때 인간의 삶의 방식은 무관하다는 거예요. 진짜 중요한 것은 바로 그 동물들 고유의 삶의 형태라는 점을 강조하고 있습니다.","hl":"f2"},{"n":7,"text":"일곱 번째와 여덟 번째 문장은 예시와 당부를 전합니다. 인간이 인간다운 삶을 살고 싶어 하듯, 핀치는 핀치다운 삶을 원한다는 것이죠. 그래서 우리는 동물을 모자란 인간처럼 상상하는 게으름을 피우지 말고, 그들을 깊이 배우고 이해하려고 노력해야 합니다.","hl":"f3"},{"n":8,"text":"마지막 아홉 번째 문장은 글의 핵심 결론이에요. 지각 능력이 있는 모든 생명체는 자신만의 고유한 삶의 방식대로 번영할 수 있는 기회를 가져야 한다는 능력 접근법의 최종 목표를 제시하며 마무리됩니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 시작에서 \u003cb class=\"key\">능력 \u003c/b>\u003cb class=\"key\">접근법\u003c/b>의 개념을 질문으로 던지고, 마지막에 핵심 결론을 제시하는 \u003cb class=\"key\">양괄식\u003c/b> 구조입니다. 특히 인간 유사성을 기준으로 삼는 \u003cb class=\"key\">기존 \u003c/b>\u003cb class=\"key\">이론\u003c/b>과 동물의 고유성을 강조하는 \u003cb class=\"key\">CA\u003c/b>를 명확히 \u003cb class=\"key\">대조\u003c/b>하여 논지를 강화하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>What is...? (1)\u003c/b>\u003cspan>개념 도입을 위한 질문\u003c/span>\u003cb>does not... as do some other (3)\u003c/b>\u003cspan>타 이론과의 대조\u003c/span>\u003cb>Just as... so (7)\u003c/b>\u003cspan>인간과 동물의 요구를 비교하며 논리 강화\u003c/span>\u003cb>According to (9)\u003c/b>\u003cspan>이론에 기반한 최종 주장 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Capabilities Approach\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">each type of animal needs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their own forms of life\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">flourish in the form of life characteristic\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>인간 유사성 접근법\u003c/th>\u003cth>능력 접근법 (CA)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인간과의 닮음(likeness) 기준\u003c/td>\u003ctd>종 고유의 형태(own forms) 기준\u003c/td>\u003c/tr>\u003ctr>\u003ctd>동물 간 서열(rank) 부여\u003c/td>\u003ctd>모든 존재에 대한 평등한 관심\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 질문으로 시작해서 답을 찾아가다가 마지막에 핵심 주장을 다시 강조하는 양괄식 구조를 띠고 있어요. 특히 능력 접근법이라는 새로운 개념을 설명하기 위해 기존의 인간 중심적 사고방식과 대조하는 방식을 사용하고 있습니다.","hl":"ty"},{"n":10,"text":"문장 곳곳에 신호어가 숨어 있는데요. 세 번째 문장의 does not rank animals by likeness는 기존 방식과의 차별점을 보여주죠. 일곱 번째 문장의 Just as와 so 구문은 인간과 동물의 본질적 요구가 같다는 것을 비유적으로 잘 드러냅니다. 마지막에 According to는 이론의 결론을 이끌어내는 역할을 하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>capability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>approach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>접근법\u003c/span>\u003c/div>\u003cdiv>\u003cb>passionate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>열정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>justice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정의\u003c/span>\u003c/div>\u003cdiv>\u003cb>care about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 관심을 가지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rank\u003c/b>\u003cem>동사\u003c/em>\u003cspan>순위를 매기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>likeness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유사성\u003c/span>\u003c/div>\u003cdiv>\u003cb>seek\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>privilege\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특권\u003c/span>\u003c/div>\u003cdiv>\u003cb>theoretical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이론적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>concern\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관심, 배려\u003c/span>\u003c/div>\u003cdiv>\u003cb>finch\u003c/b>\u003cem>명사\u003c/em>\u003cspan>핀치(새의 일종)\u003c/span>\u003c/div>\u003cdiv>\u003cb>whale\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고래\u003c/span>\u003c/div>\u003cdiv>\u003cb>irrelevant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무관한\u003c/span>\u003c/div>\u003cdiv>\u003cb>deserve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~를 누릴 자격이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>relevant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관련 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>characteristic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고유한, 특유의\u003c/span>\u003c/div>\u003cdiv>\u003cb>extend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lazily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>성의 없이, 게으르게\u003c/span>\u003c/div>\u003cdiv>\u003cb>picture\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다, 묘사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lesser\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>열등한\u003c/span>\u003c/div>\u003cdiv>\u003cb>sentient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지각 능력이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>creature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생명체\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>flourish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>번영하다, 잘 자라다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어를 몇 개 살펴볼까요? flourish는 단순히 사는 게 아니라 번영한다는 뜻이고, sentient는 지각 능력이 있다는 뜻이에요. characteristic이라는 단어는 고유한 특징을 나타낼 때 아주 자주 쓰이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">likeness\u003c/b>\u003cspan class=\"m\">유사성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">similarity\u003c/span>\u003cspan class=\"s\">resemblance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">difference\u003c/span>\u003cspan class=\"a\">dissimilarity\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">flourish\u003c/b>\u003cspan class=\"m\">번영하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thrive\u003c/span>\u003cspan class=\"s\">prosper\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wither\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">irrelevant\u003c/b>\u003cspan class=\"m\">무관한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unrelated\u003c/span>\u003cspan class=\"s\">inapplicable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relevant\u003c/span>\u003cspan class=\"a\">pertinent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">characteristic\u003c/b>\u003cspan class=\"m\">고유한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">typical\u003c/span>\u003cspan class=\"s\">distinctive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">untypical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sentient\u003c/b>\u003cspan class=\"m\">지각 능력이 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conscious\u003c/span>\u003cspan class=\"s\">aware\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 챙겨 봅시다. likeness는 similarity와 같은 뜻이지만 difference와는 반대죠. flourish는 thrive와 바꿔 쓸 수 있고, irrelevant는 무관하다는 뜻인데 relevant와는 정반대 의미를 가집니다. characteristic은 typical이나 distinctive로 바꿔 써도 문맥이 잘 통해요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">능력 접근법(CA)이란 무엇이며,\u003c/span>\u003cspan class=\"en\">What is the Capabilities Approach (CA),\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">법률가들이 왜\u003c/span>\u003cspan class=\"en\">and why would lawyers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물 정의에 열정을 가진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">passionate \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">animal \u003c/span>\u003cspan class=\"tgt\">justice\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 관심을 가질까?\u003c/span>\u003cspan class=\"en\">care about it?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">능력 접근법(CA)이란 무엇이며, 동물 정의에 열정을 가진 법률가들이 왜 그것에 관심을 가질까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 핵심 소재인 \u003cb class=\"key\">능력 \u003c/b>\u003cb class=\"key\">접근법\u003c/b>을 소개하며, 이것이 \u003cb class=\"key\">동물권\u003c/b> 보호를 위해 일하는 법률가들에게 중요한 이유가 있음을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사구의 후치 수식\u003c/span> : 명사(lawyers) + 형용사구(passionate about...) : \"동물 정의에 열정적인 (법률가들)\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"What is the Capabilities Approach (CA), 능력 접근법(CA)이란 무엇이며. and why would lawyers, 법률가들이 왜. passionate about animal justice, 동물 정의에 열정을 가진. care about it?, 그것에 관심을 가질까?. 이 문장 전체를 해석하면, 능력 접근법(CA)이란 무엇이며, 동물 정의에 열정을 가진 법률가들이 왜 그것에 관심을 가질까?","hl":"m"},{"n":14,"text":"이 문장은 글 전체의 주제를 제시하는 도입부예요. 능력 접근법이라는 생소한 개념을 던지면서, 특히 동물들의 정의로운 대우를 위해 노력하는 법률가들이 왜 이 이론에 주목하는지 궁금증을 유발하고 있죠.","hl":"mn"},{"n":15,"text":"여기서 주목할 문법은 명사 lawyers 뒤에 나온 passionate about animal justice예요. 형용사구인 이 부분이 뒤에서 앞에 있는 lawyers를 수식하는 후치 수식 구조죠. lawyers와 passionate 사이에는 주격관계대명사 who와 be동사 are 가 생략되었다고 이해하면 편해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉽다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">easy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 아닌 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것이 아닌 것을 말하는 것이 쉽다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 능력 접근법이 무엇인지 바로 설명하기보다는, 이 이론이 \u003cb class=\"key\">배제\u003c/b>하거나 \u003cb class=\"key\">거부\u003c/b>하는 속성부터 먼저 언급하겠다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It과 진주어 to부정사\u003c/span> : It [가주어] + be동사 + 형용사 + to-v [진주어] : \"말하는 것은 쉽다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문대명사 what이 이끄는 명사절\u003c/span> : say [타동사] + what [목적어 역할 명사절] : \"그것이 아닌 것\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"It is easy, 쉽다. to say, 말하는 것이. what it is not, 그것이 아닌 것을. 이 문장 전체를 해석하면, 그것이 아닌 것을 말하는 것이 쉽다.","hl":"m"},{"n":17,"text":"본격적인 정의를 내리기 전에, 능력 접근법에 포함되지 않는 것들이 무엇인지부터 살펴보겠다는 뜻이에요. 즉, 이 이론의 반대 지점을 먼저 명확히 하겠다는 것이죠.","hl":"mn"},{"n":18,"text":"첫 번째로 가주어와 진주어 구조를 보세요. It은 해석하지 않고, 뒤에 나오는 to say 이하를 주어로 해석해야 해요. 두 번째로 what it is not은 say의 목적어 자리에 쓰인 명사절로, 그것이 무엇이 아닌지를 뜻해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">CA는 동물들을 순위를 매기지 않는다\u003c/span>\u003cspan class=\"en\">The CA does not rank animals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간과의 유사성에 따라\u003c/span>\u003cspan class=\"en\">by likeness to humans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 각별한 특권을 부여하려 하지 않는다\u003c/span>\u003cspan class=\"en\">or seek special privileges\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 ‘우리와 비슷한’ 존재로 여겨지는 동물에게\u003c/span>\u003cspan class=\"en\">for \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">considered\u003c/span> most &quot;like us,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 널리 퍼진 이론적 접근들이 그러하듯\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">popular \u003c/span>\u003cspan class=\"tgt\">theoretical \u003c/span>\u003cspan class=\"tgt\">approaches\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">CA는 다른 널 리 퍼진 이론적 접근들이 그러하듯, 동물들을 인간과의 유사성에 따라 순위를 매기거나 가장 ‘우리와 비슷한’ 존재로 여겨지는 동물에게 각별한 특권을 부여하려 하지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 능력 접근법은 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">중심\u003c/b>의 유사성 기준으로 생명을 차별하지 않으며, 기존의 다른 이론들과의 \u003cb class=\"key\">차별점\u003c/b>을 명확히 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : 명사(those) + 과거분사(considered) : \"여겨지는 존재들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">as 대동사 도치 구문\u003c/span> : as + do(대동사) + S(주어) : \"다른 접근들이 그러하듯이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사구의 병렬 구조\u003c/span> : does not + [V1(rank) + or + V2(seek)] : \"순위를 매기거나 부여하려 하지 (않는다)\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"The CA does not rank animals, CA는 동물들을 순위를 매기지 않는다. by likeness to humans, 인간과의 유사성에 따라. or seek special privileges, 또는 각별한 특권을 부여하려 하지 않는다. for those considered most \"like us,\", 가장 ‘우리와 비슷한’ 존재로 여겨지는 동물에게. as do some other popular theoretical approaches, 다른 널리 퍼진 이론적 접근들이 그러하듯. 이 문장 전체를 해석하면, CA는 다른 널 리 퍼진 이론적 접근들이 그러하듯, 동물들을 인간과의 유사성에 따라 순위를 매기거나 가장 ‘우리와 비슷한’ 존재로 여겨지는 동물에게 각별한 특권을 부여하려 하지 않는다.","hl":"m"},{"n":20,"text":"기존의 이론들은 인간과 얼마나 닮았느냐를 기준으로 동물들의 등급을 매기곤 했지만, 능력 접근법은 그런 인간 중심적인 방식을 거부한다는 아주 중요한 문장이에요. 서술형 대비로도 꼭 챙겨야 합니다.","hl":"mn"},{"n":21,"text":"문법 포인트가 세 개나 있어요. 첫 번째로 does not 뒤에 rank와 seek가 or로 연결되어 병렬을 이루고 있죠. 둘 뒤에 those considered는 여겨지는 존재들이라는 수동의 의미를 담아 후치 수식하고 있어요. 세 번째로 문장 끝에 as do는 주어와 동사가 도치된 형태인데, 여기서 do는 앞의 일반 동사들을 대신하는 대동사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">CA는 관심을 가집니다\u003c/span>\u003cspan class=\"en\">The CA has concern\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">핀치와 돼지에게\u003c/span>\u003cspan class=\"en\">for the finch and the pig\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만큼이나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">as\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고래와 코끼리에게.\u003c/span>\u003cspan class=\"en\">the whale and the elephant.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">CA는 고래와 코끼리에게만큼이나 핀치와 돼지에게도 관심을 가진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> CA(역량 접근법)가 동물의 크기나 지능에 상관없이 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">생명체\u003c/b>를 동등하게 중요하게 여긴다는 것을 \u003cb class=\"key\">비교 \u003c/b>\u003cb class=\"key\">구문\u003c/b>을 통해 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">원급을 이용한 비교 표현\u003c/span> : as + 원급(much) + as : \"~만큼이나 많이\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"The CA has concern, CA는 관심을 가집니다. for the finch and the pig, 핀치와 돼지에게. as much as, 만큼이나. the whale and the elephant, 고래와 코끼리에게.. 이 문장 전체를 해석하면, CA는 고래와 코끼리에게만큼이나 핀치와 돼지에게도 관심을 가진다.","hl":"m"},{"n":23,"text":"이 문장은 CA라는 이론이 동물을 차별하지 않는다는 걸 보여줘요. 아주 작은 핀치새나 평범한 돼지도 거대한 고래나 코끼리만큼 소중하게 다뤄야 한다는 뜻이죠. 즉, 생명의 가치를 크기로 따지지 않는다는 모든 생명체의 평등을 말하고 있어요.","hl":"mn"},{"n":24,"text":"첫 번째 포인트는 as much as입니다. 이 표현은 원급 비교를 써서 두 대상에 대한 관심의 정도가 똑같다는 것을 보여주죠. 핀치와 돼지라는 소형 동물과 고래와 코끼리라는 대형 동물을 동등하게 비교하며 동일한 관심을 강조하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 주장합니다\u003c/span>\u003cspan class=\"en\">And it argues\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 삶의 형태는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">form \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">life \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그저 무관하다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">simply \u003c/span>\u003cspan class=\"tgt\">irrelevant\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 생각할 때\u003c/span>\u003cspan class=\"en\">when we think about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각 종류의 동물이 무엇을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">type \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">animal \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">필요로 하고 마땅히 누려야 할지에 대해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">needs \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">deserves\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 그것은 우리가 각 종류의 동물이 필요로 하고 마땅히 누려야 할 것에 대해 생각할 때, 인간의 삶의 형태는 그저 무관하다고 주장한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물의 권리를 논할 때 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">기준\u003c/b>을 잣대로 삼는 것은 적절하지 않으며, 각 동물의 \u003cb class=\"key\">본연의 \u003c/b>\u003cb class=\"key\">필요\u003c/b>에 집중해야 한다는 핵심 논리를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : argues [타동사] + that [접속사] + S + V : \"인간의 삶의 형태가 무관하다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문대명사/관계대명사 what\u003c/span> : think about [전치사] + what [목적어 역할 명사절] : \"각 종류의 동물이 필요로 하고 누려야 할 것\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"And it argues, 그리고 그것은 주장합니다. that the human form of life, 인간의 삶의 형태는. is simply irrelevant, 그저 무관하다고. when we think about, 우리가 생각할 때. what each type of animal, 각 종류의 동물이 무엇을. needs and deserves, 필요로 하고 마땅히 누려야 할지에 대해.. 이 문장 전체를 해석하면, 그리고 그것은 우리가 각 종류의 동물이 필요로 하고 마땅히 누려야 할 것에 대해 생각할 때, 인간의 삶의 형태는 그저 무관하다고 주장한다.","hl":"m"},{"n":26,"text":"동물들에게 무엇이 필요한지 고민할 때, 자꾸 우리 인간을 기준으로 생각하지 말라는 뜻이에요. 인간처럼 말을 하느냐 도구를 쓰느냐 같은 인간 중심의 기준은 동물의 행복을 판단하는 데 아무런 상관이 없다는 아주 강한 주장입니다.","hl":"mn"},{"n":27,"text":"첫 번째로 argues 뒤에 나오는 that은 명사절 접속사예요. 주장하는 구체적인 내용을 문장으로 연결해주죠. 두 번째로 what은 선행사를 포함한 관계대명사나 의문사로 볼 수 있는데, 동물들이 진정으로 필요로 하는 것 그 자체를 나타내는 목적어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관련이 있는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">relevant\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 고유의 삶의 형태.\u003c/span>\u003cspan class=\"en\">their own forms of life.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">관련이 있는 것은 ‘그들 고유의’ 삶의 형태이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장과 대조되어, 동물을 이해하는 진정한 기준은 인간이 아닌 \u003cb class=\"key\">동물 \u003c/b>\u003cb class=\"key\">자신\u003c/b>의 \u003cb class=\"key\">고유한 \u003c/b>\u003cb class=\"key\">습성\u003c/b>과 방식이어야 함을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what절 (주어)\u003c/span> : What [주어] + is [동사] + relevant [보어] : \"관련이 있는 것\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"What is relevant, 관련이 있는 것은. is, 이다. their own forms of life, 그들 고유의 삶의 형태.. 이 문장 전체를 해석하면, 관련이 있는 것은 ‘그들 고유의’ 삶의 형태이다.","hl":"m"},{"n":29,"text":"그럼 무엇이 진짜 중요할까요? 바로 동물들이 원래 살아가는 방식 그 자체입니다. 물고기는 물고기답게, 새는 새답게 살아가는 그 고유한 모습이 권리 판단의 유일한 기준이 되어야 한다는 핵심 결론이에요.","hl":"mn"},{"n":30,"text":"문장의 시작인 What is relevant를 주목하세요. 관계대명사 what이 이끄는 절이 문장 전체의 주어 역할을 하고 있어요. 단수 취급하기 때문에 뒤에 동사 is가 왔다는 점도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꼭 인간이 추구하는 것처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Just \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> humans seek\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누릴 수 있기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">enjoy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간다운 삶의 고유한 좋은 것들을\u003c/span>\u003cspan class=\"en\">the characteristic goods of a human life,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 그렇게 핀치는 핀치의 삶을 추구하고\u003c/span>\u003cspan class=\"en\">so a finch seeks a finch's life\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고래는 고래의 삶을 추구한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">whale \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">whale's \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">꼭 인간이 인간다운 삶의 고유한 좋은 것들을 누릴 수 있기를 추구하는 것처럼, 핀치는 핀치의 삶을, 고래는 고래의 삶을 추구한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">동물과 \u003c/b>\u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">평등성\u003c/b>을 강조하며, 각 종이 가진 \u003cb class=\"key\">고유한 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 존중해야 함을 설명합니다. 인간의 기준이 아닌 각 동물의 \u003cb class=\"key\">본성\u003c/b>에 따른 삶의 중요성을 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 구조 (Just as ~, so ...)\u003c/span> : Just as + [주어1+동사1], so + [주어2+동사2] : \"꼭 ~인 것처럼, 그렇게 ...하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : seek [타동사] + [to be able to (to부정사구/목적어)] : \"누릴 수 있기를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사 생략 구문\u003c/span> : and + [주어] + (동사 생략) + [목적어] : \"고래는 고래의 삶을 (추구한다)\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Just as humans seek, 꼭 인간이 추구하는 것처럼. to be able to enjoy, 누릴 수 있기를. the characteristic goods of a human life, 인간다운 삶의 고유한 좋은 것들을. so a finch seeks a finch's life, 그 그렇게 핀치는 핀치의 삶을 추구하고. and the whale a whale's life, 고래는 고래의 삶을 추구한다.. 이 문장 전체를 해석하면, 꼭 인간이 인간다운 삶의 고유한 좋은 것들을 누릴 수 있기를 추구하는 것처럼, 핀치는 핀치의 삶을, 고래는 고래의 삶을 추구한다.","hl":"m"},{"n":32,"text":"이 문장은 동물과 인간이 동등한 권리를 가진다는 점을 강조하고 있어요. 인간이 인간답게 살고 싶어 하듯, 동물도 그들만의 본성에 따른 삶을 살 권리가 있다는 고유한 가치를 말하고 있죠.","hl":"mn"},{"n":33,"text":"첫 번째로 문장 맨 앞의 Just as는 뒤에 나오는 so와 짝을 이루어 쓰였어요. 우리말로는 뭐뭐인 것과 마찬가지로 그렇게 뭐뭐하다라는 뜻으로 비교와 대조를 통해 내용을 강조합니다. 두 번째로 to be able to enjoy는 동사 seek의 목적어 역할을 하는 명사적 용법으로 쓰였고요. 마지막 세 번째는 whale 뒤에 seeks라는 동사가 생략된 것을 찾아내야 해요. 앞에 나온 단어가 반복될 때 일어나는 생략 구조를 잘 파악해 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 스스로를 확장하고\u003c/span>\u003cspan class=\"en\">We should \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">extend \u003c/span>\u003cspan class=\"tgt\">ourselves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배워야 하며,\u003c/span>\u003cspan class=\"en\">and learn,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물들을 성의 없이 상상해서는 안 된다\u003c/span>\u003cspan class=\"en\">not lazily picture animals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열등한 인간으로,\u003c/span>\u003cspan class=\"en\">as lesser humans,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶을 추구한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">seeking \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리와 같은 식의.\u003c/span>\u003cspan class=\"en\">sort of like our own.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 스스로를 확장하고 배워야 하며, 동물들을 열등한 인간으로, 우리와 같은 식의 삶을 추구한다고 성의 없이 상상해서는 안 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간 중심적인 \u003cb class=\"key\">편견\u003c/b>에서 벗어나 동물의 입장을 이해하려는 \u003cb class=\"key\">적극적인 \u003c/b>\u003cb class=\"key\">노력\u003c/b>이 필요함을 역설합니다. 동물을 인간보다 \u003cb class=\"key\">열등한 \u003c/b>\u003cb class=\"key\">존재\u003c/b>로 보지 말라는 경고입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">재귀대명사의 재귀적 용법\u003c/span> : [주어] + [타동사] + [재귀대명사(목적어)] : \"스스로를 확장하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 후치 수식\u003c/span> : [명사(animals)] + [현재분사구(seeking~)] : \"삶을 추구하는 (것으로)\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"We should extend ourselves, 우리는 스스로를 확장하고. and learn, 배워야 하며. not lazily picture animals, 동물들을 성의 없이 상상해서는 안 된다. as lesser humans, 열등한 인간으로. seeking a life, 삶을 추구한다고. sort of like our own, 우리와 같은 식의.. 이 문장 전체를 해석하면, 우리는 스스로를 확장하고 배워야 하며, 동물들을 열등한 인간으로, 우리와 같은 식의 삶을 추구한다고 성의 없이 상상해서는 안 된다.","hl":"m"},{"n":35,"text":"우리가 가진 인간 중심적인 편견을 깨야 한다는 의미예요. 동물을 단순히 인간보다 열등한 존재로 보지 말고, 그들의 입장을 이해하려는 적극적인 노력이 필요하다고 설명합니다.","hl":"mn"},{"n":36,"text":"첫 번째로 extend ourselves를 보면 주어인 we와 목적어가 같아서 재귀대명사의 재귀적 용법이 쓰였어요. 스스로의 인식을 넓혀야 한다는 뜻이죠. 두 번째 포인트는 seeking a life 부분이에요. 현재분사가 앞에 나온 명사를 보충 설명하면서 뭐뭐를 추구하는이라는 능동의 의미를 더해 주고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">CA에 따르면,\u003c/span>\u003cspan class=\"en\">According to the CA,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지각 능력이 있는 각각의 생명체는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">sentient \u003c/span>\u003cspan class=\"tgt\">creature\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기회를 가져야 한다\u003c/span>\u003cspan class=\"en\">should have the \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">opportunity \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">번영할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">flourish\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶의 형태로\u003c/span>\u003cspan class=\"en\">in the form of life\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 생명체에게 고유한.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">characteristic \u003c/span>\u003cspan class=\"tgt\">for\u003c/span> that creature.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">CA에 따르면, 지각 능력이 있는 각각의 생명체는 그 생명체에게 고유한 삶의 형태로 번영할 기회를 가져야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> CA 이론의 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">결론\u003c/b>으로, 모든 지각 있는 존재의 \u003cb class=\"key\">행복할 \u003c/b>\u003cb class=\"key\">권리\u003c/b>를 정의합니다. 각 존재가 타고난 \u003cb class=\"key\">잠재력\u003c/b>을 발휘할 수 있는 환경의 중요성을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">each + 단수 명사\u003c/span> : each + [단수 명사] : \"각각의 지각 있는 생명체\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [명사] + [to부정사] : \"번영할 기회\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사구의 후치 수식\u003c/span> : [명사] + [형용사구] : \"고유한 (삶의 형태)\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"According to the CA, CA에 따르면. each sentient creature, 지각 능력이 있는 각각의 생명체는. should have the opportunity, 기회를 가져야 한다. to flourish, 번영할. in the form of life, 삶의 형태로. characteristic for that creature, 그 생명체에게 고유한.. 이 문장 전체를 해석하면, CA에 따르면, 지각 능력이 있는 각각의 생명체는 그 생명체에게 고유한 삶의 형태로 번영할 기회를 가져야 한다.","hl":"m"},{"n":38,"text":"이 글의 최종 결론으로 모든 생명체는 행복할 권리가 있다는 뜻이에요. 각 존재가 자신이 가진 잠재력을 충분히 발휘하며 번영하며 살 수 있도록 보장해야 한다는 핵심 내용을 담고 있습니다.","hl":"mn"},{"n":39,"text":"첫 번째로 each 뒤에는 항상 단수 명사가 온다는 점에 주의하세요. 그래서 creature에 s가 붙지 않았죠. 두 번째는 to flourish가 앞의 명사를 수식하는 to부정사의 형용사적 용법으로 쓰여서 번영할 기회라고 해석됩니다. 마지막으로 형용사구인 characteristic for가 뒤에서 앞의 명사를 수식하는 후치 수식 구조도 꼭 확인해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">능력 \u003c/b>\u003cb class=\"key\">접근법\u003c/b>(CA)은 동물을 인간과 얼마나 닮았는가로 평가하는 방식에 반대합니다.\u003c/li>\u003cli>고래, 코끼리부터 핀치, 돼지까지 모든 동물의 \u003cb class=\"key\">고유한 \u003c/b>\u003cb class=\"key\">요구\u003c/b>를 중시합니다.\u003c/li>\u003cli>동물의 필요를 판단할 때 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">삶\u003c/b>을 기준으로 삼는 것은 무관하며 지양해야 합니다.\u003c/li>\u003cli>모든 \u003cb class=\"key\">지각 \u003c/b>\u003cb class=\"key\">능력\u003c/b> 있는 생명체는 그들만의 방식으로 \u003cb class=\"key\">번영\u003c/b>할 기회를 얻어야 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The Capabilities Approach emphasizes that animals should be allowed to flourish according to their own species-specific nature, rather than being judged by their likeness to humans.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: \u003cb class=\"key\">능력 \u003c/b>\u003cb class=\"key\">접근법\u003c/b>(CA)은 동물을 인간과의 \u003cb class=\"key\">유사성\u003c/b>으로 평가하는 대신, 각 생명체가 종 고유의 방식대로 \u003cb class=\"key\">번영\u003c/b>할 기회를 가져야 한다고 주장합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"자, 오늘은 동물의 고유한 삶을 존중하자는 능력 접근법에 대해 알아보았습니다. 동물을 인간의 시선으로만 재단하지 말아야 한다는 교훈이 담긴 아주 멋진 글이었죠? 오늘 배운 핵심 표현들 다시 한번 복습해 보시고요, 우리는 다음 시간에 더 흥미로운 지문으로 만나요! 수고하셨습니다.","hl":null}]}]});</script></body></html>
