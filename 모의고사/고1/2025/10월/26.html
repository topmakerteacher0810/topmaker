@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson06","title":"2025년 10월 고1 모의고사 26번","audioDir":"26_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">26번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고1 모의고사\u003c/div>\u003ch1>Dalip Singh Saund: The Trailblazing Asian American Politician\u003c/h1>\u003ch2>Dalip Singh Saund: 아시아계 미국인 정치인의 개척자\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인도 출신 이민자 Dalip Singh Saund가 국적으로 인한 차별을 극복하고 \u003cb class=\"key\">시민권\u003c/b>을 쟁취하여 \u003cb class=\"key\">최초의 \u003c/b>\u003cb class=\"key\">아시아인\u003c/b> 미국 의원이 된 일대기를 다루고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Dalip Singh Saund overcame systemic discrimination through political activism to become the first Asian elected to the U.S. Congress.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 인도에서 태어나 미국 정치사의 큰 획을 그은 인물, Dalip Singh Saund의 이야기를 함께 살펴볼 거예요. 이 지문은 한 이민자가 겪은 차별과 이를 극복하고 얻어낸 위대한 성취를 다루고 있습니다. 요약하자면, 국적 때문에 고통받던 그가 시민권 획득을 위한 법안을 통과시키고 결국 미국 의회의 의원이 되었다는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 글은 미국 이민 역사에서 한 획을 그은 인물인 Dalip Singh Saund의 삶을 조명합니다. 20세기 초 미국에는 특정 아시아 국가 출신에 대해 \u003cb class=\"key\">시민권(Citizenship)\u003c/b> 취득을 제한하는 법적 장벽이 존재했습니다. 이는 마치 뛰어난 실력을 갖춘 선수가 특정 리그에 입단할 자격조차 박탈당한 \u003cb class=\"key\">불공정한 \u003c/b>\u003cb class=\"key\">경기장\u003c/b>과 같은 상황이었습니다. Dalip은 박사 학위가 있었음에도 국적 때문에 취업과 토지 구매에서 차별을 겪었습니다. 그는 이러한 \u003cb class=\"key\">제도적 \u003c/b>\u003cb class=\"key\">장벽(Systemic \u003c/b>\u003cb class=\"key\">Barrier)\u003c/b>을 무너뜨리기 위해 직접 정치 운동에 뛰어들었고, 1946년 \u003cb class=\"key\">루스-셀러 \u003c/b>\u003cb class=\"key\">법(Luce-Celler \u003c/b>\u003cb class=\"key\">Act)\u003c/b> 통과를 이끌어내는 데 기여했습니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 앞서 배경지식을 좀 쌓아볼까요. 이 인물이 살았던 이십 세기 초반의 미국은 지금과는 많이 달랐어요. 당시에는 아시아인들이 미국 시민권을 따는 것이 법적으로 아주 어려웠답니다. 실력이 아무리 좋아도 국적이라는 보이지 않는 벽에 막혀 있었던 거죠. Dalip Singh Saund는 바로 이 불공정한 경기장을 바꾸기 위해 노력한 사람입니다. 그가 통과시키려 노력했던 법안은 훗날 루스 셀러 법이라고 불리며 수많은 이민자에게 길을 열어주었죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인물 소개와 이주\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>Dalip Singh Saund를 인도 출신 미국 정치인으로 소개하며 글을 시작합니다. 인도에서 대학을 졸업한 후 \u003cb class=\"key\">대학원\u003c/b> 진학을 위해 미국으로 \u003cb class=\"key\">이주\u003c/b>한 배경을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>차별과 한계\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>박사 학위를 받았음에도 \u003cb class=\"key\">국적\u003c/b> 때문에 직업을 구하지 못하는 현실을 보여줍니다. \u003cb class=\"key\">시민권\u003c/b>이 없어 땅조차 살 수 없었던 농사 시절의 구체적인 제약을 언급합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>정치적 행동\u003csmall>전환 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>현실적 한계를 극복하기 위해 \u003cb class=\"key\">정치\u003c/b>에 관심을 갖고 목소리를 내기 시작합니다. 인도인의 시민권 취득을 허용하는 \u003cb class=\"key\">법안\u003c/b>을 통과시키기 위해 적극적으로 활동합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>성취와 결론\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>법안 통과로 시민권을 획득하고, 결국 \u003cb class=\"key\">최초의 \u003c/b>\u003cb class=\"key\">아시아인\u003c/b> 미국 의원이 되는 역사적 \u003cb class=\"key\">성공\u003c/b>을 거둡니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"자, 그럼 이제 이 인물의 삶이 어떤 순서로 흘러갔는지 문장별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 Dalip의 배경을 설명해요. 인도 태생이지만 미국으로 건너와 University of Punjab 졸업 후 대학원에 진학한 열정적인 학생이었음을 보여줍니다.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장은 그가 마주한 현실적인 벽을 보여줘요. 박사 학위를 땄는데도 국적 때문에 직업을 못 구하고, 심지어 농사를 지으려 해도 시민권이 없어서 땅을 살 수 없었죠.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장에서 분위기가 반전됩니다. 그는 좌절하는 대신 정치에 관심을 가졌고, 인도인이 시민권을 얻을 수 있는 법안을 홍보하기 위해 워싱턴까지 달려갔어요.","hl":"f2"},{"n":7,"text":"일곱 번째와 여덟 번째 문장은 그 노력의 결실입니다. 법안이 통과되어 시민권을 얻었고, 결국 아시아인 최초로 미국 의회에 당선되는 역사적인 순간을 맞이하게 됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 전반부가 과거의 행적을 \u003cb class=\"key\">연대기적 \u003c/b>\u003cb class=\"key\">순서\u003c/b>로 나열하고 있습니다. 차별받던 시기부터 법안 통과를 거쳐 영광스러운 순간까지 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>을 따릅니다. 마지막 문장에서 그의 최종적인 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">업적\u003c/b>을 제시하며 글의 주제를 완성합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>After graduating (2)\u003c/b>\u003cspan>시간 순서 안내\u003c/span>\u003cb>The next year (4)\u003c/b>\u003cspan>사건의 전개\u003c/span>\u003cb>In 1946 (7)\u003c/b>\u003cspan>구체적 시점 명시\u003c/span>\u003cb>Later (8)\u003c/b>\u003cspan>최종 결과 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Dalip Singh Saund\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an Indian-born American politician\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Dalip\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the first Asian to be elected\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간의 흐름에 따라 사건을 보여주는 시간순 전개 방식입니다. 처음에는 어려운 시절을 보여주다가 마지막 여덟 번째 문장에서 그의 가장 큰 업적을 제시하며 마무리하는 미괄식 구조를 취하고 있어요.","hl":"ty"},{"n":9,"text":"신호어를 잘 보세요. 두 번째 문장의 After graduating이나 네 번째 문장의 The next year, 그리고 일곱 번째 문장의 연도 표시는 시간의 흐름을 잘 보여줍니다. 또한 처음에는 국적 때문에 안 된다는 말이 나오다가 마지막에 의회에 선출되었다는 표현으로 재진술되는 과정이 핵심이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Indian-born\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인도 태생의\u003c/span>\u003c/div>\u003cdiv>\u003cb>politician\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정치인\u003c/span>\u003c/div>\u003cdiv>\u003cb>graduate school\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대학원\u003c/span>\u003c/div>\u003cdiv>\u003cb>doctoral degree\u003c/b>\u003cem>명사\u003c/em>\u003cspan>박사 학위\u003c/span>\u003c/div>\u003cdiv>\u003cb>nationality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>국적\u003c/span>\u003c/div>\u003cdiv>\u003cb>farming\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농사\u003c/span>\u003c/div>\u003cdiv>\u003cb>Imperial Valley\u003c/b>\u003cem>명사\u003c/em>\u003cspan>임페리얼 밸리(지명)\u003c/span>\u003c/div>\u003cdiv>\u003cb>be able to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 수 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>citizenship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시민권\u003c/span>\u003c/div>\u003cdiv>\u003cb>interest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관심\u003c/span>\u003c/div>\u003cdiv>\u003cb>politics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정치(학)\u003c/span>\u003c/div>\u003cdiv>\u003cb>speak out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>공개적으로 발언하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>political\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정치적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>topic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주제\u003c/span>\u003c/div>\u003cdiv>\u003cb>promote\u003c/b>\u003cem>동사\u003c/em>\u003cspan>홍보하다, 장려하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>법안\u003c/span>\u003c/div>\u003cdiv>\u003cb>allow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>허용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pass\u003c/b>\u003cem>동사\u003c/em>\u003cspan>통과시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>receive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Asian\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아시아인\u003c/span>\u003c/div>\u003cdiv>\u003cb>elect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Congress\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의회\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어를 짚어볼게요. nationality는 국적이라는 뜻이고, citizenship은 시민권입니다. 이 두 단어가 글 전체의 갈등 요인이자 해결책이죠. 그리고 promote는 여기에서 법안을 널리 알리고 홍보한다는 의미로 쓰였습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">promote\u003c/b>\u003cspan class=\"m\">홍보하다, 장려하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">advocate\u003c/span>\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"s\">encourage\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">oppose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">allow\u003c/b>\u003cspan class=\"m\">허용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">permit\u003c/span>\u003cspan class=\"s\">enable\u003c/span>\u003cspan class=\"s\">let\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forbid\u003c/span>\u003cspan class=\"a\">prohibit\u003c/span>\u003cspan class=\"a\">ban\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">receive\u003c/b>\u003cspan class=\"m\">받다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">get\u003c/span>\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">give\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">elect\u003c/b>\u003cspan class=\"m\">선출하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">choose\u003c/span>\u003cspan class=\"s\">select\u003c/span>\u003cspan class=\"s\">vote in\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dismiss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">interest\u003c/b>\u003cspan class=\"m\">관심\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">attention\u003c/span>\u003cspan class=\"s\">curiosity\u003c/span>\u003cspan class=\"s\">concern\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indifference\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 정리해 봐요. allow는 허용하다라는 뜻인데 permit이나 enable과 바꿔 쓸 수 있습니다. 반대로 금지하다라는 뜻인 forbid나 prohibit은 반의어가 되겠죠. receive는 받다라는 뜻으로 get이나 obtain과 비슷하게 이해하면 됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Dalip Singh Saund는 이었다 인도에서 태어난 미국인 정치인\u003c/span>\u003cspan class=\"en\">Dalip Singh Saund was an Indian­born American politician.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Dalip Singh Saund는 인도에서 태어난 미국인 정치인이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전체 글의 주인공인 Dalip Singh Saund를 소개하는 문장입니다. 그의 \u003cb class=\"key\">출생 \u003c/b>\u003cb class=\"key\">배경\u003c/b>과 \u003cb class=\"key\">직업\u003c/b>을 명시하며 전기문의 시작을 알립니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">하이픈으로 연결된 복합 형용사\u003c/span> : 명사-과거분사 [형용사] : \"인도에서 태어난\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Dalip Singh Saund, Dalip Singh Saund는. was, 이었다. an Indian-born American politician, 인도에서 태어난 미국인 정치인. 이 문장 전체를 해석하면, Dalip Singh Saund는 인도에서 태어난 미국인 정치인이었다.","hl":"m"},{"n":13,"text":"이 문장은 위대한 인물의 생애를 소개하는 첫 문장이에요. 인도에서 태어났지만 미국에서 활동한 배경을 보여줍니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트인 Indian-born은 하이픈으로 연결된 복합 형용사예요. 뒤에 나오는 정치인을 수식하는 형용사 역할을 수행하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">졸업한 후에\u003c/span>\u003cspan class=\"en\">After \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">graduating \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도에서 University of Punjab을\u003c/span>\u003cspan class=\"en\">the University of Punjab in India,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 미국으로 이주했다\u003c/span>\u003cspan class=\"en\">he moved to the U.S.\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대학원에 다니기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">attend\u003c/span> graduate school.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인도에서 University of Punjab을 졸업한 후에, 그는 대학원에 다니기 위해 미국으로 이주했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Saund가 미국으로 가게 된 \u003cb class=\"key\">동기\u003c/b>를 설명합니다. \u003cb class=\"key\">학업\u003c/b>을 이어가기 위해 인도에서 미국으로 장소를 옮겼음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사의 목적어로 쓰인 동명사\u003c/span> : After [전치사] + graduating [동명사] : \"졸업한 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + attend [동사원형] : \"다니기 위해\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"After graduating from, 졸업한 후에. the University of Punjab in India, 인도에서 University of Punjab을. he moved to the U.S, 그는 미국으로 이주했다. to attend graduate school, 대학원에 다니기 위해. 이 문장 전체를 해석하면, 인도에서 University of Punjab을 졸업한 후에, 그는 대학원에 다니기 위해 미국으로 이주했다.","hl":"m"},{"n":16,"text":"주인공이 고향을 떠나 더 큰 세상으로 나아가는 계기를 설명합니다. 공부를 목적으로 한 미국행이었음을 알 수 있죠.","hl":"mn"},{"n":17,"text":"첫 번째로 After 뒤의 graduating은 전치사의 목적어인 동명사예요. graduate 뒤에는 반드시 전치사 from을 써야 한다는 점을 기억하세요. 두 번째로 to attend는 이주한 목적을 나타내는 to부정사의 부사적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 박사 학위를 받았지만\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">earned\u003c/span> his doctoral degree\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1924년에 University of California에서\u003c/span>\u003cspan class=\"en\">at the University of California in 1924\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직업을 구할 수 없었다\u003c/span>\u003cspan class=\"en\">but could not get a job\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 국적 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> his nationality.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 1924년에 University of California에서 박사 학위를 받았지만 자신의 국적 때문에 직업을 구할 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 학문적 \u003cb class=\"key\">성취\u003c/b>에도 불구하고 겪게 된 사회적 \u003cb class=\"key\">차별\u003c/b>을 대조적으로 보여줍니다. 국적이 직업을 구하는 데 걸림돌이 된 당시의 상황을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 과거형 (병렬 구조)\u003c/span> : earned [과거동사] ... but could not [조동사 과거형] : \"받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 전치사구\u003c/span> : because of + his nationality [명사구] : \"국적 때문에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He earned his doctoral degree, 그는 박사 학위를 받았지만. at the University of California in 1924, 1924년에 University of California에서. but could not get a job, 직업을 구할 수 없었다. because of his nationality, 자신의 국적 때문에. 이 문장 전체를 해석하면, 그는 1924년에 University of California에서 박사 학위를 받았지만 자신의 국적 때문에 직업을 구할 수 없었다.","hl":"m"},{"n":19,"text":"높은 학력이라는 성과와 국적에 따른 현실적 한계를 동시에 보여줍니다. 주인공이 겪게 될 역경의 시작을 알리는 부분이에요.","hl":"mn"},{"n":20,"text":"첫 번째로 earned는 과거의 업적을 나타내는 동사예요. 뒤에 나오는 could와 병렬 구조를 이루고 있죠. 두 번째로 because of 뒤에는 his nationality라는 명사구가 옵니다. 이럴 때는 because가 아니라 반드시 전치사인 because of를 써야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음 해에, \u003c/span>\u003cspan class=\"en\">The next year,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 농사를 시작했다 \u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">farming\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Imperial Valley에서, \u003c/span>\u003cspan class=\"en\">in Imperial Valley,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그는 할 수 없었다 \u003c/span>\u003cspan class=\"en\">but he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">땅을 구입하는 것을 \u003c/span>\u003cspan class=\"en\">buy land\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 시민권 없이는.\u003c/span>\u003cspan class=\"en\">without U.S. citizenship.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다음 해에, 그는 Imperial Valley에서 농사를 시작했지만 미국 시민권이 없어 땅을 구입할 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공부를 마친 후 농사를 시작했으나, 외국인으로서 겪은 \u003cb class=\"key\">현실적 \u003c/b>\u003cb class=\"key\">제약\u003c/b>인 \u003cb class=\"key\">시민권\u003c/b> 문제를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : begin + [farming (동명사/목적어)] : \"농사를 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사의 부정 (be able to)\u003c/span> : be [동사] + not [부정어] + able to [형용사구] : \"할 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The next year, 다음 해에. he began farming, 그는 농사를 시작했다. in Imperial Valley, Imperial Valley에서. but he was not able to, 하지만 그는 할 수 없었다. buy land, 땅을 구입하는 것을. without U.S. citizenship, 미국 시민권 없이는.. 이 문장 전체를 해석하면, 다음 해에, 그는 Imperial Valley에서 농사를 시작했지만 미국 시민권이 없어 땅을 구입할 수 없었다.","hl":"m"},{"n":22,"text":"달립 싱 사운드가 고등 교육을 받았음에도 불구하고, 시민권이라는 장벽 때문에 농사를 지어야 했고 땅조차 살 수 없었던 현실적 제약을 보여주는 문장이에요.","hl":"mn"},{"n":23,"text":"첫 번째로 began farming 부분을 보세요. begin이라는 동사는 뒤에 동명사와 to부정사를 모두 쓸 수 있어요. 두 번째로 was not able to는 조동사 can의 과거 부정인 could not과 똑같은 표현으로, 할 수 없었다는 능력을 나타내죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Dalip은 발전시켰다 \u003c/span>\u003cspan class=\"en\">Dalip \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">developed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정치학에 대한 관심을 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">interest \u003c/span>\u003cspan class=\"tgt\">in\u003c/span> politics\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그는 종종 발언했다 \u003c/span>\u003cspan class=\"en\">and he often \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">spoke \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도 및 정치 주제에 대해.\u003c/span>\u003cspan class=\"en\">on Indian and political topics.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Dalip은 정치학에 대한 관심을 발전시켰고 그는 종 종 인도 및 정치 주제에 대해 발언했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 차별적인 상황 속에서 \u003cb class=\"key\">정치적 \u003c/b>\u003cb class=\"key\">자각\u003c/b>을 하게 되고, 자신의 목소리를 내기 시작하는 \u003cb class=\"key\">전환점\u003c/b>을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 (관심을 갖다)\u003c/span> : develop + an interest [목적어] + in [전치사] : \"정치학에 대한 관심을 발전시켰다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 (발언하다)\u003c/span> : speak [동사] + out [부사] : \"발언했다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Dalip developed, Dalip은 발전시켰다. an interest in politics, 정치학에 대한 관심을. and he often spoke out, 그리고 그는 종종 발언했다. on Indian and political topics, 인도 및 정치 주제에 대해.. 이 문장 전체를 해석하면, Dalip은 정치학에 대한 관심을 발전시켰고 그는 종 종 인도 및 정치 주제에 대해 발언했다.","hl":"m"},{"n":25,"text":"부당한 현실을 겪으며 가만히 있지 않고, 정치에 관심을 두며 인도인들의 권익을 위해 목소리를 내기 시작했다는 중요한 변화를 보여주는 장면이에요.","hl":"mn"},{"n":26,"text":"첫 번째로 developed an interest in은 어디에 흥미를 느끼기 시작했다는 뜻의 덩어리 표현입니다. 두 번째로 spoke out은 자신의 생각이나 소신을 밖으로 당당하게 내뱉는 것을 강조하는 구동사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 Washington, D.C.에 갔다 \u003c/span>\u003cspan class=\"en\">He went to Washington, D.C.\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 법안을 홍보했다 \u003c/span>\u003cspan class=\"en\">and promoted a bill\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능하게 할 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">allow \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도인들이 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Indians \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 시민이 되는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">become\u003c/span> U.S. citizens.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 Washington, D.C.에 가서 인도인이 미국 시민이 될 수 있도록 하는 법안을 홍보했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문제를 해결하기 위해 직접 \u003cb class=\"key\">정치적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>에 나섰음을 나타내며, 인도인의 \u003cb class=\"key\">시민권 \u003c/b>\u003cb class=\"key\">획득\u003c/b>을 위한 구체적 노력을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a bill [선행사] + that [주격 관계대명사] + would allow [동사] : \"가능하게 할 (법안)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 동사 allow\u003c/span> : allow [동사] + Indians [목적어] + to become [목적격 보어(to부정사)] : \"인도인들이 되는 것을 허락하다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"He went to Washington, D.C, 그는 Washington, D.C.에 갔다. and promoted a bill, 그리고 법안을 홍보했다. that would allow, 가능하게 할. Indians, 인도인들이. to become U.S. citizens, 미국 시민이 되는 것을.. 이 문장 전체를 해석하면, 그는 Washington, D.C.에 가서 인도인이 미국 시민이 될 수 있도록 하는 법안을 홍보했다.","hl":"m"},{"n":28,"text":"달립이 직접 정치의 중심지로 가서, 인도인들도 자신처럼 시민권이 없어 고생하지 않도록 법률을 바꾸려 노력했다는 아주 적극적인 행동을 묘사하고 있어요.","hl":"mn"},{"n":29,"text":"첫 번째로 that would allow를 보세요. 관계대명사 that 뒤에 주어 없이 동사가 바로 오니까 주격 관계대명사라는 걸 알 수 있죠. 두 번째로 allow라는 동사는 목적어 뒤에 반드시 to become처럼 to부정사를 써서 목적어가 무엇을 하는지 설명해 줘야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 법안은 통과되었고 \u003c/span>\u003cspan class=\"en\">The bill \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">passed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1946년에, \u003c/span>\u003cspan class=\"en\">in 1946,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 3년 후에 \u003c/span>\u003cspan class=\"en\">and three years later\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Dalip은 받았다 \u003c/span>\u003cspan class=\"en\">Dalip received\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 시민권을.\u003c/span>\u003cspan class=\"en\">U.S. citizenship.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 법안은 1946년에 통과되었고, 3년 후에 Dalip은 미국 시민권을 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장에서 Dalip이 추진했던 법안이 실제로 \u003cb class=\"key\">성립\u003c/b>되었음을 보여줍니다. 이로써 그가 원했던 \u003cb class=\"key\">미국 \u003c/b>\u003cb class=\"key\">시민권\u003c/b>을 획득하며 정치적 기반을 다지게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + 과거분사)\u003c/span> : be [was] + pass [과거분사 (passed)] : \"통과되었다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The bill was passed, 그 법안은 통과되었고. in 1946, 1946년에. and three years later, 그리고 3년 후에. Dalip received, Dalip은 받았다. U.S. citizenship, 미국 시민권을.. 이 문장 전체를 해석하면, 그 법안은 1946년에 통과되었고, 3년 후에 Dalip은 미국 시민권을 받았다.","hl":"m"},{"n":31,"text":"드디어 Dalip이 간절히 바랐던 법안이 통과되면서 그가 미국 시민권을 얻게 되는 장면이에요. 이 사건은 그의 삶뿐만 아니라 미국 내 인도인들에게도 역사적인 성립을 의미합니다.","hl":"mn"},{"n":32,"text":"첫 번째로 was passed를 주목하세요. 법안은 스스로 통과하는 게 아니라 의회에 의해 통과되는 것이죠. 그래서 주어의 동작이 아닌 상태를 나타내는 수동태를 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 후에 되었다 \u003c/span>\u003cspan class=\"en\">He later became\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최초의 아시아인이 \u003c/span>\u003cspan class=\"en\">the first Asian\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당선된 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">elected\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 의회에.\u003c/span>\u003cspan class=\"en\">to the U.S. Congress.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 후에 미국 의회에 당선된 최초의 아시아인이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Dalip이 시민권을 얻은 후 도달한 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">업적\u003c/b>을 강조합니다. 아시아계 이민자로서 미국 \u003cb class=\"key\">입법부\u003c/b>에 진출한 상징적인 인물임을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the first [서수] + 명사 + [to부정사구] : \"당선된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 수동태\u003c/span> : to + be + elect [과거분사 (elected)] : \"당선된 (선출된)\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"He later became, 그는 후에 되었다. the first Asian, 최초의 아시아인이. to be elected, 당선된. to the U.S. Congress, 미국 의회에.. 이 문장 전체를 해석하면, 그는 후에 미국 의회에 당선된 최초의 아시아인이 되었다.","hl":"m"},{"n":34,"text":"시민권을 얻은 것에 그치지 않고, 미국 정치의 핵심인 의회에까지 진출했다는 놀라운 역사적 업적을 전하고 있어요. 당시 아시아인들에게 얼마나 큰 희망이었을지 짐작해 볼 수 있습니다.","hl":"mn"},{"n":35,"text":"첫 번째로 to be elected는 앞에 있는 명사를 꾸며주는 형용사적 역할로 쓰였어요. 두 번째로 to부정사 안에 수동태가 들어있죠. 그가 투표를 한 게 아니라 투표를 통해 선출된 것이기 때문에 수동형 부정사를 써야 합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Dalip Singh Saund는 인도에서 대학 졸업 후 미국으로 건너가 \u003cb class=\"key\">박사 \u003c/b>\u003cb class=\"key\">학위\u003c/b>를 취득했습니다.\u003c/li>\u003cli>뛰어난 학력에도 불구하고 \u003cb class=\"key\">국적과 \u003c/b>\u003cb class=\"key\">시민권\u003c/b>이 없어 취업과 토지 구매에서 심한 차별을 겪었습니다.\u003c/li>\u003cli>차별을 극복하고자 정치에 투신하여 인도인이 \u003cb class=\"key\">미국 \u003c/b>\u003cb class=\"key\">시민\u003c/b>이 될 수 있게 하는 법안을 홍보했습니다.\u003c/li>\u003cli>법안 통과로 시민권을 얻은 후, 미국 의회에 당선된 \u003cb class=\"key\">최초의 \u003c/b>\u003cb class=\"key\">아시아인\u003c/b>이라는 기록을 세웠습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Dalip Singh Saund overcame systemic discrimination through political activism to become the first Asian elected to the U.S. Congress.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">인도 출신 이민자 Dalip Singh Saund가 국적으로 인한 차별을 극복하고 \u003cb class=\"key\">시민권\u003c/b>을 쟁취하여 \u003cb class=\"key\">최초의 \u003c/b>\u003cb class=\"key\">아시아인\u003c/b> 미국 의원이 된 일대기를 다루고 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Dalip Singh Saund의 삶은 우리에게 제도적 장벽을 개인의 노력과 정치적 행동으로 극복할 수 있다는 큰 교훈을 줍니다. 오늘 배운 어휘들과 시간 순서에 따른 글의 구성을 잘 복습해 보세요. 수고 많았습니다, 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
