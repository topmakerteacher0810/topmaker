ly\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">인류가 특정 동물을 가축으로 만드는 가축화(Domestication) 과정에는 생물학자 재레드 다이아몬드가 제시한 &#39;안나 카레니나 법칙&#39;이 적용되는데, 이는 가축이 되기 위해 성격, 식성, 번식 등 여러 까다로운 조건이 모두 충족되어야 함을 의미합니다. 지문 속 가젤처럼 위협을 느끼면 즉시 도망치려는 도주 반응(Flight response)이 지나치게 예민한 종은 좁은 울타리에 갇히면 극심한 공포를 느껴 스스로 벽에 부딪혀 죽기도 하는 등 사육에 부적합한 특성을 지닙니다. 반면 소나 양처럼 무리 내에 위계질서가 뚜렷한 군집성(Gregariousness)을 가졌으면서도 침착한 성격의 동물들은 인간을 우두머리로 받아들이기 쉬워 성공적으로 길들여질 수 있었습니다. 마치 우리가 성격이 지나치게 예민한 사람보다는 원만한 기질을 가진 사람과 공동체 생활을 하기 수월한 것과 같은 이치라고 이해하시면 좋습니다. 이러한 동물의 기질(Temperament) 차이는 고대 문명의 발상지인 비옥한 초승달 지대(Fertile Crescent)에서 어떤 동물이 인류의 동반자가 될지를 결정짓는 결정적인 열쇠가 되었습니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01초식 동물의 두 가지 위협 반응<\/div><ul><li>대형 초식 동물들은 포식자나 인간의 위협에 직면했을 때 서로 다른 방식으로 반응한다.<\/li><li>예민하고 즉각적인 도망(instant flight)을 선택하는 유형<\/li><li>무리(herds) 안에서 보호를 구하며 버티다 필요할 때만 움직이는 유형<\/li><li>핵심 키워드: 초식 동물(herbivore), 반응(react)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02예민한 종의 사육상 어려움<\/div><ul><li>위협에 예민하게 반응하는 종들은 가두어 기르기에 적합하지 않은 특성을 가진다.<\/li><li>우리(enclosure)에 갇히면 쉽게 공황(panic) 상태에 빠짐<\/li><li>탈출 시도로 울타리에 부딪혀 죽거나 쇼크사함<\/li><li>핵심 키워드: 가둠(captivity), 탈출(escape)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가젤의 가축화 실패 사례<\/div><ul><li>가젤은 인간과 접점이 매우 많았음에도 불구하고 결코 가축이 되지 못했다.<\/li><li>비옥한 초승달 지대에서 가장 흔한 사냥감(game species)이었음<\/li><li>인간이 가축화(domesticate)할 기회가 가장 많았던 포유류<\/li><li>핵심 키워드: 가젤(gazelles), 정착 민족(settled peoples)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04통제 불가능한 가젤의 신체적 특성<\/div><ul><li>가젤의 뛰어난 신체 능력과 본능적인 행동은 인간의 통제를 벗어난다.<\/li><li>눈먼 채 벽에 부딪히는 본능과 시속 50마일의 속도(speed)<\/li><li>30피트에 달하는 도약력(leap)으로 인해 통제가 불가능함<\/li><li>핵심 키워드: 가축화 불가(never domesticated)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">herbivore<\/td><td class=\"m\">초식 동물<\/td><\/tr><tr><td class=\"w\">species<\/td><td class=\"m\">종(種)<\/td><\/tr><tr><td class=\"w\">react<\/td><td class=\"m\">반응하다<\/td><\/tr><tr><td class=\"w\">predator<\/td><td class=\"m\">포식자, 천적<\/td><\/tr><tr><td class=\"w\">nervous<\/td><td class=\"m\">긴장한, 불안한<\/td><\/tr><tr><td class=\"w\">fast<\/td><td class=\"m\">빠른, 빠르게<\/td><\/tr><tr><td class=\"w\">instant<\/td><td class=\"m\">순간<\/td><\/tr><tr><td class=\"w\">flight<\/td><td class=\"m\">항공편, 비행<\/td><\/tr><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 지각하다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">threat<\/td><td class=\"m\">위협<\/td><\/tr><tr><td class=\"w\">seek<\/td><td class=\"m\">찾다, 구하다<\/td><\/tr><tr><td class=\"w\">protection<\/td><td class=\"m\">보호<\/td><\/tr><tr><td class=\"w\">herd<\/td><td class=\"m\">(짐승의) 무리, 떼<\/td><\/tr><tr><td class=\"w\">ground<\/td><td class=\"m\">땅, 바닥<\/td><\/tr><tr><td class=\"w\">threaten<\/td><td class=\"m\">위협하다, 위태롭게 하다<\/td><\/tr><tr><td class=\"w\">naturally<\/td><td class=\"m\">자연스럽게, 당연히<\/td><\/tr><tr><td class=\"w\">captivity<\/td><td class=\"m\">감금, 속박, 사로잡힌 상태<\/td><\/tr><tr><td class=\"w\">panic<\/td><td class=\"m\">공포, 공황<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Big mammalian herbivore species<\/span><\/b><\/span><span class=\"ko\">대형 포유류 초식동물 종들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">react<\/span> to danger from predators or humans<\/b><\/span><span class=\"ko\">포식자나 인간으로부터의 위험에 반응한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in different ways.<\/b><\/span><span class=\"ko\">다른 방식으로<\/span><\/div><\/div><div class=\"lec-sent-ko\">큰 포유류의 초식동물 종은 포식자나 인간으로부터의 위험에 대해 다른 방식으로 반응한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로, 초식 동물의 생존 전략이 종마다 다양하다는 주제를 제시합니다. 모든 동물이 위험 앞에서 똑같이 행동하지 않는다는 점이 가축화 가능성을 결정짓는 핵심 요인이 됩니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Big mammalian herbivore species react 주어와 동사: Big mammalian herbivore species가 주어이며, react가 본동사로 쓰인 1형식 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">herbivore<\/td><td class=\"m\">초식 동물<\/td><\/tr><tr><td class=\"w\">species<\/td><td class=\"m\">종(種)<\/td><\/tr><tr><td class=\"w\">react<\/td><td class=\"m\">반응하다<\/td><\/tr><tr><td class=\"w\">predator<\/td><td class=\"m\">포식자, 천적<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Some species<\/b><\/span><span class=\"ko\">어떤 종들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are nervous, fast, and programmed for instant flight<\/b><\/span><span class=\"ko\">긴장하고, 빠르고, 즉각적인 도주를 하도록 프로그램화되어 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when they perceive a threat.<\/b><\/span><span class=\"ko\">그들이 위협을 감지할 때<\/span><\/div><\/div><div class=\"lec-sent-ko\">어떤 종들은 그들이 위협을 감지할 때 긴장하고, 빠르고, 즉각적인 비행을 하도록 프로그램화되어 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 첫 번째 유형의 동물을 설명하며 앞 문장을 구체화합니다. &#39;programmed for instant flight&#39;는 이들의 도망 본능이 학습된 것이 아니라 유전적으로 깊이 각인되어 있어 통제가 불가능하다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are ... programmed (수동태): be동사(are)+p.p.(programmed) 구조. program은 타동사인데 뒤에 목적어가 없어서 수동구조 are programmed 형태로 쓴다. 기본구조: V + O + for B (A를 B하도록 설정/프로그램하다)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">species<\/td><td class=\"m\">종(種)<\/td><\/tr><tr><td class=\"w\">nervous<\/td><td class=\"m\">긴장한, 불안한<\/td><\/tr><tr><td class=\"w\">fast<\/td><td class=\"m\">빠른, 빠르게<\/td><\/tr><tr><td class=\"w\">instant<\/td><td class=\"m\">순간<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flight<\/td><td class=\"m\">항공편, 비행<\/td><\/tr><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 지각하다<\/td><\/tr><tr><td class=\"w\">threat<\/td><td class=\"m\">위협<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Other species<\/b><\/span><span class=\"ko\">다른 종들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are slower, less nervous, seek protection in herds, stand their ground<\/b><\/span><span class=\"ko\">더 느리고, 덜 긴장하고, 무리 속에서 보호를 찾고, 자리를 지킨다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">when threatened<\/span>,<\/b><\/span><span class=\"ko\">위협을 받았을 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and don't run<\/b><\/span><span class=\"ko\">그리고 도망가지 않는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>until necessary.<\/b><\/span><span class=\"ko\">필요할 때까지<\/span><\/div><\/div><div class=\"lec-sent-ko\">다른 종들은 더 느리고, 덜 긴장하고, 무리 속에서 보호를 찾고, 위협을 받았을 때 그들의 자리를 지키고 필요할 때까지 도망가지 않는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 두 번째 유형의 동물을 제시하며 앞 문장과 대조를 이룹니다. &#39;stand their ground&#39;는 포식자가 나타나도 무작정 공포에 질려 뛰기보다 대오를 갖추고 버티는 성향을 말하며, 이런 성격이 인간이 다루기에 더 수월하다는 복선을 깔고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">when threatened (분사구문): 접속사(when) 뒤에 주어와 be동사(they are)가 생략되고 과거분사(threatened)만 남은 수동 형태의 분사구문이다. 원래 절로 변환하면 when they are threatened와 같다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">species<\/td><td class=\"m\">종(種)<\/td><\/tr><tr><td class=\"w\">nervous<\/td><td class=\"m\">긴장한, 불안한<\/td><\/tr><tr><td class=\"w\">threat<\/td><td class=\"m\">위협<\/td><\/tr><tr><td class=\"w\">seek<\/td><td class=\"m\">찾다, 구하다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">protection<\/td><td class=\"m\">보호<\/td><\/tr><tr><td class=\"w\">herd<\/td><td class=\"m\">(짐승의) 무리, 떼<\/td><\/tr><tr><td class=\"w\">ground<\/td><td class=\"m\">땅, 바닥<\/td><\/tr><tr><td class=\"w\">threaten<\/td><td class=\"m\">위협하다, 위태롭게 하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Naturally,<\/b><\/span><span class=\"ko\">자연스럽게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the nervous species<\/b><\/span><span class=\"ko\">긴장하는 종들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are <span class=\"grammar-hl\">difficult to keep<\/span><\/b><\/span><span class=\"ko\">유지하기 어렵다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in captivity.<\/b><\/span><span class=\"ko\">가두어 기르는 상태에서<\/span><\/div><\/div><div class=\"lec-sent-ko\">자연스럽게, 긴장하는 동물 종들은 갇힌 상태를 유지하기 어렵다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 언급된 &#39;도주형&#39; 동물의 특징이 인간의 통제(가축화)와 충돌한다는 논리적 결론을 내립니다. &#39;keep in captivity&#39;는 울타리 안의 제한된 공간에서 인간의 관리를 받으며 사는 상태를 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">difficult to keep (to부정사(부사적): 형용사 수식): 바로 앞의 형용사(difficult)를 수식하는 구조이므로 부사적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">species<\/td><td class=\"m\">종(種)<\/td><\/tr><tr><td class=\"w\">nervous<\/td><td class=\"m\">긴장한, 불안한<\/td><\/tr><tr><td class=\"w\">naturally<\/td><td class=\"m\">자연스럽게, 당연히<\/td><\/tr><tr><td class=\"w\">captivity<\/td><td class=\"m\">감금, 속박, 사로잡힌 상태<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">If put<\/span> into an enclosure,<\/b><\/span><span class=\"ko\">만약 우리 안에 넣어지면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they are <span class=\"grammar-hl\">likely to panic<\/span>,<\/b><\/span><span class=\"ko\">그들은 패닉에 빠지기 쉽다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and either die of shock<\/b><\/span><span class=\"ko\">그래서 충격으로 죽거나<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or hit themselves repeatedly to death<\/b><\/span><span class=\"ko\">혹은 반복적으로 자신을 부딪쳐 죽음에 이르게 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>against the fence<\/b><\/span><span class=\"ko\">울타리에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in their <span class=\"grammar-hl\">attempts to escape<\/span>.<\/b><\/span><span class=\"ko\">탈출하려는 시도 중에<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 우리 안에 넣어지면, 그들은 패닉에 빠지게 될 가능성이 있고 충격으로 죽거나 탈출하려는 시도로 그들 자신을 반복적으로 울타리에 부딪혀 죽을 가능성이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 예민한 종을 가두었을 때 발생하는 극단적인 부작용을 묘사하여 앞 문장을 뒷받침합니다. &#39;hit themselves repeatedly to death&#39;는 동물이 좁은 공간을 견디지 못하고 스스로를 해칠 정도로 강한 야생성을 지니고 있음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">If put (분사구문): 접속사(If) 뒤에 주어와 be동사(they are)가 생략되고 과거분사(put)만 남은 수동 형태의 분사구문이다. 원래 절로 변환하면 if they are put ... 과 같다.<\/div><div class=\"lec-gr-item\">likely to panic (to부정사(부사적): 형용사 수식): 바로 앞의 형용사(likely)를 수식하는 구조이므로 부사적 용법이다.<\/div><div class=\"lec-gr-item\">attempts to escape (to부정사(형용사적)): 앞의 명사(attempts)를 수식하며 &#39;~하려는 시도&#39;라는 의미를 나타낸다. &#39;it to escape&#39;는 성립하지 않으므로 형용사적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">panic<\/td><td class=\"m\">공포, 공황<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>That's true,<\/b><\/span><span class=\"ko\">그것은 사실이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for example,<\/b><\/span><span class=\"ko\">예를 들어<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of gazelles,<\/b><\/span><span class=\"ko\">가젤에게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> for thousands of years<\/b><\/span><span class=\"ko\">수천 년 동안<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>were the most frequently <span class=\"grammar-hl\">hunted game species<\/span><\/b><\/span><span class=\"ko\">가장 빈번하게 사냥된 사냥감 종이었던<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in some parts of the Fertile Crescent.<\/b><\/span><span class=\"ko\">비옥한 초승달 지대의 일부 지역에서<\/span><\/div><\/div><div class=\"lec-sent-ko\">예를 들어, 이것은 가젤에 해당하는데 이들은 수천 년 동안 비옥한 초승달 지대의 일부 지역에서 가장 빈번하게 사냥된 사냥감 종이었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> &#39;도주형&#39; 동물의 대표 사례로 가젤을 도입합니다. &#39;Fertile Crescent&#39;는 인류 문명과 농경이 시작된 중동 지역을 가리키며, 이곳 사람들이 가젤을 매우 친숙하게 접했음을 알려줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">which (관계대명사): 선행사 gazelles를 부연 설명하는 계속적 용법의 주격 관계대명사다.<\/div><div class=\"lec-gr-item\">hunted game species (과거분사(형용사)): hunted가 game species를 수식(= &quot;사냥된 사냥감 종&quot;)하는 구조다. p.p. + N 구조로 &#39;N that was p.p.&#39;의 의미를 갖는다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">species<\/td><td class=\"m\">종(種)<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>There is no mammal species<\/b><\/span><span class=\"ko\">포유류 종은 없다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that the first settled peoples of that area<\/span><\/b><\/span><span class=\"ko\">그 지역의 첫 정착민들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">had more opportunity to domesticate<\/span><\/b><\/span><span class=\"ko\">길들일 기회가 더 많았던<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than gazelles.<\/b><\/span><span class=\"ko\">가젤보다<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 지역에 처음으로 정착한 인간들이 가젤보다 길들일 기회가 더 많았던 포유류는 없다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 가젤이 인간 주변에 흔했기 때문에 가축이 될 조건 중 하나인 &#39;접근성&#39;은 완벽했음을 강조합니다. &#39;no mammal species ~ more opportunity&#39;는 가젤이 가축화 후보 1순위였다는 사실을 힘주어 말하는 표현입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">settled peoples (과거분사(형용사)): settled가 peoples를 수식(= &quot;정착한 민족들&quot;)하는 구조다.<\/div><div class=\"lec-gr-item\">that the first settled peoples of that area had more opportunity to domesticate (관계대명사): 선행사 mammal species를 수식하며, domesticate의 목적어 역할을 하는 목적격 관계대명사다.<\/div><div class=\"lec-gr-item\">opportunity to domesticate (to부정사(형용사적)): 앞의 명사(opportunity)를 수식하며 &#39;~할 기회&#39;라는 의미를 나타낸다. &#39;it to domesticate&#39;는 성립하지 않으므로 형용사적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">species<\/td><td class=\"m\">종(種)<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But<\/b><\/span><span class=\"ko\">하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>no gazelle species<\/b><\/span><span class=\"ko\">어떤 가젤 종도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">has ever been domesticated<\/span>.<\/b><\/span><span class=\"ko\">지금까지 길들여진 적이 없다<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러나 어떤 가젤 종도 지금까지 길들여진 적이 없다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 기대감을 뒤집는 반전이자 글의 핵심 결론입니다. 아무리 인간과 가까이 살고 유용해도, 동물의 타고난 기질이 맞지 않으면 인간의 가축이 될 수 없다는 한계를 분명히 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">has ever been domesticated (수동태): be동사(been)+p.p.(domesticated) 구조. domesticate는 타동사인데 뒤에 목적어가 없어서 수동구조 has ever been domesticated 형태로 쓴다. 기본구조: V + O (A를 길들이다/가축화하다)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">species<\/td><td class=\"m\">종(種)<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Just imagine<\/b><\/span><span class=\"ko\">그저 상상해 보라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">trying<\/span> <span class=\"grammar-hl\">to herd<\/span> an animal<\/b><\/span><span class=\"ko\">동물을 무리 짓게 하려는 노력을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that runs away,<\/span><\/b><\/span><span class=\"ko\">도망가고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">blindly hits itself against walls,<\/span><\/b><\/span><span class=\"ko\">맹목적으로 벽에 자신을 부딪치고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">can leap up to nearly 30 feet,<\/span><\/b><\/span><span class=\"ko\">거의 30피트까지 뛰어오를 수 있는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and can run<\/span><\/b><\/span><span class=\"ko\">그리고 달릴 수 있는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">at a speed of 50 miles per hour<\/span>!<\/b><\/span><span class=\"ko\">시속 50마일의 속도로<\/span><\/div><\/div><div class=\"lec-sent-ko\">도망가고, 자신을 맹목적으로 벽에 부딪히고, 거의 30피트까지 뛰어오를 수 있고, 시속 50마일 속도로 달릴 수 있는 동물을 무리 지으려고 노력하는 것을 상상해봐라!<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 마지막으로 가젤의 구체적인 신체 능력과 반응을 나열하며 가축화가 불가능했던 이유를 시각적으로 보여줍니다. &#39;Just imagine&#39;은 독자에게 가젤을 관리하는 것이 얼마나 불가능에 가까운 일인지 직접 체감해보라는 권유입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">trying (동명사): imagine의 목적어 역할을 하는 명사적 성격의 -ing 형태다.<\/div><div class=\"lec-gr-item\">to herd (to부정사(명사적)): 동사 try(trying)의 목적어 자리에 쓰였으므로 명사적 용법이다.<\/div><div class=\"lec-gr-item\">that runs away, blindly hits itself against walls, can leap up to nearly 30 feet, and can run at a speed of 50 miles per hour (관계대명사): 선행사 an animal을 수식하는 주격 관계대명사절이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">herd<\/td><td class=\"m\">(짐승의) 무리, 떼<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>초식 동물은 위험에 대해 예민하게 도망치거나, 차분하게 무리를 지어 버티는 두 가지 반응 유형을 가진다.<\/li><li>예민한 종은 우리에 가두면 공포에 질려 자해하거나 쇼크사하기 때문에 가축화하기 매우 어렵다.<\/li><li>가젤은 인류 문명의 발상지에서 가장 흔하게 접할 수 있는 사냥감이었지만, 결코 가축이 되지 못했다.<\/li><li>가젤의 극도로 예민한 성격과 강력한 도주 본능이 인간의 통제를 불가능하게 만들었기 때문이다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">While some herbivore species are suitable for captivity, nervous species remain undomesticated because their extreme flight instincts lead to fatal injuries within enclosures.<\/div>\n              <div class=\"lec-final-sum-ko\">일부 초식 동물 종은 가축화에 적합하지만, 예민한 종들은 그들의 극단적인 도주 본능이 우리 안에서 치명적인 부상으로 이어지기 때문에 가축화되지 않은 채로 남아 있다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./29_audio/1.mp3","hl":null}],[{"audio":"./29_audio/2.mp3","hl":null}],[{"audio":"./29_audio/3.mp3","hl":null},{"audio":"./29_audio/4.mp3","hl":"stage-0"},{"audio":"./29_audio/5.mp3","hl":"stage-1"},{"audio":"./29_audio/6.mp3","hl":"stage-2"},{"audio":"./29_audio/7.mp3","hl":"stage-3"}],[{"audio":"./29_audio/8.mp3","hl":null}],[{"audio":"./29_audio/9.mp3","hl":"main"},{"audio":"./29_audio/10.mp3","hl":"meaning"},{"audio":"./29_audio/11.mp3","hl":"grammar"}],[{"audio":"./29_audio/12.mp3","hl":"main"},{"audio":"./29_audio/13.mp3","hl":"meaning"},{"audio":"./29_audio/14.mp3","hl":"grammar"}],[{"audio":"./29_audio/15.mp3","hl":"main"},{"audio":"./29_audio/16.mp3","hl":"meaning"},{"audio":"./29_audio/17.mp3","hl":"grammar"}],[{"audio":"./29_audio/18.mp3","hl":"main"},{"audio":"./29_audio/19.mp3","hl":"meaning"},{"audio":"./29_audio/20.mp3","hl":"grammar"}],[{"audio":"./29_audio/21.mp3","hl":"main"},{"audio":"./29_audio/22.mp3","hl":"meaning"},{"audio":"./29_audio/23.mp3","hl":"grammar"}],[{"audio":"./29_audio/24.mp3","hl":"main"},{"audio":"./29_audio/25.mp3","hl":"meaning"},{"audio":"./29_audio/26.mp3","hl":"grammar"}],[{"audio":"./29_audio/27.mp3","hl":"main"},{"audio":"./29_audio/28.mp3","hl":"meaning"},{"audio":"./29_audio/29.mp3","hl":"grammar"}],[{"audio":"./29_audio/30.mp3","hl":"main"},{"audio":"./29_audio/31.mp3","hl":"meaning"},{"audio":"./29_audio/32.mp3","hl":"grammar"}],[{"audio":"./29_audio/33.mp3","hl":"main"},{"audio":"./29_audio/34.mp3","hl":"meaning"},{"audio":"./29_audio/35.mp3","hl":"grammar"}],[{"audio":"./29_audio/36.mp3","hl":null}]],"fileName":"EBS올림포스(연합기출)고1 2026년 11강 01번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"EBS올림포스(연합기출)고1 2026년 11강 01번","titleEn":"The Survival Instinct: Why Nervous Herbivores Resist Domestication","titleKo":"생존 본능: 왜 예민한 초식 동물은 가축화에 저항하는가","imageUrl":"__enpImg__","stages":[{"label":"01초식 동물의 두 가지 위협 반응","items":["대형 초식 동물들은 포식자나 인간의 위협에 직면했을 때 서로 다른 방식으로 반응한다.","예민하고 즉각적인 도망(instant flight)을 선택하는 유형","무리(herds) 안에서 보호를 구하며 버티다 필요할 때만 움직이는 유형","핵심 키워드: 초식 동물(herbivore), 반응(react)"]},{"label":"02예민한 종의 사육상 어려움","items":["위협에 예민하게 반응하는 종들은 가두어 기르기에 적합하지 않은 특성을 가진다.","우리(enclosure)에 갇히면 쉽게 공황(panic) 상태에 빠짐","탈출 시도로 울타리에 부딪혀 죽거나 쇼크사함","핵심 키워드: 가둠(captivity), 탈출(escape)"]},{"label":"03가젤의 가축화 실패 사례","items":["가젤은 인간과 접점이 매우 많았음에도 불구하고 결코 가축이 되지 못했다.","비옥한 초승달 지대에서 가장 흔한 사냥감(game species)이었음","인간이 가축화(domesticate)할 기회가 가장 많았던 포유류","핵심 키워드: 가젤(gazelles), 정착 민족(settled peoples)"]},{"label":"04통제 불가능한 가젤의 신체적 특성","items":["가젤의 뛰어난 신체 능력과 본능적인 행동은 인간의 통제를 벗어난다.","눈먼 채 벽에 부딪히는 본능과 시속 50마일의 속도(speed)","30피트에 달하는 도약력(leap)으로 인해 통제가 불가능함","핵심 키워드: 가축화 불가(never domesticated)"]}],"bkg":"인류가 특정 동물을 가축으로 만드는 가축화(Domestication) 과정에는 생물학자 재레드 다이아몬드가 제시한 '안나 카레니나 법칙'이 적용되는데, 이는 가축이 되기 위해 성격, 식성, 번식 등 여러 까다로운 조건이 모두 충족되어야 함을 의미합니다. 지문 속 가젤처럼 위협을 느끼면 즉시 도망치려는 도주 반응(Flight response)이 지나치게 예민한 종은 좁은 울타리에 갇히면 극심한 공포를 느껴 스스로 벽에 부딪혀 죽기도 하는 등 사육에 부적합한 특성을 지닙니다. 반면 소나 양처럼 무리 내에 위계질서가 뚜렷한 군집성(Gregariousness)을 가졌으면서도 침착한 성격의 동물들은 인간을 우두머리로 받아들이기 쉬워 성공적으로 길들여질 수 있었습니다. 마치 우리가 성격이 지나치게 예민한 사람보다는 원만한 기질을 가진 사람과 공동체 생활을 하기 수월한 것과 같은 이치라고 이해하시면 좋습니다. 이러한 동물의 기질(Temperament) 차이는 고대 문명의 발상지인 비옥한 초승달 지대(Fertile Crescent)에서 어떤 동물이 인류의 동반자가 될지를 결정짓는 결정적인 열쇠가 되었습니다.","ttsText":"인류가 특정 동물을 가축으로 만드는 가축화(Domestication) 과정에는 생물학
