tor) 앞에서 자신의 기량을 뽐내는 오디션(Audition) 과정을 반드시 거쳐야 하는데요. 이 글의 배경인 오즈의 마법사(The Wizard of Oz)는 주인공 도로시가 신비한 나라를 여행하는 고전 명작으로, 주인공 외에도 이야기의 활력을 불어넣는 다양한 조연(Supporting Role)들이 등장합니다. 특히 주인공이 처음 만나는 작은 사람들의 종족인 먼치킨(Munchkin)은 극의 시작을 알리는 활기찬 군중 역할을 담당하며, 대규모 인원이 참여하는 앙상블(Ensemble)의 핵심이기도 합니다. 마치 운동선수가 후보 명단에라도 이름을 올리는 것만큼이나, 어떤 역할이든 배역을 얻는다는 것은 공연 제작이라는 거대한 톱니바퀴의 일원이 된다는 소속감(Sense of Belonging)과 성취감을 주는 아주 특별한 경험입니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01초조한 기다림<\/div><ul><li>뮤지컬 &#39;오즈의 마법사&#39; 오디션 결과를 앞두고 극도로 긴장한 상태를 묘사한다.<\/li><li>시계를 확인하며 캐스팅 디렉터(casting director)의 전화를 기다림<\/li><li>손톱을 깨물거나 발을 흔드는 등 신체적인 불안 증상을 보임<\/li><li>핵심 키워드: 긴장한(shaky), 기다림(waiting)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02전화 통화와 전달<\/div><ul><li>마침내 전화가 걸려오고 아버지가 대신 결과를 듣는다.<\/li><li>전화벨(telephone)이 울리고 아버지가 수신함<\/li><li>계단 아래에서 전화를 끊는 아버지의 모습을 지켜봄<\/li><li>핵심 키워드: 통화(call), 소식(news)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03결과 발표와 환희<\/div><ul><li>오디션 합격 소식을 듣고 작품에 참여하게 된 기쁨을 만끽한다.<\/li><li>&#39;두 번째 선임 먼치킨(second senior munchkin)&#39; 배역을 맡게 됨<\/li><li>제작에 참여하게 되었다는 사실에 짜릿함(rush of excitement)을 느낌<\/li><li>핵심 키워드: 합격(in), 흥분(excitement)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">glance<\/td><td class=\"m\">흘낏 보다<\/td><\/tr><tr><td class=\"w\">mean<\/td><td class=\"m\">의미하다, 뜻하다<\/td><\/tr><tr><td class=\"w\">cast<\/td><td class=\"m\">배역을 맡기다, 캐스팅하다<\/td><\/tr><tr><td class=\"w\">director<\/td><td class=\"m\">감독, 책임자<\/td><\/tr><tr><td class=\"w\">result<\/td><td class=\"m\">결과<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">senior<\/td><td class=\"m\">어르신, 연장자<\/td><\/tr><tr><td class=\"w\">announce<\/td><td class=\"m\">발표하다, 알리다<\/td><\/tr><tr><td class=\"w\">involved in<\/td><td class=\"m\">~에 관여하는, ~에 참여하는<\/td><\/tr><tr><td class=\"w\">rush<\/td><td class=\"m\">서두르다, 달려가다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I <span class=\"grammar-hl\">glanced at<\/span> the clock on the wall.<\/b><\/span><span class=\"ko\">나는 벽에 있는 시계를 흘끗 보았다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 벽에 있는 시계를 흘끗 보았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 주인공이 초조하게 무언가를 기다리고 있음을 암시하며 글의 배경을 설정합니다. glanced at the clock은 단순히 시간을 확인하는 행위를 넘어, 약속된 순간이 다가오고 있다는 긴장감을 시각적으로 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">glanced at (관용표현): &#39;~을 힐끗 보다&#39;라는 의미로 동사 glance와 전치사 at이 결합하여 하나의 타동사처럼 쓰인 구동사다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">glance<\/td><td class=\"m\">흘낏 보다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">10:00<\/span>.<\/b><\/span><span class=\"ko\">10시였다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">10시였다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 시계를 본 이유가 구체적인 시각으로 드러납니다. 10:00은 이 글에서 사건이 발생하기로 예정된 결정적인 시점임을 짧고 강렬하게 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">10:00 시간 표현: 문장에서 시간을 나타내는 명사구로, 상황의 배경을 제시하는 역할을 한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 3 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>That <span class=\"grammar-hl\">meant<\/span><\/b><\/span><span class=\"ko\">그것은 의미했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">the casting director would call<\/span> very soon<\/b><\/span><span class=\"ko\">섭외 감독이 곧 전화할 것이라는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with the results of my first audition<\/b><\/span><span class=\"ko\">나의 첫 번째 오디션 결과로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for a musical part in The Wizard of Oz.<\/b><\/span><span class=\"ko\">&#39;오즈의 마법사&#39; 뮤지컬 배역에 대한.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것은 섭외 감독이 &#39;오즈의 마법사&#39; 뮤지컬 배역에 대한 나의 첫 번째 오디션 결과로 곧 전화할 것이라는 걸 의미했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 10시라는 시각이 주인공에게 왜 중요한지 설명합니다. the results of my first audition은 주인공이 현재 매우 공을 들여 기다리는 사건의 실체이며, 이 문장을 통해 글의 전체적인 맥락이 오디션 합격 여부를 기다리는 상황임이 명확해집니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">meant the casting director would call 명사절(접속사 that 생략): meant의 목적어 자리에 접속사 that이 생략된 명사절이 온 구조로, &#39;casting director가 전화를 할 것&#39;이라는 사실을 의미한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mean<\/td><td class=\"m\">의미하다, 뜻하다<\/td><\/tr><tr><td class=\"w\">cast<\/td><td class=\"m\">배역을 맡기다, 캐스팅하다<\/td><\/tr><tr><td class=\"w\">director<\/td><td class=\"m\">감독, 책임자<\/td><\/tr><tr><td class=\"w\">result<\/td><td class=\"m\">결과<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I felt shaky<\/b><\/span><span class=\"ko\">나는 떨림을 느꼈다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>all over,<\/b><\/span><span class=\"ko\">온몸이,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">chewing my thumbnail<\/span><\/b><\/span><span class=\"ko\">엄지손톱을 물어뜯고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and jiggling my feet<\/span>.<\/b><\/span><span class=\"ko\">발을 흔들어대며.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 온몸이 떨렸고, 엄지손톱을 물어뜯고 발을 흔들어댔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 전화를 기다리는 주인공의 극심한 불안감과 초조함을 묘사합니다. chewing my thumbnail and jiggling my feet은 불안할 때 나타나는 무의식적인 신체 반응을 나열하여 독자가 주인공의 긴장을 생생하게 느끼게 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">chewing my thumbnail and jiggling my feet (분사구문): 현재분사 chewing과 jiggling이 이끄는 분사구문으로, 주절의 동작과 동시에 일어나는 동작을 나타낸다. 원래 절로 변환하면 while I was chewing my thumbnail and jiggling my feet으로 쓸 수 있다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 5 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Finally,<\/b><\/span><span class=\"ko\">마침내,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">the telephone rang<\/span>.<\/b><\/span><span class=\"ko\">전화기가 울렸다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">마침내 전화기가 울렸다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 오랜 기다림 끝에 마침내 기다리던 사건이 발생했음을 알립니다. Finally는 주인공이 느꼈던 심리적 대기 시간이 매우 길었음을 강조하며 분위기를 전환합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">the telephone rang 1형식(SV) 구조: 주어(the telephone)와 자동사(rang)로 이루어진 완전한 문장 구조다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 6 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>While I <span class=\"grammar-hl\">was coming round<\/span>,<\/b><\/span><span class=\"ko\">내가 안절부절못하는 사이,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Dad answered.<\/b><\/span><span class=\"ko\">아빠가 전화를 받았다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">내가 안절부절못하는 사이, 아빠가 전화를 받았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 갑작스러운 벨 소리에 얼어붙은 주인공 대신 아빠가 개입하는 상황입니다. coming round는 너무 긴장한 나머지 전화가 울리는 순간 잠시 멍해졌다가 비로소 상황 파악을 하기 시작했다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was coming round (과거진행): be동사의 과거형(was) + 현재분사(coming) 형태로, 과거의 특정 시점에 진행 중이던 동작을 나타낸다.<\/div><div class=\"lec-gr-item\">coming round (관용표현): &#39;의식을 회복하다&#39; 혹은 &#39;(어떤 장소에) 들르다/돌아오다&#39;라는 의미를 가진 구동사다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I <span class=\"grammar-hl\">heard him say<\/span>,<\/b><\/span><span class=\"ko\">나는 그가 말하는 것을 들었다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>\"Ahh, thank you.<\/b><\/span><span class=\"ko\">&quot;아, 감사합니다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 그가, &quot;아, 감사합니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 전화를 받는 아빠의 반응을 통해 간접적으로 소식을 전달합니다. Ahh, thank you는 상대방으로부터 긍정적인 메시지나 예의 바른 통보를 받았음을 짐작하게 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">heard him say 5형식(SVOC) 구조: 지각동사 heard + 목적어(him) + 목적격보어(say) 구조로, 지각동사의 목적격보어 자리에 동사원형이 쓰였다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 8 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I'll <span class=\"grammar-hl\">let her know<\/span> ...\"<\/b><\/span><span class=\"ko\">그녀에게 알려주겠습니다...&quot;<\/span><\/div><\/div><div class=\"lec-sent-ko\">그녀에게 알려주겠습니다...&quot;라고 말하는 것을 들었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 전화 통화가 마무리되는 시점입니다. let her know는 소식을 전해 듣는 주체가 주인공임을 명시하며, 이제 곧 결과가 주인공에게 직접 전달될 것임을 예고합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">let her know 5형식(SVOC) 구조: 사역동사 let + 목적어(her) + 목적격보어(know) 구조로, 사역동사의 목적격보어 자리에 동사원형이 쓰였다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 9 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>As I got to the bottom of the stairs,<\/b><\/span><span class=\"ko\">내가 계단을 다 내려갔을 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he <span class=\"grammar-hl\">was just putting the phone down<\/span>.<\/b><\/span><span class=\"ko\">그는 막 전화기를 내려놓고 있었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">내가 계단을 다 내려갔을 때, 그는 막 전화기를 내려놓고 있었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 주인공이 소식을 듣기 위해 아빠에게 다가가는 역동적인 장면입니다. putting the phone down은 대화가 끝났음을 보여주며, 이제 결과가 공개될 찰나의 긴장감을 극대화합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was just putting the phone down (과거진행): be동사의 과거형(was) + 현재분사(putting) 형태로, 과거 시점에 동작이 진행 중이었음을 나타낸다.<\/div><div class=\"lec-gr-item\">putting the phone down (관용표현): &#39;수화기를 내려놓다&#39; 또는 &#39;전화를 끊다&#39;라는 의미의 구동사다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>\"<span class=\"grammar-hl\">That was The Wizard of Oz<\/span>.<\/b><\/span><span class=\"ko\">&quot;&#39;오즈의 마법사&#39;였어.<\/span><\/div><\/div><div class=\"lec-sent-ko\">&quot;&#39;오즈의 마법사&#39;였어.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 전화를 건 상대방의 정체를 확인시켜 줍니다. That was The Wizard of Oz는 오디션 결과가 담긴 공식적인 연락이었음을 다시 한번 상기시킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">That was The Wizard of Oz 2형식(SVC) 구조: 주어(That) + be동사(was) + 주격보어(The Wizard of Oz)로 이루어진 문장 구조다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 11 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">You're second senior munchkin<\/span>,\"<\/b><\/span><span class=\"ko\">너는 둘째 상급 먼치킨이야,&quot;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he announced.<\/b><\/span><span class=\"ko\">그가 알려주었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">너는 둘째 상급 먼치킨이야.&quot;라고 그가 알려주었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 마침내 오디션 결과가 구체적으로 밝혀집니다. second senior munchkin은 주인공이 맡게 된 구체적인 역할 이름으로, 주인공이 오디션에 합격했음을 알리는 핵심 정보입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">You&#39;re second senior munchkin 2형식(SVC) 구조: 주어(You) + be동사(&#39;re) + 주격보어(second senior munchkin)로 이루어진 문장 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">senior<\/td><td class=\"m\">어르신, 연장자<\/td><\/tr><tr><td class=\"w\">announce<\/td><td class=\"m\">발표하다, 알리다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 12 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I got a little rush of excitement,<\/b><\/span><span class=\"ko\">나는 흥분감이 약간 밀려왔다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">knowing I was in<\/span><\/b><\/span><span class=\"ko\">내가 참여한다는 것을 알게 되어<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>— that whatever happened<\/b><\/span><span class=\"ko\">— 어떤 일이 있었더라도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I could <span class=\"grammar-hl\">be involved<\/span><\/b><\/span><span class=\"ko\">내가 참여할 수 있다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">in<\/span> one of the productions.<\/b><\/span><span class=\"ko\">작품 중 하나에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">내가 참여한다는 것 즉 어떤 일이 있었더라도 내가 작품 중 하나에 참여할 수 있다는 것을 알게 되어 흥분감이 약간 밀려왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 결과에 대한 주인공의 최종적인 안도와 기쁨을 나타냅니다. knowing I was in은 역할의 크기와 상관없이 공연의 일원이 되었다는 사실 자체에 큰 의미를 두고 기뻐하고 있음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">knowing I was in (분사구문): 현재분사 knowing이 이끄는 분사구문으로, 주절의 상황에 대한 원인이나 부연 설명을 나타낸다. 원래 절로 변환하면 because/as I knew I was in으로 쓸 수 있다.<\/div><div class=\"lec-gr-item\">be involved in (수동태): be동사(be) + p.p.(involved) 구조. involve는 타동사인데 뒤에 목적어가 없어서 수동구조 be involved 형태로 쓴다. 기본구조: involve + O + in B (O를 B에 참여시키다/관련시키다)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">involved in<\/td><td class=\"m\">~에 관여하는, ~에 참여하는<\/td><\/tr><tr><td class=\"w\">rush<\/td><td class=\"m\">서두르다, 달려가다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>주인공은 오전 10시에 걸려올 뮤지컬 &#39;오즈의 마법사&#39; 오디션 결과 전화를 초조하게 기다린다.<\/li><li>손톱을 깨물고 몸을 떨 정도로 긴장한 순간, 마침내 전화가 울리고 아빠가 대신 전화를 받는다.<\/li><li>아빠는 통화를 마친 후 주인공이 &#39;두 번째 선임 먼치킨&#39; 역할로 합격했다는 소식을 전한다.<\/li><li>주인공은 배역의 비중과 관계없이 공연에 참여하게 되었다는 사실에 큰 기쁨과 설렘을 느낀다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">After suffering from extreme nervousness while waiting for the phone call, the narrator felt a surge of joy upon learning about their successful casting in the production.<\/div>\n              <div class=\"lec-final-sum-ko\">전화 통화를 기다리며 극도의 긴장감에 시달린 후, 서술자는 작품에 성공적으로 캐스팅되었다는 소식을 듣고 기쁨의 전율을 느꼈다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./19_audio/1.mp3","hl":null}],[{"audio":"./19_audio/2.mp3","hl":null}],[{"audio":"./19_audio/3.mp3","hl":null},{"audio":"./19_audio/4.mp3","hl":"stage-0"},{"audio":"./19_audio/5.mp3","hl":"stage-1"},{"audio":"./19_audio/6.mp3","hl":"stage-2"}],[{"audio":"./19_audio/7.mp3","hl":null}],[{"audio":"./19_audio/8.mp3","hl":"main"},{"audio":"./19_audio/9.mp3","hl":"meaning"},{"audio":"./19_audio/10.mp3","hl":"grammar"}],[{"audio":"./19_audio/11.mp3","hl":"main"},{"audio":"./19_audio/12.mp3","hl":"meaning"},{"audio":"./19_audio/13.mp3","hl":"grammar"}],[{"audio":"./19_audio/14.mp3","hl":"main"},{"audio":"./19_audio/15.mp3","hl":"meaning"},{"audio":"./19_audio/16.mp3","hl":"grammar"}],[{"audio":"./19_audio/17.mp3","hl":"main"},{"audio":"./19_audio/18.mp3","hl":"meaning"},{"audio":"./19_audio/19.mp3","hl":"grammar"}],[{"audio":"./19_audio/20.mp3","hl":"main"},{"audio":"./19_audio/21.mp3","hl":"meaning"},{"audio":"./19_audio/22.mp3","hl":"grammar"}],[{"audio":"./19_audio/23.mp3","hl":"main"},{"audio":"./19_audio/24.mp3","hl":"meaning"},{"audio":"./19_audio/25.mp3","hl":"grammar"}],[{"audio":"./19_audio/26.mp3","hl":"main"},{"audio":"./19_audio/27.mp3","hl":"meaning"},{"audio":"./19_audio/28.mp3","hl":"grammar"}],[{"audio":"./19_audio/29.mp3","hl":"main"},{"audio":"./19_audio/30.mp3","hl":"meaning"},{"audio":"./19_audio/31.mp3","hl":"grammar"}],[{"audio":"./19_audio/32.mp3","hl":"main"},{"audio":"./19_audio/33.mp3","hl":"meaning"},{"audio":"./19_audio/34.mp3","hl":"grammar"}],[{"audio":"./19_audio/35.mp3","hl":"main"},{"audio":"./19_audio/36.mp3","hl":"meaning"},{"audio":"./19_audio/37.mp3","hl":"grammar"}],[{"audio":"./19_audio/38.mp3","hl":"main"},{"audio":"./19_audio/39.mp3","hl":"meaning"},{"audio":"./19_audio/40.mp3","hl":"grammar"}],[{"audio":"./19_audio/41.mp3","hl":"main"},{"audio":"./19_audio/42.mp3","hl":"meaning"},{"audio":"./19_audio/43.mp3","hl":"grammar"}],[{"audio":"./19_audio/44.mp3","hl":null}]],"fileName":"EBS올림포스(연합기출)고1 2026년 02강 01번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"EBS올림포스(연합기출)고1 2026년 02강 01번","titleEn":"The Anxious Wait: Securing a Role in the Musical","titleKo":"초조한 기다림: 뮤지컬 배역을 따내다","imageUrl":"__enpImg__","stages":[{"label":"01초조한 기다림","items":["뮤지컬 '오즈의 마법사' 오디션 결과를 앞두고 극도로 긴장한 상태를 묘사한다.","시계를 확인하며 캐스팅 디렉터(casting director)의 전화를 기다림","손톱을 깨물거나 발을 흔드는 등 신체적인 불안 증상을 보임","핵심 키워드: 긴장한(shaky), 기다림(waiting)"]},{"label":"02전화 통화와 전달","items":["마침내 전화가 걸려오고 아버지가 대신 결과를 듣는다.","전화벨(telephone)이 울리고 아버지가 수신함","계단 아래에서 전화를 끊는 아버지의 모습을 지켜봄","핵심 키워드: 통화(call), 소식(news)"]},{"label":"03결과 발표와 환희","items":["오디션 합격 소식을 듣고 작품에 참여하게 된 기쁨을 만끽한다.","'두 번째 선임 먼치킨(second senior munchkin)' 배역을 맡게 됨","제작에 참여하게 되었다는 사실에 짜릿함(rush of excitement)을 느낌","핵심 키워드: 합격(in), 흥분(excitement)"]}],"bkg":"뮤지컬이나 연극 무대에 오르기 위해서는 캐스팅 디렉터(Casting Director) 앞에서 자신의 기량을 뽐내는 오디션(Audition) 과정을 반드시 거쳐야 하는데요. 이 글의 배경인 오즈의 마법사(The Wizard of Oz)는 주인공 도로시가 신비한 나라를 여행하는 고전 명작으로, 주인공 외에도 이야기의 활력을 불어넣는 다양한 조연(Supporting Role)들이 등장합니다. 특히 주인공이 처음 만나는 작은 사람들의 종족인 먼치킨(Munchkin)은 극의 시작을 알리는 활기찬 군중 역할을 담당하며, 대규모 인원이 참여하는 앙상블(Ensemble)의 핵심이기도 합니다. 마치 운동선수가 후보 명단에라도 이름을 올리는 것만큼이나, 어떤 역할이든 배역을 얻는다는 것은 공연 제작이라는 거대한 톱니바퀴의 일원이 된다는 소속감(Sense of Belonging)과 성취감을 주는 아주 특별한 경험입니다.","ttsText":"뮤지컬이나 연극 무대에 오르기 위해서는 캐스팅 디렉터(Casting Director) 앞에서 자신의 기량을 뽐내는 오디션(Audition) 과정을 반드시 거쳐야 하는데요. 이 글의 배경인 오즈의 마법사(The Wizard of Oz)는 주인공 도로시가 신비한 나라를 여행하
