i><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02대안적인 질문의 제시<\/div><ul><li>고객이 구체적으로 대답할 수 있는 열린 질문을 던지는 것이 좋다.<\/li><li>특정한 물건(anything in particular)을 찾는지 질문<\/li><li>선물용 쇼핑(shopping for a gift)인지 확인하는 구체적 접근<\/li><li>고객이 더 많이 말하도록 유도하는 질문 사용<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03질문에 담긴 부정적 함의<\/div><ul><li>기계적인 질문은 판매자의 무관심을 드러내며 고객의 자존감을 건드린다.<\/li><li>훈련되지 않은 판매원의 기계적인 접근(rote approach)으로 인식됨<\/li><li>고객이 구조(rescuing)가 필요한 무능한 상태라는 암시를 줌<\/li><li>무의식적으로 &quot;내 일은 내가 알아서 한다&quot;는 반발심 유발<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04편안한 쇼핑 환경 조성<\/div><ul><li>고객이 압박을 느끼지 않고 자유롭게 매장을 둘러볼 수 있어야 한다.<\/li><li>재촉당하지 않는 편안한 환경(comfortable environment) 제공<\/li><li>고객이 압박감(pressured)이나 궁지에 몰린 기분을 느끼지 않게 함<\/li><li>자유롭게 구경하는 것(look around)이 괜찮다는 인상을 줌<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05적절한 거리 유지와 대기<\/div><ul><li>고객이 혼자 있기를 원할 때는 적절한 거리를 유지하며 도움을 준비한다.<\/li><li>고객에게 명함(business cards)을 건네며 전문성 전달<\/li><li>질문이나 우려 사항(concerns)이 생길 때를 대비해 대기<\/li><li>접근 가능한(accessible) 상태를 유지하며 고객의 자율성 존중<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">retail<\/td><td class=\"m\">소매(의)<\/td><\/tr><tr><td class=\"w\">utter<\/td><td class=\"m\">말하다, 완전한<\/td><\/tr><tr><td class=\"w\">encourage<\/td><td class=\"m\">격려하다, 장려하다<\/td><\/tr><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">defensive<\/td><td class=\"m\">방어적인<\/td><\/tr><tr><td class=\"w\">usually<\/td><td class=\"m\">보통, 대개<\/td><\/tr><tr><td class=\"w\">negative<\/td><td class=\"m\">부정적인<\/td><\/tr><tr><td class=\"w\">response<\/td><td class=\"m\">반응, 응답<\/td><\/tr><tr><td class=\"w\">transaction<\/td><td class=\"m\">거래<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">approach<\/td><td class=\"m\">다가가다, 접근하다<\/td><\/tr><tr><td class=\"w\">particular<\/td><td class=\"m\">(in particular) 특히<\/td><\/tr><tr><td class=\"w\">fashion<\/td><td class=\"m\">방식, 방법<\/td><\/tr><tr><td class=\"w\">overuse<\/td><td class=\"m\">과도하게 사용하다, 남용하다, 혹사시키다<\/td><\/tr><tr><td class=\"w\">uninterested<\/td><td class=\"m\">흥미 없는, 무관심한<\/td><\/tr><tr><td class=\"w\">shudder<\/td><td class=\"m\">떨다, 몸서리치다<\/td><\/tr><tr><td class=\"w\">meaning<\/td><td class=\"m\">의미, 뜻<\/td><\/tr><tr><td class=\"w\">reject<\/td><td class=\"m\">거절하다, 거부하다<\/td><\/tr><tr><td class=\"w\">sort<\/td><td class=\"m\">종류, 유형<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>\"May I help you?\"<\/b><\/span><span class=\"ko\">&quot;도와드릴까요?&quot;는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are the worst four words<\/b><\/span><span class=\"ko\">최악의 네 단어이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that a retail salesperson can utter<\/span><\/b><\/span><span class=\"ko\">소매 판매원이 말할 수 있는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because they don't <span class=\"grammar-hl\">encourage the customer to talk<\/span><\/b><\/span><span class=\"ko\">왜냐하면 그것들이 고객이 말하도록 권장하지 않기 때문이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and put them <span class=\"grammar-hl\">on the defensive<\/span>.<\/b><\/span><span class=\"ko\">그리고 그들을 방어적인 태세로 만들기 때문이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">&quot;도와드릴까요?&quot;는 고객이 말을 하도록 하지 않고, 그들이 방어적이게 하기 때문에 소매 판매원이 말할 수 있는 최악의 네 단어이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 주제를 제시하는 문장입니다. 흔히 친절한 서비스라고 생각하는 문구가 실제 영업 현장에서는 don&#39;t encourage the customer to talk, 즉 고객의 구매 의도나 필요를 파악할 기회를 차단하고 심리적 장벽만 세우는 역효과를 낸다는 점을 지적합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that a retail salesperson can utter (관계대명사): 목적격 관계대명사 that이 이끄는 절이 앞의 선행사 the worst four words를 수식한다. utter의 목적어가 빠져 있는 불완전한 절이다.<\/div><div class=\"lec-gr-item\">encourage the customer to talk 5형식(SVOC) 구조: 동사 encourage가 목적어(the customer) 뒤에 목적격보어로 to부정사(to talk)를 취하는 형태다.<\/div><div class=\"lec-gr-item\">on the defensive (관용표현): &#39;방어적인 태도를 취하여&#39;라는 의미의 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">retail<\/td><td class=\"m\">소매(의)<\/td><\/tr><tr><td class=\"w\">utter<\/td><td class=\"m\">말하다, 완전한<\/td><\/tr><tr><td class=\"w\">encourage<\/td><td class=\"m\">격려하다, 장려하다<\/td><\/tr><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">defensive<\/td><td class=\"m\">방어적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The four words<\/b><\/span><span class=\"ko\">그 네 단어는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>usually <span class=\"grammar-hl\">draw out<\/span> a negative response<\/b><\/span><span class=\"ko\">주로 부정적인 반응을 끌어낸다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that stops cold a sales transaction<\/span>.<\/b><\/span><span class=\"ko\">판매 거래를 완전히 중단시키는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 네 단어는 판매 거래를 완전히 막는 부정적인 반응을 주로 끌어낸다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 부정적인 효과를 구체화합니다. stops cold a sales transaction은 고객이 대화를 거절함으로써 물건을 팔 수 있는 모든 가능성이 그 즉시 얼어붙듯 사라져 버린다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">draw out (관용표현): &#39;끌어내다&#39;라는 의미의 구동사(Phrasal Verb)다.<\/div><div class=\"lec-gr-item\">that stops cold a sales transaction (관계대명사): 주격 관계대명사 that이 이끄는 절이 앞의 선행사 a negative response를 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">usually<\/td><td class=\"m\">보통, 대개<\/td><\/tr><tr><td class=\"w\">negative<\/td><td class=\"m\">부정적인<\/td><\/tr><tr><td class=\"w\">response<\/td><td class=\"m\">반응, 응답<\/td><\/tr><tr><td class=\"w\">transaction<\/td><td class=\"m\">거래<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Examples of better questions <span class=\"grammar-hl\">to use<\/span><\/b><\/span><span class=\"ko\">사용할 수 있는 더 나은 질문들의 예는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">when approaching customers<\/span><\/b><\/span><span class=\"ko\">고객에게 다가갈 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are \"Is there anything in particular<\/b><\/span><span class=\"ko\">&quot;특별히 어떤 것이 있나요<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that you are looking for<\/span>?\"<\/b><\/span><span class=\"ko\">당신이 찾고 있는?&quot;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and \"Are you shopping for a gift?\"<\/b><\/span><span class=\"ko\">그리고 &quot;선물을 위해 쇼핑 중이신가요?&quot;이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">고객에게 다가갈 때 사용할 수 있는 더 나은 질문들의 예들로는 &quot;특별히 당신이 찾고 계신 어떤 것이 있나요?&quot;와 &quot;당신은 선물을 위한 쇼핑을 하고 있나요?&quot;가 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 문제 제기에 이어 구체적인 대안을 제시합니다. better questions는 예/아니오로 대답이 끝나는 폐쇄적 질문이 아니라, 고객이 자신의 상황을 설명하게끔 유도하여 자연스럽게 대화로 이어지는 질문들을 가리킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to use (to부정사(형용사적)): 앞의 명사 better questions를 수식한다. &#39;사용할&#39; 질문으로 해석되며, questions that you use의 의미를 가진다.<\/div><div class=\"lec-gr-item\">when approaching customers (현재분사): 접속사 when 뒤에 주어와 be동사(you are)가 생략되고 현재분사 approaching이 남은 분사구문 형태다. when you approach customers로 바꿀 수 있다.<\/div><div class=\"lec-gr-item\">that you are looking for (관계대명사): 목적격 관계대명사 that이 이끄는 절이 선행사 anything을 수식한다. 전치사 for의 목적어가 생략된 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">approach<\/td><td class=\"m\">다가가다, 접근하다<\/td><\/tr><tr><td class=\"w\">particular<\/td><td class=\"m\">(in particular) 특히<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If a fashion salesperson approached you<\/b><\/span><span class=\"ko\">만약 패션 판매원이 당신에게 다가온다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with \"May I help you?\"<\/b><\/span><span class=\"ko\">&quot;도와드릴까요?&quot;라는 말과 함께<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">chances are<\/span><\/b><\/span><span class=\"ko\">가능성이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you would feel<\/b><\/span><span class=\"ko\">당신이 느낄<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the salesperson didn't care.<\/b><\/span><span class=\"ko\">그 판매원이 신경 쓰지 않는다고.<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 패션 판매원이 &quot;도와드릴까요?&quot;로 당신에게 다가온다면, 당신은 그 판매원이 신경 쓰지 않는다고 느낄 가능성이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 옷가게라는 구체적인 상황을 설정해 고객의 심리를 묘사합니다. didn&#39;t care는 판매원이 진심으로 고객의 스타일이나 니즈를 도우려는 것이 아니라, 그저 기계적으로 할 일을 하고 있다는 인상을 준다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">chances are (관용표현): &#39;아마 ~일 것이다&#39;라는 의미로, chances are 뒤에 접속사 that이 생략된 형태다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">approach<\/td><td class=\"m\">다가가다, 접근하다<\/td><\/tr><tr><td class=\"w\">fashion<\/td><td class=\"m\">방식, 방법<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This line<\/b><\/span><span class=\"ko\">이 문구는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is a rote approach<\/b><\/span><span class=\"ko\">기계적인 접근 방식이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that is so overused<\/span><\/b><\/span><span class=\"ko\">매우 과하게 사용되는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by <span class=\"grammar-hl\">untrained and uninterested<\/span> salespeople.<\/b><\/span><span class=\"ko\">훈련되지 않고 무관심한 판매원들에 의해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이 문장은 훈련되지 않고 무관심한 판매원들에 의해 매우 지나치게 사용되는 기계적인 접근 방식이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 질문이 왜 최악인지를 판매자의 태도 측면에서 설명합니다. a rote approach는 고객 개개인의 특성을 고려하지 않고 영혼 없이 내뱉는 상투적인 문구라는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that is so overused (수동태): be동사(is)+p.p.(overused) 구조. overuse는 타동사인데 뒤에 목적어가 없어서 수동구조 is overused 형태로 쓴다. 기본구조: V + O<\/div><div class=\"lec-gr-item\">untrained and uninterested (과거분사(형용사)): 과거분사 untrained와 uninterested가 뒤의 명사 salespeople을 수식한다. (= 훈련받지 않고 관심이 없는 판매원들)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">approach<\/td><td class=\"m\">다가가다, 접근하다<\/td><\/tr><tr><td class=\"w\">overuse<\/td><td class=\"m\">과도하게 사용하다, 남용하다, 혹사시키다<\/td><\/tr><tr><td class=\"w\">uninterested<\/td><td class=\"m\">흥미 없는, 무관심한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In fact,<\/b><\/span><span class=\"ko\">사실<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>most of us shudder in horror<\/b><\/span><span class=\"ko\">우리 대부분은 공포로 몸서리친다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">on hearing<\/span> these words.<\/b><\/span><span class=\"ko\">이 단어들을 들을 때.<\/span><\/div><\/div><div class=\"lec-sent-ko\">실제로, 우리 대부분은 이 단어들을 들을 때 기겁하여 몸서리친다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 설명을 바탕으로 고객들이 느끼는 거부감을 극단적인 표현으로 강조합니다. shudder in horror는 판매원이 다가와 말을 거는 행위 자체에 대해 고객이 느끼는 본능적인 불편함과 압박감을 생생하게 묘사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">on hearing (동명사): 전치사 on의 목적어로 쓰인 명사적 역할이다. &#39;on + -ing&#39;는 &#39;~하자마자&#39;라는 의미의 관용구로도 쓰인다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shudder<\/td><td class=\"m\">떨다, 몸서리치다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The very meaning of the question \"May I help you?\"<\/b><\/span><span class=\"ko\">&quot;도와드릴까요?&quot;라는 질문의 바로 그 의미는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>implies or suggest<\/b><\/span><span class=\"ko\">내포하거나 암시한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that the customer is in trouble of some sort<\/b><\/span><span class=\"ko\">고객이 어떤 종류의 곤경에 처해 있다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and needs <span class=\"grammar-hl\">rescuing<\/span>.<\/b><\/span><span class=\"ko\">그리고 구조가 필요하다는 것을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">&quot;도와드릴까요?&quot;라는 이 질문의 진짜 의미는 고객이 어떤 종류의 곤경에 처해 있고 구출될 필요가 있다는 것을 내포한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 질문이 왜 거부감을 주는지 언어 심리학적으로 분석합니다. needs rescuing은 도움을 주겠다는 말이 자칫 고객을 혼자서는 쇼핑도 못 하는 무능한 존재로 취급하는 것처럼 들릴 수 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">rescuing (동명사): 타동사 needs의 목적어로 쓰인 명사적 역할이다. &#39;~하는 것&#39;으로 해석된다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">meaning<\/td><td class=\"m\">의미, 뜻<\/td><\/tr><tr><td class=\"w\">sort<\/td><td class=\"m\">종류, 유형<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This<\/b><\/span><span class=\"ko\">이것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>almost always <span class=\"grammar-hl\">puts the customer<\/span><\/b><\/span><span class=\"ko\">거의 항상 고객을 둔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">on the defense<\/span>.<\/b><\/span><span class=\"ko\">방어적인 상태에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이는 거의 항상 그 고객이 방어적이게 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 7번 문장에서 언급한 암시 때문에 발생하는 결과를 보여줍니다. puts the customer on the defense는 자신의 영역이나 판단력을 침범당했다고 느낀 고객이 심리적인 보호막을 치게 된다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">puts the customer on the defense (관용표현): &#39;고객을 방어적으로 만들다&#39;라는 의미의 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>\"No, thank you\"<\/b><\/span><span class=\"ko\">&quot;아니요, 괜찮습니다&quot;는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is usually the immediate response,<\/b><\/span><span class=\"ko\">주로 즉각적인 반응이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>even if the customer is actually <span class=\"grammar-hl\">in need of<\/span> assistance.<\/b><\/span><span class=\"ko\">비록 그 고객이 실제로 도움이 필요할지라도.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 고객이 실제로 도움이 필요할지라도 &quot;아니요, 괜찮습니다&quot;는 주로 즉각적인 반응이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 방어 기제의 구체적인 현상을 설명합니다. immediate response는 이성적인 판단을 거치지 않고 반사적으로 튀어 나오는 거절의 대답을 뜻합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">in need of (관용표현): &#39;~이 필요한&#39;이라는 의미의 형용사구 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">usually<\/td><td class=\"m\">보통, 대개<\/td><\/tr><tr><td class=\"w\">response<\/td><td class=\"m\">반응, 응답<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The subconscious thought by the customer<\/b><\/span><span class=\"ko\">고객의 잠재의식적인 생각은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is often<\/b><\/span><span class=\"ko\">종종 이렇다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>\"I'm smart <span class=\"grammar-hl\">enough<\/span><\/b><\/span><span class=\"ko\">&quot;나는 충분히 똑똑해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to figure out<\/span> <span class=\"grammar-hl\">what I want<\/span>,<\/b><\/span><span class=\"ko\">내가 원하는 것을 알아낼 만큼<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and I don't need your help!\"<\/b><\/span><span class=\"ko\">그리고 나는 당신의 도움이 필요하지 않아!&quot;<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 고객의 잠재의식적인 생각은 종종 &quot;나는 내가 원하는 것을 알 만큼 충분히 현명해, 그래서 나는 당신의 도움이 필요하지 않아!&quot;이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 9번의 거절 뒤에 숨겨진 고객의 내면 심리를 대사 형식으로 풀어서 설명합니다. I&#39;m smart enough는 자신의 자율성과 지적 능력을 확인받고 싶어 하는 인간의 기본 욕구를 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">enough to figure out (to부정사(부사적): 형용사 수식): 앞의 형용사 smart를 수식하여 정도를 나타낸다. &#39;~할 만큼 충분히&#39;로 해석된다.<\/div><div class=\"lec-gr-item\">what I want (간접의문문): 의문사 what이 이끄는 명사절로 figure out의 목적어 역할을 한다. 의문사(what)+주어(I)+동사(want) 어순이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 11 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If customers feel <span class=\"grammar-hl\">pressured or cornered<\/span>,<\/b><\/span><span class=\"ko\">만약 고객들이 압박감을 느끼거나 궁지에 몰린다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>then salespeople won't make any sales.<\/b><\/span><span class=\"ko\">그러면 판매원들은 어떤 판매도 하지 못할 것이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 고객들이 압박과 궁지에 몰림을 느낀다면, 그러면 판매원들은 어떤 판매도 못할 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 잘못된 접근 방식이 가져오는 최종적인 사업적 손실을 경고합니다. cornered는 판매원의 과도한 관심이나 질문이 고객에게는 도망갈 곳 없는 막다른 골목에 갇힌 듯한 불쾌감을 준다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">pressured or cornered (과거분사(형용사)): 연결동사 feel의 보어(C) 역할을 하여 주어(customers)의 상태를 설명한다. &#39;압박을 느끼거나 궁지에 몰린&#39;으로 해석된다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 12 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The approach<\/b><\/span><span class=\"ko\">그 접근 방식은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>has <span class=\"grammar-hl\">to promote<\/span> a comfortable environment<\/b><\/span><span class=\"ko\">편안한 환경을 조성해야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that makes customers feel<\/span><\/b><\/span><span class=\"ko\">고객들이 느끼게 만드는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>there is no rush.<\/b><\/span><span class=\"ko\">서두를 필요가 없다고.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 접근 방식은 고객들이 서두름이 없다고 느끼게 만드는 편안한 환경을 조장해야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 성공적인 판매를 위한 올바른 방향성을 제시합니다. there is no rush는 고객이 충분히 시간을 두고 스스로 결정할 수 있도록 심리적 여유를 제공해야 한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that makes customers feel 5형식(SVOC) 구조: 사역동사 make가 목적어(customers) 뒤에 목적격보어로 동사원형(feel)을 취하는 형태다.<\/div><div class=\"lec-gr-item\">to promote (to부정사(명사적)): have to(~해야 한다)의 일부로 쓰인 것이며, promote는 타동사로서 목적어 a comfortable environment를 취한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">approach<\/td><td class=\"m\">다가가다, 접근하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 13 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Furthermore,<\/b><\/span><span class=\"ko\">게다가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>if customers just want <span class=\"grammar-hl\">to look around<\/span>,<\/b><\/span><span class=\"ko\">만약 고객들이 그저 둘러보기를 원한다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they should feel<\/b><\/span><span class=\"ko\">그들은 느껴야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that <span class=\"grammar-hl\">it is all right<\/span><\/b><\/span><span class=\"ko\">그것이 괜찮다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to do so<\/span>.<\/b><\/span><span class=\"ko\">그렇게 하는 것이.<\/span><\/div><\/div><div class=\"lec-sent-ko\">게다가, 만약 고객들이 그저 둘러보길 원한다면, 그들은 그렇게 하는 것이 괜찮다는 것을 느껴야만 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 편안한 환경에 대한 구체적인 조건을 덧붙입니다. all right to do so는 물건을 당장 사지 않고 구경만 하더라도 판매원에게 미안함을 느끼거나 눈치를 볼 필요가 없는 분위기를 가리킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to look around (to부정사(명사적)): 타동사 want의 목적어 역할을 한다.<\/div><div class=\"lec-gr-item\">it is all right to do so (가주어): 진주어: it은 가주어이며, to부정사구인 to do so가 문장의 진짜 주어(진주어)다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 14 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In situations<\/b><\/span><span class=\"ko\">상황들에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">where customers really do want<\/span> to look around on their own,<\/b><\/span><span class=\"ko\">고객들이 정말로 혼자서 둘러보기를 원하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>salespeople should give customers their business cards<\/b><\/span><span class=\"ko\">판매원들은 고객들에게 그들의 명함을 주어야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">keep themselves accessible<\/span><\/b><\/span><span class=\"ko\">그리고 그들 자신을 접근 가능한 상태로 유지해야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in case customers have questions or concerns.<\/b><\/span><span class=\"ko\">고객들이 질문이나 우려 사항이 있을 경우를 대비하여.<\/span><\/div><\/div><div class=\"lec-sent-ko\">고객들이 정말 진짜로 혼자 둘러보길 원하는 상황들에서는, 고객들이 질문이나 걱정이 있을 경우를 대비하여, 판매원들은 고객들에게 그들의 명함을 주고 그들 스스로를 접근할 수 있는 상태로 유지해야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 결론으로서 판매원의 가장 바람직한 행동 지침을 제안합니다. keep themselves accessible은 고객을 방치하는 것이 아니라, 적당한 거리를 유지하며 고객이 원할 때 즉시 도움을 줄 수 있는 준비된 상태로 대기한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">where customers really do want (관계부사): 장소나 상황을 나타내는 선행사 situations를 수식하는 관계부사 where가 이끄는 완전한 절이다.<\/div><div class=\"lec-gr-item\">do want (강조구문): 일반동사 want를 강조하기 위해 조동사 do를 동사 원형 앞에 썼다. &#39;정말로 원하다&#39;라고 해석한다.<\/div><div class=\"lec-gr-item\">keep themselves accessible 5형식(SVOC) 구조: 동사 keep이 목적어(themselves) 뒤에 목적격보어로 형용사(accessible)를 취하여 &#39;목적어를 ~한 상태로 유지하다&#39;라는 의미를 만든다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>매장에서 흔히 쓰는 &quot;도와드릴까요?&quot;라는 인사는 고객을 방어적으로 만들어 판매를 방해하는 최악의 멘트다.<\/li><li>이 질문은 고객을 무능하다고 암시하며, 고객은 반사적으로 도움을 거절하게 된다.<\/li><li>판매자는 고객이 압박감을 느끼지 않고 편안하게 둘러볼 수 있는 환경을 만들어주어야 한다.<\/li><li>대신 구체적인 질문을 던지거나 명함을 건네며 필요할 때 언제든 도울 준비가 되어 있다는 태도를 보이는 것이 효과적이다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">While the phrase &quot;May I help you?&quot; often leads to customer defensiveness and missed sales opportunities, using specific inquiries or providing personal space can foster a comfortable environment that encourages actual purchases.<\/div>\n              <div class=\"lec-final-sum-ko\">&quot;도와드릴까요?&quot;라는 문구는 종종 고객의 방어 태세와 판매 기회 상실로 이어지지만, 구체적인 질문을 하거나 개인적 공간을 제공하는 것은 실제 구매를 유도하는 편안한 환경을 조성할 수 있다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./41_audio/1.mp3","hl":null}],[{"audio":"./41_audio/2.mp3","hl":null}],[{"audio":"./41_audio/3.mp3","hl":null},{"audio":"./41_audio/4.mp3","hl":"stage-0"},{"audio":"./41_audio/5.mp3","hl":"stage-1"},{"audio":"./41_audio/6.mp3","hl":"stage-2"},{"audio":"./41_audio/7.mp3","hl":"stage-3"},{"audio":"./41_audio/8.mp3","hl":"stage-4"}],[{"audio":"./41_audio/9.mp3","hl":null}],[{"audio":"./41_audio/10.mp3","hl":"main"},{"audio":"./41_audio/11.mp3","hl":"meaning"},{"audio":"./41_audio/12.mp3","hl":"grammar"}],[{"audio":"./41_audio/13.mp3","hl":"main"},{"audio":"./41_audio/14.mp3","hl":"meaning"},{"audio":"./41_audio/15.mp3","hl":"grammar"}],[{"audio":"./41_audio/16.mp3","hl":"main"},{"audio":"./41_audio/17.mp3","hl":"meaning"},{"audio":"./41_audio/18.mp3","hl":"grammar"}],[{"audio":"./41_audio/19.mp3","hl":"main"},{"audio":"./41_audio/20.mp3","hl":"meaning"},{"audio":"./41_audio/21.mp3","hl":"grammar"}],[{"audio":"./41_audio/22.mp3","hl":"main"},{"audio":"./41_audio/23.mp3","hl":"meaning"},{"audio":"./41_audio/24.mp3","hl":"grammar"}],[{"audio":"./41_audio/25.mp3","hl":"main"},{"audio":"./41_audio/26.mp3","hl":"meaning"},{"audio":"./41_audio/27.mp3","hl":"grammar"}],[{"audio":"./41_audio/28.mp3","hl":"main"},{"audio":"./41_audio/29.mp3","hl":"meaning"},{"audio":"./41_audio/30.mp3","hl":"grammar"}],[{"audio":"./41_audio/31.mp3","hl":"main"},{"audio":"./41_audio/32.mp3","hl":"meaning"},{"audio":"./41_audio/33.mp3","hl":"grammar"}],[{"audio":"./41_audio/34.mp3","hl":"main"},{"audio":"./41_audio/35.mp3","hl":"meaning"},{"audio":"./41_audio/36.mp3","hl":"grammar"}],[{"audio":"./41_audio/37.mp3","hl":"main"},{"audio":"./41_audio/38.mp3","hl":"meaning"},{"audio":"./41_audio/39.mp3","hl":"grammar"}],[{"audio":"./41_audio/40.mp3","hl":"main"},{"audio":"./41_audio/41.mp3","hl":"meaning"},{"audio":"./41_audio/42.mp3","hl":"grammar"}],[{"audio":"./41_audio/43.mp3","hl":"main"},{"audio":"./41_audio/44.mp3","hl":"meaning"},{"audio":"./41_audio/45.mp3","hl":"grammar"}],[{"audio":"./41_audio/46.mp3","hl":"main"},{"audio":"./41_audio/47.mp3","hl":"meaning"},{"audio":"./41_audio/48.mp3","hl":"grammar"}],[{"audio":"./41_audio/49.mp3","hl":"main"},{"audio":"./41_audio/50.mp3","hl":"meaning"},{"audio":"./41_audio/51.mp3","hl":"grammar"}],[{"audio":"./41_audio/52.mp3","hl":null}]],"fileName":"EBS올림포스(연합기출)고1 2026년 19강 01-02번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"EBS올림포스(연합기출)고1 2026년 19강 01-02번","titleEn":"Stop Saying \"May I Help You?\": Better Ways to Connect with Customers","titleKo":"\"도와드릴까요?\"라고 말하지 마라: 고객과 소통하는 더 나은 방법들","imageUrl":"__enpImg__","stages":[{"label":"01잘못된 첫인사의 문제점","items":["\"도와드릴까요?\"라는 말은 고객의 대화를 차단하고 방어 기제를 자극한다.","\"May I help you?\"는 판매를 중단시키는 부정적인 반응 유도","고객을 즉각적으로 방어적(defensive)인 태도로 만듦","핵심 키워드: 판매 거래(sales transaction)"]},{"label":"02대안적인 질문의 제시","items":["고객이 구체적으로 대답할 수 있는 열린 질문을 던지는 것이 좋다.","특정한 물건(anything in particular)을 찾는지 질문","선물용 쇼핑(shopping for a gift)인지 확인하는 구체적 접근","고객이 더 많이 말하도록 유도하는 질문 사용"]},{"label":"03질문에 담긴 부정적 함의","items":["기계적인 질문은 판매자의 무관심을 드러내며 고객의 자존감을 건드린다.","훈련되지 않은 판매원의 기계적인 접근(rote approach)으로 인식됨","고객이 구조(rescuing)가 필요한 무능한 상태라는 암시를 줌","무의식적으로 \"내 일은 내가 알아서 한다\"는 반발심 유발"]},{"label":"04편안한 쇼핑 환경 조성","items":["고객이 압박을 느끼지 않고 자유롭게 매장을 둘러볼 수 있어야 한다.","재촉당하지 않는 편안한 환경(comfortable environment) 제공","고객이 압박감(pressured)이나 궁지에 몰린 기분을 느끼지 않게 함","자유롭게 구경하는 것(look around)이 괜찮다는 인상을 줌"]},{"label":"05적절한 거리 유지와 대기","items":["고객이 혼자 있기를 원할 때는 적절한 거리를 유지하며 도움을 준비한다.","고객에게 명함(business cards)을 건네며 전문성 전달","질문이나 우려 사항(concerns)이 생길 때를 대비해 대기","접근 가능한(accessible) 상태를 유지하며 고객의 자율성 존중"]}],"bkg":"매장 판매에서 고객이 점원의 제안을 즉각적으로 거절하는 현상은 심리적 저항(Psychological Reactance) 이론으로 설명할 수 있는데, 이는 자신의 선택이나 행동의 자유가 침해받는다고 느낄 때 이를 회복하려는 본능적인 반응입니다. 특히 \"도와드릴까요?\"와 같은 질문은 고객의 방어 기제(Defense Mechanism)를 자극하여 무의식적으로 반사적 거부(Reflexive No)를 유도하게 되며, 이는 마치 누군가 내 개인적인 공간에 갑자기 침범했을 때 뒷걸음질 치는 것과 비슷한 심리적 원리라고 볼 수 있습니다. 소비자 행동론(Consumer Behavior) 관점에서 보면 고객은 쇼핑 중 자신의 자율성(Autonomy)을 확인받고 싶어 하기에, 점원은 직접적인 도움의 제안보다는 고객의 심리적 문턱을 낮추는 라포 형성(Building Rapport)에 더 집중할 필요가 있습니다. 결국 성공적인 판매는 고객이 '구조'받아야 할 대상이 아니라 스스로 현명한 선택을 내릴 수 있는 존재임을 존중받는다고 느끼는 심리적 안전지대를 구축하는 것에서 시작됩니다.","ttsText":"매장 판매에서 고객이 점원의 제안을 즉각적으로 거절하는 현상은 심리적 저항(Psychological Reactance) 이론으로 설명할 수 있는데, 이는 자신의 선택이나 행동의 자유가 침해받는다고 느낄 때 이를 회복하려는 본능적인 반응입니다. 특히 \"도와드릴까요?\"와 같은 질문은 고객의 방어 기제(Defense Mechanism)를 자극하여 무의식적으로 반사적 거부(Reflexive No)를 유도하게 되며, 이는 마치 누군가 내 개인적인 공간에 갑자기 침범했을 때 뒷걸음질 치는 것과 비슷한 심리적 원리라고 볼 수 있습니다. 소비자 행동론(Consumer Behavior) 관점에서 보면 고객은 쇼핑 중 자신의 자율성(Autonomy)을 확인받고 싶어 하기에, 점원은 직접적인 도움의 제안보다는 고객의 심리적 문턱을 낮추는 라포 형성(Building Rapport)에 더 집중할 필요가 있습니다. 결국 성공적인 판매는 고객이 '구조'받아야 할 대상이 아니라 스스로 현명한 선택을 내릴 수 있는 존재임을 존중받는다고 느끼는 심리적 안전지대를 구축하는 것에서 시작됩니다.","__passage":"EBS올림포스(연합기출)고1 2026년 19강 01-02번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 41-42번","__script":"자, 오늘 우리가 함께 공부할 지문은 'EBS올림포스(연합기출)고1 2026년 19강 01-02번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"EBS올림포스(연합기출)고1 2026년 19강 01-02번","titleEn":"St
