 Sleep Debt<small>아데노신: 피할 수 없는 수면 부채를 추적하는 분자 추적기<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">우리 몸은 깨어 있는 동안 아데노신(Adenosine)이라는 물질을 뇌 속에 차곡차곡 쌓아두는데, 이를 흔히 수면 압력(Sleep Pressure)이라고 부릅니다. 아데노신은 마치 하루 종일 에너지를 소모하며 발생한 &#39;피로 찌꺼기&#39;와 같아서, 일정량 이상 쌓이면 뇌가 더 이상 버티지 못하고 수면 스위치를 강제로 누르게 만듭니다. 만약 잠을 충분히 자지 못해 이 찌꺼기가 다 치워지지 않으면 수면 부채(Sleep Debt)가 발생하게 되며, 이는 나중에 더 긴 잠을 자서라도 반드시 갚아야 하는 생물학적 채무가 됩니다. 이러한 항상성 조절(Homeostatic Regulation) 기제 때문에 인간은 의지만으로는 부족한 수면에 결코 적응할 수 없으며, 빌린 돈에 이자가 붙듯 부족한 잠은 결국 우리 몸의 시스템을 무너뜨리며 휴식을 강요하게 됩니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01수면 욕구의 발생<\/div><ul><li>깨어 있는 시간이 길어질수록 혈액 속에 아데노신이라는 화학 물질이 축적된다.<\/li><li>깨어 있는 시간(time awake)이 늘어나면 아데노신이 쌓임<\/li><li>수면을 유도하는 일상적 동기(daily drive)를 형성함<\/li><li>핵심 물질: 아데노신(adenosine)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02수면을 통한 회복<\/div><ul><li>잠을 자는 동안 신체는 깨어 있을 때 쌓였던 아데노신을 분해한다.<\/li><li>수면 중에 아데노신을 분해(break down)함<\/li><li>분자(molecule)를 통해 부족한 잠을 추적하고 기록함<\/li><li>필요할 때 수면을 유발(trigger)하는 생체 신호로 작용함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03수면 부채의 형성<\/div><ul><li>적정 수면 시간을 채우지 못하면 아데노신이 완전히 해소되지 못하고 누적된다.<\/li><li>아데노신의 비정상적 축적(accumulation) 발생<\/li><li>부족한 잠을 보충해야 하는 수면 부채(sleep debt)의 원인<\/li><li>정상보다 더 오래 자야만 하는 상태가 됨<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04생체 피드백의 한계<\/div><ul><li>신체 내 분자 피드백 시스템 때문에 인간은 수면 부족 상태에 결코 적응할 수 없다.<\/li><li>내장된 분자 피드백(molecular feedback) 기제 작동<\/li><li>적은 수면에 익숙해지는 것(become accustomed)은 불가능함<\/li><li>결국 수면 부족의 결과가 신체에 영향을 미침 (catches up with you)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in order to<\/td><td class=\"m\">~하기 위해<\/td><\/tr><tr><td class=\"w\">squeeze<\/td><td class=\"m\">짜다<\/td><\/tr><tr><td class=\"w\">eventually<\/td><td class=\"m\">결국, 마침내<\/td><\/tr><tr><td class=\"w\">overwhelming<\/td><td class=\"m\">압도적인, 감당하기 어려운<\/td><\/tr><tr><td class=\"w\">force<\/td><td class=\"m\">강요하다<\/td><\/tr><tr><td class=\"w\">drive<\/td><td class=\"m\">운전하다<\/td><\/tr><tr><td class=\"w\">appear<\/td><td class=\"m\">~인 것처럼 보이다<\/td><\/tr><tr><td class=\"w\">due<\/td><td class=\"m\">~하기로 예정된<\/td><\/tr><tr><td class=\"w\">compound<\/td><td class=\"m\">화합물, 혼합물<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">chemical<\/td><td class=\"m\">화학 물질<\/td><\/tr><tr><td class=\"w\">awake<\/td><td class=\"m\">깨어 있는<\/td><\/tr><tr><td class=\"w\">increase<\/td><td class=\"m\">증가하다, 늘리다<\/td><\/tr><tr><td class=\"w\">keep track of<\/td><td class=\"m\">~을 계속 파악하다, 기록해 두다<\/td><\/tr><tr><td class=\"w\">thus<\/td><td class=\"m\">그러므로, 따라서<\/td><\/tr><tr><td class=\"w\">molecule<\/td><td class=\"m\">분자<\/td><\/tr><tr><td class=\"w\">trigger<\/td><td class=\"m\">촉발하다, 일으키다<\/td><\/tr><tr><td class=\"w\">accumulation<\/td><td class=\"m\">축적, 쌓임<\/td><\/tr><tr><td class=\"w\">factor<\/td><td class=\"m\">요인, 요소<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Although you may put off <span class=\"grammar-hl\">going<\/span> to sleep<\/b><\/span><span class=\"ko\">비록 당신은 잠자는 것을 미룰 수 있지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">in order to squeeze<\/span> more activities into your day,<\/b><\/span><span class=\"ko\">더 많은 활동을 당신의 하루에 밀어 넣기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>eventually your need for sleep becomes <span class=\"grammar-hl\">overwhelming<\/span><\/b><\/span><span class=\"ko\">결국 당신의 수면에 대한 필요는 압도적이게 된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and you <span class=\"grammar-hl\">are forced to get<\/span> some sleep.<\/b><\/span><span class=\"ko\">그리고 당신은 어쩔 수 없이 잠을 자게 된다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">비록 당신은 하루에 더 많은 활동을 밀어 넣기 위해 잠자는 것을 미룰 수 있지만, 결국 당신의 수면에 대한 필요는 압도적이게 되고 잠을 잘 수 밖에 없게 된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로, 인간이 의지력으로 수면을 억제하려 해도 결국 생물학적 욕구가 승리한다는 사실을 보여줍니다. squeeze more activities into your day는 바쁜 현대인이 시간을 아껴 쓰기 위해 잠을 줄이는 모습을 묘사하며, overwhelming은 그런 의지조차 꺾어버릴 만큼 강력한 신체적 신호가 온다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">going (동명사): 타동사구 put off(~을 미루다)의 목적어로 쓰여 &#39;~하는 것&#39;이라는 행위를 나타낸다.<\/div><div class=\"lec-gr-item\">in order to squeeze (to부정사(부사적): 목적): &#39;in order to V&#39;의 형태로 &#39;~하기 위하여&#39;라는 목적을 분명하게 나타낸다.<\/div><div class=\"lec-gr-item\">overwhelming (현재분사(형용사)): overwhelming이 보어 자리에서 주어인 your need for sleep의 상태를 수식하며, &#39;압도적인&#39;이라는 능동의 의미를 전달한다.<\/div><div class=\"lec-gr-item\">are forced to get (수동태): be동사(are)+p.p.(forced) 구조. force는 타동사로 force+O+toV(5형식) 구조인데 목적어가 주어로 올라가 수동구조 are forced가 되고, 목적격보어인 toV는 그대로 남았다. 기본구조: force + O + to V<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in order to<\/td><td class=\"m\">~하기 위해<\/td><\/tr><tr><td class=\"w\">squeeze<\/td><td class=\"m\">짜다<\/td><\/tr><tr><td class=\"w\">eventually<\/td><td class=\"m\">결국, 마침내<\/td><\/tr><tr><td class=\"w\">overwhelming<\/td><td class=\"m\">압도적인, 감당하기 어려운<\/td><\/tr><tr><td class=\"w\">force<\/td><td class=\"m\">강요하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This daily drive for sleep<\/b><\/span><span class=\"ko\">이러한 매일의 수면 욕구는<\/spa an class=\"grammar-hl\">what<\/span> your body uses<\/b><\/span><span class=\"ko\">이 분자는 당신의 몸이 사용하는 것일지도 모른다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to keep track of<\/span> <span class=\"grammar-hl\">lost<\/span> sleep<\/b><\/span><span class=\"ko\">놓쳐버린 수면을 추적하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">to trigger<\/span> sleep<\/b><\/span><span class=\"ko\">그리고 수면을 유도하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">when needed<\/span>.<\/b><\/span><span class=\"ko\">필요할 때.<\/span><\/div><\/div><div class=\"lec-sent-ko\">따라서, 이 분자는 당신의 몸이 놓쳐버린 수면을 추적하고 필요할 때 수면을 유도하는 데 사용하는 것일지도 모른다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 축적과 분해의 과정을 종합하여 아데노신의 역할을 결론짓습니다. keep track of lost sleep은 이 물질이 우리 몸 안에서 ‘얼마나 잠이 모자란지’를 기록하는 장부나 계측기 역할을 한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">what (관계대명사): 선행사를 포함한 관계대명사(the thing which)로, uses의 목적어 역할을 하는 명사절을 이끈다.<\/div><div class=\"lec-gr-item\">to keep track of (to부정사(부사적): 목적): &#39;uses (it) to keep track of&#39; 구조로 분석되며, in order to로 바꿔도 뜻이 통하므로 목적(~하기 위해)을 나타낸다.<\/div><div class=\"lec-gr-item\">lost (과거분사(형용사)): lost가 명사 sleep을 수식하여 &#39;손실된(자지 못한) 수면&#39;이라는 수동/완료의 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">to trigger (to부정사(부사적): 목적): 앞의 to keep track of와 and로 병렬 연결되어, 분자가 수행하는 또 다른 목적(~을 유발하기 위해)을 나타낸다.<\/div><div class=\"lec-gr-item\">when needed (분사구문): 접속사 when 뒤에 &#39;주어+be동사&#39;가 생략된 축약절 구조다. when (it is) needed로 복원할 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">keep track of<\/td><td class=\"m\">~을 계속 파악하다, 기록해 두다<\/td><\/tr><tr><td class=\"w\">thus<\/td><td class=\"m\">그러므로, 따라서<\/td><\/tr><tr><td class=\"w\">molecule<\/td><td class=\"m\">분자<\/td><\/tr><tr><td class=\"w\">trigger<\/td><td class=\"m\">촉발하다, 일으키다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>An accumulation of adenosine and other factors<\/b><\/span><span class=\"ko\">아데노신의 축적과 다른 요인들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>might explain <span class=\"grammar-hl\">why<\/span>,<\/b><\/span><span class=\"ko\">왜 그런지 설명할 수도 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>after several nights of less than optimal amounts of sleep,<\/b><\/span><span class=\"ko\">최적의 수면량에 미치지 못한 며칠 밤 후에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you build up a sleep debt<\/b><\/span><span class=\"ko\">당신이 수면 빚을 쌓는지<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> you must <span class=\"grammar-hl\">make up<\/span><\/b><\/span><span class=\"ko\">당신이 반드시 보충해야 하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by <span class=\"grammar-hl\">sleeping<\/span> longer than normal.<\/b><\/span><span class=\"ko\">평소보다 더 오래 잠으로써.<\/span><\/div><\/div><div class=\"lec-sent-ko\">아데노신의 축적과 다른 요인들은 왜 당신이 최적의 수면량에 미치지 못한 며칠 밤 후에 평소보다 더 오래 잠으로써 당신이 보충해야 하는 수면 빚을 쌓는지를 설명할 수도 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 아데노신의 농도 변화를 통해 ‘수면 부채’라는 구체적인 현상을 뒷받침합니다. build up a sleep debt은 부족한 잠이 사라지는 것이 아니라 빚처럼 차곡차곡 쌓여, 결국 나중에 추가적인 잠을 통해서만 해결될 수 있다는 생체 원리를 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">why (간접의문문): 의문사(why) + 주어(you) + 동사(build up) 어순으로 동사 explain의 목적어 역할을 하는 명사절을 이끈다.<\/div><div class=\"lec-gr-item\">that (관계대명사): 선행사 a sleep debt을 수식하며, 관계대명사절 내에서 make up의 목적어 역할을 하는 목적격 관계대명사다.<\/div><div class=\"lec-gr-item\">make up (관용표현): &#39;보충하다, 만회하다&#39;라는 의미의 구동사로, 부족한 부분을 채운다는 맥락에서 쓰였다.<\/div><div class=\"lec-gr-item\">sleeping (동명사): 전치사 by의 목적어로 쓰여 &#39;~함으로써&#39;라는 수단이나 방법을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">accumulation<\/td><td class=\"m\">축적, 쌓임<\/td><\/tr><tr><td class=\"w\">factor<\/td><td class=\"m\">요인, 요소<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Because of such <span class=\"grammar-hl\">built-in<\/span> molecular feedback,<\/b><\/span><span class=\"ko\">이러한 내재된 분자적 피드백 때문에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you can't become accustomed to <span class=\"grammar-hl\">getting<\/span> less sleep<\/b><\/span><span class=\"ko\">당신은 더 적은 잠을 자는 것에 익숙해질 수 없다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than your body needs.<\/b><\/span><span class=\"ko\">당신의 몸이 필요한 것보다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이러한 내재된 분자적 피드백 때문에, 당신은 당신의 몸이 필요한 것보다 더 적은 잠을 자는 것에 익숙해질 수 없다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 인간의 적응력에 한계가 있음을 지적하며, 의지로 수면 부족을 이겨낼 수 없음을 강조합니다. built-in molecular feedback은 우리 몸에 유전적으로 프로그래밍된 시스템이므로, 훈련이나 정신력으로 수면 양을 줄이는 ‘적응’은 불가능하다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">built-in (과거분사(형용사)): built-in이 명사 feedback을 앞에서 수식하여 &#39;내장된&#39; 또는 &#39;타고난&#39;이라는 의미를 전달한다.<\/div><div class=\"lec-gr-item\">getting (동명사): &#39;become accustomed to&#39;(~에 익숙해지다)에서 to가 전치사이므로, 그 목적어로 동사 get의 -ing 형태인 동명사가 쓰였다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Eventually,<\/b><\/span><span class=\"ko\">결국,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a lack of sleep <span class=\"grammar-hl\">catches up with<\/span> you.<\/b><\/span><span class=\"ko\">수면 부족은 당신을 따라잡는다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">결국 수면 부족은 당신을 따라잡는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글 전체를 마무리하며 수면 부족의 필연적인 결과를 경고합니다. catches up with you는 당장은 버티는 것 같아도 결국 그 부작용이나 대가가 건강 악화나 기능 저하의 형태로 반드시 돌아온다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">catches up with (관용표현): &#39;~을 따라잡다&#39; 혹은 &#39;(안 좋은 결과가) 결국 ~에게 미치다&#39;라는 의미의 구동사다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">eventually<\/td><td class=\"m\">결국, 마침내<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>인간은 활동 시간을 늘리려 잠을 미루지만, 결국 생물학적 욕구에 굴복해 잠들게 된다.<\/li><li>졸음의 원인은 깨어 있는 동안 혈액에 쌓이는 ‘아데노신’이라는 물질 때문이다.<\/li><li>수면은 이 물질을 분해하는 과정이며, 아데노신은 신체의 수면 부족 상태를 기록하는 역할을 한다.<\/li><li>부족한 잠은 &#39;수면 부채&#39;로 쌓이며, 우리 몸은 이에 적응하지 못하고 결국 대가를 치르게 된다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Adenosine builds up during wakefulness to monitor sleep loss, so the body is forced to pay back the resulting sleep debt.<\/div>\n              <div class=\"lec-final-sum-ko\">아데노신이 수면 부족을 감시하기 위해 깨어 있는 동안 축적되기에, 신체는 그 결과로 발생하는 수면 부채를 갚을 수밖에 없다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./32_audio/1.mp3","hl":null}],[{"audio":"./32_audio/2.mp3","hl":null}],[{"audio":"./32_audio/3.mp3","hl":null},{"audio":"./32_audio/4.mp3","hl":"stage-0"},{"audio":"./32_audio/5.mp3","hl":"stage-1"},{"audio":"./32_audio/6.mp3","hl":"stage-2"},{"audio":"./32_audio/7.mp3","hl":"stage-3"}],[{"audio":"./32_audio/8.mp3","hl":null}],[{"audio":"./32_audio/9.mp3","hl":"main"},{"audio":"./32_audio/10.mp3","hl":"meaning"},{"audio":"./32_audio/11.mp3","hl":"grammar"}],[{"audio":"./32_audio/12.mp3","hl":"main"},{"audio":"./32_audio/13.mp3","hl":"meaning"},{"audio":"./32_audio/14.mp3","hl":"grammar"}],[{"audio":"./32_audio/15.mp3","hl":"main"},{"audio":"./32_audio/16.mp3","hl":"meaning"},{"audio":"./32_audio/17.mp3","hl":"grammar"}],[{"audio":"./32_audio/18.mp3","hl":"main"},{"audio":"./32_audio/19.mp3","hl":"meaning"},{"audio":"./32_audio/20.mp3","hl":"grammar"}],[{"audio":"./32_audio/21.mp3","hl":"main"},{"audio":"./32_audio/22.mp3","hl":"meaning"},{"audio":"./32_audio/23.mp3","hl":"grammar"}],[{"audio":"./32_audio/24.mp3","hl":"main"},{"audio":"./32_audio/25.mp3","hl":"meaning"},{"audio":"./32_audio/26.mp3","hl":"grammar"}],[{"audio":"./32_audio/27.mp3","hl":"main"},{"audio":"./32_audio/28.mp3","hl":"meaning"},{"audio":"./32_audio/29.mp3","hl":"grammar"}],[{"audio":"./32_audio/30.mp3","hl":"main"},{"audio":"./32_audio/31.mp3","hl":"meaning"},{"audio":"./32_audio/32.mp3","hl":"grammar"}],[{"audio":"./32_audio/33.mp3","hl":null}]],"fileName":"모의고사_고1_2025년_09월_32번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 09월 / 32번","titleEn":"Adenosine: The Molecular Tracker for Your Inevitable Sleep Debt","titleKo":"아데노신: 피할 수 없는 수면 부채를 추적하는 분자 추적기","imageUrl":"__enpImg__","stages":[{"label":"01수면 욕구의 발생","items":["깨어 있는 시간이 길어질수록 혈액 속에 아데노신이라는 화학 물질이 축적된다.","깨어 있는 시간(time awake)이 늘어나면 아데노신이 쌓임","수면을 유도하는 일상적 동기(daily drive)를 형성함","핵심 물질: 아데노신(adenosine)"]},{"label":"02수면을 통한 회복","items":["잠을 자는 동안 신체는 깨어 있을 때 쌓였던 아데노신을 분해한다.","수면 중에 아데노신을 분해(break down)함","분자(molecule)를 통해 부족한 잠을 추적하고 기록함","필요할 때 수면을 유발(trigger)하는 생체 신호로 작용함"]},{"label":"03수면 부채의 형성","items":["적정 수면 시간을 채우지 못하면 아데노신이 완전히 해소되지 못하고 누적된다.","아데노신의 비정상적 축적(accumulation) 발생","부족한 잠을 보충해야 하는 수면 부채
