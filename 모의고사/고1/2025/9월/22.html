T3/AMf/AK49RR/X9f1/mL9O33269N+4tGP8/SkJA5Jo3AEAkDPTkc9P554oGHfH4/5/p+PpSMflJHoce/Hrz+f64pcgcZ65x07f4fie54Bwh4Q7ecKSB1ycH8+aA/P+v8z/2Q==\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">Gardening: A Holistic Approach to Physical and Mental Health<small>원예: 신체 및 정신 건강을 위한 총체적 접근법<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">식물을 가꾸며 몸과 마음을 치유하는 원예 치료(Horticultural Therapy)는 오래전부터 그 효과를 인정받아 온 분야로, 단순히 꽃을 심는 일을 넘어 신체와 정신의 건강을 동시에 챙기는 통합적 접근(Holistic Approach)을 강조합니다. 정원 가꾸기는 관절에 무리가 덜 가면서도 전신 근육을 고루 사용하는 저강도 운동(Low-impact Exercise)의 일종이라, 헬스장에서의 격렬한 운동이 부담스러운 분들도 일상 속에서 자연스럽게 체력을 기르기에 아주 효과적이지요. 또한 인간이 본능적으로 자연에 끌리는 성향인 바이오필리아(Biophilia) 가설에 따르면, 흙을 만지고 생명의 성장을 지켜보는 행위는 뇌의 스트레스 호르몬(Cortisol) 수치를 낮추고 깊은 정서적 안정감을 줍니다. 마치 복잡한 생각을 비우고 현재에 집중하는 마음챙김(Mindfulness) 명상처럼, 정원 일은 바쁜 현대인들이 자연이라는 거울을 통해 스스로의 마음을 돌보는 소중한 통로가 되어줍니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01다양한 신체 활동<\/div><ul><li>원예는 땅을 파고 심는 등의 다양한 동작을 포함하는 훌륭한 신체 활동이다.<\/li><li>굴착, 심기, 물 주기, 수확(digging, planting, watering, harvesting) 등 여러 동작 포함<\/li><li>근력, 유연성, 지구력(strength, flexibility, endurance) 향상에 도움<\/li><li>잡초 뽑기나 퇴비 섞기 같은 작은 작업으로도 많은 칼로리 소모<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02낮은 강도의 운동 효과<\/div><ul><li>원예는 신체적 제약이 있는 사람들도 쉽게 접근할 수 있는 운동이다.<\/li><li>전통적인 운동이 힘든 사람들에게 특히 유익함<\/li><li>신체에 무리가 적은 저강도 방식(low-impact way)으로 활동 유지 가능<\/li><li>모든 연령대와 신체 능력을 가진 사람들에게 적합함(accessible)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03심리적 안정과 마음챙김<\/div><ul><li>식물을 가꾸는 행위는 마음을 진정시키고 현재에 집중하게 돕는다.<\/li><li>식물을 돌보는 행위는 매우 차분하고 명상적임(calming and meditative)<\/li><li>현재 순간에 집중하게 하여 스트레스와 불안(stress and anxiety)을 줄여줌<\/li><li>반복적인 작업을 통해 마음챙김(mindfulness) 상태 유도<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04정서적 개선과 성취감<\/div><ul><li>자연 속에서의 시간은 정서적 건강을 증진하고 자존감을 높여준다.<\/li><li>기분 개선 및 인지 능력 향상, 우울 증상(depression symptoms) 완화<\/li><li>식물이 자라는 것을 보며 느끼는 성취감(sense of accomplishment)<\/li><li>전반적인 행복감과 자존감(self-esteem) 향상에 기여<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">form<\/td><td class=\"m\">형태, 종류<\/td><\/tr><tr><td class=\"w\">physical<\/td><td class=\"m\">신체의, 물리적인<\/td><\/tr><tr><td class=\"w\">involve<\/td><td class=\"m\">포함하다, 수반하다<\/td><\/tr><tr><td class=\"w\">range<\/td><td class=\"m\">범위<\/td><\/tr><tr><td class=\"w\">motion<\/td><td class=\"m\">움직임, 동작<\/td><\/tr><tr><td class=\"w\">dig<\/td><td class=\"m\">파다<\/td><\/tr><tr><td class=\"w\">harvest<\/td><td class=\"m\">수확하다, 거두다<\/td><\/tr><tr><td class=\"w\">improve<\/td><td class=\"m\">나아지게 하다, 향상시키다<\/td><\/tr><tr><td class=\"w\">strength<\/td><td class=\"m\">힘, 강점<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flexibility<\/td><td class=\"m\">유연성, 융통성<\/td><\/tr><tr><td class=\"w\">endurance<\/td><td class=\"m\">인내(력), 지구력, 인내<\/td><\/tr><tr><td class=\"w\">realize<\/td><td class=\"m\">깨닫다<\/td><\/tr><tr><td class=\"w\">weed<\/td><td class=\"m\">잡초<\/td><\/tr><tr><td class=\"w\">compost<\/td><td class=\"m\">혼합물, 퇴비<\/td><\/tr><tr><td class=\"w\">particularly<\/td><td class=\"m\">특히, 특별히<\/td><\/tr><tr><td class=\"w\">beneficial<\/td><td class=\"m\">이로운, 도움이 되는<\/td><\/tr><tr><td class=\"w\">exercise<\/td><td class=\"m\">운동<\/td><\/tr><tr><td class=\"w\">challenging<\/td><td class=\"m\">힘든, 어려운<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The act of <span class=\"grammar-hl\">gardening<\/span> itself<\/b><\/span><span class=\"ko\">원예 행위 그 자체는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is a fantastic form of physical activity.<\/b><\/span><span class=\"ko\">신체 활동의 환상적인 형태이다<\/span><\/div><\/div><div class=\"lec-sent-ko\">원예 행위 그 자체는 신체 활동의 환상적인 형태이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 문장은 글의 도입부로, 원예가 단순한 취미를 넘어 건강을 위한 운동으로서 가치가 있음을 제시합니다. The act of gardening itself는 식물을 가꾸기 위해 몸을 움직이는 모든 과정이 실질적인 운동 효과를 낸다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">gardening (동명사): 전치사 of의 목적어 역할로 쓰여 &#39;~하는 것(원예)&#39;이라는 명사적 의미를 나타냄<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">form<\/td><td class=\"m\">형태, 종류<\/td><\/tr><tr><td class=\"w\">physical<\/td><td class=\"m\">신체의, 물리적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>It<\/b><\/span><span class=\"ko\">그것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>involves a range of motions,<\/b><\/span><span class=\"ko\">다양한 움직임을 포함한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from <span class=\"grammar-hl\">digging and planting<\/span><\/b><\/span><span class=\"ko\">파기와 심기에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to <span class=\"grammar-hl\">watering and harvesting<\/span>.<\/b><\/span><span class=\"ko\">물 주기와 수확하기까지<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것은 파기와 심기에서 물 주기와 수확하기까지 이르는 다양한 움직임을 포함한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 &#39;신체 활동&#39;의 구체적인 예시를 나열합니다. a range of motions는 팔, 다리, 허리 등 전신의 근육을 골고루 사용하는 다양한 움직임이 원예 과정에 녹아있음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">digging and planting (동명사): 전치사 from의 목적어 역할로 쓰인 병렬 구조<\/div><div class=\"lec-gr-item\">watering and harvesting (동명사): 전치사 to의 목적어 역할로 쓰인 병렬 구조<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">involve<\/td><td class=\"m\">포함하다, 수반하다<\/td><\/tr><tr><td class=\"w\">range<\/td><td class=\"m\">범위<\/td><\/tr><tr><td class=\"w\">motion<\/td><td class=\"m\">움직임, 동작<\/td><\/tr><tr><td class=\"w\">dig<\/td><td class=\"m\">파다<\/td><\/tr><tr><td class=\"w\">harvest<\/td><td class=\"m\">수확하다, 거두다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>These activities<\/b><\/span><span class=\"ko\">이런 활동들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">help improve<\/span> strength, flexibility, and endurance.<\/b><\/span><span class=\"ko\">강인함, 유연성과 내구력을 향상시키는 것을 돕는다<\/span><\/div><\/div><div class=\"lec-sent-ko\">이런 활동들은 강인함, 유연성과 내구력을 향상시키는 것을 돕는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 원예의 구체적인 동작들이 신체에 미치는 긍정적인 결과를 설명합니다. improve strength, flexibility, and endurance는 흙을 만지고 물을 나르는 일상적인 동작들이 체력을 단련하는 체계적인 운동과 같은 역할을 한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">help improve (관용표현): help는 목적어로 to부정사나 동사원형을 모두 취할 수 있는 동사로, 여기서는 동사원형(improve)이 쓰임<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">improve<\/td><td class=\"m\">나아지게 하다, 향상시키다<\/td><\/tr><tr><td class=\"w\">strength<\/td><td class=\"m\">힘, 강점<\/td><\/tr><tr><td class=\"w\">flexibility<\/td><td class=\"m\">유연성, 융통성<\/td><\/tr><tr><td class=\"w\">endurance<\/td><td class=\"m\">인내(력), 지구력, 인내<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>You<\/b><\/span><span class=\"ko\">당신은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>might not realize it,<\/b><\/span><span class=\"ko\">그것을 인식하지 못할 수도 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but small tasks<\/b><\/span><span class=\"ko\">그러나 작은 과업들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>like <span class=\"grammar-hl\">weeding or turning<\/span> compost<\/b><\/span><span class=\"ko\">잡초 뽑기나 퇴비 뒤섞기와 같은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can burn many calories.<\/b><\/span><span class=\"ko\">많은 칼로리를 태울 수 있다<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신은 그것을 인식하지 못할 수도 있으나 잡초 뽑기나 퇴비 뒤섞기와 같은 작은 과업들은 많은 칼로리를 태울 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 사람들이 가볍게 여기기 쉬운 사소한 작업의 운동 효과를 강조합니다. turning compost는 무거운 흙과 비료를 뒤섞는 노동이기에 헬스장에서 기구를 사용하는 것만큼이나 에너지가 많이 소모된다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">weeding or turning (동명사): 전치사 like의 목적어 역할로 쓰인 병렬 구조<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">realize<\/td><td class=\"m\">깨닫다<\/td><\/tr><tr><td class=\"w\">weed<\/td><td class=\"m\">잡초<\/td><\/tr><tr><td class=\"w\">compost<\/td><td class=\"m\">혼합물, 퇴비<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Gardening<\/span><\/b><\/span><span class=\"ko\">원예는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is particularly beneficial<\/b><\/span><span class=\"ko\">특히 이롭다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for those<\/b><\/span><span class=\"ko\">사람들에게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who<\/span> <span class=\"grammar-hl\">find traditional exercise challenging<\/span>.<\/b><\/span><span class=\"ko\">전통적 운동이 힘들다고 생각하는<\/span><\/div><\/div><div class=\"lec-sent-ko\">원예는 특히 전통적 운동이 힘들다고 생각하는 사람들에게 이롭다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 원예가 운동으로서 갖는 상대적인 장점을 언급하며 적용 대상을 확장합니다. traditional exercise는 헬스나 달리기처럼 오직 운동만을 목적으로 하는 활동을 가리키며, 이런 활동에 거부감을 느끼는 사람들에게 원예가 좋은 대안이 됨을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Gardening (동명사): 문장의 주어 역할로 쓰임<\/div><div class=\"lec-gr-item\">who (관계대명사): 주격 관계대명사로 선행사 those를 수식하며, 뒤에 주어가 빠진 불완전한 절이 이어짐<\/div><div class=\"lec-gr-item\">find traditional exercise challenging 5형식(SVOC) 구조: find(동사) + traditional exercise(목적어) + challenging(목적격보어/형용사)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">particularly<\/td><td class=\"m\">특히, 특별히<\/td><\/tr><tr><td class=\"w\">beneficial<\/td><td class=\"m\">이로운, 도움이 되는<\/td><\/tr><tr><td class=\"w\">exercise<\/td><td class=\"m\">운동<\/td><\/tr><tr><td class=\"w\">challenging<\/td><td class=\"m\">힘든, 어려운<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>It's a low-impact way<\/b><\/span><span class=\"ko\">그것은 부담을 주지 않는 방법이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to stay<\/span> active and fit,<\/b><\/span><span class=\"ko\">활동적이고 건강하게 유지하기 위한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">making it accessible<\/span><\/b><\/span><span class=\"ko\">그것을 접근 가능하게 만들면서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for people<\/b><\/span><span class=\"ko\">사람들에게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of all ages and physical abilities.<\/b><\/span><span class=\"ko\">모든 연령대 및 신체 능력의<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것은 활동적이고 건강하게 유지하기에 부담을 주지 않는 방법이어서 모든 연령대 및 신체 능력을 지닌 사람들이 접근할 수 있게 만든다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 원예의 운동 강도와 접근성을 설명하여 앞 문장의 이유를 뒷받침합니다. low-impact way는 관절이나 뼈에 무리한 충격을 주지 않으면서도 꾸준히 신체를 움직일 수 있는 안전한 방식이라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to stay (to부정사(형용사적)): 명사 way를 수식함. way/ability + to V 구조에서 &#39;~할/~하기 위한&#39;의 의미로 쓰임<\/div><div class=\"lec-gr-item\">making (분사구문): 앞 문장 전체의 내용을 부연 설명하거나 그 결과를 나타냄. 원래 절 변환: and + it + makes ...<\/div><div class=\"lec-gr-item\">making it accessible 5형식(SVOC) 구조: make(동사) + it(목적어) + accessible(목적격보어/형용사)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">physical<\/td><td class=\"m\">신체의, 물리적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Besides physical health,<\/b><\/span><span class=\"ko\">신체적 건강 외에도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">gardening<\/span><\/b><\/span><span class=\"ko\">원예는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>has profound mental health benefits.<\/b><\/span><span class=\"ko\">충분한 정신적 건강 이점이 있다<\/span><\/div><\/div><div class=\"lec-sent-ko\">신체적 건강 외에도, 원예는 충분한 정신적 건강 이점이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 초점이 신체적 측면에서 정신적 측면으로 전환되는 문장입니다. profound mental health benefits는 식물을 돌보는 행위가 인간의 내면과 심리에 매우 깊고 근본적인 긍정적 변화를 이끌어낸다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">gardening (동명사): 문장의 주어 역할로 쓰임<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">physical<\/td><td class=\"m\">신체의, 물리적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Tending<\/span> to plants<\/b><\/span><span class=\"ko\">식물을 돌보는 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can be incredibly <span class=\"grammar-hl\">calming<\/span> and meditative.<\/b><\/span><span class=\"ko\">믿을 수 없을 정도로 고요하고 명상적일 수 있다<\/span><\/div><\/div><div class=\"lec-sent-ko\">식물을 돌보는 것은 믿을 수 없을 정도로 고요하고 명상적일 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 정서적 이점의 첫 번째 특징으로 평온함을 꼽습니다. Tending to plants는 살아있는 생명을 세심하게 살피는 과정 속에서 요동치던 감정이 차분하게 가라앉는 심리적 효과를 얻게 된다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Tending (동명사): 문장의 주어 역할로 쓰여 &#39;~하는 것(돌보는 것)&#39;이라는 의미를 나타냄<\/div><div class=\"lec-gr-item\">calming (현재분사(형용사)): 주어의 상태를 설명하는 보어 역할로 쓰여 &#39;차분하게 만드는&#39;이라는 능동의 의미를 전달함<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 9 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>It<\/b><\/span><span class=\"ko\">그것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">allows you<\/span><\/b><\/span><span class=\"ko\">당신이 하게 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to focus<\/span> on the present moment,<\/b><\/span><span class=\"ko\">현재 순간에 집중하도록<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">reducing<\/span> stress and anxiety.<\/b><\/span><span class=\"ko\">스트레스와 불안감을 줄이면서<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것은 당신이 현재 순간에 집중하게 하면서 스트레스와 불안감을 줄인다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 원예가 어떻게 심리적 안정을 주는지 그 원리를 설명합니다. focus on the present moment는 과거에 대한 후회나 미래에 대한 걱정에서 벗어나 지금 눈앞의 흙과 식물에만 몰입하게 된다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">allows you to focus 5형식(SVOC) 구조: allow(동사) + you(목적어) + to focus(목적격보어)<\/div><div class=\"lec-gr-item\">to focus (목적격보어(to부정사)): allow + O + to V 구조에서 목적어의 동작을 설명하는 목적격 보어로 쓰임<\/div><div class=\"lec-gr-item\">reducing (분사구문): 주절의 주어(It)가 하는 동작에 수반되는 결과를 나타냄. 원래 절 변환: and + it + reduces ...<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 10 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The repetitive tasks <span class=\"grammar-hl\">involved<\/span> in <span class=\"grammar-hl\">gardening<\/span><\/b><\/span><span class=\"ko\">원예와 관련한 반복적인 과업은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can induce a state of mindfulness, similar to meditation.<\/b><\/span><span class=\"ko\">마음 돌봄의 상태를 유도할 수 있다, 명상과 유사한<\/span><\/div><\/div><div class=\"lec-sent-ko\">원예와 관련한 반복적인 과업은 명상과 유사한 마음 돌봄의 상태를 유도한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 &#39;집중&#39; 상태를 &#39;마음챙김&#39;이라는 개념으로 심화 설명합니다. induce a state of mindfulness는 단순하고 반복적인 호미질이나 물주기 동작이 뇌의 복잡한 생각 회로를 멈추고 고요한 집중 상태로 이끈다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">involved (과거분사(형용사)): involved가 tasks를 수식함(= &#39;관련된 작업들&#39;). tasks that are involved in... 형태의 축약 관계절 구조임<\/div><div class=\"lec-gr-item\">gardening (동명사): 전치사 in의 목적어 역할로 쓰임<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">involve<\/td><td class=\"m\">포함하다, 수반하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 11 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Studies<\/b><\/span><span class=\"ko\">연구는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>have shown<\/b><\/span><span class=\"ko\">보여왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that <span class=\"grammar-hl\">spending<\/span> time<\/b><\/span><span class=\"ko\">시간을 보내는 것이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in nature,<\/b><\/span><span class=\"ko\">자연에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>even in a small garden,<\/b><\/span><span class=\"ko\">심지어 작은 정원에서라도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can elevate mood,<\/b><\/span><span class=\"ko\">기분을 돋울 수 있고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>improve cognition,<\/b><\/span><span class=\"ko\">인지를 개선하며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and reduce depression symptoms.<\/b><\/span><span class=\"ko\">우울 증상을 줄일 수 있음을<\/span><\/div><\/div><div class=\"lec-sent-ko\">연구는 심지어 작은 정원이더라도 자연에서 시간을 보내는 것이 기분을 돋우고, 인지를 개선하며, 우울 증상을 줄일 수 있음을 보여왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 주관적인 느낌을 넘어 객관적인 연구 결과를 통해 원예의 효과를 입증합니다. elevate mood, improve cognition은 녹색 식물을 접하는 것만으로도 뇌 기능이 활성화되고 우울한 감정에서 벗어날 수 있는 과학적 근거가 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">spending (동명사): that절 내부의 주어 역할로 쓰임<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">improve<\/td><td class=\"m\">나아지게 하다, 향상시키다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 12 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The sense of accomplishment<\/b><\/span><span class=\"ko\">성취감은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from <span class=\"grammar-hl\">watching your plants grow and thrive<\/span><\/b><\/span><span class=\"ko\">당신의 식물들이 성장하고 잘 자라는 것을 지켜본 것에서 온<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can also boost self-esteem and overall well-being.<\/b><\/span><span class=\"ko\">또한 자아존중감과 전반적 행복을 높일 수 있다<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신의 식물들이 성장하고 잘 자라는 것을 지켜본 것에서 온 성취감은 또한 자아존중감과 전반적 행복을 높일 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 원예의 심리적 이점에 대한 결론이자 글의 마무리입니다. watching your plants grow and thrive는 자신의 보살핌으로 생명이 결실을 맺는 과정을 보며 스스로의 가치를 확인하고 삶의 질을 높이게 된다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">watching (동명사): 전치사 from의 목적어 역할로 쓰임<\/div><div class=\"lec-gr-item\">watching your plants grow and thrive 5형식(SVOC) 구조: 지각동사 watch(동사) + your plants(목적어) + grow and thrive(목적격보어/동사원형). 지각동사는 목적격보어로 동사원형을 취할 수 있음<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>원예는 땅 파기, 물 주기 등 전신 근육을 사용하는 훌륭한 신체 활동이다.<\/li><li>격한 운동이 부담스러운 사람들도 안전하게 칼로리를 소모할 수 있는 낮은 강도의 운동이다.<\/li><li>신체뿐만 아니라 현재에 집중하게 함으로써 스트레스를 줄이는 명상 효과가 있다.<\/li><li>자연 속에서의 활동은 우울감을 낮추고, 식물을 키워내는 성취감은 자존감을 높여준다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Gardening promotes physical fitness through various low-impact movements while enhancing mental health by fostering mindfulness and a sense of accomplishment.<\/div>\n              <div class=\"lec-final-sum-ko\">원예는 다양한 저강도 동작을 통해 신체적 건강을 증진하는 동시에 마음챙김과 성취감을 길러 정신 건강을 강화한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./22_audio/1.mp3","hl":null}],[{"audio":"./22_audio/2.mp3","hl":null}],[{"audio":"./22_audio/3.mp3","hl":null},{"audio":"./22_audio/4.mp3","hl":"stage-0"},{"audio":"./22_audio/5.mp3","hl":"stage-1"},{"audio":"./22_audio/6.mp3","hl":"stage-2"},{"audio":"./22_audio/7.mp3","hl":"stage-3"}],[{"audio":"./22_audio/8.mp3","hl":null}],[{"audio":"./22_audio/9.mp3","hl":"main"},{"audio":"./22_audio/10.mp3","hl":"meaning"},{"audio":"./22_audio/11.mp3","hl":"grammar"}],[{"audio":"./22_audio/12.mp3","hl":"main"},{"audio":"./22_audio/13.mp3","hl":"meaning"},{"audio":"./22_audio/14.mp3","hl":"grammar"}],[{"audio":"./22_audio/15.mp3","hl":"main"},{"audio":"./22_audio/16.mp3","hl":"meaning"},{"audio":"./22_audio/17.mp3","hl":"grammar"}],[{"audio":"./22_audio/18.mp3","hl":"main"},{"audio":"./22_audio/19.mp3","hl":"meaning"},{"audio":"./22_audio/20.mp3","hl":"grammar"}],[{"audio":"./22_audio/21.mp3","hl":"main"},{"audio":"./22_audio/22.mp3","hl":"meaning"},{"audio":"./22_audio/23.mp3","hl":"grammar"}],[{"audio":"./22_audio/24.mp3","hl":"main"},{"audio":"./22_audio/25.mp3","hl":"meaning"},{"audio":"./22_audio/26.mp3","hl":"grammar"}],[{"audio":"./22_audio/27.mp3","hl":"main"},{"audio":"./22_audio/28.mp3","hl":"meaning"},{"audio":"./22_audio/29.mp3","hl":"grammar"}],[{"audio":"./22_audio/30.mp3","hl":"main"},{"audio":"./22_audio/31.mp3","hl":"meaning"},{"audio":"./22_audio/32.mp3","hl":"grammar"}],[{"audio":"./22_audio/33.mp3","hl":"main"},{"audio":"./22_audio/34.mp3","hl":"meaning"},{"audio":"./22_audio/35.mp3","hl":"grammar"}],[{"audio":"./22_audio/36.mp3","hl":"main"},{"audio":"./22_audio/37.mp3","hl":"meaning"},{"audio":"./22_audio/38.mp3","hl":"grammar"}],[{"audio":"./22_audio/39.mp3","hl":"main"},{"audio":"./22_audio/40.mp3","hl":"meaning"},{"audio":"./22_audio/41.mp3","hl":"grammar"}],[{"audio":"./22_audio/42.mp3","hl":"main"},{"audio":"./22_audio/43.mp3","hl":"meaning"},{"audio":"./22_audio/44.mp3","hl":"grammar"}],[{"audio":"./22_audio/45.mp3","hl":null}]],"fileName":"EBS올림포스(연합기출)고1 2026년 05강 01번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"EBS올림포스(연합기출)고1 2026년 05강 01번","titleEn":"Gardening: A Holistic Approach to Physical and Mental Health","titleKo":"원예: 신체 및 정신 건강을 위한 총체적 접근법","imageUrl":"__enpImg__","stages":[{"label":"01다양한 신체 활동","items":["원예는 땅을 파고 심는 등의 다양한 동작을 포함하는 훌륭한 신체 활동이다.","굴착, 심기, 물 주기, 수확(digging, planting, watering, harvesting) 등 여러 동작 포함","근력, 유연성, 지구력(strength, flexibility, endurance) 향상에 도움","잡초 뽑기나 퇴비 섞기 같은 작은 작업으로도 많은 칼로리 소모"]},{"label":"02낮은 강도의 운동 효과","items":["원예는 신체적 제약이 있는 사람들도 쉽게 접근할 수 있는 운동이다.","전통적인 운동이 힘든 사람들에게 특히 유익함","신체에 무리가 적은 저강도 방식(low-impact way)으로 활동 유지 가능","모든 연령대와 신체 능력을 가진 사람들에게 적합함(accessible)"]},{"label":"03심리적 안정과 마음챙김","items":["식물을 가꾸는 행위는 마음을 진정시키고 현재에 집중하게 돕는다.","식물을 돌보는 행위는 매우 차분하고 명상적임(calming and meditative)","현재 순간에 집중하게 하여 스트레스와 불안(stress and anxiety)을 줄여줌","반복적인 작업을 통해 마음챙김(mindfulness) 상태 유도"]},{"label":"04정서적 개선과 성취감","items":["자연 속에서의 시간은 정서적 건강을 증진하고 자존감을 높여준다.","기분 개선 및 인지 능력 향상, 우울 증상(depression symptoms) 완화","식물이 자라는 것을 보며 느끼는 성취감(sense of accomplishment)","전반적인 행복감과 자존감(self-esteem) 향상에 기여"]}],"bkg":"식물을 가꾸며 몸과 마음을 치유하는 원예 치료(Horticultural Therapy)는 오래전부터 그 효과를 인정받아 온 분야로, 단순히 꽃을 심는 일을 넘어 신체와 정신의 건강을 동시에 챙기는 통합적 접근(Holistic Approach)을 강조합니다. 정원 가꾸기는 관절에 무리가 덜 가면서도 전신 근육을 고루 사용하는 저강도 운동(Low-impact Exercise)의 일종이라, 헬스장에서의 격렬한 운동이 부담스러운 분들도 일상 속에서 자연스럽게 체력을 기르기에 아주 효과적이지요. 또한 인간이 본능적으로 자연에 끌리는 성향인 바이오필리아(Biophilia) 가설에 따르면, 흙을 만지고 생명의 성장을 지켜보는 행위는 뇌의 스트레스 호르몬(Cortisol) 수치를 낮추고 깊은 정서적 안정감을 줍니다. 마치 복잡한 생각을 비우고 현재에 집중하는 마음챙김(Mindfulness) 명상처럼, 정원 일은 바쁜 현대인들이 자연이라는 거울을 통해 스스로의 마음을 돌보는 소중한 통로가 되어줍니다.","ttsText":"식물을 가꾸며 몸과 마음을 치유하는 원예 치료(Horticultural Therapy)는 오래전부터 그 효과를 인정받아 온 분야로, 단순히 꽃을 심는 일을 넘어 신체와 정신의 건강을 동시에 챙기는 통합적 접근(Holistic Approach)을 강조합니다. 정원 가꾸기는 관절에 무리가 덜 가면서도 전신 근육을 고루 사용하는 저강도 운동(Low-impact Exercise)의 일종이라, 헬스장에서의 격렬한 운동이 부담스러운 분들도 일상 속에서 자연스럽게 체력을 기르기에 아주 효과적이지요. 또한 인간이 본능적으로 자연에 끌리는 성향인 바이오필리아(Biophilia) 가설에 따르면, 흙을 만지고 생명의 성장을 지켜보는 행위는 뇌의 스트레스 호르몬(Cortisol) 수치를 낮추고 깊은 정서적 안정감을 줍니다. 마치 복잡한 생각을 비우고 현재에 집중하는 마음챙김(Mindfulness) 명상처럼, 정원 일은 바쁜 현대인들이 자연이라는 거울을 통해 스스로의 마음을 돌보는 소중한 통로가 되어줍니다.","__passage":"EBS올림포스(연합기출)고1 2026년 05강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 22번","__script":"자, 오늘 우리가 함께 공부할 지문은 'EBS올림포스(연합기출)고1 2026년 05강 01번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"EBS올림포스(연합기출)고1 2026년 05강 01번","titleEn":"Gardening: A Holistic Approach to Physical and Mental Health","titleKo":"원예: 신체 및 정신 건강을 위한 총체적 접근법","imageUrl":"__enpImg__","stages":[{"label":"01다양한 신체 활동","items":["원예는 땅을 파고 심는 등의 다양한 동작을 포함하는 훌륭한 신체 활동이다.","굴착, 심기, 물 주기, 수확(digging, planting, watering, harvesting) 등 여러 동작 포함","근력, 유연성, 지구력(strength, flexibility, endurance) 향상에 도움","잡초 뽑기나 퇴비 섞기 같은 작은 작업으로도 많은 칼로리 소모"]},{"label":"02낮은 강도의 운동 효과","items":["원예는 신체적 제약이 있는 사람들도 쉽게 접근할 수 있는 운동이다.","전통적인 운동이 힘든 사람들에게 특히 유익함","신체에 무리가 적은 저강도 방식(low-impact way)으로 활동 유지 가능","모든 연령대와 신체 능력을 가진 사람들에게 적합함(accessible)"]},{"label":"03심리적 안정과 마음챙김","items":["식물을 가꾸는 행위는 마음을 진정시키고 현재에 집중하게 돕는다.","식물을 돌보는 행위는 매우 차분하고 명상적임(calming and meditative)","현재 순간에 집중하게 하여 스트레스와 불안(stress and anxiety)을 줄여줌","반복적인 작업을 통해 마음챙김(mindfulness) 상태 유도"]},{"label":"04정서적 개선과 성취감","items":["자연 속에서의 시간은 정서적 건강을 증진하고 자존감을 높여준다.","기분 개선 및 인지 능력 향상, 우울 증상(depression symptoms) 완화","식물이 자라는 것을 보며 느끼는 성취감(sense of accomplishment)","전반적인 행복감과 자존감(self-esteem) 향상에 기여"]}],"bkg":"식물을 가꾸며 몸과 마음을 치유하는 원예 치료(Horticultural Therapy)는 오래전부터 그 효과를 인정받아 온 분야로, 단순히 꽃을 심는 일을 넘어 신체와 정신의 건강을 동시에 챙기는 통합적 접근(Holistic Approach)을 강조합니다. 정원 가꾸기는 관절에 무리가 덜 가면서도 전신 근육을 고루 사용하는 저강도 운동(Low-imp
