 쾌락 적응(Hedonic Adaptation)이라고 불러요. 마치 일정한 온도를 유지하는 실내 온도 조절기처럼, 인간의 정신도 외부 자극에 관계없이 자신만의 기본 행복 수치인 행복의 설정값(Happiness Set Point)으로 회귀하려는 본능이 있답니다. 이를 쾌락의 쳇바퀴(Hedonic Treadmill) 이론이라고도 하는데, 아무리 빨리 달려도 제자리인 쳇바퀴처럼 강렬한 감정적 변화도 결국은 익숙해지기 마련이라는 의미를 담고 있어요. 예를 들어 복권에 당첨된 사람이나 큰 사고를 당한 사람 모두 일정 시간이 흐르면 사건 이전의 감정 상태로 비슷하게 돌아간다는 연구 결과가 이 개념을 잘 뒷받침해 줍니다. 이러한 심리적 기제 덕분에 우리는 극심한 슬픔 속에서도 다시 일어설 수 있는 회복 탄력성(Resilience)을 얻지만, 동시에 짜릿한 행복도 금방 무덤덤해지는 경험을 하게 됩니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01감정 결정의 오해<\/div><ul><li>우리의 행복과 슬픔은 단순히 매 순간 일어나는 개별 사건들의 합으로 결정되지 않는다.<\/li><li>기쁨과 슬픔의 감정(happy or sad)은 매 순간의 경험으로만 정의되지 않음<\/li><li>개별적이고 연속적인 삶의 순간(successive moment)이 감정의 절대적 기준은 아님<\/li><li>핵심 키워드: 삶의 경험(life experience)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02감정의 안정성<\/div><ul><li>외부의 사건이 기분에 영향을 주기는 하지만, 인간은 매번 감정의 소용돌이에 휘말리지 않는다.<\/li><li>외부의 자극이나 바람(gust of wind)에 완전히 새로운 방향으로 휩쓸리지 않음<\/li><li>기분(mood)에 영향을 받으면서도 정서적 중심을 유지함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기본 설정값으로의 회귀<\/div><ul><li>인간은 새로운 정보와 사건에 적응하며 결국 자신만의 평상시 웰빙 수준으로 돌아간다.<\/li><li>좋은 일과 나쁜 일 모두에 적응(adjust)하는 능력이 있음<\/li><li>개인의 기본 설정값(default level) 혹은 기준선(baseline)으로 회귀함<\/li><li>핵심 키워드: 안녕/웰빙(well-being)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04감정의 평준화 원리<\/div><ul><li>인생의 고락이 반복되어도 시간이 흐르면 물이 수평을 찾듯 감정도 원래의 위치를 찾는다.<\/li><li>나쁜 소식 후에는 다시 올라가고 좋은 소식 후에는 다시 내려옴<\/li><li>첫사랑의 행복감(euphoria)과 이별의 절망(despair)도 결국 희미해짐<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05아동의 사례와 보편적 적응<\/div><ul><li>장난감을 가진 아이들의 사례를 통해 인간의 보편적인 적응 특성을 보여준다.<\/li><li>아이들은 원하는 장난감을 얻으면 영원히 행복할 것이라 믿음(toy joy)<\/li><li>그러나 어른들과 마찬가지로 아이들도 결국 환경에 적응(adapt)함<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">content<\/td><td class=\"m\">내용, 내용물<\/td><\/tr><tr><td class=\"w\">determined<\/td><td class=\"m\">단호한, 굳게 결심한<\/td><\/tr><tr><td class=\"w\">merely<\/td><td class=\"m\">단지, 그저<\/td><\/tr><tr><td class=\"w\">individual<\/td><td class=\"m\">개인<\/td><\/tr><tr><td class=\"w\">successive<\/td><td class=\"m\">연이은, 연속적인<\/td><\/tr><tr><td class=\"w\">affect<\/td><td class=\"m\">영향을 미치다<\/td><\/tr><tr><td class=\"w\">mood<\/td><td class=\"m\">기분<\/td><\/tr><tr><td class=\"w\">completely<\/td><td class=\"m\">완전히<\/td><\/tr><tr><td class=\"w\">direction<\/td><td class=\"m\">방향<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gust<\/td><td class=\"m\">돌풍<\/td><\/tr><tr><td class=\"w\">wind<\/td><td class=\"m\">바람<\/td><\/tr><tr><td class=\"w\">adjust<\/td><td class=\"m\">조절하다, 맞추다<\/td><\/tr><tr><td class=\"w\">return<\/td><td class=\"m\">반납, 귀환, 수익<\/td><\/tr><tr><td class=\"w\">default<\/td><td class=\"m\">기본값, 초기 설정<\/td><\/tr><tr><td class=\"w\">level<\/td><td class=\"m\">평평하게 하다<\/td><\/tr><tr><td class=\"w\">seek<\/td><td class=\"m\">찾다, 구하다<\/td><\/tr><tr><td class=\"w\">baseline<\/td><td class=\"m\">기준점<\/td><\/tr><tr><td class=\"w\">fade<\/td><td class=\"m\">바래다, 희미해지다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Whether we feel happy or sad, content or discontent,<\/b><\/span><span class=\"ko\">우리가 행복하거나 슬프거나, 만족스럽거나 불만족스럽게 느끼는지는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">is not determined<\/span> merely<\/b><\/span><span class=\"ko\">단순히 결정되지 않는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by each individual successive moment of life experience<\/b><\/span><span class=\"ko\">삶의 경험의 각각의 개별적인 연속적인 순간에 의해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a good thing happens and I'm happy,<\/b><\/span><span class=\"ko\">좋은 일이 일어나면 내가 행복하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a bad thing happens and I'm sad.<\/b><\/span><span class=\"ko\">나쁜 일이 일어나면 내가 슬픈 (것처럼).<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리가 행복하거나 슬프거나, 만족스럽거나 불만족스러운 것은 좋은 일이 일어나면 행복하고, 나쁜 일이 일어나면 슬픈 것처럼 단지 삶의 경험의 각각의 개별적인 연속적인 순간에 의해 결정되지 않는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로, 인간의 감정이 외부 사건에 따라 일희일비하며 즉각적으로 결정되는 것이 아니라는 주제를 제시합니다. determined merely by each individual successive moment는 우리가 겪는 사건 하나하나가 곧바로 우리의 전체적인 행복 지수가 되는 것은 아니라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is not determined (수동태): be동사(is)+p.p.(determined) 구조. determine은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is not determined 형태로 쓴다. 기본구조: V + O (determine something)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">content<\/td><td class=\"m\">내용, 내용물<\/td><\/tr><tr><td class=\"w\">determined<\/td><td class=\"m\">단호한, 굳게 결심한<\/td><\/tr><tr><td class=\"w\">merely<\/td><td class=\"m\">단지, 그저<\/td><\/tr><tr><td class=\"w\">individual<\/td><td class=\"m\">개인<\/td><\/tr><tr><td class=\"w\">successive<\/td><td class=\"m\">연이은, 연속적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>While our experiences affect our mood,<\/b><\/span><span class=\"ko\">우리의 경험이 우리의 기분에 영향을 미치는 동안,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we <span class=\"grammar-hl\">are not blown<\/span><\/b><\/span><span class=\"ko\">우리는 날아가지 않는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in a completely new direction<\/b><\/span><span class=\"ko\">완전히 새로운 방향으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by each gust of wind.<\/b><\/span><span class=\"ko\">각 돌풍에 의해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리의 경험은 우리의 기분에 영향을 미치지만, 우리는 각 돌풍에 의해 완전히 새로운 방향으로 날아가지 않는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에 이어 외부 사건이 감정에 주는 영향력을 인정하면서도, 그 영향이 우리 삶의 방향을 바꿀 만큼 결정적이지 않음을 설명합니다. not blown in a completely new direction은 외부의 자극이나 사건이 발생해도 인간에게는 정서적인 중심을 잡는 힘이 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are not blown (수동태): be동사(are)+p.p.(blown) 구조. blow는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are not blown 형태로 쓴다. 기본구조: V + O (blow something)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">affect<\/td><td class=\"m\">영향을 미치다<\/td><\/tr><tr><td class=\"w\">mood<\/td><td class=\"m\">기분<\/td><\/tr><tr><td class=\"w\">completely<\/td><td class=\"m\">완전히<\/td><\/tr><tr><td class=\"w\">direction<\/td><td class=\"m\">방향<\/td><\/tr><tr><td class=\"w\">gust<\/td><td class=\"m\">돌풍<\/td><\/tr><tr><td class=\"w\">wind<\/td><td class=\"m\">바람<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>As humans,<\/b><\/span><span class=\"ko\">인간으로서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we adjust<\/b><\/span><span class=\"ko\">우리는 적응하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to new information and events both good and bad<\/b><\/span><span class=\"ko\">좋을 뿐 아니라 나쁘기도 한 새로운 정보와 사건들에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and return<\/b><\/span><span class=\"ko\">돌아간다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to our personal default level of well-being.<\/b><\/span><span class=\"ko\">우리의 개인적인 기본 행복 수준으로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">인간으로서 우리는 좋을 뿐 아니라 나쁘기도 한 새로운 정보와 사건들에 적응하고 우리의 개인적인 기본 행복 수준으로 돌아간다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 감정이 다시 제자리로 돌아오는 이유가 인간의 &#39;적응력&#39; 때문임을 밝히며 핵심 개념을 제시합니다. personal default level of well-being은 심리학에서 말하는 &#39;행복 설정점&#39;과 같은 개념으로, 어떤 사건을 겪더라도 결국 원래의 평온한 상태로 회귀하게 된다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">adjust to ... and return to 5형식(SVOC) 구조가 아닌 1형식 병렬 구조: 주어 we 뒤에 첫 번째 동사 adjust와 두 번째 동사 return이 and로 연결되어 주어의 동작을 나란히 설명한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">adjust<\/td><td class=\"m\">조절하다, 맞추다<\/td><\/tr><tr><td class=\"w\">return<\/td><td class=\"m\">반납, 귀환, 수익<\/td><\/tr><tr><td class=\"w\">default<\/td><td class=\"m\">기본값, 초기 설정<\/td><\/tr><tr><td class=\"w\">level<\/td><td class=\"m\">평평하게 하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>There will be highs and lows,<\/b><\/span><span class=\"ko\">기복은 있을 것이지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but over time,<\/b><\/span><span class=\"ko\">시간이 지나면서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>like water <span class=\"grammar-hl\">seeking<\/span> its own level,<\/b><\/span><span class=\"ko\">고유한 수위를 찾는 물처럼,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we <span class=\"grammar-hl\">are pulled<\/span> toward our baseline<\/b><\/span><span class=\"ko\">우리는 우리의 기준선으로 끌려간다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>back up after bad news<\/b><\/span><span class=\"ko\">나쁜 소식 후에는 다시 위로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and back down after good.<\/b><\/span><span class=\"ko\">그리고 좋은 소식 후에는 다시 아래로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">기복은 있을 것이지만, 시간이 지나면서 고유한 수위를 찾는 물처럼 우리는 우리의 기준선으로 끌려가는데 즉, 나쁜 소식 후에는 다시 &#39;올라&#39;오고 좋은 소식 후에는 다시 &#39;내려&#39;온다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 감정의 변화와 회복 과정을 물의 특성에 비유하여 구체적으로 묘사합니다. like water seeking its own level은 외부 요동이 멈추면 물 표면이 다시 평평해지듯, 인간의 정신도 일시적인 충격 후에 원래의 안정적인 상태를 회복한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">seeking (현재분사(형용사)): seeking이 앞의 명사 water를 수식하는 구조다. water seeking its own level ≈ water that is seeking its own level(자신의 수평을 찾는 물)의 의미로 해석한다.<\/div><div class=\"lec-gr-item\">are pulled (수동태): be동사(are)+p.p.(pulled) 구조. pull은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are pulled 형태로 쓴다. 기본구조: V + O (pull something)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">level<\/td><td class=\"m\">평평하게 하다<\/td><\/tr><tr><td class=\"w\">seek<\/td><td class=\"m\">찾다, 구하다<\/td><\/tr><tr><td class=\"w\">baseline<\/td><td class=\"m\">기준점<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The euphoria of first love fades,<\/b><\/span><span class=\"ko\">첫사랑의 행복감은 사라지고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">so does<\/span> the despair of a break-up.<\/b><\/span><span class=\"ko\">결별의 절망도 그렇다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">첫사랑의 행복감은 사라지고, 결별의 절망도 그렇다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 감정의 회귀 현상을 사랑과 이별이라는 구체적인 사례를 들어 뒷받침합니다. fades, and so does the despair는 아주 강렬한 긍정적 감정이나 부정적 감정 모두 시간이 지나면 그 강도가 약해져 결국 평범한 상태가 된다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">so does (도치): 「So + 조동사/be동사/do동사 + 주어」 구문으로 &#39;~도 역시 그러하다&#39;는 의미를 나타내며, 주어인 the despair of a break-up이 동사 뒤로 도치되었다.<\/div><div class=\"lec-gr-item\">does (대동사): 일반동사인 fades를 대신하여 쓰였다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fade<\/td><td class=\"m\">바래다, 희미해지다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This tendency <span class=\"grammar-hl\">is best seen<\/span><\/b><\/span><span class=\"ko\">이 경향은 가장 잘 보여진다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with little kids and their toy joy:<\/b><\/span><span class=\"ko\">어린 아이들과 그들의 장난감 기쁨에서:<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>When they get <span class=\"grammar-hl\">what<\/span> they've longed for,<\/b><\/span><span class=\"ko\">그들이 간절히 원하던 것을 얻을 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they believe<\/b><\/span><span class=\"ko\">그들은 믿는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they will be happy<\/b><\/span><span class=\"ko\">그들이 행복할 것이라고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for the rest of their lives.<\/b><\/span><span class=\"ko\">그들의 남은 인생 동안.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이 경향은 어린 아이들과 그들의 장난감 기쁨에서 가장 잘 보여진다: 그들은 간절히 원하던 것을 얻을 때, 그들의 남은 인생동안 행복할 것이라고 믿는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 감정 적응이 일어나기 전의 강렬한 몰입 상태를 아이들의 사례로 보여줍니다. believe they will be happy for the rest of their lives는 아이들이 현재의 기쁨이 영원히 지속될 것이라고 착각하는 모습을 생생하게 표현한 것입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is best seen (수동태): be동사(is)+p.p.(seen) 구조. see는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is best seen 형태로 쓴다. 기본구조: V + O (see something)<\/div><div class=\"lec-gr-item\">what (관계대명사): 선행사를 포함한 관계대명사 what으로, long for의 목적어 역할을 하며 get의 목적어 절을 이끈다. &#39;~하는 것&#39;으로 해석한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>And for the first few minutes<\/b><\/span><span class=\"ko\">그리고 처음 몇 분 동안<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of the rest of their lives,<\/b><\/span><span class=\"ko\">그들의 남은 인생의,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">they are<\/span>.<\/b><\/span><span class=\"ko\">그들은 그렇다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그리고 그들의 남은 인생의 처음 몇 분 동안, 그들은 그렇다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 아이들의 믿음이 아주 짧은 시간 동안만 유효함을 익살스럽게 표현합니다. for the first few minutes는 사건 직후의 행복감이 얼마나 일시적이고 짧게 유지되는지를 강조하는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">they are (대동사): 앞의 happy를 생략하고 be동사 are만 남은 구조다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But then the kids - like adults<\/b><\/span><span class=\"ko\">하지만 그러고 나서 아이들은 - 어른들처럼<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">adapt<\/span>.<\/b><\/span><span class=\"ko\">적응한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 그리고 나서 어른들처럼 아이들은 적응한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 아이들 또한 성인과 마찬가지로 결국 원래의 평범한 상태로 돌아온다는 결론을 내립니다. like adults adapt는 적응이라는 기제가 나이와 상관없이 모든 인간에게 공통적으로 작용하는 보편적인 심리 법칙이라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">adapt 5형식(SVOC) 구조가 아닌 1형식 구조: 주어 the kids 뒤에 동사 adapt가 쓰인 간단한 문장 구조이며, 대시(—) 사이의 like adults는 부사적 삽입구다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>인간의 행복과 불행은 단순히 매 순간 일어나는 사건들에 의해 결정되지 않는다.<\/li><li>외부 사건이 기분에 영향을 주지만, 인간은 정서적 안정성을 유지하는 힘이 있다.<\/li><li>우리는 좋은 일이든 나쁜 일이든 결국 개인의 기본 행복 수준(기준점)으로 돌아온다.<\/li><li>강렬한 기쁨이나 슬픔도 시간이 지나면 물이 평평해지듯 원래 상태로 회귀한다.<\/li><li>아이들의 장난감 사례에서 보듯, 모든 인간은 적응을 통해 정서적 균형을 찾아간다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Humans inevitably return to their baseline level of well-being by adapting to various life events regardless of their immediate emotional impact.<\/div>\n              <div class=\"lec-final-sum-ko\">인간은 즉각적인 감정적 영향에 관계없이 다양한 삶의 사건에 적응함으로써 필연적으로 자신의 기본 행복 수준으로 돌아간다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./31_audio/1.mp3","hl":null}],[{"audio":"./31_audio/2.mp3","hl":null}],[{"audio":"./31_audio/3.mp3","hl":null},{"audio":"./31_audio/4.mp3","hl":"stage-0"},{"audio":"./31_audio/5.mp3","hl":"stage-1"},{"audio":"./31_audio/6.mp3","hl":"stage-2"},{"audio":"./31_audio/7.mp3","hl":"stage-3"},{"audio":"./31_audio/8.mp3","hl":"stage-4"}],[{"audio":"./31_audio/9.mp3","hl":null}],[{"audio":"./31_audio/10.mp3","hl":"main"},{"audio":"./31_audio/11.mp3","hl":"meaning"},{"audio":"./31_audio/12.mp3","hl":"grammar"}],[{"audio":"./31_audio/13.mp3","hl":"main"},{"audio":"./31_audio/14.mp3","hl":"meaning"},{"audio":"./31_audio/15.mp3","hl":"grammar"}],[{"audio":"./31_audio/16.mp3","hl":"main"},{"audio":"./31_audio/17.mp3","hl":"meaning"},{"audio":"./31_audio/18.mp3","hl":"grammar"}],[{"audio":"./31_audio/19.mp3","hl":"main"},{"audio":"./31_audio/20.mp3","hl":"meaning"},{"audio":"./31_audio/21.mp3","hl":"grammar"}],[{"audio":"./31_audio/22.mp3","hl":"main"},{"audio":"./31_audio/23.mp3","hl":"meaning"},{"audio":"./31_audio/24.mp3","hl":"grammar"}],[{"audio":"./31_audio/25.mp3","hl":"main"},{"audio":"./31_audio/26.mp3","hl":"meaning"},{"audio":"./31_audio/27.mp3","hl":"grammar"}],[{"audio":"./31_audio/28.mp3","hl":"main"},{"audio":"./31_audio/29.mp3","hl":"meaning"},{"audio":"./31_audio/30.mp3","hl":"grammar"}],[{"audio":"./31_audio/31.mp3","hl":"main"},{"audio":"./31_audio/32.mp3","hl":"meaning"},{"audio":"./31_audio/33.mp3","hl":"grammar"}],[{"audio":"./31_audio/34.mp3","hl":null}]],"fileName":"EBS올림포스(연합기출)고1 2026년 13강 01번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"EBS올림포스(연합기출)고1 2026년 13강 01번","titleEn":"Emotional Adaptation: Returning to Our Personal Baseline","titleKo":"감정적 적응: 개인적인 행복의 기준점으로의 회귀","imageUrl":"__enpImg__","stages":[{"label":"01감정 결정의 오해","items":["우리의 행복과 슬픔은 단순히 매 순간 일어나는 개별 사건들의 합으로 결정되지 않는다.","기쁨과 슬픔의 감정(happy or sad)은 매 순간의 경험으로만 정의되지 않음","개별적이고 연속적인 삶의 순간(successive moment)이 감정의 절대적 기준은 아님","핵심 키워드: 삶의 경험(life experience)"]},{"label":"02감정의 안정성","items":["외부의 사건이 기분에 영향을 주기는 하지만, 인간은 매번 감정의 소용돌이에 휘말리지 않는다.","외부의 자극이나 바람(gust of wind)에 완전히 새로운 방향으로 휩쓸리지 않음","기분(mood)에 영향을 받으면서도 정서적 중심을 유지함"]},{"label":"03기본 설정값으로의 회귀","items":["인간은 새로운 정보와 사건에 적응하며 결국 자신만의 평상시 웰빙 수준으로 돌아간다.","좋은 일과 나쁜 일 모두에 적응(adjust)하는 능력이 있음","개인의 기본 설정값(default level) 혹은 기준선(baseline)으로 회귀함","핵심 키워드: 안녕/웰빙(well-being)"]},{"label":"04감정의 평준화 원리","items":["인생의 고락이 반복되어도 시간이 흐르면 물이 수평을 찾듯 감정도 원래의 위치를 찾는다.","나쁜 소식 후에는 다시 올라가고 좋은 소식 후에는 다시 내려옴","첫사랑의 행복감(euphoria)과 이별의 절망(despair)도 결국 희미해짐"]},{"label":"05아동의 사례와 보편적 적응","items":["장난감을 가진 아이들의 사례를 통해 인간의 보편적인 적응 특성을 보여준다.","아이들은 원하는 장난감을 얻으면 영원히 행복할 것이라 믿음(toy joy)","그러나 어른들과 마찬가지로 아이들도 결국 환경에 적응(adapt)함"]}],"bkg":"우리가 큰 기쁨이나 슬픔을 겪어도 시간이 지나면 결국 원래의 평온한 상태로 돌아오는 현상을 심리학에서는 쾌락 적응(Hedonic Adaptation)이라고 불러요. 마치 일정한 온도를 유지하는 실내 온도 조절기처럼, 인간의 정신도 외부 자극에 관계없이 자신만의 기본 행복 수치인 행복의 설정값(Happiness Set Point)으로 회귀하려는 본능이 있답니다. 이를 쾌락의 쳇바퀴(Hedonic Treadmill) 이론이라고도 하는데, 아무리 빨리 달려도 제자리인 쳇바퀴처럼 강렬한 감정적 변화도 결국은 익숙해지기 마련이라는 의미를 담고 있어요. 예를 들어 복권에 당첨된 사람이나 큰 사고를 당한 사람 모두 일정 시간이 흐르면 사건 이전의 감정 상태로 비슷하게 돌아간다는 연구 결과가 이 개념을 잘 뒷받침해 줍니다. 이러한 심리적 기제 덕분에 우리는 극심한 슬픔 속에서도 다시 일어설 수 있는 회복 탄력성(Resilience)을 얻지만, 동시에 짜릿한 행복도 금방 무덤덤해지는 경험을 하게 됩니다.","ttsText":"우리가 큰 기쁨이나 슬픔을 겪어도 시간이 지나면 결국 원래의 평온한 상태로 돌아오는 현상을 심리학에서는 쾌락 적응(Hedonic Adaptation)이라고 불러요. 마치 일정한 온도를 유지하는 실내 온도 조절기처럼, 인간의 정신도 외부 자극에 관계없이 자신만의 기본 행복 수치인 행복의 설정값(Happiness Set Point)으로 회귀하려는 본능이 있답니다. 이를 쾌락의 쳇바퀴(Hedonic Treadmill) 이론이라고도 하는데, 아무리 빨리 달려도 제자리인 쳇바퀴처럼 강렬한 감정적 변화도 결국은 익숙해지기 마련이라는 의미를 담고 있어요. 예를 들어 복권에 당첨된 사람이나 큰 사고를 당한 사람 모두 일정 시간이 흐르면 사건 이전의 감정 상태로 비슷하게 돌아간다는 연구 결과가 이 개념을 잘 뒷받침해 줍니다. 이러한 심리적 기제 덕분에 우리는 극심한 슬픔 속에서도 다시 일어설 수 있는 회복 탄력성(Resilience)을 얻지만, 동시에 짜릿한 행복도 금방 무덤덤해지는 경험을 하게 됩니다.","__passage":"EBS올림포스(연합기출)고1 2026년 13강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 31번","__script":"자, 오늘 우리가 함께 공부할 지문은 'EBS올림포스(연합기출)고1 2026년 13강 01번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"EBS올림포스(연합기출)고1 2026년 13강 01번","titleEn":"Emotional Adaptation: Returning to Our Personal Baseline","titleKo":"감정적 적응: 개인적인 행복의 기준점으로의 회귀","imageUrl":"__enpImg__","stages":[{"label":"01감정 결정의 오해","items":["우리의 행복과 슬픔은 단순히 매 순간 일어나는 개별 사건들의 합으로 결정되지 않는다.","기쁨과 슬픔의 감정(happy or sad)은 매 순간의 경험으로만 정의되지 않음","개별적이고 연속적인 삶의 순간(successive moment)이 감정의 절대적 기준은 아님","핵심 키워드: 삶의 경험(life experience)"]},{"label":"02감정의 안정성","items":["외부의 사건이 기분에 영향을 주기는 하지만, 인간은 매번 감정의 소용돌이에 휘말리지 않는다.","외부의 자극이나 바람(gust of wind)에 완전히 새로운 방향으로 휩쓸리지 않음","기분(mood)에 영향을 받으면서도 정서적 중심을 유지함"]},{"label":"03기본 설정값으로의 회귀","items":["인간은 새로운 정보와 사건에 적응하며 결국 자신만의 평상시 웰 ss Set Point)으로 회귀하려는 본능이 있답니다. 이를 쾌락의 쳇바퀴(Hedonic Treadmill) 이론이라고도 하는데, 아무리 빨리 달려도 제자리인 쳇바퀴처럼 강렬한 감정적 변화도 결국은 익숙해지기 마련이라는 의미를 담고 있어요. 예를 들어 복권에 당첨된 사람이나 큰 사고를 당한 사람 모두 일정 시간이 흐르면 사건 이전의 감정 상태로 비슷하게 돌아간다는 연구 결과가 이 개념을 잘 뒷받침해 줍니다. 이러한 심리적 기제 덕분에 우리는 극심한 슬픔 속에서도 다시 일어설 수 있는 회복 탄력성(Resilience)을 얻지만, 동시에 짜릿한 행복도 금방 무덤덤해지는 경험을 하게 됩니다.","__passage":"EBS올림포스(연합기출)고1 2026년 13강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 31번"},{"kind":"vocab","passageName":"EBS올림포스(연합기출)고1 2026년 13강 01번","vocab":[{"word":"content","meaning":"내용, 내용물"},{"word":"determined","meaning":"단호한, 굳게 결심한"},{"word":"merely","meaning":"단지, 그저"},{"word":"individual","meaning":"개인"},{"word":"successive","meaning":"연이은, 연속적인"},{"word":"affect","meaning":"영향을 미치다"},{"word":"mood","meaning":"기분"},{"word":"completely","meaning":"완전히"},{"word":"direction","meaning":"방향"},{"word":"gust","meaning":"돌풍"},{"word":"wind","meaning":"바람"},{"word":"adjust","meaning":"조절하다, 맞추다"},{"word":"return","meaning":"반납, 귀환, 수익"},{"word":"default","meaning":"기본값, 초기 설정"},{"word":"level","meaning":"평평하게 하다"},{"word":"seek","meaning":"찾다, 구하다"},{"word":"baseline","meaning":"기준점"},{"word":"fade","meaning":"바래다, 희미해지다"}],"ttsText":"","__passage":"EBS올림포스(연합기출)고1 2026년 13강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 31번","__script":"문장을 보기 전에, 이 지문의 핵심 단어들을 빠르게 짚고 갈게요. content, 내용, 내용물. determined, 단호한, 굳게 결심한. merely, 단지, 그저. individual, 개인. successive, 연이은, 연속적인. affect, 영향을 미치다. mood, 기분. completely, 완전히. direction, 방향. gust, 돌풍. wind, 바람. adjust, 조절하다, 맞추다. return, 반납, 귀환, 수익. default, 기본값, 초기 설정. 이 단어들은 꼭 기억해 두세요."},{"kind":"sentence","idx":1,"total":8,"english":"Whether we feel happy or sad, content or discontent, is not determined merely by each individual successive moment of life experience a good thing happens and I'm happy, a bad thing happens and I'm sad.","korean":"우리가 행복하거나 슬프거나, 만족스럽거나 불만족스러운 것은 좋은 일이 일어나면 행복하고, 나쁜 일이 일어나면 슬픈 것처럼 단지 삶의 경험의 각각의 개별적인 연속적인 순간에 의해 결정되지 않는다.","chunks":[{"english":"Whether we feel happy or sad, content or discontent,","englishHtml":"<b>Whether we feel happy or sad, content or discontent,<\/b>","korean":"우리가 행복하거나 슬프거나, 만족스럽거나 불만족스럽게 느끼는지는"},{"english":"is not determined merely","englishHtml":"<b><span class=\"grammar-hl\">is not determined<\/span> merely<\/b>","korean":"단순히 결정되지 않는다"},{"english":"by each individual successive moment of life experience","englishHtml":"<b>by each individual successive moment of life experience<\/b>","korean":"삶의 경험의 각각의 개별적인 연속적인 순간에 의해"},{"english":"a good thing happens and I'm happy,","englishHtml":"<b>a good thing happens and I'm happy,<\/b>","korean":"좋은 일이 일어나면 내가 행복하고"},{"english":"a bad thing happens and I'm sad.","englishHtml":"<b>a bad thing happens and I'm sad.<\/b>","korean":"나쁜 일이 일어나면 내가 슬픈 (것처럼)."}],"meaning":"글의 도입부로, 인간의 감정이 외부 사건에 따라 일희일비하며 즉각적으로 결정되는 것이 아니라는 주제를 제시합니다. determined merely by each individual successive moment는 우리가 겪는 사건 하나하나가 곧바로 우리의 전체적인 행복 지수가 되는 것은 아니라는 의미입니다.","grammar":"is not determined (수동태): be동사(is)+p.p.(determined) 구조. determine은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is not determined 형태로 쓴다. 기본구조: V + O (determine something)","grammarItems":["is not determined (수동태): be동사(is)+p.p.(determined) 구조. determine은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is not determined 형태로 쓴다. 기본구조: V + O (determine something)"],"vocab":[{"word":"content","meaning":"내용, 내용물"},{"word":"determined","meaning":"단호한, 굳게 결심한"},{"word":"merely","meaning":"단지, 그저"},{"word":"individual","meaning":"개인"},{"word":"successive","meaning":"연이은, 연속적인"}],"ttsText":"우리가 행복하거나 슬프거나, 만족스럽거나 불만족스러운 것은 좋은 일이 일어나면 행복하고, 나쁜 일이 일어나면 슬픈 것처럼 단지 삶의 경험의 각각의 개별적인 연속적인 순간에 의해 결정되지 않는다.. 글의 도입부로, 인간의 감정이 외부 사건에 따라 일희일비하며 즉각적으로 결정되는 것이 아니라는 주제를 제시합니다. determined merely by each individual successive moment는 우리가 겪는 사건 하나하나가 곧바로 우리의 전체적인 행복 지수가 되는 것은 아니라는 의미입니다.. is not determined (수동태): be동사(is)+p.p.(determined) 구조. determine은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is not determined 형태로 쓴다. 기본구조: V + O (determine something)","_ ssageName":"EBS올림포스(연합기출)고1 2026년 13강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 31번"},{"kind":"sentence","idx":4,"total":8,"english":"There will be highs and lows, but over time, like water seeking its own level, we are pulled toward our baseline back up after bad news and back down after good.","korean":"기복은 있을 것이지만, 시간이 지나면서 고유한 수위를 찾는 물처럼 우리는 우리의 기준선으로 끌려가는데 즉, 나쁜 소식 후에는 다시 '올라'오고 좋은 소식 후에는 다시 '내려'온다.","chunks":[{"english":"There will be highs and lows,","englishHtml":"<b>There will be highs and lows,<\/b>","korean":"기복은 있을 것이지만,"},{"english":"but over time,","englishHtml":"<b>but over time,<\/b>","korean":"시간이 지나면서,"},{"english":"like water seeking its own level,","englishHtml":"<b>like water <span class=\"grammar-hl\">seeking<\/span> its own level,<\/b>","korean":"고유한 수위를 찾는 물처럼,"},{"english":"we are pulled toward our baseline","englishHtml":"<b>we <span class=\"grammar-hl\">are pulled<\/span> toward our baseline<\/b>","korean":"우리는 우리의 기준선으로 끌려간다"},{"english":"back up after bad news","englishHtml":"<b>back up after bad news<\/b>","korean":"나쁜 소식 후에는 다시 위로"},{"english":"and back down after good.","englishHtml":"<b>and back down after good.<\/b>","korean":"그리고 좋은 소식 후에는 다시 아래로."}],"meaning":"감정의 변화와 회복 과정을 물의 특성에 비유하여 구체적으로 묘사합니다. like water seeking its own level은 외부 요동이 멈추면 물 표면이 다시 평평해지듯, 인간의 정신도 일시적인 충격 후에 원래의 안정적인 상태를 회복한다는 의미입니다.","grammar":"seeking (현재분사(형용사)): seeking이 앞의 명사 water를 수식하는 구조다. water seeking its own level ≈ water that is seeking its own level(자신의 수평을 찾는 물)의 의미로 해석한다. are pulled (수동태): be동사(are)+p.p.(pulled) 구조. pull은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are pulled 형태로 쓴다. 기본구조: V + O (pull something)","grammarItems":["seeking (현재분사(형용사)): seeking이 앞의 명사 water를 수식하는 구조다. water seeking its own level ≈ water that is seeking its own level(자신의 수평을 찾는 물)의 의미로 해석한다.","are pulled (수동태): be동사(are)+p.p.(pulled) 구조. pull은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are pulled 형태로 쓴다. 기본구조: V + O (pull something)"],"vocab":[{"word":"level","meaning":"평 ne)"],"rows":[["지속성","일시적이고 금방 사라짐","장기적이고 안정적으로 유지됨"],["감정의 폭","매우 높거나(희열) 낮은(절망) 상태","평온하고 일상적인 웰빙 수준"],["인간의 반응","강한 감정적 동요를 느낌","적응을 통해 다시 돌아가려는 본능"],["비유","부는 바람, 물의 출렁임","자기 수위를 찾는 물, 기준점"]]},"ttsText":"인간의 행복과 불행은 단순히 매 순간 일어나는 사건들에 의해 결정되지 않는다. 외부 사건이 기분에 영향을 주지만, 인간은 정서적 안정성을 유지하는 힘이 있다. 우리는 좋은 일이든 나쁜 일이든 결국 개인의 기본 행복 수준(기준점)으로 돌아온다. 강렬한 기쁨이나 슬픔도 시간이 지나면 물이 평평해지듯 원래 상태로 회귀한다. 아이들의 장난감 사례에서 보듯, 모든 인간은 적응을 통해 정서적 균형을 찾아간다.","__passage":"EBS올림포스(연합기출)고1 2026년 13강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 31번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 인간의 행복과 불행은 단순히 매 순간 일어나는 사건들에 의해 결정되지 않습니다. 외부 사건이 기분에 영향을 주지만, 인간은 정서적 안정성을 유지하는 힘이 있습니다. 우리는 좋은 일이든 나쁜 일이든 결국 개인의 기본 행복 수준(기준점)으로 돌아옵니다. 강렬한 기쁨이나 슬픔도 시간이 지나면 물이 평평해지듯 원래 상태로 회귀합니다. 아이들의 장난감 사례에서 보듯, 모든 인간은 적응을 통해 정서적 균형을 찾아갑니다. 마지막으로 이 글을 한 문장으로 요약하면 이렇습니다. 인간은 즉각적인 감정적 영향에 관계없이 다양한 삶의 사건에 적응함으로써 필연적으로 자신의 기본 행복 수준으로 돌아갑니다. 오늘도 정말 수고 많았습니다!"}]}</script><script>var D=JSON.parse(document.getElementById("enpLecData").textContent);var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Ma
