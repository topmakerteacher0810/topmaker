ident)<\/li><li>현재 도서관 폐관 시간: 오후 5시(5 p.m.)<\/li><li>핵심 키워드: 운영 시간(operating hours)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02문제 제기<\/div><ul><li>현재의 운영 시간이 학생들의 학습 및 연구 자원 활용을 제한하고 있음.<\/li><li>정규 수업 후 도서관 자원 이용의 한계(limits)<\/li><li>대입 시험(college entrance exams) 준비생들의 어려움<\/li><li>조용하고 유용한 환경(quiet and resourceful environment)에 대한 필요성<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03해결 방안 제안<\/div><ul><li>학생들의 학업 목표 달성을 돕기 위해 운영 시간을 연장해 줄 것을 요청함.<\/li><li>요청 사항: 운영 시간을 오후 7시(7 p.m.)까지 연장(extend)<\/li><li>추가적인 집중 시간 확보를 통한 학생 지원<\/li><li>핵심 키워드: 연장(extend), 학업 목표(academic goals)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04기대 효과 및 맺음말<\/div><ul><li>제안된 변경 사항이 학교의 학업 환경을 개선하고 학생들을 돕는 계기가 되길 희망함.<\/li><li>학업 환경 개선(improving academic environment)을 위한 단계<\/li><li>학생들의 요구(needs)에 대한 지지 및 긍정적 검토 요청<\/li><li>핵심 키워드: 제안(proposal), 지원(supporting)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">council<\/td><td class=\"m\">학생회<\/td><\/tr><tr><td class=\"w\">discuss<\/td><td class=\"m\">논의하다, 이야기를 나누다<\/td><\/tr><tr><td class=\"w\">regarding<\/td><td class=\"m\">~에 관하여<\/td><\/tr><tr><td class=\"w\">current<\/td><td class=\"m\">해류, 전류, 흐름<\/td><\/tr><tr><td class=\"w\">operating<\/td><td class=\"m\">운영의, 작동의<\/td><\/tr><tr><td class=\"w\">present<\/td><td class=\"m\">현재의, 참석한<\/td><\/tr><tr><td class=\"w\">limit<\/td><td class=\"m\">제한하다<\/td><\/tr><tr><td class=\"w\">fully<\/td><td class=\"m\">완전히, 충분히<\/td><\/tr><tr><td class=\"w\">resource<\/td><td class=\"m\">자원<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">research<\/td><td class=\"m\">연구, 조사<\/td><\/tr><tr><td class=\"w\">regular<\/td><td class=\"m\">규칙적인, 정기적인<\/td><\/tr><tr><td class=\"w\">particularly<\/td><td class=\"m\">특히, 특별히<\/td><\/tr><tr><td class=\"w\">challenging<\/td><td class=\"m\">힘든, 어려운<\/td><\/tr><tr><td class=\"w\">prepare<\/td><td class=\"m\">준비하다<\/td><\/tr><tr><td class=\"w\">entrance<\/td><td class=\"m\">입구, 입장<\/td><\/tr><tr><td class=\"w\">academic<\/td><td class=\"m\">학업의, 학문의<\/td><\/tr><tr><td class=\"w\">project<\/td><td class=\"m\">계획, 과제<\/td><\/tr><tr><td class=\"w\">demand<\/td><td class=\"m\">수요, 요구<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Dear Principal Jones<\/span>,<\/b><\/span><span class=\"ko\">친애하는 Jones 교장 선생님께,<\/span><\/div><\/div><div class=\"lec-sent-ko\">Jones 교장 선생님께,<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 편지의 수신자가 학교의 최고 결정권자인 교장 선생님임을 밝히며 정중하게 글을 시작합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Dear Principal Jones (관용표현): 편지나 이메일의 첫머리에서 수신자를 부를 때 사용하는 격식 있는 호칭이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I hope<\/b><\/span><span class=\"ko\">저는 바랍니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>this message <span class=\"grammar-hl\">finds you well<\/span>.<\/b><\/span><span class=\"ko\">이 메시지가 당신에게 잘 전달되기를.<\/span><\/div><\/div><div class=\"lec-sent-ko\">저는 이 메시지가 당신에게 잘 전달되기를 바랍니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 본격적인 용건을 꺼내기 전, 상대방의 안녕을 묻는 전형적인 격식체 인사말입니다. this message finds you well은 편지를 받는 사람이 별탈 없이 좋은 상태이길 바란다는 따뜻한 문구로 부드러운 분위기를 조성합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">finds you well 5형식(SVOC) 구조: 동사 find + 목적어(you) + 목적격 보어(well). &#39;당신이 건강한(잘 지내는) 상태임을 알게 되다&#39;라는 의미로, 안부를 묻는 정중한 관용적 문장 구조다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>As student council president,<\/b><\/span><span class=\"ko\">학생회장으로서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I am reaching out<\/b><\/span><span class=\"ko\">저는 연락드립니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to discuss<\/span> an important matter<\/b><\/span><span class=\"ko\">중요한 문제를 논의하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">regarding<\/span> our school library's current operating hours.<\/b><\/span><span class=\"ko\">우리 학교 도서관의 현재 운영 시간에 관한.<\/span><\/div><\/div><div class=\"lec-sent-ko\">학생회장으로서 저는 우리 학교 도서관의 현재 운영 시간에 관한 중요한 문제를 논의하고자 연락드립니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글쓴이가 학생 전체를 대표하는 직책임을 명시하여 제안에 무게감을 더하고, 편지를 쓴 핵심 목적을 곧바로 제시합니다. reaching out to discuss는 단순히 말을 거는 수준을 넘어, 특정한 현안에 대해 공식적으로 의견을 교환하고 싶다는 의사를 표현합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to discuss (to부정사(부사적): 목적): in order to discuss로 바꿔 쓸 수 있으며, 문맥상 &#39;~하기 위해&#39;라는 목적의 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">regarding (현재분사(형용사)): regarding이 앞의 명사 matter를 수식하며 &#39;~에 관한&#39;이라는 의미를 나타낸다. 분사가 전치사처럼 굳어져 사용되는 형태다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">council<\/td><td class=\"m\">학생회<\/td><\/tr><tr><td class=\"w\">discuss<\/td><td class=\"m\">논의하다, 이야기를 나누다<\/td><\/tr><tr><td class=\"w\">regarding<\/td><td class=\"m\">~에 관하여<\/td><\/tr><tr><td class=\"w\">current<\/td><td class=\"m\">해류, 전류, 흐름<\/td><\/tr><tr><td class=\"w\">operating<\/td><td class=\"m\">운영의, 작동의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>At present,<\/b><\/span><span class=\"ko\">현재,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the library closes<\/b><\/span><span class=\"ko\">도서관은 문을 닫습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at 5 p.m.,<\/b><\/span><span class=\"ko\">오후 5시에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> many students feel<\/b><\/span><span class=\"ko\">그런데 그것은 많은 학생이 느끼기에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>limits their ability<\/b><\/span><span class=\"ko\">그들의 능력을 제한합니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to fully use<\/span> its resources<\/b><\/span><span class=\"ko\">도서관 자원을 충분히 사용할<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for study and research<\/b><\/span><span class=\"ko\">학습과 연구를 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>after regular class hours.<\/b><\/span><span class=\"ko\">정규 수업 시간 이후에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">현재, 도서관은 오후 5시에 문을 닫는데, 이는 많은 학생이 느끼기에, 정규 수업 시간 이후 학습과 연구를 위해 도서관 자원을 충분히 사용할 수 있는 능력을 제한합니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 현재 상황이 학생들에게 어떤 불편을 주는지 구체적인 이유를 들어 설명합니다. limits their ability to fully use는 도서관의 전문 서적이나 조용한 열람실 같은 유용한 자원들이 있음에도 불구하고, 이른 폐관 시간 때문에 이를 그림의 떡처럼 느끼고 있다는 학생들의 불만을 전달합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">which 관계대명사(계속적 용법): 앞의 주절 내용 전체를 선행사로 취하며, 콤마(,) 뒤에서 그 내용에 대한 부연 설명을 이어간다. 뒤에 주어 없이 동사 feel이 바로 이어지는 주격 관계대명사다.<\/div><div class=\"lec-gr-item\">to fully use (to부정사(형용사적)): ability를 수식한다. &#39;사용할 수 있는 능력&#39;으로 해석되며, 명사의 내용을 구체적으로 한정하는 구조이므로 형용사적 용법에 해당한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">present<\/td><td class=\"m\">현재의, 참석한<\/td><\/tr><tr><td class=\"w\">limit<\/td><td class=\"m\">제한하다<\/td><\/tr><tr><td class=\"w\">fully<\/td><td class=\"m\">완전히, 충분히<\/td><\/tr><tr><td class=\"w\">resource<\/td><td class=\"m\">자원<\/td><\/tr><tr><td class=\"w\">research<\/td><td class=\"m\">연구, 조사<\/td><\/tr><tr><td class=\"w\">regular<\/td><td class=\"m\">규칙적인, 정기적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This is particularly challenging<\/b><\/span><span class=\"ko\">이것은 특히 어렵습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for <span class=\"grammar-hl\">those<\/span><\/b><\/span><span class=\"ko\">사람들에게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">preparing<\/span> for college entrance exams<\/b><\/span><span class=\"ko\">대학 입학 시험을 준비하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or <span class=\"grammar-hl\">working<\/span> on academic projects<\/b><\/span><span class=\"ko\">혹은 학업 프로젝트를 수행하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that demand<\/span> a quiet and resourceful environment.<\/b><\/span><span class=\"ko\">조용하고 자료가 풍부한 환경을 요하는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이것은 특히 대학 입학 시험을 준비하거나 조용하고 자료가 풍부한 환경을 요하는 학업 연구과제를 수행하는 그들에게 어렵습니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 불편함이 구체적으로 어떤 학생들에게 치명적인지 사례를 들어 뒷받침합니다. demand a quiet and resourceful environment는 집이나 카페 같은 일반적인 장소에서는 얻기 힘든 학교 도서관만의 학술적인 분위기가 절실한 학생들이 많다는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">those preparing (현재분사(형용사)): preparing이 대명사 those를 수식하며 &#39;준비하는 사람들&#39;(= those who are preparing)이라는 의미를 만든다.<\/div><div class=\"lec-gr-item\">working (현재분사(형용사)): or를 통해 preparing과 병렬 구조를 이루며 those를 수식한다. &#39;학술 프로젝트를 수행하는 사람들&#39;이라는 의미다.<\/div><div class=\"lec-gr-item\">that demand (관계대명사(주격)): projects를 선행사로 취하며, 뒤에 주어가 빠진 불완전한 절을 이끌어 선행사를 수식하는 형용사절이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">resource<\/td><td class=\"m\">자원<\/td><\/tr><tr><td class=\"w\">particularly<\/td><td class=\"m\">특히, 특별히<\/td><\/tr><tr><td class=\"w\">challenging<\/td><td class=\"m\">힘든, 어려운<\/td><\/tr><tr><td class=\"w\">prepare<\/td><td class=\"m\">준비하다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">entrance<\/td><td class=\"m\">입구, 입장<\/td><\/tr><tr><td class=\"w\">academic<\/td><td class=\"m\">학업의, 학문의<\/td><\/tr><tr><td class=\"w\">project<\/td><td class=\"m\">계획, 과제<\/td><\/tr><tr><td class=\"w\">demand<\/td><td class=\"m\">수요, 요구<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Therefore,<\/b><\/span><span class=\"ko\">그러므로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I'd like to <span class=\"grammar-hl\">ask you<\/span><\/b><\/span><span class=\"ko\">저는 당신에게 요청하고 싶습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to extend<\/span> the library's operating hours<\/b><\/span><span class=\"ko\">도서관 운영 시간을 연장해 주기를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to 7 p.m.<\/b><\/span><span class=\"ko\">오후 7시까지.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러므로, 저는 도서관 운영 시간을 오후 7시까지 연장해 주시기를 당신에게 요청드리고 싶습니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 언급한 문제점들을 바탕으로 글쓴이가 원하는 최종적인 해결책을 명확하게 요구합니다. extend the library&#39;s operating hours는 현재보다 2시간 더 늦게까지 도서관을 개방하여 학생들의 학습권을 보장해 달라는 핵심적인 제안입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">ask you to extend 5형식(SVOC) 구조: 동사 ask + 목적어(you) + 목적격 보어(to extend). ask는 목적어가 하는 동작을 to부정사로 취하는 대표적인 동사다.<\/div><div class=\"lec-gr-item\">to extend (목적격보어(to부정사)): ask의 목적어 you의 행동을 보충 설명하는 보어로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">operating<\/td><td class=\"m\">운영의, 작동의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This change<\/b><\/span><span class=\"ko\">이러한 변화는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>would greatly benefit students<\/b><\/span><span class=\"ko\">학생들에게 크게 이익이 될 것입니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by <span class=\"grammar-hl\">providing<\/span> additional time<\/b><\/span><span class=\"ko\">추가적인 시간을 제공함으로써<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to focus<\/span> on their academic goals.<\/b><\/span><span class=\"ko\">그들의 학업 목표에 집중하기 위한.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이러한 변화는 그들의 학업 목표에 집중하기 위한 추가시간을 제공함으로써 학생들에게 크게 이익이 될 것입니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 제안이 수용되었을 때 학교 공동체에 돌아올 긍정적인 기대 효과를 언급하며 교장 선생님을 설득합니다. focus on their academic goals는 연장된 시간이 단순한 휴식 시간이 아니라 학생들이 각자의 공부 성과를 내기 위해 매진하는 생산적인 시간이 될 것임을 시사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">providing (동명사): 전치사 by의 목적어 자리에 쓰인 명사적 역할로, &#39;~함으로써&#39;라는 수단을 나타낸다.<\/div><div class=\"lec-gr-item\">to focus (to부정사(형용사적)): time을 수식한다. &#39;집중할 수 있는 시간&#39;으로 해석되며, 명사 뒤에서 그 용도나 성격을 한정한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">academic<\/td><td class=\"m\">학업의, 학문의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I hope<\/b><\/span><span class=\"ko\">저는 바랍니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you will consider this proposal<\/b><\/span><span class=\"ko\">당신이 이 제안을 고려해 주기를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as a step<\/b><\/span><span class=\"ko\">하나의 단계로서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>toward <span class=\"grammar-hl\">improving<\/span> our academic environment<\/b><\/span><span class=\"ko\">우리의 학업 환경을 개선하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and better <span class=\"grammar-hl\">supporting<\/span> our needs.<\/b><\/span><span class=\"ko\">우리의 필요를 더 잘 지원하는 것을 향한.<\/span><\/div><\/div><div class=\"lec-sent-ko\">저는 우리의 학업 환경을 개선하고 우리의 필요성을 더 잘 지지해주는 단계로써 이 제안을 당신이 고려 해주시기를 바랍니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 요청을 마무리하며 교장 선생님의 긍정적인 검토를 정중하게 부탁합니다. a step toward improving은 이번 시간 연장 조치가 학교를 더 학생 중심적이고 학업에 최적화된 공간으로 변화시키는 중요한 출발점이 될 것이라는 점을 어필합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">improving (동명사): 전치사 toward의 목적어로 쓰여 명사 역할을 하며, &#39;환경을 개선하는 것&#39;이라는 행위의 의미를 가진다.<\/div><div class=\"lec-gr-item\">supporting (동명사): and를 통해 improving과 병렬 구조를 이루며 전치사 toward의 공통 목적어 역할을 수행한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">academic<\/td><td class=\"m\">학업의, 학문의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Sincerely<\/span>,<\/b><\/span><span class=\"ko\">진심을 담아,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Eric Park Student Council President<\/b><\/span><span class=\"ko\">Eric Park 학생회장<\/span><\/div><\/div><div class=\"lec-sent-ko\">진심을 담아, Eric Park 학생회장<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 편지를 마치는 격식 있는 맺음말과 함께, 다시 한번 자신의 직책을 밝히며 책임감 있게 글을 끝맺습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Sincerely (관용표현): 편지나 이메일의 맺음말로 사용하는 부사로, &#39;진심을 담아&#39;라는 의미의 격식 있는 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">council<\/td><td class=\"m\">학생회<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>학생회장이 교장 선생님에게 도서관 운영 시간 연장을 공식적으로 건의하는 편지이다.<\/li><li>현재 오후 5시 폐관은 학생들이 방과 후에 도서관 자원을 충분히 활용하는 데 방해가 되고 있다.<\/li><li>특히 입시 준비생이나 프로젝트 수행 학생들에게 도서관의 조용한 환경이 절실함을 호소한다.<\/li><li>운영 시간을 오후 7시까지 연장하면 학생들의 학업 성취와 학교 환경 개선에 큰 도움이 될 것임을 강조한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">The student council president requests an extension of library hours to 7 p.m. in order to provide students with a better environment for their academic goals.<\/div>\n              <div class=\"lec-final-sum-ko\">학생회장은 학생들의 학업 목표를 위한 더 나은 환경을 제공하기 위해 도서관 운영 시간을 오후 7시까지 연장해 줄 것을 요청한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./18_audio/1.mp3","hl":null}],[{"audio":"./18_audio/2.mp3","hl":null}],[{"audio":"./18_audio/3.mp3","hl":null},{"audio":"./18_audio ":"02문제 제기","items":["현재의 운영 시간이 학생들의 학습 및 연구 자원 활용을 제한하고 있음.","정규 수업 후 도서관 자원 이용의 한계(limits)","대입 시험(college entrance exams) 준비생들의 어려움","조용하고 유용한 환경(quiet and resourceful environment)에 대한 필요성"]},{"label":"03해결 방안 제안","items":["학생들의 학업 목표 달성을 돕기 위해 운영 시간을 연장해 줄 것을 요청함.","요청 사항: 운영 시간을 오후 7시(7 p.m.)까지 연장(extend)","추가적인 집중 시간 확보를 통한 학생 지원","핵심 키워드: 연장(extend), 학업 목표(academic goals)"]},{"label":"04기대 효과 및 맺음말","items":["제안된 변경 사항이 학교의 학업 환경을 개선하고 학생들을 돕는 계기가 되길 희망함.","학업 환경 개선(improving academic environment)을 위한 단계","학생들의 요구(needs)에 대한 지지 및 긍정적 검토 요청","핵심 키워드: 제안(proposal), 지원(supporting)"]}],"bkg":"학생이 스스로 학습의 방향을 설정하는 자기주도 학습(Self-Directed Learning)은 단순히 공부를 열심히 하는 것을 넘어, 자신에게 필요한 최적의 환경을 직접 구축하려는 노력을 포함합니다. 교육학에서는 학교와 가정 이외의 제3의 장소에서 집중력을 높이는 것을 제3의 공간(The Third Space) 효과라고 부르는데, 도서관은 학생들에게 정서적 안정감과 풍부한 자료를 동시에 제공하는 완벽한 장소입니다. 특히 학습자 주도성(Student Agency)이 강조되는 현대 교육에서, 학생들이 학교 운영에 목소리를 내어 학업 성취도(Academic Achievement)를 높이려는 시도는 매우 긍정적인 변화로 평가받습니다. 마치 운동선수가 훈련 시간을 조절해 최상의 기량을 발휘하듯, 도서관 이용 시간 연장은 학생들의 잠재력을 끌어올리는 중요한 학습 지원 시스템(Learning Support System)의 일부라고 할 수 있습니다.","ttsText":"학생이 스스로 학습의 방향을 설정하는 자기주도 학습(Self-Directed Learning)은 단순히 공부를 열심히 하는 것을 넘어, 자신에게 필요한 최적의 환경을 직접 구축하려는 노력을 포함합니다. 교육학에서는 학교와 가정 이외의 제3의 장소에서 집중력을 높이는 것을 제3의 공간(The Third Space) 효과라고 부르는데, 도서관은 학생들에게 정서적 안정감과 풍부한 자료를 동시에 제공하는 완벽한 장소입니다. 특히 학습자 주도성(Student Agency)이 강조되는 현대 교육에서, 학생들이 학교 운영에 목소리를 내어 학업 성취도(Academic Achievement)를 높이려는 시도는 매우 긍정적인 변화로 평가받습니다. 마치 운동선수가 훈련 시간을 조절해 최상의 기량을 발휘하듯, 도서관 이용 시간 연장은 학생들의 잠재력을 끌어올리는 중요한 학습 지원 시스템(Learning Support System)의 일부라고 할 수 있습니다.","__passage":"EBS올림포스(연합기출)고1 2026년 01강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 18번","__script":"자, 오늘 우리가 함께 공부할 지문은 'EBS올림포스(연합기출)고1 2026년 01강 01번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"EBS올림포스(연합기출)고1 2026년 01강 01번","titleEn":"A Proposal to Extend School Library Hours for Student Academic Support","titleKo":"학생들의 학업 지원을 위한 학교 도서관 운영 시간 연장 제안","imageUrl":"__enpImg__","stages"
