니다. 로저 페인 박사가 개척한 생물음향학(Bioacoustics)은 동물의 소리를 통해 그들의 의사소통 방식과 생태를 연구하는 학문으로, 당시 고래를 그저 기름을 얻기 위한 자원으로만 보던 사람들의 인식을 완전히 바꾸어 놓았습니다. 마치 우리가 좋아하는 유행가가 바뀌듯 고래들도 계절마다 노래 형식을 바꾸며 수천 킬로미터 떨어진 동료들과 교감한다는 사실은 대중들에게 고래를 지능적인 생명체로 각인시키는 결정적인 계기가 되었지요. 이러한 정서적 공감은 결국 무분별한 상업적 포경(Commercial Whaling)을 금지하자는 국제적인 목소리로 이어졌으며, 오늘날 우리가 당연하게 여기는 해양 포유류 보호(Marine Mammal Protection)의 법적 토대가 되었습니다. 이 글을 읽으며 한 과학자의 발견이 어떻게 세상을 바꾸는 거대한 운동으로 번져나갔는지 그 흐름을 생각하며 읽어보세요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01학문적 기반 마련<\/div><ul><li>로저 페인은 하버드와 코넬 대학에서 생물학을 전공하며 학문적 토대를 쌓았다.<\/li><li>1961년 코넬 대학교에서 박사 학위(Ph.D.) 취득<\/li><li>생물학(biology) 전문 지식을 갖춘 학자로 성장<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02혹등고래 노래의 발견<\/div><ul><li>1967년 혹등고래가 복잡한 소리를 통해 의사소통한다는 사실을 최초로 발견했다.<\/li><li>고래의 소리를 &#39;고래 노래(whale songs)&#39;라고 명명함<\/li><li>고래들이 소리를 소통(communicate) 수단으로 사용함을 입증<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03환경 보호 운동의 확산<\/div><ul><li>고래 노래 앨범 발매를 통해 전 세계적인 고래 보호 여론을 형성했다.<\/li><li>1970년 &#39;혹등고래의 노래(Songs of the Humpback Whale)&#39; 앨범 발매<\/li><li>&#39;고래를 구하자(Save the Whales)&#39; 운동의 시초가 됨<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04전문 연구 단체 설립<\/div><ul><li>해양 보호를 위한 단체를 설립하고 고래에게 무해한 새로운 연구 방식을 도입했다.<\/li><li>1971년 오션 얼라이언스(Ocean Alliance) 설립<\/li><li>고래에게 해를 끼치지 않는 안전한 방법(safe methods)으로 연구 수행<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05해양 오염 조사와 탐사<\/div><ul><li>전 세계를 무대로 수많은 연구 탐사를 이끌며 해양 생태계 전반을 조사했다.<\/li><li>100회 이상의 세계적인 연구 탐사(research trips) 주도<\/li><li>오디세이 항해(Voyage of the Odyssey)를 통해 해양 오염(ocean pollution) 연구<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-5\"><div class=\"lec-stage-head\">06법적 결실과 정책적 성과<\/div><ul><li>그의 헌신적인 노력은 해양 포유류 보호법 제정과 국제적인 포경 금지로 이어졌다.<\/li><li>해양 포유류(marine mammals) 보호를 위한 법안 제정에 기여<\/li><li>1986년 상업적 포경 금지(ban on commercial whaling) 발효의 결정적 토대 마련<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">biology<\/td><td class=\"m\">생물학<\/td><\/tr><tr><td class=\"w\">eventually<\/td><td class=\"m\">결국, 마침내<\/td><\/tr><tr><td class=\"w\">earn<\/td><td class=\"m\">얻다, 벌다<\/td><\/tr><tr><td class=\"w\">discover<\/td><td class=\"m\">발견하다, 알게 되다<\/td><\/tr><tr><td class=\"w\">complex<\/td><td class=\"m\">복잡한<\/td><\/tr><tr><td class=\"w\">communicate<\/td><td class=\"m\">의사소통하다<\/td><\/tr><tr><td class=\"w\">release<\/td><td class=\"m\">내놓다, 발표하다<\/td><\/tr><tr><td class=\"w\">movement<\/td><td class=\"m\">움직임, 이동<\/td><\/tr><tr><td class=\"w\">follow<\/td><td class=\"m\">따라가다, 따르다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">found<\/td><td class=\"m\">설립하다, 세우다<\/td><\/tr><tr><td class=\"w\">protect<\/td><td class=\"m\">보호하다, 지키다<\/td><\/tr><tr><td class=\"w\">harm<\/td><td class=\"m\">해, 피해<\/td><\/tr><tr><td class=\"w\">career<\/td><td class=\"m\">직업, 경력<\/td><\/tr><tr><td class=\"w\">lead<\/td><td class=\"m\">이끌다, ~에 이르다<\/td><\/tr><tr><td class=\"w\">research<\/td><td class=\"m\">연구, 조사<\/td><\/tr><tr><td class=\"w\">trip<\/td><td class=\"m\">여행<\/td><\/tr><tr><td class=\"w\">include<\/td><td class=\"m\">(including) ~을 포함하여<\/td><\/tr><tr><td class=\"w\">pollution<\/td><td class=\"m\">오염, 공해<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Roger Payne <span class=\"grammar-hl\">was born<\/span><\/b><\/span><span class=\"ko\">Roger Payne은 태어났다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in Manhattan<\/b><\/span><span class=\"ko\">맨해튼에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in 1935.<\/b><\/span><span class=\"ko\">1935년에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Roger Payne은 1935년에 맨해튼에서 태어났다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로, 이후 고래 보호의 대부로 성장하게 될 인물의 출생 배경을 제시하며 전기적 서술을 시작합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was born (수동태): be동사(was)+p.p.(born) 구조. bear는 타동사인데 목적어가 없어서 수동구조 was born 형태로 쓴다. 기본구조: V + O (아이를 낳다)<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He studied biology<\/b><\/span><span class=\"ko\">그는 생물학을 공부했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at Harvard University<\/b><\/span><span class=\"ko\">하버드 대학교에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and eventually earned his Ph.D.<\/b><\/span><span class=\"ko\">그리고 마침내 박사 학위를 받았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from Cornell University<\/b><\/span><span class=\"ko\">코넬 대학교에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in 1961.<\/b><\/span><span class=\"ko\">1961년에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 하버드 대학교에서 생물학을 공부했고, 마침내 1961년에 코넬 대학교에서 박사 학위를 받았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> eventually earned his Ph.D.는 그가 학문적 기초를 탄탄히 다졌음을 보여주며, 앞으로 그가 보여줄 발견들이 단순한 추측이 아닌 전문적인 과학적 근거를 바탕으로 한 것임을 시사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">studied ... and eventually earned (병렬구조): 등위접속사 and를 통해 두 개의 과거 동사 studied와 earned가 연결되어 주어 He에 공통으로 걸리는 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">biology<\/td><td class=\"m\">생물학<\/td><\/tr><tr><td class=\"w\">eventually<\/td><td class=\"m\">결국, 마침내<\/td><\/tr><tr><td class=\"w\">earn<\/td><td class=\"m\">얻다, 벌다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In 1967,<\/b><\/span><span class=\"ko\">1967년에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he discovered<\/b><\/span><span class=\"ko\">그는 발견했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that humpback whales make long and complex sounds<\/span>.<\/b><\/span><span class=\"ko\">혹등고래가 길고 복잡한 소리를 낸다는 것을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">1967년에 그는 혹등고래가 길고 복잡한 소리를 낸다는 것을 발견했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> long and complex sounds는 고래의 소리가 우연히 발생하는 소음이 아니라 일정한 체계를 갖춘 고도의 산물임을 처음으로 알아차렸다는 의미입니다. 앞 문장의 학문적 배경이 실제적인 연구 성과로 이어진 대목입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that humpback whales make long and complex sounds 명사절 that: 접속사 that이 이끄는 절이 타동사 discovered의 목적어 역할을 한다. (동격의 that 아님)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">discover<\/td><td class=\"m\">발견하다, 알게 되다<\/td><\/tr><tr><td class=\"w\">complex<\/td><td class=\"m\">복잡한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>They're known<\/b><\/span><span class=\"ko\">그것들은 알려져 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as \"whale songs,\"<\/b><\/span><span class=\"ko\">&#39;고래 노래&#39;라고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and he showed<\/b><\/span><span class=\"ko\">그리고 그는 보여줬다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that whales use them<\/b><\/span><span class=\"ko\">고래들이 그것들을 사용한다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to communicate<\/span>.<\/b><\/span><span class=\"ko\">의사소통하기 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것들은 &#39;고래 노래&#39;라고 알려져 있고, 그는 고래들이 의사소통하기 위해 그것들을 사용한다는 것을 보여줬다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> whale songs라는 표현은 고래의 소리에 &#39;음악적&#39;이고 &#39;지적&#39;인 가치를 부여한 것이며, 이를 통해 고래가 서로 정보를 주고받는 사회적 동물임을 증명했다는 사실을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are known (수동태): be동사(are)+p.p.(known) 구조. know는 타동사인데 목적어가 없어서 수동구조 are known 형태로 쓴다. 기본구조: know + O + as B (A를 B로 알다)<\/div><div class=\"lec-gr-item\">to communicate (to부정사(부사적): 목적): in order to로 바꿔도 뜻이 같으므로 부사적 용법이다. (의사소통하기 위해서)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">communicate<\/td><td class=\"m\">의사소통하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Then in 1970,<\/b><\/span><span class=\"ko\">그 후 1970년에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he released an album Songs of the Humpback Whale<span class=\"grammar-hl\">,<\/span><\/b><\/span><span class=\"ko\">그는 Songs of the Humpback Whale 앨범을 발표했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> became a surprise hit<\/b><\/span><span class=\"ko\">(그런데) 그것은 놀라운 인기를 얻었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">helped start<\/span><\/b><\/span><span class=\"ko\">그리고 시작하는 것을 도왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the global \"Save the Whales\" movement.<\/b><\/span><span class=\"ko\">전세계적인 &#39;Save the Whales&#39; 운동을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 후 1970년에 그는 Songs of the Humpback Whale 앨범을 발표했는데, 그것은 놀라운 인기를 얻었고 전세계적인 &#39;Save the Whales&#39; 운동을 시작하는 것을 도왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> became a surprise hit은 과학적 발견이 상업적인 매체(앨범)를 통해 대중의 감성을 자극했다는 의미입니다. 이 문장은 학술적 연구가 어떻게 사회적 캠페인으로 확장되었는지를 보여주는 핵심적인 전환점입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">, which (관계대명사): 앞의 명사(album)를 선행사로 하여 부연 설명하는 주격 관계대명사의 계속적 용법이다.<\/div><div class=\"lec-gr-item\">helped start 준사역동사 help의 구조: help는 목적어나 목적격보어로 to부정사 혹은 동사원형을 취할 수 있으며, 여기서는 to가 생략된 동사원형 start가 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">release<\/td><td class=\"m\">내놓다, 발표하다<\/td><\/tr><tr><td class=\"w\">movement<\/td><td class=\"m\">움직임, 이동<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The following year,<\/b><\/span><span class=\"ko\">다음 해에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he founded Ocean Alliance<\/b><\/span><span class=\"ko\">그는 Ocean Alliance를 설립했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to protect<\/span> whales and the earth's oceans,<\/b><\/span><span class=\"ko\">고래와 지구의 해양을 보호하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and he used new, safe methods<\/b><\/span><span class=\"ko\">그리고 그는 새롭고 안전한 방법을 사용했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to study<\/span> whales<\/b><\/span><span class=\"ko\">고래를 연구하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>without <span class=\"grammar-hl\">harming<\/span> them.<\/b><\/span><span class=\"ko\">그들을 해치지 않고.<\/span><\/div><\/div><div class=\"lec-sent-ko\">다음 해에 그는 고래와 지구의 해양을 보호하기 위해 Ocean Alliance를 설립했고, 그들을 해치지 않고 고래를 연구하는 새롭고 안전한 방법을 사용했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> without harming them은 과거의 관행적인 연구 방식과 달리, 연구 대상인 생명체의 안전을 최우선으로 하는 윤리적인 과학 연구의 모델을 제시했음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to protect (to부정사(부사적): 목적): in order to로 바꿔도 뜻이 같으므로 부사적 용법이다. (고래를 보호하기 위해서)<\/div><div class=\"lec-gr-item\">to study (to부정사(부사적): 목적): in order to로 바꿔도 뜻이 같으므로 부사적 용법이다. (고래를 연구하기 위해서)<\/div><div class=\"lec-gr-item\">harming (동명사): -ing가 전치사 without의 목적어 역할을 하는 명사 역할이므로 동명사이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">follow<\/td><td class=\"m\">따라가다, 따르다<\/td><\/tr><tr><td class=\"w\">found<\/td><td class=\"m\">설립하다, 세우다<\/td><\/tr><tr><td class=\"w\">protect<\/td><td class=\"m\">보호하다, 지키다<\/td><\/tr><tr><td class=\"w\">harm<\/td><td class=\"m\">해, 피해<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Over his career,<\/b><\/span><span class=\"ko\">그의 경력 동안<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he led more than 100 research trips worldwide,<\/b><\/span><span class=\"ko\">그는 전세계적으로 100회 이상의 연구 탐사를 이끌었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">including<\/span> the Voyage of the Odyssey<\/b><\/span><span class=\"ko\">Voyage of the Odyssey를 포함하여<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from 2000 to 2005<span class=\"grammar-hl\">,<\/span><\/b><\/span><span class=\"ko\">2000년에서 2005년까지의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> studied ocean pollution.<\/b><\/span><span class=\"ko\">(그런데) 그것은 해양 오염을 연구했다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그의 경력 동안 그는 전세계적으로 100회 이상의 연구 탐사를 이끌었고, 여기에는 해양 오염을 연구한 2000년에서 2005년까지의 Voyage of the Odyssey를 포함한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> including the Voyage of the Odyssey는 그의 관심사가 단순히 고래라는 종의 생태를 넘어, 고래가 살아가는 환경인 바다 전체의 건강 상태로 확장되었음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">including (분사구문): 현재분사 including이 부사적 기능으로 쓰여 정보를 덧붙인다. (원래 절 변환: as it included the Voyage of the Odyssey)<\/div><div class=\"lec-gr-item\">, which (관계대명사): 앞의 고유명사를 선행사로 하여 부연 설명하는 주격 관계대명사의 계속적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">career<\/td><td class=\"m\">직업, 경력<\/td><\/tr><tr><td class=\"w\">research<\/td><td class=\"m\">연구, 조사<\/td><\/tr><tr><td class=\"w\">trip<\/td><td class=\"m\">여행<\/td><\/tr><tr><td class=\"w\">include<\/td><td class=\"m\">(including) ~을 포함하여<\/td><\/tr><tr><td class=\"w\">pollution<\/td><td class=\"m\">오염, 공해<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>His work helped make laws<\/b><\/span><span class=\"ko\">그의 연구는 법을 제정하는 것을 도왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that protect<\/span> marine mammals<span class=\"grammar-hl\">,<\/span><\/b><\/span><span class=\"ko\">해양 포유류를 보호하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> finally led to<\/b><\/span><span class=\"ko\">(그런데) 그것은 결국 ~로 이어졌다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the global ban on commercial <span class=\"grammar-hl\">whaling<\/span><\/b><\/span><span class=\"ko\">상업적 고래 포획에 관한 세계적인 금지로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in 1986.<\/b><\/span><span class=\"ko\">1986년에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그의 연구는 해양 포유류를 보호하는 법을 제정하는 것을 도왔는데, 이는 결국 1986년 상업적 고래 포획에 관한 세계적인 금지를 이끌었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> global ban on commercial whaling은 한 과학자의 연구와 대중 운동이 결국 법적·정치적 결실을 보아 전 세계적인 제도 변화를 이끌어냈다는 글의 최종적인 결론입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that protect (관계대명사): 선행사인 laws를 수식하는 주격 관계대명사이다. that절 내부에서 주어가 빠진 불완전한 문장이 이어진다.<\/div><div class=\"lec-gr-item\">, which (관계대명사): 앞 절의 내용(mammals를 보호하는 법을 만든 것)을 선행사로 받는 주격 관계대명사의 계속적 용법이다.<\/div><div class=\"lec-gr-item\">whaling (동명사): whaling(고래잡이)은 행위와 활동을 나타내는 명사적 개념으로 쓰였으므로 동명사이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">protect<\/td><td class=\"m\">보호하다, 지키다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>로저 페인은 탄탄한 학문적 배경을 가진 생물학자로, 혹등고래의 소리가 복잡한 의사소통 수단인 &#39;노래&#39;임을 발견했다.<\/li><li>그는 이 소리를 앨범으로 제작해 대중에게 알림으로써 전 세계적인 고래 보호 운동의 기폭제 역할을 했다.<\/li><li>연구를 넘어 단체 설립과 윤리적 연구 방법 도입을 통해 해양 생태계 보호에 앞장섰다.<\/li><li>그의 헌신적인 연구와 활동은 결국 1986년 상업 포경의 전면 금지라는 역사적인 법적 성과를 만들어냈다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Roger Payne revolutionized marine biology by discovering whale songs and dedicated his life to environmental activism to achieve a global ban on commercial whaling.<\/div>\n              <div class=\"lec-final-sum-ko\">로저 페인은 고래의 노래를 발견함으로써 해양 생물학에 혁명을 일으켰으며, 상업적 포경의 전 세계적 금지를 달성하기 위해 환경 운동에 일생을 바쳤다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./26_audio/1.mp3","hl":null}],[{"audio":"./26_audio/2.mp3","hl":null}],[{"audio":"./26_audio/3.mp3","hl":null},{"audio":"./26_audio/4.mp3","hl":"stage-0"},{"audio":"./26_audio/5.mp3","hl":"stage-1"},{"audio":"./26_audio/6.mp3","hl":"stage-2"},{"audio":"./26_audio/7.mp3","hl":"stage-3"},{"audio":"./26_audio/8.mp3","hl":"stage-4"},{"audio":"./26_audio/9.mp3","hl":"stage-5"}],[{"audio":"./26_audio/10.mp3","hl":null}],[{"audio":"./26_audio/11.mp3","hl":"main"},{"audio":"./26_audio/12.mp3","hl":"meaning"},{"audio":"./26_audio/13.mp3","hl":"grammar"}],[{"audio":"./26_audio/14.mp3","hl":"main"},{"audio":"./26_audio/15.mp3","hl":"meaning"},{"audio":"./26_audio/16.mp3","hl":"grammar"}],[{"audio":"./26_audio/17.mp3","hl":"main"},{"audio":"./26_audio/18.mp3","hl":"meaning"},{"audio":"./26_audio/19.mp3","hl":"grammar"}],[{"audio":"./26_audio/20.mp3","hl":"main"},{"audio":"./26_audio/21.mp3","hl":"meaning"},{"audio":"./26_audio/22.mp3","hl":"grammar"}],[{"audio":"./26_audio/23.mp3","hl":"main"},{"audio":"./26_audio/24.mp3","hl":"meaning"},{"audio":"./26_audio/25.mp3","hl":"grammar"}],[{"audio":"./26_audio/26.mp3","hl":"main"},{"audio":"./26_audio/27.mp3","hl":"meaning"},{"audio":"./26_audio/28.mp3","hl":"grammar"}],[{"audio":"./26_audio/29.mp3","hl":"main"},{"audio":"./26_audio/30.mp3","hl":"meaning"},{"audio":"./26_audio/31.mp3","hl":"grammar"}],[{"audio":"./26_audio/32.mp3","hl":"main"},{"audio":"./26_audio/33.mp3","hl":"meaning"},{"audio":"./26_audio/34.mp3","hl":"grammar"}],[{"audio":"./26_audio/35.mp3","hl":null}]],"fileName":"EBS올림포스(연합기출)고1 2026년 09강 01번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"EBS올림포스(연합기출)고1 2026년 09강 01번","titleEn":"Roger Payne: The Scientist Who Saved Whales Through Their Songs","titleKo":"로저 페인: 고래의 노래를 통해 고래를 구한 과학자","imageUrl":"__enpImg__","stages":[{"label":"01학문적 기반 마련","items":["로저 페인은 하버드와 코넬 대학에서 생물학을 전공하며 학문적 토대를 쌓았다.","1961년 코넬 대학교에서 박사 학위(Ph.D.) 취득","생물학(biology) 전문 지식을 갖춘 학자로 성장"]},{"label":"02혹등고래 노래의 발견","items":["1967년 혹등고래가 복잡한 소리를 통해 의사소통한다는 사실을 최초로 발견했다.","고래의 소리를 '고래 노래(whale songs)'라고 명명함","고래들이 소리를 소통(communicate) 수단으로 사용함을 입증"]},{"label":"03환경 보호 운동의 확산","items":["고래 노래 앨범 발매를 통해 전 세계적인 고래 보호 여론을 형성했다.","1970년 '혹등고래의 노래(Songs of the Humpback Whale)' 앨범 발매","'고래를 구하자(Save the Whales)' 운동의 시초가 됨"]},{"label":"04전문 연구 단체 설립","items":["해양 보호를 위한 단체를 설립하고 고래에게 무해한 새로운 연구 방식을 도입했다.","1971년 오션 얼라이언스(Ocean Alliance) 설립","고래에게 해를 끼치지 않는 안전한 방법(safe methods)으로 연구 수행"]},{"label":"05해양 오염 조사와 탐사","items":["전 세계를 무대로 수많은 연구 탐사를 이끌며 해양 생태계 전반을 조사했다.","100회 이상의 세계적인 연구 탐사(research trips) 주도","오디세이 항해(Voyage of the Odyssey)를 통해 해양 오염(ocean pollution) 연구"]},{"label":"06법적 결실과 정책적 성과","items":["그의 헌신적인 노력은 해양 포유류 보호법 제정과 국제적인 포경 금지로 이어졌다.","해양 포유류(marine mammals) 보호를 위한 법안 제정에 기여","1986년 상업적 포경 금지(ban on commercial whaling) 발효의 결정적 토대 마련"]}],"bkg":"혹등고래(Humpback Whale)는 단순히 소리를 내는 것이 아니라 음악처럼 일정한 패턴과 리듬이 있는 고래 노래(Whale Song)를 부르는 아주 특별한 해양 생물입니다. 로저 페인 박사가 개척한 생물음향학(Bioacoustics)은 동물의 소리를 통해 그들의 의사소통 방식과 생태를 연구하는 학문으로, 당시 고래를 그저 기름을 얻기 위한 자원으로만 보던 사람들의 인식을 완전히 바꾸어 놓았습니다. 마치 우리가 좋아하는 유행가가 바뀌듯 고래들도 계절마다 노래 형식을 바꾸며 수천 킬로미터 떨어진 동료들과 교감한다는 사실은 대중들에게 고래를 지능적인 생명체로 각인시키는 결정적인 계기가 되었지요. 이러한 정서적 공감은 결국 무분별한 상업적 포경(Commercial Whaling)을 금지하자는 국제적인 목소리로 이어졌으며, 오늘날 우리가 당연하게 여기는 해양 포유류 보호(Marine Mammal Protection)의 법적 토대가 되었습니다. 이 글을 읽으며 한 과학자의 발견이 어떻게 세상을 바꾸는 거대한 운동으로 번져나갔는지 그 흐름을 생각하며 읽어보세요.","ttsText":"혹등고래(Humpback Whale)는 단순히 소리를 내는 것이 아니라 음악처럼 일정한 패턴과 리듬이 있는 고래 노래(Whale Song)를 부르는 아주 특별한 해양 생물입니다. 로저 페인 박사가 개척한 생물음향학(Bioacoustics)은 동물의 소리를 통해 그들의 의사소통 방식과 생태를 연구하는 학문으로, 당시 고래를 그저 기름을 얻기 위한 자원으로만 보던 사람들의 인식을 완전히 바꾸어 놓았습니다. 마치 우리가 좋아하는 유행가가 바뀌듯 고래들도 계절마다 노래 형식을 바꾸며 수천 킬로미터 떨어진 동료들과 교감한다는 사실은 대중들에게 고래를 지능적인 생명체로 각인시키는 결정적인 계기가 되었지요. 이러한 정서적 공감은 결국 무분별한 상업적 포경(Commercial Whaling)을 금지하자는 국제적인 목소리로 이어졌으며,
