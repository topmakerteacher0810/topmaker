M5HX1/L9Dn0/Kkn16dP6fn+gDqDx/8AWpNy/wB4enUdfSkLDgZHPTn06n/PXp60eV+nz9QF9u/0P59OO+M8cd6X+h9v8/yNJkHoR37+nXken+cUgZSSoIJxyOvH+f50wHUdPx/yf8aTIHGQMDPJH4k859Mk+tICvXI/McZ7fp/Oj+v8gF6fif1wT/L8un0Wmhh0yMkkDkdjg9znBwD6EjIFLkeo/wD180fgH9fl/mvvQtFJuGcZHQnqO3X8R39KTco6kdcD/P5/Xt2yAOpPqPf8j7fSjgj2OCOfpj07/wCe1JuU4wR3/DHX37fTj6ZAFPOO3f8Aw/Xnr2x3pfrRxn3x+lFAABj6UUmR7f5zn8u/p3oyOn/1+v8An8B7Uk73/r+vwAWj8elFA/znP9aYBRSZA6nucf1zj0/TvzzQxwGOCcAnA74BOAPU0f13A//Z\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">Beyond the Senses: How Tools Reveal the Invisible World<small>감각 너머: 도구가 보이지 않는 세계를 드러내는 방법<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">우리 인간은 신체 구조상 가시광선(Visible Light)이나 가청 주파수처럼 아주 좁은 범위의 정보만을 직접 받아들일 수 있는 감각적 한계(Sensory Limitation)를 가지고 있습니다. 하지만 과학 기술의 발전으로 우리는 망원경(Telescope)이나 현미경(Microscope)과 같은 도구를 사용하여 신체적 능력을 증폭하거나, 보이지 않는 전자기파(Electromagnetic Wave)를 시각적 이미지로 변환하여 세상을 관찰하게 되었죠. 이는 마치 라디오 안테나가 공중에 떠도는 보이지 않는 신호를 소리로 바꿔주는 것처럼, 우리 곁에 존재하지만 느끼지 못했던 자연 현상(Natural Phenomena)을 인간이 이해할 수 있는 형태의 신호 변환(Signal Transduction) 과정을 통해 전달해 주는 원리라고 이해하시면 좋습니다. 결과적으로 이러한 도구들은 인간의 신체를 넘어선 감각의 확장(Extension of Senses)을 가능케 함으로써, 우리가 우주나 미시 세계의 비밀을 탐구하는 데 핵심적인 역할을 수행합니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01인지 도구의 도입<\/div><ul><li>인간은 감각으로 지각할 수 없는 자연 현상을 인식하기 위해 오래전부터 도구를 사용해 왔다.<\/li><li>감각(senses)의 한계를 넘어서는 자연 현상의 인식<\/li><li>도구의 역할: 현상을 번역(translate)하여 지각(perception) 가능하게 함<\/li><li>핵심 키워드: 도구(tools), 자연 현상(natural phenomena)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02기존 감각의 단순 증폭<\/div><ul><li>정상적인 감각 기능을 강화하여 멀거나 흐릿한 신호를 명확하게 만든다.<\/li><li>기존 감각 입력에 공급되는 신호를 단순히 증폭(amplifying)함<\/li><li>사례: 육안으로 보기 힘든 먼 대상까지 보여주는 망원경(telescopes)<\/li><li>핵심 키워드: 신호(signals), 관찰(observe)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03감각 영역의 변환 및 확장<\/div><ul><li>인간이 지각할 수 없는 신호를 관찰 가능한 형태로 바꾸어 감각의 범위를 넓힌다.<\/li><li>현재 감각의 도달 범위(reach)를 물리적으로 확장함<\/li><li>자외선(ultraviolet spectrum)을 가시적인 이미지로 시각화<\/li><li>가청 범위를 벗어난 소리를 들을 수 있는 신호(audible signals)로 변환<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04새로운 물리적 속성의 측정<\/div><ul><li>인간에게 아예 감지 능력이 없는 속성을 측정하여 관찰 가능한 형태로 바꾼다.<\/li><li>인간이 감각 능력(sensory capacity)을 전혀 갖추지 못한 영역의 탐구<\/li><li>측정(measure)된 데이터를 인간이 인식할 수 있는 형태로 변화(change)시킴<\/li><li>핵심 키워드: 속성(properties), 인지 능력 확장<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">advantage<\/td><td class=\"m\">(take advantage of) ~을 활용하다<\/td><\/tr><tr><td class=\"w\">translate<\/td><td class=\"m\">번역하다, 옮기다<\/td><\/tr><tr><td class=\"w\">perception<\/td><td class=\"m\">인식, 지각<\/td><\/tr><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 지각하다<\/td><\/tr><tr><td class=\"w\">consist<\/td><td class=\"m\">(consist of) ~로 이루어지다<\/td><\/tr><tr><td class=\"w\">simply<\/td><td class=\"m\">단순히, 그저<\/td><\/tr><tr><td class=\"w\">amplify<\/td><td class=\"m\">증폭시키다, 키우다<\/td><\/tr><tr><td class=\"w\">signal<\/td><td class=\"m\">신호<\/td><\/tr><tr><td class=\"w\">feed<\/td><td class=\"m\">(feed into) ~로 흘러들다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sensory<\/td><td class=\"m\">감각의<\/td><\/tr><tr><td class=\"w\">input<\/td><td class=\"m\">투입, 의견<\/td><\/tr><tr><td class=\"w\">telescope<\/td><td class=\"m\">망원경<\/td><\/tr><tr><td class=\"w\">instrument<\/td><td class=\"m\">악기<\/td><\/tr><tr><td class=\"w\">observe<\/td><td class=\"m\">관찰하다, 보다<\/td><\/tr><tr><td class=\"w\">form<\/td><td class=\"m\">서식, 신청서<\/td><\/tr><tr><td class=\"w\">expand<\/td><td class=\"m\">넓히다, 확장하다<\/td><\/tr><tr><td class=\"w\">current<\/td><td class=\"m\">해류, 전류, 흐름<\/td><\/tr><tr><td class=\"w\">visible<\/td><td class=\"m\">눈에 보이는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>For many centuries,<\/b><\/span><span class=\"ko\">수 세기 동안<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>humans <span class=\"grammar-hl\">have taken advantage of<\/span> <span class=\"grammar-hl\">tools<\/span><\/b><\/span><span class=\"ko\">인간은 도구들을 이용해 왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that translate<\/span> and bring into our perception<\/b><\/span><span class=\"ko\">바꾸고 우리의 지각 속으로 가져오는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>natural <span class=\"grammar-hl\">phenomena<\/span><\/b><\/span><span class=\"ko\">자연 현상을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that we can't perceive<\/span> with our senses.<\/b><\/span><span class=\"ko\">우리의 감각으로는 지각할 수 없는<\/span><\/div><\/div><div class=\"lec-sent-ko\">수 세기 동안, 인간은 우리의 감각으로는 지각할 수 없는 자연 현상을 바꾸고 우리의 지각으로 가져오는 도구들을 이용해 왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 문장은 글의 도입부로, 인간이 가진 신체적 감각의 한계를 도구를 통해 극복해 온 역사를 제시합니다. taken advantage of tools는 인간이 단순히 도구를 사용한 것을 넘어, 자연의 숨겨진 정보를 읽어내기 위해 기술을 적극적으로 활용해 왔음을 의미합니다. translate and bring into our perception은 도구가 일종의 통역사 역할을 하여, 원래는 인간이 느낄 수 없는 형태의 데이터를 우리가 이해할 수 있는 시각이나 청각 정보로 변환해 주었다는 뜻입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">have taken advantage of (관용표현): &#39;...을 이용하다&#39;라는 의미로 굳어진 표현이다.<\/div><div class=\"lec-gr-item\">tools that translate (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사 tools를 수식하는 구조다.<\/div><div class=\"lec-gr-item\">phenomena that we can&#39;t perceive (관계대명사): 목적격 관계대명사 that이 이끄는 절이 선행사 phenomena를 수식하며, perceive의 목적어가 비어 있는 불완전한 절이 이어진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">advantage<\/td><td class=\"m\">(take advantage of) ~을 활용하다<\/td><\/tr><tr><td class=\"w\">translate<\/td><td class=\"m\">번역하다, 옮기다<\/td><\/tr><tr><td class=\"w\">perception<\/td><td class=\"m\">인식, 지각<\/td><\/tr><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 지각하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In some cases,<\/b><\/span><span class=\"ko\">어떤 경우에는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>this consists of simply <span class=\"grammar-hl\">amplifying<\/span> <span class=\"grammar-hl\">signals<\/span><\/b><\/span><span class=\"ko\">이것은 단순히 신호를 확장하는 것으로 구성된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that feed<\/span> into our normal sensory inputs<\/b><\/span><span class=\"ko\">우리의 일반적인 감각 입력으로 들어오는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>(e.g., telescopes can bring into clear view<\/b><\/span><span class=\"ko\">(예를 들어, 망원경은 명확한 시야로 가져올 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that which<\/span> is too far away<\/b><\/span><span class=\"ko\">너무 멀리 떨어져 있는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for our eyes <span class=\"grammar-hl\">to perceive<\/span> on their own).<\/b><\/span><span class=\"ko\">우리 눈이 그 자체로 지각하기에는)<\/span><\/div><\/div><div class=\"lec-sent-ko\">어떤 경우에는, 이것은 우리의 일반적인 감각 입력으로 들어오는 신호를 단순히 확장하는 것(예: 망원경은 너무 멀어서 우리 눈이 그 자체로 지각할 수 없는 것을 명확한 시야로 가져올 수 있다)으로 구성된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 도구의 역할 중 첫 번째 방식인 &#39;증폭&#39;을 설명합니다. amplifying signals는 이미 우리 감각 기관이 받아들일 수 있는 종류의 데이터(빛 등)이지만, 그 세기나 크기가 너무 작거나 멀어서 놓치는 것을 기술적으로 키워준다는 의미입니다. on their own은 도구의 도움 없이는 인간의 생물학적 눈이 가진 한계 때문에 정보를 처리할 수 없음을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">amplifying (동명사): 전치사 of의 목적어로 쓰여 명사 역할을 하는 -ing 형태다.<\/div><div class=\"lec-gr-item\">signals that feed (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사 signals를 수식하는 구조다.<\/div><div class=\"lec-gr-item\">that which (관계대명사): 대명사 that을 선행사로 하여 목적격 관계대명사 which가 이끄는 절이 이를 수식하며, perceive의 목적어가 생략된 구조다.<\/div><div class=\"lec-gr-item\">to perceive (to부정사(부사적): 형용사 수식): 앞에 형용사 far가 있어 이를 수식하는 구조다. in order to로 바꾸어 의미가 성립하지 않으므로 형용사 수식의 부사적 용법으로 본다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 지각하다<\/td><\/tr><tr><td class=\"w\">consist<\/td><td class=\"m\">(consist of) ~로 이루어지다<\/td><\/tr><tr><td class=\"w\">simply<\/td><td class=\"m\">단순히, 그저<\/td><\/tr><tr><td class=\"w\">amplify<\/td><td class=\"m\">증폭시키다, 키우다<\/td><\/tr><tr><td class=\"w\">signal<\/td><td class=\"m\">신호<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">feed<\/td><td class=\"m\">(feed into) ~로 흘러들다<\/td><\/tr><tr><td class=\"w\">sensory<\/td><td class=\"m\">감각의<\/td><\/tr><tr><td class=\"w\">input<\/td><td class=\"m\">투입, 의견<\/td><\/tr><tr><td class=\"w\">telescope<\/td><td class=\"m\">망원경<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Other instruments<\/b><\/span><span class=\"ko\">다른 도구들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>turn <span class=\"grammar-hl\">signals<\/span><\/b><\/span><span class=\"ko\">신호를 바꾼다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that we cannot perceive<\/span><\/b><\/span><span class=\"ko\">우리가 인지할 수 없는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>into <span class=\"grammar-hl\">ones<\/span><\/b><\/span><span class=\"ko\">것들로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that we can observe<\/span>.<\/b><\/span><span class=\"ko\">우리가 관찰할 수 있는<\/span><\/div><\/div><div class=\"lec-sent-ko\">다른 도구들은 우리가 인지할 수 없는 신호를 우리가 관찰할 수 있는 것으로 바꾼다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 말한 단순 증폭과는 다른, 두 번째 방식인 &#39;변환&#39;을 소개하며 논의를 확장합니다. turn signals ... into ones that we can observe는 데이터의 본질적인 형태를 바꾸는 과정을 말합니다. 즉, 인간의 감각 시스템이 아예 인식하지 못하는 영역의 신호를 인식 가능한 영역으로 완전히 재가공한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">signals that we cannot perceive (관계대명사): 목적격 관계대명사 that이 이끄는 절이 선행사 signals를 수식하며, perceive의 목적어가 비어 있는 구조다.<\/div><div class=\"lec-gr-item\">ones that we can observe (관계대명사): 목적격 관계대명사 that이 이끄는 절이 선행사 ones를 수식하며, observe의 목적어가 비어 있는 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 지각하다<\/td><\/tr><tr><td class=\"w\">signal<\/td><td class=\"m\">신호<\/td><\/tr><tr><td class=\"w\">instrument<\/td><td class=\"m\">악기<\/td><\/tr><tr><td class=\"w\">observe<\/td><td class=\"m\">관찰하다, 보다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Some of these take the form<\/b><\/span><span class=\"ko\">이것들 중 일부는 형태를 취한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of <span class=\"grammar-hl\">expanding<\/span> the reach<\/b><\/span><span class=\"ko\">범위를 확장하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of our current senses,<\/b><\/span><span class=\"ko\">우리의 현재 감각의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>such as <span class=\"grammar-hl\">creating<\/span> visible <span class=\"grammar-hl\">images<\/span><\/b><\/span><span class=\"ko\">가시 이미지를 생성하는 것과 같은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">based on<\/span> the ultraviolet spectrum of light<\/b><\/span><span class=\"ko\">빛의 자외선 스펙트럼을 기반으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or <span class=\"grammar-hl\">changing<\/span> <span class=\"grammar-hl\">sounds<\/span><\/b><\/span><span class=\"ko\">혹은 소리를 바꾸는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that are normally<\/span> outside the range of what human ears can hear<\/b><\/span><span class=\"ko\">보통은 인간의 귀가 들을 수 있는 것의 범위 밖에 있는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>into audible signals.<\/b><\/span><span class=\"ko\">들을 수 있는 신호로<\/span><\/div><\/div><div class=\"lec-sent-ko\">이러한 도구 중 일부는 우리의 현재 감각 범위를 확장하는 빛의 자외선 스펙트럼을 기반으로 가시 이미지를 생성하거나 보통은 인간의 귀가 들을 수 있는 것의 범위 밖에 있는 소리를 들을 수 있는 신호로 바꾸는 것과 같이 형태를 취한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 3번 문장에서 말한 &#39;변환&#39;의 구체적인 예시를 들어 뒷받침합니다. expanding the reach of our current senses는 시각이나 청각이라는 기존의 감각 틀 안에서, 그 허용 범위를 넘어서는 자외선이나 초음파 같은 영역까지 정보를 끌어다 쓰는 것을 의미합니다. into audible signals는 인간의 귀가 들을 수 있는 주파수로 소리의 높낮이를 조정하여 정보를 전달한다는 구체적인 방법론을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">expanding (동명사): 전치사 of의 목적어 자리에 쓰여 &#39;확장하는 것&#39;이라는 명사적 개념으로 쓰인 -ing 형태다.<\/div><div class=\"lec-gr-item\">creating (동명사): 전치사구 such as의 목적어 역할을 하는 명사적 성격의 -ing 형태다.<\/div><div class=\"lec-gr-item\">images based on (과거분사(형용사)): based가 명사 images를 수식하며 &#39;기반을 둔 이미지&#39;라는 의미를 만든다. images that are based on의 축약된 형태다.<\/div><div class=\"lec-gr-item\">changing (동명사): or를 통해 creating과 병렬로 연결되어 such as의 목적어 역할을 수행하는 -ing 형태다.<\/div><div class=\"lec-gr-item\">sounds that are normally (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사 sounds를 수식하는 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">signal<\/td><td class=\"m\">신호<\/td><\/tr><tr><td class=\"w\">form<\/td><td class=\"m\">서식, 신청서<\/td><\/tr><tr><td class=\"w\">expand<\/td><td class=\"m\">넓히다, 확장하다<\/td><\/tr><tr><td class=\"w\">current<\/td><td class=\"m\">해류, 전류, 흐름<\/td><\/tr><tr><td class=\"w\">visible<\/td><td class=\"m\">눈에 보이는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Alternatively,<\/b><\/span><span class=\"ko\">아니면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>some instruments measure <span class=\"grammar-hl\">properties<\/span><\/b><\/span><span class=\"ko\">일부 도구들은 속성을 측정한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">for which we have<\/span> no sensory capacity at all<\/b><\/span><span class=\"ko\">우리가 전혀 감각 수용 능력이 없는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and change them<\/b><\/span><span class=\"ko\">그리고 그것들을 바꾼다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>into <span class=\"grammar-hl\">that<\/span><\/b><\/span><span class=\"ko\">것으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which we can observe<\/span>.<\/b><\/span><span class=\"ko\">우리가 관찰할 수 있는<\/span><\/div><\/div><div class=\"lec-sent-ko\">아니면, 일부 도구들은 우리가 전혀 감각 수용 능력이 없는 속성을 측정하고 이를 우리가 관찰할 수 있는 것으로 그것들을 바꾼다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 예시들보다 더 나아간 세 번째 단계로, 인간에게 아예 해당 감각 기관이 존재하지 않는 영역을 다룹니다. no sensory capacity at all은 자기장이나 방사능처럼 인간이 몸으로 직접 느낄 수 있는 수용체가 아예 없는 물리적 성질들을 가리킵니다. 글쓴이는 이런 보이지 않는 힘들을 도구가 대신 측정해서 우리가 눈으로 볼 수 있는 수치나 그래프로 바꾸어 준다는 점을 강조하며 글을 마무리합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">properties for which we have 전치사 + 관계대명사 + S + V: 전치사 for와 관계대명사 which가 결합하여 선행사 properties를 수식한다. 관계대명사 뒤에는 주어(we)와 동사(have)가 갖춰진 완전한 절(완전문장)이 온다.<\/div><div class=\"lec-gr-item\">that which we can observe (관계대명사): 대명사 that을 선행사로 하고 목적격 관계대명사 which가 이끄는 절이 이를 수식하며, observe 뒤에 목적어가 없는 불완전한 절이 이어진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sensory<\/td><td class=\"m\">감각의<\/td><\/tr><tr><td class=\"w\">instrument<\/td><td class=\"m\">악기<\/td><\/tr><tr><td class=\"w\">observe<\/td><td class=\"m\">관찰하다, 보다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>인간은 아주 오래전부터 감각의 한계를 극복하기 위해 다양한 도구를 사용해 왔다.<\/li><li>첫 번째 방식은 망원경처럼 약한 신호를 크게 키워주는 &#39;증폭&#39; 방식이다.<\/li><li>두 번째 방식은 자외선이나 특정 소리처럼 감각 범위 밖의 신호를 인식 가능한 형태로 바꾸는 &#39;확장&#39; 방식이다.<\/li><li>세 번째 방식은 인간에게 아예 감각 기관이 없는 물리적 성질을 측정하여 관찰 가능하게 만드는 &#39;완전한 변환&#39; 방식이다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Humans employ technological instruments to extend their sensory limitations by transforming imperceivable natural signals into observable information.<\/div>\n              <div class=\"lec-final-sum-ko\">인간은 감지할 수 없는 자연 신호를 관찰 가능한 정보로 변환함으로써 자신의 감각적 한계를 확장하기 위해 기술적 도구를 활용한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./23_audio/1.mp3","hl":null}],[{"audio":"./23_audio/2.mp3","hl":null}],[{"audio":"./23_audio/3.mp3","hl":null},{"audio":"./23_audio/4.mp3","hl":"stage-0"},{"audio":"./23_audio/5.mp3","hl":"stage-1"},{"audio":"./23_audio/6.mp3","hl":"stage-2"},{"audio":"./23_audio/7.mp3","hl":"stage-3"}],[{"audio":"./23_audio/8.mp3","hl":null}],[{"audio":"./23_audio/9.mp3","hl":"main"},{"audio":"./23_audio/10.mp3","hl":"meaning"},{"audio":"./23_audio/11.mp3","hl":"grammar"}],[{"audio":"./23_audio/12.mp3","hl":"main"},{"audio":"./23_audio/13.mp3","hl":"meaning"},{"audio":"./23_audio/14.mp3","hl":"grammar"}],[{"audio":"./23_audio/15.mp3","hl":"main"},{"audio":"./23_audio/16.mp3","hl":"meaning"},{"audio":"./23_audio/17.mp3","hl":"grammar"}],[{"audio":"./23_audio/18.mp3","hl":"main"},{"audio":"./23_audio/19.mp3","hl":"meaning"},{"audio":"./23_audio/20.mp3","hl":"grammar"}],[{"audio":"./23_audio/21.mp3","hl":"main"},{"audio":"./23_audio/22.mp3","hl":"meaning"},{"audio":"./23_audio/23.mp3","hl":"grammar"}],[{"audio":"./23_audio/24.mp3","hl":null}]],"fileName":"EBS올림포스(연합기출)고1 2026년 06강 01번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"EBS올림포스(연합기출)고1 2026년 06강 01번","titleEn":"Beyond the Senses: How Tools Reveal the Invisible World","titleKo":"감각 너머: 도구가 보이지 않는 세계를 드러내는 방법","imageUrl":"__enpImg__","stages":[{"label":"01인지 도구의 도입","items":["인간은 감각으로 지각할 수 없는 자연 현상을 인식하기 위해 오래전부터 도구를 사용해 왔다.","감각(senses)의 한계를 넘어서는 자연 현상의 인식","도구의 역할: 현상을 번역(translate)하여 지각(perception) 가능하게 함","핵심 키워드: 도구(tools), 자연 현상(natural phenomena)"]},{"label":"02기존 감각의 단순 증폭","items":["정상적인 감각 기능을 강화하여 멀거나 흐릿한 신호를 명확하게 만든다.","기존 감각 입력에 공급되는 신호를 단순히 증폭(amplifying)함","사례: 육안으로 보기 힘든 먼 대상까지 보여주는 망원경(telescopes)","핵심 키워드: 신호(signals), 관찰(observe)"]},{"label":"03감각 영역의 변환 및 확장","items":["인간이 지각할 수 없는 신호를 관찰 가능한 형태로 바꾸어 감각의 범위를 넓힌다.","현재 감각의 도달 범위(reach)를 물리적으로 확장함","자외선(ultraviolet spectrum)을 가시적인 이미지로 시각화","가청 범위를 벗어난 소리를 들을 수 있는 신호(audible signals)로 변환"]},{"label":"04새로운 물리적 속성의 측정","items":["인간에게 아예 감지 능력이 없는 속성을 측정하여 관찰 가능한 형태로 바꾼다.","인간이 감각 능력(sensory capacity)을 전혀 갖추지 못한 영역의 탐구","측정(measure)된 데이터를 인간이 인식할 수 있는 형태로 변화(change)시킴","핵심 키워드: 속성(properties), 인지 능력 확장"]}],"bkg":"우리 인간은 신체 구조상 가시광선(Visible Light)이나 가청 주파수처럼 아주 좁은 범위의 정보만을 직접 받아들일 수 있는 감각적 한계(Sensory Limitation)를 가지고 있습니다.
