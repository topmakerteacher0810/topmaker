class=\"lec-cover-bkg-txt\">과거의 영상 편집은 테이프를 처음부터 끝까지 돌려가며 순서대로 이어 붙이는 선형 편집(Linear Editing) 방식이었지만, 기술의 발전으로 이제는 순서에 상관없이 원하는 부분에 바로 접근하는 비선형 편집(Nonlinear Editing)이 표준이 되었습니다. 이 방식의 핵심인 임의 접근(Random Access)은 마치 두꺼운 백과사전에서 원하는 페이지를 한 번에 펼치는 것과 같아서, 테이프를 앞뒤로 감는 번거로움 없이 디지털 데이터(Digital Data) 상태로 저장된 영상을 자유롭게 편집할 수 있게 해줍니다. 지문에서 언급된 타자기와 워드프로세서의 비유처럼, 비선형 시스템은 중간에 새로운 장면을 끼워 넣거나 삭제해도 컴퓨터가 자동으로 전체 길이를 조절해주어 작업 효율성을 획기적으로 높여줍니다. 또한, 장면 전환 효과(Transitions)나 속도 조절 같은 복잡한 시각 효과도 마우스 클릭 몇 번으로 손쉽게 구현할 수 있어 제작자가 더욱 창의적인 작업에 집중할 수 있는 환경을 제공합니다. 이러한 기술적 변화는 편집을 단순한 물리적 결합을 넘어 실시간 수정과 실험이 가능한 예술적 과정으로 변화시켰다는 점에 주목하며 글을 읽어보시길 바랍니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01비선형 편집의 기본 개념<\/div><ul><li>현대의 편집 시스템은 무작위 접근이 가능한 컴퓨터 기반의 비선형 방식을 사용한다.<\/li><li>원하는 장면을 찾기 위해 빨리 감기나 되감기를 할 필요가 없음<\/li><li>모든 영상 장면에 대한 무작위 접근(random access) 가능<\/li><li>핵심 키워드: 비선형 시스템(nonlinear systems)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02기능적 장점과 효율성<\/div><ul><li>비선형 시스템은 다양한 특수 효과를 구현하고 편집 과정을 획기적으로 단축한다.<\/li><li>슬로 모션, 와이프, 디졸브 등 다양한 특수 효과(special effects) 제작 가능<\/li><li>프로그램의 어느 지점에서든 장면을 자유롭게 추가하거나 삭제 가능<\/li><li>컴퓨터가 편집된 프로그램의 길이(program length)를 자동으로 조정함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03과거 선형 편집의 한계<\/div><ul><li>과거의 선형 편집은 수정이 매우 어렵고 번거로운 작업이었다.<\/li><li>선형 편집(linear editing)은 타자기(typewriter)로 글을 쓰는 것과 유사함<\/li><li>수정이나 정보 추가가 필요할 경우 전체를 다시 작업(retyped)해야 함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04워드 프로세서와 같은 편의성<\/div><ul><li>비선형 편집은 현대의 문서 작성 프로그램처럼 수정과 보완이 매우 간편하다.<\/li><li>오류 발생 시 몇 번의 키 입력(keystrokes)만으로 삭제 및 수정 가능<\/li><li>새로운 정보를 쉽게 추가할 수 있는 워드 프로세싱 프로그램(word processing program) 방식<\/li><li>편집자가 원하는 샷을 찾는 데 드는 시간과 노력을 최소화함<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">edit<\/td><td class=\"m\">고치다, 편집하다<\/td><\/tr><tr><td class=\"w\">process<\/td><td class=\"m\">과정, 절차<\/td><\/tr><tr><td class=\"w\">allow<\/td><td class=\"m\">허용하다, ~하게 해 주다<\/td><\/tr><tr><td class=\"w\">random<\/td><td class=\"m\">무작위의, 임의의<\/td><\/tr><tr><td class=\"w\">access<\/td><td class=\"m\">접근, 이용 (권한)<\/td><\/tr><tr><td class=\"w\">shoot<\/td><td class=\"m\">(사진·영상을) 찍다, 촬영하다<\/td><\/tr><tr><td class=\"w\">scene<\/td><td class=\"m\">장면, 광경<\/td><\/tr><tr><td class=\"w\">fast<\/td><td class=\"m\">빠른, 빠르게<\/td><\/tr><tr><td class=\"w\">reverse<\/td><td class=\"m\">뒤집다, 뒤바꾸다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">range<\/td><td class=\"m\">범위<\/td><\/tr><tr><td class=\"w\">motion<\/td><td class=\"m\">움직임, 동작<\/td><\/tr><tr><td class=\"w\">dissolve<\/td><td class=\"m\">녹다, 녹이다<\/td><\/tr><tr><td class=\"w\">highlight<\/td><td class=\"m\">강조하다, 부각시키다<\/td><\/tr><tr><td class=\"w\">editor<\/td><td class=\"m\">편집자<\/td><\/tr><tr><td class=\"w\">desire<\/td><td class=\"m\">욕구, 갈망<\/td><\/tr><tr><td class=\"w\">remove<\/td><td class=\"m\">없애다, 제거하다<\/td><\/tr><tr><td class=\"w\">adjust<\/td><td class=\"m\">조절하다, 맞추다<\/td><\/tr><tr><td class=\"w\">length<\/td><td class=\"m\">길이<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>All <span class=\"grammar-hl\">editing systems<\/span><\/b><\/span><span class=\"ko\">모든 편집 시스템은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are now nonlinear <span class=\"grammar-hl\">computer-based<\/span> systems<\/b><\/span><span class=\"ko\">이제 비선형 컴퓨터 기반 시스템이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that allow<\/span> random access to any video shot or scene<\/b><\/span><span class=\"ko\">어떤 비디오 숏이나 장면으로의 임의적 접근을 가능하게 하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>without <span class=\"grammar-hl\">having<\/span> to fast forward or fast reverse<\/b><\/span><span class=\"ko\">빨리 감거나 빨리 되감기를 할 필요 없이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to find it<\/span>.<\/b><\/span><span class=\"ko\">그것을 찾기 위해<\/span><\/div><\/div><div class=\"lec-sent-ko\">모든 편집 시스템은 이제 어떤 비디오 화면이나 장면을 찾기 위해 빨리 감기나 빨리 되감기를 할 필요 없이 어떤 비디오 숏이나 장면으로의 임의적 접근을 가능하게 하는 비선형 컴퓨터 기반 시스템이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> allow random access는 테이프를 처음부터 끝까지 물리적으로 돌려볼 필요 없이, 편집자가 원하는 시점을 즉시 클릭하여 작업을 시작할 수 있는 기술적 환경을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">editing systems (동명사): editing이 systems의 용도나 목적을 나타내는 명사적 성격으로 쓰여 systems를 수식한다(= &#39;편집을 위한 시스템&#39;).<\/div><div class=\"lec-gr-item\">computer-based (과거분사(형용사)): computer-based가 systems를 수식하여 상태를 설명하는 형용사 역할을 한다(= &#39;컴퓨터에 기반한&#39;).<\/div><div class=\"lec-gr-item\">that allow (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사 nonlinear computer-based systems를 수식하며, 절 내에서 주어 역할을 수행한다.<\/div><div class=\"lec-gr-item\">having (동명사): 전치사 without의 목적어로 쓰여 명사 역할을 하는 -ing 형태이다.<\/div><div class=\"lec-gr-item\">to find it (to부정사(부사적): 목적): &#39;찾기 위해서&#39;라는 의미로, in order to find it으로 바꿔 쓸 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">edit<\/td><td class=\"m\">고치다, 편집하다<\/td><\/tr><tr><td class=\"w\">allow<\/td><td class=\"m\">허용하다, ~하게 해 주다<\/td><\/tr><tr><td class=\"w\">random<\/td><td class=\"m\">무작위의, 임의의<\/td><\/tr><tr><td class=\"w\">access<\/td><td class=\"m\">접근, 이용 (권한)<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scene<\/td><td class=\"m\">장면, 광경<\/td><\/tr><tr><td class=\"w\">fast<\/td><td class=\"m\">빠른, 빠르게<\/td><\/tr><tr><td class=\"w\">reverse<\/td><td class=\"m\">뒤집다, 뒤바꾸다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Nonlinear systems <span class=\"grammar-hl\">can create<\/span> a range of special effects,<\/b><\/span><span class=\"ko\">비선형 시스템은 다양한 특수 효과를 만들 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>such as slow motion, wipes and dissolves.<\/b><\/span><span class=\"ko\">슬로 모션, 와이프 그리고 디졸브 같은<\/span><\/div><\/div><div class=\"lec-sent-ko\">비선형 시스템은 슬로 모션, 와이프 그리고 디졸브 같은 다양한 특수 효과를 만들 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 시스템의 기본 기능에 이어 추가적인 장점을 나열합니다. a range of special effects는 컴퓨터 소프트웨어를 활용해 영상의 속도를 조절하거나 장면 사이를 자연스럽게 겹치게 하는 등의 시각적 연출이 디지털 환경에서 매우 자유로워졌음을 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">can create (문장구조): 조동사 can과 일반동사 원형 create가 결합하여 문장의 술부(V)를 형성하며, 뒤에 목적어 a range of special effects를 취하는 3형식 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">range<\/td><td class=\"m\">범위<\/td><\/tr><tr><td class=\"w\">motion<\/td><td class=\"m\">움직임, 동작<\/td><\/tr><tr><td class=\"w\">dissolve<\/td><td class=\"m\">녹다, 녹이다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Another highlight<\/b><\/span><span class=\"ko\">또 다른 주요 특징은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of a digital nonlinear system<\/b><\/span><span class=\"ko\">디지털 비선형 시스템의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is its random access process<\/b><\/span><span class=\"ko\">그것의 임의적 접근 과정이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that makes<\/span> <span class=\"grammar-hl\">it<\/span> easy for an editor <span class=\"grammar-hl\">to find<\/span> <span class=\"grammar-hl\">desired<\/span> shots or scenes<\/b><\/span><span class=\"ko\">편집자가 원하는 숏이나 장면을 찾는 것을 쉽게 해주는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>without <span class=\"grammar-hl\">having<\/span> to spend time <span class=\"grammar-hl\">fast forwarding or rewinding<\/span> videotape.<\/b><\/span><span class=\"ko\">비디오테이프를 빨리 감거나 되감는 데 시간을 들일 필요 없이<\/span><\/div><\/div><div class=\"lec-sent-ko\">디지털 비선형 시스템의 또 다른 주요 특징은 편집자가 비디오테이프를 빨리 감거나 되감는 데 시간을 들일 필요 없이 원하는 숏이나 장면을 찾는 것을 쉽게 해주는 그것의 임의적 접근 과정이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 1번 문장에서 언급한 특징을 다시 한번 강조하며 작업자의 편의성을 부각합니다. without having to spend time은 과거 아날로그 방식에서 가장 큰 장애물이었던 물리적 탐색 시간을 획기적으로 줄여 영상 제작의 속도가 비약적으로 상승했음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that makes (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사 its random access process를 수식하며, 절 내에서 주어 역할을 한다.<\/div><div class=\"lec-gr-item\">makes it easy for an editor to find 5형식(SVOC) 구조: 동사(makes) + 가목적어(it) + 목적격보어(easy) + 진목적어(to find ...) 구조로 이루어져 있다.<\/div><div class=\"lec-gr-item\">it (가주어): 진주어: 5형식 구조에서 목적어 자리가 길어질 때 사용하는 가목적어(it)이며, 뒤의 to find 이하가 실제 목적어(진목적어)이다.<\/div><div class=\"lec-gr-item\">to find (to부정사(명사적)): 가목적어 it이 가리키는 진짜 목적어(진목적어) 자리에 쓰여 명사 역할을 한다.<\/div><div class=\"lec-gr-item\">desired (과거분사(형용사)): desired가 명사인 shots or scenes를 수식하여 상태를 설명한다(= &#39;원하는 장면들&#39;).<\/div><div class=\"lec-gr-item\">having (동명사): 전치사 without의 목적어로 쓰인 명사적 성격의 -ing 형태이다.<\/div><div class=\"lec-gr-item\">fast forwarding or rewinding (동명사): spend + 시간 + -ing 구문에서 시간의 소요 내용을 나타내는 명사적 성격의 -ing 형태이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">edit<\/td><td class=\"m\">고치다, 편집하다<\/td><\/tr><tr><td class=\"w\">process<\/td><td class=\"m\">과정, 절차<\/td><\/tr><tr><td class=\"w\">random<\/td><td class=\"m\">무작위의, 임의의<\/td><\/tr><tr><td class=\"w\">access<\/td><td class=\"m\">접근, 이용 (권한)<\/td><\/tr><tr><td class=\"w\">scene<\/td><td class=\"m\">장면, 광경<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fast<\/td><td class=\"m\">빠른, 빠르게<\/td><\/tr><tr><td class=\"w\">highlight<\/td><td class=\"m\">강조하다, 부각시키다<\/td><\/tr><tr><td class=\"w\">editor<\/td><td class=\"m\">편집자<\/td><\/tr><tr><td class=\"w\">desire<\/td><td class=\"m\">욕구, 갈망<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>With nonlinear editing,<\/b><\/span><span class=\"ko\">비선형 편집으로는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>shots or scenes<\/b><\/span><span class=\"ko\">숏이나 장면을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">can be easily added or removed<\/span><\/b><\/span><span class=\"ko\">쉽게 추가하거나 삭제할 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>anywhere in the program,<\/b><\/span><span class=\"ko\">프로그램의 어디에나<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and the computer adjusts the program length<\/b><\/span><span class=\"ko\">그리고 컴퓨터는 프로그램의 길이를 조정한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>automatically.<\/b><\/span><span class=\"ko\">자동으로<\/span><\/div><\/div><div class=\"lec-sent-ko\">비선형 편집으로는 숏이나 장면을 프로그램의 어디에나 쉽게 추가하거나 삭제할 수 있으며, 컴퓨터는 프로그램의 길이를 자동으로 조정한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> adjusts the program length automatically는 영상 중간에 새로운 장면을 끼워 넣거나 뺄 때, 뒤에 오는 장면들의 위치를 편집자가 일일이 수동으로 옮길 필요 없이 시스템이 알아서 전체 분량을 맞춰준다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">can be easily added or removed (수동태): be동사(be)+p.p.(added, removed) 구조. add와 remove는 타동사인데 뒤에 목적어가 없어서 수동구조 can be added or removed 형태로 쓴다. 기본구조: add O / remove O.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">edit<\/td><td class=\"m\">고치다, 편집하다<\/td><\/tr><tr><td class=\"w\">scene<\/td><td class=\"m\">장면, 광경<\/td><\/tr><tr><td class=\"w\">remove<\/td><td class=\"m\">없애다, 제거하다<\/td><\/tr><tr><td class=\"w\">adjust<\/td><td class=\"m\">조절하다, 맞추다<\/td><\/tr><tr><td class=\"w\">length<\/td><td class=\"m\">길이<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Linear editing<\/b><\/span><span class=\"ko\">선형 편집은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>was like <span class=\"grammar-hl\">composing<\/span> a paper<\/b><\/span><span class=\"ko\">글을 작성하는 것과 같았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on a typewriter.<\/b><\/span><span class=\"ko\">타자기로<\/span><\/div><\/div><div class=\"lec-sent-ko\">선형 편집은 타자기로 글을 작성하는 것과 같았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이제까지 설명한 비선형 편집의 장점을 강조하기 위해 과거의 방식인 선형 편집을 비유를 통해 소개합니다. composing a paper on a typewriter는 한 번 글자를 찍으면 수정이 매우 까다롭고 처음부터 끝까지 순서대로만 작업해야 했던 과거 방식의 물리적 제약을 시사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">composing (동명사): 전치사 like의 목적어로 쓰여 &#39;작성하는 것&#39;이라는 명사적 의미를 나타내는 -ing 형태이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">edit<\/td><td class=\"m\">고치다, 편집하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If a mistake <span class=\"grammar-hl\">was made<\/span> or new information needed <span class=\"grammar-hl\">to be added<\/span><\/b><\/span><span class=\"ko\">만약 실수가 생겼거나 새로운 정보가 추가되어야 할 필요가 있다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the whole piece <span class=\"grammar-hl\">had to be retyped<\/span>.<\/b><\/span><span class=\"ko\">전체를 다시 작성해야 했다<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 실수가 생겼거나 새로운 정보가 추가되어야 할 필요가 있다면, 전체를 다시 작성해야 했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 비유를 구체적으로 풀어내어 과거 방식의 고충을 설명합니다. the whole piece had to be retyped는 영상의 특정 부분을 고치기 위해 그 지점부터 영상의 끝부분까지 모든 내용을 다시 녹화하거나 복사해야 했던 비효율적인 재작업 과정을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was made (수동태): be동사(was)+p.p.(made) 구조. make는 타동사인데 뒤에 목적어가 없어서 수동구조 was made 형태로 쓴다. 기본구조: make O.<\/div><div class=\"lec-gr-item\">to be added (to부정사(명사적)): 동사 needed의 목적어로 쓰였으며, be동사(be)+p.p.(added) 수동형이 결합된 수동부정사이다. add는 타동사인데 목적어가 없어서 수동구조 to be added 형태로 쓴다. 기본구조: add O.<\/div><div class=\"lec-gr-item\">had to be retyped (수동태): be동사(be)+p.p.(retyped) 구조. retype는 타동사인데 뒤에 목적어가 없어서 수동구조 be retyped 형태로 쓴다. 기본구조: retype O.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Nonlinear editing,<\/b><\/span><span class=\"ko\">비선형 편집은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on the other hand,<\/b><\/span><span class=\"ko\">반면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is like <span class=\"grammar-hl\">using<\/span> a <span class=\"grammar-hl\">word processing<\/span> program.<\/b><\/span><span class=\"ko\">워드 프로세싱 프로그램을 사용하는 것과 같다<\/span><\/div><\/div><div class=\"lec-sent-ko\">비선형 편집은, 반면, 워드 프로세싱 프로그램을 사용하는 것과 같다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 선형 편집(타자기)과 대비되는 비선형 편집의 특징을 현대적인 도구에 비유합니다. like using a word processing program은 현재의 영상 편집이 컴퓨터 문서 파일처럼 원하는 위치에 커서를 두고 자유롭게 내용을 넣고 빼는 유연한 방식임을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">using (동명사): 전치사 like의 목적어로 쓰여 &#39;사용하는 것&#39;이라는 명사적 의미를 나타내는 -ing 형태이다.<\/div><div class=\"lec-gr-item\">word processing (현재분사(형용사)): processing이 program의 성질이나 상태를 수식하는 형용사적 성격의 -ing 형태이다(= &#39;단어를 처리하는 프로그램&#39;).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">edit<\/td><td class=\"m\">고치다, 편집하다<\/td><\/tr><tr><td class=\"w\">process<\/td><td class=\"m\">과정, 절차<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If a mistake <span class=\"grammar-hl\">is made<\/span>,<\/b><\/span><span class=\"ko\">만약 실수가 생기면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it <span class=\"grammar-hl\">is easily deleted and fixed<\/span><\/b><\/span><span class=\"ko\">그것은 쉽게 삭제되고 수정될 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with a few keystrokes,<\/b><\/span><span class=\"ko\">몇 번의 키 입력으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and new information<\/b><\/span><span class=\"ko\">그리고 새로운 정보가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">can be added<\/span> easily.<\/b><\/span><span class=\"ko\">쉽게 추가될 수 있다<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 실수가 생기면 그것은 몇 번의 키 입력으로 쉽게 삭제되고 수정될 수 있으며, 새로운 정보가 쉽게 추가될 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 전체 글을 마무리하며 현대적 편집 시스템이 주는 최종적인 혜택을 정리합니다. with a few keystrokes는 복잡한 기계 조작이나 물리적 재녹화 과정 없이, 간단한 단축키나 마우스 클릭만으로 실수를 바로잡고 내용을 보강할 수 있는 편리한 제작 환경을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is made (수동태): be동사(is)+p.p.(made) 구조. make는 타동사인데 뒤에 목적어가 없어서 수동구조 is made 형태로 쓴다. 기본구조: make O.<\/div><div class=\"lec-gr-item\">is easily deleted and fixed (수동태): be동사(is)+p.p.(deleted, fixed) 구조. delete와 fix는 타동사인데 뒤에 목적어가 없어서 수동구조 is deleted and fixed 형태로 쓴다. 기본구조: delete O / fix O.<\/div><div class=\"lec-gr-item\">can be added (수동태): be동사(be)+p.p.(added) 구조. add는 타동사인데 뒤에 목적어가 없어서 수동구조 can be added 형태로 쓴다. 기본구조: add O.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>과거의 선형 편집은 타자기로 글을 쓰는 것처럼 수정과 삽입이 매우 어렵고 비효율적이었다.<\/li><li>현대의 비선형 편집은 컴퓨터 기반 시스템으로, 영상의 어느 지점이든 즉시 접근할 수 있다.<\/li><li>영상의 중간 부분을 수정하더라도 전체 길이를 컴퓨터가 자동으로 조절해 주어 작업이 편리하다.<\/li><li>결과적으로 워드 프로세서처럼 자유로운 수정과 추가가 가능해져 영상 제작의 효율성이 극대화되었다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Nonlinear editing systems enable efficient and flexible video production through random access and easy content modification whereas linear systems require repetitive labor for any changes.<\/div>\n              <div class=\"lec-final-sum-ko\">비선형 편집 시스템은 무작위 접근과 손쉬운 내용 수정을 통해 효율적이고 유연한 영상 제작을 가능하게 하는 반면, 선형 시스템은 어떠한 변경에도 반복적인 노동을 요구한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./38_audio/1.mp3","hl":null}],[{"audio":"./38_audio/2.mp3","hl":null}],[{"audio":"./38_audio/3.mp3","hl":null},{"audio":"./38_audio/4.mp3","hl":"stage-0"},{"audio":"./38_audio/5.mp3","hl":"stage-1"},{"audio":"./38_audio/6.mp3","hl":"stage-2"},{"audio":"./38_audio/7.mp3","hl":"stage-3"}],[{"a 이었다.","선형 편집(linear editing)은 타자기(typewriter)로 글을 쓰는 것과 유사함","수정이나 정보 추가가 필요할 경우 전체를 다시 작업(retyped)해야 함"]},{"label":"04워드 프로세서와 같은 편의성","items":["비선형 편집은 현대의 문서 작성 프로그램처럼 수정과 보완이 매우 간편하다.","오류 발생 시 몇 번의 키 입력(keystrokes)만으로 삭제 및 수정 가능","새로운 정보를 쉽게 추가할 수 있는 워드 프로세싱 프로그램(word processing program) 방식","편집자가 원하는 샷을 찾는 데 드는 시간과 노력을 최소화함"]}],"bkg":"과거의 영상 편집은 테이프를 처음부터 끝까지 돌려가며 순서대로 이어 붙이는 선형 편집(Linear Editing) 방식이었지만, 기술의 발전으로 이제는 순서에 상관없이 원하는 부분에 바로 접근하는 비선형 편집(Nonlinear Editing)이 표준이 되었습니다. 이 방식의 핵심인 임의 접근(Random Access)은 마치 두꺼운 백과사전에서 원하는 페이지를 한 번에 펼치는 것과 같아서, 테이프를 앞뒤로 감는 번거로움 없이 디지털 데이터(Digital Data) 상태로 저장된 영상을 자유롭게 편집할 수 있게 해줍니다. 지문에서 언급된 타자기와 워드프로세서의 비유처럼, 비선형 시스템은 중간에 새로운 장면을 끼워 넣거나 삭제해도 컴퓨터가 자동으로 전체 길이를 조절해주어 작업 효율성을 획기적으로 높여줍니다. 또한, 장면 전환 효과(Transitions)나 속도 조절 같은 복잡한 시각 효과도 마우스 클릭 몇 번으로 손쉽게 구현할 수 있어 제작자가 더욱 창의적인 작업에 집중할 수 있는 환경을 제공합니다. 이러한 기술적 변화는 편집을 단순한 물리적 결합을 넘어 실시간 수정과 실험이 가능한 예술적 과정으로 변화시켰다는 점에 주목하며 글을 읽어보시길 바랍니다.","ttsText":"과거의 영상 편집은 테이프를 처음부터 끝까지 돌려가며 순서대로 이어 붙이는 선형 편집(Linear Editing) 방식이었지만, 기술의 발전으로 이제는 순서에 상관없이 원하는 부분에 바로 접근하는 비선형 편집(Nonlinear Editing)이 표준이 되었습니다. 이 방식의 핵심인 임의 접근(Random Access)은 마치 두꺼운 백과사전에서 원하는 페이지를 한 번에 펼치는 것과 같아서, 테이프를 앞뒤로 감는 번거로움 없이 디지털 데이터(Digital Data) 상태로 저장된 영상을 자유롭게 편집할 수 있게 해줍니다. 지문에서 언급된 타자기와 워드프로세서의 비유처럼, 비선형 시스템은 중간에 새로운 장면을 끼워 넣거나 삭제해도 컴퓨터가 자동으로 전체 길이를 조절해주어 작업 효율성을 획기적으로 높여줍니다. 또한, 장면 전환 효과(Transitions)나 속도 조절 같은 복잡한 시각 효과도 마우스 클릭 몇 번으로 손쉽게 구현할 수 있어 제작자가 더욱 창의적인 작업에 집중할 수 있는 환경을 제공합니다. 이러한 기술적 변화는 편집을 단순한 물리적 결합을 넘어 실시간 수정과 실험이 가능한 예술적 과정으로 변화시켰다는 점에 주목하며 글을 읽어보시길 바랍니다.","__passage":"EBS올림포스(연합기출)고1 2026년 17강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 38번","__script":"자, 오늘 우리가 함께 공부할 지문은 'EBS올림포스(연합기출)고1 2026년 17강 01번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"EBS올림포스(연합기출)고1 2026년 17강 01번","titleEn":"The Shift in Video Editing: From Linear Labor to Nonlinear Efficiency","titleKo":"영상 편집의 변화: 선형적 노동에서 비선형적 효율성으로","imageUrl":"__enpImg__","stages":[{"label":"01비선형 편집의 기본
