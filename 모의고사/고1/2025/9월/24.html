로 상관관계(Correlation)와 인과관계(Causality)의 차이입니다. 두 사건이 동시에 자주 일어난다고 해서 반드시 한쪽이 다른 쪽의 직접적인 원인이 되는 것은 아니며, 이는 마치 비가 올 때 사람들이 우산을 쓴다고 해서 &#39;우산&#39;이 &#39;비&#39;를 내리게 한 원인은 아닌 것과 같습니다. 현재 법체계상 모든 신약이나 수술 기법은 반드시 동물을 거쳐야만 하는 법적 필연성(Legal necessity)을 지니고 있기에, 모든 의학적 성공 뒤에는 늘 동물 실험이 따라붙을 수밖에 없는 구조적 특징이 있습니다. 하지만 비판적인 시각에서는 실험실 속의 데이터보다 실제 환자를 직접 관찰하고 치료하며 얻은 임상적 발견(Clinical discovery)이 인류 건강 증진에 훨씬 더 실질적인 기여를 해왔다고 강조하기도 합니다. 따라서 이 글을 읽으실 때는 동물 실험이 의학 발전의 진짜 결정적 요인인지, 아니면 제도적 절차에 의해 나타나는 동반 현상일 뿐인지 비판적으로 사고해 보시는 것이 좋습니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01의학 발전에 대한 반대론자들의 시각<\/div><ul><li>현대 의학만이 사망률 감소의 유일한 원인이 아니며, 동물 실험 외의 요인도 존재한다.<\/li><li>의학적 진보가 반드시 동물 실험의 결과물은 아님 (animal experimentation)<\/li><li>사망률 감소(decline in mortality)의 다양한 원인들<\/li><li>핵심 키워드: 반대론자(opponents)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02옹호자들의 상관관계 주장<\/div><ul><li>연구 옹호자들은 동물 실험과 의학 발전 사이의 높은 상관관계를 근거로 인과관계를 주장한다.<\/li><li>상관관계(correlation)를 바탕으로 한 인과관계 추론<\/li><li>동물 실험이 의학적 발전(medical advancement)을 일으켰다는 주장<\/li><li>핵심 키워드: 옹호자(defenders)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03상관관계의 원인으로서의 법적 규제<\/div><ul><li>반대론자들은 상관관계가 과학적 실효성이 아닌 법적 절차 때문에 발생한다고 반박한다.<\/li><li>모든 신약과 기술은 인간 사용 전 동물 실험을 거치도록 법(law)이 규정함<\/li><li>상관관계는 증거가 아닌 법적 필요성(legal necessity)의 결과임<\/li><li>핵심 키워드: 법적 규정(prescribes)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04임상적 발견의 실질적 기여<\/div><ul><li>의학적 성과는 동물 실험보다 임상적 발견과 연구에 더 큰 빚을 지고 있다는 증거가 제시된다.<\/li><li>임상적 발견(clinical discoveries)의 실질적이고 중요한 역할<\/li><li>동물 실험이 생물 의학적 발견(biomedical discovery)의 절대적 공헌자가 아님을 강조<\/li><li>핵심 키워드: 역사적 증거(historical evidence)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opponent<\/td><td class=\"m\">상대, 적수<\/td><\/tr><tr><td class=\"w\">experimentation<\/td><td class=\"m\">실험<\/td><\/tr><tr><td class=\"w\">argue<\/td><td class=\"m\">주장하다<\/td><\/tr><tr><td class=\"w\">medicine<\/td><td class=\"m\">의학, 의술<\/td><\/tr><tr><td class=\"w\">cause<\/td><td class=\"m\">~을 일으키다, 야기하다<\/td><\/tr><tr><td class=\"w\">decline<\/td><td class=\"m\">줄어들다, 쇠퇴하다<\/td><\/tr><tr><td class=\"w\">mortality<\/td><td class=\"m\">사망률, 사망자 수, 사망<\/td><\/tr><tr><td class=\"w\">medical<\/td><td class=\"m\">의학의, 의료의<\/td><\/tr><tr><td class=\"w\">advance<\/td><td class=\"m\">발전, 진보<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">contribute<\/td><td class=\"m\">기여하다, 이바지하다<\/td><\/tr><tr><td class=\"w\">result<\/td><td class=\"m\">결과<\/td><\/tr><tr><td class=\"w\">defender<\/td><td class=\"m\">옹호자, 수비수<\/td><\/tr><tr><td class=\"w\">research<\/td><td class=\"m\">연구, 조사<\/td><\/tr><tr><td class=\"w\">claim<\/td><td class=\"m\">주장하다<\/td><\/tr><tr><td class=\"w\">correlation<\/td><td class=\"m\">상관관계<\/td><\/tr><tr><td class=\"w\">practice<\/td><td class=\"m\">연습<\/td><\/tr><tr><td class=\"w\">advancement<\/td><td class=\"m\">발전, 진보<\/td><\/tr><tr><td class=\"w\">former<\/td><td class=\"m\">(the former) 전자<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Many opponents of animal experimentation<\/b><\/span><span class=\"ko\">많은 동물 실험 반대자들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>argue<\/b><\/span><span class=\"ko\">주장한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> <span class=\"grammar-hl\">not only is<\/span> modern medicine<\/b><\/span><span class=\"ko\">현대 의학이 ~일 뿐만 아니라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>not the only cause<\/b><\/span><span class=\"ko\">유일한 원인이 아닐<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for the decline in mortality,<\/b><\/span><span class=\"ko\">사망률 감소의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>many medical advances<\/b><\/span><span class=\"ko\">많은 의학적 발전이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> <span class=\"grammar-hl\">did contribute<\/span> to human health<\/b><\/span><span class=\"ko\">인간 건강에 기여했던<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>were not the result of animal experimentation.<\/b><\/span><span class=\"ko\">동물 실험의 결과가 아니었다고<\/span><\/div><\/div><div class=\"lec-sent-ko\">많은 동물 실험 반대자들은 현대 의학이 사망률 감소의 유일한 원인이 아닐 뿐만 아니라, 인간 건강에 기여했던 많은 의학적 발전이 동물 실험의 결과가 아니었다고 주장한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> decline in mortality는 위생 개선이나 영양 상태 변화 같은 의학 외적 요인이 인간의 수명 연장에 더 큰 기여를 했을 수 있다는 점을 시사합니다. 글의 도입부로서, 동물 실험이 의학 발전에 절대적이라는 통념에 의문을 제기하며 반대론자들의 핵심 논거를 제시하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">not only is (도치): 부정어구(not only)가 강조를 위해 문장 맨 앞에 위치하면서 [be동사(is) + 주어(modern medicine)]의 순서로 도치된 구조다.<\/div><div class=\"lec-gr-item\">that (관계대명사): many medical advances를 선행사로 하며, 이어지는 관계대명사절 내에서 주어 역할을 하는 주격 관계대명사다.<\/div><div class=\"lec-gr-item\">did contribute (강조구문): 일반동사 contribute의 의미를 강조하기 위해 동사원형 앞에 조동사 did를 덧붙인 강조 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opponent<\/td><td class=\"m\">상대, 적수<\/td><\/tr><tr><td class=\"w\">experimentation<\/td><td class=\"m\">실험<\/td><\/tr><tr><td class=\"w\">argue<\/td><td class=\"m\">주장하다<\/td><\/tr><tr><td class=\"w\">medicine<\/td><td class=\"m\">의학, 의술<\/td><\/tr><tr><td class=\"w\">cause<\/td><td class=\"m\">~을 일으키다, 야기하다<\/td><\/tr><tr><td class=\"w\">decline<\/td><td class=\"m\">줄어들다, 쇠퇴하다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mortality<\/td><td class=\"m\">사망률, 사망자 수, 사망<\/td><\/tr><tr><td class=\"w\">medical<\/td><td class=\"m\">의학의, 의료의<\/td><\/tr><tr><td class=\"w\">advance<\/td><td class=\"m\">발전, 진보<\/td><\/tr><tr><td class=\"w\">contribute<\/td><td class=\"m\">기여하다, 이바지하다<\/td><\/tr><tr><td class=\"w\">result<\/td><td class=\"m\">결과<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Defenders of research<\/b><\/span><span class=\"ko\">연구 옹호자들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>have claimed<\/b><\/span><span class=\"ko\">주장해 왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that since there is a strong correlation<\/b><\/span><span class=\"ko\">강한 상관관계가 있기 때문에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>between the practice of animal experimentation<\/b><\/span><span class=\"ko\">동물 실험의 관행과<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and medical advancement,<\/b><\/span><span class=\"ko\">의학적 발전 사이에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the former caused the latter.<\/b><\/span><span class=\"ko\">전자가 후자를 초래했다고<\/span><\/div><\/div><div class=\"lec-sent-ko\">연구 옹호자들은 동물 실험 실행과 의학적 발전 사이에 강한 상관관계가 있기 때문에 전자가 후자를 초래했다고 주장해왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> the former caused the latter는 동물 실험이 선행되었기에 의학적 발전이라는 결과가 뒤따랐다는 인과관계를 강조합니다. 앞 문장의 반대 의견에 대립하는 찬성 측의 전형적인 논리, 즉 &#39;함께 일어나는 일은 원인과 결과 관계&#39;라는 주장을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that since there is a strong correlation ... the latter 명사절(접속사 that): claimed의 목적어 역할을 하는 절이며, 내부에 이유를 나타내는 since 부사절을 포함하고 있다.<\/div><div class=\"lec-gr-item\">the former ... the latter (관용표현): &#39;전자&#39;와 &#39;후자&#39;를 나타내며, 문맥상 the former는 &#39;동물 실험 관행&#39;을, the latter는 &#39;의학적 진보&#39;를 지칭한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experimentation<\/td><td class=\"m\">실험<\/td><\/tr><tr><td class=\"w\">cause<\/td><td class=\"m\">~을 일으키다, 야기하다<\/td><\/tr><tr><td class=\"w\">medical<\/td><td class=\"m\">의학의, 의료의<\/td><\/tr><tr><td class=\"w\">advance<\/td><td class=\"m\">발전, 진보<\/td><\/tr><tr><td class=\"w\">defender<\/td><td class=\"m\">옹호자, 수비수<\/td><\/tr><tr><td class=\"w\">research<\/td><td class=\"m\">연구, 조사<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">claim<\/td><td class=\"m\">주장하다<\/td><\/tr><tr><td class=\"w\">correlation<\/td><td class=\"m\">상관관계<\/td><\/tr><tr><td class=\"w\">practice<\/td><td class=\"m\">연습<\/td><\/tr><tr><td class=\"w\">advancement<\/td><td class=\"m\">발전, 진보<\/td><\/tr><tr><td class=\"w\">former<\/td><td class=\"m\">(the former) 전자<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Opponents of research<\/b><\/span><span class=\"ko\">연구 반대자들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">reject this inference<\/span>.<\/b><\/span><span class=\"ko\">이 추론을 거부한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">연구 반대자들은 이 추론을 거부한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> reject this inference는 단순히 두 현상이 겹쳐 보인다고 해서 하나가 다른 하나의 원인이라고 단정 짓는 찬성 측의 논리적 허점을 정면으로 반박하며 논의를 전환하는 문장입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">reject this inference 3형식(SVO) 구조: 주어(Opponents of research), 동사(reject), 목적어(this inference)로 이루어진 전형적인 문장 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opponent<\/td><td class=\"m\">상대, 적수<\/td><\/tr><tr><td class=\"w\">research<\/td><td class=\"m\">연구, 조사<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>After all,<\/b><\/span><span class=\"ko\">결국,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we have independent reasons<\/b><\/span><span class=\"ko\">우리는 독립적인 이유를 가진다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to expect<\/span> these phenomena<\/b><\/span><span class=\"ko\">이러한 현상들이 ~할 것이라고 예상하게 하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to be correlated<\/span>.<\/b><\/span><span class=\"ko\">상관관계가 있을 것이라고<\/span><\/div><\/div><div class=\"lec-sent-ko\">결국, 우리는 이러한 현상들이 상관관계가 있을 것이라고 예상하게 하는 독립적인 이유를 가진다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> independent reasons는 동물 실험의 유효성 때문이 아니라, 전혀 다른 외부적인 강제성 때문에 두 현상이 묶여 보일 뿐이라는 점을 암시합니다. 이어질 문장에서 그 구체적인 &#39;법적 이유&#39;를 설명하기 위한 징검다리 역할을 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to expect (to부정사(형용사적)): 앞의 명사 reasons를 수식하며, &#39;~할/~하는&#39;으로 해석된다. 판별 근거: 명사의 내용을 한정하는 구조(위 4번 규칙)에 해당한다.<\/div><div class=\"lec-gr-item\">expect these phenomena to be correlated 5형식(SVOC) 구조: 동사 expect가 목적어(these phenomena)와 목적격보어(to be correlated)를 취하여 &#39;목적어가 ~할 것을 기대하다&#39;라는 의미를 만든다.<\/div><div class=\"lec-gr-item\">to be correlated (수동태): be동사(be)+p.p.(correlated) 구조. correlate는 타동사인데 목적어가 없어서 수동구조 be correlated 형태로 쓴다. 기본구조: correlate A with B (A를 B와 연관시키다).<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Since the law <span class=\"grammar-hl\">prescribes<\/span><\/b><\/span><span class=\"ko\">법이 규정하기 때문에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that all new drugs, prosthetic devices, and surgical techniques<\/span><\/b><\/span><span class=\"ko\">모든 신약들, 보철 장치들, 그리고 외과 기술들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">be tried<\/span> on animals<\/b><\/span><span class=\"ko\">동물들에게 시험 되어야 한다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>before they <span class=\"grammar-hl\">are used<\/span><\/b><\/span><span class=\"ko\">그것들이 사용되기 전에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in humans,<\/b><\/span><span class=\"ko\">인간에게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we will subsequently find<\/b><\/span><span class=\"ko\">우리는 그 결과로서 알게 될 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that all medical advances<\/b><\/span><span class=\"ko\">모든 의학적 발전이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">are correlated<\/span><\/b><\/span><span class=\"ko\">상관관계가 있다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with prior experimentation on animals.<\/b><\/span><span class=\"ko\">이전의 동물 실험과<\/span><\/div><\/div><div class=\"lec-sent-ko\">법이 모든 신약들, 보철 장치들 그리고 외과 기술들이 인간에게 사용되기 전에 동물에게 시험 되어야 한다고 규정하기 때문에, 우리는 그 결과로서 모든 의학적 발전들이 이전의 동물 실험과 상관관계가 있다는 것을 알게 될 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> law prescribes는 동물 실험이 의학적 필요에 의한 선택이 아니라 법적으로 강제된 절차임을 의미합니다. 즉, 법 때문에 어떤 의학적 성과가 나오든 항상 동물 실험이 앞서 행해질 수밖에 없는 구조적 필연성을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">prescribes that all new drugs, prosthetic devices, and surgical techniques be tried 당위성 that절(가정법 현재): prescribe(규정하다)와 같은 당위성을 나타내는 동사의 목적어 that절이며, 주어 뒤에 should가 생략된 동사원형 be가 쓰인 구조다. be는 동사원형(be)로 쓰여 ‘~되도록’이라는 당위의 의미를 형성한다.<\/div><div class=\"lec-gr-item\">be tried (수동태): be동사(be)+p.p.(tried) 구조. try는 타동사인데 목적어가 없어서 수동구조 be tried 형태로 쓴다. 기본구조: try A on B (A를 B에 시도/사용해보다).<\/div><div class=\"lec-gr-item\">are used (수동태): be동사(are)+p.p.(used) 구조. use는 타동사인데 목적어가 없어서 수동구조 are used 형태로 쓴다. 기본구조: V + O (목적어를 사용하다).<\/div><div class=\"lec-gr-item\">are correlated (수동태): be동사(are)+p.p.(correlated) 구조. correlate는 타동사인데 목적어가 없어서 수동구조 are correlated 형태로 쓴다. 기본구조: correlate A with B (A를 B와 연관시키다).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experimentation<\/td><td class=\"m\">실험<\/td><\/tr><tr><td class=\"w\">medical<\/td><td class=\"m\">의학의, 의료의<\/td><\/tr><tr><td class=\"w\">advance<\/td><td class=\"m\">발전, 진보<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Consequently,<\/b><\/span><span class=\"ko\">따라서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the correlation<\/b><\/span><span class=\"ko\">상관관계는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>between animal experimentation and medical discovery<\/b><\/span><span class=\"ko\">동물 실험과 의학적 발견 간의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is the result<\/b><\/span><span class=\"ko\">결과이지<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of legal necessity,<\/b><\/span><span class=\"ko\">법적 필요성의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>not <span class=\"grammar-hl\">evidence<\/span><\/b><\/span><span class=\"ko\">증거가 아니라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that animal experimentation led to medical advances<\/span>.<\/b><\/span><span class=\"ko\">동물 실험이 의학적 발전을 이끌었다는<\/span><\/div><\/div><div class=\"lec-sent-ko\">따라서, 동물 실험과 의학적 발견 간의 상관관계는 법적 필요성의 결과이지, 동물 실험이 의학적 발전을 이끌었다는 증거가 아니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> legal necessity는 우리가 목격하는 상관관계가 과학적 인과관계가 아니라 제도적으로 만들어진 겉모습에 불과하다는 점을 짚어줍니다. 앞서 언급된 법적 절차를 근거로 찬성 측의 주장이 논리적 착각임을 최종적으로 확인해 주는 문장입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">evidence that animal experimentation led to medical advances 동격의 that: 명사(evidence) + that절 구조로, 뒤에 오는 완전한 문장이 evidence의 구체적인 내용을 설명한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experimentation<\/td><td class=\"m\">실험<\/td><\/tr><tr><td class=\"w\">medical<\/td><td class=\"m\">의학의, 의료의<\/td><\/tr><tr><td class=\"w\">advance<\/td><td class=\"m\">발전, 진보<\/td><\/tr><tr><td class=\"w\">result<\/td><td class=\"m\">결과<\/td><\/tr><tr><td class=\"w\">correlation<\/td><td class=\"m\">상관관계<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Moreover,<\/b><\/span><span class=\"ko\">게다가,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>several influential physicians<\/b><\/span><span class=\"ko\">몇몇 영향력 있는 의사들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>have offered historical <span class=\"grammar-hl\">evidence<\/span><\/b><\/span><span class=\"ko\">역사적 증거를 제시해 왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that animal experimentation<\/span><\/b><\/span><span class=\"ko\">동물 실험이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">has not been as responsible<\/span><\/b><\/span><span class=\"ko\">그만큼 원인이 아니었다는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">for biomedical discovery<\/span><\/b><\/span><span class=\"ko\">생의학적 발견에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as defenders suggest<\/span>.<\/b><\/span><span class=\"ko\">옹호자들이 주장하는 것만큼<\/span><\/div><\/div><div class=\"lec-sent-ko\">게다가, 몇몇 영향력 있는 의사들은 동물 실험이 옹호자들이 주장하는 것만큼 생의학적 발견의 원인이 아니었다는 역사적 증거를 제시해 왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> historical evidence는 앞선 법적·논리적 비판에 더해 실제 과거 사례라는 실증적 데이터를 통해 반대 측의 주장에 힘을 싣는 추가적인 논거입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">evidence that animal experimentation has not been as responsible for biomedical discovery as defenders suggest 동격의 that: 명사(evidence) + that절 구조로, 뒤에 오는 완전한 문장이 evidence가 어떤 내용인지를 상세히 설명한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">experimentation<\/td><td class=\"m\">실험<\/td><\/tr><tr><td class=\"w\">medical<\/td><td class=\"m\">의학의, 의료의<\/td><\/tr><tr><td class=\"w\">defender<\/td><td class=\"m\">옹호자, 수비수<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>They claim<\/b><\/span><span class=\"ko\">그들은 주장한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that clinical discoveries<\/b><\/span><span class=\"ko\">임상적 발견들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>played a more substantial role<\/b><\/span><span class=\"ko\">더 중요한 역할을 했다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than animal researchers<\/b><\/span><span class=\"ko\">동물 연구자들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>have <span class=\"grammar-hl\">led us to believe<\/span>.<\/b><\/span><span class=\"ko\">우리가 믿게 해 온 것보다<\/span><\/div><\/div><div class=\"lec-sent-ko\">그들은 임상적 발견들이 동물 연구자들이 우리가 믿게 해 온 것보다 더 중요한 역할을 했다고 주장한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> clinical discoveries는 동물이 아닌 실제 사람을 진료하고 관찰하며 얻은 지식이 의학 발전에 결정적인 동력이었다는 점을 강조합니다. 동물 실험의 공로라고 알려진 것들이 사실은 인간 대상의 임상 연구 덕분이었다는 반대론자들의 최종 결론입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">led us to believe 5형식(SVOC) 구조: lead + O + to V 구조로, 목적어(us)가 목적격보어인 to부정사(to believe) 하도록 만든다는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">to believe (목적격보어(to부정사)): lead + O + to V(5형식) 구조에서 목적어(us)의 동작이나 상태를 보충 설명하는 역할을 수행한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">research<\/td><td class=\"m\">연구, 조사<\/td><\/tr><tr><td class=\"w\">claim<\/td><td class=\"m\">주장하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>동물 실험 반대론자들은 사망률 감소와 의학 발전이 동물 실험 덕분이라는 주장에 의문을 제기한다.<\/li><li>찬성론자들은 동물 실험 뒤에 의학 발전이 뒤따랐으므로 둘 사이에 인과관계가 있다고 주장한다.<\/li><li>그러나 반대론자들은 법적으로 모든 의학적 시도를 하기 전에 동물 실험을 거쳐야만 하기에 상관관계가 나타나는 것뿐이라고 반박한다.<\/li><li>즉, 동물 실험과 의학 발전의 연결고리는 과학적 필연성이 아니라 법적 강제성에 의한 결과일 뿐이다.<\/li><li>일부 의사들은 역사적으로 볼 때 동물 실험보다 인간을 직접 관찰한 임상적 발견이 의학 발전에 더 큰 기여를 했다고 주장한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">While a correlation exists between animal testing and medical progress, it stems from legal necessity rather than direct causation as clinical discoveries have historically played a more significant role.<\/div>\n              <div class=\"lec-final-sum-ko\">동물 실험과 의학 발전 사이에 상관관계가 존재함에도 불구하고, 임상적 발견이 역사적으로 더 중요한 역할을 해왔기에 이는 직접적인 인과관계보다는 법적 필연성에서 비롯된 것이다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./24_audio/1.mp3","hl":null}],[{"audio":"./24_audio/2.mp3","hl":null}],[{"audio":"./24_audio/3.mp3","hl":null},{"audio":"./24_audio/4.mp3","hl":"stage-0"},{"audio":"./24_audio/5.mp3","hl":"stage-1"},{"audio":"./24_audio/6.mp3","hl":"stage-2"},{"audio":"./24_audio/7.mp3","hl":"stage-3"}],[{"audio":"./24_audio/8.mp3","hl":null}],[{"audio":"./24_audio/9.mp3","hl":"main"},{"audio":"./24_audio/10.mp3","hl":"meaning"},{"audio":"./24_audio/11.mp3","hl":"grammar"}],[{"audio":"./24_audio/12.mp3","hl":"main"},{"audio":"./24_audio/13.mp3","hl":"meaning"},{"audio":"./24_audio/14.mp3","hl":"grammar"}],[{"audio":"./24_audio/15.mp3","hl":"main"},{"audio":"./24_audio/16.mp3","hl":"meaning"},{"audio":"./24_audio/17.mp3","hl":"grammar"}],[{"audio":"./24_audio/18.mp3","hl":"main"},{"audio":"./24_audio/19.mp3","hl":"meaning"},{"audio":"./24_audio/20.mp3","hl":"grammar"}],[{"audio":"./24_audio/21.mp3","hl":"main"},{"audio":"./24_audio/22.mp3","hl":"meaning"},{"audio":"./24_audio/23.mp3","hl":"grammar"}],[{"audio":"./24_audio/24.mp3","hl":"main"},{"audio":"./24_audio/25.mp3","hl":"meaning"},{"audio":"./24_audio/26.mp3","hl":"grammar"}],[{"audio":"./24_audio/27.mp3","hl":"main"},{"audio":"./24_audio/28.mp3","hl":"meaning"},{"audio":"./24_audio/29.mp3","hl":"grammar"}],[{"audio":"./24_audio/30.mp3","hl":"main"},{"audio":"./24_audio/31.mp3","hl":"meaning"},{"audio":"./24_audio/32.mp3","hl":"grammar"}],[{"audio":"./24_audio/33.mp3","hl":null}]],"fileName":"EBS올림포스(연합기출)고1 2026년 07강 01번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"EBS올림포스(연합기출)고1 2026년 07강 01번","titleEn":"Correlation vs. Causation: Reevaluating the Role of Animal Experimentation","titleKo":"상관관계 대 인과관계: 동물 실험의 역할에 대한 재평가","imageUrl":"__enpImg__","stages":[{"label":"01의학 발전에 대한 반대론자들의 시각","items":["현대 의학만이 사망률 감소의 유일한 원인이 아니며, 동물 실험 외의 요인도 존재한다.","의학적 진보가 반드시 동물 실험의 결과물은 아님 (animal experimentation)","사
