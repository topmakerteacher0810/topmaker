tainty<small>정밀함의 의미: 불확실성을 이해하는 데 맥락이 중요한 이유<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">과학에서 모든 측정값은 완벽할 수 없기에, 실제 값과 측정값 사이의 오차 범위를 나타내는 측정 불확실성(Measurement Uncertainty)이라는 개념을 이해하는 것이 중요합니다. 측정의 신뢰도를 나타내기 위해 의미 있는 숫자의 개수인 유효 숫자(Significant Figures)를 사용하는데, 숫자가 아무리 정밀해 보여도 다루는 규모에 따라 그 안에 숨겨진 아주 작은 오차가 현실에서는 엄청난 차이를 만들 수 있습니다. 예를 들어, 마라톤 코스를 잴 때 1cm의 오차는 무시할 수 있는 수준이지만 정밀 수술(Precision Surgery)에서는 치명적인 실수가 되는 것처럼, 데이터의 정밀함은 언제나 사용자의 목적에 따른 상대적(Relative)인 성격을 가집니다. 결국 데이터 분석(Data Analysis)에서는 단순히 숫자의 나열을 넘어, 내가 수행하려는 작업의 성격에 맞춰 어느 정도의 오차까지 허용할 것인지 그 맥락을 파악하는 것이 핵심입니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01불확실성의 상대성<\/div><ul><li>일반 대중이 불확실성을 이해하기 어려운 이유는 그 중요성이 상황에 따라 상대적이기 때문이다.<\/li><li>핵심 개념: 불확실성의 중요성 (significance of uncertainty)<\/li><li>특성: 상대적 (relative) 관점의 필요성<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02수치적 정밀도의 예시<\/div><ul><li>지구와 태양 사이의 거리 측정값을 통해 정밀함의 기준을 살펴본다.<\/li><li>지구-태양 거리: 1.49597 × 10⁸ km<\/li><li>6개의 유효 숫자 (six significant digits) 사용<\/li><li>백만 분의 일 수준의 높은 정확도 (accuracy)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03숨겨진 오차의 규모<\/div><ul><li>겉보기에 정밀해 보이는 수치라도 미세한 단위의 불확실성이 실제로는 매우 클 수 있다.<\/li><li>다음 자릿수의 불확실성 (uncertain) 발생 시 오차 확인<\/li><li>뉴욕과 시카고 사이보다 큰 실제 거리 오차<\/li><li>수치의 정밀함 (precise)에 대한 재평가<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04목적에 따른 판단 기준<\/div><ul><li>결국 특정 수치가 충분히 정밀한지는 그 데이터를 사용하는 의도에 달려 있다.<\/li><li>사용자의 의도 (intending to do)가 핵심 기준<\/li><li>단순 일출 시간 확인: 현재 수치로도 충분함 (fine)<\/li><li>태양 궤도 위성 발사 (orbit): 훨씬 더 높은 정확도 필요 (accurately)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">uncertainty<\/td><td class=\"m\">불확실성<\/td><\/tr><tr><td class=\"w\">public<\/td><td class=\"m\">대중, 일반인<\/td><\/tr><tr><td class=\"w\">appreciate<\/td><td class=\"m\">고마워하다<\/td><\/tr><tr><td class=\"w\">distance<\/td><td class=\"m\">거리<\/td><\/tr><tr><td class=\"w\">measure<\/td><td class=\"m\">측정하다, 재다<\/td><\/tr><tr><td class=\"w\">relatively<\/td><td class=\"m\">비교적<\/td><\/tr><tr><td class=\"w\">precise<\/td><td class=\"m\">정확한, 정밀한<\/td><\/tr><tr><td class=\"w\">significant<\/td><td class=\"m\">상당한, 중요한<\/td><\/tr><tr><td class=\"w\">means<\/td><td class=\"m\">수단, 방법<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">accuracy<\/td><td class=\"m\">정확성<\/td><\/tr><tr><td class=\"w\">quote<\/td><td class=\"m\">인용하다, 인용구<\/td><\/tr><tr><td class=\"w\">therefore<\/td><td class=\"m\">그러므로<\/td><\/tr><tr><td class=\"w\">depend<\/td><td class=\"m\">(depend on) ~에 달려 있다<\/td><\/tr><tr><td class=\"w\">intend<\/td><td class=\"m\">의도하다, ~할 작정이다<\/td><\/tr><tr><td class=\"w\">fine<\/td><td class=\"m\">훌륭한, 좋은<\/td><\/tr><tr><td class=\"w\">satellite<\/td><td class=\"m\">위성 방송, (인공)위성, (행성의) 위성<\/td><\/tr><tr><td class=\"w\">orbit<\/td><td class=\"m\">궤도<\/td><\/tr><tr><td class=\"w\">accurate<\/td><td class=\"m\">정확한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>One of the things<\/b><\/span><span class=\"ko\">것들 중 하나는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that makes<\/span> uncertainty <span class=\"grammar-hl\">difficult<\/span><\/b><\/span><span class=\"ko\">불확실성을 어렵게 만드는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">for members of the public to appreciate<\/span><\/b><\/span><span class=\"ko\">대중이 이해하기에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is<\/b><\/span><span class=\"ko\">~이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that the significance of uncertainty<\/b><\/span><span class=\"ko\">불확실성의 중요성이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is relative.<\/b><\/span><span class=\"ko\">상대적이라는 것<\/span><\/div><\/div><div class=\"lec-sent-ko\">대중이 불확실성을 이해하기 어렵게 만드는 것들 중 하나는 불확실성의 중요성이 상대적이라는 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 문장은 글 전체의 핵심 주제를 제시합니다. the significance of uncertainty is relative는 불확실성이라는 개념이 모든 상황에서 동일하게 적용되는 절대적인 수치가 아니라, 그것을 바라보는 맥락이나 기준에 따라 그 무게감이 완전히 달라진다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that makes (관계대명사): 주격 관계대명사 that이 선행사 One of the things를 수식하며, 뒤에 주어가 빠진 불완전한 절을 이끈다.<\/div><div class=\"lec-gr-item\">makes uncertainty difficult 5형식(SVOC) 구조: 동사 make가 목적어(uncertainty)와 형용사 목적격보어(difficult)를 취하는 구조다.<\/div><div class=\"lec-gr-item\">difficult for members of the public to appreciate (to부정사(부사적): 형용사 수식): to부정사 바로 앞에 형용사 difficult가 위치하여 이를 수식하는 구조다. for members of the public은 to부정사의 의미상 주어다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">uncertainty<\/td><td class=\"m\">불확실성<\/td><\/tr><tr><td class=\"w\">public<\/td><td class=\"m\">대중, 일반인<\/td><\/tr><tr><td class=\"w\">appreciate<\/td><td class=\"m\">고마워하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Take,<\/b><\/span><span class=\"ko\">예로 들어보라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for example,<\/b><\/span><span class=\"ko\">예를 들어<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the distance<\/b><\/span><span class=\"ko\">거리를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>between Earth and the sun: 1.49597 × 10⁸ km,<\/b><\/span><span class=\"ko\">지구와 태양 사이의: 1.49597 × 10⁸ km인<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as measured<\/span><\/b><\/span><span class=\"ko\">측정된 대로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at one point during the year.<\/b><\/span><span class=\"ko\">일 년 중 한 지점에서<\/span><\/div><\/div><div class=\"lec-sent-ko\">지구와 태양 사이의 거리, 즉 연중 한 지점에서 측정된 1.49597 × 10⁸ km의 예를 들어보자.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 주제를 뒷받침하기 위해 일상에서 접할 수 있는 과학적 수치를 예시로 도입합니다. as measured at one point는 지구가 태양 주변을 타원형으로 돌기 때문에 거리가 계속 변한다는 점을 고려하여, 특정 순간에 측정한 값임을 명시함으로써 논의의 정확성을 높여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">as measured (과거분사(형용사)): measured가 앞의 명사구(the distance ... the sun)를 부수적으로 설명하며 수식하는 구조다. distance that is measured (측정된 거리)의 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">distance<\/td><td class=\"m\">거리<\/td><\/tr><tr><td class=\"w\">measure<\/td><td class=\"m\">측정하다, 재다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This seems relatively precise;<\/b><\/span><span class=\"ko\">이것은 상대적으로 정확해 보인다;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>after all,<\/b><\/span><span class=\"ko\">결국<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">using six significant digits<\/span><\/b><\/span><span class=\"ko\">여섯 자리의 유효 숫자를 사용하는 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>means<\/b><\/span><span class=\"ko\">의미한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I know the distance<\/b><\/span><span class=\"ko\">내가 그 거리를 알고 있다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to an accuracy<\/b><\/span><span class=\"ko\">정확도로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of one part in a million or so.<\/b><\/span><span class=\"ko\">백만 분의 일 정도의<\/span><\/div><\/div><div class=\"lec-sent-ko\">이것은 상대적으로 정확해 보이지만, 결국, 여섯 자리의 유효 숫자를 사용하는 것은 백만 분의 일 정도의 정확도로 그 거리를 알고 있다는 것을 의미한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 제시한 수치가 겉보기에는 매우 정확해 보인다는 점을 설명합니다. six significant digits는 숫자를 아주 세밀한 단위까지 표현했다는 뜻으로, 일반적인 기준에서 볼 때 오차가 거의 없는 완벽한 정보처럼 느껴지게 만든다는 점을 짚어줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">using six significant digits (동명사): using이 이끄는 구가 문장의 주어 역할을 하는 명사구로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">distance<\/td><td class=\"m\">거리<\/td><\/tr><tr><td class=\"w\">relatively<\/td><td class=\"m\">비교적<\/td><\/tr><tr><td class=\"w\">precise<\/td><td class=\"m\">정확한, 정밀한<\/td><\/tr><tr><td class=\"w\">significant<\/td><td class=\"m\">상당한, 중요한<\/td><\/tr><tr><td class=\"w\">means<\/td><td class=\"m\">수단, 방법<\/td><\/tr><tr><td class=\"w\">accuracy<\/td><td class=\"m\">정확성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>However,<\/b><\/span><span class=\"ko\">하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>if the next digit is uncertain,<\/b><\/span><span class=\"ko\">만약 다음 숫자가 불확실하다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that means<\/b><\/span><span class=\"ko\">그것은 의미한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the uncertainty<\/b><\/span><span class=\"ko\">불확실성이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in <span class=\"grammar-hl\">knowing the precise Earth-sun distance<\/span><\/b><\/span><span class=\"ko\">정확한 지구-태양 거리를 아는 것에 있어서의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is larger<\/b><\/span><span class=\"ko\">더 크다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than the distance<\/b><\/span><span class=\"ko\">거리보다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>between New York and Chicago!<\/b><\/span><span class=\"ko\">뉴욕과 시카고 사이의!<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만, 만약 다음 숫자가 불확실하다면, 그것은 지구와 태양의 정확한 거리를 아는 것에 있어서의 불확실성이 뉴욕과 시카고의 거리보다 더 크다는 것을 의미한다!<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> &#39;정밀해 보인다&#39;는 앞선 인식을 뒤집으며 반전을 줍니다. larger than the distance between New York and Chicago는 수치상으로는 아주 미세해 보이는 오차일지라도, 우주의 거대한 척도에서는 실제 지구상의 대도시 사이 거리만큼이나 엄청난 오차가 될 수 있음을 구체적으로 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">knowing the precise Earth-sun distance (동명사): 전치사 in의 목적어 역할을 하는 명사적 성질의 어구로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">uncertainty<\/td><td class=\"m\">불확실성<\/td><\/tr><tr><td class=\"w\">distance<\/td><td class=\"m\">거리<\/td><\/tr><tr><td class=\"w\">precise<\/td><td class=\"m\">정확한, 정밀한<\/td><\/tr><tr><td class=\"w\">means<\/td><td class=\"m\">수단, 방법<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Whether or not the <span class=\"grammar-hl\">quoted number<\/span> is \"precise\"<\/b><\/span><span class=\"ko\">인용된 숫자가 &quot;정확한지&quot; 아닌지는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>therefore<\/b><\/span><span class=\"ko\">따라서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>depends on<\/b><\/span><span class=\"ko\">~에 달려 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">what I'm intending<\/span><\/b><\/span><span class=\"ko\">내가 의도하고 있는 것에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to do<\/span> with it.<\/b><\/span><span class=\"ko\">그것으로 무엇을 할지를<\/span><\/div><\/div><div class=\"lec-sent-ko\">따라서, 인용된 숫자가 &quot;정확한지&quot; 아닌지는 내가 그것으로 무엇을 하려고 하느냐에 따라 다르다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 예시를 통해 도출된 핵심 결론입니다. depends on what I&#39;m intending to do with it은 어떤 수치가 정밀한지 혹은 불확실한지를 판단하는 절대적 기준은 없으며, 오직 그 데이터를 사용하는 사람의 사용 목적이 기준이 된다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">quoted number (과거분사(형용사)): quoted가 뒤의 명사 number를 수식하는 구조다. number that is quoted(인용된 숫자)의 의미를 가진다.<\/div><div class=\"lec-gr-item\">what I&#39;m intending to do (간접의문문): 의문사(what) + 주어(I) + 동사(am intending to do)의 어순으로 전치사 on의 목적어 역할을 하는 명사절이다.<\/div><div class=\"lec-gr-item\">to do (to부정사(명사적)): 타동사 intend의 목적어로 쓰였으며 &#39;~하는 것&#39;으로 해석된다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">precise<\/td><td class=\"m\">정확한, 정밀한<\/td><\/tr><tr><td class=\"w\">quote<\/td><td class=\"m\">인용하다, 인용구<\/td><\/tr><tr><td class=\"w\">therefore<\/td><td class=\"m\">그러므로<\/td><\/tr><tr><td class=\"w\">depend<\/td><td class=\"m\">(depend on) ~에 달려 있다<\/td><\/tr><tr><td class=\"w\">intend<\/td><td class=\"m\">의도하다, ~할 작정이다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If I care only<\/b><\/span><span class=\"ko\">만약 내가 오직 관심이 있다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>about <span class=\"grammar-hl\">what minute<\/span><\/b><\/span><span class=\"ko\">몇 분에 대해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">the sun will rise<\/span> tomorrow,<\/b><\/span><span class=\"ko\">태양이 내일 뜰<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>then<\/b><\/span><span class=\"ko\">그러면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the <span class=\"grammar-hl\">number quoted here<\/span><\/b><\/span><span class=\"ko\">여기 인용된 숫자는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is fine.<\/b><\/span><span class=\"ko\">괜찮다<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 내가 내일 태양이 몇 분에 뜰지에만 관심이 있다면, 여기 인용된 숫자로 괜찮다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 말한 &#39;목적&#39;에 따른 적합성을 보여주는 첫 번째 사례입니다. the number quoted here is fine은 비록 수백 킬로미터의 오차가 포함되어 있더라도 일출 시간을 분 단위로 계산하는 일상적인 목적에는 아무런 문제가 없으므로 충분히 정밀한 정보로 간주된다는 뜻입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">what minute the sun will rise (간접의문문): 의문사구(what minute) + 주어(the sun) + 동사(will rise)의 어순으로 전치사 about의 목적어 역할을 하는 명사절이다.<\/div><div class=\"lec-gr-item\">number quoted here (과거분사(형용사)): quoted가 앞의 명사 number를 수식하는 구조다. number that is quoted here(여기서 인용된 숫자)의 의미를 가진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">quote<\/td><td class=\"m\">인용하다, 인용구<\/td><\/tr><tr><td class=\"w\">fine<\/td><td class=\"m\">훌륭한, 좋은<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If I want <span class=\"grammar-hl\">to send<\/span> a satellite<\/b><\/span><span class=\"ko\">만약 내가 위성을 보내고 싶다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to orbit<\/span><\/b><\/span><span class=\"ko\">궤도를 돌게 하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>just above the sun,<\/b><\/span><span class=\"ko\">태양 바로 위에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>however,<\/b><\/span><span class=\"ko\">하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>then<\/b><\/span><span class=\"ko\">그러면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I would need <span class=\"grammar-hl\">to know<\/span><\/b><\/span><span class=\"ko\">나는 알 필요가 있을 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>distances<\/b><\/span><span class=\"ko\">거리를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>more accurately.<\/b><\/span><span class=\"ko\">더 정확하게<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 만약 내가 태양 바로 위에 궤도를 돌 위성을 보내고 싶다면, 나는 더 정확하게 거리를 알 필요가 있을 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞의 사례와 대조되는 상황을 제시하며 상대성의 의미를 완성합니다. orbit just above the sun은 아주 작은 거리 계산의 실수로도 위성이 태양에 충돌할 수 있는 고도의 정밀함이 필요한 상황이므로, 앞선 문장에서 &#39;괜찮다&#39;고 했던 수치가 여기서는 매우 불확실하고 위험한 정보가 될 수 있음을 시사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to send (to부정사(명사적)): 타동사 want의 목적어로 쓰였으며 &#39;~하는 것&#39;으로 해석된다.<\/div><div class=\"lec-gr-item\">to orbit (to부정사(부사적): 목적): &#39;궤도를 돌기 위하여&#39;라는 의미로, in order to orbit으로 바꿔도 뜻이 같으므로 부사적 용법에 해당한다.<\/div><div class=\"lec-gr-item\">to know (to부정사(명사적)): 타동사 need의 목적어로 쓰였으며 &#39;~하는 것&#39;으로 해석된다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">distance<\/td><td class=\"m\">거리<\/td><\/tr><tr><td class=\"w\">satellite<\/td><td class=\"m\">위성 방송, (인공)위성, (행성의) 위성<\/td><\/tr><tr><td class=\"w\">orbit<\/td><td class=\"m\">궤도<\/td><\/tr><tr><td class=\"w\">accurate<\/td><td class=\"m\">정확한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>불확실성은 절대적인 수치가 아니라 상황과 목적에 따라 달라지는 상대적인 개념이다.<\/li><li>지구-태양 거리의 측정값은 겉보기엔 정밀해 보이지만, 실제 오차는 수백 킬로미터에 달할 수 있다.<\/li><li>이 오차가 허용 가능한지는 그 데이터를 어디에 쓰느냐에 따라 결정된다.<\/li><li>일출 시간을 계산할 때는 충분히 정밀한 수치가 인공위성을 띄울 때는 부족한 수치가 될 수 있다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">The significance of numerical uncertainty remains relative because the required level of precision is determined by the specific context of its application.<\/div>\n              <div class=\"lec-final-sum-ko\">수치적 불확실성의 중요성은 상대적으로 유지되는데, 요구되는 정밀도의 수준이 그것이 적용되는 구체적인 맥락에 의해 결정되기 때문이다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./33_audio/1.mp3","hl":null}],[{"audio":"./33_audio/2.mp3","hl":null}],[{"audio":"./33_audio/3.mp3","hl":null},{"audio":"./33_audio/4.mp3","hl":"stage-0"},{"audio":"./33_audio/5.mp3","hl":"stage-1"},{"audio":"./33_audio/6.mp3","hl":"stage-2"},{"audio":"./33_audio/7.mp3","hl":"stage-3"}],[{"audio":"./33_audio/8.mp3","hl":null}],[{"audio":"./33_audio/9.mp3","hl":"main"},{"audio":"./33_audio/10.mp3","hl":"meaning"},{"audio":"./33_audio/11.mp3","hl":"grammar"}],[{"audio":"./33_audio/12.mp3","hl":"main"},{"audio":"./33_audio/13.mp3","hl":"meaning"},{"audio":"./33_audio/14.mp3","hl":"grammar"}],[{"audio":"./33_audio/15.mp3","hl":"main"},{"audio":"./33_audio/16.mp3","hl":"meaning"},{"audio":"./33_audio/17.mp3","hl":"grammar"}],[{"audio":"./33_audio/18.mp3","hl":"main"},{"audio":"./33_audio/19.mp3","hl":"meaning"},{"audio":"./33_audio/20.mp3","hl":"grammar"}],[{"audio":"./33_audio/21.mp3","hl":"main"},{"audio":"./33_audio/22.mp3","hl":"meaning"},{"audio":"./33_audio/23.mp3","hl":"grammar"}],[{"audio":"./33_audio/24.mp3","hl":"main"},{"audio":"./33_audio/25.mp3","hl":"meaning"},{"audio":"./33_audio/26.mp3","hl":"grammar"}],[{"audio":"./33_audio/27.mp3","hl":"main"},{"audio":"./33_audio/28.mp3","hl":"meaning"},{"audio":"./33_audio/29.mp3","hl":"grammar"}],[{"audio":"./33_audio/30.mp3","hl":null}]],"fileName":"모의고사_고1_2025년_09월_33번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 09월 / 33번","titleEn":"The Meaning of Precision: Why Context Matters in Understanding Uncertainty","titleKo":"정밀함의 의미: 불확실성을 이해하는 데 맥락이 중요한 이유","imageUrl":"__enpImg__","stages":[{"label":"01불확실성의 상대성","items":["일반 대중이 불확실성을 이해하기 어려운 이유는 그 중요성이 상황에 따라 상대적이기 때문이다.","핵심 개념: 불확실성의 중요성 (significance of uncertainty)","특성: 상대적 (relative) 관점의 필요성"]},{"label":"02수치적 정밀도의 예시","items":["지구와 태양 사이의 거리 측정값을 통해 정밀함의 기준을 살펴본다.","지구-태양 거리: 1.49597 × 10⁸ km","6개의 유효 숫자 (six significant digits) 사용","백만 분의 일 수준의 높은 정확도 (accuracy)"]},{"label":"03숨겨진 오차의 규모","items":["겉보기에 정밀해 보이는 수치라도 미세한 단위의 불확실성이 실제로는 매우 클 수 있다.","다음 자릿수의 불확실성 (uncertain) 발생 시 오차 확인","뉴욕과 시카고 사이보다 큰 실제 거리 오차","수치의 정밀함 (precise)에 대한 재평가"]},{"label":"04목적에 따른 판단 기준","items":["결국 특정 수치가 충분히 정밀한지는 그 데이터를 사용하는 의도에 달려 있다.","사용자의 의도 (intending to do)가 핵심 기준","단순 일출 시간 확인: 현재 수치로도 충분함 (fine)","태양 궤도 위성 발사 (orbit): 훨씬 더 높은 정확도 필요 (accurately)"]}],"bkg":"과학에서 모든 측정값은 완벽할 수 없기에, 실제 값과 측정값 사이의 오차 범위를 나타내는 측정 불확실성(Measurement Uncertainty)이라는 개념을 이해하는 것이 중요합니다. 측정의 신뢰도를 나타내기 위해 의미 있는 숫자의 개수인 유효 숫자(Significant Figures)를 사용하는데, 숫자가 아무리 정밀해 보여도 다루는 규모에 따라 그 안에 숨겨진 아주 작은 오차가 현실에서는 엄청난 차이를 만들 수 있습니다. 예를 들어, 마라톤 코스를 잴 때 1cm의 오차는 무시할 수 있는 수준이지만 정밀 수술(Precision Surgery)에서는 치명적인 실수가 되는 것처럼, 데이터의 정밀함은 언제나 사용자의 목적에 따른 상대적(Relative)인 성격을 가집니다. 결국 데이터 분석(Data Analysis)에서는 단순히 숫자의 나열을 넘어, 내가 수행하려는 작업의 성격에 맞춰 어느 정도의 오차까지 허용할 것인지 그 맥락을 파악하는 것이 핵심입니다.","ttsText":"과학에서 모든 측정값은 완벽할 수 없기에, 실제 값과 측정값 사이의 오차 범위를 나타내는 측정 불확실성(Measurement Uncertainty)이라는 개념을 이해하는 것이 중요합니다. 측정의 신뢰도를 나타내기 위해 의미 있는 숫자의 개수인 유효 숫자(Significant Figures)를 사용하는데, 숫자가 아무리 정밀해 보여도 다루는 규모에 따라 그 안에 숨겨진 아주 작은 오차가 현실에서는 엄청난 차이를 만들 수 있습
