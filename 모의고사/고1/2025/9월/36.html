9P8+tJvXGSQM+pGfyz/ACpcjgZHPTnr9P6fp0oAWj/Pf/H/AD70Z/8Are/0pu5emR+J/wAjOenPv9QB3+f89/6Uf5GabkHjIOTjr1xyRx6Y/wAaGOFJ6EKT9OOceuP14zQH9dj/2Q==\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">Survival Secrets of the Desert Tortoise: The Role of Its Sophisticated Bladder<small>사막거북의 생존 비결: 정교한 방광의 역할<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">데스밸리 같은 극한 환경(Extreme environment)에서 살아남기 위해 동물이 선택하는 지혜로운 전략 중 하나는 활동을 멈추고 에너지를 아끼는 하계 휴면(Aestivation)입니다. 사막거북은 일반적인 동물과 달리 방광(Bladder)을 단순한 노폐물 저장소가 아닌, 가뭄 시 수분을 재흡수할 수 있는 일종의 보조 물탱크(Holding tank)로 활용하는 독특한 생리 구조를 갖추고 있습니다. 이러한 삼투 조절(Osmoregulation) 능력 덕분에 물 한 방울 마시지 않고도 1년이라는 긴 시간을 버텨낼 수 있는 것이죠. 하지만 갑작스러운 천적의 공격이나 인간의 접촉으로 극심한 공포를 느끼면, 방어 기제인 스트레스 반응(Stress response)으로 인해 저장해둔 수분을 한꺼번에 배출해버려 생명이 위험해질 수 있으니 야생에서의 세심한 주의가 필요합니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01극한의 더위 회피<\/div><ul><li>사막거북은 데스밸리의 극심한 열기를 피해 일생의 대부분을 비활동 상태로 보낸다.<\/li><li>겨울에는 동면(hibernate)하고 여름에는 터널 안에서 체류함<\/li><li>일생의 90% 이상을 움직이지 않는 비활동(immobile) 상태로 보냄<\/li><li>핵심 키워드: 회피(avoid)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02수분 수집과 비축<\/div><ul><li>비가 온 직후 지표면으로 나와 생존에 필요한 물을 적극적으로 확보한다.<\/li><li>식물을 먹거나 구멍을 파서 빗물을 수집(collect)함<\/li><li>수분 보충을 위해 비가 온 후에만 지표면으로 나옴<\/li><li>핵심 키워드: 수분 보충(stock up on water)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03정교한 방광의 역할<\/div><ul><li>사막거북은 특수하게 발달한 방광을 활용하여 장기간 수분을 유지한다.<\/li><li>방광이 수분 저장 탱크(holding tank) 역할을 수행함<\/li><li>저장된 수분을 몸속으로 다시 재흡수(reabsorb)할 수 있음<\/li><li>외부 수분 섭취 없이도 1년(full year) 동안 생존 가능<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04외부 위협과 주의사항<\/div><ul><li>인간의 무분별한 도움이나 접촉은 사막거북의 생존을 위협할 수 있다.<\/li><li>거북을 들어 올리면 공포를 느껴 방광을 비워(empty) 버림<\/li><li>생존에 필수적인 수분 비축물(water reserves)을 순식간에 상실함<\/li><li>공원 관리인들은 방문객들에게 거북을 만지지 말라고 경고함<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">desert<\/td><td class=\"m\">사막<\/td><\/tr><tr><td class=\"w\">solution<\/td><td class=\"m\">해결책, 해법<\/td><\/tr><tr><td class=\"w\">cope<\/td><td class=\"m\">대처하다, 맞서다<\/td><\/tr><tr><td class=\"w\">extreme<\/td><td class=\"m\">극단적인, 극심한<\/td><\/tr><tr><td class=\"w\">extended<\/td><td class=\"m\">늘어난, 장기간의<\/td><\/tr><tr><td class=\"w\">hibernation<\/td><td class=\"m\">동면, 겨울잠<\/td><\/tr><tr><td class=\"w\">reptile<\/td><td class=\"m\">파충류<\/td><\/tr><tr><td class=\"w\">rely<\/td><td class=\"m\">(rely on) ~에 의존하다<\/td><\/tr><tr><td class=\"w\">highly<\/td><td class=\"m\">매우, 대단히<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sophisticated<\/td><td class=\"m\">정교한, 세련된<\/td><\/tr><tr><td class=\"w\">hold<\/td><td class=\"m\">잡다, 유지하다<\/td><\/tr><tr><td class=\"w\">allow<\/td><td class=\"m\">허용하다, ~하게 해 주다<\/td><\/tr><tr><td class=\"w\">freshwater<\/td><td class=\"m\">민물의, 담수의, 민물<\/td><\/tr><tr><td class=\"w\">creature<\/td><td class=\"m\">생물, 동물<\/td><\/tr><tr><td class=\"w\">hibernate<\/td><td class=\"m\">겨울잠을 자다, 동면하다<\/td><\/tr><tr><td class=\"w\">meaning<\/td><td class=\"m\">의미, 뜻<\/td><\/tr><tr><td class=\"w\">immobile<\/td><td class=\"m\">거동이 불가능한, 정지된<\/td><\/tr><tr><td class=\"w\">usually<\/td><td class=\"m\">보통, 대개<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The desert tortoise<\/b><\/span><span class=\"ko\">사막거북은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>has a simple solution<\/b><\/span><span class=\"ko\">간단한 해결책을 가지고 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for <span class=\"grammar-hl\">coping<\/span> with Death Valley's extreme heat: It avoids it.<\/b><\/span><span class=\"ko\">데스밸리의 극심한 더위에 대처하기 위한: 그것은 그것을 피하는 것이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">사막거북은 Death Valley의 극심한 더위를 극복하기 위해 간단한 해결책을 가지고 있는데 그것은 더위를 피하는 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 문장은 글의 도입부로, 사막이라는 가혹한 환경에서 사막거북이 살아남는 핵심 전략을 제시합니다. simple solution은 복잡한 신체적 적응보다 행동의 변화를 통해 문제를 해결한다는 의미입니다. It avoids it은 열기에 맞서 싸우거나 견디는 것이 아니라 아예 열기가 없는 곳으로 숨어버린다는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">coping (동명사): 전치사 for의 목적어로 쓰여 &#39;~하는 것&#39;의 의미를 나타내는 명사 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">desert<\/td><td class=\"m\">사막<\/td><\/tr><tr><td class=\"w\">solution<\/td><td class=\"m\">해결책, 해법<\/td><\/tr><tr><td class=\"w\">extreme<\/td><td class=\"m\">극단적인, 극심한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The slow-moving creature<\/b><\/span><span class=\"ko\">이 느릿하게 움직이는 생물은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>hibernates<\/b><\/span><span class=\"ko\">동면한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>during the winter<\/b><\/span><span class=\"ko\">겨울 동안<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and stays<\/b><\/span><span class=\"ko\">그리고 머문다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in its tunnel<\/b><\/span><span class=\"ko\">자신의 굴속에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for much of the summer,<\/b><\/span><span class=\"ko\">여름의 대부분 동안,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">meaning<\/span> that it spends<\/b><\/span><span class=\"ko\">의미하면서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>more than 90 percent of its life<\/b><\/span><span class=\"ko\">그것의 생의 90퍼센트 이상을 보낸다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>immobile.<\/b><\/span><span class=\"ko\">움직이지 않은 채로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 느리게 움직이는 생명체는 겨울에는 동면하고 대부분의 여름에는 그것의 굴 속에서 보내는데 이는 그 생의 90퍼센트 이상을 움직이지 않은 채로 보낸다는 것을 의미한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 &#39;회피&#39;의 구체적인 방법을 설명합니다. 극한의 추위와 더위를 모두 피하려고 땅속 터널에 머물다 보니, spends more than 90 percent of its life immobile은 거북의 생애 대부분이 활동이 멈춘 정적인 상태라는 점을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">meaning (분사구문): 앞 문장 전체의 내용을 부연 설명하며, 원래의 절 &#39;and it means...&#39;가 축약된 형태이다. (원래 절: and it means that ...)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">creature<\/td><td class=\"m\">생물, 동물<\/td><\/tr><tr><td class=\"w\">hibernate<\/td><td class=\"m\">겨울잠을 자다, 동면하다<\/td><\/tr><tr><td class=\"w\">meaning<\/td><td class=\"m\">의미, 뜻<\/td><\/tr><tr><td class=\"w\">immobile<\/td><td class=\"m\">거동이 불가능한, 정지된<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In fact,<\/b><\/span><span class=\"ko\">사실,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the tortoise<\/b><\/span><span class=\"ko\">거북은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>usually only <span class=\"grammar-hl\">surfaces<\/span><\/b><\/span><span class=\"ko\">보통 표면으로 나온다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>after a good rain.<\/b><\/span><span class=\"ko\">충분한 비가 온 후에만.<\/span><\/div><\/div><div class=\"lec-sent-ko\">사실, 거북은 보통 충분한 비가 온 후에만 밖으로 나온다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 설명한 긴 은둔 생활이 끝나는 특정 조건을 제시합니다. surfaces after a good rain은 거북이 땅 위로 나오는 행위가 단순히 산책을 위한 것이 아니라, 생존에 필수적인 &#39;물&#39;이 확보된 시점에만 이루어지는 매우 전략적인 행동임을 시사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">surfaces 1형식 구조: surface는 여기서 &#39;수면으로 올라오다/모습을 드러내다&#39;라는 의미의 자동사로 쓰여 주어인 tortoise의 동작을 설명한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">usually<\/td><td class=\"m\">보통, 대개<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Then,<\/b><\/span><span class=\"ko\">그런 다음,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it <span class=\"grammar-hl\">gets to work<\/span>.<\/b><\/span><span class=\"ko\">그것은 활동을 시작한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 다음에 그것은 활동을 시작한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 은둔 상태에서 활동 상태로의 전환을 알리는 문장입니다. gets to work는 거북이 지면으로 나왔을 때 노는 것이 아니라, 다음 은둔기를 버티기 위한 생존 필수 과업들을 아주 분주하고 집중적으로 수행한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">gets to work (관용표현): &#39;일을 시작하다&#39; 또는 &#39;착수하다&#39;라는 의미로 쓰이는 숙어다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 5 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The tortoise<\/b><\/span><span class=\"ko\">거북은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>stocks up on water<\/b><\/span><span class=\"ko\">물을 비축한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by <span class=\"grammar-hl\">eating plants and digging holes<\/span><\/b><\/span><span class=\"ko\">식물을 먹고 구멍을 파서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to collect rain<\/span>.<\/b><\/span><span class=\"ko\">빗물을 모으기 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">거북은 식물을 먹고, 빗물을 모으기 위한 구멍을 팜으로써 물을 비축한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 말한 &#39;일(work)&#39;의 구체적인 내용입니다. stocks up on water는 단순히 목을 축이는 수준을 넘어, 다시 찾아올 긴 건기를 대비해 몸 안에 최대한 많은 수분을 채워 넣는 준비 과정을 묘사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">eating plants and digging holes (동명사): 전치사 by의 목적어로 쓰인 두 개의 동명사가 and로 병렬 연결되어 &#39;먹는 것과 파는 것에 의해서&#39;라는 수단을 나타낸다.<\/div><div class=\"lec-gr-item\">to collect rain (to부정사(부사적): 목적): in order to collect로 바꿔 쓸 수 있으며, 구멍을 파는 목적을 나타낸다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 6 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But<\/b><\/span><span class=\"ko\">하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to stay supplied<\/span> with water<\/b><\/span><span class=\"ko\">수분이 공급된 채로 유지하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>through its <span class=\"grammar-hl\">extended hibernation<\/span>,<\/b><\/span><span class=\"ko\">장기간의 동면 동안,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the reptile<\/b><\/span><span class=\"ko\">그 파충류는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>relies on something else<\/b><\/span><span class=\"ko\">다른 무언가에 의존한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>its highly sophisticated bladder.<\/b><\/span><span class=\"ko\">그것의 매우 정교한 방광인.<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 그것의 장기간에 걸친 동면 동안 수분이 공급된 채로 지내기 위해, 이 파충류는 다른 것에 의존한다. 즉, 그것의 매우 정교한 방광이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 외부적인 수분 섭취 방법에서 내부적인 수분 유지 기제로 화제를 전환합니다. highly sophisticated bladder는 거북의 방광이 단순한 배설 기관이 아니라, 장기간의 부동 상태를 견디게 해주는 정교한 생존 장치임을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to stay supplied (to부정사(부사적): 목적): 문장 맨 앞 위치하여 &#39;~하기 위해서&#39;라는 목적을 나타내며, in order to stay로 바꿔 쓸 수 있다.<\/div><div class=\"lec-gr-item\">extended hibernation (과거분사(형용사)): extended가 명사인 hibernation을 수식하며 &#39;연장된(길어진) 동면&#39;이라는 수동/완료의 의미를 전달한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">extended<\/td><td class=\"m\">늘어난, 장기간의<\/td><\/tr><tr><td class=\"w\">hibernation<\/td><td class=\"m\">동면, 겨울잠<\/td><\/tr><tr><td class=\"w\">reptile<\/td><td class=\"m\">파충류<\/td><\/tr><tr><td class=\"w\">rely<\/td><td class=\"m\">(rely on) ~에 의존하다<\/td><\/tr><tr><td class=\"w\">highly<\/td><td class=\"m\">매우, 대단히<\/td><\/tr><tr><td class=\"w\">sophisticated<\/td><td class=\"m\">정교한, 세련된<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Unlike most animals,<\/b><\/span><span class=\"ko\">대부분의 동물과 달리,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the tortoise's bladder<\/b><\/span><span class=\"ko\">거북의 방광은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>acts<\/b><\/span><span class=\"ko\">역할을 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as a holding tank,<\/b><\/span><span class=\"ko\">보관 탱크로서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">allowing it to reabsorb<\/span> water<\/b><\/span><span class=\"ko\">그것이 물을 다시 흡수하게 하면서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>back into its body.<\/b><\/span><span class=\"ko\">그것의 몸 안으로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">대부분의 동물과 달리, 거북의 방광은 보관 탱크로서의 역할을 하며, 그것이 그것의 몸으로 물을 다시 흡수할 수 있게 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 사막거북 방광의 특별한 기능을 일반적인 동물과 비교하여 설명합니다. acts as a holding tank는 방광이 물을 버리기 전 잠시 담아두는 곳이 아니라, 필요할 때 꺼내 쓸 수 있는 비상용 저수지 역할을 한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">allowing it to reabsorb (분사구문): 앞 절의 내용을 부연 설명하는 능동의 분사구문이다. (원래 절: which allows it to ...)<\/div><div class=\"lec-gr-item\">allowing it to reabsorb 5형식(SVOC) 구조: allow + 목적어(it) + 목적격보어(to reabsorb) 구조로, 목적어가 ~하도록 허용하다는 의미를 가진다. to reabsorb는 목적격보어(to부정사)로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hold<\/td><td class=\"m\">잡다, 유지하다<\/td><\/tr><tr><td class=\"w\">allow<\/td><td class=\"m\">허용하다, ~하게 해 주다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Incredibly,<\/b><\/span><span class=\"ko\">놀랍게도,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a desert tortoise<\/b><\/span><span class=\"ko\">사막거북은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can go a full year<\/b><\/span><span class=\"ko\">일 년 내내 지낼 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>without <span class=\"grammar-hl\">taking in<\/span> any freshwater at all.<\/b><\/span><span class=\"ko\">담수를 전혀 섭취하지 않고도.<\/span><\/div><\/div><div class=\"lec-sent-ko\">놀랍게도, 사막거북은 1년 내내 담수를 전혀 섭취하지 않고도 살아갈 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 설명한 수분 재흡수 시스템이 가져다주는 놀라운 결과를 제시합니다. go a full year는 사막이라는 극한 환경에서 비가 오지 않는 긴 시간을 거뜬히 버텨낼 수 있는 거북의 강력한 생명력을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">taking in (동명사): 전치사 without의 목적어로 쓰여 &#39;~하는 것 없이&#39;라는 의미를 형성한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">desert<\/td><td class=\"m\">사막<\/td><\/tr><tr><td class=\"w\">freshwater<\/td><td class=\"m\">민물의, 담수의, 민물<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>And<\/b><\/span><span class=\"ko\">그리고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because its bladder is so important<\/b><\/span><span class=\"ko\">그것의 방광이 매우 중요하기 때문에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to a tortoise's survival,<\/b><\/span><span class=\"ko\">거북의 생존에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>park rangers<\/b><\/span><span class=\"ko\">공원 순찰대원들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>often <span class=\"grammar-hl\">remind visitors<\/span><\/b><\/span><span class=\"ko\">종종 방문객들에게 상기시킨다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">not to stop and help<\/span><\/b><\/span><span class=\"ko\">멈춰서 돕지 말라고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the slow-movers<\/b><\/span><span class=\"ko\">그 느릿하게 움직이는 것들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>across the road.<\/b><\/span><span class=\"ko\">도로를 건너는 것을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그리고 그것의 방광이 거북의 생존에 매우 중요하기 때문에, 공원 순찰대원들은 종종 방문객들에게 멈추어 그 느리게 움직이는 것을 도로를 건너도록 도와주지 않을 것을 상기시킨다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 거북의 생물학적 특징을 인간의 행동 지침과 연결합니다. not to stop and help는 인간의 선의가 거북에게는 오히려 치명적인 독이 될 수 있다는 역설적인 상황을 경고합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">remind visitors not to stop and help 5형식(SVOC) 구조: remind + 목적어(visitors) + 목적격보어(not to stop and help) 구조다. 목적어에게 ~하지 말 것을 상기시키다라는 의미이며, 부정어 not은 목적격보어인 to부정사 바로 앞에 위치한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Tortoises<\/b><\/span><span class=\"ko\">거북은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>become so <span class=\"grammar-hl\">terrified<\/span><\/b><\/span><span class=\"ko\">너무 겁을 먹는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when people pick them up<\/b><\/span><span class=\"ko\">사람들이 그들을 들어 올릴 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that they empty their bladders,<\/b><\/span><span class=\"ko\">그래서 그들의 방광을 비운다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">losing<\/span> their precious water reserves.<\/b><\/span><span class=\"ko\">그들의 소중한 수분 저장량을 잃으면서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">거북은 사람들이 그들을 들어 올릴 때 너무 겁을 먹어 그들의 방광을 비워버리고, 소중한 저장된 물을 잃게 된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 마지막 문장으로, 왜 도움을 주지 말아야 하는지 그 이유를 구체적으로 설명합니다. empty their bladders는 위협을 느낀 거북의 방어 기제인데, 이로 인해 precious water reserves(1년을 버티게 해줄 생명수)를 쏟아버리게 되어 결국 거북을 죽게 만들 수 있다는 비극적인 결과를 암시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">terrified (과거분사(형용사)): 주어인 tortoises의 감정 상태를 설명하는 보어 역할을 하며 &#39;겁에 질린&#39;이라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">losing (분사구문): 주절의 동작(empty their bladders)에 이어지는 결과나 동시 동작을 나타낸다. (원래 절: and they lose ...)<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>사막거북은 데스밸리의 극한 기후를 피하기 위해 인생의 90% 이상을 땅속에서 보낸다.<\/li><li>비가 올 때만 잠시 밖으로 나와 수분을 섭취하고 땅에 구멍을 파서 물을 모은다.<\/li><li>일반 동물과 달리 방광에 물을 저장하고 재흡수하는 능력이 있어 1년간 물 없이도 버틴다.<\/li><li>인간이 거북을 만지면 공포 때문에 방광의 물을 쏟아버려 생존이 위태로워지므로 절대 건드리면 안 된다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">The desert tortoise ensures its survival by utilizing a specialized bladder to store water for long periods, although human contact can lead to the fatal loss of these reserves.<\/div>\n              <div class=\"lec-final-sum-ko\">사막거북은 장기간 수분을 저장하기 위해 특수한 방광을 활용하여 생존을 보장하지만, 인간과의 접촉은 이러한 비축분의 치명적인 손실로 이어질 수 있다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./36_audio/1.mp3","hl":null}],[{"audio":"./36_audio/2.mp3","hl":null}],[{"audio":"./36_audio/3.mp3","hl":null},{"audio":"./36_audio/4.mp3","hl":"stage-0"},{"audio":"./36_audio/5.mp3","hl":"stage-1"},{"audio":"./36_audio/6.mp3","hl":"stage-2"},{"audio":"./36_audio/7.mp3","hl":"stage-3"}],[{"audio":"./36_audio/8.mp3","hl":null}],[{"audio":"./36_audio/9.mp3","hl":"main"},{"audio":"./36_audio/10.mp3","hl":"meaning"},{"audio":"./36_audio/11.mp3","hl":"grammar"}],[{"audio":"./36_audio/12.mp3","hl":"main"},{"audio":"./36_audio/13.mp3","hl":"meaning"},{"audio":"./36_audio/14.mp3","hl":"grammar"}],[{"audio":"./36_audio/15.mp3","hl":"main"},{"audio":"./36_audio/16.mp3","hl":"meaning"},{"audio":"./36_audio/17.mp3","hl":"grammar"}],[{"audio":"./36_audio/18.mp3","hl":"main"},{"audio":"./36_audio/19.mp3","hl":"meaning"},{"audio":"./36_audio/20.mp3","hl":"grammar"}],[{"audio":"./36_audio/21.mp3","hl":"main"},{"audio":"./36_audio/22.mp3","hl":"meaning"},{"audio":"./36_audio/23.mp3","hl":"grammar"}],[{"audio":"./36_audio/24.mp3","hl":"main"},{"audio":"./36_audio/25.mp3","hl":"meaning"},{"audio":"./36_audio/26.mp3","hl":"grammar"}],[{"audio":"./36_audio/27.mp3","h ified (과거분사(형용사)): 주어인 tortoises의 감정 상태를 설명하는 보어 역할을 하며 '겁에 질린'이라는 의미를 나타낸다.","losing (분사구문): 주절의 동작(empty their bladders)에 이어지는 결과나 동시 동작을 나타낸다. (원래 절: and they lose ...)"],"vocab":[],"ttsText":"거북은 사람들이 그들을 들어 올릴 때 너무 겁을 먹어 그들의 방광을 비워버리고, 소중한 저장된 물을 잃게 된다.. 마지막 문장으로, 왜 도움을 주지 말아야 하는지 그 이유를 구체적으로 설명합니다. empty their bladders는 위협을 느낀 거북의 방어 기제인데, 이로 인해 precious water reserves(1년을 버티게 해줄 생명수)를 쏟아버리게 되어 결국 거북을 죽게 만들 수 있다는 비극적인 결과를 암시합니다.. terrified (과거분사(형용사)): 주어인 tortoises의 감정 상태를 설명하는 보어 역할을 하며 '겁에 질린'이라는 의미를 나타낸다. losing (분사구문): 주절의 동작(empty their bladders)에 이어지는 결과나 동시 동작을 나타낸다. (원래 절: and they lose ...)","__passage":"모의고사 / 고1 / 2025년 / 09월 / 36번","passageName":"모의고사 / 고1 / 2025년 / 09월 / 36번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 36번"},{"kind":"summary","passageName":"모의고사 / 고1 / 2025년 / 09월 / 36번","imageUrl":"__enpImg__","sumEn":"The desert tortoise ensures its survival by utilizing a specialized bladder to store water for long periods, although human contact can lead to the fatal loss of these reserves.","sumKo":"사막거북은 장기간 수분을 저장하기 위해 특수한 방광을 활용하여 생존을 보장하지만, 인간과의 접촉은 이러한 비축분의 치명적인 손실로 이어질 수 있다.","bullets":[],"overall":["사막거북은 데스밸리의 극한 기후를 피하기 위해 인생의 90% 이상을 땅속에서 보낸다.","비가 올 때만 잠시 밖으로 나와 수분을 섭취하고 땅에 구멍을 파서 물을 모은다.","일반 동물과 달리 방광에 물을 저장하고 재흡수하는 능력이 있어 1년간 물 없이도 버틴다.","인간이 거북을 만지면 공포 때문에 방광의 물을 쏟아버려 생존이 위태로워지므로 절대 건드리면 안 된다."],"compare":{"headers":["구분","일반적인 동물","사막거북"],"rows":[["방광의 주된 기능","노폐물 배출 및 배설","수분 저장 및 체내 재흡수"],["활동 시간 비중","일상적 활동 수행","생애의 90% 이상을 부동 상태로 보냄"],["수분 없이 버티는 기간","비교적 짧음","최대 1년까지 생존 가능"],["인간의 간섭 결과","구조 또는 도움","수분 비축량 상실로 인한 생존 위협"]]},"ttsText":"사막거북은 데스밸리의 극한 기후를 피하기 위해 인생의 90% 이상을 땅속에서 보낸다. 비가 올 때만 잠시 밖으로 나와 수분을 섭취하고 땅에 구멍을 파서 물을 모은다. 일반 동물과 달리 방광에 물을 저장하고 재흡수하는 능력이 있어 1년간 물 없이도 버틴다. 인간이 거북을 만지면 공포 때문에 방광의 물을 쏟아버려 생존이 위태로워지므로 절대 건드리면 안 된다.","__passage":"모의고사 / 고1 / 2025년 / 09월 / 36번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 36번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 사막거북은 데스밸리의 극한 기후를 피하기 위해 인생의 90% 이상을 땅속에서 보냅니다. 비가 올 때만 잠
