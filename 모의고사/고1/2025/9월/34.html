업 공정의 전면적 개편<\/li><li>핵심 키워드: 재생 에너지 기반 시설(renewable energy infrastructure)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02건설 과정의 필수적 에너지원<\/div><ul><li>이러한 거대한 전환 과정은 역설적으로 화석 연료 없이는 불가능하다.<\/li><li>콘크리트 및 강철 구조물 생산에 막대한 에너지 소모<\/li><li>태양광 패널용 광물 채굴 시 화석 연료 사용 불가피<\/li><li>핵심 키워드: 화석 연료(fossil fuels)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가속화에 따른 역설적 결과<\/div><ul><li>재생 에너지 시스템 구축을 서두를수록 건설 단계에서의 화석 연료 사용은 더 빨라진다.<\/li><li>건설 과정의 에너지 소비는 전환 비용을 상승시킴<\/li><li>탄소 배출을 줄이려는 노력을 스스로 훼손하는 요인이 됨<\/li><li>핵심 키워드: 훼손하는 요인(undermining factor)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04에너지 전환 제안서의 맹점<\/div><ul><li>현재의 에너지 전환 제안서들은 기반 시설 구축에 드는 실제 비용을 간과하고 있다.<\/li><li>대부분의 제안서는 에너지 공급(energy supply) 요건에만 집중함<\/li><li>건설 과정에서 발생하는 에너지 소비와 비용은 거의 계산되지 않음<\/li><li>핵심 키워드: 전환 제안서(transition proposals)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">involved in<\/td><td class=\"m\">~에 관여하는, ~에 참여하는<\/td><\/tr><tr><td class=\"w\">journalist<\/td><td class=\"m\">기자, 언론인<\/td><\/tr><tr><td class=\"w\">argue<\/td><td class=\"m\">주장하다<\/td><\/tr><tr><td class=\"w\">renewable<\/td><td class=\"m\">재생 가능한<\/td><\/tr><tr><td class=\"w\">infrastructure<\/td><td class=\"m\">기반 시설<\/td><\/tr><tr><td class=\"w\">project<\/td><td class=\"m\">투사하다, 예상하다<\/td><\/tr><tr><td class=\"w\">solar<\/td><td class=\"m\">태양의<\/td><\/tr><tr><td class=\"w\">panel<\/td><td class=\"m\">패널, 판<\/td><\/tr><tr><td class=\"w\">wind<\/td><td class=\"m\">바람<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">alternative<\/td><td class=\"m\">대안, 선택지<\/td><\/tr><tr><td class=\"w\">transport<\/td><td class=\"m\">실어 나르다, 수송하다<\/td><\/tr><tr><td class=\"w\">procedure<\/td><td class=\"m\">절차, 방법<\/td><\/tr><tr><td class=\"w\">industrial<\/td><td class=\"m\">산업의, 공업의<\/td><\/tr><tr><td class=\"w\">process<\/td><td class=\"m\">과정, 절차<\/td><\/tr><tr><td class=\"w\">fossil fuels<\/td><td class=\"m\">화석 연료<\/td><\/tr><tr><td class=\"w\">transformation<\/td><td class=\"m\">변화, 탈바꿈<\/td><\/tr><tr><td class=\"w\">for instance<\/td><td class=\"m\">예를 들어<\/td><\/tr><tr><td class=\"w\">concrete<\/td><td class=\"m\">구체적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Richard Heinberg, an American journalist,<\/b><\/span><span class=\"ko\">미국인 저널리스트인 Richard Heinberg는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>argues<\/b><\/span><span class=\"ko\">주장한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that in <span class=\"grammar-hl\">building<\/span> the renewable energy infrastructure<\/b><\/span><span class=\"ko\">재생 가능 에너지 기반 시설을 구축할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to stop<\/span> global warming,<\/b><\/span><span class=\"ko\">지구 온난화를 막기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we <span class=\"grammar-hl\">are actually involved<\/span><\/b><\/span><span class=\"ko\">우리는 실제로 관여하고 있다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">in<\/span> one of the greatest change projects<\/b><\/span><span class=\"ko\">가장 큰 변화 프로젝트 중 하나에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in human history.<\/b><\/span><span class=\"ko\">인류 역사상<\/span><\/div><\/div><div class=\"lec-sent-ko\">미국인 저널리스트인 Richard Heinberg는 지구 온난화를 막기 위해 재생 가능 에너지 기반 시설을 구축할 때, 우리는 실제로 인류 역사상 가장 큰 변화 프로젝트 중 하나에 관여하는 것이라고 주장한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> one of the greatest change projects는 재생 에너지로의 전환이 단순히 발전기 몇 개를 바꾸는 수준이 아니라, 인류 문명의 기초를 완전히 새로 쓰는 거대한 작업이라는 의미입니다. 글쓴이는 이 문장을 통해 우리가 당면한 과업의 규모가 상상 이상으로 거대함을 시사하며 글을 시작합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">building (동명사): 전치사 in의 목적어로 쓰여 명사적 역할을 하고 있으며, &#39;~하는 과정에서&#39;라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">to stop (to부정사(부사적): 목적): &#39;in order to stop&#39;으로 바꾸어도 의미가 통하며, 재생 에너지 인프라를 구축하는 목적(~하기 위해서)을 설명한다.<\/div><div class=\"lec-gr-item\">are actually involved in (수동태): be동사(are)+p.p.(involved) 구조. involve는 타동사인데 뒤에 목적어가 없어서 수동구조 are involved 형태로 쓴다. 기본구조: involve + O + in B (O를 B에 관련/참여시키다).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">involved in<\/td><td class=\"m\">~에 관여하는, ~에 참여하는<\/td><\/tr><tr><td class=\"w\">journalist<\/td><td class=\"m\">기자, 언론인<\/td><\/tr><tr><td class=\"w\">argue<\/td><td class=\"m\">주장하다<\/td><\/tr><tr><td class=\"w\">renewable<\/td><td class=\"m\">재생 가능한<\/td><\/tr><tr><td class=\"w\">infrastructure<\/td><td class=\"m\">기반 시설<\/td><\/tr><tr><td class=\"w\">project<\/td><td class=\"m\">투사하다, 예상하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">In addition to<\/span> solar panels and wind turbines,<\/b><\/span><span class=\"ko\">태양광 패널과 풍력 터빈에 더하여<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we have to build<\/b><\/span><span class=\"ko\">우리는 구축해야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>an alternative transport infrastructure, <span class=\"grammar-hl\">farming<\/span> procedures and industrial processes.<\/b><\/span><span class=\"ko\">대체 교통 기반 시설, 농업 절차 그리고 산업 프로세스를.<\/span><\/div><\/div><div class=\"lec-sent-ko\">태양광 패널과 풍력 터빈에 더하여 우리는 대체 교통 기반 시설, 농업 절차 그리고 산업 프로세스를 구축해야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> alternative transport infrastructure, farming procedures and industrial processes는 앞 문장에서 말한 &#39;거대한 프로젝트&#39;의 구체적인 범위를 보여줍니다. 에너지 생산 방식만 바꾸는 것이 아니라 이동 수단, 먹거리를 만드는 방식, 물건을 제조하는 방식 등 사회 전체의 시스템을 송두리째 개조해야 한다는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">In addition to (관용표현): &#39;~뿐만 아니라&#39;, &#39;~에 더하여&#39;라는 의미를 나타내는 구전치사이다.<\/div><div class=\"lec-gr-item\">farming (동명사(명사적)): farming(농사짓기/영농)이 명사 procedures와 결합하여 용도나 활동의 개념을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">infrastructure<\/td><td class=\"m\">기반 시설<\/td><\/tr><tr><td class=\"w\">solar<\/td><td class=\"m\">태양의<\/td><\/tr><tr><td class=\"w\">panel<\/td><td class=\"m\">패널, 판<\/td><\/tr><tr><td class=\"w\">wind<\/td><td class=\"m\">바람<\/td><\/tr><tr><td class=\"w\">alternative<\/td><td class=\"m\">대안, 선택지<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">transport<\/td><td class=\"m\">실어 나르다, 수송하다<\/td><\/tr><tr><td class=\"w\">procedure<\/td><td class=\"m\">절차, 방법<\/td><\/tr><tr><td class=\"w\">industrial<\/td><td class=\"m\">산업의, 공업의<\/td><\/tr><tr><td class=\"w\">process<\/td><td class=\"m\">과정, 절차<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This transformation<\/b><\/span><span class=\"ko\">이 변화는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">cannot happen<\/span><\/b><\/span><span class=\"ko\">일어날 수 없다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">without<\/span> fossil fuels.<\/b><\/span><span class=\"ko\">화석 연료 없이는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이 변화는 화석 연료 없이는 일어날 수 없다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> cannot happen without fossil fuels는 이 글의 핵심적인 역설을 제시합니다. 화석 연료를 버리기 위해 시작한 변화인데, 역설적이게도 그 변화를 실현하기 위한 기초 공사 단계에서는 화석 연료의 힘이 반드시 필요하다는 물리적 한계를 지적합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">cannot happen without 동사구 구조: 조동사 cannot과 자동사 happen이 결합하여 &#39;일어날 수 없다&#39;는 부정의 의미를 나타내며, 전치사 without이 &#39;~ 없이는&#39;이라는 조건의 의미를 더한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fossil fuels<\/td><td class=\"m\">화석 연료<\/td><\/tr><tr><td class=\"w\">transformation<\/td><td class=\"m\">변화, 탈바꿈<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>For instance,<\/b><\/span><span class=\"ko\">예를 들어<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>production of concrete structures and steel elements<\/b><\/span><span class=\"ko\">콘크리트 구조물과 강철 요소의 생산은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>require amounts of energy<\/b><\/span><span class=\"ko\">에너지의 양을 필요로 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> is only possible <span class=\"grammar-hl\">to produce<\/span><\/b><\/span><span class=\"ko\">오직 생산 가능한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with fossil energy.<\/b><\/span><span class=\"ko\">화석 에너지로만.<\/span><\/div><\/div><div class=\"lec-sent-ko\">예를 들어, 콘크리트 구조물과 강철 요소의 생산은 화석 에너지로만 생산가능한 에너지의 양을 필요로 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> only possible to produce with fossil energy는 재생 에너지 설비를 만들기 위한 핵심 자재인 콘크리트와 철강을 생산할 때, 현재의 기술로는 재생 에너지가 낼 수 없는 화석 연료 특유의 고온과 막대한 에너지가 필수적이라는 점을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that (관계대명사): 선행사 energy를 수식하는 주격 관계대명사이다. 뒤에 주어가 없는 불완전한 절이 이어지며 선행사를 부연 설명한다.<\/div><div class=\"lec-gr-item\">to produce (to부정사(부사적): 형용사 수식): 바로 앞의 형용사인 possible을 수식하고 있다. 판별: to V 바로 앞이 형용사이므로 부사적 용법(정도)에 해당한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fossil fuels<\/td><td class=\"m\">화석 연료<\/td><\/tr><tr><td class=\"w\">for instance<\/td><td class=\"m\">예를 들어<\/td><\/tr><tr><td class=\"w\">concrete<\/td><td class=\"m\">구체적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Production of solar panels<\/b><\/span><span class=\"ko\">태양광 패널의 생산은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>requires scarce and expensive minerals<\/b><\/span><span class=\"ko\">희귀하고 값비싼 광물들을 필요로 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> <span class=\"grammar-hl\">must be excavated<\/span>,<\/b><\/span><span class=\"ko\">발굴되어야 하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>again <span class=\"grammar-hl\">requiring<\/span> the use of fossil fuels.<\/b><\/span><span class=\"ko\">다시 화석 연료 사용을 필요로 하면서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">태양광 패널의 생산은 발굴되어져야 하는 희귀하고 값비싼 광물들을 필요로 하며, 이는 또한 화석 연료 사용을 필요로 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> again requiring the use of fossil fuels는 앞선 건축 자재 예시에 이어, 태양광 패널 자체를 만드는 과정에서도 광산에서 원료를 캐내고 운반하는 중장비들이 화석 연료를 써야만 한다는 연쇄적인 의존 관계를 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">which (관계대명사): 선행사 minerals를 수식하는 주격 관계대명사이다. 뒤에 동사 must be excavated가 이어지는 불완전한 절을 이끈다.<\/div><div class=\"lec-gr-item\">must be excavated (수동태): be동사(be)+p.p.(excavated) 구조. excavate는 타동사인데 뒤에 목적어가 없어서 수동구조 be excavated 형태로 쓴다. 기본구조: excavate + O (목적어를 발굴/굴착하다).<\/div><div class=\"lec-gr-item\">requiring (분사구문): 앞 절의 내용을 부수적으로 설명하는 현재분사 구문이다. 원래 절로 변환하면 &#39;and it requires&#39; 또는 &#39;which requires&#39;처럼 접속사나 관계사를 동반한 절로 바꿀 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">solar<\/td><td class=\"m\">태양의<\/td><\/tr><tr><td class=\"w\">panel<\/td><td class=\"m\">패널, 판<\/td><\/tr><tr><td class=\"w\">fossil fuels<\/td><td class=\"m\">화석 연료<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Thus,<\/b><\/span><span class=\"ko\">따라서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the harder we push<\/b><\/span><span class=\"ko\">우리가 더 세게 밀어붙일수록<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>towards a renewable energy system,<\/b><\/span><span class=\"ko\">재생 가능 에너지 시스템을 향하여<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the faster we have to use<\/b><\/span><span class=\"ko\">더 빠르게 우리는 사용해야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>fossil energy<\/b><\/span><span class=\"ko\">화석 에너지를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for the construction process.<\/b><\/span><span class=\"ko\">건설 과정을 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">따라서, 우리가 재생 가능 에너지 시스템을 향하여 더 세게 밀고 나아갈수록, 더 빠르게 우리는 건설 과정에서 화석 에너지를 사용해야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> the harder we push ~ the faster we have to use는 재생 에너지로의 전환 속도를 높이려 할수록 그 기반 시설을 짓기 위해 당장 소비해야 하는 화석 연료의 양도 비례해서 급증하게 된다는 모순적인 상황을 정리하여 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">the harder we push ... the faster we have to use (구문): &#39;the + 비교급, the + 비교급&#39; 구조로 &#39;~하면 할수록 더 ~하다&#39;는 비례 관계를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">renewable<\/td><td class=\"m\">재생 가능한<\/td><\/tr><tr><td class=\"w\">process<\/td><td class=\"m\">과정, 절차<\/td><\/tr><tr><td class=\"w\">fossil fuels<\/td><td class=\"m\">화석 연료<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This<\/b><\/span><span class=\"ko\">이것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is <span class=\"grammar-hl\">not only expensive,<\/span><\/b><\/span><span class=\"ko\">비쌀 뿐만 아니라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">but also an undermining factor<\/span><\/b><\/span><span class=\"ko\">또한 훼손하는 요인이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for our efforts<\/b><\/span><span class=\"ko\">우리의 노력에 있어<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to cut<\/span> global emissions.<\/b><\/span><span class=\"ko\">전세계적 배출을 줄이려는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이는 단지 비용이 많이 들 뿐만 아니라, 전세계적 배기가스를 줄이려는 우리의 노력을 훼손하는 요인이 된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> undermining factor는 탄소 배출을 줄이려고 재생 에너지 시설을 짓는데, 그 짓는 과정에서 탄소가 대량으로 배출되어 결국 원래의 목적을 훼손하거나 상쇄해 버린다는 심각한 부작용을 언급합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">not only expensive, but also an undermining factor (관용표현): 상관접속사 &#39;not only A but also B&#39; 구조로 &#39;A뿐만 아니라 B도&#39;라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">undermining factor (현재분사(형용사)): undermining이 명사 factor를 수식하고 있다. factor가 &#39;~하는(약화시키는)&#39; 능동적 성질을 나타내며 &#39;factor that undermines&#39;의 의미를 가진다.<\/div><div class=\"lec-gr-item\">to cut (to부정사(형용사적)): 명사인 efforts를 뒤에서 수식하여 그 구체적인 내용을 한정한다. 판별: efforts/ability/way 등은 to V의 수식을 받는 대표적인 명사이며, &#39;~하려는 노력&#39;으로 해석된다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Heinberg remarks<\/b><\/span><span class=\"ko\">Heinberg는 언급한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that the cost of building this new energy infrastructure<\/b><\/span><span class=\"ko\">이 새로운 에너지 기반 시설을 구축하는 비용이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">is seldom counted<\/span><\/b><\/span><span class=\"ko\">거의 계산되지 않는다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">in<\/span> transition proposals,<\/b><\/span><span class=\"ko\">전환 제안에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> tend <span class=\"grammar-hl\">to focus<\/span><\/b><\/span><span class=\"ko\">그런데 그것들은 집중하는 경향이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>just on energy supply requirements.<\/b><\/span><span class=\"ko\">단지 에너지 공급 요구 사항에만.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Heinberg는 이러한 새로운 에너지 기반 시설을 구축하는 비용이 전환 제안에서 거의 계산되지 않는다고 언급하는데, 이는 에너지 공급 요구 사항에만 집중하는 경향이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> seldom counted는 현재의 에너지 전환 계획들이 시설 완공 후의 깨끗한 에너지 공급량에만 매몰되어, 정작 그 시설을 짓는 과정에서 들어가는 &#39;화석 연료라는 비용&#39;을 계산에서 빠뜨리고 있다는 정책적 허점을 비판하며 글을 맺습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is seldom counted in (수동태): be동사(is)+p.p.(counted) 구조. count는 타동사인데 뒤에 목적어가 없어서 수동구조 is counted 형태로 쓴다. 기본구조: count + O + in B (O를 B에 포함시키다/계산에 넣다).<\/div><div class=\"lec-gr-item\">which (관계대명사): transition proposals를 선행사로 하는 주격 관계대명사의 계속적 용법이다. 관계대명사 뒤에 주어가 빠진 불완전한 문장이 이어진다.<\/div><div class=\"lec-gr-item\">to focus (to부정사): tend to V 구문으로 &#39;~하는 경향이 있다&#39;는 의미를 나타낸다. 판별: seem/appear/tend to V 등의 구문에 해당하며, 관용적인 동사 결합 구조로 본다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">infrastructure<\/td><td class=\"m\">기반 시설<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>재생 에너지 시스템 구축은 인류 역사상 가장 거대한 문명 개조 프로젝트이다.<\/li><li>태양광이나 풍력뿐 아니라 운송, 농업, 산업 전반의 인프라를 모두 바꿔야 한다.<\/li><li>역설적이게도 이런 친환경 시설을 건설하는 초기 단계에는 반드시 화석 연료가 필요하다.<\/li><li>전환을 서두를수록 건설 단계의 화석 연료 사용과 탄소 배출이 늘어나 본래 목적을 저해할 수 있다.<\/li><li>하지만 현재의 에너지 전환 계획들은 이러한 건설 과정상의 비용과 모순을 간과하고 있다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">The transition to renewable energy infrastructure is a monumental task, but the construction process inevitably consumes massive amounts of fossil fuels and undermines emission reduction efforts.<\/div>\n              <div class=\"lec-final-sum-ko\">재생 에너지 기반 시설로의 전환은 거대한 과업이지만, 그 건설 과정은 불가피하게 막대한 양의 화석 연료를 소비하며 배출 감소 노력을 약화시킨다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./34_audio/1.mp3","hl":null}],[{"audio":"./34_audio/2.mp3","hl":null}],[{"audio":"./34_audio/3.mp3","hl":null},{"audio":"./34_audio/4.mp3","hl":"stage-0"},{"audio":"./34_audio/5.mp3","hl":"stage-1"},{"audio":"./34_audio/6.mp3","hl":"stage-2"},{"audio":"./34_audio/7.mp3","hl":"stage-3"}],[{"audio":"./34_audio/8.mp3","hl":null}],[{"audio":"./34_audio/9.mp3","hl":"main"},{"audio":"./34_audio/10.mp3","hl":"meaning"},{"audio":"./34_audio/11.mp3","hl":"grammar"}],[{"audio":"./34_audio/12.mp3","hl":"main"},{"audio":"./34_audio/13.mp3","hl":"meaning"},{"audio":"./34_audio/14.mp3","hl":"grammar"}],[{"audio":"./34_audio/15.mp3","hl":"main"},{"audio":"./34_audio/16.mp3","hl":"meaning"},{"audio":"./34_audio/17.mp3","hl":"grammar"}],[{"audio":"./34_audio/18.mp3","hl":"main"},{"audio":"./34_audio/19.mp3","hl":"meaning"},{"audio":"./34_audio/20.mp3","hl":"grammar"}],[{"audio":"./34_audio/21.mp3","hl":"main"},{"audio":"./34_audio/22.mp3","hl":"meaning"},{"audio":"./34_audio/23.mp3","hl":"grammar"}],[{"audio":"./34_audio/24.mp3","hl":"main"},{"audio":"./34_audio/25.mp3","hl":"meaning"},{"audio":"./34_audio/26.mp3","hl":"grammar"}],[{"audio":"./34_audio/27.mp3","hl":"main"},{"audio":"./34_audio/28.mp3","hl":"meaning"},{"audio":"./34_audio/29.mp3","hl":"grammar"}],[{"audio":"./34_audio/30.mp3","hl":"main"},{"audio":"./34_audio/31.mp3","hl":"meaning"},{"audio":"./34_audio/32.mp3","hl":"grammar"}],[{"audio":"./34_audio/33.mp3","hl":null}]],"fileName":"EBS올림포스(연합기출)고1 2026년 14강 01번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"EBS올림포스(연합기출)고1 2026년 14강 01번","titleEn":"The Hidden Cost: Fossil Fuels Required for the Renewable Energy Transition","titleKo":"숨겨진 비용: 재생 에너지 전환을 위해 필요한 화석 연료","imageUrl":"__enpImg__","stages":[{"label":"01거대한 변화 프로젝트의 시작","items":["지구 온난화를 막기 위한 재생 에너지 기반 시설 구축은 인류 역사상 가장 큰 변화 중 하나다.","태양광 패널과 풍력 터빈을 넘어선 광범위한 변화 필요","운송 인프라, 농업 절차, 산업 공정의 전면적 개편","핵심 키워드: 재생 에너지 기반 시설(renewable energy infrastructure)"]},{"label":"02건설 과정의 필수적 에너지원","items":["이러한 거대한 전환 과정은 역설적으로 화석 연료 없이는 불가능하다.","콘크리트 및 강철 구조물 생산에 막대한 에너지 소모","태양광 패널용 광물 채굴 시 화석 연료 사용 불가피","핵심 키워드: 화석 연료(fossil fuels)"]},{"label":"03가속화에 따른 역설적 결과","items":["재생 에너지 시스템 구축을 서두를수록 건설 단계에서의 화석 연료 사용은 더 빨라진다.","건설 과정의 에너지 소비는 전환 비용을 상승시킴","탄소 배출을 줄이려는 노력을 스스로 훼손하는 요인이 됨","핵심 키워드: 훼손하는 요인(undermining factor)"]},{"label":"04에너지 전환 제안서의 맹점","items":["현재의 에너지 전환 제안서들은 기반 시설 구축에 드는 실제 비용을 간과하고 있다.","대부분의 제안서는 에너지 공급(energy supply) 요건에만 집중함","건설 과정에서 발생하는 에너지 소비와 비용은 거의 계산되지 않음","핵심 키워드:
