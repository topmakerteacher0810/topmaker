관적으로 기록하는 것이 아니라, 각자의 우선순위와 기대치라는 필터를 거쳐 만들어지는 주관적인 결과물이라고 할 수 있습니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01시각에 작용하는 선입견<\/div><ul><li>인간의 시각은 현실에 대한 선입견의 영향을 깊게 받는다.<\/li><li>시각의 주관적 특성: 선입견(preconceptions)이 인식에 개입함<\/li><li>현실(reality)을 있는 그대로가 아닌 기존 지식의 틀로 바라봄<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02무의식적 위계와 우선순위<\/div><ul><li>대상과의 기능적 관계에 따라 정보를 처리하는 우선순위가 결정된다.<\/li><li>대상과의 기능적 관계(functional relationship) 반영<\/li><li>무의식적 위계(unconscious hierarchies)와 순간적 우선순위 형성<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03망치를 통한 시각화 예시<\/div><ul><li>우리는 대상을 실용적인 관점에서 특정 각도로만 보려는 경향이 있다.<\/li><li>사용 준비(ready for use)가 된 측면 각도로 망치를 시각화함<\/li><li>시각적 기대(visual expectations)가 카메라처럼 보는 능력을 방해함<\/li><li>핵심 키워드: 시각화(visualizing)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04카메라의 객관적 기록<\/div><ul><li>카메라는 인간의 눈과 물리적으로 유사하지만 대상을 해석하지 않고 기록한다.<\/li><li>렌즈를 통해 세상을 공정하게 기록(documents impartially)함<\/li><li>오직 형태와 색상(shapes and colors)만을 포착하는 기계적 속성<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05사진이 주는 생경함의 원인<\/div><ul><li>사진은 인간의 해석을 거치지 않기에 때로는 낯설고 무질서하게 느껴진다.<\/li><li>기계적 무관심(mechanical indifference)으로 세부 사항을 노출함<\/li><li>사진의 평면성(flatness)으로 인해 형체를 알아보기 힘든 영역이 발생함<\/li><li>핵심 키워드: 해석(interpret)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">vision<\/td><td class=\"m\">시력, 시야<\/td><\/tr><tr><td class=\"w\">influence<\/td><td class=\"m\">영향을 미치다<\/td><\/tr><tr><td class=\"w\">preconception<\/td><td class=\"m\">예상, 선입견, 선개념<\/td><\/tr><tr><td class=\"w\">reality<\/td><td class=\"m\">현실<\/td><\/tr><tr><td class=\"w\">scene<\/td><td class=\"m\">장면, 광경<\/td><\/tr><tr><td class=\"w\">establish<\/td><td class=\"m\">세우다, 확립하다<\/td><\/tr><tr><td class=\"w\">hierarchy<\/td><td class=\"m\">위계, 서열<\/td><\/tr><tr><td class=\"w\">reflect<\/td><td class=\"m\">반영하다, 보여 주다<\/td><\/tr><tr><td class=\"w\">relationship<\/td><td class=\"m\">관계<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">object<\/td><td class=\"m\">물체, 대상<\/td><\/tr><tr><td class=\"w\">momentary<\/td><td class=\"m\">순간적인, 잠깐의<\/td><\/tr><tr><td class=\"w\">priority<\/td><td class=\"m\">우선(순위)<\/td><\/tr><tr><td class=\"w\">visualize<\/td><td class=\"m\">마음속에 그리다<\/td><\/tr><tr><td class=\"w\">hammer<\/td><td class=\"m\">망치<\/td><\/tr><tr><td class=\"w\">tend<\/td><td class=\"m\">~하는 경향이 있다<\/td><\/tr><tr><td class=\"w\">profile<\/td><td class=\"m\">옆모습, 윤곽<\/td><\/tr><tr><td class=\"w\">angle<\/td><td class=\"m\">각도<\/td><\/tr><tr><td class=\"w\">handle<\/td><td class=\"m\">손잡이<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Vision<\/b><\/span><span class=\"ko\">시각은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">is influenced<\/span><\/b><\/span><span class=\"ko\">영향을 받는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by our preconceptions about reality.<\/b><\/span><span class=\"ko\">현실에 대한 우리의 선입견에 의해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">시각은 현실에 대한 우리의 선입견에 의해 영향을 받는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 핵심 주제를 제시하는 문장입니다. Vision is influenced by our preconceptions는 우리가 눈으로 무언가를 볼 때 아무런 편견 없이 있는 그대로를 받아들이는 것이 아니라, 이미 머릿속에 들어 있는 세상에 대한 지식이나 고정관념을 바탕으로 정보를 재구성한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is influenced (수동태): be동사(is)+p.p.(influenced) 구조. influence는 타동사인데 뒤에 목적어가 없어서 수동구조 is influenced 형태로 쓴다. 기본구조: influence + O (A에게 영향을 주다)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">vision<\/td><td class=\"m\">시력, 시야<\/td><\/tr><tr><td class=\"w\">influence<\/td><td class=\"m\">영향을 미치다<\/td><\/tr><tr><td class=\"w\">preconception<\/td><td class=\"m\">예상, 선입견, 선개념<\/td><\/tr><tr><td class=\"w\">reality<\/td><td class=\"m\">현실<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In <span class=\"grammar-hl\">viewing<\/span> a scene,<\/b><\/span><span class=\"ko\">한 장면을 볼 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we establish unconscious hierarchies<\/b><\/span><span class=\"ko\">우리는 무의식적인 위계를 확립한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that reflect<\/span> our functional relationship to objects and our momentary priorities.<\/b><\/span><span class=\"ko\">사물과의 기능적 관계와 우리의 순간적인 우선순위를 반영하는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">한 장면을 볼 때, 우리는 우리의 사물과의 기능적 관계와 우리의 순간적인 우선순위를 반영하는 무의식적인 위계를 확립한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 선입견이 구체적으로 어떻게 작동하는지 설명합니다. establish unconscious hierarchies는 수많은 시각 정보 중에서 나에게 쓸모 있는 것과 지금 당장 중요한 것을 골라내어 뇌가 자동으로 우선순위를 매긴다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">viewing (동명사): 전치사 In의 목적어로 쓰여 &#39;~함에 있어서&#39;라는 의미를 나타내는 명사 역할.<\/div><div class=\"lec-gr-item\">that reflect (관계대명사): that reflect... 선행사 hierarchies를 수식하며 절 내에서 주어 역할을 하는 주격 관계대명사.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scene<\/td><td class=\"m\">장면, 광경<\/td><\/tr><tr><td class=\"w\">establish<\/td><td class=\"m\">세우다, 확립하다<\/td><\/tr><tr><td class=\"w\">hierarchy<\/td><td class=\"m\">위계, 서열<\/td><\/tr><tr><td class=\"w\">reflect<\/td><td class=\"m\">반영하다, 보여 주다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relationship<\/td><td class=\"m\">관계<\/td><\/tr><tr><td class=\"w\">object<\/td><td class=\"m\">물체, 대상<\/td><\/tr><tr><td class=\"w\">momentary<\/td><td class=\"m\">순간적인, 잠깐의<\/td><\/tr><tr><td class=\"w\">priority<\/td><td class=\"m\">우선(순위)<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>For example,<\/b><\/span><span class=\"ko\">예를 들어,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when <span class=\"grammar-hl\">visualizing<\/span> a hammer<\/b><\/span><span class=\"ko\">망치를 시각화할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in our mind's eye,<\/b><\/span><span class=\"ko\">우리 마음의 눈으로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we tend <span class=\"grammar-hl\">to \"see\"<\/span> it<\/b><\/span><span class=\"ko\">우리는 그것을 &quot;보는&quot; 경향이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in profile or at some other \"ready for use\" angle.<\/b><\/span><span class=\"ko\">옆모습이나 어떤 다른 &quot;사용 준비 완료&quot; 각도로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">예를 들어, 우리 마음의 눈으로 망치를 시각화할 때, 우리는 망치를 옆모습이나 &quot;사용 준비 완료&quot; 각도에서 &quot;보는&quot; 경향이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞의 추상적인 설명을 돕기 위해 망치라는 구체적인 소재를 예로 듭니다. &quot;ready for use&quot; angle은 망치를 단순한 쇳덩어리가 아니라 &#39;못을 박는 도구&#39;라는 기능적 관점에서 인식하기 때문에, 손으로 잡기 가장 편한 각도를 본능적으로 먼저 떠올리게 된다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">visualizing (분사구문): visualizing... 접속사 when이 명시된 형태의 분사구문이다. 원래 절: when we visualize a hammer...<\/div><div class=\"lec-gr-item\">to &quot;see&quot; (to부정사(명사적)): tend의 목적어로 쓰여 &#39;~하는 경향이 있다&#39;는 의미를 형성함.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">visualize<\/td><td class=\"m\">마음속에 그리다<\/td><\/tr><tr><td class=\"w\">hammer<\/td><td class=\"m\">망치<\/td><\/tr><tr><td class=\"w\">tend<\/td><td class=\"m\">~하는 경향이 있다<\/td><\/tr><tr><td class=\"w\">profile<\/td><td class=\"m\">옆모습, 윤곽<\/td><\/tr><tr><td class=\"w\">angle<\/td><td class=\"m\">각도<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>One<\/b><\/span><span class=\"ko\">사람은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>would probably not visualize a hammer<\/b><\/span><span class=\"ko\">아마 망치를 시각화하지 않을 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as <span class=\"grammar-hl\">seen<\/span> from the top<\/b><\/span><span class=\"ko\">위에서 보여진 모습으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so that the handle <span class=\"grammar-hl\">is hidden<\/span> by the hammer's head.<\/b><\/span><span class=\"ko\">손잡이가 망치 머리에 의해 가려지도록.<\/span><\/div><\/div><div class=\"lec-sent-ko\">손잡이가 망치 머리에 가려지도록 망치가 위에서 보여진 모습으로 아마 시각화하지 않을 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 예시를 보충하여 인간 시각의 특징을 강조합니다. the handle is hidden처럼 도구로서의 쓰임새를 파악하기 힘든 모습은, 비록 그것이 실제 가능한 모습일지라도 우리의 뇌가 망치라는 대상을 정의할 때 선택하지 않는 각도라는 점을 시사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">seen (과거분사(형용사)): seen이 앞에 나온 hammer를 수식함(= hammer that is seen...). 수식받는 명사(망치)가 보여지는 대상이므로 과거분사를 사용함.<\/div><div class=\"lec-gr-item\">is hidden (수동태): be동사(is)+p.p.(hidden) 구조. hide는 타동사인데 뒤에 목적어가 없어서 수동구조 is hidden 형태로 쓴다. 기본구조: hide + O (A를 숨기다)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">visualize<\/td><td class=\"m\">마음속에 그리다<\/td><\/tr><tr><td class=\"w\">hammer<\/td><td class=\"m\">망치<\/td><\/tr><tr><td class=\"w\">handle<\/td><td class=\"m\">손잡이<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The functional relationship<\/b><\/span><span class=\"ko\">기능적인 관계는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">we have with objects<\/span><\/b><\/span><span class=\"ko\">우리가 사물과 갖는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>creates visual expectations<\/b><\/span><span class=\"ko\">시각적 기대를 만든다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that interfere<\/span> with our ability <span class=\"grammar-hl\">to see<\/span> \"like a camera.\"<\/b><\/span><span class=\"ko\">&quot;카메라처럼&quot; 보는 우리의 능력을 방해하는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리가 가진 사물과의 기능적인 관계는 &quot;카메라처럼&quot; 보는 우리의 능력을 방해하는 시각적 기대를 만든다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 언급한 인간 시각의 특징을 정리하며 카메라와의 대비를 시작합니다. interfere with our ability to see &quot;like a camera&quot;는 물체가 가진 본래의 형체나 색깔을 편견 없이 포착하기보다는, 그 물체가 나에게 어떤 의미인지에 집중하느라 객관적인 관찰이 어려워진다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">we have with objects (관계대명사): 선행사 relationship 뒤에 목적격 관계대명사(which/that)가 생략된 구조로, 뒤에서 선행사를 수식함.<\/div><div class=\"lec-gr-item\">that interfere (관계대명사): that interfere... 선행사 visual expectations를 수식하며 절 내에서 주어 역할을 하는 주격 관계대명사.<\/div><div class=\"lec-gr-item\">to see (to부정사(형용사적)): 수식받는 명사: ability. ability, way, need 등 내용을 구체화하는 추상명사 뒤에서 수식하는 구조임.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relationship<\/td><td class=\"m\">관계<\/td><\/tr><tr><td class=\"w\">object<\/td><td class=\"m\">물체, 대상<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The camera,<\/b><\/span><span class=\"ko\">카메라는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>like the human eye,<\/b><\/span><span class=\"ko\">인간의 눈처럼,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">sees only shapes and colors<\/span>.<\/b><\/span><span class=\"ko\">오직 형태와 색깔만을 본다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">카메라는 인간의 눈처럼 오직 형태와 색깔만을 본다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 인간의 뇌가 정보를 처리하기 전, 물리적인 안구와 카메라 렌즈의 공통점을 짚어줍니다. sees only shapes and colors는 카메라가 정보를 받아들이는 초기 단계에서는 인간의 눈과 마찬가지로 빛의 파동과 형태라는 물리적 데이터만을 수용함을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">sees only shapes and colors (3형식(SVOC)): 주어(The camera) + 동사(sees) + 목적어(only shapes and colors)로 이루어진 문장 구조.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>It documents the world<\/b><\/span><span class=\"ko\">그것은 세상을 기록한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>impartially<\/b><\/span><span class=\"ko\">공평하게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>through a lens<\/b><\/span><span class=\"ko\">렌즈를 통해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that is similar<\/span> to the eye.<\/b><\/span><span class=\"ko\">눈과 비슷한.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것은 눈과 비슷한 렌즈를 통해 세상을 공평하게 기록한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 인간의 시각과 대비되는 카메라만의 특성을 부각합니다. documents the world impartially는 카메라가 인간처럼 대상의 쓸모나 중요도를 따져서 선별적으로 기록하지 않고, 렌즈 앞에 놓인 모든 요소를 차별 없이 담아낸다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that is similar (관계대명사): that is... 선행사 a lens를 수식하며 절 내에서 주어 역할을 하는 주격 관계대명사.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 8 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When we look at them carefully,<\/b><\/span><span class=\"ko\">우리가 그것들을 주의 깊게 들여다볼 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>photographs are often <span class=\"grammar-hl\">surprising<\/span><\/b><\/span><span class=\"ko\">사진들은 종종 놀랍다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because they don't interpret <span class=\"grammar-hl\">confusing<\/span> details<\/b><\/span><span class=\"ko\">그것들이 혼란을 주는 세부 사항들을 해석하지 않기 때문에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but simply serve them up to us<\/b><\/span><span class=\"ko\">단지 그것들을 우리에게 제공해주기 때문에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with a mechanical indifference.<\/b><\/span><span class=\"ko\">기계적인 무관심으로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리가 사진들을 주의 깊게 들여다볼 때, 그것들은 혼란을 주는 세부 사항들을 해석하는 것이 아니라 기계적인 무관심으로 우리에게 그것들을 단순히 제공해주기 때문에 종종 놀랍다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 카메라의 객관성이 사진이라는 결과물에서 어떻게 나타나는지 설명합니다. mechanical indifference는 카메라가 복잡한 시각 정보를 인간의 편의에 맞춰 정리하거나 생략하지 않고 그대로 쏟아내기 때문에, 때로는 우리가 평소 인지하지 못했던 낯선 모습이 사진에 찍혀 나온다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">surprising (현재분사(형용사)): surprising이 문장의 보어 자리에서 주어(photographs)의 상태가 놀라움을 준다는 능동의 의미를 나타냄.<\/div><div class=\"lec-gr-item\">confusing (현재분사(형용사)): confusing이 명사 details를 수식하여 &#39;혼란스럽게 만드는 세부사항&#39;이라는 의미를 형성함.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>And because of their flatness,<\/b><\/span><span class=\"ko\">그리고 그것들의 평면성 때문에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>photographs often contain areas<\/b><\/span><span class=\"ko\">사진들은 종종 영역을 포함한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that appear<\/span> as unrecognizable colors and shapes.<\/b><\/span><span class=\"ko\">알아보기 어려운 색과 형태들로 보이는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그리고 그것들의 평면성 때문에 사진들은 종종 알아보기 어려운 색과 형태들로 보이는 영역을 포함한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 사진이 인간의 인식과 다르게 보이는 마지막 물리적 이유를 덧붙입니다. unrecognizable colors and shapes는 입체적인 현실이 평면으로 옮겨지는 과정에서 생기는 왜곡을 인간의 뇌는 익숙한 방식으로 보정해서 보지만, 카메라는 그 왜곡된 모습 그대로를 기록하기에 우리 눈에는 낯설게 보일 수 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that appear (관계대명사): that appear... 선행사 areas를 수식하며 절 내에서 주어 역할을 하는 주격 관계대명사.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>인간의 시각은 대상의 기능적 용도나 중요도에 따른 선입견의 영향을 강하게 받는다.<\/li><li>망치를 떠올릴 때 사용하기 편한 각도만 생각하는 것이 인간 시각의 주관성을 보여주는 예다.<\/li><li>반면 카메라는 인간의 선입견이나 해석 없이 렌즈에 들어오는 빛과 형체를 객관적으로 기록한다.<\/li><li>이로 인해 사진은 인간이 평소 무시하거나 정리해버리는 세부 사항들을 기계적으로 보여주어 낯선 느낌을 주기도 한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Human vision is biased by functional expectations and preconceptions, whereas photography captures visual data impartially through mechanical indifference.<\/div>\n              <div class=\"lec-final-sum-ko\">인간의 시각은 기능적 기대와 선입견에 의해 편향되는 반면, 사진은 기계적인 무관심을 통해 시각적 데이터를 객관적으로 포착한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./40_audio/1.mp3","hl":null}],[{"audio":"./40_audio/2.mp3","hl":null}],[{"audio":"./40_audio/3.mp3","hl":null},{"audio":"./40_audio/4.mp3","hl":"stage-0"},{"audio":"./40_audio/5.mp3","hl":"stage-1"},{"audio":"./40_audio/6.mp3","hl":"stage-2"},{"audio":"./40_audio/7.mp3","hl":"stage-3"},{"audio":"./40_audio/8.mp3","hl":"stage-4"}],[{"audio":"./40_audio/9.mp3","hl":null}],[{"audio":"./40_audio/10.mp3","hl":"main"},{"audio":"./40_audio/11.mp3","hl":"meaning"},{"audio":"./40_audio/12.mp3","hl":"grammar"}],[{"audio":"./40_audio/13.mp3","hl":"main"},{"audio":"./40_audio/14.mp3","hl":"meaning"},{"audio":"./40_audio/15.mp3","hl":"grammar"}],[{"audio":"./40_audio/16.mp3","hl":"main"},{"audio":"./40_audio/17.mp3","hl":"meaning"},{"audio":"./40_audio/18.mp3","hl":"grammar"}],[{"audio":"./40_audio/19.mp3","hl":"main"},{"audio":"./40_audio/20.mp3","hl":"meaning"},{"audio":"./40_audio/21.mp3","hl":"grammar"}],[{"audio":"./40_audio/22.mp3","hl":"main"},{"audio":"./40_audio/23.mp3","hl":"meaning"},{"audio":"./40_audio/24.mp3","hl":"grammar"}],[{"audio":"./40_audio/25.mp3","hl":"main"},{"audio":"./40_audio/26.mp3","hl":"meaning"},{"audio":"./40_audio/27.mp3","hl":"grammar"}],[{"audio":"./40_audio/28.mp3","hl":"main"},{"audio":"./40_audio/29.mp3","hl":"meaning"},{"audio":"./40_audio/30.mp3","hl":"grammar"}],[{"audio":"./40_audio/31.mp3","hl":"main"},{"audio":"./40_audio/32.mp3","hl":"meaning"},{"audio":"./40_audio/33.mp3","hl":"grammar"}],[{"audio":"./40_audio/34.mp3","hl":"main"},{"audio":"./40_audio/35.mp3","hl":"meaning"},{"audio":"./40_audio/36.mp3","hl":"grammar"}],[{"audio":"./40_audio/37.mp3","hl":null}]],"fileName":"EBS올림포스(연합기출)고1 2026년 18강 01번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"EBS올림포스(연합기출)고1 2026년 18강 01번","titleEn":"How Preconceptions Shape Vision: The Difference Between Human Sight and the Camera Lens","titleKo":"선입견이 시각을 형성하는 방식: 인간의 시각과 카메라 렌즈의 차이","imageUrl":"__enpImg__","stages":[{"label":"01시각에 작용하는 선입견","items":["인간의 시각은 현실에 대한 선입견의 영향을 깊게 받는다.","시각의 주관적 특성: 선입견(preconceptions)이 인식에 개입함","현실(reality)을 있는 그대로가 아닌 기존 지식의 틀로 바라봄"]},{"label":"02무의식적 위계와 우선순위","items":["대상과의 기능적 관계에 따라 정보를 처리하는 우선순위가 결정된다.","대상과의 기능적 관계(functional relationship) 반영","무의식적 위계(unconscious hierarchies)와 순간적 우선순위 형성"]},{"label":"03망치를 통한 시각화 예시","items":["우리는 대상을 실용적인 관점에서 특정 각도로만 보려는 경향이 있다.","사용 준비(ready for use)가 된 측면 각도로 망치를 시각화함","시각적 기대(visual expectations)가 카메라처럼 보는 능력을 방해함","핵심 키워드: 시각화(visualizing)"]},{"label":"04카메라의 객관적 기록","items":["카메라는 인간의 눈과 물리적으로 유사하지만 대상을 해석하지 않고 기록한다.","렌즈를 통해 세상을 공정하게 기록(documents impartially)함","오직 형태와 색상(shapes and colors)만을 포착하는 기계적 속성"]},{"label":"05사진이 주는 생경함의 원인","items":["사진은 인간의 해석을 거치지 않기에 때로는 낯설고 무질서하게 느껴진다.","기계적 무관심(mechanical indifference)으로 세부 사항을 노출함","사진의 평면성(flatness)으로 인해 형체를 알아보기 힘든 영역이 발생함","핵심 키워드: 해석(interpret)"]}],"bkg":"우리는 흔히 눈에 보이는 대로 세상을 본다고 생각하지만, 사실 인간의 뇌는 과거의 경험과 사물의 용도에 따라 정보를 재구성하는 시각적 스키마(Visual Schema)를 활용해 세상을 해석합니다. 이는 사물을 단순한 형태가 아니라 우리에게 주는 기능적 가치로 파악하는 어포던스(Affordance) 이론과도 맞닿아 있는데, 예를 들어 의자를 볼 때 단순한 '네모'가 아니라 '앉는 도구'라는 기능적 관계(Functional Relationship)를 중심으로 지각하게 되는 식이죠. 반면 카메라(Camera)는 렌즈에 들어오는 빛과 색깔을 있는 그대로 포착하는 기계적 무관심(Mechanical Indifference)을 유지하기 때문에, 우리의 주관적 해석이 빠진 사진 속 모습이 때로는 낯설거나 이해하기 어려운 형태로 다가오기도 합니다. 결국 인간의 지각(Perception)은 렌즈처럼 세상을 객관적으로 기록하는 것이 아니라, 각자의 우선순위와 기대치라는 필터를 거쳐 만들어지는 주관적인 결과물이라고 할 수 있습니다.","ttsText":"우리는 흔히 눈에 보이는 대로 세상을 본다고 생각하지만, 사실 인간의 뇌는 과거의 경험과 사물의 용도에 따라 정보를 재구성하는 시각적 스키마(Visual Schema)를 활용해 세상을 해석합니다. 이는 사물을 단순한 형태가 아니라 우리에게 주는 기능적 가치로 파악하는 어포던스(Affordance) 이론과도 맞닿아 있는데, 예를 들어 의자를 볼 때 단순한 '네모'  / 40번"},{"kind":"summary","passageName":"EBS올림포스(연합기출)고1 2026년 18강 01번","imageUrl":"__enpImg__","sumEn":"Human vision is biased by functional expectations and preconceptions, whereas photography captures visual data impartially through mechanical indifference.","sumKo":"인간의 시각은 기능적 기대와 선입견에 의해 편향되는 반면, 사진은 기계적인 무관심을 통해 시각적 데이터를 객관적으로 포착한다.","bullets":[],"overall":["인간의 시각은 대상의 기능적 용도나 중요도에 따른 선입견의 영향을 강하게 받는다.","망치를 떠올릴 때 사용하기 편한 각도만 생각하는 것이 인간 시각의 주관성을 보여주는 예다.","반면 카메라는 인간의 선입견이나 해석 없이 렌즈에 들어오는 빛과 형체를 객관적으로 기록한다.","이로 인해 사진은 인간이 평소 무시하거나 정리해버리는 세부 사항들을 기계적으로 보여주어 낯선 느낌을 주기도 한다."],"compare":{"headers":["구분","인간의 시각","카메라(사진)"],"rows":[["인식 방식","기능 및 우선순위 반영","기계적이고 중립적인 기록"],["정보 처리","무의식적 계층화 및 해석","해석 없는 데이터 나열"],["사물을 보는 각도","사용하기 편리한 각도 선호","위치에 따른 물리적 각도"],["결과물의 특징","기대를 충족하는 익숙한 모습","가끔은 낯설고 혼란스러운 모습"]]},"ttsText":"인간의 시각은 대상의 기능적 용도나 중요도에 따른 선입견의 영향을 강하게 받는다. 망치를 떠올릴 때 사용하기 편한 각도만 생각하는 것이 인간 시각의 주관성을 보여주는 예다. 반면 카메라는 인간의 선입견이나 해석 없이 렌즈에 들어오는 빛과 형체를 객관적으로 기록한다. 이로 인해 사진은 인간이 평소 무시하거나 정리해버리는 세부 사항들을 기계적으로 보여주어 낯선 느낌을 주기도 한다.","__passage":"EBS올림포스(연합기출)고1 2026년 18강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 40번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 인간의 시각은 대상의 기능적 용도나 중요도에 따른 선입견의 영향을 강하게 받습니다. 망치를 떠올릴 때 사용하기 편한 각도만 생각하는 것이 인간 시각의 주관성을 보여주는 옙니다. 반면 카메라는 인간의 선입견이나 해석 없이 렌즈에 들어오는 빛과 형체를 객관적으로 기록합니다. 이로 인해 사진은 인간이 평소 무시하거나 정리해버리는 세부 사항들을 기계적으로 보여주어 낯선 느낌을 주기도 합니다. 마지막으로 이 글을 한 문장으로 요약하면 이렇습니다. 인간의 시각은 기능적 기대와 선입견에 의해 편향되는 반면, 사진은 기계적인 무관심을 통해 시각적 데이터를 객관적으로 포착합니다. 오늘도 정말 수고 많았습니다!"}]}</script><script>var D=JSON.parse(document.getElementById("enpLecData").textContent);var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl"
