지 연결된 거대한 생태계의 일부라는 점을 이해하는 데 큰 도움을 줍니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01신체 원자의 교환<\/div><ul><li>호흡을 통해 원자가 몸 안팎으로 드나들며 신체의 일부가 된다.<\/li><li>숨을 쉴 때 일부 원자는 체내에 남고 일부는 배출됨<\/li><li>남은 원자들은 우리 몸을 구성하는 요소가 됨<\/li><li>핵심 키워드: 호흡(breathe), 신체의 일부(part of you)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02소유가 아닌 대여<\/div><ul><li>우리는 몸을 구성하는 원자를 소유하는 것이 아니라 잠시 빌려 쓰는 것이다.<\/li><li>인간은 원자를 독점적으로 소유(own)할 수 없음<\/li><li>원자는 우리 사이를 영원히 이동하며 공유됨<\/li><li>핵심 키워드: 대여(borrow), 원자 풀(atom pool)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03전 지구적 재활용<\/div><ul><li>호흡과 땀의 증발 등을 통해 원자는 거대한 규모로 재활용된다.<\/li><li>원자는 사람에서 사람으로 순환하며 이동함<\/li><li>생물학적 활동을 통한 광범위한 재순환 과정<\/li><li>핵심 키워드: 증발(evaporated), 재활용(recycle)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04원자의 우주적 기원<\/div><ul><li>우리 몸의 원자들은 우주나 태양, 지구의 탄생만큼이나 오래된 역사를 지닌다.<\/li><li>가벼운 원자는 우주의 기원(origin of the universe)과 함께함<\/li><li>무거운 원자들은 태양이나 지구보다 나이가 많음<\/li><li>핵심 키워드: 고대의 원자(old as the universe), 시간의 시작(first moments of time)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05생명과 무생물의 순환<\/div><ul><li>원자는 우주 속에서 생명체와 비생명체의 형태를 넘나들며 존재한다.<\/li><li>원자는 제한 없는 형태(limitless forms) 속에서 재활용됨<\/li><li>살아있는 것과 살아있지 않은 것 사이의 경계를 넘음<\/li><li>핵심 키워드: 생명체와 비생명체(living and nonliving)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-5\"><div class=\"lec-stage-head\">06임시 관리자로서의 인간<\/div><ul><li>인간은 현재 몸에 머무는 원자들의 일시적인 관리자일 뿐이다.<\/li><li>우리는 현재 원자의 관리자(present caretaker) 역할을 함<\/li><li>우리 이후에도 수많은 다른 존재들이 이 원자들을 이어받음<\/li><li>핵심 키워드: 관리자(caretaker), 후속 존재(follow you)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atom<\/td><td class=\"m\">원자<\/td><\/tr><tr><td class=\"w\">universe<\/td><td class=\"m\">우주<\/td><\/tr><tr><td class=\"w\">breathe<\/td><td class=\"m\">숨 쉬다, 호흡하다<\/td><\/tr><tr><td class=\"w\">inhale<\/td><td class=\"m\">숨을 들이쉬다<\/td><\/tr><tr><td class=\"w\">exhale<\/td><td class=\"m\">숨을 내쉬다, (연기를) 내뿜다<\/td><\/tr><tr><td class=\"w\">remaining<\/td><td class=\"m\">남은, 남아 있는<\/td><\/tr><tr><td class=\"w\">means<\/td><td class=\"m\">수단, 방법<\/td><\/tr><tr><td class=\"w\">borrow<\/td><td class=\"m\">빌리다<\/td><\/tr><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sweat<\/td><td class=\"m\">땀을 흘리다, 땀<\/td><\/tr><tr><td class=\"w\">evaporate<\/td><td class=\"m\">증발하다<\/td><\/tr><tr><td class=\"w\">recycle<\/td><td class=\"m\">재활용하다<\/td><\/tr><tr><td class=\"w\">grand<\/td><td class=\"m\">웅장한, 성대한<\/td><\/tr><tr><td class=\"w\">scale<\/td><td class=\"m\">규모, 크기<\/td><\/tr><tr><td class=\"w\">origin<\/td><td class=\"m\">기원, 근원<\/td><\/tr><tr><td class=\"w\">exist<\/td><td class=\"m\">존재하다<\/td><\/tr><tr><td class=\"w\">recycling<\/td><td class=\"m\">재활용<\/td><\/tr><tr><td class=\"w\">throughout<\/td><td class=\"m\">~ 내내, ~ 도처에<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Many atoms in your body<\/b><\/span><span class=\"ko\">당신의 몸에 있는 많은 원자는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are nearly <span class=\"grammar-hl\">as old<\/span><\/b><\/span><span class=\"ko\">거의 그만큼 오래되었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as<\/span> the universe itself.<\/b><\/span><span class=\"ko\">우주 자체만큼이나<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신의 몸에 있는 많은 원자는 거의 우주 자체만큼이나 오래되었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로, 인간의 신체를 구성하는 물질이 아주 먼 과거인 우주의 탄생 시점과 연결되어 있다는 거대 담론을 제시합니다. nearly as old as the universe라는 표현은 우리 몸이 단순히 최근에 만들어진 유기물의 집합이 아니라, 수십억 년의 시간을 버텨온 고대 물질로 이루어져 있다는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">as old as (관용표현): &#39;as + 형용사/부사 + as&#39; 구조로 &#39;~만큼 ...한&#39;이라는 원급 비교를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atom<\/td><td class=\"m\">원자<\/td><\/tr><tr><td class=\"w\">universe<\/td><td class=\"m\">우주<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When you breathe,<\/b><\/span><span class=\"ko\">당신이 숨을 쉴 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for example,<\/b><\/span><span class=\"ko\">예를 들어,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>only some of the atoms <span class=\"grammar-hl\">that you inhale<\/span><\/b><\/span><span class=\"ko\">당신이 들이마신 원자 중 일부만이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">are exhaled<\/span><\/b><\/span><span class=\"ko\">내뱉어진다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in your next breath.<\/b><\/span><span class=\"ko\">당신의 다음 숨에서<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신이 숨을 쉴 때, 예를 들어, 당신이 들이마신 원자 중 일부만이 당신의 다음 숨에서 내뱉어진다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 추상적인 설명을 일상적인 호흡이라는 구체적인 사례로 뒷받침합니다. only some of the atoms는 우리가 공기를 마시고 내뱉는 단순한 행위 속에서도 물질의 일부가 우리 몸속에 머물게 되는 선택적 잔류 현상을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that you inhale (관계대명사): 목적격 관계대명사 that이 이끄는 절이 선행사 atoms를 수식한다. 타동사 inhale의 목적어가 빠져 있는 불완전한 절이다.<\/div><div class=\"lec-gr-item\">are exhaled (수동태): be동사(are)+p.p.(exhaled) 구조. exhale은 타동사인데 뒤에 목적어가 없어서 수동구조 are exhaled 형태로 쓴다. 기본구조: V + O.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atom<\/td><td class=\"m\">원자<\/td><\/tr><tr><td class=\"w\">breathe<\/td><td class=\"m\">숨 쉬다, 호흡하다<\/td><\/tr><tr><td class=\"w\">inhale<\/td><td class=\"m\">숨을 들이쉬다<\/td><\/tr><tr><td class=\"w\">exhale<\/td><td class=\"m\">숨을 내쉬다, (연기를) 내뿜다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The <span class=\"grammar-hl\">remaining<\/span> atoms<\/b><\/span><span class=\"ko\">남아있는 원자는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">are taken<\/span> into your body<\/b><\/span><span class=\"ko\">당신의 몸으로 받아들여진다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to become<\/span> part of you,<\/b><\/span><span class=\"ko\">당신의 일부가 되기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and they later leave your body<\/b><\/span><span class=\"ko\">그리고 그것들은 나중에 당신의 몸을 떠난다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by various means.<\/b><\/span><span class=\"ko\">다양한 수단에 의해<\/span><\/div><\/div><div class=\"lec-sent-ko\">남아있는 원자는 당신의 몸으로 들어가 당신의 일부가 되고, 이후 그것들은 다양한 방법으로 당신의 몸을 떠난다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 호흡을 통해 나가지 않은 원자들이 어떻게 신체의 일부가 되는지, 그리고 결국 다시 외부로 나가는 과정을 설명하며 물질의 일시적 체류를 묘사합니다. by various means는 땀, 배설, 피부 세포의 탈락 등 우리 몸에서 물질이 빠져나가는 모든 생리적 경로를 포괄합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">remaining (현재분사(형용사)): 현재분사 remaining이 명사 atoms를 앞에서 수식한다(= &quot;남아 있는 원자들&quot;).<\/div><div class=\"lec-gr-item\">are taken (수동태): be동사(are)+p.p.(taken) 구조. take는 타동사인데 뒤에 목적어가 없어서 수동구조 are taken 형태로 쓴다. 기본구조: V + O.<\/div><div class=\"lec-gr-item\">to become (to부정사(부사적): 결과): 문맥상 몸 안으로 들어가서 &quot;결국 ~가 되다&quot;라는 결과를 나타낸다. 바로 앞의 명사 body를 수식하는 구조가 아니므로 형용사적 용법으로 보지 않는다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atom<\/td><td class=\"m\">원자<\/td><\/tr><tr><td class=\"w\">remaining<\/td><td class=\"m\">남은, 남아 있는<\/td><\/tr><tr><td class=\"w\">means<\/td><td class=\"m\">수단, 방법<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>You don't \"own\" the atoms<\/b><\/span><span class=\"ko\">당신은 원자를 &#39;소유&#39;하지 않는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that make up<\/span> your body;<\/b><\/span><span class=\"ko\">당신의 몸을 구성하는;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you borrow them.<\/b><\/span><span class=\"ko\">당신은 그것들을 빌린다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신은 당신의 몸을 구성하는 원자를 &#39;소유&#39;하지 않는다. 당신은 그것들을 빌린다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 설명한 원자의 출입 과정을 바탕으로 소유권에 대한 철학적 통찰을 던집니다. borrow them이라는 표현은 인간이 자기 몸의 주인이라고 생각하지만, 실제로는 우주의 공용 자원을 잠시 대여해서 쓰고 있을 뿐이라는 겸허한 관점을 제시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that make up (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사 atoms를 수식한다. 절 내부에서 that이 주어 역할을 한다.<\/div><div class=\"lec-gr-item\">make up (관용표현): &#39;~을 구성하다&#39;라는 의미의 구동사다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atom<\/td><td class=\"m\">원자<\/td><\/tr><tr><td class=\"w\">borrow<\/td><td class=\"m\">빌리다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We all share<\/b><\/span><span class=\"ko\">우리 모두는 공유한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from the same atom pool<\/b><\/span><span class=\"ko\">같은 원자 풀로부터<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because atoms forever <span class=\"grammar-hl\">travel<\/span><\/b><\/span><span class=\"ko\">원자가 영원히 이동하기 때문에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">around, within, and among us<\/span>.<\/b><\/span><span class=\"ko\">우리 주변과 내부, 그리고 사이를<\/span><\/div><\/div><div class=\"lec-sent-ko\">원자는 영원히 우리 주변과 내부, 그리고 우리 사이를 이동하기 때문에 우리 모두는 같은 원자풀로부터 공유한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 개인의 차원을 넘어 인류 전체, 나아가 생태계 전체의 연결성으로 논의를 확장합니다. share from the same atom pool은 지구상에 존재하는 원자의 총량은 정해져 있으며, 그것이 끊임없이 돌고 돌아 모두가 같은 근원에서 나온 물질을 나누어 쓰고 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">travel around, within, and among us (관용표현): 전치사 세 개(around, within, among)가 병렬로 연결되어 대명사 us를 공통 목적어로 취하며 원자의 이동 경로를 구체적으로 묘사한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atom<\/td><td class=\"m\">원자<\/td><\/tr><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Atoms cycle<\/b><\/span><span class=\"ko\">원자는 순환한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from person to person<\/b><\/span><span class=\"ko\">사람에서 사람으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as we breathe<\/b><\/span><span class=\"ko\">우리가 숨을 쉴 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and as our sweat <span class=\"grammar-hl\">is evaporated<\/span>.<\/b><\/span><span class=\"ko\">그리고 우리의 땀이 증발할 때<\/span><\/div><\/div><div class=\"lec-sent-ko\">원자는 우리가 숨을 쉬고 땀이 증발하면서 사람에서 사람으로 순환한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 원자가 공유되는 구체적인 방식을 다시 한번 언급하며 논리적 설득력을 높입니다. cycle from person to person은 물리적인 경계가 무색하게 한 사람의 몸을 구성하던 성분이 다른 사람의 일부가 되는 역동적인 교환 과정을 시각적으로 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is evaporated (수동태): be동사(is)+p.p.(evaporated) 구조. evaporate은 타동사로 쓰여 &#39;~을 증발시키다&#39;라는 의미를 갖는데, 뒤에 목적어가 없어서 수동구조 is evaporated 형태로 쓴다. 기본구조: V + O.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atom<\/td><td class=\"m\">원자<\/td><\/tr><tr><td class=\"w\">breathe<\/td><td class=\"m\">숨 쉬다, 호흡하다<\/td><\/tr><tr><td class=\"w\">sweat<\/td><td class=\"m\">땀을 흘리다, 땀<\/td><\/tr><tr><td class=\"w\">evaporate<\/td><td class=\"m\">증발하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We recycle atoms<\/b><\/span><span class=\"ko\">우리는 원자를 재순환시킨다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">on a grand scale<\/span>.<\/b><\/span><span class=\"ko\">거대한 규모로<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리는 거대한 규모로 원자를 재순환시킨다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 지금까지 설명한 미시적인 원자의 이동을 &#39;재활용&#39;이라는 단어로 집약하여 결론짓습니다. on a grand scale은 이러한 현상이 단 한두 번이 아니라 우주적 시간과 지구적 공간 전체에서 벌어지는 거대한 순환 체계임을 상기시킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">on a grand scale (관용표현): &#39;거대한 규모로&#39;라는 의미의 굳어진 어구다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atom<\/td><td class=\"m\">원자<\/td><\/tr><tr><td class=\"w\">recycle<\/td><td class=\"m\">재활용하다<\/td><\/tr><tr><td class=\"w\">grand<\/td><td class=\"m\">웅장한, 성대한<\/td><\/tr><tr><td class=\"w\">scale<\/td><td class=\"m\">규모, 크기<\/td><\/tr><tr><td class=\"w\">recycling<\/td><td class=\"m\">재활용<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The origin<\/b><\/span><span class=\"ko\">기원은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of the lightest atoms<\/b><\/span><span class=\"ko\">가장 가벼운 원자의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">goes back<\/span><\/b><\/span><span class=\"ko\">거슬러 올라간다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to<\/span> the origin of the universe,<\/b><\/span><span class=\"ko\">우주의 기원으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and most heavier atoms<\/b><\/span><span class=\"ko\">그리고 대부분의 더 무거운 원자는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are older<\/b><\/span><span class=\"ko\">더 오래되었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than the Sun and Earth.<\/b><\/span><span class=\"ko\">태양과 지구보다<\/span><\/div><\/div><div class=\"lec-sent-ko\">가장 가벼운 원자의 기원은 우주의 기원으로 거슬러 올라가며, 대부분의 더 무거운 원자는 태양과 지구보다 오래되었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 다시 원자의 물리적 기원으로 돌아가 원자가 얼마나 오래된 존재인지 배경지식을 제공합니다. older than the Sun and Earth는 우리 몸의 구성 성분이 우리가 발을 딛고 있는 행성이나 태양계보다도 먼저 존재했다는 경이로운 사실을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">goes back to (관용표현): &#39;(기원/시간이) ~까지 거슬러 올라가다&#39;라는 의미의 구동사다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atom<\/td><td class=\"m\">원자<\/td><\/tr><tr><td class=\"w\">universe<\/td><td class=\"m\">우주<\/td><\/tr><tr><td class=\"w\">origin<\/td><td class=\"m\">기원, 근원<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>There are atoms in your body<\/b><\/span><span class=\"ko\">당신의 몸에는 원자가 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that have existed<\/span> since the first moments of time,<\/b><\/span><span class=\"ko\">태초의 순간부터 존재해 온<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">recycling<\/span> throughout the universe<\/b><\/span><span class=\"ko\">우주 전체에 걸쳐 재순환하며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>among limitless forms,<\/b><\/span><span class=\"ko\">무한한 형태들 사이에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>both nonliving and living.<\/b><\/span><span class=\"ko\">비생물체와 생물체 모두인<\/span><\/div><\/div><div class=\"lec-sent-ko\">태초부터 존재해 온 원자가 당신의 몸에 있으며 제한 없는 형태, 즉 비생물체와 생물체 가운데 우주 전체에 걸쳐 재순환한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 원자의 영속성과 형태의 가변성을 결합하여 설명합니다. limitless forms는 지금은 내 몸의 일부인 원자가 과거에는 별의 먼지였을 수도 있고, 바위였을 수도 있으며, 혹은 수천 년 전의 다른 생명체였을 수도 있다는 광범위한 변천사를 뜻합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that have existed (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사 atoms를 수식한다. 절 내부에서 that이 주어 역할을 한다.<\/div><div class=\"lec-gr-item\">recycling (분사구문): 현재분사 -ing가 문장 뒤에서 부수적인 상황을 설명하는 구조다. 원래 절로 변환하면 while they recycle(또는 while they are recycling) throughout the universe...가 된다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atom<\/td><td class=\"m\">원자<\/td><\/tr><tr><td class=\"w\">universe<\/td><td class=\"m\">우주<\/td><\/tr><tr><td class=\"w\">recycle<\/td><td class=\"m\">재활용하다<\/td><\/tr><tr><td class=\"w\">exist<\/td><td class=\"m\">존재하다<\/td><\/tr><tr><td class=\"w\">recycling<\/td><td class=\"m\">재활용<\/td><\/tr><tr><td class=\"w\">throughout<\/td><td class=\"m\">~ 내내, ~ 도처에<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>You're the present <span class=\"grammar-hl\">caretaker<\/span><\/b><\/span><span class=\"ko\">당신은 현재의 관리인이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">of<\/span> the atoms in your body.<\/b><\/span><span class=\"ko\">당신의 몸속 원자의<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신은 몸속 원자의 현재 관리인이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 인간의 존재 정의를 다시 내립니다. present caretaker는 우리가 원자의 영원한 주인이 아니라, 살아있는 동안 잠시 그 물질들이 흩어지지 않게 유지하고 보살피는 임시 관리인에 불과하다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">caretaker of (관용표현): &#39;~을 관리하는 사람/보호자&#39;라는 의미의 명사구 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atom<\/td><td class=\"m\">원자<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 11 / 11<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>There will be many<\/b><\/span><span class=\"ko\">많은 이들이 있을 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who will follow you<\/span>.<\/b><\/span><span class=\"ko\">당신의 뒤를 이을<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신의 뒤를 이을 많은 것[사람]들이 있을 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 마무리로, 사후에도 원자의 순환은 계속될 것임을 암시합니다. many who will follow you는 내가 죽은 뒤 내 몸을 이루던 원자들이 다시 흩어져 미래 세대의 누군가를 구성하게 될 것이라는 연속성을 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who will follow you (관계대명사): 주격 관계대명사 who가 이끄는 절이 선행사 many(대명사로 &#39;많은 사람들&#39;)를 수식한다. 절 내부에서 who가 주어 역할을 한다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>우리 몸을 구성하는 원자들은 우주 탄생만큼이나 오래된 고대의 물질이다.<\/li><li>호흡과 배설 등을 통해 원자는 끊임없이 우리 몸을 드나들며, 우리는 이를 잠시 빌려 쓰는 것에 불과하다.<\/li><li>모든 인간과 생명체는 동일한 원자 저장고를 공유하며 서로의 원자를 순환시키고 재활용한다.<\/li><li>우리는 몸속 원자의 영구한 소유주가 아니라, 잠시 거쳐 가는 임시 관리인이며 이 순환은 미래에도 계속된다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Humans act as temporary caretakers of atoms because these particles have recycled through countless forms since the origin of the universe.<\/div>\n              <div class=\"lec-final-sum-ko\">원자는 우주의 기원부터 무수한 형태를 거쳐 재순환되어 왔기 때문에 인간은 단순히 이러한 원자들의 일시적인 관리자 역할을 할 뿐이다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./21_audio/1.mp3","hl":null}],[{"audio":"./21_audio/2.mp3","hl":null}],[{"audio":"./21_audio/3.mp3","hl":null},{"audio":"./21_audio/4.mp3","hl":"stage-0"},{"audio":"./21_audio/5.mp3","hl":"stage-1"},{"audio":"./21_audio/6.mp3","hl":"stage-2"},{"audio":"./21_audio/7.mp3","hl":"stage-3"},{"audio":"./21_audio/8.mp3","hl":"stage-4"},{"audio":"./21_audio/9.mp3","hl":"stage-5"}],[{"audio":"./21_audio/10.mp3","hl":null}],[{"audio":"./21_audio/11.mp3","hl":"main"},{"audio":"./21_audio/12.mp3","hl":"meaning"},{"audio":"./21_audio/13.mp3","hl":"grammar"}],[{"audio":"./21_audio/14.mp3","hl":"main"},{"audio":"./21_audio/15.mp3","hl":"meaning"},{"audio":"./21_audio/16.mp3","hl":"grammar"}],[{"audio":"./21_audio/17.mp3","hl":"main"},{"audio":"./21_audio/18.mp3","hl":"meaning"},{"audio":"./21_audio/19.mp3","hl":"grammar"}],[{"audio":"./21_audio/20.mp3","hl":"main"},{"audio":"./21_audio/21.mp3","hl":"meaning"},{"audio":"./21_audio/22.mp3","hl":"grammar"}],[{"audio":"./21_audio/23.mp3","hl":"main"},{"audio":"./21_audio/24.mp3","hl":"meaning"},{"audio":"./21_audio/25.mp3","hl":"grammar"}],[{"audio":"./21_audio/26.mp3","hl":"main"},{"audio":"./21_audio/27.mp3","hl":"meaning"},{"audio":"./21_audio/28.mp3","hl":"grammar"}],[{"audio":"./21_audio/29.mp3","hl":"main"},{"audio":"./21_audio/30.mp3","hl":"meaning"},{"audio":"./21_audio/31.mp3","hl":"grammar"}],[{"audio":"./21_audio/32.mp3","hl":"main"},{"audio":"./21_audio/33.mp3","hl":"meaning"},{"audio":"./21_audio/34.mp3","hl":"grammar"}],[{"audio":"./21_audio/35.mp3","hl":"main"},{"audio":"./21_audio/36.mp3","hl":"meaning"},{"audio":"./21_audio/37.mp3","hl":"grammar"}],[{"audio":"./21_audio/38.mp3","hl":"main"},{"audio":"./21_audio/39.mp3","hl":"meaning"},{"audio":"./21_audio/40.mp3","hl":"grammar"}],[{"audio":"./21_audio/41.mp3","hl":"main"},{"audio":"./21_audio/42.mp3","hl":"meaning"},{"audio":"./21_audio/43.mp3","hl":"grammar"}],[{"audio":"./21_audio/44.mp3","hl":null}]],"fileName":"EBS올림포스(연합기출)고1 2026년 04강 01번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"EBS올림포스(연합기출)고1 2026년 04강 01번","titleEn":"Borrowed Atoms: The Eternal Journey of Matter through the Universe","titleKo":"빌려온 원자: 우주를 관통하는 물질의 영원한 여정","imageUrl":"__enpImg__","stages":[{"label":"01신체 원자의 교환","items":["호흡을 통해 원자가 몸 안팎으로 드나들며 신체의 일부가 된다.","숨을 쉴 때 일부 원자는 체내에 남고 일부는 배출됨","남은 원자들은 우리 몸을 구성하는 요소가 됨","핵심 키워드: 호흡(breathe), 신체의 일부(part of you)"]},{"label":"02소유가 아닌 대여","items":["우리는 몸을 구성하는 원자를 소유하는 것이 아니라 잠시 빌려 쓰는 것이다.","인간은 원자를 독점적으로 소유(own)할 수 없음","원자는 우리 사이를 영원히 이동하며 공유됨","핵심 키워드: 대여(borrow), 원자 풀(atom pool)"]},{"label":"03전 지구적 재활용","items":["호흡과 땀의 증발 등을 통해 원자는 거대한 규모로 재활용된다.","원자는 사람에서 사람으로 순환하며 이동함","생물학적 활동을 통한 광범위한 재순환 과정","핵심 키워드: 증발(evaporated), 재활용(recycle)"]},{"label":"04원자의 우주적 기원","items":["우리 몸의 원자들은 우주나 태양, 지구의 탄생만큼이나 오래된 역사를 지닌다.","가벼운 원자는 우주의 기원(origin of the universe)과 함께함","무거운 원자들은 태양이나 지구보다 나이가 많음","핵심 키워드: 고대의 원자(old as the universe), 시간의 시작(first moments of time)"]},{"label":"05생명과 무생물의 순환","items":["원자는 우주 속에서 생명체와 비생명체의 형태를 넘나들며 존재한다.","원자는 제한 없는 형태(limitless forms) 속에서 재활용됨","살아있는 것과 살아있지 않은 것 사이의 경계를 넘음","핵심 키워드: 생명체와 비생명체(living and nonliving)"]},{"label":"06임시 관리자로서의 인간","items":["인간은 현재 몸에 머무는 원자들의 일시적인 관리자일 뿐이다.","우리는 현재 원자의 관리자(present caretaker) 역할을 함","우리 이후에도 수많은 다른 존재들이 이 원자들을 이어받음","핵심 키워드: 관리자(caretaker), 후속 존재(follow you)"]}],"bkg":"우리가 숨을 쉬고 음식을 먹으며 몸을 구성하는 성분들은 사실 빅뱅 핵합성(Big Bang Nucleosynthesis)과 항성 핵합성(Stellar Nucleosynthesis)이라는 거대한 우주적 과정을 통해 아주 오래전 탄생했습니다. 원자는 사라지거나 새로 생겨나지 않는다는 질량 보존의 법칙(Law of Conservation of Mass)에 따라, 우리 몸속 원자들은 수십억 년 동안 지구상의 생물과 무생물을 끊임없이 오가는 생지화학적 순환(Biogeochemical Cycle)의 과정을 겪습니다. 마치 공공도서관의 책을 잠시 빌려 읽고 다시 반납하는 것처럼, 우리는 우주라는 거대한 자원 저장고에서 원자를 잠시 대여(Borrowing)하여 생명 활동을 유지하는 셈이죠. 이러한 과학적 맥락은 우리 각자가 독립된 존재인 동시에, 우주의 시작부터 지금까지 연결된 거대한 생태계의 일부라는 점을 이해하는 데 큰 도움을 줍니다.","ttsText":"우리가 숨을 쉬고 음식을 먹으며 몸을 구성하는 성분들은 사실 빅뱅 핵합성(Big Bang Nucleosynthesis)과 항성 핵합성(Stellar Nucleosynthesis)이라는 거대한 우주적 과정을 통해 아주 오래전 탄생했습니다. 원자는 사라지거나 새로 생겨나지 않는다는 질량 보존의 법칙(Law of Conservation of Mass)에 따라, 우리 몸속 원자들은 수십억 년 동안 지구상의 생물과 무생물을 끊임없이 오가는 생지화학적 순환(Biogeochemical Cycle)의 과정을 겪습니다. 마치 공공도서관의 책을 잠시 빌려 읽고 다시 반납하는 것처럼, 우리는 우주라는 거대한 자원 저장고에서 원자를 잠시 대여(Borrowing)하여 생명 활동을 유지하는 셈이죠. 이러한 과학적 맥락은 우리 각자가 독립된 존재인 동시에, 우주의 시작부터 지금까지 연결된 거대한 생태계의 일부라는 점을 이해하는 데 큰 도움을 줍니다.","__passage":"EBS올림포스(연합기출)고1 2026년 04강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 21번","__script":"자, 오늘 우리가 연합기출)고1 2026년 04강 01번","passageName":"EBS올림포스(연합기출)고1 2026년 04강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 21번"},{"kind":"sentence","idx":3,"total":11,"english":"The remaining atoms are taken into your body to become part of you, and they later leave your body by various means.","korean":"남아있는 원자는 당신의 몸으로 들어가 당신의 일부가 되고, 이후 그것들은 다양한 방법으로 당신의 몸을 떠난다.","chunks":[{"english":"The remaining atoms","englishHtml":"<b>The <span class=\"grammar-hl\">remaining<\/span> atoms<\/b>","korean":"남아있는 원자는"},{"english":"are taken into your body","englishHtml":"<b><span class=\"grammar-hl\">are taken<\/span> into your body<\/b>","korean":"당신의 몸으로 받아들여진다"},{"english":"to become part of you,","englishHtml":"<b><span class=\"grammar-hl\">to become<\/span> part of you,<\/b>","korean":"당신의 일부가 되기 위해"},{"english":"and they later leave your body","englishHtml":"<b>and they later leave your body<\/b>","korean":"그리고 그것들은 나중에 당신의 몸을 떠난다"},{"english":"by various means.","englishHtml":"<b>by various means.<\/b>","korean":"다양한 수단에 의해"}],"meaning":"호흡을 통해 나가지 않은 원자들이 어떻게 신체의 일부가 되는지, 그리고 결국 다시 외부로 나가는 과정을 설명하며 물질의 일시적 체류를 묘사합니다. by various means는 땀, 배설, 피부 세포의 탈락 등 우리 몸에서 물질이 빠져나가는 모든 생리적 경로를 포괄합니다.","grammar":"remaining (현재분사(형용사)): 현재분사 remaining이 명사 atoms를 앞에서 수식한다(= \"남아 있는 원자들\"). are taken (수동태): be동사(are)+p.p.(taken) 구조. take는 타동사인데 뒤에 목적어가 없어서 수동구조 are taken 형태로 쓴다. 기본구조: V + O. to become (to부정사(부사적): 결과): 문맥상 몸 안으로 들어가서 \"결국 ~가 되다\"라는 결과를 나타낸다. 바로 앞의 명사 body를 수식하는 구조가 아니므로 형용사적 용법으로 보지 않는다.","grammarItems":["remaining (현재분사(형용사)): 현재분사 remaining이 명사 atoms를 앞에서 수식한다(= \"남아 있는 원자들\").","are taken (수동태): be동사(are)+p.p.(taken) 구조. take는 타동사인데 뒤에 목적어가 없어서 수동구조 are taken 형태로 쓴다. 기본구조: V + O.","to become (to부정사(부사적): 결과): 문맥상 몸 안으로 들어가서 \"결국 ~가 되다\"라는 결과를 나타낸다. 바로 앞의 명사 body를 수식하는 구조가 아니므로 형용사적 용법으로 보지 않는다."],"vocab":[{"word":"atom","meaning":"원자"},{"word":"remaining","meaning":"남은, 남아 있는"},{"word":"means","meaning":"수단, 방법"}],"ttsText":"남아있는 원자는 당신의 몸으로 들어가 당신의 일부가 되고, 이후 그것들은 다양한 방법으로 당신  아니라, 잠시 거쳐 가는 임시 관리인이며 이 순환은 미래에도 계속된다."],"compare":{"headers":["구분","인간(개인)","원자(물질)"],"rows":[["시간적 특성","일시적이고 짧은 수명","우주 탄생부터 이어진 영속성"],["역할/지위","임시 관리인(Caretaker)","공유되는 자원(Pool)"],["소유 관계","소유하지 못하고 빌려 씀","여러 형태를 거치며 순환함"],["존재 범위","개별적인 유기체에 국한됨","생물과 무생물을 넘나듦"]]},"ttsText":"우리 몸을 구성하는 원자들은 우주 탄생만큼이나 오래된 고대의 물질이다. 호흡과 배설 등을 통해 원자는 끊임없이 우리 몸을 드나들며, 우리는 이를 잠시 빌려 쓰는 것에 불과하다. 모든 인간과 생명체는 동일한 원자 저장고를 공유하며 서로의 원자를 순환시키고 재활용한다. 우리는 몸속 원자의 영구한 소유주가 아니라, 잠시 거쳐 가는 임시 관리인이며 이 순환은 미래에도 계속된다.","__passage":"EBS올림포스(연합기출)고1 2026년 04강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 21번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 우리 몸을 구성하는 원자들은 우주 탄생만큼이나 오래된 고대의 물질입니다. 호흡과 배설 등을 통해 원자는 끊임없이 우리 몸을 드나들며, 우리는 이를 잠시 빌려 쓰는 것에 불과합니다. 모든 인간과 생명체는 동일한 원자 저장고를 공유하며 서로의 원자를 순환시키고 재활용합니다. 우리는 몸속 원자의 영구한 소유주가 아니라, 잠시 거쳐 가는 임시 관리인이며 이 순환은 미래에도 계속됩니다. 마지막으로 이 글을 한 문장으로 요약하면 이렇습니다. 원자는 우주의 기원부터 무수한 형태를 거쳐 재순환되어 왔기 때문에 인간은 단순히 이러한 원자들의 일시적인 관리자 역할을 할 뿐입니다. 오늘도 정말 수고 많았습니다!"}]}</script><script>var D=JSON.parse(document.getElementById("enpLecData").textContent);var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t
