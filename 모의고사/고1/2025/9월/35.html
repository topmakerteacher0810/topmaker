1V/RvoOz/AJ+nsev9etFN3gcZTP8AvDOeeBj/AD7cUbgRgFCT6uB0GSOh4Pr14PFLa9/8vR+ny27aA5Lzs/LR6X/Jv8R2QDz/ADA/n+f4Y9qTeOmRjPr+vI78Z6d/7tMZlYjOzjuGByefb65JODkYPWjdGM8q2Bwd4yfvcYyQPmx3xxgnrk0tt176fd5eT66lev5+nl6/gO3jA9CCQM9+QCQOMDrjqe1M34Ix2yO+DxxwP887T0zSEr6pnrgso59OjdOnoTg8HNN44wyHHX5hnp24AwO5/QYo7+n6p/P5/ohJebd0ur7fg/xDHt/ntR2x/n/69HH95fb5l/xo47FeP9pf8aPXy/q/p/WgW/p6+QAenb+Q9P8APTNBOAT169/8/wCelGQe4/Mf5z7dTRx/eX/vpf8AGjrqm/Xd9/x0GH+RR2/z/n0+v4Uceq9M4yP8evt1PYUceq9/4lPX6n/PGMUhW383f8vz/rXUX6//AF//ANXT+lJSjB7qeD0YdsnHXkjvjn9KTj1H0yPy69enHWgNP17f15/8EMj6fj1Pb0oPUgHOO/tn8eDSHkkcEHoAck55/TjHJ9TSbG+Y7QdwbpzwAcA8YHckH35O5RV2jy+fXVPtqtraN6Xd3e+yB2adr3s7LbrG2r108k++rP/Z\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">From Myths to Reality: The Historical Evolution of Artificial Intelligence<small>신화에서 현실로: 인공지능의 역사적 진화<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">오래전부터 인류는 인간처럼 생각하고 판단하는 존재를 꿈꿔왔는데, 이러한 열망이 학문적으로 구체화된 것이 바로 인공지능(Artificial Intelligence)입니다. 1950년대 앨런 튜링이 제안한 튜링 테스트(Turing Test)는 기계가 인간과 구별할 수 없을 만큼 지적인 대화를 할 수 있는지를 평가하여 기계의 자율성(Autonomy)을 판별하는 중요한 기준이 되었어요. 과거에는 스스로 움직이는 인형인 오토마타(Automata) 연구에 그쳤으나, 현대 AI는 인간의 고유 영역이라 여겨졌던 추론(Reasoning)과 학습(Learning) 능력을 기계에 프로그래밍하여 지능적인 판단을 내리게 하는 데 집중합니다. 마치 소설 속 프랑켄슈타인(Frankenstein) 같은 상상이 실제 기술로 구현되는 과정을 살펴보면, 인간이 어떻게 기계에게 ‘생각하는 힘’을 부여해 왔는지 그 흥미로운 역사적 맥락을 쉽게 이해할 수 있습니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01고대의 신화와 꿈<\/div><ul><li>인간은 아주 오래전부터 지능을 가진 기계와 인간 같은 결정을 내리는 존재를 꿈꿔왔다.<\/li><li>고대 그리스부터 전해 내려오는 로봇과 자동 인형에 관한 신화<\/li><li>판도라(Pandora) 신화와 같은 인공적 존재에 대한 상상력<\/li><li>핵심 키워드: 신화(myths), 자동 인형(automatons)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02문학 속의 인공적 피조물<\/div><ul><li>역사적으로 문학 작품들은 인간을 닮은 피조물과 생각하는 기계를 만드는 상상을 구체화했다.<\/li><li>메리 셸리의 &#39;프랑켄슈타인(Frankenstein)&#39;과 같은 고전 문학의 시도<\/li><li>인간을 닮은 생명체를 창조하려는 지속적인 열망<\/li><li>핵심 키워드: 문학(literature), 인간 같은 피조물(human-like creatures)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기계 지능에 대한 과학적 질문<\/div><ul><li>1950년 앨런 튜링은 기계가 인간처럼 사고할 수 있는지 묻고 이를 측정할 방법을 고안했다.<\/li><li>기계가 자율적으로 생각할 수 있는지 측정하는 튜링 테스트(Turing test) 개발<\/li><li>기계의 지능(intelligence)을 과학적으로 판별하는 기준 마련<\/li><li>핵심 키워드: 앨런 튜링(Alan Turing), 자율적 사고(think autonomously)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04인공지능 용어의 정립과 정의<\/div><ul><li>존 매카시가 &#39;인공지능&#39;이라는 용어를 제안하며 현대적인 학문 분야로 정착되었다.<\/li><li>기존의 &#39;자동 장치 연구&#39; 대신 인공지능(artificial intelligence)이라는 명칭 사용<\/li><li>인간처럼 생각하도록 프로그래밍된 지능형 기계(intelligent machines) 연구의 시작<\/li><li>추론(reasoning)과 학습(learning) 능력을 갖춘 기계의 제작 및 실습<\/li><li>핵심 키워드: 존 매카시(John McCarthy), 프로그래밍(programmed)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intelligent<\/td><td class=\"m\">똑똑한, 지능이 있는<\/td><\/tr><tr><td class=\"w\">myth<\/td><td class=\"m\">근거 없는 믿음, 신화<\/td><\/tr><tr><td class=\"w\">artificial<\/td><td class=\"m\">인공의, 인위적인<\/td><\/tr><tr><td class=\"w\">being<\/td><td class=\"m\">존재, 생명체<\/td><\/tr><tr><td class=\"w\">ancient<\/td><td class=\"m\">고대의<\/td><\/tr><tr><td class=\"w\">release<\/td><td class=\"m\">내놓다, 발표하다<\/td><\/tr><tr><td class=\"w\">likewise<\/td><td class=\"m\">마찬가지로<\/td><\/tr><tr><td class=\"w\">literature<\/td><td class=\"m\">문학<\/td><\/tr><tr><td class=\"w\">throughout<\/td><td class=\"m\">~ 내내, ~ 도처에<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">creature<\/td><td class=\"m\">생물, 동물<\/td><\/tr><tr><td class=\"w\">develop<\/td><td class=\"m\">발전시키다, 개발하다<\/td><\/tr><tr><td class=\"w\">measure<\/td><td class=\"m\">측정하다, 재다<\/td><\/tr><tr><td class=\"w\">intelligence<\/td><td class=\"m\">지능<\/td><\/tr><tr><td class=\"w\">autonomous<\/td><td class=\"m\">자율적인<\/td><\/tr><tr><td class=\"w\">artificial intelligence<\/td><td class=\"m\">인공지능<\/td><\/tr><tr><td class=\"w\">coin<\/td><td class=\"m\">동전<\/td><\/tr><tr><td class=\"w\">replace<\/td><td class=\"m\">대신하다, 교체하다<\/td><\/tr><tr><td class=\"w\">previously<\/td><td class=\"m\">이전에<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Humans<\/b><\/span><span class=\"ko\">인간은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for centuries<\/b><\/span><span class=\"ko\">수 세기 동안<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>have dreamed of machines<\/b><\/span><span class=\"ko\">기계를 꿈꿔왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that could become intelligent and make human-like decisions<\/span>.<\/b><\/span><span class=\"ko\">지능적이게 될 수 있고 인간과 같은 결정을 내릴 수 있는<\/span><\/div><\/div><div class=\"lec-sent-ko\">인간은 수 세기 동안 지능적이게 될 수 있고 인간과 같은 결정을 내릴 수 있는 기계를 꿈꿔왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 인공지능이라는 개념이 현대의 갑작스러운 발명이 아니라 아주 오래전부터 이어져 온 인류의 근원적인 열망임을 밝히며 글을 시작합니다. make human-like decisions는 기계가 단순히 계산만 하는 것이 아니라 인간의 판단 영역까지 넘보기를 바랐던 기대를 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that could become intelligent and make human-like decisions (관계대명사): 선행사인 machines를 수식하는 주격 관계대명사절로, 절 내부에서 주어 역할을 수행하며 뒤에 주어가 없는 불완전한 문장이 이어진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intelligent<\/td><td class=\"m\">똑똑한, 지능이 있는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">There have been myths<\/span><\/b><\/span><span class=\"ko\">신화가 존재해 왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>about robots, automatons, and artificial beings<\/b><\/span><span class=\"ko\">로봇, 자동 장치, 그리고 인공 생명체에 대한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>since ancient Greece<\/b><\/span><span class=\"ko\">고대 그리스 이래로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>(e.g., the myth of Pandora, <span class=\"grammar-hl\">who released ills upon the world<\/span>).<\/b><\/span><span class=\"ko\">(예를 들면, 세상에 불행을 퍼뜨린 판도라의 신화).<\/span><\/div><\/div><div class=\"lec-sent-ko\">고대 그리스 이래로 로봇, 자동 장치, 인공 생명체에 대한 신화가 존재해 왔다. (예를 들면, 세상에 불행을 퍼뜨린 Pandora의 신화).<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 &#39;수 세기 동안의 꿈&#39;에 대한 구체적인 역사적 근거를 제시합니다. the myth of Pandora를 예로 든 것은 인간의 손으로 만들어진 존재가 자아를 가지고 행동한다는 설정이 고대 신화에서부터 이미 뿌리 깊게 존재했음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">There have been myths (도치): 유도부사 There가 문장 앞에 위치하여 주어(myths)와 동사(have been)의 순서가 바뀐 도치 구조이다.<\/div><div class=\"lec-gr-item\">who released ills upon the world (관계대명사): 선행사인 Pandora를 부연 설명하는 주격 관계대명사의 계속적 용법으로, 관계절 내에서 주어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">myth<\/td><td class=\"m\">근거 없는 믿음, 신화<\/td><\/tr><tr><td class=\"w\">artificial<\/td><td class=\"m\">인공의, 인위적인<\/td><\/tr><tr><td class=\"w\">being<\/td><td class=\"m\">존재, 생명체<\/td><\/tr><tr><td class=\"w\">ancient<\/td><td class=\"m\">고대의<\/td><\/tr><tr><td class=\"w\">release<\/td><td class=\"m\">내놓다, 발표하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Likewise,<\/b><\/span><span class=\"ko\">마찬가지로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>literature throughout history<\/b><\/span><span class=\"ko\">역사를 통틀어 문학은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>has dreamed of <span class=\"grammar-hl\">creating<\/span> human-like creatures and <span class=\"grammar-hl\">thinking machines<\/span><\/b><\/span><span class=\"ko\">인간과 같은 생명체와 사고하는 기계를 창조하는 꿈을 꿔왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>(e.g., Mary Shelley's Frankenstein).<\/b><\/span><span class=\"ko\">(예를 들면, 메리 셸리의 프랑켄슈타인).<\/span><\/div><\/div><div class=\"lec-sent-ko\">마찬가지로, 역사를 통틀어 문학은 인간과 같은 생명체와 사고하는 기계를 창조하는 꿈을 꿔왔다. (예를 들면, Mary Shelley의 &#39;프랑켄슈타인&#39;).<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> Likewise를 사용해 신화(과거)에서 문학(비교적 근대)으로 시대를 확장하며 인공 지능형 존재에 대한 인간의 관심이 지속되었음을 보여줍니다. creating human-like creatures는 생물학적 혹은 기계적인 수단을 동원해 인간의 지적 능력을 복제하려는 예술적 상상력을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">creating (동명사): 전치사 of의 목적어로 쓰여 &#39;창조하는 것&#39;이라는 행위의 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">thinking machines (현재분사(형용사)): thinking이 명사 machines가 수행하는 동작을 나타내며 수식한다(= &#39;생각하는 기계&#39;).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">likewise<\/td><td class=\"m\">마찬가지로<\/td><\/tr><tr><td class=\"w\">literature<\/td><td class=\"m\">문학<\/td><\/tr><tr><td class=\"w\">throughout<\/td><td class=\"m\">~ 내내, ~ 도처에<\/td><\/tr><tr><td class=\"w\">creature<\/td><td class=\"m\">생물, 동물<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In 1950,<\/b><\/span><span class=\"ko\">1950년에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>British mathematician Alan Turing asked<\/b><\/span><span class=\"ko\">영국 수학자 앨런 튜링은 물었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">whether machines could think and reason like humans<\/span><\/b><\/span><span class=\"ko\">기계가 인간처럼 사고하고 추론할 수 있는지를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and then developed the Turing test<\/b><\/span><span class=\"ko\">그러고 나서 튜링 테스트를 개발했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to measure<\/span> a machine's intelligence<\/b><\/span><span class=\"ko\">기계의 지능을 측정하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">whether the machines can think autonomously<\/span>.<\/b><\/span><span class=\"ko\">그리고 기계가 자율적으로 사고할 수 있는지를.<\/span><\/div><\/div><div class=\"lec-sent-ko\">1950년, 영국의 수학자 Alan Turing은 기계가 인간처럼 사고하고 추론할 수 있는지 물었고, 그 다음에 기계의 지능과 기계가 자율적으로 사고할 수 있는지를 측정하기 위해 튜링 테스트를 개발했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 언급된 &#39;신화와 문학 속의 상상&#39;이 마침내 과학의 영역으로 들어왔음을 알리는 전환점입니다. measure a machine&#39;s intelligence는 막연한 꿈이었던 인공지능을 객관적이고 과학적으로 검증 가능한 수치나 기준으로 바꾸어 놓았다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">whether machines could think and reason like humans (간접의문문): 동사 asked의 목적어 역할을 하는 명사절로 &#39;접속사(whether) + 주어(machines) + 동사(could think...)&#39;의 어순을 취한다.<\/div><div class=\"lec-gr-item\">to measure (to부정사(부사적): 목적): &#39;~을 측정하기 위해서&#39;라는 의미로 쓰였으며, in order to measure로 바꾸어 써도 의미가 통한다.<\/div><div class=\"lec-gr-item\">whether the machines can think autonomously (간접의문문): 타동사 measure의 목적어 역할을 하는 명사절로 &#39;접속사(whether) + 주어 + 동사&#39;의 어순을 가진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">develop<\/td><td class=\"m\">발전시키다, 개발하다<\/td><\/tr><tr><td class=\"w\">measure<\/td><td class=\"m\">측정하다, 재다<\/td><\/tr><tr><td class=\"w\">intelligence<\/td><td class=\"m\">지능<\/td><\/tr><tr><td class=\"w\">autonomous<\/td><td class=\"m\">자율적인<\/td><\/tr><tr><td class=\"w\">artificial intelligence<\/td><td class=\"m\">인공지능<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>A few years later,<\/b><\/span><span class=\"ko\">몇 년 후,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>MIT professor John McCarthy coined \"artificial intelligence,\"<\/b><\/span><span class=\"ko\">MIT 교수 존 매카시는 &#39;인공지능&#39;이라는 표현을 만들어냈다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">replacing the previously used expression \"automata studies<\/span>.\"<\/b><\/span><span class=\"ko\">이전에 사용된 &#39;자동 장치 연구&#39;라는 표현을 대체하면서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">몇 년 후, MIT 교수 John McCarthy는 이전에 사용된 &#39;자동 장치 연구&#39;라는 표현을 대체해 &#39;인공지능&#39;이라는 표현을 만들어냈다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 튜링이 과학적 기반을 닦은 후, 이 분야가 독자적인 이름과 정체성을 갖게 된 과정을 설명합니다. replacing the previously used expression은 기계적인 자동화 수준에 머물렀던 과거의 관점을 벗어나, &#39;지능&#39; 그 자체에 집중하는 새로운 학문적 패러다임이 시작되었음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">replacing the previously used expression &quot;automata studies&quot; (분사구문): and + he (John McCarthy) + replaced... 형태의 절로 바꿀 수 있으며, 주절의 동작에 이어지는 결과나 부연 설명을 나타낸다.<\/div><div class=\"lec-gr-item\">previously used expression (과거분사(형용사)): used가 뒤의 명사 expression을 수식한다(= &#39;이전에 사용된 표현&#39;).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">artificial<\/td><td class=\"m\">인공의, 인위적인<\/td><\/tr><tr><td class=\"w\">intelligence<\/td><td class=\"m\">지능<\/td><\/tr><tr><td class=\"w\">artificial intelligence<\/td><td class=\"m\">인공지능<\/td><\/tr><tr><td class=\"w\">coin<\/td><td class=\"m\">동전<\/td><\/tr><tr><td class=\"w\">replace<\/td><td class=\"m\">대신하다, 교체하다<\/td><\/tr><tr><td class=\"w\">previously<\/td><td class=\"m\">이전에<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Since then,<\/b><\/span><span class=\"ko\">그 이후로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>artificial intelligence has become the study and practice<\/b><\/span><span class=\"ko\">인공지능은 연구와 실행이 되었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of \"<span class=\"grammar-hl\">making<\/span> intelligent machines\"<\/b><\/span><span class=\"ko\">&#39;지능적인 기계 만들기&#39;에 대한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that are programmed to think like humans<\/span><\/b><\/span><span class=\"ko\">인간처럼 사고하도록 프로그램화된<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>endowed by their creators with <span class=\"grammar-hl\">reasoning and learning<\/span>.<\/b><\/span><span class=\"ko\">그들의 창조자들에 의해 추론과 학습 능력을 부여받은.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 이후로, 인공지능은 인간처럼 사고하도록 프로그램화된 즉, 그들의 창조자들에 의해 추론과 학습 능력을 부여받은 &#39;지능적인 기계 만들기&#39;에 대한 연구와 실행이 되었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 용어 정립 이후 현재까지 이어지는 인공지능의 정의와 성격을 규정하며 글을 마무리합니다. endowed by their creators는 기계의 지능이 스스로 생겨난 것이 아니라, 인간 설계자가 추론과 학습이라는 핵심 기능을 알고리즘을 통해 이식했다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">making (동명사): 전치사 of의 목적어로 쓰여 &#39;지능적인 기계를 만드는 것&#39;이라는 명사적 개념의 활동을 나타낸다.<\/div><div class=\"lec-gr-item\">that are programmed to think like humans (관계대명사): 선행사 intelligent machines를 수식하는 주격 관계대명사로, 뒤에 주어가 없는 불완전한 절이 이어진다.<\/div><div class=\"lec-gr-item\">are programmed to think (수동태): be동사(are)+p.p.(programmed) 구조. program은 타동사로 program+O+toV(5형식) 구조인데 목적어가 주어로 올라가 수동구조 are programmed가 되고, 목적격보어인 to부정사(to think)는 구조가 남는다. program은 타동사인데 뒤에 목적어가 없어서 수동구조 are programmed 형태로 쓴다. 기본구조: program + O + to V<\/div><div class=\"lec-gr-item\">to think (목적격보어(to부정사)): 5형식 수동태(are programmed) 뒤에 남은 목적격보어이다. 명사 수식이 아니므로 형용사적 용법이라 하지 않는다.<\/div><div class=\"lec-gr-item\">humans endowed by their creators (과거분사(형용사)): endowed가 앞의 명사 humans를 수식한다(= &#39;창조주에 의해 부여받은 인간&#39;).<\/div><div class=\"lec-gr-item\">reasoning and learning (동명사): 전치사 with의 목적어로 쓰여 &#39;추론&#39;과 &#39;학습&#39;이라는 명사적 개념을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intelligent<\/td><td class=\"m\">똑똑한, 지능이 있는<\/td><\/tr><tr><td class=\"w\">artificial<\/td><td class=\"m\">인공의, 인위적인<\/td><\/tr><tr><td class=\"w\">intelligence<\/td><td class=\"m\">지능<\/td><\/tr><tr><td class=\"w\">artificial intelligence<\/td><td class=\"m\">인공지능<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>인간은 아주 오래전부터 인간처럼 생각하고 결정하는 기계를 꿈꿔왔다.<\/li><li>이러한 열망은 고대 그리스 신화나 근대 소설 프랑켄슈타인 같은 작품에 투영되었다.<\/li><li>1950년 앨런 튜링은 이를 과학적 연구 대상으로 삼아 지능 측정 방법을 고안했다.<\/li><li>존 매카시는 &#39;인공지능&#39;이라는 용어를 만들어 이 분야의 학문적 이름을 확립했다.<\/li><li>오늘날 인공지능은 인간의 학습과 추론 능력을 기계에 구현하는 실질적인 연구 분야가 되었다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Humans have long aspired to create human-like machines, although artificial intelligence emerged as a formal field through the establishment of logical tests and definitions.<\/div>\n              <div class=\"lec-final-sum-ko\">인간은 역사적으로 인간과 유사한 기계를 만들기를 열망해왔지만, 인공지능은 논리적 테스트와 정의의 확립을 통해 공식적인 분야로 등장했다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./35_audio/1.mp3","hl":null}],[{"audio":"./35_audio/2.mp3","hl":null}],[{"audio":"./35_audio/3.mp3","hl":null},{"audio":"./35_audio/4.mp3","hl":"stage-0"},{"audio":"./35_audio/5.mp3","hl":"stage-1"},{"audio":"./35_audio/6.mp3","hl":"stage-2"},{"audio":"./35_audio/7.mp3","hl":"stage-3"}],[{"audio":"./35_audio/8.mp3","hl":null}],[{"audio":"./35_audio/9.mp3","hl":"main"},{"audio":"./35_audio/10.mp3","hl":"meaning"},{"audio":"./35_audio/11.mp3","hl":"grammar"}],[{"audio":"./35_audio/12.mp3","hl":"main"},{"audio":"./35_audio/13.mp3","hl":"meaning"},{"audio":"./35_audio/14.mp3","hl":"grammar"}],[{"audio":"./35_audio/15.mp3","hl":"main"},{"audio":"./35_audio/16.mp3","hl":"meaning"},{"audio":"./35_audio/17.mp3","hl":"grammar"}],[{"audio":"./35_audio/18.mp3","hl":"main"},{"audio":"./35_audio/19.mp3","hl":"meaning"},{"audio":"./35_audio/20.mp3","hl":"grammar"}],[{"audio":"./35_audio/21.mp3","hl":"main"},{"audio":"./35_audio/22.mp3","hl":"meaning"},{"audio":"./35_audio/23.mp3","hl":"grammar"}],[{"audio":"./35_audio/24.mp3","hl":"main"},{"audio":"./35_audio/25.mp3","hl":"meaning"},{"audio":"./35_audio/26.mp3","hl":"grammar"}],[{"audio":"./35_audio/27.mp3","hl":null}]],"fileName":"EBS올림포스(연합기출)고1 2026년 15강 Analysis_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"EBS올림포스(연합기출)고1 2026년 15강 Analysis","titleEn":"From Myths to Reality: The Historical Evolution of Artificial Intelligence","titleKo":"신화에서 현실로: 인공지능의 역사적 진화","imageUrl":"__enpImg__","stages":[{"label":"01고대의 신화와 꿈","items":["인간은 아주 오래전부터 지능을 가진 기계와 인간 같은 결정을 내리는 존재를 꿈꿔왔다.","고대 그리스부터 전해 내려오는 로봇과 자동 인형에 관한 신화","판도라(Pandora) 신화와 같은 인공적 존재에 대한 상상력","핵심 키워드: 신화(myths), 자동 인형(automatons)"]},{"label":"02문학 속의 인공적 피조물","items":["역사적으로 문학 작품들은 인간을 닮은 피조물과 생각하는 기계를 만드는 상상을 구체화했다.","메리 셸리의 '프랑켄슈타인(Frankenstein)'과 같은 고전 문학의 시도","인간을 닮은 생명체를 창조하려는 지속적인 열망","핵심 키워드: 문학(literature), 인간 같은 피조물(human-like creatures)"]},{"label":"03기계 지능에 대한 과학적 질문","items":["1950년 앨런 튜링은 기계가 인간처럼 사고할 수 있는지 묻고 이를 측정할 방법을 고안했다.","기계가 자율적으로 생각할 수 있는지 측정하는 튜링 테스트(Turing test) 개발","기계의 지능(intelligence)을 과학적으로 판별하는 기준 마련","핵심 키워드: 앨런 튜링(Alan Turing), 자율적 사고(think autonomously)"]},{"label":"04인공지능 용어의 정립과 정의","items":["존 매카시가 '인공지능'이라는 용어를 제안하며 현대적인 학문 분야로 정착되었다.","기존의 '자동 장치 연구' 대신 인공지능(artificial intelligence)이라는 명칭 사용","인간처럼 생각하도록 프로그래밍된 지능형 기계(intelligent machines) 연구의 시작","추론(reasoning)과 학습(learning) 능력을 갖춘 기계의 제작 및 실습","핵심 키워드: 존 매카시(John McCarthy), 프로그래밍(programmed)"]}],"bkg":"오래전부터 인류는 인간처럼 생각하고 판단하는 존재를 꿈꿔왔는데, 이러한 열망이 학문적으로 구체화된 것이 바로 인공지능(Artificial Intelligence)입니다. 1950년대 앨런 튜링이 제안한 튜링 테스트(Turing Test)는 기계가 인간과 구별할 수 없을 만큼 지적인 대화를 할 수 있는지를 평가하여 기계의 자율성(Autonomy)을 판별하는 중요한 기준이 되었어요. 과거에는 스스로 움직이는 인형인 오토마타(Automata) 연구에 그쳤으나, 현대 AI는 인간의 고유 영역이라 여겨졌던 추론(Reasoning)과 학습(Learning) 능력을 기계에 프로그래밍하여 지능적인 판단을 내리게 하는 데 집중합니다. 마치 소설 속 프랑켄슈타인(Frankenstein) 같은 상상이 실제 기술로 구현되는 과정을 살펴보면, 인간이 어떻게 기계에게 ‘생각하는 힘’을 부여해 왔는지 그 흥미로운 역사적 맥락을 쉽게 이해할 수 있습니다.","ttsText":"오래전부터 인류는 인간처럼 생각하고 판단하는 존재를 꿈꿔왔는데, 이러한 열망이 학문적으로 구체화된 것이 바로 인공지능(Artificial Intelligence)입니다. 1950년대 앨런 튜링이 제안한 튜링 테스트(Turing Test)는 기계가 인간과 구별할 수 없을 만큼 지적인 대화를 할 수 있는지를 평가하여 기계의 자율성(Autonomy)을 판별하는 중요한 기준이 되었어요. 과거에는 스스로 움직이는 인형인 오토마타(Automata) 연구에 그쳤으나, 현대 AI는 인간의 고유 영역이라 여겨졌던 추론(Reasoning)과 학습(Learning) 능력을 기계에 프로그래밍하여 지능적인 판단을 내리게 하는 데 집중합니다. 마치 소설 속 프랑켄슈타인(Frankenstein) 같은 상상이 실제 기술로 구현되는 과정을 살펴보면, 인간이 어떻게 기계에게 ‘생각하는 힘’을 부여해 왔는지 그 흥미로운 역사적 맥락을 쉽게 이해할 수 있습니다.","__passage":"EBS올림포스(연합기출)고1 2026년 15강 Analysis","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 35번","__script":"자, 오늘 우리가 함께 공부할 지문은 'EBS올림포스(연합기출)고1 2026년 15강 Analysis' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"EBS올림포스(연합기출)고1 2026년 15강 Analysis","titleEn":"From Myths to Reality: The Historical Evolution of Artificial Intelligence","titleKo":"신화에서 현실로: 인공지능의 역사적 진화","imageUrl":"__enpImg__","stages":[{"label":"01고대의 15강 Analysis","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 35번"},{"kind":"sentence","idx":6,"total":6,"english":"Since then, artificial intelligence has become the study and practice of \"making intelligent machines\" that are programmed to think like humans endowed by their creators with reasoning and learning.","korean":"그 이후로, 인공지능은 인간처럼 사고하도록 프로그램화된 즉, 그들의 창조자들에 의해 추론과 학습 능력을 부여받은 '지능적인 기계 만들기'에 대한 연구와 실행이 되었다.","chunks":[{"english":"Since then,","englishHtml":"<b>Since then,<\/b>","korean":"그 이후로,"},{"english":"artificial intelligence has become the study and practice","englishHtml":"<b>artificial intelligence has become the study and practice<\/b>","korean":"인공지능은 연구와 실행이 되었다"},{"english":"of \"making intelligent machines\"","englishHtml":"<b>of \"<span class=\"grammar-hl\">making<\/span> intelligent machines\"<\/b>","korean":"'지능적인 기계 만들기'에 대한"},{"english":"that are programmed to think like humans","englishHtml":"<b><span class=\"grammar-hl\">that are programmed to think like humans<\/span><\/b>","korean":"인간처럼 사고하도록 프로그램화된"},{"english":"endowed by their creators with reasoning and learning.","englishHtml":"<b>endowed by their creators with <span class=\"grammar-hl\">reasoning and learning<\/span>.<\/b>","korean":"그들의 창조자들에 의해 추론과 학습 능력을 부여받은."}],"meaning":"용어 정립 이후 현재까지 이어지는 인공지능의 정의와 성격을 규정하며 글을 마무리합니다. endowed by their creators는 기계의 지능이 스스로 생겨난 것이 아니라, 인간 설계자가 추론과 학습이라는 핵심 기능을 알고리즘을 통해 이식했다는 의미입니다.","grammar":"making (동명사): 전치사 of의 목적어로 쓰여 '지능적인 기계를 만드는 것'이라는 명사적 개념의 활동을 나타낸다. that are programmed to think like humans (관계대명사): 선행사 intelligent machines를 수식하는 주격 관계대명사로, 뒤에 주어가 없는 불완전한 절이 이어진다. are programmed to think (수동태): be동사(are)+p.p.(programmed) 구조. program은 타동사로 program+O+toV(5형식) 구조인데 목적어가 주어로 올라가 수동구조 are programmed가 되고, 목적격보어인 to부정사(to think)는 구조가 남는다. program은 타동사인데 뒤에 목적어가 없어서 수동구조 are programmed 형태로 쓴다. 기본구조: program + O + to V to think (목적격보어(to부정사)): 5형식 수동태(are programmed) 뒤에 남은 목적격보어이다. 명사 수식이 아니므로 형용사적 용법이라 하지 않는다. humans endowed by their cre  '학습'이라는 명사적 개념을 나타낸다.","__passage":"EBS올림포스(연합기출)고1 2026년 15강 Analysis","passageName":"EBS올림포스(연합기출)고1 2026년 15강 Analysis","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 35번"},{"kind":"summary","passageName":"EBS올림포스(연합기출)고1 2026년 15강 Analysis","imageUrl":"__enpImg__","sumEn":"Humans have long aspired to create human-like machines, although artificial intelligence emerged as a formal field through the establishment of logical tests and definitions.","sumKo":"인간은 역사적으로 인간과 유사한 기계를 만들기를 열망해왔지만, 인공지능은 논리적 테스트와 정의의 확립을 통해 공식적인 분야로 등장했다.","bullets":[],"overall":["인간은 아주 오래전부터 인간처럼 생각하고 결정하는 기계를 꿈꿔왔다.","이러한 열망은 고대 그리스 신화나 근대 소설 프랑켄슈타인 같은 작품에 투영되었다.","1950년 앨런 튜링은 이를 과학적 연구 대상으로 삼아 지능 측정 방법을 고안했다.","존 매카시는 '인공지능'이라는 용어를 만들어 이 분야의 학문적 이름을 확립했다.","오늘날 인공지능은 인간의 학습과 추론 능력을 기계에 구현하는 실질적인 연구 분야가 되었다."],"compare":{"headers":["구분","상상과 신화의 시대","과학과 학문의 시대"],"rows":[["시기","고대 그리스 ~ 19세기 문학","1950년 이후 ~ 현재"],["매체","신화(판도라), 소설(프랑켄슈타인)","수학적 모델, 컴퓨터 과학"],["성격","막연한 꿈과 예술적 상상","지능 측정 및 프로그램 구현"],["주요 인물","작가 및 신화 속 창조주","앨런 튜링, 존 매카시"],["핵심 개념","인공적 존재의 등장을 꿈꿈","지능형 기계의 설계 및 실무"]]},"ttsText":"인간은 아주 오래전부터 인간처럼 생각하고 결정하는 기계를 꿈꿔왔다. 이러한 열망은 고대 그리스 신화나 근대 소설 프랑켄슈타인 같은 작품에 투영되었다. 1950년 앨런 튜링은 이를 과학적 연구 대상으로 삼아 지능 측정 방법을 고안했다. 존 매카시는 '인공지능'이라는 용어를 만들어 이 분야의 학문적 이름을 확립했다. 오늘날 인공지능은 인간의 학습과 추론 능력을 기계에 구현하는 실질적인 연구 분야가 되었다.","__passage":"EBS올림포스(연합기출)고1 2026년 15강 Analysis","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 35번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 인간은 아주 오래전부터 인간처럼 생각하고 결정하는 기계를 꿈꿔왔습니다. 이러한 열망은 고대 그리스 신화나 근대 소설 프랑켄슈타인 같은 작품에 투영되었습니다. 1950년 앨런 튜링은 이를 과학적 연구 대상으로 삼아 지능 측정 방법을 고안했습니다. 존 매카시는 '인공지능'이라는 용어를 만들어 이 분야의 학문적 이름을 확립했습니다. 오늘날 인공지능은 인간의 학습과 추론 능력을 기계에 구현하는 실질적인 연구 분야가 되었습니다. 마지막으로 이 글을 한 문장으로 요약하면 이렇습니다. 인간은 역사적으로 인간과 유사한 기계를 만들기를 열망해왔지만, 인공지능은 논리적 테스트와 정의의 확립을 통해 공식적인 분야로 등장했습니다. 오늘도 정말 수고 많았습니다!"}]}</script><script>var D=JSON.parse(document.getElementById("enpLecData").textContent);var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s
