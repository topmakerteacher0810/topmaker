니다. 마치 비바람이 몰아칠 때는 좁은 처마 밑에서도 기꺼이 서로 어깨를 내어주지만, 날이 개고 각자의 크고 안전한 집이 생기면 오히려 대문을 굳게 걸어 잠그게 되는 풍요의 역설(Paradox of Affluence)이 우리 사회에 존재한다는 점을 이해하면 이 글을 더 깊이 있게 읽으실 수 있습니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01인류의 협력적 성향<\/div><ul><li>인류는 자원이 부족하고 위험이 큰 시기에 생존을 위해 협력하도록 진화했다.<\/li><li>나눔과 협력(sharing and cooperation)의 자연스러운 성향<\/li><li>제한된 자원(limited resources) 환경에서 형성된 본능<\/li><li>핵심 키워드: 본능적 경향(natural tendency)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02부족함 속의 관대함<\/div><ul><li>자원이 적을 때 인간은 오히려 타인에게 더 개방적이며 나눔에 적극적인 모습을 보인다.<\/li><li>유목 부족(nomadic tribes)의 사례: 가진 것이 적어도 기꺼이 나눔<\/li><li>나눔의 동기: 생존(survival)을 위한 상호 호혜적 이익 추구<\/li><li>언젠가 자신도 도움을 필요로 하는 여행자(travelers)가 될 수 있음을 인지함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03풍요로움의 역설<\/div><ul><li>역설적으로 자원이 풍족해질수록 사람들은 타인을 경계하고 나눔을 실천하지 않으려 한다.<\/li><li>더 높은 울타리(fences)와 정교한 보안(sophisticated security) 시스템 구축<\/li><li>타인을 멀리하고 소유물을 지키려는 욕구의 강화<\/li><li>자원이 많을수록 나눔에 대한 의지는 오히려 감소함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04사회적 단절과 현실 왜곡<\/div><ul><li>더 많은 것을 소유하려는 욕망은 타인과의 상호작용을 차단하고 현실에 대한 무관심을 초래한다.<\/li><li>평범한 사람들(common folk)과의 물리적 상호작용 감소<\/li><li>사회적 단절(disconnection) 현상 발생<\/li><li>현실에 대한 맹목(blindness to reality)으로 이어짐<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">species<\/td><td class=\"m\">종(種)<\/td><\/tr><tr><td class=\"w\">resource<\/td><td class=\"m\">자원<\/td><\/tr><tr><td class=\"w\">limit<\/td><td class=\"m\">제한하다<\/td><\/tr><tr><td class=\"w\">tendency<\/td><td class=\"m\">경향, 성향<\/td><\/tr><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><tr><td class=\"w\">cooperate<\/td><td class=\"m\">협력하다<\/td><\/tr><tr><td class=\"w\">complicated<\/td><td class=\"m\">복잡한<\/td><\/tr><tr><td class=\"w\">tend<\/td><td class=\"m\">~하는 경향이 있다<\/td><\/tr><tr><td class=\"w\">nomadic<\/td><td class=\"m\">유목의<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tribe<\/td><td class=\"m\">부족<\/td><\/tr><tr><td class=\"w\">hospitality<\/td><td class=\"m\">환대<\/td><\/tr><tr><td class=\"w\">survival<\/td><td class=\"m\">생존<\/td><\/tr><tr><td class=\"w\">depend<\/td><td class=\"m\">(depend on) ~에 달려 있다<\/td><\/tr><tr><td class=\"w\">shelter<\/td><td class=\"m\">은신처, 몸을 피할 곳<\/td><\/tr><tr><td class=\"w\">sophisticated<\/td><td class=\"m\">정교한, 세련된<\/td><\/tr><tr><td class=\"w\">security<\/td><td class=\"m\">보안, 안전<\/td><\/tr><tr><td class=\"w\">desire<\/td><td class=\"m\">욕구, 갈망<\/td><\/tr><tr><td class=\"w\">combine<\/td><td class=\"m\">결합하다, 합치다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>For a species<\/b><\/span><span class=\"ko\">한 종에게 있어<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">born<\/span> in a time<\/b><\/span><span class=\"ko\">시기에 태어난<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">when<\/span> resources were limited and dangers were great,<\/b><\/span><span class=\"ko\">자원이 제한적이고 위험이 컸던,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>our natural tendency<\/b><\/span><span class=\"ko\">우리의 타고난 성향은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to share and cooperate<\/span><\/b><\/span><span class=\"ko\">나누고 협력하려는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">is complicated<\/span><\/b><\/span><span class=\"ko\">복잡해진다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">when<\/span> resources are plenty and outside dangers are few.<\/b><\/span><span class=\"ko\">자원이 풍부하고 외부의 위험이 거의 없을 때<\/span><\/div><\/div><div class=\"lec-sent-ko\">자원이 제한적이고 위험이 컸던 시기에 태어난 종에게 있어, 자원이 풍부하고 외부의 위험이 거의 없을 때 나누고 협력하려는 우리의 타고난 성향은 복잡하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> is complicated는 생존을 위해 필수적이었던 협동 본능이 현대의 풍요로운 환경에서는 과거처럼 단순하게 작동하지 않고 모순적인 모습을 보인다는 의미입니다. 인간은 본래 생존을 위해 서로 돕도록 설계되었지만, 환경이 변하면서 그 본능이 제대로 발휘되지 못하는 상황을 도입부에서 제시하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">born (과거분사(형용사)): born이 species를 수식(= &quot;태어난 종&quot;). N + p.p. ≈ &quot;N that was p.p.&quot; 구조의 축약 관계절로 볼 수 있다.<\/div><div class=\"lec-gr-item\">when (관계부사): 선행사 a time을 수식하며, 뒤에 주어(resources, dangers)와 동사(were)를 갖춘 완전한 절이 이어진다.<\/div><div class=\"lec-gr-item\">to share and cooperate (to부정사(형용사적)): 명사 tendency를 수식한다. tendency + to V 구조에서 명사의 내용을 한정하며 &quot;~하려는 경향&quot;으로 해석된다.<\/div><div class=\"lec-gr-item\">is complicated (수동태): be동사(is)+p.p.(complicated) 구조. complicate는 타동사인데 뒤에 목적어가 없어서 수동구조 is complicated 형태로 쓴다. 기본구조: V + O.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">species<\/td><td class=\"m\">종(種)<\/td><\/tr><tr><td class=\"w\">resource<\/td><td class=\"m\">자원<\/td><\/tr><tr><td class=\"w\">limit<\/td><td class=\"m\">제한하다<\/td><\/tr><tr><td class=\"w\">tendency<\/td><td class=\"m\">경향, 성향<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><tr><td class=\"w\">cooperate<\/td><td class=\"m\">협력하다<\/td><\/tr><tr><td class=\"w\">complicated<\/td><td class=\"m\">복잡한<\/td><\/tr><tr><td class=\"w\">tend<\/td><td class=\"m\">~하는 경향이 있다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When we have less,<\/b><\/span><span class=\"ko\">우리가 더 적게 가질 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we tend <span class=\"grammar-hl\">to be<\/span> more open<\/b><\/span><span class=\"ko\">우리는 더 개방적이 되는 경향이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to <span class=\"grammar-hl\">sharing<\/span> what we have.<\/b><\/span><span class=\"ko\">우리가 가진 것을 나누는 데<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리가 더 적게 가질 때, 우리가 가진 것을 나누는 데 더 개방적이 되는 경향이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> more open to sharing은 결핍의 상황에서 타인을 돕는 것이 결국 나에게도 이득이 된다는 무의식적 판단이 깔려 있음을 보여줍니다. 앞 문장에서 언급한 &#39;복잡해진 성향&#39; 중 첫 번째 측면인 &#39;부족할 때 오히려 더 잘 나누는 성질&#39;을 구체적으로 설명하기 시작합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to be (to부정사(명사적)): 동사 tend의 목적어 자리에 쓰여 동사의 대상을 나타낸다.<\/div><div class=\"lec-gr-item\">sharing (동명사): 전치사 to의 목적어로 쓰여 &quot;공유하는 것&quot;이라는 행위나 개념을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><tr><td class=\"w\">tend<\/td><td class=\"m\">~하는 경향이 있다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Certain nomadic tribes don't have much,<\/b><\/span><span class=\"ko\">특정 유목 부족은 많은 것을 가지고 있지 않지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>yet they are happy <span class=\"grammar-hl\">to share<\/span><\/b><\/span><span class=\"ko\">그들은 기꺼이 나누려 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because <span class=\"grammar-hl\">it<\/span> is in their interest <span class=\"grammar-hl\">to do so<\/span>.<\/b><\/span><span class=\"ko\">그렇게 하는 것이 그들의 이익에 부합하기 때문에<\/span><\/div><\/div><div class=\"lec-sent-ko\">특정 유목 부족은 많은 것을 가지고 있지 않지만, 그렇게 하는 것이 그들의 이익에 부합하기 때문에 그들은 기꺼이 나누려고 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> in their interest는 공유가 단순한 자선 행위가 아니라, 서로 돕지 않으면 살아남을 수 없는 환경에서 선택한 가장 합리적인 생존 전략이라는 의미입니다. 앞서 말한 &#39;가진 것이 적을 때의 개방성&#39;을 뒷받침하는 실제 사례로 유목 부족을 제시하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to share (to부정사(부사적): 감정의 원인): 감정을 나타내는 형용사 happy 뒤에서 그 감정의 원인을 설명한다.<\/div><div class=\"lec-gr-item\">it (가주어): 문장의 주어 자리에 놓여 형식적인 역할만 수행하며, 실제 주어는 뒤의 to부정사구다.<\/div><div class=\"lec-gr-item\">to do so 진주어(to부정사 명사적): 문장의 실제 주어 역할을 하며, 가주어 it의 위치에 넣어 해석할 수 있다.<\/div><div class=\"lec-gr-item\">do (대동사): 앞의 일반동사 share를 대신하여 반복을 피한다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><tr><td class=\"w\">nomadic<\/td><td class=\"m\">유목의<\/td><\/tr><tr><td class=\"w\">tribe<\/td><td class=\"m\">부족<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If you <span class=\"grammar-hl\">happen upon<\/span> them<\/b><\/span><span class=\"ko\">만약 당신이 그들을 우연히 마주치면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in your travels,<\/b><\/span><span class=\"ko\">당신의 여행 중에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they will open up their homes<\/b><\/span><span class=\"ko\">그들은 자신들의 집을 열 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and give you their food and hospitality.<\/b><\/span><span class=\"ko\">그리고 당신에게 그들의 음식과 환대를 제공할 것이다<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 당신이 여행 중 그들을 우연히 만나면, 그들은 자신의 집을 열고 당신에게 음식과 환대를 제공할 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> happen upon them은 계획되지 않은 낯선 이와의 만남에서도 이들이 즉각적으로 호의를 베푸는 구체적인 장면을 묘사합니다. 이는 유목 부족의 공유 정신이 추상적인 관념이 아니라 실질적인 행동으로 나타남을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">happen upon (관용표현): &quot;~을 우연히 발견하다/마주치다&quot;라는 의미로 쓰이는 구동사(phrasal verb)이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hospitality<\/td><td class=\"m\">환대<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>It's not just because they are nice people;<\/b><\/span><span class=\"ko\">단지 그들이 좋은 사람이기 때문만은 아니다;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it's because their survival depends on <span class=\"grammar-hl\">sharing<\/span>,<\/b><\/span><span class=\"ko\">이는 그들의 생존이 나누는 것에 달려 있기 때문이다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for they know<\/b><\/span><span class=\"ko\">왜냐하면 그들은 알기 때문에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that they may be the travelers<\/b><\/span><span class=\"ko\">그들 자신이 여행자일 수도 있다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in need of food and shelter<\/b><\/span><span class=\"ko\">음식과 숙소가 필요한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>another day.<\/b><\/span><span class=\"ko\">또 다른 날에<\/span><\/div><\/div><div class=\"lec-sent-ko\">이는 그들이 좋은 사람이어서만이 아니다; 이는 그들의 생존이 나누는 것에 달려 있기 때문인데, 왜냐하면 그들은 또 다른 날 그들이 음식과 거처가 필요한 여행자가 될 수 있음을 알기 때문이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> may be the travelers in need는 오늘 내가 베푼 친절이 훗날 내가 위기에 처했을 때 누군가로부터 돌려받을 &#39;생존 보험&#39;과 같다는 사실을 그들이 인지하고 있다는 의미입니다. 유목 부족이 베푸는 호의의 근본적인 원인이 &#39;상호 호혜성&#39;에 기반한 생존 본능임을 논리적으로 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">sharing (동명사): 전치사 on의 목적어로 쓰여 &quot;공유하기&quot;라는 행위나 개념을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><tr><td class=\"w\">survival<\/td><td class=\"m\">생존<\/td><\/tr><tr><td class=\"w\">depend<\/td><td class=\"m\">(depend on) ~에 달려 있다<\/td><\/tr><tr><td class=\"w\">shelter<\/td><td class=\"m\">은신처, 몸을 피할 곳<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Ironically,<\/b><\/span><span class=\"ko\">아이러니하게도,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the more we have,<\/b><\/span><span class=\"ko\">우리가 더 많이 가질수록,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the bigger our fences,<\/b><\/span><span class=\"ko\">우리의 울타리는 더 커지고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the more sophisticated our security<\/b><\/span><span class=\"ko\">우리의 보안은 더 정교해지며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to keep<\/span> people away<\/b><\/span><span class=\"ko\">사람들을 멀리 두기 위한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and the less we want <span class=\"grammar-hl\">to share<\/span>.<\/b><\/span><span class=\"ko\">그리고 우리는 더 적게 나누기를 원한다<\/span><\/div><\/div><div class=\"lec-sent-ko\">아이러니하게도, 우리가 더 많이 가질수록, 우리의 울타리는 더 커지고, 사람들을 멀리 두기 위한 우리의 보안은 더 정교해지며, 우리는 더 적게 나누기를 원하게 된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> the bigger our fences는 물리적인 담장을 높이는 행위를 넘어, 타인과의 연결을 차단하고 자신의 소유권을 방어하려는 폐쇄적인 태도를 비유합니다. 앞선 유목 부족의 사례와는 정반대되는 현대인의 풍요 속 인색함을 대조적으로 강조하며 글의 분위기를 반전시킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">the more we have, the bigger our fences, the more sophisticated our security ... and the less we want (관용표현): 「the + 비교급, the + 비교급」 구조로 &quot;~하면 할수록 더욱 ~하다&quot;라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">to keep (to부정사(부사적): 목적): &quot;in order to keep&quot;으로 바꿔도 뜻이 성립하므로 목적을 나타낸다.<\/div><div class=\"lec-gr-item\">to share (to부정사(명사적)): 동사 want의 목적어 자리에 쓰여 동사의 대상을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><tr><td class=\"w\">sophisticated<\/td><td class=\"m\">정교한, 세련된<\/td><\/tr><tr><td class=\"w\">security<\/td><td class=\"m\">보안, 안전<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Our desire for more,<\/b><\/span><span class=\"ko\">더 많은 것에 대한 우리의 욕망은,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">combined with<\/span> our decreased physical interaction<\/b><\/span><span class=\"ko\">우리의 줄어든 실제적인 상호작용과 결합되어<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with the \"common folk,\"<\/b><\/span><span class=\"ko\">&#39;일반 대중&#39;과의,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>starts <span class=\"grammar-hl\">to create<\/span> a disconnection or blindness<\/b><\/span><span class=\"ko\">단절이나 눈멀음을 만들기 시작한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to reality.<\/b><\/span><span class=\"ko\">현실에 대한<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리의 더 많은 것에 대한 욕망은 &#39;일반 대중&#39;과의 줄어든 실제적인 상호작용과 결합되어서, 현실에 대한 단절이나 눈멀음을 만들어내기 시작한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> blindness to reality는 부유해질수록 주변의 어려운 이웃이나 공동체의 필요를 제대로 보지 못하고, 오직 자신의 부를 지키는 데만 매몰되는 상태를 의미합니다. 글의 결론으로, 풍요와 소유욕이 인간의 본래적 협력 본능을 마비시키고 사회적 고립을 초래한다는 경고를 담고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">combined with (분사구문): 과거분사(p.p.)로 시작하여 부가적인 설명을 제공하는 분사구문이다. 원래 절로 변환하면 as it is combined with ... 로 쓸 수 있다.<\/div><div class=\"lec-gr-item\">to create (to부정사(명사적)): 동사 starts의 목적어 자리에 쓰여 동사의 대상을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">desire<\/td><td class=\"m\">욕구, 갈망<\/td><\/tr><tr><td class=\"w\">combine<\/td><td class=\"m\">결합하다, 합치다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>인간은 본래 자원이 부족한 환경에서 협력하고 나누며 생존하도록 진화했다.<\/li><li>유목 부족은 나중에 자신도 도움을 받을 수 있다는 생각에 낯선 이에게도 기꺼이 호의를 베푼다.<\/li><li>하지만 현대인은 가질 것이 많아질수록 울타리를 높이고 보안을 강화하며 나누기를 꺼린다.<\/li><li>이러한 소유욕과 타인과의 단절은 결국 공동체의 현실을 보지 못하는 맹목성을 낳는다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">While humans naturally share and cooperate for survival during times of scarcity, they tend to become more protective and socially disconnected as their resources increase.<\/div>\n              <div class=\"lec-final-sum-ko\">인간은 부족한 상황에서는 생존을 위해 기꺼이 나눔과 협력을 실천하는 반면, 자원이 풍족해질수록 소유물을 보호하려 하며 사회적 단절을 겪는다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./30_audio/1.mp3","hl":null}],[{"audio":"./30_audio/2.mp3","hl":null}],[{"audio":"./30_audio/3.mp3","hl":null},{"audio":"./30_audio/4.mp3","hl":"stage-0"},{"audio":"./30_audio/5.mp3","hl":"stage-1"},{"audio":"./30_audio/6.mp3","hl":"stage-2"},{"audio":"./30_audio/7.mp3","hl":"stage-3"}],[{"audio":"./30_audio/8.mp3","hl":null}],[{"audio":"./3  차단하고 현실에 대한 무관심을 초래한다.","평범한 사람들(common folk)과의 물리적 상호작용 감소","사회적 단절(disconnection) 현상 발생","현실에 대한 맹목(blindness to reality)으로 이어짐"]}],"bkg":"인간은 생존을 위해 서로 돕는 상호 이타주의(Reciprocal Altruism)라는 본능을 진화시켜 왔는데, 이는 과거 자원이 부족하던 시절에 서로의 생존 확률을 높이기 위한 필수적인 전략이었습니다. 유목 생활을 하는 부족들에게 있어 나눔은 단순한 호의를 넘어, 내가 어려울 때 다시 도움을 받을 수 있다는 일종의 사회적 보험(Social Insurance)과 같은 역할을 하며 공동체의 결속을 다집니다. 하지만 현대의 풍요로움은 타인에 대한 의존도를 낮춰 심리적 거리감(Psychological Distance)을 만들고, 오히려 자신의 자산을 지키기 위해 타인을 배척하는 사회적 고립(Social Isolation) 현상을 낳기도 합니다. 마치 비바람이 몰아칠 때는 좁은 처마 밑에서도 기꺼이 서로 어깨를 내어주지만, 날이 개고 각자의 크고 안전한 집이 생기면 오히려 대문을 굳게 걸어 잠그게 되는 풍요의 역설(Paradox of Affluence)이 우리 사회에 존재한다는 점을 이해하면 이 글을 더 깊이 있게 읽으실 수 있습니다.","ttsText":"인간은 생존을 위해 서로 돕는 상호 이타주의(Reciprocal Altruism)라는 본능을 진화시켜 왔는데, 이는 과거 자원이 부족하던 시절에 서로의 생존 확률을 높이기 위한 필수적인 전략이었습니다. 유목 생활을 하는 부족들에게 있어 나눔은 단순한 호의를 넘어, 내가 어려울 때 다시 도움을 받을 수 있다는 일종의 사회적 보험(Social Insurance)과 같은 역할을 하며 공동체의 결속을 다집니다. 하지만 현대의 풍요로움은 타인에 대한 의존도를 낮춰 심리적 거리감(Psychological Distance)을 만들고, 오히려 자신의 자산을 지키기 위해 타인을 배척하는 사회적 고립(Social Isolation) 현상을 낳기도 합니다. 마치 비바람이 몰아칠 때는 좁은 처마 밑에서도 기꺼이 서로 어깨를 내어주지만, 날이 개고 각자의 크고 안전한 집이 생기면 오히려 대문을 굳게 걸어 잠그게 되는 풍요의 역설(Paradox of Affluence)이 우리 사회에 존재한다는 점을 이해하면 이 글을 더 깊이 있게 읽으실 수 있습니다.","__passage":"EBS올림포스(연합기출)고1 2026년 12강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 30번","__script":"자, 오늘 우리가 함께 공부할 지문은 'EBS올림포스(연합기출)고1 2026년 12강 01번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"EBS올림포스(연합기출)고1 2026년 12강 01번","titleEn":"The Paradox of Plenty: Why More Wealth Leads to Less Sharing","titleKo":"풍요의 역설: 부유해질수록 나눔이 줄어드는 이유","imageUrl":"__enpImg__","stages":[{"label":"01인류의 협력적 성향","items":["인류는 자원이 부족하고 위험이 큰 시기에 생존을 위해 협력하도록 진화했다.","나눔과 협력(sharing and cooperation)의 자연스러운 성향","제한된 자원(limited resources) 환경에서 형성된 본능","핵심 키워드: 본능적 경향(natural tendency)"]},{"label":"02부족함 속의 관대함","items":["자원이 적을 때 인간은 오히려 타인에게 더 개방적이며 나눔에 적극적인 모습을 보인다.","유목 부족(nomadic tribes)의 사례: 가진 것이 적어도 기꺼이 나눔","나눔의 동기: 생존(survival)을 위한 상호 호혜적 이익 추구","언젠가 자신도  하며 사회적 단절을 겪는다.","bullets":[],"overall":["인간은 본래 자원이 부족한 환경에서 협력하고 나누며 생존하도록 진화했다.","유목 부족은 나중에 자신도 도움을 받을 수 있다는 생각에 낯선 이에게도 기꺼이 호의를 베푼다.","하지만 현대인은 가질 것이 많아질수록 울타리를 높이고 보안을 강화하며 나누기를 꺼린다.","이러한 소유욕과 타인과의 단절은 결국 공동체의 현실을 보지 못하는 맹목성을 낳는다."],"compare":{"headers":["구분","유목 부족 (부족한 환경)","현대인 (풍요로운 환경)"],"rows":[["자원 상태","자원이 한정되고 부족함","자원이 많고 풍족함"],["공유 태도","기꺼이 나누고 환대함","울타리를 높이고 공유를 꺼림"],["행동 동기","상호 호혜를 통한 생존","소유물 보호 및 타인 차단"],["사회적 결과","상호 연결 및 생존 보장","사회적 단절 및 현실 맹목"]]},"ttsText":"인간은 본래 자원이 부족한 환경에서 협력하고 나누며 생존하도록 진화했다. 유목 부족은 나중에 자신도 도움을 받을 수 있다는 생각에 낯선 이에게도 기꺼이 호의를 베푼다. 하지만 현대인은 가질 것이 많아질수록 울타리를 높이고 보안을 강화하며 나누기를 꺼린다. 이러한 소유욕과 타인과의 단절은 결국 공동체의 현실을 보지 못하는 맹목성을 낳는다.","__passage":"EBS올림포스(연합기출)고1 2026년 12강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 30번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 인간은 본래 자원이 부족한 환경에서 협력하고 나누며 생존하도록 진화했습니다. 유목 부족은 나중에 자신도 도움을 받을 수 있다는 생각에 낯선 이에게도 기꺼이 호의를 베풉니다. 하지만 현대인은 가질 것이 많아질수록 울타리를 높이고 보안을 강화하며 나누기를 꺼립니다. 이러한 소유욕과 타인과의 단절은 결국 공동체의 현실을 보지 못하는 맹목성을 낳습니다. 마지막으로 이 글을 한 문장으로 요약하면 이렇습니다. 인간은 부족한 상황에서는 생존을 위해 기꺼이 나눔과 협력을 실천하는 반면, 자원이 풍족해질수록 소유물을 보호하려 하며 사회적 단절을 겪습니다. 오늘도 정말 수고 많았습니다!"}]}</script><script>var D=JSON.parse(document.getElementById("enpLecData").textContent);var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundi
