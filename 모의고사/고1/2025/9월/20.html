는 준비운동(Warm-up)을 하듯 학습을 위해 뇌를 예열하는 과정이 반드시 필요합니다. 이러한 정서적 전환(Emotional Transition)과 학습 태세(Mental Set) 형성이 제대로 이루어져야만 학생들은 새로운 지식을 받아들일 준비를 마치게 되며, 이는 결과적으로 수업 전체의 학습 효율성(Learning Efficiency)을 극대화하는 중요한 밑거름이 됩니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01시작 시간의 낭비<\/div><ul><li>비효율적인 교사들은 수업 초기 몇 분의 잠재적인 힘을 간과하여 시간을 허비한다.<\/li><li>교사의 업무 부담으로 인한 시작 지연<\/li><li>학생들이 정시에 올 이유가 부족함 (little reason to be on time)<\/li><li>핵심 키워드: 비효율적인 교사 (inefficient teachers)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02첫 10분의 결정적 역할<\/div><ul><li>수업의 첫 몇 분은 그날 전체 수업의 분위기를 결정하는 매우 중요한 시간이다.<\/li><li>전체 분위기를 설정함 (set the tone)<\/li><li>시간 활용에 대한 교사의 선택 (choose)<\/li><li>수업의 성공적인 시작 (great start)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03오프닝 루틴의 이점<\/div><ul><li>준비된 수업과 오프닝 루틴은 학생들의 학습 준비를 효과적으로 돕는다.<\/li><li>정신적, 감정적 전환 (mental and emotional transitions)<\/li><li>새로운 학습 내용에 대한 집중 (focus on learning)<\/li><li>핵심 키워드: 오프닝 루틴 (opening routine)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04효과적인 수업 확립<\/div><ul><li>성공적인 수업 운영을 위해 체계적인 시작 절차를 만드는 것이 필수적이다.<\/li><li>루틴의 확립 (establish)<\/li><li>효과적인 시작을 통한 수업 발전 (effective start)<\/li><li>교사의 철저한 준비 (prepared for class)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">overlook<\/td><td class=\"m\">간과하다, 못 보고 넘기다<\/td><\/tr><tr><td class=\"w\">potential<\/td><td class=\"m\">잠재력, 가능성<\/td><\/tr><tr><td class=\"w\">demand<\/td><td class=\"m\">수요, 요구<\/td><\/tr><tr><td class=\"w\">disappear<\/td><td class=\"m\">사라지다<\/td><\/tr><tr><td class=\"w\">wonder<\/td><td class=\"m\">경이, 놀라움<\/td><\/tr><tr><td class=\"w\">waste<\/td><td class=\"m\">낭비하다, 헛되이 쓰다<\/td><\/tr><tr><td class=\"w\">tone<\/td><td class=\"m\">어조, 말투<\/td><\/tr><tr><td class=\"w\">prepare<\/td><td class=\"m\">준비하다<\/td><\/tr><tr><td class=\"w\">routine<\/td><td class=\"m\">일상, 정해진 일과<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">brief<\/td><td class=\"m\">짧은, 간단한<\/td><\/tr><tr><td class=\"w\">mental<\/td><td class=\"m\">정신의, 마음의<\/td><\/tr><tr><td class=\"w\">transition<\/td><td class=\"m\">변화, 이행<\/td><\/tr><tr><td class=\"w\">last<\/td><td class=\"m\">마지막의, 지난<\/td><\/tr><tr><td class=\"w\">subject<\/td><td class=\"m\">주제, 과목<\/td><\/tr><tr><td class=\"w\">focus<\/td><td class=\"m\">(focus on) ~에 집중하다<\/td><\/tr><tr><td class=\"w\">material<\/td><td class=\"m\">재료, 자료<\/td><\/tr><tr><td class=\"w\">summary<\/td><td class=\"m\">요약, 일람, 개요<\/td><\/tr><tr><td class=\"w\">establish<\/td><td class=\"m\">세우다, 확립하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Inefficient teachers<\/b><\/span><span class=\"ko\">비효율적인 교사들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>overlook<\/b><\/span><span class=\"ko\">간과한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the potential power<\/b><\/span><span class=\"ko\">잠재적인 힘을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of the <span class=\"grammar-hl\">opening minutes<\/span> of class.<\/b><\/span><span class=\"ko\">수업 시작 몇 분의.<\/span><\/div><\/div><div class=\"lec-sent-ko\">비효율적인 교사들은 수업 시작 몇 분의 잠재적인 힘을 간과한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로, 많은 교사가 무심코 놓치고 있는 &#39;수업 초반부&#39;의 중요성을 화두로 던집니다. potential power는 수업의 성패를 결정지을 수 있는 에너지가 수업 직후가 아닌, 수업이 시작되는 바로 그 짧은 순간에 숨어 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">opening minutes (현재분사(형용사)): opening이 뒤의 명사인 minutes를 수식하여 &#39;수업을 시작하는/여는 시간&#39;이라는 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">overlook<\/td><td class=\"m\">간과하다, 못 보고 넘기다<\/td><\/tr><tr><td class=\"w\">potential<\/td><td class=\"m\">잠재력, 가능성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Often,<\/b><\/span><span class=\"ko\">종종,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>if students are quiet enough<\/b><\/span><span class=\"ko\">만약 학생들이 충분히 조용하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and if there are many <span class=\"grammar-hl\">pressing demands<\/span><\/b><\/span><span class=\"ko\">그리고 만약 많은 긴급한 요구가 있다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on a teacher's time<\/b><\/span><span class=\"ko\">교사의 시간에 대해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at that moment,<\/b><\/span><span class=\"ko\">그 순간에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>more than ten minutes<\/b><\/span><span class=\"ko\">10분 이상이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can disappear<\/b><\/span><span class=\"ko\">사라질 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>before class starts.<\/b><\/span><span class=\"ko\">수업이 시작되기 전에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">종종, 학생들이 충분히 조용하고 그 순간 교사의 시간에 대한 긴급한 요구가 많으면, 수업이 시작되기 전에 10분 이상이 사라질 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 &#39;간과하는 상황&#39;에 대한 구체적인 예시입니다. more than ten minutes can disappear는 교사가 행정적인 일이나 잡무에 치여 교실 분위기를 잡지 못하는 사이, 수업에 쓰여야 할 금쪽같은 시간이 아무런 의미 없이 흘러가 버리는 현상을 묘사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">pressing demands (현재분사(형용사)): pressing이 뒤의 명사인 demands를 수식하여 &#39;긴급한/압박을 가하는 요구&#39;라는 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">demand<\/td><td class=\"m\">수요, 요구<\/td><\/tr><tr><td class=\"w\">disappear<\/td><td class=\"m\">사라지다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">It's no wonder<\/span><\/b><\/span><span class=\"ko\">놀라운 일이 아니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that students are late for class<\/span>;<\/b><\/span><span class=\"ko\">학생들이 수업에 늦는 것은;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they have little <span class=\"grammar-hl\">reason<\/span><\/b><\/span><span class=\"ko\">그들은 이유가 거의 없다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to be on time<\/span>.<\/b><\/span><span class=\"ko\">제시간에 올.<\/span><\/div><\/div><div class=\"lec-sent-ko\">학생들이 수업에 늦는 것은 놀라운 일이 아니다. 그들이 제시간에 올 이유가 거의 없다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 교사의 시간 관리가 실패했을 때 나타나는 부정적인 결과를 보여줍니다. little reason to be on time은 수업 시작 직후에 흥미롭거나 중요한 활동이 전혀 이루어지지 않다 보니, 학생들 사이에서 굳이 종소리에 맞춰 자리에 앉을 필요가 없다는 부정적인 인식이 형성되었음을 뜻합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It&#39;s no wonder that students are late for class (가주어): 진주어: It은 가주어로 쓰였으며, 뒤의 that절(that students are late for class)이 실제 주어인 진주어 역할을 하는 명사절이다.<\/div><div class=\"lec-gr-item\">reason to be on time (to부정사(형용사적)): reason이라는 명사를 뒤에서 수식하며, 명사의 내용을 한정하는 구조다. (~할 이유)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wonder<\/td><td class=\"m\">경이, 놀라움<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>You can <span class=\"grammar-hl\">use the first ten minutes<\/span><\/b><\/span><span class=\"ko\">당신은 첫 10분을 사용할 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to get<\/span> your class off to a great start,<\/b><\/span><span class=\"ko\">당신의 수업을 훌륭한 시작으로 출발시키기 위해,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or you can <span class=\"grammar-hl\">choose<\/span><\/b><\/span><span class=\"ko\">혹은 당신은 선택할 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to waste<\/span> this time.<\/b><\/span><span class=\"ko\">이 시간을 낭비하는 것을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신은 훌륭한 시작으로 당신의 수업을 출발시키도록 첫 10분을 사용하거나 당신은 이 시간을 낭비하도록 선택할 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 시간 활용에 대한 교사의 선택권을 제시하며 분위기를 전환합니다. get your class off to a great start는 수업 초반을 전략적으로 활용하여 학생들의 주의를 집중시키고 학습 의욕을 끌어올리는 생산적인 출발을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">use the first ten minutes to get (to부정사(부사적): 목적): &#39;in order to&#39;로 바꿔 써도 의미가 통하며, 시간을 사용하는 목적을 나타낸다.<\/div><div class=\"lec-gr-item\">choose to waste (to부정사(명사적)): 타동사 choose의 목적어 자리에 위치하여 &#39;~하는 것을 선택하다&#39;라는 의미를 만든다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">waste<\/td><td class=\"m\">낭비하다, 헛되이 쓰다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The first minutes<\/b><\/span><span class=\"ko\">첫 몇 분이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">set the tone<\/span><\/b><\/span><span class=\"ko\">분위기를 설정한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for the rest of the class.<\/b><\/span><span class=\"ko\">나머지 수업을 위한.<\/span><\/div><\/div><div class=\"lec-sent-ko\">첫 몇 분이 나머지 수업의 분위기를 설정한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 왜 초반 10분이 중요한지에 대한 핵심적인 이유를 설명합니다. set the tone은 처음에 형성된 집중도나 질서가 관성처럼 작용하여, 수업이 끝날 때까지 전체적인 학습 분위기를 지배하게 된다는 원리를 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">set the tone (관용표현): &#39;분위기를 설정하다/형성하다&#39;라는 뜻으로 쓰이는 굳어진 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tone<\/td><td class=\"m\">어조, 말투<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If you <span class=\"grammar-hl\">are prepared<\/span> for class<\/b><\/span><span class=\"ko\">만약 당신이 수업 준비가 되어 있고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and have taught your students an opening routine,<\/b><\/span><span class=\"ko\">시작 루틴을 학생들에게 가르쳤다면,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they can <span class=\"grammar-hl\">use this brief time<\/span><\/b><\/span><span class=\"ko\">그들은 이 짧은 시간을 사용할 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to make<\/span> mental and emotional transitions<\/b><\/span><span class=\"ko\">정신적이고 감정적인 변화를 만들기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from the last class or subject<\/b><\/span><span class=\"ko\">지난 수업이나 과목으로부터<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">prepare<\/span><\/b><\/span><span class=\"ko\">그리고 준비할 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to focus<\/span><\/b><\/span><span class=\"ko\">집중하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">on learning new material<\/span>.<\/b><\/span><span class=\"ko\">새로운 자료를 배우는 것에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신이 수업 준비가 되어 있고 시작 루틴을 학생들에게 가르쳤다면, 그들은 지난 수업 또는 과목으로부터 정신적, 감정적 변화를 만들고 새로운 자료를 배우는 것에 집중하려고 준비하기 위해 이 짧은 시간을 사용할 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 효율적인 교사가 취해야 할 구체적인 행동과 그 효과를 설명합니다. mental and emotional transitions는 학생들이 이전 시간의 잔상이나 휴식 시간의 들뜬 기분을 차분히 가라앉히고, 현재 수업 주제에 맞게 뇌의 모드를 전환하는 준비 과정을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are prepared (수동태): be동사(are)+p.p.(prepared) 구조. prepare는 타동사인데 뒤에 목적어가 없어서 수동구조 are prepared 형태로 쓴다. 기본구조: V + O (prepare someone/something for...)<\/div><div class=\"lec-gr-item\">use this brief time to make (to부정사(부사적): 목적): &#39;in order to&#39;로 바꿔 써도 의미가 통하며, 시간을 사용하는 목적을 설명한다.<\/div><div class=\"lec-gr-item\">prepare to focus (to부정사(명사적)): 타동사 prepare의 목적어 자리에 위치하여 &#39;~하는 것을 준비하다&#39;라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">on learning new material (동명사): 전치사 on의 목적어로 쓰인 명사적 역할이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">prepare<\/td><td class=\"m\">준비하다<\/td><\/tr><tr><td class=\"w\">routine<\/td><td class=\"m\">일상, 정해진 일과<\/td><\/tr><tr><td class=\"w\">brief<\/td><td class=\"m\">짧은, 간단한<\/td><\/tr><tr><td class=\"w\">mental<\/td><td class=\"m\">정신의, 마음의<\/td><\/tr><tr><td class=\"w\">transition<\/td><td class=\"m\">변화, 이행<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">last<\/td><td class=\"m\">마지막의, 지난<\/td><\/tr><tr><td class=\"w\">subject<\/td><td class=\"m\">주제, 과목<\/td><\/tr><tr><td class=\"w\">focus<\/td><td class=\"m\">(focus on) ~에 집중하다<\/td><\/tr><tr><td class=\"w\">material<\/td><td class=\"m\">재료, 자료<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In summary,<\/b><\/span><span class=\"ko\">요약하자면,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you should <span class=\"grammar-hl\">establish an opening routine<\/span><\/b><\/span><span class=\"ko\">당신은 시작 루틴을 마련해야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to develop<\/span> your class<\/b><\/span><span class=\"ko\">당신의 수업을 전개하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with an effective start.<\/b><\/span><span class=\"ko\">효과적인 출발로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">요약하자면, 효과적인 출발로 수업을 전개하기 위한 시작 루틴을 마련해야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 전체 글의 결론으로 교사에게 주는 최종 제언입니다. establish an opening routine은 매 수업 시작마다 반복되는 고정적인 활동을 만들어, 학생들 스스로가 수업 시작과 동시에 자동으로 학습 모드에 돌입할 수 있는 체계를 갖추라는 권고입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">establish an opening routine to develop (to부정사(부사적): 목적): &#39;in order to&#39;로 바꿔 써도 의미가 통하며, 루틴을 확립해야 하는 목적을 설명한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">routine<\/td><td class=\"m\">일상, 정해진 일과<\/td><\/tr><tr><td class=\"w\">summary<\/td><td class=\"m\">요약, 일람, 개요<\/td><\/tr><tr><td class=\"w\">establish<\/td><td class=\"m\">세우다, 확립하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>비효율적인 교사는 수업 시작 직후의 중요성을 깨닫지 못하고 시간을 허비한다.<\/li><li>수업 초반에 아무런 활동이 없으면 학생들은 지각을 당연하게 여기게 된다.<\/li><li>수업 시작 몇 분은 전체 수업의 분위기와 집중도를 결정짓는 결정적인 시간이다.<\/li><li>교사는 &#39;시작 루틴&#39;을 만들어 학생들이 학습에 집중할 수 있도록 심리적 전환을 도와야 한다.<\/li><li>효과적인 수업 전개를 위해 체계적인 시작 습관을 확립하는 것이 필수적이다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Teachers must implement an opening routine to facilitate students&#39; mental transitions while setting a productive tone for the entire lesson.<\/div>\n              <div class=\"lec-final-sum-ko\">교사는 학생들의 정신적 전환을 돕는 동시에 전체 수업의 생산적인 분위기를 설정하기 위해 수업 시작 루틴을 시행해야 한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./20_audio/1.mp3","hl":null}],[{"audio":"./20_audio/2.mp3","hl":null}],[{"audio":"./20_audio/3.mp3","hl":null},{"audio":"./20_audio/4.mp3","hl":"stage-0"},{"audio":"./20_audio/5.mp3","hl":"stage-1"},{"audio":"./20_audio/6.mp3","hl":"stage-2"},{"audio":"./20_audio/7.mp3","hl":"stage-3"}],[{"audio":"./20_audio/8.mp3","hl":null}],[{"audio":"./20_audio/9.mp3","hl":"main"},{"audio":"./20_audio/10.mp3","hl":"meaning"},{"audio":"./20_audio/11.mp3","hl":"grammar"}],[{"audio":"./20_audio/12.mp3","hl":"main"},{"audio":"./20_audio/13.mp3","hl":"meaning"},{"audio":"./20_audio/14.mp3","hl":"grammar"}],[{"audio":"./20_audio/15.mp3","hl":"main"},{"audio":"./20_audio/16.mp3","hl":"meaning"},{"audio":"./20_audio/17.mp3","hl":"grammar"}],[{"audio":"./20_audio/18.mp3","hl":"main"},{"audio":"./20_audio/19.mp3","hl":"meaning"},{"audio":"./20_audio/20.mp3","hl":"grammar"}],[{"audio":"./20_audio/21.mp3","hl":"main"},{"audio":"./20_audio/22.mp3","hl":"meaning"},{"audio":"./20_audio/23.mp3","hl":"grammar"}],[{"audio":"./20_audio/24.mp3","hl":"main"},{"audio":"./20_audio/25.mp3","hl":"meaning"},{"audio":"./20_audio/26.mp3","hl":"grammar"}],[{"audio":"./20_audio/27.mp3","hl":"main"},{"audio":"./20_audio/28.mp3","hl":"meaning"},{"audio":"./20_audio/29.mp3","hl":"grammar"}],[{"audio":"./20_audio/30.mp ":"세우다, 확립하다"}],"ttsText":"요약하자면, 효과적인 출발로 수업을 전개하기 위한 시작 루틴을 마련해야 한다.. 전체 글의 결론으로 교사에게 주는 최종 제언입니다. establish an opening routine은 매 수업 시작마다 반복되는 고정적인 활동을 만들어, 학생들 스스로가 수업 시작과 동시에 자동으로 학습 모드에 돌입할 수 있는 체계를 갖추라는 권고입니다.. establish an opening routine to develop (to부정사(부사적): 목적): 'in order to'로 바꿔 써도 의미가 통하며, 루틴을 확립해야 하는 목적을 설명한다.","__passage":"EBS올림포스(연합기출)고1 2026년 03강 01번","passageName":"EBS올림포스(연합기출)고1 2026년 03강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 20번"},{"kind":"summary","passageName":"EBS올림포스(연합기출)고1 2026년 03강 01번","imageUrl":"__enpImg__","sumEn":"Teachers must implement an opening routine to facilitate students' mental transitions while setting a productive tone for the entire lesson.","sumKo":"교사는 학생들의 정신적 전환을 돕는 동시에 전체 수업의 생산적인 분위기를 설정하기 위해 수업 시작 루틴을 시행해야 한다.","bullets":[],"overall":["비효율적인 교사는 수업 시작 직후의 중요성을 깨닫지 못하고 시간을 허비한다.","수업 초반에 아무런 활동이 없으면 학생들은 지각을 당연하게 여기게 된다.","수업 시작 몇 분은 전체 수업의 분위기와 집중도를 결정짓는 결정적인 시간이다.","교사는 '시작 루틴'을 만들어 학생들이 학습에 집중할 수 있도록 심리적 전환을 도와야 한다.","효과적인 수업 전개를 위해 체계적인 시작 습관을 확립하는 것이 필수적이다."],"compare":{"headers":["구분","비효율적인 교사 (부정적 상황)","효율적인 교사 (해결책)"],"rows":[["시간 인식","수업 초반 10분을 무의미하게 보냄","초반 10분을 수업의 결정적 기회로 활용"],["수업 준비","행정 업무나 잡무에 시간을 빼앗김","시작 루틴(Opening Routine)을 확립함"],["학생 반응","정시에 도착해야 할 이유를 못 느낌","학습을 위한 정신적·감정적 전환을 수행함"],["수업 결과","수업 전체의 분위기(Tone) 형성 실패","새로운 내용 학습을 위한 집중력 확보"]]},"ttsText":"비효율적인 교사는 수업 시작 직후의 중요성을 깨닫지 못하고 시간을 허비한다. 수업 초반에 아무런 활동이 없으면 학생들은 지각을 당연하게 여기게 된다. 수업 시작 몇 분은 전체 수업의 분위기와 집중도를 결정짓는 결정적인 시간이다. 교사는 '시작 루틴'을 만들어 학생들이 학습에 집중할 수 있도록 심리적 전환을 도와야 한다. 효과적인 수업 전개를 위해 체계적인 시작 습관을 확립하는 것이 필수적이다.","__passage":"EBS올림포스(연합기출)고1 2026년 03강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 20번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 비효율적인 교사는 수업 시작 직후의 중요성을 깨닫지 못하고 시간을 허비합니다. 수업 초반에 아무런 활동이 없으면 학생들은 지각을 당연하게 여기게 됩니다. 수업 시작 몇 분은 전체 수업의 분위기와 집중도를 결정짓는 결정적인 시간입니다. 교사는 '시작 루틴'을 만들어 학생들이 학습에 집중할 수 있도록 심리적 전환을 도와야 합니다. 효과적인 수업 전개를 위해 체계적인 시작 습관을 확립하는 것이 필수적입니다. 마지막으로 이 글을 한 문장으로 요약하면 이렇습니다. 교사는 학생들의 정신적 전환을 돕는 동시에
