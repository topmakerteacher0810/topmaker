가란 선한 마음이 실제적인 행동(Action)으로 이어져 가시적인 성과를 내는 실천적 영역까지 포함하고 있다는 맥락을 기억하며 지문을 읽어보시기 바랍니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01행동의 빈도<\/div><ul><li>도덕적으로 선한 사람은 일반적인 사람들에 비해 행동의 양상에서 뚜렷한 차이를 보인다.<\/li><li>선한 행동(morally good actions)을 훨씬 더 자주 수행함<\/li><li>악한 행동(morally bad actions)은 훨씬 더 적게 수행함<\/li><li>핵심 키워드: 행동의 빈도(frequency)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02의도와 동기의 개입<\/div><ul><li>도덕성을 판단할 때는 겉으로 드러나는 행동뿐만 아니라 내면의 목적이 함께 고려되어야 한다.<\/li><li>선을 행하려는 의도(intend)를 품어야 함<\/li><li>악을 피하려는 명확한 동기가 있어야 함<\/li><li>핵심 키워드: 의도(intentions)와 동기(motives)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03우연한 결과의 배제<\/div><ul><li>자신의 의도와 상관없이 우연히 발생한 긍정적인 결과는 도덕적 선으로 인정받기 어렵다.<\/li><li>의도치 않게(unintentionally) 타인에게 도움을 주는 경우<\/li><li>실제 결과(actual consequences)가 의도와 일치하지 않는 사례<\/li><li>슬랩스틱 영화와 같은 우연적 상황은 도덕적 판단에서 제외됨<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실제 결과의 필요성<\/div><ul><li>선한 의도만으로는 부족하며 도덕적으로 선하다는 평가를 받기 위해서는 반드시 실제적인 결과가 수반되어야 한다.<\/li><li>단순히 마음만 좋은 것(mean well)은 도덕적 선의 충분조건이 아님<\/li><li>칸트(Kant)의 동기주의와 달리 어느 정도의 결과(results)가 필수적임<\/li><li>핵심 키워드: 실제적인 결과(actual consequences)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">prevent<\/td><td class=\"m\">막다, 예방하다<\/td><\/tr><tr><td class=\"w\">harm<\/td><td class=\"m\">해, 피해<\/td><\/tr><tr><td class=\"w\">generally<\/td><td class=\"m\">일반적으로, 대체로<\/td><\/tr><tr><td class=\"w\">moral<\/td><td class=\"m\">도덕적으로<\/td><\/tr><tr><td class=\"w\">significantly<\/td><td class=\"m\">상당히, 크게<\/td><\/tr><tr><td class=\"w\">judge<\/td><td class=\"m\">판단하다, 평가하다<\/td><\/tr><tr><td class=\"w\">intention<\/td><td class=\"m\">의도<\/td><\/tr><tr><td class=\"w\">motive<\/td><td class=\"m\">동기<\/td><\/tr><tr><td class=\"w\">relevant<\/td><td class=\"m\">관련된, 유의미한<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intend<\/td><td class=\"m\">의도하다, ~할 작정이다<\/td><\/tr><tr><td class=\"w\">unintentionally<\/td><td class=\"m\">의도하지 않게, 고의 아니게<\/td><\/tr><tr><td class=\"w\">simply<\/td><td class=\"m\">단순히, 그저<\/td><\/tr><tr><td class=\"w\">occur<\/td><td class=\"m\">일어나다, 발생하다<\/td><\/tr><tr><td class=\"w\">worth<\/td><td class=\"m\">~할 가치가 있는<\/td><\/tr><tr><td class=\"w\">mention<\/td><td class=\"m\">언급하다, 말하다<\/td><\/tr><tr><td class=\"w\">impression<\/td><td class=\"m\">인상<\/td><\/tr><tr><td class=\"w\">consequence<\/td><td class=\"m\">결과<\/td><\/tr><tr><td class=\"w\">count<\/td><td class=\"m\">세다, 계산하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>A morally good person<\/b><\/span><span class=\"ko\">도덕적으로 선한 사람은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is one<\/b><\/span><span class=\"ko\">그런 사람이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who does morally bad actions<\/span><\/b><\/span><span class=\"ko\">도덕적으로 나쁜 행동을 하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>significantly less often than most<\/b><\/span><span class=\"ko\">대부분보다 훨씬 덜 자주<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and does morally good ones<\/b><\/span><span class=\"ko\">그리고 도덕적으로 선한 행동을 하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>significantly more often than most.<\/b><\/span><span class=\"ko\">대부분보다 훨씬 더 자주<\/span><\/div><\/div><div class=\"lec-sent-ko\">도덕적으로 선한 사람은 대부분의 사람들보다 도덕적으로 나쁜 행동을 훨씬 덜 자주 하고, 도덕적으로 선한 행동을 훨씬 더 자주 하는 사람이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 문장은 도덕적 선함에 대한 일반적인 정의를 내리며 글을 시작합니다. significantly less/more often than most는 단순히 한두 번의 행동이 아니라, 남들과 비교했을 때 확연히 차이가 날 정도로 꾸준히 선한 행동을 실천하는 빈도가 높아야 한다는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who does morally bad actions (관계대명사): 주격 관계대명사 who가 이끄는 절이 앞의 명사(선행사) one을 수식하며, 절 내부에서 주어 역할을 수행한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">moral<\/td><td class=\"m\">도덕적으로<\/td><\/tr><tr><td class=\"w\">significantly<\/td><td class=\"m\">상당히, 크게<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In <span class=\"grammar-hl\">judging<\/span> a person<\/b><\/span><span class=\"ko\">한 사람을 판단할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>not only her actions but also her intentions and motives<\/b><\/span><span class=\"ko\">그녀의 행동뿐 아니라 그녀의 의도와 동기 또한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are relevant.<\/b><\/span><span class=\"ko\">관련이 있다<\/span><\/div><\/div><div class=\"lec-sent-ko\">사람을 판단할 때는 그녀의 행동뿐 아니라 그녀의 의도와 동기 또한 관련이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 &#39;행동의 빈도&#39;라는 외적인 기준에 더해, &#39;의도&#39;와 &#39;동기&#39;라는 내적인 기준을 추가합니다. intentions and motives are relevant는 겉으로 드러나는 모습만으로는 그 사람이 정말 선한지 완벽하게 판단할 수 없다는 논리로 이어집니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">judging (동명사): 전치사 In의 목적어 역할을 하는 명사적 성격으로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">judge<\/td><td class=\"m\">판단하다, 평가하다<\/td><\/tr><tr><td class=\"w\">intention<\/td><td class=\"m\">의도<\/td><\/tr><tr><td class=\"w\">motive<\/td><td class=\"m\">동기<\/td><\/tr><tr><td class=\"w\">relevant<\/td><td class=\"m\">관련된, 유의미한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>A morally good person<\/b><\/span><span class=\"ko\">도덕적으로 선한 사람은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>must intend <span class=\"grammar-hl\">to do<\/span> morally good actions<\/b><\/span><span class=\"ko\">도덕적으로 선한 행동을 하려고 의도해야 하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and intend <span class=\"grammar-hl\">to avoid<\/span> morally bad ones.<\/b><\/span><span class=\"ko\">도덕적으로 나쁜 행동은 피하려고 의도해야 한다<\/span><\/div><\/div><div class=\"lec-sent-ko\">도덕적으로 선한 사람은 도덕적으로 선한 행동을 하려고 의도해야 하고, 도덕적으로 나쁜 행동은 피하려고 의도해야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 2번 문장의 &#39;의도&#39;가 구체적으로 어떤 방향이어야 하는지 설명합니다. must intend to는 선한 사람이 되기 위해서는 우연히 착한 일을 하는 것이 아니라, 스스로의 의지를 가지고 선을 선택하고 악을 배제하는 주체적인 노력이 필수적이라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to do (to부정사(명사적)): 동사 intend의 목적어 자리에서 &#39;~하는 것&#39;이라는 의미로 쓰였다. (판정 근거: 목적어 자리)<\/div><div class=\"lec-gr-item\">to avoid (to부정사(명사적)): 동사 intend의 목적어 자리에서 &#39;~하는 것&#39;이라는 의미로 쓰였다. (판정 근거: 목적어 자리)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">moral<\/td><td class=\"m\">도덕적으로<\/td><\/tr><tr><td class=\"w\">intend<\/td><td class=\"m\">의도하다, ~할 작정이다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>A person<\/b><\/span><span class=\"ko\">한 사람은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who unintentionally prevents harm<\/span> to others<\/b><\/span><span class=\"ko\">의도하지 않게 다른 사람에게 해를 예방하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and does not harm them<\/b><\/span><span class=\"ko\">그리고 그들에게 해를 끼치지 않는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>simply because things do not turn out<\/b><\/span><span class=\"ko\">단지 일이 일어나지 않기 때문에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as she intends<\/b><\/span><span class=\"ko\">그녀가 의도한 대로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is not morally good.<\/b><\/span><span class=\"ko\">도덕적으로 선하지 않다<\/span><\/div><\/div><div class=\"lec-sent-ko\">다른 사람에게 해를 의도하지 않게 예방하고 단지 그녀가 의도한대로 일이 일어나지 않았기 때문에 그들에게 해를 끼치지 않은 사람은 도덕적으로 선하지 않다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 의도의 중요성을 반대 사례를 통해 뒷받침합니다. unintentionally prevents harm은 마음속으로는 나쁜 의도를 품었더라도 운이 좋아서 결과적으로 피해가 발생하지 않은 상황을 말하며, 이런 경우에는 행동의 결과가 무해하더라도 그 사람을 선하다고 부를 수 없다는 점을 분명히 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who unintentionally prevents harm (관계대명사): 주격 관계대명사 who가 선행사 A person을 수식하며, 절 내부에서 주어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">prevent<\/td><td class=\"m\">막다, 예방하다<\/td><\/tr><tr><td class=\"w\">harm<\/td><td class=\"m\">해, 피해<\/td><\/tr><tr><td class=\"w\">moral<\/td><td class=\"m\">도덕적으로<\/td><\/tr><tr><td class=\"w\">intention<\/td><td class=\"m\">의도<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intend<\/td><td class=\"m\">의도하다, ~할 작정이다<\/td><\/tr><tr><td class=\"w\">unintentionally<\/td><td class=\"m\">의도하지 않게, 고의 아니게<\/td><\/tr><tr><td class=\"w\">simply<\/td><td class=\"m\">단순히, 그저<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Although this kind of situation<\/b><\/span><span class=\"ko\">비록 이런 종류의 상황은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>generally occurs<\/b><\/span><span class=\"ko\">일반적으로 발생하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>only in slapstick movies,<\/b><\/span><span class=\"ko\">오직 슬랩스틱 영화에서만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it is worth mentioning<\/b><\/span><span class=\"ko\">그것은 언급할 가치가 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to avoid<\/span> the false <span class=\"grammar-hl\">impression<\/span><\/b><\/span><span class=\"ko\">잘못된 인상을 피하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that it is the actual consequences<\/span> of a person's actions<\/b><\/span><span class=\"ko\">그것이 한 사람의 행동의 실제 결과라는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that count toward her <span class=\"grammar-hl\">being judged morally good or bad<\/span>.<\/b><\/span><span class=\"ko\">그녀가 도덕적으로 선하거나 나쁘다고 판단되는 데 중요한 것은<\/span><\/div><\/div><div class=\"lec-sent-ko\">이런 종류의 상황은 일반적으로 슬랩스틱 영화에서만 발생하지만, 그녀가 도덕적으로 선하거나 나쁜지 판단되는 것에 중요한 것은 한 사람의 행동의 실제 결과라는 잘못된 인상을 피하기 위해 언급할 가치가 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 4번의 예시가 다소 극단적일 수 있음을 인정하면서도 이를 언급한 이유를 밝힙니다. actual consequences ... that count toward는 도덕성을 평가할 때 단순히 &#39;결과가 좋았는가&#39;만을 따지는 결과 중심적 사고의 위험성을 경계하려는 글쓴이의 의도를 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to avoid (to부정사(부사적/목적)): &#39;피하기 위해서&#39;라는 의미로 동사를 수식한다. (판정 근거: in order to로 바꿔도 뜻이 같다)<\/div><div class=\"lec-gr-item\">impression that it is the actual consequences 동격의 that: 명사 impression 뒤에 &#39;that + S + V&#39;의 완전한 절이 이어져 impression의 구체적인 내용을 설명하는 동격 구조를 형성한다.<\/div><div class=\"lec-gr-item\">it is the actual consequences of a person&#39;s actions that count (강조구문): &#39;it is ~ that&#39; 강조구문을 사용하여 주어인 &#39;the actual consequences of a person&#39;s actions&#39;를 강조하고 있다.<\/div><div class=\"lec-gr-item\">being judged morally good or bad (수동태): be동사(being)+p.p.(judged) 구조이며 전치사 toward의 목적어로 쓰인 동명사 수동태다. judge는 타동사인데 뒤에 목적어가 없어서 수동구조 being judged 형태로 쓴다. 기본구조: judge + O + C(목적격보어). 여기서는 수동태가 되면서 목적격보어인 morally good or bad가 그대로 남은 5형식 수동 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">generally<\/td><td class=\"m\">일반적으로, 대체로<\/td><\/tr><tr><td class=\"w\">moral<\/td><td class=\"m\">도덕적으로<\/td><\/tr><tr><td class=\"w\">judge<\/td><td class=\"m\">판단하다, 평가하다<\/td><\/tr><tr><td class=\"w\">occur<\/td><td class=\"m\">일어나다, 발생하다<\/td><\/tr><tr><td class=\"w\">worth<\/td><td class=\"m\">~할 가치가 있는<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mention<\/td><td class=\"m\">언급하다, 말하다<\/td><\/tr><tr><td class=\"w\">impression<\/td><td class=\"m\">인상<\/td><\/tr><tr><td class=\"w\">consequence<\/td><td class=\"m\">결과<\/td><\/tr><tr><td class=\"w\">count<\/td><td class=\"m\">세다, 계산하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">But actual consequences<\/span><\/b><\/span><span class=\"ko\">하지만 실제 결과는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">are important<\/span>.<\/b><\/span><span class=\"ko\">중요하다<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 실제 결과는 중요하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 흐름이 반전되는 지점입니다. 앞서 &#39;의도&#39;의 중요성을 강조했다면, 이제는 의도만으로는 부족하며 &#39;결과&#39; 역시 무시할 수 없는 요소임을 제시하며 균형을 잡습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">But actual consequences are important 문장 구조: &#39;주어(actual consequences) + be동사(are) + 형용사 보어(important)&#39;로 구성된 2형식(SVC) 문장이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consequence<\/td><td class=\"m\">결과<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>A person<\/b><\/span><span class=\"ko\">한 사람은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who always tries to prevent harm<\/span><\/b><\/span><span class=\"ko\">항상 해를 예방하려고 하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but never <span class=\"grammar-hl\">does<\/span>,<\/b><\/span><span class=\"ko\">결코 그렇게 하지 못하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">is not generally thought of<\/span><\/b><\/span><span class=\"ko\">일반적으로 생각되지 않는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as morally good<\/span>.<\/b><\/span><span class=\"ko\">도덕적으로 선하다고<\/span><\/div><\/div><div class=\"lec-sent-ko\">항상 해를 예방하려고 하지만 결코 그렇게 하지 못하는 사람은 일반적으로 도덕적으로 선하다고 생각되지 않는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 6번 문장에 대한 구체적인 예시입니다. always tries ... but never does는 아무리 마음이 따뜻하고 의도가 좋아도, 그 의도가 실제 세상에서 긍정적인 변화나 결과로 단 한 번도 이어지지 않는다면 사회적 관점에서 그를 선한 사람으로 인정하기 어렵다는 현실적인 인식을 반영합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who always tries to prevent harm (관계대명사): 주격 관계대명사 who가 선행사 A person을 수식한다.<\/div><div class=\"lec-gr-item\">to prevent (to부정사(명사적)): 동사 tries의 목적어 역할을 한다. (판정 근거: 목적어 자리)<\/div><div class=\"lec-gr-item\">does (대동사): 앞에 나온 일반동사구인 prevents harm을 대신하여 반복을 피한다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.<\/div><div class=\"lec-gr-item\">is not generally thought of as morally good (수동태): be동사(is)+p.p.(thought) 구조. think of는 타동사구로 쓰였는데 뒤에 목적어가 없어서 수동구조 is thought of 형태로 쓴다. 기본구조: think of + O + as C(목적격보어). 수동태가 되면서 목적어는 주어로 가고 보어인 as morally good이 남은 5형식(SVOC) 변형 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">prevent<\/td><td class=\"m\">막다, 예방하다<\/td><\/tr><tr><td class=\"w\">harm<\/td><td class=\"m\">해, 피해<\/td><\/tr><tr><td class=\"w\">generally<\/td><td class=\"m\">일반적으로, 대체로<\/td><\/tr><tr><td class=\"w\">moral<\/td><td class=\"m\">도덕적으로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Of such a person,<\/b><\/span><span class=\"ko\">그런 사람에 대해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">it<\/span> may <span class=\"grammar-hl\">be said<\/span><\/b><\/span><span class=\"ko\">말해질 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that she means well<\/span>;<\/b><\/span><span class=\"ko\">그녀가 선한 의도를 가지고 있다고;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but, contrary to Kant,<\/b><\/span><span class=\"ko\">하지만 Kant와 달리<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>some results are necessary<\/b><\/span><span class=\"ko\">어떤 결과가 필요하다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>before she <span class=\"grammar-hl\">is regarded<\/span><\/b><\/span><span class=\"ko\">그녀가 간주되기 전에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as morally good<\/span>.<\/b><\/span><span class=\"ko\">도덕적으로 선하다고<\/span><\/div><\/div><div class=\"lec-sent-ko\">그런 사람에 대해, 그녀가 선한 의도를 가지고 있다고 말할 수 있지만, Kant와 달리, 그녀가 도덕적으로 선하다고 간주되기 전에 어떤 결과가 필요하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 전체 글의 결론입니다. contrary to Kant는 동기(의무)만을 중시했던 철학자 칸트의 입장과 거리를 둡니다. some results are necessary는 진정한 도덕적 선함이란 선한 &#39;마음&#39;에서 시작하여 실질적인 &#39;결과&#39;로 완성되어야 한다는 글쓴이의 최종적인 주장을 담고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">it (가주어): 주어 자리가 너무 길어지는 것을 피하기 위해 형식적인 주어 it을 쓰고 진짜 주어인 that절을 뒤로 보냈다.<\/div><div class=\"lec-gr-item\">be said (수동태): be동사(be)+p.p.(said) 구조. 조동사 may 뒤에서 원형으로 쓰였다. say는 타동사인데 목적어(that절)가 주어 자리로 이동했으므로 수동구조 be said 형태로 쓴다. 기본구조: say + O<\/div><div class=\"lec-gr-item\">that she means well (가주어): 진주어: 가주어 it이 가리키는 실제 내용을 담고 있는 명사절(진주어)이다.<\/div><div class=\"lec-gr-item\">is regarded as morally good (수동태): be동사(is)+p.p.(regarded) 구조. regard는 타동사인데 뒤에 목적어가 없어서 수동구조 is regarded 형태로 쓴다. 기본구조: regard + O + as C(목적격보어). 목적어가 주어로 나가고 목적격보어인 as morally good이 뒤에 남은 5형식 수동 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">moral<\/td><td class=\"m\">도덕적으로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>도덕적으로 선한 사람은 기본적으로 선한 행동의 빈도가 남들보다 압도적으로 높아야 한다.<\/li><li>단순히 행동뿐만 아니라 그 이면의 &#39;의도&#39;와 &#39;동기&#39;가 반드시 선해야 진정한 선인으로 평가받는다.<\/li><li>나쁜 의도를 가졌으나 우연히 결과가 좋게 나온 경우를 선하다고 할 수 없듯, 의도는 핵심적인 요소다.<\/li><li>그러나 의도만 있고 실질적인 결과가 전혀 따르지 않는 경우 역시 도덕적으로 선하다고 인정받기 어렵다.<\/li><li>결국 도덕적 선함은 선한 의도와 그에 부합하는 실질적인 결과가 결합될 때 완성된다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">A person is judged as morally good through their consistent intention to perform virtuous acts, while actual positive consequences are also required to validate their moral standing.<\/div>\n              <div class=\"lec-final-sum-ko\">사람은 도덕적인 행동을 하려는 일관된 의도를 통해 도덕적으로 선하다고 판단되지만, 그들의 도덕적 지위를 입증하기 위해서는 실제적인 긍정적 결과 또한 필요하다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./39_audio/1.mp3","hl":null}],[{"audio":"./39_audio/2.mp3","hl":null}],[{"audio":"./39_audio/3.mp3","hl":null},{"audio":"./39_audio/4.mp3","hl":"stage-0"},{"audio":"./39_audio/5.mp3","hl":"stage-1"},{"audio":"./39_audio/6.mp3","hl":"stage-2"},{"audio":"./39_audio/7.mp3","hl":"stage-3"}],[{"audio":"./39_audio/8.mp3","hl":null}],[{"audio":"./39_audio/9.mp3","hl":"main"},{"audio":"./39_audio/10.mp3","hl":"meaning"},{"audio":"./39_audio/11.mp3","hl":"grammar"}],[{"audio":"./39_audio/12.mp3","hl":"main"},{"audio":"./39_audio/13.mp3","hl":"meaning"},{"audio":"./39_audio/14.mp3","hl":"grammar"}],[{"audio":"./39_audio/15.mp3","hl":"main"},{"audio":"./39_audio/16.mp3","hl":"meaning"},{"audio":"./39_audio/17.mp3","hl":"grammar"}],[{"audio":"./39_audio/18.mp3","hl":"main"},{"audio":"./39_audio/19.mp3","hl":"meaning"},{"audio":"./39_audio/20.mp3","hl":"grammar"}],[{"audio":"./39_audio/21.mp3","hl":"main"},{"audio":"./39_audio/22.mp3","hl":"meaning"},{"audio":"./39_audio/23.mp3","hl":"grammar"}],[{"audio":"./39_audio/24.mp3","hl":"main"},{"audio":"./39_audio/25.mp3","hl":"meaning"},{"audio":"./39_audio/26.mp3","hl":"grammar"}],[{"audio":"./39_audio/27.mp3","hl":"main"},{"audio":"./39_audio/28.mp3","hl":"meaning"},{"audio":"./39_audio/29.mp3","hl":"grammar"}],[{"audio":"./39_audio/30.mp3","hl":"main"},{"audio":"./39_audio/31.mp3","hl":"meaning"},{"audio":"./39_audio/32.mp3","hl":"grammar"}],[{"audio":"./39_audio/33.mp3","hl":null}]],"fileName":"모의고사_고1_2025년_09월_39번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 09월 / 39번","titleEn":"True Morality: The Integration of Good Intentions and Actual Results","titleKo":"진정한 도덕성: 선한 의도와 실제 결과의 통합","imageUrl":"__enpImg__","stages":[{"label":"01행동의 빈도","items":["도덕적으로 선한 사람은 일반적인 사람들에 비해 행동의 양상에서 뚜렷한 차이를 보인다.","선한 행동(morally good actions)을 훨씬 더 자주 수행함","악한 행동(morally bad actions)은 훨씬 더 적게 수행함","핵심 키워드: 행동의 빈도(frequency)"]},{"label":"02의도와 동기의 개입","items":["도덕성을 판단할 때는 겉으로 드러나는 행동뿐만 아니라 내면의 목적이 함께 고려되어야 한다.","선을 행하려는 의도(intend)를 품어야 함","악을 피하려는 명확한 동기가 있어야 함","핵심 키워드: 의도(intentions)와 동기(motives)"]},{"label":"03우연한 결과의 배제","items":["자신의 의도와 상관없이 우연히 발생한 긍정적인 결과는 도덕적 선으로 인정받기 어렵다.","의도치 않게(unintentionally) 타인에게 도움을 주는 경우","실제 결과(actual consequences)가 의도와 일치하지 않는 사례","슬랩스틱 영화와 같은 우연적 상황은 도덕적 판단에서 제외됨"]},{"label":"04실제 결과의 필요성","items":["선한 의도만으로는 부족하며 도덕적으로 선하다는 평가를 받기 위해서는 반드시 실제적인 결과가 수반되어야 한다.","단순히 마음만 좋은 것(mean well)은 도덕적 선의 충분조건이 아님","칸트(Kant)의 동기주의와 달리 어느 정도의 결과(results)가 필수적임","핵심 키워드: 실제적인 결과(actual consequences)"]}],"bkg":"서구 윤리학의 오랜 논쟁 중 하나는 도덕적 가치를 판단할 때 행위자의 동기(Motive)가 중요한지, 아니면 나타난 결과(Consequence)가 중요한지입니다. 근대 철학자 임마누엘 칸트(Immanuel Kant)는 결과가 어떠하든 '선을 행하려는 의지'인 선의지(Good Will) 자체를 가장 중요하게 보았지만, 이 지문은 의도와 더불어 실제 세상에 미치는 구체적인 결과가 어느 정도 뒷받침되어야 진정으로 도덕적인 사람이라 부를 수 있다는 중용의 입장을 보여줍니다. 이는 마치 요리사가 아무리 정성을 다해 요리하려 해도(의도) 결과적으로 항상 먹을 수 없는 음식을 만든다면(결과) 그를 훌륭한 요리사라고 인정하기 어려운 것과 비슷한 이치라고 이해하시면 좋습니다. 즉, 도덕적 평가란 선한 마음이 실제적인 행동(Action)으로 이어져 가시적인 성과를 내는 실천적 영역까지 포함하고 있다는 맥락을 기억하며 지문을 읽어보시기 바랍니다.","ttsText":"서구 윤리학의 오랜 논쟁 중 하나는 도덕적 가치를 판단할 때 행위자의 동기(Motive)가 중요한지, 아니면 나타난 결과(Consequence)가 중요한지입니다. 근대 철학자 임마누엘 칸트(Immanuel Kant)는 결과가 어떠하든 '선을 행하려는 의지'인 선의지(Good Will) 자체를 가장 중요하게 보았지만, 이 지문은 의도와 더불어 실제 세상에 미치는 구체적인 결과가 어느 정도 뒷받침되어야 진정으로 도덕적인 사람이라 부를 수 있다는 중용의 입장을 보여줍니다. 이는 마치 요리사가 아무리 정성을 다해 요리하려 해도(의도) 결과적으로 항상 먹을 수 없는 음식을 만든다면(결과) 그를 훌륭한 요리사라고 인정하기 어려운 것과 비슷한 이치라고 이해하시면 좋습니다. 즉, 도덕적 평가란 선한 마음이 실제적인 행동(Action)으로 이어져 가시적인 성과를 내는 실천적 영역까지 포함하고 있다는 맥락을 기억하며 지문을 읽어보시기 바랍니다.","__passage":"모의고사 / 고1 / 2025년 / 09월 / 39번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 39번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고1 / 2025년 / 09월 / 39번' 입니다. 화면의 그림을 먼저 한번 볼까요
