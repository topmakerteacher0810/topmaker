접적인 힘을 가해 더 짧은 거리에서 멈출 수 있다.<\/li><li>바퀴 림(wheel-rims)을 잡고 문지르는 방식<\/li><li>작용: 물리적 힘(force)을 가해 움직임에 급격한 변화를 줌<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03마찰력의 정의와 방향<\/div><ul><li>브레이크가 만드는 힘은 움직임을 방해하는 마찰력의 원리를 보여준다.<\/li><li>정의: 움직이는 물체를 느리게 만드는 마찰력 (friction)<\/li><li>방향: 운동 방향과 반대 방향 (opposite direction)인 뒤쪽으로 작용<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04보이지 않는 마찰 요인들<\/div><ul><li>브레이크를 잡지 않더라도 운동을 방해하는 다양한 마찰력이 존재한다.<\/li><li>차축(axles)과 바퀴가 문지르며 발생하는 마찰<\/li><li>공기 저항 (air resistance): 전진할 때 몸을 뒤로 미는 힘<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05원리의 일반적 적용<\/div><ul><li>마찰력의 원리는 자전거뿐만 아니라 수레와 같은 주변 사물에도 공통적으로 적용된다.<\/li><li>회전하는 부품 사이의 접촉이 저항을 생성함<\/li><li>핵심 키워드: 마찰의 발생 (generating friction)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">imagine<\/td><td class=\"m\">상상하다<\/td><\/tr><tr><td class=\"w\">pedal<\/td><td class=\"m\">페달(을 밟다)<\/td><\/tr><tr><td class=\"w\">level<\/td><td class=\"m\">수준, 정도<\/td><\/tr><tr><td class=\"w\">force<\/td><td class=\"m\">힘, 세력<\/td><\/tr><tr><td class=\"w\">friction<\/td><td class=\"m\">마찰<\/td><\/tr><tr><td class=\"w\">rub<\/td><td class=\"m\">문지르다, 비비다<\/td><\/tr><tr><td class=\"w\">resistance<\/td><td class=\"m\">저항, 반대<\/td><\/tr><tr><td class=\"w\">backward<\/td><td class=\"m\">뒤로, 거꾸로<\/td><\/tr><tr><td class=\"w\">apply<\/td><td class=\"m\">적용하다, 쓰다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">generate<\/td><td class=\"m\">만들어 내다, 발생시키다<\/td><\/tr><tr><td class=\"w\">mainly<\/td><td class=\"m\">주로<\/td><\/tr><tr><td class=\"w\">rotate<\/td><td class=\"m\">돌다, 회전하다<\/td><\/tr><tr><td class=\"w\">gradually<\/td><td class=\"m\">점차, 서서히<\/td><\/tr><tr><td class=\"w\">distance<\/td><td class=\"m\">거리<\/td><\/tr><tr><td class=\"w\">movement<\/td><td class=\"m\">움직임, 이동<\/td><\/tr><tr><td class=\"w\">exert<\/td><td class=\"m\">(힘을) 쓰다, 발휘하다<\/td><\/tr><tr><td class=\"w\">grip<\/td><td class=\"m\">꽉 쥐다, 움켜쥠<\/td><\/tr><tr><td class=\"w\">tend<\/td><td class=\"m\">~하는 경향이 있다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Imagine<\/b><\/span><span class=\"ko\">상상해 보아라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you <span class=\"grammar-hl\">are pedalling<\/span> your bicycle<\/b><\/span><span class=\"ko\">당신이 자전거 페달을 밟고 있다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on a level road.<\/b><\/span><span class=\"ko\">수평의 도로에서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">자전거 페달을 수평의 도로에서 밟고 있다고 상상해 보아라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> pedalling your bicycle on a level road는 마찰력의 개념을 설명하기 위해 독자가 일상에서 쉽게 겪을 수 있는 상황을 가정하여 제시한 것입니다. 경사가 없는 평지를 설정함으로써 중력의 영향이 아닌 오직 운동 에너지와 마찰의 관계에만 집중하게 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are pedalling (현재진행): be동사(are) + -ing(pedalling) 형태로 자전거 페달을 밟고 있는 현재의 동작을 강조한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">imagine<\/td><td class=\"m\">상상하다<\/td><\/tr><tr><td class=\"w\">pedal<\/td><td class=\"m\">페달(을 밟다)<\/td><\/tr><tr><td class=\"w\">level<\/td><td class=\"m\">수준, 정도<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>You stop <span class=\"grammar-hl\">pedalling<\/span>: no force is now acting<\/b><\/span><span class=\"ko\">당신은 페달을 밟는 것을 멈춘다: 이제 어떠한 힘도 작용하지 않는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to move<\/span> you forward.<\/b><\/span><span class=\"ko\">당신을 앞으로 나아가게 하기 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신은 페달을 밟는 것을 멈추고 당신을 앞으로 나아가게 하는 어떠한 힘도 이제 작용하지 않는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> no force is now acting to move you forward는 자전거를 전진시키던 동력원이 차단된 상태를 의미합니다. 이는 물체가 계속 움직이려 하는 관성과 이를 방해하는 외부 힘의 대결 구도를 만들기 위한 사전 단계입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">pedalling (동명사): 타동사 stop의 목적어로 쓰여 &#39;페달을 밟는 것&#39;이라는 행위(명사 역할)를 나타낸다.<\/div><div class=\"lec-gr-item\">is acting (현재진행): be동사(is) + -ing(acting) 형태로 현재 어떤 힘이 작용하고 있는 상태를 나타낸다.<\/div><div class=\"lec-gr-item\">to move (to부정사(부사적/목적)): &#39;이동시키기 위하여&#39;라는 목적의 의미로 쓰였으며, in order to move로 바꿔 쓸 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pedal<\/td><td class=\"m\">페달(을 밟다)<\/td><\/tr><tr><td class=\"w\">force<\/td><td class=\"m\">힘, 세력<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">What happens?<\/span><\/b><\/span><span class=\"ko\">무슨 일이 일어날까?<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러면 어떻게 될까?<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 제시한 동력 차단 상황에 대한 결과를 독자에게 질문함으로써, 자연스럽게 다음 문장에서 설명할 물리적 현상으로 시선을 유도하는 전환점 역할을 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">What happens? (의문문): 의문사 what이 주어 역할을 하며, 일반동사 happens가 이어지는 직접의문문 구조다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 4 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>You<\/b><\/span><span class=\"ko\">당신은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>gradually <span class=\"grammar-hl\">slow down<\/span>.<\/b><\/span><span class=\"ko\">서서히 느려진다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신은 서서히 느려진다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> gradually slow down은 동력이 사라졌을 때 나타나는 자연스러운 현상을 묘사합니다. 글쓴이는 이 현상을 통해 눈에 보이지 않지만 속도를 줄이게 만드는 &#39;어떤 힘&#39;이 존재함을 암시하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">slow down (관용표현): &#39;속도를 늦추다&#39;라는 의미의 구동사(phrasal verb)로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gradually<\/td><td class=\"m\">점차, 서서히<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">How could you slow down<\/span><\/b><\/span><span class=\"ko\">어떻게 속도를 줄일 수 있을까<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>more suddenly,<\/b><\/span><span class=\"ko\">더 갑자기<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in a shorter distance?<\/b><\/span><span class=\"ko\">더 짧은 거리 안에서?<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신은 더 짧은 거리 안에서 더 갑자기 속도를 줄이려면 어떻게 해야 할까?<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 자연스러운 감속 상태에서 나아가, 인위적이고 강한 힘을 주었을 때의 변화를 묻고 있습니다. 이는 마찰력의 크기와 효과를 극대화해서 설명하기 위한 논리적 단계입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">How could you slow down (의문문): &#39;의문사(How) + 조동사(could) + 주어(you) + 동사원형(slow down)&#39; 어순의 직접의문문 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">distance<\/td><td class=\"m\">거리<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>By <span class=\"grammar-hl\">putting<\/span> the brakes on.<\/b><\/span><span class=\"ko\">브레이크를 작동시킴으로써.<\/span><\/div><\/div><div class=\"lec-sent-ko\">브레이크를 작동시키면 된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> putting the brakes on은 감속을 유도하는 가장 확실하고 일상적인 도구를 예로 들어, 마찰력이 구체적으로 어떻게 발생하는지를 보여주기 위한 실전 예시입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">putting (동명사): 전치사 by의 목적어로 쓰여 &#39;놓는 것/거는 것&#39;이라는 행위(명사 역할)를 나타낸다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 7 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Because the brakes change your movement,<\/b><\/span><span class=\"ko\">브레이크가 당신의 움직임을 변화시키기 때문에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">making you slow down<\/span> more suddenly,<\/b><\/span><span class=\"ko\">당신을 더 갑자기 느려지게 만들면서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they must <span class=\"grammar-hl\">be exerting<\/span> a force<\/b><\/span><span class=\"ko\">그것들은 힘을 가하고 있어야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on the bicycle and you,<\/b><\/span><span class=\"ko\">자전거와 당신에게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as they grip and rub on the wheel-rims.<\/b><\/span><span class=\"ko\">그것들이 바퀴 테두리를 잡고 닿으면서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">브레이크는 당신의 움직임을 변화시켜 당신을 더 갑자기 느려지게 하기 때문에, 그것들이 바퀴 테두리를 잡고 닿으면서 자전거와 당신에게 힘을 가하고 있어야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> exerting a force는 브레이크라는 장치가 단순히 멈추는 기능만 하는 것이 아니라, 물리적으로 실재하는 &#39;힘&#39;을 가하고 있다는 과학적 사실을 강조합니다. 뉴턴의 운동 법칙에 따라 속도의 변화(감속)가 생기려면 반드시 외부의 힘이 있어야 함을 설명하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">making you slow down (분사구문): making이 앞 절의 내용에 이어지는 결과나 부수적 상황을 나타낸다. 원래 절로 변환하면 and they(=the brakes) make you slow down으로 쓸 수 있다.<\/div><div class=\"lec-gr-item\">making you slow down 5형식(SVOC) 구조: 사역동사 make + 목적어(you) + 목적격보어(slow down) 구조이며, 사역동사의 영향으로 목적격보어 자리에 원형부정사가 쓰였다.<\/div><div class=\"lec-gr-item\">be exerting (현재진행): 조동사 must 뒤에서 be + -ing(exerting) 형태로 쓰여 &#39;힘을 가하고 있음에 틀림없다&#39;는 진행 중인 동작에 대한 강한 추측을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">force<\/td><td class=\"m\">힘, 세력<\/td><\/tr><tr><td class=\"w\">rub<\/td><td class=\"m\">문지르다, 비비다<\/td><\/tr><tr><td class=\"w\">movement<\/td><td class=\"m\">움직임, 이동<\/td><\/tr><tr><td class=\"w\">exert<\/td><td class=\"m\">(힘을) 쓰다, 발휘하다<\/td><\/tr><tr><td class=\"w\">grip<\/td><td class=\"m\">꽉 쥐다, 움켜쥠<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This is the force <span class=\"grammar-hl\">called<\/span> friction,<\/b><\/span><span class=\"ko\">이것이 마찰력이라고 불리는 힘이며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> tends <span class=\"grammar-hl\">to slow down<\/span> <span class=\"grammar-hl\">moving<\/span> things<\/b><\/span><span class=\"ko\">이는 움직이는 물체를 느리게 하는 경향이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by <span class=\"grammar-hl\">acting<\/span><\/b><\/span><span class=\"ko\">작용함으로써<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the direction opposite to movement,<\/b><\/span><span class=\"ko\">움직임의 반대 방향으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that is backwards.<\/b><\/span><span class=\"ko\">즉 뒤쪽으로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이것이 마찰력이라고 불리는 힘이며, 그리고 그 힘은 움직임의 반대 방향, 즉 뒤쪽으로 작용함으로써 움직이는 물체를 느리게 하는 경향이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> acting in the direction opposite to movement는 마찰력의 가장 핵심적인 정의를 설명합니다. 물체가 가고자 하는 방향을 방해하며 뒤로 당기기 때문에 결국 멈추게 된다는 원리를 명시하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">called (과거분사(형용사)): called가 명사 force를 수식하여 &#39;...라고 불리는 힘&#39;이라는 의미를 나타낸다. force (which is) called friction의 축약된 구조로 볼 수 있다.<\/div><div class=\"lec-gr-item\">which (관계대명사): 주격 관계대명사 which가 선행사 friction(또는 the force called friction)을 부연 설명하는 계속적 용법으로 쓰였다.<\/div><div class=\"lec-gr-item\">to slow down (to부정사(명사적)): 동사 tends의 목적어로 쓰여 &#39;~하는 경향이 있다&#39;는 의미의 동사구 일부로 기능한다.<\/div><div class=\"lec-gr-item\">moving (현재분사(형용사)): moving이 명사 things를 앞에서 수식하여 &#39;움직이는 물체들&#39;이라는 상태를 나타낸다.<\/div><div class=\"lec-gr-item\">acting (동명사): 전치사 by의 목적어로 쓰여 &#39;작용함으로써&#39;라는 행위의 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">force<\/td><td class=\"m\">힘, 세력<\/td><\/tr><tr><td class=\"w\">friction<\/td><td class=\"m\">마찰<\/td><\/tr><tr><td class=\"w\">backward<\/td><td class=\"m\">뒤로, 거꾸로<\/td><\/tr><tr><td class=\"w\">movement<\/td><td class=\"m\">움직임, 이동<\/td><\/tr><tr><td class=\"w\">tend<\/td><td class=\"m\">~하는 경향이 있다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Even without the brakes on,<\/b><\/span><span class=\"ko\">심지어 브레이크를 작동시키지 않아도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>there are other friction forces<\/b><\/span><span class=\"ko\">다른 마찰력이 존재하며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">acting<\/span> on you and your bicycle,<\/b><\/span><span class=\"ko\">당신과 당신의 자전거에 작용하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> also slow you down.<\/b><\/span><span class=\"ko\">이것은 또한 당신을 느리게 한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">심지어 브레이크를 작동시키지 않아도 당신과 당신의 자전거에 작용하는 다른 마찰력이 존재하며, 이것은 또한 당신을 느리게 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 브레이크라는 특수한 상황을 넘어, 마찰력이 우리 주변 어디에나 존재하는 일반적인 물리 법칙임을 알려줍니다. other friction forces를 언급하며 논의의 범위를 확장하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">acting (현재분사(형용사)): acting이 명사구 other friction forces를 뒤에서 수식하며 &#39;작용하는 마찰력&#39;이라는 의미를 나타낸다. forces (which are) acting...의 축약 구조다.<\/div><div class=\"lec-gr-item\">which (관계대명사): 주격 관계대명사 which가 선행사 other friction forces를 수식하며, 주절과 콤마로 연결되어 부연 설명을 제공한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">force<\/td><td class=\"m\">힘, 세력<\/td><\/tr><tr><td class=\"w\">friction<\/td><td class=\"m\">마찰<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>One of these<\/b><\/span><span class=\"ko\">이들 중 하나는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is friction<\/b><\/span><span class=\"ko\">마찰이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the wheels <span class=\"grammar-hl\">rubbing<\/span> on the axles.<\/b><\/span><span class=\"ko\">축에 닿는 바퀴에서의.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이들 중 하나는 축에 닿는 바퀴의 마찰이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> wheels rubbing on the axles는 기계 내부에서 발생하는 마찰의 구체적인 예입니다. 눈에 보이지 않는 장치 안에서도 두 표면이 맞닿아 돌아갈 때 저항이 발생함을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">rubbing (현재분사(형용사)): rubbing이 명사 the wheels를 수식하여 &#39;마찰하는 바퀴&#39;라는 의미를 나타낸다. wheels (which are) rubbing...의 축약 구조로 볼 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">friction<\/td><td class=\"m\">마찰<\/td><\/tr><tr><td class=\"w\">rub<\/td><td class=\"m\">문지르다, 비비다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 11 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Another<\/b><\/span><span class=\"ko\">또 다른 하나는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is air resistance,<\/b><\/span><span class=\"ko\">공기 저항이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> you can feel,<\/b><\/span><span class=\"ko\">당신이 느낄 수 있는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">pushing<\/span> you backwards<\/b><\/span><span class=\"ko\">당신을 뒤쪽으로 미는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as you and the bicycle move forwards.<\/b><\/span><span class=\"ko\">당신과 자전거가 앞쪽으로 움직일 때.<\/span><\/div><\/div><div class=\"lec-sent-ko\">또 다른 하나는 당신과 자전거가 앞쪽으로 움직일 때 당신을 뒤쪽으로 미는 공기 저항으로 이는 당신이 느낄 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> air resistance는 고체와 고체의 접촉뿐만 아니라 공기와 같은 기체도 움직임을 방해하는 마찰력의 일종임을 설명합니다. pushing you backwards는 공기 저항이 작용하는 물리적인 힘의 방향을 시각적으로 묘사한 것입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">which (관계대명사): 목적격 관계대명사 which가 선행사 air resistance를 부연 설명하며, feel의 목적어 역할을 수행한다.<\/div><div class=\"lec-gr-item\">pushing (현재분사(형용사)): pushing이 선행사인 air resistance를 수식하여 &#39;뒤로 밀어붙이는 공기 저항&#39;의 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">resistance<\/td><td class=\"m\">저항, 반대<\/td><\/tr><tr><td class=\"w\">backward<\/td><td class=\"m\">뒤로, 거꾸로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 12 / 12<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When you apply these ideas<\/b><\/span><span class=\"ko\">당신이 이러한 개념을 적용할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to something around you,<\/b><\/span><span class=\"ko\">당신 주변에 있는 어떤 것에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>like a cart,<\/b><\/span><span class=\"ko\">카트와 같은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you can see<\/b><\/span><span class=\"ko\">당신은 알 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">what could be generating friction<\/span>:<\/b><\/span><span class=\"ko\">무엇이 마찰력을 발생시킬 수 있을지:<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>mainly the axles <span class=\"grammar-hl\">rubbing<\/span> on the body<\/b><\/span><span class=\"ko\">주로 본체에 닿는 축들을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as they rotate.<\/b><\/span><span class=\"ko\">그것들이 회전하면서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">카트와 같은 당신 주변에 있는 어떤 것에 이러한 개념을 적용하면, 주로 회전하면서 본체에 닿는 축들과 같이, 당신은 무엇이 마찰력을 발생시킬 수 있을지 알 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> generating friction은 자전거뿐만 아니라 바퀴가 달린 모든 물체에 동일한 물리적 원리가 적용됨을 시사합니다. 앞선 자전거 예시를 통해 얻은 통찰을 일반적인 사물로 확대 적용하며 글을 마무리합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">what could be generating friction (간접의문문): 의문사(what)가 주어 역할을 겸하며 &#39;의문사(+주어)+동사&#39; 어순으로 see의 목적어절을 이끈다.<\/div><div class=\"lec-gr-item\">be generating (현재진행): be동사(be) + -ing(generating) 형태로 &#39;생성하고 있는 중일 수 있다&#39;는 진행의 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">rubbing (현재분사(형용사)): rubbing이 명사 the axles를 수식하여 &#39;마찰하는 축&#39;의 의미를 나타낸다. axles (which are) rubbing...의 축약 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">friction<\/td><td class=\"m\">마찰<\/td><\/tr><tr><td class=\"w\">rub<\/td><td class=\"m\">문지르다, 비비다<\/td><\/tr><tr><td class=\"w\">apply<\/td><td class=\"m\">적용하다, 쓰다<\/td><\/tr><tr><td class=\"w\">generate<\/td><td class=\"m\">만들어 내다, 발생시키다<\/td><\/tr><tr><td class=\"w\">mainly<\/td><td class=\"m\">주로<\/td><\/tr><tr><td class=\"w\">rotate<\/td><td class=\"m\">돌다, 회전하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>평지에서 자전거 페달을 멈추면 속도가 줄어드는데, 이는 운동 방향과 반대로 작용하는 힘인 마찰력 때문이다.<\/li><li>브레이크는 바퀴 테를 압박하여 강한 마찰력을 발생시켜 자전거를 더 빨리 멈추게 한다.<\/li><li>인위적인 브레이크 외에도 공기 저항이나 부품 간의 쓸림 등 자연적인 마찰력이 항상 작용한다.<\/li><li>이러한 마찰의 원리는 자전거뿐만 아니라 수레 등 바퀴가 달린 모든 이동 수단에 공통으로 적용되는 물리 법칙이다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Friction functions as a force exerted in the opposite direction of movement so that moving objects eventually slow down or stop.<\/div>\n              <div class=\"lec-final-sum-ko\">마찰력은 운동의 반대 방향으로 가해지는 힘으로 작용하여 움직이는 물체가 결국 느려지거나 멈추게 한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./37_audio/1.mp3","hl":null}],[{"audio":"./37_audio/2.mp3","hl":null}],[{"audio":"./37_audio/3.mp3","hl":null},{"audio":"./37_audio/4.mp3","hl":"stage-0"},{"audio":"./37_audio/5.mp3","hl":"stage-1"},{"au 림포스(연합기출)고1 2026년 16강 01번","titleEn":"Friction: The Hidden Force That Slows Down Movement","titleKo":"마찰력: 움직임을 늦추는 숨겨진 힘","imageUrl":"__enpImg__","stages":[{"label":"01자전거 운동의 변화","items":["평지에서 자전거 페달을 밟는 것을 멈추면 속도가 서서히 줄어들게 된다.","전진하는 힘의 중단: 더 이상 나아가는 힘이 작용하지 않음","결과: 점진적인 감속 (slow down) 발생","핵심 키워드: 수평 도로 (level road)"]},{"label":"02브레이크의 물리적 작용","items":["브레이크를 사용하면 바퀴에 직접적인 힘을 가해 더 짧은 거리에서 멈출 수 있다.","바퀴 림(wheel-rims)을 잡고 문지르는 방식","작용: 물리적 힘(force)을 가해 움직임에 급격한 변화를 줌"]},{"label":"03마찰력의 정의와 방향","items":["브레이크가 만드는 힘은 움직임을 방해하는 마찰력의 원리를 보여준다.","정의: 움직이는 물체를 느리게 만드는 마찰력 (friction)","방향: 운동 방향과 반대 방향 (opposite direction)인 뒤쪽으로 작용"]},{"label":"04보이지 않는 마찰 요인들","items":["브레이크를 잡지 않더라도 운동을 방해하는 다양한 마찰력이 존재한다.","차축(axles)과 바퀴가 문지르며 발생하는 마찰","공기 저항 (air resistance): 전진할 때 몸을 뒤로 미는 힘"]},{"label":"05원리의 일반적 적용","items":["마찰력의 원리는 자전거뿐만 아니라 수레와 같은 주변 사물에도 공통적으로 적용된다.","회전하는 부품 사이의 접촉이 저항을 생성함","핵심 키워드: 마찰의 발생 (generating friction)"]}],"bkg":"우리가 움직이는 물체를 멈추게 하려면 반드시 외부의 힘이 필요한데, 이때 물체의 운동을 방해하는 힘을 마찰력(Friction)이라고 합니다. 마찰력은 두 물체의 표면이 서로 맞닿아 문질러질 때 발생하며, 항상 운동 방향의 반대 방향으로 작용하여 물체의 속도를 서서히 줄이거나 멈추게 만드는 역할을 합니다. 지문 속 자전거 사례처럼 바퀴축 부품끼리 쓸리는 물리적 접촉뿐만 아니라, 눈에 보이지 않는 공기 입자들이 우리 몸을 뒤로 밀어내는 공기 저항(Air Resistance) 또한 운동을 방해하는 마찰력의 일종입니다. 마치 매끄러운 빙판길보다 거친 아스팔트 위에서 운동화 바닥과 지면 사이의 저항이 커져 금방 멈출 수 있는 것과 같은 원리이지요. 모든 움직임에는 에너지의 흐름을 억제하는 보이지 않는 저항의 힘이 늘 상호작용하고 있다는 물리적 배경을 염두에 두시면 글의 내용을 훨씬 쉽게 이해하실 수 있습니다.","ttsText":"우리가 움직이는 물체를 멈추게 하려면 반드시 외부의 힘이 필요한데, 이때 물체의 운동을 방해하는 힘을 마찰력(Friction)이라고 합니다. 마찰력은 두 물체의 표면이 서로 맞닿아 문질러질 때 발생하며, 항상 운동 방향의 반대 방향으로 작용하여 물체의 속도를 서서히 줄이거나 멈추게 만드는 역할을 합니다. 지문 속 자전거 사례처럼 바퀴축 부품끼리 쓸리는 물리적 접촉뿐만 아니라, 눈에 보이지 않는 공기 입자들이 우리 몸을 뒤로 밀어내는 공기 저항(Air Resistance) 또한 운동을 방해하는 마찰력의 일종입니다. 마치 매끄러운 빙판길보다 거친 아스팔트 위에서 운동화 바닥과 지면 사이의 저항이 커져 금방 멈출 수 있는 것과 같은 원리이지요. 모든 움직임에는 에너지의 흐름을 억제하는 보이지 않는 저항의 힘이 늘 상호작용하고 있다는 물리적 배경을 염두에 두시면 글의 내용을 훨씬 쉽게 이해하실 수 있습니다.","__passage":"EBS올림포스(연합기출)고1 2026년 16강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 37번","__script":"자, 오늘 우리가 함께 공부할 지문은 'E ms.<\/b>","korean":"그것들이 바퀴 테두리를 잡고 닿으면서."}],"meaning":"exerting a force는 브레이크라는 장치가 단순히 멈추는 기능만 하는 것이 아니라, 물리적으로 실재하는 '힘'을 가하고 있다는 과학적 사실을 강조합니다. 뉴턴의 운동 법칙에 따라 속도의 변화(감속)가 생기려면 반드시 외부의 힘이 있어야 함을 설명하고 있습니다.","grammar":"making you slow down (분사구문): making이 앞 절의 내용에 이어지는 결과나 부수적 상황을 나타낸다. 원래 절로 변환하면 and they(=the brakes) make you slow down으로 쓸 수 있다. making you slow down 5형식(SVOC) 구조: 사역동사 make + 목적어(you) + 목적격보어(slow down) 구조이며, 사역동사의 영향으로 목적격보어 자리에 원형부정사가 쓰였다. be exerting (현재진행): 조동사 must 뒤에서 be + -ing(exerting) 형태로 쓰여 '힘을 가하고 있음에 틀림없다'는 진행 중인 동작에 대한 강한 추측을 나타낸다.","grammarItems":["making you slow down (분사구문): making이 앞 절의 내용에 이어지는 결과나 부수적 상황을 나타낸다. 원래 절로 변환하면 and they(=the brakes) make you slow down으로 쓸 수 있다.","making you slow down 5형식(SVOC) 구조: 사역동사 make + 목적어(you) + 목적격보어(slow down) 구조이며, 사역동사의 영향으로 목적격보어 자리에 원형부정사가 쓰였다.","be exerting (현재진행): 조동사 must 뒤에서 be + -ing(exerting) 형태로 쓰여 '힘을 가하고 있음에 틀림없다'는 진행 중인 동작에 대한 강한 추측을 나타낸다."],"vocab":[{"word":"force","meaning":"힘, 세력"},{"word":"rub","meaning":"문지르다, 비비다"},{"word":"movement","meaning":"움직임, 이동"},{"word":"exert","meaning":"(힘을) 쓰다, 발휘하다"},{"word":"grip","meaning":"꽉 쥐다, 움켜쥠"}],"ttsText":"브레이크는 당신의 움직임을 변화시켜 당신을 더 갑자기 느려지게 하기 때문에, 그것들이 바퀴 테두리를 잡고 닿으면서 자전거와 당신에게 힘을 가하고 있어야 한다.. exerting a force는 브레이크라는 장치가 단순히 멈추는 기능만 하는 것이 아니라, 물리적으로 실재하는 '힘'을 가하고 있다는 과학적 사실을 강조합니다. 뉴턴의 운동 법칙에 따라 속도의 변화(감속)가 생기려면 반드시 외부의 힘이 있어야 함을 설명하고 있습니다.. making you slow down (분사구문): making이 앞 절의 내용에 이어지는 결과나 부수적 상황을 나타낸다. 원래 절로 변환하면 and they(=the brakes) make you slow down으로 쓸 수 있다. making you slow down 5형식(SVOC) 구조: 사역동사 make + 목적어(you) + 목적격보어(slow down) 구조이며, 사역동사의 영향으로 목적격보어 자리에 원형부정사가 쓰였다. be exerting (현재진행): 조동사 must 뒤에서 be + -ing(exerting) 형태로 쓰여 '힘을 가하고 있음에 틀림없다'는 진행 중인 동작에 대한 강한 추측을 나타낸다.","__passage":"EBS올림포스(연합기출)고1 2026년 16강 01번","passageName":"EBS올림포스(연합기출)고1 2026년 16강 01번","__sourcePassage":"모의고사 / 고1 / 2025년 / 09월 / 37번"},{"kind":"sentence","idx":8,"total":12,"english":"This is the force called friction, which tends to slow down
