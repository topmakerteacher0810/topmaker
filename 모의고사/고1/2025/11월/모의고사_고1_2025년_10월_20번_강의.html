YfjJwcEdwR+IBxxtJA46nkVcVa3fW99N7d7dLfLUHbTe9rJ9ttdNdHrfW9lpuf/2Q==\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">Nurturing Connections: The Power of Consistent and Thoughtful Follow-up<small>관계 가꾸기: 일관되고 세심한 후속 소통의 힘<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">인간관계에서 신뢰를 유지하는 과정은 사회심리학에서 말하는 사회적 자본(Social Capital)을 축적하는 것과 같은데, 이는 마치 정원에 정기적으로 물을 주어 식물을 키우는 과정과 비슷합니다. 사회학자 마크 그라노베터는 약한 유대관계의 힘(The Strength of Weak Ties)이라는 이론을 통해, 깊은 사이가 아니더라도 꾸준히 안부를 주고받는 관계가 때로는 새로운 기회나 정보를 제공하는 더 중요한 통로가 될 수 있음을 강조했습니다. 특히 심리학의 호혜성(Reciprocity) 원리에 따르면, 상대에게 유용한 정보를 먼저 가볍게 공유하는 행동은 큰 부담 없이도 심리적 유대감을 강화하고 긍정적인 답례를 이끌어내는 촉매제가 됩니다. 따라서 지속적인 관계 유지(Relationship Maintenance)를 위한 소소한 연락은 단순한 안부 인사를 넘어, 서로의 연결망을 활성화하고 신뢰라는 보이지 않는 자산을 꾸준히 관리하는 핵심적인 소통 전략이라고 볼 수 있습니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01관계 유지의 필수 요소<\/div><ul><li>장기적인 인간관계를 유지하는 데 있어 의사소통은 가장 핵심적인 측면이다.<\/li><li>관계 지속(sustaining long-term relationships)의 관건<\/li><li>소통(communication)의 중요성 강조<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02관계 정체의 원인<\/div><ul><li>처음 관계를 맺은 후 적절한 후속 조치가 없으면 관계가 소원해지기 쉽다.<\/li><li>후속 조치(follow-up)의 부족<\/li><li>관계가 정체됨(get stuck)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03의식적인 소통의 필요성<\/div><ul><li>관계를 활기차게 유지하기 위해서는 연락을 이어가려는 의식적인 노력이 필요하다.<\/li><li>의식적인 노력(conscious effort)<\/li><li>연락 유지(stay in touch)의 중요성<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04바람직한 소통 방식<\/div><ul><li>단순한 요청이나 소식 전달보다는 우호적이고 일관된 흐름의 소통을 유지해야 한다.<\/li><li>일관된 소통 라인(consistent line of communication) 유지<\/li><li>단순한 안부 확인(check in)의 가치<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05구체적인 실천 사례<\/div><ul><li>상대방이 관심 있어 할 만한 기사나 유용한 자료를 공유하는 것이 좋은 방법이다.<\/li><li>유용한 자료(article or resource) 공유<\/li><li>오랜만의 연락에도 적용 가능한 전략<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-5\"><div class=\"lec-stage-head\">06소통의 심리적 효과<\/div><ul><li>작은 공유는 상대방을 생각하고 관계에 공을 들이고 있다는 증거가 되어 관계를 강화한다.<\/li><li>관계 강화(reinforcing your relationship)<\/li><li>관계 유지에 대한 투자(invested)와 관심 표현<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aspect<\/td><td class=\"m\">측면, 국면<\/td><\/tr><tr><td class=\"w\">sustain<\/td><td class=\"m\">지속하다, 지탱하다<\/td><\/tr><tr><td class=\"w\">term<\/td><td class=\"m\">용어<\/td><\/tr><tr><td class=\"w\">relationship<\/td><td class=\"m\">관계<\/td><\/tr><tr><td class=\"w\">stick<\/td><td class=\"m\">막대기, 나뭇가지<\/td><\/tr><tr><td class=\"w\">due<\/td><td class=\"m\">(due to) ~ 때문에<\/td><\/tr><tr><td class=\"w\">lack<\/td><td class=\"m\">부족, 결핍<\/td><\/tr><tr><td class=\"w\">follow<\/td><td class=\"m\">따라가다, 따르다<\/td><\/tr><tr><td class=\"w\">connection<\/td><td class=\"m\">연결, 관계<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conscious<\/td><td class=\"m\">의도적인, 의식적인<\/td><\/tr><tr><td class=\"w\">mean<\/td><td class=\"m\">의미하다, 뜻하다<\/td><\/tr><tr><td class=\"w\">constantly<\/td><td class=\"m\">끊임없이, 계속<\/td><\/tr><tr><td class=\"w\">request<\/td><td class=\"m\">요청, 부탁<\/td><\/tr><tr><td class=\"w\">maintain<\/td><td class=\"m\">유지하다, 지속하다<\/td><\/tr><tr><td class=\"w\">consistent<\/td><td class=\"m\">한결같은, 일관된<\/td><\/tr><tr><td class=\"w\">share<\/td><td class=\"m\">몫, 지분, 점유율<\/td><\/tr><tr><td class=\"w\">value<\/td><td class=\"m\">가치<\/td><\/tr><tr><td class=\"w\">reinforce<\/td><td class=\"m\">강화하다, 굳히다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>One of the most important aspects<\/b><\/span><span class=\"ko\">가장 중요한 측면 중 하나는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of <span class=\"grammar-hl\">sustaining<\/span> long-term relationships<\/b><\/span><span class=\"ko\">장기적인 관계를 유지하는 것에 있어서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is communication.<\/b><\/span><span class=\"ko\">소통이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">장기적인 관계를 유지하는 데 가장 중요한 측면 중 하나는 소통이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글 전체의 주제를 제시하는 문장입니다. 인간관계가 단발성으로 끝나지 않고 오래 지속되려면 서로 간의 대화와 소통이 필수적인 토대가 됨을 강조하며 논의를 시작합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">sustaining (동명사): 전치사 of의 목적어로 쓰여 &#39;유지하는 것&#39;이라는 행위의 개념을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aspect<\/td><td class=\"m\">측면, 국면<\/td><\/tr><tr><td class=\"w\">sustain<\/td><td class=\"m\">지속하다, 지탱하다<\/td><\/tr><tr><td class=\"w\">term<\/td><td class=\"m\">용어<\/td><\/tr><tr><td class=\"w\">relationship<\/td><td class=\"m\">관계<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">It’s easy<\/span><\/b><\/span><span class=\"ko\">쉽다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to connect<\/span> with someone<\/b><\/span><span class=\"ko\">누군가와 연결되고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and then <span class=\"grammar-hl\">let the relationship get stuck<\/span><\/b><\/span><span class=\"ko\">그러고 나서 그 관계가 정체되게 하는 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>due to a lack of follow-up.<\/b><\/span><span class=\"ko\">추후 연락의 부족 때문에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">누군가와 친해지고 나서 추후 연락 부족으로 인해 그 관계가 정체되도록 내버려 두기 쉽다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 소통의 중요성을 반대 상황을 통해 뒷받침합니다. get stuck은 처음의 호감이나 만남 이후 더 이상 친밀해지지 못하고 어색한 지인 상태로 머물러 버리는 정체 현상을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It’s easy to connect (가주어): 진주어: 형식적인 주어 It을 앞에 세우고, 실제 주어인 to부정사구(to connect with someone)를 뒤로 보낸 구조다.<\/div><div class=\"lec-gr-item\">to connect (to부정사(명사적)): 가주어 It의 실제 주어(진주어) 자리에 쓰였다.<\/div><div class=\"lec-gr-item\">let the relationship get stuck 5형식(SVOC) 구조: 사역동사 let + 목적어(the relationship) + 목적격보어(동사원형 get) 구조다. get 뒤에는 다시 과거분사 stuck이 보어로 와서 &#39;관계가 정체된 상태가 되게 하다&#39;라는 의미를 형성한다.<\/div><div class=\"lec-gr-item\">stuck (과거분사(형용사)): get의 보어 역할을 하며, 관계(relationship)가 정체된 상태임을 설명한다. stick은 타동사이나 뒤에 목적어가 없어 수동의 의미를 갖는 과거분사로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relationship<\/td><td class=\"m\">관계<\/td><\/tr><tr><td class=\"w\">due<\/td><td class=\"m\">(due to) ~ 때문에<\/td><\/tr><tr><td class=\"w\">lack<\/td><td class=\"m\">부족, 결핍<\/td><\/tr><tr><td class=\"w\">follow<\/td><td class=\"m\">따라가다, 따르다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">To keep the connection alive<\/span>,<\/b><\/span><span class=\"ko\">관계를 활발하게 유지하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>make a conscious <span class=\"grammar-hl\">effort<\/span><\/b><\/span><span class=\"ko\">의식적인 노력을 기울여라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to stay<\/span> in touch.<\/b><\/span><span class=\"ko\">연락을 유지하려는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">관계를 유지하기 위해, 연락하고 지내려는 의식적인 노력을 기울여라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 언급한 &#39;정체&#39;라는 문제를 해결하기 위한 구체적인 행동 지침을 제시합니다. make a conscious effort는 관계가 저절로 깊어지길 기다리기보다 본인이 먼저 능동적이고 의도적으로 행동해야 한다는 점을 일깨워 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">To keep the connection alive (to부정사(부사적): 목적): &#39;~하기 위해서&#39;라는 의도를 나타내며, in order to keep으로 바꿔 쓸 수 있다.<\/div><div class=\"lec-gr-item\">keep the connection alive 5형식(SVOC) 구조: 동사 keep + 목적어(the connection) + 목적격보어(형용사 alive) 구조로, &#39;목적어를 형용사한 상태로 유지하다&#39;라는 의미다.<\/div><div class=\"lec-gr-item\">effort to stay (to부정사(형용사적)): 명사 effort를 수식하며 &#39;~하려는 노력&#39;으로 해석된다. effort의 구체적인 내용을 한정하는 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">connection<\/td><td class=\"m\">연결, 관계<\/td><\/tr><tr><td class=\"w\">conscious<\/td><td class=\"m\">의도적인, 의식적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This doesn’t mean<\/b><\/span><span class=\"ko\">이것은 의미하지 않는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>constantly <span class=\"grammar-hl\">reaching out<\/span><\/b><\/span><span class=\"ko\">끊임없이 연락하는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with requests or updates<\/b><\/span><span class=\"ko\">요청이나 최신 소식을 가지고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but rather <span class=\"grammar-hl\">maintaining<\/span><\/b><\/span><span class=\"ko\">오히려 유지하는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a friendly and consistent line of communication.<\/b><\/span><span class=\"ko\">친근하고 일관된 소통의 끈을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이는 요청이나 최근 소식을 가지고 끊임없이 연락을 취하는 것이 아니라 오히려 친근하고 일관된 소통의 끈을 유지하는 것을 의미한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 &#39;의식적인 노력&#39;이 어떤 성격이어야 하는지 상세히 규정합니다. maintaining a friendly and consistent line of communication은 무언가 용건이 있거나 큰일이 있을 때만 연락하는 것이 아니라, 평소에 가볍고 친근한 대화를 정기적으로 나누어 심리적 거리감을 좁히는 것을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">reaching out (동명사): 동사 mean의 목적어 자리에 쓰여 &#39;~하는 것&#39;이라는 명사적 역할을 한다.<\/div><div class=\"lec-gr-item\">maintaining (동명사): &#39;not A but rather B&#39; 구조에서 앞의 reaching out과 병렬을 이루며 동사 mean의 목적어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mean<\/td><td class=\"m\">의미하다, 뜻하다<\/td><\/tr><tr><td class=\"w\">constantly<\/td><td class=\"m\">끊임없이, 계속<\/td><\/tr><tr><td class=\"w\">request<\/td><td class=\"m\">요청, 부탁<\/td><\/tr><tr><td class=\"w\">maintain<\/td><td class=\"m\">유지하다, 지속하다<\/td><\/tr><tr><td class=\"w\">consistent<\/td><td class=\"m\">한결같은, 일관된<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>A simple <span class=\"grammar-hl\">message<\/span><\/b><\/span><span class=\"ko\">간단한 메시지는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to check in or share<\/span> something of value<\/b><\/span><span class=\"ko\">안부를 확인하거나 가치 있는 무언가를 공유하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can go a long way<\/b><\/span><span class=\"ko\">큰 도움이 될 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in <span class=\"grammar-hl\">reinforcing<\/span> your relationship.<\/b><\/span><span class=\"ko\">여러분의 관계를 강화하는 데.<\/span><\/div><\/div><div class=\"lec-sent-ko\">안부를 확인하거나 가치 있는 무언가를 공유하는 간단한 메시지가 여러분의 관계를 강화하는 데 도움이 될 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 구체적으로 어떤 내용의 소통이 효과적인지 설명합니다. go a long way는 아주 작은 정성이라도 그것이 상대방에게 전달되었을 때 관계를 탄탄하게 만드는 데 예상보다 훨씬 큰 긍정적 효과를 발휘한다는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">message to check in or share (to부정사(형용사적)): 명사 message를 뒤에서 수식하여 &#39;~할 메시지&#39;라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">reinforcing (동명사): 전치사 in의 목적어로 쓰여 &#39;~하는 데 있어서&#39;라는 의미의 명사적 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relationship<\/td><td class=\"m\">관계<\/td><\/tr><tr><td class=\"w\">share<\/td><td class=\"m\">몫, 지분, 점유율<\/td><\/tr><tr><td class=\"w\">value<\/td><td class=\"m\">가치<\/td><\/tr><tr><td class=\"w\">reinforce<\/td><td class=\"m\">강화하다, 굳히다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>For example,<\/b><\/span><span class=\"ko\">예를 들어,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>if you come across an <span class=\"grammar-hl\">article or resource<\/span><\/b><\/span><span class=\"ko\">만약 여러분이 기사나 자료를 우연히 발견하면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that you think might interest<\/span> a connection,<\/b><\/span><span class=\"ko\">여러분과 관계가 있는 사람의 흥미를 끌 수 있다고 여기는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>share it with them,<\/b><\/span><span class=\"ko\">그것을 그들과 공유하라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>even if you haven’t spoken in a while.<\/b><\/span><span class=\"ko\">비록 여러분이 한동안 이야기하지 않았을지라도.<\/span><\/div><\/div><div class=\"lec-sent-ko\">예를 들어, 여러분이 자신과 관계가 있는 사람의 흥미를 끌 수 있다고 여기는 기사나 자료를 우연히 발견하면, 한동안 이야기하지 않았다고 할지라도 그들과 그것을 공유하라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 &#39;가치 있는 공유&#39;에 대한 실질적인 예시를 제공합니다. even if you haven’t spoken in a while — 글쓴이는 오랫동안 대화가 없었더라도 상대방이 좋아할 만한 정보를 매개체 삼아 먼저 연락하는 것이 관계 회복의 자연스러운 계기가 된다고 조언합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">article or resource that you think might interest (관계대명사): 선행사(an article or resource)를 수식하며, 관계대명사절 내부에서 might interest의 주어 역할을 하는 주격 관계대명사다. you think는 관계대명사와 동사 사이에 삽입된 절이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">connection<\/td><td class=\"m\">연결, 관계<\/td><\/tr><tr><td class=\"w\">share<\/td><td class=\"m\">몫, 지분, 점유율<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This shows<\/b><\/span><span class=\"ko\">이것은 보여 준다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that you’re thinking of them<\/b><\/span><span class=\"ko\">여러분이 그들을 생각하고 있다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">are invested<\/span><\/b><\/span><span class=\"ko\">그리고 노력을 쏟고 있다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in <span class=\"grammar-hl\">maintaining<\/span> the relationship.<\/b><\/span><span class=\"ko\">그 관계를 유지하는 데.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이는 여러분이 그들을 생각하고 있으며 관계를 지속하는 데 노력을 쏟고 있다는 것을 보여 준다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 공유 행위가 상대방에게 주는 심리적 임팩트를 설명하며 글을 마무리합니다. invested in maintaining the relationship은 상대방과의 인연을 소중히 여기며, 그 관계를 지키기 위해 기꺼이 자신의 시간과 에너지를 쓰고 있다는 진심 어린 신호를 상대에게 전달한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are invested (수동태): be동사(are)+p.p.(invested) 구조. invest는 타동사인데 뒤에 목적어가 없어서 수동구조 are invested 형태로 쓴다. 기본구조: invest A in B (A를 B에 투자하다/쏟다)<\/div><div class=\"lec-gr-item\">maintaining (동명사): 전치사 in의 목적어로 쓰여 &#39;유지하는 것&#39;이라는 명사적 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relationship<\/td><td class=\"m\">관계<\/td><\/tr><tr><td class=\"w\">maintain<\/td><td class=\"m\">유지하다, 지속하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>장기적인 인간관계를 유지하는 핵심 비결은 지속적인 의사소통이다.<\/li><li>관계 형성 후 후속 노력이 없으면 관계는 쉽게 정체되고 소원해진다.<\/li><li>관계를 활성화하려면 평소에 꾸준히 연락하려는 의식적인 노력이 필요하다.<\/li><li>거창한 요구나 소식 전달보다는 가벼운 안부나 유용한 정보를 공유하는 것이 효과적이다.<\/li><li>이러한 작은 배려는 상대방에게 내가 이 관계를 소중히 여긴다는 확신을 심어준다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Making a conscious effort to maintain consistent communication is essential for preventing relationships from stalling and reinforcing long-term bonds.<\/div>\n              <div class=\"lec-final-sum-ko\">관계가 정체되는 것을 방지하고 장기적인 유대감을 강화하기 위해 일관된 소통을 유지하려는 의식적인 노력이 필수적이다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_20번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_20번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_20번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_20번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_20번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_20번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_20번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2025년_10월_20번_강의_audio/8.mp3","hl":"stage-4"},{"audio":"./모의고사_고1_2025년_10월_20번_강의_audio/9.mp3","hl":"stage-5"}],[{"audio":"./모의고사_고1_2025년_10월_20번_강의_audio/10.mp3","hl":null}],[{ ms":["처음 관계를 맺은 후 적절한 후속 조치가 없으면 관계가 소원해지기 쉽다.","후속 조치(follow-up)의 부족","관계가 정체됨(get stuck)"]},{"label":"03의식적인 소통의 필요성","items":["관계를 활기차게 유지하기 위해서는 연락을 이어가려는 의식적인 노력이 필요하다.","의식적인 노력(conscious effort)","연락 유지(stay in touch)의 중요성"]},{"label":"04바람직한 소통 방식","items":["단순한 요청이나 소식 전달보다는 우호적이고 일관된 흐름의 소통을 유지해야 한다.","일관된 소통 라인(consistent line of communication) 유지","단순한 안부 확인(check in)의 가치"]},{"label":"05구체적인 실천 사례","items":["상대방이 관심 있어 할 만한 기사나 유용한 자료를 공유하는 것이 좋은 방법이다.","유용한 자료(article or resource) 공유","오랜만의 연락에도 적용 가능한 전략"]},{"label":"06소통의 심리적 효과","items":["작은 공유는 상대방을 생각하고 관계에 공을 들이고 있다는 증거가 되어 관계를 강화한다.","관계 강화(reinforcing your relationship)","관계 유지에 대한 투자(invested)와 관심 표현"]}],"bkg":"인간관계에서 신뢰를 유지하는 과정은 사회심리학에서 말하는 사회적 자본(Social Capital)을 축적하는 것과 같은데, 이는 마치 정원에 정기적으로 물을 주어 식물을 키우는 과정과 비슷합니다. 사회학자 마크 그라노베터는 약한 유대관계의 힘(The Strength of Weak Ties)이라는 이론을 통해, 깊은 사이가 아니더라도 꾸준히 안부를 주고받는 관계가 때로는 새로운 기회나 정보를 제공하는 더 중요한 통로가 될 수 있음을 강조했습니다. 특히 심리학의 호혜성(Reciprocity) 원리에 따르면, 상대에게 유용한 정보를 먼저 가볍게 공유하는 행동은 큰 부담 없이도 심리적 유대감을 강화하고 긍정적인 답례를 이끌어내는 촉매제가 됩니다. 따라서 지속적인 관계 유지(Relationship Maintenance)를 위한 소소한 연락은 단순한 안부 인사를 넘어, 서로의 연결망을 활성화하고 신뢰라는 보이지 않는 자산을 꾸준히 관리하는 핵심적인 소통 전략이라고 볼 수 있습니다.","ttsText":"인간관계에서 신뢰를 유지하는 과정은 사회심리학에서 말하는 사회적 자본(Social Capital)을 축적하는 것과 같은데, 이는 마치 정원에 정기적으로 물을 주어 식물을 키우는 과정과 비슷합니다. 사회학자 마크 그라노베터는 약한 유대관계의 힘(The Strength of Weak Ties)이라는 이론을 통해, 깊은 사이가 아니더라도 꾸준히 안부를 주고받는 관계가 때로는 새로운 기회나 정보를 제공하는 더 중요한 통로가 될 수 있음을 강조했습니다. 특히 심리학의 호혜성(Reciprocity) 원리에 따르면, 상대에게 유용한 정보를 먼저 가볍게 공유하는 행동은 큰 부담 없이도 심리적 유대감을 강화하고 긍정적인 답례를 이끌어내는 촉매제가 됩니다. 따라서 지속적인 관계 유지(Relationship Maintenance)를 위한 소소한 연락은 단순한 안부 인사를 넘어, 서로의 연결망을 활성화하고 신뢰라는 보이지 않는 자산을 꾸준히 관리하는 핵심적인 소통 전략이라고 볼 수 있습니다.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 20번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 20번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고1 / 2025년 / 10월 / 20번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고1 / 2025년 / 10월 / 20번","titleEn":"Nurturing Connections: T     let gesture = null;
    const zoomed = () => window.visualViewport && window.visualViewport.scale > 1.01;
    const selected = () => { const s = window.getSelection(); return s && !s.isCollapsed; };
    const interactive = el => el && el.closest('a,button,input,textarea,select,video,audio,canvas,[contenteditable="true"],[role="slider"]');
    const scrollsHorizontally = target => {
      for (let el = target; el && root.contains(el); el = el.parentElement) {
        if (el.scrollWidth > el.clientWidth + 2 && /^(auto|scroll)$/.test(getComputedStyle(el).overflowX)) return true;
        if (el === root) break;
      }
      return false;
    };
    root.addEventListener('touchstart', e => {
      gesture = null;
      if (e.touches.length !== 1 || zoomed() || selected() || interactive(e.target) || scrollsHorizontally(e.target)) return;
      const t = e.touches[0];
      // 화면 가장자리는 휴대폰 브라우저의 뒤로/앞으로 제스처에 맡긴다.
      if (t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
      gesture = { id: t.identifier, x: t.clientX, y: t.clientY, time: Date.now(), page: pageIndex(), horizontal: false };
    }, { passive: true });
    root.addEventListener('touchmove', e => {
      if (!gesture) return;
      if (e.touches.length !== 1 || zoomed() || selected()) { gesture = null; return; }
