거래 여부를 결정하곤 합니다. 마치 우리가 식재료를 살 때 친환경 인증 마크를 확인하듯이, 이들은 금융 기관이 고객의 돈을 반윤리적인 산업에 투자하지 않는 윤리적 금융 (Ethical Banking)을 실천하는지 꼼꼼히 따져봅니다. 특히 모든 정보가 투명하게 공개되기를 기대하는 투명성 (Transparency)에 대한 높은 기준은, 금융 기관이 복잡한 수수료 체계나 데이터 관리 방식을 정직하게 공개해야 한다는 사회적 요구로 이어지고 있습니다. 결국 Z세대에게 금융이란 단순한 자산 증식 수단을 넘어, 자신의 정체성을 증명하고 사회를 긍정적으로 변화시키는 가치 중심적 투자 (Values-driven Investment)의 연장선이라고 할 수 있습니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01가치 중심의 금융 선택<\/div><ul><li>Z세대는 금융 의사결정에서 기술적 편의성보다 개인의 신념과 가치를 중시한다.<\/li><li>편의성(convenience)과 기술을 넘어서는 핵심 동기<\/li><li>자신의 가치관(personal beliefs)과 일치하는 금융 기관 선호<\/li><li>핵심 키워드: 가치 중심적(values-driven)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02투명성에 대한 높은 기대<\/div><ul><li>대기업에 회의적인 Z세대는 금융 기관의 투명성과 책임감을 필수 조건으로 여긴다.<\/li><li>정보의 자유로운 접근과 투명성(transparency) 요구<\/li><li>수수료, 약관 및 고객 데이터(customers’ data) 관리 방식의 명확한 공개<\/li><li>핵심 키워드: 책임감(accountability)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03윤리적 금융 관행의 부상<\/div><ul><li>환경과 사회 정의 등 금융 결정이 미치는 윤리적 영향력을 중요하게 고려한다.<\/li><li>환경(environment)과 사회 정의(social justice)에 대한 높은 관심<\/li><li>자신의 돈이 해로운 관행에 사용되지 않기를 희망<\/li><li>핵심 키워드: 윤리적 관행(ethical practices)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04지속 가능한 투자의 유인<\/div><ul><li>사회적 책임을 다하고 지속 가능성을 추구하는 은행이 Z세대의 선택을 받는다.<\/li><li>지속 가능한 투자(sustainable investing) 기회 제공의 중요성<\/li><li>사회적 책임(socially responsible)을 다하는 기업 지원<\/li><li>핵심 키워드: Z세대의 관심(Gen Z’s attention)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">convenience<\/td><td class=\"m\">편의, 편리<\/td><\/tr><tr><td class=\"w\">crucial<\/td><td class=\"m\">매우 중요한<\/td><\/tr><tr><td class=\"w\">factor<\/td><td class=\"m\">요인, 요소<\/td><\/tr><tr><td class=\"w\">drive<\/td><td class=\"m\">운전하다<\/td><\/tr><tr><td class=\"w\">financial<\/td><td class=\"m\">재정적인, 금전적인<\/td><\/tr><tr><td class=\"w\">generation<\/td><td class=\"m\">세대<\/td><\/tr><tr><td class=\"w\">value<\/td><td class=\"m\">가치 있게 여기다, 소중히 하다<\/td><\/tr><tr><td class=\"w\">bank<\/td><td class=\"m\">은행<\/td><\/tr><tr><td class=\"w\">institution<\/td><td class=\"m\">기관, 단체<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">match<\/td><td class=\"m\">일치하다, 어울리다<\/td><\/tr><tr><td class=\"w\">transparency<\/td><td class=\"m\">투명성, 투명도, 명백함<\/td><\/tr><tr><td class=\"w\">vital<\/td><td class=\"m\">매우 중요한, 필수적인<\/td><\/tr><tr><td class=\"w\">skeptical<\/td><td class=\"m\">회의적인, 의심 많은<\/td><\/tr><tr><td class=\"w\">corporation<\/td><td class=\"m\">기업, 회사<\/td><\/tr><tr><td class=\"w\">lack<\/td><td class=\"m\">부족, 결핍<\/td><\/tr><tr><td class=\"w\">accountability<\/td><td class=\"m\">책임, 책무<\/td><\/tr><tr><td class=\"w\">available<\/td><td class=\"m\">이용할 수 있는<\/td><\/tr><tr><td class=\"w\">complete<\/td><td class=\"m\">완전한, 완료된<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>While convenience and technology<\/b><\/span><span class=\"ko\">편리함과 기술이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are crucial,<\/b><\/span><span class=\"ko\">중요하지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they<\/b><\/span><span class=\"ko\">그것들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are not the only factors<\/b><\/span><span class=\"ko\">유일한 요인들은 아니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">driving<\/span> Gen Z’s financial decisions.<\/b><\/span><span class=\"ko\">Z세대의 재정상 결정을 이끄는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">편리함과 기술이 중요하지만, 그것들이 Z세대의 재정상 결정을 이끄는 유일한 요인들은 아니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> driving Gen Z’s financial decisions는 이 세대가 단순히 앱이 빠르거나 사용하기 편하다는 이유만으로 특정 은행을 선택하지는 않는다는 의미입니다. 글의 도입부에서 흔히 생각하는 ‘디지털 세대’라는 특성 외에 더 깊은 고려 사항이 있음을 암시하며 독자의 주의를 환기합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">driving (현재분사(형용사)): driving이 factors를 수식(= &quot;Z세대의 금융 결정을 이끄는 요인&quot;). N + -ing ≈ &quot;…하는 N&quot; 구조로 분사가 명사를 능동의 의미로 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">convenience<\/td><td class=\"m\">편의, 편리<\/td><\/tr><tr><td class=\"w\">crucial<\/td><td class=\"m\">매우 중요한<\/td><\/tr><tr><td class=\"w\">factor<\/td><td class=\"m\">요인, 요소<\/td><\/tr><tr><td class=\"w\">drive<\/td><td class=\"m\">운전하다<\/td><\/tr><tr><td class=\"w\">financial<\/td><td class=\"m\">재정적인, 금전적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This generation<\/b><\/span><span class=\"ko\">이 세대는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is incredibly values-driven,<\/b><\/span><span class=\"ko\">매우 가치 지향적이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and they<\/b><\/span><span class=\"ko\">그리고 그들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>want <span class=\"grammar-hl\">to bank<\/span><\/b><\/span><span class=\"ko\">거래하기를 원한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with institutions<\/b><\/span><span class=\"ko\">기관들과<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that match<\/span> their personal beliefs and values.<\/b><\/span><span class=\"ko\">그들의 개인적인 신념과 가치에 부합하는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이 세대는 매우 가치 지향적이며, 개인의 신념과 가치에 부합하는 기관과 거래하기를 원한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> values-driven은 돈을 맡길 곳을 정할 때 그 회사가 추구하는 방향이 내 생각과 맞는지를 가장 중요하게 따진다는 의미입니다. 앞 문장에서 언급한 &#39;추가적인 요인&#39;의 정체가 바로 개인의 신념임을 명확히 밝히며 논의를 전개합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to bank (to부정사(명사적)): 동사 want의 목적어 자리에 쓰여 명사 역할을 한다. (판별: 5번 규칙 적용)<\/div><div class=\"lec-gr-item\">that match (관계대명사): 선행사 institutions를 수식하며, 관계대명사절 내에서 주어 역할을 하는 주격 관계대명사다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drive<\/td><td class=\"m\">운전하다<\/td><\/tr><tr><td class=\"w\">generation<\/td><td class=\"m\">세대<\/td><\/tr><tr><td class=\"w\">value<\/td><td class=\"m\">가치 있게 여기다, 소중히 하다<\/td><\/tr><tr><td class=\"w\">bank<\/td><td class=\"m\">은행<\/td><\/tr><tr><td class=\"w\">institution<\/td><td class=\"m\">기관, 단체<\/td><\/tr><tr><td class=\"w\">match<\/td><td class=\"m\">일치하다, 어울리다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Transparency <span class=\"grammar-hl\">is<\/span> vital.<\/b><\/span><span class=\"ko\">투명성이 매우 중요하다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">투명성이 매우 중요하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> Transparency is vital은 은행이 정보를 숨기거나 모호하게 처리하는 것을 이 세대가 결코 용납하지 않는다는 점을 강조합니다. 앞서 말한 ‘가치’ 중에서도 가장 핵심이 되는 첫 번째 요소를 제시하는 역할을 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is 2형식(SVC) 구조: 주어(Transparency)와 주격보어(vital)를 연결하며 주어의 상태를 설명하는 동사이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">transparency<\/td><td class=\"m\">투명성, 투명도, 명백함<\/td><\/tr><tr><td class=\"w\">vital<\/td><td class=\"m\">매우 중요한, 필수적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Gen Z<\/b><\/span><span class=\"ko\">Z세대는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is skeptical<\/b><\/span><span class=\"ko\">회의적이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of large corporations and institutions <span class=\"grammar-hl\">that lack<\/span> accountability.<\/b><\/span><span class=\"ko\">책무성이 부족한 대규모의 기업과 기관에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Z세대는 책무성이 부족한 대규모의 기업과 기관에 회의적이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> skeptical of는 이름값이 높은 대형 은행이라 하더라도, 사회적 책임을 다하지 않거나 투명하지 않으면 신뢰하지 않고 일단 의심부터 한다는 의미입니다. 이들이 왜 투명성을 그토록 강조하는지에 대한 심리적 배경을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that lack (관계대명사): 선행사 large corporations and institutions를 수식하며, 관계대명사절 내에서 주어 역할을 하는 주격 관계대명사다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">institution<\/td><td class=\"m\">기관, 단체<\/td><\/tr><tr><td class=\"w\">skeptical<\/td><td class=\"m\">회의적인, 의심 많은<\/td><\/tr><tr><td class=\"w\">corporation<\/td><td class=\"m\">기업, 회사<\/td><\/tr><tr><td class=\"w\">lack<\/td><td class=\"m\">부족, 결핍<\/td><\/tr><tr><td class=\"w\">accountability<\/td><td class=\"m\">책임, 책무<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>They<\/b><\/span><span class=\"ko\">그들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>have grown up<\/b><\/span><span class=\"ko\">자라 왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in a world<\/b><\/span><span class=\"ko\">세상에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">where<\/span> information is freely available,<\/b><\/span><span class=\"ko\">정보를 자유롭게 이용할 수 있는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and they<\/b><\/span><span class=\"ko\">그리고 그들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>expect complete transparency<\/b><\/span><span class=\"ko\">완전한 투명성을 기대한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from the brands <span class=\"grammar-hl\">they support<\/span>.<\/b><\/span><span class=\"ko\">그들이 지지하는 브랜드로부터.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그들은 정보를 자유롭게 이용할 수 있는 세상에서 자라 왔고, 자신이 지지하는 브랜드로부터 완전한 투명성을 기대한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> information is freely available은 인터넷을 통해 기업의 뒷모습을 쉽게 파악할 수 있는 환경에서 자랐기 때문에, 기업의 숨겨진 의도나 부정을 찾아내는 데 능숙하다는 의미입니다. 이 세대의 특성이 형성된 사회적 배경을 통해 그들의 요구가 정당함을 뒷받침합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">where (관계부사): 장소의 의미를 갖는 선행사 a world를 수식하며, 뒤에는 주어(information)와 동사(is)가 모두 갖춰진 완전한 절이 온다.<\/div><div class=\"lec-gr-item\">they support (관계대명사): 선행사 brands 뒤에 목적격 관계대명사(which/that)가 생략된 구조로, they support가 brands를 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">transparency<\/td><td class=\"m\">투명성, 투명도, 명백함<\/td><\/tr><tr><td class=\"w\">available<\/td><td class=\"m\">이용할 수 있는<\/td><\/tr><tr><td class=\"w\">complete<\/td><td class=\"m\">완전한, 완료된<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Banks, for example,<\/b><\/span><span class=\"ko\">은행은, 예를 들어,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>must clearly communicate<\/b><\/span><span class=\"ko\">명확하게 전달해야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>fees, terms, and conditions,<\/b><\/span><span class=\"ko\">수수료, 약관, 그리고 조항을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as well as<\/span><\/b><\/span><span class=\"ko\">~뿐만 아니라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">how they handle<\/span> customers’ data.<\/b><\/span><span class=\"ko\">그들이 고객의 데이터를 처리하는 방식.<\/span><\/div><\/div><div class=\"lec-sent-ko\">예를 들어, 은행은 그들이 고객의 데이터를 처리하는 방식뿐 아니라 수수료, 약관, 조항을 투명하게 전달해야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> clearly communicate는 복잡하고 어려운 금융 용어 뒤에 숨지 말고, 고객이 실제로 내야 하는 돈이나 개인정보 활용 방식을 숨김없이 정직하게 밝혀야 한다는 의미입니다. 앞서 언급한 ‘투명성’이 금융 현장에서 구체적으로 어떻게 실현되어야 하는지 예시를 들어 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">as well as (관용표현): &#39;~뿐만 아니라&#39;라는 뜻으로, 명사구 나열 뒤에 추가적인 정보를 덧붙일 때 사용한다.<\/div><div class=\"lec-gr-item\">how they handle (간접의문문): 의문사(how) + 주어(they) + 동사(handle) 어순으로 쓰였으며, 전체 문장에서 전치사의 목적어 역할을 하는 명사절이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bank<\/td><td class=\"m\">은행<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Moreover,<\/b><\/span><span class=\"ko\">게다가,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>ethical <span class=\"grammar-hl\">banking<\/span> practices<\/b><\/span><span class=\"ko\">윤리적인 은행 업무는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are more important<\/b><\/span><span class=\"ko\">더 중요하다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than ever.<\/b><\/span><span class=\"ko\">어느 때보다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">게다가, 윤리적인 은행 업무는 그 어느 때보다 중요하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> ethical banking practices는 은행이 단순히 법을 지키는 수준을 넘어 도덕적으로 올바른 방식으로 돈을 벌고 운영해야 한다는 의미입니다. &#39;투명성&#39;이라는 주제에서 한 단계 더 나아가 &#39;윤리&#39;라는 또 다른 핵심 가치로 화제를 전환합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">banking (동명사(명사적)): banking(은행업무) + practices(관행) 형태의 결합으로, 행위나 활동의 개념으로 명사를 수식하는 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bank<\/td><td class=\"m\">은행<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Gen Z<\/b><\/span><span class=\"ko\">Z세대는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">cares about<\/span><\/b><\/span><span class=\"ko\">관심을 갖는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the environment, social justice, and the ethical implications<\/b><\/span><span class=\"ko\">환경, 사회 정의, 그리고 윤리적 함의에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of their financial decisions.<\/b><\/span><span class=\"ko\">그들의 재정상 결정의.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Z세대는 환경, 사회 정의, 그리고 자신의 재정상 결정의 윤리적 함의에 관심이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> ethical implications of their financial decisions는 내가 예금한 돈이 혹시나 환경을 파괴하거나 인권을 탄압하는 곳에 대출되지 않는지까지 고려한다는 의미입니다. Z세대가 중요하게 생각하는 가치의 범위를 구체적으로 나열합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">cares about (관용표현): &#39;~에 관심을 가지다&#39; 혹은 &#39;~를 배려하다&#39;라는 의미의 구동사다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">financial<\/td><td class=\"m\">재정적인, 금전적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>They<\/b><\/span><span class=\"ko\">그들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are interested in<\/b><\/span><span class=\"ko\">~에 관심이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>sustainable investing,<\/b><\/span><span class=\"ko\">지속 가능한 투자<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>supporting businesses <span class=\"grammar-hl\">that match<\/span> their values,<\/b><\/span><span class=\"ko\">그들의 가치에 부합하는 기업을 지지하는 것<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and ensuring<\/b><\/span><span class=\"ko\">그리고 확실히 하는 것<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that their money <span class=\"grammar-hl\">is not being used<\/span><\/b><\/span><span class=\"ko\">그들의 돈이 사용되고 있지 않음을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to fund<\/span> harmful practices.<\/b><\/span><span class=\"ko\">유해한 관행에 자금을 대는 데.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그들은 지속 가능한 투자, 자신의 가치에 부합하는 기업을 지지하는 것, 그리고 자신의 돈이 유해한 관행에 자금을 대는 데 사용되고 있지 않음을 확실히 하는 것에 관심이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> fund harmful practices는 자신의 자산이 무기 제조나 환경 오염 기업의 자금줄이 되는 것을 거부하겠다는 의지입니다. 앞 문장의 내용을 이어받아, 소극적인 관심을 넘어 실제 투자 활동에서 어떻게 행동하는지를 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">investing, supporting, and ensuring (동명사): 전치사 in의 목적어로 쓰여 명사 역할을 하는 세 개의 동명사구가 and로 병렬 연결되어 있다.<\/div><div class=\"lec-gr-item\">that match (관계대명사): 선행사 businesses를 수식하며, 관계대명사절 내에서 주어 역할을 하는 주격 관계대명사다.<\/div><div class=\"lec-gr-item\">is not being used (수동태): be동사(is)+p.p.(used) 구조. use는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is not being used 형태로 쓴다. 기본구조: V + O.<\/div><div class=\"lec-gr-item\">to fund (to부정사(부사적): 목적): &#39;in order to fund&#39;로 바꿔도 뜻이 같으므로 목적을 나타낸다. (판별: 3번 규칙 적용)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">value<\/td><td class=\"m\">가치 있게 여기다, 소중히 하다<\/td><\/tr><tr><td class=\"w\">match<\/td><td class=\"m\">일치하다, 어울리다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Banks<\/b><\/span><span class=\"ko\">은행은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that offer<\/span> socially responsible investment opportunities<\/b><\/span><span class=\"ko\">사회적으로 책임 있는 투자 기회를 제공하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">are committed to<\/span> environmental sustainability<\/b><\/span><span class=\"ko\">환경적 지속 가능성에 전념하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>will attract<\/b><\/span><span class=\"ko\">끌 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Gen Z’s attention.<\/b><\/span><span class=\"ko\">Z세대의 관심을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">사회적으로 책임 있는 투자 기회를 제공하고 환경적 지속 가능성에 전념하는 은행은 Z세대의 관심을 끌 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> attract Gen Z’s attention은 은행이 생존하기 위해서는 청년 세대의 가치관에 맞는 상품을 개발하고 진정성 있는 태도를 보여야만 고객으로 확보할 수 있다는 의미입니다. 전체 글의 결론으로, 변화하는 시대에 은행이 나아가야 할 방향을 제시하며 마무리합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that offer (관계대명사): 선행사 Banks를 수식하며, 관계대명사절 내에서 주어 역할을 하는 주격 관계대명사다.<\/div><div class=\"lec-gr-item\">are committed to (수동태): be동사(are)+p.p.(committed) 구조. commit은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are committed 형태로 쓴다. 기본구조: V + O + to B.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bank<\/td><td class=\"m\">은행<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>Z세대는 금융 거래 시 기술적 편의성보다 자신의 가치와 신념을 더 중요하게 여긴다.<\/li><li>정보가 공개된 사회에서 자란 이들은 기업의 투명성과 책임감을 엄격하게 따진다.<\/li><li>은행은 수수료나 데이터 처리 방식 등을 명확히 공개하여 신뢰를 얻어야 한다.<\/li><li>또한 환경 보호와 사회 정의를 실천하는 윤리적인 경영이 필수적이다.<\/li><li>사회적 책임을 다하고 지속 가능성을 추구하는 금융 기관만이 Z세대의 선택을 받을 수 있다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Gen Z demands absolute transparency and ethical integrity from financial institutions because they prioritize banking with brands that reflect their personal and social values.<\/div>\n              <div class=\"lec-final-sum-ko\">Z세대는 자신들의 개인적 및 사회적 가치를 반영하는 브랜드와 거래하는 것을 우선시하기 때문에 금융 기관에 철저한 투명성과 윤리적 진실성을 요구한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_30번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_30번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_30번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_30번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_30번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_30번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_30번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2025년_10월_30번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_30번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_30번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_30번_강의_audio/11.mp3","hl":"grammar"} ":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 10월 / 30번","titleEn":"Beyond Convenience: The Importance of Ethics and Transparency in Gen Z Banking","titleKo":"편리함을 넘어: Z세대 뱅킹에서 윤리와 투명성의 중요성","imageUrl":"__enpImg__","stages":[{"label":"01가치 중심의 금융 선택","items":["Z세대는 금융 의사결정에서 기술적 편의성보다 개인의 신념과 가치를 중시한다.","편의성(convenience)과 기술을 넘어서는 핵심 동기","자신의 가치관(personal beliefs)과 일치하는 금융 기관 선호","핵심 키워드: 가치 중심적(values-driven)"]},{"label":"02투명성에 대한 높은 기대","items":["대기업에 회의적인 Z세대는 금융 기관의 투명성과 책임감을 필수 조건으로 여긴다.","정보의 자유로운 접근과 투명성(transparency) 요구","수수료, 약관 및 고객 데이터(customers’ data) 관리 방식의 명확한 공개","핵심 키워드: 책임감(accountability)"]},{"label":"03윤리적 금융 관행의 부상","items":["환경과 사회 정의 등 금융 결정이 미치는 윤리적 영향력을 중요하게 고려한다.","환경(environment)과 사회 정의(social justice)에 대한 높은 관심","자신의 돈이 해로운 관행에 사용되지 않기를 희망","핵심 키워드: 윤리적 관행(ethical practices)"]},{"label":"04지속 가능한 투자의 유인","items":["사회적 책임을 다하고 지속 가능성을 추구하는 은행이 Z세대의 선택을 받는다.","지속 가능한 투자(sustainable investing) 기회 제공의 중요성","사회적 책임(socially responsible)을 다하는 기업 지원","핵심 키워드: Z세대의 관심(Gen Z’s attention)"]}],"bkg":"디지털 환경에서 태어난 Z세대 (Gen Z)는 자신의 가치관과 일치하는 곳에 돈을 쓰는 미닝아웃 (Meaning Out) 소비 문화를 주도하고 있습니다. 이들은 기업이 단순히 이윤을 창출하는 것을 넘어 환경 보호나 사회적 공헌과 같은 ESG (환경·사회·지배구조) 기준을 얼마나 잘 지키는지에 따라 거래 여부를 결정하곤 합니다. 마치 우리가 식재료를 살 때 친환경 인증 마크를 확인하듯이, 이들은 금융 기관이 고객의 돈을 반윤리적인 산업에 투자하지 않는 윤리적 금융 (Ethical Banking)을 실천하는지 꼼꼼히 따져봅니다. 특히 모든 정보가 투명하게 공개되기를 기대하는 투명성 (Transparency)에 대한 높은 기준은, 금융 기관이 복잡한 수수료 체계나 데이터 관리 방식을 정직하게 공개해야 한다는 사회적 요구로 이어지고 있습니다. 결국 Z세대에게 금융이란 단순한 자산 증식 수단을 넘어, 자신의 정체성을 증명하고 사회를 긍정적으로 변화시키는 가치 중심적 투자 (Values-driven Investment)의 연장선이라고 할 수 있습니다.","ttsText":"디지털 환경에서 태어난 Z세대 (Gen Z)는 자신의 가치관과 일치하는 곳에 돈을 쓰는 미닝아웃 (Meaning Out) 소비 문화를 주도하고 있습니다. 이들은 기업이 단순히 이윤을 창출하는 것을 넘어 환경 보호나 사회적 공헌과 같은 ESG (환경·사회·지배구조) 기준을 얼마나 잘 지키는지에 따라 거래 여부를 결정하곤 합니다. 마치 우리가 식재료를 살 때 친환경 인증 마크를 확인하듯이, 이들은 금융 기관이 고객의 돈을 반윤리적인 산업에 투자하지 않는 윤리적 금융 (Ethical Banking)을 실천하는지 꼼꼼히 따져봅니다. 특히 모든 정보가 투명하게 공개되기를 기대하는 투명성 (Transparency)에 대한 높은 기준은, 금융 기관이 복잡한 수수료 체계나 데이터 관리 방식을 정직하게 공개해야 한다는 사회적 요구로 이어지고 있습
