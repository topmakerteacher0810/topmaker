 실험이다.<\/li><li>인간은 자원을 활용하는 복잡하고 미묘한 방식(subtle and complicated)으로 진화함<\/li><li>갑작스러운 식단 변화는 거대한 영양 실험(huge experiments)과 같음<\/li><li>핵심 키워드: 인류의 진화(evolve)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02영양 과학의 한계와 겸손<\/div><ul><li>현대 영양 과학은 여전히 초기 단계에 머물러 있으므로 과학적 사실에 대해 겸손한 태도를 가져야 한다.<\/li><li>영양 과학(nutritional science)은 아직 미성숙한 상태임<\/li><li>우리가 모르는 것이 많으므로 겸손(humility)이 필요함<\/li><li>핵심 키워드: 영양 과학의 한계(science is still young)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03전통 식단의 타당성<\/div><ul><li>수천 년간 유지되어 온 전통적인 식사 방식에는 그 나름의 합당한 이유가 존재할 가능성이 크다.<\/li><li>수천 년(millennia) 동안 먹어 온 방식에는 정당한 이유(good reason)가 있음<\/li><li>현대적 기준에 맞지 않더라도 전통 음식을 우선적으로 선택해야 함<\/li><li>핵심 키워드: 전통 식단(traditional foods)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04가공식품 대비 전통 식품의 우월성<\/div><ul><li>공장에서 만든 가공식품보다 지방이 많거나 천연 상태인 전통 식품이 더 나은 선택일 수 있다.<\/li><li>가공된 살라미보다 전통적인 선지 소시지(fatty blood sausages)가 선호됨<\/li><li>감미료(sweeteners)보다 천연 꿀(honey)이 더 우수함<\/li><li>핵심 키워드: 가공식품(highly processed ones)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05영양 전이의 부작용과 성찰<\/div><ul><li>전통 사회가 현대적 식단으로 변하며 겪는 어려움을 보고 현대 식단의 방향성을 재고해야 한다.<\/li><li>영양 전이(nutrition transition)를 겪는 전통 사회의 부정적 사례<\/li><li>현대인의 식단이 너무 멀리 나아간 것은 아닌지 자문(question)해야 함<\/li><li>핵심 키워드: 현대 식단에 대한 의구심(moved too far)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">being<\/td><td class=\"m\">(human beings) 인간<\/td><\/tr><tr><td class=\"w\">evolve<\/td><td class=\"m\">진화하다, 발전하다<\/td><\/tr><tr><td class=\"w\">resource<\/td><td class=\"m\">자원<\/td><\/tr><tr><td class=\"w\">available<\/td><td class=\"m\">이용할 수 있는<\/td><\/tr><tr><td class=\"w\">subtle<\/td><td class=\"m\">미묘한, 은근한<\/td><\/tr><tr><td class=\"w\">complicated<\/td><td class=\"m\">복잡한<\/td><\/tr><tr><td class=\"w\">diet<\/td><td class=\"m\">식단, 먹는 것<\/td><\/tr><tr><td class=\"w\">especially<\/td><td class=\"m\">특히<\/td><\/tr><tr><td class=\"w\">effectively<\/td><td class=\"m\">효과적으로<\/td><\/tr><tr><td class=\"w\">conduct<\/td><td class=\"m\">수행하다, 실시하다<\/td><\/tr><tr><td class=\"w\">huge<\/td><td class=\"m\">거대한, 엄청난<\/td><\/tr><tr><td class=\"w\">experiment<\/td><td class=\"m\">실험하다<\/td><\/tr><tr><td class=\"w\">nutrition<\/td><td class=\"m\">영양<\/td><\/tr><tr><td class=\"w\">humility<\/td><td class=\"m\">겸손<\/td><\/tr><tr><td class=\"w\">nutritional<\/td><td class=\"m\">영양의<\/td><\/tr><tr><td class=\"w\">assume<\/td><td class=\"m\">가정하다, 추정하다<\/td><\/tr><tr><td class=\"w\">fit<\/td><td class=\"m\">맞다, 어울리다<\/td><\/tr><tr><td class=\"w\">neat<\/td><td class=\"m\">깔끔한, 정돈된<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">being<\/td><td class=\"m\">(human beings) 인간<\/td><\/tr><tr><td class=\"w\">evolve<\/td><td class=\"m\">진화하다, 발전하다<\/td><\/tr><tr><td class=\"w\">resource<\/td><td class=\"m\">자원<\/td><\/tr><tr><td class=\"w\">available<\/td><td class=\"m\">이용할 수 있는<\/td><\/tr><tr><td class=\"w\">subtle<\/td><td class=\"m\">미묘한, 은근한<\/td><\/tr><tr><td class=\"w\">complicated<\/td><td class=\"m\">복잡한<\/td><\/tr><tr><td class=\"w\">diet<\/td><td class=\"m\">식단, 먹는 것<\/td><\/tr><tr><td class=\"w\">especially<\/td><td class=\"m\">특히<\/td><\/tr><tr><td class=\"w\">effectively<\/td><td class=\"m\">효과적으로<\/td><\/tr><tr><td class=\"w\">conduct<\/td><td class=\"m\">수행하다, 실시하다<\/td><\/tr><tr><td class=\"w\">huge<\/td><td class=\"m\">거대한, 엄청난<\/td><\/tr><tr><td class=\"w\">experiment<\/td><td class=\"m\">실험하다<\/td><\/tr><tr><td class=\"w\">nutrition<\/td><td class=\"m\">영양<\/td><\/tr><tr><td class=\"w\">humility<\/td><td class=\"m\">겸손<\/td><\/tr><tr><td class=\"w\">nutritional<\/td><td class=\"m\">영양의<\/td><\/tr><tr><td class=\"w\">assume<\/td><td class=\"m\">가정하다, 추정하다<\/td><\/tr><tr><td class=\"w\">fit<\/td><td class=\"m\">맞다, 어울리다<\/td><\/tr><tr><td class=\"w\">neat<\/td><td class=\"m\">깔끔한, 정돈된<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Human beings have evolved<\/b><\/span><span class=\"ko\">인간은 진화해 왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to make<\/span> the most of the resources available to them<\/b><\/span><span class=\"ko\">그들에게 이용 가능한 자원들을 최대한 이용하도록<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in ways <span class=\"grammar-hl\">that are<\/span> subtle and complicated.<\/b><\/span><span class=\"ko\">미묘하고 복잡한 방식들로<\/span><\/div><\/div><div class=\"lec-sent-ko\">인간은 그들에게 이용 가능한 자원들을 미묘하고 복잡한 방식들로 최대한 이용하도록 진화해 왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> evolved to make the most of the resources는 인류가 수천 년에 걸쳐 주변 환경에서 얻을 수 있는 모든 영양소를 몸에 가장 이로운 방식으로 섭취하는 생존 전략을 완성했다는 의미입니다. 글의 시작점에서 인류의 식습관이 단순히 먹는 행위를 넘어 아주 오랜 시간 검증된 결과물임을 강조하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to make (to부정사(부사적): 목적): &#39;in order to make&#39;로 바꿔도 뜻이 통하므로 목적을 나타낸다.<\/div><div class=\"lec-gr-item\">that are (관계대명사): 주격 관계대명사로 선행사 ways를 수식하며, 뒤에 주어가 빠진 불완전한 절이 이어진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">being<\/td><td class=\"m\">(human beings) 인간<\/td><\/tr><tr><td class=\"w\">evolve<\/td><td class=\"m\">진화하다, 발전하다<\/td><\/tr><tr><td class=\"w\">resource<\/td><td class=\"m\">자원<\/td><\/tr><tr><td class=\"w\">available<\/td><td class=\"m\">이용할 수 있는<\/td><\/tr><tr><td class=\"w\">subtle<\/td><td class=\"m\">미묘한, 은근한<\/td><\/tr><tr><td class=\"w\">complicated<\/td><td class=\"m\">복잡한<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">being<\/td><td class=\"m\">(human beings) 인간<\/td><\/tr><tr><td class=\"w\">evolve<\/td><td class=\"m\">진화하다, 발전하다<\/td><\/tr><tr><td class=\"w\">resource<\/td><td class=\"m\">자원<\/td><\/tr><tr><td class=\"w\">available<\/td><td class=\"m\">이용할 수 있는<\/td><\/tr><tr><td class=\"w\">subtle<\/td><td class=\"m\">미묘한, 은근한<\/td><\/tr><tr><td class=\"w\">complicated<\/td><td class=\"m\">복잡한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When we change our diets,<\/b><\/span><span class=\"ko\">우리가 우리의 식단을 바꿀 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>especially when we <span class=\"grammar-hl\">do<\/span> so quickly,<\/b><\/span><span class=\"ko\">특히 우리가 그렇게 아주 빠르게 할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we <span class=\"grammar-hl\">are effectively conducting<\/span><\/b><\/span><span class=\"ko\">우리는 실질적으로 시행하고 있는 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>huge experiments in nutrition.<\/b><\/span><span class=\"ko\">영양 섭취에서 거대한 실험을<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리가 우리의 식단을 바꿀 때, 특히 우리가 매우 빠르게 그렇게 할 때, 우리는 실질적으로 영양 섭취에서 거대한 실험을 시행하고 있는 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> effectively conducting huge experiments는 수천 년간 이어진 안정적인 식습관을 최근 수십 년 사이에 갑자기 바꾸는 행위가 우리 몸에 어떤 결과를 초래할지 모르는 위험한 도박과 같다는 의미입니다. 앞 문장의 &#39;진화적 안정성&#39;과 대비하여 현대 식단의 불안정성을 지적합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">do (대동사): 앞의 일반동사구(change our diets)의 반복을 피하기 위해 쓰였다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.<\/div><div class=\"lec-gr-item\">are effectively conducting (현재진행): be동사(are)와 conducting이 결합하여 현재 진행 중인 동작을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">diet<\/td><td class=\"m\">식단, 먹는 것<\/td><\/tr><tr><td class=\"w\">especially<\/td><td class=\"m\">특히<\/td><\/tr><tr><td class=\"w\">effectively<\/td><td class=\"m\">효과적으로<\/td><\/tr><tr><td class=\"w\">conduct<\/td><td class=\"m\">수행하다, 실시하다<\/td><\/tr><tr><td class=\"w\">huge<\/td><td class=\"m\">거대한, 엄청난<\/td><\/tr><tr><td class=\"w\">experiment<\/td><td class=\"m\">실험하다<\/td><\/tr><tr><td class=\"w\">nutrition<\/td><td class=\"m\">영양<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">diet<\/td><td class=\"m\">식단, 먹는 것<\/td><\/tr><tr><td class=\"w\">especially<\/td><td class=\"m\">특히<\/td><\/tr><tr><td class=\"w\">effectively<\/td><td class=\"m\">효과적으로<\/td><\/tr><tr><td class=\"w\">conduct<\/td><td class=\"m\">수행하다, 실시하다<\/td><\/tr><tr><td class=\"w\">huge<\/td><td class=\"m\">거대한, 엄청난<\/td><\/tr><tr><td class=\"w\">experiment<\/td><td class=\"m\">실험하다<\/td><\/tr><tr><td class=\"w\">nutrition<\/td><td class=\"m\">영양<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We <span class=\"grammar-hl\">ought to have<\/span> more humility.<\/b><\/span><span class=\"ko\">우리는 더 겸손해져야 한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리는 더 겸손해져야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> have more humility는 인간이 가진 짧은 지식으로 오래된 지혜를 함부로 재단하지 말아야 한다는 글쓴이의 강한 주장을 담고 있습니다. 앞서 언급한 &#39;위험한 실험&#39;을 멈추고 전통적인 식습관의 가치를 인정해야 한다는 태도의 변화를 촉구하는 문장입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">ought to have (관용표현): &#39;ought to + 동사원형&#39;은 &#39;~해야 한다&#39;라는 의무나 당연함을 나타내는 조동사 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">humility<\/td><td class=\"m\">겸손<\/td><\/tr><tr><td class=\"w\">humility<\/td><td class=\"m\">겸손<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Nutritional science is still young<\/b><\/span><span class=\"ko\">영양학은 여전히 역사가 짧고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and there is <span class=\"grammar-hl\">so much we do not know<\/span>.<\/b><\/span><span class=\"ko\">우리가 모르는 것이 너무나 많다<\/span><\/div><\/div><div class=\"lec-sent-ko\">영양학은 여전히 역사가 짧고 우리가 모르는 것이 너무나 많다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> science is still young은 현대 영양학의 역사가 인류의 진화 역사에 비해 턱없이 짧아 인체의 복잡한 반응을 완벽히 설명하기에는 한계가 명확하다는 의미입니다. 우리가 왜 겸손해야 하는지에 대한 구체적인 근거를 제시하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">so much we do not know (관계대명사): much와 we 사이에 목적격 관계대명사(that/which)가 생략되어 있으며, we do not know 절이 much를 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nutrition<\/td><td class=\"m\">영양<\/td><\/tr><tr><td class=\"w\">nutritional<\/td><td class=\"m\">영양의<\/td><\/tr><tr><td class=\"w\">nutrition<\/td><td class=\"m\">영양<\/td><\/tr><tr><td class=\"w\">nutritional<\/td><td class=\"m\">영양의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If we have eaten certain foods in certain ways<\/b><\/span><span class=\"ko\">만약 우리가 특정한 음식들을 특정한 방식들로 먹어 왔다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for millennia,<\/b><\/span><span class=\"ko\">수천 년 동안<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we should assume<\/b><\/span><span class=\"ko\">우리는 추측해야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>until it <span class=\"grammar-hl\">is proven<\/span> otherwise<\/b><\/span><span class=\"ko\">그것이 다르게 증명될 때까지는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that there is probably a good reason <span class=\"grammar-hl\">why<\/span>.<\/b><\/span><span class=\"ko\">아마도 그렇게 하는 타당한 이유가 있을 것이라고<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 우리가 수천년 동안 특정한 방식들로 특정한 음식들을 먹어 왔다면, 우리는 그것이 다르게 증명될 때까지는 아마도 그렇게 하는 타당한 이유가 있을 것이라고 추측해야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> there is probably a good reason why는 오랜 세월 전해 내려온 조리법이나 식재료의 조합에는 현대 과학이 아직 찾아내지 못한 건강상의 이점이 숨겨져 있을 것이라는 의미입니다. 앞 문장의 영양학적 무지를 인정하고 전통의 권위를 우선시해야 한다는 논리로 이어집니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is proven (수동태): be동사(is)+p.p.(proven) 구조. prove는 타동사인데 뒤에 목적어가 없어서 수동구조 is proven 형태로 쓴다. 기본구조: prove + O (…을 증명하다).<\/div><div class=\"lec-gr-item\">why (관계부사): 선행사 reason을 수식하며, 뒤에는 주어(there)와 동사(is)를 갖춘 완전한 절이 이어진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">assume<\/td><td class=\"m\">가정하다, 추정하다<\/td><\/tr><tr><td class=\"w\">assume<\/td><td class=\"m\">가정하다, 추정하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Traditional foods<\/b><\/span><span class=\"ko\">전통 음식은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that don’t fit<\/span> neatly on the contemporary dietary food plate<\/b><\/span><span class=\"ko\">현대의 식단 플레이트에 딱 들어맞지 않는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">should generally be chosen<\/span><\/b><\/span><span class=\"ko\">일반적으로 선택되어야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>over highly <span class=\"grammar-hl\">processed<\/span> ones that <span class=\"grammar-hl\">do<\/span>.<\/b><\/span><span class=\"ko\">그렇게 딱 들어맞는 매우 가공된 음식들보다<\/span><\/div><\/div><div class=\"lec-sent-ko\">일반적으로 현대의 균형 잡힌 식단의 식사에 딱 들어맞지 않는 전통 음식이 딱 들어맞는 매우 가공된 음식보다 우선 선택되어야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> don’t fit neatly on the contemporary dietary food plate는 지방 함량이 높거나 칼로리가 많다는 이유로 현대 영양학 기준에서 &#39;나쁜 음식&#39;으로 분류되는 전통 음식을 가리킵니다. 영양학 수치에만 맞춰 공장에서 찍어낸 가공식품보다, 수치상으로는 불리해 보여도 자연스러운 전통 음식을 먹는 것이 낫다는 결론을 내리고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that don’t fit (관계대명사): 주격 관계대명사로 선행사 Traditional foods를 수식하며, 뒤에 주어가 없는 불완전한 절이 이어진다.<\/div><div class=\"lec-gr-item\">should generally be chosen (수동태): be동사(be)+p.p.(chosen) 구조. choose는 타동사인데 뒤에 목적어가 없어서 수동구조 be chosen 형태로 쓴다. 기본구조: choose + O (…을 선택하다).<\/div><div class=\"lec-gr-item\">processed (과거분사(형용사)): processed가 뒤의 대명사 ones를 수식한다 (= &#39;가공된 것들&#39;).<\/div><div class=\"lec-gr-item\">do (대동사): 앞의 일반동사 fit의 반복을 피하기 위해 쓰였다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">being<\/td><td class=\"m\">(human beings) 인간<\/td><\/tr><tr><td class=\"w\">diet<\/td><td class=\"m\">식단, 먹는 것<\/td><\/tr><tr><td class=\"w\">fit<\/td><td class=\"m\">맞다, 어울리다<\/td><\/tr><tr><td class=\"w\">neat<\/td><td class=\"m\">깔끔한, 정돈된<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">being<\/td><td class=\"m\">(human beings) 인간<\/td><\/tr><tr><td class=\"w\">diet<\/td><td class=\"m\">식단, 먹는 것<\/td><\/tr><tr><td class=\"w\">fit<\/td><td class=\"m\">맞다, 어울리다<\/td><\/tr><tr><td class=\"w\">neat<\/td><td class=\"m\">깔끔한, 정돈된<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We should assume<\/b><\/span><span class=\"ko\">우리는 추측해야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that <span class=\"grammar-hl\">traditionally made<\/span> fatty blood sausages are preferable<\/b><\/span><span class=\"ko\">전통적으로 만들어진 지방이 많은 블러드 소시지가 더 선호된다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to lean, <span class=\"grammar-hl\">factory-made<\/span> salamis;<\/b><\/span><span class=\"ko\">지방이 적고 공장에서 만들어진 살라미 소시지보다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that spoonfuls of honey are superior<\/b><\/span><span class=\"ko\">그리고 몇 스푼의 꿀이 더 낫다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to sprinkles of sweeteners.<\/b><\/span><span class=\"ko\">소량의 감미료보다<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리는 전통적으로 만들어진 지방이 많은 블러드 소시지가 지방이 적고 공장에서 만들어진 살라미 소시지보다 더 선호되며, 그리고 몇 스푼의 꿀이 소량의 감미료보다 더 나은 것으로 추측해야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> preferable to lean, factory-made salamis는 &#39;지방이 적다&#39;는 현대적 기준에 맞춘 가공육보다, 비록 지방이 많더라도 자연적인 공정을 거친 전통 육가공품이 몸에는 더 이롭다는 구체적인 예시입니다. 앞 문장의 추상적인 주장을 일상적인 식재료를 통해 명확히 뒷받침합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">traditionally made (과거분사(형용사)): made가 뒤의 명사 sausages를 수식한다 (= &#39;전통적으로 만들어진 소시지&#39;).<\/div><div class=\"lec-gr-item\">factory-made (과거분사(형용사)): made가 뒤의 명사 salamis를 수식한다 (= &#39;공장에서 만들어진 살라미&#39;).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">assume<\/td><td class=\"m\">가정하다, 추정하다<\/td><\/tr><tr><td class=\"w\">assume<\/td><td class=\"m\">가정하다, 추정하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Witnessing<\/span><\/b><\/span><span class=\"ko\">목격하는 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">how poorly traditional societies are faring<\/span><\/b><\/span><span class=\"ko\">전통 사회들이 얼마나 형편없이 살아가고 있는지를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as they undergo a nutrition transition<\/b><\/span><span class=\"ko\">영양 전환을 겪으면서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>should <span class=\"grammar-hl\">make those who have already completed it<\/span><\/b><\/span><span class=\"ko\">이미 그것을 완료한 사람들로 하여금<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">question<\/span><\/b><\/span><span class=\"ko\">의문을 제기하게 만들어야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>whether their diets have moved too far.<\/b><\/span><span class=\"ko\">자신들의 식단이 너무 멀리 간 것은 아닌지<\/span><\/div><\/div><div class=\"lec-sent-ko\">전통 사회들이 영양 전환을 겪으면서 얼마나 형편없이 살아가고 있는지를 목격하는 것은 이미 그것(전환)을 완료한 이들로 하여금 자신들의 식단이 너무 멀리 간 것은 아닌지 의문을 제기하도록 만들어야 할 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> how poorly traditional societies are faring은 고유의 식단을 버리고 서구화된 현대 식단을 받아들인 공동체들이 각종 질병에 시달리는 비참한 현실을 의미합니다. 이는 현대인들에게 지금의 식습관이 진화의 궤도에서 너무 벗어나 건강을 해치고 있음을 경고하며 글을 마무리합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Witnessing (동명사): 문장에서 주어 역할을 하는 명사적 용법으로 쓰였다.<\/div><div class=\"lec-gr-item\">how poorly traditional societies are faring (간접의문문): &#39;의문사(how poorly) + 주어(traditional societies) + 동사(are faring)&#39; 어순으로 Witnessing의 목적어 역할을 한다.<\/div><div class=\"lec-gr-item\">make those who have already completed it question 5형식(SVOC) 구조: 사역동사 make + 목적어(those ~ it) + 목적격보어(동사원형 question) 구조다.<\/div><div class=\"lec-gr-item\">who have already completed (관계대명사): 주격 관계대명사로 선행사 those를 수식하며, 뒤에 주어가 없는 불완전한 절이 이어진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">diet<\/td><td class=\"m\">식단, 먹는 것<\/td><\/tr><tr><td class=\"w\">nutrition<\/td><td class=\"m\">영양<\/td><\/tr><tr><td class=\"w\">diet<\/td><td class=\"m\">식단, 먹는 것<\/td><\/tr><tr><td class=\"w\">nutrition<\/td><td class=\"m\">영양<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>인류는 아주 오랜 시간 동안 주변 자원을 최적으로 섭취하도록 복잡하게 진화해 왔다.<\/li><li>현대 영양학은 역사가 짧아 인체의 신비를 다 알지 못하므로, 함부로 식단을 바꾸는 것은 위험한 실험이다.<\/li><li>수천 년간 먹어온 전통 음식에는 과학이 밝혀내지 못한 지혜와 타당한 이유가 담겨 있다.<\/li><li>현대적 기준에 맞춘 가공식품보다 전통적인 방식의 음식을 선택하는 것이 건강에 더 이롭다.<\/li><li>식단 변화로 고통받는 전통 사회의 사례는 현대 식단이 잘못된 방향으로 가고 있음을 보여준다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">We should prioritize long-standing traditional diets over modern processed foods because nutritional science is still too young to fully understand the complex evolutionary reasons behind ancestral eating habits.<\/div>\n              <div class=\"lec-final-sum-ko\">영양 과학은 아직 초기 단계에 있기 때문에, 조상들의 식습관 뒤에 숨겨진 복잡한 진화적 이유를 존중하며 현대의 가공식품보다 전통 식단을 우선시해야 한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_29번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_29번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_29번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_29번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_29번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_29번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_29번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2025년_10월_29번_강의_audio/8.mp3" ating Habits Matter","titleKo":"혁신보다 전통: 수천 년의 식습관이 중요한 이유","imageUrl":"__enpImg__","stages":[{"label":"01인류의 진화와 영양 실험","items":["인간은 가용한 자원을 최대한 활용하도록 진화해 왔으며, 급격한 식단 변화는 일종의 위험한 실험이다.","인간은 자원을 활용하는 복잡하고 미묘한 방식(subtle and complicated)으로 진화함","갑작스러운 식단 변화는 거대한 영양 실험(huge experiments)과 같음","핵심 키워드: 인류의 진화(evolve)"]},{"label":"02영양 과학의 한계와 겸손","items":["현대 영양 과학은 여전히 초기 단계에 머물러 있으므로 과학적 사실에 대해 겸손한 태도를 가져야 한다.","영양 과학(nutritional science)은 아직 미성숙한 상태임","우리가 모르는 것이 많으므로 겸손(humility)이 필요함","핵심 키워드: 영양 과학의 한계(science is still young)"]},{"label":"03전통 식단의 타당성","items":["수천 년간 유지되어 온 전통적인 식사 방식에는 그 나름의 합당한 이유가 존재할 가능성이 크다.","수천 년(millennia) 동안 먹어 온 방식에는 정당한 이유(good reason)가 있음","현대적 기준에 맞지 않더라도 전통 음식을 우선적으로 선택해야 함","핵심 키워드: 전통 식단(traditional foods)"]},{"label":"04가공식품 대비 전통 식품의 우월성","items":["공장에서 만든 가공식품보다 지방이 많거나 천연 상태인 전통 식품이 더 나은 선택일 수 있다.","가공된 살라미보다 전통적인 선지 소시지(fatty blood sausages)가 선호됨","감미료(sweeteners)보다 천연 꿀(honey)이 더 우수함","핵심 키워드: 가공식품(highly processed ones)"]},{"label":"05영양 전이의 부작용과 성찰","items":["전통 사회가 현대적 식단으로 변하며 겪는 어려움을 보고 현대 식단의 방향성을 재고해야 한다.","영양 전이(nutrition transition)를 겪는 전통 사회의 부정적 사례","현대인의 식단이 너무 멀리 나아간 것은 아닌지 자문(question)해야 함","핵심 키워드: 현대 식단에 대한 의구심(moved too far)"]}],"bkg":"인류는 아주 오랜 시간 동안 주변 환경에 맞춰 최적의 영양을 섭취하도록 진화적 적응(Evolutionary Adaptation)을 거쳐왔는데, 이는 마치 수천 년에 걸쳐 정교하게 업데이트된 생존 매뉴얼과도 같습니다. 하지만 최근 현대 사회에서는 가공식품 위주의 서구식 식단으로 급격히 변화하는 영양 전환(Nutrition Transition) 현상이 나타나고 있으며, 이는 우리 몸이 미처 대비하지 못한 거대한 생물학적 실험이 되고 있습니다. 우리가 흔히 접하는 가공식품은 특정 영양소만을 추출하거나 합성 성분을 더하는 경우가 많지만, 전통 식단은 여러 성분이 상호작용하여 건강 효과를 극대화하는 식품 시너지(Food Synergy) 효과를 품고 있는 경우가 많습니다. 아직 걸음마 단계인 영양학(Nutritional Science)이 복잡한 우리 몸의 모든 원리를 다 설명하지 못하기 때문에, 과학적 데이터가 모든 것을 증명하기 전까지는 오랜 시간 검증된 전통적인 식문화의 지혜를 존중하는 태도가 필요합니다.","ttsText":"인류는 아주 오랜 시간 동안 주변 환경에 맞춰 최적의 영양을 섭취하도록 진화적 적응(Evolutionary Adaptation)을 거쳐왔는데, 이는 마치 수천 년에 걸쳐 정교하게 업데이트된 생존 매뉴얼과도 같습니다. 하지만 최근 현대 사회에서는 가공식품 위주의 서구식 식단으로 급격히 변화하는 영양 전환(Nutrition Transition) 현상이 나타나고 있으며, 이는 우리 몸이 미처 대비하지 못한 거대한 생물학적 실험이 되고 있습니다. 우리가 흔히 접하는 가공식품은 rly) + 주어(traditional societies) + 동사(are faring)' 어순으로 Witnessing의 목적어 역할을 한다. make those who have already completed it question 5형식(SVOC) 구조: 사역동사 make + 목적어(those ~ it) + 목적격보어(동사원형 question) 구조다. who have already completed (관계대명사): 주격 관계대명사로 선행사 those를 수식하며, 뒤에 주어가 없는 불완전한 절이 이어진다.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 29번","passageName":"모의고사 / 고1 / 2025년 / 10월 / 29번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 29번"},{"kind":"summary","passageName":"모의고사 / 고1 / 2025년 / 10월 / 29번","imageUrl":"__enpImg__","sumEn":"We should prioritize long-standing traditional diets over modern processed foods because nutritional science is still too young to fully understand the complex evolutionary reasons behind ancestral eating habits.","sumKo":"영양 과학은 아직 초기 단계에 있기 때문에, 조상들의 식습관 뒤에 숨겨진 복잡한 진화적 이유를 존중하며 현대의 가공식품보다 전통 식단을 우선시해야 한다.","bullets":[],"overall":["인류는 아주 오랜 시간 동안 주변 자원을 최적으로 섭취하도록 복잡하게 진화해 왔다.","현대 영양학은 역사가 짧아 인체의 신비를 다 알지 못하므로, 함부로 식단을 바꾸는 것은 위험한 실험이다.","수천 년간 먹어온 전통 음식에는 과학이 밝혀내지 못한 지혜와 타당한 이유가 담겨 있다.","현대적 기준에 맞춘 가공식품보다 전통적인 방식의 음식을 선택하는 것이 건강에 더 이롭다.","식단 변화로 고통받는 전통 사회의 사례는 현대 식단이 잘못된 방향으로 가고 있음을 보여준다."],"compare":{"headers":["구분","전통적 식단 (과거)","현대적/가공 식단 (현재)"],"rows":[["검증 기간","수천 년간의 진화와 적응","최근의 급격한 변화 (실험적)"],["과학적 기준","수치화하기 힘든 복잡한 지혜","현대 영양학의 단편적 기준"],["식품 특성","블러드 소시지, 꿀 (천연/지방 포함)","살라미, 감미료 (공장제/가공)"],["건강 결과","인류 자원의 최적 활용","영양 변천에 따른 건강 악화"]]},"ttsText":"인류는 아주 오랜 시간 동안 주변 자원을 최적으로 섭취하도록 복잡하게 진화해 왔다. 현대 영양학은 역사가 짧아 인체의 신비를 다 알지 못하므로, 함부로 식단을 바꾸는 것은 위험한 실험이다. 수천 년간 먹어온 전통 음식에는 과학이 밝혀내지 못한 지혜와 타당한 이유가 담겨 있다. 현대적 기준에 맞춘 가공식품보다 전통적인 방식의 음식을 선택하는 것이 건강에 더 이롭다. 식단 변화로 고통받는 전통 사회의 사례는 현대 식단이 잘못된 방향으로 가고 있음을 보여준다.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 29번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 29번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 인류는 아주 오랜 시간 동안 주변 자원을 최적으로 섭취하도록 복잡하게 진화해 왔습니다. 현대 영양학은 역사가 짧아 인체의 신비를 다 알지 못하므로, 함부로 식단을 바꾸는 것은 위험한 실험입니다. 수천 년간 먹어온 전통 음식에는 과학이 밝혀내지 못한 지혜와 타당한 이유가 담겨 있습니다. 현대적 기준에 맞춘 가공식품보다 전통적인 방식의 음식을 선택하는 것이 건강에 더 이롭습니다.     let gesture = null;

    const interactive = el => el && el.closest('a,button,input,textarea,select,video,audio,canvas,[contenteditable="true"],[role="slider"]');
    const scrollsHorizontally = target => {
      for (let el = target; el && root.contains(el); el = el.parentElement) {
        if (el.scrollWidth > el.clientWidth + 2 && /^(auto|scroll)$/.test(getComputedStyle(el).overflowX)) return true;
        if (el === root) break;
      }
      return false;
    };
    root.addEventListener('touchstart', e => {
      gesture = null;
      if (e.touches.length !== 1 || zoomed() || selected() || interactive(e.target) || scrollsHorizontally(e.target)) return;
      const t = e.touches[0];
      // 화면 가장자리는 휴대폰 브라우저의 뒤로/앞으로 제스처에 맡긴다.
      if (t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
      gesture = { id: t.identifier, x: t.clientX, y: t.clientY, time: Date.now(), page: pageIndex(), horizontal: false };
