t6/1qAv+f8AP6fXkYo/z/n/AA/xpMg9CD+Pp1/Kk3AckjHQYPU/p6j6etH9K/636gLjGSOv55647j/9XH0D+Pp3/wA/jRxxz0z39ODn1wcA9cHrzS8dfT9Oh/wph/XqH0/A9f60U0MrDqMHPf25z6Y/lzRuAGc8A4yT6e/8uuePXgAd157UdPf/AD+v9aTP69Mkc57fhxRkev6/j/L9KP6/ruAtH5e/+P8An8+OUyMZzx+f8qWgApGJ2kjHTPfkfhz+VGRxyOT6+nXp6d+3Y0McAn0BPr0Hp3o0t5fhYD//2Q==\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">Making the Functional Outdated: The Power of Perceived Obsolescence<small>기능적인 것을 구식으로 만들기: 인식된 구식화의 힘<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">이 글을 온전히 이해하려면 기업이 소비를 지속적으로 유도하기 위해 활용하는 전략인 계획적 구식화(Planned Obsolescence)라는 개념을 먼저 알아두는 것이 좋습니다. 특히 지문은 제품의 기능이 멀쩡함에도 불구하고 유행에 뒤처졌다는 느낌을 주어 새것을 사게 만드는 심리적 구식화(Perceived Obsolescence)의 원리를 잘 보여주고 있어요. 예를 들어, 튼튼한 패딩이 이미 옷장에 있는데도 올해 유행하는 새로운 핏이나 색상(New Trends)이 아니라는 이유로 소비자가 스스로 자신의 옷을 &#39;못 입는 것&#39;으로 여기게 만드는 마케팅 기법이 대표적인 사례입니다. 이러한 전략은 과거 패션 산업에서 시작되었지만, 이제는 정보기술 기기(IT Devices)나 가전제품 등 우리 삶의 전 영역으로 확대되어 현대 사회의 대량 소비(Mass Consumption)를 지탱하는 핵심적인 심리 기제로 작용하고 있습니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01용어 정의<\/div><ul><li>상품을 구매하는 고객과 이를 직접 사용하는 소비자의 개념을 정의한다.<\/li><li>상품 구매자(customer)와 이를 소모하는 주체인 소비자(consumer)<\/li><li>소비자(consumer)는 말 그대로 소모하는 존재임을 강조<\/li><li>핵심 키워드: 소비자(consumer)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02기업의 목적<\/div><ul><li>기업은 생산된 제품이 더 많이, 더 자주 소비되도록 보장하는 방법을 고안한다.<\/li><li>소비량(larger quantities)의 증대 유도<\/li><li>소비 빈도(more frequently)를 높이기 위한 전략 수립<\/li><li>핵심 키워드: 소비(consume)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03상품 유형별 차이<\/div><ul><li>식품과 달리 내구재는 소비자가 계속 구매하게 만들 별도의 이유가 필요하다.<\/li><li>식품(food)은 실제 소모되어 항상 새로운 구매 욕구가 발생함<\/li><li>반영구적인 물건(permanent things)은 인위적인 소비 명분이 필요함<\/li><li>핵심 키워드: 재구매 필요성(need to purchase)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04유행을 통한 구식화<\/div><ul><li>멀쩡한 물건을 유행이 지난 것으로 인식시켜 새로운 소비를 유도한다.<\/li><li>기존 제품을 유행에 뒤떨어진 것(outdated)으로 인식하게 설득<\/li><li>기능적으로 완벽(perfectly functionable)해도 새 제품을 사게 함<\/li><li>핵심 키워드: 유행(fashion)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05소비 영역의 확장<\/div><ul><li>유행을 이용한 마케팅 전략은 의류를 넘어 모든 산업 영역으로 무한히 확장된다.<\/li><li>자동차, 휴대폰, 컴퓨터 등으로 패션의 논리가 적용됨<\/li><li>마케팅 부서(marketing divisions)의 창의성에 의해 품목이 확장됨<\/li><li>핵심 키워드: 무한한 확장(extended indefinitely)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">permanent<\/td><td class=\"m\">영구적인, 지속되는<\/td><\/tr><tr><td class=\"w\">invent<\/td><td class=\"m\">발명하다<\/td><\/tr><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">continue<\/td><td class=\"m\">계속하다, 계속되다<\/td><\/tr><tr><td class=\"w\">consume<\/td><td class=\"m\">먹다, 섭취하다<\/td><\/tr><tr><td class=\"w\">purchase<\/td><td class=\"m\">구매하다<\/td><\/tr><tr><td class=\"w\">individual<\/td><td class=\"m\">개인<\/td><\/tr><tr><td class=\"w\">being<\/td><td class=\"m\">존재, 생명체<\/td><\/tr><tr><td class=\"w\">therefore<\/td><td class=\"m\">그러므로<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">multiple<\/td><td class=\"m\">다수의, 여러<\/td><\/tr><tr><td class=\"w\">ensure<\/td><td class=\"m\">확실히 하다, 보장하다<\/td><\/tr><tr><td class=\"w\">produce<\/td><td class=\"m\">생산하다, 만들어 내다<\/td><\/tr><tr><td class=\"w\">item<\/td><td class=\"m\">항목, 물품<\/td><\/tr><tr><td class=\"w\">quantity<\/td><td class=\"m\">양<\/td><\/tr><tr><td class=\"w\">frequently<\/td><td class=\"m\">자주, 빈번히<\/td><\/tr><tr><td class=\"w\">literally<\/td><td class=\"m\">말 그대로<\/td><\/tr><tr><td class=\"w\">approach<\/td><td class=\"m\">접근법, 방식<\/td><\/tr><tr><td class=\"w\">stuff<\/td><td class=\"m\">물건, 것<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Those <span class=\"grammar-hl\">who purchase<\/span> the goods of a company<\/b><\/span><span class=\"ko\">어떤 회사의 상품을 구매하는 사람들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">are called<\/span><\/b><\/span><span class=\"ko\">불린다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">customers<\/span>.<\/b><\/span><span class=\"ko\">고객이라고.<\/span><\/div><\/div><div class=\"lec-sent-ko\">어떤 회사의 상품을 구매하는 사람들은 고객이라 불린다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> Those who purchase는 특정 기업의 제품이나 서비스를 돈을 내고 사는 행위를 하는 주체를 가리킵니다. 글의 도입부에서 기업과 거래 관계에 있는 사람을 &#39;고객&#39;이라는 용어로 정의하며 이야기를 시작하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who purchase (관계대명사): 주격 관계대명사로 선행사인 Those를 수식하며, 뒤에 동사 purchase가 이어지는 불완전한 절을 이끈다.<\/div><div class=\"lec-gr-item\">are called customers (수동태): be동사(are)+p.p.(called) 구조. call은 타동사로 call+O+C(5형식) 구조인데 목적어가 주어로 올라가 수동구조 are called가 되고, 목적격보어(customers)는 그대로 남는다. 기본구조: call + O + C<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">purchase<\/td><td class=\"m\">구매하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Individuals <span class=\"grammar-hl\">who purchase<\/span> goods for personal use<\/b><\/span><span class=\"ko\">개인적인 용도로 상품을 구매하는 사람들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">are called<\/span><\/b><\/span><span class=\"ko\">불린다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">consumers<\/span>: beings <span class=\"grammar-hl\">who consume<\/span>.<\/b><\/span><span class=\"ko\">소비자, 즉 소비하는 존재라고.<\/span><\/div><\/div><div class=\"lec-sent-ko\">개인적인 용도로 상품을 구매하는 사람들은 소비자, 즉 소비하는 존재라 불린다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> beings who consume은 물건을 단순히 사는 것에서 나아가, 그것을 써서 없애거나 활용하는 &#39;소비&#39;라는 행위에 초점을 맞춘 표현입니다. 앞 문장의 &#39;고객&#39;보다 한 단계 더 나아가, 물건을 실제로 사용하는 주체로서의 성격을 강조하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who purchase (관계대명사): 주격 관계대명사로 선행사 Individuals를 수식한다.<\/div><div class=\"lec-gr-item\">are called consumers (수동태): be동사(are)+p.p.(called) 구조. call은 타동사로 call+O+C(5형식) 구조인데 목적어가 주어로 올라가 수동구조 are called가 되고, 목적격보어(consumers)는 그대로 남는다. 기본구조: call + O + C<\/div><div class=\"lec-gr-item\">who consume (관계대명사): 주격 관계대명사로 선행사 beings를 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consume<\/td><td class=\"m\">먹다, 섭취하다<\/td><\/tr><tr><td class=\"w\">purchase<\/td><td class=\"m\">구매하다<\/td><\/tr><tr><td class=\"w\">individual<\/td><td class=\"m\">개인<\/td><\/tr><tr><td class=\"w\">being<\/td><td class=\"m\">존재, 생명체<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Therefore,<\/b><\/span><span class=\"ko\">따라서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>companies have invented<\/b><\/span><span class=\"ko\">기업들은 고안해 왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>multiple ways<\/b><\/span><span class=\"ko\">다양한 방법들을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to ensure<\/span><\/b><\/span><span class=\"ko\">반드시 ~하게 하기 위한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that their customers consume the <span class=\"grammar-hl\">produced<\/span> items<\/b><\/span><span class=\"ko\">그들의 고객이 생산된 물품을 소비하도록<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in larger and larger quantities<\/b><\/span><span class=\"ko\">점점 더 많은 양으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and more and more frequently.<\/b><\/span><span class=\"ko\">그리고 점점 더 자주.<\/span><\/div><\/div><div class=\"lec-sent-ko\">따라서, 기업들은 그들의 고객이 생산된 물품을 반드시 점점 더 많이 점점 더 자주 소비하게 하기 위한 다양한 방법들을 고안해 왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> ensure that their customers consume은 기업이 단순히 물건을 파는 데 그치지 않고, 사람들이 더 많이, 더 자주 물건을 쓰게끔 상황을 유도한다는 의미입니다. 앞서 정의한 &#39;소비자&#39;의 특성을 이용해 기업이 수익을 극대화하려는 전략적 움직임을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to ensure (to부정사(형용사적)): 명사 multiple ways를 수식하며 &#39;~할 방법&#39;으로 해석된다. ability/way/time 등 명사의 내용을 한정하므로 형용사적 용법이다.<\/div><div class=\"lec-gr-item\">produced (과거분사(형용사)): produced가 뒤의 명사 items를 수식하며 &#39;생산된 품목&#39;이라는 수동의 의미를 나타낸다. items that were produced와 같은 축약 관계절로 볼 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">invent<\/td><td class=\"m\">발명하다<\/td><\/tr><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">consume<\/td><td class=\"m\">먹다, 섭취하다<\/td><\/tr><tr><td class=\"w\">therefore<\/td><td class=\"m\">그러므로<\/td><\/tr><tr><td class=\"w\">multiple<\/td><td class=\"m\">다수의, 여러<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ensure<\/td><td class=\"m\">확실히 하다, 보장하다<\/td><\/tr><tr><td class=\"w\">produce<\/td><td class=\"m\">생산하다, 만들어 내다<\/td><\/tr><tr><td class=\"w\">item<\/td><td class=\"m\">항목, 물품<\/td><\/tr><tr><td class=\"w\">quantity<\/td><td class=\"m\">양<\/td><\/tr><tr><td class=\"w\">frequently<\/td><td class=\"m\">자주, 빈번히<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Those <span class=\"grammar-hl\">who sell<\/span> food<\/b><\/span><span class=\"ko\">음식을 판매하는 사람들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>have an easy time,<\/b><\/span><span class=\"ko\">수월한 편이다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for food <span class=\"grammar-hl\">is literally consumed<\/span>,<\/b><\/span><span class=\"ko\">왜냐하면 음식은 말 그대로 소비되므로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so there is always a need<\/b><\/span><span class=\"ko\">그래서 항상 필요가 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to purchase<\/span> new food.<\/b><\/span><span class=\"ko\">새로운 음식을 구매할.<\/span><\/div><\/div><div class=\"lec-sent-ko\">음식을 판매하는 사람들은 수월한 편인데, 왜냐하면 음식은 말 그대로 소비되므로, 새로운 음식을 구매할 필요는 항상 있기 때문이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> have an easy time은 식품 판매자가 마케팅에 큰 공을 들이지 않아도 소비자가 알아서 다시 찾아온다는 뜻입니다. 음식은 먹으면 사라지는 literally consumed의 특성이 있어, 생존을 위해 반복 구매가 자연스럽게 일어나는 상황을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who sell (관계대명사): 주격 관계대명사로 선행사 Those를 수식한다.<\/div><div class=\"lec-gr-item\">is literally consumed (수동태): be동사(is)+p.p.(consumed) 구조. consume은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is consumed 형태로 쓴다. 기본구조: V + O<\/div><div class=\"lec-gr-item\">to purchase (to부정사(형용사적)): 명사 need를 수식하며 &#39;~할 필요&#39;로 해석된다. need + to V 구조에서 명사의 내용을 한정하므로 형용사적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consume<\/td><td class=\"m\">먹다, 섭취하다<\/td><\/tr><tr><td class=\"w\">purchase<\/td><td class=\"m\">구매하다<\/td><\/tr><tr><td class=\"w\">literally<\/td><td class=\"m\">말 그대로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But<\/b><\/span><span class=\"ko\">하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with more permanent things,<\/b><\/span><span class=\"ko\">보다 영구적인 물건의 경우,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>companies must invent<\/b><\/span><span class=\"ko\">기업들은 만들어 내야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>reasons<\/b><\/span><span class=\"ko\">이유를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">for their customers<\/span><\/b><\/span><span class=\"ko\">그들의 고객이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to continue<\/span> <span class=\"grammar-hl\">to consume<\/span> them.<\/b><\/span><span class=\"ko\">그것들을 계속 소비할.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러나 보다 영구적인 물건의 경우, 기업들은 고객이 그것들을 계속 소비할 이유를 만들어 내야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> invent reasons는 물건이 망가지지 않았음에도 불구하고 소비자가 새것을 사고 싶게 만드는 인위적인 명분을 만든다는 의미입니다. 앞 문장의 식품과 대조하여, 가전이나 가구처럼 오래 쓰는 물건을 파는 기업이 직면한 어려움과 이를 극복하려는 노력을 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">for their customers to continue (to부정사(형용사적)): 명사 reasons를 수식한다. for their customers는 to부정사의 의미상 주어이며, 전체 어구가 명사를 수식하고 있으므로 형용사적 용법이다.<\/div><div class=\"lec-gr-item\">to consume (to부정사(명사적)): 동사 continue의 목적어로 쓰여 &#39;~하는 것을 (계속하다)&#39;이라는 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">permanent<\/td><td class=\"m\">영구적인, 지속되는<\/td><\/tr><tr><td class=\"w\">invent<\/td><td class=\"m\">발명하다<\/td><\/tr><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">continue<\/td><td class=\"m\">계속하다, 계속되다<\/td><\/tr><tr><td class=\"w\">consume<\/td><td class=\"m\">먹다, 섭취하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>One approach<\/b><\/span><span class=\"ko\">한 가지 접근법은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is <span class=\"grammar-hl\">to make<\/span> the stuff<\/b><\/span><span class=\"ko\">물건을 만드는 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that people already have<\/span><\/b><\/span><span class=\"ko\">사람들이 이미 가지고 있는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>outdated<\/b><\/span><span class=\"ko\">구식이 되게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by <span class=\"grammar-hl\">convincing<\/span> them<\/b><\/span><span class=\"ko\">그들에게 설득함으로써<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that it is no longer fashionable.<\/b><\/span><span class=\"ko\">그것이 더 이상 유행하지 않는다고.<\/span><\/div><\/div><div class=\"lec-sent-ko\">한 가지 접근법은 사람들이 이미 가지고 있는 물건이 더 이상 유행하지 않는다고 설득하여 그것을 구식이 되게 하는 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> make the stuff... outdated는 물건의 물리적 수명이 다한 것이 아니라, 심리적으로 가치가 떨어졌다고 느끼게 만든다는 의미입니다. 기업이 소비자의 인식을 조작하여 멀쩡한 물건을 버리게 만드는 구체적인 수법을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to make (to부정사(명사적)): 문장의 주격 보어 자리에서 &#39;~하는 것&#39;이라는 의미로 쓰였다.<\/div><div class=\"lec-gr-item\">make the stuff ... outdated 5형식(SVOC) 구조: 동사 make + 목적어(the stuff...) + 목적격보어(outdated) 구조로 &#39;목적어를 형용사(p.p.)한 상태로 만들다&#39;라는 의미를 가진다.<\/div><div class=\"lec-gr-item\">that people already have (관계대명사): 목적격 관계대명사로 선행사 stuff를 수식하며, 동사 have의 목적어가 비어 있는 불완전한 절을 이끈다.<\/div><div class=\"lec-gr-item\">convincing (동명사): 전치사 by의 목적어로 쓰여 &#39;행위&#39;를 나타내는 명사 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">approach<\/td><td class=\"m\">접근법, 방식<\/td><\/tr><tr><td class=\"w\">stuff<\/td><td class=\"m\">물건, 것<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The entire fashion industry<\/b><\/span><span class=\"ko\">전체 패션 산업은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">is built<\/span><\/b><\/span><span class=\"ko\">만들어져 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to convince<\/span> people<\/b><\/span><span class=\"ko\">사람들을 설득하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that fashion matters,<\/b><\/span><span class=\"ko\">유행이 중요하다고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so they must purchase<\/b><\/span><span class=\"ko\">그래서 그들은 구매해야 한다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>new clothing,<\/b><\/span><span class=\"ko\">새 옷을,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>even though the old<\/b><\/span><span class=\"ko\">비록 기존의 것이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is still perfectly functionable.<\/b><\/span><span class=\"ko\">여전히 완벽하게 기능하더라도.<\/span><\/div><\/div><div class=\"lec-sent-ko\">전체 패션 산업은 기존 옷이 여전히 완벽하게 기능하더라도, 유행이 중요하고 그래서 그들이 새 옷을 사야 한다고 사람들을 설득하기 위해 만들어져 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> perfectly functionable은 옷이 해지거나 못 입게 된 상태가 아니라 여전히 제 기능을 다 할 수 있는 상태임을 강조합니다. 패션 산업이 &#39;유행&#39;이라는 명분을 통해 불필요한 소비를 정당화하고 있음을 보여주는 사례입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is built (수동태): be동사(is)+p.p.(built) 구조. build는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is built 형태로 쓴다. 기본구조: V + O<\/div><div class=\"lec-gr-item\">to convince (to부정사(부사적): 목적): &#39;~하기 위해서&#39;라는 의도를 나타내며, in order to convince로 바꾸어도 의미가 성립한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">purchase<\/td><td class=\"m\">구매하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Fashion today<\/b><\/span><span class=\"ko\">오늘날 유행은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>extends<\/b><\/span><span class=\"ko\">확장된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to far more things than clothes:<\/b><\/span><span class=\"ko\">옷보다 훨씬 많은 것들로:<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>automobiles, mobile phones, computers —<\/b><\/span><span class=\"ko\">자동차, 휴대 전화, 컴퓨터 —<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the list<\/b><\/span><span class=\"ko\">그 목록은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">is extended<\/span><\/b><\/span><span class=\"ko\">확장된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>indefinitely,<\/b><\/span><span class=\"ko\">무한하게,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">limited<\/span> only<\/b><\/span><span class=\"ko\">오직 제한될 뿐이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by the limits<\/b><\/span><span class=\"ko\">한계에 의해서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of the creative minds<\/b><\/span><span class=\"ko\">창의적 사고의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of the marketing divisions<\/b><\/span><span class=\"ko\">마케팅 부서의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of companies.<\/b><\/span><span class=\"ko\">기업들에 속한.<\/span><\/div><\/div><div class=\"lec-sent-ko\">오늘날 유행은 옷을 넘어 자동차, 휴대 전화, 컴퓨터 등 훨씬 많은 것들로 확장된다. 그 목록은 끝없이 확장되며, 다만 기업에 속한 마케팅 부서의 창의적 사고의 한계에 의해서만 제한될 뿐이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> limited only by the limits of the creative minds는 기업의 마케팅 부서가 머리를 써서 새로운 유행을 만들어내기만 하면, 세상의 거의 모든 물건이 교체 주기가 짧은 소비재가 될 수 있다는 의미입니다. 유행을 통한 소비 촉진 전략이 전 산업 분야로 퍼져나갔음을 결론적으로 제시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is extended (수동태): be동사(is)+p.p.(extended) 구조. extend는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is extended 형태로 쓴다. 기본구조: V + O<\/div><div class=\"lec-gr-item\">limited (분사구문): 과거분사 p.p.로 시작하는 분사구문이며, 절의 의미상 &#39;그리고 그것은 ~에 의해 제한된다&#39;는 의미이므로 as it is limited ... 와 같은 &#39;접속사+주어+동사&#39;의 절로 변환할 수 있다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>기업의 물건을 사고 사용하는 사람들을 고객이자 소비자라고 부른다.<\/li><li>기업은 수익을 위해 사람들이 더 많이, 더 자주 물건을 소비하게 유도한다.<\/li><li>식품은 쓰면 사라지기에 반복 구매가 쉽지만, 내구재는 소비자가 계속 사게 할 이유를 따로 만들어야 한다.<\/li><li>이를 위해 기업은 &#39;유행&#39;이라는 개념을 도입해 멀쩡한 물건을 구식으로 느끼게 만든다.<\/li><li>현재는 옷뿐만 아니라 자동차, 가전 등 거의 모든 제품에 이러한 유행 전략이 적용되어 무한한 소비를 부추기고 있다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Companies drive continuous consumption by convincing consumers that their functional products are outdated through psychological marketing strategies.<\/div>\n              <div class=\"lec-final-sum-ko\">기업들은 심리적인 마케팅 전략을 통해 소비자들이 자신들의 멀쩡한 제품이 구식이라고 믿게 함으로써 지속적인 소비를 유도한다.<\/div><\/div><\/div>"],"segs":[[{"audi 년_10월_39번_강의_audio/31.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_39번_강의_audio/32.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_39번_강의_audio/33.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_39번_강의_audio/34.mp3","hl":null}]],"fileName":"모의고사_고1_2025년_10월_39번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 10월 / 39번","titleEn":"Making the Functional Outdated: The Power of Perceived Obsolescence","titleKo":"기능적인 것을 구식으로 만들기: 인식된 구식화의 힘","imageUrl":"__enpImg__","stages":[{"label":"01용어 정의","items":["상품을 구매하는 고객과 이를 직접 사용하는 소비자의 개념을 정의한다.","상품 구매자(customer)와 이를 소모하는 주체인 소비자(consumer)","소비자(consumer)는 말 그대로 소모하는 존재임을 강조","핵심 키워드: 소비자(consumer)"]},{"label":"02기업의 목적","items":["기업은 생산된 제품이 더 많이, 더 자주 소비되도록 보장하는 방법을 고안한다.","소비량(larger quantities)의 증대 유도","소비 빈도(more frequently)를 높이기 위한 전략 수립","핵심 키워드: 소비(consume)"]},{"label":"03상품 유형별 차이","items":["식품과 달리 내구재는 소비자가 계속 구매하게 만들 별도의 이유가 필요하다.","식품(food)은 실제 소모되어 항상 새로운 구매 욕구가 발생함","반영구적인 물건(permanent things)은 인위적인 소비 명분이 필요함","핵심 키워드: 재구매 필요성(need to purchase)"]},{"label":"04유행을 통한 구식화","items":["멀쩡한 물건을 유행이 지난 것으로 인식시켜 새로운 소비를 유도한다.","기존 제품을 유행에 뒤떨어진 것(outdated)으로 인식하게 설득","기능적으로 완벽(perfectly functionable)해도 새 제품을 사게 함","핵심 키워드: 유행(fashion)"]},{"label":"05소비 영역의 확장","items":["유행을 이용한 마케팅 전략은 의류를 넘어 모든 산업 영역으로 무한히 확장된다.","자동차, 휴대폰, 컴퓨터 등으로 패션의 논리가 적용됨","마케팅 부서(marketing divisions)의 창의성에 의해 품목이 확장됨","핵심 키워드: 무한한 확장(extended indefinitely)"]}],"bkg":"이 글을 온전히 이해하려면 기업이 소비를 지속적으로 유도하기 위해 활용하는 전략인 계획적 구식화(Planned Obsolescence)라는 개념을 먼저 알아두는 것이 좋습니다. 특히 지문은 제품의 기능이 멀쩡함에도 불구하고 유행에 뒤처졌다는 느낌을 주어 새것을 사게 만드는 심리적 구식화(Perceived Obsolescence)의 원리를 잘 보여주고 있어요. 예를 들어, 튼튼한 패딩이 이미 옷장에 있는데도 올해 유행하는 새로운 핏이나 색상(New Trends)이 아니라는 이유로 소비자가 스스로 자신의 옷을 '못 입는 것'으로 여기게 만드는 마케팅 기법이 대표적인 사례입니다. 이러한 전략은 과거 패션 산업에서 시작되었지만, 이제는 정보기술 기기(IT Devices)나 가전제품 등 우리 삶의 전 영역으로 확대되어 현대 사회의 대량 소비(Mass Consumption)를 지탱하는 핵심적인 심리 기제로 작용하고 있습니다.","ttsTex       const t = e.touches[0];
