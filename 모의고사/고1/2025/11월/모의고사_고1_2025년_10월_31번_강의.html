v><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03오류의 고착화<\/div><ul><li>잘못된 수치는 즉시 수정되었으나, 대중은 수정된 사실보다 자극적인 신화를 더 빨리 받아들였다.<\/li><li>오류의 수정(correction)은 사람들에게 금방 잊혀짐<\/li><li>신화가 대중의 인식 속에 확고히 자리를 잡음(taken hold)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04대중문화에 의한 강화<\/div><ul><li>만화 캐릭터 뽀빠이는 시금치 신화가 대중의 기억 속에 오래 남도록 기여했다.<\/li><li>시금치를 먹고 초인적인 힘(superhuman strength)을 얻는 설정<\/li><li>캐릭터의 인기가 신화의 내구력(endurance)을 높임<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05현대까지 이어지는 영향<\/div><ul><li>오류가 발생한 지 약 150년이 지난 지금까지도 이 신화는 실생활에서 활용되고 있다.<\/li><li>부모들이 자녀에게 채소를 먹이려고 설득(persuade)하는 도구로 사용<\/li><li>전 세계적으로 여전히 유효한 건강 관련 설화로 남음<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">myth<\/td><td class=\"m\">근거 없는 믿음, 신화<\/td><\/tr><tr><td class=\"w\">persist<\/td><td class=\"m\">계속되다, 고집하다<\/td><\/tr><tr><td class=\"w\">suppose<\/td><td class=\"m\">가정하다, 생각하다<\/td><\/tr><tr><td class=\"w\">content<\/td><td class=\"m\">내용, 내용물<\/td><\/tr><tr><td class=\"w\">originate<\/td><td class=\"m\">비롯되다, 시작되다<\/td><\/tr><tr><td class=\"w\">accurate<\/td><td class=\"m\">정확한<\/td><\/tr><tr><td class=\"w\">determined<\/td><td class=\"m\">단호한, 굳게 결심한<\/td><\/tr><tr><td class=\"w\">contain<\/td><td class=\"m\">포함하다, 담고 있다<\/td><\/tr><tr><td class=\"w\">analyze<\/td><td class=\"m\">분석하다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hold<\/td><td class=\"m\">잡다, 유지하다<\/td><\/tr><tr><td class=\"w\">amount<\/td><td class=\"m\">양, 액수<\/td><\/tr><tr><td class=\"w\">leafy<\/td><td class=\"m\">나무가 많은, 잎이 무성한<\/td><\/tr><tr><td class=\"w\">swiftly<\/td><td class=\"m\">빠르게, 신속히<\/td><\/tr><tr><td class=\"w\">correct<\/td><td class=\"m\">바로잡다, 정정하다<\/td><\/tr><tr><td class=\"w\">correction<\/td><td class=\"m\">교정, 수정, 정정<\/td><\/tr><tr><td class=\"w\">gain<\/td><td class=\"m\">얻다, 늘리다<\/td><\/tr><tr><td class=\"w\">strength<\/td><td class=\"m\">힘, 강점<\/td><\/tr><tr><td class=\"w\">defend<\/td><td class=\"m\">방어하다, 지키다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Myths <span class=\"grammar-hl\">aren’t only stories<\/span>.<\/b><\/span><span class=\"ko\">통념은 단지 이야기가 아니다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">통념은 단지 이야기가 아니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로, 신화가 단순히 옛날이야기나 허구에 그치지 않고 우리 실생활이나 상식 속에서 여전히 살아 움직이는 힘을 가지고 있음을 시사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">aren’t only stories 2형식 구조: 주어(Myths) + 동사(aren&#39;t) + 보어(stories)로 이루어진 문장으로, &#39;신화는 단지 이야기가 아니다&#39;라는 기본 상태를 설명한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">myth<\/td><td class=\"m\">근거 없는 믿음, 신화<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>For example,<\/b><\/span><span class=\"ko\">예를 들어,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a <span class=\"grammar-hl\">well-known<\/span> myth <span class=\"grammar-hl\">that persists today<\/span><\/b><\/span><span class=\"ko\">오늘날에도 지속되는 잘 알려진 통념은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is the <span class=\"grammar-hl\">supposed<\/span> high iron content<\/b><\/span><span class=\"ko\">여겨지는 높은 철분 함량이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in spinach.<\/b><\/span><span class=\"ko\">시금치 속의.<\/span><\/div><\/div><div class=\"lec-sent-ko\">예를 들어, 오늘날에도 지속되는 잘 알려진 하나의 통념은 시금치에 있다고 여겨지는 높은 철분 함량이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 신화의 특성에 대한 구체적인 사례를 제시하며, 과학적 사실로 믿어지는 통념이 실제로는 잘못된 신화일 수 있음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">well-known (과거분사(형용사)): well-known이 뒤의 명사인 myth를 수식하며 &#39;잘 알려진 신화&#39;라는 의미를 나타낸다. p.p. + N 구조다.<\/div><div class=\"lec-gr-item\">that persists today (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사 a well-known myth를 수식한다. 관계대명사 뒤에는 주어가 빠진 불완전한 문장이 온다.<\/div><div class=\"lec-gr-item\">supposed (과거분사(형용사)): supposed가 뒤의 명사인 iron content를 수식하며 &#39;이른바/추정되는 철분 함량&#39;이라는 의미를 나타낸다. p.p. + N 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">myth<\/td><td class=\"m\">근거 없는 믿음, 신화<\/td><\/tr><tr><td class=\"w\">persist<\/td><td class=\"m\">계속되다, 고집하다<\/td><\/tr><tr><td class=\"w\">suppose<\/td><td class=\"m\">가정하다, 생각하다<\/td><\/tr><tr><td class=\"w\">content<\/td><td class=\"m\">내용, 내용물<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This is a legend<\/b><\/span><span class=\"ko\">이것은 전해오는 이야기이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that dates back to 1890<\/span><\/b><\/span><span class=\"ko\">1890년으로 거슬러 올라가는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and originates<\/span><\/b><\/span><span class=\"ko\">그리고 비롯된<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from a simple miscalculation<\/b><\/span><span class=\"ko\">단순한 계산 착오에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by physiologist Gustav von Bunge.<\/b><\/span><span class=\"ko\">생리학자 Gustav von Bunge에 의한.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이것은 1890년으로 거슬러 올라가 생리학자 Gustav von Bunge의 단순한 계산 착오에서 비롯된 전해오는 이야기이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 제시한 시금치 신화의 역사적 기원을 설명하며, 대단한 의도가 있었던 것이 아니라 한 과학자의 사소한 실수에서 모든 것이 시작되었음을 밝힙니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that dates back to 1890 and originates (관계대명사): 주격 관계대명사 that이 선행사 a legend를 수식한다. dates와 originates가 접속사 and로 연결되어 선행사에 공통으로 걸리는 병렬 구조다.<\/div><div class=\"lec-gr-item\">dates back to (관용표현): &#39;(시기 등이) ~까지 거슬러 올라가다&#39;라는 의미로 쓰이는 구동사다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">originate<\/td><td class=\"m\">비롯되다, 시작되다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He accurately determined<\/b><\/span><span class=\"ko\">그는 정확하게 밝혀냈다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that 100 grams of spinach<\/b><\/span><span class=\"ko\">시금치 100그램이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>contained 35 milligrams of iron<\/b><\/span><span class=\"ko\">35밀리그램의 철분을 함유했다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but he was analyzing <span class=\"grammar-hl\">dried<\/span> spinach<span class=\"grammar-hl\">,<\/span><\/b><\/span><span class=\"ko\">하지만 그는 말린 시금치를 분석하고 있었다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which held ten times more iron<\/span><\/b><\/span><span class=\"ko\">그런데 그것은 열 배 더 많은 철분을 함유했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than the same amount of fresh leafy greens.<\/b><\/span><span class=\"ko\">같은 양의 신선한 푸른잎채소보다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그가 시금치 100그램이 철분 35밀리그램을 함유하고 있다는 사실을 정확하게 밝혀냈지만, 그는 말린 시금치를 분석하고 있었고, 그것은 같은 양의 말리지 않은 푸른잎채소(시금치)보다 열 배 많은 철분을 갖고 있었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 말한 계산 착오의 구체적인 내용을 서술합니다. analyzing dried spinach는 수분이 빠져 성분이 응축된 상태를 측정했다는 의미로, 우리가 흔히 먹는 생시금치의 영양가와는 큰 차이가 있었음을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">dried (과거분사(형용사)): dried가 뒤의 명사인 spinach를 수식하며 &#39;말린 시금치&#39;라는 상태를 나타낸다. p.p. + N 구조다.<\/div><div class=\"lec-gr-item\">, which held ten times more iron (관계대명사): 관계대명사의 계속적 용법으로, 콤마(,) 뒤에서 선행사 dried spinach에 대한 추가적인 정보를 제공한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">accurate<\/td><td class=\"m\">정확한<\/td><\/tr><tr><td class=\"w\">determined<\/td><td class=\"m\">단호한, 굳게 결심한<\/td><\/tr><tr><td class=\"w\">contain<\/td><td class=\"m\">포함하다, 담고 있다<\/td><\/tr><tr><td class=\"w\">analyze<\/td><td class=\"m\">분석하다<\/td><\/tr><tr><td class=\"w\">amount<\/td><td class=\"m\">양, 액수<\/td><\/tr><tr><td class=\"w\">leafy<\/td><td class=\"m\">나무가 많은, 잎이 무성한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Although the error <span class=\"grammar-hl\">was swiftly corrected<\/span>,<\/b><\/span><span class=\"ko\">그 오류는 빠르게 수정되었지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the correction <span class=\"grammar-hl\">was just as swiftly forgotten<\/span>.<\/b><\/span><span class=\"ko\">그 수정은 그만큼 빠르게 잊혀졌다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 오류는 빠르게 수정되었지만 그 수정은 그만큼 빠르게 잊혀졌다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 오류 수정이라는 사건과 대중의 반응을 대비시킵니다. the correction was just as swiftly forgotten은 진실이 밝혀졌음에도 불구하고 사람들은 이미 익숙해진 흥미로운 정보를 더 선호하여 올바른 정보에는 관심을 두지 않았음을 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was swiftly corrected (수동태): be동사(was)+p.p.(corrected) 구조. correct는 타동사인데 뒤에 목적어가 없어서 수동구조 was corrected 형태로 쓴다. 기본구조: V + O.<\/div><div class=\"lec-gr-item\">was just as swiftly forgotten (수동태): be동사(was)+p.p.(forgotten) 구조. forget은 타동사인데 뒤에 목적어가 없어서 수동구조 was forgotten 형태로 쓴다. 기본구조: V + O.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">swiftly<\/td><td class=\"m\">빠르게, 신속히<\/td><\/tr><tr><td class=\"w\">correct<\/td><td class=\"m\">바로잡다, 정정하다<\/td><\/tr><tr><td class=\"w\">correction<\/td><td class=\"m\">교정, 수정, 정정<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The myth<\/b><\/span><span class=\"ko\">이 통념은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">had taken hold<\/span>.<\/b><\/span><span class=\"ko\">확고히 자리를 잡았다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이 통념은 확고히 자리를 잡았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 결과로, 수정된 사실이 묻히고 잘못된 정보가 대중의 머릿속에 상식으로 굳건히 뿌리 내렸음을 강조하며 이야기의 흐름을 정리합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">had taken hold (관용표현): take hold는 &#39;장악하다/확고히 자리 잡다&#39;라는 의미의 이디엄으로, 여기서는 과거완료(had+p.p.) 시제와 결합되어 과거의 특정 시점 이전에 이미 자리를 잡았음을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">myth<\/td><td class=\"m\">근거 없는 믿음, 신화<\/td><\/tr><tr><td class=\"w\">hold<\/td><td class=\"m\">잡다, 유지하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Popeye<span class=\"grammar-hl\">,<\/span><\/b><\/span><span class=\"ko\">Popeye는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who gained superhuman strength<\/span><\/b><\/span><span class=\"ko\">초인적인 힘을 얻었고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from the leafy greens<\/b><\/span><span class=\"ko\">푸른잎채소로부터<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and defended himself<\/b><\/span><span class=\"ko\">자신을 방어했기에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with iron fists,<\/b><\/span><span class=\"ko\">강철 주먹으로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>contributed to its endurance,<\/b><\/span><span class=\"ko\">그것의 지속에 기여했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and even today,<\/b><\/span><span class=\"ko\">그리고 오늘날에도,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>some nearly 150 years later,<\/b><\/span><span class=\"ko\">약 150년이 지난 지금,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>parents the world over<\/b><\/span><span class=\"ko\">전 세계 부모들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>use this tale<\/b><\/span><span class=\"ko\">이 이야기를 사용한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to try<\/span> <span class=\"grammar-hl\">to persuade<\/span> their children<\/b><\/span><span class=\"ko\">그들의 자녀를 설득하려고 노력하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>into <span class=\"grammar-hl\">eating<\/span> the healthy vegetable.<\/b><\/span><span class=\"ko\">그 건강한 채소를 먹도록.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Popeye는 푸른잎채소(시금치)에서 초인적인 힘을 얻고 강철 주먹으로 자신을 방어했기에, 그것의 지속에 기여했고, 약 150년이 지난 오늘날에도 전 세계 부모들은 자녀들이 건강한 그 채소를 먹도록 설득하기 위해 이 이야기를 이용한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 잘못된 신화가 대중문화와 결합하여 어떻게 생명력을 이어가는지 보여줍니다. contributed to its endurance는 만화 캐릭터 뽀빠이가 시금치의 철분 이미지를 각인시켜 오류가 박멸되지 않고 대물림되게 만든 핵심적인 역할을 했다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">, who gained superhuman strength (관계대명사): 관계대명사의 계속적 용법으로, 선행사인 Popeye에 대해 부연 설명하는 절을 이끈다.<\/div><div class=\"lec-gr-item\">to try (to부정사(부사적): 목적): in order to try로 바꿔도 뜻이 같으며, 부모들이 이 이야기를 사용하는 목적을 설명한다.<\/div><div class=\"lec-gr-item\">to persuade (to부정사(명사적)): 동사 try의 목적어 자리에 쓰여 &#39;~하는 것을 (노력하다/시도하다)&#39;라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">eating (동명사): 전치사 into의 목적어 역할을 하며, &#39;먹는 것&#39;이라는 행위의 개념을 나타내는 명사적 역할을 수행한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">leafy<\/td><td class=\"m\">나무가 많은, 잎이 무성한<\/td><\/tr><tr><td class=\"w\">gain<\/td><td class=\"m\">얻다, 늘리다<\/td><\/tr><tr><td class=\"w\">strength<\/td><td class=\"m\">힘, 강점<\/td><\/tr><tr><td class=\"w\">defend<\/td><td class=\"m\">방어하다, 지키다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>신화는 단순한 이야기가 아니라 오늘날에도 잘못된 상식의 형태로 존재한다.<\/li><li>시금치에 철분이 많다는 오해는 1890년 한 생리학자의 단순한 실험 측정 실수에서 시작되었다.<\/li><li>말린 시금치를 기준으로 한 수치가 생시금치의 수치로 둔갑했으나, 오류 수정은 대중에게 무시되었다.<\/li><li>만화 캐릭터 뽀빠이를 통해 이 오류는 강화되었고, 150년이 지난 지금까지도 부모들이 자녀에게 시금치를 먹이는 근거로 활용되고 있다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">The myth that spinach contains high levels of iron originated from a simple calculation error but continues to persist through cultural influences.<\/div>\n              <div class=\"lec-final-sum-ko\">시금치에 다량의 철분이 함유되어 있다는 근거 없는 믿음은 단순한 계산 착오에서 비롯되었으나, 문화적 영향을 통해 계속해서 지속되고 있다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_31번_강의_audio/1 ],"fileName":"모의고사_고1_2025년_10월_31번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 10월 / 31번","titleEn":"The Enduring Myth: Why People Still Believe Spinach is High in Iron","titleKo":"지속되는 신화: 사람들은 왜 여전히 시금치에 철분이 많다고 믿는가","imageUrl":"__enpImg__","stages":[{"label":"01신화의 사례 제시","items":["신화는 단순한 이야기에 그치지 않으며, 대표적인 사례로 시금치의 높은 철분 함량설이 있다.","시금치에 철분이 많다는 근거 없는 믿음(myth)의 존재","오늘날까지 끈질기게 지속되는 상식의 오류","핵심 키워드: 신화(myth), 철분 함량(iron content)"]},{"label":"02과학적 오해의 기원","items":["1890년 생리학자 구스타프 폰 붕게의 단순한 계산 착오에서 이 신화가 시작되었다.","생리학자(physiologist)의 분석 과정에서 발생한 실수","신선한 채소가 아닌 건조 시금치(dried spinach)를 분석함","실제보다 철분 수치가 10배 높게 측정되는 오류 발생"]},{"label":"03오류의 고착화","items":["잘못된 수치는 즉시 수정되었으나, 대중은 수정된 사실보다 자극적인 신화를 더 빨리 받아들였다.","오류의 수정(correction)은 사람들에게 금방 잊혀짐","신화가 대중의 인식 속에 확고히 자리를 잡음(taken hold)"]},{"label":"04대중문화에 의한 강화","items":["만화 캐릭터 뽀빠이는 시금치 신화가 대중의 기억 속에 오래 남도록 기여했다.","시금치를 먹고 초인적인 힘(superhuman strength)을 얻는 설정","캐릭터의 인기가 신화의 내구력(endurance)을 높임"]},{"label":"05현대까지 이어지는 영향","items":["오류가 발생한 지 약 150년이 지난 지금까지도 이 신화는 실생활에서 활용되고 있다.","부모들이 자녀에게 채소를 먹이려고 설득(persuade)하는 도구로 사용","전 세계적으로 여전히 유효한 건강 관련 설화로 남음"]}],"bkg":"우리가 흔히 '상식'이라고 믿는 정보 중에는 과거의 단순한 과학적 오류(Scientific Error)가 사실처럼 굳어진 경우가 종종 있습니다. 영양학 연구에서는 수분을 모두 제거한 건조 중량(Dry Weight)과 수분이 포함된 상태인 생체 중량(Fresh Weight)을 구분하는 것이 매우 중요한데, 이를 혼동하면 실제보다 영양 성분이 수 배 이상 높게 측정되는 오계산(Miscalculation)이 발생할 수 있습니다. 이렇게 잘못된 정보가 만화나 영화 같은 대중문화(Popular Culture)의 힘을 빌려 확산되면, 마치 '철분 왕' 시금치처럼 수십 년이 지나도 쉽게 변하지 않는 통념(Myth)으로 자리 잡게 됩니다. 마치 잘못 전달된 소문이 눈덩이처럼 불어나 진실처럼 여겨지는 현상처럼, 과학적 사실도 검증과 교정(Verification and Correction)의 과정을 거치지 않으면 긴 시간 동안 대중의 인식을 지배할 수 있다는 점을 이해하면 이 글을 훨씬 더 깊이 있게 이해하실 수 있습니다.","ttsText":"우리가 흔히 '상식'이라고 믿는 정보 중에는 과거의 단순한 과학적 오류(Scientific Error)가 사실처럼 굳어진 경우가 종종 있습니다. 영양학 연구에서는 수분을 모두 제거한 건조 중량(Dry Weight)과 수분이 포함된 상태인 생체 중량(Fresh Weight)을 구분하는 것이 매우 중요한데, 이를 혼동하면 실제보다 영양 성분이 수 배 이상 높게 측정되는 오계산(Miscalculation)이 발생할 수 있습니다. 이렇게
