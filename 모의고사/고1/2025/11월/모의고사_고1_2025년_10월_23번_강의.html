, 이는 오늘날 다양한 국적의 인재를 흡수하며 성장하는 현대의 글로벌 도시들과 매우 흡사한 모습입니다. 역사학자 리비우스는 이러한 로마 특유의 개방성(Openness)이 외부의 유능한 인물들을 왕으로 추대할 수 있게 했으며, 결과적으로 로마가 강대국으로 성장하는 결정적인 토대가 되었다고 분석합니다. 제국이 세 대륙으로 뻗어 나가는 과정에서도 로마는 정복지의 문화를 배척하기보다 자신들의 것으로 만드는 문화 수용(Cultural Adoption)을 실천하며 제국의 기틀을 다졌습니다. 비록 급격한 변화에 대한 보수적인 반발도 있었지만, 로마의 문화적 혼종성(Cultural Hybridity)은 로마가 단순한 도시 국가를 넘어 거대한 세계 제국으로 번영할 수 있었던 핵심적인 동력이었습니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01용광로로서의 로마<\/div><ul><li>로마는 건국 초기부터 사방에서 이주민이 모여든 용광로와 같은 도시였다.<\/li><li>역사학자 리비우스의 주장: 여러 지역에서 유입된 이주민(immigrants)<\/li><li>로마는 시작부터 용광로(melting pot)의 정체성을 가짐<\/li><li>핵심 키워드: 용광로(melting pot)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02비차별 정책과 도시의 기초<\/div><ul><li>로물루스의 비차별 정책이 로마가 강력한 도시로 성장하는 기틀이 되었다.<\/li><li>로물루스의 의도적인 비차별(nondiscrimination) 정책<\/li><li>초기의 개방성(openness)이 로마의 성공과 힘의 근간이 됨<\/li><li>핵심 키워드: 비차별(nondiscrimination)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03다문화적 지도층의 등장<\/div><ul><li>로마의 전설적인 왕들 대다수가 외부 출신 이주민이었다는 전통이 존재한다.<\/li><li>로마 출생 왕은 소수(minority)에 불과했다는 전승<\/li><li>왕위 계승의 기준: 개인의 미덕과 능력(virtues and merits)<\/li><li>핵심 키워드: 능력(merits)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04문화적 흡수와 확장<\/div><ul><li>제국이 확장됨에 따라 로마는 새로운 문화를 적극적으로 수용하고 통합했다.<\/li><li>세 대륙에 걸친 확장과 새로운 문화적 영향(cultural influences) 채택<\/li><li>급격한 문화적 변화(cultural change)에 대한 내부의 우려와 불만 병존<\/li><li>핵심 키워드: 문화적 영향(cultural influences)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">claim<\/td><td class=\"m\">주장하다<\/td><\/tr><tr><td class=\"w\">population<\/td><td class=\"m\">인구<\/td><\/tr><tr><td class=\"w\">comprise<\/td><td class=\"m\">구성[차지]하다, (~으로) 구성되다<\/td><\/tr><tr><td class=\"w\">immigrant<\/td><td class=\"m\">이민자<\/td><\/tr><tr><td class=\"w\">flooding<\/td><td class=\"m\">범람, 홍수<\/td><\/tr><tr><td class=\"w\">direction<\/td><td class=\"m\">방향<\/td><\/tr><tr><td class=\"w\">attract<\/td><td class=\"m\">끌어들이다, (관심을) 끌다<\/td><\/tr><tr><td class=\"w\">deliberate<\/td><td class=\"m\">심사숙고하다, 의도적인<\/td><\/tr><tr><td class=\"w\">policy<\/td><td class=\"m\">정책, 방침<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">initial<\/td><td class=\"m\">처음의, 초기의<\/td><\/tr><tr><td class=\"w\">assert<\/td><td class=\"m\">주장하다<\/td><\/tr><tr><td class=\"w\">lay<\/td><td class=\"m\">놓다, 눕히다<\/td><\/tr><tr><td class=\"w\">foundation<\/td><td class=\"m\">토대, 기초<\/td><\/tr><tr><td class=\"w\">strength<\/td><td class=\"m\">힘, 강점<\/td><\/tr><tr><td class=\"w\">describe<\/td><td class=\"m\">묘사하다, 서술하다<\/td><\/tr><tr><td class=\"w\">generation<\/td><td class=\"m\">세대<\/td><\/tr><tr><td class=\"w\">tradition<\/td><td class=\"m\">전통<\/td><\/tr><tr><td class=\"w\">hold<\/td><td class=\"m\">잡다, 유지하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Rome<\/b><\/span><span class=\"ko\">로마는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">was said<\/span> <span class=\"grammar-hl\">to have been<\/span> a melting pot<\/b><\/span><span class=\"ko\">용광로였다고 일컬어졌다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from the very start.<\/b><\/span><span class=\"ko\">맨 처음부터.<\/span><\/div><\/div><div class=\"lec-sent-ko\">로마는 맨 처음부터 용광로였다고 일컬어졌다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 문장은 글의 도입부로, 로마라는 국가가 처음 세워질 때부터 다양한 민족과 문화가 섞여 있었음을 선언합니다. a melting pot from the very start는 로마가 나중에 영토를 넓히면서 비로소 다양해진 것이 아니라, 도시의 태생적 뿌리 자체가 혼합과 포용에 있었다는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was said (수동태): be동사(was)+p.p.(said) 구조. say는 타동사(say A to be B)인데 목적어가 주어로 나가서 목적어가 없으므로 수동구조 was said 형태로 쓴다. 기본구조: say + O + to V<\/div><div class=\"lec-gr-item\">to have been (목적격보어(to부정사)): be+p.p.+toV 구조에서 수동태 뒤에 남은 목적격보어다. 주절의 시제(과거)보다 더 앞선 시점을 나타내기 위해 완료 부정사(to have p.p.) 형태가 쓰였다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The historian Livy claimed<\/b><\/span><span class=\"ko\">역사가 Livy는 주장했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the city’s original population<\/b><\/span><span class=\"ko\">그 도시의 원래 인구가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">was comprised of<\/span> immigrants<\/b><\/span><span class=\"ko\">이민자들로 구성되었다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">flooding in<\/span> from all directions,<\/b><\/span><span class=\"ko\">사방에서 몰려든<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">attracted by<\/span> Romulus’s deliberate policy of nondiscrimination.<\/b><\/span><span class=\"ko\">Romulus의 의도적인 비차별 정책에 의해 이끌려.<\/span><\/div><\/div><div class=\"lec-sent-ko\">역사가 Livy는 그 도시의 원래 인구가 Romulus의 의도적인 비차별 정책에 의해 이끌려 사방에서 몰려든 이민자들로 구성되었다고 주장했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 &#39;용광로&#39;의 구체적인 역사적 배경을 설명합니다. attracted by Romulus’s deliberate policy는 로마의 시조인 로물루스가 인구를 늘리기 위해 전략적으로 외부인을 받아들이는 정책을 폈음을 보여줍니다. 즉, 로마의 다양성은 우연이 아니라 통치자의 의도적인 설계였음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was comprised of (수동태): be동사(was)+p.p.(comprised) 구조. comprise는 타동사인데 뒤에 목적어가 없어서 수동구조 was comprised of 형태로 쓴다. 기본구조: comprise + O<\/div><div class=\"lec-gr-item\">flooding in (현재분사(형용사)): flooding이 앞의 명사 immigrants를 수식하며 동작/상태를 나타낸다(= &quot;몰려드는 이주민들&quot;). immigrants that were flooding in 구조로 이해할 수 있다.<\/div><div class=\"lec-gr-item\">attracted by (과거분사(형용사)): attracted가 앞의 명사 immigrants를 수식한다(= &quot;이끌린 이주민들&quot;). immigrants who were attracted by 구조로 이해할 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">claim<\/td><td class=\"m\">주장하다<\/td><\/tr><tr><td class=\"w\">population<\/td><td class=\"m\">인구<\/td><\/tr><tr><td class=\"w\">comprise<\/td><td class=\"m\">구성[차지]하다, (~으로) 구성되다<\/td><\/tr><tr><td class=\"w\">immigrant<\/td><td class=\"m\">이민자<\/td><\/tr><tr><td class=\"w\">flooding<\/td><td class=\"m\">범람, 홍수<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">direction<\/td><td class=\"m\">방향<\/td><\/tr><tr><td class=\"w\">attract<\/td><td class=\"m\">끌어들이다, (관심을) 끌다<\/td><\/tr><tr><td class=\"w\">deliberate<\/td><td class=\"m\">심사숙고하다, 의도적인<\/td><\/tr><tr><td class=\"w\">policy<\/td><td class=\"m\">정책, 방침<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>It was this initial openness,<\/b><\/span><span class=\"ko\">바로 이러한 초기의 개방성이었다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Livy asserts,<\/b><\/span><span class=\"ko\">Livy가 주장하길,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that laid the foundations<\/b><\/span><span class=\"ko\">토대를 놓은 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for the later strength and success of the city.<\/b><\/span><span class=\"ko\">그 도시의 이후의 힘과 성공을 위한.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Livy가 주장하길, 그 도시의 이후의 힘과 성공을 위한 토대를 놓은 것은 바로 이러한 초기의 개방성이었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 초기 정책(원인)과 국가의 번영(결과)을 논리적으로 연결합니다. laid the foundations는 외부인을 가리지 않고 받아들인 태도가 단순한 특징을 넘어, 로마가 거대한 제국으로 성장할 수 있었던 핵심 동력이 되었다는 역사적 평가를 전달합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It was this initial openness ... that (강조구문): &#39;It was ~ that&#39; 사이에 강조하고자 하는 성분(this initial openness)을 넣은 구조다. that 이하의 절에서 주어 역할을 하던 명사구를 강조하고 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">initial<\/td><td class=\"m\">처음의, 초기의<\/td><\/tr><tr><td class=\"w\">assert<\/td><td class=\"m\">주장하다<\/td><\/tr><tr><td class=\"w\">foundation<\/td><td class=\"m\">토대, 기초<\/td><\/tr><tr><td class=\"w\">strength<\/td><td class=\"m\">힘, 강점<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Romans<\/b><\/span><span class=\"ko\">로마인들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">described their city as multicultural<\/span><\/b><\/span><span class=\"ko\">자신들의 도시를 다문화적이라고 묘사했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the generations<\/b><\/span><span class=\"ko\">여러 세대에 걸쳐<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>after its foundation.<\/b><\/span><span class=\"ko\">도시의 설립 이후.<\/span><\/div><\/div><div class=\"lec-sent-ko\">로마인들은 도시의 설립 이후 여러 세대에 걸쳐 자신들의 도시를 다문화적이라고 묘사했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 건국 초기 단계를 지나 시간이 흐른 뒤에도 로마인들이 여전히 자신들의 정체성을 어떻게 정의했는지 보여줍니다. multicultural in the generations after는 다문화적 속성이 일시적인 현상이 아니라 로마라는 국가 정체성의 지속적인 특징이었음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">described their city as multicultural 5형식(SVOC) 구조: describe(V) + their city(O) + as multicultural(C) 구조로, 목적어의 특징을 보충 설명하는 목적격보어 자리에 전치사 as를 동반한 형용사구가 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">foundation<\/td><td class=\"m\">토대, 기초<\/td><\/tr><tr><td class=\"w\">describe<\/td><td class=\"m\">묘사하다, 서술하다<\/td><\/tr><tr><td class=\"w\">generation<\/td><td class=\"m\">세대<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Tradition held<\/b><\/span><span class=\"ko\">전통적으로 전해진다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that only a minority of the city’s legendary kings<\/b><\/span><span class=\"ko\">그 도시의 전설적인 왕들 중 소수만이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>were Roman-born,<\/b><\/span><span class=\"ko\">로마 태생이었다고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">with the others all arriving<\/span> as immigrants<\/b><\/span><span class=\"ko\">나머지 왕들은 모두 이민자로 이주해 오면서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>before <span class=\"grammar-hl\">being chosen<\/span> for the throne<\/b><\/span><span class=\"ko\">왕위에 선택되기 전에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for their virtues and merits.<\/b><\/span><span class=\"ko\">그들의 덕성과 공로로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">전통적으로, 그 도시의 전설적인 왕들 중 소수만이 로마 태생이었고, 나머지 왕들은 그들의 덕성과 공로로 왕위에 선택되기 전에 모두 이민자로 이주해 왔다고 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 로마의 개방성을 증명하는 가장 강력한 사례로 &#39;왕들의 혈통&#39;을 제시합니다. chosen for the throne for their virtues and merits는 혈통이나 출신 성분보다 개인의 역량과 자질을 우선시했던 로마의 실용주의적이고 능력 중심적인 개방성을 구체적으로 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">with the others all arriving (분사구문): &#39;with + 목적어(the others) + 분사(-ing)&#39; 구조로 부대상황(동시동작/상태)을 나타낸다. 원래 절 변환: while the others all arrived as immigrants...<\/div><div class=\"lec-gr-item\">being chosen (수동태): be동사(being)+p.p.(chosen) 구조. choose는 타동사인데 목적어가 없어서 수동구조 being chosen 형태로 썼으며, 전치사 before 뒤에 위치하여 동명사 형태가 되었다. 기본구조: choose + O + for B<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">immigrant<\/td><td class=\"m\">이민자<\/td><\/tr><tr><td class=\"w\">tradition<\/td><td class=\"m\">전통<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>As the empire expanded across three continents,<\/b><\/span><span class=\"ko\">제국이 세 대륙에 걸쳐 확장되면서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Rome<\/b><\/span><span class=\"ko\">로마는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>eagerly adopted new cultural influences<\/b><\/span><span class=\"ko\">적극적으로 새로운 문화적 영향을 채택하였고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and absorbed <span class=\"grammar-hl\">incoming<\/span> groups<\/b><\/span><span class=\"ko\">유입되는 집단들을 흡수했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>― perhaps a little too eagerly for some,<\/b><\/span><span class=\"ko\">― 아마도 어떤 사람들에게는 다소 지나치게 적극적이었을지도 모르는데,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who<\/span>,<\/b><\/span><span class=\"ko\">그들은,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>like the poet Juvenal,<\/b><\/span><span class=\"ko\">시인 Juvenal처럼,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>complained about the rapid rate of cultural change.<\/b><\/span><span class=\"ko\">그 급격한 문화 변화 속도에 대해 불평했다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">제국이 세 대륙에 걸쳐 확장되면서, 로마는 적극적으로 새로운 문화적 영향을 채택하였고, 유입되는 집단들을 흡수했다. 이것은 아마도 어떤 사람들에게는 다소 지나치게 적극적이었을지도 모르는데, 그들은 시인 Juvenal처럼 그 급격한 문화 변화 속도에 대해 불평했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 로마의 팽창기에 나타난 문화적 흡수와 그에 따른 내부의 반동을 설명하며 글을 마무리합니다. complained about the rapid rate of cultural change는 로마가 외부 문화를 수용하는 속도가 너무 빨라 기존의 가치가 훼손될 것을 우려했던 보수적인 시각도 존재했음을 시사하여, 당시 로마의 역동적인 사회 분위기를 입체적으로 묘사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">incoming (현재분사(형용사)): incoming이 뒤의 명사 groups를 수식하며 상태를 나타낸다(= &quot;들어오는 집단들&quot;).<\/div><div class=\"lec-gr-item\">who (관계대명사): 선행사 some을 보충 설명하는 주격 관계대명사의 계속적 용법이다. 관계대명사 뒤에 주어가 없는 불완전한 문장이 이어진다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>로마는 건국 초기부터 다양한 출신의 사람들이 섞여 사는 &#39;용광로&#39;와 같은 도시였다.<\/li><li>로물루스의 차별 없는 정책 덕분에 사방에서 이주민이 몰려들었고, 이것이 로마 번영의 기틀이 되었다.<\/li><li>로마인들은 스스로를 다문화 사회로 인식했으며, 초기 왕들조차 대부분 외부 출신의 유능한 인물들이었다.<\/li><li>제국 확장기에도 활발한 문화 흡수가 이어졌으나, 너무 빠른 변화에 대해 일부 지식인들의 반발이 있기도 했다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Rome established itself as a powerful multicultural empire because it prioritized openness and the integration of diverse people from its very beginning.<\/div>\n              <div class=\"lec-final-sum-ko\">로마는 초기부터 개방성과 다양한 민족의 통합을 우선시했기 때문에 강력한 다문화 제국으로 자리 잡았다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_23번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_23번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_23번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_23번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_23번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_23번_강의_
