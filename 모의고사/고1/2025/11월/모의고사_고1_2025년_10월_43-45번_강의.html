lass=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03반복된 순수한 나눔<\/div><ul><li>삼 개월 후에도 제임스는 여전히 가난했고, 데이비드는 또다시 대가 없이 신문을 건넨다.<\/li><li>상황의 반복: 아무것도 기대하지 않고 베푸는 호의<\/li><li>데이비드의 태도: 대가(return)를 바라지 않는 일관성<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04세월이 흐른 뒤의 재회<\/div><ul><li>성공한 사업가가 된 제임스는 자신을 도왔던 데이비드를 찾아가 보상을 제안한다.<\/li><li>제임스의 변화: 부유한 사업가(wealthy businessman)가 되어 데이비드를 찾아냄<\/li><li>제임스의 제안: 무엇이든 원하는 것을 들어주겠다고 약속함<\/li><li>핵심 키워드: 보상(compensate)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05데이비드의 거절과 이유<\/div><ul><li>데이비드는 제임스의 제안을 거절하며 두 사람의 나눔에 본질적인 차이가 있음을 설명한다.<\/li><li>거절의 이유: 부족할 때 주는 것과 모든 것을 가졌을 때 주는 것은 다름<\/li><li>제임스의 제안에 대한 평가: 편의에 의한 관대함(generosity at convenience)<\/li><li>핵심 키워드: 부족함(almost nothing) vs 풍족함(everything)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-5\"><div class=\"lec-stage-head\">06진정한 부에 대한 깨달음<\/div><ul><li>제임스는 돈의 액수가 아닌 베푸는 마음의 깊이가 부의 기준임을 깨닫는다.<\/li><li>제임스의 깨달음: 아주 적게 가졌을 때도 기꺼이 주려는 마음(willingness to give)<\/li><li>최종 결론: 데이비드가 세상에서 가장 부유한 사람임<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">journalist<\/td><td class=\"m\">기자, 언론인<\/td><\/tr><tr><td class=\"w\">stick<\/td><td class=\"m\">막대기, 붙이다<\/td><\/tr><tr><td class=\"w\">found<\/td><td class=\"m\">찾다, 발견하다 (find의 과거형)<\/td><\/tr><tr><td class=\"w\">truly<\/td><td class=\"m\">정말로, 진정으로<\/td><\/tr><tr><td class=\"w\">compensate<\/td><td class=\"m\">보상하다, 벌충하다<\/td><\/tr><tr><td class=\"w\">offer<\/td><td class=\"m\">제공하다, 내놓다<\/td><\/tr><tr><td class=\"w\">generosity<\/td><td class=\"m\">너그러움<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">convenience<\/td><td class=\"m\">편의, 편리<\/td><\/tr><tr><td class=\"w\">accept<\/td><td class=\"m\">받아들이다<\/td><\/tr><tr><td class=\"w\">realize<\/td><td class=\"m\">깨닫다<\/td><\/tr><tr><td class=\"w\">willingness<\/td><td class=\"m\">기꺼이 하려는 마음<\/td><\/tr><tr><td class=\"w\">notice<\/td><td class=\"m\">알아차리다, 주목하다<\/td><\/tr><tr><td class=\"w\">hesitate<\/td><td class=\"m\">망설이다, 주저하다<\/td><\/tr><tr><td class=\"w\">in return<\/td><td class=\"m\">그 대가로, 답례로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When billionaire James Walker<\/b><\/span><span class=\"ko\">억만장자 James Walker가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">was once asked<\/span><\/b><\/span><span class=\"ko\">한때 질문을 받았을 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by a journalist,<\/b><\/span><span class=\"ko\">한 기자로부터,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“Is there anyone richer than you?”,<\/b><\/span><span class=\"ko\">“당신보다 더 부유한 사람이 있나요?”,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he replied,<\/b><\/span><span class=\"ko\">그는 대답했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“Yes,<\/b><\/span><span class=\"ko\">“예,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>there is<\/b><\/span><span class=\"ko\">있습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>one young man<\/b><\/span><span class=\"ko\">한 젊은이가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">I’ll never forget<\/span>.”<\/b><\/span><span class=\"ko\">제가 결코 잊지 못할.”<\/span><\/div><\/div><div class=\"lec-sent-ko\">억만장자 James Walker가 한 기자로부터 “당신보다 부유한 사람이 있나요?”라는 질문을 받았을 때, 그는 “예, 제가 절대 잊지 못할 한 젊은이가 있습니다.”라고 대답했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 문장은 글의 도입부로, 세상이 생각하는 일반적인 &#39;부(wealth)&#39;의 기준인 돈의 액수를 뛰어넘는 또 다른 기준이 있음을 암시하며 독자의 호기심을 자극합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was once asked (수동태): be동사(was)+p.p.(asked) 구조. ask는 타동사인데 목적어(James Walker)가 주어로 이동하여 수동구조 was once asked 형태로 쓰였다. 기본구조: V + O + O<\/div><div class=\"lec-gr-item\">I’ll never forget (관계대명사): 명사 one young man 뒤에 목적격 관계대명사(whom/that)가 생략된 구조로, 뒤의 절이 앞의 명사를 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">journalist<\/td><td class=\"m\">기자, 언론인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He told the story<\/b><\/span><span class=\"ko\">그는 이야기를 들려주었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of <span class=\"grammar-hl\">when he first met David<\/span><\/b><\/span><span class=\"ko\">그가 David를 처음 만났던 때의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at a New York airport.<\/b><\/span><span class=\"ko\">뉴욕의 한 공항에서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 뉴욕의 한 공항에서 David를 처음 만났을 때의 이야기를 들려주었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 언급한 &#39;잊지 못할 젊은이&#39;가 누구인지, 그리고 그와의 인연이 어디서 시작되었는지 구체적인 사건의 배경을 제시하며 일화로 진입합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">when he first met David (간접의문문): 전치사 of의 목적어 역할을 하는 의문사절로, &#39;의문사(when) + 주어(he) + 동사(met)&#39;의 어순을 취한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 3 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Years ago,<\/b><\/span><span class=\"ko\">수년 전,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>James was broke<\/b><\/span><span class=\"ko\">James는 빈털터리였고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">stuck<\/span> at the airport,<\/b><\/span><span class=\"ko\">공항에 묶여 있었다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">killing<\/span> time<\/b><\/span><span class=\"ko\">시간을 보내며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">reading<\/span> newspaper headlines<\/b><\/span><span class=\"ko\">신문 기사 제목들을 읽으면서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at the newsstand.<\/b><\/span><span class=\"ko\">신문 가판대에서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">수년 전, James는 무일푼으로 공항에 묶인 채, 신문 가판대에 있는 신문 제목들을 읽으며 무료한 시간을 보내고 있었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> broke and stuck은 현재의 억만장자인 모습과 극명하게 대비되는 과거의 초라한 처지를 강조하여, 이후 다윗의 친절이 제임스에게 얼마나 절실했는지를 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">stuck (과거분사): 형용사처럼 쓰여 주어(James)의 상태를 보충 설명한다. be동사(was) 뒤에 연결된 보어 형태다.<\/div><div class=\"lec-gr-item\">killing (분사구문): 현재분사가 부사적 기능을 하며, 원래 절인 &#39;while he was killing&#39;으로 바꿀 수 있다.<\/div><div class=\"lec-gr-item\">reading (분사구문): 현재분사가 부사적 기능을 하며 앞의 상황에 연속되는 동작을 나타낸다. 원래 절인 &#39;while he was reading&#39;으로 바꿀 수 있다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 4 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>One headline caught his eye,<\/b><\/span><span class=\"ko\">한 기사 제목이 그의 눈을 사로잡았지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but he had no money<\/b><\/span><span class=\"ko\">그는 돈이 없었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to buy<\/span> the paper.<\/b><\/span><span class=\"ko\">그 신문을 살.<\/span><\/div><\/div><div class=\"lec-sent-ko\">한 기사 제목이 그의 시선을 사로잡았지만, 그는 신문을 살 돈이 없었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 제임스가 신문을 간절히 원하지만 경제적 능력 때문에 포기해야만 하는 결핍의 상황을 구체적으로 묘사하여 갈등 구조를 만듭니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to buy (to부정사(형용사적)): 명사 money를 수식하며, &#39;~할&#39;의 의미로 쓰인다. money를 대명사로 바꿨을 때 to buy가 동사에 붙지 않으므로 4번 규칙에 해당한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 5 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Just then,<\/b><\/span><span class=\"ko\">바로 그때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>David, <span class=\"grammar-hl\">working<\/span> at the newsstand,<\/b><\/span><span class=\"ko\">신문 가판대에서 일하고 있던 David가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>noticed James.<\/b><\/span><span class=\"ko\">James를 발견했다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">바로 그때, 신문 가판대에서 일하고 있던 David가 James를 발견했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 도움이 필요한 인물과 도움을 줄 인물이 조우하는 순간으로, 제임스의 곤궁한 처지를 타인인 다윗이 알아차리면서 사건의 전환점이 마련됩니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">working (현재분사(형용사)): 명사 David를 뒤에서 직접 수식하는 구조다. &#39;David who was working&#39;의 의미를 가진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">notice<\/td><td class=\"m\">알아차리다, 주목하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He asked,<\/b><\/span><span class=\"ko\">그는 물었다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“Would you like<\/b><\/span><span class=\"ko\">“~하시겠습니까<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to buy<\/span> this,<\/b><\/span><span class=\"ko\">이것을 사는 것을,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>sir?”<\/b><\/span><span class=\"ko\">선생님?”<\/span><\/div><\/div><div class=\"lec-sent-ko\">“선생님, 이거 사고 싶으신가요?”라고 그가 물었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 가판대 직원으로서 손님에게 건네는 일상적인 질문처럼 보이지만, 이는 제임스의 욕구와 현재 상황을 확인하려는 다윗의 배려 섞인 접근입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to buy (to부정사(명사적)): 동사 like의 목적어 자리에 쓰였으며 &#39;~하는 것&#39;으로 해석된다. 5번 규칙에 해당한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 7 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But James hesitated,<\/b><\/span><span class=\"ko\">하지만 James는 주저했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">saying<\/span> he had no money.<\/b><\/span><span class=\"ko\">돈이 없다고 말하며.<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만, James는 돈이 없다고 말하며 주저했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 자신의 처지를 솔직하게 고백하며 다윗의 제안을 거절할 수밖에 없는 제임스의 수동적인 태도를 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">saying (분사구문): 현재분사가 부사적 기능을 하며 주절의 동작과 동시에 일어나는 상황을 나타낸다. 원래 절인 &#39;as he said&#39;로 바꿀 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hesitate<\/td><td class=\"m\">망설이다, 주저하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">David smiled and said<\/span>,<\/b><\/span><span class=\"ko\">David는 미소 지으며 말했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“Me, too.<\/b><\/span><span class=\"ko\">“저도 그래요.<\/span><\/div><\/div><div class=\"lec-sent-ko\">David는 미소 지으며 “저도 그래요.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> Me, too는 다윗 본인 역시 경제적으로 넉넉하지 않은 처지임을 밝힘으로써, 제임스와의 동질감을 형성하고 그의 심리적 부담을 덜어주려는 태도입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">David smiled and said (관용표현): 주어와 동사들(smiled, said)이 병렬 구조로 연결된 일반적인 서술 문장이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 9 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But <span class=\"grammar-hl\">I have enough<\/span><\/b><\/span><span class=\"ko\">하지만 저는 충분히 가지고 있어요<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for this.<\/b><\/span><span class=\"ko\">이것을 살 만큼은.<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 이것을 살 정도는 있어요.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 자신이 가진 아주 작은 여유조차도 타인을 위해 사용할 준비가 되어 있다는 다윗의 이타적인 면모를 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">I have enough (관용표현): enough가 명사적으로 쓰여 &#39;충분한 양/돈&#39;이라는 의미를 나타낸다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 10 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Take it<\/span><\/b><\/span><span class=\"ko\">그것을 가져가세요<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as a gift.”<\/b><\/span><span class=\"ko\">선물로서.”<\/span><\/div><\/div><div class=\"lec-sent-ko\">선물로 가져가세요.”라고 말했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 대가 없이 호의를 베푸는 구체적인 행동으로, 제임스에게 강한 인상을 남기게 되는 결정적인 친절의 순간입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Take it (관용표현): 동사원형으로 시작하는 명령문 구조다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 11 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Three months later,<\/b><\/span><span class=\"ko\">3개월 후,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>James, <span class=\"grammar-hl\">still broke<\/span>,<\/b><\/span><span class=\"ko\">여전히 빈털터리였던 James는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>met him<\/b><\/span><span class=\"ko\">그를 만났다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at the newsstand once more.<\/b><\/span><span class=\"ko\">신문 가판대에서 다시 한번.<\/span><\/div><\/div><div class=\"lec-sent-ko\">3개월 후, 여전히 무일푼인 James는 그 신문 가판대에서 그를 다시 한번 만났다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 상황이 호전되지 않은 제임스가 다시 같은 장소에 나타남으로써, 다윗의 친절이 단 한 번의 우연이 아니었음을 증명할 상황이 반복됩니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">still broke (관용표현): 주어(James)를 부가 설명하는 형용사구로, James was still broke의 의미가 삽입된 형태다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 12 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Again,<\/b><\/span><span class=\"ko\">또다시,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>David gave him a newspaper<\/b><\/span><span class=\"ko\">David는 그에게 신문 한 부를 주었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>without <span class=\"grammar-hl\">expecting<\/span> anything<\/b><\/span><span class=\"ko\">아무것도 기대하지 않고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in return.<\/b><\/span><span class=\"ko\">보답으로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">또다시, David는 그에게 아무런 보답도 기대하지 않고 신문 한 부를 주었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> without expecting anything in return은 다윗의 선행이 보상을 바라는 투자가 아니라 순수한 연민과 나눔에서 비롯된 것임을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">expecting (동명사): 전치사 without의 목적어 자리에 쓰인 명사적 역할이다. ⚠️ 현재분사와 혼동하지 말 것.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in return<\/td><td class=\"m\">그 대가로, 답례로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 13 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Years passed<\/b><\/span><span class=\"ko\">수년이 흘렀고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and James became a wealthy businessman,<\/b><\/span><span class=\"ko\">James는 부유한 사업가가 되었지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but he never forgot<\/b><\/span><span class=\"ko\">그는 결코 잊지 않았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the young man<\/b><\/span><span class=\"ko\">그 젊은이를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">he had met<\/span> at the airport.<\/b><\/span><span class=\"ko\">그가 공항에서 만났던.<\/span><\/div><\/div><div class=\"lec-sent-ko\">수년이 흘러서 James는 부유한 사업가가 되었지만, 그는 그가 공항에서 만났던 그 청년을 결코 잊지 못했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 시간이 흘러 제임스의 사회적 지위는 완전히 바뀌었지만, 과거에 받은 정신적 채무와 감동은 여전히 그의 마음속에 깊이 남아 있음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">he had met (관계대명사): 명사 the young man 뒤에 목적격 관계대명사(whom/that)가 생략되었으며, 선행사를 수식하는 절이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 14 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He <span class=\"grammar-hl\">found David<\/span><\/b><\/span><span class=\"ko\">그는 David를 찾아냈다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">running<\/span> a small bookstore<\/b><\/span><span class=\"ko\">작은 서점을 운영하고 있는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and visited him there.<\/b><\/span><span class=\"ko\">그리고 그를 그곳으로 방문했다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 David가 작은 서점을 운영하고 있다는 것을 알아냈고 거기로 그를 방문했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 받은 은혜를 갚기 위해 적극적으로 다윗을 찾아 나선 제임스의 노력을 통해 두 사람의 재회가 이루어집니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">found David running 5형식(SVOC) 구조: 동사 found 뒤에 목적어 David, 목적격보어로 현재분사 running이 쓰인 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">found<\/td><td class=\"m\">찾다, 발견하다 (find의 과거형)<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 15 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He introduced himself,<\/b><\/span><span class=\"ko\">그는 자신을 소개했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">saying<\/span>,<\/b><\/span><span class=\"ko\">말하며,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“David,<\/b><\/span><span class=\"ko\">“David,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you helped me twice<\/b><\/span><span class=\"ko\">당신은 나를 두 번 도왔어요<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when you had almost nothing.<\/b><\/span><span class=\"ko\">당신이 가진 게 거의 없었을 때.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 자기를 소개하며, “David, 당신은 당신이 가진 게 거의 없을 때 나를 두 번이나 도와주었어요.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 제임스는 다윗의 선행이 가치 있었던 이유가 그가 풍족했기 때문이 아니라, 본인도 부족한 처지에서 베푼 것이었음을 정확히 기억하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">saying (분사구문): 현재분사가 부사적 기능을 하며 주절의 주어(He)의 동작을 부연 설명한다. 원래 절인 &#39;as he said&#39;로 바꿀 수 있다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 16 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I want to give you<\/b><\/span><span class=\"ko\">나는 당신에게 주고 싶어요<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>anything <span class=\"grammar-hl\">you wish<\/span>.”<\/b><\/span><span class=\"ko\">당신이 바라는 것은 무엇이든.”<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 당신이 원하는 것은 무엇이든 당신에게 주고 싶어요.”라고 말했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이제는 막강한 재력을 갖게 된 제임스가 자신의 방식으로 다윗의 과거 호의에 대해 물질적으로 보답하려 시도하는 장면입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">you wish (관계대명사): 명사 anything 뒤에 목적격 관계대명사(that)가 생략된 형태로, 뒤의 절이 anything을 수식한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 17 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>David <span class=\"grammar-hl\">looked at him<\/span><\/b><\/span><span class=\"ko\">David는 그를 바라보았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and said<\/span>,<\/b><\/span><span class=\"ko\">그리고 말했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“You can’t truly compensate me.”<\/b><\/span><span class=\"ko\">“당신은 나에게 진정으로 보답할 수 없어요.”<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 그를 바라보았고, “당신은 나에게 진정으로 보답할 수 없어요.”라고 말했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 제임스의 제안을 단칼에 거절하는 다윗의 말로, 물질적 보상이 정신적 가치를 완벽하게 대체하거나 되살릴 수 없다는 가치관을 드러냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">looked at him and said (관용표현): 두 개의 과거 동사가 and를 중심으로 병렬 연결된 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">truly<\/td><td class=\"m\">정말로, 진정으로<\/td><\/tr><tr><td class=\"w\">compensate<\/td><td class=\"m\">보상하다, 벌충하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 18 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>James asked,<\/b><\/span><span class=\"ko\">James는 물었다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“<span class=\"grammar-hl\">Why not?<\/span>”<\/b><\/span><span class=\"ko\">“왜 안 되나요?”<\/span><\/div><\/div><div class=\"lec-sent-ko\">James가 “왜 할 수 없죠?”라고 물었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 자신의 엄청난 재력으로 무엇이든 해줄 수 있다고 믿었던 제임스가 다윗의 거절 이유를 이해하지 못해 당황하는 모습입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Why not? (관용표현): &#39;왜 안 되나요?&#39;라는 의미로 쓰이는 구어체 의문 표현이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 19 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>David replied,<\/b><\/span><span class=\"ko\">David는 대답했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“Because I <span class=\"grammar-hl\">gave to you<\/span><\/b><\/span><span class=\"ko\">“제가 당신에게 베풀었기 때문이에요<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when I had almost nothing.<\/b><\/span><span class=\"ko\">제가 가진 게 거의 없었을 때.<\/span><\/div><\/div><div class=\"lec-sent-ko\">David는 “나는 가진 게 거의 없을 때 당신에게 베풀었기 때문이에요.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 진정한 나눔의 가치는 &#39;남는 것을 주는 것&#39;이 아니라 &#39;부족한 와중에도 쪼개어 주는 것&#39;에 있다는 논리적 근거를 제시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">gave to you (관용표현): give가 목적어 없이 &#39;주다&#39; 또는 &#39;기부하다&#39;라는 자동사적 의미로 쓰였다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 20 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">You’re offering<\/span> me something<\/b><\/span><span class=\"ko\">당신은 나에게 무언가를 제안하고 있어요<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>now that you have everything.<\/b><\/span><span class=\"ko\">이제 당신이 모든 것을 가졌으니.<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신은 이제 모든 것을 가졌으니 나에게 뭔가를 주려고 하는 거잖아요.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 제임스의 보답이 현재 그의 넘쳐나는 자산 중 극히 일부를 떼어주는 행위에 불과하다는 점을 짚어내며, 나눔의 질적 차이를 지적합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">You’re offering (현재진행): be동사(are) + 현재분사(-ing)가 결합하여 현재 진행 중인 동작을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">offer<\/td><td class=\"m\">제공하다, 내놓다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 21 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>That’s just generosity<\/b><\/span><span class=\"ko\">그것은 그저 관대함일 뿐이죠<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">at convenience<\/span>.<\/b><\/span><span class=\"ko\">편의에 따른.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그건 그저 편의에 따른 관대함일 뿐이죠.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> generosity at convenience는 자신의 삶에 아무런 타격이 없는 상태에서 베푸는 친절을 의미하며, 다윗이 행했던 희생적인 나눔과는 본질적으로 다르다는 뜻입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">at convenience (관용표현): &#39;편의에 따른&#39;이라는 의미로 쓰인 전치사구다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">generosity<\/td><td class=\"m\">너그러움<\/td><\/tr><tr><td class=\"w\">convenience<\/td><td class=\"m\">편의, 편리<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 22 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>So,<\/b><\/span><span class=\"ko\">그러니,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I can’t <span class=\"grammar-hl\">accept your offer<\/span>.”<\/b><\/span><span class=\"ko\">저는 당신의 제안을 받아들일 수 없어요.”<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러니, 저는 당신의 제안을 받아들일 수 없어요.”라고 말했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 다윗은 자신의 순수한 선행이 단순한 금전적 보상으로 치환되어 그 의미가 퇴색되는 것을 원치 않기에 제안을 확고히 거절합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">accept your offer (관용표현): &#39;제안을 받아들이다&#39;라는 의미의 동사+목적어 결합이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">offer<\/td><td class=\"m\">제공하다, 내놓다<\/td><\/tr><tr><td class=\"w\">accept<\/td><td class=\"m\">받아들이다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 23 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>James realized<\/b><\/span><span class=\"ko\">James는 깨달았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that money doesn’t <span class=\"grammar-hl\">make someone rich<\/span>.<\/b><\/span><span class=\"ko\">돈이 누군가를 부유하게 만들지 않는다는 것을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">James는 돈이 누군가를 부유하게 만들지 않는다는 것을 깨달았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 다윗의 말을 통해 제임스는 &#39;부(wealth)&#39;에 대한 기존의 관념을 수정하며 심경의 변화를 겪게 됩니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">make someone rich 5형식(SVOC) 구조: 사역의 의미를 가진 동사 make 뒤에 목적어 someone과 목적격보어(형용사) rich가 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">realize<\/td><td class=\"m\">깨닫다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 24 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Remembering<\/span> that moment,<\/b><\/span><span class=\"ko\">그 순간을 회상하며,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he said to the journalist,<\/b><\/span><span class=\"ko\">그는 그 기자에게 말했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“It’s the willingness <span class=\"grammar-hl\">to give<\/span><\/b><\/span><span class=\"ko\">“베풀려는 의지인 거죠<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>even when you have very little<\/b><\/span><span class=\"ko\">당신이 아주 조금만 가졌을 때조차도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that makes you wealthy.<\/b><\/span><span class=\"ko\">당신을 부유하게 만드는 것은.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 순간을 회상하며, 그는 그 기자에게 “당신을 부유하게 만드는 것은 거의 가진 게 없을 때조차도 베풀려는 의지인 거죠.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> willingness to give even when you have very little은 이 글의 핵심 주제로, 진정한 부유함이란 소유한 양이 아니라 베풀 수 있는 마음의 크기에 달려 있음을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Remembering (분사구문): 현재분사가 부사적 기능을 하며 시간을 나타낸다. 원래 절인 &#39;When he remembered&#39;로 바꿀 수 있다.<\/div><div class=\"lec-gr-item\">to give (to부정사(형용사적)): 명사 willingness를 수식하며 그 내용을 한정한다. 4번 규칙에 해당한다.<\/div><div class=\"lec-gr-item\">It’s the willingness ... that makes you wealthy (강조구문): It is와 that 사이에 강조하고자 하는 주어(the willingness to give...)를 넣은 It ~ that 강조 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">journalist<\/td><td class=\"m\">기자, 언론인<\/td><\/tr><tr><td class=\"w\">willingness<\/td><td class=\"m\">기꺼이 하려는 마음<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 25 / 25<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>And so,<\/b><\/span><span class=\"ko\">그러므로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>David is the richest person<\/b><\/span><span class=\"ko\">David가 가장 부유한 사람입니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">I have ever met<\/span>.”<\/b><\/span><span class=\"ko\">제가 이제껏 만난.”<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러므로, David가 제가 이제껏 만난 가장 부유한 사람입니다.”라고 말했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 기자의 질문에 대한 최종적인 답변으로, 세상의 잣대와는 다른 자신만의 기준으로 다윗을 최고의 부자로 정의하며 이야기를 마무리합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">I have ever met (관계대명사): 명사 person 뒤에 목적격 관계대명사(whom/that)가 생략된 구조로 앞의 명사를 수식한다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>억만장자 제임스 워커는 자신이 만난 가장 부유한 사람으로 과거 공항 가판대 소년 다윗을 꼽는다.<\/li><li>과거 빈털터리였던 제임스에게 다윗은 자신도 가난한 형편임에도 불구하고 두 차례나 조건 없이 신문을 선물했다.<\/li><li>세월이 흘러 성공한 제임스가 보답하려 했으나, 다윗은 풍족할 때 베푸는 것은 진정한 나눔이 아니라며 거절한다.<\/li><li>제임스는 이를 통해 진정한 부유함은 소유의 양이 아니라, 부족한 상황에서도 기꺼이 나누려는 마음에 있음을 깨닫는다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">David is considered the wealthiest person because he offered help while having almost nothing, whereas giving from abundance is merely a matter of convenience.<\/div>\n              <div class=\"lec-final-sum-ko\">데이비드는 가진 것이 거의 없을 때 도움을 주었기에 가장 부유한 사람으로 여겨지는데, 이는 풍족할 때 베푸는 행위가 그저 편의상의 관대함에 불과하기 때문이다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/8.mp3","hl":"stage-4"},{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/9.mp3","hl":"stage-5"}],[{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/10.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/11.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/12.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/13.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/14.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/15.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_43-45번_강의_audio/16.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2 눔에 본질적인 차이가 있음을 설명한다.","거절의 이유: 부족할 때 주는 것과 모든 것을 가졌을 때 주는 것은 다름","제임스의 제안에 대한 평가: 편의에 의한 관대함(generosity at convenience)","핵심 키워드: 부족함(almost nothing) vs 풍족함(everything)"]},{"label":"06진정한 부에 대한 깨달음","items":["제임스는 돈의 액수가 아닌 베푸는 마음의 깊이가 부의 기준임을 깨닫는다.","제임스의 깨달음: 아주 적게 가졌을 때도 기꺼이 주려는 마음(willingness to give)","최종 결론: 데이비드가 세상에서 가장 부유한 사람임"]}],"bkg":"진정한 부의 가치는 단순히 통장의 잔고가 아니라, 타인을 위하는 이타주의(Altruism)의 깊이에 따라 결정되기도 합니다. 사회심리학자 폴 피프(Paul Piff)의 연구에 따르면, 오히려 상대적으로 적게 가진 사람들이 타인의 고통에 더 깊이 공감하는 공감 능력(Empathy)을 발휘하여 소득 대비 더 관대한 태도를 보이는 경향이 있다고 해요. 대가 없이 타인을 돕는 이러한 친사회적 행동(Prosocial Behavior)은 자신이 풍족할 때 베푸는 '여유'와는 차원이 다른, 인간성 본연의 숭고한 가치를 지닙니다. 따라서 이 글을 읽을 때, 누군가에게 도움을 주는 행위가 풍요로움에서 나오는 선택인지 아니면 결핍 속에서도 나누는 진심인지에 주목해 본다면 '가장 부유한 사람'에 대한 진정한 정의를 새롭게 발견하실 수 있을 거예요.","ttsText":"진정한 부의 가치는 단순히 통장의 잔고가 아니라, 타인을 위하는 이타주의(Altruism)의 깊이에 따라 결정되기도 합니다. 사회심리학자 폴 피프(Paul Piff)의 연구에 따르면, 오히려 상대적으로 적게 가진 사람들이 타인의 고통에 더 깊이 공감하는 공감 능력(Empathy)을 발휘하여 소득 대비 더 관대한 태도를 보이는 경향이 있다고 해요. 대가 없이 타인을 돕는 이러한 친사회적 행동(Prosocial Behavior)은 자신이 풍족할 때 베푸는 '여유'와는 차원이 다른, 인간성 본연의 숭고한 가치를 지닙니다. 따라서 이 글을 읽을 때, 누군가에게 도움을 주는 행위가 풍요로움에서 나오는 선택인지 아니면 결핍 속에서도 나누는 진심인지에 주목해 본다면 '가장 부유한 사람'에 대한 진정한 정의를 새롭게 발견하실 수 있을 거예요.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 43-45번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 43-45번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고1 / 2025년 / 10월 / 43-45번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고1 / 2025년 / 10월 / 43-45번","titleEn":"True Wealth: Giving from the Heart, Not from Abundance","titleKo":"진정한 부: 풍요로움이 아닌 마음에서 우러나오는 나눔","imageUrl":"__enpImg__","stages":[{"label":"01기자의 질문과 제임스의 회상","items":["억만장자인 제임스 워커가 자신보다 더 부유한 사람이 있느냐는 질문을 받고 과거를 회상한다.","기자(journalist)의 질문: 당신보다 더 부유한 사람이 있는가?","제임스의 답변: 잊지 못할 한 청년이 있음","핵심 키워드: 부유함(richer/wealthy)"]},{"label":"02공항에서의 첫 번째 호의","items":["과거 가난했던 제임스는 공항 신문 가판대에서 데이비드라는 청년에게 뜻밖의 선물을 받는다.","제임스의 상황: 돈이 없어 신문을 사지 못하고 구경만 함(broke)","데이비드의 행동: 자신이 가진 돈으로 제임스에게 신문을 선물함(gift)","핵심 키워드: 가판대(newsstan
