kUfoB//2Q==\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">Dalip Singh Saund: A Trailblazer for Asian Representation in U.S. Politics<small>달립 싱 사운드: 미국 정치 내 아시아인 대표성을 위한 개척자<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">이 글을 깊이 있게 이해하기 위해서는 20세기 초 미국 내 아시아계 이민자들의 권리를 제한했던 외국인 토지법(Alien Land Laws)과 시민권 제도에 대한 이해가 필요합니다. 당시 미국 사회는 특정 국적의 유색인종이 땅을 소유하거나 시민권을 얻는 것을 법적으로 막아두었는데, 이는 마치 축구 경기에 초대받았지만 운동화도 신지 못하고 경기장 밖에서만 구경해야 하는 상황과 비슷했습니다. 지문에 등장하는 법안은 1946년 제정된 루스-셀러법(Luce-Celler Act)으로, 인도계와 필리핀계 이민자들에게 귀화(Naturalization)를 통해 시민권을 얻을 수 있는 길을 열어준 역사적인 전환점이 되었습니다. 이러한 배경을 알면 달립 싱 사운드가 아시아계 미국인(Asian American) 최초로 연방 의원이 된 것이 단순히 개인의 성공을 넘어 얼마나 거대한 제도적 장벽(Systemic Barrier)을 허문 사건인지 더 잘 이해하실 수 있을 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01학업과 미국 이주<\/div><ul><li>인도 태생의 미국 정치인인 달립 싱 사운드의 초기 배경과 학업 과정을 다룬다.<\/li><li>인도 펀자브 대학교 졸업 후 미국 대학원 진학<\/li><li>1924년 캘리포니아 대학교 박사 학위(doctoral degree) 취득<\/li><li>핵심 키워드: 인도 태생(Indian-born)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02국적으로 인한 현실적 장벽<\/div><ul><li>미국에서 학업을 마쳤으나 국적 문제로 인해 사회적, 경제적 제약을 겪는다.<\/li><li>국적(nationality) 문제로 인해 취업에 실패함<\/li><li>1925년 농업을 시작했으나 시민권(citizenship) 없이는 토지 매입 불가<\/li><li>이민자로서 겪은 제도적 한계 직면<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03정치 활동과 권익 증진<\/div><ul><li>자신의 처지를 극복하기 위해 정치에 관심을 갖고 인도인의 권리를 위해 목소리를 낸다.<\/li><li>인도 및 정치적 주제에 대해 적극적으로 발언함<\/li><li>인도인의 미국 시민권 취득을 허용하는 법안(bill) 추진<\/li><li>워싱턴 D.C.를 방문하여 정치적 영향력 행사<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04시민권 획득과 역사적 성취<\/div><ul><li>노력의 결실로 법적 권리를 얻고 미국 정계의 역사를 새로 쓴다.<\/li><li>1946년 법안 통과 및 1949년 미국 시민권 취득<\/li><li>미국 의회(U.S. Congress)에 선출된 최초의 아시아인 기록<\/li><li>핵심 성취: 최초의 아시아인 의원(the first Asian elected)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">graduate<\/td><td class=\"m\">졸업하다<\/td><\/tr><tr><td class=\"w\">attend<\/td><td class=\"m\">참석하다, 출석하다<\/td><\/tr><tr><td class=\"w\">earn<\/td><td class=\"m\">얻다, 벌다<\/td><\/tr><tr><td class=\"w\">degree<\/td><td class=\"m\">학위<\/td><\/tr><tr><td class=\"w\">nationality<\/td><td class=\"m\">국민성, 국적<\/td><\/tr><tr><td class=\"w\">citizenship<\/td><td class=\"m\">시민 의식, 시민권<\/td><\/tr><tr><td class=\"w\">develop<\/td><td class=\"m\">발전시키다, 개발하다<\/td><\/tr><tr><td class=\"w\">politics<\/td><td class=\"m\">정치<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">political<\/td><td class=\"m\">정치의, 정치적인<\/td><\/tr><tr><td class=\"w\">promote<\/td><td class=\"m\">촉진하다, 장려하다<\/td><\/tr><tr><td class=\"w\">bill<\/td><td class=\"m\">청구서, 계산서<\/td><\/tr><tr><td class=\"w\">allow<\/td><td class=\"m\">허용하다, ~하게 해 주다<\/td><\/tr><tr><td class=\"w\">receive<\/td><td class=\"m\">받다<\/td><\/tr><tr><td class=\"w\">elect<\/td><td class=\"m\">선출하다<\/td><\/tr><tr><td class=\"w\">congress<\/td><td class=\"m\">의회, 국회<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Dalip Singh Saund <span class=\"grammar-hl\">was<\/span> an Indianborn American politician.<\/b><\/span><span class=\"ko\">Dalip Singh Saund는 인도에서 태어난 미국인 정치인이었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Dalip Singh Saund는 인도에서 태어난 미국인 정치인이었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 주인공인 달립 싱 사운드를 소개하며, 그가 인도에서 태어나 미국에서 정치적 업적을 남긴 인물임을 명시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was (be동사): 문장의 주어인 Dalip Singh Saund의 정체를 설명하는 보어를 취하는 2형식 구조의 과거형 동사다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>After <span class=\"grammar-hl\">graduating<\/span><\/b><\/span><span class=\"ko\">졸업한 후에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from the University of Punjab in India,<\/b><\/span><span class=\"ko\">인도의 University of Punjab을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he moved<\/b><\/span><span class=\"ko\">그는 이주했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to the U.S.<\/b><\/span><span class=\"ko\">미국으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to attend<\/span> graduate school.<\/b><\/span><span class=\"ko\">대학원에 다니기 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">인도에서 University of Punjab을 졸업한 후에, 그는 대학원에 다니기 위해 미국으로 이주했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 인물의 초기 배경을 설명하며, 더 높은 학문을 공부하기 위해 미국이라는 새로운 환경으로 넘어왔음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">graduating (동명사): 전치사 After의 목적어로 쓰여 &#39;졸업하는 것&#39;이라는 행위를 나타내는 명사 역할이다.<\/div><div class=\"lec-gr-item\">to attend (to부정사(부사적): 목적): &#39;참석하기 위해서&#39;라는 의미를 나타내며, in order to attend로 바꾸어도 뜻이 같으므로 부사적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">graduate<\/td><td class=\"m\">졸업하다<\/td><\/tr><tr><td class=\"w\">attend<\/td><td class=\"m\">참석하다, 출석하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He earned his doctoral degree<\/b><\/span><span class=\"ko\">그는 박사학위를 받았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at the University of California<\/b><\/span><span class=\"ko\">University of California에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in 1924<\/b><\/span><span class=\"ko\">1924년에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but could not get a job<\/b><\/span><span class=\"ko\">하지만 직업을 구할 수 없었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">because of<\/span> his nationality.<\/b><\/span><span class=\"ko\">자신의 국적 때문에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 1924년에 University of California에서 박사학위를 받았지만 자신의 국적 때문에 직업을 구할 수 없었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> earned his doctoral degree는 그가 학문적으로 매우 뛰어난 성과를 냈음을 보여주지만, could not get a job은 당시 미국 사회가 개인의 능력보다 출신 국가를 우선시하여 차별을 두었음을 드러냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">because of (관용표현): &#39;~ 때문에&#39;라는 의미를 가진 전치사구로, 뒤에 명사구(his nationality)가 목적어로 온다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">earn<\/td><td class=\"m\">얻다, 벌다<\/td><\/tr><tr><td class=\"w\">degree<\/td><td class=\"m\">학위<\/td><\/tr><tr><td class=\"w\">nationality<\/td><td class=\"m\">국민성, 국적<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The next year,<\/b><\/span><span class=\"ko\">다음 해에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he began <span class=\"grammar-hl\">farming<\/span><\/b><\/span><span class=\"ko\">그는 농사를 시작했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in Imperial Valley,<\/b><\/span><span class=\"ko\">Imperial Valley에서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but he was not able <span class=\"grammar-hl\">to buy<\/span> land<\/b><\/span><span class=\"ko\">하지만 그는 땅을 구입할 수 없었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>without U.S. citizenship.<\/b><\/span><span class=\"ko\">미국 시민권 없이는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">다음 해에, 그는 Imperial Valley에서 농사를 시작했지만 미국 시민권이 없어 땅을 구입할 수 없었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 취업 실패 후 생계를 위해 농업을 택했지만, without U.S. citizenship은 당시 법체계가 외국인의 경제적 자립과 자산 소유를 제도적으로 가로막고 있었음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">farming (동명사): 동사 began의 목적어 자리에 쓰여 &#39;농사짓는 것&#39;이라는 행위를 나타내는 명사 역할이다.<\/div><div class=\"lec-gr-item\">to buy (to부정사(부사적): 형용사 수식): 형용사 able을 뒤에서 수식하여 &#39;~할 수 있는&#39;이라는 정도의 의미를 더하는 부사적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">citizenship<\/td><td class=\"m\">시민 의식, 시민권<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Dalip developed an interest in politics<\/b><\/span><span class=\"ko\">Dalip은 정치학에 대한 관심을 발전시켰다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and he often <span class=\"grammar-hl\">spoke out<\/span><\/b><\/span><span class=\"ko\">그리고 그는 종종 발언했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on Indian and political topics.<\/b><\/span><span class=\"ko\">인도 및 정치 주제에 대해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Dalip은 정치학에 대한 관심을 발전시켰고 그는 종종 인도 및 정치 주제에 대해 발언했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 반복되는 제도적 불이익을 겪으면서 문제의 원인이 정치적 권리에 있음을 깨닫고, spoke out을 통해 개인의 불만을 넘어 사회적 담론을 형성하기 시작했음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">spoke out (관용표현): &#39;~에 대해 거침없이 말하다/목소리를 높이다&#39;라는 의미를 가진 구동사(phrasal verb)다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">develop<\/td><td class=\"m\">발전시키다, 개발하다<\/td><\/tr><tr><td class=\"w\">politics<\/td><td class=\"m\">정치<\/td><\/tr><tr><td class=\"w\">political<\/td><td class=\"m\">정치의, 정치적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He went<\/b><\/span><span class=\"ko\">그는 갔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to Washington, D.C.<\/b><\/span><span class=\"ko\">Washington, D.C.에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and promoted a bill<\/b><\/span><span class=\"ko\">그리고 법안을 홍보했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> would <span class=\"grammar-hl\">allow Indians to become<\/span> U.S. citizens.<\/b><\/span><span class=\"ko\">인도인이 미국 시민이 될 수 있도록 하는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 Washington, D.C.에 가서 인도인이 미국 시민이 될 수 있도록 하는 법안을 홍보했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 자신의 목소리를 실제 법 개정으로 연결하기 위해 정치의 중심지로 향했으며, promoted a bill은 자신과 같은 처지에 놓인 사람들의 근본적인 고통을 해결하려 직접 행동에 나섰음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that (관계대명사): 선행사 a bill을 수식하는 주격 관계대명사로, 뒤에 주어가 빠진 불완전한 절이 이어진다.<\/div><div class=\"lec-gr-item\">allow Indians to become 5형식(SVOC) 구조: 동사(allow) + 목적어(Indians) + 목적격보어(to become) 구조로 &#39;목적어가 ~하도록 허용하다&#39;라는 의미를 만든다.<\/div><div class=\"lec-gr-item\">to become (to부정사(목적격보어)): allow + O + to V 구조에서 목적어인 Indians의 동작을 설명하는 목적격보어다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">promote<\/td><td class=\"m\">촉진하다, 장려하다<\/td><\/tr><tr><td class=\"w\">bill<\/td><td class=\"m\">청구서, 계산서<\/td><\/tr><tr><td class=\"w\">allow<\/td><td class=\"m\">허용하다, ~하게 해 주다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The bill <span class=\"grammar-hl\">was passed<\/span><\/b><\/span><span class=\"ko\">그 법안은 통과되었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in 1946,<\/b><\/span><span class=\"ko\">1946년에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and three years later<\/b><\/span><span class=\"ko\">그리고 3년 후에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Dalip received U.S. citizenship.<\/b><\/span><span class=\"ko\">Dalip은 미국 시민권을 받았다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 법안은 1946년에 통과되었고, 3년 후에 Dalip은 미국 시민권을 받았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 끈질긴 노력 끝에 법적 장벽이 무너졌음을 나타내며, 이를 통해 그가 드디어 미국 사회의 정당한 구성원으로 인정받게 되었음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was passed (수동태): be동사(was)+p.p.(passed) 구조. pass는 타동사인데 뒤에 목적어가 없어서 수동구조 was passed 형태로 쓴다. 기본구조: V + O(목적어).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">citizenship<\/td><td class=\"m\">시민 의식, 시민권<\/td><\/tr><tr><td class=\"w\">bill<\/td><td class=\"m\">청구서, 계산서<\/td><\/tr><tr><td class=\"w\">receive<\/td><td class=\"m\">받다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He later became the first Asian<\/b><\/span><span class=\"ko\">그는 후에 최초의 아시아인이 되었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to be elected<\/span> to the U.S. Congress.<\/b><\/span><span class=\"ko\">미국 의회에 당선된.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 후에 미국 의회에 당선된 최초의 아시아인이 되었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> first Asian to be elected는 이전에 땅조차 살 수 없었던 이방인이 법을 만드는 자리에 오름으로써, 개인의 승리를 넘어 아시아인의 정치적 위상을 높인 역사적 결말을 장식합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to be elected (to부정사(형용사적)): 앞의 명사 the first Asian을 수식하며 &#39;~된&#39;의 의미를 갖는 형용사적 용법이다.<\/div><div class=\"lec-gr-item\">to be elected (수동태): be동사(be)+p.p.(elected) 구조가 to부정사 내에서 결합된 수동형 부정사다. elect는 타동사인데 목적어가 없어서 수동구조 to be elected 형태로 쓴다. 기본구조: V + O(목적어).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">elect<\/td><td class=\"m\">선출하다<\/td><\/tr><tr><td class=\"w\">congress<\/td><td class=\"m\">의회, 국회<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>인도 출신 달립 싱 사운드는 미국에서 박사 학위를 땄으나 국적 때문에 취업에 실패했다.<\/li><li>농사를 지으려 했으나 시민권이 없어 땅을 소유하지 못하는 법적 한계를 경험했다.<\/li><li>차별을 극복하기 위해 정치적 활동을 시작했고 인도인의 시민권 취득을 돕는 법안 통과를 이끌어냈다.<\/li><li>결국 본인도 시민권을 얻었으며, 아시아인 최초로 미국 연방 하원의원에 당선되는 업적을 세웠다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Dalip Singh Saund overcame citizenship barriers through political activism before becoming the first Asian elected to the U.S. Congress.<\/div>\n              <div class=\"lec-final-sum-ko\">달립 싱 사운드는 미국 의회에 선출된 최초의 아시아인이 되기 전에 정치적 활동을 통해 시민권 장벽을 극복했다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_26번_강의_audio/1.mp
