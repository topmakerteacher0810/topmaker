OaQtyDkY6HnnPTv2zjnGfTrTuHy/L/P+regjHJAyPrwR7AjOccg5HcDpxUX1GfXH+Gckcnj26dKmYAgkMnXJJIyMY46AYGCCT147kgN2gkbSo47t3HXnp7nnrnHHRJW33erf9dr2Xl8w9Nun/A/r8CPk4xwO/Y8fXj1659BSEkcnoccfnzzj3znHAzntTuOxB+hB/kT+vWkJ9RwP/1/ofXH14pgLR26/wCfXt/SgYI6543D8cH+RH14HORk45H+cduO3+ffK9H2ff8Aq6/zAMc9OnTvx1Pp27/j7Uc/4n3/ABz1+v69FBycnp0PXnB5/wAffr1NJTD+vv8A61AkD8+/XH8uBz+dI33Tj0Pv17/SnY47fr+X8vzHvTThVPGFAOPTOM49Bn/AcdQeum347ff07hr/AFp/mf/Z\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">The Power of Illusory Progress: Why a Head Start Drives Motivation<small>환상적인 진전의 힘: 왜 선두 출발이 동기 부여를 촉진하는가<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">이 지문은 심리학과 마케팅 분야에서 널리 알려진 부여된 진전 효과(Endowed Progress Effect)를 보여주는 실험을 다루고 있는데, 이는 사람들이 목표에 도달하기까지 이미 어느 정도 진전이 있었다고 믿을 때 동기부여가 더 강해지는 현상을 말합니다. 이는 결승선에 가까워질수록 속도를 더 높이게 된다는 목표 구배 가설(Goal Gradient Hypothesis)과 맥을 같이하며, 아무것도 없는 0의 상태보다 인위적인 시작점(Artificial start)이 주어졌을 때 사람들은 과업을 훨씬 덜 부담스럽게 느낍니다. 마치 텅 빈 도화지에 첫 획을 긋는 것보다 이미 밑그림이 그려진 상태에서 색칠을 시작할 때 더 심리적인 추진력(Psychological momentum)을 얻는 것과 비슷한 원리라고 볼 수 있어요. 결과적으로 이 실험은 소비자에게 가시적인 진척도(Visualized progress)를 보여주는 것이 실제 보상의 크기보다 행동 변화를 이끌어내는 데 얼마나 더 효과적인지를 잘 설명해 줍니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01실험 설계<\/div><ul><li>보상 카드의 진전 방식이 고객의 동기 부여에 미치는 영향을 실험함.<\/li><li>보상 조건: 커피 10잔 구매 시 1잔 무료 제공(reward)<\/li><li>연구진: Kivetz, Urminsky, Zheng의 카페 협업 실험<\/li><li>핵심 키워드: 실험(experiment)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02두 가지 카드 조건<\/div><ul><li>실질적으로는 동일한 구매가 필요하지만 형식이 다른 두 종류의 카드를 배부함.<\/li><li>그룹 A: 빈 슬롯 10개가 있는 카드 제공<\/li><li>그룹 B: 12개 슬롯 중 2개가 이미 찍힌 보너스 도장(bonus stamps) 카드 제공<\/li><li>핵심 키워드: 동일한 보상 프로그램(identical reward programs)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03착각된 진전의 발생<\/div><ul><li>그룹 B는 목표의 일부를 이미 달성했다는 심리적 착각을 경험함.<\/li><li>시작 전 이미 16%를 완료했다고 느낌<\/li><li>유리한 출발(head start)을 했다는 인식 형성<\/li><li>핵심 키워드: 착각된 진전(illusory progress)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04고객 행동의 변화<\/div><ul><li>진전이 있다고 믿는 그룹은 그렇지 않은 그룹보다 더 적극적인 구매 행동을 보임.<\/li><li>카페 방문 빈도(often)가 더 높아짐<\/li><li>대조군보다 더 빠르게 보상 카드를 채움<\/li><li>핵심 키워드: 빠른 목표 달성(quickly)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05실험의 결론<\/div><ul><li>목표에 더 가깝다고 인식할수록 그것을 완수하려는 동기가 더 강화됨.<\/li><li>보상에 더 가까워졌다는 믿음이 행동을 촉진함<\/li><li>심리적 거리감이 동기 부여 수준을 결정함<\/li><li>핵심 키워드: 동기 부여(motivation)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">motivate<\/td><td class=\"m\">동기를 부여하다<\/td><\/tr><tr><td class=\"w\">illusory<\/td><td class=\"m\">환상적인, 환영의, 환상에 불과한<\/td><\/tr><tr><td class=\"w\">progress<\/td><td class=\"m\">나아가다, 진행되다<\/td><\/tr><tr><td class=\"w\">experiment<\/td><td class=\"m\">실험<\/td><\/tr><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">receive<\/td><td class=\"m\">받다<\/td><\/tr><tr><td class=\"w\">reward<\/td><td class=\"m\">보상<\/td><\/tr><tr><td class=\"w\">offer<\/td><td class=\"m\">제공하다, 내놓다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">slot<\/td><td class=\"m\">자리, 구멍<\/td><\/tr><tr><td class=\"w\">strictly<\/td><td class=\"m\">엄격히<\/td><\/tr><tr><td class=\"w\">identical<\/td><td class=\"m\">똑같은, 동일한<\/td><\/tr><tr><td class=\"w\">purchase<\/td><td class=\"m\">구매하다<\/td><\/tr><tr><td class=\"w\">appeal<\/td><td class=\"m\">매력, 호소력<\/td><\/tr><tr><td class=\"w\">according to<\/td><td class=\"m\">~에 따르면, ~에 따라<\/td><\/tr><tr><td class=\"w\">drive<\/td><td class=\"m\">운전하다<\/td><\/tr><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 지각하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Kivetz, Urminsky, and Zheng<\/b><\/span><span class=\"ko\">Kivetz, Urminsky, Zheng은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>partnered with a café<\/b><\/span><span class=\"ko\">한 카페와 협력했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to test<\/span> the <span class=\"grammar-hl\">motivating<\/span> effect of illusory progress<\/b><\/span><span class=\"ko\">착각된 진전의 동기 부여 효과를 시험해 보기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in an experiment.<\/b><\/span><span class=\"ko\">실험에서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Kivetz, Urminsky, Zheng은 착각된 진전이 주는 동기 부여 효과를 실험에서 시험해 보기 위해 한 카페와 협력했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 문장은 연구의 목적과 배경을 소개하며 글을 시작합니다. illusory progress는 실제로 목표에 다가간 것은 아니지만, 심리적으로는 이미 진행 과정이 시작되었다고 믿게 만드는 속임수를 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to test (to부정사(부사적/목적)): in order to test로 바꿔도 뜻이 같다. 주절의 목적(~하기 위해서)을 나타낸다.<\/div><div class=\"lec-gr-item\">motivating (현재분사(형용사)): motivating이 뒤의 명사인 effect를 수식하며, 명사가 ‘동기를 부여하는’ 능동의 상태임을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">motivate<\/td><td class=\"m\">동기를 부여하다<\/td><\/tr><tr><td class=\"w\">illusory<\/td><td class=\"m\">환상적인, 환영의, 환상에 불과한<\/td><\/tr><tr><td class=\"w\">progress<\/td><td class=\"m\">나아가다, 진행되다<\/td><\/tr><tr><td class=\"w\">experiment<\/td><td class=\"m\">실험<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Customers<\/b><\/span><span class=\"ko\">고객들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>received a reward card<\/b><\/span><span class=\"ko\">보상 카드를 받았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that offered one free coffee<\/span><\/b><\/span><span class=\"ko\">무료 커피 한 잔을 제공하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>after they’d bought ten.<\/b><\/span><span class=\"ko\">그들이 열 잔을 산 후에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">고객들은 열 잔을 산 후에 무료 커피 한 잔을 제공하는 보상 카드를 받았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 실험의 구체적인 보상 체계를 설명하는 문장입니다. 무료 커피라는 보상을 얻기 위해 필요한 bought ten, 즉 10번의 구매라는 기본 조건을 설정하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that offered one free coffee (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사 a reward card를 수식한다. 절 내부에서 that은 주어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">receive<\/td><td class=\"m\">받다<\/td><\/tr><tr><td class=\"w\">reward<\/td><td class=\"m\">보상<\/td><\/tr><tr><td class=\"w\">offer<\/td><td class=\"m\">제공하다, 내놓다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>While half of the customers<\/b><\/span><span class=\"ko\">고객들 중 절반은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>received a card<\/b><\/span><span class=\"ko\">카드를 받은 반면에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with ten open slots,<\/b><\/span><span class=\"ko\">열 개의 빈칸이 있는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">the other half<\/span><\/b><\/span><span class=\"ko\">나머지 절반은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>got a card<\/b><\/span><span class=\"ko\">카드를 받았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with twelve open slots.<\/b><\/span><span class=\"ko\">열두 개의 빈칸이 있는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">고객들 중 절반은 열 개의 빈칸이 있는 카드를 받은 반면에, 나머지 절반은 열두 개의 빈칸이 있는 카드를 받았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 보상 조건을 바탕으로 실험 대상을 두 그룹으로 나눕니다. ten open slots와 twelve open slots라는 서로 다른 외양의 카드를 제시하여 비교 대조의 틀을 마련합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">the other half (관용표현): 정해진 둘 중 나머지를 가리킬 때 &#39;the other&#39;를 사용한다. 여기서는 전체 고객을 두 집단으로 나누었으므로 나머지 한 집단을 의미한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">receive<\/td><td class=\"m\">받다<\/td><\/tr><tr><td class=\"w\">slot<\/td><td class=\"m\">자리, 구멍<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Yet<\/b><\/span><span class=\"ko\">하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the twelve-slot card<\/b><\/span><span class=\"ko\">열두 칸짜리 카드는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>had two <span class=\"grammar-hl\">preexisting<\/span> “bonus” stamps,<\/b><\/span><span class=\"ko\">이미 찍힌 두 개의 ‘보너스’ 도장을 가지고 있었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so, <span class=\"grammar-hl\">strictly speaking<\/span>,<\/b><\/span><span class=\"ko\">그래서 엄밀히 말하면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>these<\/b><\/span><span class=\"ko\">이것들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>were identical reward programs.<\/b><\/span><span class=\"ko\">동일한 보상 프로그램이었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 열두 칸짜리의 카드에는 이미 찍힌 두 개의 ‘보너스’ 도장이 있어서, 엄밀히 말하면, 이것들은 동일한 보상 프로그램이었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 두 그룹의 실질적인 조건이 같음을 밝힙니다. identical reward programs는 12칸 중 2칸이 채워진 것이나 10칸이 모두 빈 것이나, 결국 앞으로 채워야 할 도장은 10개로 똑같다는 사실을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">preexisting (현재분사(형용사)): preexisting이 stamps를 수식하며, 도장이 &#39;이미 존재하고 있는&#39; 상태임을 나타낸다.<\/div><div class=\"lec-gr-item\">strictly speaking (관용표현): &#39;엄격히 말하자면&#39;이라는 의미의 독립 분사구문 관용어구이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reward<\/td><td class=\"m\">보상<\/td><\/tr><tr><td class=\"w\">slot<\/td><td class=\"m\">자리, 구멍<\/td><\/tr><tr><td class=\"w\">strictly<\/td><td class=\"m\">엄격히<\/td><\/tr><tr><td class=\"w\">identical<\/td><td class=\"m\">똑같은, 동일한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Every customer<\/b><\/span><span class=\"ko\">모든 고객은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who got a card<\/span><\/b><\/span><span class=\"ko\">카드를 받은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>needed <span class=\"grammar-hl\">to make<\/span> ten coffee purchases (and collect ten stamps)<\/b><\/span><span class=\"ko\">열 잔의 커피를 구매해야 (그리고 도장 열 개를 모아야) 했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to get<\/span> their free coffee.<\/b><\/span><span class=\"ko\">그들의 무료 커피를 받기 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">카드를 받은 모든 고객은 무료 커피를 받기 위해 열 잔의 커피를 구매해야 (그리고 도장 열 개를 모아야) 했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 내용을 재확인하며 논리를 공고히 합니다. collect ten stamps는 겉모습이 어떠하든 고객이 치러야 할 실제 비용과 노력에는 차이가 없음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who got a card (관계대명사): 주격 관계대명사 who가 이끄는 절이 선행사 Every customer를 수식한다.<\/div><div class=\"lec-gr-item\">to make (to부정사(명사적)): 타동사 needed의 목적어 자리에 쓰여 &#39;~하는 것&#39;이라는 행위의 대상을 나타낸다.<\/div><div class=\"lec-gr-item\">to get (to부정사(부사적/목적)): in order to get으로 바꿔도 뜻이 같다. 목적(~하기 위해서)을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">purchase<\/td><td class=\"m\">구매하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But<\/b><\/span><span class=\"ko\">하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the <span class=\"grammar-hl\">appeal of the free stamps<\/span><\/b><\/span><span class=\"ko\">무료 도장의 매력은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>was high.<\/b><\/span><span class=\"ko\">컸다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 무료 도장의 매력은 컸다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 논리적 사실과는 다른 심리적 반전을 암시하며 분위기를 전환합니다. the appeal of the free stamps는 이성적으로는 차이가 없더라도, 공짜로 무언가를 미리 받았다는 느낌이 사람의 마음을 강력하게 움직였음을 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">appeal of the free stamps (관용표현): &#39;A of B&#39; 구조로 &#39;B의 A&#39;라는 소유나 소속의 관계를 나타내며, 여기서는 &#39;무료 도장의 매력&#39;으로 해석된다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">appeal<\/td><td class=\"m\">매력, 호소력<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>People<\/b><\/span><span class=\"ko\">사람들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who thought<\/span> they’d gotten a head start<\/b><\/span><span class=\"ko\">자신이 앞선 출발을 했다고 생각한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>came back to the café<\/b><\/span><span class=\"ko\">카페에 돌아왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>more often,<\/b><\/span><span class=\"ko\">더 자주<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">filling in their reward card<\/span><\/b><\/span><span class=\"ko\">그들의 보상 카드를 채우며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>more quickly than the others.<\/b><\/span><span class=\"ko\">다른 사람들보다 더 빨리.<\/span><\/div><\/div><div class=\"lec-sent-ko\">자신이 앞선 출발을 했다고 생각한 사람들은 카페에 더 자주 돌아왔고, 다른 사람들보다 더 빨리 그들의 보상 카드를 채웠다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 실험의 실제 결과를 제시합니다. gotten a head start는 2개의 보너스 도장을 받은 고객들이 자신이 남들보다 앞서 나가고 있다고 인식하여 소비 행태가 더 적극적으로 변했음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who thought (관계대명사): 주격 관계대명사 who가 이끄는 절이 선행사 People을 수식한다.<\/div><div class=\"lec-gr-item\">filling in their reward card (분사구문): 원래 절로 변환하면 &#39;while they filled in their reward card&#39; 또는 &#39;and they filled in their reward card&#39;로 쓸 수 있다. 주절의 동작(came back)과 동시에 일어나거나 연속되는 상황을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reward<\/td><td class=\"m\">보상<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When the card came<\/b><\/span><span class=\"ko\">그 카드가 왔을 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with two out of twelve <span class=\"grammar-hl\">slots already filled<\/span>,<\/b><\/span><span class=\"ko\">열두 칸 중 두 칸이 이미 채워진 채로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it felt to customers<\/b><\/span><span class=\"ko\">그것은 고객들에게 느껴졌다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>like they were already 16 percent finished<\/b><\/span><span class=\"ko\">그들이 이미 16퍼센트 끝낸 것처럼<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with the goal<\/b><\/span><span class=\"ko\">그 목표를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>before they’d even started.<\/b><\/span><span class=\"ko\">그들이 시작하기도 전에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">열두 칸 중 두 칸이 이미 채워진 채로 카드가 손에 들어왔을 때, 그것은 고객들에게 시작도 하기 전에 이미 목표의 16퍼센트를 끝낸 것처럼 느껴졌다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 고객들이 느낀 착각의 실체를 수치로 상세히 풀어서 설명합니다. 16 percent finished는 전체 칸 수 대비 채워진 칸의 비율을 뇌가 무의식적으로 계산하여, 아무것도 없는 상태보다 목표에 훨씬 더 근접해 있다는 느낌을 받았다는 뜻입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">slots already filled (과거분사(형용사)): filled가 slots를 수식하며 &#39;이미 채워진 칸&#39;이라는 의미를 만든다. slots that were already filled에서 &#39;관계대명사+be동사&#39;가 생략된 축약 구조로 볼 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">customer<\/td><td class=\"m\">고객, 손님<\/td><\/tr><tr><td class=\"w\">slot<\/td><td class=\"m\">자리, 구멍<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Believing they were closer to the reward<\/span>,<\/b><\/span><span class=\"ko\">자신들이 보상에 더 가까워졌다고 믿었기 때문에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they were more motivated<\/b><\/span><span class=\"ko\">그들은 더 큰 동기를 부여받았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to reach<\/span> the finish line.<\/b><\/span><span class=\"ko\">결승선에 도달하는 데.<\/span><\/div><\/div><div class=\"lec-sent-ko\">자신들이 보상에 더 가까워졌다고 믿었기 때문에, 그들은 결승선에 도달하는 데 더 큰 동기를 부여받았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 실험의 최종 결론을 내립니다. closer to the reward는 목표 지점이 눈앞에 보인다고 느낄수록 그것을 빨리 완수하고 싶어 하는 인간의 심리적 본능이 강화되었음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Believing they were closer to the reward (분사구문): 원래 절로 변환하면 &#39;Because they believed they were closer to the reward&#39;로 쓸 수 있다. 주절의 주어(they)가 믿는 주체이므로 현재분사 형태를 사용하며, 문장의 이유를 나타낸다.<\/div><div class=\"lec-gr-item\">to reach to부정사(부사적/형용사 수식): 형용사 motivated 뒤에서 해당 형용사의 근거나 범위를 한정하며 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">motivate<\/td><td class=\"m\">동기를 부여하다<\/td><\/tr><tr><td class=\"w\">reward<\/td><td class=\"m\">보상<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>사람들은 실제로 아무런 진전이 없더라도, 진전이 있는 것처럼 보이면 더 큰 동기를 부여받는다.<\/li><li>실험에서 10칸 빈 카드와 2칸이 미리 채워진 12칸 카드는 채워야 할 도장 수가 10개로 동일했다.<\/li><li>하지만 보너스 도장을 받아 &#39;유리한 시작&#39;을 했다고 믿은 그룹은 카페를 더 자주 방문했다.<\/li><li>이는 목표에 이미 다가갔다는 착각이 결승선에 도달하려는 의욕을 높이기 때문이다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Perceived progress toward a goal increases consumer motivation because the illusion of a head start makes individuals work faster to reach the reward.<\/div>\n              <div class=\"lec-final-sum-ko\">선두 출발의 환상이 개인이 보상에 도달하기 위해 더 빠르게 행동하도록 만들기 때문에, 목표를 향한 인지된 진전은 소비자의 동기를 증가시킨다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/8.mp3","hl":"stage-4"}],[{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/9.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/10.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/11.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/12.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/13.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/14.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/15.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/16.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/17.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/18.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/19.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/20.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/21.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/22.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/23.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/24.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/25.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/26.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_40번_강의_audio/27.mp3","hl":"grammar"}],[{"audio":"./모의고사 더 강해지는 현상을 말합니다. 이는 결승선에 가까워질수록 속도를 더 높이게 된다는 목표 구배 가설(Goal Gradient Hypothesis)과 맥을 같이하며, 아무것도 없는 0의 상태보다 인위적인 시작점(Artificial start)이 주어졌을 때 사람들은 과업을 훨씬 덜 부담스럽게 느낍니다. 마치 텅 빈 도화지에 첫 획을 긋는 것보다 이미 밑그림이 그려진 상태에서 색칠을 시작할 때 더 심리적인 추진력(Psychological momentum)을 얻는 것과 비슷한 원리라고 볼 수 있어요. 결과적으로 이 실험은 소비자에게 가시적인 진척도(Visualized progress)를 보여주는 것이 실제 보상의 크기보다 행동 변화를 이끌어내는 데 얼마나 더 효과적인지를 잘 설명해 줍니다.","ttsText":"이 지문은 심리학과 마케팅 분야에서 널리 알려진 부여된 진전 효과(Endowed Progress Effect)를 보여주는 실험을 다루고 있는데, 이는 사람들이 목표에 도달하기까지 이미 어느 정도 진전이 있었다고 믿을 때 동기부여가 더 강해지는 현상을 말합니다. 이는 결승선에 가까워질수록 속도를 더 높이게 된다는 목표 구배 가설(Goal Gradient Hypothesis)과 맥을 같이하며, 아무것도 없는 0의 상태보다 인위적인 시작점(Artificial start)이 주어졌을 때 사람들은 과업을 훨씬 덜 부담스럽게 느낍니다. 마치 텅 빈 도화지에 첫 획을 긋는 것보다 이미 밑그림이 그려진 상태에서 색칠을 시작할 때 더 심리적인 추진력(Psychological momentum)을 얻는 것과 비슷한 원리라고 볼 수 있어요. 결과적으로 이 실험은 소비자에게 가시적인 진척도(Visualized progress)를 보여주는 것이 실제 보상의 크기보다 행동 변화를 이끌어내는 데 얼마나 더 효과적인지를 잘 설명해 줍니다.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 40번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 40번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고1 / 2025년 / 10월 / 40번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고1 / 2025년 / 10월 / 40번","titleEn":"The Power of Illusory Progress: Why a Head Start Drives Motivation","titleKo":"환상적인 진전의 힘: 왜 선두 출발이 동기 부여를 촉진하는가","imageUrl":"__enpImg__","stages":[{"label":"01실험 설계","items":["보상 카드의 진전 방식이 고객의 동기 부여에 미치는 영향을 실험함.","보상 조건: 커피 10잔 구매 시 1잔 무료 제공(reward)","연구진: Kivetz, Urminsky, Zheng의 카페 협업 실험","핵심 키워드: 실험(experiment)"]},{"label":"02두 가지 카드 조건","items":["실질적으로는 동일한 구매가 필요하지만 형식이 다른 두 종류의 카드를 배부함.","그룹 A: 빈 슬롯 10개가 있는 카드 제공","그룹 B: 12개 슬롯 중 2개가 이미 찍힌 보너스 도장(bonus stamps) 카드 제공","핵심 키워드: 동일한 보상 프로그램(identical reward programs)"]},{"label":"03착각된 진전의 발생","items":["그룹 B는 목표의 일부를 이미 달성했다는 심리적 착각을 경험함.","시작 전 이미 16%를 완료했다고 느낌","유리한 출발(head start)을 했다는 인식 형성","핵심 키워드: 착각된 진전(illusory progress)"]},{"label":"04고객 행동의 변화","items":["진전이 있다고 믿는 그룹은 그렇지 않은 그룹보다 더 적극적인 구매 행동을 보임.","카페 방문 빈도(often)가 더 높아짐",
