럼, 우리의 사회적 행동은 고정된 유전적 프로그래밍(Genetic Programming)보다는 세대 간 전수되는 창의적인 학습의 결과물이라고 할 수 있습니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01곤충의 고도화된 사회성<\/div><ul><li>사회성의 여러 지표에서 개미나 벌과 같은 곤충이 인간보다 앞서기도 한다.<\/li><li>친척들이 모여 완벽하게 조화로운 행동을 보임<\/li><li>새끼를 공동으로 돌봄 (collectively care)<\/li><li>핵심 키워드: 사회성 (sociality)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02곤충의 고정된 사회적 패턴<\/div><ul><li>곤충의 사회적 행동은 유전과 본능에 의해 엄격하게 통제된다.<\/li><li>유전적으로 단단히 프로그램됨 (tightly programmed genetically)<\/li><li>페로몬에 의해 추진되며 예측 가능함 (propelled pheromonally)<\/li><li>육각형 벌집이나 줄지어 이동하는 고정된 패턴 (patterns)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03인간 사회성의 유연성과 다양성<\/div><ul><li>인간은 유전적 프로그램에서 더 자유롭기에 사회적 양상이 훨씬 다양하다.<\/li><li>곤충보다 덜 고정된 유전적 프로그램 (less tightly programmed)<\/li><li>사회적 패턴이 다양하고 역동적임 (diverse and dynamic)<\/li><li>집단마다 다른 방식의 사회적 안무를 가짐 (choreographies)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04환경과 학습을 통한 사회성 형성<\/div><ul><li>인간의 사회적 행동은 선천적 본능보다 후천적 요인에 의해 더 큰 영향을 받는다.<\/li><li>세대를 거치며 사회적 패턴이 변화함 (change across generations)<\/li><li>본성보다는 양육과 환경에 의해 형성됨 (shaped by nurture, not just nature)<\/li><li>주변 사람들과의 조화 (harmony)를 이루는 방식의 차이<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recur<\/td><td class=\"m\">되풀이하다, 재발하다<\/td><\/tr><tr><td class=\"w\">propel<\/td><td class=\"m\">나아가게 하다<\/td><\/tr><tr><td class=\"w\">social<\/td><td class=\"m\">사회의, 사회적인<\/td><\/tr><tr><td class=\"w\">humanity<\/td><td class=\"m\">인류<\/td><\/tr><tr><td class=\"w\">shame<\/td><td class=\"m\">수치심, 부끄러움<\/td><\/tr><tr><td class=\"w\">metric<\/td><td class=\"m\">지표, 척도<\/td><\/tr><tr><td class=\"w\">variety<\/td><td class=\"m\">다양성<\/td><\/tr><tr><td class=\"w\">relative<\/td><td class=\"m\">상대적인<\/td><\/tr><tr><td class=\"w\">perfectly<\/td><td class=\"m\">완벽하게<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">harmonious<\/td><td class=\"m\">조화로운<\/td><\/tr><tr><td class=\"w\">collectively<\/td><td class=\"m\">집단적으로<\/td><\/tr><tr><td class=\"w\">colony<\/td><td class=\"m\">군집, 식민지<\/td><\/tr><tr><td class=\"w\">impressive<\/td><td class=\"m\">인상적인, 훌륭한<\/td><\/tr><tr><td class=\"w\">hive<\/td><td class=\"m\">벌집, 벌통<\/td><\/tr><tr><td class=\"w\">formation<\/td><td class=\"m\">형성<\/td><\/tr><tr><td class=\"w\">diverse<\/td><td class=\"m\">다양한<\/td><\/tr><tr><td class=\"w\">dynamic<\/td><td class=\"m\">역동적인<\/td><\/tr><tr><td class=\"w\">slightly<\/td><td class=\"m\">약간, 조금<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Humans<\/b><\/span><span class=\"ko\">인간은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are not<\/b><\/span><span class=\"ko\">아니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">the most social animal<\/span>.<\/b><\/span><span class=\"ko\">가장 사회적인 동물이.<\/span><\/div><\/div><div class=\"lec-sent-ko\">인간이 ‘가장’ 사회적인 동물은 아니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 인간이 지구상에서 가장 고도의 사회성을 가진 존재라는 통념을 깨며 글을 시작합니다. 이어지는 내용에서 인간보다 더 밀접한 사회적 결속을 보여주는 생물학적 사례가 등장할 것임을 암시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">the most social animal (최상급): &#39;the + most + 형용사&#39; 형태로 &#39;가장 ~한&#39;이라는 의미를 나타낸다. 여기서는 인간과 다른 동물들을 비교하여 그 정도가 가장 높음을 표현한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">social<\/td><td class=\"m\">사회의, 사회적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Ants, bees, and termites<\/b><\/span><span class=\"ko\">개미, 벌, 그리고 흰개미는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">put humanity to shame<\/span><\/b><\/span><span class=\"ko\">인류를 부끄럽게 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on many metrics of sociality.<\/b><\/span><span class=\"ko\">많은 사회성 측정 기준에서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">개미, 벌, 그리고 흰개미는 많은 사회성 측정 기준에서 인류를 부끄럽게 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> put humanity to shame은 곤충들이 보여주는 조직력이나 협동의 수준이 인간의 그것을 훨씬 능가한다는 의미입니다. 앞 문장의 주장을 뒷받침하기 위해 구체적인 비교 대상을 제시하여 논리를 강화합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">put humanity to shame (관용표현): &#39;put A to shame&#39;은 &#39;A를 부끄럽게 만들다&#39; 또는 &#39;A를 무색하게 할 정도로 훨씬 낫다&#39;라는 의미를 가진다. 개미나 벌 등이 사회성 측면에서 인간보다 뛰어나다는 점을 강조한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">social<\/td><td class=\"m\">사회의, 사회적인<\/td><\/tr><tr><td class=\"w\">humanity<\/td><td class=\"m\">인류<\/td><\/tr><tr><td class=\"w\">shame<\/td><td class=\"m\">수치심, 부끄러움<\/td><\/tr><tr><td class=\"w\">metric<\/td><td class=\"m\">지표, 척도<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">A wide variety of relatives<\/span><\/b><\/span><span class=\"ko\">매우 다양한 동족들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">live<\/span> together<\/b><\/span><span class=\"ko\">함께 산다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with perfectly harmonious behavior<\/b><\/span><span class=\"ko\">완벽하게 조화로운 행동으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and collectively <span class=\"grammar-hl\">care for<\/span> their young.<\/b><\/span><span class=\"ko\">그리고 집단적으로 그들의 어린 새끼들을 돌본다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">매우 다양한 동족들이 완벽하게 조화로운 행동으로 함께 살고 집단적으로 그들의 어린 새끼들을 돌본다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> collectively care for their young은 개별 부모의 책임을 넘어 집단 전체가 종의 번식을 위해 일사불란하게 움직이는 곤충 사회의 특징을 설명합니다. 곤충이 인간보다 더 사회적이라고 평가받는 구체적인 이유를 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">A wide variety of relatives live (관용표현): &#39;A wide variety of&#39;는 &#39;매우 다양한&#39;이라는 뜻의 형용사구로 뒤에 복수 명사(relatives)가 오며, 이에 맞춰 동사도 복수형인 live를 사용한다.<\/div><div class=\"lec-gr-item\">care for (관용표현): &#39;care for&#39;는 &#39;~을 돌보다&#39;라는 뜻의 구동사(phrasal verb)이며, 문맥상 그들의 새끼들(their young)을 보살핀다는 의미로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variety<\/td><td class=\"m\">다양성<\/td><\/tr><tr><td class=\"w\">relative<\/td><td class=\"m\">상대적인<\/td><\/tr><tr><td class=\"w\">perfectly<\/td><td class=\"m\">완벽하게<\/td><\/tr><tr><td class=\"w\">harmonious<\/td><td class=\"m\">조화로운<\/td><\/tr><tr><td class=\"w\">collectively<\/td><td class=\"m\">집단적으로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But <span class=\"grammar-hl\">while insect colonies<\/span><\/b><\/span><span class=\"ko\">하지만 곤충 군집들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">are impressively social places<\/span>,<\/b><\/span><span class=\"ko\">인상적으로 사회적인 장소인 반면,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it’s not<\/b><\/span><span class=\"ko\">그것은 아니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>our kind of social life.<\/b><\/span><span class=\"ko\">우리의 종류의 사회생활이.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러나 곤충 군집들이 인상적으로 사회적인 장소인 반면, 그것은 ‘우리의’ 사회생활의 종류가 아니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 언급한 곤충의 사회성을 인정하면서도, 글의 논점을 &#39;사회성의 정도&#39;에서 &#39;사회성의 성격&#39;으로 전환합니다. not our kind of social life는 인간과 곤충의 사회적 결합 원리가 본질적으로 다르다는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">while insect colonies are impressively social places 접속사: &#39;while&#39;은 &#39;반면에&#39;라는 뜻의 대조를 나타내는 부사절 접속사로, 곤충 군집의 사회적 특성과 인간의 사회적 삶이 서로 다름을 대조하기 위해 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">social<\/td><td class=\"m\">사회의, 사회적인<\/td><\/tr><tr><td class=\"w\">colony<\/td><td class=\"m\">군집, 식민지<\/td><\/tr><tr><td class=\"w\">impressive<\/td><td class=\"m\">인상적인, 훌륭한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Bees always build hexagonal hives,<\/b><\/span><span class=\"ko\">벌들은 항상 육각형 벌집을 짓고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>ants <span class=\"grammar-hl\">march<\/span><\/b><\/span><span class=\"ko\">개미들은 행진하며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">in lines<\/span>,<\/b><\/span><span class=\"ko\">줄을 지어,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and termites move<\/b><\/span><span class=\"ko\">그리고 흰개미들은 움직인다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in zigzag formations.<\/b><\/span><span class=\"ko\">지그재그 대형으로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">벌들은 항상 육각형의 벌집을 짓고, 개미들은 줄지어 행진하며, 흰개미들은 지그재그 대형으로 움직인다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 곤충들의 사회적 행동이 가진 정형성과 반복성을 구체적인 사례로 제시합니다. always build hexagonal hives와 같은 표현은 이들의 행동이 수천 년 동안 변함없이 고정되어 있다는 점을 부각합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">march in lines (관용표현): &#39;in lines&#39;는 &#39;줄을 지어&#39;라는 의미의 전치사구 관용표현으로, 동사 march와 결합하여 질서 있게 움직이는 모습을 묘사한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hive<\/td><td class=\"m\">벌집, 벌통<\/td><\/tr><tr><td class=\"w\">formation<\/td><td class=\"m\">형성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>These patterns recur predictably<\/b><\/span><span class=\"ko\">이러한 패턴들은 예측 가능하게 반복된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because they <span class=\"grammar-hl\">are tightly programmed genetically<\/span><\/b><\/span><span class=\"ko\">그것들이 유전적으로 긴밀하게 프로그램되어 있기 때문에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and propelled pheromonally<\/span>.<\/b><\/span><span class=\"ko\">그리고 페로몬에 의해 추진되기 때문에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이러한 패턴들은 그것들이 유전적으로 긴밀하게 프로그램 되어 있으며 페로몬에 의해 추진되기 때문에 예측할 수 있게 반복된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 곤충의 행동이 왜 변하지 않는지 그 생물학적 원인을 설명합니다. tightly programmed genetically는 이들의 사회적 행동이 개별적인 의지나 선택이 아닌, 타고난 유전자에 의해 강제되는 본능적 결과라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are tightly programmed genetically and propelled pheromonally (수동태): be동사(are) 뒤에 과거분사인 programmed와 propelled가 병렬로 연결된 구조이다. program과 propel은 모두 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조인 are programmed와 (are) propelled 형태로 쓴다. 기본구조: program + O, propel + O<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recur<\/td><td class=\"m\">되풀이하다, 재발하다<\/td><\/tr><tr><td class=\"w\">propel<\/td><td class=\"m\">나아가게 하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We humans<\/b><\/span><span class=\"ko\">우리 인간은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are more free,<\/b><\/span><span class=\"ko\">더 자유롭고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>less tightly programmed genetically,<\/b><\/span><span class=\"ko\">유전적으로 덜 긴밀하게 프로그램되어 있어서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so our social patterns<\/b><\/span><span class=\"ko\">그래서 우리의 사회적 패턴은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can be more diverse and dynamic.<\/b><\/span><span class=\"ko\">더 다양하고 역동적일 수 있다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리 인간은 더 자유롭고, 유전적으로 덜 긴밀하게 프로그램 되어 있어서 우리의 사회적 패턴들은 더 다양하고 역동적일 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 곤충과 대비되는 인간 사회성의 핵심적인 특징을 선언합니다. more diverse and dynamic은 인간 사회가 고정된 본능에 묶여 있지 않고, 시대와 장소에 따라 끊임없이 변화하고 발전할 수 있는 유연성을 갖추고 있음을 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are ... programmed (수동태): be동사(are)와 과거분사 programmed가 결합한 구조이다. program은 타동사(목적어를 취하는 동사)인데, 뒤에 직접적인 목적어가 없어서 수동구조 are programmed 형태로 쓴다. 기본구조: program + O<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">social<\/td><td class=\"m\">사회의, 사회적인<\/td><\/tr><tr><td class=\"w\">diverse<\/td><td class=\"m\">다양한<\/td><\/tr><tr><td class=\"w\">dynamic<\/td><td class=\"m\">역동적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Every group dances<\/span><\/b><\/span><span class=\"ko\">모든 집단은 춘다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a slightly different dance,<\/b><\/span><span class=\"ko\">약간 다른 춤을,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and these choreographies change<\/b><\/span><span class=\"ko\">그리고 이러한 안무들은 변한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>across generations.<\/b><\/span><span class=\"ko\">세대에 걸쳐.<\/span><\/div><\/div><div class=\"lec-sent-ko\">모든 집단은 약간 다른 춤을 추는데 이러한 안무들은 세대에 걸쳐 변한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> dances a slightly different dance는 각기 다른 인간 공동체가 저마다의 고유한 문화와 관습을 만들어낸다는 비유적 표현입니다. 인간의 사회적 행동은 곤충처럼 고정된 것이 아니라 세대 간 전승을 통해 진화하고 변형된다는 점을 짚어 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Every group dances (주어): 동사 일치: &#39;Every&#39;는 항상 단수 명사(group)를 수식하며 주어로 쓰일 때 단수 취급한다. 따라서 일반동사 dance에 -s를 붙여 단수형 동사 dances로 쓴다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">slightly<\/td><td class=\"m\">약간, 조금<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We still think and act<\/b><\/span><span class=\"ko\">우리는 여전히 생각하고 행동하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in ways<\/b><\/span><span class=\"ko\">방식들로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that are in harmony<\/span> with others around us,<\/b><\/span><span class=\"ko\">우리 주변의 다른 사람들과 조화를 이루는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but it is<\/b><\/span><span class=\"ko\">하지만 그것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>through patterns<\/b><\/span><span class=\"ko\">패턴들을 통해서이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that are more shaped<\/span> by nurture,<\/b><\/span><span class=\"ko\">양육에 의해 더 많이 형성되는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>not just nature.<\/b><\/span><span class=\"ko\">단지 본성만이 아니라.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리는 여전히 우리 주변의 다른 사람들과 조화를 이루는 방식으로 생각하고 행동하지만, 그것은 단지 본성만이 아니라 양육에 의해 더 많이 형성되는 패턴들을 통해서이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 최종 결론으로, 인간 역시 조화를 중시하는 사회적 존재이지만 그 동력은 본능이 아닌 환경에 있습니다. shaped by nurture는 인간의 사회성이 교육, 학습, 문화적 배경과 같은 후천적 요소에 의해 완성되는 유연한 체계임을 확고히 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that are in harmony (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사인 명사 ways를 수식한다. 절 내부에서 that이 주어 역할을 하며, 선행사가 복수이므로 동사로 are가 쓰였다.<\/div><div class=\"lec-gr-item\">that are more shaped (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사인 명사 patterns를 수식한다. 절 내부에서 that이 주어 역할을 하며 뒤에 동사 are가 이어진다.<\/div><div class=\"lec-gr-item\">are more shaped (수동태): be동사(are)+p.p.(shaped) 구조. shape은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are shaped 형태로 쓴다. 기본구조: shape + O<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>개미나 벌 같은 곤충은 조직력과 협동심 측면에서 인간보다 더 뛰어난 사회성을 보여주기도 한다.<\/li><li>하지만 곤충의 사회성은 유전자에 각인된 본능과 페로몬에 의해 움직이는 고정되고 예측 가능한 체계이다.<\/li><li>반면 인간은 유전적 제약에서 비교적 자유로워, 집단마다 고유하고 역동적인 사회적 패턴을 만들어낸다.<\/li><li>결과적으로 인간의 사회성은 타고난 본능(nature)보다 후천적인 학습과 문화적 양육(nurture)을 통해 형성된다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">While insect sociality is rigidly determined by genetic programming, human social patterns are dynamic and diverse because they are shaped by nurture.<\/div>\n              <div class=\"lec-final-sum-ko\">곤충의 사회성은 유전적 프로그램에 의해 엄격히 결정되는 반면, 인간의 사회적 패턴은 양육에 의해 형성되기 때문에 역동적이고 다양하다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/18.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/19.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/21.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_38번_강의_audio/22.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_38번 ed by nurture, not just nature)","주변 사람들과의 조화 (harmony)를 이루는 방식의 차이"]}],"bkg":"개미나 벌처럼 집단의 생존을 위해 일사불란하게 움직이는 생물들을 진사회성(Eusociality) 동물이라고 부르는데, 이들은 유전자에 각인된 본능과 페로몬(Pheromone)이라는 화학 신호를 통해 오차 없이 소통합니다. 반면 인간은 생물학적 결정론에서 벗어나 후천적 학습인 양육(Nurture)의 영향을 크게 받으며, 이를 통해 각기 다른 문화적 관습(Cultural Conventions)을 형성해 나갑니다. 심리학과 사회학에서는 이를 천성 대 양육(Nature vs. Nurture) 논쟁으로 다루기도 하는데, 인간은 환경에 따라 행동을 바꾸는 가소성(Plasticity)이 매우 높다는 점이 특징입니다. 예를 들어 꿀벌이 수만 년째 똑같은 육각형 집을 짓는 동안 인간은 텐트에서 초고층 빌딩까지 주거 양식을 유연하게 바꾼 것처럼, 우리의 사회적 행동은 고정된 유전적 프로그래밍(Genetic Programming)보다는 세대 간 전수되는 창의적인 학습의 결과물이라고 할 수 있습니다.","ttsText":"개미나 벌처럼 집단의 생존을 위해 일사불란하게 움직이는 생물들을 진사회성(Eusociality) 동물이라고 부르는데, 이들은 유전자에 각인된 본능과 페로몬(Pheromone)이라는 화학 신호를 통해 오차 없이 소통합니다. 반면 인간은 생물학적 결정론에서 벗어나 후천적 학습인 양육(Nurture)의 영향을 크게 받으며, 이를 통해 각기 다른 문화적 관습(Cultural Conventions)을 형성해 나갑니다. 심리학과 사회학에서는 이를 천성 대 양육(Nature vs. Nurture) 논쟁으로 다루기도 하는데, 인간은 환경에 따라 행동을 바꾸는 가소성(Plasticity)이 매우 높다는 점이 특징입니다. 예를 들어 꿀벌이 수만 년째 똑같은 육각형 집을 짓는 동안 인간은 텐트에서 초고층 빌딩까지 주거 양식을 유연하게 바꾼 것처럼, 우리의 사회적 행동은 고정된 유전적 프로그래밍(Genetic Programming)보다는 세대 간 전수되는 창의적인 학습의 결과물이라고 할 수 있습니다.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 38번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 38번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고1 / 2025년 / 10월 / 38번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고1 / 2025년 / 10월 / 38번","titleEn":"Nature vs. Nurture: Why Human Social Patterns Are Dynamic","titleKo":"본성 대 양육: 인간의 사회적 패턴이 역동적인 이유","imageUrl":"__enpImg__","stages":[{"label":"01곤충의 고도화된 사회성","items":["사회성의 여러 지표에서 개미나 벌과 같은 곤충이 인간보다 앞서기도 한다.","친척들이 모여 완벽하게 조화로운 행동을 보임","새끼를 공동으로 돌봄 (collectively care)","핵심 키워드: 사회성 (sociality)"]},{"label":"02곤충의 고정된 사회적 패턴","items":["곤충의 사회적 행동은 유전과 본능에 의해 엄격하게 통제된다.","유전적으로 단단히 프로그램됨 (tightly programmed genetically)","페로몬에 의해 추진되며 예측 가능함 (propelled pheromonally)","육각형 벌집이나 줄지어 이동하는 고정된 패턴 (patterns)"]},{"label":"03인간 사회성의 유연성과 다양성","items":["인간은 유전적 프로그램에서 더 자유롭기에 사회적 양상이 훨씬 다양하다.","곤충보다 덜 고정된 유전적 프로그램 (less tightly
