Oh7jtjPft39KdketGj8wCim5AHUd+/ocH16dD6e1G5cZ3DHTqMdfU49/r70ALn/Pf+Y/yDS//AFv85PWmkhR1H/1x6n8hk9O5pQQccjnpz1Hb9Ov40AAPBwOhxyT+eT7c9+KWkyp7g9e46jr+Xf0poKnPIxnvjrnk9eef5euSS/8Al/X3A3bcf/n/AD/n+uUGe5z+GKNw9R37jt1/Lv6UgdTzkDnHJA/r+H1pL710/wCH6gOpD9M+n16d6Nw9R3H5cH8u/pSFl6ZHPuP8n39qfl8wuu/l8+wvt/nPXt+Z9qX/AOt/n/P40nHHPTsPYdPwpNwJxn07jv2H19vzzR/X3AO//V/j9On50nfHrk/y759T78elJkDPIHfIx1PfHP8AXtS5HHP056/4/wCfagOtvX8Lf5h0/wA9M/49vy9BS00so6kdu49f8/0pSwHcfnR/X+X9eYC0U3eMgZHPPUcD35o3Adx1xwR7+/8A9fPbPFAf8P8Al/mh1Jnr7cfy/wAaM9OevTpz/n2/wwZHqP8APP8AL/GgA64//X+X+P6c8HY/j1/z0/pRkEAg9en/ANb/AOtS56+348f5/WgA+lFJkeo7/p/h3pf8/wCf8+1C79wCj/P+f5UUDB5H+e1Afl/w1v1uFIefwwf8/wCfzGRQSO5HtmgkAE+gJwPQfpQH5f8ADf8ABP/Z\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">The Paradox of AI: A Tool That Can Stifle True Creativity<small>AI의 역설: 진정한 창의성을 저해할 수 있는 도구<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">창의성을 이해하는 핵심 키워드인 확산적 사고(Divergent Thinking)는 하나의 정답을 찾기보다 하나의 문제에서 수만 가지의 독창적인 해결책을 뻗어 나가는 능력을 의미합니다. 최근의 인공지능(Artificial Intelligence)은 기존의 방대한 데이터를 학습하여 유사한 결과물을 만드는 패턴 인식(Pattern Recognition)에는 능숙하지만, 과거의 데이터에 갇혀 새로운 틀을 깨지 못하는 데이터 편향성(Data Bias)이라는 한계를 지니고 있습니다. 마치 수많은 실패를 겪으며 자신만의 독창적인 레시피를 개발하는 요리사처럼, 인간의 창작은 시행착오(Trial and Error)라는 고통스러운 과정을 통해 비로소 고유한 예술성과 깊이를 획득하게 됩니다. 따라서 인공지능의 알고리즘(Algorithm)이 제공하는 빠르고 효율적인 정답에만 의존할 경우, 인간만이 가진 고유한 통찰력(Insight)과 혁신의 동력을 잃어버릴 수 있다는 점을 미리 인지하고 글을 읽으시면 큰 도움이 될 것입니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01창의성의 본질<\/div><ul><li>창의성은 새로운 가치를 만드는 능력으로 확산적 사고와 실험 정신을 수반한다.<\/li><li>확산적 사고(divergent thinking)와 상상력 활용<\/li><li>실험에 대한 의지와 위험 감수(taking risks)가 필요함<\/li><li>핵심 키워드: 창의성(Creativity)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02AI의 학습 방식과 한계<\/div><ul><li>AI는 기존 데이터를 학습하여 패턴을 찾아내는 방식으로 작동한다.<\/li><li>기존 데이터셋(existing datasets)의 패턴과 추세 학습<\/li><li>비슷한 스타일의 콘텐츠 생성에는 유용하나 독창성이 부족함<\/li><li>핵심 키워드: 알고리즘(algorithms)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03모방의 굴레와 독창성 결여<\/div><ul><li>AI에 과도하게 의존하면 기존 작품을 답습하는 모방의 순환에 갇히게 된다.<\/li><li>진정한 독창성이 없는 파생물(derivative works) 생성<\/li><li>학습 데이터의 제약(constraints) 내에 갇힐 위험<\/li><li>핵심 키워드: 모방의 순환(cycle of imitation)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04창의적 고통의 생략<\/div><ul><li>AI가 제공하는 즉각적인 결과물은 창작의 핵심인 시행착오 과정을 건너뛰게 한다.<\/li><li>창의적 과정의 본질인 복잡함과 수많은 실패(failures)<\/li><li>고군분투와 실험(struggle and experimentation)의 가치 감소<\/li><li>핵심 키워드: 즉각적인 해결책(instant solutions)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05진정한 재능 발달의 저해<\/div><ul><li>시행착오를 통한 학습 과정이 사라지면 결국 창의적 재능의 발전을 가로막는다.<\/li><li>시행착오(trial and error)를 통한 기술 연마 및 관점 개발<\/li><li>AI로 인한 한계 돌파 능력과 진정한 재능의 저해<\/li><li>핵심 키워드: 창의적 재능(creative talent)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">creativity<\/td><td class=\"m\">창의력<\/td><\/tr><tr><td class=\"w\">generate<\/td><td class=\"m\">만들어 내다, 발생시키다<\/td><\/tr><tr><td class=\"w\">novel<\/td><td class=\"m\">소설<\/td><\/tr><tr><td class=\"w\">involve<\/td><td class=\"m\">포함하다, 수반하다<\/td><\/tr><tr><td class=\"w\">divergent<\/td><td class=\"m\">확산적인, 갈라지는<\/td><\/tr><tr><td class=\"w\">willingness<\/td><td class=\"m\">기꺼이 하려는 마음<\/td><\/tr><tr><td class=\"w\">experiment<\/td><td class=\"m\">실험하다<\/td><\/tr><tr><td class=\"w\">risk<\/td><td class=\"m\">위험<\/td><\/tr><tr><td class=\"w\">limit<\/td><td class=\"m\">한계, 제한<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">originality<\/td><td class=\"m\">독창성<\/td><\/tr><tr><td class=\"w\">innovation<\/td><td class=\"m\">혁신<\/td><\/tr><tr><td class=\"w\">existing<\/td><td class=\"m\">기존의, 현재 있는<\/td><\/tr><tr><td class=\"w\">identify<\/td><td class=\"m\">확인하다, 알아보다<\/td><\/tr><tr><td class=\"w\">trend<\/td><td class=\"m\">추세, 경향<\/td><\/tr><tr><td class=\"w\">creation<\/td><td class=\"m\">창조, 창출<\/td><\/tr><tr><td class=\"w\">content<\/td><td class=\"m\">내용, 내용물<\/td><\/tr><tr><td class=\"w\">similar<\/td><td class=\"m\">비슷한, 유사한<\/td><\/tr><tr><td class=\"w\">format<\/td><td class=\"m\">형식, 구성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Creativity<\/b><\/span><span class=\"ko\">창의성이란<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is the ability<\/b><\/span><span class=\"ko\">능력이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to generate<\/span> novel and valuable ideas.<\/b><\/span><span class=\"ko\">새롭고 가치 있는 아이디어를 만들어 내는<\/span><\/div><\/div><div class=\"lec-sent-ko\">창의성이란 새롭고 가치 있는 아이디어를 만들어 내는 능력이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로 창의성의 정의를 명확히 하며 논의를 시작합니다. novel and valuable ideas는 세상에 없던 독특함뿐만 아니라, 실제로 누군가에게 도움이 되거나 의미가 있는 결과물을 만들어내는 힘을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to generate (to부정사(형용사적)): ability를 수식한다. ability, way, time, chance 등 명사의 내용을 한정하는 경우에 해당하며, &#39;it to generate&#39;가 성립하지 않으므로 형용사적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">creativity<\/td><td class=\"m\">창의력<\/td><\/tr><tr><td class=\"w\">generate<\/td><td class=\"m\">만들어 내다, 발생시키다<\/td><\/tr><tr><td class=\"w\">novel<\/td><td class=\"m\">소설<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>It<\/b><\/span><span class=\"ko\">그것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>involves<\/b><\/span><span class=\"ko\">포함한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>divergent <span class=\"grammar-hl\">thinking<\/span>, imagination, and a willingness<\/b><\/span><span class=\"ko\">확산적 사고, 상상력, 그리고 의지를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to experiment and take risks<\/span>.<\/b><\/span><span class=\"ko\">실험을 하고 위험을 감수하려는<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것은 확산적 사고, 상상력, 그리고 실험을 하고 위험을 감수하려는 의지를 포함한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 정의한 창의성이 구체적으로 어떤 요소들로 이루어지는지 보충 설명합니다. experiment and take risks는 실패할 확률이 높더라도 새로운 시도를 멈추지 않는 도전 정신이 창의성의 바탕이 된다는 점을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">thinking (동명사(명사적)): &#39;발산적 사고&#39;라는 추상적 개념이나 활동을 나타내는 명사적 기능으로 쓰였다.<\/div><div class=\"lec-gr-item\">to experiment and take risks (to부정사(형용사적)): willingness를 수식한다. &#39;~하려는 의지&#39;라는 의미로 명사의 구체적인 내용을 설명하며, &#39;it to experiment&#39;가 성립하지 않으므로 형용사적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">involve<\/td><td class=\"m\">포함하다, 수반하다<\/td><\/tr><tr><td class=\"w\">divergent<\/td><td class=\"m\">확산적인, 갈라지는<\/td><\/tr><tr><td class=\"w\">willingness<\/td><td class=\"m\">기꺼이 하려는 마음<\/td><\/tr><tr><td class=\"w\">experiment<\/td><td class=\"m\">실험하다<\/td><\/tr><tr><td class=\"w\">risk<\/td><td class=\"m\">위험<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>While AI can be a powerful tool<\/b><\/span><span class=\"ko\">AI가 강력한 도구가 될 수 있지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for creative efforts,<\/b><\/span><span class=\"ko\">창의적인 노력을 위한,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it also carries the risk<\/b><\/span><span class=\"ko\">그것은 또한 위험을 수반한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of <span class=\"grammar-hl\">limiting<\/span> originality and innovation.<\/b><\/span><span class=\"ko\">독창성과 혁신을 제한할<\/span><\/div><\/div><div class=\"lec-sent-ko\">AI는 창의적인 노력을 위한 강력한 도구가 될 수 있지만, 또한 독창성과 혁신을 제한할 위험을 수반한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 창의성의 일반론에서 이 글의 핵심 주제인 &#39;AI와 창의성&#39;의 관계로 논의가 전환됩니다. AI의 유용함을 인정하면서도, 오히려 인간의 originality and innovation을 가로막는 부작용이 생길 수 있음을 경고하는 문장입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">limiting (동명사): 전치사 of의 목적어 역할을 하는 명사적 성격의 어구로 &#39;제한하는 것&#39;이라는 행위를 의미한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">risk<\/td><td class=\"m\">위험<\/td><\/tr><tr><td class=\"w\">limit<\/td><td class=\"m\">한계, 제한<\/td><\/tr><tr><td class=\"w\">originality<\/td><td class=\"m\">독창성<\/td><\/tr><tr><td class=\"w\">innovation<\/td><td class=\"m\">혁신<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>AI algorithms <span class=\"grammar-hl\">are trained<\/span><\/b><\/span><span class=\"ko\">AI 알고리즘은 훈련된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on <span class=\"grammar-hl\">existing<\/span> datasets,<\/b><\/span><span class=\"ko\">기존의 데이터 세트를 바탕으로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>often <span class=\"grammar-hl\">identifying<\/span> patterns and trends<\/b><\/span><span class=\"ko\">종종 패턴과 경향을 식별하며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in past creations.<\/b><\/span><span class=\"ko\">과거의 창작물에서<\/span><\/div><\/div><div class=\"lec-sent-ko\">AI 알고리즘은 종종 과거의 창작물에서 패턴과 경향을 식별하며 기존의 데이터 세트를 바탕으로 훈련된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> AI가 독창성을 제한할 수 있는 기술적 이유를 설명합니다. identifying patterns and trends는 AI가 무에서 유를 창조하는 것이 아니라, 이미 존재하는 방대한 과거 기록들 속에서 공통점을 찾아내 모방하는 방식으로 작동한다는 점을 짚어줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are trained (수동태): be동사(are)+p.p.(trained) 구조. train은 타동사인데 뒤에 목적어가 없어서 수동구조 are trained 형태로 쓴다. 기본구조: V + O (O를 훈련시키다).<\/div><div class=\"lec-gr-item\">existing (현재분사(형용사)): existing이 datasets를 수식하며 &#39;기존의/현존하는&#39;이라는 상태를 나타낸다. datasets that exist의 의미를 갖는 축약 관계절로 볼 수 있다.<\/div><div class=\"lec-gr-item\">identifying (분사구문): as they often identify ... 로 절로 변환할 수 있으며, 주절의 상황과 동시에 일어나는 부수적인 동작이나 결과를 나타내는 현재분사 구문이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">existing<\/td><td class=\"m\">기존의, 현재 있는<\/td><\/tr><tr><td class=\"w\">identify<\/td><td class=\"m\">확인하다, 알아보다<\/td><\/tr><tr><td class=\"w\">trend<\/td><td class=\"m\">추세, 경향<\/td><\/tr><tr><td class=\"w\">creation<\/td><td class=\"m\">창조, 창출<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>While this can be useful<\/b><\/span><span class=\"ko\">이것이 유용할 수 있지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for <span class=\"grammar-hl\">generating<\/span> new content<\/b><\/span><span class=\"ko\">새로운 콘텐츠를 만들어 내는 데<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in similar styles or formats,<\/b><\/span><span class=\"ko\">유사한 스타일이나 형식으로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it can also lead to derivative works<\/b><\/span><span class=\"ko\">그것은 또한 모방적인 작품들로 이어질 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> lack genuine originality.<\/b><\/span><span class=\"ko\">진정한 독창성이 부족한<\/span><\/div><\/div><div class=\"lec-sent-ko\">이것은 유사한 스타일이나 형식으로 새로운 콘텐츠를 만들어 내는 데 유용할 수 있지만, 그것은 또한 진정한 독창성이 부족한 모방적인 작품들로 이어질 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 기술적 특징이 가져오는 구체적인 결과를 제시합니다. derivative works는 독자적인 가치가 있기보다 기존의 것을 살짝 변형한 수준에 불과한 결과물이 양산될 수 있다는 우려를 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">generating (동명사): 전치사 for의 목적어로 쓰여 &#39;생성하는 것&#39;이라는 행위적 개념을 나타낸다.<\/div><div class=\"lec-gr-item\">that (관계대명사(주격)): 선행사 derivative works를 수식하며, 뒤에 동사 lack이 이어지는 주격 관계대명사다. 절 내부에서 주어 역할을 수행하며 주어가 빠진 불완전한 절을 이끈다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">generate<\/td><td class=\"m\">만들어 내다, 발생시키다<\/td><\/tr><tr><td class=\"w\">originality<\/td><td class=\"m\">독창성<\/td><\/tr><tr><td class=\"w\">content<\/td><td class=\"m\">내용, 내용물<\/td><\/tr><tr><td class=\"w\">similar<\/td><td class=\"m\">비슷한, 유사한<\/td><\/tr><tr><td class=\"w\">format<\/td><td class=\"m\">형식, 구성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If artists and designers rely too heavily<\/b><\/span><span class=\"ko\">만약 예술가와 디자이너가 너무 과하게 의존한다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on AI<\/b><\/span><span class=\"ko\">AI에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for inspiration and content generation,<\/b><\/span><span class=\"ko\">영감과 콘텐츠 생성을 위해,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they may <span class=\"grammar-hl\">find themselves trapped<\/span><\/b><\/span><span class=\"ko\">그들은 자신이 갇힌 것을 발견할지 모른다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in a cycle of imitation,<\/b><\/span><span class=\"ko\">모방의 순환에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>unable <span class=\"grammar-hl\">to break<\/span> free<\/b><\/span><span class=\"ko\">벗어날 수 없는 상태에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from the constraints of the AI’s <span class=\"grammar-hl\">training<\/span> data.<\/b><\/span><span class=\"ko\">AI의 훈련 데이터라는 제한으로부터<\/span><\/div><\/div><div class=\"lec-sent-ko\">예술가와 디자이너가 영감과 콘텐츠 생성을 위해 AI에 지나치게 의존한다면, 그들은 AI의 훈련 데이터라는 제한으로부터 벗어날 수 없는 상태에서 모방의 순환에 갇힌 자신을 발견할지 모른다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 창작자가 AI를 과도하게 사용할 때 겪게 될 심각한 부작용을 경고합니다. trapped in a cycle of imitation은 창작자가 스스로 생각하기보다 AI가 제시하는 과거의 데이터 범위 안에서만 맴돌게 되어 결국 새로운 시도를 포기하게 되는 상황을 묘사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">find themselves trapped 5형식(SVOC) 구조: 동사 find + 목적어 themselves + 목적격보어 trapped(과거분사)의 구조로, 목적어의 상태가 수동(갇히게 된 것)임을 나타낸다.<\/div><div class=\"lec-gr-item\">trapped (과거분사(형용사적)): trapped가 목적어인 themselves를 수식하는 보어 역할을 하며 &#39;갇히게 된&#39;이라는 수동의 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">to break (to부정사(부사적): 형용사 수식): 형용사 unable 뒤에서 그 내용을 한정하므로 부사적 용법이다. to V 바로 앞이 형용사일 때의 구조에 해당한다.<\/div><div class=\"lec-gr-item\">training (동명사(명사적)): training(훈련/학습) + data(데이터) = &#39;학습용 데이터&#39;라는 용도와 개념을 나타내므로 명사 수식 현재분사가 아닌 동명사로 분류한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">content<\/td><td class=\"m\">내용, 내용물<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Moreover,<\/b><\/span><span class=\"ko\">더욱이,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the ease<\/b><\/span><span class=\"ko\">편의성은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">with which<\/span> AI can generate content<\/b><\/span><span class=\"ko\">AI가 콘텐츠를 생성할 수 있는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can discourage the kind of struggle and experimentation<\/b><\/span><span class=\"ko\">그런 종류의 노력과 실험을 방해할 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> often leads to breakthroughs.<\/b><\/span><span class=\"ko\">종종 획기적인 발전으로 이어지는<\/span><\/div><\/div><div class=\"lec-sent-ko\">더욱이, AI로 콘텐츠를 생성할 수 있는 편의성은 종종 획기적인 발전으로 이어지는 그런 종류의 노력과 실험을 방해할 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> AI가 주는 &#39;편리함&#39;이 창의적 성장에 독이 될 수 있음을 추가로 언급합니다. discourage the kind of struggle은 인간이 깊이 고민하고 괴로워하며 답을 찾아가는 과정을 생략하게 만들어, 결국 위대한 발견의 기회 자체를 없애버린다는 뜻입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">with which (전치사+관계대명사): 전치사(with) + 관계대명사(which) + S(AI) + V(can generate) 구조다. 관계대명사 뒤에는 주어와 동사가 모두 갖춰진 완전한 절이 온다.<\/div><div class=\"lec-gr-item\">that (관계대명사(주격)): 선행사 struggle and experimentation을 수식하며, 뒤에 동사 leads가 이어지는 주격 관계대명사다. 관계사절 내에서 주어 역할을 하며 선행사를 구체화한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">generate<\/td><td class=\"m\">만들어 내다, 발생시키다<\/td><\/tr><tr><td class=\"w\">experiment<\/td><td class=\"m\">실험하다<\/td><\/tr><tr><td class=\"w\">content<\/td><td class=\"m\">내용, 내용물<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The creative process<\/b><\/span><span class=\"ko\">창의적인 과정은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is often messy and repetitive,<\/b><\/span><span class=\"ko\">종종 골치 아프고 반복적이며,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">involving<\/span> numerous failures and setbacks.<\/b><\/span><span class=\"ko\">수많은 실패와 좌절을 수반한다<\/span><\/div><\/div><div class=\"lec-sent-ko\">창의적인 과정은 종종 골치 아프고 반복적이며 수많은 실패와 좌절을 수반한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 7번 문장에서 언급한 &#39;고군분투&#39;가 왜 중요한지 뒷받침하기 위해 창작의 본질을 설명합니다. messy and repetitive는 창의적인 결과물이 한 번에 깔끔하게 나오는 것이 아니라, 수많은 시행착오를 겪으며 다듬어지는 혼란스러운 과정임을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">involving (분사구문): as it involves ... 로 절로 변환할 수 있으며, 주절의 주어인 The creative process가 갖는 속성이나 수반되는 상황을 설명하는 현재분사 구문이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">involve<\/td><td class=\"m\">포함하다, 수반하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">It is through these challenges<\/span><\/b><\/span><span class=\"ko\">바로 이러한 어려움들을 통해서이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> we refine our skills,<\/b><\/span><span class=\"ko\">우리가 자신의 기술을 연마하고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>develop our unique perspectives,<\/b><\/span><span class=\"ko\">고유한 관점을 발전시키며,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and push the boundaries of <span class=\"grammar-hl\">what<\/span> is possible.<\/b><\/span><span class=\"ko\">가능한 것의 경계를 넓혀가는 것은<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리가 자신의 기술을 연마하고, 고유한 관점을 발전시키며, 가능한 것의 경계를 넓혀가는 것은 바로 이러한 어려움들을 통해서이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 실패와 좌절이 창작자에게 주는 긍정적인 효과를 나열합니다. push the boundaries of what is possible은 인간이 한계에 부딪히고 이를 극복하려고 노력할 때 비로소 기존의 틀을 깨는 진정한 혁신이 일어난다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It is through these challenges that (강조구문): &#39;It is ~ that&#39; 사이에 강조하고자 하는 부사구(through these challenges)를 배치하여 &#39;바로 이러한 도전들을 통해서&#39;라는 의미를 강조하는 구조다.<\/div><div class=\"lec-gr-item\">what (관계대명사): 선행사를 포함하는 관계대명사 what으로 &#39;~하는 것&#39;으로 해석되며, 관계사절 내에서 주어 역할을 수행한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If AI provides instant solutions,<\/b><\/span><span class=\"ko\">만약 AI가 즉각적인 해결책을 제공한다면,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it can skip this essential process of <span class=\"grammar-hl\">learning<\/span><\/b><\/span><span class=\"ko\">그것은 이 본질적인 학습 과정을 건너뛸 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>through trial and error,<\/b><\/span><span class=\"ko\">시행착오를 통한,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>ultimately <span class=\"grammar-hl\">inhibiting<\/span> the development<\/b><\/span><span class=\"ko\">궁극적으로 발달을 방해하면서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of true creative talent.<\/b><\/span><span class=\"ko\">진정한 창의적 재능의<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 AI가 즉각적인 해결책을 제공한다면, 그것은 시행착오를 통한 이 본질적인 학습 과정을 건너뛸 수도 있으며, 궁극적으로는 진정한 창의적 재능의 발달을 방해한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글 전체를 마무리하는 결론으로, AI의 즉각성이 인간의 성장 동력을 앗아간다고 경고합니다. skip this essential process는 시행착오를 통해 실력을 쌓아야 할 창작자가 결과물만 쉽게 얻으려다 결국 스스로 성장할 기회를 잃게 된다는 점을 지적합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">learning (동명사): 전치사 of의 목적어 역할을 하는 명사적 성격의 어구로 &#39;학습하는 것&#39;이라는 행위를 의미한다.<\/div><div class=\"lec-gr-item\">inhibiting (분사구문): as it ultimately inhibits ... 로 절로 변환할 수 있으며, 앞 절의 내용에 대한 최종적인 결과를 나타내는 현재분사 구문이다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>창의성은 단순히 새로운 것이 아니라 가치 있는 아이디어를 만들어내는 도전적인 능력이다.<\/li><li>AI는 과거 데이터를 학습하여 패턴을 찾아내므로 기존 양식을 복제하는 데 최적화되어 있다.<\/li><li>창작자가 AI에 의존하면 과거의 틀에 갇혀 진정한 독창성을 잃고 모방만 반복할 위험이 있다.<\/li><li>진정한 혁신은 수많은 실패와 고통스러운 시행착오 과정을 거치며 재능이 단련될 때 나타난다.<\/li><li>AI가 제공하는 즉각적인 편리함은 이러한 필수적인 성장 과정을 생략하게 만들어 창의적 인재 양성을 방해한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">AI offers convenience in content generation, but it limits original innovation by replacing the critical struggle and learning inherent in the creative process.<\/div>\n              <div class=\"lec-final-sum-ko\">AI는 콘텐츠 생성에 편의를 제공하지만, 창의적 과정에 내재된 비판적 고뇌와 학습을 대체함으로써 독창적인 혁신을 제한한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_41-42번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_41-42번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_41-42번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_41-42번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_41-42번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_41-42번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_41-42번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2025년_10월_41-42번_강의_audio/8.mp3","hl":"stage-4"}],[{"audio":"./모의고사_고1_2025년_10월_41-42번_강의_audio/9.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_41-42번_강의_audio/10.mp3" 번_강의_audio/39.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_41-42번_강의_audio/40.mp3","hl":null}]],"fileName":"모의고사_고1_2025년_10월_41-42번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 10월 / 41-42번","titleEn":"The Paradox of AI: A Tool That Can Stifle True Creativity","titleKo":"AI의 역설: 진정한 창의성을 저해할 수 있는 도구","imageUrl":"__enpImg__","stages":[{"label":"01창의성의 본질","items":["창의성은 새로운 가치를 만드는 능력으로 확산적 사고와 실험 정신을 수반한다.","확산적 사고(divergent thinking)와 상상력 활용","실험에 대한 의지와 위험 감수(taking risks)가 필요함","핵심 키워드: 창의성(Creativity)"]},{"label":"02AI의 학습 방식과 한계","items":["AI는 기존 데이터를 학습하여 패턴을 찾아내는 방식으로 작동한다.","기존 데이터셋(existing datasets)의 패턴과 추세 학습","비슷한 스타일의 콘텐츠 생성에는 유용하나 독창성이 부족함","핵심 키워드: 알고리즘(algorithms)"]},{"label":"03모방의 굴레와 독창성 결여","items":["AI에 과도하게 의존하면 기존 작품을 답습하는 모방의 순환에 갇히게 된다.","진정한 독창성이 없는 파생물(derivative works) 생성","학습 데이터의 제약(constraints) 내에 갇힐 위험","핵심 키워드: 모방의 순환(cycle of imitation)"]},{"label":"04창의적 고통의 생략","items":["AI가 제공하는 즉각적인 결과물은 창작의 핵심인 시행착오 과정을 건너뛰게 한다.","창의적 과정의 본질인 복잡함과 수많은 실패(failures)","고군분투와 실험(struggle and experimentation)의 가치 감소","핵심 키워드: 즉각적인 해결책(instant solutions)"]},{"label":"05진정한 재능 발달의 저해","items":["시행착오를 통한 학습 과정이 사라지면 결국 창의적 재능의 발전을 가로막는다.","시행착오(trial and error)를 통한 기술 연마 및 관점 개발","AI로 인한 한계 돌파 능력과 진정한 재능의 저해","핵심 키워드: 창의적 재능(creative talent)"]}],"bkg":"창의성을 이해하는 핵심 키워드인 확산적 사고(Divergent Thinking)는 하나의 정답을 찾기보다 하나의 문제에서 수만 가지의 독창적인 해결책을 뻗어 나가는 능력을 의미합니다. 최근의 인공지능(Artificial Intelligence)은 기존의 방대한 데이터를 학습하여 유사한 결과물을 만드는 패턴 인식(Pattern Recognition)에는 능숙하지만, 과거의 데이터에 갇혀 새로운 틀을 깨지 못하는 데이터 편향성(Data Bias)이라는 한계를 지니고 있습니다. 마치 수많은 실패를 겪으며 자신만의 독창적인 레시피를 개발하는 요리사처럼, 인간의 창작은 시행착오(Trial and Error)라는 고통스러운 과정을 통해 비로소 고유한 예술성과 깊이를 획득하게 됩니다. 따라서 인공지능의 알고리즘(Algorithm)이 제공하는 빠르고 효율적인 정답에만 의존할 경우, 인간만이 가진 고유한 통찰력(Insight)과 혁신의 동력을 잃어버릴 수 있다는 점을 미리 인지하고 글을 읽으시면 큰 도움이 될 것입니다.","ttsText":"창의성을 이해하는 핵심 키워드인 확산적 사고(Divergent Thinking)는 하나의 정답을 찾기보다 하나의 문제에서 수만
