UpTu3qtdPT3bffp1VnZ21Vi/l27dF6df+HuOG44OenB47njpx2I78c0pjGc4xwM9e2Mfp0PPb60Kjgk7Hxz/C3BHqB6f59ngPxlG54yAf546+uPw740UpWTXMkna6vvdbbLTSy879UQopN28tO3b+ttEvsoYoIJycnHXPOPp1+vOOlDMB6ZHT2z379uv8sEUpVsAmN8P6K3JGOPTHUfXHQ01kck/K3TIO09MehH/wBYc5HU0mpdVLrq015a/PbXuUrX3+W92uj/ACGlm6deDn68cE9fx/PIphGRj+f/AOv0465zyOaeUcAEo4BwBlW7njtwM9zx196Qhv7rkjtsb/D6cY6HPGOZak7pJ7q+m6Ti9PTT7vMNrW6f0v8AhugmAcE84zj2P+Tnnr0pCvQnscjBweRnJAPPXv6gdqUA/wB1vX7rd+fTv+tOwy4yjdCOVJBP5Ecccf41SlLXre2tvS1vLb1u+4W/r+v627ITnH6c+pGB1+n6D0FJTtrNxsbJGOVbk8+o547Dv+VL5bkE7W/BT/kD/Iz2TTctU769PTT12AaBk7Rgk/TH45A9D1HQY7cylDgALzu7j64J5YfqR/KljRv7r5PcK5GOwPG05P1xx1JxU6Ryu0SrE5LMqrhGIOSB2Bz90+uSQAACDQlZxtprololta2z0V321WumhZ9n8193Tqf/2Q==\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">The Capabilities Approach: Valuing Each Animal’s Unique Form of Life<small>역량 접근법: 각 동물의 고유한 삶의 형태를 가치 있게 여기기<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">이 지문에서 다루는 역량 접근법(Capabilities Approach)은 원래 경제학자 아마르티아 센과 철학자 마사 너스바움(Martha Nussbaum)이 발전시킨 이론으로, 단순히 생존이나 권리를 넘어 각 개인이 실제로 무엇을 할 수 있고 어떤 상태가 될 수 있는지에 초점을 맞춥니다. 너스바움은 이 이론을 동물 윤리로 확장하여, 인간과 얼마나 닮았느냐가 아니라 각 지각 있는 존재(Sentient creatures)가 타고난 본성대로 번영(Flourishing)할 수 있는 기회를 보장받아야 한다고 주장해요. 예를 들어, 하늘을 날아야 하는 새에게는 날 수 있는 환경이, 헤엄쳐야 하는 고래에게는 바다가 고유한 삶의 권리로서 보장되는 것이 그 동물의 존엄성을 지켜주는 핵심이라고 보는 것이죠. 이는 동물을 &#39;인간보다 열등한 존재&#39;로 보거나 인간의 잣대로 등급을 매기던 과거의 시각에서 벗어나, 각 생명체가 가진 생물학적 특성을 그 자체로 존중하려는 현대 법철학의 중요한 흐름을 담고 있습니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01역량 접근법의 부정적 정의<\/div><ul><li>역량 접근법은 동물을 인간과의 유사성에 따라 차별하거나 서열화하지 않는다.<\/li><li>인간과의 유사성(likeness to humans)을 기준으로 동물을 평가하는 방식을 거부함<\/li><li>특정 동물에게만 주어지는 특별한 특권(special privileges)을 추구하지 않음<\/li><li>핵심 키워드: 역량 접근법(Capabilities Approach)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02모든 생명체에 대한 평등한 관심<\/div><ul><li>이 접근법은 동물의 크기나 종에 상관없이 모든 생명체의 가치를 존중한다.<\/li><li>핀치새와 돼지를 고래나 코끼리만큼 중요하게 고려함<\/li><li>모든 지각 있는 존재에 대한 보편적인 관심(concern)을 강조함<\/li><li>핵심 키워드: 동등한 관심(equal concern)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03인간 중심적 관점의 탈피<\/div><ul><li>동물이 무엇을 필요로 하는지 판단할 때 인간의 기준을 적용하는 것은 부적절하다.<\/li><li>인간의 삶의 형태(human form of life)는 동물의 권리 논의에서 무관함<\/li><li>각 동물의 고유한 삶의 형태(their own forms of life)가 판단의 핵심 기준임<\/li><li>핵심 키워드: 무관함(irrelevant)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04종별 고유성의 존중과 이해<\/div><ul><li>동물을 인간보다 못한 존재로 여기지 말고 각 종의 고유한 특성을 학습해야 한다.<\/li><li>동물을 &#39;열등한 인간(lesser humans)&#39;으로 보는 게으른 시각을 버려야 함<\/li><li>인간이 인간다운 삶을 원하듯, 각 동물도 그들만의 삶을 추구함<\/li><li>핵심 키워드: 확장과 학습(extend and learn)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05이론의 최종 목적<\/div><ul><li>모든 지각 있는 존재가 자신의 종적 특성에 맞게 살아갈 기회를 보장받아야 한다.<\/li><li>각 지각 있는 존재(sentient creature)가 자신의 고유한 형태대로 살아감<\/li><li>동물이 자신의 잠재력을 발휘하며 번성(flourish)할 기회를 제공함<\/li><li>핵심 키워드: 번성할 기회(opportunity to flourish)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">passionate<\/td><td class=\"m\">열정적인<\/td><\/tr><tr><td class=\"w\">rank<\/td><td class=\"m\">순위를 차지하다<\/td><\/tr><tr><td class=\"w\">seek<\/td><td class=\"m\">찾다, 구하다<\/td><\/tr><tr><td class=\"w\">privilege<\/td><td class=\"m\">특권, 특혜<\/td><\/tr><tr><td class=\"w\">consider<\/td><td class=\"m\">고려하다, 여기다<\/td><\/tr><tr><td class=\"w\">theoretical<\/td><td class=\"m\">이론적인<\/td><\/tr><tr><td class=\"w\">approach<\/td><td class=\"m\">접근법, 방식<\/td><\/tr><tr><td class=\"w\">concern<\/td><td class=\"m\">~와 관련되다, 걱정시키다<\/td><\/tr><tr><td class=\"w\">argue<\/td><td class=\"m\">주장하다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">form<\/td><td class=\"m\">형성하다, 이루다<\/td><\/tr><tr><td class=\"w\">simply<\/td><td class=\"m\">단순히, 그저<\/td><\/tr><tr><td class=\"w\">irrelevant<\/td><td class=\"m\">관련 없는<\/td><\/tr><tr><td class=\"w\">deserve<\/td><td class=\"m\">~을 받을 만하다<\/td><\/tr><tr><td class=\"w\">relevant<\/td><td class=\"m\">관련된, 유의미한<\/td><\/tr><tr><td class=\"w\">characteristic<\/td><td class=\"m\">특징, 특성<\/td><\/tr><tr><td class=\"w\">extend<\/td><td class=\"m\">늘리다, 연장하다<\/td><\/tr><tr><td class=\"w\">sort<\/td><td class=\"m\">종류, 유형<\/td><\/tr><tr><td class=\"w\">according to<\/td><td class=\"m\">~에 따르면, ~에 따라<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>What is the Capabilities Approach (CA),<\/b><\/span><span class=\"ko\">능력 접근법(CA)이란 무엇이며,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and why would lawyers<\/b><\/span><span class=\"ko\">그리고 왜 법률가들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">passionate about animal justice<\/span><\/b><\/span><span class=\"ko\">동물 정의에 열정을 가진<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>care about it?<\/b><\/span><span class=\"ko\">그것에 관심을 가질까?<\/span><\/div><\/div><div class=\"lec-sent-ko\">능력 접근법(CA)이란 무엇이며, 동물 정의에 열정을 가진 법률가들이 왜 그것에 관심을 가질까?<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> Capabilities Approach는 글 전체의 핵심 소재이며, 글쓴이는 이 이론이 동물의 권리를 법적으로 보호하려는 사람들에게 실질적인 도움을 줄 수 있다는 점을 시사하며 글을 시작합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">passionate about animal justice (형용사구): 형용사 passionate가 이끄는 구가 뒤에서 앞의 명사 lawyers를 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">passionate<\/td><td class=\"m\">열정적인<\/td><\/tr><tr><td class=\"w\">approach<\/td><td class=\"m\">접근법, 방식<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">It is easy<\/span><\/b><\/span><span class=\"ko\">그것은 쉽다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to say<\/span><\/b><\/span><span class=\"ko\">말하는 것이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">what it is not<\/span>.<\/b><\/span><span class=\"ko\">그것이 아닌 것을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것이 아닌 것을 말하는 것이 쉽다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> what it is not은 CA가 기존의 다른 이론들과는 확실히 구분되는 특징을 가지고 있다는 점을 강조하며, 다음 문장에서 나올 본격적인 차이점을 예고합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It is easy to say (가주어): 진주어: 주어 자리에 가주어 It을 쓰고, 진짜 주어인 to부정사구(to say what it is not)를 뒤로 보낸 구조다.<\/div><div class=\"lec-gr-item\">to say (to부정사(명사적)): 문장의 진짜 주어(진주어) 역할을 한다. (판별: 주어 자리)<\/div><div class=\"lec-gr-item\">what it is not (간접의문문): 의문사(what) + 주어(it) + 동사(is not) 어순으로 say의 목적어 역할을 하는 명사절이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The CA does not rank animals<\/b><\/span><span class=\"ko\">CA는 동물들을 순위를 매기지 않으며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by likeness to humans<\/b><\/span><span class=\"ko\">인간과의 유사성에 따라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or seek special privileges<\/b><\/span><span class=\"ko\">또는 특별한 특권을 구하지 않는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for those<\/b><\/span><span class=\"ko\">존재들에게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">considered<\/span> most “like us,”<\/b><\/span><span class=\"ko\">가장 “우리와 비슷한” 것으로 간주되는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as do some other popular theoretical approaches<\/span>.<\/b><\/span><span class=\"ko\">다른 몇몇 널리 퍼진 이론적 접근법들이 그러하듯이.<\/span><\/div><\/div><div class=\"lec-sent-ko\">CA는 다른 널리 퍼진 이론적 접근들이 그러하듯, 동물들을 인간과의 유사성에 따라 순위를 매기거나 가장 ‘우리와 비슷한’ 존재로 여겨지는 동물에게 각별한 특권을 부여하려 하지 않는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> rank animals by likeness to humans는 인간과 얼마나 비슷한 지능이나 행동을 보이느냐를 기준으로 동물의 가치를 높게 혹은 낮게 평가하는 기존의 인간 중심적 관습을 가리킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">considered (과거분사(형용사)): considered가 대명사 those를 수식한다. (= those who are considered / &#39;~라고 여겨지는 사람들[것들]&#39;)<\/div><div class=\"lec-gr-item\">do (대동사): 앞의 일반동사구(rank... or seek...)의 반복을 피하기 위해 쓰였다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.<\/div><div class=\"lec-gr-item\">as do some other popular theoretical approaches (도치): 접속사 as(~처럼) 뒤에서 주어(some other...)와 대동사(do)의 자리가 바뀌어 &#39;동사+주어&#39; 어순이 된 도치 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rank<\/td><td class=\"m\">순위를 차지하다<\/td><\/tr><tr><td class=\"w\">seek<\/td><td class=\"m\">찾다, 구하다<\/td><\/tr><tr><td class=\"w\">privilege<\/td><td class=\"m\">특권, 특혜<\/td><\/tr><tr><td class=\"w\">consider<\/td><td class=\"m\">고려하다, 여기다<\/td><\/tr><tr><td class=\"w\">theoretical<\/td><td class=\"m\">이론적인<\/td><\/tr><tr><td class=\"w\">approach<\/td><td class=\"m\">접근법, 방식<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The CA has concern<\/b><\/span><span class=\"ko\">CA는 관심을 가진다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for the finch and the pig<\/b><\/span><span class=\"ko\">핀치와 돼지에게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as much as<\/span> the whale and the elephant.<\/b><\/span><span class=\"ko\">고래와 코끼리만큼이나.<\/span><\/div><\/div><div class=\"lec-sent-ko\">CA는 고래와 코끼리에게만큼이나 핀치와 돼지에게도 관심을 가진다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> the finch and the pig은 앞 문장에서 언급한 &#39;인간과 덜 닮은&#39; 동물들을 대표하며, 고래나 코끼리 같은 거대하고 영리한 동물들과 똑같은 도덕적 배려를 받을 가치가 있다는 점을 뒷받침하는 예시입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">as much as (관용표현): &#39;~만큼이나&#39;, &#39;~와 마찬가지로&#39;라는 의미로 두 대상을 동등하게 비교할 때 쓴다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">concern<\/td><td class=\"m\">~와 관련되다, 걱정시키다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>And it argues<\/b><\/span><span class=\"ko\">그리고 그것은 주장한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that the human form of life<\/b><\/span><span class=\"ko\">인간의 삶의 형태는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is simply irrelevant<\/b><\/span><span class=\"ko\">그저 무관하다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when we think<\/b><\/span><span class=\"ko\">우리가 생각할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>about <span class=\"grammar-hl\">what each type of animal needs and deserves<\/span>.<\/b><\/span><span class=\"ko\">각 종류의 동물이 필요로 하고 마땅히 누려야 할 것에 대해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그리고 그것은 우리가 각 종류의 동물이 필요로 하고 마땅히 누려야 할 것에 대해 생각할 때, 인간의 삶의 형태는 그저 무관하다고 주장한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> human form of life is simply irrelevant — 글쓴이는 여기서 힘주어 말합니다. 동물이 행복하게 살 권리가 있는지 판단할 때 &#39;인간처럼 행동하는가&#39;는 전혀 따질 필요가 없는 기준이라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">what each type of animal needs and deserves (간접의문문): 의문사(what) + 주어(each type of animal) + 동사(needs and deserves) 어순으로 전치사 about의 목적어 역할을 하는 명사절이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">argue<\/td><td class=\"m\">주장하다<\/td><\/tr><tr><td class=\"w\">form<\/td><td class=\"m\">형성하다, 이루다<\/td><\/tr><tr><td class=\"w\">simply<\/td><td class=\"m\">단순히, 그저<\/td><\/tr><tr><td class=\"w\">irrelevant<\/td><td class=\"m\">관련 없는<\/td><\/tr><tr><td class=\"w\">deserve<\/td><td class=\"m\">~을 받을 만하다<\/td><\/tr><tr><td class=\"w\">relevant<\/td><td class=\"m\">관련된, 유의미한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">What is relevant<\/span><\/b><\/span><span class=\"ko\">관련이 있는 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is their own forms of life.<\/b><\/span><span class=\"ko\">그들 고유의 삶의 형태이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">관련이 있는 것은 ‘그들 고유의’ 삶의 형태이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> relevant는 동물의 권리를 논할 때 진정으로 고려해야 할 유일한 잣대가 무엇인지 보여주며, 인간의 기준이 아닌 해당 동물의 생물학적·사회적 특성에 집중해야 한다는 방향성을 제시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">What is relevant (관계대명사): 선행사를 포함한 관계대명사 what이 이끄는 절로, 문장에서 주어 역할을 한다. (~하는 것)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">form<\/td><td class=\"m\">형성하다, 이루다<\/td><\/tr><tr><td class=\"w\">relevant<\/td><td class=\"m\">관련된, 유의미한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Just as humans seek<\/b><\/span><span class=\"ko\">꼭 인간이 추구하는 것처럼<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to be able<\/span> <span class=\"grammar-hl\">to enjoy<\/span><\/b><\/span><span class=\"ko\">즐길 수 있기를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the characteristic goods<\/b><\/span><span class=\"ko\">고유한 좋은 것들을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of a human life,<\/b><\/span><span class=\"ko\">인간다운 삶의,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so a finch seeks a finch’s life<\/b><\/span><span class=\"ko\">그렇게 핀치는 핀치의 삶을 추구하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and the whale a whale’s life.<\/b><\/span><span class=\"ko\">고래는 고래의 삶을 추구한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">꼭 인간이 인간다운 삶의 고유한 좋은 것들을 누릴 수 있기를 추구하는 것처럼, 핀치는 핀치의 삶을, 고래는 고래의 삶을 추구한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> characteristic goods는 각 종이 타고난 본능과 욕구를 충족했을 때 얻는 행복을 의미하며, 모든 생명체는 각자의 종에 맞는 삶을 살 때 가장 존엄하다는 논리를 인간의 사례에 빗대어 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to be able (to부정사(명사적)): 동사 seek의 목적어 역할을 한다. (판별: 목적어 자리)<\/div><div class=\"lec-gr-item\">to enjoy (to부정사(부사적): 형용사 수식): 형용사 able을 뒤에서 수식하여 &#39;~하기에&#39; 또는 &#39;~할 수 있는&#39;의 의미를 더한다. (판별: to V 바로 앞이 형용사)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">seek<\/td><td class=\"m\">찾다, 구하다<\/td><\/tr><tr><td class=\"w\">characteristic<\/td><td class=\"m\">특징, 특성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We should extend ourselves and learn,<\/b><\/span><span class=\"ko\">우리는 우리 스스로를 확장하고 배워야 하며,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>not lazily picture animals<\/b><\/span><span class=\"ko\">동물들을 성의 없이 상상하지 말아야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as lesser humans,<\/b><\/span><span class=\"ko\">열등한 인간으로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">seeking<\/span> a life<\/b><\/span><span class=\"ko\">삶을 추구한다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>sort of like our own.<\/b><\/span><span class=\"ko\">우리와 같은 식의.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리는 스스로를 확장하고 배워야 하며, 동물들을 열등한 인간으로, 우리와 같은 식의 삶을 추구한다고 성의 없이 상상해서는 안 된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> extend ourselves and learn은 인간의 고정관념을 벗어나 동물의 실제 삶이 어떠한지 능동적으로 탐구하라는 권고이며, 동물을 lesser humans로 보는 것은 인간 편의주의적인 태도라고 지적합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">seeking (분사구문): 현재분사 seeking이 이끄는 구문으로 주절의 부수적인 상황을 나타낸다. (변환: as/while we seek ...)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">seek<\/td><td class=\"m\">찾다, 구하다<\/td><\/tr><tr><td class=\"w\">extend<\/td><td class=\"m\">늘리다, 연장하다<\/td><\/tr><tr><td class=\"w\">sort<\/td><td class=\"m\">종류, 유형<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>According to the CA,<\/b><\/span><span class=\"ko\">CA에 따르면,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>each sentient creature<\/b><\/span><span class=\"ko\">지각 능력이 있는 각각의 생명체는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>should have the opportunity<\/b><\/span><span class=\"ko\">기회를 가져야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to flourish<\/span><\/b><\/span><span class=\"ko\">번영할<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the form of life<\/b><\/span><span class=\"ko\">삶의 형태로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>characteristic for that creature.<\/b><\/span><span class=\"ko\">그 생명체에게 고유한.<\/span><\/div><\/div><div class=\"lec-sent-ko\">CA에 따르면, 지각 능력이 있는 각각의 생명체는 그 생명체에게 고유한 삶의 형태로 번영할 기회를 가져야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> opportunity to flourish는 이 글의 결론으로, 단순히 동물을 죽이지 않는 수준을 넘어 각 동물이 타고난 잠재력을 마음껏 발휘하며 살 수 있는 환경을 보장해야 한다는 CA의 최종 목표를 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to flourish (to부정사(형용사적)): 명사 opportunity를 수식하여 &#39;~할 기회&#39;라는 의미를 만든다. (판별: opportunity to V 구조이며 the opportunity that they flourish로 풀이 가능)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">form<\/td><td class=\"m\">형성하다, 이루다<\/td><\/tr><tr><td class=\"w\">characteristic<\/td><td class=\"m\">특징, 특성<\/td><\/tr><tr><td class=\"w\">according to<\/td><td class=\"m\">~에 따르면, ~에 따라<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>역량 접근법(CA)은 동물의 권리를 인간과의 유사성으로 판단하지 않는다.<\/li><li>기존 이론들이 똑똑하거나 인간과 닮은 동물에게 특권을 줬다면, CA는 모든 동물을 동등하게 배려한다.<\/li><li>동물의 권리를 따질 때 인간의 기준은 무의미하며, 각 동물의 고유한 삶의 방식이 기준이 되어야 한다.<\/li><li>인간은 동물을 &#39;부족한 인간&#39;으로 보지 말고, 그들이 종의 특성에 맞게 번영할 기회를 보장해야 한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">The Capabilities Approach rejects human-centered comparisons to ensure that each sentient creature can flourish according to its own characteristic form of life.<\/div>\n              <div class=\"lec-final-sum-ko\">역량 접근법은 각 유정적 존재가 자신만의 특유한 삶의 형태에 따라 번영할 수 있도록 인간 중심의 비교를 거부한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/8.mp3","hl":"stage-4"}],[{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/9.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/10.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/11.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/12.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/13.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/14.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/15.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/16.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/17.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/18.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/19.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/20.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/21.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/22.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_34번_강의_audio/23.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_34번_강의 으로 보는 게으른 시각을 버려야 함","인간이 인간다운 삶을 원하듯, 각 동물도 그들만의 삶을 추구함","핵심 키워드: 확장과 학습(extend and learn)"]},{"label":"05이론의 최종 목적","items":["모든 지각 있는 존재가 자신의 종적 특성에 맞게 살아갈 기회를 보장받아야 한다.","각 지각 있는 존재(sentient creature)가 자신의 고유한 형태대로 살아감","동물이 자신의 잠재력을 발휘하며 번성(flourish)할 기회를 제공함","핵심 키워드: 번성할 기회(opportunity to flourish)"]}],"bkg":"이 지문에서 다루는 역량 접근법(Capabilities Approach)은 원래 경제학자 아마르티아 센과 철학자 마사 너스바움(Martha Nussbaum)이 발전시킨 이론으로, 단순히 생존이나 권리를 넘어 각 개인이 실제로 무엇을 할 수 있고 어떤 상태가 될 수 있는지에 초점을 맞춥니다. 너스바움은 이 이론을 동물 윤리로 확장하여, 인간과 얼마나 닮았느냐가 아니라 각 지각 있는 존재(Sentient creatures)가 타고난 본성대로 번영(Flourishing)할 수 있는 기회를 보장받아야 한다고 주장해요. 예를 들어, 하늘을 날아야 하는 새에게는 날 수 있는 환경이, 헤엄쳐야 하는 고래에게는 바다가 고유한 삶의 권리로서 보장되는 것이 그 동물의 존엄성을 지켜주는 핵심이라고 보는 것이죠. 이는 동물을 '인간보다 열등한 존재'로 보거나 인간의 잣대로 등급을 매기던 과거의 시각에서 벗어나, 각 생명체가 가진 생물학적 특성을 그 자체로 존중하려는 현대 법철학의 중요한 흐름을 담고 있습니다.","ttsText":"이 지문에서 다루는 역량 접근법(Capabilities Approach)은 원래 경제학자 아마르티아 센과 철학자 마사 너스바움(Martha Nussbaum)이 발전시킨 이론으로, 단순히 생존이나 권리를 넘어 각 개인이 실제로 무엇을 할 수 있고 어떤 상태가 될 수 있는지에 초점을 맞춥니다. 너스바움은 이 이론을 동물 윤리로 확장하여, 인간과 얼마나 닮았느냐가 아니라 각 지각 있는 존재(Sentient creatures)가 타고난 본성대로 번영(Flourishing)할 수 있는 기회를 보장받아야 한다고 주장해요. 예를 들어, 하늘을 날아야 하는 새에게는 날 수 있는 환경이, 헤엄쳐야 하는 고래에게는 바다가 고유한 삶의 권리로서 보장되는 것이 그 동물의 존엄성을 지켜주는 핵심이라고 보는 것이죠. 이는 동물을 '인간보다 열등한 존재'로 보거나 인간의 잣대로 등급을 매기던 과거의 시각에서 벗어나, 각 생명체가 가진 생물학적 특성을 그 자체로 존중하려는 현대 법철학의 중요한 흐름을 담고 있습니다.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 34번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 34번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고1 / 2025년 / 10월 / 34번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고1 / 2025년 / 10월 / 34번","titleEn":"The Capabilities Approach: Valuing Each Animal’s Unique Form of Life","titleKo":"역량 접근법: 각 동물의 고유한 삶의 형태를 가치 있게 여기기","imageUrl":"__enpImg__","stages":[{"label":"01역량 접근법의 부정적 정의","items":["역량 접근법은 동물을 인간과의 유사성에 따라 차별하거나 서열화하지 않는다.","인간과의 유사성(likeness to humans)을 기준으로 동물을 평가하는 방식을 거부함","특정 동물에게만 주어지는 특별한 특권(special privileges)을 추구하지 않음","핵심 키워드: 역량 접근법(Capabilities Approach)"] y를 수식하여 '~할 기회'라는 의미를 만든다. (판별: opportunity to V 구조이며 the opportunity that they flourish로 풀이 가능)"],"vocab":[{"word":"form","meaning":"형성하다, 이루다"},{"word":"characteristic","meaning":"특징, 특성"},{"word":"according to","meaning":"~에 따르면, ~에 따라"}],"ttsText":"CA에 따르면, 지각 능력이 있는 각각의 생명체는 그 생명체에게 고유한 삶의 형태로 번영할 기회를 가져야 한다.. opportunity to flourish는 이 글의 결론으로, 단순히 동물을 죽이지 않는 수준을 넘어 각 동물이 타고난 잠재력을 마음껏 발휘하며 살 수 있는 환경을 보장해야 한다는 CA의 최종 목표를 보여줍니다.. to flourish (to부정사(형용사적)): 명사 opportunity를 수식하여 '~할 기회'라는 의미를 만든다. (판별: opportunity to V 구조이며 the opportunity that they flourish로 풀이 가능)","__passage":"모의고사 / 고1 / 2025년 / 10월 / 34번","passageName":"모의고사 / 고1 / 2025년 / 10월 / 34번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 34번"},{"kind":"summary","passageName":"모의고사 / 고1 / 2025년 / 10월 / 34번","imageUrl":"__enpImg__","sumEn":"The Capabilities Approach rejects human-centered comparisons to ensure that each sentient creature can flourish according to its own characteristic form of life.","sumKo":"역량 접근법은 각 유정적 존재가 자신만의 특유한 삶의 형태에 따라 번영할 수 있도록 인간 중심의 비교를 거부한다.","bullets":[],"overall":["역량 접근법(CA)은 동물의 권리를 인간과의 유사성으로 판단하지 않는다.","기존 이론들이 똑똑하거나 인간과 닮은 동물에게 특권을 줬다면, CA는 모든 동물을 동등하게 배려한다.","동물의 권리를 따질 때 인간의 기준은 무의미하며, 각 동물의 고유한 삶의 방식이 기준이 되어야 한다.","인간은 동물을 '부족한 인간'으로 보지 말고, 그들이 종의 특성에 맞게 번영할 기회를 보장해야 한다."],"compare":{"headers":["구분","기존의 이론적 접근","역량 접근법 (CA)"],"rows":[["가치 평가 기준","인간과의 유사성 및 지능 순위","각 동물의 고유한 삶의 형태"],["배려의 대상","우리와 닮은 영리한 동물 우선","핀치, 돼지, 고래 등 모든 생명체"],["인간의 관점","동물을 열등한 인간으로 투영","종별 특성을 배우고 이해하려 노력"],["최종 목표","인간 중심적 특권 부여","종의 특성에 맞는 번영 기회 보장"]]},"ttsText":"역량 접근법(CA)은 동물의 권리를 인간과의 유사성으로 판단하지 않는다. 기존 이론들이 똑똑하거나 인간과 닮은 동물에게 특권을 줬다면, CA는 모든 동물을 동등하게 배려한다. 동물의 권리를 따질 때 인간의 기준은 무의미하며, 각 동물의 고유한 삶의 방식이 기준이 되어야 한다. 인간은 동물을 '부족한 인간'으로 보지 말고, 그들이 종의 특성에 맞게 번영할 기회를 보장해야 한다.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 34번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 34번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 역량 접근법(CA)은 동물의 권리를 인간과의 유사성으로 판단하지 않습니다. 기존 이론들이 똑똑하거나 인간과 닮은 동물에게 특권을 줬다면, CA는 모든
