"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01소셜 미디어의 역할<\/div><ul><li>소셜 미디어는 개인이 겪은 일을 기억하도록 돕는 중요한 장소이다.<\/li><li>게시된 사건은 게시되지 않은 사건보다 더 잘 기억됨<\/li><li>사건의 성격과 관계없이 기록 행위 자체가 기억에 영향을 줌<\/li><li>핵심 키워드: 자전적 기억(autobiographical remembering)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02인지적 강화 과정<\/div><ul><li>온라인에 기억을 공유하면 사건을 되새기고 의미를 부여하게 된다.<\/li><li>내용을 다시 연습(rehearse)하고 사건을 이해(make sense)함<\/li><li>이러한 과정이 장기 기억(long-term memory) 보존을 촉진함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03외부적 기억 단서<\/div><ul><li>플랫폼의 기술적 특징과 피드백이 기억을 떠올리게 하는 단서가 된다.<\/li><li>댓글(comments)이나 좋아요(likes)와 같은 사회적 피드백<\/li><li>알고리즘과 주기적 알림(reminders) 등 기술적 기능<\/li><li>핵심 키워드: 기억 단서(memory cues)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04기억의 선별적 보존<\/div><ul><li>공유 여부에 따라 기억의 지속성이 다르게 나타난다.<\/li><li>공유된 정보는 시간이 흐르며 안정화(stabilized)되어 유지됨<\/li><li>공유되지 않은 정보는 잊히거나 접근 불가능해짐<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">social media<\/td><td class=\"m\">누리소통망, 소셜미디어<\/td><\/tr><tr><td class=\"w\">context<\/td><td class=\"m\">맥락, 문맥<\/td><\/tr><tr><td class=\"w\">facilitate<\/td><td class=\"m\">쉽게 하다, 촉진하다<\/td><\/tr><tr><td class=\"w\">post<\/td><td class=\"m\">게시하다, 올리다<\/td><\/tr><tr><td class=\"w\">platform<\/td><td class=\"m\">플랫폼, 승강장<\/td><\/tr><tr><td class=\"w\">independent<\/td><td class=\"m\">독립적인, 남에게 기대지 않는<\/td><\/tr><tr><td class=\"w\">characteristic<\/td><td class=\"m\">특징, 특성<\/td><\/tr><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><tr><td class=\"w\">allow<\/td><td class=\"m\">허용하다, ~하게 해 주다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">individual<\/td><td class=\"m\">개인<\/td><\/tr><tr><td class=\"w\">rehearse<\/td><td class=\"m\">연습하다, 리허설하다<\/td><\/tr><tr><td class=\"w\">thus<\/td><td class=\"m\">그러므로, 따라서<\/td><\/tr><tr><td class=\"w\">term<\/td><td class=\"m\">용어<\/td><\/tr><tr><td class=\"w\">retention<\/td><td class=\"m\">보유, 유지<\/td><\/tr><tr><td class=\"w\">feedback<\/td><td class=\"m\">피드백, (의견) 반응<\/td><\/tr><tr><td class=\"w\">comment<\/td><td class=\"m\">논평, 의견<\/td><\/tr><tr><td class=\"w\">feature<\/td><td class=\"m\">특징, 특성<\/td><\/tr><tr><td class=\"w\">periodic<\/td><td class=\"m\">주기적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Social media<\/b><\/span><span class=\"ko\">소셜 미디어는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>serves as<\/b><\/span><span class=\"ko\">작용하며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>an important context<\/b><\/span><span class=\"ko\">중요한 맥락으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to facilitate<\/span><\/b><\/span><span class=\"ko\">촉진하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>autobiographical <span class=\"grammar-hl\">remembering<\/span>.<\/b><\/span><span class=\"ko\">자전적 기억을 촉진하는 중요한 맥락으로 작용한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">소셜 미디어는 자전적 기억을 촉진하는 중요한 맥락으로 작용한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> facilitate autobiographical remembering은 개인이 자신의 삶에서 겪은 사건들을 더 잘 떠올리고 정리할 수 있도록 돕는다는 의미입니다. 이 문장은 소셜 미디어가 단순한 소통 도구를 넘어 개인의 역사를 기록하고 보존하는 환경이 되어준다는 글의 핵심 주제를 도입합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to facilitate (to부정사(형용사적)): 앞의 명사 context를 수식하며 &#39;~하기 위한 맥락&#39;으로 해석된다. 명사의 내용을 구체화하며 context that facilitates의 의미를 전달하므로 형용사적 용법이다.<\/div><div class=\"lec-gr-item\">remembering (동명사): 형용사 autobiographical의 수식을 받아 &#39;기억하기&#39;라는 행위 혹은 활동을 나타내는 명사적 개념으로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">social media<\/td><td class=\"m\">누리소통망, 소셜미디어<\/td><\/tr><tr><td class=\"w\">context<\/td><td class=\"m\">맥락, 문맥<\/td><\/tr><tr><td class=\"w\">facilitate<\/td><td class=\"m\">쉽게 하다, 촉진하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Personal events<\/b><\/span><span class=\"ko\">개인적 사건들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">posted<\/span> on social media platforms<\/b><\/span><span class=\"ko\">소셜 미디어 플랫폼에 게시된<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">are better remembered<\/span><\/b><\/span><span class=\"ko\">더 잘 기억되고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and less forgotten<\/span><\/b><\/span><span class=\"ko\">덜 잊히며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than those <span class=\"grammar-hl\">not posted<\/span>,<\/b><\/span><span class=\"ko\">게시되지 않은 것들보다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>independent of<\/b><\/span><span class=\"ko\">무관하게,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the characteristics of the events.<\/b><\/span><span class=\"ko\">그 사건들의 특성과 무관하게 덜 잊힌다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">소셜 미디어 플랫폼에 게시된 개인적 사건들은 그 사건들의 특성과 무관하게, 게시되지 않은 것들보다 더 잘 기억되고 덜 잊힌다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> independent of the characteristics of the events는 그 사건이 얼마나 특별하거나 감동적이었는지와는 상관없이 &#39;게시 행위&#39; 자체가 기억에 결정적인 영향을 미친다는 의미입니다. 앞 문장에서 제시한 소셜 미디어의 기억 보조 기능을 구체적인 비교를 통해 뒷받침하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">posted (과거분사(형용사)): posted가 앞의 명사 Personal events를 수식한다. (= personal events that are posted)<\/div><div class=\"lec-gr-item\">are better remembered and less forgotten (수동태): be동사(are)+p.p.(remembered/forgotten) 구조. remember와 forget은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are remembered, are forgotten 형태로 쓴다. 기본구조: V + O<\/div><div class=\"lec-gr-item\">not posted (과거분사(형용사)): posted가 앞의 대명사 those를 수식한다. (= those that are not posted)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">social media<\/td><td class=\"m\">누리소통망, 소셜미디어<\/td><\/tr><tr><td class=\"w\">post<\/td><td class=\"m\">게시하다, 올리다<\/td><\/tr><tr><td class=\"w\">platform<\/td><td class=\"m\">플랫폼, 승강장<\/td><\/tr><tr><td class=\"w\">independent<\/td><td class=\"m\">독립적인, 남에게 기대지 않는<\/td><\/tr><tr><td class=\"w\">characteristic<\/td><td class=\"m\">특징, 특성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This may be<\/b><\/span><span class=\"ko\">이것은 ~ 때문일 수 있는데<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because <span class=\"grammar-hl\">sharing<\/span> memories online<\/b><\/span><span class=\"ko\">온라인에서 기억을 공유하는 것이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">allows individuals<\/span><\/b><\/span><span class=\"ko\">개인이 ~하도록 해서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to rehearse<\/span><\/b><\/span><span class=\"ko\">되풀이하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and make sense of<\/span><\/b><\/span><span class=\"ko\">이해하도록 하며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>what happened,<\/b><\/span><span class=\"ko\">일어난 일을,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>thus <span class=\"grammar-hl\">facilitating<\/span><\/b><\/span><span class=\"ko\">그리하여 촉진하기<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>long-term memory retention.<\/b><\/span><span class=\"ko\">장기 기억 유지를 촉진하기 때문일 수 있다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이것은 온라인에서 기억을 공유하는 것이 개인이 일어난 일을 되풀이하고 이해하도록 해서 장기 기억 유지를 촉진하기 때문일 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> rehearse and make sense of what happened는 게시물을 올리는 과정에서 내용을 머릿속으로 되뇌고 사건의 의미를 스스로 정리하게 된다는 의미입니다. 앞 문장에서 언급한 현상이 왜 발생하는지에 대한 심리학적 기제, 즉 개인 내부의 인지적 노력을 설명하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">sharing (동명사): because가 이끄는 부사절 내에서 주어 역할을 하며 &#39;공유하는 것&#39;이라는 명사적 의미로 쓰였다.<\/div><div class=\"lec-gr-item\">allows individuals to rehearse and make sense of 5형식(SVOC) 구조: 동사(allows) + 목적어(individuals) + 목적격보어(to부정사) 구조로 &#39;목적어가 ~하도록 허용하다&#39;라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">to rehearse and make sense of (목적격보어(to부정사)): 5형식 동사 allow의 목적어인 individuals의 동작을 설명하는 보어이다.<\/div><div class=\"lec-gr-item\">facilitating (분사구문): 주절의 상황에 따른 결과나 부수적 상황을 나타낸다. 원래 절로 변환하면 and thus it facilitates... 와 같이 접속사(and)와 주어, 동사가 결합된 형태로 쓸 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">facilitate<\/td><td class=\"m\">쉽게 하다, 촉진하다<\/td><\/tr><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><tr><td class=\"w\">allow<\/td><td class=\"m\">허용하다, ~하게 해 주다<\/td><\/tr><tr><td class=\"w\">individual<\/td><td class=\"m\">개인<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rehearse<\/td><td class=\"m\">연습하다, 리허설하다<\/td><\/tr><tr><td class=\"w\">thus<\/td><td class=\"m\">그러므로, 따라서<\/td><\/tr><tr><td class=\"w\">term<\/td><td class=\"m\">용어<\/td><\/tr><tr><td class=\"w\">retention<\/td><td class=\"m\">보유, 유지<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Online feedback<\/b><\/span><span class=\"ko\">온라인 피드백도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>such as comments and likes<\/b><\/span><span class=\"ko\">댓글과 좋아요와 같은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as well as technological features<\/b><\/span><span class=\"ko\">기술적 기능들뿐만 아니라,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>such as algorithms and periodic reminders<\/b><\/span><span class=\"ko\">알고리즘과 주기적인 알림과 같은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can further serve<\/b><\/span><span class=\"ko\">한층 더 작용할 수 있으며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as memory cues<\/b><\/span><span class=\"ko\">기억 단서로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for the <span class=\"grammar-hl\">posted<\/span> event details.<\/b><\/span><span class=\"ko\">게시된 사건의 세부 사항에 대한 기억 단서로 작용할 수 있다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">알고리즘과 주기적인 알림과 같은 기술적 기능들뿐만 아니라, 댓글과 좋아요와 같은 온라인 피드백도 게시된 사건의 세부 사항에 대한 기억 단서로 한층 더 작용할 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> serve as memory cues는 타인의 반응이나 시스템의 자동 알림이 잊혀가는 기억을 다시 불러일으키는 자극제가 된다는 의미입니다. 3번 문장이 개인의 노력을 다뤘다면, 이 문장은 타인과의 상호작용과 플랫폼의 기술적 지원이라는 외부적 요인을 추가하여 논의를 확장합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">posted (과거분사(형용사)): posted가 뒤의 명사구 event details를 수식한다. (= event details that were posted)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">post<\/td><td class=\"m\">게시하다, 올리다<\/td><\/tr><tr><td class=\"w\">feedback<\/td><td class=\"m\">피드백, (의견) 반응<\/td><\/tr><tr><td class=\"w\">comment<\/td><td class=\"m\">논평, 의견<\/td><\/tr><tr><td class=\"w\">feature<\/td><td class=\"m\">특징, 특성<\/td><\/tr><tr><td class=\"w\">periodic<\/td><td class=\"m\">주기적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>As a result,<\/b><\/span><span class=\"ko\">그 결과,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>event details<\/b><\/span><span class=\"ko\">사건 세부 사항들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">shared<\/span> on social media<\/b><\/span><span class=\"ko\">소셜 미디어에 공유된<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">are likely stabilized<\/span><\/b><\/span><span class=\"ko\">안정화되고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and remembered<\/span><\/b><\/span><span class=\"ko\">기억될 가능성이 높은 반면에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>over time,<\/b><\/span><span class=\"ko\">시간이 지나면서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>whereas those <span class=\"grammar-hl\">not shared<\/span><\/b><\/span><span class=\"ko\">공유되지 않은 것들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>may become inaccessible<\/b><\/span><span class=\"ko\">접근할 수 없게 되거나<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or forgotten.<\/b><\/span><span class=\"ko\">잊힐 수 있다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 결과, 소셜 미디어에 공유된 사건 세부 사항들은 시간이 지나면서 안정화되고 기억될 가능성이 높은 반면에, 공유되지 않은 것들은 접근할 수 없게 되거나 잊힐 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> stabilized and remembered는 게시된 정보가 뇌와 디지털 공간 양쪽에서 단단히 고정되어 시간이 흘러도 사라지지 않는다는 의미입니다. 앞서 설명한 원인들의 최종적인 결과를 보여주며, 소셜 미디어 활용 여부에 따른 기억의 보존 차이를 명확히 대조하며 글을 마무리합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">shared (과거분사(형용사)): shared가 앞의 명사구 event details를 수식한다. (= event details that are shared)<\/div><div class=\"lec-gr-item\">are likely stabilized and remembered (수동태): be동사(are)+p.p.(stabilized/remembered) 구조. stabilize와 remember는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조로 쓰였다. likely는 부사로 삽입된 형태이다. 기본구조: V + O<\/div><div class=\"lec-gr-item\">not shared (과거분사(형용사)): shared가 앞의 대명사 those를 수식한다. (= those that are not shared)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">social media<\/td><td class=\"m\">누리소통망, 소셜미디어<\/td><\/tr><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>소셜 미디어는 개인의 과거 경험을 기억해 내는 데 중요한 환경을 제공한다.<\/li><li>온라인에 게시된 사건은 게시하지 않은 사건보다 더 오래, 더 정확하게 기억된다.<\/li><li>이는 게시 과정에서의 인지적 재구성(되풀이 및 이해)과 타인의 피드백, 시스템 알림 등이 기억을 돕기 때문이다.<\/li><li>결국 공유된 기억은 장기적으로 보존되지만, 공유되지 않은 기억은 점차 사라지게 된다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Social media platforms enhance the retention of personal memories by providing opportunities for cognitive rehearsal and various technological memory cues.<\/div>\n              <div class=\"lec-final-sum-ko\">소셜 미디어 플랫폼은 인지적 리허설과 다양한 기술적 기억 단서를 제공함으로써 개인적 기억의 유지를 강화한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/18.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/19.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/21.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/22.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/23.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_35번_강의_audio/24.mp3","hl":null}]],"fileName":"모의고사_고1_2025년_10월_35번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 10월 / 35번","titleEn":"How Social Media Platforms Help Us Remember Our Personal Lives","titleKo":"소셜 미디어 플랫폼이 우리의 개인적인 삶을 기억하도록 돕는 방식","imageUrl":"__enpImg__","stages":[{"label":"01소셜 미디어의 역할","items":["소셜 미디어는 개인이 겪은 일을 기억하도록 돕는 중요한 장소이다.","게시된 사건은 게시되지 않은 사건보다 더 잘 기억됨","사건의 성격과 관계없이 기록 행위 자체가 기억에 영향을 줌","핵심 키워드: 자전적 기억(autobiographical remembering)"]},{"label":"02인지적 강화 과정","items":["온라인에 기억을 공유하면 사건을 되새기고 의미를 부여하게 된다.","내용을 다시 연습(rehearse)하고 사건을 이해(make sense)함","이러한 과정이 장기 기억(long-term memory) 보존을 촉진함"]},{"label":"03외부적 기억 단서","items":["플랫폼의 기술적 특징과 피드백이 기억을 떠올리게 하는 단서가 된다.","댓글(comments)이나 좋아요(likes)와 같은 사회적 피드백","알고리즘과 주기
