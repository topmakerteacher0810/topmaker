<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01당혹스러운 상황<\/div><ul><li>쇼핑을 마치고 주차장으로 돌아왔으나 주차한 곳에 차가 없어 당황한다.<\/li><li>주차 지점(parking spot) 확인<\/li><li>차량이 사라진(missing) 것을 발견함<\/li><li>상황을 이해하지 못해 혼란스러워함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02남편에게 도움 요청<\/div><ul><li>차를 찾지 못해 당황한 마음으로 집에 있는 남편에게 전화하여 상황을 알린다.<\/li><li>남편에게 전화(called my husband)<\/li><li>차를 잃어버렸다고 호소함<\/li><li>어찌할 바를 모르는(not knowing what to do) 상태<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03반전된 사실 확인<\/div><ul><li>남편의 웃음 섞인 대답을 통해 자신이 남편의 차를 타고 왔음을 깨닫는다.<\/li><li>남편의 웃음(laughing)<\/li><li>오늘 남편의 차(his car)를 타고 갔다는 사실 확인<\/li><li>뒤를 돌아보자 그곳에 차가 있었음<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04웃음과 안도<\/div><ul><li>자신의 착각을 깨닫고 안도의 한숨을 내쉬며 상황이 마무리된다.<\/li><li>스스로를 비웃음(laugh at myself)<\/li><li>안도의 한숨(sigh of relief)<\/li><li>모든 것이 괜찮아짐(everything was fine)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grocery<\/td><td class=\"m\">식료품<\/td><\/tr><tr><td class=\"w\">spot<\/td><td class=\"m\">지점, 장소<\/td><\/tr><tr><td class=\"w\">missing<\/td><td class=\"m\">없어진, 빠진<\/td><\/tr><tr><td class=\"w\">mine<\/td><td class=\"m\">내 것<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sigh<\/td><td class=\"m\">한숨<\/td><\/tr><tr><td class=\"w\">relief<\/td><td class=\"m\">안도, 안심<\/td><\/tr><tr><td class=\"w\">fine<\/td><td class=\"m\">훌륭한, 좋은<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">After finishing<\/span> my shopping,<\/b><\/span><span class=\"ko\">쇼핑을 마친 후에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I walked out<\/b><\/span><span class=\"ko\">나는 걸어 나갔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of the grocery store<\/b><\/span><span class=\"ko\">식료품 가게에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and headed to the spot<\/b><\/span><span class=\"ko\">그리고 그 장소로 향했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">where<\/span> I’d parked my car.<\/b><\/span><span class=\"ko\">내가 내 차를 주차했던 곳인.<\/span><\/div><\/div><div class=\"lec-sent-ko\">쇼핑을 마친 후에, 나는 식료품 가게를 걸어 나가 내가 차를 주차했던 장소로 향했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 일상적인 활동을 마친 뒤 자신의 차를 찾아가는 지극히 평범하고 자연스러운 상황을 보여 주며 글을 시작합니다. headed to the spot은 자신이 주차한 위치를 정확히 인지하고 그곳을 목적지로 삼아 움직였다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">After finishing (현재분사(분사구문)): 접속사 After 뒤에 주어(I)가 생략되고 동사에 -ing가 붙은 형태다. 원래 절: After I finished my shopping<\/div><div class=\"lec-gr-item\">where (관계부사): 선행사인 the spot을 수식하며, 뒤에는 주어(I)와 동사(’d parked), 목적어(my car)를 갖춘 완전한 절이 이어진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grocery<\/td><td class=\"m\">식료품<\/td><\/tr><tr><td class=\"w\">spot<\/td><td class=\"m\">지점, 장소<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But<\/b><\/span><span class=\"ko\">하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it <span class=\"grammar-hl\">wasn’t there<\/span>.<\/b><\/span><span class=\"ko\">그것은 거기에 없었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러나 그것이 거기에 없었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 당연히 차가 있을 것이라 예상했던 독자의 기대를 단번에 꺾으며 예기치 못한 사건을 던집니다. it wasn’t there는 주차 공간이 비어 있는 당혹스러운 현장을 시각적으로 묘사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">wasn’t there 장소의 부사: there는 &#39;거기에&#39;라는 의미의 장소 부사로, be동사 뒤에 쓰여 주어 it의 상태(위치)를 설명한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 3 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I wasn’t the kind of person<\/b><\/span><span class=\"ko\">나는 그런 종류의 사람이 아니었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to forget<\/span> <span class=\"grammar-hl\">where I’d parked<\/span>.<\/b><\/span><span class=\"ko\">내가 주차했던 곳을 잊어버릴 만큼.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 내가 주차했던 장소를 잊어버릴 그런 사람이 아니었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 차가 없어진 이유가 자신의 단순한 기억력 실수 때문이 아님을 강조하여 긴장감을 높입니다. wasn’t the kind of person은 평소 자신의 꼼꼼함이나 기억력에 대한 강한 확신을 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to forget (to부정사(형용사적)): 명사 person을 뒤에서 수식한다. person who forgets로 바꿔 쓸 수 있으므로 형용사적 용법에 해당한다.<\/div><div class=\"lec-gr-item\">where I’d parked (간접의문문): 의문사(where) + 주어(I) + 동사(’d parked)의 어순을 취하며, 동사 forget의 목적어 역할을 하는 명사절이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 4 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">I knew<\/span><\/b><\/span><span class=\"ko\">나는 알았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">I was<\/span> in the right place ―<\/b><\/span><span class=\"ko\">내가 정확한 장소에 있다는 것을 ―<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so where<\/b><\/span><span class=\"ko\">그렇다면 어디에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>was my car?<\/b><\/span><span class=\"ko\">내 차가 있었을까?<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 내가 정확한 장소에 있다는 것을 알았지만, 그렇다면 내 차는 어디에 있는 걸까?<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 장소에 대한 확신과 현실의 부조화 사이에서 오는 혼란을 극대화합니다. in the right place는 자신이 엉뚱한 구역을 헤매고 있는 것이 아니라는 사실을 다시 한번 확인하며 차가 사라졌다는 판단을 굳히는 대목입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">I knew I was 접속사 that 생략: 동사 knew와 뒤의 절(I was in the right place) 사이에는 목적어절을 이끄는 접속사 that이 생략되어 있다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 5 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I looked around,<\/b><\/span><span class=\"ko\">나는 주위를 둘러보았다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but nothing<\/b><\/span><span class=\"ko\">하지만 아무것도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">made sense<\/span>.<\/b><\/span><span class=\"ko\">이해되지 않았다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 주위를 둘러보았지만, 도무지 아무것도 이해되지 않았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 눈앞의 상황이 논리적으로 설명되지 않아 겪는 극심한 당혹감을 표현합니다. nothing made sense는 눈에 보이는 물리적 환경과 자신의 기억이 전혀 일치하지 않아 머릿속이 백지상태가 되었음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">made sense (관용표현): &#39;make sense&#39;는 &#39;의미가 통하다&#39; 또는 &#39;이해가 되다&#39;라는 뜻의 굳어진 표현이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 6 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Not knowing<\/span> <span class=\"grammar-hl\">what to do<\/span>,<\/b><\/span><span class=\"ko\">무엇을 해야 할지 몰라,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I called my husband<\/b><\/span><span class=\"ko\">나는 내 남편에게 전화를 걸었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at home<\/b><\/span><span class=\"ko\">집에 있는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and said,<\/b><\/span><span class=\"ko\">그리고 말했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“My car<\/b><\/span><span class=\"ko\">“내 차가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is missing!<\/b><\/span><span class=\"ko\">없어졌어요!<\/span><\/div><\/div><div class=\"lec-sent-ko\">무엇을 해야 할지 몰라, 나는 집에 있는 남편에게 전화를 걸어 “내 차가 없어졌어요!<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 혼자서 해결할 수 없는 문제라고 판단하고 가족에게 도움을 요청하는 긴박한 행동으로 이어집니다. Not knowing what to do는 당황한 나머지 이성적인 판단이 흐려져 곧바로 타인에게 의존하게 된 심리 상태를 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Not knowing (현재분사(분사구문)): 이유를 나타내며, 주절의 주어(I)가 모르는 상태임을 의미한다. 분사구문의 부정은 분사 앞에 Not을 위치시킨다. 원래 절: Because I did not know what to do<\/div><div class=\"lec-gr-item\">what to do (to부정사(명사적)): &#39;의문사 + to부정사&#39; 구조로 동사 knowing의 목적어 역할을 하며, &#39;무엇을 해야 할지&#39;라는 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">missing<\/td><td class=\"m\">없어진, 빠진<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I can’t <span class=\"grammar-hl\">find<\/span><\/b><\/span><span class=\"ko\">나는 찾을 수 없어요<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">my car<\/span>.”<\/b><\/span><span class=\"ko\">내 차를.”<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 차를 못 찾겠어요.”라고 말했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 외침을 뒷받침하며 현재 자신이 처한 곤란한 상황을 구체적인 고백으로 요약합니다. can’t find my car는 단순히 차를 못 찾는 수준을 넘어 차가 도난당했을지도 모른다는 공포 섞인 확신을 담고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">find my car 3형식(SVO) 구조: 조동사 can&#39;t 뒤에 타동사 find와 그 목적어 my car가 결합된 전형적인 주어+동사+목적어 구조다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 8 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I <span class=\"grammar-hl\">heard him laughing<\/span><\/b><\/span><span class=\"ko\">나는 그가 웃는 것을 들었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on the other end of the line.<\/b><\/span><span class=\"ko\">전화기의 반대편에서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 그가 전화기의 반대편에서 웃는 것을 들었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 당황한 주인공의 감정과 대비되는 남편의 여유로운 반응을 통해 상황의 반전을 암시합니다. laughing on the other end는 남편이 이 소동의 원인을 이미 알고 있으며, 상황이 심각한 것이 아니라 우스꽝스러운 해프닝임을 시사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">heard him laughing 5형식(SVOC) 구조: 지각동사 heard 뒤에 목적어(him)와 목적어의 동작을 설명하는 목적격보어(laughing)가 온 구조다. 목적어의 동작이 진행 중임을 강조하기 위해 현재분사 형태를 썼다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 9 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>“<span class=\"grammar-hl\">Your car<\/span><\/b><\/span><span class=\"ko\">“당신의 차는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">is here<\/span><\/b><\/span><span class=\"ko\">여기에 있어요<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>outside the house!<\/b><\/span><span class=\"ko\">집 밖에!<\/span><\/div><\/div><div class=\"lec-sent-ko\">“당신의 차는 여기 집 밖에 있어요!<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 주인공이 차를 잃어버렸다고 생각한 근본적인 이유가 밝혀지는 지점입니다. here outside the house는 주인공의 차가 애초에 식료품점에 온 적이 없다는 사실을 일깨워 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Your car is here 1형식(SVA) 구조: 주어 Your car와 장소를 나타내는 부사구 here가 be동사로 연결된 구조다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 10 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>You took <span class=\"grammar-hl\">mine<\/span><\/b><\/span><span class=\"ko\">당신은 내 것을 가져갔어요<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>today,<\/b><\/span><span class=\"ko\">오늘,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>remember?”<\/b><\/span><span class=\"ko\">기억나죠?”<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신은 오늘 내 차를 가져갔어요. 기억 나죠?”<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 모든 혼란의 원인이 밝혀지는 핵심 문장입니다. took mine은 주인공이 자신의 차가 아닌 남편의 차를 운전해 나갔기 때문에 주차장에서 자신의 차를 찾을 수 없었던 것임을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">mine (소유대명사): &#39;나의 것(my car)&#39;을 의미하며, 문장에서 동사 took의 목적어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mine<\/td><td class=\"m\">내 것<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 11 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I turned around ―<\/b><\/span><span class=\"ko\">나는 돌아보았다 ―<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">there<\/span><\/b><\/span><span class=\"ko\">그리고 거기에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">it was<\/span>.<\/b><\/span><span class=\"ko\">그것이 있었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 돌아보았고, 그것은 거기에 있었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 남편의 말을 듣고 시야를 넓히자 비로소 눈앞에 있던 남편의 차를 발견하게 됩니다. there it was는 줄곧 눈앞에 있었지만 &#39;내 차&#39;라는 고정관념 때문에 인식하지 못했던 사물을 마침내 식별하게 되었음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">there it was 부사구 도치(예외): 장소의 부사 there가 문장 앞으로 나왔으나, 주어가 대명사(it)인 경우 &#39;부사+주어+동사&#39;의 어순을 그대로 유지한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 12 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I <span class=\"grammar-hl\">couldn’t help but laugh<\/span><\/b><\/span><span class=\"ko\">나는 실소를 금할 수 없었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at myself.<\/b><\/span><span class=\"ko\">내 자신을 보고.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 실소를 금할 수 없었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 긴장이 풀리며 자신의 어처구니없는 실수를 유머러스하게 받아들입니다. laugh at myself는 스스로의 건망증과 소동을 벌인 것에 대해 느끼는 민망함과 재미가 섞인 감정 표현입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">couldn’t help but laugh (관용표현): &#39;cannot help but + 동사원형&#39;은 &#39;~하지 않을 수 없다&#39;라는 의미를 나타내는 표현이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 13 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">With a sigh of relief<\/span>,<\/b><\/span><span class=\"ko\">안도의 숨을 내쉬며,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I walked over<\/b><\/span><span class=\"ko\">나는 걸어갔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to the car.<\/b><\/span><span class=\"ko\">그 차로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">안도의 숨을 내쉬며, 나는 차로 걸어갔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 차를 잃어버렸다는 공포에서 벗어나 평온을 되찾은 상태로 복귀합니다. With a sigh of relief는 가슴을 조였던 도난에 대한 걱정이 완전히 사라졌음을 보여 주는 신체적 반응입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">With a sigh of relief (관용표현): &#39;안도의 한숨을 쉬며&#39;라는 의미로, 전치사구 형태로 쓰여 뒤따르는 동작의 부대 상황을 설명한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sigh<\/td><td class=\"m\">한숨<\/td><\/tr><tr><td class=\"w\">relief<\/td><td class=\"m\">안도, 안심<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 14 / 14<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Everything was fine<\/b><\/span><span class=\"ko\">모든 것이 괜찮았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">after all<\/span>.<\/b><\/span><span class=\"ko\">결국.<\/span><\/div><\/div><div class=\"lec-sent-ko\">결국 모든 것이 괜찮았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 한바탕 소동이 평화로운 결말로 마무리되었음을 선언하며 글을 맺습니다. after all은 우여곡절과 큰 걱정이 있었지만, 결과적으로는 아무런 피해나 문제도 발생하지 않았음을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">after all (관용표현): &#39;결국&#39; 또는 &#39;결국에는&#39;이라는 뜻으로, 예상과는 다른 결말이나 최종적인 상황을 강조할 때 쓴다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fine<\/td><td class=\"m\">훌륭한, 좋은<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>쇼핑을 마친 주인공은 주차장에서 자신의 차가 사라진 것을 발견하고 큰 혼란에 빠진다.<\/li><li>자신의 기억력을 믿었던 주인공은 상황이 이해되지 않자 결국 남편에게 전화해 차를 잃어버렸다고 알린다.<\/li><li>남편은 주인공이 오늘 남편의 차를 타고 나갔다는 사실을 알려주며 웃음을 터뜨린다.<\/li><li>주인공은 자신의 실수를 깨닫고 안도하며 우스꽝스러운 해프닝을 마무리한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">The narrator felt panicked about her missing vehicle until she realized she had driven her husband&#39;s car to the store.<\/div>\n              <div class=\"lec-final-sum-ko\">서술자는 사라진 차 때문에 당황했으나 본인이 남편의 차를 운전해 왔음을 깨달으며 안도했다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/18.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_19번_강의_audio/19.mp3","hl":"meaning"}
