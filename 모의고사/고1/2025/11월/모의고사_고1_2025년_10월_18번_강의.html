의 피드백은 잠재 고객의 마음을 여는 강력한 심리적 트리거(Psychological Trigger)가 됩니다. 따라서 이 글은 단순히 도움을 요청하는 것을 넘어, 고객의 긍정적 경험을 브랜드 자산(Brand Asset)으로 전환하려는 전략적인 소통 과정을 보여주고 있습니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입 및 감사<\/div><ul><li>로모스 투어의 매니저가 우수 고객에게 지속적인 신뢰에 대한 감사를 전함.<\/li><li>작성자: 로모스 투어 매니저 마크 스미스(Mark Smith)<\/li><li>고객의 충성도(loyalty)와 신뢰에 대한 진심 어린 감사 표현<\/li><li>핵심 키워드: 감사(appreciation)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02광고 캠페인 계획<\/div><ul><li>내년 홍보 활동의 일환으로 새로운 광고 제작 계획을 밝힘.<\/li><li>홍보 캠페인(promotional campaign)의 일환으로 광고 방영 예정<\/li><li>광고에 우수 고객(valued clients)의 실제 경험을 포함하고자 함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03협조 요청<\/div><ul><li>고객의 여행 경험을 광고 제작을 위한 후기로 공유해 줄 것을 정중히 요청함.<\/li><li>지난여름의 여행 경험(experiences)에 대한 소감 공유 부탁<\/li><li>고객의 피드백(feedback)은 서비스 홍보에 매우 귀중한 자산이 됨<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04향후 절차 및 마무리<\/div><ul><li>후속 연락을 예고하며 협조에 대해 미리 감사의 뜻을 전함.<\/li><li>담당 직원이 조만간 세부 사항을 위해 연락(be in touch)할 예정<\/li><li>고객의 기여(contributions)에 대해 사전에 감사를 표하며 마무리함<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">express<\/td><td class=\"m\">표현하다, 나타내다<\/td><\/tr><tr><td class=\"w\">sincere<\/td><td class=\"m\">진심 어린, 진실한<\/td><\/tr><tr><td class=\"w\">appreciation<\/td><td class=\"m\">감사, 감상<\/td><\/tr><tr><td class=\"w\">continue<\/td><td class=\"m\">계속하다, 계속되다<\/td><\/tr><tr><td class=\"w\">loyalty<\/td><td class=\"m\">충성, 의리<\/td><\/tr><tr><td class=\"w\">promotional<\/td><td class=\"m\">홍보의<\/td><\/tr><tr><td class=\"w\">advertisement<\/td><td class=\"m\">광고<\/td><\/tr><tr><td class=\"w\">include<\/td><td class=\"m\">포함하다<\/td><\/tr><tr><td class=\"w\">value<\/td><td class=\"m\">가치<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">client<\/td><td class=\"m\">고객, 의뢰인<\/td><\/tr><tr><td class=\"w\">last<\/td><td class=\"m\">마지막의, 지난<\/td><\/tr><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><tr><td class=\"w\">feedback<\/td><td class=\"m\">피드백, (의견) 반응<\/td><\/tr><tr><td class=\"w\">invaluable<\/td><td class=\"m\">아주 소중한, 매우 유용한, 매우 소중한<\/td><\/tr><tr><td class=\"w\">promote<\/td><td class=\"m\">촉진하다, 장려하다<\/td><\/tr><tr><td class=\"w\">in advance<\/td><td class=\"m\">미리, 사전에<\/td><\/tr><tr><td class=\"w\">contribution<\/td><td class=\"m\">기여, 이바지<\/td><\/tr><tr><td class=\"w\">regard<\/td><td class=\"m\">여기다, 간주하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Dear Mr. Kelly<\/span>,<\/b><\/span><span class=\"ko\">친애하는 Kelly 씨께,<\/span><\/div><\/div><div class=\"lec-sent-ko\">친애하는 Kelly 씨께,<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 비즈니스 편지의 전형적인 시작으로, 수신자를 명시하며 정중하게 대화를 시작하는 역할을 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Dear Mr. Kelly (관용표현): 편지나 이메일의 첫머리에서 수신인을 부르는 정중한 인사말이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 2 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>My name<\/b><\/span><span class=\"ko\">제 이름은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is Mark Smith,<\/b><\/span><span class=\"ko\">Mark Smith이며,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and<\/span> I<\/b><\/span><span class=\"ko\">그리고 저는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>am the manager of Lomos Tours.<\/b><\/span><span class=\"ko\">Lomos Tours의 매니저입니다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">제 이름은 Mark Smith이며, 저는 Lomos Tours의 매니저입니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글쓴이의 정체성과 소속을 밝혀 신뢰감을 형성하며, 여행사의 관리자로서 공식적인 업무를 위해 연락했음을 알립니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">and (등위접속사): 두 개의 독립적인 절(My name is... 와 I am the manager...)을 대등하게 연결하여 하나의 문장으로 만든다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I<\/b><\/span><span class=\"ko\">저는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>express our sincere appreciation<\/b><\/span><span class=\"ko\">우리의 진심 어린 감사를 표합니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for your <span class=\"grammar-hl\">continued trust and loyalty<\/span>.<\/b><\/span><span class=\"ko\">당신의 지속적인 신뢰와 충심에 대해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">저는 당신의 지속적인 신뢰와 충심에 우리의 진심 어린 감사를 표합니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 본론에 들어가기에 앞서 단골 고객에 대한 감사를 전하며 우호적인 분위기를 조성합니다. continued trust and loyalty는 Kelly 씨가 과거에도 여러 번 이 여행사를 이용했음을 시사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">continued trust and loyalty (과거분사(형용사)): continued가 뒤에 오는 명사구 trust and loyalty를 수식하며 &#39;지속되는/지속적인&#39;이라는 상태를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">express<\/td><td class=\"m\">표현하다, 나타내다<\/td><\/tr><tr><td class=\"w\">sincere<\/td><td class=\"m\">진심 어린, 진실한<\/td><\/tr><tr><td class=\"w\">appreciation<\/td><td class=\"m\">감사, 감상<\/td><\/tr><tr><td class=\"w\">continue<\/td><td class=\"m\">계속하다, 계속되다<\/td><\/tr><tr><td class=\"w\">loyalty<\/td><td class=\"m\">충성, 의리<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Next year,<\/b><\/span><span class=\"ko\">내년에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as part of a new promotional campaign,<\/b><\/span><span class=\"ko\">새로운 홍보 캠페인의 일환으로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Lomos Tours<\/b><\/span><span class=\"ko\">Lomos Tours는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">will be airing<\/span> an advertisement.<\/b><\/span><span class=\"ko\">광고를 방영할 것입니다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">내년에, 새로운 홍보 캠페인의 일환으로, Lomos Tours는 광고를 방영하려고 합니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 감사를 전한 후, 이번 편지를 보낸 구체적인 배경인 &#39;내년 광고 제작 계획&#39;을 소개하며 자연스럽게 화제를 전환합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">will be airing (현재진행(미래진행)): will be + -ing 형태로 미래의 어느 시점에 진행 중일 동작을 나타낸다. 이 구조에서 airing은 현재분사나 동명사로 개별 분석하지 않고 시제의 일부로 본다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">promotional<\/td><td class=\"m\">홍보의<\/td><\/tr><tr><td class=\"w\">advertisement<\/td><td class=\"m\">광고<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We<\/b><\/span><span class=\"ko\">우리는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>plan <span class=\"grammar-hl\">to include<\/span><\/b><\/span><span class=\"ko\">포함할 계획입니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the experiences<\/b><\/span><span class=\"ko\">경험들을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of some of our most <span class=\"grammar-hl\">valued clients<\/span>.<\/b><\/span><span class=\"ko\">우리의 가장 소중한 몇몇 고객님들의.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리는 우리의 가장 소중한 몇몇 고객님들의 경험을 담을 계획입니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 광고를 단순히 정보 전달용으로 만드는 것이 아니라, 실제 고객의 생생한 목소리를 담겠다는 구체적인 콘텐츠 방향을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to include (to부정사(명사적)): 타동사 plan의 목적어 자리에 쓰여 &#39;~하는 것을 (계획하다)&#39;라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">valued clients (과거분사(형용사)): valued가 명사 clients를 수식하며 &#39;소중히 여겨지는/소중한&#39;이라는 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">include<\/td><td class=\"m\">포함하다<\/td><\/tr><tr><td class=\"w\">value<\/td><td class=\"m\">가치<\/td><\/tr><tr><td class=\"w\">client<\/td><td class=\"m\">고객, 의뢰인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Since you traveled with us<\/b><\/span><span class=\"ko\">당신은 우리와 함께 여행하셨기에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>last summer,<\/b><\/span><span class=\"ko\">지난여름에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I<\/b><\/span><span class=\"ko\">저는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>would like <span class=\"grammar-hl\">to kindly ask<\/span><\/b><\/span><span class=\"ko\">정중히 부탁드리고 싶습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">if you would be willing to share<\/span><\/b><\/span><span class=\"ko\">당신이 기꺼이 공유해 주실 수 있는지<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a few words about your experience.<\/b><\/span><span class=\"ko\">당신의 경험에 대한 몇 마디 말씀을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신은 지난여름에 우리와 함께 여행하셨기에, 저는 당신의 경험에 대해 몇 마디 말씀을 기꺼이 공유해 주실 수 있는지 정중히 부탁드리고 싶습니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 계획에 따라 Kelly 씨가 광고에 참여해 주길 바라는 이 편지의 핵심 용건을 제시합니다. share a few words는 고객이 부담을 느끼지 않도록 솔직하고 짧은 소감을 말해달라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to kindly ask (to부정사(명사적)): would like의 목적어 자리에 쓰여 &#39;~하고 싶다&#39;라는 의도를 나타낸다. in order to로 대체할 수 없으므로 명사적 용법에 해당한다.<\/div><div class=\"lec-gr-item\">if you would be willing to share (간접의문문): 타동사 ask의 목적어 역할을 하는 명사절로, &#39;접속사(if) + 주어(you) + 동사(would be)&#39;의 어순을 갖춘다. 여기서 if는 &#39;~인지 아닌지&#39;를 뜻하는 whether와 의미가 같다.<\/div><div class=\"lec-gr-item\">to share to부정사(부사적/형용사 수식): 형용사 willing 바로 뒤에서 이를 수식하며 &#39;공유할 (기꺼이 하는)&#39; 정도의 의미를 더한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">last<\/td><td class=\"m\">마지막의, 지난<\/td><\/tr><tr><td class=\"w\">share<\/td><td class=\"m\">공유하다, 나누다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Your feedback<\/b><\/span><span class=\"ko\">당신의 피드백은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>would be invaluable<\/b><\/span><span class=\"ko\">매우 소중할 것입니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in <span class=\"grammar-hl\">helping<\/span> us promote our services.<\/b><\/span><span class=\"ko\">우리가 서비스를 홍보하는 것을 돕는 데 있어.<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신의 피드백은 우리가 서비스를 홍보하는 것을 도와주는 데 매우 소중할 것입니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 고객의 참여가 회사에 얼마나 큰 도움이 되는지 강조하며 참여 동기를 부여합니다. invaluable은 실제 고객의 한마디가 광고의 신뢰도를 높이는 데 결정적인 역할을 한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">helping (동명사): 전치사 in의 목적어 역할을 하는 명사적 성격의 어구로, &#39;돕는 것&#39;이라는 행위 자체를 나타낸다.<\/div><div class=\"lec-gr-item\">help us promote 5형식(SVOC) 구조: 준사역동사 help가 목적어 us와 목적격보어 promote(동사원형)를 취한 구조다. 목적어와 목적격보어는 &#39;우리가 홍보하다&#39;라는 주술 관계를 형성한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">feedback<\/td><td class=\"m\">피드백, (의견) 반응<\/td><\/tr><tr><td class=\"w\">invaluable<\/td><td class=\"m\">아주 소중한, 매우 유용한, 매우 소중한<\/td><\/tr><tr><td class=\"w\">promote<\/td><td class=\"m\">촉진하다, 장려하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>A member of our team<\/b><\/span><span class=\"ko\">우리 팀의 한 직원이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">will be in touch with<\/span> you<\/b><\/span><span class=\"ko\">당신과 연락이 닿을 것입니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>shortly.<\/b><\/span><span class=\"ko\">곧.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리 팀의 직원 한 명이 곧 연락드릴 것입니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 요청을 수락할 경우를 대비하여 이후 진행 과정을 안내합니다. be in touch with you shortly는 광고 촬영이나 인터뷰에 필요한 구체적인 절차를 협의하겠다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">will be in touch with (관용표현): &#39;~와 연락할 것이다&#39;라는 의미로, be in touch with(~와 연락하다)라는 굳어진 어구를 사용하여 미래의 동작을 표현한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 9 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Thank you<\/b><\/span><span class=\"ko\">감사드립니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">in advance<\/span><\/b><\/span><span class=\"ko\">미리<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for your contributions.<\/b><\/span><span class=\"ko\">당신의 기여에 대해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">당신의 기여에 미리 감사드립니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 고객이 제안을 긍정적으로 받아들여 줄 것을 기대하며 예의 바르게 마무리하는 인사입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">in advance (관용표현): &#39;미리/사전에&#39;라는 의미로 쓰여 동작의 시점을 수식하는 부사구다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in advance<\/td><td class=\"m\">미리, 사전에<\/td><\/tr><tr><td class=\"w\">contribution<\/td><td class=\"m\">기여, 이바지<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Warm regards<\/span>,<\/b><\/span><span class=\"ko\">따뜻한 안부를 전하며,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Mark Smith<\/b><\/span><span class=\"ko\">Mark Smith<\/span><\/div><\/div><div class=\"lec-sent-ko\">따뜻한 안부를 전하며, Mark Smith<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 편지를 마무리하는 정중한 결어와 함께 보낸 사람의 이름을 명시하여 끝맺습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Warm regards (관용표현): 편지나 이메일 끝부분에서 서명 전에 사용하는 정중한 맺음말이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">regard<\/td><td class=\"m\">여기다, 간주하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>Lomos Tours의 매니저가 단골 고객인 Kelly 씨에게 감사를 전하며 연락했습니다.<\/li><li>회사는 내년에 고객의 실제 경험을 담은 새로운 홍보 광고를 제작할 예정입니다.<\/li><li>지난여름 여행을 함께한 Kelly 씨에게 광고에 활용할 소감을 공유해 달라고 정중히 요청했습니다.<\/li><li>고객의 피드백이 홍보에 큰 도움이 될 것임을 강조하며 실무진의 후속 연락을 예고했습니다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Mark Smith requests Mr. Kelly to share his travel experience in order to utilize it for an upcoming promotional advertisement.<\/div>\n              <div class=\"lec-final-sum-ko\">Mark Smith는 새로운 홍보 광고에 활용하기 위하여 Mr. Kelly에게 그의 여행 경험을 공유해 달라고 요청한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_18번_강의_audio/18.mp3","hl":"main"},{"audi motional campaign)의 일환으로 광고 방영 예정","광고에 우수 고객(valued clients)의 실제 경험을 포함하고자 함"]},{"label":"03협조 요청","items":["고객의 여행 경험을 광고 제작을 위한 후기로 공유해 줄 것을 정중히 요청함.","지난여름의 여행 경험(experiences)에 대한 소감 공유 부탁","고객의 피드백(feedback)은 서비스 홍보에 매우 귀중한 자산이 됨"]},{"label":"04향후 절차 및 마무리","items":["후속 연락을 예고하며 협조에 대해 미리 감사의 뜻을 전함.","담당 직원이 조만간 세부 사항을 위해 연락(be in touch)할 예정","고객의 기여(contributions)에 대해 사전에 감사를 표하며 마무리함"]}],"bkg":"우리가 식당을 고를 때 리뷰를 먼저 확인하는 것처럼, 사람들은 기업의 광고보다 실제 사용자의 경험을 더 신뢰하는 경향이 있는데 이를 심리학적으로 사회적 증거(Social Proof)라고 부릅니다. 이 편지는 실제 이용자의 생생한 목소리를 빌려 브랜드의 신뢰도를 높이려는 고객 추천 마케팅(Testimonial Marketing)의 전형적인 사례로, 기업은 평소 고객 관계 관리(Customer Relationship Management)를 통해 우호적인 관계를 맺은 고객을 홍보에 참여시키곤 해요. 마치 친한 친구의 추천이 화려한 전광판 광고보다 더 믿음직스럽게 느껴지는 것처럼, 만족한 고객의 피드백은 잠재 고객의 마음을 여는 강력한 심리적 트리거(Psychological Trigger)가 됩니다. 따라서 이 글은 단순히 도움을 요청하는 것을 넘어, 고객의 긍정적 경험을 브랜드 자산(Brand Asset)으로 전환하려는 전략적인 소통 과정을 보여주고 있습니다.","ttsText":"우리가 식당을 고를 때 리뷰를 먼저 확인하는 것처럼, 사람들은 기업의 광고보다 실제 사용자의 경험을 더 신뢰하는 경향이 있는데 이를 심리학적으로 사회적 증거(Social Proof)라고 부릅니다. 이 편지는 실제 이용자의 생생한 목소리를 빌려 브랜드의 신뢰도를 높이려는 고객 추천 마케팅(Testimonial Marketing)의 전형적인 사례로, 기업은 평소 고객 관계 관리(Customer Relationship Management)를 통해 우호적인 관계를 맺은 고객을 홍보에 참여시키곤 해요. 마치 친한 친구의 추천이 화려한 전광판 광고보다 더 믿음직스럽게 느껴지는 것처럼, 만족한 고객의 피드백은 잠재 고객의 마음을 여는 강력한 심리적 트리거(Psychological Trigger)가 됩니다. 따라서 이 글은 단순히 도움을 요청하는 것을 넘어, 고객의 긍정적 경험을 브랜드 자산(Brand Asset)으로 전환하려는 전략적인 소통 과정을 보여주고 있습니다.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 18번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 18번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고1 / 2025년 / 10월 / 18번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고1 / 2025년 / 10월 / 18번","titleEn":"A Request for Sharing Your Travel Experience for a New Ad Campaign","titleKo":"새로운 광고 캠페인을 위한 여행 경험 공유 요청","imageUrl":"__enpImg__","stages":[{"label":"01도입 및 감사","items":["로모스 투어의 매니저가 우수 고객에게 지속적인 신뢰에 대한 감사를 전함.","작성자: 로모스 투어 매니저 마크 스미스(Mark Smith)","고객의 충성도(loyalty)와 신뢰에 대한 진심 어린 감사 표현","핵심 키워드: 감사(appreciation)"]},{"label":"
