6dfy7+nel44/T/PegA4H4n9Sf8A9X0pabvUDO4EEnGPbr35x3NLuHqOuOvr/k/l9cAC0U0OpzyMDvkc4649h3NLuHqBzjkjrnH69qADHfv64/z0oJHf+Xp/nr09+lGRnqO/f069+xIzxx37YQMp5BHI9u3/AOv/AAoAXk49Op759h7epx6Y70Dkc8f54/SgMDnnp1//AF9OvFNLqByQBkgYPpn6Y6Uf1/VwH0f5/wA803evByOuB9eR060u4DHI/Mfh1PPrQAtFJkDqR+YpNwyfbvxj8Of/ANXej+vvt+X+Yfn/AFf9B1NblT34PbPt04/w70Z+hznHOefy9z3xgY4zSHCoxXnCsR3zgdPfp3yT3NAeXX+v8z//2Q==\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">More Than Meets the Tongue: The Multisensory World of Eating<small>미각 그 이상: 식사의 다감각적 세계<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">우리가 일상에서 당연하게 여기는 감각 정보들은 사실 뇌에서 아주 복잡하게 섞이는 과정을 거치는데, 이를 다감각 통합(Multisensory Integration)이라고 불러요. 예를 들어 음식을 먹을 때 우리 뇌는 단순히 혀의 미각뿐만 아니라 코의 후각, 눈의 시각, 심지어 음식을 씹는 소리와 같은 청각 정보까지 한꺼번에 처리하여 교차 모드 지각(Crossmodal Perception)을 형성하게 됩니다. 실제로 옥스퍼드 대학의 찰스 스펜스 교수는 이를 가스트로피직스(Gastrophysics)라는 학문으로 정립하며, 빨간색 그릇에 담긴 음식이 더 달콤하게 느껴지는 현상처럼 여러 감각의 상호작용이 우리의 인식적 경험(Perceptual Experience)을 어떻게 풍성하게 만드는지 증명해냈죠. 마치 오케스트라의 여러 악기가 모여 하나의 조화로운 화음을 만들듯, 우리의 뇌는 각기 다른 감각적 단서(Sensory Cues)들을 정교하게 조합해 우리 앞에 놓인 대상에 대한 통합된 실체를 만들어내는 것이랍니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01다감각 경험의 일상성<\/div><ul><li>우리는 일상에서 여러 감각을 동시에 사용하며 살아가지만 이를 당연하게 여기는 경향이 있다.<\/li><li>감각이 정상적으로 작동할 때 그 중요성을 간과함<\/li><li>안경(glasses)과 같은 보조 도구로 감각을 교정하여 평범하게 수용함<\/li><li>핵심 키워드: 다감각 경험(multisensory experiences)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02평범한 일상의 재발견<\/div><ul><li>가장 평범한 경험일지라도 자세히 들여다보면 놀라운 다감각적 세계가 숨어 있음을 알 수 있다.<\/li><li>면밀한 관찰(closer inspection)의 필요성<\/li><li>일상적인 경험(ordinary experiences) 속에 담긴 감각의 복합성<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03식사 경험의 감각적 융합<\/div><ul><li>식사는 단순히 배를 채우는 행위를 넘어 다양한 감각이 결합된 대표적인 사례이다.<\/li><li>시각(eyes)을 통해 음식을 처음으로 인지함<\/li><li>식사 경험에 영향을 미치는 수많은 감각 신호(sensory signals)<\/li><li>핵심 키워드: 감각의 융합(fusion of the senses)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04촉각과 후각의 개입<\/div><ul><li>음식의 물리적 성질과 화학적 자극이 식사의 즐거움과 경험을 구성한다.<\/li><li>음식의 질감(food textures)이 주는 촉각적 자극<\/li><li>맛(tastes)과 냄새(smells)의 복합적인 상호작용<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05청각의 영향력과 완성<\/div><ul><li>음식을 먹는 주변 환경의 소리와 먹는 과정에서의 소리 또한 식사 경험을 완성한다.<\/li><li>식사 공간의 분위기(atmospheres)에서 발생하는 소리<\/li><li>음식을 씹는 소리(chewing)나 식기(tools) 사용 소리의 영향력<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grant<\/td><td class=\"m\">(take ~ for granted) 당연하게 여기다<\/td><\/tr><tr><td class=\"w\">especially<\/td><td class=\"m\">특히<\/td><\/tr><tr><td class=\"w\">function<\/td><td class=\"m\">기능, 작용<\/td><\/tr><tr><td class=\"w\">normally<\/td><td class=\"m\">보통, 평소에는<\/td><\/tr><tr><td class=\"w\">correct<\/td><td class=\"m\">바로잡다, 정정하다<\/td><\/tr><tr><td class=\"w\">aid<\/td><td class=\"m\">도움, 지원<\/td><\/tr><tr><td class=\"w\">atmosphere<\/td><td class=\"m\">대기<\/td><\/tr><tr><td class=\"w\">interaction<\/td><td class=\"m\">상호작용<\/td><\/tr><tr><td class=\"w\">influence<\/td><td class=\"m\">영향을 미치다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">inspection<\/td><td class=\"m\">점검, 조사<\/td><\/tr><tr><td class=\"w\">reveal<\/td><td class=\"m\">드러내다, 밝히다<\/td><\/tr><tr><td class=\"w\">remarkable<\/td><td class=\"m\">놀랄 만한, 대단한<\/td><\/tr><tr><td class=\"w\">consider<\/td><td class=\"m\">고려하다, 여기다<\/td><\/tr><tr><td class=\"w\">regular<\/td><td class=\"m\">규칙적인, 정기적인<\/td><\/tr><tr><td class=\"w\">fusion<\/td><td class=\"m\">융합, 결합, 용해<\/td><\/tr><tr><td class=\"w\">expose<\/td><td class=\"m\">노출시키다, 드러내다<\/td><\/tr><tr><td class=\"w\">countless<\/td><td class=\"m\">셀 수 없이 많은<\/td><\/tr><tr><td class=\"w\">sensory<\/td><td class=\"m\">감각의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Multisensory experiences<\/b><\/span><span class=\"ko\">다중 감각 경험은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are a central part<\/b><\/span><span class=\"ko\">주요한 부분이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of our everyday lives,<\/b><\/span><span class=\"ko\">우리 일상생활의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>yet we often <span class=\"grammar-hl\">take them for granted<\/span>,<\/b><\/span><span class=\"ko\">하지만 우리는 종종 그것들을 당연하게 여긴다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>especially when our senses function normally<\/b><\/span><span class=\"ko\">특히 우리의 감각이 정상적으로 작동할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or <span class=\"grammar-hl\">are corrected<\/span> to normal<\/b><\/span><span class=\"ko\">혹은 정상으로 교정될 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with aids like glasses.<\/b><\/span><span class=\"ko\">안경과 같은 보조 도구로<\/span><\/div><\/div><div class=\"lec-sent-ko\">다중 감각 경험은 우리 일상생활의 주요한 부분이지만, 우리는 특히 감각이 정상적으로 작동하거나 안경과 같은 보조 도구로 정상으로 교정될 때 그것들을 종종 당연하게 여긴다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로, 우리가 인식하지 못할 뿐 일상의 모든 순간이 여러 감각의 결합으로 이루어져 있음을 시사합니다. take them for granted는 감각이 문제없이 작동하는 상태가 너무 익숙해서 그 복합적인 과정의 소중함이나 복잡성을 깊이 생각하지 않고 넘어간다는 의미입니다. corrected to normal은 시력이 나빠도 안경을 쓰면 일상에 지장이 없듯, 기술적 도움을 통해 감각이 보완될 때조차 우리는 감각의 통합 과정을 무심히 지나친다는 점을 짚어줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">take them for granted (관용표현): &#39;take A for granted&#39;는 &#39;A를 당연하게 여기다&#39;라는 의미의 굳어진 표현이다.<\/div><div class=\"lec-gr-item\">are corrected (수동태): be동사(are)+p.p.(corrected) 구조. correct는 타동사인데 뒤에 목적어가 없어서 수동구조 are corrected 형태로 쓴다. 기본구조: V + O + to + B (O를 B로 교정/수정하다)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grant<\/td><td class=\"m\">(take ~ for granted) 당연하게 여기다<\/td><\/tr><tr><td class=\"w\">especially<\/td><td class=\"m\">특히<\/td><\/tr><tr><td class=\"w\">function<\/td><td class=\"m\">기능, 작용<\/td><\/tr><tr><td class=\"w\">normally<\/td><td class=\"m\">보통, 평소에는<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">correct<\/td><td class=\"m\">바로잡다, 정정하다<\/td><\/tr><tr><td class=\"w\">aid<\/td><td class=\"m\">도움, 지원<\/td><\/tr><tr><td class=\"w\">sensory<\/td><td class=\"m\">감각의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>However,<\/b><\/span><span class=\"ko\">그러나<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>closer inspection to any, even the most ordinary experiences,<\/b><\/span><span class=\"ko\">어떤, 심지어 가장 평범한 경험조차 더 자세히 살펴보는 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>reveals the remarkable multisensory world<\/b><\/span><span class=\"ko\">놀라운 다중 감각 세계를 보여 준다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">in which<\/span> we live.<\/b><\/span><span class=\"ko\">우리가 살고 있는<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러나 어떤, 심지어는 가장 평범한 경험조차 더 자세히 살펴보는 것은 우리가 살고 있는 놀라운 다중 감각 세계를 보여 준다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 &#39;당연하게 여기는 태도&#39;에 반전을 주는 문장입니다. closer inspection은 익숙한 일상을 분석적인 시각으로 관찰하라는 제안이며, 이를 통해 우리가 단일 감각이 아닌 remarkable multisensory world, 즉 여러 감각이 얽히고설킨 정교한 세계 속에 살고 있음을 깨닫게 된다고 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">in which (전치사+관계대명사): 전치사(in) + 관계대명사(which) + S + V 구조이다. 관계대명사 뒤에는 주어(we)와 동사(live)가 갖춰진 완전한 절(완전문장)이 오며, 선행사 world를 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">inspection<\/td><td class=\"m\">점검, 조사<\/td><\/tr><tr><td class=\"w\">reveal<\/td><td class=\"m\">드러내다, 밝히다<\/td><\/tr><tr><td class=\"w\">remarkable<\/td><td class=\"m\">놀랄 만한, 대단한<\/td><\/tr><tr><td class=\"w\">sensory<\/td><td class=\"m\">감각의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Consider<\/b><\/span><span class=\"ko\">생각해 봐라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the experience<\/b><\/span><span class=\"ko\">경험을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of <span class=\"grammar-hl\">eating<\/span> a regular meal.<\/b><\/span><span class=\"ko\">일상의 식사를 하는<\/span><\/div><\/div><div class=\"lec-sent-ko\">일상의 식사를 하는 경험을 생각해 봐라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 말한 &#39;놀라운 다중 감각의 세계&#39;를 증명하기 위해 가장 흔하고 평범한 일상인 &#39;식사&#39;를 구체적인 예시로 제시합니다. Consider the experience는 추상적인 설명을 누구나 겪는 구체적인 상황으로 끌어내어 독자의 이해를 돕는 역할을 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">eating (동명사): 전치사 of의 목적어 역할을 하는 명사적 성격으로 쓰였으며, &#39;식사하는 것&#39;이라는 행위의 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consider<\/td><td class=\"m\">고려하다, 여기다<\/td><\/tr><tr><td class=\"w\">regular<\/td><td class=\"m\">규칙적인, 정기적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>At first,<\/b><\/span><span class=\"ko\">처음에는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it may <span class=\"grammar-hl\">seem like<\/span> an ordinary experience,<\/b><\/span><span class=\"ko\">그것이 평범한 경험처럼 보일 수 있지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but it is actually a fusion<\/b><\/span><span class=\"ko\">실제로 그것은 융합이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of the senses.<\/b><\/span><span class=\"ko\">감각들의<\/span><\/div><\/div><div class=\"lec-sent-ko\">처음에는, 그것이 평범한 경험처럼 보일 수 있지만, 실제로 그것은 감각들의 융합이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 예시로 든 식사 행위의 본질을 정의합니다. ordinary experience로 보였던 단순한 끼니 해결이 실제로는 fusion of the senses, 즉 시각, 미각, 후각 등이 하나로 녹아들어 일어나는 복잡한 화학 반응과도 같다는 점을 강조하며 주제를 심화합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">seem like 연결동사 구문: seem 뒤에 전치사 like와 명사구가 결합하여 &#39;~처럼 보이다&#39;라는 주어의 상태나 인상을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fusion<\/td><td class=\"m\">융합, 결합, 용해<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We first eat<\/b><\/span><span class=\"ko\">우리는 처음에는 식사한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with our eyes,<\/b><\/span><span class=\"ko\">눈으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but we <span class=\"grammar-hl\">are also exposed<\/span><\/b><\/span><span class=\"ko\">하지만 우리는 또한 노출된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to countless sensory signals<\/b><\/span><span class=\"ko\">수많은 감각 신호에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that influence<\/span> our <span class=\"grammar-hl\">eating experience<\/span><\/b><\/span><span class=\"ko\">우리의 식사 경험에 영향을 미치는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>such as food textures, tastes, and smells.<\/b><\/span><span class=\"ko\">음식의 질감, 맛, 냄새와 같이<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리는 처음에는 눈으로 식사하지만, 또한 음식의 질감, 맛, 냄새와 같이 우리의 식사 경험에 영향을 미치는 수많은 감각 신호에도 노출된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 식사 중에 일어나는 감각의 융합을 구체적으로 나열합니다. eat with our eyes는 음식을 입에 넣기 전 시각적 정보가 식욕과 기대를 결정하는 첫 번째 단계임을 뜻합니다. 뒤이어 sensory signals인 질감과 냄새 등이 입안에서의 맛과 결합하여 전체적인 &#39;식사 경험&#39;을 형성하는 과정을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are also exposed (수동태): be동사(are)+p.p.(exposed) 구조. expose는 타동사인데 뒤에 목적어가 없어서 수동구조 are exposed 형태로 쓴다. 기본구조: V + O + to + B (O를 B에 노출시키다)<\/div><div class=\"lec-gr-item\">that influence (관계대명사): 주격 관계대명사로, 선행사 sensory signals를 수식하며 뒤에 동사 influence가 바로 이어지는 불완전한 절을 이끈다.<\/div><div class=\"lec-gr-item\">eating experience (동명사(명사적)): eating이 &#39;식사(하기)&#39;라는 행위/용도의 개념으로 뒤의 명사 experience를 꾸며 &#39;식사 경험&#39;이라는 의미를 형성한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">influence<\/td><td class=\"m\">영향을 미치다<\/td><\/tr><tr><td class=\"w\">expose<\/td><td class=\"m\">노출시키다, 드러내다<\/td><\/tr><tr><td class=\"w\">countless<\/td><td class=\"m\">셀 수 없이 많은<\/td><\/tr><tr><td class=\"w\">sensory<\/td><td class=\"m\">감각의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>And it <span class=\"grammar-hl\">does not stop<\/span><\/b><\/span><span class=\"ko\">그리고 그것은 멈추지 않는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>there.<\/b><\/span><span class=\"ko\">거기서<\/span><\/div><\/div><div class=\"lec-sent-ko\">그리고 그것은 거기서 멈추지 않는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 언급한 시각, 미각, 후각 외에 또 다른 감각적 요소가 있음을 예고하며 독자의 주의를 집중시킵니다. does not stop there는 식사의 다중 감각적 측면이 우리가 흔히 생각하는 범위를 넘어 더 확장된다는 점을 알리는 연결 고리입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">does not stop 일반동사 부정: 현재 시제에서 일반동사 stop을 부정하기 위해 조동사 does not을 사용하고 뒤에 동사원형을 쓴 구조이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Even the sounds<\/b><\/span><span class=\"ko\">심지어 소리들도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that come<\/span> both from the atmospheres <span class=\"grammar-hl\">in which<\/span> we eat<\/b><\/span><span class=\"ko\">우리가 식사하는 상황 둘 다에서 나오는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and our interactions with the food (such as chewing)<\/b><\/span><span class=\"ko\">그리고 음식과의 상호 작용(씹기와 같은)<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and the <span class=\"grammar-hl\">tools<\/span><\/b><\/span><span class=\"ko\">그리고 도구들과의 (상호 작용에서 나오는)<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">we use<\/span> <span class=\"grammar-hl\">to eat<\/span><\/b><\/span><span class=\"ko\">우리가 식사에 사용하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>influence our <span class=\"grammar-hl\">eating experience<\/span>.<\/b><\/span><span class=\"ko\">우리의 식사 경험에 영향을 미친다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">심지어 우리가 식사하는 상황과, 음식(씹기)이나 우리가 식사에 사용하는 도구와의 상호 작용 둘 다에서 나오는 소리들도 우리의 식사 경험에 영향을 미친다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 식사 경험의 마지막 퍼즐 조각으로 청각적 요소를 제시하며 글을 마무리합니다. atmospheres는 식당의 배경 음악이나 소음을, interactions with the food는 음식을 씹을 때 나는 소리를 의미하며, tools we use to eat은 포크와 접시가 부딪히는 소리까지도 식사의 즐거움이나 질을 결정하는 중요한 감각적 요소라는 점을 밝힙니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that come (관계대명사): 주격 관계대명사로, 선행사 the sounds를 수식하며 관계대명사절 내에서 주어 역할을 수행한다.<\/div><div class=\"lec-gr-item\">in which (전치사+관계대명사): 전치사(in) + 관계대명사(which) + S + V 구조이다. 관계대명사 뒤에는 주어(we)와 동사(eat)가 갖춰진 완전한 절(완전문장)이 오며, 선행사 atmospheres를 수식한다.<\/div><div class=\"lec-gr-item\">tools we use (관계대명사): 선행사 tools 뒤에 목적격 관계대명사(which/that)가 생략된 구조이다. use의 목적어가 빠진 관계대명사절이 명사를 수식한다.<\/div><div class=\"lec-gr-item\">to eat (to부정사(부사적): 목적): &#39;먹기 위해서&#39;라는 의미로 동사 use를 수식하며, in order to eat으로 바꾸어도 뜻이 같으므로 부사적 용법이다.<\/div><div class=\"lec-gr-item\">eating experience (동명사(명사적)): eating이 &#39;식사(하기)&#39;라는 행위의 개념으로 명사 experience를 꾸며 &#39;식사 경험&#39;이라는 복합 명사적 의미를 만든다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">atmosphere<\/td><td class=\"m\">대기<\/td><\/tr><tr><td class=\"w\">interaction<\/td><td class=\"m\">상호작용<\/td><\/tr><tr><td class=\"w\">influence<\/td><td class=\"m\">영향을 미치다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>일상은 여러 감각이 합쳐진 경험이지만, 우리는 이를 너무 당연하게 여긴다.<\/li><li>하지만 평범한 일도 자세히 관찰하면 놀라운 감각의 통합 세계를 발견할 수 있다.<\/li><li>대표적인 예인 식사는 단순한 맛의 경험이 아니라 시각, 질감, 냄새가 어우러진 결과다.<\/li><li>심지어 주변의 소음, 씹는 소리, 식기 부딪히는 소리 같은 청각 요소까지 식사 경험에 포함된다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">While people often take everyday activities for granted, ordinary experiences like eating are actually intricate fusions of multiple sensory signals.<\/div>\n              <div class=\"lec-final-sum-ko\">사람들이 흔히 일상 활동을 당연하게 여기지만, 식사와 같은 평범한 경험은 사실 여러 감각 신호가 복잡하게 융합된 결과이다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/8.mp3","hl":"stage-4"}],[{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/9.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/10.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/11.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/12.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/13.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/14.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/15.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/16.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/17.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/18.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/19.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/20.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/21.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/22.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/23.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/24.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/25.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/26.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/27.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/28.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/29.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/30.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_36번_강의_audio/31.mp3","hl":null}]],"fileName":"모의고사_고1_2025년_10월_36번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 10월 / 36번","titleEn":"More Than Meets the Tongue: The Multisensory World of Eating","titleKo":"미각 그 이상: 식사의 다감각적 세계","imageUrl":"__enpImg__","stages":[{"label":"01다감각 경험의 일상성","items":["우리는 일상에서 여러 감각을 동시에 사용하며 살아가지만 이를 당연하게 여기는 경향이 있다.","감각이 정상적으로 작동할 때 그 중요성을 간과함","안경(glasses)과 같은 보조 도구로 감각을 교정하여 평범하게 수용함","핵심 키워드: 다감각 경험(multisensory experiences)"]},{"label":"02평범한 일상의 재발견","items":["가장 평범한 경험일지라도 자세히 들여다보면 놀라운 다감각적 세계가 숨어 있음을 알 수 있다.","면밀한 관찰(closer inspection)의 필요성","일상적인 경험(ordinary experiences) 속에 담긴 감각의 복합성"]},{"label":"03식사 경험의 감각적 융합","items":["식사는 단순히 배를 채우는 행위를 넘어 다양한 감각이 결합된 대표적인 사례이다.","시각(eyes)을 통해 음식을 처음으로 인지함","식사 경험에 영향을 미치는 수많은 감각 신호(sensory signals)","핵심 키워드: 감각의 융합(fusion of the senses)"]},{"label":"04촉각과 후각의 개입","items":["음식의 물리적 성질과 화학적 자극이 식사의 즐거움과 경험을 구성한다.","음식의 질감(food textures)이 주는 촉각적 자극","맛(tastes)과 냄새(smells)의 복합적인 상호작용"]},{"label":"05청각의 영향력과 완성","items":["음식을 먹는 주변 환경의 소리와 먹는 과정에서의 소리 또한 식사 경험을 완성한다.","식사 공간의 분위기(atmospheres)에서 발생하는 소리","음식을 씹는 소리(chewing)나 식기(tools) 사용 소리의 영향력"]}],"bkg":"우리가 일상에서 당연하게 여기는 감각 정보들은 사실 뇌에서 아주 복잡하게 섞이는 과정을 거치는데, 이를 다감각 통합(Multisensory Integration)이라고 불러요. 예를 들어 음식을 먹을 때 우리 뇌는 단순히 혀의 미각뿐만 아니라 코의 후각, 눈의 시각, 심지어 음식을 씹는 소리와 같은 청각 정보까지 한꺼번에 처리하여 교차 모드 지각(Crossmodal Perception)을 형성하게 됩니다. 실제로 옥스퍼드 대학의 찰스 스펜스 교수는 이를 가스트로피직스(Gastrophysics)라는 학문으로 정립하며, 빨간색 그릇에 담긴 음식이 더 달콤하게 느껴지는 현상처럼 여러 감각의 상호작용이 우리의 인식적 경험(Perceptual Experience)을 어떻게 풍성하게 만드는지 증명해냈죠. 마치 오케스트라의 여러 악기가 모여 하나의 조화로운 화음을 만들듯, 우리의 뇌는 각기 다른 감각적 단서(Sensory Cues)들을 정교하게 조합해 우리 앞에 놓인 대상에 대한 통합된 실체를 만들어내는 것이랍니다.","ttsText":"우리가 일상에서 당연하게 여기는 감각 정보들은 사실 뇌에서 아주 복잡하게 섞이는 과정을 거치는데, 이를 다감각 통합(Multisensory Integration)이라고 불러요. 예를 들어 음식을 먹을 때 우리 뇌는
