ilyPUd+/PH+T9KAFo/z/n/PamggjIIJPTnr9cd8dQPpRvAAyRnpx3PHQ9Mcjv39aAF9f8n8fzH4cmlpgdSSAR37+mM++RnnjilLqDjI/Mfhjnkn0/8ArZP6/wCCA7/P+f8AI79aP8/5/wA8UgIPQg5zjBBzjr+XejuefoPSkmmroBaQ+h/ED34/L3o3L3I7jk+nX8u9GV65H5jtz+n6fjRfv2v924B/L14x/n8uDR7/AP1/5Zz/AJxSbhjI55x1HODg457e+KQuB3HTPUDrn/D/ACcAsB9Ic446/wCff+tGRxgg5OOD6dfy/nQGX1H4n/HmldWv0AWj/J/L/wDV6+lISB1I/wA+nrS0wCj+h9P89uM0fj6/5/CmlgFZuwBPr0z6dv6UB/Xkf//Z\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">The Fine-Tuned Universe: How Precise Physical Laws Enabled Life<small>미세하게 조정된 우주: 정밀한 물리 법칙이 어떻게 생명체를 가능하게 했는가<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">이 지문은 우주의 물리 법칙들이 생명체가 탄생하기에 더할 나위 없이 정교하게 맞춰져 있다는 우주의 미세 조정(Fine-tuning of the Universe) 이론을 배경으로 하고 있습니다. 마치 라디오 주파수를 아주 미세하게만 틀어도 소리가 들리지 않는 것처럼, 중력(Gravity)이나 전자기력 같은 물리 상수(Physical Constants)가 현재 값에서 아주 조금만 벗어났더라도 별이나 행성, 그리고 우리 몸을 구성하는 유기 화학(Organic Chemistry) 반응 자체가 불가능했을 것이라는 개념이죠. 과학계에서는 이처럼 우주가 인간이 관찰할 수 있는 조건에 딱 맞게 형성되어 있다는 원리를 인류 원리(Anthropic Principle)라고 부르기도 합니다. 결국 우리가 존재할 수 있는 이유는 우주가 특별히 우리를 위해 설계되어서가 아니라, 오직 극도로 정교한 물리적 균형이 유지되는 조건에서만 생명체라는 복잡한 시스템이 진화할 수 있었기 때문입니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01물리 법칙의 정밀성<\/div><ul><li>우주를 구성하는 물리 상수와 기본 힘은 매우 정밀한 수치를 유지하고 있다.<\/li><li>물리 법칙과 상수(laws and constants)의 정밀한 형태<\/li><li>미세한 차이(slightly different)가 생명의 존재 여부를 결정함<\/li><li>핵심 키워드: 정밀한 값(precise values)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02중력과 천체 형성<\/div><ul><li>정확한 중력 수치는 우주 만물이 응집하여 별과 행성을 형성하게 했다.<\/li><li>가스와 먼지 입자의 응집(aggregation)<\/li><li>원시별(protostars)과 행성 궤도의 형성<\/li><li>지구가 태양 주위를 도는 환경 조성<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03전자의 수치와 화학 반응<\/div><ul><li>전자의 값이 아주 조금만 달랐어도 생명의 기초가 되는 화학 반응은 불가능했다.<\/li><li>유기 화학(organic chemistry)의 성립 조건<\/li><li>전자의 수치에 의존하는 화학(chemistry)의 원리<\/li><li>생명 탄생을 가능하게 하는 화학적 기반<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04우주와 진화의 관계<\/div><ul><li>우주가 인간을 위해 설계된 것은 아니지만, 물리 법칙이 생명의 진화를 허용했다.<\/li><li>인류의 특권적 지위(privileged position)는 부재함<\/li><li>물리 상수가 고등 생명(advanced life)의 진화를 허용함<\/li><li>핵심 키워드: 진화의 가능성(allowed to evolve)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">constant<\/td><td class=\"m\">끊임없는, 일정한<\/td><\/tr><tr><td class=\"w\">physics<\/td><td class=\"m\">물리학<\/td><\/tr><tr><td class=\"w\">fundamental<\/td><td class=\"m\">근본적인, 기본적인<\/td><\/tr><tr><td class=\"w\">force<\/td><td class=\"m\">힘, 세력<\/td><\/tr><tr><td class=\"w\">universe<\/td><td class=\"m\">우주<\/td><\/tr><tr><td class=\"w\">precise<\/td><td class=\"m\">정확한, 정밀한<\/td><\/tr><tr><td class=\"w\">form<\/td><td class=\"m\">형성하다, 이루다<\/td><\/tr><tr><td class=\"w\">value<\/td><td class=\"m\">가치 있게 여기다, 소중히 하다<\/td><\/tr><tr><td class=\"w\">means<\/td><td class=\"m\">수단, 방법<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">slightly<\/td><td class=\"m\">약간, 조금<\/td><\/tr><tr><td class=\"w\">for instance<\/td><td class=\"m\">예를 들어<\/td><\/tr><tr><td class=\"w\">gravity<\/td><td class=\"m\">중력<\/td><\/tr><tr><td class=\"w\">enable<\/td><td class=\"m\">~할 수 있게 하다<\/td><\/tr><tr><td class=\"w\">arise<\/td><td class=\"m\">생기다, 일어나다<\/td><\/tr><tr><td class=\"w\">permit<\/td><td class=\"m\">허락하다, 가능하게 하다<\/td><\/tr><tr><td class=\"w\">aggregation<\/td><td class=\"m\">집단, 집합<\/td><\/tr><tr><td class=\"w\">particle<\/td><td class=\"m\">입자<\/td><\/tr><tr><td class=\"w\">planet<\/td><td class=\"m\">행성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">The laws and constants of physics<\/span><\/b><\/span><span class=\"ko\">물리학 법칙들과 상수들<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and the fundamental forces in our universe<\/span><\/b><\/span><span class=\"ko\">그리고 우리 우주의 근본 힘들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">have<\/span><\/b><\/span><span class=\"ko\">가진다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>very precise forms and values.<\/b><\/span><span class=\"ko\">매우 정밀한 형태들과 값들을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">물리학 법칙들과 상수들 그리고 우리 우주의 근본 힘들은 매우 정밀한 공식의 형태들과 값들을 가진다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 문장은 글의 도입부로, 우주를 구성하는 규칙들이 무작위로 정해진 것이 아니라 극도로 세밀하게 조정되어 있다는 전제를 제시합니다. The laws and constants of physics는 빛의 속도나 중력 상수처럼 우주 어디에서나 변하지 않는 절대적인 규칙과 수치들을 가리키며, 이것들이 아주 정교한 균형을 이루고 있다는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">The laws and constants of physics and the fundamental forces in our universe have (주어): 동사 구조: &#39;A and B&#39; 형태로 연결된 긴 명사구가 문장의 주어이며, 복수 주어에 맞춰 복수 동사 have가 쓰인 1형식 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">constant<\/td><td class=\"m\">끊임없는, 일정한<\/td><\/tr><tr><td class=\"w\">physics<\/td><td class=\"m\">물리학<\/td><\/tr><tr><td class=\"w\">fundamental<\/td><td class=\"m\">근본적인, 기본적인<\/td><\/tr><tr><td class=\"w\">force<\/td><td class=\"m\">힘, 세력<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">universe<\/td><td class=\"m\">우주<\/td><\/tr><tr><td class=\"w\">precise<\/td><td class=\"m\">정확한, 정밀한<\/td><\/tr><tr><td class=\"w\">form<\/td><td class=\"m\">형성하다, 이루다<\/td><\/tr><tr><td class=\"w\">value<\/td><td class=\"m\">가치 있게 여기다, 소중히 하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This means<\/b><\/span><span class=\"ko\">이것은 의미한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span>, if they were only very slightly different,<\/b><\/span><span class=\"ko\">만약 그것들이 아주 약간만 달랐다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>life would not have been possible.<\/b><\/span><span class=\"ko\">생명체는 가능하지 않았을 것임을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이는, 만약 그것들이 아주 약간만 다르다면, 생명체가 가능하지 않았을 것임을 의미한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 언급한 정밀한 수치들이 생명체의 탄생과 직결되어 있음을 설명하며 &#39;미세 조정 우주&#39;라는 핵심 개념을 전달합니다. if they were only very slightly different는 우주의 기본 설정값이 소수점 아래 아주 작은 단위만 바뀌었어도 별이나 행성 자체가 만들어지지 못해 생명이 싹트지 못했을 것이라는 극도의 민감성을 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that 명사절 접속사: 타동사 means의 목적어 역할을 하는 명사절을 이끈다. 뒤에는 주어(life)와 동사(would not have been)를 갖춘 완전한 절이 온다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">means<\/td><td class=\"m\">수단, 방법<\/td><\/tr><tr><td class=\"w\">slightly<\/td><td class=\"m\">약간, 조금<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>For instance,<\/b><\/span><span class=\"ko\">예를 들어,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the precise value of gravity<\/b><\/span><span class=\"ko\">중력의 정밀한 값은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>has <span class=\"grammar-hl\">enabled our universe to arise<\/span><\/b><\/span><span class=\"ko\">우리 우주가 생겨나는 것을 가능하게 했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by <span class=\"grammar-hl\">permitting<\/span><\/b><\/span><span class=\"ko\">허용함으로써<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the aggregation<\/b><\/span><span class=\"ko\">응집을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of dust and gas particles<\/b><\/span><span class=\"ko\">먼지와 가스 입자들의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to protostars<\/b><\/span><span class=\"ko\">원시 항성들로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">around which<\/span> planets later came <span class=\"grammar-hl\">to orbit<\/span>,<\/b><\/span><span class=\"ko\">나중에 행성들이 그 주위를 공전하게 된<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">including<\/span> the Earth around the Sun.<\/b><\/span><span class=\"ko\">태양 주위의 지구를 포함하여.<\/span><\/div><\/div><div class=\"lec-sent-ko\">예를 들어, 중력의 정밀한 값은 태양 주위의 지구를 포함하여 행성들이 나중에 그 주위를 공전하게 되는 원시 항성들로 먼지와 가스 입자들이 응집하는 것을 허용함으로써 우리 우주가 생겨나는 것을 가능하게 했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에 대한 구체적인 사례로 거시 세계의 법칙인 중력을 제시합니다. permitting the aggregation of dust and gas particles는 우주 공간의 부스러기들이 중력에 의해 하나로 모여 별의 씨앗이 되는 과정을 뜻하며, 중력 수치가 적절했기에 비로소 지구가 태양 주위를 도는 안정적인 환경이 조성될 수 있었다는 점을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">enabled our universe to arise 5형식(SVOC) 구조: enable은 타동사로 enable + O(our universe) + OC(to arise) 구조를 취하여 &#39;목적어가 ~하는 것을 가능하게 하다&#39;라는 의미를 만든다.<\/div><div class=\"lec-gr-item\">to arise (목적격보어(to부정사)): 5형식 동사 enable의 목적어인 our universe의 동작을 서술하는 보어 역할을 한다.<\/div><div class=\"lec-gr-item\">permitting (동명사): 전치사 by의 목적어 자리에 쓰여 &#39;~함으로써&#39;라는 수단/방법의 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">around which (전치사+관계대명사): &#39;전치사(around) + 관계대명사(which) + S + V&#39; 구조로 앞의 명사 protostars를 수식한다. 관계대명사 뒤에는 주어(planets)와 동사(came)가 갖춰진 완전한 절(완전문장)이 온다.<\/div><div class=\"lec-gr-item\">to orbit (to부정사(명사적)): &#39;come + to V&#39; 구문으로 &#39;~하게 되다&#39;라는 상태의 변화를 나타내며, 동사 come 뒤에 결합된 형태다.<\/div><div class=\"lec-gr-item\">including (현재분사(형용사)): 앞선 명사구에 대한 부연 설명을 제공하며, &#39;~을 포함하여&#39;라는 의미로 명사를 수식하거나 독립적인 분사구 기능을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">universe<\/td><td class=\"m\">우주<\/td><\/tr><tr><td class=\"w\">precise<\/td><td class=\"m\">정확한, 정밀한<\/td><\/tr><tr><td class=\"w\">value<\/td><td class=\"m\">가치 있게 여기다, 소중히 하다<\/td><\/tr><tr><td class=\"w\">for instance<\/td><td class=\"m\">예를 들어<\/td><\/tr><tr><td class=\"w\">gravity<\/td><td class=\"m\">중력<\/td><\/tr><tr><td class=\"w\">enable<\/td><td class=\"m\">~할 수 있게 하다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">arise<\/td><td class=\"m\">생기다, 일어나다<\/td><\/tr><tr><td class=\"w\">permit<\/td><td class=\"m\">허락하다, 가능하게 하다<\/td><\/tr><tr><td class=\"w\">aggregation<\/td><td class=\"m\">집단, 집합<\/td><\/tr><tr><td class=\"w\">particle<\/td><td class=\"m\">입자<\/td><\/tr><tr><td class=\"w\">planet<\/td><td class=\"m\">행성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If the value of the electron<\/b><\/span><span class=\"ko\">만약 전자의 값이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>had been ever so slightly larger or smaller,<\/b><\/span><span class=\"ko\">아주 약간이라도 더 크거나 작았더라면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>chemistry,<\/b><\/span><span class=\"ko\">화학은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as we know it,<\/b><\/span><span class=\"ko\">우리가 알고 있는 대로의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>would not have been possible<\/b><\/span><span class=\"ko\">가능하지 않았을 것이며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and life,<\/b><\/span><span class=\"ko\">그리고 생명체는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> <span class=\"grammar-hl\">is based<\/span> on organic chemistry,<\/b><\/span><span class=\"ko\">유기 화학에 기반을 둔<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>could not have started.<\/b><\/span><span class=\"ko\">시작될 수 없었을 것이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 전자의 값이 아주 약간이라도 더 크거나 작았더라면, 우리가 알고 있는 대로의 화학 반응은 가능하지 않았을 것이며 유기 화학 반응에 기반을 둔 생명체는 시작될 수 없었을 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 중력에 이어 미시 세계의 사례인 전자의 값을 언급하며 논의를 심화합니다. chemistry, as we know it은 원자들이 결합하여 물질을 만드는 기본 원리를 의미하며, 생명 활동의 근간이 되는 복잡한 탄소 화합물(유기 화학)의 결합 역시 전자의 값이 지금과 똑같았기에 가능했다는 물리적 필연성을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">which (관계대명사): 주격 관계대명사로 앞의 명사 life를 선행사로 하며, 이어지는 절 안에서 주어 역할을 수행한다.<\/div><div class=\"lec-gr-item\">is based (수동태): be동사(is)+p.p.(based) 구조. base는 타동사인데 뒤에 목적어가 없어서 수동구조 is based 형태로 쓴다. 기본구조: base A on B (A의 근거를 B에 두다)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">value<\/td><td class=\"m\">가치 있게 여기다, 소중히 하다<\/td><\/tr><tr><td class=\"w\">slightly<\/td><td class=\"m\">약간, 조금<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 5<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The universe <span class=\"grammar-hl\">was not designed<\/span><\/b><\/span><span class=\"ko\">우주는 설계되지 않았고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">for us to evolve<\/span>,<\/b><\/span><span class=\"ko\">우리가 진화하도록<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we have no privileged position<\/b><\/span><span class=\"ko\">우리는 어떠한 특권적인 지위도 가지고 있지 않다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the universe;<\/b><\/span><span class=\"ko\">우주에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>however,<\/b><\/span><span class=\"ko\">그러나<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the laws and constants of physics<\/b><\/span><span class=\"ko\">물리학 법칙들과 상수들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">allowed<\/span><\/b><\/span><span class=\"ko\">허용했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">advanced life to evolve<\/span>.<\/b><\/span><span class=\"ko\">고등 생명체가 진화하는 것을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우주는 우리가 진화하도록 설계되지 않았고, 우리는 우주에서 어떠한 특권적인 지위를 가지지 않는다. 그러나, 물리학 법칙들과 상수들은 고등 생명체가 진화하는 것을 가능하게 했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 결론으로, 우주가 인간을 위해 만들어졌다는 목적론적 해석은 경계하면서도 물리적 우연이 만든 가능성을 인정합니다. no privileged position은 인간이 우주의 주인공이라서 이런 환경이 조성된 것이 아니라는 객관적 시각을 보여주며, 그럼에도 불구하고 정교한 물리 법칙들이 &#39;허용&#39;한 좁은 틈 덕분에 비로소 지적인 생명체의 등장이 허락되었다는 사실을 정리합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was not designed (수동태): be동사(was)+p.p.(designed) 구조. design은 타동사인데 뒤에 목적어가 없어서 수동구조 was not designed 형태로 쓴다. 기본구조: design + O (O를 설계/의도하다)<\/div><div class=\"lec-gr-item\">for us to evolve (to부정사(부사적/목적)): in order for us to evolve로 바꿔도 뜻이 같으므로 부사적 용법 중 목적에 해당한다. for us는 to부정사의 의미상 주어다.<\/div><div class=\"lec-gr-item\">allowed advanced life to evolve 5형식(SVOC) 구조: allow는 타동사로 allow + O(advanced life) + OC(to evolve) 구조를 취하여 &#39;목적어가 ~하는 것을 허용하다/가능하게 하다&#39;라는 의미를 만든다.<\/div><div class=\"lec-gr-item\">to evolve (목적격보어(to부정사)): 5형식 동사 allow의 목적어인 advanced life의 동작을 설명하는 보어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">constant<\/td><td class=\"m\">끊임없는, 일정한<\/td><\/tr><tr><td class=\"w\">physics<\/td><td class=\"m\">물리학<\/td><\/tr><tr><td class=\"w\">universe<\/td><td class=\"m\">우주<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>우리 우주의 물리 법칙과 수치들은 매우 정밀하게 설정되어 있다.<\/li><li>이 수치들이 조금만 달랐어도 생명체가 탄생하는 환경은 조성되지 못했을 것이다.<\/li><li>중력의 적절한 값 덕분에 별과 행성이 생겼고, 전자의 값 덕분에 화학 반응과 생명 현상이 가능해졌다.<\/li><li>우주가 인간을 위해 특별히 설계된 것은 아니지만, 물리적 환경이 갖춰진 덕분에 고등 생명체가 진화할 수 있었다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">The precise forms of physical constants and forces allowed for the evolution of advanced life although the universe was not specifically designed for human existence.<\/div>\n              <div class=\"lec-final-sum-ko\">우주가 인간을 위해 설계된 것은 아님에도 불구하고, 물리적 상수와 힘의 정밀한 형태가 고등 생명체의 진화를 가능하게 했다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/18.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/19.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/21.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/22.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/23.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_24번_강의_audio/24.mp3","hl":null}]],"fileName":"모의고사_고1_2025년_10월_24번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 10월 / 24번","titleEn":"The Fine-Tuned Universe: How Precise Physical Laws Enabled Life","titleKo":"미세하게 조정된 우주: 정밀한 물리 법칙이 어떻게 생명체를 가능하게 했는가","imageUrl":"__enpImg__","stages":[{"label":"01물리 법칙의 정밀성","items":["우주를 구성하는 물리 상수와 기본 힘은 매우 정밀한 수치를 유지하고 있다.","물리 법칙과 상수(laws and constants)의 정밀한 형태","미세한 차이(slightly different)가 생명의 존재 여부를 결정함","핵심 키워드: 정밀한 값(precise values)"]},{"label":"02중력과 천체 형성","items":["정확한 중력 수치는 우주 만물이 응집하여 별과 행성을 형성하게 했다.","가스와 먼지 입자의 응집(aggregation)","원시별(protostars)과 행성 궤도의 형성","지구가 태양 주위를 도는 환경 조성"]},{"label":"03전자의 수치와 화학 반응","items":["전자의 값이 아주 조금만 달랐어도 생명의 기초가 되는 화학 반응은 불가능했다.","유기 화학(organic chemistry)의 성립 조건","전자의 수치에 의존하는 화학(chemistry)의 원리","생명 탄생을 가능하게 하는 화학적 기반"]},{"label":"04우주와 진화의 관계","items":["우주가 인간을 위해 설계된 것은 아니지만, 물리 법칙이 생명의 진화를 허용했다.","인류의 특권적 지위(privileged position)는 부재함","물리 상수가 고등 생명(advanced life)의 진화를 허용함","핵심 키워드: 진화의 가능성(allowed to evolve)"]}],"bkg":"이 지문은 우주의 물리 법칙들이 생명체가 탄생하기에 더할 나위 없이 정교하게 맞춰져 있다는 우주의 미세 조정(Fine-tuning of the Universe) 이론을 배경으로 하고 있습니다. 마치 라디오 주파수를 아주 미세하게만 틀어도 소리가 들리지 않는 것처럼, 중력(Gravity)이나 전자기력 같은 물리 상수(Physical Constants)가 현재 값에서 아주 조금만 벗어났더라도 별이나 행성, 그리고 우리 몸을 구성하는 유기 화학(Organic Chemistry) 반응 자체가 불가능했을 것이라는 개념이죠. 과학계에서는 이처럼 우주가 인간이 관찰할 수 있는 조건에 딱 맞게 형성되어 있다는 원리를 인류 원리(Anthropic Principle)라고 부르기도 합니다. 결국 우리가 존재할 수 있는 이유는 우주가 특별히 우리를 위해 설계되어서가 아니라, 오직 극도로 정교한 물리적 균형이 유지되는 조건에서만 생명체라는 복잡한 시스템이 진화할 수 있었기 때문입니다.","ttsText":"이 지문은 우주의 물리 법칙들이 생명체가 탄생하기에 더할 나위 없이 정교하게 맞춰져 있다는 우주의 미세 조정(Fine-tuning of the Universe) 이론을 배경으로 하고 있습니다. 마치 라디오 주파수를 아주 미세하게만 틀어도 소리가 들리지 않는 것처럼, 중력(Gravity)이나 전자기력 같은 물리 상수(Physical Constants)가 현재 값에서 아주 조금만 벗어났더라도 별이나 행성, 그리고 우리 몸을 구성하는 유기 화학(Organic Chemistry) 반응 자체가 불가능했을 것이라는 개념이죠. 과학계에서는 이처럼 우주가 인간이 관찰할 수 있는 조건에 딱 맞게 형성되어 있다는 원리를 인류 원리(Anthropic Principle)라고 부르기도 합니다. 결국 우리가 존재할 수 있는 이유는 우주가 특별히 우리를 위해 설계되어서가 아니라, 오직 극도로 정교한 물리적 균형이 유지되는 조건에서만 생명체라는 복잡한 시스템이 진화할 수 있었기 때문입니다.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 24번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 24번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고1 / 2025년 / 10월 / 24번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고1 / 2025년 / 10월 / 24번","titleEn":"The Fine-Tuned Universe: How Precise Physical Laws Enabled Life","titleKo":"미세하게 조정된 우주: 정밀한 물리 법칙이 어떻게 생명체를 가능하게 했는가","imageUrl":"__enpImg__","stages":[{"label":"01물리 법칙의 정밀성","items":["우주를 구성하는 물리 상수와 기본 힘은 매우 정밀한 수치를 유지하고 있다.","물리 법칙과 상수(laws and constants)의 정밀한 형태","미세한 차이(slightly different)가 생명의 존재 여부를 결정함","핵심 키워드: 정밀한 값(precise values)"]},{"label":"02중력과 천체 형성","items":["정확한 중력 수치는 우주 만물이 응집하여 별과 행성을 형성하게 했다.","가스와 먼지 입자의 응집(aggregation)","원시별(protostars)과 행성 궤도의 형성","지구가 태양 주위를 도는 환경 조성"]},{"label":"03전자의 수치와 화학 반응","items":["전자의 값이 아주 조금만 달랐어도 생명의 기초가 되는 화학 반응은 불가능했다.","유기 화학(organic chemistry)의 성립 조건","전자의 수치에 의존하는 화학(chemistry)의 원리","생명 탄생을 가능하게 하는 화학적 기반"]},{"label":"04우주와 진화의 관계","items":["우주가 인간을 위해 설계된 것은 아니지만, 물리 법칙이 생명의 진화를 허용했다.","인류의 특권적 지위(privileged position)는 부재함","물리 상수가 고등 생명(advanced life)의 진화를 허용함","핵심 키워드: 진화의 가능성(allowed to evolve)"]}],"bkg":"이 지문은 우주의 물리 법칙들이 생명체가 탄생하기에 더할 나위 없이 정교하게 맞춰져 있다는 우주의 미세 조정(Fine-tuning of the Univer ":"means","meaning":"수단, 방법"},{"word":"slightly","meaning":"약간, 조금"},{"word":"for instance","meaning":"예를 들어"},{"word":"gravity","meaning":"중력"},{"word":"enable","meaning":"~할 수 있게 하다"},{"word":"arise","meaning":"생기다, 일어나다"},{"word":"permit","meaning":"허락하다, 가능하게 하다"},{"word":"aggregation","meaning":"집단, 집합"},{"word":"particle","meaning":"입자"},{"word":"planet","meaning":"행성"}],"ttsText":"","__passage":"모의고사 / 고1 / 2025년 / 10월 / 24번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 24번","__script":"문장을 보기 전에, 이 지문의 핵심 단어들을 빠르게 짚고 갈게요. constant, 끊임없는, 일정한. physics, 물리학. fundamental, 근본적인, 기본적인. force, 힘, 세력. universe, 우주. precise, 정확한, 정밀한. form, 형성하다, 이루다. value, 가치 있게 여기다, 소중히 하다. means, 수단, 방법. slightly, 약간, 조금. for instance, 예를 들어. gravity, 중력. enable, ~할 수 있게 하다. arise, 생기다, 일어나다. 이 단어들은 꼭 기억해 두세요."},{"kind":"sentence","idx":1,"total":5,"english":"The laws and constants of physics and the fundamental forces in our universe have very precise forms and values.","korean":"물리학 법칙들과 상수들 그리고 우리 우주의 근본 힘들은 매우 정밀한 공식의 형태들과 값들을 가진다.","chunks":[{"english":"The laws and constants of physics","englishHtml":"<b><span class=\"grammar-hl\">The laws and constants of physics<\/span><\/b>","korean":"물리학 법칙들과 상수들"},{"english":"and the fundamental forces in our universe","englishHtml":"<b><span class=\"grammar-hl\">and the fundamental forces in our universe<\/span><\/b>","korean":"그리고 우리 우주의 근본 힘들은"},{"english":"have","englishHtml":"<b><span class=\"grammar-hl\">have<\/span><\/b>","korean":"가진다"},{"english":"very precise forms and values.","englishHtml":"<b>very precise forms and values.<\/b>","korean":"매우 정밀한 형태들과 값들을."}],"meaning":"이 문장은 글의 도입부로, 우주를 구성하는 규칙들이 무작위로 정해진 것이 아니라 극도로 세밀하게 조정되어 있다는 전제를 제시합니다. The laws and constants of physics는 빛의 속도나 중력 상수처럼 우주 어디에서나 변하지 않는 절대적인 규칙과 수치들을 가리키며, 이것들이 아주 정교한 균형을 이루고 있다는 점을 강조합니다.","grammar":"The laws and constants of physics and the fundamental forces in our universe have (주어): 동사 구조: 'A and B' 형태로 연결된 긴 명사구가 문장의 주어이며, 복수 주어에 맞춰 복수 동사 have가 쓰 하는 환경은 조성되지 못했을 것이다.","중력의 적절한 값 덕분에 별과 행성이 생겼고, 전자의 값 덕분에 화학 반응과 생명 현상이 가능해졌다.","우주가 인간을 위해 특별히 설계된 것은 아니지만, 물리적 환경이 갖춰진 덕분에 고등 생명체가 진화할 수 있었다."],"compare":{"headers":["구분","현재의 물리적 수치","미세하게 다른 수치"],"rows":[["천체 형성","가스와 먼지가 뭉쳐 별과 행성 형성","물질이 뭉치지 못하거나 별이 생기지 않음"],["화학 반응","전자의 결합으로 유기 화학 가능","화학 작용이 일어나지 않아 물질 생성 불가"],["생명 탄생","고등 생명체의 진화와 존재 가능","생명의 시작 자체가 원천적으로 불가능"],["우주 성격","생명 친화적인 정밀한 균형 상태","생명이 존재할 수 없는 불모의 공간"]]},"ttsText":"우리 우주의 물리 법칙과 수치들은 매우 정밀하게 설정되어 있다. 이 수치들이 조금만 달랐어도 생명체가 탄생하는 환경은 조성되지 못했을 것이다. 중력의 적절한 값 덕분에 별과 행성이 생겼고, 전자의 값 덕분에 화학 반응과 생명 현상이 가능해졌다. 우주가 인간을 위해 특별히 설계된 것은 아니지만, 물리적 환경이 갖춰진 덕분에 고등 생명체가 진화할 수 있었다.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 24번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 24번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 우리 우주의 물리 법칙과 수치들은 매우 정밀하게 설정되어 있습니다. 이 수치들이 조금만 달랐어도 생명체가 탄생하는 환경은 조성되지 못했을 것입니다. 중력의 적절한 값 덕분에 별과 행성이 생겼고, 전자의 값 덕분에 화학 반응과 생명 현상이 가능해졌습니다. 우주가 인간을 위해 특별히 설계된 것은 아니지만, 물리적 환경이 갖춰진 덕분에 고등 생명체가 진화할 수 있었습니다. 마지막으로 이 글을 한 문장으로 요약하면 이렇습니다. 우주가 인간을 위해 설계된 것은 아님에도 불구하고, 물리적 상수와 힘의 정밀한 형태가 고등 생명체의 진화를 가능하게 했습니다. 오늘도 정말 수고 많았습니다!"}]}</script><script>var D=JSON.parse(document.getElementById("enpLecData").textContent);var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));
