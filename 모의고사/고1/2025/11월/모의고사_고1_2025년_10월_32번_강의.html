"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01근사 수 체계의 정의<\/div><ul><li>동물의 수 판단 능력을 설명하는 전문 용어인 근사 수 체계를 소개한다.<\/li><li>동물의 수 판단 (judgement of numbers)<\/li><li>핵심 개념: 근사 수 체계 (approximate number system)<\/li><li>핵심 키워드: 근사 수 체계(approximate number system)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02정확도의 한계와 오류 패턴<\/div><ul><li>이 체계는 정교함이 부족하며 수량이 커질수록 부정확해지는 특성이 있다.<\/li><li>정교함(precision)의 결여<\/li><li>수량(quantities)이 커질수록 변별력이 낮아짐<\/li><li>모든 종에서 공통적으로 나타나는 특징적 오류 패턴<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03동물을 통한 실험적 증거<\/div><ul><li>원숭이와 쥐를 대상으로 한 실험에서 수치 증가에 따른 인지 실패를 확인한다.<\/li><li>붉은털원숭이(Rhesus monkeys): 5 이상의 수에서 판단에 실패하기 시작함<\/li><li>쥐(rats): 실험 수치가 커질수록 반응의 정밀도(precise)가 현저히 감소함<\/li><li>높은 수치에서는 목표 주변의 분산된 수치(spread of numbers)를 생성함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04최종 결론<\/div><ul><li>동물의 수 감각을 평가할 때 수의 크기가 갖는 결정적 중요성을 정리한다.<\/li><li>수 감각(number sense)의 정확도 측정 기준<\/li><li>수의 크기(size of the numbers)가 판단의 질을 결정함<\/li><li>핵심 키워드: 수의 크기(size of the numbers)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">technical<\/td><td class=\"m\">기술의, 전문적인<\/td><\/tr><tr><td class=\"w\">term<\/td><td class=\"m\">용어<\/td><\/tr><tr><td class=\"w\">describe<\/td><td class=\"m\">묘사하다, 서술하다<\/td><\/tr><tr><td class=\"w\">judgement<\/td><td class=\"m\">판단<\/td><\/tr><tr><td class=\"w\">approximate<\/td><td class=\"m\">(수량 등이) ~에 가까워지다, 대략의<\/td><\/tr><tr><td class=\"w\">provide<\/td><td class=\"m\">제공하다, 주다<\/td><\/tr><tr><td class=\"w\">precision<\/td><td class=\"m\">정확함, 정밀함<\/td><\/tr><tr><td class=\"w\">species<\/td><td class=\"m\">종(種)<\/td><\/tr><tr><td class=\"w\">characteristic<\/td><td class=\"m\">특징, 특성<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">discrimination<\/td><td class=\"m\">차별<\/td><\/tr><tr><td class=\"w\">accurate<\/td><td class=\"m\">정확한<\/td><\/tr><tr><td class=\"w\">quantity<\/td><td class=\"m\">양<\/td><\/tr><tr><td class=\"w\">lever<\/td><td class=\"m\">지렛대, 레버<\/td><\/tr><tr><td class=\"w\">marked<\/td><td class=\"m\">두드러진, 뚜렷한<\/td><\/tr><tr><td class=\"w\">precise<\/td><td class=\"m\">정확한, 정밀한<\/td><\/tr><tr><td class=\"w\">response<\/td><td class=\"m\">반응, 응답<\/td><\/tr><tr><td class=\"w\">increase<\/td><td class=\"m\">증가<\/td><\/tr><tr><td class=\"w\">range<\/td><td class=\"m\">범위<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The technical term<\/b><\/span><span class=\"ko\">전문 용어는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">often used<\/span> <span class=\"grammar-hl\">to describe<\/span> animals’ judgement of numbers<\/b><\/span><span class=\"ko\">동물들의 수에 대한 판별력을 기술하는 데 자주 사용되는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is the approximate number system.<\/b><\/span><span class=\"ko\">‘어림 수 짐작 능력’이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">동물들의 수에 대한 분별력을 기술하는 데 자주 사용되는 전문 용어는 ‘어림 수 짐작 능력’이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> the approximate number system은 동물이 개별 단위를 하나씩 정확히 세는 것이 아니라, 전체적인 양의 덩어리로 숫자를 인식한다는 점을 시사하며 글의 핵심 소재를 소개합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">often used (과거분사(형용사)): 과거분사 used가 앞의 명사 technical term을 수식(= &quot;흔히 사용되는 기술적 용어&quot;)하며, technical term that is often used와 같은 축약 관계절 구조임.<\/div><div class=\"lec-gr-item\">to describe (to부정사(부사적): 목적): &quot;in order to describe&quot;로 바꿔도 뜻이 같으며, judgement를 설명하기 위해 사용된다는 목적을 나타냄.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">technical<\/td><td class=\"m\">기술의, 전문적인<\/td><\/tr><tr><td class=\"w\">term<\/td><td class=\"m\">용어<\/td><\/tr><tr><td class=\"w\">describe<\/td><td class=\"m\">묘사하다, 서술하다<\/td><\/tr><tr><td class=\"w\">judgement<\/td><td class=\"m\">판단<\/td><\/tr><tr><td class=\"w\">approximate<\/td><td class=\"m\">(수량 등이) ~에 가까워지다, 대략의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">What it does not provide<\/span><\/b><\/span><span class=\"ko\">그것이 제공하지 않는 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is precision.<\/b><\/span><span class=\"ko\">정확성이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것이 제공하지 않는 것은 정확성이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> does not provide is precision은 앞서 언급한 체계의 근본적인 한계를 지적합니다. 동물이 숫자를 어느 정도 파악할 수는 있지만, 우리처럼 &#39;정확히 몇 개&#39;라고 짚어내는 능력은 없다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">What it does not provide (관계대명사): 선행사를 포함한 관계대명사 what이 이끄는 절이 문장에서 주어 역할을 하는 명사절임.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">provide<\/td><td class=\"m\">제공하다, 주다<\/td><\/tr><tr><td class=\"w\">precision<\/td><td class=\"m\">정확함, 정밀함<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>It shows<\/b><\/span><span class=\"ko\">그것은 보여 준다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>— and this is the same in every <span class=\"grammar-hl\">species tested<\/span> —<\/b><\/span><span class=\"ko\">— 그리고 이것은 실험된 모든 종에서 동일하다 —<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a characteristic pattern of errors,<\/b><\/span><span class=\"ko\">특징적인 오류 패턴을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">with discrimination becoming<\/span> less accurate<\/b><\/span><span class=\"ko\">판별이 덜 정확해지는 가운데<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as the quantities get bigger.<\/b><\/span><span class=\"ko\">수량이 더 커질수록.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것은 수량이 더 커질수록 판별이 덜 정확해지는 특징적인 오류 패턴을 보여 주는데, 이것은 실험된 모든 종에서 동일하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> discrimination becoming less accurate는 숫자의 규모가 커질수록 동물이 두 수 사이의 차이를 구별하는 데 더 큰 어려움을 겪게 된다는 보편적인 법칙을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">species tested (과거분사(형용사)): 과거분사 tested가 앞의 명사 species를 수식(= &quot;테스트된 모든 종&quot;)하며, species that were tested와 같은 축약 관계절 구조임.<\/div><div class=\"lec-gr-item\">with discrimination becoming (분사구문): &#39;with + 명사 + 현재분사(-ing)&#39; 구조로 discrimination의 상태나 부수적인 상황을 나타냄. while discrimination becomes less accurate와 같은 절로 변환할 수 있음.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">species<\/td><td class=\"m\">종(種)<\/td><\/tr><tr><td class=\"w\">characteristic<\/td><td class=\"m\">특징, 특성<\/td><\/tr><tr><td class=\"w\">discrimination<\/td><td class=\"m\">차별<\/td><\/tr><tr><td class=\"w\">accurate<\/td><td class=\"m\">정확한<\/td><\/tr><tr><td class=\"w\">quantity<\/td><td class=\"m\">양<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Rhesus monkeys can <span class=\"grammar-hl\">tell<\/span><\/b><\/span><span class=\"ko\">붉은털원숭이는 구별할 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">one from two<\/span>,<\/b><\/span><span class=\"ko\">1과 2를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>two from three,<\/b><\/span><span class=\"ko\">2와 3을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>three from four,<\/b><\/span><span class=\"ko\">3과 4를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>four from five ...<\/b><\/span><span class=\"ko\">4와 5를 ...<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but start <span class=\"grammar-hl\">to fail<\/span><\/b><\/span><span class=\"ko\">하지만 실패하기 시작한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from five upwards.<\/b><\/span><span class=\"ko\">5 위로는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">붉은털원숭이는 1과 2, 2와 3, 3과 4, 4와 5는 구별할 수 있지만, 5 위로는 실패하기 시작한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> start to fail from five upwards는 앞선 일반적 법칙을 뒷받침하는 첫 번째 예시입니다. 수치가 작을 때는 명확히 구분하던 원숭이도 숫자가 커지면 인지 능력에 과부하가 걸려 실수를 시작한다는 구체적인 상황을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">tell one from two (관용표현): &#39;tell A from B&#39; 구조로 사용되어 &#39;A와 B를 구별하다&#39;라는 의미를 나타냄.<\/div><div class=\"lec-gr-item\">to fail (to부정사(명사적)): 동사 start의 목적어 자리에 위치하여 &#39;~하기를 시작하다&#39;라는 의미를 나타냄.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 5 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Rats<\/b><\/span><span class=\"ko\">쥐들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that learned<\/span> <span class=\"grammar-hl\">to press<\/span> a lever a <span class=\"grammar-hl\">given<\/span> number of times,<\/b><\/span><span class=\"ko\">주어진 횟수만큼 레버를 누르도록 학습했던<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from four up to twenty-four,<\/b><\/span><span class=\"ko\">네 번에서 스물네 번까지<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>became markedly less and less precise<\/b><\/span><span class=\"ko\">두드러지게 점점 덜 정확해졌다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in their responses<\/b><\/span><span class=\"ko\">그들의 반응에 있어서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as the number increased:<\/b><\/span><span class=\"ko\">숫자가 커질수록 :<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by the top end of the range<\/b><\/span><span class=\"ko\">그 범위의 상한선에 다다랐을 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they would merely produce a spread of numbers<\/b><\/span><span class=\"ko\">그들은 단지 숫자들의 분산을 산출하곤 했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>around the target.<\/b><\/span><span class=\"ko\">목표 주변의.<\/span><\/div><\/div><div class=\"lec-sent-ko\">네 번에서 스물네 번까지 주어진 횟수만큼 레버를 누르도록 학습했던 쥐는 숫자가 커질수록 그들의 반응에 있어서 두드러지게 점점 덜 정확해졌다. 그 범위의 상한선에 다다랐을 때, 그들은 단지 목표(숫자) 주변에 퍼져 있는 숫자들을 산출하곤 했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> produce a spread of numbers around the target은 숫자가 커질수록 쥐가 정확한 횟수를 채우지 못하고, 목표치와 비슷해 보이는 대략적인 횟수만큼만 레버를 누르게 된다는 의미입니다. 원숭이 사례에 이어 쥐를 통해 같은 원리를 재차 증명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that learned (관계대명사): 선행사 Rats를 수식하는 주격 관계대명사로, 뒤에 동사 learned가 이어지는 불완전한 절을 이끔.<\/div><div class=\"lec-gr-item\">to press (to부정사(명사적)): 동사 learned의 목적어 자리에 쓰여 &#39;~하는 것을 배우다&#39;라는 의미를 나타냄.<\/div><div class=\"lec-gr-item\">given (과거분사(형용사)): 과거분사 given이 뒤의 명사 number를 수식(= &quot;주어진 수/정해진 수&quot;)하며, a number that was given의 의미임.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lever<\/td><td class=\"m\">지렛대, 레버<\/td><\/tr><tr><td class=\"w\">marked<\/td><td class=\"m\">두드러진, 뚜렷한<\/td><\/tr><tr><td class=\"w\">precise<\/td><td class=\"m\">정확한, 정밀한<\/td><\/tr><tr><td class=\"w\">response<\/td><td class=\"m\">반응, 응답<\/td><\/tr><tr><td class=\"w\">increase<\/td><td class=\"m\">증가<\/td><\/tr><tr><td class=\"w\">range<\/td><td class=\"m\">범위<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">It is a common observation<\/span><\/b><\/span><span class=\"ko\">그것은 공통된 관찰이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> when <span class=\"grammar-hl\">testing<\/span> the accuracy of animals’ number sense,<\/b><\/span><span class=\"ko\">동물의 수 감각의 정확성을 측정할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the size of the numbers matters.<\/b><\/span><span class=\"ko\">숫자의 크기가 중요하다는 것은.<\/span><\/div><\/div><div class=\"lec-sent-ko\">동물의 수 감각의 정확성을 측정할 때, 숫자의 크기가 중요하다는 것은 공통된 관찰이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> the size of the numbers matters는 앞서 제시된 모든 사례를 아우르는 결론으로, 동물의 숫자 인지력은 대상의 수치가 커질수록 급격히 떨어진다는 핵심을 다시 한번 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It is a common observation that (가주어): 진주어: 문장 앞에 형식적인 주어 It을 두고, 실제 주어인 명사절 that절(the size of the numbers matters)을 뒤로 보낸 구조임.<\/div><div class=\"lec-gr-item\">testing (분사구문): 접속사 when 뒤에 &#39;주어+be동사&#39;가 생략된 분사구문으로, when they test 또는 when they are testing과 같은 절로 변환할 수 있음.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>동물의 숫자 인식 체계는 정확하게 세는 것이 아니라 대략적인 양을 파악하는 &#39;근사 수 체계&#39;이다.<\/li><li>이 체계는 숫자가 작을 때는 정확하지만, 숫자가 커질수록 변별력이 급격히 떨어진다.<\/li><li>원숭이는 작은 수는 잘 구분하지만 5 이상의 큰 숫자로 갈수록 구분에 실패한다.<\/li><li>쥐 또한 반복 횟수가 많아질수록 정확한 횟수가 아닌 목표 주변의 대략적인 횟수만 채운다.<\/li><li>결국 동물의 숫자 감각에서 정확도는 인식해야 할 숫자의 크기에 반비례한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Animals rely on an approximate number system for numerical discrimination, though their precision diminishes as the quantities become larger.<\/div>\n              <div class=\"lec-final-sum-ko\">동물은 수치 구별을 위해 대략적 숫자 체계에 의존하지만, 수량이 많아질수록 그들의 정밀도는 떨어진다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/18.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/19.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/21.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/22.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/23.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/24.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/25.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/26.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_32번_강의_audio/27.mp3","hl":null}]],"fileName":"모의고사_고1_2025년_10월_32번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 10월 / 32번","titleEn":"The Approximate Number System: Why Size Matters in Animal Numeracy","titleKo":"대략적 숫자 체계: 동물 수 감각에서 숫자의 크기가 중요한 이유","imageUrl":"__enpImg__","stages":[{"label":"01근사 수 체계의 정의","items":["동물의 수 판단 능력을 설명하는 전문 용어인 근사 수 체계를 소개한다.","동물의 수 판단 (judgement of numbers)","핵심 개념: 근사 수 체계 (approximate number system)","핵심 키워드: 근사 수 체계(approximate number system)"]},{"label":"02정확도의 한계와 오류 패턴","items":["이 체계는 정교함이 부족하며 수량이 커질수록 부정확해지는 특성이 있다.","정교함(precision)의 결여","수량(quantities)이 커질수록 변별력이 낮아짐","모든 종에서 공통적으로 나타나는 특징적 오류 패턴"]},{"label":"03동물을 통한 실험적 증거","items":["원숭이와 쥐를 대상으로 한 실험에서 수치 증가에 따른 인지 실패를 확인한다.","붉은털원숭이(Rhesus monkeys): 5 이상의 수에서 판단에 실패하기 시작함","쥐(rats): 실험 수치가 커질수록 반응의 정밀도(precise)가 현저히 감소함","높은 수치에서는 목표 주변의 분산된 수치(spread of numbers)를 생성함"]},{"label":"04최종 결론","items":["동물의 수 감각을 평가할 때 수의 크기가 갖는 결정적 중요성을 정리한다.","수 감각(number sense)의 정확도 측정 기준","수의 크기(size of the numbers)가 판단의 질을 결정함","핵심 키워드: 수의 크기(size of the numbers)"]}],"bkg":"우리가 숫자를 정확히 세지 않고도 대략적인 양을 직관적으로 파악하는 능력을 근사 수 체계(Approximate Number System)라고 부르는데, 이는 인간을 포함한 다양한 동물 종이 생존을 위해 공통적으로 지닌 본능적인 감각입니다. 이 체계는 숫자가 작을 때는 꽤 정확하지만 숫자가 커질수록 식별의 정확도가 떨어지는 특징이 있으며, 이는 두 양의 차이가 일정 비율 이상이어야 구분이 가능하다는 베버의 법칙(Weber's Law)과 밀접한 관련이 있습니다. 예를 들어 사과 1개와 2개는 쉽게 구분하지만 100개와 101개는 눈으로만 봐서 차이를 느끼기 힘든 것처럼, 동물의 수 식별 능력(Number Discrimination) 또한 절대적인 수치보다는 상대적인 비율과 수량의 크기(Magnitude)에 큰 영향을 받습니다. 실제 레서스 원숭이나 쥐를 대상으로 한 실험에서도 수치가 커질수록 정답 근처에서 넓게 퍼진 오차 분포가 나타나는데, 이는 기호화된 언어 없이 직관적으로 수를 처리할 때 발생하는 생물학적인 인지적 한계(Cognitive Limitation)를 잘 보여줍니다.","ttsText":"우리가 숫자를 정확히 세지 않고도 대략적인 양을 직관적으로 파악하는 능력을 근사 수 체계(Approximate Number System)라고 부르는데, 이는 인간을 포함한 다양한 동물 종이 생존을 위해 공통적으로 지닌 본능적인 감각입니다. 이 체계는 숫자가 작을 때는 꽤 정확하지만 숫자가 커질수록 식별의 정확도가 떨어지는 특징이 있으며, 이는 두 양의 차이가 일정 비율 이상이어야 구분이 가능하다는 베버의 법칙(Weber's Law)과 밀접한 관련이 있습니다. 예를 들어 사과 1개와 2개는 쉽게 구분하지만 100개와 101개는 눈으로만 봐서 차이를 느끼기 힘든 것처럼, 동물의 수 식별 능력(Number Discrimination) 또한 절대적인 수치보다는 상대적인 비율과 수량의 크기(Magnitude)에 큰 영향을 받습니다. 실제 레서스 원숭이나 쥐를 대상으로 한 실험에서도 수치가 커질수록 정답 근처에서 넓게 퍼진 오차 분포가 나타나는데, 이는 기호화된 언어 없이 직관적으로 수를 처리할 때 발생하는 생물학적인 인지적 한계(Cognitive Limitation)를 잘 보여줍니다.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 32번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 32번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고1 / 2025년 / 10월 / 32번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고1 / 2025년 / 10월 / 32번","titleEn":"The Approximate Number System: Why Size Matters in Animal Numeracy","titleKo":"대략적 숫자 체계: 동물 수 감각에서 숫자의 크기가 중요한 이유","imageUrl":"__enpImg__","stages":[{"label":"01근사 수 체계의 정의","items":["동물의 수 판단 능력을 설명하는 전문 용어인 근사 수 체계를 소개한다.","동물의 수 판단 (judgement of numbers)","핵심 개념: 근사 수 체계 (approximate number system)","핵심 키워드: 근사 수 체계(approximate number system)"]},{"label":"02정확도의 한계와 오류 패턴","items":["이 체계는 정교함이 부족하며 수량이 커질수록 부정확해지는 특성이 있다.","정교함(precision)의 결여","수량(quantities)이 커질수록 변별력이 낮아짐","모든 종에서 공통적으로 나타나는 특징적 오류 패턴"]},{"label":"03동물을 통한 실험적 증거","items":["원숭이와 쥐를 대상으로 한 실험에서 수치 증가에 따른 인지 실패를 확인한다.","붉은털원숭이(Rhesus monkeys): 5 이상의 수에서 판단에 실패하기 시작함","쥐(rats): 실험 수치가 커질수록 반응의 정밀도(precise)가 현저히 감소함","높은 수치에서는 목표 주변의 분산된 수치(spread of numbers)를 생성함"]},{"label":"04최종 결론","items":["동물의 수 감각을 평가할 때 수의 크기가 갖는 결정적 중요성을 정리한다.","수 감각(number sense)의 정확도 측정 기준","수의 크기(size of the numbers)가 판단의 질을 결정함","핵심 키워드: 수의 크기(size of the numbers)"]}],"bkg":"우리가 숫자를 정확히 세지 않고도 대략적인 양을 직관적으로 파악하는 능력을 근사 수 체계(Approximate Number System
