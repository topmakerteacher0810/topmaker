SYyOTnI6j3/AE+nFHHUkdMjkcA9++P6n8AAAD0HbGR1/Pn6j29RT+drarT9d0JeW3S39fkAHAHoe/X+X4emP1QkjknIIxgfp1PPHXH8hShlYEgjHQgke/v7dKN6gY4BBwORz06YPOPbp0xkihava/Vpdr+W3yH+P6CjkAdMev657/jz7UY49ffv6c//AF6aGXA5HPXkHBPPr+X1FOzxnkZwOuOvUYzz/wDW96Ql2bv01/J/Lvv8xcZ5/XpjPJ9u38vXFJyT36+3PTpx0+mKNwA6jBzjnvx19ex9O/qKMf0/z+lAddbeXe2n5v79BAwPr1OBzxz16Drjv9OopG5U4PY4I57H8+c8f15o49VOR8o4ycD17gYGOuOemOTbtLYAHXIOCOmc4xt4IGSepAzgch6bp9E117f8H1sF+2+tvl+O5//Z\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">Understanding Opposites: A Developmental Milestone in Children&#39;s Language Acquisition<small>반대 개념 이해하기: 아동 언어 습득의 발달적 이정표<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">아동의 발달 과정에서 단어 간의 상관관계를 파악하는 인지적 성숙(Cognitive Maturation)은 점진적으로 이루어지는데, 특히 서로 반대되는 개념인 이분법적 대립(Binary Opposites)을 이해하는 데는 상당한 시간이 필요합니다. 아이들은 초기에 각 단어를 서로 연결되지 않은 독립적인 정보로 인식하기 때문에, 특정 행동을 금지하는 부정어(Negation)를 들었을 때 그 반대 급부의 행동을 자동으로 도출해내는 추론 능력(Inference Ability)이 성인에 비해 부족할 수밖에 없습니다. 예를 들어 &#39;A가 아니다&#39;라는 말을 들었을 때 성인은 즉각적으로 &#39;B를 해야 한다&#39;라고 논리적 판단을 내리지만, 아이들에게는 단순히 현재 행동의 중단만을 의미할 뿐 다음에 취해야 할 대안적 행동(Alternative Behavior)을 지시하는 신호로 연결되지 않는 것입니다. 마치 목적지 정보 없이 &#39;그 길은 막혔다&#39;는 말만 들은 운전자가 어디로 갈지 몰라 당황하는 것처럼, 아이들도 언어의 논리적 연결성(Logical Connectivity)을 완전히 학습하기 전까지는 부모의 부정적 피드백 앞에서 행동의 갈피를 잡지 못하는 혼란을 겪게 됩니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01반대 원리의 생소함<\/div><ul><li>어린 시절 아이들은 반대 개념의 원리를 잘 이해하지 못하며 단어를 개별적으로 인식한다.<\/li><li>단어와 의미를 서로 별개의 것으로 인지함<\/li><li>단어들이 서로 직접 연결된다는 사실은 발달 후반에야 이해함<\/li><li>핵심 키워드: 반대 원리(principle of opposites)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02방향 개념의 사례<\/div><ul><li>아이들에게 특정 방향의 반대 방향으로 전환하는 것은 당연한 논리가 아니다.<\/li><li>자전거를 탈 때 &quot;왼쪽으로 가지 마라&quot;는 말을 들어도 오른쪽으로 꺾지 않음<\/li><li>지시를 받아도 기존의 방향대로 직진(straight ahead)하는 경향이 있음<\/li><li>핵심 키워드: 오른쪽(Right), 왼쪽(Left)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03행동 지시의 혼란<\/div><ul><li>부모의 부정적 지시어에 담긴 논리적 연결을 아이들은 즉각적으로 파악하지 못한다.<\/li><li>&quot;손으로 먹지 마라&quot;는 지시에 먹기를 중단해야 할지 방법을 바꿀지 혼란(confusion)을 느낌<\/li><li>부모가 기대하는 바가 무엇인지 명확하게 인지하지 못함<\/li><li>핵심 키워드: 논리적 연결(logical connection)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04인지적 성장과 이해<\/div><ul><li>성장 과정을 거치면서 아이들은 단어 사이의 관계와 의도를 파악하는 능력을 갖추게 된다.<\/li><li>부정적 금지 뒤에 숨겨진 긍정적 대안(도구 사용)을 이해함<\/li><li>손이 아닌 포크나 스푼을 사용해야 한다는 연결 고리를 인식함<\/li><li>핵심 키워드: 발달(development), 인식(recognize)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">principle<\/td><td class=\"m\">원리, 원칙<\/td><\/tr><tr><td class=\"w\">opposite<\/td><td class=\"m\">반대의, 반대<\/td><\/tr><tr><td class=\"w\">foreign<\/td><td class=\"m\">외국의<\/td><\/tr><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 지각하다<\/td><\/tr><tr><td class=\"w\">meaning<\/td><td class=\"m\">의미, 뜻<\/td><\/tr><tr><td class=\"w\">separate<\/td><td class=\"m\">별개의, 따로 떨어진<\/td><\/tr><tr><td class=\"w\">individual<\/td><td class=\"m\">개인<\/td><\/tr><tr><td class=\"w\">directly<\/td><td class=\"m\">직접, 곧바로<\/td><\/tr><tr><td class=\"w\">apply<\/td><td class=\"m\">(apply to) ~에 해당하다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">logical<\/td><td class=\"m\">논리적인<\/td><\/tr><tr><td class=\"w\">connection<\/td><td class=\"m\">연결, 관계<\/td><\/tr><tr><td class=\"w\">confuse<\/td><td class=\"m\">혼란스럽게 하다<\/td><\/tr><tr><td class=\"w\">for instance<\/td><td class=\"m\">예를 들어<\/td><\/tr><tr><td class=\"w\">vivid<\/td><td class=\"m\">생생한, 선명한<\/td><\/tr><tr><td class=\"w\">ride<\/td><td class=\"m\">타다<\/td><\/tr><tr><td class=\"w\">continue<\/td><td class=\"m\">계속하다, 계속되다<\/td><\/tr><tr><td class=\"w\">automatically<\/td><td class=\"m\">자동으로<\/td><\/tr><tr><td class=\"w\">confusion<\/td><td class=\"m\">혼란, 혼동<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">As children<\/span>,<\/b><\/span><span class=\"ko\">아이였을 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the principle of opposites<\/b><\/span><span class=\"ko\">반대의 원리는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is foreign.<\/b><\/span><span class=\"ko\">낯설다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">어릴 때, 반대의 원리는 낯설다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> the principle of opposites is foreign은 어떤 개념의 반대말이 무엇인지, 혹은 하나의 행동을 하지 말라는 것이 곧 다른 행동을 하라는 뜻이라는 논리적 연결을 아이들이 직관적으로 이해하지 못한다는 의미입니다. 글의 도입부로서 아동기 인지 발달의 특성을 화두로 던지고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">As children (관용표현): &#39;어린 시절에&#39;라는 의미로, 전치사 as 뒤에 신분/자격을 나타내는 명사가 온 형태.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">principle<\/td><td class=\"m\">원리, 원칙<\/td><\/tr><tr><td class=\"w\">opposite<\/td><td class=\"m\">반대의, 반대<\/td><\/tr><tr><td class=\"w\">foreign<\/td><td class=\"m\">외국의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Children<\/b><\/span><span class=\"ko\">아이들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">perceive words and their meanings<\/span><\/b><\/span><span class=\"ko\">단어들과 그 의미들을 인식한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">separately<\/span> from each other.<\/b><\/span><span class=\"ko\">서로 분리해서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">아이들은 단어들과 그 의미들을 서로 분리해서 인식한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> perceive words and their meanings separately는 아이들의 머릿속에서 단어들이 하나의 그물망처럼 연결되어 있지 않고, 각각의 단어가 독립된 섬처럼 존재한다는 뜻입니다. 앞 문장에서 언급한 &#39;반대 개념이 생소한 이유&#39;를 구체적으로 보충 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">perceive words and their meanings separately (관용표현): perceive A separately (A를 별개로 인식하다). perceive는 타동사로 목적어를 취하며 부사 separately가 동사의 방식을 수식함.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 지각하다<\/td><\/tr><tr><td class=\"w\">meaning<\/td><td class=\"m\">의미, 뜻<\/td><\/tr><tr><td class=\"w\">separate<\/td><td class=\"m\">별개의, 따로 떨어진<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">It is only in later development<\/span><\/b><\/span><span class=\"ko\">오직 나중의 발달 단계에서이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> we understood<\/b><\/span><span class=\"ko\">우리가 이해하게 된 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that individual words<\/b><\/span><span class=\"ko\">개별 단어들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>directly <span class=\"grammar-hl\">connect to one another<\/span>.<\/b><\/span><span class=\"ko\">직접적으로 서로 연결되어 있다는 것을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리가 개별 단어들이 직접적으로 서로 연결되어 있다는 것을 이해하게 되는 것은 나중의 발달 단계가 되어서이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> directly connect to one another는 성인이 되면서 단어들 사이의 유기적인 관계(유의어, 반의어 등)를 파악하게 된다는 의미입니다. 아동기와 대조되는 성인기의 언어 인지 능력을 보여주며 글의 논의를 확장합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It is only in later development that (강조구문): It is ~ that 강조구문으로, 전치사구인 &#39;only in later development&#39;를 강조하기 위해 It is와 that 사이에 배치함.<\/div><div class=\"lec-gr-item\">connect to one another (관용표현): connect to ~ (~와 연결되다). &#39;one another&#39;는 &#39;서로&#39;라는 의미의 부정 대명사.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">individual<\/td><td class=\"m\">개인<\/td><\/tr><tr><td class=\"w\">directly<\/td><td class=\"m\">직접, 곧바로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>For many children,<\/b><\/span><span class=\"ko\">많은 아이들에게,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for instance,<\/b><\/span><span class=\"ko\">예를 들어,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">it is not clear<\/span><\/b><\/span><span class=\"ko\">분명하지 않다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> ‘Right’<\/b><\/span><span class=\"ko\">‘오른쪽’이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is the opposite of ‘Left’.<\/b><\/span><span class=\"ko\">‘왼쪽’의 반대라는 것은.<\/span><\/div><\/div><div class=\"lec-sent-ko\">예를 들어, 많은 아이들에게, ‘오른쪽’이 ‘왼쪽’의 반대라는 것은 분명하지 않다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> not clear that ‘Right’ is the opposite of ‘Left’는 &#39;왼쪽&#39;이라는 방향의 부정이 곧 &#39;오른쪽&#39;이라는 방향의 선택으로 즉각 연결되지 않는 아이들의 구체적인 인지 상태를 보여줍니다. 앞서 설명한 추상적인 원리를 방향 개념을 통해 예시로 들기 시작합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">it is not clear that (가주어): 진주어: it이 가주어이며, that절(that ‘Right’ is the opposite of ‘Left’)이 문장의 진짜 주어인 진주어 역할을 함.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opposite<\/td><td class=\"m\">반대의, 반대<\/td><\/tr><tr><td class=\"w\">for instance<\/td><td class=\"m\">예를 들어<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>A vivid example of this<\/b><\/span><span class=\"ko\">이것의 생생한 사례는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">can be seen<\/span><\/b><\/span><span class=\"ko\">보여질 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when children learn<\/b><\/span><span class=\"ko\">아이들이 배울 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to ride<\/span> a bicycle.<\/b><\/span><span class=\"ko\">자전거 타는 것을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이것의 생생한 사례는 아이들이 자전거 타는 것을 배울 때 보여질 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> A vivid example of this를 통해 앞에서 언급한 방향 개념의 미숙함이 실제 생활(자전거 타기)에서 어떻게 나타나는지 보여주기 위해 장면을 전환합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">can be seen (수동태): be동사(be)+p.p.(seen) 구조. see는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 can be seen 형태로 쓴다. 기본구조: V + O (see A).<\/div><div class=\"lec-gr-item\">to ride (to부정사(명사적)): 타동사인 learn의 목적어 자리에 쓰여 &#39;~하는 것&#39;으로 해석됨.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">vivid<\/td><td class=\"m\">생생한, 선명한<\/td><\/tr><tr><td class=\"w\">ride<\/td><td class=\"m\">타다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If parents <span class=\"grammar-hl\">tell their child<\/span><\/b><\/span><span class=\"ko\">만약 부모들이 자녀에게 말하면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">“Don’t go to the left,”<\/span><\/b><\/span><span class=\"ko\">“왼쪽으로 가지 마.”라고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they will often find<\/b><\/span><span class=\"ko\">그들은 종종 보게 될 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that the child will continue <span class=\"grammar-hl\">riding<\/span><\/b><\/span><span class=\"ko\">아이가 계속해서 주행할 것임을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>straight ahead<\/b><\/span><span class=\"ko\">곧장 앞으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and not automatically turn<\/b><\/span><span class=\"ko\">그리고 자동적으로 돌지 않을 것임을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to the right.<\/b><\/span><span class=\"ko\">오른쪽으로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">부모들이 자녀에게, “왼쪽으로 가지 마.”라고 말하면, 부모는 아이가 곧장 앞으로 계속 가고 자동적으로 오른쪽으로 방향을 틀지 않는 것을 종종 보게 될 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> not automatically turn to the right는 부모의 금지 명령(&quot;왼쪽 금지&quot;)이 아이에게는 그저 현재 상태의 중단일 뿐, 반대 행동(&quot;오른쪽으로 회전&quot;)에 대한 지시로 치환되지 않음을 의미합니다. 실제 상황에서 아이가 겪는 인지적 한계를 묘사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">tell their child “Don’t go to the left,” 4형식(SVOC) 구조: tell(V) + their child(O1/간접목적어) + “Don’t go to the left”(O2/직접목적어)의 구조로, 누구에게 무엇을 말해주는지 나타냄.<\/div><div class=\"lec-gr-item\">riding (동명사): continue의 목적어 역할을 하는 명사적 개념으로 쓰임.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">continue<\/td><td class=\"m\">계속하다, 계속되다<\/td><\/tr><tr><td class=\"w\">automatically<\/td><td class=\"m\">자동으로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The same applies<\/b><\/span><span class=\"ko\">같은 원리가 적용된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to the logical connection<\/b><\/span><span class=\"ko\">논리적 관계에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>between ‘Yes’ and ‘No’<\/b><\/span><span class=\"ko\">‘예’와 ‘아니요’ 사이의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as <span class=\"grammar-hl\">perceived<\/span> by parents.<\/b><\/span><span class=\"ko\">부모에 의해 인식되는 것과 같이.<\/span><\/div><\/div><div class=\"lec-sent-ko\">같은 원리가 부모가 인식하는 ‘예’와 ‘아니요’ 사이의 논리적 관계에도 적용된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> The same applies to는 방향(좌우)의 문제뿐만 아니라, 더 일반적인 긍정과 부정의 논리 영역에서도 아이들은 동일한 어려움을 겪는다는 점을 짚어줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">perceived (과거분사(형용사)): perceived가 connection을 수식하며 &#39;인식되는 연결&#39;의 의미를 나타냄. (N + p.p. 구조: connection which is perceived by parents)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 지각하다<\/td><\/tr><tr><td class=\"w\">apply<\/td><td class=\"m\">(apply to) ~에 해당하다<\/td><\/tr><tr><td class=\"w\">logical<\/td><td class=\"m\">논리적인<\/td><\/tr><tr><td class=\"w\">connection<\/td><td class=\"m\">연결, 관계<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When we were children<\/b><\/span><span class=\"ko\">우리가 아이였을 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">were told<\/span>,<\/b><\/span><span class=\"ko\">그리고 말을 들었을 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for example,<\/b><\/span><span class=\"ko\">예를 들어,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“No, don’t eat with your hands,”<\/b><\/span><span class=\"ko\">“안 돼, 손으로 먹지 마.”라고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we were confused<\/b><\/span><span class=\"ko\">우리는 혼란스러웠고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and didn’t know<\/b><\/span><span class=\"ko\">몰랐다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">what our parents expected<\/span><\/b><\/span><span class=\"ko\">우리 부모가 무엇을 기대하는지<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from us.<\/b><\/span><span class=\"ko\">우리로부터.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리가 아이였을 때, 예를 들어, “안 돼, 손으로 먹지 마.”라는 말을 들었을 때, 우리는 혼란스러웠고, 우리 부모가 우리로부터 기대하는 것이 무엇인지 몰랐다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> didn’t know what our parents expected는 &quot;손을 쓰지 마라&quot;는 말이 &quot;도구를 사용해라&quot;라는 긍정적인 행동 지침으로 변환되지 않아 아이가 행동의 갈피를 잡지 못하는 상황을 뜻합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">were told (수동태): be동사(were)+p.p.(told). tell은 타동사로 tell+O+O(4형식) 구조인데, 간접목적어인 we가 주어로 올라가 수동구조 were told가 되고, 뒤에는 직접목적어인 직접인용문(“No, don’t eat...”)이 그대로 남는다. 기본구조: V + O + O (tell someone something).<\/div><div class=\"lec-gr-item\">what our parents expected (간접의문문): [의문사(what) + 주어(our parents) + 동사(expected)]의 어순을 취하며, know의 목적어 역할을 하는 명사절.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">confuse<\/td><td class=\"m\">혼란스럽게 하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Our confusion was about<\/b><\/span><span class=\"ko\">우리의 혼란은 ~에 관한 것이었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>whether we should continue <span class=\"grammar-hl\">eating<\/span><\/b><\/span><span class=\"ko\">우리가 계속 먹어야 하는지<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or not<\/b><\/span><span class=\"ko\">아닌지<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and if so,<\/b><\/span><span class=\"ko\">그리고 만약 그렇다면,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>how?<\/b><\/span><span class=\"ko\">어떻게 해야 하는지에 대해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리의 혼란은 계속 먹어야 하는 건지 아닌지, 만약 먹는다면 어떻게 해야 하지?에 대한 것이었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> whether we should continue eating or not은 아이가 &#39;손으로 먹는 행위&#39;만 금지된 것인지, &#39;먹는 행위&#39; 전체가 금지된 것인지 구분하지 못해 겪는 당혹감을 구체적으로 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">eating (동명사): continue의 목적어 역할을 하는 명사적 개념으로 쓰임.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">continue<\/td><td class=\"m\">계속하다, 계속되다<\/td><\/tr><tr><td class=\"w\">confusion<\/td><td class=\"m\">혼란, 혼동<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Only later<\/span><\/b><\/span><span class=\"ko\">나중에서야<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">did we recognize<\/span> the connection<\/b><\/span><span class=\"ko\">우리는 그 연관성을 인식했고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and understand<\/b><\/span><span class=\"ko\">이해했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that we should continue <span class=\"grammar-hl\">eating<\/span>,<\/b><\/span><span class=\"ko\">우리가 계속 먹어야 한다는 것을,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but not with our hands<\/b><\/span><span class=\"ko\">하지만 손으로가 아니라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but with a fork or a spoon.<\/b><\/span><span class=\"ko\">포크나 숟가락으로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나중에서야 우리는 그 연관성을 인식했고, 우리가 손이 아니라 포크나 숟가락으로 계속 먹어야 한다는 것을 이해하게 되었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> recognize the connection은 특정 행동의 금지가 대안적인 올바른 행동(도구 사용)을 암시한다는 논리적 추론이 가능해졌음을 의미합니다. 글 전체의 결론으로, 인지 발달을 통해 반대 개념과 논리적 연결을 완성하게 됨을 정리합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Only later did we recognize (도치): 부정의 의미를 담은 한정어구 &#39;Only later&#39;가 문두로 강조되어 나오면서 [조동사(did) + 주어(we) + 동사원형(recognize)] 어순으로 도치됨.<\/div><div class=\"lec-gr-item\">eating (동명사): continue의 목적어 역할을 하는 명사적 개념으로 쓰임.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">connection<\/td><td class=\"m\">연결, 관계<\/td><\/tr><tr><td class=\"w\">continue<\/td><td class=\"m\">계속하다, 계속되다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>어린아이들은 &#39;반대&#39;라는 논리적 개념을 이해하는 데 서툴러서 단어들을 서로 독립된 것으로 인식한다.<\/li><li>예를 들어, 아이들은 왼쪽으로 가지 말라는 말을 들어도 그것을 오른쪽으로 가라는 뜻으로 곧장 연결하지 못한다.<\/li><li>식사 예절에서도 &quot;손으로 먹지 마&quot;라는 말을 들으면 식사 자체를 멈춰야 하는지 혼란을 느낀다.<\/li><li>성장하면서 단어들 사이의 유기적 관계를 이해하게 되어야 비로소 금지된 행동 대신 수행해야 할 올바른 행동을 파악할 수 있게 된다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Children perceive words as separate entities until they eventually develop the cognitive maturity to connect them through logical opposites and relational meanings.<\/div>\n              <div class=\"lec-final-sum-ko\">아이들은 단어를 개별적인 실체로 인식하다가 결국 논리적인 반대 개념과 관계적 의미를 통해 그것들을 연결하는 인지적 성숙을 이룬다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/18.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/19.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/21.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/22.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/23.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/24.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/25.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_37번_강의_audio/26.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025 ze)"]}],"bkg":"아동의 발달 과정에서 단어 간의 상관관계를 파악하는 인지적 성숙(Cognitive Maturation)은 점진적으로 이루어지는데, 특히 서로 반대되는 개념인 이분법적 대립(Binary Opposites)을 이해하는 데는 상당한 시간이 필요합니다. 아이들은 초기에 각 단어를 서로 연결되지 않은 독립적인 정보로 인식하기 때문에, 특정 행동을 금지하는 부정어(Negation)를 들었을 때 그 반대 급부의 행동을 자동으로 도출해내는 추론 능력(Inference Ability)이 성인에 비해 부족할 수밖에 없습니다. 예를 들어 'A가 아니다'라는 말을 들었을 때 성인은 즉각적으로 'B를 해야 한다'라고 논리적 판단을 내리지만, 아이들에게는 단순히 현재 행동의 중단만을 의미할 뿐 다음에 취해야 할 대안적 행동(Alternative Behavior)을 지시하는 신호로 연결되지 않는 것입니다. 마치 목적지 정보 없이 '그 길은 막혔다'는 말만 들은 운전자가 어디로 갈지 몰라 당황하는 것처럼, 아이들도 언어의 논리적 연결성(Logical Connectivity)을 완전히 학습하기 전까지는 부모의 부정적 피드백 앞에서 행동의 갈피를 잡지 못하는 혼란을 겪게 됩니다.","ttsText":"아동의 발달 과정에서 단어 간의 상관관계를 파악하는 인지적 성숙(Cognitive Maturation)은 점진적으로 이루어지는데, 특히 서로 반대되는 개념인 이분법적 대립(Binary Opposites)을 이해하는 데는 상당한 시간이 필요합니다. 아이들은 초기에 각 단어를 서로 연결되지 않은 독립적인 정보로 인식하기 때문에, 특정 행동을 금지하는 부정어(Negation)를 들었을 때 그 반대 급부의 행동을 자동으로 도출해내는 추론 능력(Inference Ability)이 성인에 비해 부족할 수밖에 없습니다. 예를 들어 'A가 아니다'라는 말을 들었을 때 성인은 즉각적으로 'B를 해야 한다'라고 논리적 판단을 내리지만, 아이들에게는 단순히 현재 행동의 중단만을 의미할 뿐 다음에 취해야 할 대안적 행동(Alternative Behavior)을 지시하는 신호로 연결되지 않는 것입니다. 마치 목적지 정보 없이 '그 길은 막혔다'는 말만 들은 운전자가 어디로 갈지 몰라 당황하는 것처럼, 아이들도 언어의 논리적 연결성(Logical Connectivity)을 완전히 학습하기 전까지는 부모의 부정적 피드백 앞에서 행동의 갈피를 잡지 못하는 혼란을 겪게 됩니다.","__passage":"모의고사 / 고1 / 2025년 / 10월 / 37번","__sourcePassage":"모의고사 / 고1 / 2025년 / 10월 / 37번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고1 / 2025년 / 10월 / 37번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고1 / 2025년 / 10월 / 37번","titleEn":"Understanding Opposites: A Developmental Milestone in Children's Language Acquisition","titleKo":"반대 개념 이해하기: 아동 언어 습득의 발달적 이정표","imageUrl":"__enpImg__","stages":[{"label":"01반대 원리의 생소함","items":["어린 시절 아이들은 반대 개념의 원리를 잘 이해하지 못하며 단어를 개별적으로 인식한다.","단어와 의미를 서로 별개의 것으로 인지함","단어들이 서로 직접 연결된다는 사실은 발달 후반에야 이해함","핵심 키워드: 반대 원리(principle of opposites)"]},{"label":"02방향 개념의 사례","items":["아이들에게 특정 방향의 반대 방향으로 전환하는 것은 당연한 논리가 아니다.","자전거를 탈 때 \"왼쪽으로 가지 마라\"는 말을 들어도 오른쪽으로 꺾지 않음","지시를 받아도 기존의 방향대로 직진(straigh
