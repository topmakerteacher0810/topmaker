게 활용하느냐에 따라 우리는 부정적인 감정의 굴레에서 벗어나 스스로의 심리 상태를 유리한 방향으로 이끌 수 있는 강력한 열쇠를 쥐게 되는 것입니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01인지와 감정의 밀접한 관계<\/div><ul><li>인지와 감정은 서로 상반된 개념이 아니라 인지가 감정의 핵심적인 구성 요소이다.<\/li><li>사고방식이 우리가 경험하는 감정을 형성함<\/li><li>인지와 감정은 서로 떼어놓을 수 없는 관계임<\/li><li>핵심 키워드: 인지(cognition), 구성 요소(building block)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02상호 방향성 피드백<\/div><ul><li>우리의 생각은 감정을 만들고, 그 감정은 다시 사고방식에 영향을 미치는 순환 구조를 가진다.<\/li><li>사고가 감정에 영향을 주고 감정이 사고로 다시 메아리침<\/li><li>핵심 키워드: 상호 방향성(bi-directionality), 메아리(echo back)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03부정적 순환의 사례<\/div><ul><li>시험에 대한 부정적인 인지는 불안을 유발하고 이는 다시 부정적 사고를 강화하는 근거가 된다.<\/li><li>&quot;나는 시험을 못 봐&quot;라는 생각이 불안(anxiety)을 증폭시킴<\/li><li>좋지 않은 기분이 부정적 사고를 지속시키는 증거(evidence)가 됨<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04사고 전환을 통한 감정 조절<\/div><ul><li>인지와 감정의 연결 고리를 이해하면 생각의 변화를 통해 감정을 조절할 수 있다.<\/li><li>사고 방식을 바꿈(changing the way we think)으로써 감정을 조정함<\/li><li>어려운 감정도 인지적 변화를 통해 대처 가능함<\/li><li>핵심 키워드: 조절하다(adjust), 사고 방식(way we think)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05감정의 긍정적 재정의<\/div><ul><li>긴장감을 긍정적인 신호로 재해석하여 인지적 경로를 자신에게 유리하게 활용한다.<\/li><li>긴장을 단순한 떨림이 아닌 흥분(excitement)이나 준비 상태로 재정의함<\/li><li>사고의 전환을 통해 상황을 자신에게 유리(advantage)하게 이끎<\/li><li>핵심 키워드: 기대(anticipation), 유리함(advantage)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">despite<\/td><td class=\"m\">~에도 불구하고<\/td><\/tr><tr><td class=\"w\">cultural<\/td><td class=\"m\">문화의, 문화적인<\/td><\/tr><tr><td class=\"w\">depict<\/td><td class=\"m\">그리다, 묘사하다<\/td><\/tr><tr><td class=\"w\">emotion<\/td><td class=\"m\">감정<\/td><\/tr><tr><td class=\"w\">opposite<\/td><td class=\"m\">반대의, 반대<\/td><\/tr><tr><td class=\"w\">rational<\/td><td class=\"m\">합리적인, 이성적인<\/td><\/tr><tr><td class=\"w\">cognition<\/td><td class=\"m\">인지, 인식<\/td><\/tr><tr><td class=\"w\">commonly<\/td><td class=\"m\">흔히, 보통<\/td><\/tr><tr><td class=\"w\">refer<\/td><td class=\"m\">(refer to) 가리키다, 언급하다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">block<\/td><td class=\"m\">덩어리, 블록<\/td><\/tr><tr><td class=\"w\">circumstance<\/td><td class=\"m\">상황, 사정<\/td><\/tr><tr><td class=\"w\">influence<\/td><td class=\"m\">영향을 미치다<\/td><\/tr><tr><td class=\"w\">for instance<\/td><td class=\"m\">예를 들어<\/td><\/tr><tr><td class=\"w\">anxiety<\/td><td class=\"m\">불안, 걱정<\/td><\/tr><tr><td class=\"w\">increase<\/td><td class=\"m\">증가하다, 늘리다<\/td><\/tr><tr><td class=\"w\">performance<\/td><td class=\"m\">성과, 수행<\/td><\/tr><tr><td class=\"w\">evidence<\/td><td class=\"m\">증거<\/td><\/tr><tr><td class=\"w\">continue<\/td><td class=\"m\">계속하다, 계속되다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Despite the cultural trope <span class=\"grammar-hl\">depicting emotions<\/span><\/b><\/span><span class=\"ko\">감정을 묘사하는 문화적인 비유적 표현에도 불구하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as the opposite of rational thought,<\/b><\/span><span class=\"ko\">합리적인 사고의 반대로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>cognition—<span class=\"grammar-hl\">what we commonly refer to as thinking<\/span>—<\/b><\/span><span class=\"ko\">우리가 흔히 생각이라고 일컫는 것인 인지는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is actually a key building block of emotion.<\/b><\/span><span class=\"ko\">사실 감정의 핵심 구성 요소이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">감정을 합리적인 사고의 반대로 묘사하는 문화적인 비유적 표현에도 불구하고, 우리가 흔히 생각이라고 일컫는 것, 즉 인지는 사실 감정의 핵심 구성 요소이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 문장은 글의 도입부로, 감정과 이성이 서로 대립한다는 일반적인 통념을 언급하며 시작합니다. a key building block of emotion은 인지가 감정의 밑바탕이 되어 감정이라는 결과를 만들어낸다는 의미입니다. 즉, 이 문장은 우리가 느끼는 감정이 사실은 우리의 생각(인지)에서 비롯된다는 글의 핵심 주제를 제시하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">depicting emotions (현재분사(형용사)): depicting이 앞의 명사인 cultural trope를 수식하며 &#39;감정을 ~라고 묘사하는&#39;이라는 의미의 형용사 역할을 한다. N + -ing ≈ N that is -ing 구조다.<\/div><div class=\"lec-gr-item\">what we commonly refer to as thinking (관계대명사): 선행사를 포함하는 관계대명사 what이 이끄는 명사절로, 문장에서 cognition과 동격의 부연 설명이나 목적어적 성격을 띤다.<\/div><div class=\"lec-gr-item\">thinking (동명사): 전치사 as의 목적어 자리에 위치하여 &#39;생각하는 것&#39;이라는 행위를 나타내는 명사적 성격의 -ing다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">despite<\/td><td class=\"m\">~에도 불구하고<\/td><\/tr><tr><td class=\"w\">cultural<\/td><td class=\"m\">문화의, 문화적인<\/td><\/tr><tr><td class=\"w\">depict<\/td><td class=\"m\">그리다, 묘사하다<\/td><\/tr><tr><td class=\"w\">emotion<\/td><td class=\"m\">감정<\/td><\/tr><tr><td class=\"w\">opposite<\/td><td class=\"m\">반대의, 반대<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rational<\/td><td class=\"m\">합리적인, 이성적인<\/td><\/tr><tr><td class=\"w\">cognition<\/td><td class=\"m\">인지, 인식<\/td><\/tr><tr><td class=\"w\">commonly<\/td><td class=\"m\">흔히, 보통<\/td><\/tr><tr><td class=\"w\">refer<\/td><td class=\"m\">(refer to) 가리키다, 언급하다<\/td><\/tr><tr><td class=\"w\">block<\/td><td class=\"m\">덩어리, 블록<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">How we think about our circumstances<\/span><\/b><\/span><span class=\"ko\">우리가 우리의 상황에 대해 생각하는 방식은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>shapes <span class=\"grammar-hl\">the emotions we experience<\/span>;<\/b><\/span><span class=\"ko\">우리가 경험하는 감정을 형성한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>then those emotions echo back<\/b><\/span><span class=\"ko\">그 다음에 그 감정들은 다시 반향한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to influence<\/span> <span class=\"grammar-hl\">how we think<\/span>.<\/b><\/span><span class=\"ko\">우리가 생각하는 방식에 영향을 미치기 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리가 우리의 상황에 대해 ‘생각하는’ 방식은 우리가 경험하는 감정을 형성한다. 그 다음에 그 감정들은 반향되어 우리가 생각하는 방식에 영향을 미친다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 제시한 인지와 감정의 관계를 더 구체화하여 설명하는 문장입니다. echo back to influence는 한 번 발생한 감정이 거기서 끝나는 것이 아니라, 다시 사고 과정에 개입하여 우리의 판단을 특정한 방향으로 유도한다는 의미입니다. 이는 인지와 감정이 일방향이 아닌 서로를 강화하는 순환 구조임을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">How we think about our circumstances (간접의문문): 의문사(How) + 주어(we) + 동사(think) 어순의 명사절로, 문장의 주어 역할을 한다.<\/div><div class=\"lec-gr-item\">the emotions we experience (관계대명사): 선행사 emotions 뒤에 목적격 관계대명사(that/which)가 생략된 구조이며, 뒤의 절(we experience)이 선행사를 수식한다.<\/div><div class=\"lec-gr-item\">to influence (to부정사(부사적): 결과): 동사 echo back 뒤에 이어져서 &#39;메아리처럼 돌아와 결국 영향을 미치다&#39;라는 결과를 나타낸다. 앞선 동작 이후에 일어난 사건을 설명한다.<\/div><div class=\"lec-gr-item\">how we think (간접의문문): 의문사(how) + 주어(we) + 동사(think) 어순의 명사절로, 타동사 influence의 목적어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emotion<\/td><td class=\"m\">감정<\/td><\/tr><tr><td class=\"w\">circumstance<\/td><td class=\"m\">상황, 사정<\/td><\/tr><tr><td class=\"w\">influence<\/td><td class=\"m\">영향을 미치다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>For instance,<\/b><\/span><span class=\"ko\">예를 들어<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>if you walk into a test<\/b><\/span><span class=\"ko\">만약 여러분이 시험을 보러 걸어 들어간다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">thinking you are bad at taking tests<\/span>,<\/b><\/span><span class=\"ko\">여러분이 시험 보는 것을 잘 못한다고 생각하며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>your anxiety <span class=\"grammar-hl\">will be increased<\/span>.<\/b><\/span><span class=\"ko\">여러분의 불안은 증가할 것이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">예를 들어, 만약 여러분이 시험 보는 것을 잘 못한다고 생각하며 시험을 보러 걸어 들어간다면, 여러분의 불안은 증가할 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 설명한 추상적인 순환 구조를 독자가 이해하기 쉽게 시험이라는 구체적인 사례로 뒷받침합니다. walk into a test 상황에서 &#39;부정적인 생각&#39;이 어떻게 즉각적으로 &#39;불안&#39;이라는 감정을 증폭시키는지 보여주는 단계입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">thinking you are bad at taking tests (분사구문): 주절의 주어인 you의 동시동작이나 상태를 부연 설명한다. 원래 절인 &#39;while you think you are bad at taking tests&#39;에서 접속사와 주어가 생략되고 동사가 -ing 형태로 변한 구조다.<\/div><div class=\"lec-gr-item\">taking (동명사): 전치사 at의 목적어 자리에 위치하여 &#39;시험을 치는 것&#39;이라는 행위를 나타내는 명사적 성격의 -ing다.<\/div><div class=\"lec-gr-item\">will be increased (수동태): be동사(will be)+p.p.(increased) 구조. increase는 타동사인데 뒤에 목적어가 없어서 수동구조 will be increased 형태로 쓴다. 기본구조: V + O.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for instance<\/td><td class=\"m\">예를 들어<\/td><\/tr><tr><td class=\"w\">anxiety<\/td><td class=\"m\">불안, 걱정<\/td><\/tr><tr><td class=\"w\">increase<\/td><td class=\"m\">증가하다, 늘리다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Then<\/b><\/span><span class=\"ko\">그러면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you don’t feel good<\/b><\/span><span class=\"ko\">여러분은 기분이 좋지 않다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>about your performance on the test,<\/b><\/span><span class=\"ko\">그 시험에서의 여러분의 수행에 대해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and that becomes evidence<\/b><\/span><span class=\"ko\">그리고 그것은 근거가 된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for <span class=\"grammar-hl\">continuing<\/span> <span class=\"grammar-hl\">to think<\/span><\/b><\/span><span class=\"ko\">계속 생각하는 것에 대한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that you’re bad at <span class=\"grammar-hl\">test taking<\/span>.<\/b><\/span><span class=\"ko\">여러분이 시험 보는 것을 잘 못한다고.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러면 여러분은 그 시험에서 자신의 수행에 대해 기분이 좋지 않고, 그것은 여러분이 시험 보는 것을 잘 못한다고 ‘생각하는’ 것을 지속하는 근거가 된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 3번 문장에서 발생한 불안감이 어떻게 다시 사고에 영향을 주는지 설명합니다. becomes evidence는 감정적으로 위축된 상태가 &#39;나는 역시 시험에 약해&#39;라는 부정적인 자기 확신을 굳히는 근거로 활용된다는 의미입니다. 이로써 사고와 감정의 악순환이 완성됩니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">continuing (동명사): 전치사 for의 목적어 자리에 위치하여 &#39;계속하는 것&#39;이라는 명사적 역할을 수행하는 -ing다.<\/div><div class=\"lec-gr-item\">to think (to부정사(명사적)): 준동사 continuing의 목적어 역할을 수행하며, &#39;생각하는 것&#39;이라는 의미로 쓰였다.<\/div><div class=\"lec-gr-item\">test taking (동명사): 시험을 치는 활동이나 용도를 나타내는 명사적 개념으로, test와 결합하여 하나의 명사구처럼 쓰인 -ing다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">performance<\/td><td class=\"m\">성과, 수행<\/td><\/tr><tr><td class=\"w\">evidence<\/td><td class=\"m\">증거<\/td><\/tr><tr><td class=\"w\">continue<\/td><td class=\"m\">계속하다, 계속되다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In this way,<\/b><\/span><span class=\"ko\">이런 식으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>there’s simply no <span class=\"grammar-hl\">pulling<\/span><\/b><\/span><span class=\"ko\">결코 끌어내는 것은 불가능하다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>emotion and cognition apart.<\/b><\/span><span class=\"ko\">감정과 인지를 따로 떼어.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이런 식으로 감정과 인지는 결코 분리할 수 없다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 시험 예시를 통해 보여준 내용을 바탕으로 내린 중간 결론입니다. no pulling emotion and cognition apart는 두 요소가 실타래처럼 엉켜 있어 어느 한쪽을 변화시키면 다른 쪽도 반드시 반응할 수밖에 없는 일체형 구조임을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">pulling (동명사): &#39;There is no -ing&#39; 구문 내에서 &#39;~하는 것은 불가능하다/없다&#39;는 의미를 나타내는 명사적 성격의 -ing다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emotion<\/td><td class=\"m\">감정<\/td><\/tr><tr><td class=\"w\">cognition<\/td><td class=\"m\">인지, 인식<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This bi-directionality of cognition and emotion<\/b><\/span><span class=\"ko\">인지와 감정의 이러한 양방향성은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">allows us to adjust<\/span> difficult emotions<\/b><\/span><span class=\"ko\">우리가 어려운 감정들을 조정하는 것을 가능하게 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by <span class=\"grammar-hl\">changing<\/span> <span class=\"grammar-hl\">the way we think<\/span>.<\/b><\/span><span class=\"ko\">우리가 생각하는 방식을 바꿈으로써.<\/span><\/div><\/div><div class=\"lec-sent-ko\">인지와 감정의 이러한 양방향성은 우리가 생각하는 방식을 바꿈으로써 어려운 감정들을 조정하는 것을 가능하게 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 분석을 바탕으로 이 글이 궁극적으로 하고 싶은 해결책이나 시사점을 제시합니다. adjust difficult emotions는 인지와 감정이 연결되어 있다는 사실을 역이용하여, 통제하기 힘든 불안이나 슬픔 같은 감정의 강도를 사고의 전환을 통해 다스릴 수 있다는 희망적인 가능성을 열어줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">allows us to adjust 5형식(SVOC) 구조: 동사(allow) + 목적어(us) + 목적격보어(to adjust) 구조다. allow는 목적격보어로 to부정사를 취하는 대표적인 동사다.<\/div><div class=\"lec-gr-item\">changing (동명사): 전치사 by의 목적어 자리에 위치하여 &#39;~함으로써&#39;라는 수단을 나타내는 명사적 성격의 -ing다.<\/div><div class=\"lec-gr-item\">the way we think (관계부사): 선행사 the way 뒤에 관계부사 how를 대신하는 that이나 in which가 생략된 구조로, 뒤에 오는 절(we think)이 선행사를 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emotion<\/td><td class=\"m\">감정<\/td><\/tr><tr><td class=\"w\">cognition<\/td><td class=\"m\">인지, 인식<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>By <span class=\"grammar-hl\">thinking differently<\/span> —<\/b><\/span><span class=\"ko\">다르게 생각함으로써 —<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I get nervous sometimes,<\/b><\/span><span class=\"ko\">나는 때때로 긴장하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but I’m still a good test taker,<\/b><\/span><span class=\"ko\">나는 여전히 시험 보는 것을 잘하는 사람이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or that nervous feeling<\/b><\/span><span class=\"ko\">혹은 그 긴장되는 느낌은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is just excitement and anticipation,<\/b><\/span><span class=\"ko\">단지 흥분과 기대이며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it means I’m ready —<\/b><\/span><span class=\"ko\">그것은 내가 준비되었다는 것을 의미한다 —<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you can work those pathways<\/b><\/span><span class=\"ko\">여러분은 그러한 경로들을 작동시킬 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to your advantage.<\/b><\/span><span class=\"ko\">여러분에게 유리하게.<\/span><\/div><\/div><div class=\"lec-sent-ko\">‘나는 때때로 긴장하지만, 여전히 시험 보는 것을 잘하는 사람이다.’ 혹은 ‘그 긴장되는 느낌은 단지 흥분과 기대이며, 그것은 내가 준비되었다는 것을 의미한다.’라고 다르게 생각함으로써, 여러분은 그러한 경로들을 여러분에게 유리하게 작동시킬 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 마지막 문장으로, 6번에서 제시한 해결책의 구체적인 실천 방법을 보여줍니다. work those pathways to your advantage는 부정적 감정으로 흐르던 뇌의 연결 고리를 긍정적인 해석을 통해 재구성함으로써, 심리적 에너지를 자신에게 도움이 되는 방향으로 돌려놓을 수 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">thinking differently (동명사): 전치사 By의 목적어 자리에 위치하여 &#39;다르게 생각하는 것&#39;이라는 명사적 개념을 나타내는 -ing다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>흔히 감정과 이성은 반대라고 생각하지만, 사실 인지(사고)는 감정을 만드는 핵심 요소이다.<\/li><li>생각은 감정을 만들고, 그 감정은 다시 생각에 영향을 주는 상호 순환 구조를 가진다.<\/li><li>시험을 못 본다는 생각이 불안을 키우고, 그 불안이 다시 부정적 확신을 만드는 악순환이 그 예이다.<\/li><li>이러한 양방향성을 이용하면, 생각을 의도적으로 바꿈으로써 부정적인 감정을 조절하고 자신에게 유리한 상태를 만들 수 있다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Since cognition and emotion are bi-directionally linked, individuals can manage their emotional states by consciously changing their thinking patterns.<\/div>\n              <div class=\"lec-final-sum-ko\">인지와 감정은 양방향으로 연결되어 있기 때문에, 개인은 사고 패턴을 의식적으로 변화 3번_강의_audio/30.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_33번_강의_audio/31.mp3","hl":null}]],"fileName":"모의고사_고1_2025년_10월_33번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 10월 / 33번","titleEn":"Cognition and Emotion: Two Sides of the Same Coin","titleKo":"인지와 감정: 동전의 양면과 같은 관계","imageUrl":"__enpImg__","stages":[{"label":"01인지와 감정의 밀접한 관계","items":["인지와 감정은 서로 상반된 개념이 아니라 인지가 감정의 핵심적인 구성 요소이다.","사고방식이 우리가 경험하는 감정을 형성함","인지와 감정은 서로 떼어놓을 수 없는 관계임","핵심 키워드: 인지(cognition), 구성 요소(building block)"]},{"label":"02상호 방향성 피드백","items":["우리의 생각은 감정을 만들고, 그 감정은 다시 사고방식에 영향을 미치는 순환 구조를 가진다.","사고가 감정에 영향을 주고 감정이 사고로 다시 메아리침","핵심 키워드: 상호 방향성(bi-directionality), 메아리(echo back)"]},{"label":"03부정적 순환의 사례","items":["시험에 대한 부정적인 인지는 불안을 유발하고 이는 다시 부정적 사고를 강화하는 근거가 된다.","\"나는 시험을 못 봐\"라는 생각이 불안(anxiety)을 증폭시킴","좋지 않은 기분이 부정적 사고를 지속시키는 증거(evidence)가 됨"]},{"label":"04사고 전환을 통한 감정 조절","items":["인지와 감정의 연결 고리를 이해하면 생각의 변화를 통해 감정을 조절할 수 있다.","사고 방식을 바꿈(changing the way we think)으로써 감정을 조정함","어려운 감정도 인지적 변화를 통해 대처 가능함","핵심 키워드: 조절하다(adjust), 사고 방식(way we think)"]},{"label":"05감정의 긍정적 재정의","items":["긴장감을 긍정적인 신호로 재해석하여 인지적 경로를 자신에게 유리하게 활용한다.","긴장을 단순한 떨림이 아닌 흥분(excitement)이나 준비 상태로 재정의함","사고의 전환을 통해 상황을 자신에게 유리(advantage)하게 이끎","핵심 키워드: 기대(anticipation), 유리함(advantage)"]}],"bkg":"흔히 감정과 이성을 서로 반대되는 개념으로 생각하기 쉽지만, 심리학에서는 우리가 상황을 어떻게 해석하느냐가 감정을 결정한다는 인지 평가 이론(Cognitive Appraisal Theory)을 중요하게 다룹니다. 이는 사고와 감정이 서로 독립적인 것이 아니라, 마치 뫼비우스의 띠처럼 끊임없이 영향을 주고받는 양방향성(Bi-directionality)을 가지고 있음을 의미하는데요. 예를 들어, 중요한 시험을 앞두고 두근거리는 심장 박동을 '불안'이 아닌 나를 도와줄 '설렘(Excitement)'으로 다시 정의하는 것처럼, 상황에 대한 관점을 바꾸어 감정을 조절하는 전략을 인지적 재평가(Cognitive Reappraisal)라고 부릅니다. 결국 인지(Cognition)라는 사고의 틀을 어떻게 활용하느냐에 따라 우리는 부정적인 감정의 굴레에서 벗어나 스스로의 심리 상태를 유리한 방향으로 이끌 수 있는 강력한 열쇠를 쥐게 되는 것입니다.","ttsText":"흔히 감정과 이성을 서로 반대되는 개념으로 생각하기 쉽지만, 심리학에서는 우리가 상황을 어떻게 해석하느냐가 감정을 결정한다는 인지 평가 이론(Cognitive Appraisal Theory)을 중요하게 다룹니다. 이는 사고와
