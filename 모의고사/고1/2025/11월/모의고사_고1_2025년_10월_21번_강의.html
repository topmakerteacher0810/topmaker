Ecosystem Services)가 모든 계층에게 공평하게 돌아가기 위해서는 개발과 동시에 원주민의 주거권을 보호하는 정책적 균형이 무엇보다 중요합니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도시 재생의 목적<\/div><ul><li>낙후 지역의 환경을 개선하고 주민의 복지를 증진하기 위해 도시 재생이 추진된다.<\/li><li>핵심 목표: 거주민의 웰빙(wellbeing) 개선<\/li><li>환경적 부정의(environmental injustice) 문제 해결 시도<\/li><li>낙후된 지역(degraded areas)의 환경 개선 프로젝트 추진<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02녹지 공간의 역설 발생<\/div><ul><li>저소득층 지역에 고품질의 녹지가 조성되면서 예상치 못한 부작용이 나타난다.<\/li><li>핵심 개념: 도시 녹지 공간의 역설 (urban green space paradox)<\/li><li>녹지 조성으로 인한 지역 매력도(attractiveness)와 선호도 상승<\/li><li>환경 개선이 오히려 지역의 경제적 가치를 급격히 변화시킴<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03거주 비용의 상승<\/div><ul><li>지역 환경이 좋아짐에 따라 주택 가격과 임대료가 기존 주민이 감당하기 힘든 수준으로 오른다.<\/li><li>주거 비용(cost of housing) 및 임대료(rent)의 동반 상승<\/li><li>저소득층 및 소수 민족 가구의 경제적 부담 가중<\/li><li>핵심 현상: 거주민의 지불 능력 상실<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04기존 주민의 소외와 축출<\/div><ul><li>녹지 혜택을 받아야 할 원주민들이 오히려 지역에서 쫓겨나는 결과가 초래된다.<\/li><li>원주민의 배제(exclusion) 및 강제적인 퇴거(displacement) 발생<\/li><li>생태계 서비스(ecosystem services) 혜택으로부터 소외됨<\/li><li>녹지 인프라 접근성이 낮은 또 다른 낙후 지역으로 이주하게 됨<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">currently<\/td><td class=\"m\">현재, 지금<\/td><\/tr><tr><td class=\"w\">urban<\/td><td class=\"m\">도시의<\/td><\/tr><tr><td class=\"w\">project<\/td><td class=\"m\">투사하다, 예상하다<\/td><\/tr><tr><td class=\"w\">degrade<\/td><td class=\"m\">분해되다, 떨어뜨리다<\/td><\/tr><tr><td class=\"w\">promote<\/td><td class=\"m\">촉진하다, 장려하다<\/td><\/tr><tr><td class=\"w\">improve<\/td><td class=\"m\">나아지게 하다, 향상시키다<\/td><\/tr><tr><td class=\"w\">resident<\/td><td class=\"m\">주민, 거주자<\/td><\/tr><tr><td class=\"w\">injustice<\/td><td class=\"m\">불평등, 부당함<\/td><\/tr><tr><td class=\"w\">improvement<\/td><td class=\"m\">개선, 향상<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ethnic<\/td><td class=\"m\">민족의, 인종의<\/td><\/tr><tr><td class=\"w\">community<\/td><td class=\"m\">지역 사회, 공동체<\/td><\/tr><tr><td class=\"w\">income<\/td><td class=\"m\">소득, 수입<\/td><\/tr><tr><td class=\"w\">household<\/td><td class=\"m\">가정, 가구(家口)<\/td><\/tr><tr><td class=\"w\">paradox<\/td><td class=\"m\">역설<\/td><\/tr><tr><td class=\"w\">creation<\/td><td class=\"m\">창조, 창출<\/td><\/tr><tr><td class=\"w\">quality<\/td><td class=\"m\">질, 품질<\/td><\/tr><tr><td class=\"w\">increase<\/td><td class=\"m\">증가하다, 늘리다<\/td><\/tr><tr><td class=\"w\">desirable<\/td><td class=\"m\">바람직한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Currently,<\/b><\/span><span class=\"ko\">현재,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>urban regeneration projects<\/b><\/span><span class=\"ko\">도시 재생 프로젝트는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in <span class=\"grammar-hl\">degraded areas<\/span><\/b><\/span><span class=\"ko\">낙후된 지역의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">have been promoted<\/span><\/b><\/span><span class=\"ko\">추진되어 왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as improving the wellbeing of residents<\/b><\/span><span class=\"ko\">거주자들의 복지를 향상시키고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and solving environmental injustice problems.<\/b><\/span><span class=\"ko\">환경적 불평등 문제를 해결하는 것으로서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">현재, 낙후된 지역에서 도시 재생 프로젝트는 거주자들의 복지를 향상시키고 환경적 불평등 문제를 해결하는 것으로서 추진되어 왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> urban regeneration projects는 낡고 쇠퇴한 동네를 다시 활성화하는 사업을 말합니다. 이 문장은 글의 도입부로, 도시 재생이 원래는 가난한 동네 사람들의 삶을 개선하고 차별적인 환경 문제를 고쳐주겠다는 선한 의도와 기대를 가지고 시작되었음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">degraded areas (과거분사(형용사)): 과거분사 degraded가 뒤에 오는 명사 areas를 수식한다(= &quot;퇴보한/낙후된 지역&quot;).<\/div><div class=\"lec-gr-item\">have been promoted (수동태): be동사(been)+p.p.(promoted) 구조. promote는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 have been promoted 형태로 쓴다. 기본구조: V + O + as B (A를 B라고 홍보/장려하다).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">currently<\/td><td class=\"m\">현재, 지금<\/td><\/tr><tr><td class=\"w\">urban<\/td><td class=\"m\">도시의<\/td><\/tr><tr><td class=\"w\">project<\/td><td class=\"m\">투사하다, 예상하다<\/td><\/tr><tr><td class=\"w\">degrade<\/td><td class=\"m\">분해되다, 떨어뜨리다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">promote<\/td><td class=\"m\">촉진하다, 장려하다<\/td><\/tr><tr><td class=\"w\">improve<\/td><td class=\"m\">나아지게 하다, 향상시키다<\/td><\/tr><tr><td class=\"w\">resident<\/td><td class=\"m\">주민, 거주자<\/td><\/tr><tr><td class=\"w\">injustice<\/td><td class=\"m\">불평등, 부당함<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>However,<\/b><\/span><span class=\"ko\">하지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>such environmental improvements<\/b><\/span><span class=\"ko\">그러한 환경 개선은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in ethnic communities and<\/b><\/span><span class=\"ko\">소수 민족 공동체들 및<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or low-income households<\/b><\/span><span class=\"ko\">또는 저소득층 가구에서의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">can create<\/span><\/b><\/span><span class=\"ko\">만들 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>an urban green space paradox.<\/b><\/span><span class=\"ko\">도시 녹색 공간의 역설을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만, 소수 민족 공동체들 및/또는 저소득층 가구에서 그러한 환경 개선은 도시 녹색 공간의 역설을 만들 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> urban green space paradox는 환경을 좋게 만들었는데 오히려 그곳에 살던 사람들이 피해를 보게 되는 모순적인 상황을 의미합니다. 앞 문장에서 언급한 긍정적인 기대와 정반대되는 부작용이 발생할 수 있음을 경고하며 이 글의 핵심 주제를 제시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">can create (조동사): 조동사 can 뒤에 동사원형 create가 결합하여 가능성이나 능력을 나타내는 서술부를 형성한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">urban<\/td><td class=\"m\">도시의<\/td><\/tr><tr><td class=\"w\">improve<\/td><td class=\"m\">나아지게 하다, 향상시키다<\/td><\/tr><tr><td class=\"w\">improvement<\/td><td class=\"m\">개선, 향상<\/td><\/tr><tr><td class=\"w\">ethnic<\/td><td class=\"m\">민족의, 인종의<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">community<\/td><td class=\"m\">지역 사회, 공동체<\/td><\/tr><tr><td class=\"w\">income<\/td><td class=\"m\">소득, 수입<\/td><\/tr><tr><td class=\"w\">household<\/td><td class=\"m\">가정, 가구(家口)<\/td><\/tr><tr><td class=\"w\">paradox<\/td><td class=\"m\">역설<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The creation<\/b><\/span><span class=\"ko\">조성은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of new, high-quality green spaces<\/b><\/span><span class=\"ko\">새로운 양질의 녹색 공간의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can increase attractiveness,<\/b><\/span><span class=\"ko\">매력을 증가시킬 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">making these neighbourhood more desirable<\/span>.<\/b><\/span><span class=\"ko\">이 지역을 더 탐나게 만들며.<\/span><\/div><\/div><div class=\"lec-sent-ko\">새로운 양질의 녹색 공간의 조성은 매력을 증가시킬 수 있어 이 지역을 더 탐나게 만든다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> making these neighbourhood more desirable은 공원이 생기고 동네가 쾌적해지자, 원래 살던 사람뿐만 아니라 외부 사람들도 그 동네에 들어와 살고 싶어 할 만큼 인기가 높아진다는 뜻입니다. 역설이 발생하는 첫 번째 단계인 &#39;지역 가치의 상승&#39;을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">making these neighbourhood more desirable (분사구문): 문장 뒤에서 앞선 내용에 대한 부수적인 결과를 나타내는 구조다. 원래 절로 변환하면 and it makes these neighbourhood more desirable이 된다.<\/div><div class=\"lec-gr-item\">making these neighbourhood more desirable 5형식(SVOC) 구조: 동사(making) + 목적어(these neighbourhood) + 목적격보어(more desirable). 목적격보어 자리에 형용사(desirable)가 쓰여 목적어의 성질이나 상태를 설명한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">creation<\/td><td class=\"m\">창조, 창출<\/td><\/tr><tr><td class=\"w\">quality<\/td><td class=\"m\">질, 품질<\/td><\/tr><tr><td class=\"w\">increase<\/td><td class=\"m\">증가하다, 늘리다<\/td><\/tr><tr><td class=\"w\">desirable<\/td><td class=\"m\">바람직한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>By contrast,<\/b><\/span><span class=\"ko\">대조적으로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the cost of housing<\/b><\/span><span class=\"ko\">주거비는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can rise,<\/b><\/span><span class=\"ko\">오를 수 있고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and residents<\/b><\/span><span class=\"ko\">거주자들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>may not be able <span class=\"grammar-hl\">to afford<\/span> the rent.<\/b><\/span><span class=\"ko\">임대료를 지불할 여유가 없을지도 모른다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">대조적으로, 주거비가 오를 수 있고, 거주자들은 임대료를 지불할 여유가 없을지도 모른다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> not be able to afford the rent는 동네가 좋아진 대가로 집값과 월세가 너무 비싸져서, 수입이 적은 원래 주민들이 경제적으로 버틸 수 없는 한계에 부딪힘을 의미합니다. 앞 문장의 &#39;매력 상승&#39;이 가져온 치명적인 경제적 뒷면을 대조적으로 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to afford (to부정사(부사적): 형용사 수식): 앞에 있는 형용사 able을 수식하는 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">resident<\/td><td class=\"m\">주민, 거주자<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This results in<\/b><\/span><span class=\"ko\">이는 야기한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the exclusion or displacement<\/b><\/span><span class=\"ko\">배제 혹은 퇴거를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of the poor neighbourhood’s residents,<\/b><\/span><span class=\"ko\">가난한 지역 거주자들의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who<\/span> <span class=\"grammar-hl\">were intended to benefit<\/span><\/b><\/span><span class=\"ko\">혜택을 얻도록 의도되어 있었던<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from the ecosystem services<\/b><\/span><span class=\"ko\">생태계 서비스로부터<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">provided by<\/span> the new green space.<\/b><\/span><span class=\"ko\">새로운 녹색 공간에 의해 제공되는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이는 가난한 지역 거주자들의 배제 혹은 퇴거를 야기하는데, 그들은 새로운 녹색 공간에 의해 제공되는 생태계 서비스로부터 혜택을 얻도록 의도되어 있었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> exclusion or displacement는 살던 곳에서 밀려나 다른 곳으로 떠나야만 하는 상황을 가리킵니다. 원래 그 공원은 그곳에 살던 가난한 사람들을 위해 만든 것이었지만, 정작 혜택을 누려야 할 주인공들이 소외되는 정책의 모순이 정점에 달했음을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who (관계대명사): 선행사인 residents를 부연 설명하는 주격 관계대명사다.<\/div><div class=\"lec-gr-item\">were intended to benefit (수동태): be동사(were)+p.p.(intended) 구조. intend는 타동사로 intend+O+toV(5형식) 구조인데, 목적어(O)가 주어로 올라가면서 수동구조 were intended가 되고 목적격보어였던 to부정사(to benefit)는 수동태 뒤에 남은 목적격보어가 된다. 기본구조: V + O + to V.<\/div><div class=\"lec-gr-item\">provided by (과거분사(형용사)): 과거분사구 provided by...가 앞의 명사 ecosystem services를 수식한다(= &quot;제공된 생태계 서비스&quot;).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">resident<\/td><td class=\"m\">주민, 거주자<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In turn,<\/b><\/span><span class=\"ko\">결국,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the residents<\/b><\/span><span class=\"ko\">거주자들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>may only be able <span class=\"grammar-hl\">to afford<\/span> <span class=\"grammar-hl\">to live<\/span><\/b><\/span><span class=\"ko\">거주할 형편이 될 수 있을지도 모른다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in a similar <span class=\"grammar-hl\">degraded neighbourhood<\/span><\/b><\/span><span class=\"ko\">비슷한 낙후된 지역에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to the one they left,<\/b><\/span><span class=\"ko\">그들이 떠났던 곳과<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with low access to green infrastructure.<\/b><\/span><span class=\"ko\">녹색 사회 기반 시설에 접근성이 낮은 채로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">결국, 그 거주자들은 녹색 사회 기반 시설에 접근성이 낮은 채로, 그들이 떠났던 곳과 비슷한 낙후된 지역에나 거주할 형편이 될 수 있을지도 모른다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> similar degraded neighbourhood는 쫓겨난 사람들이 결국 다시 환경이 나쁜 곳으로 갈 수밖에 없음을 의미합니다. 환경 개선을 통해 삶의 질을 높여주려던 사업이 결과적으로는 가난한 사람들을 다시 환경이 열악한 곳으로 되돌려 보내는 악순환을 만들었다는 결론을 내립니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to afford (to부정사(부사적): 형용사 수식): 앞에 있는 형용사 able을 수식하는 구조다.<\/div><div class=\"lec-gr-item\">to live (to부정사(명사적)): 타동사 afford의 목적어 자리에서 &#39;~하는 것&#39;이라는 명사 역할을 한다.<\/div><div class=\"lec-gr-item\">degraded neighbourhood (과거분사(형용사)): 과거분사 degraded가 뒤의 명사 neighbourhood를 수식한다(= &quot;퇴보한 이웃 지역&quot;).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">degrade<\/td><td class=\"m\">분해되다, 떨어뜨리다<\/td><\/tr><tr><td class=\"w\">resident<\/td><td class=\"m\">주민, 거주자<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>낙후 지역의 도시 재생 사업은 본래 주민 복지와 환경 정의 실현을 목적으로 시작되었다.<\/li><li>하지만 고품질 녹지가 조성되면 동네의 매력이 높아지면서 주거 비용이 상승하는 부작용이 발생한다.<\/li><li>이로 인해 원래 혜택을 받아야 할 저소득층 주민들이 비싼 임대료를 감당하지 못하고 동네에서 쫓겨난다.<\/li><li>결국 이들은 다시 녹지가 부족하고 낙후된 지역으로 이주하게 되는 &#39;도시 녹지 공간의 역설&#39;이 발생한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Although urban greening aims to improve conditions for low-income residents, it often leads to their displacement because of increased housing costs.<\/div>\n              <div class=\"lec-final-sum-ko\">도시 녹화 사업은 저소득층 주민의 여건 개선을 목표로 함에도 불구하고, 주거비 상승으로 인해 종종 그들의 퇴거를 초래한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/18.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/19.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/21.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/22.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/23.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/24.mp3","hl":"main"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/25.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/26.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_21번_강의_audio/27.mp3","hl":null}]],"fileName":"모의고사_고1_2025년_10월_21번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 10월 / 21번","titleEn":"The Urban Green Space Paradox: How Greening Projects Displace the Poor","titleKo":"도시 녹지 공간의 역설: 녹지 조성 사업이 어떻게 빈곤층을 내쫓는가","imageUrl":"__enpImg__","stages":[{"label":"01도시 재생의 목적","items":["낙후 지역의 환경을 개선하고 주민의 복지를 증진하기 위해 도시 재생이 추진된다.","핵심 목표: 거주민의 웰빙(wellbeing) 개선","환경적 부정의(environmental injustice) 문제 해결 시도","낙후된 지역(degraded areas)의 환경 개선 프로젝트 추진"]},{"label":"02녹지 공간의 역설 발생","items":["저소득층 지역에 고품질의 녹지가 조성되면서 예상치 못한 부작용이 나타난다.","핵심 개념: 도시 녹지 공간의 역설 (urban green space paradox)","녹지 조성으로 인한 지역 매력도(attractiveness)와 선호도 상승","환경 개선이 오히려 지역의 경제적 가치를 급격히 변화시킴"]},{"label":"03거주 비용의 상승","items":["지역 환경이 좋아짐에 따라 주택 가격과 임대료가 기존 주민이 감당하기 힘든 수준으로 오른다.","주거 비용(cost of housing) 및 임대료(rent)의 동반 상승","저소득층 및 소수 민족 가구의 경제적 부담 가중","핵심 현상: 거주민의 지불 능력 상실"]},{"label":"04기존 주민의 소외와 축출","items":["녹지 혜택을 받아야 할 원주민들이 오히려 지역에서 쫓겨나는 결과가 초래된다.","원주민의 배제(exclusion) 및 강제적인 퇴거(displacement) 발생","생태계 서비스(ecosystem services) 혜택으로부터 소외됨","녹지 인프라 접근성이 낮은 또 다른 낙후 지역으로 이주하게 됨"]}],"bkg":"이 지문을 이해하기 위해서는 먼저 도시 재생(Urban Regeneration) 과정에서 빈번하게 발생하는 녹색 젠트리피케이션(Green Gentrification)이라는 개념을 알 필요가 있습니다. 이는 낙후된 지역에 공원이나 숲 같은 녹색 기반 시설(Green Infrastructure)을 확충하여 환경 정의(Environmental Justice)를 실현하려 하지만, 오히려 주변 지가와 임대료가 급등해 기존의 저소득층 주민들이 밖으로 내몰리는 현상을 말합니다. 즉, 주민들의 삶의 질을 높이려고 조성한 아름다운 공원이 역설적으로 그들을 살던 곳에서 쫓아내는 '양날의 검'이 되는 도시 녹지 역설(Urban Green Space Paradox)을 보여주는 사례입니다. 마치 동네에 멋진 대형 공원이 들어서서 좋아했는데, 정작 그 공원을 즐기기도 전에 집값이 너무 올라 멀리 이사를 가야만 하는 상황과 같습니다. 따라서 쾌적한 환경이라는 생태계 서비스(Ecosystem Services)가 모든 계층에게 공평하게 돌아가기 위해서는 개발과 동시에 원주민의 주거권을 보호하는 정책적 균형이 무엇보다 중요합니다.","ttsText":"이 지문을 이해하기 위해서는 먼저 도시 재생(Urban Regeneration) 과정에서 빈번하게 발생하는 녹색 젠트리피케이션(Green Gentrification)이라는 개념을 알 필요가 있습니다. 이는 낙후된 지역에 공원이나 숲 같은 녹색 기반 시설(Green Infrastructure)을 확충하여 환경 정의(Environmental Justice)를 실현하려 하지만, 오히려 주변 지가와 임대료가 급등해 기존의 저소득층 주민들이 밖으로 내몰리는 현상을 말합니다. 즉, 주민들의 삶의 질을 높이려고 조성한 아름다운 공원이 역설적으로 그들을 살던 곳에서 쫓아내는 '양날의 검'이 되는 도시 녹지 역설(Urban Green Space Paradox)을 보여주는 사례입니다. 마치 동네에 멋진 대형 공원이 들어서서 좋아했는데, 정작 그 공원을 즐기기도 전에 집값이 너무 올라 멀리 이사를 가야만 하는 상황과 같습니다. 따라서 쾌적한 환경
