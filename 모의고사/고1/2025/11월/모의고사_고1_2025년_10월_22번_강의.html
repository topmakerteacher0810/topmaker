<\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01해양 문제에 대한 인식 변화<\/div><ul><li>해양에 미치는 인간의 영향에 대한 대중적 관심이 뒤늦게나마 높아지고 있다.<\/li><li>공적 의제(public agenda)로 등장한 해양 이슈<\/li><li>수십 년간 지연된 대화(conversation)의 시작<\/li><li>핵심 키워드: 인식(awareness)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02논의를 가로막는 근본적 장애물<\/div><ul><li>해양 시스템이 어떻게 작동하는지 모르면 변화에 대한 대응책을 논의하기 어렵다.<\/li><li>시스템의 작동 원리(how it works)를 아는 것이 우선임<\/li><li>지식의 부재는 문제 해결의 거대한 장애물(massive obstacle)임<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03인체와 해양에 대한 지식 격차<\/div><ul><li>사람들은 자신의 신체 기관은 잘 알고 있지만 해양에 대해서는 무지하다.<\/li><li>신장(kidneys)의 위치와 기능은 학교에서 배운 기초 지식임<\/li><li>해양은 개인의 생명 유지 시스템(life-support system)만큼 중요하게 다뤄지지 않음<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04크릴 사례를 통한 심층적 이해<\/div><ul><li>크릴의 감소는 단순히 고래의 먹이 부족 이상의 심각한 의미를 지닌다.<\/li><li>크릴(krill)의 감소는 단순한 생물 수의 감소 그 이상임<\/li><li>크릴은 해양 시스템을 움직이는 해양 엔진(ocean engine)의 일부<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05지식 기반의 적절한 조치<\/div><ul><li>해양의 변화를 논의하고 조치를 취하기 위해서는 전체적인 맥락을 먼저 이해해야 한다.<\/li><li>변화를 논의하기 전 상황 맥락(context)에 대한 이해가 선행되어야 함<\/li><li>정확한 이해를 바탕으로 한 적절한 조치(appropriate action) 실행 필요<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">increase<\/td><td class=\"m\">증가<\/td><\/tr><tr><td class=\"w\">awareness<\/td><td class=\"m\">인식, 자각<\/td><\/tr><tr><td class=\"w\">seep<\/td><td class=\"m\">스며들다<\/td><\/tr><tr><td class=\"w\">public<\/td><td class=\"m\">대중, 일반인<\/td><\/tr><tr><td class=\"w\">agenda<\/td><td class=\"m\">의제, 안건<\/td><\/tr><tr><td class=\"w\">drag<\/td><td class=\"m\">끌다, 끌고 가다<\/td><\/tr><tr><td class=\"w\">conversation<\/td><td class=\"m\">대화<\/td><\/tr><tr><td class=\"w\">decade<\/td><td class=\"m\">10년<\/td><\/tr><tr><td class=\"w\">overdue<\/td><td class=\"m\">연체된, 기한이 지난, (지불<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">face<\/td><td class=\"m\">직면하다, 마주하다<\/td><\/tr><tr><td class=\"w\">massive<\/td><td class=\"m\">거대한<\/td><\/tr><tr><td class=\"w\">obstacle<\/td><td class=\"m\">장애물<\/td><\/tr><tr><td class=\"w\">discuss<\/td><td class=\"m\">논의하다, 이야기를 나누다<\/td><\/tr><tr><td class=\"w\">initially<\/td><td class=\"m\">처음에는<\/td><\/tr><tr><td class=\"w\">patient<\/td><td class=\"m\">환자<\/td><\/tr><tr><td class=\"w\">kidney<\/td><td class=\"m\">신장, 콩팥<\/td><\/tr><tr><td class=\"w\">vague<\/td><td class=\"m\">모호한<\/td><\/tr><tr><td class=\"w\">support<\/td><td class=\"m\">지원, 도움<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>An <span class=\"grammar-hl\">increasing awareness<\/span><\/b><\/span><span class=\"ko\">커지는 인식은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of our effect on the ocean<\/b><\/span><span class=\"ko\">해양에 미치는 우리의 영향에 대한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is slowly seeping<\/b><\/span><span class=\"ko\">서서히 스며들고 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>into the public agenda,<\/b><\/span><span class=\"ko\">공공 안건으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">dragging<\/span> behind it a conversation<\/b><\/span><span class=\"ko\">그것 뒤로 대화를 끌고 오면서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that is decades overdue<\/span>.<\/b><\/span><span class=\"ko\">수십 년 동안 미뤄 온<\/span><\/div><\/div><div class=\"lec-sent-ko\">해양에 미치는 우리의 영향에 대한 커지는 인식이 공공 안건으로 서서히 스며들면서, 수십 년 동안 미뤄 온 대화를 그것 뒤로 끌고 온다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> slowly seeping into the public agenda는 해양 오염이나 기후 변화 같은 문제가 이제야 비로소 사회적으로 중요한 의제가 되기 시작했다는 상황을 보여줍니다. 글쓴이는 dragging behind it이라는 표현을 통해, 이런 논의가 진작 이루어졌어야 함에도 불구하고 아주 오랫동안 방치되었다가 이제야 겨우 시작되고 있음을 지적하며 글을 엽니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">increasing awareness (현재분사(형용사)): 현재분사 increasing이 명사 awareness를 앞에서 수식하여 &#39;증가하는 인식&#39;이라는 진행/상태의 의미를 나타냄.<\/div><div class=\"lec-gr-item\">dragging (분사구문): dragging behind it... 원래 절로의 변환: as it drags behind it... (주절의 주어인 awareness의 부수적인 동작이나 결과를 나타냄).<\/div><div class=\"lec-gr-item\">that is decades overdue (관계대명사): 선행사 a conversation을 수식하는 주격 관계대명사절로, that 뒤에 주어가 없는 불완전한 문장이 이어짐.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">increase<\/td><td class=\"m\">증가<\/td><\/tr><tr><td class=\"w\">awareness<\/td><td class=\"m\">인식, 자각<\/td><\/tr><tr><td class=\"w\">seep<\/td><td class=\"m\">스며들다<\/td><\/tr><tr><td class=\"w\">public<\/td><td class=\"m\">대중, 일반인<\/td><\/tr><tr><td class=\"w\">agenda<\/td><td class=\"m\">의제, 안건<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drag<\/td><td class=\"m\">끌다, 끌고 가다<\/td><\/tr><tr><td class=\"w\">conversation<\/td><td class=\"m\">대화<\/td><\/tr><tr><td class=\"w\">decade<\/td><td class=\"m\">10년<\/td><\/tr><tr><td class=\"w\">overdue<\/td><td class=\"m\">연체된, 기한이 지난, (지불<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But this conversation<\/b><\/span><span class=\"ko\">하지만 이 대화는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">faces<\/span> a massive obstacle.<\/b><\/span><span class=\"ko\">거대한 장애물에 직면한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 이 대화는 거대한 장애물을 직면한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 해양에 관한 사회적 담론이 활발해지려는 찰나, 해결하기 매우 까다로운 근본적인 문제가 가로막고 있음을 시사하며 독자의 주의를 환기합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">faces (타동사): &#39;...에 직면하다&#39;라는 뜻의 완전타동사로 뒤에 목적어 a massive obstacle을 취함.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conversation<\/td><td class=\"m\">대화<\/td><\/tr><tr><td class=\"w\">face<\/td><td class=\"m\">직면하다, 마주하다<\/td><\/tr><tr><td class=\"w\">massive<\/td><td class=\"m\">거대한<\/td><\/tr><tr><td class=\"w\">obstacle<\/td><td class=\"m\">장애물<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">It’s almost impossible<\/span><\/b><\/span><span class=\"ko\">거의 불가능하다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to discuss<\/span> <span class=\"grammar-hl\">what to do<\/span><\/b><\/span><span class=\"ko\">무엇을 해야 할지를 논의하는 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>about <span class=\"grammar-hl\">something changing<\/span><\/b><\/span><span class=\"ko\">변화하는 어떤 것에 대해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>if you don’t initially know<\/b><\/span><span class=\"ko\">만약 당신이 처음에 알지 못한다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">how it works<\/span>.<\/b><\/span><span class=\"ko\">그것이 어떻게 작동하는지를<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 여러분이 그것이 어떻게 작동하는지를 애초에 알지 못한다면 변화하는 어떤 것에 대해 무엇을 해야 할지를 논의하는 것은 거의 불가능하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 말한 &#39;거대한 장애물&#39;의 정체를 밝히는 문장입니다. how it works, 즉 바다라는 시스템의 기본 원리를 모르는 상태에서는 환경 변화에 대한 대책을 세우는 것 자체가 무의미하거나 불가능하다는 논리를 제시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It’s almost impossible to discuss (가주어): 진주어: It은 형식상 주어인 가주어이며, to discuss 이하는 문장의 실제 주어인 진주어(명사적 용법)임.<\/div><div class=\"lec-gr-item\">what to do (명사구): 의문사(what) + to부정사(to do) 구조로 &#39;무엇을 할지&#39;라는 의미를 나타내며, 타동사 discuss의 목적어 역할을 함.<\/div><div class=\"lec-gr-item\">something changing (현재분사(형용사)): changing이 명사 something을 뒤에서 수식하여 &#39;변화하는 무언가&#39;라는 상태를 설명함.<\/div><div class=\"lec-gr-item\">how it works (간접의문문): &#39;의문사(how) + 주어(it) + 동사(works)&#39;의 어순을 취하며, 타동사 know의 목적어 역할을 하는 명사절임.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">discuss<\/td><td class=\"m\">논의하다, 이야기를 나누다<\/td><\/tr><tr><td class=\"w\">initially<\/td><td class=\"m\">처음에는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If a doctor tells a patient<\/b><\/span><span class=\"ko\">만약 의사가 환자에게 말한다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that they have a problem with their kidneys,<\/b><\/span><span class=\"ko\">그들에게 신장 문제가 있다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the patient<\/b><\/span><span class=\"ko\">그 환자는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>probably already has<\/b><\/span><span class=\"ko\">아마도 이미 가지고 있을 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at least a vague idea<\/b><\/span><span class=\"ko\">적어도 막연한 이해를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>about <span class=\"grammar-hl\">where their kidneys are<\/span><\/b><\/span><span class=\"ko\">신장이 어디에 있는지에 대해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">what they’re up to<\/span>.<\/b><\/span><span class=\"ko\">그리고 그것들이 무엇을 하는지에 대해<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 의사가 환자에게 신장에 문제가 있다고 말한다면, 그 환자는 아마도 신장이 어디에 있고 무엇을 하는지에 대해 적어도 막연한 이해는 이미 가지고 있을 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 바다에 대한 무지를 강조하기 위해 &#39;인체&#39;라는 친숙한 소재를 가져와 비유합니다. what they’re up to는 신장이 몸속에서 어떤 기능을 수행하고 있는지 그 역할을 의미하며, 사람들은 보통 자신의 몸에 대해서는 최소한의 기본 지식을 갖추고 있음을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">where their kidneys are (간접의문문): &#39;의문사(where) + 주어(their kidneys) + 동사(are)&#39;의 어순을 따르며, 전치사 about의 목적어 역할을 하는 명사절임.<\/div><div class=\"lec-gr-item\">what they’re up to (간접의문문): &#39;의문사(what) + 주어(they) + 동사(are up to)&#39;의 어순으로, 앞의 간접의문문과 and로 병렬 연결되어 about의 목적어 역할을 함.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">patient<\/td><td class=\"m\">환자<\/td><\/tr><tr><td class=\"w\">kidney<\/td><td class=\"m\">신장, 콩팥<\/td><\/tr><tr><td class=\"w\">vague<\/td><td class=\"m\">모호한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>They <span class=\"grammar-hl\">learned<\/span><\/b><\/span><span class=\"ko\">그들은 배웠다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">about<\/span> that part<\/b><\/span><span class=\"ko\">그 부분에 대해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of their own personal life-support system<\/b><\/span><span class=\"ko\">그들 자신의 개인적 생명 유지 체계의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at school.<\/b><\/span><span class=\"ko\">학교에서<\/span><\/div><\/div><div class=\"lec-sent-ko\">그들은 학교에서 자기 개인의 생명 유지 체계의 그 부분에 대해 배웠다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 우리가 신체 기관에 대해 기초 지식을 갖게 된 배경을 설명합니다. personal life-support system은 인간의 생존을 가능케 하는 인체 구조를 의미하며, 의무 교육을 통해 누구나 기본적인 생물학적 원리는 습득하고 있다는 점을 짚어줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">learned about (관용표현): &#39;...에 대해 배우다/알게 되다&#39;라는 의미의 구동사로 쓰임.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">support<\/td><td class=\"m\">지원, 도움<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But that’s <span class=\"grammar-hl\">not the case<\/span><\/b><\/span><span class=\"ko\">하지만 그것은 사실이 아니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for the oceans.<\/b><\/span><span class=\"ko\">해양의 경우에는<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 해양의 경우는 그렇지 않다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 인체와 바다를 극명하게 대비시키는 전환점입니다. 우리 몸의 원리는 학교에서 배워서 잘 알지만, 지구의 생명 유지 장치인 바다가 어떻게 굴러가는지에 대해서는 교육받거나 알 기회가 거의 없었다는 사실을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">not the case (관용표현): &#39;사실이 아니다&#39; 또는 &#39;해당하지 않는다&#39;라는 의미로 굳어진 표현임.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 7 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When we see a news story<\/b><\/span><span class=\"ko\">우리가 뉴스 기사를 볼 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>about the longterm decline<\/b><\/span><span class=\"ko\">장기적 감소에 대한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the numbers of krill<\/b><\/span><span class=\"ko\">크릴 수의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the Southern Ocean,<\/b><\/span><span class=\"ko\">남극해에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">it sounds<\/span><\/b><\/span><span class=\"ko\">그것은 들린다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">generally like a bad thing<\/span>.<\/b><\/span><span class=\"ko\">일반적으로 나쁜 일처럼<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리가 남극해 크릴 수의 장기적 감소에 대한 신문 기사를 볼 때, 일반적으로 그것은 나쁜 일처럼 들린다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 바다의 작동 원리를 모를 때 나타나는 구체적인 사례를 제시합니다. sounds generally like a bad thing은 사람들이 환경 파괴 소식을 들으면 막연히 &#39;안 좋은 일이구나&#39;라고 느끼지만, 그것이 생태계 전체에 어떤 실질적인 타격을 주는지 구체적으로는 체감하지 못함을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">it sounds generally like a bad thing 2형식 구조: 감각동사 sound는 뒤에 &#39;like + 명사(구)&#39;를 취하여 &#39;...처럼 들리다&#39;라는 의미의 보어 관계를 형성함.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 8 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But there’s far more to it<\/b><\/span><span class=\"ko\">하지만 거기에는 훨씬 더 많은 것이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than the risk<\/b><\/span><span class=\"ko\">위험보다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of <span class=\"grammar-hl\">whales going hungry<\/span>.<\/b><\/span><span class=\"ko\">고래가 굶주리게 될<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 거기에는 고래가 굶주리는 위험보다 훨씬 더 많은 것이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 일반적인 대중이 생각하는 얕은 지식 수준을 지적합니다. far more to it은 크릴의 감소가 단순히 상위 포식자인 고래의 먹이가 줄어드는 수준을 넘어, 지구 전체 시스템에 훨씬 더 복잡하고 치명적인 영향을 끼친다는 점을 암시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">whales going hungry (동명사): 전치사 of의 목적어로 쓰인 동명사 going이며, 명사 whales는 동명사의 의미상 주어 역할을 함.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 9 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Krill are<\/span> a part of the ocean engine.<\/b><\/span><span class=\"ko\">크릴은 해양 엔진의 일부이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">크릴은 해양 엔진의 일부이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> ocean engine은 바다가 탄소를 흡수하고 산소를 생산하며 지구의 기온을 조절하는 거대한 순환 체계임을 비유한 표현입니다. 크릴이 이 거대한 기계 장치를 돌리는 핵심 부품 역할을 하고 있음을 강조하며, 단순한 먹잇감 이상의 존재임을 밝힙니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Krill are (주어): 동사 수 일치: Krill은 단수와 복수 형태가 같으나, 여기서는 군집이나 개체수 전체를 의미하여 복수 동사 are를 사용함.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We need <span class=\"grammar-hl\">to understand<\/span><\/b><\/span><span class=\"ko\">우리는 이해할 필요가 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at least some of the context<\/b><\/span><span class=\"ko\">적어도 맥락의 어느 정도를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>before we can discuss the change<\/b><\/span><span class=\"ko\">우리가 변화에 대해 논의할 수 있기 전에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and take appropriate action.<\/b><\/span><span class=\"ko\">그리고 적절한 조치를 취하기 전에<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리는 변화에 대해 논의하고 적절한 조치를 취할 수 있기 전에 최소한 어느 정도의 맥락은 이해할 필요가 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글 전체의 결론입니다. understand at least some of the context는 바다가 어떻게 작동하는지에 대한 기초적인 지식을 갖추는 것을 의미합니다. 이런 바탕이 있어야만 비로소 실효성 있는 환경 정책을 논의하고 실행할 수 있다는 핵심 주장을 펼치며 마무리합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to understand (to부정사(명사적)): 타동사 need의 목적어 자리에 쓰였으며, in order to로 바꿔 쓸 수 없는 목적어 역할이므로 명사적 용법임.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">discuss<\/td><td class=\"m\">논의하다, 이야기를 나누다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>해양 환경 문제에 대한 관심은 높아졌지만, 바다의 작동 원리에 대한 무지가 해결의 장애물이 되고 있다.<\/li><li>사람들은 학교에서 배운 덕분에 신장 같은 인체 기관의 기능은 잘 알지만, 바다에 대해서는 그렇지 못하다.<\/li><li>크릴새우의 감소를 단순히 고래의 먹이 부족 문제로만 보는 것은 해양 시스템에 대한 이해가 부족하기 때문이다.<\/li><li>제대로 된 환경 논의와 대응을 위해서는 바다라는 거대한 시스템이 어떻게 작동하는지 기초적인 교육과 이해가 선행되어야 한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Ocean conservation efforts must be preceded by a fundamental understanding of marine systems because taking appropriate action is impossible without knowing the context of how the environment functions.<\/div>\n              <div class=\"lec-final-sum-ko\">적절한 조치를 취하는 것은 환경이 작동하는 맥락을 아는 것 없이는 불가능하기 때문에 해양 보존 노력은 해양 시스템에 대한 근본적인 이해가 선행되어야 한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./모의고사_고1_2025년_10월_22번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_22번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2025년_10월_22번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2025년_10월_22번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2025년_10월_22번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2025년_10월_22번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2025년_10월_22번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2025년_10월_22번_강의_audio/8.mp3","hl":"stage-4"} udio":"./모의고사_고1_2025년_10월_22번_강의_audio/39.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2025년_10월_22번_강의_audio/40.mp3","hl":null}]],"fileName":"모의고사_고1_2025년_10월_22번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고1 / 2025년 / 10월 / 22번","titleEn":"The Essential Foundation: Understanding Ocean Mechanics Before Action","titleKo":"필수적인 토대: 행동하기 전 해양 메커니즘에 대한 이해","imageUrl":"__enpImg__","stages":[{"label":"01해양 문제에 대한 인식 변화","items":["해양에 미치는 인간의 영향에 대한 대중적 관심이 뒤늦게나마 높아지고 있다.","공적 의제(public agenda)로 등장한 해양 이슈","수십 년간 지연된 대화(conversation)의 시작","핵심 키워드: 인식(awareness)"]},{"label":"02논의를 가로막는 근본적 장애물","items":["해양 시스템이 어떻게 작동하는지 모르면 변화에 대한 대응책을 논의하기 어렵다.","시스템의 작동 원리(how it works)를 아는 것이 우선임","지식의 부재는 문제 해결의 거대한 장애물(massive obstacle)임"]},{"label":"03인체와 해양에 대한 지식 격차","items":["사람들은 자신의 신체 기관은 잘 알고 있지만 해양에 대해서는 무지하다.","신장(kidneys)의 위치와 기능은 학교에서 배운 기초 지식임","해양은 개인의 생명 유지 시스템(life-support system)만큼 중요하게 다뤄지지 않음"]},{"label":"04크릴 사례를 통한 심층적 이해","items":["크릴의 감소는 단순히 고래의 먹이 부족 이상의 심각한 의미를 지닌다.","크릴(krill)의 감소는 단순한 생물 수의 감소 그 이상임","크릴은 해양 시스템을 움직이는 해양 엔진(ocean engine)의 일부"]},{"label":"05지식 기반의 적절한 조치","items":["해양의 변화를 논의하고 조치를 취하기 위해서는 전체적인 맥락을 먼저 이해해야 한다.","변화를 논의하기 전 상황 맥락(context)에 대한 이해가 선행되어야 함","정확한 이해를 바탕으로 한 적절한 조치(appropriate action) 실행 필요"]}],"bkg":"바다의 변화를 제대로 이해하기 위해서는 먼저 바다가 어떻게 작동하는지 아는 해양 리터러시(Ocean Literacy)라는 개념이 매우 중요합니다. 바다는 단순히 물이 모여 있는 곳이 아니라, 해류와 생물들이 정교하게 맞물려 지구의 기후를 조절하는 거대한 해양 엔진(Ocean Engine)과 같은 시스템이기 때문입니다. 특히 지문에 언급된 크릴(Krill)은 고래의 먹이 역할을 넘어, 대기 중의 탄소를 바다 깊은 곳으로 격리하는 탄소 순환(Carbon Cycle)의 핵심적인 연결 고리 역할을 수행합니다. 마치 우리 몸의 장기가 어떤 기능을 하는지 배워야 건강을 지킬 수 있듯, 해양 생태계(Marine Ecosystem)의 구체적인 작동 원리를 이해하는 것이 환경 보호를 위한 올바른 대화와 행동의 시작이 됩니다.","ttsText":"바다의 변화를 제대로 이해하기 위해서는 먼저 바다가 어떻게 작동하는지 아는 해양 리터러시(Ocean Literacy)라는 개념이 매우 중요합니다. 바다는 단순히 물이 모여 있는 곳이 아니라, 해류와 생물들이 정교하게 맞물려 지구의 기후를 조절하는 거대한 해양 엔진(Ocean Engine)과 같은 시스템이기 때문입니다. 특히 지문에 언급된 크릴(Krill)은 고래의 먹이 역할을 넘어, 대기 중의 탄소를 바다
