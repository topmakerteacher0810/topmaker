</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 40번","audioDir":"40_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">40번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Why Punishment Can Backfire: The Trap of Trick-Punishments\u003c/h1>\u003ch2>처벌이 역효과를 내는 이유: 트릭 처벌의 함정\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>아이를 꾸짖는 \u003cb class=\"key\">트릭 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>은 오히려 잘못된 행동을 \u003cb class=\"key\">장려\u003c/b>할 수 있으므로, 부모는 부정적 측면을 지적하는 대신 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">측면\u003c/b>을 보상해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Punishing a child through scolding may reinforce misbehavior, so parents should reward positive behavior to avoid trick-punishments.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 전국연합학력평가 마흔 번째 지문을 함께 분석해 볼게요. 이 지문은 아이를 벌주는 것이 오히려 나쁜 행동을 강화할 수 있다는 트릭 처벌 개념을 소개하고, 긍정적 행동을 보상하는 전략을 제안해요. 요약하면, 꾸중과 처벌은 아이의 잘못된 행동을 장려할 수 있으므로 부모는 부정적 측면 대신 긍정적 측면을 보상해야 해요. 핵심 요지는 punishing a child through scolding may reinforce misbehavior, so parents should reward positive behavior to avoid trick-punishments입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">아이 행동을 바꿀 때 흔히 하는 실수는 문제 행동에 강한 반응을 보이는 거예요. 심리학에서는 관심 자체가 \u003cb class=\"key\">강화 \u003c/b>\u003cb class=\"key\">reinforcement\u003c/b>가 될 수 있다고 봐요. 특히 아이가 \u003cb class=\"key\">외로움\u003c/b>을 느낄 때 꾸중도 \u003cb class=\"key\">관심 \u003c/b>\u003cb class=\"key\">attention\u003c/b>으로 받아들여요. 예를 들어, 조용히 잘 놀 때보다 말썽을 부릴 때 부모가 더 크게 반응하면 아이는 말썽이 유용한 수단이라고 배우게 되죠. 따라서 처벌보다 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">강화 \u003c/b>\u003cb class=\"key\">positive \u003c/b>\u003cb class=\"key\">reinforcement\u003c/b>가 더 효과적일 수 있어요.\u003c/div>","segs":[{"n":2,"text":"아이 행동을 바꿀 때 흔히 하는 실수는 문제 행동에 강한 반응을 보이는 거예요. 심리학에서는 관심 자체가 강화인 reinforcement이 될 수 있다고 봐요. 특히 아이가 외로움을 느낄 때 꾸중도 관심 attention으로 받아들여요. 예를 들어, 조용히 잘 놀 때보다 말썽을 부릴 때 부모가 더 크게 반응하면 아이는 말썽이 유용한 수단이라고 배우게 되죠. 따라서 처벌보다 긍정적 강화 positive reinforcement가 더 효과적일 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>트릭 처벌의 역설\u003csmall>문제 제기 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>신경심리학자 Álvaro Bilbao가 말한 \u003cb class=\"key\">트릭 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>은 꾸짖음이나 처벌인데, 아이가 어떤 행동을 \u003cb class=\"key\">단념\u003c/b>하도록 하기는커녕 오히려 \u003cb class=\"key\">장려\u003c/b>한다는 역설을 소개한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>Hugh의 예시\u003csmall>예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>Hugh는 남동생을 때리면 어머니가 \u003cb class=\"key\">꾸짖는다\u003c/b>는 것을 배운다. \u003cb class=\"key\">외로움\u003c/b>을 느끼는 아이에게 꾸중은 눈에 띄지 않는 것보다 낫기 때문에 때리는 행동이 \u003cb class=\"key\">계속\u003c/b>된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>대안 전략\u003csmall>전환 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>이 경우 어머니는 다른 전략을 \u003cb class=\"key\">채택\u003c/b>하는 것이 낫다. 남동생을 때리지 않은 시간을 \u003cb class=\"key\">보상\u003c/b>하고, 부정적 측면을 지적하기보다 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">측면\u003c/b>을 보상하는 방식을 선택해야 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>트릭 처벌 피하기\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>이렇게 하면 어떤 부모든 \u003cb class=\"key\">트릭 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>을 피할 수 있다는 결론으로 마무리한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 트릭 처벌이라는 개념을 문제로 제시하고, Hugh의 예시를 통해 부작용을 보여준 뒤, 긍정적 보상이라는 해결책을 제안하는 흐름이에요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 트릭 처벌의 역설을 소개해요. 신경심리학자 Álvaro Bilbao가 말한 trick punishment는 꾸짖음, 순간의 화, 또는 전형적인 의미의 처벌이에요. 그런데 이 처벌은 아이가 어떤 행동을 단념하게 하기는커녕 오히려 그 행동을 장려한다는 거예요. 여기서 instead of라는 표현이 핵심이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 Hugh의 예시예요. Hugh는 남동생을 때리면 어머니가 꾸짖는다는 것을 배워요. 외로움을 느끼는 아이에게 꾸중은 눈에 띄지 않는 것보다 훨씬 낫기 때문에, Hugh는 남동생을 계속 때리게 되죠. 이게 바로 트릭 처벌의 부작용이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 대안 전략이에요. 이런 경우 어머니는 다른 전략을 채택하는 것이 낫다고 해요. Hugh가 남동생을 일정 기간 동안 때리지 않았을 때 자랑스러워해 주는 거죠. 부정적 측면을 계속 지적하는 대신 긍정적 측면을 보상하는 것을 선택할 수 있어요.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계에서는 이렇게 하면 어느 부모든 트릭 처벌을 피할 수 있다고 결론을 내려요. 문제 행동을 꾸짖기보다 바람직한 행동을 보상하는 것이 핵심 전략이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">트릭 \u003c/b>\u003cb class=\"key\">처벌\u003c/b> 때문에 아이를 벌주는 것이 효과적이지 않을 수 있다는 문제를 제시한다. 중간에 Hugh의 예시로 문제를 확인한 뒤, 부모가 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">측면\u003c/b>을 보상하는 해결책을 제시한다. 마지막 문장에서 이렇게 하면 \u003cb class=\"key\">트릭 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>을 피할 수 있다고 정리하므로 전형적인 \u003cb class=\"key\">문제-해결\u003c/b> 구조이며, 첫 문장에 주제를 제시하는 \u003cb class=\"key\">두괄식\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>due to (1)\u003c/b>\u003cspan>원인\u003c/span>\u003cb>Instead of (3)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>For example (4)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>so (5)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>In this case (6)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>For instance (7)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>but (8)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>In this way (9)\u003c/b>\u003cspan>결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Punishing a child\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">trick-punishments\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">A trick-punishment\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a scolding, a moment of anger or a punishment\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>부정적 접근 (트릭 처벌)\u003c/th>\u003cth>긍정적 접근 (보상)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>꾸짖음·처벌\u003c/td>\u003ctd>칭찬·보상\u003c/td>\u003c/tr>\u003ctr>\u003ctd>잘못된 행동을 강화함\u003c/td>\u003ctd>바람직한 행동을 강화함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>부정적 측면을 지적함\u003c/td>\u003ctd>긍정적 측면을 보상함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 문제와 해결 구조로 볼 수 있어요. 첫 문장에서 punishing a child may not be effective due to trick punishments라고 문제를 제시하고, 예시와 분석을 거쳐 마지막에 any parent can avoid trick punishments라고 해결책을 정리해요. 첫 문장에 핵심 주장이 나오므로 두괄식 구조예요. 주제문은 첫 번째 문장이에요.","hl":"ty"},{"n":9,"text":"신호어를 따라가면 글의 논리가 선명해져요. due to는 원인을 나타내고, instead of는 앞 내용과 대조되면서 진짜 문제를 부각해요. for example과 for instance는 예시를 이끌고, so는 결과를, in this case는 전환을, but은 대조를, in this way는 결론을 이끌어요. 또 trick punishments는 a scolding, a moment of anger or a punishment in the most classic sense of the word로 재진술되고, 부정적 접근과 긍정적 접근이 대조되면서 해결책이 강조돼요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>punish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>벌주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>effective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효과적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>neuropsychologist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신경심리학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>trick-punishment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>트릭 처벌\u003c/span>\u003c/div>\u003cdiv>\u003cb>scolding\u003c/b>\u003cem>명사\u003c/em>\u003cspan>꾸짖음, 질책\u003c/span>\u003c/div>\u003cdiv>\u003cb>moment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>순간\u003c/span>\u003c/div>\u003cdiv>\u003cb>anger\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화, 분노\u003c/span>\u003c/div>\u003cdiv>\u003cb>classic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전형적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>sense\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의미\u003c/span>\u003c/div>\u003cdiv>\u003cb>discourage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>단념시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>encourage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>장려하다, 부추기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>때리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>scold\u003c/b>\u003cem>동사\u003c/em>\u003cspan>꾸짖다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lonely\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>외로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>invisible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>눈에 띄지 않는, 무시된\u003c/span>\u003c/div>\u003cdiv>\u003cb>continue\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계속하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>adopt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>채택하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>strategy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전략\u003c/span>\u003c/div>\u003cdiv>\u003cb>congratulate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자랑스러워하다, 칭찬하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>certain\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일정한, 특정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>length\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기간, 길이\u003c/span>\u003c/div>\u003cdiv>\u003cb>allow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>허용하다, 내버려두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>constantly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>끊임없이, 계속해서\u003c/span>\u003c/div>\u003cdiv>\u003cb>point out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>지적하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>negative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>reward\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>positive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긍정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘를 몇 개 짚어 볼게요. effective는 효과적인, scolding은 꾸짖음, discourage는 단념시키다, encourage는 장려하다라는 뜻이에요. lonely는 외로운, invisible은 눈에 띄지 않는이라는 뜻이고, reward는 보상하다, avoid는 피하다라는 뜻이죠. 이 어휘들은 문제 행동과 보상 전략을 이해하는 데 중요해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">effective\u003c/b>\u003cspan class=\"m\">효과적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">efficient\u003c/span>\u003cspan class=\"s\">useful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ineffective\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discourage\u003c/b>\u003cspan class=\"m\">단념시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deter\u003c/span>\u003cspan class=\"s\">dissuade\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">encourage\u003c/span>\u003cspan class=\"a\">motivate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">encourage\u003c/b>\u003cspan class=\"m\">장려하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">promote\u003c/span>\u003cspan class=\"s\">stimulate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discourage\u003c/span>\u003cspan class=\"a\">deter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lonely\u003c/b>\u003cspan class=\"m\">외로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">isolated\u003c/span>\u003cspan class=\"s\">alone\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accompanied\u003c/span>\u003cspan class=\"a\">sociable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reward\u003c/b>\u003cspan class=\"m\">보상하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">compensate\u003c/span>\u003cspan class=\"s\">reinforce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">punish\u003c/span>\u003cspan class=\"a\">penalize\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">scold\u003c/b>\u003cspan class=\"m\">꾸짖다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reprimand\u003c/span>\u003cspan class=\"s\">rebuke\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">praise\u003c/span>\u003cspan class=\"a\">compliment\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">negative\u003c/b>\u003cspan class=\"m\">부정적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adverse\u003c/span>\u003cspan class=\"s\">unfavorable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">positive\u003c/span>\u003cspan class=\"a\">favorable\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 동의어와 반의어를 정리해 볼게요. effective는 efficient나 useful과 비슷하고, ineffective나 useless와 반대예요. discourage는 deter나 dissuade와 가깝고, encourage나 motivate와 반대예요. encourage는 promote나 stimulate와 가깝고, discourage나 deter와 반대예요. lonely는 isolated와 가깝고, accompanied나 sociable과 반대예요. reward는 compensate나 reinforce와 가깝고, punish나 penalize와 반대예요. scold는 reprimand나 rebuke와 가깝고, praise나 compliment와 반대예요. negative는 adverse나 unfavorable과 가깝고, positive나 favorable과 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이를 벌주는 것은 효과적이지 않을 수 있다 신경심리학자 Álvaro Bilbao가 ...라고 부르는 것 때문에 ‘트릭 처벌’이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Punishing \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">child\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">effective\u003c/span> due to \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">Álvaro \u003c/span>\u003cspan class=\"tgt\">Bilbao, \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">neuropsychologist, \u003c/span>\u003cspan class=\"tgt\">calls\u003c/span> 'trick­punishments.'\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이를 벌주는 것은 신경심리학자 Álvaro Bilbao가 ‘트릭 처벌’이라고 부르는 것으로 인해 효과적이지 않을 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 도입부로, 아이를 벌주는 것이 신경심리학자 \u003cb class=\"key\">Álvaro \u003c/b>\u003cb class=\"key\">Bilbao\u003c/b>가 말하는 \u003cb class=\"key\">trick-punishments\u003c/b> 때문에 효과가 없을 수 있다고 핵심 주장을 미리 제시합니다. '\u003cb class=\"key\">may \u003c/b>\u003cb class=\"key\">not \u003c/b>\u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">effective\u003c/b>'는 단정이 아닌 가능성으로, 뒤에 이어질 역설적 상황을 열어 둡니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [Punishing a child] + [may not be effective] : \"아이를 벌주는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 may의 부정\u003c/span> : may + not + 동사원형(be) : \"효과적이지 않을 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 what (선행사 포함)\u003c/span> : due to + [what + 주어 + calls] : \"Álvaro Bilbao가 ...라고 부르는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">동격(명사구 동격)\u003c/span> : Álvaro Bilbao, a neuropsychologist, calls : \"신경심리학자인 Álvaro Bilbao\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Punishing a child, 아이를 벌주는 것은. may not be effective, 효과적이지 않을 수 있다. due to what Álvaro Bilbao, a neuropsychologist, calls, 신경심리학자 Álvaro Bilbao가 ...라고 부르는 것 때문에. 'trick-punishments.', ‘트릭 처벌’이라고. 이 문장 전체를 해석하면, 아이를 벌주는 것은 신경심리학자 Álvaro Bilbao가 ‘트릭 처벌’이라고 부르는 것으로 인해 효과적이지 않을 수 있다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 글의 핵심 주장을 먼저 제시합니다. 아이를 벌주는 것이 신경심리학자 Álvaro Bilbao가 말한 trick-punishments 때문에 효과가 없을 수 있다고 말합니다. 여기서 due to는 원인을 이끄는 표현이고, may not be effective는 확실한 단정이 아니라 가능성을 열어 두는 표현이에요.","hl":"mn"},{"n":14,"text":"첫 번째 문장에서 첫 번째로 볼 포인트는 Punishing a child가 동명사구 주어로 쓰였다는 점입니다. 동사 punish를 동명사로 바꾼 다음 뒤에 a child를 붙여 주어 자리에 놓았고, 단수 취급해서 뒤에 may가 온 거예요. 두 번째로 a neuropsychologist는 Álvaro Bilbao를 설명하는 동격입니다. 콤마로 신분을 덧붙인 표현이죠. 세 번째로 what Álvaro Bilbao, a neuropsychologist, calls는 관계대명사 what이 이끄는 절입니다. what은 선행사를 포함하고 있고, calls의 목적어가 없는 자리를 채우고 있어요. 네 번째로 may not be effective에서 조동사 may는 동사원형 be를 취하고, not은 조동사 바로 뒤에서 부정의 의미를 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">트릭 처벌은 꾸짖음, 순간의 화 혹은 처벌 단어의 가장 전형적인 의미에서\u003c/span>\u003cspan class=\"en\">A trick­punishment is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">scolding, \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">moment \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">anger \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">punishment\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">classic \u003c/span>\u003cspan class=\"tgt\">sense \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">word\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">트릭 처벌은 꾸짖음, 순간의 화 혹은 (처벌이라는) 단어의 가장 전형적인 의미에서의 처벌이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 트릭 처벌의 정의를 내리는 문장입니다. 꾸짖음, 순간의 화, 그리고 처벌이라는 단어의 가장 전형적인 의미에서의 처벌이 모두 \u003cb class=\"key\">trick-punishment\u003c/b>에 해당한다고 설명합니다. 즉 흔히 생각하는 \u003cb class=\"key\">처벌\u003c/b>의 모습이 오히려 문제를 일으킬 수 있음을 보여 주는 정의입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 or에 의한 병렬 구조\u003c/span> : A, B or C : \"꾸짖음, 순간의 화 혹은 처벌\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(형용사적 수식)\u003c/span> : a punishment + [전치사구] : \"단어의 가장 전형적인 의미에서의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">2형식 be동사와 주격 보어\u003c/span> : S + be동사 + C(명사구) : \"트릭 처벌은 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"A trick-punishment is, 트릭 처벌은. a scolding, 꾸짖음. a moment of anger, 순간의 화. or a punishment, 혹은 처벌. in the most classic sense of the word, 단어의 가장 전형적인 의미에서. 이 문장 전체를 해석하면, 트릭 처벌은 꾸짖음, 순간의 화 혹은 (처벌이라는) 단어의 가장 전형적인 의미에서의 처벌이다.","hl":"m"},{"n":16,"text":"두 번째 문장은 trick-punishment의 정의를 내립니다. trick-punishment는 꾸짖음, 순간의 화, 그리고 처벌이라는 단어의 가장 전형적인 의미에서의 처벌을 가리킵니다. 즉 일상적으로 아이를 혼내는 것이 모두 trick-punishment가 될 수 있다는 뜻이에요.","hl":"mn"},{"n":17,"text":"두 번째 문장에서 첫 번째 포인트는 A trick-punishment is 뒤에 명사구들이 주격 보어로 온다는 점입니다. be 동사는 주어와 보어를 연결해 주는 이 형식 동사예요. 두 번째로 a scolding, a moment of anger or a punishment는 등위접속사 or로 묶인 병렬 구조입니다. 세 개의 명사구가 문장에서 같은 자리에 나란히 연결되어 있어요. 세 번째로 in the most classic sense of the word는 앞에 있는 a punishment를 수식하는 전치사구입니다. 그 단어의 가장 전형적인 의미에서의 처벌이라는 뜻을 더해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이가 무언가를 하는 것을 단념시키는 대신\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">discouraging \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">child \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 그들을 장려한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">encourages \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아이가 무언가를 하는 것을 단념시키는 대신 트릭 처벌은 그들이 그것을 하도록 장려한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 트릭 처벌의 핵심 역설을 드러내는 문장입니다. 아이가 무엇을 하지 못하게 하려는 \u003cb class=\"key\">discourage\u003c/b>가 오히려 그 행동을 하도록 \u003cb class=\"key\">encourage\u003c/b>하게 만든다고 대조합니다. 이 대조가 \u003cb class=\"key\">트릭 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>이라는 개념의 중심 원리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 Instead of + 동명사구\u003c/span> : Instead of + [동명사구] + 주절 : \"아이가 무언가를 하는 것을 단념시키는 대신\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 discourage의 목적어 구조 (discourage + 목적어 + from + 동명사)\u003c/span> : discourage + [목적어] + from + [동명사구] : \"아이가 무언가를 하는 것을 단념시키는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 목적격 보어 (5형식)\u003c/span> : encourage + [목적어] + [to do it (to부정사)] : \"그들이 그것을 하도록 장려한다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Instead of discouraging the child from doing something, 아이가 무언가를 하는 것을 단념시키는 대신. it encourages them, 그것은 그들을 장려한다. to do it, 그것을 하도록. 이 문장 전체를 해석하면, 아이가 무언가를 하는 것을 단념시키는 대신 트릭 처벌은 그들이 그것을 하도록 장려한다.","hl":"m"},{"n":19,"text":"세 번째 문장은 트릭 처벌의 역설적 효과를 설명합니다. 아이가 어떤 행동을 그만두게 하려고 혼내도 오히려 그 행동을 하도록 부추긴다는 것이에요. discourage와 encourage라는 반대 개념을 대조해서 트릭 처벌의 핵심 원리를 보여 줍니다.","hl":"mn"},{"n":20,"text":"세 번째 문장에서 첫 번째 포인트는 Instead of discouraging the child from doing something이 전치사 Instead of에 동명사구를 쓴 표현이라는 점입니다. Instead of 뒤에는 명사 역할을 하는 동명사가 오고, 여기서는 discouraging이 동명사로 쓰였어요. 두 번째로 discourage는 목적어 the child와 from doing something을 함께 취합니다. 누군가가 어떤 행동을 하는 것을 단념시키는 구조예요. 세 번째로 it encourages them to do it에서는 encourage가 목적어 them과 to부정사를 보어로 취하는 오형식 동사입니다. 목적어가 to do it 하도록 장려한다는 의미를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Hugh는 배운다\u003c/span>\u003cspan class=\"en\">Hugh \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">learns \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 자신의 남동생을 때릴 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">hits \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">little \u003c/span>\u003cspan class=\"tgt\">brother\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 어머니가 그를 꾸짖는다\u003c/span>\u003cspan class=\"en\">his mother scolds him.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어 Hugh는 그가 자신의 남동생을 때릴 때 그의 어머니가 그를 꾸짖는다는 것을 배운다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">트릭 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>의 구체적인 예시입니다. Hugh가 남동생을 때리면 엄마가 꾸짖는다는 사실을 배운다는 내용으로, 아이에게 \u003cb class=\"key\">꾸중\u003c/b>이 벌이 아니라 관심의 신호가 될 수 있음을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that 명사절\u003c/span> : learns + that + 완전한 절 (목적어) : \"~라는 것을 배운다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 부사절 when\u003c/span> : when + 주어 + 동사 + 목적어 (he hits his little brother) : \"그가 자신의 남동생을 때릴 때\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"For example, 예를 들어. Hugh learns, Hugh는 배운다. that, ~라는 것을. when he hits his little brother, 그가 자신의 남동생을 때릴 때. his mother scolds him, 그의 어머니가 그를 꾸짖는다. 이 문장 전체를 해석하면, 예를 들어 Hugh는 그가 자신의 남동생을 때릴 때 그의 어머니가 그를 꾸짖는다는 것을 배운다.","hl":"m"},{"n":22,"text":"이 문장은 앞서 말한 트릭 처벌의 구체적인 예시입니다. Hugh가 남동생을 때리면 엄마가 꾸짖는다는 사실을 Hugh 자신이 배운다는 뜻이에요. 즉 꾸중이 아이에게 벌이 아니라 관심의 신호가 될 수 있다는 것을 보여 줍니다.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 learns that입니다. learns는 타동사여서 뒤에 that이 이끄는 명사절이 목적어로 옵니다. 여기서는 엄마가 꾸짖는다는 내용 전체를 Hugh가 배운다는 의미를 만들죠. 두 번째 어법 포인트는 when입니다. when은 그가 남동생을 때릴 때라는 시간 부사절을 이끌어서 that절 안의 시점을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">외로움을 느끼는 아이에게는\u003c/span>\u003cspan class=\"en\">For a child \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">feels \u003c/span>\u003cspan class=\"tgt\">lonely\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꾸중을 듣는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">scol 남동생을 때리는 것을 계속할 것이다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"For a child who feels lonely, 외로움을 느끼는 아이에게는. being scolded, 꾸중을 듣는 것이. is much better, 훨씬 낫다. than feeling invisible, 눈에 띄지 않는다고 느끼는 것보다. so he will continue, 그래서 그는 계속할 것이다. to hit his brother, 그의 남동생을 때리는 것을. 이 문장 전체를 해석하면, 외로움을 느끼는 아이에게는 꾸중을 듣는 것이 눈에 띄지 않는다고 느끼는 것보다 훨씬 나아서 그는 그의 남동생을 때리는 것을 계속할 것이다.","hl":"m"},{"n":25,"text":"이 문장은 꾸중이 왜 오히려 때리는 행동을 멈추게 하지 못하는지 그 핵심 원리를 설명합니다. 외로운 아이에게는 꾸중을 듣는 것이 눈에 띄지 않는다고 느끼는 것보다 훨씬 낫기 때문에, 결국 남동생을 계속 때리게 된다는 뜻이에요. 아이에게는 관심 자체가 보상이 되는 역설적인 상황입니다.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 who feels lonely입니다. who는 사람 선행사인 a child를 받는 주격 관계대명사이고, 뒤에 동사 feels가 와서 아이를 수식합니다. 두 번째 어법 포인트는 being scolded입니다. 이 표현은 문장의 주어인 동명사이고, 아이가 꾸중을 당하는 의미이기 때문에 수동태가 쓰였습니다. 세 번째 어법 포인트는 so입니다. so는 앞 내용의 결과를 이끄는 등위접속사로, 그래서 그는 남동생을 계속 때릴 것이라는 결과로 연결됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 경우에,\u003c/span>\u003cspan class=\"en\">In this case,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 어머니는 보다 나을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">mother \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 전략을 채택하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">adopting \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">strategy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 경우에, 그의 어머니는 다른 전략을 채택하는 것이 보다 나을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 꾸중으로 문제 행동을 다루는 대신 전략을 바꿔야 한다는 전환점입니다. Hugh의 경우 or 기간을 함께 써서, 일정 기간 동안 때리지 않은 상태가 지속되었음을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어머니는 분명 아이가 ~하는 것을 내버려둘 수 없다\u003c/span>\u003cspan class=\"en\">The mother clearly cannot \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">allow \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">child \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 남동생을 때리는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">hit \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">little \u003c/span>\u003cspan class=\"tgt\">brother\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 부정적 측면을 계속 지적하는 대신에\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">constantly \u003c/span>\u003cspan class=\"tgt\">pointing \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">negatives\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 긍정적 측면을 보상하는 것을 선택할 수 있다\u003c/span>\u003cspan class=\"en\">she can \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">choose \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reward \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">positives\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어머니는 분명 아이가 그의 남동생을 때리는 것을 내버려둘 수 없고, 그녀는 부정적 측면을 계속 지적하는 대신에 긍정적 측면을 보상하는 것을 선택할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어머니가 아이의 때리는 행동을 \u003cb class=\"key\">허용\u003c/b>할 수는 없지만, 부정적 측면을 지적하는 대신 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">측면을 \u003c/b>\u003cb class=\"key\">보상\u003c/b>할 수 있다는 전환점을 제시합니다. 즉, 잘못을 그냥 두라는 말이 아니라 주의를 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>으로 돌리라는 것입니다. 앞 문장의 예를 일반적인 전략으로 확장합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">allow + 목적어 + to부정사\u003c/span> : allow + 목적어 + to-v : \"아이가 남동생을 때리는 것을 허용하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 instead of + 동명사\u003c/span> : instead of + V-ing + 목적어 : \"부정적 측면을 계속 지적하는 대신에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">choose + to부정사\u003c/span> : choose + to-v : \"긍정적 측면을 보상하는 것을 선택하다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The mother clearly cannot allow the child, 어머니는 분명 아이가 ~하는 것을 내버려둘 수 없다. to hit his little brother, 그의 남동생을 때리는 것을. but instead of constantly pointing out the negatives, 그러나 부정적 측면을 계속 지적하는 대신에. she can choose to reward the positives, 그녀는 긍정적 측면을 보상하는 것을 선택할 수 있다. 이 문장 전체를 해석하면, 어머니는 분명 아이가 그의 남동생을 때리는 것을 내버려둘 수 없고, 그녀는 부정적 측면을 계속 지적하는 대신에 긍정적 측면을 보상하는 것을 선택할 수 있다.","hl":"m"},{"n":34,"text":"이 문장은 어머니가 아이가 남동생을 때리는 행동을 허용할 수는 없지만, 부정적인 측면을 계속 지적하는 대신 긍정적인 측면을 보상할 수 있다는 전략의 전환점을 보여 줍니다. 잘못된 행동을 그냥 두라는 뜻이 아니라 주의를 긍정적인 행동으로 돌리라는 것이죠. 앞 예시의 방법을 일반적인 전략으로 확장하는 역할을 합니다.","hl":"mn"},{"n":35,"text":"첫 번째, allow the child to hit his little brother는 allow 목적어 to부정사 구조로, 아이가 남동생을 때리는 것을 허용하다라는 뜻입니다. 두 번째, instead of constantly pointing out the negatives에서 instead of는 전치사이므로 뒤에 동명사 pointing이 왔습니다. 세 번째, choose to reward the positives는 choose가 to부정사를 목적어로 취해 긍정적 측면을 보상하는 것을 선택하다라는 뜻입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이렇게 어느 부모든 피할 수 있다 트릭 처벌을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">way\u003c/span>, any parent \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">avoid\u003c/span> trick­punishments.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이렇게 어느 부모도 트릭 처벌을 피할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 \u003cb class=\"key\">결론\u003c/b>으로, \u003cb class=\"key\">트릭 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>을 피하는 방법을 모든 부모가 사용할 수 있다고 정리합니다. 'In this way'는 앞서 설명한 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">보상\u003c/b> 전략을 가리킵니다. 이를 통해 벌이 오히려 행동을 강화하는 함정에서 벗어나라는 메시지를 전합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 (방법의 부사구)\u003c/span> : in + this + way : \"이렇게, 이런 식으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : S + can + 동사원형 : \"피할 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"In this way, 이렇게. any parent can avoid, 어느 부모든 피할 수 있다. trick-punishments, 트릭 처벌을. 이 문장 전체를 해석하면, 이렇게 어느 부모도 트릭 처벌을 피할 수 있다.","hl":"m"},{"n":37,"text":"이 문장은 글 전체의 결론으로, 이런 식으로 하면 어느 부모든 트릭 처벌을 피할 수 있다고 정리합니다. In this way는 앞에서 설명한 긍정적인 행동을 보상하는 전략을 가리킵니다. 벌이 오히려 행동을 강화하는 함정에서 벗어나라는 메시지를 담고 있습니다.","hl":"mn"},{"n":38,"text":"첫 번째, In this way는 이런 식으로라는 뜻으로, 앞 문장의 방법을 가리키는 전치사구입니다. 두 번째, can avoid에서 can은 가능을 나타내는 조동사이고 뒤에는 동사원형 avoid가 왔습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">트릭 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>은 꾸짖음이나 처벌이지만 아이의 행동을 \u003cb class=\"key\">장려\u003c/b>하는 역설을 낳는다.\u003c/li>\u003cli>Hugh는 외로움 때문에 \u003cb class=\"key\">꾸중\u003c/b>을 관심으로 받아들여 남동생을 계속 때린다.\u003c/li>\u003cli>부모는 부정적 측면을 \u003cb class=\"key\">지적\u003c/b>하는 대신 긍정적 측면을 \u003cb class=\"key\">보상\u003c/b>해야 한다.\u003c/li>\u003cli>이렇게 하면 어떤 부모든 \u003cb class=\"key\">트릭 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>을 피할 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Punishing a child through scolding may reinforce misbehavior, so parents should reward positive behavior to avoid trick-punishments.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아이를 꾸짖는 \u003cb class=\"key\">트릭 \u003c/b>\u003cb class=\"key\">처벌\u003c/b>은 오히려 잘못된 행동을 \u003cb class=\"key\">장려\u003c/b>할 수 있으므로, 부모는 부정적 측면을 지적하는 대신 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">측면\u003c/b>을 보상해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 정리하면, 트릭 처벌은 아이가 잘못된 행동을 단념하기는커녕 오히려 그 행동을 강화할 수 있어요. Hugh의 예시처럼 외로운 아이에게 꾸중은 관심이 되어 때리는 행동을 계속하게 만들죠. 따라서 부모는 부정적 측면을 지적하기보다 긍정적 측면을 보상해야 해요. 이렇게 하면 트릭 처벌을 피할 수 있다는 것이 이 지문의 핵심입니다. 오늘 수업은 여기까지예요. 여러분 모두 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
