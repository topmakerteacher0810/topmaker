</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 31번","audioDir":"31_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">31번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>The Octopus That Hunts in Disguise\u003c/h1>\u003ch2>변신 사냥꾼, 문어\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>문어는 보통 \u003cb class=\"key\">숨어 \u003c/b>\u003cb class=\"key\">지내는 \u003c/b>\u003cb class=\"key\">방어\u003c/b>와 \u003cb class=\"key\">야간 \u003c/b>\u003cb class=\"key\">사냥\u003c/b>에 의존한다. 그런데 낮의 얕은 물에서 \u003cb class=\"key\">넙치\u003c/b>로 \u003cb class=\"key\">변신\u003c/b>한 문어가 발견되면서, 문어가 큰 \u003cb class=\"key\">뇌\u003c/b>와 \u003cb class=\"key\">시력\u003c/b>, \u003cb class=\"key\">색깔 \u003c/b>\u003cb class=\"key\">변화\u003c/b>로 다른 생물을 \u003cb class=\"key\">의태\u003c/b>하며 사냥까지 한다는 사실이 드러난다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Octopuses use their large brains, sharp eyesight, and color-changing ability to mimic other creatures and hunt while disguised.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 전국연합학력평가 서른한 번째 지문을 함께 볼게요. 이 지문은 문어가 다른 생물로 변신해서 사냥하는 모습을 다룬 글이에요. 먼저 전체 요약을 말씀드리면 문어는 보통 숨어 지내며 방어하지만, 이 문어는 대낮에 넙치로 변신해서 눈을 속이고 사냥까지 한다는 내용이에요. 핵심 요지는 문어가 큰 뇌와 시력과 색깔 변화 능력으로 다른 생물을 흉내 내며 사냥한다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">문어는 \u003cb class=\"key\">두족류\u003c/b>에 속하는 무척추동물로, \u003cb class=\"key\">뇌\u003c/b>가 크고 \u003cb class=\"key\">눈\u003c/b>의 구조가 사람과 비슷할 만큼 뛰어난 \u003cb class=\"key\">시력\u003c/b>을 가졌어요. 피부에는 \u003cb class=\"key\">색소포\u003c/b>라는 세포가 있어서 주변 환경에 맞춰 \u003cb class=\"key\">색깔과 \u003c/b>\u003cb class=\"key\">무늬\u003c/b>를 빠르게 바꿀 수 있죠. 이런 능력은 \u003cb class=\"key\">위장\u003c/b>뿐 아니라 다른 위험한 생물을 흉내 내는 \u003cb class=\"key\">의태\u003c/b>로도 발전했어요. 예를 들어 어떤 문어는 \u003cb class=\"key\">바다뱀\u003c/b>이나 \u003cb class=\"key\">넙치\u003c/b>처럼 보이게 몸을 접고 눈의 위치를 조절해 \u003cb class=\"key\">착시\u003c/b>를 만들어요. 일상의 비유로 말하면 스파이가 변장을 바꿔 가며 적의 눈을 속이는 것과 비슷해요. 이 지문의 문어는 \u003cb class=\"key\">모방\u003c/b>을 사냥 전략으로도 사용한다는 점이 흥미로워요.\u003c/div>","segs":[{"n":2,"text":"배경지식을 먼저 정리해 볼게요. 문어는 두족류에 속하는 무척추동물인데 뇌가 크고 눈 구조가 사람과 비슷할 정도로 시력이 좋아요. 피부에는 색소포라는 세포가 있어서 주변 환경에 맞춰 색깔과 무늬를 빠르게 바꿀 수 있죠. 이런 능력은 단순한 위장을 넘어 위험한 생물을 흉내 내는 의태로 발전했어요. 어떤 문어는 바다뱀이나 넙치처럼 보이도록 몸을 접고 눈의 위치를 조절해서 착시를 만들어요. 이것은 마치 스파이가 변장을 바꿔 가며 적을 속이는 것과 비슷해요. 이 지문의 문어는 모방을 사냥 전략으로도 사용한다는 점이 아주 흥미로워요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>방어 본능은 숨기와 야간 사냥\u003csmall>통념 · 문장 1\u003c/small>\u003c/h4>\u003cp>첫 문장은 문어의 일반적인 \u003cb class=\"key\">방어\u003c/b> 전략을 제시한다. 대부분의 문어 종은 \u003cb class=\"key\">숨어 \u003c/b>\u003cb class=\"key\">지내기\u003c/b>와 \u003cb class=\"key\">야간 \u003c/b>\u003cb class=\"key\">사냥\u003c/b>을 택한다. 이는 문어에게 \u003cb class=\"key\">노출\u003c/b>이 곧 위험임을 암시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>낮에 포착된 넙치 착시\u003csmall>전환 · 문장 2–4\u003c/small>\u003c/h4>\u003cp>사진작가들은 \u003cb class=\"key\">대낮\u003c/b>의 \u003cb class=\"key\">얕은 \u003c/b>\u003cb class=\"key\">물\u003c/b>에서 전신이 보이는 문어를 발견해 \u003cb class=\"key\">놀라움\u003c/b>을 느낀다. 처음에는 \u003cb class=\"key\">넙치\u003c/b>로 보였지만 다시 보니 \u003cb class=\"key\">팔 \u003c/b>\u003cb class=\"key\">여덟 \u003c/b>\u003cb class=\"key\">개\u003c/b>를 접고 \u003cb class=\"key\">눈\u003c/b>을 위로 향한 문어였다. 이 장면은 \u003cb class=\"key\">착시\u003c/b>를 이용한 \u003cb class=\"key\">모방\u003c/b>의 구체적 예이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>변신을 가능케 하는 능력\u003csmall>주장 · 문장 5\u003c/small>\u003c/h4>\u003cp>문어는 큰 \u003cb class=\"key\">뇌\u003c/b>, 뛰어난 \u003cb class=\"key\">시력\u003c/b>, \u003cb class=\"key\">색깔과 \u003c/b>\u003cb class=\"key\">무늬 \u003c/b>\u003cb class=\"key\">변화\u003c/b> 능력을 지닌다. 이 \u003cb class=\"key\">이점\u003c/b>들을 활용해 자신을 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">생물\u003c/b>로 바꾼다. 이 문장은 모방 능력의 \u003cb class=\"key\">원리\u003c/b>를 설명한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>모방하며 사냥하는 전략\u003csmall>예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>이후 이 종의 문어가 \u003cb class=\"key\">바다뱀\u003c/b>으로 변신하는 사진도 발견되었다. 모방은 \u003cb class=\"key\">방어\u003c/b>에 그치지 않고 \u003cb class=\"key\">사냥\u003c/b>에도 쓰인다. 예컨대 \u003cb class=\"key\">넙치\u003c/b>로 보이던 문어가 갑자기 \u003cb class=\"key\">문어 \u003c/b>\u003cb class=\"key\">다리\u003c/b>를 구멍에 넣어 사냥하는 장면이 나타난다. 이로써 \u003cb class=\"key\">의태\u003c/b>와 \u003cb class=\"key\">포식\u003c/b>이 연결된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 문장에서는 문어의 일반적인 방어 전략을 제시해요. 대부분 문어 종은 가능한 한 많이 숨어 지내고 밤에 사냥을 하는 것이 최선의 방어라고 해요. 이 내용은 문어에게 낮에 모습을 드러내는 것이 얼마나 위험한 일인지 보여 주는 배경이에요.","hl":"f0"},{"n":5,"text":"두 번째 문장부터 네 번째 문장까지는 사진작가 두 명이 낮의 얕은 곳에서 전신이 보이는 문어를 발견한 사례가 나와요. 처음 보기에는 넙치였는데 다시 자세히 보니 팔 여덟 개를 모두 접고 눈을 위쪽으로 향한 중간 크기의 문어였어요. 이 문어는 그런 자세로 넙치라는 착시를 만들고 있었던 거예요.","hl":"f1"},{"n":6,"text":"다섯 번째 문장은 문어가 어떻게 그런 변신을 할 수 있는지 설명해요. 문어는 큰 뇌와 뛰어난 시력, 그리고 색깔과 무늬를 바꾸는 능력을 가지고 있어요. 이 문어는 이런 이점들을 이용해서 자신을 완전히 다른 생물로 바꾸고 있었어요.","hl":"f2"},{"n":7,"text":"여섯 번째와 일곱 번째 문장에서는 다른 모방 사례와 사냥 장면이 나와요. 그 후로 이 종의 더 많은 개체가 발견되었고 바다뱀으로 변신하는 문어 사진도 찍혔어요. 그리고 중요한 건 변신을 하면서 사냥도 한다는 사실이에요. 예를 들어 넙치처럼 보이던 문어가 갑자기 문어 다리 같은 팔을 구멍에 찔러 넣고 숨어 있는 먹이를 움켜잡는 광경이 펼쳐져요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 문어의 \u003cb class=\"key\">모방\u003c/b>을 구체적인 \u003cb class=\"key\">관찰 \u003c/b>\u003cb class=\"key\">사례\u003c/b>로 뒷받침한다. 첫째부터 넷째 문장까지는 \u003cb class=\"key\">넙치\u003c/b>로 보였던 문어 목격담을 제시하고, 다섯째 문장에서 \u003cb class=\"key\">변신 \u003c/b>\u003cb class=\"key\">능력\u003c/b>의 일반 원리를 정리한다. 이후 여섯째와 일곱째 문장은 \u003cb class=\"key\">바다뱀\u003c/b> 모방과 \u003cb class=\"key\">사냥\u003c/b> 장면을 추가 예시로 제시한다. 주제문이 가운데 있는 \u003cb class=\"key\">중괄식\u003c/b> 구조로, 앞뒤에 예시가 배치되어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (2)\u003c/b>\u003cspan>결과·추론\u003c/span>\u003cb>Actually (3)\u003c/b>\u003cspan>수정·반전\u003c/span>\u003cb>only when (4)\u003c/b>\u003cspan>강조·조건\u003c/span>\u003cb>since then (6)\u003c/b>\u003cspan>시간 경과·추가 정보\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the illusion\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">turn itself into a completely different creature\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">transforming into sea snakes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mimic\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>일반적인 문어의 방어\u003c/th>\u003cth>이 문어의 의태 전략\u003c/th>\u003c/tr>\u003ctr>\u003ctd>숨어 있고 밤에 사냥함\u003c/td>\u003ctd>대낮에 전체가 보이도록 나옴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>포식자를 피하는 소극적 방어\u003c/td>\u003ctd>다른 생물로 변신해 속이는 적극적 방어\u003c/td>\u003c/tr>\u003ctr>\u003ctd>변신 없이 원래 모습 유지\u003c/td>\u003ctd>넙치나 바다뱀으로 변신\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"전개 방식과 구조를 정리해 볼게요. 이 글은 문어의 의태를 구체적인 관찰 사례로 뒷받침하는 예시 구조예요. 주제문은 다섯 번째 문장에 있고 앞뒤로 예시가 배치된 중괄식 구조라고 볼 수 있어요. 첫 번째부터 네 번째 문장은 넙치로 변신한 문어 목격담이고 여섯 번째와 일곱 번째 문장은 바다뱀 모방과 사냥 장면이라는 추가 예시거든요. 그래서 가운데 있는 일반 원리를 중심으로 앞뒤에 구체적 사례가 붙는 형태예요.","hl":"ty"},{"n":9,"text":"이제 글을 읽을 때 단서가 되는 표현들을 짚어 볼게요. 두 번째 문장의 So는 앞 문장에서 자연스럽게 이어지는 결과나 추론을 나타내요. 세 번째 문장의 Actually는 처음 본 것을 수정하면서 반전을 만들어요. 네 번째 문장의 only when은 다시 봤을 때서야 진짜 모습을 알아봤다는 강조의 표현이에요. 여섯 번째 문장의 since then은 시간이 지난 뒤 추가 정보가 나온다는 신호예요. 그리고 stay hidden, the illusion, turn itself into a completely different creature, transforming into sea snakes, mimic 같은 표현은 모두 문어의 변신이라는 같은 개념을 바꿔 말한 거예요. 또한 일반적인 숨는 방어와 이 문어의 의태 전략이 대조를 이뤄요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>defence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방어\u003c/span>\u003c/div>\u003cdiv>\u003cb>species\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종\u003c/span>\u003c/div>\u003cdiv>\u003cb>octopus\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문어\u003c/span>\u003c/div>\u003cdiv>\u003cb>stay hidden\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>숨어 지내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hunt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사냥하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in full view\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전체가 보이는\u003c/span>\u003c/div>\u003cdiv>\u003cb>shallows\u003c/b>\u003cem>명사\u003c/em>\u003cspan>얕은 곳\u003c/span>\u003c/div>\u003cdiv>\u003cb>daylight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대낮\u003c/span>\u003c/div>\u003cdiv>\u003cb>underwater photographer\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>수중 사진작가\u003c/span>\u003c/div>\u003cdiv>\u003cb>flounder\u003c/b>\u003cem>명사\u003c/em>\u003cspan>넙치\u003c/span>\u003c/div>\u003cdiv>\u003cb>medium-sized\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중간 크기의\u003c/span>\u003c/div>\u003cdiv>\u003cb>fold\u003c/b>\u003cem>동사\u003c/em>\u003cspan>접다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stare\u003c/b>\u003cem>동사\u003c/em>\u003cspan>응시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>upwards\u003c/b>\u003cem>부사\u003c/em>\u003cspan>위쪽으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>illusion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>착시, 착각\u003c/span>\u003c/div>\u003cdiv>\u003cb>brain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뇌\u003c/span>\u003c/div>\u003cdiv>\u003cb>eyesight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시력\u003c/span>\u003c/div>\u003cdiv>\u003cb>ability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>change colour and pattern\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>색깔과 패턴을 바꾸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>asset\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이점, 자산\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn A into B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B로 바꾸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>creature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생물체\u003c/span>\u003c/div>\u003cdiv>\u003cb>since then\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그때 이후로\u003c/span>\u003c/div>\u003cdiv>\u003cb>transform into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 변신하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sea snake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다뱀\u003c/span>\u003c/div>\u003cdiv>\u003cb>mimic\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모방하다, 의태하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>develop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생기다, 발달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stick\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찔러 넣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grab\u003c/b>\u003cem>동사\u003c/em>\u003cspan>움켜잡다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이제 핵심 어휘 몇 개를 정리할게요. defence는 방어라는 뜻이고 species는 종, stay hidden은 숨어 지내다예요. in full view는 전체가 보이는 상태를 뜻하고 flounder는 넙치, illusion은 착시나 착각이에요. asset은 이점이나 자산이고 mimic은 모방하다, 의태하다라는 뜻이에요. 구문으로는 turn A into B가 A를 B로 바꾸다이고 transform into는 무엇으로 변신하다예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">defence\u003c/b>\u003cspan class=\"m\">방어\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">protection\u003c/span>\u003cspan class=\"s\">safeguard\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">attack\u003c/span>\u003cspan class=\"a\">offense\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hidden\u003c/b>\u003cspan class=\"m\">숨은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">concealed\u003c/span>\u003cspan class=\"s\">covered\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exposed\u003c/span>\u003cspan class=\"a\">visible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">surprise\u003c/b>\u003cspan class=\"m\">놀라움\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shock\u003c/span>\u003cspan class=\"s\">amazement\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expectation\u003c/span>\u003cspan class=\"a\">predictability\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">illusion\u003c/b>\u003cspan class=\"m\">착각, 환상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">delusion\u003c/span>\u003cspan class=\"s\">misconception\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reality\u003c/span>\u003cspan class=\"a\">truth\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">asset\u003c/b>\u003cspan class=\"m\">이점, 자산\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">advantage\u003c/span>\u003cspan class=\"s\">strength\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weakness\u003c/span>\u003cspan class=\"a\">liability\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mimic\u003c/b>\u003cspan class=\"m\">모방하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">imitate\u003c/span>\u003cspan class=\"s\">copy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">transform\u003c/b>\u003cspan class=\"m\">변신시키다, 변화시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">convert\u003c/span>\u003cspan class=\"s\">alter\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">preserve\u003c/span>\u003cspan class=\"a\">maintain\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 볼게요. defence는 protection이나 safeguard와 바꿔 쓸 수 있고 반대말은 attack이나 offense예요. hidden은 concealed나 covered와 의미가 비슷하고 exposed나 visible과 반대예요. surprise는 shock이나 amazement와 유사하고 expectation이나 predictability와 반대예요. illusion은 delusion이나 misconception과 뜻이 통하고 reality나 truth와 반대예요. asset은 advantage나 strength와 같고 weakness나 liability와 반대예요. mimic은 imitate나 copy와 같아요. transform은 convert나 alter와 뜻이 비슷하고 preserve나 maintain과 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최고의 방어는\u003c/span>\u003cspan class=\"en\">The best defence\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 문어 종(種)이 가진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">species \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">octopus \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숨어 있는 것이다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stay \u003c/span>\u003cspan class=\"tgt\">hidden\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능한 한 많이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">possible\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들 자신의 사냥을 하는 것이다\u003c/span>\u003cspan class=\"en\">and do their own hunting\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밤에.\u003c/span>\u003cspan class=\"en\">at night.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분의 문어 종(種)이 가진 최고의 방어는 가능한 한 많이 숨어 있는 것과 밤에 그들 자신의 사냥을 하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문어 종 대부분이 가진 최고의 방어책은 최대한 숨어 지내고 밤에 사냥하는 것이다. 이 문장은 문어의 일반적인 \u003cb class=\"key\">방어 \u003c/b>\u003cb class=\"key\">전략\u003c/b>을 제시하며, 뒤에 나올 예외적 사례와 대비되는 기준점 역할을 한다. 'as much as possible'은 \u003cb class=\"key\">가능한 \u003c/b>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">많이\u003c/b>라는 관용 표현이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : 선행사(The best defence) + (that/which) + 주어(most species of octopus) + 동사(have) : \"대부분의 문어 종이 가진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (주격 보어)\u003c/span> : 주어(The best defence...) + is + to부정사구(to stay hidden...) : \"숨어 있는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">원급 비교 관용 표현\u003c/span> : as + much + as + possible : \"가능한 한 많이\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The best defence, 최고의 방어는. most species of octopus have, 대부분의 문어 종(種)이 가진. is to stay hidden, 숨어 있는 것이다. as much as possible, 가능한 한 많이. and do their own hunting, 그리고 그들 자신의 사냥을 하는 것이다. at night, 밤에.. 이 문장 전체를 해석하면, 대부분의 문어 종(種)이 가진 최고의 방어는 가능한 한 많이 숨어 있는 것과 밤에 그들 자신의 사냥을 하는 것이다.","hl":"m"},{"n":13,"text":"이 문장은 문어 종 대부분이 가진 최고의 방어 전략이 가능한 한 많이 숨어 지내고 밤에 사냥하는 것이라고 말하고 있어요. stay hidden은 계속 숨어 있는 상태를 유지한다는 뜻이고, as much as possible은 가능한 한 많이라는 관용 표현이죠. 이 문장은 뒤에서 낮에 드러난 문어를 발견했다는 내용과 대비되는 기준점이 됩니다.","hl":"mn"},{"n":14,"text":"이 문장에는 세 가지 포인트가 있어요. 첫째, most species of octopus have는 앞의 The best defence를 수식하는 목적격 관계대명사절인데요, 목적격 관계대명사 that이나 which가 생략된 거예요. 둘째, to stay hidden은 is 뒤에서 주격 보어로 쓰인 명사적 용법의 to부정사예요. 셋째, as much as possible은 가능한 한 많이라는 원급 비교 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 문어를 발견하는 것은\u003c/span>\u003cspan class=\"en\">So \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전체가 보이는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">full \u003c/span>\u003cspan class=\"tgt\">view \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얕은 곳에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">shallows \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낮에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">daylight\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라운 일이었다\u003c/span>\u003cspan class=\"en\">was a surprise\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 명의 호주 수중 사진작가들에게는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">Australian \u003c/span>\u003cspan class=\"tgt\">underwater \u003c/span>\u003cspan class=\"tgt\">photographers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 낮에 얕은 곳에서 전체가 보이는 문어를 발견한 것은 두 명의 호주 수중 사진작가들에게는 놀라운 일이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그래서 낮에 얕은 물에서 문어가 완전히 드러난 모습으로 발견된 것은 호주 수중 사진작가 두 명에게 \u003cb class=\"key\">놀라운 \u003c/b>\u003cb class=\"key\">일\u003c/b>이었다. 앞 문장의 일반적 방어 습성 때문에 이 발견이 예외적인 사건임을 강조하며, 이야기의 \u003cb class=\"key\">전환점\u003c/b>을 만든다. 'in full view'는 가려진 데 없이 \u003cb class=\"key\">전체가 \u003c/b>\u003cb class=\"key\">다 \u003c/b>\u003cb class=\"key\">보이는\u003c/b> 상태를 뜻한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (주어)\u003c/span> : To부정사구(to find...) + was + 보어(a surprise) : \"전체가 보이는, 낮에, 얕은 곳에서 문어를 발견하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 (for + 명사구)\u003c/span> : for + two Australian underwater photographers : \"두 명의 호주 수중 사진작가들에게는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"So to find one, 그래서 문어를 발견하는 것은. in full view, 전체가 보이는. in the shallows, 얕은 곳에서. in daylight, 낮에. was a surprise, 놀라운 일이었다. for two Australian underwater photographers, 두 명의 호주 수중 사진작가들에게는.. 이 문장 전체를 해석하면, 그래서 낮에 얕은 곳에서 전체가 보이는 문어를 발견한 것은 두 명의 호주 수중 사진작가들에게는 놀라운 일이었다.","hl":"m"},{"n":16,"text":"이 문장은 낮에 얕은 곳에서 문어가 완전히 드러난 모습으로 발견된 것이 두 명의 호주 수중 사진작가들에게 놀라운 일이었다는 내용이에요. 앞 문장에서 문어는 보통 숨어 지낸다고 했기 때문에 이 발견이 예외적인 사건으로 강조되는 거죠. in full view는 전체가 다 보이는 상태를 뜻해요.","hl":"mn"},{"n":17,"text":"이 문장의 첫 번째 포인트는 to find one in full view in the shallows in daylight가 문장의 주어로 쓰인 거예요. to부정사가 주어 자리에 오면 단수 취급해서 was가 왔고요. 두 번째 포인트는 for two Australian underwater photographers가 전치사 for로 누구에게 놀라운 일인지를 나타내는 전치사구라는 점이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실\u003c/span>\u003cspan class=\"en\">Actually,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 본 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">saw\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">first\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">넙치였다.\u003c/span>\u003cspan class=\"en\">was a flounder.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실 그들이 처음에 봤던 것은 넙치였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사실 그들이 처음에 본 것은 넙치였다. 문어가 다른 생물로 \u003cb class=\"key\">위장\u003c/b>하고 있었다는 반전을 제시하며, 뒤따르는 문어의 \u003cb class=\"key\">의태\u003c/b> 묘사를 이끌어 내는 문장이다. 'what they saw'는 그들이 본 대상 전체를 가리키는 \u003cb class=\"key\">명사절\u003c/b>이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what (선행사 포함)\u003c/span> : what + 주어(they) + 동사(saw) : \"그들이 본 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현 (전치사구)\u003c/span> : at + first : \"처음에는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Actually, 사실. what they saw, 그들이 본 것은. at first, 처음에. was a flounder, 넙치였다.. 이 문장 전체를 해석하면, 사실 그들이 처음에 봤던 것은 넙치였다.","hl":"m"},{"n":19,"text":"이 문장은 처음에 그들이 본 것이 문어가 아니라 넙치였다는 반전을 알려줘요. 문어가 넙치로 보이도록 위장하고 있었다는 뜻이죠. what they saw는 그들이 본 대상 전체를 가리키는 명사절이에요.","hl":"mn"},{"n":20,"text":"이 문장의 핵심은 what they saw에요. 관계대명사 what은 선행사 the thing을 포함하고 뒤에 불완전한 절이 와서 그들이 본 것이라는 뜻의 명사절을 만들어요. 그리고 at first는 처음에는이라는 뜻의 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 그들이 다시 봤을 때서야 그들은 중간 크기의 문어를 보았고 그것의 여덟 개의 모든 팔이 접혀 있었고 그것의 두 눈이 위쪽으로 응시하고 있었다 착시를 만들기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">again \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> they saw a medium­sized octopus, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">eight \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">arms \u003c/span>\u003cspan class=\"tgt\">folded \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">eyes \u003c/span>\u003cspan class=\"tgt\">staring \u003c/span>\u003cspan class=\"tgt\">upwards\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">create \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">illusion\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오직 그들이 다시 봤을 때서야 그들은 중간 크기의 문어를 보았고 착시를 만들기 위해 그것의 여덟 개의 모든 팔이 접혀 있었고 그것의 두 눈이 위쪽 으로 응시하고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 처음에 넙치로 보였던 존재가 사실은 \u003cb class=\"key\">문어\u003c/b>였음을 밝히는 핵심 문장이다. \u003cb class=\"key\">It \u003c/b>\u003cb class=\"key\">was \u003c/b>\u003cb class=\"key\">only \u003c/b>\u003cb class=\"key\">when \u003c/b>\u003cb class=\"key\">they \u003c/b>\u003cb class=\"key\">looked \u003c/b>\u003cb class=\"key\">again \u003c/b>\u003cb class=\"key\">that\u003c/b> 강조구문으로 다시 봤을 때서야 비로소 알게 되었음을 강조하고, \u003cb class=\"key\">with \u003c/b>\u003cb class=\"key\">+ \u003c/b>\u003cb class=\"key\">목적어 \u003c/b>\u003cb class=\"key\">+ \u003c/b>\u003cb class=\"key\">분사\u003c/b> 구문으로 팔을 접고 눈을 위로 향한 문어의 구체적 모습을 보여 준다. 이 모습이 넙치라는 \u003cb class=\"key\">착시\u003c/b>를 만들어 냈다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">It that 강조구문\u003c/span> : It was only [when they looked again] that [they saw a medium-sized octopus] : \"오직 그들이 다시 봤을 때서야\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">with + 목적어 + 분사(부대상황)\u003c/span> : with + [목적어 all eight of its arms] + [과거분사 folded] and [목적어 its two eyes] + [현재분사 staring upwards] : \"그것의 여덟 개의 모든 팔이 접혀 있고 그것의 두 눈이 위쪽으로 응시하고 있는 채로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : staring upwards + [to create the illusion (to부정사구/부사적 용법(목적))] : \"착시를 만들기 위해\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It was only when they looked again, 오직 그들이 다시 봤을 때서야. that they saw a medium-sized octopus, 그들은 중간 크기의 문어를 보았고. with all eight of its arms folded, 그것의 여덟 개의 모든 팔이 접혀 있었고. and its two eyes staring upwards, 그것의 두 눈이 위쪽으로 응시하고 있었다. to create the illusion, 착시를 만들기 위해.. 이 문장 전체를 해석하면, 오직 그들이 다시 봤을 때서야 그들은 중간 크기의 문어를 보았고 착시를 만들기 위해 그것의 여덟 개의 모든 팔이 접혀 있었고 그것의 두 눈이 위쪽 으로 응시하고 있었다.","hl":"m"},{"n":22,"text":"이 문장은 처음에 넙치라고 생각했던 것이 사실은 문어였다는 것을 강조합니다. It was only when they looked again that 구조는 다시 봤을 때서야 비로소 보였다는 의미를 강조하고, with all eight of its arms folded and its two eyes staring upwards는 팔을 접고 눈을 위로 향한 문어의 구체적인 모습을 보여 줍니다. 결국 이 모습이 넙치라는 착시를 만들어 냈던 거죠.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 It was only when they looked again that에 들어 있는 It that 강조구문입니다. 여기서 when they looked again이라는 시간의 부사절을 통째로 강조해서 오직 다시 봤을 때서야 비로소라는 뜻을 만듭니다. 두 번째 포인트는 with all eight of its arms folded and its two eyes staring upwards인데요, with 목적어 분사 구문으로 부대 상황을 나타냅니다. folded는 팔이 접힌 수동의 뜻이고 staring upwards는 눈이 위로 향하는 능동의 뜻이라서 목적어와 분사의 관계를 잡아야 합니다. 세 번째 포인트는 to create the illusion인데요, 이건 착시를 만들기 위한 목적을 나타내는 to부정사의 부사적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문어는 큰 뇌,\u003c/span>\u003cspan class=\"en\">An octopus has a big brain,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뛰어난 시력과\u003c/span>\u003cspan class=\"en\">excellent eyesight\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">색깔과 패턴을 바꾸는 능력을 지니고 있고\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ability \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">change \u003c/span>\u003cspan class=\"tgt\">colour \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">pattern\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이것은 이러한 이점을 사용하고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">assets\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스스로를 완전히 다른 생물체로 바꾸기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">turn \u003c/span>\u003cspan class=\"tgt\">itself \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">completely \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">creature\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">문어는 큰 뇌, 뛰어난 시력과 색깔과 패턴을 바꾸는 능력을 지니고 있고, 이것은 스스로를 완전히 다른 생물체로 바꾸기 위해 이러한 이점을 사용하고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 본 문어의 모습이 어떻게 가능했는지 그 이유를 문어의 능력으로 설명하는 문장이다. \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">뇌\u003c/b>, \u003cb class=\"key\">뛰어난 \u003c/b>\u003cb class=\"key\">시력\u003c/b>, \u003cb class=\"key\">색깔과 \u003c/b>\u003cb class=\"key\">패턴을 \u003c/b>\u003cb class=\"key\">바꾸는 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이라는 세 가지 자산을 병렬로 제시하고, this one이 그 \u003cb class=\"key\">이점\u003c/b>을 이용해 완전히 다른 생물체로 변신했다고 정리한다. 앞 문장의 착시가 단순한 우연이 아니라 문어의 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">능력\u003c/b>에 기반한 모방임을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the ability [명사] + [to change colour and pattern (to부정사구/형용사적 용법)] : \"색깔과 패턴을 바꾸는 능력\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and와 대명사의 지시\u003c/span> : and [this one (대명사) + was using + these assets (대명사)] : \"그리고 이것은 이러한 이점을 사용하고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : was using these assets + [to turn itself into a completely different creature (to부정사구/부사적 용법(목적))] : \"스스로를 완전히 다른 생물체로 바꾸기 위해\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"An octopus has a big brain, 문어는 큰 뇌. excellent eyesight, 뛰어난 시력과. and the ability to change colour and pattern, 색깔과 패턴을 바꾸는 능력을 지니고 있고. and this one was using these assets, 그리고 이것은 이러한 이점을 사용하고 있었다. to turn itself into a completely different creature, 스스로를 완전히 다른 생물체로 바꾸기 위해.. 이 문장 전체를 해석하면, 문어는 큰 뇌, 뛰어난 시력과 색깔과 패턴을 바꾸는 능력을 지니고 있고, 이것은 스스로를 완전히 다른 생물체로 바꾸기 위해 이러한 이점을 사용하고 있었다.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 본 문어의 변신이 어떻게 가능했는지를 설명합니다. 문어가 가진 큰 뇌, 뛰어난 시력, 색깔과 패턴을 바꾸는 능력이라는 세 가지 자산을 병렬로 제시하고, 이 문어가 그 자산을 이용해서 완전히 다른 생물체로 변신했다고 정리하죠. 앞 문장의 착시가 우연이 아니라 문어의 신체적 능력에 기반한 모방이라는 점을 보여 줍니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 the ability to change colour and pattern에 들어 있는 to부정사의 형용사적 용법입니다. ability처럼 추상적인 명사를 뒤에서 수식하면서 어떤 능력인지 구체적으로 설명해 주는 거예요. 두 번째 포인트는 and this one was using these assets인데요, 여기서 this one은 이 문어를 가리키고 these assets는 앞에 나온 큰 뇌, 뛰어난 시력, 색깔과 패턴을 바꾸는 능력을 가리킵니다. 세 번째 포인트는 to turn itself into a completely different creature인데요, 이건 자신을 완전히 다른 생물체로 바꾸기 위한 목적을 나타내는 to부정사의 부사적 용법입니다. itself는 문어 자신을 가리키는 재귀대명사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 종의 더 많은 것들이 그때 이후로 발견되어 왔으며\u003c/span>\u003cspan class=\"en\">Many more of this species \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">since \u003c/span>\u003cspan class=\"tgt\">then\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 지금은 문어의 사진이 있다\u003c/span>\u003cspan class=\"en\">and there are now photographs of octopuses\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다뱀으로 변신하는 중이라고 말해질 수 있는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">transforming \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">sea \u003c/span>\u003cspan class=\"tgt\">snakes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 종의 더 많은 것들이 그때 이후로 발견되어 왔으며 지금은 바다뱀으로 변신하는 중이라고 말해질 수 있는 문어의 사진이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이후에 같은 종의 문어가 더 많이 발견되면서 모방 사례가 넙치에서 \u003cb class=\"key\">바다뱀\u003c/b>으로까지 확장되었음을 보여 준다. \u003cb class=\"key\">that \u003c/b>\u003cb class=\"key\">could \u003c/b>\u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">said \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">transforming\u003c/b>은 사진 속 문어가 바다뱀으로 변신하는 중이라고 \u003cb class=\"key\">말해질 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있다\u003c/b>는 조심스러운 서술이다. 이를 통해 문어가 여러 종류의 생물을 모방할 수 있다는 \u003cb class=\"key\">유연한 \u003c/b>\u003cb class=\"key\">모방 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이 드러난다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 수동태\u003c/span> : have [조동사] + been [과거분사 be] + found [과거분사 find] + since then : \"그때 이후로 발견되어 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that + be said to + 진행형\u003c/span> : photographs of octopuses [선행사] + that [주격 관계대명사] + could be said [조동사 수동태] + to be transforming [to부정사 진행형] + into sea snakes : \"바다뱀으로 변신하는 중이라고 말해질 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Many more of this species have been found since then, 이 종의 더 많은 것들이 그때 이후로 발견되어 왔으며. and there are now photographs of octopuses, 그리고 지금은 문어의 사진이 있다. that could be said to be transforming into sea snakes, 바다뱀으로 변신하는 중이라고 말해질 수 있는.. 이 문장 전체를 해석하면, 이 종의 더 많은 것들이 그때 이후로 발견되어 왔으며 지금은 바다뱀으로 변신하는 중이라고 말해질 수 있는 문어의 사진이 있다.","hl":"m"},{"n":28,"text":"이 문장은 이후에 같은 종의 문어가 더 많이 발견되었고, 지금은 바다뱀으로 변신하는 모습이 담긴 사진도 있다는 내용입니다. 그러니까 넙치 흉내만 내는 게 아니라 바다뱀처럼 보이는 문어도 있다는 뜻이죠. 그래서 이 문어들의 모방 능력이 상당히 유연하다는 것을 알 수 있습니다.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 have been found since then에 들어 있는 현재완료 수동태입니다. 발견된 결과가 현재까지 이어지고, 발견되는 대상이므로 수동태를 쓴 거예요. since then이라는 시간 부사구가 현재완료와 함께 쓰였다는 점도 함께 기억해 두세요. 두 번째 포인트는 that could be said to be transforming into sea snakes인데요, that은 photographs of octopuses를 수식하는 주격 관계대명사입니다. could be said는 말해질 수 있다는 조동사 수동태이고, to be transforming은 변신하는 중이라는 진행형 의미를 가진 to부정사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들이 모방하는 동안에\u003c/span>\u003cspan class=\"en\">And \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">mimic\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 사냥을 한다\u003c/span>\u003cspan class=\"en\">they hunt ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">광경을 만들어 내면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">producing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">spectacle\u003c/span> of,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말하자면, 넙치가\u003c/span>\u003cspan class=\"en\">say, a flounder\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기 문어 다리 같은 팔을 펼치며\u003c/span>\u003cspan class=\"en\">suddenly developing an octopodian arm,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 구멍으로 찔러 넣어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">sticking \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">down \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">hole \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그곳에 숨어 있는 무엇이든지 움켜잡는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">grabbing\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">whatever's \u003c/span>\u003cspan class=\"tgt\">hiding \u003c/span>\u003cspan class=\"tgt\">there\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 그들이 모방하는 동안에 그들은 사냥을 한다. 이것은 말하자면 넙치가 갑자기 문어 다리 같은 팔을 펼치며 그것을 구멍으로 찔러 넣어 그곳에 숨어 있는 무엇이든지 움켜잡는 광경을 만들어 낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 문어가 \u003cb class=\"key\">모방\u003c/b>을 하는 동안에도 \u003cb class=\"key\">사냥\u003c/b>을 계속한다는 사실을 보여 준다. 넙치가 갑자기 문어 다리 같은 팔을 뻗어 구멍 속에 숨은 먹잇감을 낚아채는 장면은 \u003cb class=\"key\">위장 \u003c/b>\u003cb class=\"key\">사냥\u003c/b>의 구체적 예이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사절 접속사 while (시간·동시동작)\u003c/span> : while + 주어 + 동사 : \"그들이 모방하는 동안에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (동시동작·부연 설명)\u003c/span> : S + V, -ing ~ (분사구문) : \"광경을 만들어 내면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조 (현재분사 -ing and -ing)\u003c/span> : sticking ... and grabbing ... (병렬 구조) : \"그것을 구멍으로 찔러 넣고 ... 움켜잡는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">복합관계대명사 whatever\u003c/span> : whatever + is + -ing (whatever is hiding) : \"그곳에 숨어 있는 무엇이든지\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"And while they mimic, 그리고 그들이 모방하는 동안에. they hunt ―, 그들은 사냥을 한다. producing the spectacle of, 광경을 만들어 내면서. say, a flounder, 말하자면, 넙치가. suddenly developing an octopodian arm, 갑자기 문어 다리 같은 팔을 펼치며. sticking it down a hole, 그것을 구멍으로 찔러 넣어. and grabbing whatever's hiding there, 그리고 그곳에 숨어 있는 무엇이든지 움켜잡는. 이 문장 전체를 해석하면, 그리고 그들이 모방하는 동안에 그들은 사냥을 한다. 이것은 말하자면 넙치가 갑자기 문어 다리 같은 팔을 펼치며 그것을 구멍으로 찔러 넣어 그곳에 숨어 있는 무엇이든지 움켜잡는 광경을 만들어 낸다.","hl":"m"},{"n":31,"text":"이 문장은 문어가 모방을 하는 동안에도 사냥을 한다는 사실을 보여 줘요. 넙치처럼 보이던 문어가 갑자기 문어 다리 같은 팔을 내밀어 구멍 속에 숨어 있는 먹잇감을 움켜잡는 장면을 예로 들고 있죠. 결국 문어의 모방은 단순한 방어가 아니라 사냥 전략이라는 점을 강조해요.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 while they mimic입니다. while은 뒤에 주어와 동사를 갖춘 부사절을 이끌고, 그들이 모방하는 동안이라는 뜻으로 주절과 동시에 일어나는 상황을 나타내요. 두 번째는 producing the spectacle of로, 주절 뒤에서 이어지는 분사구문이며 and produces나 while producing으로 풀 수 있어요. 세 번째는 sticking it down a hole and grabbing으로 and가 두 개의 현재분사구를 잇는 병렬 구조예요. 네 번째는 whatever's hiding there로, whatever가 선행사를 포함한 복합관계대명사이며 grabbing의 목적어로 쓰인 명사절입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>문어의 일반적인 \u003cb class=\"key\">방어\u003c/b>는 낮에 숨고 밤에 사냥하는 것이다.\u003c/li>\u003cli>그런데 사진작가들은 \u003cb class=\"key\">낮\u003c/b>의 \u003cb class=\"key\">얕은 \u003c/b>\u003cb class=\"key\">곳\u003c/b>에서 \u003cb class=\"key\">넙치\u003c/b>로 착각한 문어를 발견한다.\u003c/li>\u003cli>이 문어는 \u003cb class=\"key\">팔\u003c/b>을 접고 \u003cb class=\"key\">눈\u003c/b>을 위로 향해 \u003cb class=\"key\">착시\u003c/b>를 만들며, 큰 \u003cb class=\"key\">뇌\u003c/b>와 \u003cb class=\"key\">시력\u003c/b>, \u003cb class=\"key\">색깔 \u003c/b>\u003cb class=\"key\">변화\u003c/b>로 변신한다.\u003c/li>\u003cli>이후 \u003cb class=\"key\">바다뱀\u003c/b> 모방 사례가 더 발견되고, 문어는 \u003cb class=\"key\">모방\u003c/b>하면서 \u003cb class=\"key\">사냥\u003c/b>까지 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Octopuses use their large brains, sharp eyesight, and color-changing ability to mimic other creatures and hunt while disguised.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">문어는 보통 \u003cb class=\"key\">숨어 \u003c/b>\u003cb class=\"key\">지내는 \u003c/b>\u003cb class=\"key\">방어\u003c/b>와 \u003cb class=\"key\">야간 \u003c/b>\u003cb class=\"key\">사냥\u003c/b>에 의존한다. 그런데 낮의 얕은 물에서 \u003cb class=\"key\">넙치\u003c/b>로 \u003cb class=\"key\">변신\u003c/b>한 문어가 발견되면서, 문어가 큰 \u003cb class=\"key\">뇌\u003c/b>와 \u003cb class=\"key\">시력\u003c/b>, \u003cb class=\"key\">색깔 \u003c/b>\u003cb class=\"key\">변화\u003c/b>로 다른 생물을 \u003cb class=\"key\">의태\u003c/b>하며 사냥까지 한다는 사실이 드러난다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 지문을 정리할게요. 문어는 원래 숨어 지내는 방어를 하지만 이 문어는 대낮에 넙치로 변신해 사람의 눈을 속였어요. 큰 뇌와 시력과 색깔 변화 능력으로 다른 생물을 흉내 내고 그 상태에서 사냥까지 한다는 사실이 중요해요. 여러분도 독해할 때 다섯 번째 문장을 중심으로 앞뒤 예시를 연결해 보세요. 오늘 수고 많았어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
