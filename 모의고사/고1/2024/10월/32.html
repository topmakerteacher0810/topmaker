</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 32번","audioDir":"32_audio","preview":false,"count":23,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">32번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Framing Pain: How Mindset Shapes Suffering\u003c/h1>\u003ch2>고통의 프레임: 마음이 고통을 결정한다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리가 얼마나 고통받는지는 \u003cb class=\"key\">마음의 \u003c/b>\u003cb class=\"key\">프레임\u003c/b>에 달려 있다. 선수들은 \u003cb class=\"key\">극심한 \u003c/b>\u003cb class=\"key\">고통\u003c/b>을 견디고 환자는 치료의 \u003cb class=\"key\">가치\u003c/b>를 믿을 때 아픔을 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">아픔\u003c/b>으로 받아들인다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>How much we suffer depends on how we frame pain in our mind.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 다룰 지문은 고통을 마음속에서 어떻게 구성하느냐에 따라 실제 괴로움이 달라진다는 내용입니다. 제목은 Framing Pain: How Mindset Shapes Suffering, 우리말로는 고통의 프레임, 마음이 고통을 결정한다입니다. 요지를 먼저 말하면 How much we suffer depends on how we frame pain in our mind, 고통의 정도는 마음의 프레임에 달려 있다는 거예요. 이제 글의 흐름을 따라가 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리 몸이 느끼는 아픔은 객관적인 자극 그 자체가 아니라 뇌가 그 신호를 해석하는 방식에 크게 좌우됩니다. 이를 심리학에서는 \u003cb class=\"key\">통증 \u003c/b>\u003cb class=\"key\">인지(pain \u003c/b>\u003cb class=\"key\">perception)\u003c/b>라고 하는데, 같은 강도의 통증도 상황이나 의미에 따라 다르게 느껴질 수 있어요. 예를 들어 운동선수가 훈련 중 느끼는 근육통은 성장의 신호로 받아들이지만, 같은 통증이라도 병으로 여기면 더 괴롭게 느껴집니다. 마치 놀이공원의 롤러코스터에서 느끼는 아찔함은 무섭지만 즐거운 것과 비슷해요. 이렇게 고통스러운 감각에 부여하는 \u003cb class=\"key\">의미(meaning)\u003c/b>가 고통을 견디는 힘을 결정합니다. 의학에서도 통증을 평가할 때 생물학적 요인뿐 아니라 심리적 요인을 함께 보는 것은 바로 이 때문입니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 우리 몸이 느끼는 아픔은 그냥 주어지는 게 아니라 뇌가 해석한 결과예요. 심리학에서는 이걸 pain perception, 즉 통증 인지라고 하는데 같은 자극도 상황에 따라 다르게 느껴져요. 예를 들어 운동선수가 훈련 중 느끼는 근육통은 성장의 신호라서 참을 만하지만 병으로 여기면 더 괴로워지죠. 놀이공원 롤러코스터의 아찔함은 무섭지만 즐거운 것과 비슷해요. 이렇게 고통스러운 감각에 부여하는 meaning, 의미가 고통을 견디는 힘을 결정합니다. 의학에서 통증을 볼 때 몸만 보지 않고 심리적 요인을 함께 보는 이유도 여기에 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>프레임이 고통을 결정\u003csmall>주장 · 문장 1\u003c/small>\u003c/h4>\u003cp>첫 문장에서 저자는 우리가 얼마나 고통받는지는 \u003cb class=\"key\">마음속에서 \u003c/b>\u003cb class=\"key\">고통을 \u003c/b>\u003cb class=\"key\">어떻게 \u003c/b>\u003cb class=\"key\">구성하는지\u003c/b>와 관련된다고 말합니다. 즉 같은 고통도 \u003cb class=\"key\">해석\u003c/b>에 따라 달라질 수 있다는 주장입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>선수들의 사례\u003csmall>예시 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>두 번째와 세 번째 문장은 운동선수 예시입니다. 1500m 달리기 선수는 \u003cb class=\"key\">극심한 \u003c/b>\u003cb class=\"key\">고통\u003c/b> 속에서도 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">고통\u003c/b>이 적고, 울트라마라톤 선수는 \u003cb class=\"key\">고통과 \u003c/b>\u003cb class=\"key\">친구가 \u003c/b>\u003cb class=\"key\">되는\u003c/b> 태도를 보입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>환자의 좋은 아픔\u003csmall>예시 · 문장 4\u003c/small>\u003c/h4>\u003cp>네 번째 문장은 환자의 사례입니다. 환자는 깊은 압박 치료를 받으면서도 \u003cb class=\"key\">치료 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 믿으면 그 고통을 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">아픔\u003c/b>이라고 부릅니다. 이는 고통의 \u003cb class=\"key\">의미\u003c/b>가 중요함을 보여줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 먼저 주장을 제시하고, 선수와 환자의 예를 들어 그 주장을 뒷받침하는 흐름입니다.","hl":null},{"n":4,"text":"첫 번째 문장을 보면 우리가 얼마나 고통받는지는 마음속에서 고통을 어떻게 구성하는지와 관련된다고 말합니다. 즉 똑같은 고통도 해석에 따라 달라질 수 있다는 주장이에요. 여기서 frame은 틀을 짓다, pain은 고통, mind는 마음이라는 뜻으로 알아두세요.","hl":"f0"},{"n":5,"text":"두 번째와 세 번째 문장은 운동선수들의 예시예요. 1500m 달리기 선수는 근육이 비명을 지르고 폐가 산소 부족으로 폭발하는 극심한 고통 속에서도 정신적으로 많이 고통받지 않아요. 울트라마라톤 선수들은 인간 인내력의 정상 경계를 넘어서면서도 고통과 친구가 된다고 말하죠. 이들은 고통을 목표 달성의 일부로 받아들이기 때문에 괴로움이 줄어드는 겁니다.","hl":"f1"},{"n":6,"text":"네 번째 문장은 환자의 사례예요. 환자가 수동적 등 통증 치료에 돈을 내고 치료사가 아픈 부위를 깊게 눌러도, 그 치료가 가치 있다고 믿으면 그 아픔을 good pain, 좋은 아픔이라고 부릅니다. 치료사의 손이 아픈 조직을 직접 누르고 있어도 말이죠. 이처럼 고통에 부여한 의미가 괴로움을 바꾸는 거예요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장이 주제문으로 고통의 정도는 마음의 \u003cb class=\"key\">프레임\u003c/b>에 달려 있다고 주장합니다. 이후 문장들은 이를 뒷받침하는 \u003cb class=\"key\">예시\u003c/b>들입니다. 1500m 선수, 울트라마라톤 선수, 환자 모두 고통을 \u003cb class=\"key\">긍정적으로 \u003c/b>\u003cb class=\"key\">해석\u003c/b>할 때 심리적 고통이 줄어든다는 점을 보여줍니다. 따라서 주장을 먼저 제시하고 예시로 뒷받침하는 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When (2)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>In fact (3)\u003c/b>\u003cspan>추가 근거·강조\u003c/span>\u003cb>When (4)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">pain\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">extreme pain\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their pain\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">good pain\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sore tissues\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글의 전개 방식은 주장과 근거예요. 첫 번째 문장에서 고통의 정도는 마음의 프레임에 달려 있다는 주장을 먼저 제시합니다. 그다음에 1500m 선수, 울트라마라톤 선수, 환자의 예시를 통해 주장을 뒷받침하죠. 주제문이 앞에 있으니 두괄식 구조입니다.","hl":"ty"},{"n":8,"text":"두 번째와 네 번째 문장은 When으로 시작해서 예시를 도입하고 있어요. 세 번째 문장의 In fact는 앞의 내용을 강조하면서 또 다른 예시를 추가하는 신호어입니다. 글에서 pain이 extreme pain, their pain, good pain, sore tissues로 반복되면서 고통의 해석이 달라진다는 흐름을 보여줘요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>suffer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고통받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>relate to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 관련되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>frame\u003c/b>\u003cem>동사\u003c/em>\u003cspan>틀을 짓다, 구성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고통\u003c/span>\u003c/div>\u003cdiv>\u003cb>mind\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마음, 정신\u003c/span>\u003c/div>\u003cdiv>\u003cb>runner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>달리기 선수\u003c/span>\u003c/div>\u003cdiv>\u003cb>push oneself\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>스스로를 밀어붙이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>extreme\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>극심한\u003c/span>\u003c/div>\u003cdiv>\u003cb>explode\u003c/b>\u003cem>동사\u003c/em>\u003cspan>폭발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>oxygen deficit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산소 부족\u003c/span>\u003c/div>\u003cdiv>\u003cb>psychologically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정신적으로, 심리적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>ultramarathon runner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>울트라마라톤 선수\u003c/span>\u003c/div>\u003cdiv>\u003cb>boundary\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경계\u003c/span>\u003c/div>\u003cdiv>\u003cb>endurance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인내력\u003c/span>\u003c/div>\u003cdiv>\u003cb>cover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>거리를 가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>distance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거리\u003c/span>\u003c/div>\u003cdiv>\u003cb>make friends with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 친구가 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>patient\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환자\u003c/span>\u003c/div>\u003cdiv>\u003cb>pay for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 돈을 지불하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>passive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수동적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>therapy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>치료법\u003c/span>\u003c/div>\u003cdiv>\u003cb>practitioner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>치료사, 의사\u003c/span>\u003c/div>\u003cdiv>\u003cb>mobilise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>풀어 주다, 움직이게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>good pain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>좋은 아픔\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deep pressure treatment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>깊은 압박 치료법\u003c/span>\u003c/div>\u003cdiv>\u003cb>value\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가치\u003c/span>\u003c/div>\u003cdiv>\u003cb>even though\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>비록 ~일지라도\u003c/span>\u003c/div>\u003cdiv>\u003cb>sore\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아픈, 통증이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>tissue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조직\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"어휘를 몇 개 정리할게요. suffer는 고통받다, frame은 틀을 짓다 또는 구성하다, endurance는 인내력이라는 뜻입니다. make friends with는 누구와 친구가 되다라는 숙어인데 여기서는 고통을 적으로 보지 않고 친구처럼 받아들인다는 의미예요. passive는 수동적인, therapy는 치료라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">suffer\u003c/b>\u003cspan class=\"m\">고통받다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hurt\u003c/span>\u003cspan class=\"s\">endure\u003c/span>\u003cspan class=\"s\">undergo\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">enjoy\u003c/span>\u003cspan class=\"a\">relish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">frame\u003c/b>\u003cspan class=\"m\">구성하다, 틀을 짓다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">interpret\u003c/span>\u003cspan class=\"s\">perceive\u003c/span>\u003cspan class=\"s\">construct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">extreme\u003c/b>\u003cspan class=\"m\">극심한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">intense\u003c/span>\u003cspan class=\"s\">severe\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">moderate\u003c/span>\u003cspan class=\"a\">mild\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">endurance\u003c/b>\u003cspan class=\"m\">인내력\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stamina\u003c/span>\u003cspan class=\"s\">perseverance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weakness\u003c/span>\u003cspan class=\"a\">fragility\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">passive\u003c/b>\u003cspan class=\"m\">수동적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inactive\u003c/span>\u003cspan class=\"s\">submissive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">active\u003c/span>\u003cspan class=\"a\">dynamic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sore\u003c/b>\u003cspan class=\"m\">아픈\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">painful\u003c/span>\u003cspan class=\"s\">tender\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">painless\u003c/span>\u003cspan class=\"a\">comfortable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">value\u003c/b>\u003cspan class=\"m\">가치\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">worth\u003c/span>\u003cspan class=\"s\">benefit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worthlessness\u003c/span>\u003cspan class=\"a\">insignificance\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"시험에 잘 나오는 핵심 어휘를 동의어와 반의어로 묶어 볼게요. suffer는 고통받다라는 뜻으로 hurt, endure와 비슷하고 enjoy와 반대예요. extreme은 극심한으로 intense, severe와 통하고 moderate나 mild와 반대죠. endurance는 인내력으로 stamina, perseverance와 비슷하고 weakness와 반대입니다. passive는 수동적인으로 inactive와 비슷하고 active와 반대예요. sore는 아픈으로 painful, tender와 비슷하고 painless와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 4\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 얼마나 고통받는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">suffer\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 관련되다\u003c/span>\u003cspan class=\"en\">relates to\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 우리가 고통을 어떻게 구성하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">frame \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">pain \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 우리의 마음속에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">mind\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 얼마나 고통받는지는 우리가 고통을 우리의 마음에서 어떻게 구성하는지와 관련된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 고통의 크기 자체보다 \u003cb class=\"key\">마음의 \u003c/b>\u003cb class=\"key\">구성 \u003c/b>\u003cb class=\"key\">방식\u003c/b>이 고통을 좌우한다는 글 전체의 주제를 제시한다. 고통을 마음에 어떻게 그리느냐에 따라 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">고통\u003c/b>이 달라진다는 핵심 관점을 담고 있어 서론의 주제문 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사절) 주어 역할\u003c/span> : How much + 주어(we) + 동사(suffer) → 명사절 : \"우리가 얼마나 고통받는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문(의문사절) 전치사의 목적어\u003c/span> : 전치사(to) + [how + 주어(we) + 동사(frame) + 목적어(the pain) + 전명구(in our mind)] : \"우리가 우리의 마음속에서 고통을 어떻게 구성하는지\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"How much we suffer, 우리가 얼마나 고통받는지.  relates to,  관련되다.  how we frame the pain,  우리가 고통을 어떻게 구성하는지.  in our mind,  우리의 마음속에서.. 이 문장 전체를 해석하면, 우리가 얼마나 고통받는지는 우리가 고통을 우리의 마음에서 어떻게 구성하는지와 관련된다.","hl":"m"},{"n":12,"text":"이 문장은 고통의 크기 자체보다 마음속에서 고통을 어떻게 해석하느냐가 중요하다는 글 전체의 주제를 제시해요. 물리적 고통과 심리적 고통을 구분하는 출발점이죠. 고통을 마음의 구성 방식으로 봐야 한다는 핵심을 담고 있어요.","hl":"mn"},{"n":13,"text":"첫 번째 포인트는 How much we suffer가 간접의문문 명사절로 문장 주어로 쓰였다는 거예요. 의문문이 평서문 어순으로 바뀌면서 주어 자리에 들어갔죠. 두 번째 포인트는 뒤에 나오는 how we frame the pain in our mind도 전치사 to의 목적어로 쓰인 간접의문문 명사절이에요. 그래서 이 문장은 명사절 두 개가 주어와 목적어 자리를 잡은 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 4\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1500미터 달리기 선수들이 스스로를 극심한 고통으로 밀어붙일 때\u003c/span>\u003cspan class=\"en\">When 1500m runners push themselves into extreme pain\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 경주에서 이기기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">win \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">race\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그들의 근육이 비명을 지르고\u003c/span>\u003cspan class=\"en\">― \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">muscles \u003c/span>\u003cspan class=\"tgt\">screaming \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그들의 폐가 산소 부족으로 폭발하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">lungs \u003c/span>\u003cspan class=\"tgt\">exploding \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">oxygen \u003c/span>\u003cspan class=\"tgt\">deficit\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그들은 정신적으로 많이 고통받지 않는다.\u003c/span>\u003cspan class=\"en\">they don't psychologically suffer much.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1500미터 달리기 선수가 경주에서 이기기 위해 그들의 근육이 비명을 지르고 그들의 폐가 산소 부족으로 폭발하면서, 스스로를 극심한 고통으로 밀어붙일 때, 그들은 정신적으로 많이 고통받지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 1500m 선수들이 경주에서 이기기 위해 극심한 신체 고통을 겪어도 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">고통\u003c/b>은 크지 않다는 구체적 예시이다. 근육과 폐의 괴로움이 동시에 일어나도 \u003cb class=\"key\">목표가 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">고통\u003c/b>은 심리적 고통으로 번역되지 않음을 보여 첫 문장을 뒷받침한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : push themselves into extreme pain [to win a race (to부정사구/목적)] : \"경주에서 이기기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (부대상황, 능동)\u003c/span> : 명사(their muscles) + 현재분사(screaming) + 등위접속사(and) + 명사(their lungs) + 현재분사(exploding) + 전명구(with oxygen deficit) : \"그들의 근육이 비명을 지르고 그들의 폐가 산소 부족으로 폭발하면서\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"When 1500m runners push themselves into extreme pain, 1500미터 달리기 선수들이 스스로를 극심한 고통으로 밀어붙일 때.  to win a race,  경주에서 이기기 위해.  ― their muscles screaming,  그들의 근육이 비명을 지르고.  and their lungs exploding with oxygen deficit,  그들의 폐가 산소 부족으로 폭발하면서.  they don't psychologically suffer much,  그들은 정신적으로 많이 고통받지 않는다.. 이 문장 전체를 해석하면, 1500미터 달리기 선수가 경주에서 이기기 위해 그들의 근육이 비명을 지르고 그들의 폐가 산소 부족으로 폭발하면서, 스스로를 극심한 고통으로 밀어붙일 때, 그들은 정신적으로 많이 고통받지 않는다.","hl":"m"},{"n":15,"text":"이 문장은 천오백 미터 선수들이 경기에서 이기기 위해 겪는 극심한 신체 고통을 예로 들어요. 근육과 폐가 괴로운 상태여도 목표가 분명하면 정신적 고통은 크지 않다는 것을 보여주죠. 그래서 고통은 몸이 아니라 마음의 해석에 달려 있다는 첫 번째 문장을 뒷받침해요.","hl":"mn"},{"n":16,"text":"첫 번째 문법 포인트는 to win a race로 to부정사의 부사적 용법 목적이에요. 경주에서 이기려고 하는 목적을 나타내죠. 두 번째 포인트는 their muscles screaming and their lungs exploding with oxygen deficit 부분이에요. 명사에 현재분사가 붙은 분사구문으로 주절과 동시에 일어나는 부대 상황을 나타내요. 근육과 폐가 스스로 비명을 지르고 폭발하는 능동 관계이기 때문에 현재분사를 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 4\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실, 울트라 마라톤 선수들은\u003c/span>\u003cspan class=\"en\">In fact, ultra­marathon runners\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 즉, 그런 사람들은\u003c/span>\u003cspan class=\"en\">― those people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 인간 인내력의 정상적 경계를 넘어서 스스로를 밀어붙일 만큼 충분히 열정적인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">crazy \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">push \u003c/span>\u003cspan class=\"tgt\">themselves \u003c/span>\u003cspan class=\"tgt\">beyond \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">normal \u003c/span>\u003cspan class=\"tgt\">boundaries \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">endurance\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 많은 시간 동안 50에서 100킬로미터 혹은 그 이상의 거리를 가지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">covering \u003c/span>\u003cspan class=\"tgt\">distances \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">50-100km \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">hours\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그들의 고통과 친구가 되는 것에 대해 이야기한다.\u003c/span>\u003cspan class=\"en\">talk about \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">friends \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">pain\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실 울트라 마라톤 선수들은 즉, 인간 인내력의 정상적 경계를 넘어서 스스로를 밀어붙일 만큼 충분히 열정적인 사람들은 많은 시간 동안 50에서 100킬로미터 혹은 그 이상의 거리를 가지만 그들의 고통과 친구가 되는 것에 대해 이야기한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 울트라마라톤 선수들이 정상적 \u003cb class=\"key\">인내력 \u003c/b>\u003cb class=\"key\">경계\u003c/b>를 넘어 달리면서도 고통을 적이 아니라 친구로 받아들인다는 예시이다. 고통과 친구가 된다는 \u003cb class=\"key\">비유\u003c/b>는 고통을 긍정적으로 재구성하는 태도를 보여 주며 첫 문장 주제를 강화한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 (who, 주격)\u003c/span> : 선행사(those people) + who + are crazy enough to push themselves beyond the normal boundaries of human endurance : \"인간 인내력의 정상적 경계를 넘어서 스스로를 밀어붙일 만큼 충분히 열정적인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (부대상황, 능동)\u003c/span> : covering (현재분사) + 목적어(distances of 50-100km or more) + 부사구(over many hours) : \"많은 시간 동안 50에서 100킬로미터 혹은 그 이상의 거리를 가면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사구 (전치사의 목적어)\u003c/span> : 전치사(about) + making friends with their pain (동명사구) : \"그들의 고통과 친구가 되는 것\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"In fact, ultra­marathon runners, 사실, 울트라 마라톤 선수들은.  ― those people,  즉, 그런 사람들은.  who are crazy enough to push themselves beyond the normal boundaries of human endurance,  인간 인내력의 정상적 경계를 넘어서 스스로를 밀어붙일 만큼 충분히 열정적인.  covering distances of 50-100km or more over many hours,  많은 시간 동안 50에서 100킬로미터 혹은 그 이상의 거리를 가지만.  talk about making friends with their pain,  그들의 고통과 친구가 되는 것에 대해 이야기한다.. 이 문장 전체를 해석하면, 사실 울트라 마라톤 선수들은 즉, 인간 인내력의 정상적 경계를 넘어서 스스로를 밀어붙일 만큼 충분히 열정적인 사람들은 많은 시간 동안 50에서 100킬로미터 혹은 그 이상의 거리를 가지만 그들의 고통과 친구가 되는 것에 대해 이야기한다.","hl":"m"},{"n":18,"text":"이 문장은 울트라마라톤 선수들을 소개하면서 고통과 친구가 된다는 표현을 통해 고통을 적으로 보지 않고 함께 가는 존재로 받아들인다는 점을 보여줘요. 정상적인 인내력의 경계를 넘는 극한 상황에서도 고통 해석이 달라질 수 있다는 거죠. 고통을 긍정적으로 재구성하는 태도가 잘 드러나 있어요.","hl":"mn"},{"n":19,"text":"첫 번째 문법은 who are crazy enough to push themselves beyond the normal boundaries of human endurance로 선행사 those people를 수식하는 관계대명사 who 절이에요. who는 절 안에서 주어 역할을 하니까 뒤에 are가 바로 왔죠. 두 번째는 covering distances of fifty to one hundred kilometers or more over many hours로 주어인 ultra marathon runners가 능동적으로 거리를 가는 상황을 나타내는 분사구문이에요. 세 번째는 about 다음에 making friends with their pain이 동명사구로 쓰여 전치사의 목적어가 됐다는 점이에요. 전치사 뒤에는 동사 원형이 아니라 동명사를 써야 하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 4\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 환자가 특정 형태의 수동적 등 통증 치료에 돈을 지불했고\u003c/span>\u003cspan class=\"en\">When a patient \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">paid\u003c/span> for some form of passive back pain therapy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 의사가 환자 등의 아픈 부분을 깊게 눌렀을 때\u003c/span>\u003cspan class=\"en\">and the practitioner pushes deeply into a painful part of a patient's back\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 풀어 주기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">mobilise \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환자는 그것을 좋은 아픔이라고 부른다\u003c/span>\u003cspan class=\"en\">the patient calls that good pain\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그 또는 그녀가 이러한 종류의 깊은 압박 치료법이 가치가 있을 것이라고 믿는다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">believes \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">type \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">deep \u003c/span>\u003cspan class=\"tgt\">pressure \u003c/span>\u003cspan class=\"tgt\">treatment \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">value\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 의사가 환자의 아픈 조직을 직접적으로 누르고 있을지라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">though \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">practitioner \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">pushing \u003c/span>\u003cspan class=\"tgt\">right \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">patient's \u003c/span>\u003cspan class=\"tgt\">sore \u003c/span>\u003cspan class=\"tgt\">tissues\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 환자가 특정 형태의 수동적 등 통증 치료에 돈을 지불했고 의사가 그것을 풀어 주기 위해 환자 등의 아픈 부분을 깊게 눌렀을 때, 비록 의사가 환자의 아픈 조직을 직접적으로 누르고 있을지라도, 만약 그 또는 그녀가 이러한 종류의 깊은 압박 치료법이 가치가 있을 것이라고 믿는다면, 환자는 그것을 좋은 아픔이라고 부른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 통증의 고통이 통증 자체보다 그것을 어떻게 \u003cb class=\"key\">의미 \u003c/b>\u003cb class=\"key\">부여\u003c/b>하느냐에 달려 있다는 글의 핵심을 뒷받침하는 예이다. 환자는 의사가 아픈 조직을 깊게 누르지만, 그 치료가 가치 있다고 \u003cb class=\"key\">믿음\u003c/b>을 가지면 그 자극을 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">아픔\u003c/b>이라고 부른다. 즉 같은 물리적 자극도 어떤 의미를 부여하는지에 따라 고통으로 받아들이는 정도가 달라진다는 점을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료\u003c/span> : have/has + p.p. : \"돈을 지불한 상태이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형 : \"그것을 풀어 주기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조건의 부사절\u003c/span> : if + S + V, S + V : \"만약 그 또는 그녀가 이러한 종류의 깊은 압박 치료법이 가치가 있을 것이라고 믿는다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">양보의 부사절\u003c/span> : even though + S + V : \"비록 의사가 환자의 아픈 조직을 직접적으로 누르고 있을지라도\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"When a patient has paid for some form of passive back pain therapy, 한 환자가 특정 형태의 수동적 등 통증 치료에 돈을 지불했고. and the practitioner pushes deeply into a painful part of a patient's back, 그리고 의사가 환자 등의 아픈 부분을 깊게 눌렀을 때. to mobilise it, 그것을 풀어 주기 위해. the patient calls that good pain, 환자는 그것을 좋은 아픔이라고 부른다. if he or she believes this type of deep pressure treatment will be of value, 만약 그 또는 그녀가 이러한 종류의 깊은 압박 치료법이 가치가 있을 것이라고 믿는다면. even though the practitioner is pushing right into the patient's sore tissues, 비록 의사가 환자의 아픈 조직을 직접적으로 누르고 있을지라도. 이 문장 전체를 해석하면, 한 환자가 특정 형태의 수동적 등 통증 치료에 돈을 지불했고 의사가 그것을 풀어 주기 위해 환자 등의 아픈 부분을 깊게 눌렀을 때, 비록 의사가 환자의 아픈 조직을 직접적으로 누르고 있을지라도, 만약 그 또는 그녀가 이러한 종류의 깊은 압박 치료법이 가치가 있을 것이라고 믿는다면, 환자는 그것을 좋은 아픔이라고 부른다.","hl":"m"},{"n":21,"text":"이 문장은 아픈 자극 자체보다 그 자극에 대한 믿음과 의미 부여가 고통의 정도를 바꾼다는 걸 보여 주는 예시예요. 환자는 의사가 아픈 조직을 깊게 누르고 있어도 그 치료가 가치 있다고 믿으면 그 자극을 좋은 아픔이라고 부르죠. 결국 같은 물리적 자극도 어떻게 해석하느냐에 따라 고통으로 받아들이는 정도가 달라진다는 글의 흐름을 뒷받침해요.","hl":"mn"},{"n":22,"text":"첫 번째 어법 포인트는 현재완료예요. has paid는 have/has plus p.p. 형태로, 과거의 지불 행위가 현재까지 영향을 주는 완료된 상태를 나타내요. 주어 a patient가 3인칭 단수라서 has paid를 썼어요. 두 번째 어법 포인트는 to부정사의 부사적 용법 목적이에요. to mobilise it은 그것을 풀어 주기 위해라는 뜻으로, 의사가 등을 깊게 누르는 목적을 나타내요. 세 번째 어법 포인트는 조건의 부사절 if예요. if he or she believes 뒤에 this type of deep pressure treatment will be of value가 목적어로 연결된 형태인데, believe 뒤에 that이 생략된 that절이라고 볼 수 있어요. 네 번째 어법 포인트는 양보의 부사절 even though예요. even though는 비록 무엇일지라도라고 해석되면서 주절의 좋은 아픔이라고 부른다와 대조적인 상황을 이끌어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>고통의 정도는 \u003cb class=\"key\">마음의 \u003c/b>\u003cb class=\"key\">프레임\u003c/b>에 달려 있다.\u003c/li>\u003cli>1500m 선수들은 \u003cb class=\"key\">극심한 \u003c/b>\u003cb class=\"key\">고통\u003c/b>에도 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">고통\u003c/b>이 크지 않다.\u003c/li>\u003cli>울트라마라톤 선수들은 고통과 \u003cb class=\"key\">친구가 \u003c/b>\u003cb class=\"key\">되는\u003c/b> 태도를 보인다.\u003c/li>\u003cli>환자도 치료의 \u003cb class=\"key\">가치\u003c/b>를 믿으면 아픔을 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">아픔\u003c/b>으로 받아들인다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>How much we suffer depends on how we frame pain in our mind.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리가 얼마나 고통받는지는 \u003cb class=\"key\">마음의 \u003c/b>\u003cb class=\"key\">프레임\u003c/b>에 달려 있다. 선수들은 \u003cb class=\"key\">극심한 \u003c/b>\u003cb class=\"key\">고통\u003c/b>을 견디고 환자는 치료의 \u003cb class=\"key\">가치\u003c/b>를 믿을 때 아픔을 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">아픔\u003c/b>으로 받아들인다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":23,"text":"오늘 지문은 고통의 정도는 마음의 프레임에 달려 있다는 점을 선수와 환자의 예로 보여줬어요. 1500m 선수와 울트라마라톤 선수는 고통에 목표라는 의미를 부여해서 괴로움을 줄였고, 환자는 치료의 가치를 믿어서 아픔을 좋은 아픔으로 받아들였습니다. 결국 같은 고통도 어떻게 해석하느냐가 중요하다는 거예요. 오늘 수업은 여기까지입니다. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
