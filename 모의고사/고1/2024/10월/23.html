}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 23번","audioDir":"23_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">23번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Concrete Questions for Reliable Quantitative Data\u003c/h1>\u003ch2>신뢰할 수 있는 양적 데이터를 위한 구체적인 질문\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>많은 연구가 \u003cb class=\"key\">양적 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>로 이어지지만, '슬픈 횟수'처럼 \u003cb class=\"key\">모호한 \u003c/b>\u003cb class=\"key\">질문\u003c/b>은 회상과 정의의 차이로 \u003cb class=\"key\">신뢰\u003c/b>하기 어렵다. 병가나 연체 공과금 같은 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">응답\u003c/b>을 요구하는 질문이 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>을 명확하게 하고 연구 간 \u003cb class=\"key\">일관성\u003c/b>을 보장한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Concrete questions make abstract concepts clearer and ensure consistency from one study to the next.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 전국연합학력평가 스물세 번째 문항으로, 연구에서 질문을 어떻게 설계해야 신뢰할 수 있는 양적 데이터를 얻을 수 있는지에 대한 이야기예요. 핵심은 추상적인 질문보다 구체적인 응답을 이끌어 내는 질문이 낫다는 것이고, 요지는 concrete questions make abstract concepts clearer and ensure consistency from one study to the next입니다. 이제 본문을 함께 살펴보죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">연구에서 \u003cb class=\"key\">양적 \u003c/b>\u003cb class=\"key\">데이터 \u003c/b>\u003cb class=\"key\">quantitative \u003c/b>\u003cb class=\"key\">data\u003c/b>는 숫자로 측정한 자료를 뜻한다. 예를 들어 웃음 횟수나 공과금 연체 건수처럼 셀 수 있는 응답이 여기에 해당한다. 반면 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">개념 \u003c/b>\u003cb class=\"key\">abstract \u003c/b>\u003cb class=\"key\">concept\u003c/b>은 '슬픔'이나 '미루는 정도'처럼 사람마다 기준이 달라 숫자로 바꾸기 어렵다. 일상에서도 '너 얼마나 게으르니?'라고 묻는 것보다 '이번 달에 지각을 몇 번 했니?'라고 물으면 대답이 훨씬 일관된다. 설문조사는 질문을 어떻게 설계하느냐에 따라 \u003cb class=\"key\">신뢰도 \u003c/b>\u003cb class=\"key\">reliability\u003c/b>와 \u003cb class=\"key\">일관성 \u003c/b>\u003cb class=\"key\">consistency\u003c/b>가 크게 달라진다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 연구에서 quantitative data는 숫자로 측정한 자료를 말해요. 행복 연구에서 웃는 횟수를 세거나 기억 연구에서 회상한 항목 수를 기록하는 것이 대표적이죠. 그런데 슬픔이나 미루는 정도 같은 abstract concept은 사람마다 기준이 달라서 숫자로 바꾸기 어려워요. 일상에서도 누군가에게 너 얼마나 게으르니라고 묻는 것보다 이번 달에 지각을 몇 번 했니라고 물으면 대답이 훨씬 일관되게 나오잖아요. 이처럼 설문조사는 질문을 어떻게 만드느냐에 따라 reliability와 consistency가 크게 달라져요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>양적 데이터의 자연스러운 예\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>연구의 많은 형태가 \u003cb class=\"key\">양적 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>로 자연스럽게 이어진다. 행복 연구는 상호 작용 중 미소 짓는 \u003cb class=\"key\">횟수\u003c/b>를, 기억 연구는 시간별 회상 \u003cb class=\"key\">항목 \u003c/b>\u003cb class=\"key\">수\u003c/b>를 측정한다. 구체적 측정의 예를 통해 양적 데이터의 보편성을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>모호한 질문의 문제점\u003csmall>통념·문제 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>사람들에게 일 년에 몇 번 슬픈지 묻는 것도 양적 데이터를 산출하지만 \u003cb class=\"key\">신뢰할 \u003c/b>\u003cb class=\"key\">만하지 \u003c/b>\u003cb class=\"key\">않을\u003c/b> 수 있다. 응답자의 \u003cb class=\"key\">회상\u003c/b>이 부정확하고 '슬픈'의 정의가 사람마다 크게 다르기 때문이다. 추상적 기준의 질문은 \u003cb class=\"key\">일관성\u003c/b>을 해친다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>구체적 질문으로 전환\u003csmall>전환·해결 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>'병가를 낼 만큼 슬펐던 적'을 묻는 질문은 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">답변\u003c/b>을 유발한다. 마찬가지로 \u003cb class=\"key\">공과금 \u003c/b>\u003cb class=\"key\">고지서\u003c/b> 연체 여부를 묻는 질문으로 미루는 정도를 측정한다. 추상적 평가 대신 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">응답\u003c/b>을 요구하는 방식을 제시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>구체적 질문의 효과\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>구체적 응답을 구하는 질문은 \u003cb class=\"key\">추상적인 \u003c/b>\u003cb class=\"key\">개념\u003c/b>을 더 명확하게 만든다. 또한 연구 간 \u003cb class=\"key\">일관성\u003c/b>을 보장하는 데 도움이 된다. 결론적으로 질문 설계에서 \u003cb class=\"key\">구체성\u003c/b>이 핵심이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 양적 데이터의 예에서 시작해 모호한 질문의 문제를 짚고, 구체적 질문의 효과로 결론을 맺는 흐름이에요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 많은 형태의 연구가 자연스럽게 양적 데이터로 이어진다고 말해요. 행복 연구는 상호 작용 중에 미소 짓는 횟수를 측정하고, 기억 연구는 일 분, 오 분, 십 분 후에 회상할 수 있는 항목 수를 측정하죠. 이렇게 구체적인 수치를 다루는 예시를 통해 양적 데이터가 연구에서 널리 쓰인다는 점을 보여 줘요.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 사람들에게 일 년에 몇 번 슬픈지 묻는 것도 양적 데이터를 산출하지만 신뢰할 만하지 않을 수 있다고 지적해요. 응답자의 회상이 부정확할 수 있고 슬프다라는 말에 대한 정의도 사람마다 크게 다르기 때문이에요. 결국 추상적 기준을 가진 질문은 응답의 일관성을 해친다는 문제가 있어요.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장에서는 해결책으로 구체적인 질문을 제시해요. 지난 일 년 동안 직장에 병가를 낼 만큼 슬펐던 적이 몇 번 있었는지 물으면 구체적인 답변을 이끌어 낼 수 있어요. 마찬가지로 미루는 정도를 평가하게 하는 대신, 지불할 여유가 있는데도 현재 납부가 늦은 공과금 고지서가 몇 개인지 물어보라고 말하죠.","hl":"f2"},{"n":7,"text":"일곱 번째 문장은 결론이에요. 구체적 응답을 구하는 질문은 추상적인 개념을 더 명확하게 만들고 한 연구에서 다음 연구 간의 일관성을 보장하는 데 도움이 된다고 정리해요. 결국 질문을 구체적으로 설계하는 것이 좋은 양적 데이터를 얻는 핵심이라는 거예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 먼저 \u003cb class=\"key\">양적 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>의 예를 제시하고, 중반에 \u003cb class=\"key\">모호한 \u003c/b>\u003cb class=\"key\">질문\u003c/b>의 문제를 드러낸 뒤, 후반에 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">질문\u003c/b>을 해결책으로 제시한다. 마지막 문장에서 구체적 응답의 효과를 일반화하며 결론을 맺으므로 \u003cb class=\"key\">미괄식\u003c/b> 구조다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (5)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>Similarly (6)\u003c/b>\u003cspan>유사 예시 추가\u003c/span>\u003cb>Questions that seek concrete responses (7)\u003c/b>\u003cspan>결론·일반화\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">quantitative data\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">concrete answer\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">concrete responses\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>모호한 질문\u003c/th>\u003cth>구체적 질문\u003c/th>\u003c/tr>\u003ctr>\u003ctd>슬픔 횟수 응답, 정의 제각각\u003c/td>\u003ctd>병가낼 만큼 슬픈 횟수 응답\u003c/td>\u003c/tr>\u003ctr>\u003ctd>미루는 정도 자기 평가\u003c/td>\u003ctd>연체 공과금 수 응답\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제 해결 전개 방식을 취하고 있어요. 먼저 양적 데이터의 구체적 예를 보여 준 다음, 모호한 질문이 신뢰할 수 없는 데이터를 만든다는 문제를 제기해요. 그 해결책으로 구체적 응답을 요구하는 질문을 제시하고, 마지막 문장에서 그 효과를 일반화해요. 구조는 미괄식으로, 핵심 주장이 마지막 일곱 번째 문장에 제시돼요.","hl":"ty"},{"n":9,"text":"신호어를 보면 다섯 번째 문장의 But은 앞선 문제에 대한 전환을 알려 줘요. 여섯 번째 문장의 Similarly는 같은 방식의 또 다른 예를 추가한다는 신호예요. 마지막 문장의 Questions that seek concrete responses는 결론을 이끄는 표현이에요. 재진술 흐름으로 quantitative data가 concrete answer, concrete responses로 이어지며 구체성이 강조돼요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>form\u003c/b>\u003cem>명사\u003c/em>\u003cspan>형태, 종류\u003c/span>\u003c/div>\u003cdiv>\u003cb>research\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>naturally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자연스럽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>quantitative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>양적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>data\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자료, 데이터\u003c/span>\u003c/div>\u003cdiv>\u003cb>measure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>측정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interaction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상호 작용\u003c/span>\u003c/div>\u003cdiv>\u003cb>recall\u003c/b>\u003cem>동사\u003c/em>\u003cspan>회상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>yield\u003c/b>\u003cem>동사\u003c/em>\u003cspan>산출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reliable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신뢰할 만한\u003c/span>\u003c/div>\u003cdiv>\u003cb>respondent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>응답자\u003c/span>\u003c/div>\u003cdiv>\u003cb>recollection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>회상, 기억\u003c/span>\u003c/div>\u003cdiv>\u003cb>inaccurate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부정확한\u003c/span>\u003c/div>\u003cdiv>\u003cb>definition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정의\u003c/span>\u003c/div>\u003cdiv>\u003cb>vary\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다르다, 다양하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>widely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>크게, 널리\u003c/span>\u003c/div>\u003cdiv>\u003cb>prompt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>concrete\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>구체적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>similarly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마찬가지로\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>rate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>평가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>procrastinator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미루는 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>utility bill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공과금 고지서\u003c/span>\u003c/div>\u003cdiv>\u003cb>afford\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~할 여유가 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>seek\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>response\u003c/b>\u003cem>명사\u003c/em>\u003cspan>응답\u003c/span>\u003c/div>\u003cdiv>\u003cb>abstract\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>추상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>concept\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개념\u003c/span>\u003c/div>\u003cdiv>\u003cb>consistency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일관성\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개만 정리할게요. quantitative는 양적인, data는 자료 또는 데이터라는 뜻이에요. yield는 산출하다, reliable은 신뢰할 만한이라는 의미예요. prompt는 유발하다, concrete는 구체적인, consistency는 일관성이라는 뜻이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">concrete\u003c/b>\u003cspan class=\"m\">구체적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">specific\u003c/span>\u003cspan class=\"s\">tangible\u003c/span>\u003cspan class=\"s\">definite\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abstract\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reliable\u003c/b>\u003cspan class=\"m\">신뢰할 만한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dependable\u003c/span>\u003cspan class=\"s\">trustworthy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unreliable\u003c/span>\u003cspan class=\"a\">questionable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">abstract\u003c/b>\u003cspan class=\"m\">추상적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conceptual\u003c/span>\u003cspan class=\"s\">theoretical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">concrete\u003c/span>\u003cspan class=\"a\">tangible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">seek\u003c/b>\u003cspan class=\"m\">추구하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pursue\u003c/span>\u003cspan class=\"s\">look for\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">avoid\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">yield\u003c/b>\u003cspan class=\"m\">산출하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">produce\u003c/span>\u003cspan class=\"s\">generate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">suppress\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consistency\u003c/b>\u003cspan class=\"m\">일관성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">coherence\u003c/span>\u003cspan class=\"s\">uniformity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inconsistency\u003c/span>\u003cspan class=\"a\">variability\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 봐요. concrete는 specific이나 tangible과 바꿔 쓸 수 있고, 반대는 abstract나 vague예요. reliable은 dependable이나 trustworthy와 유사하고, unreliable이나 questionable과 반대예요. abstract는 conceptual이나 theoretical과 비슷하고 concrete나 tangible과 반대죠. seek는 pursue나 look for와 유사하고 avoid나 ignore와 반대예요. consistency는 coherence나 uniformity와 비슷하고 inconsistency나 variability와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 종류의 연구는\u003c/span>\u003cspan class=\"en\">Many forms of research\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연스럽게 이어진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lead \u003c/span>\u003cspan class=\"tgt\">naturally \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">양적 데이터로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to\u003c/span> quantitative data.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 종류의 연구는 자연스럽게 양적 데이터로 이어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 연구의 여러 형태가 자연스럽게 수치로 표현되는 \u003cb class=\"key\">양적 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>로 이어진다는 도입 문장이다. 여기서 lead to는 어떤 결과로 이어지는 \u003cb class=\"key\">자동사와 \u003c/b>\u003cb class=\"key\">전치사\u003c/b>의 결합 표현이다. 뒤에 행복이나 기억 연구처럼 구체적인 예를 제시하기 위한 \u003cb class=\"key\">배경\u003c/b> 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구 lead to\u003c/span> : lead [naturally] to [quantitative data] : \"자연스럽게 양적 데이터로 이어진다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Many forms of research, 많은 종류의 연구는. lead naturally, 자연스럽게 이어진다. to quantitative data, 양적 데이터로. 이 문장 전체를 해석하면, 많은 종류의 연구는 자연스럽게 양적 데이터로 이어진다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 연구의 여러 형태가 자연스럽게 양적 데이터로 이어진다고 말하고 있어요. 여기서 quantitative data는 숫자로 표현되는 자료를 뜻하고, lead to는 어떤 결과로 이어진다는 뜻의 숙어예요. 이 문장은 뒤에 행복 연구나 기억 연구 같은 구체적인 예시를 끌어오는 배경 역할을 해요.","hl":"mn"},{"n":14,"text":"문법 포인트는 lead to예요. lead naturally to quantitative data에서 lead to가 자연스럽게 양적 데이터로 이어진다는 뜻인데, naturally가 lead와 to 사이에 들어가서 lead to를 꾸며 주고 있어요. lead to는 자동사 lead와 전치사 to가 결합한 숙어라서 뒤에 명사구인 quantitative data가 온 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행복에 관한 연구는 측정할 수 있고\u003c/span>\u003cspan class=\"en\">A study of happiness might measure\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가가 미소 짓는 횟수를\u003c/span>\u003cspan class=\"en\">the number of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">times \u003c/span>\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"tgt\">smiles\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상호 작용 중에\u003c/span>\u003cspan class=\"en\">during an interaction,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기억에 관한 연구는 측정할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">study \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">memory \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">measure\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인이 회상할 수 있는 항목의 수를\u003c/span>\u003cspan class=\"en\">the number of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">items \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">individual \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">recall\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1분, 5분, 그리고 10분 후에\u003c/span>\u003cspan class=\"en\">after one, five, and ten minutes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">행복에 관한 연구는 누군가가 상호 작용 중에 미소 짓는 횟수를 측정할 수 있고, 기억에 관한 연구는 개인이 1분, 5분, 그리고 10분 후에 회상할 수 있는 항목의 수를 측정할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 행복 연구는 미소 횟수를, 기억 연구는 회상 항목 수를 측정한다는 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">구조\u003c/b>의 예시 문장이다. the number of times나 the number of items처럼 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">수치\u003c/b>를 측정한다는 점에서 앞 문장의 양적 데이터를 뒷받침한다. might measure는 가능성이나 추측의 조동사로 단정적이지 않은 연구 결과를 부드럽게 표현한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사 that 생략\u003c/span> : the number of times [(that) someone smiles] : \"누군가가 미소 짓는 횟수\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬 구조\u003c/span> : A study of happiness might measure ... and a study of memory might measure ... : \"행복에 관한 연구는 측정할 수 있고, 기억에 관한 연구는 측정할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that 생략\u003c/span> : items [(that) an individual can recall] : \"개인이 회상할 수 있는 항목\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"A study of happiness might measure, 행복에 관한 연구는 측정할 수 있고. the number of times someone smiles, 누군가가 미소 짓는 횟수를. during an interaction, 상호 작용 중에. and a study of memory might measure, 기억에 관한 연구는 측정할 수 있다. the number of items an individual can recall, 개인이 회상할 수 있는 항목의 수를. after one, five, and ten minutes, 1분, 5분, 그리고 10분 후에. 이 문장 전체를 해석하면, 행복에 관한 연구는 누군가가 상호 작용 중에 미소 짓는 횟수를 측정할 수 있고, 기억에 관한 연구는 개인이 1분, 5분, 그리고 10분 후에 회상할 수 있는 항목의 수를 측정할 수 있다.","hl":"m"},{"n":16,"text":"두 번째 문장은 행복 연구와 기억 연구를 병렬로 보여 주면서, 둘 다 구체적인 수치를 측정한다는 점을 강조해요. the number of times someone smiles나 the number of items an individual can recall 같은 표현은 결국 횟수나 항목 수라는 양적 데이터를 뜻해요. might measure는 확실하다기보다는 측정할 수 있다는 가능성을 부드럽게 표현해요.","hl":"mn"},{"n":17,"text":"문법 포인트는 세 가지예요. 첫 번째 포인트는 times someone smiles에서 관계부사 that이 생략된 거예요. times라는 선행사 뒤에 바로 someone smiles가 오면서 times를 수식해요. 두 번째 포인트는 and a study of memory might measure에서 and를 기준으로 앞뒤가 병렬 구조를 이룬다는 거예요. 행복 연구와 기억 연구가 대등하게 연결되죠. 세 번째 포인트는 items an individual can recall에서 목적격 관계대명사 that이 생략된 거예요. recall의 목적어가 비어 있기 때문에 선행사 items가 목적어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들에게 자신이 일 년에 몇 번 슬픈지 물어보는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Asking \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">times \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">year \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">sad\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 양적 데이터를 산출할 수 있지만\u003c/span>\u003cspan class=\"en\">will also yield quantitative data,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 신뢰할 만하지 않을 수도 있다\u003c/span>\u003cspan class=\"en\">but it might not be reliable.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들에게 자신이 일 년에 몇 번 슬픈지 물어보는 것 또한 양적 데이터를 산출할 수 있지만, 이는 신뢰할 만하지 않을 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들에게 슬픈 횟수를 직접 물어보는 방식도 \u003cb class=\"key\">양적 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>를 낼 수 있지만, 그 데이터는 \u003cb class=\"key\">신뢰도\u003c/b>가 떨어질 수 있다는 전환 문장이다. 앞서 보여 준 관찰 가능한 측정과 달리 자기 보고식 응답은 기억의 부정확성이나 정의 차이 때문에 한계가 있다. 이 문장이 뒤에 나올 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">질문\u003c/b>의 필요성을 이끌어 낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [Asking people how many times in a year they are sad] + will also yield ... : \"사람들에게 자신이 일 년에 몇 번 슬픈지 물어보는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : how many times + 주어(they) + 동사(are) : \"자신이 일 년에 몇 번 슬픈지\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Asking people how many times in a year they are sad, 사람들에게 자신이 일 년에 몇 번 슬픈지 물어보는 것. will also yield quantitative data, 또한 양적 데이터를 산출할 수 있지만. but it might not be reliable, 이는 신뢰할 만하지 않을 수도 있다. 이 문장 전체를 해석하면, 사람들에게 자신이 일 년에 몇 번 슬픈지 물어보는 것 또한 양적 데이터를 산출할 수 있지만, 이는 신뢰할 만하지 않을 수도 있다.","hl":"m"},{"n":19,"text":"세 번째 문장은 직접 물어보는 방식도 양적 데이터를 산출할 수 있지만 신뢰할 만하지 않을 수 있다는 뜻이에요. 앞 문장의 관찰 가능한 측정과 달리, 자기 보고식 응답은 부정확하거나 정의가 달라질 수 있다는 한계를 암시해요. 이 문장은 뒤에서 구체적인 질문이 필요한 이유로 이어지는 전환점이에요.","hl":"mn"},{"n":20,"text":"문법 포인트는 두 가지예요. 첫 번째 포인트는 Asking people how many times in a year they are sad가 문장 전체의 주어로 쓰였다는 거예요. 동명사구가 주어이면 단수 취급해서 뒤에 will yield가 왔어요. 두 번째 포인트는 how many times in a year they are sad가 간접의문문이라는 거예요. 의문사 뒤에 they are라는 평서문 어순이 와서 몇 번 슬픈지라는 뜻을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">응답자의 회상은 부정확할 수 있고,\u003c/span>\u003cspan class=\"en\">Respondents' recollections \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">inaccurate\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 '슬픈'에 대한 그들의 정의는\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">definitions \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">'sad'\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크게 다를 수 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">vary \u003c/span>\u003cspan class=\"tgt\">widely\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">응답자의 회상은 부정확할 수 있고, ‘슬픈’에 대한 그들의 정의는 크게 다를 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지금까지의 정량적 데이터 수집이 항상 정확하지는 않다는 한계를 짚는 문장입니다. 응답자의 기억 오류와 ‘슬픈’이라는 개념의 \u003cb class=\"key\">모호성\u003c/b> 때문에 단순한 자기 보고가 신뢰도를 떨어뜨릴 수 있음을 말합니다. 다음 문장에서 구체적인 질문이 필요한 이유를 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may (추측)\u003c/span> : may + 동사원형 (be) + 형용사 보어 (inaccurate) : \"부정확할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of (대상)\u003c/span> : definitions + of + 대상 (sad) : \"'슬픈'에 대한 정의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 could (가능성)\u003c/span> : could + 동사원형 (vary) + 부사 (widely) : \"크게 다를 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Respondents' recollections may be inaccurate, 응답자의 회상은 부정확할 수 있고. and their definitions of 'sad', 그리고 '슬픈'에 대한 그들의 정의는. could vary widely, 크게 다를 수 있다.. 이 문장 전체를 해석하면, 응답자의 회상은 부정확할 수 있고, ‘슬픈’에 대한 그들의 정의는 크게 다를 수 있다.","hl":"m"},{"n":22,"text":"이 문장은 설문에서 얻은 양적 데이터가 항상 믿을 만한 것은 아니라는 한계를 짚고 있어요. 응답자의 기억이 부정확할 수 있고, 슬프다라는 기준 자체가 사람마다 크게 달라서 단순한 자기 보고는 신뢰도가 떨어질 수 있죠. 그래서 다음 문장에서 구체적인 질문을 제시하는 거예요.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 may be inaccurate인데요, may는 추측의 조동사이고 뒤에 동사원형 be가 오고 inaccurate가 보어로 와서 부정확할 수 있다라는 뜻을 만들어요. 두 번째는 could vary widely인데, could는 가능성을 나타내고 vary라는 동사원형을 이끌어서 크게 다를 수 있다는 의미가 됩니다. 세 번째는 their definitions of sad인데, 전치사 of가 정의의 대상을 연결해서 슬프다에 대한 정의라는 뜻을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 묻는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But \u003c/span>\u003cspan class=\"tgt\">asking\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지난 1년 동안 몇 번이나\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">times \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">past \u003c/span>\u003cspan class=\"tgt\">year\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 충분히 슬펐는지\u003c/span>\u003cspan class=\"en\">were you \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">sad \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직장에 병가를 낼 만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">call \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">sick \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구체적인 답변을 유발한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">prompts \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">concrete \u003c/span>\u003cspan class=\"tgt\">answer\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 “지난 1년 동안 직장에 병가를 낼 만큼 슬펐던 적이 몇 번 있었습니까?”라고 묻는 것은 구체적인 답변을 유발한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 추상적 질문 대신 구체적 행동 기준을 제시하면 답변이 명확해진다는 핵심 문장입니다. 'sad enough to call in sick'라는 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">기준\u003c/b>이 슬픔의 정도를 측정 가능하게 만듭니다. 이는 문제의 해결 방향을 보여주는 중심 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [But asking + 의문문] + [prompts (단수 동사)] : \"그러나 묻는 것은 ... 유발한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 how many + 명사\u003c/span> : [How many times] + [in the past year] : \"지난 1년 동안 몇 번이나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">enough to부정사 (정도)\u003c/span> : [sad + enough] + [to call in sick to work] : \"직장에 병가를 낼 만큼 슬픈\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">타동사 prompts\u003c/span> : prompts + [a concrete answer (목적어)] : \"구체적인 답변을 유발한다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"But asking, 그러나 묻는 것은. \"How many times in the past year, 지난 1년 동안 몇 번이나. were you sad enough, 당신이 충분히 슬펐는지. to call in sick to work?\", 직장에 병가를 낼 만큼. prompts a concrete answer, 구체적인 답변을 유발한다.. 이 문장 전체를 해석하면, 그러나 “지난 1년 동안 직장에 병가를 낼 만큼 슬펐던 적이 몇 번 있었습니까?”라고 묻는 것은 구체적인 답변을 유발한다.","hl":"m"},{"n":25,"text":"이 문장은 추상적인 질문 대신 구체적인 행동 기준을 넣으면 답이 명확해진다는 핵심이에요. 직장에 병가를 낼 만큼 슬펐던 적이 몇 번이냐고 물으면 슬픔이라는 애매한 감정을 행동으로 측정할 수 있죠. 그래서 응답의 일관성을 높이는 해결책을 제시하는 거예요.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 But asking인데요, asking 이하의 동명사구가 주어 역할을 하고 prompts라는 단수 동사를 받아요. 두 번째는 How many times in the past year인데 how many가 횟수를 묻고 in the past year가 시간 범위를 나타내는 전치사구죠. 세 번째는 sad enough to call in sick to work인데, enough가 sad와 결합해 정도가 충분함을 나타내고 to부정사가 그 정도를 구체화해요. 네 번째는 prompts a concrete answer인데 prompts가 목적어를 요구하는 타동사라서 concrete answer가 목적어로 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마찬가지로, 사람들에게 묻는 대신\u003c/span>\u003cspan class=\"en\">Similarly, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">asking \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 얼마나 심하게 미루는 사람인지를 평가하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">rate\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">bad \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">procrastinator \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물어보라,\u003c/span>\u003cspan class=\"en\">ask,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 공과금 고지서 중 얼마나 많은 것의\u003c/span>\u003cspan class=\"en\">&quot;How many of your utility bills\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">납부가 현재 늦었는지,\u003c/span>\u003cspan class=\"en\">are you currently \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">late \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">paying\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 그것들을 지불할 여유가 있음에도 불구하고?\u003c/span>\u003cspan class=\"en\">even though you can afford to pay them?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마찬가지로, 사람들에게 그들이 얼마나 심하게 미루는 사람인지를 평가하도록 묻는 대신, “당신이 지불할 여유가 있음에도 불구하고 얼마나 많은 공과금 고지서의 납부가 현재 늦었나요?”라고 물어보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문장 5에서 제시한 원리를 미루기라는 다른 사례에 적용한 문장입니다. 'rate how bad a procrastinator they are' 같은 \u003cb class=\"key\">주관적 \u003c/b>\u003cb class=\"key\">평가\u003c/b> 대신 연체된 공과금 고지서 수를 물어 구체적이고 일관된 답을 얻도록 합니다. 이는 추상적 질문을 행동 기반 질문으로 바꾸는 예시입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">instead of + 동명사\u003c/span> : [instead of] + [asking (동명사)] + [people (목적어)] + [to rate (to부정사)] : \"사람들에게 평가하도록 묻는 대신\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : [동사원형 ask] : \"물어보라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : [how bad a procrastinator] + [they are] : \"그들이 얼마나 심하게 미루는 사람인지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 in + 동명사\u003c/span> : [late] + [in] + [paying (동명사)] : \"납부가 늦은\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Similarly, instead of asking people, 마찬가지로, 사람들에게 묻는 대신. to rate how bad a procrastinator they are, 그들이 얼마나 심하게 미루는 사람인지를 평가하도록. ask, 물어보라. \"How many of your utility bills, 당신의 공과금 고지서 중 얼마나 많은 것의. are you currently late in paying, 납부가 현재 늦었는지. even though you can afford to pay them?\", 당신이 그것들을 지불할 여유가 있음에도 불구하고?. 이 문장 전체를 해석하면, 마찬가지로, 사람들에게 그들이 얼마나 심하게 미루는 사람인지를 평가하도록 묻는 대신, “당신이 지불할 여유가 있음에도 불구하고 얼마나 많은 공과금 고지서의 납부가 현재 늦었나요?”라고 물어보라.","hl":"m"},{"n":28,"text":"이 문장은 앞 문장에서 제시한 원리를 미루기라는 다른 상황에 적용한 예시예요. 사람들에게 스스로 미루는 정도를 평가하게 하지 말고, 납부할 여유가 있는데도 연체된 공과금 고지서 수를 물어보면 훨씬 구체적인 답을 얻을 수 있죠. 이렇게 추상적인 자기 평가를 행동 기반 질문으로 바꾸면 연구 간 일관성도 높아져요.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 instead of asking people to rate인데요, instead of는 전치사라 뒤에 동명사 asking이 오고, 이어서 people과 to rate가 목적어와 to부정사로 쓰였어요. 두 번째는 how bad a procrastinator they are인데, 간접의문문이라 의문사 how 다음에 주어 they, 동사 are 순서가 와요. 세 번째는 ask인데, 주어 없이 동사원형으로 시작하는 명령문이라서 물어보라는 지시를 나타내요. 네 번째는 late in paying인데, late in paying은 납부가 늦었다는 뜻으로 전치사 in 뒤에 동명사 paying이 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구체적인 응답을 요구하는 질문은\u003c/span>\u003cspan class=\"en\">Questions \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">seek \u003c/span>\u003cspan class=\"tgt\">concrete \u003c/span>\u003cspan class=\"tgt\">responses\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">추상적인 개념을 더 명확하게 만들고 일관성을 보장하는 것을 돕는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">abstract \u003c/span>\u003cspan class=\"tgt\">concepts \u003c/span>\u003cspan class=\"tgt\">clearer\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">ensure \u003c/span>\u003cspan class=\"tgt\">consistency\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 연구에서 다음 연구까지\u003c/span>\u003cspan class=\"en\">from one study to the next.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">구체적인 응답을 요구하는 질문은 추상적인 개념을 더 명확하게 만들고 한 연구에서 다음 연구 간의 일관성을 보장하는 것을 돕는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 예시들을 \u003cb class=\"key\">일반화\u003c/b>하는 결론 문장입니다. \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">응답\u003c/b>을 요구하는 질문은 추상적인 개념을 명확하게 하고, 여러 연구에서 같은 기준을 쓸 수 있게 \u003cb class=\"key\">일관성\u003c/b>을 보장한다는 핵심 전략을 정리합니다. 질문이 구체적일수록 답이 비교 가능해진다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : Questions [that + seek + concrete responses] : \"구체적인 응답을 요구하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">help + 원형부정사와 make의 5형식\u003c/span> : help + [make + abstract concepts + clearer] : \"추상적인 개념을 더 명확하게 만드는 것을 돕는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 원형부정사 병렬\u003c/span> : help + [make ...] and [ensure consistency] : \"그리고 일관성을 보장하는 것을 돕는다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Questions that seek concrete responses, 구체적인 응답을 요구하는 질문은. help make abstract concepts clearer and ensure consistency, 추상적인 개념을 더 명확하게 만들고 일관성을 보장하는 것을 돕는다. from one study to the next, 한 연구에서 다음 연구까지. 이 문장 전체를 해석하면, 구체적인 응답을 요구하는 질문은 추상적인 개념을 더 명확하게 만들고 한 연구에서 다음 연구 간의 일관성을 보장하는 것을 돕는다.","hl":"m"},{"n":31,"text":"이 문장은 앞서 예시로 든 구체적 질문들이 왜 좋은지 결론으로 정리해 주는 문장이에요. 추상적인 개념을 바로 물어보면 사람마다 답이 달라지기 쉬운데, 구체적인 응답을 요구하는 질문은 개념을 더 명확하게 만들어 주죠. 그래서 한 연구에서 다음 연구까지 답변을 비교할 수 있는 일관성도 확보할 수 있다는 겁니다.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 주격 관계대명사 that입니다. that은 선행사 Questions를 수식하면서 that절 안에서 주어 역할을 하고, 그래서 that seek concrete responses가 앞의 질문을 구체적으로 한정해 줘요. 두 번째로 help make에서 help는 원형부정사를 목적어로 취하는 동사예요. 그 뒤의 make는 목적어 abstract concepts와 목적격보어 clearer를 거느리는 형태라서 추상적인 개념을 더 명확하게 만든다는 의미가 완성됩니다. 세 번째로 and ensure consistency를 보면 등위접속사 and가 make와 ensure를 병렬로 연결하고 있어요. help 뒤에 오는 두 개의 원형부정사가 같은 층위로 이어진 겁니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>많은 형태의 연구는 \u003cb class=\"key\">양적 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>로 자연스럽게 이어진다.\u003c/li>\u003cli>사람들에게 일 년에 몇 번 슬픈지 묻는 질문은 \u003cb class=\"key\">회상\u003c/b>과 \u003cb class=\"key\">정의\u003c/b> 차이로 \u003cb class=\"key\">신뢰\u003c/b>할 만하지 않을 수 있다.\u003c/li>\u003cli>병가를 낼 만큼 슬펐던 횟수나 연체된 공과금 수를 묻는 질문은 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">응답\u003c/b>을 이끌어 낸다.\u003c/li>\u003cli>\u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">응답\u003c/b>을 구하는 질문은 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>을 명확하게 하고 연구 간 \u003cb class=\"key\">일관성\u003c/b>을 보장한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Concrete questions make abstract concepts clearer and ensure consistency from one study to the next.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">많은 연구가 \u003cb class=\"key\">양적 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>로 이어지지만, '슬픈 횟수'처럼 \u003cb class=\"key\">모호한 \u003c/b>\u003cb class=\"key\">질문\u003c/b>은 회상과 정의의 차이로 \u003cb class=\"key\">신뢰\u003c/b>하기 어렵다. 병가나 연체 공과금 같은 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">응답\u003c/b>을 요구하는 질문이 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>을 명확하게 하고 연구 간 \u003cb class=\"key\">일관성\u003c/b>을 보장한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 지문의 핵심을 다시 정리하면, 연구에서 양적 데이터를 얻을 때 막연한 질문은 피하고 구체적인 응답을 요구하는 질문을 설계해야 한다는 것이었어요. 그래야 추상적인 개념이 명확해지고 연구 간 일관성도 확보되죠. 이렇게 질문 하나의 디테일이 데이터의 신뢰도를 바꾼다는 점을 기억하면 좋겠어요. 오늘 수고 많았어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
