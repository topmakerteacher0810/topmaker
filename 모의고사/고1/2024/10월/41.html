</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 41~42","audioDir":"41_audio","preview":false,"count":54,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.935em\">41~42\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Why We See Intention Everywhere\u003c/h1>\u003ch2>우리는 왜 어디서나 의도를 보는가\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인간은 어릴 때부터 사물과 사건에 \u003cb class=\"key\">목적\u003c/b>을 부여하고, \u003cb class=\"key\">의인화\u003c/b> 편향을 지니며, 의도가 없는데도 \u003cb class=\"key\">의도\u003c/b>를 가정한다. 이는 \u003cb class=\"key\">수렵 \u003c/b>\u003cb class=\"key\">채집\u003c/b> 시절 포식자를 피하려는 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">메커니즘\u003c/b>으로, 사자의 공격처럼 빠른 판단이 필요할 때 유리했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>We tend to assume intention even where there is none because this anthropomorphic bias was a survival mechanism.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 우리가 왜 사물에 의도를 부여하는지를 다룬 글이에요. 이 글의 핵심은 인간은 의인화 편향을 지니고 있으며 이것이 생존을 위한 진화적 산물이라는 거예요. 요약하면 우리는 의도가 없는 곳에서도 의도를 가정하는데 이는 수렵 채집 시절 포식자를 피하는 데 유리했기 때문이에요. 이제 본문으로 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간은 불확실한 상황에서도 의미를 찾으려는 강한 성향이 있어요. 심리학에서는 이를 \u003cb class=\"key\">의인화\u003c/b>(anthropomorphism) 또는 \u003cb class=\"key\">행위자 \u003c/b>\u003cb class=\"key\">탐지\u003c/b>(agency detection)라고 불러요. 하이퍼액티브 행위자 탐지(hyperactive agency detection)는 실제로는 없어도 살아 있는 존재나 \u003cb class=\"key\">의도\u003c/b>를 먼저 가정하는 인지 편향이에요. 어두운 방에서 걸려 있는 외투를 사람으로 착각하는 것처럼 우리 뇌는 놓치는 것보다 \u003cb class=\"key\">오탐지\u003c/b>가 생존에 유리했기 때문이에요. 진화심리학(evolutionary psychology)에서는 이러한 판단이 포식자를 빠르게 피하는 데 도움을 주었다고 설명해요.\u003c/div>","segs":[{"n":2,"text":"인간은 불확실한 상황에서도 의미를 찾으려는 성향이 강해요. 심리학에서는 이를 의인화 anthropomorphism 또는 행위자 탐지 agency detection라고 불러요. 하이퍼액티브 행위자 탐지 hyperactive agency detection은 실제로는 없어도 살아 있는 존재나 의도를 먼저 가정하는 인지 편향이에요. 어두운 방에서 걸려 있는 외투를 사람으로 착각하는 것처럼 우리 뇌는 놓치는 것보다 오탐지가 생존에 유리했기 때문이에요. 진화심리학 evolutionary psychology에서는 이런 판단이 포식자를 빠르게 피하는 데 도움을 주었다고 설명해요. 이것을 기억하고 지문을 읽으면 훨씬 잘 이해될 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>의도 부여 현상과 예시\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>어릴 때부터 우리는 사물과 사건에 \u003cb class=\"key\">목적\u003c/b>을 부여하며 \u003cb class=\"key\">무작위적 \u003c/b>\u003cb class=\"key\">우연\u003c/b>보다 이런 논리를 선호한다. 아이들이 뾰족한 돌이 자신이 앉지 못하게 하려는 \u003cb class=\"key\">의도\u003c/b>가 있다고 가정하는 것도 그 예이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>대상 판별과 의도 부여\u003csmall>전환 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>무언가를 마주치면 먼저 \u003cb class=\"key\">종류\u003c/b>를 판별해야 한다. \u003cb class=\"key\">무생물\u003c/b>과 식물은 움직이지 않아 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">현상\u003c/b>만으로 평가할 수 있다. 그러나 \u003cb class=\"key\">동물\u003c/b>과 사물에 \u003cb class=\"key\">의도\u003c/b>를 부여하면 그 행동을 빠르게 결정할 수 있다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>학자 주장과 지각 편향\u003csmall>주장/근거 · 문장 6–10\u003c/small>\u003c/h4>\u003cp>이러한 판단은 \u003cb class=\"key\">수렵 \u003c/b>\u003cb class=\"key\">채집\u003c/b> 시절 포식자를 피하는 데 필수적이었다. 인류학자 Stewart Guthrie는 \u003cb class=\"key\">모호한 \u003c/b>\u003cb class=\"key\">사물\u003c/b>을 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">특성\u003c/b>을 가진 \u003cb class=\"key\">행위자\u003c/b>로 해석하는 것이 생존이라고 주장했다. 그 결과 지각 체계는 \u003cb class=\"key\">의인화\u003c/b>에 강하게 편향되고, \u003cb class=\"key\">의도\u003c/b>가 없는데도 의도를 가정하게 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사자 예시와 생존 결론\u003csmall>예시/결론 · 문장 11–14\u003c/small>\u003c/h4>\u003cp>이러한 경향은 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">메커니즘\u003c/b>으로 발생했다. 사자가 공격할 때 \u003cb class=\"key\">의도\u003c/b>를 빠르게 가정해야 목숨을 구할 수 있다. 상세한 \u003cb class=\"key\">구조 \u003c/b>\u003cb class=\"key\">분석\u003c/b>이나 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">현상\u003c/b>의 이해 없이 \u003cb class=\"key\">의도\u003c/b>를 부여하는 것이 생존에 유리했다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글은 네 단계로 흘러가는데, 먼저 의도 부여 현상을 제시하고, 대상을 분류하는 기준을 설명한 뒤, 학자의 주장으로 의인화 편향의 기원을 제시하고, 마지막에 사자 예시로 생존적 이점을 강조해요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 우리가 어릴 때부터 사물과 사건에 목적을 부여하고 무작위적인 우연보다 이런 논리를 선호한다고 말해요. 예를 들어 아이들은 뾰족한 돌이 자신이 앉지 못하게 하려고 그렇게 생겼다고 가정하죠. 여기서 중요한 건 아이들의 이런 생각이 의인화의 아주 초기 사례라는 점이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 우리가 무언가를 마주칠 때 먼저 그게 어떤 종류인지 판별해야 한다는 내용이에요. 무생물과 식물은 보통 움직이지 않아서 물리적 현상만으로 평가할 수 있어요. 하지만 동물과 심지어 사물에 의도를 부여하면 그 대상이 할 것 같은 행동에 대해 빠른 결정을 내릴 수 있어요. 여기서 무생물과 식물, 동물과 사물이 대조되고 있다는 점을 잡아야 해요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 이런 빠른 결정이 수렵 채집 시절 포식자에게 잡아먹히지 않기 위해 필수적이었다고 해요. 인류학자 Stewart Guthrie는 우리의 진화상 과거에서 생존이란 모호한 사물을 인간의 정신적 특성을 가진 행위자로 해석하는 것을 의미한다고 주장했어요. 모호한 사건은 그런 행위자가 일으킨다고 봤죠. 그 결과 우리의 지각 체계는 의인화에 강하게 편향되었고, 의도가 없는 곳에서도 의도를 가정하는 경향이 생겼어요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 이 경향이 생존 메커니즘으로 발생했다는 것을 사자 예시로 설명해요. 사자가 곧 공격하려 한다면 우리는 그 의도를 빠르게 가정하고 반응해야 해요. 만약 이빨과 발톱의 구조를 상세히 분석하고 나서야 위험을 깨닫는다면 이미 죽은 뒤일 거예요. 그래서 상세한 구조 분석이나 물리적 현상의 이해 없이 의도를 부여하는 것이 목숨을 구해 왔다는 결론이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 인간이 사물과 사건에 \u003cb class=\"key\">목적\u003c/b>을 부여한다는 주장을 제시한다. 이어서 아이들의 돌 예시, 학자 Stewart Guthrie의 주장, 사자 예시를 통해 \u003cb class=\"key\">의인화\u003c/b>가 \u003cb class=\"key\">생존\u003c/b>에 유리했음을 근거로 뒷받침한다. 마지막 문장은 \u003cb class=\"key\">의도\u003c/b> 가정이 목숨을 구했다는 결론으로 주장을 재확인하므로 두괄식에 해당한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For instance (2)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>However (5)\u003c/b>\u003cspan>대조/전환\u003c/span>\u003cb>Therefore (10)\u003c/b>\u003cspan>결론\u003c/span>\u003cb>So (14)\u003c/b>\u003cspan>결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">assign purpose\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">attributing intention\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">interpret ambiguous objects as agents\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">anthropomorphism\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">assume intention\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">assuming intent\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Inanimate objects and plants\u003c/th>\u003cth>Animals and even objects\u003c/th>\u003c/tr>\u003ctr>\u003ctd>일반적으로 움직이지 않는다\u003c/td>\u003ctd>움직임과 의도를 가정한다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>물리적 현상만으로 평가된다\u003c/td>\u003ctd>빠른 행동 결정이 가능하다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거의 전개 방식을 취하고 있어요. 첫 문장에서 우리가 사물과 사건에 목적을 부여한다는 주장을 던지고, 그다음에 아이들의 돌 예시와 학자 주장, 사자 예시로 근거를 차곡차곡 쌓아요. 구조는 두괄식으로 볼 수 있는데 첫 문장이 글 전체의 화제를 제시하고 마지막 문장에서 결론을 다시 확인해 주거든요. 중간에 for instance, however, therefore, so 같은 신호어들이 논리를 이어 주고 있어요.","hl":"ty"},{"n":9,"text":"신호어를 살펴볼게요. 두 번째 문장의 for instance는 앞 주장의 예시를 시작하고, 다섯 번째 문장의 however는 무생물과 식물, 동물과 사물을 대조하면서 논리를 전환해요. 열 번째 문장의 therefore는 앞선 학자 주장의 결과를 정리하고, 열네 번째 문장의 so는 최종 결론을 이끌어요. 또 재진술 표현으로 assign purpose와 attributing intention, assume intention 같은 말이 계속 바뀌어 나오니 함께 묶어서 이해하면 좋아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>assign\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>purpose\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목적\u003c/span>\u003c/div>\u003cdiv>\u003cb>random chance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무작위적 우연\u003c/span>\u003c/div>\u003cdiv>\u003cb>assume\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pointy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>뾰족한\u003c/span>\u003c/div>\u003cdiv>\u003cb>encounter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>마주치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>determine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inanimate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무생물의\u003c/span>\u003c/div>\u003cdiv>\u003cb>evaluate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>평가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>physics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물리적 현상\u003c/span>\u003c/div>\u003cdiv>\u003cb>attributing intention\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>의도를 부여함\u003c/span>\u003c/div>\u003cdiv>\u003cb>likely behaviour\u003c/b>\u003cem>명사\u003c/em>\u003cspan>있을 법한 행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>essential\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>필수적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>hunter-gatherer days\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수렵 채집 시절\u003c/span>\u003c/div>\u003cdiv>\u003cb>predators\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포식자\u003c/span>\u003c/div>\u003cdiv>\u003cb>anthropologist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인류학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>survival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생존\u003c/span>\u003c/div>\u003cdiv>\u003cb>interpret\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해석하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ambiguous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>모호한\u003c/span>\u003c/div>\u003cdiv>\u003cb>agents\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행위자\u003c/span>\u003c/div>\u003cdiv>\u003cb>mental processes\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정신 과정\u003c/span>\u003c/div>\u003cdiv>\u003cb>perceptual system\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지각 체계\u003c/span>\u003c/div>\u003cdiv>\u003cb>biassed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>편향된\u003c/span>\u003c/div>\u003cdiv>\u003cb>anthropomorphism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의인화\u003c/span>\u003c/div>\u003cdiv>\u003cb>tend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~하는 경향이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>intention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의도\u003c/span>\u003c/div>\u003cdiv>\u003cb>survival mechanism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생존 메커니즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>detailed design analysis\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상세한 구조 분석\u003c/span>\u003c/div>\u003cdiv>\u003cb>saved your life\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>목숨을 구하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개만 짚어 볼게요. assign은 무엇을 부여하다라는 뜻이고 purpose는 목적, assume은 가정하다예요. inanimate는 무생물의, evaluate는 평가하다, physics는 물리적 현상이라는 의미로 쓰였어요. anthropomorphism은 의인화라는 뜻으로 이 지문의 핵심 개념이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">assume\u003c/b>\u003cspan class=\"m\">가정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">suppose\u003c/span>\u003cspan class=\"s\">presume\u003c/span>\u003cspan class=\"s\">guess\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003cspan class=\"a\">verify\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ambiguous\u003c/b>\u003cspan class=\"m\">모호한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unclear\u003c/span>\u003cspan class=\"s\">vague\u003c/span>\u003cspan class=\"s\">equivocal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clear\u003c/span>\u003cspan class=\"a\">obvious\u003c/span>\u003cspan class=\"a\">definite\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inanimate\u003c/b>\u003cspan class=\"m\">무생물의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lifeless\u003c/span>\u003cspan class=\"s\">nonliving\u003c/span>\u003cspan class=\"s\">inorganic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">animate\u003c/span>\u003cspan class=\"a\">living\u003c/span>\u003cspan class=\"a\">alive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">evaluate\u003c/b>\u003cspan class=\"m\">평가하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assess\u003c/span>\u003cspan class=\"s\">judge\u003c/span>\u003cspan class=\"s\">estimate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">survival\u003c/b>\u003cspan class=\"m\">생존\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">existence\u003c/span>\u003cspan class=\"s\">persistence\u003c/span>\u003cspan class=\"s\">endurance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">extinction\u003c/span>\u003cspan class=\"a\">death\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">essential\u003c/b>\u003cspan class=\"m\">필수적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">necessary\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">vital\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unnecessary\u003c/span>\u003cspan class=\"a\">optional\u003c/span>\u003cspan class=\"a\">dispensable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">biassed\u003c/b>\u003cspan class=\"m\">편향된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prejudiced\u003c/span>\u003cspan class=\"s\">partial\u003c/span>\u003cspan class=\"s\">skewed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">impartial\u003c/span>\u003cspan class=\"a\">unbiased\u003c/span>\u003cspan class=\"a\">fair\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 둘게요. assume은 suppose, presume과 바꿔 쓸 수 있고 반대는 doubt이에요. ambiguous는 unclear, vague와 비슷하고 clear, obvious와 반대예요. inanimate은 lifeless, nonliving과 유사하고 animate이나 living이 반대죠. essential은 necessary, crucial과 같고 unnecessary나 optional과 반대예요. biassed는 prejudiced, partial과 같고 impartial이나 unbiased와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어릴 때부터\u003c/span>\u003cspan class=\"en\">From an early age,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 목적을 부여한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">assign \u003c/span>\u003cspan class=\"tgt\">purpose \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사물과 사건에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">objects \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">events\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 논리를 선호하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">preferring \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">reasoning \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무작위적인 우연보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">random \u003c/span>\u003cspan class=\"tgt\">chance\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어릴 때부터 우리는 사물과 사건에 목적을 부여하며, 무작위적인 우연보다 이러한 논리를 선호한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 핵심 주장으로, 인간이 어릴 때부터 사물과 사건에 \u003cb class=\"key\">목적\u003c/b>을 부여하고 \u003cb class=\"key\">무작위적 \u003c/b>\u003cb class=\"key\">우연\u003c/b>보다 이러한 논리를 선호한다는 점을 제시한다. 여기서 assign purpose to objects and events는 '사물과 사건에 목적을 부여하다', prefer this reasoning to random chance는 '무작위적 우연보다 이러한 논리를 선호하다'라는 뜻으로, 뒤이어 나올 의인화 논의의 전제가 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">assign A to B 구문\u003c/span> : assign + 목적어(A) + to + 명사(B) : \"우리는 사물과 사건에 목적을 부여한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구문(부대상황) + prefer A to B\u003c/span> : S + V..., [preferring + A + to + B] (분사구문) : \"이러한 논리를 무작위적인 우연보다 선호하면서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"From an early age, 어릴 때부터. we assign purpose, 우리는 목적을 부여한다. to objects and events, 사물과 사건에. preferring this reasoning, 이러한 논리를 선호하면서. to random chance, 무작위적인 우연보다. 이 문장 전체를 해석하면, 어릴 때부터 우리는 사물과 사건에 목적을 부여하며, 무작위적인 우연보다 이러한 논리를 선호한다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 글의 핵심 주장입니다. 인간은 어릴 때부터 사물과 사건에 목적을 부여하고, 무작위적인 우연보다 그렇게 목적이 있다고 보는 논리를 선호한다는 거예요. assign purpose to objects and events는 사물과 사건에 목적을 부여하다, preferring this reasoning to random chance는 무작위적인 우연보다 이러한 논리를 선호하다라는 뜻입니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 assign A to B 구문이에요. assign은 목적어 A와 전치사 to가 이끄는 명사 B를 함께 써서 A를 B에 부여하다는 뜻을 나타냅니다. 여기서는 we assign purpose to objects and events라고 해서 우리가 사물과 사건에 목적을 부여한다는 뜻이 되죠. 두 번째 포인트는 현재분사구문이에요. preferring this reasoning to random chance는 주어 we가 목적을 부여하면서 동시에 무작위적인 우연보다 이러한 논리를 선호한다는 부대 상황을 나타냅니다. prefer A to B는 A를 B보다 선호하다라는 비교 표현이니 함께 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어 아이들은 가정한다\u003c/span>\u003cspan class=\"en\">Children assume, for instance,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뾰족한 돌이 그렇게 생겼다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">pointy \u003c/span>\u003cspan class=\"tgt\">rocks \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">way\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그들은 당신이 그들 위에 앉는 것을 원하지 않기 때문이다\u003c/span>\u003cspan class=\"en\">because they don't \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sit \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어 뾰족한 돌은 아이들이 그 위에 앉기를 원치 않기 때문에 그것이 그렇게 생겼다고 그들(아이들)은 가정한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 첫 문장의 주장을 뒷받침하는 구체적인 \u003cb class=\"key\">예시\u003c/b>이다. 아이들이 뾰족한 돌을 보고 돌이 사람이 앉지 못하게 하려는 의도를 가졌다고 가정하는 것으로, 무생물에 \u003cb class=\"key\">의인화\u003c/b>적 사고를 적용한 것이다. 여기서 they는 pointy rocks를 가리킨다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 that (assume의 목적어)\u003c/span> : assume + that + S + V : \"뾰족한 돌이 그렇게 생겼다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">want + 목적어 + to부정사 (5형식)\u003c/span> : want + 목적어(you) + to부정사(to sit on them) : \"당신이 그들 위에 앉기를 원하다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Children assume, for instance, 예를 들어 아이들은 가정한다. that pointy rocks are that way, 뾰족한 돌이 그렇게 생겼다고. because they don't want you to sit on them, 왜냐하면 그들은 당신이 그들 위에 앉는 것을 원하지 않기 때문이다. 이 문장 전체를 해석하면, 예를 들어 뾰족한 돌은 아이들이 그 위에 앉기를 원치 않기 때문에 그것이 그렇게 생겼다고 그들(아이들)은 가정한다.","hl":"m"},{"n":16,"text":"두 번째 문장은 첫 번째 문장의 구체적인 예시예요. 아이들은 뾰족한 돌을 보면서, 돌이 사람이 앉지 못하게 하려고 뾰족하게 생겼다고 가정한다는 거죠. 여기서 they는 pointy rocks를 가리키고, 돌이 마치 의도를 가진 것처럼 여기는 의인화적 사고가 드러납니다.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 assume that 절이에요. Children assume that pointy rocks are that way에서 that 이하는 assume의 목적어로 쓰인 명사절입니다. that은 명사절 접속사로, 우리말로는 그렇게 생겼다고 할 때의 그 다에 해당하지만 영어에서는 that을 써서 절을 이끌어요. 두 번째 포인트는 want 목적어 to부정사 구문이에요. want you to sit on them은 당신이 그들 위에 앉기를 원하다라는 뜻으로, want가 목적어 you와 to부정사를 함께 취하는 오형식 구조입니다. 목적어 you가 to부정사의 의미상 주어라는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 무언가를 마주칠 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">encounter \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 먼저 결정할 필요가 있다\u003c/span>\u003cspan class=\"en\">we first \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">determine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 어떤 종류의 것인지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">sort \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">thing \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 무언가를 마주칠 때 우리는 먼저 그것이 어떤 종류의 것인지 결정할 필요가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지각의 첫 단계로, 어떤 대상을 마주치면 먼저 그것이 어떤 \u003cb class=\"key\">종류\u003c/b>의 것인지 판별해야 한다는 \u003cb class=\"key\">인식 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 설명한다. 뒤에 무생물과 식물, 동물로 나누어 평가하는 논의로 연결된다는 점에서 전환 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절\u003c/span> : When + S + V..., S + V... : \"우리가 무언가를 마주칠 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">need + to부정사 (명사적 용법)\u003c/span> : need + to부정사(to determine) : \"결정할 필요가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사절)\u003c/span> : determine + [what + S + V] : \"그것이 어떤 종류의 것인지를\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"When we encounter something, 우리가 무언가를 마주칠 때. we first need to determine, 우리는 먼저 결정할 필요가 있다. what sort of thing it is, 그것이 어떤 종류의 것인지를. 이 문장 전체를 해석하면, 우리가 무언가를 마주칠 때 우리는 먼저 그것이 어떤 종류의 것인지 결정할 필요가 있다.","hl":"m"},{"n":19,"text":"세 번째 문장은 우리가 무언가를 마주치면 가장 먼저 그것이 어떤 종류의 것인지 결정해야 한다는 말이에요. 이는 지각의 첫 단계를 설명하는 문장으로, 뒤에서 무생물과 식물, 동물을 구분하는 논의로 연결됩니다. 여기서 determine은 결정하다보다는 알아내다, 판별하다의 의미로 쓰였어요.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 when이 이끄는 시간 부사절이에요. When we encounter something은 우리가 무언가를 마주칠 때라는 뜻으로, 주절의 시간적 배경을 나타냅니다. 두 번째 포인트는 need to부정사예요. need to determine은 결정할 필요가 있다는 뜻으로, to부정사가 need의 목적어로 쓰인 명사적 용법입니다. 세 번째 포인트는 간접의문문이에요. what sort of thing it is는 그것이 어떤 종류의 것인지를 뜻하는 의문사절이고, determine의 목적어 역할을 합니다. 간접의문문은 의문사 뒤에 주어와 동사가 오는 어순이라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무생물과 식물은\u003c/span>\u003cspan class=\"en\">Inanimate objects and plants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반적으로 움직이지 않으며\u003c/span>\u003cspan class=\"en\">generally \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">move \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 평가될 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">evaluated\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물리적 현상만으로\u003c/span>\u003cspan class=\"en\">from physics alone.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무생물과 식물은 일반적으로 움직이지 않으며 물리적 현상만으로 평가될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 무생물과 식물은 스스로 움직이지 않으므로 의도를 따질 필요 없이 물리 법칙만으로 평가할 수 있다는 뜻입니다. 이는 다음 문장에서 동물이나 대상에 의도를 부여하는 것과 대비되는 기준 역할을 합니다. \u003cb class=\"key\">무생물\u003c/b>과 \u003cb class=\"key\">식물\u003c/b>은 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">현상\u003c/b>만으로 다룰 수 있는 존재죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조: 동사구 and 동사구\u003c/span> : do not move + and + can be evaluated : \"움직이지 않으며 평가될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 수동태\u003c/span> : can + be + evaluated(과거분사) : \"평가될 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Inanimate objects and plants, 무생물과 식물은. generally do not move, 일반적으로 움직이지 않으며. and can be evaluated, 그리고 평가될 수 있다. from physics alone, 물리적 현상만으로. 이 문장 전체를 해석하면, 무생물과 식물은 일반적으로 움직이지 않으며 물리적 현상만으로 평가될 수 있다.","hl":"m"},{"n":22,"text":"이 문장은 무생물과 식물은 일반적으로 움직이지 않고 물리적 현상만으로 평가할 수 있다는 뜻이에요. 이렇게 의도를 부여할 필요가 없는 존재와 다음 문장에서 의도를 부여하는 존재가 대비되는 기준을 잡아 주는 역할을 합니다. 핵심은 무생물과 식물은 물리적 현상만으로 평가될 수 있다는 점이에요.","hl":"mn"},{"n":23,"text":"첫 번째, do not move and can be evaluated에서 and가 두 동사구를 병렬 연결하고 있어요. 앞부분은 do not move로 일반적인 부정이고, 뒷부분은 can be evaluated로 조동사 수동태예요. 두 번째, can be evaluated는 can 뒤에 동사원형 be가 오고 과거분사 evaluated가 결합한 수동태로 평가될 수 있다는 뜻이에요. 주어인 무생물과 식물이 평가의 대상이므로 수동태를 쓴 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 의도가 있다고 생각함으로써\u003c/span>\u003cspan class=\"en\">However, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">attributing \u003c/span>\u003cspan class=\"tgt\">intention\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물과 심지어 사물에게\u003c/span>\u003cspan class=\"en\">to animals and even objects,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 빠른 결정을 내릴 수 있다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> fast decisions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그럴듯한 행동에 대해\u003c/span>\u003cspan class=\"en\">about the likely behaviour\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 존재의\u003c/span>\u003cspan class=\"en\">of that being.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 동물과 심지어 사물도 의도가 있다고 생각함으로써 우리는 그 존재가 할 것 같은 행동에 대해 빠른 결정을 내릴 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물뿐 아니라 사물에까지 의도가 있다고 여기면 그 존재가 앞으로 어떻게 행동할지 빠르게 판단할 수 있다는 내용입니다. 앞 문장의 무생물·식물과 달리, 의도를 부여하는 것이 오히려 신속한 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">예측\u003c/b>에 도움이 된다는 흐름을 보여 줍니다. \u003cb class=\"key\">의도 \u003c/b>\u003cb class=\"key\">부여\u003c/b>가 \u003cb class=\"key\">빠른 \u003c/b>\u003cb class=\"key\">결정\u003c/b>을 가능하게 한다는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사\u003c/span> : by + attributing + intention (동명사구) : \"의도가 있다고 생각함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be able to + 동사원형\u003c/span> : are able to + make (동사원형) : \"빠른 결정을 내릴 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"However, by attributing intention, 그러나 의도가 있다고 생각함으로써. to animals and even objects, 동물과 심지어 사물에게. we are able to make fast decisions, 우리는 빠른 결정을 내릴 수 있다. about the likely behaviour, 그럴듯한 행동에 대해. of that being, 그 존재의. 이 문장 전체를 해석하면, 그러나 동물과 심지어 사물도 의도가 있다고 생각함으로써 우리는 그 존재가 할 것 같은 행동에 대해 빠른 결정을 내릴 수 있다.","hl":"m"},{"n":25,"text":"여기서는 동물과 심지어 사물에게 의도가 있다고 보면 그 존재가 할 것 같은 행동을 빠르게 결정할 수 있다는 뜻이에요. 앞 문장과 달리 의도를 부여하는 일이 신속한 행동 예측에 도움이 된다는 흐름을 보여 줍니다. 핵심은 의도 부여가 빠른 결정을 가능하게 한다는 점이에요.","hl":"mn"},{"n":26,"text":"첫 번째, by attributing intention에서 by는 수단이나 방법을 나타내는 전치사라서 뒤에 동명사 attributing이 와요. 그래서 의도가 있다고 생각함으로써라고 해석합니다. 두 번째, are able to make는 can처럼 할 수 있다는 능력이나 가능을 나타내는 표현이에요. be able to 뒤에는 동사원형 make가 와서 빠른 결정을 내릴 수 있다는 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 필수적이었다 우리의 수렵 채집 시절에 피하기 위해 잡아먹히는 것 포식자에게\u003c/span>\u003cspan class=\"en\">This was essential in our hunter­gatherer days \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">avoid \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">eaten \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">predators\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 우리의 수렵 채집 시절에 포식자에게 잡아먹히는 것을 피하기 위해 필수적이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이런 의도 부여가 수렵 채집 시절 생존에 필수적이었다고 설명합니다. 포식자에게 잡아먹히는 것을 피하려면 그 존재의 의도를 빠르게 알아차려야 했기 때문입니다. \u003cb class=\"key\">생존\u003c/b>에 \u003cb class=\"key\">필수적\u003c/b>이었다는 말로 앞 문장의 이유를 압축합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to avoid + being eaten (동명사구) : \"잡아먹히는 것을 피하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 수동태 (being + p.p.)\u003c/span> : being + eaten(과거분사) : \"잡아먹히는 것\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This was essential, 이것은 필수적이었다. in our hunter-gatherer days, 우리의 수렵 채집 시절에. to avoid, 피하기 위해. being eaten, 잡아먹히는 것. by predators, 포식자에게. 이 문장 전체를 해석하면, 이는 우리의 수렵 채집 시절에 포식자에게 잡아먹히는 것을 피하기 위해 필수적이었다.","hl":"m"},{"n":28,"text":"이 문장은 이런 의도 부여가 수렵 채집 시절에 포식자에게 잡아먹히는 것을 피하기 위해 필수적이었다고 설명해요. 생존을 위해 상대의 의도를 빠르게 파악하는 것이 중요했다는 말이죠. 그래서 앞 문장의 이유를 생존과 필수라는 말로 압축해 주고 있어요.","hl":"mn"},{"n":29,"text":"첫 번째, to avoid being eaten by predators는 앞 내용이 필수적이었던 목적을 나타내는 to부정사의 부사적 용법이에요. 피하기 위해라고 해석하죠. 두 번째, avoid는 목적어로 동명사를 취하므로 being eaten이 왔어요. 이때 being eaten은 먹히는 것이라는 수동의 의미를 담은 동명사의 수동태입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인류학자 Stewart Guthrie는\u003c/span>\u003cspan class=\"en\">The anthropologist Stewart Guthrie\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요점을 주장했다\u003c/span>\u003cspan class=\"en\">made the point\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 진화상 과거에서 생존이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">survival \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">evolutionary \u003c/span>\u003cspan class=\"tgt\">past\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미했다, 즉 우리가 모호한 사물을 해석한다는 것을\u003c/span>\u003cspan class=\"en\">meant \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">interpret \u003c/span>\u003cspan class=\"tgt\">ambiguous \u003c/span>\u003cspan class=\"tgt\">objects \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 정신적 특성을 가진 행위자로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">agents \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">mental \u003c/span>\u003cspan class=\"tgt\">characteristics\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 정신 과정이기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mental \u003c/span>\u003cspan class=\"tgt\">processes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 이해하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인류학자 Stewart Guthrie는 인간의 정신적 특성이 우리가 이해하는 정신 과정이기 때문에, 우리의 진화상 과거에서 생존이란 우리가 모호한 사물을 인간의 정신적 특성을 가진 행위자로 해석하는 것을 의미한다고 주장했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 진화적 생존을 위해 모호한 대상을 \u003cb class=\"key\">행위자\u003c/b>로 해석하는 전략이 유리했다는 Stewart Guthrie의 주장을 제시합니다. 인간의 \u003cb class=\"key\">정신 \u003c/b>\u003cb class=\"key\">과정\u003c/b>은 우리가 이해할 수 있는 방식이므로, 대상에 의도를 부여해 빠르게 반응했다는 설명입니다. 즉 의인화가 진화적 생존 기제에서 비롯되었음을 보여주는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 that절\u003c/span> : the point + that + [완전한 절] : \"~라는 요점\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절 목적어)\u003c/span> : meant + that + [완전한 절] : \"우리가 모호한 사물을 ... 해석한다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 as (이유)\u003c/span> : as + 주어 + be동사 + 보어 : \"그것들이 정신 과정이기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">관계대명사 which (목적격)\u003c/span> : 선행사 + which + 주어 + 동사 : \"우리가 이해하는\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The anthropologist Stewart Guthrie, 인류학자 Stewart Guthrie는. made the point, 요점을 주장했다. that survival in our evolutionary past, 우리의 진화상 과거에서 생존이. meant that we interpret ambiguous objects, 의미했다, 즉 우리가 모호한 사물을 해석한다는 것을. as agents with human mental characteristics, 인간의 정신적 특성을 가진 행위자로. as those are the mental processes, 그것들이 정신 과정이기 때문에. which we understand, 우리가 이해하는. 이 문장 전체를 해석하면, 인류학자 Stewart Guthrie는 인간의 정신적 특성이 우리가 이해하는 정신 과정이기 때문에, 우리의 진화상 과거에서 생존이란 우리가 모호한 사물을 인간의 정신적 특성을 가진 행위자로 해석하는 것을 의미한다고 주장했다.","hl":"m"},{"n":31,"text":"인류학자 Stewart Guthrie는 진화 과정에서 생존을 위해 모호한 대상을 인간의 정신적 특성을 지닌 행위자로 해석했다고 주장합니다. 인간의 정신 과정은 우리가 가장 잘 이해하는 방식이기 때문에 모호한 대상을 그런 행위자로 보는 것이 생존에 유리했다는 거죠. 이 문장은 의인화가 진화적 생존 전략에서 비롯되었다는 핵심 주장을 담고 있습니다.","hl":"mn"},{"n":32,"text":"첫 번째로 made the point 뒤의 that절은 point의 내용을 설명하는 동격입니다. 두 번째로 meant 뒤의 that절은 meant의 목적어 역할을 해요. 세 번째로 as those are the mental processes에서 as는 이유를 나타내고, 네 번째로 which we understand는 mental processes를 꾸며주는 관계대명사절입니다. interpret A as B는 A를 B로 해석한다는 뜻도 함께 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모호한 사건은\u003c/span>\u003cspan class=\"en\">Ambiguous events\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야기된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">caused\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 행위자에 의해.\u003c/span>\u003cspan class=\"en\">by such agents.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모호한 사건은 이러한 행위자에 의해 발생한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 모호한 해석의 원인을 \u003cb class=\"key\">행위자\u003c/b>에게 돌립니다. 모호한 사건을 단순한 우연이 아니라 의도를 가진 존재가 일으킨 것으로 본다는 뜻입니다. 이는 인간이 원인을 \u003cb class=\"key\">의인화\u003c/b>된 존재로 파악하려는 경향을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + p.p. + by + 행위자 : \"야기된다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Ambiguous events, 모호한 사건은. are caused, 야기된다. by such agents, 그러한 행위자에 의해.. 이 문장 전체를 해석하면, 모호한 사건은 이러한 행위자에 의해 발생한다.","hl":"m"},{"n":34,"text":"모호한 사건은 그러한 행위자가 일으킨 것으로 본다는 뜻이에요. 앞 문장에서 말한 인간의 정신적 특성을 가진 행위자를 원인으로 지목하는 거죠. 그래서 우리는 모호한 상황에서도 어떤 의도를 가진 존재를 상정하게 됩니다.","hl":"mn"},{"n":35,"text":"이 문장은 수동태가 쓰였어요. are caused 뒤에 by such agents가 와서 모호한 사건이 행위자에 의해 야기된다는 수동 의미를 만들죠. be동사와 과거분사 caused의 결합을 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 귀결된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">results \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지각 체계로\u003c/span>\u003cspan class=\"en\">a perceptual system\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강하게 편향된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">strongly \u003c/span>\u003cspan class=\"tgt\">biassed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의인화 쪽으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">towards \u003c/span>\u003cspan class=\"tgt\">anthropomorphism\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 의인화에 강하게 편향된 지각 체계로 귀결된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 7번과 8번에서 설명한 해석 방식이 모여 우리의 지각 체계가 \u003cb class=\"key\">의인화\u003c/b> 쪽으로 강하게 기울어졌다는 결과를 정리합니다. 여기서는 의인화가 단순한 상상이 아니라 \u003cb class=\"key\">지각 \u003c/b>\u003cb class=\"key\">체계\u003c/b>의 \u003cb class=\"key\">편향\u003c/b>임을 강조합니다. 글의 흐름에서 앞선 진화적 설명을 하나의 심리학적 결론으로 수렴시키는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">result in 구동사\u003c/span> : result in + 명사구 : \"~로 귀결되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구 (후치수식)\u003c/span> : 명사 + 과거분사구 : \"의인화에 강하게 편향된\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"This results in, 이는 귀결된다. a perceptual system, 지각 체계로. strongly biassed, 강하게 편향된. towards anthropomorphism, 의인화 쪽으로.. 이 문장 전체를 해석하면, 이는 의인화에 강하게 편향된 지각 체계로 귀결된다.","hl":"m"},{"n":37,"text":"결국 이 모든 해석 방식이 쌓여서 우리의 지각 체계가 의인화 쪽으로 강하게 기울어지게 됩니다. 여기서 anthropomorphism은 인간의 특성을 인간이 아닌 대상에 부여하는 현상을 말해요. 이 문장은 앞의 모호한 대상을 행위자로 보는 경향이 지각 체계의 편향으로 자리 잡았다고 정리해줍니다.","hl":"mn"},{"n":38,"text":"첫 번째로 results in은 result in 뒤에 명사구를 써서 결과가 그 명사구로 귀결된다는 뜻입니다. 두 번째로 strongly biassed towards anthropomorphism은 앞의 a perceptual system을 뒤에서 수식하는 과거분사구예요. 지각 체계가 의인화 방향으로 편향되어 있는 상태를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로,\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 의도를 가정하는 경향이 있다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tend \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">assume \u003c/span>\u003cspan class=\"tgt\">intention\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 의도가 없는 곳에서도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">none\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로, 우리는 의도가 없는 곳에서도 의도를 가정하는 경향이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 \u003cb class=\"key\">의인화\u003c/b> 경향을 결론으로 정리하는 문장입니다. 의도가 실제로 없는 상황에서도 우리는 습관적으로 \u003cb class=\"key\">의도\u003c/b>를 읽어 내려는 경향이 있다는 뜻입니다. 'none'은 바로 앞의 intention을 대신하는 대명사로 이해하면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법\u003c/span> : tend [동사] + to assume intention [to부정사구/목적어] : \"의도를 가정하는 경향이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">where 부사절\u003c/span> : even where [부사절 접속사] + there is none [절] : \"심지어 의도가 없는 곳에서도\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Therefore, 그러므로. we tend to assume intention, 우리는 의도를 가정하는 경향이 있다. even where there is none, 심지어 의도가 없는 곳에서도. 이 문장 전체를 해석하면, 그러므로, 우리는 의도가 없는 곳에서도 의도를 가정하는 경향이 있다.","hl":"m"},{"n":40,"text":"이 문장은 앞에서 설명한 의인화 경향을 결론으로 정리한 문장이에요. 의도가 실제로 없는 상황에서도 우리는 습관적으로 의도를 가정한다는 뜻이에요. 여기서 none은 intention을 대신하는 대명사로 볼 수 있어요.","hl":"mn"},{"n":41,"text":"어법 포인트를 짚어 볼게요. 첫 번째, tend to assume intention에서 tend는 to부정사를 목적어로 취하는 동사예요. 그래서 to assume이 명사적 역할을 하죠. 두 번째, even where there is none에서 where는 장소가 아니라 어떤 경우라는 뜻의 부사절 접속사예요. even과 함께 의도가 없는 곳에서조차라는 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은\u003c/span>\u003cspan class=\"en\">This\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발생해 왔을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">arisen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생존 메커니즘으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">survival \u003c/span>\u003cspan class=\"tgt\">mechanism\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 생존 메커니즘으로 발생해 왔을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> This는 바로 앞 문장의 ‘의도가 없는 곳에서도 의도를 가정하는 경향’을 가리킵니다. 그런 경향이 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">메커니즘\u003c/b>으로 생겨났을 것이라는 진화적 설명을 제시합니다. 'would have arisen'은 과거에 대한 \u003cb class=\"key\">추측\u003c/b>을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 would + have p.p. (과거 추측)\u003c/span> : would [조동사] + have arisen [have p.p.] : \"발생했을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as (자격)\u003c/span> : as [전치사] + a survival mechanism [명사구] : \"생존 메커니즘으로\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"This, 이것은. would have arisen, 발생해 왔을 것이다. as a survival mechanism, 생존 메커니즘으로. 이 문장 전체를 해석하면, 이는 생존 메커니즘으로 발생해 왔을 것이다.","hl":"m"},{"n":43,"text":"이 문장의 This는 바로 앞에서 말한 의도가 없는 곳에서도 의도를 가정하는 경향을 가리켜요. 그런 경향이 생존 메커니즘으로 생겨났을 것이라는 진화적 설명을 제시하고 있죠. would have arisen은 과거에 대한 추측이에요.","hl":"mn"},{"n":44,"text":"첫 번째, would have arisen은 would have p.p. 형태로 과거 사실에 대한 강한 추측을 나타내요. 아마 발생했을 것이다로 해석하면 됩니다. 두 번째, as a survival mechanism에서 as는 자격이나 역할을 나타내는 전치사로 생존 메커니즘으로라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 14\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 사자가 당신을 막 공격하려 한다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lion \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">attack \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 빠르게 반응할 필요가 있다\u003c/span>\u003cspan class=\"en\">you need to react quickly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신을 죽이려는 그것의 가능한 의도를 고려하여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">given \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">probable \u003c/span>\u003cspan class=\"tgt\">intention \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">kill \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 사자가 당신을 막 공격하려 한다면 당신을 죽이려는 그것의 가능한 의도를 고려하여 당신은 빠르게 반응할 필요가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사자가 막 공격하려는 상황을 예로 들어, 의도를 고려한 \u003cb class=\"key\">빠른 \u003c/b>\u003cb class=\"key\">반응\u003c/b>이 생존에 중요했음을 보여 줍니다. 'given its probable intention to kill you'는 ‘당신을 죽이려는 가능한 의도를 고려하여’라는 뜻으로 판단 근거를 나타냅니다. 복잡한 설계 분석 없이 \u003cb class=\"key\">의도\u003c/b>를 가정하는 것의 생존적 이점을 구체화하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 (if)\u003c/span> : If [접속사] + a lion [주어] + is [동사] + about to attack you [구문] : \"만약 사자가 당신을 막 공격하려 한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be about to-v (가까운 미래)\u003c/span> : be [동사] + about [부사] + to attack [to부정사구] : \"막 공격하려 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">given + 명사 (이유·조건)\u003c/span> : given [전치사] + its probable intention [명사구] + to kill you [to부정사구] : \"당신을 죽이려는 그것의 가능한 의도를 고려하여\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"If a lion is about to attack you, 만약 사자가 당신을 막 공격하려 한다면. you need to react quickly, 당신은 빠르게 반응할 필요가 있다. given its probable intention to kill you, 당신을 죽이려는 그것의 가능한 의도를 고려하여. 이 문장 전체를 해석하면, 만약 사자가 당신을 막 공격하려 한다면 당신을 죽이려는 그것의 가능한 의도를 고려하여 당신은 빠르게 반응할 필요가 있다.","hl":"m"},{"n":46,"text":"이 문장은 사자가 막 공격하려는 상황을 예로 들어서 의도를 고려한 빠른 반응이 생존에 중요했음을 보여줘요. given its probable intention to kill you는 당신을 죽이려는 가능한 의도를 고려하여라는 뜻으로 판단 근거를 나타내요. 복잡한 설계 분석 없이 의도를 가정하는 것의 생존적 이점을 구체화한 문장이에요.","hl":"mn"},{"n":47,"text":"첫 번째, If a lion is about to attack you에서 If는 조건의 부사절을 이끄는 접속사예요. 두 번째, is about to attack은 be about to 형태로 이제 곧 공격하려 한다는 임박한 미래를 나타내요. 세 번째, given its probable intention to kill you에서 given은 전치사로 뒤에 명사구를 취해 어떤 것을 고려하여라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 깨달았을 즈음\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">realized\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 이빨과 발톱의 구조가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">design \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">teeth \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">claws \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신을 죽일 수 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">kill \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 죽어 있다.\u003c/span>\u003cspan class=\"en\">you are dead.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 그것의 이빨과 발톱의 구조가 당신을 죽일 수 있다는 것을 깨달았을 즈음 당신은 죽어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사자가 공격하려 할 때 이빨과 발톱의 구조를 분석해서 위험을 깨달을 때쯤이면 이미 너무 늦다는 뜻이에요. 글에서 \u003cb class=\"key\">의도 \u003c/b>\u003cb class=\"key\">부여\u003c/b>가 즉각적인 생존 반응으로 유리했음을 보여주는 구체적 예시로, 분석적 판단은 시간이 오래 걸려 생존에 불리함을 강조합니다. \u003cb class=\"key\">by \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">time\u003c/b>은 어떤 시점에는 이미 결과가 일어나 있음을 드러내는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사절 접속사 by the time + 현재완료\u003c/span> : By the time + S + have/has p.p., S + 현재시제 : \"당신이 깨달았을 즈음\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that절 목적어 (명사절)\u003c/span> : realized + that + S + V : \"그것의 이빨과 발톱의 구조가 당신을 죽일 수 있다는 것을\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"By the time you have realized, 당신이 깨달았을 즈음. that the design of its teeth and claws, 그것의 이빨과 발톱의 구조가. could kill you, 당신을 죽일 수 있다는 것을. you are dead, 당신은 죽어 있다.. 이 문장 전체를 해석하면, 당신이 그것의 이빨과 발톱의 구조가 당신을 죽일 수 있다는 것을 깨달았을 즈음 당신은 죽어 있다.","hl":"m"},{"n":49,"text":"이 문장은 사자의 이빨과 발톱 구조를 분석해서 위험을 깨달을 때쯤이면 이미 죽어 있다는 뜻이에요. 그러니까 의도를 부여하는 즉각적인 판단이 분석적 사고보다 생존에 유리했다는 걸 보여주는 예시죠. by the time은 어떤 시점에는 이미 결과가 끝나 있다는 점을 강조하는 표현이에요.","hl":"mn"},{"n":50,"text":"첫 번째 어법은 by the time이에요. by the time은 어떤 시점까지의 완료를 나타내는 접속사라서 그 뒤에는 현재완료 have realized가 왔어요. 주절은 you are dead처럼 현재시제를 써서 그때쯤이면 이미 죽어 있다는 결과를 강조합니다. 두 번째는 that절이에요. realized의 목적어로 쓰인 명사절 that절이 깨달은 내용 전체를 이끌고, that 이하는 완전한 문장 구조를 갖추고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 14\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 의도를 부여하는 것이\u003c/span>\u003cspan class=\"en\">So, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">assuming \u003c/span>\u003cspan class=\"tgt\">intent\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상세한 구조 분석 없이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">detailed \u003c/span>\u003cspan class=\"tgt\">design \u003c/span>\u003cspan class=\"tgt\">analysis \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 물리적 현상의 이해 없이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">understanding \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">physics\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 목숨을 구해 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">saved\u003c/span> your life.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 상세한 구조 분석 또는 물리적 현상의 이해 없이 의도를 부여하는 것이 당신의 목숨을 구해 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 논의의 결론으로, 상세한 구조 분석이나 물리 법칙의 이해 없이 \u003cb class=\"key\">의도를 \u003c/b>\u003cb class=\"key\">부여하는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 생존에 유리했다는 핵심 주장을 요약합니다. assuming intent가 주어인 \u003cb class=\"key\">동명사구\u003c/b>이고, without 이하는 그 판단을 꾸미는 \u003cb class=\"key\">부대 \u003c/b>\u003cb class=\"key\">상황\u003c/b>입니다. 즉 이빨과 발톱 구조를 일일이 분석하지 않고도 공격 의도를 빠르게 가정하는 것이 목숨을 구했다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : Assuming intent + 단수동사 has saved : \"의도를 부여하는 것이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 without + 병렬된 명사구\u003c/span> : without + A or B : \"상세한 구조 분석 또는 물리적 현상의 이해 없이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재완료\u003c/span> : have/has + p.p. : \"구해 왔다\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"So, assuming intent, 그래서 의도를 부여하는 것이. without detailed design analysis, 상세한 구조 분석 없이. or understanding of the physics, 또는 물리적 현상의 이해 없이. has saved your life, 당신의 목숨을 구해 왔다. 이 문장 전체를 해석하면, 따라서 상세한 구조 분석 또는 물리적 현상의 이해 없이 의도를 부여하는 것이 당신의 목숨을 구해 왔다.","hl":"m"},{"n":52,"text":"이 문장은 결론이에요. 상세한 구조 분석이나 물리 법칙을 이해하지 않고도 의도를 부여하는 것이 여러분의 목숨을 구해 왔다는 뜻이죠. assuming intent가 주어인 동명사구이고 without 이하는 그 판단을 꾸며주는 부대 상황이에요. 이빨과 발톱 구조를 일일이 분석하지 않고도 공격 의도를 빠르게 가정하는 것이 생존에 유리했다는 핵심 주장을 요약합니다.","hl":"mn"},{"n":53,"text":"첫 번째 어법은 동명사구 주어예요. assuming intent가 주어 자리에 쓰였고, 전체가 단수로 취급되어서 뒤에 has saved가 왔어요. 두 번째는 현재완료 has saved예요. 과거의 생존 경험이 현재까지 영향을 주고 있다는 의미를 담고 있어요. 세 번째는 without 이에요. without은 전치사라서 뒤에 detailed design analysis와 understanding of the physics라는 두 명사구를 or로 병렬 연결했어요. understanding은 동명사로 명사 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>인간은 어릴 때부터 사물과 사건에 \u003cb class=\"key\">목적\u003c/b>을 부여하며, \u003cb class=\"key\">무작위적 \u003c/b>\u003cb class=\"key\">우연\u003c/b>보다 의도적 설명을 선호한다.\u003c/li>\u003cli>무생물과 식물은 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">현상\u003c/b>만으로 평가되지만, 동물과 사물에 \u003cb class=\"key\">의도\u003c/b>를 부여하면 빠른 결정을 할 수 있다.\u003c/li>\u003cli>이러한 \u003cb class=\"key\">의인화\u003c/b> 편향은 \u003cb class=\"key\">수렵 \u003c/b>\u003cb class=\"key\">채집\u003c/b> 시절 포식자를 피하기 위한 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">메커니즘\u003c/b>에서 비롯되었다.\u003c/li>\u003cli>사자가 공격할 때 상세한 \u003cb class=\"key\">구조 \u003c/b>\u003cb class=\"key\">분석\u003c/b> 없이 \u003cb class=\"key\">의도\u003c/b>를 가정하는 것이 목숨을 구했으므로, 의도가 없어도 \u003cb class=\"key\">의도\u003c/b>를 가정하는 경향이 남아 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>We tend to assume intention even where there is none because this anthropomorphic bias was a survival mechanism.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">인간은 어릴 때부터 사물과 사건에 \u003cb class=\"key\">목적\u003c/b>을 부여하고, \u003cb class=\"key\">의인화\u003c/b> 편향을 지니며, 의도가 없는데도 \u003cb class=\"key\">의도\u003c/b>를 가정한다. 이는 \u003cb class=\"key\">수렵 \u003c/b>\u003cb class=\"key\">채집\u003c/b> 시절 포식자를 피하려는 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">메커니즘\u003c/b>으로, 사자의 공격처럼 빠른 판단이 필요할 때 유리했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":54,"text":"오늘 지문을 정리하면 인간은 사물과 사건에 목적을 부여하고 의인화 편향을 지니고 있다는 거예요. 이는 진화적으로 생존에 유리했기 때문이고, 사자 예시가 그것을 잘 보여 줘요. 따라서 의도가 없는 곳에서도 의도를 가정하는 우리의 지각 편향을 이해하면 글의 논리가 선명하게 보일 거예요. 오늘 수고 많았어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
