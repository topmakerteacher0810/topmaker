  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 39번","audioDir":"39_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">39번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Canalization: How High-Dimensional Life Becomes Stable\u003c/h1>\u003ch2>운하화: 고차원적 생명은 어떻게 안정화되는가\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>생명은 \u003cb class=\"key\">고차원 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>으로 분자 간 상호작용이 엄청나게 많지만, \u003cb class=\"key\">운하화\u003c/b>를 통해 소수의 \u003cb class=\"key\">집합적인 \u003c/b>\u003cb class=\"key\">방식\u003c/b>만 나타나 안정적이다. 이러한 원리는 \u003cb class=\"key\">건강과 \u003c/b>\u003cb class=\"key\">질병\u003c/b>에도 적용되어 다양한 원인이 유사한 증상으로 발현된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Biological systems are stable because canalization narrows enormous possibilities into a few well-defined states, and this principle also explains why diseases with many causes often show strikingly similar symptoms.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 생명이 왜 안정적으로 유지되는지를 다룬 지문입니다. 이 글은 생명을 high-dimensional system으로 보고, canalization이라는 개념으로 설명하고 있어요. 먼저 요약하면, 생명은 분자 간 상호작용이 엄청나게 많지만 소수의 집합적인 방식만 나타나서 안정적입니다. 요지는 생물학적 시스템이 canalization을 통해 소수의 잘 정의된 상태로 좁혀진다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문의 핵심 개념은 \u003cb class=\"key\">고차원 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>입니다. 변수가 아주 많은 시스템은 상태가 무수히 많아 불안정해지기 쉬워요. 생물학자 Conrad Waddington은 복잡한 배아 발달이 몇 가지 \u003cb class=\"key\">조직\u003c/b>과 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">형태\u003c/b>로만 이어지는 현상을 \u003cb class=\"key\">운하화\u003c/b>라고 불렀습니다. 물리학에서는 복잡한 시스템에서 \u003cb class=\"key\">소수의 \u003c/b>\u003cb class=\"key\">집합적인 \u003c/b>\u003cb class=\"key\">방식\u003c/b>이 나타나는 것을 emergence라고 해요. 일상에 비유하면, \u003cb class=\"key\">울퉁불퉁한 \u003c/b>\u003cb class=\"key\">경관\u003c/b>에서 공이 여러 골짜기 중 하나로 굴러 내려가는 것과 같습니다. 그래서 고차원 시스템도 \u003cb class=\"key\">무작위 \u003c/b>\u003cb class=\"key\">상태\u003c/b>가 아니라 소수의 안정된 상태로만 존재하게 됩니다.\u003c/div>","segs":[{"n":2,"text":"이 지문을 이해하려면 high-dimensional system이라는 개념이 중요해요. high-dimensional system은 변수와 상호작용이 아주 많은 시스템을 뜻합니다. 세포 하나 안에서도 분자들이 서로 주고받는 상호작용이 셀 수 없이 많죠. 물리학에서는 이런 복잡한 시스템이 소수의 집합적인 양상으로 나타나는 현상을 emergence라고 해요. 생물학에서 Conrad Waddington은 배아 발달에서 가능한 결과가 극적으로 줄어드는 현상을 canalization이라고 이름 붙였습니다. 일상에 비유하면, 공이 울퉁불퉁한 지형에서 여러 골짜기 중 하나로 굴러 떨어지는 것과 같아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>불안정한 고차원 시스템\u003csmall>도입·문제 제기 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>생명은 \u003cb class=\"key\">고차원 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>으로, 단일 세포 안에서도 분자 간 \u003cb class=\"key\">상호작용\u003c/b>의 수가 \u003cb class=\"key\">막대한\u003c/b> 편이다. 이런 시스템은 가능한 상태가 너무 많으면 불안정하기 때문에, 안정성을 얻으려면 \u003cb class=\"key\">소수의 \u003c/b>\u003cb class=\"key\">집합적인 \u003c/b>\u003cb class=\"key\">방식\u003c/b>만 출현해야 한다. 즉 복잡한 고차원 시스템은 무작위 상태가 아니라 \u003cb class=\"key\">소수의 \u003c/b>\u003cb class=\"key\">잘 \u003c/b>\u003cb class=\"key\">정의된 \u003c/b>\u003cb class=\"key\">상태\u003c/b>로만 존재할 수 있다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>배아 발달의 제한된 결과\u003csmall>예시 · 문장 4\u003c/small>\u003c/h4>\u003cp>인간 \u003cb class=\"key\">배아\u003c/b>의 발달에서는 가능한 모든 형태가 나타나지 않고, \u003cb class=\"key\">제한된 \u003c/b>\u003cb class=\"key\">수의 \u003c/b>\u003cb class=\"key\">조직과 \u003c/b>\u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">형태\u003c/b>만 나온다. 이 예시는 고차원 시스템이 소수의 결과로 \u003cb class=\"key\">축소\u003c/b>된다는 원리를 보여 준다. 세포 수준의 무수한 상호작용에도 불구하고, 실제로 출현하는 결과는 \u003cb class=\"key\">몇 \u003c/b>\u003cb class=\"key\">가지\u003c/b>뿐이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>운하화와 골짜기 비유\u003csmall>비유·주장 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>이러한 \u003cb class=\"key\">극적인 \u003c/b>\u003cb class=\"key\">축소\u003c/b>를 Conrad Waddington은 \u003cb class=\"key\">운하화\u003c/b>라고 불렀다. 유기체는 \u003cb class=\"key\">소수의 \u003c/b>\u003cb class=\"key\">명확하게 \u003c/b>\u003cb class=\"key\">정의된 \u003c/b>\u003cb class=\"key\">가능한 \u003c/b>\u003cb class=\"key\">상태\u003c/b> 사이를 \u003cb class=\"key\">전환\u003c/b>할 수 있지만, 그 사이의 \u003cb class=\"key\">무작위 \u003c/b>\u003cb class=\"key\">상태\u003c/b>로는 존재할 수 없다. 이는 울퉁불퉁한 경관에서 공이 여러 \u003cb class=\"key\">골짜기\u003c/b> 중 하나로 굴러 내려가는 것과 같다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>건강과 질병에의 적용\u003csmall>적용·결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>같은 원리가 \u003cb class=\"key\">건강과 \u003c/b>\u003cb class=\"key\">질병\u003c/b>에도 적용된다. 질병의 \u003cb class=\"key\">원인\u003c/b>은 다양하지만, \u003cb class=\"key\">생리적·증상적 \u003c/b>\u003cb class=\"key\">발현\u003c/b>은 종종 \u003cb class=\"key\">놀랍도록 \u003c/b>\u003cb class=\"key\">유사하다\u003c/b>. 따라서 복잡한 생명 현상도 소수의 상태로 좁혀진다는 관점이 유용하다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장 순서에 따라 글의 흐름을 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 생명이 고차원 시스템이라는 점을 제시합니다. 단일 세포 안에서도 분자 간 상호작용의 수가 막대해요. 이런 시스템은 가능한 상태가 너무 많으면 불안정하기 때문에, 안정성을 얻으려면 소수의 집합적인 방식만 출현해야 합니다. 즉 복잡한 고차원 시스템은 무작위 상태가 아니라 소수의 잘 정의된 상태로만 존재할 수 있다는 주장이 나옵니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 인간 배아 발달을 예로 듭니다. 인간 배아에서는 가능한 모든 형태가 나타나지 않고, 제한된 수의 조직과 신체 형태만 나옵니다. 이 예시는 고차원 시스템이 소수의 결과로 축소된다는 원리를 구체적으로 보여 줘요. 세포 수준의 무수한 상호작용에도 불구하고 실제로 출현하는 결과는 몇 가지뿐입니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 이 극적인 축소를 Conrad Waddington이 canalization이라고 불렀다고 설명합니다. 유기체는 소수의 명확하게 정의된 가능한 상태 사이를 전환할 수 있지만, 그 사이의 무작위 상태로는 존재할 수 없어요. 이는 울퉁불퉁한 경관에서 공이 여러 골짜기 중 하나로 굴러 내려가는 것과 같습니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 같은 원리가 건강과 질병에도 적용된다고 말합니다. 질병의 원인은 다양하지만, 생리적이고 증상적인 발현은 종종 놀랍도록 유사해요. 따라서 복잡한 생명 현상도 소수의 상태로 좁혀진다는 관점이 유용하다는 결론으로 이어집니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 복잡한 고차원 시스템이 \u003cb class=\"key\">소수의 \u003c/b>\u003cb class=\"key\">집합적인 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 좁혀져야 \u003cb class=\"key\">안정적\u003c/b>이라는 원리를 먼저 제시한다. 이후 배아 발달이라는 \u003cb class=\"key\">예시\u003c/b>와 골짜기 \u003cb class=\"key\">비유\u003c/b>로 주장을 뒷받침하고, 건강과 질병에 \u003cb class=\"key\">적용\u003c/b>한다. 따라서 주제문은 첫 부분에 제시된 세 번째 문장이며, 나머지는 이 주장을 설명하는 두괄식 구조이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (4)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>rather as (6)\u003c/b>\u003cspan>비유\u003c/span>\u003cb>We'll see that (7)\u003c/b>\u003cspan>적용\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">high-dimensional system\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a lot going on\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">enormous possible interactions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">smaller number of collective ways of being\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">drastic narrowing of outcomes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">canalization\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">small number of well-defined possible states\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>고차원 시스템의 무작위 상태\u003c/th>\u003cth>운하화된 안정 상태\u003c/th>\u003c/tr>\u003ctr>\u003ctd>상호작용 수가 막대함\u003c/td>\u003ctd>소수의 집합적 방식만 출현\u003c/td>\u003c/tr>\u003ctr>\u003ctd>중간 무작위 상태로 존재 불가\u003c/td>\u003ctd>골짜기 바닥처럼 잘 정의된 상태로만 존재\u003c/td>\u003c/tr>\u003ctr>\u003ctd>질병의 원인은 다양함\u003c/td>\u003ctd>생리·증상 발현은 유사함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 복잡한 고차원 시스템이 소수의 안정된 상태로 좁혀진다는 주장을 먼저 제시하고, 배아 발달 예시와 골짜기 비유로 뒷받침한 뒤 건강과 질병에 적용하는 구조예요. 두괄식에 가까운 형태로, 핵심 주장은 세 번째 문장에서 안정성을 위해 소수의 집합적인 방식이 나타나야 한다는 부분입니다. 이렇게 원리와 예시, 비유, 적용이 순서대로 연결되면 독해할 때 중심 개념인 canalization을 따라가면 돼요.","hl":"ty"},{"n":9,"text":"신호어를 보면 네 번째 문장의 For example은 앞에서 제시한 원리를 구체화하는 예시 신호예요. 여섯 번째 문장의 rather as는 골짜기 비유를 이끄는 신호이고, 일곱 번째 문장의 We'll see that은 건강과 질병으로 적용을 확장하는 신호입니다. 또한 high-dimensional system과 enormous possible interactions, canalization, well-defined possible states는 같은 개념을 다르게 재진술한 표현들입니다. 이 재진술과 대조를 잡으면 글의 중심을 놓치지 않을 수 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>physicist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물리학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>high-dimensional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고차원의\u003c/span>\u003c/div>\u003cdiv>\u003cb>single cell\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단일 세포\u003c/span>\u003c/div>\u003cdiv>\u003cb>interaction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상호작용\u003c/span>\u003c/div>\u003cdiv>\u003cb>molecule\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분자\u003c/span>\u003c/div>\u003cdiv>\u003cb>enormous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>막대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>stable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>안정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>collective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>집합적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>emerge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타나다, 출현하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tissue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조직\u003c/span>\u003c/div>\u003cdiv>\u003cb>body shape\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신체 형태\u003c/span>\u003c/div>\u003cdiv>\u003cb>result from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 비롯되다\u003c/span>\u003c/div>\u003cd pan>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">enormous\u003c/b>\u003cspan class=\"m\">막대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"s\">immense\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">minute\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stable\u003c/b>\u003cspan class=\"m\">안정적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">steady\u003c/span>\u003cspan class=\"s\">unchangeable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unstable\u003c/span>\u003cspan class=\"a\">changeable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">emerge\u003c/b>\u003cspan class=\"m\">나타나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appear\u003c/span>\u003cspan class=\"s\">arise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disappear\u003c/span>\u003cspan class=\"a\">vanish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">well-defined\u003c/b>\u003cspan class=\"m\">명확하게 정의된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clear-cut\u003c/span>\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ambiguous\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">random\u003c/b>\u003cspan class=\"m\">무작위의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">arbitrary\u003c/span>\u003cspan class=\"s\">haphazard\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordered\u003c/span>\u003cspan class=\"a\">determined\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">similar\u003c/b>\u003cspan class=\"m\">유사한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alike\u003c/span>\u003cspan class=\"s\">comparable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">dissimilar\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">drastic\u003c/b>\u003cspan class=\"m\">극적인, 급격한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">extreme\u003c/span>\u003cspan class=\"s\">radical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">moderate\u003c/span>\u003cspan class=\"a\">mild\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 유의어와 반의어를 정리해 둡시다. enormous은 huge, immense, massive와 바꿔 쓸 수 있고, 반의어로 tiny, minute가 있어요. stable은 steady, unchangeable과 유사하고, 반의어는 unstable, changeable입니다. emerge는 appear, arise와 유사하고, 반의어는 disappear, vanish예요. random은 arbitrary, haphazard와 유사하고, 반의어는 ordered, determined입니다. similar는 alike, comparable과 유사하고, 반의어는 different, dissimilar예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생명은 물리학자들이 부를 수 있는 것 ‘고차원 시스템’이라고 이는 그들의 멋진 방식이다 말하는 많은 일이 발생하고 있다고\u003c/span>\u003cspan class=\"en\">Life is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">physicists \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">call\u003c/span> a 'high­dimensional system,' \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">fancy \u003c/span>\u003cspan class=\"tgt\">way\u003c/span> of saying \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">there's \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lot \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">생명은 물리학자들이 ‘고차원 시스템’이라고 부를 수 있는 것인데 이는 많은 일이 발생하고 있다고 말하는 그들의 멋진 방식이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 생명이 물리학자들 눈에는 \u003cb class=\"key\">고차원 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>, 즉 한 번에 벌어지는 일이 엄청나게 많은 복잡한 대상이라는 점을 정의하는 도입 문장이다. which 이하에서 '멋진 방식'이라고 덧붙이며 복잡성을 강조한다. 뒤에 나올 세포 속 \u003cb class=\"key\">상호작용\u003c/b> 이야기를 이끌어 내는 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what (선행사 포함)\u003c/span> : what + [주어 + 동사] = ~하는 것 : \"물리학자들이 부를 수 있는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : 선행사 + , which + [be동사 + 보어] : \"이는 그들의 멋진 방식이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">that절 (명사절 접속사)\u003c/span> : saying + [that + 완전한 절] : \"많은 일이 발생하고 있다고\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Life is, 생명은. what physicists might call, 물리학자들이 부를 수 있는 것. a 'high-dimensional system,', ‘고차원 시스템’이라고. which is their fancy way, 이는 그들의 멋진 방식이다. of saying, 말하는. that there's a lot going on, 많은 일이 발생하고 있다고. 이 문장 전체를 해석하면, 생명은 물리학자들이 ‘고차원 시스템’이라고 부를 수 있는 것인데 이는 많은 일이 발생하고 있다고 말하는 그들의 멋진 방식이다.","hl":"m"},{"n":13,"text":"이 첫 문장은 생명이 물리학자들 눈에는 고차원 시스템, 다시 말해 한꺼번에 벌어지는 일이 아주 많은 복잡한 대상이라는 것을 정의하고 있어요. which 이하에서 그걸 멋진 표현이라고 덧붙이면서 복잡하다는 느낌을 강조하죠. 그래서 다음에 나올 세포 속 분자들의 상호작용 이야기를 끌어내는 도입 역할을 해요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 what절이에요. what physicists might call에서 what은 선행사를 포함한 관계대명사라서 물리학자들이 부를 수 있는 것이라는 뜻으로 해석됩니다. 두 번째는 which인데, 앞에 콤마가 있는 계속적 용법이라서 그리고 그것은이라는 느낌으로 풀어 주는 게 자연스러워요. 세 번째는 saying 뒤의 that절입니다. 이 that은 명사절 접속사이고 saying의 목적어 자리에 완전한 절이 와서 많은 일이 발생하고 있다고라고 해석돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단 하나의 세포 내에서도\u003c/span>\u003cspan class=\"en\">In just a single cell,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능한 상호 작용의 수는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">number \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">possible \u003c/span>\u003cspan class=\"tgt\">interactions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 분자 간의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">molecules\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 크다\u003c/span>\u003cspan class=\"en\">is enormous.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">단 하나의 세포 내에서도 여러 분자 간의 가능한 상호 작용의 수는 매우 크다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단 하나의 세포 안에서도 서로 다른 분자들이 만날 수 있는 \u003cb class=\"key\">가능한 \u003c/b>\u003cb class=\"key\">상호작용\u003c/b>의 수가 엄청나게 크다는 사실을 보여 준다. 앞 문장의 '많은 일이 벌어진다'는 추상적 표현을 구체적 예로 좁혀 주는 \u003cb class=\"key\">예시\u003c/b> 문장이다. enormous가 \u003cb class=\"key\">강조\u003c/b>하는 것은 수의 폭발적 증가이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">the number of 수 일치\u003c/span> : the number of + [복수명사] + [단수동사] : \"가능한 상호 작용의 수는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : interactions + [between + 명사] : \"여러 분자 간의\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In just a single cell, 단 하나의 세포 내에서도. the number of possible interactions, 가능한 상호 작용의 수는. between different molecules, 여러 분자 간의. is enormous, 매우 크다. 이 문장 전체를 해석하면, 단 하나의 세포 내에서도 여러 분자 간의 가능한 상호 작용의 수는 매우 크다.","hl":"m"},{"n":16,"text":"두 번째 문장은 아주 구체적인 예를 하나 들어주고 있어요. 단 하나의 세포 안에서도 서로 다른 분자들이 상호작용할 수 있는 경우의 수가 엄청나게 크다는 거예요. 앞 문장에서 말한 많은 일이 벌어진다는 추상적인 표현을 세포 속 분자 세계로 좁혀서 보여 주는 예시 역할을 하죠.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 the number of possible interactions에요. the number of는 뒤에 복수 명사가 와도 수라는 단수 주어로 취급해서 동사 is가 온 거예요. a number of가 많은이라는 복수 의미인 것과 구별해야 해요. 두 번째는 between different molecules인데, 이 전치사구가 앞의 interactions를 꾸며 주는 형용사적 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 시스템은\u003c/span>\u003cspan class=\"en\">Such a system\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 안정적이기를 기대할 수 있다\u003c/span>\u003cspan class=\"en\">can only \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hope \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">stable\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 적은 수가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">smaller \u003c/span>\u003cspan class=\"tgt\">number\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">존재의 집합적인 방식의\u003c/span>\u003cspan class=\"en\">of collective ways \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">being\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나타날 때만\u003c/span>\u003cspan class=\"en\">may emerge.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 시스템은 더 적은 수의 존재의 집합적인 방식이 나타날 때만 오직 안정적이기를 기대할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 고차원 시스템이 안정적이려면 \u003cb class=\"key\">집합적 \u003c/b>\u003cb class=\"key\">방식\u003c/b>의 수가 적어야 한다는 핵심 조건을 제시한다. 'only hope', 'only a smaller number'가 반복되며 \u003cb class=\"key\">제한된 \u003c/b>\u003cb class=\"key\">수\u003c/b>의 상태만 가능함을 강조한다. 앞으로 다룰 \u003cb class=\"key\">canalization\u003c/b> 개념으로 이어지는 논리적 다리 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : hope + [to be + 보어] : \"안정적이기를 기대하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조건 부사절 (if)\u003c/span> : if + [주어 + 동사] = ~한다면 : \"오직 더 적은 수가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사의 명사적 용법 (전치사의 목적어)\u003c/span> : of + [being (동명사)] : \"존재의\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Such a system, 이러한 시스템은. can only hope to be stable, 오직 안정적이기를 기대할 수 있다. if only a smaller number, 더 적은 수가. of collective ways of being, 존재의 집합적인 방식의. may emerge, 나타날 때만. 이 문장 전체를 해석하면, 이러한 시스템은 더 적은 수의 존재의 집합적인 방식이 나타날 때만 오직 안정적이기를 기대할 수 있다.","hl":"m"},{"n":19,"text":"세 번째 문장은 이제 핵심 원리를 말해요. 고차원 시스템이 안정적이려면 가능한 상태, 그러니까 존재의 집합적 방식이 더 적은 수로 나타나야만 한다는 겁니다. only가 반복되면서 제한된 수의 상태만 가능하다는 점을 정확하게 강조하고 있어요. 이 논리가 다음에 나오는 canalization 개념으로 이어져요.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 hope to be stable이에요. hope는 to부정사를 목적어로 취하는 대표 동사라서 안정적이기를 기대하다로 해석하면 됩니다. 두 번째는 if only a smaller number인데, if가 이끄는 조건 부사절이 주절 뒤에서 오직 더 적은 수가 나타날 때만이라는 조건을 걸어 주고 있어요. 세 번째는 of being입니다. 전치사 of의 목적어 자리라서 동사 being에 ing를 붙인 동명사가 와서 존재의 방식이라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 제한된 수의 조직과 신체 형태만이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">limited \u003c/span>\u003cspan class=\"tgt\">number \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">tissues \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">body \u003c/span>\u003cspan class=\"tgt\">shapes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결과로 나올 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">result \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간 배아의 발달로부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">from\u003c/span> the development of a human embryo.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어 인간 배아의 발달로부터 나올 수 있는 것은 오직 제한된 수의 조직과 신체 형태이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 말한 '더 적은 수의 집합적인 방식만이 나타난다'는 원리를 뒷받침하는 예시입니다. 인간 배아가 발달할 때 나올 수 있는 결과는 \u003cb class=\"key\">제한된 \u003c/b>\u003cb class=\"key\">수\u003c/b>의 조직과 신체 형태뿐이라는 점을 보여 줍니다. 여기서 \u003cb class=\"key\">it \u003c/b>\u003cb class=\"key\">is \u003c/b>\u003cb class=\"key\">~ \u003c/b>\u003cb class=\"key\">that\u003c/b> 강조구문이 '오직 제한된 수'라는 한정을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">it is ~ that 강조구문\u003c/span> : It is + [강조할 대상] + that + [나머지 절] : \"오직 제한된 수의 조직과 신체 형태만이 결과로 나올 수 있는 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 may + 동사구 result from\u003c/span> : may + [동사원형] + from + [명사구] : \"~로부터 생길 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"For example, 예를 들어. it is only a limited number of tissues and body shapes, 오직 제한된 수의 조직과 신체 형태만이. that may result, 결과로 나올 수 있는. from the development of a human embryo, 인간 배아의 발달로부터. 이 문장 전체를 해석하면, 예를 들어 인간 배아의 발달로부터 나올 수 있는 것은 오직 제한된 수의 조직과 신체 형태이다.","hl":"m"},{"n":22,"text":"네 번째 문장은 앞 문장의 원리를 뒷받침하는 예시예요. 인간 배아의 발달에서는 무한한 결과가 아니라 제한된 수의 조직과 신체 형태만 나올 수 있다는 거죠. 이 문장은 it is that 강조구문을 써서 오직 제한된 수라는 점을 강조하고 있어요.","hl":"mn"},{"n":23,"text":"첫 번째로, it is only a limited number of tissues and body shapes that may result는 it is that 강조구문이에요. It is와 that 사이에 강조할 주어를 넣어 바로 이 주어가 결과로 나올 수 있다는 뜻을 강조합니다. 두 번째로, may result from은 조동사 may가 가능성을 나타내고 result from이 어디서 비롯되는지를 말해 줘요. 그래서 인간 배아의 발달로부터 생길 수 있다는 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1942년에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">1942,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생물학자 Conrad Waddington은\u003c/span>\u003cspan class=\"en\">the biologist Conrad Waddington\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 극적인 결과의 축소를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">drastic \u003c/span>\u003cspan class=\"tgt\">narrowing \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">outcomes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운하화라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">canalization\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1942년에 생물학자 Conrad Waddington은 이러한 극적인 결과의 축소를 ‘운하화’라고 불렀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 예로 든 발생 과정의 결과 축소 현상에 \u003cb class=\"key\">canalization\u003c/b>이라는 용어를 부여합니다. Conrad Waddington이 1942년에 \u003cb class=\"key\">drastic \u003c/b>\u003cb class=\"key\">narrowing \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">outcomes\u003c/b>을 운하화라고 이름 붙였다는 것입니다. 이 용어는 이 단락의 핵심 개념으로, 이후 건강과 질병의 논의까지 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법\u003c/span> : 전치사구 + [주절] : \"1942년에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">call + 목적어 + 목적격 보어\u003c/span> : call + [목적어] + [목적격 보어(명사)] : \"이 극적인 결과의 축소를 운하화라고 불렀다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In 1942, 1942년에. the biologist Conrad Waddington, 생물학자 Conrad Waddington은. called this drastic narrowing of outcomes, 이 극적인 결과의 축소를. canalization, 운하화라고. 이 문장 전체를 해석하면, 1942년에 생물학자 Conrad Waddington은 이러한 극적인 결과의 축소를 ‘운하화’라고 불렀다.","hl":"m"},{"n":25,"text":"다섯 번째 문장은 앞선 현상에 이름을 붙여 주는 문장이에요. Conrad Waddington이 결과가 극적으로 줄어드는 현상을 canalization 운하화라고 불렀습니다. 이 용어는 이 단락의 핵심 개념이에요.","hl":"mn"},{"n":26,"text":"첫 번째로, called this drastic narrowing of outcomes canalization는 call이 목적어와 목적격 보어를 취하는 오형식 구조예요. this drastic narrowing of outcomes를 canalization이라고 부른다는 뜻이 되죠. 두 번째로, In 1942는 문장 앞에서 시간을 나타내는 전치사구예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유기체는 적은 수의 명확하게 정의된 가능한 상태 사이에서 바뀔 수 있지만 하지만 그것들 사이에 있는 무작위의 상태로 존재할 수는 없다 오히려 울퉁불퉁한 경관에 있는 공이 이 계곡 혹은 또 다른 계곡의 바닥으로 반드시 굴러가야 하는 것처럼\u003c/span>\u003cspan class=\"en\">The organism \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">switch\u003c/span> between a small number of well­defined possible states, but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can't \u003c/span>\u003cspan class=\"tgt\">exist\u003c/span> in random states in between them, rather as a ball in a rough landscape \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">roll\u003c/span> to the bottom of \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">valley \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">another\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오히려 울퉁불퉁한 경관에 있는 공이 이 계곡 혹은 또 다른 계곡의 바닥으로 반드시 굴러가야 하는 것처럼, 유기체는 적은 수의 명확하게 정의된 가능한 상태 사이에서 바뀔 수 있지만 그것들 사이에 있는 무작위의 상태로 존재할 수는 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 유기체의 상태를 \u003cb class=\"key\">울퉁불퉁한 \u003c/b>\u003cb class=\"key\">경관의 \u003c/b>\u003cb class=\"key\">공\u003c/b>에 비유하며 canalization을 설명합니다. 유기체는 명확하게 정의된 소수의 상태 사이에서만 전환될 수 있고, 그 사이의 무작위적인 중간 상태에는 머물 수 없습니다. 공이 계곡 바닥으로 굴러가듯 가능한 결과가 한정된다는 \u003cb class=\"key\">canalization\u003c/b>의 원리를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may의 가능성\u003c/span> : may + [동사원형] : \"바뀔 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can의 부정형\u003c/span> : cannot/can't + [동사원형] : \"존재할 수 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 must의 필연\u003c/span> : must + [동사원형] : \"반드시 굴러가야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">one or another 관용 표현\u003c/span> : one + [명사] + or another : \"이 계곡 혹은 또 다른 계곡\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The organism may switch between a small number of well-defined possible states, 유기체는 적은 수의 명확하게 정의된 가능한 상태 사이에서 바뀔 수 있지만. but can't exist in random states in between them, 하지만 그것들 사이에 있는 무작위의 상태로 존재할 수는 없다. rather as a ball in a rough landscape, 오히려 울퉁불퉁한 경관에 있는 공이. must roll to the bottom of one valley or another, 이 계곡 혹은 또 다른 계곡의 바닥으로 반드시 굴러가야 하는 것처럼. 이 문장 전체를 해석하면, 오히려 울퉁불퉁한 경관에 있는 공이 이 계곡 혹은 또 다른 계곡의 바닥으로 반드시 굴러가야 하는 것처럼, 유기체는 적은 수의 명확하게 정의된 가능한 상태 사이에서 바뀔 수 있지만 그것들 사이에 있는 무작위의 상태로 존재할 수는 없다.","hl":"m"},{"n":28,"text":"여섯 번째 문장은 유기체의 상태를 울퉁불퉁한 경관에 놓인 공에 비유해요. 유기체는 명확하게 정의된 몇 가지 상태 사이만 오갈 수 있고 중간 상태에는 있을 수 없죠. 공이 계곡 바닥으로 굴러가듯 가능한 결과가 한정된다는 canalization의 원리를 보여 줍니다.","hl":"mn"},{"n":29,"text":"첫 번째로, may switch에서 may는 가능성을 나타내는 조동사예요. 두 번째로, can't exist에서 can't는 can의 부정으로 존재할 수 없다는 불가능을 말해 줘요. 세 번째로, must roll에서 must는 반드시 그렇게 된다는 필연을 나타내요. 마지막으로 one valley or another는 하나의 계곡 또는 또 다른 계곡이라는 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 알게 될 것이다\u003c/span>\u003cspan class=\"en\">We'll see\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이 사실이라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">true \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 건강과 질병에도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">health \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">disease\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">질병의 많은 원인이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">causes \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">illness\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그것들의 발현은\u003c/span>\u003cspan class=\"en\">but their manifestations\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생리적이고 증상적인 수준에서\u003c/span>\u003cspan class=\"en\">at the physiological and symptomatic levels\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 놀랍도록 유사하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">strikingly \u003c/span>\u003cspan class=\"tgt\">similar\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 이것이 건강과 질병에도 적용된다는 것을 알게 될 것이다. 즉 질병의 많은 원인이 있지만, 그것들의 생리적이고 증상적인 수준에서의 발현은 종종 놀랍도록 유사하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 말한 \u003cb class=\"key\">운하화\u003c/b> 개념을 건강과 질병의 영역으로 확장하는 결론입니다. 질병을 일으키는 원인은 여러 가지여도 실제 생리적·증상적으로 나타나는 모습은 소수의 안정된 상태로 좁혀진다는 뜻입니다. 즉 \u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">원인, \u003c/b>\u003cb class=\"key\">적은 \u003c/b>\u003cb class=\"key\">발현\u003c/b>이라는 패턴이 질병에서도 나타난다는 핵심 주장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that 명사절 (동사 see의 목적어)\u003c/span> : We'll see + [that + 완전한 절] : \"이것이 건강과 질병에도 적용된다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">There are + 복수 주어 (존재 구문)\u003c/span> : There are + 복수 명사구 : \"많은 원인이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be동사 + 부사 + 형용사 보어 (2형식)\u003c/span> : are + often(빈도 부사) + strikingly(강조 부사) + similar(형용사 보어) : \"종종 놀랍도록 유사하다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"We'll see, 우리는 알게 될 것이다. that this is true, 이것이 사실이라는 것을. also of health and disease, 또한 건강과 질병에도. there are many causes of illness, 질병의 많은 원인이 있다. but their manifestations, 그러나 그것들의 발현은. at the physiological and symptomatic levels, 생리적이고 증상적인 수준에서. are often strikingly similar, 종종 놀랍도록 유사하다. 이 문장 전체를 해석하면, 우리는 이것이 건강과 질병에도 적용된다는 것을 알게 될 것이다. 즉 질병의 많은 원인이 있지만, 그것들의 생리적이고 증상적인 수준에서의 발현은 종종 놀랍도록 유사하다.","hl":"m"},{"n":31,"text":"이 문장은 앞서 말한 운하화 개념을 건강과 질병에 적용하는 결론이에요. 병의 원인은 여러 가지여도 실제로 나타나는 증상은 몇 가지 비슷한 상태로 좁혀진다는 뜻이죠. 그래서 질병에서도 많은 원인, 적은 발현이라는 패턴이 나타난다고 정리하면 됩니다.","hl":"mn"},{"n":32,"text":"첫 번째, that this is true also of health and disease에서 that은 명사절 접속사예요. 동사 see의 목적어 자리에 완전한 절을 이끌고서 이것이 건강과 질병에도 적용된다는 것을 이라는 뜻을 만들어요. 두 번째, there are many causes of illness는 존재 구문이에요. There are 뒤에 복수 명사 many causes가 진짜 주어로 와서 많은 원인이 있다고 해석해요. 세 번째, are often strikingly similar는 be동사 뒤에 형용사 similar가 주격 보어로 쓰였고 often과 strikingly는 부사로 similar를 꾸며 줘요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>생명은 분자 간 상호작용이 막대한 \u003cb class=\"key\">고차원 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>이다.\u003c/li>\u003cli>안정성을 얻으려면 \u003cb class=\"key\">소수의 \u003c/b>\u003cb class=\"key\">집합적인 \u003c/b>\u003cb class=\"key\">방식\u003c/b>만 출현해야 한다.\u003c/li>\u003cli>인간 배아 발달에서 나타나는 \u003cb class=\"key\">운하화\u003c/b>는 가능한 결과를 극적으로 축소한다.\u003c/li>\u003cli>\u003cb class=\"key\">건강과 \u003c/b>\u003cb class=\"key\">질병\u003c/b>에서도 다양한 원인이 유사한 증상으로 발현된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Biological systems are stable because canalization narrows enormous possibilities into a few well-defined states, and this principle also explains why diseases with many causes often show strikingly similar symptoms.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">생명은 \u003cb class=\"key\">고차원 \u003c/b>\u003cb class=\"key\">시스템\u003c/b>으로 분자 간 상호작용이 엄청나게 많지만, \u003cb class=\"key\">운하화\u003c/b>를 통해 소수의 \u003cb class=\"key\">집합적인 \u003c/b>\u003cb class=\"key\">방식\u003c/b>만 나타나 안정적이다. 이러한 원리는 \u003cb class=\"key\">건강과 \u003c/b>\u003cb class=\"key\">질병\u003c/b>에도 적용되어 다양한 원인이 유사한 증상으로 발현된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글은 생명이 무수히 많은 가능성을 가진 고차원 시스템이지만 실제로는 소수의 안정된 상태만 나타난다는 점을 canalization으로 설명했어요. 이 원리는 건강과 질병에도 적용되어 다양한 원인이 비슷한 증상으로 이어지는 이유를 이해하게 해 줍니다. 고차원 시스템과 canalization, 소수의 잘 정의된 상태라는 표현을 잘 기억해 두면 다음에 비슷한 과학 지문에서도 바로 적용할 수 있을 거예요. 오늘 강의는 여기까지입니다. 수고 많았어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
