}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 33번","audioDir":"33_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">33번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Why Consumer Goods Often Come in Three Versions\u003c/h1>\u003ch2>소비 상품에 세 가지 버전이 많은 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>기업이 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">버전\u003c/b>만 만들면 수입을 잃고 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">버전\u003c/b>에서는 저렴한 모델이 선택되지만, \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">고가 \u003c/b>\u003cb class=\"key\">모델\u003c/b>을 추가하면 소비자가 중간 제품을 선택하게 된다. 결국 소비자는 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">비싼 \u003c/b>\u003cb class=\"key\">가격의 \u003c/b>\u003cb class=\"key\">제품의 \u003c/b>\u003cb class=\"key\">존재\u003c/b>에 \u003cb class=\"key\">조종\u003c/b>된 줄 모른 채 중간 제품을 산다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A third, higher-priced model is introduced to make the middle option look more attractive, so consumers buy it unaware that they are being manipulated.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 소비 상품에 왜 세 가지 버전이 많은지에 대한 이야기입니다. 전자 회사에서 프린터를 생산한 저자가 가격과 기능에 따른 소비자 선택을 분석한 글인데요. 한마디로 요약하면 세 번째로 비싼 모델이 중간 제품의 판매를 올리는 심리적 장치라는 뜻입니다. 요지는 고가의 선택지가 소비자를 중간 선택으로 유도한다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">여러분이 평소에 사는 상품에는 보급형, 중간형, 고급형처럼 세 가지 버전이 많은데, 여기에는 \u003cb class=\"key\">디코이 \u003c/b>\u003cb class=\"key\">효과\u003c/b>(decoy effect)라는 심리 전략이 숨어 있습니다. 제품의 가격과 기능을 절대적으로 보지 않고 상대적으로 \u003cb class=\"key\">비교\u003c/b>하기 때문에 고급 모델이 기준점이 되는 \u003cb class=\"key\">앵커링\u003c/b>(anchoring)이 작동해요. 일상에 비유하면 영화관에서 작은 팝콘보다 조금 비싼 중간 팝콘을 고르게 만드는 것과 같습니다. 기업은 이런 소비자 심리를 이용해 수입을 늘리려고 해요.\u003c/div>","segs":[{"n":2,"text":"여러분, 우리 주변에는 보급형, 중간형, 고급형처럼 선택지가 세 가지로 나뉘어 있는 상품이 많죠. 마케팅에서는 비싼 선택지를 일부러 넣어서 중간 선택지를 돋보이게 하는 전략을 decoy effect, 우리말로는 디코이 효과라고 합니다. 사람은 절대적인 가치보다 상대적인 비교에 약해서, 고급 모델이 기준점이 되면 중간 모델이 합리적으로 보이는 anchoring 현상이 나타나요. 일상에 비유하면 영화관에서 작은 팝콘과 큰 팝콘 사이에 중간 팝콘을 넣으면 중간 팝콘이 잘 팔리는 것과 같아요. 기업은 이러한 소비자 심리를 활용해서 수입을 늘리려고 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입: 세 가지 버전의 발견\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>저자는 전자 회사에서 프린터를 만들다가 \u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">상품\u003c/b>에 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">버전\u003c/b>이 많은 이유를 발견합니다. 이 문장은 글의 화제를 제시하는 도입입니다. 앞으로 나올 설명의 배경이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>한 가지와 두 가지 버전의 문제\u003csmall>문제 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>생산자가 제품을 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">버전\u003c/b>만 만들면 더 낼 의사가 있는 소비자 때문에 \u003cb class=\"key\">수입\u003c/b>을 잃게 됩니다. \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">버전\u003c/b>을 제공해도 사람들은 두 모델을 비교하고 여전히 덜 비싼 모델을 선택합니다. 회사는 더 비싼 모델을 팔 기회를 놓치게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>세 번째 모델의 효과\u003csmall>전환 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>그런데 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">모델\u003c/b>을 내놓으면 상황이 바뀝니다. 가장 비싼 모델의 기능을 좋아하지만 가격은 부담스러워하는 사람들이 \u003cb class=\"key\">중간 \u003c/b>\u003cb class=\"key\">제품\u003c/b>을 사게 됩니다. 결국 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">모델\u003c/b>의 판매가 증가하고, 중간 제품은 가장 저렴한 제품보다 기능이 많고 가장 고급 모델보다 덜 비쌉니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>중간 제품을 사는 이유\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>소비자는 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">비싼 \u003c/b>\u003cb class=\"key\">가격의 \u003c/b>\u003cb class=\"key\">제품의 \u003c/b>\u003cb class=\"key\">존재\u003c/b>에 의해 \u003cb class=\"key\">조종\u003c/b>된 사실을 알지 못한 채 \u003cb class=\"key\">중간 \u003c/b>\u003cb class=\"key\">제품\u003c/b>을 구입합니다. 이는 기업이 일부러 고가 모델을 배치해 중간 모델을 팔리게 한 것입니다. 글은 소비자 선택의 심리적 함정을 지적합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 선택지의 수가 하나에서 둘, 셋으로 늘어날 때 소비자의 선택이 어떻게 달라지는지를 차례대로 보여 줍니다.","hl":null},{"n":4,"text":"첫 번째 문장에서 저자는 레이저와 잉크젯 프린터를 생산하는 전자 회사에서 일하면서 소비 상품에 세 가지 버전이 종종 있는 이유를 발견했다고 말합니다. 이 부분은 글의 도입으로 앞으로 전개할 문제의 배경을 제시해 주죠. 여기서 세 가지 버전이라는 표현을 기억해 두세요.","hl":"f0"},{"n":5,"text":"두 번째 문장과 세 번째 문장에서는 한 가지 버전과 두 가지 버전의 한계를 설명합니다. 제품을 한 가지 버전만 만들면 더 비싸게 살 의사가 있는 소비자를 놓쳐서 수입을 잃게 되죠. 두 가지 버전을 내놓아도 사람들은 두 모델을 비교한 뒤 덜 비싼 쪽을 선택해요. 결국 기업은 더 비싼 모델을 팔 기회를 놓치게 됩니다.","hl":"f1"},{"n":6,"text":"네 번째 문장과 다섯 번째 문장이 이 글의 핵심입니다. 회사가 세 번째 모델을 추가하면 두 번째 모델의 판매가 올라가는데요. 많은 사람이 가장 비싼 모델의 기능은 좋아하지만 가격을 부담스러워해서 중간 제품을 선택하게 됩니다. 중간 제품은 가장 저렴한 것보다 기능이 많고 가장 고급 모델보다는 덜 비싸서 타협점처럼 보이는 거죠.","hl":"f2"},{"n":7,"text":"마지막 문장은 결론입니다. 소비자는 더 비싼 가격의 제품이 존재한다는 사실 때문에 조종되었다는 것을 모른 채 중간 제품을 구입해요. 기업 입장에서는 가장 비싼 모델을 직접 팔지 못해도 그 모델이 중간 제품을 팔리게 하는 미끼 역할을 하는 셈이죠. 이렇게 소비자 심리를 이용한 판매 전략이 글의 핵심입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 저자가 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">버전\u003c/b>이 존재하는 이유를 궁금해하며 주제를 제시합니다. 이후 문장들은 if 조건을 이용해 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">버전\u003c/b>, \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">버전\u003c/b>, \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">모델\u003c/b>로 이어지는 \u003cb class=\"key\">인과\u003c/b> 관계를 보여 줍니다. 결국 마지막 문장에서 소비자가 \u003cb class=\"key\">조종\u003c/b>된다는 결과로 수렴합니다. 따라서 글 전체는 첫 문장에 주제를 두고 나머지가 이를 설명하는 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>If (2)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>If (3)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>But (4)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>unaware (6)\u003c/b>\u003cspan>결과·심리 상태\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">three versions of many consumer goods\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">one version of its product\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">two versions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">two models\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a third model\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the second model\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the middle item\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the higher-priced item\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>세 번째 모델 도입 전\u003c/th>\u003cth>세 번째 모델 도입 후\u003c/th>\u003c/tr>\u003ctr>\u003ctd>한 가지 버전은 지불 의사를 놓쳐 수입 손실\u003c/td>\u003ctd>고가 모델 추가로 중간 모델 판매 증가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>두 가지 버전은 저렴한 모델만 선택됨\u003c/td>\u003ctd>중간 제품이 합리적 선택으로 보임\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전개 방식으로 볼 때 인과 구조입니다. 선택지의 수를 늘린 원인이 판매 변화라는 결과를 낳는 흐름이 반복되거든요. 첫 문장에서 세 가지 버전이 존재하는 이유를 묻는 주제를 제시하고 나머지 문장에서 그 이유를 설명하므로 두괄식 구조라고 할 수 있어요. 따라서 첫 번째 문장이 주제문이고 이후 문장들은 모두 주제를 뒷받침하는 설명입니다.","hl":"ty"},{"n":9,"text":"이 지문에는 If가 두 번 나오면서 조건을 제시하고, But이 두 번째 문장 이후의 흐름을 전환합니다. 문장 사이에 If와 But이 반복되면서 한 가지 버전, 두 가지 버전, 세 번째 모델이라는 표현이 three versions, one version, two versions, a third model, the middle item, the higher-priced item으로 계속 바뀌어 나와요. 이렇게 같은 개념을 재진술하는 표현을 따라가면 선택지 수의 변화가 핵심임을 알 수 있죠. 마지막 문장의 unaware는 소비자의 심리 상태를 결과로 보여 주는 신호어입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>work for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>manufacture\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>consumer goods\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소비 상품\u003c/span>\u003c/div>\u003cdiv>\u003cb>version\u003c/b>\u003cem>명사\u003c/em>\u003cspan>버전, 형태\u003c/span>\u003c/div>\u003cdiv>\u003cb>manufacturer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생산자, 제조업체\u003c/span>\u003c/div>\u003cdiv>\u003cb>be willing to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기꺼이 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잃다\u003c/span>\u003c/div>\u003cdiv>\u003cb>income\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수입\u003c/span>\u003c/div>\u003cdiv>\u003cb>offer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>feature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기능\u003c/span>\u003c/div>\u003cdiv>\u003cb>expensive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비싼\u003c/span>\u003c/div>\u003cdiv>\u003cb>compare\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비교하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>model\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모델, 제품\u003c/span>\u003c/div>\u003cdiv>\u003cb>less expensive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>덜 비싼\u003c/span>\u003c/div>\u003cdiv>\u003cb>introduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>출시하다, 소개하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>even\u003c/b>\u003cem>부사\u003c/em>\u003cspan>훨씬, 더욱\u003c/span>\u003c/div>\u003cdiv>\u003cb>sales\u003c/b>\u003cem>명사\u003c/em>\u003cspan>판매\u003c/span>\u003c/div>\u003cdiv>\u003cb>go up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>증가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>price\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가격\u003c/span>\u003c/div>\u003cdiv>\u003cb>middle\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중간의\u003c/span>\u003c/div>\u003cdiv>\u003cb>item\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제품, 물건\u003c/span>\u003c/div>\u003cdiv>\u003cb>least\u003c/b>\u003cem>부사\u003c/em>\u003cspan>가장 적게\u003c/span>\u003c/div>\u003cdiv>\u003cb>fancy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고급의\u003c/span>\u003c/div>\u003cdiv>\u003cb>unaware\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>알지 못하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>manipulate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조종하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>presence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>존재\u003c/span>\u003c/div>\u003cdiv>\u003cb>higher-priced\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 비싼 가격의\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이제 중요한 어휘를 짚어 볼게요. consumer goods는 소비 상품이라는 뜻이고 version은 버전이나 형태입니다. manufacturer는 생산자, feature는 기능, less expensive는 덜 비싼, introduce는 출시하다라는 뜻으로 쓰였어요. sales go up은 판매가 증가하다, manipulate는 조종하다, presence는 존재입니다. 이 단어들은 문제에서 어휘 문제로 자주 출제되니까 정리해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">discover\u003c/b>\u003cspan class=\"m\">발견하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">find\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">offer\u003c/b>\u003cspan class=\"m\">제공하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">provide\u003c/span>\u003cspan class=\"s\">present\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">introduce\u003c/b>\u003cspan class=\"m\">출시하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">launch\u003c/span>\u003cspan class=\"s\">release\u003c/span>\u003cspan class=\"s\">present\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">withdraw\u003c/span>\u003cspan class=\"a\">remove\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expensive\u003c/b>\u003cspan class=\"m\">비싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">costly\u003c/span>\u003cspan class=\"s\">pricey\u003c/span>\u003cspan class=\"s\">overpriced\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cheap\u003c/span>\u003cspan class=\"a\">inexpensive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">manipulate\u003c/b>\u003cspan class=\"m\">조종하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">control\u003c/span>\u003cspan class=\"s\">influence\u003c/span>\u003cspan class=\"s\">exploit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">liberate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unaware\u003c/b>\u003cspan class=\"m\">알지 못하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ignorant\u003c/span>\u003cspan class=\"s\">oblivious\u003c/span>\u003cspan class=\"s\">unconscious\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">aware\u003c/span>\u003cspan class=\"a\">conscious\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">presence\u003c/b>\u003cspan class=\"m\">존재\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">existence\u003c/span>\u003cspan class=\"s\">appearance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">absence\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">feature\u003c/b>\u003cspan class=\"m\">기능, 특징\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">characteristic\u003c/span>\u003cspan class=\"s\">attribute\u003c/span>\u003cspan class=\"s\">function\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">defect\u003c/span>\u003cspan class=\"a\">flaw\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 잘 나오는 핵심 어휘의 동의어와 반의어도 함께 봅시다. discover는 find나 notice와 비슷하고 overlook이나 miss와 반대입니다. introduce는 launch나 release와 비슷하고 withdraw와 반대예요. expensive는 costly, pricey와 비슷하고 cheap, inexpensive와 반대입니다. manipulate는 control, influence와 비슷하고 liberate와 반대의 느낌이 있어요. unaware는 ignorant, oblivious와 비슷하고 aware, conscious와 반대입니다. presence는 existence와 비슷하고 absence와 반대이죠. 이 묶음들을 소리 내어 읽으며 정리하면 기억에 오래 남을 거예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 큰 전자 회사에서 일했을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">worked \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">large \u003c/span>\u003cspan class=\"tgt\">electronics \u003c/span>\u003cspan class=\"tgt\">company\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">레이저와 잉크젯 프린터를 생산했던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">manufactured \u003c/span>\u003cspan class=\"tgt\">laser \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">ink­jet \u003c/span>\u003cspan class=\"tgt\">printers\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 곧 발견했다\u003c/span>\u003cspan class=\"en\">I soon discovered\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 종종 세 가지 버전이 있는지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">versions \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 소비 상품의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">consumer \u003c/span>\u003cspan class=\"tgt\">goods\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 레이저와 잉크젯 프린터를 생산했던 큰 전자 회사에서 일했을 때 나는 많은 소비 상품의 세 가지 버전이 종종 있는 이유를 곧 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 회사에서 프린터를 생산하며 일한 경험을 바탕으로, 소비재에 세 가지 버전이 자주 등장하는 이유를 \u003cb class=\"key\">발견\u003c/b>하게 된 배경을 제시하는 문장이다. 글 전체의 도입부로, 뒤에 전개될 세 가지 버전의 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">전략\u003c/b>에 대한 호기심을 불러일으킨다. 'that manufactured...'는 회사를 꾸며 주는 관계절이고, 'why...'는 discovered의 \u003cb class=\"key\">목적어\u003c/b>로 쓰인 간접의문문이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 부사절 (when)\u003c/span> : When + S + V..., S + V... : \"내가 큰 전자 회사에서 일했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 [a large electronics company] + that + V... : \"레이저와 잉크젯 프린터를 생산했던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사 why)\u003c/span> : discover + [why + S + V...] : \"왜 종종 세 가지 버전이 있는지를\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"When I worked for a large electronics company, 내가 큰 전자 회사에서 일했을 때. that manufactured laser and ink­jet printers, 레이저와 잉크젯 프린터를 생산했던. I soon discovered, 나는 곧 발견했다. why there are often three versions, 왜 종종 세 가지 버전이 있는지를. of many consumer goods, 많은 소비 상품의. 이 문장 전체를 해석하면, 내가 레이저와 잉크젯 프린터를 생산했던 큰 전자 회사에서 일했을 때 나는 많은 소비 상품의 세 가지 버전이 종종 있는 이유를 곧 발견했다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 저자가 레이저와 잉크젯 프린터를 만드는 큰 전자 회사에 다니면서 많은 소비재에 세 가지 버전이 있는 이유를 알게 된 배경을 설명해요. 여기서는 글 전체에서 다룰 세 가지 버전 전략의 실마리를 던져 주는 도입부 역할을 해요. that 절은 회사를 꾸며 주고 why 절은 discovered의 목적어로 쓰인 간접의문문이라는 점도 기억해 두세요.","hl":"mn"},{"n":14,"text":"어법 포인트를 짚어 볼게요. 첫 번째, when이 이끄는 시간 부사절이에요. When I worked for a large electronics company는 내가 큰 전자 회사에서 일했을 때라는 뜻으로, 주절의 시점을 알려 줘요. 두 번째, that manufactured laser and ink-jet printers는 주격 관계대명사 that이 앞의 company를 꾸며 주는 관계절이에요. 세 번째, why there are often three versions of many consumer goods는 discovered의 목적어로 쓰인 간접의문문이에요. 의문사 why 뒤에 주어와 동사가 평서문 어순으로 오는 것이 포인트예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 생산자가 오직 한 가지 버전만 만든다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">manufacturer \u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">version \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 제품의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">product\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 구매했던 사람들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">bought \u003c/span>\u003cspan 과거분사 (과거 추측)\u003c/span> : might + have + p.p. + to부정사 : \"기꺼이 더 많은 돈을 쓰려고 했을 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">결과를 나타내는 등위접속사 so\u003c/span> : S + V..., so + S + V... : \"그래서 회사는 일부 수입을 잃고 있다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"If the manufacturer makes only one version, 만약 생산자가 오직 한 가지 버전만 만든다면. of its product, 그 제품의. people who bought it, 그것을 구매했던 사람들은. might have been willing to spend more money, 기꺼이 더 많은 돈을 쓰려고 했을 수도 있다. so the company is losing some income, 그래서 회사는 일부 수입을 잃고 있다. 이 문장 전체를 해석하면, 만약 생산자가 그 제품의 오직 한 가지 버전만 만든다면 그것을 구매했던 사람들은 기꺼이 더 많은 돈을 쓰려고 했을 수도 있어서 회사는 일부 수입을 잃을 것이다.","hl":"m"},{"n":16,"text":"두 번째 문장은 생산자가 제품을 한 가지 버전으로만 만들면 더 비싼 가격에도 살 의향이 있는 소비자를 놓쳐서 회사가 수입 일부를 잃게 된다는 뜻이에요. 기꺼이 더 많은 돈을 쓰려고 했을 수도 있는 사람들이 있었다는 과거의 가능성을 might have been willing to spend more money로 나타내요. 이 문장은 여러 버전을 만드는 이유가 바로 이 잃는 수입을 막기 위해서라는 점을 말해 줘요.","hl":"mn"},{"n":17,"text":"어법 포인트를 순서대로 짚어 볼게요. 첫 번째, if가 이끄는 조건 부사절이에요. If the manufacturer makes only one version of its product는 만약 생산자가 그 제품의 오직 한 가지 버전만 만든다면이라는 조건 상황을 나타내요. 두 번째, people who bought it에서 who는 주격 관계대명사로 people을 꾸며 줘요. 세 번째, might have been willing to spend more money는 과거에 더 많은 돈을 기꺼이 쓰려고 했을 수도 있다는 추측을 나타내는 표현이에요. 네 번째, so는 앞 내용의 결과로 회사가 일부 수입을 잃고 있다는 것을 연결해 주는 등위접속사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 회사가 두 가지 버전을 제공한다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">company \u003c/span>\u003cspan class=\"tgt\">offers \u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">versions\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나는 더 많은 기능을 가진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">features \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다른 것보다 더 비싸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">expensive \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 두 모델을 비교할 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">compare \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">models\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 여전히 덜 비싼 것을 살 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">still \u003c/span>\u003cspan class=\"tgt\">buy \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">expensive \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 그 회사가 두 버전을 제공하는데 한 버전이 나머지보다 더 많은 기능과 더 비싼 가격을 가진다면, 사람들은 두 모델을 비교하고 여전히 덜 비싼 것을 살 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 가지 버전을 내놓아도 소비자는 두 모델을 비교한 뒤 결국 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">저렴한\u003c/b> 것을 선택한다는 내용이다. 기능보다 \u003cb class=\"key\">가격\u003c/b>이 구매 결정에 더 크게 작용함을 보여 준다. 따라서 두 가지 버전으로는 두 번째 모델의 판매를 늘리기 어렵고, 세 번째 모델이 필요한 이유를 암시한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 (if)\u003c/span> : If + S + V..., S + V... : \"만약 회사가 두 가지 버전을 제공한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 and 등위접속사\u003c/span> : one + [with more N] and [more expensive than the other] : \"하나는 더 많은 기능을 가지고 다른 것보다 더 비싼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">미래 시제 will\u003c/span> : S + will + 동사원형... : \"사람들은 두 모델을 비교할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">등위접속사 and + 비교급\u003c/span> : and + V + the less expensive one : \"그리고 여전히 덜 비싼 것을 살 것이다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"If the company offers two versions, 만약 회사가 두 가지 버전을 제공한다면. one with more features, 하나는 더 많은 기능을 가진. and more expensive than the other, 그리고 다른 것보다 더 비싸다. people will compare the two models, 사람들은 두 모델을 비교할 것이다. and still buy the less expensive one, 그리고 여전히 덜 비싼 것을 살 것이다. 이 문장 전체를 해석하면, 만약 그 회사가 두 버전을 제공하는데 한 버전이 나머지보다 더 많은 기능과 더 비싼 가격을 가진다면, 사람들은 두 모델을 비교하고 여전히 덜 비싼 것을 살 것이다.","hl":"m"},{"n":19,"text":"세 번째 문장은 회사가 두 가지 버전을 내놓으면 사람들이 두 모델을 비교하고 결국 덜 비싼 것을 산다는 뜻이에요. 기능이 더 많고 비싼 모델이 있어도 소비자는 가격을 중요하게 생각해서 더 싼 쪽을 선택해요. 그래서 두 가지 버전만으로는 비싼 모델을 팔기 어렵고 세 번째 모델이 필요한 이유를 암시하는 문장이에요.","hl":"mn"},{"n":20,"text":"어법 포인트를 순서대로 볼게요. 첫 번째, If the company offers two versions는 조건 부사절로 두 가지 버전을 제공한다는 상황을 가정해요. 두 번째, one with more features and more expensive than the other에서 one은 두 가지 버전 중 하나를 가리키고, 비교급 more features와 more expensive than이 and로 연결되어 그 모델의 특성을 설명해요. 세 번째, people will compare the two models는 조건에 따른 미래 결과를 will로 나타내요. 네 번째, and still buy the less expensive one에서 and는 compare와 buy를 연결하고, the less expensive one은 더 저렴한 것을 의미하는 비교급 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 만약 그 회사가 세 번째 모델을 출시한다면\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">company \u003c/span>\u003cspan class=\"tgt\">introduces \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">third \u003c/span>\u003cspan class=\"tgt\">model\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 많은 기능과 더 비싼 가격을 가진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">features \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">expensive\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나머지 두 개보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">two,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 번째 모델의 판매가 증가한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">sales \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">second \u003c/span>\u003cspan class=\"tgt\">model \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들은 가장 비싼 모델의 기능을 좋아한다\u003c/span>\u003cspan class=\"en\">many people like the features of the most expensive model,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그 가격은 좋아하지 않는다\u003c/span>\u003cspan class=\"en\">but not the price.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 만약 그 회사가 나머지 두 개보다 훨씬 더 많은 기능과 더 비싼 가격을 가진 세 번째 모델을 출시한다면 두 번째 모델의 판매가 증가하는데, 왜냐하면 많은 사람들은 가장 비싼 모델의 기능을 좋아하지만 그것의 가격을 좋아하지는 않기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 모델이 추가되면 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">모델의 \u003c/b>\u003cb class=\"key\">판매\u003c/b>가 증가하는 원리를 설명합니다. 소비자들은 가장 비싼 모델의 \u003cb class=\"key\">기능\u003c/b>은 좋아하지만 \u003cb class=\"key\">가격\u003c/b>이 부담스러워, 균형 잡힌 중간 모델로 이동하게 됩니다. 이는 기업이 세 가지 버전을 만드는 전략의 핵심 작동 방식입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 (if)\u003c/span> : if + 주어 + 동사(현재형) ~, 주어 + 동사 ~ : \"만약 회사가 세 번째 모델을 출시하면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 with + 명사구 / 비교급 병렬\u003c/span> : with + 명사구(features) + and + 비교급 형용사구(more expensive) : \"훨씬 더 많은 기능과 더 비싼 가격을 가진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 than\u003c/span> : 비교급(more) + than + 비교 대상 : \"나머지 두 개보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">자동사구 go up\u003c/span> : sales of the second model + go up : \"두 번째 모델의 판매가 증가한다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But if the company introduces a third model, 하지만 만약 그 회사가 세 번째 모델을 출시한다면. with even more features and more expensive, 훨씬 더 많은 기능과 더 비싼 가격을 가진. than the other two, 나머지 두 개보다. sales of the second model go up, 두 번째 모델의 판매가 증가한다. many people like the features of the most expensive model, 많은 사람들은 가장 비싼 모델의 기능을 좋아한다. but not the price, 그러나 그 가격은 좋아하지 않는다. 이 문장 전체를 해석하면, 하지만 만약 그 회사가 나머지 두 개보다 훨씬 더 많은 기능과 더 비싼 가격을 가진 세 번째 모델을 출시한다면 두 번째 모델의 판매가 증가하는데, 왜냐하면 많은 사람들은 가장 비싼 모델의 기능을 좋아하지만 그것의 가격을 좋아하지는 않기 때문이다.","hl":"m"},{"n":22,"text":"이 문장은 세 번째 모델을 추가하면 왜 두 번째 모델의 판매가 증가하는지를 설명합니다. 사람들은 가장 비싼 모델의 기능은 마음에 들지만 가격이 부담스러워서, 결국 기능과 가격의 균형을 잡은 중간 모델을 선택하게 됩니다. 이것이 기업이 의도적으로 세 가지 버전을 만드는 이유의 핵심이에요.","hl":"mn"},{"n":23,"text":"어법 포인트를 정리해 볼게요. 첫 번째 포인트는 if the company introduces a third model입니다. 여기서 if는 조건을 나타내는 부사절을 이끌고, 조건절에서는 미래의 일도 현재시제로 씁니다. 두 번째 포인트는 with even more features and more expensive입니다. with가 앞의 모델을 수식하는 부가 정보를 이끌고, and로 기능과 가격이 병렬로 연결됩니다. 세 번째 포인트는 than the other two입니다. more features와 more expensive의 비교 대상을 이끄는 비교급 than입니다. 네 번째 포인트는 sales of the second model go up입니다. go up은 목적어 없이 쓰여 증가하다라는 뜻을 나타내는 자동사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중간 제품은 더 많은 기능이 있다\u003c/span>\u003cspan class=\"en\">The middle item \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">features \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 저렴한 제품보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">least \u003c/span>\u003cspan class=\"tgt\">expensive \u003c/span>\u003cspan class=\"tgt\">one\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 덜 비싸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">expensive \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 고급 모델보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fanciest \u003c/span>\u003cspan class=\"tgt\">model\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">중간 제품은 가장 저렴한 제품보다 더 많은 기능이 있고 가장 고급 모델보다는 덜 비싸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중간 제품이 비교 대상들 사이에서 어떤 위치인지 정리해 줍니다. \u003cb class=\"key\">중간 \u003c/b>\u003cb class=\"key\">제품\u003c/b>은 가장 저렴한 제품보다 기능이 많고, 가장 고급 모델보다는 저렴해 \u003cb class=\"key\">균형 \u003c/b>\u003cb class=\"key\">잡힌 \u003c/b>\u003cb class=\"key\">선택지\u003c/b> 역할을 합니다. 이런 특성이 앞 문장의 판매 증가를 설명하는 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 than / 최상급 least expensive\u003c/span> : 주어 + has + more features + than + 비교 대상 : \"가장 저렴한 제품보다 더 많은 기능이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">열등 비교급 less expensive than / 병렬 and\u003c/span> : and + 주어 + be동사 + less expensive + than + 비교 대상 : \"그리고 그것은 가장 고급 모델보다는 덜 비싸다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The middle item has more features, 중간 제품은 더 많은 기능이 있다. than the least expensive one, 가장 저렴한 제품보다. and it is less expensive, 그리고 그것은 덜 비싸다. than the fanciest model, 가장 고급 모델보다. 이 문장 전체를 해석하면, 중간 제품은 가장 저렴한 제품보다 더 많은 기능이 있고 가장 고급 모델보다는 덜 비싸다.","hl":"m"},{"n":25,"text":"이 문장은 중간 제품이 정확히 어떤 위치에 있는지를 비교해서 정의합니다. 가장 저렴한 제품보다 기능이 많고, 가장 고급 모델보다 가격이 낮아서 소비자에게 균형 잡힌 선택지로 보입니다. 그래서 앞 문장에서 말한 판매 증가의 원인이 되는 거죠.","hl":"mn"},{"n":26,"text":"어법 포인트를 보겠습니다. 첫 번째 포인트는 has more features than the least expensive one입니다. more features는 비교급이고 than이 비교 대상을 이끌며, the least expensive는 가장 저렴한이라는 최상급 표현입니다. 두 번째 포인트는 and it is less expensive than the fanciest model입니다. less expensive는 덜 비싸다라는 뜻의 열등 비교급이고, and가 앞 문장과 대등하게 연결합니다. the fanciest model은 가장 고급 모델이라는 최상급입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 중간 제품을 구입한다 알지 못한 채 그들이 조종되었다는 것을 더 비싼 가격의 제품의 존재에 의해\u003c/span>\u003cspan class=\"en\">They buy the middle item, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">unaware \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">manipulated\u003c/span> by the presence of the higher­priced item.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 자신이 더 비싼 가격의 제품의 존재에 의해 조종되었다는 것을 알지 못한 채 중간 제품을 구입한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소비자가 자신이 \u003cb class=\"key\">조종\u003c/b>당하고 있다는 사실을 모른 채 중간 제품을 고른다는 글 전체의 주제입니다. 더 비싼 제품의 \u003cb class=\"key\">존재\u003c/b> 자체가 선택을 바꾸는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">장치\u003c/b>로 작용한다는 뜻입니다. 기업의 세 가지 버전 전략이 소비자의 무의식적 선택을 이끌어 낸다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사 unaware + that절 / 현재완료 수동태\u003c/span> : unaware + that + 주어 + have been manipulated : \"그들이 조종되었다는 것을 알지 못한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">수동태의 행위자 by + 명사구\u003c/span> : by + 행위자 명사구 (the presence of the higher-priced item) : \"더 비싼 가격의 제품의 존재에 의해\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"They buy the middle item, 그들은 중간 제품을 구입한다. unaware, 알지 못한 채. that they have been manipulated, 그들이 조종되었다는 것을. by the presence of the higher-priced item, 더 비싼 가격의 제품의 존재에 의해. 이 문장 전체를 해석하면, 그들은 자신이 더 비싼 가격의 제품의 존재에 의해 조종되었다는 것을 알지 못한 채 중간 제품을 구입한다.","hl":"m"},{"n":28,"text":"이 문장은 소비자들이 자신이 조종당하고 있다는 사실을 전혀 모른 채 중간 제품을 산다는 글 전체의 핵심입니다. 더 비싼 제품이 옆에 있다는 존재 자체가 소비자의 선택을 바꾸는 심리적 장치라는 뜻이에요. 결국 세 가지 모델 전략은 소비자를 교묘하게 움직이게 만듭니다.","hl":"mn"},{"n":29,"text":"어법 포인트를 정리해 볼게요. 첫 번째 포인트는 unaware that they have been manipulated입니다. unaware는 알지 못하는이라는 서술형용사로 that절과 함께 쓰이며, have been manipulated는 현재완료 수동태로 조종되어 왔다는 의미를 나타냅니다. 두 번째 포인트는 by the presence of the higher-priced item입니다. 수동태 문장에서 행위자를 by로 나타내는데, 여기서는 사람이 아니라 더 비싼 제품의 존재라는 추상 명사가 행위자 역할을 합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">버전\u003c/b>만 만들면 더 낼 의사가 있는 고객을 통해 얻을 \u003cb class=\"key\">수입\u003c/b>을 잃는다.\u003c/li>\u003cli>\u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">버전\u003c/b>이면 사람들이 두 모델을 비교한 뒤 \u003cb class=\"key\">덜 \u003c/b>\u003cb class=\"key\">비싼\u003c/b> 모델을 산다.\u003c/li>\u003cli>\u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">모델\u003c/b>이 등장하면 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">비싼 \u003c/b>\u003cb class=\"key\">모델\u003c/b>의 기능을 좋아하지만 가격이 부담스러운 사람들이 \u003cb class=\"key\">중간 \u003c/b>\u003cb class=\"key\">제품\u003c/b>을 선택한다.\u003c/li>\u003cli>소비자는 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">비싼 \u003c/b>\u003cb class=\"key\">가격의 \u003c/b>\u003cb class=\"key\">제품의 \u003c/b>\u003cb class=\"key\">존재\u003c/b>에 \u003cb class=\"key\">조종\u003c/b>된 줄 모른 채 중간 제품을 구입한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A third, higher-priced model is introduced to make the middle option look more attractive, so consumers buy it unaware that they are being manipulated.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">기업이 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">버전\u003c/b>만 만들면 수입을 잃고 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">버전\u003c/b>에서는 저렴한 모델이 선택되지만, \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">고가 \u003c/b>\u003cb class=\"key\">모델\u003c/b>을 추가하면 소비자가 중간 제품을 선택하게 된다. 결국 소비자는 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">비싼 \u003c/b>\u003cb class=\"key\">가격의 \u003c/b>\u003cb class=\"key\">제품의 \u003c/b>\u003cb class=\"key\">존재\u003c/b>에 \u003cb class=\"key\">조종\u003c/b>된 줄 모른 채 중간 제품을 산다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 내용을 정리하면 기업이 한 가지보다 두 가지, 두 가지보다 세 가지 선택지를 만들 때 소비자의 선택이 달라진다는 것이 핵심입니다. 특히 세 번째 고가 모델은 직접 팔리지 않아도 중간 제품의 판매를 올리는 미끼 역할을 해요. 소비자는 비싼 제품의 존재에 조종된다는 사실을 모른 채 중간 제품을 고르게 됩니다. 다음 시간에도 이렇게 지문의 전개 구조와 어휘를 함께 정리해 보아요. 수고 많았습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
