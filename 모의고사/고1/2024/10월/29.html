lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 29번","audioDir":"29_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">29번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Active Digital Metaphors vs. Passive Linguistic Metaphors\u003c/h1>\u003ch2>능동적 디지털 은유와 수동적 언어적 은유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>디지털 기술의 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">은유\u003c/b>는 \u003cb class=\"key\">언어적 \u003c/b>\u003cb class=\"key\">은유\u003c/b>와 달리 \u003cb class=\"key\">능동적\u003c/b>이며 사용자의 의미의 지평을 강제로 바꾸지만, 기술적 창작자는 유용성이 \u003cb class=\"key\">첫눈에 \u003c/b>\u003cb class=\"key\">분명\u003c/b>해야 하므로 독자의 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 요구하지 않는다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Digital metaphors are active and impose meaning, while linguistic metaphors are passive and require cognitive effort from the audience.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 디지털 기술의 은유와 언어적 은유의 차이에 대한 내용입니다. 먼저 요약하자면, 디지털 은유는 능동적이고 사용자의 의미의 지평을 강제로 바꾸는 반면 언어적 은유는 수동적이고 독자의 인지적 노력을 요구합니다. 핵심 요지는 Digital metaphors are active and impose meaning, while linguistic metaphors are passive and require cognitive effort from the audience. 예요. 그럼 본격적으로 시작해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">은유(metaphor)는 추상적인 개념을 구체적인 대상에 빗대어 표현하는 방법입니다. 디지털 기술(digital technology)은 이런 은유를 인터페이스나 아이콘 같은 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">인공물\u003c/b>로 구현합니다. 예를 들어 스마트폰의 휴지통 아이콘은 파일 삭제를 은유하지만, 실제로 파일을 버리는 행위가 아니라 \u003cb class=\"key\">사용자의 \u003c/b>\u003cb class=\"key\">의미의 \u003c/b>\u003cb class=\"key\">지평\u003c/b>을 바꾸는 능동적 동작을 합니다. 일상에서 길 안내 앱의 화살표나 지도 표시 같은 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">은유\u003c/b>에 즉각적으로 반응하죠. 언어적 은유는 문학에서 주로 쓰이며, 독자가 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 통해 의미를 구성해야 합니다.\u003c/div>","segs":[{"n":2,"text":"은유는 추상적인 개념을 구체적인 대상에 빗대어 표현하는 방법입니다. 디지털 기술은 이런 은유를 인터페이스나 아이콘 같은 디지털 인공물로 구현합니다. 예를 들어 스마트폰의 휴지통 아이콘은 파일 삭제를 은유하지만, 실제로 파일을 버리는 행위가 아니라 사용자의 의미의 지평을 바꾸는 능동적 동작을 합니다. 일상에서 길 안내 앱의 화살표나 지도 표시 같은 디지털 은유에 즉각적으로 반응하죠. 언어적 은유는 문학에서 주로 쓰이며, 독자가 인지적 노력을 통해 의미를 구성해야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>디지털 기술과 은유의 관계\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>디지털 기술은 근본적으로 \u003cb class=\"key\">은유\u003c/b>와 관련되지만, \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">은유\u003c/b>는 중요한 면에서 \u003cb class=\"key\">언어적 \u003c/b>\u003cb class=\"key\">은유\u003c/b>와 다릅니다. 이 문장은 글의 \u003cb class=\"key\">두괄식\u003c/b> 주제문으로, 이후 전개에서 두 은유의 차이를 대조할 것임을 예고합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>언어적 은유의 수동성\u003csmall>설명 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">언어적 \u003c/b>\u003cb class=\"key\">은유\u003c/b>는 \u003cb class=\"key\">수동적\u003c/b>입니다. 독자가 은유에 의해 제시된 세계에 \u003cb class=\"key\">적극적으로\u003c/b> 들어가야 하기 때문입니다. 셰익스피어의 은유 'time is a beggar'는 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">노력\u003c/b> 없이는 이해하기 어렵고, 독자가 셰익스피어의 \u003cb class=\"key\">산문\u003c/b>에 더 몰입해야 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기술적 은유의 능동성\u003csmall>전환 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>반면 \u003cb class=\"key\">기술적 \u003c/b>\u003cb class=\"key\">은유\u003c/b>는 \u003cb class=\"key\">능동적\u003c/b>이고 종종 \u003cb class=\"key\">강요적\u003c/b>입니다. \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">인공물\u003c/b>에서 실현되어 사용자의 \u003cb class=\"key\">의미의 \u003c/b>\u003cb class=\"key\">지평\u003c/b>을 강력하게 바꿉니다. 기술적 창작자는 잠재적 독자가 은유의 작동 방식을 궁금해하도록 요구할 여유가 없고, \u003cb class=\"key\">유용성\u003c/b>이 \u003cb class=\"key\">첫눈에 \u003c/b>\u003cb class=\"key\">분명\u003c/b>해야 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>셰익스피어의 사랑받는 이유\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>셰익스피어는 작품의 의미가 \u003cb class=\"key\">즉각적으로 \u003c/b>\u003cb class=\"key\">분명\u003c/b>하지 않고 독자 측에서 \u003cb class=\"key\">생각\u003c/b>을 요구하기 때문에 부분적으로 \u003cb class=\"key\">사랑받습니다\u003c/b>. 이는 언어적 은유의 가치를 보여 주는 \u003cb class=\"key\">반례\u003c/b>적 성격을 띱니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글은 도입, 언어적 은유 설명, 기술적 은유 설명, 결론의 흐름으로 전개됩니다.","hl":null},{"n":4,"text":"첫 번째 단계는 도입입니다. 디지털 기술은 근본적으로 은유와 관련되지만 디지털 은유는 중요한 면에서 언어적 은유와 다르다고 말합니다. 이 문장은 글 전체의 주제문으로 두괄식 구조를 보여 주며, 이후 두 은유의 차이를 대조할 것을 예고합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 언어적 은유의 수동성을 설명합니다. 언어적 은유는 수동적이어서 독자가 은유에 의해 제시된 세계에 적극적으로 들어가야 합니다. 셰익스피어의 은유 time is a beggar는 인지적 노력 없이는 이해하기 어렵고, 독자가 셰익스피어의 산문에 더 몰입해야 합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 기술적 은유의 능동성을 다룹니다. 반면 기술적 은유는 능동적이고 종종 강요적입니다. 디지털 인공물에서 실현되어 사용자의 의미의 지평을 강력하게 바꿉니다. 기술적 창작자는 잠재적 독자가 은유의 작동 방식을 궁금해하도록 요구할 여유가 없고, 유용성이 첫눈에 분명해야 합니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 결론입니다. 셰익스피어는 작품의 의미가 즉각적으로 분명하지 않고 독자 측에서 생각을 요구하기 때문에 부분적으로 사랑받습니다. 이는 언어적 은유의 가치를 보여 주는 반례적 성격을 띱니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 디지털 은유와 언어적 은유가 다르다는 \u003cb class=\"key\">주제\u003c/b>를 제시하며 두괄식 구조를 취합니다. 이후 \u003cb class=\"key\">언어적 \u003c/b>\u003cb class=\"key\">은유\u003c/b>의 수동성과 \u003cb class=\"key\">기술적 \u003c/b>\u003cb class=\"key\">은유\u003c/b>의 능동성을 대조합니다. 마지막에 셰익스피어의 예로 \u003cb class=\"key\">언어적 \u003c/b>\u003cb class=\"key\">은유\u003c/b>의 가치를 부각하며 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (1)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>in the sense that (2)\u003c/b>\u003cspan>설명·정의\u003c/span>\u003cb>on the other hand (4)\u003c/b>\u003cspan>대조·전환\u003c/span>\u003cb>because (6)\u003c/b>\u003cspan>이유·근거\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">digital technologies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">digital metaphors\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">technological metaphors\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">digital artifacts\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">technology\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>디지털(기술적) 은유\u003c/th>\u003cth>언어적 은유\u003c/th>\u003c/tr>\u003ctr>\u003ctd>능동적이고 강요적임\u003c/td>\u003ctd>수동적임\u003c/td>\u003c/tr>\u003ctr>\u003ctd>유용성이 첫눈에 분명해야 함\u003c/td>\u003ctd>의미 파악에 인지적 노력 필요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사용자의 의미의 지평을 강제로 바꿈\u003c/td>\u003ctd>독자가 적극적으로 세계에 들어가야 함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 비교 대조 구조로 되어 있습니다. 첫 번째 문장에서 디지털 은유와 언어적 은유가 다르다는 주제를 제시하는 두괄식 구조예요. 이후 언어적 은유의 수동성을 설명하고, 기술적 은유의 능동성을 대조한 뒤, 마지막에 셰익스피어의 예로 마무리합니다.","hl":"ty"},{"n":9,"text":"신호어를 살펴볼게요. 첫 번째 문장의 but은 대조를 나타내고, 네 번째 문장의 on the other hand는 기술적 은유로 전환하는 신호입니다. 마지막 문장의 because는 셰익스피어가 사랑받는 이유를 설명합니다. 또한 linguistic metaphors와 technological metaphors, digital artifacts 같은 표현들이 대조되는 두 대상을 가리킵니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>digital\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>디지털의\u003c/span>\u003c/div>\u003cdiv>\u003cb>technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>essentially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>본질적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>be related to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 관련되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>metaphor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>은유\u003c/span>\u003c/div>\u003cdiv>\u003cb>linguistic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>언어의\u003c/span>\u003c/div>\u003cdiv>\u003cb>different from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 다른\u003c/span>\u003c/div>\u003cdiv>\u003cb>passive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수동적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the sense that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~라는 점에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>audience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>독자, 청중\u003c/span>\u003c/div>\u003cdiv>\u003cb>actively\u003c/b>\u003cem>부사\u003c/em>\u003cspan>적극적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>enter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cognitive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인지적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>effort\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노력\u003c/span>\u003c/div>\u003cdiv>\u003cb>engage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관여하다, 끌어들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>on the other hand\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>반면에\u003c/span>\u003c/div>\u003cdiv>\u003cb>active\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>능동적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>imposing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>강요적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>realize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>실현하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>digital artifact\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>디지털 인공물\u003c/span>\u003c/div>\u003cdiv>\u003cb>forcefully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>강력하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>meaning horizon\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>의미의 지평\u003c/span>\u003c/div>\u003cdiv>\u003cb>afford\u003c/b>\u003cem>동사\u003c/em>\u003cspan>여유가 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>require\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wonder\u003c/b>\u003cem>동사\u003c/em>\u003cspan>궁금해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>selling point\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>매력, 판매 포인트\u003c/span>\u003c/div>\u003cdiv>\u003cb>usefulness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유용성\u003c/span>\u003c/div>\u003cdiv>\u003cb>obvious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>분명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>at first glance\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>첫눈에\u003c/span>\u003c/div>\u003cdiv>\u003cb>beloved\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사랑받는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘를 몇 개 정리할게요. passive는 수동적인, active는 능동적인 뜻이에요. cognitive effort는 인지적 노력, at first glance는 첫눈에라는 뜻입니다. 이 단어들은 지문의 핵심 개념을 파악하는 데 중요합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">passive\u003c/b>\u003cspan class=\"m\">수동적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inactive\u003c/span>\u003cspan class=\"s\">receptive\u003c/span>\u003cspan class=\"s\">submissive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">active\u003c/span>\u003cspan class=\"a\">dynamic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">active\u003c/b>\u003cspan class=\"m\">능동적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dynamic\u003c/span>\u003cspan class=\"s\">energetic\u003c/span>\u003cspan class=\"s\">operative\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">passive\u003c/span>\u003cspan class=\"a\">inactive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">obvious\u003c/b>\u003cspan class=\"m\">분명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clear\u003c/span>\u003cspan class=\"s\">evident\u003c/span>\u003cspan class=\"s\">apparent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003cspan class=\"a\">ambiguous\u003c/span>\u003cspan class=\"a\">subtle\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">effort\u003c/b>\u003cspan class=\"m\">노력\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">exertion\u003c/span>\u003cspan class=\"s\">attempt\u003c/span>\u003cspan class=\"s\">endeavor\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ease\u003c/span>\u003cspan class=\"a\">laziness\u003c/span>\u003cspan class=\"a\">inaction\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">beloved\u003c/b>\u003cspan class=\"m\">사랑받는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adored\u003c/span>\u003cspan class=\"s\">cherished\u003c/span>\u003cspan class=\"s\">dear\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hated\u003c/span>\u003cspan class=\"a\">despised\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">afford\u003c/b>\u003cspan class=\"m\">여유가 있다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">manage\u003c/span>\u003cspan class=\"s\">sustain\u003c/span>\u003cspan class=\"s\">provide\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 볼게요. passive의 동의어는 inactive, receptive, submissive이고 반의어는 active, dynamic입니다. active의 동의어는 dynamic, energetic, operative이고 반의어는 passive, inactive예요. obvious는 clear, evident, apparent와 비슷하고, obscure, ambiguous, subtle과 반대입니다. effort는 exertion, attempt, endeavor와 유사하고, ease, laziness, inaction과 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디지털 기술은 근본적으로 은유와 관련되어 있지만,\u003c/span>\u003cspan class=\"en\">Digital technologies \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">essentially \u003c/span>\u003cspan class=\"tgt\">related \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">metaphors\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 디지털 은유는 언어적 은유와 다르다\u003c/span>\u003cspan class=\"en\">but digital metaphors \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">from\u003c/span> linguistic ones\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 면에서.\u003c/span>\u003cspan class=\"en\">in important ways.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">디지털 기술은 근본적으로 은유와 관련되어 있지만, 디지털 은유는 중요한 면에서 언어적 은유와 다르다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 디지털 기술이 본질적으로 은유와 관련된다는 점을 인정하면서도, \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">은유\u003c/b>가 \u003cb class=\"key\">언어적 \u003c/b>\u003cb class=\"key\">은유\u003c/b>와 중요한 면에서 다르다는 글 전체의 대조를 예고합니다. 여기서 linguistic ones는 앞의 metaphors를 받는 대명사로, 단순히 언어적 은유를 의미합니다. 이후 문장들이 이 차이를 수동성과 능동성으로 구체화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + 과거분사 + 전치사구)\u003c/span> : are + essentially + related + to + metaphors : \"근본적으로 은유와 관련되어 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be different from + 명사 (관용 표현)\u003c/span> : be + different + from + [linguistic ones] : \"~와 다르다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Digital technologies are essentially related to metaphors, 디지털 기술은 근본적으로 은유와 관련되어 있지만. but digital metaphors are different from linguistic ones, 그러나 디지털 은유는 언어적 은유와 다르다. in important ways, 중요한 면에서.. 이 문장 전체를 해석하면, 디지털 기술은 근본적으로 은유와 관련되어 있지만, 디지털 은유는 중요한 면에서 언어적 은유와 다르다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 디지털 기술이 본질적으로 은유와 관련되어 있다는 사실을 먼저 인정하고, 이어서 디지털 은유가 언어적 은유와 중요한 면에서 다르다고 대조를 시작합니다. 여기서 linguistic ones는 앞에 나온 metaphors를 대신하는 표현이라서, 결국 언어적 은유와 디지털 은유를 비교하는 거예요. 이 문장은 뒤에 나올 수동적 언어적 은유와 능동적 기술적 은유의 구체적인 설명을 여는 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째 문장의 어법 포인트는 두 가지예요. 첫 번째는 are essentially related to metaphors에서 related가 be동사와 함께 쓰인 수동태라는 점입니다. relate A to B의 수동태로, 디지털 기술이 은유와 연결되어 있다는 뜻이에요. 두 번째는 are different from이라는 표현인데, different는 전치사 from과 함께 쓰여서 무엇과 다르다는 의미를 나타냅니다. be different from은 하나의 관용 표현으로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언어적 은유는 수동적이다,\u003c/span>\u003cspan class=\"en\">Linguistic metaphors are passive,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라는 점에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sense \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독자가 선택할 필요가 있다\u003c/span>\u003cspan class=\"en\">the audience \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">choose\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">은유에 의해 제시된 세계에 적극적으로 들어가도록.\u003c/span>\u003cspan class=\"en\">to actively enter \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world \u003c/span>\u003cspan class=\"tgt\">proposed \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">metaphor\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">언어적 은유는 독자가 은유에 의해 제시된 세계에 적극적으로 들어가도록 선택할 필요가 있다는 점에서 수동적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 문장은 언어적 은유가 왜 \u003cb class=\"key\">수동적\u003c/b>인지 정의합니다. 은유가 제시하는 세계로 들어가려면 \u003cb class=\"key\">독자\u003c/b>가 인지적으로 \u003cb class=\"key\">능동적 \u003c/b>\u003cb class=\"key\">선택\u003c/b>을 해야 하므로, 은유 자체는 수동적이라는 논리입니다. 여기서 proposed by metaphor는 은유에 의해 제시된이라는 수동의 의미로, 세계가 은유에 의해 만들어진 것임을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 that\u003c/span> : in the sense + that절 : \"~라는 점에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : need + to choose (to부정사 목적어) : \"선택할 필요가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(수동)\u003c/span> : the world + proposed + by metaphor (the world which is proposed by metaphor) : \"은유에 의해 제시된 세계\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Linguistic metaphors are passive, 언어적 은유는 수동적이다. in the sense that, 라는 점에서. the audience needs to choose, 독자가 선택할 필요가 있다. to actively enter the world proposed by metaphor, 은유에 의해 제시된 세계에 적극적으로 들어가도록.. 이 문장 전체를 해석하면, 언어적 은유는 독자가 은유에 의해 제시된 세계에 적극적으로 들어가도록 선택할 필요가 있다는 점에서 수동적이다.","hl":"m"},{"n":16,"text":"두 번째 문장은 언어적 은유가 왜 수동적인지 설명합니다. 언어적 은유는 그 세계로 들어가기 위해 독자가 스스로 능동적으로 선택해야 하기 때문에, 은유 자체는 독자를 끌어들이지 않고 기다리는 수동적 존재라는 뜻이에요. proposed by metaphor는 은유에 의해 제시된 세계라는 수동의 의미를 담고 있습니다.","hl":"mn"},{"n":17,"text":"두 번째 문장의 어법 포인트는 세 가지예요. 첫 번째는 in the sense that인데, that절이 앞에 나온 the sense의 내용을 설명하는 동격절입니다. 그래서 in the sense that은 그런 의미에서, 즉 이러이러한 점에서라고 해석해요. 두 번째는 needs to choose에서 need가 to부정사를 목적어로 취한다는 점입니다. need to부정사는 무엇을 할 필요가 있다는 뜻이죠. 세 번째는 the world proposed by metaphor에서 proposed가 앞의 명사 the world를 수식하는 과거분사라는 점입니다. 뒤에 by metaphor가 붙어서 수동의 의미, 즉 은유에 의해 제시된 세계를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">셰익스피어의 &quot;time is a beggar&quot;라는 은유에서,\u003c/span>\u003cspan class=\"en\">In the Shakespearean metaphor &quot;time is a beggar,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독자는 그 은유를 이해할 것 같지 않다\u003c/span>\u003cspan class=\"en\">the audience \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">unlikely \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span> the metaphor\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인지적인 노력 없이는\u003c/span>\u003cspan class=\"en\">without cognitive effort\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 셰익스피어의 산문을 더 끌어들이지 않고는.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">further \u003c/span>\u003cspan class=\"tgt\">engaging \u003c/span>\u003cspan class=\"tgt\">Shakespeare's \u003c/span>\u003cspan class=\"tgt\">prose\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“시간은 구걸하는 자다”라는 셰익스피어의 은유에서 독자는 인지적인 노력 없이는 그리고 셰익스피어의 산문을 더 끌어들이지 않고는 은유를 이해할 것 같지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 문장은 언어적 은유의 수동성을 보여 주는 구체적 예로 셰익스피어의 \u003cb class=\"key\">time \u003c/b>\u003cb class=\"key\">is \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">beggar\u003c/b>를 듭니다. 독자가 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">노력\u003c/b>과 \u003cb class=\"key\">셰익스피어의 \u003c/b>\u003cb class=\"key\">산문\u003c/b>에 적극적으로 참여하지 않으면 이 은유를 이해하기 어렵다는 점에서, 언어적 은유는 해석자의 능동적 참여를 요구함을 강조합니다. without이 두 번 반복되며 ~없이는이라는 조건의 뜻을 병렬로 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be unlikely to부정사\u003c/span> : be + unlikely + to understand : \"이해할 것 같지 않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 without + 동명사\u003c/span> : without + [engaging Shakespeare's prose] (동명사구) : \"셰익스피어의 산문을 더 끌어들이지 않고서는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In the Shakespearean metaphor \"time is a beggar,\", 셰익스피어의 \"time is a beggar\"라는 은유에서. the audience is unlikely to understand the metaphor, 독자는 그 은유를 이해할 것 같지 않다. without cognitive effort, 인지적인 노력 없이는. and without further engaging Shakespeare's prose, 그리고 셰익스피어의 산문을 더 끌어들이지 않고는.. 이 문장 전체를 해석하면, “시간은 구걸하는 자다”라는 셰익스피어의 은유에서 독자는 인지적인 노력 없이는 그리고 셰익스피어의 산문을 더 끌어들이지 않고는 은유를 이해할 것 같지 않다.","hl":"m"},{"n":19,"text":"세 번째 문장은 셰익스피어의 유명한 은유 time is a beggar를 예로 들어서, 언어적 은유를 이해하려면 독자의 인지적 노력과 셰익스피어의 산문을 계속 읽어 나가는 능동적 참여가 필요하다는 점을 보여줍니다. without cognitive effort와 without further engaging이 병렬로 반복되면서, 두 가지 조건이 모두 없으면 이해할 수 없다는 뜻을 강조해요. 이 예시는 앞서 말한 언어적 은유의 수동성을 뒷받침합니다.","hl":"mn"},{"n":20,"text":"세 번째 문장의 어법 포인트는 두 가지예요. 첫 번째는 is unlikely to understand에서 be unlikely to부정사 구문입니다. unlikely는 형용사로, to부정사와 함께 쓰여서 어떤 일이 일어날 가능성이 낮다는 뜻을 나타내요. 두 번째는 without further engaging Shakespeare's prose에서 engaging이 전치사 without의 목적어로 쓰인 동명사라는 점입니다. 전치사 뒤에는 명사나 동명사가 와야 하므로 engage가 engaging으로 바뀌었고, 뒤에 Shakespeare's prose라는 목적어를 그대로 취하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면에 기술적 은유는\u003c/span>\u003cspan class=\"en\">Technological metaphors, on the other hand,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">능동적이다 (그리고 종종 강요적이다)\u003c/span>\u003cspan class=\"en\">are active (and often imposing)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라는 점에서 그것은 디지털 인공물에서 실현된다\u003c/span>\u003cspan class=\"en\">in the sense that they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">realized\u003c/span> in digital artifacts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">능동적으로 일을 하고 있는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">actively \u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용자의 의미의 지평을 강력하게 바꾸면서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">forcefully \u003c/span>\u003cspan class=\"tgt\">changing \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">user's \u003c/span>\u003cspan class=\"tgt\">meaning \u003c/span>\u003cspan class=\"tgt\">horizon\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반면에 기술적 은유는 사용자의 의미의 지평을 강력하게 바꾸면서 능동적으로 일을 하는 디지털 인공물에서 그것이 실현된다는 점에서 능동적이다. (그리고 종종 강요적이다.)\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 언어적 은유와 달리 기술적 은유가 \u003cb class=\"key\">능동적\u003c/b>이라는 점을 핵심으로 제시해요. 기술적 은유는 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">인공물\u003c/b> 안에서 실제로 구현되어 작동하며, 사용자의 \u003cb class=\"key\">의미의 \u003c/b>\u003cb class=\"key\">지평\u003c/b>을 강제로 바꾸어 놓는다고 설명해요. 앞 문장의 수동적인 언어적 은유와 대조되는 글의 전환점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사(are) + 과거분사(realized) : \"그것들은 실현된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : digital artifacts + [that + 동사(are doing) ...] 형용사절 : \"능동적으로 일을 하고 있는 디지털 인공물\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사구 (부대 상황)\u003c/span> : [forcefully changing ...] 분사구, 주절에 동시 동작 부가 : \"사용자의 의미의 지평을 강력하게 바꾸면서\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Technological metaphors, on the other hand, 반면에 기술적 은유는. are active (and often imposing), 능동적이다 (그리고 종종 강요적이다). in the sense that they are realized in digital artifacts, 라는 점에서 그것은 디지털 인공물에서 실현된다. that are actively doing things, 능동적으로 일을 하고 있는. forcefully changing a user's meaning horizon, 사용자의 의미의 지평을 강력하게 바꾸면서.. 이 문장 전체를 해석하면, 반면에 기술적 은유는 사용자의 의미의 지평을 강력하게 바꾸면서 능동적으로 일을 하는 디지털 인공물에서 그것이 실현된다는 점에서 능동적이다. (그리고 종종 강요적이다.)","hl":"m"},{"n":22,"text":"이 문장은 언어적 은유와 달리 기술적 은유가 능동적이라는 핵심을 제시해요. 기술적 은유는 디지털 인공물 안에서 실제로 구현되어 작동하고, 사용자의 의미의 지평을 강제로 바꾸어 놓는다고 설명하죠. 앞 문장의 수동적인 언어적 은유와 대조되는 전환점이에요.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 수동태예요. are realized는 be동사와 과거분사가 결합한 수동태라서, 기술적 은유가 스스로 실현하는 것이 아니라 디지털 인공물 안에서 실현되는 의미를 전달해요. 두 번째 포인트는 주격 관계대명사 that이에요. that은 digital artifacts를 수식하면서 절 안에서 주어 역할을 하고, 뒤에 are actively doing things가 와서 능동적으로 일을 하고 있는 디지털 인공물이라는 뜻을 만들어요. 세 번째는 현재분사구 forcefully changing a user's meaning horizon인데, 주어 technological metaphors와 능동 관계라서 현재분사를 쓴 부대 상황 표현이에요. 기술적 은유가 능동적으로 움직이면서 동시에 사용자의 의미의 지평을 바꾼다는 것을 자연스럽게 덧붙여 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기술적인 창작자는 일반적으로 요구할 여유가 없다\u003c/span>\u003cspan class=\"en\">Technological creators cannot generally \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">afford \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">require\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 잠재적인 독자가 궁금해하도록\u003c/span>\u003cspan class=\"en\">their potential audience \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">wonder\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">은유가 어떻게 작용하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">metaphor \u003c/span>\u003cspan class=\"tgt\">works\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반적으로 매력은 바로\u003c/span>\u003cspan class=\"en\">normally the selling point is \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기술의 유용성이 첫눈에 분명하다는 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">usefulness \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">technology \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">obvious \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">glance\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기술적인 창작자는 일반적으로 그들의 잠재적인 독자에게 어떻게 은유가 작용하는지 궁금해하도록 요구할 여유가 없고, 일반적으로 매력은 기술의 유용성이 첫눈에 분명하다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기술적 창작자는 잠재적 독자가 은유의 작동 방식을 \u003cb class=\"key\">궁금해하도록\u003c/b> 요구할 여유가 없다고 말해요. 기술의 \u003cb class=\"key\">판매 \u003c/b>\u003cb class=\"key\">포인트\u003c/b>는 유용성이 \u003cb class=\"key\">첫눈에 \u003c/b>\u003cb class=\"key\">분명\u003c/b>하게 드러나는 데 있기 때문이에요. 그래서 기술적 은유는 해석을 위한 노력을 요구하지 않고 바로 사용 가치를 알리는 쪽으로 만들어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (afford의 목적어)\u003c/span> : afford + [to require (to부정사구)] : \"요구할 여유가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 목적격 보어\u003c/span> : require + their potential audience + [to wonder ...] : \"궁금해하도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : wonder + [how + the metaphor + works] (의문사 + 주어 + 동사) : \"은유가 어떻게 작용하는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">that절 보어\u003c/span> : The selling point is + [that + 완전한 문장] : \"기술의 유용성이 첫눈에 분명하다는 것\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Technological creators cannot generally afford to require, 기술적인 창작자는 일반적으로 요구할 여유가 없다. their potential audience to wonder, 그들의 잠재적인 독자가 궁금해하도록. how the metaphor works, 은유가 어떻게 작용하는지. normally the selling point is that, 일반적으로 매력은 바로. the usefulness of the technology is obvious at first glance, 기술의 유용성이 첫눈에 분명하다는 것이다.. 이 문장 전체를 해석하면, 기술적인 창작자는 일반적으로 그들의 잠재적인 독자에게 어떻게 은유가 작용하는지 궁금해하도록 요구할 여유가 없고, 일반적으로 매력은 기술의 유용성이 첫눈에 분명하다는 것이다.","hl":"m"},{"n":25,"text":"이 문장은 기술적 창작자는 잠재적 독자가 은유의 작동 방식을 궁금해하도록 요구할 여유가 없다고 말해요. 기술의 판매 포인트는 유용성이 첫눈에 분명하게 드러나는 데 있기 때문이죠. 그래서 기술적 은유는 해석을 위한 노력을 요구하지 않고 바로 사용 가치를 알리는 쪽으로 만들어져요.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 afford to require의 to부정사예요. afford는 to부정사를 목적어로 취하는 동사라서, cannot generally afford to require라고 하면 일반적으로 요구할 여유가 없다는 뜻이 돼요. 두 번째는 to wonder에 있는 to부정사의 목적격 보어 용법이에요. require 다음에 their potential audience라는 목적어가 오고, 그 뒤에 to wonder가 와서 잠재적 독자가 궁금해하도록 요구하는 구조를 만들어요. 세 번째는 간접의문문 how the metaphor works예요. 의문사 how 다음에 주어 the metaphor, 동사 works가 평서문 어순으로 와서 wonder의 목적어 역할을 하죠. 네 번째는 that절 보어인데, the selling point is that 다음에 완전한 절이 와서 판매 포인트의 내용을 설명해요. that절 안은 주어 the usefulness, 동사 is, 보어 obvious를 갖춘 완전한 문장이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면에 셰익스피어는\u003c/span>\u003cspan class=\"en\">Shakespeare, on the other hand,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사랑받는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">beloved\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부분적으로 그의 작품의 의미가\u003c/span>\u003cspan class=\"en\">in part \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">meaning \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">works \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉각적으로 분명하지 않고 어느 정도의 생각을 요구한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">immediately \u003c/span>\u003cspan class=\"tgt\">obvious\u003c/span> and requires some thought\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독자 측에서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">audience\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반면에 셰익스피어는 부분적으로는 그의 작품의 의미가 즉각적으로 분명하지 않고 독자 측에서 어느 정도의 생각을 요구하기 때문에 사랑받는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 셰익스피어 작품은 의미가 바로 드러나지 않고 \u003cb class=\"key\">독자의 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 요구하기 때문에 오히려 \u003cb class=\"key\">사랑받는다\u003c/b>는 점을 강조해요. 기술적 은유의 \u003cb class=\"key\">즉각적 \u003c/b>\u003cb class=\"key\">유용성\u003c/b>과 정반대의 가치를 지닌 언어적 은유의 사례를 제시해요. 이로써 언어적 은유는 수동적이고 해석 노력이 필요한 반면, 기술적 은유는 능동적이고 즉각적이라는 대조가 완성돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + 과거분사)\u003c/span> : be동사(is) + 과거분사(beloved) : \"사랑받는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유의 부사절\u003c/span> : because + 주어(the meaning) + 동사(is) ... : \"그의 작품의 의미가 즉각적으로 분명하지 않기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 (관용 표현)\u003c/span> : on the part of + 사람 : \"독자 측에서\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Shakespeare, on the other hand, 반면에 셰익스피어는. is beloved, 사랑받는다. in part because the meaning of his works, 부분적으로 그의 작품의 의미가. is not immediately obvious and requires some thought, 즉각적으로 분명하지 않고 어느 정도의 생각을 요구한다. on the part of the audience, 독자 측에서.. 이 문장 전체를 해석하면, 반면에 셰익스피어는 부분적으로는 그의 작품의 의미가 즉각적으로 분명하지 않고 독자 측에서 어느 정도의 생각을 요구하기 때문에 사랑받는다.","hl":"m"},{"n":28,"text":"셰익스피어 작품은 의미가 바로 드러나지 않고 독자의 생각을 요구하기 때문에 오히려 사랑받는다는 점을 강조해요. 기술적 은유의 즉각적 유용성과 정반대의 가치를 지닌 언어적 은유의 사례를 제시하는 거죠. 이로써 언어적 은유는 수동적이고 해석 노력이 필요한 반면, 기술적 은유는 능동적이고 즉각적이라는 대조가 완성돼요.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 is beloved에 있는 수동태예요. beloved는 be동사 is와 함께 쓰여 Shakespeare가 사랑을 받는 대상임을 나타내요. 두 번째는 because가 이끄는 이유의 부사절이에요. because 뒤에 그의 작품의 의미가 즉각적으로 분명하지 않다는 절이 와서, 셰익스피어가 사랑받는 이유를 설명해요. 세 번째는 on the part of the audience라는 관용 표현인데, on the part of는 어떤 생각이나 행동의 주체를 나타내서 이 문장에서는 생각을 요구하는 주체가 audience라는 것을 분명히 해 줘요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>디지털 기술은 근본적으로 \u003cb class=\"key\">은유\u003c/b>와 관련되지만, \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">은유\u003c/b>는 \u003cb class=\"key\">언어적 \u003c/b>\u003cb class=\"key\">은유\u003c/b>와 중요한 면에서 다르다.\u003c/li>\u003cli>\u003cb class=\"key\">언어적 \u003c/b>\u003cb class=\"key\">은유\u003c/b>는 \u003cb class=\"key\">수동적\u003c/b>이어서 독자가 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 통해 적극적으로 세계에 들어가야 한다.\u003c/li>\u003cli>\u003cb class=\"key\">기술적 \u003c/b>\u003cb class=\"key\">은유\u003c/b>는 \u003cb class=\"key\">능동적\u003c/b>이고 \u003cb class=\"key\">강요적\u003c/b>이며, \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">인공물\u003c/b>에서 실현되어 사용자의 \u003cb class=\"key\">의미의 \u003c/b>\u003cb class=\"key\">지평\u003c/b>을 바꾼다.\u003c/li>\u003cli>기술적 창작자는 \u003cb class=\"key\">유용성\u003c/b>이 \u003cb class=\"key\">첫눈에 \u003c/b>\u003cb class=\"key\">분명\u003c/b>해야 하지만, 셰익스피어는 의미가 \u003cb class=\"key\">즉각적으로 \u003c/b>\u003cb class=\"key\">분명\u003c/b>하지 않아 \u003cb class=\"key\">사랑받는다\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Digital metaphors are active and impose meaning, while linguistic metaphors are passive and require cognitive effort from the audience.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">디지털 기술의 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">은유\u003c/b>는 \u003cb class=\"key\">언어적 \u003c/b>\u003cb class=\"key\">은유\u003c/b>와 달리 \u003cb class=\"key\">능동적\u003c/b>이며 사용자의 의미의 지평을 강제로 바꾸지만, 기술적 창작자는 유용성이 \u003cb class=\"key\">첫눈에 \u003c/b>\u003cb class=\"key\">분명\u003c/b>해야 하므로 독자의 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 요구하지 않는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 배운 내용을 정리하면, 디지털 은유는 능동적이고 즉각적인 이해를 요구하는 반면, 언어적 은유는 수동적이고 독자의 인지적 노력을 요구합니다. 셰익스피어의 작품이 사랑받는 이유도 이런 깊이 있는 의미 때문이에요. 이 구조를 기억하며 독해에 활용해 보세요. 오늘 강의는 여기까지입니다. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
