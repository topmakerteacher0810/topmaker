</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 18번","audioDir":"18_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">18번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>A Principal's Request for Timely Review of School Construction Funding\u003c/h1>\u003ch2>학교 건축 자금 지원 검토 요청\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>본문은 Fort Montgomery 고등학교가 예산 지원을 위한 서류를 제출했으나 \u003cb class=\"key\">검토 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 받지 못해, 프로젝트 진행을 위해 \u003cb class=\"key\">예산 \u003c/b>\u003cb class=\"key\">검토 \u003c/b>\u003cb class=\"key\">결과\u003c/b> 통지를 요청하는 편지이다. 학교는 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 필요하며 지연 시 \u003cb class=\"key\">예산 \u003c/b>\u003cb class=\"key\">제한\u003c/b>과 \u003cb class=\"key\">일정\u003c/b>에 문제가 생길 수 있다고 강조한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The principal of Fort Montgomery High School requests the State Education Department to notify them of the review result regarding the submitted funding documentation so that the construction project can proceed.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 한 학교의 교장 선생님이 주 교육부에 보내는 공식 편지입니다. 학교 건축 프로젝트를 위한 예산 지원 서류를 제출했지만 아직 검토 결과를 받지 못해서, 그 결과를 알려 달라고 요청하는 내용이에요. 전체 내용을 간단히 요약하면, 학교는 추가 공간이 필요해서 예산 지원을 신청했고, 서류를 제출했지만 응답이 없어서 검토 결과 통지를 요청하는 편지입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 편지는 공립학교의 건축 프로젝트와 관련된 예산 지원 절차를 다룹니다. 미국의 공립학교는 주 정부의 교육 부서(State Education Department)로부터 자금(funding)을 지원받아 시설을 확충합니다. 학교는 프로젝트를 위해 필요한 서류(documentation)를 제출하고, 주 정부는 이를 검토한 후 결과를 통지해야 합니다. 마치 우리가 중요한 신청서를 제출하고 결과를 기다리는 상황에서 아무 연락이 없으면 답답한 것처럼, 학교도 예산 승인 결과를 기다리는 중입니다. 그런데 검토가 지연되면 학교의 예산 계획(budgetary constraints)과 공사 일정(schedule)에 차질이 생길 수 있습니다. 따라서 행정 기관의 신속한 응답이 중요하다는 점을 이 편지는 강조하고 있습니다.\u003c/div>","segs":[{"n":2,"text":"이 편지는 공립학교의 건축 프로젝트와 관련된 예산 지원 절차를 다루고 있어요. 미국의 공립학교는 주 정부의 교육 부서, 즉 State Education Department로부터 자금, funding을 지원받아 시설을 확충합니다. 학교는 프로젝트를 위해 필요한 서류, documentation을 제출하고, 주 정부는 이를 검토한 후 결과를 통지해야 해요. 마치 우리가 중요한 신청서를 제출하고 결과를 기다리는 상황에서 아무 연락이 없으면 답답한 것처럼, 학교도 예산 승인 결과를 기다리는 중이에요. 그런데 검토가 지연되면 학교의 예산 계획, budgetary constraints과 공사 일정, schedule에 차질이 생길 수 있습니다. 그래서 행정 기관의 신속한 응답이 중요하다는 점을 이 편지는 강조하고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>편지 작성 배경과 공간 필요\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 번째 문장과 두 번째 문장에서는 편지의 목적과 \u003cb class=\"key\">학교의 \u003c/b>\u003cb class=\"key\">필요\u003c/b>를 밝힙니다. 작성자는 \u003cb class=\"key\">주 \u003c/b>\u003cb class=\"key\">교육부\u003c/b>에 예산 지원과 관련하여 편지를 씁니다. 학교는 학생들에게 \u003cb class=\"key\">의미 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 서비스를 제공하기 위해 \u003cb class=\"key\">완전하게 \u003c/b>\u003cb class=\"key\">제 \u003c/b>\u003cb class=\"key\">기능을 \u003c/b>\u003cb class=\"key\">하는 \u003c/b>\u003cb class=\"key\">Art \u003c/b>\u003cb class=\"key\">and \u003c/b>\u003cb class=\"key\">Library \u003c/b>\u003cb class=\"key\">Media \u003c/b>\u003cb class=\"key\">Center\u003c/b>를 위한 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 필요하다고 말합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>서류 제출에도 응답 없음\u003csmall>문제 · 문장 3\u003c/small>\u003c/h4>\u003cp>세 번째 문장은 현재 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 설명합니다. 학교는 \u003cb class=\"key\">2024년 \u003c/b>\u003cb class=\"key\">4월\u003c/b>에 필요한 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">서류\u003c/b>를 제출했습니다. 하지만 아직까지도 \u003cb class=\"key\">주 \u003c/b>\u003cb class=\"key\">교육부\u003c/b>로부터 \u003cb class=\"key\">어떠한 \u003c/b>\u003cb class=\"key\">통지\u003c/b>도 받지 못했습니다. 이는 행정 처리의 \u003cb class=\"key\">지연\u003c/b>을 의미합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>지연의 결과와 검토 요청\u003csmall>주장·요청 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>네 번째와 다섯 번째 문장은 지연의 \u003cb class=\"key\">결과\u003c/b>와 이에 대한 \u003cb class=\"key\">요청\u003c/b>을 담고 있습니다. 과정의 지연은 학교의 \u003cb class=\"key\">예산 \u003c/b>\u003cb class=\"key\">제한\u003c/b>과 \u003cb class=\"key\">일정\u003c/b>에 \u003cb class=\"key\">상당한 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 초래할 수 있습니다. 따라서 프로젝트를 진행하기 위해 제출 서류에 대한 \u003cb class=\"key\">검토 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 통지해 달라고 \u003cb class=\"key\">정중하게 \u003c/b>\u003cb class=\"key\">요청\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>마무리 인사\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>여섯 번째와 일곱 번째 문장은 편지의 \u003cb class=\"key\">마무리\u003c/b> 부분입니다. 작성자는 \u003cb class=\"key\">답변을 \u003c/b>\u003cb class=\"key\">고대\u003c/b>한다고 말하며 예의를 갖춥니다. 마지막으로 \u003cb class=\"key\">Respectfully\u003c/b>라는 표현과 함께 서명을 하고, 자신의 직함인 \u003cb class=\"key\">Principal\u003c/b>과 학교명을 밝힙니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 살펴볼게요. 편지의 목적과 배경, 문제 상황, 요청, 마무리 순서로 이어집니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 편지의 목적과 학교의 필요를 밝혀요. 작성자는 주 교육부에 예산 지원과 관련하여 편지를 씁니다. 학교는 학생들에게 의미 있는 방식으로 서비스를 제공하기 위해 완전하게 제 기능을 하는 Art and Library Media Center를 위한 추가 공간이 필요하다고 말해요.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 현재 문제 상황을 설명해요. 학교는 이천이십사년 사월에 필요한 모든 서류를 제출했어요. 하지만 아직까지도 주 교육부로부터 어떠한 통지도 받지 못했죠. 이는 행정 처리의 지연을 의미합니다.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장은 지연의 결과와 이에 대한 요청을 담고 있어요. 과정의 지연은 학교의 예산 제한과 일정에 상당한 결과를 초래할 수 있습니다. 따라서 프로젝트를 진행하기 위해 제출 서류에 대한 검토 결과를 통지해 달라고 정중하게 요청해요.","hl":"f2"},{"n":7,"text":"여섯 번째와 일곱 번째 문장은 편지의 마무리 부분이에요. 작성자는 답변을 고대한다고 말하며 예의를 갖춥니다. 마지막으로 Respectfully라는 표현과 함께 서명을 하고, 자신의 직함인 Principal과 학교명을 밝혀요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 편지는 \u003cb class=\"key\">서류 \u003c/b>\u003cb class=\"key\">제출 \u003c/b>\u003cb class=\"key\">후 \u003c/b>\u003cb class=\"key\">응답이 \u003c/b>\u003cb class=\"key\">없다\u003c/b>는 문제를 제기하고, 그 해결책으로 \u003cb class=\"key\">검토 \u003c/b>\u003cb class=\"key\">결과 \u003c/b>\u003cb class=\"key\">통지\u003c/b>를 요청하는 \u003cb class=\"key\">문제-해결\u003c/b> 구조입니다. 주제문인 요청이 다섯 번째 문장에 위치하고, 앞부분은 배경과 문제 상황, 뒷부분은 요청의 근거와 마무리로 이어지므로 \u003cb class=\"key\">중괄식\u003c/b> 전개에 해당합니다. 신호어로는 \u003cb class=\"key\">Despite\u003c/b>가 대조를, \u003cb class=\"key\">Therefore\u003c/b>가 결론이나 결과를 나타내며 글의 논리적 흐름을 보여줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Despite (3)\u003c/b>\u003cspan>대조·양보\u003c/span>\u003cb>Therefore (5)\u003c/b>\u003cspan>결론·결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">funding\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">budgetary constraints\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">documentation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">submitted documentation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">review result\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 편지는 서류 제출 후 응답이 없다는 문제를 제기하고, 그 해결책으로 검토 결과 통지를 요청하는 문제와 해결 구조로 되어 있어요. 주제문인 요청이 다섯 번째 문장에 위치하고, 앞부분은 배경과 문제 상황, 뒷부분은 요청의 근거와 마무리로 이어지므로 중괄식 전개에 해당합니다. 이런 구조에서는 가운데 있는 핵심 요청을 정확히 찾는 것이 중요해요.","hl":"ty"},{"n":9,"text":"신호어를 볼게요. 세 번째 문장의 Despite는 양보와 대조를 나타내며, 서류를 제출했음에도 불구하고 응답이 없다는 상황을 강조해요. 다섯 번째 문장의 Therefore는 앞선 문제에 대한 결론이나 결과를 이끌어내며, 검토 결과 통지 요청으로 자연스럽게 연결해 줍니다. 또 funding이 budgetary constraints으로, documentation이 submitted documentation이나 review result로 바뀌어 표현되는 재진술도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>with regard to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 관하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>funding\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자금 지원\u003c/span>\u003c/div>\u003cdiv>\u003cb>construction project\u003c/b>\u003cem>명사\u003c/em>\u003cspan>건축 프로젝트\u003c/span>\u003c/div>\u003cdiv>\u003cb>additional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>추가의\u003c/span>\u003c/div>\u003cdiv>\u003cb>fully functional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>완전하게 제 기능을 하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>Art and Library Media Center\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미술·도서관 미디어 센터\u003c/span>\u003c/div>\u003cdiv>\u003cb>serve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>봉사하다, 서비스를 제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>meaningful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의미 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>Despite\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에도 불구하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>submitting\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>required documentation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>필요한 서류\u003c/span>\u003c/div>\u003cdiv>\u003cb>notification\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통지\u003c/span>\u003c/div>\u003cdiv>\u003cb>delay\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지연\u003c/span>\u003c/div>\u003cdiv>\u003cb>process\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과정\u003c/span>\u003c/div>\u003cdiv>\u003cb>considerable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상당한\u003c/span>\u003c/div>\u003cdiv>\u003cb>consequences\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>related to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 관련된\u003c/span>\u003c/div>\u003cdiv>\u003cb>budgetary constraints\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예산 제한\u003c/span>\u003c/div>\u003cdiv>\u003cb>schedule\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일정\u003c/span>\u003c/div>\u003cdiv>\u003cb>proceed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>request\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요청하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>notify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>통지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>review result\u003c/b>\u003cem>명사\u003c/em>\u003cspan>검토 결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>look forward to hearing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>답변을 고대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Respectfully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>존경을 담아, 삼가\u003c/span>\u003c/div>\u003cdiv>\u003cb>Principal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교장\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚어 볼게요. with regard to는 '~에 관하여'라는 뜻이고, funding은 '자금 지원', documentation은 '서류'라는 뜻이에요. delay는 '지연', considerable은 '상당한'이라는 의미로, 지연이 상당한 결과를 초래할 수 있다는 표현에 쓰였어요. 그리고 proceed는 '진행하다', notify는 '통지하다'라는 뜻으로, 요청 부분에서 중요한 단어들이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">funding\u003c/b>\u003cspan class=\"m\">자금 지원\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">financing\u003c/span>\u003cspan class=\"s\">budget\u003c/span>\u003cspan class=\"s\">capital\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">debt\u003c/span>\u003cspan class=\"a\">expense\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">additional\u003c/b>\u003cspan class=\"m\">추가의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">extra\u003c/span>\u003cspan class=\"s\">supplementary\u003c/span>\u003cspan class=\"s\">further\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">basic\u003c/span>\u003cspan class=\"a\">essential\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">Despite\u003c/b>\u003cspan class=\"m\">~에도 불구하고\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">in spite of\u003c/span>\u003cspan class=\"s\">notwithstanding\u003c/span>\u003cspan class=\"s\">regardless of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">because of\u003c/span>\u003cspan class=\"a\">due to\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">delay\u003c/b>\u003cspan class=\"m\">지연\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">postponement\u003c/span>\u003cspan class=\"s\">hold-up\u003c/span>\u003cspan class=\"s\">setback\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">advance\u003c/span>\u003cspan class=\"a\">proceed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">request\u003c/b>\u003cspan class=\"m\">요청하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ask for\u003c/span>\u003cspan class=\"s\">seek\u003c/span>\u003cspan class=\"s\">demand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">notify\u003c/b>\u003cspan class=\"m\">통지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inform\u003c/span>\u003cspan class=\"s\">advise\u003c/span>\u003cspan class=\"s\">apprise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">considerable\u003c/b>\u003cspan class=\"m\">상당한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">substantial\u003c/span>\u003cspan class=\"s\">remarkable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insignificant\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어를 살펴볼게요. funding은 financing이나 budget과 비슷하고, 반의어로는 debt이나 expense가 있어요. additional은 extra나 supplementary와 비슷하고, 반의어는 basic이나 essential이에요. Despite는 in spite of나 notwithstanding과 비슷하고, because of나 due to와 반대되는 의미예요. delay는 postponement나 hold-up과 비슷하고, advance와 반대되죠. request는 ask for나 seek과 비슷하고, refuse나 deny와 반대돼요. notify는 inform이나 advise와 비슷하고, conceal이나 withhold와 반대 의미예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주 교육부 귀하,\u003c/span>\u003cspan class=\"en\">To the State Education Department,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 편지를 쓰고 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">am \u003c/span>\u003cspan class=\"tgt\">writing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~와 관련하여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">regard \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주 예산\u003c/span>\u003cspan class=\"en\">the state's funding\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건축 프로젝트를 위한\u003c/span>\u003cspan class=\"en\">for the construction project\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Fort Montgomery 고등학교에서\u003c/span>\u003cspan class=\"en\">at Fort Montgomery High School.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">주 교육부 귀하, 저는 Fort Montgomery 고등학교의 건축 프로젝트를 위한 주 예산과 관련하여 편지를 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지의 수신인과 \u003cb class=\"key\">작성 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 밝히는 첫 문장입니다. 'with regard to'는 '~에 관하여'라는 뜻의 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로 공식 서신에서 자주 쓰입니다. 이 문장은 이후 요청 내용을 전개하기 위한 도입부 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + -ing : \"저는 편지를 쓰고 있습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복합 전치사 (관용 표현)\u003c/span> : with regard to + 명사 : \"~와 관련하여\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"To the State Education Department, 주 교육부 귀하. I am writing, 저는 편지를 쓰고 있습니다. with regard to, ~와 관련하여. the state's funding, 주 예산. for the construction project, 건축 프로젝트를 위한. at Fort Montgomery High School, Fort Montgomery 고등학교에서. 이 문장 전체를 해석하면, 주 교육부 귀하, 저는 Fort Montgomery 고등학교의 건축 프로젝트를 위한 주 예산과 관련하여 편지를 씁니다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 State Education Department에게 편지를 쓰는 목적을 알리는 도입부예요. with regard to라는 관용 표현은 about과 같은 뜻으로, 공식적인 편지에서 자주 쓰입니다. 이 문장을 통해 앞으로 건축 프로젝트 예산에 관한 이야기를 할 거라는 것을 분명히 보여 줍니다.","hl":"mn"},{"n":14,"text":"이 문장에서 첫 번째로 with regard to를 보세요. with regard to는 뒤에 명사가 오는 복합 전치사로, about과 바꿔 쓸 수 있는 관용 표현입니다. 두 번째로 I am writing은 현재진행형으로, 지금 편지를 쓰는 동작을 예의 있게 표현한 것입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희 학교는 필요합니다\u003c/span>\u003cspan class=\"en\">Our school \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">추가 공간이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">additional \u003c/span>\u003cspan class=\"tgt\">spaces \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제공하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">provide\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전하게 제 기능을 하는 Art and Library Media Center를\u003c/span>\u003cspan class=\"en\">a fully functional Art and Library Media Center\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들을 만족시키기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">serve \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">students\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보다 의미 있는 방식으로\u003c/span>\u003cspan class=\"en\">in a more meaningful way.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저희 학교는 보다 의미 있는 방식으로 학생들을 만족시키기 위해 완전하게 제 기능을 하는 Art and Library Media Center를 제공하기 위한 추가 공간이 필요합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 학교가 왜 예산을 요청하는지 \u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">이유\u003c/b>를 설명하는 문장입니다. need additional spaces to provide... 구문으로 \u003cb class=\"key\">to부정사의 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 나타내며, to serve our students까지 이어져 학생들을 위한 공간의 목적을 강조합니다. 'fully functional'은 완전히 작동하는, 제 역할을 다하는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : need + 목적어 + to부정사 (목적) : \"제공하기 위해 추가 공간이 필요합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형 (목적) : \"학생들을 만족시키기 위해\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Our school needs, 저희 학교는 필요합니다. additional spaces, 추가 공간이. to provide, 제공하기 위해. a fully functional Art and Library Media Center, 완전하게 제 기능을 하는 Art and Library Media Center를. to serve our students, 학생들을 만족시키기 위해. in a more meaningful way, 보다 의미 있는 방식으로. 이 문장 전체를 해석하면, 저희 학교는 보다 의미 있는 방식으로 학생들을 만족시키기 위해 완전하게 제 기능을 하는 Art and Library Media Center를 제공하기 위한 추가 공간이 필요합니다.","hl":"m"},{"n":16,"text":"두 번째 문장은 학교가 예산을 요청하는 이유를 설명합니다. need와 함께 쓰인 to provide는 목적을 나타내는 to부정사로, 공간이 필요한 이유를 말해 줍니다. 또 to serve our students도 목적을 나타내며 학생들을 더 의미 있게 돕기 위한 것임을 강조합니다.","hl":"mn"},{"n":17,"text":"이 문장의 핵심은 to부정사의 목적 용법이에요. 첫 번째로 need additional spaces to provide에서 to provide는 공간이 필요한 목적을 나타냅니다. 두 번째로 to serve our students는 학생들을 만족시키기 위한 목적을 나타내며, provide와 이어져 전체적인 의도를 분명히 해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제출했음에도 불구하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Despite \u003c/span>\u003cspan class=\"tgt\">submitting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 요구되는 서류를\u003c/span>\u003cspan class=\"en\">all \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">required \u003c/span>\u003cspan class=\"tgt\">documentation\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예산을 위한\u003c/span>\u003cspan class=\"en\">for funding\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">귀하의 부서로\u003c/span>\u003cspan class=\"en\">to your department\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2024년 4월에\u003c/span>\u003cspan class=\"en\">in April 2024,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 아직 귀하의 부서로부터 어떠한 통지도 받지 못했습니다.\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">yet \u003c/span>\u003cspan class=\"tgt\">received\u003c/span> any notification from your department.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">2024년 4월에 귀하의 부서로 예산에 필요한 모든 서류를 제출했음에도 불구하고, 저희는 아직 귀하의 부서로부터 어떠한 통지도 받지 못했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 제출 이후에도 아직 답변이 없다는 \u003cb class=\"key\">현재완료\u003c/b>의 상황을 드러내는 문장입니다. 앞부분 'Despite submitting...'은 양보의 의미로, 필요한 절차를 모두 마쳤음에도 불구하고 아직 통지를 받지 못했다며 문제 상황을 전달합니다. 이를 통해 다음 문장에서 요청하는 근거를 마련합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 despite + 동명사\u003c/span> : Despite + -ing (동명사) : \"제출했음에도 불구하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : 과거분사 + 명사 : \"요구되는 서류\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재완료 부정\u003c/span> : have/has + not + 과거분사 + yet : \"아직 받지 못했습니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Despite submitting, 제출했음에도 불구하고. all required documentation, 모든 요구되는 서류를. for funding, 예산을 위한. to your department, 귀하의 부서로. in April 2024, 2024년 4월에. we have not yet received any notification from your department, 저희는 아직 귀하의 부서로부터 어떠한 통지도 받지 못했습니다.. 이 문장 전체를 해석하면, 2024년 4월에 귀하의 부서로 예산에 필요한 모든 서류를 제출했음에도 불구하고, 저희는 아직 귀하의 부서로부터 어떠한 통지도 받지 못했습니다.","hl":"m"},{"n":19,"text":"세 번째 문장은 서류를 제출했지만 아직 답을 받지 못했다는 현재 상황을 전달해요. Despite는 전치사로 뒤에 동명사를 취해서 비록 제출했지만이라는 양보의 뜻을 만들어 냅니다. have not yet received는 현재완료 부정으로, 과거에 제출한 일이 현재까지 이어지지 못하고 있음을 보여 줍니다.","hl":"mn"},{"n":20,"text":"이 문장의 첫 번째 포인트는 Despite입니다. Despite는 전치사이기 때문에 뒤에 명사 형태가 와야 하고, 동명사 submitting을 써서 제출했음에도 불구하고라는 양보의 의미를 나타냅니다. 두 번째는 required documentation입니다. 과거분사 required가 documentation을 수식해서 요구되는 서류라는 수동의 의미를 더합니다. 세 번째는 have not yet received입니다. 이는 현재완료 부정으로, 과거에 제출한 이후 지금까지 통지를 받지 못한 상태를 나타내며 yet이 아직의 의미를 강조합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과정상 지연은\u003c/span>\u003cspan class=\"en\">A delay in the process\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상당한 결과를 초래할 수 있고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">carry\u003c/span> considerable consequences\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교의 예산 제한 및 일정과 관련하여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">related \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">school's \u003c/span>\u003cspan class=\"tgt\">budgetary \u003c/span>\u003cspan class=\"tgt\">constraints \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">schedule\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">과정상 지연은 학교의 예산 제한 및 일정과 관련하여 상당한 결과를 초래할 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 과정상 지연이 학교의 \u003cb class=\"key\">예산 \u003c/b>\u003cb class=\"key\">제한\u003c/b>과 \u003cb class=\"key\">일정\u003c/b>에 상당한 결과를 초래할 수 있다고 경고합니다. 단순한 불편이 아니라 실제로 예산과 일정에 영향을 줄 수 있다는 점을 강조하여, 다음 문장에서 검토 결과 통지를 요청하는 \u003cb class=\"key\">근거\u003c/b>를 제공합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : can + [carry (동사원형)] : \"초래할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(후치 수식)\u003c/span> : consequences [related to ~ (과거분사구)] : \"학교의 예산 제한 및 일정과 관련된\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"A delay in the process, 과정상 지연은. can carry considerable consequences, 상당한 결과를 초래할 수 있고. related to the school's budgetary constraints and schedule, 학교의 예산 제한 및 일정과 관련하여. 이 문장 전체를 해석하면, 과정상 지연은 학교의 예산 제한 및 일정과 관련하여 상당한 결과를 초래할 수 있습니다.","hl":"m"},{"n":22,"text":"이 문장은 과정상 지연이 학교의 예산 제한과 일정에 상당한 결과를 초래할 수 있다고 경고해요. 단순히 불편한 정도가 아니라 실제로 예산과 일정에 영향을 줄 수 있다는 점을 강조해서 다음 요청의 근거가 되는 문장이에요.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 can carry예요. 조동사 can 뒤에는 동사원형 carry가 와서 가능성을 나타내요. 주어 A delay가 단수인데도 carries가 아니라 carry인 이유가 바로 조동사 뒤라서예요. 두 번째 어법 포인트는 related to the school's budgetary constraints and schedule이에요. related는 과거분사로 앞에 있는 명사 consequences를 뒤에서 수식하는 후치 수식 구조예요. consequences which are related to처럼 관계절로 바꿔 이해할 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로,\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희의 프로젝트를 진행하기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">proceed \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">project\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 요청합니다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">request \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">검토 결과를 저희에게 통지해 줄 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">notify \u003c/span>\u003cspan class=\"tgt\">us\u003c/span> of the review result\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제출 서류와 관련하여\u003c/span>\u003cspan class=\"en\">regarding the \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">submitted \u003c/span>\u003cspan class=\"tgt\">documentation\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로, 저희의 프로젝트를 진행하기 위해 제출 서류와 관련한 검토 결과를 저희에게 통지해 줄 것을 요청합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 편지의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">요청\u003c/b>을 직접적으로 표현합니다. 프로젝트를 계속 진행하기 위해 제출 서류에 대한 \u003cb class=\"key\">검토 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 알려 달라고 정중하지만 분명하게 요구하고 있습니다. in order to proceed with our project가 요청의 \u003cb class=\"key\">목적\u003c/b>을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : in order to + [proceed (동사원형)] : \"프로젝트를 진행하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">request + that + 주어 + 동사원형(가정법 현재)\u003c/span> : request + [(that) + you + notify (동사원형)] : \"당신이 저희에게 통지해 줄 것을 요청합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 수식(수동)\u003c/span> : submitted [과거분사] + documentation [명사] : \"제출된 서류\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Therefore, 그러므로. in order to proceed with our project, 저희의 프로젝트를 진행하기 위해. we request, 저희는 요청합니다. you notify us of the review result, 검토 결과를 저희에게 통지해 줄 것을. regarding the submitted documentation, 제출 서류와 관련하여. 이 문장 전체를 해석하면, 그러므로, 저희의 프로젝트를 진행하기 위해 제출 서류와 관련한 검토 결과를 저희에게 통지해 줄 것을 요청합니다.","hl":"m"},{"n":25,"text":"이 문장은 편지의 핵심 요청을 직접적으로 나타내요. 프로젝트를 계속 진행하기 위해서 제출 서류에 대한 검토 결과를 알려 달라고 정중하지만 분명하게 요구하는 부분이에요. in order to proceed with our project가 요청의 목적을 명확하게 보여줘요.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 in order to proceed with our project예요. in order to는 목적을 나타내는 to부정사 표현으로 프로젝트를 진행하기 위해라는 의미예요. 두 번째 어법 포인트는 we request you notify us예요. request는 that절을 목적어로 가질 수 있는데 that이 생략되고, 절 안에서 동사 원형 notify를 써서 요구를 나타내는 가정법 현재 구문이에요. 세 번째 어법 포인트는 submitted documentation이에요. submitted는 과거분사로 명사 documentation을 수식하며 제출된 서류라는 수동의 의미를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 고대합니다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">forward \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">귀하로부터의 소식을 듣기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">hearing\u003c/span> from you.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">귀하로부터의 답변을 고대합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 답변을 기다리겠다는 의사를 전하는 공식적인 \u003cb class=\"key\">마무리\u003c/b> 표현입니다. look forward to는 앞으로의 일을 기대한다는 뜻으로, 상대방에게 부드럽게 \u003cb class=\"key\">회신\u003c/b>을 촉구하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">look forward to + 동명사\u003c/span> : look forward to + [hearing (동명사)] : \"듣기를 고대하다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"I look forward to, 저는 고대합니다. hearing from you, 귀하로부터의 소식을 듣기를. 이 문장 전체를 해석하면, 귀하로부터의 답변을 고대합니다.","hl":"m"},{"n":28,"text":"이 문장은 상대방의 답변을 기다리겠다는 마음을 담은 공식적인 마무리 표현이에요. look forward to는 앞으로 일어날 일을 기대한다는 뜻이라서 편지에서 자주 쓰이는 정중한 표현이에요.","hl":"mn"},{"n":29,"text":"이 문장의 핵심 어법은 look forward to hearing이에요. look forward to에서 to는 to부정사가 아니라 전치사라서 뒤에 동사가 올 때는 반드시 동명사 형태인 hearing을 써야 해요. 그래서 I look forward to hear라고 하지 않고 I look forward to hearing이라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">존경을 담아\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Respectfully\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Clara Smith\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Clara \u003c/span>\u003cspan class=\"tgt\">Smith \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교장\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">Principal\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Fort Montgomery 고등학교\u003c/span>\u003cspan class=\"en\">Fort Montgomery High School\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Fort Montgomery 고등학교 교장, Clara Smith 드림\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 편지의 끝맺음으로, 보낸 사람의 신분과 소속을 밝혀 공식 서한의 형식을 갖추는 부분이다. \u003cb class=\"key\">Respectfully\u003c/b>는 공식 서한에서 정중함을 나타내는 맺음말이고, \u003cb class=\"key\">Clara \u003c/b>\u003cb class=\"key\">Smith\u003c/b>가 \u003cb class=\"key\">Fort \u003c/b>\u003cb class=\"key\">Montgomery \u003c/b>\u003cb class=\"key\">고등학교\u003c/b>의 교장임을 드러낸다. 따라서 이 편지가 학교장의 공식 요청임을 분명히 해 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 문장 수식 (공식 서한의 맺음말)\u003c/span> : [부사] + [이름/직함] : \"존경을 담아\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격 (이름과 직함)\u003c/span> : [고유명사] + [직함(명사)] : \"Clara Smith 교장\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Respectfully, 존경을 담아. Clara Smith, Clara Smith. Principal, 교장. Fort Montgomery High School, Fort Montgomery 고등학교. 이 문장 전체를 해석하면, Fort Montgomery 고등학교 교장, Clara Smith 드림","hl":"m"},{"n":31,"text":"이 문장은 편지의 맺음말로, 보낸 사람이 누구인지 밝히는 부분입니다. Respectfully는 공손하게라는 뜻으로 공식 서한에서 정중함을 나타내고, Clara Smith가 Fort Montgomery 고등학교의 교장이라는 신분을 드러내죠. 그래서 이 편지가 학교장의 공식 요청 서한이라는 점을 분명히 해 줍니다.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 Respectfully입니다. 이건 공손하게라는 뜻의 부사로, 편지 끝에서 상대에 대한 예의를 나타내요. 두 번째 어법 포인트는 Clara Smith Principal입니다. Principal은 교장이라는 뜻으로, Clara Smith라는 이름과 동격으로 쓰여서 그 사람의 직함을 설명해 줍니다. 공식 서명에서는 이름과 직함을 이렇게 붙여서 신분을 밝히는 게 일반적이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Fort Montgomery 고등학교 교장은 \u003cb class=\"key\">주 \u003c/b>\u003cb class=\"key\">교육부\u003c/b>에 학교 \u003cb class=\"key\">건축 \u003c/b>\u003cb class=\"key\">프로젝트\u003c/b> 예산 지원과 관련하여 편지를 쓴다.\u003c/li>\u003cli>학교는 학생들에게 \u003cb class=\"key\">의미 \u003c/b>\u003cb class=\"key\">있는\u003c/b> 방식으로 서비스할 \u003cb class=\"key\">Art \u003c/b>\u003cb class=\"key\">and \u003c/b>\u003cb class=\"key\">Library \u003c/b>\u003cb class=\"key\">Media \u003c/b>\u003cb class=\"key\">Center\u003c/b>를 위해 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 필요하다.\u003c/li>\u003cli>\u003cb class=\"key\">2024년 \u003c/b>\u003cb class=\"key\">4월\u003c/b>에 필요한 서류를 제출했으나 아직 \u003cb class=\"key\">통지\u003c/b>를 받지 못했고, 지연은 \u003cb class=\"key\">예산 \u003c/b>\u003cb class=\"key\">제한\u003c/b>과 \u003cb class=\"key\">일정\u003c/b>에 상당한 결과를 초래할 수 있다.\u003c/li>\u003cli>따라서 프로젝트 진행을 위해 제출 서류에 대한 \u003cb class=\"key\">검토 \u003c/b>\u003cb class=\"key\">결과\u003c/b> 통지를 요청하며 답변을 기다린다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The principal of Fort Montgomery High School requests the State Education Department to notify them of the review result regarding the submitted funding documentation so that the construction project can proceed.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">본문은 Fort Montgomery 고등학교가 예산 지원을 위한 서류를 제출했으나 \u003cb class=\"key\">검토 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 받지 못해, 프로젝트 진행을 위해 \u003cb class=\"key\">예산 \u003c/b>\u003cb class=\"key\">검토 \u003c/b>\u003cb class=\"key\">결과\u003c/b> 통지를 요청하는 편지이다. 학교는 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 필요하며 지연 시 \u003cb class=\"key\">예산 \u003c/b>\u003cb class=\"key\">제한\u003c/b>과 \u003cb class=\"key\">일정\u003c/b>에 문제가 생길 수 있다고 강조한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘은 학교가 예산 지원 검토 결과를 요청하는 편지글을 분석해 보았어요. 문제와 해결 구조, 중괄식 전개, 그리고 다양한 신호어들을 통해 글의 논리적 흐름을 파악하는 연습을 했습니다. 이런 공식 편지글은 목적과 요청 사항을 정확히 찾는 것이 중요하니, 다음에도 비슷한 글을 만나면 오늘 배운 방법을 적용해 보세요. 수고 많았어요.","hl":null}]}]});</script></body></html>
