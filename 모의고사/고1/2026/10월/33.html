<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 33번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 33번","audioDir":"33_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">33번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Space as the Medium of Experience\u003c/h1>\u003ch2>경험의 매개체로서의 공간\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>모든 경험은 물리적 공간에서 일어나므로 \u003cb class=\"key\">공간\u003c/b>과 \u003cb class=\"key\">경험\u003c/b>은 분리될 수 없으며, 공간은 수동적 배경이 아니라 행동·생각·기억·감정을 담아내는 \u003cb class=\"key\">매개체\u003c/b>이다. 장소가 없다면 존재는 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>에 불과하다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Space and place are not passive backdrops but the very medium through which all experience—actions, thoughts, memories, and feelings—takes shape.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 살펴볼 지문은 공간과 장소에 관한 철학적이고 문학적인 글이에요. 이 글은 공간과 장소가 단순한 배경이 아니라 우리 경험을 담아내는 매개체라는 핵심 주장을 담고 있어요. 먼저 전체 내용을 요약하면 모든 경험은 물리적 공간에서 일어나므로 공간과 경험은 분리될 수 없고 장소가 없다면 존재는 추상적 개념에 불과하다는 것이에요. 자 그러면 본격적으로 함께 읽어 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 흔히 \u003cb class=\"key\">공간(space)\u003c/b>을 사건이 벌어지는 빈 무대나 \u003cb class=\"key\">배경(backdrop)\u003c/b>쯤으로 여기기 쉽습니다. 하지만 지리학이나 철학의 \u003cb class=\"key\">현상학(phenomenology)\u003c/b>에서는 장소(place)를 단순한 좌표가 아니라 인간 경험과 분리될 수 없는 의미의 덩어리로 봅니다. 예컨대 교실 책상에 새겨진 낙서는 그 자리에 앉았던 학생들의 \u003cb class=\"key\">기억(memory)\u003c/b>을 품고 있지요. Marcel Proust의 소설에서는 특정 공간이 주인공의 \u003cb class=\"key\">무의식적 \u003c/b>\u003cb class=\"key\">기억(involuntary \u003c/b>\u003cb class=\"key\">memory)\u003c/b>을 불러일으키는 핵심 장치로 등장합니다. 우리가 어떤 장소에서 겪은 일은 그 장소의 \u003cb class=\"key\">성격(character)\u003c/b>을 만들고, 그 성격이 다시 우리의 감정과 생각을 물들입니다.\u003c/div>","segs":[{"n":2,"text":"우리는 흔히 공간을 사건이 벌어지는 빈 무대 정도로 생각하기 쉽습니다. 하지만 이 글은 그 생각을 정면으로 반박해요. 지리학이나 철학에서는 장소 place를 단순한 좌표가 아니라 인간 경험과 얽힌 의미의 덩어리로 봅니다. 예를 들어 우리 교실의 책상에 새겨진 낙서는 그 자리에 앉았던 누군가의 기억 memory를 품고 있지요. 문학에서도 Marcel Proust의 소설은 특정 공간이 주인공의 무의식적 기억 involuntary memory을 불러일으키는 장치로 유명해요. 이런 배경을 알고 읽으면 공간이 수동적 배경 passive backdrop이 아니라 경험의 매개체 medium of experience라는 주장이 훨씬 와닿을 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>경험과 공간의 결합\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>모든 경험은 물리적 공간에서 일어나기 때문에, \u003cb class=\"key\">공간\u003c/b>은 그 안에서 일어난 \u003cb class=\"key\">사건\u003c/b>과 분리될 수 없습니다. 나무와 그 아래의 땅도 그곳에서 일어난 일과 \u003cb class=\"key\">불가분\u003c/b>의 관계입니다. 따라서 공간은 사건이 담기는 \u003cb class=\"key\">의미의 \u003c/b>\u003cb class=\"key\">그릇\u003c/b>으로 볼 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>수동적 배경 개념에 반박\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>이러한 \u003cb class=\"key\">뒤얽힘\u003c/b>은 장소를 단순한 \u003cb class=\"key\">수동적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>으로 보는 생각에 \u003cb class=\"key\">이의를 \u003c/b>\u003cb class=\"key\">제기\u003c/b>합니다. 공간과 장소는 결코 사건의 바깥에 놓인 무대가 아닙니다. 오히려 경험과 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">몸\u003c/b>으로 얽혀 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>공간적 틀의 매개체 역할\u003csmall>주장 · 문장 4\u003c/small>\u003c/h4>\u003cp>장소와 공간이 경험의 \u003cb class=\"key\">핵심\u003c/b>이라면, \u003cb class=\"key\">공간적 \u003c/b>\u003cb class=\"key\">틀\u003c/b>은 모든 경험의 \u003cb class=\"key\">매개체\u003c/b>입니다. 행동과 생각, 기억과 감정은 공간을 통해 생겨나고 \u003cb class=\"key\">조직\u003c/b>됩니다. 이는 공간을 경험의 \u003cb class=\"key\">외부\u003c/b>에 있는 배경으로 보는 통념과 대비됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>Proust의 비유와 결론\u003csmall>예시/근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>Poulet는 Proust의 소설에서 존재들이 장소로 자신을 감싼다고 말합니다. 이는 장소가 \u003cb class=\"key\">변장\u003c/b>이자 \u003cb class=\"key\">특징짓기\u003c/b> 역할을 한다는 뜻입니다. 장소가 없다면 존재는 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>에 불과할 것입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 볼게요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 공간과 경험이 분리될 수 없다는 사실을 제시해요. 모든 경험은 물리적 공간에서 일어나기 때문에 그 공간은 그 안에서 일어난 사건과 떨어질 수 없다는 거죠. 나무와 그 아래의 땅도 그곳에서 일어난 일과 불가분의 관계라고 말하고요. 그래서 공간은 사건이 담기는 의미의 그릇처럼 이해할 수 있습니다.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 장소를 수동적 배경으로 보는 생각에 이의를 제기합니다. 공간과 장소 그리고 경험이 이렇게 뒤얽혀 있다는 점이 그 통념에 도전하는 거예요. 이 문장의 challenges라는 단어가 전환의 신호입니다.","hl":"f1"},{"n":6,"text":"네 번째 문장에서는 이 글의 핵심 주장이 나옵니다. 장소와 공간이 경험의 핵심이라면 공간적 틀이 모든 경험의 매개체라는 거예요. 행동과 생각, 기억과 감정이 모두 공간을 통해 조직된다는 뜻입니다. 여기서 not merely라는 표현이 단순한 배경이라는 통념을 반박하고 있어요.","hl":"f2"},{"n":7,"text":"다섯 번째와 여섯 번째 문장에서는 조르주 풀레가 프루스트의 소설을 인용하며 이 주장을 뒷받침해요. 존재들은 자신이 있는 장소로 자신을 감싸는데 그것은 변장이자 동시에 그 사람을 특징짓는 옷과 같다고 말하죠. 장소가 없으면 존재는 추상적 개념에 불과하다는 말로 글을 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문단은 공간과 경험이 분리될 수 없음을 보여 주며 \u003cb class=\"key\">배경지식\u003c/b>을 제공합니다. 셋째 문장에서 \u003cb class=\"key\">수동적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>이라는 통념을 꺼내고 \u003cb class=\"key\">이의를 \u003c/b>\u003cb class=\"key\">제기\u003c/b>하며 전환합니다. 넷째 문장에서 핵심 주장인 \u003cb class=\"key\">공간적 \u003c/b>\u003cb class=\"key\">틀\u003c/b>의 매개체 역할을 제시합니다. 이후 Proust 예시로 주장을 \u003cb class=\"key\">뒷받침\u003c/b>하므로 주제문이 중간에 있는 \u003cb class=\"key\">중괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>challenges (3)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>not merely (4)\u003c/b>\u003cspan>반박\u003c/span>\u003cb>made the point (5)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>Without places (6)\u003c/b>\u003cspan>결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">passive backdrop\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">background or context exterior to experience\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">abstractions\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>수동적 배경으로서의 장소\u003c/th>\u003cth>경험의 매개체로서의 공간\u003c/th>\u003c/tr>\u003ctr>\u003ctd>단지 배경이나 상황\u003c/td>\u003ctd>행동·생각·기억·감정의 매개체\u003c/td>\u003c/tr>\u003ctr>\u003ctd>경험의 외부에 존재\u003c/td>\u003ctd>경험의 핵심 그 자체\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 수동적 배경으로서의 장소라는 통념을 반박하는 구조예요. 주제문은 네 번째 문장에 있으니 중괄식 구조로 볼 수 있습니다. 앞부분에서는 공간과 경험의 분리 불가능성을 배경으로 깔고 뒷부분에서는 프루스트의 예시로 주장을 보강하죠. 따라서 읽을 때는 중간의 네 번째 문장을 중심으로 앞뒤 논리를 연결하는 게 중요해요.","hl":"ty"},{"n":9,"text":"신호어를 살펴보면 세 번째 문장의 challenges가 통념에 대한 반박을 알려 주고 네 번째 문장의 not merely가 외부 배경이라는 생각을 부정해요. 다섯 번째 문장의 made the point는 본격적인 예시로 넘어가는 표시이고 마지막 문장의 without places는 결론의 신호로 볼 수 있어요. 또한 passive backdrop과 background or context exterior to experience는 같은 통념을 바꿔 말한 재진술입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>very\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>바로 그, (강조) 정확히\u003c/span>\u003c/div>\u003cdiv>\u003cb>take place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>physical space\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물리적 공간\u003c/span>\u003c/div>\u003cdiv>\u003cb>inseparable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>분리될 수 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>define\u003c/b>\u003cem>동사\u003c/em>\u003cspan>규정하다, 정의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>event\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사건\u003c/span>\u003c/div>\u003cdiv>\u003cb>beneath\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~의 아래에\u003c/span>\u003c/div>\u003cdiv>\u003cb>intertwining\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뒤얽힘, 밀접한 결합\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이의를 제기하다, 도전하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>passive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수동적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>backdrop\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배경\u003c/span>\u003c/div>\u003cdiv>\u003cb>central\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중심적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>accept\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받아들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>spatial framework\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공간적 틀\u003c/span>\u003c/div>\u003cdiv>\u003cb>medium\u003c/b>\u003cem>명사\u003c/em>\u003cspan>매개체, 매체\u003c/span>\u003c/div>\u003cdiv>\u003cb>actions\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>thoughts\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생각\u003c/span>\u003c/div>\u003cdiv>\u003cb>memories\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기억\u003c/span>\u003c/div>\u003cdiv>\u003cb>feelings\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감정\u003c/span>\u003c/div>\u003cdiv>\u003cb>merely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>단지, 그저\u003c/span>\u003c/div>\u003cdiv>\u003cb>exterior\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>외부의, 바깥쪽의\u003c/span>\u003c/div>\u003cdiv>\u003cb>commonly supposed\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일반적으로 생각되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>literary critic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문학 평론가\u003c/span>\u003c/div>\u003cdiv>\u003cb>elegantly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>유려하게, 우아하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>surround\u003c/b>\u003cem>동사\u003c/em>\u003cspan>둘러싸다, 에워싸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>garment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의복, 옷\u003c/span>\u003c/div>\u003cdiv>\u003cb>disguise\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변장, 위장\u003c/span>\u003c/div>\u003cdiv>\u003cb>characterization\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특징짓기, 성격 묘사\u003c/span>\u003c/div>\u003cdiv>\u003cb>abstractions\u003c/b>\u003cem>명사\u003c/em>\u003cspan>추상적 개념, 추상물\u003c/span>\u003c/div>\u003cdiv>\u003cb>without\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~없이\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘 중에서는 inseparable과 intertwining이 공간과 경험의 밀접한 관계를 나타내는 핵심 단어예요. medium은 매개체라는 뜻으로 이 글의 주장을 이해하는 열쇠이고 backdrop은 배경이라는 뜻으로 반박의 대상이 되는 통념을 표현해요. 단어의 뜻뿐 아니라 긍정적 뉘앙스인지 부정적 뉘앙스인지도 함께 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">inseparable\u003c/b>\u003cspan class=\"m\">분리될 수 없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">indivisible\u003c/span>\u003cspan class=\"s\">integral\u003c/span>\u003cspan class=\"s\">intertwined\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">separable\u003c/span>\u003cspan class=\"a\">detachable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">challenge\u003c/b>\u003cspan class=\"m\">이의를 제기하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">question\u003c/span>\u003cspan class=\"s\">dispute\u003c/span>\u003cspan class=\"s\">contest\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accept\u003c/span>\u003cspan class=\"a\">support\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">passive\u003c/b>\u003cspan class=\"m\">수동적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inactive\u003c/span>\u003cspan class=\"s\">inert\u003c/span>\u003cspan class=\"s\">submissive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">active\u003c/span>\u003cspan class=\"a\">dynamic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">central\u003c/b>\u003cspan class=\"m\">중심적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">fundamental\u003c/span>\u003cspan class=\"s\">core\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">peripheral\u003c/span>\u003cspan class=\"a\">marginal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">medium\u003c/b>\u003cspan class=\"m\">매개체\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">vehicle\u003c/span>\u003cspan class=\"s\">means\u003c/span>\u003cspan class=\"s\">channel\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">background\u003c/span>\u003cspan class=\"a\">exterior\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">surround\u003c/b>\u003cspan class=\"m\">둘러싸다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">encircle\u003c/span>\u003cspan class=\"s\">envelop\u003c/span>\u003cspan class=\"s\">wrap\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003cspan class=\"a\">bare\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">abstraction\u003c/b>\u003cspan class=\"m\">추상적 개념\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">concept\u003c/span>\u003cspan class=\"s\">idea\u003c/span>\u003cspan class=\"s\">generality\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">concrete reality\u003c/span>\u003cspan class=\"a\">substance\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘의 동의어와 반의어를 정리해 볼게요. inseparable은 indivisible이나 integral과 바꿔 쓸 수 있고 반대는 separable이에요. challenge는 question이나 dispute와 유사하고 accept나 support와 반대입니다. passive는 inactive, inert와 비슷하고 active나 dynamic과 반대죠. central은 essential, fundamental과 통하고 peripheral과 대비됩니다. medium은 vehicle이나 means와 유사해요. surround는 encircle이나 wrap과 비슷하고 release와 반대입니다. 이렇게 묶어서 암기하면 독해 지문에서 어휘 문제가 나와도 빠르게 해결할 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 그 사실은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">fact \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 모든 경험이 물리적 공간에서 ‘일어난다’는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">experiences \u003c/span>\u003cspan class=\"tgt\">&quot;take \u003c/span>\u003cspan class=\"tgt\">place&quot; \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">physical \u003c/span>\u003cspan class=\"tgt\">space\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 공간을 그것을 규정하는 것으로부터 분리될 수 없게 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">space \u003c/span>\u003cspan class=\"tgt\">inseparable\u003c/span> from \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">defines \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 공간 안에서 일어난 사건으로부터\u003c/span>\u003cspan class=\"en\">from the event \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">place \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 모든 경험이 물리적 공간에서 ‘일어난다’는 바로 그 사실은, 그 공간을 그것을 규정하는 것, 즉 그 공간 ‘안’에서 일어난 사건으로부터 분리될 수 없게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 번째 문장은 \u003cb class=\"key\">공간\u003c/b>과 \u003cb class=\"key\">경험\u003c/b>이 분리될 수 없음을 선언하면서, 공간을 단순한 배경이 아니라 경험을 규정하는 실체로 끌어올린다. 핵심은 경험이 물리적 공간에서 \u003cb class=\"key\">일어난다\u003c/b>는 데 있으며, 그 사실이 공간과 사건을 \u003cb class=\"key\">불가분\u003c/b>으로 만든다. 뒤이어 나올 구체적인 예시와 논의를 이끄는 도입 주장 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격 that절\u003c/span> : the very fact that + 완전한 절 : \"우리의 모든 경험이 물리적 공간에서 ‘일어난다’는 바로 그 사실\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make의 5형식 구문 (목적격보어 형용사)\u003c/span> : make + 목적어(the space) + 목적격보어(inseparable) : \"공간을 분리될 수 없게 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : what + 불완전한 절 (defines의 주어가 없음) : \"그것을 규정하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">관계대명사 that (주격)\u003c/span> : 선행사(the event) + that + 불완전한 절 (took place의 주어가 없음) : \"그 공간 안에서 일어난 사건\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The very fact, 바로 그 사실은. that all of our experiences \"take place\" in a physical space, 우리의 모든 경험이 물리적 공간에서 ‘일어난다’는. makes the space inseparable from what defines it, 그 공간을 그것을 규정하는 것으로부터 분리될 수 없게 만든다. from the event that took place in it, 그 공간 안에서 일어난 사건으로부터. 이 문장 전체를 해석하면, 우리의 모든 경험이 물리적 공간에서 ‘일어난다’는 바로 그 사실은, 그 공간을 그것을 규정하는 것, 즉 그 공간 ‘안’에서 일어난 사건으로부터 분리될 수 없게 만든다.","hl":"m"},{"n":13,"text":"이 문장은 공간과 경험이 서로 분리될 수 없다는 핵심 주장을 담고 있어요. 공간이 단순한 배경이 아니라 그 공간을 규정하는 사건과 한 몸이라는 점을 강조하면서, 뒤에 나올 논의의 출발점을 만들어 줍니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 동격 that절이에요. fact라는 추상명사 뒤에 that절이 와서 그게 어떤 사실인지를 구체적으로 설명해 주죠. 두 번째로 make 목적어 목적격보어 구문이 나오는데요, makes the space inseparable은 공간을 분리될 수 없는 상태로 만든다는 의미입니다. 세 번째는 관계대명사 what이 what defines it에서 선행사 없이 그것을 규정하는 것이라는 명사절을 이루고 있어요. 네 번째로 that took place in it의 that은 선행사 the event를 받는 주격 관계대명사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나무와 그 아래의 땅은\u003c/span>\u003cspan class=\"en\">The tree and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ground \u003c/span>\u003cspan class=\"tgt\">beneath\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서 일어난 일과 분리될 수 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">inseparable \u003c/span>\u003cspan class=\"tgt\">from\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">place \u003c/span>\u003cspan class=\"tgt\">there\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 나무와 그 아래의 땅은 그곳에서 일어난 일과 분리될 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 원리를 \u003cb class=\"key\">나무\u003c/b>와 \u003cb class=\"key\">땅\u003c/b>이라는 구체적 예로 보여주는 문장이다. 나무와 그 아래 땅이 그곳에서 일어난 일과 \u003cb class=\"key\">불가분\u003c/b>이라는 점을 통해, 공간이 경험과 \u003cb class=\"key\">분리\u003c/b>될 수 없다는 \u003cb class=\"key\">예시\u003c/b>를 제시한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 후치수식\u003c/span> : 명사(the ground) + 부사(beneath) : \"그 아래의 땅\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be + 형용사 + 전치사 구문\u003c/span> : be + inseparable + from + 명사구 : \"~와 분리될 수 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : what + 불완전한 절 (took place의 주어가 없음) : \"그곳에서 일어난 일\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The tree and the ground beneath, 그 나무와 그 아래의 땅은. are inseparable from what took place there, 그곳에서 일어난 일과 분리될 수 없다. 이 문장 전체를 해석하면, 그 나무와 그 아래의 땅은 그곳에서 일어난 일과 분리될 수 없다.","hl":"m"},{"n":16,"text":"이 문장은 앞 문장의 주장을 나무와 땅이라는 구체적인 예로 보여줍니다. 나무와 그 아래의 땅이 그곳에서 일어난 일과 분리될 수 없다는 점을 통해 공간과 경험이 한 덩어리라는 걸 분명히 해요.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 the ground beneath의 어순이에요. beneath가 명사 뒤에서 그 땅을 뒤에서 수식해서 그 아래의 땅이라는 뜻이 됩니다. 두 번째로 are inseparable from은 무엇과 분리될 수 없다는 표현이고요. 세 번째로 what took place there에서 what은 선행사를 포함한 관계대명사로 그곳에서 일어난 일이라는 명사절을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공간, 장소, 그리고 경험의 이러한 뒤얽힘은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">intertwining \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">space, \u003c/span>\u003cspan class=\"tgt\">place, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">experience\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이의를 제기한다\u003c/span>\u003cspan class=\"en\">challenges\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수동적 배경으로서의 장소라는 개념에\u003c/span>\u003cspan class=\"en\">the idea of place \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">passive \u003c/span>\u003cspan class=\"tgt\">backdrop\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공간, 장소, 그리고 경험의 이러한 뒤얽힘은 수동적 배경으로서의 장소라는 개념에 이의를 제기한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞선 두 문장에서 말한 공간·장소·경험의 뒤얽힘을 바탕으로, 장소가 단지 \u003cb class=\"key\">수동적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>이라는 기존 생각에 \u003cb class=\"key\">이의\u003c/b>를 제기한다. 글의 논지를 전개하는 \u003cb class=\"key\">전환점\u003c/b> 역할을 하며, 뒤이어 나올 공간적 틀이 모든 경험의 매개체라는 주장의 \u003cb class=\"key\">발판\u003c/b>이 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어 (명사적 용법)\u003c/span> : This + 동명사(intertwining) + of + 명사구 : \"공간, 장소, 그리고 경험의 이러한 뒤얽힘은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as (~로서)\u003c/span> : as + 명사구(passive backdrop) : \"수동적 배경으로서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"This intertwining of space, place, and experience, 공간, 장소, 그리고 경험의 이러한 뒤얽힘은. challenges, 이의를 제기한다. the idea of place as passive backdrop, 수동적 배경으로서의 장소라는 개념에. 이 문장 전체를 해석하면, 공간, 장소, 그리고 경험의 이러한 뒤얽힘은 수동적 배경으로서의 장소라는 개념에 이의를 제기한다.","hl":"m"},{"n":19,"text":"이 문장은 장소가 수동적 배경이라는 기존 생각에 정면으로 이의를 제기합니다. 앞에서 말한 공간과 장소와 경험의 뒤얽힘을 근거로 삼아, 글의 논점을 본격적으로 전환하는 역할을 해요.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 This intertwining이에요. 동명사 intertwining이 주어 자리에 와서 공간, 장소, 경험이 뒤얽힌 상태를 명사처럼 표현합니다. 두 번째로 as passive backdrop에서 as는 ~로서라는 뜻으로, 장소를 수동적 배경으로 규정하는 기존 생각을 보여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 장소와 공간이 중심이라면 경험의 바로 그 핵심에서 우리는 가능성을 받아들여야 한다 공간적 틀이 모든 경험의 매개체라는 즉 모든 장소에서의 행동, 생각, 기억, 그리고 감정 단지 경험의 외부에 있는 배경이나 상황이 아닌 (일반적으로 생각되는 것처럼)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">place \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">space \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">central \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">heart \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">experience\u003c/span>, we must accept the possibility \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">spatial \u003c/span>\u003cspan class=\"tgt\">framework \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">medium \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">experiences\u003c/span> —actions, thoughts, memories, and feelings of every place —not merely a background or context \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">exterior \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">experience\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">(as \u003c/span>\u003cspan class=\"tgt\">commonly \u003c/span>\u003cspan class=\"tgt\">supposed).\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 장소와 공간이 경험의 바로 그 핵심의 중심이라면, 우리는 공간적 틀이 모든 경험, 즉 모든 장소에서의 행동, 생각, 기억, 그리고 감정의 매개체이며, (일반적으로 생각되는 것처럼) 단지 경험의 외부에 있는 배경이나 상황이 아니라는 가능성을 받아들여야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 장소와 공간이 경험의 핵심이라면, 공간적 틀이 단순한 \u003cb class=\"key\">배경\u003c/b>이 아니라 모든 경험을 담는 \u003cb class=\"key\">매개체\u003c/b>라는 가능성을 받아들여야 한다고 말해요. as commonly supposed는 일반적인 통념을 반박하는 표현이에요. 앞서 제기한 수동적 배경이라는 개념에 이의를 제기하는 흐름을 논리적으로 강화해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절(if절)\u003c/span> : If + 주어 + 동사(현재), 주어 + 조동사(must) + 동사원형 : \"만약 장소와 공간이 경험의 바로 그 핵심의 중심이라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격 that절\u003c/span> : the possibility + that + 완전한 절 : \"공간적 틀이 모든 경험의 매개체라는 가능성\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사구의 후치 수식\u003c/span> : a background or context + exterior to experience : \"경험의 외부에 있는 배경이나 상황\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">as + 과거분사(생략)\u003c/span> : as + 과거분사(supposed) : \"일반적으로 생각되는 것처럼\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"If place and space are central, 만약 장소와 공간이 중심이라면. to the very heart of experience, 경험의 바로 그 핵심에서. we must accept the possibility, 우리는 가능성을 받아들여야 한다. that the spatial framework is the medium of all experiences, 공간적 틀이 모든 경험의 매개체라는. —actions, thoughts, memories, and feelings of every place—, 즉 모든 장소에서의 행동, 생각, 기억, 그리고 감정. not merely a background or context exterior to experience, 단지 경험의 외부에 있는 배경이나 상황이 아닌. (as commonly supposed), (일반적으로 생각되는 것처럼). 이 문장 전체를 해석하면, 만약 장소와 공간이 경험의 바로 그 핵심의 중심이라면, 우리는 공간적 틀이 모든 경험, 즉 모든 장소에서의 행동, 생각, 기억, 그리고 감정의 매개체이며, (일반적으로 생각되는 것처럼) 단지 경험의 외부에 있는 배경이나 상황이 아니라는 가능성을 받아들여야 한다.","hl":"m"},{"n":22,"text":"이 문장은 장소와 공간이 경험의 핵심이라면 공간적 틀이 단순한 배경이 아니라 모든 경험을 담는 매개체라는 가능성을 받아들여야 한다고 말해요. as commonly supposed는 사람들이 흔히 그저 배경이라고만 생각한다는 기존 통념을 반박하는 표현이에요. 그래서 공간이 경험과 분리될 수 없다는 주장을 논리적으로 강화해 주는 역할을 하죠.","hl":"mn"},{"n":23,"text":"첫 번째 어법은 조건의 부사절이에요. If place and space are central to the very heart of experience에서 현재 시제 조건절이 오고, 주절에 must를 써서 논리적 필연성을 강조하고 있어요. 두 번째는 동격 that절인데요, the possibility that 이하는 possibility의 구체적인 내용을 설명하는 완전한 절이에요. 세 번째는 exterior to experience가 앞의 명사 background or context를 뒤에서 수식하는 형용사구의 후치 수식이에요. 네 번째는 as commonly supposed인데 as is commonly supposed에서 is가 생략된 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">벨기에의 문학 평론가 Georges Poulet는 그 점을 유려하게 말했다,\u003c/span>\u003cspan class=\"en\">Belgian literary critic Georges Poulet made the point elegantly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Marcel Proust의 위대한 소설 In Search of Lost Time에서 창조된 공간에 대해 쓰면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">writing \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">space\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">created \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Marcel \u003c/span>\u003cspan class=\"tgt\">Proust's \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">novel \u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">Search \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Lost \u003c/span>\u003cspan class=\"tgt\">Time\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“존재들은 자신들을 발견하게 되는 장소들로 스스로를 둘러싸는데,\u003c/span>\u003cspan class=\"en\">&quot;Beings surround themselves with the places \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">themselves\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람이 의복으로 자신을 감싸는 방식과 같다\u003c/span>\u003cspan class=\"en\">the way one wraps oneself up in a garment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 변장인 동시에 그 사람을 특징짓는 것이기도 하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">disguise \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">characterization\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">벨기에의 문학 평론가 Georges Poulet는 Marcel Proust의 위대한 소설 In Search of Lost Time에서 창조된 공간에 대해 다음과 같이 쓰면서 그 점을 유려하게 말했다. “존재들은 자신들을 발견하게 되는 장소들로 스스로를 둘러싸는데, 이는 어떤 사람이 변장인 동시에 그 사람을 특징짓는 것이기도 한 의복으로 자신을 감싸는 것과 같다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 조르주 풀레가 프루스트의 소설을 인용해 존재가 장소를 \u003cb class=\"key\">의복\u003c/b>처럼 두르고 있다고 말한 부분이에요. 의복은 \u003cb class=\"key\">변장\u003c/b>인 동시에 그 사람을 \u003cb class=\"key\">특징짓는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이라서, 장소도 우리를 숨기면서 드러내 준다는 뜻이에요. 앞서 말한 공간의 능동적 역할을 문학적 근거로 뒷받침해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(부대상황)\u003c/span> : S + V, + writing ~ (분사구문) : \"~에 대해 쓰면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : the space + created in ~ : \"~에서 창조된 공간\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계부사 where\u003c/span> : the places + where + 완전한 절 : \"그들이 자신들을 발견하게 되는 장소들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : a garment + that is + 보어(A and B) : \"변장인 동시에 특징짓는 것이기도 한\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Belgian literary critic Georges Poulet made the point elegantly, 벨기에의 문학 평론가 Georges Poulet는 그 점을 유려하게 말했다. writing of the space created in Marcel Proust's great novel In Search of Lost Time, Marcel Proust의 위대한 소설 In Search of Lost Time에서 창조된 공간에 대해 쓰면서. \"Beings surround themselves with the places where they find themselves, “존재들은 자신들을 발견하게 되는 장소들로 스스로를 둘러싸는데. the way one wraps oneself up in a garment, 어떤 사람이 의복으로 자신을 감싸는 방식과 같다. that is at one and the same time a disguise and a characterization, 그것은 변장인 동시에 그 사람을 특징짓는 것이기도 하다. 이 문장 전체를 해석하면, 벨기에의 문학 평론가 Georges Poulet는 Marcel Proust의 위대한 소설 In Search of Lost Time에서 창조된 공간에 대해 다음과 같이 쓰면서 그 점을 유려하게 말했다. “존재들은 자신들을 발견하게 되는 장소들로 스스로를 둘러싸는데, 이는 어떤 사람이 변장인 동시에 그 사람을 특징짓는 것이기도 한 의복으로 자신을 감싸는 것과 같다.","hl":"m"},{"n":25,"text":"이 문장은 조르주 풀레가 프루스트의 소설을 인용해서 존재가 장소를 의복처럼 두르고 있다고 말한 대목이에요. 의복은 변장이면서 동시에 그 사람을 특징짓는 것이기 때문에 장소도 우리를 숨기면서도 드러내 준다는 뜻이죠. 결국 장소가 수동적인 배경이 아니라 존재를 규정하는 능동적인 요소라는 걸 문학적 근거로 보여 줘요.","hl":"mn"},{"n":26,"text":"첫 번째 어법은 writing of the space에서 writing이 분사구문이에요. 주어 Georges Poulet과 능동 관계여서 ing 형태를 썼고, made the point와 동시에 일어나는 상황을 나타내요. 두 번째는 created in Marcel Proust's great novel In Search of Lost Time인데 과거분사 created가 앞의 the space를 뒤에서 수식하는 후치 수식이에요. 세 번째는 where they find themselves로, 장소를 나타내는 선행사 the places를 관계부사 where절이 수식하고 있어요. 네 번째는 that is at one and the same time a disguise and a characterization에서 that이 주격 관계대명사로 a garment를 수식하고, and로 disguise와 characterization을 병렬 연결하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장소가 없다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Without \u003c/span>\u003cspan class=\"tgt\">places, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">존재들은 단지 추상적 개념에 불과할 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">beings \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">abstractions\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">장소가 없다면, 존재들은 단지 추상적 개념에 불과할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 장소가 없으면 존재는 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>에 불과하다고 말해요. 장소가 있어야 구체적인 존재가 된다는 점을 \u003cb class=\"key\">가정법\u003c/b>으로 강조한 표현이에요. 풀레의 인용을 마무리하며 장소의 필수성을 압축적으로 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거(조건의 대용)\u003c/span> : Without + 명사, 주어 + would be + 보어 : \"장소가 없다면, 존재들은 단지 추상적 개념에 불과할 것이다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Without places, 장소가 없다면. beings would be only abstractions, 존재들은 단지 추상적 개념에 불과할 것이다.. 이 문장 전체를 해석하면, 장소가 없다면, 존재들은 단지 추상적 개념에 불과할 것이다.","hl":"m"},{"n":28,"text":"이 문장은 장소가 없다면 존재는 단지 추상적인 개념에 지나지 않는다고 말해요. 장소가 있어야 구체적인 존재가 된다는 점을 가정법으로 강조한 표현이에요. 앞에서 인용한 풀레의 말을 마무리하면서 장소의 필수성을 아주 압축적으로 보여 줘요.","hl":"mn"},{"n":29,"text":"첫 번째 어법은 가정법 과거예요. Without places가 if there were no places를 대신하는 조건의 대용 표현이고, 주절에 would be를 써서 현재 사실의 반대를 가정하고 있어요. 이렇게 without plus 명사로 조건을 제시하면 문장이 훨씬 간결해지죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>모든 경험은 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">공간\u003c/b>에서 일어나므로 공간은 그 안의 \u003cb class=\"key\">사건\u003c/b>과 분리될 수 없다.\u003c/li>\u003cli>공간·장소·경험의 \u003cb class=\"key\">뒤얽힘\u003c/b>은 장소를 \u003cb class=\"key\">수동적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>으로 보는 시각에 이의를 제기한다.\u003c/li>\u003cli>\u003cb class=\"key\">공간적 \u003c/b>\u003cb class=\"key\">틀\u003c/b>은 행동·생각·기억·감정을 담아내는 경험의 \u003cb class=\"key\">매개체\u003c/b>이다.\u003c/li>\u003cli>장소가 없다면 존재는 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>에 불과하다는 Proust의 비유가 이를 뒷받침한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Space and place are not passive backdrops but the very medium through which all experience—actions, thoughts, memories, and feelings—takes shape.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">모든 경험은 물리적 공간에서 일어나므로 \u003cb class=\"key\">공간\u003c/b>과 \u003cb class=\"key\">경험\u003c/b>은 분리될 수 없으며, 공간은 수동적 배경이 아니라 행동·생각·기억·감정을 담아내는 \u003cb class=\"key\">매개체\u003c/b>이다. 장소가 없다면 존재는 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>에 불과하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"정리해 볼게요. 모든 경험은 물리적 공간에서 일어나기 때문에 공간과 사건은 분리될 수 없고 그래서 장소는 수동적 배경이 아니라 경험의 매개체라는 것이 이 글의 핵심 주장입니다. 프루스트의 소설 속 존재와 장소의 관계는 이 주장을 문학적으로 보여 주는 근거였죠. 평소에 장소를 그냥 배경으로만 여겼다면 오늘 배운 내용을 떠올리며 주변 공간이 품고 있는 기억과 감정을 한 번 살펴보세요. 오늘 수업은 여기까지입니다. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
