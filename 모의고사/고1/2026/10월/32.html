<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 32번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 32번","audioDir":"32_audio","preview":false,"count":44,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">32번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Feeling Heard: Why Demonstrating Listening Matters\u003c/h1>\u003ch2>경청받는 느낌: 귀 기울였음을 보여 주는 것이 중요한 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사람들은 고객이든 아니든 \u003cb class=\"key\">경청받고 \u003c/b>\u003cb class=\"key\">있다고 \u003c/b>\u003cb class=\"key\">느끼기\u003c/b>를 원한다. 그 느낌이 생기려면 상대방이 주의를 기울이고 이해했음을 느끼는 데 더해, \u003cb class=\"key\">귀를 \u003c/b>\u003cb class=\"key\">기울였다는 \u003c/b>\u003cb class=\"key\">외적인 \u003c/b>\u003cb class=\"key\">신호\u003c/b>를 보여 줘야 하며, \u003cb class=\"key\">반응\u003c/b>이 없으면 실제 경청 여부를 알 수 없다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>To feel heard, people need attention, understanding, and especially an outward signal that the other person listened.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 사람들이 경청받고 있다고 느끼는 것이 왜 중요한지를 다룬 글이에요. 고객이든 아니든 우리는 모두 누군가 내 말에 귀를 기울이고 있다는 느낌을 원하죠. 이 글은 그 느낌이 생기려면 주의, 이해, 그리고 귀를 기울였다는 외적인 신호까지 필요하다고 말합니다. 특히 반응이 없으면 상대가 실제로 들었는지 알 수 없다는 점이 핵심이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 대화할 때 단순히 말을 듣는 hearing이 아니라, 상대가 내 말을 받아들였다는 \u003cb class=\"key\">경청\u003c/b>의 신호를 원한다. 고객 응대나 갈등 상황에서 \u003cb class=\"key\">적극적 \u003c/b>\u003cb class=\"key\">경청, \u003c/b>\u003cb class=\"key\">active \u003c/b>\u003cb class=\"key\">listening\u003c/b>은 말 내용을 주의 깊게 듣고, 이해했음을 표현하며, 질문이나 고개 끄덕임 같은 \u003cb class=\"key\">피드백, \u003c/b>\u003cb class=\"key\">feedback\u003c/b>으로 반응하는 소통 기술이다. 일상에서도 메신저의 읽음 표시는 있지만 답이 없는 이른바 \u003cb class=\"key\">읽씹\u003c/b>을 당하면, 상대가 글을 읽었는지조차 불안해진다. 이처럼 상대의 반응이 없으면 아무리 주의를 기울였다 해도 상대는 알 수 없다. 그래서 경청의 마지막 단계는 반드시 \u003cb class=\"key\">외적인 \u003c/b>\u003cb class=\"key\">신호\u003c/b>로 드러나는 것이다. 이 글은 그 신호의 중요성을 논리적으로 정리한다.\u003c/div>","segs":[{"n":2,"text":"여러분, 단순히 소리를 듣는 히어링 hearing과 적극적으로 의미를 받아들이는 리스닝 listening은 달라요. 상대방이 내 말을 제대로 들었는지 확인하려면 고개를 끄덕이거나 질문을 하는 피드백 feedback 같은 반응이 필요하죠. 일상에서도 메신저에서 읽음 표시만 뜨고 답이 없으면, 상대가 글을 읽었는지조차 불안해지는 경험 있죠? 이처럼 반응이 없으면 주의를 기울였어도 알 수 없기 때문에, 경청의 마지막 단계에서는 반드시 외적인 신호를 보여 줘야 해요. 이 지문은 그 핵심을 아주 논리적으로 설명하고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>경청받고 싶은 마음\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>사람들은 고객이든 아니든 \u003cb class=\"key\">경청받고 \u003c/b>\u003cb class=\"key\">있다고 \u003c/b>\u003cb class=\"key\">느끼기\u003c/b>를 원한다. 고객 서비스 센터에 전화하거나 관리자와 이야기하려 하거나 사무실로 찾아올 때도, 상대가 \u003cb class=\"key\">우려 \u003c/b>\u003cb class=\"key\">사항\u003c/b>에 귀를 기울이고 해결해 줄 것처럼 느끼길 바란다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>경청의 세 가지 조건\u003csmall>주장 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>경청받고 있다고 느끼려면 세 가지가 일어나야 한다. 첫째, 상대가 말한 내용에 \u003cb class=\"key\">주의를 \u003c/b>\u003cb class=\"key\">기울였다\u003c/b>는 느낌, 둘째, 말한 내용을 \u003cb class=\"key\">이해했다\u003c/b>는 느낌, 셋째, 상대가 \u003cb class=\"key\">귀를 \u003c/b>\u003cb class=\"key\">기울였다는 \u003c/b>\u003cb class=\"key\">것을 \u003c/b>\u003cb class=\"key\">보여 \u003c/b>\u003cb class=\"key\">주는\u003c/b> 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>반응 없는 대화의 문제\u003csmall>근거 · 문장 7–11\u003c/small>\u003c/h4>\u003cp>이 마지막 부분이 \u003cb class=\"key\">핵심\u003c/b>이다. 아무런 \u003cb class=\"key\">반응\u003c/b>도 보여 주지 않는 사람과 이야기한다고 상상해 보면, 그가 주의를 기울이고 완전히 이해했을지도 모르지만, 외적인 \u003cb class=\"key\">신호\u003c/b>가 없으면 실제로 들었는지 알 수 없다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 첫 문장에서 사람들은 고객이든 아니든 경청받고 있다고 느끼기를 원한다고 말해요. 이어서 고객 서비스 센터에 전화하거나 관리자와 이야기하려 하거나 사무실로 찾아올 때도, 상대가 자신의 우려 사항에 귀를 기울이고 해결해 줄 것처럼 느끼길 바란다고 예를 들어 주죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 경청받는 느낌을 위한 세 가지 조건이 제시돼요. 첫째, 상대방이 자신이 말한 것에 주의를 기울인 것처럼 느껴야 하고, 둘째, 상대방이 이해한 것처럼 느껴야 해요. 그리고 셋째, 상대방이 귀를 기울였다는 것을 보여 줘야 한다는 조건이 나와요. 이 세 가지가 모두 필요하다는 거죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 마지막 조건이 왜 핵심인지 설명해요. 아무런 반응도 보여 주지 않는 사람과 이야기한다고 상상해 보라는 거예요. 그 사람이 우리 말에 주의를 기울였고 완전히 이해했을지도 모르지만, 귀를 기울였다는 외적인 신호가 없으면 실제로 그랬는지 알 수 없다고 말하죠. 즉 경청은 반응으로 드러나야 완성된다는 뜻이에요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 사람들이 \u003cb class=\"key\">경청받고 \u003c/b>\u003cb class=\"key\">있다고 \u003c/b>\u003cb class=\"key\">느끼기\u003c/b>를 원한다는 핵심 주장을 제시하고, 이후 세 가지 조건과 마지막 조건의 중요성을 근거로 설명하는 \u003cb class=\"key\">주장-근거\u003c/b> 구조이다. 첫 문장이 중심 내용을 먼저 밝히므로 \u003cb class=\"key\">두괄식\u003c/b>에 해당한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>일반적 욕구를 세 가지 조건으로 전환\u003c/span>\u003cb>First (4)\u003c/b>\u003cspan>첫 번째 조건 제시\u003c/span>\u003cb>Second (5)\u003c/b>\u003cspan>두 번째 조건 제시\u003c/span>\u003cb>And third (6)\u003c/b>\u003cspan>세 번째 조건 제시\u003c/span>\u003cb>This last part (7)\u003c/b>\u003cspan>마지막 조건 강조\u003c/span>\u003cb>Imagine (8)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>But (11)\u003c/b>\u003cspan>반응 없는 상황의 문제 대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">feel heard\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">listening\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">feel heard\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">listened\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">listened\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">listened\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>반응 없는 상대\u003c/th>\u003cth>외적 신호를 보이는 상대\u003c/th>\u003c/tr>\u003ctr>\u003ctd>주의를 기울이고 이해했을 수 있음\u003c/td>\u003ctd>귀를 기울였음을 표현함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>실제로 들었는지 알 수 없음\u003c/td>\u003ctd>경청했다는 것을 알 수 있음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 주장과 근거 구조로 볼 수 있어요. 처음에 사람들이 경청받고 있다고 느끼기를 원한다는 주장을 제시하고, 그다음에 그 느낌을 위한 세 가지 조건을 근거로 설명하죠. 특히 세 번째 조건이 핵심이라는 점을 반응이 없는 상황을 상상해 보라는 예시로 뒷받침하고 있어요. 그래서 첫 문장이 중심 내용을 먼저 밝히는 두괄식 구성으로 볼 수 있어요.","hl":"ty"},{"n":8,"text":"신호어를 보면 But은 앞의 일반적인 이야기를 세 가지 조건으로 전환해 주고, First, Second, And third는 조건을 순서대로 구분해 줘요. This last part는 세 번째 조건을 핵심으로 강조하는 표현이에요. 이어서 Imagine이 예시를 이끌고, 마지막 But은 반응 없음으로 인한 문제를 대조적으로 보여 줘요. feel heard와 listened처럼 같은 개념이 반복되는 점도 주목하면 좋아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>whether A or B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A이든 B이든\u003c/span>\u003c/div>\u003cdiv>\u003cb>otherwise\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그 외의 사람, 그렇지 않고\u003c/span>\u003c/div>\u003cdiv>\u003cb>feel heard\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>경청받고 있다고 느끼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>customer service\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고객 서비스\u003c/span>\u003c/div>\u003cdiv>\u003cb>ask to speak to a manager\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>관리자와 이야기하기를 요청하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>with something on one's mind\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>마음에 어떤 생각을 품은 채\u003c/span>\u003c/div>\u003cdiv>\u003cb>concern\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우려 사항\u003c/span>\u003c/div>\u003cdiv>\u003cb>address\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>happen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일어나다, 발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pay attention to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 주의를 기울이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>understand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>demonstrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다, 증명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>listen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>귀를 기울이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>key\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>핵심적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine -ing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 것을 상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>provide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>response\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>attend to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 주의를 기울이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>might have p.p.\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~했을지도 모른다\u003c/span>\u003c/div>\u003cdiv>\u003cb>completely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>without\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>some sort of\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어떤 종류의\u003c/span>\u003c/div>\u003cdiv>\u003cb>outward\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>외적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>signal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신호\u003c/span>\u003c/div>\u003cdiv>\u003cb>indicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타내다, 보여 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>whether or not\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~인지 아닌지\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"핵심 단어를 짚어 볼게요. address는 문제를 해결하다라는 뜻으로 우려 사항과 함께 자주 쓰이고, demonstrate는 말이나 표정, 행동으로 보여 주다라는 뜻이에요. outward signal은 외적인 신호라는 뜻으로, 이 글의 핵심 개념이죠. without과 whether or not 같은 표현도 문장 구조에서 꼭 알아 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">concern\u003c/b>\u003cspan class=\"m\">우려, 걱정\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">worry\u003c/span>\u003cspan class=\"s\">issue\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indifference\u003c/span>\u003cspan class=\"a\">unconcern\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">address\u003c/b>\u003cspan class=\"m\">해결하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">handle\u003c/span>\u003cspan class=\"s\">deal with\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">demonstrate\u003c/b>\u003cspan class=\"m\">보여 주다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show\u003c/span>\u003cspan class=\"s\">display\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">key\u003c/b>\u003cspan class=\"m\">핵심적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">outward\u003c/b>\u003cspan class=\"m\">외적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">external\u003c/span>\u003cspan class=\"s\">visible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">internal\u003c/span>\u003cspan class=\"a\">hidden\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">indicate\u003c/b>\u003cspan class=\"m\">나타내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show\u003c/span>\u003cspan class=\"s\">signal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이제 동의어와 반의어를 정리해 볼게요. concern은 worry나 issue와 바꿔 쓸 수 있고 반대는 indifference나 unconcern이에요. address는 handle이나 deal with와 유사하고 ignore나 neglect와 반대되죠. demonstrate는 show나 display와 통하고 hide나 conceal과는 반대예요. key는 crucial이나 essential과 같은 뜻이고 minor나 trivial과 반대되고, outward는 external이나 visible과 유사하며 internal이나 hidden과 반대죠. indicate도 show나 signal과 비슷하고 conceal이나 hide와 반대되는 표현이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은,\u003c/span>\u003cspan class=\"en\">People,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고객이든 그렇지 않든,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">customers \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">otherwise\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경청받고 있다고 느끼기를 원한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">heard\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들은, 고객이든 그렇지 않든, 경청받고 있다고 느끼기를 원한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모든 사람은 고객이든 아니든 \u003cb class=\"key\">경청받고 \u003c/b>\u003cb class=\"key\">싶은 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>를 지니고 있다는 글 전체의 전제를 제시하는 문장이다. whether customers or otherwise는 고객이든 아니든 모든 사람을 포함하는 \u003cb class=\"key\">삽입 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이다. 여기서 feel heard는 말한 내용이 상대방에게 받아들여졌다고 느끼다는 뜻으로, 뒤에 나올 세 가지 조건의 출발점이 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">whether A or B (양보의 삽입구)\u003c/span> : whether [A] or [B] (A이든 B이든) : \"고객이든 그렇지 않든\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 + 과거분사 보어\u003c/span> : want + to feel (to부정사 목적어) + heard (과거분사 보어) : \"경청받고 있다고 느끼기를 원한다\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"People, 사람들은. whether customers or otherwise, 고객이든 그렇지 않든. want to feel heard, 경청받고 있다고 느끼기를 원한다.. 이 문장 전체를 해석하면, 사람들은, 고객이든 그렇지 않든, 경청받고 있다고 느끼기를 원한다.","hl":"m"},{"n":12,"text":"첫 번째 문장은 글 전체의 핵심 전제를 제시해요. 사람들은 고객이든 아니든 모두 경청받고 싶어 한다는 당연한 원리를 말하면서, 뒤에 나올 세 가지 조건으로 자연스럽게 연결해 주는 문장이에요. whether customers or otherwise는 고객이든 아니든이라는 의미로 모든 사람을 포함한다는 것을 강조해요.","hl":"mn"},{"n":13,"text":"첫 번째 문장에서 whether customers or otherwise는 양보의 삽입구예요. whether가 이끄는 표현인데 뒤에 they are가 생략된 형태로 고객이든 아니든이라고 해석하면 돼요. 또 want to feel heard에서 want는 to부정사를 목적어로 취하고, feel heard의 heard는 과거분사 보어로 경청받은 상태, 즉 들림을 받은 상태를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가가 고객 서비스 센터에 전화를 하거나,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"tgt\">calls \u003c/span>\u003cspan class=\"tgt\">customer \u003c/span>\u003cspan class=\"tgt\">service, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관리자와 이야기하기를 요청하거나,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">asks \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">speak \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">manager, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 여러분의 사무실로 찾아오거나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">comes \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">office\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마음에 어떤 생각을 품은 채,\u003c/span>\u003cspan class=\"en\">with something on their mind,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 느끼기를 원한다\u003c/span>\u003cspan class=\"en\">they want to \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가가 자신의 우려 사항에 귀를 기울이고 있는 것처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">listening \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">concerns \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 해결해 줄 것처럼.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">address \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">누군가가 고객 서비스 센터에 전화를 하거나, 관리자와 이야기하기를 요청하거나, 마음에 어떤 생각을 품은 채 여러분의 사무실로 찾아올 때, 그들은 누군가가 자신의 우려 사항에 귀를 기울이고 그것을 해결해 줄 것처럼 느끼기를 원한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장의 원리를 뒷받침하는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 나열한 문장이다. 고객 서비스 센터에 전화하거나, 관리자를 요청하거나, 고민을 품고 사무실에 찾아오는 상황 모두에서 사람들은 자신의 우려를 \u003cb class=\"key\">경청\u003c/b>하고 해결해 주기를 바란다는 점을 보여 준다. listening to their concerns와 going to address them이 짝을 이루어 듣는 것에 그치지 않고 \u003cb class=\"key\">해결\u003c/b>까지 기대함을 나타낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">when 부사절과 병렬 구조\u003c/span> : When + S + V1, V2, or V3 : \"누군가가 고객 서비스 센터에 전화하거나, 관리자와 이야기하기를 요청하거나, 여러분의 사무실로 찾아올 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">feel like + 절\u003c/span> : feel like + [주어 + 동사 ~] : \"누군가가 자신의 우려 사항에 귀를 기울이고 그것을 해결해 줄 것처럼 느끼다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"When someone calls customer service, 누군가가 고객 서비스 센터에 전화를 하거나. asks to speak to a manager, 관리자와 이야기하기를 요청하거나. or comes into your office, 또는 여러분의 사무실로 찾아오거나. with something on their mind, 마음에 어떤 생각을 품은 채. they want to feel, 그들은 느끼기를 원한다. like someone is listening to their concerns, 누군가가 자신의 우려 사항에 귀를 기울이고 있는 것처럼. and going to address them, 그리고 그것을 해결해 줄 것처럼.. 이 문장 전체를 해석하면, 누군가가 고객 서비스 센터에 전화를 하거나, 관리자와 이야기하기를 요청하거나, 마음에 어떤 생각을 품은 채 여러분의 사무실로 찾아올 때, 그들은 누군가가 자신의 우려 사항에 귀를 기울이고 그것을 해결해 줄 것처럼 느끼기를 원한다.","hl":"m"},{"n":15,"text":"두 번째 문장은 첫 번째 문장의 원리를 구체적인 상황으로 설명해요. 고객 서비스 센터에 전화하거나 담당자와 이야기하려 하거나 고민을 가지고 사무실에 찾아오는 경우처럼 누군가가 자신의 말을 듣고 문제를 해결해 주기를 바라는 상황을 예로 들고 있어요. 결국 이 문장은 사람들이 단순히 반응만이 아니라 실제로 해결해 주는 것까지 기대한다는 점을 보여 줘요.","hl":"mn"},{"n":16,"text":"두 번째 문장에서 when이 이끄는 부사절 안에 calls, asks, comes라는 세 개의 동사가 or로 병렬 연결되어 있어요. 세 가지 상황이 모두 같은 형태의 동사로 나열되어야 병렬 구조가 자연스럽죠. 그리고 feel like 뒤에는 절이 와서 마치 누군가가 귀를 기울이고 해결해 줄 것처럼 느끼기를 원한다고 해석해요. address는 주소라는 뜻이 아니라 문제를 해결하다라는 뜻이라는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가가 경청받고 있다고 느끼기 위해서는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">heard\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세 가지가 이루어져야 한다.\u003c/span>\u003cspan class=\"en\">three things \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">happen\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 누군가가 경청받고 있다고 느끼기 위해서는, 세 가지가 이루어져야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 당연한 기대에 대해 But으로 전환하며, 경청받고 있다고 느끼기 위한 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">조건\u003c/b>을 예고하는 문장이다. for someone to feel heard는 누군가가 경청받고 있다고 느끼기 위해서는이라는 뜻으로 \u003cb class=\"key\">목적\u003c/b>을 나타낸다. 이 문장은 이후 문단에서 세 가지를 하나씩 설명하는 \u003cb class=\"key\">길잡이 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어\u003c/span> : for + [목적격] + to부정사 : \"누군가가 경청받고 있다고 느끼기 위해서는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">have to + 동사원형 (필요·의무)\u003c/span> : have to + [동사원형] : \"일어나야 한다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"But, 그러나. for someone to feel heard, 누군가가 경청받고 있다고 느끼기 위해서는. three things have to happen, 세 가지가 이루어져야 한다.. 이 문장 전체를 해석하면, 그러나 누군가가 경청받고 있다고 느끼기 위해서는, 세 가지가 이루어져야 한다.","hl":"m"},{"n":18,"text":"세 번째 문장은 앞 문장에서 말한 당연한 원리에 대해 그러나라고 전환을 걸면서 구체적 조건을 예고해요. 누군가가 경청받고 있다고 느끼기 위해서는 반드시 세 가지가 일어나야 한다고 말하고, 이후 문장에서 그 세 가지를 하나씩 설명할 거예요. 즉 이 문장은 글의 나머지 부분을 이끄는 길잡이 역할을 해요.","hl":"mn"},{"n":19,"text":"세 번째 문장에서 for someone to feel heard는 to부정사의 의미상 주어 구조예요. for 다음에 목적격 someone이 오고, 그다음 to부정사가 이어지면서 누군가가 느끼기 위해서라는 뜻을 만들어요. have to happen은 세 가지가 반드시 일어나야 한다는 의무와 필요를 나타내는 표현이에요. 이 구조를 통해서 세 가지가 선택이 아니라 필수라는 점을 강조하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫째,\u003c/span>\u003cspan class=\"en\">First,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 느껴야 한다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상대방이 주의를 기울였다는 것처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">person \u003c/span>\u003cspan class=\"tgt\">paid \u003c/span>\u003cspan class=\"tgt\">attention\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 말한 것에.\u003c/span>\u003cspan class=\"en\">to \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">첫째, 그들은 상대방이 자신들이 말한 것에 주의를 기울인 것처럼 느껴야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 '상대방이 내 말에 \u003cb class=\"key\">주의\u003c/b>를 기울였다는 느낌을 받아야 한다'는 첫 번째 조건입니다. 상대의 \u003cb class=\"key\">관심\u003c/b>이 말을 들을 준비가 되었는지 보여 주는 뜻으로, 'feel like'는 실제 여부가 아니라 화자의 \u003cb class=\"key\">느낌\u003c/b>이 중요함을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have to + 동사원형 (의무·필요)\u003c/span> : have to + feel (동사원형) : \"느껴야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">like 접속사 + S+V\u003c/span> : feel + like + S+V : \"상대방이 주의를 기울였다는 것처럼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : what + S + V : \"그들이 말한 것\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"First, 첫째. they have to feel, 그들은 느껴야 한다. like the other person paid attention, 상대방이 주의를 기울였다는 것처럼. to what they said, 그들이 말한 것에.. 이 문장 전체를 해석하면, 첫째, 그들은 상대방이 자신들이 말한 것에 주의를 기울인 것처럼 느껴야 한다.","hl":"m"},{"n":21,"text":"이 문장은 상대방이 내 말에 주의를 기울였다고 느끼는 것이 첫 번째 조건이라는 뜻이에요. 실제로 상대가 완벽하게 집중했는지는 알 수 없지만, 중요한 건 내가 그렇게 느끼는 거예요. 그래서 listen만큼 feel이 강조되는 문장이에요.","hl":"mn"},{"n":22,"text":"첫 번째 포인트는 have to feel이에요. have to는 의무나 필요를 나타내는 조동사로 뒤에 동사원형 feel이 오고, 여기서는 느껴야 한다로 해석해요. 두 번째 포인트는 feel like 뒤에 절이 온 거예요. like가 접속사로 쓰여서 상대방이 주의를 기울였다는 것처럼이라는 의미를 만들어요. 세 번째 포인트는 what they said인데, what은 선행사를 포함한 관계대명사로 그들이 말한 것이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둘째,\u003c/span>\u003cspan class=\"en\">Second,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 느껴야 한다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상대방이 이해했다는 것처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">person \u003c/span>\u003cspan class=\"tgt\">understood\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 말한 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">둘째, 그들은 상대방이 자신들이 말한 것을 이해한 것처럼 느껴야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 조건으로, 단순히 듣는 것을 넘어 \u003cb class=\"key\">내용\u003c/b>을 이해했는지가 중요합니다. 'understood what they said'는 상대가 말한 \u003cb class=\"key\">요지\u003c/b>를 제대로 파악했다는 뜻입니다. 첫째 조건과 짝을 이루며 진정한 \u003cb class=\"key\">경청\u003c/b>의 한 축을 이룹니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have to + 동사원형 (의무·필요)\u003c/span> : have to + feel (동사원형) : \"느껴야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">like 접속사 + S+V\u003c/span> : feel + like + S+V : \"상대방이 이해했다는 것처럼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : what + S + V : \"그들이 말한 것\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Second, 둘째. they have to feel, 그들은 느껴야 한다. like the other person understood, 상대방이 이해했다는 것처럼. what they said, 그들이 말한 것을.. 이 문장 전체를 해석하면, 둘째, 그들은 상대방이 자신들이 말한 것을 이해한 것처럼 느껴야 한다.","hl":"m"},{"n":24,"text":"두 번째 조건은 상대가 내 말을 이해했다고 느끼는 거예요. 단순히 소리를 듣는 게 아니라 내가 전달하려는 내용을 제대로 받아들였다는 느낌이 있어야 해요. feel like가 다시 나와서 첫 번째 조건과 짝을 이루고 있죠.","hl":"mn"},{"n":25,"text":"첫 번째 포인트는 have to feel이에요. have to는 의무를 나타내는 조동사로 뒤에 동사원형 feel이 왔고, 느껴야 한다로 해석해요. 두 번째 포인트는 feel like 다음에 절이 온 건데, 여기서 like는 접속사로 쓰여서 이해했다는 것처럼이라는 뜻을 만들어요. 세 번째 포인트는 what they said로, what은 선행사를 포함한 관계대명사이고 그들이 말한 것이라는 의미예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 셋째,\u003c/span>\u003cspan class=\"en\">And third,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상대방은 보여 줘야 한다\u003c/span>\u003cspan class=\"en\">the other person \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">demonstrate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 귀를 기울였다는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">listened\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 셋째, 상대방은 자신이 귀를 기울였다는 것을 보여 줘야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마지막 조건으로, 상대는 자신이 \u003cb class=\"key\">귀를 \u003c/b>\u003cb class=\"key\">기울였다\u003c/b>는 사실을 겉으로 \u003cb class=\"key\">드러내야\u003c/b> 합니다. 듣기만 하고 가만히 있으면 안 되고, 고개를 끄덕이거나 답을 하는 등의 \u003cb class=\"key\">외적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>가 필요하다는 뜻입니다. 이 문장은 다음 문장의 'This last part is key'와 연결되며 세 조건 중 \u003cb class=\"key\">핵심\u003c/b>을 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have to + 동사원형 (의무·필요)\u003c/span> : has to + demonstrate (동사원형) : \"보여 줘야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that 명사절 (목적어)\u003c/span> : demonstrate + that + S+V : \"그들이 귀를 기울였다는 것\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"And third, 그리고 셋째. the other person has to demonstrate, 상대방은 보여 줘야 한다. that they listened, 그들이 귀를 기울였다는 것을.. 이 문장 전체를 해석하면, 그리고 셋째, 상대방은 자신이 귀를 기울였다는 것을 보여 줘야 한다.","hl":"m"},{"n":27,"text":"세 번째 조건은 상대방이 자신이 귀를 기울였다는 사실을 보여 줘야 한다는 거예요. 아무리 듣고 이해했어도 겉으로 표현하지 않으면 상대는 알 수 없어요. 다음 문장에서 이 마지막 조건이 가장 중요하다고 말하고 있어요.","hl":"mn"},{"n":28,"text":"첫 번째 포인트는 has to demonstrate예요. have to는 의무를 나타내고 주어가 the other person이라 has to가 되었어요. 해석은 보여 줘야 한다가 됩니다. 두 번째 포인트는 that they listened인데, 이 that절은 demonstrate의 목적어 역할을 하는 명사절이에요. 그들이 귀를 기울였다는 것을 보여 주다라는 구조죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 마지막 부분은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">last \u003c/span>\u003cspan class=\"tgt\">part\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">핵심이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">key\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 마지막 부분이 핵심이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글쓴이가 앞서 제시한 세 가지 조건 중 마지막 조건이 가장 중요하다고 강조하는 문장입니다. 여기서 This last part는 '들었다는 것을 보여 주는 행동'을 가리키며, 그것이 \u003cb class=\"key\">핵심\u003c/b>임을 알려 줍니다. 이후 문장들에서 이 중요성을 뒷받침할 예시가 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 this\u003c/span> : This + [last part] (앞서 언급한 내용 지시) : \"이 마지막 부분은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 보어를 취하는 문장 구조\u003c/span> : 주어(This last part) + is + 주격보어(key) : \"핵심이다\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"This last part, 이 마지막 부분은. is key, 핵심이다.. 이 문장 전체를 해석하면, 이 마지막 부분이 핵심이다.","hl":"m"},{"n":30,"text":"이 문장은 앞서 나온 세 가지 조건 가운데 마지막 조건이 가장 중요하다고 강조하는 연결 문장이에요. This last part는 상대가 들었다는 것을 겉으로 보여 주는 행동을 가리키고, 그게 바로 핵심이라는 뜻이에요.","hl":"mn"},{"n":31,"text":"어법 포인트를 볼게요. 여기서 This last part는 지시대명사 This가 앞서 말한 세 번째 조건을 가리키며 그 마지막 부분이라는 뜻을 만들어요. is key는 이 주어의 상태가 핵심이라고 설명하는 구조예요. key가 형용사로 쓰여서 가장 중요하다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상해 보라\u003c/span>\u003cspan class=\"en\">Imagine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가와 이야기하는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">talking \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">someone\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무런 반응도 보여 주지 않는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">provided \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">response\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아무런 반응도 보여 주지 않는 사람과 이야기한다고 상상해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상대가 아무 반응도 보이지 않는 상황을 상상하게 하는 명령문입니다. 앞서 말한 세 번째 조건, 즉 들었다는 신호를 보여 주는 것이 왜 중요한지 설명하기 위한 \u003cb class=\"key\">가정\u003c/b> 상황을 제시합니다. 여기서 무반응인 상대는 이후 문장에서도 여전히 주의를 기울였을 가능성과 대비됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 (Imagine의 목적어)\u003c/span> : Imagine + [talking to someone (동명사구)] : \"누군가와 이야기하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : someone + [who + 동사(provided)] : \"아무런 반응도 보여 주지 않는\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Imagine, 상상해 보라. talking to someone, 누군가와 이야기하는 것. who provided no response, 아무런 반응도 보여 주지 않는. 이 문장 전체를 해석하면, 아무런 반응도 보여 주지 않는 사람과 이야기한다고 상상해 보라.","hl":"m"},{"n":33,"text":"이 문장은 아무 반응이 없는 사람과 대화하는 상황을 상상해 보라고 해요. 앞서 말한 세 번째 조건, 즉 들었다는 신호를 보여 주는 것이 왜 중요한지 설명하기 위한 예시로 보면 돼요. 상대가 무반응이면 우리 말에 주의를 기울였는지 알 수 없죠.","hl":"mn"},{"n":34,"text":"어법 포인트를 볼게요. 첫 번째로 talking to someone은 동명사구로 Imagine의 목적어 역할을 해요. 누군가와 이야기하는 것을 상상해 보라는 구조예요. 두 번째로 who provided no response는 주격 관계대명사 who가 선행사 someone을 수식해요. who 뒤에 주어가 없으니 주격이에요. provide no response는 아무런 반응도 보여 주지 않는다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주의를 기울였을지도 모른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">attended \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 말한 모든 것에\u003c/span>\u003cspan class=\"en\">everything \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">said\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 우리가 말한 모든 것에 주의를 기울였을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 반응이 없는 사람도 우리가 말한 모든 것에 \u003cb class=\"key\">주의\u003c/b>를 기울였을 가능성은 있다고 인정하는 문장입니다. 그러나 겉으로 드러난 신호가 없으므로 그것을 실제로 알 수 없다는 논리를 이어 가고 있습니다. 다음 문장에서 완전히 이해했을 가능성을 덧붙여 외적 신호의 필요성을 더 강하게 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 have 과거분사 (과거 추측)\u003c/span> : might + have + attended (과거분사) : \"주의를 기울였을지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that 생략\u003c/span> : everything + [(that) + we + said] : \"우리가 말한\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"They, 그들은. might have attended to, 주의를 기울였을지도 모른다. everything we said, 우리가 말한 모든 것에. 이 문장 전체를 해석하면, 그들은 우리가 말한 모든 것에 주의를 기울였을지도 모른다.","hl":"m"},{"n":36,"text":"이 문장은 반응이 없는 사람도 우리가 말한 모든 것에 주의를 기울였을 가능성은 있다고 인정하는 문장이에요. 하지만 겉으로 드러난 신호가 없으니 우리는 그것을 알 수 없다는 논리를 펼치고 있어요. 그래서 다음 문장에서 완전히 이해했을 수도 있다는 내용과 이어지면서 외적 신호의 필요성을 뒷받침해요.","hl":"mn"},{"n":37,"text":"어법 포인트를 볼게요. 첫 번째로 might have attended to는 might have 뒤에 과거분사가 온 형태로 과거에 주의를 기울였을지도 모른다는 약한 추측을 나타내요. attend to는 주의를 기울이다라는 숙어예요. 두 번째로 we said는 everything 뒤에서 목적격 관계대명사 that이 생략된 채 선행사를 꾸며 줘요. 우리가 말한 모든 것이란 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 심지어 ~일지도 모른다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해했을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">understood\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 완전히.\u003c/span>\u003cspan class=\"en\">it completely.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 심지어 그것을 완전히 이해했을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 말한, 반응이 전혀 없는 상대를 가정하며 그 상대가 우리 말을 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">이해했을\u003c/b> 가능성까지 인정하는 부분입니다. 하지만 이것은 어디까지나 \u003cb class=\"key\">추측\u003c/b>일 뿐 실제로 확인된 것은 아닙니다. 뒤에 이어질 문장의 핵심, 즉 겉으로 드러나는 \u003cb class=\"key\">신호\u003c/b>가 있어야 들었다는 것을 알 수 있다는 논리로 연결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 + have + 과거분사 (과거 추측)\u003c/span> : might + (even) + have + p.p. (과거에 대한 추측) : \"이해했을지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"They might even, 그들은 심지어 ~일지도 모른다. have understood, 이해했을. it completely, 그것을 완전히.. 이 문장 전체를 해석하면, 그들은 심지어 그것을 완전히 이해했을지도 모른다.","hl":"m"},{"n":39,"text":"이 문장은 바로 앞 문장과 짝을 이뤄서, 아무 반응이 없는 상대가 우리 말을 주의 깊게 들었을 뿐 아니라 완전히 이해했을 수도 있다는 가능성을 인정하는 거예요. 하지만 might have p.p.가 쓰여서 단순한 추측, 즉 실제로 확인된 사실이 아니라 그럴 수도 있다는 뜻을 나타냅니다. 결국 겉으로 드러나는 신호가 없다면 이 모든 가능성은 확인할 수 없다는 다음 문장의 논리를 위한 전제가 됩니다.","hl":"mn"},{"n":40,"text":"이 문장의 어법 포인트는 might even have understood입니다. might have p.p.는 과거에 대한 불확실한 추측을 나타내는 표현이에요. 그래서 이해했을지도 모른다, 완전히 이해했을 수도 있다는 가능성으로 해석합니다. even은 그 사이에서 가능성을 더 강조해 주는 부사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 ~이 없이는\u003c/span>\u003cspan class=\"en\">But without\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 종류의 외적인 신호가\u003c/span>\u003cspan class=\"en\">some sort of outward signal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 귀를 기울였음을 보여 주는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">indicates \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">listened\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아는 것은 불가능하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">impossible \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 실제로 그렇게 했는지 아닌지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">actually \u003c/span>\u003cspan class=\"tgt\">did\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 그들이 귀를 기울였음을 보여 주는 어떤 종류의 외적인 신호가 없이는, 그들이 실제로 그렇게 했는지 아닌지를 아는 것은 불가능하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 핵심인 '들었다는 외적 신호'의 필요성을 가장 분명하게 보여 줍니다. 아무리 주의를 기울이고 완전히 이해했더라도, \u003cb class=\"key\">외현적 \u003c/b>\u003cb class=\"key\">신호\u003c/b> 없이는 상대가 들었다는 사실을 알 수 없다는 뜻입니다. 여기서 'whether or not they actually did'의 did는 앞의 listened를 대신하는 \u003cb class=\"key\">대동사\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 that (주격)\u003c/span> : 선행사 + that + 동사 (주격 관계대명사절) : \"그들이 귀를 기울였음을 보여 주는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가주어-진주어\u003c/span> : It is + 형용사 + to부정사 (가주어-진주어) : \"~하는 것은 불가능하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문 (whether or not)\u003c/span> : whether or not + 주어 + 동사 : \"그들이 실제로 그렇게 했는지 아닌지를\"\u003c/div>\u003c/div>","segs":[{"n":41,"text":"But without, 그러나 ~이 없이는. some sort of outward signal, 어떤 종류의 외적인 신호가. that indicates they listened, 그들이 귀를 기울였음을 보여 주는. it's impossible to know, 아는 것은 불가능하다. whether or not they actually did, 그들이 실제로 그렇게 했는지 아닌지를. 이 문장 전체를 해석하면, 그러나 그들이 귀를 기울였음을 보여 주는 어떤 종류의 외적인 신호가 없이는, 그들이 실제로 그렇게 했는지 아닌지를 아는 것은 불가능하다.","hl":"m"},{"n":42,"text":"이 문장은 앞 문장까지의 내용을 정리하면서, 주의를 기울이는 것과 이해하는 것만으로는 충분하지 않다는 핵심을 보여 줍니다. 겉으로 드러나는 신호, outward signal이 있어야만 상대가 내 말을 실제로 들었는지 알 수 있다는 거죠. whether or not they actually did에서 did는 listened를 대신하는 말이라는 것도 함께 기억해 두면 좋습니다.","hl":"mn"},{"n":43,"text":"첫 번째 어법 포인트는 that indicates they listened입니다. 여기서 that은 앞에 있는 outward signal을 선행사로 받는 주격 관계대명사예요. 신호가 그들이 들었다는 것을 보여 준다는 의미로 signal을 수식해 줍니다. 두 번째 어법 포인트는 it's impossible to know입니다. It은 가주어이고 to know 이하가 진짜 주어예요. 그래서 아는 것은 불가능하다라고 해석합니다. 세 번째 어법 포인트는 whether or not they actually did입니다. 이 부분은 know의 목적어로 쓰인 간접의문문이고, did는 앞에 나온 listened를 대신하는 대동사예요. 실제로 들었는지 아닌지를 묻는 표현입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사람들은 고객이든 아니든 \u003cb class=\"key\">경청받고 \u003c/b>\u003cb class=\"key\">있다고 \u003c/b>\u003cb class=\"key\">느끼기\u003c/b>를 원한다.\u003c/li>\u003cli>경청받는 느낌에는 세 가지 조건, 즉 주의를 기울였다는 느낌, 이해했다는 느낌, \u003cb class=\"key\">귀를 \u003c/b>\u003cb class=\"key\">기울였다는 \u003c/b>\u003cb class=\"key\">것을 \u003c/b>\u003cb class=\"key\">보여 \u003c/b>\u003cb class=\"key\">주는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 필요하다.\u003c/li>\u003cli>이 중 마지막 조건이 \u003cb class=\"key\">핵심\u003c/b>이다.\u003c/li>\u003cli>아무런 \u003cb class=\"key\">반응\u003c/b>이나 외적인 \u003cb class=\"key\">신호\u003c/b>가 없으면 상대가 실제로 들었는지 알 수 없다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>To feel heard, people need attention, understanding, and especially an outward signal that the other person listened.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사람들은 고객이든 아니든 \u003cb class=\"key\">경청받고 \u003c/b>\u003cb class=\"key\">있다고 \u003c/b>\u003cb class=\"key\">느끼기\u003c/b>를 원한다. 그 느낌이 생기려면 상대방이 주의를 기울이고 이해했음을 느끼는 데 더해, \u003cb class=\"key\">귀를 \u003c/b>\u003cb class=\"key\">기울였다는 \u003c/b>\u003cb class=\"key\">외적인 \u003c/b>\u003cb class=\"key\">신호\u003c/b>를 보여 줘야 하며, \u003cb class=\"key\">반응\u003c/b>이 없으면 실제 경청 여부를 알 수 없다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":44,"text":"오늘 글을 정리하면, 사람들은 경청받고 있다는 느낌을 원하고 그 느낌에는 주의와 이해에 더해 귀를 기울였다는 외적인 신호가 꼭 필요하다는 내용이었어요. 특히 아무런 반응이 없으면 상대가 실제로 들었는지 알 수 없다는 점이 마지막 핵심이었죠. 이 구조를 기억해 두면 비슷한 주장과 근거 글을 읽을 때 큰 도움이 될 거예요. 오늘 수업은 여기까지입니다. 수고했어요.","hl":null}]}]});</script></body></html>
