<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 38번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 38번","audioDir":"38_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">38번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>The Illusory Truth Effect: How Repetition Shapes Belief\u003c/h1>\u003ch2>진실 착각 효과: 반복이 믿음을 만드는 방식\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>1977년 실험에서 반복된 진술은 그렇지 않은 진술보다 \u003cb class=\"key\">진실성 \u003c/b>\u003cb class=\"key\">평가\u003c/b>가 높아졌고, 이는 \u003cb class=\"key\">반복\u003c/b>이 \u003cb class=\"key\">진실 \u003c/b>\u003cb class=\"key\">착각 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 일으킨다는 결론으로 이어진다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The more often a statement is repeated, the truer it sounds, a phenomenon known as the illusory truth effect.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 심리학자 해셔와 골드스타인이 진행한 실험을 다룬 글이에요. 반복해서 들으면 어떤 말이 더 진실처럼 느껴지는지, 그 현상을 정리한 내용이죠. 핵심 요지는, 어떤 진술을 더 자주 들을수록 더 사실처럼 들린다는 거예요. 이걸 진실 착각 효과라고 부릅니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 어떤 말을 자주 들으면 익숙해지고, 익숙한 정보는 별다른 검토 없이 \u003cb class=\"key\">참\u003c/b>으로 받아들이는 경향이 있습니다. 이를 심리학에서는 \u003cb class=\"key\">진실 \u003c/b>\u003cb class=\"key\">착각 \u003c/b>\u003cb class=\"key\">효과\u003c/b>(illusory truth effect)라고 부릅니다. 반복된 정보는 뇌가 처리할 때 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">용이성\u003c/b>(cognitive ease)을 느끼게 되어 판단이 더 편안해집니다. 예를 들어 광고 카피나 유행어, 루머 같은 것도 자주 노출되면 의심 없이 사실처럼 느껴지죠. 실험에서는 진술의 참·거짓과 상관없이 \u003cb class=\"key\">반복\u003c/b>만으로 믿음이 상승한다는 점을 확인했습니다. 이것은 우리의 기억과 판단이 단순한 노출 빈도에 의해 왜곡될 수 있음을 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"여러분도 광고 문구나 인터넷에서 도는 소문을 반복해서 보면 처음에는 별생각 없이 넘어가다가 점점 그 말이 사실인 것 같다고 느낀 적이 있을 거예요. 심리학에서는 이런 현상을 illusory truth effect, 즉 진실 착각 효과라고 해요. 반복된 정보는 뇌에서 처리할 때 cognitive ease, 인지적 용이성을 느끼게 해서 판단이 더 편안해지고 그 정보를 참으로 받아들이게 됩니다. 예를 들어 같은 노래 가사나 유행어도 자주 접하면 자연스럽고 진실처럼 느껴지죠. 이 지문의 실험은 진술이 실제로 참인지 거짓인지와 상관없이 반복만으로도 믿음이 올라간다는 걸 확인해 줘요. 그래서 반복의 힘이 우리 판단을 어떻게 흔드는지 잘 보여 주는 사례입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>실험 설계\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>심리학자들이 대학생들에게 60개의 \u003cb class=\"key\">일반 \u003c/b>\u003cb class=\"key\">상식\u003c/b> 진술을 참인지 거짓인지 평가하게 했습니다. 학생들은 2주 간격으로 세 번 평가했고, 그중 20개만 \u003cb class=\"key\">반복\u003c/b>되고 40개는 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">진술\u003c/b>이었습니다. 반복 여부가 핵심 변인으로 설정됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>반복 vs 비반복 비교\u003csmall>실험 결과 도출 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>연구자들은 반복된 진술과 비반복 진술의 \u003cb class=\"key\">진실성 \u003c/b>\u003cb class=\"key\">평가\u003c/b>를 비교했습니다. 그 결과는 \u003cb class=\"key\">놀라운\u003c/b> 수준이었습니다. 이제 구체적인 발견이 제시될 차례입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>반복의 효과\u003csmall>주장 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>진술의 참·거짓과 무관하게 \u003cb class=\"key\">반복\u003c/b>이 많을수록 \u003cb class=\"key\">진실성에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>이 상승했습니다. 즉 자주 들을수록 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">참인 \u003c/b>\u003cb class=\"key\">것처럼\u003c/b> 들린다는 말입니다. 이것이 글의 핵심 주장입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>효과의 명명\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>이 현상은 \u003cb class=\"key\">진실 \u003c/b>\u003cb class=\"key\">착각 \u003c/b>\u003cb class=\"key\">효과\u003c/b>라는 이름으로 알려지게 되었습니다. 반복이 진실 판단을 왜곡한다는 개념이 하나의 \u003cb class=\"key\">심리학 \u003c/b>\u003cb class=\"key\">용어\u003c/b>로 정리됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글은 실험 설계, 결과 비교, 반복의 효과, 그리고 용어 명명 순으로 전개됩니다.","hl":null},{"n":4,"text":"먼저 연구자들이 대학생들에게 일반 상식 진술을 평가하게 한 실험 설계가 나옵니다. 학생들은 예순 개의 statements를 세 번 평가했고, 그중 스무 개의 statements만 매번 반복되고 나머지는 새로운 진술이었어요. 여기서 crucially, 결정적으로라는 표현을 통해 반복 여부가 실험의 핵심 조건임을 강조하고 있습니다.","hl":"f0"},{"n":5,"text":"다음으로 연구자들은 repeated statements와 non-repeated statements의 truth ratings, 즉 진실성 평가를 비교했어요. 그 결과가 astonishing, 놀라운 수준이었다고 제시됩니다. 이제 구체적인 발견이 이어지죠.","hl":"f1"},{"n":6,"text":"핵심 결과는 regardless of, 즉 참이나 거짓에 상관없이 belief in the truth of the claim, 주장의 진실성에 대한 믿음이 반복의 작용에 따라 went up, 상승했다는 겁니다. 다시 말해 in other words, 더 자주 들을수록 true, 참인 것처럼 들린다는 뜻이에요. 이 부분이 지문의 주장을 가장 분명하게 보여 줍니다.","hl":"f2"},{"n":7,"text":"마지막으로 이 현상은 illusory truth effect, 즉 진실 착각 효과라는 이름으로 알려지게 되었다고 정리합니다. 반복이 진실 판단에 미치는 영향을 하나의 심리학 용어로 명명한 셈이에요. 이렇게 글이 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">반복된 진술과 비반복 진술의 \u003cb class=\"key\">진실성 \u003c/b>\u003cb class=\"key\">평가\u003c/b>를 비교하는 실험 구조입니다. 실험 결과를 바탕으로 반복이 진실감을 높인다는 \u003cb class=\"key\">인과적 \u003c/b>\u003cb class=\"key\">결론\u003c/b>을 내리고, 마지막 문장에서 \u003cb class=\"key\">진실 \u003c/b>\u003cb class=\"key\">착각 \u003c/b>\u003cb class=\"key\">효과\u003c/b>라는 용어로 명명합니다. 결론이 마지막에 제시되므로 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Crucially (3)\u003c/b>\u003cspan>핵심 조건 강조\u003c/span>\u003cb>Then (4)\u003c/b>\u003cspan>절차 연결\u003c/span>\u003cb>What they found was (5)\u003c/b>\u003cspan>결과 제시\u003c/span>\u003cb>Regardless of (6)\u003c/b>\u003cspan>양보·조건\u003c/span>\u003cb>In other words (7)\u003c/b>\u003cspan>재진술\u003c/span>\u003cb>This became known as (8)\u003c/b>\u003cspan>명명·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">truth-ratings\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">belief in the truth of the claim\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the more 'true' it sounds\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">illusory truth effect\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>반복된 진술(repeated statements)\u003c/th>\u003cth>비반복 진술(non-repeated statements)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>매번 반복 노출됨\u003c/td>\u003ctd>매번 새로운 진술로 교체됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>진실성 평가 상승\u003c/td>\u003ctd>진실성 평가 상승 없음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 지문은 반복된 진술과 비반복 진술을 비교하는 실험 구조로 되어 있어요. 실험 결과를 바탕으로 반복이 진실감을 높인다는 인과적 결론을 내리고, 마지막에 illusory truth effect라는 용어로 명명합니다. 결론이 마지막에 제시되는 미괄식 구조이기 때문에 주제문은 일곱 번째 문장에 해당해요. 반복 여부에 따른 평가 차이를 정리하면서 읽으면 글 전체가 선명해집니다.","hl":"ty"},{"n":9,"text":"신호어를 짚어 볼게요. 세 번째 문장의 crucially는 실험에서 반복 여부가 결정적이라는 조건을 강조해요. 다섯 번째 문장의 what they found was는 결과를 제시하는 신호이고, 여섯 번째 문장의 regardless of는 참과 거짓이라는 조건을 넘어서는 양보의 표현이에요. 일곱 번째 문장의 in other words는 앞의 결과를 rephrase, 다시 말해 재진술하는 표현이고, 마지막의 this became known as는 현상에 이름을 붙이는 결론 신호입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>psychologists\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심리학자들\u003c/span>\u003c/div>\u003cdiv>\u003cb>asked\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다, 요청하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>certain\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>확신하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>general-knowledge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일반 상식의\u003c/span>\u003c/div>\u003cdiv>\u003cb>trivia-like\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잡학적 지식 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>statements\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진술(문)\u003c/span>\u003c/div>\u003cdiv>\u003cb>evaluate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>평가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at two-week intervals\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>2주 간격으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>crucially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>결정적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>repeated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>반복된\u003c/span>\u003c/div>\u003cdiv>\u003cb>new\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>새로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>compared\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비교했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>truth-ratings\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진실성 평가\u003c/span>\u003c/div>\u003cdiv>\u003cb>versus\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~대비, ~에 비해\u003c/span>\u003c/div>\u003cdiv>\u003cb>astonishing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>regardless of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 상관없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>belief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>믿음\u003c/span>\u003c/div>\u003cdiv>\u003cb>claim\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주장\u003c/span>\u003c/div>\u003cdiv>\u003cb>went up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>올라갔다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as a function of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 따라, ~의 작용으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>repetition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반복\u003c/span>\u003c/div>\u003cdiv>\u003cb>in other words\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 말해\u003c/span>\u003c/div>\u003cdiv>\u003cb>sounds\u003c/b>\u003cem>동사\u003c/em>\u003cspan>들린다\u003c/span>\u003c/div>\u003cdiv>\u003cb>became known as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 알려지게 되었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>illusory truth effect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진실 착각 효과\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘에서 주목할 단어는 truth ratings, repetition, illusory truth effect입니다. truth ratings는 진실성 평가, repetition은 반복, illusory truth effect는 진실 착각 효과로 정리해 두면 지문의 중심 용어가 잡혀요. 특히 went up은 수치가 상승했다는 결과 표현으로 시험에 자주 나옵니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">certain\u003c/b>\u003cspan class=\"m\">확신하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sure\u003c/span>\u003cspan class=\"s\">confident\u003c/span>\u003cspan class=\"s\">convinced\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uncertain\u003c/span>\u003cspan class=\"a\">doubtful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">evaluate\u003c/b>\u003cspan class=\"m\">평가하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assess\u003c/span>\u003cspan class=\"s\">judge\u003c/span>\u003cspan class=\"s\">appraise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">astonishing\u003c/b>\u003cspan class=\"m\">놀라운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">surprising\u003c/span>\u003cspan class=\"s\">amazing\u003c/span>\u003cspan class=\"s\">startling\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unsurprising\u003c/span>\u003cspan class=\"a\">predictable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">belief\u003c/b>\u003cspan class=\"m\">믿음\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conviction\u003c/span>\u003cspan class=\"s\">confidence\u003c/span>\u003cspan class=\"s\">trust\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003cspan class=\"a\">disbelief\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">claim\u003c/b>\u003cspan class=\"m\">주장\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assertion\u003c/span>\u003cspan class=\"s\">statement\u003c/span>\u003cspan class=\"s\">contention\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refutation\u003c/span>\u003cspan class=\"a\">denial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">repeated\u003c/b>\u003cspan class=\"m\">반복된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recurrent\u003c/span>\u003cspan class=\"s\">recurring\u003c/span>\u003cspan class=\"s\">reiterated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">new\u003c/span>\u003cspan class=\"a\">novel\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">illusory\u003c/b>\u003cspan class=\"m\">착각의, 환상의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deceptive\u003c/span>\u003cspan class=\"s\">false\u003c/span>\u003cspan class=\"s\">unreal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">real\u003c/span>\u003cspan class=\"a\">true\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. certain은 확신하는이라는 뜻인데 sure, confident, convinced와 바꿔 쓸 수 있고 반대말은 uncertain, doubtful이에요. evaluate는 assess나 judge와 동의어이고, belief는 conviction, confidence와 유사하며 doubt, disbelief가 반대말입니다. claim은 assertion이나 statement와 연결되고, repeated는 recurrent, recurring과 의미가 가깝고 new나 novel이 반대예요. illusory는 deceptive, false와 가까운 말이고 real, true와 반대입니다. 이렇게 쌍으로 외워 두면 어휘 문제에 바로 써 먹을 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1977년, 심리학자 Lynn Hasher와 David Goldstein은 한 그룹의 대학생들에게 물었다 그들이 얼마나 확신하는지 60개의 일반 상식과 관련된 잡학적 지식 같은 진술문들이 참인지 거짓인지\u003c/span>\u003cspan class=\"en\">In 1977, psychologists Lynn Hasher and David Goldstein asked a group of college students \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">certain \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">were\u003c/span> that sixty general­knowledge trivia­like statements were \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">either \u003c/span>\u003cspan class=\"tgt\">true \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">false\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1977년, 심리학자 Lynn Hasher와 David Goldstein은 한 그룹의 대학생들에게 그들이 60개의 일반 상식과 관련된 잡학적 지식 같은 진술문들이 참인지 거짓인지를 얼마나 확신하는지 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 1977년 Hasher와 Goldstein이 대학생들에게 \u003cb class=\"key\">60개의 \u003c/b>\u003cb class=\"key\">일반 \u003c/b>\u003cb class=\"key\">상식 \u003c/b>\u003cb class=\"key\">잡학 \u003c/b>\u003cb class=\"key\">문장\u003c/b>을 주고 각각이 참인지 거짓인지 얼마나 \u003cb class=\"key\">확신\u003c/b>하는지 물었다는 실험의 출발점을 제시한다. 학생들이 문장을 단순히 맞히는 것이 아니라 \u003cb class=\"key\">확신의 \u003c/b>\u003cb class=\"key\">정도\u003c/b>를 보고했다는 점에서 이후 반복의 영향을 측정할 토대가 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : asked + [a group of college students] + [how certain they were (간접의문문)] : \"그들이 얼마나 확신하는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 either A or B\u003c/span> : [either] + [true] + [or] + [false] : \"참이거나 거짓인지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">형용사 certain의 that절 보어\u003c/span> : [were] certain + [that + S + V] : \"60개의 일반 상식 잡학 문장들이 참인지 거짓인지라는 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In 1977, psychologists Lynn Hasher and David Goldstein asked a group of college students, 1977년, 심리학자 Lynn Hasher와 David Goldstein은 한 그룹의 대학생들에게 물었다. how certain they were, 그들이 얼마나 확신하는지. that sixty general-knowledge trivia-like statements, 60개의 일반 상식과 관련된 잡학적 지식 같은 진술문들이. were either true or false, 참인지 거짓인지. 이 문장 전체를 해석하면, 1977년, 심리학자 Lynn Hasher와 David Goldstein은 한 그룹의 대학생들에게 그들이 60개의 일반 상식과 관련된 잡학적 지식 같은 진술문들이 참인지 거짓인지를 얼마나 확신하는지 물었다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 실험의 출발점이에요. 천구백칠십칠 년에 심리학자 Lynn Hasher와 David Goldstein이 대학생들에게 예순 개의 일반 상식 잡학 문장을 주고, 각각이 참인지 거짓인지 얼마나 확신하는지 물었어요. 학생들이 단순히 정답을 고른 것이 아니라 확신의 정도를 보고했다는 점이 중요해요.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 간접의문문이에요. asked a group of college students how certain they were 부분에서 how certain they were는 의문사 how가 이끄는 절이 asked의 목적어로 들어온 간접의문문이에요. 간접의문문은 의문사 다음에 주어와 동사가 평서문 어순을 따르죠. 두 번째 포인트는 certain 다음에 오는 that절이에요. certain that sixty general-knowledge trivia-like statements were either true or false에서 that절은 certain의 내용을 구체적으로 설명해 주는 절이에요. 세 번째 포인트는 상관접속사 either A or B예요. either true or false는 참과 거짓 둘 중 하나라는 뜻으로 true와 false를 대등하게 연결해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 학생들은 요청받았다 60개의 진술문을 평가하도록 세 번 2주 간격으로\u003c/span>\u003cspan class=\"en\">The students \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">asked\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">evaluate \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sixty \u003c/span>\u003cspan class=\"tgt\">statements\u003c/span> three times, at two­week intervals.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 학생들은 그 60개의 진술문을 2주 간격으로 세 번 평가하도록 요청받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 학생들이 \u003cb class=\"key\">예순 \u003c/b>\u003cb class=\"key\">개의 \u003c/b>\u003cb class=\"key\">문장\u003c/b>을 \u003cb class=\"key\">2주 \u003c/b>\u003cb class=\"key\">간격\u003c/b>으로 세 번 평가하도록 요청받았다는 실험 절차를 설명한다. 같은 문장을 일정한 \u003cb class=\"key\">간격\u003c/b>을 두고 반복 평가하게 함으로써 반복이 판단에 미치는 효과를 측정하려는 장치이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : [The students] + [were asked] + [to evaluate ~] : \"요청받았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 목적보어\u003c/span> : [were asked] + [to evaluate (to부정사구/목적보어)] : \"60개의 진술문을 평가하도록\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The students were asked, 그 학생들은 요청받았다. to evaluate the sixty statements, 60개의 진술문을 평가하도록. three times, 세 번. at two-week intervals, 2주 간격으로. 이 문장 전체를 해석하면, 그 학생들은 그 60개의 진술문을 2주 간격으로 세 번 평가하도록 요청받았다.","hl":"m"},{"n":16,"text":"두 번째 문장은 실험 절차를 설명해요. 학생들은 예순 개의 진술문을 두 주 간격으로 세 번 평가하도록 요청받았어요. 같은 문장을 반복해서 판단하게 함으로써 반복의 효과를 보려는 장치예요.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 수동태 were asked예요. 능동태로 하면 연구자들이 학생들에게 요청한 것이지만, 학생들이 주어로 나오면서 요청받았다는 수동태가 되었어요. 두 번째 포인트는 to evaluate the sixty statements에 있는 to부정사예요. 이 to부정사는 요청받은 행동의 내용을 나타내는 목적보어로, 수동태로 바뀌어도 그대로 남아 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결정적으로\u003c/span>\u003cspan class=\"en\">Crucially,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 진술문 중 오직 스무 개만\u003c/span>\u003cspan class=\"en\">only twenty of the statements\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매번 반복되었고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">repeated\u003c/span> each time;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나머지 마흔 개는 새로운 것이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">forty\u003c/span> were new.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결정적으로, 그 진술문 중 오직 20개만이 매번 반복되었고, 나머지 40개는 새로운 것이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 실험 설계의 핵심으로, \u003cb class=\"key\">60개\u003c/b> 중 \u003cb class=\"key\">20개\u003c/b>만 매번 반복되고 \u003cb class=\"key\">40개\u003c/b>는 매번 새로 제시된다는 조건을 제시한다. 반복되는 문장과 그렇지 않은 문장을 \u003cb class=\"key\">대조\u003c/b>해야 반복의 효과만 분리해 낼 수 있다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : [only twenty of the statements] + [were repeated] + [each time] : \"매번 반복되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">the other + 수사\u003c/span> : [the other] + [forty] : \"나머지 40개\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Crucially, 결정적으로. only twenty of the statements, 그 진술문 중 오직 스무 개만. were repeated each time, 매번 반복되었고. the other forty were new, 나머지 마흔 개는 새로운 것이었다. 이 문장 전체를 해석하면, 결정적으로, 그 진술문 중 오직 20개만이 매번 반복되었고, 나머지 40개는 새로운 것이었다.","hl":"m"},{"n":19,"text":"세 번째 문장은 실험 설계에서 가장 중요한 조건을 제시해요. 예순 개의 진술문 중에서 오직 스무 개만 매번 반복되고, 나머지 마흔 개는 매번 새로운 문장으로 바뀌었어요. 이렇게 반복되는 문장과 반복되지 않는 문장을 함께 제시해야 반복의 효과만 따로 비교할 수 있어요.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 were repeated라는 수동태예요. 진술문이 반복하는 주체가 아니라 반복되는 대상이기 때문에 수동태를 썼어요. 주어와 동사의 관계를 물을 때 능동과 수동을 구분해야 해요. 두 번째 포인트는 the other forty예요. 전체에서 스무 개를 제외한 나머지 전부를 가리킬 때 the other를 쓰고, 뒤에 statements가 생략되어 forty만 남은 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 다음 그 연구자들은 비교했다 ‘진실성 평가’를 반복된 진술문과 반복되지 않은 진술문의\u003c/span>\u003cspan class=\"en\">The researchers then compared the 'truth­ratings' of the repeated versus non­repeated statements.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 다음 그 연구자들은 반복된 진술문과 반복되지 않은 진술문의 ‘진실성 평가’를 비교했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 실험의 다음 단계를 설명합니다. 연구자들이 학생들이 평가한 \u003cb class=\"key\">진실성 \u003c/b>\u003cb class=\"key\">평가\u003c/b>를 반복된 진술문과 반복되지 않은 진술문으로 나누어 \u003cb class=\"key\">비교\u003c/b>했다는 뜻이에요. 여기서 versus는 '~대'라는 뜻으로, 두 집단을 대조하여 반복의 효과를 확인하려는 의도가 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : the + repeated / non-repeated + statements : \"반복된 진술문과 반복되지 않은 진술문\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The researchers then compared, 그런 다음 그 연구자들은 비교했다. the 'truth-ratings', ‘진실성 평가’를. of the repeated versus non-repeated statements, 반복된 진술문과 반복되지 않은 진술문의. 이 문장 전체를 해석하면, 그런 다음 그 연구자들은 반복된 진술문과 반복되지 않은 진술문의 ‘진실성 평가’를 비교했다.","hl":"m"},{"n":22,"text":"연구자들이 이번에는 반복된 진술문과 반복되지 않은 진술문에 대한 학생들의 진실성 평가를 서로 비교했습니다. versus는 두 집단을 대조할 때 쓰는 표현이라서, 반복 여부에 따라 평가가 어떻게 달라지는지 보려는 의도가 담겨 있어요. 이 비교를 통해 다음 문장에서 놀라운 결과가 나오게 됩니다.","hl":"mn"},{"n":23,"text":"여기서 문법 포인트는 the repeated versus non-repeated statements입니다. repeated와 non-repeated는 과거분사에서 온 형용사라서 뒤의 명사 statements를 꾸며 주고 있어요. versus를 사이에 두고 반복된 진술문과 반복되지 않은 진술문이 병렬 대조되고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 알아낸 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">found\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라웠다\u003c/span>\u003cspan class=\"en\">was astonishing.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들이 알아낸 것은 놀라웠다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 연구 결과가 예상을 뛰어넘는 놀라운 내용임을 알려 주는 전환 문장입니다. What they found가 주어로 쓰여 '그들이 알아낸 것'이라는 \u003cb class=\"key\">명사절\u003c/b> 역할을 하고, astonishing은 '놀라운'이라는 뜻입니다. 뒤에 이어질 구체적인 결과에 대한 \u003cb class=\"key\">기대감\u003c/b>을 높여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what (선행사 포함)\u003c/span> : What + 주어 + 동사(found) : \"그들이 알아낸 것\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"What they found, 그들이 알아낸 것은. was astonishing, 놀라웠다. 이 문장 전체를 해석하면, 그들이 알아낸 것은 놀라웠다.","hl":"m"},{"n":25,"text":"이 문장은 결과가 정말 놀라웠다는 것을 강조하는 전환 문장입니다. What they found는 그들이 알아낸 것이라는 뜻으로 명사절이 주어 자리에 왔어요. 뒤 문장에서 그 놀라운 내용이 구체적으로 설명됩니다.","hl":"mn"},{"n":26,"text":"문법 포인트는 What they found입니다. what은 선행사를 포함한 관계대명사이고, 뒤에 완전하지 않은 절이 와요. found의 목적어가 비어 있는데 그 자리를 what이 대신하고 있으니까, 그들이 알아낸 것이라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 진술문이 참이든 거짓이든 상관없이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Regardless \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">statement \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">true \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">false\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 주장의 진실성에 대한 믿음은\u003c/span>\u003cspan class=\"en\">belief in the truth of the claim\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반복의 작용에 따라 올라갔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">up\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">function \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">repetition\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 진술문이 참이든 거짓이든 상관없이, 그 주장의 진실성에 대한 믿음은 반복의 작용에 따라 올라갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 핵심 결과 문장으로, 진술의 참·거짓과 무관하게 \u003cb class=\"key\">반복\u003c/b>이 많을수록 진실성에 대한 \u003cb class=\"key\">믿음\u003c/b>이 올라간다는 뜻입니다. as a function of repetition은 '반복의 함수로', 즉 반복 횟수에 따라 달라진다는 표현이에요. 이것이 바로 앞 문장에서 말한 \u003cb class=\"key\">놀라운 \u003c/b>\u003cb class=\"key\">현상\u003c/b>의 정체입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Regardless of + whether 명사절\u003c/span> : Regardless of + whether S+V ~ or ~ : \"그 진술문이 참인지 거짓인지와 상관없이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 (자동사 + 부사)\u003c/span> : go up (자동사 + 부사) : \"올라갔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">as a function of (관용 표현)\u003c/span> : as a function of + 명사(repetition) : \"반복의 함수로, 반복에 따라\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Regardless of whether the statement was true or false, 그 진술문이 참이든 거짓이든 상관없이. belief in the truth of the claim, 그 주장의 진실성에 대한 믿음은. went up as a function of repetition, 반복의 작용에 따라 올라갔다. 이 문장 전체를 해석하면, 그 진술문이 참이든 거짓이든 상관없이, 그 주장의 진실성에 대한 믿음은 반복의 작용에 따라 올라갔다.","hl":"m"},{"n":28,"text":"이 문장이 이 글의 핵심입니다. 진술문이 참인지 거짓인지는 전혀 중요하지 않아요. 그 주장의 진실성에 대한 믿음이 반복의 작용에 따라 올라간다는 거죠. 반복이 많이 될수록 더 사실처럼 들리고 더 믿게 된다는 뜻이에요.","hl":"mn"},{"n":29,"text":"문법 포인트를 순서대로 짚어 볼게요. 첫 번째는 Regardless of whether the statement was true or false입니다. Regardless of가 전치사라서 whether 명사절이 목적어로 왔고, whether는 그 진술문이 참인지 거짓인지라는 뜻을 이끌어요. true or false는 병렬 구조로 연결되어 있습니다. 두 번째는 went up입니다. go up은 증가하다라는 뜻의 구동사이고, 주어 belief가 단수라서 과거형 went up으로 쓰였습니다. 세 번째는 as a function of repetition입니다. 여기서 function은 기능이 아니라 함수라는 뜻이라서 반복에 따라 달라진다는 표현이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 말해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">words\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 어떤 진술문을 더 자주 들을수록,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">hear \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">statement, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 더 ‘참인’ 것처럼 들린다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">'true' \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">sounds\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다시 말해, 여러분이 어떤 진술문을 더 자주 들을수록, 그것은 더 ‘참인’ 것처럼 들린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 실험 결과를 다시 정리하며, 반복이 많을수록 진술문이 \u003cb class=\"key\">참\u003c/b>처럼 느껴진다는 점을 압축한다. 'the more ~, the more ~' 구문으로 \u003cb class=\"key\">듣는 \u003c/b>\u003cb class=\"key\">횟수\u003c/b>와 \u003cb class=\"key\">진실성 \u003c/b>\u003cb class=\"key\">판단\u003c/b>의 비례 관계를 보여 준다. 다음 문장에서 이 현상을 명명하기 전에 그 원리를 쉽게 요약하는 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현\u003c/span> : in other words : \"다시 말해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">the 비교급 ~, the 비교급 구문\u003c/span> : the + 비교급 + S + V, the + 비교급 + S + V : \"더 자주 들을수록 더 참인 것처럼 들린다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In other words, 다시 말해. the more often you hear a statement, 여러분이 어떤 진술문을 더 자주 들을수록. the more 'true' it sounds, 그것은 더 ‘참인’ 것처럼 들린다.. 이 문장 전체를 해석하면, 다시 말해, 여러분이 어떤 진술문을 더 자주 들을수록, 그것은 더 ‘참인’ 것처럼 들린다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 확인한 실험 결과를 다시 말해 주고 있어요. 반복해서 들을수록 진술문이 참인 것처럼 느껴지는 거죠. 여기서 the more와 the more가 짝을 이루는 구문이 나오는데, 듣는 횟수가 늘어날수록 진실하게 느껴지는 정도도 함께 커진다는 뜻입니다.","hl":"mn"},{"n":32,"text":"어법 포인트를 짚어 볼게요. 첫 번째로 In other words는 다시 말해라는 뜻의 관용 표현으로, 앞의 내용을 같은 뜻으로 쉽게 바꿔 말할 때 씁니다. 두 번째로 the 비교급, the 비교급 구문을 봐야 해요. the more often you hear a statement, the more true it sounds처럼 비교급이 절의 앞에 나와서, 앞 절이 커질수록 뒤 절도 커진다는 상관관계를 나타냅니다. 이 어순은 시험에 자주 나오니까 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 ~로 알려지게 되었다\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">known \u003c/span>\u003cspan class=\"tgt\">as\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진실 착각 효과.\u003c/span>\u003cspan class=\"en\">the illusory truth effect.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 진실 착각 효과로 알려지게 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 설명한 현상에 \u003cb class=\"key\">illusory \u003c/b>\u003cb class=\"key\">truth \u003c/b>\u003cb class=\"key\">effect\u003c/b>라는 학술적 명칭을 붙여 주는 문장이다. \u003cb class=\"key\">This\u003c/b>는 반복을 통해 거짓 문장도 참처럼 느껴지는 현상을 가리킨다. 이 문장으로 문단 전체의 핵심 개념이 \u003cb class=\"key\">용어\u003c/b>로 정리된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">become known as (2형식 동사 구문)\u003c/span> : become + known(as + 명사) : \"~로 알려지게 되었다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"This became known as, 이것은 ~로 알려지게 되었다. the illusory truth effect, 진실 착각 효과.. 이 문장 전체를 해석하면, 이것은 진실 착각 효과로 알려지게 되었다.","hl":"m"},{"n":34,"text":"이 문장은 앞에서 설명한 반복의 효과에 이름을 붙여 주고 있어요. This는 바로 반복해서 들을수록 참처럼 느껴지는 현상을 가리키죠. 그 현상이 illusory truth effect, 즉 진실 착각 효과로 알려지게 되었다는 뜻입니다. illusory는 실제와 다른 착각이라는 뜻이니까, 진실이 아닌데도 진실처럼 느껴지는 효과라는 점을 기억하세요.","hl":"mn"},{"n":35,"text":"어법 포인트는 became known as입니다. become은 뒤에 보어를 취하는 동사라서, known이라는 과거분사와 함께 쓰여 알려지게 되었다는 상태 변화를 표현해요. 주어 This가 알려지는 대상이므로 수동의 의미가 되는 거죠. as 뒤에는 그 현상의 이름인 the illusory truth effect가 붙습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>1977년 심리학자들은 학생들에게 60개의 \u003cb class=\"key\">진술\u003c/b>을 세 번 평가하게 하며 20개만 \u003cb class=\"key\">반복\u003c/b>시켰다.\u003c/li>\u003cli>반복된 진술은 비반복 진술보다 \u003cb class=\"key\">진실성 \u003c/b>\u003cb class=\"key\">평가\u003c/b>가 높아졌다.\u003c/li>\u003cli>참·거짓과 무관하게 \u003cb class=\"key\">반복\u003c/b>이 많을수록 \u003cb class=\"key\">진실성에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>이 상승했다.\u003c/li>\u003cli>이 현상은 \u003cb class=\"key\">진실 \u003c/b>\u003cb class=\"key\">착각 \u003c/b>\u003cb class=\"key\">효과\u003c/b>로 알려지게 되었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The more often a statement is repeated, the truer it sounds, a phenomenon known as the illusory truth effect.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">1977년 실험에서 반복된 진술은 그렇지 않은 진술보다 \u003cb class=\"key\">진실성 \u003c/b>\u003cb class=\"key\">평가\u003c/b>가 높아졌고, 이는 \u003cb class=\"key\">반복\u003c/b>이 \u003cb class=\"key\">진실 \u003c/b>\u003cb class=\"key\">착각 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 일으킨다는 결론으로 이어진다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 글을 정리하면, 반복된 진술은 그렇지 않은 진술보다 진실성 평가가 높아졌고, 참과 거짓에 상관없이 반복이 많을수록 진실로 들린다는 것이 핵심입니다. 이것이 바로 진실 착각 효과예요. 이 현상은 정보 판단이 반복 빈도라는 비본질적 단서에 흔들릴 수 있음을 보여 주죠. 다음에 반복적으로 접하는 뉴스나 광고를 의심해 보는 습관을 기르며 오늘 강의를 마무리하겠습니다.","hl":null}]}]});</script></body></html>
