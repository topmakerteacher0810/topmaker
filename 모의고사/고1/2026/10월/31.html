<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 31번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 31번","audioDir":"31_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">31번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>What Star Trek Teaches Us About Generative AI and Abundance\u003c/h1>\u003ch2>스타트렉과 생성형 AI가 보여 주는 풍요의 경제학\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>고전 경제학은 \u003cb class=\"key\">희소성\u003c/b>을 전제로 시장과 가격 책정으로 재화를 배분하지만, Star Trek 세계는 기술과 교육 덕분에 \u003cb class=\"key\">풍요로움\u003c/b>을 누린다. \u003cb class=\"key\">생성형 \u003c/b>\u003cb class=\"key\">AI\u003c/b>는 우리 사회의 많은 측면을 그와 비슷하게 매우 풍요롭게 만들 잠재력이 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Viewing Star Trek through an economic lens reveals that technology and education can create abundance, and generative AI may bring similar abundance to our society.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 Star Trek 세계를 경제학적 관점으로 바라보면서 고전 경제학의 희소성과 대비되는 풍요의 사회를 설명하는 글입니다. 마지막에는 generative AI가 우리 사회를 그런 풍요로 이끌 수 있다는 요지를 제시합니다. 그럼 같이 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">고전 경제학은 \u003cb class=\"key\">희소성\u003c/b>(scarcity)을 기본 전제로 삼습니다. 세상에 모든 사람이 원하는 만큼 충분히 있는 것은 거의 없기 때문에, \u003cb class=\"key\">시장과 \u003c/b>\u003cb class=\"key\">가격 \u003c/b>\u003cb class=\"key\">책정\u003c/b>(market and pricing)으로 재화와 서비스, 자원을 가장 효율적으로 배분합니다. 예를 들어 매점의 인기 빵이 열 개뿐이면 가격이 오르거나 먼저 사 간 사람에게 돌아가죠. 반대로 Star Trek 같은 공상과학 세계는 기술이 워낙 발달해 음식을 복제하고, 순간이동하고, 별 사이를 여행할 수 있어 희소성이 거의 없는 탈희소성(post-scarcity) 사회입니다. \u003cb class=\"key\">생성형 \u003c/b>\u003cb class=\"key\">AI\u003c/b>(generative AI)는 이런 풍요를 현실의 일부 영역에서 가능하게 할 기술로 주목받고 있습니다.\u003c/div>","segs":[{"n":2,"text":"고전 경제학은 scarcity, 즉 희소성을 기본 전제로 삼아요. 세상에 모든 사람이 원하는 만큼 충분히 있는 것은 거의 없다는 거죠. 그래서 market과 pricing, 시장과 가격 책정을 통해 재화와 서비스, 자원을 가장 효율적으로 배분합니다. 예를 들어 매점에 인기 빵이 열 개뿐이면 가격이 오르거나 먼저 온 사람에게 돌아가게 돼요. 반대로 Star Trek 같은 공상과학 세계는 technology가 발달해서 음식을 reproduce하고 순간이동을 하며 별 사이를 여행할 수 있어 scarcity가 거의 없는 post-scarcity 사회입니다. generative AI는 이런 풍요를 현실의 일부 영역에서 가능하게 할 기술로 주목받고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>희소성의 경제학\u003csmall>도입·통념 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>첫 문장에서 Star Trek 세계를 \u003cb class=\"key\">경제학적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>으로 보면 곧 닥칠 세계를 들여다볼 수 있는 창이 된다고 말한다. 이어서 고전 경제학은 모든 사람이 원하는 것을 주기에는 대체로 어떤 것이든 \u003cb class=\"key\">충분하지 \u003c/b>\u003cb class=\"key\">않다\u003c/b>는 개념에 기초한다고 설명한다. 그 때문에 재화와 서비스, 자원을 가장 큰 이익이 나는 곳에 배분하기 위해 \u003cb class=\"key\">시장과 \u003c/b>\u003cb class=\"key\">가격 \u003c/b>\u003cb class=\"key\">책정\u003c/b>을 이용한다고 정리한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>스타트렉의 풍요\u003csmall>전환·예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>그러나 Star Trek에는 \u003cb class=\"key\">희소성\u003c/b>이 별로 없다고 반전을 제시한다. 기술이 그 사회에서 원하는 음식을 \u003cb class=\"key\">복제\u003c/b>하고, 눈 깜짝할 사이에 이동하며, 광년 거리로 통신하고, 별 사이를 여행할 수 있게 했다. 이는 기술이 희소성을 제거한 구체적 사례들이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>교육과 참여\u003csmall>근거 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>그 세계의 모든 인류는 \u003cb class=\"key\">풍요로움\u003c/b>에 참여할 수 있도록 \u003cb class=\"key\">충분히 \u003c/b>\u003cb class=\"key\">교육\u003c/b>을 받았다고 강조한다. 그래서 모든 사람이 탐험가, 연구원, 기술자, 예술가, 의사, 상담사 같은 역할을 하며 산다고 부연한다. 교육이 풍요의 혜택을 누리게 하는 전제 조건임을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>생성형 AI의 잠재력\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>마지막으로 \u003cb class=\"key\">생성형 \u003c/b>\u003cb class=\"key\">AI\u003c/b>가 우리 사회의 많은 측면을 \u003cb class=\"key\">마찬가지로 \u003c/b>\u003cb class=\"key\">매우 \u003c/b>\u003cb class=\"key\">풍요\u003c/b>롭게 만들 잠재력이 있다고 주장한다. 이는 기술이 희소성을 줄이고 풍요를 가져올 수 있다는 Star Trek의 교훈을 현실로 연결한다. 따라서 경제학적 관점에서 본 미래는 부족이 아니라 \u003cb class=\"key\">풍요의 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>으로 요약된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 크게 네 단계로 흐릅니다. 통념 제시, Star Trek 사례, 교육, 그리고 결론이에요.","hl":null},{"n":4,"text":"첫 번째 문장부터 세 번째 문장까지는 고전 경제학의 희소성 개념을 소개해요. 모든 사람이 원하는 것을 주기에는 충분하지 않다는 notion에서 출발하죠. 그래서 market과 pricing으로 재화와 서비스를 allocate한다고 설명합니다.","hl":"f0"},{"n":5,"text":"네 번째와 다섯 번째 문장에서는 Star Trek 세계로 전환돼요. 그 사회는 scarcity가 거의 없고 technology 덕분에 음식을 reproduce하고 순간이동하며 별 사이를 여행할 수 있다고 말해요.","hl":"f1"},{"n":6,"text":"여섯 번째와 일곱 번째 문장에서는 education의 역할을 강조해요. 모든 humanity가 풍요에 participate할 수 있도록 fully educated 되어 있고, 모두 explorer나 engineer, doctor 같은 역할을 하며 살아간다고 해요.","hl":"f2"},{"n":7,"text":"여덟 번째 문장은 결론이에요. generative AI가 우리 사회의 많은 측면을 similarly highly abundant 하게 만들 potential이 있다고 주장하죠. 이는 Star Trek의 풍요를 현실로 연결하는 마무리입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 첫 문장에서 Star Trek을 \u003cb class=\"key\">경제학적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>으로 보면 다가올 세계를 보여 준다고 제시한다. 중간에서는 고전 경제학의 희소성과 Star Trek의 풍요를 대조한다. 마지막 문장에서 \u003cb class=\"key\">생성형 \u003c/b>\u003cb class=\"key\">AI\u003c/b>가 우리 사회를 그와 비슷하게 풍요롭게 만들 잠재력이 있다고 결론짓는데, 이는 도입과 결론이 주제를 감싸는 \u003cb class=\"key\">양괄식\u003c/b> 구조다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But doing so (1)\u003c/b>\u003cspan>역접·전환\u003c/span>\u003cb>Because of that (3)\u003c/b>\u003cspan>원인·결과\u003c/span>\u003cb>However (4)\u003c/b>\u003cspan>대조·전환\u003c/span>\u003cb>In Star Trek, however (4)\u003c/b>\u003cspan>대조·전환\u003c/span>\u003cb>Generative AI has the potential (8)\u003c/b>\u003cspan>주장·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">isn't usually enough of anything\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">markets and pricing to allocate\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">isn't much scarcity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">participate in this prosperity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">similarly highly abundant\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>고전 경제학 (Classical economics)\u003c/th>\u003cth>Star Trek 세계 (Star Trek universe)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>희소성 존재\u003c/td>\u003ctd>희소성 거의 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>시장·가격으로 배분\u003c/td>\u003ctd>기술·교육으로 풍요 참여\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재화·서비스·자원 부족\u003c/td>\u003ctd>음식 복제·이동·통신·여행 가능\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 비교와 대조 구조를 취하면서도 처음과 끝이 주제를 감싸는 양괄식 전개를 보여 줍니다. 첫 번째 문장에서 경제학적 관점을 제시하고, 중간에서 고전 경제학의 희소성과 Star Trek의 풍요를 대조하죠. 마지막 문장에서 generative AI의 잠재력을 결론으로 다시 강조해요. 그래서 도입과 결론이 서로 호응하는 구조라고 정리할 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 살펴보면 첫 문장의 but doing so가 생각의 전환을 알려 주고요. 세 번째 문장의 Because of that는 원인과 결과를 연결해요. 네 번째 문장의 However는 고전 경제학과 Star Trek을 대조하는 결정적 신호입니다. 그리고 마지막 문장의 has the potential은 주장과 결론을 드러내는 표현이에요. 표현이 바뀌며 이어지는 재진술과 대조 지점을 함께 잡아 두면 좋아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>view\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보다, 여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>through an economic lens\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>경제학적 관점으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>provides a window into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 들여다볼 수 있는 창을 제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>classical economics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고전 경제학\u003c/span>\u003c/div>\u003cdiv>\u003cb>be based on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 기초하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>notion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개념\u003c/span>\u003c/div>\u003cdiv>\u003cb>enough\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>충분한\u003c/span>\u003c/div>\u003cdiv>\u003cb>allocate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>배분하다, 할당하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>goods\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재화\u003c/span>\u003c/div>\u003cdiv>\u003cb>services\u003c/b>\u003cem>명사\u003c/em>\u003cspan>서비스\u003c/span>\u003c/div>\u003cdiv>\u003cb>resources\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원\u003c/span>\u003c/div>\u003cdiv>\u003cb>scarcity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>희소성\u003c/span>\u003c/div>\u003cdiv>\u003cb>technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>reproduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>복제하다, 재생산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>transport\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이동시키다, 운송하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the blink of an eye\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>눈 깜짝할 사이에\u003c/span>\u003c/div>\u003cdiv>\u003cb>communicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의사소통하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>humanity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인류\u003c/span>\u003c/div>\u003cdiv>\u003cb>fully educated\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>충분히 교육을 받은\u003c/span>\u003c/div>\u003cdiv>\u003cb>participate in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 참여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>prosperity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>풍요로움, 번영\u003c/span>\u003c/div>\u003cdiv>\u003cb>explorer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>탐험가\u003c/span>\u003c/div>\u003cdiv>\u003cb>researcher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구원\u003c/span>\u003c/div>\u003cdiv>\u003cb>engineer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술자, 엔지니어\u003c/span>\u003c/div>\u003cdiv>\u003cb>artist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예술가\u003c/span>\u003c/div>\u003cdiv>\u003cb>doctor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의사\u003c/span>\u003c/div>\u003cdiv>\u003cb>counselor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상담사\u003c/span>\u003c/div>\u003cdiv>\u003cb>generative AI\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생성형 AI\u003c/span>\u003c/div>\u003cdiv>\u003cb>potential\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잠재력, 가능성\u003c/span>\u003c/div>\u003cdiv>\u003cb>highly abundant\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>매우 풍요로운\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개 짚어 볼게요. view는 보다 또는 여기다라는 뜻이고, through an economic lens는 경제학적 관점으로라는 숙어 표현이에요. scarcity는 희소성, prosperity는 풍요로움, potential은 잠재력이라는 뜻으로 주제를 이해하는 데 꼭 필요한 어휘입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">view\u003c/b>\u003cspan class=\"m\">보다, 여기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">regard\u003c/span>\u003cspan class=\"s\">consider\u003c/span>\u003cspan class=\"s\">deem\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">disregard\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">scarcity\u003c/b>\u003cspan class=\"m\">희소성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shortage\u003c/span>\u003cspan class=\"s\">lack\u003c/span>\u003cspan class=\"s\">dearth\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abundance\u003c/span>\u003cspan class=\"a\">plenty\u003c/span>\u003cspan class=\"a\">surplus\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">abundant\u003c/b>\u003cspan class=\"m\">풍요로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">plentiful\u003c/span>\u003cspan class=\"s\">ample\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">scarce\u003c/span>\u003cspan class=\"a\">insufficient\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">potential\u003c/b>\u003cspan class=\"m\">잠재력, 가능성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">possibility\u003c/span>\u003cspan class=\"s\">capability\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">actuality\u003c/span>\u003cspan class=\"a\">certainty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">allocate\u003c/b>\u003cspan class=\"m\">배분하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distribute\u003c/span>\u003cspan class=\"s\">assign\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">prosperity\u003c/b>\u003cspan class=\"m\">풍요로움, 번영\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wealth\u003c/span>\u003cspan class=\"s\">affluence\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">poverty\u003c/span>\u003cspan class=\"a\">scarcity\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">educated\u003c/b>\u003cspan class=\"m\">교육받은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">knowledgeable\u003c/span>\u003cspan class=\"s\">literate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignorant\u003c/span>\u003cspan class=\"a\">uneducated\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 두면 시험에 도움이 돼요. scarcity의 동의어는 shortage, lack, dearth이고 반의어는 abundance, plenty, surplus입니다. view의 동의어는 regard, consider, deem이고 반의어는 ignore, disregard예요. potential의 동의어는 possibility, capability이고 반의어는 actuality, certainty로 묶을 수 있고요. prosperity의 동의어는 wealth, affluence이고 반의어는 poverty, scarcity입니다. allocate의 동의어는 distribute, assign이고 반의어는 keep, withhold로 정리해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Star Trek의 세계를 바라보는 사람은 거의 없을지도 모른다\u003c/span>\u003cspan class=\"en\">Few people may view the Star Trek universe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경제학적 관점을 통해\u003c/span>\u003cspan class=\"en\">through an economic lens,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그렇게 하는 것이 세계를 들여다볼 수 있는 창을 제공한다\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">provides\u003c/span> a window into \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">world \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧 우리에게 닥칠지도 모르는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">soon \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">upon \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Star Trek의 세계를 경제학적 관점을 통해 바라보는 사람은 거의 없을지 모르지만, 그렇게 하는 것이 곧 우리에게 닥칠지도 모르는 세계를 들여다볼 수 있는 창을 제공한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Star Trek 세계를 경제학적 관점으로 보는 사람은 거의 없지만, 그렇게 보면 곧 우리에게 닥칠지도 모르는 미래 세계를 엿볼 수 있는 \u003cb class=\"key\">창\u003c/b>을 제공한다는 뜻이에요. \u003cb class=\"key\">경제학적 \u003c/b>\u003cb class=\"key\">렌즈\u003c/b>는 경제학적 시각이라는 비유이고, window into a world는 미래를 들여다볼 수 있는 통로라는 뜻이에요. 이 문장은 뒤에 이어질 Star Trek 사회와 생성형 AI 이야기를 이끄는 도입부 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [doing so (동명사구/주어)] + [provides (단수 동사)] + [a window...] : \"그렇게 하는 것이 창을 제공한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 a world] + [that + might be...] : \"곧 우리에게 닥칠지도 모르는 세계\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Few people may view the Star Trek universe, Star Trek의 세계를 바라보는 사람은 거의 없을지도 모른다. through an economic lens, 경제학적 관점을 통해. but doing so provides a window into a world, 그러나 그렇게 하는 것이 세계를 들여다볼 수 있는 창을 제공한다. that might soon be upon us, 곧 우리에게 닥칠지도 모르는. 이 문장 전체를 해석하면, Star Trek의 세계를 경제학적 관점을 통해 바라보는 사람은 거의 없을지 모르지만, 그렇게 하는 것이 곧 우리에게 닥칠지도 모르는 세계를 들여다볼 수 있는 창을 제공한다.","hl":"m"},{"n":13,"text":"이 문장은 Star Trek 세계를 경제학적 관점에서 보는 사람은 거의 없지만, 그렇게 보면 곧 우리에게 닥칠지도 모르는 미래 세계를 들여다볼 수 있는 창이 된다는 뜻이에요. economic lens는 경제학적 시각이라는 비유이고, window into a world는 미래를 엿볼 수 있는 통로라는 뜻이죠. 이 문장은 뒤에 나올 Star Trek 사회와 생성형 AI 이야기를 이끄는 도입부 역할을 해요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 doing so provides에요. doing so는 동명사구라서 주어 자리에 오고, 동명사구 주어는 단수 취급을 하니까 단수 동사 provides가 왔어요. 두 번째 어법 포인트는 a world that might soon be upon us에요. 여기서 that은 주격 관계대명사로, 선행사 a world를 수식하면서 뒤 절의 주어 역할을 해요. that 뒤에 동사 might be가 오는 것도 주격 관계대명사 구조이기 때문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고전 경제학 전체는\u003c/span>\u003cspan class=\"en\">All of classical economics\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개념에 기초하고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">based \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">notion \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 사람에게 그들이 원하거나 필요로 하는 모든 것을 제공하기에는 대체로 어떤 것이든 충분하지 않다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">isn't \u003c/span>\u003cspan class=\"tgt\">usually \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">anything \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">give \u003c/span>\u003cspan class=\"tgt\">everyone \u003c/span>\u003cspan class=\"tgt\">everything \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">need\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고전 경제학 전체는 모든 사람에게 그들이 원하거나 필요로 하는 모든 것을 제공하기에는 대체로 어떤 것이든 충분하지 않다는 개념에 기초하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 고전 경제학 전체가 기본적으로 자원이 충분하지 않다는 \u003cb class=\"key\">희소성\u003c/b> 개념에 기초하고 있다는 뜻이에요. 모든 사람에게 원하거나 필요한 모든 것을 줄 만큼 어떤 것도 충분하지 않다는 것이 고전 경제학의 \u003cb class=\"key\">출발점\u003c/b>이죠. 이 전제가 다음 문장에서 시장과 가격 책정이 필요한 이유로 연결돼요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be based on)\u003c/span> : [All of classical economics] + [is based on] + [the notion] : \"개념에 기초하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격의 that\u003c/span> : [the notion] + [that + 완전한 절] : \"모든 사람에게 그들이 원하거나 필요로 하는 모든 것을 제공하기에는 대체로 어떤 것이든 충분하지 않다는 개념\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">enough + to부정사\u003c/span> : [enough + 명사(anything)] + [to부정사(to give...)] : \"모든 사람에게 모든 것을 제공할 만큼 어떤 것이든 충분히\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"All of classical economics, 고전 경제학 전체는. is based on the notion, 개념에 기초하고 있다. that there isn't usually enough of anything to give everyone everything they want or need, 모든 사람에게 그들이 원하거나 필요로 하는 모든 것을 제공하기에는 대체로 어떤 것이든 충분하지 않다는. 이 문장 전체를 해석하면, 고전 경제학 전체는 모든 사람에게 그들이 원하거나 필요로 하는 모든 것을 제공하기에는 대체로 어떤 것이든 충분하지 않다는 개념에 기초하고 있다.","hl":"m"},{"n":16,"text":"이 문장은 고전 경제학 전체가 기본적으로 자원이 충분하지 않다는 희소성 개념에 기초하고 있다는 뜻이에요. 모든 사람에게 원하거나 필요한 모든 것을 줄 만큼 어떤 것도 충분하지 않다는 것이 고전 경제학의 출발점이죠. 바로 이 전제 때문에 다음 문장에서 시장과 가격이 필요하다고 연결돼요.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 the notion that 이하에요. that은 앞에 있는 the notion의 내용을 설명하는 동격의 접속사이고, that절은 완전한 문장이 와요. 두 번째 어법 포인트는 enough of anything to give에요. to give는 enough의 정도를 설명하는 to부정사의 부사적 용법으로, ~할 만큼 충분한이라는 의미를 나타내요. 세 번째 어법 포인트는 is based on인데, be based on은 ~에 기반하다라는 상태를 나타내는 수동태 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 때문에\u003c/span>\u003cspan class=\"en\">Because of that,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 시장과 가격 책정을 이용한다\u003c/span>\u003cspan class=\"en\">we use markets and pricing\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 재화와 서비스 및 자원을 배분하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">allocate \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">goods, \u003c/span>\u003cspan class=\"tgt\">services, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">resources \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 가장 큰 이익을 낳을 수 있는 곳에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">result \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">highest \u003c/span>\u003cspan class=\"tgt\">benefit\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 때문에 우리는 그러한 재화와 서비스 및 자원을 그것들이 가장 큰 이익을 낳을 수 있는 곳에 배분하기 위해 시장과 가격 책정을 이용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 희소성 때문에 우리가 시장과 가격 책정을 이용해서 재화와 서비스와 자원을 가장 큰 이익을 낳을 수 있는 곳에 \u003cb class=\"key\">배분\u003c/b>한다는 뜻이에요. 앞 문장의 희소성이 원인이 되어 시장과 가격이라는 \u003cb class=\"key\">배분 \u003c/b>\u003cb class=\"key\">수단\u003c/b>이 등장하죠. 이는 Star Trek에서는 희소성이 거의 없어서 이러한 배분이 필요 없어진다는 \u003cb class=\"key\">대조\u003c/b>를 준비해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [use markets and pricing] + [to allocate ...] : \"그러한 재화와 서비스 및 자원을 배분하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">A, B, and C 병렬 구조\u003c/span> : [A(goods)], [B(services)], and [C(resources)] : \"재화와 서비스 및 자원\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Because of that, 그 때문에. we use markets and pricing, 우리는 시장과 가격 책정을 이용한다. to allocate those goods, services, and resources, 그러한 재화와 서비스 및 자원을 배분하기 위해. to where they might result in the highest benefit, 그것들이 가장 큰 이익을 낳을 수 있는 곳에. 이 문장 전체를 해석하면, 그 때문에 우리는 그러한 재화와 서비스 및 자원을 그것들이 가장 큰 이익을 낳을 수 있는 곳에 배분하기 위해 시장과 가격 책정을 이용한다.","hl":"m"},{"n":19,"text":"이 문장은 희소성 때문에 우리가 시장과 가격 책정을 이용해서 재화와 서비스와 자원을 가장 큰 이익을 낳을 수 있는 곳에 배분한다는 뜻이에요. 앞 문장에서 말한 희소성이 원인이 되어 시장과 가격이라는 배분 수단이 등장하죠. 이는 Star Trek에서는 희소성이 거의 없기 때문에 이러한 배분이 필요 없어진다는 대조를 준비해요.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 to allocate 이하에요. to allocate는 ~하기 위해라는 목적을 나타내는 to부정사의 부사적 용법으로, 동사 use의 목적을 설명해요. 두 번째 어법 포인트는 goods, services, and resources에요. 세 개의 명사가 쉼표와 and로 연결된 A, B, and C 병렬 구조로, 같은 품사와 형태를 나열한 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Star Trek에서는\u003c/span>\u003cspan class=\"en\">In Star Trek,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">however,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">isn't \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 희소성이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">scarcity\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 Star Trek에서는 희소성이 별로 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 말한 현실 경제의 핵심 전제인 희소성이 Star Trek 세계에서는 거의 나타나지 않는다고 전환을 준다. \u003cb class=\"key\">희소성\u003c/b>이 없다는 것은 재화나 자원이 부족하지 않아 시장으로 배분할 필요가 줄어든다는 뜻이다. however는 앞 문장의 고전 경제학 원리와 대조되는 \u003cb class=\"key\">전환\u003c/b>을 나타낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사\u003c/span> : S + V. However, S + V. : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">존재를 나타내는 there is/are 구문\u003c/span> : there + be동사 + 주어 (much scarcity) : \"많은 희소성이 없다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"In Star Trek, Star Trek에서는. however, 그러나. there isn't, 없다. much scarcity, 많은 희소성이. 이 문장 전체를 해석하면, 그러나 Star Trek에서는 희소성이 별로 없다.","hl":"m"},{"n":22,"text":"이 문장은 앞 문장과 대조를 이루면서 희소성이 Star Trek에서는 별로 없다고 말해 줘요. 경제학의 기본 전제인 희소성이 사라지면 물건을 나누는 시장 방식도 필요가 줄어들죠. however가 앞 내용과 다른 세계를 보여 준다는 전환 신호예요.","hl":"mn"},{"n":23,"text":"여기서 짚을 어법은 there is나 there are 구문이에요. there isn't much scarcity에서 there는 해석하지 않는 유도부사이고 진짜 주어는 much scarcity예요. 그래서 be 동사는 뒤에 오는 주어에 맞춰 isn't로 온 거죠. 이처럼 존재 여부를 말할 때 there를 앞에 두고 진짜 주어는 뒤로 보내는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기술은 가능하게 해 왔다\u003c/span>\u003cspan class=\"en\">Technology \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">allowed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사회가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">society \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 원하는 어떤 음식이든 복제하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reproduce\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">want\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신을 수천 마일 이동하며\u003c/span>\u003cspan class=\"en\">transport themselves thousands of miles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈 깜짝할 사이에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">blink \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">eye\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수광년 거리를 넘어 의사소통하고\u003c/span>\u003cspan class=\"en\">communicate over lightyears,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 별들 사이를 여행하다\u003c/span>\u003cspan class=\"en\">and travel among the stars.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기술은 그 사회가 그들이 원하는 어떤 음식이든 복제하고, 눈 깜짝할 사이에 그들 자신을 수천 마일 이동시키며, 수광년의 거리를 넘어 의사소통하고, 별들 사이를 여행할 수 있게 해 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Star Trek 세계에서 기술이 실현한 풍요로움을 네 가지 예로 나열한다. 음식 복제, 초고속 이동, 초광속 통신, 우주 여행처럼 \u003cb class=\"key\">기술\u003c/b>이 희소성을 제거한 구체적 사례다. allow A to-v 구조로 그 사회가 그런 행동을 할 수 있게 되었다는 \u003cb class=\"key\">허용\u003c/b>의 의미를 전달한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">allow + 목적어 + to부정사(5형식)\u003c/span> : allow [목적어] + [to-v 목적격보어] : \"그 사회가 복제하도록 허용해 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : any food [(that) they want] : \"그들이 원하는 어떤 음식\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용표현(시간)\u003c/span> : in the blink of an eye = 매우 짧은 시간에 : \"눈 깜짝할 사이에\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Technology has allowed, 기술은 가능하게 해 왔다. that society, 그 사회가. to reproduce any food they want, 그들이 원하는 어떤 음식이든 복제하고. transport themselves thousands of miles, 그들 자신을 수천 마일 이동하며. in the blink of an eye, 눈 깜짝할 사이에. communicate over lightyears, 수광년 거리를 넘어 의사소통하고. and travel among the stars, 그리고 별들 사이를 여행하다. 이 문장 전체를 해석하면, 기술은 그 사회가 그들이 원하는 어떤 음식이든 복제하고, 눈 깜짝할 사이에 그들 자신을 수천 마일 이동시키며, 수광년의 거리를 넘어 의사소통하고, 별들 사이를 여행할 수 있게 해 왔다.","hl":"m"},{"n":25,"text":"이 문장은 기술이 Star Trek 사회에 가져온 풍요로움을 구체적으로 나열한 부분이에요. 음식을 복제하는 것, 먼 거리를 순식간에 이동하는 것, 광년 단위로 통신하는 것, 별들 사이를 여행하는 것까지 모두 가능해졌죠. allow라는 동사가 그 사회가 그런 일을 하도록 해 주었다는 허용의 뜻을 담고 있어요.","hl":"mn"},{"n":26,"text":"첫 번째 어법은 allow 목적어 to부정사 구문이에요. has allowed that society to reproduce에서 allow는 목적어 that society를 받고 그 뒤에 to부정사를 목적격보어로 써서 그 사회가 복제하도록 허용했다는 뜻을 만들어요. 두 번째 어법은 any food they want에서 목적격 관계대명사가 생략된 거예요. 원래는 any food that they want인데 that이 목적어 자리라 생략되었죠. 세 번째 어법은 in the blink of an eye라는 관용 표현이에요. 눈 깜짝할 사이에라는 뜻으로 매우 짧은 시간을 강조해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 인류는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">All \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">humanity\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 세계의\u003c/span>\u003cspan class=\"en\">in that world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충분히 교육을 받아 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">fully \u003c/span>\u003cspan class=\"tgt\">educated\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 참여할 수 있도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">participate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 풍요로움에\u003c/span>\u003cspan class=\"en\">in this prosperity.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 세계의 모든 인류는 이러한 풍요로움에 참여할 수 있도록 충분히 교육을 받아 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 기술적 풍요로움을 누리기 위한 전제로 교육이 필요함을 강조한다. 모든 인류가 완전히 교육받아야 그 풍요에 참여할 수 있다는 \u003cb class=\"key\">인과\u003c/b>의 의미를 so that이 나타낸다. has been fully educated는 완료·수동 표현으로 교육이 이미 이루어져 온 \u003cb class=\"key\">상태\u003c/b>를 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">단수 취급되는 humanity\u003c/span> : all of + 단수 명사 + 단수 동사 : \"모든 인류는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 수동태\u003c/span> : have/has been + 과거분사 : \"충분히 교육을 받아 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적의 부사절(so that + S + can)\u003c/span> : so that + 주어 + can + 동사원형 : \"그들이 참여할 수 있도록\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"All of humanity, 모든 인류는. in that world, 그 세계의. has been fully educated, 충분히 교육을 받아 왔다. so that they can participate, 그들이 참여할 수 있도록. in this prosperity, 이러한 풍요로움에. 이 문장 전체를 해석하면, 그 세계의 모든 인류는 이러한 풍요로움에 참여할 수 있도록 충분히 교육을 받아 왔다.","hl":"m"},{"n":28,"text":"이 문장은 풍요로운 사회에 참여하기 위한 조건으로 교육이 갖춰져야 한다는 점을 말해요. 모든 인류가 완전히 교육을 받아서 그 풍요에 함께 참여할 수 있게 되었다는 거죠. so that이 목적을 나타내기 때문에, 교육의 목적이 풍요로움에 참여하는 것임을 보여 줘요.","hl":"mn"},{"n":29,"text":"첫 번째 어법은 All of humanity의 단수 취급이에요. all이 있어도 humanity는 하나의 집단으로 보기 때문에 단수 동사 has가 옵니다. 두 번째 어법은 has been fully educated예요. 현재완료와 수동태가 결합되어 교육을 받아 온 상태를 나타내요. 세 번째 어법은 so that they can participate예요. so that이 목적을 나타내고 can이 가능성의 의미를 더해서 그들이 참여할 수 있도록이라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 사람은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Everyone \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">탐험가, 연구원, 기술자, 예술가, 의사\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">explorer, \u003c/span>\u003cspan class=\"tgt\">researcher, \u003c/span>\u003cspan class=\"tgt\">engineer, \u003c/span>\u003cspan class=\"tgt\">artist, \u003c/span>\u003cspan class=\"tgt\">doctor, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 상담사이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">counselor\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 사람은 탐험가, 연구원, 기술자, 예술가, 의사 또는 상담사이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 fully educated를 받아서 Star Trek 세계에서는 모든 사람이 \u003cb class=\"key\">전문 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 맡고 있다는 뜻입니다. 직업이 단순한 생계 수단이 아니라 사회 \u003cb class=\"key\">번영\u003c/b>에 참여하는 정체성임을 보여 줍니다. 등위접속사 or를 통해 여러 역할 중 하나라는 뜻을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 everyone의 단수 취급\u003c/span> : Everyone [부정대명사, 단수] + is [단수 동사] + 주격 보어 : \"모든 사람은 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 or에 의한 명사 병렬\u003c/span> : A, B, C, D, E, or F : \"탐험가, 연구원, 기술자, 예술가, 의사 또는 상담사\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Everyone is, 모든 사람은. an explorer, researcher, engineer, artist, doctor, 탐험가, 연구원, 기술자, 예술가, 의사. or counselor, 또는 상담사이다.. 이 문장 전체를 해석하면, 모든 사람은 탐험가, 연구원, 기술자, 예술가, 의사 또는 상담사이다.","hl":"m"},{"n":31,"text":"이 문장은 앞 문장에서 말한 fully educated를 받아서 Star Trek 세계에서는 모든 사람이 전문 역할을 맡고 있다는 뜻이에요. 여기서 직업은 단순한 생계 수단이 아니라 사회 번영에 참여하는 정체성이죠. or가 여러 역할 중 하나를 고르는 의미를 나타내요.","hl":"mn"},{"n":32,"text":"첫 번째로 Everyone is를 보세요. everyone은 뜻이 모든 사람이지만 문법적으로 단수 취급을 하기 때문에 복수 동사 are가 아니라 is를 씁니다. 두 번째로 an explorer, researcher, engineer, artist, doctor, or counselor 부분은 등위접속사 or가 여러 명사 보어를 병렬로 연결하고 있어요. or는 나열된 선택지 중 하나를 뜻합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생성형 AI는 잠재력을 지니고 있다\u003c/span>\u003cspan class=\"en\">Generative AI has \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">potential \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 사회의 많은 측면이 가능하게 하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">allow \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">dimensions \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">society \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마찬가지로 매우 풍요로워지도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">similarly \u003c/span>\u003cspan class=\"tgt\">highly \u003c/span>\u003cspan class=\"tgt\">abundant\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">생성형 AI는 우리 사회의 많은 측면이 마찬가지로 매우 풍요로워질 수 있게 할 잠재력을 지니고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 Star Trek 세계의 \u003cb class=\"key\">풍요\u003c/b>를 현재 우리 사회로 옮겨 오는 주제 문장입니다. 생성형 AI가 우리 사회의 많은 \u003cb class=\"key\">측면\u003c/b>을 희소성이 거의 없는 상태로 만들 수 있다는 가능성을 말합니다. 이는 AI가 \u003cb class=\"key\">희소성\u003c/b> 문제를 줄이고 보다 풍요로운 사회를 열 수 있다는 글 전체의 핵심 주장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the potential + to부정사구 : \"~할 수 있는 잠재력\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">allow + 목적어 + to부정사 (5형식)\u003c/span> : allow + 목적어 + to부정사(목적격 보어) : \"우리 사회의 많은 측면이 마찬가지로 매우 풍요로워지도록 허용하다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Generative AI has the potential, 생성형 AI는 잠재력을 지니고 있다. to allow many dimensions of our own society, 우리 사회의 많은 측면이 가능하게 하도록. to be similarly highly abundant, 마찬가지로 매우 풍요로워지도록. 이 문장 전체를 해석하면, 생성형 AI는 우리 사회의 많은 측면이 마찬가지로 매우 풍요로워질 수 있게 할 잠재력을 지니고 있다.","hl":"m"},{"n":34,"text":"이 문장은 앞서 Star Trek 세계에서 본 풍요를 우리 사회로 옮겨 오는 주제 문장이에요. 생성형 AI가 우리 사회의 많은 측면을 희소성이 거의 없는 상태로 만들 수 있다는 가능성을 말하고 있죠. 그래서 AI가 희소성 문제를 줄이고 더 풍요로운 사회를 열 수 있다는 글 전체의 핵심 주장으로 볼 수 있어요.","hl":"mn"},{"n":35,"text":"첫 번째로 the potential to allow 부분을 보세요. to allow 이하가 앞의 명사 the potential을 꾸며 주는 to부정사의 형용사적 용법입니다. 해석은 잠재력, 즉 가능성을 나타내요. 두 번째로 allow many dimensions of our own society to be similarly highly abundant 부분은 allow가 목적어와 to부정사를 함께 취하는 오형식 구조예요. 목적어인 many dimensions가 to be 이하 상태가 되도록 허용한다는 뜻이죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>첫 문장은 Star Trek을 \u003cb class=\"key\">경제학적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>으로 보면 곧 닥칠 세계를 보여 준다고 제안한다.\u003c/li>\u003cli>고전 경제학은 \u003cb class=\"key\">희소성\u003c/b>을 전제로 시장과 가격 책정을 이용해 재화를 배분한다는 통념을 제시한다.\u003c/li>\u003cli>Star Trek 세계는 \u003cb class=\"key\">기술\u003c/b>과 \u003cb class=\"key\">교육\u003c/b> 덕분에 희소성이 거의 없는 \u003cb class=\"key\">풍요로움\u003c/b>을 누린다.\u003c/li>\u003cli>생성형 AI는 우리 사회의 많은 측면을 \u003cb class=\"key\">마찬가지로 \u003c/b>\u003cb class=\"key\">매우 \u003c/b>\u003cb class=\"key\">풍요\u003c/b>롭게 만들 잠재력이 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Viewing Star Trek through an economic lens reveals that technology and education can create abundance, and generative AI may bring similar abundance to our society.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">고전 경제학은 \u003cb class=\"key\">희소성\u003c/b>을 전제로 시장과 가격 책정으로 재화를 배분하지만, Star Trek 세계는 기술과 교육 덕분에 \u003cb class=\"key\">풍요로움\u003c/b>을 누린다. \u003cb class=\"key\">생성형 \u003c/b>\u003cb class=\"key\">AI\u003c/b>는 우리 사회의 많은 측면을 그와 비슷하게 매우 풍요롭게 만들 잠재력이 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 지문을 정리하면요, 고전 경제학은 희소성을 전제로 시장과 가격 책정으로 재화를 배분한다는 통념을 제시합니다. 반대로 Star Trek 세계는 기술과 교육 덕분에 희소성이 거의 없는 풍요로운 사회를 보여 줘요. 마지막으로 generative AI가 우리 사회의 많은 측면을 그와 비슷하게 매우 풍요롭게 만들 잠재력이 있다는 요지로 마무리됩니다. 이 구조를 기억하면서 복습해 보세요. 오늘 수고 많았습니다.","hl":null}]}]});</script></body></html>
