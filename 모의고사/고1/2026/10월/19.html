lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 19번","audioDir":"19_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">19번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>The Last Day That Changed My Summer\u003c/h1>\u003ch2>내 여름을 바꾼 마지막 날\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>방학 전 마지막 날, \u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">선생님\u003c/b>의 지적으로 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">보고서\u003c/b>를 제출하지 않았다는 사실이 드러나 \u003cb class=\"key\">여름 \u003c/b>\u003cb class=\"key\">학교\u003c/b>에 가게 된다. 설레던 \u003cb class=\"key\">여름 \u003c/b>\u003cb class=\"key\">방학\u003c/b>은 \u003cb class=\"key\">실험대\u003c/b> 앞에서 보내는 시간으로 바뀌고 만다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A student's joyful last day of school turns into the start of an unwanted summer school after a forgotten lab report comes to light.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 살펴볼 지문은 방학을 앞둔 학생의 기대가 한 순간에 무너지는 이야기예요. 제목은 The Last Day That Changed My Summer, 우리말로는 내 여름을 바꾼 마지막 날입니다. 간단히 요약하면, 과학 선생님의 지적으로 최종 실험 보고서를 내지 않았다는 사실이 드러나 여름 학교에 가게 되는 내용이에요. 요지는 A student's joyful last day of school turns into the start of an unwanted summer school after a forgotten lab report comes to light입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">미국 등 영어권 학교에서는 과학 수업에서 실험 후 작성하는 보고서를 lab report라고 해요. 특히 학기 말의 final lab report는 성적에 큰 영향을 주는 최종 보고서예요. 만약 필수 과제를 제출하지 못하면 방학 중에 여름 학교(summer school)에 참석해서 부족한 부분을 보충해야 하죠. 이는 게임에서 퀘스트를 완료하지 못하면 다음 단계로 넘어가지 못하는 것과 비슷합니다. 학생에게 여름 학교는 자유 시간을 빼앗기는 \u003cb class=\"key\">페널티\u003c/b>처럼 느껴질 수 있어요. 그래서 이 글의 화자는 \u003cb class=\"key\">여름 \u003c/b>\u003cb class=\"key\">방학\u003c/b>을 앞두고도 전혀 기쁘지 않은 상황에 놓이게 됩니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 미국 등 영어권 학교에서는 과학 수업에서 실험을 한 뒤 lab report, 즉 실험 보고서를 제출하는 경우가 많아요. 특히 final lab report는 학기 말 성적에 큰 영향을 주는 최종 보고서예요. 만약 이런 필수 과제를 내지 못하면 방학 중에 summer school, 우리말로 여름 학교에 가서 부족한 부분을 보충해야 하죠. 이건 게임에서 퀘스트를 끝내지 못하면 다음 단계로 넘어가지 못하는 것과 비슷해요. 그래서 학생에게 여름 학교는 자유 시간을 빼앗기는 페널티처럼 느껴질 수 있어요. 이 글의 화자도 바로 그런 상황에 놓이게 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>해방감과 기대\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>방학 전 마지막 날, 화자는 \u003cb class=\"key\">몇 \u003c/b>\u003cb class=\"key\">달간의 \u003c/b>\u003cb class=\"key\">퀴즈와 \u003c/b>\u003cb class=\"key\">과제\u003c/b>를 끝내고 모든 것을 뒤로하고 싶어 한다. 사물함을 정리하며 \u003cb class=\"key\">거의 \u003c/b>\u003cb class=\"key\">춤을 \u003c/b>\u003cb class=\"key\">추다시피\u003c/b> 할 만큼 들떠 있고, 어떤 것도 \u003cb class=\"key\">기분\u003c/b>을 망칠 수 없다고 느낀다. 이 단계는 \u003cb class=\"key\">여름 \u003c/b>\u003cb class=\"key\">방학\u003c/b>에 대한 기대감을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>선생님의 호출과 지적\u003csmall>전환 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>책가방을 \u003cb class=\"key\">지퍼로 \u003c/b>\u003cb class=\"key\">잠그고\u003c/b> 떠나려는 순간, 과학 선생님 Manta가 화자를 \u003cb class=\"key\">따로 \u003c/b>\u003cb class=\"key\">부른다\u003c/b>. 선생님은 한 달 동안 \u003cb class=\"key\">경고\u003c/b>했음에도 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">보고서\u003c/b>를 제출하지 않았다고 말한다. 그 말은 화자에게 \u003cb class=\"key\">찬물을 \u003c/b>\u003cb class=\"key\">끼얹듯\u003c/b> 충격을 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>잊고 있던 사실과 통보\u003csmall>위기 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>화자는 선생님의 말이 \u003cb class=\"key\">맞지만\u003c/b> 자신이 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">잊고 \u003c/b>\u003cb class=\"key\">있었다\u003c/b>고 인정한다. 선생님은 이를 \u003cb class=\"key\">보충\u003c/b>하기 위해 \u003cb class=\"key\">여름 \u003c/b>\u003cb class=\"key\">학교\u003c/b>에 출석해야 한다고 덧붙인다. 기대했던 방학은 순식간에 \u003cb class=\"key\">의무\u003c/b>로 바뀐다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>여름 계획의 붕괴\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>화자는 \u003cb class=\"key\">여유로운 \u003c/b>\u003cb class=\"key\">아침\u003c/b>과 \u003cb class=\"key\">끝없는 \u003c/b>\u003cb class=\"key\">자유 \u003c/b>\u003cb class=\"key\">시간\u003c/b> 대신 \u003cb class=\"key\">실험대\u003c/b>에서 방학을 보내게 되었다고 한탄한다. 그것은 \u003cb class=\"key\">소중한 \u003c/b>\u003cb class=\"key\">여름\u003c/b>에 가장 하고 싶지 않은 일이다. 처음의 \u003cb class=\"key\">해방감\u003c/b>은 완전히 사라지고 \u003cb class=\"key\">상실감\u003c/b>만 남는다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 해방감과 기대예요. 첫 번째 문장부터 네 번째 문장까지는 방학을 앞둔 화자의 들뜬 마음을 보여 줘요. 몇 달간의 퀴즈와 과제를 끝내고 모든 것을 뒤로하고 싶어 하고, 사물함을 정리하면서 거의 춤을 출 정도로 기분이 좋아요. 어떤 것도 기분을 망칠 수 없다고 느끼는 거죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 선생님의 호출과 지적입니다. 다섯 번째 문장부터 일곱 번째 문장에서, 책가방을 지퍼로 잠그고 떠나려는 순간 과학 선생님 Manta가 따로 불러요. 선생님은 한 달 동안 경고했음에도 최종 실험 보고서를 제출하지 않았다고 말하죠. 그 말은 화자에게 찬물을 끼얹듯 충격을 줍니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 잊고 있던 사실과 여름 학교 통보예요. 여덟 번째 문장에서 화자는 선생님 말이 맞지만 자신이 완전히 잊고 있었다고 인정해요. 아홉 번째 문장에서는 이를 보충하기 위해 여름 학교에 출석해야 한다는 말이 이어집니다. 기대했던 방학이 순식간에 의무로 바뀌는 순간이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 여름 계획의 붕괴입니다. 열 번째 문장에서 화자는 여유로운 아침과 끝없는 자유 시간 대신 실험대에서 방학을 보내게 되었다고 한탄해요. 그것은 소중한 여름에 가장 하고 싶지 않은 일이죠. 처음의 해방감은 완전히 사라지고 상실감만 남게 됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 방학 전 마지막 날의 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>에 따라 사건이 전개돼요. 처음에는 \u003cb class=\"key\">해방감\u003c/b>을, 중간에는 \u003cb class=\"key\">선생님의 \u003c/b>\u003cb class=\"key\">지적\u003c/b>과 \u003cb class=\"key\">여름 \u003c/b>\u003cb class=\"key\">학교\u003c/b> 통보를 제시하죠. 마지막 문장에서 \u003cb class=\"key\">기대했던 \u003c/b>\u003cb class=\"key\">여름\u003c/b>과 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 \u003cb class=\"key\">대조\u003c/b>하며 주제를 드러내요. 그래서 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있어요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>After months of (2)\u003c/b>\u003cspan>시간 경과\u003c/span>\u003cb>As I zipped up (5)\u003c/b>\u003cspan>시간적 배경\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>역접·상황 전환\u003c/span>\u003cb>Instead of (10)\u003c/b>\u003cspan>대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">couldn't wait to leave everything behind\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ready to leave\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">lazy mornings and endless free time\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>기대했던 여름\u003c/th>\u003cth>여름 학교 현실\u003c/th>\u003c/tr>\u003ctr>\u003ctd>여유로운 아침\u003c/td>\u003ctd>실험대 앞의 시간\u003c/td>\u003c/tr>\u003ctr>\u003ctd>끝없는 자유 시간\u003c/td>\u003ctd>여름 학교 출석 의무\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간 순서에 따라 사건이 전개되는 이야기예요. 처음에는 방학 전의 해방감을 보여 주고, 중간에 선생님의 지적과 여름 학교 통보가 나오죠. 마지막 문장에서 기대했던 여름과 실제 상황을 대조하며 주제를 드러내요. 그래서 전체적으로 미괄식 구조로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 볼까요. 두 번째 문장의 After months of는 시간 경과를, 다섯 번째 문장의 As I zipped up은 시간적 배경을 보여 줘요. 여덟 번째 문장의 But은 상황이 바뀌는 역접 신호이고, 열 번째 문장의 Instead of는 기대와 현실을 대조하는 신호예요. 이 신호어들을 따라가면 글의 반전이 쉽게 잡혀요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>vacation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방학\u003c/span>\u class=\"w\">attend\u003c/b>\u003cspan class=\"m\">출석하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">participate\u003c/span>\u003cspan class=\"s\">join\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003cspan class=\"a\">skip\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">forget\u003c/b>\u003cspan class=\"m\">잊다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">neglect\u003c/span>\u003cspan class=\"s\">overlook\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">remember\u003c/span>\u003cspan class=\"a\">recall\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">precious\u003c/b>\u003cspan class=\"m\">소중한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">valuable\u003c/span>\u003cspan class=\"s\">dear\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worthless\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 외워 두면 좋아요. ruin은 destroy나 spoil과 같이 망치다는 뜻이고, 반대말은 fix나 restore예요. forget은 neglect나 overlook과 비슷하고, remember나 recall과 반대입니다. attend는 participate나 join과 뜻이 가깝고, miss나 skip과 반대예요. precious는 valuable이나 dear와 비슷하고, worthless와는 반대되죠. 이렇게 짝을 지어 외우면 독해와 어휘 문제에 모두 도움이 됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교의 마지막 날\u003c/span>\u003cspan class=\"en\">the last day of school\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여름 방학 전이었다\u003c/span>\u003cspan class=\"en\">before summer vacation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여름 방학 전 학교에서의 마지막 날이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기의 시간적 배경을 제시합니다. 화자에게는 \u003cb class=\"key\">여름 \u003c/b>\u003cb class=\"key\">방학\u003c/b> 전 마지막 날이라서 기대와 들뜸이 큰 상황이에요. 글 전체에 깔린 \u003cb class=\"key\">해방감\u003c/b>의 출발점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비인칭 주어 it (시간·날짜)\u003c/span> : It was + [시간·날짜 명사구] : \"그때는 ~였다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"It was, 그때는. the last day of school, 학교의 마지막 날. before summer vacation, 여름 방학 전이었다. 이 문장 전체를 해석하면, 여름 방학 전 학교에서의 마지막 날이었다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 시간적 배경을 잡아 주는 문장이에요. 여름 방학 전 학교의 마지막 날이라는 사실이 드러나면서 화자가 왜 그렇게 들떠 있는지 짐작할 수 있죠. 여기서 It은 특정 대상을 가리키는 게 아니라 날짜나 때를 나타내는 비인칭 주어입니다.","hl":"mn"},{"n":14,"text":"첫 번째 문장의 어법 포인트는 비인칭 주어 it이에요. It was에서 It은 앞에 나온 어떤 명사를 받는 것이 아니라 날짜나 때를 나타내는 비인칭 주어예요. 그래서 한국어로는 그것은보다 그때는 정도로 해석하는 것이 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 달간의 퀴즈와 과제 후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">months \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">quizzes \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">assignments\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 기다릴 수 없었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">wait \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것을 뒤로하고 떠나는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">leave\u003c/span> everything behind.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇 달간의 퀴즈와 과제 후에, 나는 모든 것을 뒤로하고 빨리 떠나고 싶었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 몇 달간 퀴즈와 과제에 시달린 화자가 학업 스트레스에서 벗어나고 싶어 하는 간절함을 드러냅니다. \u003cb class=\"key\">couldn't \u003c/b>\u003cb class=\"key\">wait \u003c/b>\u003cb class=\"key\">to\u003c/b>는 단순히 기다릴 수 없다가 아니라 \u003cb class=\"key\">몹시 \u003c/b>\u003cb class=\"key\">~하고 \u003c/b>\u003cb class=\"key\">싶다\u003c/b>는 관용 표현이에요. leave everything behind는 모든 학업 부담을 뒤로하고 떠나려는 마음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 after의 시간 부사구\u003c/span> : after + [명사구] : \"몇 달간의 퀴즈와 과제 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">can't wait + to부정사 (관용 표현)\u003c/span> : can't wait + [to부정사] : \"~하는 것을 못 기다리다 → 몹시 ~하고 싶다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"After months of quizzes and assignments, 몇 달간의 퀴즈와 과제 후에. I couldn't wait, 나는 기다릴 수 없었다. to leave everything behind, 모든 것을 뒤로하고 떠나는 것을. 이 문장 전체를 해석하면, 몇 달간의 퀴즈와 과제 후에, 나는 모든 것을 뒤로하고 빨리 떠나고 싶었다.","hl":"m"},{"n":16,"text":"이 문장은 화자가 학업에서 벗어나고 싶은 간절한 마음을 보여 줘요. couldn't wait to는 단순히 못 기다리다가 아니라 몹시 무엇을 하고 싶다는 관용 표현이에요. leave everything behind는 모든 학업 부담을 뒤로하고 떠나려는 마음을 강조해 줍니다.","hl":"mn"},{"n":17,"text":"두 번째 문장의 첫 번째 어법 포인트는 After가 이끄는 전치사구예요. After months of quizzes and assignments에서 after는 뒤에 명사구만 왔기 때문에 전치사로 쓰였어요. 같은 after라도 뒤에 주어와 동사가 오면 접속사가 되므로 구분해서 봐야 합니다. 두 번째 포인트는 couldn't wait to leave의 관용 표현이에요. can't wait 뒤에 to부정사가 오면 무엇을 몹시 하고 싶다라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Could \u003c/span>\u003cspan class=\"tgt\">anything \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 달콤할 수 있을까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">sweeter?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 것이 더 달콤할 수 있을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 답을 요구하는 의문문이 아니라 이보다 더 달콤한 일은 없다는 의미를 담은 \u003cb class=\"key\">수사 \u003c/b>\u003cb class=\"key\">의문문\u003c/b>입니다. 여름 방학을 앞둔 화자의 \u003cb class=\"key\">해방감과 \u003c/b>\u003cb class=\"key\">기대\u003c/b>를 압축적으로 보여 줘요. Could anything be sweeter?는 Nothing could be sweeter.로 바꿔 이해할 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수사의문문 (rhetorical question)\u003c/span> : Could + [주어] + be + [비교급]? : \"어떤 것이 더 달콤할 수 있을까? → 더 달콤한 것은 없다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Could anything, 어떤 것이. be sweeter?, 더 달콤할 수 있을까. 이 문장 전체를 해석하면, 어떤 것이 더 달콤할 수 있을까?","hl":"m"},{"n":19,"text":"이 문장은 질문 형식이지만 대답을 바라는 것이 아니라 이보다 더 달콤한 것은 없다는 의미를 담은 수사 의문문이에요. 화자의 해방감과 여름 방학에 대한 기대를 강하게 표현하죠. Nothing could be sweeter로 바꿔 생각하면 의미가 더 분명해집니다.","hl":"mn"},{"n":20,"text":"세 번째 문장의 어법 포인트는 수사 의문문이에요. Could anything be sweeter는 형식은 의문문인데 실제로는 어떤 것도 이보다 더 달콤할 수 없다는 부정의 뜻을 강조하죠. 이런 표현은 대답을 요구하지 않고 화자의 감정을 전달하는 데 자주 쓰입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 거의 춤을 추다시피 했고\u003c/span>\u003cspan class=\"en\">I practically danced\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 사물함을 정리하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">cleaning \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">locker\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 어떤 것도 내 기분을 망칠 수 없었다.\u003c/span>\u003cspan class=\"en\">and nothing could ruin my mood.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 내 사물함을 정리하면서 거의 춤을 추다시피 했고, 어떤 것도 내 기분을 망칠 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 방학을 앞둔 주인공의 들뜬 기분을 극대화해요. practically danced와 nothing could ruin my mood라는 표현이 해방감을 강조하는데, 바로 뒤에 이어지는 선생님의 부름이 더 충격적으로 느껴지도록 \u003cb class=\"key\">반전\u003c/b>을 준비해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 while + 현재분사(분사구문)\u003c/span> : while (I was) cleaning out my locker : \"내 사물함을 정리하면서\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"I practically danced, 나는 거의 춤을 추다시피 했고. while cleaning out my locker, 내 사물함을 정리하면서. and nothing could ruin my mood, 그리고 어떤 것도 내 기분을 망칠 수 없었다.. 이 문장 전체를 해석하면, 나는 내 사물함을 정리하면서 거의 춤을 추다시피 했고, 어떤 것도 내 기분을 망칠 수 없었다.","hl":"m"},{"n":22,"text":"이 문장은 방학 전 주인공의 들뜬 기분을 보여줘요. practically danced와 nothing could ruin my mood라는 표현이 해방감을 강조하죠. 바로 다음에 나쁜 소식이 나오면서 이 문장이 반전을 준비하는 역할을 해요.","hl":"mn"},{"n":23,"text":"while cleaning out my locker를 보세요. 원래는 while I was cleaning out my locker였는데 주어가 주절과 같아서 I was를 생략하고 분사구문으로 표현했어요. 시간을 나타내는 while 뒤에 현재분사가 오는 형태로, 우리말로는 내 사물함을 정리하면서가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 책가방을 잠그고 떠날 준비를 할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">zipped \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">backpack\u003c/span>, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ready \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">leave\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학 선생님인 Manta 선생님이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">science \u003c/span>\u003cspan class=\"tgt\">teacher, \u003c/span>\u003cspan class=\"tgt\">Mr. \u003c/span>\u003cspan class=\"tgt\">Manta\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 따로 불렀다.\u003c/span>\u003cspan class=\"en\">called me aside.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 책가방을 잠그고 떠날 준비를 할 때, 과학 선생님인 Manta 선생님이 나를 따로 불렀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 들뜬 분위기를 긴장감으로 바꾸는 전환점이에요. 막 떠나려는 순간 선생님이 따로 부르는 상황을 설정하여 앞으로 벌어질 갈등의 \u003cb class=\"key\">복선\u003c/b>을 깔아줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as가 이끄는 시간 부사절\u003c/span> : As + 주어 + 과거동사, 주절 : \"내가 책가방을 잠그자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(형용사 수식)\u003c/span> : ready + to leave (형용사 + to부정사) : \"떠날 준비가 되어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격\u003c/span> : 명사구, 동격 명사 : \"과학 선생님인 Manta 선생님\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"As I zipped up my backpack, ready to leave, 내가 책가방을 잠그고 떠날 준비를 할 때. my science teacher, Mr. Manta, 과학 선생님인 Manta 선생님이. called me aside, 나를 따로 불렀다.. 이 문장 전체를 해석하면, 내가 책가방을 잠그고 떠날 준비를 할 때, 과학 선생님인 Manta 선생님이 나를 따로 불렀다.","hl":"m"},{"n":25,"text":"이 문장은 주인공이 막 가방을 챙기고 떠나려는 순간에 선생님이 나타나 따로 부르는 장면이에요. 들뜬 기분에서 긴장감으로 분위기가 바뀌는 전환점이죠. 이 부름이 다음에 나올 나쁜 소식의 복선이 돼요.","hl":"mn"},{"n":26,"text":"As I zipped up my backpack에서는 as가 시간 접속사로 쓰여서 ~할 때라는 뜻이에요. ready to leave에서는 to부정사가 ready를 수식해서 떠날 준비가 되어라는 의미를 만들어요. my science teacher, Mr. Manta는 쉼표로 이어진 동격 표현이에요. Mr. Manta가 바로 my science teacher라는 것을 덧붙여 설명해 주는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;Rafe&quot;라고 그가 말했다.\u003c/span>\u003cspan class=\"en\">&quot;Rafe,&quot; he said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 제출하지 않았구나\u003c/span>\u003cspan class=\"en\">&quot;you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">haven't \u003c/span>\u003cspan class=\"tgt\">turned \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네 최종 실험 보고서를\u003c/span>\u003cspan class=\"en\">your final lab report,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 모든 경고에도 불구하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">despite \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">warnings\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지난 한 달간\u003c/span>\u003cspan class=\"en\">this past month.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">&quot;Rafe.&quot; 그가 말했다. &quot;지난 한 달간 내 모든 경고에도 불구하고 너는 네 최종 실험 보고서를 제출하지 않았구나.&quot;\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기의 핵심 갈등을 드러내요. 주인공이 최종 실험 보고서를 제출하지 않아 여름 학교에 가야 할 상황이 시작되는 \u003cb class=\"key\">원인\u003c/b>이 되는 말이에요. despite가 이끄는 표현은 선생님이 여러 번 경고했음에도 불구하고 보고서를 내지 않은 점을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(완료/결과)\u003c/span> : have/has + not + p.p. : \"제출하지 않았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 despite + 명사구(양보)\u003c/span> : despite + 명사구 : \"내 모든 경고에도 불구하고\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"\"Rafe,\" he said, \"Rafe\"라고 그가 말했다.. \"you haven't turned in, 너는 제출하지 않았구나. your final lab report, 네 최종 실험 보고서를. despite all my warnings, 내 모든 경고에도 불구하고. this past month.\", 지난 한 달간. 이 문장 전체를 해석하면, \"Rafe.\" 그가 말했다. \"지난 한 달간 내 모든 경고에도 불구하고 너는 네 최종 실험 보고서를 제출하지 않았구나.\"","hl":"m"},{"n":28,"text":"이 문장은 선생님이 Rafe에게 최종 실험 보고서를 제출하지 않았다고 지적하는 장면이에요. 지난 한 달 동안 여러 번 경고했는데도 아직 내지 못했다는 거죠. 이 말 때문에 주인공의 여름 방학 계획이 무너지게 돼요.","hl":"mn"},{"n":29,"text":"haven't turned in은 현재완료 시제예요. 과거에 경고를 받았지만 지금까지도 보고서를 제출하지 않은 결과가 이어지고 있다는 뜻이죠. despite all my warnings는 전치사 despite가 명사구를 이끌며 그의 모든 경고에도 불구하고라는 양보의 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 말은\u003c/span>\u003cspan class=\"en\">The words\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나에게 충격을 줬다\u003c/span>\u003cspan class=\"en\">hit me\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">찬물을 끼얹듯이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">cold \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 말은 찬물을 끼얹듯이 나에게 충격을 줬다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 선생님의 말을 들은 주인공의 기분을 \u003cb class=\"key\">직유\u003c/b>로 보여 주는 \u003cb class=\"key\">전환점\u003c/b>입니다. '찬물을 끼얹듯이'라는 비유가 갑작스러운 \u003cb class=\"key\">충격\u003c/b>과 실망을 생생하게 강조해, 방학을 앞둔 들뜬 기분을 순식간에 가라앉힙니다. 이야기 분위기를 반전시키는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 like의 유사 용법 (직유 표현)\u003c/span> : hit me + [like + cold water] : \"찬물을 끼얹듯이 / 찬물처럼\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The words, 그 말은. hit me, 나에게 충격을 줬다. like cold water, 찬물을 끼얹듯이. 이 문장 전체를 해석하면, 그 말은 찬물을 끼얹듯이 나에게 충격을 줬다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 선생님이 한 말을 들은 주인공의 기분을 직유로 보여 주는 부분이에요. 찬물을 끼얹듯이라는 표현이 갑작스러운 충격과 실망을 강조해 주고, 방학을 앞둔 들뜬 기분이 순식간에 가라앉은 전환점이 됩니다. 그래서 이 문장이 이야기 분위기를 반전시키는 역할을 해요.","hl":"mn"},{"n":32,"text":"어법 포인트는 전치사 like입니다. like는 여기서 찬물처럼이라는 뜻으로 쓰였고, 뒤에 명사구 cold water가 왔어요. 찬물에 끼얹은 듯한 느낌을 직접 비유하는 직유 표현이기 때문에 문장의 충격을 훨씬 생생하게 전달해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 말이 맞았지만\u003c/span>\u003cspan class=\"en\">He was right, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">but\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 완전히 잊고 있었다\u003c/span>\u003cspan class=\"en\">I totally \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">forgot \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 말이 맞았지만 나는 그것에 대해 완전히 잊고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공이 선생님의 지적이 \u003cb class=\"key\">사실\u003c/b>이었음을 인정하면서도, 단순히 \u003cb class=\"key\">잊고 \u003c/b>\u003cb class=\"key\">있었다\u003c/b>는 점을 솔직하게 고백하는 문장입니다. 고의가 아니었음을 드러내지만 책임에서 벗어나지는 못한다는 \u003cb class=\"key\">무게\u003c/b>를 더해 주며, 뒤에 제시될 여름 학교 처분의 원인을 정리해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 but의 대조 연결\u003c/span> : He was right + but + I totally forgot about it. : \"그의 말이 맞았지만 나는 그것에 대해 완전히 잊고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 about + 목적어 / forget about의 의미\u003c/span> : forgot + [about + it(목적어)] : \"그것에 대해 잊고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"He was right, but, 그의 말이 맞았지만. I totally forgot, 나는 완전히 잊고 있었다. about it, 그것에 대해. 이 문장 전체를 해석하면, 그의 말이 맞았지만 나는 그것에 대해 완전히 잊고 있었다.","hl":"m"},{"n":34,"text":"이 문장은 주인공이 선생님의 지적이 옳았다는 것을 인정하면서도, 변명이 아니라 잊고 있었다는 사실을 솔직하게 말하는 부분이에요. 앞 문장의 충격에서 한 걸음 더 들어가, 잊은 것이 고의가 아니었음을 드러내지만 책임이 없어지는 것은 아니라는 점을 보여 줘요. 그래서 여름 학교로 이어지는 원인을 정리해 주는 역할을 합니다.","hl":"mn"},{"n":35,"text":"이 문장에서는 등위접속사 but과 전치사 about을 짚어 볼게요. 첫째, but은 앞뒤 절을 대조하면서 그의 말이 맞았지만 나는 잊고 있었다로 연결해 줍니다. 둘째, forgot about it에서 about은 전치사로, 뒤에 목적어 it이 와서 무엇에 대해 잊었는지를 구체적으로 나타내요. it은 아까 나온 최종 실험 보고서를 가리킵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 보충하려면\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너는 여름 학교에 출석해야 해\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">attend \u003c/span>\u003cspan class=\"tgt\">summer \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 덧붙여 말했다\u003c/span>\u003cspan class=\"en\">he added.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“그것을 보충하려면, 너는 여름 학교에 출석해야 해.” 그가 덧붙여 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선생님의 처분을 직접 인용한 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">대사\u003c/b>입니다. \u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">make \u003c/b>\u003cb class=\"key\">up \u003c/b>\u003cb class=\"key\">for \u003c/b>\u003cb class=\"key\">it\u003c/b>이 밀린 보고서를 보충하는 목적을, \u003cb class=\"key\">must \u003c/b>\u003cb class=\"key\">attend \u003c/b>\u003cb class=\"key\">summer \u003c/b>\u003cb class=\"key\">school\u003c/b>이 피할 수 없는 의무를 전달하면서 주인공의 여름 방학 계획을 무너뜨립니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : To make up for it + you must attend summer school : \"그것을 보충하려면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 must + 동사원형\u003c/span> : must + attend (동사원형) : \"여름 학교에 출석해야 해\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"\"To make up for it, 그것을 보충하려면. you must attend summer school,\", 너는 여름 학교에 출석해야 해. he added, 그가 덧붙여 말했다. 이 문장 전체를 해석하면, “그것을 보충하려면, 너는 여름 학교에 출석해야 해.” 그가 덧붙여 말했다.","hl":"m"},{"n":37,"text":"이 문장은 선생님이 제시하는 벌칙, 그러니까 여름 학교 출석을 직접 인용한 부분이에요. to make up for it으로 밀린 과제를 보충하는 것이 목적임을 분명히 하고, must attend summer school로 피할 수 없는 의무를 전달합니다. 여기서 주인공의 여름 방학 계획이 완전히 무너지게 되는 핵심 대사입니다.","hl":"mn"},{"n":38,"text":"어법 포인트는 문장 앞에 나온 To make up for it과 must attend summer school이에요. 첫째, To make up for it은 목적을 나타내는 to부정사의 부사적 용법으로, 보충하려면이라는 뜻으로 뒤 문장 전체를 수식합니다. 둘째, must는 의무를 나타내는 조동사라서 뒤에 반드시 동사원형 attend가 왔어요. make up for는 만회하다 보충하다라는 뜻의 숙어로 함께 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게으른 아침과 끝없는 자유 시간 대신에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">lazy \u003c/span>\u003cspan class=\"tgt\">mornings \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">endless \u003c/span>\u003cspan class=\"tgt\">free \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 내 방학을 보내게 될 텐데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">I'd \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">spending\u003c/span> my vacation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실험대에서—내 소중한 여름에 내가 가장 하고 싶지 않은 것이었다.\u003c/span>\u003cspan class=\"en\">at a lab table—\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">last \u003c/span>\u003cspan class=\"tgt\">thing \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span> with my precious summer.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여유로운 아침과 끝없는 자유 시간 대신에, 나는 실험대에서 방학을 보내게 되겠지. 이것은 내 소중한 여름에 내가 가장 하고 싶지 않은 것이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 방학에 대한 기대와 정반대되는 현실을 대조하며, 여름 학교에 가야 하는 주인공의 실망과 억울함을 강조한다. \u003cb class=\"key\">게으른 \u003c/b>\u003cb class=\"key\">아침과 \u003c/b>\u003cb class=\"key\">끝없는 \u003c/b>\u003cb class=\"key\">자유 \u003c/b>\u003cb class=\"key\">시간\u003c/b> 대신 \u003cb class=\"key\">실험대\u003c/b>에서 방학을 보내야 한다는 대비가 핵심이며, 대시 뒤의 \u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">last \u003c/b>\u003cb class=\"key\">thing\u003c/b>은 '가장 하고 싶지 않은 일'이라는 뜻으로 여름 학교에 대한 강한 거부감을 드러낸다. 결국 소중한 여름을 빼앗긴 주인공의 심정이 요약된 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 Instead of + 명사구\u003c/span> : Instead of + [명사구] (전치사구) : \"게으른 아침과 끝없는 자유 시간 대신에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">would be -ing (과거 시점에서 본 미래 진행/예정)\u003c/span> : would + be + [현재분사 (-ing)] : \"나는 보내게 될 텐데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략 + to부정사의 명사적 용법\u003c/span> : [선행사 the last thing] + [(that/which) 생략] + [주어 I + 동사 wanted + 목적어 to do (to부정사)] : \"내가 하고 싶어 했던 마지막 일(가장 하고 싶지 않은 일)\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Instead of lazy mornings and endless free time, 게으른 아침과 끝없는 자유 시간 대신에. I'd be spending my vacation, 나는 내 방학을 보내게 될 텐데. at a lab table—the last thing I wanted to do with my precious summer, 실험대에서—내 소중한 여름에 내가 가장 하고 싶지 않은 것이었다.. 이 문장 전체를 해석하면, 여유로운 아침과 끝없는 자유 시간 대신에, 나는 실험대에서 방학을 보내게 되겠지. 이것은 내 소중한 여름에 내가 가장 하고 싶지 않은 것이었다.","hl":"m"},{"n":40,"text":"이 문장은 여름 방학을 기대했던 주인공에게 닥친 암울한 현실을 대조적으로 보여 줍니다. 게으른 아침과 끝없는 자유 시간 대신에 실험대에서 방학을 보내야 한다는 상황을 제시하며, 그게 바로 주인공이 소중한 여름에 가장 하고 싶지 않은 일이라는 점을 강조합니다. 뒤에 나오는 the last thing은 정말 하기 싫은 일이라는 강한 부정의 표현이에요.","hl":"mn"},{"n":41,"text":"첫 번째 포인트는 Instead of lazy mornings and endless free time입니다. Instead of는 전치사라서 뒤에 명사 상당어구가 오고, 게으른 아침과 끝없는 자유 시간 대신에라는 의미로 앞뒤 상황을 대조해 줘요. 두 번째 포인트는 I'd be spending입니다. 여기서 I'd는 I would이고, would be spending은 과거 시점에서 앞으로 진행될 일을 나타내는 과거의 미래 진행 표현이에요. 세 번째 포인트는 the last thing I wanted to do에요. 이 부분은 명사 the last thing을 I wanted to do가 꾸미는 관계사절인데, 목적격 관계대명사 that이 생략되어 있어요. 그리고 wanted의 목적어로 to do가 쓰인 to부정사의 명사적 용법도 함께 보면 좋습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>방학 전 마지막 날, 화자는 \u003cb class=\"key\">몇 \u003c/b>\u003cb class=\"key\">달간의 \u003c/b>\u003cb class=\"key\">퀴즈와 \u003c/b>\u003cb class=\"key\">과제\u003c/b>를 뒤로하고 \u003cb class=\"key\">해방감\u003c/b>을 느꼈다.\u003c/li>\u003cli>사물함을 정리하며 \u003cb class=\"key\">무엇도 \u003c/b>\u003cb class=\"key\">기분을 \u003c/b>\u003cb class=\"key\">망칠 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없다\u003c/b>고 생각하던 중 \u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">선생님\u003c/b>이 따로 불렀다.\u003c/li>\u003cli>선생님은 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">보고서\u003c/b>를 내지 않았다며 \u003cb class=\"key\">여름 \u003c/b>\u003cb class=\"key\">학교\u003c/b> 출석을 요구했다.\u003c/li>\u003cli>화자는 \u003cb class=\"key\">여유로운 \u003c/b>\u003cb class=\"key\">아침\u003c/b>과 \u003cb class=\"key\">끝없는 \u003c/b>\u003cb class=\"key\">자유 \u003c/b>\u003cb class=\"key\">시간\u003c/b> 대신 \u003cb class=\"key\">실험대\u003c/b>에서 보내야 하는 \u003cb class=\"key\">소중한 \u003c/b>\u003cb class=\"key\">여름\u003c/b>의 상실을 깨달았다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A student's joyful last day of school turns into the start of an unwanted summer school after a forgotten lab report comes to light.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">방학 전 마지막 날, \u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">선생님\u003c/b>의 지적으로 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">보고서\u003c/b>를 제출하지 않았다는 사실이 드러나 \u003cb class=\"key\">여름 \u003c/b>\u003cb class=\"key\">학교\u003c/b>에 가게 된다. 설레던 \u003cb class=\"key\">여름 \u003c/b>\u003cb class=\"key\">방학\u003c/b>은 \u003cb class=\"key\">실험대\u003c/b> 앞에서 보내는 시간으로 바뀌고 만다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 정리하면, 방학을 앞둔 기대가 잊어버린 최종 실험 보고서 때문에 무너지는 이야기였어요. Instead of처럼 대조 신호를 잡아 읽으면 화자의 상실감이 더 선명하게 보이고요. 여러분도 과제는 미리미리 챙겨서 소중한 방학을 지키세요. 오늘 수업은 여기까지입니다, 수고했어요.","hl":null}]}]});</script></body></html>
