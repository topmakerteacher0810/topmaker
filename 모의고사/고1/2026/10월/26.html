</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;

    att=0;playAudio(s);}

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 26번","audioDir":"26_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">26번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>From Radar Technician to Computer Pioneer: Douglas Engelbart\u003c/h1>\u003ch2>레이더 기술자에서 컴퓨터 개척자로: 더글러스 엥겔바트\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">Douglas \u003c/b>\u003cb class=\"key\">Carl \u003c/b>\u003cb class=\"key\">Engelbart\u003c/b>는 \u003cb class=\"key\">레이더 \u003c/b>\u003cb class=\"key\">기술자\u003c/b>로 복무하며 컴퓨터로 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 향상시키려는 \u003cb class=\"key\">비전\u003c/b>을 갖게 되었고, \u003cb class=\"key\">University \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">California, \u003c/b>\u003cb class=\"key\">Berkeley\u003c/b>에서 \u003cb class=\"key\">전기 \u003c/b>\u003cb class=\"key\">공학\u003c/b>을 연구한 뒤 1968년 \u003cb class=\"key\">컴퓨터 \u003c/b>\u003cb class=\"key\">마우스\u003c/b>를 시연하여 \u003cb class=\"key\">컴퓨터 \u003c/b>\u003cb class=\"key\">역사\u003c/b>에 \u003cb class=\"key\">기념비적인 \u003c/b>\u003cb class=\"key\">사건\u003c/b>을 남겼다. 이후 \u003cb class=\"key\">컴퓨터 \u003c/b>\u003cb class=\"key\">과학\u003c/b>에 대한 공헌으로 \u003cb class=\"key\">Turing \u003c/b>\u003cb class=\"key\">Award\u003c/b>와 \u003cb class=\"key\">National \u003c/b>\u003cb class=\"key\">Medal \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">Technology\u003c/b>를 수상했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Douglas Engelbart transformed human-computer interaction by demonstrating the computer mouse after developing a vision of using computers to enhance human abilities.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 살펴볼 지문은 컴퓨터 마우스로 유명한 더글러스 칼 엥겔바트에 대한 이야기예요. 이 지문은 그가 인간과 컴퓨터의 상호 작용 분야를 어떻게 바꾸었는지를 시간 순서로 보여 줍니다. 먼저 전체 요지를 영어로 확인하면, Douglas Engelbart transformed human-computer interaction by demonstrating the computer mouse after developing a vision of using computers to enhance human abilities. 요약하자면 그는 레이더 기술자로 복무하며 컴퓨터로 인간의 능력을 높이려는 비전을 갖게 되었고, 버클리 대학교에서 전기 공학을 연구한 뒤 컴퓨터 마우스를 시연하고 튜링상과 국가 기술 훈장을 받았다는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간과 컴퓨터의 상호 작용(Human-Computer Interaction, HCI)은 사람이 컴퓨터를 더 쉽고 자연스럽게 쓰도록 만드는 분야예요. Engelbart가 활동하던 시기의 컴퓨터는 계산기처럼 쓰였고 일반인에게는 먼 존재였습니다. 그가 내놓은 \u003cb class=\"key\">컴퓨터 \u003c/b>\u003cb class=\"key\">마우스\u003c/b>는 오늘날 우리가 화면을 클릭하는 방식의 출발점이 되었어요. 스마트폰 터치가 없는 시절, 손과 화면을 이어 주는 도구가 바로 마우스라고 생각하면 됩니다. 그의 비전은 기계를 조작하는 데 그치지 않고 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 확장하는 데 있었습니다. 이를 인정받아 컴퓨터 과학 분야의 노벨상이라 불리는 \u003cb class=\"key\">Turing \u003c/b>\u003cb class=\"key\">Award\u003c/b>와 미국의 최고 기술 훈장인 \u003cb class=\"key\">National \u003c/b>\u003cb class=\"key\">Medal \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">Technology\u003c/b>를 받았어요.\u003c/div>","segs":[{"n":2,"text":"인간과 컴퓨터의 상호 작용, 즉 Human-Computer Interaction은 사람이 컴퓨터를 더 쉽고 자연스럽게 쓰도록 만드는 분야예요. 엥겔바트가 활동하던 시기의 컴퓨터는 지금처럼 개인용이 아니라 주로 계산이나 군사 목적에 쓰이던 거대한 기계였습니다. 그가 개발한 컴퓨터 마우스는 오늘날 우리가 화면을 클릭하는 방식의 출발점이 되었어요. 스마트폰 터치가 없던 시절 손과 화면을 이어 주는 도구가 바로 마우스라고 비유할 수 있겠죠. 그의 진짜 목표는 기계 조작이 아니라 인간의 능력을 확장하는 것이었고, 그래서 컴퓨터 과학의 노벨상이라 불리는 Turing Award와 미국 최고 기술 훈장인 National Medal of Technology를 받았습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인물 소개와 출생\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 문장에서 Engelbart를 \u003cb class=\"key\">인간과 \u003c/b>\u003cb class=\"key\">컴퓨터의 \u003c/b>\u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">작용\u003c/b> 분야를 변화시킨 \u003cb class=\"key\">미국인 \u003c/b>\u003cb class=\"key\">엔지니어이자 \u003c/b>\u003cb class=\"key\">발명가\u003c/b>로 소개한다. 이어서 그가 1925년 Oregon주 Portland에서 \u003cb class=\"key\">유럽인 \u003c/b>\u003cb class=\"key\">이민자\u003c/b> 가정에서 태어났다는 배경을 제시한다. 지문은 인물의 정체성과 출생을 먼저 밝히며 시작한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>전쟁 복무와 비전 형성\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>제2차 세계 대전 동안 그는 \u003cb class=\"key\">레이더 \u003c/b>\u003cb class=\"key\">기술자\u003c/b>로 필리핀에 있는 미 해군에서 복무했다. 바로 이 시기에 한 편의 글을 읽었고, 이 글이 컴퓨터를 사용해 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">능력을 \u003c/b>\u003cb class=\"key\">향상\u003c/b>시키고 \u003cb class=\"key\">복잡한 \u003c/b>\u003cb class=\"key\">문제\u003c/b>를 해결하려는 그의 비전에 영향을 주었다. 군 복무 경험이 훗날 연구 방향의 밑바탕이 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>학위와 연구\u003csmall>전개 · 문장 5\u003c/small>\u003c/h4>\u003cp>복무를 마친 후 그는 University of California, Berkeley에서 \u003cb class=\"key\">전기 \u003c/b>\u003cb class=\"key\">공학\u003c/b>으로 석사와 박사 학위를 받았다. 그곳에서 그는 \u003cb class=\"key\">컴퓨터 \u003c/b>\u003cb class=\"key\">관련 \u003c/b>\u003cb class=\"key\">연구\u003c/b>에 집중했다. 이는 앞서 형성된 비전을 학문적으로 발전시킨 과정이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>기술 시연과 수상\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>1968 Fall Joint Computer Conference에서 그는 \u003cb class=\"key\">컴퓨터 \u003c/b>\u003cb class=\"key\">마우스\u003c/b>를 포함한 기술들을 시연했고, 이는 컴퓨터 역사에서 기념비적인 사건이 되었다. 이후 컴퓨터 과학에 대한 공헌으로 \u003cb class=\"key\">Turing \u003c/b>\u003cb class=\"key\">Award\u003c/b>와 \u003cb class=\"key\">National \u003c/b>\u003cb class=\"key\">Medal \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">Technology\u003c/b>를 받았다. 이로써 그의 업적이 공식적으로 인정받았다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이 지문의 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 첫 문장과 두 번째 문장으로, 엥겔바트를 인간과 컴퓨터의 상호 작용 분야를 변화시킨 미국인 엔지니어이자 발명가로 소개하고, 그가 오리건주 포틀랜드의 유럽인 이민자 가정에서 태어났다는 배경을 제시해요. 인물의 정체성과 출생 정보로 이야기를 시작하는 전형적인 인물 소개 방식이죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 세 번째 문장과 네 번째 문장인데, 제2차 세계 대전 동안 레이더 기술자로 미 해군에서 복무한 경험이 나와요. 바로 이 시기에 읽은 한 편의 글이 컴퓨터로 인간의 능력을 향상시키고 복잡한 문제를 해결하려는 그의 비전에 영향을 주었어요. 군 복무 경험이 연구 방향의 밑바탕이 된다는 점을 기억하세요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 다섯 번째 문장인데, 복무를 마친 후 버클리 대학교에서 전기 공학으로 석사와 박사 학위를 받고 컴퓨터 관련 연구에 집중했다는 내용이에요. 앞서 형성된 비전을 학문적으로 발전시킨 과정으로 볼 수 있어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 여섯 번째 문장과 일곱 번째 문장으로, 샌프란시스코에서 열린 추계 합동 컴퓨터 학회에서 컴퓨터 마우스를 포함한 기술을 시연한 사건과 수상 이력이 나와요. 이 시연은 컴퓨터 역사에서 기념비적인 사건이 되었고, 이후 튜링상과 국가 기술 훈장을 받으며 공로를 인정받았어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 인물의 정체성과 \u003cb class=\"key\">인간과 \u003c/b>\u003cb class=\"key\">컴퓨터의 \u003c/b>\u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">작용\u003c/b> 분야 변화를 제시한 뒤, 출생부터 복무, 학위, 시연, 수상까지 \u003cb class=\"key\">시간순\u003c/b>으로 서술하고 있어요. 뒷부분의 모든 사건은 주제문을 뒷받침하는 구체적 사례들입니다. 따라서 첫 문장이 \u003cb class=\"key\">주제문\u003c/b>인 두괄식 구조로 볼 수 있어요. 이렇게 하면 인물의 생애와 업적을 쉽게 따라갈 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>During World War II (3)\u003c/b>\u003cspan>시간 배경\u003c/span>\u003cb>It was during this time (4)\u003c/b>\u003cspan>시기 강조\u003c/span>\u003cb>After serving (5)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>In the 1968 Fall Joint Computer Conference (6)\u003c/b>\u003cspan>사건 시점\u003c/span>\u003cb>For his contributions (7)\u003c/b>\u003cspan>인과·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Douglas Carl Engelbart\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">using computers to enhance human abilities and solve complex problems\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">computer-related research\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his technologies including the computer mouse\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">contributions to computer science\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 시간순이에요. 첫 문장에서 인물의 핵심 정체성을 먼저 제시하고, 이후 출생부터 복무, 학위, 시연, 수상까지 시간 흐름에 따라 사건을 나열하는 두괄식 구조를 취하고 있어요. 주제문은 첫 번째 문장이고, 뒤에 나오는 구체적 사건들이 이를 뒷받침합니다.","hl":"ty"},{"n":9,"text":"시간 신호어를 보면 During World War II, It was during this time, After serving, In the Fall Joint Computer Conference, For his contributions 같은 표현이 나와요. 이런 표현들은 사건의 순서와 인과를 잡아 주는 길잡이 역할을 합니다. 또 human-computer interaction은 using computers to enhance human abilities and solve complex problems, computer-related research, technologies including the computer mouse, contributions to computer science처럼 계속 바뀌어 표현되니 같은 개념을 연결해서 읽어야 해요. 이 글은 대조 구도보다는 시간 순서가 중심이라 대조는 크게 드러나지 않아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>engineer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>엔지니어, 공학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>inventor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발명가\u003c/span>\u003c/div>\u003cdiv>\u003cb>transform\u003c/b>\u003cem>동사\u003c/em>\u003cspan>변화시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>human-computer interaction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인간과 컴퓨터의 상호 작용\u003c/span>\u003c/div>\u003cdiv>\u003cb>immigrant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이민자\u003c/span>\u003c/div>\u003cdiv>\u003cb>World War II\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제2차 세계 대전\u003c/span>\u003c/div>\u003cdiv>\u003cb>serve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>복무하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>radar technician\u003c/b>\u003cem>명사\u003c/em>\u003cspan>레이더 기술자\u003c/span>\u003c/div>\u003cdiv>\u003cb>U.S. Navy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미 해군\u003c/span>\u003c/div>\u003cdiv>\u003cb>article\u003c/b>\u003cem>명사\u003c/em>\u003cspan>글, 기사\u003c/span>\u003c/div>\u003cdiv>\u003cb>influence\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vision\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비전, 전망\u003c/span>\u003c/div>\u003cdiv>\u003cb>enhance\u003c/b>\u003cem>동사\u003c/em>\u003cspan>향상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>solve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>complex\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>복잡한\u003c/span>\u003c/div>\u003cdiv>\u003cb>earn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>획득하다, 받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>master's degree\u003c/b>\u003cem>명사\u003c/em>\u003cspan>석사 학위\u003c/span>\u003c/div>\u003cdiv>\u003cb>doctoral degree\u003c/b>\u003cem>명사\u003c/em>\u003cspan>박사 학위\u003c/span>\u003c/div>\u003cdiv>\u003cb>electrical engineering\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전기 공학\u003c/span>\u003c/div>\u003cdiv>\u003cb>focus\u003c/b>\u003cem>동사\u003c/em>\u003cspan>집중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>computer-related research\u003c/b>\u003cem>명사\u003c/em>\u003cspan>컴퓨터 관련 연구\u003c/span>\u003c/div>\u003cdiv>\u003cb>Fall Joint Computer Conference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>추계 합동 컴퓨터 학회\u003c/span>\u003c/div>\u003cdiv>\u003cb>demonstrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시연하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>computer mouse\u003c/b>\u003cem>명사\u003c/em>\u003cspan>컴퓨터 마우스\u003c/span>\u003c/div>\u003cdiv>\u003cb>monumental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기념비적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>contribution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공헌, 기여\u003c/span>\u003c/div>\u003cdiv>\u003cb>receive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수상하다, 받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Turing Award\u003c/b>\u003cem>명사\u003c/em>\u003cspan>튜링상\u003c/span>\u003c/div>\u003cdiv>\u003cb>National Medal of Technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>국가 기술 훈장\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이 지문에서 transform은 변화시키다, enhance는 향상시키다, monumental은 기념비적인이라는 뜻으로 기억하세요. engineer와 inventor는 각각 엔지니어와 발명가, contribution은 공헌이라는 뜻이에요. computer mouse 같은 핵심 용어는 그대로 컴퓨터 마우스로 읽으면 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">transform\u003c/b>\u003cspan class=\"m\">변화시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">change\u003c/span>\u003cspan class=\"s\">alter\u003c/span>\u003cspan class=\"s\">convert\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">preserve\u003c/span>\u003cspan class=\"a\">maintain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enhance\u003c/b>\u003cspan class=\"m\">향상시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">improve\u003c/span>\u003cspan class=\"s\">boost\u003c/span>\u003cspan class=\"s\">strengthen\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">diminish\u003c/span>\u003cspan class=\"a\">weaken\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">complex\u003c/b>\u003cspan class=\"m\">복잡한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">complicated\u003c/span>\u003cspan class=\"s\">intricate\u003c/span>\u003cspan class=\"s\">involved\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003cspan class=\"a\">plain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">demonstrate\u003c/b>\u003cspan class=\"m\">시연하다, 증명하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show\u003c/span>\u003cspan class=\"s\">display\u003c/span>\u003cspan class=\"s\">exhibit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">monumental\u003c/b>\u003cspan class=\"m\">기념비적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">historic\u003c/span>\u003cspan class=\"s\">major\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insignificant\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">solve\u003c/b>\u003cspan class=\"m\">해결하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">resolve\u003c/span>\u003cspan class=\"s\">settle\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">complicate\u003c/span>\u003cspan class=\"a\">aggravate\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘의 동의어와 반의어를 정리해 볼게요. transform은 change나 alter와 비슷하고, preserve나 maintain과 반대예요. enhance는 improve나 boost와 비슷하고 diminish나 weaken과 반대고, complex는 complicated나 intricate와 비슷하며 simple과 반대예요. demonstrate는 show나 display와 비슷하고 conceal과 반대, monumental은 significant나 historic과 비슷하고 insignificant와 반대예요. solve는 resolve나 settle과 비슷하고 complicate나 aggravate와 반대되는 표현이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Douglas Carl Engelbart는\u003c/span>\u003cspan class=\"en\">Douglas Carl Engelbart\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국인 엔지니어이자 발명가였다\u003c/span>\u003cspan class=\"en\">was an American engineer and inventor\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변화시킨\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">transformed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간과 컴퓨터의 상호 작용 분야를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">field \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">humancomputer \u003c/span>\u003cspan class=\"tgt\">interaction\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Douglas Carl Engelbart는 인간과 컴퓨터의 상호 작용 분야를 변화시킨 미국인 엔지니어이자 발명가였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 글의 인물인 Douglas Carl Engelbart가 누구인지를 정의하면서 핵심 정보를 제시한다. who transformed 이하의 수식어를 통해 그가 \u003cb class=\"key\">인간과 \u003c/b>\u003cb class=\"key\">컴퓨터의 \u003c/b>\u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">작용\u003c/b> 분야를 변화시킨 인물임을 강조한다. 이 문장은 이후 출생, 복무, 성과 등 배경 정보를 설명하는 중심축 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사(사람) + who + 동사구 : \"인간과 컴퓨터의 상호 작용 분야를 변화시킨\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Douglas Carl Engelbart, Douglas Carl Engelbart는. was an American engineer and inventor, 미국인 엔지니어이자 발명가였다. who transformed, 변화시킨. the field of humancomputer interaction, 인간과 컴퓨터의 상호 작용 분야를. 이 문장 전체를 해석하면, Douglas Carl Engelbart는 인간과 컴퓨터의 상호 작용 분야를 변화시킨 미국인 엔지니어이자 발명가였다.","hl":"m"},{"n":13,"text":"이 문장은 이 글의 주인공인 Douglas Carl Engelbart가 누구인지 정의하는 첫 번째 문장입니다. 그가 인간과 컴퓨터의 상호 작용 분야를 변화시킨 미국인 엔지니어이자 발명가라는 사실을 제시하면서 글 전체의 핵심 정보를 먼저 전하고 있습니다. 뒤에 나오는 출생이나 복무 이력은 이 핵심 정보를 뒷받침하는 배경이 되는 거죠.","hl":"mn"},{"n":14,"text":"이 문장에서 who transformed the field of humancomputer interaction 부분을 봅시다. 여기서 who는 앞에 있는 an American engineer and inventor를 수식하는 주격 관계대명사입니다. who가 사람 선행사를 받아 뒤에 동사 transformed를 끌고 오면서 어떤 분야를 바꾸었는지 구체적으로 설명해 주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 태어났다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">born\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Oregon주 Portland에서\u003c/span>\u003cspan class=\"en\">in Portland, Oregon,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1925년에\u003c/span>\u003cspan class=\"en\">in 1925\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유럽인 이민자 가정에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">European \u003c/span>\u003cspan class=\"tgt\">immigrant \u003c/span>\u003cspan class=\"tgt\">family\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 1925년 Oregon주 Portland에서 유럽인 이민자 가정에서 태어났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Engelbart의 출생 정보를 구체적으로 제시한다. 1925년 Oregon주 Portland에서 \u003cb class=\"key\">유럽인 \u003c/b>\u003cb class=\"key\">이민자 \u003c/b>\u003cb class=\"key\">가정\u003c/b>에서 태어났다는 배경은 그의 정체성과 성장 환경을 파악하는 데 도움을 준다. 인과나 비유보다는 인물의 신상 정보를 제공하는 서술이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(관용적 be born)\u003c/span> : be born + 전치사구 : \"태어났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to의 용법(출신·귀속)\u003c/span> : be born to + 명사구 : \"유럽인 이민자 가정에서\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He was born, 그는 태어났다. in Portland, Oregon, Oregon주 Portland에서. in 1925, 1925년에. to a European immigrant family, 유럽인 이민자 가정에서. 이 문장 전체를 해석하면, 그는 1925년 Oregon주 Portland에서 유럽인 이민자 가정에서 태어났다.","hl":"m"},{"n":16,"text":"이 문장은 Engelbart가 1925년 Oregon주 Portland에서 유럽인 이민자 가정에서 태어났다는 구체적인 출생 배경을 설명해 주고 있어요. 이 정보는 인물의 정체성과 성장 환경을 이해하는 데 도움을 주는 배경 서술입니다. 뒤에 이어지는 그의 학력과 경력 이야기를 이해하기 위한 기본 정보로 보시면 됩니다.","hl":"mn"},{"n":17,"text":"여기서 was born은 형태상 수동태이지만 실제로는 태어나다라는 뜻으로 굳어진 관용 표현이에요. born은 bear의 과거분사이고 사람이 태어났다는 뜻을 나타낼 때는 be born으로 쓰는 것이 자연스럽습니다. 그리고 to a European immigrant family에서 to는 어떤 가정에서 태어났는지 출신 배경을 나타내는 전치사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제2차 세계 대전 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">During \u003c/span>\u003cspan class=\"tgt\">World \u003c/span>\u003cspan class=\"tgt\">War \u003c/span>\u003cspan class=\"tgt\">II\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 복무했다\u003c/span>\u003cspan class=\"en\">he served\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">레이더 기술자로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">radar \u003c/span>\u003cspan class=\"tgt\">technician\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미 해군에서\u003c/span>\u003cspan class=\"en\">in the U.S. Navy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">필리핀에서\u003c/span>\u003cspan class=\"en\">in the Philippines.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">제2차 세계 대전 동안, 그는 레이더 기술자로 필리핀에 있는 미 해군에서 복무했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Engelbart가 제2차 세계 대전 중 미 해군에서 \u003cb class=\"key\">레이더 \u003c/b>\u003cb class=\"key\">기술자\u003c/b>로 복무한 이력을 설명한다. 이 복무 경험은 뒤에 나오는 컴퓨터 연구에 대한 관심과 연결될 수 있는 중요한 배경이다. 'in the Philippines'는 그가 복무한 장소를 덧붙인 전치사구이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시간)\u003c/span> : During + 명사구 : \"제2차 세계 대전 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as의 용법(자격)\u003c/span> : serve as + 명사구 : \"레이더 기술자로\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"During World War II, 제2차 세계 대전 동안. he served, 그는 복무했다. as a radar technician, 레이더 기술자로. in the U.S. Navy, 미 해군에서. in the Philippines, 필리핀에서. 이 문장 전체를 해석하면, 제2차 세계 대전 동안, 그는 레이더 기술자로 필리핀에 있는 미 해군에서 복무했다.","hl":"m"},{"n":19,"text":"이 문장은 엥겔바트가 제2차 세계 대전 동안 필리핀의 미 해군에서 레이더 기술자로 복무했다는 이력을 전해 줍니다. 이 복무 경험은 이후 그가 컴퓨터와 기술 분야로 나아가는 데 중요한 밑거름이 되었을 가능성이 있는 배경 정보입니다. 시간과 장소를 나타내는 전치사구가 문장 앞뒤에 배치되어 정보를 차례로 제시하고 있어요.","hl":"mn"},{"n":20,"text":"이 문장에서 During World War II는 시간을 나타내는 전치사구로 문장 앞에 와서 전체 사건의 시간 배경을 제시합니다. 다음으로 as a radar technician에서 as는 자격을 나타내는 전치사로 쓰였고 serve as는 어떤 역할로 복무하다라는 뜻을 만들어 줍니다. in the Philippines는 장소를 나타내는 전치사구로 문장 끝에서 위치 정보를 보충해 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 이 시기 동안이었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">during \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 한 편의 글을 읽은 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> he read an article\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 비전에 영향을 준\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">influenced \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">vision\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">컴퓨터를 사용하는 것에 대한\u003c/span>\u003cspan class=\"en\">of using computers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 능력을 향상시키기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">enhance \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">abilities \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 복잡한 문제들을 해결하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">solve \u003c/span>\u003cspan class=\"tgt\">complex \u003c/span>\u003cspan class=\"tgt\">problems\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인간의 능력을 향상시키고 복잡한 문제들을 해결하기 위해 컴퓨터를 사용하는 것에 대한 그의 비전에 영향을 준 한 편의 글을 그가 읽은 것은 바로 이 시기 동안이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Engelbart가 해군에서 복무하던 시기에 읽은 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">편의 \u003c/b>\u003cb class=\"key\">글\u003c/b>이 컴퓨터로 인간 능력을 \u003cb class=\"key\">향상\u003c/b>시키고 복잡한 문제를 해결하겠다는 \u003cb class=\"key\">비전\u003c/b>을 심어 주었다는 내용입니다. It-that 강조구문으로 '바로 이 시기 동안이었다'를 강조해, 그의 연구 방향을 결정지은 계기를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">It ~ that 강조구문\u003c/span> : It is/was + 강조할 부사구 + that + 주어 + 동사 : \"바로 이 시기 동안이었다, ...\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 that의 주격 용법\u003c/span> : 선행사(an article) + that + 동사(influenced) + 목적어 : \"그의 비전에 영향을 준\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)과 동사 병렬\u003c/span> : to + 동사원형 + and + 동사원형 : \"인간의 능력을 향상시키고 복잡한 문제들을 해결하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It was during this ti
