  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 39번","audioDir":"39_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">39번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Pressure Balance on Land and Underwater\u003c/h1>\u003ch2>지상과 수중에서의 압력 균형\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>지구 표면에서 인체는 \u003cb class=\"key\">대기압\u003c/b>을 받지만 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">압력\u003c/b>과 균형을 이루어 느끼지 못한다. 잠수 시에는 \u003cb class=\"key\">수압\u003c/b>이 추가되어 외부 압력과 내부 압력을 같게 유지하기 위해 주변 수압과 같은 압력의 \u003cb class=\"key\">호흡용 \u003c/b>\u003cb class=\"key\">혼합물\u003c/b>을 공급해야 하며, 수압은 깊이에 비례해 10미터마다 1바씩 증가한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>On land, external air pressure is balanced by internal body pressure, but underwater divers must receive breathing gas at the same pressure as the surrounding water, which increases by 1 bar every 10 meters.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 잠수와 압력의 관계를 설명하는 글입니다. 지구 표면에서 우리가 느끼지 못하는 압력이 물속에서는 왜 문제가 되는지, 그리고 잠수부에게 호흡용 기체를 어떤 압력으로 공급해야 하는지를 다룹니다. 요약하면, 지표에서는 외부 압력과 내부 압력이 균형을 이루지만 물속에서는 수압이 더해지므로 주변 물의 압력과 같은 압력의 호흡 혼합물을 공급해야 한다는 내용이에요. 요지는 pressure balance underwater is essential for a diver and breathing gas must be supplied at the same pressure as the surrounding water입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 평소 느끼지 못하지만 지구 표면의 공기가 누르는 힘을 \u003cb class=\"key\">대기압\u003c/b>(atmospheric pressure)이라고 하고, 물이 누르는 힘은 \u003cb class=\"key\">수압\u003c/b>(water pressure)이라고 해요. 1기압은 약 1bar로, 수심 10m마다 1bar씩 커져요. 잠수부가 물속에서 압력을 느끼지 않으려면 몸 안의 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">압력\u003c/b>과 바깥의 \u003cb class=\"key\">외부 \u003c/b>\u003cb class=\"key\">압력\u003c/b>이 같아야 해요. 이를 위해 공기나 \u003cb class=\"key\">호흡용 \u003c/b>\u003cb class=\"key\">혼합물\u003c/b>(breathing mixture)을 주변 물의 압력과 같은 압력으로 공급해 줘요. 일상에서는 빈 페트병을 물속 깊이 넣을수록 찌그러지는 것과 비슷해요.\u003c/div>","segs":[{"n":2,"text":"여러분, 압력이라는 게 좀 추상적이죠. 우리가 평소 느끼지 못하지만 지구 표면의 공기가 우리 몸을 누르는 힘을 대기압 atmospheric pressure이라고 하고, 물이 누르는 힘은 수압 water pressure이라고 해요. 일 기압은 약 일 바 bar에 해당하고, 수심 십 미터마다 일 바씩 증가해요. 잠수부가 물속에서 압력을 느끼지 않으려면 몸 안의 내부 압력과 바깥의 외부 압력이 같아야 하죠. 일상에서는 빈 페트병을 물속 깊이 넣을수록 찌그러지는 것과 비슷해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>지표면 압력 균형\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>지구 표면 인체는 16~18톤의 \u003cb class=\"key\">대기압\u003c/b>을 받지만 느끼지 못한다. 외부 압력이 폐와 공기 공간의 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">압력\u003c/b>과 균형을 이루기 때문이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>수중 압력 문제와 해결\u003csmall>문제 제기와 해결 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>잠수 중에는 대기압에 더해 \u003cb class=\"key\">수압\u003c/b>이 인체에 작용한다. 물속에서 압력을 느끼지 않으려면 외부 압력과 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">압력\u003c/b>이 같아야 한다. 이를 위해 주변 물 압력과 같은 압력으로 \u003cb class=\"key\">호흡용 \u003c/b>\u003cb class=\"key\">혼합물\u003c/b>을 공급한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>수압 증가 규칙\u003csmall>근거 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">수압\u003c/b>은 깊이에 비례하여 증가한다. 10미터마다 \u003cb class=\"key\">1바\u003c/b>씩 증가한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>10m 깊이 적용\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>10미터 깊이 잠수부는 \u003cb class=\"key\">2바\u003c/b> 압력을 겪는다. 압력을 맞추려면 \u003cb class=\"key\">2기압\u003c/b>의 호흡용 혼합물 공급이 필요하다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 한 문장으로 보면, 지표면에서 압력 균형을 확인한 뒤 물속에서 필요한 압력 균형과 호흡 기체 공급, 그리고 수압 증가 원리를 차례로 설명하는 구조예요.","hl":null},{"n":4,"text":"첫 번째 문장과 두 번째 문장에서는 지구 표면의 인체가 받는 압력을 설명해요. 인체는 신체 표면 일 제곱미터당 십육 톤에서 십팔 톤에 달하는 일정한 기압을 겪죠. 그런데도 우리가 느끼지 못하는 이유는 외부 압력이 폐와 공기가 들어 있는 공간의 내부 압력과 균형을 이루기 때문이에요.","hl":"f0"},{"n":5,"text":"세 번째 문장부터 다섯 번째 문장까지는 잠수 상황으로 넘어가요. 잠수하는 동안에는 대기압 외에 물의 압력도 인체에 작용하죠. 물속에서 주변 환경의 압력을 느끼지 않으려면 외부 압력과 내부 압력이 같은 상태를 유지해야 해요. 그래서 공기나 호흡용 혼합물을 주변 물이 가하는 압력과 같은 압력으로 잠수부에게 공급해야 한답니다.","hl":"f1"},{"n":6,"text":"여섯 번째와 일곱 번째 문장은 수압 증가 규칙을 설명해요. 수압은 깊이에 비례해서 증가하고, 십 미터마다 일 바씩 커져요.","hl":"f2"},{"n":7,"text":"여덟 번째 문장은 십 미터 깊이에 적용한 예시예요. 십 미터 깊이에 있는 잠수부는 이 바의 압력을 겪게 되고, 압력을 맞추기 위해서는 이 기압의 호흡용 혼합물 공급이 필요하죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">문제-해결\u003c/b> 구조로, 지표면의 압력 균형을 배경으로 제시하고 물속에서 수압이 추가되는 문제를 던진 후 \u003cb class=\"key\">호흡용 \u003c/b>\u003cb class=\"key\">혼합물\u003c/b> 공급이라는 해결책을 제시한다. 수압이 깊이에 비례해 증가한다는 근거를 바탕으로 마지막 문장에서 십 미터 깊이 사례의 \u003cb class=\"key\">이 \u003c/b>\u003cb class=\"key\">기압\u003c/b> 공급 필요성으로 결론을 맺는다. 결론이 마지막에 오는 \u003cb class=\"key\">미괄식\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (2)\u003c/b>\u003cspan>전환·대조\u003c/span>\u003cb>During dives (3)\u003c/b>\u003cspan>화제 전환\u003c/span>\u003cb>To achieve this (5)\u003c/b>\u003cspan>해결 방법 제시\u003c/span>\u003cb>It follows that (8)\u003c/b>\u003cspan>결론·추론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">air pressure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pressure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">atmospheric pressure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pressure of the surrounding environment\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pressure applied by surrounding water\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">water pressure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pressure of 2 bar\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>External pressure\u003c/th>\u003cth>Internal pressure\u003c/th>\u003c/tr>\u003ctr>\u003ctd>대기압과 수압이 몸을 누르는 압력\u003c/td>\u003ctd>폐와 공기 공간의 압력이 균형을 이룸\u003c/td>\u003c/tr>\u003ctr>\u003ctd>물속에서 수압까지 더해짐\u003c/td>\u003ctd>호흡 기체 공급으로 맞춰짐\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결의 흐름으로 전개되고, 결론이 마지막에 오는 미괄식 구조예요. 처음에 지표면 압력 균형을 배경으로 제시하고, 물속에서 수압 때문에 압력을 느낄 수 있다는 문제를 던진 다음, 외부와 내부 압력을 같게 하기 위해 호흡용 혼합물을 공급한다는 해결책을 제시해요. 마지막 문장에서 십 미터 깊이의 사례로 수압이 이 바일 때 이 기압이 필요하다는 결론을 구체적으로 정리하죠.","hl":"ty"},{"n":9,"text":"신호어를 보면 두 번째 문장의 However는 앞의 상식과 대비되는 전환을 알려 주고, 세 번째 문장의 During dives는 잠수 상황으로 화제를 옮겨요. 다섯 번째 문장의 To achieve this는 문제 해결을 위한 구체적 방법을 소개하고, 여덟 번째 문장의 It follows that은 앞서 나온 수압 증가 원리에 따른 결론을 이끌어요. 재진술로는 air pressure, atmospheric pressure, water pressure, pressure of the surrounding environment 같은 표현이 모두 압력을 가리키면서 서로 연결돼요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>human body\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인체\u003c/span>\u003c/div>\u003cdiv>\u003cb>Earth's surface\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지구 표면\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>겪다\u003c/span>\u003c/div>\u003cdiv>\u003cb>constant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>air pressure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기압\u003c/span>\u003c/div>\u003cdiv>\u003cb>balance\u003c/b>\u003cem>동사\u003c/em>\u003cspan>균형을 이루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>external pressure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>외부 압력\u003c/span>\u003c/div>\u003cdiv>\u003cb>internal pressure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>내부 압력\u003c/span>\u003c/div>\u003cdiv>\u003cb>lung\u003c/b>\u003cem>명사\u003c/em>\u003cspan>폐\u003c/span>\u003c/div>\u003cdiv>\u003cb>air cavity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공기가 들어 있는 공간\u003c/span>\u003c/div>\u003cdiv>\u003cb>in addition to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 더하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>atmospheric pressure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대기압\u003c/span>\u003c/div>\u003cdiv>\u003cb>water pressure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수압\u003c/span>\u003c/div>\u003cdiv>\u003cb>act on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 작용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>submerged\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>물속에 잠긴\u003c/span>\u003c/div>\u003cdiv>\u003cb>underwater\u003c/b>\u003cem>부사\u003c/em>\u003cspan>물속에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>maintain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>breathing mixture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>호흡용 혼합물\u003c/span>\u003c/div>\u003cdiv>\u003cb>supply\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공급하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>increase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>증가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>proportionally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>비례하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>depth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>깊이\u003c/span>\u003c/div>\u003cdiv>\u003cb>bar\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바(압력 단위)\u003c/span>\u003c/div>\u003cdiv>\u003cb>diver\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잠수부\u003c/span>\u003c/div>\u003cdiv>\u003cb>stabilize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>안정시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>atmosphere\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기압(단위)\u003c/span>\u003c/div>\u003cdiv>\u003cb>It follows that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~라는 결론이 나온다\u003c/span>\u003c/div>\u003cdiv>\u003cb>require\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요구하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번 지문에서 중요한 단어를 몇 개 짚어 볼게요. atmospheric pressure는 대기압, water pressure는 수압, breathing mixture는 호흡용 혼합물이라는 뜻이에요. external pressure는 외부 압력, internal pressure는 내부 압력이죠. increase proportionally는 비례하여 증가하다라는 뜻으로 함께 쓰이는 표현이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">pressure\u003c/b>\u003cspan class=\"m\">압력\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">force\u003c/span>\u003cspan class=\"s\">stress\u003c/span>\u003cspan class=\"s\">compression\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">vacuum\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">external\u003c/b>\u003cspan class=\"m\">외부의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">outer\u003c/span>\u003cspan class=\"s\">outside\u003c/span>\u003cspan class=\"s\">exterior\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">internal\u003c/span>\u003cspan class=\"a\">inner\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">internal\u003c/b>\u003cspan class=\"m\">내부의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inner\u003c/span>\u003cspan class=\"s\">inside\u003c/span>\u003cspan class=\"s\">interior\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">external\u003c/span>\u003cspan class=\"a\">outer\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">increase\u003c/b>\u003cspan class=\"m\">증가하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rise\u003c/span>\u003cspan class=\"s\">grow\u003c/span>\u003cspan class=\"s\">escalate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decrease\u003c/span>\u003cspan class=\"a\">diminish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">supply\u003c/b>\u003cspan class=\"m\">공급하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">provide\u003c/span>\u003cspan class=\"s\">furnish\u003c/span>\u003cspan class=\"s\">deliver\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">balance\u003c/b>\u003cspan class=\"m\">균형을 이루다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">equalize\u003c/span>\u003cspan class=\"s\">stabilize\u003c/span>\u003cspan class=\"s\">adjust\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unbalance\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">maintain\u003c/b>\u003cspan class=\"m\">유지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"s\">sustain\u003c/span>\u003cspan class=\"s\">keep\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abandon\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 둘게요. pressure는 force나 stress와 유사하고 반대 개념으로 vacuum을 떠올릴 수 있어요. external은 outer나 outside와 뜻이 가깝고 internal과 반대되죠. internal은 inner나 inside와 유사하고 external과 반대예요. increase는 rise나 grow와 비슷하고 decrease와 반대이며, supply는 provide나 deliver와 가깝고 withhold와 반대예요. balance는 equalize나 stabilize와 유사하고 unbalance와 반대이고, maintain은 keep이나 sustain과 비슷하고 abandon과 반대랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구 표면 위에서의 인체는 일정한 기압을 겪는다 1제곱미터당 16에서 18톤에 달하는 그 신체 표면의.\u003c/span>\u003cspan class=\"en\">The human body \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Earth's \u003c/span>\u003cspan class=\"tgt\">surface\u003c/span> experiences constant air pressure equal to 16­18 tons per square meter of its body surface.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지구 표면 위에서의 인체는 신체 표면 1제곱 미터당 16에서 18톤에 달하는 일정한 기압을 겪는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지구 표면에서 인체가 받는 기압이 매우 크다는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">수치\u003c/b>를 제시합니다. 1제곱미터당 16에서 18톤이라는 \u003cb class=\"key\">막대한 \u003c/b>\u003cb class=\"key\">압력\u003c/b>을 언급하여, 다음 문장에서 이 압력을 왜 느끼지 못하는지 설명하기 위한 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 제공합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : The human body [on the Earth's surface] : \"지구 표면 위에서의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">형용사구의 후치수식\u003c/span> : air pressure [(which is) equal to 16-18 tons per square meter of its body surface] : \"1제곱미터당 16에서 18톤과 같은\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The human body on the Earth's surface, 지구 표면 위에서의 인체는. experiences constant air pressure, 일정한 기압을 겪는다. equal to 16-18 tons per square meter, 1제곱미터당 16에서 18톤에 달하는. of its body surface, 그 신체 표면의.. 이 문장 전체를 해석하면, 지구 표면 위에서의 인체는 신체 표면 1제곱 미터당 16에서 18톤에 달하는 일정한 기압을 겪는다.","hl":"m"},{"n":13,"text":"이 문장은 지구 표면에서 인체가 받는 기압이 매우 크다는 구체적 수치를 제시합니다. 제곱미터당 십육에서 십팔 톤이라는 막대한 압력을 언급하여, 다음 문장에서 이 압력을 왜 느끼지 못하는지 설명하기 위한 배경 정보를 제공합니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 on the Earth's surface입니다. 전치사구가 앞에 있는 The human body를 뒤에서 수식하는 형용사적 용법이에요. 두 번째 어법 포인트는 equal to 이하입니다. equal to는 형용사구로 앞의 air pressure를 뒤에서 수식하는 후치수식이에요. 원래는 which is equal to가 생략된 형태로 이해하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 이러한 압력은 느껴지지 않는다\u003c/span>\u003cspan class=\"en\">However, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">pressure \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">felt\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">외부 압력이 균형이 맞춰지기 때문에\u003c/span>\u003cspan class=\"en\">because \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">external \u003c/span>\u003cspan class=\"tgt\">pressure \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">balanced \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내부의 압력과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">internal \u003c/span>\u003cspan class=\"tgt\">pressure\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">폐와 공기가 들어 있는 공간의\u003c/span>\u003cspan class=\"en\">in the lungs and air cavities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신체의.\u003c/span>\u003cspan class=\"en\">of the body.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 이러한 압력은 외부 압력이 신체의 폐와 공기가 들어 있는 공간의 내부의 압력과 균형이 맞춰지기 때문에 느껴지지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 압력을 느끼지 못하는 이유를 \u003cb class=\"key\">압력 \u003c/b>\u003cb class=\"key\">균형\u003c/b>으로 설명합니다. 외부 압력과 체내 폐와 공기 공간의 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">압력\u003c/b>이 서로 상쇄되기 때문에 인체는 압력을 느끼지 못한다는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">원리\u003c/b>를 제시합니다. 이는 뒤에 나올 잠수 상황의 압력 평형 개념과 연결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (부정문)\u003c/span> : be동사 + not + 과거분사 (p.p.) : \"이 압력은 느껴지지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk \u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 인체에 영향을 준다.\u003c/span>\u003cspan class=\"en\">also acts on the human body.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">잠수하는 동안에는 대기압 외에 물의 압력 또한 인체에 영향을 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 잠수 중에는 \u003cb class=\"key\">대기압\u003c/b>뿐만 아니라 \u003cb class=\"key\">수압\u003c/b>도 인체에 작용한다는 사실을 도입합니다. 앞 문장의 지상에서의 압력과 달리, 물속에서는 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">압력\u003c/b>이 존재함을 알려주며, 뒤에서 수압의 구체적 계산으로 이어지는 전환점 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시간)\u003c/span> : During + 명사 : \"잠수하는 동안에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(첨가)\u003c/span> : in addition to + 명사 : \"대기압 외에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">of 전치사구의 형용사적 용법\u003c/span> : the + 명사 + of + 명사 : \"물의 압력\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"During dives, 잠수하는 동안에는. in addition to atmospheric pressure, 대기압 외에. the pressure of the water, 물의 압력. also acts on the human body, 또한 인체에 영향을 준다.. 이 문장 전체를 해석하면, 잠수하는 동안에는 대기압 외에 물의 압력 또한 인체에 영향을 준다.","hl":"m"},{"n":19,"text":"이 문장은 잠수 중에는 대기압뿐만 아니라 수압도 인체에 작용한다는 사실을 도입합니다. 앞 문장의 지상에서의 압력과 달리, 물속에서는 추가 압력이 존재함을 알려주며, 뒤에서 수압의 구체적 계산으로 이어지는 전환점 역할을 합니다.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 During dives입니다. 시간을 나타내는 전치사구가 문장 앞에서 부사적 용법으로 쓰였어요. 두 번째는 in addition to atmospheric pressure입니다. in addition to는 외에라는 뜻의 관용 전치사구로, 첨가의 의미를 나타내요. 세 번째는 the pressure of the water입니다. of가 앞의 pressure를 뒤에서 수식하는 형용사적 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물속에 잠겼을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">submerged \u003c/span>\u003cspan class=\"tgt\">underwater\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주변 환경의 압력을 느끼는 것을 피하기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">avoid \u003c/span>\u003cspan class=\"tgt\">feeling \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">pressure \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">surrounding \u003c/span>\u003cspan class=\"tgt\">environment\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동일한 외부와 내부 압력 상태를 유지하는 것이 필요하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">necessary \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">maintain \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">condition \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">equal \u003c/span>\u003cspan class=\"tgt\">external \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">internal \u003c/span>\u003cspan class=\"tgt\">pressure\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">물속에 잠겼을 때, 주변 환경의 압력을 느끼는 것을 피하기 위해 동일한 외부와 내부 압력 상태를 유지하는 것이 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 물속에서 주변 환경의 압력을 느끼지 않으려면 몸 안팎의 압력이 \u003cb class=\"key\">동일한 \u003c/b>\u003cb class=\"key\">외부와 \u003c/b>\u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">압력\u003c/b> 상태여야 한다는 조건을 말해요. 앞 문장에서 수압이 인체에 가해진다고 했으니, 이를 해결하기 위한 핵심 원리로 \u003cb class=\"key\">압력 \u003c/b>\u003cb class=\"key\">평형\u003c/b>을 제시하는 역할이에요. it is necessary to maintain 구문은 가주어 진주어로, 유지하는 것이 필요하다는 의무를 부드럽게 표현해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 축약 (분사구문)\u003c/span> : When [(the diver) is] submerged underwater : \"물속에 잠겼을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적) + 동명사\u003c/span> : to avoid [타동사] + feeling [동명사구/목적어] : \"주변 환경의 압력을 느끼는 것을 피하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가주어 it-진주어 to부정사\u003c/span> : It is necessary [to maintain ...] (진주어) : \"동일한 외부와 내부 압력 상태를 유지하는 것이 필요하다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"When submerged underwater, 물속에 잠겼을 때. to avoid feeling the pressure of the surrounding environment, 주변 환경의 압력을 느끼는 것을 피하기 위해. it is necessary to maintain the condition of equal external and internal pressure, 동일한 외부와 내부 압력 상태를 유지하는 것이 필요하다. 이 문장 전체를 해석하면, 물속에 잠겼을 때, 주변 환경의 압력을 느끼는 것을 피하기 위해 동일한 외부와 내부 압력 상태를 유지하는 것이 필요하다.","hl":"m"},{"n":22,"text":"이 문장은 물속에서는 주변 환경의 압력을 느끼지 않으려면 외부 압력과 내부 압력이 같아야 한다는 조건을 말해요. 앞 문장에서 수압이 몸에 작용한다고 했는데, 그 문제를 해결하는 핵심 원리가 바로 압력 평형이에요. 그래서 동일한 외부와 내부 압력 상태를 유지하는 것이 필요하다는 말이에요.","hl":"mn"},{"n":23,"text":"첫 번째 어법은 When submerged underwater예요. 시간을 나타내는 부사절에서 주어와 be동사가 생략된 분사구문 형태로, 원래는 When the diver is submerged underwater 정도가 생략된 거예요. 두 번째는 to avoid feeling the pressure of the surrounding environment에서 to부정사가 목적을 나타내는 부사적 용법으로 쓰였어요. 그리고 avoid는 동명사를 목적어로 취하니까 feeling이 오는 거예요. 세 번째는 it is necessary to maintain the condition of equal external and internal pressure 구문인데, 가주어 it이 먼저 나오고 진짜 주어인 to maintain 이하가 뒤에 오는 전형적인 가주어 진주어 구문이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이를 달성하기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">achieve \u003c/span>\u003cspan class=\"tgt\">this\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공기 또는 호흡용 혼합물이\u003c/span>\u003cspan class=\"en\">air or a breathing mixture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠수부에게 제공된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">supplied\u003c/span> to the diver\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주변의 물에 의해 가해지는 압력과 동일한 압력으로\u003c/span>\u003cspan class=\"en\">under pressure equal to the pressure \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">applied \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">surrounding \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이를 달성하기 위해 공기 또는 호흡용 혼합물이 주변의 물에 의해 가해지는 압력과 동일한 압력으로 잠수부에게 제공된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 \u003cb class=\"key\">압력 \u003c/b>\u003cb class=\"key\">평형\u003c/b> 조건을 달성하기 위한 구체적인 방법을 제시해요. 공기나 호흡용 혼합물을 주변의 물이 가해지는 압력과 \u003cb class=\"key\">동일한 \u003c/b>\u003cb class=\"key\">압력\u003c/b>으로 잠수부에게 공급해야 한다는 말이에요. 이렇게 해야 외부와 내부 압력이 같아져서 다이버가 수압을 느끼지 않게 되죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : To achieve this (목적) : \"이를 달성하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be supplied to + 대상 : \"제공된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 후치수식\u003c/span> : the pressure applied by the surrounding water : \"주변의 물에 의해 가해지는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"To achieve this, 이를 달성하기 위해. air or a breathing mixture, 공기 또는 호흡용 혼합물이. is supplied to the diver, 잠수부에게 제공된다. under pressure equal to the pressure applied by the surrounding water, 주변의 물에 의해 가해지는 압력과 동일한 압력으로. 이 문장 전체를 해석하면, 이를 달성하기 위해 공기 또는 호흡용 혼합물이 주변의 물에 의해 가해지는 압력과 동일한 압력으로 잠수부에게 제공된다.","hl":"m"},{"n":25,"text":"이 문장은 바로 앞 문장의 압력 평형을 달성하기 위한 구체적인 방법을 제시해요. 잠수부에게 공기나 호흡용 혼합물을 공급하는데, 그 압력이 주변 물이 가하는 압력과 같아야 한다는 말이에요. 이렇게 해야 외부 압력과 내부 압력이 같아져서 몸이 압력을 느끼지 않게 되는 거죠.","hl":"mn"},{"n":26,"text":"첫 번째 어법은 To achieve this로, to부정사가 목적을 나타내는 부사적 용법이에요. 두 번째는 수동태 구문으로, air or a breathing mixture is supplied는 공기나 혼합물이 제공된다는 의미라서 수동태를 썼어요. 세 번째는 applied by the surrounding water에서 applied가 앞에 있는 the pressure를 뒤에서 수식하는 과거분사예요. 압력이 물에 의해 가해지는 수동의 관계라서 과거분사가 쓰인 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수압은 증가한다\u003c/span>\u003cspan class=\"en\">Water pressure increases\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깊이에 비례하여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">proportionally \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">depth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수압은 깊이에 비례하여 증가한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 수압이 깊이에 따라 \u003cb class=\"key\">비례\u003c/b>하여 증가한다는 기본 원리를 나타내요. 뒤 문장에서 십 미터마다 일 바씩 증가한다는 구체적 수치가 나오는데, 그 근거가 되는 문장이에요. proportionally는 비례하여라는 뜻으로, 깊이가 깊어질수록 수압도 일정한 비율로 커진다는 의미예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사 역할을 하는 전치사구\u003c/span> : increase proportionally with depth : \"깊이에 비례하여\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Water pressure increases, 수압은 증가한다. proportionally with depth, 깊이에 비례하여. 이 문장 전체를 해석하면, 수압은 깊이에 비례하여 증가한다.","hl":"m"},{"n":28,"text":"이 문장은 수압이 깊이에 비례해서 증가한다는 기본 원리를 말하고 있어요. 뒤 문장에서 구체적으로 십 미터마다 일 바씩 증가한다는 사례가 나오는데, 이 문장이 그 근거가 되는 원리예요. 여기서 proportionally는 비례하여라는 뜻으로, 깊이가 깊어질수록 수압도 일정하게 커진다는 말이에요.","hl":"mn"},{"n":29,"text":"이 문장에서는 proportionally with depth가 부사구 역할을 해서 increases를 수식해요. with depth는 깊이에 따라라는 의미를 가진 전치사구예요. 그래서 수압이 어떻게 증가하는지를 proportionally라는 부사로 설명하고, with depth라는 전치사구로 그 비례 관계를 보태 주는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 증가한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> increases\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1바만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">1 \u003c/span>\u003cspan class=\"tgt\">bar\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매 10미터마다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">10 \u003c/span>\u003cspan class=\"tgt\">meters\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 10미터마다 1바씩 증가한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 수압 증가를 구체적인 수치로 제시한다. \u003cb class=\"key\">수압\u003c/b>은 10미터 깊어질 때마다 \u003cb class=\"key\">1바\u003c/b>씩 증가한다는 단위당 증가량을 나타내며, 뒤 문장에서 10미터 잠수부의 압력을 계산하는 근거가 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 It의 지시\u003c/span> : It [대명사] + increases [동사] : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by의 용법 (증가량)\u003c/span> : by [전치사] + 1 bar [명사구] : \"1바만큼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 for의 용법 (단위당 조건)\u003c/span> : for [전치사] + every 10 meters [명사구] : \"매 10미터마다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"It increases, 그것은 증가한다. by 1 bar, 1바만큼. for every 10 meters, 매 10미터마다. 이 문장 전체를 해석하면, 그것은 10미터마다 1바씩 증가한다.","hl":"m"},{"n":31,"text":"이 문장은 수압이 깊이에 따라 일정하게 증가한다는 사실을 구체적인 수치로 보여 줘요. ten meters 깊어질 때마다 one bar씩 증가한다는 뜻이고, 이게 바로 다음 문장에서 ten meters 지점의 압력을 계산하는 근거가 돼요. 단위당 증가량을 나타내는 by의 쓰임도 함께 기억해 두세요.","hl":"mn"},{"n":32,"text":"어법 포인트는 대명사 It과 전치사 by, for의 쓰임이에요. It은 앞에 나온 water pressure를 가리키고, by는 증가량을, for every ten meters는 매 ten meters마다라는 단위당 조건을 나타내요. 여기서 by는 차이나 증가분을 말할 때 쓰는 전치사이니 숙지하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이로부터 이런 결론이 따라온다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">follows \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">10미터 깊이의 잠수부는\u003c/span>\u003cspan class=\"en\">a diver at a depth of 10 meters\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2바의 압력을 겪고,\u003c/span>\u003cspan class=\"en\">experiences a pressure of 2 bar,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 압력을 맞추기 위해서는,\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stabilize \u003c/span>\u003cspan class=\"tgt\">pressure\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호흡용 혼합물의 제공이\u003c/span>\u003cspan class=\"en\">the supply of a breathing mixture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2기압의 압력 아래에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">pressure \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">2 \u003c/span>\u003cspan class=\"tgt\">atmospheres\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요구된다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">required\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당연히 10미터 깊이에 있는 잠수부는 2바의 압력을 겪고, 압력을 맞추기 위해서는 2기압의 호흡용 혼합물의 제공이 요구된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 수치를 실제 잠수부 상황에 적용하여, 10미터 깊이에서는 대기압 \u003cb class=\"key\">1바\u003c/b>에 수압 1바가 더해져 총 \u003cb class=\"key\">2바\u003c/b>가 된다고 정리한다. 압력을 안정시키려면 외부 압력과 내부 압력을 같게 하도록 \u003cb class=\"key\">2기압\u003c/b>의 호흡용 혼합물을 공급해야 한다는 결론을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it과 진주어 that절\u003c/span> : It follows that + [주어 + 동사 ~] : \"~라는 결론이 뒤따른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to stabilize [타동사] + pressure [목적어] : \"압력을 맞추기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : under [전치사] + a pressure of 2 atmospheres [명사구] : \"2기압의 압력 아래에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be required [be + p.p.] : \"요구된다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It follows that, 이로부터 이런 결론이 따라온다. a diver at a depth of 10 meters, 10미터 깊이의 잠수부는. experiences a pressure of 2 bar, 2바의 압력을 겪고. and to stabilize pressure, 그리고 압력을 맞추기 위해서는. the supply of a breathing mixture, 호흡용 혼합물의 제공이. under a pressure of 2 atmospheres, 2기압의 압력 아래에서. is required, 요구된다.. 이 문장 전체를 해석하면, 당연히 10미터 깊이에 있는 잠수부는 2바의 압력을 겪고, 압력을 맞추기 위해서는 2기압의 호흡용 혼합물의 제공이 요구된다.","hl":"m"},{"n":34,"text":"이 문장은 앞에서 배운 수압 계산을 잠수부 상황에 적용한 결론이에요. ten meters 깊이에서는 대기압 one bar에 물의 압력 one bar를 더해 총 two bar가 되죠. 그래서 압력 균형을 맞추기 위해 two atmospheres의 호흡용 혼합물을 공급해야 한다는 논리적 귀결을 제시해요.","hl":"mn"},{"n":35,"text":"어법 포인트는 크게 네 가지예요. 첫 번째, It follows that 구문은 뒤에 나오는 that절이 진주어이고 It은 가주어로 쓰여, 그런 결론이 뒤따른다는 의미를 만들어요. 두 번째, to stabilize pressure는 to부정사가 목적을 나타내는 부사적 용법이에요. 세 번째, under a pressure of two atmospheres는 앞의 명사 a breathing mixture를 뒤에서 수식하는 전치사구의 형용사적 용법이죠. 네 번째, is required는 주어 the supply가 요구되는 대상이기 때문에 수동태로 표현됐어요. 이 네 가지를 순서대로 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>지구 표면 인체는 16~18톤의 \u003cb class=\"key\">대기압\u003c/b>을 받지만, \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">압력\u003c/b>과 균형을 이루어 느끼지 못한다.\u003c/li>\u003cli>잠수 중에는 대기압에 더해 \u003cb class=\"key\">수압\u003c/b>이 인체에 작용하므로 \u003cb class=\"key\">외부 \u003c/b>\u003cb class=\"key\">압력\u003c/b>과 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">압력\u003c/b>을 같게 유지해야 한다.\u003c/li>\u003cli>이를 위해 잠수부에게 주변 물의 압력과 같은 압력으로 \u003cb class=\"key\">호흡용 \u003c/b>\u003cb class=\"key\">혼합물\u003c/b>을 공급한다.\u003c/li>\u003cli>\u003cb class=\"key\">수압\u003c/b>은 깊이에 비례해 10미터마다 \u003cb class=\"key\">1바\u003c/b>씩 증가하며, 10미터 깊이에서는 \u003cb class=\"key\">2기압\u003c/b>의 공급이 요구된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>On land, external air pressure is balanced by internal body pressure, but underwater divers must receive breathing gas at the same pressure as the surrounding water, which increases by 1 bar every 10 meters.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">지구 표면에서 인체는 \u003cb class=\"key\">대기압\u003c/b>을 받지만 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">압력\u003c/b>과 균형을 이루어 느끼지 못한다. 잠수 시에는 \u003cb class=\"key\">수압\u003c/b>이 추가되어 외부 압력과 내부 압력을 같게 유지하기 위해 주변 수압과 같은 압력의 \u003cb class=\"key\">호흡용 \u003c/b>\u003cb class=\"key\">혼합물\u003c/b>을 공급해야 하며, 수압은 깊이에 비례해 10미터마다 1바씩 증가한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 지문의 핵심을 다시 정리할게요. 지구 표면에서는 외부 압력과 내부 압력이 균형을 이루어 압력을 느끼지 않지만, 잠수할 때는 수압이 추가되므로 외부 압력과 내부 압력을 같게 유지해야 해요. 그래서 잠수부에게는 주변 물의 압력과 같은 압력의 호흡용 혼합물을 공급해야 하고, 수압은 십 미터마다 일 바씩 증가해요. 십 미터 깊이에서는 이 바의 압력에 맞추어 이 기압의 호흡 기체를 공급해야 하죠. 오늘은 여기까지입니다. 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
