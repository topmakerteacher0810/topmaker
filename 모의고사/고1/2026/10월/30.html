<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 30번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 30번","audioDir":"30_audio","preview":false,"count":38,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">30번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>The Hidden Costs of Subsidies in Cutting Pollution\u003c/h1>\u003ch2>보조금의 숨은 비용과 기후 왜곡\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">보조금\u003c/b>, \u003cb class=\"key\">세금\u003c/b>, \u003cb class=\"key\">규제\u003c/b> 모두 석탄 전환을 통한 \u003cb class=\"key\">오염 \u003c/b>\u003cb class=\"key\">저감\u003c/b>으로 이어질 수 있지만, 전력 회사는 \u003cb class=\"key\">보조금\u003c/b>을 선호한다. 그러나 보조금은 일반 개인의 \u003cb class=\"key\">세금 \u003c/b>\u003cb class=\"key\">부담\u003c/b>으로 전력 회사의 \u003cb class=\"key\">기회 \u003c/b>\u003cb class=\"key\">집합\u003c/b>을 확대하고 \u003cb class=\"key\">효율성\u003c/b>을 왜곡해 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>를 악화시킬 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Subsidies may seem attractive, but they distort the economy and can worsen global warming by lowering electricity prices and raising consumption.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 보조금과 규제, 세금이 오염을 줄이는 발전소로 이어질 수 있다는 지문을 함께 보겠습니다. 이 글은 전력 회사가 보조금을 선호하지만, 보조금이 효율성을 왜곡하고 지구 온난화를 악화시킬 수 있다는 내용입니다. 요지는 보조금이 겉으로는 좋아 보여도 숨은 비용과 기후 역효과를 낳는다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">보조금 subsidy은 정부가 기업이나 개인에게 주는 재정 지원입니다. 반면 세금 tax은 정부가 거둬들이는 돈이고, 규제 regulation는 행동을 강제하는 규칙이죠. 전력 회사가 석탄 coal 대신 친환경 에너지로 전환할 때 이 세 가지 정책이 쓰일 수 있어요. 경제학에서는 어떤 선택의 \u003cb class=\"key\">기회 \u003c/b>\u003cb class=\"key\">집합\u003c/b> opportunity set이 늘어나면 다른 누군가의 기회는 줄어드는 기회비용 opportunity cost이 생깁니다. 예를 들어 한 친구에게 용돈을 줘서 책을 사게 하면, 그 돈은 결국 다른 친구에게 줄 용돈이나 세금에서 나오는 것과 비슷해요. 이 지문은 \u003cb class=\"key\">보조금\u003c/b>의 이런 숨은 대가를 짚고 있습니다.\u003c/div>","segs":[{"n":2,"text":"보조금 subsidy는 정부가 기업이나 개인에게 주는 재정 지원입니다. 반면 세금 tax는 정부가 거둬들이는 돈이고, 규제 regulation은 행동을 강제하는 규칙이죠. 전력 회사가 석탄 coal 대신 친환경 에너지로 전환할 때 이 세 가지 정책이 쓰일 수 있어요. 경제학에서는 어떤 선택의 기회 집합 opportunity set이 늘어나면 다른 누군가의 기회는 줄어드는 기회비용 opportunity cost가 생깁니다. 예를 들어 한 친구에게 용돈을 줘서 책을 사게 하면, 그 돈은 결국 다른 친구에게 줄 용돈이나 세금에서 나오는 것과 비슷해요. 이 지문은 보조금의 이런 숨은 대가를 짚고 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>전환 수단과 기업 선호\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">보조금\u003c/b>, \u003cb class=\"key\">세금\u003c/b>, \u003cb class=\"key\">규제\u003c/b>는 모두 석탄에서 전환해 오염을 줄이는 발전소로 이어질 수 있다. 전력 회사는 관련 \u003cb class=\"key\">비용\u003c/b>을 고려해도 \u003cb class=\"key\">이익\u003c/b>이 높을 수 있지만, 특히 규제나 세금보다 \u003cb class=\"key\">보조금\u003c/b>을 선호한다. 이유는 \u003cb class=\"key\">정부\u003c/b>로부터 돈을 받는 쪽이 비용을 직접 부담하는 것보다 낫기 때문이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>보조금의 숨은 대가\u003csmall>전환 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>전력 회사가 보조금을 선호하는 이유는 분명하다. 그러나 보조금으로 인한 \u003cb class=\"key\">기회 \u003c/b>\u003cb class=\"key\">집합\u003c/b>의 확대는 다른 사람들의 기회 집합 \u003cb class=\"key\">축소\u003c/b>와 맞물린다. 전력 회사의 \u003cb class=\"key\">자유\u003c/b>는 \u003cb class=\"key\">일반 \u003c/b>\u003cb class=\"key\">개인\u003c/b>의 희생 위에서 증가하며, 이들은 보조금 재원을 위한 \u003cb class=\"key\">세금\u003c/b> 부담으로 고통받는다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>효율성 왜곡과 기후 악화\u003csmall>근거 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>효율성 관점에서 \u003cb class=\"key\">보조금\u003c/b>은 전력 회사가 전체 \u003cb class=\"key\">비용\u003c/b>을 직면하지 않게 하므로 \u003cb class=\"key\">경제\u003c/b>를 왜곡한다. 배출량을 제한하더라도 \u003cb class=\"key\">전기 \u003c/b>\u003cb class=\"key\">가격\u003c/b>이 낮아지고 소비가 늘어날 수 있다. 그 결과 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>가 오히려 악화된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 세 단계로 정리해 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 정책 수단과 기업의 선호입니다. 보조금 subsidy, 세금 tax, 규제 regulation은 모두 석탄에서 벗어나 오염을 덜 일으키는 발전소로 이어질 수 있어요. 전력 회사는 관련 비용을 고려해도 전환으로 이익이 더 높을 수 있는데, 그중에서도 규제나 세금보다 보조금을 특히 선호하죠. 이유는 명백합니다. 비용을 직접 내기보다 정부로부터 돈을 받는 쪽이 낫기 때문이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 보조금의 숨은 대가입니다. 하지만 보조금을 통한 기회 집합 opportunity set의 확대는 다른 사람들의 기회 집합 축소와 맞물려요. 전력 회사의 자유는 일반 개인의 희생 위에서 늘어나고, 그 개인은 보조금 재원을 마련하기 위한 세금 때문에 고통을 받게 되죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 효율성 왜곡과 기후 악화입니다. 효율성 관점에서 보조금은 전력 회사가 자기 행동의 전체 비용을 직면하지 않게 하여 경제를 왜곡해요. 배출량을 제한하더라도 전기 가격이 낮아지고 소비가 늘어나서 지구 온난화가 더 심해질 수 있습니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 전력 회사가 보조금을 선호한다는 \u003cb class=\"key\">통념\u003c/b>을 먼저 제시한 뒤, \u003cb class=\"key\">기회 \u003c/b>\u003cb class=\"key\">집합\u003c/b>의 전가와 \u003cb class=\"key\">효율성\u003c/b> 왜곡을 들어 반박하는 구조이다. 첫 문장에서 세 가지 정책 수단을 소개하고 이어서 기업이 \u003cb class=\"key\">보조금\u003c/b>을 선호한다는 흐름을 드러낸다. 그러나 여섯 번째 문장의 But을 기점으로 \u003cb class=\"key\">보조금\u003c/b>의 숨은 비용을 지적하고, 아홉 번째 문장에서 기후 악화라는 결과로 마무리하므로 \u003cb class=\"key\">미괄식\u003c/b>에 가깝다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In all cases (2)\u003c/b>\u003cspan>일반화\u003c/span>\u003cb>The reason is obvious (4)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>But (6)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>Moreover (8)\u003c/b>\u003cspan>추가 근거\u003c/span>\u003cb>Indeed (9)\u003c/b>\u003cspan>구체화·강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">power plants\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">electricity companies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the electricity company\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Subsidies (보조금)\u003c/th>\u003cth>Regulations/Taxes (규제·세금)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>정부로부터 돈 수령\u003c/td>\u003ctd>비용 직접 부담\u003c/td>\u003c/tr>\u003ctr>\u003ctd>전체 비용 미직면\u003c/td>\u003ctd>비용 내부화\u003c/td>\u003c/tr>\u003ctr>\u003ctd>전기 소비 증가·기후 악화\u003c/td>\u003ctd>오염 저감 유도\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 통념을 먼저 제시하고 이를 반박하는 통념 반박 구조입니다. 첫 부분은 전력 회사가 보조금을 선호한다는 흐름을 소개하고, 여섯 번째 문장의 But부터 반박이 시작되죠. 결론은 여덟 번째 문장의 효율성 왜곡 지적과 아홉 번째 문장의 기후 악화 결과로 마무리됩니다. 그래서 주제문은 여덟 번째 문장으로 보고 전체 흐름은 미괄식에 가깝다고 볼 수 있어요.","hl":"ty"},{"n":8,"text":"신호어를 보면 두 번째 문장의 In all cases는 모든 경우로 일반화하고, 네 번째 문장의 The reason is obvious는 이유를 끌어냅니다. 여섯 번째 문장의 But은 논지를 전환하고, 여덟 번째 문장의 Moreover는 추가 근거를 더해요. 아홉 번째 문장의 Indeed는 앞 내용을 구체화하며 강조합니다. 같은 대상을 power plants에서 electricity companies로 바꿔 말한 것도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>subsidy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보조금\u003c/span>\u003c/div>\u003cdiv>\u003cb>tax\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세금\u003c/span>\u003c/div>\u003cdiv>\u003cb>regulation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>규제\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>power plant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발전소\u003c/span>\u003c/div>\u003cdiv>\u003cb>pollute\u003c/b>\u003cem>동사\u003c/em>\u003cspan>오염시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>switch away from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 전환하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>coal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>석탄\u003c/span>\u003c/div>\u003cdiv>\u003cb>profit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이익\u003c/span>\u003c/div>\u003cdiv>\u003cb>transition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전환\u003c/span>\u003c/div>\u003cdiv>\u003cb>take into account\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>고려하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>prefer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>receive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>government\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정부\u003c/span>\u003c/div>\u003cdiv>\u003cb>rather than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다는\u003c/span>\u003c/div>\u003cdiv>\u003cb>pay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지불하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>expansion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>확대\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity set\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회 집합\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the expense of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 희생하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>ordinary individual\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일반 개인\u003c/span>\u003c/div>\u003cdiv>\u003cb>taxation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과세, 세금\u003c/span>\u003c/div>\u003cdiv>\u003cb>efficiency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>효율성\u003c/span>\u003c/div>\u003cdiv>\u003cb>distort\u003c/b>\u003cem>동사\u003c/em>\u003cspan>왜곡하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>face\u003c/b>\u003cem>동사\u003c/em>\u003cspan>직면하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>emission\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배출(량)\u003c/span>\u003c/div>\u003cdiv>\u003cb>electricity price\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전기 가격\u003c/span>\u003c/div>\u003cdiv>\u003cb>consumption\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소비\u003c/span>\u003c/div>\u003cdiv>\u003cb>worsen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>악화시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>global warming\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지구 온난화\u003c/span>\u003c/div>\u003cdiv>\u003cb>reduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감소시키다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"핵심 단어를 몇 개만 짚어 볼게요. subsidy는 보조금, regulation은 규제, tax는 세금입니다. lead to는 ~로 이어지다라는 숙어이고, switch away from은 ~에서 전환하다예요. at the expense of는 ~을 희생하여라는 뜻으로 이 지문의 핵심 논리를 담고 있죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">subsidy\u003c/b>\u003cspan class=\"m\">보조금\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">grant\u003c/span>\u003cspan class=\"s\">financial aid\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tax\u003c/span>\u003cspan class=\"a\">penalty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">prefer\u003c/b>\u003cspan class=\"m\">선호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">favor\u003c/span>\u003cspan class=\"s\">choose\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003cspan class=\"a\">avoid\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distort\u003c/b>\u003cspan class=\"m\">왜곡하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">twist\u003c/span>\u003cspan class=\"s\">misrepresent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clarify\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">efficiency\u003c/b>\u003cspan class=\"m\">효율성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">effectiveness\u003c/span>\u003cspan class=\"s\">productivity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inefficiency\u003c/span>\u003cspan class=\"a\">waste\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">worsen\u003c/b>\u003cspan class=\"m\">악화시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">aggravate\u003c/span>\u003cspan class=\"s\">deteriorate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">improve\u003c/span>\u003cspan class=\"a\">alleviate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reduce\u003c/b>\u003cspan class=\"m\">감소시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">raise\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"시험에 자주 나오는 어휘 관계도 정리할게요. subsidy는 보조금으로 grant나 financial aid와 비슷하고, 반대말은 tax나 penalty예요. prefer는 선호하다로 favor나 choose와 통하고, reject나 avoid와 반대입니다. distort는 왜곡하다로 twist나 misrepresent와 유사하고, clarify와 반대죠. efficiency는 효율성으로 effectiveness나 productivity와 비슷하고, 반대는 inefficiency나 waste예요. worsen은 악화시키다로 aggravate나 deteriorate와 통하고, improve나 alleviate와 반대입니다. reduce는 감소시키다로 decrease나 lessen과 비슷하고, increase나 raise와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보조금, 세금, 그리고 규제는\u003c/span>\u003cspan class=\"en\">Subsidies, taxes, and regulations\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두 ~로 이어질 수 있다\u003c/span>\u003cspan class=\"en\">can all lead to\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발전소로\u003c/span>\u003cspan class=\"en\">power plants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오염을 덜 일으키는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">pollute \u003c/span>\u003cspan class=\"tgt\">less\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">석탄에서 전환함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">switching \u003c/span>\u003cspan class=\"tgt\">away \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">coal\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">보조금, 세금, 그리고 규제는 모두 석탄에서 (다른 에너지원으로) 전환함으로써 오염을 덜 일으키는 발전소로 이어질 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 보조금, 세금, 규제라는 세 가지 정책이 모두 발전소의 \u003cb class=\"key\">전환\u003c/b>을 이끌어 \u003cb class=\"key\">오염\u003c/b>을 줄이는 결과를 만들 수 있다는 뜻이에요. 이 문장은 글 전체의 도입에서 가능한 정책 수단을 나열하며, that 이하가 power plants의 구체적 특징을 서술해요. by switching away from coal은 석탄에서 벗어나는 \u003cb class=\"key\">수단\u003c/b>을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 + that + 동사 : \"오염을 덜 일으키는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사\u003c/span> : by + [switching (동명사구)] : \"석탄에서 전환함으로써\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Subsidies, taxes, and regulations, 보조금, 세금, 그리고 규제는. can all lead to, 모두 ~로 이어질 수 있다. power plants, 발전소로. that pollute less, 오염을 덜 일으키는. by switching away from coal, 석탄에서 전환함으로써. 이 문장 전체를 해석하면, 보조금, 세금, 그리고 규제는 모두 석탄에서 (다른 에너지원으로) 전환함으로써 오염을 덜 일으키는 발전소로 이어질 수 있다.","hl":"m"},{"n":12,"text":"이 문장은 보조금, 세금, 규제 모두 발전소가 석탄에서 다른 에너지원으로 전환하도록 해서 오염을 줄이는 결과로 이어질 수 있다는 뜻이에요. 즉 세 가지 정책 수단이 전환과 오염 감소라는 같은 방향의 결과를 만들 수 있다는 이야기예요. that 이하는 power plants를 꾸며 주는 관계절입니다.","hl":"mn"},{"n":13,"text":"첫 번째 포인트는 that pollute less예요. 여기서 that은 power plants를 꾸미는 주격 관계대명사예요. that 뒤에 동사 pollute가 바로 나와서 주어 역할을 하는 주격 관계대명사라는 걸 알 수 있죠. 그래서 오염을 덜 일으키는 발전소로 해석됩니다. 두 번째 포인트는 by switching away from coal인데요. by는 수단을 나타내는 전치사라서 뒤에 동명사 switching이 온 거예요. 석탄에서 전환함으로써라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 경우에\u003c/span>\u003cspan class=\"en\">In all cases,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이익은 더 높을 수 있다\u003c/span>\u003cspan class=\"en\">profits can be higher\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 전환을 하는 것으로부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">transition\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관련된 비용까지 고려하더라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">related \u003c/span>\u003cspan class=\"tgt\">costs \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">account\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 경우에, 관련된 비용까지 고려하더라도, 그러한 전환을 하는 것으로 부터 얻는 이익은 더 높을수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 어떤 방식을 쓰든 발전소가 \u003cb class=\"key\">전환\u003c/b>을 하면, 관련 비용을 고려해도 \u003cb class=\"key\">이익\u003c/b>이 더 높을 수 있다는 경제적 유인을 말해요. even taking...into account는 비용을 함께 따져도 손해가 아니라는 \u003cb class=\"key\">양보\u003c/b>의 뜻을 덧붙여요. 따라서 기업 입장에서 전환이 이득이 된다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 from + 동명사\u003c/span> : from + [making (동명사구)] : \"그러한 전환을 하는 것으로부터\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (양보)\u003c/span> : even + [taking (현재분사구)] : \"관련된 비용까지 고려하더라도\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"In all cases, 모든 경우에. profits can be higher, 이익은 더 높을 수 있다. from making the transition, 그러한 전환을 하는 것으로부터. even taking the related costs into account, 관련된 비용까지 고려하더라도. 이 문장 전체를 해석하면, 모든 경우에, 관련된 비용까지 고려하더라도, 그러한 전환을 하는 것으로 부터 얻는 이익은 더 높을수 있다.","hl":"m"},{"n":15,"text":"이 문장은 모든 경우에 전환을 하면 관련된 비용까지 고려하더라도 이익이 더 높을 수 있다는 뜻이에요. 기업이 손해를 보지 않고 오히려 이득을 볼 수 있다는 경제적 유인을 강조하는 문장이죠. even taking the related costs into account는 비용을 함께 따져도라는 양보의 의미를 더해 줍니다.","hl":"mn"},{"n":16,"text":"첫 번째 포인트는 from making the transition이에요. from은 출처나 유래를 나타내는 전치사라서 뒤에 동명사 making이 온 거예요. 그래서 그러한 전환을 하는 것으로부터라고 해석합니다. 두 번째 포인트는 even taking the related costs into account인데요. 주어 profits와 taking이 능동 관계이기 때문에 현재분사로 쓰였고, even이 더해져 관련된 비용까지 고려하더라도라는 양보의 분사구문이 됐어요. take something into account는 무언가를 고려하다라는 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발전소들은\u003c/span>\u003cspan class=\"en\">The power plants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보조금을 선호한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">prefer \u003c/span>\u003cspan class=\"tgt\">subsidies \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">규제나 세금보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">regulations \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">taxes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전소들은 규제나 세금보다 보조금을 선호한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 발전소는 세금이나 규제보다 \u003cb class=\"key\">보조금\u003c/b>을 더 선호한다는 뜻이에요. 자신이 직접 비용을 내기보다 정부로부터 돈을 받는 쪽을 택한다는 기업의 \u003cb class=\"key\">선호\u003c/b>를 분명히 밝힌 문장이죠. 이 선호가 뒤에서 기회 집합의 축소와 \u003cb class=\"key\">왜곡\u003c/b>으로 이어지는 논의의 출발점이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">prefer A over B 구문\u003c/span> : prefer + [subsidies] + over + [regulations or taxes] : \"규제나 세금보다 보조금을 선호한다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"The power plants, 발전소들은. prefer subsidies, 보조금을 선호한다. over regulations or taxes, 규제나 세금보다. 이 문장 전체를 해석하면, 전소들은 규제나 세금보다 보조금을 선호한다.","hl":"m"},{"n":18,"text":"이 문장은 발전소들이 규제나 세금보다 보조금을 선호한다는 뜻이에요. 직접 비용을 부담하기보다 정부로부터 돈을 받는 쪽을 더 좋아한다는 기업의 선호를 분명히 밝힌 문장이죠. 이 선호가 뒤에서 기회 집합의 축소와 왜곡을 설명하는 출발점이 됩니다.","hl":"mn"},{"n":19,"text":"여기서 핵심은 prefer subsidies over regulations or taxes예요. prefer는 무언가를 더 선호하다라는 동사이고, over는 비교 대상을 이끄는 전치사예요. prefer 보조금 over 규제나 세금이라고 하면 규제나 세금보다 보조금을 선호한다는 뜻이 돼요. 어법상 prefer A over B 형태로 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 이유는\u003c/span>\u003cspan class=\"en\">The reason\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명백하다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">obvious\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이유는 명백하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 발전소들이 규제나 세금보다 보조금을 선호한다고 했는데, 그 선호에는 분명한 이유가 있다고 하며 구체적인 이유를 이끄는 짧은 연결 문장이다. obvious는 굳이 설명하지 않아도 될 만큼 뻔하다는 뜻으로, 다음 문장의 \u003cb class=\"key\">이유\u003c/b>를 강조한다. 글 전체에서 논리를 매끄럽게 이어 주는 \u003cb class=\"key\">가교\u003c/b> 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장 (주어+be동사+주격보어)\u003c/span> : The reason (S) + is (V) + obvious (C) : \"명백하다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"The reason, 그 이유는. is obvious, 명백하다.. 이 문장 전체를 해석하면, 이유는 명백하다.","hl":"m"},{"n":21,"text":"앞 문장에서 발전소들이 세금이나 규제보다 보조금을 선호한다고 했잖아요. 여기서 그 선호에는 이유가 분명하다고 말하면서 다음 문장에서 그 이유를 구체적으로 설명해 주는 연결 문장이에요. obvious는 뻔하다는 뜻이라서, 이유가 너무 명백하다는 걸 강조해 주고요, 글의 흐름을 매끄럽게 이어 주는 가교 역할을 해요.","hl":"mn"},{"n":22,"text":"첫 번째 어법 포인트는 is obvious 부분이에요. 주어 The reason과 be동사 is, 그리고 형용사 obvious가 쓰인 전형적인 주격 보어 구문이죠. obvious는 주격 보어로 주어가 어떤 상태인지 설명해 주고, 해석은 명백하다가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 선호한다\u003c/span>\u003cspan class=\"en\">They prefer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈을 받는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">receive \u003c/span>\u003cspan class=\"tgt\">money\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정부로부터\u003c/span>\u003cspan class=\"en\">from the government\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비용을 지불하기보다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">pay \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">costs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신이.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">themselves\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 그 비용을 자신들이 직접 지불하기보다는 정부로부터 돈을 받는 것을 선호한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 발전소들이 보조금을 선호하는 이유를 직접 진술한 문장이다. 같은 전환을 하더라도 규제나 세금은 자기가 비용을 부담해야 하지만, 보조금은 정부가 돈을 주는 방식이어서 기업 입장에서는 이득이라는 것이다. rather than pay the costs themselves는 자신들이 직접 비용을 치르는 상황과 대비되며, \u003cb class=\"key\">정부 \u003c/b>\u003cb class=\"key\">지원\u003c/b>과 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">부담\u003c/b>의 차이를 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : prefer [타동사] + [to receive (to부정사구/목적어)] : \"돈을 받는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">prefer A rather than B (A와 B의 병렬)\u003c/span> : prefer + to receive money + rather than + pay the costs : \"비용을 지불하기보다는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">재귀대명사의 강조 용법\u003c/span> : pay the costs + themselves : \"그들 자신이\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"They prefer, 그들은 선호한다. to receive money, 돈을 받는 것을. from the government, 정부로부터. rather than pay the costs, 비용을 지불하기보다는. themselves, 그들 자신이.. 이 문장 전체를 해석하면, 그들은 그 비용을 자신들이 직접 지불하기보다는 정부로부터 돈을 받는 것을 선호한다.","hl":"m"},{"n":24,"text":"이 문장은 앞에서 말한 이유가 뭔지 직접 알려 줘요. 발전소들은 규제나 세금처럼 자기 돈이 나가는 방식보다, 정부에서 돈을 받는 보조금 방식을 당연히 더 좋아하죠. rather than pay the costs themselves를 보면 자신들이 직접 비용을 치르는 것과 정부 지원을 받는 것이 대비되고 있어요. 결국 회사 입장에서는 보조금이 더 이득이라는 뜻이에요.","hl":"mn"},{"n":25,"text":"첫 번째 어법 포인트는 to receive money예요. prefer는 목적어로 to부정사를 취하는 동사라서, 돈을 받는 것을 선호한다가 되죠. 두 번째 포인트는 rather than pay the costs인데, prefer to do A rather than do B 구문이에요. rather than 뒤에는 to 없이 동사원형이 오고, 앞의 to receive money와 병렬이 돼요. 세 번째로 문장 끝에 themselves는 재귀대명사 강조 용법이에요. 주어 They를 강조해서 그들 자신이 직접이라는 뜻을 더해 주고 생략해도 문장은 성립해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 기회 집합의 ‘확대’는\u003c/span>\u003cspan class=\"en\">the &quot;expansion&quot; of their opportunity set\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보조금을 통한\u003c/span>\u003cspan class=\"en\">through subsidies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맞추어져야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">matched\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들의 기회 집합의 축소에 의해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">contraction \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">opportunity \u003c/span>\u003cspan class=\"tgt\">set \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">others\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 보조금을 통한 그들의 기회 집합의 ‘확대’는 다른 사람들의 기회 집합의 축소에 의해 맞추어져야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 보조금이 발전소의 선택지를 넓혀 주는 것처럼 보이지만, 그것은 공짜가 아니라 반드시 다른 누군가의 기회를 줄여서 채워져야 한다는 핵심 논점이다. 즉 보조금 재원은 결국 세금에서 나오므로, 발전소의 \u003cb class=\"key\">기회 \u003c/b>\u003cb class=\"key\">집합\u003c/b>이 확대되는 만큼 일반 시민의 기회 집합은 축소된다. expansion에 큰따옴표를 써서 발전소가 얻는 자유가 사실은 상대적이라는 \u003cb class=\"key\">반어적\u003c/b> 뉘앙스를 담고 있다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have to + be + 과거분사 (의무와 수동태)\u003c/span> : has to + be + matched (과거분사) : \"맞추어져야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태의 행위자 표시 by\u003c/span> : be matched + by + 행위자 명사구 : \"다른 사람들의 기회 집합의 축소에 의해\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"But, 그러나. the \"expansion\" of their opportunity set, 그들의 기회 집합의 ‘확대’는. through subsidies, 보조금을 통한. has to be matched, 맞추어져야 한다. by the contraction of the opportunity set of others, 다른 사람들의 기회 집합의 축소에 의해.. 이 문장 전체를 해석하면, 그러나 보조금을 통한 그들의 기회 집합의 ‘확대’는 다른 사람들의 기회 집합의 축소에 의해 맞추어져야 한다.","hl":"m"},{"n":27,"text":"이 문장은 보조금이 발전소에게만 좋은 게 아니라는 중요한 논점을 제시해요. 발전소의 기회 집합이 확대되는 것처럼 보이지만, 그 확대는 반드시 다른 사람들의 기회 집합 축소로 채워져야 한다는 거죠. 보조금 재원은 세금에서 나오기 때문에 결국 일반 국민이 부담을 지게 되고, 그래서 expansion에 따옴표를 쳐서 그 확대가 상대적인 것임을 강조해요.","hl":"mn"},{"n":28,"text":"첫 번째 어법 포인트는 has to be matched예요. has to 다음에 be와 matched가 이어지면서 의무와 수동태가 결합된 형태인데, 확대가 스스로 맞추는 게 아니라 맞추어지는 대상이기 때문에 수동태가 쓰였어요. 두 번째 포인트는 by 이하인데, 수동태 문장에서 행위자는 by에 명사구를 붙여서 나타내요. 여기서는 the contraction of the opportunity set of others가 실제로 맞추는 행위자 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전력 회사들의 ‘자유’는\u003c/span>\u003cspan class=\"en\">The electricity companies' freedom&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">증가된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">increased\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반 개인을 희생시키며\u003c/span>\u003cspan class=\"en\">at the expense of the ordinary individual,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 늘어난 세금으로 고통을 겪어야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">suffer \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">increased \u003c/span>\u003cspan class=\"tgt\">taxation\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보조금을 지급하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">pay \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">subsidy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전력 회사들의 ‘자유’는 일반 개인을 희생시켜 증가하는데, 이들은 보조금을 지급하기 위해 늘어난 세금으로 인해 고통을 겪어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전력 회사들의 자유가 보조금으로 확대되지만, 그 자유는 일반 개인의 희생 위에서만 가능하다는 것을 보여 줘요. 결국 회사의 이익은 세금을 더 내는 \u003cb class=\"key\">일반 \u003c/b>\u003cb class=\"key\">개인의 \u003c/b>\u003cb class=\"key\">희생\u003c/b>으로 옮겨 가는 것이고, 이를 \u003cb class=\"key\">기회 \u003c/b>\u003cb class=\"key\">비용\u003c/b>이라고 볼 수 있어요. at the expense of는 다른 대상을 희생시킨다는 뜻으로, 보조금의 숨은 비용을 드러내는 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be + 과거분사 : \"증가된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : 선행사(ordinary individual), who + 동사 : \"그리고 그들은 늘어난 세금으로 고통을 겪어야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형 + for + 명사 : \"보조금을 지급하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"The electricity companies' freedom\", 전력 회사들의 ‘자유’는. is increased, 증가된다. at the expense of the ordinary individual, 일반 개인을 희생시키며. who must suffer from increased taxation, 그들은 늘어난 세금으로 고통을 겪어야 한다. to pay for the subsidy, 보조금을 지급하기 위해. 이 문장 전체를 해석하면, 전력 회사들의 ‘자유’는 일반 개인을 희생시켜 증가하는데, 이들은 보조금을 지급하기 위해 늘어난 세금으로 인해 고통을 겪어야 한다.","hl":"m"},{"n":30,"text":"이 문장은 보조금이 전력 회사에게 자유를 늘려 주지만, 그 자유가 일반 개인의 희생 위에서 이루어진다는 점을 말하고 있어요. 전력 회사는 세금으로 마련된 보조금을 받아 이득을 보지만, 결국 그 비용은 세금을 내는 일반 개인이 떠안게 되는 거죠. 핵심은 기회 비용이라고 할 수 있어요.","hl":"mn"},{"n":31,"text":"첫 번째로 is increased는 수동태예요. be동사와 과거분사 increased가 결합해서 자유가 증가되는, 즉 자유가 스스로 증가하는 게 아니라 외부 요인에 의해 증가된다는 뜻이에요. 두 번째로 who must suffer from increased taxation은 계속적 용법의 관계대명사예요. ordinary individual을 선행사로 받아서 추가 정보를 덧붙여 주고, 해석은 그리고 그들은 이렇게 연결해요. 세 번째로 to pay for the subsidy는 목적을 나타내는 to부정사예요. 보조금을 지급하기 위해라는 뜻으로 부사적 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더욱이\u003c/span>\u003cspan class=\"en\">Moreover,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">순수한 효율성의 관점에서\u003c/span>\u003cspan class=\"en\">from the perspective of pure efficiency,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 보조금은 경제를 왜곡한다\u003c/span>\u003cspan class=\"en\">the subsidy distorts the economy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 전력 회사가 전체 비용을 직면하지 않기 때문에\u003c/span>\u003cspan class=\"en\">because the electricity company is not facing the full costs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 하는 것의\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">does\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 배출량을 제한하는 데 성공하더라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">if\u003c/span> it is successful \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">limiting \u003c/span>\u003cspan class=\"tgt\">emissions\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">더욱이 순수한 효율성의 관점에서, 보조금은 전력 회사가 비록 배출량을 제한하는 데 성공하더라도 그것이 하는 것의 전체 비용을 직면하지 않기 때문에 경제를 왜곡한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 순수 효율의 관점에서 보조금은 전력 회사가 자신이 하는 일의 전체 비용을 부담하지 않게 만들기 때문에 경제를 왜곡한다는 주장이에요. 배출량을 줄이는 데 성공해도 회사가 치러야 할 \u003cb class=\"key\">전체 \u003c/b>\u003cb class=\"key\">비용\u003c/b>이 가려져 있으면 시장 신호가 왜곡돼요. 이는 보조금이 \u003cb class=\"key\">외부 \u003c/b>\u003cb class=\"key\">비용\u003c/b>을 내부화하지 못한다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what (선행사 포함)\u003c/span> : what + 주어 + 동사 : \"그것이 하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">양보 부사절 접속사 even if\u003c/span> : even if + 주어 + 동사 : \"비록 ~일지라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사 (전치사의 목적어)\u003c/span> : in + 동명사구 : \"배출량을 제한하는 데\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Moreover, 더욱이. from the perspective of pure efficiency, 순수한 효율성의 관점에서. the subsidy distorts the economy, 그 보조금은 경제를 왜곡한다. because the electricity company is not facing the full costs, 왜냐하면 전력 회사가 전체 비용을 직면하지 않기 때문에. of what it does, 그것이 하는 것의. even if it is successful in limiting emissions, 비록 배출량을 제한하는 데 성공하더라도. 이 문장 전체를 해석하면, 더욱이 순수한 효율성의 관점에서, 보조금은 전력 회사가 비록 배출량을 제한하는 데 성공하더라도 그것이 하는 것의 전체 비용을 직면하지 않기 때문에 경제를 왜곡한다.","hl":"m"},{"n":33,"text":"이 문장은 순수한 효율성의 관점에서 보조금이 경제를 왜곡한다는 논리를 설명하고 있어요. 전력 회사가 자신의 행동에 따르는 전체 비용을 직접 부담하지 않으면, 시장에서 가격과 소비에 잘못된 신호가 가게 된다는 거예요. 배출량을 줄이는 데 성공하더라도 전체 비용이 가려져 있으면 외부 비용이 내부화되지 않는다는 점이 핵심이에요.","hl":"mn"},{"n":34,"text":"첫 번째로 what it does는 선행사를 포함한 관계대명사 what이에요. what은 the thing which와 같은 의미로 뒤에 주어와 동사를 이끌고 명사절을 만들어요. 여기서는 전치사 of의 목적어로 쓰였어요. 두 번째로 even if는 양보를 나타내는 접속사로 비록 그러할지라도라는 뜻이에요. 세 번째로 in limiting emissions에서 limiting은 전치사 in의 목적어로 쓰인 동명사예요. 전치사 뒤에는 반드시 동명사가 와야 한다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로\u003c/span>\u003cspan class=\"en\">Indeed,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전기 가격은 결국 더 낮아질 수 있다\u003c/span>\u003cspan class=\"en\">electricity prices may end up lower\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래야 하는 것보다\u003c/span>\u003cspan class=\"en\">than they should be\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 전기 소비는 더 높아질 수 있다\u003c/span>\u003cspan class=\"en\">and electricity consumption higher,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 지구 온난화를 더욱 악화시킬 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">worsen \u003c/span>\u003cspan class=\"tgt\">global \u003c/span>\u003cspan class=\"tgt\">warming\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 전기 단위당 배출량은 감소했을지라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">though\u003c/span> the emissions per unit of electricity \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">reduced\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실제로 전기 가격은 그래야 하는 것보다 결국 더 낮아질수 있고 전기 소비는 더 높아질 수 있으며, 이는 비록 전기 단위당 배출량은 감소했을지라도 지구 온난화를 더욱 악화시킬 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 배출량이 단위당 줄어도 전기 가격이 낮아지고 소비가 늘면, 전체적인 온실가스 배출은 오히려 늘어날 수 있다는 역설을 보여 줘요. 이를 \u003cb class=\"key\">반동 \u003c/b>\u003cb class=\"key\">효과\u003c/b>라고 해요. 기술적 효율 개선이 소비 증가를 불러와 환경 개선 효과를 상쇄할 수 있다는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법 (which)\u003c/span> : which + will worsen + 목적어 : \"그리고 그것은 지구 온난화를 악화시킬 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">양보 부사절 접속사 even though\u003c/span> : even though + 주어 + 동사 : \"비록 ~일지라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재완료 수동태\u003c/span> : have + been + 과거분사 : \"감소되어 왔다\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"Indeed, 실제로. electricity prices may end up lower, 전기 가격은 결국 더 낮아질 수 있다. than they should be, 그래야 하는 것보다. and electricity consumption higher, 그리고 전기 소비는 더 높아질 수 있다. which will worsen global warming, 이는 지구 온난화를 더욱 악화시킬 것이다. even though the emissions per unit of electricity have been reduced, 비록 전기 단위당 배출량은 감소했을지라도. 이 문장 전체를 해석하면, 실제로 전기 가격은 그래야 하는 것보다 결국 더 낮아질수 있고 전기 소비는 더 높아질 수 있으며, 이는 비록 전기 단위당 배출량은 감소했을지라도 지구 온난화를 더욱 악화시킬 것이다.","hl":"m"},{"n":36,"text":"이 문장은 단위당 배출량이 줄어들었는데도 지구 온난화가 악화될 수 있는 이유를 설명해요. 보조금 때문에 전기 가격이 낮아지고 소비가 늘면 전체 배출량이 오히려 증가할 수 있거든요. 이것은 기술적 효율이 소비 증가를 불러와 환경 개선 효과를 상쇄하는 반동 효과라고 볼 수 있어요.","hl":"mn"},{"n":37,"text":"첫 번째로 which will worsen global warming은 계속적 용법의 관계대명사예요. 여기서 which는 앞의 절 전체 내용을 받아서 그리고 그것은이라고 해석해요. 두 번째로 even though는 양보 접속사로 비록 그렇다 하더라도라는 뜻이에요. 세 번째로 have been reduced는 현재완료 수동태예요. have와 been 그리고 과거분사 reduced가 결합해서 감소되어 왔다는 의미를 나타내요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">보조금\u003c/b>, \u003cb class=\"key\">세금\u003c/b>, \u003cb class=\"key\">규제\u003c/b>는 모두 석탄 사용을 줄여 오염을 낮추는 \u003cb class=\"key\">발전소\u003c/b>로 이어질 수 있다.\u003c/li>\u003cli>전력 회사는 \u003cb class=\"key\">비용\u003c/b>을 직접 부담하기보다 \u003cb class=\"key\">정부\u003c/b>로부터 돈을 받는 \u003cb class=\"key\">보조금\u003c/b>을 선호한다.\u003c/li>\u003cli>그러나 보조금은 전력 회사의 \u003cb class=\"key\">기회 \u003c/b>\u003cb class=\"key\">집합\u003c/b>을 확대하는 대신 일반 개인의 \u003cb class=\"key\">세금 \u003c/b>\u003cb class=\"key\">부담\u003c/b>으로 자유를 축소한다.\u003c/li>\u003cli>게다가 보조금은 전체 비용을 왜곡해 \u003cb class=\"key\">전기 \u003c/b>\u003cb class=\"key\">가격\u003c/b>을 낮추고 소비를 늘려 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>를 악화시킨다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Subsidies may seem attractive, but they distort the economy and can worsen global warming by lowering electricity prices and raising consumption.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">보조금\u003c/b>, \u003cb class=\"key\">세금\u003c/b>, \u003cb class=\"key\">규제\u003c/b> 모두 석탄 전환을 통한 \u003cb class=\"key\">오염 \u003c/b>\u003cb class=\"key\">저감\u003c/b>으로 이어질 수 있지만, 전력 회사는 \u003cb class=\"key\">보조금\u003c/b>을 선호한다. 그러나 보조금은 일반 개인의 \u003cb class=\"key\">세금 \u003c/b>\u003cb class=\"key\">부담\u003c/b>으로 전력 회사의 \u003cb class=\"key\">기회 \u003c/b>\u003cb class=\"key\">집합\u003c/b>을 확대하고 \u003cb class=\"key\">효율성\u003c/b>을 왜곡해 \u003cb class=\"key\">지구 \u003c/b>\u003cb class=\"key\">온난화\u003c/b>를 악화시킬 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":38,"text":"오늘 지문을 정리하면, 보조금과 세금, 규제 모두 오염 저감에 쓰일 수 있지만 전력 회사는 보조금을 선호합니다. 그러나 보조금은 일반 개인의 조세 부담을 키우고 효율성을 왜곡하며, 전기 소비를 늘려 지구 온난화를 악화시킬 수 있어요. 겉으로 보이는 혜택 뒤에 숨은 기회비용을 읽는 것이 중요합니다. 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
