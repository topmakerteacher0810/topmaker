<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 24번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 24번","audioDir":"24_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">24번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Why Fantasizing About Goals Can Keep Us from Achieving Them\u003c/h1>\u003ch2>목표에 대한 환상이 목표 달성을 막는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>목표를 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">환상\u003c/b>으로 낭만화하면 거짓 성취감에 빠져 \u003cb class=\"key\">일상적 \u003c/b>\u003cb class=\"key\">실천\u003c/b>을 외면하게 된다. 연구는 이런 환상이 오히려 노력을 줄이고 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">필요성\u003c/b>을 사라지게 한다고 경고한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Fantasizing about a positive future can give us a false sense of accomplishment and keep us from taking the daily actions needed to achieve our goals.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 목표를 상상만 하고 실행으로 옮기지 못하는 이유를 다룬 지문을 함께 볼게요. 이 글은 목표에 대한 긍정적 환상이 오히려 우리의 노력을 떨어뜨린다는 내용이에요. 요약하자면, 목표를 낭만화하면 거짓된 성취감에 빠져 일상의 변화를 외면하게 된다는 거죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">심리학에서는 미래의 좋은 모습을 생생하게 그리는 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">환상\u003c/b>이라는 개념이 있어요. 이런 상상은 마치 이미 목표를 이룬 듯한 \u003cb class=\"key\">거짓 \u003c/b>\u003cb class=\"key\">성취감\u003c/b>을 주어 실제 행동 에너지를 줄일 수 있어요. 그래서 연구자들은 긍정적 상상과 현실의 장애물을 함께 떠올리는 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">대조\u003c/b>라는 전략을 강조하기도 해요. 일상에 비유하면, 다이어트 목표를 세우고 멋진 몸매를 상상만 하며 뿌듯해하다가 오늘 운동을 빼먹는 경우와 같아요. 이 지문은 상상이 주는 달콤함이 오히려 \u003cb class=\"key\">목표 \u003c/b>\u003cb class=\"key\">달성\u003c/b>을 방해한다고 경고하는 거예요.\u003c/div>","segs":[{"n":2,"text":"여러분, 심리학에서 말하는 긍정적 환상이라는 개념이 있어요. 우리가 미래의 좋은 모습을 생생하게 그리면 마치 이미 이룬 것 같은 기분이 들 수 있죠. 이럴 때 거짓 성취감이 생겨서 실제 행동 에너지가 줄어들 수 있어요. 연구자들은 긍정적 상상과 현실의 장애물을 함께 떠올리는 정신적 대조라는 전략을 강조하기도 해요. 생활 비유를 하면, 다이어트 목표를 세우고 멋진 몸매를 상상만 하며 뿌듯해하다가 오늘 운동을 빼먹는 경우와 같아요. 그래서 이 지문은 상상이 주는 달콤함이 오히려 목표 달성을 방해한다고 경고하는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>목표 상상과 현실의 괴리\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>목표에 대한 \u003cb class=\"key\">상상\u003c/b>이 그것을 달성하기 위해 요구되는 \u003cb class=\"key\">일상적 \u003c/b>\u003cb class=\"key\">현실\u003c/b>과 동떨어져 있다는 문제를 제기한다. 우리는 목표라는 \u003cb class=\"key\">아이디어\u003c/b>와 사랑에 빠져, 목표를 실현하려면 하루하루가 얼마나 달라져야 하는지를 생각에서 밀어낸다. 이로써 목표 \u003cb class=\"key\">관념\u003c/b>과 \u003cb class=\"key\">실천\u003c/b> 사이의 괴리가 드러난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>연구 근거: 긍정적 환상과 노력 감소\u003csmall>근거 · 문장 3\u003c/small>\u003c/h4>\u003cp>연구에 따르면 미래에 대한 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">환상\u003c/b>은 거짓되고 때 이른 \u003cb class=\"key\">성취감\u003c/b>을 주어 오히려 목표에 덜 노력하게 만든다. 이는 환상이 마치 이미 이룬 듯한 착각을 불러일으키기 때문이다. 따라서 긍정적 상상이 \u003cb class=\"key\">동기\u003c/b>를 높이기보다 \u003cb class=\"key\">노력 \u003c/b>\u003cb class=\"key\">감소\u003c/b>로 이어질 수 있음을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>목표 낭만화와 어려움 간과\u003csmall>전개 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>목표를 \u003cb class=\"key\">낭만화\u003c/b>하면서 변화에 대한 상상과 사랑에 빠지는 태도를 재진술한다. 그 과정에서 복잡한 새로운 \u003cb class=\"key\">행동\u003c/b>을 삶에 통합할 때 따르는 \u003cb class=\"key\">어려움\u003c/b>과 \u003cb class=\"key\">복잡함\u003c/b>을 얼버무리고 넘어간다. 즉, \u003cb class=\"key\">현실적 \u003c/b>\u003cb class=\"key\">장애물\u003c/b>을 애써 무시하게 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>연구 인용: 행동 필요성 부재\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>한 연구의 표현을 빌려, 긍정적 미래를 환상하는 것이 사람을 \u003cb class=\"key\">현혹\u003c/b>하여 원하는 미래를 지금 여기에서 머릿속으로 즐기게 한다고 정리한다. 우리가 환상이 아직 미래가 아닌 이유를 돌아보지 않으면 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">필요성\u003c/b>이 유발되지 않는다. 결국 \u003cb class=\"key\">실천 \u003c/b>\u003cb class=\"key\">유발\u003c/b>이 사라진다는 것이 글의 결론이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 크게 네 단계로 흐름이 이어지는데요, 목표 상상과 현실의 괴리를 제시하고, 연구 근거로 노력 감소를 설명한 다음, 목표 낭만화와 어려움 간과를 다시 짚고, 마지막 연구 인용으로 행동 필요성이 사라진다고 정리해요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 목표에 대한 상상이 실제로 필요한 일상과 동떨어져 있다는 문제를 제기해요. 우리는 목표라는 idea에 빠져서, 그 목표를 이루려면 하루하루가 얼마나 달라져야 하는지를 생각에서 밀어내 버리죠. 여기서 day-to-day가 바뀌어야 한다는 현실을 외면하는 태도가 핵심이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 연구 결과를 근거로 제시해요. 긍정적인 미래 환상이 우리에게 거짓되고 때 이른 성취감을 주기 때문에, 실제로는 목표에 덜 노력하게 된다는 거예요. positive fantasies가 false and premature sense of accomplishment를 만든다는 설명이죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 목표를 낭만화하는 태도를 다시 설명해요. 변화에 대한 상상과 사랑에 빠져서, 복잡한 새로운 행동을 삶에 통합할 때 생기는 어려움을 gloss over, 즉 얼버무리고 넘어가게 된다는 거죠. intricate한 문제와 challenge를 제대로 보지 못하는 거예요.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 한 연구의 표현을 빌려서 결론을 내려요. 긍정적 미래를 환상하는 것은 사람을 유혹해서 원하는 미래를 지금 여기에서 머릿속으로 즐기게 만들고, 왜 아직 그 미래가 아닌지 돌아보지 않으면 행동해야 할 필요성이 생기지 않는다는 거예요. 결국 necessity to act가 유발되지 않는다는 말이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 목표에 대한 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">환상\u003c/b>이 \u003cb class=\"key\">일상적 \u003c/b>\u003cb class=\"key\">실천\u003c/b>을 가로막는다는 주장을 연구 근거로 뒷받침한다. 첫 문장에서 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">제기\u003c/b>를 하고, In fact로 \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">근거\u003c/b>를 보강하며, 마지막 문장에서 연구를 \u003cb class=\"key\">인용\u003c/b>해 결론을 맺는다. 따라서 \u003cb class=\"key\">두괄식\u003c/b> 구조로 보고 첫 문장을 중심에 두면 글의 핵심을 빠르게 파악할 수 있다. 핵심어는 \u003cb class=\"key\">환상\u003c/b>과 \u003cb class=\"key\">현실\u003c/b>의 대조로 계속 재진술된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Unfortunately (1)\u003c/b>\u003cspan>문제·한계 제기\u003c/span>\u003cb>In fact (3)\u003c/b>\u003cspan>근거 강조\u003c/span>\u003cb>In the process (5)\u003c/b>\u003cspan>결과·전개\u003c/span>\u003cb>As one study nicely summed it up (6)\u003c/b>\u003cspan>연구 인용·요약\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the idea of a goal\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">positive fantasies about our future\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">romanticize a goal\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">fantasizing about a positive future\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>긍정적 환상\u003c/th>\u003cth>일상적 실천\u003c/th>\u003c/tr>\u003ctr>\u003ctd>머릿속으로 미래를 즐김\u003c/td>\u003ctd>하루하루 달라져야 할 현실\u003c/td>\u003c/tr>\u003ctr>\u003ctd>거짓 성취감으로 노력 감소\u003c/td>\u003ctd>복잡한 새 행동 통합 필요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>어려움을 얼버무림\u003c/td>\u003ctd>행동 필요성 인식\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거 방식으로 전개되고, 구조는 두괄식이에요. 첫 문장에서 목표에 대한 상상과 일상적 현실이 동떨어져 있다는 문제를 분명히 제시하고, 뒤 문장들은 이 주장을 반복하거나 연구와 인용으로 뒷받침하죠. 특히 In fact로 시작하는 문장이 연구 근거를 강조해요. 그래서 첫 문장을 중심으로 뒤에 나오는 내용을 연결해서 읽으면 좋아요.","hl":"ty"},{"n":9,"text":"신호어를 살펴볼게요. 첫 문장의 Unfortunately는 아쉽지만 문제가 있다는 뜻으로 화자가 부정적 입장을 드러내요. 세 번째 문장의 In fact는 앞 내용을 강화하며 실제 연구 결과를 가져오는 신호이고요. 여섯 번째 문장의 As one study nicely summed it up은 앞서 말한 연구를 요약해서 다시 인용하는 표현이에요. 또 the idea of a goal, positive fantasies, romanticize a goal 같은 표현이 같은 개념을 바꿔 말하면서, 상상과 현실의 대조를 계속 반복해 주고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Unfortunately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>안타깝게도\u003c/span>\u003c/div>\u003cdiv>\u003cb>disconnected\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>단절된, 동떨어진\u003c/span>\u003c/div>\u003cdiv>\u003cb>reality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현실\u003c/span>\u003c/div>\u003cdiv>\u003cb>achieve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>달성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall in love with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 사랑에 빠지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>push out of mind\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>생각에서 밀어내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in fact\u003c/b>\u003cem>부사\u003c/em>\u003cspan>사실은, 실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>research\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>positive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긍정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>fantasy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환상\u003c/span>\u003c/div>\u003cdiv>\u003cb>future\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미래\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>put effort into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 노력을 기울이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>false\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거짓된\u003c/span>\u003c/div>\u003cdiv>\u003cb>premature\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>때 이른\u003c/span>\u003c/div>\u003cdiv>\u003cb>sense of accomplishment\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>성취감\u003c/span>\u003c/div>\u003cdiv>\u003cb>romanticize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>낭만화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gloss over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>얼버무리고 넘어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>intricacy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>복잡함\u003c/span>\u003c/div>\u003cdiv>\u003cb>integrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>통합하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>complex\u on이나 address와 반대가 되죠. induce는 cause나 trigger와 비슷하고 prevent와 반대예요. 이렇게 묶어서 기억하면 어휘 문제에 강해져요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안타깝게도, 때때로\u003c/span>\u003cspan class=\"en\">Unfortunately, sometimes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">목표에 대한 상상은\u003c/span>\u003cspan class=\"en\">the idea of a goal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~로부터 동떨어져 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">disconnected \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상적인 현실\u003c/span>\u003cspan class=\"en\">the daily reality\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 달성하기 위해 요구되는 것의\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 달성하기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">achieve \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">안타깝게도 목표에 대한 상상은 때때로 그것을 달성하기 위해 요구되는 것의 일상적인 현실로부터 동떨어져 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 목표에 대한 상상이 실제로 그것을 달성하는 데 필요한 일상적 현실과 \u003cb class=\"key\">동떨어져 \u003c/b>\u003cb class=\"key\">있다\u003c/b>고 하며 문제를 제기합니다. 'idea of a goal'은 머릿속의 이상적인 목표 상상을, 'daily reality'는 매일의 구체적 노력을 뜻합니다. 'disconnected from'은 이 둘 사이의 \u003cb class=\"key\">괴리\u003c/b>를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + 과거분사 + from)\u003c/span> : be + disconnected (과거분사) + from : \"~로부터 동떨어져 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what (선행사 포함)\u003c/span> : what + 주어 + 동사 (전치사 of의 목적어) : \"그것을 달성하기 위해 요구되는 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Unfortunately, sometimes, 안타깝게도, 때때로. the idea of a goal, 목표에 대한 상상은. is disconnected from, ~로부터 동떨어져 있다. the daily reality, 일상적인 현실. of what it will take, 그것을 달성하기 위해 요구되는 것의. to achieve it, 그것을 달성하기 위해.. 이 문장 전체를 해석하면, 안타깝게도 목표에 대한 상상은 때때로 그것을 달성하기 위해 요구되는 것의 일상적인 현실로부터 동떨어져 있다.","hl":"m"},{"n":13,"text":"이 문장은 목표에 대한 상상이 실제로 그것을 달성하는 데 필요한 일상적 현실과 동떨어져 있다는 문제를 제기합니다. 여기서 idea of a goal은 머릿속의 이상적인 목표 상상이고, daily reality는 매일의 구체적 노력을 말해요. disconnected from은 이 둘 사이의 괴리를 강조하는 표현입니다.","hl":"mn"},{"n":14,"text":"첫 번째 문법 포인트는 is disconnected from입니다. be disconnected from은 분리된 상태를 나타내는 수동태 표현으로, 목표에 대한 상상이 일상적인 현실과 동떨어져 있다는 뜻을 만들어요. 두 번째 포인트는 what it will take to achieve it인데요. what은 선행사를 포함한 관계대명사로, 그 달성에 요구되는 것이라는 명사덩어리를 만들어 전치사 of의 목적어 역할을 하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 ~와 사랑에 빠진다\u003c/span>\u003cspan class=\"en\">We fall in love with\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">목표에 대한 ‘상상’과\u003c/span>\u003cspan class=\"en\">the idea of a goal,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각에서 밀어내면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">pushing \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">mind\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 하루하루가 얼마나 달라져야 할지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">day-to-day \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 그것을 실현하기 위해서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">happen\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 목표에 대한 ‘상상’과 사랑에 빠져, 우리가 그것을 실현하기 위해서 우리의 하루하루가 얼마나 달라져야 할지를 생각에서 밀어낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 목표라는 상상에 빠져 정작 일상이 얼마나 달라져야 하는지를 \u003cb class=\"key\">생각에서 \u003c/b>\u003cb class=\"key\">밀어낸다\u003c/b>고 말합니다. 'pushing out of mind'는 목표에 심취하는 순간 \u003cb class=\"key\">현실적 \u003c/b>\u003cb class=\"key\">변화를 \u003c/b>\u003cb class=\"key\">외면\u003c/b>하는 동시 동작을 나타냅니다. 결국 목표를 이루려면 하루하루가 크게 달라져야 한다는 사실을 애써 무시하는 것입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (현재분사의 동시동작)\u003c/span> : 주어 + 동사, ~ing ... : \"생각에서 밀어내면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (how)\u003c/span> : how + 형용사 + 주어 + 동사 : \"우리의 하루하루가 얼마나 달라져야 할지를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어 (for + 목적격)\u003c/span> : for + 목적격(us) + to부정사 : \"우리가 그것을 실현하기 위해서\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"We fall in love with, 우리는 ~와 사랑에 빠진다. the idea of a goal, 목표에 대한 ‘상상’과. pushing out of mind, 생각에서 밀어내면서. how different our day-to-day will need to be, 우리의 하루하루가 얼마나 달라져야 할지를. for us to make it happen, 우리가 그것을 실현하기 위해서.. 이 문장 전체를 해석하면, 우리는 목표에 대한 ‘상상’과 사랑에 빠져, 우리가 그것을 실현하기 위해서 우리의 하루하루가 얼마나 달라져야 할지를 생각에서 밀어낸다.","hl":"m"},{"n":16,"text":"이 문장은 우리가 목표라는 상상에 빠져서 정작 매일의 삶이 얼마나 달라져야 하는지를 생각에서 밀어낸다고 말합니다. pushing out of mind는 동시에 일어나는 행동을 나타내는 분사구문으로, 목표에 심취하는 순간 현실적 변화를 외면한다는 뜻이에요. 결국 목표를 이루려면 하루하루가 크게 달라져야 한다는 사실을 애써 무시하는 겁니다.","hl":"mn"},{"n":17,"text":"첫 번째 문법 포인트는 pushing out of mind입니다. 콤마 뒤에 현재분사가 나오는 분사구문으로, 주어 we가 스스로 밀어낸다는 능동의 의미를 가지면서 본동사와 동시에 일어나는 상황을 나타내요. 두 번째는 how different our day-to-day will need to be로, how가 이끄는 간접의문문이 동사 pushing out of mind의 목적어 역할을 합니다. 마지막으로 for us to make it happen에서 for us는 to부정사의 의미상 주어로, 우리가 실현하는 행동의 주체가 누구인지를 보여줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로, 연구는 심지어 시사한다\u003c/span>\u003cspan class=\"en\">In fact, research even suggests\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 미래에 대한 긍정적 환상이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">positive \u003c/span>\u003cspan class=\"tgt\">fantasies \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">future \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 이끌 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">lead \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 목표에 노력을 덜 기울이게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">effort \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">goals\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 우리의 환상이 우리에게 주기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">fantasies \u003c/span>\u003cspan class=\"tgt\">provide \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거짓되고 때 이른 성취감을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">false \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">premature \u003c/span>\u003cspan class=\"tgt\">sense \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">accomplishment\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실제로, 연구는 심지어 우리의 환상이 우리에게 거짓되고 때 이른 성취감을 주기 때문에 우리의 미래에 대한 긍정적 환상이 우리가 우리의 목표에 노력을 ‘덜’ 기울이게 할 수 있다는 것을 시사한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 연구 결과를 근거로, 긍정적 환상이 오히려 목표에 대한 노력을 줄일 수 있다고 주장합니다. 환상이 \u003cb class=\"key\">거짓되고 \u003c/b>\u003cb class=\"key\">때 \u003c/b>\u003cb class=\"key\">이른 \u003c/b>\u003cb class=\"key\">성취감\u003c/b>을 주어 이미 이룬 듯한 느낌을 만들기 때문에 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">유발\u003c/b>이 되지 않는다는 것입니다. 이는 긍정적 환상이 실제 노력을 방해하는 핵심 기제를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that절 (명사절, 동사 suggests의 목적어)\u003c/span> : suggest + that + 주어 + 동사 : \"우리의 미래에 대한 긍정적 환상이 우리가 목표에 노력을 덜 기울이게 할 수 있다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사절 (이유의 because)\u003c/span> : because + 주어 + 동사 : \"왜냐하면 우리의 환상이 우리에게 거짓되고 때 이른 성취감을 주기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In fact, research even suggests, 실제로, 연구는 심지어 시사한다. that positive fantasies about our future, 우리의 미래에 대한 긍정적 환상이. can lead us, 우리를 이끌 수 있다. to put less effort into our goals, 우리의 목표에 노력을 덜 기울이게. because our fantasies provide us, 왜냐하면 우리의 환상이 우리에게 주기 때문에. with a false and premature sense of accomplishment, 거짓되고 때 이른 성취감을.. 이 문장 전체를 해석하면, 실제로, 연구는 심지어 우리의 환상이 우리에게 거짓되고 때 이른 성취감을 주기 때문에 우리의 미래에 대한 긍정적 환상이 우리가 우리의 목표에 노력을 ‘덜’ 기울이게 할 수 있다는 것을 시사한다.","hl":"m"},{"n":19,"text":"이 문장은 연구 결과를 들어, 미래에 대한 긍정적 환상이 오히려 목표에 덜 노력하게 만들 수 있다고 말합니다. 환상이 거짓되고 때 이른 성취감을 주기 때문에 이미 이룬 듯한 느낌에 빠져 행동 유발이 되지 않는다는 거죠. 즉 긍정적 환상이 목표 달성의 필수 요소인 실제 노력을 줄이는 역설을 지적합니다.","hl":"mn"},{"n":20,"text":"첫 번째 문법 포인트는 that절입니다. suggests 뒤에 that이 이끄는 명사절이 나와서 연구가 무엇을 시사하는지 그 내용을 목적어로 전달해요. that절 안에서는 positive fantasies가 주어, can lead가 동사, us가 목적어, to put less effort into our goals가 목적보어로 이어지는 오형식 구조입니다. 두 번째 포인트는 because절인데요. because는 이유를 나타내는 부사절을 이끌어서, 환상이 거짓되고 때 이른 성취감을 주는 것이 노력을 덜 기울이는 원인이 된다는 인과관계를 보여줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 목표를 낭만화한다\u003c/span>\u003cspan class=\"en\">We romanticize a goal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">— 사랑에 빠지는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">—falling \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">love \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변화에 대한 생각과.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">idea \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">change\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 목표를 낭만화한다. 즉, 변화에 대한 상상과 사랑에 빠진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 목표를 \u003cb class=\"key\">낭만화\u003c/b>한다는 것은 변화라는 \u003cb class=\"key\">관념\u003c/b>과 사랑에 빠지는 것이다. 실제 목표 달성의 구체적 과정보다는 변화 자체의 \u003cb class=\"key\">이미지\u003c/b>에 매료된다는 점을 요약한다. 글 흐름에서 앞 문장의 romanticize를 대시 뒤에서 다시 풀어준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사구의 부연 설명(분사구문)\u003c/span> : We romanticize a goal — falling in love with the idea of a change : \"변화에 대한 생각과 사랑에 빠지는 것\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"We romanticize a goal, 우리는 목표를 낭만화한다. —falling in love, — 사랑에 빠지는 것. with the idea of a change, 변화에 대한 생각과.. 이 문장 전체를 해석하면, 우리는 목표를 낭만화한다. 즉, 변화에 대한 상상과 사랑에 빠진다.","hl":"m"},{"n":22,"text":"이 문장은 목표를 낭만화한다는 것이 곧 변화에 대한 관념과 사랑에 빠지는 것이라고 정의하고 있어요. 실제 목표를 이루기 위한 구체적인 과정보다는 변화 자체의 이미지에 매료된다는 뜻이죠. 앞 문장의 romanticize를 대시 뒤에서 다시 풀어서 설명해 주고 있습니다.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 대시 뒤에 나오는 falling in love with the idea of a change입니다. 이 표현은 주어 we와 능동 관계여서 현재분사 falling을 썼고, 목표를 낭만화한다는 내용을 부연 설명해 줍니다. 문법적으로는 분사구문의 부대 상황이라고 볼 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 과정에서\u003c/span>\u003cspan class=\"en\">In the process,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 얼버무리고 넘어간다\u003c/span>\u003cspan class=\"en\">we gloss over\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">복잡함과 어려움을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">intricacies \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">challenges\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통합하는 것의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">integrating \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">복잡한 새로운 행동을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">complex \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">behavior \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 삶에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 과정에서 우리는 복잡한 새로운 행동을 우리의 삶에 통합하는 것의 복잡함과 어려움에 대해 얼버무리고 넘어간다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 환상에 빠진 상태에서는 복잡한 새 행동을 삶에 통합할 때 따르는 \u003cb class=\"key\">복잡함\u003c/b>과 \u003cb class=\"key\">어려움\u003c/b>을 \u003cb class=\"key\">얼버무린다\u003c/b>는 뜻이다. 이는 목표를 관념적으로만 사랑할 때 실제 통합 과정을 간과하게 되는 문제를 지적한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사구 병렬\u003c/span> : the intricacies and challenges : \"복잡함과 어려움\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구의 전치사 목적어\u003c/span> : the intricacies and challenges of integrating a complex new behavior into our life : \"복잡한 새로운 행동을 우리의 삶에 통합하는 것의 복잡함과 어려움\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In the process, 그 과정에서. we gloss over, 우리는 얼버무리고 넘어간다. the intricacies and challenges, 복잡함과 어려움을. of integrating, 통합하는 것의. a complex new behavior, 복잡한 새로운 행동을. into our life, 우리의 삶에.. 이 문장 전체를 해석하면, 그 과정에서 우리는 복잡한 새로운 행동을 우리의 삶에 통합하는 것의 복잡함과 어려움에 대해 얼버무리고 넘어간다.","hl":"m"},{"n":25,"text":"이 문장은 복잡한 새로운 행동을 우리 삶에 통합할 때 따르는 복잡함과 어려움을 얼버무리고 넘어간다는 뜻이에요. 목표를 관념적으로만 사랑하면 실제로 그 행동을 삶에 들이는 어려움을 간과하게 된다는 문제를 지적하는 거죠.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 the intricacies and challenges인데, and로 명사 두 개가 병렬 연결된 구조예요. 두 번째 포인트는 전치사 of 뒤에 나오는 integrating입니다. 전치사 뒤에는 명사 상당 어구가 와야 하니까 동사 integrate를 동명사 integrating으로 바꿔서 of의 목적어로 쓴 거예요. 그래서 통합하는 것의 복잡함과 어려움이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 연구가 이를 잘 요약했듯이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">study \u003c/span>\u003cspan class=\"tgt\">nicely \u003c/span>\u003cspan class=\"tgt\">summed \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긍정적인 미래에 대하여 환상을 품는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">fantasizing \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">positive \u003c/span>\u003cspan class=\"tgt\">future\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람을 현혹시켜 원하는 미래를 지금 여기에서 머릿속으로 즐기게 한다\u003c/span>\u003cspan class=\"en\">&quot;seduces a person to mentally enjoy the desired future in the here and now&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 우리가 우리의 환상이 아직 우리의 미래가 아닌 이유에 대해 돌아보지 않기 때문에\u003c/span>\u003cspan class=\"en\">—and because we don't reflect on \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">fantasy \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">yet \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">future\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행동해야 할 필요가 유발되지 않는다\u003c/span>\u003cspan class=\"en\">&quot;a necessity to act \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">induced\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 연구가 이를 잘 요약했듯이, 긍정적인 미래에 대하여 환상을 품는 것은 “사람을 현혹시켜 원하는 미래를 지금 여기에서 머릿속으로 즐기게 한다.” 그래서 우리가 우리의 환상이 아직 우리의 미래가 아닌 ‘이유’에 대해 돌아보지 않기 때문에 “행동해야 할 필요가 유발되지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 연구 요약을 인용하여 긍정적 \u003cb class=\"key\">환상\u003c/b>이 사람을 \u003cb class=\"key\">현혹\u003c/b>해 현재에서 미래를 미리 즐기게 한다고 말한다. 우리는 왜 환상이 아직 미래가 아닌지를 돌아보지 않기 때문에 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">필요성\u003c/b>이 생기지 않는다는 것이다. 결국 환상이 실천을 방해한다는 글의 논리를 연구 근거로 마무리한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as의 부사절\u003c/span> : As one study nicely summed it up : \"한 연구가 이를 잘 요약했듯이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : Fantasizing about a positive future + seduces... : \"긍정적인 미래에 대하여 환상을 품는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : reflect on + why + our fantasy + is + not yet our future : \"왜 우리의 환상이 아직 우리의 미래가 아닌지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : a necessity to act + is not induced : \"행동해야 할 필요가 유발되지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"As one study nicely summed it up, 한 연구가 이를 잘 요약했듯이. fantasizing about a positive future, 긍정적인 미래에 대하여 환상을 품는 것은. \"seduces a person to mentally enjoy the desired future in the here and now\", 사람을 현혹시켜 원하는 미래를 지금 여기에서 머릿속으로 즐기게 한다. —and because we don't reflect on why our fantasy is not yet our future, 그래서 우리가 우리의 환상이 아직 우리의 미래가 아닌 이유에 대해 돌아보지 않기 때문에. \"a necessity to act is not induced.\", 행동해야 할 필요가 유발되지 않는다. 이 문장 전체를 해석하면, 한 연구가 이를 잘 요약했듯이, 긍정적인 미래에 대하여 환상을 품는 것은 “사람을 현혹시켜 원하는 미래를 지금 여기에서 머릿속으로 즐기게 한다.” 그래서 우리가 우리의 환상이 아직 우리의 미래가 아닌 ‘이유’에 대해 돌아보지 않기 때문에 “행동해야 할 필요가 유발되지 않는다.","hl":"m"},{"n":28,"text":"이 문장은 한 연구의 요약을 인용해서 긍정적인 미래에 대한 환상이 사람을 현혹시켜 지금 여기에서 그 미래를 머릿속으로 즐기게 만든다고 말해요. 그런데 우리는 왜 그 환상이 아직 현재의 현실이 아닌지를 돌아보지 않기 때문에 행동해야 할 필요가 생기지 않는다는 거죠. 결국 환상이 오히려 실천을 가로막는다는 이 글의 핵심 논리를 연구 근거로 마무리하는 문장입니다.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 문장 맨 앞의 As입니다. 여기서 As는 한 연구가 이를 잘 요약했듯이라는 뜻으로 뒤에 주어와 동사를 이끄는 접속사예요. 두 번째 포인트는 fantasizing about a positive future인데, 동명사구가 주어 역할을 해서 뒤의 seduces라는 동사를 받고 있어요. 세 번째는 why our fantasy is not yet our future 부분인데, 의문문이 아니라 reflect on의 목적어로 쓰인 간접의문문이라서 주어와 동사가 our fantasy is 순서로 와요. 네 번째는 is not induced인데, 필요가 유발되는 수동의 의미라서 be 동사와 과거분사 induced를 함께 썼습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>목표에 대한 \u003cb class=\"key\">상상\u003c/b>은 그것을 이루기 위해 필요한 \u003cb class=\"key\">일상적 \u003c/b>\u003cb class=\"key\">현실\u003c/b>과 동떨어져 있다.\u003c/li>\u003cli>미래에 대한 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">환상\u003c/b>은 \u003cb class=\"key\">거짓 \u003c/b>\u003cb class=\"key\">성취감\u003c/b>을 주어 목표에 덜 노력하게 만든다.\u003c/li>\u003cli>목표를 \u003cb class=\"key\">낭만화\u003c/b>하면 복잡한 새 행동을 삶에 통합할 때의 \u003cb class=\"key\">어려움\u003c/b>을 얼버무리게 된다.\u003c/li>\u003cli>환상이 아직 미래가 아닌 이유를 돌아보지 않으면 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">필요성\u003c/b>이 유발되지 않는다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Fantasizing about a positive future can give us a false sense of accomplishment and keep us from taking the daily actions needed to achieve our goals.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">목표를 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">환상\u003c/b>으로 낭만화하면 거짓 성취감에 빠져 \u003cb class=\"key\">일상적 \u003c/b>\u003cb class=\"key\">실천\u003c/b>을 외면하게 된다. 연구는 이런 환상이 오히려 노력을 줄이고 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">필요성\u003c/b>을 사라지게 한다고 경고한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 지문을 정리하면, 목표를 상상만 하는 것은 일상의 변화를 외면하게 하고, 거짓 성취감을 주어 오히려 행동을 방해한다는 내용이었어요. 긍정적 환상이 항상 좋은 것만은 아니라는 점을 꼭 기억해 두세요. 목표를 이룰 때는 상상과 함께 현실의 어려움을 같이 돌아보는 태도가 필요하겠죠. 오늘 수업 여기까지입니다.","hl":null}]}]});</script></body></html>
