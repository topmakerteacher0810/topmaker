}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 41~42번","audioDir":"42_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.707em\">41~42번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Ethical Defaults: Balancing User Control and Sustainability\u003c/h1>\u003ch2>윤리적 기본값: 사용자 통제와 지속가능성의 균형\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">무한 \u003c/b>\u003cb class=\"key\">스크롤\u003c/b>과 \u003cb class=\"key\">자동 \u003c/b>\u003cb class=\"key\">재생\u003c/b> 같은 \u003cb class=\"key\">웹 \u003c/b>\u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>은 사용자 통제를 방해하고 \u003cb class=\"key\">데이터\u003c/b>와 \u003cb class=\"key\">주의력\u003c/b>의 과잉 소비를 부추긴다. 따라서 윤리적 설계는 \u003cb class=\"key\">투명하고 \u003c/b>\u003cb class=\"key\">되돌릴 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있으며\u003c/b> 사용자 이익에 부합해야 하고, \u003cb class=\"key\">영향이 \u003c/b>\u003cb class=\"key\">적은 \u003c/b>\u003cb class=\"key\">옵션\u003c/b>을 \u003cb class=\"key\">기본값\u003c/b>으로 하여 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 줄이면서 \u003cb class=\"key\">사용자 \u003c/b>\u003cb class=\"key\">주체성\u003c/b>은 유지해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Ethical web design should make low-impact options the transparent, reversible default so it can reduce environmental impact without removing user agency.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 웹 디자인의 기본값과 사용자 주체성, 그리고 지속가능성에 관한 글입니다. 이 글은 무한 스크롤과 자동 재생 같은 패턴이 데이터와 주의력을 과잉 소비하게 만든다고 지적해요. 그러면서 윤리적인 설계는 영향이 적은 옵션을 기본값으로 삼아야 한다고 주장합니다. 자, 이제 본문을 함께 살펴볼까요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">웹이나 앱에서 사용자의 행동을 유도하는 설계를 흔히 \u003cb class=\"key\">nudge\u003c/b>라고 부르며, 때로는 사용자에게 불리한 방향으로 이끄는 \u003cb class=\"key\">dark \u003c/b>\u003cb class=\"key\">pattern\u003c/b>이 되기도 한다. 무한 스크롤(infinite scroll)과 자동 재생(autoplay)은 편리해 보이지만 데이터와 주의력을 계속 소비하게 만드는 대표적 \u003cb class=\"key\">기본값(default)\u003c/b> 설계이다. 기본값은 사용자가 따로 설정을 바꾸지 않으면 그대로 유지되기 때문에 영향력이 매우 크다. 예를 들어 새 휴대폰의 화면 밝기가 기본값으로 최대여서 배터리가 빨리 닳는 상황과 비슷하다. 환경을 생각하는 지속가능한 웹 디자인(sustainable web design)에서는 데이터 전송과 서버 전력 같은 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>도 고려해야 한다. 여기서 중요한 개념이 \u003cb class=\"key\">사용자 \u003c/b>\u003cb class=\"key\">주체성(user \u003c/b>\u003cb class=\"key\">agency)\u003c/b>인데, 사용자가 자기 선택을 통제할 수 있어야 한다는 뜻이다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 웹이나 앱에서 사용자의 행동을 이끄는 설계를 nudge라고 부르고, 사용자에게 불리하게 작동하면 dark pattern이라고 해요. infinite scroll과 autoplay 같은 기능은 편해 보이지만 데이터 전송과 전력 사용을 계속 늘리는 대표적인 기본값 설계입니다. 기본값은 사용자가 설정을 바꾸지 않으면 계속 유지되기 때문에 영향력이 매우 크죠. 예를 들어 새 휴대폰의 화면 밝기가 최대로 맞춰져 있어서 배터리가 빨리 닳는 경우와 비슷해요. 지속가능한 웹 디자인에서는 서버 전력과 데이터 사용 같은 환경적 영향까지 고려해야 합니다. 그리고 사용자 주체성, 즉 user agency가 중요하다는 점도 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>문제 제기\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>첫 번째 단계는 문제 제기로, \u003cb class=\"key\">무한 \u003c/b>\u003cb class=\"key\">스크롤\u003c/b>과 \u003cb class=\"key\">자동 \u003c/b>\u003cb class=\"key\">재생\u003c/b> 같은 패턴이 사용자의 통제를 방해하고 데이터와 \u003cb class=\"key\">주의력\u003c/b>의 과잉 소비를 부추긴다는 내용이다. 무한 스크롤은 콘텐츠를 계속 불러와 \u003cb class=\"key\">데이터 \u003c/b>\u003cb class=\"key\">사용\u003c/b>과 기기 \u003cb class=\"key\">처리 \u003c/b>\u003cb class=\"key\">작업\u003c/b>을 늘리고, 자동 재생은 보지 않을 사람에게도 영상을 강제로 재생하게 한다. 그 결과 사용자 기기와 서버 양쪽에서 더 많은 \u003cb class=\"key\">에너지\u003c/b>를 소비한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>구체적 사례\u003csmall>예시 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>두 번째 단계는 구체적 사례로, 한 인기 음악 스트리밍 \u003cb class=\"key\">플랫폼\u003c/b>이 정적인 \u003cb class=\"key\">앨범 \u003c/b>\u003cb class=\"key\">표지\u003c/b>를 짧은 \u003cb class=\"key\">영상 \u003c/b>\u003cb class=\"key\">루프\u003c/b>로 기본 설정한 결정을 다룬다. 이 변화는 \u003cb class=\"key\">데이터 \u003c/b>\u003cb class=\"key\">사용\u003c/b>과 \u003cb class=\"key\">배터리 \u003c/b>\u003cb class=\"key\">소비\u003c/b>를 상당히 증가시키고, 비활성화 옵션은 \u003cb class=\"key\">설정 \u003c/b>\u003cb class=\"key\">메뉴\u003c/b> 속 깊이 숨겨져 있다. 그 결과 대부분의 사용자는 적극적으로 \u003cb class=\"key\">빠져나올 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 찾지 않으면 더 많은 \u003cb class=\"key\">자원\u003c/b>을 소비하게 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>윤리 기준\u003csmall>전환 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>세 번째 단계는 전환과 윤리 기준으로, \u003cb class=\"key\">웹 \u003c/b>\u003cb class=\"key\">디자인\u003c/b>이 항상 어떤 방식으로든 행동을 \u003cb class=\"key\">유도\u003c/b>한다는 점을 인정한다. 결과를 보여 주고 선택지를 강조하는 것도 모두 \u003cb class=\"key\">영향력\u003c/b>의 형태이다. 윤리적 기준은 행동 유도가 존재하느냐가 아니라 \u003cb class=\"key\">투명성\u003c/b>, \u003cb class=\"key\">되돌릴 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있음\u003c/b>, 사용자 \u003cb class=\"key\">이익\u003c/b>과의 일치 여부에 달려 있다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>해결 방안\u003csmall>결론 · 문장 12–13\u003c/small>\u003c/h4>\u003cp>네 번째 단계는 해결 방안으로, 가장 책임 있는 접근은 \u003cb class=\"key\">영향이 \u003c/b>\u003cb class=\"key\">적은 \u003c/b>\u003cb class=\"key\">옵션\u003c/b>을 \u003cb class=\"key\">기본값\u003c/b>으로 만들고 대안을 분명하게 열어 두는 것이다. \u003cb class=\"key\">기본값\u003c/b>은 매우 강력해서, 신중하게 선택하면 \u003cb class=\"key\">사용자 \u003c/b>\u003cb class=\"key\">주체성\u003c/b>을 없애지 않고도 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 줄일 수 있다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 먼저 잡아 보면, 문제 제기와 구체적 사례, 윤리 기준, 해결 방안의 네 단계로 전개됩니다.","hl":null},{"n":4,"text":"첫 번째 단계는 문제 제기예요. 무한 스크롤과 자동 재생 같은 패턴이 사용자의 통제를 방해하고 데이터와 주의력의 과잉 소비를 부추긴다는 내용이 나와요. 무한 스크롤은 사용자가 원하든 원하지 않든 계속 콘텐츠를 불러오고, 자동 재생은 보지 않을 사람에게도 영상을 재생하게 만들어요. 결국 사용자 기기와 서버 양쪽에서 더 많은 에너지를 쓰게 됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 구체적인 사례입니다. 한 인기 음악 스트리밍 플랫폼이 정적인 앨범 표지를 짧은 영상 루프로 기본 설정했어요. 이렇게 바꾸자 데이터 사용과 배터리 소비가 상당히 늘었고, 비활성화하는 옵션은 설정 메뉴 깊숙이 숨겨져 있었습니다. 그래서 대부분의 사용자는 빠져나올 방법을 적극적으로 찾지 않으면 자원을 더 소비하게 됐죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 윤리 기준입니다. 웹 디자인이 항상 어떤 방식으로든 행동을 유도한다는 점을 인정해야 해요. 결과를 보여 주거나 선택지를 강조하는 것도 다 영향력의 형태예요. 윤리적 기준은 행동 유도가 존재하느냐가 아니라, 그것이 투명하고 되돌릴 수 있으며 사용자의 이익과 일치하는지에 달려 있습니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 해결 방안입니다. 가장 책임 있는 접근은 영향이 적은 옵션을 기본값으로 만들고 대안을 분명하게 열어 두는 거예요. 기본값은 매우 강력해서 신중하게 고르면 사용자 주체성을 없애지 않고도 환경적 영향을 줄일 수 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">문제-해결\u003c/b> 전개 방식으로, 앞부분은 사용자 통제를 방해하고 자원을 과잉 소비시키는 \u003cb class=\"key\">웹 \u003c/b>\u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>의 문제를 제시하고 뒷부분은 \u003cb class=\"key\">저영향 \u003c/b>\u003cb class=\"key\">기본값\u003c/b>이라는 해결을 제안한다. 핵심 주장이 마지막 문장에 집약되므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있다. 따라서 \u003cb class=\"key\">주제문\u003c/b>은 열세 번째 문장으로, 기본값이 사용자 주체성을 없애지 않고 환경적 영향을 줄일 수 있다는 내용이다. 문장 11의 윤리 기준이 근거 역할을 하지만 글의 최종 결론은 문장 13에 있으므로 주제문은 열세 번째 문장으로 판단했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>As a result (8)\u003c/b>\u003cspan>결과 신호어\u003c/span>\u003cb>It is important to acknowledge (9)\u003c/b>\u003cspan>전환 신호어\u003c/span>\u003cb>The ethical line is not ... but ... (11)\u003c/b>\u003cspan>대조 및 기준 제시\u003c/span>\u003cb>In many cases (12)\u003c/b>\u003cspan>해결 방안 제시\u003c/span>\u003cb>Defaults are powerful (13)\u003c/b>\u003cspan>결론 신호어\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">user's control\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">opt out\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">user's interests\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">user agency\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>과잉 유도 패턴\u003c/th>\u003cth>책임 있는 저영향 기본값\u003c/th>\u003c/tr>\u003ctr>\u003ctd>사용자 통제 방해\u003c/td>\u003ctd>사용자 이익과 일치\u003c/td>\u003c/tr>\u003ctr>\u003ctd>데이터·주의 과잉 소비\u003c/td>\u003ctd>환경적 영향 감소\u003c/td>\u003c/tr>\u003ctr>\u003ctd>옵션을 깊이 숨김\u003c/td>\u003ctd>투명하고 되돌릴 수 있음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 문제와 해결이에요. 앞부분에서 무한 스크롤과 자동 재생이 자원을 과잉 소비하게 만드는 문제를 제시하고, 뒷부분에서 투명하고 되돌릴 수 있는 저영향 기본값이라는 해결 방안을 제시하죠. 구조는 미괄식으로 볼 수 있는데, 글의 핵심 주장이 마지막 문장에 집약되어 있기 때문입니다. 따라서 마지막 문장을 주제문으로 잡고 읽으면 글 전체를 꿰는 데 도움이 돼요.","hl":"ty"},{"n":9,"text":"신호어를 볼게요. 여덟 번째 문장의 As a result는 앞 사례의 결과를 보여 주는 신호예요. 아홉 번째 문장의 It is important to acknowledge는 논의를 전환해서 웹 디자인의 유도 자체를 인정하는 흐름을 만들죠. 열한 번째 문장의 The ethical line is not, but 구문은 단순한 존재가 아니라 투명성과 되돌릴 수 있음이라는 기준을 대조하며 제시해요. 그리고 마지막 문장의 Defaults are powerful은 결론을 강조하는 역할을 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>infinite scroll\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무한 스크롤\u003c/span>\u003c/div>\u003cdiv>\u003cb>autoplay\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자동 재생\u003c/span>\u003c/div>\u003cdiv>\u003cb>interfere with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 방해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통제\u003c/span>\u003c/div>\u003cdiv>\u003cb>sustainability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지속가능성\u003c/span>\u003c/div>\u003cdiv>\u003cb>overconsumption\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과잉 소비\u003c/span>\u003c/div>\u003cdiv>\u003cb>attention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주의력\u003c/span>\u003c/div>\u003cdiv>\u003cb>load\u003c/b>\u003cem>동사\u003c/em>\u003cspan>불러오다, 로딩하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>processing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>처리 작업\u003c/span>\u003c/div>\u003cdiv>\u003cb>force\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강요하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>consume\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소비하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deliver\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>replace\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대체하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>static\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>by default\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기본값으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>battery consumption\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배터리 소비\u003c/span>\u003c/div>\u003cdiv>\u003cb>disable\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비활성화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bury\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묻다, 숨기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opt out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>빠져나오다, 거부하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>acknowledge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nudge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(행동을) 유도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>consequence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>ethical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>윤리적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>transparent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>투명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>reversible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>되돌릴 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>aligned\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일치하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>interest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이익\u003c/span>\u003c/div>\u003cdiv>\u003cb>responsible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>책임 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>environmental impact\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경적 영향\u003c/span>\u003c/div>\u003cdiv>\u003cb>user agency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사용자 주체성\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개만 짚을게요. interfere with는 무엇을 방해하다, overconsumption은 과잉 소비, opt out은 빠져나오다 또는 거부하다라는 뜻이에요. default는 기본값이라는 뜻이고, user agency는 사용자 주체성으로 해석하면 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">interfere with\u003c/b>\u003cspan class=\"m\">~을 방해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">hinder\u003c/span>\u003cspan class=\"s\">obstruct\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">facilitate\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">encourage\u003c/b>\u003cspan class=\"m\">부추기다, 조장하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">promote\u003c/span>\u003cspan class=\"s\">foster\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discourage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consume\u003c/b>\u003cspan class=\"m\">소비하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">use\u003c/span>\u003cspan class=\"s\">expend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conserve\u003c/span>\u003cspan class=\"a\">save\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disable\u003c/b>\u003cspan class=\"m\">비활성화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deactivate\u003c/span>\u003cspan class=\"s\">turn off\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">enable\u003c/span>\u003cspan class=\"a\">activate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">opt out\u003c/b>\u003cspan class=\"m\">거부하다, 빠져나오다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">withdraw\u003c/span>\u003cspan class=\"s\">decline\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">opt in\u003c/span>\u003cspan class=\"a\">participate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">transparent\u003c/b>\u003cspan class=\"m\">투명한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clear\u003c/span>\u003cspan class=\"s\">open\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">opaque\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">aligned\u003c/b>\u003cspan class=\"m\">일치하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">consistent\u003c/span>\u003cspan class=\"s\">compatible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conflicting\u003c/span>\u003cspan class=\"a\">opposed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reduce\u003c/b>\u003cspan class=\"m\">줄이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">raise\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 잘 나오는 동의어와 반의어도 정리해 둡시다. interfere with는 hinder나 obstruct와 바꿔 쓸 수 있고, 반대는 facilitate나 allow예요. consume은 use나 expend와 유사하고 conserve나 save와 반대입니다. transparent는 clear나 open과 통하고 opaque나 vague와 반대가 돼요. reduce는 decrease나 lessen과 비슷하고 increase나 raise와 반대라는 점까지 함께 외워 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무한 스크롤, 자동 재생 영상, 혹은 단지 구매를 하기 위해 계정을 요구하는 것과 같은 패턴들은\u003c/span>\u003cspan class=\"en\">Patterns \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> infinite scroll, autoplaying videos, or \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">requiring \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">account\u003c/span> just \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">purchase\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두 방해한다\u003c/span>\u003cspan class=\"en\">all interfere with\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용자들이 자기 자신의 경험을 통제하는 것을\u003c/span>\u003cspan class=\"en\">the user's control over their own experience.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무한 스크롤, 자동 재생 영상, 혹은 단지 구매를 하기 위해 계정을 요구하는 것과 같은 패턴들은 모두 사용자들이 자기 자신의 경험을 통제하는 것을 방해한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사용자 경험을 통제하지 못하게 만드는 대표적인 패턴들을 나열하며 지문의 문제의식을 열어요. such as 다음에 \u003cb class=\"key\">무한 \u003c/b>\u003cb class=\"key\">스크롤\u003c/b>, \u003cb class=\"key\">자동 \u003c/b>\u003cb class=\"key\">재생 \u003c/b>\u003cb class=\"key\">영상\u003c/b>, 계정 요구가 병렬로 예시를 구성해요. 이들 패턴은 모두 \u003cb class=\"key\">사용자 \u003c/b>\u003cb class=\"key\">통제\u003c/b>를 방해한다는 점이 핵심이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">예시를 나열하는 표현 such as\u003c/span> : such as + [예시 나열] : \"~와 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사(구)의 명사적 용법\u003c/span> : requiring [동명사] + an account [목적어] : \"계정을 요구하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to [동사원형] + a purchase [목적어] : \"구매를 하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Patterns such as infinite scroll, autoplaying videos, or requiring an account just to make a purchase, 무한 스크롤, 자동 재생 영상, 혹은 단지 구매를 하기 위해 계정을 요구하는 것과 같은 패턴들은. all interfere with, 모두 방해한다. the user's control over their own experience, 사용자들이 자기 자신의 경험을 통제하는 것을. 이 문장 전체를 해석하면, 무한 스크롤, 자동 재생 영상, 혹은 단지 구매를 하기 위해 계정을 요구하는 것과 같은 패턴들은 모두 사용자들이 자기 자신의 경험을 통제하는 것을 방해한다.","hl":"m"},{"n":13,"text":"이 문장은 사용자 경험을 통제하지 못하게 만드는 대표적인 패턴들을 나열하며 지문의 문제의식을 열어요. such as 다음에 무한 스크롤과 자동 재생 영상, 계정 요구가 병렬로 예시를 구성해요. 이들 패턴은 모두 사용자 통제를 방해한다는 점이 핵심이에요.","hl":"mn"},{"n":14,"text":"첫 번째 문장의 어법 포인트입니다. 첫 번째, such as는 뒤에 예시를 나열하는 표현이에요. 무한 스크롤, 자동 재생 영상, 계정 요구 같은 것들을 병렬로 보여줘요. 두 번째, requiring an account는 require에 ing를 붙여 계정을 요구하는 것이라는 뜻의 동명사구예요. 세 번째, to make a purchase는 구매를 하기 위해라는 목적의 to부정사로, 앞에 나온 requiring an account의 목적을 설명해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지속가능성의 관점에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">From \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">sustainability \u003c/span>\u003cspan class=\"tgt\">perspective\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 패턴들 중 많은 것들이 부추긴다\u003c/span>\u003cspan class=\"en\">many of these patterns encourage\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">데이터와 주의력의 과잉 소비를\u003c/span>\u003cspan class=\"en\">overconsumption of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">data \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">attention\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지속가능성의 관점에서 이러한 패턴들 중 많은 것들이 데이터와 주의력의 과잉 소비를 부추긴다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞선 패턴들을 \u003cb class=\"key\">지속가능성\u003c/b>의 관점에서 평가하고, 그 패턴들이 데이터와 주의력의 \u003cb class=\"key\">과잉 \u003c/b>\u003cb class=\"key\">소비\u003c/b>를 부추긴다고 말해요. 문제의 초점을 사용자 경험에서 환경적 비용으로 넓히는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법 (관점)\u003c/span> : From + a sustainability perspective : \"지속가능성의 관점에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬 구조\u003c/span> : A and B : \"데이터와 주의력\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"From a sustainability perspective, 지속가능성의 관점에서. many of these patterns encourage, 이러한 패턴들 중 많은 것들이 부추긴다. overconsumption of data and attention, 데이터와 주의력의 과잉 소비를. 이 문장 전체를 해석하면, 지속가능성의 관점에서 이러한 패턴들 중 많은 것들이 데이터와 주의력의 과잉 소비를 부추긴다.","hl":"m"},{"n":16,"text":"이 문장은 앞선 패턴들을 지속가능성의 관점에서 평가하고, 그 패턴들이 데이터와 주의력의 과잉 소비를 부추긴다고 말해요. 문제의 초점을 사용자 경험에서 환경적 비용으로 넓히는 역할을 해요.","hl":"mn"},{"n":17,"text":"두 번째 문장의 어법 포인트입니다. 첫 번째, From a sustainability perspective는 지속가능성의 관점에서라는 관점의 부사구로 문장 전체를 수식해요. 두 번째, data and attention은 전치사 of의 목적어 자리에서 and로 병렬 연결되어 과잉 소비의 대상을 나열해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무한 스크롤은 새로운 콘텐츠를 계속해서 로딩한다\u003c/span>\u003cspan class=\"en\">Infinite scroll \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">keeps \u003c/span>\u003cspan class=\"tgt\">loading\u003c/span> new content\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용자가 그것을 원하든 원하지 않든\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">user \u003c/span>\u003cspan class=\"tgt\">wants \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">데이터 사용과 기기의 처리 작업을 증가시키면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">increasing \u003c/span>\u003cspan class=\"tgt\">data \u003c/span>\u003cspan class=\"tgt\">usage \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">device \u003c/span>\u003cspan class=\"tgt\">processing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무한 스크롤은 사용자가 그것을 원하든 원하지 않든 새로운 콘텐츠를 계속해서 로딩하고, 이는 데이터 사용과 기기의 처리 작업을 증가시킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">무한 \u003c/b>\u003cb class=\"key\">스크롤\u003c/b>의 구체적인 작동 방식을 설명해요. 사용자가 원하든 원하지 않든 새 콘텐츠를 계속 로딩하고, 그 결과 \u003cb class=\"key\">데이터 \u003c/b>\u003cb class=\"key\">사용\u003c/b>과 기기의 처리 작업이 늘어난다는 거죠. increasing 이하 \u003cb class=\"key\">분사구문\u003c/b>이 결과를 덧붙여 앞 문장의 지적을 구체화하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">keep + 동명사\u003c/span> : keep [동사] + loading [동명사] : \"계속해서 로딩한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">양보를 나타내는 whether A or not\u003c/span> : whether + 주어 + 동사 + or not : \"사용자가 그것을 원하든 원하지 않든\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문 (결과)\u003c/span> : increasing [현재분사] + data usage and device processing [목적어] : \"데이터 사용과 기기의 처리 작업을 증가시키면서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Infinite scroll keeps loading new content, 무한 스크롤은 새로운 콘텐츠를 계속해서 로딩한다. whether the user wants it or not, 사용자가 그것을 원하든 원하지 않든. increasing data usage and device processing, 데이터 사용과 기기의 처리 작업을 증가시키면서. 이 문장 전체를 해석하면, 무한 스크롤은 사용자가 그것을 원하든 원하지 않든 새로운 콘텐츠를 계속해서 로딩하고, 이는 데이터 사용과 기기의 처리 작업을 증가시킨다.","hl":"m"},{"n":19,"text":"이 문장은 무한 스크롤의 구체적인 작동 방식을 설명해요. 사용자가 원하든 원하지 않든 새 콘텐츠를 계속 로딩하고, 그 결과 데이터 사용과 기기의 처리 작업이 늘어난다는 거죠. increasing 이하 분사구문이 결과를 덧붙여 앞 문장 지적을 구체화하고 있어요.","hl":"mn"},{"n":20,"text":"세 번째 문장의 어법 포인트입니다. 첫 번째, keeps loading은 keep이 동명사를 목적어로 취해 계속해서 로딩한다는 뜻이에요. 두 번째, whether the user wants it or not은 사용자가 그것을 원하든 원하지 않든이라는 양보의 부사절이에요. 세 번째, increasing data usage and device processing은 주절의 결과를 나타내는 분사구문으로, 무한 스크롤이 데이터 사용과 기기의 처리 작업을 능동적으로 증가시킨다는 의미를 덧붙여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자동 재생은 강요한다\u003c/span>\u003cspan class=\"en\">Autoplay \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">forces \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매체가 로딩하고 재생하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">media \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">load \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">play\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 사람들에게조차도\u003c/span>\u003cspan class=\"en\">even for people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 절대 시청하지 않을지도 모르는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">watch \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자동 재생은 매체가 그것을 절대 시청하지 않을 사람들에게조차도 로딩하고 재생하도록 강요한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 자동 재생이 영상을 보지 않을 사람에게까지 미디어를 \u003cb class=\"key\">로딩\u003c/b>하고 \u003cb class=\"key\">재생\u003c/b>하도록 강제한다고 말한다. 앞 문장의 \u003cb class=\"key\">과소비\u003c/b> 사례 중 하나로, 사용자 의사와 무관한 데이터 소비를 구체적으로 보여 준다. who may never watch it은 people을 수식하는 \u003cb class=\"key\">주격 \u003c/b>\u003cb class=\"key\">관계대명사\u003c/b>절이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">force + 목적어 + to부정사\u003c/span> : force + 목적어 + to부정사 : \"매체가 로딩하고 재생하도록 강요한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사(people) + who + 동사(may never watch) : \"그것을 절대 시청하지 않을지도 모르는\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Autoplay forces, 자동 재생은 강요한다. media to load and play, 매체가 로딩하고 재생하도록. even for people, 심지어 사람들에게조차도. who may never watch it, 그것을 절대 시청하지 않을지도 모르는. 이 문장 전체를 해석하면, 자동 재생은 매체가 그것을 절대 시청하지 않을 사람들에게조차도 로딩하고 재생하도록 강요한다.","hl":"m"},{"n":22,"text":"이 문장은 자동 재생이 영상을 보지 않을 사람에게까지 미디어를 로딩하고 재생하도록 강제한다고 말해요. 앞 문장의 과소비 사례 중 하나로 사용자 의사와 무관한 데이터 소비를 구체적으로 보여 줍니다. 관계대명사 who가 people을 수식한다는 점도 확인하세요.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 force A to do 형태예요. force는 목적어 뒤에 to부정사를 목적격 보어로 취하는 동사라서 forces media to load and play가 매체가 로딩하고 재생하도록 강요한다로 해석됩니다. 이때 media가 to load and play의 의미상 주어가 되는 것입니다. 두 번째 포인트는 관계대명사 who예요. who는 선행사 people을 받아 뒤에 may never watch it을 이끌면서 전체가 people을 수식하는 형용사절 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 선택들은\u003c/span>\u003cspan class=\"en\">These choices\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 에너지를 소비한다\u003c/span>\u003cspan class=\"en\">consume more energy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둘 다에서\u003c/span>\u003cspan class=\"en\">on \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용자의 기기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">user's \u003c/span>\u003cspan class=\"tgt\">device \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 서버들\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">servers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">콘텐츠를 전달하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">delivering \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">content\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 선택들은 사용자의 기기와 콘텐츠를 전달하는 서버 모두에서 더 많은 에너지를 소비한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> These choices는 앞서 말한 \u003cb class=\"key\">무한 \u003c/b>\u003cb class=\"key\">스크롤\u003c/b>과 \u003cb class=\"key\">자동 \u003c/b>\u003cb class=\"key\">재생\u003c/b> 같은 디자인 선택을 가리킨다. 이 문장은 사용자 기기와 콘텐츠를 전달하는 서버 양쪽 모두에서 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">소비\u003c/b>가 늘어난다는 점을 짚어 환경 비용을 설명한다. delivering the content는 서버가 능동적으로 콘텐츠를 전달한다는 의미를 담은 \u003cb class=\"key\">현재분사\u003c/b> 수식이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 both A and B\u003c/span> : both + A + and + B : \"사용자의 기기와 서버 모두\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 후치수식\u003c/span> : 명사(the servers) + 현재분사구(delivering the content) : \"콘텐츠를 전달하는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"These choices, 이러한 선택들은. consume more energy, 더 많은 에너지를 소비한다. on both, 둘 다에서. the user's device, 사용자의 기기. and the servers, 그리고 서버들. delivering the content, 콘텐츠를 전달하는. 이 문장 전체를 해석하면, 이러한 선택들은 사용자의 기기와 콘텐츠를 전달하는 서버 모두에서 더 많은 에너지를 소비한다.","hl":"m"},{"n":25,"text":"여기서 These choices는 앞서 말한 무한 스크롤과 자동 재생 같은 디자인 선택을 가리켜요. 이 문장은 사용자 기기와 콘텐츠를 전달하는 서버 양쪽 모두에서 에너지 소비가 늘어난다는 점을 짚습니다. delivering the content가 servers를 뒤에서 수식하는 현재분사라는 점도 중요하죠.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 both A and B 상관접속사입니다. both the user's device and the servers가 사용자의 기기와 서버 둘 다를 묶어 줘요. A와 B 자리에 형태가 같은 명사구가 오는 병렬 구조가 포인트입니다. 두 번째 포인트는 delivering the content인데요. 이 현재분사는 앞에 있는 servers를 뒤에서 수식하고, 서버가 콘텐츠를 전달하는 능동의 의미이기 때문에 현재분사가 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결정을 예로 들어 보자\u003c/span>\u003cspan class=\"en\">Take the decision\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 인기 음악 스트리밍 플랫폼이 한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">popular \u003c/span>\u003cspan class=\"tgt\">music \u003c/span>\u003cspan class=\"tgt\">streaming \u003c/span>\u003cspan class=\"tgt\">platform\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정적인 앨범 표지를 대체하기로 한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">replace \u003c/span>\u003cspan class=\"tgt\">static \u003c/span>\u003cspan class=\"tgt\">album \u003c/span>\u003cspan class=\"tgt\">artwork \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">짧은 영상의 반복으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">short \u003c/span>\u003cspan class=\"tgt\">video \u003c/span>\u003cspan class=\"tgt\">loops\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기본값으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">default\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 인기 음악 스트리밍 플랫폼이 기본값으로 정적인 앨범 표지를 짧은 영상의 반복으로 대체하기로 한 결정을 예로 들어 보자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 구체적인 예로 한 \u003cb class=\"key\">음악 \u003c/b>\u003cb class=\"key\">스트리밍 \u003c/b>\u003cb class=\"key\">플랫폼\u003c/b>의 결정을 소개한다. Take the decision은 명령문이지만 지시가 아니라 사례를 들어 보자는 뜻이며, \u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">replace\u003c/b> 이하가 the decision의 내용을 설명한다. 특히 \u003cb class=\"key\">by \u003c/b>\u003cb class=\"key\">default\u003c/b>는 사용자가 선택하지 않아도 기본적으로 적용된다는 점을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">by + 행위자\u003c/span> : by + 명사구(행위자) : \"한 인기 음악 스트리밍 플랫폼에 의해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the decision + to replace(수식) : \"정적인 앨범 표지를 짧은 영상의 반복으로 대체하기로 한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용 표현 by default\u003c/span> : by + default : \"기본값으로, 기본적으로\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Take the decision, 결정을 예로 들어 보자. by a popular music streaming platform, 한 인기 음악 스트리밍 플랫폼이 한. to replace static album artwork, 정적인 앨범 표지를 대체하기로 한. with short video loops, 짧은 영상의 반복으로. by default, 기본값으로. 이 문장 전체를 해석하면, 한 인기 음악 스트리밍 플랫폼이 기본값으로 정적인 앨범 표지를 짧은 영상의 반복으로 대체하기로 한 결정을 예로 들어 보자.","hl":"m"},{"n":28,"text":"이 문장은 구체적인 예로 한 음악 스트리밍 플랫폼의 결정을 소개해요. Take the decision은 명령문이지만 지시가 아니라 예를 들어 보자는 뜻입니다. to replace 이하가 the decision의 내용을 설명하고, by default가 기본값으로 적용된다는 점을 강조합니다.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 by a popular music streaming platform에서 by가 행위 주체를 나타내는 전치사라는 점이에요. 결정을 내린 주체를 말해 주죠. 두 번째 포인트는 to부정사의 형용사적 용법입니다. to replace static album artwork with short video loops가 앞의 the decision을 수식해서 어떤 결정인지 내용을 설명해요. decision 같은 추상명사를 수식하는 전형적인 to부정사 용법입니다. 세 번째 포인트는 by default 관용 표현이에요. 사용자가 따로 설정하지 않아도 기본적으로 적용되는 상태를 뜻합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 변화는 상당히 증가시킨다\u003c/span>\u003cspan class=\"en\">This change significantly increases\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">데이터 사용과 배터리 소비를\u003c/span>\u003cspan class=\"en\">data usage and battery consumption,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면 그것을 비활성화하는 선택은\u003c/span>\u003cspan class=\"en\">while the option \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">disable \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">설정 메뉴 속 깊이 숨겨져 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">buried\u003c/span> deep in the settings.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 변화는 데이터 사용과 배터리 소비를 상당히 증가시키고, 반면 그것을 비활성화하는 선택은 설정 메뉴 속 깊이 숨겨져 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 음악 스트리밍 플랫폼이 정적 앨범 아트를 동영상 루프로 바꾼 사례에서, 이 변화가 \u003cb class=\"key\">데이터 \u003c/b>\u003cb class=\"key\">사용과 \u003c/b>\u003cb class=\"key\">배터리 \u003c/b>\u003cb class=\"key\">소비\u003c/b>를 크게 늘린다고 설명합니다. 동시에 비활성화 옵션이 \u003cb class=\"key\">설정 \u003c/b>\u003cb class=\"key\">깊숙이 \u003c/b>\u003cb class=\"key\">숨겨져\u003c/b> 있어 사용자가 끄기 어렵다는 점을 대조적으로 보여 줍니다. 앞 문단에서 말한 디자인 패턴의 에너지 낭비를 구체적으로 뒷받침하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the option + [to disable it] (명사 + to부정사) : \"그것을 비활성화하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + 과거분사(p.p.) : \"숨겨져 있다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"This change significantly increases, \u003cb class=\"key\">옵트아웃\u003c/b> 방법을 스스로 찾지 않는 한 기본 설정이 자원 낭비를 부른다는 점을 강조합니다. 디자인 선택이 사용자 행동에 미치는 부정적 영향을 보여 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절\u003c/span> : unless + 주어 + 동사 : \"그들이 적극적으로 찾지 않으면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : a way + [to opt out] (명사 + to부정사) : \"빠져나올 방법\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"As a result, 그 결과. most users consume more resources, 대부분의 사용자들은 더 많은 자원을 소비한다. unless they actively search for a way to opt out, 그들이 적극적으로 빠져나올 방법을 찾지 않으면.. 이 문장 전체를 해석하면, 그 결과 대부분의 사용자들은 그들이 적극적으로 빠져나올 방법을 찾지 않으면 더 많은 자원을 소비한다.","hl":"m"},{"n":34,"text":"이 문장은 앞 문장의 결과로, 대부분의 사용자가 적극적으로 옵트아웃 방법을 찾지 않는 한 더 많은 자원을 소비하게 된다는 점을 말해 줍니다. 설정이 깊숙이 숨겨져 있기 때문에 사용자가 그냥 두면 자원 소비가 늘어난다는 거죠. 결국 기본값이 환경에 미치는 영향을 보여 주는 문장입니다.","hl":"mn"},{"n":35,"text":"여기서는 두 가지를 짚어 볼게요. 첫 번째, unless they actively search에서 unless는 만약 그들이 적극적으로 찾지 않으면이라는 조건을 나타내는 접속사입니다. if not과 같은 의미로 조건 부사절을 이끌어요. 두 번째, to opt out은 a way를 수식하는 to부정사의 형용사적 용법입니다. 빠져나올 방법이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인정하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">acknowledge\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">웹 디자인이 항상 행동을 유도한다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u00 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결과를 보여 주는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Showing \u003c/span>\u003cspan class=\"tgt\">consequences \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 선택지를 강조하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">highlighting \u003c/span>\u003cspan class=\"tgt\">options\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두 형태이다\u003c/span>\u003cspan class=\"en\">are all \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">forms \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영향력의.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">influence\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결과를 보여 주는 것과 선택지를 강조하는 것은 모두 영향력의 형태이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 결과를 보여 주는 것과 선택지를 강조하는 것이 모두 영향력의 형태라는 점을 명시한다. 앞 문장에서 웹 디자인은 항상 어떤 방식으로든 행동을 유도한다고 했는데, 이 문장은 그 구체적 예를 들어 주고 있다. 영향력은 무조건 나쁜 것이 아니라 디자인의 자연스러운 \u003cb class=\"key\">영향력의 \u003c/b>\u003cb class=\"key\">형태\u003c/b>라는 점을 짚어 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [V-ing ~] + and + [V-ing ~] + [동사] : \"결과를 보여 주는 것과 선택지를 강조하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of의 형용사적 용법\u003c/span> : [명사] + of + [명사] : \"영향력의 형태\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Showing consequences, 결과를 보여 주는 것은. and highlighting options, 그리고 선택지를 강조하는 것은. are all forms, 모두 형태이다. of influence, 영향력의.. 이 문장 전체를 해석하면, 결과를 보여 주는 것과 선택지를 강조하는 것은 모두 영향력의 형태이다.","hl":"m"},{"n":40,"text":"이 문장은 결과를 보여 주는 것과 선택지를 강조하는 것이 모두 영향력의 형태라는 이야기입니다. 앞 문장에서 웹 디자인은 항상 어떤 방식으로든 행동을 유도한다고 했는데, 이 문장은 그 구체적인 예를 들어 주고 있죠. 영향력은 무조건 나쁜 것이 아니라 디자인의 자연스러운 부분이라는 점을 짚어 줍니다.","hl":"mn"},{"n":41,"text":"첫 번째, Showing consequences and highlighting options에서 동명사구가 주어로 쓰였습니다. 동명사구가 and로 연결되면 복수로 취급되어 동사 are가 왔어요. 두 번째, forms of influence에서 of influence가 앞의 명사 forms를 꾸며 주는 형용사적 전치사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">윤리적 기준은 ~이다\u003c/span>\u003cspan class=\"en\">The ethical line is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행동 유도가 존재하는지가 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">nudging \u003c/span>\u003cspan class=\"tgt\">exists, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 투명한지,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">transparent, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">되돌릴 수 있는지,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">reversible, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 ~와 일치하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">aligned\u003c/span> with\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용자의 이익과.\u003c/span>\u003cspan class=\"en\">the user's interests.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">윤리적 기준은 행동 유도가 존재하느냐가 아니라, 그것이 투명하고, 되돌릴 수 있으며, 사용자의 이익과 일치하는지이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 행동 유도가 존재하는지 자체가 아니라, 그것이 투명하고 되돌릴 수 있으며 사용자 이익과 일치하는지가 윤리적 기준임을 정의한다. 앞서 웹 디자인이 항상 행동을 유도한다고 했으므로 유도 자체를 문제 삼을 수 없다는 논리다. 핵심은 \u003cb class=\"key\">투명성\u003c/b>, \u003cb class=\"key\">되돌릴 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있음\u003c/b>, \u003cb class=\"key\">사용자 \u003c/b>\u003cb class=\"key\">이익\u003c/b>과의 일치이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 not A but B\u003c/span> : not + [whether절] + but + [whether절] : \"행동 유도가 존재하는지가 아니라 그것이 투명한지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 병렬\u003c/span> : [형용사 A], [형용사 B], and [형용사 C] : \"투명하고, 되돌릴 수 있으며, 일치하는\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"The ethical line is, 윤리적 기준은 ~이다. not whether nudging exists, 행동 유도가 존재하는지가 아니라. but whether it is transparent, 그것이 투명한지. reversible, 되돌릴 수 있는지. and aligned with, 그리고 ~와 일치하는지. the user's interests, 사용자의 이익과.. 이 문장 전체를 해석하면, 윤리적 기준은 행동 유도가 존재하느냐가 아니라, 그것이 투명하고, 되돌릴 수 있으며, 사용자의 이익과 일치하는지이다.","hl":"m"},{"n":43,"text":"이 문장은 윤리적 기준이 행동 유도의 존재 여부가 아니라, 행동 유도가 투명하고 되돌릴 수 있으며 사용자 이익과 일치하는지에 달려 있다고 말합니다. 앞 문장에서 웹 디자인이 항상 행동을 유도한다고 했으니, 유도 자체를 문제 삼을 수는 없죠. 중요한 건 그 유도가 사용자에게 유리한 방향으로 정직하게 작동하는지입니다.","hl":"mn"},{"n":44,"text":"첫 번째, not A but B 구문이 나왔습니다. not whether nudging exists와 but whether it is transparent가 대조를 이루며 병렬 구조를 만들었어요. not이 앞의 is를 부정하는 게 아니라 두 개의 whether절을 대조하는 역할을 합니다. 두 번째, transparent, reversible, and aligned가 세 개의 형용사로 병렬되어 있어요. 이 세 가지가 윤리적 행동 유도의 조건으로 제시되고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 경우,\u003c/span>\u003cspan class=\"en\">In many cases,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 책임 있는 접근 방법은 ~이다\u003c/span>\u003cspan class=\"en\">the most responsible approach is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만드는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(환경에 미치는) 영향이 더 적은 선택지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">lower‐impact \u003c/span>\u003cspan class=\"tgt\">option \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기본값으로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">default\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대안들을 유지하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">keeping \u003c/span>\u003cspan class=\"tgt\">alternatives \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분명하게 이용할 수 있도록.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">clearly \u003c/span>\u003cspan class=\"tgt\">available\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 경우, 가장 책임 있는 접근 방법은 대안들을 분명하게 이용할 수 있도록 유지하면서 (환경에 미치는) 영향이 더 적은 선택지를 기본값으로 만드는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 책임 있는 디자인의 구체적 방법으로 환경 영향이 적은 선택지를 기본값으로 삼고, 대안들도 분명하게 이용할 수 있게 유지하라고 제안한다. 이는 기본값이 강력한 힘을 가지며 신중하게 선택되면 사용자 선택권을 빼앗지 않고 환경 영향을 줄일 수 있다는 논리로 이어진다. 핵심은 \u003cb class=\"key\">기본값 \u003c/b>\u003cb class=\"key\">설정\u003c/b>과 \u003cb class=\"key\">선택권 \u003c/b>\u003cb class=\"key\">유지\u003c/b>이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(보어)\u003c/span> : be동사 + [to부정사구] (주격 보어) : \"영향이 더 적은 선택지를 기본값으로 만드는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make + 목적어 + 목적격보어\u003c/span> : make + [목적어] + [명사(목적격보어)] : \"그 선택지를 기본값으로 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">while + 현재분사 (분사구문)\u003c/span> : while + [V-ing] ~ : \"대안들을 분명하게 이용할 수 있도록 유지하면서\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"In many cases, 많은 경우. the most responsible approach is, 가장 책임 있는 접근 방법은 ~이다. to make, 만드는 것. the lower‐impact option, (환경에 미치는) 영향이 더 적은 선택지를. the default, 기본값으로. while keeping alternatives, 대안들을 유지하면서. clearly available, 분명하게 이용할 수 있도록.. 이 문장 전체를 해석하면, 많은 경우, 가장 책임 있는 접근 방법은 대안들을 분명하게 이용할 수 있도록 유지하면서 (환경에 미치는) 영향이 더 적은 선택지를 기본값으로 만드는 것이다.","hl":"m"},{"n":46,"text":"이 문장은 책임 있는 디자인의 구체적 방법을 제시합니다. 환경 영향을 줄이려면 영향이 적은 선택지를 기본값으로 만들고, 다른 선택지도 분명하게 이용할 수 있게 남겨 두라는 거죠. 이렇게 하면 사용자의 선택권을 빼앗지 않으면서도 환경 부담을 줄일 수 있다는 논리입니다.","hl":"mn"},{"n":47,"text":"첫 번째, to make the lower impact option the default는 to부정사가 be동사 뒤에서 주격 보어로 쓰여서 접근 방법은 무엇이다라는 뜻을 나타냅니다. 두 번째, make는 목적어 the lower impact option과 목적격보어 the default를 취하는 5형식 구조예요. 세 번째, while keeping alternatives clearly available은 while에 현재분사 keeping이 붙은 분사구문으로, 주절과 동시에 일어나는 상황을 나타냅니다. 앞에서 설명한 세 가지 어법이 모두 서술형에 자주 나오는 포인트입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기본값들은 영향력이 크고,\u003c/span>\u003cspan class=\"en\">Defaults are powerful,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 신중하게 선택될 경우,\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">chosen \u003c/span>\u003cspan class=\"tgt\">carefully\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 환경적 영향을 줄일 수 있다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">reduce\u003c/span> environmental impact\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용자 주체성을 없애지 않으면서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">removing \u003c/span>\u003cspan class=\"tgt\">user \u003c/span>\u003cspan class=\"tgt\">agency\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기본값들은 영향력이 크고, 신중하게 선택될 경우 그것들은 사용자 주체성을 없애지 않으면서 환경적 영향을 줄일 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 13번 문장은 글 전체의 결론으로, 기본값이 강력하지만 신중하게 설정하면 사용자의 선택권을 빼앗지 않으면서도 환경 부담을 줄일 수 있다는 주장을 정리합니다. 앞 문장에서 제안한 '낮은 영향 옵션을 기본값으로'라는 방법의 효과를 강조하며, \u003cb class=\"key\">기본값\u003c/b>은 사람들의 행동을 바꾸는 힘이 크므로 \u003cb class=\"key\">사용자 \u003c/b>\u003cb class=\"key\">주체성\u003c/b>을 보호하는 방향으로 사용해야 한다는 메시지를 담고 있습니다. \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 줄이는 것과 사용자의 자율성을 유지하는 것이 서로 배치되지 않는다는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when + 과거분사 (부사절 축약)\u003c/span> : [when] + [chosen (과거분사)] (When they are chosen carefully의 축약) : \"신중하게 선택될 경우\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : [can] + [reduce (동사원형)] : \"줄일 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 without + 동명사(구)\u003c/span> : [without] + [removing (동명사구)] : \"사용자 주체성을 없애지 않으면서\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Defaults are powerful, 기본값들은 영향력이 크고. and when chosen carefully, 그리고 신중하게 선택될 경우. they can reduce environmental impact, 그것들은 환경적 영향을 줄일 수 있다. without removing user agency, 사용자 주체성을 없애지 않으면서.. 이 문장 전체를 해석하면, 기본값들은 영향력이 크고, 신중하게 선택될 경우 그것들은 사용자 주체성을 없애지 않으면서 환경적 영향을 줄일 수 있다.","hl":"m"},{"n":49,"text":"이 문장은 글 전체의 결론이에요. 기본값은 강력하지만, 신중하게 선택하면 사용자 주체성을 없애지 않으면서 환경적 영향을 줄일 수 있다는 핵심 주장을 정리합니다. 앞 문장에서 낮은 영향 옵션을 기본값으로 하라는 제안을 다시 한번 힘 있게 마무리한 것이죠.","hl":"mn"},{"n":50,"text":"어법 포인트를 짚어 볼게요. 첫 번째로 when chosen carefully는 원래 when they are chosen carefully에서 주어와 be동사가 생략된 형태입니다. chosen이 과거분사라서 수동의 의미, 즉 선택된다는 뜻이에요. 두 번째로 can reduce는 조동사 can 뒤에 동사원형 reduce가 와서 줄일 수 있다는 가능성을 나타냅니다. 세 번째로 without removing user agency는 without이 전치사라서 뒤에 동명사 removing이 왔고, 사용자 주체성을 없애지 않으면서라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">무한 \u003c/b>\u003cb class=\"key\">스크롤\u003c/b>과 \u003cb class=\"key\">자동 \u003c/b>\u003cb class=\"key\">재생\u003c/b> 같은 패턴은 사용자 통제를 방해하고 \u003cb class=\"key\">데이터\u003c/b>와 \u003cb class=\"key\">주의력\u003c/b>의 과잉 소비를 부추긴다.\u003c/li>\u003cli>음악 스트리밍 플랫폼이 \u003cb class=\"key\">앨범 \u003c/b>\u003cb class=\"key\">표지\u003c/b>를 \u003cb class=\"key\">영상 \u003c/b>\u003cb class=\"key\">루프\u003c/b>로 대체한 사례는 기본값이 자원 소비를 키우는 것을 보여 준다.\u003c/li>\u003cli>모든 \u003cb class=\"key\">웹 \u003c/b>\u003cb class=\"key\">디자인\u003c/b>은 행동을 유도하지만, 윤리적 기준은 \u003cb class=\"key\">투명성\u003c/b>, \u003cb class=\"key\">되돌릴 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있음\u003c/b>, 사용자 이익과의 \u003cb class=\"key\">일치\u003c/b>이다.\u003c/li>\u003cli>\u003cb class=\"key\">영향이 \u003c/b>\u003cb class=\"key\">적은 \u003c/b>\u003cb class=\"key\">옵션\u003c/b>을 기본값으로 하면 \u003cb class=\"key\">사용자 \u003c/b>\u003cb class=\"key\">주체성\u003c/b>을 없애지 않고 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 줄일 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Ethical web design should make low-impact options the transparent, reversible default so it can reduce environmental impact without removing user agency.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">무한 \u003c/b>\u003cb class=\"key\">스크롤\u003c/b>과 \u003cb class=\"key\">자동 \u003c/b>\u003cb class=\"key\">재생\u003c/b> 같은 \u003cb class=\"key\">웹 \u003c/b>\u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>은 사용자 통제를 방해하고 \u003cb class=\"key\">데이터\u003c/b>와 \u003cb class=\"key\">주의력\u003c/b>의 과잉 소비를 부추긴다. 따라서 윤리적 설계는 \u003cb class=\"key\">투명하고 \u003c/b>\u003cb class=\"key\">되돌릴 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있으며\u003c/b> 사용자 이익에 부합해야 하고, \u003cb class=\"key\">영향이 \u003c/b>\u003cb class=\"key\">적은 \u003c/b>\u003cb class=\"key\">옵션\u003c/b>을 \u003cb class=\"key\">기본값\u003c/b>으로 하여 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 줄이면서 \u003cb class=\"key\">사용자 \u003c/b>\u003cb class=\"key\">주체성\u003c/b>은 유지해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 정리하면, 이 지문은 웹 디자인의 기본값이 사용자 통제와 환경에 미치는 영향을 다룬 문제 해결형 글이었어요. 문제가 되는 과잉 유도 패턴과 책임 있는 저영향 기본값을 대조하면서, 투명성과 되돌릴 수 있음, 사용자 이익을 기준으로 삼아야 한다고 했죠. 영향이 적은 옵션을 기본값으로 하되 선택은 열어 두는 것이 핵심이에요. 오늘도 수고 많았고 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
