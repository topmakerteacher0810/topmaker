  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 18번","audioDir":"18_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">18번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Request for Company Support for Digital Marketing Training\u003c/h1>\u003ch2>디지털 마케팅 연수 비용 지원 요청\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Karen Whitfield는 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">보조원\u003c/b>으로서 부서에 더 기여하기 위해 \u003cb class=\"key\">추가적인 \u003c/b>\u003cb class=\"key\">연수\u003c/b>를 받고 싶어 하며, 회사가 \u003cb class=\"key\">연수 \u003c/b>\u003cb class=\"key\">비용의 \u003c/b>\u003cb class=\"key\">일부\u003c/b>를 지원해 줄 것을 요청한다. 그녀는 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">전략\u003c/b>에 초점을 맞춘 Smart Growth Training의 2주 과정이 \u003cb class=\"key\">현재 \u003c/b>\u003cb class=\"key\">업무\u003c/b>에 도움이 될 것이라고 믿는다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Karen Whitfield requests that the company cover part of the cost for a two-week digital marketing training course to better attract potential customers online.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 살펴볼 지문은 Karen Whitfield가 Ms. Palmer에게 보내는 이메일입니다. 마케팅 보조원인 Karen이 디지털 마케팅 연수 비용 일부를 회사에서 지원해 달라고 요청하는 글이에요. 요약하면, 부서가 온라인에서 잠재 고객을 더 잘 끌어들일 필요가 있다는 점을 근거로 Smart Growth Training의 이 주 과정을 제시하며 긍정적인 검토를 부탁하는 내용이죠. 요지는 회사가 연수 비용 일부를 지원해 달라는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">회사에서 직원이 업무 능력을 키우기 위해 연수를 받을 때 비용을 회사가 일부 지원하는 경우가 많다. 이것을 \u003cb class=\"key\">training \u003c/b>\u003cb class=\"key\">expense \u003c/b>\u003cb class=\"key\">support\u003c/b>라고 한다. 특히 온라인으로 고객을 끌어들이는 일은 \u003cb class=\"key\">digital \u003c/b>\u003cb class=\"key\">marketing\u003c/b>이라고 하며, \u003cb class=\"key\">potential \u003c/b>\u003cb class=\"key\">customer\u003c/b>에게 제품을 알리는 전략이 중요하다. 일상생활에 비유하면, 운동선수가 더 좋은 성적을 위해 개인 코치를 받을 때 팀에서 비용을 일부 대주는 것과 비슷하다. 이 글의 Karen은 부서가 온라인에서 고객을 더 잘 끌어들일 필요가 있다고 보고, 그 해결책으로 연수 비용 지원을 요청하는 이메일을 보낸다.\u003c/div>","segs":[{"n":2,"text":"회사에서는 직원이 업무 능력을 키우기 위해 연수를 받을 때 비용 일부를 지원하는 경우가 많아요. 이걸 training expense support라고 하죠. 특히 디지털 마케팅은 온라인에서 잠재 고객, 즉 potential customer를 끌어들이는 전략이 중요해요. 예를 들어 운동선수가 더 좋은 성적을 위해 개인 코치를 받을 때 팀에서 비용을 일부 대주는 것과 비슷하죠. Karen은 부서가 온라인에서 고객을 더 잘 끌어들일 필요가 있다고 보고, 그 해결책으로 연수를 요청하는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>자기소개와 연수 목적\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>Karen Whitfield는 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">보조원\u003c/b>이며, 부서에 더 기여하려는 노력의 일환으로 \u003cb class=\"key\">추가적인 \u003c/b>\u003cb class=\"key\">연수\u003c/b>를 받고 싶다고 밝힌다. 이는 단순한 인사가 아니라 요청의 배경을 먼저 제시하는 도입이다. 자신의 소속과 직책을 밝히며 글의 목적을 예고한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문제 발견과 지원 요청\u003csmall>문제 제기 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>지난 분기 동안 부서가 \u003cb class=\"key\">잠재 \u003c/b>\u003cb class=\"key\">고객\u003c/b>을 온라인에서 더 잘 끌어들일 필요가 있다는 것을 알아차렸다. 이 문제를 해결하기 위해 회사가 \u003cb class=\"key\">연수 \u003c/b>\u003cb class=\"key\">비용의 \u003c/b>\u003cb class=\"key\">일부\u003c/b>를 지원해 달라고 요청한다. 즉, 필요를 근거로 들어 요청을 하는 전개이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>구체적 연수 과정 제시\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>최근 연수 과정을 검색하여 \u003cb class=\"key\">Smart \u003c/b>\u003cb class=\"key\">Growth \u003c/b>\u003cb class=\"key\">Training\u003c/b>의 2주 과정을 찾았고, 이는 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">전략\u003c/b>에 초점을 맞춘다. 비용은 $1,600이며 \u003cb class=\"key\">현재 \u003c/b>\u003cb class=\"key\">업무\u003c/b>에 도움이 될 것이라고 강하게 믿는다. 이는 요청을 뒷받침하는 구체적 근거이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>긍정적 검토 요청과 맺음\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>마지막으로 자신의 요청을 \u003cb class=\"key\">긍정적으로 \u003c/b>\u003cb class=\"key\">고려\u003c/b>해 달라고 부탁하고, 공손한 인사로 편지를 마무리한다. 이는 상대방에게 부담을 주지 않는 정중한 요청의 전형적 마무리이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 크게 네 단계로 흐름이 이어집니다. 첫 단계는 자기소개와 연수 목적, 두 번째는 문제 발견과 지원 요청, 세 번째는 구체적 연수 과정 제시, 네 번째는 긍정적 검토 요청과 맺음이에요.","hl":null},{"n":4,"text":"첫 번째 단계는 자기소개와 연수 목적입니다. Karen Whitfield는 마케팅 부서의 마케팅 보조원이고, 부서에 더 많이 기여하기 위해 추가적인 연수를 받고 싶다고 밝혀요. 이 부분은 단순한 인사가 아니라 요청 배경을 먼저 깔아 주는 도입이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 문제 발견과 지원 요청입니다. 지난 분기 동안 부서가 제품의 잠재 고객을 온라인에서 더 잘 끌어들일 필요가 있다는 것을 알아차렸다고 해요. 그래서 이 문제를 해결하려고 회사가 연수 비용의 일부를 지원해 달라고 요청하죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 구체적 연수 과정 제시입니다. 최근에 연수 과정을 검색해서 Smart Growth Training의 이 주 과정을 찾았는데, 이 과정은 디지털 마케팅 전략에 초점을 맞추고 있어요. 비용은 천육백 달러이고, Karen은 현재 업무에 도움이 될 것이라고 강하게 믿는다고 말합니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 긍정적 검토 요청과 맺음입니다. 마지막으로 자신의 요청을 긍정적으로 고려해 달라고 부탁하고, 공손한 인사로 편지를 마무리해요. 이렇게 요청 편지의 전형적인 흐름을 따르고 있죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 부서가 \u003cb class=\"key\">잠재 \u003c/b>\u003cb class=\"key\">고객\u003c/b>을 온라인에서 더 잘 끌어들여야 한다는 문제를 제기하고, 그 해결책으로 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">마케팅\u003c/b> 연수 비용 지원을 요청하는 \u003cb class=\"key\">문제-해결\u003c/b> 구조이다. 앞부분의 두 번째 문장에서 \u003cb class=\"key\">추가적인 \u003c/b>\u003cb class=\"key\">연수\u003c/b>를 받고 싶다는 목적을 먼저 밝히므로 \u003cb class=\"key\">두괄식\u003c/b>에 해당한다. 따라서 주제문은 두 번째 문장으로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>As part of (2)\u003c/b>\u003cspan>목적 제시\u003c/span>\u003cb>For this reason (4)\u003c/b>\u003cspan>원인·결과\u003c/span>\u003cb>strongly believe (6)\u003c/b>\u003cspan>주장 강조\u003c/span>\u003cb>I hope (7)\u003c/b>\u003cspan>기대·요청\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">additional training\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">my training cost\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">training courses\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Smart Growth Training's twoweek course\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제 해결 구조로 볼 수 있어요. 부서가 온라인에서 잠재 고객을 더 잘 끌어들여야 한다는 문제를 제기하고, 그 해결책으로 디지털 마케팅 연수 비용 지원을 요청하죠. 그리고 두괄식 구조라서 앞부분의 두 번째 문장에서 연수를 받고 싶다는 목적을 먼저 밝힌 뒤, 뒤에서 근거를 제시해요. 따라서 주제문은 두 번째 문장이에요.","hl":"ty"},{"n":9,"text":"이 글에는 신호어가 몇 개 있어요. 두 번째 문장의 As part of는 목적을 제시하고, 네 번째 문장의 For this reason은 앞의 문제를 원인으로 요청을 이끌어 내는 역할을 해요. 여섯 번째 문장의 strongly believe는 주장을 강조하죠. 그리고 일곱 번째 문장의 I hope는 기대와 요청을 나타내요. 또한 additional training, training cost, training courses, twoweek course, it처럼 같은 훈련 과정을 여러 표현으로 바꿔 말한 것도 눈여겨봐야 해요. 이 지문에는 뚜렷한 대조 구도는 보이지 않아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Dear\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친애하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>marketing assistant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마케팅 보조원\u003c/span>\u003c/div>\u003cdiv>\u003cb>marketing department\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마케팅 부서\u003c/span>\u003c/div>\u003cdiv>\u003cb>As part of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 일환으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>contribute\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>additional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>추가적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>training\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연수, 훈련\u003c/span>\u003c/div>\u003cdiv>\u003cb>further\u003c/b>\u003cem>부사\u003c/em>\u003cspan>더욱, 더 멀리\u003c/span>\u003c/div>\u003cdiv>\u003cb>develop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발전시키다, 개발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>skills\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력, 기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>last quarter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지난 분기\u003c/span>\u003c/div>\u003cdiv>\u003cb>noticed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아차렸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attract\u003c/b>\u003cem>동사\u003c/em>\u003cspan>끌어들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>potential customers\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잠재 고객\u003c/span>\u003c/div>\u003cdiv>\u003cb>products\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제품\u003c/span>\u003c/div>\u003cdiv>\u003cb>online\u003c/b>\u003cem>부사\u003c/em>\u003cspan>온라인에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>For this reason\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이러한 이유로\u003c/span>\u003c/div>\u003cdiv>\u003cb>request\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요청하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부담하다, 충당하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cost\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비용\u003c/span>\u003c/div>\u003cdiv>\u003cb>recently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>최근에\u003c/span>\u003c/div>\u003cdiv>\u003cb>searched\u003c/b>\u003cem>동사\u003c/em>\u003cspan>검색했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>focuses on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 초점을 맞추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>digital marketing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디지털 마케팅\u003c/span>\u003c/div>\u003cdiv>\u003cb>strategies\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전략\u003c/span>\u003c/div>\u003cdiv>\u003cb>strongly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>강하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>helpful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>도움이 되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>current\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>현재의\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고려하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요 단어를 짚어 볼게요. contribute는 기여하다, additional는 추가적인, training은 연수, attract는 끌어들이다, potential customers는 잠재 고객, For this reason은 이러한 이유로, request는 요청하다, cover는 부담하다, cost는 비용, focuses on은 초점을 맞추다, strongly는 강하게, current는 현재의, positively는 긍정적으로예요. 이 단어들이 이메일의 요청과 근거를 이해하는 핵심이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">request\u003c/b>\u003cspan class=\"m\">요청하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ask\u003c/span>\u003cspan class=\"s\">seek\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contribute\u003c/b>\u003cspan class=\"m\">기여하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">add\u003c/span>\u003cspan class=\"s\">provide\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">subtract\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">attract\u003c/b>\u003cspan class=\"m\">끌어들이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">draw\u003c/span>\u003cspan class=\"s\">lure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repel\u003c/span>\u003cspan class=\"a\">deter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">potential\u003c/b>\u003cspan class=\"m\">잠재적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">possible\u003c/span>\u003cspan class=\"s\">likely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">actual\u003c/span>\u003cspan class=\"a\">existing\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">helpful\u003c/b>\u003cspan class=\"m\">도움이 되는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">useful\u003c/span>\u003cspan class=\"s\">beneficial\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003cspan class=\"a\">harmful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">current\u003c/b>\u003cspan class=\"m\">현재의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">present\u003c/span>\u003cspan class=\"s\">existing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">past\u003c/span>\u003cspan class=\"a\">future\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">positively\u003c/b>\u003cspan class=\"m\">긍정적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">favorably\u003c/span>\u003cspan class=\"s\">approvingly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">negatively\u003c/span>\u003cspan class=\"a\">unfavorably\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 동의어와 반의어를 정리해 볼게요. request는 ask, seek과 비슷하고 refuse, deny와 반대예요. contribute는 add, provide와 비슷하고 subtract, withhold와 반대가 되죠. attract는 draw, lure와 비슷하고 repel, deter와 반대예요. potential은 possible, likely와 비슷하고 actual, existing과 반대입니다. helpful은 useful, beneficial과 비슷하고 useless, harmful과 반대예요. current는 present, existing과 비슷하고 past, future와 반대이며, positively는 favorably, approvingly와 비슷하고 negatively, unfavorably와 반대예요. 이렇게 묶어서 외우면 어휘 문제에서 빠르게 답을 찾을 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Ms. Palmer 귀하,\u003c/span>\u003cspan class=\"en\">Dear Ms. Palmer,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 이름은 K 나오면서 Karen Whitfield를 보충 설명하는 동격 표현입니다.","hl":"mn"},{"n":14,"text":"어법 포인트를 짚어 볼게요. 먼저 a marketing assistant는 Karen Whitfield를 보충 설명하는 동격 명사구예요. 콤마 뒤에 나와서 앞에 있는 이름과 같은 대상을 가리키죠. 그 다음 in the marketing department는 a marketing assistant를 뒤에서 꾸며 주는 전치사구입니다. 어떤 부서 소속인지 알려 주는 형용사적 수식이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 노력의 일환으로서\u003c/span>\u003cspan class=\"en\">As part of my efforts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부서에 더 많이 기여하기 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">contribute \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">department\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 받고 싶습니다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">receive\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">추가적인 연수를\u003c/span>\u003cspan class=\"en\">additional training\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 능력을 더욱 향상시키기 위해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">further \u003c/span>\u003cspan class=\"tgt\">develop \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">skills\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">부서에 더 많이 기여하기 위한 제 노력의 일환으로서, 저는 제 능력을 더욱 향상시키기 위해 추가적인 연수를 받고 싶습니다.\u003c/div>\u003c/div>\u003cd 에 있는 과정을 꾸며 주는 관계대명사 절이에요.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 have recently searched예요. have에 과거분사 searched가 와서 현재완료를 만드는데, 최근에 했다는 경험을 강조합니다. 두 번째 어법 포인트는 that focuses on digital marketing strategies인데, that이 앞의 course를 받아 주고 focuses의 주어 역할을 하는 주격 관계대명사예요. 선행사가 사물이라 that을 쓸 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 1,600달러의 비용이 들며,\u003c/span>\u003cspan class=\"en\">It costs $1,600,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 저는 강하게 믿습니다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">strongly \u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 도움이 될 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">helpful\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저의 현재 업무에.\u003c/span>\u003cspan class=\"en\">for my current work.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 1,600달러의 비용이 들며, 저는 그것이 저의 현재 업무에 도움이 될 것이라고 강하게 믿습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 연수 과정의 가격이 1,600달러라는 사실과, 그것이 현재 업무에 도움이 될 것이라는 확신을 함께 전달합니다. would be helpful은 단순한 미래가 아니라 정중한 \u003cb class=\"key\">추측\u003c/b>과 가능성을 나타내, 자신의 판단을 부드럽게 표현합니다. 요청에 대한 기대 효과를 강조하는 뒷받침 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적절을 이끄는 that의 생략\u003c/span> : believe + (that) + 완전한 절 : \"그것이 도움이 될 것이라고 강하게 믿습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 would의 정중한 추측·가능성\u003c/span> : 주어 + would + 동사원형 : \"그것이 도움이 될 것이라고\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It costs $1,600, 그것은 1,600달러의 비용이 들며. and I strongly believe, 그리고 저는 강하게 믿습니다. it would be helpful, 그것이 도움이 될 것이라고. for my current work, 저의 현재 업무에.. 이 문장 전체를 해석하면, 그것은 1,600달러의 비용이 들며, 저는 그것이 저의 현재 업무에 도움이 될 것이라고 강하게 믿습니다.","hl":"m"},{"n":28,"text":"이 문장은 과정의 가격이 천육백 달러라는 사실과 그 과정이 현재 업무에 도움이 될 것이라는 강한 확신을 나타내요. would be helpful에서 would는 단순한 미래가 아니라 조심스럽고 정중한 추측을 나타내서, 내 판단을 부드럽게 전달해 줍니다.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 I strongly believe 뒤에 that이 생략된 거예요. believe it would be helpful에서 believe와 it 사이에 목적어를 이끄는 접속사 that이 생략됐다고 볼 수 있죠. 두 번째 어법 포인트는 would의 쓰임인데, 여기서 would는 will의 과거가 아니라 조심스러운 추측이나 가능성을 나타내요. 그래서 도움이 될 것이라는 말을 정중하게 표현하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 바랍니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">hope\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">귀하께서 고려해 주실 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">consider\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 요청을\u003c/span>\u003cspan class=\"en\">my request\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긍정적으로.\u003c/span>\u003cspan class=\"en\">positively.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 귀하께서 제 요청을 긍정적으로 고려해 주기를 바랍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 마지막 본문에서 자신의 \u003cb class=\"key\">요청\u003c/b>을 \u003cb class=\"key\">긍정적으로\u003c/b> 고려해 달라고 정중하게 바라는 역할을 합니다. \u003cb class=\"key\">hope\u003c/b>는 뒤에 that절을 이끌어 '~하기를 바라다'라는 뜻을 나타내며, 여기서는 that이 생략되었습니다. 공식적인 이메일에서 예의를 갖춰 요청을 마무리하는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 hope + (that) 명사절\u003c/span> : hope [(that) + 주어 + 동사] : \"저는 ...하기를 바랍니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 will\u003c/span> : 주어 + will + 동사원형 : \"귀하께서 고려해 주실 것이다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"I hope, 저는 바랍니다. you will consider, 귀하께서 고려해 주실 것을. my request, 제 요청을. positively, 긍정적으로.. 이 문장 전체를 해석하면, 저는 귀하께서 제 요청을 긍정적으로 고려해 주기를 바랍니다.","hl":"m"},{"n":31,"text":"이 문장은 편지의 마지막 본문에서 자신의 요청을 긍정적으로 고려해 달라고 정중하게 바라는 역할을 해요. hope가 that절을 이끌어서 바람을 나타내고, that은 생략되어 있어요. 공식적인 이메일에서 예의를 갖춰 요청을 마무리하는 표현이에요.","hl":"mn"},{"n":32,"text":"첫 번째, I hope 뒤에는 that절 목적어가 와요. that은 생략되어서 you will consider 이하가 hope의 목적어가 됩니다. hope는 바라다라는 뜻이고요. 두 번째, will consider에서 will은 조동사이고 뒤에 동사원형 consider가 와요. 귀하께서 앞으로 고려해 주실 것이라는 미래 의미를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진심으로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Sincerely,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Karen Whitfield\u003c/span>\u003cspan class=\"en\">Karen Whitfield\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Palmer 씨\u003c/span>\u003cspan class=\"en\">Ms. Palmer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">귀하\u003c/span>\u003cspan class=\"en\">귀하\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Karen Whitfield 드림\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지의 끝인사와 서명, 받는 사람 표기로 구성된 형식적인 마무리입니다. \u003cb class=\"key\">Sincerely\u003c/b>는 '진심으로, 드림'이라는 뜻의 \u003cb class=\"key\">편지 \u003c/b>\u003cb class=\"key\">끝인사\u003c/b>이고, 뒤에 보내는 사람 Karen Whitfield와 받는 사람 Ms. Palmer에 대한 존칭 표현이 이어집니다. 글 전체의 형식을 완성하며 공손한 어조를 유지하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">편지 끝인사 (complimentary close)\u003c/span> : [Sincerely,] + [서명] : \"진심으로, ... 드림\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Sincerely, 진심으로. Karen Whitfield, Karen Whitfield. Ms. Palmer, Palmer 씨. 귀하, 귀하. 이 문장 전체를 해석하면, Karen Whitfield 드림","hl":"m"},{"n":34,"text":"이 문장은 편지의 끝인사와 서명, 받는 사람 표기로 구성된 형식적인 마무리예요. Sincerely는 진심으로 또는 드림이라는 뜻의 편지 끝인사이고, 뒤에 보내는 사람 Karen Whitfield와 받는 사람 Ms. Palmer에 대한 존칭 표현이 이어져요. 글 전체의 형식을 완성하면서 공손한 어조를 유지해요.","hl":"mn"},{"n":35,"text":"첫 번째, Sincerely는 공식 편지에서 정중하게 마무리하는 관용 표현이에요. 뒤에 쉼표를 찍고 줄을 바꿔 이름을 쓰는 형식이죠. 여기서는 Karen Whitfield가 보내는 사람이고, Ms. Palmer 귀하가 받는 사람을 나타내요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Karen Whitfield는 마케팅 부서의 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">보조원\u003c/b>으로서 부서에 더 많이 기여하고자 한다.\u003c/li>\u003cli>지난 분기 동안 부서가 제품의 \u003cb class=\"key\">잠재 \u003c/b>\u003cb class=\"key\">고객\u003c/b>을 온라인에서 더 잘 끌어들일 필요가 있음을 발견했다.\u003c/li>\u003cli>따라서 회사에 \u003cb class=\"key\">연수 \u003c/b>\u003cb class=\"key\">비용의 \u003c/b>\u003cb class=\"key\">일부\u003c/b> 지원을 요청하며, \u003cb class=\"key\">Smart \u003c/b>\u003cb class=\"key\">Growth \u003c/b>\u003cb class=\"key\">Training\u003c/b>의 디지털 마케팅 2주 과정을 제시한다.\u003c/li>\u003cli>그 과정은 $1,600이며 \u003cb class=\"key\">현재 \u003c/b>\u003cb class=\"key\">업무\u003c/b>에 도움이 될 것이라고 강하게 믿으며 긍정적 검토를 부탁한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Karen Whitfield requests that the company cover part of the cost for a two-week digital marketing training course to better attract potential customers online.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Karen Whitfield는 \u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">보조원\u003c/b>으로서 부서에 더 기여하기 위해 \u003cb class=\"key\">추가적인 \u003c/b>\u003cb class=\"key\">연수\u003c/b>를 받고 싶어 하며, 회사가 \u003cb class=\"key\">연수 \u003c/b>\u003cb class=\"key\">비용의 \u003c/b>\u003cb class=\"key\">일부\u003c/b>를 지원해 줄 것을 요청한다. 그녀는 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">마케팅 \u003c/b>\u003cb class=\"key\">전략\u003c/b>에 초점을 맞춘 Smart Growth Training의 2주 과정이 \u003cb class=\"key\">현재 \u003c/b>\u003cb class=\"key\">업무\u003c/b>에 도움이 될 것이라고 믿는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 정리하면, Karen Whitfield는 마케팅 보조원으로서 디지털 마케팅 연수를 받고 싶어 하고, 부서가 온라인에서 잠재 고객을 더 잘 끌어들일 필요가 있다는 문제를 근거로 회사에 연수 비용 일부 지원을 요청했어요. Smart Growth Training의 이 주 과정을 구체적으로 제시하며 현재 업무에 도움이 될 것이라고 강조했고, 긍정적인 검토를 부탁하며 마무리했죠. 이런 요청 이메일은 목적, 근거, 구체적 방안, 정중한 마무리 순서를 기억하면 됩니다. 오늘 강의는 여기까지예요.","hl":null}]}]});</script></body></html>
