@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 37번","audioDir":"37_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">37번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Seamless Communication and Artificial Seams in Remote Collaboration\u003c/h1>\u003ch2>원격 협업에서 생기는 인위적 갈라진 틈\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 대면 협업에서는 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">공간\u003c/b>의 부분 집합이라 \u003cb class=\"key\">갈라진 \u003c/b>\u003cb class=\"key\">틈이 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">의사소통\u003c/b>이 이루어지지만, 원격 작업에서는 두 공간이 분리되어 \u003cb class=\"key\">인위적인 \u003c/b>\u003cb class=\"key\">갈라진 \u003c/b>\u003cb class=\"key\">틈\u003c/b>이 생긴다. 따라서 원격 의사소통 기술의 영향은 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">모델\u003c/b>로 예측해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Remote communication creates an artificial seam between task space and communication space, so its impact must be predicted through communication models.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 원격 협업에서 의사소통 공간과 작업 공간이 어떻게 달라지는지를 다룬 지문을 함께 볼게요. 이 글은 대면 협업에서는 두 공간이 자연스럽게 겹치지만, 원격 협업에서는 인위적인 갈라진 틈이 생긴다는 내용입니다. 그래서 원격 의사소통 기술의 영향을 의사소통 모델로 예측해야 한다는 게 요지입니다. 지문 속 흐름을 따라가며 핵심 표현을 확인해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 같은 공간에서 모둠 과제를 할 때는 말뿐 아니라 표정, 손짓, 시선 같은 비언어적 단서를 동시에 확인할 수 있어요. 이때 실제 과제가 이루어지는 곳을 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b> task space, 말과 몸짓이 오가는 곳을 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">공간\u003c/b> communication space라고 합니다. 대면 상황에서는 작업 공간이 의사소통 공간 안에 자연스럽게 들어와서 갈라진 틈이 없는 seamless communication이 됩니다. 반면 원격 화상 회의나 온라인 협업에서는 문서 화면과 상대방 얼굴 화면이 분리되면서 \u003cb class=\"key\">인위적인 \u003c/b>\u003cb class=\"key\">갈라진 \u003c/b>\u003cb class=\"key\">틈\u003c/b> artificial seam이 생기기 쉽습니다. 이것은 친구의 표정을 보려면 과제 화면에서 눈을 떼야 하는 상황과 비슷합니다. 따라서 원격 기술이 의사소통에 미치는 영향을 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">모델\u003c/b> communication model로 미리 예측하는 것이 중요합니다.\u003c/div>","segs":[{"n":2,"text":"우리가 같은 공간에서 모둠 과제를 할 때는 친구의 표정과 손짓, 말투 같은 비언어적 단서를 자연스럽게 보면서 자료도 함께 볼 수 있어요. 이때 실제 과제가 이루어지는 곳을 task space, 말과 몸짓이 오가는 곳을 communication space라고 합니다. 대면 상황에서는 task space가 communication space 안에 들어와서 seamless communication이 됩니다. 그런데 화상 회의나 온라인 협업에서는 문서 화면과 상대방 얼굴 화면이 분리되면서 artificial seam이 생기기 쉽죠. 이것은 친구의 표정을 보려면 과제 화면에서 눈을 떼야 하는 상황과 비슷합니다. 그래서 원격 기술의 영향을 communication model로 미리 예측하는 것이 중요해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>대면 협업의 공간 일치\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>대면 협업에서는 사람들이 서로와 다양한 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">단서\u003c/b>를 쉽게 볼 수 있어 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">공간\u003c/b>의 \u003cb class=\"key\">부분 \u003c/b>\u003cb class=\"key\">집합\u003c/b>이 됩니다. Ishii는 작업과 의사소통 사이에 \u003cb class=\"key\">기능적 \u003c/b>\u003cb class=\"key\">분리\u003c/b>가 없어 \u003cb class=\"key\">갈라진 \u003c/b>\u003cb class=\"key\">틈이 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">의사소통\u003c/b>이라고 묘사합니다. 즉, 함께 있는 공간에서는 과제와 소통이 자연스럽게 겹칩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>원격 작업의 공간 분리\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>하지만 원격으로 작업하면 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">공간\u003c/b>으로부터 분리됩니다. 대면 상황과 달리 두 공간이 한곳에 있지 않게 되는 것이죠. 이 문장은 However로 방향을 전환합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>화상 회의의 갈라진 틈\u003csmall>예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>예를 들어 화상 회의를 할 때 한 화면에는 협업자의 얼굴을, 다른 화면에는 \u003cb class=\"key\">공유 \u003c/b>\u003cb class=\"key\">문서\u003c/b>를 띄웁니다. 이 경우 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b>을 보면서 동시에 원격 협업자의 많은 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">단서\u003c/b>를 보는 것은 불가능합니다. 이것은 공간이 분리된 구체적 사례입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>인위적 갈라진 틈\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>따라서 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">공간\u003c/b>과 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b> 사이에는 \u003cb class=\"key\">인위적인 \u003c/b>\u003cb class=\"key\">갈라진 \u003c/b>\u003cb class=\"key\">틈\u003c/b>이 존재합니다. 자연스러운 대면 소통과 달리, 원격 기술이 만든 매끄럽지 않은 경계인 셈입니다. So가 결과를 이끌고 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>모델 예측의 필요성\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>이것은 원격 의사소통 기술이 미치는 영향의 한 유형입니다. 따라서 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">모델\u003c/b>을 통해 미리 예측할 필요가 있습니다. 글의 최종 주장으로, 기술 영향을 분석해야 한다는 점을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장 순서에 따라 글의 흐름을 다섯 단계로 짚어 보겠습니다.","hl":null},{"n":4,"text":"첫 번째 단계는 대면 협업에서 공간이 일치하는 모습입니다. 사람들은 서로와 다양한 의사소통 단서를 쉽게 볼 수 있어서 작업 공간이 의사소통 공간의 부분 집합이 됩니다. 이시이 교수는 기능적 분리가 없기 때문에 이것을 갈라진 틈이 없는 의사소통이라고 묘사했어요. 즉, 함께 있는 공간에서는 과제와 소통이 자연스럽게 겹친다는 뜻이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 원격 작업에서 공간이 분리되는 전환입니다. 하지만 원격으로 작업하면 작업 공간이 의사소통 공간으로부터 분리돼요. 대면 상황과 달리 두 공간이 한곳에 있지 않게 되는 것이죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 화상 회의 상황을 예로 든 부분입니다. 한 화면에는 협업자의 얼굴을, 다른 화면에는 공유 문서를 띄우는 경우가 많아요. 이때 작업 공간을 보면서 동시에 원격 협업자의 많은 의사소통 단서를 보는 것은 불가능합니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 그 결과를 정리합니다. 그래서 의사소통 공간과 작업 공간 사이에는 인위적인 갈라진 틈이 존재하게 돼요. 자연스러운 대면 소통과 달리 원격 기술이 만든 매끄럽지 않은 경계인 셈이죠.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 글의 최종 주장입니다. 이런 인위적인 갈라진 틈은 원격 의사소통 기술이 미치는 영향의 한 유형이에요. 따라서 의사소통 모델을 통해 미리 예측할 필요가 있다고 강조합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 대면 협업과 원격 협업을 \u003cb class=\"key\">비교·대조\u003c/b>하면서 끝에서 중심 주장을 제시합니다. 앞부분은 대면에서 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b>과 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 일치하는 모습을, However 이후에는 원격에서 두 공간이 분리되는 모습을 보여 줍니다. 마지막 문장이 '이것은 예측될 필요가 있다'며 글의 주제를 드러내므로 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (3)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>For example (4)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>In this case (5)\u003c/b>\u003cspan>상황 제시\u003c/span>\u003cb>So (6)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>This (7)\u003c/b>\u003cspan>결론 지시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the task space is a subset of the communication space\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">no functional separation between the task and communication space\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the task space is often separated from the communication space\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it is impossible to see many of the remote collaborator's communication cues at the same time as looking at the task space\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an artificial seam between the communication space and task space\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>대면 협업\u003c/th>\u003cth>원격 협업\u003c/th>\u003c/tr>\u003ctr>\u003ctd>작업 공간이 의사소통 공간의 부분 집합\u003c/td>\u003ctd>작업 공간이 의사소통 공간과 분리됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>다양한 의사소통 단서를 동시에 확인 가능\u003c/td>\u003ctd>많은 의사소통 단서를 동시에 확인 불가능\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기능적 분리 없음\u003c/td>\u003ctd>인위적 갈라진 틈 존재\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 대면 협업과 원격 협업을 비교하고 대조하는 구조입니다. 앞부분에서는 대면에서 작업 공간과 의사소통 공간이 일치하는 모습을 보여 주고, However 이후에는 원격에서 두 공간이 분리되는 모습을 보여 줍니다. 마지막 문장에서 중심 주장이 나오므로 전체적으로 미괄식 구조라고 할 수 있어요. 따라서 글을 읽을 때 마지막 문장을 중심으로 앞의 대조를 이해하면 좋습니다.","hl":"ty"},{"n":10,"text":"이 글에는 흐름을 알려 주는 신호어가 여러 개 나옵니다. However는 대면에서 원격으로 방향을 전환하고, For example은 화상 회의 사례를 이끌어요. So는 결과를 정리하면서 인위적인 갈라진 틈을 도출하고, This는 마지막 문장에서 앞의 내용을 가리키며 결론으로 연결합니다. 또한 seamless communication과 artificial seam은 서로 대조되는 표현으로, 대면과 원격의 차이를 재진술하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>collaborate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>협업하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>face to face\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>대면하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>cue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단서\u003c/span>\u003c/div>\u003cdiv>\u003cb>task space\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작업 공간\u003c/span>\u003c/div>\u003cdiv>\u003cb>subset\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부분 집합\u003c/span>\u003c/div>\u003cdiv>\u003cb>communication space\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의사소통 공간\u003c/span>\u003c/div>\u003cdiv>\u003cb>describe A as B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B라고 묘사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>seamless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>갈라진 틈이 없는, 매끄러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>functional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기능적\u003c/span>\u003c/div>\u003cdiv>\u003cb>separation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분리\u003c/span>\u003c/div>\u003cdiv>\u003cb>remotely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>원격으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>separate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>video conferencing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화상 회의\u003c/span>\u003c/div>\u003cdiv>\u003cb>collaborator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>협업자\u003c/span>\u003c/div>\u003cdiv>\u003cb>screen\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화면\u003c/span>\u003c/div>\u003cdiv>\u003cb>shared document\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공유 문서\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the same time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>동시에\u003c/span>\u003c/div>\u003cdiv>\u003cb>impossible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>remote\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>원격의\u003c/span>\u003c/div>\u003cdiv>\u003cb>artificial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인위적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>seam\u003c/b>\u003cem>명사\u003c/em>\u003cspan>갈라진 틈, 솔기\u003c/span>\u003c/div>\u003cdiv>\u003cb>impact\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영향\u003c/span>\u003c/div>\u003cdiv>\u003cb>predict\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예측하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>communication model\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의사소통 모델\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어를 몇 개 확인할게요. task space는 작업 공간, communication space는 의사소통 공간입니다. seamless는 갈라진 틈이 없는이라는 뜻이고, seam은 갈라진 틈이나 솔기라는 뜻이에요. artificial은 인위적인, predict는 예측하다이므로 마지막 문장의 communication model과 함께 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">seamless\u003c/b>\u003cspan class=\"m\">갈라진 틈이 없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">smooth\u003c/span>\u003cspan class=\"s\">continuous\u003c/span>\u003cspan class=\"s\">unbroken\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disconnected\u003c/span>\u003cspan class=\"a\">separated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">separate\u003c/b>\u003cspan class=\"m\">분리된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">divided\u003c/span>\u003cspan class=\"s\">disconnected\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">connected\u003c/span>\u003cspan class=\"a\">unified\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">artificial\u003c/b>\u003cspan class=\"m\">인위적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">man-made\u003c/span>\u003cspan class=\"s\">synthetic\u003c/span>\u003cspan class=\"s\">unnatural\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">natural\u003c/span>\u003cspan class=\"a\">real\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">remote\u003c/b>\u003cspan class=\"m\">원격의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distant\u003c/span>\u003cspan class=\"s\">faraway\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">close\u003c/span>\u003cspan class=\"a\">near\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">impossible\u003c/b>\u003cspan class=\"m\">불가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unattainable\u003c/span>\u003cspan class=\"s\">impracticable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">possible\u003c/span>\u003cspan class=\"a\">feasible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">predict\u003c/b>\u003cspan class=\"m\">예측하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">forecast\u003c/span>\u003cspan class=\"s\">anticipate\u003c/span>\u003cspan class=\"s\">foresee\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"시험에 자주 나오는 핵심 어휘의 동의어와 반의어를 정리해 볼게요. seamless는 smooth나 continuous와 비슷하고 disconnected, separated와 반대이며, separate는 divided나 disconnected와 가깝고 connected, unified와 반대예요. artificial은 man-made나 synthetic과 비슷하고 natural, real과 반대이고, remote는 distant나 faraway와 가깝고 close, near와 반대입니다. impossible은 unattainable이나 impracticable과 비슷하고 possible, feasible과 반대이며, predict는 forecast나 anticipate와 비슷하고 ignore, overlook과 반대입니다. 이 어휘들은 독해와 어휘 문제에서 반복해서 출제되니 소리 내어 함께 읽어 보세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 대면하여 협업하고 있을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">collaborating \u003c/span>\u003cspan class=\"tgt\">face \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">face\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 서로를 쉽게 볼 수 있으며\u003c/span>\u003cspan class=\"en\">they can easily see each other\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 사용되고 있는 다양한 의사소통 단서들의 범위를\u003c/span>\u003cspan class=\"en\">and the range of different \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">communication \u003c/span>\u003cspan class=\"tgt\">cues \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 작업 공간은 부분 집합이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">so\u003c/span> the task space is a subset\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사소통 공간의\u003c/span>\u003cspan class=\"en\">of the communication space.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들이 대면하여 협업하고 있을 때, 그들은 서로를 그리고 사용되고 있는 다양한 의사소통 단서들의 범위를 쉽게 볼 수 있으며, 그래서 작업 공간은 의사소통 공간의 부분 집합이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대면 협업에서는 상대방의 말, 표정, 몸짓 같은 다양한 의사소통 단서를 함께 볼 수 있으므로 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">공간\u003c/b>에 포함됩니다. \u003cb class=\"key\">대면 \u003c/b>\u003cb class=\"key\">협업\u003c/b>의 특징을 정의하며, 뒤에 나올 원격 작업과의 대비 기준을 세우는 첫 문장입니다. 'subset'은 수학의 부분 집합이라는 뜻으로, 작업 공간이 더 넓은 의사소통 공간 안에 들어 있다는 비유입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 부사절 접속사 when\u003c/span> : When + 주어 + 동사, 주절 : \"사람들이 대면하여 협업하고 있을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">being p.p.의 명사 수식 (진행 수동 분사)\u003c/span> : 명사 + being p.p. (~되고 있는) : \"사용되고 있는 의사소통 단서들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">결과를 나타내는 등위접속사 so\u003c/span> : 원인, so 결과 : \"그래서\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"When people are collaborating face to face, 사람들이 대면하여 협업하고 있을 때. they can easily see each other, 그들은 서로를 쉽게 볼 수 있으며. and the range of different communication cues being used, 그리고 사용되고 있는 다양한 의사소통 단서들의 범위를. so the task space is a subset, 그래서 작업 공간은 부분 집합이다. of the communication space, 의사소통 공간의. 이 문장 전체를 해석하면, 사람들이 대면하여 협업하고 있을 때, 그들은 서로를 그리고 사용되고 있는 다양한 의사소통 단서들의 범위를 쉽게 볼 수 있으며, 그래서 작업 공간은 의사소통 공간의 부분 집합이다.","hl":"m"},{"n":14,"text":"대면해서 협업할 때는 상대방의 말이나 표정, 몸짓 같은 의사소통 단서를 자연스럽게 다 볼 수 있어요. 그래서 일이 이루어지는 작업 공간이 의사소통 공간 안에 들어 있는 부분 집합이라는 거죠. 이 문장은 대면 협업의 특징을 정의하면서 뒤에 나올 원격 작업과의 비교 기준을 세워 줍니다.","hl":"mn"},{"n":15,"text":"첫 번째 포인트는 When people are collaborating face to face에서 when이 시간 부사절을 이끈다는 거예요. 주절의 시간적 배경을 나타내고, 우리말로는 사람들이 대면하여 협업하고 있을 때로 해석하죠. 두 번째 포인트는 communication cues being used에서 being used가 앞 명사를 수식하는 진행 수동 분사예요. 사용되고 있는 의사소통 단서들로 해석되고, 명사 communication cues와 수동 관계라서 being p.p.가 됐어요. 세 번째 포인트는 so가 결과를 나타내는 등위접속사라는 거예요. 앞의 원인을 받아서 그래서 뒤의 결과로 연결해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">MIT Media Lab의 교수인 Ishii는\u003c/span>\u003cspan class=\"en\">Ishii, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">professor \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">MIT \u003c/span>\u003cspan class=\"tgt\">Media \u003c/span>\u003cspan class=\"tgt\">Lab\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것을 갈라진 틈이 없는 의사소통이라고 묘사하는데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">describes \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">seamless \u003c/span>\u003cspan class=\"tgt\">communication\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 기능적 분리가 없기 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">functional \u003c/span>\u003cspan class=\"tgt\">separation\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작업 공간과 의사소통 공간 사이에\u003c/span>\u003cspan class=\"en\">between the task and communication space.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">MIT Media Lab의 교수인 Ishii는 이것을 갈라진 틈이 없는 의사소통이라고 묘사하는데, 왜냐하면 작업 공간과 의사소통 공간 사이에 기능적 분리가 없기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Ishii 교수는 대면 협업을 \u003cb class=\"key\">seamless \u003c/b>\u003cb class=\"key\">communication\u003c/b>이라 부릅니다. \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b>과 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">공간\u003c/b> 사이에 기능적 분리가 없어서 틈이 없는 의사소통이 된다는 것입니다. 앞 문장의 상황에 이름을 붙여 주는 역할을 하며, 뒤에 나올 원격 작업의 분리와 대비됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격(명사구 보충 설명)\u003c/span> : 고유명사, [동격 명사구], : \"MIT Media Lab의 교수인 Ishii\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">describe A as B 구문 (A를 B로 묘사하다)\u003c/span> : describe + 목적어 + as + 명사/형용사 : \"이것을 갈라진 틈이 없는 의사소통이라고 묘사하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 부사절 접속사 because\u003c/span> : 주절 + because + 주어 + 동사 : \"왜냐하면 기능적 분리가 없기 때문이다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Ishii, a professor at the MIT Media Lab, MIT Media Lab의 교수인 Ishii는. describes this as seamless communication, 이것을 갈라진 틈이 없는 의사소통이라고 묘사하는데. because there is no functional separation, 왜냐하면 기능적 분리가 없기 때문이다. between the task and communication space, 작업 공간과 의사소통 공간 사이에. 이 문장 전체를 해석하면, MIT Media Lab의 교수인 Ishii는 이것을 갈라진 틈이 없는 의사소통이라고 묘사하는데, 왜냐하면 작업 공간과 의사소통 공간 사이에 기능적 분리가 없기 때문이다.","hl":"m"},{"n":17,"text":"이 문장은 앞에서 말한 대면 협업 상황을 Ishii 교수가 seamless communication이라고 이름 붙인 거예요. 왜냐하면 작업 공간과 의사소통 공간 사이에 기능적 분리가 전혀 없기 때문이죠. 이렇게 대면 상황은 갈라진 틈이 없는 의사소통이라는 개념으로 정리됩니다.","hl":"mn"},{"n":18,"text":"첫 번째 포인트는 a professor at the MIT Media Lab이 동격 명사구라는 거예요. Ishii라는 인물을 보충 설명하는 삽입구로, MIT Media Lab의 교수인 Ishii로 해석하면 자연스럽습니다. 두 번째는 describes this as seamless communication에서 describe A as B 구문이에요. A를 B로 묘사하다라는 뜻으로, this가 앞 문장의 대면 협업 상황을 받아서 seamless communication이라고 묘사하고 있어요. 세 번째는 because가 이끄는 이유 부사절입니다. 왜 seamless communication인지 이유를 설명해 주고, no functional separation이 기능적 분리가 없다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 사람들이 원격으로 작업할 때\u003c/span>\u003cspan class=\"en\">However, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">remotely\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 작업 공간은 흔히 분리된다\u003c/span>\u003cspan class=\"en\">the task space \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">separated\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사소통 공간으로부터\u003c/span>\u003cspan class=\"en\">from the communication space.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 사람들이 원격으로 작업할 때, 그 작업 공간은 흔히 의사소통 공간으로부터 분리된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 원격 작업에서는 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">공간\u003c/b>에서 자주 분리됩니다. 앞 문장의 대면 상황과 대조하며, 뒤에 나올 \u003cb class=\"key\">인공적인 \u003c/b>\u003cb class=\"key\">이음새\u003c/b>의 원인을 예고하는 전환점입니다. 'remotely'는 서로 떨어진 상태를 뜻하므로 통신 기술의 한계가 생길 수밖에 없음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 부사절 접속사 when\u003c/span> : When + 주어 + 동사, 주절 : \"사람들이 원격으로 작업할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be + p.p. : \"흔히 분리된다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"However, when people are working remotely, 그러나 사람들이 원격으로 작업할 때. the task space is often separated, 그 작업 공간은 흔히 분리된다. from the communication space, 의사소통 공간으로부터. 이 문장 전체를 해석하면, 그러나 사람들이 원격으로 작업할 때, 그 작업 공간은 흔히 의사소통 공간으로부터 분리된다.","hl":"m"},{"n":20,"text":"이 문장은 원격으로 작업할 때는 사정이 달라진다는 전환점이에요. 작업 공간이 의사소통 공간으로부터 자주 분리되는 현상이 생기죠. 앞 문장의 대면 협업과 대비되면서, 다음에 나올 원격 의사소통 기술의 문제를 예고합니다.","hl":"mn"},{"n":21,"text":"첫 번째 포인트는 when people are working remotely에서 when이 시간 부사절을 이끈다는 거예요. 사람들이 원격으로 작업할 때라는 시간적 조건을 제시하고, remotely가 원격으로라는 뜻이에요. 두 번째 포인트는 is often separated에서 수동태가 쓰였다는 거예요. 주어인 the task space가 분리되는 대상이기 때문에 be p.p. 형태가 된 겁니다. 해석은 흔히 분리된다로 하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화상 회의를 할 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">video \u003c/span>\u003cspan class=\"tgt\">conferencing\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 협업자의 얼굴을 둘 수 있어요\u003c/span>\u003cspan class=\"en\">people may have the face of their collaborator\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 화면에\u003c/span>\u003cspan class=\"en\">on one screen,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공유 문서를 보면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">looking \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">shared \u003c/span>\u003cspan class=\"tgt\">document\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 화면에서요\u003c/span>\u003cspan class=\"en\">on another.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 화상 회의를 할 때, 사람들은 한 화면에는 협업자의 얼굴을 두고, 동시에 다른 화면에서는 공유 문서를 보고 있을 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화상 회의 상황에서 한 화면에는 협업자의 얼굴, 다른 화면에는 공유 문서가 있어 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">공간\u003c/b>과 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 분리된다는 예시입니다. 특히 상대 표정이나 몸짓 같은 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">단서\u003c/b>가 작업 공간과 같은 화면에 있지 않다는 점을 보여줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절을 이끄는 when + 현재분사 (분사구문)\u003c/span> : when + (주어 + be동사) + ~ing : \"화상 회의를 할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">while + 현재분사 (동시 동작의 분사구문)\u003c/span> : while + (주어 + be동사) + ~ing : \"공유 문서를 보면서\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"For example, 예를 들어. when video conferencing, 화상 회의를 할 때. people may have the face of their collaborator, 사람들은 협업자의 얼굴을 둘 수 있어요. on one screen, 한 화면에. while looking at a shared document, 공유 문서를 보면서. on another, 다른 화면에서요. 이 문장 전체를 해석하면, 예를 들어, 화상 회의를 할 때, 사람들은 한 화면에는 협업자의 얼굴을 두고, 동시에 다른 화면에서는 공유 문서를 보고 있을 수 있다.","hl":"m"},{"n":23,"text":"이 문장은 화상 회의라는 대표적인 예시를 들어요. 한 화면에는 협업자의 얼굴이, 다른 화면에는 공유 문서가 있어서, 의사소통 공간과 작업 공간이 분리되어 있다는 점을 보여줍니다. 앞 문장에서 말한 task space와 communication space의 분리를 구체화하는 예시입니다.","hl":"mn"},{"n":24,"text":"첫 번째 포인트는 when video conferencing이에요. when 뒤에 주어와 be동사가 생략된 분사구문으로, 화상 회의를 할 때라는 뜻입니다. 두 번째 포인트는 while looking at a shared document인데요. while 뒤에서 주어와 be동사가 생략되고 현재분사가 와서, 공유 문서를 보면서라는 동시 동작을 나타내요. when과 while 모두 시간 부사절에서 주어가 주절과 같을 때 생략할 수 있다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 경우,\u003c/span>\u003cspan class=\"en\">In this case,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불가능해요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">impossible \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원격 협업자의 많은 의사소통 단서들을 보는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">see\u003c/span> many of the remote collaborator's communication cues\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동시에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작업 공간을 보는 것과요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">looking \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">task \u003c/span>\u003cspan class=\"tgt\">space\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 경우, 작업 공간을 보는 것과 동시에 원격 협업자의 많은 의사소통 단서들을 보는 것은 불가능하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 경우, 작업 공간을 보면서 동시에 원격 협업자의 의사소통 단서를 보는 것이 불가능함을 서술합니다. 바로 앞 예시에서 드러난 \u003cb class=\"key\">원격 \u003c/b>\u003cb class=\"key\">협업\u003c/b>의 한계를 정리하며, 의사소통 공간과 작업 공간이 \u003cb class=\"key\">단절\u003c/b>됨을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어-진주어 (it ~ to부정사)\u003c/span> : It is impossible + [to see (진주어)] : \"~을 보는 것은 불가능하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">as + 동명사 (동시 상황 표현)\u003c/span> : at the same time as + ~ing : \"작업 공간을 보는 것과 동시에\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"In this case, 이 경우. it is impossible, 불가능해요. to see many of the remote collaborator's communication cues, 원격 협업자의 많은 의사소통 단서들을 보는 것은. at the same time, 동시에. as looking at the task space, 작업 공간을 보는 것과요. 이 문장 전체를 해석하면, 이 경우, 작업 공간을 보는 것과 동시에 원격 협업자의 많은 의사소통 단서들을 보는 것은 불가능하다.","hl":"m"},{"n":26,"text":"이 문장은 앞의 예시에서 드러나는 문제를 정리해요. 작업 공간을 보는 것과 동시에 원격 협업자의 의사소통 단서를 보는 것은 불가능하다는 뜻입니다. 원격 협업에서는 자연스러운 소통이 어렵다는 점을 강조합니다.","hl":"mn"},{"n":27,"text":"첫 번째 포인트는 it is impossible to see 부분이에요. it이 형식적인 주어이고, to see 이하가 진짜 주어인 가주어 진주어 구문입니다. to see 이하가 길기 때문에 뒤로 보내고 it을 주어 자리에 둔 거예요. 두 번째 포인트는 at the same time as looking at the task space인데요. as 뒤에 looking이 와서, 작업 공간을 보는 것과 동시에라는 뜻을 나타냅니다. 보는 것과 동시에라는 해석을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서,\u003c/span>\u003cspan class=\"en\">So,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인위적인 갈라진 틈이 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">artificial \u003c/span>\u003cspan class=\"tgt\">seam\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사소통 공간과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">communication \u003c/span>\u003cspan class=\"tgt\">space \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작업 공간 사이에요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">task \u003c/span>\u003cspan class=\"tgt\">space\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서, 의사소통 공간과 작업 공간 사이에는 인위적인 갈라진 틈이 존재한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그래서 의사소통 공간과 작업 공간 사이에 \u003cb class=\"key\">인위적인 \u003c/b>\u003cb class=\"key\">이음매\u003c/b>가 생긴다는 결론입니다. 얼굴을 맞대고 협업하는 대면 상황의 seamless communication과 대비되는 \u003cb class=\"key\">seam\u003c/b>이라는 표현을 사용했어요. 이 글의 핵심 주장을 압축적으로 정리한 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">There is + 명사 (유도부사/존재 구문)\u003c/span> : There is + [주어(an artificial seam)] : \"인위적인 갈라진 틈이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">between A and B (병렬 구조)\u003c/span> : between + [명사구 A] + and + [명사구 B] : \"의사소통 공간과 작업 공간 사이에\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"So, 그래서. there is an artificial seam, 인위적인 갈라진 틈이 있어요. between the communication space, 의사소통 공간과. and task space, 작업 공간 사이에요. 이 문장 전체를 해석하면, 그래서, 의사소통 공간과 작업 공간 사이에는 인위적인 갈라진 틈이 존재한다.","hl":"m"},{"n":29,"text":"이 문장은 이 글의 핵심 결론입니다. 원격 통신 기술이 의사소통 공간과 작업 공간 사이에 인위적인 갈라진 틈, 즉 artificial seam을 만든다는 뜻이에요. 얼굴을 보며 자연스럽게 소통하는 대면 협업과 달리, 원격 협업에는 기술 때문에 생기는 단절이 있다는 걸 정리해 줍니다.","hl":"mn"},{"n":30,"text":"첫 번째 포인트는 there is an artificial seam이에요. there은 장소 의미가 없는 유도부사이고, 진짜 주어는 an artificial seam입니다. 인위적인 갈라진 틈이 있다고 해석하세요. 두 번째 포인트는 between the communication space and task space인데요. between A and B 구조로 A와 B 사이에라는 뜻을 나타내고, the communication space와 task space가 and로 병렬 연결되어 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 영향의 유형이다\u003c/span>\u003cspan class=\"en\">This is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">type \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">impact \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원격 의사소통 기술의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">remote \u003c/span>\u003cspan class=\"tgt\">communication \u003c/span>\u003cspan class=\"tgt\">technology\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예측될 필요가 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">predicted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사소통 모델을 통해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">communication \u003c/span>\u003cspan class=\"tgt\">models\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 의사소통 모델을 통해 예측될 필요가 있는 원격 의사소통 기술이 미치는 영향의 한 유형이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 마지막 문장으로, 앞에서 든 \u003cb class=\"key\">원격 \u003c/b>\u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">기술의 \u003c/b>\u003cb class=\"key\">영향\u003c/b> 사례, 즉 communication space와 task space 사이의 \u003cb class=\"key\">인위적 \u003c/b>\u003cb class=\"key\">이음새\u003c/b>가 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">모델\u003c/b>을 통해 미리 예측되어야 한다고 정리합니다. This는 앞서 설명한 artificial seam을 가리키며, 원격 의사소통 기술이 만드는 간극을 단순한 불편이 아니라 예측 가능한 영향의 한 유형으로 보라는 것입니다. 따라서 이 문장은 기술의 영향을 분석하는 틀로 communication models가 필요하다는 논지를 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 of의 명사 수식\u003c/span> : [the type] + of + [impact] + of + [remote communication technology] : \"원격 의사소통 기술이 미치는 영향의 유형\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사 the impact] + [that + needs to be predicted (관계대명사절)] : \"예측될 필요가 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (need의 목적어)\u003c/span> : need [타동사] + [to be predicted (to부정사구/목적어)] : \"예측될 필요가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 through의 부사적 용법 (수단)\u003c/span> : [through] + [communication models (전치사의 목적어)] : \"의사소통 모델을 통해\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"This is the type of impact, 이것은 영향의 유형이다. of remote communication technology, 원격 의사소통 기술의. that needs to be predicted, 예측될 필요가 있는. through communication models, 의사소통 모델을 통해. 이 문장 전체를 해석하면, 이것은 의사소통 모델을 통해 예측될 필요가 있는 원격 의사소통 기술이 미치는 영향의 한 유형이다.","hl":"m"},{"n":32,"text":"이 문장은 글의 마지막 문장으로, 앞에서 설명한 원격 의사소통 기술의 영향을 communication models를 통해 예측해야 한다고 정리해요. This는 communication space와 task space 사이의 artificial seam, 즉 인위적 이음새를 가리키죠. 결국 원격 의사소통 기술이 만드는 간극을 예측 가능한 영향의 한 유형으로 보고, 이를 분석하려면 communication models가 필요하다는 핵심 논지를 마무리합니다.","hl":"mn"},{"n":33,"text":"어법 포인트를 짚어 볼게요. 첫 번째로, the type of impact of remote communication technology에서 전치사 of가 앞 명사 type을 뒤에서 수식해요. of는 우리말로 의로 해석되는 경우가 많아서 impact of remote communication technology는 원격 의사소통 기술의 영향이 되죠. 두 번째로, that needs to be predicted는 주격 관계대명사 that이 선행사 the impact를 받아 뒤 절을 이끌어요. 세 번째로, needs to be predicted에서 need는 타동사라서 목적어가 필요한데 to부정사가 목적어 자리에 왔어요. 네 번째로, through communication models는 전치사 through가 수단을 나타내며 predicted를 수식하는 부사구예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>대면 협업에서는 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">공간\u003c/b>의 \u003cb class=\"key\">부분 \u003c/b>\u003cb class=\"key\">집합\u003c/b>이다.\u003c/li>\u003cli>Ishii는 기능적 분리가 없어 \u003cb class=\"key\">갈라진 \u003c/b>\u003cb class=\"key\">틈이 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">의사소통\u003c/b>이라고 본다.\u003c/li>\u003cli>원격 작업에서는 두 공간이 분리되어 \u003cb class=\"key\">인위적인 \u003c/b>\u003cb class=\"key\">갈라진 \u003c/b>\u003cb class=\"key\">틈\u003c/b>이 생긴다.\u003c/li>\u003cli>원격 기술의 영향은 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">모델\u003c/b>로 예측되어야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Remote communication creates an artificial seam between task space and communication space, so its impact must be predicted through communication models.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 대면 협업에서는 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">공간\u003c/b>의 부분 집합이라 \u003cb class=\"key\">갈라진 \u003c/b>\u003cb class=\"key\">틈이 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">의사소통\u003c/b>이 이루어지지만, 원격 작업에서는 두 공간이 분리되어 \u003cb class=\"key\">인위적인 \u003c/b>\u003cb class=\"key\">갈라진 \u003c/b>\u003cb class=\"key\">틈\u003c/b>이 생긴다. 따라서 원격 의사소통 기술의 영향은 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">모델\u003c/b>로 예측해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"오늘 지문을 정리하면, 대면 협업에서는 작업 공간이 의사소통 공간의 부분 집합이 되어 갈라진 틈이 없는 소통이 이루어집니다. 반면 원격 협업에서는 작업 공간과 의사소통 공간이 분리되어 인위적인 갈라진 틈이 생기죠. 이런 영향은 의사소통 모델로 예측해야 한다는 게 글의 주장입니다. 여러분도 화상 회의를 떠올리며 공간의 개념을 꼭 기억해 두세요. 오늘 수고 많았습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
