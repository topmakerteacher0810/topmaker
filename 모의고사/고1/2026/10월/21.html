}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 21번","audioDir":"21_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">21번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Same Game, Same Prizes\u003c/h1>\u003ch2>같은 게임, 똑같은 보상\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>만족하지 못하는 직업인들은 \u003cb class=\"key\">기적적인 \u003c/b>\u003cb class=\"key\">미래\u003c/b>를 기대하며 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">게임\u003c/b>만 반복하지만, 이는 \u003cb class=\"key\">타이타닉호 \u003c/b>\u003cb class=\"key\">갑판 \u003c/b>\u003cb class=\"key\">의자 \u003c/b>\u003cb class=\"key\">재배치\u003c/b>에 불과하다. 결국 \u003cb class=\"key\">접근 \u003c/b>\u003cb class=\"key\">방식의 \u003c/b>\u003cb class=\"key\">완전한 \u003c/b>\u003cb class=\"key\">전환\u003c/b>이 필요하다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Unsatisfied professionals must completely change their approach instead of passively hoping for a miraculous career change.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 만족하지 못하는 직업인들이 빠지기 쉬운 태도에 대한 글이에요. 영어 제목은 Same Game, Same Prizes, 한국어로는 같은 게임, 똑같은 보상이라는 뜻이죠. 먼저 요약하면, 불만족한 사람일수록 기적적인 미래만 바라며 같은 행동을 반복한다는 것입니다. 요지는 결국 접근 방식을 완전히 바꿔야 한다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">직장에서 느끼는 \u003cb class=\"key\">만성적 \u003c/b>\u003cb class=\"key\">불만족\u003c/b>은 흔히 \u003cb class=\"key\">수동적 \u003c/b>\u003cb class=\"key\">직업 \u003c/b>\u003cb class=\"key\">탐색(passive \u003c/b>\u003cb class=\"key\">job \u003c/b>\u003cb class=\"key\">search)\u003c/b>과 연결됩니다. 심리학에서는 자신의 경력을 운이나 우연에 맡기는 태도를 \u003cb class=\"key\">외적 \u003c/b>\u003cb class=\"key\">통제 \u003c/b>\u003cb class=\"key\">소재(external \u003c/b>\u003cb class=\"key\">locus \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">control)\u003c/b>라고 부릅니다. 반대로 자신이 \u003cb class=\"key\">업무의 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 바꾸거나 \u003cb class=\"key\">강점\u003c/b>을 활용해 일을 다시 설계하는 것을 \u003cb class=\"key\">직무 \u003c/b>\u003cb class=\"key\">재창조(job \u003c/b>\u003cb class=\"key\">crafting)\u003c/b>라고 합니다. 많은 사람이 이직만이 해결책이라고 생각하지만, 같은 조건의 일자리를 옮겨 다니는 것은 마치 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">메뉴만 \u003c/b>\u003cb class=\"key\">시키면서 \u003c/b>\u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">맛\u003c/b>을 기대하는 것과 같습니다. 지문은 미래의 \u003cb class=\"key\">기적\u003c/b>을 바라는 대신 지금의 \u003cb class=\"key\">접근 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 바꾸라고 조언합니다.\u003c/div>","segs":[{"n":2,"text":"이 지문을 이해하려면 직업 세계에서 말하는 수동적 직업 탐색이라는 개념을 알아두면 좋아요. 심리학에서는 자신의 경력을 운이나 우연에 맡기는 태도를 외적 통제 소재라고 해요. 반대로 자신이 일의 의미를 바꾸거나 강점을 살려 업무를 다시 설계하는 것을 직무 재창조, 영어로 job crafting이라고 하죠. 많은 사람이 이직만이 답이라고 생각하지만, 같은 조건의 일자리로 옮겨 다니는 것은 마치 같은 메뉴만 시키면서 새로운 맛을 기대하는 것과 같아요. 지문은 미래의 기적을 바라는 대신 지금의 접근 방식을 바꾸라고 조언하고 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>기적을 바라는 통념\u003csmall>통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 두 문장은 만족하지 못하는 직업인들이 가진 \u003cb class=\"key\">반복되는 \u003c/b>\u003cb class=\"key\">믿음\u003c/b>을 보여 줍니다. 그들은 언젠가 \u003cb class=\"key\">미래의 \u003c/b>\u003cb class=\"key\">알 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">날\u003c/b>에 상황이 기적적으로 바뀌어 완벽한 일자리를 \u003cb class=\"key\">우연히\u003c/b> 마주치리라고 기대합니다. 그러면서도 현재 상황을 \u003cb class=\"key\">의미 \u003c/b>\u003cb class=\"key\">있게 \u003c/b>\u003cb class=\"key\">바꾸기\u003c/b> 위해 하는 일은 거의 없습니다. 이는 \u003cb class=\"key\">기대\u003c/b>와 \u003cb class=\"key\">행동\u003c/b> 사이의 괴리를 드러냅니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>같은 게임 반복\u003csmall>문제 행동 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>그들은 자신의 일자리를 좋아하지 않는데도 \u003cb class=\"key\">구인란\u003c/b>으로 가서 \u003cb class=\"key\">비슷한 \u003c/b>\u003cb class=\"key\">직책\u003c/b>의 일자리만 검색합니다. 다른 부서나 회사에서 \u003cb class=\"key\">새로 \u003c/b>\u003cb class=\"key\">고침 \u003c/b>\u003cb class=\"key\">버튼\u003c/b>만 누르면 우주가 \u003cb class=\"key\">마법 \u003c/b>\u003cb class=\"key\">가루\u003c/b>를 뿌려 주기를 바랍니다. 겉으로는 \u003cb class=\"key\">적극적 \u003c/b>\u003cb class=\"key\">탐색\u003c/b>처럼 보이지만 실제로는 \u003cb class=\"key\">수동적 \u003c/b>\u003cb class=\"key\">기대\u003c/b>에 머무릅니다. 이 행동은 근본적인 변화 없이 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">게임\u003c/b>을 다시 시작하는 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>타이타닉호 비유\u003csmall>비유 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>이런 노력은 직업인들로 하여금 \u003cb class=\"key\">무언가를 \u003c/b>\u003cb class=\"key\">하고 \u003c/b>\u003cb class=\"key\">있다는 \u003c/b>\u003cb class=\"key\">느낌\u003c/b>만 주고, 결국 새 일자리에서도 빠르게 \u003cb class=\"key\">환상이 \u003c/b>\u003cb class=\"key\">깨질\u003c/b> 상황을 만듭니다. 이는 \u003cb class=\"key\">타이타닉호의 \u003c/b>\u003cb class=\"key\">갑판 \u003c/b>\u003cb class=\"key\">의자들을 \u003c/b>\u003cb class=\"key\">재배치하는 \u003c/b>\u003cb class=\"key\">것\u003c/b>과 같습니다. 배가 가라앉는 \u003cb class=\"key\">근본 \u003c/b>\u003cb class=\"key\">원인\u003c/b>은 그대로 둔 채 보이는 것만 바꾸는 \u003cb class=\"key\">무의미한 \u003c/b>\u003cb class=\"key\">행동\u003c/b>이라는 뜻입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>접근 전면 전환\u003csmall>주장 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>따라서 여러분은 \u003cb class=\"key\">접근 \u003c/b>\u003cb class=\"key\">방식을 \u003c/b>\u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">바꾸어야\u003c/b> 합니다. 같은 게임을 계속하면 \u003cb class=\"key\">똑같은 \u003c/b>\u003cb class=\"key\">보상\u003c/b>만 얻게 될 것이기 때문입니다. 이는 \u003cb class=\"key\">근본적 \u003c/b>\u003cb class=\"key\">변화\u003c/b> 없이는 \u003cb class=\"key\">동일한 \u003c/b>\u003cb class=\"key\">결과\u003c/b>가 반복된다는 경고입니다. 결국 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">게임\u003c/b>을 선택해야 새로운 보상을 얻을 수 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 통념을 제시하고, 그 통념이 실제로 어떤 행동으로 이어지는지 보여 준 다음, 비유로 비판하고 마지막에 조언을 던지는 흐름이에요.","hl":null},{"n":4,"text":"처음 두 문장에서는 만족하지 못하는 직업인들이 가진 반복되는 믿음을 보여 줍니다. 그들은 언젠가 미래의 알 수 없는 날에 상황이 기적적으로 바뀌어 완벽한 일자리를 우연히 마주치리라고 기대해요. 그러면서도 현재 상황을 의미 있게 바꾸기 위해 하는 일은 거의 없죠. 여기서 기대와 행동 사이의 괴리가 드러납니다.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 그들이 어떤 행동을 하는지 구체적으로 나옵니다. 일자리를 좋아하지 않는데도 구인란으로 가서 비슷한 직책의 일자리만 검색해요. 다른 부서나 회사에서 새로 고침 버튼만 누르면 우주가 마법 가루를 뿌려 주기를 바라죠. 겉으로는 적극적 탐색처럼 보이지만 실제로는 수동적 기대에 머무르는 것입니다.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장에서는 이런 노력의 결과를 비판합니다. 이런 노력은 직업인들로 하여금 무언가를 하고 있다는 느낌만 주고, 결국 새 일자리에서도 빠르게 환상이 깨질 상황을 만든다고 해요. 이는 타이타닉호의 갑판 의자들을 재배치하는 것과 같다고 비유합니다. 배가 가라앉는 근본 원인은 그대로 둔 채 보이는 것만 바꾸는 무의미한 행동이라는 뜻이에요.","hl":"f2"},{"n":7,"text":"일곱 번째와 여덟 번째 문장에서 저자의 조언이 나옵니다. 여러분은 접근 방식을 완전히 바꾸어야 해요. 같은 게임을 계속하면 똑같은 보상만 얻게 될 것이기 때문이죠. 결국 근본적 변화 없이는 동일한 결과가 반복되므로 새로운 게임을 선택해야 한다는 것입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 처음 두 문장에서 \u003cb class=\"key\">만족하지 \u003c/b>\u003cb class=\"key\">못하는 \u003c/b>\u003cb class=\"key\">직업인들\u003c/b>의 \u003cb class=\"key\">통념\u003c/b>을 제시하고, 중간 문장에서 그들의 \u003cb class=\"key\">수동적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 비판합니다. 여섯 번째 문장의 \u003cb class=\"key\">타이타닉호 \u003c/b>\u003cb class=\"key\">갑판 \u003c/b>\u003cb class=\"key\">의자 \u003c/b>\u003cb class=\"key\">재배치\u003c/b>는 \u003cb class=\"key\">비유\u003c/b>로 통념의 허상을 드러냅니다. 마지막 두 문장에서 \u003cb class=\"key\">접근 \u003c/b>\u003cb class=\"key\">방식의 \u003c/b>\u003cb class=\"key\">완전한 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 요구하므로 주제문은 일곱 번째 문장입니다. 따라서 \u003cb class=\"key\">미괄식\u003c/b> 구조로, \u003cb class=\"key\">통념-반박\u003c/b>의 전개 방식을 취합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>At the same time (2)\u003c/b>\u003cspan>첨가·대조\u003c/span>\u003cb>Efforts like this (5)\u003c/b>\u003cspan>환언\u003c/span>\u003cb>It's like (6)\u003c/b>\u003cspan>비유\u003c/span>\u003cb>You've got to (7)\u003c/b>\u003cspan>당위·주장\u003c/span>\u003cb>If (8)\u003c/b>\u003cspan>조건·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the belief that someday things will miraculously change\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">hoping that the universe will sprinkle a bit of magic\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">rearranging deck chairs on the Titanic\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">keep playing the same game, win the same prizes\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>미래의 기적을 기다리는 태도\u003c/th>\u003cth>접근 방식을 완전히 바꾸는 태도\u003c/th>\u003c/tr>\u003ctr>\u003ctd>do little to meaningfully alter their current situation\u003c/td>\u003ctd>completely switch up your approach\u003c/td>\u003c/tr>\u003ctr>\u003ctd>feel like they are doing something, become disenchanted\u003c/td>\u003ctd>win different prizes\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 통념을 먼저 제시하고 그것을 반박하는 전개 방식이에요. 처음 두 문장에서 잘못된 믿음을 깔고, 중간 문장에서 그 믿음의 허상을 비유로 드러냅니다. 마지막 두 문장에서 접근 방식을 완전히 바꾸라고 조언하기 때문에 주제문은 일곱 번째 문장이고요. 따라서 두괄식이 아니라 마지막에 핵심 주장이 오는 미괄식 구조입니다.","hl":"ty"},{"n":9,"text":"글의 신호어를 보면, 두 번째 문장의 At the same time은 통념과 행동 사이의 괴리를 보여 주는 첨가와 대조의 신호예요. 다섯 번째 문장의 Efforts like this는 앞선 행동을 다시 정리하며 비판으로 넘어가는 환언 표현이고요. 여섯 번째 문장의 It's like는 비유를 시작하는 신호입니다. 일곱 번째 문장의 You've got to는 강한 당위의 주장을 드러내고, 여덟 번째 문장의 If는 조건과 결론의 관계를 보여 줘요. 이 신호어들을 따라가면 글의 논리가 선명하게 잡힙니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>unsatisfied\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불만족한\u003c/span>\u003c/div>\u003cdiv>\u003cb>professional\u003c/b>\u003cem>명사\u003c/em>\u003cspan>직업인\u003c/span>\u003c/div>\u003cdiv>\u003cb>repeating\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>되풀이되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>theme\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주제\u003c/span>\u003c/div>\u003cdiv>\u003cb>belief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>믿음\u003c/span>\u003c/div>\u003cdiv>\u003cb>miraculously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>기적적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>stumble into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우연히 ~을 발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>career\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경력\u003c/span>\u003c/div>\u003cdiv>\u003cb>At the same time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>동시에\u003c/span>\u003c/div>\u003cdiv>\u003cb>typically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대체로\u003c/span>\u003c/div>\u003cdiv>\u003cb>meaningfully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>의미 있게\u003c/span>\u003c/div>\u003cdiv>\u003cb>alter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바꾸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>current\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>현재의\u003c/span>\u003c/div>\u003cdiv>\u003cb>head to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 향하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>job board\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구인란\u003c/span>\u003c/div>\u003cdiv>\u003cb>search for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>검색하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>role\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일자리, 역할\u003c/span>\u003c/div>\u003cdiv>\u003cb>similar\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비슷한\u003c/span>\u003c/div>\u003cdiv>\u003cb>job title\u003c/b>\u003cem>명사\u003c/em>\u003cspan>직책\u003c/span>\u003c/div>\u003cdiv>\u003cb>sprinkle\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뿌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>refresh button\u003c/b>\u003cem>명사\u003c/em>\u003cspan>새로 고침 버튼\u003c/span>\u003c/div>\u003cdiv>\u003cb>disenchanted\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>환상이 깨진\u003c/span>\u003c/div>\u003cdiv>\u003cb>rearrange\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재배치하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deck chair\u003c/b>\u003cem>명사\u003c/em>\u003cspan>갑판 의자\u003c/span>\u003c/div>\u003cdiv>\u003cb>completely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>switch up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전환하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>approach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>접근 방식\u003c/span>\u003c/div>\u003cdiv>\u003cb>same\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>prize\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보상\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오늘 핵심 단어를 몇 개만 짚을게요. unsatisfied는 만족하지 못하는, disenchanted는 환상이 깨진이라는 뜻이에요. alter는 바꾸다, completely는 완전히, switch up은 전환하다라는 의미이죠. 이 단어들은 반복해서 나오는 변화와 관련된 표현이라 묶어서 기억해 두면 좋습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">unsatisfied\u003c/b>\u003cspan class=\"m\">불만족한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discontented\u003c/span>\u003cspan class=\"s\">dissatisfied\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">satisfied\u003c/span>\u003cspan class=\"a\">content\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">miraculously\u003c/b>\u003cspan class=\"m\">기적적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">magically\u003c/span>\u003cspan class=\"s\">wondrously\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">naturally\u003c/span>\u003cspan class=\"a\">ordinarily\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">alter\u003c/b>\u003cspan class=\"m\">바꾸다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">change\u003c/span>\u003cspan class=\"s\">modify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">maintain\u003c/span>\u003cspan class=\"a\">preserve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">similar\u003c/b>\u003cspan class=\"m\">비슷한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alike\u003c/span>\u003cspan class=\"s\">comparable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">dissimilar\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disenchanted\u003c/b>\u003cspan class=\"m\">환상이 깨진\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disillusioned\u003c/span>\u003cspan class=\"s\">disappointed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">enchanted\u003c/span>\u003cspan class=\"a\">delighted\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">completely\u003c/b>\u003cspan class=\"m\">완전히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">totally\u003c/span>\u003cspan class=\"s\">entirely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partially\u003c/span>\u003cspan class=\"a\">incompletely\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">same\u003c/b>\u003cspan class=\"m\">같은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">identical\u003c/span>\u003cspan class=\"s\">equal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">dissimilar\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 잘 나오는 동의어와 반의어도 정리해 볼게요. unsatisfied는 dissatisfied와 바꿔 쓸 수 있고, 반대말은 satisfied예요. alter는 change나 modify와 동의어이고, maintain과 반대입니다. disenchanted는 disillusioned와 유사하고, enchanted와 반대가 되죠. completely는 totally나 entirely와 동의어이고, partially와 반대입니다. same은 identical과 바꿔 쓸 수 있고, different와 반대예요. 이렇게 짝을 지어 기억하면 어휘 문제에 바로 적용할 수 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만족하지 못하는 직업인들 사이에는\u003c/span>\u003cspan class=\"en\">Among unsatisfied professionals,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">되풀이해서 나타나는 주제가 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there's \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">repeating \u003c/span>\u003cspan class=\"tgt\">theme\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">—그 믿음\u003c/span>\u003cspan class=\"en\">—\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">belief \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 언젠가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> someday\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(미래의 알 수 없는 날에)\u003c/span>\u003cspan class=\"en\">(a mysterious day in the future)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상황이 기적적으로 변할 것이고\u003c/span>\u003cspan class=\"en\">things will miraculously change\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들은 완벽한 일자리나 경력을 우연히 마주친다는 것이다\u003c/span>\u003cspan class=\"en\">and they'll stumble into the perfect job or career.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만족하지 못하는 직업인들 사이에는 되풀이해서 나타나는 주제가 있다. 그것은 언젠가 (미래의 알 수 없는 날에) 상황이 기적적으로 바뀌어 자신들이 우연히 완벽한 일자리나 경력을 마주칠 것이라는 믿음이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 만족하지 못하는 직업인들이 \u003cb class=\"key\">언젠가 \u003c/b>\u003cb class=\"key\">기적적으로\u003c/b> 완벽한 직업을 만날 것이라는 \u003cb class=\"key\">막연한 \u003c/b>\u003cb class=\"key\">기대\u003c/b>를 품고 있음을 제시합니다. 대시 뒤의 that절은 belief의 \u003cb class=\"key\">동격\u003c/b>으로 그 믿음의 내용을 구체화합니다. 뒤 문장들에서 이 기대와 현실의 괴리를 비판하는 도입 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there + be동사 구문 (유도부사)\u003c/span> : There + be동사(is) + 주어(a repeating theme) : \"되풀이해서 나타나는 주제가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격의 that절\u003c/span> : 추상명사(the belief) + that + 완전한 절 : \"~라는 믿음\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Among unsatisfied professionals, 만족하지 못하는 직업인들 사이에는. there's a repeating theme, 되풀이해서 나타나는 주제가 있다. —the belief, —그 믿음. that someday, 즉 언젠가. (a mysterious day in the future), (미래의 알 수 없는 날에). things will miraculously change, 상황이 기적적으로 변할 것이고. and they'll stumble into the perfect job or career, 그리고 그들은 완벽한 일자리나 경력을 우연히 마주친다는 것이다. 이 문장 전체를 해석하면, 만족하지 못하는 직업인들 사이에는 되풀이해서 나타나는 주제가 있다. 그것은 언젠가 (미래의 알 수 없는 날에) 상황이 기적적으로 바뀌어 자신들이 우연히 완벽한 일자리나 경력을 마주칠 것이라는 믿음이다.","hl":"m"},{"n":13,"text":"이 문장은 불만족한 직업인들의 공통된 문제를 제시합니다. 그들은 언젠가 기적적으로 완벽한 일자리를 만날 것이라는 막연한 기대를 갖고 있어요. 여기서 대시 뒤의 that절은 belief의 내용을 설명하는 동격절입니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 there is 혹은 there's 구문입니다. there는 유도부사일 뿐이고 실제 주어는 a repeating theme이에요. 그래서 단수 be동사 is가 쓰였습니다. 두 번째 포인트는 the belief that의 that절입니다. 이 that은 belief의 내용을 설명하는 동격 접속사이고, 뒤에 완전한 절이 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면서도\u003c/span>\u003cspan class=\"en\">At the same time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 (대체로)\u003c/span>\u003cspan class=\"en\">they (typically)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 하지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">little\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 현재 상황을 의미 있게 바꾸기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">meaningfully \u003c/span>\u003cspan class=\"tgt\">alter \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">current \u003c/span>\u003cspan class=\"tgt\">situation\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면서도 그들은 (대체로) 자신의 현재 상황을 의미 있게 바꾸기 위해 하는 일이 거의 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그들은 \u003cb class=\"key\">현재 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 의미 있게 바꾸려는 행동을 \u003cb class=\"key\">거의 \u003c/b>\u003cb class=\"key\">하지 \u003c/b>\u003cb class=\"key\">않는다\u003c/b>고 지적합니다. 앞 문장의 막연한 기대와 대비되는 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">부족\u003c/b>을 드러내며, 다음 문장에서 보여줄 실제 행동을 비판하는 연결 고리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정적 의미의 little + do\u003c/span> : do + little : \"거의 하지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + alter(동사원형) + their current situation(목적어) : \"자신의 현재 상황을 의미 있게 바꾸기 위해\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"At the same time, 그러면서도. they (typically), 그들은 (대체로). do little, 거의 하지 않는다. to meaningfully alter their current situation, 자신의 현재 상황을 의미 있게 바꾸기 위해. 이 문장 전체를 해석하면, 그러면서도 그들은 (대체로) 자신의 현재 상황을 의미 있게 바꾸기 위해 하는 일이 거의 없다.","hl":"m"},{"n":16,"text":"이 문장은 그들이 현재 상황을 의미 있게 바꾸기 위한 행동을 거의 하지 않는다고 지적합니다. 앞 문장에서 말한 기대와 달리 실제 행동은 부족하다는 점을 드러내요. 다음에 이어지는 예시를 이해하는 연결 고리가 됩니다.","hl":"mn"},{"n":17,"text":"첫 번째로 do little에 주목하세요. little은 부정적 의미라서 거의 하지 않는다는 뜻을 만들어요. 두 번째 포인트는 to meaningfully alter their current situation입니다. 이 to부정사는 목적의 의미로, 현재 상황을 의미 있게 바꾸기 위해라는 뜻으로 do little을 수식합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 자신의 일자리를 좋아하지 않는데,\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">like\u003c/span> their job,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 무엇을 하는가?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들이 자신의 일자리를 좋아하지 않는데, 그래서 그들은 무엇을 하는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 그들이 자신의 일자리를 좋아하지 않는다는 사실과 그럴 때 무엇을 하는지 \u003cb class=\"key\">수사 \u003c/b>\u003cb class=\"key\">의문문\u003c/b>으로 묻습니다. 실제 답을 요구하기보다 \u003cb class=\"key\">독자의 \u003c/b>\u003cb class=\"key\">주의\u003c/b>를 환기하고 다음 문장의 행동을 소개하는 전환 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 부정문\u003c/span> : do not + 동사원형(like) : \"좋아하지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 so\u003c/span> : 완전한 문장 + so + 완전한 문장 : \"그래서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사 의문문\u003c/span> : 의문사(what) + do(조동사) + 주어(they) + 동사원형(do) : \"그들은 무엇을 하는가?\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They don't like their job, 그들은 자신의 일자리를 좋아하지 않는데. so, 그래서. what do they do?, 그들은 무엇을 하는가?. 이 문장 전체를 해석하면, 그들이 자신의 일자리를 좋아하지 않는데, 그래서 그들은 무엇을 하는가?","hl":"m"},{"n":19,"text":"이 문장은 싫어하는 직업에 대해 그들이 무엇을 하는지 묻는 수사 의문문입니다. 단순히 답을 얻으려는 질문이 아니라 독자의 주의를 환기해요. 다음 문장에서 그들의 실제 행동을 보여주기 위한 전환 역할을 합니다.","hl":"mn"},{"n":20,"text":"첫 번째로 don't like는 일반동사 like의 부정문입니다. 일반동사는 부정할 때 do를 써야 하죠. 두 번째로 so는 앞뒤 문장을 원인과 결과로 잇는 등위접속사예요. 세 번째로 what do they do는 의문사 what과 조동사 do를 쓴 의문문이고, 뒤의 do는 본동사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 구인란으로 향한다\u003c/span>\u003cspan class=\"en\">They head to job boards\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 비슷한 직책의 일자리를 검색한다\u003c/span>\u003cspan class=\"en\">and search for roles with a similar job title,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주가 자신의 경력에 약간의 마법 가루를 뿌려 주기를 바라면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hoping \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">universe \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">sprinkle \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bit \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">magic \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">career\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그들이 다른 부서나 회사에서 그저 새로 고침 버튼만 누르면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">hit \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">refresh \u003c/span>\u003cspan class=\"tgt\">button \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">department \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">company\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 구인란으로 가서 비슷한 직책의 일자리를 검색하고, 그들이 다른 부서나 회사에서 그저 새로 고침 버튼만 누르면 우주가 자신의 경력에 약간의 마법 가루를 뿌려 주기를 바란다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불만족스러운 직장인이 실제로 하는 행동을 구체적으로 보여줍니다. 비슷한 직책을 검색하는 것은 겉으로는 노력처럼 보이지만 실제로는 부서나 회사만 바꾸는 \u003cb class=\"key\">표면적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>에 불과합니다. '마법 가루'와 '새로 고침 버튼'은 우연한 기적을 바라는 \u003cb class=\"key\">수동적 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 비유합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사구문 (동시동작)\u003c/span> : S + V ~, hoping ... : \"우주가 자신의 경력에 약간의 마법 가루를 뿌려 주기를 바라면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조건의 부사절\u003c/span> : if + S + V(현재시제), S + will V : \"만약 그들이 다른 부서나 회사에서 그저 새로 고침 버튼만 누르면\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They head to job boards, 그들은 구인란으로 향한다. and search for roles with a similar job title, 그리고 비슷한 직책의 일자리를 검색한다. hoping that the universe will sprinkle a bit of magic on their career, 우주가 자신의 경력에 약간의 마법 가루를 뿌려 주기를 바라면서. if they just hit the refresh button in a different department or company, 만약 그들이 다른 부서나 회사에서 그저 새로 고침 버튼만 누르면. 이 문장 전체를 해석하면, 그들은 구인란으로 가서 비슷한 직책의 일자리를 검색하고, 그들이 다른 부서나 회사에서 그저 새로 고침 버튼만 누르면 우주가 자신의 경력에 약간의 마법 가루를 뿌려 주기를 바란다.","hl":"m"},{"n":22,"text":"이 문장은 불만족스러운 직장인이 실제로 하는 행동을 보여줘요. 비슷한 직책을 검색하는 건 겉으로는 뭔가 하는 것 같지만, 결국 부서나 회사만 바꾸는 표면적인 변화에 그친다는 걸 강조해요. 마법 가루나 새로 고침 버튼은 우연한 기적을 바라는 수동적인 태도를 비유한 거죠.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 hoping으로 시작하는 분사구문이에요. hoping의 의미상 주어는 주절의 주어 They이고, 주절의 동작과 동시에 일어나는 동작이라서 현재분사를 썼어요. 두 번째 포인트는 if절이에요. 조건의 부사절에서는 미래의 일도 현재시제로 쓰기 때문에 hit가 현재형으로 나왔어요. 주절의 will sprinkle과 짝을 이뤄서 미래의 가정을 나타내죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이와 같은 노력은\u003c/span>\u003cspan class=\"en\">Efforts like this\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직업인들로 하여금 자신들이 무언가를 하고 있는 것처럼 느끼게 하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">professionals \u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">something\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때 실제로 그들은 단지 스스로를 처하게 할 뿐이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">really\u003c/span> they're just setting themselves up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 일자리를 구한 뒤 그들이 이전에 그랬던 것처럼 빠르게 환상이 깨질 상황에\u003c/span>\u003cspan class=\"en\">to take a new role and quickly become just \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">disenchanted \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">before\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이와 같은 노력은 직업인들로 하여금 자신들이 무언가를 하고 있는 것처럼 느끼게 하지만, 그때 실제로 그들은 단지 새로운 일자리를 구한 뒤 그들이 이전에 그랬던 것처럼 빠르게 환상이 깨질 상황에 스스로를 처하게 할 뿐이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 겉으로는 생산적인 행동처럼 보이는 노력이 실제로는 \u003cb class=\"key\">자기기만\u003c/b>에 불과함을 지적합니다. 같은 패턴의 이직은 결국 이전과 똑같은 \u003cb class=\"key\">환멸\u003c/b>을 되풀이하게 만든다는 점을 대조적으로 보여줍니다. 'doing something'과 'setting themselves up'의 대비가 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 원형부정사\u003c/span> : make + O + 동사원형 (원형부정사) : \"직업인들로 하여금 자신들이 무언가를 하고 있는 것처럼 느끼게 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대조를 나타내는 접속사 when\u003c/span> : when really (사실은) : \"그런데 실제로는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">원급 비교 (as + 형용사 + as)\u003c/span> : as + 형용사 + as + S + V : \"이전에 그랬던 것만큼 환상이 깨진\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Efforts like this, 이와 같은 노력은. make professionals feel like they are doing something, 직업인들로 하여금 자신들이 무언가를 하고 있는 것처럼 느끼게 하지만. when really they're just setting themselves up, 그때 실제로 그들은 단지 스스로를 처하게 할 뿐이다. to take a new role and quickly become just as disenchanted as they were before, 새로운 일자리를 구한 뒤 그들이 이전에 그랬던 것처럼 빠르게 환상이 깨질 상황에. 이 문장 전체를 해석하면, 이와 같은 노력은 직업인들로 하여금 자신들이 무언가를 하고 있는 것처럼 느끼게 하지만, 그때 실제로 그들은 단지 새로운 일자리를 구한 뒤 그들이 이전에 그랬던 것처럼 빠르게 환상이 깨질 상황에 스스로를 처하게 할 뿐이다.","hl":"m"},{"n":25,"text":"이 문장은 그런 노력이 실제로는 아무것도 바꾸지 못한다는 걸 대비해서 보여줘요. 스스로 뭔가 하고 있다고 느끼지만, 실제로는 그냥 새로운 직장에서 이전과 똑같은 환멸을 반복할 준비를 하고 있는 거예요. doing something과 setting themselves up의 대비가 문장의 핵심이에요.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 사역동사 make입니다. make는 목적어와 목적격 보어 자리에 동사원형을 쓰죠. 그래서 feel이 원형부정사로 나왔어요. 두 번째 포인트는 when really입니다. 여기서 when은 시간이 아니라 대조의 의미라서 그런데 실제로는으로 해석해요. 세 번째 포인트는 원급 비교입니다. as disenchanted as they were before는 이전에 그랬던 것만큼 환상이 깨진이라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 ~와 같다\u003c/span>\u003cspan class=\"en\">It's like\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑판 의자들을 재배치하는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">rearranging \u003c/span>\u003cspan class=\"tgt\">deck \u003c/span>\u003cspan class=\"tgt\">chairs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">타이타닉호에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Titanic\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 타이타닉호의 갑판 의자들을 재배치하는 것과 같다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 말한 이직 시도가 \u003cb class=\"key\">무의미한 \u003c/b>\u003cb class=\"key\">행동\u003c/b>임을 \u003cb class=\"key\">타이타닉호\u003c/b>의 비유로 압축합니다. 배가 가라앉는 상황에서 갑판 의자를 재배치하는 것은 아무 도움이 안 되듯, 본질을 바꾸지 않는 노력은 소용없다는 의미입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 (like의 목적어)\u003c/span> : like + 동명사구 : \"타이타닉호에서 갑판 의자들을 재배치하는 것\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It's like, 이는 ~와 같다. rearranging deck chairs, 갑판 의자들을 재배치하는 것. on the Titanic, 타이타닉호에서. 이 문장 전체를 해석하면, 이는 타이타닉호의 갑판 의자들을 재배치하는 것과 같다.","hl":"m"},{"n":28,"text":"이 문장은 직유법이에요. 타이타닉호가 가라앉고 있는데 갑판 의자를 재배치하는 건 아무 소용이 없는 행동이죠. 앞에서 말한 비슷한 직책을 검색하는 노력도 그만큼 무의미하다는 걸 강조하고 있어요.","hl":"mn"},{"n":29,"text":"여기서 like는 전치사라서 뒤에 동명사가 와요. rearranging deck chairs on the Titanic 전체가 like의 목적어 역할을 하는 동명사구예요. 그러니까 이는 타이타닉호의 갑판 의자들을 재배치하는 것과 같다로 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 ~해야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">You've \u003c/span>\u003cspan class=\"tgt\">got \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 바꾸다\u003c/span>\u003cspan class=\"en\">completely switch up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 접근 방식을\u003c/span>\u003cspan class=\"en\">your approach.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 자신의 접근 방식을 완전히 바꾸어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 타이타닉호 갑판 의자를 재배치하는 비유에 이어, 단순한 직업 변경이 아니라 문제 해결의 \u003cb class=\"key\">접근 \u003c/b>\u003cb class=\"key\">방식\u003c/b> 자체를 완전히 바꿔야 한다는 글의 핵심 조언입니다. have got to는 강한 \u003cb class=\"key\">의무\u003c/b>를 나타내며, switch up은 같은 틀 안에서의 변경이 아니라 \u003cb class=\"key\">전환\u003c/b>을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have got to (의무)\u003c/span> : have got to + 동사원형 : \"여러분은 ~해야 한다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"You've got to, 여러분은 ~해야 한다. completely switch up, 완전히 바꾸다. your approach, 여러분의 접근 방식을. 이 문장 전체를 해석하면, 여러분은 자신의 접근 방식을 완전히 바꾸어야 한다.","hl":"m"},{"n":31,"text":"이 문장은 앞의 타이타닉호 비유를 마무리하면서 단순히 직장을 옮기는 수준이 아니라 문제를 바라보는 접근 방식 자체를 완전히 바꾸라고 조언하는 부분이에요. have got to는 강한 의무를 나타내서 선택이 아니라 반드시 해야 할 일이라는 뉘앙스를 줍니다. completely가 붙어서 부분적인 수정이 아니라 전면적인 전환이라는 점을 강조해요.","hl":"mn"},{"n":32,"text":"이 문장에서 짚을 문법은 have got to입니다. have got to는 have to와 같이 의무를 나타내는 표현이고, 뒤에는 반드시 동사원형이 와요. 주어 You와 함께 쓰여서 You've got to completely switch up your approach는 여러분은 접근 방식을 완전히 바꿔야 한다는 강한 필요를 말해 줍니다. 시험에서는 have to와 have got to가 같은 의미의 조동사 역할을 한다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 여러분이 계속한다면\u003c/sp  you'll win, 여러분은 얻게 될 것이다. the same prizes, 똑같은 보상을. 이 문장 전체를 해석하면, 여러분이 계속해서 같은 게임을 한다면, 똑같은 보상을 얻게 될 것이다.","hl":"m"},{"n":34,"text":"이 문장은 일곱 번째 문장의 조언을 조건문으로 강화해 주는 문장이에요. 같은 게임을 계속 플레이하면 당연히 똑같은 보상을 받게 된다는 논리로, 이전과 같은 방식으로는 이전과 같은 불만족스러운 결과를 반복할 뿐이라는 경고를 담고 있어요. play the same game과 win the same prizes의 대비가 같은 행동과 같은 결과의 인과 관계를 선명하게 보여 줍니다.","hl":"mn"},{"n":35,"text":"여기서 첫 번째 문법 포인트는 조건의 부사절입니다. if절에서는 미래의 일도 현재시제를 쓰고 주절에서는 will로 결과를 나타내요. If you keep playing the same game에서 keep이 현재시제로 쓰인 것을 확인하세요. 두 번째 문법 포인트는 keep playing입니다. keep은 뒤에 동명사를 목적어로 취해서 계속해서 어떤 동작을 한다는 의미를 만들어요. 그래서 keep playing은 같은 게임을 계속하는 행동을 나타냅니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">만족하지 \u003c/b>\u003cb class=\"key\">못하는 \u003c/b>\u003cb class=\"key\">직업인들\u003c/b>은 미래의 \u003cb class=\"key\">기적\u003c/b>을 기대하면서도 현재 상황을 \u003cb class=\"key\">의미 \u003c/b>\u003cb class=\"key\">있게 \u003c/b>\u003cb class=\"key\">바꾸는\u003c/b> 행동은 하지 않는다.\u003c/li>\u003cli>이들은 \u003cb class=\"key\">구인란\u003c/b>에서 \u003cb class=\"key\">비슷한 \u003c/b>\u003cb class=\"key\">직책\u003c/b>만 검색하며 \u003cb class=\"key\">마법 \u003c/b>\u003cb class=\"key\">가루\u003c/b>를 바라는 \u003cb class=\"key\">수동적 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 보인다.\u003c/li>\u003cli>이런 노력은 \u003cb class=\"key\">타이타닉호의 \u003c/b>\u003cb class=\"key\">갑판 \u003c/b>\u003cb class=\"key\">의자 \u003c/b>\u003cb class=\"key\">재배치\u003c/b>처럼 보이는 것만 바꾸는 \u003cb class=\"key\">무의미한 \u003c/b>\u003cb class=\"key\">행동\u003c/b>이다.\u003c/li>\u003cli>결국 \u003cb class=\"key\">접근 \u003c/b>\u003cb class=\"key\">방식의 \u003c/b>\u003cb class=\"key\">완전한 \u003c/b>\u003cb class=\"key\">전환\u003c/b>이 있어야 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">게임, \u003c/b>\u003cb class=\"key\">똑같은 \u003c/b>\u003cb class=\"key\">보상\u003c/b>의 반복에서 벗어날 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Unsatisfied professionals must completely change their approach instead of passively hoping for a miraculous career change.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">만족하지 못하는 직업인들은 \u003cb class=\"key\">기적적인 \u003c/b>\u003cb class=\"key\">미래\u003c/b>를 기대하며 \u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">게임\u003c/b>만 반복하지만, 이는 \u003cb class=\"key\">타이타닉호 \u003c/b>\u003cb class=\"key\">갑판 \u003c/b>\u003cb class=\"key\">의자 \u003c/b>\u003cb class=\"key\">재배치\u003c/b>에 불과하다. 결국 \u003cb class=\"key\">접근 \u003c/b>\u003cb class=\"key\">방식의 \u003c/b>\u003cb class=\"key\">완전한 \u003c/b>\u003cb class=\"key\">전환\u003c/b>이 필요하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 지문을 정리할게요. 만족하지 못하는 직업인들은 기적적인 미래만 기대하고 같은 행동을 반복하기 쉽습니다. 하지만 그런 노력은 타이타닉호의 갑판 의자를 재배치하는 것처럼 무의미해요. 여러분은 접근 방식을 완전히 바꾸어야 새로운 보상을 얻을 수 있습니다. 이 마음가짐을 기억하고, 다음 시간에는 더 재미있는 지문으로 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
