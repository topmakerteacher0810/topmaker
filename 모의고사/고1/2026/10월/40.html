<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 40번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 40번","audioDir":"40_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">40번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Goldenrod Alarm Calls: From Kin-Specific Whispers to Loudspeaker Broadcasts\u003c/h1>\u003ch2>미역취의 경고 신호: 친족만 알아듣는 속삭임에서 모두를 위한 확성기 방송까지\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>포식자 위협이 적은 평화로운 지역의 \u003cb class=\"key\">미역취\u003c/b>는 \u003cb class=\"key\">가까운 \u003c/b>\u003cb class=\"key\">친족\u003c/b>만 이해하는 특이적 화학 신호를 보내지만, 적대적 지역에서는 모든 미역취가 이해하도록 널리 알린다. 이러한 \u003cb class=\"key\">화학적 \u003c/b>\u003cb class=\"key\">교신\u003c/b>은 받는 식물과 \u003cb class=\"key\">보내는 \u003c/b>\u003cb class=\"key\">식물\u003c/b> 모두에게 이로우며, 힘든 시기에는 \u003cb class=\"key\">협력\u003c/b>이 생존에 필수적이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Goldenrods adjust their chemical alarm signals according to environmental threat, and broadcasting warnings widely benefits both receiver and sender by preventing isolation in tough times.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 식물이 위험을 알리는 화학 신호에 관한 연구입니다. 미역취, 영어로 goldenrod가 사는 환경에 따라 경고 신호의 수신 범위를 달리한다는 내용인데요. 핵심을 먼저 요약하면, 평화로운 지역에서는 가까운 친족만 알아듣는 특이적 신호를 보내지만 적대적 지역에서는 모든 미역취가 이해하도록 널리 알린다는 것입니다. 요지는 결국 화학적 교신이 받는 식물과 보내는 식물 모두에게 이롭고, 힘든 시기에는 협력이 생존에 필수라는 점이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">식물은 움직일 수 없지만 \u003cb class=\"key\">화학적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>로 서로 소통합니다. 미역취는 곤충 같은 \u003cb class=\"key\">포식자\u003c/b>에게 공격받으면 공기 중으로 휘발성 물질을 내보내 이웃에게 위험을 알립니다. 이때 신호를 받은 식물은 방어 물질을 미리 만들거나 \u003cb class=\"key\">꽃가루 \u003c/b>\u003cb class=\"key\">매개자\u003c/b>를 더 효과적으로 부를 수 있습니다. 같은 종이라도 \u003cb class=\"key\">가까운 \u003c/b>\u003cb class=\"key\">친족\u003c/b>과는 더 정교한 신호를, 주변 모든 개체와는 더 넓은 신호를 나눌 수 있는데 이를 \u003cb class=\"key\">친족 \u003c/b>\u003cb class=\"key\">인식\u003c/b>이라고 부릅니다. 일상의 비유로, 조용한 마을에서는 가족끼리만 알아듣게 소곤소곤 말하지만 위험한 동네에서는 마을 방송으로 모두에게 알리는 것과 비슷합니다.\u003c/div>","segs":[{"n":2,"text":"식물은 움직일 수 없지만 chemical signals 같은 화학적 신호로 서로 소통할 수 있습니다. 미역취는 곤충 같은 predator에게 공격받으면 공기 중으로 휘발성 물질을 내보내 이웃에게 위험을 알리는데, 이걸 chemical alarm call이라고 해요. 신호를 받은 식물은 방어 물질을 준비하거나 pollinator를 더 잘 불러들일 수 있습니다. 같은 종이라도 가까운 kin과는 정교한 신호를, 주변 전체와는 넓은 신호를 나눌 수 있는데 이런 능력을 친족 인식, kin recognition이라고 부릅니다. 조용한 마을에서는 가족끼리만 소곤소곤 말하지만 위험한 동네에서는 마을 방송으로 모두에게 알리는 것과 비슷하죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>평화로운 지역의 정밀 신호\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>연구자들은 포식자 위협이 적은 평화로운 지역의 \u003cb class=\"key\">미역취\u003c/b>가 공격받는 드문 경우에 \u003cb class=\"key\">가까운 \u003c/b>\u003cb class=\"key\">친족\u003c/b>만 이해할 수 있는 매우 \u003cb class=\"key\">독특한\u003c/b> 화학적 비상 신호를 내보낸다는 것을 발견했습니다. 이 신호는 선택적이어서 가족끼리만 쓰는 비밀 신호에 가깝습니다. 이처럼 환경이 평화로울 때는 신호의 수신 범위가 좁게 유지됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>적대적 지역의 방송형 신호\u003csmall>전환 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>하지만 더 \u003cb class=\"key\">적대적인 \u003c/b>\u003cb class=\"key\">지역\u003c/b>의 미역취는 \u003cb class=\"key\">생물학적 \u003c/b>\u003cb class=\"key\">친족\u003c/b>만이 아니라 그 지역의 모든 미역취가 이해하는 \u003cb class=\"key\">화학적 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로 신호를 보냅니다. 암호화된 \u003cb class=\"key\">속삭이는 \u003c/b>\u003cb class=\"key\">네트워크\u003c/b> 대신 \u003cb class=\"key\">확성기\u003c/b>로 위협을 널리 알리는 것이죠. 이는 환경의 위협 정도에 따라 신호의 \u003cb class=\"key\">수신 \u003c/b>\u003cb class=\"key\">범위\u003c/b>가 달라진다는 것을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>화학적 교신의 상호 이익\u003csmall>주장 · 문장 4\u003c/small>\u003c/h4>\u003cp>이 연구는 \u003cb class=\"key\">화학적 \u003c/b>\u003cb class=\"key\">교신\u003c/b>이 그것을 받는 식물뿐만 아니라 \u003cb class=\"key\">보내는 \u003c/b>\u003cb class=\"key\">식물\u003c/b>에게도 이롭다는 것을 처음으로 확인했습니다. 신호를 보내는 행동이 겉으로는 이타적으로 보이지만 실제로는 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">이익\u003c/b>을 만들어 냅니다. 이 발견은 이 글의 핵심적인 과학적 \u003cb class=\"key\">주장\u003c/b>에 해당합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>힘든 시기의 생존 협력\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>정말로 힘든 시기에는 들판에 혼자 서 있는 채로 남겨지길 원하지 않습니다. 혼자가 되면 \u003cb class=\"key\">짝짓기\u003c/b>할 상대도 없고, \u003cb class=\"key\">꽃가루 \u003c/b>\u003cb class=\"key\">매개자\u003c/b>를 불러들이는 것을 도와줄 상대도 없기 때문입니다. 따라서 위험이 클 때는 널리 알려 \u003cb class=\"key\">주변의 \u003c/b>\u003cb class=\"key\">협력\u003c/b>을 얻는 것이 생존에 유리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이 글의 흐름을 문장 순서대로 짚어 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 평화로운 지역의 미역취가 보내는 정밀한 신호입니다. 첫 번째 문장을 보면 포식자 위협이 적은 peaceful area의 미역취는 공격받는 드문 경우에만 chemical alarm call을 내보내요. 이 신호는 incredibly specific해서 가까운 친족, close kin만 이해할 수 있습니다. 말하자면 가족끼리만 쓰는 비밀 신호인 셈이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 적대적 지역의 방송형 신호로 전환됩니다. 두 번째 문장에서 But이 등장하면서, hostile territory의 미역취는 biological kin뿐 아니라 그 지역의 모든 goldenrod가 이해하는 chemical phrases를 사용한다고 해요. 세 번째 문장은 이것을 coded whisper networks 대신 loudspeaker로 위협을 broadcast하는 것에 비유합니다. 그래서 신호의 수신 범위가 훨씬 넓어지는 것이죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 이 화학적 교신이 주는 이익입니다. 네 번째 문장에서 이 연구가 chemical communications이 받는 식물뿐 아니라 보내는 식물, sender에게도 beneficial하다는 것을 처음으로 확인했다고 말해요. 여기서 중요한 건 신호를 보내는 행동이 이타적으로만 보이지만 실제로는 상호 이익을 만든다는 점입니다. 이것이 이 글의 핵심 과학적 주장이에요.","hl":"f2"},{"n":7,"text":"마지막 단계는 힘든 시기의 생존 협력입니다. 다섯 번째 문장은 정말로 힘든 시기에는 들판에 혼자 남겨지고 싶지 않다고 말합니다. 여섯 번째 문장에서 그 이유가 나오는데, 혼자가 되면 짝짓기할 상대도 없고 pollinator를 불러들이는 것을 도와줄 상대도 없기 때문이에요. 그래서 위험이 클수록 널리 알려 주변의 협력을 얻는 것이 유리하다는 결론으로 이어집니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장부터 세 번째 문장까지 평화로운 지역과 적대적 지역의 신호 방식을 \u003cb class=\"key\">대조\u003c/b>하며, 같은 미역취라도 환경에 따라 \u003cb class=\"key\">화학적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>의 수신 범위가 달라짐을 보여 줍니다. 네 번째 문장에서 이 교신이 보내는 식물에게도 이롭다는 연구 결과를 제시한 뒤, 다섯 번째 문장에서 혼자 남겨지면 안 된다는 \u003cb class=\"key\">일반적 \u003c/b>\u003cb class=\"key\">교훈\u003c/b>을 끌어냅니다. 따라서 핵심 주장이 뒤에 위치한 \u003cb class=\"key\">미괄식\u003c/b> 구조이며, 주제문은 다섯 번째 문장으로 볼 수 있습니다. 앞부분의 대조는 마지막 교훈을 이끌어 내는 \u003cb class=\"key\">근거\u003c/b> 역할을 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>앞의 평화로운 지역과 반대 방향으로 전환\u003c/span>\u003cb>Instead of (3)\u003c/b>\u003cspan>암호화된 네트워크를 부정하고 확성기 방식 제시\u003c/span>\u003cb>When (5)\u003c/b>\u003cspan>힘든 시기라는 조건을 들어 일반화\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">chemical alarm calls\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">chemical phrases\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">chemical communications\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>평화로운 지역\u003c/th>\u003cth>적대적 지역\u003c/th>\u003c/tr>\u003ctr>\u003ctd>포식자 위협이 적음\u003c/td>\u003ctd>포식자 위협이 많음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>친족만 이해하는 특이적 신호\u003c/td>\u003ctd>모든 미역취가 이해하는 일반 신호\u003c/td>\u003c/tr>\u003ctr>\u003ctd>암호화된 속삭이는 네트워크\u003c/td>\u003ctd>확성기로 위협을 널리 알림\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 평화로운 지역과 적대적 지역의 미역취를 비교하고 대조하는 구조예요. 첫 번째 문장부터 세 번째 문장까지 두 환경에서의 신호 방식을 나란히 보여 주고, 네 번째 문장에서 그 의미를 해석한 뒤 다섯 번째와 여섯 번째 문장에서 일반적 교훈을 끌어내죠. 핵심 주장이 뒤쪽에 있으므로 미괄식 구조로 볼 수 있습니다. 주제문은 다섯 번째 문장이라고 할 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 두 번째 문장의 But이 평화로운 지역과 반대되는 사례로 전환해 주고, 세 번째 문장의 Instead of는 coded whisper networks를 부정하며 loudspeaker 방식을 제시합니다. 같은 개념을 chemical alarm calls, chemical phrases, chemical communications로 바꿔 말한 점도 잡아 두세요. 그리고 다섯 번째 문장의 When이 힘든 시기라는 조건을 걸면서 일반화를 이끌어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>researcher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구자\u003c/span>\u003c/div>\u003cdiv>\u003cb>goldenrod\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미역취\u003c/span>\u003c/div>\u003cdiv>\u003cb>peaceful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>평화로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>threat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위협\u003c/span>\u003c/div>\u003cdiv>\u003cb>predator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포식자\u003c/span>\u003c/div>\u003cdiv>\u003cb>issue\u003c/b>\u003cem>동사\u003c/em>\u003cspan>내보내다, 발신하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chemical alarm call\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화학적 비상 신호\u003c/span>\u003c/div>\u003cdiv>\u003cb>incredibly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>엄청나게, 믿을 수 없을 만큼\u003c/span>\u003c/div>\u003cdiv>\u003cb>specific\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특이적인, 독특한\u003c/span>\u003c/div>\u003cdiv>\u003cb>comprehensible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이해할 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>close kin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가까운 친족\u003c/span>\u003c/div>\u003cdiv>\u003cb>rare\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>드문\u003c/span>\u003c/div>\u003cdiv>\u003cb>occasion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경우, 때\u003c/span>\u003c/div>\u003cdiv>\u003cb>attack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공격하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hostile\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>적대적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>territory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지역, 영역\u003c/span>\u003c/div>\u003cdiv>\u003cb>signal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>신호를 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>neighbor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이웃\u003c/span>\u003c/div>\u003cdiv>\u003cb>chemical phrase\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화학적 표현\u003c/span>\u003c/div>\u003cdiv>\u003cb>biological kin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생물학적 친족\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead of\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>coded\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>암호화된\u003c/span>\u003c/div>\u003cdiv>\u003cb>whisper network\u003c/b>\u003cem>명사\u003c/em>\u003cspan>속삭이는 네트워크\u003c/span>\u003c/div>\u003cdiv>\u003cb>broadcast\u003c/b>\u003cem>동사\u003c/em>\u003cspan>널리 알리다, 방송하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>loudspeaker\u003c/b>\u003cem>명사\u003c/em>\u003cspan>확성기\u003c/span>\u003c/div>\u003cdiv>\u003cb>beneficial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>sender\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보내는 식물, 발신자\u003c/span>\u003c/div>\u003cdiv>\u003cb>tough\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>힘든\u003c/span>\u003c/div>\u003cdiv>\u003cb>mate with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 짝짓기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pollinator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>꽃가루 매개자\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘를 몇 개 짚어 볼게요. chemical alarm call은 화학적 비상 신호, close kin은 가까운 친족, hostile territory는 적대적인 지역이라는 뜻이에요. broadcast는 널리 알리다, pollinator는 꽃가루 매개자라는 뜻으로 이 지문의 핵심 어휘입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">specific\u003c/b>\u003cspan class=\"m\">특이적인, 독특한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"s\">distinctive\u003c/span>\u003cspan class=\"s\">unique\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">general\u003c/span>\u003cspan class=\"a\">universal\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hostile\u003c/b>\u003cspan class=\"m\">적대적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unfriendly\u003c/span>\u003cspan class=\"s\">aggressive\u003c/span>\u003cspan class=\"s\">antagonistic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">peaceful\u003c/span>\u003cspan class=\"a\">friendly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">beneficial\u003c/b>\u003cspan class=\"m\">이로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">helpful\u003c/span>\u003cspan class=\"s\">advantageous\u003c/span>\u003cspan class=\"s\">favorable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harmful\u003c/span>\u003cspan class=\"a\">detrimental\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rare\u003c/b>\u003cspan class=\"m\">드문\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">uncommon\u003c/span>\u003cspan class=\"s\">infrequent\u003c/span>\u003cspan class=\"s\">scarce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">frequent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">kin\u003c/b>\u003cspan class=\"m\">친족\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">relative\u003c/span>\u003cspan class=\"s\">family\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stranger\u003c/span>\u003cspan class=\"a\">outsider\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">tough\u003c/b>\u003cspan class=\"m\">힘든\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">difficult\u003c/span>\u003cspan class=\"s\">hard\u003c/span>\u003cspan class=\"s\">challenging\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 시험에 자주 나오는 동의어와 반의어를 정리할게요. specific은 particular이나 distinctive과 비슷하고 general이나 universal과 반대입니다. hostile은 unfriendly나 aggressive와 비슷하고 peaceful이나 friendly와 반대예요. beneficial은 helpful이나 favorable과 비슷하고 harmful이나 detrimental과 반대입니다. rare는 uncommon이나 scarce와 비슷하고 common이나 frequent와 반대예요. kin은 relative나 family와 비슷하고 stranger과 반대이며, tough는 difficult나 challenging과 비슷하고 easy와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연구자들은 최근에 발견했습니다, 미역취가\u003c/span>\u003cspan class=\"en\">Researchers recently \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">goldenrods \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포식자들로부터의 많은 위협 없이 평화로운 지역에 사는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">live\u003c/span> in peaceful areas without much threat from predators\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화학적 비상 신호를 내보낼 것이라고\u003c/span>\u003cspan class=\"en\">will issue chemical alarm \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">calls \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 독특해서, 그들의 가까운 친족만 이해할 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">incredibly \u003c/span>\u003cspan class=\"tgt\">specific\u003c/span>—comprehensible only to their close kin\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 공격받는 드문 경우에\u003c/span>\u003cspan class=\"en\">—on the rare occasion they \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">attacked\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">연구자들은 포식자들로부터의 많은 위협 없이 평화로운 지역에 사는 미역취들이 그들이 공격받는 드문 경우에, 그들의 가까운 친족만 이해할 수 있는 매우 독특한 화학적 비상 신호를 내보낸다는 것을 최근에 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 평화로운 지역의 미역취는 공격받을 때 \u003cb class=\"key\">가까운 \u003c/b>\u003cb class=\"key\">친족만\u003c/b> 알아들을 수 있는 \u003cb class=\"key\">고도로 \u003c/b>\u003cb class=\"key\">특이적인 \u003c/b>\u003cb class=\"key\">화학 \u003c/b>\u003cb class=\"key\">경보\u003c/b>를 보낸다는 연구 결과를 제시합니다. 글의 시작에서 대조의 한 축을 설정하므로, 뒤에 나올 적대적 지역의 \u003cb class=\"key\">광범위한 \u003c/b>\u003cb class=\"key\">신호\u003c/b>와 비교되기 위한 기준이 됩니다. 'comprehensible only to their close kin'은 신호가 마치 \u003cb class=\"key\">암호\u003c/b>처럼 소수에게만 해독된다는 비유로 이해하면 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절)\u003c/span> : Researchers recently found + [that + 완전한 절] : \"미역취가 화학적 비상 신호를 내보낸다는 것을 발견했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사(goldenrods) + [that + 동사(live) ...] : \"평화로운 지역에 사는 미역취들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사(calls) + [that + be동사(are) + 형용사구] : \"매우 독특한 화학적 비상 신호\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사(are) + 과거분사(attacked) : \"공격받는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Researchers recently found that goldenrods, 연구자들은 최근에 발견했습니다, 미역취가. that live in peaceful areas without much threat from predators, 포식자들로부터의 많은 위협 없이 평화로운 지역에 사는. will issue chemical alarm calls, 화학적 비상 신호를 내보낼 것이라고. that are incredibly specific—comprehensible only to their close kin, 매우 독특해서, 그들의 가까운 친족만 이해할 수 있는. —on the rare occasion they are attacked, 그들이 공격받는 드문 경우에. 이 문장 전체를 해석하면, 연구자들은 포식자들로부터의 많은 위협 없이 평화로운 지역에 사는 미역취들이 그들이 공격받는 드문 경우에, 그들의 가까운 친족만 이해할 수 있는 매우 독특한 화학적 비상 신호를 내보낸다는 것을 최근에 발견했다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 평화로운 지역의 미역취가 공격을 받는 드문 경우에 화학적 비상 신호를 내보내는데, 그 신호가 아주 특이해서 오직 가까운 친족만 알아들을 수 있다는 연구 결과를 말합니다. 즉, 이 신호는 모든 이웃이 아니라 가까운 친족만 이해할 수 있는 맞춤형 암호에 가깝다는 뜻이에요. 글 전체에서 이 문장은 뒤에 나올 더 적대적인 지역의 신호 방식과 대조되는 기준을 세워 주는 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째 문장에서는 어법 포인트를 순서대로 짚어 볼게요. 먼저 found that goldenrods에서 that은 found의 목적어 역할을 하는 명사절을 이끄는 접속사입니다. 뒤에 완전한 절이 오고 있다는 점을 확인하세요. 다음으로 goldenrods that live에서 that은 선행사 goldenrods를 받는 주격 관계대명사이고, 뒤에 동사 live가 왔습니다. 세 번째로 calls that are incredibly specific에서도 that은 선행사 calls를 수식하는 주격 관계대명사입니다. 마지막으로 are attacked는 be동사와 과거분사가 결합한 수동태로, 주어가 공격을 당하는 의미임을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 더 적대적인 지역에 있는 미역취들은\u003c/span>\u003cspan class=\"en\">But goldenrods in more hostile territory\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 이웃들에게 신호를 보낸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">signal \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">neighbors \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화학적 표현을 사용하여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">chemical \u003c/span>\u003cspan class=\"tgt\">phrases\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 지역에 있는 모든 미역취에 의해 쉽게 이해되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">easily \u003c/span>\u003cspan class=\"tgt\">understood \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">goldenrod\u003c/span> in the area,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 생물학적 친족뿐만 아니라\u003c/span>\u003cspan class=\"en\">not just their biological kin.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 더 적대적인 지역에 있는 미역취들은 그들의 생물학적 친족뿐만 아니라 그 지역에 있는 모든 미역취에 의해 쉽게 이해되는 화학적 표현을 사용하여 그들의 이웃들에게 신호를 보낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 위협이 많은 곳의 미역취는 신호를 \u003cb class=\"key\">가까운 \u003c/b>\u003cb class=\"key\">친족\u003c/b>에게만 한정하지 않고 \u003cb class=\"key\">지역의 \u003c/b>\u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">미역취\u003c/b>가 이해하도록 보낸다는 사실을 보여 줍니다. 첫 문장의 \u003cb class=\"key\">맞춤형 \u003c/b>\u003cb class=\"key\">신호\u003c/b>와 반대되는, 개방적이고 공개적인 소통 방식입니다. 'not just their biological kin'이 덧붙어 친족뿐 아니라 \u003cb class=\"key\">불특정 \u003c/b>\u003cb class=\"key\">다수\u003c/b>가 수신자라는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사 using (분사구문)\u003c/span> : 주어(goldenrods) + 동사(signal) + [using + 목적어(chemical phrases)] : \"화학적 표현을 사용하여 이웃들에게 신호를 보낸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사(수동) 후치수식\u003c/span> : 선행사(chemical phrases) + [과거분사(understood) + by + 행위자] : \"모든 미역취에 의해 쉽게 이해되는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But goldenrods in more hostile territory, 하지만 더 적대적인 지역에 있는 미역취들은. signal to their neighbors, 그들의 이웃들에게 신호를 보낸다. using chemical phrases, 화학적 표현을 사용하여. easily understood by all the goldenrod in the area, 그 지역에 있는 모든 미역취에 의해 쉽게 이해되는. not just their biological kin, 그들의 생물학적 친족뿐만 아니라. 이 문장 전체를 해석하면, 하지만 더 적대적인 지역에 있는 미역취들은 그들의 생물학적 친족뿐만 아니라 그 지역에 있는 모든 미역취에 의해 쉽게 이해되는 화학적 표현을 사용하여 그들의 이웃들에게 신호를 보낸다.","hl":"m"},{"n":16,"text":"두 번째 문장은 첫 번째 문장과 정반대의 상황을 말합니다. 더 적대적인 지역에 사는 미역취들은 화학적 표현을 사용해서 이웃들에게 신호를 보내는데, 그 표현이 생물학적 친족만 이해하는 것이 아니라 그 지역의 모든 미역취가 쉽게 이해할 수 있다는 거예요. 그러니까 이들은 소수의 친족에 [standing ~ (현재분사 보어)] : \"들판에 혼자 서 있는 채로\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"When times are truly tough, 정말로 힘든 시기에는. you do not want, 여러분은 원하지 않는다. to be left, 남겨지기를. standing in a field alone, 들판에 혼자 서 있는 채로. 이 문장 전체를 해석하면, 정말로 힘든 시기에는, 여러분은 들판에 혼자 서 있는 채로 남겨지길 원하지 않는다.","hl":"m"},{"n":25,"text":"이 문장은 정말로 힘든 시기에는 누구도 들판에 혼자 남겨지고 싶어 하지 않는다는 비유적인 표현이에요. 앞서 화학적 교신이 도움이 된다는 내용을 인간의 처지에 빗대어서 고립이 생존에 불리하다는 점을 직관적으로 보여 주죠. 뒤에 짝짓기 상대와 꽃가루 매개자가 없다는 구체적 문제로 이어지는 연결고리 역할을 해요.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 When times are truly tough입니다. when이 이끄는 부사절이 주절 상황의 배경이 되는 시간적 조건을 제시해요. 두 번째 포인트는 to be left입니다. want는 to부정사를 목적어로 취하고, 주어 you가 남겨지는 수동 관계라서 to be p.p. 형태가 왔어요. 세 번째 포인트는 standing in a field alone입니다. leave가 목적어를 특정 상태로 남겨 두는 의미라서 수동태가 되면 be left standing처럼 현재분사가 보어 자리에 남아요. 들판에 혼자 서 있는 상태가 계속된다는 느낌을 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">짝짓기할 상대가 없을 것이다\u003c/span>\u003cspan class=\"en\">no one \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">mate \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꽃가루 매개자를 불러들이는 것을 도와줄 상대도 없을 것이다\u003c/span>\u003cspan class=\"en\">no one to \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">bring \u003c/span>\u003cspan class=\"tgt\">in\u003c/span> pollinators.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">짝짓기할 상대, 꽃가루 매개자를 불러들이는 것을 도와줄 상대도 없을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 혼자 남게 되면 \u003cb class=\"key\">짝짓기할 \u003c/b>\u003cb class=\"key\">상대\u003c/b>와 \u003cb class=\"key\">꽃가루 \u003c/b>\u003cb class=\"key\">매개자\u003c/b>를 불러들일 도움도 없을 것이라고 구체적으로 설명합니다. 생존에 필요한 번식과 화분 매개 과정이 무리 속에서 가능함을 보여 주며, 고립이 곧 생존 위협임을 강조합니다. there will be no one 구조가 반복되어 홀로 남았을 때의 \u003cb class=\"key\">막막함\u003c/b>을 리듬감 있게 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도 there 구문 (There + be)\u003c/span> : There + will be + 명사구 : \"있을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법 (전치사 with 남김)\u003c/span> : no one + [to mate with (to부정사구, 앞의 명사 수식)] : \"짝짓기할\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">help + 동사원형 (원형부정사)\u003c/span> : help + [bring in (원형부정사구)] : \"불러들이는 것을 돕다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"There will be, 있을 것이다. no one to mate with, 짝짓기할 상대가 없을 것이다. no one to help bring in pollinators, 꽃가루 매개자를 불러들이는 것을 도와줄 상대도 없을 것이다. 이 문장 전체를 해석하면, 짝짓기할 상대, 꽃가루 매개자를 불러들이는 것을 도와줄 상대도 없을 것이다.","hl":"m"},{"n":28,"text":"이 문장은 혼자 남게 되면 짝짓기할 상대가 없고, 꽃가루 매개자를 불러들일 도움도 없을 것이라고 구체적으로 설명해요. 생존에 필요한 번식과 화분 매개 과정이 무리 속에서 가능하다는 점을 보여 주면서 고립이 곧 생존 위협임을 강조하죠. there will be no one 구조가 반복되어 혼자 남았을 때의 막막함을 리듬감 있게 전달해요.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 There will be입니다. there는 의미 없이 문장을 이끄는 유도 부사이고, 실질 주어는 뒤에 오는 no one이에요. will be가 미래의 존재를 나타내죠. 두 번째 포인트는 to mate with입니다. to mate with가 앞의 no one을 수식하는 to부정사의 형용사적 용법이고, mate가 with를 필요로 하기 때문에 전치사 with가 뒤에 남아 있어요. 세 번째 포인트는 help bring in입니다. help는 뒤에 to부정사나 원형부정사를 모두 목적어로 취할 수 있는데, 여기서는 to 없이 bring을 썼고, bring in은 꽃가루 매개자를 끌어들인다는 뜻의 구동사예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>평화로운 지역의 \u003cb class=\"key\">미역취\u003c/b>는 공격받는 \u003cb class=\"key\">드문 \u003c/b>\u003cb class=\"key\">경우\u003c/b>에 \u003cb class=\"key\">가까운 \u003c/b>\u003cb class=\"key\">친족\u003c/b>만 이해할 수 있는 매우 \u003cb class=\"key\">독특한\u003c/b> 화학적 비상 신호를 내보낸다.\u003c/li>\u003cli>더 \u003cb class=\"key\">적대적인 \u003c/b>\u003cb class=\"key\">지역\u003c/b>의 미역취는 \u003cb class=\"key\">생물학적 \u003c/b>\u003cb class=\"key\">친족\u003c/b>뿐 아니라 그 지역의 모든 미역취가 이해하는 \u003cb class=\"key\">화학적 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로 신호를 보낸다.\u003c/li>\u003cli>이러한 \u003cb class=\"key\">화학적 \u003c/b>\u003cb class=\"key\">교신\u003c/b>은 받는 식물뿐 아니라 \u003cb class=\"key\">보내는 \u003c/b>\u003cb class=\"key\">식물\u003c/b>에게도 이롭다는 것이 처음으로 확인되었다.\u003c/li>\u003cli>정말로 힘든 시기에는 \u003cb class=\"key\">들판\u003c/b>에 혼자 남겨지면 \u003cb class=\"key\">짝짓기\u003c/b>할 상대나 \u003cb class=\"key\">꽃가루 \u003c/b>\u003cb class=\"key\">매개자\u003c/b>를 불러들일 도움을 받을 수 없다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Goldenrods adjust their chemical alarm signals according to environmental threat, and broadcasting warnings widely benefits both receiver and sender by preventing isolation in tough times.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">포식자 위협이 적은 평화로운 지역의 \u003cb class=\"key\">미역취\u003c/b>는 \u003cb class=\"key\">가까운 \u003c/b>\u003cb class=\"key\">친족\u003c/b>만 이해하는 특이적 화학 신호를 보내지만, 적대적 지역에서는 모든 미역취가 이해하도록 널리 알린다. 이러한 \u003cb class=\"key\">화학적 \u003c/b>\u003cb class=\"key\">교신\u003c/b>은 받는 식물과 \u003cb class=\"key\">보내는 \u003c/b>\u003cb class=\"key\">식물\u003c/b> 모두에게 이로우며, 힘든 시기에는 \u003cb class=\"key\">협력\u003c/b>이 생존에 필수적이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 지문의 핵심을 다시 정리하면, 미역취는 환경의 위협 정도에 따라 경고 신호의 범위를 조절합니다. 평화로운 지역에서는 가까운 친족만 이해하는 특이적 신호를, 적대적 지역에서는 모든 이웃이 이해하는 방송형 신호를 쓰죠. 이 화학적 교신은 받는 식물뿐 아니라 보내는 식물에게도 이로우며, 힘든 시기에는 혼자 남지 않고 협력하는 것이 중요하다는 교훈을 줍니다. 오늘 내용을 바탕으로 식물의 화학적 소통과 협력에 관한 어휘와 구조를 꼭 복습해 두세요. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
