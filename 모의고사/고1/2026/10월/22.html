<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 22번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 22번","audioDir":"22_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">22번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Time as a Social Invention\u003c/h1>\u003ch2>사회적 발명품으로서의 시간\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사회학자들은 시간 인식과 사용이 \u003cb class=\"key\">자연의 \u003c/b>\u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">속성\u003c/b>이나 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">심리 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이 아니라 \u003cb class=\"key\">전통과 \u003c/b>\u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">기준\u003c/b>에 의해 형성된 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">창조물\u003c/b>이라고 주장한다. 일주일, 출퇴근 시간, 월말 납부, 은퇴 연령 같은 숫자와 양식도 우리가 내면화하여 정상으로 받아들이는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">발명품\u003c/b>이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Our perception and use of time, including the seven-day week and everyday schedules like nine-to-five work, is not fixed by nature or individual psychology but is socially constructed and internalized as normal.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 우리가 당연하게 여기는 시간의 기준이 사실은 사회가 만든 것이라는 내용입니다. 사회학자들의 주장을 따라가면서 시간 인식과 사용이 자연이나 개인의 심리가 아니라 전통과 문화적 기준에 의해 형성된다는 점을 확인해 보겠습니다. 요약하자면, 일주일이나 출퇴근 시간 같은 숫자와 양식은 우리가 내면화하여 정상으로 받아들인 사회적 창조물이라는 겁니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 매일 지키는 시간표는 마치 자연이 정해 준 것처럼 느껴지지만, 사회학에서는 이를 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">구성물\u003c/b>(social construction)이라고 봅니다. 시간 인식은 단순한 물리적 실재가 아니라 집단이 공유하는 \u003cb class=\"key\">규범\u003c/b>(norm)과 \u003cb class=\"key\">관습\u003c/b>(custom)의 산물이에요. 특히 일주일 단위는 종교와 노동 관행에 따라 문화마다 다르게 발달해 왔고, Eviatar Zerubavel의 The Seven Day Circle은 일주일이 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">발명품\u003c/b>(social invention)임을 보여 줍니다. 예를 들어 학교 시간표가 방학이 되면 무의미해지는 것처럼, 우리가 당연하게 여기는 시간 구획도 공동체가 약속한 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">기준\u003c/b>(cultural norms)에 불과할 수 있어요. 따라서 정상적인 일과와 휴일의 구분은 \u003cb class=\"key\">자연의 \u003c/b>\u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">속성\u003c/b>(basic properties of nature)이라기보다 사회적으로 학습된 결과입니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 우리가 매일 지키는 시간표나 일과를 생각해 보세요. 자연이 정해 준 것처럼 느껴지지만 사회학에서는 이를 사회적 구성물이라고 봅니다. 시간 인식은 물리적 실재가 아니라 집단이 공유하는 규범과 관습의 산물이에요. 특히 일주일 단위는 종교와 노동 관행에 따라 문화마다 다르게 발달해 왔고, Eviatar Zerubavel의 The Seven Day Circle은 일주일이 사회적 발명품임을 보여 줍니다. 학교 시간표가 방학이 되면 무의미해지는 것처럼, 우리가 당연하게 여기는 시간 구획도 공동체가 약속한 문화적 기준에 불과할 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>전통·문화의 형성\u003csmall>주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>사회학자들은 시간 인식과 시간 사용이 \u003cb class=\"key\">자연의 \u003c/b>\u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">속성\u003c/b>이나 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">심리 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이 아니라고 봅니다. 오히려 우리가 시간을 인식하고 이해하는 방식은 \u003cb class=\"key\">전통과 \u003c/b>\u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">기준\u003c/b>에 의해 형성된다고 주장합니다. 이는 시간이 단순한 시계의 흐름이 아니라 사회적 산물임을 시사합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>일주일의 사례\u003csmall>근거 · 문장 3\u003c/small>\u003c/h4>\u003cp>Zerubavel의 저서 The Seven Day Circle은 일주일이 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">발명품\u003c/b>임을 보여 줍니다. 일주일이라는 기본 단위도 문화마다 달라서 사람들이 활동과 삶의 리듬을 \u003cb class=\"key\">구조화\u003c/b>하는 방식에 영향을 끼칩니다. 이 근거는 시간 단위가 자연적 필연이 아님을 뒷받침합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>일상의 숫자들\u003csmall>예시 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>아홉 시부터 다섯 시까지 일하는 직업을 일상으로 여기는 이유, 주말에 일하지 않는 이유, 월말에 고지 금액을 납부하는 이유, 은퇴 연령이 예순다섯 살인 이유는 자연이 정한 것이 아닙니다. 이러한 질문들은 우리가 당연하게 여기는 \u003cb class=\"key\">숫자와 \u003c/b>\u003cb class=\"key\">양식\u003c/b>이 사회적으로 만들어졌음을 드러냅니다. 이처럼 우리의 일상 리듬은 \u003cb class=\"key\">관습\u003c/b>과 \u003cb class=\"key\">제도\u003c/b>의 영향을 받습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>내면화된 정상\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>글은 이 숫자와 양식이 \u003cb class=\"key\">자연\u003c/b>이나 \u003cb class=\"key\">본질적 \u003c/b>\u003cb class=\"key\">특성\u003c/b>에 의해 좌우되는 것이 아니라 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">창조물\u003c/b>이라고 결론 내립니다. 우리는 이것을 \u003cb class=\"key\">내면화\u003c/b>하여 정상으로 받아들이게 됩니다. 따라서 시간 관련 관행은 사회적 합의의 산물입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼게요. 처음 주장, 일주일 근거, 일상의 숫자 예시, 마지막 결론 순서로 전개됩니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 사회학자들의 주장이 나옵니다. 시간 인식과 시간 사용이 자연의 기본 속성이나 개인적 심리 현상이 아니라고 하죠. 오히려 우리가 시간을 인식하고 이해하는 방식은 전통과 문화적 기준에 의해 형성된다고 말합니다. 이 부분이 글 전체의 핵심 주장입니다.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 Eviatar Zerubavel의 저서를 근거로 듭니다. The Seven Day Circle이라는 책은 일주일이 사회적 발명품임을 보여 줘요. 일주일이라는 기본 단위도 문화마다 달라서 사람들이 활동과 삶의 리듬을 구조화하는 방식에 영향을 끼친다는 겁니다.","hl":"f1"},{"n":6,"text":"네 번째부터 일곱 번째 문장까지는 일상의 숫자들을 질문으로 던집니다. 아홉 시부터 다섯 시까지 일하는 직업을 일상으로 여기는 이유, 주말에 일하지 않는 이유, 월말에 고지 금액을 납부하는 이유, 은퇴 연령이 예순다섯 살인 이유를 물어보죠. 이런 질문들은 우리가 당연하게 여기는 숫자와 양식이 사회적으로 만들어졌음을 드러냅니다.","hl":"f2"},{"n":7,"text":"마지막 여덟 번째 문장은 결론입니다. 이 숫자와 양식은 자연이나 본질적 특성에 의해 좌우되는 것이 아니라 사회적 창조물이라고 정리해요. 우리는 이것을 내면화하여 정상으로 받아들이게 된다는 겁니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 처음 두 문장에서 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">인식\u003c/b>이 자연이나 심리가 아니라 \u003cb class=\"key\">전통과 \u003c/b>\u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">기준\u003c/b>에 의해 형성된다는 주장을 제시합니다. 이어서 Zerubavel의 일주일 연구를 \u003cb class=\"key\">근거\u003c/b>로 들고, 아홉 시 출근과 은퇴 연령 같은 \u003cb class=\"key\">예시\u003c/b>를 통해 주장을 뒷받침합니다. 마지막 문장에서 이러한 숫자와 양식이 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">창조물\u003c/b>임을 다시 강조하며 마무리합니다. 따라서 주장을 먼저 제시하고 근거로 뒷받침하는 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Instead (2)\u003c/b>\u003cspan>앞의 부정에 대한 대조·반전\u003c/span>\u003cb>Why do we (4)\u003c/b>\u003cspan>구체적 예시를 끌어내는 질문\u003c/span>\u003cb>These numbers and patterns (8)\u003c/b>\u003cspan>앞의 예시를 가리키며 결론 이끔\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">our perception and usage of time\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">how we perceive and understand time\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the week\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">These numbers and patterns\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>자연·심리적 시간\u003c/th>\u003cth>사회적 구성물\u003c/th>\u003c/tr>\u003ctr>\u003ctd>자연의 기본 속성\u003c/td>\u003ctd>전통과 문화적 기준\u003c/td>\u003c/tr>\u003ctr>\u003ctd>개인 경험의 심리 현상\u003c/td>\u003ctd>사회적 발명품\u003c/td>\u003c/tr>\u003ctr>\u003ctd>배경의 시계처럼 째깍거림\u003c/td>\u003ctd>내면화된 사회적 창조물\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거의 구조입니다. 처음 두 문장에서 시간 인식이 전통과 문화적 기준에 의해 형성된다는 주장을 먼저 제시해요. 이어서 일주일 연구를 근거로 들고, 일상의 숫자 예시로 뒷받침합니다. 마지막에 같은 주장을 재진술하는 두괄식 구조라고 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"신호어를 살펴볼게요. 두 번째 문장의 Instead는 앞의 부정을 뒤집는 대조와 반전의 신호입니다. 네 번째 문장부터 반복되는 Why do we는 구체적 예시를 끌어내는 질문이에요. 마지막 문장의 These numbers and patterns는 앞의 예시를 가리키며 결론을 이끄는 표현입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>perception\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인식\u003c/span>\u003c/div>\u003cdiv>\u003cb>usage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사용\u003c/span>\u003c/div>\u003cdiv>\u003cb>properties\u003c/b>\u003cem>명사\u003c/em>\u003cspan>속성\u003c/span>\u003c/div>\u003cdiv>\u003cb>ticking away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>째깍거리며 흘러가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>psychological\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>심리적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>phenomena\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현상\u003c/span>\u003c/div>\u003cdiv>\u003cb>Instead\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오히려\u003c/span>\u003c/div>\u003cdiv>\u003cb>perceive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>to a large degree\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>상당한 정도로\u003c/span>\u003c/div>\u003cdiv>\u003cb>shaped\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>형성된\u003c/span>\u003c/div>\u003cdiv>\u003cb>tradition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전통\u003c/span>\u003c/div>\u003cdiv>\u003cb>cultural norms\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>문화적 기준\u003c/span>\u003c/div>\u003cdiv>\u003cb>fundamental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>근본적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>unit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단위\u003c/span>\u003c/div>\u003cdiv>\u003cb>social invention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회적 발명품\u003c/span>\u003c/div>\u003cdiv>\u003cb>varies\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>influencing\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치면서\u003c/span>\u003c/div>\u003cdiv>\u003cb>structure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구조화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rhythms\u003c/b>\u003cem>명사\u003c/em>\u003cspan>리듬\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nine-to-five job routine\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>9시부터 5시까지 일하는 직업의 일상\u003c/span>\u003c/div>\u003cdiv>\u003cb>weekends\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주말\u003c/span>\u003c/div>\u003cdiv>\u003cb>pay bills\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>고지 금액을 납부하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>retirement age\u003c/b>\u003cem>명사\u003c/em>\u003cspan>은퇴 연령\u003c/span>\u003c/div>\u003cdiv>\u003cb>dictated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>좌우되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>essential\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>본질적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>characteristic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특성\u003c/span>\u003c/div>\u003cdiv>\u003cb>social creations\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회적 창조물\u003c/span>\u003c/div>\u003cdiv>\u003cb>internalize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>내면화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>normal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정상적인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 어휘를 몇 개 짚어 볼게요. perception은 인식, usage는 사용이라는 뜻이고, social invention은 사회적 발명품, social creations는 사회적 창조물입니다. 마지막의 internalize는 내면화하다라는 뜻으로, 사회적 기준을 자기 안에 받아들이는 과정을 나타내요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">perception\u003c/b>\u003cspan class=\"m\">인식\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">awareness\u003c/span>\u003cspan class=\"s\">understanding\u003c/span>\u003cspan class=\"s\">cognition\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignorance\u003c/span>\u003cspan class=\"a\">misunderstanding\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fundamental\u003c/b>\u003cspan class=\"m\">근본적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">basic\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">primary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">secondary\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">varies\u003c/b>\u003cspan class=\"m\">다르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">differs\u003c/span>\u003cspan class=\"s\">changes\u003c/span>\u003cspan class=\"s\">fluctuates\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stabilizes\u003c/span>\u003cspan class=\"a\">remains\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">essential\u003c/b>\u003cspan class=\"m\">본질적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">necessary\u003c/span>\u003cspan class=\"s\">vital\u003c/span>\u003cspan class=\"s\">indispensable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">optional\u003c/span>\u003cspan class=\"a\">inessential\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">normal\u003c/b>\u003cspan class=\"m\">정상적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">usual\u003c/span>\u003cspan class=\"s\">typical\u003c/span>\u003cspan class=\"s\">conventional\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abnormal\u003c/span>\u003cspan class=\"a\">unusual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">internalize\u003c/b>\u003cspan class=\"m\">내면화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">absorb\u003c/span>\u003cspan class=\"s\">adopt\u003c/span>\u003cspan class=\"s\">assimilate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">externalize\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 정리해 둡시다. perception은 awareness나 understanding과 바꿔 쓸 수 있고, 반대는 ignorance나 misunderstanding입니다. fundamental은 basic이나 essential과 통하고 반대는 secondary나 minor예요. normal은 usual, typical, conventional과 유사하고, abnormal이나 unusual와 반대입니다. essential은 necessary, vital, indispensable과 유사하고 optional이나 inessential과 반대가 됩니다. internalize는 absorb나 adopt과 유사하고 externalize와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회학자들은 주장한다\u003c/span>\u003cspan class=\"en\">Sociologists argue\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간에 대한 우리의 인식과 시간 사용이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">perception \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">usage \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순히 자연의 기본적인 속성이 아니고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">basic \u003c/span>\u003cspan class=\"tgt\">properties \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">nature, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배경에서 째깍거리며 흘러가는 시계처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">clock \u003c/span>\u003cspan class=\"tgt\">ticking \u003c/span>\u003cspan class=\"tgt\">away \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">background, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 단순히 개인적 경험의 심리적 현상도 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">nor \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">simply \u003c/span>\u003cspan class=\"tgt\">psychological \u003c/span>\u003cspan class=\"tgt\">phenomena \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인적 경험의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">individual \u003c/span>\u003cspan class=\"tgt\">experience\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사회학자들은 시간에 대한 우리의 인식과 시간 사용이 배경에서 째깍거리며 흘러가는 시계처럼 단순히 자연의 기본적인 속성도 아니고, 단순히 개인적 경험의 심리적 현상도 아니라고 주장한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사회학자들의 주장을 제시하며 시간이 단순한 \u003cb class=\"key\">자연적 \u003c/b>\u003cb class=\"key\">속성\u003c/b>이나 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">심리 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이 아니라고 부정합니다. 배경에서 흘러가는 시계라는 비유는 시간을 객관적 자연 현상으로 보는 관점을 반박합니다. 글 전체의 도입부로, 다음 문장에서 긍정적으로 제시할 \u003cb class=\"key\">사회문화적 \u003c/b>\u003cb class=\"key\">형성\u003c/b>의 논리를 준비하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that절 (명사절) - 목적어\u003c/span> : argue + [that + 주어 + 동사 ... (명사절, 목적어)] : \"시간에 대한 우리의 인식과 시간 사용이 ... 아니라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사(구)의 명사 수식\u003c/span> : [a clock] + [ticking away in the background (현재분사구)] : \"배경에서 째깍거리며 흘러가는 시계\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정어 nor에 의한 도치\u003c/span> : nor + [are] + [they] + [simply psychological phenomena ...] : \"또한 단순히 개인적 경험의 심리적 현상도 아니다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Sociologists argue, 사회학자들은 주장한다. that our perception and usage of time, 시간에 대한 우리의 인식과 시간 사용이. are not just basic properties of nature, 단순히 자연의 기본적인 속성이 아니고. like a clock ticking away in the background, 배경에서 째깍거리며 흘러가는 시계처럼. nor are they simply psychological phenomena, 또한 단순히 개인적 경험의 심리적 현상도 아니다. of individual experience, 개인적 경험의. 이 문장 전체를 해석하면, 사회학자들은 시간에 대한 우리의 인식과 시간 사용이 배경에서 째깍거리며 흘러가는 시계처럼 단순히 자연의 기본적인 속성도 아니고, 단순히 개인적 경험의 심리적 현상도 아니라고 주장한다.","hl":"m"},{"n":13,"text":"이 문장은 사회학자들이 시간에 대한 인식과 사용이 그냥 자연의 속성도 아니고 개인의 심리 현상도 아니라고 주장하는 부분이에요. 시계가 배경에서 째깍거리는 이미지는 시간을 객관적이고 자연적인 것으로 보는 시각을 반박하는 거죠. 이렇게 부정을 먼저 제시하면서 다음 문장에서 진짜 주장인 사회문화적 형성을 끌어내는 도입 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 that절이에요. Sociologists argue 다음에 that our perception and usage of time are not just basic properties of nature부터 이어지는 that절이 argue의 목적어로 쓰여서 사회학자들이 주장하는 내용을 통째로 연결해 줍니다. 두 번째 포인트는 a clock ticking away in the background인데요, 여기서 ticking away는 a clock을 수식하는 현재분사구입니다. which ticks away로 바꿔도 뜻이 통하고 시계가 스스로 움직이는 능동의 의미라서 현재분사를 썼어요. 세 번째 포인트는 nor are they simply psychological phenomena of individual experience 부분이에요. nor라는 부정어가 문장 앞에 나와서 주어 they와 동사 are가 도치된 형태입니다. nor가 부정어이기 때문에 are they처럼 동사가 주어보다 앞선 어순이 된 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오히려\u003c/span>\u003cspan class=\"en\">Instead,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 시간을 인식하고 이해하는 방식은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">perceive \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">understand \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상당한 정도로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">large \u003c/span>\u003cspan class=\"tgt\">degree \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전통과 문화적 기준에 의해 형성된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">shaped \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">tradition \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">cultural \u003c/span>\u003cspan class=\"tgt\">norms\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오히려 우리가 시간을 인식하고 이해하는 방식은 상당한 정도로 전통과 문화적 기준에 의해 형성된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 부정을 반전시켜 시간 인식과 이해 방식이 \u003cb class=\"key\">전통과 \u003c/b>\u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">기준\u003c/b>에 의해 크게 형성된다는 글의 핵심 주장을 제시합니다. 즉 시간은 자연적 속성이나 개인 심리 현상이 아니라 \u003cb class=\"key\">사회문화적 \u003c/b>\u003cb class=\"key\">산물\u003c/b>이라는 입장입니다. 글 전체의 \u003cb class=\"key\">주제문\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (how절) - 주어 역할\u003c/span> : how + [we] + [perceive and understand] + [time] (간접의문문, 주어) : \"우리가 시간을 인식하고 이해하는 방식\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (be + 과거분사 + by 행위자)\u003c/span> : [is] + [shaped] + [by + tradition and cultural norms] (수동태) : \"전통과 문화적 기준에 의해 형성된다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Instead, 오히려. how we perceive and understand time, 우리가 시간을 인식하고 이해하는 방식은. is to a large degree, 상당한 정도로. shaped by tradition and cultural norms, 전통과 문화적 기준에 의해 형성된다. 이 문장 전체를 해석하면, 오히려 우리가 시간을 인식하고 이해하는 방식은 상당한 정도로 전통과 문화적 기준에 의해 형성된다.","hl":"m"},{"n":16,"text":"이 문장은 앞 문장과 반대로 시간 인식과 이해 방식이 전통과 문화적 기준에 의해 크게 형성된다는 핵심 주장을 하고 있어요. 즉 시간은 자연적 속성이나 개인 심리 현상이 아니라 사회문화적 산물이라는 거죠. 글 전체에서 가장 중심이 되는 주제문으로 보시면 됩니다.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 how we perceive and understand time이에요. how가 이끄는 간접의문문이 문장의 주어 역할을 하고 있고, 안쪽 어순은 we perceive처럼 주어 다음에 동사가 오는 평서문 순서입니다. 두 번째 포인트는 is shaped by tradition and cultural norms인데요, 수동태입니다. 주어인 how절이 형성되는 대상이기 때문에 be동사와 과거분사 shaped를 썼고 by 뒤에 행위자가 나옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Eviatar Zerubavel의 저서인 The Seven Day Circle: The History and Meaning of the Week는\u003c/span>\u003cspan class=\"en\">Eviatar Zerubavel's work, The Seven Day Circle: The History and Meaning of the Week,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 일주일이 그런지 보여 준다\u003c/span>\u003cspan class=\"en\">demonstrates \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">week, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간의 기본 단위인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">fundamental \u003c/span>\u003cspan class=\"tgt\">unit \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">time, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적 발명품인지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">invention\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문화마다 다른\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">varies \u003c/span>\u003cspan class=\"tgt\">across \u003c/span>\u003cspan class=\"tgt\">cultures\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 그들의 활동과 삶의 리듬을 구조화하는 방식에 영향을 끼치면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">influencing \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">structure \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">activities \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">rhythms \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Eviatar Zerubavel의 저서인 The Seven Day Circle: The History and Meaning of the Week는 어떻게 시간의 기본 단위인 일주일이 사람들이 그들의 활동과 삶의 리듬을 구조화하는 방식에 영향을 끼치면서 문화마다 다른 사회적 발명품인지를 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Zerubavel의 저서를 예로 들어 시간의 기본 단위인 \u003cb class=\"key\">일주일\u003c/b>이 자연적 현상이 아니라 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">발명품\u003c/b>이며 문화마다 다르다는 사실을 보여 줍니다. 이는 앞 문장에서 주장한 시간에 대한 \u003cb class=\"key\">사회문화적 \u003c/b>\u003cb class=\"key\">형성\u003c/b>을 뒷받침하는 구체적인 \u003cb class=\"key\">예시\u003c/b> 역할을 합니다. 또한 그 발명품이 사람들의 활동과 삶의 리듬에 영향을 준다는 결과까지 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (how절) - 목적어\u003c/span> : demonstrates + [how + 주어 + 동사 ... (간접의문문, 목적어)] : \"어떻게 일주일이 ... 사회적 발명품인지를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격 (appositive)\u003c/span> : [the week] + [,] + [a fundamental unit of time] + [,] (동격) : \"시간의 기본 단위\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that절\u003c/span> : [a social invention] + [that] + [varies] + [across cultures] (관계대명사절) : \"문화마다 다른 사회적 발명품\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">현재분사구 (부사적 용법 - 결과)\u003c/span> : [influencing how people structure their activities and rhythms of life] (현재분사구) : \"사람들이 그들의 활동과 삶의 리듬을 구조화하는 방식에 영향을 끼치면서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Eviatar Zerubavel's work, The Seven Day Circle: The History and Meaning of the Week, Eviatar Zerubavel의 저서인 The Seven Day Circle: The History and Meaning of the Week는. demonstrates how the week, 어떻게 일주일이 그런지 보여 준다. a fundamental unit of time, 시간의 기본 단위인. is a social invention, 사회적 발명품인지. that varies across cultures, 문화마다 다른. influencing how people structure their activities and rhythms of life, 사람들이 그들의 활동과 삶의 리듬을 구조화하는 방식에 영향을 끼치면서. 이 문장 전체를 해석하면, Eviatar Zerubavel의 저서인 The Seven Day Circle: The History and Meaning of the Week는 어떻게 시간의 기본 단위인 일주일이 사람들이 그들의 활동과 삶의 리듬을 구조화하는 방식에 영향을 끼치면서 문화마다 다른 사회적 발명품인지를 보여 준다.","hl":"m"},{"n":19,"text":"이 문장은 Zerubavel의 책을 통해 일주일이라는 시간 단위가 자연의 산물이 아니라 사회적 발명품이며 문화마다 다르다는 걸 보여 줍니다. 앞 문장에서 말한 시간의 사회문화적 형성을 구체적인 예시로 뒷받침하는 역할이에요. 동시에 그 발명품이 사람들의 활동과 삶의 리듬을 구조화하는 데 영향을 준다는 결과까지 덧붙입니다.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 how the week, a fundamental unit of time, is a social invention인데요, how가 이끄는 간접의문문이 demonstrates의 목적어로 쓰였습니다. 절 안은 the week is a social invention이라는 평서문 어순입니다. 두 번째 포인트는 a fundamental unit of time이에요, 앞의 the week를 다시 설명하는 동격으로 양쪽 쉼표가 있습니다. 세 번째 포인트는 that varies across cultures인데, that은 a social invention을 선행사로 받는 주격 관계대명사입니다. 네 번째 포인트는 influencing how people structure their activities and rhythms of life로, 주절의 결과를 나타내는 현재분사구문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 우리는 ~로 여기는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">we\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">consider \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">9시부터 5시까지 일하는 직업을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">nine-to-five \u003c/span>\u003cspan class=\"tgt\">job \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상적인 것으로?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">routine\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 우리는 9시부터 5시까지 일하는 직업을 일상적인 것으로 여기는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 우리가 당연하게 여기는 \u003cb class=\"key\">9시 \u003c/b>\u003cb class=\"key\">출근 \u003c/b>\u003cb class=\"key\">5시 \u003c/b>\u003cb class=\"key\">퇴근\u003c/b> 직업 패턴이 자연의 법칙이 아니라 사회적으로 만들어진 관습임을 보여주는 예시 질문이에요. 'nine-to-five job routine'은 '9시부터 5시까지 일하는 직업을 \u003cb class=\"key\">일상적인 \u003c/b>\u003cb class=\"key\">것\u003c/b>으로 여기는 것'으로, 이런 규칙이 왜 생겼는지 의문을 던져 다음 문장의 핵심 주장을 이끌어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 의문문의 어순\u003c/span> : Why + do + 주어 + 동사원형 ...? : \"왜 우리는 ~하는가?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">consider + 목적어 + 목적격 보어 (5형식)\u003c/span> : consider + [a nine-to-five job] + [routine] : \"9시부터 5시까지 일하는 직업을 일상적인 것으로 여기다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Why do we consider, 왜 우리는 ~로 여기는가. a nine-to-five job, 9시부터 5시까지 일하는 직업을. routine?, 일상적인 것으로?. 이 문장 전체를 해석하면, 왜 우리는 9시부터 5시까지 일하는 직업을 일상적인 것으로 여기는가?","hl":"m"},{"n":22,"text":"이 문장은 우리가 당연하게 여기는 nine to five job routine, 즉 아홉 시 출근 다섯 시 퇴근 직업 패턴이 자연의 법칙이 아니라 사회적으로 만들어진 관습임을 보여주는 예시 질문이에요. 여기서 consider는 목적어와 목적격 보어를 취하는 오형식 동사라서 a nine-to-five job을 routine으로 여기는 구조예요. 이런 질문을 던짐으로써 다음에 이어지는 핵심 주장을 이끌어요.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 Why do we 부분이에요. 일반동사 현재 시제 의문문은 조동사 do를 주어 앞에 두고 본동사는 원형을 써서 이유를 묻는 구조입니다. 두 번째 포인트는 consider a nine-to-five job routine인데요, consider는 목적어와 목적격 보어를 가지는 오형식 동사예요. a nine-to-five job을 routine으로 여기는 구조라서 아홉 시부터 다섯 시까지 일하는 직업을 일상적인 것으로 여기다가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 우리 중 많은 사람이 일하지 않는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주말마다?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">weekends\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 우리 중 많은 사람은 주말마다 일하지 않는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주말에 일하지 않는 관행도 자연스러운 것이 아니라 특정 사회에서 \u003cb class=\"key\">내면화된 \u003c/b>\u003cb class=\"key\">관습\u003c/b>임을 드러내는 두 번째 예시 질문이에요. 'on the weekends'는 반복되는 주말을 가리키며, 많은 사람이 주말에 쉬는 것이 결코 \u003cb class=\"key\">본질적인 \u003c/b>\u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">특성\u003c/b>이 아님을 암시해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 부정 의문문\u003c/span> : Why + don't/doesn't + 주어 + 동사원형 ...? : \"왜 우리 중 많은 사람이 일하지 않는가?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 on + the weekends\u003c/span> : on + [the weekends] : \"주말마다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Why don't many of us work, 왜 우리 중 많은 사람이 일하지 않는가. on the weekends?, 주말마다?. 이 문장 전체를 해석하면, 왜 우리 중 많은 사람은 주말마다 일하지 않는가?","hl":"m"},{"n":25,"text":"이 문장은 주말에 일하지 않는 관행도 자연스러운 것이 아니라 특정 사회에서 내면화된 관습임을 드러내는 두 번째 예시 질문이에요. many of us는 우리 중 많은 사람이라는 뜻이고, on the weekends는 반복되는 주말을 가리켜요. 많은 사람이 주말에 쉬는 것이 결코 본질적인 인간 특성이 아님을 암시해요.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 Why don't many of us work 부분이에요. do not의 축약 don't가 주어 앞에 와서 부정 의문문을 만들고 본동사 work는 원형을 유지해요. 두 번째 포인트는 on the weekends인데, 주말처럼 반복되는 시기를 나타낼 때 전치사 on을 써요. the가 붙어서 반복되는 주말을 가리킵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 우리는 대개 납부하는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">usually \u003c/span>\u003cspan class=\"tgt\">pay \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고지 금액을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">bills\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">월말에?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">end \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">month\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 우리는 대개 월말에 고지 금액을 납부하는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 월말에 고지 금액을 납부하는 것도 사회가 정한 \u003cb class=\"key\">주기적 \u003c/b>\u003cb class=\"key\">리듬\u003c/b>일 뿐 자연이 정한 필연이 아님을 보여주는 세 번째 예시 질문이에요. 'pay our bills at the end of the month'는 경제 활동에서도 시간 관념이 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">창조물\u003c/b>임을 뒷받침해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 의문문과 빈도부사의 위치\u003c/span> : Why + do + 주어 + [usually] + 동사원형 + 목적어? : \"왜 우리는 대개 고지 금액을 납부하는가?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 at + the end of ~\u003c/span> : at + [the end of the month] : \"월말에\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Why do we usually pay, 왜 우리는 대개 납부하는가. our bills, 고지 금액을. at the end of the month?, 월말에?. 이 문장 전체를 해석하면, 왜 우리는 대개 월말에 고지 금액을 납부하는가?","hl":"m"},{"n":28,"text":"이 문장은 월말에 고지 금액을 납부하는 것도 사회가 정한 주기적 리듬일 뿐 자연이 정한 필연이 아님을 보여주는 세 번째 예시 질문이에요. pay our bills는 고지 금액을 납부하다는 뜻이고, at the end of the month는 월말이라는 시간 표현이에요. 경제 활동에서도 시간 관념이 사회적 창조물임을 뒷받침해요.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 Why do we usually pay our bills 부분이에요. 일반동사 현재 의문문은 do를 쓰고 빈도부사 usually는 do 뒤 본동사 pay 앞에 위치해요. 두 번째 포인트는 at the end of the month인데, at the end of는 어떤 기간의 끝이나 말을 나타내는 시간 표현이라서 월말이라고 해석해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">은퇴 연령은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">retirement \u003c/span>\u003cspan class=\"tgt\">age \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">65세인가?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">sixty-five\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 은퇴 연령은 65세인가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞선 질문들과 함께 시간과 관련된 사회적 관습을 나열하는 \u003cb class=\"key\">수사 \u003c/b>\u003cb class=\"key\">의문문\u003c/b>입니다. 은퇴 연령 65세가 자연이나 인간 본성이 아니라 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">약속\u003c/b>임을 드러내기 위한 예시로, 뒤따르는 문장 8의 '사회적 창조물'이라는 주장을 이끌어내는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 의문문 (Why + be동사 + 주어 + 보어)\u003c/span> : Why + be동사(is) + 주어(the retirement age) + 주격 보어(sixty-five) : \"왜 은퇴 연령이 65세인가요?\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Why, 왜. is the retirement age, 은퇴 연령은. sixty-five?, 65세인가?. 이 문장 전체를 해석하면, 왜 은퇴 연령은 65세인가?","hl":"m"},{"n":31,"text":"이 문장은 아홉 시 출근 다섯 시 퇴근, 주말 휴식, 월말 결제 같은 질문들과 이어지는 수사 의문문이에요. 정말 답을 몰라서 묻는 것이 아니라 은퇴 연령 65세가 자연의 법칙이나 인간의 본성이 아니라 사회적으로 만들어진 기준이라는 점을 드러내려는 거죠. 그래서 뒤에 나올 사회적 창조물이라는 핵심 주장을 이끌어내는 역할을 합니다.","hl":"mn"},{"n":32,"text":"이 문장의 어법 포인트는 의문사 Why가 문장 맨 앞에 오면서 be동사 is가 주어 the retirement age 앞에 오는 의문문 어순이에요. 보통 평서문은 The retirement age is sixty-five.인데, Why를 붙여 물어볼 때는 Why is the retirement age sixty-five?가 되는 거죠. 여기서 sixty-five는 주어의 상태나 나이를 설명하는 주격 보어로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 숫자와 양식은\u003c/span>\u003cspan class=\"en\">These numbers and patterns\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로 좌우되지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">aren't \u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">dictated \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연이나 인간의 어떤 본질적인 특성에 의해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">nature\u003c/span> or any essential human characteristic,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오히려 사회적 창조물이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">creations\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 내면화하고 결국 받아들이게 되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">internalize \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">accept\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘기준’으로\u003c/span>\u003cspan class=\"en\">as &quot;normal.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 숫자와 양식은 실제로 자연이나 인간의 어떤 본질적인 특성에 의해 좌우되는 것이 아니라, 오히려 우리가 내면화하여 결국 ‘기준’으로 받아들이게 된 사회적 창조물이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 문장 4~7에서 열거한 시간 관련 관습들이 자연이나 인간 본성이 아니라 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">창조물\u003c/b>임을 요약하는 핵심 문장입니다. internalize와 come to accept as normal은 사람들이 사회적 규칙을 당연한 \u003cb class=\"key\">기준\u003c/b>으로 받아들인다는 의미로, 글 전체 주제인 시간의 사회적 구성을 명시적으로 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + p.p. + by 행위자)\u003c/span> : be동사(aren't) + really + p.p.(dictated) + by + 행위자(nature) : \"실제로 자연에 의해 좌우되지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">not A but B (오히려 B)\u003c/span> : not A(aren't really dictated by nature...) + but B(are rather social creations) : \"오히려 사회적 창조물이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : 선행사(social creations) + that(목적격) + 주어(we) + 동사(internalize) : \"우리가 내면화하고 결국 받아들이게 되는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"These numbers and patterns, 이러한 숫자와 양식은. aren't really dictated, 실제로 좌우되지 않는다. by nature or any essential human characteristic, 자연이나 인간의 어떤 본질적인 특성에 의해. but are rather social creations, 오히려 사회적 창조물이다. that we internalize and come to accept, 우리가 내면화하고 결국 받아들이게 되는. as \"normal.\", ‘기준’으로. 이 문장 전체를 해석하면, 이러한 숫자와 양식은 실제로 자연이나 인간의 어떤 본질적인 특성에 의해 좌우되는 것이 아니라, 오히려 우리가 내면화하여 결국 ‘기준’으로 받아들이게 된 사회적 창조물이다.","hl":"m"},{"n":34,"text":"이 문장은 앞에서 던진 질문들, 특히 은퇴 연령 65세 같은 숫자와 패턴에 대한 답을 정리하는 핵심 문장이에요. 이런 것들은 자연이나 인간의 본질적인 특성이 정해 준 게 아니라 우리가 사회적으로 만들어서 내면화한 거라고 말하죠. 결국 당연하게 여기는 기준이 사실은 사회적 창조물이라는 게 이 문장의 요지입니다.","hl":"mn"},{"n":35,"text":"이 문장의 어법 포인트는 세 가지예요. 첫 번째, aren't really dictated by nature에서 be동사에 과거분사 dictated가 결합된 수동태가 쓰였어요. by가 행위 주체 자연을 데려와서 자연에 의해 좌우되지 않는다는 뜻을 만듭니다. 두 번째, 앞의 부정어 aren't와 but are rather social creations가 연결된 not A but B 구조예요. 자연에 의해 지배받는 게 아니라 오히려 사회적 창조물이라는 대조를 보여 주며 rather가 그 의미를 강조합니다. 세 번째, social creations를 수식하는 that we internalize and come to accept에서 that은 목적격 관계대명사예요. that이 동사 internalize와 accept의 목적어 역할을 하면서 창조물이 내면화되고 받아들여지는 대상임을 나타냅니다. come to accept는 점차 어떤 상태에 이르게 된다는 관용 표현으로 봐도 좋아요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사회학자들은 시간 인식과 사용이 \u003cb class=\"key\">자연의 \u003c/b>\u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">속성\u003c/b>이나 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">심리 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이 아니라고 본다.\u003c/li>\u003cli>시간 인식은 상당 부분 \u003cb class=\"key\">전통\u003c/b>과 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">기준\u003c/b>에 의해 형성된다.\u003c/li>\u003cli>Zerubavel의 저서는 일주일이 문화마다 다른 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">발명품\u003c/b>임을 보여 준다.\u003c/li>\u003cli>아홉 시 출근, 주말 휴식, 월말 납부, 예순다섯 은퇴 같은 숫자와 양식은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">창조물\u003c/b>로 내면화되어 \u003cb class=\"key\">정상\u003c/b>으로 받아들여진다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Our perception and use of time, including the seven-day week and everyday schedules like nine-to-five work, is not fixed by nature or individual psychology but is socially constructed and internalized as normal.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사회학자들은 시간 인식과 사용이 \u003cb class=\"key\">자연의 \u003c/b>\u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">속성\u003c/b>이나 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">심리 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이 아니라 \u003cb class=\"key\">전통과 \u003c/b>\u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">기준\u003c/b>에 의해 형성된 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">창조물\u003c/b>이라고 주장한다. 일주일, 출퇴근 시간, 월말 납부, 은퇴 연령 같은 숫자와 양식도 우리가 내면화하여 정상으로 받아들이는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">발명품\u003c/b>이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 내용을 정리하면, 시간에 대한 우리의 인식과 사용은 자연이나 심리가 아니라 사회적 기준의 산물입니다. 일주일, 출퇴근 시간, 은퇴 연령 같은 것들은 우리가 내면화한 사회적 창조물이라는 거죠. 이 점을 기억하면서 마치도록 하겠습니다. 수고했어요.","hl":null}]}]});</script></body></html>
