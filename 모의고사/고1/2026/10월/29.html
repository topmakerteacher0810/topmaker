<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 29번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 29번","audioDir":"29_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">29번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Biological Immortality and Human Aging\u003c/h1>\u003ch2>생물학적 불멸과 인간 노화\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>히드라와 불멸의 해파리는 노화 징후를 보이지 않아 \u003cb class=\"key\">생물학적 \u003c/b>\u003cb class=\"key\">불멸\u003c/b>로 불리지만, 그들의 특성이 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">노화\u003c/b>에 적용되기는 어렵고 오랜 시간이 걸릴 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Findings from hydra and immortal jellyfish may not be applicable to human aging for a very long time.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 2026년 10월 모의고사 스물아홉 번째 지문을 함께 분석해 보겠습니다. 이 글은 히드라와 불멸의 해파리라는 특별한 생물이 인간의 노화 연구에 어떤 의미를 갖는지 다루고 있어요. 요약하자면, 이들은 노화 징후가 없어 생물학적 불멸로 불리지만, 그들의 특성이 인간 노화에 적용되기는 어렵고 오랜 시간이 걸릴 수 있다는 내용입니다. 영어 요지로는 Findings from hydra and immortal jellyfish may not be applicable to human aging for a very long time. 정도로 말할 수 있겠네요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">노화(aging)는 모든 생물에게 공통적으로 나타나는 현상이지만, 어떤 생물은 눈에 띄는 노화 징후 없이 살아가기도 합니다. 히드라(hydra)와 불멸의 해파리(immortal jellyfish)는 \u003cb class=\"key\">생물학적 \u003c/b>\u003cb class=\"key\">불멸(biological \u003c/b>\u003cb class=\"key\">immortality)\u003c/b>의 대표적인 예로, 나이가 들어도 사망률이 증가하지 않는 특징이 있습니다. 과학자들은 이런 생물의 \u003cb class=\"key\">재생(regeneration)\u003c/b> 능력을 연구하여 인간의 노화를 늦출 방법을 찾고자 합니다. 그러나 동물 실험 결과가 인간에게 그대로 적용되지 않는 경우가 많습니다. 예를 들어, 쥐 실험에서 효과가 있었던 약물이 인간에게는 효과가 없거나 부작용을 일으키는 일이 흔합니다. 이런 이유로, 히드라나 해파리 같은 먼 종의 발견이 인간에게 유용해지려면 \u003cb class=\"key\">번역 \u003c/b>\u003cb class=\"key\">연구(translational \u003c/b>\u003cb class=\"key\">research)\u003c/b>의 오랜 과정이 필요합니다.\u003c/div>","segs":[{"n":2,"text":"노화 aging 는 모든 생물에게 일어나는 자연스러운 과정이지만, 어떤 생물은 눈에 띄는 노화 징후 없이 살아가기도 해요. 히드라 hydra 와 불멸의 해파리 immortal jellyfish 는 생물학적 불멸 biological immortality 의 대표적인 예로, 나이가 들어도 사망률이 증가하지 않는 특징이 있습니다. 과학자들은 이런 생물의 재생 regeneration 능력을 연구해서 인간의 노화를 늦출 방법을 찾으려고 해요. 하지만 동물 실험 결과가 인간에게 그대로 적용되지 않는 경우가 많아요. 예를 들어 쥐 실험에서 효과가 있던 약물이 인간에게는 효과가 없거나 부작용을 일으키는 일이 흔하죠. 그래서 히드라나 해파리 같은 먼 종의 발견이 인간에게 유용해지려면 번역 연구 translational research 의 오랜 과정이 필요합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>생물학적 불멸의 의미\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>히드라와 불멸의 해파리는 노화 징후를 보이지 않아 \u003cb class=\"key\">생물학적 \u003c/b>\u003cb class=\"key\">불멸\u003c/b>로 불린다. 그러나 이는 죽지 않는다는 뜻도, 생물학적 원인으로 죽을 수 없다는 뜻도 아니다. 다만 나이가 들어도 사망 가능성이 증가하지 않는다는 점이 특별하다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>인간 노화에 대한 기대와 한계\u003csmall>주장 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>이런 종은 노화 과정을 물리칠 단서를 제공할 수 있어 \u003cb class=\"key\">노년학자\u003c/b>들을 흥분시킨다. 하지만 전체 신체 부위나 생물체 전체를 재생하는 특성은 인간보다 \u003cb class=\"key\">나무\u003c/b>에 가깝다. 따라서 그 발견이 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">노화\u003c/b>에 얼마나 관련이 있을지는 명확하지 않다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>적용 가능성에 대한 회의\u003csmall>근거/결론 · 문장 8–10\u003c/small>\u003c/h4>\u003cp>생물학은 때때로 보편적이지만, 포유류인 쥐의 발견조차 인간에게 적용하기 어려운 경우가 많다. 그러므로 히드라나 해파리의 발견이 우리에게 유용해지기까지는 매우 오랜 시간이 걸릴 수 있다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름을 먼저 살펴보면, 첫 번째 단계는 생물학적 불멸의 의미를 정의하고, 두 번째 단계는 인간 노화에 대한 기대와 한계를 제시하고, 세 번째 단계는 적용 가능성에 대한 회의적인 결론을 내리는 구조예요.","hl":null},{"n":4,"text":"첫 번째 단계는 첫 번째 문장부터 네 번째 문장까지로, 생물학적 불멸의 의미를 다루고 있어요. 히드라와 불멸의 해파리는 노화 징후를 보이지 않아서 생물학적 불멸이라고 불리는데, 이게 죽지 않는다는 뜻은 아니라는 점을 강조합니다. 생물학적 원인으로 죽을 수 없다는 뜻도 아니고, 다만 나이가 들어도 죽을 가능성이 증가하지 않는다는 점이 특별하다고 설명해요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 다섯 번째 문장부터 일곱 번째 문장까지로, 인간 노화에 대한 기대와 한계를 이야기해요. 이런 종들이 노화 과정을 물리칠 단서를 제공할 수 있어서 노년학자들을 흥분시키지만, 전체 신체 부위나 생물체 전체를 재생하는 특성은 인간보다 나무에 더 가깝다고 지적합니다. 그래서 그 발견이 인간 노화에 얼마나 관련이 있을지는 전혀 명확하지 않다고 해요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 여덟 번째 문장부터 열 번째 문장까지로, 적용 가능성에 대한 회의적인 결론을 내립니다. 생물학은 때때로 보편적이지만, 포유류인 쥐의 발견조차 인간에게 적용하기 어려운 경우가 많아요. 그래서 히드라나 해파리의 발견이 우리에게 유용해지기까지는 매우 오랜 시간이 걸릴 수 있다고 마무리합니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 히드라와 불멸의 해파리가 노화를 극복할 단서를 제공할 것이라는 \u003cb class=\"key\">통념\u003c/b>을 제시한 후, 재생 능력의 차이와 동물 실험의 한계를 근거로 인간 노화에 적용되기 어렵다고 \u003cb class=\"key\">반박\u003c/b>한다. 주제문인 일곱 번째 문장이 중반 이후에 나오고, 마지막 문장에서 결론을 내리므로 \u003cb class=\"key\">미괄식\u003c/b> 구조이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (4)\u003c/b>\u003cspan>앞 문장의 내용과 대조되는 역접\u003c/span>\u003cb>But (6)\u003c/b>\u003cspan>기대와 한계를 대조하는 역접\u003c/span>\u003cb>Although (7)\u003c/b>\u003cspan>양보의 신호어\u003c/span>\u003cb>Sometimes (8)\u003c/b>\u003cspan>보편성의 예외 가능성 제시\u003c/span>\u003cb>But (9)\u003c/b>\u003cspan>적용의 어려움을 강조하는 역접\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">biologically immortal\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">not exhibit obvious signs of aging\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">lack of apparent aging\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>히드라/해파리\u003c/th>\u003cth>인간\u003c/th>\u003c/tr>\u003ctr>\u003ctd>노화 징후 없음, 재생 가능\u003c/td>\u003ctd>노화 진행, 재생 제한적\u003c/td>\u003c/tr>\u003ctr>\u003ctd>발견의 적용 기대\u003c/td>\u003ctd>적용 가능성 낮음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글의 전개 방식은 통념과 반박이라고 볼 수 있어요. 앞부분에서 히드라와 해파리가 노화를 극복할 단서를 제공할 것이라는 통념을 심어 주고, 뒷부분에서 재생 능력의 차이와 동물 실험의 한계를 근거로 인간에게 적용되기 어렵다고 반박합니다. 주제문은 일곱 번째 문장에 나오고 마지막 문장에서 결론을 내리기 때문에 미괄식 구조로 볼 수 있어요.","hl":"ty"},{"n":8,"text":"신호어를 살펴보면, 네 번째 문장의 But과 여섯 번째 문장의 But은 앞 내용과 대조되는 역접을 나타내요. 일곱 번째 문장의 Although는 양보의 신호어이죠. 여덟 번째 문장의 Sometimes는 보편성의 예외 가능성을 제시하고, 아홉 번째 문장의 But은 적용의 어려움을 강조하는 역접이에요. 또한 biologically immortal, lack of apparent aging 같은 재진술 표현도 눈여겨봐야 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>hydra\u003c/b>\u003cem>명사\u003c/em>\u003cspan>히드라 (작은 담수 생물)\u003c/span>\u003c/div>\u003cdiv>\u003cb>immortal jellyfish\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불멸의 해파리\u003c/span>\u003c/div>\u003cdiv>\u003cb>exhibit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타내다, 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>obvious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>명백한\u003c/span>\u003c/div>\u003cdiv>\u003cb>aging\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노화\u003c/span>\u003c/div>\u003cdiv>\u003cb>biologically immortal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>생물학적으로 불멸의\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nor\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~도 아니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>biological causes\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생물학적 원인\u003c/span>\u003c/div>\u003cdiv>\u003cb>unlike\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~와 달리\u003c/span>\u003c/div>\u003cdiv>\u003cb>likelihood\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가능성\u003c/span>\u003c/div>\u003cdiv>\u003cb>increase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>증가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>species\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종\u003c/span>\u003c/div>\u003cdiv>\u003cb>gerontologist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노년학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>clue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단서\u003c/span>\u003c/div>\u003cdiv>\u003cb>defeat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>물리치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>aging process\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노화 과정\u003c/span>\u003c/div>\u003cdiv>\u003cb>property\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특성\u003c/span>\u003c/div>\u003cdiv>\u003cb>regenerate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>organism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생물체\u003c/span>\u003c/div>\u003cdiv>\u003cb>similar\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유사한\u003c/span>\u003c/div>\u003cdiv>\u003cb>fascinating\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매혹적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>lack\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결여, 부족\u003c/span>\u003c/div>\u003cdiv>\u003cb>relevant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관련 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>finding\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발견\u003c/span>\u003c/div>\u003cdiv>\u003cb>universal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>보편적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>fundamental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>근본적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>mechanism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>메커니즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>mammal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포유류\u003c/span>\u003c/div>\u003cdiv>\u003cb>translate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>적용하다, 전환하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>useful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유용한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"핵심 단어 몇 개만 짚어 볼게요. exhibit는 나타내다, obvious는 명백한, aging은 노화, biologically immortal은 생물학적으로 불멸의라는 뜻이에요. unlike는 전치사로 와는 달리, likelihood는 가능성, species는 종, gerontologist는 노년학자, regenerate는 재생하다, relevant는 관련 있는, universal은 보편적인, translate는 적용하다 등이 시험에 자주 나오죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">exhibit\u003c/b>\u003cspan class=\"m\">나타내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show\u003c/span>\u003cspan class=\"s\">display\u003c/span>\u003cspan class=\"s\">demonstrate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">obvious\u003c/b>\u003cspan class=\"m\">명백한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clear\u003c/span>\u003cspan class=\"s\">evident\u003c/span>\u003cspan class=\"s\">apparent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003cspan class=\"a\">hidden\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">increase\u003c/b>\u003cspan class=\"m\">증가하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rise\u003c/span>\u003cspan class=\"s\">grow\u003c/span>\u003cspan class=\"s\">escalate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decrease\u003c/span>\u003cspan class=\"a\">diminish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">similar\u003c/b>\u003cspan class=\"m\">유사한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alike\u003c/span>\u003cspan class=\"s\">comparable\u003c/span>\u003cspan class=\"s\">analogous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">dissimilar\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">relevant\u003c/b>\u003cspan class=\"m\">관련 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">pertinent\u003c/span>\u003cspan class=\"s\">applicable\u003c/span>\u003cspan class=\"s\">related\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">irrelevant\u003c/span>\u003cspan class=\"a\">unrelated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">universal\u003c/b>\u003cspan class=\"m\">보편적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">general\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"s\">widespread\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">particular\u003c/span>\u003cspan class=\"a\">specific\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">translate\u003c/b>\u003cspan class=\"m\">적용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">convert\u003c/span>\u003cspan class=\"s\">apply\u003c/span>\u003cspan class=\"s\">transform\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어와 반의어도 정리해 둡시다. exhibit는 show, display와 동의어이고, hide와 반의어예요. obvious는 clear, evident와 동의어이고, obscure와 반의어입니다. increase는 rise, grow와 동의어이고, decrease와 반의어예요. similar는 alike, comparable과 동의어이고, different와 반의어입니다. relevant는 pertinent, applicable과 동의어이고, irrelevant와 반의어예요. universal은 general, common과 동의어이고, particular과 반의어입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">히드라와 불멸의 해파리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Since\u003c/span> hydra and the immortal jellyfish\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보이지 않기 때문에\u003c/span>\u003cspan class=\"en\">don't exhibit\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명백한 노화의 징후를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">obvious \u003c/span>\u003cspan class=\"tgt\">signs \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">aging\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 흔히 ~라고 불린다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">called\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생물학적으로 불멸이라고\u003c/span>\u003cspan class=\"en\">biologically immortal.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">히드라와 불멸의 해파리는 명백한 노화의 징후들을 보이지 않기 때문에, 그것들은 흔히 생물학적으로 죽지 않는다고 여겨진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 히드라와 불멸의 해파리가 \u003cb class=\"key\">노화의 \u003c/b>\u003cb class=\"key\">징후\u003c/b>를 보이지 않기 때문에 흔히 \u003cb class=\"key\">생물학적 \u003c/b>\u003cb class=\"key\">불멸\u003c/b>이라고 불린다는 점을 제시합니다. 여기서 biologically immortal은 아예 죽지 않는다는 뜻이 아니라 겉으로 노화가 보이지 않는다는 표현이지만, 이 문장만으로는 그렇게 불린다는 사실을 알려 줍니다. 문단 첫 문장으로서 논의의 소재와 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">용어\u003c/b>를 소개하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 since (이유)\u003c/span> : Since + 주어 + 동사, 주절 : \"~ 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : signs + of aging : \"노화의 명백한 징후\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태 (be p.p. + 주격보어)\u003c/span> : 주어 + be p.p. + [biologically immortal] : \"생물학적으로 불멸이라고 불린다\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Since hydra and the immortal jellyfish, 히드라와 불멸의 해파리는. don't exhibit, 보이지 않기 때문에. obvious signs of aging, 명백한 노화의 징후를. they are often called, 그것들은 흔히 ~라고 불린다. biologically immortal, 생물학적으로 불멸이라고. 이 문장 전체를 해석하면, 히드라와 불멸의 해파리는 명백한 노화의 징후들을 보이지 않기 때문에, 그것들은 흔히 생물학적으로 죽지 않는다고 여겨진다.","hl":"m"},{"n":12,"text":"이 문장은 히드라와 불멸의 해파리가 노화의 징후를 보이지 않아서 흔히 생물학적으로 불멸이라고 불린다는 사실을 소개해요. 여기서 biologically immortal이라는 표현은 아예 죽지 않는다는 뜻이 아니라 겉으로 노화가 보이지 않는다는 뉘앙스인데, 문단 첫 문장으로서 논의할 핵심 용어를 먼저 제시하는 역할을 하죠.","hl":"mn"},{"n":13,"text":"첫 번째 문장에서 시험에 나올 수 있는 어법을 세 가지로 정리할게요. 첫째, 문장 맨 앞의 Since는 시간이 아니라 이유를 나타내는 접속사예요. 히드라와 불멸의 해파리가 노화의 징후를 보이지 않기 때문에라는 원인을 이끌고 있죠. 둘째, are often called는 수동태 표현인데, call 목적어 보어의 5형식 구조가 수동태로 바뀌면서 주격보어 biologically immortal이 남은 형태입니다. 셋째, obvious signs of aging에서 of aging은 앞의 signs를 꾸미는 형용사적 전치사구로, 노화의 징후라는 뜻을 만들어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은\u003c/span>\u003cspan class=\"en\">This\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미하지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">doesn't \u003c/span>\u003cspan class=\"tgt\">mean \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 죽지 않는다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">die\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 그것들이 죽지않는다는 것을 의미하지는 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장의 This는 앞 문장의 'biologically immortal'이라는 표현을 가리킵니다. 그 표현이 \u003cb class=\"key\">실제로 \u003c/b>\u003cb class=\"key\">죽지 \u003c/b>\u003cb class=\"key\">않는다\u003c/b>는 뜻은 아니라고 부정하면서, 다음 문장으로 논의를 좁혀 가는 연결 고리 역할을 합니다. 생물학적 불멸이라는 용어가 갖는 오해를 바로잡는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적어절을 이끄는 접속사 that 생략\u003c/span> : This doesn't mean (that) + they don't die : \"이것은 그들이 죽지 않는다는 것을 의미하지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"This, 이것은. doesn't mean, 의미하지 않는다. they don't die, 그들이 죽지 않는다는 것을. 이 문장 전체를 해석하면, 이는 그것들이 죽지않는다는 것을 의미하지는 않는다.","hl":"m"},{"n":15,"text":"두 번째 문장에서 This는 앞 문장의 생물학적으로 불멸이라는 표현 전체를 가리켜요. 그래서 이 문장은 그 표현이 실제로 죽지 않는다는 뜻은 아니라고 바로잡는 역할을 합니다. 앞 문장의 용어에 대한 오해를 미리 막아 주는 연결 문장이죠.","hl":"mn"},{"n":16,"text":"두 번째 문장에서는 mean 뒤에 목적어절을 이끄는 접속사 that이 생략됐어요. 원래는 This doesn't mean that they don't die인데, mean의 목적어 자리에 오는 명사절에서는 that을 흔히 생략할 수 있죠. 그래서 they don't die가 동사 mean의 목적어로 바로 연결된 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것조차도 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Nor \u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 의미하기는\u003c/span>\u003cspan class=\"en\">even mean\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 죽을 수 없다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">die \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생물학적 원인으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">biological \u003c/span>\u003cspan class=\"tgt\">causes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심지어 그것들이 생물학적 원인으로 죽을 ‘수 없다’는 것을 의미하는 것도 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 부정을 이어받아 부정의 범위를 더 넓혀 줍니다. 생물학적으로 불멸이라는 말이 단지 죽지 않는다는 뜻도 아니고, 더 나아가 \u003cb class=\"key\">생물학적 \u003c/b>\u003cb class=\"key\">원인으로 \u003c/b>\u003cb class=\"key\">죽을 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없다\u003c/b>는 뜻조차 아니라는 점을 분명히 합니다. \u003cb class=\"key\">Nor \u003c/b>\u003cb class=\"key\">도치\u003c/b>를 통해 '또한 ~도 아니다'라는 부정을 강조하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정어 nor에 의한 도치\u003c/span> : Nor + does + 주어 + 동사원형 : \"그것도 ~아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that 명사절 (mean의 목적어)\u003c/span> : mean + that + 주어 + 조동사 + 동사원형 : \"그들이 죽을 수 없다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">die of + 원인\u003c/span> : die of + 원인/병명 : \"생물학적 원인으로 죽다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"Nor does it, 그것조차도 아니다. even mean, 심지어 의미하기는. that they cannot die, 그들이 죽을 수 없다는 것을. of biological causes, 생물학적 원인으로. 이 문장 전체를 해석하면, 심지어 그것들이 생물학적 원인으로 죽을 ‘수 없다’는 것을 의미하는 것도 아니다.","hl":"m"},{"n":18,"text":"세 번째 문장은 앞 문장보다 부정의 강도를 한 단계 더 높여요. 생물학적으로 불멸이라는 말이 단지 죽지 않는다는 뜻도 아니고, 심지어 생물학적 원인으로 죽을 수 없다는 뜻조차도 아니라는 거죠. 문장 맨 앞의 nor가 바로 그 또 하나의 부정을 강하게 끌고 오는 핵심 장치예요.","hl":"mn"},{"n":19,"text":"세 번째 문장에서는 먼저 부정어 nor가 문장 맨 앞으로 오면서 도치가 일어났어요. 원래는 It does not even mean인데, nor가 앞에 나오면 does가 주어 it 앞으로 가서 Nor does it이 되죠. 두 번째로, mean 뒤에 that they cannot die가 오는데, 이 that절은 mean의 목적어 역할을 하는 명사절입니다. 세 번째로, die of biological causes에서 die of는 원인이나 병으로 죽을 때 쓰는 표현이에요. 그래서 생물학적 원인으로 죽는다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만, 대부분의 모든 동물과 달리,\u003c/span>\u003cspan class=\"en\">But, unlike most every animal,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 죽을 가능성은\u003c/span>\u003cspan class=\"en\">their \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">likelihood \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">dying\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">증가하지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">increase\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나이가 들면서\u003c/span>\u003cspan class=\"en\">with age.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 대부분의 모든 동물과 달리, 그것들이 죽을 가능성은 나이가 들면서 증가하지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">생물학적 \u003c/b>\u003cb class=\"key\">불멸\u003c/b>이 죽지 않는다는 뜻이 아니라 나이가 들어도 \u003cb class=\"key\">사망 \u003c/b>\u003cb class=\"key\">확률\u003c/b>이 높아지지 않는다는 점을 분명히 합니다. 대부분의 동물은 나이가 들수록 죽을 가능성이 커지지만, 히드라와 불멸의 해파리는 그러한 \u003cb class=\"key\">노화에 \u003c/b>\u003cb class=\"key\">따른 \u003c/b>\u003cb class=\"key\">사망률 \u003c/b>\u003cb class=\"key\">증가\u003c/b>가 없다는 대조를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 (전치사의 목적어)\u003c/span> : likelihood + of + [dying (동명사)] : \"죽을 가능성\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">일반동사의 부정\u003c/span> : does not + [increase (동사원형)] : \"증가하지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"But, unlike most every animal, 하지만, 대부분의 모든 동물과 달리. their likelihood of dying, 그것들이 죽을 가능성은. does not increase, 증가하지 않는다. with age, 나이가 들면서. 이 문장 전체를 해석하면, 하지만, 대부분의 모든 동물과 달리, 그것들이 죽을 가능성은 나이가 들면서 증가하지 않는다.","hl":"m"},{"n":21,"text":"이 문장은 히드라와 불멸의 해파리가 생물학적으로 불멸이라고 불려도 죽지 않는다는 뜻이 아니라 나이가 들어도 죽을 가능성이 높아지지 않는다는 점을 분명히 합니다. 대부분의 동물은 나이가 들수록 사망 확률이 커지지만 이 생물들은 그렇지 않다는 대조가 핵심이에요. 앞 문장에서 말한 생물학적 불멸의 구체적 뜻을 설명하는 역할을 합니다.","hl":"mn"},{"n":22,"text":"첫 번째 포인트는 likelihood of dying입니다. 전치사 of의 목적어로 동명사 dying이 쓰였고, likelihood of dying은 죽을 가능성이라는 의미예요. 전치사 뒤에는 명사나 동명사가 와야 하므로 die를 dying으로 바꿔 쓴 구조입니다. 두 번째 포인트는 does not increase입니다. 주어 their likelihood가 삼인칭 단수이므로 일반동사 increase를 부정할 때 doesn't increase, 풀어서 does not increase로 씁니다. does not 뒤에는 무조건 동사 원형 increase가 온다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">히드라와 불멸의 해파리와 같은 종들은\u003c/span>\u003cspan class=\"en\">Species \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">hydra \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">immortal \u003c/span>\u003cspan class=\"tgt\">jellyfish\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노화학자들을 흥분시킨다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">excite \u003c/span>\u003cspan class=\"tgt\">gerontologists\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 단서들을 제공할지도 모르기 때문에\u003c/span>\u003cspan class=\"en\">because they may provide clues\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노화 작용을 물리치는 방법에 관해서\u003c/span>\u003cspan class=\"en\">about \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">defeat \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">aging \u003c/span>\u003cspan class=\"tgt\">process\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">히드라와 불멸의 해파리와 같은 종들은 그것들이 노화 작용을 물리치는 방법에 관한 단서들을 제공할지도 모르기 때문에 노화학자들을 흥분시킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 히드라와 불멸의 해파리가 \u003cb class=\"key\">노화학자\u003c/b>들의 관심을 끄는 이유를 설명합니다. 이 종들이 \u003cb class=\"key\">노화 \u003c/b>\u003cb class=\"key\">과정 \u003c/b>\u003cb class=\"key\">극복\u003c/b>에 관한 \u003cb class=\"key\">단서\u003c/b>를 제공할 가능성이 있기 때문입니다. 앞 문장의 생물학적 불멸이라는 특성이 학문적으로 중요한 이유를 연결해 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 such as (예시)\u003c/span> : such as + [예시 명사구] : \"히드라와 불멸의 해파리와 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사 excite의 3형식\u003c/span> : S + [excite (타동사)] + O : \"노화학자들을 흥분시킨다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사 (명사구)\u003c/span> : how + [to defeat (to부정사)] + [the aging process] : \"노화 작용을 물리치는 방법\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Species such as hydra and the immortal jellyfish, 히드라와 불멸의 해파리와 같은 종들은. excite gerontologists, 노화학자들을 흥분시킨다. because they may provide clues, 그것들이 단서들을 제공할지도 모르기 때문에. about how to defeat the aging process, 노화 작용을 물리치는 방법에 관해서. 이 문장 전체를 해석하면, 히드라와 불멸의 해파리와 같은 종들은 그것들이 노화 작용을 물리치는 방법에 관한 단서들을 제공할지도 모르기 때문에 노화학자들을 흥분시킨다.","hl":"m"},{"n":24,"text":"이 문장은 왜 노화학자들이 히드라와 불멸의 해파리에 주목하는지 설명합니다. 이 종들이 노화 과정을 이겨낼 단서를 제공할 수 있기 때문에 연구자들을 기대하게 만든다는 내용이에요. 앞 문장의 생물학적 불멸이라는 특성이 학문적으로 중요한 이유를 연결해 주는 역할을 합니다.","hl":"mn"},{"n":25,"text":"첫 번째 포인트는 such as hydra and the immortal jellyfish입니다. such as는 예시를 들 때 쓰는 표현으로 여기서는 Species가 히드라와 불멸의 해파리 같은 종임을 보여줍니다. 두 번째 포인트는 excite gerontologists입니다. excite는 타동사로 목적어 gerontologists를 바로 취해서 노화학자들을 흥분시킨다는 삼형식 문장을 만듭니다. 세 번째 포인트는 how to defeat the aging process입니다. 의문사 how에 to부정사가 붙어서 노화 작용을 물리치는 방법이라는 명사 덩어리가 되었고 전치사 about의 목적어로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그것들의 특성은\u003c/span>\u003cspan class=\"en\">But their property\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전체 신체 부위나 심지어는 한 생물체 전체를 재생할 수 있는\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">regenerate\u003c/span> entire body parts, or even a whole organism,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리보다는 나무들과 더 유사하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">similar \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">trees \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 전체 신체 부위나 심지어는 한 생물체 전체를 재생할 수 있는 그것들의 특성은 그것들을 우리보다는 나무들과 더 유사하게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 히드라와 해파리의 \u003cb class=\"key\">재생 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이 그들을 인간보다 \u003cb class=\"key\">나무\u003c/b>에 더 가깝게 만든다는 점을 말합니다. 나무처럼 몸의 일부나 전체를 다시 만들어 낼 수 있다는 특성 때문에 인간과 본질적으로 다르다는 뜻입니다. 이는 이 생물들의 연구 결과가 인간 노화에 바로 적용되기 어려울 수 있다는 다음 주장으로 이어지는 중요한 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 (전치사의 목적어)\u003c/span> : property of [being able to regenerate...] : \"재생할 수 있는 특성\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make + 목적어 + 목적격보어 (5형식)\u003c/span> : make + [them (목적어)] + [more similar (형용사구)] : \"그것들을 더 유사하게 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 (more + than)\u003c/span> : more + [similar (형용사)] + than + [to us (비교 대상)] : \"우리보다 나무들에 더 유사한\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"But their property, 하지만 그것들의 특성은. of being able to regenerate entire body parts, or even a whole organism, 전체 신체 부위나 심지어는 한 생물체 전체를 재생할 수 있는. makes them, 그것들을 만든다. more similar to trees than to us, 우리보다는 나무들과 더 유사하게. 이 문장 전체를 해석하면, 하지만 전체 신체 부위나 심지어는 한 생물체 전체를 재생할 수 있는 그것들의 특성은 그것들을 우리보다는 나무들과 더 유사하게 만든다.","hl":"m"},{"n":27,"text":"이 문장은 재생 능력이라는 특성 때문에 히드라와 해파리가 인간보다 나무에 더 비슷하다고 말합니다. 나무도 몸 일부가 잘려도 다시 자라나는 점에서 인간과는 다른 재생 방식을 갖고 있다는 거죠. 그래서 이 생물들의 연구 결과가 인간 노화에 곧바로 적용되기 어려울 수 있다는 주장으로 이어지는 중요한 문장입니다.","hl":"mn"},{"n":28,"text":"첫 번째 포인트는 being able to regenerate입니다. 전치사 of의 목적어로 동명사 being이 왔고 being able to regenerate가 재생할 수 있는 이라는 의미로 property를 수식합니다. 두 번째 포인트는 makes them more similar입니다. make는 목적어와 목적격보어를 취하는 오형식 동사로, them을 more similar이라는 형용사구로 설명합니다. 세 번째 포인트는 more similar to trees than to us입니다. more가 similar을 비교급으로 만들고 than이 비교 대상을 이끌어 우리보다 나무에 더 가깝다는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 우리가 몇 가지 흥미로운 사실들을 알게 될지라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">learn \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">fascinating \u003c/span>\u003cspan class=\"tgt\">things\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들의 명백한 노화의 결여에 관해\u003c/span>\u003cspan class=\"en\">about their lack of apparent aging,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전혀 명확하지 않다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">clear \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 발견들이 얼마나 관련될지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">relevant \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">findings \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 노화에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">aging\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비록 우리가 그것들의 명백한 노화의 결여에 관한 몇 가지 흥미로운 사실들을 알게 될 수 있을지라도, 그러한 발견들이 인간의 노화에 얼마나 관련이 있을지는 전혀 명확하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 히드라와 해파리처럼 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">노화의 \u003c/b>\u003cb class=\"key\">결여\u003c/b>를 보이는 생물에서 흥미로운 점을 배울 수는 있지만, 그 발견이 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">노화\u003c/b>에 곧바로 연결될지는 불분명하다고 선을 긋습니다. 앞 문장에서 이들이 나무와 더 비슷하다고 한 흐름을 이어받아, 연구 성과가 인간에게 \u003cb class=\"key\">관련성\u003c/b>을 갖기 어려울 수 있음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보 부사절 (Although + 주어 + 동사)\u003c/span> : Although + S + V, S + V : \"비록 우리가 몇 가지 흥미로운 사실들을 알게 될지라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가주어 it과 진주어 how절\u003c/span> : It is + 형용사(clear) + how절(진주어) : \"그러한 발견들이 인간의 노화에 얼마나 관련될지는 전혀 명확하지 않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사 how)\u003c/span> : 의문사 how + 주어(those findings) + 동사(will be) : \"그러한 발견들이 얼마나 관련될지\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"Although we may learn some fascinating things, 비록 우리가 몇 가지 흥미로운 사실들을 알게 될지라도. about their lack of apparent aging, 그것들의 명백한 노화의 결여에 관해. it is not at all clear, 전혀 명확하지 않다. how relevant those findings will be, 그러한 발견들이 얼마나 관련될지. to human aging, 인간의 노화에. 이 문장 전체를 해석하면, 비록 우리가 그것들의 명백한 노화의 결여에 관한 몇 가지 흥미로운 사실들을 알게 될 수 있을지라도, 그러한 발견들이 인간의 노화에 얼마나 관련이 있을지는 전혀 명확하지 않다.","hl":"m"},{"n":30,"text":"이 문장은 비록 우리가 히드라나 해파리처럼 겉으로 노화가 보이지 않는 생물에 관해 흥미로운 점을 배울 수는 있지만, 그 발견이 인간의 노화에 얼마나 관련될지는 전혀 명확하지 않다고 말합니다. 앞 문장에서 이 생물들이 나무에 더 가깝다고 한 것과 연결되어, 아무리 신기해 보여도 인간에게 바로 적용하기 어렵다는 점을 암시하죠.","hl":"mn"},{"n":31,"text":"첫 번째, Although가 이끄는 양보 부사절입니다. Although we may learn some fascinating things는 비록 우리가 몇 가지 흥미로운 사실들을 알게 될지라도라는 뜻으로, 주절과 대조되는 양보 관계를 만듭니다. 두 번째, it is not at all clear 다음에 how절이 진짜 주어로 따라오는 가주어 진주어 구문입니다. it이 가주어이고 how relevant those findings will be to human aging이 진주어로, 그 발견들이 인간의 노화에 얼마나 관련될지는 전혀 명확하지 않다고 해석합니다. 세 번째, how relevant those findings will be는 간접의문문으로, 의문사 how 뒤에 주어 those findings, 동사 will be 순서로 쓰여 얼마나 관련될지라는 뜻의 명사절 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때때로 생명 작용은 보편적인데\u003c/span>\u003cspan class=\"en\">Sometimes biology is universal,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특히 그것이 관련이 있다면\u003c/span>\u003cspan class=\"en\">especially \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">relates \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근본적인 메커니즘에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fundamental \u003c/span>\u003cspan class=\"tgt\">mechanisms\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">때때로 생명 작용은 보편적인데, 특히 그것이 근본적인 메커니즘과 관련이 있다면 그러하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 생명 현상이 종을 넘어 공통적으로 나타날 수 있는 \u003cb class=\"key\">보편성\u003c/b>을 가질 수 있음을 인정합니다. 특히 세포 분열이나 DNA 복제처럼 \u003cb class=\"key\">근본적인 \u003c/b>\u003cb class=\"key\">메커니즘\u003c/b>에 관련된 경우라면 종이 달라도 같은 원리가 적용될 가능성이 큽니다. 그러나 바로 다음 문장에서 But으로 전환되므로, 이는 반론을 위한 \u003cb class=\"key\">양보\u003c/b>로 보아야 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건 부사절 (if + 주어 + 동사)\u003c/span> : if + S + V : \"만약 그것이 근본적인 메커니즘과 관련이 있다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구 relate to\u003c/span> : relate to + 명사 : \"~와 관련이 있다\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Sometimes biology is universal, 때때로 생명 작용은 보편적인데. especially if it relates, 특히 그것이 관련이 있다면. to fundamental mechanisms, 근본적인 메커니즘에. 이 문장 전체를 해석하면, 때때로 생명 작용은 보편적인데, 특히 그것이 근본적인 메커니즘과 관련이 있다면 그러하다.","hl":"m"},{"n":33,"text":"이 문장은 생명 작용이 때로는 종에 상관없이 보편적일 수 있다고 말합니다. 특히 근본적인 메커니즘과 관련된 경우에는 더 그렇죠. 그런데 바로 다음에 But이 나오기 때문에, 이 문장은 반론을 위한 양보로 보는 것이 자연스럽습니다.","hl":"mn"},{"n":34,"text":"첫 번째, if it relates to fundamental mechanisms는 if가 이끄는 조건 부사절입니다. especially와 함께 쓰여 특히 만약 그것이 근본적인 메커니즘과 관련된다면이라는 뜻이에요. it은 앞에 나온 biology를 받습니다. 두 번째, relates to는 동사 relate가 전치사 to와 결합해 무엇과 관련되다는 뜻을 나타냅니다. 여기서는 생명 작용이 근본적인 메커니즘과 관련된다는 의미로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 다른 경우들에서는\u003c/span>\u003cspan class=\"en\">But in other cases,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쥐나 생쥐에서의 발견들조차도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">discoveries \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">rats \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">mice\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포유류이며 생물학적으로 우리에게 훨씬 더 가까운\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">mammals \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">biologically \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">closer \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적용하기가 어렵다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">translate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간에게\u003c/span>\u003cspan class=\"en\">into humans.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 다른 경우들에서는, 포유류이며 생물학적으로 우리에게 훨씬 더 가까운, 쥐나 생쥐에서의 발견들조차도 인간에게 적용하기가 어렵다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 보편성과 대조되는 \u003cb class=\"key\">반례\u003c/b>로 쥐나 생쥐를 듭니다. 쥐와 생쥐는 포유류로 인간과 생물학적으로 가까운데도 발견을 인간에게 \u003cb class=\"key\">번역\u003c/b>, 즉 적용하기 어렵다는 점을 강조합니다. 이를 통해 히드라나 해파리처럼 인간과 훨씬 먼 생물의 발견은 더더욱 적용하기 어렵다는 \u003cb class=\"key\">논리\u003c/b>를 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">even을 이용한 강조\u003c/span> : even + 명사구 : \"심지어 쥐나 생쥐에서의 발견들조차도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 which (계속적 용법)\u003c/span> : 선행사 + , which + 동사(are) : \"그것들은 포유류이며 생물학적으로 우리에게 훨씬 더 가까운\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be difficult to 부정사\u003c/span> : be difficult + to부정사(translate) : \"적용하기가 어렵다\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"But in other cases, 하지만 다른 경우들에서는. even discoveries in rats or mice, 쥐나 생쥐에서의 발견들조차도. which are mammals and biologically much closer to us, 포유류이며 생물학적으로 우리에게 훨씬 더 가까운. are difficult to translate, 적용하기가 어렵다. into humans, 인간에게. 이 문장 전체를 해석하면, 하지만 다른 경우들에서는, 포유류이며 생물학적으로 우리에게 훨씬 더 가까운, 쥐나 생쥐에서의 발견들조차도 인간에게 적용하기가 어렵다.","hl":"m"},{"n":36,"text":"이 문장은 앞 문장과 대조되면서, 어떤 경우에는 정말 가까운 동물인 쥐나 생쥐에서 나온 발견조차도 인간에게 적용하기 어렵다고 말합니다. 쥐와 생쥐는 포유류라서 생물학적으로 인간과 훨씬 가까운데도 그렇다는 거예요. 따라서 히드라나 해파리처럼 훨씬 먼 생물의 발견이 인간에게 유용해지려면 시간이 오래 걸릴 것이라는 주장을 뒷받침합니다.","hl":"mn"},{"n":37,"text":"첫 번째, even discoveries in rats or mice에서 even은 심지어 무엇조차도라는 뜻으로, 인간과 가까운 동물의 발견조차도라는 점을 강조합니다. 두 번째, which are mammals and biologically much closer to us는 주격 관계대명사 which가 이끄는 계속적 용법입니다. 콤마와 함께 쥐나 생쥐를 부연 설명하며, 그것들은 포유류이고 생물학적으로 우리에게 훨씬 더 가깝다고 해석합니다. 세 번째, are difficult to translate는 be difficult to 부정사 구문으로, 형용사 difficult 다음에 나온 to부정사가 어떤 면에서 어려운지를 설명합니다. 주어 discoveries가 translate의 의미상 목적어이지만 능동 형태로 쓰여 적용하기가 어렵다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 매우 오랜 시간이 걸릴지도 모른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">히드라나 해파리로부터 얻어진 어떤 발견들이 우리에게 유용해지기 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">before\u003c/span> any findings \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">gained \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">hydra \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">jellyfish\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게 유용해진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">useful \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">히드라나 해파리로부터 얻은 어떠한 발견들도 우리에게 유용해지기까지는 매우 오랜 시간이 걸릴지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 마지막 결론이에요. 앞에서 히드라나 해파리의 발견이 인간 노화에 곧바로 적용되기 어렵다고 했는데, 여기서는 그 연구 성과가 우리에게 도움이 되려면 아주 오랜 시간이 걸릴 거라고 조심스럽게 정리하고 있어요. \u003cb class=\"key\">It \u003c/b>\u003cb class=\"key\">may \u003c/b>\u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">very \u003c/b>\u003cb class=\"key\">long \u003c/b>\u003cb class=\"key\">time \u003c/b>\u003cb class=\"key\">before\u003c/b>라는 표현이 그 시간적 거리감을 나타내고, \u003cb class=\"key\">gained \u003c/b>\u003cb class=\"key\">from \u003c/b>\u003cb class=\"key\">hydra \u003c/b>\u003cb class=\"key\">or \u003c/b>\u003cb class=\"key\">jellyfish\u003c/b>는 히드라나 해파리로부터 얻어진 발견이라는 의미예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비인칭 주어 It (시간) + before 시간 부사절\u003c/span> : It may be + a very long time + before + 주어 + 동사 : \"~하기까지는 매우 오랜 시간이 걸릴지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구 (후치 수식)\u003c/span> : findings + gained from hydra or jellyfish = findings which are gained from hydra or jellyfish : \"히드라나 해파리로부터 얻어진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be useful to (전치사 to)\u003c/span> : be + useful + to + us : \"우리에게 유용하다\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"It may be a very long time, 그것은 매우 오랜 시간이 걸릴지도 모른다. before any findings gained from hydra or jellyfish, 히드라나 해파리로부터 얻어진 어떤 발견들이 우리에게 유용해지기 전에. are useful to us, 우리에게 유용해진다. 이 문장 전체를 해석하면, 히드라나 해파리로부터 얻은 어떠한 발견들도 우리에게 유용해지기까지는 매우 오랜 시간이 걸릴지도 모른다.","hl":"m"},{"n":39,"text":"이 문장은 글의 마지막 결론이에요. 앞에서 히드라나 해파리의 발견이 인간 노화에 곧바로 적용되기 어렵다고 했는데, 여기서는 그 연구 성과가 우리에게 도움이 되려면 아주 오랜 시간이 걸릴 거라고 조심스럽게 정리하고 있어요. It may be a very long time before라는 표현이 그 시간적 거리감을 나타내고, gained from hydra or jellyfish는 히드라나 해파리로부터 얻어진 발견이라는 의미예요.","hl":"mn"},{"n":40,"text":"첫 번째 어법은 It may be a very long time before 부분이에요. 여기서 It은 특정 대상을 가리키는 게 아니라 시간을 나타내는 비인칭 주어이고, 뒤에 before가 이끄는 시간 부사절이 와서 어떤 일이 일어나기까지의 시간을 표현해요. 두 번째 어법은 gained from hydra or jellyfish예요. 이 과거분사구는 앞 명사 findings를 뒤에서 수식하는 후치 수식이고, 원래는 findings which are gained from hydra or jellyfish에서 관계대명사와 be 동사가 생략된 거예요. 세 번째 어법은 are useful to us예요. 유용한 대상을 나타낼 때는 to를 써서 be useful to가 되는 걸 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>히드라와 불멸의 해파리는 노화 징후가 없어 \u003cb class=\"key\">생물학적 \u003c/b>\u003cb class=\"key\">불멸\u003c/b>로 불리지만, 죽지 않는다는 뜻은 아니다.\u003c/li>\u003cli>이들은 노화를 물리칠 \u003cb class=\"key\">단서\u003c/b>를 제공하여 \u003cb class=\"key\">노년학자\u003c/b>들의 기대를 모은다.\u003c/li>\u003cli>그러나 이들의 \u003cb class=\"key\">재생\u003c/b> 능력은 인간보다 나무에 가깝고, \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">노화\u003c/b>에 적용될지는 불확실하다.\u003c/li>\u003cli>포유류인 쥐의 발견조차 인간에게 적용하기 어렵기 때문에, 이들의 발견이 \u003cb class=\"key\">유용\u003c/b>해지기까지는 오랜 시간이 걸릴 것이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Findings from hydra and immortal jellyfish may not be applicable to human aging for a very long time.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">히드라와 불멸의 해파리는 노화 징후를 보이지 않아 \u003cb class=\"key\">생물학적 \u003c/b>\u003cb class=\"key\">불멸\u003c/b>로 불리지만, 그들의 특성이 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">노화\u003c/b>에 적용되기는 어렵고 오랜 시간이 걸릴 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":41,"text":"오늘 내용을 정리하면, 히드라와 불멸의 해파리는 생물학적 불멸로 불리지만 노화 과정을 물리칠 단서를 제공할 것이라는 기대와는 달리, 인간 노화에 적용되기는 어렵고 오랜 시간이 걸릴 수 있다는 것이 핵심이에요. 이 글은 통념을 심어 주고 반박하는 전형적인 구조로, But이나 Although 같은 신호어 뒤에 핵심 내용이 나온다는 점을 기억하세요. 이상으로 강의를 마치겠습니다.","hl":null}]}]});</script></body></html>
