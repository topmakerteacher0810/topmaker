<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 23번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 23번","audioDir":"23_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">23번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Whistleblower Protection: Protecting Individuals and the Public Good\u003c/h1>\u003ch2>내부 고발자 보호: 개인과 공익을 지키는 길\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>기업의 \u003cb class=\"key\">위법 \u003c/b>\u003cb class=\"key\">행위\u003c/b>를 끝내려는 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자\u003c/b>가 보복을 두려워하면 범죄가 방치되므로, \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자 \u003c/b>\u003cb class=\"key\">보호\u003c/b>가 주목받는다. \u003cb class=\"key\">균형 \u003c/b>\u003cb class=\"key\">잡힌 \u003c/b>\u003cb class=\"key\">보호\u003c/b>는 개인의 행위와 \u003cb class=\"key\">공익\u003c/b>을 모두 지키는 긍정적 기능을 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Well-balanced whistleblower protection benefits both individuals and the public good.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 최근 기업 위법 행위와 내부 고발자 보호에 관한 지문을 함께 살펴볼게요. 이 글은 내부 고발자 보호가 개인의 용기 있는 행동과 공익을 모두 지키는 중요한 제도라는 내용을 담고 있어요. 먼저 핵심 요지를 영어로 말하면 Well balanced whistleblower protection benefits both individuals and the public good 입니다. 자 이제 본문으로 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">기업이나 조직 내부의 잘못을 외부에 알리는 사람을 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자\u003c/b>(whistleblower)라고 한다. 이들은 종종 해고나 괴롭힘 같은 \u003cb class=\"key\">보복\u003c/b>(retaliation)을 두려워해 신고를 망설인다. 회사가 법을 지키도록 감시하는 체계를 compliance라고 하며, 내부 고발자 보호는 이 체계를 작동시키는 안전장치다. 예를 들어 학교에서 반칙을 본 학생이 고자질하면 따돌림을 당할까 봐 침묵하면, 잘못이 반복되고 결국 모두가 피해를 보는 것과 비슷하다. 따라서 내부 고발자 보호는 개인의 용기 있는 행동뿐 아니라 \u003cb class=\"key\">공익\u003c/b>(public interest)까지 지키는 제도적 장치다.\u003c/div>","segs":[{"n":2,"text":"이 글을 이해하려면 whistleblower, 즉 내부 고발자라는 개념을 먼저 알아야 해요. 내부 고발자는 조직 안에서 법이나 규칙을 어긴 행위를 외부에 알리는 사람을 말하죠. 그런데 이런 사람들은 해고나 괴롭힘 같은 retaliation, 보복을 두려워하는 경우가 많아요. 회사가 법을 지키도록 감시하는 체계를 compliance라고 하는데, 내부 고발자 보호는 이 compliance가 제대로 작동하게 하는 안전장치예요. 학교에서 반칙을 본 학생이 고자질하면 따돌림을 당할까 봐 침묵하면 결국 다 같이 피해를 보는 것과 비슷한 이치예요. 그래서 내부 고발자 보호는 공익인 public interest까지 지키는 제도적 장치라고 할 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>위법 행위 증가와 내부 고발\u003csmall>현상 제시 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>최근 몇 년간 기업 차원의 \u003cb class=\"key\">위법 \u003c/b>\u003cb class=\"key\">행위\u003c/b>가 늘었고, 세상에 드러난 사건도 증가했다. 이런 위법 행위는 용기 있는 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자\u003c/b>가 큰 위험을 무릅쓰고 문제를 끝내려 했기 때문에 드러난 경우가 많다. 그래서 본문은 내부 고발자 보호에 주목할 필요성을 자연스럽게 끌어낸다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>신고 회피의 부정적 결과\u003csmall>문제 제기 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>직원들이 \u003cb class=\"key\">보복\u003c/b>이나 불이익이 두려워 위법 행위를 신고하지 않으면 법과 질서의 위반이 적발되지도 처벌받지도 않는다. 그러면 해당 기업은 물론 제삼자, 경제 전반, 일반 대중, \u003cb class=\"key\">법치주의\u003c/b>까지 부정적 영향을 받을 수 있다. 따라서 내부 고발자 보호가 주목받는 것은 놀라운 일이 아니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>내부 고발자 보호의 두 기능\u003csmall>주장 · 문장 6\u003c/small>\u003c/h4>\u003cp>위법하거나 범죄인 행위를 줄이는 데 도움을 주려는 사람을 보호하는 것에는 두 가지 주요 기능이 있다. 하나는 \u003cb class=\"key\">개인의 \u003c/b>\u003cb class=\"key\">행위\u003c/b>를 보호하는 것이고, 다른 하나는 \u003cb class=\"key\">공익\u003c/b>을 보호하는 것이다. 즉, 내부 고발자 보호는 개인의 용기 있는 선택을 지지하면서 사회 전체의 이익도 지키는 이중적 역할을 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>균형 잡힌 보호의 긍정적 효과\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">균형 \u003c/b>\u003cb class=\"key\">잡힌 \u003c/b>\u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자 \u003c/b>\u003cb class=\"key\">보호\u003c/b>는 개인의 행위와 공익 두 측면 모두에 긍정적인 영향을 미칠 수 있다. 이는 보호가 지나치거나 부족하지 않고 적절한 수준에서 이루어질 때 가능하다. 따라서 내부 고발자 보호는 기업과 사회를 위한 제도적 장치가 되어야 한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이 글의 흐름을 네 단계로 정리해 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 기업 위법 행위 증가와 내부 고발의 관계예요. 최근 몇 년간 기업 차원의 위법 행위가 늘었고, 세상에 드러난 사건도 증가했어요. 이런 위법 행위는 용기 있는 내부 고발자가 큰 위험을 무릅쓰고 문제를 끝내려 했기 때문에 드러난 경우가 많다고 본문은 설명해요. 그래서 내부 고발자 보호에 주목할 필요성이 생긴 거예요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 직원들이 신고를 꺼릴 때 생기는 부정적 결과예요. 직원들이 보복이나 불이익이 두려워 위법 행위를 신고하지 않으면, 법과 질서의 위반이 여러 해 동안 적발되지도 않고 처벌받지도 않게 돼요. 그러면 해당 기업 자체는 물론이고 제삼자, 경제 전반, 일반 대중, 그리고 법치주의까지 부정적인 영향을 받을 수 있어요. 그래서 내부 고발자 보호가 주목받는 게 당연하다는 흐름이죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 내부 고발자 보호의 두 가지 기능이에요. 위법하거나 범죄인 행위를 줄이는 데 도움을 주려는 사람을 보호하는 것은 개인의 행위를 보호하는 기능과 공익을 보호하는 기능을 동시에 지녀요. 즉 개인의 용기 있는 선택을 지지하면서 사회 전체의 이익까지 지키는 이중적 역할을 하는 거예요.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 균형 잡힌 보호의 긍정적 효과예요. 균형이 잘 잡힌 내부 고발자 보호는 개인의 행위와 공익 두 측면 모두에 긍정적인 영향을 미칠 수 있어요. 따라서 내부 고발자 보호는 기업과 사회를 지키는 제도적 장치가 되어야 한다는 결론으로 이어져요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 기업 위법 행위와 내부 고발자의 위험을 문제로 제시한 뒤, 직원의 신고 회피가 초래할 부정적 결과를 짚는다. 이어서 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자 \u003c/b>\u003cb class=\"key\">보호\u003c/b>의 두 기능을 설명하고, 마지막 문장에서 \u003cb class=\"key\">균형 \u003c/b>\u003cb class=\"key\">잡힌 \u003c/b>\u003cb class=\"key\">보호\u003c/b>의 긍정적 효과를 결론으로 제시한다. 따라서 중심 내용이 마지막에 집약되므로 \u003cb class=\"key\">미괄식\u003c/b> 구조이며, 원인과 문제에 대한 해결책을 제시하는 \u003cb class=\"key\">문제-해결\u003c/b> 전개 방식이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In recent years (1)\u003c/b>\u003cspan>시간 배경 도입\u003c/span>\u003cb>Hence (3)\u003c/b>\u003cspan>원인-결과 정리\u003c/span>\u003cb>If (4)\u003c/b>\u003cspan>조건·가정 제시\u003c/span>\u003cb>two main functions (6)\u003c/b>\u003cspan>열거·분류 신호\u003c/span>\u003cb>both of these (7)\u003c/b>\u003cspan>결론·요약\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">illegal actions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Such misconduct\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">violations of law and order\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">unlawful or even criminal behaviour\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>내부 고발자 보호 부족\u003c/th>\u003cth>균형 잡힌 내부 고발자 보호\u003c/th>\u003c/tr>\u003ctr>\u003ctd>신고하면 보복 우려\u003c/td>\u003ctd>신고 행위 보호\u003c/td>\u003c/tr>\u003ctr>\u003ctd>위법 적발·처벌 어려움\u003c/td>\u003ctd>공익과 개인 보호\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제 해결 전개 방식에 해당해요. 먼저 기업 위법 행위와 내부 고발자의 위험을 문제로 제시하고, 직원의 신고 회피가 부를 부정적 결과를 설명해요. 그러고 나서 내부 고발자 보호의 두 기능을 주장하고, 마지막 문장에서 균형 잡힌 보호의 긍정적 효과를 결론으로 제시하죠. 중심 내용이 마지막에 집약되기 때문에 미괄식 구조라고 말할 수 있어요.","hl":"ty"},{"n":9,"text":"지문의 신호어를 살펴볼게요. 첫 번째 문장의 In recent years는 시간적 배경을 알려 주는 도입 신호예요. 세 번째 문장의 Hence는 앞의 내용을 받아서 내부 고발자 보호가 주목받는 이유를 정리하는 연결어죠. 네 번째 문장의 If는 가정을 통해 신고 회피의 위험을 보여 주는 조건 신호예요. 여섯 번째 문장의 two main functions는 두 가지 기능을 열거한다는 구조 신호이기도 해요. 마지막 문장의 well balanced는 저자의 평가를 담은 결론 신호로 볼 수 있어요. 그리고 illegal actions, misconduct, violations of law and order, unlawful or even criminal behaviour처럼 같은 개념을 바꿔 말한 재진술과, 보호 부족과 균형 잡힌 보호라는 대조 구도를 짚어 두면 좋아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>recent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최근의\u003c/span>\u003c/div>\u003cdiv>\u003cb>illegal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불법의, 위법한\u003c/span>\u003c/div>\u003cdiv>\u 003c/em>\u003cspan>법치주의\u003c/span>\u003c/div>\u003cdiv>\u003cb>assist\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돕다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>줄이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unlawful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위법한\u003c/span>\u003c/div>\u003cdiv>\u003cb>criminal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>범죄의\u003c/span>\u003c/div>\u003cdiv>\u003cb>public good\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공익\u003c/span>\u003c/div>\u003cdiv>\u003cb>well-balanced\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>균형 잡힌\u003c/span>\u003c/div>\u003cdiv>\u003cb>positive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긍정적인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요 단어를 몇 개 확인할게요. misconduct는 위법 행위나 비행을 뜻하고, whistleblower는 내부 고발자예요. reprisal은 보복이라는 뜻으로 이 글의 핵심 개념이에요. public good은 공익이고, well balanced는 균형 잡힌이라는 뜻이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">illegal\u003c/b>\u003cspan class=\"m\">불법의, 위법한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unlawful\u003c/span>\u003cspan class=\"s\">criminal\u003c/span>\u003cspan class=\"s\">illegitimate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lawful\u003c/span>\u003cspan class=\"a\">legal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">misconduct\u003c/b>\u003cspan class=\"m\">위법 행위, 비행\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wrongdoing\u003c/span>\u003cspan class=\"s\">malpractice\u003c/span>\u003cspan class=\"s\">misbehavior\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">compliance\u003c/span>\u003cspan class=\"a\">integrity\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">brave\u003c/b>\u003cspan class=\"m\">용기 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">courageous\u003c/span>\u003cspan class=\"s\">bold\u003c/span>\u003cspan class=\"s\">fearless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cowardly\u003c/span>\u003cspan class=\"a\">timid\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protection\u003c/b>\u003cspan class=\"m\">보호\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">safeguard\u003c/span>\u003cspan class=\"s\">defense\u003c/span>\u003cspan class=\"s\">security\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">threat\u003c/span>\u003cspan class=\"a\">attack\u003c/span>\u003cspan class=\"a\">endangerment\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reprisal\u003c/b>\u003cspan class=\"m\">보복\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">retaliation\u003c/span>\u003cspan class=\"s\">revenge\u003c/span>\u003cspan class=\"s\">punishment\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forgiveness\u003c/span>\u003cspan class=\"a\">pardon\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unlawful\u003c/b>\u003cspan class=\"m\">위법한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">illegal\u003c/span>\u003cspan class=\"s\">illicit\u003c/span>\u003cspan class=\"s\">criminal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lawful\u003c/span>\u003cspan class=\"a\">legal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">well-balanced\u003c/b>\u003cspan class=\"m\">균형 잡힌\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">balanced\u003c/span>\u003cspan class=\"s\">fair\u003c/span>\u003cspan class=\"s\">reasonable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unbalanced\u003c/span>\u003cspan class=\"a\">biased\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 두면 시험에 도움이 돼요. illegal의 동의어는 unlawful, criminal이고 반의어는 lawful, legal이에요. brave는 courageous나 bold와 바꿔 쓸 수 있고, 반의어는 cowardly나 timid입니다. protection은 safeguard나 defense와 유사하고, threat이나 attack과 반대 개념이에요. reprisal은 retaliation이나 revenge와 같은 말이고, 반대는 forgiveness나 pardon이에요. well balanced는 balanced나 fair와 통하고, 반대는 unbalanced나 biased예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최근 몇 년 동안\u003c/span>\u003cspan class=\"en\">In recent years,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위법 행위의 수가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">number \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">illegal \u003c/span>\u003cspan class=\"tgt\">actions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특히 기업 차원에서 발생하는\u003c/span>\u003cspan class=\"en\">in particular at the corporate level\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">증가했거나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">grown\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적어도\u003c/span>\u003cspan class=\"en\">or at least\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사건의 수가\u003c/span>\u003cspan class=\"en\">the number of cases\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상에 드러난\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">came \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">light\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">증가했다.\u003c/span>\u003cspan class=\"en\">increased.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">최근 몇 년 동안 특히 기업 차원에서 발생하는 위법 행위의 수가 증가했거나, 적어도 세상에 드러난 사건의 수가 증가했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 최근 기업 차원의 위법 행위가 늘었거나, 드러난 사건만 보더라도 증가했다고 말하며 문제를 제기한다. in particular at the corporate level은 \u003cb class=\"key\">기업 \u003c/b>\u003cb class=\"key\">차원\u003c/b>으로 범위를 좁히고, came to light는 \u003cb class=\"key\">세상에 \u003c/b>\u003cb class=\"key\">드러난\u003c/b>이라는 뜻이다. 글의 도입에서 이후 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자 \u003c/b>\u003cb class=\"key\">보호\u003c/b> 논의로 이어지는 배경을 깔아 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">the number of + 복수명사 + 단수동사\u003c/span> : the number of + [복수명사] + [단수동사] : \"위법 행위의 수가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료\u003c/span> : has + [과거분사 grown] : \"증가했거나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 + that + [동사 came] : \"세상에 드러난\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"In recent years, 최근 몇 년 동안. the number of illegal actions, 위법 행위의 수가. in particular at the corporate level, 특히 기업 차원에서 발생하는. has grown, 증가했거나. or at least, 적어도. the number of cases, 사건의 수가. that came to light, 세상에 드러난. increased, 증가했다.. 이 문장 전체를 해석하면, 최근 몇 년 동안 특히 기업 차원에서 발생하는 위법 행위의 수가 증가했거나, 적어도 세상에 드러난 사건의 수가 증가했다.","hl":"m"},{"n":13,"text":"이 첫 문장은 최근 기업 차원의 위법 행위가 실제로 늘었거나 적어도 드러난 사건 수가 증가했다는 문제를 제기하는 문장입니다. in particular at the corporate level은 특히 기업 차원으로 범위를 좁혀 주는 표현이고 came to light는 세상에 드러난이라는 뜻이에요. 이 문장은 뒤에서 내부 고발자 보호가 왜 필요해졌는지 설명할 배경을 깔아 주는 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째 문장에서 첫 번째 어법 포인트는 the number of illegal actions입니다. the number of 뒤에는 복수 명사가 오지만 수를 나타내는 표현이기 때문에 단수 동사 has grown으로 받는 것이 중요해요. 두 번째로 has grown은 현재완료로 최근 몇 년 동안 이어진 증가를 표현합니다. 마지막으로 that came to light의 that은 주격 관계대명사로 선행사 cases를 꾸며 주면서 came의 주어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 위법 행위는\u003c/span>\u003cspan class=\"en\">Such misconduct\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비로소 종종 드러났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">exposed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">용기 있는 제보자들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">brave \u003c/span>\u003cspan class=\"tgt\">informants \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 위험을 무릅써 왔기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">risked \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">deal\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 끝내기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">end \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러한 위법 행위는 용기 있는 제보자들이 그것을 끝내기 위해 많은 위험을 무릅써 왔기 때문에 비로소 종종 드러났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Such misconduct는 앞서 말한 위법 행위를 가리키며, 그 위법 행위가 종종 드러난 이유를 설명한다. 용기 있는 제보자들이 \u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">위험을 \u003c/b>\u003cb class=\"key\">무릅써\u003c/b> 왔기 때문에 \u003cb class=\"key\">비로소\u003c/b> 드러난다는 뜻이다. 이는 바로 다음 문장에서 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자 \u003c/b>\u003cb class=\"key\">보호\u003c/b>가 주목받는 이유로 연결되는 핵심 고리이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 수동태\u003c/span> : has been + [과거분사 exposed] : \"종종 비로소 드러났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유의 부사절 (because)\u003c/span> : because + [주어] + [동사] : \"용기 있는 제보자들이 많은 위험을 무릅써 왔기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적) · in order to\u003c/span> : in order to + [동사원형] : \"그것을 끝내기 위해\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Such misconduct, 그러한 위법 행위는. has often only been exposed, 비로소 종종 드러났다. because brave informants, 용기 있는 제보자들이. have risked a great deal, 많은 위험을 무릅써 왔기 때문에. in order to put an end to it, 그것을 끝내기 위해. 이 문장 전체를 해석하면, 그러한 위법 행위는 용기 있는 제보자들이 그것을 끝내기 위해 많은 위험을 무릅써 왔기 때문에 비로소 종종 드러났다.","hl":"m"},{"n":16,"text":"두 번째 문장은 앞서 말한 위법 행위, 즉 such misconduct가 종종 드러난 이유를 설명합니다. 용기 있는 제보자들이 그것을 끝내기 위해 많은 위험을 무릅써 왔기 때문에 비로소 드러난다는 거예요. 이 문장은 바로 다음 문장에서 내부 고발자 보호가 주목받는 이유로 연결되는 핵심 고리입니다.","hl":"mn"},{"n":17,"text":"두 번째 문장에서 첫 번째 어법은 has often only been exposed입니다. 이 부분은 현재완료 수동태로, 위법 행위가 스스로 드러나는 것이 아니라 드러나게 된 것이라는 수동의 의미를 담고 있어요. 두 번째 포인트 because brave informants have risked a great deal은 because라는 종속접속사가 이끄는 이유의 부사절입니다. 세 번째로 in order to put an end to it에서 in order to는 목적을 나타내는 부사적 용법이고 put an end to는 끝내다라는 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서\u003c/span>\u003cspan class=\"en\">Hence,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라운 일이 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">surprise \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내부 고발자 보호가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">whistleblower \u003c/span>\u003cspan class=\"tgt\">protection \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주목받게 된 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">come \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">focus\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 내부 고발자 보호가 주목받게 된 것은 놀라운 일이 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Hence는 앞 문장의 이유를 받아 결론을 이끈다. it is no surprise that 구문은 \u003cb class=\"key\">가주어·진주어\u003c/b> 구조로, \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자 \u003c/b>\u003cb class=\"key\">보호\u003c/b>가 \u003cb class=\"key\">주목받게 \u003c/b>\u003cb class=\"key\">된\u003c/b> 것이 놀라운 일이 아니라는 뜻을 전달한다. 이 문장은 글의 중심 주제인 내부 고발자 보호의 필요성을 처음으로 드러내는 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it · 진주어 that절\u003c/span> : It + [be동사] + [no surprise] + that + [주어 + 동사] : \"내부 고발자 보호가 주목받게 된 것은 놀라운 일이 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 · 관용 표현 come into focus\u003c/span> : has + [과거분사 come] + into focus : \"주목받게 된\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Hence, 따라서. it is no surprise, 놀라운 일이 아니다. that whistleblower protection, 내부 고발자 보호가. has come into focus, 주목받게 된 것은. 이 문장 전체를 해석하면, 따라서 내부 고발자 보호가 주목받게 된 것은 놀라운 일이 아니다.","hl":"m"},{"n":19,"text":"세 번째 문장은 Hence 즉 따라서로 시작하면서 앞 문장의 이유를 받아 결론을 내립니다. it is no surprise that 구문은 가주어 진주어 구조인데, 내부 고발자 보호가 주목받게 된 것은 놀라운 일이 아니라는 뜻을 깔끔하게 전달하죠. 이 문장이 이 글의 중심 주제인 내부 고발자 보호의 필요성을 처음으로 드러내는 문장입니다.","hl":"mn"},{"n":20,"text":"세 번째 문장의 핵심 어법은 가주어 진주어 구문입니다. it is no surprise that whistleblower protection has come into focus에서 it은 가짜 주어이고 진짜 주어는 that절 전체입니다. that whistleblower protection has come into focus가 문장 뒤로 이동한 구조라고 보면 되죠. has come into focus는 현재완료로 주목받게 된 변화의 결과를 나타내고 come into focus는 관심의 초점에 들어오다라는 뜻입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 법과 질서의 위반이 여러 해 동안 적발되지도 처벌받지도 않는다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">violations \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">law \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">undetected \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">unpunished \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">years\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 기업의 직원들이 위법 행위를 신고하기를 꺼리기 때문에\u003c/span>\u003cspan class=\"en\">because employees of a company \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">fear \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">report \u003c/span>\u003cspan class=\"tgt\">illegal \u003c/span>\u003cspan class=\"tgt\">activities\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보복이나 불이익을 두려워하여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">fear \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">reprisals \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">consequences\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 여러 가지 부정적인 영향을 미칠 수 있다.\u003c/span>\u003cspan class=\"en\">it can have several negative effects.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기업의 직원들이 보복이나 불이익을 두려워하여 위법 행위를 신고하기를 꺼려서 법과 질서의 위반이 여러 해 동안 적발되지도 처벌받지도 않는다면, 그것은 여러 가지 부정적인 영향을 미칠 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 제기한 내부 고발자 보호의 필요성을 뒷받침하는 조건문입니다. 직원들이 \u003cb class=\"key\">보복에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">두려움\u003c/b> 때문에 신고를 피하면 위법 행위가 오랫동안 드러나지 않고 처벌도 받지 않게 된다는 \u003cb class=\"key\">조건\u003c/b>을 제시하고, 그 결과로 여러 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>이 생긴다고 말합니다. 이는 다음 문장에서 부정적 영향을 구체화하기 위한 논리적 연결 고리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 (if절)\u003c/span> : If + S + V ~, S + V ~ : \"만약 법과 질서의 위반이 여러 해 동안 적발되지도 처벌받지도 않는다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">go + 과거분사 (2형식 동사)\u003c/span> : go + [과거분사/형용사](주격 보어) : \"적발되지 않고 처벌받지 않은 상태가 되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : fear + [to부정사구](목적어) : \"위법 행위를 신고하기를 꺼리다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사구 (이유/원인)\u003c/span> : for fear of + [명사구] : \"보복이나 불이익을 두려워하여\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"If violations of law and order go undetected and unpunished for years, 만약 법과 질서의 위반이 여러 해 동안 적발되지도 처벌받지도 않는다면. because employees of a company fear to report illegal activities, 왜냐하면 기업의 직원들이 위법 행위를 신고하기를 꺼리기 때문에. for fear of reprisals or consequences, 보복이나 불이익을 두려워하여. it can have several negative effects, 그것은 여러 가지 부정적인 영향을 미칠 수 있다.. 이 문장 전체를 해석하면, 기업의 직원들이 보복이나 불이익을 두려워하여 위법 행위를 신고하기를 꺼려서 법과 질서의 위반이 여러 해 동안 적발되지도 처벌받지도 않는다면, 그것은 여러 가지 부정적인 영향을 미칠 수 있다.","hl":"m"},{"n":22,"text":"이 문장은 조건절을 앞세워서, 직원들이 보복이나 불이익이 두려워 신고를 하지 않으면 위법 행위가 오랫동안 적발되지 않고 처벌도 받지 않게 되고, 결국 여러 부정적 영향이 생긴다는 논리를 제시해요. if절이 조건을, 주절이 결과를 맡고 있어요. 특히 for fear of reprisals라는 표현이 고발을 꺼리는 심리를 구체적으로 보여줍니다.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 조건의 부사절 if절입니다. If violations of law and order go undetected and unpunished for years 전체가 조건을 나타내는 부사절이고, 뒤에 결과가 나오죠. 두 번째 어법 포인트는 go undetected and unpunished입니다. 여기서 go는 2형식 동사로 쓰여서 뒤에 과거분사 undetected와 unpunished를 주격 보어로 취했어요. 적발되지 않고 처벌받지 않은 상태가 된다는 상태 변화를 나타냅니다. 세 번째는 fear to report illegal activities입니다. fear는 to부정사를 목적어로 취하는 동사라서 신고하기를 꺼리다로 해석해요. 네 번째는 for fear of reprisals or consequences입니다. for fear of는 무엇을 두려워하여라는 뜻의 전치사구로, 신고를 꺼리는 이유를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 해당 기업 자체에 해를 끼치지만\u003c/span>\u003cspan class=\"en\">It can harm \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">company \u003c/span>\u003cspan class=\"tgt\">itself\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 제삼자,\u003c/span>\u003cspan class=\"en\">but also \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">thirdparties, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경제 전반,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">economy \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">general, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반 대중,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">general \u003c/span>\u003cspan class=\"tgt\">public, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 법치주의마저도 영향을 받을 수 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">rule \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">law\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">affected\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 해당 기업 자체에 해를 끼치지만 또한 제삼자, 경제 전반, 일반 대중, 심지어 법치주의마저도 영향을 받을 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 several negative effects를 구체적으로 나열하는 확장입니다. 피해가 \u003cb class=\"key\">해당 \u003c/b>\u003cb class=\"key\">기업 \u003c/b>\u003cb class=\"key\">자체\u003c/b>에서 시작해 \u003cb class=\"key\">제삼자\u003c/b>, 경제 전반, 일반 대중, 그리고 \u003cb class=\"key\">법치주의\u003c/b>까지 미칠 수 있다고 점층적으로 보여 줍니다. 마지막에 법치주의까지 거론하며 문제의 심각성을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">재귀대명사의 강조 용법\u003c/span> : 명사 + itself : \"해당 기업 자체\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조 (A, B, C, and D)\u003c/span> : A, B, C, and D : \"제삼자, 경제 전반, 일반 대중, 그리고 법치주의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 could + 수동태\u003c/span> : could + be + [과거분사] : \"영향을 받을 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It can harm the company itself, 그것은 해당 기업 자체에 해를 끼치지만. but also thirdparties, 또한 제삼자. the economy in general, 경제 전반. the general public, 일반 대중. and even the rule of law could be affected, 심지어 법치주의마저도 영향을 받을 수 있다.. 이 문장 전체를 해석하면, 그것은 해당 기업 자체에 해를 끼치지만 또한 제삼자, 경제 전반, 일반 대중, 심지어 법치주의마저도 영향을 받을 수 있다.","hl":"m"},{"n":25,"text":"이 문장은 앞에서 말한 여러 부정적 영향을 구체적으로 나열합니다. 회사 자체만 피해를 보는 것이 아니라 제삼자, 경제 전반, 일반 대중, 법치주의까지 피해가 확대될 수 있다고 말해요. 특히 마지막에 법치주의가 영향을 받을 수 있다는 말로 위법 행위가 사회 전체의 기초를 흔들 수 있다는 점을 강조합니다.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 재귀대명사 강조 용법입니다. the company itself에서 itself가 company를 강조해서 그 기업 자체라고 해석해요. 두 번째는 could be affected입니다. 주어가 영향을 받는 대상이기 때문에 수동태가 쓰였고 could가 가능성을 나타내요. 세 번째는 병렬 구조입니다. thirdparties, the economy in general, the general public, and even the rule of law처럼 쉼표와 and로 여러 대상을 나란히 연결해서 부정적 영향의 범위가 점점 넓어지는 걸 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 사람들을 보호하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Protecting \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위법하거나 심지어 범죄인 행위를 줄이는 데 도움을 주려는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">assist \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">reducing \u003c/span>\u003cspan class=\"tgt\">unlawful \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">criminal \u003c/span>\u003cspan class=\"tgt\">behaviour\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 가지 주요 기능을 지닌다:\u003c/span>\u003cspan class=\"en\">has two main functions:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사람의 행위를 보호하는 것과\u003c/span>\u003cspan class=\"en\">Protecting the individual's actions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공익을 보호하는 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">protecting \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">public \u003c/span>\u003cspan class=\"tgt\">good\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">위법하거나 심지어 범죄인 행위를 줄이는 데 도움을 주려는 사람들을 보호하는 것은 두 가지 주요 기능을 지닌다. 즉, 그 사람의 행위를 보호하는 것과 공익을 보호하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 내부 고발자 보호의 핵심 기능을 정리하는 문장입니다. \u003cb class=\"key\">위법 \u003c/b>\u003cb class=\"key\">행위\u003c/b>를 줄이려는 사람들을 보호하는 것이 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">행위 \u003c/b>\u003cb class=\"key\">보호\u003c/b>와 \u003cb class=\"key\">공익 \u003c/b>\u003cb class=\"key\">보호\u003c/b>라는 두 가지 기능을 한다고 제시합니다. 앞서 지적한 부정적 영향에 대한 해결 방향으로 이어지는 문장으로, 글의 논리적 중심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : Protecting [목적어/수식어] + has ... : \"위법하거나 범죄 행위를 줄이는 데 도움을 주려는 사람들을 보호하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사 those + who + [동사구] : \"위법하거나 심지어 범죄 행위를 줄이는 데 도움을 주려는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">as well as + 동명사 (병렬)\u003c/span> : A as well as B : \"공익을 보호하는 것\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Protecting those, 그런 사람들을 보호하는 것은. who would assist in reducing unlawful or even criminal behaviour, 위법하거나 심지어 범죄인 행위를 줄이는 데 도움을 주려는. has two main functions, 두 가지 주요 기능을 지닌다:. Protecting the individual's actions, 그 사람의 행위를 보호하는 것과. as well as protecting the public good, 공익을 보호하는 것이다.. 이 문장 전체를 해석하면, 위법하거나 심지어 범죄인 행위를 줄이는 데 도움을 주려는 사람들을 보호하는 것은 두 가지 주요 기능을 지닌다. 즉, 그 사람의 행위를 보호하는 것과 공익을 보호하는 것이다.","hl":"m"},{"n":28,"text":"이 문장은 내부 고발자 보호의 기능을 두 가지로 정리합니다. 위법하거나 범죄 행위를 줄이려는 사람들을 보호하는 것은 개인의 행위를 보호하는 것과 공익을 보호하는 것이라는 거죠. 앞에서 문제점을 지적했다면 이 문장은 보호 제도의 핵심 역할을 요약해 주는 문장이에요.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 동명사구 주어입니다. Protecting those who would assist in reducing unlawful or even criminal behaviour가 주어 역할을 하고, 뒤에 has라는 동사가 왔어요. 주어가 길어서 해석할 때 보호하는 것은이라고 끊어주는 게 좋아요. 두 번째는 주격 관계대명사 who입니다. who가 선행사 those를 수식하면서 뒤에서 주어 역할을 해요. 세 번째는 as well as protecting the public good입니다. as well as가 두 동명사구를 병렬로 연결해서 기능이 두 가지라는 점을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균형이 잘 잡힌 내부 고발자 보호는\u003c/span>\u003cspan class=\"en\">A wellbalanced whistleblower protection\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가질 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긍정적인 영향을\u003c/span>\u003cspan class=\"en\">positive \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">effects \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 두 가지 모두에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">these\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">균형이 잘 잡힌 내부 고발자 보호는 이 두 가지 모두에 긍정적인 영향을 미칠 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 제시한 두 가지 기능, 즉 \u003cb class=\"key\">개인의 \u003c/b>\u003cb class=\"key\">행위 \u003c/b>\u003cb class=\"key\">보호\u003c/b>와 \u003cb class=\"key\">공익 \u003c/b>\u003cb class=\"key\">보호\u003c/b>를 both of these가 가리키며, 균형이 잘 잡힌 내부 고발자 보호가 그 두 가지 모두에 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 줄 수 있다고 정리하는 결론 문장이다. may have는 무조건 그렇게 된다고 단정하지 않고 가능성으로 표현해, 제도를 마냥 만능으로 보지 않도록 논리적 \u003cb class=\"key\">완충\u003c/b>을 둔 어감이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may + 동사원형\u003c/span> : 주어 + 조동사 may + 동사원형 + 목적어 : \"~할 수 있다, ~일지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 on (effect on + 명사)\u003c/span> : effect(s) on + 명사(구) : \"~에 대한 영향\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">both of + 복수 대명사\u003c/span> : both of + 복수 명사/대명사 : \"이 두 가지 모두\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"A wellbalanced whistleblower protection, 균형이 잘 잡힌 내부 고발자 보호는. may have, 가질 수 있다. positive effects, 긍정적인 영향을. on both of these, 이 두 가지 모두에. 이 문장 전체를 해석하면, 균형이 잘 잡힌 내부 고발자 보호는 이 두 가지 모두에 긍정적인 영향을 미칠 수 있다.","hl":"m"},{"n":31,"text":"이 문장은 바로 앞 문장에서 말한 두 가지 기능, 즉 개인의 행위를 보호하는 것과 공익을 보호하는 것, 이 둘을 both of these로 받고 있어요. 균형이 잘 잡힌 내부 고발자 보호는 그 두 가지 모두에 긍정적인 영향을 미칠 수 있다고 정리하면서 글 전체를 마무리하는 결론 문장이에요. may have라고 해서 무조건 긍정적이라고 단정하지 않고 가능성의 의미를 열어 둔 표현이라는 점도 기억해 두세요.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 may have입니다. 조동사 may 다음에 동사원형 have가 와서 가능성이나 추측을 나타내요. 여기서는 긍정적인 영향을 미칠 수 있다는 뜻으로, 단정하지 않고 가능성의 의미를 전달합니다. 두 번째 어법 포인트는 effects on입니다. effect는 보통 on과 함께 쓰여서 무엇에 대한 영향인지 그 대상을 연결해 줘요. 여기서는 positive effects on both of these, 즉 이 두 가지 모두에 대한 긍정적인 영향이라는 구조입니다. 세 번째 어법 포인트는 both of these입니다. both of 다음에 복수 대명사 these가 와서 앞 문장에서 제시한 두 가지를 가리켜요. 각각 따로가 아니라 둘 모두를 묶어서 말할 때 쓰는 표현입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>최근 기업 차원의 \u003cb class=\"key\">위법 \u003c/b>\u003cb class=\"key\">행위\u003c/b>가 증가했고, 이는 용기 있는 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자\u003c/b>의 희생으로 드러나는 경우가 많다.\u003c/li>\u003cli>직원들이 \u003cb class=\"key\">보복\u003c/b>을 두려워해 신고하지 않으면 위법이 적발·처벌되지 않아 기업과 사회 전반에 부정적 영향을 미친다.\u003c/li>\u003cli>\u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자 \u003c/b>\u003cb class=\"key\">보호\u003c/b>는 개인의 행위를 보호하고 \u003cb class=\"key\">공익\u003c/b>을 지키는 두 가지 기능을 한다.\u003c/li>\u003cli>\u003cb class=\"key\">균형 \u003c/b>\u003cb class=\"key\">잡힌 \u003c/b>\u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자 \u003c/b>\u003cb class=\"key\">보호\u003c/b>는 두 측면 모두에 긍정적인 영향을 미칠 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Well-balanced whistleblower protection benefits both individuals and the public good.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">기업의 \u003cb class=\"key\">위법 \u003c/b>\u003cb class=\"key\">행위\u003c/b>를 끝내려는 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자\u003c/b>가 보복을 두려워하면 범죄가 방치되므로, \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">고발자 \u003c/b>\u003cb class=\"key\">보호\u003c/b>가 주목받는다. \u003cb class=\"key\">균형 \u003c/b>\u003cb class=\"key\">잡힌 \u003c/b>\u003cb class=\"key\">보호\u003c/b>는 개인의 행위와 \u003cb class=\"key\">공익\u003c/b>을 모두 지키는 긍정적 기능을 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 배운 내용을 정리해 볼게요. 기업의 위법 행위를 막기 위해 용기 있는 내부 고발자가 중요하고, 그들이 보복을 두려워하지 않도록 보호 제도가 필요해요. 균형 잡힌 내부 고발자 보호는 개인의 행위와 공익이라는 두 가지를 모두 지켜 준다는 것이 이 글의 핵심이에요. 이 구조를 기억해 두면 비슷한 논설문을 읽을 때도 큰 도움이 될 거예요. 오늘 수업은 여기까지입니다. 수고 많았어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
