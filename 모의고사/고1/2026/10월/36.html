<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 36번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 36번","audioDir":"36_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">36번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>No Listener, No Sound: Sound Is a Psychological Product of the Brain\u003c/h1>\u003ch2>듣는 이 없으면 소리 없다: 소리는 뇌의 심리학적 산물\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>소리의 물리적 시작은 \u003cb class=\"key\">분자의 \u003c/b>\u003cb class=\"key\">교란\u003c/b>이지만, 소리는 \u003cb class=\"key\">뇌\u003c/b>에서 만들어지는 \u003cb class=\"key\">심리학적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>이다. 따라서 숲에서 나무가 쓰러져도 듣는 생명체가 없으면 소리는 발생하지 않는다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Sound is not the physical disturbance of molecules but a psychological perception created in the brain, so no creature hearing it means no sound.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 다룰 지문은 우리가 당연히 물리적 현상이라고 생각하는 소리에 대해 새로운 시각을 던지는 글입니다. 이 글은 소리가 단순한 분자의 교란이 아니라 뇌가 만드는 심리학적 개념이라고 주장합니다. 제목처럼 듣는 이가 없으면 소리는 없다는, 조금은 철학적인 이야기를 함께 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 흔히 소리라고 부르는 것은 사실 두 단계로 나뉩니다. 먼저 공기나 물 같은 매질을 타고 전달되는 물리적 진동인 \u003cb class=\"key\">sound \u003c/b>\u003cb class=\"key\">wave\u003c/b>가 있고, 이것이 귀의 고막을 진동시키면 달팽이관의 청각세포가 신경 신호로 바꿉니다. 그 신호가 뇌의 청각 피질 \u003cb class=\"key\">auditory \u003c/b>\u003cb class=\"key\">cortex\u003c/b>에 도달해야 비로소 우리가 아는 소리로 경험됩니다. Isaac Newton은 빛도 이와 비슷해서, 빛의 파동 자체는 무색 \u003cb class=\"key\">colorless\u003c/b>이고 색은 뇌가 만드는 지각이라고 봤습니다. 예를 들어 텔레비전 전파는 방 안에 가득하지만 텔레비전이 켜져 있지 않으면 아무도 영상을 보지 못하는 것과 같은 이치예요. 그러므로 물리적 자극과 심리적 경험을 구분하는 것이 이 지문의 핵심입니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 소리는 보통 공기나 물 같은 매질을 타고 오는 진동이라고 배우죠. 이 진동을 sound wave라고 하고, 이것이 귀의 고막을 흔들면 달팽이관에서 신경 신호로 바뀌어 뇌로 전달됩니다. 뇌의 청각 피질, auditory cortex에 도달해야만 비로소 우리가 소리라고 느끼는 거예요. 아이작 뉴턴은 빛도 마찬가지라고 봤습니다. 빛의 파동 자체는 무색, colorless이고 색은 뇌가 만드는 지각이라는 거죠. 텔레비전 전파가 방 안에 가득해도 텔레비전이 꺼져 있으면 아무도 영상을 못 보는 것과 비슷한 이치입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>소리의 물리적 출발과 빛의 비유\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>모든 소리는 공기, 물 같은 매질 속 \u003cb class=\"key\">분자의 \u003c/b>\u003cb class=\"key\">교란\u003c/b>으로 시작된다. Isaac Newton은 빛의 파동이 \u003cb class=\"key\">무색\u003c/b>이며 색 지각은 \u003cb class=\"key\">뇌\u003c/b>에서만 일어난다고 지적했다. 소리도 이와 마찬가지임을 제시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>소리는 뇌에 도달해야만 성립\u003csmall>주장 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>소리 지각은 \u003cb class=\"key\">고막\u003c/b>에서 시작되며, 고막 전에는 단지 분자의 교란에 불과하다. 측정기와 도구로 측정할 수 있지만 \u003cb class=\"key\">뇌\u003c/b>에 도달하기 전까지는 \u003cb class=\"key\">소리\u003c/b>가 아니라고 주장한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>숲의 나무 난제와 답변\u003csmall>예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>오래된 철학적 \u003cb class=\"key\">난제\u003c/b>를 제시한다. 소리는 \u003cb class=\"key\">심리학적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>이자 \u003cb class=\"key\">뇌의 \u003c/b>\u003cb class=\"key\">산물\u003c/b>이므로, 듣는 사람이 없으면 소리가 아니라고 답한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>듣는 생명체가 없다면 소리 없음\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>나무는 \u003cb class=\"key\">분자의 \u003c/b>\u003cb class=\"key\">교란\u003c/b>과 혼란을 만들지만, 어떤 생명체도 듣지 않으면 소리를 낸 것이 아니라고 결론짓는다. 물리적 사건과 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">지각\u003c/b>을 분명히 구분한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 모든 소리가 공기나 물 같은 매질 속 분자의 교란에서 시작된다고 말합니다. 아이작 뉴턴은 빛의 파동이 무색이며 색 지각은 오직 뇌에서만 일어난다고 지적했어요. 그래서 소리도 이와 마찬가지라고 연결합니다. 여기서 빛의 색과 소리를 나란히 두는 유추가 시작됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계가 이 글의 핵심 주장입니다. 소리 지각은 우리 고막에서 시작되고 고막에 도달하기 전에는 오직 분자의 교란에 불과하다는 거예요. 측정기와 도구로 그 교란을 측정할 수는 있지만 뇌에 도달하기 전까지는 소리가 아니라고 잘라 말합니다. 물리적 측정과 심리적 경험을 구분하는 중요한 부분이죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 여러분도 한번쯤 들어봤을 철학적 난제를 등장시킵니다. 숲에서 나무가 쓰러지고 그 소리를 들을 사람이 아무도 없다면 그것은 소리를 만든 걸까요. 글은 아니라고 답합니다. 소리는 심리학적 개념, 곧 뇌가 만들어 내는 산물이기 때문이라는 거죠.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 그 나무가 분자를 교란하고 혼란을 만들지만 새나 여우나 인간 어느 생명체도 듣지 않으면 소리를 내지 않았다고 정리합니다. 물리적 사건이 일어났어도 지각하는 뇌가 없으면 소리라는 심리적 사건은 없다는 결론입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">처음에는 소리가 \u003cb class=\"key\">분자의 \u003c/b>\u003cb class=\"key\">교란\u003c/b>에서 시작된다는 물리적 정의를 제시하지만, Newton의 빛 비유를 거쳐 소리도 뇌의 지각임을 주장한다. 철학적 난제를 던지고 No로 답하면서 주제문이 되는 문장 7을 제시한다. 마지막 문장에서 그 주장을 다시 확인하므로 미괄식 구조로 볼 수 있다. 따라서 이 글은 물리적 사실보다 \u003cb class=\"key\">심리학적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>을 강조하는 주장-근거 전개이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>The same is true (3)\u003c/b>\u003cspan>유사성 강조\u003c/span>\u003cb>Thus (4)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003cb>but (5)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>If (6)\u003c/b>\u003cspan>조건·가정\u003c/span>\u003cb>No (7)\u003c/b>\u003cspan>단정적 답변\u003c/span>\u003cb>because (7)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>but (8)\u003c/b>\u003cspan>대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">disturbs molecules\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the disturbance of molecules\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">that disturbance\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">disturb molecules\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>분자의 교란 (물리적 현상)\u003c/th>\u003cth>소리 (심리적 지각)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>공기나 물 등 매질에서 시작됨\u003c/td>\u003ctd>뇌에서만 만들어짐\u003c/td>\u003c/tr>\u003ctr>\u003ctd>측정기와 도구로 측정 가능함\u003c/td>\u003ctd>측정기로는 포착할 수 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>고막 전에도 존재함\u003c/td>\u003ctd>고막 이후 뇌의 산물임\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 소리가 분자의 교란에서 시작된다는 물리적 사실을 먼저 제시하고, 뉴턴의 빛 비유를 근거로 삼아 소리도 뇌의 지각임을 주장하는 주장 근거 구조입니다. 마지막에 철학적 난제에 답을 내리면서 핵심 문장을 강조하는 미괄식 구성을 취하고 있어요. 그래서 초반의 분자 이야기가 끝까지 어떻게 이어지는지 보면 물리적 자극과 심리적 지각의 구분이 선명해집니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 글의 구조가 더 잘 보여요. 세 번째 문장에서 The same is true라고 하여 빛과 소리의 공통점을 강조하고, 네 번째 문장에서 Thus와 but으로 논리를 전환합니다. 여섯 번째 문장의 If는 가정을, 일곱 번째 문장의 No와 because는 단정과 이유를 드러내죠. 그리고 분자의 교란이라는 표현이 분자를 교란하다로 되풀이되면서 중심 개념을 반복합니다. 물리적 현상과 심리적 지각이라는 대조도 이 글의 뼈대를 이루고요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>begin\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>motion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운동, 움직임\u003c/span>\u003c/div>\u003cdiv>\u003cb>disturb\u003c/b>\u003cem>동사\u003c/em>\u003cspan>교란하다, 흔들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>molecule\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분자\u003c/span>\u003c/div>\u003cdiv>\u003cb>medium\u003c/b>\u003cem>명사\u003c/em>\u003cspan>매질\u003c/span>\u003c/div>\u003cdiv>\u003cb>note\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지적하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wave\u003c/b>\u003cem>명사\u003c/em>\u003cspan>파동\u003c/span>\u003c/div>\u003cdiv>\u003cb>colorless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무색의\u003c/span>\u003c/div>\u003cdiv>\u003cb>perception\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인식, 지각\u003c/span>\u003c/div>\u003cdiv>\u003cb>occur\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일어나다, 발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>living organism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>살아 있는 생명체\u003c/span>\u003c/div>\u003cdiv>\u003cb>brain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뇌\u003c/span>\u003c/div>\u003cdiv>\u003cb>true\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사실인, 맞는\u003c/span>\u003c/div>\u003cdiv>\u003cb>eardrum\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고막\u003c/span>\u003c/div>\u003cdiv>\u003cb>hit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도달하다, 때리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nothing more than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 불과하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>measure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>측정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gauge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>측정기\u003c/span>\u003c/div>\u003cdiv>\u003cb>instrument\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도구, 기구\u003c/span>\u003c/div>\u003cdiv>\u003cb>until\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~할 때까지\u003c/span>\u003c/div>\u003cdiv>\u003cb>philosophical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>철학적\u003c/span>\u003c/div>\u003cdiv>\u003cb>riddle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>난제, 수수께끼\u003c/span>\u003c/div>\u003cdiv>\u003cb>forest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숲\u003c/span>\u003c/div>\u003cdiv>\u003cb>psychological\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>심리학적\u003c/span>\u003c/div>\u003cdiv>\u003cb>concept\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개념\u003c/span>\u003c/div>\u003cdiv>\u003cb>product\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산물\u003c/span>\u003c/div>\u003cdiv>\u003cb>make a mess\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>혼란을 만들다, 엉망으로 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>creature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생명체, 피조물\u003c/span>\u003c/div>\u003cdiv>\u003cb>fox\u003c/b>\u003cem>명사\u003c/em>\u003cspan>여우\u003c/span>\u003c/div>\u003cdiv>\u003cb>human\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인간\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이 지문에서 중요한 단어를 몇 개 짚어 볼게요. disturb는 분자를 흐트러뜨리다, 교란하다라는 뜻이고, molecule은 분자, medium은 매질을 말합니다. perception은 인식, 지각이라는 뜻으로 등장하고, eardrum은 고막, gauge는 측정기를 뜻해요. 마지막에 나오는 psychological은 심리학적, concept은 개념, product는 산물이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">disturb\u003c/b>\u003cspan class=\"m\">교란하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">agitate\u003c/span>\u003cspan class=\"s\">disrupt\u003c/span>\u003cspan class=\"s\">upset\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">settle\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">perception\u003c/b>\u003cspan class=\"m\">지각, 인식\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">awareness\u003c/span>\u003cspan class=\"s\">recognition\u003c/span>\u003cspan class=\"s\">sensation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignorance\u003c/span>\u003cspan class=\"a\">unawareness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">begin\u003c/b>\u003cspan class=\"m\">시작하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">start\u003c/span>\u003cspan class=\"s\">commence\u003c/span>\u003cspan class=\"s\">initiate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">end\u003c/span>\u003cspan class=\"a\">finish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">true\u003c/b>\u003cspan class=\"m\">사실인, 맞는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">real\u003c/span>\u003cspan class=\"s\">actual\u003c/span>\u003cspan class=\"s\">genuine\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">false\u003c/span>\u003cspan class=\"a\">imaginary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">psychological\u003c/b>\u003cspan class=\"m\">심리학적\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mental\u003c/span>\u003cspan class=\"s\">cognitive\u003c/span>\u003cspan class=\"s\">perceptual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">physical\u003c/span>\u003cspan class=\"a\">bodily\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">product\u003c/b>\u003cspan class=\"m\">산물\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">result\u003c/span>\u003cspan class=\"s\">outcome\u003c/span>\u003cspan class=\"s\">creation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cause\u003c/span>\u003cspan class=\"a\">source\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 함께 정리할게요. disturb는 agitate, disrupt, upset과 바꿔 쓸 수 있고 calm, settle과는 반대입니다. perception은 awareness, recognition, sensation과 동의어이고 ignorance, unawareness와 반대예요. begin과 true는 각각 start, commence, initiate나 real, actual, genuine과 비슷하고 end, finish나 false, imaginary와 반대라는 점을 기억하세요. psychological은 mental, cognitive, perceptual과 통하고 physical, bodily와 반대이며, product는 result, outcome, creation과 동의어이고 cause, source와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 소리는 어떤 종류의 운동에서 시작된다,\u003c/span>\u003cspan class=\"en\">All sound begins with \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">motion, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 분자들을 교란하는 어떤 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">disturbs \u003c/span>\u003cspan class=\"tgt\">molecules\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공기, 물, 강철, 나무 또는 다른 매질 속의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">air, \u003c/span>\u003cspan class=\"tgt\">water, \u003c/span>\u003cspan class=\"tgt\">steel, \u003c/span>\u003cspan class=\"tgt\">wood, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">medium\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 소리는 어떤 종류의 운동, 즉 공기, 물, 강철, 나무 또는 다른 매질 속의 분자들을 교란하는 어떤 것에서 시작된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 소리의 물리적 정의를 제시하는 도입부입니다. 모든 소리는 공기나 물 같은 \u003cb class=\"key\">매질\u003c/b> 속 분자들을 \u003cb class=\"key\">교란\u003c/b>하는 운동에서 시작된다는 뜻입니다. 아직 뇌와 인식의 문제는 언급하지 않고 과학적 \u003cb class=\"key\">물리 \u003c/b>\u003cb class=\"key\">현상\u003c/b>만을 말하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격(apposition)의 쉼표\u003c/span> : some kind of motion, something [앞 명사구의 부연 설명] : \"어떤 종류의 운동, 즉 어떤 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : something [선행사] + that [주격 관계대명사] + disturbs [동사] + molecules [목적어] : \"분자들을 교란하는 어떤 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 or에 의한 병렬 구조\u003c/span> : in + air, water, steel, wood, or + other medium [전치사 뒤 명사구 병렬] : \"공기, 물, 강철, 나무 또는 다른 매질 속의\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"All sound begins with some kind of motion, 모든 소리는 어떤 종류의 운동에서 시작된다. something that disturbs molecules, 즉 분자들을 교란하는 어떤 것. in air, water, steel, wood, or other medium, 공기, 물, 강철, 나무 또는 다른 매질 속의. 이 문장 전체를 해석하면, 모든 소리는 어떤 종류의 운동, 즉 공기, 물, 강철, 나무 또는 다른 매질 속의 분자들을 교란하는 어떤 것에서 시작된다.","hl":"m"},{"n":13,"text":"이 문장은 소리의 물리적 정의를 제시하는 도입부예요. 모든 소리는 공기나 물 같은 매질 속 분자들을 움직이게 하는 운동에서 출발한다는 뜻입니다. 여기서는 아직 소리가 심리적 개념이라는 주장은 나오지 않고, 분자의 교란이라는 과학적 현상만 말하고 있어요.","hl":"mn"},{"n":14,"text":"이 문장에서 중요한 어법은 세 가지예요. 첫째, something that disturbs molecules에서 that은 선행사 something을 수식하는 주격 관계대명사입니다. 관계대명사 뒤에 바로 동사 disturbs가 왔죠. 둘째, some kind of motion과 그 뒤의 something that disturbs molecules는 쉼표로 연결된 동격 관계입니다. 앞의 motion을 부연 설명하는 거예요. 셋째, in air, water, steel, wood, or other medium에서 air, water, steel, wood가 등위접속사 or로 병렬 연결되어 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Isaac Newton은 지적했다\u003c/span>\u003cspan class=\"en\">Isaac Newton \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">noted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빛의 파동은 색이 없다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">light \u003c/span>\u003cspan class=\"tgt\">waves \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">colorless\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">색에 대한 인식은 오직 일어난다\u003c/span>\u003cspan class=\"en\">the perception of color only occurs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">살아 있는 생명체의 뇌에서만\u003c/span>\u003cspan class=\"en\">in the brain \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">living \u003c/span>\u003cspan class=\"tgt\">organism\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Isaac Newton은 빛의 파동은 색이 없으며, 즉, 색에 대한 인식은 오직 살아 있는 생명체의 뇌에서만 일어난다고 지적했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 빛의 파동 자체에는 색이 없고, 색 인식은 \u003cb class=\"key\">살아 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">생명체의 \u003c/b>\u003cb class=\"key\">뇌\u003c/b>에서만 일어난다는 Newton의 견해를 제시합니다. 이를 통해 소리의 성질을 설명하기 위한 \u003cb class=\"key\">비유\u003c/b>를 마련합니다. 여기서 핵심은 물리적 파동과 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">인식\u003c/b>을 구분한 점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that\u003c/span> : Isaac Newton noted + that + 주어(light waves) + 동사(are) + 보어(colorless) : \"빛의 파동이 색이 없다고 지적했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격보어(2형식 문장)\u003c/span> : light waves [주어] + are [be동사] + colorless [형용사 보어] : \"빛의 파동은 색이 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 of의 형용사적 용법(후치 수식)\u003c/span> : the brain + of + a living organism [전치사구가 brain 수식] : \"살아 있는 생명체의 뇌\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Isaac Newton noted, Isaac Newton은 지적했다. that light waves are colorless, 빛의 파동은 색이 없다고. the perception of color only occurs, 색에 대한 인식은 오직 일어난다. in the brain of a living organism, 살아 있는 생명체의 뇌에서만. 이 문장 전체를 해석하면, Isaac Newton은 빛의 파동은 색이 없으며, 즉, 색에 대한 인식은 오직 살아 있는 생명체의 뇌에서만 일어난다고 지적했다.","hl":"m"},{"n":16,"text":"이 문장은 빛의 색이 물리적 파동 자체에 있는 것이 아니라 살아 있는 생명체의 뇌에서 인식되는 것임을 Newton의 말로 제시합니다. 소리도 이와 같다는 주장을 끌어내기 위한 비유예요.","hl":"mn"},{"n":17,"text":"이 문장에서는 세 가지를 정리하세요. 첫째, noted that light waves are colorless에서 that절이 noted의 목적어 역할을 하는 명사절입니다. 둘째, light waves are colorless는 주어 light waves에 be동사 are이 오고 그 뒤에 형용사 colorless가 주격보어로 온 이형식 문장입니다. 셋째, of a living organism은 앞의 the brain을 뒤에서 수식하는 전치사구로, 살아 있는 생명체의 뇌라는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">same\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소리에 대해 참이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">true \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">sound\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소리 역시 마찬가지이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 말한 빛과 색의 관계가 소리에도 그대로 적용된다는 전환점입니다. \u003cb class=\"key\">The \u003c/b>\u003cb class=\"key\">same\u003c/b>은 빛의 파동과 색 인식의 관계를 가리키고, \u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">true \u003c/b>\u003cb class=\"key\">of\u003c/b>는 그 성질이 소리에도 사실임을 나타냅니다. 글 전체에서 소리도 인식의 산물이라는 주장으로 넘어가는 연결 고리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 same\u003c/span> : The same [주어] + is true : \"같은 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be true of 관용 표현\u003c/span> : [The same] + is true + of + sound : \"소리에 대해 참이다, 소리 역시 마찬가지이다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The same, 같은 것은. is true of sound, 소리에 대해 참이다. 이 문장 전체를 해석하면, 소리 역시 마찬가지이다.","hl":"m"},{"n":19,"text":"이 문장은 앞의 빛 이야기를 소리에 연결하는 핵심 연결고리입니다. 빛의 파동이 무색이고 색 인식이 뇌에서 일어나듯이 소리도 그러하다는 겁니다.","hl":"mn"},{"n":20,"text":"여기서 is true of sound를 주목하세요. be true of는 에 대해 사실이다 해당되다라는 관용 표현입니다. The same은 앞에서 말한 색의 인식과 같은 원리를 받아 주는 대명사예요. 따라서 이 문장은 같은 원리가 sound에 적용된다는 의미입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서 소리에 대한 인식은\u003c/span>\u003cspan class=\"en\">Thus perception of sound\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 고막에서 시작되며, 그것이 우리의 고막에 도달하기 전에는,\u003c/span>\u003cspan class=\"en\">begins at our eardrums—\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">hits \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">eardrums\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 오직 ~에 불과하다\u003c/span>\u003cspan class=\"en\">it is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">nothing \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분자들의 교란에 불과하다.\u003c/span>\u003cspan class=\"en\">the disturbance of molecules.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 소리에 대한 인식은 우리의 고막에서 시작된다. 그것이 우리의 고막에 도달하기 전에는, 그것은 단지 분자들의 교란에 불과하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 소리에 대한 인식이 \u003cb class=\"key\">고막\u003c/b>에서 시작되며, 고막에 도달하기 전에는 단지 \u003cb class=\"key\">분자의 \u003c/b>\u003cb class=\"key\">교란\u003c/b>일 뿐임을 강조합니다. 소리를 듣는 주체가 없으면 소리로 성립되지 않는다는 핵심 전제를 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사절 접속사 before\u003c/span> : before + 주어 + 동사 : \"그것이 우리의 고막에 도달하기 전에는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 관용 표현\u003c/span> : nothing more than + 명사구 : \"단지 ~에 불과한\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Thus perception of sound, 따라서 소리에 대한 인식은. begins at our eardrums—before it hits our eardrums, 우리의 고막에서 시작되며, 그것이 우리의 고막에 도달하기 전에는. it is nothing more than, 그것은 오직 ~에 불과하다. the disturbance of molecules, 분자들의 교란에 불과하다.. 이 문장 전체를 해석하면, 따라서 소리에 대한 인식은 우리의 고막에서 시작된다. 그것이 우리의 고막에 도달하기 전에는, 그것은 단지 분자들의 교란에 불과하다.","hl":"m"},{"n":22,"text":"이 문장은 소리에 대한 인식이 고막에서 시작되며, 고막에 닿기 전에는 단지 분자들의 교란일 뿐이라는 뜻입니다. 소리라는 것은 우리 몸의 지각 기관을 통해서만 존재한다는 핵심을 강조합니다.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 before가 이끄는 부사절입니다. before it hits our eardrums는 그것이 우리의 고막에 도달하기 전에는이라는 시간을 나타냅니다. 두 번째 포인트는 nothing more than이라는 관용 표현입니다. 이는 단지 무엇에 불과하다라는 뜻으로, 뒤에 명사구 the disturbance of molecules가 옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 그 교란을 측정할 수 있다\u003c/span>\u003cspan class=\"en\">We can measure that disturbance\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">측정기와 도구로, 그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">gauges \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">instruments\u003c/span>, but\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 뇌에 도달할 때까지는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">until \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">hits \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">brain\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 소리가 아니다.\u003c/span>\u003cspan class=\"en\">it is not sound.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 측정기와 도구를 사용하여 그 교란을 측정할 수 있지만, 그것이 뇌에 도달할 때까지는 그것은 소리가 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기계로 분자의 교란을 측정할 수는 있지만, 뇌에 닿기 전까지는 결코 소리가 아니라는 뜻입니다. 소리는 물리적 파동이 아니라 뇌가 해석한 \u003cb class=\"key\">심리학적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>임을 재확인합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(수단)\u003c/span> : with + 수단·도구를 나타내는 명사구 : \"측정기와 도구를 사용하여\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사절 접속사 until\u003c/span> : until + 주어 + 동사 : \"그것이 뇌에 도달할 때까지는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"We can measure that disturbance, 우리는 그 교란을 측정할 수 있다. with gauges and instruments, but, 측정기와 도구로, 그러나. until it hits a brain, 그것이 뇌에 도달할 때까지는. it is not sound, 그것은 소리가 아니다.. 이 문장 전체를 해석하면, 우리는 측정기와 도구를 사용하여 그 교란을 측정할 수 있지만, 그것이 뇌에 도달할 때까지는 그것은 소리가 아니다.","hl":"m"},{"n":25,"text":"이 문장은 기계로 분자의 교란을 측정할 수는 있지만, 뇌에 닿기 전까지는 소리가 아니라는 뜻입니다. 소리는 물리적 파동이 아니라 뇌가 해석한 심리적 개념임을 다시 확인해 줍니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 with gauges and instruments라는 전치사구입니다. 측정기와 도구를 가지고라는 수단의 의미로 동사 measure를 수식합니다. 두 번째 포인트는 until이 이끄는 부사절입니다. until it hits a brain은 그것이 뇌에 도달할 때까지는이라는 의미로, 뒤에 오는 주절의 시점을 제한합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 들어 봤을지도 모른다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">heard\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래된 철학적 난제를,\u003c/span>\u003cspan class=\"en\">the old philosophical riddle,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 나무가 숲에서 쓰러지고\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">tree \u003c/span>\u003cspan class=\"tgt\">falls \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">forest\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 들을 사람이 아무도 없으면,\u003c/span>\u003cspan class=\"en\">and no one is there \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">hear \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 그것을 소리로 만드는가?\u003c/span>\u003cspan class=\"en\">does it \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">sound\u003c/span>?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 “숲에서 나무가 쓰러지고 그것을 들을 사람이 그곳에 아무도 없다면, 그것은 그것을 소리로 만드는가?”라는 오래된 철학적 난제를 들어 봤을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 유명한 \u003cb class=\"key\">철학적 \u003c/b>\u003cb class=\"key\">난제\u003c/b>를 인용하면서, 듣는 사람이 없을 때 소리가 만들어지는지를 묻습니다. 앞 문단의 논리를 대표적인 사고 실험으로 끌어와 독자의 주의를 환기하고, 소리는 뇌가 만드는 심리적 개념이라는 주장을 강화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may + have + 과거분사(p.p.)\u003c/span> : may have + p.p. : \"들었을지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조건의 부사절\u003c/span> : If + 주어 + 동사 현재형, 주어 + 동사 : \"만약 나무가 숲에서 쓰러지면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : no one + to부정사(to hear it) : \"그것을 들을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 동사원형\u003c/span> : make + 목적어 + 동사원형 : \"그것이 소리를 내도록 만들다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"You may have heard, 여러분은 들어 봤을지도 모른다. the old philosophical riddle, 오래된 철학적 난제를. \"If a tree falls in the forest, 만약 나무가 숲에서 쓰러지고. and no one is there to hear it, 그리고 그것을 들을 사람이 아무도 없으면. does it make it sound?\", 그것은 그것을 소리로 만드는가?. 이 문장 전체를 해석하면, 여러분은 “숲에서 나무가 쓰러지고 그것을 들을 사람이 그곳에 아무도 없다면, 그것은 그것을 소리로 만드는가?”라는 오래된 철학적 난제를 들어 봤을지도 모른다.","hl":"m"},{"n":28,"text":"이 문장은 유명한 철학적 난제를 인용하면서, 듣는 사람이 없을 때 소리가 만들어지는지를 묻습니다. 앞 문단의 논리를 대표적인 사고 실험으로 끌어와서 소리는 뇌가 만드는 심리적 개념이라는 주장을 강화해 줍니다.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 may have heard입니다. 과거에 들었을지도 모른다는 과거 사실에 대한 추측을 나타냅니다. 두 번째 포인트는 If a tree falls in the forest라는 조건의 부사절입니다. 나무가 숲에서 쓰러지는 상황을 가정합니다. 세 번째 포인트는 to hear it입니다. 이 to부정사가 앞에 있는 no one을 꾸며서 들을 사람이 없다는 의미를 만듭니다. 네 번째 포인트는 make it sound입니다. 사역동사 make가 목적어 it과 목적격 보어 sound를 취해서 그것이 소리를 내도록 만들다라는 뜻을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니다.\u003c/span>\u003cspan class=\"en\">No,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 소리는 심리학적 개념,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">sound \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">psychological \u003c/span>\u003cspan class=\"tgt\">concept\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 뇌가 만들어 내는 산물.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">product \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">brains\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아니다. 왜냐하면 소리는 심리학적 개념, 즉 뇌가 만들어 내는 산물이기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 철학적 난제에 대해 '아니다'라고 답하며, 소리는 \u003cb class=\"key\">심리학적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>이고 \u003cb class=\"key\">뇌가 \u003c/b>\u003cb class=\"key\">만들어 \u003c/b>\u003cb class=\"key\">내는 \u003c/b>\u003cb class=\"key\">산물\u003c/b>이라는 이유를 제시한다. 소리가 물리적 파동 자체가 아니라 뇌의 인식 작용이라는 글의 핵심 정의를 압축한 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">because 부사절 접속사(이유)\u003c/span> : because + 주어 + 동사(S+V) : \"왜냐하면 소리는 심리학적 개념이기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격(apposition)\u003c/span> : A, B (A를 B가 다시 설명) : \"즉 뇌가 만들어 내는 산물\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"No, 아니다.. because sound is a psychological concept, 왜냐하면 소리는 심리학적 개념. a product of brains, 즉 뇌가 만들어 내는 산물.. 이 문장 전체를 해석하면, 아니다. 왜냐하면 소리는 심리학적 개념, 즉 뇌가 만들어 내는 산물이기 때문이다.","hl":"m"},{"n":31,"text":"이 문장은 소리에 대한 핵심 정의를 내려요. 소리는 심리학적 개념이고 뇌가 만들어 내는 산물이라는 거예요. 따라서 나무가 쓰러져도 듣는 뇌가 없으면 소리가 아니라는 논리의 근거가 됩니다.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 because가 이끄는 이유의 부사절이에요. because sound is a psychological concept이 앞의 No에 대한 이유를 설명해요. 두 번째 포인트는 a product of brains가 앞의 a psychological concept을 다시 설명하는 동격이라는 점이에요. 즉 뇌가 만들어 내는 산물이라고 부연해 주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 나무는 분자들을 교란할 것이다\u003c/span>\u003cspan class=\"en\">That tree will \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">disturb \u003c/span>\u003cspan class=\"tgt\">molecules \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 혼란을 만들어 낼 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">mess\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 어떤 생명체도 그것을 듣지 않는다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">creature \u003c/span>\u003cspan class=\"tgt\">hears \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 어떤 새도, 여우도, 또는 인간도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">bird, \u003c/span>\u003cspan class=\"tgt\">fox, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">human\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 소리를 낸 것이 아니다.\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">sound\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 나무는 분자들을 교란하고 혼란을 만들어 낼 것이지만, 어떤 생명체도, 즉 어떤 새도, 여우도, 또는 인간도 그것을 듣지 않는다면, 그것은 소리를 낸 것이 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 원리를 나무의 사례에 적용해, 물리적 교란만으로는 소리가 될 수 없고 \u003cb class=\"key\">뇌를 \u003c/b>\u003cb class=\"key\">가진 \u003c/b>\u003cb class=\"key\">생명체\u003c/b>의 \u003cb class=\"key\">인식\u003c/b>이 있어야 소리가 된다는 점을 구체화한다. 나무가 분자를 교란하고 혼란을 만들어도 듣는 생명체가 없으면 소리가 아니라는 뜻이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조(and)\u003c/span> : 동사구 1 + and + 동사구 2 : \"분자들을 교란하고 혼란을 만들어 낼 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">but 등위접속사 + if 조건 부사절\u003c/span> : but + if + 주어 + 동사 : \"그러나 어떤 생명체도 그것을 듣지 않는다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격(apposition) / 열거\u003c/span> : A, B (구체적 열거) : \"즉 어떤 새도, 여우도, 또는 인간도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">현재완료(완료/결과)\u003c/span> : have/has + not + 과거분사 : \"소리를 만들어 내지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"That tree will disturb molecules, 그 나무는 분자들을 교란할 것이다. and make a mess, 그리고 혼란을 만들어 낼 것이다. but if no creature hears it, 그러나 어떤 생명체도 그것을 듣지 않는다면. no bird, fox, or human, 즉 어떤 새도, 여우도, 또는 인간도. it has not made sound, 그것은 소리를 낸 것이 아니다.. 이 문장 전체를 해석하면, 그 나무는 분자들을 교란하고 혼란을 만들어 낼 것이지만, 어떤 생명체도, 즉 어떤 새도, 여우도, 또는 인간도 그것을 듣지 않는다면, 그것은 소리를 낸 것이 아니다.","hl":"m"},{"n":34,"text":"이 문장은 나무가 쓰러지는 구체적인 예를 들어 소리의 성립 조건을 다시 확인해 줘요. 나무가 분자를 교란하고 혼란을 만들더라도, 어떤 생명체도 듣지 않으면 그것은 소리를 낸 것이 아니에요. 즉 소리는 뇌를 가진 생명체의 인식이 있어야만 성립한다는 거죠.","hl":"mn"},{"n":35,"text":"첫 번째 포인트는 disturb molecules and make a mess에서 and가 두 동사구를 병렬로 연결한 거예요. 두 번째 포인트는 but if no creature hears it에서 if가 조건의 부사절을 이끈다는 점이에요. 세 번째 포인트는 no bird, fox, or human이 앞의 no creature를 새, 여우, 인간으로 구체화한 동격이라는 거예요. 네 번째 포인트는 has not made sound가 현재완료 형태로 결과적으로 소리를 만들어 내지 않았다는 뜻을 나타낸다는 점이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>모든 소리는 공기·물 등 매질에서 \u003cb class=\"key\">분자의 \u003c/b>\u003cb class=\"key\">교란\u003c/b>으로 시작된다.\u003c/li>\u003cli>Isaac Newton은 빛의 파동이 \u003cb class=\"key\">무색\u003c/b>이며 색 지각은 \u003cb class=\"key\">뇌\u003c/b>에서만 일어난다고 보았다.\u003c/li>\u003cli>소리도 \u003cb class=\"key\">고막\u003c/b> 이후 뇌에서 만들어지는 \u003cb class=\"key\">심리학적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>이다.\u003c/li>\u003cli>숲에서 나무가 쓰러져도 듣는 생명체가 없으면 그것은 \u003cb class=\"key\">소리\u003c/b>가 아니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Sound is not the physical disturbance of molecules but a psychological perception created in the brain, so no creature hearing it means no sound.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">소리의 물리적 시작은 \u003cb class=\"key\">분자의 \u003c/b>\u003cb class=\"key\">교란\u003c/b>이지만, 소리는 \u003cb class=\"key\">뇌\u003c/b>에서 만들어지는 \u003cb class=\"key\">심리학적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>이다. 따라서 숲에서 나무가 쓰러져도 듣는 생명체가 없으면 소리는 발생하지 않는다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 정리하면, 소리는 공기나 물 분자의 교란이라는 물리적 단계와 뇌의 지각이라는 심리적 단계가 합쳐질 때만 성립합니다. 측정기로 잴 수 있는 진동이 있어도 듣는 뇌가 없다면 그건 소리가 아니라는 거죠. 숲의 나무 난제는 이 개념을 가장 잘 보여줍니다. 이제 여러분도 소리와 색처럼 뇌가 만드는 경험에 대해 한 번 더 생각해 보세요. 오늘 강의는 여기까지입니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
