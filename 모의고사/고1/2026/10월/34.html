<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 34번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 34번","audioDir":"34_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">34번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Simplifying Assumptions in Every Scientific Model\u003c/h1>\u003ch2>모든 과학적 모델에 필요한 단순화 가정\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>모든 모델은 새로운 아이디어의 출현이나 기본 입자의 질량·전하처럼 설명하지 않고 받아들이는 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>이 필요하다. 다윈과 월리스의 진화 모델이나 원자 결합 모델처럼 한 \u003cb class=\"key\">분석 \u003c/b>\u003cb class=\"key\">수준\u003c/b>에서 유용한 모델을 만들려면 다른 수준의 완전한 설명이 없어도 된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>All useful models require simplifying assumptions that take some things as given, allowing us to build models at one level of analysis without fully explaining all other levels.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 모의고사 서른네 번째 지문을 함께 분석해 볼게요. 이 글은 모든 모델에는 단순화 가정이 필요하다는 이야기를 하고 있어요. 다윈의 진화론과 물리학의 원자 결합 모델을 예로 들면서 결국 한 분석 수준에서 유용한 모델을 만들 수 있다는 게 핵심이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">과학에서 모델이라는 말은 복잡한 현실을 이해하기 쉽게 단순화한 틀을 뜻해요. 지하철 노선도는 실제 거리나 지형을 무시하고 역 사이의 연결만 보여 주지만 길 찾기에는 아주 유용하죠. 이 글에서 말하는 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b> simplifying assumption은 설명하지 않고 그냥 받아들이는 요소예요. 다윈과 월리스는 변이 생성 variation generation과 유전 inheritance가 분자 수준에서 어떻게 일어나는지 몰랐지만 진화 모델을 발표했어요. 물리학자들도 기본 입자 fundamental particle의 질량 mass와 전하 charge를 측정값으로 받아들여요. 이처럼 과학은 \u003cb class=\"key\">분석 \u003c/b>\u003cb class=\"key\">수준\u003c/b> level of analysis에 맞는 단순화를 통해 발전해 왔어요.\u003c/div>","segs":[{"n":2,"text":"과학에서 모델이라는 말은 복잡한 현실을 이해하기 쉽게 단순화한 틀을 뜻해요. 예를 들어 지하철 노선도는 실제 거리나 지형을 무시하고 역 사이의 연결만 단순하게 보여 주지만 길 찾기에는 아주 유용하죠. 이 글에서 말하는 단순화 가정, 영어로 simplifying assumption은 설명하지 않고 그냥 받아들이는 요소를 뜻해요. 다윈과 월리스는 변이 생성 variation generation과 유전 inheritance가 분자 수준에서 어떻게 일어나는지 몰랐지만 진화 모델을 발표했어요. 물리학자들도 기본 입자 fundamental particle의 질량 mass와 전하 charge를 측정값으로 받아들여요. 이렇게 과학은 분석 수준 level of analysis에 맞는 단순화를 통해 발전해 왔어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>모델에는 주어진 것이 필요하다\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>관심 진화 시스템의 경계를 정할 때 새로운 아이디어가 특정 시기에 출현한다는 사실처럼 모델이 그냥 받아들여야 할 \u003cb class=\"key\">주어진 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 있다고 말한다. 실제로 모든 모델은 이러한 성격의 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>을 세워야만 한다고 강조한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>다윈과 월리스의 진화 모델\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>Wallace와 Darwin이 생물학적 진화 모델을 제시했을 때 변이 생성과 유전의 작동 방식에 대한 지식이 거의 없었다. 그들은 이러한 일들이 어떻게든 일어난다는 것을 \u003cb class=\"key\">주어진 \u003c/b>\u003cb class=\"key\">것\u003c/b>으로 받아들였다는 예시를 제시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>물리학의 기본 입자\u003csmall>예시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>가장 미세한 세부 수준에서도 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>이 필요하다고 말한다. 물리학자들은 기본 입자의 질량과 전하를 주어진 것으로 받아들이고, 원자 결합 모델에서 전자의 질량·전하의 이유를 설명하지 않고 \u003cb class=\"key\">측정값\u003c/b>을 받아들인다고 덧붙인다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>한 수준의 유용한 모델\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>핵심은 모든 다른 수준의 완전한 설명 없이 하나의 \u003cb class=\"key\">분석 \u003c/b>\u003cb class=\"key\">수준\u003c/b>에서 유용한 모델을 구축할 수 있다는 것이다. 설명하지 않고 넘어가는 단순화가 유용한 모델을 가능하게 한다는 결론으로 마무리된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 살펴볼게요. 처음에 모든 모델에는 주어진 것이 필요하다는 주장을 하고, 진화론과 물리학 사례를 거쳐 마지막에 핵심을 정리하는 구조예요.","hl":null},{"n":4,"text":"첫 번째 문장부터 두 번째 문장까지는 도입 부분이에요. 여러분이 휴대 전화 같은 진화 시스템의 경계를 어떻게 정하든, 새로운 아이디어가 특정한 시기에 출현한다는 사실처럼 모델이 그냥 받아들여야 할 주어진 것이 있다고 말해요. 실제로 모든 모델은 이러한 성격의 단순화하는 가정들을 세워야만 하죠.","hl":"f0"},{"n":5,"text":"세 번째 문장과 네 번째 문장에서는 다윈과 월리스의 사례가 나와요. 그들이 생물학적 진화에 대한 언어적 모델을 제시했을 때 변이 생성과 유전이 어떻게 작동하는지 거의 알지 못했어요. 그래서 그들은 이런 일들이 어떻게든 일어났다는 것을 그저 주어진 것으로 받아들였죠.","hl":"f1"},{"n":6,"text":"다섯 번째 문장부터 일곱 번째 문장까지는 물리학의 예를 들어요. 가장 미세한 세부 수준에서도 우리는 단순화하는 가정들이 필요해요. 물리학자들은 기본 입자의 질량과 전하를 주어진 것으로 받아들이고, 원자 결합 모델에서 전자가 왜 특정한 질량과 전하를 갖는지 설명하려 하지 않고 측정된 값들을 받아들이고 넘어가요.","hl":"f2"},{"n":7,"text":"여덟 번째 문장이 결론이에요. 핵심은 우리가 모든 다른 수준에서 일어나고 있는 것에 대한 완전한 설명 없이 하나의 분석 수준에서 유용한 모델을 구축할 수 있다는 거예요. 즉 설명하지 않고 넘어가는 단순화가 오히려 유용한 모델을 가능하게 한다는 뜻이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문단에서 모든 모델에는 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>이 필요하다는 주장을 제시하고, 중간에 다윈·월리스와 물리학의 사례를 근거로 든 뒤 마지막에 The key point is로 결론을 반복한다. 따라서 처음과 끝에 주제가 드러나는 \u003cb class=\"key\">양괄식\u003c/b> 구조이며, 가장 명시적인 주제문은 여덟 번째 문장이다. 이 글은 주장을 뒷받침하는 \u003cb class=\"key\">예시\u003c/b>가 둘 이상 나열되는 전형적인 주장-근거 전개에 해당한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Indeed (2)\u003c/b>\u003cspan>앞 문장 강조·환언\u003c/span>\u003cb>For example (6)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>The key point is (8)\u003c/b>\u003cspan>핵심 주장·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">take as a given\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">simplifying assumptions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">took as a given\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">take as a given\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">accept the measured values\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">without a complete accounting\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거를 제시하는 전개 방식이에요. 처음에 모든 모델에는 단순화 가정이 필요하다는 주장을 펼치고, 다윈과 월리스의 진화 모델, 물리학의 원자 결합 모델을 근거로 들어요. 마지막에 The key point is로 시작하는 문장에서 핵심을 다시 정리하는 양괄식 구조예요. 따라서 주제문은 여덟 번째 문장인 The key point is that we can build useful models at one level of analysis without a complete accounting of what's happening at all other levels로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 확인해 볼게요. 두 번째 문장의 Indeed는 앞 문장을 강조하며 바꿔 말하는 역할을 해요. 여섯 번째 문장의 For example는 물리학 예시를 도입하는 표지예요. 그리고 마지막 문장의 The key point is는 결론을 알리는 신호어이므로 이 부분을 중심으로 글의 핵심을 잡으면 돼요. 또 take as a given이 첫 번째, 네 번째, 여섯 번째 문장에서 반복되고, 마지막에는 without a complete accounting으로 재진술되는 흐름도 함께 봐 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>no matter how\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어떻게 ~하든지\u003c/span>\u003c/div>\u003cdiv>\u003cb>delineate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경계를 정하다, 묘사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>evolutionary system\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진화 시스템\u003c/span>\u003c/div>\u003cdiv>\u003cb>of interest\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관심의 대상이 되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>take as a given\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>당연한 것으로 받아들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>emerge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>출현하다, 나타나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at particular times\u003c/b>\u003cem>부사\u003c/em>\u003cspan>특정한 시기에\u003c/span>\u003c/div>\u003cdiv>\u003cb>indeed\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로, 정말로\u003c/span>\u003c/div>\u003cdiv>\u003cb>simplifying assumptions\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단순화하는 가정들\u003c/span>\u003c/div>\u003cdiv>\u003cb>of this nature\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이러한 성격의\u003c/span>\u003c/div>\u003cdiv>\u003cb>verbal model\u003c/b>\u003cem>명사\u003c/em>\u003cspan>언어적 모델\u003c/span>\u003c/div>\u003cdiv>\u003cb>biological evolution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생물학적 진화\u003c/span>\u003c/div>\u003cdiv>\u003cb>variation generation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변이 생성\u003c/span>\u003c/div>\u003cdiv>\u003cb>inheritance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유전\u003c/span>\u003c/div>\u003cdiv>\u003cb>somehow\u003c/b>\u003cem>부사\u003c/em>\u003cspan>어떻게든\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the finest level of detail\u003c/b>\u003cem>부사\u003c/em>\u003cspan>가장 미세한 세부 수준에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>physicist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물리학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>fundamental particles\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기본 입자\u003c/span>\u003c/div>\u003cdiv>\u003cb>mass\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질량\u003c/span>\u003c/div>\u003cdiv>\u003cb>charge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전하\u003c/span>\u003c/div>\u003cdiv>\u003cb>atomic bonds\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원자 결합\u003c/span>\u003c/div>\u003cdiv>\u003cb>attempt to\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~하려고 시도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>electrons\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전자\u003c/span>\u003c/div>\u003cdiv>\u003cb>measured values\u003c/b>\u003cem>명사\u003c/em>\u003cspan>측정된 값들\u003c/span>\u003c/div>\u003cdiv>\u003cb>move on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>넘어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>key point\u003c/b>\u003cem>명사\u003c/em>\u003cspan>핵심\u003c/span>\u003c/div>\u003cdiv>\u003cb>at one level of analysis\u003c/b>\u003cem>부사\u003c/em>\u003cspan>하나의 분석 수준에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>complete accounting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>완전한 설명\u003c/span>\u003c/div>\u003cdiv>\u003cb>at all other levels\u003c/b>\u003cem>부사\u003c/em>\u003cspan>모든 다른 수준에서\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘를 정리해 볼게요. 먼저 delineate는 경계를 정하다, 묘사하다라는 뜻이고 take as a given은 당연한 것으로 받아들이다라는 숙어예요. 두 번째로 simplifying assumptions는 단순화하는 가정, variation generation은 변이 생성, inheritance는 유전을 뜻해요. 마지막으로 fundamental particles는 기본 입자, measured values는 측정된 값들, complete accounting은 완전한 설명으로 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">assumption\u003c/b>\u003cspan class=\"m\">가정\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">premise\u003c/span>\u003cspan class=\"s\">supposition\u003c/span>\u003cspan class=\"s\">presupposition\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fact\u003c/span>\u003cspan class=\"a\">certainty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">delineate\u003c/b>\u003cspan class=\"m\">경계를 정하다, 묘사하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">define\u003c/span>\u003cspan class=\"s\">describe\u003c/span>\u003cspan class=\"s\">outline\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">confuse\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">emerge\u003c/b>\u003cspan class=\"m\">출현하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appear\u003c/span>\u003cspan class=\"s\">arise\u003c/span>\u003cspan class=\"s\">surface\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disappear\u003c/span>\u003cspan class=\"a\">vanish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fundamental\u003c/b>\u003cspan class=\"m\">근본적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">basic\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">primary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">secondary\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">attempt\u003c/b>\u003cspan class=\"m\">시도하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">try\u003c/span>\u003cspan class=\"s\">endeavor\u003c/span>\u003cspan class=\"s\">seek\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abandon\u003c/span>\u003cspan class=\"a\">give up\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accept\u003c/b>\u003cspan class=\"m\">받아들이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adopt\u003c/span>\u003cspan class=\"s\">acknowledge\u003c/span>\u003cspan class=\"s\">embrace\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">complete\u003c/b>\u003cspan class=\"m\">완전한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">total\u003c/span>\u003cspan class=\"s\">entire\u003c/span>\u003cspan class=\"s\">full\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partial\u003c/span>\u003cspan class=\"a\">incomplete\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리할게요. assumption은 가정이라는 뜻으로 premise, supposition, presupposition과 바꿔 쓸 수 있고 반의어는 fact나 certainty예요. emerge는 출현하다라는 뜻으로 appear, arise, surface와 유사하고 반의어는 disappear, vanish입니다. fundamental은 근본적인이라는 뜻으로 basic, essential, primary와 유사하고 반의어는 secondary, minor예요. accept는 받아들이다라는 뜻으로 adopt, acknowledge, embrace와 유사하고 reject, refuse와 반대예요. complete은 완전한이라는 뜻으로 total, entire, full과 유사하고 partial, incomplete와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 관심을 두는 진화 시스템의 경계를 어떻게 정할지 선택하든 간에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">No \u003c/span>\u003cspan class=\"tgt\">matter \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">choose \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">delineate \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">evolutionary \u003c/span>\u003cspan class=\"tgt\">system \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">interest\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">—이를테면 휴대 전화와 같은—어떤 것들이 있을 것이다\u003c/span>\u003cspan class=\"en\">—let's say it's cell phones—there will be some things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 모델이 그저 주어진 것으로 받아들여야만 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">model \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">given\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예컨대 그 사실 같은\u003c/span>\u003cspan class=\"en\">such as \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fact \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 아이디어가 특정한 시기에 출현한다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">ideas \u003c/span>\u003cspan class=\"tgt\">emerge \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">particular \u003c/span>\u003cspan class=\"tgt\">times\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분이 관심을 두는 진화 시스템(예를 들어 휴대 전화와 같은)의 경계를 어떻게 정할지 선택하든 간에 이를테면 새로운 아이디어가 특정한 시기에 출현한다는 사실 같은, 여러분의 모델이 그저 주어진 것으로 받아들여야만 하는 어떤 것들이 있을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모델을 만들 때는 경계 설정과 무관하게 설명하지 않고 당연한 전제로 받아들여야 할 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>이 반드시 필요하다는 것을 말한다. 휴대 전화라는 예를 통해 새로운 아이디어가 특정 시기에 나타난다는 사실은 모델이 그냥 받아들이는 입력값임을 보여준다. 글 첫 문장으로서 뒤에서 모든 모델이 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>을 한다는 핵심 주장으로 이어진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">No matter how 구문\u003c/span> : No matter how + 주어 + 동사 ~, 주절 : \"어떻게 ~하든 간에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that\u003c/span> : 선행사(some things) + 목적격 관계대명사 that + 주어 + 동사 : \"여러분의 모델이 그저 주어진 것으로 받아들여야만 하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격 명사절을 이끄는 that\u003c/span> : the fact + [that + 완전한 절(S+V)] : \"새로운 아이디어가 특정한 시기에 출현한다는 사실\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"No matter how you choose to delineate your evolutionary system of interest, 여러분이 관심을 두는 진화 시스템의 경계를 어떻게 정할지 선택하든 간에. —let's say it's cell phones—there will be some things, —이를테면 휴대 전화와 같은—어떤 것들이 있을 것이다. that your model just needs to take as a given, 여러분의 모델이 그저 주어진 것으로 받아들여야만 하는. such as the fact, 예컨대 그 사실 같은. that new ideas emerge at particular times, 새로운 아이디어가 특정한 시기에 출현한다는. 이 문장 전체를 해석하면, 여러분이 관심을 두는 진화 시스템(예를 들어 휴대 전화와 같은)의 경계를 어떻게 정할지 선택하든 간에 이를테면 새로운 아이디어가 특정한 시기에 출현한다는 사실 같은, 여러분의 모델이 그저 주어진 것으로 받아들여야만 하는 어떤 것들이 있을 것이다.","hl":"m"},{"n":13,"text":"이 문장의 핵심은 어떤 모델이든 설명하지 않고 그냥 받아들여야 하는 단순화 가정이 필요하다는 거예요. 휴대 전화를 예로 들었는데, 새로운 아이디어가 특정 시기에 나온다는 사실은 모델이 당연한 전제로 받아들이는 입력값에 해당하죠. 첫 문장이라서 뒤에 나올 모든 모델의 단순화 가정 이야기로 자연스럽게 연결됩니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 문장 맨 앞에 나온 No matter how 구문입니다. No matter how 뒤에는 주어와 동사가 그대로 오는 어순이고, 어떻게 선택하든 간에라는 양보의 의미를 나타내요. 두 번째는 some things를 수식하는 that절인데, 이 that은 뒤 절에서 take의 목적어 역할을 하는 목적격 관계대명사입니다. 세 번째는 the fact that 구문으로, that절이 앞의 fact와 동격을 이루며 새로운 아이디어가 특정 시기에 출현한다는 내용을 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로\u003c/span>\u003cspan class=\"en\">Indeed,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 모델은 단순화하는 가정들을 세워야만 한다\u003c/span>\u003cspan class=\"en\">all models \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">simplifying \u003c/span>\u003cspan class=\"tgt\">assumptions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 성격의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">nature\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실제로, ‘모든’ 모델은 이러한 성격의 단순화하는 가정들을 세워야만 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 구체적 예를 일반화하며, 모든 모델은 예외 없이 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>을 세운다는 주장을 강조한다. Indeed는 앞 내용을 동의·강화하는 연결어로, 문단의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">논지\u003c/b>를 분명히 제시한다. 이 문장은 뒤에 제시될 생물학과 물리학 사례의 도입 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 must\u003c/span> : must + 동사원형(make) : \"반드시 ~해야만 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 역할을 하는 전치사구\u003c/span> : simplifying assumptions + of this nature : \"이러한 성격의\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Indeed, 실제로. all models must make simplifying assumptions, 모든 모델은 단순화하는 가정들을 세워야만 한다. of this nature, 이러한 성격의. 이 문장 전체를 해석하면, 실제로, ‘모든’ 모델은 이러한 성격의 단순화하는 가정들을 세워야만 한다.","hl":"m"},{"n":16,"text":"이 문장은 앞 문장의 예를 일반화해서 모든 모델은 예외 없이 단순화 가정을 세워야 한다고 핵심 주장을 강조해요. Indeed가 앞 내용을 동의하면서 더 넓은 주장으로 이끌고 있죠. 따라서 이 문장은 이 글 전체의 핵심 논지라고 볼 수 있습니다.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 must make에서 조동사 must입니다. must는 강한 의무를 나타내고 뒤에는 반드시 동사원형 make가 와서 모든 모델이 단순화 가정을 세워야 한다는 필수성을 표현해요. 두 번째는 of this nature라는 전치사구입니다. 이 전치사구가 앞에 있는 simplifying assumptions를 뒤에서 수식하며 이러한 성격이라는 뜻을 덧붙여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Wallace와 Darwin이 자신들의 언어적 모델을 제시했을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">Wallace \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">Darwin \u003c/span>\u003cspan class=\"tgt\">presented \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">verbal \u003c/span>\u003cspan class=\"tgt\">model\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생물학적 진화에 대한\u003c/span>\u003cspan class=\"en\">of biological evolution,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지식이 거의 없었다\u003c/span>\u003cspan class=\"en\">there was little knowledge\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변이 생성과 유전이 어떻게 작동했는지에 관해서는\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">variation \u003c/span>\u003cspan class=\"tgt\">generation \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">inheritance \u003c/span>\u003cspan class=\"tgt\">worked\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Wallace와 Darwin이 생물학적 진화에 대한 자신들의 언어적 모델을 제시했을 때, 변이 생성과 유전이 어떻게 작동하는지에 관해서는 거의 알지 못했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Wallace와 Darwin의 초기 진화 모델을 예로 들어, 모델을 만들 때 세부 기제를 몰라도 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>을 사용할 수 있었다는 점을 보여준다. 변이 생성과 유전의 작동 원리는 당시 지식 부족에도 불구하고 그저 일어난다는 것을 받아들였다는 의미다. 이는 모든 모델이 단순화 가정을 필요로 한다는 앞 문장의 근거가 되는 역사적 사례이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절을 이끄는 접속사 When\u003c/span> : When + 주어(Wallace and Darwin) + 동사(presented) ~, 주절 : \"Wallace와 Darwin이 ~을 제시했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 how절\u003c/span> : 전치사(of) + [how + 주어 + 동사] : \"변이 생성과 유전이 어떻게 작동했는지\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"When Wallace and Darwin presented their verbal model, Wallace와 Darwin이 자신들의 언어적 모델을 제시했을 때. of biological evolution, 생물학적 진화에 대한. there was little knowledge, 지식이 거의 없었다. of how variation generation and inheritance worked, 변이 생성과 유전이 어떻게 작동했는지에 관해서는. 이 문장 전체를 해석하면, Wallace와 Darwin이 생물학적 진화에 대한 자신들의 언어적 모델을 제시했을 때, 변이 생성과 유전이 어떻게 작동하는지에 관해서는 거의 알지 못했다.","hl":"m"},{"n":19,"text":"이 문장은 구체적인 역사적 사례예요. Wallace와 Darwin이 진화 모델을 만들었을 때 변이 생성과 유전의 작동 원리를 거의 몰랐지만, 그런 것들이 일어난다는 걸 그냥 받아들였다는 뜻이에요. 즉 세부 기제를 모르더라도 단순화 가정을 통해 유용한 모델을 만들 수 있다는 근거가 됩니다.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 문장 앞의 When 절입니다. When은 시간 부사절 접속사로, Wallace와 Darwin이 모델을 제시했을 때라는 시점을 나타내고 뒤에 완전한 절을 이끌어요. 두 번째는 how variation generation and inheritance worked 부분인데, 이 how절은 전치사 of의 목적어 자리에 쓰인 간접의문문입니다. 간접의문문은 의문사 뒤에 주어와 동사가 평서문 어순으로 오는 것이 특징이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그저 주어진 것으로 받아들였다\u003c/span>\u003cspan class=\"en\">They just \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">given\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 것들이 어떻게든 일어났다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003cspan class=\"tgt\">happened \u003c/span>\u003cspan class=\"tgt\">somehow\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 이러한 것들이 어떻게든 일어났다는 것을 그저 주어진 것으로 받아들였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 월리스와 다윈이 변이 생성과 유전의 구체적인 원리를 몰랐지만, 그런 과정이 어떻게든 일어난다는 것을 모형의 \u003cb class=\"key\">전제\u003c/b>로 삼았다는 뜻입니다. 어떤 수준의 설명에서도 설명하지 않고 그냥 받아들이는 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>이 필요함을 보여 줍니다. 글 흐름에서는 앞 문장의 배경지식 부족을 인정하고도 모형을 세울 수 있었던 이유를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">take as a given (관용 표현)\u003c/span> : take + as + a given : \"주어진 것으로 받아들였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절\u003c/span> : that + [완전한 절 these things happened somehow] : \"이러한 것들이 어떻게든 일어났다는 것\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They just took as a given, 그들은 그저 주어진 것으로 받아들였다. that these things happened somehow, 이러한 것들이 어떻게든 일어났다는 것을. 이 문장 전체를 해석하면, 그들은 이러한 것들이 어떻게든 일어났다는 것을 그저 주어진 것으로 받아들였다.","hl":"m"},{"n":22,"text":"이 문장은 월리스와 다윈이 변이 생성과 유전이 정확히 어떤 원리로 일어나는지 몰랐지만, 그 과정이 어떻게든 일어난다는 사실을 모형의 전제로 삼았다는 뜻이에요. 즉 설명하지 않고 그냥 받아들이는 거죠. 글 전체에서는 지식이 부족해도 유용한 모형을 만들 수 있다는 흐름을 이어 주는 역할을 해요.","hl":"mn"},{"n":23,"text":"여기서 핵심은 took as a given이라는 표현이에요. take as a given은 어떤 것을 당연한 전제로 받아들인다는 뜻인데, 뒤에 that절이 와서 이러한 것들이 어떻게든 일어났다는 것 전체를 목적어로 받고 있어요. that절은 명사절로 목적어 자리에 쓰였고, 이처럼 that이 완전한 절을 이끌면 문장에서 명사처럼 기능할 수 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 미세한 세부 수준에서조차\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Even \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">finest \u003c/span>\u003cspan class=\"tgt\">level \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">detail\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 필요하다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순화하는 가정들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">simplifying \u003c/span>\u003cspan class=\"tgt\">assumptions\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가장 미세한 세부 수준에서조차, 우리는 단순화하는 가정들이 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 생물학 모형에만 국한된 이야기가 아니라, 아무리 세밀한 분석을 해도 어떤 요소는 설명하지 않고 그대로 두어야 한다는 점을 일반화합니다. 가장 미세한 수준에서조차 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>이 필요하다는 말은 모든 모형에 적용되는 원리입니다. 따라서 이 문장은 뒤에 나올 물리학 예시로 자연스럽게 연결해 주는 \u003cb class=\"key\">일반 \u003c/b>\u003cb class=\"key\">진술\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보·강조의 부사구 (even + 최상급)\u003c/span> : Even + at + [the finest level of detail] : \"가장 미세한 세부 수준에서조차\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사 need + 현재분사 수식\u003c/span> : need + [simplifying assumptions (명사구)] : \"단순화하는 가정들이 필요하다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Even at the finest level of detail, 가장 미세한 세부 수준에서조차. we need, 우리는 필요하다. simplifying assumptions, 단순화하는 가정들이. 이 문장 전체를 해석하면, 가장 미세한 세부 수준에서조차, 우리는 단순화하는 가정들이 필요하다.","hl":"m"},{"n":25,"text":"이 문장은 생물학 모형에만 해당하는 말이 아니라 어떤 모형이든 가장 정밀한 수준에서도 모든 것을 설명할 수는 없다는 일반 원리를 말해요. 아무리 자세히 들여다봐도 단순화하는 가정이 필요하다는 거죠. 그래서 이 문장은 뒤에 나올 물리학 예시로 넘어가는 징검다리 역할을 합니다.","hl":"mn"},{"n":26,"text":"Even at the finest level of detail에서 even은 부사구 전체를 강조해서 조차라는 뜻을 더해요. the finest는 최상급이니까 가장 미세한이라는 의미가 되죠. need는 타동사로 쓰여서 simplifying assumptions라는 명사구를 목적어로 취하는데, simplifying은 현재분사로 assumptions를 수식해서 단순화하는이라는 능동 의미를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 물리학자들은\u003c/span>\u003cspan class=\"en\">Physicists, for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주어진 것으로 받아들여야만 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">given\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">질량과 전하를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mass \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">charge \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기본 입자의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">fundamental \u003c/span>\u003cspan class=\"tgt\">particles\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 물리학자들은 기본 입자의 질량과 전하를 주어진 것으로 받아들여야만 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 일반 원리를 물리학 사례로 뒷받침합니다. 물리학자들도 기본 입자의 질량과 전하가 왜 그런 값인지 설명하지 않고, 측정된 값을 \u003cb class=\"key\">주어진 \u003c/b>\u003cb class=\"key\">것으로 \u003c/b>\u003cb class=\"key\">받아들인다\u003c/b>는 것입니다. 이는 원자 결합 모형처럼 유용한 모형이 하위 수준의 설명 없이도 성립할 수 있음을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 must + 관용 표현\u003c/span> : must + [take as a given] : \"주어진 것으로 받아들여야만 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조와 전치사구 후치 수식\u003c/span> : [the mass and charge] + of + [fundamental particles] : \"기본 입자의 질량과 전하\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Physicists, for example, 예를 들어, 물리학자들은. must take as a given, 주어진 것으로 받아들여야만 한다. the mass and charge, 질량과 전하를. of fundamental particles, 기본 입자의. 이 문장 전체를 해석하면, 예를 들어, 물리학자들은 기본 입자의 질량과 전하를 주어진 것으로 받아들여야만 한다.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 말한 일반 원리를 물리학의 예로 보여 줘요. 물리학자들도 전자의 질량이나 전하 같은 기본 입자의 물리량이 왜 그 값인지 설명하지 않고, 측정된 값을 그냥 받아들인다는 거죠. 이렇게 구체적인 예를 들어 독자가 단순화 가정의 필요성을 더 잘 이해하게 해 줘요.","hl":"mn"},{"n":29,"text":"must는 조동사라서 뒤에 동사원형 take가 와요. take as a given은 주어진 것으로 받아들이다라는 뜻의 관용 표현이에요. the mass and charge of fundamental particles 전체가 take의 목적어인데, and로 mass와 charge가 병렬 연결되고 of fundamental particles가 앞의 명사구를 뒤에서 수식해요. 목적어가 길기 때문에 as a given이 목적어 앞에 온 어순이라는 점도 눈여겨보면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원자 결합 모델에서,\u003c/span>\u003cspan class=\"en\">In a model of atomic bonds,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물리학자들은 설명하려 시도하지 않는다\u003c/span>\u003cspan class=\"en\">physicists \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">attempt \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">explain\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 전자가 그것의 특정한 질량과 전하를 갖는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">electrons \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">particular \u003c/span>\u003cspan class=\"tgt\">mass \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">charge\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그저 측정된 값들을 받아들인다\u003c/span>\u003cspan class=\"en\">they just \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">accept \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">measured \u003c/span>\u003cspan class=\"tgt\">values \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 넘어간다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">move \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">원자 결합 모델에서, 물리학자들은 ‘왜’ 전자가 그것의 특정한 질량과 전하를 갖는지 설명하려 시도하지 않고, 그들은 그저 측정된 값들을 받아들이고 넘어간다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 말한 가장 세밀한 수준에서도 단순화 가정이 필요하다는 내용을 뒷받침하는 예시입니다. 물리학자들은 원자 결합 모델에서 전자의 질량과 전하를 왜 그런 값으로 갖는지 설명하려 하지 않고 그저 \u003cb class=\"key\">측정된 \u003c/b>\u003cb class=\"key\">값\u003c/b>을 받아들입니다. 이는 유용한 모델을 만들 때 반드시 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>을 출발점으로 삼는다는 것을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법\u003c/span> : attempt [동사] + to explain [to부정사구/목적어] : \"설명하려고 시도하지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : explain + [why + 주어 + have + 목적어] : \"왜 전자가 그것의 특정한 질량과 전하를 갖는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬구조\u003c/span> : [accept + 목적어] and [move on] : \"측정된 값들을 받아들이고 넘어간다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In a model of atomic bonds, 원자 결합 모델에서. physicists don't attempt to explain, 물리학자들은 설명하려 시도하지 않는다. why electrons have their particular mass and charge, 왜 전자가 그것의 특정한 질량과 전하를 갖는지. they just accept the measured values, 그들은 그저 측정된 값들을 받아들인다. and move on, 그리고 넘어간다.. 이 문장 전체를 해석하면, 원자 결합 모델에서, 물리학자들은 ‘왜’ 전자가 그것의 특정한 질량과 전하를 갖는지 설명하려 시도하지 않고, 그들은 그저 측정된 값들을 받아들이고 넘어간다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 가장 세밀한 수준에서도 단순화 가정이 필요하다고 한 것을 보여주는 예시예요. 물리학자들은 원자 결합 모델에서 전자의 질량과 전하를 왜 그렇게 가지는지 설명하지 않고 그저 측정된 값을 받아들입니다. 즉 유용한 모델을 위해서는 단순화 가정을 출발점으로 삼는다는 뜻이에요.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 don't attempt to explain인데요, attempt는 to부정사를 목적어로 취하는 동사라서 to explain이 시도하는 내용을 설명해 주는 명사적 용법으로 쓰였어요. 두 번째는 why electrons have their particular mass and charge입니다. why가 이끄는 절이 explain의 목적어로 쓰인 간접의문문이고, 의문사 뒤에 주어와 동사가 오는 평서문 어순을 따른다는 점이 중요해요. 세 번째는 accept the measured values and move on인데요, and가 두 동사구 accept the measured values와 move on을 병렬로 연결해서 측정값을 받아들이고 넘어간다는 두 동작을 같은 자격으로 이어주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">핵심은\u003c/span>\u003cspan class=\"en\">The key point is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 유용한 모델을 구축할 수 있다는 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">build \u003c/span>\u003cspan class=\"tgt\">useful \u003c/span>\u003cspan class=\"tgt\">models\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 분석 수준에서\u003c/span>\u003cspan class=\"en\">at one level of analysis\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전한 설명 없이\u003c/span>\u003cspan class=\"en\">without a complete accounting\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일어나고 있는 것에 대한\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what's \u003c/span>\u003cspan class=\"tgt\">happening\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 다른 수준에서.\u003c/span>\u003cspan class=\"en\">at all other levels.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">핵심은 우리가 모든 다른 수준에서 일어나고 있는 것에 대한 완전한 설명 없이 하나의 분석 수준에서 유용한 모델을 구축할 수 있다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지문 전체 논의를 마무리하는 핵심 문장으로, 어떤 분석 수준에서 모델을 만들 때 다른 모든 수준을 완전히 설명하지 않아도 된다는 주장을 정리합니다. 즉 유용한 모델은 \u003cb class=\"key\">완전한 \u003c/b>\u003cb class=\"key\">설명\u003c/b> 없이도 한 \u003cb class=\"key\">분석 \u003c/b>\u003cb class=\"key\">수준\u003c/b>에서 충분히 세워질 수 있다는 뜻입니다. 세부 수준을 모두 알지 못해도 모델의 목적에 맞는 설명은 가능하다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that절 (주격 보어)\u003c/span> : The key point is + [that + 주어 + can build + 목적어] : \"우리가 유용한 모델을 구축할 수 있다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사절 (전치사 of의 목적어)\u003c/span> : of + [what + is happening] : \"무슨 일이 일어나고 있는지\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The key point is, 핵심은. that we can build useful models, 우리가 유용한 모델을 구축할 수 있다는 것이다. at one level of analysis, 하나의 분석 수준에서. without a complete accounting, 완전한 설명 없이. of what's happening, 일어나고 있는 것에 대한. at all other levels, 모든 다른 수준에서.. 이 문장 전체를 해석하면, 핵심은 우리가 모든 다른 수준에서 일어나고 있는 것에 대한 완전한 설명 없이 하나의 분석 수준에서 유용한 모델을 구축할 수 있다는 것이다.","hl":"m"},{"n":34,"text":"이 문장은 글 전체의 핵심을 정리하는 문장이에요. 어떤 분석 수준에서 모델을 만들 때 그보다 아래나 위의 모든 수준을 완벽하게 설명하지 않아도 모델은 충분히 유용할 수 있다는 겁니다. 그래서 앞에서 살펴본 진화 모델이나 원자 결합 모델처럼 모든 모델에는 단순화 가정이 필요하다는 결론으로 이어집니다.","hl":"mn"},{"n":35,"text":"첫 번째 포인트는 The key point is that에서 that이 이끄는 절이 is 뒤에서 주격 보어 역할을 한다는 거예요. that we can build useful models는 핵심이 무엇인지 설명해 주는 명사절입니다. 두 번째는 what's happening인데요, what이 이끄는 절이 전치사 of의 목적어로 쓰인 명사절입니다. 여기서 what's는 what is의 축약형이고 happening은 현재진행형 동사예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>모든 모델은 새로운 아이디어의 출현처럼 설명하지 않고 넘어가는 \u003cb class=\"key\">주어진 \u003c/b>\u003cb class=\"key\">것\u003c/b>이 필요하다.\u003c/li>\u003cli>이는 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>으로, Wallace와 Darwin의 진화 모델에서 변이 생성과 유전을 그대로 받아들인 사례에서 드러난다.\u003c/li>\u003cli>물리학자들도 원자 결합 모델에서 기본 입자의 질량과 전하를 \u003cb class=\"key\">측정값\u003c/b>으로 받아들이고 넘어간다.\u003c/li>\u003cli>핵심은 다른 수준의 완전한 설명 없이 하나의 \u003cb class=\"key\">분석 \u003c/b>\u003cb class=\"key\">수준\u003c/b>에서 유용한 모델을 만들 수 있다는 것이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>All useful models require simplifying assumptions that take some things as given, allowing us to build models at one level of analysis without fully explaining all other levels.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">모든 모델은 새로운 아이디어의 출현이나 기본 입자의 질량·전하처럼 설명하지 않고 받아들이는 \u003cb class=\"key\">단순화 \u003c/b>\u003cb class=\"key\">가정\u003c/b>이 필요하다. 다윈과 월리스의 진화 모델이나 원자 결합 모델처럼 한 \u003cb class=\"key\">분석 \u003c/b>\u003cb class=\"key\">수준\u003c/b>에서 유용한 모델을 만들려면 다른 수준의 완전한 설명이 없어도 된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"정리하면 이 글은 모든 모델에는 단순화 가정이 필요하고, 그것이 오히려 유용한 모델을 가능하게 한다는 이야기예요. 다윈과 월리스의 진화론과 물리학의 원자 결합 모델 모두 설명하지 않고 받아들이는 요소가 있었죠. 시험에서는 어떤 모델이든 완전한 설명을 요구하지 않는다는 관점을 파악하는 게 중요해요. 오늘 강의는 여기까지예요. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
