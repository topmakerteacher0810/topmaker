<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 20번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 20번","audioDir":"20_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">20번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>Layering Global Citizenship onto Other Identities\u003c/h1>\u003ch2>다른 정체성 위에 세계 시민 정체성 쌓기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>세계 시민 정체성은 기존 정체성을 \u003cb class=\"key\">대체\u003c/b>하는 것이 아니라 그 위에 \u003cb class=\"key\">덧쌓는\u003c/b> 것이며, 전 세계적 \u003cb class=\"key\">연결\u003c/b>과 \u003cb class=\"key\">공통 \u003c/b>\u003cb class=\"key\">과제\u003c/b>를 고려할 때 필요하고 가능하다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>We need to layer global citizenship onto our existing identities, not replace them, because we have obligations to our families, communities, and people around the world.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 다룰 지문은 세계 시민이라는 정체성을 어떻게 받아들여야 하는지에 대한 이야기입니다. 글의 핵심은 세계 시민 정체성이 기존의 가족이나 국가 같은 정체성을 없애는 것이 아니라 그 위에 하나의 층을 더하는 것이라는 점이에요. 먼저 요약해 드리면, 우리는 이제 전 세계 사람들과 연결되어 있고 공통 과제를 함께 겪고 있기 때문에 세계 시민 정체성이 필요하고 가능하다는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">여기서 말하는 global citizenship(세계 시민 정체성)은 한 국가의 국적만으로 자신을 규정하지 않고 인류 공동체의 일원으로서 책임을 지는 태도를 뜻합니다. nation-state(국민 국가)는 근대 이후에 등장한 개념으로, 그 이전 대부분의 역사에서는 국가보다 가족, 부족, 종교 공동체가 정체성의 중심이었습니다. 지금은 교통과 통신의 발달로 전 세계 사람들 사이의 상호 의존성이 커졌고, 기후 변화나 감염병 같은 문제는 한 국가만의 힘으로 해결하기 어렵습니다. 그래서 기존의 \u003cb class=\"key\">정체성\u003c/b>을 버리지 않고 그 위에 세계 시민이라는 층을 하나 더 얹는 것이 필요합니다. 이는 양파 껍질처럼 \u003cb class=\"key\">정체성\u003c/b>이 여러 겹으로 쌓여 있다고 보면 이해하기 쉽습니다. 우리가 속한 가족, 지역 사회, 국가, 세계라는 여러 층위는 서로 충돌하기보다는 공존할 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"여기서 말하는 global citizenship은 한 국가의 국민이라는 정체성만 고집하지 않고 인류 공동체의 일원으로서 책임을 지는 태도를 뜻합니다. nation-state라는 개념은 사실 근대 이후에 생긴 것이에요. 인류 역사의 훨씬 오랜 기간 동안에는 가족이나 부족, 종교 공동체가 사람들의 정체성 중심에 있었죠. 그런데 지금은 교통과 통신이 발달해서 전 세계 사람들 사이의 상호 의존성이 커졌고, 기후 변화나 감염병 같은 문제는 한 국가만으로 해결하기 어렵습니다. 그래서 기존 정체성을 버리는 대신 그 위에 세계 시민이라는 층을 하나 더 얹는 발상이 필요해요. 양파 껍질처럼 정체성은 원래 여러 겹으로 쌓여 있다고 이해하면 쉬워요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입: 세계 시민 가능성\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>우리는 아직 스스로를 세계 시민이라 생각하지 않을 수 있지만, 그렇게 생각하는 것이 \u003cb class=\"key\">필요\u003c/b>하고 \u003cb class=\"key\">가능\u003c/b>하다고 말하며 글을 시작합니다. 이 문장은 뒤에 나올 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">시민 \u003c/b>\u003cb class=\"key\">정체성\u003c/b> 논의의 길을 엽니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>통념: 회의와 역사적 배경\u003csmall>통념 · 문장 2–4\u003c/small>\u003c/h4>\u003cp>어떤 사람들은 세계 시민이라는 개념에 \u003cb class=\"key\">회의적\u003c/b>이지만, 인류 역사 대부분의 기간 동안 사람들은 자신을 \u003cb class=\"key\">국민 \u003c/b>\u003cb class=\"key\">국가\u003c/b>의 시민으로 생각하지 않았습니다. 사실 인류 역사 대부분의 기간에는 \u003cb class=\"key\">국민 \u003c/b>\u003cb class=\"key\">국가\u003c/b> 자체가 존재하지 않았습니다. 지난 몇 세기 동안 \u003cb class=\"key\">국민 \u003c/b>\u003cb class=\"key\">국가\u003c/b>가 부상하면서 사람들은 가족, 민족 집단, 종교 같은 기존 \u003cb class=\"key\">정체성\u003c/b>에 \u003cb class=\"key\">국가 \u003c/b>\u003cb class=\"key\">시민 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 덧붙이게 되었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>주장: 세계 시민 정체성의 필요\u003csmall>주장 · 문장 5\u003c/small>\u003c/h4>\u003cp>전 세계 사람들 간의 \u003cb class=\"key\">연결\u003c/b>과 우리가 함께 직면한 \u003cb class=\"key\">공통 \u003c/b>\u003cb class=\"key\">과제\u003c/b>를 고려할 때, 우리는 기존 \u003cb class=\"key\">정체성\u003c/b> 위에 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">시민 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 덧쌓아야 합니다. 국가 시민 정체성이 가족·민족·종교 정체성 위에 더해졌듯, 이제는 세계 시민이라는 층이 필요한 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>부연: 대체가 아니라 의무\u003csmall>근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>이것은 세계 시민 정체성이 기존 \u003cb class=\"key\">정체성\u003c/b>들을 \u003cb class=\"key\">대체\u003c/b>한다는 뜻이 아닙니다. 우리의 정체성에 대한 단 하나의 이야기만 있는 것은 아닙니다. 오히려 우리는 가족, 공동체, 전 세계 사람들에 대한 \u003cb class=\"key\">의무\u003c/b>를 모두 지니고 있기 때문에 여러 \u003cb class=\"key\">정체성\u003c/b>이 함께 공존합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 세계 시민 정체성이라는 개념을 소개하고, 회의적인 시선을 역사로 반박한 뒤, 기존 정체성 위에 세계 시민 정체성을 덧쌓아야 한다는 주장을 펼칩니다.","hl":null},{"n":4,"text":"첫 번째 문장에서는 우리가 아직 자신을 세계 시민이라고 생각하지 않을 수 있지만 그렇게 생각하는 것이 필요하고 가능하다고 말해요. 이 부분은 뒤에 나올 세계 시민 정체성 논의의 출발점을 열어 주는 도입입니다. 여기서 necessary와 possible은 세계 시민이 되기 위한 두 가지 조건을 동시에 제시한 거예요.","hl":"f0"},{"n":5,"text":"두 번째부터 네 번째 문장은 세계 시민에 대한 회의적 시선을 다룹니다. 어떤 사람들은 세계 시민이라는 개념에 skeptical, 즉 회의적이지만 인류 역사 대부분의 기간 동안 사람들은 자신을 국민 국가의 시민으로 생각하지 않았어요. After all로 시작하는 문장이 그 이유를 보강하는데, 국민 국가 자체가 역사의 대부분 기간에 존재하지 않았다는 거죠. 이후 지난 몇 세기에 걸쳐 국민 국가가 부상하면서 사람들은 가족, 민족 집단, 종교 같은 기존 정체성에 국가 시민 정체성을 덧붙이게 되었다고 설명합니다.","hl":"f1"},{"n":6,"text":"다섯 번째 문장이 이 글의 핵심 주장입니다. 전 세계 사람들 간의 연결과 우리가 함께 직면한 공통 과제를 고려할 때, 우리는 기존의 다른 정체성 위에 세계 시민 정체성을 layer, 즉 쌓아야 한다고 말해요. 국가 시민 정체성이 가족이나 민족, 종교 위에 더해졌듯이 이제는 세계 시민이라는 층을 추가하자는 것이죠.","hl":"f2"},{"n":7,"text":"여섯 번째부터 여덟 번째 문장은 주장의 의미를 더 정확하게 짚어 줍니다. 세계 시민 정체성이 기존 정체성을 replace, 즉 대체한다는 뜻은 아니에요. 우리의 정체성에 대한 단 하나의 이야기만 있는 것도 아니고요. 대신에 우리는 가족, 공동체, 그리고 전 세계 사람들에 대한 의무를 모두 지니고 있기 때문에 여러 정체성이 함께 공존한다는 설명입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 1~4문장에서 세계 시민에 대한 \u003cb class=\"key\">회의적 \u003c/b>\u003cb class=\"key\">시각\u003c/b>과 \u003cb class=\"key\">국민 \u003c/b>\u003cb class=\"key\">국가\u003c/b>의 역사적 배경을 제시한 뒤, 5번 문장에서 '기존 \u003cb class=\"key\">정체성\u003c/b> 위에 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">시민 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 덧쌓아야 한다'는 핵심 주장을 제시합니다. 이어 6~8문장은 이것이 기존 정체성을 \u003cb class=\"key\">대체\u003c/b>하는 것이 아니라 여러 층위의 \u003cb class=\"key\">의무\u003c/b> 때문임을 근거로 뒷받침합니다. 따라서 핵심 주장이 중간에 위치한 \u003cb class=\"key\">중괄식\u003c/b> 구조이며, 주장과 근거를 앞뒤로 배치한 \u003cb class=\"key\">주장-근거\u003c/b> 전개 방식입니다. 5번 문장의 Given 이하가 주장의 이유를 제시하는 역할을 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (1)\u003c/b>\u003cspan>기존 생각과 대비\u003c/span>\u003cb>but (2)\u003c/b>\u003cspan>회의적 시각과 역사적 사실 대비\u003c/span>\u003cb>After all (3)\u003c/b>\u003cspan>이유 보강\u003c/span>\u003cb>Given (5)\u003c/b>\u003cspan>주장의 전제·이유 제시\u003c/span>\u003cb>This doesn't mean (6)\u003c/b>\u003cspan>오해 차단·부연\u003c/span>\u003cb>Instead (8)\u003c/b>\u003cspan>대안적 이유 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">global citizens\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">global citizenship\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">citizens of nationstates\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">nationstates\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">state citizenship\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">other identities\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">family, people group, or religion\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">global citizenship\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">other identities\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">our identities\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">obligations\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>세계 시민 정체성이 기존 정체성을 대체(replaces)\u003c/th>\u003cth>기존 정체성 위에 세계 시민 정체성을 덧쌓음(layer onto)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>다른 정체성을 밀어냄\u003c/td>\u003ctd>가족·공동체·세계에 대한 의무를 모두 포함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>단일한 정체성 이야기\u003c/td>\u003ctd>여러 정체성의 공존\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장을 중간에 두고 앞에서 배경을, 뒤에서 근거를 제시하는 중괄식 구조예요. 전개 방식은 주장과 근거 방식으로 볼 수 있는데, 다섯 번째 문장에서 기존 정체성 위에 세계 시민 정체성을 쌓아야 한다는 주장이 나오고, 앞부분은 그 주장을 이해하기 위한 역사적 배경을 제공합니다. 뒷부분은 이 주장이 기존 정체성을 대체하는 것이 아니라 여러 의무 때문임을 설명하면서 주장을 뒷받침해요. 이렇게 핵심 문장이 중간에 있기 때문에 처음부터 끝까지 순서대로 읽기보다는 중심 문장을 먼저 잡고 앞뒤 관계를 살피는 것이 좋습니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 첫 번째와 두 번째 문장의 but은 기존 생각과 대비되는 지점을 알려 줍니다. 두 번째 문장은 회의적 시선과 역사적 사실을 대비하고, After all은 그 이유를 보강하는 신호로 쓰였어요. 다섯 번째 문장의 Given은 주장의 전제와 이유를 제시하는 역할을 하고, 여섯 번째 문장의 This doesn't mean은 독자의 오해를 차단하는 표현입니다. 마지막 문장의 Instead는 대체가 아니라 의무라는 대안적 이유를 이끌어 내죠. 또 global citizens, global citizenship, state citizenship, identity, obligations 같은 표현들이 서로 연결되면서 정체성의 층위를 반복해서 강조합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>global citizens\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세계 시민들\u003c/span>\u003c/div>\u003cdiv>\u003cb>necessary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>필요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>possible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>skeptical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>회의적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>global citizenship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세계 시민 정체성(시민권)\u003c/span>\u003c/div>\u003cdiv>\u003cb>nationstate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>국민 국가\u003c/span>\u003c/div>\u003cdiv>\u003cb>After all\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어쨌든, 결국\u003c/span>\u003c/div>\u003cdiv>\u003cb>exist\u003c/b>\u003cem>동사\u003c/em>\u003cspan>존재하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rise\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부상, 등장\u003c/span>\u003c/div>\u003cdiv>\u003cb>over the last few centuries\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>지난 몇 세기에 걸쳐\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead A to B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A가 B하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>state citizenship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>국가 시민 정체성(시민권)\u003c/span>\u003c/div>\u003cdiv>\u003cb>identity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정체성\u003c/span>\u003c/div>\u003cdiv>\u003cb>people group\u003c/b>\u003cem>명사\u003c/em>\u003cspan>민족 집단\u003c/span>\u003c/div>\u003cdiv>\u003cb>religion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종교\u003c/span>\u003c/div>\u003cdiv>\u003cb>given\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 고려할 때\u003c/span>\u003c/div>\u003cdiv>\u003cb>connections\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연결(관계)\u003c/span>\u003c/div>\u003cdiv>\u003cb>common challenges\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공통 과제\u003c/span>\u003c/div>\u003cdiv>\u003cb>layer A on(to) B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B 위에 쌓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>This doesn't mean that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이것이 ~을 의미하는 것은 아니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>replace\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대체하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>single\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>단 하나의\u003c/span>\u003c/div>\u003cdiv>\u003cb>Instead\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오히려\u003c/span>\u003c/div>\u003cdiv>\u003cb>precisely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정확히\u003c/span>\u003c/div>\u003cdiv>\u003cb>because\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>왜냐하면 ~이기 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>obligations\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의무\u003c/span>\u003c/div>\u003cdiv>\u003cb>community\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공동체\u003c/span>\u003c/div>\u003cdiv>\u003cb>around the world\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전 세계의\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번에 꼭 알아야 할 어휘를 정리해 볼게요. skeptical은 회의적인, nationstate는 국민 국가, identity는 정체성, obligations는 의무라는 뜻이에요. global citizenship은 세계 시민 정체성 또는 세계 시민권이라고 옮길 수 있고, state citizenship은 국가 시민 정체성 또는 국민으로서의 시민권을 뜻합니다. layer A on B는 A를 B 위에 쌓다로, 이 글의 핵심 동작을 나타내는 표현이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">necessary\u003c/b>\u003cspan class=\"m\">필요한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">indispensable\u003c/span>\u003cspan class=\"s\">vital\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unnecessary\u003c/span>\u003cspan class=\"a\">optional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">possible\u003c/b>\u003cspan class=\"m\">가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">feasible\u003c/span>\u003cspan class=\"s\">viable\u003c/span>\u003cspan class=\"s\">achievable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">impossible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">skeptical\u003c/b>\u003cspan class=\"m\">회의적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">doubtful\u003c/span>\u003cspan class=\"s\">dubious\u003c/span>\u003cspan class=\"s\">questioning\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">convinced\u003c/span>\u003cspan class=\"a\">certain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">replace\u003c/b>\u003cspan class=\"m\">대체하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">substitute\u003c/span>\u003cspan class=\"s\">displace\u003c/span>\u003cspan class=\"s\">take the place of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">retain\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">obligations\u003c/b>\u003cspan class=\"m\">의무\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">duties\u003c/span>\u003cspan class=\"s\">responsibilities\u003c/span>\u003cspan class=\"s\">commitments\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rights\u003c/span>\u003cspan class=\"a\">options\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">identity\u003c/b>\u003cspan class=\"m\">정체성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">individuality\u003c/span>\u003cspan class=\"s\">character\u003c/span>\u003cspan class=\"s\">self\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exist\u003c/b>\u003cspan class=\"m\">존재하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be present\u003c/span>\u003cspan class=\"s\">survive\u003c/span>\u003cspan class=\"s\">live\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disappear\u003c/span>\u003cspan class=\"a\">cease\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 익혀 두면 어휘 문제에 유리해요. necessary는 essential이나 indispensable, vital과 바꿔 쓸 수 있고, 반대로 unnecessary나 optional은 반의어입니다. possible은 feasible이나 viable과 의미가 가깝고, impossible과 반대되죠. skeptical은 doubtful, dubious, questioning과 유사하고, convinced나 certain과 대조됩니다. replace는 substitute나 displace와 유사하고, retain이나 keep과는 반대 방향이에요. obligations는 duties나 responsibilities, commitments와 통하고, rights나 options와 대비할 수 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 우리 자신을 생각하지 않을 수도 있다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">ourselves \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아직 세계 시민으로는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">global \u003c/span>\u003cspan class=\"tgt\">citizens\u003c/span> yet,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그것은 필요하기도 하고 가능하기도 하다\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">necessary \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">possible \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">so\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 아직 우리 자신을 세계 시민이라고 생각하지 않을 수도 있지만, 그렇게 생각하는 것은 필요하면서도 가능하기도 하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 우리가 아직 세계 시민이라고 생각하지 않을 수도 있지만, 그렇게 생각하는 것이 필요하고 가능하다고 말합니다. 글 전체의 화제인 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">시민\u003c/b>이라는 정체성을 제안하면서, 뒤에 이어질 논의의 방향을 여는 역할을 해요. but 이후에서 \u003cb class=\"key\">필요성\u003c/b>과 \u003cb class=\"key\">가능성\u003c/b>을 함께 강조하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 might not + 동사원형 / think of A as B\u003c/span> : might not + [think] (조동사+동사원형) / think of A as B : \"자신을 세계 시민으로는 생각하지 않을 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가주어·진주어 / 상관접속사 both A and B\u003c/span> : It is + [both necessary and possible] (형용사구) + [to do so] (진주어) : \"그렇게 하는 것은 필요하면서도 가능하다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"We might not think of ourselves, 우리는 우리 자신을 생각하지 않을 수도 있다. as global citizens yet, 아직 세계 시민으로는. but it's both necessary and possible, 하지만 그것은 필요하기도 하고 가능하기도 하다. to do so, 그렇게 하는 것이. 이 문장 전체를 해석하면, 우리는 아직 우리 자신을 세계 시민이라고 생각하지 않을 수도 있지만, 그렇게 생각하는 것은 필요하면서도 가능하기도 하다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 우리가 아직 세계 시민이라고 생각하지 않을 수도 있지만, 그렇게 생각하는 것은 필요하고 가능하다고 말합니다. 글의 화제인 세계 시민이라는 정체성을 제안하면서 논의의 방향을 여는 역할을 해요. but 이하에서 필요성과 가능성을 함께 강조하고 있어요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 might not think of ourselves as global citizens 부분이에요. might not은 약한 추측의 부정으로 그렇게 생각하지 않을 수도 있다는 뜻이고, think of A as B는 A를 B로 생각하다라는 뜻이죠. ourselves는 앞의 we를 받는 재귀대명사예요. 두 번째는 it's both necessary and possible to do so에서 가주어와 진주어 구조가 쓰였어요. it은 가주어이고 to do so가 진주어이며, both A and B가 necessary와 possible을 병렬로 연결하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람들은 회의적이다\u003c/span>\u003cspan class=\"en\">Some people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">skeptical \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계 시민이라는 개념에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">about\u003c/span> the idea of global citizenship,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 인류 역사 대부분 동안\u003c/span>\u003cspan class=\"en\">but for most of human history,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 자신을 생각하지 않았다\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">themselves \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국민 국가의 시민으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">citizens \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">nationstates\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 사람들은 세계 시민이라는 개념에 대해 회의적이지만, 인류 역사 대부분의 기간 동안 사람들은 자기 자신을 국민 국가의 시민이라고 생각하지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 문장은 일부 사람들이 세계 시민이라는 개념에 대해 \u003cb class=\"key\">회의적\u003c/b>이지만, 인류 역사 대부분 동안 사람들은 자신을 \u003cb class=\"key\">국민 \u003c/b>\u003cb class=\"key\">국가\u003c/b>의 시민으로 생각하지 않았다고 말합니다. 반대 의견을 먼저 인정하면서도, 역사적 사실을 들어 그 반대 의견을 \u003cb class=\"key\">반박\u003c/b>하는 흐름을 만들어요. 이는 곧 시민 정체성이 시대에 따라 달라져 왔다는 점을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 형용사 + 전치사 about\u003c/span> : be [skeptical] + about [the idea of global citizenship] : \"세계 시민이라는 개념에 대해 회의적이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거 부정 didn't + 동사원형 / think of A as B\u003c/span> : didn't + [think] + of [themselves] as [citizens of nationstates] : \"자기 자신을 국민 국가의 시민으로 생각하지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Some people are skeptical, 어떤 사람들은 회의적이다. about the idea of global citizenship, 세계 시민이라는 개념에 대해. but for most of human history, 하지만 인류 역사 대부분 동안. people didn't think of themselves, 사람들은 자신을 생각하지 않았다. as citizens of nationstates, 국민 국가의 시민으로. 이 문장 전체를 해석하면, 어떤 사람들은 세계 시민이라는 개념에 대해 회의적이지만, 인류 역사 대부분의 기간 동안 사람들은 자기 자신을 국민 국가의 시민이라고 생각하지 않았다.","hl":"m"},{"n":16,"text":"두 번째 문장은 세계 시민 개념에 회의적인 사람들이 있다는 점을 인정하면서도, 인류 역사 대부분 동안 사람들은 자신을 국민 국가의 시민으로 생각하지 않았다고 말합니다. 반대 의견을 먼저 제시하고 역사적 사실로 바로 반박하는 흐름이에요. 시민 정체성이 시대에 따라 달라져 왔다는 점이 드러나요.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 are skeptical about이에요. skeptical은 회의적인이라는 뜻이고, 무엇에 대해 회의적인지 말할 때 전치사 about을 씁니다. 두 번째는 didn't think of themselves as citizens of nationstates 부분이에요. didn't 뒤에는 동사원형 think가 왔고, think of A as B는 A를 B로 생각하다라는 뜻이죠. themselves는 문장 주어 people을 받는 재귀대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어쨌든, 결국\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인류 역사 대부분의 기간 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">history\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국민 국가는 존재하지 않았다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">nationstates \u003c/span>\u003cspan class=\"tgt\">didn't \u003c/span>\u003cspan class=\"tgt\">exist\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어쨌든, 인류 역사 대부분의 기간 동안 국민 국가는 존재하지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 문장은 결국 인류 역사 대부분의 기간 동안 \u003cb class=\"key\">국민 \u003c/b>\u003cb class=\"key\">국가\u003c/b>가 존재하지 않았다는 사실을 제시합니다. 앞 문장에서 사람들이 스스로를 국민 국가의 시민으로 생각하지 않았던 이유를 \u003cb class=\"key\">After \u003c/b>\u003cb class=\"key\">all\u003c/b>로 설명하는 역할을 해요. 국민 국가가 없었으므로 그 시민이라는 정체성도 없었다는 논리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 After all\u003c/span> : After all + [문장] : \"어쨌든, 결국\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 for + 기간\u003c/span> : for + [most of human history] (기간 명사구) : \"인류 역사 대부분의 기간 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거 시제 부정 didn't + 동사원형\u003c/span> : didn't + [exist] (동사원형) : \"국민 국가는 존재하지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"After all, 어쨌든, 결국. for most of human history, 인류 역사 대부분의 기간 동안. nationstates didn't exist, 국민 국가는 존재하지 않았다.. 이 문장 전체를 해석하면, 어쨌든, 인류 역사 대부분의 기간 동안 국민 국가는 존재하지 않았다.","hl":"m"},{"n":19,"text":"세 번째 문장은 결국 인류 역사 대부분의 기간 동안 국민 국가가 존재하지 않았다는 사실을 말합니다. 앞 문장에서 사람들이 자신을 국민 국가의 시민으로 생각하지 않았던 이유를 설명하는 문장이에요. After all이라는 표현이 앞 내용의 근거를 덧붙이고 있어요.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 After all이에요. After all은 앞 문장의 이유를 보충하는 연결 표현으로 어쨌든 혹은 결국이라는 뜻이죠. 두 번째는 for most of human history에서 전치사 for가 기간을 나타낸다는 점이에요. for 뒤에 기간 표현이 오면 그 시간 동안이라는 의미가 됩니다. 세 번째는 didn't exist인데, didn't 뒤에는 동사원형 exist가 와서 과거를 부정하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국민 국가의 부상은\u003c/span>\u003cspan class=\"en\">The rise of nationstates\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지난 몇 세기에 걸친\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">last \u003c/span>\u003cspan class=\"tgt\">few \u003c/span>\u003cspan class=\"tgt\">centuries\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들로 하여금 ~하게 만들었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">led \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국가 시민 정체성을 더하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">add\u003c/span> state citizenship\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 정체성들에\u003c/span>\u003cspan class=\"en\">to other identities,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족, 민족 집단, 혹은 종교와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">family, \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">group, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">religion\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지난 몇 세기에 걸친 국민 국가의 부상은 사람들로 하여금 가족, 민족 집단, 혹은 종교와 같은 다른 정체성들에 국가 시민 정체성을 더하게 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 국민 국가가 등장하면서 사람들은 \u003cb class=\"key\">가족\u003c/b>, \u003cb class=\"key\">민족 \u003c/b>\u003cb class=\"key\">집단\u003c/b>, \u003cb class=\"key\">종교\u003c/b> 같은 기존 정체성에 \u003cb class=\"key\">국가 \u003c/b>\u003cb class=\"key\">시민 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 하나 더하게 되었다는 역사적 사실을 설명합니다. 글 전체에서는 세계 시민 정체성도 이처럼 \u003cb class=\"key\">정체성의 \u003c/b>\u003cb class=\"key\">층위\u003c/b>로 추가될 수 있다는 논의의 바탕이 됩니다. add A to B 구조로 정체성이 겹겹이 쌓이는 모습을 구체적으로 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 (시간의 경과)\u003c/span> : over + 기간 : \"지난 몇 세기에 걸쳐\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">lead + 목적어 + to부정사 (5형식)\u003c/span> : lead + 목적어 + to부정사 : \"사람들로 하여금 ~을 하게 만들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">such as + 명사 열거\u003c/span> : such as + N1, N2, or N3 : \"가족, 민족 집단, 혹은 종교와 같은\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The rise of nationstates, 국민 국가의 부상은. over the last few centuries, 지난 몇 세기에 걸친. has led people, 사람들로 하여금 ~하게 만들었다. to add state citizenship, 국가 시민 정체성을 더하도록. to other identities, 다른 정체성들에. such as family, people group, or religion, 가족, 민족 집단, 혹은 종교와 같은. 이 문장 전체를 해석하면, 지난 몇 세기에 걸친 국민 국가의 부상은 사람들로 하여금 가족, 민족 집단, 혹은 종교와 같은 다른 정체성들에 국가 시민 정체성을 더하게 만들었다.","hl":"m"},{"n":22,"text":"이 문장은 국민 국가가 생기면서 사람들이 가족이나 민족 집단처럼 원래 있던 정체성에 국가 시민 정체성을 더하게 되었다는 역사적 흐름을 설명해요. 즉 정체성은 하나만 있는 게 아니라 여러 겹으로 추가될 수 있다는 걸 보여 주죠. 뒤에서 세계 시민 정체성을 한 겹 더 쌓자는 주장으로 이어지는 배경이 됩니다.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 over the last few centuries에요. over 다음에 기간이 오면 어떤 기간에 걸쳐라는 뜻이라서 현재완료 has led와 함께 지난 몇 세기 동안의 변화를 강조해요. 두 번째 포인트는 has led people to add입니다. lead는 목적어와 to부정사를 함께 취해서 누가 무엇을 하게 만들었다는 의미를 나타내요. 세 번째 포인트는 such as family, people group, or religion인데, such as 뒤에 병렬로 예시를 나열해서 other identities의 구체적인 모습을 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연결들을 고려할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Given \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">connections\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전세계 사람들 간의\u003c/span>\u003cspan class=\"en\">between people around the world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 우리가 직면한 공통 과제들\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">common \u003c/span>\u003cspan class=\"tgt\">challenges \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">face\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 쌓을 필요가 있다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">layer\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계 시민 정체성을\u003c/span>\u003cspan class=\"en\">global citizenship\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 다른 정체성들 위에\u003c/span>\u003cspan class=\"en\">on to these other identities.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전세계 사람들 간의 연결과 우리가 직면한 공통 과제들을 고려할 때, 우리는 이러한 다른 정체성들 위에 세계 시민 정체성을 쌓을 필요가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전 세계 사람들 간의 연결과 공통 과제를 근거로, 이제는 기존 정체성 위에 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">시민 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 \u003cb class=\"key\">겹쳐 \u003c/b>\u003cb class=\"key\">쌓아야\u003c/b> 한다는 주장의 핵심 문장입니다. Given이 \u003cb class=\"key\">이유\u003c/b>를 먼저 제시하고, 본동사 need to가 \u003cb class=\"key\">필요성\u003c/b>을 강조하며 글의 중심 주장을 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Given + 명사구 (독립분사구문/전치사적 용법)\u003c/span> : Given + 명사구 : \"연결들을 고려할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : 선행사 + (that/which) + 주어 + 동사 : \"우리가 직면한 공통 과제들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">need + to부정사 (목적어)\u003c/span> : need + to부정사 : \"쌓을 필요가 있다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Given the connections, 연결들을 고려할 때. between people around the world, 전세계 사람들 간의. and the common challenges we face, 그리고 우리가 직면한 공통 과제들. we need to layer, 우리는 쌓을 필요가 있다. global citizenship, 세계 시민 정체성을. on to these other identities, 이러한 다른 정체성들 위에. 이 문장 전체를 해석하면, 전세계 사람들 간의 연결과 우리가 직면한 공통 과제들을 고려할 때, 우리는 이러한 다른 정체성들 위에 세계 시민 정체성을 쌓을 필요가 있다.","hl":"m"},{"n":25,"text":"전 세계 사람들이 서로 연결되어 있고 공통된 과제도 있다는 현실을 먼저 제시해요. 그렇기 때문에 우리가 기존의 정체성들을 없애지 말고 그 위에 세계 시민 정체성을 얹어야 한다는 이 글의 중심 주장이 담긴 문장입니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 문장 앞의 Given the connections이에요. Given은 무엇을 고려할 때라는 뜻으로 뒤에 명사구를 데리고 와서 세계 시민 정체성이 필요한 이유를 미리 제시합니다. 두 번째 포인트는 the common challenges we face인데, challenges 뒤에 목적격 관계대명사 that이나 which가 생략되어 있어요. 원래는 the common challenges that we face이죠. 세 번째 포인트는 need to layer로, need는 to부정사를 목적어로 취해서 무엇을 할 필요가 있다는 의미를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 의미하지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">doesn't \u003c/span>\u003cspan class=\"tgt\">mean\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계 시민 정체성이 대체한다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">global \u003c/span>\u003cspan class=\"tgt\">citizenship \u003c/span>\u003cspan class=\"tgt\">replaces \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 다른 정체성들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">identities\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것이 세계 시민 정체성이 이러한 다른 정체성들을 대체한다는 것을 의미하지는 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바로 앞 문장의 주장이 오해되지 않도록, 세계 시민 정체성이 기존 정체성을 \u003cb class=\"key\">대체\u003c/b>하는 게 아니라고 한정합니다. 기존의 가족·공동체·국가 정체성을 없애는 것이 아니라 그 위에 \u003cb class=\"key\">한 \u003c/b>\u003cb class=\"key\">층을 \u003c/b>\u003cb class=\"key\">더하는\u003c/b> 것임을 분명히 하여 논지를 다듬습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 do의 부정\u003c/span> : do not + 동사원형 : \"이것은 의미하지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that절 (목적어)\u003c/span> : mean + that절 : \"세계 시민 정체성이 이러한 다른 정체성들을 대체한다는 것을\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This doesn't mean, 이것은 의미하지 않는다. that global citizenship replaces, 세계 시민 정체성이 대체한다는 것을. these other identities, 이러한 다른 정체성들을. 이 문장 전체를 해석하면, 이것이 세계 시민 정체성이 이러한 다른 정체성들을 대체한다는 것을 의미하지는 않는다.","hl":"m"},{"n":28,"text":"앞 문장에서 세계 시민 정체성을 쌓자고 했는데, 그 말이 기존 정체성을 버리라는 뜻은 아니에요. 이 문장은 세계 시민 정체성이 가족이나 국가 같은 다른 정체성을 대체하는 게 아니라 그 위에 더해지는 것임을 분명히 해 줍니다.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 This doesn't mean이에요. 일반동사 mean을 부정할 때는 doesn't mean으로 쓰고, this는 바로 앞 문장의 내용을 가리킵니다. 두 번째 포인트는 that global citizenship replaces these other identities인데, 접속사 that이 이끄는 명사절이 mean의 목적어 역할을 합니다. 이 절이 앞에 나온 this의 내용을 구체적으로 설명해 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There's \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단 하나의 이야기가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">single \u003c/span>\u003cspan class=\"tgt\">story\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 정체성들에 관한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">identities\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 정체성들에 관한 단 하나의 이야기가 있는 것은 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바로 앞 문장에서 세계 시민 정체성이 다른 정체성을 대체하지 않는다고 말한 뒤, 이 문장은 정체성이 \u003cb class=\"key\">단일한 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>가 아니라 여러 개의 이야기라고 강조합니다. a single story는 하나의 \u003cb class=\"key\">서사\u003c/b>나 설명을 뜻하고, 이것이 없다는 것은 가족, 공동체, 세계 시민으로서의 \u003cb class=\"key\">다중 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>이 공존할 수 있다는 의미입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there is not 구문 (유도부사 there)\u003c/span> : There is + not + a single story (주어) : \"단 하나의 이야기가 있지 않다.\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 후치 수식\u003c/span> : about + our identities (전치사구) : \"우리의 정체성들에 관한.\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"There's not, 없다. a single story, 단 하나의 이야기가. about our identities, 우리의 정체성들에 관한. 이 문장 전체를 해석하면, 우리의 정체성들에 관한 단 하나의 이야기가 있는 것은 아니다.","hl":"m"},{"n":31,"text":"바로 앞 문장에서 세계 시민 정체성이 다른 정체성을 대체하지 않는다고 했죠. 이 문장은 정체성이 단일한 이야기가 아니라 여러 개의 이야기라고 강조합니다. a single story는 하나의 서사나 설명을 뜻하고, 이것이 없다는 것은 가족, 공동체, 세계 시민으로서의 다중 정체성이 공존할 수 있다는 의미예요.","hl":"mn"},{"n":32,"text":"첫 번째 어법은 There's not a single story에서 there is not 구문이에요. There는 유도부사이고 진짜 주어는 a single story입니다. story가 단수라 is를 썼고 not이 붙어 부정문을 만들었어요. 두 번째 어법은 about our identities가 전치사구로 앞의 a single story를 뒤에서 꾸며 주는 후치 수식이라는 점이에요. 우리 정체성들에 관한 이야기라는 의미를 완성해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오히려,\u003c/span>\u003cspan class=\"en\">Instead,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 정확하게 바로 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">precisely \u003c/span>\u003cspan class=\"tgt\">because\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 의무를 지닌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">obligations \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 가족에 대해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">families, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 공동체에 있는 사람들,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">community, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 전 세계에 있는 사람들.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오히려, 그것은 정확하게는 우리가 우리의 가족, 공동체 내의 사람들, ‘그리고’ 전 세계 사람들에 대한 의무를 지니고 있기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 단일한 이야기가 없다는 말을 받아, 오히려 바로 이런 이유 때문이라고 설명합니다. it은 세계 시민 정체성을 더해야 하는 이유를 가리키며, 우리가 가족과 공동체와 전 세계 사람들 모두에게 \u003cb class=\"key\">의무\u003c/b>를 지니기 때문이라는 뜻입니다. 가까운 공동체에 대한 의무와 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">시민\u003c/b>으로서의 의무가 서로 배치되지 않음을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">it is precisely because 구문\u003c/span> : It is + precisely because + 주어 + 동사 : \"그것은 정확하게 바로 때문이다.\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">A, B, and C 병렬 구조\u003c/span> : have obligations to + A, B, and C : \"우리 가족, 우리 공동체에 있는 사람들, 그리고 전 세계에 있는 사람들에 대한 의무를 지니다.\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Instead, 오히려. it's precisely because, 그것은 정확하게 바로 때문이다. we have obligations, 우리가 의무를 지닌다. to our families, 우리 가족에 대해. those in our community, 우리 공동체에 있는 사람들. and those around the world, 그리고 전 세계에 있는 사람들.. 이 문장 전체를 해석하면, 오히려, 그것은 정확하게는 우리가 우리의 가족, 공동체 내의 사람들, ‘그리고’ 전 세계 사람들에 대한 의무를 지니고 있기 때문이다.","hl":"m"},{"n":34,"text":"Instead는 앞 문장과 반대로 오히려라는 뜻이에요. it's precisely because에서 it은 세계 시민 정체성을 더해야 하는 이유를 가리키고, precisely because는 바로 그 이유를 강조해요. 우리가 가족, 공동체, 전 세계 사람들 모두에 대한 의무를 지니기 때문에 다중 정체성이 필요하다고 말하는 겁니다.","hl":"mn"},{"n":35,"text":"첫 번째 어법은 it's precisely because에서 it is because 구문이에요. it은 앞에서 말한 세계 시민 정체성을 더해야 하는 이유를 가리키고, precisely가 because를 강조합니다. 두 번째 어법은 we have obligations to our families, those in our community, and those around the world에서 병렬 구조예요. 의무의 대상이 our families, those in our community, and those around the world로 and로 연결되어 있어요. to가 이 세 대상을 모두 이끌기 때문에 전 세계 사람들까지 의무의 범위가 확장됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>세계 시민 정체성은 필요하고 가능하지만, 어떤 사람들은 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">시민\u003c/b> 개념에 \u003cb class=\"key\">회의적\u003c/b>이다.\u003c/li>\u003cli>인류 역사 대부분 \u003cb class=\"key\">국민 \u003c/b>\u003cb class=\"key\">국가\u003c/b>가 없었고, 최근 몇 세기에 걸쳐 \u003cb class=\"key\">국가 \u003c/b>\u003cb class=\"key\">시민 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>이 가족, 민족, 종교 등의 \u003cb class=\"key\">정체성\u003c/b>에 더해졌다.\u003c/li>\u003cli>전 세계 사람들 간 \u003cb class=\"key\">연결\u003c/b>과 \u003cb class=\"key\">공통 \u003c/b>\u003cb class=\"key\">과제\u003c/b> 때문에 기존 정체성 위에 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">시민 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 덧쌓아야 한다.\u003c/li>\u003cli>이는 기존 \u003cb class=\"key\">정체성\u003c/b>을 \u003cb class=\"key\">대체\u003c/b>하는 것이 아니라, 가족·공동체·전 세계 사람들에 대한 \u003cb class=\"key\">의무\u003c/b> 때문이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>We need to layer global citizenship onto our existing identities, not replace them, because we have obligations to our families, communities, and people around the world.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">세계 시민 정체성은 기존 정체성을 \u003cb class=\"key\">대체\u003c/b>하는 것이 아니라 그 위에 \u003cb class=\"key\">덧쌓는\u003c/b> 것이며, 전 세계적 \u003cb class=\"key\">연결\u003c/b>과 \u003cb class=\"key\">공통 \u003c/b>\u003cb class=\"key\">과제\u003c/b>를 고려할 때 필요하고 가능하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 지문을 정리하면, 세계 시민 정체성은 기존의 정체성을 없애는 것이 아니라 그 위에 하나의 층으로 더해지는 것입니다. 국민 국가의 등장도 가족과 민족, 종교에 국가 시민 정체성을 덧쌓은 과정이었고, 이제는 전 세계적 연결과 공통 과제 때문에 세계 시민이라는 층이 필요해요. 이때도 우리는 가족과 공동체, 전 세계 사람들에 대한 의무를 함께 지닌다는 점을 잊지 말아야 합니다. 오늘 내용을 바탕으로 세계 시민이라는 개념을 더 넓은 관점에서 생각해 보길 바랍니다.","hl":null}]}]});</script></body></html>
