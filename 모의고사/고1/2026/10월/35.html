<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 10월 모의고사 35번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 10월 모의고사 35번","audioDir":"35_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">35번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 10월 모의고사\u003c/div>\u003ch1>From Personal Failing to Structural Issue: WHO Recognition of Burnout\u003c/h1>\u003ch2>개인의 실패에서 구조적 문제로: WHO의 번아웃 인정\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>2019년 WHO가 번아웃을 \u003cb class=\"key\">직업적 \u003c/b>\u003cb class=\"key\">현상\u003c/b>으로 인정한 것은 번아웃을 개인적 실패나 회복 탄력성 문제가 아닌 조직 문화와 지도부 관행 등에 뿌리를 둔 \u003cb class=\"key\">구조적 \u003c/b>\u003cb class=\"key\">문제\u003c/b>로 보는 전환을 가져왔고, 이를 통해 \u003cb class=\"key\">시스템 \u003c/b>\u003cb class=\"key\">차원의 \u003c/b>\u003cb class=\"key\">개입\u003c/b>과 정책 수준의 변화 가능성을 열었다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The WHO's recognition of burnout as an occupational phenomenon reframes it from an individual failure to a structural issue, opening the door to systemic prevention.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 분석할 지문은 2019년 세계보건기구 WHO가 번아웃을 직업적 현상으로 인정한 일을 다룬 글이에요. 이 글은 번아웃을 개인적 실패가 아니라 구조적 문제로 바라보는 관점의 전환을 설명합니다. 요지는 WHO의 인정이 번아웃을 개인 탓이 아닌 조직과 정책이 해결해야 할 문제로 다시 규정한다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">번아웃은 오랫동안 개인의 의지나 \u003cb class=\"key\">회복 \u003c/b>\u003cb class=\"key\">탄력성\u003c/b> 부족으로 여겨졌어요. 하지만 2019년 세계보건기구 WHO는 번아웃을 질병이 아닌 occupational phenomenon, 즉 \u003cb class=\"key\">직업적 \u003c/b>\u003cb class=\"key\">현상\u003c/b>으로 분류했어요. 이는 clinical assessment, 임상적 평가와 organizational responsibility, 조직의 책임을 다시 보게 만든 계기입니다. 예를 들어 감기에 자주 걸리는 사람에게 비타민만 권하기보다 사무실 환기나 과도한 업무량을 함께 살피는 것과 비슷하죠. 번아웃의 뿌리는 organizational culture, \u003cb class=\"key\">조직 \u003c/b>\u003cb class=\"key\">문화\u003c/b>와 leadership practices, 지도부 관행, 더 넓은 socioeconomic context, 사회경제적 맥락에 있기 때문에 예방도 시스템 차원에서 접근해야 합니다. 그래서 이제는 개인 대처만이 아니라 structural intervention, \u003cb class=\"key\">구조적 \u003c/b>\u003cb class=\"key\">개입\u003c/b>과 policy-level change, 정책 수준의 변화가 강조됩니다.\u003c/div>","segs":[{"n":2,"text":"번아웃은 흔히 개인의 의지나 회복 탄력성 부족으로 여겨졌어요. 그런데 세계보건기구 WHO는 2019년에 번아웃을 질병이 아니라 occupational phenomenon, 즉 직업적 현상으로 분류했어요. 이 때문에 clinical assessment, 임상적 평가와 organizational responsibility, 조직의 책임을 다시 보게 됐죠. 감기에 자주 걸리는 사람에게 비타민만 권하지 않고 사무실 환기와 업무량을 함께 살피는 것과 비슷해요. 번아웃의 뿌리는 organizational culture, 조직 문화와 leadership practices, 지도부 관행, 그리고 더 넓은 socioeconomic context, 사회경제적 맥락에 있습니다. 그래서 개인 대처보다 structural intervention, 구조적 개입과 policy-level change, 정책 수준의 변화가 강조됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>WHO 인정과 재구성\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>2019년 WHO가 번아웃을 \u003cb class=\"key\">직업적 \u003c/b>\u003cb class=\"key\">현상\u003c/b>으로 인정한 것은 직장 정신 건강 담론에서 중요한 순간이었습니다. 이 지정은 임상적 평가와 조직의 책임을 \u003cb class=\"key\">재구성\u003c/b>하며 관심을 \u003cb class=\"key\">시스템 \u003c/b>\u003cb class=\"key\">차원의 \u003c/b>\u003cb class=\"key\">예방\u003c/b>으로 이동시킵니다. 즉 개인만의 문제가 아니라 조직이 함께 다뤄야 할 과제로 바뀌는 것이죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>구조적 개입의 요청\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>이러한 인정은 고용주가 개인 수준의 해결책에만 의존하지 말고 \u003cb class=\"key\">구조적 \u003c/b>\u003cb class=\"key\">개입\u003c/b>을 채택하도록 이끕니다. 실제로 임상의들은 근본 원인을 다루기 위해 \u003cb class=\"key\">산업 \u003c/b>\u003cb class=\"key\">보건 \u003c/b>\u003cb class=\"key\">부서\u003c/b>와 지도부와 협력해야 합니다. 이는 해결의 주체가 개인에서 조직으로 이동했음을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>개인 실패에서 구조 문제로\u003csmall>통념-반박 · 문장 5\u003c/small>\u003c/h4>\u003cp>이러한 흐름은 번아웃을 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">실패\u003c/b>나 개인의 회복 탄력성 문제로 보던 시각에서 벗어나게 합니다. 대신 조직 문화, 지도부 관행, 더 넓은 노동의 \u003cb class=\"key\">사회경제적 \u003c/b>\u003cb class=\"key\">맥락\u003c/b>에 뿌리를 둔 \u003cb class=\"key\">구조적 \u003c/b>\u003cb class=\"key\">문제\u003c/b>로 이해하는 전환을 나타냅니다. 기존의 개인 책임 \u003cb class=\"key\">통념\u003c/b>을 반박하는 장면입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>재구성의 필연성\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>이러한 재구성은 필수적입니다. 왜냐하면 개인에게만 대처하거나 적응하라는 부담을 지우는 대신 \u003cb class=\"key\">시스템 \u003c/b>\u003cb class=\"key\">차원의 \u003c/b>\u003cb class=\"key\">개입\u003c/b>과 \u003cb class=\"key\">정책 \u003c/b>\u003cb class=\"key\">수준의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>로 향하는 문을 열어 주기 때문입니다. 결국 번아웃 예방의 중심은 개인이 아니라 조직과 제도가 되어야 합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"전체 문장의 흐름을 네 단계로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 WHO의 인정이 번아웃 논의를 바꾸는 도입 부분입니다. 세계보건기구 WHO가 2019년에 번아웃을 직업적 현상으로 인정한 것은 직장 정신 건강 담론에서 중요한 순간이었어요. 이 지정은 임상적 평가와 조직의 책임을 재구성하고 관심을 시스템 차원의 예방으로 이동시킵니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 구조적 개입의 요청입니다. 고용주는 개인 수준의 해결책에만 의존하지 말고 구조적 개입을 채택해야 해요. 실제로 임상의는 산업 보건 부서와 지도부와 협력해서 근본 원인을 다뤄야 합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 개인 실패에서 구조 문제로의 전환입니다. 번아웃을 개인적 실패나 회복 탄력성의 문제로 보던 시각에서 벗어나 조직 문화와 지도부 관행, 사회경제적 맥락에 뿌리를 둔 구조적 문제로 이해하게 됩니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 재구성의 필연성입니다. 이러한 재구성은 개인에게만 대처하거나 적응하라는 부담을 지우지 않고 시스템 차원의 개입과 정책 수준의 변화로 향하는 문을 열어 주기 때문에 필수적입니다. 결국 번아웃 예방의 중심은 조직과 제도가 되어야 한다는 결론입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장은 WHO 인정 사실을 제시하고, 둘째부터 다섯째 문장까지는 이것이 임상 평가와 조직 책임을 바꾸고 개인 실패가 아닌 \u003cb class=\"key\">구조적 \u003c/b>\u003cb class=\"key\">문제\u003c/b>로 전환한다는 내용을 구체화합니다. 마지막 문장에서 이 재구성이 \u003cb class=\"key\">필수적\u003c/b>인 이유를 밝히며 핵심 주장을 다시 강조하므로 \u003cb class=\"key\">미괄식\u003c/b>입니다. 개인 대 구조라는 \u003cb class=\"key\">통념-반박\u003c/b> 구도가 전개 과정에 드러납니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>This designation (2)\u003c/b>\u003cspan>재진술(앞 문장의 WHO 인정을 받음)\u003c/span>\u003cb>rather than (3)\u003c/b>\u003cspan>대조(개인 수준 해결책과 구조적 개입)\u003c/span>\u003cb>In practice (4)\u003c/b>\u003cspan>구체화·적용\u003c/span>\u003cb>shift away from (5)\u003c/b>\u003cspan>전환(개인에서 구조로)\u003c/span>\u003cb>rather than (6)\u003c/b>\u003cspan>대조(개인 부담과 시스템 개입)\u003c/span>\u003cb>This reframing (6)\u003c/b>\u003cspan>재진술 및 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">burnout as an occupational phenomenon\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this designation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">systemic prevention\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">structural interventions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">structural issue\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this reframing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">systemic interventions and policy-level changes\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>개인 수준 접근\u003c/th>\u003cth>구조적 접근\u003c/th>\u003c/tr>\u003ctr>\u003ctd>개인의 실패·회복 탄력성 문제로 봄\u003c/td>\u003ctd>조직 문화·지도부 관행·사회경제적 맥락의 문제로 봄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>개인에게 대처·적응 부담\u003c/td>\u003ctd>시스템 차원 개입과 정책 수준 변화\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 기존의 개인 책임이라는 통념을 반박하고 구조적 문제로 전환하는 통념 반박 구조예요. 결론을 마지막에 두는 미괄식으로 볼 수 있어요. 첫 문장은 WHO 인정이라는 사실을 제시하고, 중간 문장들은 그 의미를 구체화하고, 마지막 문장에서 이 재구성이 필수적이라고 강조합니다. 그래서 핵심 주장은 마지막 문장에 집약되어 있습니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 this designation은 앞의 WHO 인정을 다시 받아 주는 재진술이고, rather than은 개인과 구조를 대조하는 말이에요. in practice는 구체적 적용을 알려 주고, shift away from은 개인에서 구조로의 전환을 나타내요. 마지막의 this reframing과 rather than도 결론에서 대조를 다시 강조하는 신호입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>recognition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인정\u003c/span>\u003c/div>\u003cdiv>\u003cb>burnout\u003c/b>\u003cem>명사\u003c/em>\u003cspan>번아웃, 소진\u003c/span>\u003c/div>\u003cdiv>\u003cb>occupational\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>직업의, 직업적\u003c/span>\u003c/div>\u003cdiv>\u003cb>phenomenon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현상\u003c/span>\u003c/div>\u003cdiv>\u003cb>designation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지정, 명칭\u003c/span>\u003c/div>\u003cdiv>\u003cb>reframe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재구성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>clinical assessment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>임상적 평가\u003c/span>\u003c/div>\u003cdiv>\u003cb>organizational responsibility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조직의 책임\u003c/span>\u003c/div>\u003cdiv>\u003cb>systemic prevention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시스템 차원의 예방\u003c/span>\u003c/div>\u003cdiv>\u003cb>structural intervention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구조적 개입\u003c/span>\u003c/div>\u003cdiv>\u003cb>rather than\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~보다는\u003c/span>\u003c/div>\u003cdiv>\u003cb>rely solely on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에만 의존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>individual level remedy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인 수준의 해결책\u003c/span>\u003c/div>\u003cdiv>\u003cb>clinician\u003c/b>\u003cem>명사\u003c/em>\u003cspan>임상의\u003c/span>\u003c/div>\u003cdiv>\u003cb>collaborate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>협력하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>occupational health\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산업 보건\u003c/span>\u003c/div>\u003cdiv>\u003cb>root cause\u003c/b>\u003cem>명사\u003c/em>\u003cspan>근본 원인\u003c/span>\u003c/div>\u003cdiv>\u003cb>shift away from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 벗어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>personal failing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인적 실패\u003c/span>\u003c/div>\u003cdiv>\u003cb>resilience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>회복 탄력성\u003c/span>\u003c/div>\u003cdiv>\u003cb>structural issue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구조적 문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>rooted in\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>~에 뿌리를 둔\u003c/span>\u003c/div>\u003cdiv>\u003cb>organizational culture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조직 문화\u003c/span>\u003c/div>\u003cdiv>\u003cb>leadership practices\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지도부 관행\u003c/span>\u003c/div>\u003cdiv>\u003cb>socioeconomic context\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회경제적 맥락\u003c/span>\u003c/div>\u003cdiv>\u003cb>reframing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재구성\u003c/span>\u003c/div>\u003cdiv>\u003cb>essential\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>필수적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>policy-level change\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정책 수준의 변화\u003c/span>\u003c/div>\u003cdiv>\u003cb>burden\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부담\u003c/span>\u003c/div>\u003cdiv>\u003cb>cope\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대처하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 정리할게요. recognition은 인정, burnout은 번아웃, occupational은 직업적이라는 뜻이에요. reframe은 재구성하다, systemic prevention은 시스템 차원의 예방, structural intervention은 구조적 개입입니다. personal failing은 개인적 실패, resilience는 회복 탄력성, policy-level change는 정책 수준의 변화예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">recognition\u003c/b>\u003cspan class=\"m\">인정\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">acknowledgment\u003c/span>\u003cspan class=\"s\">acceptance\u003c/span>\u003cspan class=\"s\">identification\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">denial\u003c/span>\u003cspan class=\"a\">ignorance\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reframe\u003c/b>\u003cspan class=\"m\">재구성하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reinterpret\u003c/span>\u003cspan class=\"s\">reconceptualize\u003c/span>\u003cspan class=\"s\">recontextualize\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">systemic\u003c/b>\u003cspan class=\"m\">시스템 차원의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">structural\u003c/span>\u003cspan class=\"s\">organizational\u003c/span>\u003cspan class=\"s\">institutional\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">individual\u003c/span>\u003cspan class=\"a\">personal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">essential\u003c/b>\u003cspan class=\"m\">필수적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">vital\u003c/span>\u003cspan class=\"s\">indispensable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">optional\u003c/span>\u003cspan class=\"a\">unnecessary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">burden\u003c/b>\u003cspan class=\"m\">부담\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">load\u003c/span>\u003cspan class=\"s\">weight\u003c/span>\u003cspan class=\"s\">strain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relief\u003c/span>\u003cspan class=\"a\">aid\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">root cause\u003c/b>\u003cspan class=\"m\">근본 원인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">underlying cause\u003c/span>\u003cspan class=\"s\">fundamental cause\u003c/span>\u003cspan class=\"s\">source\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">symptom\u003c/span>\u003cspan class=\"a\">effect\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 볼게요. recognition은 acknowledgment와 acceptance가 동의어이고 반의어로 denial이 있어요. reframe은 reinterpret나 reconceptualize로 바꿀 수 있고, systemic은 structural 또는 institutional과 통하고 individual과 반대예요. essential은 crucial, vital이 동의어이고 optional이 반의어입니다. burden은 load, strain과 통하고 relief가 반대죠. root cause는 underlying cause나 source가 동의어이고 symptom이나 effect와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">번아웃의 인정은\u003c/span>\u003cspan class=\"en\">The recognition of burnout\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직업적 현상으로서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">occupational \u003c/span>\u003cspan class=\"tgt\">phenomenon\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">2019년 WHO에 의해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">WHO \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">2019\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 순간을 나타냈다\u003c/span>\u003cspan class=\"en\">marked an important moment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">담론에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">discourse \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직장에서의 정신 건강에 관한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">workplace \u003c/span>\u003cspan class=\"tgt\">mental \u003c/span>\u003cspan class=\"tgt\">health\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">2019년 WHO에 의한 번아웃의 직업적 현상으로서의 인정은 직장에서의 정신 건강에 관한 담론에서 중요한 순간을 나타냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 WHO가 2019년 번아웃을 직업적 현상으로 인정한 사건이 직장 정신 건강 담론의 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">전환점\u003c/b>이었음을 서술합니다. 개인의 문제가 아니라 공식적인 직업적 현상으로 인정받았다는 점을 강조하며, 이후 전개될 조직적·구조적 논의의 출발점을 제시합니다. 여기서 \u003cb class=\"key\">occupational \u003c/b>\u003cb class=\"key\">phenomenon\u003c/b>과 \u003cb class=\"key\">workplace \u003c/b>\u003cb class=\"key\">mental \u003c/b>\u003cb class=\"key\">health\u003c/b>가 글의 핵심 주제어입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 as의 자격(~로서) 용법\u003c/span> : as + 명사구 : \"직업적 현상으로서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">행위자·시간 표시 전치사구\u003c/span> : by + 행위자 + in + 연도 : \"2019년 WHO에 의해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 후치 수식\u003c/span> : in + 명사구 + on + 명사구 : \"직장 정신 건강에 관한 담론에서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The recognition of burnout, 번아웃의 인정은. as an occupational phenomenon, 직업적 현상으로서. by the WHO in 2019, 2019년 WHO에 의해. marked an important moment, 중요한 순간을 나타냈다. in the discourse, 담론에서. on workplace mental health, 직장에서의 정신 건강에 관한. 이 문장 전체를 해석하면, 2019년 WHO에 의한 번아웃의 직업적 현상으로서의 인정은 직장에서의 정신 건강에 관한 담론에서 중요한 순간을 나타냈다.","hl":"m"},{"n":13,"text":"이 문장은 2019년 WHO가 번아웃을 직업적 현상으로 인정한 것이 직장 정신 건강 담론에서 중요한 순간이었다는 사실을 서술합니다. 개인의 문제가 아니라 직업적 현상으로 공식 인정받았다는 점이 핵심입니다. occupational phenomenon과 workplace mental health라는 표현을 잡아두면 이 글의 주제가 잡혀요.","hl":"mn"},{"n":14,"text":"첫 번째, as an occupational phenomenon에서 as는 자격을 나타내는 전치사로, 로서라고 해석합니다. 번아웃을 직업적 현상으로 규정하는 표현이에요. 두 번째, by the WHO in 2019에서 by는 행위자를, in은 연도를 나타내는 전치사입니다. 2019년 WHO에 의해 인정되었다는 정보를 덧붙입니다. 세 번째, in the discourse on workplace mental health는 discourse를 수식하는 전치사구로, 직장 정신 건강에 관한 담론이라는 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 지정은 재구성한다\u003c/span>\u003cspan class=\"en\">This designation reframes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">임상적 평가와 조직의 책임을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">clinical \u003c/span>\u003cspan class=\"tgt\">assessment \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">organizational \u003c/span>\u003cspan class=\"tgt\">responsibility\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관심을 이동시키면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">shifting \u003c/span>\u003cspan class=\"tgt\">attention \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시스템 차원의 예방으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">systemic \u003c/span>\u003cspan class=\"tgt\">prevention\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 지정은 임상적 평가와 조직의 책임을 재구성하여, 관심을 시스템 차원의 예방으로 이동시킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞선 WHO의 지정이 임상 평가와 조직 책임을 다시 틀 짜고, 관심을 \u003cb class=\"key\">시스템 \u003c/b>\u003cb class=\"key\">차원의 \u003c/b>\u003cb class=\"key\">예방\u003c/b>으로 옮긴다고 설명합니다. 개인 치료보다 조직과 구조의 변화를 강조하는 흐름을 보여 줍니다. \u003cb class=\"key\">shifting \u003c/b>\u003cb class=\"key\">attention\u003c/b>이 초점 전환의 핵심 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사구 병렬(A and B)\u003c/span> : A and B : \"임상적 평가와 조직의 책임\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구문(동시상황/결과)\u003c/span> : S+V..., ~ing : \"관심을 시스템 차원의 예방으로 이동시키면서\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"This designation reframes, 이러한 지정은 재구성한다. clinical assessment and organizational responsibility, 임상적 평가와 조직의 책임을. shifting attention, 관심을 이동시키면서. to systemic prevention, 시스템 차원의 예방으로. 이 문장 전체를 해석하면, 이러한 지정은 임상적 평가와 조직의 책임을 재구성하여, 관심을 시스템 차원의 예방으로 이동시킨다.","hl":"m"},{"n":16,"text":"두 번째 문장은 이러한 지정이 임상 평가와 조직 책임을 다시 틀 짜고, 관심을 시스템 예방으로 옮긴다는 내용입니다. 개인 치료보다 조직 차원의 예방으로 초점을 전환하는 흐름을 보여줘요. reframes와 shifting attention이 그 변화를 표현하는 핵심 어휘입니다.","hl":"mn"},{"n":17,"text":"첫 번째, clinical assessment and organizational responsibility에서 and가 두 명사구를 병렬로 묶어 reframes의 목적어 역할을 합니다. 두 번째, shifting attention to systemic prevention은 현재분사구문으로, 주절의 동작에 이어서 관심을 시스템 예방으로 이동시키는 부수적 상황을 나타냅니다. 분사구문의 의미상 주어는 this designation이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 고용주들을 이끈다\u003c/span>\u003cspan class=\"en\">It invites employers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구조적 개입을 채택하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">adopt \u003c/span>\u003cspan class=\"tgt\">structural \u003c/span>\u003cspan class=\"tgt\">interventions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 의존하기보다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">relying \u003c/span>\u003cspan class=\"tgt\">solely\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인 수준의 해결책에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">individual \u003c/span>\u003cspan class=\"tgt\">level \u003c/span>\u003cspan class=\"tgt\">remedies\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 고용주들이 오직 개인 수준의 해결책에만 의존하기보다는 구조적 개입을 채택하도록 이끈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞선 지정이 고용주로 하여금 개인 수준의 해결책에만 의존하지 말고 \u003cb class=\"key\">구조적 \u003c/b>\u003cb class=\"key\">개입\u003c/b>을 채택하도록 이끈다고 말합니다. 개인 대처보다 조직 구조 변화를 우선해야 한다는 흐름을 구체화합니다. \u003cb class=\"key\">rather \u003c/b>\u003cb class=\"key\">than\u003c/b> 이하는 개인 수준 해결책을 비교 대상으로 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 목적격 보어(5형식)\u003c/span> : invite + 목적어 + to부정사 : \"구조적 개입을 채택하도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">rather than + 동명사\u003c/span> : rather than + ~ing : \"오직 의존하기보다는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 on이 이끄는 의존 대상\u003c/span> : rely on + 명사구 : \"개인 수준의 해결책에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It invites employers, 그것은 고용주들을 이끈다. to adopt structural interventions, 구조적 개입을 채택하도록. rather than relying solely, 오직 의존하기보다는. on individual level remedies, 개인 수준의 해결책에. 이 문장 전체를 해석하면, 그것은 고용주들이 오직 개인 수준의 해결책에만 의존하기보다는 구조적 개입을 채택하도록 이끈다.","hl":"m"},{"n":19,"text":"세 번째 문장은 그것, 곧 앞선 지정이 고용주로 하여금 개인 차원의 해결책에만 기대지 말고 구조적 개입을 채택하도록 이끈다는 의미입니다. 개인의 대처가 아니라 조직 구조를 바꾸는 방향을 분명히 제시하죠. rather than을 통해 개인 수준 해결책을 배제하는 논리가 드러납니다.","hl":"mn"},{"n":20,"text":"첫 번째, invites employers to adopt structural interventions는 invite가 목적어 다음에 to부정사를 목적격 보어로 취하는 구조입니다. 고용주가 채택하도록 이끈다는 의미가 됩니다. 두 번째, rather than relying solely는 rather than 다음에 동명사를 써서 어떤 행동 대신 다른 행동을 택함을 나타냅니다. 세 번째, on individual level remedies는 rely on의 전치사 on이 이끄는 의존 대상입니다. rely on 자체가 의존하다라는 숙어 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로,\u003c/span>\u003cspan class=\"en\">In practice,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 의미한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">임상의들이 협력해야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">clinicians \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">collaborate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산업 보건 부서 및 지도부와\u003c/span>\u003cspan class=\"en\">with occupational health and leadership\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근본 원인을 다루기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">address \u003c/span>\u003cspan class=\"tgt\">root \u003c/span>\u003cspan class=\"tgt\">causes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실제로, 이것은 임상의들이 근본 원인을 다루기 위해 산업 보건 부서 및 지도부와 협력해야 한다는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 구조적 예방이 실제 현장에서 어떻게 실현되는지를 \u003cb class=\"key\">구체화\u003c/b>합니다. 임상의들이 혼자 환자만 치료하는 것이 아니라 \u003cb class=\"key\">산업 \u003c/b>\u003cb class=\"key\">보건 \u003c/b>\u003cb class=\"key\">부서\u003c/b>와 \u003cb class=\"key\">지도부\u003c/b>와 협력하여 조직 차원의 \u003cb class=\"key\">근본 \u003c/b>\u003cb class=\"key\">원인\u003c/b>을 해결해야 한다는 실천 방향을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적절을 이끄는 접속사 that의 생략\u003c/span> : mean + [(that) + 주어 + 동사] (목적어절) : \"이것은 임상의들이 협력해야 한다는 것을 의미한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should\u003c/span> : should + 동사원형 : \"협력해야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to + 동사원형] (~하기 위해) : \"근본 원인을 다루기 위해\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"In practice, 실제로. this means, 이것은 의미한다. clinicians should collaborate, 임상의들이 협력해야 한다. with occupational health and leadership, 산업 보건 부서 및 지도부와. to address root causes, 근본 원인을 다루기 위해. 이 문장 전체를 해석하면, 실제로, 이것은 임상의들이 근본 원인을 다루기 위해 산업 보건 부서 및 지도부와 협력해야 한다는 것을 의미한다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 구조적 예방이 실제 현장에서 어떻게 실현되는지를 구체화합니다. 임상의들이 혼자 환자만 치료하는 것이 아니라 산업 보건 부서와 지도부와 협력하여 조직 차원의 근본 원인을 해결해야 한다는 실천 방향을 제시하죠.","hl":"mn"},{"n":23,"text":"첫 번째, this means clinicians should collaborate 부분에서 means 뒤에 that이 생략된 목적절이 왔어요. 이 that절은 mean의 목적어로 임상의들이 협력해야 한다는 내용을 전달합니다. 두 번째, to address root causes는 to부정사의 부사적 용법으로 목적을 나타내며, 협력해야 하는 목적이 근본 원인을 다루기 위함임을 보여줍니다. 세 번째, should collaborate에서 should는 의무를 나타내는 조동사로 뒤에 동사원형 collaborate가 왔습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 전환을 나타냈다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> signaled a shift\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">번아웃을 보는 것에서 벗어나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">away \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">viewing \u003c/span>\u003cspan class=\"tgt\">burnout \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인적 실패로서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">personal \u003c/span>\u003cspan class=\"tgt\">failing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 개인의 회복 탄력성의 문제로서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">matter \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">individual \u003c/span>\u003cspan class=\"tgt\">resilience, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 이해하는 것으로 향하여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">toward \u003c/span>\u003cspan class=\"tgt\">understanding \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구조적 문제로서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">structural \u003c/span>\u003cspan class=\"tgt\">issue\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조직 문화, 지도부 관행, 그리고 더 넓은 노동의 사회 경제적 맥락에 뿌리를 둔\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">rooted \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">organizational \u003c/span>\u003cspan class=\"tgt\">culture, \u003c/span>\u003cspan class=\"tgt\">leadership \u003c/span>\u003cspan class=\"tgt\">practices, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">broader \u003c/span>\u003cspan class=\"tgt\">socioeconomic \u003c/span>\u003cspan class=\"tgt\">context \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 번아웃을 개인적 실패나 개인의 회복 탄력성의 문제로 보는 것에서 벗어나, 그것을 조직 문화, 지도부 관행, 그리고 더 넓은 노동의 사회 경제적 맥락에 뿌리를 둔 구조적 문제로 이해하는 것으로 향하는 전환을 나타냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 번아웃에 대한 \u003cb class=\"key\">관점의 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 선명하게 보여줍니다. 예전에는 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">실패\u003c/b>나 \u003cb class=\"key\">회복 \u003c/b>\u003cb class=\"key\">탄력성\u003c/b> 부족으로 보았지만, 이제는 조직 문화와 리더십, 사회 경제적 맥락에 뿌리를 둔 \u003cb class=\"key\">구조적 \u003c/b>\u003cb class=\"key\">문제\u003c/b>로 이해해야 한다는 방향을 제시합니다. away from과 toward의 대비를 통해 변화의 방향성을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 it의 지시\u003c/span> : It + 동사 ~ (앞선 내용을 받는 주어) : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 away from ~ toward ~의 대비와 동명사\u003c/span> : [away from + 동명사구] [toward + 동명사구] : \"~에서 벗어나 ~로 향하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치수식\u003c/span> : 명사(issue) + [과거분사구] : \"~에 뿌리를 둔\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It signaled a shift, 그것은 전환을 나타냈다. away from viewing burnout, 번아웃을 보는 것에서 벗어나. as a personal failing, 개인적 실패로서. or a matter of individual resilience, 또는 개인의 회복 탄력성의 문제로서. toward understanding it, 그것을 이해하는 것으로 향하여. as a structural issue, 구조적 문제로서. rooted in organizational culture, leadership practices, and the broader socioeconomic context of work, 조직 문화, 지도부 관행, 그리고 더 넓은 노동의 사회 경제적 맥락에 뿌리를 둔. 이 문장 전체를 해석하면, 그것은 번아웃을 개인적 실패나 개인의 회복 탄력성의 문제로 보는 것에서 벗어나, 그것을 조직 문화, 지도부 관행, 그리고 더 넓은 노동의 사회 경제적 맥락에 뿌리를 둔 구조적 문제로 이해하는 것으로 향하는 전환을 나타냈다.","hl":"m"},{"n":25,"text":"이 문장은 번아웃에 대한 인식의 전환을 선명하게 보여줍니다. 예전에는 개인의 실패나 회복 탄력성 부족으로 봤지만 이제는 조직 문화와 리더십, 사회 경제적 맥락에 뿌리를 둔 구조적 문제로 이해해야 한다는 거죠. away from과 toward의 대비를 통해 변화의 방향을 확실히 잡아줍니다.","hl":"mn"},{"n":26,"text":"첫 번째, 문장 맨 앞 It은 앞 문장의 내용, 즉 WHO가 번아웃을 직업적 현상으로 인정한 것을 가리키는 대명사입니다. 두 번째, away from viewing burnout에서 away from은 ~에서 벗어나, toward understanding it에서 toward는 ~로 향하여라는 뜻인데, 이 둘이 대비되면서 관점의 전환을 나타냅니다. 전치사 뒤에는 동명사 viewing과 understanding이 왔어요. 세 번째, rooted in organizational culture는 과거분사구로 앞의 a structural issue를 뒤에서 수식합니다. issue가 뿌리를 내린 것이 아니라 뿌리를 둔 것이므로 수동의 의미를 가진 rooted가 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 재구성은 필수적이다\u003c/span>\u003cspan class=\"en\">This reframing is essential,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그것은 문을 연다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">opens \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">door\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시스템 차원의 개입과 정책 수준의 변화로 향하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">systemic \u003c/span>\u003cspan class=\"tgt\">interventions \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">policylevel \u003c/span>\u003cspan class=\"tgt\">changes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부담을 지우기보다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">placing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">burden \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오직 개인에게만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">solely \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">individuals\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대처하거나 적응하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">cope \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">adapt\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 재구성은 필수적인데, 왜냐하면 그것은 오직 개인에게만 대처하거나 적응하도록 부담을 지우기보다는 시스템 차원의 개입과 정책 수준의 변화로 향하는 문을 열어 주기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 번아웃의 재구성이 왜 \u003cb class=\"key\">필수\u003c/b>적인지 이유를 제시합니다. 시스템 차원의 개입과 정책 변화의 가능성을 열어주고, 개인에게만 부담을 지우는 기존 방식과 \u003cb class=\"key\">대비\u003c/b>시킵니다. opens the door to는 ~로 가는 길을 열어준다는 \u003cb class=\"key\">비유적 \u003c/b>\u003cb class=\"key\">표현\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 as\u003c/span> : as + 주어 + 동사 : \"왜냐하면 그것은 문을 연다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to + 명사구\u003c/span> : open the door to + 명사 : \"~로 향하는 문을 열어 준다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">rather than + 동명사\u003c/span> : rather than + V-ing : \"~하기보다는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법 (명사 수식)\u003c/span> : 명사 + [to부정사] : \"대처하거나 적응할 (부담)\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This reframing is essential, 이 재구성은 필수적이다. as it opens the door, 왜냐하면 그것은 문을 연다. to systemic interventions and policylevel changes, 시스템 차원의 개입과 정책 수준의 변화로 향하는. rather than placing the burden, 부담을 지우기보다는. solely on individuals, 오직 개인에게만. to cope or adapt, 대처하거나 적응하도록. 이 문장 전체를 해석하면, 이 재구성은 필수적인데, 왜냐하면 그것은 오직 개인에게만 대처하거나 적응하도록 부담을 지우기보다는 시스템 차원의 개입과 정책 수준의 변화로 향하는 문을 열어 주기 때문이다.","hl":"m"},{"n":28,"text":"이 문장은 번아웃의 재구성이 왜 필수적인지 이유를 설명합니다. 시스템 차원의 개입과 정책 변화를 가능하게 하고, 개인에게만 부담을 지우는 기존 방식과 대비됩니다. opens the door to는 어떤 가능성을 열어준다는 뜻의 비유적 표현이에요.","hl":"mn"},{"n":29,"text":"첫 번째, as it opens the door에서 as는 이유를 나타내는 접속사로, 이 재구성이 필수적인 이유를 설명합니다. 두 번째, opens the door to systemic interventions에서 to는 전치사로, 뒤에 명사구가 와서 어떤 것에 대한 문을 연다는 의미를 만듭니다. 세 번째, rather than placing the burden에서 rather than은 ~보다는이라는 뜻이고, 뒤에 동명사 placing이 왔습니다. 네 번째, to cope or adapt는 앞의 burden을 수식하는 to부정사의 형용사적 용법으로, 어떤 부담인지 그 내용을 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>2019년 WHO가 번아웃을 \u003cb class=\"key\">직업적 \u003c/b>\u003cb class=\"key\">현상\u003c/b>으로 인정한 것은 직장 정신 건강 담론에 중요한 전환점이었다.\u003c/li>\u003cli>이 지정은 번아웃을 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">실패\u003c/b>나 회복 탄력성 문제가 아니라 \u003cb class=\"key\">구조적 \u003c/b>\u003cb class=\"key\">문제\u003c/b>로 보도록 임상 평가와 조직 책임을 재구성한다.\u003c/li>\u003cli>그 결과 고용주는 개인 수준 해결책 대신 \u003cb class=\"key\">구조적 \u003c/b>\u003cb class=\"key\">개입\u003c/b>을 채택하고 임상의는 지도부와 협력해 근본 원인을 다루게 된다.\u003c/li>\u003cli>이러한 재구성은 개인에게만 부담을 지우지 않고 \u003cb class=\"key\">시스템 \u003c/b>\u003cb class=\"key\">차원의 \u003c/b>\u003cb class=\"key\">개입\u003c/b>과 \u003cb class=\"key\">정책 \u003c/b>\u003cb class=\"key\">수준의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>의 문을 여는 데 필수적이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The WHO's recognition of burnout as an occupational phenomenon reframes it from an individual failure to a structural issue, opening the door to systemic prevention.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">2019년 WHO가 번아웃을 \u003cb class=\"key\">직업적 \u003c/b>\u003cb class=\"key\">현상\u003c/b>으로 인정한 것은 번아웃을 개인적 실패나 회복 탄력성 문제가 아닌 조직 문화와 지도부 관행 등에 뿌리를 둔 \u003cb class=\"key\">구조적 \u003c/b>\u003cb class=\"key\">문제\u003c/b>로 보는 전환을 가져왔고, 이를 통해 \u003cb class=\"key\">시스템 \u003c/b>\u003cb class=\"key\">차원의 \u003c/b>\u003cb class=\"key\">개입\u003c/b>과 정책 수준의 변화 가능성을 열었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 지문의 핵심은 번아웃이 개인의 문제가 아니라 조직과 사회 구조의 문제라는 점입니다. WHO의 인정은 그 전환을 공식화했고, 이제 예방도 시스템 차원에서 접근해야 해요. 이 관점을 기억해 두면 비슷한 구조의 글이 나왔을 때 개인 대 구조의 대조를 빠르게 찾을 수 있을 거예요. 오늘 강의는 여기까지입니다.","hl":null}]}]});</script></body></html>
