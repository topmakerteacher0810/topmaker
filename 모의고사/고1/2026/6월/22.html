Ct/L8qX/P+f89eKaWUDOR37jt159u57d6XcOORz056+w79vT+tAX0v03Fo9v8AOB1/z70wuAASQfXkDp16Z6d6C6ggHGTjGcd+v6emR19KAH+//wCuk5Oe2QMH/wCtnr78dfajI9R37jt1/LvSbhkcrg9PX2/P049s0AL245x+p/lS/wCfp/n/AD3NMJB3fMOc4GcEFOG5z0Bxn69u5vAUEkH6Y/zx396P6/r/AIAD/wDP+fX/APVSY+mPTH+cc0hYc8jv1Pp1z9O/p3Hq7I9RSb2W19v8vn/Wtg/QTnJ/z6f55x7Zox/j/n+XsOOlGR6jv3Hbr+Xf0pAwJ6jBB7+h/wDr88emKYC5PHH69P8APf8ArR0/Hp78fz44zj04pCwAJyDz6+mAR+HejcOORyM5yP8A9f4nH60AOopgcHoQevQ5BAPPuSOemR70odTjkc57g9M9/wAPxo/r+v6sA6ijP0/P6f4/y9aKACkPQ9eB+P58/nRkHoQfxFIxwjEEcKT6jgd+vpg9aW606rRivrb1/T/M/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Breadth of Experience: The Key to Unlocking Creative Insights<small>폭넓은 경험: 창의적 통찰력을 깨우는 열쇠</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 흔히 말하는 &#39;아하! 순간&#39;은 창의적인 통찰이 갑자기 떠오르는 유레카 효과(Eureka effect)를 의미하는데, 이는 단순히 운이 좋은 것이 아니라 부화기(Incubation period)라고 불리는 무의식적인 처리 과정이 선행되어야 나타납니다. 어려운 문제에 오랫동안 몰입한 후 잠시 휴식을 취할 때, 우리 뇌는 수집된 정보들을 확산적 사고(Divergent thinking)를 통해 자유롭게 연결하며 새로운 정답을 찾아내게 됩니다. 이때 다양한 분야의 지식과 폭넓은 경험(Breadth of experience)은 창의성의 소중한 재료가 되어주며, 스티브 잡스가 강조한 &#39;점들을 연결하는 것(Connecting the dots)&#39;처럼 전혀 상관없어 보이는 정보들이 만나 혁신을 이뤄냅니다. 마치 다양한 식재료를 가진 요리사가 더욱 풍부하고 새로운 맛을 만들어낼 수 있는 것처럼, 관심사를 하나에만 국한하지 않고 호기심의 지평을 넓히는 태도가 창의적 문제 해결의 핵심 열쇠가 됩니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01해결을 위한 지속적 노력</div><ul><li>어려운 기술적 문제 해결을 위해 다년간 연구하며 관련 정보에 지속적으로 주의를 기울인다.</li><li>어려운 문제(challenging problem) 해결을 위한 장기적 몰입</li><li>문제와 관련된 주변 정보에 대한 세심한 주의(attention)</li><li>핵심 키워드: 기술적 문제(technological problem)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02예기치 못한 통찰의 순간</div><ul><li>긴장을 풀고 있을 때나 예상치 못한 순간에 창의적인 해결책이 갑자기 떠오른다.</li><li>편안한(relaxed) 상태에서 갑작스럽게 떠오르는 아이디어</li><li>발견과 발명으로 이어지는 통찰력, 즉 유레카 모먼트(eureka moments)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03자발적 창의성의 조건</div><ul><li>창의성을 높이기 위해서는 가치 있는 결과로 이어질 수 있는 대상들에 평소 주의를 기울여야 한다.</li><li>자발적 창의성(spontaneous creativity)을 향상시키는 방법</li><li>가치 있는 결과(valuable outcomes)를 유도할 수 있는 잠재적 요소 탐색</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04창의성의 핵심인 경험의 폭</div><ul><li>창의성은 특정 주제에만 관심을 국한하지 않는 넓은 경험의 토대 위에서 발휘된다.</li><li>관심을 특정 주제로만 좁히지(narrow down) 않는 태도</li><li>창의성의 열쇠는 경험의 폭(breadth of experience)에 있음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05제한된 시야의 위험성</div><ul><li>경험의 범위가 좁으면 상상력의 범위도 제한되어 결과적으로 창의성을 해치게 된다.</li><li>좁은 범위(narrow range)의 경험이 가져오는 한계</li><li>상상력의 범위(scope of imagination) 축소 및 창의성에 해로운(harmful) 영향</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">suppose</td><td class=\"m\">가정하다, 생각하다</td></tr><tr><td class=\"w\">solution</td><td class=\"m\">해결책, 해법</td></tr><tr><td class=\"w\">challenging</td><td class=\"m\">힘든, 어려운</td></tr><tr><td class=\"w\">attention</td><td class=\"m\">(pay attention to) ~에 주의를 기울이다</td></tr><tr><td class=\"w\">encounter</td><td class=\"m\">마주치다, 맞닥뜨리다</td></tr><tr><td class=\"w\">relate</td><td class=\"m\">(relate to) ~와 관련되다, 공감하다</td></tr><tr><td class=\"w\">relax</td><td class=\"m\">긴장을 풀다, 쉬다</td></tr><tr><td class=\"w\">insight</td><td class=\"m\">통찰(력)</td></tr><tr><td class=\"w\">lead</td><td class=\"m\">이끌다, ~에 이르다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">invention</td><td class=\"m\">발명(품)</td></tr><tr><td class=\"w\">pay attention</td><td class=\"m\">주의를 기울이다</td></tr><tr><td class=\"w\">enhance</td><td class=\"m\">높이다, 향상시키다</td></tr><tr><td class=\"w\">spontaneous</td><td class=\"m\">즉흥적인, 자발적인</td></tr><tr><td class=\"w\">creativity</td><td class=\"m\">창의력</td></tr><tr><td class=\"w\">therefore</td><td class=\"m\">그러므로</td></tr><tr><td class=\"w\">potentially</td><td class=\"m\">잠재적으로</td></tr><tr><td class=\"w\">outcome</td><td class=\"m\">결과, 성과</td></tr><tr><td class=\"w\">mean</td><td class=\"m\">의미하다, 뜻하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가정해 보라</span><span class=\"en\"><b>Suppose</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 연구해 왔다고</span><span class=\"en\"><b>you <span class=\"grammar-hl\">have been working</span> on</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해결책을</span><span class=\"en\"><b>the solution</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어려운 기술적 문제에 대한</span><span class=\"en\"><b>to a <span class=\"grammar-hl\">challenging</span> technological problem</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수년 동안.</span><span class=\"en\"><b>for many years.</b></span></div></div><div class=\"lec-sent-ko\">당신이 수년 간 어려운 기술 문제에 대한 해결책을 연구해 왔다고 가정해 보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 특정 상황을 가정하게 함으로써 글의 논의를 시작합니다. 창의적 해결책이 나오기 위한 첫 번째 전제 조건인 &#39;장기적인 노력&#39;과 &#39;문제에 대한 몰입&#39;을 설정하는 단계입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have been working (현재진행): have been + -ing 형태로 과거부터 현재까지 동작이 계속 이어져 오고 있음을 나타내는 현재완료진행형이다.</div><div class=\"lec-gr-item\">challenging (현재분사(형용사)): challenging이 뒤에 오는 명사 technological problem을 수식(= &#39;도전적인/어려운 기술적 문제&#39;)하며, 능동의 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">suppose</td><td class=\"m\">가정하다, 생각하다</td></tr><tr><td class=\"w\">solution</td><td class=\"m\">해결책, 해법</td></tr><tr><td class=\"w\">challenging</td><td class=\"m\">힘든, 어려운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또한 가정해 보자</span><span class=\"en\"><b>Let’s also suppose</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 주의를 기울여 왔다고</span><span class=\"en\"><b>that you have been <span class=\"grammar-hl\">paying attention to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 마주해 온 다른 모든 것에</span><span class=\"en\"><b>whatever else <span class=\"grammar-hl\">you have encountered</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관련이 있을지도 모르는</span><span class=\"en\"><b><span class=\"grammar-hl\">that might be related</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 문제와.</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> the problem.</b></span></div></div><div class=\"lec-sent-ko\">또한 그 문제와 관련이 있을지도 모르는, 당신이 마주해 온 다른 모든 것에도 주의를 기울여 왔고 가정해 보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;직접적인 노력&#39;에 더해, &#39;주변의 연관된 요소들에 대한 열린 태도&#39;라는 두 번째 조건을 추가합니다. 이는 나중에 언급될 &#39;경험의 폭&#39;이 창의성으로 연결되는 중요한 복선이 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">paying attention to (관용표현): &#39;~에 주의를 기울이다&#39;라는 의미의 숙어 pay attention to의 현재진행형(be + -ing) 구조이다.</div><div class=\"lec-gr-item\">you have encountered (관계대명사): whatever else와 you 사이에 목적격 관계대명사(that)가 생략되어 있으며, you have encountered 절이 선행사를 수식하는 구조이다.</div><div class=\"lec-gr-item\">that might be related to (관계대명사): 선행사 whatever else를 수식하며 절 내부에서 주어 역할을 하는 주격 관계대명사이다.</div><div class=\"lec-gr-item\">be related to (수동태): be동사(be)+p.p.(related) 구조. relate는 타동사인데 뒤에 목적어가 없어서 수동구조 be related 형태로 쓴다. 기본구조: relate A to B (A를 B와 관련시키다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">suppose</td><td class=\"m\">가정하다, 생각하다</td></tr><tr><td class=\"w\">attention</td><td class=\"m\">(pay attention to) ~에 주의를 기울이다</td></tr><tr><td class=\"w\">encounter</td><td class=\"m\">마주치다, 맞닥뜨리다</td></tr><tr><td class=\"w\">relate</td><td class=\"m\">(relate to) ~와 관련되다, 공감하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그런 경우,</span><span class=\"en\"><b>In that case,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능성이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">chances are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 문제에 대한 창의적인 해결책이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> creative solutions to the problem</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갑자기 떠오를</span><span class=\"en\"><b>could suddenly <span class=\"grammar-hl\">pop up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 마음속에</span><span class=\"en\"><b>in your mind</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 편안할 때.</span><span class=\"en\"><b>when you are <span class=\"grammar-hl\">relaxed</span>.</b></span></div></div><div class=\"lec-sent-ko\">그런 경우, 당신의 적절한 때, 아마도 그 문제에 대한 창의적인 해결책이 갑자기 떠오를 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 두 가지 전제(오랜 노력 + 주변에 대한 관심)가 충족되었을 때 나타나는 현상을 설명합니다. 흥미롭게도 해결책은 치열하게 고민하는 순간이 아니라, 오히려 &#39;휴식&#39;이라는 역설적인 상황에서 나타난다는 점을 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">chances are that (관용표현): &#39;아마 ~일 것이다, ~할 가능성이 크다&#39;라는 의미로 쓰이며, that은 보어절을 이끄는 접속사이다.</div><div class=\"lec-gr-item\">pop up (관용표현): &#39;불쑥 나타나다, 떠오르다&#39;라는 의미의 구동사(phrasal verb)이다.</div><div class=\"lec-gr-item\">relaxed (과거분사): 주어인 you의 상태를 설명하는 보어 역할을 하는 분사로, &#39;편안해진/긴장이 풀린&#39;이라는 수동/완료의 의미를 가진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">solution</td><td class=\"m\">해결책, 해법</td></tr><tr><td class=\"w\">relax</td><td class=\"m\">긴장을 풀다, 쉬다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러한 ‘유레카 순간’은</span><span class=\"en\"><b>Such “eureka moments”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(훌륭한 통찰력이</span><span class=\"en\"><b>(<span class=\"grammar-hl\">when great insights</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발견이나 발명으로 이어지는)</span><span class=\"en\"><b><span class=\"grammar-hl\">lead to discovery or invention</span>)</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 일어난다</span><span class=\"en\"><b>often <span class=\"grammar-hl\">take place</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예상치 못한 때에.</span><span class=\"en\"><b>at <span class=\"grammar-hl\">unexpected</span> times.</b></span></div></div><div class=\"lec-sent-ko\">그러한 ‘유레카 순간’(훌륭한 통찰력이 발견이나 발명으로 이어질 때)은 종종 예상치 못한 때 일어난다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 언급한 &#39;갑자기 떠오르는 해결책&#39;을 &#39;유레카의 순간&#39;이라는 용어로 정의합니다. 이러한 통찰은 인간이 통제할 수 있는 계획된 시간이 아니라 &#39;예상치 못한 때&#39;에 발생한다는 특성을 강조하며 논의를 확장합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when great insights lead to discovery or invention (관계부사): 선행사 eureka moments를 수식하며, 뒤에는 주어(great insights)와 동사(lead to)를 갖춘 완전한 형태의 절이 이어진다.</div><div class=\"lec-gr-item\">take place (관용표현): &#39;개최되다, 일어나다, 발생하다&#39;라는 의미의 숙어이다.</div><div class=\"lec-gr-item\">unexpected (과거분사(형용사)): unexpected가 뒤의 명사 times를 수식(= &#39;예기치 못한 시간&#39;)하며, 수동의 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">insight</td><td class=\"m\">통찰(력)</td></tr><tr><td class=\"w\">lead</td><td class=\"m\">이끌다, ~에 이르다</td></tr><tr><td class=\"w\">invention</td><td class=\"m\">발명(품)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자연 발생적인 창의성을 키우기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">To enhance</span> spontaneous creativity,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">따라서,</span><span class=\"en\"><b>therefore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주의를 기울여야 한다</span><span class=\"en\"><b>one must <span class=\"grammar-hl\">pay attention to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">것들에</span><span class=\"en\"><b>the things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잠재적으로 이어질 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that could potentially lead</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가치 있는 결과로.</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> valuable outcomes.</b></span></div></div><div class=\"lec-sent-ko\">따라서, 자연 발생적인 창의성을 키우려면, 잠재적으로 가치 있는 결과로 이어질 수 있는 것들에 주의를 기울여야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 현상을 바탕으로 내린 첫 번째 결론입니다. 창의성이 예고 없이 찾아오기 때문에, 우리는 평소에 주변의 다양한 단서들이 가치 있는 결과(해결책)로 이어질 수 있도록 늘 깨어있는 주의력을 유지해야 한다는 제언입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To enhance (to부정사): 부사적 용법 중 &#39;목적&#39;에 해당하며 &#39;~하기 위해서&#39;라고 해석한다.</div><div class=\"lec-gr-item\">pay attention to (관용표현): &#39;~에 주의를 기울이다&#39;라는 의미의 숙어로, must(조동사) 뒤에서 동사원형으로 쓰였다.</div><div class=\"lec-gr-item\">that could potentially lead to (관계대명사): 선행사 the things를 수식하며 관계대명사절 내에서 주어 역할을 하는 주격 관계대명사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">attention</td><td class=\"m\">(pay attention to) ~에 주의를 기울이다</td></tr><tr><td class=\"w\">lead</td><td class=\"m\">이끌다, ~에 이르다</td></tr><tr><td class=\"w\">pay attention</td><td class=\"m\">주의를 기울이다</td></tr><tr><td class=\"w\">enhance</td><td class=\"m\">높이다, 향상시키다</td></tr><tr><td class=\"w\">spontaneous</td><td class=\"m\">즉흥적인, 자발적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">creativity</td><td class=\"m\">창의력</td></tr><tr><td class=\"w\">therefore</td><td class=\"m\">그러므로</td></tr><tr><td class=\"w\">potentially</td><td class=\"m\">잠재적으로</td></tr><tr><td class=\"w\">outcome</td><td class=\"m\">결과, 성과</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이는 의미하지 않는다</span><span class=\"en\"><b>This does not mean</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 국한해야 한다는 것을</span><span class=\"en\"><b>that you must <span class=\"grammar-hl\">narrow down</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 관심을</span><span class=\"en\"><b>your interest</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 가지 특정 주제로.</span><span class=\"en\"><b>to one specific topic.</b></span></div></div><div class=\"lec-sent-ko\">이는 당신의 관심을 특정 주제에 국한해야 한다는 것을 의미하지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자들이 가질 수 있는 오해, 즉 &#39;문제를 해결하려면 그 문제에만 집중해야 한다&#39;는 고정관념을 부정합니다. 다음 문장에서 제시할 &#39;다양성&#39;의 가치를 부각하기 위한 전환점 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">narrow down (관용표현): &#39;(범위 등을) 좁히다/줄이다&#39;라는 의미의 구동사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mean</td><td class=\"m\">의미하다, 뜻하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">반대로,</span><span class=\"en\"><b><span class=\"grammar-hl\">On the contrary</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경험의 폭이</span><span class=\"en\"><b>breadth of experience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">핵심이다</span><span class=\"en\"><b>is <span class=\"grammar-hl\">the key</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">창의성의.</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> creativity.</b></span></div></div><div class=\"lec-sent-ko\">반대로, 경험의 폭이 창의성의 핵심이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 6번 문장과 대비되는 이 글의 핵심 주장(Main Idea)입니다. 창의성은 좁고 깊은 파고들기보다, 얼마나 넓고 다양한 경험을 보유하고 있느냐에 달려 있다는 점을 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">On the contrary (관용표현): &#39;그와는 반대로&#39;라는 의미로 앞 문장과 상반되는 내용을 이끄는 연결어구이다.</div><div class=\"lec-gr-item\">the key to (관용표현): &#39;~의 핵심/비결&#39;이라는 의미로, 여기서 to는 전치사로 쓰여 뒤에 명사(creativity)가 위치한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">creativity</td><td class=\"m\">창의력</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신의 경험이</span><span class=\"en\"><b>If your experience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">국한된다면</span><span class=\"en\"><b><span class=\"grammar-hl\">is limited</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좁은 범위의 주제로,</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> a narrow range of topics,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면 상상력의 범위는</span><span class=\"en\"><b>then the scope of your imagination</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마찬가지로 좁아질 것이다,</span><span class=\"en\"><b>will likewise be narrow,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 해로울 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">which would be harmful</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">창의성에.</span><span class=\"en\"><b><span class=\"grammar-hl\">to creativity</span>.</b></span></div></div><div class=\"lec-sent-ko\">경험이 좁은 범위의 주제로 국한된다면, 상상력의 범위가 마찬가지로 좁아질 것이고, 이는 창의성에 해로울 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장은 7번 문장의 주장을 &#39;반대 상황(부정적 결과)&#39;을 가정하여 재확증합니다. 경험의 폭이 좁으면 상상력도 제한되고, 결과적으로 창의성이 저해된다는 인과관계를 통해 넓은 경험의 중요성을 다시 한번 강조하며 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is limited to (수동태): be동사(is)+p.p.(limited) 구조. limit는 타동사인데 뒤에 목적어가 없어서 수동구조 is limited 형태로 쓴다. 기본구조: limit + O + to B (O를 B로 제한하다)</div><div class=\"lec-gr-item\">which would be harmful to creativity (관계대명사): 콤마(,) 뒤에 쓰여 앞 문장의 내용 전체를 선행사로 받는 계속적 용법의 관계대명사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">creativity</td><td class=\"m\">창의력</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>창의적 해결책은 오랜 노력과 주변 요소에 대한 관심이 결합될 때 나타난다.</li><li>소위 &#39;유레카의 순간&#39;은 예기치 못한 휴식의 순간에 갑자기 찾아오는 특징이 있다.</li><li>창의성을 높이기 위해 관심을 특정 주제로만 좁히는 것은 오히려 독이 된다.</li><li>다양한 경험의 폭이 상상력의 크기를 결정하며, 이것이 곧 창의성을 만드는 핵심 열쇠다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Creative insights tend to emerge during relaxed moments, provided that an individual maintains a wide range of experiences to broaden their imaginative scope.</div>\n              <div class=\"lec-final-sum-ko\">개인이 상상력의 범위를 넓히기 위해 폭넓은 경험을 유지한다면, 창의적인 통찰은 편안한 순간에 나타나는 경향이 있다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/8.mp3","hl":"stage-4"}],[{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/9.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/10.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/11.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/12.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/13.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/14.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/15.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/16.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/17.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/18.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/19.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/20.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/21.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/22.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/23.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/24.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/25.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_22번_강의_audio/26
