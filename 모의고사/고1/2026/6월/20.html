DUOvTP07Dnt+nuTS7cdx0z+Bzzjr0HPpnnvTdwAJBGNpPUcgf4kYH5ZpfyH6jt9eemQP5Ua/18v0t+Avnvqn5af56b/oHf1Gev19yB+ZFIfbmkDAkYI79xxt6nj0xyQP504dRnJ9u/07dfb1oDR/18/wBEJ+H+f/r54P8A9alHJHX09fp+XpQSOu4du469uPTHQY4xgjij/P4/p/8AWB70f0/L+tPvC6089V+H+aE6Ht3/AM//AF6X6dvz78/hijKk5/h7n27njj8B9Big9Tzn3xjP4UAt/VJv+unp93UPQc9fx56YHf8AL8eRhKdnI65GQM8AEZ4xyO+fpgDjmkJPcnPT9Onb6H8fxAve3ntd2en5/r6MP8/T6GmsMqwHPHHbP6HqO355pcggHIHX/H6+xOTjvjupHVcZJBHX2H69Qevtmmmk03ok1e+nX8Aur2/rS3+aP//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Parents as Coaches: Guiding Children to Develop Right Values<small>코치로서의 부모: 자녀가 올바른 가치관을 형성하도록 이끌기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 깊이 있게 이해하려면 외부의 가치관이 자신의 것으로 자리 잡는 내면화(Internalization) 과정을 이해하는 것이 좋습니다. 이는 아이들이 부모나 교사 같은 모델을 관찰하고 모방하며 성장한다는 알버트 반두라의 사회 학습 이론(Social Learning Theory)과 맥을 같이하는데, 부모의 코칭은 아이가 스스로 설 수 있도록 돕는 일시적인 조력인 비계 설정(Scaffolding)의 역할을 합니다. 마치 자전거를 처음 배울 때 뒤에서 잡아주는 손길처럼, 부모가 칭찬과 격려라는 정적 강화(Positive Reinforcement)를 제공하면 아이는 올바른 가치관을 본능적인 습관으로 만들게 됩니다. 만약 이 과정에서 부모라는 올바른 코칭 시스템이 작동하지 않는다면, 아이들은 대중매체나 또래 집단 같은 외부의 준거 집단(Reference Group)이 제시하는 가치관에 무분별하게 노출될 위험이 크다는 점을 기억해야 합니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01기술 습득의 원리</div><ul><li>운전이나 요리처럼 반복적인 연습과 지도를 통해 기술은 숙달된다.</li><li>타인의 코칭(coached)을 받으며 연습하는 과정</li><li>스스로를 지도할 수 있을 때까지 반복함</li><li>최종적으로 행동이 자동적(automatically)으로 이루어짐</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02가치관 학습의 과정</div><ul><li>아이들이 가치관을 배우는 방식도 기술 습득 과정과 매우 유사하다.</li><li>다양한 종류의 행동(behavior)을 직접 연습함</li><li>중요한 기술을 정교화(fine-tuning)하는 과정이 필요함</li><li>핵심 키워드: 가치관(values)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03조력자로서의 부모</div><ul><li>부모는 아이가 올바른 가치에 집중할 수 있도록 돕는 코치 역할을 한다.</li><li>아이의 주의(attention)를 중요한 것에 집중시킴</li><li>칭찬(praise)과 격려(encouragement)로 아이를 지원함</li><li>부드러운 조언(gentle reminders)을 통해 올바른 길로 안내함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04지도 부재 시의 위험</div><ul><li>부모의 적절한 코칭이 없으면 아이는 외부의 가치관에 휘둘리게 된다.</li><li>미디어(media)나 또래(peers)에게서 코치를 찾게 됨</li><li>무분별한 외부의 가치관에 의해 인도(guided)됨</li><li>핵심 키워드: 외부의 영향(anyone else)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05부모의 적극적 태도</div><ul><li>아이가 좋은 사람으로 성장할 수 있도록 부모가 직접 나서서 지도해야 한다.</li><li>두려워하지 말고 책임감 있게 행동하기(step up to the plate)</li><li>아이가 좋은 사람(good person)이 되도록 단계별로 도움</li><li>부모가 직접 아이의 가치관 형성의 주도권을 잡음</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drive</td><td class=\"m\">운전하다</td></tr><tr><td class=\"w\">practice</td><td class=\"m\">연습</td></tr><tr><td class=\"w\">remind</td><td class=\"m\">상기시키다, 일깨우다</td></tr><tr><td class=\"w\">eventually</td><td class=\"m\">결국, 마침내</td></tr><tr><td class=\"w\">automatically</td><td class=\"m\">자동으로</td></tr><tr><td class=\"w\">value</td><td class=\"m\">가치 있게 여기다, 소중히 하다</td></tr><tr><td class=\"w\">focus</td><td class=\"m\">(focus on) ~에 집중하다</td></tr><tr><td class=\"w\">attention</td><td class=\"m\">주의, 주목</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fine</td><td class=\"m\">훌륭한, 좋은</td></tr><tr><td class=\"w\">tune</td><td class=\"m\">조율하다</td></tr><tr><td class=\"w\">support</td><td class=\"m\">지지하다, 뒷받침하다</td></tr><tr><td class=\"w\">praise</td><td class=\"m\">칭찬(하다)</td></tr><tr><td class=\"w\">reminder</td><td class=\"m\">상기시키는 것, 알림</td></tr><tr><td class=\"w\">peer</td><td class=\"m\">또래, 동료</td></tr><tr><td class=\"w\">capture</td><td class=\"m\">담아내다, 포착하다</td></tr><tr><td class=\"w\">plate</td><td class=\"m\">접시</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기억하는가</span><span class=\"en\"><b>Remember</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 배웠는지</span><span class=\"en\"><b><span class=\"grammar-hl\">how you learned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">운전이나 요리하는 것을?</span><span class=\"en\"><b><span class=\"grammar-hl\">to drive or cook</span>?</b></span></div></div><div class=\"lec-sent-ko\">운전이나 요리를 어떻게 배웠는지 기억하는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자가 과거에 무언가를 처음 배웠던 개인적인 경험을 환기하며, 글의 핵심 주제인 &#39;학습과 코칭&#39;에 대한 비유를 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how you learned to drive or cook (간접의문문): 의문사(how) + 주어(you) + 동사(learned)의 어순으로 이루어져 있으며, 동사 Remember의 목적어 역할을 하는 명사절이다.</div><div class=\"lec-gr-item\">to drive or cook (to부정사): 타동사 learn의 목적어 역할을 하는 명사적 용법으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">drive</td><td class=\"m\">운전하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 연습했다</span><span class=\"en\"><b>You practiced</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누군가 당신을 지도하는 동안</span><span class=\"en\"><b>while someone coached you,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇을 해야 할지 상기시켜 주며</span><span class=\"en\"><b><span class=\"grammar-hl\">reminding you what to do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 할 수 있을 때까지</span><span class=\"en\"><b>until you were able</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신 자신을 지도하고</span><span class=\"en\"><b><span class=\"grammar-hl\">to coach yourself</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서, 결국에는</span><span class=\"en\"><b>and then, eventually,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 자동으로 할 때까지.</span><span class=\"en\"><b>do it automatically.</b></span></div></div><div class=\"lec-sent-ko\">당신이 자신을 지도할 수 있고 그리고 나서, 결국에는, 그것(운전이나 요리)을 자동으로 할 수 있을 때까지 누군가 당신에게 무엇을 해야 할지 상기시켜 주면서 지도하는 동안 당신은 연습했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기술 습득의 과정을 &#39;타인의 지도 -&gt; 자기 지도 -&gt; 자동화(습관화)&#39;라는 3단계로 분석하여, 코칭이 숙련에 이르는 필수적인 과정임을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reminding you what to do (분사구문): 현재분사 reminding이 부사적 기능을 수행하며, 앞선 상황에 대한 부수적인 동작이나 보충 설명을 나타낸다. 원래 절: as someone reminded you what to do</div><div class=\"lec-gr-item\">what to do (관용표현): &#39;의문사 + to부정사&#39; 구조로 &#39;무엇을 해야 할지&#39;라는 의미를 나타내며, 동사 remind의 직접목적어 역할을 한다.</div><div class=\"lec-gr-item\">to coach yourself (to부정사): 형용사 able을 수식하는 부사적 용법으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">practice</td><td class=\"m\">연습</td></tr><tr><td class=\"w\">remind</td><td class=\"m\">상기시키다, 일깨우다</td></tr><tr><td class=\"w\">eventually</td><td class=\"m\">결국, 마침내</td></tr><tr><td class=\"w\">automatically</td><td class=\"m\">자동으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아이들은 가치를 배운다</span><span class=\"en\"><b><span class=\"grammar-hl\">Children learn values</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 같은 방식으로.</span><span class=\"en\"><b>much the same way.</b></span></div></div><div class=\"lec-sent-ko\">아이들도 가치를 거의 같은 방식으로 배운다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 운전/요리라는 구체적인 &#39;기술&#39;의 학습 원리를 아이들의 &#39;가치관 형성&#39;이라는 추상적인 영역으로 확장하며 논리를 전개합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Children learn values 3형식(SVO) 구조: 주어(Children) + 동사(learn) + 목적어(values)로 이루어진 가장 기본적인 문장 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">value</td><td class=\"m\">가치 있게 여기다, 소중히 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아이들은 연습한다</span><span class=\"en\"><b>They practice</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 종류의 행동을</span><span class=\"en\"><b>different kinds of behavior,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지도자로서 당신이</span><span class=\"en\"><b>while you, as coach,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 주의를 집중하도록 돕는 동안</span><span class=\"en\"><b><span class=\"grammar-hl\">help focus</span> their attention</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요한 것에</span><span class=\"en\"><b>on <span class=\"grammar-hl\">what is important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 세밀하게 다듬는 것에</span><span class=\"en\"><b>and on <span class=\"grammar-hl\">fine-tuning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요한 기술들을.</span><span class=\"en\"><b>important skills.</b></span></div></div><div class=\"lec-sent-ko\">당신이, 지도자로서, 중요한 것에 그리고 중요한 기술을 세밀하게 다듬는 것에 아이들이 주의를 집중하도록 도와주는 동안, 아이들은 다양한 종류의 행동을 연습한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가치관 교육에서 아이는 &#39;행동의 실천자&#39;이고 부모는 &#39;방향 설정 및 세부 조정자&#39;라는 구체적인 역할 분담을 제시하며 앞 문장의 원리를 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">help focus 5형식(SVOC) 구조 변형: 동사 help는 목적어 뒤에 목적격 보어로 동사원형이나 to부정사를 취할 수 있는데, 여기서는 help (them) (to) focus 구조에서 목적어와 to가 생략된 형태로 볼 수 있다.</div><div class=\"lec-gr-item\">what is important (관계대명사): 선행사를 포함하는 관계대명사 what이 이끄는 명사절로, 전치사 on의 목적어 역할을 한다. 절 내부에서 what은 주어 역할을 한다.</div><div class=\"lec-gr-item\">fine-tuning (동명사): 전치사 on의 목적어로 쓰였으며, &#39;정교하게 조정하는 것&#39;이라는 행위와 용도를 나타내는 명사적 개념이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">practice</td><td class=\"m\">연습</td></tr><tr><td class=\"w\">focus</td><td class=\"m\">(focus on) ~에 집중하다</td></tr><tr><td class=\"w\">attention</td><td class=\"m\">주의, 주목</td></tr><tr><td class=\"w\">fine</td><td class=\"m\">훌륭한, 좋은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 그들을 지지한다</span><span class=\"en\"><b>You <span class=\"grammar-hl\">support them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 칭찬과</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> your praise,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">격려</span><span class=\"en\"><b>encouragement</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 상당한 조언으로.</span><span class=\"en\"><b>and gentle reminders.</b></span></div></div><div class=\"lec-sent-ko\">당신은 칭찬, 격려 그리고 상당한 조언으로 그들을 지지한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 코칭의 구체적인 방법론으로 정서적 지지(칭찬, 격려)와 지속적인 가이드(부드러운 상기)를 언급하며 부모의 긍정적인 태도를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">support them with (관용표현): &#39;support A with B&#39; 구조로 &#39;A를 B를 가지고 지지하다/뒷받침하다&#39;라는 의미를 전달한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">remind</td><td class=\"m\">상기시키다, 일깨우다</td></tr><tr><td class=\"w\">support</td><td class=\"m\">지지하다, 뒷받침하다</td></tr><tr><td class=\"w\">praise</td><td class=\"m\">칭찬(하다)</td></tr><tr><td class=\"w\">reminder</td><td class=\"m\">상기시키는 것, 알림</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 지도하지 않는다면</span><span class=\"en\"><b>If you don’t coach</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 자녀를</span><span class=\"en\"><b>your child,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 아이는 찾을 것이다</span><span class=\"en\"><b>she will find</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 지도자를 다른 곳에서</span><span class=\"en\"><b>her coaches elsewhere</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 지배될 것이다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">be guided</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미디어의 가치에</span><span class=\"en\"><b>by the values of the media,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또래 친구들</span><span class=\"en\"><b>her peers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 다른 누군가에 의해</span><span class=\"en\"><b>and anyone else</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 관심을 끄는.</span><span class=\"en\"><b><span class=\"grammar-hl\">who captures her interest</span>.</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 당신의 자녀를 지도하지 않는다면, 그(자녀)는 다른 곳에서 자신의 지도자를 찾고 더더어, 또래 친구들 그리고 자신의 관심을 끄는 다른 누군가의 가치에 지배될 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 부모가 코치 역할을 수행하지 않을 때 발생할 &#39;부정적인 대안(무분별한 외부 영향)&#39;을 제시하여, 부모 코칭의 시급성과 중요성을 역설적으로 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">be guided (수동태): be동사(be)+p.p.(guided) 구조. guide는 타동사인데 뒤에 목적어가 없어서 수동구조 be guided 형태로 쓴다. 기본구조: guide + O(목적어)</div><div class=\"lec-gr-item\">who captures her interest (관계대명사): 선행사 anyone else를 수식하는 주격 관계대명사절을 이끈다. 절 내부에서 who가 주어 역할을 수행한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">value</td><td class=\"m\">가치 있게 여기다, 소중히 하다</td></tr><tr><td class=\"w\">peer</td><td class=\"m\">또래, 동료</td></tr><tr><td class=\"w\">capture</td><td class=\"m\">담아내다, 포착하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러므로 행동에 나서서</span><span class=\"en\"><b>So, <span class=\"grammar-hl\">step up to the plate</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두려워하지 말고</span><span class=\"en\"><b>don’t be afraid</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자녀가 배우도록 도와주어라</span><span class=\"en\"><b>and <span class=\"grammar-hl\">help your child learn</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 사람이 되는 법을</span><span class=\"en\"><b><span class=\"grammar-hl\">how to be a good person</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">차근차근.</span><span class=\"en\"><b>step by step.</b></span></div></div><div class=\"lec-sent-ko\">그러므로, 판에 올라서서(행동에 나서서), 두려워하지 말고 자녀가 좋은 사람이 되는 법을 배우도록 차근차근 도와 주어라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 논리들을 종합하여 부모가 주저하지 말고 아이의 인성 교육에 주도적으로 나설 것을 촉구하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">step up to the plate (관용표현): &#39;제 자리에 서다&#39;, &#39;책임을 지고 행동에 나서다&#39;라는 의미를 가진 이디엄이다.</div><div class=\"lec-gr-item\">help your child learn 5형식(SVOC) 구조: 동사 help + 목적어(your child) + 목적격 보어(learn)로 이루어져 있다. 준사역동사 help의 목적격 보어로 동사원형 learn이 쓰였다.</div><div class=\"lec-gr-item\">how to be a good person (관용표현): &#39;의문사 + to부정사&#39; 구조로 &#39;어떻게 좋은 사람이 되는지&#39; 또는 &#39;좋은 사람이 되는 법&#39;이라는 의미를 나타내는 명사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">plate</td><td class=\"m\">접시</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>기술(운전, 요리)을 배울 때 코칭을 통해 자동화 단계에 이르듯, 아이의 가치관 형성도 같은 과정이 필요하다.</li><li>부모는 코치로서 아이가 올바른 행동에 집중하고 미세한 기술을 다듬을 수 있도록 칭찬과 격려로 지지해야 한다.</li><li>만약 부모가 코칭하지 않으면 아이는 미디어나 또래 등 검증되지 않은 외부의 가치관에 쉽게 휩쓸리게 된다.</li><li>따라서 부모는 책임감을 느끼고 아이가 좋은 사람이 될 수 있도록 단계별로 인내심 있게 가르쳐야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Parents should consistently coach their children&#39;s behavior through guidance and encouragement so that they can internalize positive values without being misled by external influences.</div>\n              <div class=\"lec-final-sum-ko\">부모는 외부 영향에 의해 자녀가 잘못 인도되지 않도록 지도와 격려를 통해 자녀의 행동을 지속적으로 코칭해야 한다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_06월_20번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_20번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_20번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_06월_20번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_06월_20번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_06월_20번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_06월_20번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2026년_06월_20번_강의_audio/8.mp3","hl":"stage-4"}],[{"audio":"./모의고사_고1_2026년_06월_20번_강의_audio/9.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_20번_강의_audio/10.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_20번_강의_audio/11.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_20번_강의_audio/12.mp3","hl":"grammar"}],
