li><li>대상이 위험하다고 평가(assessed)될 때 발생하는 공포 반응</li><li>생존 본능인 투쟁 혹은 도피(fight or flight) 반응의 가동</li><li>사고를 시작하기 전에 이미 내부적인 행동(action)이 시작됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03감정적 결정과 사후 정당화</div><ul><li>인간의 결정은 주로 감정적으로 이루어지며, 이성은 이를 뒷받침하는 도구로 사용된다.</li><li>대부분의 결정은 논리적이기보다 정서적으로(emotionally) 내려짐</li><li>결정을 내린 후 이를 정당화(justify)하기 위한 사실과 근거를 수집함</li><li>스스로의 결정이 합리적(rational)이라고 믿으려는 경향성 고착</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">appropriate</td><td class=\"m\">적절한, 알맞은</td></tr><tr><td class=\"w\">psychologist</td><td class=\"m\">심리학자</td></tr><tr><td class=\"w\">suggest</td><td class=\"m\">제안하다</td></tr><tr><td class=\"w\">determine</td><td class=\"m\">결정하다, 좌우하다</td></tr><tr><td class=\"w\">conscious</td><td class=\"m\">의식하는, 자각하는</td></tr><tr><td class=\"w\">determination</td><td class=\"m\">결심, 투지</td></tr><tr><td class=\"w\">object</td><td class=\"m\">물체, 대상</td></tr><tr><td class=\"w\">assess</td><td class=\"m\">평가하다, 가늠하다</td></tr><tr><td class=\"w\">response</td><td class=\"m\">반응, 응답</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flight</td><td class=\"m\">항공편, 비행</td></tr><tr><td class=\"w\">occur</td><td class=\"m\">일어나다, 발생하다</td></tr><tr><td class=\"w\">level</td><td class=\"m\">수준, 정도</td></tr><tr><td class=\"w\">correct</td><td class=\"m\">바로잡다, 정정하다</td></tr><tr><td class=\"w\">notice</td><td class=\"m\">알아차리다, 주목하다</td></tr><tr><td class=\"w\">simply</td><td class=\"m\">단순히, 그저</td></tr><tr><td class=\"w\">generate</td><td class=\"m\">만들어 내다, 발생시키다</td></tr><tr><td class=\"w\">accurate</td><td class=\"m\">정확한</td></tr><tr><td class=\"w\">in reality</td><td class=\"m\">실제로는, 현실에서는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 나간다</span><span class=\"en\"><b>We go out</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일 세상 속으로</span><span class=\"en\"><b>in the world every day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 결정을 내린다</span><span class=\"en\"><b>and make decisions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇이 안전한지 아닌지에 대해</span><span class=\"en\"><b>about <span class=\"grammar-hl\">what is safe or not</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 무엇이 적절한지 아닌지에 대해.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">what is appropriate or not</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 매일 세상으로 나가 무엇이 안전한지 아닌지 그리고 무엇이 적절한지 아닌지에 대한 결정을 내린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로, 우리가 일상적으로 수행하는 생존과 사회적 상호작용을 위한 기본적인 판단 과정을 설명합니다. 이러한 판단이 우리 삶의 필수적인 부분임을 제시하며 독자의 공감을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what is safe or not (간접의문문): 의문사 what이 이끄는 명사절이 전치사 about의 목적어로 쓰였으며, 「의문사 + 동사」의 어순을 취하고 있다.</div><div class=\"lec-gr-item\">what is appropriate or not (간접의문문): 의문사 what이 이끄는 명사절이 앞의 what절과 병렬 구조를 이루며 전치사 about의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">appropriate</td><td class=\"m\">적절한, 알맞은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~이다</span><span class=\"en\"><b><span class=\"grammar-hl\">It is what</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심리학자 Joseph LeDoux가 제안한 것</span><span class=\"en\"><b><span class=\"grammar-hl\">psychologist Joseph LeDoux has suggested</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무의식적인 ‘위험 감지기’라고</span><span class=\"en\"><b><span class=\"grammar-hl\">is an unconscious “danger detector”</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결정하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that determines</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인지 아닌지를</span><span class=\"en\"><b><span class=\"grammar-hl\">whether or not</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 것이나 누군가가 안전한지</span><span class=\"en\"><b><span class=\"grammar-hl\">something or someone is safe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 심지어 시작하기도 전에</span><span class=\"en\"><b>before we can even begin</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의식적으로 판단을 내리기를.</span><span class=\"en\"><b><span class=\"grammar-hl\">to consciously make</span> a determination.</b></span></div></div><div class=\"lec-sent-ko\">우리가 의식적으로 판단하기를 시작하기도 전에 어떤 것이나 사람이 안전한지 아닌지를 판단하는 것은 바로 심리학자 Joseph LeDoux가 제안한 무의식적인 ‘위험 감지기’라는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;판단&#39;의 정체가 사실은 &#39;무의식적 시스템&#39;임을 밝힙니다. 전문가의 견해를 빌려, 우리의 안전 판단이 의식적인 사고보다 훨씬 빠르게 작동하는 본능적 영역임을 강조하며 논리적 근거를 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is what psychologist Joseph LeDoux has suggested is an unconscious “danger detector” that determines (강조구문): It is ~ that 강조구문 구조로, what절 전체를 강조하고 있다. 강조된 요소가 원래 문장의 주어였으므로 that 뒤에는 동사 determines가 바로 이어진다.</div><div class=\"lec-gr-item\">what psychologist Joseph LeDoux has suggested is an unconscious “danger detector” (관계대명사): 선행사를 포함한 관계대명사 what이 이끄는 명사절이다. 해당 절 내부에서 ‘psychologist Joseph LeDoux has suggested’는 삽입된 절이며, what은 동사 is의 주어 역할을 수행한다.</div><div class=\"lec-gr-item\">whether or not something or someone is safe (간접의문문): 접속사 whether가 이끄는 명사절이 determine의 목적어 역할을 하며, 「whether + 주어 + 동사」의 어순을 이룬다.</div><div class=\"lec-gr-item\">to consciously make (to부정사): 타동사 begin의 목적어로 쓰인 명사적 용법의 to부정사다. 부정사를 수식하는 부사 consciously가 to와 동사원형 사이에 위치한 형태다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">psychologist</td><td class=\"m\">심리학자</td></tr><tr><td class=\"w\">suggest</td><td class=\"m\">제안하다</td></tr><tr><td class=\"w\">determine</td><td class=\"m\">결정하다, 좌우하다</td></tr><tr><td class=\"w\">conscious</td><td class=\"m\">의식하는, 자각하는</td></tr><tr><td class=\"w\">determination</td><td class=\"m\">결심, 투지</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사물, 동물, 또는 사람이</span><span class=\"en\"><b>When the object, animal, or person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위험하다고 평가될 때</span><span class=\"en\"><b><span class=\"grammar-hl\">is assessed to be dangerous</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공포 반응이</span><span class=\"en\"><b>a fear response,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&#39;싸움 또는 도피&#39;라고 불려 온</span><span class=\"en\"><b><span class=\"grammar-hl\">which has been called “fight or flight,”</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발생한다.</span><span class=\"en\"><b>occurs.</b></span></div></div><div class=\"lec-sent-ko\">사물, 동물, 또는 사람이 위험하다고 평가될 때, 공포 반응이 발생하는데, 그것은 ‘싸움 또는 도피’라고 불려 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 무의식적인 &#39;위험 탐지기&#39;가 위험 신호를 감지했을 때 나타나는 구체적인 생물학적 반응(투쟁-도피 반응)을 설명합니다. 이는 앞 문장의 &#39;위험 탐지&#39;가 실제 행동으로 연결되는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is assessed to be dangerous (수동태): be동사(is)+p.p.(assessed) 구조. assess는 타동사인데 목적어가 없어서 수동구조 is assessed 형태로 쓴다. assess+O+toV(5형식) 구조에서 목적어(O)가 주어로 올라가고 목적격 보어(C)인 to be가 남은 형태다. 기본구조: V + O + C</div><div class=\"lec-gr-item\">to be dangerous (to부정사): 5형식 동사 assess의 수동태 구조 뒤에 남은 목적격 보어(C)로, 주어인 the object, animal, or person의 상태를 설명한다.</div><div class=\"lec-gr-item\">which has been called “fight or flight,” (관계대명사): 계속적 용법의 주격 관계대명사 which가 선행사 a fear response에 대해 부연 설명을 제공하며, 관계사절 내부에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">has been called “fight or flight,” (수동태): be동사(has been)+p.p.(called) 구조. call은 타동사인데 목적어가 없어서 수동구조 has been called 형태로 쓴다. call+O+C(5형식) 구조에서 목적어(O)가 주어로 올라가고 목적격 보어(C)인 “fight or flight”가 남은 형태다. 기본구조: V + O + C</div><div class=\"lec-gr-item\">fight or flight (관용표현): ‘싸움-도주 반응’이라는 심리학적 용어로, 위협 상황에서 생존을 위해 맞서 싸우거나 도망치려는 본능적인 반응을 의미한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">object</td><td class=\"m\">물체, 대상</td></tr><tr><td class=\"w\">assess</td><td class=\"m\">평가하다, 가늠하다</td></tr><tr><td class=\"w\">response</td><td class=\"m\">반응, 응답</td></tr><tr><td class=\"w\">flight</td><td class=\"m\">항공편, 비행</td></tr><tr><td class=\"w\">occur</td><td class=\"m\">일어나다, 발생하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">의식적 수준에서는</span><span class=\"en\"><b>On a conscious level</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 오류를 수정할지도 모른다</span><span class=\"en\"><b>we may correct a mistake</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 &#39;위험 감지기&#39;에서의</span><span class=\"en\"><b>in this “danger detector”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 그것을 발견했을 때</span><span class=\"en\"><b>when we notice it,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 종종, 당연히</span><span class=\"en\"><b>but often, of course,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 그저 이유를 만들어내기 시작한다</span><span class=\"en\"><b>we simply begin <span class=\"grammar-hl\">to generate</span> reasons</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 왜 정확했는지에 대한</span><span class=\"en\"><b>for <span class=\"grammar-hl\">why it was accurate</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">애초에.</span><span class=\"en\"><b><span class=\"grammar-hl\">in the first place</span>.</b></span></div></div><div class=\"lec-sent-ko\">의식적 수준에서는 우리가 이 ‘위험 감지기’의 오류를 발견했을 때 그것을 수정할 수 있을지 모르지만, 종종, 당연히, 우리는 그것이 애초에 왜 정확했는지에 대한 이유를 그저 만들어내기 시작한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 무의식적 반응 이후에 일어나는 &#39;의식적 사고&#39;의 역할을 다룹니다. 가끔은 오류를 바로잡기도 하지만, 대개는 앞선 무의식적 판단을 정당화하려는 인간의 심리적 성향을 지적하며 다음 문장의 핵심 주제로 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to generate (to부정사): 타동사 begin의 목적어 역할을 하는 명사적 용법의 to부정사다.</div><div class=\"lec-gr-item\">why it was accurate (간접의문문): 의문사 why가 이끄는 명사절이 전치사 for의 목적어로 쓰였으며, 「의문사 + 주어 + 동사」의 어순을 취한다.</div><div class=\"lec-gr-item\">in the first place (관용표현): ‘애초에’, ‘처음부터’라는 의미의 숙어로 문장의 의미를 강조한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conscious</td><td class=\"m\">의식하는, 자각하는</td></tr><tr><td class=\"w\">level</td><td class=\"m\">수준, 정도</td></tr><tr><td class=\"w\">correct</td><td class=\"m\">바로잡다, 정정하다</td></tr><tr><td class=\"w\">notice</td><td class=\"m\">알아차리다, 주목하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">simply</td><td class=\"m\">단순히, 그저</td></tr><tr><td class=\"w\">generate</td><td class=\"m\">만들어 내다, 발생시키다</td></tr><tr><td class=\"w\">accurate</td><td class=\"m\">정확한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 일반적으로 확신한다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">are generally convinced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 결정이 &#39;이성적&#39;이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> our decisions are “rational,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 실제로는</span><span class=\"en\"><b>but in reality,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 인간의 결정은</span><span class=\"en\"><b>most human decisions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감정적으로 이루어진다</span><span class=\"en\"><b><span class=\"grammar-hl\">are made emotionally</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서 우리는 모으거나 만들어낸다</span><span class=\"en\"><b>and then we collect or generate</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사실들을</span><span class=\"en\"><b>the facts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 결정들을 정당화하기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to justify</span> these decisions.</b></span></div></div><div class=\"lec-sent-ko\">우리는 일반적으로 자신의 결정이 ‘이성적’이라고 확신하지만, 실제로는, 대부분의 인간 결정은 감정적으로 이루어지고, 그 후에 이러한 결정을 정당화할 사실을 모으거나 만들어낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심 결론입니다. &#39;이성적 판단&#39;이라는 우리의 믿음과 &#39;감정적 선결정&#39;이라는 실제 현실 사이의 괴리를 극명하게 대조합니다. 무의식이 먼저 결정하고 이성은 그 뒤를 맞추는 보조적 역할임을 명시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are generally convinced that (수동태): be동사(are)+p.p.(convinced) 구조. convince는 타동사인데 목적어가 없어서 수동구조 are convinced 형태로 쓴다. 기본구조: V + O + that절 (O에게 ~라는 것을 확신시키다)</div><div class=\"lec-gr-item\">are made emotionally (수동태): be동사(are)+p.p.(made) 구조. make는 타동사인데 목적어가 없어서 수동구조 are made 형태로 쓴다. 기본구조: V + O</div><div class=\"lec-gr-item\">to justify (to부정사): 목적(~하기 위하여)을 나타내는 부사적 용법으로 쓰여 앞에 나온 행위의 의도를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">generate</td><td class=\"m\">만들어 내다, 발생시키다</td></tr><tr><td class=\"w\">in reality</td><td class=\"m\">실제로는, 현실에서는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 볼 때</span><span class=\"en\"><b>When we see</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 것이나 누군가를</span><span class=\"en\"><b>something or someone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위험하다고 &#39;느껴지는&#39;</span><span class=\"en\"><b><span class=\"grammar-hl\">who “feels” dangerous</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 이미 시작해 버린다</span><span class=\"en\"><b>we have already launched</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내면적으로 행동을</span><span class=\"en\"><b>into action internally</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 심지어 시작하기도 전에</span><span class=\"en\"><b>before we have even started</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&#39;생각&#39;하는 것을.</span><span class=\"en\"><b>“<span class=\"grammar-hl\">thinking</span>.”</b></span></div></div><div class=\"lec-sent-ko\">위험하다고 ‘느껴지는’ 어떤 것이나 사람을 볼 때, 우리는 심지어 ‘생각’을 시작하기도 전에 이미 내면적으로 행동을 시작해 버린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전체 내용을 마무리하며 다시 한번 강조합니다. &#39;느낌(감정/무의식)&#39;이 &#39;생각(이성)&#39;보다 앞선다는 점을 강조하며, 우리의 행동 체계가 얼마나 본능적이고 즉각적인지 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who “feels” dangerous (관계대명사): 주격 관계대명사 who가 선행사 something or someone을 수식하며, 관계대명사절 내부에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">thinking (동명사): 타동사 start의 목적어로 쓰여 ‘생각하는 행위’를 의미하는 명사적 역할을 한다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간은 매일 안전과 적절성을 판단하며 살아가는데, 이는 무의식적인 &#39;위험 탐지기&#39;에 의해 주도된다.</li><li>위험이 감지되면 의식적 사고보다 먼저 &#39;싸움 혹은 도주&#39;와 같은 본능적 공포 반응이 일어난다.</li><li>우리는 자신의 결정이 이성적이라고 믿고 싶어 하지만, 실제로는 감정이 먼저 결정하고 이성은 이를 정당화할 근거를 찾을 뿐이다.</li><li>결국 인간은 &#39;생각&#39;하기도 전에 이미 무의식적 &#39;느낌&#39;에 따라 내부적으로 반응하고 행동한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Human decisions are initiated by an unconscious emotional response to perceived danger, whereas rational thinking serves only to justify these pre-determined actions with facts.</div>\n              <div class=\"lec-final-sum-ko\">인간의 의사결정은 감지된 위험에 대한 무의식적인 정서적 반응으로 시작되는 반면, 이성적 사고는 단지 이러한 미리 결정된 행동을 사실로 정당화하는 역할을 할 뿐이다.</div></div></div>"],"segs":[[{"audio":"./40_audio/1.mp3","hl":null}],[{"audio":"./40_audio/2.mp3","hl":null}],[{"audio":"./40_audio/3.mp3","hl":null},{"audio":"./40_audio/4.mp3","hl":"stage-0"},{"audio":"./40_audio/5.mp3","hl":"stage-1"},{"audio":"./40_audio/6.mp3","hl":"stage-2"}],[{"audio":"./40_audio/7.mp3","hl":null}],[{"audio":"./40_audio/8.mp3","hl":"main"},{"audio":"./40_audio/9.mp3","hl":"meaning"},{"audio":"./40_audio/10.mp3","hl":"grammar"}],[{"audio":"./40_audio/11.mp3","hl":"main"},{"audio":"./40_audio/12.mp3","hl":"meaning"},{"audio":"./40_audio/13.mp3","hl":"grammar"}],[{"audio":"./40_audio/14.mp3","hl":"main"},{"audio":"./40_audio/15.mp3","hl":"meaning"},{"audio":"./40_audio/16.mp3","hl":"grammar"}],[{"audio":"./40_audio/17.mp3","hl":"main"},{"audio":"./40_audio/18.mp3","hl":"meaning"},{"audio":"./40_audio/19.mp3","hl":"grammar"}],[{"audio":"./40_audio/20.mp3","hl":"main"},{"audio":"./40_audio/21.mp3","hl":"meaning"},{"audio":"./40_audio/22.mp3","hl":"grammar"}],[{"audio":"./40_audio/23.mp3","hl":"main"},{"audio":"./40_audio/24.mp3","hl":"meaning"},{"audio":"./40_audio/25.mp3","hl":"grammar"}],[{"audio":"
