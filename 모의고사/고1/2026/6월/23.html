자아&#39;를 바라보는 초점이 전혀 다릅니다. 죄책감(Guilt)은 자신이 저지른 특정 &#39;행동&#39;을 잘못된 것으로 인식하여 이를 바로잡으려는 회복적 동기를 제공하는 반면, 수치심(Shame)은 실수한 행동이 아닌 &#39;나 자신&#39; 전체를 결함 있는 존재로 느끼게 만듭니다. 예를 들어, 잘못을 했을 때 &quot;내가 실수했네&quot;라고 생각하며 사과하는 것은 죄책감이지만, &quot;나는 원래 쓸모없는 사람이야&quot;라고 자책하며 숨어버리는 것은 수치심에 해당하며 이는 변화의 의지를 꺾는 파괴적인 영향을 미칩니다. 브레네 브라운(Brené Brown)과 같은 심리학자들의 연구에 따르면, 이러한 차이를 이해하는 것은 우리가 실수를 대할 때 회복탄력성을 높이고 긍정적인 행동 변화를 이끌어내는 데 매우 중요한 열쇠가 됩니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01개념의 정의</div><ul><li>수치심은 우리의 존재 자체에 집중하는 반면, 죄책감은 우리의 행동에 집중한다.</li><li>수치심(shame)은 &#39;우리 자신&#39;에 대한 감정임</li><li>죄책감(guilt)은 &#39;우리의 행동(behaviors)&#39;에 대한 감정임</li><li>핵심 키워드: 정체성(who we are)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02죄책감의 발생 원리</div><ul><li>자신이 한 행동과 자신이 되고 싶은 모습 사이의 차이를 인식할 때 죄책감이 발생한다.</li><li>이상적인 모습(person we want to be)과 실제 행동을 비교함</li><li>이 과정에서 불편한 감정(uncomfortable feeling)을 느끼게 됨</li><li>핵심 키워드: 비교(hold up)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03죄책감의 긍정적 기능</div><ul><li>죄책감은 행동을 수정하고 타인에게 사과하게 만드는 유익한 동기 부여 요소이다.</li><li>사과(apologize)와 보상(make amends)을 하도록 유도함</li><li>잘못된 행동을 긍정적인 방향으로 변화시키는 동기(motivator)가 됨</li><li>핵심 키워드: 긍정적 효과(positive effect)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04수치심의 파괴적 영향</div><ul><li>수치심은 죄책감과 달리 스스로 변화할 수 있다는 믿음을 꺾어버리는 해로운 감정이다.</li><li>수치심은 건설적이지 않고 파괴적(destructive)임</li><li>더 나아질 수 있다는 믿음을 부식(corrode)시킴</li><li>핵심 키워드: 변화의 의지(change and do better)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shame</td><td class=\"m\">수치심, 부끄러움</td></tr><tr><td class=\"w\">guilt</td><td class=\"m\">죄책감</td></tr><tr><td class=\"w\">guilty</td><td class=\"m\">죄책감이 드는</td></tr><tr><td class=\"w\">hold</td><td class=\"m\">잡다, 유지하다</td></tr><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr><tr><td class=\"w\">amend</td><td class=\"m\">개정[수정]하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">positive</td><td class=\"m\">긍정적인</td></tr><tr><td class=\"w\">destructive</td><td class=\"m\">파괴적인, 해로운</td></tr><tr><td class=\"w\">replace</td><td class=\"m\">대신하다, 교체하다</td></tr><tr><td class=\"w\">negative</td><td class=\"m\">부정적인</td></tr><tr><td class=\"w\">research</td><td class=\"m\">연구, 조사</td></tr><tr><td class=\"w\">found</td><td class=\"m\">찾다, 발견하다 (find의 과거형)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수치심은 ~에 관한 것이다</span><span class=\"en\"><b>Shame is about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 누구인가에,</span><span class=\"en\"><b><span class=\"grammar-hl\">who we are</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 죄책감은 ~에 관한 것이다</span><span class=\"en\"><b>and guilt is about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 행동들에.</span><span class=\"en\"><b>our behaviors.</b></span></div></div><div class=\"lec-sent-ko\">수치심은 우리가 누구인가에 관한 것이고, 죄책감은 우리의 행동들에 관한 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수치심과 죄책감의 근본적인 차이를 정의하며 글을 시작합니다. 수치심은 &#39;존재(자아)&#39;에 초점을 맞추고, 죄책감은 &#39;행위(행동)&#39;에 초점을 맞춘다는 점을 명시하여 논의의 기초를 닦습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who we are (간접의문문): &#39;의문사(who) + 주어(we) + 동사(are)&#39; 어순의 명사절로, 전치사 about의 목적어 역할을 하며 &#39;우리가 누구인가&#39;라는 정체성의 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shame</td><td class=\"m\">수치심, 부끄러움</td></tr><tr><td class=\"w\">guilt</td><td class=\"m\">죄책감</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 죄책감을 느낀다</span><span class=\"en\"><b>We feel guilty</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 견줄 때</span><span class=\"en\"><b>when we hold up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 했거나 하지 못한 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">something we’ve done</span> or <span class=\"grammar-hl\">failed to do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그런 유형의 사람에</span><span class=\"en\"><b>against the kind of <span class=\"grammar-hl\">person</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 되고자 하는.</span><span class=\"en\"><b><span class=\"grammar-hl\">we want to be</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리가 했거나 하지 못한 것을 우리가 되고자 하는 유형의 사람이 견줄 때 우리는 죄책감을 느낀다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;행동&#39; 중심의 죄책감이 발생하는 구체적인 심리 기제를 설명합니다. 자신의 실제 행동과 이상적인 자아상 사이의 간극을 인식할 때 죄책감이 유발된다는 점을 서술합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">something we’ve done (관계대명사): 선행사 something 뒤에 목적격 관계대명사(that/which)가 생략된 구조이며, 타동사 done의 목적어가 빠진 불완전한 절 &#39;we&#39;ve done&#39;이 앞의 명사를 수식한다.</div><div class=\"lec-gr-item\">failed to do (to부정사): fail은 to부정사를 목적어로 취하는 동사이며, &#39;to do&#39;는 fail의 목적어 역할을 하는 명사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">person we want to be (관계대명사): 선행사 person 뒤에 보어격 관계대명사(that)가 생략된 구조이며, be동사의 보어가 빠진 절 &#39;we want to be&#39;가 선행사를 수식한다. &#39;to be&#39;는 want의 목적어로 쓰인 to부정사다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">guilt</td><td class=\"m\">죄책감</td></tr><tr><td class=\"w\">guilty</td><td class=\"m\">죄책감이 드는</td></tr><tr><td class=\"w\">hold</td><td class=\"m\">잡다, 유지하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>It’s</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불편한 감정이다,</span><span class=\"en\"><b>an uncomfortable feeling,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 (~한) 것이다</span><span class=\"en\"><b>but one</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도움이 되는.</span><span class=\"en\"><b><span class=\"grammar-hl\">that’s helpful</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 불편한 감정이지만, 도움이 되는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 죄책감의 성격을 규정합니다. 감정 자체는 부정적(불편함)일 수 있지만, 그 기능적 측면에서는 긍정적(도움이 됨)이라는 반전의 논리를 제시하여 죄책감의 가치를 부각합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that’s helpful (관계대명사): 주격 관계대명사 that이 이끄는 절이 앞의 부정대명사 one을 수식하며, 뒤에 주어가 없는 불완전한 문장 구조를 가진다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 사과할 때</span><span class=\"en\"><b>When we <span class=\"grammar-hl\">apologize</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 한 것에 대해,</span><span class=\"en\"><b><span class=\"grammar-hl\">for</span> something we’ve done,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 이들에게 보상하거나,</span><span class=\"en\"><b><span class=\"grammar-hl\">make amends to</span> others,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 행동을 바꿀 때</span><span class=\"en\"><b>or change a <span class=\"grammar-hl\">behavior</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 좋다고 느끼지 않는,</span><span class=\"en\"><b><span class=\"grammar-hl\">that we don’t feel good about</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">죄책감이</span><span class=\"en\"><b>guilt is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대체로 동기 요인이다.</span><span class=\"en\"><b>most often the motivator.</b></span></div></div><div class=\"lec-sent-ko\">우리가 한 것에 대해 사과하거나, 다른 이에게 보상하거나, 좋다고 느끼지 않는 행동을 바꿀 때, 죄책감이 대체로 동기 요인이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;도움이 되는&#39; 측면의 구체적인 사례들을 나열합니다. 사과, 보상, 행동 수정이라는 건설적인 사회적 행동의 배후에 죄책감이 있음을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">apologize for (관용표현): &#39;apologize for + 명사&#39; 구조로 쓰여 &#39;~에 대해 사과하다&#39;라는 의미를 나타내는 숙어이다.</div><div class=\"lec-gr-item\">make amends to (관용표현): &#39;make amends to + 사람&#39; 구조로 쓰여 &#39;~에게 보상하다/사죄하다&#39;라는 의미를 나타내는 관용구이다.</div><div class=\"lec-gr-item\">behavior that we don’t feel good about (관계대명사): 목적격 관계대명사 that이 이끄는 절이 behavior를 수식하며, 전치사 about의 목적어가 생략된 불완전한 절이 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">guilt</td><td class=\"m\">죄책감</td></tr><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr><tr><td class=\"w\">amend</td><td class=\"m\">개정[수정]하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">죄책감은</span><span class=\"en\"><b>Guilt is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수치심만큼이나 강력하다,</span><span class=\"en\"><b>just <span class=\"grammar-hl\">as powerful as</span> shame,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것의 효과는</span><span class=\"en\"><b>but its effect</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 긍정적이다</span><span class=\"en\"><b>is often positive</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반면에 수치심은</span><span class=\"en\"><b>while shame</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 파괴적이다.</span><span class=\"en\"><b>often is destructive.</b></span></div></div><div class=\"lec-sent-ko\">죄책감은 수치심만큼이나 강력하지만, 수치심은 종종 파괴적인 데 반해 그것(죄책감)의 효과는 종종 긍정적이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다시 수치심과 죄책감을 대조하며 논의를 확장합니다. 두 감정 모두 영향력은 강력하지만, 그 결과가 &#39;긍정적(죄책감)&#39;인지 &#39;파괴적(수치심)&#39;인지에 따라 명확히 구분됨을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as powerful as (관용표현): &#39;as + 형용사/부사 + as&#39; 원급 비교 구조로, &#39;shame만큼 강력한&#39;이라는 동등 비교의 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shame</td><td class=\"m\">수치심, 부끄러움</td></tr><tr><td class=\"w\">guilt</td><td class=\"m\">죄책감</td></tr><tr><td class=\"w\">positive</td><td class=\"m\">긍정적인</td></tr><tr><td class=\"w\">destructive</td><td class=\"m\">파괴적인, 해로운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 사람들이 ~하는 것을 볼 때</span><span class=\"en\"><b>When we <span class=\"grammar-hl\">see people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과하거나, 보상하거나,</span><span class=\"en\"><b><span class=\"grammar-hl\">apologize</span>, make amends,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 부정적 행동을 바꿀 때</span><span class=\"en\"><b>or <span class=\"grammar-hl\">replace negative behaviors</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 긍정적인 것들로,</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> more positive ones,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">죄책감이 종종 동기 요인이다,</span><span class=\"en\"><b>guilt is often the motivator,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수치심이 아니라.</span><span class=\"en\"><b>not shame.</b></span></div></div><div class=\"lec-sent-ko\">우리는 누군가가 사과하거나, 보상하거나, 부정적 행동을 더 긍정적인 행동으로 바꾸는 것을 볼 때, 죄책감은 종종 동기 요인이 되지만, 수치심은 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장의 사례를 재차 인용하며, 이러한 긍정적 변화의 원천은 수치심이 아닌 반드시 죄책감이어야 함을 다시 한번 확언합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">see people apologize (5형식(SVOC)): 지각동사 see + 목적어(people) + 목적격 보어(apologize) 구조이다. 목적어와 보어의 관계가 능동이므로 보어 자리에 동사원형을 썼다.</div><div class=\"lec-gr-item\">replace negative behaviors with (관용표현): &#39;replace A with B&#39; 구조로 &#39;A를 B로 교체하다/대체하다&#39;라는 의미를 나타내는 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shame</td><td class=\"m\">수치심, 부끄러움</td></tr><tr><td class=\"w\">guilt</td><td class=\"m\">죄책감</td></tr><tr><td class=\"w\">apologize</td><td class=\"m\">사과하다</td></tr><tr><td class=\"w\">amend</td><td class=\"m\">개정[수정]하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">positive</td><td class=\"m\">긍정적인</td></tr><tr><td class=\"w\">replace</td><td class=\"m\">대신하다, 교체하다</td></tr><tr><td class=\"w\">negative</td><td class=\"m\">부정적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">실제로,</span><span class=\"en\"><b>In fact,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나의 연구에서,</span><span class=\"en\"><b>in my research,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나는 발견했다</span><span class=\"en\"><b>I found</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수치심이 좀먹는다는 것을</span><span class=\"en\"><b>that shame corrodes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 일부를</span><span class=\"en\"><b>the part of us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">믿는</span><span class=\"en\"><b><span class=\"grammar-hl\">that believes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 변하고 더 나아질 수 있다고.</span><span class=\"en\"><b>we can change and do better.</b></span></div></div><div class=\"lec-sent-ko\">실제로, 나의 연구에서, 수치심은 우리가 변하고 더 나아질 수 있다고 믿는 우리의 일부를 좀먹는다는 것을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 연구 결과를 근거로 제시하며 결론을 맺습니다. 수치심이 왜 파괴적인지를 설명하는데, 이는 인간의 성장 동력인 &#39;변화 가능성에 대한 믿음&#39; 자체를 파괴하기 때문임을 지적하며 죄책감의 상대적 유익성을 입증합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that believes (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사 &#39;the part of us&#39;를 수식하며, 뒤에 주어가 빠진 불완전한 문장이 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shame</td><td class=\"m\">수치심, 부끄러움</td></tr><tr><td class=\"w\">research</td><td class=\"m\">연구, 조사</td></tr><tr><td class=\"w\">found</td><td class=\"m\">찾다, 발견하다 (find의 과거형)</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>수치심은 자아 존재 자체에 관한 감정이고, 죄책감은 자신의 특정 행동에 관한 감정이다.</li><li>죄책감은 심리적으로 불편하지만, 사과나 행동 변화를 이끌어내는 긍정적인 동기 부여 역할을 수행한다.</li><li>반면 수치심은 파괴적이며, 스스로를 개선할 수 있다는 믿음과 자기 효능감을 훼손시킨다.</li><li>따라서 인간의 긍정적인 변화와 성장을 가능하게 하는 핵심 동력은 수치심이 아닌 죄책감이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Guilt functions as a positive catalyst for behavioral change and reconciliation, whereas shame serves as a destructive force that erodes the belief in one&#39;s potential for improvement.</div>\n              <div class=\"lec-final-sum-ko\">죄책감은 행동 변화와 화해를 위한 긍정적인 촉매제로 작용하는 반면, 수치심은 개선 가능성에 대한 믿음을 좀먹는 파괴적인 힘으로 작용한다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/18.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/19.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/21.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/22.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/23.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/24.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/25.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_23번_강의_audio/26.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_23번_강의_a
