8n96OwvvF13qFpcWb2FtElzF5byK8xZV3KcgMwUscdweOMYrl2YbTjGQD6jkdBxjkdM4yecHpmsSoGNyYbtuXPHtnj8PXHU8tdlCMxIJweMjp0ORgg9AQpGG4J6g1vSpUqKtRiopyTtdtOXurdt67dtLdWZ1KtWrZ1JOTjGybVtGlo7Lrpvd6n/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Shaping Behavior: How Consequences Drive Human Adaptation<small>행동 형성: 결과가 인간의 적응을 주도하는 방식</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 심리학의 주요 이론인 조작적 조건화(Operant Conditioning)와 깊은 관련이 있는데, 이는 인간이 특정 행동을 한 뒤에 뒤따르는 결과에 따라 그 행동을 반복할지 말지를 결정한다는 이론입니다. 행동주의 심리학자 스키너(B.F. Skinner)는 이른바 스키너 상자(Skinner Box) 실험을 통해, 보상이 주어지는 행동은 빈도가 높아지고 불리한 결과가 따르는 행동은 점차 사라진다는 원리를 증명했습니다. 실생활 예로 우리가 맛집을 다시 찾는 이유는 맛이라는 강화(Reinforcement)를 받았기 때문이며, 반대로 효과 없는 공부법을 바꾸는 것은 처벌(Punishment)이나 보상의 부재에 따른 자연스러운 적응 과정입니다. 결국 인간은 환경과의 상호작용 속에서 자신에게 가장 이득이 되는 방향(Optimization)으로 행동을 수정하고 최적화해 나가는 존재임을 이해하는 것이 이 지문의 핵심 맥락입니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01적응의 핵심 기제</div><ul><li>인간은 행동의 결과에 따라 자신의 행동을 수정하며 환경에 적응한다.</li><li>핵심 개념: 결과(consequences)에 따른 행동의 변화</li><li>상황에 맞춰 행동을 조절(adjust)하고 적응(adapt)함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02긍정적 강화의 사례</div><ul><li>자신의 행동에 대해 칭찬과 같은 긍정적 피드백을 받으면 그 행동을 지속한다.</li><li>예시: 교사에게 칭찬(praised)을 받은 아이</li><li>결과: 올바른 방식으로 학습이나 연습을 계속 수행함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03무익한 행동의 수정 사례</div><ul><li>기대한 결과가 나오지 않으면 기존의 행동을 포기하고 더 나은 대안을 찾는다.</li><li>예시: 효과 없는 운동을 하는 무용수(dancer)</li><li>결과: 더 유망해 보이는(promising) 다른 운동을 위해 기존 것을 포기함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04보편적 행동 경향성</div><ul><li>인간은 본능적으로 자신에게 이득이 되는 방향으로 움직이고 해로운 상황을 피한다.</li><li>이익(benefit)을 가져다주거나 문제와 불편함(discomfort)을 피하게 돕는 행동을 선호함</li><li>문제나 불이익(disadvantage)을 초래하는 행동은 점차 줄이거나 중단함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05보상의 유무와 행동 선택</div><ul><li>아무런 이득이나 보상이 따르지 않는 행동은 결국 회피의 대상이 된다.</li><li>보상(reward)이 없는 방식으로는 행동하지 않으려 함</li><li>효율성과 결과의 가치에 따라 행동의 지속 여부를 결정함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">particularly</td><td class=\"m\">특히, 특별히</td></tr><tr><td class=\"w\">being</td><td class=\"m\">(human beings) 인간</td></tr><tr><td class=\"w\">adapt</td><td class=\"m\">적응하다, 맞추다</td></tr><tr><td class=\"w\">adjust</td><td class=\"m\">조절하다, 맞추다</td></tr><tr><td class=\"w\">circumstance</td><td class=\"m\">상황, 사정</td></tr><tr><td class=\"w\">yield</td><td class=\"m\">산출하다, 내다</td></tr><tr><td class=\"w\">for instance</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">praise</td><td class=\"m\">칭찬(하다)</td></tr><tr><td class=\"w\">exercise</td><td class=\"m\">운동</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">correct</td><td class=\"m\">올바른, 정확한</td></tr><tr><td class=\"w\">continue</td><td class=\"m\">계속하다, 계속되다</td></tr><tr><td class=\"w\">particular</td><td class=\"m\">특정한, 특별한</td></tr><tr><td class=\"w\">conditioning</td><td class=\"m\">조건화, 길들이기</td></tr><tr><td class=\"w\">result</td><td class=\"m\">결과</td></tr><tr><td class=\"w\">favor</td><td class=\"m\">(in favor of) ~에 찬성하여</td></tr><tr><td class=\"w\">promising</td><td class=\"m\">유망한, 촉망되는</td></tr><tr><td class=\"w\">in general</td><td class=\"m\">일반적으로, 대체로</td></tr><tr><td class=\"w\">tend</td><td class=\"m\">~하는 경향이 있다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">특히 강력한 방식은</span><span class=\"en\"><b>A particularly powerful way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간이</span><span class=\"en\"><b><span class=\"grammar-hl\">in which</span> human beings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적응하고 맞춰가는</span><span class=\"en\"><b><span class=\"grammar-hl\">adapt and adjust</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 환경에</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> their circumstances</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행동을 바꾸는 것에 의해서이다</span><span class=\"en\"><b>is by <span class=\"grammar-hl\">changing</span> behaviors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결과에 비추어</span><span class=\"en\"><b>in light of the consequences</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 초래하는.</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> they yield.</b></span></div></div><div class=\"lec-sent-ko\">인간이 자신의 환경에 적응하고 맞춰가는 특히 강력한 방식은 그것(행동)들이 초래하는 결과에 비추어 행동을 바꾸는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 주제를 담고 있습니다. 인간은 단순히 환경에 순응하는 것이 아니라, 자신의 행동이 어떤 &#39;결과(consequences)&#39;를 낳는지 관찰하고 그에 맞춰 행동을 수정하며 지혜롭게 적응해 나간다는 점을 강조합니다. 이후 문장들은 이에 대한 구체적인 예시와 부연 설명을 제공합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in which (관계대명사): 전치사(in) + 관계대명사(which) + S + V 구조이다. 관계대명사 뒤에는 주어(human beings) + 동사(adapt and adjust)가 갖춰진 완전한 절(완전문장)이 온다.</div><div class=\"lec-gr-item\">adapt and adjust to (관용표현): adapt to (~에 적응하다)와 adjust to (~에 맞추다/조절하다)가 병렬 구조로 연결되어 목적어(their circumstances)를 공유하는 구조이다.</div><div class=\"lec-gr-item\">changing (동명사): 전치사(by)의 목적어 역할을 하며, &#39;~하는 것&#39;이라는 행위의 의미를 나타낸다.</div><div class=\"lec-gr-item\">that (관계대명사): 선행사(consequences)를 수식하는 목적격 관계대명사이다. 뒤에 이어지는 절에서 yield의 목적어가 생략된 불완전한 구조를 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">particularly</td><td class=\"m\">특히, 특별히</td></tr><tr><td class=\"w\">being</td><td class=\"m\">(human beings) 인간</td></tr><tr><td class=\"w\">adapt</td><td class=\"m\">적응하다, 맞추다</td></tr><tr><td class=\"w\">adjust</td><td class=\"m\">조절하다, 맞추다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">circumstance</td><td class=\"m\">상황, 사정</td></tr><tr><td class=\"w\">yield</td><td class=\"m\">산출하다, 내다</td></tr><tr><td class=\"w\">particular</td><td class=\"m\">특정한, 특별한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For instance,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 아이는</span><span class=\"en\"><b>a child</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선생님에게 칭찬받는</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span> <span class=\"grammar-hl\">gets praised</span> by her teacher</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">운동을 정확히 한 것에 대해</span><span class=\"en\"><b>for <span class=\"grammar-hl\">doing</span> an exercise correctly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계속할 가능성이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is likely to continue</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 운동을 하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">doing</span> the exercise</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그런 방식으로.</span><span class=\"en\"><b>in that way.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 운동을 정확히 한 것에 대해 선생님에게 칭찬받는 아이는 그런 방식으로 운동을 계속할 가능성이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;결과에 따른 행동 변화&#39;의 긍정적인 사례입니다. &#39;칭찬&#39;이라는 긍정적인 결과가 발생했기 때문에, 아이는 그 행동을 강화하고 지속하게 됩니다. 이는 학습과 적응의 가장 기초적인 원리를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who (관계대명사): 선행사(a child)를 수식하는 주격 관계대명사로, 뒤에 동사(gets)가 바로 이어지는 구조이다.</div><div class=\"lec-gr-item\">gets praised (수동구조): be동사 대신 get을 사용한 get + p.p.(praised) 구조이다. praise는 타동사인데 뒤에 목적어가 없어서 수동구조 gets praised 형태로 쓴다. 기본구조: V + O</div><div class=\"lec-gr-item\">doing (동명사): 전치사(for)의 목적어 역할을 하며, &#39;~하는 것&#39;이라는 행위의 개념으로 쓰였다.</div><div class=\"lec-gr-item\">is likely to continue (관용표현): be likely to + 동사원형 구조로 &#39;~할 가능성이 있다/높다&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">doing (동명사): 타동사(continue)의 목적어 역할을 하며, 이전에 하던 동작을 &#39;계속하는 것&#39;을 의미한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for instance</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">praise</td><td class=\"m\">칭찬(하다)</td></tr><tr><td class=\"w\">exercise</td><td class=\"m\">운동</td></tr><tr><td class=\"w\">correct</td><td class=\"m\">올바른, 정확한</td></tr><tr><td class=\"w\">continue</td><td class=\"m\">계속하다, 계속되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 무용수는</span><span class=\"en\"><b>A dancer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">느끼는</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span> feels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정한 조건화 운동이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> a particular <span class=\"grammar-hl\">conditioning exercise</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아무런 결과를 내지 못한다고</span><span class=\"en\"><b><span class=\"grammar-hl\">is not giving</span> any results</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 운동을 포기할 가능성이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is likely to give</span> <span class=\"grammar-hl\">that</span> exercise up</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또 다른 것을 위해</span><span class=\"en\"><b>in favor of another one</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 유망해 보이는.</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> seems more <span class=\"grammar-hl\">promising</span>.</b></span></div></div><div class=\"lec-sent-ko\">특정한 조건화 운동이 아무런 결과를 내지 못한다고 느끼는 무용수는 더 유망해 보이는 또 다른 운동을 (하기) 위해 그 운동을 포기할 가능성이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이번에는 &#39;결과가 없는&#39; 경우의 사례입니다. 노력에 비해 성과(보상)가 따르지 않을 때, 인간은 기존의 행동을 포기하고 더 효율적인 대안을 찾는 방식으로 환경에 적응한다는 것을 보여줍니다. 앞 문장이 행동의 &#39;지속&#39;을 말했다면, 이 문장은 행동의 &#39;수정 및 교체&#39;를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who (관계대명사): 선행사(A dancer)를 수식하는 주격 관계대명사이다.</div><div class=\"lec-gr-item\">conditioning exercise (동명사): conditioning(컨디셔닝/조절) + exercise(운동)의 결합으로, -ing가 &#39;운동의 용도나 목적(행위)&#39;을 나타내며 명사를 수식하는 동명사(명사적) 구조이다.</div><div class=\"lec-gr-item\">is not giving (현재진행): be동사(is) + -ing(giving) 형태로, 현재 어떤 결과도 &#39;주고 있지 않다&#39;는 동작의 진행을 나타낸다.</div><div class=\"lec-gr-item\">is likely to give (관용표현): be likely to + 동사원형 구조로 &#39;~할 것 같다&#39;는 의미를 나타내며, to부정사가 형용사적 성격의 likely를 보충 설명한다.</div><div class=\"lec-gr-item\">give that exercise up (관용표현): 타동사구(이어동사) &#39;give up&#39; 사이에 명사 목적어(that exercise)가 위치한 구조로, &#39;그 운동을 포기하다&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">that (관계대명사): 선행사(another one)를 수식하는 주격 관계대명사이다.</div><div class=\"lec-gr-item\">promising (현재분사): 명사(one)의 상태를 설명하는 주격 보어 자리에 쓰인 현재분사(형용사적)로, &#39;유망한/전망이 좋은&#39;이라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exercise</td><td class=\"m\">운동</td></tr><tr><td class=\"w\">particular</td><td class=\"m\">특정한, 특별한</td></tr><tr><td class=\"w\">conditioning</td><td class=\"m\">조건화, 길들이기</td></tr><tr><td class=\"w\">result</td><td class=\"m\">결과</td></tr><tr><td class=\"w\">favor</td><td class=\"m\">(in favor of) ~에 찬성하여</td></tr><tr><td class=\"w\">promising</td><td class=\"m\">유망한, 촉망되는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일반적으로,</span><span class=\"en\"><b>In general,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 일을 하는 경향이 있다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">tend to do</span> things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게 가져다주는</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> <span class=\"grammar-hl\">bring us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 종류의 이익을</span><span class=\"en\"><b><span class=\"grammar-hl\">some kind of benefit</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 방식으로 행동하는</span><span class=\"en\"><b>or act in ways</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 피하도록 돕는</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> <span class=\"grammar-hl\">help us avoid</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 종류의 문제를,</span><span class=\"en\"><b>some kind of problem,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불편함, 또는 불이익을.</span><span class=\"en\"><b>discomfort, or disadvantage.</b></span></div></div><div class=\"lec-sent-ko\">일반적으로, 우리는 우리에게 어떤 종류의 이익을 가져다 주는 일을 하거나 우리가 어떤 종류의 문제, 불편함, 또는 불이익을 피하도록 돕는 방식으로 행동하는 경향이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번과 3번의 예시를 통해 도출된 일반적인 원칙입니다. 인간의 행동 동기를 두 가지(이익 추구와 불이익 회피)로 정리하며 논리를 확장합니다. 앞 문장들의 개별 사례를 하나의 보편적인 법칙으로 묶어주는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tend to do (관용표현): tend + to부정사 구조로 &#39;~하는 경향이 있다&#39;는 의미를 나타낸다.</div><div class=\"lec-gr-item\">that (관계대명사): 선행사(things)를 수식하는 주격 관계대명사이다.</div><div class=\"lec-gr-item\">bring us some kind of benefit (4형식): 동사(bring) + 간접목적어(us) + 직접목적어(some kind of benefit) 구조로 이루어진 4형식(S+V+IO+DO) 문장이다.</div><div class=\"lec-gr-item\">that (관계대명사): 선행사(ways)를 수식하는 주격 관계대명사이다.</div><div class=\"lec-gr-item\">help us avoid (5형식): 동사(help) + 목적어(us) + 목적보어(avoid) 구조로 이루어진 5형식(S+V+O+C) 문장이다. 준사역동사 help는 목적보어로 동사원형이나 to부정사를 취할 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in general</td><td class=\"m\">일반적으로, 대체로</td></tr><tr><td class=\"w\">tend</td><td class=\"m\">~하는 경향이 있다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 또한 하는 경향이 있다</span><span class=\"en\"><b>We also tend to do</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 적은 것들을</span><span class=\"en\"><b>fewer things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(또는 일을 중단하는)</span><span class=\"en\"><b>(or <span class=\"grammar-hl\">stop doing</span> things)</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문제로 이어지는</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> lead to problems,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불편함, 또는 불이익으로,</span><span class=\"en\"><b>discomfort, or disadvantages,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리는 피하는 경향이 있다</span><span class=\"en\"><b>and we tend to <span class=\"grammar-hl\">avoid</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방식으로 행동하기를</span><span class=\"en\"><b><span class=\"grammar-hl\">acting</span> in ways</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가져오지 않는</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> do not bring</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 이익이나 보상도.</span><span class=\"en\"><b>any benefit or reward.</b></span></div></div><div class=\"lec-sent-ko\">또한 우리는 문제, 불편함, 또는 불이익으로 이어지는 것들을 더 적게 하는 (또는 중단하는) 경향이 있으며, 어떤 이익이나 보상도 가져오지 않는 방식으로 행동하기를 피하는 경향이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막으로 앞 문장의 내용을 뒤집어서 설명하며 결론을 맺습니다. 이익이 없는 행동은 줄이고, 손해를 보는 행동은 피한다는 점을 명시하여, 인간의 적응 기제가 &#39;효율성&#39;과 &#39;자기 보호&#39;에 기반하고 있음을 최종적으로 정리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">stop doing (동명사): 타동사 stop의 목적어로 동명사가 쓰여 &#39;과거부터 해오던 동작을 멈추다&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">that (관계대명사): 선행사(things)를 수식하는 주격 관계대명사이다.</div><div class=\"lec-gr-item\">avoid acting (동명사): 타동사 avoid의 목적어로 쓰였으며, &#39;~하는 행위를 피하다&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">that (관계대명사): 선행사(ways)를 수식하는 주격 관계대명사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tend</td><td class=\"m\">~하는 경향이 있다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간은 자신의 행동이 초래하는 결과를 바탕으로 행동을 수정하며 환경에 적응한다.</li><li>긍정적인 보상(칭찬, 이득)이 따르는 행동은 지속하고 강화하는 경향이 있다.</li><li>성과가 없거나 부정적인 결과(불편, 불이익)를 낳는 행동은 중단하거나 다른 대안으로 바꾼다.</li><li>결론적으로 인간의 행동 결정은 이익 극대화와 손실 최소화라는 원리를 따른다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People adapt to their surroundings by repeating beneficial behaviors while ceasing those that result in negative or unproductive consequences.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 유익한 행동을 반복하고 부정적이거나 비생산적인 결과를 초래하는 행동을 중단함으로써 환경에 적응한다.</div></div></div>"],"segs":[[{"audio":"./34_audio/1.mp3","hl":null}],[{"audio":"./34_audio/2.mp3","hl":null}],[{"audio":"./34_audio/3.mp3","hl":null},     let gesture = null;
    const zoomed = () => window.visualViewport && window.visualViewport.scale > 1.01;
    const selected = () => { const s = window.getSelection(); return s && !s.isCollapsed; };
    const interactive = el => el && el.closest('a,button,input,textarea,select,video,audio,canvas,[contenteditable="true"],[role="slider"]');
    const scrollsHorizontally = target => {
      for (let el = target; el && root.contains(el); el = el.parentElement) {
        if (el.scrollWidth > el.clientWidth + 2 && /^(auto|scroll)$/.test(getComputedStyle(el).overflowX)) return true;
        if (el === root) break;
      }
      return false;
    };
    root.addEventListener('touchstart', e => {
      gesture = null;
