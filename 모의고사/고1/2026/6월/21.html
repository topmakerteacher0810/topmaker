E//r/KjJ5JSTHTG3Hp7c9RjHXP0p/jt521W/bdMVm3s/kn+X6DvXp1/wA9O36flw0/4fX2x19OnT69KcN7ZxHJ/wB8sQPbPToMnPQD812OcfI+M4+6T1x2xz/noMms22mkr62Um+uyV+va/qmNRd0u9uj1vZpef/AJFXHPqBj6Y/x7dsU8DJCjuQBjgZzjP6nrgnr60BJDjCNjHTac/oDn9Me/AFmGCSR40EMjF5AFARz1IAzheTk46HnjjIzaasmmtHvfTo7eVn0v5dAs+zdrd9Ouv3+Wuqff/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Market for Justifications: Moving Beyond Language as Self-Defense<small>정당화를 위한 시장: 자기방어로서의 언어를 넘어서기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 지문을 온전히 이해하기 위해서는 존 스튜어트 밀이 제시한 사상의 자유 시장(Marketplace of ideas)이라는 개념을 먼저 알아두면 좋은데, 이는 다양한 의견이 자유롭게 경쟁하면 결국 객관적 진리(Objective truth)가 승리한다는 고전적인 믿음을 바탕으로 합니다. 하지만 심리학적으로 인간은 자신이 이미 정답을 정해두고 그에 유리한 근거만을 수집하는 동기화된 추론(Motivated reasoning)이나 확증 편향(Confirmation bias)에 빠지기 쉬운 존재이기도 합니다. 마치 중립적인 탐정처럼 진실을 쫓기보다는, 이미 고용된 변호사(Lawyer)처럼 자신의 기존 신념을 방어하기 위해 언어를 도구로 사용하는 경향이 있다는 점을 지적하고 있죠. 우리가 단순히 자기 정당화(Self-justification)를 위해 논리를 쇼핑하는 수준을 넘어, 언어의 본질적인 가치를 회복해야 한다는 이 글의 주장은 바로 이러한 인간의 심리적 본성에 대한 깊은 이해를 전제로 하고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01아이디어의 시장</div><ul><li>고전적인 진리와 지식의 이상은 여러 아이디어를 비교하여 최선의 사실을 수용하는 것이다.</li><li>아이디어의 시장(market for ideas) 개념</li><li>현실에 가장 적합한 것인지 평가(evaluate)함</li><li>이론적인 과학자의 방식(scientist’s way)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02현실적인 정당화의 추구</div><ul><li>실제 현실에서 우리는 아이디어 자체보다 그 아이디어를 뒷받침할 이야기를 찾는다.</li><li>실제로는 정당화의 시장(market for justifications)에 존재함</li><li>사실을 찾는 것이 아니라 아이디어가 담긴 이야기(stories)를 쇼핑함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기존 신념의 옹호</div><ul><li>새로운 사실을 탐구하기보다 이미 가지고 있는 신념을 증명하려는 경향이 강하다.</li><li>이미 알고 있는 신념을 정당화(justify)하려는 욕구</li><li>자기 방어를 위한 변호사의 방식(lawyer’s way)</li><li>언어를 단순한 자기 방어(self-defense)의 수단으로 활용함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04언어의 고차원적 활용</div><ul><li>언어를 더 존중하며 사용함으로써 단순한 자기 방어 이상의 가치를 창출할 수 있다.</li><li>언어에 대한 더 큰 존중(greater respect)이 필요함</li><li>언어를 통해 단순한 방어 기제를 넘어선 성취를 이룸</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">classical</td><td class=\"m\">고전의, 클래식의</td></tr><tr><td class=\"w\">ideal</td><td class=\"m\">이상적인</td></tr><tr><td class=\"w\">concept</td><td class=\"m\">개념</td></tr><tr><td class=\"w\">individual</td><td class=\"m\">개인</td></tr><tr><td class=\"w\">encounter</td><td class=\"m\">마주치다, 맞닥뜨리다</td></tr><tr><td class=\"w\">compete</td><td class=\"m\">겨루다, 경쟁하다</td></tr><tr><td class=\"w\">evaluate</td><td class=\"m\">평가하다</td></tr><tr><td class=\"w\">fit</td><td class=\"m\">맞다, 어울리다</td></tr><tr><td class=\"w\">reality</td><td class=\"m\">현실</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">form</td><td class=\"m\">형성하다, 이루다</td></tr><tr><td class=\"w\">basis</td><td class=\"m\">기초, 근거</td></tr><tr><td class=\"w\">theory</td><td class=\"m\">이론</td></tr><tr><td class=\"w\">practice</td><td class=\"m\">연습</td></tr><tr><td class=\"w\">justification</td><td class=\"m\">정당화, 명분</td></tr><tr><td class=\"w\">contain</td><td class=\"m\">포함하다, 담고 있다</td></tr><tr><td class=\"w\">figure out</td><td class=\"m\">알아내다, 이해하다, 해결하다</td></tr><tr><td class=\"w\">seek</td><td class=\"m\">찾다, 구하다</td></tr><tr><td class=\"w\">statement</td><td class=\"m\">진술, 말</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고전적 이상은</span><span class=\"en\"><b>A classical ideal</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진리와 지식에 대한</span><span class=\"en\"><b>of truth and knowledge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개념이다</span><span class=\"en\"><b>is the concept</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이디어를 위한 시장이라는</span><span class=\"en\"><b>of a market for ideas:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각하는 개인으로서</span><span class=\"en\"><b>as <span class=\"grammar-hl\">thinking individuals</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 마주한다</span><span class=\"en\"><b>we encounter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경쟁하는 아이디어들을</span><span class=\"en\"><b><span class=\"grammar-hl\">competing ideas</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 그것들을 평가한다</span><span class=\"en\"><b>we evaluate them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 잘 맞는지에 대해</span><span class=\"en\"><b>for their best fit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현실에</span><span class=\"en\"><b>to reality,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서</span><span class=\"en\"><b>and then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 알맞고 뛰어난 사실들이</span><span class=\"en\"><b><span class=\"grammar-hl\">let the best and brightest facts</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기초를 형성하게 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">form</span> the basis</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 신념의</span><span class=\"en\"><b>of our beliefs.</b></span></div></div><div class=\"lec-sent-ko\">진리와 지식에 대한 고전적 이상은 아이디어를 위한 시장이라는 개념이다. 생각하는 개인으로서, 우리는 경쟁하는 아이디어들을 마주하고, 현실에 가장 잘 맞는지에 대해 그것들을 평가하며, 그리고 나서 가장 알맞고 뛰어난 사실들이 우리 신념의 기초를 형성하게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 서두에서 우리가 흔히 생각하는 &#39;이상적인&#39; 진리 탐구의 과정을 설명합니다. 시장에서 물건을 고르듯 여러 아이디어 중 가장 객관적이고 사실에 부합하는 것을 선택해 신념으로 삼는다는 &#39;합리주의적&#39; 관점을 제시하며 논의를 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thinking individuals (현재분사(형용사)): 현재분사 thinking이 수식받는 명사인 individuals와의 관계가 능동이며, &#39;생각하는 개인들&#39;이라는 의미로 뒤의 명사를 수식한다.</div><div class=\"lec-gr-item\">competing ideas (현재분사(형용사)): 현재분사 competing이 수식받는 명사인 ideas와의 관계가 능동이며, &#39;경쟁하는 생각들&#39;이라는 의미로 뒤의 명사를 수식한다.</div><div class=\"lec-gr-item\">let the best and brightest facts form 5형식(SVOC) 구조: 사역동사 let + 목적어(the best and brightest facts) + 목적보어(동사원형 form) 구조로, 목적어가 ~하게 시키다(두다)는 의미를 가진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">classical</td><td class=\"m\">고전의, 클래식의</td></tr><tr><td class=\"w\">ideal</td><td class=\"m\">이상적인</td></tr><tr><td class=\"w\">concept</td><td class=\"m\">개념</td></tr><tr><td class=\"w\">individual</td><td class=\"m\">개인</td></tr><tr><td class=\"w\">encounter</td><td class=\"m\">마주치다, 맞닥뜨리다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evaluate</td><td class=\"m\">평가하다</td></tr><tr><td class=\"w\">fit</td><td class=\"m\">맞다, 어울리다</td></tr><tr><td class=\"w\">reality</td><td class=\"m\">현실</td></tr><tr><td class=\"w\">form</td><td class=\"m\">형성하다, 이루다</td></tr><tr><td class=\"w\">basis</td><td class=\"m\">기초, 근거</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 ~일 것이다</span><span class=\"en\"><b>That would be</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학자의 방식</span><span class=\"en\"><b>the scientist’s way,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적어도 이론상으로는</span><span class=\"en\"><b><span class=\"grammar-hl\">in theory</span> <span class=\"grammar-hl\">at least</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은, 적어도 이론상으로는, 과학자의 방식일 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 합리적인 과정을 &#39;과학자의 방식&#39;이라고 명명합니다. 하지만 &#39;이론적으로는&#39;이라는 단서를 붙임으로써, 현실은 이와 다를 수 있음을 암시하며 다음 문장에서 반전이 일어날 것임을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in theory (관용표현): &#39;이론적으로는&#39;이라는 뜻으로 쓰이는 전치사구 표현이다.</div><div class=\"lec-gr-item\">at least (관용표현): &#39;적어도, 최소한&#39;이라는 뜻으로 쓰이는 부사적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">theory</td><td class=\"m\">이론</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 실제로는</span><span class=\"en\"><b>But <span class=\"grammar-hl\">in practice</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 경우</span><span class=\"en\"><b><span class=\"grammar-hl\">most of the time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 (~에) 있다</span><span class=\"en\"><b>we are in</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정당화를 위한 시장에</span><span class=\"en\"><b>a market for justifications.</b></span></div></div><div class=\"lec-sent-ko\">그러나 실제로는, 대부분의 경우 우리는 ‘정당화를 위한 시장’에 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;But&#39;을 통해 앞의 이상적인 상황을 뒤집습니다. 우리는 새로운 진리를 찾는 것이 아니라, 내가 이미 맞다고 믿는 것을 뒷받침해 줄 &#39;정당화의 수단&#39;을 찾는다는 냉혹한 현실을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in practice (관용표현): &#39;실제로는, 실행에 있어서는&#39;이라는 뜻으로 쓰이는 전치사구 표현이다.</div><div class=\"lec-gr-item\">most of the time (관용표현): &#39;대부분의 경우, 대개&#39;라는 의미를 나타내는 시간 부사적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">practice</td><td class=\"m\">연습</td></tr><tr><td class=\"w\">justification</td><td class=\"m\">정당화, 명분</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 단어들을 쇼핑한다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">shop for</span> words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~ 때문이 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">not because</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 아이디어들을 포함하고 있기</span><span class=\"en\"><b><span class=\"grammar-hl\">they contain ideas,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~ 때문이 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">but because</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 이야기를 담고 있기</span><span class=\"en\"><b><span class=\"grammar-hl\">they contain stories</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이디어들에 관한</span><span class=\"en\"><b>about ideas.</b></span></div></div><div class=\"lec-sent-ko\">우리는 그것들이 아이디어들을 포함하고 있어서가 아니라, 그것들이 아이디어들에 관한 이야기를 담고 있기 때문에 단어들을 쇼핑한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 우리가 정보를 소비하는 방식을 &#39;쇼핑&#39;에 비유합니다. 순수한 지적 내용(아이디어)보다는 나의 입맛에 맞게 가공된 내러티브(이야기)를 선호한다는 점을 강조하며, 객관성보다는 주관적인 만족을 추구하는 행태를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shop for (관용표현): &#39;~을 찾아 쇼핑하다, ~을 구하려 하다&#39;라는 의미의 구동사이다.</div><div class=\"lec-gr-item\">not because they contain ideas, but because they contain stories (관용표현): not A but B(A가 아니라 B) 구문의 변형으로, &#39;그것들이 아이디어를 포함하기 때문이 아니라, 이야기를 포함하기 때문에&#39;라는 상관접속사 구조를 이룬다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">contain</td><td class=\"m\">포함하다, 담고 있다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">종종</span><span class=\"en\"><b>Often</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 찾고 있는 것이 아니다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">are not seeking</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사실로서의 진술들을</span><span class=\"en\"><b>statements as facts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 알아내는 데 도움을 줄</span><span class=\"en\"><b><span class=\"grammar-hl\">to help</span> us figure out</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 무엇을 믿어야 할지</span><span class=\"en\"><b><span class=\"grammar-hl\">what we should believe</span>.</b></span></div></div><div class=\"lec-sent-ko\">종종 우리는 우리가 무엇을 믿어야 할지 알아내는 데 도움을 줄 사실로서의 진술들을 찾고 있는 것이 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 1번 문장에서 언급한 &#39;신념의 기초를 형성하기 위한 탐구&#39;를 부정합니다. 즉, 우리는 열린 마음으로 사실을 수집하여 결론을 내리는 것이 아니라는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are not seeking (현재진행): be동사(are) + 현재분사(seeking) 형태가 결합하여 현재 진행 중인 동작이나 상태를 나타낸다.</div><div class=\"lec-gr-item\">to help (to부정사): 앞의 명사인 facts를 뒤에서 수식하는 형용사적 용법으로 쓰여 &#39;~해줄&#39;이라는 의미를 더한다.</div><div class=\"lec-gr-item\">help us figure out 5형식(SVOC) 구조: 준사역동사 help + 목적어(us) + 목적보어(동사원형 figure out) 구조이다. help는 목적보어로 동사원형이나 to부정사를 모두 취할 수 있다.</div><div class=\"lec-gr-item\">what we should believe (간접의문문): 의문사(what) + 주어(we) + 동사(should believe) 어순의 명사절로, figure out의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">figure out</td><td class=\"m\">알아내다, 이해하다, 해결하다</td></tr><tr><td class=\"w\">seek</td><td class=\"m\">찾다, 구하다</td></tr><tr><td class=\"w\">statement</td><td class=\"m\">진술, 말</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대개</span><span class=\"en\"><b>Usually</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 이미 알고 있다</span><span class=\"en\"><b>we already know</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 무엇을 믿는지</span><span class=\"en\"><b><span class=\"grammar-hl\">what we believe</span>.</b></span></div></div><div class=\"lec-sent-ko\">대개 우리는 우리가 무엇을 믿는지 이미 알고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번 문장에 대한 이유입니다. 인간은 이미 선입견이나 기존의 신념을 가지고 있으며, 이는 흔들리지 않는 전제가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what we believe (간접의문문): 의문사(what) + 주어(we) + 동사(believe) 어순의 명사절로, 타동사 know의 목적어 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 찾는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">What we seek</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진술들이다</span><span class=\"en\"><b>are statements</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러한 신념들을 정당화할</span><span class=\"en\"><b><span class=\"grammar-hl\">to justify</span> those beliefs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 변호사의 방식인</span><span class=\"en\"><b>— the lawyer’s way.</b></span></div></div><div class=\"lec-sent-ko\">우리가 찾는 것은 그러한 신념들을 정당화할 진술들이며, (이것은) 변호사의 방식이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 2번 문장의 &#39;과학자의 방식&#39;과 대조되는 &#39;변호사의 방식&#39;을 제시합니다. 변호사가 의뢰인의 승소를 위해 유리한 증거만 찾듯이, 사람들도 자신의 기존 신념을 방어하기 위한 근거만을 수집한다는 논리적 귀결을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What we seek (관계대명사): 선행사를 포함한 관계대명사 what이 이끄는 절이 문장 전체의 주어 역할을 하며 &#39;~하는 것&#39;으로 해석된다.</div><div class=\"lec-gr-item\">to justify (to부정사): 앞의 명사인 statements를 수식하는 형용사적 용법으로 쓰여 &#39;정당화하기 위한&#39;이라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">seek</td><td class=\"m\">찾다, 구하다</td></tr><tr><td class=\"w\">statement</td><td class=\"m\">진술, 말</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">언어는</span><span class=\"en\"><b>Language</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋을지 모르지만</span><span class=\"en\"><b>might <span class=\"grammar-hl\">be good</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 기능에</span><span class=\"en\"><b><span class=\"grammar-hl\">for</span> this function</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 그것을 사용할 수 있다</span><span class=\"en\"><b>but we can use it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to do</span> better.</b></span></div></div><div class=\"lec-sent-ko\">언어는 이러한 기능에 좋을지 모르지만 우리는 더 잘하기 위해 그것(언어)을 사용할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현재의 문제점(언어를 정당화의 도구로만 쓰는 것)을 지적한 후, 변화의 가능성을 제시합니다. 언어에는 단순히 자기 신념을 방어하는 것 이상의 가치가 있음을 시사하며 분위기를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">be good for (관용표현): &#39;~에 유익하다, ~에 적절하다&#39;라는 의미의 형용사구 표현이다.</div><div class=\"lec-gr-item\">to do (to부정사): &#39;~하기 위하여&#39;라는 목적의 의미를 나타내는 부사적 용법으로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">언어를 대함으로써</span><span class=\"en\"><b>By <span class=\"grammar-hl\">treating</span> language</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 큰 존중으로</span><span class=\"en\"><b>with greater respect,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 성취할 수 있다</span><span class=\"en\"><b>we can achieve</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~ 이상을</span><span class=\"en\"><b><span class=\"grammar-hl\">more than</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단순한 자기방어</span><span class=\"en\"><b>simple self-defense.</b></span></div></div><div class=\"lec-sent-ko\">더 큰 존중으로 언어를 대함으로써, 우리는 단순한 자기방어 이상을 성취할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 결론에 해당합니다. 언어를 내 주장을 관철시키기 위한 도구로만 쓰지 않고, 진리를 탐구하는 본연의 가치로 존중할 때, 우리는 &#39;자기 합리화(자기방어)&#39;의 수준을 넘어 진정한 지적 성장에 도달할 수 있다는 교훈을 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">treating (동명사): 전치사 by의 목적어로 쓰여 &#39;~하는 것&#39;이라는 행위를 나타내는 명사 역할을 한다.</div><div class=\"lec-gr-item\">more than (관용표현): &#39;~보다 더 많은, ~ 이상의&#39;라는 의미로 비교를 나타내는 표현이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>이상적인 진리 탐구는 사실을 바탕으로 신념을 형성하는 &#39;과학자의 방식&#39;이다.</li><li>그러나 현실에서 인간은 이미 가진 신념을 확인받고 싶어 하는 &#39;정당화의 시장&#39;에 머문다.</li><li>이는 결론을 정해두고 유리한 근거만 찾는 &#39;변호사의 방식&#39;과 같다.</li><li>우리는 언어를 자기방어 도구로만 쓰지 말고, 더 높은 가치를 위해 존중하며 사용해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">While people generally use language to justify their pre-existing beliefs, we ought to treat it with greater respect to achieve a higher purpose beyond mere self-defense.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 일반적으로 기존의 신념을 정당화하기 위해 언어를 사용하지만, 단순한 자기방어를 넘어선 더 높은 목적을 달성하기 위해 언어를 더 존중하며 다루어야 한다.</div></div></div>"],"segs":[[{"audio":"./21_audio/1.mp3","hl":null}],[{"audio":"./21_audio/2.mp3","hl":null}],[{"audio":"./21_audio/3.mp3","hl":null},{"audio":"./21_audio/4.mp3","hl":"stage-0"},{"audio":"./21_audio/5.mp3","hl":"stage-1"},{"audio":"./21_audio/6.mp3","hl":"stage-2"},{"audio":"./21_audio/7.mp3","hl":"stage-3"}],[{"audio":"./21_audio/8.mp3","hl":null}],[{"audio":"./21_audio/9.mp3","hl":"main"},{"audio":"./21_audio/10.mp3","hl":"meaning"},{"audio":"./21_audio/11.mp3","hl":"grammar"}],[{"audio":"./21_audio/12.mp3","hl":"main"},{"audio":"./21_audio/13.mp3","hl":"meaning"},{"audio":"./21_audio/14.mp3","hl":"grammar"}],[{"audio":"./21_audio/15.mp3","hl":"main"},{"audio":"./21_audio/16.mp3","hl":"meaning"},{"audio":"./21_audio/17.mp3","hl":"grammar"}],[{"audio":"./21_audio/18.mp3","hl":"main"},{"audio":"./21_audio/19.mp3","hl":"meaning"},{"audio":"./21_audio/20.mp3","hl":"grammar"}],[{"audio":"./21_audio/21.mp3","hl":"main"},{"audio":"./21_audio/22.mp3","hl":"meaning"},{"audio":"./21_audio/23.mp3","hl":"grammar"}],[{"audio":"./21_audio/24.mp3","hl":"main"},{"audio":"./21_audio/25.mp3","hl":"meaning"},{"audio":"./21_audio/26.mp3","hl":"grammar"}],[{"audio":"./21_audio/27.mp3","hl":"main"},{"audio":"./21_audio/28.mp3","hl":"meaning"},{"audio":"./21_audio/29.mp3","hl":"grammar"}],[{"audio":"./21_audio/30.mp3","hl":"main"},{"audio":"./21_audio/31.mp3","hl":"meaning"},{"audio":"./21_audio/32.mp3","hl":"grammar"}],[{"audio":"./21_audio/33.mp3","hl":"main"},{"audio":"./21_audio/34.mp3","hl":"meaning"},{"audio":"./21_audio/35.mp3","hl":"grammar"}],[{"audio":"./21_audio/36.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.s
