여 식물이 자라기 힘든 환경이었다.</li><li>낮은 증발량으로 인한 적은 강수량 (less rain)</li><li>식물이 자라기(plants to grow) 매우 어려운 조건</li><li>핵심 키워드: 춥고 건조함(cold and dry)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02농경이 불가능했던 위험 요소</div><ul><li>불확실한 기후 조건에서 특정 토지의 수확에만 의존하는 것은 생존에 위험했다.</li><li>농업(farming)은 선택 가능한 옵션이 아니었음</li><li>한 곳의 토지에 의존(depend on land)하는 것의 위험성</li><li>핵심 키워드: 에너지 생산(produce energy)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03기온 상승과 생태계의 변화</div><ul><li>빙하가 녹고 기온이 오르면서 지구상에 생명체가 폭발적으로 증가했다.</li><li>빙하가 녹으며(ice caps melted) 따뜻하고 습한 기후 형성</li><li>생명력의 갑작스러운 폭발(sudden explosion of life) 발생</li><li>핵심 키워드: 기온 상승(temperature rose)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04농경 사회로의 점진적 전환</div><ul><li>인류는 수렵 채집을 지속하는 동시에 점차 농경을 병행하며 정착하기 시작했다.</li><li>식량이 잘 자라는 곳으로의 이주 및 정착</li><li>수렵 채집인(hunter-gatherers)의 농사 병행</li><li>핵심 키워드: 수천 년간의 점진적 변화(thousands of years)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">planet</td><td class=\"m\">행성</td></tr><tr><td class=\"w\">sheet</td><td class=\"m\">(종이) 한 장</td></tr><tr><td class=\"w\">cover</td><td class=\"m\">덮다, 씌우다</td></tr><tr><td class=\"w\">hemisphere</td><td class=\"m\">(지구·뇌 등의) 반구</td></tr><tr><td class=\"w\">crucial</td><td class=\"m\">매우 중요한</td></tr><tr><td class=\"w\">depend on</td><td class=\"m\">~에 달려 있다, ~에 의존하다</td></tr><tr><td class=\"w\">climate</td><td class=\"m\">기후</td></tr><tr><td class=\"w\">option</td><td class=\"m\">선택(권)</td></tr><tr><td class=\"w\">produce</td><td class=\"m\">생산하다, 만들어 내다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">temperature</td><td class=\"m\">온도, 기온</td></tr><tr><td class=\"w\">experienced</td><td class=\"m\">겪었다, 경험했다</td></tr><tr><td class=\"w\">explosion</td><td class=\"m\">폭발, 급증</td></tr><tr><td class=\"w\">associate</td><td class=\"m\">연관 짓다, 연상하다</td></tr><tr><td class=\"w\">evaporation</td><td class=\"m\">증발</td></tr><tr><td class=\"w\">meaning</td><td class=\"m\">의미, 뜻</td></tr><tr><td class=\"w\">intensive</td><td class=\"m\">집중적인</td></tr><tr><td class=\"w\">overnight</td><td class=\"m\">하룻밤 사이에</td></tr><tr><td class=\"w\">forage</td><td class=\"m\">먹이를 찾다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빙하기 동안,</span><span class=\"en\"><b>During the Ice Age,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구는 ~했을 뿐만 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">not only was the planet</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 추웠을 (뿐만 아니라),</span><span class=\"en\"><b>much colder,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얼음층이 뒤덮은 채로</span><span class=\"en\"><b>with <span class=\"grammar-hl\">ice sheets covering</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 ~라고 부르는 지역의 대부분을</span><span class=\"en\"><b>much of <span class=\"grammar-hl\">what we call</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘날 북반구라고,</span><span class=\"en\"><b>the northern hemisphere today,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 결정적으로,</span><span class=\"en\"><b>but, crucially,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 훨씬 더 건조했다.</span><span class=\"en\"><b>it was much drier.</b></span></div></div><div class=\"lec-sent-ko\">빙하기 동안, 지구는, 오늘날 우리가 북반구라고 부르는 지역의 대부분을 얼음층이 뒤덮은 채로, 훨씬 더 추웠을 뿐만 아니라, 결정적으로, 훨씬 더 건조했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 빙하기의 특징을 설명하며 글을 시작합니다. 흔히 빙하기 하면 &#39;추위&#39;만 떠올리기 쉽지만, 이 문장에서는 &#39;건조함&#39;이 매우 중요한 핵심(crucially)이었음을 강조하며 이후 전개될 내용의 복선을 깔고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">not only was the planet (도치): 부정어구인 not only가 문장 맨 앞에 위치하여 주어(the planet)와 be동사(was)의 어순이 바뀐 도치 구문이다.</div><div class=\"lec-gr-item\">ice sheets covering (현재분사(형용사)): covering이 명사인 ice sheets를 뒤에서 수식하며 &#39;~을 덮고 있는&#39;이라는 의미를 나타낸다. (ice sheets that were covering 구조)</div><div class=\"lec-gr-item\">what we call (관계대명사): 선행사를 포함한 관계대명사 what이 쓰여 &#39;~라고 부르는 것&#39;이라는 의미의 명사절을 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">planet</td><td class=\"m\">행성</td></tr><tr><td class=\"w\">sheet</td><td class=\"m\">(종이) 한 장</td></tr><tr><td class=\"w\">cover</td><td class=\"m\">덮다, 씌우다</td></tr><tr><td class=\"w\">hemisphere</td><td class=\"m\">(지구·뇌 등의) 반구</td></tr><tr><td class=\"w\">crucial</td><td class=\"m\">매우 중요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아일랜드에서,</span><span class=\"en\"><b>In Ireland,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 종종 연관짓는다</span><span class=\"en\"><b>we often <span class=\"grammar-hl\">associate</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">추위를 습함과</span><span class=\"en\"><b><span class=\"grammar-hl\">the cold with the wet</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 정말 춥다면,</span><span class=\"en\"><b>but if it is really cold,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 적은 증발 작용이 있고,</span><span class=\"en\"><b>there is far less evaporation,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구름도 더 적으며 비도 더 적다.</span><span class=\"en\"><b>fewer clouds, and less rain.</b></span></div></div><div class=\"lec-sent-ko\">아일랜드에서, 우리는 종종 추위를 습함과 연관짓지만, 정말 춥다면, 증발 작용이 훨씬 더 적고, 구름도 더 적으며, 비도 더 적다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;건조함&#39;이 왜 발생하는지 과학적 근거를 들어 설명합니다. 독자들이 가질 수 있는 상식(추우면 축축하다)을 뒤집으며, 극심한 추위가 기온뿐만 아니라 습도(강수량)를 낮추는 원리를 제시하여 논리적 타당성을 확보합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">associate the cold with the wet (관용표현): associate A with B (A를 B와 연관시키다/결부시키다)라는 숙어적 표현이 사용되었다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">associate</td><td class=\"m\">연관 짓다, 연상하다</td></tr><tr><td class=\"w\">evaporation</td><td class=\"m\">증발</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">빙하기의 우리 지구는</span><span class=\"en\"><b>Our world in the Ice Age</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">춥고 건조했다,</span><span class=\"en\"><b>was cold and dry,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">meaning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(그것이) 어렵다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">it was difficult</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식물이 자라기에.</span><span class=\"en\"><b><span class=\"grammar-hl\">for plants to grow</span>.</b></span></div></div><div class=\"lec-sent-ko\">빙하기의 우리 지구는 춥고 건조했는데, 이는 식물이 자라기 어렵다는 것을 의미했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 기후 특징(추위와 건조함)이 생태계에 미친 직접적인 결과를 설명합니다. 식물 성장의 필수 조건인 온도와 수분이 부족했기 때문에 식생이 빈약할 수밖에 없었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">meaning (분사구문): 앞 문장 전체의 내용을 부연 설명하는 분사구문으로, and it meant 또는 which meant와 같은 형태의 절로 변환할 수 있다.</div><div class=\"lec-gr-item\">it was difficult for plants to grow (가주어): 진주어: it은 가주어이고, to grow 이하가 실제 주어인 진주어이다. for plants는 to부정사의 동작을 수행하는 의미상 주어이다.</div><div class=\"lec-gr-item\">to grow (to부정사): 문장의 진짜 주어(진주어) 역할을 하는 명사적 용법으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">meaning</td><td class=\"m\">의미, 뜻</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 유형의 기후에서,</span><span class=\"en\"><b>In this type of climate,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">농사는 선택지가 아니다:</span><span class=\"en\"><b>farming isn’t an option:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(그것은) 너무 위험하다</span><span class=\"en\"><b><span class=\"grammar-hl\">it’s too risky</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의존하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to depend</span> on</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어느 한 조각의 땅에</span><span class=\"en\"><b>any one piece of land</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생산하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to produce</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 필요한 에너지를.</span><span class=\"en\"><b>the energy <span class=\"grammar-hl\">you need</span>.</b></span></div></div><div class=\"lec-sent-ko\">이런 유형의 기후에서, 농사는 선택지가 아니다. 즉, 당신이 필요한 에너지를 생산하려고 어느 한 조각의 땅에 의존하는 것은 너무 위험하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 척박한 환경이 인간의 생존 방식에 준 영향을 설명합니다. 식물이 잘 자라지 않는 환경에서는 정착하여 농사를 짓는 것이 불가능하며, 이는 곧 유목이나 수렵 채집이 생존의 필수 방식이었음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it’s too risky to depend (가주어): 진주어: it은 가주어이며, 실제 주어는 to depend 이하의 to부정사구인 진주어 구조이다.</div><div class=\"lec-gr-item\">to depend (to부정사): 문장의 진짜 주어(진주어) 역할을 하는 명사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">to produce (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~을 생산하기 위해서&#39;라는 의미로 앞의 동사구나 명사를 수식한다.</div><div class=\"lec-gr-item\">you need (관계대명사): energy 뒤에 목적격 관계대명사(that/which)가 생략된 구조로, 관계대명사절이 선행사 energy를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">depend on</td><td class=\"m\">~에 달려 있다, ~에 의존하다</td></tr><tr><td class=\"w\">climate</td><td class=\"m\">기후</td></tr><tr><td class=\"w\">option</td><td class=\"m\">선택(권)</td></tr><tr><td class=\"w\">produce</td><td class=\"m\">생산하다, 만들어 내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">온도가 상승하고</span><span class=\"en\"><b><span class=\"grammar-hl\">As the temperature rose</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만년설이 녹으면서,</span><span class=\"en\"><b>and the ice caps melted,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 경험했다</span><span class=\"en\"><b>we experienced</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갑작스러운 생명의 폭발을.</span><span class=\"en\"><b>a sudden explosion of life.</b></span></div></div><div class=\"lec-sent-ko\">온도가 상승하고 만년설이 녹으면서, 우리는 갑작스러운 생명의 폭발을 경험했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 흐름이 반전되는 지점입니다. 빙하기가 끝나고 기온이 상승함에 따라 환경이 급격히 변했으며, 이에 따라 생태계가 활성화되었음을 &#39;생명의 폭발&#39;이라는 표현으로 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As the temperature rose 접속사: as가 시간이나 상황의 변화를 나타내는 접속사로 쓰여 &#39;~함에 따라&#39;라는 의미의 부사절을 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">temperature</td><td class=\"m\">온도, 기온</td></tr><tr><td class=\"w\">experienced</td><td class=\"m\">겪었다, 경험했다</td></tr><tr><td class=\"w\">explosion</td><td class=\"m\">폭발, 급증</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지구는 되었다</span><span class=\"en\"><b>The world got</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 따뜻하고 습하게,</span><span class=\"en\"><b>warmer and wetter,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 사람들은 살기 시작했다</span><span class=\"en\"><b>and people started <span class=\"grammar-hl\">to live</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장소 주변에</span><span class=\"en\"><b>around places</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식량이 자라게 할 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">where they could make food grow</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 집약적으로.</span><span class=\"en\"><b>most intensively.</b></span></div></div><div class=\"lec-sent-ko\">지구는 더 따뜻하고 습해졌고, 그리고 사람들은 식량이 가장 집약적으로 자라게 할 수 있는 장소 주변에 살기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 변화된 기후(온난, 습윤)가 인간의 거주 패턴을 바꾸었음을 설명합니다. 4번 문장의 &#39;농사 불가능&#39; 상황에서 벗어나, 이제는 농경이 가능해지면서 정착 생활이 시작되었음을 논리적으로 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to live (to부정사): 동사 started의 목적어 역할을 하는 명사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">where they could make food grow (관계부사): 선행사인 places를 수식하며, 관계부사 where 뒤에는 주어(they)와 동사(could make)를 갖춘 완전한 문장이 이어진다.</div><div class=\"lec-gr-item\">make food grow (5형식(SVOC)): 사역동사 make + 목적어(food) + 목적격 보어(grow) 구조로, 목적격 보어 자리에 동사원형인 grow가 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intensive</td><td class=\"m\">집중적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 하룻밤 사이에 일어나지 않았다;</span><span class=\"en\"><b>This didn’t happen overnight;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 아마도 걸렸을 것이다</span><span class=\"en\"><b>it probably took</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수천 년이,</span><span class=\"en\"><b>thousands of years,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수렵채집인들이</span><span class=\"en\"><b>with <span class=\"grammar-hl\">hunter-gatherers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">채집과 사냥을 하면서,</span><span class=\"en\"><b><span class=\"grammar-hl\">foraging and hunting</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하는 동안</span><span class=\"en\"><b><span class=\"grammar-hl\">while doing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">농사로 부업을 조금씩.</span><span class=\"en\"><b>a little side hustle in <span class=\"grammar-hl\">farming</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 하룻밤 사이에 일어나지 않았고, 수렵채집인들이, 농사로 부업을 조금씩 하는 동안, 채집과 사냥을 하면서, 그것은 아마도 수천 년이 걸렸을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막으로 이 변화의 과정이 점진적이었음을 설명합니다. 수렵 채집에서 농경 정착으로의 이행이 단칼에 무 자르듯 일어난 것이 아니라, 오랜 기간 두 방식이 공존하며 서서히 변화했음을 보여주며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hunter-gatherers foraging and hunting (현재분사(형용사)): foraging과 hunting이 명사인 hunter-gatherers를 수식하여 &#39;식량을 찾아다니고 사냥하는 수렵 채집인들&#39;이라는 의미를 만든다. (hunter-gatherers who were foraging and hunting 구조)</div><div class=\"lec-gr-item\">while doing (분사구문): 접속사 while을 생략하지 않은 분사구문으로, while they did/were doing의 절로 변환할 수 있으며 동시동작을 나타낸다.</div><div class=\"lec-gr-item\">farming (동명사): 전치사 in의 목적어 역할을 하는 명사적 성격의 동명사로 쓰여 &#39;농사짓기&#39;라는 행위를 의미한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">overnight</td><td class=\"m\">하룻밤 사이에</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>빙하기는 단순히 추운 것이 아니라 매우 건조하여 식물이 자라기 힘든 환경이었다.</li><li>이러한 척박한 기후 조건 때문에 빙하기 인류는 위험 부담이 큰 농사를 지을 수 없었다.</li><li>빙하기 이후 기온과 습도가 올라가면서 생태계가 풍성해졌고, 인류는 정착 농경의 가능성을 발견했다.</li><li>수렵 채집 생활에서 농경 사회로의 전환은 수천 년에 걸쳐 점진적으로 이루어졌다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The harsh and dry conditions of the Ice Age severely restricted plant growth until a warmer and wetter climate emerged to facilitate the gradual transition from hunter-gathering to intensive farming.</div>\n              <div class=\"lec-final-sum-ko\">빙하기의 혹독하고 건조한 조건은 식물 성장을 심하게 제한했으나, 더 따뜻하고 습한 기후가 나타나면서 수렵 채집에서 집약적 농업으로의 점진적 전환을 가능하게 했다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_36번_강의_audio/14.mp3","
