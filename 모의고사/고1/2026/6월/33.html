Source)에 의존하여 표현하는 독특한 언어적 습관을 갖게 된 것이랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01후각 묘사의 어려움</div><ul><li>냄새를 설명하는 것은 가장 기초적인 소통 방식이지만 언어적으로 매우 어렵다.</li><li>색깔(color)을 묘사하는 단어와 달리 냄새만을 지칭하는 고유한 단어가 부족함</li><li>후각적 경험(olfactory experience)을 표현하는 데 있어 언어적 한계가 존재함</li><li>핵심 키워드: 언어적 도전(challenging)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02근원에 의존하는 표현 방식</div><ul><li>인간은 냄새 자체의 이름 대신 냄새가 나는 대상을 빌려 표현한다.</li><li>냄새의 근원(source)을 언급하여 설명하는 방식을 취함</li><li>꽃 같은(flowery), 과일 같은(fruity), 비린내 나는(fishy) 등의 비유적 표현 사용</li><li>핵심 키워드: 묘사 방식(describe)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03맥락에 따른 식별 능력의 차이</div><ul><li>익숙한 냄새일지라도 평소와 다른 상황에서는 이름을 알아맞히기 힘들다.</li><li>익숙한 맥락(usual context)을 벗어나면 식별(identify)하기 매우 어려움</li><li>실험 결과 대다수가 맥주나 장미 등 흔한 냄새(common odors)의 이름을 대지 못함</li><li>핵심 키워드: 식별의 난관(difficult to identify)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04뇌의 진화와 후각 반응</div><ul><li>인간의 뇌는 냄새를 언어로 명명하기보다 생존을 위해 반응하도록 진화했다.</li><li>이름은 몰라도 맥주와 소변을 구분하는 등 적절하게 반응(respond)함</li><li>진화(evolution)는 인간의 뇌가 냄새를 설명하는 능력보다 반응하는 능력을 갖추게 함</li><li>핵심 키워드: 진화적 형성(evolution has shaped our brain)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">olfactory</td><td class=\"m\">후각의</td></tr><tr><td class=\"w\">challenging</td><td class=\"m\">힘든, 어려운</td></tr><tr><td class=\"w\">describe</td><td class=\"m\">묘사하다, 서술하다</td></tr><tr><td class=\"w\">source</td><td class=\"m\">원천, 출처</td></tr><tr><td class=\"w\">odor</td><td class=\"m\">냄새</td></tr><tr><td class=\"w\">familiar</td><td class=\"m\">익숙한, 친숙한</td></tr><tr><td class=\"w\">identify</td><td class=\"m\">확인하다, 알아보다</td></tr><tr><td class=\"w\">experienced</td><td class=\"m\">경험이 많은, 노련한</td></tr><tr><td class=\"w\">usual</td><td class=\"m\">보통의, 평소의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">context</td><td class=\"m\">맥락, 문맥</td></tr><tr><td class=\"w\">experiment</td><td class=\"m\">실험</td></tr><tr><td class=\"w\">majority</td><td class=\"m\">다수, 대부분</td></tr><tr><td class=\"w\">participant</td><td class=\"m\">참가자</td></tr><tr><td class=\"w\">common</td><td class=\"m\">흔한, 공통의</td></tr><tr><td class=\"w\">motor</td><td class=\"m\">모터, 엔진</td></tr><tr><td class=\"w\">obviously</td><td class=\"m\">분명히</td></tr><tr><td class=\"w\">evolution</td><td class=\"m\">진화</td></tr><tr><td class=\"w\">correct</td><td class=\"m\">올바른, 정확한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 것이 무슨 냄새가 나는지에 관해 이야기하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Talking about</span> <span class=\"grammar-hl\">what something smells like</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 기본적인 방식이다</span><span class=\"en\"><b>is the most basic way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 후각 경험에 관해 이야기하는</span><span class=\"en\"><b>of <span class=\"grammar-hl\">talking about</span> our olfactory experience,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 이 가장 기본적인 방식조차</span><span class=\"en\"><b>and even this most basic way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">냄새에 관해 이야기하는</span><span class=\"en\"><b>of <span class=\"grammar-hl\">talking about</span> smells</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어렵다.</span><span class=\"en\"><b>is <span class=\"grammar-hl\">challenging</span>.</b></span></div></div><div class=\"lec-sent-ko\">어떤 것이 무슨 냄새가 나는지에 관해 이야기하는 것은 우리의 후각 경험에 관해 이야기하는 가장 기본적인 방식인데, 냄새에 관해 이야기하는 이 가장 기본적인 방식조차도 어렵다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 냄새를 묘사하는 것이 인간의 감각 경험 중 아주 기초적인 부분임에도 불구하고, 이를 언어로 표현하는 데는 예상외로 큰 어려움이 따른다는 화두를 던지며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Talking about (동명사): 명사 역할을 하여 문장의 주어로 쓰였으며, &#39;~하는 것&#39;으로 해석한다.</div><div class=\"lec-gr-item\">what something smells like (간접의문문): 의문사(what) + 주어(something) + 동사(smells like) 어순으로 전치사 about의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">challenging (현재분사(형용사)): 주어의 상태를 설명하는 주격 보어 역할을 하며, &#39;어려운/도전적인&#39;이라는 의미의 형용사로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">olfactory</td><td class=\"m\">후각의</td></tr><tr><td class=\"w\">challenging</td><td class=\"m\">힘든, 어려운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단어가 없다</span><span class=\"en\"><b>There are no words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영어에는</span><span class=\"en\"><b>in the English language</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">냄새를 묘사하는</span><span class=\"en\"><b><span class=\"grammar-hl\">to describe</span> smells</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">똑같은 방식으로</span><span class=\"en\"><b>in the same way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘파랑’이나 ‘초록’이 색을 묘사하는.</span><span class=\"en\"><b><span class=\"grammar-hl\">in which</span> “blue” or “green” describe colors.</b></span></div></div><div class=\"lec-sent-ko\">영어에는 ‘파랑’이나 ‘초록’이 색을 묘사하는 것과 같은 방식으로 냄새를 묘사하는 단어가 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;어려움&#39;의 구체적인 이유를 제시합니다. 시각은 &#39;파랑&#39;처럼 그 색 자체를 지칭하는 추상적 단어가 발달해 있지만, 후각은 그런 전용 어휘가 부족하다는 점을 대조적으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to describe to부정사(형용사적 용법): 명사 words를 뒤에서 수식하여 &#39;~하는/할&#39;의 의미를 더한다.</div><div class=\"lec-gr-item\">in which 전치사 + 관계대명사: 전치사 + 관계대명사 + S + V 구조로, 관계대명사 뒤에는 주어(blue or green)와 동사(describe), 목적어(colors)가 갖춰진 완전한 절이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">describe</td><td class=\"m\">묘사하다, 서술하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신에,</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 것이 어떤 냄새가 나는지 말하기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">to talk about</span> <span class=\"grammar-hl\">how something smells</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 이야기한다</span><span class=\"en\"><b>we talk about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 냄새의 근원에 관해.</span><span class=\"en\"><b>the source of the odor.</b></span></div></div><div class=\"lec-sent-ko\">대신, 어떤 것의 냄새가 어떤지에 관해 이야기하기 위해서, 우리는 그 냄새의 근원에 관해 이야기한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 후각 전용 어휘가 없는 한계를 극복하기 위해 인간이 사용하는 대안적 방법을 설명합니다. 냄새 그 자체가 아니라 냄새를 풍기는 &#39;대상(원천)&#39;의 이름을 빌려 표현한다는 논리적 연결입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to talk about to부정사(부사적 용법): 문장 전체를 수식하며 목적(~하기 위해서)의 의미를 나타낸다.</div><div class=\"lec-gr-item\">how something smells (간접의문문): 의문사(how) + 주어(something) + 동사(smells) 어순으로 전치사 about의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">source</td><td class=\"m\">원천, 출처</td></tr><tr><td class=\"w\">odor</td><td class=\"m\">냄새</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 것들은 ~한 냄새가 난다</span><span class=\"en\"><b>Things smell</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘꽃 같은’, ‘과일 같은’, 또는 ‘생선 같은’.</span><span class=\"en\"><b>“flowery,” “fruity,” or “fishy.”</b></span></div></div><div class=\"lec-sent-ko\">사람들은 ‘꽃 같은’, ‘과일 같은’, 또는 ‘생선 같은’ 냄새가 난다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 설명한 &#39;냄새 원천&#39;을 이용한 묘사의 구체적인 사례(꽃, 과일, 생선)를 나열하여 독자의 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Things smell “ “flowery,” “fruity,” or “fishy 5형식(SVOC) 구조: 여기서는 2형식 구조로 쓰였으며, 감각동사 smell 뒤에 주격보어로 형용사(flowery, fruity, fishy)들이 와서 주어의 상태를 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게다가,</span><span class=\"en\"><b>Furthermore,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 익숙한 냄새조차</span><span class=\"en\"><b>even the most familiar odors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식별하기 어렵다</span><span class=\"en\"><b>are difficult <span class=\"grammar-hl\">to identify</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 경험되지 않을 때</span><span class=\"en\"><b>when they <span class=\"grammar-hl\">are not experienced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일상의 맥락에서.</span><span class=\"en\"><b>in their usual context.</b></span></div></div><div class=\"lec-sent-ko\">게다가, 가장 익숙한 냄새조차도 일상의 맥락에서 경험되지 않을 때는 식별하기 어렵다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 언어적 표현의 한계에 더해, 후각 인지가 &#39;맥락(상황)&#39;에 크게 의존한다는 추가적인 제약 사항을 제시하며 논의를 심화시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to identify to부정사(부사적 용법): 형용사 difficult를 수식하여 &#39;~하기에&#39;라는 판단의 기준을 나타낸다.</div><div class=\"lec-gr-item\">are not experienced (수동태): be동사(are)+p.p.(experienced) 구조. experience는 타동사인데 뒤에 목적어가 없어서 수동구조 are not experienced 형태로 쓴다. 기본구조: V + O</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">odor</td><td class=\"m\">냄새</td></tr><tr><td class=\"w\">familiar</td><td class=\"m\">익숙한, 친숙한</td></tr><tr><td class=\"w\">identify</td><td class=\"m\">확인하다, 알아보다</td></tr><tr><td class=\"w\">experienced</td><td class=\"m\">경험이 많은, 노련한</td></tr><tr><td class=\"w\">usual</td><td class=\"m\">보통의, 평소의</td></tr><tr><td class=\"w\">context</td><td class=\"m\">맥락, 문맥</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 실험에서</span><span class=\"en\"><b>In one experiment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">참가자 대다수는</span><span class=\"en\"><b>the majority of participants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이름을 댈 수 없었다</span><span class=\"en\"><b>was unable <span class=\"grammar-hl\">to name</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 흔한 냄새들의</span><span class=\"en\"><b>very common odors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맥주, 소변, 장미, 또는 모터 오일 같은.</span><span class=\"en\"><b>like beer, urine, roses, or motor oil.</b></span></div></div><div class=\"lec-sent-ko\">한 실험에서 참가자 대다수는 맥주, 소변, 장미, 또는 모터 오일 같은 매우 흔한 냄새의 이름을 댈 수 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 주장을 뒷받침하는 구체적인 실험 증거입니다. 익숙한 냄새라도 시각적 정보나 상황적 맥락이 제거되면 그 이름을 떠올리기 힘들다는 점을 증명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to name to부정사(부사적 용법): 형용사적 성격의 보어 unable을 수식하여 &#39;~하기에&#39;의 의미로 구조를 보강한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">odor</td><td class=\"m\">냄새</td></tr><tr><td class=\"w\">experiment</td><td class=\"m\">실험</td></tr><tr><td class=\"w\">majority</td><td class=\"m\">다수, 대부분</td></tr><tr><td class=\"w\">participant</td><td class=\"m\">참가자</td></tr><tr><td class=\"w\">common</td><td class=\"m\">흔한, 공통의</td></tr><tr><td class=\"w\">motor</td><td class=\"m\">모터, 엔진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">분명하게,</span><span class=\"en\"><b>Obviously,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이름을 대지 못한 사람들조차</span><span class=\"en\"><b>even those <span class=\"grammar-hl\">who couldn’t name</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 냄새들 중 어떤 것도</span><span class=\"en\"><b><span class=\"grammar-hl\">any of these odors</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맥주는 마실 것이다</span><span class=\"en\"><b>would drink the beer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 소변이나 모터 오일은 아닐 것이다.</span><span class=\"en\"><b>but not the urine or the motor oil.</b></span></div></div><div class=\"lec-sent-ko\">분명하게, 이 냄새들 중 어떤 것도 이름을 대지 못한 사람들조차도 맥주는 마셔도 소변이나 모터 오일은 마시지 않을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;이름 대기(언어적 능력)&#39;와 &#39;올바른 반응(생존 본능)&#39;을 날카롭게 대조합니다. 냄새를 언어로 정의하지 못한다고 해서 그 실체를 구분하지 못하는 것은 아님을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who couldn’t name any of these odors (관계대명사): 주격 관계대명사 who가 이끄는 절이 선행사 those를 수식하며, 절 내부에서 who는 주어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">odor</td><td class=\"m\">냄새</td></tr><tr><td class=\"w\">motor</td><td class=\"m\">모터, 엔진</td></tr><tr><td class=\"w\">obviously</td><td class=\"m\">분명히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것이 ~이다</span><span class=\"en\"><b>This is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방식</span><span class=\"en\"><b><span class=\"grammar-hl\">how evolution</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진화가 우리 뇌를 형성해 온</span><span class=\"en\"><b><span class=\"grammar-hl\">has shaped our brain</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 냄새에 정확하게 반응한다</span><span class=\"en\"><b>We respond to odors correctly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러 다른 방식으로</span><span class=\"en\"><b>in many different ways,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 우리는 능력이 잘 갖추어져 있지 않다</span><span class=\"en\"><b>but we <span class=\"grammar-hl\">are not well-equipped</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들에 대해 이야기할.</span><span class=\"en\"><b><span class=\"grammar-hl\">to talk about</span> them.</b></span></div></div><div class=\"lec-sent-ko\">이것이 진화가 우리 뇌를 형성해 온 방식이다. 우리는 여러 다른 방식으로 냄새에 정확하게 반응하지만, 그에 대해 이야기할 채비가 잘 되어 있지 않다(능력이 잘 갖추어져 있지 않다).</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전체 글의 결론입니다. 인간의 뇌는 진화 과정에서 냄새를 &#39;설명&#39;하기보다는 생존을 위해 &#39;즉각 반응&#39;하는 방향으로 최적화되었음을 요약하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how evolution has shaped our brain (간접의문문): 의문사(how) + 주어(evolution) + 동사(has shaped) 어순으로 be동사 is 뒤에서 보어 역할을 한다.</div><div class=\"lec-gr-item\">are not well-equipped (수동태): be동사(are)+p.p.(equipped) 구조. equip는 타동사인데 뒤에 목적어가 없어서 수동구조 are not well-equipped 형태로 쓴다. 기본구조: equip A with B (A에게 B를 갖추게 하다)</div><div class=\"lec-gr-item\">to talk about to부정사(부사적 용법): 형용사 역할을 하는 분사 equipped를 수식하여 &#39;~하기에&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">odor</td><td class=\"m\">냄새</td></tr><tr><td class=\"w\">evolution</td><td class=\"m\">진화</td></tr><tr><td class=\"w\">correct</td><td class=\"m\">올바른, 정확한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>후각 경험을 언어로 표현하는 것은 매우 기초적이지만 동시에 매우 어려운 일이다.</li><li>후각은 시각과 달리 전용 어휘가 부족하여 주로 냄새의 원천(대상)을 빌려 표현한다.</li><li>인간은 맥락이 주어지지 않으면 익숙한 냄새의 이름조차 제대로 맞히지 못하는 경향이 있다.</li><li>이는 진화 과정에서 인간의 뇌가 냄새에 대해 &#39;말하기&#39;보다는 생존을 위해 &#39;반응하기&#39;에 최적화되었기 때문이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Although humans lack a specific vocabulary to describe smells, they are evolutionarily designed to respond appropriately to various odors.</div>\n              <div class=\"lec-final-sum-ko\">인간은 냄새를 묘사하는 특정 어휘가 부족함에도 불구하고, 다양한 냄새에 적절하게 반응하도록 진화적으로 설계되어 있다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_06월_33번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_33번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_33번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_06월_33번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_06월_33번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_06월_33번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_06월_33번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2026년_06월_33번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_
