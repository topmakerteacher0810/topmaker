cover-title\">Literature: A Timeless Bridge to the Human Spirit<small>문학: 인간 정신을 잇는 시대를 초월한 가교</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">문학을 읽으며 타인의 삶에 깊이 몰입하는 과정은 심리학에서 말하는 서사적 공감(Narrative Empathy)과 밀접하게 연결되어 있습니다. 우리가 소설 속 인물의 감정을 생생하게 느끼는 것은 뇌의 거울 신경세포(Mirror Neurons)가 활성화되기 때문인데, 이러한 경험은 타인의 의도와 감정을 이해하는 능력인 마음 이론(Theory of Mind)을 발달시키는 데 큰 도움을 줍니다. 시공간을 초월하여 사랑이나 고통 같은 보편적 가치(Universal Values)를 다루는 문학은 독자에게 삶의 근본적인 인간 조건(Human Condition)을 성찰하게 만드는 거울과 같은 역할을 합니다. 결국 문학이란 단순히 글자를 읽는 행위를 넘어, 다양한 인물과 상황을 간접 체험하며 정서적 지능을 높이는 일종의 사회적 시뮬레이션(Social Simulation)이라고 할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문학의 본질적 가치</div><ul><li>문학은 시공간을 초월하여 인간의 창의성과 표현력을 보여주는 증거이다.</li><li>인간 창의성(human creativity)과 표현의 증거</li><li>서로 다른 시대와 문화의 사람들을 연결함</li><li>핵심 키워드: 시공간 초월(transcending time and space)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02변화 속의 지속성</div><ul><li>기술 발전과 미디어 환경의 변화 속에서도 문학은 시대를 초월한 예술 형식으로 남아 있다.</li><li>새로운 기술(new technologies)의 부상에도 건재함</li><li>시대를 초월한 예술 형태(timeless art form)로서의 중요성 유지</li><li>핵심 키워드: 지속적인 힘(enduring power)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03인간 경험의 포착</div><ul><li>문학은 복잡한 인간의 경험을 깊이 있게 담아내고 전달하는 독특한 능력을 갖추고 있다.</li><li>인간 감정의 깊이와 관계의 미묘함(nuances) 탐구</li><li>인간 정신(human spirit)의 도전과 승리를 기록함</li><li>핵심 키워드: 인간 경험의 복잡성(complexities of the human experience)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04성찰과 공감의 확장</div><ul><li>독자는 문학을 통해 타인과 공감하고 인간에 대한 깊은 이해를 얻게 된다.</li><li>책 속에서 자신의 모습이 투영(reflected)된 것을 발견함</li><li>자신과 다른 인물들에 대한 공감(empathize) 형성</li><li>핵심 키워드: 인간 조건(human condition)에 대한 이해</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">literature</td><td class=\"m\">문학</td></tr><tr><td class=\"w\">essence</td><td class=\"m\">본질</td></tr><tr><td class=\"w\">endure</td><td class=\"m\">오래가는, 지속되는</td></tr><tr><td class=\"w\">creativity</td><td class=\"m\">창의력</td></tr><tr><td class=\"w\">transcend</td><td class=\"m\">초월하다</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정</td></tr><tr><td class=\"w\">despite</td><td class=\"m\">~에도 불구하고</td></tr><tr><td class=\"w\">landscape</td><td class=\"m\">풍경, 경치</td></tr><tr><td class=\"w\">retain</td><td class=\"m\">유지하다, 간직하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relevance</td><td class=\"m\">타당성, 관련성, 적합성</td></tr><tr><td class=\"w\">significance</td><td class=\"m\">중요성, 의미</td></tr><tr><td class=\"w\">form</td><td class=\"m\">서식, 신청서</td></tr><tr><td class=\"w\">capture</td><td class=\"m\">담아내다, 포착하다</td></tr><tr><td class=\"w\">convey</td><td class=\"m\">전달하다, 전하다</td></tr><tr><td class=\"w\">complexity</td><td class=\"m\">복잡함</td></tr><tr><td class=\"w\">author</td><td class=\"m\">저자, 작가</td></tr><tr><td class=\"w\">unique</td><td class=\"m\">독특한, 유일무이한</td></tr><tr><td class=\"w\">explore</td><td class=\"m\">탐구하다, 탐험하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">문학은, 본질적으로,</span><span class=\"en\"><b>Literature, <span class=\"grammar-hl\">in its essence</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">증거이다</span><span class=\"en\"><b>is a testament</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지속적인 힘에 대한</span><span class=\"en\"><b>to the <span class=\"grammar-hl\">enduring power</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간의 창의성 및 표현의.</span><span class=\"en\"><b>of human creativity and expression.</b></span></div></div><div class=\"lec-sent-ko\">문학은, 본질적으로, 인간의 창의성 및 표현의 지속적인 힘에 대한 증거이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문학이라는 주제를 도입하며 그 핵심 가치를 정의하는 문장입니다. 문학이 단순한 글자들의 집합이 아니라, 인간이 가진 창의적이고 표현하고자 하는 본능이 시간이 흘러도 변치 않고 강력하다는 것을 증명해 주는 실체임을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in its essence (관용표현): &#39;본질적으로&#39;라는 의미를 가진 전치사구 기반의 표현이다.</div><div class=\"lec-gr-item\">enduring power (현재분사(형용사)): enduring이 뒤의 명사 power를 수식하며 &#39;지속되는/불후의&#39;라는 동작/상태를 나타낸다. power that is enduring(축약 관계절)의 의미로 볼 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">literature</td><td class=\"m\">문학</td></tr><tr><td class=\"w\">essence</td><td class=\"m\">본질</td></tr><tr><td class=\"w\">creativity</td><td class=\"m\">창의력</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 초월한다</span><span class=\"en\"><b>It transcends</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간과 공간을,</span><span class=\"en\"><b>time and space,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리를 연결해 주며</span><span class=\"en\"><b><span class=\"grammar-hl\">connecting us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각 및 감정과</span><span class=\"en\"><b>with the thoughts and emotions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">각계각층 사람들의,</span><span class=\"en\"><b>of people from <span class=\"grammar-hl\">all walks of life</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수 세기 여러 문화에 걸쳐.</span><span class=\"en\"><b>across centuries and cultures.</b></span></div></div><div class=\"lec-sent-ko\">그것은 시간과 공간을 초월하여, 수 세기 여러 문화에 걸쳐, 우리를 각계각층 사람들의 생각 및 감정과 연결해 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;지속적인 힘&#39;이 구체적으로 어떻게 발휘되는지 설명합니다. 문학은 물리적인 제약(시간, 장소)을 넘어서서, 우리와 전혀 다른 시대를 살았거나 다른 문화를 가진 사람들의 내면과 소통하게 해주는 매개체 역할을 한다는 점을 밝히고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">connecting us (분사구문): 접속사와 주어가 생략되어 부사적 기능을 하는 분사구문으로, 원래의 절 &#39;as it connects us&#39;로 변환할 수 있다.</div><div class=\"lec-gr-item\">all walks of life (관용표현): &#39;각계각층&#39;, &#39;사회 각계&#39;를 의미하는 숙어적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">transcend</td><td class=\"m\">초월하다</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">부상에도 불구하고</span><span class=\"en\"><b>Despite the rise</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 기술의</span><span class=\"en\"><b>of new technologies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 끊임없이 변화하는 미디어 환경에도 불구하고,</span><span class=\"en\"><b>and the <span class=\"grammar-hl\">ever-changing landscape</span> of media,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문학은 유지해 왔다</span><span class=\"en\"><b>literature has retained</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 적절성과 중요성을</span><span class=\"en\"><b>its relevance and significance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시대를 초월한 예술 형식으로서.</span><span class=\"en\"><b>as a timeless art form.</b></span></div></div><div class=\"lec-sent-ko\">새로운 기술의 부상과 끊임없이 변화하는 미디어 환경에도 불구하고, 문학은 시대를 초월한 예술 형식으로서 그 적절성과 중요성을 유지해 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 문학이 처한 현대적 상황과 대비를 이룹니다. 급변하는 현대 기술이나 새로운 미디어(영상, SNS 등)의 공세 속에서도 문학이 도태되지 않고 여전히 중요한 가치를 지닌 예술로 남아 있다는 점을 강조하며 문학의 생명력을 재확인합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">ever-changing landscape (현재분사(형용사)): ever-changing이 뒤의 명사 landscape를 수식하며 &#39;끊임없이 변화하는&#39;이라는 진행적 의미를 나타낸다. landscape that is ever-changing의 의미로 볼 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">literature</td><td class=\"m\">문학</td></tr><tr><td class=\"w\">despite</td><td class=\"m\">~에도 불구하고</td></tr><tr><td class=\"w\">landscape</td><td class=\"m\">풍경, 경치</td></tr><tr><td class=\"w\">retain</td><td class=\"m\">유지하다, 간직하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relevance</td><td class=\"m\">타당성, 관련성, 적합성</td></tr><tr><td class=\"w\">significance</td><td class=\"m\">중요성, 의미</td></tr><tr><td class=\"w\">form</td><td class=\"m\">서식, 신청서</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 가지 이유는</span><span class=\"en\"><b>One reason</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문학의 지속적인 힘에 대한</span><span class=\"en\"><b>for literature’s <span class=\"grammar-hl\">enduring power</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 능력이다</span><span class=\"en\"><b>is its <span class=\"grammar-hl\">ability</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포착하고 전달하는</span><span class=\"en\"><b><span class=\"grammar-hl\">to capture and convey</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">복잡성을</span><span class=\"en\"><b>the complexities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간 경험의.</span><span class=\"en\"><b>of the human experience.</b></span></div></div><div class=\"lec-sent-ko\">문학의 지속적인 힘에 대한 한 가지 이유는 인간 경험의 복잡성을 포착하고 전달하는 그것(문학)의 능력이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 문학의 &#39;지속적인 힘&#39;이 어디에서 기인하는지 그 구체적인 원인을 제시합니다. 인간의 삶은 단순하지 않은데, 문학이 그 복잡다단한 경험들을 세밀하게 담아내고 전달할 수 있는 독보적인 능력을 갖췄기 때문이라고 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">enduring power (현재분사(형용사)): enduring이 power를 수식하며 &#39;지속되는 힘&#39;이라는 의미를 만든다. power that is enduring(축약 관계절) 구조로 이해할 수 있다.</div><div class=\"lec-gr-item\">ability to capture and convey (to부정사): 형용사적 용법으로 쓰여 앞의 명사 ability를 수식하며, &#39;~하는 능력&#39;이라는 의미로 해석된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">literature</td><td class=\"m\">문학</td></tr><tr><td class=\"w\">capture</td><td class=\"m\">담아내다, 포착하다</td></tr><tr><td class=\"w\">convey</td><td class=\"m\">전달하다, 전하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">글을 통해,</span><span class=\"en\"><b>Through the <span class=\"grammar-hl\">written word</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작가들은 갖는다</span><span class=\"en\"><b>authors have</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독특한 능력을</span><span class=\"en\"><b>the unique <span class=\"grammar-hl\">ability</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">탐구하는</span><span class=\"en\"><b><span class=\"grammar-hl\">to explore</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간 감정의 깊이를,</span><span class=\"en\"><b>the depths of human emotion,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관계의 미묘한 차이를,</span><span class=\"en\"><b>the nuances of relationships,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 도전과 승리를</span><span class=\"en\"><b>and the challenges and triumphs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간 정신의.</span><span class=\"en\"><b>of the human spirit.</b></span></div></div><div class=\"lec-sent-ko\">글을 통해, 작가들은 인간 감정의 깊이, 관계의 미묘한 차이, 그리고 인간 정신의 도전과 승리를 탐구하는 독특한 능력을 갖는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장의 &#39;인간 경험의 복잡성&#39;이 무엇인지 상세히 풀어냅니다. 작가가 &#39;글&#39;을 도구로 삼아 인간의 깊은 감정, 복잡한 인간관계, 정신적인 고난과 극복의 과정을 깊이 있게 파고들 수 있음을 보여주며 문학의 탐구 영역을 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">written word (과거분사(형용사)): written이 뒤의 명사 word를 수식하며 &#39;기록된/쓰인&#39;이라는 수동의 의미를 나타낸다. word that is written(축약 관계절) 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">ability to explore (to부정사): 형용사적 용법으로 명사 ability를 뒤에서 수식하여 &#39;~할 수 있는 능력&#39;이라는 의미를 형성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emotion</td><td class=\"m\">감정</td></tr><tr><td class=\"w\">author</td><td class=\"m\">저자, 작가</td></tr><tr><td class=\"w\">unique</td><td class=\"m\">독특한, 유일무이한</td></tr><tr><td class=\"w\">explore</td><td class=\"m\">탐구하다, 탐험하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">문학은 우리로 하여금 ~하게 한다</span><span class=\"en\"><b>Literature allows us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 자신이 투영되는 것을 보도록</span><span class=\"en\"><b>to see <span class=\"grammar-hl\">ourselves reflected</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">책의 페이지 속에,</span><span class=\"en\"><b>in the pages of a book,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인물들에게 공감하도록</span><span class=\"en\"><b>to empathize with characters</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 자신과는 다른,</span><span class=\"en\"><b>different from ourselves,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 얻도록</span><span class=\"en\"><b>and to gain</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 깊은 이해를</span><span class=\"en\"><b>a deeper understanding</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간의 조건에 대한.</span><span class=\"en\"><b>of the human condition.</b></span></div></div><div class=\"lec-sent-ko\">문학은 우리가 책의 페이지 속에 우리 자신이 투영되는 것을 보고, 우리 자신과는 다른 인물들에게 공감하며, 그리고 인간의 조건에 대한 더 깊은 이해를 얻도록 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 작가의 창작 행위(5번 문장)가 독자에게 미치는 최종적인 영향과 이득을 정리하며 글을 마무리합니다. 독자는 문학을 통해 자아를 성찰하고, 타인에게 공감하며, 결과적으로 &#39;인간이란 무엇인가&#39;라는 근원적인 질문(인간의 조건)에 대한 통찰력을 얻게 된다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">allows us to see ..., to empathize ..., and to gain 5형식(SVOC) 구조: 주어(Literature) + 동사(allows) + 목적어(us) + 목적격 보어(to부정사) 구조다. allow는 목적격 보어로 to부정사를 취하며, 여기서는 세 개의 to부정사가 병렬로 연결되어 있다.</div><div class=\"lec-gr-item\">ourselves reflected (과거분사(형용사)): reflected가 목적어인 ourselves의 상태를 설명하며 &#39;반영된/투영된&#39;이라는 수동의 의미를 나타낸다. ourselves that are reflected(축약 관계절) 구조로 볼 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">literature</td><td class=\"m\">문학</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>문학은 시공간을 초월하여 인간의 창의성과 표현력을 보여주는 영원한 증거이다.</li><li>기술과 미디어의 급격한 변화 속에서도 문학은 그 고유한 가치와 중요성을 잃지 않았다.</li><li>문학이 강력한 이유는 인간 경험의 복잡성을 세밀하게 포착하여 전달하기 때문이다.</li><li>우리는 문학을 통해 타인과 공감하고, 자신을 돌아보며, 인간의 본질을 깊이 이해하게 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Literature transcends temporal and cultural boundaries by capturing the profound complexities of the human condition.</div>\n              <div class=\"lec-final-sum-ko\">문학은 인간 조건의 심오한 복잡성을 포착함으로써 시간적, 문화적 경계를 초월한다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/18.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/19.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/21.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/22.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/23.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/24.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/25.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/26.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_29번_강의_audio/27.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document
