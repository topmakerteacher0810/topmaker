8SH7WXGVJOO3zZ6Y4Bzz17jPB93eW45Kn9O3r1/WhK/VNLu3bbv5afgVFNWSi2rRWq7qNlv0utuz6EZ5weenToe3+cZxn8KU/T/P8A9enhWB5U4yePcA8deo/TIz1GQI5GQpIwDnHTPTnpzwfy9aWmmq6PV6a2/wA1fro+yu/J6Wte6el+Xeyv1V+tvQZ3wOB2/wD18Af1/Cg+nv1H+en+TS7SRkA9CeR0x1GfUdxwe+Mc0pR8gbT37Ht29sk8evQckUW80tuvp/n+DFv/AFbYYeDnsT16HP8AIk55/rQQMEdOvP45/wA+1O2uSRtPoP6j168k84zzTjGxxhSQQe3JwMnI5wMHjucfhRs76aW29PzX5731H2te99NLbJdLeas+v3keSOxPQdsfXrkf/W9M5MepPpjp0+nr/nBAw4KSC2CR9D6fTtjnvS7HxnY2CP7pJB754698dR2yaLenRdOluvz19X5g9LbLZdLbLvs9de9/UjBIO3qADz39c+/XH9eOHf5/z2/GgAnsfyP0OOnT8ulOCsc4Vzt54Vj+eMcfTNO1+3T8ba/j000dg32Xr69+iV21tsIB+A9f5/8A6qTn+ueOxHH45PT60o3McbW3d+D2HPbqO+cdOR1NBB/unnjkH07/AFHPXn6Ucr0211X4dP62fQNVbTz+X+WghYDrgdu/p1+v+e9NLrk5I4U5xk568dOh55PqeOoCtG/3ip2g4AAbJJOMdDj6n6dTTWhbaSyMVYcHB7/h16nGDjvnqNIWVtrtr77p2WqV1pdK34aJpOL373s9LqL1TWiWnM/ztdf/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Enhance Your Memory by Changing Where You Study<small>학습 장소를 바꿈으로써 기억력을 향상시켜라</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글은 정보를 뇌에 입력할 때 주변 환경이 어떤 역할을 하는지 설명하는 맥락 의존적 기억(Context-Dependent Memory) 이론과 밀접한 관련이 있습니다. 우리가 공부할 때 우리 뇌는 단순히 내용만 외우는 것이 아니라 주변의 분위기나 장소의 느낌 같은 인출 단서(Retrieval Cues)를 정보와 함께 저장하는데, 장소를 옮겨가며 공부하면 뇌가 정보를 더 풍부하게 연결하는 부호화 다양성(Encoding Variability) 효과가 나타납니다. 마치 한 사람을 교실에서도 만나고 카페에서도 만날 때 그 사람의 특징을 더 다각도로 기억하게 되는 것처럼, 장소의 변화(Environmental Variety)는 우리 뇌가 정보를 회상할 수 있는 통로를 여러 개 만들어 주는 셈이지요. 실제로 인지심리학 분야의 학습 실험(Learning Experiments) 결과에 따르면, 고정된 한 장소에서만 공부한 집단보다 최소 두 군데 이상의 장소에서 시간을 나누어 학습한 집단의 기억 회상 능력이 훨씬 뛰어난 것으로 증명되었습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01고정된 장소 학습의 지양</div><ul><li>항상 같은 장소에서 공부하기보다 장소를 바꾸는 것이 학습 효율을 높인다.</li><li>장소의 다양성(variety)은 학습 내용을 강화함</li><li>여러 장소에서의 풍부한 경험(rich experience)의 중요성</li><li>핵심 키워드: 학습 장소(study spot)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02학습 효율에 관한 연구 결과</div><ul><li>다수의 실험을 통해 두 곳 이상의 장소에서 공부하는 것이 기억에 유리함이 밝혀졌다.</li><li>학습자의 회상(recall) 가능성을 높임</li><li>대학생들의 실제 공부 습관과 연구 결과의 일치</li><li>핵심 키워드: 연구(research)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03단어 암기 실험의 진행</div><ul><li>학습 장소의 수에 따른 단어 암기 능력을 비교하는 실험을 실시했다.</li><li>대조군: 동일한 방(same room)에서 두 번 학습</li><li>실험군: 두 개의 다른 장소(two locations)에서 학습 시간을 나눔</li><li>핵심 키워드: 단어 목록(list of words)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실험 결과와 장소의 영향</div><ul><li>장소를 옮겨 다니며 공부한 학생들이 훨씬 더 높은 기억력을 보여주었다.</li><li>단어 회상 평가에서 이동하며 공부한 그룹의 성적이 우수함</li><li>장소의 변화(moved around)가 학습 성취도에 직접적인 영향을 미침</li><li>핵심 키워드: 우수한 성취(far better)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05무의식적 연합의 원리</div><ul><li>장소의 다양성은 우리가 의식하지 못하는 사이 배경 지식과 풍부한 연결 고리를 만든다.</li><li>풍부한 연합(rich association)의 형성</li><li>의식적인 사고 밖(outside of conscious thinking)에서 일어나는 배경적 연결</li><li>핵심 키워드: 연결(connections)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spot</td><td class=\"m\">지점, 장소</td></tr><tr><td class=\"w\">variety</td><td class=\"m\">다양성</td></tr><tr><td class=\"w\">reinforce</td><td class=\"m\">강화하다, 굳히다</td></tr><tr><td class=\"w\">reflect</td><td class=\"m\">반영하다, 보여 주다</td></tr><tr><td class=\"w\">research</td><td class=\"m\">연구, 조사</td></tr><tr><td class=\"w\">numerous</td><td class=\"m\">수많은</td></tr><tr><td class=\"w\">experiment</td><td class=\"m\">실험</td></tr><tr><td class=\"w\">found</td><td class=\"m\">찾다, 발견하다 (find의 과거형)</td></tr><tr><td class=\"w\">simply</td><td class=\"m\">단순히, 그저</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">trial</td><td class=\"m\">시도, 시험</td></tr><tr><td class=\"w\">return</td><td class=\"m\">돌아오다, 돌려주다</td></tr><tr><td class=\"w\">counterpart</td><td class=\"m\">대응 관계에 있는 사람[물건]</td></tr><tr><td class=\"w\">amount</td><td class=\"m\">양, 액수</td></tr><tr><td class=\"w\">divide</td><td class=\"m\">나누다</td></tr><tr><td class=\"w\">location</td><td class=\"m\">장소, 위치</td></tr><tr><td class=\"w\">recall</td><td class=\"m\">기억해 내다</td></tr><tr><td class=\"w\">association</td><td class=\"m\">연관, 협회</td></tr><tr><td class=\"w\">connection</td><td class=\"m\">연결, 관계</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 항상 공부하는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Do you always study</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 장소에서?</span><span class=\"en\"><b>in the same spot?</b></span></div></div><div class=\"lec-sent-ko\">항상 같은 장소에서 공부하는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자의 평소 공부 습관에 의문을 제기하며 흥미를 유발하고 논의할 주제(공부 장소)를 도입합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Do you always study (의문문): 일반동사(study)의 의문문을 만들기 위해 조동사 Do가 주어(you) 앞에 위치한 구조.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spot</td><td class=\"m\">지점, 장소</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러지 마라.</span><span class=\"en\"><b><span class=\"grammar-hl\">Don’t</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러지 마라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 대해 단호하게 부정하며, 기존의 통념(한곳에서 집중해서 공부하기)과는 반대되는 글쓴이의 핵심 주장(장소를 바꿔라)을 강력하게 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Don’t 부정 명령문: &#39;하지 마라&#39;라는 의미로, 앞 문장의 내용(study in the same spot)을 반복하지 않기 위해 동사가 생략된 형태.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 공부한다면</span><span class=\"en\"><b>If you study</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러 장소에서,</span><span class=\"en\"><b>in different places,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 돕는다</span><span class=\"en\"><b>that <span class=\"grammar-hl\">helps</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양성을 만들도록,</span><span class=\"en\"><b><span class=\"grammar-hl\">create</span> variety,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그러한 풍부한 경험은</span><span class=\"en\"><b>and that rich experience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강화할 수 있다</span><span class=\"en\"><b>can reinforce</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 학습하고 있는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">what you are learning</span>.</b></span></div></div><div class=\"lec-sent-ko\">여러 장소에서 공부하면, 그것은 다양성을 만들도록 돕고, 그러한 풍부한 경험은 당신이 학습하고 있는 것을 강화할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 주장에 대한 근거를 제시합니다. 장소의 변화가 &#39;다양성&#39;과 &#39;풍부한 경험&#39;을 제공하여 학습 내용을 뇌에 더 강력하게 각인시킨다는 원리를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">helps create (관용표현): help 동사는 목적어로 to부정사를 취할 때 to를 생략하고 동사원형(create)을 바로 쓸 수 있는 특징이 있음.</div><div class=\"lec-gr-item\">what you are learning (관계대명사): 선행사를 포함하는 관계대명사 what이 이끄는 명사절로, 타동사 reinforce의 목적어 역할을 함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variety</td><td class=\"m\">다양성</td></tr><tr><td class=\"w\">reinforce</td><td class=\"m\">강화하다, 굳히다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇몇 대학생들이</span><span class=\"en\"><b>When several college students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게 말했을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">told us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 학교 과제를 한다고</span><span class=\"en\"><b><span class=\"grammar-hl\">they did</span> school work</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러 장소에서</span><span class=\"en\"><b>in different places</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~보다는</span><span class=\"en\"><b>rather than</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋아하는 어떤 구석진 곳에서,</span><span class=\"en\"><b>in some favorite nook,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 습관은</span><span class=\"en\"><b>that habit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반영했다</span><span class=\"en\"><b>reflected</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학습에 관한 연구를.</span><span class=\"en\"><b>the research on <span class=\"grammar-hl\">learning</span>.</b></span></div></div><div class=\"lec-sent-ko\">몇몇 대학생들이 좋아하는 어떤 구석진 곳에서보다는 여러 장소에서 학교 과제를 한다고 우리에게 말했을 때, 그 습관은 학습에 관한 연구를 반영했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실제 학생들의 사례를 언급하며, 장소를 옮겨가며 공부하는 습관이 단순히 개인적인 선호가 아니라 과학적 근거가 있는 행동임을 시사하며 신뢰성을 높입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">told us they did 5형식(SVOC) 구조: tell + 간접목적어(us) + 직접목적어(접속사 that이 생략된 명사절) 형태의 4형식 구조로, 학생들에게 ~라는 내용을 말했음을 나타냄.</div><div class=\"lec-gr-item\">learning (동명사): 전치사 on의 목적어 역할을 하는 명사적 기능의 -ing 형태.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reflect</td><td class=\"m\">반영하다, 보여 주다</td></tr><tr><td class=\"w\">research</td><td class=\"m\">연구, 조사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수많은 실험은</span><span class=\"en\"><b>Numerous experiments</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발견했다</span><span class=\"en\"><b>have found</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 학습자들이</span><span class=\"en\"><b>that if learners</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 공부하기만 해도</span><span class=\"en\"><b>simply study</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최소 두 곳의 다른 장소에서,</span><span class=\"en\"><b>in <span class=\"grammar-hl\">at least</span> two different places,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 가능성이 더 높다는 것을</span><span class=\"en\"><b>they <span class=\"grammar-hl\">are more likely</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학습 자료를 기억할.</span><span class=\"en\"><b><span class=\"grammar-hl\">to recall</span> the material.</b></span></div></div><div class=\"lec-sent-ko\">수많은 실험은 학습자가 최초 두 곳 이상 다른 장소에서 단지 공부하기만 해도, 학습 자료를 기억할 가능성이 더 높다는 것을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;연구 결과&#39;가 구체적으로 무엇인지 명시합니다. 장소의 변화(최소 두 곳)와 기억력(회상 능력) 사이의 직접적인 상관관계를 제시하는 핵심 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">at least (관용표현): &#39;적어도, 최소한&#39;이라는 의미를 나타내는 부사구.</div><div class=\"lec-gr-item\">are more likely to recall (관용표현): &#39;be likely to + 동사원형&#39; 구조로 &#39;~할 가능성이 있다&#39;는 의미를 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">numerous</td><td class=\"m\">수많은</td></tr><tr><td class=\"w\">experiment</td><td class=\"m\">실험</td></tr><tr><td class=\"w\">found</td><td class=\"m\">찾다, 발견하다 (find의 과거형)</td></tr><tr><td class=\"w\">simply</td><td class=\"m\">단순히, 그저</td></tr><tr><td class=\"w\">recall</td><td class=\"m\">기억해 내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">중 하나에서</span><span class=\"en\"><b>In <span class=\"grammar-hl\">one of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러한 초기 실험들,</span><span class=\"en\"><b><span class=\"grammar-hl\">the first such trials</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 개의 다른 집단이</span><span class=\"en\"><b>two different groups</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공부하였다</span><span class=\"en\"><b>studied</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 단어 목록을.</span><span class=\"en\"><b>a list of words.</b></span></div></div><div class=\"lec-sent-ko\">그러한 초기 실험을 종합하면서 두 개의 다른 집단이 하나의 단어 목록을 공부하였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번 문장에서 언급한 실험적 근거를 구체적으로 뒷받침하기 위해 구체적인 실험 과정을 소개하기 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">one of the first such trials (관용표현): &#39;one of the + 최상급 + 복수명사&#39; 구조로 &#39;~한 것들 중 하나&#39;라는 의미이며, trials(복수명사)가 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">trial</td><td class=\"m\">시도, 시험</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일부 학생들은</span><span class=\"en\"><b>Some students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 방으로 두 번 돌아왔다</span><span class=\"en\"><b>returned to the same room twice</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반면 상대 집단은</span><span class=\"en\"><b>while their counterparts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동일한 양의 시간을 보냈다</span><span class=\"en\"><b>spent the same amount of time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 장소로 나뉜.</span><span class=\"en\"><b><span class=\"grammar-hl\">divided</span> between two locations.</b></span></div></div><div class=\"lec-sent-ko\">일부 학생들은 같은 방으로 두 번 돌아왔지만, 상대 집단은 두 장소에서 동일하게 나뉜 시간을 보냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 조건을 설명합니다. 한 그룹은 동일한 장소(대조군)에서, 다른 그룹은 장소를 옮기며(실험군) 학습했다는 차이점을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">divided (과거분사(형용사)): divided가 앞의 명사구인 the same amount of time을 수식(= &quot;나뉘어진 같은 양의 시간&quot;). N + p.p. 구조로 time (that was) divided 형태의 축약 관계절로 볼 수 있음.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">return</td><td class=\"m\">돌아오다, 돌려주다</td></tr><tr><td class=\"w\">counterpart</td><td class=\"m\">대응 관계에 있는 사람[물건]</td></tr><tr><td class=\"w\">amount</td><td class=\"m\">양, 액수</td></tr><tr><td class=\"w\">divide</td><td class=\"m\">나누다</td></tr><tr><td class=\"w\">location</td><td class=\"m\">장소, 위치</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">요청받았을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When asked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기억해 보라고</span><span class=\"en\"><b><span class=\"grammar-hl\">to recall</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목록에 있는 가능한 한 많은 단어를,</span><span class=\"en\"><b>as many words on the list as possible,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b><span class=\"grammar-hl\">those</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장소를 옮겨 다닌</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span> had moved around</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 잘했다.</span><span class=\"en\"><b><span class=\"grammar-hl\">did</span> far better.</b></span></div></div><div class=\"lec-sent-ko\">목록에 있는 가능한 한 많은 단어를 기억해 보라고 요청받았을 때, 장소를 옮겨 다닌 학생들이 훨씬 더 잘했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 결과를 제시하며 장소를 바꾸는 것이 기억력 향상에 효과적이라는 앞선 주장들을 최종적으로 증명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When asked (분사구문): 접속사(When)를 생략하지 않은 수동 분사구문. 원래 절로 변환하면 when they were asked로 쓸 수 있음.</div><div class=\"lec-gr-item\">to recall (to부정사): 본래 5형식 구조인 &#39;ask + O + to V&#39;가 수동태가 되면서 목적격 보어였던 to부정사(to recall)가 그대로 남은 구조.</div><div class=\"lec-gr-item\">those who (관계대명사): 주격 관계대명사 who가 선행사 those를 수식하여 &#39;~하는 사람들&#39;이라는 의미의 명사구를 형성함.</div><div class=\"lec-gr-item\">did (대동사): 앞의 일반동사구(recalled words)의 반복을 피하기 위해 쓰임. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recall</td><td class=\"m\">기억해 내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다양성은</span><span class=\"en\"><b>Variety</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">풍부한 연상을 만든다</span><span class=\"en\"><b>creates rich association,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~할 때조차도</span><span class=\"en\"><b>even when</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 연결들이 형성될</span><span class=\"en\"><b>those connections form</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배경에서,</span><span class=\"en\"><b>in the background,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완전히 바깥에서</span><span class=\"en\"><b>totally outside</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 의식적으로 생각하고 있는 것의.</span><span class=\"en\"><b>of <span class=\"grammar-hl\">what we are consciously thinking</span>.</b></span></div></div><div class=\"lec-sent-ko\">다양성은 풍부한 연상을 만들어 내는데, 이러한 연결들이 배경에서, 즉 우리가 의식적으로 생각하고 있는 것의 완전히 바깥에서, 형성될 때조차도 (그러하다).</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 결론으로, 왜 장소의 변화가 효과적인지 심리학적 기제(풍부한 연상 작용)를 설명하며 마무리합니다. 무의식적인 주변 환경 정보가 학습 내용과 결합하여 기억을 돕는다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what we are consciously thinking (관계대명사): 선행사를 포함하는 관계대명사 what이 이끄는 명사절로, 전치사 of의 목적어 역할을 함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variety</td><td class=\"m\">다양성</td></tr><tr><td class=\"w\">association</td><td class=\"m\">연관, 협회</td></tr><tr><td class=\"w\">connection</td><td class=\"m\">연결, 관계</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>공부할 때 한 장소만 고집하지 말고 여러 장소를 활용하는 것이 학습에 효과적이다.</li><li>장소의 변화는 다양성을 제공하며, 이는 학습 내용을 강화하는 풍부한 경험이 된다.</li><li>실험 결과, 두 곳 이상의 장소에서 공부한 학생들이 한 곳에서만 공부한 학생보다 기억력이 훨씬 뛰어났다.</li><li>이는 다양한 환경적 요인이 무의식 중에 학습 내용과 결합하여 풍부한 연상 고리를 만들기 때문이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Studying in multiple locations improves memory recall because diverse environments create rich mental associations for the material.</div>\n              <div class=\"lec-final-sum-ko\">다양한 장소에서 공부하는 것은 학습 자료에 대한 풍부한 정신적 연상을 형성함으로써 기억 회상 능력을 향상시킨다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/8.mp3","hl":"stage-4"}],[{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/9.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/10.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/11.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/12.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/13.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/14.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/15.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/16.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/17.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/18.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/19.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/20.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/21.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/22.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/23.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/24.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/25.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/26.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_32번_강의_audio/27.mp3","hl":"grammar"}],[{"
