는 불확실성</div><ul><li>스포츠 관중은 경기 결과를 예측할 수 없을 때 더 큰 매력을 느낀다.</li><li>관중의 관점: 예측 불가능한(unpredictable) 경험을 선호</li><li>경제적 효과: 결과가 불확실할 때 관중 수와 리그의 수익(profits)이 증가함</li><li>핵심 키워드: 관중(spectator)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03경기 질의 가변성 문제</div><ul><li>결과의 불확실성은 경기의 질이 일정하지 않다는 부작용을 동반한다.</li><li>경기 성과(performance)의 질에 상당한 가변성(variability) 발생</li><li>가변성 요인: 날씨, 선수 부상, 경기장 상태, 상대 팀의 수준</li><li>핵심 키워드: 경기 상품(sport product)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04마케팅을 통한 품질 보완</div><ul><li>스포츠 마케터는 경기의 불확실성을 보완하기 위해 부가적인 가치를 제공한다.</li><li>체계적인 방식(systematic ways)으로 상품을 개선하여 팬들을 유인</li><li>마케팅 전략: 스타 선수 활용, 프리미엄 좌석, 부가 오락 시설 제공</li><li>핵심 키워드: 스포츠 마케터(sport marketers)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05재정적 성공의 핵심 요소</div><ul><li>불확실성은 스포츠 경험의 한 부분이자 재정적 성공을 위한 필수 요소이다.</li><li>스포츠 경기의 불확실한 본질(uncertain nature)은 전체 경험의 핵심</li><li>예측 불가능성이 스포츠 산업의 재정적 성공(financial success)을 이끄는 동력</li><li>핵심 키워드: 전체 경험(total experience)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">commercial</td><td class=\"m\">광고</td></tr><tr><td class=\"w\">aim</td><td class=\"m\">목표로 하다</td></tr><tr><td class=\"w\">predictability</td><td class=\"m\">예측 가능성</td></tr><tr><td class=\"w\">especially</td><td class=\"m\">특히</td></tr><tr><td class=\"w\">product</td><td class=\"m\">제품, 산물</td></tr><tr><td class=\"w\">quality</td><td class=\"m\">질, 품질</td></tr><tr><td class=\"w\">value</td><td class=\"m\">가치</td></tr><tr><td class=\"w\">delivery</td><td class=\"m\">배달, 배송</td></tr><tr><td class=\"w\">professional</td><td class=\"m\">전문적인, 직업의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">competition</td><td class=\"m\">대회, 시합</td></tr><tr><td class=\"w\">spectator</td><td class=\"m\">관중</td></tr><tr><td class=\"w\">perspective</td><td class=\"m\">관점, 시각</td></tr><tr><td class=\"w\">experienced</td><td class=\"m\">경험이 많은, 노련한</td></tr><tr><td class=\"w\">unpredictable</td><td class=\"m\">예측할 수 없는</td></tr><tr><td class=\"w\">depend on</td><td class=\"m\">~에 달려 있다, ~에 의존하다</td></tr><tr><td class=\"w\">in order to</td><td class=\"m\">~하기 위해</td></tr><tr><td class=\"w\">attract</td><td class=\"m\">끌어들이다, (관심을) 끌다</td></tr><tr><td class=\"w\">result</td><td class=\"m\">결과</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">상업적 기업은</span><span class=\"en\"><b>Commercial businesses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">추구한다</span><span class=\"en\"><b><span class=\"grammar-hl\">aim for</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예측 가능성과 확실성을</span><span class=\"en\"><b>predictability and certainty,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특히 ~에 있어서</span><span class=\"en\"><b>especially <span class=\"grammar-hl\">when it comes to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제품 품질</span><span class=\"en\"><b>product quality.</b></span></div></div><div class=\"lec-sent-ko\">상업적 기업은, 특히 제품 품질에 있어서, 예측 가능성과 확실성을 추구한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일반적인 비즈니스 세계에서의 핵심 가치를 제시하며 글을 시작합니다. 소비자에게 일정한 품질의 제품을 제공해야 신뢰를 얻을 수 있기 때문에 &#39;예측 가능성&#39;은 기업 경영의 필수 요소임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">aim for (관용표현): &#39;~을 목표로 하다/겨냥하다&#39;라는 의미로 동사 aim과 전치사 for가 결합된 표현입니다.</div><div class=\"lec-gr-item\">when it comes to (관용표현): &#39;~에 관해서라면&#39;이라는 의미로, 뒤에 명사나 동명사가 오는 전치사적 성격의 구문입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">commercial</td><td class=\"m\">광고</td></tr><tr><td class=\"w\">aim</td><td class=\"m\">목표로 하다</td></tr><tr><td class=\"w\">predictability</td><td class=\"m\">예측 가능성</td></tr><tr><td class=\"w\">especially</td><td class=\"m\">특히</td></tr><tr><td class=\"w\">product</td><td class=\"m\">제품, 산물</td></tr><tr><td class=\"w\">quality</td><td class=\"m\">질, 품질</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 예측 가능성과 확실성은</span><span class=\"en\"><b>But predictability and certainty</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상 가치 있게 여겨지지는 않는다</span><span class=\"en\"><b><span class=\"grammar-hl\">are not always valued</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스포츠계에서</span><span class=\"en\"><b>in the sporting world,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특히 ~에 있어서</span><span class=\"en\"><b>especially <span class=\"grammar-hl\">when it comes to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">프로 스포츠 경기 운영</span><span class=\"en\"><b>the delivery of professional sport competitions.</b></span></div></div><div class=\"lec-sent-ko\">그러나 예측 가능성과 확실성이 스포츠계, 특히 프로 스포츠 경기 운영에서는 항상 가치 있게 여겨지지는 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 일반적인 비즈니스 원칙과 대비되는 스포츠 산업의 특이성을 소개합니다. &#39;But&#39;이라는 역접 접속사를 통해 스포츠는 일반 기업과 달리 &#39;불확실성&#39;이 중요한 가치가 될 수 있음을 시사하며 논의를 심화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are not always valued (수동태): be동사(are)+p.p.(valued) 구조. value는 타동사인데 뒤에 목적어가 없어서 수동구조 are valued 형태로 쓴다. 기본구조: V + O (value something)</div><div class=\"lec-gr-item\">when it comes to (관용표현): &#39;~에 관한 한&#39;, &#39;~에 관해서라면&#39;이라는 의미로 쓰이는 상용구입니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">predictability</td><td class=\"m\">예측 가능성</td></tr><tr><td class=\"w\">especially</td><td class=\"m\">특히</td></tr><tr><td class=\"w\">value</td><td class=\"m\">가치</td></tr><tr><td class=\"w\">delivery</td><td class=\"m\">배달, 배송</td></tr><tr><td class=\"w\">professional</td><td class=\"m\">전문적인, 직업의</td></tr><tr><td class=\"w\">competition</td><td class=\"m\">대회, 시합</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">관중의 관점에서</span><span class=\"en\"><b>From a spectator’s perspective</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스포츠 경험은</span><span class=\"en\"><b>the sport experience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 잘 경험된다</span><span class=\"en\"><b><span class=\"grammar-hl\">is better experienced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예측 불가능할 때</span><span class=\"en\"><b>when unpredictable.</b></span></div></div><div class=\"lec-sent-ko\">관중의 관점에서 스포츠 경험은 예측 불가능할 때 더 잘 경험된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 스포츠의 가치가 불확실성에 있는 이유를 &#39;관중(소비자)&#39;의 입장에서 설명합니다. 결과가 뻔한 경기보다 누가 이길지 모르는 긴장감 속에서 관중이 더 큰 즐거움을 느낀다는 논리적 근거를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is better experienced (수동태): be동사(is)+p.p.(experienced) 구조. experience는 타동사인데 뒤에 목적어가 없어서 수동구조 is experienced 형태로 쓴다. 기본구조: V + O (experience something)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spectator</td><td class=\"m\">관중</td></tr><tr><td class=\"w\">perspective</td><td class=\"m\">관점, 시각</td></tr><tr><td class=\"w\">experienced</td><td class=\"m\">경험이 많은, 노련한</td></tr><tr><td class=\"w\">unpredictable</td><td class=\"m\">예측할 수 없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스포츠 경기는</span><span class=\"en\"><b>Sport events</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로 의존한다</span><span class=\"en\"><b>actually <span class=\"grammar-hl\">depend on</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 예측 불가능성에</span><span class=\"en\"><b>that unpredictability</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">끌어들이기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">in order to attract</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들을 경기로</span><span class=\"en\"><b>people to the game.</b></span></div></div><div class=\"lec-sent-ko\">실제로 스포츠 경기는 사람들을 경기로 끌어들이기 위해 그 예측 불가능성에 의존한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 관중의 심리를 바탕으로, 스포츠 산업의 생존 전략이 바로 &#39;불확실성&#39;에 있음을 설명합니다. 즉, 불확실성은 단순히 부수적인 현상이 아니라 관객 동원을 위한 핵심 동력이라는 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">depend on (관용표현): &#39;~에 의존하다&#39;, &#39;~에 달려 있다&#39;라는 의미의 구동사입니다.</div><div class=\"lec-gr-item\">in order to attract (to부정사): 부사적 용법(목적)으로 &#39;~하기 위하여&#39;라는 의미를 명확히 전달하기 위해 in order to 형태를 사용했습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">predictability</td><td class=\"m\">예측 가능성</td></tr><tr><td class=\"w\">depend on</td><td class=\"m\">~에 달려 있다, ~에 의존하다</td></tr><tr><td class=\"w\">in order to</td><td class=\"m\">~하기 위해</td></tr><tr><td class=\"w\">attract</td><td class=\"m\">끌어들이다, (관심을) 끌다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">경기 결과가</span><span class=\"en\"><b>When the results of games</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예측될 수 없을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">cannot be predicted</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스포츠 경기의 관중은</span><span class=\"en\"><b>attendances at sporting contests</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 늘어날 가능성이 있으며</span><span class=\"en\"><b><span class=\"grammar-hl\">are likely to</span> be higher,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">리그의 수익도 그렇다</span><span class=\"en\"><b><span class=\"grammar-hl\">as are the profits</span> of leagues.</b></span></div></div><div class=\"lec-sent-ko\">경기 결과가 예측될 수 없을 때, 스포츠 경기의 관중은 더 늘어날 가능성이 있으며, 리그의 수익도 그렇다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 예측 불가능성이 가져오는 구체적인 경제적 효과(관중 증가 및 리그 수익 증대)를 설명합니다. 불확실성이 스포츠 산업의 재정적 성공과 직결된다는 상관관계를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cannot be predicted (수동태): 조동사(cannot)+be동사(be)+p.p.(predicted) 구조. predict는 타동사인데 뒤에 목적어가 없어서 수동구조 be predicted 형태로 쓴다. 기본구조: V + O (predict something)</div><div class=\"lec-gr-item\">are likely to (관용표현): &#39;~할 가능성이 있다&#39;, &#39;~하기 쉽다&#39;라는 의미로 be likely to + 동사원형 구조를 사용합니다.</div><div class=\"lec-gr-item\">as are the profits (도치): as 뒤에서 주어(the profits of leagues)와 동사(are)가 도치된 구조입니다. 앞 문장의 동사구(are likely to be higher)를 대신하는 대동사 역할을 겸하며, 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">result</td><td class=\"m\">결과</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예측 가능성의 결여는</span><span class=\"en\"><b>the lack of predictability</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또한 ~로 이어진다</span><span class=\"en\"><b>also <span class=\"grammar-hl\">leads to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상당한 변동성</span><span class=\"en\"><b>significant variability</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스포츠 수행의 질에 있어</span><span class=\"en\"><b>in the quality of <span class=\"grammar-hl\">sporting performances</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나, 예측 가능성의 결여는 또한 스포츠 수행(실적)의 질에 있어 상당한 변동성으로 이어진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;However&#39;를 통해 분위기를 전환하며 예측 불가능성이 가진 &#39;양날의 검&#39;과 같은 측면을 지적합니다. 흥행에는 도움이 되지만, 제공되는 상품(경기)의 질이 일정하지 않다는 문제점을 제기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">leads to (관용표현): &#39;~로 이어지다&#39;, &#39;~를 초래하다&#39;라는 의미로 결과적인 상황을 나타낼 때 자주 쓰입니다.</div><div class=\"lec-gr-item\">sporting performances (현재분사(형용사)): sporting이 performances를 수식하며 &#39;스포츠와 관련된/경기를 하는 성과&#39;라는 의미를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">predictability</td><td class=\"m\">예측 가능성</td></tr><tr><td class=\"w\">quality</td><td class=\"m\">질, 품질</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 요인들이</span><span class=\"en\"><b>Many factors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">원인이 될 수 있다</span><span class=\"en\"><b>can <span class=\"grammar-hl\">contribute to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스포츠 상품의 변동성의</span><span class=\"en\"><b>the variability of the sport product,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">날씨, 선수 부상, 경기장을 포함하여</span><span class=\"en\"><b><span class=\"grammar-hl\">including</span> the weather, player injuries, the venue,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상대 팀의 실력</span><span class=\"en\"><b>the quality of the opponents,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점수의 근접성</span><span class=\"en\"><b>the closeness of the scores</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 심지어 관중의 규모까지</span><span class=\"en\"><b>and even the size of the crowd.</b></span></div></div><div class=\"lec-sent-ko\">날씨, 선수 부상, 경기장, 상대 팀의 실력, 점수의 근접성과 심지어 관중의 규모를 포함하여, 많은 요인들이 스포츠 상품의 변동성의 원인이 될 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;품질의 변동성&#39;이 발생하는 구체적인 원인들을 나열합니다. 통제 불가능한 다양한 변수들이 스포츠라는 상품의 질을 매번 다르게 만든다는 점을 상세히 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">contribute to (관용표현): &#39;~에 기여하다&#39;, &#39;~의 원인이 되다&#39;라는 의미로 전치사 to 뒤에 명사구가 옵니다.</div><div class=\"lec-gr-item\">including (분사구문): 문장 뒤에서 추가적인 정보를 나열하는 부사적 기능을 수행합니다. 원래 절로 변환하면 as they include the weather... 등으로 표현할 수 있습니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">product</td><td class=\"m\">제품, 산물</td></tr><tr><td class=\"w\">quality</td><td class=\"m\">질, 품질</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">크리켓 경기는</span><span class=\"en\"><b>A cricket match</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">짜릿할 수도</span><span class=\"en\"><b>can be <span class=\"grammar-hl\">exhilarating</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지루할 수도 혹은 좌절감을 줄 수도 있지만</span><span class=\"en\"><b>boring or even frustrating,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">팬들은</span><span class=\"en\"><b>but fans</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여전히 지불해야 한다</span><span class=\"en\"><b>still <span class=\"grammar-hl\">have to</span> pay</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동일한 가격을</span><span class=\"en\"><b>the same price.</b></span></div></div><div class=\"lec-sent-ko\">크리켓 경기는 짜릿할 수도, 지루할 수도, 심지어 좌절감을 줄 수도 있지만, 팬들은 여전히 동일한 가격을 지불해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 품질 변동성에 따른 소비자(팬)의 리스크를 구체적인 예시(크리켓)를 통해 설명합니다. 상품의 질이 낮더라도(지루하더라도) 가격은 동일하다는 점이 일반적인 상업 제품과 다른 스포츠만의 독특한 특징임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">exhilarating (현재분사(형용사)): exhilarating이 문장의 보어 역할을 하여 주어인 a cricket match의 성질(&#39;활기를 주는/아주 신나는&#39;)을 설명합니다.</div><div class=\"lec-gr-item\">have to (관용표현): 의무를 나타내는 &#39;해야 한다&#39;는 의미의 표현입니다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스포츠 마케팅 담당자들은</span><span class=\"en\"><b>Sport marketers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이를 극복하려 시도할지 모른다</span><span class=\"en\"><b>may attempt <span class=\"grammar-hl\">to overcome</span> this</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상품을 ‘개선’함으로써</span><span class=\"en\"><b>by ‘<span class=\"grammar-hl\">improving</span>’ the product</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">체계적인 방식으로</span><span class=\"en\"><b>in systematic ways,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스타 선수 포함과 같은</span><span class=\"en\"><b>such as including a star player,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">프리미엄 좌석 제공</span><span class=\"en\"><b>offering premium seating</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 다른 형태의 오락거리 제공</span><span class=\"en\"><b>or providing other forms of entertainment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 매력적인 편의 시설과 같은</span><span class=\"en\"><b>and <span class=\"grammar-hl\">inviting facilities</span>.</b></span></div></div><div class=\"lec-sent-ko\">스포츠 마케팅 담당자들은 스타 선수 영입, 프리미엄 좌석 제공 또는 다른 형태의 오락거리와 편의 시설 제공과 같이, 체계적인 방식으로 (스포츠) 상품을 ‘개선’함으로써 이를 극복하려 시도할지 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 경기 내용의 불확실성과 품질 변동성이라는 약점을 보완하기 위한 마케터들의 전략을 설명합니다. 경기의 승패는 조절할 수 없으므로, 대신 통제 가능한 요소(시설, 스타, 서비스)를 강화하여 전체적인 상품 가치를 높이려 한다는 논리입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to overcome (to부정사): 명사적 용법으로 타동사 attempt의 목적어 역할을 하며 &#39;~하는 것을 시도하다&#39;라는 의미를 형성합니다.</div><div class=\"lec-gr-item\">improving (동명사): 전치사 by의 목적어로 쓰여 &#39;~함으로써&#39;라는 수단이나 방법을 나타냅니다.</div><div class=\"lec-gr-item\">inviting facilities (현재분사(형용사)): inviting이 facilities를 수식하여 &#39;매력적인/가고 싶은 시설&#39;이라는 의미를 나타냅니다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">product</td><td class=\"m\">제품, 산물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">불확실한 속성은</span><span class=\"en\"><b>The uncertain nature</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스포츠 경기의</span><span class=\"en\"><b>of sport contests</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 한 요소일 뿐이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is just one element</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전체 경험의</span><span class=\"en\"><b>of a total experience,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비록 그것이 ~일지라도</span><span class=\"en\"><b>although it is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요한 요소</span><span class=\"en\"><b>an important element</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재정적 성공을 위한</span><span class=\"en\"><b>for financial success.</b></span></div></div><div class=\"lec-sent-ko\">스포츠 경기의 불확실한 속성은 전체 경험의 단지 한 요소일 뿐이지만, 재정적 성공을 위한 중요한 요소이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 마무리하며 스포츠 산업의 본질을 정리합니다. 불확실성이 흥행의 핵심이긴 하지만, 마케터들은 이를 포함한 전체적인 고객 경험을 관리해야 한다는 종합적인 관점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is just one element 2형식(SVC) 구조: 주어(The uncertain nature of sport contests)와 보어(one element)를 연결하는 기본 구조입니다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>일반 기업은 품질의 확실성을 추구하지만, 스포츠 산업은 &#39;예측 불가능성&#39;을 핵심 가치로 삼는다.</li><li>경기 결과를 알 수 없을 때 관중이 늘고 리그 수익이 증대되는 경제적 효과가 나타난다.</li><li>그러나 이러한 불확실성은 경기 품질의 기복을 초래하며, 팬들은 경기 내용과 관계없이 동일한 비용을 지불해야 한다.</li><li>이를 보완하기 위해 마케터들은 시설 개선이나 스타 선수 영입 등 통제 가능한 요소를 통해 전체적인 소비자 경험을 관리한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Professional sports utilize the unpredictability of outcomes as a key driver for financial success because it enhances spectator engagement despite creating inconsistent quality in the sport product.</div>\n              <div class=\"lec-final-sum-ko\">프로 스포츠는 경기 결과의 불확실성을 재정적 성공의 핵심 동력으로 활용하는데, 이는 스포츠 상품의 일관성 없는 품질을 초래함에도 불구하고 관객의 몰입도를 높이기 때문이다.</div></div></div>"],"segs":[[{"audio":"./41_audio/1.mp3","hl":null}],[{"audio":"./41_audio/2.mp3","hl":null}],[{"audio":"./41_audio/3.mp3","hl":null},{"audio":"./41_audio/4.mp3","hl":"stage-0"},{"audio":".
