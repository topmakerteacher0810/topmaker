 관계에 비유할 수 있습니다. 심리학자 조지 밀러(George Miller)의 연구에 따르면, 작업 기억은 &#39;마법의 숫자 7&#39;이라 불릴 만큼 한 번에 처리할 수 있는 정보의 양이 매우 제한적이라는 특징이 있습니다. 장기 기억은 평소에 의식되지 않는 거대한 창고와 같아서, 우리가 무언가를 떠올리려면 이 창고에서 정보를 꺼내 의식의 영역인 작업 기억으로 옮겨와야만 합니다. 그래서 아무리 많은 정보를 알고 있더라도 인지적 용량의 한계 때문에 한 번에 대여섯 개 이상의 개별 정보를 동시에 선명하게 떠올리기는 어렵답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01두 기억 시스템의 차이</div><ul><li>작업 기억은 우리가 명시적으로 의식하는 영역이지만, 장기 기억은 직접 접근할 수 없는 저장소다.</li><li>작업 기억: 정보에 대해 명시적으로 인식(explicitly aware)함</li><li>장기 기억: 정보에 직접 접근(directly access)하는 것이 불가능함</li><li>핵심 키워드: 의식(consciousness)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02정보의 인출 방식</div><ul><li>장기 기억에 저장된 정보를 인식하기 위해서는 이를 작업 기억의 영역으로 가져와야 한다.</li><li>장기 기억의 정보를 작업 기억으로 가져와서 인식에 도달함</li><li>평소 정보는 의식 밖(outside your consciousness)에 저장되어 있음</li><li>핵심 키워드: 인출(retrieve)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03배우 명단 떠올리기 사례</div><ul><li>알고 있는 배우들의 이름을 나열하는 과정을 통해 두 기억의 상호작용을 보여준다.</li><li>수많은 배우 정보는 평소 장기 기억에 보관됨</li><li>이름을 말할 때 작업 기억을 사용해 하나씩 끄집어냄(reel them off)</li><li>핵심 키워드: 사례(example)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04작업 기억의 용량 한계</div><ul><li>작업 기억은 한 번에 처리하고 유지할 수 있는 정보의 양에 명확한 한계가 존재한다.</li><li>처리 용량: 7개의 항목(items) 또는 덩이(chunks)로 제한됨</li><li>아무리 많은 정보를 알아도 한 번에 소수만 의식 가능함</li><li>핵심 키워드: 용량 제한(limit)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">term</td><td class=\"m\">용어</td></tr><tr><td class=\"w\">explicitly</td><td class=\"m\">분명하게, 명시적으로</td></tr><tr><td class=\"w\">aware</td><td class=\"m\">알고 있는, 의식하는</td></tr><tr><td class=\"w\">directly</td><td class=\"m\">직접, 곧바로</td></tr><tr><td class=\"w\">access</td><td class=\"m\">접근하다, 이용하다</td></tr><tr><td class=\"w\">limit</td><td class=\"m\">한계, 제한</td></tr><tr><td class=\"w\">item</td><td class=\"m\">항목, 물품</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">chunk</td><td class=\"m\">덩어리, 상당한 양</td></tr><tr><td class=\"w\">hold</td><td class=\"m\">잡다, 유지하다</td></tr><tr><td class=\"w\">explicit</td><td class=\"m\">분명한, 명시적인</td></tr><tr><td class=\"w\">awareness</td><td class=\"m\">인식, 자각</td></tr><tr><td class=\"w\">visualize</td><td class=\"m\">마음속에 그리다</td></tr><tr><td class=\"w\">retrieve</td><td class=\"m\">되찾다, 꺼내다</td></tr><tr><td class=\"w\">consciousness</td><td class=\"m\">의식</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">큰 차이는</span><span class=\"en\"><b>The big difference</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작업 기억과 장기 기억 사이의</span><span class=\"en\"><b>between working and long-term memory</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~라는 것이다</span><span class=\"en\"><b>is that</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 명시적으로 인식하고 있다는</span><span class=\"en\"><b>we are explicitly aware of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작업 기억 속에 있는 정보를</span><span class=\"en\"><b>the information in <span class=\"grammar-hl\">working memory</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 우리는 할 수 없다</span><span class=\"en\"><b>but we are not able to</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직접 접근하는 것을</span><span class=\"en\"><b>directly access</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정보를</span><span class=\"en\"><b>the information</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 장기 기억 속에 있는</span><span class=\"en\"><b>in our long-term memory.</b></span></div></div><div class=\"lec-sent-ko\">작업 기억과 장기 기억의 큰 차이는 우리가 작업 기억에 있는 정보는 명시적으로 인식하지만, 장기 기억에 있는 정보에는 직접 접근할 수 없다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 소재인 &#39;작업 기억&#39;과 &#39;장기 기억&#39;을 소개하며, 두 개념의 가장 큰 차이점이 &#39;의식의 가용성&#39;에 있음을 정의하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">working memory (동명사(명사적)): working(작업/작동) + memory(기억) = &#39;작업 기억&#39;. working이 기억의 &#39;용도나 활동&#39;을 나타내는 명사적 개념으로 쓰여 memory를 수식한다.</div><div class=\"lec-gr-item\">to access (to부정사): 형용사 able을 수식하는 부사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">be able to (관용표현): &#39;~할 수 있다&#39;라는 의미로, 조동사 can과 유사한 기능을 수행한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">term</td><td class=\"m\">용어</td></tr><tr><td class=\"w\">explicitly</td><td class=\"m\">분명하게, 명시적으로</td></tr><tr><td class=\"w\">aware</td><td class=\"m\">알고 있는, 의식하는</td></tr><tr><td class=\"w\">directly</td><td class=\"m\">직접, 곧바로</td></tr><tr><td class=\"w\">access</td><td class=\"m\">접근하다, 이용하다</td></tr><tr><td class=\"w\">explicit</td><td class=\"m\">분명한, 명시적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 장기 기억에 접근한다</span><span class=\"en\"><b>We access long-term memory</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정보를 불러옴으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by bringing</span> the information</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작업 기억으로</span><span class=\"en\"><b>into <span class=\"grammar-hl\">working memory</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 정보를 작업 기억으로 불러옴으로써 장기 기억에 접근한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 장기 기억에 직접 접근할 수 없다고 했으므로, 이 문장에서는 어떻게 접근할 수 있는지 그 &#39;방법&#39;을 설명합니다. 즉, 작업 기억이 장기 기억의 데이터를 의식 위로 끌어올리는 통로 역할을 한다는 논리적 연결을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">by bringing (동명사): 전치사 by의 목적어 자리에 쓰여 &#39;~함으로써&#39;라는 수단이나 방법을 나타내는 명사 역할을 한다.</div><div class=\"lec-gr-item\">working memory (동명사(명사적)): working(작업) + memory(기억). &#39;기억의 용도&#39;를 나타내는 명사적 개념이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">term</td><td class=\"m\">용어</td></tr><tr><td class=\"w\">access</td><td class=\"m\">접근하다, 이용하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금 당장</span><span class=\"en\"><b>right now</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 인식하고 있지 않다</span><span class=\"en\"><b>you are not aware of</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 배우들을</span><span class=\"en\"><b>all the <span class=\"grammar-hl\">actors</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 본 적 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">you have ever seen</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 지금 당장 당신은 당신이 본 적 있는 모든 배우들을 인식하고 있지 않다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 추상적인 개념(장기 기억의 정보는 직접 접근 불가)을 독자가 쉽게 이해할 수 있도록 &#39;배우 목록&#39;이라는 구체적인 사례를 도입합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">actors you have ever seen (관계대명사): 선행사 actors와 주어 you 사이에 목적격 관계대명사(that/whom)가 생략된 구조이며, 관계대명사절이 선행사를 수식한다.</div><div class=\"lec-gr-item\">be aware of (관용표현): &#39;~을 알고 있다, ~을 인지하다&#39;라는 의미의 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aware</td><td class=\"m\">알고 있는, 의식하는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 저장되어 있다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">are stored</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 장기 기억 속에</span><span class=\"en\"><b>in your long-term memory</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 의식 밖의</span><span class=\"en\"><b>outside your consciousness.</b></span></div></div><div class=\"lec-sent-ko\">그들은 당신의 의식 밖의 장기 기억에 저장되어 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 예시 속의 정보(배우들)가 현재 어느 영역에 머물러 있는지를 명시하며, 1번 문장에서 언급한 &#39;장기 기억 = 직접 접근 불가/의식 밖&#39;이라는 속성을 재확인시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are stored (수동태): be동사(are)+p.p.(stored) 구조. store는 타동사인데 뒤에 목적어가 없어서 수동구조 are stored 형태로 쓴다. 기본구조: V + O (store something)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">term</td><td class=\"m\">용어</td></tr><tr><td class=\"w\">consciousness</td><td class=\"m\">의식</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 내가 당신에게 요청하면</span><span class=\"en\"><b>if I <span class=\"grammar-hl\">asked you</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 배우들을 열거하라고</span><span class=\"en\"><b><span class=\"grammar-hl\">to list</span> all the actors,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 작업 기억을 활용할 것이다</span><span class=\"en\"><b>you would use your working memory</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 하나씩 생각해 내기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to retrieve</span> them <span class=\"grammar-hl\">one by one</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들을 술술 말하기 위해</span><span class=\"en\"><b>and <span class=\"grammar-hl\">reel them off</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 만약 내가 당신에게 모든 배우들을 열거하라고 요청하면, 당신은 작업 기억을 활용해 그들을 하나씩 생각해 내서 술술 말하게 될 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;However&#39;를 통해 상태의 변화를 나타냅니다. 평소에는 의식 밖에 있던 정보가 외부의 자극(질문)을 받으면 작업 기억을 통해 &#39;의식 영역&#39;으로 이동하는 과정을 구체적으로 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">asked you to list 5형식(SVOC) 구조: 동사 ask가 목적어(you)와 목적격 보어(to list)를 취하며, &#39;목적어에게 ~해달라고 요청하다&#39;라는 의미를 만든다.</div><div class=\"lec-gr-item\">to retrieve (to부정사): 부사적 용법 중 목적(~하기 위해서)을 나타낸다.</div><div class=\"lec-gr-item\">one by one (관용표현): &#39;하나씩, 차례로&#39;라는 의미의 부사구이다.</div><div class=\"lec-gr-item\">reel them off (관용표현): reel off는 &#39;(기억하고 있는 것을) 거침없이 말하다/술술 늘어놓다&#39;라는 의미의 구동사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">retrieve</td><td class=\"m\">되찾다, 꺼내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 작업 기억은</span><span class=\"en\"><b>Your <span class=\"grammar-hl\">working memory</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장기 기억에 접근할 수 있다</span><span class=\"en\"><b>can access your long-term memory</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 기억들을 가져올 수 있다</span><span class=\"en\"><b>and bring those memories</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인식으로</span><span class=\"en\"><b>to awareness.</b></span></div></div><div class=\"lec-sent-ko\">당신의 작업 기억은 장기 기억에 접근하여 그 기억들을 인식으로 가져올 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 배우 예시의 과정을 다시 한번 이론적으로 정리해주는 문장입니다. 작업 기억의 핵심 기능이 장기 기억의 정보를 &#39;의식(awareness)&#39;으로 소환하는 것임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">working memory (동명사(명사적)): working(작업) + memory(기억). &#39;작업을 위한 기억&#39;이라는 용도를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">term</td><td class=\"m\">용어</td></tr><tr><td class=\"w\">aware</td><td class=\"m\">알고 있는, 의식하는</td></tr><tr><td class=\"w\">access</td><td class=\"m\">접근하다, 이용하다</td></tr><tr><td class=\"w\">awareness</td><td class=\"m\">인식, 자각</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 기억하라</span><span class=\"en\"><b>But <span class=\"grammar-hl\">remember</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 한계를 가진다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">it has</span> a limit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">7개 항목 또는 덩어리라는</span><span class=\"en\"><b>of seven items or chunks.</b></span></div></div><div class=\"lec-sent-ko\">하지만 그것은 7개 항목 또는 덩어리라는 한계가 있다는 것을 기억하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;But&#39;을 사용하여 글의 흐름을 전환합니다. 작업 기억의 유용한 기능 뒤에 숨겨진 치명적인 단점인 &#39;용량의 제한성&#39;을 언급하며 새로운 정보를 추가합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">remember it has (명사절): 동사 remember의 목적어 역할을 하는 명사절을 이끄는 접속사 that이 생략된 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limit</td><td class=\"m\">한계, 제한</td></tr><tr><td class=\"w\">item</td><td class=\"m\">항목, 물품</td></tr><tr><td class=\"w\">chunk</td><td class=\"m\">덩어리, 상당한 양</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">각 배우는</span><span class=\"en\"><b><span class=\"grammar-hl\">Each actor</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 항목이 될 것이다</span><span class=\"en\"><b>would be an item.</b></span></div></div><div class=\"lec-sent-ko\">각 배우는 하나의 항목이 될 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 7번 문장에서 말한 추상적인 &#39;항목(item)&#39;이라는 단위가 앞선 배우 예시에서는 배우 한 명에 해당한다고 매칭시켜 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Each actor (관용표현): each 뒤에는 반드시 단수 명사가 오며, 문장 전체에서도 단수 취급을 원칙으로 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">item</td><td class=\"m\">항목, 물품</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">노력하고 유지하라</span><span class=\"en\"><b><span class=\"grammar-hl\">Try and hold</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 아는 모든 배우를</span><span class=\"en\"><b>all the <span class=\"grammar-hl\">actors you know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 명시적 인식 속에</span><span class=\"en\"><b>in your explicit awareness.</b></span></div></div><div class=\"lec-sent-ko\">당신이 아는 모든 배우를 당신의 명시적 인식 속에 떠올리려고 해보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 독자에게 직접적인 실험을 제안함으로써, 작업 기억의 한계를 머리로만 아는 것이 아니라 실제 경험으로 체감하게 유도하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">actors you know (관계대명사): 선행사 actors 뒤에 목적격 관계대명사(that/whom)가 생략되었으며, you know가 actors를 수식하는 구조이다.</div><div class=\"lec-gr-item\">Try and hold (관용표현): 구어체에서 Try to hold 대신 쓰이며, &#39;~하려고 노력하다/시도하다&#39;라는 의미를 가진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aware</td><td class=\"m\">알고 있는, 의식하는</td></tr><tr><td class=\"w\">hold</td><td class=\"m\">잡다, 유지하다</td></tr><tr><td class=\"w\">explicit</td><td class=\"m\">분명한, 명시적인</td></tr><tr><td class=\"w\">awareness</td><td class=\"m\">인식, 자각</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 노력할지도 모른다</span><span class=\"en\"><b>You might try</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시각화하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to visualize</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 큰 무리를</span><span class=\"en\"><b>a large group of them.</b></span></div></div><div class=\"lec-sent-ko\">당신은 그들을 하나의 큰 무리로 시각화하려고 노력할지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 용량의 한계를 극복하기 위해 인간이 취할 수 있는 일반적인 노력(시각화)을 묘사하여 상황을 더욱 생생하게 만듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to visualize (to부정사): 명사적 용법으로 동사 try의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">visualize</td><td class=\"m\">마음속에 그리다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 당신은 여전히</span><span class=\"en\"><b>But you still</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 인식할 뿐이다</span><span class=\"en\"><b>would only <span class=\"grammar-hl\">be aware of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇몇 배우만을</span><span class=\"en\"><b>a few actors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어느 한 번에</span><span class=\"en\"><b><span class=\"grammar-hl\">at any one time</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 당신은 여전히 한 번에 몇몇 배우만을 인식할 뿐이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;But&#39;을 통해 앞선 노력이 실패할 것임을 보여주며, 결국 작업 기억은 한 번에 아주 소수의 정보만을 처리할 수 있다는 최종 결론에 도달하며 글을 마칩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">be aware of (관용표현): &#39;~을 인지하다/알다&#39;라는 의미로 쓰였다.</div><div class=\"lec-gr-item\">at any one time (관용표현): &#39;한 번에, 어느 한 시점에&#39;라는 의미의 부사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aware</td><td class=\"m\">알고 있는, 의식하는</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>기억은 크게 의식 가능한 &#39;작업 기억&#39;과 직접 접근이 불가능한 &#39;장기 기억&#39;으로 나뉜다.</li><li>장기 기억 속의 정보를 사용하려면 작업 기억이라는 통로를 통해 의식 위로 끌어올려야 한다.</li><li>배우의 이름을 떠올리는 과정을 통해 이러한 기억의 메커니즘을 쉽게 이해할 수 있다.</li><li>하지만 작업 기억은 한 번에 약 7개 정도의 정보만 처리할 수 있는 뚜렷한 용량의 한계를 가지고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Long-term memory stores information outside of immediate consciousness while working memory retrieves a limited amount of that data into explicit awareness for active processing.</div>\n              <div class=\"lec-final-sum-ko\">장기 기억은 즉각적인 의식 밖에서 정보를 저장하는 반면, 작업 기억은 능동적인 처리를 위해 그 데이터의 제한된 양만을 명시적 의식으로 인출한다.</div></div></div>"],"segs":[[{"audio":"./37_audio/1.mp3","hl":null}],[{"audio":"./37_audio/2.mp3","hl":null}],[{"audio":"./37_audio/3.mp3","hl":null},{"audio":"./37_audio/4.mp3","hl":"stage-0"},{"audio":"./37_audio/5.mp3","hl":"stage-1"},{"audio":"./37_audio/6.mp3","hl":"stage-2"},{"audio":"./37_audio/7.mp3","hl":"stage-3"}],[{"audio":"./37_audio/8.mp3","hl":null}],[{"audio":"./37_audio/9.mp3","hl":"main"},{"audio":"./37_audio/10.mp3","hl":"meaning"},{"audio":"./37_audio/11.mp3","hl":"grammar"}],[{"audio":"./37_audio/12.mp3","hl":"main"},{"audio":"./37_audio/13.mp3","hl":"meaning"},{"audio":"./37_audio/14.mp3","hl":"grammar"}],[{"audio":"./37_audio/15.mp3","hl":"main"},{"audio":"./37_audio/16.mp3","hl":"meaning"},{"audio":"./37_audio/17.mp3","hl":"grammar"}],[{"audio":"./37_audio/18.mp3","hl":"main"},{"audio":"./37_audio/19.mp3","hl":"meaning"},{"audio":"./37_audio/20.mp3","hl":"grammar"}],[{"audio":"./37_audio/21.mp3","hl":"main"},{"audio":"./37_audio/22.mp3","hl":"meaning"},{"audio":"./37_audio/23.mp3","hl":"grammar"}],[{"audio":"./37_audio/24.mp3","hl":"main"},{"audio":"./37_audio/25.mp3","hl":"meaning"},{"audio":"./37_audio/26.mp3","hl":"grammar"}],[{"audio":"./37_audio/27.mp3","hl":"main"},{"audio":"./37_audio/28.mp3","hl":"meaning"},{"audio":"./37_audio/29.mp3","hl":"grammar"}],[{"audio":"./37_audio/30.mp3","hl":"main"},{"audio":"./37_audio/31.mp3","hl":"meaning"},{"audio":"./37_audio/32.mp3","hl":"grammar"}],[{"audio":"./37_audio/33.mp3","hl":"main"},{"audio":"./37_audio/34.mp3","hl":"meaning"},{"audio":"./37_audio/35.mp3","hl":"grammar"}],[{"audio":"./37_audio/36.mp3","hl":"main"},{"audio":"./37_audio/37.mp3","hl":"meaning"},{"audio":"./37_audio/38.mp3","hl":"grammar"}],[{"audio":"./37_audio/39.mp3","hl":"main"},{"audio":"./37_audio/40.mp3","hl":"meaning"},{"audio":"./37_aud
