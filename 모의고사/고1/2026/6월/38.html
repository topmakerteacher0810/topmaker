lwevzDr6dfYdc8U009f66aLf5+jfQOa+ye6Xz0bXTv6fjZ3UHJ6YA/z7fh1/ApTdykn51PfqPUdeefXuR9DQWTnLqQQMcj9efTgjsRQmu+mnS1trdNv62Wg5PW0X/Xy6ef+Q8Dn04P/wBf0Hrnkd6Qjke2f16Hr6Z/Pg03evPzL7cjkfmcY7+3em7xu+8mP94dOPft/j0yKOvVaLS2qvZ+ln/nro7DbbXuvTXz1t9/Zr8tSUcEHGfr3/z/AJFJTNy9d69cdV7/AI9OM/5ADiyjq69OOR6/gR17+mBRdX6/1Z7fPt67BzdOV9baa9NPy0+elxfQ/wCf06/Q4x19KP8AHp6Um9AM704xkZ/qOB69emfwXcuM71x2G4c8jPfjjr3x7UJ+b7W1662t3s/z6XKvto10++3+f4MOmARj8Mfh14z+Pp3oP5Y9/wBf88Diml1HUrgZ5yM/hzg9fbr1IIpd6dSy/TcB1/HjHXp14xjoXem7srdVvbZPSzvffv5h576fn5PbZf1uuASCegP8+vv0HHc+9LwPXP16e2MfyP8AWmBgTwy4Az1HPbjn6fWjenHzr/30Onf/AD9Oxov0u9Ld/wAfW/Xz8yXJ9Iv1s7q9nb5dV9+grNgZ/D0qFn69eh4HbBznODzjjdgc9BkUrOuQQRhScjOAe/X+ePbLc8QNw2cgErkFT0HUDleRx0AOexJ5qoayi9XZx2X95K3VX0ur+m9wUdG3ukpXte1mlb1t1t166n//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Speak with Your Hands: How Gestures Enhance Memory Recall<small>손으로 말하기: 몸짓이 기억 회상을 강화하는 방법</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 손을 움직이며 무언가를 설명할 때 기억력이 높아지는 현상은 체화된 인지(Embodied Cognition)라는 심리학 이론과 깊은 관련이 있습니다. 이는 단순히 머리(뇌)로만 정보를 처리하는 것이 아니라, 신체적 움직임이 인지 과정에 적극적으로 참여하여 정보를 뇌 속에 더 강력하게 새기는 부호화(Encoding) 과정을 돕는다는 원리인데요. 예를 들어 복잡한 길을 설명할 때 손으로 방향을 직접 그려보는 것처럼, 언어(Speech)와 제스처(Gesture)가 동시에 일어나면 우리 뇌는 시각적·운동적 정보를 함께 결합하여 훨씬 입체적인 기억을 형성하게 됩니다. 결과적으로 이러한 다중 감각적 자극은 시간이 흘러도 정보를 쉽게 잊지 않도록 돕는 강력한 기억의 단서(Memory Cues) 역할을 톡톡히 하게 된답니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01연구 가설과 실험 설계</div><ul><li>사건을 묘사할 때 제스처(gesture)를 사용하는 것이 기억 회상에 도움이 되는지 확인하고자 성인들을 대상으로 실험을 진행함.</li><li>참가자들은 동물이나 사람이 독특한 행동을 하는 영상을 시청함</li><li>묘사 직후와 3주 후(three weeks later) 두 차례에 걸쳐 기억력을 측정함</li><li>핵심 키워드: 기억 회상(recall), 제스처(gesture)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02실험 1: 지시된 제스처의 영향</div><ul><li>참가자들에게 제스처를 사용하거나 사용하지 말라고 구체적으로 지시한 후 기억의 정도를 비교함.</li><li>제스처를 하도록 지시받은 성인들이 그렇지 않은 그룹보다 더 많이 기억함</li><li>특히 수주일이 지난 후의 장기 기억에서 효과가 두드러지게 나타남</li><li>핵심 키워드: 지시(instructions), 장기 기억(several weeks later)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실험 2: 자발적 제스처의 확인</div><ul><li>제스처 사용에 대한 아무런 지시를 주지 않았을 때도 동일한 기억 강화 효과가 나타나는지 재실험함.</li><li>참가자들이 스스로 수행한 자발적 제스처(spontaneous gesture)에 주목함</li><li>제스처를 사용한 항목이 그렇지 않은 항목보다 더 잘 기억되는 동일한 패턴(same patterns)을 발견함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 시사점</div><ul><li>말을 할 때 제스처를 함께 사용하는 것이 정보의 부호화와 기억 유지에 결정적인 역할을 한다는 사실을 입증함.</li><li>제스처는 언어에 담긴 정보를 더 기억에 남게(memorable) 만드는 부호화 도구임</li><li>언어와 신체 동작의 결합이 기억력에 미치는 긍정적 효과를 강조함</li><li>핵심 키워드: 정보 부호화(encoded), 기억에 남는(memorable)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">describe</td><td class=\"m\">묘사하다, 서술하다</td></tr><tr><td class=\"w\">particularly</td><td class=\"m\">특히, 특별히</td></tr><tr><td class=\"w\">recall</td><td class=\"m\">기억해 내다</td></tr><tr><td class=\"w\">object</td><td class=\"m\">물체, 대상</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">수행하다, 해내다</td></tr><tr><td class=\"w\">odd</td><td class=\"m\">이상한, 홀수의</td></tr><tr><td class=\"w\">slide</td><td class=\"m\">미끄러지다, 미끄러뜨리다</td></tr><tr><td class=\"w\">bend</td><td class=\"m\">구부리다, 휘다</td></tr><tr><td class=\"w\">swing</td><td class=\"m\">흔들리다, 그네</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">immediately</td><td class=\"m\">즉시, 곧바로</td></tr><tr><td class=\"w\">description</td><td class=\"m\">설명, 묘사</td></tr><tr><td class=\"w\">instruction</td><td class=\"m\">지시, 설명</td></tr><tr><td class=\"w\">found</td><td class=\"m\">찾다, 발견하다 (find의 과거형)</td></tr><tr><td class=\"w\">item</td><td class=\"m\">항목, 물품</td></tr><tr><td class=\"w\">spontaneous</td><td class=\"m\">즉흥적인, 자발적인</td></tr><tr><td class=\"w\">produce</td><td class=\"m\">생산하다, 만들어 내다</td></tr><tr><td class=\"w\">encode</td><td class=\"m\">암호화하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 제스처를 한다면</span><span class=\"en\"><b>If you gesture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 사건을 묘사하면서,</span><span class=\"en\"><b><span class=\"grammar-hl\">while describing</span> an event,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 생각하는가</span><span class=\"en\"><b>do you think</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 기억해낼 수 있을 거라고</span><span class=\"en\"><b>you’ll be able <span class=\"grammar-hl\">to recall</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사건을 더 잘</span><span class=\"en\"><b>that event better</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 제스처를 하지 않는 경우보다?</span><span class=\"en\"><b>than if you don’t gesture?</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 어떤 사건을 묘사하면서 제스처를 한다면, 제스처를 하지 않는 경우보다 그 사건을 더 잘 기억해낼 수 있을 거라고 생각하는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부에서 독자에게 질문을 던지며 &#39;몸짓(gesture)&#39;과 &#39;기억 회상(recall)&#39; 사이의 상관관계라는 핵심 주제를 제시하고 있습니다. 독자의 호기심을 유발하며 앞으로 전개될 실험의 목적을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">while describing (분사구문): 접속사 while 뒤에 주어와 be동사가 생략된 형태의 분사구문이다. 원래 절로 변환하면 while you are describing이 된다.</div><div class=\"lec-gr-item\">to recall (to부정사): be able to(~할 수 있다) 표현의 일부로 쓰여 &#39;기억해내다&#39;라는 의미를 보충하는 형태다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recall</td><td class=\"m\">기억해 내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 성인들에게 시켰다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">had adults</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영상들을 시청하게</span><span class=\"en\"><b><span class=\"grammar-hl\">watch</span> videos</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장난감 물체, 동물, 그리고 사람들의</span><span class=\"en\"><b>of toy objects, animals, and people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한,</span><span class=\"en\"><b><span class=\"grammar-hl\">performing</span> various,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">때로는 기이한 행동을 하는:</span><span class=\"en\"><b>sometimes odd, actions:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미끄러지는 닭,</span><span class=\"en\"><b>a chicken <span class=\"grammar-hl\">sliding</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경찰관에게로,</span><span class=\"en\"><b>to a policeman,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몸을 굽히는 조깅하는 사람,</span><span class=\"en\"><b>a jogger <span class=\"grammar-hl\">bending</span> down</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발끝을 만지기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">to touch</span> his toes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흔들리며 닫히는 울타리</span><span class=\"en\"><b>a fence <span class=\"grammar-hl\">swinging</span> shut</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저절로.</span><span class=\"en\"><b><span class=\"grammar-hl\">on its own</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 성인들에게 다양한, 때로는 기이한, 행동을 하는 장난감 물체, 동물, 그리고 사람들의 영상을 시청하게 했는데, (예를 들면) 경찰관에게로 미끄러지는 닭, 몸을 굽혀 발끝을 만지는 조깅하는 사람, 저절로 흔들리며 달리는 울타리였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 답하기 위한 구체적인 실험 과정을 설명합니다. 실험 참가자들이 기억해야 할 구체적인 대상(영상 속 사건들)을 설정하는 단계로, 기억의 난이도를 높이기 위해 의도적으로 &#39;특이한 행동&#39;들을 자극제로 사용했습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had adults watch (5형식): 사역동사 have + 목적어(adults) + 목적보어(watch) 구조다. 목적어와 보어의 관계가 능동이므로 목적보어 자리에 동사원형(원형부정사)을 쓴다.</div><div class=\"lec-gr-item\">performing (현재분사(형용사)): performing이 앞의 명사 people을 수식하여 &#39;동작을 수행하는 사람들&#39;이라는 의미를 나타낸다. (= people who were performing).</div><div class=\"lec-gr-item\">sliding (현재분사(형용사)): sliding이 앞의 명사 a chicken을 수식하여 &#39;미끄러져 가는 닭&#39;의 상태를 묘사한다. (= a chicken that was sliding).</div><div class=\"lec-gr-item\">bending (현재분사(형용사)): bending이 앞의 명사 a jogger를 수식하여 &#39;몸을 굽히는 조깅하는 사람&#39;의 동작을 설명한다. (= a jogger who was bending).</div><div class=\"lec-gr-item\">to touch (to부정사): 부사적 용법 중 &#39;목적&#39;(~하기 위해서)으로 쓰여 동작의 의도를 나타낸다.</div><div class=\"lec-gr-item\">swinging (현재분사(형용사)): swinging이 앞의 명사 a fence를 수식하여 &#39;흔들리는 울타리&#39;의 상태를 묘사한다. (= a fence that was swinging).</div><div class=\"lec-gr-item\">on its own (관용표현): &#39;스스로&#39;, &#39;저절로&#39;라는 의미의 숙어 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">object</td><td class=\"m\">물체, 대상</td></tr><tr><td class=\"w\">perform</td><td class=\"m\">수행하다, 해내다</td></tr><tr><td class=\"w\">odd</td><td class=\"m\">이상한, 홀수의</td></tr><tr><td class=\"w\">bend</td><td class=\"m\">구부리다, 휘다</td></tr><tr><td class=\"w\">swing</td><td class=\"m\">흔들리다, 그네</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 그 후 테스트했다</span><span class=\"en\"><b>We then <span class=\"grammar-hl\">tested</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">성인들의 기억을</span><span class=\"en\"><b><span class=\"grammar-hl\">the adults’ memories</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 사건들에 대한</span><span class=\"en\"><b>of these events</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">묘사 직후에</span><span class=\"en\"><b>immediately after the descriptions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 3주 후에.</span><span class=\"en\"><b>and three weeks later.</b></span></div></div><div class=\"lec-sent-ko\">그 다음에 우리는 이 사건들에 대한 그 성인들의 기억을 (그 사건들에 대한) 묘사 직후와 3주 후에 테스트했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 시간적 설계를 보여줍니다. 단순히 즉각적인 기억뿐만 아니라 &#39;3주 후&#39;라는 장기 기억까지 측정함으로써, 몸짓이 기억의 지속성에 미치는 영향을 다각도로 분석하고자 함을 알 수 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tested the adults’ memories (3형식): 주어(We), 동사(tested), 목적어(the adults’ memories)로 구성된 전형적인 SVO 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">immediately</td><td class=\"m\">즉시, 곧바로</td></tr><tr><td class=\"w\">description</td><td class=\"m\">설명, 묘사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">성인들은</span><span class=\"en\"><b>Adults</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제스처를 하라는 말을 들은</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span> <span class=\"grammar-hl\">were told to gesture</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사건들을 묘사하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">while describing</span> the events</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 것을 기억했다</span><span class=\"en\"><b>remembered more</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">성인들보다</span><span class=\"en\"><b>than adults</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제스처를 하지 말라는 말을 들은,</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span> were told not to gesture,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특히 몇 주 후에.</span><span class=\"en\"><b>particularly several weeks later.</b></span></div></div><div class=\"lec-sent-ko\">사건을 묘사하면서 제스처를 하라고 들은 성인들은 제스처를 하지 말라고 들은 성인들보다 더 많은 것을 기억했으며, 특히 몇 주 후에 (더 그러했다).</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 번째 실험의 결과입니다. 인위적인 지시가 있었을 때 &#39;몸짓을 한 그룹&#39;이 그렇지 않은 그룹보다 기억력이 우수했으며, 특히 시간이 흐를수록 그 효과(장기 기억 보존)가 뚜렷하게 나타났음을 입증합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who (관계대명사): 주격 관계대명사로 선행사 Adults를 수식하며 뒤에 동사(were told)가 이어지는 불완전한 절을 이끈다.</div><div class=\"lec-gr-item\">were told to gesture (수동태): be동사(were)+p.p.(told) 구조. tell은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 were told 형태로 쓴다. 기본구조: tell + O + toV (5형식). 원래 능동 기본틀인 tell+O+toV에서 목적어(O)가 주어로 올라가면서 be+p.p.로 수동 전환되고, 목적보어였던 toV는 그대로 남는다.</div><div class=\"lec-gr-item\">while describing (분사구문): 접속사 while 뒤에 주어와 be동사가 생략된 형태의 분사구문이다. 원래 절로 변환하면 while they were describing이 된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">particularly</td><td class=\"m\">특히, 특별히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">확인하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">To see</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 동일한 결과를 얻을 수 있는지</span><span class=\"en\"><b><span class=\"grammar-hl\">if we’d get</span> the same effects</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 스스로 제스처를 하는 경우에도,</span><span class=\"en\"><b>if people gestured <span class=\"grammar-hl\">on their own</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 연구를 다시 수행했다,</span><span class=\"en\"><b>we did the study again,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 이번에는</span><span class=\"en\"><b>but this time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 성인들에게 주었다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">gave the adults</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제스처에 관한 아무런 지시도.</span><span class=\"en\"><b><span class=\"grammar-hl\">no instructions</span> about gesture.</b></span></div></div><div class=\"lec-sent-ko\">사람들이 스스로 제스처를 하는 경우에도 동일한 결과를 얻을 수 있는지 확인하기 위해, 우리는 연구를 다시 수행했지만, 이번에는 성인들에게 제스처에 관해 아무런 지시도 하지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 실험이 &#39;지시&#39;에 의한 것이었다면, 이번에는 &#39;자발적 행동&#39;에서도 동일한 결과가 나오는지 검증하는 두 번째 실험 단계입니다. 연구의 타당성과 일반화 가능성을 높이려는 논리적 흐름입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To see (to부정사): 부사적 용법 중 &#39;목적&#39;(~하기 위해서)으로 쓰여 문장 전체의 목적을 나타낸다.</div><div class=\"lec-gr-item\">if we’d get (간접의문문): 동사 see의 목적어 역할을 하는 명사절로, 접속사 if는 &#39;~인지 아닌지&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">on their own (관용표현): &#39;그들 스스로&#39;, &#39;자발적으로&#39;라는 의미의 숙어 표현이다.</div><div class=\"lec-gr-item\">gave the adults no instructions (5형식): gave(동사) + the adults(간접목적어) + no instructions(직접목적어)로 구성된 4형식(SVOO) 구조이나, 동사 give를 활용한 수여 구조를 보여준다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">instruction</td><td class=\"m\">지시, 설명</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 동일한 양상을 발견했다:</span><span class=\"en\"><b>We found the same patterns:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 항목들을 기억했다</span><span class=\"en\"><b>people remembered items</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 자발적으로 제스처를 했던</span><span class=\"en\"><b><span class=\"grammar-hl\">on which they had gestured spontaneously</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항목들보다 더 잘</span><span class=\"en\"><b>better than items</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 제스처를 하지 않았던.</span><span class=\"en\"><b>on which they had not gestured.</b></span></div></div><div class=\"lec-sent-ko\">우리는 동일한 양상을 발견했다. 즉, 사람들은 자발적으로 제스처를 했던 항목들을 제스처를 하지 않았던 항목들보다 더 잘 기억했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 실험의 결과로, 인위적인 지시 여부와 관계없이 &#39;몸짓 행위&#39; 그 자체가 기억력을 향상시킨다는 보편적인 결론을 도출합니다. 앞 문장의 의구심을 해소하는 결과입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">on which they had gestured spontaneously (전치사+관계대명사): 전치사(on) + 관계대명사(which) + S(they) + V(had gestured...) 구조로 선행사 items를 수식한다. 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절(완전문장)이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">found</td><td class=\"m\">찾다, 발견하다 (find의 과거형)</td></tr><tr><td class=\"w\">item</td><td class=\"m\">항목, 물품</td></tr><tr><td class=\"w\">spontaneous</td><td class=\"m\">즉흥적인, 자발적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">제스처를 하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Producing</span> gesture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">말과 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">along with</span> speech</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정보를 만든다</span><span class=\"en\"><b><span class=\"grammar-hl\">makes the information</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 말 속에 부호화된</span><span class=\"en\"><b><span class=\"grammar-hl\">encoded in that speech</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기억할 만하게.</span><span class=\"en\"><b><span class=\"grammar-hl\">memorable</span>.</b></span></div></div><div class=\"lec-sent-ko\">말과 함께 제스처를 하는 것은 그 말 속에 부호화된 정보를 기억할 만하게 만든다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전체 글의 요약이자 최종 결론입니다. 몸짓이 정보를 뇌에 새기는 &#39;부호화(encoding)&#39; 과정을 강화하여 기억을 더 공고하게 만든다는 과학적 원리를 정리하며 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Producing (동명사): 문장의 주어 역할을 하며 &#39;~하는 것&#39;으로 해석되는 명사적 기능을 한다.</div><div class=\"lec-gr-item\">along with (관용표현): &#39;~와 함께&#39;, &#39;~에 덧붙여&#39;라는 의미를 지닌 전치사적 어구다.</div><div class=\"lec-gr-item\">encoded (과거분사(형용사)): encoded가 앞의 명사 information을 수식하여 &#39;정보가 암호화된(입력된)&#39;이라는 수동의 의미를 나타낸다. (= information that was encoded).</div><div class=\"lec-gr-item\">makes the information encoded in that speech memorable (5형식): makes(동사) + the information...(목적어) + memorable(목적보어) 구조다. 목적어의 상태를 설명하는 보어로 형용사 memorable이 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">encode</td><td class=\"m\">암호화하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사건을 설명할 때 몸짓을 사용하는 것이 기억 회상에 미치는 영향을 실험을 통해 확인했다.</li><li>인위적으로 몸짓을 지시받은 그룹이 지시받지 않은 그룹보다, 특히 장기 기억 측면에서 더 우수한 결과를 보였다.</li><li>자발적인 몸짓 사용에 대해서도 실험한 결과, 지시 여부와 상관없이 몸짓을 동반했을 때 기억력이 더 좋았다.</li><li>결론적으로 몸짓은 언어 정보를 뇌에 더 강력하게 부호화하여 기억력을 높여주는 역할을 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Producing gestures along with speech improves the retention of information by making the encoded details more memorable than speech alone.</div>\n              <div class=\"lec-final-sum-ko\">말과 함께 몸짓을 사용하는 것은 부호화된 세부 사항을 말만 할 때보다 더 기억에 남게 함으로써 정보의 유지를 향상시킨다.</div></div></div>"],"segs":[[{"audio":"./38_audio/1.mp3","hl":null}],[{"audio":"./38_audio/2.mp3","hl":null}],[{"audio":"./38_audio/3.mp3","hl":null},{"audio":"./38_audio/4.mp3","hl":"stage-0"},{"audio":"./38_audio/5.mp3","hl":"stage-1"},{"audio":"./38_audio/6.mp3","hl":"stage-2"},{"audio":"./38_audio/7.mp3","hl":"stage-3"}],[{"audio":"./38_audio/8.mp3","hl":null}],[{"audio":"./38_audio/9.mp3","hl":"main"},{"audio":"./38_audio/10.mp3","hl":"meaning"},{"audio":"./38_audio/11.mp3","hl":"grammar"}],[{"audio":"./38_audio/12.mp3","hl":"main"},{"audio":"./38_audio/13.mp3","hl":"meaning"},{"audio":"./38_audio/14.mp3","hl":"grammar"}],[{"audio":"./38_audio/15.mp3","hl":"main"},{"audio":"./38_audio/16.mp3","hl":"meaning"},{"audio":"./38_audio/17.mp3","hl":"grammar"}],[{"audio":"./38_audio/18.mp3","hl":"main"},{"audio":"./38_audio/19.mp3","hl":"meaning"},{"audio":"./38_audio/20.mp3","hl":"grammar"}],[{"audio":"./38_audio/21.mp3","hl":"main"},{"audio":"./38_audio/22.mp3","hl":"meaning"},{"audio":"./38_audio/23.mp3","hl":"grammar"}],[{"audio":"./38_audio/24.mp3","hl":"main"},{"audio":"./38_audio/25.mp3","hl":"meaning"},{"audio":"./38_audio/26.mp3","hl":"grammar"}],[{"audio":"./38_audio/27.mp3","hl":"main"},{"audio":"./38_audio/28.mp3","hl":"meaning"},{"audio":"./38_audio/29.mp3","hl":"grammar"}],[{"audio":"./38_audio/30.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;
