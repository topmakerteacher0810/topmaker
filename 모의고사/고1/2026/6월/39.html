주요 원인</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리 지구는 스스로 기온을 조절하는 탄소 순환(Carbon Cycle)이라는 시스템을 가지고 있는데, 여기서 나무는 이산화탄소를 흡수하고 산소를 내뿜는 광합성(Photosynthesis)을 통해 거대한 공기 청정기 역할을 수행합니다. 마치 &#39;지구의 폐&#39;와 같은 숲이 나무를 베어내는 산림 파괴(Deforestation)로 인해 줄어들게 되면, 대기 중 이산화탄소 농도가 높아지면서 마치 두꺼운 담요처럼 지구를 덮어버리게 됩니다. 이렇게 쌓인 가스들이 태양 열기를 우주로 내보내지 않고 가두는 현상을 온실 효과(Greenhouse Effect)라고 하며, 이것이 오늘날 기온이 계속 오르는 지구 온난화(Global Warming)를 일으키는 핵심 원리가 됩니다. 따라서 숲을 보존하는 것은 단순히 나무를 심는 것 이상의 의미로, 지구의 열 조절 장치를 정상적으로 가동하기 위한 필수적인 과정이라고 이해하시면 좋습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01나무의 탄소 조절 역할</div><ul><li>나무는 광합성을 통해 대기 중의 이산화탄소를 산소로 변환하는 자연 조절자 역할을 한다.</li><li>광합성(photosynthesis)을 통한 이산화탄소의 산소 전환</li><li>나무의 존재는 이산화탄소를 줄이고 산소를 증가시킴</li><li>핵심 키워드: 탄소 순환(carbon cycle), 조절자(regulator)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02산림 파괴와 탄소 순환의 방해</div><ul><li>산림 파괴로 인해 나무의 탄소 조절 기능이 정상적으로 이루어지지 못하고 있다.</li><li>전 세계 온실가스 배출(greenhouse gas emissions)의 15-20%가 산림 파괴에 기인함</li><li>지구 산림의 절반이 사라지면서 이산화탄소 수치가 지속적으로 상승함</li><li>핵심 키워드: 산림 파괴(deforestation), 배출(emissions)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03대기 중 이산화탄소 증가의 결과</div><ul><li>대기 중에 축적된 이산화탄소는 지구의 열이 우주로 방출되는 것을 막는다.</li><li>이산화탄소 증가로 인해 태양 복사(sun’s radiation) 에너지가 지구로 반사됨</li><li>열이 우주로 방출되는 대신 지구에 머물게 됨</li><li>핵심 키워드: 복사 에너지 반사(reflected), 대기(atmosphere)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04지구 온난화 심화</div><ul><li>열의 축적은 지구의 평균 기온을 높여 기후 변화의 결정적인 원인이 된다.</li><li>지구의 평균 기온(average temperature) 상승 초래</li><li>산림 파괴가 지구 온난화의 주요 원인임을 시사함</li><li>핵심 키워드: 지구 온난화(global warming), 기온 상승(rise)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unfortunately</td><td class=\"m\">안타깝게도</td></tr><tr><td class=\"w\">deforestation</td><td class=\"m\">삼림 벌채</td></tr><tr><td class=\"w\">prevent</td><td class=\"m\">막다, 예방하다</td></tr><tr><td class=\"w\">process</td><td class=\"m\">과정, 절차</td></tr><tr><td class=\"w\">fully</td><td class=\"m\">완전히, 충분히</td></tr><tr><td class=\"w\">accomplish</td><td class=\"m\">해내다, 이루다</td></tr><tr><td class=\"w\">approximately</td><td class=\"m\">대략, 약</td></tr><tr><td class=\"w\">emission</td><td class=\"m\">배출, 방출</td></tr><tr><td class=\"w\">cause</td><td class=\"m\">~을 일으키다, 야기하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">degradation</td><td class=\"m\">좌천, 하락, 강등</td></tr><tr><td class=\"w\">huge</td><td class=\"m\">거대한, 엄청난</td></tr><tr><td class=\"w\">carbon</td><td class=\"m\">탄소</td></tr><tr><td class=\"w\">convert</td><td class=\"m\">바꾸다, 전환하다</td></tr><tr><td class=\"w\">photosynthesis</td><td class=\"m\">광합성</td></tr><tr><td class=\"w\">consequently</td><td class=\"m\">그 결과, 따라서</td></tr><tr><td class=\"w\">existence</td><td class=\"m\">존재</td></tr><tr><td class=\"w\">amount</td><td class=\"m\">양, 액수</td></tr><tr><td class=\"w\">lead</td><td class=\"m\">이끌다, ~에 이르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">약 15-20%는</span><span class=\"en\"><b>Approximately 15-20%</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계 온실가스 배출의</span><span class=\"en\"><b>of global greenhouse gas emissions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~에 의해 발생한다</span><span class=\"en\"><b><span class=\"grammar-hl\">are caused</span> by</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경 악화와 삼림 벌채.</span><span class=\"en\"><b>degradation and deforestation.</b></span></div></div><div class=\"lec-sent-ko\">전 세계 온실가스 배출의 약 15-20%는 환경 악화와 삼림 벌채로 인해 비롯된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로, 지구 온난화의 주범인 온실가스 배출에서 산림 파괴가 차지하는 비중이 상당하다는 통계적 사실을 제시하며 문제의 심각성을 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are caused (수동태): be동사(are)+p.p.(caused) 구조. cause는 타동사인데 뒤에 목적어가 없어서 수동구조 are caused 형태로 쓴다. 기본구조: cause + O (A를 유발하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deforestation</td><td class=\"m\">삼림 벌채</td></tr><tr><td class=\"w\">approximately</td><td class=\"m\">대략, 약</td></tr><tr><td class=\"w\">emission</td><td class=\"m\">배출, 방출</td></tr><tr><td class=\"w\">cause</td><td class=\"m\">~을 일으키다, 야기하다</td></tr><tr><td class=\"w\">degradation</td><td class=\"m\">좌천, 하락, 강등</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나무들은</span><span class=\"en\"><b>Trees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">막대한 역할을 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">play a huge role</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">탄소 순환에서.</span><span class=\"en\"><b><span class=\"grammar-hl\">in</span> the carbon cycle.</b></span></div></div><div class=\"lec-sent-ko\">나무들은 탄소 순환에서 막대한 역할을 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 &#39;산림 파괴&#39;가 왜 문제가 되는지를 설명하기 위해, 나무가 자연계의 탄소 순환 과정에서 핵심적인 기능을 담당하고 있음을 밝히는 논리적 연결 고리입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">play a huge role in (관용표현): &#39;play a role in (~에서 역할을 하다)&#39;라는 숙어로, 명사 role 앞에 형용사 huge가 붙어 &#39;큰 역할을 하다&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">huge</td><td class=\"m\">거대한, 엄청난</td></tr><tr><td class=\"w\">carbon</td><td class=\"m\">탄소</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 전환한다</span><span class=\"en\"><b>They convert</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공기 중의 이산화탄소를</span><span class=\"en\"><b>the CO₂ in the air</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산소로</span><span class=\"en\"><b>to oxygen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과정을 통해</span><span class=\"en\"><b>through the process</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">광합성의</span><span class=\"en\"><b>of photosynthesis,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 결과</span><span class=\"en\"><b>and consequently,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 ~로 여겨진다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">are viewed as</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연적인 조절자로</span><span class=\"en\"><b>a natural regulator</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이산화탄소의.</span><span class=\"en\"><b>of carbon dioxide.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 광합성 과정을 통해 공기 중의 이산화탄소를 산소로 전환하며, 그 결과, 이산화탄소의 자연적인 조절자로 여겨진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;거대한 역할&#39;에 대한 구체적인 메커니즘(광합성)을 설명합니다. 이산화탄소를 흡수하고 산소를 내뱉는 기능을 통해 대기 성분을 조절한다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">convert the CO2 ... to oxygen (관용표현): &#39;convert A to B (A를 B로 전환하다)&#39; 구조로, 목적어 A(the CO2)를 전치사 to 이하의 B(oxygen)로 바꾼다는 의미를 나타낸다.</div><div class=\"lec-gr-item\">are viewed as (수동태): be동사(are)+p.p.(viewed) 구조. view는 타동사로 view A as B(A를 B로 여기다) 구조인데 목적어가 주어로 올라가 수동구조 are viewed가 되고, 전치사구 as 이하가 남은 형태다. 기본구조: view + O + as B</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">process</td><td class=\"m\">과정, 절차</td></tr><tr><td class=\"w\">carbon</td><td class=\"m\">탄소</td></tr><tr><td class=\"w\">convert</td><td class=\"m\">바꾸다, 전환하다</td></tr><tr><td class=\"w\">photosynthesis</td><td class=\"m\">광합성</td></tr><tr><td class=\"w\">consequently</td><td class=\"m\">그 결과, 따라서</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">존재는</span><span class=\"en\"><b>The existence</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 양의 나무의</span><span class=\"en\"><b>of a larger amount of trees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의심할 여지 없이 ~로 이어질 것이다</span><span class=\"en\"><b>will no doubt lead to</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감소된 존재로</span><span class=\"en\"><b>the <span class=\"grammar-hl\">reduced presence</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이산화탄소의</span><span class=\"en\"><b>of carbon dioxide</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대기 중의</span><span class=\"en\"><b>in the atmosphere</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 증가된 존재로</span><span class=\"en\"><b>and the <span class=\"grammar-hl\">increased existence</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산소의.</span><span class=\"en\"><b>of oxygen.</b></span></div></div><div class=\"lec-sent-ko\">더 많은 양의 나무의 존재는 의심할 여지 없이 대기 중 이산화탄소의 감소와 산소의 증가로 이어질 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 나무의 기능을 바탕으로 도출할 수 있는 당연한 귀결을 설명합니다. 나무의 양과 대기 중 이산화탄소 농도가 반비례 관계에 있음을 명확히 하여 산림 보존의 중요성을 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reduced presence (과거분사(형용사)): reduced가 presence를 수식(= &#39;감소된 존재&#39;). presence that is reduced의 의미를 갖는 축약된 구조다.</div><div class=\"lec-gr-item\">increased existence (과거분사(형용사)): increased가 existence를 수식(= &#39;증가된 존재&#39;). existence that is increased의 의미를 갖는 축약된 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">carbon</td><td class=\"m\">탄소</td></tr><tr><td class=\"w\">existence</td><td class=\"m\">존재</td></tr><tr><td class=\"w\">amount</td><td class=\"m\">양, 액수</td></tr><tr><td class=\"w\">lead</td><td class=\"m\">이끌다, ~에 이르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">불행하게도</span><span class=\"en\"><b>Unfortunately,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">삼림 벌채는 막고 있다</span><span class=\"en\"><b>deforestation <span class=\"grammar-hl\">is preventing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 과정이</span><span class=\"en\"><b>this process</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온전히 이루어지는 것을.</span><span class=\"en\"><b>from <span class=\"grammar-hl\">being fully accomplished</span>.</b></span></div></div><div class=\"lec-sent-ko\">불행하게도, 삼림 벌채는 이러한 과정이 온전히 이루어지는 것을 막고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;Unfortunately&#39;라는 전환어를 사용하여 분위기를 반전시킵니다. 앞서 설명한 나무의 긍정적인 역할이 인간의 삼림 벌채로 인해 방해받고 있는 현실적 문제를 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is preventing (현재진행): be동사(is) + 현재분사(preventing) 형태로 &#39;방해하고 있다&#39;는 진행의 의미를 나타낸다.</div><div class=\"lec-gr-item\">preventing this process from being fully accomplished (관용표현): &#39;prevent A from -ing (A가 ~하는 것을 막다)&#39; 구조다. 목적어 A(this process)가 전치사 from 뒤의 동작을 하지 못하게 한다는 의미다.</div><div class=\"lec-gr-item\">being fully accomplished (동명사): 전치사 from의 목적어로 쓰인 수동형 동명사(being p.p.)다. accomplish는 타동사인데 목적어가 없어서 수동구조 being accomplished 형태로 쓰였다. 기본구조: accomplish + O (A를 성취하다/완수하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unfortunately</td><td class=\"m\">안타깝게도</td></tr><tr><td class=\"w\">deforestation</td><td class=\"m\">삼림 벌채</td></tr><tr><td class=\"w\">prevent</td><td class=\"m\">막다, 예방하다</td></tr><tr><td class=\"w\">process</td><td class=\"m\">과정, 절차</td></tr><tr><td class=\"w\">fully</td><td class=\"m\">완전히, 충분히</td></tr><tr><td class=\"w\">accomplish</td><td class=\"m\">해내다, 이루다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고</span><span class=\"en\"><b>And</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구 삼림의 절반이 사라지면서</span><span class=\"en\"><b><span class=\"grammar-hl\">with half of the Earth’s forests gone</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이산화탄소의 양은</span><span class=\"en\"><b>the amount of carbon dioxide</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점점 증가하고 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is progressively rising</span>.</b></span></div></div><div class=\"lec-sent-ko\">그리고 지구 삼림의 절반이 사라지면서, 이산화탄소의 양은 점점 증가하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 삼림 벌채의 구체적인 현황(절반 소실)과 그에 따른 직접적인 결과(이산화탄소 증가)를 연결하며, 앞서 설명한 논리적 인과관계가 실제로 악영향을 미치고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">with half of the Earth’s forests gone (분사구문): &#39;with + 목적어 + 형용사/분사&#39; 구조로 부대상황(~한 채로/한 결과)을 나타낸다. gone은 형용사적으로 쓰인 과거분사로 &#39;사라진&#39; 상태를 설명한다. (변환 시: because half of the Earth’s forests are gone)</div><div class=\"lec-gr-item\">is progressively rising (현재진행): be동사(is) + 현재분사(rising) 형태로 &#39;점진적으로 상승하고 있다&#39;는 진행의 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">carbon</td><td class=\"m\">탄소</td></tr><tr><td class=\"w\">amount</td><td class=\"m\">양, 액수</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">더 많은 이산화탄소와 함께</span><span class=\"en\"><b>With more carbon dioxide</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대기 중에</span><span class=\"en\"><b>in the atmosphere,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 태양 복사가</span><span class=\"en\"><b>more of the sun’s radiation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시 반사되고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is being reflected</span> back</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구로</span><span class=\"en\"><b>to Earth</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방출되는 대신</span><span class=\"en\"><b>instead of <span class=\"grammar-hl\">being released</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주로</span><span class=\"en\"><b>into space,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 이것은 유발하고 있다</span><span class=\"en\"><b>and this is <span class=\"grammar-hl\">causing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구의 평균 기온이</span><span class=\"en\"><b><span class=\"grammar-hl\">the planet’s average temperature</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상승하도록.</span><span class=\"en\"><b><span class=\"grammar-hl\">to rise</span>.</b></span></div></div><div class=\"lec-sent-ko\">대기 중 이산화탄소가 더 많아지면서, 더 많은 태양 복사 (에너지)가 우주로 방출되는 대신 지구로 다시 반사되고 있으며, 이는 지구의 평균 기온이 상승하도록 유발하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이산화탄소 증가가 어떻게 지구 온난화로 이어지는지 그 과학적 원리(복사 에너지 반사)를 상세히 설명합니다. 이는 산림 파괴가 단순한 환경 변화를 넘어 기온 상승의 직접적 원인임을 증명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is being reflected (수동태): 진행형 수동태(be + being + p.p.) 구조다. reflect는 타동사인데 목적어가 없어서 수동구조 is being reflected 형태로 쓴다. 기본구조: reflect + O (A를 반사하다)</div><div class=\"lec-gr-item\">being released (동명사): 전치사 instead of의 목적어로 쓰인 수동형 동명사(being p.p.)다. release는 타동사인데 목적어가 없어서 수동구조 being released 형태로 쓰였다. 기본구조: release + O (A를 방출하다)</div><div class=\"lec-gr-item\">causing the planet’s average temperature to rise 5형식(SVOC) 구조: cause(V) + the planet&#39;s average temperature(O) + to rise(OC) 구조다. cause는 목적격 보어로 to부정사를 취하며 &#39;O가 ~하도록 유발하다&#39;라는 의미를 만든다.</div><div class=\"lec-gr-item\">to rise (to부정사): 5형식 동사 cause의 목적격 보어로 사용되어 목적어의 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">carbon</td><td class=\"m\">탄소</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">따라서</span><span class=\"en\"><b>Accordingly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">삼림 벌채는 ~이다</span><span class=\"en\"><b>deforestation is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요한 문제</span><span class=\"en\"><b>a major issue</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">~와 관련하여</span><span class=\"en\"><b><span class=\"grammar-hl\">when it comes to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구 온난화.</span><span class=\"en\"><b>global warming.</b></span></div></div><div class=\"lec-sent-ko\">따라서, 삼림 벌채는 지구 온난화와 관련하여 중요한 문제이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> &#39;Accordingly&#39;를 통해 글 전체의 내용을 요약하고 결론을 맺습니다. 산림의 기능 상실이 온난화 메커니즘의 출발점임을 재확인하며 산림 파괴를 해결해야 할 핵심 과제로 정의합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when it comes to (관용표현): &#39;~에 관해서라면/관하여&#39;라는 의미의 숙어다. 여기서 to는 전치사이므로 뒤에 명사(global warming)가 위치한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deforestation</td><td class=\"m\">삼림 벌채</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>산림 파괴는 전 세계 온실가스 배출의 상당 부분(15~20%)을 차지하는 심각한 요인이다.</li><li>나무는 광합성을 통해 이산화탄소를 산소로 바꾸는 천연 조절자 역할을 한다.</li><li>하지만 무분별한 벌채로 산림이 줄어들면서 대기 중 이산화탄소 농도가 높아지고 있다.</li><li>증가한 이산화탄소는 태양 열기를 가두어 지구 기온을 높이며 온난화를 가속화한다.</li><li>결국 지구 온난화 문제를 해결하기 위해 삼림 벌채 방지는 필수적인 과제이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Deforestation accelerates global warming by increasing atmospheric carbon dioxide levels due to the loss of trees&#39; natural carbon regulation.</div>\n              <div class=\"lec-final-sum-ko\">산림 파괴는 나무의 천연 탄소 조절 기능 상실로 인해 대기 중 이산화탄소 수치를 높임으로써 지구 온난화를 가속화한다.</div></div></div>"],"segs":[[{"audio":"./39_audio/1.mp3","hl":null}],[{"audio":"./39_audio/2.mp3","hl":null}],[{"audio":"./39_audio/3.mp3","hl":null},{"audio":"./39_audio/4.mp3","hl":"stage-0"},{"audio":"./39_audio/5.mp3","hl":"stage-1"},{"audio":"./39_audio/6.mp3","hl":"stage-2"},{"audio":"./39_audio/7.mp3","hl":"stage-3"}],[{"audio":"./39_audio/8.mp3","hl":null}],[{"audio":"./39_audio/9.mp3","hl":"main"},{"audio":"./39_audio/10.mp3","hl":"meaning"},{"audio":"./39_audio/11.mp3","hl":"grammar"}],[{"audio":"./39_audio/12.mp3","hl":"main"},{"audio":"./39
