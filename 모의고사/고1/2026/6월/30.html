></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03아동을 위한 교육적 이점</div><ul><li>학습과 관찰에 어려움을 겪는 아이들에게 유용한 보조 도구가 된다.</li><li>아동의 관찰과 그리기 활동을 조직화(organise)하도록 도움</li><li>경계(boundary)를 설정해 주어 망설이는 아동을 지원함</li><li>핵심 키워드: 관찰(observation)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04시각적 추적의 일관성 유지</div><ul><li>시선을 돌렸다가 다시 볼 때 같은 지점을 쉽게 찾도록 도와준다.</li><li>보고 있는 위치를 놓치기 쉬운 아동의 시선 고정을 도움</li><li>매번 같은 영역(same area)으로 시선을 되돌려줌</li><li>시각적 흐름의 연속성 제공</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05효과적인 제작 시 고려사항</div><ul><li>도구의 목적을 달성하기 위해 카드의 적절한 크기를 고려해야 한다.</li><li>주변의 시각 정보(visual information)를 차단할 만큼의 충분한 여백 필요</li><li>너무 크거나 다루기 힘든(unwieldy) 형태가 되지 않도록 주의</li><li>핵심 키워드: 카드 크기(size of the card)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">isolate</td><td class=\"m\">떼어 놓다, 고립시키다</td></tr><tr><td class=\"w\">object</td><td class=\"m\">물체, 대상</td></tr><tr><td class=\"w\">concentrate on</td><td class=\"m\">~에 집중하다</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">허용하다, ~하게 해 주다</td></tr><tr><td class=\"w\">distracted</td><td class=\"m\">주의가 흐트러진</td></tr><tr><td class=\"w\">focus</td><td class=\"m\">(focus on) ~에 집중하다</td></tr><tr><td class=\"w\">observation</td><td class=\"m\">관찰</td></tr><tr><td class=\"w\">drawing</td><td class=\"m\">그림, 그리기</td></tr><tr><td class=\"w\">keep track of</td><td class=\"m\">~을 계속 파악하다, 기록해 두다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">support</td><td class=\"m\">지지하다, 뒷받침하다</td></tr><tr><td class=\"w\">hesitant</td><td class=\"m\">주저하는</td></tr><tr><td class=\"w\">boundary</td><td class=\"m\">경계</td></tr><tr><td class=\"w\">confuse</td><td class=\"m\">혼란스럽게 하다</td></tr><tr><td class=\"w\">consideration</td><td class=\"m\">고려, 숙고</td></tr><tr><td class=\"w\">block</td><td class=\"m\">막다, 가로막다</td></tr><tr><td class=\"w\">visual</td><td class=\"m\">시각의, 시각적인</td></tr><tr><td class=\"w\">vision</td><td class=\"m\">시력, 시야</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">뷰파인더는</span><span class=\"en\"><b>A viewfinder</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 장의 카드이다</span><span class=\"en\"><b>is a piece of card</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구멍이 뚫린</span><span class=\"en\"><b>with a <span class=\"grammar-hl\">hole cut</span> through it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가운데에</span><span class=\"en\"><b>in the middle<span class=\"grammar-hl\">,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 사용될 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">which</span> <span class=\"grammar-hl\">can be used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일부를 분리하는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">to isolate</span> a part</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그림이나 물체의.</span><span class=\"en\"><b>of a picture or object.</b></span></div></div><div class=\"lec-sent-ko\">부모인다는 가운데에 구멍이 뚫린 한 장의 카드로, 그림이나 물체의 일부를 분리하는 데 사용할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 &#39;뷰파인더&#39;라는 도구의 외형과 핵심적인 기능을 정의하며 글을 시작합니다. 전체에서 특정 부분만을 따로 떼어내어(isolate) 볼 수 있게 해준다는 점이 이 도구의 존재 이유임을 명시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hole cut (과거분사(형용사)): 과거분사 cut이 명사 hole을 수식(= &quot;뚫려 있는 구멍&quot;)하는 구조다. N + p.p. 구조로 hole that is cut의 축약 형태로 볼 수 있다.</div><div class=\"lec-gr-item\">, which (관계대명사): 앞의 선행사(a hole)에 대해 부연 설명을 제공하는 주격 관계대명사의 계속적 용법이다.</div><div class=\"lec-gr-item\">can be used (수동태): be동사(be)+p.p.(used) 구조. use는 타동사인데 뒤에 목적어가 없어서 수동구조 be used 형태로 쓴다. 기본구조: V + O + toV (use A to do: A를 ~하는 데 사용하다)</div><div class=\"lec-gr-item\">to isolate (to부정사): 부사적 용법 중 &#39;목적&#39;(~하기 위해서)을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">isolate</td><td class=\"m\">떼어 놓다, 고립시키다</td></tr><tr><td class=\"w\">object</td><td class=\"m\">물체, 대상</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 우리에게 허용한다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">allows us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집중하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to concentrate</span> on</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 작은 부분이나 영역에</span><span class=\"en\"><b>one small part or area</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주의가 산만해지지 않고</span><span class=\"en\"><b>without <span class=\"grammar-hl\">being distracted</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전체에 의해</span><span class=\"en\"><b>by the whole</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보일 수 있는 것의.</span><span class=\"en\"><b>of <span class=\"grammar-hl\">what can be seen</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 우리가 보이는 것의 전체에 의해 주의가 산만해지지 않고 하나의 작은 부분이나 영역에 집중할 수 있게 해 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;분리(isolate)&#39; 기능이 주는 심리적 효과를 설명합니다. 시야에 들어오는 전체 정보 중 불필요한 것을 차단함으로써 집중력을 높여준다는 논리적 인과관계를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">allows us to concentrate 5형식(SVOC) 구조: 동사(allows) + 목적어(us) + 목적격 보어(to concentrate) 구조다. allow는 목적격 보어로 to부정사를 취하는 대표적인 타동사이다.</div><div class=\"lec-gr-item\">being distracted (수동태): 전치사(without)의 목적어로 쓰인 동명사의 수동형(being+p.p.) 구조다. distract는 타동사인데 목적어가 없어서 수동구조 being distracted 형태로 쓴다. 기본구조: V + O (distract someone)</div><div class=\"lec-gr-item\">what can be seen (관계대명사): 선행사를 포함한 관계대명사 what이 이끄는 절이 전치사 of의 목적어 역할을 하며 &#39;~하는 것&#39;으로 해석된다.</div><div class=\"lec-gr-item\">can be seen (수동태): be동사(be)+p.p.(seen) 구조. see는 타동사인데 뒤에 목적어가 없어서 수동구조 be seen 형태로 쓴다. 기본구조: V + O (see something)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">concentrate on</td><td class=\"m\">~에 집중하다</td></tr><tr><td class=\"w\">allow</td><td class=\"m\">허용하다, ~하게 해 주다</td></tr><tr><td class=\"w\">distracted</td><td class=\"m\">주의가 흐트러진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 유용한 도구이다</span><span class=\"en\"><b>It is a useful tool</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이들을 도울 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that can help</span> children</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집중하거나 조직하도록</span><span class=\"en\"><b>focus or organise</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 관찰과 그리기를.</span><span class=\"en\"><b>their observation and <span class=\"grammar-hl\">drawing</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 아이들이 집중하거나 관찰하기와 그리기를 조직하는 것을 도울 수 있는 유용한 도구이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 뷰파인더의 일반적인 기능을 &#39;아이들의 학습(관찰 및 그림 그리기)&#39;이라는 구체적인 상황으로 연결합니다. 앞선 문장들의 원리가 아이들의 교육 현장에서 어떻게 실질적인 도움(집중과 정리)으로 치환되는지 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that can help (관계대명사): 선행사 a useful tool을 수식하는 주격 관계대명사이다.</div><div class=\"lec-gr-item\">help children focus or organise 5형식(SVOC) 구조: 동사(help) + 목적어(children) + 목적격 보어(focus or organise) 구조다. 준사역동사 help는 목적격 보어로 동사원형이나 to부정사를 모두 취할 수 있다.</div><div class=\"lec-gr-item\">drawing (동명사): &#39;그리기&#39;라는 행위나 활동을 나타내는 명사적 개념으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">focus</td><td class=\"m\">(focus on) ~에 집중하다</td></tr><tr><td class=\"w\">observation</td><td class=\"m\">관찰</td></tr><tr><td class=\"w\">drawing</td><td class=\"m\">그림, 그리기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 지지할 수 있다</span><span class=\"en\"><b>It can support</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주저하는 아이들을</span><span class=\"en\"><b>hesitant children</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경계를 제공함으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">giving</span> a boundary</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 보고 있는 것에</span><span class=\"en\"><b>to <span class=\"grammar-hl\">what they are looking at</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 아이들을 도울 수 있다</span><span class=\"en\"><b>and it can help children</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어렵다고 느끼는</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span> <span class=\"grammar-hl\">find it hard</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">파악하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to keep track of</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어디를 그리고 무엇을 그들이 보고 있는지</span><span class=\"en\"><b><span class=\"grammar-hl\">where and what they are looking at</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 되돌아가게 함으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">bringing</span> them back</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 영역으로</span><span class=\"en\"><b>to the same area</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 보고 다시 볼 때마다.</span><span class=\"en\"><b>each time they look and look back.</b></span></div></div><div class=\"lec-sent-ko\">그것은 주저하는 아이들에게 그들이 보고 있는 것에 대한 경계를 제공함으로써 도움을 줄 수 있고, 자신이 어디를 그리고 무엇을 보고 있는지 따라가기 어려워하는 아이들을, 그들이 보고 다시 볼 때마다 같은 영역으로 되돌아가게 함으로써, 혼란스럽게 도움을 줄 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 언급한 &#39;도움&#39;의 내용을 더욱 상세하게 서술합니다. &#39;망설이는 아이&#39;에게는 시각적 경계를 제공하고, &#39;시선을 놓치는 아이&#39;에게는 기준점(지속성)을 제공한다는 구체적인 사례를 들어 뷰파인더의 교육적 가치를 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">giving (동명사): 전치사 by의 목적어로 쓰여 &#39;~함으로써&#39;라는 수단이나 방법을 나타낸다.</div><div class=\"lec-gr-item\">what they are looking at (관계대명사): 선행사를 포함한 관계대명사 what이 절 내에서 전치사 at의 목적어 역할을 수행한다.</div><div class=\"lec-gr-item\">are looking at (현재진행): be동사(are) + 현재분사(looking) 형태로 현재 진행 중인 동작을 나타낸다.</div><div class=\"lec-gr-item\">who (관계대명사): 선행사 children을 수식하는 주격 관계대명사이다.</div><div class=\"lec-gr-item\">find it hard to keep track of 5형식(SVOC) 구조: 동사(find) + 가목적어(it) + 목적격 보어(hard) + 진목적어(to keep track of) 구조로, 목적어가 길어 가목적어 it을 사용하고 진짜 목적어인 to부정사구를 뒤로 보낸 형태다.</div><div class=\"lec-gr-item\">where and what they are looking at (간접의문문): 의문사(where and what) + 주어(they) + 동사(are looking at)의 어순을 취하며, 전치사 of의 목적어 역할을 하는 명사절이다.</div><div class=\"lec-gr-item\">bringing (동명사): 전치사 by의 목적어로 쓰여 &#39;~함으로써&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">keep track of</td><td class=\"m\">~을 계속 파악하다, 기록해 두다</td></tr><tr><td class=\"w\">support</td><td class=\"m\">지지하다, 뒷받침하다</td></tr><tr><td class=\"w\">hesitant</td><td class=\"m\">주저하는</td></tr><tr><td class=\"w\">boundary</td><td class=\"m\">경계</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 뷰파인더를 만들 때</span><span class=\"en\"><b>When you <span class=\"grammar-hl\">are making</span> viewfinders</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이들과 함께 사용하기 위한</span><span class=\"en\"><b>for use with the <span class=\"grammar-hl\">children</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 돕고 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">you are supporting</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고려하라</span><span class=\"en\"><b><span class=\"grammar-hl\">take into consideration</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">카드의 크기를.</span><span class=\"en\"><b>the size of the card.</b></span></div></div><div class=\"lec-sent-ko\">당신이 돕는 아이들과 함께 사용할 뷰파인더를 만들 때, 카드의 크기를 고려하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 뷰파인더의 효용성에 대한 설명을 마치고, 이를 실제로 제작할 때 주의해야 할 실무적인 지침으로 화제를 전환합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are making (현재진행): be동사(are) + 현재분사(making) 형태로 현재 진행 중인 동작을 나타낸다.</div><div class=\"lec-gr-item\">children you are supporting (관계대명사): 선행사인 children과 주어 you 사이에 목적격 관계대명사(whom/that)가 생략되어 children을 수식하는 구조다.</div><div class=\"lec-gr-item\">are supporting (현재진행): be동사(are) + 현재분사(supporting) 형태로 동작의 진행을 나타낸다.</div><div class=\"lec-gr-item\">take into consideration (관용표현): &#39;~을 고려하다&#39;라는 의미로 동사 consider와 같은 의미로 사용되는 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">support</td><td class=\"m\">지지하다, 뒷받침하다</td></tr><tr><td class=\"w\">consideration</td><td class=\"m\">고려, 숙고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 충분한 카드가 필요하다</span><span class=\"en\"><b>You need enough card</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구멍 주변에</span><span class=\"en\"><b>around the hole</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">차단하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to block out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나머지 시각 정보를</span><span class=\"en\"><b>the rest of the visual information</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이의 시야로부터</span><span class=\"en\"><b>from the child’s field of vision,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것은 ~해서는 안 된다</span><span class=\"en\"><b>but it should not be</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 크고 다루기 힘들어서는.</span><span class=\"en\"><b>too big and unwieldy.</b></span></div></div><div class=\"lec-sent-ko\">구멍 주변에 나머지 시각 정보를 아이의 시야로부터 차단하기에 충분한 카드가 필요하지만, 그것이 너무 크고 다루기 힘들어서는 안 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장은 5번에서 언급한 &#39;크기 고려&#39;에 대한 구체적인 기준을 제시합니다. 주변 정보를 차단할 수 있을 만큼 충분히 커야 한다는 &#39;기능성&#39;과 아이가 다루기 편해야 한다는 &#39;사용성&#39; 사이의 균형을 강조하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to block out (to부정사): 부사적 용법 중 &#39;목적&#39;(~하기 위해서)을 나타내어 card를 준비해야 하는 이유를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">block</td><td class=\"m\">막다, 가로막다</td></tr><tr><td class=\"w\">visual</td><td class=\"m\">시각의, 시각적인</td></tr><tr><td class=\"w\">vision</td><td class=\"m\">시력, 시야</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>뷰파인더는 카드 중앙에 구멍을 내어 특정 부분만 집중해 볼 수 있게 만든 도구이다.</li><li>주변 시각 정보의 방해를 차단하여 관찰 대상에 대한 집중력을 극대화한다.</li><li>특히 관찰이나 그림 그리기를 어려워하는 아이들에게 시각적 경계와 기준을 제공한다.</li><li>제작 시에는 주변 시야를 가릴 만큼 충분한 크기이되, 휴대와 사용이 편리한 적당한 크기를 유지해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">A viewfinder serves as an effective educational aid to enhance children&#39;s concentration by isolating specific visual information within a manageable boundary.</div>\n              <div class=\"lec-final-sum-ko\">뷰파인더는 관리 가능한 경계 내에서 특정 시각 정보만을 고립시킴으로써 아이들의 집중력을 높여주는 효과적인 교육 보조 도구이다.</div></div></div>"],"segs":[[{"audio":"./30_audio/1.mp3","hl":null}],[{"audio":"./30_audio/2.mp3","hl":null}],[{"audio":"./30_audio/3.mp3","hl":null},{"audio":"./30_audio/4.mp3","hl":"stage-0"},{"audio":"./30_audio/5.mp3","hl":"stage-1"},{"audio":"./30_audio/6.mp3","hl":"stage-2"},{"audio":"./30_audio/7.mp3","hl":"stage-3"},{"audio":"./30_audio/8.mp3","hl":"stage-4"}],[{"audio":"./30_audio/9.mp3","hl":null}],[{"audio":"./30_audio/10.mp3","hl":"main"},{"audio":"./30_audio/11.mp3","hl":"meaning"},{"audio":"./30_audio/12.mp3","hl":"grammar"}],[{"audio":"./30_audio/13.mp3","hl":"main"},{"audio":"./30_audio/14.mp3","hl":"meaning"},{"audio":"./30_audio/15.mp3","hl":"grammar"}],[{"audio":"./30_audio/16.mp3","hl":"main"},{"audio":"./30_audio/17.mp3","hl":"meaning"},{"audio":"./30_audio/18.mp3","hl":"grammar"}],[{"audio":"./30_audio/19.mp3","hl":"main"},{"audio":"./30_audio/20.mp3","hl":"meaning"},{"audio":"./30_audio/21.mp3","hl":"grammar"}],[{"audio":"./30_audio/22.mp3","hl":"main"},{"audio":"./30_audio/23.mp3","hl":"meaning"},{"audio":"./30_audio/24.mp3","hl":"grammar"}],[{"audio":"./30_audio/25.mp3","hl":"main"},{"audio":"./30_audio/26.mp3","hl":"meaning"},{"audio":"./30_audio/27.mp3","hl":"grammar"}],[{"audio":"./30_audio/28.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=
