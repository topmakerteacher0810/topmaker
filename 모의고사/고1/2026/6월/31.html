 점을 강조하고 있습니다. 현대 과학에서는 이를 신경 가소성(Neuroplasticity)이라는 개념으로 설명하기도 하는데, 이는 우리가 새로운 정보를 접할 때마다 뇌의 신경망(Neural networks)이 미세하게 재구성되며 물리적으로 변화한다는 원리입니다. 여기에 더해 그의 제자인 크라틸로스(Cratylus)는 우리가 단순히 변화를 구경만 하는 수동적인 관찰자(Passive observer)가 아니라, 강물에 발을 담그는 순간 물의 흐름을 바꾸듯 환경과 끊임없이 상호작용(Interaction)하며 변화를 주도하는 존재임을 역설했습니다. 마치 나비 효과(Butterfly Effect)처럼 지금 당장 눈에 보이지 않는 아주 작은 변화들이 쌓여 결국 우리의 미래를 완전히 다른 모습으로 바꾸어 놓는다는 맥락을 이해하며 글을 읽어보시길 바랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01끊임없이 변화하는 세계</div><ul><li>세계는 상호 연결되어 있으며 우리가 인지하지 못하는 순간에도 늘 변화하고 있다.</li><li>지각할 수 없는 변화 (ever-changing)</li><li>상호 연결된 세계 (interconnected)</li><li>핵심 키워드: 인지(sense)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02개인의 미세한 변화</div><ul><li>정보를 받아들이는 짧은 순간에도 인간의 신체와 뇌는 끊임없이 변한다.</li><li>노화(aging) 과정의 지속</li><li>뇌 신경망의 인지적 변화 (neural networks)</li><li>핵심 키워드: 지각하다(perceive)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03외부 사건의 영향력</div><ul><li>당장 인지하지 못하는 외부의 사건들이 미래의 삶을 결정짓기도 한다.</li><li>즉각적 환경 밖의 사건 (events outside immediate surroundings)</li><li>미래의 삶을 변화시킴 (change your life)</li><li>핵심 키워드: 깨닫다(realize)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04변화의 철학적 고찰</div><ul><li>고대 철학자 헤라클레이토스는 만물의 유동성을 강물에 비유하여 설명했다.</li><li>같은 강에 두 번 발을 담글 수 없음 (same river)</li><li>변화하는 환경과 변화하는 인간 (not the same man)</li><li>핵심 키워드: 철학자(philosopher)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05능동적 상호작용</div><ul><li>인간은 환경을 바라보기만 하는 존재가 아니라 상호작용을 통해 환경을 변화시킨다.</li><li>능동적 참여자 (not mere passive observers)</li><li>주체의 개입으로 인한 환경의 변화 (change it)</li><li>핵심 키워드: 관찰자(observers)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-5\"><div class=\"lec-stage-head\">06변화의 축적</div><ul><li>세상에 고정된 것은 없으며 아주 작은 변화들이 시간에 걸쳐 쌓여 나간다.</li><li>정적인 상태는 없음 (Nothing is static)</li><li>미세한 변화의 축적 (microscopic changes add up)</li><li>핵심 키워드: 미세한(microscopic)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aging</td><td class=\"m\">노화, 고령화</td></tr><tr><td class=\"w\">amount</td><td class=\"m\">양, 액수</td></tr><tr><td class=\"w\">neural</td><td class=\"m\">신경의</td></tr><tr><td class=\"w\">perceive</td><td class=\"m\">인식하다, 지각하다</td></tr><tr><td class=\"w\">crucial</td><td class=\"m\">매우 중요한</td></tr><tr><td class=\"w\">seemingly</td><td class=\"m\">겉보기에는</td></tr><tr><td class=\"w\">note</td><td class=\"m\">쪽지, 메모</td></tr><tr><td class=\"w\">immediate</td><td class=\"m\">즉각적인, 당장의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surroundings</td><td class=\"m\">주변 환경</td></tr><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다</td></tr><tr><td class=\"w\">ancient</td><td class=\"m\">고대의</td></tr><tr><td class=\"w\">philosopher</td><td class=\"m\">철학자</td></tr><tr><td class=\"w\">pointed</td><td class=\"m\">지적했다</td></tr><tr><td class=\"w\">mere</td><td class=\"m\">단지 ~에 불과한</td></tr><tr><td class=\"w\">static</td><td class=\"m\">고정된, 정적인</td></tr><tr><td class=\"w\">microscopic</td><td class=\"m\">미세한, 현미경을 이용한, 현미경으로 볼 수 있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 세계는</span><span class=\"en\"><b>Our world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 서로 연결되어 있을 뿐만 아니라</span><span class=\"en\"><b>is not just interconnected,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">끊임없이 변화하고 있다</span><span class=\"en\"><b>but <span class=\"grammar-hl\">ever-changing</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비록 ~일지라도</span><span class=\"en\"><b><span class=\"grammar-hl\">even if</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 그것을 감지할 수 없을지라도.</span><span class=\"en\"><b>we can’t sense it.</b></span></div></div><div class=\"lec-sent-ko\">우리의 세계는 단지 서로 연결되어 있을 뿐만 아니라, 우리가 감지할 수 없다고 할지라도, 끊임없이 변화하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 도입부로, 우리가 사는 세상의 본질이 &#39;연결성&#39;과 &#39;지속적인 변화&#39;에 있음을 선언합니다. 특히 인간의 감각으로 느끼지 못하는 순간에도 변화는 멈추지 않는다는 점을 강조하며 독자의 호기심을 유발합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is ... interconnected (수동태): be동사(is) + p.p.(interconnected) 구조. interconnect는 타동사인데 뒤에 목적어가 없어서 수동구조 is interconnected 형태로 쓴다. 기본구조: V + O</div><div class=\"lec-gr-item\">ever-changing (현재분사(형용사)): 현재분사 changing이 부사 ever와 결합한 형태로, 주어인 Our world의 상태를 설명하는 보어 역할을 하며 &#39;변화하는&#39;이라는 능동의 의미를 나타낸다.</div><div class=\"lec-gr-item\">not just ... but (관용표현): &#39;not just A but (also) B&#39; 구조로 &#39;A뿐만 아니라 B도&#39;라는 의미를 나타내는 상관접속사구이다.</div><div class=\"lec-gr-item\">even if (관용표현): &#39;비록 ~일지라도&#39;라는 의미의 양보 부사절을 이끄는 접속사구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 이것을 읽는 동안에도</span><span class=\"en\"><b>While <span class=\"grammar-hl\">you’re reading</span> this,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 변하고 있다.</span><span class=\"en\"><b>you’re changing.</b></span></div></div><div class=\"lec-sent-ko\">당신이 이것을 읽는 동안에도, 당신은 변하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;세상의 변화&#39;라는 거시적인 담론을 &#39;글을 읽고 있는 독자&#39;라는 미시적이고 개인적인 상황으로 끌어와 변화가 누구에게나 실시간으로 일어나고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">you’re reading (현재진행): be동사(are) + -ing 형태로 지금 이 글을 &#39;읽고 있는 중&#39;이라는 진행 중인 동작을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 나이를 먹고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">You’re aging</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(다행히도, 아주 미세한 양으로)</span><span class=\"en\"><b>(a minute amount, thankfully),</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 신경망 또한</span><span class=\"en\"><b>but the neural networks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 뇌 속에 있는</span><span class=\"en\"><b>in your brain</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감지할 수 없게 변화하고 있다</span><span class=\"en\"><b>are also imperceptibly changing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 인식하는 동안</span><span class=\"en\"><b>as you perceive</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">각각의 단어를.</span><span class=\"en\"><b>each word.</b></span></div></div><div class=\"lec-sent-ko\">(다행히도, 아주 미세한 양으로) 당신은 나이를 먹고 있지만, 당신의 각각의 분야를 인식하는 동안 뇌의 신경망 또한 감지할 수 없게 변화하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;변화&#39;를 구체적으로 상술합니다. 신체적 노화뿐만 아니라, 새로운 정보(단어)를 처리하며 발생하는 뇌의 구조적 변화를 예로 들어 변화의 불가피성과 실시간성을 입증합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">You’re aging (현재진행): be동사(are) + -ing 형태로 &#39;나이가 들고 있다&#39;는 현재 진행 중인 상태 변화를 나타낸다.</div><div class=\"lec-gr-item\">are ... changing (현재진행): be동사(are) + -ing 형태로 신경망이 &#39;변하고 있는 중&#39;이라는 진행의 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aging</td><td class=\"m\">노화, 고령화</td></tr><tr><td class=\"w\">amount</td><td class=\"m\">양, 액수</td></tr><tr><td class=\"w\">neural</td><td class=\"m\">신경의</td></tr><tr><td class=\"w\">perceive</td><td class=\"m\">인식하다, 지각하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">결정적으로</span><span class=\"en\"><b>Crucially,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 우리가 겉보기에</span><span class=\"en\"><b>even when we’re seemingly</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주목할 만한 어떤 것도 하지 않을 때조차도</span><span class=\"en\"><b>not doing anything <span class=\"grammar-hl\">of note</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사건들이 일어나고 있다</span><span class=\"en\"><b>events <span class=\"grammar-hl\">are taking place</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 직접적인 주변 환경 밖에서</span><span class=\"en\"><b>outside your immediate surroundings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 삶을 변화시킬</span><span class=\"en\"><b>that will change your life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미래에</span><span class=\"en\"><b>in the future,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비록 당신이 아직 그것을 깨닫지 못하겠지만.</span><span class=\"en\"><b>though you won’t realize it yet.</b></span></div></div><div class=\"lec-sent-ko\">결정적으로, 우리가 겉보기에 주목할 만한 어떤 것도 하지 않는 것처럼 보일 때조차도, 당신의 직접적인 주변 환경 밖에서는 미래에 당신의 삶을 변화시킬 사건들이 일어나고 있지만, 당신은 아직 그것을 깨닫지 못할 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이제 변화의 범위를 &#39;나&#39;의 내부에서 &#39;나&#39;의 외부(환경)로 확장합니다. 내가 인지하지 못하는 외부의 사건들이 나의 미래에 영향을 끼칠 준비를 하고 있다는 논리를 통해, 세상의 모든 것이 유기적으로 연결되어 변화하고 있음을 역설합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are ... doing (현재진행): be동사(are) + -ing의 부정형(not doing)으로, &#39;~을 하고 있지 않다&#39;는 진행의 의미를 나타낸다.</div><div class=\"lec-gr-item\">of note (관용표현): &#39;주목할 만한&#39;, &#39;중요한&#39;이라는 의미를 가진 형용사적 어구로 anything을 수식한다.</div><div class=\"lec-gr-item\">are taking place (현재진행): be동사(are) + -ing 형태로 사건들이 &#39;일어나고 있는 중&#39;이라는 진행 의미를 나타낸다.</div><div class=\"lec-gr-item\">taking place (관용표현): &#39;개최되다&#39;, &#39;일어나다&#39;라는 뜻의 숙어로 happen 또는 occur와 유사한 의미로 쓰인다.</div><div class=\"lec-gr-item\">events ... that will change (관계대명사): 주격 관계대명사 that이 이끄는 절이 선행사 events를 수식한다. 선행사와 관계사절 사이에 수식어구(outside your immediate surroundings)가 삽입되어 선행사와 떨어져 있는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">crucial</td><td class=\"m\">매우 중요한</td></tr><tr><td class=\"w\">seemingly</td><td class=\"m\">겉보기에는</td></tr><tr><td class=\"w\">note</td><td class=\"m\">쪽지, 메모</td></tr><tr><td class=\"w\">immediate</td><td class=\"m\">즉각적인, 당장의</td></tr><tr><td class=\"w\">surroundings</td><td class=\"m\">주변 환경</td></tr><tr><td class=\"w\">realize</td><td class=\"m\">깨닫다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Heraclitus는</span><span class=\"en\"><b>Heraclitus,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고대 그리스 철학자인</span><span class=\"en\"><b><span class=\"grammar-hl\">the ancient Greek philosopher</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정확히 지적했다</span><span class=\"en\"><b>rightly <span class=\"grammar-hl\">pointed out</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“어떤 사람도</span><span class=\"en\"><b>“No man</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결코 발을 담그지 않는다</span><span class=\"en\"><b>ever steps</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 강물에</span><span class=\"en\"><b>in the same river</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 번.</span><span class=\"en\"><b>twice.</b></span></div></div><div class=\"lec-sent-ko\">고대 그리스 철학자 Heraclitus는 “어떤 사람도 같은 강물에 두 번 발을 담글 수 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 필자의 주장에 권위를 더하기 위해 철학적 격언을 인용합니다. &#39;강물&#39;은 흐르는 시간과 변화하는 세상을 상징하며, 변화가 세상의 근본 원리임을 시각적으로 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the ancient Greek philosopher (동격): 콤마(,)를 사용해 앞의 고유명사인 Heraclitus를 구체적으로 설명하는 명사구가 뒤따르는 동격 구조이다.</div><div class=\"lec-gr-item\">pointed out (관용표현): &#39;지적하다&#39;, &#39;언급하다&#39;라는 뜻의 구동사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ancient</td><td class=\"m\">고대의</td></tr><tr><td class=\"w\">philosopher</td><td class=\"m\">철학자</td></tr><tr><td class=\"w\">pointed</td><td class=\"m\">지적했다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 그것은 아니기 때문이다</span><span class=\"en\"><b><span class=\"grammar-hl\">For</span> it’s not</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 강물이</span><span class=\"en\"><b>the same river</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그는 아니기 때문이다</span><span class=\"en\"><b>and he’s not</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">같은 사람이.”</span><span class=\"en\"><b>the same man.”</b></span></div></div><div class=\"lec-sent-ko\">왜냐하면 그것은 같은 강물이 아니며 그는 같은 사람이 아니기 때문이다.”라고 정확히 지적했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 인용구의 이유를 설명합니다. 강물(외부 환경)도 끊임없이 흐르며 변하고, 그 속에 발을 담그는 사람(내부 주체) 또한 시간의 흐름 속에 변하기 때문에 동일한 상태란 존재할 수 없음을 말합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">For (관용표현): 문장의 맨 앞에서 접속사로 쓰여 &#39;왜냐하면 ~이기 때문이다&#39;라는 이유나 근거를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이에 대해</span><span class=\"en\"><b>To that,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Cratylus는</span><span class=\"en\"><b>Cratylus,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Heraclitus의 제자인</span><span class=\"en\"><b><span class=\"grammar-hl\">a student of Heraclitus</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">덧붙였다</span><span class=\"en\"><b><span class=\"grammar-hl\">added</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 아니라고</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> we are not</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단순한 수동적인 관찰자가.</span><span class=\"en\"><b>mere passive observers.</b></span></div></div><div class=\"lec-sent-ko\">이에 대해, Heraclitus의 제자인 Cratylus는 우리는 단순한 수동적인 관찰자가 아니라고 덧붙였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 헤라클레이토스의 &#39;변화론&#39;에서 한 단계 더 나아갑니다. 단순히 변화에 휩쓸리는 존재가 아니라, 인간의 주체적인 역할을 언급하며 논의의 초점을 &#39;상호작용&#39;으로 옮깁니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a student of Heraclitus (동격): 콤마(,)를 사용해 앞의 명사 Cratylus를 보충 설명하는 명사구가 뒤따르는 동격 구조이다.</div><div class=\"lec-gr-item\">added that 명사절 접속사 that: 타동사 added의 목적어 역할을 하는 절을 이끄는 접속사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mere</td><td class=\"m\">단지 ~에 불과한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 발을 담그면</span><span class=\"en\"><b><span class=\"grammar-hl\">When you step</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강물에</span><span class=\"en\"><b>in a river,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 그것을 변화시킨다.</span><span class=\"en\"><b>you change it.</b></span></div></div><div class=\"lec-sent-ko\">당신이 강물에 발을 담그면, ‘당신’이 그것을 변화시킨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 대한 구체적인 예시입니다. 내가 변화하는 환경에 영향을 받는 것뿐만 아니라, 나의 행동(발을 담그는 것)이 환경(강물)의 흐름을 바꾸는 원인이 된다는 능동적 관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When you step 접속사: 시간의 부사절을 이끄는 접속사 when이 쓰여 &#39;~할 때&#39;라는 조건이나 때를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아무것도</span><span class=\"en\"><b><span class=\"grammar-hl\">Nothing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정적인 것은 없다.</span><span class=\"en\"><b><span class=\"grammar-hl\">is static</span>.</b></span></div></div><div class=\"lec-sent-ko\">정적인 것은 아무것도 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체를 관통하는 핵심 결론입니다. 세상에 고정불변한 것은 없으며, 모든 존재는 끊임없는 흐름 속에 있음을 다시 한번 확언합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Nothing is static 부정 주어: 부정 대명사인 Nothing이 주어로 쓰여 문장 전체를 부정하며 &#39;어떠한 것도 ~하지 않다&#39;는 의미를 형성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">static</td><td class=\"m\">고정된, 정적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">극히 작은 변화들조차</span><span class=\"en\"><b>Even microscopic changes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쌓인다</span><span class=\"en\"><b><span class=\"grammar-hl\">add up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간이 지나면서.</span><span class=\"en\"><b>over time.</b></span></div></div><div class=\"lec-sent-ko\">극히 작은 변화들조차 시간이 지나면서 쌓인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장으로, 당장 감지할 수 없는 작은 변화들이 모여 결국 거대한 삶의 변화와 결과를 만들어낸다는 &#39;누적의 원리&#39;를 강조하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">add up (관용표현): &#39;합쳐지다&#39;, &#39;결국 ~이 되다&#39;라는 뜻의 숙어로, 작은 것들이 모여 큰 영향을 미치게 됨을 의미한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">microscopic</td><td class=\"m\">미세한, 현미경을 이용한, 현미경으로 볼 수 있는</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>세상은 우리가 인지하지 못하는 순간에도 끊임없이 변화하고 서로 연결되어 있다.</li><li>글을 읽는 짧은 순간에도 인간의 뇌와 신체는 실시간으로 변화한다.</li><li>내가 인지하지 못하는 외부의 사건들도 나의 미래를 바꾸는 변화의 과정 속에 있다.</li><li>고대 철학자들의 말처럼 세상(강물)과 인간은 모두 변하며, 인간은 변화를 지켜보기만 하는 존재가 아니라 변화를 일으키는 주체이기도 하다.</li><li>미세한 변화들이 쌓여 결국 커다란 삶의 변화를 만들어낸다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Everything in the universe is in a state of constant flux because even the smallest internal and external changes accumulate to reshape both the self and the surrounding environment.</div>\n              <div class=\"lec-final-sum-ko\">우주의 모든 것은 끊임없는 변화의 상태에 있는데, 이는 아주 작은 내외부적 변화들이 축적되어 자신과 주변 환경 모두를 재형성하기 때문이다.</div></div></div>"],"segs":[[{"audio":"./31_audio/1.mp3","hl":null}],[{"audio":"./31_audio/2.mp3","hl":null}],[{"audio":"./31_audio/3.mp3","hl":null},{"audio":"./31_audio/4.mp3","hl":"stage-0"},{"audio":"./31_audio/5.mp3","hl":"stag     const zoomed = () => window.visualViewport && window.visualViewport.scale > 1.01;

    const interactive = el => el && el.closest('a,button,input,textarea,select,video,audio,canvas,[contenteditable="true"],[role="slider"]');
    const scrollsHorizontally = target => {

    root.addEventListener('touchstart', e => {
