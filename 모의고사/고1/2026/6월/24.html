tion-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01SNS 사용과 도파민 급증</div><ul><li>소셜 미디어 사용은 뇌의 도파민 수치를 매우 빠르게 높여 즉각적인 쾌락을 유발한다.</li><li>소셜 미디어 앱(social media apps) 접속</li><li>도파민 수치(dopamine levels)의 급격한 상승</li><li>뇌가 느끼는 즉각적인 쾌락(pleasure)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02신체의 항상성 유지 원리</div><ul><li>우리 몸은 물리 법칙처럼 항상 내부의 균형을 유지하려는 성질을 가지고 있다.</li><li>올라간 것은 반드시 내려와야 한다는 물리 법칙(laws of physics) 적용</li><li>신체와 뇌의 균형(balance) 상태 추구</li><li>핵심 개념: 항상성(homeostasis)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03수치 급락으로 인한 기분 저하</div><ul><li>항상성을 맞추기 위해 도파민이 기준치 이하로 떨어지며 오히려 역효과가 발생한다.</li><li>균형 재조정(rebalance)을 위한 도파민의 급격한 하락</li><li>도파민 수치가 기존의 기준치(baseline level)보다 낮아짐</li><li>SNS 시작 전보다 더 나빠진 기분(feel even worse) 상태 유발</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">occur</td><td class=\"m\">발생하다, 일어나다</td></tr><tr><td class=\"w\">incredibly</td><td class=\"m\">엄청나게, 믿을 수 없을 정도로</td></tr><tr><td class=\"w\">homeostasis</td><td class=\"m\">항상성</td></tr><tr><td class=\"w\">seek</td><td class=\"m\">찾다, 구하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">with this in mind</td><td class=\"m\">이것을 염두에 두고</td></tr><tr><td class=\"w\">achieve</td><td class=\"m\">달성하다, 성취하다</td></tr><tr><td class=\"w\">baseline</td><td class=\"m\">기준치, 기초선</td></tr><tr><td class=\"w\">rebalance</td><td class=\"m\">다시 균형을 잡다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">살펴보자</span><span class=\"en\"><b>Let’s look at</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무슨 일이 일어나고 있는지</span><span class=\"en\"><b><span class=\"grammar-hl\">what is occurring</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 뇌에서</span><span class=\"en\"><b>in your brain</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소셜 미디어를 스크롤할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when scrolling</span> on social media,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즉 빠른 도파민 활동인</span><span class=\"en\"><b>a quick dopamine activity.</b></span></div></div><div class=\"lec-sent-ko\">소설 미디어상에서 스크롤할 때 당신의 뇌에서 일어나고 있는 일, 즉 빠른 도파민 활동을 살펴보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로, 소셜 미디어 사용이라는 일상적인 행위를 &#39;빠른 도파민 활동&#39;이라는 신경과학적 관점에서 분석하겠다는 글의 주제를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what is occurring (간접의문문): 의문사(what)가 이끄는 절이 전치사(at)의 목적어 역할을 하는 명사절로 쓰였다.</div><div class=\"lec-gr-item\">when scrolling (분사구문): 접속사 when 다음에 현재분사가 이어진 형태이며, 원래 절로 변환하면 when you are scrolling social media이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">occur</td><td class=\"m\">발생하다, 일어나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 연다</span><span class=\"en\"><b>You open</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소셜 미디어 앱을</span><span class=\"en\"><b>your social media apps</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 즉시 알아차린다</span><span class=\"en\"><b>and immediately you notice</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 정말 기분이 좋다는 것을</span><span class=\"en\"><b>you feel really good,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도파민 수치가 증가하고</span><span class=\"en\"><b>your dopamine levels increase</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">믿을 수 없이 빠르게</span><span class=\"en\"><b>incredibly fast</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쾌락이 경험된다</span><span class=\"en\"><b>and pleasure <span class=\"grammar-hl\">is experienced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 뇌에서</span><span class=\"en\"><b>in your brain.</b></span></div></div><div class=\"lec-sent-ko\">당신은 소셜 미디어 앱을 열고 당신이 정말 기분이 좋다는 것을 즉시 알아차리게 되며, 당신의 도파민 수치는 믿을 수 없이 빠르게 증가하여 쾌락이 뇌에서 경험된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;도파민 활동&#39;의 첫 번째 단계를 구체적으로 설명합니다. 소셜 미디어 자극에 반응하여 뇌가 즉각적인 즐거움을 느끼는 초기 반응을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is experienced (수동태): be동사(is)+p.p.(experienced) 구조. experience는 타동사인데 뒤에 목적어가 없어서 수동구조 is experienced 형태로 쓴다. 기본구조: V + O</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">incredibly</td><td class=\"m\">엄청나게, 믿을 수 없을 정도로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">난제는</span><span class=\"en\"><b>The challenge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것이 만들어 내는</span><span class=\"en\"><b><span class=\"grammar-hl\">this creates</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 것들과 마찬가지이다</span><span class=\"en\"><b>is as with everything</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 우주의</span><span class=\"en\"><b>in our universe:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물리학 법칙이 설명하듯이</span><span class=\"en\"><b>as the laws of physics explain,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘올라가는 것은</span><span class=\"en\"><b>‘what goes up,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반드시 내려와야 한다’</span><span class=\"en\"><b>must come down’.</b></span></div></div><div class=\"lec-sent-ko\">이것(도파민 급증)이 만들어 내는 난제는 우리 우주의 모든 것들과 마찬가지이다. 즉, 물리학 법칙이 설명하듯이, ‘올라가는 것은, 반드시 내려와야 한다.’</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 즉각적인 쾌락(상승) 뒤에는 반드시 그에 상응하는 반작용(하락)이 따른다는 경고를 물리학의 법칙을 빌려 논리적으로 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">this creates (관계대명사): 명사(challenge) 뒤에 목적격 관계대명사(that/which)가 생략되어 수식하는 구조이며, creates의 목적어가 비어있는 불완전한 절이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신의 뇌와 몸은</span><span class=\"en\"><b>Your brain and body</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상 추구하고 있다</span><span class=\"en\"><b>are always seeking</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘항상성’이라고 불리는 어떤 것을</span><span class=\"en\"><b>something <span class=\"grammar-hl\">called</span> ‘homeostasis’,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 단순히 균형을 의미한다</span><span class=\"en\"><b><span class=\"grammar-hl\">which simply means</span> balance.</b></span></div></div><div class=\"lec-sent-ko\">당신의 뇌와 몸은 ‘항상성’이라고 불리는 어떤 것을 항상 추구하고 있는데, 그것은 단순히 균형을 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 3번 문장에서 언급한 &#39;내려와야 하는 이유&#39;에 대한 생물학적 근거인 &#39;항상성&#39;의 개념을 설명합니다. 이는 뇌가 왜 변화를 거부하고 원래 상태로 돌아가려 하는지를 밝혀줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">called (과거분사(형용사)): called가 앞의 명사인 something을 수식하며 &#39;homeostasis라고 불리는&#39;의 의미를 가진다. something that is called... 의 축약 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">which simply means (관계대명사): 관계대명사 which의 계속적 용법으로 선행사인 homeostasis에 대한 부연 설명을 제공한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">homeostasis</td><td class=\"m\">항상성</td></tr><tr><td class=\"w\">seek</td><td class=\"m\">찾다, 구하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것을 염두에 두고</span><span class=\"en\"><b><span class=\"grammar-hl\">With this in mind</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도파민 수치가 증가할 때</span><span class=\"en\"><b>when dopamine levels increase</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">믿을 수 없이 빠르게</span><span class=\"en\"><b>incredibly fast</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소셜 미디어를 스크롤할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when scrolling</span> social media,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뇌는 그때 생각한다</span><span class=\"en\"><b>the brain then thinks,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘와, 어떻게</span><span class=\"en\"><b>‘Wow, how are</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내 도파민 수치가 이렇게 높지?’</span><span class=\"en\"><b>my dopamine levels so high?’</b></span></div></div><div class=\"lec-sent-ko\">이것을 염두에 두고, 소셜 미디어를 스크롤할 때 도파민 수치가 믿을 수 없이 빠르게 증가하면, 뇌는 그때 ‘와, 내 도파민 수치가 이렇게 이렇게 높지’라고 생각한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 항상성의 원리를 실제 소셜 미디어 사용 상황에 적용합니다. 급격한 도파민 상승을 뇌가 비정상적인 불균형 상태로 인식하기 시작하는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">With this in mind (관용표현): &#39;이것을 염두에 두고&#39;라는 의미로 앞서 언급한 내용을 바탕으로 상황을 설명할 때 쓰인다.</div><div class=\"lec-gr-item\">when scrolling (분사구문): 시간의 접속사(when)가 생략되지 않은 형태의 분사구문이다. 원래 절로 변환하면 when you are scrolling social media이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">incredibly</td><td class=\"m\">엄청나게, 믿을 수 없을 정도로</td></tr><tr><td class=\"w\">with this in mind</td><td class=\"m\">이것을 염두에 두고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이루기 위해서</span><span class=\"en\"><b><span class=\"grammar-hl\">In order to achieve</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상성 즉 균형을</span><span class=\"en\"><b>homeostasis, or balance,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그때 도파민은 ~해야 한다</span><span class=\"en\"><b>the dopamine then has to</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빠르게 떨어져야</span><span class=\"en\"><b>quickly drop</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동일한 양만큼</span><span class=\"en\"><b>an equal amount</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 기존선 수치 아래로</span><span class=\"en\"><b>below your baseline level</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시 균형을 맞추기 위해</span><span class=\"en\"><b>in order to rebalance,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신을 느끼게 만들며</span><span class=\"en\"><b><span class=\"grammar-hl\">making you feel</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 기분이 나쁘게</span><span class=\"en\"><b>even worse</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스크롤을 시작하기 전보다</span><span class=\"en\"><b>than before you started <span class=\"grammar-hl\">scrolling</span>.</b></span></div></div><div class=\"lec-sent-ko\">항상성, 즉 균형을 이루기 위해서, 그때 도파민은 다시 균형을 맞추기 위해 당신의 기존선 수치 아래로 동일한 양만큼 빠르게 떨어져야 하고, 스크롤을 시작하기 전보다 당신을 훨씬 더 기분이 나쁘게 만든다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 최종 결론입니다. 뇌가 강제로 균형을 맞추는 과정에서 도파민 수치가 기준선 밑으로 과하게 떨어지게 되고, 그 결과 사용자는 처음보다 더 큰 공허함이나 불쾌감을 느끼게 된다는 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In order to achieve (to부정사): 부사적 용법 중 &#39;목적&#39;을 나타내며, &#39;~하기 위하여&#39;라는 의미를 분명히 하기 위해 in order를 붙인 구조다.</div><div class=\"lec-gr-item\">making you feel 5형식(SVOC) 구조: 사역동사(making) + 목적어(you) + 목적보어(feel, 동사원형)가 쓰여 &#39;당신이 ~하게 느끼도록 만들다&#39;는 구조를 형성한다.</div><div class=\"lec-gr-item\">making (분사구문): 문장 전체의 뒤에 위치하여 결과적인 상황을 설명하며, 원래 절로 변환하면 and it makes you feel... 이 된다.</div><div class=\"lec-gr-item\">scrolling (동명사): 전치사 before의 목적어 자리에 위치하여 &#39;스크롤하는 행위&#39;라는 명사적 개념으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">homeostasis</td><td class=\"m\">항상성</td></tr><tr><td class=\"w\">achieve</td><td class=\"m\">달성하다, 성취하다</td></tr><tr><td class=\"w\">baseline</td><td class=\"m\">기준치, 기초선</td></tr><tr><td class=\"w\">rebalance</td><td class=\"m\">다시 균형을 잡다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>소셜 미디어 사용은 뇌에서 도파민을 급격히 분비시켜 즉각적인 즐거움을 준다.</li><li>하지만 우리 몸은 &#39;항상성&#39;이라는 원리에 의해 스스로의 균형을 유지하려 한다.</li><li>급상승한 도파민 수치를 조절하기 위해 뇌는 수치를 급격히 떨어뜨린다.</li><li>이 과정에서 도파민은 원래의 기준치보다 더 낮아지며, 결국 사용 전보다 기분이 더 나빠지는 역효과가 발생한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Social media scrolling induces an immediate dopamine surge, but the brain compensates for this spike by dropping dopamine levels below the baseline to achieve homeostasis.</div>\n              <div class=\"lec-final-sum-ko\">소셜 미디어 스크롤링은 즉각적인 도파민 급증을 유도하지만, 뇌는 항상성을 유지하기 위해 도파민 수치를 기준치 이하로 떨어뜨림으로써 이러한 급증을 상쇄한다.</div></div></div>"],"segs":[[{"audio":"./24_audio/1.mp3","hl":null}],[{"audio":"./24_audio/2.mp3","hl":null}],[{"a     let gesture = null;
    const zoomed = () => window.visualViewport && window.visualViewport.scale > 1.01;
    const selected = () => { const s = window.getSelection(); return s && !s.isCollapsed; };
    const interactive = el => el && el.closest('a,button,input,textarea,select,video,audio,canvas,[contenteditable="true"],[role="slider"]');
    const scrollsHorizontally = target => {
      for (let el = target; el && root.contains(el); el = el.parentElement) {

    root.addEventListener('touchstart', e => {
      gesture = null;
      if (e.touches.length !== 1 || zoomed() || selected() || interactive(e.target) || scrollsHorizontally(e.target)) return;
