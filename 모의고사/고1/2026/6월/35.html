감소 확인</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03집중력과 웰빙의 회복 원리</div><ul><li>정보 과부하를 줄임으로써 삶의 질을 높이는 의미 있는 활동에 더 집중할 수 있게 된다.</li><li>정보와 알림(notifications)의 지속적인 유입을 차단</li><li>의미 있는 상호작용(meaningful interactions)과 웰빙 증진 활동에 몰입</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04직장인의 실천 사례와 성과</div><ul><li>번아웃을 겪던 전문가가 구체적인 디지털 제한 규칙을 통해 삶의 평온을 되찾았다.</li><li>휴대폰 사용 경계 설정(setting boundaries) 및 마음챙김(mindfulness) 실천</li><li>수면의 질(sleep quality) 향상 및 정신적 명료함(clarity) 확보</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evident</td><td class=\"m\">분명한</td></tr><tr><td class=\"w\">adopt</td><td class=\"m\">받아들이다, 채택하다</td></tr><tr><td class=\"w\">lead</td><td class=\"m\">이끌다, ~에 이르다</td></tr><tr><td class=\"w\">improve</td><td class=\"m\">나아지게 하다, 향상시키다</td></tr><tr><td class=\"w\">mental</td><td class=\"m\">정신의, 마음의</td></tr><tr><td class=\"w\">outcome</td><td class=\"m\">결과, 성과</td></tr><tr><td class=\"w\">social media</td><td class=\"m\">누리소통망, 소셜미디어</td></tr><tr><td class=\"w\">for instance</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">conduct</td><td class=\"m\">수행하다, 실시하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">found</td><td class=\"m\">찾다, 발견하다 (find의 과거형)</td></tr><tr><td class=\"w\">participant</td><td class=\"m\">참가자</td></tr><tr><td class=\"w\">limit</td><td class=\"m\">제한하다</td></tr><tr><td class=\"w\">device</td><td class=\"m\">장치, 기기</td></tr><tr><td class=\"w\">lower</td><td class=\"m\">더 낮은, 아래쪽의</td></tr><tr><td class=\"w\">level</td><td class=\"m\">평평하게 하다</td></tr><tr><td class=\"w\">stress</td><td class=\"m\">스트레스, 압박</td></tr><tr><td class=\"w\">anxiety</td><td class=\"m\">불안, 걱정</td></tr><tr><td class=\"w\">depression</td><td class=\"m\">우울(증)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 분명하다</span><span class=\"en\"><b>It is evident</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 사례 연구를 통해</span><span class=\"en\"><b>through various case studies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디지털 미니멀리즘을 채택하는 것이</span><span class=\"en\"><b>that <span class=\"grammar-hl\">adopting</span> digital minimalism</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이어질 수 있다는 것은</span><span class=\"en\"><b>can <span class=\"grammar-hl\">lead to</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개선된 정신 건강 결과로.</span><span class=\"en\"><b><span class=\"grammar-hl\">improved</span> mental health outcomes.</b></span></div></div><div class=\"lec-sent-ko\">디지털 미니멀리즘을 채택하는 것이 개선된 정신 건강 결과로 이어질 수 있다는 것은 다양한 사례 연구를 통해 분명히 드러난다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심 주제(Thesis Statement)를 제시하는 문장입니다. &#39;디지털 미니멀리즘(디지털 기기 사용을 의도적으로 줄이는 것)&#39;이 정신 건강에 긍정적인 영향을 미친다는 결론을 먼저 밝히며 독자의 관심을 집중시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is evident ... that (가주어): 진주어: It은 문장의 주어 자리를 채우는 가주어이며, 접속사 that이 이끄는 절(that adopting digital minimalism can lead to improved mental health outcomes)이 문장의 실제 주어인 진주어 역할을 한다.</div><div class=\"lec-gr-item\">adopting (동명사): that절 내부에서 주어 역할을 수행하는 명사적 용법으로, &#39;채택하는 것&#39;이라는 행위의 개념을 나타낸다.</div><div class=\"lec-gr-item\">improved (과거분사(형용사)): improved가 뒤의 명사구인 mental health outcomes를 수식(= &quot;개선된 정신 건강 결과&quot;)하며, 이미 완료되었거나 수동적인 상태를 나타낸다.</div><div class=\"lec-gr-item\">lead to (관용표현): &#39;lead to + 명사&#39; 구조로 쓰여 &#39;~로 이어지다&#39; 또는 &#39;~라는 결과를 초래하다&#39;라는 인과관계를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evident</td><td class=\"m\">분명한</td></tr><tr><td class=\"w\">adopt</td><td class=\"m\">받아들이다, 채택하다</td></tr><tr><td class=\"w\">lead</td><td class=\"m\">이끌다, ~에 이르다</td></tr><tr><td class=\"w\">improve</td><td class=\"m\">나아지게 하다, 향상시키다</td></tr><tr><td class=\"w\">mental</td><td class=\"m\">정신의, 마음의</td></tr><tr><td class=\"w\">outcome</td><td class=\"m\">결과, 성과</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b><span class=\"grammar-hl\">For instance</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연구진에 의해 수행된 한 연구는</span><span class=\"en\"><b>a study <span class=\"grammar-hl\">conducted</span> by researchers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Stanford University의</span><span class=\"en\"><b>at Stanford University</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">참가자들이 ~라는 것을 발견했다</span><span class=\"en\"><b>found that participants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 사용을 제한했던</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span> limited their use</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소셜 미디어와 디지털 기기의</span><span class=\"en\"><b>of social media and digital devices</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 낮은 수치를 보고했음을</span><span class=\"en\"><b>reported lower levels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스트레스, 불안, 그리고 우울의.</span><span class=\"en\"><b>of stress, anxiety, and depression.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, Stanford University 연구진이 수행한 연구는 소셜 미디어와 디지털 기기 사용을 제한했던 참가자들이 더 낮은 수치의 스트레스, 불안, 그리고 우울을 보고했음을 발견했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시한 주제를 뒷받침하기 위해 신뢰할 수 있는 기관(스탠퍼드 대학)의 연구를 예시로 듭니다. 디지털 기기 사용 제한이 심리적 부정적 요인들을 감소시킨다는 구체적인 데이터를 제시하며 논리적 근거를 강화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">For instance (관용표현): &#39;예를 들어&#39;라는 의미로 앞서 언급한 주장에 대한 구체적인 사례를 도입할 때 쓰는 연결어구이다.</div><div class=\"lec-gr-item\">conducted (과거분사(형용사)): conducted가 앞의 명사 a study를 수식(= &quot;수행된 연구&quot;)하며, a study that was conducted 형태에서 주격 관계대명사와 be동사가 생략된 축약 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">who (관계대명사): 주격 관계대명사로 선행사 participants를 수식한다. who 뒤에는 주어가 빠진 불완전한 절(limited their use...)이 이어져 선행사의 정보를 구체적으로 한정한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">social media</td><td class=\"m\">누리소통망, 소셜미디어</td></tr><tr><td class=\"w\">for instance</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">conduct</td><td class=\"m\">수행하다, 실시하다</td></tr><tr><td class=\"w\">found</td><td class=\"m\">찾다, 발견하다 (find의 과거형)</td></tr><tr><td class=\"w\">participant</td><td class=\"m\">참가자</td></tr><tr><td class=\"w\">limit</td><td class=\"m\">제한하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">device</td><td class=\"m\">장치, 기기</td></tr><tr><td class=\"w\">lower</td><td class=\"m\">더 낮은, 아래쪽의</td></tr><tr><td class=\"w\">level</td><td class=\"m\">평평하게 하다</td></tr><tr><td class=\"w\">stress</td><td class=\"m\">스트레스, 압박</td></tr><tr><td class=\"w\">anxiety</td><td class=\"m\">불안, 걱정</td></tr><tr><td class=\"w\">depression</td><td class=\"m\">우울(증)</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">줄임으로써</span><span class=\"en\"><b>By <span class=\"grammar-hl\">reducing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">끊임없는 흐름을</span><span class=\"en\"><b>the constant stream</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정보와 알림의</span><span class=\"en\"><b>of information and notifications,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개인들은 더 집중할 수 있었다</span><span class=\"en\"><b>individuals <span class=\"grammar-hl\">were able to</span> <span class=\"grammar-hl\">focus more</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미 있는 상호작용과 활동에</span><span class=\"en\"><b><span class=\"grammar-hl\">on</span> meaningful interactions and activities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">웰빙을 촉진하는.</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> promoted well-being.</b></span></div></div><div class=\"lec-sent-ko\">정보와 알림의 끊임없는 흐름을 줄임으로써, 개인은 의미 있는 상호작용과 웰빙을 촉진하는 활동에 더 집중할 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 디지털 미니멀리즘이 왜 효과가 있는지 그 &#39;작용 기전&#39;을 설명합니다. 끊임없는 방해 요소(정보, 알림)가 사라진 자리에 삶의 질을 높이는 &#39;의미 있는 활동&#39;이 채워지면서 정신 건강이 좋아진다는 논리적 인과관계를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reducing (동명사): 전치사 By의 목적어로 쓰였으며, &#39;줄이는 것&#39;이라는 의미로 수단이나 방법을 나타내는 명사적 역할을 한다.</div><div class=\"lec-gr-item\">were able to (관용표현): &#39;be able to + 동사원형&#39; 구문의 과거형으로 &#39;~할 수 있었다&#39;라는 능력이나 가능성을 나타낸다.</div><div class=\"lec-gr-item\">focus more on (관용표현): &#39;focus on&#39;은 &#39;~에 집중하다&#39;라는 의미의 숙어이며, 부사 more가 사이에 삽입되어 &#39;더 집중하다&#39;라는 의미를 형성한다.</div><div class=\"lec-gr-item\">that (관계대명사): 주격 관계대명사로 선행사 activities를 수식한다. that 뒤에 바로 동사(promoted)가 오는 불완전한 절 구조로 명사를 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또 다른 사례에서</span><span class=\"en\"><b>In another case,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 기업 전문가는</span><span class=\"en\"><b>a corporate professional</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">번아웃과 불면증으로 고군분투하는</span><span class=\"en\"><b><span class=\"grammar-hl\">struggling</span> with burnout and insomnia</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디지털 미니멀리즘 기법을 실행했다</span><span class=\"en\"><b>implemented digital minimalism techniques,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경계를 설정하기와 같은</span><span class=\"en\"><b><span class=\"grammar-hl\">such as</span> setting boundaries</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">휴대폰 사용에 대한</span><span class=\"en\"><b>for phone usage</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 마음 챙김을 실천하기.</span><span class=\"en\"><b>and practicing mindfulness.</b></span></div></div><div class=\"lec-sent-ko\">또 다른 사례에서, 번아웃과 불면증으로 고군분투하는 한 기업 전문가가 휴대폰 사용에 대한 경계 설정하기와 마음 챙김 실천하기와 같은, 디지털 미니멀리즘 기법을 실행했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장이 일반적인 연구 결과였다면, 이번에는 구체적인 개인의 사례를 들어 설명합니다. 번아웃과 불면증이라는 현대인의 전형적인 문제를 언급하며, 해결책으로 구체적인 실천 방안(경계 설정, 마음챙김)을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">struggling (현재분사(형용사)): struggling이 앞의 명사 professional을 수식(= &quot;고군분투하는 전문가&quot;)하며, 해당 명사가 직접 하고 있는 동작이나 상태를 능동적으로 설명한다.</div><div class=\"lec-gr-item\">such as (관용표현): &#39;~와 같은&#39;이라는 의미로 뒤에 명사나 동명사구를 나열하여 앞의 추상적인 명사(techniques)에 대한 구체적인 예시를 제시한다.</div><div class=\"lec-gr-item\">setting ... practicing (동명사): 전치사(구) such as의 목적어 역할을 하는 병렬 구조로, 각각 &#39;설정하는 것&#39;과 &#39;실천하는 것&#39;이라는 구체적인 행위를 명사화하여 표현한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 결과,</span><span class=\"en\"><b><span class=\"grammar-hl\">As a result</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 경험했다</span><span class=\"en\"><b>he experienced</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개선된 수면의 질을</span><span class=\"en\"><b><span class=\"grammar-hl\">improved</span> sleep quality,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감소된 스트레스 수치와</span><span class=\"en\"><b><span class=\"grammar-hl\">reduced</span> stress levels,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 현저해진 느낌을</span><span class=\"en\"><b>and a newfound sense</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">평정과 명료의.</span><span class=\"en\"><b>of calm and clarity.</b></span></div></div><div class=\"lec-sent-ko\">그 결과, 그는 개선된 수면의 질, 감소된 스트레스 수치, 그리고 현저해진 평정과 명료의 느낌을 경험했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 사례의 결과를 정리하며 글을 마무리합니다. 4번 문장에서 언급된 문제가 5번 문장에서 해결되는 과정을 통해, 첫 번째 문장에서 주장했던 &#39;정신 건강 개선&#39;이라는 결론을 다시 한번 확증합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As a result (관용표현): &#39;그 결과로&#39;라는 뜻의 전치사구로, 앞선 조치에 따른 인과 관계를 나타내는 부사적 역할을 한다.</div><div class=\"lec-gr-item\">improved (과거분사(형용사)): improved가 뒤의 명사 sleep quality를 수식(= &quot;개선된 수면의 질&quot;)하는 형용사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">reduced (과거분사(형용사)): reduced가 뒤의 명사 stress levels를 수식(= &quot;감소된 스트레스 수치&quot;)하며 분사로서 명사의 상태를 한정한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">improve</td><td class=\"m\">나아지게 하다, 향상시키다</td></tr><tr><td class=\"w\">found</td><td class=\"m\">찾다, 발견하다 (find의 과거형)</td></tr><tr><td class=\"w\">level</td><td class=\"m\">평평하게 하다</td></tr><tr><td class=\"w\">stress</td><td class=\"m\">스트레스, 압박</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>디지털 미니멀리즘은 정신 건강을 개선하는 데 매우 효과적인 방법이다.</li><li>스탠퍼드 연구는 디지털 기기 제한이 스트레스, 불안, 우울을 낮춘다는 것을 보여준다.</li><li>알림을 줄이면 웰빙에 도움이 되는 의미 있는 활동에 더 집중할 수 있는 여유가 생긴다.</li><li>실제 사례에서도 휴대폰 사용 제한을 통해 번아웃과 불면증을 극복하고 평온을 되찾았다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Adopting digital minimalism improves overall mental health since it minimizes digital distractions while enabling a greater focus on well-being and meaningful interactions.</div>\n              <div class=\"lec-final-sum-ko\">디지털 미니멀리즘을 채택하는 것은 디지털 주의 산만 요소를 최소화하는 동시에 안녕과 의미 있는 상호작용에 더 큰 집중을 가능하게 하므로 전반적인 정신 건강을 향상시킨다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/18.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/19.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/21.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/22.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_06월_35번_강의_audio/23.mp3","hl":"gr
