/b><div class=\"lec-cover-bkg-txt\">스포츠 센터와 같은 대중 시설이 다시 문을 열기 전에는 시설 관리(Facility Management) 차원에서 매우 꼼꼼한 안전 점검이 필수적으로 이루어집니다. 특히 지문 속 사례처럼 공사 중 예상치 못한 문제가 생겼을 때 개장일을 늦추는 결정은 큰 사고를 미연에 방지하기 위한 리스크 관리(Risk Management)의 핵심적인 과정입니다. 이는 마치 자동차를 정식 출고하기 전 엔진 결함을 발견하고 완벽하게 수리하는 것과 같아서, 당장은 불편하더라도 안전 규정(Safety Regulations)을 철저히 준수하는 것이 사용자에게는 장기적으로 훨씬 이로운 일이죠. 또한, 이러한 피치 못할 사정을 고객에게 솔직하게 알리는 소통 방식은 고객 관계 관리(Customer Relationship Management) 측면에서 신뢰를 유지하는 아주 중요한 비즈니스 전략이기도 합니다. 결국 이 글은 전기 안전(Electrical Safety)이라는 최우선 가치를 지키기 위해 잠시 멈춤을 선택한 책임감 있는 운영자의 소통 방식을 보여주고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입</div><ul><li>탁구장 센터장이 회원들에게 재개장에 대한 관심에 감사를 표하며 서신을 시작한다.</li><li>발신자: 탁구장 매니저(manager)</li><li>수신자: 센터 회원들(members)</li><li>핵심 키워드: 재개장(reopening)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02문제 발생</div><ul><li>수리 과정 중 계획에 없던 기술적 결함이 발견되어 작업이 지연된다.</li><li>수리 과정(repair process) 중 발생한 상황</li><li>예상치 못한 전기 문제(unexpected electrical issues) 발견</li><li>작업 시간이 예정보다 길어짐(longer than we planned)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03일정 변경 고지</div><ul><li>수리 지연으로 인해 기존에 계획된 재개장 날짜를 연기한다.</li><li>기존 재개장 예정일: 4월 1일(April 1st)</li><li>변경 사항: 재개장 지연(delayed) 통보</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04변경된 일정과 사유</div><ul><li>회원들의 안전을 최우선으로 고려하여 확정된 새로운 개장일을 안내한다.</li><li>변경된 재개장일: 5월 1일(May 1st)</li><li>지연 사유: 회원들의 안전(safety) 확보</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05마무리</div><ul><li>불편에 대한 양해를 구하며 회원들과 다시 만나기를 기대한다.</li><li>회원들의 인내(patience)와 이해(understanding) 요청</li><li>코트에서의 재회 기대(looking forward to seeing you)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upcoming</td><td class=\"m\">다가오는, 곧 있을</td></tr><tr><td class=\"w\">unexpected</td><td class=\"m\">예기치 못한, 뜻밖의</td></tr><tr><td class=\"w\">repair</td><td class=\"m\">수리, 보수</td></tr><tr><td class=\"w\">discover</td><td class=\"m\">발견하다, 찾다</td></tr><tr><td class=\"w\">regret to</td><td class=\"m\">~하게 되어 유감이다, ~함을 죄송하게 생각하다</td></tr><tr><td class=\"w\">inform</td><td class=\"m\">알리다, 통지하다</td></tr><tr><td class=\"w\">delay</td><td class=\"m\">미루다, 연기하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">originally</td><td class=\"m\">원래, 처음에</td></tr><tr><td class=\"w\">be scheduled to</td><td class=\"m\">~할 예정이다, ~하기로 되어 있다</td></tr><tr><td class=\"w\">ensure</td><td class=\"m\">확실히 하다, 보장하다</td></tr><tr><td class=\"w\">look forward to</td><td class=\"m\">~을 고대하다, ~을 기대하다</td></tr><tr><td class=\"w\">patience</td><td class=\"m\">인내, 참을성</td></tr><tr><td class=\"w\">understanding</td><td class=\"m\">이해, 배려</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">~에게</span><span class=\"en\"><b><span class=\"grammar-hl\">Dear</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Connexa Point 탁구 센터 회원님들,</span><span class=\"en\"><b><span class=\"grammar-hl\">Connexa Point Table Tennis Center members</span>,</b></span></div></div><div class=\"lec-sent-ko\">Connexa Point 탁구 센터 회원님께,</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 수신자가 탁구장 회원임을 밝히며 시작하는 **공식적인 인사말**입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Dear Connexa Point Table Tennis Center members (관용표현): 편지의 서두에서 수신인을 지칭할 때 쓰는 표현으로, &#39;존경하는 ~에게&#39; 또는 &#39;~께&#39;라는 의미를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저는 관리자입니다</span><span class=\"en\"><b><span class=\"grammar-hl\">I am the manager</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Connexa Point 탁구 센터의</span><span class=\"en\"><b>of the Connexa Point Table Tennis Center.</b></span></div></div><div class=\"lec-sent-ko\">저는 Connexa Point 탁구 센터의 관리자입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이가 누구인지 밝히는 문장으로, 센터 운영을 책임지는 사람으로서 **공식적인 공지사항을 전달하겠다는 의지**를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I am the manager 2형식(SVC) 구조: 주어(I) + 동사(am) + 주격 보어(the manager)로 이루어진 문장으로 주어의 신분이나 상태를 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">감사합니다</span><span class=\"en\"><b>Thank you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 관심에</span><span class=\"en\"><b>for your interest</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다가오는 센터의 재개장에 대한</span><span class=\"en\"><b>in the <span class=\"grammar-hl\">upcoming reopening</span> of the center.</b></span></div></div><div class=\"lec-sent-ko\">센터의 다가오는 재개장에 관심을 가져 주셔서 감사합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 본격적인 소식을 전하기에 앞서, 재개장을 기다려 온 회원들에게 **고마움을 표현하며 긍정적인 분위기**를 조성하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">upcoming reopening (현재분사(형용사)): upcoming이 뒤에 오는 명사인 reopening을 수식하며 &#39;다가오는 재개관&#39;이라는 의미를 만든다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">upcoming</td><td class=\"m\">다가오는, 곧 있을</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">안타깝게도,</span><span class=\"en\"><b>Unfortunately,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보수 과정에서,</span><span class=\"en\"><b>during the repair process,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예상치 못한 전기 문제가 발견되었습니다,</span><span class=\"en\"><b><span class=\"grammar-hl\">unexpected electrical issues</span> <span class=\"grammar-hl\">were discovered</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 결과 작업이</span><span class=\"en\"><b><span class=\"grammar-hl\">causing the work</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 오래 걸리게 되었습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">to take longer</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저희가 계획했던 것보다.</span><span class=\"en\"><b>than we planned.</b></span></div></div><div class=\"lec-sent-ko\">안타깝게도, 보수 과정에서 예상치 못한 전기 문제가 발견되었고, 작업이 저희가 계획했던 것보다 더 오래 걸리게 되었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 긍정적 분위기를 전환하여 **문제가 발생했음을 알리는 핵심 문장**입니다. unexpected electrical issues는 미리 알 수 없었던 돌발 변수가 생겨 공사 일정이 어긋났음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">unexpected electrical issues (과거분사(형용사)): unexpected가 뒤에 오는 명사구 electrical issues를 수식하며 &#39;예기치 못한 전기 문제들&#39;이라는 의미를 전달한다.</div><div class=\"lec-gr-item\">were discovered (수동태): be동사(were)+p.p.(discovered) 구조. discover는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 were discovered 형태로 쓴다. 기본구조: V + O</div><div class=\"lec-gr-item\">causing the work to take longer (분사구문): 앞선 절의 내용(문제 발견)에 대한 결과나 부연 설명을 나타낸다. 원래 절로 변환하면 and it caused the work to take longer... 가 된다.</div><div class=\"lec-gr-item\">causing the work to take longer 5형식(SVOC) 구조: cause는 타동사로 &#39;cause + O(목적어) + toV(목적보어)&#39; 구조를 취하여 &#39;목적어가 ~하게 만들다&#39;라는 의미를 형성하며, 여기서는 the work가 목적어, to take가 목적보어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unexpected</td><td class=\"m\">예기치 못한, 뜻밖의</td></tr><tr><td class=\"w\">repair</td><td class=\"m\">수리, 보수</td></tr><tr><td class=\"w\">discover</td><td class=\"m\">발견하다, 찾다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저희는 유감입니다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">regret</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분께 알리게 되어</span><span class=\"en\"><b><span class=\"grammar-hl\">to inform</span> you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">센터의 재개장이 연기되어야만 한다는 점을</span><span class=\"en\"><b>that the center’s reopening <span class=\"grammar-hl\">must be delayed</span>.</b></span></div></div><div class=\"lec-sent-ko\">저희가 센터 재개장을 연기해야 함을 알려 드리게 되어 유감입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 전기 문제로 인해 발생한 **직접적인 결과(개장 지연)**를 공식적으로 선언하고 있습니다. regret to inform you는 좋지 않은 소식을 전할 때 격식을 갖추어 미안함을 표현하는 방식입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">regret to inform (관용표현): &#39;regret + to부정사&#39; 구조로 쓰여 앞으로 하게 될 일에 대해 &#39;~하게 되어 유감이다&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">must be delayed (수동태): 조동사(must) 뒤에 be동사(be)+p.p.(delayed)가 쓰인 수동구조다. delay는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 be delayed 형태로 쓴다. 기본구조: V + O</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">regret to</td><td class=\"m\">~하게 되어 유감이다, ~함을 죄송하게 생각하다</td></tr><tr><td class=\"w\">inform</td><td class=\"m\">알리다, 통지하다</td></tr><tr><td class=\"w\">delay</td><td class=\"m\">미루다, 연기하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">센터는</span><span class=\"en\"><b>The center</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">원래 예정되어 있었습니다</span><span class=\"en\"><b><span class=\"grammar-hl\">was originally scheduled</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재개장하기로</span><span class=\"en\"><b><span class=\"grammar-hl\">to reopen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">4월 1일에</span><span class=\"en\"><b>on April 1st.</b></span></div></div><div class=\"lec-sent-ko\">센터는 원래 4월 1일에 재개장할 예정이었습니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지연된 상황을 더 명확히 설명하기 위해 **기존에 세웠던 원래 계획**을 언급하며 기준점을 제시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was originally scheduled to reopen (수동태): be동사(was)+p.p.(scheduled) 구조. schedule은 타동사로 schedule + O + toV(5형식) 구조를 취하는데, 목적어가 주어로 올라가면서 수동구조 was scheduled가 되고 뒤에 목적보어인 toV가 그대로 남은 형태다. 기본구조: schedule + O + toV</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">originally</td><td class=\"m\">원래, 처음에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이제는 재개장할 것입니다</span><span class=\"en\"><b>it will now reopen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">5월 1일에</span><span class=\"en\"><b>on May 1st</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 회원들의 안전을 보장하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to ensure</span> the safety of all members.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 이제는 모든 방문객의 안전을 보장하기 위해 5월 1일에 재개장할 것입니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 원래 계획(4월 1일)과 대조되는 **새로운 재개장 날짜(5월 1일)**를 확정하여 안내합니다. ensure the safety는 단순히 공사가 늦어지는 것이 아니라, 회원들이 안전하게 이용할 수 있는 완벽한 상태를 만들기 위해 시간이 더 필요하다는 점을 강조하여 회원들의 양해를 구하는 대목입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to ensure (to부정사): 부사적 용법 중 목적에 해당하며 &#39;~하기 위해서&#39; 또는 &#39;~를 보장하기 위해서&#39;라고 해석한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ensure</td><td class=\"m\">확실히 하다, 보장하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">저희는 여러분을 다시 뵙기를 고대합니다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">look forward to seeing</span> you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">코트 위에서</span><span class=\"en\"><b>back on the court</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">곧</span><span class=\"en\"><b>soon.</b></span></div></div><div class=\"lec-sent-ko\">저희는 코트에서 여러분을 곧 다시 뵐 수 있기를 기대합니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 재개장 이후 회원들과 다시 만나기를 바라는 마음을 전하며, **미래의 만남에 대한 긍정적인 기대감**으로 글을 마무리하려 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">look forward to seeing (관용표현): &#39;look forward to + 명사/동명사&#39; 구조로 &#39;~하기를 고대하다&#39;라는 의미이다. 여기서 to는 전치사이므로 뒤에 동명사가 온다.</div><div class=\"lec-gr-item\">seeing (동명사): 전치사 to의 목적어 역할을 하며 &#39;당신을 보는 것&#39;이라는 명사적 개념으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look forward to</td><td class=\"m\">~을 고대하다, ~을 기대하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">감사합니다</span><span class=\"en\"><b>Thank you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 인내와 이해에</span><span class=\"en\"><b>for your patience and <span class=\"grammar-hl\">understanding</span>.</b></span></div></div><div class=\"lec-sent-ko\">여러분의 인내와 이해에 감사드립니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일정이 변경되어 불편을 겪을 회원들에게 **협조를 부탁하며 정중하게 고마움**을 표하는 문장입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">understanding (동명사): 전치사 for의 목적어 역할을 하는 병렬 구조(patience and understanding)의 일부로, &#39;이해해 주는 것&#39;이라는 명사적 개념으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">patience</td><td class=\"m\">인내, 참을성</td></tr><tr><td class=\"w\">understanding</td><td class=\"m\">이해, 배려</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">진심을 담아,</span><span class=\"en\"><b><span class=\"grammar-hl\">Sincerely</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관리자</span><span class=\"en\"><b>Manager</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">탁구 센터의</span><span class=\"en\"><b>of the Table Tennis Center</b></span></div></div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 편지글을 마칠 때 사용하는 **전형적인 맺음말**로, 작성자의 직함을 다시 한번 명시하여 신뢰감을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Sincerely (관용표현): 비즈니스 서신이나 이메일 끝맺음에서 &#39;진심을 담아&#39;라는 의미로 사용되는 맺음말이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>탁구장 재개장을 준비하던 중 예상치 못한 전기 문제가 발견되었습니다.</li><li>이로 인해 당초 4월 1일이었던 재개장 일정을 한 달 뒤인 5월 1일로 연기하게 되었습니다.</li><li>일정 연기는 회원들의 안전을 최우선으로 고려한 결정임을 밝히며 양해를 구하고 있습니다.</li><li>회원들에 대한 감사와 재회에 대한 기대감을 표현하며 글을 맺습니다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The manager announced the postponement of the center&#39;s reopening to May 1st because additional time is required to address unexpected electrical issues for safety.</div>\n              <div class=\"lec-final-sum-ko\">매니저는 안전을 위한 예기치 못한 전기 문제를 해결하는 데 추가 시간이 필요하기 때문에 센터 재개장을 5월 1일로 연기한다고 알렸다.</div></div></div>"],"segs":[[{"audio":"./18_audio/1.mp3","hl":null}],[{"audio":"./18_audio/2.mp3","hl":null}],[{"audio":"./18_audio/3.mp3","hl":null},{"audio":"./18_audio/4.mp3","hl":"stage-0"},{"audio":"./18_audio/5.mp3","hl":"stage-1"},{"audio":"./18_audio/6.mp3","hl":"stage-2"},{"audio":"./18_audio/7.mp3","hl":"stage-3"},{"audio":"./18_audio/8.mp3","hl":"stage-4"}],[{"audio":"./18_audio/9.mp3","hl":null}],[{"audio":"./18_audio/10.mp3","hl":"main"},{"audio":"./18_audio/11.mp3","hl":"meaning"},{"audio":"./18_audio/12.mp3","hl":"grammar"}],[{"audio":"./18_audio/13.mp3","hl":"main"},{"audio":"./18_audio/14.mp3","hl":"meaning"},{"audio":"./18_audio/15.mp3","hl":"grammar"}],[{"audio":"./18_audio/16.mp3","hl":"main"},{"audio":"./18_audio/17.mp3","hl":"meaning"},{"audio":"./18_audio/18.mp3","hl":"grammar"}],[{"audio":"./18_audio/19.mp3","hl":"main"},{"audio":"./18_audio/20.mp3","hl":"meaning"},{"audio":"./18_audio/21.mp3","hl":"grammar"}],[{"audio":"./18_audio/22.mp3","hl":"main"},{"audio":"./18_audio/23.mp3","hl":"meaning"},{"audio":"./18_audio/24.mp3","hl":"grammar"}],[{"audio":"./18_audio/25.mp3","hl":"main"},{
