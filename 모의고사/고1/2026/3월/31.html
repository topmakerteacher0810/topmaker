cZMj1H5+nX8u/f1pNyk4yMj3GeR1Hr1xj/61AX6f10/zQ7/AD/n/P0pM84/Hp2/P3/+tyKTcOgI4B756dfqR3Gc/nS5HXI/MY/z/k9qA/r+vvDv/nn/AAx+X4nhaaGB7jv0P93r+XfsPXpldw55H5j/ABoFp/Xy/wCAKf8AP+cf/Xopu5eOQc+hH5/SjcACSRgf/X/mB/8AXpfht/w3qMXH+fy/XA6/04paTIPfoT0PoeQevTvSFh6j9OQO368UwFHOP6+2R7559/xpR7+ppoZW5BHGR1HbGfwHGenuKNwxnPGcf5/T8xQA6jp7/wCfx/z0HakyOOevIyfX/wDX0pCwGBx1x16fX05wKO/4f1/Xp1YOopMj1H50vB9/8aACmscKSDyAT+Wf50u5R3Hp1z/n8aRjhSeOASO/QHIA+gIoDy/r7/8AM//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Less is More: Why a Streamlined Play Space Matters for Kids<small>적을수록 좋다: 아이들을 위해 놀이 공간 간소화가 중요한 이유</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 더 깊이 이해하기 위해서는 선택지가 너무 많을 때 오히려 만족도가 떨어지고 불안감이 높아지는 선택의 역설(Paradox of Choice)이라는 심리학 개념을 알아두면 좋습니다. 실제로 아이들이 너무 많은 장난감에 노출되면 뇌가 처리해야 할 데이터가 너무 많아지는 정보 과부하(Information Overload) 상태에 빠져 무엇을 가지고 놀지 정하지 못하는 의사결정 피로(Decision Fatigue)를 겪게 됩니다. 마치 뷔페에 음식이 너무 많으면 무엇을 먹을지 고민하다 결국 제대로 즐기지 못하는 것과 비슷한데, 관련 연구에 따르면 장난감의 개수를 줄였을 때 아이들의 창의성(Creativity)과 놀이 집중 시간이 비약적으로 상승했다고 합니다. 따라서 장난감 환경을 정리하는 간소화(Streamlining) 과정은 단순히 방을 치우는 행위를 넘어, 아이들이 상상력(Imagination)을 온전히 발휘할 수 있는 심리적 여유 공간을 만들어주는 중요한 교육적 전략이라 할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01과도한 물건으로 인한 불안감</div><ul><li>아이들의 놀이 공간이 너무 많은 물건으로 가득 차면 아이들은 정서적으로 압도당할 수 있다.</li><li>공간을 가득 채운 물건은 아이들에게 불안감(anxiety)을 유발함</li><li>아이들은 감정을 직접 표현하지 못해도 너무 많은 물건에 압도(overwhelmed)됨</li><li>핵심 키워드: 불안감(anxiety), 압도된(overwhelmed)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02성인의 사례를 통한 비유</div><ul><li>물건이 너무 많아 선택의 어려움을 겪는 현상을 성인의 옷장 사례에 비유하여 설명한다.</li><li>옷이 가득 찬 옷장(closet)을 보며 입을 옷이 없다고 느끼는 여성의 심리</li><li>재검토(revision)는 자신이 가진 것을 파악하고 사용하도록 도움을 줌</li><li>핵심 키워드: 재검토/수정(revision), 옷장(closet)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03과잉 자극과 선택의 어려움</div><ul><li>시각적 정보와 물리적 방해물이 너무 많으면 아이들은 의사결정에 어려움을 겪는다.</li><li>볼 것과 밟고 지나갈 것이 너무 많은 과도한 자극(too much input)의 문제</li><li>정보가 너무 많으면 아이들은 선택(choice)을 하는 데 어려움을 느낌</li><li>핵심 키워드: 선택(choice), 과도한 정보 입력(too much input)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04공간 간소화의 필요성과 효과</div><ul><li>놀이 공간을 효율적으로 정리하면 아이들의 영감과 상상력을 자극할 수 있다.</li><li>놀이 공간을 간소화(streamlining)하는 과정이 매우 중요함</li><li>결정 장애(indecision) 대신 영감(inspired)과 상상력(imaginative)을 주는 환경 조성</li><li>핵심 키워드: 간소화(streamlining), 상상력(imaginative)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">anxiety</td><td class=\"m\">불안, 염려</td></tr><tr><td class=\"w\">be true for</td><td class=\"m\">~에도 해당되다, ~에도 마찬가지다</td></tr><tr><td class=\"w\">house</td><td class=\"m\">수용하다, 보관하다</td></tr><tr><td class=\"w\">overwhelmed</td><td class=\"m\">압도된, 당황한</td></tr><tr><td class=\"w\">remind A of B</td><td class=\"m\">A에게 B를 생각나게 하다</td></tr><tr><td class=\"w\">be packed full of</td><td class=\"m\">~으로 가득 차다, ~으로 꽉 들어차다</td></tr><tr><td class=\"w\">revision</td><td class=\"m\">검토, 수정, 정리</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">step over</td><td class=\"m\">~을 넘어가다, ~을 건너뛰다</td></tr><tr><td class=\"w\">have a hard time -ing</td><td class=\"m\">~하는 데 어려움을 겪다</td></tr><tr><td class=\"w\">streamline</td><td class=\"m\">능률화하다, 간소화하다</td></tr><tr><td class=\"w\">inspired</td><td class=\"m\">영감을 받은, 고무된</td></tr><tr><td class=\"w\">imaginative</td><td class=\"m\">상상력이 풍부한, 창의적인</td></tr><tr><td class=\"w\">be overcome with</td><td class=\"m\">(감정 등에) 압도당하다, 휩싸이다</td></tr><tr><td class=\"w\">indecision</td><td class=\"m\">결단력 없음, 우유부단함</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분의 집 안에 있는 다른 방들이</span><span class=\"en\"><b>Just like how other rooms in your home</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불안감을 유발할 수 있는 것과 똑같이</span><span class=\"en\"><b>can cause anxiety</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 많은 물건으로 채워졌을 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">when filled with</span> too much stuff,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마찬가지이다</span><span class=\"en\"><b><span class=\"grammar-hl\">the same is true</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이들에게도.</span><span class=\"en\"><b><span class=\"grammar-hl\">for</span> kids.</b></span></div></div><div class=\"lec-sent-ko\">여러분의 집 안에 있는 다른 방들이 너무 많은 물건으로 채워졌을 때 불안감을 유발할 수 있는 것 같이, 아이들에게도 마찬가지이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> the same is true for kids는 어른들이 어수선한 방에서 느끼는 스트레스를 아이들도 놀이 공간에서 똑같이 느낀다는 사실을 환기하며 글의 주제를 도입하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when filled with (분사구문): 접속사(when)를 명시한 과거분사 구문이다. 원래 절로 변환하면 when they(other rooms) are filled with... 형태가 된다.</div><div class=\"lec-gr-item\">the same is true for (관용표현): the same is true for (~에게도 마찬가지이다/똑같이 적용된다)라는 뜻으로 쓰이는 숙어다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">anxiety</td><td class=\"m\">불안, 염려</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 그 놀이 공간이 보관한다면</span><span class=\"en\"><b>If the play space houses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 장난감을</span><span class=\"en\"><b>every single toy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태어날 때부터 그들을 위해 구입된 하나도 빠짐없이,</span><span class=\"en\"><b><span class=\"grammar-hl\">that has ever been purchased</span> for them since birth,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이들이 자신의 감정을 표현하지 못할 수도 있지만,</span><span class=\"en\"><b>they may not be able <span class=\"grammar-hl\">to express</span> their feelings,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 압도된 감정을 느낄 수 있다</span><span class=\"en\"><b>but they can <span class=\"grammar-hl\">feel overwhelmed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 많은 물건에 의해.</span><span class=\"en\"><b>by so much stuff.</b></span></div></div><div class=\"lec-sent-ko\">만약 그 놀이 공간이 (아이들이) 태어날 때부터 그들을 위해 구입된 모든 장난감을 하나도 빠짐없이 보관한다면, 아이들이 자신의 감정을 표현하지 못할 수도 있지만, 그들은 ‘너무 많은 물건’에 의해 압도된 감정을 느낄 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> feel overwhelmed by so much stuff는 앞 문장에서 언급한 &#39;불안감&#39;의 구체적인 형태입니다. 아이들이 말로 &quot;방이 너무 지저분해서 힘들어요&quot;라고 직접 표현하지는 못하더라도, 감각적으로는 무거운 압박감과 피로를 느끼고 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that has ever been purchased (관계대명사): 주격 관계대명사 that이 선행사 every single toy를 수식하고 있다. 뒤에 동사(has been purchased)가 이어지는 불완전한 절이 온다.</div><div class=\"lec-gr-item\">has ever been purchased (수동태): be동사(been)+p.p.(purchased) 구조다. purchase는 타동사인데 뒤에 목적어가 없어서 수동구조 been purchased 형태로 쓴다. 기본구조: V + O (purchase something)</div><div class=\"lec-gr-item\">to express (to부정사): be able to 뒤에 연결되어 주어의 능력이나 가능성을 나타내는 동사구의 일부로 쓰였다.</div><div class=\"lec-gr-item\">feel overwhelmed (과거분사(형용사)): p.p. 형태인 overwhelmed가 2형식 동사 feel의 보어로 쓰여 주어(they)의 감정 상태를 설명한다. (= 압도된 느낌을 받다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">house</td><td class=\"m\">수용하다, 보관하다</td></tr><tr><td class=\"w\">overwhelmed</td><td class=\"m\">압도된, 당황한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 우리에게 상기시킨다</span><span class=\"en\"><b>This <span class=\"grammar-hl\">reminds us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여성들이 들여다보는 방식을</span><span class=\"en\"><b><span class=\"grammar-hl\">of</span> <span class=\"grammar-hl\">how women look</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신들의 옷장을</span><span class=\"en\"><b><span class=\"grammar-hl\">in their closets</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">옷으로 가득 찬</span><span class=\"en\"><b><span class=\"grammar-hl\">packed full of clothes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 생각하는 (방식을),</span><span class=\"en\"><b><span class=\"grammar-hl\">and think</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;나는 입을 것이 아무것도 없다.&quot;</span><span class=\"en\"><b>I have <span class=\"grammar-hl\">nothing to wear</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 여성들이 옷으로 가득 찬 자신들의 옷장을 들여다보고 ‘나는 입을 것이 아무것도 없다’고 생각하는 방식을 우리에게 상기시킨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> reminds us of how women look — 글쓴이는 독자들이 쉽게 공감할 수 있는 일상적인 예시를 들어, 선택지가 너무 많을 때 오히려 선택의 능력이 마비되는 역설적인 상황을 강조하며 독자의 이해를 돕습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reminds us of (관용표현): remind A of B (A에게 B를 상기시키다) 구조로 쓰였다.</div><div class=\"lec-gr-item\">how women look in their closets packed full of clothes and think (간접의문문): 의문사(how) + 주어(women) + 동사(look... and think) 어순으로, 전치사 of의 목적어 역할을 하는 명사절이다.</div><div class=\"lec-gr-item\">closets packed full of clothes (과거분사(형용사)): packed가 명사 closets를 수식하는 구조다. (= 옷으로 꽉 채워진 옷장) closets that are packed...의 축약 형태로 볼 수 있다.</div><div class=\"lec-gr-item\">nothing to wear (to부정사): to wear가 대명사 nothing을 수식하는 형용사적 용법으로 쓰였다. (= 입을 것)</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수정은 모든 사람이 ~하도록 도와준다</span><span class=\"en\"><b>Revision <span class=\"grammar-hl\">helps everyone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신이 가진 것을 보고</span><span class=\"en\"><b><span class=\"grammar-hl\">see what they have</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신이 소유한 것을 사용하도록.</span><span class=\"en\"><b><span class=\"grammar-hl\">and use what they own</span>.</b></span></div></div><div class=\"lec-sent-ko\">수정은 모든 사람이 자신이 가진 것을 보고, 자신이 소유한 것을 사용하도록 도와준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Revision은 여기서는 단순히 글을 고치는 것이 아니라, 불필요한 것을 덜어내고 재배치하는 &#39;공간의 재구성&#39; 혹은 &#39;정돈&#39;의 의미로 사용되었습니다. 앞의 문제 상황에 대한 첫 번째 해결책으로 제시되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">helps everyone see what they have and use what they own 5형식(SVOC) 구조: 동사 help + 목적어 everyone + 목적보어 see / use(동사원형) 구조다. 준사역동사 help는 목적보어로 동사원형이나 to부정사를 모두 취할 수 있다.</div><div class=\"lec-gr-item\">what they have / what they own (관계대명사): 선행사를 포함한 관계대명사 what이 이끄는 명사절로, 각각 see와 use의 목적어 역할을 한다. (~하는 것)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">revision</td><td class=\"m\">검토, 수정, 정리</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">볼 것이 너무 많고,</span><span class=\"en\"><b>When there’s too much to see,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">넘어 다녀야 할 것이 너무 많고,</span><span class=\"en\"><b>too much to step over,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 너무 많은 입력이 있을 때,</span><span class=\"en\"><b>and too much input,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이들은 어려움을 겪는다</span><span class=\"en\"><b>kids <span class=\"grammar-hl\">have a hard time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선택을 하는 데.</span><span class=\"en\"><b><span class=\"grammar-hl\">making</span> a choice.</b></span></div></div><div class=\"lec-sent-ko\">볼 것이 너무 많고, 넘어 다녀야 할 것이 너무 많고, 그리고 너무 많은 입력이 있을 때, 아이들은 선택을 하는 데 어려움을 겪는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> too much input은 시각적, 촉각적으로 쏟아지는 정보량이 아이의 뇌가 처리할 수 있는 수준을 넘어서서 판단력을 흐리게 만든다는 의미입니다. 3번 문장에서 언급한 &#39;입을 옷이 없는 현상&#39;이 아이들에게 구체적으로 어떻게 나타나는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">too much to see / too much to step over (to부정사): to see와 to step over가 각각 앞의 대명사 too much를 수식하는 형용사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">have a hard time making (관용표현): have a hard time -ing (~하는 데 어려움을 겪다)라는 숙어 표현이다.</div><div class=\"lec-gr-item\">making a choice (동명사): 관용구 have a hard time (in) -ing 구조에서 전치사의 목적어 역할을 수행하는 명사적 용법이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">step over</td><td class=\"m\">~을 넘어가다, ~을 건너뛰다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">놀이 공간을 간소화하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Streamlining a play space</span> is soimportant.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 중요하다.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">놀이 공간을 간소화하는 것은 ‘매우’ 중요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Streamlining a play space는 어수선한 요소를 제거하고 효율적으로 다듬는 과정을 말하며, 이 글이 궁극적으로 독자에게 권하는 핵심적인 행동 지침이자 결론에 해당합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Streamlining a play space (동명사): streamlining이 구의 중심이 되어 문장의 주어 역할을 하는 명사적 용법으로 쓰였다. (= 놀이 공간을 정리하는 것)</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분은 아이들이 ~하기를 바란다</span><span class=\"en\"><b>You <span class=\"grammar-hl\">want your kids</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영감을 받고 상상력을 풍부하게 느끼기를</span><span class=\"en\"><b><span class=\"grammar-hl\">to feel</span> inspired and imaginative</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 방에서</span><span class=\"en\"><b>in the room —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 망설임에 압도되지 않기를.</span><span class=\"en\"><b>not <span class=\"grammar-hl\">overcome with indecision</span>.</b></span></div></div><div class=\"lec-sent-ko\">여러분은 아이들이 그 방에서 영감을 받고 상상력을 풍부하게 느끼기를, 즉 망설임에 압도되지 ‘않기’를 바란다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> feel inspired and imaginative — 글쓴이는 정돈된 환경이 단순히 깔끔함을 유지하는 목적을 넘어, 아이들의 창의적인 사고와 자발적인 놀이를 촉진하는 토대가 된다는 점을 역설하며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">want your kids to feel 5형식(SVOC) 구조: 동사 want + 목적어 your kids + 목적보어 to feel(to부정사) 구조다. want는 목적보어로 to부정사를 취하는 동사다.</div><div class=\"lec-gr-item\">feel inspired (과거분사(형용사)): p.p. 형태인 inspired가 feel의 보어로 쓰여 목적어(your kids)의 상태를 설명한다. (= 영감을 받은)</div><div class=\"lec-gr-item\">overcome with indecision (과거분사(형용사)): p.p. 형태인 overcome이 kids의 상태를 설명하는 보어 역할을 한다. 문맥상 not (to feel) overcome...의 구조로 병렬 연결되어 있다. (= 우유부단함에 압도된)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">inspired</td><td class=\"m\">영감을 받은, 고무된</td></tr><tr><td class=\"w\">imaginative</td><td class=\"m\">상상력이 풍부한, 창의적인</td></tr><tr><td class=\"w\">indecision</td><td class=\"m\">결단력 없음, 우유부단함</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>물건이 너무 많은 환경은 어른뿐 아니라 아이들에게도 불안감을 유발한다.</li><li>장난감이 너무 많으면 아이들은 선택의 어려움을 느끼고 심리적으로 압도당한다.</li><li>이는 옷이 많아도 입을 게 없다고 느끼는 어른들의 심리와 유사한 현상이다.</li><li>놀이 공간을 정돈하고 간소화해야 아이들이 창의력과 상상력을 발휘할 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Overcrowded play spaces should be streamlined because excessive toys cause children to feel overwhelmed and struggle with making choices.</div>\n              <div class=\"lec-final-sum-ko\">과도한 장난감은 아이들에게 심적 부담을 주고 선택을 어렵게 하므로, 지나치게 복잡한 놀이 공간은 간소화되어야 한다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_31번_강의_audio/15.mp3","hl":"main"
