+c546fgeaMj1Hfv6HB/AZx7HrzSbhxyOp7g8DOe/A//AFGgBSMjHQf4Eeh46Uo59vrTQwbJB49fUDv/AJ/HrRvUAnI4JHXqR/j/AJ6UAOopu5cA5HfHfkcHpnkdD6dKNyqByAO3+fr+tAf0x1Hf/wCt/n/OfwQkD8env9PX8KTcvPPQjuPX65x+nXrQH9fl+XUdSNwpPoCfy59D/KjKnuDnI6/n+XcUjcKx9FPbPQenf6UAf//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Scientific Progress as a Paradigm Shift in Worldview<small>세계관의 패러다임 전환으로서의 과학적 진보</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">과학 철학자 토마스 쿤(Thomas Kuhn)은 저서 ‘과학 혁명의 구조’에서 패러다임(Paradigm)이라는 개념을 통해 과학이 단순히 지식을 차곡차곡 쌓아가는 선형적인 과정이 아님을 역설했습니다. 여기서 패러다임(Paradigm)이란 특정 시대의 과학자들이 공유하는 공통된 신념이나 이론적 틀을 의미하는데, 마치 우리가 어떤 색깔의 안경을 쓰느냐에 따라 세상이 다르게 보이는 것과 비슷한 원리라고 이해하시면 쉽습니다. 기존의 틀로 설명되지 않는 현상들이 쌓이다 보면 관점 자체가 통째로 바뀌는 패러다임 전환(Paradigm Shift)이 일어나며, 이는 단순히 더 ‘정확한’ 상태로 가는 것이 아니라 세상을 해석하는 근본적인 방식(Way of seeing)이 달라지는 수평적 이동을 뜻합니다. 결과적으로 모든 과학적 관찰은 관찰자가 미리 가진 지식이나 도구의 특성에 의존하는 이론 의존성(Theory-ladenness)을 띠게 되므로, 동일한 사물을 보더라도 어떤 패러다임 안에 있느냐에 따라 전혀 다른 세계를 경험하게 되는 것입니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01패러다임의 개념</div><ul><li>세상을 향한 우리의 명제들은 패러다임이라는 틀 안에 깊이 뿌리박혀 있다.</li><li>패러다임은 이론, 대상에 대한 개념, 방법론적 관행이 상호 연결된 망임</li><li>핵심 키워드: 패러다임(paradigms)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02패러다임 기반의 연구</div><ul><li>모든 과학적 연구와 정밀한 측정은 특정 패러다임 안에서만 의미를 갖는다.</li><li>과학자는 특정한 패러다임 내부(within a specific paradigm)에서 연구를 수행함</li><li>가장 정밀한 측정(measurements)조차 해당 패러다임 안에서만 합리적임</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03이해를 위한 전제 조건</div><ul><li>도구를 사용하는 관찰 행위조차 해당 패러다임의 사전 정보 없이는 불가능하다.</li><li>현미경(microscope)을 통한 관찰은 도구의 본질과 관찰 대상에 대한 지식을 전제로 함</li><li>사전 정보가 없다면 관찰 결과는 아무런 의미를 전달하지 못함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04과학적 진보의 본질</div><ul><li>과학의 중대한 발전은 정확도의 향상이 아니라 세상을 보는 방식의 수평적 이동이다.</li><li>진보는 수직적 발전이 아닌 패러다임 간의 수평적 이동(horizontal shift)임</li><li>새로운 패러다임을 가진 과학자는 이전과는 다르게 세상을 봄(sees differently)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">propose</td><td class=\"m\">제안하다, 제시하다</td></tr><tr><td class=\"w\">proposition</td><td class=\"m\">주장, 명제, 제의</td></tr><tr><td class=\"w\">embed</td><td class=\"m\">끼워 넣다, 박아 넣다, 깊숙이 박다</td></tr><tr><td class=\"w\">paradigm</td><td class=\"m\">패러다임, 전형적인 틀, 방식</td></tr><tr><td class=\"w\">interrelated</td><td class=\"m\">서로 밀접한 관련이 있는</td></tr><tr><td class=\"w\">commitment</td><td class=\"m\">약속, 헌신, 전념, 책무</td></tr><tr><td class=\"w\">conception</td><td class=\"m\">개념, 생각, 이해</td></tr><tr><td class=\"w\">subject matter</td><td class=\"m\">주제, 소재</td></tr><tr><td class=\"w\">methodological</td><td class=\"m\">방법론적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">undertake</td><td class=\"m\">착수하다, 수행하다, 떠맡다</td></tr><tr><td class=\"w\">exacting</td><td class=\"m\">정밀한, 까다로운, 엄격한</td></tr><tr><td class=\"w\">sensible</td><td class=\"m\">합리적인, 이해할 수 있는, 유의미한</td></tr><tr><td class=\"w\">look into</td><td class=\"m\">~을 조사하다, 들여다보다</td></tr><tr><td class=\"w\">be informed about</td><td class=\"m\">~에 대해 알고 있다, 지식이 있다</td></tr><tr><td class=\"w\">be supposed to</td><td class=\"m\">~하기로 되어 있다, ~해야 한다</td></tr><tr><td class=\"w\">look at</td><td class=\"m\">~을 보다, 관찰하다</td></tr><tr><td class=\"w\">horizontal</td><td class=\"m\">수평적인</td></tr><tr><td class=\"w\">shift</td><td class=\"m\">변화, 이동, 전환</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Kuhn이 제안했듯이,</span><span class=\"en\"><b>As Kuhn proposed,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상에 대한 우리의 명제는</span><span class=\"en\"><b>our propositions about the world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">깊이 박혀 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are embedded</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">패러다임 안에,</span><span class=\"en\"><b>within paradigms,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대략 하나의 네트워크인</span><span class=\"en\"><b>roughly a network</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상호 연관된 약속들의</span><span class=\"en\"><b>of <span class=\"grammar-hl\">interrelated commitments</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정 이론, 주제에 대한 개념,</span><span class=\"en\"><b>to a particular theory, a conception of a subject matter,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 방법론적 관행에 대한.</span><span class=\"en\"><b>and methodological practices.</b></span></div></div><div class=\"lec-sent-ko\">Kuhn이 제안했듯이, 세상에 대한 우리의 명제는 ‘패러다임,’ 즉 특정 이론, 주제에 대한 개념, 그리고 방법론적 관행에 대하여 대략 네트워크화된 상호 연관된 약속 안에 깊이 박혀 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 핵심 소재인 &#39;패러다임&#39;을 정의하며 논의를 시작합니다. embedded within paradigms는 우리가 과학적 주장을 할 때 아무런 기초 없이 하는 것이 아니라, 이미 그 사회나 학계가 합의한 틀 안에서만 사고하게 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are embedded (수동태): be동사(are) + p.p.(embedded) 구조. embed는 타동사인데 뒤에 목적어가 없어서 수동구조 are embedded 형태로 쓴다. 기본구조: V + O + within/in B (A를 B안에 끼워 넣다/심다)</div><div class=\"lec-gr-item\">interrelated commitments (과거분사(형용사)): interrelated가 명사인 commitments를 앞에서 수식(= &#39;상호 연관된 약속/전제&#39;). commitments that are interrelated와 같은 축약 관계절 구조로 이해할 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">propose</td><td class=\"m\">제안하다, 제시하다</td></tr><tr><td class=\"w\">proposition</td><td class=\"m\">주장, 명제, 제의</td></tr><tr><td class=\"w\">embed</td><td class=\"m\">끼워 넣다, 박아 넣다, 깊숙이 박다</td></tr><tr><td class=\"w\">paradigm</td><td class=\"m\">패러다임, 전형적인 틀, 방식</td></tr><tr><td class=\"w\">interrelated</td><td class=\"m\">서로 밀접한 관련이 있는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">commitment</td><td class=\"m\">약속, 헌신, 전념, 책무</td></tr><tr><td class=\"w\">conception</td><td class=\"m\">개념, 생각, 이해</td></tr><tr><td class=\"w\">subject matter</td><td class=\"m\">주제, 소재</td></tr><tr><td class=\"w\">methodological</td><td class=\"m\">방법론적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">따라서,</span><span class=\"en\"><b>Thus,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학자들이 연구를 수행할 때,</span><span class=\"en\"><b>when scientists undertake research,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 그렇게 한다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">do so</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정한 패러다임 안에서.</span><span class=\"en\"><b>from within a specific paradigm.</b></span></div></div><div class=\"lec-sent-ko\">따라서 과학자들이 연구를 수행할 때, 그들은 하나의 특정한 패러다임 안에서 그렇게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 원리를 과학자의 실제 연구 상황에 적용한 결과입니다. do so from within은 과학자가 관찰이나 실험을 할 때 자신의 주관이나 순수한 눈으로 보는 것이 아니라, 자기가 배운 이론적 틀이라는 안경을 쓰고 세상을 본다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">do so (대동사): 앞의 일반동사구인 undertake research의 반복을 피하기 위해 쓰인 표현이다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">paradigm</td><td class=\"m\">패러다임, 전형적인 틀, 방식</td></tr><tr><td class=\"w\">undertake</td><td class=\"m\">착수하다, 수행하다, 떠맡다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 엄밀한 측정조차</span><span class=\"en\"><b>Even the most <span class=\"grammar-hl\">exacting measurements</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 사리에 맞는다</span><span class=\"en\"><b>are only sensible</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 패러다임 안에서만.</span><span class=\"en\"><b>from within that paradigm.</b></span></div></div><div class=\"lec-sent-ko\">가장 엄밀한 측정조차 오직 그 패러다임 안에서만 사리에 맞는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 패러다임의 영향력이 객관적인 수치에까지 미친다는 점을 강조합니다. only sensible은 실험을 통해 얻은 아주 정확한 숫자라 할지라도, 그 숫자가 무엇을 뜻하는지는 그들이 믿고 있는 패러다임의 규칙을 적용해야만 비로소 해석이 가능하다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">exacting measurements (현재분사(형용사)): -ing 형태인 exacting이 뒤의 명사 measurements의 성질을 설명하며 수식한다(= &#39;엄격한 측정&#39;).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">paradigm</td><td class=\"m\">패러다임, 전형적인 틀, 방식</td></tr><tr><td class=\"w\">exacting</td><td class=\"m\">정밀한, 까다로운, 엄격한</td></tr><tr><td class=\"w\">sensible</td><td class=\"m\">합리적인, 이해할 수 있는, 유의미한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현미경을 들여다보는 것은</span><span class=\"en\"><b>a look into a microscope</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분에게 아무것도 알려 주지 않는다</span><span class=\"en\"><b>tells you nothing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 이미 알고 있지 않다면</span><span class=\"en\"><b>unless you are already informed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 도구의 성격에 대해</span><span class=\"en\"><b>about the nature of the instrument</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 여러분이 무엇을 보아야 하는지에 대해.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">what you are supposed to be looking at</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 현미경을 들여다보는 것은, 그 도구의 성격과 여러분이 무엇을 보아야 하는지에 대해 이미 알고 있지 않다면, 여러분에게 아무것도 알려 주지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 말한 &#39;측정의 해석&#39;에 대한 구체적인 예시입니다. informed about the nature... and what you are supposed to be looking at은 현미경 렌즈에 맺힌 상이 세포인지 먼지인지 구별하기 위해서는 이미 이론적 지식(패러다임)이 머릿속에 들어있어야 한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are informed (수동태): be동사(are) + p.p.(informed) 구조. inform은 타동사인데 뒤에 목적어가 없어서 수동구조 are informed 형태로 쓴다. 기본구조: inform + O + about B (A에게 B에 대해 알리다)</div><div class=\"lec-gr-item\">be supposed to (관용표현): be supposed to + 동사원형 구조로 &#39;~하기로 되어 있다&#39; 또는 &#39;~해야 한다&#39;는 의무나 예정을 나타낸다.</div><div class=\"lec-gr-item\">to be looking (to부정사): be supposed to 다음에 이어지는 동사원형의 역할을 하며, be + -ing(진행형)와 결합하여 &#39;보고 있는 중이어야 한다&#39;는 진행의 의미를 더한다.</div><div class=\"lec-gr-item\">what you are supposed to be looking at (간접의문문): 의문사(what) + 주어(you) + 동사(are ~) 어순으로 쓰여 &#39;~을 보고 있어야 하는지&#39;라는 의미의 명사절 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look into</td><td class=\"m\">~을 조사하다, 들여다보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">따라서,</span><span class=\"en\"><b>Thus,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 과학에서의 주요한 진보라고 부르는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">what we call major progress</span> in science</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이동이 아니다</span><span class=\"en\"><b>is not a movement</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">덜 정확한 패러다임에서 더 정확한 패러다임으로의.</span><span class=\"en\"><b>from a less to a more accurate paradigm.</b></span></div></div><div class=\"lec-sent-ko\">따라서 우리가 과학에서 주요한 진보라고 부르는 것은 덜 정확한 패러다임에서 더 정확한 패러다임으로의 이동이 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과학의 발전에 대한 일반적인 통념을 뒤집는 문장입니다. not a movement from a less to a more accurate는 과학이 시간이 흐르며 절대적인 진리에 점점 가까워지는 계단을 오르는 과정이라는 생각을 부정하는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what we call major progress 5형식(SVOC) 구조: call + 목적어 + 목적보어(major progress) 구조에서 목적어 역할을 하는 관계대명사 what이 앞으로 나간 형태다. &#39;~를 주요한 진보라고 부르는 것&#39;으로 해석된다.</div><div class=\"lec-gr-item\">what we call (관계대명사): 선행사를 포함한 관계대명사 what이 이끄는 절이 문장의 주어 역할을 하는 명사절이다. call의 목적어가 빠진 불완전한 절이 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">paradigm</td><td class=\"m\">패러다임, 전형적인 틀, 방식</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오히려,</span><span class=\"en\"><b>Rather,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 수평적 전환이다</span><span class=\"en\"><b>it is a horizontal shift</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 ‘세상을 바라보는 방식’에서</span><span class=\"en\"><b>from one ‘way of <span class=\"grammar-hl\">seeing</span> the world’</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 방식으로의.</span><span class=\"en\"><b>to another.</b></span></div></div><div class=\"lec-sent-ko\">오히려, 그것은 하나의 ‘세상을 바라보는 방식’에서 다른 방식으로의 수평적 전환이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 부정한 통념 대신 글쓴이가 주장하는 진정한 과학 발전을 설명합니다. horizontal shift는 과학의 변화가 위아래(수직적)로 더 우월해지는 것이 아니라, 기존과는 완전히 다른 새로운 관점(수평적)으로 갈아타는 것임을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">seeing (동명사): 전치사 of의 목적어로 쓰여 &#39;보는 것&#39;이라는 행위의 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">horizontal</td><td class=\"m\">수평적인</td></tr><tr><td class=\"w\">shift</td><td class=\"m\">변화, 이동, 전환</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Kuhn에게 있어서,</span><span class=\"en\"><b>For Kuhn,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘과학자는</span><span class=\"en\"><b>‘the scientist</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 패러다임을 지닌</span><span class=\"en\"><b>with a new paradigm</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다르게 본다</span><span class=\"en\"><b>sees differently</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신이 이전에 보았던 방식과는.’</span><span class=\"en\"><b>from <span class=\"grammar-hl\">the way</span> he had seen before.’</b></span></div></div><div class=\"lec-sent-ko\">Kuhn에게 있어서, ‘새로운 패러다임을 지닌 과학자는 자신이 이전에 보아 왔던 방식과는 다르게 본다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 쿤의 견해를 인용하며 글을 마무리합니다. sees differently는 단순히 새로운 사실을 더 알아내는 수준을 넘어, 패러다임이 바뀌면 과학자가 마주하는 세상 자체가 완전히 다른 모습으로 재구성된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the way (관계부사): the way 뒤에 관계부사 how 또는 대용어 that/in which가 생략된 구조로, 뒤의 절(he had seen before)이 앞의 선행사 the way를 수식한다. 영어에서는 the way와 how를 동시에 쓰지 않는다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">paradigm</td><td class=\"m\">패러다임, 전형적인 틀, 방식</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과학적 주장과 연구는 모두 &#39;패러다임&#39;이라는 기존의 이론적 틀 안에서 이루어진다.</li><li>아주 정밀한 측정값조차 패러다임의 해석 없이는 아무런 의미를 갖지 못한다.</li><li>과학의 발전은 절대적 진리에 가까워지는 수직적 과정이 아니다.</li><li>과학의 발전은 세상을 바라보는 관점 자체가 완전히 바뀌는 수평적 이동이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Scientific research is inevitably conducted within a specific paradigm, so major progress involves a horizontal shift from one way of seeing to another.</div>\n              <div class=\"lec-final-sum-ko\">과학 연구는 필연적으로 특정 패러다임 내에서 수행되므로, 주요한 진보는 보는 방식의 한 형태에서 다른 형태로의 수평적 이동을 수반한다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_38번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026
