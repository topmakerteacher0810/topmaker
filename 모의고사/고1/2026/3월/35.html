lls) 수</li><li>핵심 키워드: 안정적인 양(stable quantity)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02설정값과 뇌 신호</div><ul><li>지방세포가 줄어들면 설정값이 뇌에 식욕 신호를 전달한다.</li><li>세포가 얇아질 때 뇌(brain)로 보내는 메시지(message)</li><li>더 많이 먹어야 한다는 생리적 자극(trigger)</li><li>핵심 키워드: 설정값(set point)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03개인차와 다이어트</div><ul><li>지방세포 수와 설정값에 따라 다이어트의 난이도가 달라진다.</li><li>신호의 강도(strength)에 영향을 미치는 세포의 수</li><li>높은 설정값으로 인한 강한 음식 욕구(desire for food)</li><li>핵심 키워드: 생리적 투쟁(battle)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">set point theory</td><td class=\"m\">설정값 이론, 체중 조절 이론</td></tr><tr><td class=\"w\">concept</td><td class=\"m\">개념, 생각</td></tr><tr><td class=\"w\">stable</td><td class=\"m\">안정된, 일정한</td></tr><tr><td class=\"w\">quantity</td><td class=\"m\">양, 수량</td></tr><tr><td class=\"w\">fat cell</td><td class=\"m\">지방 세포</td></tr><tr><td class=\"w\">childhood</td><td class=\"m\">어린 시절, 유년기</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">set point</td><td class=\"m\">설정값, 기준점</td></tr><tr><td class=\"w\">trigger</td><td class=\"m\">유발 요인, 계기</td></tr><tr><td class=\"w\">be affected by</td><td class=\"m\">~에 영향을 받다</td></tr><tr><td class=\"w\">battle with</td><td class=\"m\">~와 싸우다, ~로 고군분투하다</td></tr><tr><td class=\"w\">desire</td><td class=\"m\">욕구, 갈망</td></tr><tr><td class=\"w\">diet</td><td class=\"m\">다이어트를 하다, 식단을 조절하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">‘설정점 이론’ 개념은 ~이다</span><span class=\"en\"><b>The “set point theory” concept <span class=\"grammar-hl\">is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 신체가 안정적인 수량의 지방 세포를 가진다는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> your body has a stable quantity of fat cells</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 성인이 될 때쯤이면</span><span class=\"en\"><b><span class=\"grammar-hl\">by the time</span> you are an adult.</b></span></div></div><div class=\"lec-sent-ko\">‘설정점 이론’ 개념은 여러분이 성인이 될 때쯤이면 여러분의 신체가 안정적인 수량의 지방 세포를 가진다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 이 글의 핵심 소재인 &#39;설정점 이론&#39;을 정의하며 시작합니다. stable quantity of fat cells는 성인이 된 이후에는 지방 세포의 전체 개수가 크게 늘어나거나 줄어들지 않고 일정하게 유지된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is that (명사절(보어)): 접속사 that이 이끄는 절이 be동사(is) 뒤에서 주격 보어 역할을 하며, 뒤에는 주어(your body)와 동사(has)를 갖춘 완전한 절이 온다.</div><div class=\"lec-gr-item\">by the time (관용표현): &#39;~할 무렵에/~할 때쯤에&#39;라는 의미로 시간을 나타내는 접속사 역할을 하여 뒤에 주어+동사의 절을 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">set point theory</td><td class=\"m\">설정값 이론, 체중 조절 이론</td></tr><tr><td class=\"w\">concept</td><td class=\"m\">개념, 생각</td></tr><tr><td class=\"w\">stable</td><td class=\"m\">안정된, 일정한</td></tr><tr><td class=\"w\">quantity</td><td class=\"m\">양, 수량</td></tr><tr><td class=\"w\">fat cell</td><td class=\"m\">지방 세포</td></tr><tr><td class=\"w\">set point</td><td class=\"m\">설정값, 기준점</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분이 체중이 더 많이 나갈수록</span><span class=\"en\"><b>The more weight you carried</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어린 시절과 십 대 시절에</span><span class=\"en\"><b>in your childhood and your teenage years,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 지방 세포를 가질 것이다</span><span class=\"en\"><b>the more fat cells you will have</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">성인으로서</span><span class=\"en\"><b>as an adult.</b></span></div></div><div class=\"lec-sent-ko\">어린 시절과 십 대 시절에 여러분이 체중이 더 많이 나갈수록, 성인으로서 더 많은 지방 세포를 가질 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;지방 세포의 수&#39;가 언제 결정되는지 그 원인을 설명합니다. The more weight you carried는 어린 시절의 비만 정도가 성인기 체질의 기초가 되는 지방 세포의 총량을 결정짓는다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The more weight you carried ..., the more fat cells you will have (관용표현): &#39;the + 비교급, the + 비교급&#39; 구문으로 &#39;~하면 할수록 더 …하다&#39;라는 인과관계를 나타내는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fat cell</td><td class=\"m\">지방 세포</td></tr><tr><td class=\"w\">childhood</td><td class=\"m\">어린 시절, 유년기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 지방 세포는 그 후 ‘더 가득 차거나’ ‘더 얇아지게’ 된다</span><span class=\"en\"><b>These fat cells then become “fuller” or “thinner”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 살이 찌거나 빠짐에 따라</span><span class=\"en\"><b><span class=\"grammar-hl\">as you gain and lose weight</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">성인으로서</span><span class=\"en\"><b>as an adult.</b></span></div></div><div class=\"lec-sent-ko\">그 후 여러분이 성인으로서 살이 찌거나 빠짐에 따라 이 지방 세포는 ‘더 가득 차거나’ ‘더 얇아지게’ 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 성인이 된 후의 체중 변화 원리를 설명합니다. 앞 문장과 연결하여, 성인기에는 세포의 수가 변하는 것이 아니라 become “fuller” or “thinner”, 즉 이미 정해진 세포 하나하나의 크기가 커지거나 작아지면서 살이 찌고 빠진다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">gain and lose weight 병렬 구조: 접속사 and에 의해 두 타동사 gain과 lose가 연결되어 공통의 목적어 weight를 취하고 있다.</div><div class=\"lec-gr-item\">as you gain and lose weight (부사절): 접속사 as가 시간이나 비례(~함에 따라)의 의미를 나타내는 부사절을 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fat cell</td><td class=\"m\">지방 세포</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">설정점은 이 세포 안의 방아쇠이다</span><span class=\"en\"><b>The set point is the trigger in these cells</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">메시지를 보낼</span><span class=\"en\"><b><span class=\"grammar-hl\">that will send</span> a message</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 뇌에</span><span class=\"en\"><b>to your brain</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 지방 세포가 너무 얇아지고 있다고 말하는</span><span class=\"en\"><b><span class=\"grammar-hl\">saying</span> <span class=\"grammar-hl\">that your fat cells are getting too thin</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 여러분이 더 많이 먹어야 한다고</span><span class=\"en\"><b>and that you must eat more.</b></span></div></div><div class=\"lec-sent-ko\">설정점은 여러분의 지방 세포가 너무 얇아지고 있고 여러분이 더 많이 먹어야 한다고 말하는 메시지를 뇌에 보낼 이 세포 안의 방아쇠이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 설정점이 구체적으로 어떻게 작동하는지 메커니즘을 밝힙니다. The set point is the trigger는 우리 몸이 일정 수준의 지방을 유지하려는 항상성을 가지고 있어서, 다이어트 등으로 세포 크기가 줄어들면 뇌에 강력한 배고픔 신호를 보낸다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that will send (관계대명사): 주격 관계대명사 that이 선행사 the trigger를 수식하며, 뒤에 주어가 빠진 불완전한 절이 이어진다.</div><div class=\"lec-gr-item\">saying (현재분사(형용사)): 현재분사 saying이 앞의 명사 a message를 수식(= &quot;~라고 말하는 메시지&quot;)하며, &#39;a message which is saying&#39;에서 관계대명사와 be동사가 축약된 형태로 볼 수 있다.</div><div class=\"lec-gr-item\">that your fat cells are getting too thin (명사절(목적어)): 접속사 that이 이끄는 절이 분사(saying)의 목적어 역할을 하며 뒤에 완전한 문장이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fat cell</td><td class=\"m\">지방 세포</td></tr><tr><td class=\"w\">set point</td><td class=\"m\">설정값, 기준점</td></tr><tr><td class=\"w\">trigger</td><td class=\"m\">유발 요인, 계기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">서로 다른 사람들의 지방 세포는 서로 다른 설정점을 가질 것이며</span><span class=\"en\"><b>Different people’s fat cells will have different set points,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 메시지의 강도는 영향을 받는다</span><span class=\"en\"><b>and the strength of the message <span class=\"grammar-hl\">is affected</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세포의 수에 의해</span><span class=\"en\"><b>by the number of cells.</b></span></div></div><div class=\"lec-sent-ko\">서로 다른 사람들의 지방 세포는 서로 다른 설정점을 가질 것이며, 메시지의 강도는 세포의 수에 의해 영향을 받는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 설정점이 사람마다 다른 이유와 그 차이가 가져오는 결과를 설명합니다. strength of the message is affected by는 지방 세포의 개수가 많을수록 뇌로 전달되는 &#39;먹으라&#39;는 신호의 총합이 훨씬 더 커진다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is affected (수동태): be동사(is)+p.p.(affected) 구조. affect는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is affected 형태로 쓴다. 기본구조: affect + O(목적어)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fat cell</td><td class=\"m\">지방 세포</td></tr><tr><td class=\"w\">set point</td><td class=\"m\">설정값, 기준점</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">따라서 한 사람은</span><span class=\"en\"><b>Thus a person</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 지방 세포와 높은 설정점을 가진</span><span class=\"en\"><b>with lots of fat cells and a high set point</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">싸울 것이다</span><span class=\"en\"><b>will battle</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식에 대한 강한 욕구와</span><span class=\"en\"><b>with a strong desire for food</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다이어트를 하고 있을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when dieting</span>.</b></span></div></div><div class=\"lec-sent-ko\">따라서 많은 지방 세포와 높은 설정점을 가진 사람은 다이어트를 하고 있을 때 음식에 대한 강한 욕구와 싸울 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 논리들을 바탕으로 내린 최종 결론입니다. battle with a strong desire는 어릴 때 형성된 많은 지방 세포 때문에 남들보다 훨씬 더 참기 힘든 본능적인 허기를 느끼게 되어 체중 감량이 매우 고통스럽고 어렵다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">when dieting (분사구문): 접속사 when 뒤에 현재분사 dieting이 쓰인 형태이다. 원래 절로 변환하면 when they are dieting이 된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fat cell</td><td class=\"m\">지방 세포</td></tr><tr><td class=\"w\">set point</td><td class=\"m\">설정값, 기준점</td></tr><tr><td class=\"w\">battle with</td><td class=\"m\">~와 싸우다, ~로 고군분투하다</td></tr><tr><td class=\"w\">desire</td><td class=\"m\">욕구, 갈망</td></tr><tr><td class=\"w\">diet</td><td class=\"m\">다이어트를 하다, 식단을 조절하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>설정점 이론에 따르면 성인의 지방 세포 수는 어린 시절의 체중 상태에 의해 결정되어 일정하게 유지된다.</li><li>성인이 되어 살이 찌거나 빠지는 것은 세포의 수가 변하는 것이 아니라 세포의 크기가 변하는 것이다.</li><li>몸은 정해진 지방 수준을 유지하려 하며, 세포가 작아지면 뇌에 음식을 먹으라는 신호를 보낸다.</li><li>지방 세포 수가 많고 설정점이 높은 사람은 다이어트 시 남들보다 훨씬 강력한 허기를 느끼게 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Set point theory suggests that a higher number of fat cells increases the intensity of hunger signals, thereby making it significantly harder for certain individuals to maintain a diet.</div>\n              <div class=\"lec-final-sum-ko\">설정점 이론은 더 많은 수의 지방 세포가 배고픔 신호의 강도를 높임으로써 특정 개인들이 다이어트를 유지하는 것을 상당히 더 어렵게 만든다는 점을 시사한다.</div></div></div>"],"segs":[[{"audio":"./35_audio/1.mp3","hl":null}],[{"audio":"./35_audio/2.mp3","hl":null}],[{"audio":"./35_audio/3.mp3","hl":null},{"audio":"./35_audio/4.mp3","hl":"stage-0"},{"audio":"./35_audio/5.mp3","hl":"stage-1"},{"audio":"./35_audio/6.mp3","hl":"stage-2"}],[{"audio":"./35_audio/7.mp3","hl":null}],[{"audio":"./35_audio/8.mp3","hl":"main"},{"audio":"./35_audio/9.mp3","hl":"meaning"},{"audio":"./35_audio/10.mp3","hl":"grammar"}],[{"audio":"./35_audio/11.mp3","hl":"main"},{"audio":"./35_audio/12.mp3","hl":"meaning"},{"audio":"./35_audio/13.mp3","hl":"grammar"}],[{"audio":"./35_audio/14.mp3","hl":"main"},{"audio":"./35_audio/15.mp3","hl":"meaning"},{"audio":"./35_audio/16.mp3","hl":"grammar"}],[{"audio":"./35_audio/17.mp3","hl":"main"},{"audio":"./35_audio/18.mp3","hl":"meaning"},{"audio":"./35_audio/19.mp3","hl":"grammar"}],[{"audio":"./35_audio/20.mp3","hl":"main"},{"audio":"./35_audio/21.mp3","hl":"meaning"},{"audio":"./35_audio/22.mp3","hl":"grammar"}],[{"audio":"./35_audio/23.mp3","hl":"main"},{"audio":"./35_audio/24.mp3","hl":"meaning"},{"audio":"./35_audio/25.mp3","hl":"grammar"}],[{"audio":"./35_audio/26.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl
