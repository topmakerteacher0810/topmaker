bvUkjI4znOP4ev5fp3xRvXn5hgY5yO+P8aA9R1Jxn9P/rD/ADzx6UBlOORyCRyOcdfy7+lGR6j86AF/z/n/ACaQ4/8Are/X+nf+tJkeoxzjtjbw3pjHv0PPoAuR6j8x/ntQH9feHJHp/n3/AKgGlHv7/wCeKaHBGRzyRwQTx179u47fTmkLr6jBGeo5B+p/z064FAD6P8/5zTQy5wDngkcjPXkdc8d/TjNLkdcj86L99AFpPy9/w69/845z2AQeR3oyOcEfgR/noP0oAXP8s+/5UjdD9Ce3p/8AX7UgIYcEHOQDkdRn+Xp1Hfmms3ylhxlTjjOcAn3zxkgY7HqKPQD/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Evolution of &quot;Less is More&quot;: From Poetic Ideal to Digital Minimalism<small>&#39;적을수록 좋다&#39;의 진화: 시적 이상에서 디지털 미니멀리즘까지</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 이해하기 위해서는 디자인과 철학의 핵심 원칙인 미니멀리즘(Minimalism)에 대해 알면 좋은데요, 이는 불필요한 요소를 제거하고 본질에만 집중할 때 비로소 심미성(Aesthetics)과 효율성이 극대화된다는 개념입니다. 특히 IT 기기의 발전 과정에서는 선택지가 많을수록 사용자의 결정 시간이 길어진다는 힉의 법칙(Hick’s Law)을 바탕으로, 복잡한 물리적 버튼을 줄이고 소프트웨어 내부로 기능을 숨기는 전략을 취해왔습니다. 마치 과거 리모컨의 수많은 버튼이 오늘날 스마트폰의 깔끔한 화면 하나로 통합된 것처럼, 기술적 소형화(Miniaturization)는 단순히 크기를 줄이는 것을 넘어 복잡함을 보이지 않는 레이어 뒤로 이동시키는 과정을 포함합니다. 결과적으로 ‘적을수록 좋다’는 말은 현대의 사용자 경험(User Experience) 설계에서 단순함이 곧 최고의 정교함이라는 것을 보여주는 중요한 지침이 되었습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문구의 기원과 본래 의미</div><ul><li>&#39;적을수록 좋다&#39;는 표현은 단순함이 복잡함보다 낫다는 의미에서 시작되었다.</li><li>로버트 브라우닝(Robert Browning)의 시에서 처음 언급됨</li><li>단순한 것(simple)이 복잡하고 뒤엉킨 것(complex and tangled)보다 더 아름다움</li><li>핵심 키워드: 적을수록 좋다(less is more)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02현대적 확산과 습관의 변화</div><ul><li>이 문구는 현대에 매우 빈번하게 사용되며 우리 일상의 습관을 서서히 변화시키고 있다.</li><li>오늘날(nowadays) 일상에서 매우 자주 들리는 표현임</li><li>우리 사고방식 속에 자리 잡아 특정 습관(habits)을 사라지게 만듦</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03하드웨어의 소형화 과정</div><ul><li>과거의 무거운 기기들이 불필요한 요소를 제거하며 현대의 휴대용 기기로 진화했다.</li><li>예시: 과거의 크고 무거운 라디오 수신기(radio receivers)</li><li>여분의 버튼(extra buttons)들이 점진적으로 제거됨</li><li>기기가 주머니 속의 전화기(phones) 형태로 축소됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04기능의 디지털 인터페이스화</div><ul><li>물리적인 크기는 작아졌지만, 버튼의 기능은 소프트웨어 내부의 층위로 숨겨지게 되었다.</li><li>물체의 규모(scale)가 더 작아짐</li><li>버튼의 기능이 점 세 개 메뉴나 다층 구조의 폴더(multilayered folders) 속으로 들어감</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">initially</td><td class=\"m\">처음에, 시초에</td></tr><tr><td class=\"w\">catchphrase</td><td class=\"m\">이목을 끄는 문구, 표어, 유행어</td></tr><tr><td class=\"w\">tangled</td><td class=\"m\">뒤얽힌, 복잡한</td></tr><tr><td class=\"w\">lie behind</td><td class=\"m\">~의 배후에 있다, ~의 원인이 되다</td></tr><tr><td class=\"w\">extinguish</td><td class=\"m\">없애다, 끝내다, (불을) 끄다</td></tr><tr><td class=\"w\">massive</td><td class=\"m\">거대한, 육중한, 엄청난</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">back in the day</td><td class=\"m\">예전에, 그 당시에</td></tr><tr><td class=\"w\">over time</td><td class=\"m\">시간이 흐르면서, 서서히</td></tr><tr><td class=\"w\">be viewed as</td><td class=\"m\">~로 여겨지다, ~로 간주되다</td></tr><tr><td class=\"w\">reduction</td><td class=\"m\">축소, 삭감, 감소</td></tr><tr><td class=\"w\">scale</td><td class=\"m\">규모, 범위, 크기</td></tr><tr><td class=\"w\">multilayered</td><td class=\"m\">다층적인, 여러 층의, 복잡한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">처음에</span><span class=\"en\"><b><span class=\"grammar-hl\">Initially</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘더 적은 것이 더 많은 것이다’라는 문구는</span><span class=\"en\"><b><span class=\"grammar-hl\">the catchphrase “less is more”</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단순한 의미를 가졌다.</span><span class=\"en\"><b><span class=\"grammar-hl\">had a simple meaning</span>.</b></span></div></div><div class=\"lec-sent-ko\">처음에 ‘더 적은 것이 더 많은 것이다’라는 유명 문구는 단순한 의미를 가졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 주제인 &quot;Less is more&quot;라는 문구를 소개하며 논의를 시작합니다. Initially는 이 문구가 시간이 흐르면서 그 의미나 적용 범위가 변했음을 암시하는 복선 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Initially the catchphrase “less is more” had a simple meaning (관용표현): &#39;less is more&#39;는 &#39;적을수록 더 좋다&#39; 혹은 &#39;단순한 것이 아름답다&#39;는 의미를 가진 유명한 문구(catchphrase)다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">initially</td><td class=\"m\">처음에, 시초에</td></tr><tr><td class=\"w\">catchphrase</td><td class=\"m\">이목을 끄는 문구, 표어, 유행어</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">맨 처음 언급되었고</span><span class=\"en\"><b><span class=\"grammar-hl\">First mentioned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Robert Browning의 시 ‘Andrea del Sarto’에서</span><span class=\"en\"><b>in Robert Browning’s poem “Andrea del Sarto,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 시사한다</span><span class=\"en\"><b>it suggests</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단순한 모든 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">that everything simple</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 낫고 더 아름답다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">is better</span> and more beautiful</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">복잡하고 뒤엉킨 것보다.</span><span class=\"en\"><b>than the complex and tangled.</b></span></div></div><div class=\"lec-sent-ko\">Robert Browning의 시 ‘Andrea del Sarto’에서 맨 처음 언급되었고, 그것은 단순한 모든 것이 복잡하고 뒤엉킨 것보다 더 낫고 더 아름답다는 것을 시사한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;단순한 의미&#39;가 무엇인지 구체적인 기원과 함께 설명합니다. simple is better는 예술적 맥락에서 군더더기를 뺀 미니멀리즘의 미학적 가치가 복잡함보다 우월하다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">First mentioned (분사구문): p.p.로 시작하는 과거분사구문이다. 문맥상 &#39;처음 언급되었을 때&#39;라는 의미를 나타내므로 when it was first mentioned로 변환할 수 있다.</div><div class=\"lec-gr-item\">that everything simple is better 명사절 접속사 that: 타동사 suggest의 목적어 역할을 하는 명사절을 이끌며, 뒤에는 주어(everything simple)와 동사(is)를 갖춘 완전한 절이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tangled</td><td class=\"m\">뒤얽힌, 복잡한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">요즘에는</span><span class=\"en\"><b>Nowadays</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 구절이 들린다</span><span class=\"en\"><b>this phrase <span class=\"grammar-hl\">is heard</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자주 — 어쩌면 너무나도 자주.</span><span class=\"en\"><b>often — maybe even too often.</b></span></div></div><div class=\"lec-sent-ko\">요즘에는 이 구절이 자주, 어쩌면 너무나도 자주 들린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시적 표현이었던 과거와 달리 현재는 일상에서 흔하게 쓰이는 유행어가 되었음을 보여주며 시점의 변화를 나타냅니다. maybe even too often은 이 표현이 너무 남발되어 우리가 그 이면에 담긴 실질적인 변화를 간과하고 있을지도 모른다는 필자의 시각을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is heard (수동태): be동사(is)+p.p.(heard) 구조. hear는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is heard 형태로 쓴다. 기본구조: hear + O</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 인식하는 것이 중요하다</span><span class=\"en\"><b>But <span class=\"grammar-hl\">it’s important to recognize</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사고방식이</span><span class=\"en\"><b>that the way of thinking</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 말 뒤에 놓여 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that lies behind</span> these words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서서히 소멸시킨다는 것을</span><span class=\"en\"><b>slowly extinguishes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정한 관습을</span><span class=\"en\"><b>certain habits</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 일상생활로부터.</span><span class=\"en\"><b>from our daily life.</b></span></div></div><div class=\"lec-sent-ko\">하지만 이 말 뒤에 놓여 있는 사고방식이 우리 일상생활로부터 특정한 관습을 서서히 소멸시킨다는 것을 인식하는 것이 중요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심적인 주장으로 전환되는 문장입니다. extinguishes certain habits는 &quot;단순함&quot;을 추구하는 철학이 단순히 보기 좋은 상태를 만드는 것에 그치지 않고, 우리가 물건을 다루는 방식이나 기존의 행동 양식 자체를 사라지게 만들고 있다는 점을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it’s important to recognize (가주어): 진주어: it은 형식상의 주어(가주어)이고, 실제 주어의 내용은 to부정사구인 to recognize 이하(진주어)에 해당한다.</div><div class=\"lec-gr-item\">that lies behind (관계대명사): 주격 관계대명사 that이 선행사 the way of thinking을 수식하는 형용사절을 이끈다. 절 내에서 주어 역할을 하며 선행사가 단수이므로 동사 lies에 -s가 붙었다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">extinguish</td><td class=\"m\">없애다, 끝내다, (불을) 끄다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각해 보라</span><span class=\"en\"><b>think about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무겁고 거대한 라디오 수신기에 대해</span><span class=\"en\"><b>the heavy, massive radio receivers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">옛날에 존재했던.</span><span class=\"en\"><b><span class=\"grammar-hl\">that existed</span> back in the day.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 옛날에 존재했던 무겁고 거대한 라디오 수신기에 대해 생각해 보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;습관의 변화&#39;를 입증하기 위해 구체적인 과거의 물건을 예로 듭니다. heavy, massive는 뒤에 나올 작고 간소해진 현대 기기와 극명한 대비를 이루기 위해 사용된 묘사입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that existed (관계대명사): 주격 관계대명사 that이 선행사 radio receivers를 수식하는 형용사절을 이끈다. 절 내부에서 주어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">massive</td><td class=\"m\">거대한, 육중한, 엄청난</td></tr><tr><td class=\"w\">back in the day</td><td class=\"m\">예전에, 그 당시에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시간이 흐르면서,</span><span class=\"en\"><b>Over time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 버튼 중 많은 것이</span><span class=\"en\"><b>many of their buttons</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘여분의 것’으로 간주되었고</span><span class=\"en\"><b><span class=\"grammar-hl\">became viewed as</span> “extra”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제거되었으며,</span><span class=\"en\"><b>and <span class=\"grammar-hl\">were removed</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">각각의 축소와 함께</span><span class=\"en\"><b>and with each reduction</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 장치들은 결국 발전했다</span><span class=\"en\"><b>these devices eventually developed</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 주머니 속의 전화기로.</span><span class=\"en\"><b>into the phones in our pockets.</b></span></div></div><div class=\"lec-sent-ko\">시간이 흐르면서, 그것의 버튼 중 많은 것이 ‘여분의 것’으로 간주되어 제거되었고, 각각의 축소와 함께 이 장치는 결국 우리 주머니 속의 전화기로 발전했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 물리적인 형태가 어떻게 변해왔는지 그 과정을 설명합니다. became viewed as “extra”는 효율성을 위해 겉으로 드러난 조작 장치들을 줄여나가는 과정이며, 이것이 기술의 진보를 통해 스마트폰이라는 형태로 집약되었음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">became viewed as (수동태): become+p.p.(viewed) 구조. view는 타동사로 view A as B (A를 B로 여기다) 구조인데 목적어가 주어로 올라가 수동구조 became viewed가 되고 전치사구 as B는 그대로 남는다. 기본구조: view + O + as B</div><div class=\"lec-gr-item\">were removed (수동태): be동사(were)+p.p.(removed) 구조. remove는 타동사인데 목적어가 없어서 수동구조 were removed 형태로 쓴다. 기본구조: remove + O</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">over time</td><td class=\"m\">시간이 흐르면서, 서서히</td></tr><tr><td class=\"w\">reduction</td><td class=\"m\">축소, 삭감, 감소</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">물체의 크기는</span><span class=\"en\"><b>The scale of the object</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 작아졌고,</span><span class=\"en\"><b>became smaller,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">버튼의 기능은</span><span class=\"en\"><b>and the functions of the buttons</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사라졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">got lost</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점 세 개로 된 메뉴와 다층화된 폴더 속으로
