통곡물의 맛이 점차 매력적으로 느껴지는 이유를 잘 설명해 줍니다. 결국 입맛이란 선천적인 생물학적 요인뿐만 아니라 후천적인 식습관 훈련(Dietary Retraining)을 통해 얼마든지 더 건강한 방향으로 변화할 수 있는 유연한 영역임을 이해하는 것이 이 글의 핵심입니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01미각의 유연성</div><ul><li>식습관은 선천적 요인이나 어린 시절 습관에 고정되지 않고 평생에 걸쳐 변화할 수 있다.</li><li>뇌의 놀라운 적응력인 신경 가소성(neuroplasticity) 덕분에 가능함</li><li>나이가 들어도 식습관에는 생각보다 많은 유연성(flexibility)이 존재함</li><li>핵심 키워드: 미각 선호도(taste preferences)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02변화의 긍정적 가치</div><ul><li>식습관을 바꿀 수 있다는 사실은 건강한 삶을 원하는 모두에게 희망적인 소식이다.</li><li>새로운 음식을 즐기려는 모험적인 식취향 확대 가능</li><li>좋지 못한 식습관(poor diet habits)을 고치려는 사람들에게 매우 유익함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03성인의 미각 재조정</div><ul><li>아이들이 건강한 음식을 배우듯 성인도 새로운 맛에 적응하고 입맛을 다시 조정할 수 있다.</li><li>흰 빵과 같은 가공 곡물에서 통곡물(whole grain)로의 전환 사례</li><li>점차 통곡물의 고소한 맛(nutty flavors)과 쫄깃한 질감(chewy textures)을 선호하게 됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04변화를 위한 필수 조건</div><ul><li>새로운 입맛에 익숙해지기 위해서는 구체적인 실천과 마음가짐이 뒷받침되어야 한다.</li><li>가장 중요한 열쇠인 반복적인 노출(repeated exposure)</li><li>스스로 바꾸고자 하는 변화하려는 의지(willingness to change) 가 중요함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">learned</td><td class=\"m\">학습된, 후천적인</td></tr><tr><td class=\"w\">inborn</td><td class=\"m\">타고난, 선천적인</td></tr><tr><td class=\"w\">preference</td><td class=\"m\">선호, 기호</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~에 기인하는</td></tr><tr><td class=\"w\">neuroplasticity</td><td class=\"m\">신경 가소성</td></tr><tr><td class=\"w\">adaptability</td><td class=\"m\">적응성, 순응성</td></tr><tr><td class=\"w\">flexibility</td><td class=\"m\">유연성, 융통성</td></tr><tr><td class=\"w\">terrific</td><td class=\"m\">아주 멋진, 훌륭한</td></tr><tr><td class=\"w\">adventurous</td><td class=\"m\">모험심이 강한, 대담한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">expand</td><td class=\"m\">확장하다, 확대하다</td></tr><tr><td class=\"w\">be eager to</td><td class=\"m\">~하기를 간절히 원하다, ~하고 싶어 하다</td></tr><tr><td class=\"w\">nutritious</td><td class=\"m\">영양가 있는</td></tr><tr><td class=\"w\">readjust</td><td class=\"m\">재조정하다, 다시 적응하다</td></tr><tr><td class=\"w\">switch from</td><td class=\"m\">~에서 전환하다, ~에서 바꾸다</td></tr><tr><td class=\"w\">processed</td><td class=\"m\">가공된</td></tr><tr><td class=\"w\">exposure</td><td class=\"m\">노출, 체험</td></tr><tr><td class=\"w\">willingness</td><td class=\"m\">기꺼이 하는 마음, 의지</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">학습된 섭식 행동에도 불구하고</span><span class=\"en\"><b>Despite <span class=\"grammar-hl\">learned</span> <span class=\"grammar-hl\">eating</span> behaviors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유아기에 형성되는</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> <span class=\"grammar-hl\">are formed</span> in early childhood</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 타고난 생물학적 차이에도 불구하고</span><span class=\"en\"><b>and inborn biological differences,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맛 선호도는 변화될 수 있다</span><span class=\"en\"><b>taste preferences <span class=\"grammar-hl\">can be changed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 인생 전체에 걸쳐</span><span class=\"en\"><b>throughout our lives</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 뇌의 놀라운 적응력인 신경 가소성 덕분에:</span><span class=\"en\"><b><span class=\"grammar-hl\">due to</span> neuroplasticity, our brain’s amazing adaptability:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 많은 유연성이 있다</span><span class=\"en\"><b>There is far more flexibility</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 섭식 행동에는</span><span class=\"en\"><b>in our food behaviors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분이 생각하는 것보다</span><span class=\"en\"><b>than most think,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 우리가 나이가 들어도.</span><span class=\"en\"><b>even as we age.</b></span></div></div><div class=\"lec-sent-ko\">유아기에 형성되는 학습된 섭식 행동과 타고난 생물학적 차이에도 불구하고, 맛 선호도는 우리 뇌의 놀라운 적응력인 신경 가소성 덕분에 우리 인생 전체에 걸쳐 변화될 수 있다. 심지어 우리가 나이가 들어도, 우리의 섭식 행동에는 대부분이 생각하는 것보다 훨씬 더 많은 유연성이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> taste preferences can be changed는 타고난 유전자나 어린 시절의 습관에 평생 갇혀 지내지 않아도 된다는 메시지를 전달하며 글의 핵심 주제를 제시합니다. neuroplasticity는 입맛의 변화가 단순한 기분이 아니라 뇌의 구조적 변화를 바탕으로 한 과학적 사실임을 뒷받침합니다. even as we age는 나이가 들면 입맛을 바꾸기 어렵다는 일반적인 통념과 대조를 이루며, 변화의 가능성이 전 생애에 걸쳐 열려 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">learned (과거분사(형용사)): 과거분사 learned가 뒤의 명사 eating behaviors를 수식하여 &#39;학습된 식습관&#39;이라는 의미를 나타냄.</div><div class=\"lec-gr-item\">eating (동명사(명사적)): eating(먹기/식사) + behaviors(행동)가 결합된 형태이며, -ing가 &#39;식사&#39;라는 행위/활동의 개념으로 쓰여 behaviors를 꾸며주는 동명사 구조임.</div><div class=\"lec-gr-item\">that (관계대명사): 선행사 learned eating behaviors를 수식하는 주격 관계대명사.</div><div class=\"lec-gr-item\">are formed (수동태): be동사(are)+p.p.(formed) 구조. form은 타동사인데 뒤에 목적어가 없어서 수동구조 are formed 형태로 쓴다. 기본구조: V + O</div><div class=\"lec-gr-item\">can be changed (수동태): be동사(be)+p.p.(changed) 구조. change는 타동사인데 뒤에 목적어가 없어서 수동구조 be changed 형태로 쓴다. 기본구조: V + O</div><div class=\"lec-gr-item\">due to (관용표현): &#39;~때문에&#39;라는 의미로 구체적인 원인이나 이유를 나타내는 전치사구 숙어.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">learned</td><td class=\"m\">학습된, 후천적인</td></tr><tr><td class=\"w\">inborn</td><td class=\"m\">타고난, 선천적인</td></tr><tr><td class=\"w\">preference</td><td class=\"m\">선호, 기호</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~에 기인하는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">neuroplasticity</td><td class=\"m\">신경 가소성</td></tr><tr><td class=\"w\">adaptability</td><td class=\"m\">적응성, 순응성</td></tr><tr><td class=\"w\">flexibility</td><td class=\"m\">유연성, 융통성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 아주 좋은 소식이다</span><span class=\"en\"><b>This is terrific news</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모험적으로 음식을 먹는 사람들에게</span><span class=\"en\"><b>for adventurous eaters</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신들의 저녁 식단 메뉴를 확장하고 싶어 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span> want <span class=\"grammar-hl\">to expand</span> their dinner menu</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 저 밖에 크고 맛있는 세상이 있다!</span><span class=\"en\"><b>— it’s a big, tasty world out there!</b></span></div></div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;입맛의 유연성&#39;이 우리 삶에 주는 구체적인 이득을 설명합니다. expand their dinner menu는 새로운 미식의 즐거움을 찾는 사람들에게 해당하며, break poor diet habits는 건강을 위해 식단을 개선해야 하는 사람들에게 입맛 자체가 변할 수 있다는 희망적인 해결책을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who (관계대명사): 선행사 adventurous eaters를 수식하는 주격 관계대명사.</div><div class=\"lec-gr-item\">to expand (to부정사): want의 목적어 역할을 하는 명사적 용법.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">terrific</td><td class=\"m\">아주 멋진, 훌륭한</td></tr><tr><td class=\"w\">adventurous</td><td class=\"m\">모험심이 강한, 대담한</td></tr><tr><td class=\"w\">expand</td><td class=\"m\">확장하다, 확대하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">— 하지만 그것은 엄청난 소식이다</span><span class=\"en\"><b>— but it’s <span class=\"grammar-hl\">amazing</span> news</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나쁜 식습관을 고치기를 열망하는 사람들에게.</span><span class=\"en\"><b>for those eager <span class=\"grammar-hl\">to break</span> poor diet habits.</b></span></div></div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아이들이 채소를 먹게 되는 과정을 예로 들어 성인의 입맛 변화 가능성을 더 쉽게 이해하도록 돕습니다. Just as kids gradually learn은 입맛이 형성되는 과정이 학습의 영역임을 보여주며, readjust their taste는 성인이 된 후에도 의도적인 노력을 통해 감각의 기준을 다시 설정할 수 있음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">amazing (현재분사(형용사)): amazing이 명사 news의 상태나 특성을 설명하며 수식하는 구조임.</div><div class=\"lec-gr-item\">to break (to부정사): 형용사 eager를 수식하여 그 이유나 목적을 구체화하는 부사적 용법.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아이들이 점진적으로 배우는 것처럼</span><span class=\"en\"><b>Just as kids gradually learn</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영양가 있는 음식을 좋아하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to like</span> nutritious foods,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">성인 또한 자신의 입맛을 재조정할 수 있다.</span><span class=\"en\"><b>so, too, <span class=\"grammar-hl\">can adults</span> readjust their taste.</b></span></div></div><div class=\"lec-sent-ko\">아이들이 점진적으로 영양가 있는 음식을 좋아하는 것을 배우는 것처럼, 성인 또한 자신의 입맛을 재조정할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아이들이 채소를 먹게 되는 과정을 예로 들어 성인의 입맛 변화 가능성을 더 쉽게 이해하도록 돕습니다. Just as kids gradually learn은 입맛이 형성되는 과정이 학습의 영역임을 보여주며, readjust their taste는 성인이 된 후에도 의도적인 노력을 통해 감각의 기준을 다시 설정할 수 있음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to like (to부정사): learn의 목적어 역할을 하는 명사적 용법.</div><div class=\"lec-gr-item\">can adults (도치): &#39;so + 조동사 + 주어&#39; 구조로 앞 문장의 긍정 내용에 대해 &#39;마찬가지이다&#39;라는 의미를 나타낼 때 주어와 동사의 위치가 바뀐 형태임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nutritious</td><td class=\"m\">영양가 있는</td></tr><tr><td class=\"w\">readjust</td><td class=\"m\">재조정하다, 다시 적응하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 이는</span><span class=\"en\"><b>Many</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가공된 곡물 식품에서 바꾸는</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span> switch from <span class=\"grammar-hl\">processed</span> grain foods</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흰 빵과 흰 쌀 같은</span><span class=\"en\"><b>like white bread and white rice</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">통곡물 종류로</span><span class=\"en\"><b>to whole grain types,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예를 들어</span><span class=\"en\"><b>for instance,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점진적으로 배운다</span><span class=\"en\"><b>gradually learn</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">견과 같은 풍미와 씹는 식감을 선호하는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">to prefer</span> the nutty flavors and chewy textures.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 흰 빵과 흰 쌀 같은 가공된 곡물 식품에서 통곡물 종류로 바꾸는 많은 이는 점진적으로 견과 같은 풍미와 씹는 식감을 선호하는 것을 배운다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 성인의 입맛 재조정이 실제로 어떻게 일어나는지 구체적인 사례를 들어 증명합니다. switch from processed grain foods... to whole grain types는 자극적인 맛에서 덜 자극적이고 건강한 맛으로 옮겨가는 과정을 보여줍니다. gradually learn to prefer는 처음에는 생소하거나 거부감이 들 수 있는 건강식이 시간이 흐르면서 뇌에 의해 긍정적인 맛으로 재평가되는 과정을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who (관계대명사): 선행사인 대명사 Many(많은 사람들)를 수식하는 주격 관계대명사.</div><div class=\"lec-gr-item\">processed (과거분사(형용사)): processed가 grain foods를 수식하여 &#39;가공된 곡물 식품&#39;이라는 의미를 나타냄.</div><div class=\"lec-gr-item\">from processed grain foods ... to whole grain types (관용표현): &#39;from A to B&#39; 구조를 사용하여 A에서 B로의 변화나 이동 범위를 나타냄.</div><div class=\"lec-gr-item\">to prefer (to부정사): learn의 목적어 역할을 하는 명사적 용법.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">switch from</td><td class=\"m\">~에서 전환하다, ~에서 바꾸다</td></tr><tr><td class=\"w\">processed</td><td class=\"m\">가공된</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">반복된 경험은 — 그리고 변화하려는 의지는 —</span><span class=\"en\"><b><span class=\"grammar-hl\">Repeated</span> exposure — and a willingness <span class=\"grammar-hl\">to change</span> —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">핵심이다.</span><span class=\"en\"><b>is the key.</b></span></div></div><div class=\"lec-sent-ko\">반복된 경험 — 그리고 변화하려는 의지 — 가 핵심이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 논의들을 종합하며 입맛을 바꾸기 위한 최종적인 방법론을 제시하며 글을 맺습니다. Repeated exposure는 특정 음식을 거부감 없이 받아들이기 위해 필요한 물리적 빈도를 의미합니다. willingness to change는 새로운 맛에 마음을 여는 심리적 태도가 동반되어야 뇌의 가소성이 효과적으로 발휘된다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Repeated (과거분사(형용사)): Repeated가 뒤의 명사 exposure를 수식하여 &#39;반복된 노출&#39;이라는 수동/완료의 의미를 나타냄.</div><div class=\"lec-gr-item\">to change (to부정사): 명사 willingness를 뒤에서 수식하여 &#39;변화하려는 의지&#39;라는 의미를 만드는 형용사적 용법.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exposure</td><td class=\"m\">노출, 체험</td></tr><tr><td class=\"w\">willingness</td><td class=\"m\">기꺼이 하는 마음, 의지</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>입맛은 유전이나 어린 시절 습관에 고정되지 않고 평생 변화가 가능하다.</li><li>이는 뇌가 스스로를 재구성하는 신경가소성이라는 특성 덕분이다.</li><li>미식의 즐거움을 늘리거나 나쁜 식습관을 고치려는 성인에게 매우 희망적인 사실이다.</li><li>반복적으로 음식을 접하고 변화하려는 의지를 갖는다면 건강한 맛을 선호하도록 입맛을 바꿀 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Although early habits and biology influence tastes, taste preferences can be modified through repeated exposure because of the brain&#39;s neuroplasticity.</div>\n              <div class=\"lec-final-sum-ko\">초기 습관과 생물학적 요인에도 불구하고, 뇌의 신경 가소성 때문에 반복적인 노출을 통해 식습관 선호도를 수정할 수 있다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_03월_22번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_22번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_22번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_03월_22번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_03월_22번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_03월_22번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_03월_22번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2026년_03월_22번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_22번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_22번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_22번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_22번_강의_audio/12.mp3","hl":"main"
