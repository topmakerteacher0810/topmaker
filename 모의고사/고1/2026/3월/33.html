low lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01초기 기록 방식</div><ul><li>초기 수메르인들은 점토판에 물건의 개수만큼 그림을 그려 기록했다.</li><li>기록 방식: 물건의 수만큼 그림을 반복함</li><li>예시: 물고기 5마리를 5개의 물고기 그림으로 표시</li><li>핵심 도구: 점토판(clay tablets), 물고기(fish)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02지적 도약과 분리</div><ul><li>숫자와 세고 있는 대상인 물체를 서로 분리하는 중요한 변화가 일어났다.</li><li>지적 도약: 숫자(number)를 대상(object)으로부터 분리</li><li>숫자 5를 위한 숫자 기호(numeral)를 별도로 사용</li><li>물체는 별도의 상징(symbol)으로 병기함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03숫자의 범용성 확장</div><ul><li>동일한 숫자 기호를 유지하면서 대상의 상징만 바꾸어 사용할 수 있음을 깨달았다.</li><li>숫자 기호는 고정하고 대상의 기호만 교체</li><li>대상의 다양화: 소(cow), 기름 단지(jar of oil) 등</li><li>대상에 상관없이 독립적으로 작동하는 수 체계</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04해방된 숫자의 정립</div><ul><li>세는 대상으로부터 완전히 독립하여 그 자체로 존재하는 숫자의 개념이 완성되었다.</li><li>개념 정의: 해방된 숫자(emancipated number)</li><li>숫자가 대상에 의존하지 않고 독자적인 권리(own right)를 가짐</li><li>현대 사고의 기초가 된 혁명적이고 강력한(powerful) 지적 도구</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tablet</td><td class=\"m\">판, 서판</td></tr><tr><td class=\"w\">record</td><td class=\"m\">기록하다, 적어 두다</td></tr><tr><td class=\"w\">intellectual</td><td class=\"m\">지적인, 지성의</td></tr><tr><td class=\"w\">leap</td><td class=\"m\">도약, 급증, 큰 발전</td></tr><tr><td class=\"w\">separate</td><td class=\"m\">분리하다, 떼어놓다</td></tr><tr><td class=\"w\">in other words</td><td class=\"m\">다시 말해서, 즉</td></tr><tr><td class=\"w\">represent</td><td class=\"m\">나타내다, 표상하다, 상징하다</td></tr><tr><td class=\"w\">numeral</td><td class=\"m\">숫자, 수사</td></tr><tr><td class=\"w\">alongside</td><td class=\"m\">~와 함께, ~와 나란히</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">describe</td><td class=\"m\">묘사하다, 설명하다</td></tr><tr><td class=\"w\">trade</td><td class=\"m\">교환하다, 거래하다</td></tr><tr><td class=\"w\">be interested in</td><td class=\"m\">~에 관심이 있다</td></tr><tr><td class=\"w\">emancipated</td><td class=\"m\">해방된, 구속받지 않는</td></tr><tr><td class=\"w\">in its own right</td><td class=\"m\">그 자체로, 독자적으로</td></tr><tr><td class=\"w\">independent of</td><td class=\"m\">~와 관계없는, ~로부터 독립적인</td></tr><tr><td class=\"w\">take for granted</td><td class=\"m\">~을 당연하게 여기다</td></tr><tr><td class=\"w\">civilization</td><td class=\"m\">문명</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기원전 3000년경부터</span><span class=\"en\"><b>From around 3000 BC,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수메르 관리들은</span><span class=\"en\"><b>the Sumerian officials</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신들의 물품 목록을 표시하곤 했다</span><span class=\"en\"><b><span class=\"grammar-hl\">would mark</span> their lists of goods</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점토판에</span><span class=\"en\"><b>on clay tablets.</b></span></div></div><div class=\"lec-sent-ko\">기원전 3000년경부터, 수메르 관리들은 점토판에 자신들의 물품 목록을 표시하곤 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 수메르 문명에서 행정적 필요에 의해 기록 체계가 시작되었음을 알리며 글의 배경을 설정합니다. mark their lists of goods는 당시 관리들이 세금을 징수하거나 창고의 재고를 파악하기 위해 물품의 종류와 수량을 기록하기 시작했음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">would mark (관용표현): 조동사 would는 과거에 반복되었던 행동이나 습관을 나타내어 &#39;~하곤 했다&#39;라는 의미로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tablet</td><td class=\"m\">판, 서판</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 그들이 물고기 다섯 마리를 기록하고 싶었다면</span><span class=\"en\"><b>If they wanted <span class=\"grammar-hl\">to record</span> five fish,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 표시하곤 했다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">would mark</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물고기 그림 다섯 개를</span><span class=\"en\"><b>five pictures of a fish.</b></span></div></div><div class=\"lec-sent-ko\">만약 물고기 다섯 마리를 기록하고 싶었다면, 그들은 물고기 그림 다섯 개를 표시하곤 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 기록 방식을 구체적으로 보여줍니다. mark five pictures는 숫자를 나타내는 별도의 기호가 없었기 때문에, 개수만큼 똑같은 그림을 반복해서 그리는 원시적이고 번거로운 방식을 사용했음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to record (to부정사): 타동사 want의 목적어 역할을 하는 명사적 용법으로 쓰여 &#39;~하는 것을&#39;이라고 해석한다.</div><div class=\"lec-gr-item\">would mark (관용표현): 과거의 습관적인 동작을 나타내는 조동사로 &#39;~하곤 했다&#39;는 의미를 전달한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">record</td><td class=\"m\">기록하다, 적어 두다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들의 첫 번째 위대한 지적 도약은</span><span class=\"en\"><b>Their first great intellectual leap</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왔다</span><span class=\"en\"><b>came</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">숫자를 분리하는 것에서</span><span class=\"en\"><b>from <span class=\"grammar-hl\">separating</span> the number</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신들이 세고 있는 대상으로부터</span><span class=\"en\"><b>from <span class=\"grammar-hl\">the object they were counting</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들의 첫 번째 위대한 지적 도약은 자신들이 세고 있는 대상으로부터 숫자를 분리하는 것에서 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 흐름이 반전되는 지점이며, 단순 기록이 수학적 사고로 발전하는 핵심적인 계기를 설명합니다. separating the number from the object는 &#39;물고기 다섯 마리&#39;를 하나의 덩어리로 보지 않고, &#39;5&#39;라는 수량과 &#39;물고기&#39;라는 대상을 서로 다른 정보로 나누어 인식하기 시작했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">separating (동명사): 전치사 from의 목적어 역할을 하는 명사적 성격으로 쓰였으며, &#39;A를 B와 분리하는 것&#39;이라는 의미를 형성한다.</div><div class=\"lec-gr-item\">the object they were counting (관계대명사): 명사 object와 주어 they 사이에 목적격 관계대명사(which 또는 that)가 생략된 구조이며, counting의 목적어가 없는 불완전한 절이 앞의 명사를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intellectual</td><td class=\"m\">지적인, 지성의</td></tr><tr><td class=\"w\">leap</td><td class=\"m\">도약, 급증, 큰 발전</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다시 말해</span><span class=\"en\"><b><span class=\"grammar-hl\">In other words</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 물고기 다섯 마리를 표현하곤 했다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">would represent</span> five fish</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">숫자 5를 나타내는 숫자로</span><span class=\"en\"><b>with a numeral for the number five</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물고기의 상징 옆에</span><span class=\"en\"><b>alongside a symbol for the fish.</b></span></div></div><div class=\"lec-sent-ko\">다시 말해, 그들은 물고기의 상징 옆에 ‘숫자’ 5를 나타내는 (수메르) ‘숫자’를 써서 물고기 다섯 마리를 표현하곤 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 &#39;분리&#39;가 실제 기록 방식에서 어떻게 구현되었는지 보충 설명합니다. a numeral for the number five alongside a symbol은 물고기 그림을 다섯 번 그리는 대신, 숫자 &#39;5&#39;를 뜻하는 기호 하나와 물고기를 뜻하는 기호 하나만 써서 정보를 효율적으로 압축했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">In other words (관용표현): &#39;다시 말해서&#39;, &#39;즉&#39;이라는 의미로 앞 문장의 내용을 다른 방식으로 요약하거나 부연 설명할 때 사용한다.</div><div class=\"lec-gr-item\">would represent (관용표현): 과거의 습관을 나타내는 조동사 would가 사용되어 과거에 &#39;나타내곤 했다&#39;라는 의미를 표현한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in other words</td><td class=\"m\">다시 말해서, 즉</td></tr><tr><td class=\"w\">represent</td><td class=\"m\">나타내다, 표상하다, 상징하다</td></tr><tr><td class=\"w\">numeral</td><td class=\"m\">숫자, 수사</td></tr><tr><td class=\"w\">alongside</td><td class=\"m\">~와 함께, ~와 나란히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 그들이 다른 어떤 것 다섯 개를 묘사하고 싶었다면</span><span class=\"en\"><b>If they wanted <span class=\"grammar-hl\">to describe</span> five of something else,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 깨달았다</span><span class=\"en\"><b>they realized</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">똑같은 숫자를 유지할 수 있고</span><span class=\"en\"><b>they could keep the same numeral</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대상의 상징을 바꿀 수 있다는 것을</span><span class=\"en\"><b>and trade the object symbol</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소나 기름 단지로</span><span class=\"en\"><b>for a cow, or a jar of oil,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 자신들이 관심 있는 다른 무엇으로든</span><span class=\"en\"><b>or <span class=\"grammar-hl\">whatever else they were interested in</span>.</b></span></div></div><div class=\"lec-sent-ko\">만약 그들이 다른 어떤 것 다섯 개를 묘사하고 싶었다면, 그들은 똑같은 숫자를 유지하면서 대상의 상징을 소나 기름 단지, 또는 자신들이 관심 있는 다른 무엇으로든 바꿀 수 있다는 것을 깨달았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 숫자 기호를 독립시킨 결과 얻게 된 실질적인 이익을 설명합니다. keep the same numeral and trade the object symbol은 숫자라는 틀을 고정해 두고 대상만 갈아 끼우면 되기 때문에, 어떤 물건이든 동일한 논리로 기록할 수 있는 범용성을 갖게 되었음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to describe (to부정사): 타동사 want의 목적어로 쓰인 명사적 용법이다.</div><div class=\"lec-gr-item\">whatever else they were interested in (관계대명사): 복합관계대명사 whatever가 이끄는 명사절이 전치사 for의 목적어 역할을 하며, 전치사 in 뒤의 목적어가 비어 있는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">numeral</td><td class=\"m\">숫자, 수사</td></tr><tr><td class=\"w\">describe</td><td class=\"m\">묘사하다, 설명하다</td></tr><tr><td class=\"w\">trade</td><td class=\"m\">교환하다, 거래하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수메르인들은</span><span class=\"en\"><b>The Sumerians</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해방된 숫자의 개념을 발전시켰다</span><span class=\"en\"><b>had developed the idea of an emancipated number,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 자체로 존재하는</span><span class=\"en\"><b><span class=\"grammar-hl\">existing</span> in its own right</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것이 무엇을 세는 데 사용되고 있는지와 상관없이 독립적인</span><span class=\"en\"><b>and independent of <span class=\"grammar-hl\">whatever it is being used</span> <span class=\"grammar-hl\">to count</span>.</b></span></div></div><div class=\"lec-sent-ko\">수메르인들은 해방된 숫자, 즉 그것이 무엇을 세는 데 사용되고 있는지와 상관없이, 그 자체로 바로 존재하는 숫자의 개념을 발전시다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 결론이자 핵심 개념을 제시합니다. an emancipated number는 숫자가 구체적인 사물의 개수를 세는 수단에 머물지 않고, 사물이 없어도 머릿속에 존재하는 순수한 추상적 개념으로 거듭났다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">existing (분사구문): 콤마 뒤에서 emancipated number의 상태를 부연 설명하는 분사구문이다. 원래 절인 as it existed 또는 which existed로 변환하여 생각할 수 있다.</div><div class=\"lec-gr-item\">whatever it is being used (관계대명사): 복합관계대명사 whatever가 이끄는 명사절이 전치사 of의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">is being used (수동태): be동사(is) + p.p.(used) 구조가 진행형(being)과 결합된 수동 진행형이다. use는 타동사인데 뒤에 목적어가 없어서 수동구조 is being used 형태로 쓴다. 기본구조: V + O + toV (use A to do: A를 ~하는 데 사용하다)</div><div class=\"lec-gr-item\">to count (to부정사): 수동태 be used 뒤에 연결되어 &#39;~하기 위하여&#39;라는 목적을 나타내는 부사적 용법으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emancipated</td><td class=\"m\">해방된, 구속받지 않는</td></tr><tr><td class=\"w\">in its own right</td><td class=\"m\">그 자체로, 독자적으로</td></tr><tr><td class=\"w\">independent of</td><td class=\"m\">~와 관계없는, ~로부터 독립적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 쉽다</span><span class=\"en\"><b><span class=\"grammar-hl\">It is easy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해방된 숫자를 당연하게 여기는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to take</span> the emancipated number for granted</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 현대 사상에 아주 깊이 설정되어 있기 때문에</span><span class=\"en\"><b>as it is so deeply set into modern thought,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 초기 문명들에게</span><span class=\"en\"><b>but to the earliest civilizations</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 지적으로 새롭고 매우 강력했다.</span><span class=\"en\"><b>it was intellectually new and extremely powerful.</b></span></div></div><div class=\"lec-sent-ko\">그것은 현대 사고방식에 아주 깊이 설정되어 있어서 해방된 숫자를 당연하게 여기기 쉽지만, 초기 문명들에게 그것은 지적으로 새롭고 매우 강력한 것이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현대인의 관점과 과거의 혁신성을 대비하며 글을 마무리합니다. intellectually new and extremely powerful은 추상적인 숫자 개념이 문명의 복잡한 경제와 행정을 가능하게 한 위대한 발명이었음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is easy to take (가주어): 진주어: 형식적인 주어 It을 앞에 두고, 실제 주어인 to부정사구(to take ...)를 뒤로 보낸 구조이다.</div><div class=\"lec-gr-item\">take the emancipated number for granted (관용표현): &#39;take A for granted&#39;는 &#39;A를 당연하게 여기다&#39;라는 의미의 숙어적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intellectual</td><td class=\"m\">지적인, 지성의</td></tr><tr><td class=\"w\">emancipated</td><td class=\"m\">해방된, 구속받지 않는</td></tr><tr><td class=\"w\">civilization</td><td class=\"m\">문명</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>초기 수메르인들은 물품 수량만큼 그림을 반복해서 그리는 단순한 방식으로 기록했다.</li><li>이후 물건의 종류와 숫자를 분리하여 기록하는 지적인 도약을 이루었다.</li><li>이로써 숫자는 특정 대상에 얽매이지 않는 &#39;해방된 숫자&#39;라는 추상적 개념이 되었다.</li><li>이러한 숫자의 분리와 추상화는 현대 문명의 기초가 된 강력한 사고의 전환이었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The Sumerians developed the concept of emancipated numbers by separating numerical values from the physical objects being recorded.</div>\n              <div class=\"lec-final-sum-ko\">수메르인들은 수치와 기록 대상을 분리함으로써 대상으로부터 독립된 추상적인 수의 개념을 발전시켰다.</div></div></div>"],"segs":[[{"audio":"./33_audio/1.mp3","hl":null}],[{"audio":"./33_audio/2.mp3","hl":null}],[{"audio":"./33_audio/3.mp3","hl":null},{"audio":"./33_audio/4.mp3","hl":"stage-0"},{"audio":"./33_audio/5.mp3","hl":"stage-1"},{"audio":"./33_audio/
