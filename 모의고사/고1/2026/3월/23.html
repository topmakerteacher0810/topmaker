현상은 성인이 되어가는 과정에서 자율성(Autonomy)을 찾아가는 자연스러운 심리적 발달 단계 중 하나로 이해할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01동조 연구의 실험 방식</div><ul><li>청소년들을 집단의 의견과 상충하는 결정을 내려야 하는 상황에 두어 동조 성향을 연구한다.</li><li>집단(group)의 의견과 개인의 선택이 충돌하는 상황 설정</li><li>또래를 따라가려는 동조(conformity) 현상을 측정함</li><li>핵심 키워드: 동조(conformity), 의사 결정(decision)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02연령별 동조 성향의 차이</div><ul><li>연구 결과 동조 성향은 모든 연령대에서 동일하게 나타나지 않는다는 점이 발견되었다.</li><li>타인의 의견을 따르려는 의지는 14세 무렵에 정점(peak)에 도달함</li><li>연령에 따라 동조의 정도가 다르게 분포함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03독립적 태도의 형성</div><ul><li>16세에서 17세가 되면 집단의 의견에 반대하고 자신의 주장을 펼치는 능력이 향상된다.</li><li>집단의 의견에 반대(disagree)할 수 있는 능력의 발달</li><li>자신의 의견을 당당히 고수함 (stand up for their own opinion)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04성숙에 따른 주체성 강화</div><ul><li>청소년이 성숙해지면 또래의 영향에서 벗어나 개인의 의견을 지키는 힘이 커진다.</li><li>연령에 따른 또래 집단의 영향력(influence) 차이 입증</li><li>성숙할수록 더 높은 회복 탄력성(resilient)을 갖추게 됨</li><li>개인으로서 자신의 의견을 방어(defend)함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conformity</td><td class=\"m\">순응, 일치</td></tr><tr><td class=\"w\">go against</td><td class=\"m\">~에 거스르다, ~에 반하다</td></tr><tr><td class=\"w\">fascinating</td><td class=\"m\">대단히 흥미로운, 매력적인</td></tr><tr><td class=\"w\">equally</td><td class=\"m\">평등하게, 동일하게</td></tr><tr><td class=\"w\">willingness</td><td class=\"m\">기꺼이 하는 마음, 의향</td></tr><tr><td class=\"w\">go along with</td><td class=\"m\">~에 동조하다, ~을 따르다</td></tr><tr><td class=\"w\">reach a peak</td><td class=\"m\">정점에 도달하다, 절정에 이르다</td></tr><tr><td class=\"w\">tendency</td><td class=\"m\">경향, 추세</td></tr><tr><td class=\"w\">decrease</td><td class=\"m\">줄어들다, 감소하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">disagree</td><td class=\"m\">의견이 다르다, 일치하지 않다</td></tr><tr><td class=\"w\">stand up for</td><td class=\"m\">~을 옹호하다, ~을 지지하다</td></tr><tr><td class=\"w\">finding</td><td class=\"m\">조사 결과, 발견</td></tr><tr><td class=\"w\">demonstrate</td><td class=\"m\">보여주다, 입증하다</td></tr><tr><td class=\"w\">influence</td><td class=\"m\">영향, 영향력</td></tr><tr><td class=\"w\">peer group</td><td class=\"m\">또래 집단</td></tr><tr><td class=\"w\">mature</td><td class=\"m\">성장하다, 성숙해지다</td></tr><tr><td class=\"w\">resilient</td><td class=\"m\">회복력 있는, 탄력 있는</td></tr><tr><td class=\"w\">defend</td><td class=\"m\">방어하다, 옹호하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">순응은</span><span class=\"en\"><b>Conformity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">십 대 시절의</span><span class=\"en\"><b>in the teenage years</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연구되어 왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">has been studied</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">청소년들을 상황에 놓음으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">putting</span> young people in situations</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 선택이나 결정을 내리도록 요구받는</span><span class=\"en\"><b><span class=\"grammar-hl\">where</span> they <span class=\"grammar-hl\">are asked to make</span> a choice or decision</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 반대되는 것처럼 보이는</span><span class=\"en\"><b><span class=\"grammar-hl\">where</span> that appears <span class=\"grammar-hl\">to go against</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집단 내의 다른 모든 사람이 말하고 있는 것에.</span><span class=\"en\"><b>what everyone else in the group <span class=\"grammar-hl\">is saying</span>.</b></span></div></div><div class=\"lec-sent-ko\">십 대 시절의 순응은 집단 내의 다른 모든 사람이 말하고 있는 것에 반대되는 것처럼 보이는 선택이나 결정을 내리도록 청소년이 요구받는 상황에 그들을 놓음으로써 연구되어 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 십 대들이 친구들의 눈치를 얼마나 보는지 알아내기 위해 연구자들이 사용한 실험 방식을 소개하며 글을 시작합니다. putting young people in situations는 실험 대상자들에게 일부러 자신의 소신과 집단의 의견이 충돌하는 곤란한 환경을 만들어 주었다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has been studied (수동태): be동사(been)+p.p.(studied) 구조. study는 타동사인데 뒤에 목적어가 없어서 수동구조 has been studied 형태로 쓴다. 현재완료(have/has+p.p.)와 결합된 형태이다. 기본구조: V + O</div><div class=\"lec-gr-item\">putting (동명사): 전치사 by의 목적어 역할을 하며, young people을 목적어로 취하고 있다.</div><div class=\"lec-gr-item\">where (관계부사): 선행사 situations를 수식하며, 뒤에는 주어(they)+동사(are asked)를 갖춘 완전한 절이 이어진다.</div><div class=\"lec-gr-item\">are asked to make (수동태): be동사(are)+p.p.(asked) 구조. ask는 타동사로 ask+O+toV(5형식) 구조인데 목적어가 주어로 올라가 수동구조 are asked가 되고, 뒤의 목적보어인 toV(to make)는 그대로 남는다.</div><div class=\"lec-gr-item\">to make (to부정사): 5형식 동사 ask의 수동태 구조에서 목적격 보어로 남은 to부정사이다.</div><div class=\"lec-gr-item\">where (관계부사): 선행사 a choice or decision을 수식하며, 뒤에는 완전한 절(that appears...)이 이어진다.</div><div class=\"lec-gr-item\">to go against (to부정사): 동사 appear 뒤에서 보어 역할을 하는 to부정사이다.</div><div class=\"lec-gr-item\">is saying (현재진행): be동사(is) + 현재분사(saying) 형태로, &#39;말하고 있는 중이다&#39;라는 동작의 진행을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conformity</td><td class=\"m\">순응, 일치</td></tr><tr><td class=\"w\">go against</td><td class=\"m\">~에 거스르다, ~에 반하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">흥미로운 점은</span><span class=\"en\"><b>The <span class=\"grammar-hl\">fascinating</span> thing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이런 연구들의 결과에 관한</span><span class=\"en\"><b>about the results of these studies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">순응이 고르게 퍼져 있지 않다는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is that</span> conformity <span class=\"grammar-hl\">is not spread</span> equally</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 연령 집단에 걸쳐.</span><span class=\"en\"><b>across all age groups.</b></span></div></div><div class=\"lec-sent-ko\">이런 연구들의 결과에 관한 흥미로운 점은 순응이 모든 연령 집단에 걸쳐 고르게 퍼져 있지 않다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 실험의 핵심적인 발견을 제시합니다. not spread equally across all age groups는 십 대라고 해서 다 똑같이 친구를 따라가는 것이 아니라, 나이에 따라 그 정도에 뚜렷한 차이가 있다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">fascinating (현재분사(형용사)): fascinating이 명사 thing을 수식하며, 명사가 주는 감정이나 성질(~하게 하는)을 나타낸다.</div><div class=\"lec-gr-item\">is that 명사절 접속사 that: be동사 is의 보어 역할을 하는 명사절을 이끌며, 뒤에는 완전한 문장이 온다.</div><div class=\"lec-gr-item\">is not spread (수동태): be동사(is)+p.p.(spread) 구조. spread는 타동사인데 뒤에 목적어가 없어서 수동구조 is spread 형태로 쓴다. 기본구조: V + O</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conformity</td><td class=\"m\">순응, 일치</td></tr><tr><td class=\"w\">fascinating</td><td class=\"m\">대단히 흥미로운, 매력적인</td></tr><tr><td class=\"w\">equally</td><td class=\"m\">평등하게, 동일하게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서,</span><span class=\"en\"><b>Thus,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람에게 동조하려는 의지는</span><span class=\"en\"><b>the willingness <span class=\"grammar-hl\">to go along with</span> others</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정점에 도달한다</span><span class=\"en\"><b>reaches a peak</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">14세 무렵.</span><span class=\"en\"><b>around the age of 14.</b></span></div></div><div class=\"lec-sent-ko\">그래서, 다른 사람에게 동조하려는 의지는 14세 무렵 정점에 도달한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;연령별 차이&#39;에 대한 구체적인 사례를 들어 뒷받침합니다. reaches a peak around the age of 14는 중학교 1~2학년 시기가 주변 친구들의 시선을 가장 의식하고 집단의 분위기에 휩쓸리기 쉬운 ‘순응의 절정기’임을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to go along with (to부정사): 형용사적 용법으로 쓰여 앞의 명사 willingness를 수식한다.</div><div class=\"lec-gr-item\">go along with (관용표현): &#39;~에 동조하다&#39;, &#39;~에 찬성하다&#39;라는 의미의 구동사(숙어)이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">willingness</td><td class=\"m\">기꺼이 하는 마음, 의향</td></tr><tr><td class=\"w\">go along with</td><td class=\"m\">~에 동조하다, ~을 따르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 이후에</span><span class=\"en\"><b>After that,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 경향은 감소하며,</span><span class=\"en\"><b>this tendency decreases,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 16세나 17세 무렵</span><span class=\"en\"><b>so that by 16 or 17,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">청소년들은 훨씬 더 잘 할 수 있게 된다</span><span class=\"en\"><b>young people are much more able</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집단에 반대하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to disagree</span> with the group</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들 자신의 의견을 옹호하는 것을.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">to stand up for</span> their own opinion.</b></span></div></div><div class=\"lec-sent-ko\">그 이후에 이 경향은 감소하며, 그래서 16세나 17세 무렵, 청소년은 집단에 반대하고 그들 자신의 의견을 옹호하는 것을 훨씬 더 잘 할 수 있게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 14세 이후에 일어나는 변화를 설명하며 앞 문장과 대조를 이룹니다. stand up for their own opinion은 고등학생 나이가 되면 친구들의 압박에 굴복하지 않고 자신이 옳다고 믿는 것을 당당하게 말할 수 있는 심리적 독립심이 생긴다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to disagree (to부정사): 형용사 able을 수식하여 그 범위를 한정하는 부사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">to stand up for (to부정사): 형용사 able을 수식하며, and를 통해 앞의 to disagree와 병렬 구조를 이룬다.</div><div class=\"lec-gr-item\">stand up for (관용표현): &#39;~을 옹호하다&#39;, &#39;~을 지지하다&#39;라는 의미의 구동사(숙어)이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tendency</td><td class=\"m\">경향, 추세</td></tr><tr><td class=\"w\">decrease</td><td class=\"m\">줄어들다, 감소하다</td></tr><tr><td class=\"w\">disagree</td><td class=\"m\">의견이 다르다, 일치하지 않다</td></tr><tr><td class=\"w\">stand up for</td><td class=\"m\">~을 옹호하다, ~을 지지하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 중요한 발견이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">This is an important finding</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 중요한 발견이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지 설명한 연령대별 순응성의 변화가 인간의 발달 과정을 이해하는 데 있어 매우 가치 있는 정보라는 점을 역설하며 주의를 환기합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This is an important finding 2형식(SVC) 구조: 주어(This), 동사(is), 주격보어(finding)로 이루어진 문장 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">finding</td><td class=\"m\">조사 결과, 발견</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 입증한다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">demonstrates</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영향력이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> the influence</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또래 집단의</span><span class=\"en\"><b>of the peer group</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동일하지 않다는 것을</span><span class=\"en\"><b>is not the same</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 연령에 걸쳐.</span><span class=\"en\"><b>across all ages.</b></span></div></div><div class=\"lec-sent-ko\">이것은 또래 집단의 영향력이 모든 연령에 걸쳐 동일하지 않다는 것을 입증한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 연구의 결론을 다시 한번 명확히 정리합니다. influence of the peer group is not the same은 청소년기 전체에 걸쳐 친구가 절대적인 영향을 끼치는 것이 아니라, 성장에 따라 그 영향력에서 점차 벗어나게 됨을 확인해 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">demonstrates that 명사절 접속사 that: 타동사 demonstrates의 목적어 역할을 하는 명사절을 이끌며, 뒤에는 완전한 문장이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">demonstrate</td><td class=\"m\">보여주다, 입증하다</td></tr><tr><td class=\"w\">influence</td><td class=\"m\">영향, 영향력</td></tr><tr><td class=\"w\">peer group</td><td class=\"m\">또래 집단</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">청소년이 성숙해짐에 따라,</span><span class=\"en\"><b>As young people mature,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 더 회복 탄력적이게 되고,</span><span class=\"en\"><b>they become more resilient,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 더 잘 할 수 있게 된다</span><span class=\"en\"><b>and more able</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 의견을 방어하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to defend</span> their opinions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개인으로서.</span><span class=\"en\"><b>as individuals.</b></span></div></div><div class=\"lec-sent-ko\">청소년이 성숙해짐에 따라, 그들은 더 회복 탄력적이게 되고, 개인으로서 자신의 의견을 방어하는 것을 더 잘 할 수 있게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 최종 결론으로, 나이가 들면서 나타나는 긍정적인 변화를 설명합니다. more resilient는 친구들이 비난하거나 비웃더라도 상처받지 않고 자기 주관을 지킬 수 있는 내면의 단단함이 형성된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to defend (to부정사): 형용사 able을 수식하여 그 구체적 내용을 설명하는 부사적 용법으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mature</td><td class=\"m\">성장하다, 성숙해지다</td></tr><tr><td class=\"w\">resilient</td><td class=\"m\">회복력 있는, 탄력 있는</td></tr><tr><td class=\"w\">defend</td><td class=\"m\">방어하다, 옹호하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>십 대의 순응성은 나이에 따라 다르게 나타나며, 이는 특정 실험 상황을 통해 연구되었다.</li><li>14세 무렵은 친구들의 의견을 무조건 따르려는 순응성이 가장 강해지는 정점의 시기이다.</li><li>16~17세가 되면 집단의 의견에 반대할 수 있는 능력이 생기며 순응성이 다시 줄어든다.</li><li>청소년은 성숙할수록 또래의 영향에서 벗어나 개인으로서의 주관을 지킬 수 있는 내면의 힘을 갖게 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Conformity reaches its peak at age 14, while it gradually decreases as adolescents matu
