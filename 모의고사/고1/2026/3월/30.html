있는 환경임에도 굳이 비싼 돈을 들여 헬스장의 트레드밀(Treadmill) 위에서 걷는 현대인의 모습은 같은 신체 활동이라도 사회의 경제적 풍요도에 따라 사회적 맥락(Social Context)이 완전히 달라질 수 있음을 잘 보여줍니다. 결과적으로 걷기라는 행위는 지역에 따라 강요된 신체 노동이 되기도 하고, 누군가에게는 건강을 위해 기꺼이 비용을 지불하는 선택적 유희가 되기도 한다는 경제학적 아이러니를 이해하는 것이 이 글의 핵심입니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01개발도상국의 교통 현실</div><ul><li>자원 부족으로 인해 대규모 교통 시스템을 운영하기 힘든 개발도상국에서는 걷기가 여전히 주요 교통수단이다.</li><li>주요 교통수단: 걷기 (walking)</li><li>제약 요인: 자원 부족 (constraints on resources)</li><li>광범위한 대중교통 체계(extensive transit systems) 운영의 한계</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02생존을 위한 고단한 노동</div><ul><li>개발도상국 사람들에게 걷기는 선택이 아닌, 생산적 능력을 소모하는 불가피한 짐이다.</li><li>매일 먼 거리를 이동하며 아껴야 할 인간의 에너지(human energy)를 소진함</li><li>걷기는 생산적 능력(productive capability)을 갉아먹는 활동임</li><li>피할 수 없는 짐: 불가피한 부담 (unavoidable burden)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03선진국의 상반된 태도</div><ul><li>북미와 서유럽에서는 걷기를 건강하고 긍정적인 행위로 여기며 이를 장려하는 정책을 펼친다.</li><li>걷기를 효율적(efficient)이고 건강에 좋은(healthful) 것으로 인식함</li><li>더 많이 걸어야 한다는 사회적 합의와 기존 추세의 반전 시도</li><li>태도와 정책: 개발도상국과는 정반대 (just the opposite)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04걷기의 역설적 현상</div><ul><li>실제 이동 수단으로 걷는 대신, 헬스장에서 기계를 이용해 걷기를 흉내 내는 역설적 상황이 발생한다.</li><li>핵심 기구: 러닝머신 (treadmills)</li><li>일상적인 이동 목적(transport purpose) 대신 운동을 위해 걷기를 시뮬레이션함</li><li>현대 사회의 역설: 아이러니하게도 (ironically) 기계로 걷기를 재현함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">principal</td><td class=\"m\">주요한, 주된</td></tr><tr><td class=\"w\">constraint</td><td class=\"m\">제약, 제한</td></tr><tr><td class=\"w\">extensive</td><td class=\"m\">광범위한, 대규모의</td></tr><tr><td class=\"w\">transit</td><td class=\"m\">대중교통, 수송</td></tr><tr><td class=\"w\">on foot</td><td class=\"m\">도보로, 걸어서</td></tr><tr><td class=\"w\">expend</td><td class=\"m\">(에너지·시간 등을) 소비하다, 쓰다</td></tr><tr><td class=\"w\">spare</td><td class=\"m\">할애하다, 내어주다, 아끼다</td></tr><tr><td class=\"w\">unavoidable</td><td class=\"m\">피할 수 없는, 불가피한</td></tr><tr><td class=\"w\">burden</td><td class=\"m\">부담, 짐</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consume</td><td class=\"m\">소모하다, 쓰다</td></tr><tr><td class=\"w\">productive</td><td class=\"m\">생산적인, 결실 있는</td></tr><tr><td class=\"w\">capability</td><td class=\"m\">능력, 역량</td></tr><tr><td class=\"w\">opposite</td><td class=\"m\">반대, 정반대의 것</td></tr><tr><td class=\"w\">efficient</td><td class=\"m\">효율적인, 능률적인</td></tr><tr><td class=\"w\">reverse</td><td class=\"m\">뒤바꾸다, 반전시키다</td></tr><tr><td class=\"w\">ironically</td><td class=\"m\">비꼬듯, 역설적으로</td></tr><tr><td class=\"w\">simulate</td><td class=\"m\">흉내 내다, 모의실험을 하다</td></tr><tr><td class=\"w\">accomplish</td><td class=\"m\">완수하다, 성취하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">개발도상국에서의 주요한 교통수단은</span><span class=\"en\"><b>The principal transportation mode in the <span class=\"grammar-hl\">developing world</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 대도시에서조차</span><span class=\"en\"><b>even in large cities,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여전히 걷기이다</span><span class=\"en\"><b>is still <span class=\"grammar-hl\">walking</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자원에 대한 제약 때문에</span><span class=\"en\"><b>because of constraints on the resources</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">광범위한 운송 체계를 운영하는 데 필요한</span><span class=\"en\"><b><span class=\"grammar-hl\">needed</span> <span class=\"grammar-hl\">to operate</span> extensive transit systems.</b></span></div></div><div class=\"lec-sent-ko\">상국에서의 주요한 교통수단은, 심지어 대도시에서조차, 여전히 걷기인데 이는 광범위한 운송 체계를 운영하는 데 필요한 자원에 대한 제약 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> constraints on the resources는 지하철이나 버스 노선망을 구축하고 운영할 국가적 자본이나 인프라가 턱없이 부족하다는 상황을 설명합니다. 글의 도입부에서 개발도상국 사람들이 왜 차를 타지 못하고 걸을 수밖에 없는지 그 근본적인 원인을 제시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">developing world (현재분사(형용사)): developing이 world를 수식하며 &#39;발전하고 있는(개발 중인)&#39;이라는 능동/진행의 의미를 나타냄.</div><div class=\"lec-gr-item\">walking (동명사): 문장의 주어인 The principal transportation mode를 설명하는 주격 보어 역할을 함.</div><div class=\"lec-gr-item\">needed (과거분사(형용사)): 과거분사구인 needed가 뒤에서 앞의 명사 resources를 수식하며, &#39;필요한 자원&#39;이라는 의미를 나타냄. (N + p.p. 구조)</div><div class=\"lec-gr-item\">to operate to부정사(형용사적 용법): resources(또는 needed)를 수식하여 &#39;운용하기 위해 필요한&#39; 또는 &#39;운용할&#39;이라는 용도나 목적을 나타냄.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">principal</td><td class=\"m\">주요한, 주된</td></tr><tr><td class=\"w\">constraint</td><td class=\"m\">제약, 제한</td></tr><tr><td class=\"w\">extensive</td><td class=\"m\">광범위한, 대규모의</td></tr><tr><td class=\"w\">transit</td><td class=\"m\">대중교통, 수송</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 긴 거리를 이동한다</span><span class=\"en\"><b>People cover long distances</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도보로</span><span class=\"en\"><b><span class=\"grammar-hl\">on foot</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>every day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 인간의 에너지를 소비한다</span><span class=\"en\"><b>and expend human energy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 거의 내어 줄 수 없는</span><span class=\"en\"><b><span class=\"grammar-hl\">that they can hardly spare</span>.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 매일 도보로 긴 거리를 이동하고 그들이 거의 내어 줄 수 없는 인간의 에너지를 소비한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> can hardly spare는 생존을 위해 일하는 데 써야 할 에너지를 이동하는 데 다 써버려 정작 필요한 곳에 쓸 기운이 남아나지 않는 처절한 상황을 의미합니다. 앞 문장에서 언급한 자원 부족이 개인의 육체적 고통으로 이어지고 있음을 구체적으로 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">on foot (관용표현): &#39;도보로&#39;, &#39;걸어서&#39;라는 뜻의 숙어적 표현.</div><div class=\"lec-gr-item\">that they can hardly spare (관계대명사): 선행사 human energy를 수식하는 목적격 관계대명사절로, 타동사 spare의 목적어가 비어 있는 구조임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">on foot</td><td class=\"m\">도보로, 걸어서</td></tr><tr><td class=\"w\">expend</td><td class=\"m\">(에너지·시간 등을) 소비하다, 쓰다</td></tr><tr><td class=\"w\">spare</td><td class=\"m\">할애하다, 내어주다, 아끼다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러한 조건 하에서의 걷기는</span><span class=\"en\"><b><span class=\"grammar-hl\">Walking</span> under those conditions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피할 수 없는 부담이다</span><span class=\"en\"><b>is an unavoidable burden</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생산적인 능력을 소모하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that consumes productive capability</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러한 조건 하에서의 걷기는 생산적인 능력을 소모하는 피할 수 없는 부담이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> unavoidable burden은 걷는 행위가 즐거운 선택이 아니라, 돈을 벌거나 삶을 개선하는 데 써야 할 시간과 노동력을 갉아먹는 강제된 고난이라는 의미입니다. 개발도상국에서 걷기가 갖는 부정적인 경제적·사회적 측면을 요약하며 첫 번째 단락을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Walking (동명사): 문장에서 주어 역할을 하는 명사적 성격의 -ing 형태.</div><div class=\"lec-gr-item\">that consumes productive capability (관계대명사): 선행사 burden을 수식하는 주격 관계대명사절로, 뒤에 주어가 빠진 불완전한 절이 이어짐.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unavoidable</td><td class=\"m\">피할 수 없는, 불가피한</td></tr><tr><td class=\"w\">burden</td><td class=\"m\">부담, 짐</td></tr><tr><td class=\"w\">consume</td><td class=\"m\">소모하다, 쓰다</td></tr><tr><td class=\"w\">productive</td><td class=\"m\">생산적인, 결실 있는</td></tr><tr><td class=\"w\">capability</td><td class=\"m\">능력, 역량</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 북미와 서유럽에서는</span><span class=\"en\"><b>In North America and Western Europe, however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 태도와 정책이 정반대이다:</span><span class=\"en\"><b>the attitude and policies are just the opposite:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">걷기는 효율적이고, 건강에 좋으며, 자연스러운 것이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">walking</span> is efficient, healthful, and natural.</b></span></div></div><div class=\"lec-sent-ko\">그러나, 북미와 서유럽에서는, 그 태도와 정책이 정반대인데, 걷기는 효율적이고, 건강에 좋으며, 자연스러운 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> just the opposite은 앞서 언급된 개발도상국의 고통스러운 걷기와 달리, 선진국에서는 걷기를 긍정적이고 권장할 만한 가치로 여긴다는 대조적인 시각을 보여줍니다. 문장 중간의 however를 기점으로 글의 배경이 결핍의 공간에서 여유의 공간으로 전환됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">walking (동명사): 콜론(:) 뒤의 절에서 주어 역할을 하는 명사적 성격의 -ing 형태.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opposite</td><td class=\"m\">반대, 정반대의 것</td></tr><tr><td class=\"w\">efficient</td><td class=\"m\">효율적인, 능률적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 그것을 더 많이 해야 하고</span><span class=\"en\"><b>We should do more of it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 거의 모든 사람이 동의하듯이 —</span><span class=\"en\"><b>— almost everybody agrees —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현재의 추세 중 일부는</span><span class=\"en\"><b>and some of the current trends</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뒤바뀌어야 한다.</span><span class=\"en\"><b><span class=\"grammar-hl\">should be reversed</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 거의 모든 사람이 동의하듯이 그것을 더 많이 해야 하고, 현재의 추세 중 일부는 뒤바뀌어야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> current trends should be reversed는 자동차 중심의 생활 방식에서 벗어나 다시 걷는 문화로 돌아가야 한다는 정책적 방향성을 의미합니다. 걷기를 적극적으로 권장하는 선진 사회의 분위기를 뒷받침하는 설명입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">should be reversed (수동태): be동사(be)+p.p.(reversed) 구조. reverse는 타동사인데 뒤에 목적어가 없어서 수동구조 should be reversed 형태로 쓴다. 기본구조: V + O (reverse the trends).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reverse</td><td class=\"m\">뒤바꾸다, 반전시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아이러니하게</span><span class=\"en\"><b>Ironically,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 인기 있는 운동 기구 중에는</span><span class=\"en\"><b><span class=\"grammar-hl\">among the most popular exercise machines</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">헬스장과 가정에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in health clubs and in homes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">걷기를 모방하는 러닝머신이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are treadmills</span> <span class=\"grammar-hl\">that simulate walking</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그런데 그것(걷기)은 그렇지 않다면 달성될 수 있을 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">which</span> <span class=\"grammar-hl\">could be otherwise accomplished</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교통의 목적으로</span><span class=\"en\"><b>with a transport purpose</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거리에서</span><span class=\"en\"><b>on the street.</b></span></div></div><div class=\"lec-sent-ko\">아이러니하게, 걷기를 모방하는 러닝머신이 헬스장과 가정에서 가장 인기 있는 운동 기구 중 하나인데, 그것(걷기)은 그렇지 않다면 거리에서 교통의 목적으로 달성될 수 있을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> otherwise accomplished with a transport purpose는 목적지까지 실제로 걸어가기만 해도 얻을 수 있는 운동 효과를, 굳이 돈과 시간을 들여 실내 기계 위에서 내고 있는 선진국 사람들의 모순된 행동을 꼬집습니다. 이동 수단으로서의 걷기를 거부하면서 운동으로서의 걷기에 집착하는 현대인의 모습을 풍자하며 글을 맺습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">among the most popular exercise machines in health clubs and in homes are treadmills (도치): 전치사구(among ~ homes)가 강조를 위해 문장 앞으로 나가면서 주어(treadmills)와 동사(are)의 위치가 바뀐 &#39;장소/범위 부사구 도치&#39; 구조.</div><div class=\"lec-gr-item\">that simulate walking (관계대명사): 선행사 treadmills를 수식하는 주격 관계대명사절로, 뒤에 주어가 빠진 구조임.</div><div class=\"lec-gr-item\">walking (동명사): 타동사 simulate의 목적어 역할을 하는 명사적 성격의 -ing 형태.</div><div class=\"lec-gr-item\">which (관계대명사): 앞선 walking 또는 앞 문장의 내용을 선행사로 하는 관계대명사의 계속적 용법.</div><div class=\"lec-gr-item\">could be otherwise accomplished (수동태): be동사(be)+p.p.(accomplished) 구조. accomplish는 타동사인데 뒤에 목적어가 없어서 수동구조 could be accomplished 형태로 쓴다. 기본구조: V + O (accomplish a purpose).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ironically</td><td class=\"m\">비꼬듯, 역설적으로</td></tr><tr><td class=\"w\">simulate</td><td class=\"m\">흉내 내다, 모의실험을 하다</td></tr><tr><td class=\"w\">accomplish</td><td class=\"m\">완수하다, 성취하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>개발도상국은 자원 부족으로 인해 대도시에서도 걷기가 주요 이동 수단이며, 이는 생존 에너지를 갉아먹는 고통스러운 짐이다.</li><li>반면 선진국에서는 걷기를 건강하고 효율적인 활동으로 보며 정책적으로도 적극 권장한다.</li><li>그러나 선진국 사람들은 실제 이동을 위해 걷기보다는 헬스장에서 기계(러닝머신)를 이용해 걷는 모순적인 모습을 보인다.</li><li>결국 같은 &#39;걷기&#39;라도 사회적 경제적 환경에 따라 생존을 위한 고통이 되기도 하고, 여유를 위한 선택이 되기도 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Walking is perceived as an unavoidable burden that drains productivity in the developing world, while it is promoted as an efficient and healthful activity in developed regions.</div>\n              <div class=\"lec-final-sum-ko\">걷기는 개발도상국에서 생산성을 소모하는 불가피한 부담으로 인식되는 반면, 선진국에서는 효율적이고 건강에 좋은 활동으로 장려된다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_03월_30번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_30번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_30번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_03월_30번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_03월_30번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_03월_30번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_03월_30번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2026년_03월_30번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_30번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_30번_강의_audio/10.mp3","hl":"m
