x/k5/8A15OPx70mRnG4ZIIHPXHXAyQcc57jHPBpQR6jj3zxR/SAMD6emO1L+P8An/P/AOvPNNLAEDPUE54x8vX8u/p3pcj1H50B/S80LRTSwHfrngEZ469+x4PuQOtG9cbsjHPcf4/T+uKP6/zD+kOoH+f84FNLAY5HPQZ5OM5x6474HHc46G5T3HUg8jjGff2/rR/X3huLwMf/AF/1+ue/U+9LSZHqOp79x1/+v+dIGU55Xg46j6j8eD+R9M0AO/yaP6fhnvx7f/qppYDv69P9nqPqKA6kZyPfkcfnj/PTNF+v9agOopMj1Hfv6dfy7/rikLDjkc8dR+GPf+f1wCeX/Di/r/hhevuO/wDn3/l+q4z/APrI/lSZHqMDtn+7147Y4z3zjOMcm4ZwCM4z/P8AwoGLR3/z/n8s9aaCo4BHf0HTGfbI746d8UvGc5HT+XX+f+PagBc/56/59+wo/lSbhnGRzkYyM/L97v24zgcfSjcvqOoH4np/n/CgBaP89f6dKTcM4yM4z1Hbrx7d/Tj1pNw5JIxnA9T2P60AKAB0/wA4GKCevB4/D8R/jxxnmj0OcDr+h98e/wCFGV65Hp1HbP8A9egAP/1+/wDT+v5Gjtz/AJ9/b8/xpAwYdR3zz0xwfy4z6ZpSwHUgfj+P+f8ACgBaKTI46c8j8fTsfw/rSFlHVgOfUfTue3egP63uOopCQBkkY6Z/T9O/p3paADP9P1prfdJHYZHXtz0/pj8KXI9Rz78YHX/P4GhuAT6A9s/pxn6Z5o2WvTcD/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">From Familiarity to Mastery: Why Teaching Is the Best Way to Learn<small>익숙함에서 숙달로: 가르치기가 최고의 학습법인 이유</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 책을 여러 번 읽어 내용이 익숙해진 것을 완벽히 이해했다고 착각하는 현상을 능숙함의 착각(Illusion of Competence)이라고 하는데, 이는 마치 길거리에서 눈에 익은 사람의 얼굴을 보고 그 사람의 이름이나 직업까지 다 안다고 오해하는 것과 비슷합니다. 이를 극복하려면 단순히 정보를 눈으로만 훑는 것이 아니라 뇌에서 정보를 직접 끄집어내어 설명해보는 능동적 회상(Active Recall) 과정이 필수적이며, 이는 내가 무엇을 알고 무엇을 모르는지 객관적으로 파악하는 메타인지(Metacognition) 능력을 높여줍니다. 특히 어려운 개념을 아주 쉬운 언어로 누군가에게 가르치듯 설명하며 지식의 빈틈을 찾아내는 파인만 기법(Feynman Technique)은 단순한 익숙함을 실질적인 장기 기억(Long-term Memory)으로 전환하는 데 매우 효과적인 도구입니다. 결과적으로 &#39;가르치는 사람&#39;의 관점을 갖는다는 것은 정보를 체계적으로 재구성하는 지식의 구조화(Structuring of Knowledge)를 통해 진정한 학습의 완성으로 나아가는 핵심적인 방법입니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01친숙함과 숙달의 혼동</div><ul><li>학생들은 내용을 눈에 익힌 것을 실제로 알고 있는 것으로 착각하는 오류를 범한다.</li><li>능숙함의 착각(illusion of competence) 발생</li><li>정보를 단순히 알아보는 것(recognizing)과 독립적으로 회상(recall)하는 것의 차이</li><li>핵심 키워드: 친숙함(familiarity), 숙달(mastery)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02수동적 학습의 위험성</div><ul><li>수동적인 공부 방식은 인지적 편향을 강화하여 자신의 이해도를 실제보다 높게 평가하게 만든다.</li><li>수동적인 학습 방법(passive study methods)의 한계</li><li>인지적 편향(cognitive bias)으로 인한 이해도 과대평가(overestimate)</li><li>실제 적용이나 문제 해결 시 발생하는 어려움</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03가르치기 학습법의 효과</div><ul><li>누군가를 가르치는 과정은 지식의 빈틈을 발견하게 하고 정보를 깊이 있게 처리하도록 돕는다.</li><li>심층적인 정보 처리(deep processing) 유도</li><li>능동적인 회상(active recall)과 지식의 구조적 조직화(structured organization)</li><li>지식의 빈틈(gaps in knowledge)을 시각화하고 드러냄</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04구체적인 실천 전략</div><ul><li>가상의 학생이나 동료에게 설명하는 등 구체적인 기법을 통해 학습 효과를 극대화할 수 있다.</li><li>파인만 기법(Feynman Technique) 활용</li><li>가상의 학생에게 가르치기 또는 동료 학습(peer-teaching)</li><li>타인을 위한 설명글 작성하기</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05진정한 숙달로의 전환</div><ul><li>교사의 관점을 채택함으로써 표면적인 지식을 견고하고 신뢰할 수 있는 진정한 이해로 변모시킨다.</li><li>표면적인 친숙함(surface familiarity)에서 탈피</li><li>지식의 빈틈을 채우고 진정한 숙달(real mastery) 확보</li><li>견고하고 신뢰할 수 있는 이해(solid, reliable understanding) 구축</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mistake</td><td class=\"m\">오해하다, 착각하다</td></tr><tr><td class=\"w\">familiarity</td><td class=\"m\">익숙함, 친숙함</td></tr><tr><td class=\"w\">mastery</td><td class=\"m\">숙달, 통달</td></tr><tr><td class=\"w\">illusion</td><td class=\"m\">착각, 환상</td></tr><tr><td class=\"w\">competence</td><td class=\"m\">능력, 역량</td></tr><tr><td class=\"w\">genuine</td><td class=\"m\">진짜의, 진실한</td></tr><tr><td class=\"w\">recall</td><td class=\"m\">기억해 내다, 상기하다</td></tr><tr><td class=\"w\">cognitive bias</td><td class=\"m\">인지적 편향</td></tr><tr><td class=\"w\">overestimate</td><td class=\"m\">과대평가하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">counter</td><td class=\"m\">대응하다, 반박하다</td></tr><tr><td class=\"w\">processing</td><td class=\"m\">처리, 가공</td></tr><tr><td class=\"w\">reveal</td><td class=\"m\">드러내다, 밝히다</td></tr><tr><td class=\"w\">gap</td><td class=\"m\">공백, 격차</td></tr><tr><td class=\"w\">employ</td><td class=\"m\">이용하다, 고용하다</td></tr><tr><td class=\"w\">adopt</td><td class=\"m\">채택하다, 받아들이다</td></tr><tr><td class=\"w\">mindset</td><td class=\"m\">사고방식, 태도</td></tr><tr><td class=\"w\">transform</td><td class=\"m\">변형시키다, 바꾸다</td></tr><tr><td class=\"w\">solid</td><td class=\"m\">견고한, 확실한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">학생들은 흔히 친숙함을 착각한다</span><span class=\"en\"><b>Students often mistake familiarity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진정한 숙달과</span><span class=\"en\"><b>with true mastery,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위험한 ‘능력의 착각’을 만들어 내면서</span><span class=\"en\"><b><span class=\"grammar-hl\">creating</span> a dangerous “illusion of competence”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정보를 인식하는 것이 진짜 지식처럼 느껴지는</span><span class=\"en\"><b><span class=\"grammar-hl\">where</span> <span class=\"grammar-hl\">recognizing information</span> feels like genuine knowledge,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그들은 어려움을 겪는다</span><span class=\"en\"><b>but they struggle</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 독립적으로 회상하거나 적용하도록 요구받을 때</span><span class=\"en\"><b>when <span class=\"grammar-hl\">asked</span> <span class=\"grammar-hl\">to recall or apply</span> it independently.</b></span></div></div><div class=\"lec-sent-ko\">학생들은 흔히 친숙함을 진정한 숙달로 착각하고, 정보를 인식하는 것이 진짜 지식인 것처럼 느껴지는 위험한 ‘능력의 착각’을 만들어 내지만, 그들이 독립적으로 그것을 회상하거나 적용하도록 요구받을 때 어려움을 겪는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 학생들이 공부할 때 흔히 빠지는 함정을 제시합니다. illusion of competence는 눈에 익어서 안다고 착각하는 상태를 의미합니다. 단순히 교재를 읽었을 때 내용을 &#39;알아보는 것&#39;과, 아무것도 없는 상태에서 그 내용을 &#39;꺼내 쓰는 것&#39; 사이에는 큰 차이가 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">creating (분사구문): 원래 절로 변환하면 and it creates 또는 as they create로 쓸 수 있으며, 앞 절의 내용이 가져오는 결과나 부수적인 상황을 나타낸다.</div><div class=\"lec-gr-item\">where (관계부사): 선행사인 &#39;illusion of competence&#39;를 수식하며, 뒤에는 주어(recognizing information)와 동사(feels)를 모두 갖춘 완전한 절이 이어진다.</div><div class=\"lec-gr-item\">recognizing information (동명사): recognizing이 동사적 성질을 가져 목적어(information)를 취하며, where절 내에서 주어 역할을 하는 명사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">asked (분사구문): 원래 절로 변환하면 when they are asked가 된다. 접속사(when)가 생략되지 않은 형태이며, 주어(they)와 be동사가 생략된 수동 의미의 분사구문이다.</div><div class=\"lec-gr-item\">to recall or apply (to부정사): 5형식 동사 ask의 목적보어 구조(ask + O + toV)에서 유래한 것으로, 수동 구조(be asked) 뒤에 목적보어였던 to부정사가 그대로 남아있는 형태다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mistake</td><td class=\"m\">오해하다, 착각하다</td></tr><tr><td class=\"w\">familiarity</td><td class=\"m\">익숙함, 친숙함</td></tr><tr><td class=\"w\">mastery</td><td class=\"m\">숙달, 통달</td></tr><tr><td class=\"w\">illusion</td><td class=\"m\">착각, 환상</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">competence</td><td class=\"m\">능력, 역량</td></tr><tr><td class=\"w\">genuine</td><td class=\"m\">진짜의, 진실한</td></tr><tr><td class=\"w\">recall</td><td class=\"m\">기억해 내다, 상기하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 인지적 편향은</span><span class=\"en\"><b>This cognitive bias,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수동적인 학습 방법에 의해 강화되는</span><span class=\"en\"><b><span class=\"grammar-hl\">strengthened</span> by passive study methods,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학습자들을 이끈다</span><span class=\"en\"><b><span class=\"grammar-hl\">leads learners</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 이해를 과대평가하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to overestimate</span> their understanding.</b></span></div></div><div class=\"lec-sent-ko\">수동적인 학습 방법에 의해 강해지는 이러한 인지적 편향은 학습자가 자신의 이해를 과대평가하도록 이끈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;착각&#39;이 왜 발생하는지 원인을 설명합니다. passive study methods는 눈으로만 읽거나 강의를 듣기만 하는 식의 공부를 뜻합니다. 이런 방식은 뇌를 적극적으로 쓰지 않기 때문에, 실제 실력보다 자기가 더 많이 알고 있다고 믿게 만드는 심리적 오류를 키운다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">strengthened (과거분사(형용사)): strengthened가 앞의 명사구인 This cognitive bias를 수식하며 &#39;강화된&#39;이라는 수동의 의미를 나타낸다. This cognitive bias that is strengthened의 축약 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">leads learners to overestimate 5형식(SVOC) 구조: lead가 타동사로 쓰여 lead + 목적어(learners) + 목적보어(to overestimate) 구조를 취하며, 목적어가 목적보어의 행동을 하도록 이끄는 구조를 만든다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cognitive bias</td><td class=\"m\">인지적 편향</td></tr><tr><td class=\"w\">overestimate</td><td class=\"m\">과대평가하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자료를 가르치는 것은 (심지어 비공식적으로나 상상 속에서라도)</span><span class=\"en\"><b><span class=\"grammar-hl\">Teaching materials</span> (even informally or imaginatively)</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 착각에 적극적으로 대응한다</span><span class=\"en\"><b>actively counters this illusion</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심층 처리, 능동적 회상, 구조적 조직화를 요구함으로써</span><span class=\"en\"><b>by <span class=\"grammar-hl\">requiring</span> deep processing, active recall, <span class=\"grammar-hl\">structured</span> organization,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 지식의 빈틈을 드러냄으로써</span><span class=\"en\"><b>and <span class=\"grammar-hl\">revealing</span> gaps in knowledge.</b></span></div></div><div class=\"lec-sent-ko\">(심지어 비공식적으로나 상상 속에서라도) 자료를 가르치는 것은 심층 처리, 능동적 회상, 구조적 조직화를 요구하고 지식의 빈틈을 드러냄으로써 이러한 착각에 적극적으로 대응한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제기된 문제에 대한 해결책을 제시하는 전환점입니다. actively counters this illusion은 누군가를 가르쳐 보는 행위가 &#39;안다는 착각&#39;을 깨부수는 강력한 도구가 된다는 뜻입니다. 남을 가르치려면 머릿속에서 정보를 끄집어내고 정리해야 하므로, 그 과정에서 내가 revealing gaps in knowledge, 즉 무엇을 모르는지가 명확히 드러나게 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Teaching materials (동명사): &#39;가르치는 것&#39;이라는 행위가 목적어(materials)를 취해 주어로 쓰였다. 동명사 주어는 단수 취급하므로 본동사 counter에 -s가 붙었다.</div><div class=\"lec-gr-item\">requiring (동명사): 전치사 by의 목적어로 쓰였으며, 뒤에 여러 개의 명사적 어구들을 목적어로 취하여 &#39;요구함으로써&#39;라는 의미의 명사적 역할을 수행한다.</div><div class=\"lec-gr-item\">structured (과거분사(형용사)): structured가 명사 organization을 수식하여 &#39;구조화된 조직&#39;이라는 의미를 만든다. organization that is structured의 축약 구조다.</div><div class=\"lec-gr-item\">revealing (동명사): 전치사 by에 걸리는 병렬 구조의 일부로, gaps in knowledge를 목적어로 취하며 &#39;드러내는 것&#39;이라는 행위 개념을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">illusion</td><td class=\"m\">착각, 환상</td></tr><tr><td class=\"w\">recall</td><td class=\"m\">기억해 내다, 상기하다</td></tr><tr><td class=\"w\">counter</td><td class=\"m\">대응하다, 반박하다</td></tr><tr><td class=\"w\">processing</td><td class=\"m\">처리, 가공</td></tr><tr><td class=\"w\">reveal</td><td class=\"m\">드러내다, 밝히다</td></tr><tr><td class=\"w\">gap</td><td class=\"m\">공백, 격차</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 강력한 방법들을 도입한다</span><span class=\"en\"><b>It introduces powerful methods</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가상의 학생 가르치기, 학습 집단에서 또래 가르치기와 같은</span><span class=\"en\"><b>like <span class=\"grammar-hl\">teaching imaginary students</span>, peer­teaching in study groups,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Feynman 기법을 이용하기</span><span class=\"en\"><b><span class=\"grammar-hl\">employing the Feynman Technique</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 다른 사람들을 위해 설명 쓰기와 같은</span><span class=\"en\"><b>and <span class=\"grammar-hl\">writing explanations</span> for others.</b></span></div></div><div class=\"lec-sent-ko\">그것은 가상의 학생 가르치기, 학습 집단에서 또래 가르치기, Feynman 기법 이용하기, 그리고 다른 사람들을 위해 설명 쓰기와 같은 강력한 방법들을 도입한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 &#39;가르치기&#39;의 구체적인 예시들을 나열하여 독자의 이해를 돕습니다. Feynman Technique은 어려운 개념을 아주 쉬운 말로 설명해 보는 유명한 학습법을 가리킵니다. 실질적으로 어떻게 공부해야 &#39;착각&#39;에서 벗어날 수 있는지 실천 방안을 보여주는 단계입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">teaching imaginary students (동명사): 전치사 like의 목적어로 쓰인 명사구 내에서 &#39;가르치는 것&#39;이라는 활동/행위를 의미하는 명사적 역할을 한다.</div><div class=\"lec-gr-item\">employing the Feynman Technique (동명사): 전치사 like 뒤에 나열된 병렬 구조의 일부로, 동사적 성질을 유지하며 목적어(the Feynman Technique)를 취한다.</div><div class=\"lec-gr-item\">writing explanations (동명사): 전치사 like의 마지막 목적어 역할을 하며, explanations를 목적어로 취하는 명사적 어구로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">employ</td><td class=\"m\">이용하다, 고용하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">궁극적으로</span><span class=\"en\"><b>Ultimately,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가르치는 사람의 사고방식을 채택하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">adopting</span> the teacher mindset</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">표면적인 친숙함을 변화시킨다</span><span class=\"en\"><b>transforms surface familiarity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진짜 숙달로</span><span class=\"en\"><b>into real mastery,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지식의 빈틈을 드러내고 채우며</span><span class=\"en\"><b><span class=\"grammar-hl\">exposing and filling</span> gaps in knowledge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 견고하고 신뢰할 수 있는 이해를 보장하며</span><span class=\"en\"><b>and <span class=\"grammar-hl\">ensuring</span> solid, reliable understanding.</b></span></div></div><div class=\"lec-sent-ko\">궁극적으로, 가르치는 사람의 사고방식을 채택하는 것은 표면적인 친숙함을 진짜 숙달로 변화시키고, 지식의 빈틈을 드러내고 채우며, 견고하고 신뢰할 수 있는 이해를 보장한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체를 요약하며 결론을 맺습니다. surface familiarity into real mastery는 단순히 눈에 익은 수준을 넘어, 완전히 내 것으로 만드는 변화를 뜻합니다. 가르치는 사람의 관점에서 공부하면 모르는 부분을 찾아내어 채울 수 있으므로, 결과적으로 흔들리지 않는 실력을 쌓게 된다는 점을 확언합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">adopting (동명사): &#39;채택하는 것&#39;이라는 행위의 의미로 문장의 주어 자리에 쓰였으며, 동사 transforms의 주어 역할을 수행한다.</div><div class=\"lec-gr-item\">exposing and filling (분사구문): 원래 절로 변환하면 and it exposes and fills가 된다. 주절의 동작(transforms)에 수반되는 부연 설명이나 결과를 나타낸다.</div><div class=\"lec-gr-item\">ensuring (분사구문): 원래 절로 변환하면 and it ensures가 되며, 앞선 동작들로 인해 이어지는 결과를 부사적으로 설명하는 현재분사 구문이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">familiarity</td><td class=\"m\">익숙함, 친숙함</td></tr><tr><td class=\"w\">mastery</td><td class=\"m\">숙달, 통달</td></tr><tr><td class=\"w\">gap</td><td class=\"m\">공백, 격차</td></tr><tr><td class=\"w\">adopt</td><td class=\"m\">채택하다, 받아들이다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">mindset</td><td class=\"m\">사고방식, 태도</td></tr><tr><td class=\"w\">transform</td><td class=\"m\">변형시키다, 바꾸다</td></tr><tr><td class=\"w\">solid</td><td class=\"m\">견고한, 확실한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>학생들은 단순히 눈에 익은 것을 실제로 알고 있는 것으로 착각하는 &#39;능숙함의 착각&#39;에 빠지기 쉽다.</li><li>이는 읽기 위주의 수동적인 학습 방식 때문에 발생하며, 실제 실력을 과대평가하게 만든다.</li><li>이를 해결하기 위해서는 남을 가르치는 방식의 능동적인 학습이 필요하다.</li><li>가상의 학생에게 설명하거나 파인만 기법 등을 활용하면 자신이 모르는 부분을 정확히 파악할 수 있다.</li><li>결론적으로 교사의 관점으로 공부할 때 비로소 표면적인 지식이 진짜 실력으로 변한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Students often mistake surface familiarity for true mastery, but they can achieve reliable understanding through teaching-based strategies that reveal knowledge gaps.</div>\n              <div class=\"lec-final-sum-ko\">학생들은 종종 표면적인 익숙함을 진정한 숙달로 오해하지만, 지식의 빈틈을 드러내는 가르치기 기반의 전략을 통해 확실한 이해를 얻을 수 있다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_03월_32번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_32번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_32번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_03월_32번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_03월_32번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_03월_32번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_03월_32번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2026년_03월_32번_강의_audio/8.mp3","hl":"stage-4"}],[{"audio":"./모의고사_고1_2026년_03월_32번_강의_audio/9.mp3","h
