인 피아니스트를 길러냈습니다. 따라서 이 글은 단순히 한 음악가의 일대기를 넘어, 신체적 역경을 예술적 승화(Artistic Sublimation)로 연결해 낸 위대한 교육자이자 음악가의 회복 탄력성에 관한 이야기로 이해할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01유년 시절과 음악적 기초</div><ul><li>어린 시절부터 체계적인 교육을 받으며 음악가로서의 기반을 다졌다.</li><li>3세에 피아노 시작 및 7세에 커티스 음악원(Curtis Institute of Music) 입학</li><li>음악 경력의 토대(foundation)가 되는 전문적인 훈련 수료</li><li>핵심 키워드: 음악 교육(music training)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02연주자로서의 성공과 도약</div><ul><li>1949년 권위 있는 상을 받으며 세계적인 연주자로 명성을 얻었다.</li><li>레번트리트 상(Leventritt Award) 수상</li><li>전 세계를 무대로 한 콘서트(concerts) 공연 수행</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03신체적 위기와 시련</div><ul><li>1970년대 후반 오른손 손가락의 통제력을 잃는 시련을 겪었다.</li><li>오른손 손가락의 통제력 상실(lost control)</li><li>연주자로서 직면한 치명적인 신체적 장애</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04새로운 연주 영역의 개척</div><ul><li>장애에 굴하지 않고 왼손만을 위한 연주라는 새로운 길을 모색했다.</li><li>양손 연주의 관행(convention)을 재고함</li><li>왼손만을 위한 작품(left hand alone) 연주에 집중</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05교육자로서의 공헌과 유산</div><ul><li>모교로 돌아가 후학을 양성하며 음악적 열정을 사회와 공유했다.</li><li>커티스 음악원 교수진(faculty)으로 합류하여 랑랑 등 인재 양성</li><li>평생의 음악적 헌신(commitment)을 통해 사람들에게 영감을 줌</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lay the foundation for</td><td class=\"m\">~의 토대를 마련하다, ~의 기반을 닦다</td></tr><tr><td class=\"w\">lose control of</td><td class=\"m\">~에 대한 통제력을 잃다, ~을 제어하지 못하다</td></tr><tr><td class=\"w\">give up</td><td class=\"m\">포기하다, 그만두다</td></tr><tr><td class=\"w\">reconsider</td><td class=\"m\">재고하다, 다시 생각하다</td></tr><tr><td class=\"w\">convention</td><td class=\"m\">관습, 관례</td></tr><tr><td class=\"w\">focus on</td><td class=\"m\">~에 집중하다, ~에 초점을 맞추다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">faculty</td><td class=\"m\">(대학의) 학부, 교수진</td></tr><tr><td class=\"w\">outstanding</td><td class=\"m\">뛰어난, 걸출한</td></tr><tr><td class=\"w\">lifelong</td><td class=\"m\">평생의, 일생 동안의</td></tr><tr><td class=\"w\">commitment</td><td class=\"m\">헌신, 전념</td></tr><tr><td class=\"w\">inspire</td><td class=\"m\">영감을 주다, 고무하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Gary Graffman은 태어났다</span><span class=\"en\"><b>Gary Graffman <span class=\"grammar-hl\">was born</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">New York 시에서</span><span class=\"en\"><b>in New York City</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1928년에</span><span class=\"en\"><b>in 1928</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 피아노를 연주하기 시작했다</span><span class=\"en\"><b>and began <span class=\"grammar-hl\">playing</span> the piano</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세 살의 나이에.</span><span class=\"en\"><b><span class=\"grammar-hl\">at the age of</span> three.</b></span></div></div><div class=\"lec-sent-ko\">Gary Graffman은 1928년에 New York시에서 태어났고, 세 살의 나이에 피아노를 연주하기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 세계적인 피아니스트인 그래프먼의 출생 배경과 began playing the piano at the age of three를 통해 그가 아주 어린 시절부터 남다른 음악적 재능을 보였음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was born (수동태): be동사(was)+p.p.(born) 구조. bear는 타동사인데 뒤에 목적어가 없어서 수동구조 was born 형태로 쓴다. 기본구조: bear + O(아이를 낳다).</div><div class=\"lec-gr-item\">playing (동명사): 동사 began의 목적어로 쓰여 &#39;~하는 것&#39;을 의미하는 명사적 역할.</div><div class=\"lec-gr-item\">at the age of (관용표현): &#39;~의 나이에&#39;라는 의미로 쓰이는 표현.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일곱 살이 되었을 때,</span><span class=\"en\"><b>When he was seven,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 Curtis Institute of Music에 입학했고</span><span class=\"en\"><b>he entered the Curtis Institute of Music,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에서 그는 교육을 받았다</span><span class=\"en\"><b><span class=\"grammar-hl\">where</span> he received training</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 경력의 기초를 마련한.</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> <span class=\"grammar-hl\">laid the foundation for</span> his career.</b></span></div></div><div class=\"lec-sent-ko\">일곱 살이 되었을 때, 그는 Curtis Institute of Music에 입학했고, 그곳에서 자신의 경력의 기초를 마련한 교육을 받았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> laid the foundation for his career는 그가 단순히 취미 수준을 넘어 전문적인 음악가로 성장할 수 있는 체계적이고 높은 수준의 교육을 받았음을 의미합니다. 앞 문장의 조기 입문이 구체적인 전문 교육으로 이어지는 과정을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where (관계부사): 선행사(the Curtis Institute of Music)를 수식하며, 관계부사 뒤에는 주어(he)+동사(received)+목적어(training)가 갖춰진 완전한 절이 온다.</div><div class=\"lec-gr-item\">that (관계대명사): 선행사(training)를 수식하며, 뒤에 주어가 빠진 불완전한 절이 이어지는 주격 관계대명사.</div><div class=\"lec-gr-item\">laid the foundation for (관용표현): &#39;~의 토대를 형성하다/기틀을 마련하다&#39;라는 의미의 숙어.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1949년에,</span><span class=\"en\"><b>In 1949,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 Leventritt Award를 수상했고</span><span class=\"en\"><b>he <span class=\"grammar-hl\">won the Leventritt Award</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 후 연주회를 가졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">and then played</span> concerts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전 세계에서.</span><span class=\"en\"><b>worldwide.</b></span></div></div><div class=\"lec-sent-ko\">1949년에, 그는 Leventritt Award를 수상했고, 그 후 전 세계에서 연주회를 가졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> won the Leventritt Award는 그가 음악계에서 최고의 실력을 인정받아 본격적인 전성기에 진입했음을 보여줍니다. 앞 문장에서 쌓은 기초를 바탕으로 세계적인 명성을 얻게 된 결과적인 상황을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">won the Leventritt Award and then played 병렬 구조: 접속사 and를 중심으로 과거형 동사 won과 played가 주어 he에 공통으로 연결된 구조.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1970년대 후반,</span><span class=\"en\"><b>In the late 1970s,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Graffman은 손가락에 대한 제어력을 잃었으나</span><span class=\"en\"><b>Graffman lost control of the fingers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 오른손의</span><span class=\"en\"><b>on his right hand,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그는 피아노 연주를 결코 포기하지 않았다.</span><span class=\"en\"><b>but he never <span class=\"grammar-hl\">gave up</span> <span class=\"grammar-hl\">playing</span> the piano.</b></span></div></div><div class=\"lec-sent-ko\">1970년대 후반, Graffman은 오른손 손가락을 제어할 수 없게 되었으나, 그는 결코 피아노 연주를 포기하지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 분위기가 반전되는 지점입니다. lost control of the fingers는 피아니스트에게는 사형 선고와도 같은 치명적인 신체적 결함이 발생했음을 뜻하며, 그럼에도 불구하고 음악에 대한 열망이 꺾이지 않았음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">gave up (관용표현): &#39;포기하다&#39;라는 의미로 쓰인 구동사(V+P) 표현.</div><div class=\"lec-gr-item\">playing (동명사): 구동사 gave up의 목적어로 쓰여 &#39;연주하는 것&#39;이라는 행위를 나타내는 명사적 역할.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">전통적인 피아노 연주 관습을 재고하며</span><span class=\"en\"><b><span class=\"grammar-hl\">Reconsidering the traditional piano performance convention</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">양손을 사용하는</span><span class=\"en\"><b>of <span class=\"grammar-hl\">using</span> both hands,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 작품들에 집중했다</span><span class=\"en\"><b>he <span class=\"grammar-hl\">focused on</span> works</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왼손만을 위한</span><span class=\"en\"><b>for the left hand alone,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Ravel의 ‘왼손을 위한 피아노 협주곡’과 같은.</span><span class=\"en\"><b><span class=\"grammar-hl\">such as</span> Ravel’s Piano Concerto for the Left Hand.</b></span></div></div><div class=\"lec-sent-ko\">양손을 사용하는 전통적인 피아노 연주 관습을 재고하여, 그는 Ravel의 ‘왼손을 위한 피아노 협주곡’과 같은 왼손만을 위한 작품들에 집중했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Reconsidering the traditional piano performance convention은 한쪽 손을 못 쓰게 된 절망적인 상황에서 기존의 연주 방식을 고집하는 대신 새로운 길을 찾아내는 창의적인 극복 태도를 보여줍니다. 앞 문장의 &#39;포기하지 않았다&#39;는 결심이 구체적으로 어떤 행동으로 옮겨졌는지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Reconsidering the traditional piano performance convention (분사구문): 현재분사(-ing)가 이끄는 구가 문장 전체를 수식하는 부사적 기능을 한다. 원본 절 변환: As he reconsidered the traditional piano performance convention</div><div class=\"lec-gr-item\">using (동명사): 전치사 of의 목적어로 쓰여 구체적인 행위를 나타내는 명사적 역할.</div><div class=\"lec-gr-item\">focused on (관용표현): &#39;~에 집중하다/주력하다&#39;라는 의미의 숙어.</div><div class=\"lec-gr-item\">such as (관용표현): &#39;~와 같은&#39;이라는 뜻으로 구체적인 예시를 도입하는 표현.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reconsider</td><td class=\"m\">재고하다, 다시 생각하다</td></tr><tr><td class=\"w\">convention</td><td class=\"m\">관습, 관례</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Graffman은 돌아갔다</span><span class=\"en\"><b>Graffman <span class=\"grammar-hl\">returned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Curtis Institute of Music으로</span><span class=\"en\"><b><span class=\"grammar-hl\">to</span> the Curtis Institute of Music</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1980년에</span><span class=\"en\"><b>in 1980</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피아노 교수진의 일원으로서.</span><span class=\"en\"><b>as a member of the piano faculty.</b></span></div></div><div class=\"lec-sent-ko\">Graffman은 1980년에 피아노 교수진의 일원으로서 Curtis Institute of Music으로 돌아갔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> returned to the Curtis Institute는 자신의 음악 인생이 시작된 곳으로 돌아와, 이제는 연주자에서 교육자로 인생의 제2막을 시작했음을 의미합니다. 신체적 한계로 인해 활동 영역이 변화했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">returned to (관용표현): &#39;~로 돌아가다/복귀하다&#39;라는 의미의 동사구 표현.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">faculty</td><td class=\"m\">(대학의) 학부, 교수진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그곳에서</span><span class=\"en\"><b>There</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 많은 뛰어난 젊은 음악가들을 가르쳤으며</span><span class=\"en\"><b>he taught many outstanding young musicians,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Lang Lang을 포함한</span><span class=\"en\"><b><span class=\"grammar-hl\">including</span> Lang Lang,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 음악에 대한 그의 평생의 헌신은</span><span class=\"en\"><b>and his lifelong commitment <span class=\"grammar-hl\">to music</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들에게 계속 영감을 주고 있다</span><span class=\"en\"><b>continues <span class=\"grammar-hl\">to inspire</span> people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘날까지도.</span><span class=\"en\"><b>today.</b></span></div></div><div class=\"lec-sent-ko\">그곳에서 그는 Lang Lang을 포함한 많은 뛰어난 젊은 음악가들을 가르쳤으며, 음악에 대한 그의 평생의 헌신은 오늘날까지도 사람들에게 영감을 주고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> lifelong commitment to music은 시련에 굴복하지 않고 끝까지 음악인의 길을 걸어온 그의 삶 자체가 후대 예술가와 대중에게 큰 가르침과 울림을 주고 있다는 결론을 이끌어냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">including (현재분사): musicians 뒤에서 부수적인 정보를 덧붙이는 분사 구조로, &#39;~을 포함하여&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">to music (관용표현): commitment to (~에 대한 헌신/전념)의 구조로 명사와 전치사가 결합한 형태.</div><div class=\"lec-gr-item\">to inspire (to부정사): 동사 continues의 목적어로 쓰여 동작의 지속을 나타내는 명사적 용법.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">outstanding</td><td class=\"m\">뛰어난, 걸출한</td></tr><tr><td class=\"w\">lifelong</td><td class=\"m\">평생의, 일생 동안의</td></tr><tr><td class=\"w\">commitment</td><td class=\"m\">헌신, 전념</td></tr><tr><td class=\"w\">inspire</td><td class=\"m\">영감을 주다, 고무하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>게리 그래프먼은 어린 나이에 음악을 시작해 세계적인 피아니스트로 성장했다.</li><li>1970년대 후반 오른손 장애라는 예술가로서 치명적인 위기를 맞이했다.</li><li>하지만 좌절하지 않고 왼손 전용 곡들을 연주하며 피아노 연주의 새로운 영역을 개척했다.</li><li>이후 모교에서 교육자로서 제자들을 양성하며 그의 음악적 열정과 헌신을 후대에 전하고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Gary Graffman overcame the loss of his right hand&#39;s function by specializing in left-hand repertoire and dedicating his later life to teaching future musicians.</div>\n              <div class=\"lec-final-sum-ko\">게리 그래프먼은 왼손 레퍼토리를 전문으로 하고 여생을 미래의 음악가들을 가르치는 데 헌신함으로써 오른손 기능의 상실을 극복했다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/8.mp3","hl":"stage-4"}],[{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/9.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/10.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/11.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/12.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/13.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/14.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/15.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/16.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/17.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_26번_강의_audio/18.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_26번
