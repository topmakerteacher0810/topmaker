eptualization)임</li><li>파일, 폴더, 아이콘(icons)은 문서와 앱의 개념 모델을 형성함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03개념 모델이 유발하는 혼란</div><ul><li>때때로 이러한 단순화된 묘사는 실제와 달라 사용자에게 혼란을 줄 수 있다.</li><li>이메일이나 웹사이트 자료가 물리적인 기기(device) 내부에 있는 것으로 착각함</li><li>실제 자료는 물리적으로 멀리 떨어진 기계인 클라우드(cloud)에 위치함</li><li>핵심 키워드: 혼란(confusion)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04모델과 실제 구조의 괴리</div><ul><li>개념 모델은 일관된 하나의 이미지를 제공하지만 실제 구조는 파편화되어 있다.</li><li>사용자는 일관된 이미지(coherent image) 하나로 인식함</li><li>실제로는 세계 곳곳의 서로 다른 기계에 있는 부분(parts)들로 구성됨</li><li>개념 모델과 실제 물리적 위치 사이의 차이가 존재함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conceptual</td><td class=\"m\">개념적인, 구상의</td></tr><tr><td class=\"w\">highly</td><td class=\"m\">매우, 대단히, 높게</td></tr><tr><td class=\"w\">simplified</td><td class=\"m\">단순화된, 간소화된</td></tr><tr><td class=\"w\">accurate</td><td class=\"m\">정확한, 정밀한</td></tr><tr><td class=\"w\">as long as</td><td class=\"m\">~하는 한, ~하기만 하면</td></tr><tr><td class=\"w\">display</td><td class=\"m\">나타내다, 보여주다, 전시하다</td></tr><tr><td class=\"w\">effective</td><td class=\"m\">효과적인, 실질적인</td></tr><tr><td class=\"w\">conceptualization</td><td class=\"m\">개념화, 관념화</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">depiction</td><td class=\"m\">묘사, 서술</td></tr><tr><td class=\"w\">add to</td><td class=\"m\">~을 늘리다, ~을 더하다</td></tr><tr><td class=\"w\">for</td><td class=\"m\">conj.</td></tr><tr><td class=\"w\">in many cases</td><td class=\"m\">많은 경우에, 흔히</td></tr><tr><td class=\"w\">distant</td><td class=\"m\">먼, 멀리 떨어진</td></tr><tr><td class=\"w\">coherent</td><td class=\"m\">일관성 있는, 논리 정연한</td></tr><tr><td class=\"w\">whereas</td><td class=\"m\">conj.</td></tr><tr><td class=\"w\">consist of</td><td class=\"m\">~로 구성되다, ~로 이루어지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">개념 모형은</span><span class=\"en\"><b>A conceptual model</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">설명이다, 보통 매우 단순화된,</span><span class=\"en\"><b>is an explanation, usually <span class=\"grammar-hl\">highly simplified</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무언가가 어떻게 작동하는지에 대한.</span><span class=\"en\"><b>of <span class=\"grammar-hl\">how something works</span>.</b></span></div></div><div class=\"lec-sent-ko\">개념 모형은 무언가가 어떻게 작동하는지에 대한, 보통 매우 단순화된 설명이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> A conceptual model is an explanation은 우리가 복잡한 시스템을 이해하기 위해 머릿속에 그리는 일종의 &#39;지도&#39;를 도입하며 글의 주제를 제시합니다. 실제 작동 원리의 모든 세부 사항을 다루기보다는 핵심적인 작동 방식만을 추려낸 설명이라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">highly simplified (과거분사(형용사)): simplified가 앞의 명사 explanation을 수식(= &quot;매우 단순화된 설명&quot;)하며, explanation which is highly simplified 형태에서 &#39;주격 관계대명사 + be동사&#39;가 생략된 축약 관계절 구조다.</div><div class=\"lec-gr-item\">how something works (간접의문문): 의문사(how) + 주어(something) + 동사(works) 어순의 명사절로, 전치사 of의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conceptual</td><td class=\"m\">개념적인, 구상의</td></tr><tr><td class=\"w\">highly</td><td class=\"m\">매우, 대단히, 높게</td></tr><tr><td class=\"w\">simplified</td><td class=\"m\">단순화된, 간소화된</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 완전하거나 심지어 정확할 필요가 없다</span><span class=\"en\"><b>It <span class=\"grammar-hl\">doesn’t have to</span> be complete or even accurate</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유용하기만 하다면.</span><span class=\"en\"><b><span class=\"grammar-hl\">as long as</span> it is useful.</b></span></div></div><div class=\"lec-sent-ko\">그것은 유용하기만 하다면, 완전할 필요가 없고 심지어 정확할 필요도 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> as long as it is useful은 개념 모델의 존재 목적이 학술적인 정밀함이 아니라 사용자의 편의성에 있다는 점을 강조합니다. 앞 문장에서 언급된 &#39;단순화&#39;가 왜 허용되는지에 대한 근거를 제시하며, 사용자가 시스템을 다루는 데 방해가 되지 않는다면 실제와 조금 달라도 상관없다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">doesn’t have to (관용표현): &#39;~할 필요가 없다&#39;라는 뜻으로, 불필요함을 나타낼 때 쓰는 표현이다.</div><div class=\"lec-gr-item\">as long as (관용표현): &#39;~하는 한&#39;이라는 의미를 나타내는 접속사적 어구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">accurate</td><td class=\"m\">정확한, 정밀한</td></tr><tr><td class=\"w\">as long as</td><td class=\"m\">~하는 한, ~하기만 하면</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">파일, 폴더, 그리고 아이콘은</span><span class=\"en\"><b>The files, folders, and icons</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 컴퓨터 화면에 표시된 것을 보는</span><span class=\"en\"><b><span class=\"grammar-hl\">you see displayed</span> on a computer screen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 개념 모형을 만드는 것을 돕는다</span><span class=\"en\"><b><span class=\"grammar-hl\">help people create</span> the conceptual model</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">컴퓨터 내부의 문서와 폴더의,</span><span class=\"en\"><b>of documents and folders inside the computer,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 화면 위의 앱이나 응용 프로그램의.</span><span class=\"en\"><b>or of apps or applications on the screen.</b></span></div></div><div class=\"lec-sent-ko\">컴퓨터 화면에 표시되어 있는 여러분이 보는 파일, 폴더, 그리고 아이콘은 사람들이 컴퓨터 내부의 문서와 폴더, 또는 화면 위에 있는 앱이나 응용 프로그램의 개념 모형을 만드는 것을 돕는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> help people create the conceptual model은 앞서 설명한 추상적인 개념 모델이 실제 컴퓨터 환경에서 어떻게 구체화되는지 보여주는 사례입니다. 사용자가 화면의 시각적 요소들을 보고 컴퓨터 시스템의 구조를 직관적으로 받아들이게 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">you see displayed (5형식): 지각동사 see + 목적어(icons) + 목적격 보어(displayed) 구조다. 목적어인 icons가 관계대명사로 변하여 생략된 형태이며, 목적어와 보어의 관계가 수동이므로 과거분사 displayed가 목적격 보어로 쓰였다.</div><div class=\"lec-gr-item\">displayed (과거분사(형용사)): displayed가 icons를 수식(= &quot;표시되는 아이콘&quot;)하는 구조다. icons that are displayed의 축약된 관계절로 이해할 수 있다.</div><div class=\"lec-gr-item\">help people create (5형식): 준사역동사 help + 목적어(people) + 목적격 보어(create) 구조다. help는 목적격 보어로 동사원형이나 to부정사를 모두 취할 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conceptual</td><td class=\"m\">개념적인, 구상의</td></tr><tr><td class=\"w\">display</td><td class=\"m\">나타내다, 보여주다, 전시하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실,</span><span class=\"en\"><b>In fact,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">폴더는 전혀 없다</span><span class=\"en\"><b><span class=\"grammar-hl\">there are no folders</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">컴퓨터 내부에는 —</span><span class=\"en\"><b>inside the computer —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 효과적인 개념화이다</span><span class=\"en\"><b>those are effective conceptualizations</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 사용하기 더 쉽게 만들기 위해 설계된.</span><span class=\"en\"><b><span class=\"grammar-hl\">designed</span> <span class=\"grammar-hl\">to make them easier</span> to use.</b></span></div></div><div class=\"lec-sent-ko\">사실, 컴퓨터 내부에는 폴더가 전혀 없는데, 그것들은 사용하기 더 쉽게 만들기 위해 설계된 효과적인 개념화이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> effective conceptualizations는 컴퓨터 내부의 실제 물리적 데이터 저장 방식과 우리가 보는 화면 사이의 간극을 설명합니다. 실제로는 전류의 흐름이나 자기적 기록에 불과한 데이터를 우리가 익숙한 사무용품인 &#39;폴더&#39;라는 개념으로 치환하여 사용자의 이해를 돕고 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there are no folders (도치): 유도부사 there가 문두에 오면서 &#39;be동사(are) + 주어(no folders)&#39;로 주어와 동사가 도치된 구조다.</div><div class=\"lec-gr-item\">designed (과거분사(형용사)): designed가 conceptualizations를 수식(= &quot;설계된 개념화&quot;)하는 구조다. conceptualizations which are designed의 축약 관계절 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">to make them easier (to부정사): 부사적 용법 중 &#39;목적&#39;(~하기 위해서)으로 쓰였다.</div><div class=\"lec-gr-item\">make them easier (5형식): 타동사 make + 목적어(them) + 목적격 보어(easier) 구조다. 목적격 보어 자리에 형용사(easy)의 비교급 형태인 easier가 왔다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conceptual</td><td class=\"m\">개념적인, 구상의</td></tr><tr><td class=\"w\">effective</td><td class=\"m\">효과적인, 실질적인</td></tr><tr><td class=\"w\">conceptualization</td><td class=\"m\">개념화, 관념화</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">때때로</span><span class=\"en\"><b>Sometimes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 묘사는 혼란을 더할 수 있다,</span><span class=\"en\"><b>these depictions can <span class=\"grammar-hl\">add to</span> the confusion,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만.</span><span class=\"en\"><b>however.</b></span></div></div><div class=\"lec-sent-ko\">하지만 때때로 이러한 묘사는 혼란을 더할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> add to the confusion은 개념 모델의 긍정적인 측면에서 잠재적인 문제점으로 글의 흐름을 전환합니다. 모델이 제공하는 단순함이 실제 상황을 오해하게 만드는 원인이 될 수 있음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">add to (관용표현): &#39;~을 늘리다&#39;, &#39;~을 더하다&#39;라는 의미의 동사구 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">depiction</td><td class=\"m\">묘사, 서술</td></tr><tr><td class=\"w\">add to</td><td class=\"m\">~을 늘리다, ~을 더하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이메일을 읽거나 웹사이트를 방문할 때,</span><span class=\"en\"><b>When <span class=\"grammar-hl\">reading e­mail or visiting a website</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자료는 ~인 것처럼 보인다</span><span class=\"en\"><b>the material <span class=\"grammar-hl\">appears to be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장치에 있는 것처럼,</span><span class=\"en\"><b>on the device,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 그곳이 그것이 표시되고 사용되는 곳이기 때문이다.</span><span class=\"en\"><b>for that is <span class=\"grammar-hl\">where it is displayed and used</span>.</b></span></div></div><div class=\"lec-sent-ko\">이메일을 읽거나 웹사이트를 방문할 때, 그 자료는 장치에 있는 것처럼 보이는데, 왜냐하면 그곳이 그것(자료)이 표시되고 사용되는 곳이기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> appears to be on the device는 사용자가 겪는 대표적인 오해를 설명합니다. 내 눈앞의 화면에서 작업이 이루어지기 때문에 데이터가 내 컴퓨터 본체 안에 물리적으로 들어 있다고 믿게 되는 심리적 현상을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">reading e­mail or visiting a website (분사구문): 접속사 When이 생략되지 않은 분사구문으로, 원래 절로 변환하면 When you[people] read e-mail or visit a website이다.</div><div class=\"lec-gr-item\">appears to be (to부정사): 동사 appears의 보어 역할을 하는 명사적 용법으로 쓰여 &#39;~인 것처럼 보이다&#39;라는 의미를 형성한다.</div><div class=\"lec-gr-item\">where it is displayed and used (관계부사): 선행사가 생략된 관계부사 where가 이끄는 절로, 문장 내에서 보어 역할을 하는 명사절 기능을 한다.</div><div class=\"lec-gr-item\">is displayed and used (수동태): be동사(is)+p.p.(displayed 및 used) 구조. display와 use는 타동사인데 뒤에 목적어가 없어서 수동구조 is displayed and used 형태로 쓴다. 기본구조: V + O</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">display</td><td class=\"m\">나타내다, 보여주다, 전시하다</td></tr><tr><td class=\"w\">for</td><td class=\"m\">conj.</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 사실,</span><span class=\"en\"><b>But in fact,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 경우에</span><span class=\"en\"><b>in many cases</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제 자료는 “클라우드 안에” 있다,</span><span class=\"en\"><b>the actual material is “in the cloud,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 멀리 있는 기계에 위치한.</span><span class=\"en\"><b><span class=\"grammar-hl\">located on some distant machine</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 사실, 많은 경우에 실제 자료는 어떤 멀리 있는 기계에 위치한 ‘클라우드 안에’ 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> in the cloud는 앞 문장에서 제시된 사용자의 짐작이 실제 기술적 사실과 다르다는 점을 구체적으로 밝힙니다. 데이터가 내 기기가 아닌 네트워크로 연결된 외부 서버에 저장되어 있다는 실체를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">located on some distant machine (분사구문): 부가적인 정보를 제공하는 분사구문으로, 원래 절로 변환하면 because/as it is located on some distant machine이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in many cases</td><td class=\"m\">많은 경우에, 흔히</td></tr><tr><td class=\"w\">distant</td><td class=\"m\">먼, 멀리 떨어진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">개념 모형은</span><span class=\"en\"><b>The conceptual model</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 일관된 이미지에 관한 것이다,</span><span class=\"en\"><b>is of one, coherent image,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반면에 그것은 실제로 부분들로 구성되어 있을 수 있다,</span><span class=\"en\"><b>whereas it may actually <span class=\"grammar-hl\">consist of</span> parts,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">각각은 서로 다른 기계들에 위치한</span><span class=\"en\"><b><span class=\"grammar-hl\">each located on different machines</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상의 거의 어느 곳에나 있을 수 있는.</span><span class=\"en\"><b><span class=\"grammar-hl\">that could be almost anywhere</span> in the world.</b></span></div></div><div class=\"lec-sent-ko\">개념 모형은 하나의 일관된 이미지적인데, 반면에 그것은 부분으로 구성되어 있을 수도 있고, 각각은 실제로 세상의 거의 어느 곳에나 있을 수 있는 서로 다른 기계에 위치해 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> one, coherent image는 사용자가 느끼는 편리한 환상과 분산된 데이터의 실제 구조를 대비시키며 글을 마무리합니다. 사용자는 모든 것이 한곳에 모여 있다고 느끼지만, 기술적으로는 전 세계에 흩어진 데이터 조각들이 실시간으로 조합되는 복잡한 과정이 숨어 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">consist of (관용표현): &#39;~으로 구성되다&#39;라는 의미를 가진 자동사구 표현이다.</div><div class=\"lec-gr-item\">each located on different machines (분사구문): 주절의 주어(it)와 분사의 주어(each)가 달라 의미상의 주어 each를 남겨둔 독립 분사구문이다. 원래 절로 변환하면 while each part is located on different machines이다.</div><div class=\"lec-gr-item\">that could be almost anywhere (관계대명사): 주격 관계대명사 that이 선행사인 different machines를 수식하며, 뒤에는 주어가 빠진 불완전한 절이 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conceptual</td><td class=\"m\">개념적인, 구상의</td></tr><tr><td class=\"w\">coherent</td><td class=\"m\">일관성 있는, 논리 정연한</td></tr><tr><td class=\"w\">whereas</td><td class=\"m\">conj.</td></tr><tr><td class=\"w\">consist of</td><td class=\"m\">~로 구성되다, ~로 이루어지다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>개념 모델은 시스템의 작동 방식을 사용자가 이해하기 쉽게 단순화하여 설명한 것이다.</li><li>정확성보다는 사용자의 편의와 유용성이 개념 모델의 핵심적인 목적이다.</li><li>컴퓨터의 폴더나 아이콘은 실제 물리적 실체가 아니라 사용자를 돕기 위한 개념적 장치다.</li><li>이러한 단순화는 편리하지만, 데이터가 내 기기에 있다는 오해를 불러일으키는 등 실제 물리적 구조(클라우드 등)와 차이를 만든다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Conceptual models serve as simplified mental tools to enhance usability while occasionally causing confusion due to their discrepancy with actual technical structures.</div>\n              <div class=\"lec-final-sum-ko\">개념 모델은 사용성을 높이기 위한 단순화된 정신적 도구로 기능하지만, 실제 기술적 구조와의 차이로 인해 때때로 혼란을 야기하기도 한다.</div></div></div>"],"segs":[[{"audio":"./29_audio/1.mp3","hl":null}],[{"audio":"./29_audio/2.mp3","hl":null}],[{"audio":"./29_audio/3.mp3","hl":null},{"audio":"./29_audio/4.mp3","hl":"stage-0"},{"audio":"./29_audio/5.mp3","hl":"stage-1"},{"audio":"./29_audio/6.mp3","hl":"stage-2"},{"audio":"./29_audio/7.mp3","hl":"stage-3"}],[{"audio":"./29_audio/8.mp3","hl":null}],[{"audio":"./29_audio/9.mp3","hl":"main"},{"audio":"./29_audio/10.mp3","hl":"meaning"},{"audio":"./29_audio/11.mp3","hl":"grammar"}],[{"audio":"./29_audio/12.mp3","hl":"main"},{"audio":"./29_audio/13.mp3","hl":"meaning"},{"audio":"./29_audio/14.mp3","hl":"grammar"}],[{"audio":"./29_audio/15.mp3","hl":"main"},{"audio":"./29_audio/16.mp3","hl":"meaning"},{"audio":"./29_audio/17.mp3","hl":"grammar"}],[{"audio":"./29_aud     const scrollsHorizontally = target => {
      for (let el = target; el && root.contains(el); el = el.parentElement) {

    root.addEventListener('touchstart', e => {

      if (t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
