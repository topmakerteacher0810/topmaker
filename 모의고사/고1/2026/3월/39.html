nT3x+J/Qf0/xoyPUfn3HX8sfh7YpAVPQg9e47f/AKuD7daAF6jj/wDV9cH8MfnS00MCCcjg4PI4NG4AHkYHA7c9h6fQ9Py5AHfpRTNy4BJB6HA9Tz689evr707IGOeuAP6Uf194C0UmQOf8n6etBIHccnH4nn+XP05oD+vy/r/hxfz6+/8AnH14FNblTj0zx/8ArH8/ccijPPVSOcc9+mP1PT6Y9RiAGbjIU9sngE49/p9aBeXW35f8Of/Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Winter Harvest: From Frozen Despair to Spring-like Vitality<small>겨울 수확: 얼어붙은 절망에서 봄 같은 활력으로</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">겨울철에도 신선한 채소를 수확하는 비결은 식물의 놀라운 생존 전략인 내한성(Cold-hardiness)에 있습니다. 추운 날씨에 노출된 일부 작물들은 세포 내의 당분 농도를 높여 마치 자동차의 부동액(Antifreeze)처럼 어는점을 낮추는 영리한 생존 방식을 사용하기 때문에 영하의 날씨에도 세포가 파괴되지 않고 견딜 수 있습니다. 이러한 식물의 특성을 활용하여 인위적인 난방 장치 없이 이중 덮개와 태양열만으로 재배 기간을 늘리는 것을 시즌 연장(Season extension) 농법이라고 부릅니다. 밤새 얼어붙어 죽은 것처럼 보이던 식물이 해가 뜨고 기온이 오르면 다시 세포압(Turgor pressure)을 회복하며 생생하게 살아나는 모습은 겨울 농사만이 가진 독특하고 신비로운 현상입니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01겨울 수확의 도입</div><ul><li>겨울 온실을 새벽과 몇 시간 뒤에 각각 방문하면 겨울 수확의 놀라운 모습을 보게 된다.</li><li>방문 시점: 영하의 밤이 지난 새벽(dawn)과 몇 시간 후</li><li>핵심 주제: 겨울 수확(winter harvest)의 대조적인 광경</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02얼어붙은 새벽의 광경</div><ul><li>영하의 기온으로 인해 온실 내부의 모든 작물이 단단하게 얼어붙어 있다.</li><li>작물들이 꽁꽁 얼어붙음(frozen solid)</li><li>서리가 내린 잎들의 황량한 모습(frost-coated leaves)</li><li>농사가 불가능해 보이는 절망적인 시각적 상태</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03태양 에너지의 유입</div><ul><li>해가 뜨면서 온실 내부의 온도가 어는점 위로 올라가며 환경이 변화한다.</li><li>태양(sun)이 온실을 어는점 이상으로 데움</li><li>짧은 시간 동안 발생하는 기온의 급격한 상승</li><li>핵심 키워드: 어는점(freezing) 이상의 온도</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04생명력의 기적적인 반전</div><ul><li>따뜻해진 온실 안에서 작물들이 건강하고 활기찬 본래의 모습을 드러낸다.</li><li>새벽과는 다른 기적적인 대조(miraculous contrast)</li><li>활기차고 건강한 잎(vigorous, healthy leaves)들이 줄지어 있음</li><li>다채로운 색상의 잎들이 짙은 흙과 대비를 이룸</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05결론 및 함의</div><ul><li>겨울 온실의 풍경은 마치 끝나지 않는 봄과 같은 강한 생명력을 보여준다.</li><li>짙은 흙(dark soil) 위로 빛나는 다양한 색채의 향연</li><li>시각적 인상: 끝없는 봄(never-ending spring)과 같은 모습</li><li>겨울철 농업의 가능성과 자연의 회복력 강조</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">striking</td><td class=\"m\">인상적인, 현저한, 놀랄 만한</td></tr><tr><td class=\"w\">harvest</td><td class=\"m\">수확, 수확기</td></tr><tr><td class=\"w\">below-zero</td><td class=\"m\">영하의</td></tr><tr><td class=\"w\">frozen solid</td><td class=\"m\">꽁꽁 얼어붙은</td></tr><tr><td class=\"w\">reveal</td><td class=\"m\">드러내다, 보이다, 밝히다</td></tr><tr><td class=\"w\">frost-coated</td><td class=\"m\">서리로 뒤덮인</td></tr><tr><td class=\"w\">bleak</td><td class=\"m\">황량한, 암울한, 차가운</td></tr><tr><td class=\"w\">convince</td><td class=\"m\">확신시키다, 납득시키다</td></tr><tr><td class=\"w\">above freezing</td><td class=\"m\">영상의, 어는점 이상의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">miraculous</td><td class=\"m\">기적적인, 놀라운</td></tr><tr><td class=\"w\">contrast</td><td class=\"m\">대조, 차이</td></tr><tr><td class=\"w\">closely spaced</td><td class=\"m\">촘촘히 심어진, 밀접한</td></tr><tr><td class=\"w\">vigorous</td><td class=\"m\">활기찬, 건강한, 격렬한</td></tr><tr><td class=\"w\">stretch</td><td class=\"m\">뻗어 있다, 늘어나다, 확장되다</td></tr><tr><td class=\"w\">shade</td><td class=\"m\">색조, 명암</td></tr><tr><td class=\"w\">stand bright</td><td class=\"m\">밝게 빛나다, 선명하다</td></tr><tr><td class=\"w\">never­ending</td><td class=\"m\">끊임없는, 끝이 없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">두 번 방문하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Making</span> two visits</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 추운 온실 중 하나를</span><span class=\"en\"><b>to one of our cold greenhouses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">—새벽에 한 번</span><span class=\"en\"><b>—one at dawn</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영하의 밤이 지난 후에,</span><span class=\"en\"><b>after a below­zero night,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 나머지 한 번은</span><span class=\"en\"><b>and the other</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 시간 후에 —</span><span class=\"en\"><b>a few hours later —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인상적인 소개를 제공한다</span><span class=\"en\"><b>provides a <span class=\"grammar-hl\">striking</span> introduction</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">겨울 수확으로의.</span><span class=\"en\"><b>to the winter harvest.</b></span></div></div><div class=\"lec-sent-ko\">우리의 추운 온실 중 하나를 두 번 방문하는 것은, 즉 영하의 밤이 지난 새벽에 한 번, 그리고 몇 시간 후에 나머지 한 번 방문하는 것은, 겨울 수확으로의 인상적인 소개를 제공한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글 전체의 주제를 제시하는 도입부입니다. Making two visits는 시간 차를 두고 같은 장소를 관찰함으로써 겨울 농사가 불가능해 보이는 순간과 실제 수확이 이루어지는 순간의 극적인 차이를 보여주겠다는 글쓴이의 의도를 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Making (동명사): 동사 make에 -ing가 붙어 문장의 주어 역할을 하는 명사구의 핵으로 쓰였다.</div><div class=\"lec-gr-item\">one ... and the other (관용표현): 둘 중 하나는 &#39;one&#39;, 나머지 하나는 &#39;the other&#39;로 지칭하여 대조하는 상관적 표현이다.</div><div class=\"lec-gr-item\">striking (현재분사(형용사)): striking이 뒤의 명사 introduction을 수식하며 능동의 의미를 나타낸다. introduction that is striking과 유사한 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">striking</td><td class=\"m\">인상적인, 현저한, 놀랄 만한</td></tr><tr><td class=\"w\">harvest</td><td class=\"m\">수확, 수확기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">새벽 방문 동안에</span><span class=\"en\"><b>During the dawn visit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 농작물은</span><span class=\"en\"><b>all the crops</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단단하게 얼어 있다.</span><span class=\"en\"><b><span class=\"grammar-hl\">are frozen</span> solid.</b></span></div></div><div class=\"lec-sent-ko\">새벽 방문 동안에 모든 농작물은 단단하게 얼어 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 번째 관찰 시점의 상태를 묘사합니다. frozen solid는 작물들이 단순히 차가운 상태를 넘어 생명력이 전혀 느껴지지 않을 정도로 딱딱하게 굳어 있는 부정적인 초기 상황을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are frozen (수동태): be동사(are)+p.p.(frozen) 구조. freeze는 &#39;...을 얼리다&#39;라는 의미의 타동사로 쓰이는데, 뒤에 목적어가 없어서 수동구조 are frozen 형태로 쓴다. 기본구조: freeze + O.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">frozen solid</td><td class=\"m\">꽁꽁 얼어붙은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내부 덮개를 들어 올리는 것은,</span><span class=\"en\"><b><span class=\"grammar-hl\">Raising</span> the inner covers,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어려운데</span><span class=\"en\"><b><span class=\"grammar-hl\">which</span> is difficult</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것 또한 얼어 있기 때문에,</span><span class=\"en\"><b>because they too <span class=\"grammar-hl\">are frozen</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">광경을 드러낸다</span><span class=\"en\"><b>reveals a sight</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뻣뻣하고 서리로 뒤덮인 잎의</span><span class=\"en\"><b>of hard, <span class=\"grammar-hl\">frost­coated</span> leaves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충분히 황량한</span><span class=\"en\"><b>bleak enough</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누구에게라도 납득시킬 만큼</span><span class=\"en\"><b><span class=\"grammar-hl\">to convince</span> anyone</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 생각이 어리석다는 것을.</span><span class=\"en\"><b>that this idea is foolish.</b></span></div></div><div class=\"lec-sent-ko\">내부 덮개를 들어 올리는 것은, 그것 또한 얼어 있기 때문에 어려운데, 이 생각이 어리석다는 것을 누구에게라도 납득시킬 만큼 충분히 황량한, 뻣뻣하고 서리로 뒤덮인 잎의 광경을 드러낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;얼어붙은 상태&#39;를 더 구체적인 시각 정보와 심리적 반응으로 뒷받침합니다. bleak enough to convince anyone that this idea is foolish는 얼어붙은 채소들을 보면 &#39;추운 겨울에 농사를 짓겠다는 계획&#39; 자체가 말도 안 되는 고집처럼 느껴질 만큼 상황이 절망적으로 보인다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Raising (동명사): 동사 raise에 -ing가 붙어 문장의 주어 역할을 하는 명사구로 쓰였다.</div><div class=\"lec-gr-item\">which (관계대명사): 관계대명사의 계속적 용법으로 쓰였으며, 앞의 Raising the inner covers라는 행위 전체를 선행사로 받는다. 절 내부에서 주어 역할을 하는 주격 관계대명사다.</div><div class=\"lec-gr-item\">are frozen (수동태): be동사(are)+p.p.(frozen) 구조. freeze는 타동사인데 뒤에 목적어가 없어서 수동구조 are frozen 형태로 쓴다. 기본구조: freeze + O.</div><div class=\"lec-gr-item\">frost­coated (과거분사(형용사)): frost-coated가 뒤의 명사 leaves를 수식하는 구조다. leaves that are/were frost-coated와 유사한 축약 관계절의 의미를 갖는다.</div><div class=\"lec-gr-item\">to convince (to부정사): 부사적 용법 중 정도로 쓰여, 앞에 나온 형용사 bleak를 수식하는 enough를 한정한다. &#39;...하기에 충분히 ~한&#39;의 의미 구조를 만든다.</div><div class=\"lec-gr-item\">convince anyone that (관용표현): convince A that절(5형식 변형 구조) 형태로 &#39;A에게 ~라는 사실을 확신시키다&#39;라는 의미로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reveal</td><td class=\"m\">드러내다, 보이다, 밝히다</td></tr><tr><td class=\"w\">bleak</td><td class=\"m\">황량한, 암울한, 차가운</td></tr><tr><td class=\"w\">convince</td><td class=\"m\">확신시키다, 납득시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 몇 시간 뒤,</span><span class=\"en\"><b>Yet a few hours later,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태양이 온실을 데운 후에</span><span class=\"en\"><b>after the sun has warmed the greenhouses</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어는점 이상으로,</span><span class=\"en\"><b>above <span class=\"grammar-hl\">freezing</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 번째 방문은</span><span class=\"en\"><b>the second visit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기적적인 대조를 보여 준다.</span><span class=\"en\"><b>presents a miraculous contrast.</b></span></div></div><div class=\"lec-sent-ko\">하지만 몇 시간 뒤, 태양이 온실을 어는점 이상으로 데운 후에, 두 번째 방문은 기적적인 대조를 보여 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Yet을 통해 글의 분위기를 반전시킵니다. presents a miraculous contrast는 태양열이라는 자연적인 요인이 개입하면서 앞서 보았던 절망적인 풍경이 상상도 못 할 긍정적인 모습으로 바뀌었음을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">freezing (동명사): 전치사 above의 목적어 역할을 하는 명사적 개념으로, &#39;어는 점&#39; 혹은 &#39;어는 상태&#39;라는 행위/상태의 명칭으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">above freezing</td><td class=\"m\">영상의, 어는점 이상의</td></tr><tr><td class=\"w\">miraculous</td><td class=\"m\">기적적인, 놀라운</td></tr><tr><td class=\"w\">contrast</td><td class=\"m\">대조, 차이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내부 덮개 아래에는</span><span class=\"en\"><b><span class=\"grammar-hl\">Under the inner covers</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">촘촘한 간격의 줄들이</span><span class=\"en\"><b><span class=\"grammar-hl\">closely spaced rows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생기가 넘치고 싱싱한 잎들의</span><span class=\"en\"><b>of vigorous, healthy leaves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">온실 길이에 걸쳐 뻗은.</span><span class=\"en\"><b><span class=\"grammar-hl\">that stretch</span> the length of the greenhouse.</b></span></div></div><div class=\"lec-sent-ko\">내부 덮개 아래에는 온실 길이에 걸쳐 뻗은, 생기가 넘치고 싱싱한 잎들이 촘촘한 간격의 줄을 이루고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;기적적인 대조&#39;의 실체를 보여줍니다. stretch the length of the greenhouse는 작물들이 죽지 않고 온실 전체에 가득 퍼져서 건강하게 자라나고 있는 풍성한 수확의 현장을 생동감 있게 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Under the inner covers are closely spaced rows (도치): &#39;전치사+명사&#39;로 이루어진 장소의 부사구(Under the inner covers)가 강조를 위해 문두로 나가면서 주어(rows...)와 동사(are)의 위치가 바뀐 구조다.</div><div class=\"lec-gr-item\">spaced (과거분사(형용사)): spaced가 뒤의 명사 rows를 수식한다. rows that are spaced와 같이 수동적 의미를 지닌 축약 관계절 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">that stretch (관계대명사): 주격 관계대명사로 선행사인 leaves를 수식한다. 뒤에 주어가 빠진 불완전한 절이 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">closely spaced</td><td class=\"m\">촘촘히 심어진, 밀접한</td></tr><tr><td class=\"w\">vigorous</td><td class=\"m\">활기찬, 건강한, 격렬한</td></tr><tr><td class=\"w\">stretch</td><td class=\"m\">뻗어 있다, 늘어나다, 확장되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-
