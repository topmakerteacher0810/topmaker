해하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01기대와 상상</div><ul><li>네 살 소녀 캐시는 어머니께 전해 들은 축제의 모습을 오랫동안 상상하며 기대에 부푼다.</li><li>축제(carnival)에 대한 이야기를 듣고 상상함</li><li>색색의 풍선과 맛있는 사탕(candies)을 떠올림</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02축제의 즐거움</div><ul><li>축제장에 도착한 캐시는 화려한 분위기와 마술 공연을 보며 매우 행복해한다.</li><li>반짝이는 조명(twinkling lights)과 음악에 맞춰 기뻐함</li><li>마술사의 묘기(tricks)를 보며 가족과 함께 환호함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03공포의 대상 발견</div><ul><li>퍼레이드 행렬에서 다가오는 거대한 풍선들을 보고 캐시는 위협을 느낀다.</li><li>거대한 풍선(huge balloons)들이 다가오는 것을 목격함</li><li>풍선들이 마치 괴물(monsters)처럼 너무 크다고 생각함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04두려운 반응과 위축</div><ul><li>갑작스러운 공포로 인해 캐시는 신체적 반응을 보이며 어머니 뒤로 숨는다.</li><li>두려움(fear)으로 인해 심장이 빠르게 뛰고 몸이 굳어버림</li><li>솜사탕(cotton candy)을 떨어뜨린 채 어머니 뒤로 숨음</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">carnival</td><td class=\"m\">카니발, 축제</td></tr><tr><td class=\"w\">imagine</td><td class=\"m\">상상하다, 생각하다</td></tr><tr><td class=\"w\">twinkling</td><td class=\"m\">반짝거리는, 빛나는</td></tr><tr><td class=\"w\">jump with joy</td><td class=\"m\">기뻐서 펄쩍 뛰다, 매우 기뻐하다</td></tr><tr><td class=\"w\">trick</td><td class=\"m\">묘기, 마술, 속임수</td></tr><tr><td class=\"w\">cheer</td><td class=\"m\">환호하다, 응원하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">huge</td><td class=\"m\">거대한, 엄청난</td></tr><tr><td class=\"w\">parade</td><td class=\"m\">퍼레이드, 행진</td></tr><tr><td class=\"w\">beat fast</td><td class=\"m\">(심장이) 빠르게 뛰다, 두근거리다</td></tr><tr><td class=\"w\">fear</td><td class=\"m\">공포, 두려움</td></tr><tr><td class=\"w\">freeze</td><td class=\"m\">얼어붙다, (공포로) 굳어지다</td></tr><tr><td class=\"w\">hide behind</td><td class=\"m\">~의 뒤에 숨다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 첫 번째 축제였다</span><span class=\"en\"><b>It was the first carnival</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">네 살 소녀 Cassie에게.</span><span class=\"en\"><b>for the four­year­old girl, Cassie.</b></span></div></div><div class=\"lec-sent-ko\">그날은 네 살 소녀 Cassie의 첫 번째 축제였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 주인공 캐시의 상황과 배경을 설명합니다. 처음 경험하는 축제라는 점을 강조하여 앞으로 일어날 일에 대한 기대와 낯섦을 동시에 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the four-year-old girl, Cassie (동격): 명사구 &#39;the four-year-old girl&#39;과 명사 &#39;Cassie&#39;가 콤마(,)를 사이에 두고 나란히 놓여 동일한 대상을 지칭하며 보충 설명하는 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">carnival</td><td class=\"m\">카니발, 축제</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 그것에 대해 들어 보기만 했었다</span><span class=\"en\"><b>She <span class=\"grammar-hl\">had only heard</span> about it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어머니로부터.</span><span class=\"en\"><b>from her mother.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 어머니로부터 그날에 대해 들어 보기만 했었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> only heard about it은 캐시가 카니발을 직접 경험한 적 없이 타인의 설명을 통해 간접적으로만 정보를 접했음을 보여줍니다. 이는 실물을 보았을 때 느낄 반응이 매우 극적일 것임을 예고합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had only heard (과거완료): had + p.p. 형태로, 과거의 특정 시점인 축제에 가기 전부터 이미 어머니에게 들어서 알고 있었다는 과거보다 앞선 시점을 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 알록달록한 풍선과 맛있는 사탕을 상상해 오고 있었다</span><span class=\"en\"><b>She <span class=\"grammar-hl\">had been imagining</span> colorful balloons and delicious candies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오랫동안.</span><span class=\"en\"><b>for a long time.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 알록달록한 풍선과 맛있는 사탕을 오랫동안 상상해 오고 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> imagining... for a long time은 실제 현장에 가기 전부터 캐시의 머릿속에 형성된 카니발에 대한 긍정적이고 화려한 이미지를 설명합니다. 앞 문장의 &#39;간접 경험&#39;이 구체적인 &#39;환상&#39;으로 발전한 상태입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">had been imagining (현재진행): be동사(been) + -ing(imagining)가 결합된 형태다. 과거 어느 시점부터 축제에 가기 전까지 오랫동안 계속해서 상상해오고 있었음을 나타내는 진행 구조다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀가 마침내 도착했을 때</span><span class=\"en\"><b>When she finally arrived</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">축제에</span><span class=\"en\"><b>at the carnival,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반짝이는 불빛과 음악은</span><span class=\"en\"><b>the <span class=\"grammar-hl\">twinkling lights</span> and music</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀가 뛰게 만들었다</span><span class=\"en\"><b><span class=\"grammar-hl\">made her jump</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기뻐서.</span><span class=\"en\"><b>with joy.</b></span></div></div><div class=\"lec-sent-ko\">그녀가 마침내 축제에 도착했을 때, 반짝이는 불빛과 음악은 그녀가 기뻐서 뛰게 만들었.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> jump with joy는 머릿속으로만 그리던 축제를 실제로 마주했을 때 터져 나오는 어린아이의 순수한 흥분을 생동감 있게 묘사합니다. 기대했던 즐거움이 현실에서 충족되는 순간입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">twinkling lights (현재분사(형용사)): twinkling이 명사 lights를 수식(= &quot;반짝거리는 불빛&quot;)하는 구조다. lights that were twinkling의 의미를 갖는다.</div><div class=\"lec-gr-item\">made her jump (5형식(SVOC)): 사역동사(made) + 목적어(her) + 목적보어(jump) 구조다. 사역동사 make는 목적보어로 동사원형(jump)을 취하여 목적어가 ~하게 만든다는 사역의 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">carnival</td><td class=\"m\">카니발, 축제</td></tr><tr><td class=\"w\">twinkling</td><td class=\"m\">반짝거리는, 빛나는</td></tr><tr><td class=\"w\">jump with joy</td><td class=\"m\">기뻐서 펄쩍 뛰다, 매우 기뻐하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">마술사가 자신의 기술을 보여 주었고</span><span class=\"en\"><b>The magician showed his tricks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 환호했다</span><span class=\"en\"><b>and she <span class=\"grammar-hl\">cheered</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 가족과 함께.</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> her family.</b></span></div></div><div class=\"lec-sent-ko\">마술사가 자신의 기술을 보여 주었고 그녀는 자신의 가족과 함께 환호했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 흥분이 구체적인 활동으로 이어지는 대목입니다. 가족과 함께 마술을 즐기며 캐시가 카니발의 분위기에 완전히 매료되어 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cheered with (관용표현): cheer with ~는 &#39;~와 함께 환호하다/응원하다&#39;라는 의미의 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">trick</td><td class=\"m\">묘기, 마술, 속임수</td></tr><tr><td class=\"w\">cheer</td><td class=\"m\">환호하다, 응원하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 갑자기</span><span class=\"en\"><b>But suddenly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 퍼레이드에 있는 많은 거대한 풍선을 보았다</span><span class=\"en\"><b>she <span class=\"grammar-hl\">saw a lot of huge balloons in the parade</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신을 향해 오고 있는.</span><span class=\"en\"><b><span class=\"grammar-hl\">coming</span> towards her.</b></span></div></div><div class=\"lec-sent-ko\">하지만 갑자기, 그녀는 많은 거대한 퍼레이드 풍선이 자신을 향해 오고 있는 것을 보았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> But suddenly를 기점으로 글의 분위기가 급격히 반전됩니다. 앞에서 상상했던 작고 예쁜 풍선이 아니라, 위협적으로 느껴질 만큼 커다란 풍선이 등장하며 긴장감이 형성됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">saw a lot of huge balloons in the parade coming (5형식(SVOC)): 지각동사(saw) + 목적어(huge balloons) + 목적보어(coming) 구조다. 지각동사 see는 목적어가 동작하는 것을 나타낼 때 목적보어로 현재분사(-ing)를 취해 진행 중인 느낌을 강조한다.</div><div class=\"lec-gr-item\">balloons ... coming (현재분사(형용사)): coming이 balloons를 수식(= &quot;다가오는 풍선들&quot;)하는 구조다. balloons that were coming과 같이 명사 뒤에서 동작을 설명하는 축약 관계절의 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">huge</td><td class=\"m\">거대한, 엄청난</td></tr><tr><td class=\"w\">parade</td><td class=\"m\">퍼레이드, 행진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 생각했다</span><span class=\"en\"><b>She <span class=\"grammar-hl\">thought</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 너무 크다고</span><span class=\"en\"><b><span class=\"grammar-hl\">they were</span> too big,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">괴물처럼.</span><span class=\"en\"><b>like monsters.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 그것들이 괴물처럼 너무 크다고 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> too big, like monsters는 풍선을 바라보는 캐시의 시선이 &#39;즐거운 장식물&#39;에서 &#39;무서운 대상&#39;으로 바뀌었음을 의미합니다. 압도적인 크기가 어린아이에게는 공포의 대상이 될 수 있음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">thought they were (관용표현): thought 뒤에 접속사 that이 생략된 구조로, &#39;~라고 생각했다&#39;라는 의미의 목적어절을 이끈다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀의 심장은 빠르게 뛰기 시작했다</span><span class=\"en\"><b>Her heart began <span class=\"grammar-hl\">to beat</span> fast</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공포로.</span><span class=\"en\"><b>from fear.</b></span></div></div><div class=\"lec-sent-ko\">그녀의 심장은 공포로 빠르게 뛰기 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시각적인 압박감이 신체적인 두려움으로 이어지는 과정입니다. 즐거웠던 축제의 감정이 한순간에 생존을 위협받는 듯한 공포심으로 대체되었음을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to beat (to부정사): 명사적 용법으로 쓰여 타동사 begin의 목적어 역할을 한다. begin은 목적어로 to부정사와 동명사를 모두 취할 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">beat fast</td><td class=\"m\">(심장이) 빠르게 뛰다, 두근거리다</td></tr><tr><td class=\"w\">fear</td><td class=\"m\">공포, 두려움</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Cassie는 얼어붙었다</span><span class=\"en\"><b>Cassie <span class=\"grammar-hl\">froze</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 자신의 솜사탕을 떨어뜨렸다</span><span class=\"en\"><b><span class=\"grammar-hl\">and dropped</span> her cotton candy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">땅에.</span><span class=\"en\"><b>on the ground.</b></span></div></div><div class=\"lec-sent-ko\">Cassie는 얼어붙었고 자신의 솜사탕을 땅에 떨어뜨렸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> froze and dropped는 극심한 충격으로 인해 몸이 굳고 제어력을 잃은 상태를 묘사합니다. 즐거움의 상징인 솜사탕을 떨어뜨린 것은 축제를 즐기던 마음이 완전히 깨졌음을 상징합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">froze and dropped (관용표현): 접속사 and를 통해 과거 시점의 두 동사 froze(얼어붙다)와 dropped(떨어뜨리다)가 병렬 구조를 이루고 있다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 재빨리 숨었다</span><span class=\"en\"><b>She quickly <span class=\"grammar-hl\">hid</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어머니 뒤에.</span><span class=\"en\"><b><span class=\"grammar-hl\">behind</span> her mother.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 재빨리 어머니 뒤에 숨었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> hid behind her mother는 위협적인 상황에서 아이가 가장 신뢰하는 존재인 부모에게 의지하여 안정을 찾으려는 본능적인 방어 행동을 보여주며 글을 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">hid behind (관용표현): hide behind ~는 &#39;~의 뒤에 숨다&#39;라는 의미를 가진 구동사 표현이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>네 살 소녀 캐시는 엄마의 이야기로만 듣던 첫 카니발에 대해 큰 환상을 가지고 있었다.</li><li>축제장에 도착한 캐시는 화려한 조명, 음악, 마술 공연을 즐기며 매우 행복해했다.</li><li>하지만 퍼레이드 중 나타난 거대한 풍선들을 보고 괴물 같은 공포를 느끼게 된다.</li><li>결국 캐시는 공포에 질려 솜사탕을 떨어뜨리고 엄마 뒤로 숨으며 축제의 즐거움을 잃었다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Cassie’s initial joy at the carnival turned into sudden terror as the massive parade balloons appeared like monsters to her.</div>\n              <div class=\"lec-final-sum-ko\">카니발에 대한 캐시의 초기 즐거움은 거대한 퍼레이드 풍선들이 그녀에게 괴물처럼 보임에 따라 갑작스러운 공포로 변했다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/18.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_19번_강의_audio/19.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_19번_강
