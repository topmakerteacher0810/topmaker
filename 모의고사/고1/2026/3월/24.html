QO9vyHUD/P/ANb/AA/Prmm7155HHU54/P27+lKCDjkZIyMHOfp60BuLRTd64zuHfuO3X8u/p3wQaA6nHIG7oM9enT16jp60B5/MdnnH40ntgcfl05xxz1x270gZTggjnJzkdsZyfbv6UblJAyOeRyOfb9e3pQA6j/P+f8im7gcjK5wcc9x1+mD2ySO9IWAwSy+/fPHb8vaj/htu/wDX9WAdzn247fX8P89OhpaaHUkjI4/p1znpjv6cetAdScZH5/n+vFADqD/9bt3pMjpkZ54z6dfy70uR6j/Of8D+RoC67/09gpODx1/DuP8AP8/Q0memGGOe4/h69c554OMEHrS5Geo9+c/lzx78Urpb/wBf1cA69P8AD+Y/z/M9f0P+cd8+v60gdSM5HXHvxjPHtnnGaCwGBwOM/QD9P1x+mWA6j/63+en+fbrTQw6ZzxnORjr6/wCeKXcuM5GPXI/zzjI9qAFpPp68/wD1/wAPX2oDKcYIOc459Ov5ZoyMZyMD3oAO/Trnn8uv+e1I2SpwcEjqf/r/ANaUFT0I55HT601mARiD0Vjnr90c+ucH86A/L9f68z//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Temptation Bundling: A Strategy to Make Hard Habits Easier<small>유혹 묶기: 어려운 습관을 더 쉽게 만드는 전략</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리의 뇌는 에너지를 절약하기 위해 반복적인 행동을 자동화하려는 성질이 있는데, 이때 유용한 개념이 바로 유혹 결합(Temptation Bundling)입니다. 이는 내가 정말 하고 싶은 &#39;즐거운 일&#39;과 꼭 해야 하지만 자꾸 미루게 되는 &#39;힘든 일&#39;을 하나의 세트로 묶어버리는 행동 경제학(Behavioral Economics)적 전략이에요. 예를 들어, 평소 좋아하는 넷플릭스 시청을 오직 헬스장에서 운동할 때만 허용하는 것처럼 즉각적인 보상(Immediate Reward)을 지렛대 삼아 새로운 습관을 안착시키는 원리죠. 와튼 스쿨의 케이티 밀크먼(Katy Milkman) 교수는 실생활 연구를 통해 우리가 단순한 의지력에만 의존하기보다 보상 체계를 지능적으로 설계함으로써 자기 통제(Self-control)의 어려움을 효과적으로 극복할 수 있음을 입증했습니다. 이러한 심리적 메커니즘을 이해하면 귀찮게만 느껴졌던 과업도 훨씬 더 즐거운 마음으로 시작할 수 있는 강력한 동기를 얻을 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01습관의 본질과 필요성</div><ul><li>습관은 인간의 생존과 비즈니스 효율성을 위해 필수적인 뇌의 기제이다.</li><li>생존(survive)을 위해 반드시 필요한 습관의 역할</li><li>뇌(brain)가 습관을 활용하는 방식을 이해하는 것의 중요성</li><li>핵심 키워드: 습관(habit)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02유혹 묶기 전략의 제안</div><ul><li>나쁜 습관을 버리는 대신 다른 습관과 결합하는 유혹 묶기 전략을 활용할 수 있다.</li><li>습관을 끊는 것보다 새로운 습관에 연결(attaching)하기</li><li>핵심 개념: 유혹 묶기(temptation bundling)</li><li>유혹적인 행동과 형성하고 싶은 습관의 결합</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실험을 통한 실증 연구</div><ul><li>케이티 밀크먼 교수는 체육관에서만 오디오북을 듣게 하는 실험을 진행했다.</li><li>실험명: 체육관에 헝거 게임 인질 잡기(Holding the Hunger Games Hostage at the Gym)</li><li>유혹적인 습관: 흥미로운 오디오북(audiobook) 듣기</li><li>형성하려는 습관: 운동(exercising)하기</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실험의 긍정적 결과</div><ul><li>유혹 묶기 전략을 사용했을 때 사람들의 행동 변화가 뚜렷하게 나타났다.</li><li>실험 참가자들의 체육관 방문 확률이 51퍼센트(51 percent) 증가함</li><li>미루고 싶은 일을 즐거운 일과 결합하여 동기 부여를 강화함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05장기적인 행동 변화</div><ul><li>실험이 끝난 후에도 참가자들은 유혹 묶기 방식의 효과를 높게 평가했다.</li><li>참가자의 약 3분의 2가 비용을 지불(pay)하고 접근 제한 서비스를 유지함</li><li>습관 형성을 위한 강제적 장치의 실효성 입증</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">survive</td><td class=\"m\">살아남다, 생존하다</td></tr><tr><td class=\"w\">work with</td><td class=\"m\">~와 함께 일하다, ~을 활용하다, ~을 다루다</td></tr><tr><td class=\"w\">essential</td><td class=\"m\">필수적인, 극히 중요한</td></tr><tr><td class=\"w\">break a habit</td><td class=\"m\">습관을 고치다, 습관을 버리다</td></tr><tr><td class=\"w\">do better</td><td class=\"m\">더 잘하다, 더 좋은 성과를 내다</td></tr><tr><td class=\"w\">attach to</td><td class=\"m\">~에 들러붙다, ~에 첨부하다, ~에 연결하다</td></tr><tr><td class=\"w\">hold hostage</td><td class=\"m\">~을 인질로 잡다, (비유적으로) ~을 볼모로 잡다</td></tr><tr><td class=\"w\">participant</td><td class=\"m\">참가자</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">have access to</td><td class=\"m\">~에 접근하다, ~을 이용할 권한이 있다</td></tr><tr><td class=\"w\">tempting</td><td class=\"m\">유혹하는, 매력적인</td></tr><tr><td class=\"w\">combine with</td><td class=\"m\">~와 결합하다</td></tr><tr><td class=\"w\">feel forced to</td><td class=\"m\">~하도록 강요받는 느낌이 들다, 어쩔 수 없이 ~하다</td></tr><tr><td class=\"w\">put off</td><td class=\"m\">미루다, 연기하다</td></tr><tr><td class=\"w\">be likely to</td><td class=\"m\">~할 가능성이 있다, ~할 것 같다</td></tr><tr><td class=\"w\">opt to</td><td class=\"m\">~하기로 선택하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">습관은 나쁜 것이 아니다.</span><span class=\"en\"><b><span class=\"grammar-hl\">Habits aren’t bad</span>.</b></span></div></div><div class=\"lec-sent-ko\">습관은 나쁜 것이 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로, 습관에 대해 우리가 흔히 가질 수 있는 부정적인 편견을 깨트리며 논의를 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Habits aren’t bad 2형식 문장: 주어(Habits) + 동사(aren&#39;t) + 주격보어(bad)로 이루어진 문장으로 보어 자리에 형용사가 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 그것들을 필요로 한다</span><span class=\"en\"><b>We need them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">살아남기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">to survive</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 살아남기 위해 그것을 필요로 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 대한 이유를 제시합니다. need them to survive는 인간의 뇌가 매 순간 모든 일을 새로 판단하지 않고 자동화된 습관을 통해 에너지를 아껴야 생존에 유리하다는 생물학적 원리를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to survive (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~하기 위하여&#39;로 해석하며 동사 need를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">survive</td><td class=\"m\">살아남다, 생존하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">뇌가 습관을 어떻게 사용하는지 이해하고</span><span class=\"en\"><b><span class=\"grammar-hl\">Understanding</span> <span class=\"grammar-hl\">how the brain uses habits</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 그것을 가지고 어떻게 행동할 수 있는지를 이해하는 것은</span><span class=\"en\"><b>and <span class=\"grammar-hl\">how you can work with them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필수적이다</span><span class=\"en\"><b>is essential</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비즈니스에.</span><span class=\"en\"><b>for business.</b></span></div></div><div class=\"lec-sent-ko\">뇌가 습관을 어떻게 사용하는지, 그리고 여러분이 습관을 가지고 어떻게 행동할 수 있는 지를 이해하는 것은 비즈니스에 필수적이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 습관의 일반적인 특징을 비즈니스 영역으로 확장합니다. work with them은 습관을 억지로 없애려 하기보다 그 작동 원리를 이용하여 고객이나 자신의 행동을 원하는 방향으로 유도하는 전략이 성공의 핵심이라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Understanding (동명사): 문장의 주어 역할을 하는 명사적 성질의 어구로, 단수 취급하여 문장의 본동사로 is가 쓰였다.</div><div class=\"lec-gr-item\">how the brain uses habits (간접의문문): 의문사(how) + 주어(the brain) + 동사(uses) 어순의 명사절로, 동명사 Understanding의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">how you can work with them (간접의문문): 의문사(how) + 주어(you) + 동사(can work) 어순의 명사절로, and에 의해 앞의 명사절과 병렬 구조를 이루며 Understanding의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">work with</td><td class=\"m\">~와 함께 일하다, ~을 활용하다, ~을 다루다</td></tr><tr><td class=\"w\">essential</td><td class=\"m\">필수적인, 극히 중요한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">물어야 할 한 가지 질문은</span><span class=\"en\"><b>One question <span class=\"grammar-hl\">to ask</span> is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 정말로 어떤 습관을 고치려 하고 있는 것인가이다</span><span class=\"en\"><b>are you really <span class=\"grammar-hl\">trying to break</span> a habit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아니면 더 잘하려고 하는가</span><span class=\"en\"><b>or would you do better</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 습관에 결합함으로써 (유혹 묶기라고 알려진 것)?</span><span class=\"en\"><b>by <span class=\"grammar-hl\">attaching</span> to another one (<span class=\"grammar-hl\">known as temptation bundling</span>)?</b></span></div></div><div class=\"lec-sent-ko\">물어야 할 한 가지 질문은, 여러분은 정말로 어떤 습관을 고치려 하고 있는 것인가, 아니면 (유혹 묶기라고 알려진 대로) 다른 습관에 결합함으로써 더 잘하려고 하는가이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비즈니스나 자기계발에서 고려해야 할 구체적인 방법론을 제시합니다. attaching to another one은 의지력만으로 나쁜 습관을 끊어내려는 힘든 시도 대신, 하고 싶은 즐거운 일과 해야 하는 일을 하나로 묶는 전략이 더 효과적이라는 점을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to ask (to부정사): 형용사적 용법으로 앞의 명사 One question을 수식한다.</div><div class=\"lec-gr-item\">trying to break (to부정사): to break가 타동사 try의 목적어 역할을 하는 명사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">attaching (동명사): 전치사 by의 목적어 역할을 하는 명사구이다.</div><div class=\"lec-gr-item\">known as temptation bundling (과거분사(형용사)): known이 앞의 대명사 one을 수식한다 (= &#39;유혹 묶음으로 알려진 것&#39;). N + p.p. 구조로 &#39;one that is known as&#39;와 같이 주격 관계대명사와 be동사가 생략된 구조로 볼 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">break a habit</td><td class=\"m\">습관을 고치다, 습관을 버리다</td></tr><tr><td class=\"w\">do better</td><td class=\"m\">더 잘하다, 더 좋은 성과를 내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Wharton 대학의 Katy Milkman 교수는</span><span class=\"en\"><b>Wharton professor Katy Milkman</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연구 프로젝트를 이끌었다</span><span class=\"en\"><b>led a research project</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘헝거 게임을 체육관에 볼모로 잡아 두기’라고 불리는</span><span class=\"en\"><b><span class=\"grammar-hl\">called Holding the Hunger Games Hostage at the Gym</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에서 참가자들은 오직 접근할 수 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">where</span> participants could only have access</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 오디오 기기에</span><span class=\"en\"><b>to their audio devices</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">체육관에 있을 때에만.</span><span class=\"en\"><b><span class=\"grammar-hl\">while at the gym</span>.</b></span></div></div><div class=\"lec-sent-ko\">Wharton 대학의 교수인 Katy Milkman은 ‘헝거 게임을 체육관에 볼모로 잡아 두기’라고 불리는 연구 프로젝트를 이끌었는데, 이 연구에서 참가자들은 체육관에 있을 때에만 자신의 오디오 기기에 접근할 수 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;유혹 묶기&#39;의 실제 사례를 소개하며 주장을 뒷받침합니다. Holding the Hunger Games Hostage는 재미있는 오디오북(헝거 게임)을 듣고 싶은 욕구를 운동이라는 행동과 강제로 결합한 실험 설계를 비유적으로 표현한 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">called Holding the Hunger Games Hostage at the Gym (과거분사(형용사)): called가 앞의 명사 a research project를 수식한다 (= &#39;~라고 불리는 연구 프로젝트&#39;). N + p.p. 구조로 &#39;project that was called&#39;와 유사한 축약 구조이다.</div><div class=\"lec-gr-item\">Holding the Hunger Games Hostage 5형식(SVOC) 구조: 동명사 Holding 내부에서 목적어(the Hunger Games)와 목적격 보어(Hostage)를 취하는 구조이다.</div><div class=\"lec-gr-item\">where (관계부사): 선행사 the Gym을 부연 설명하며, 뒤에는 주어(participants)와 동사(could only have)를 갖춘 완전한 절이 온다.</div><div class=\"lec-gr-item\">while at the gym (분사구문): 접속사 while 뒤에 &#39;주어+be동사(they were)&#39;가 생략된 형태이다. 원래 절로 변환하면 &#39;while they were at the gym&#39;이 된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">participant</td><td class=\"m\">참가자</td></tr><tr><td class=\"w\">have access to</td><td class=\"m\">~에 접근하다, ~을 이용할 권한이 있다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 유혹적인 습관인 — 그 멋진 오디오북을 듣는 것을 — 사용한다</span><span class=\"en\"><b>This uses a <span class=\"grammar-hl\">tempting</span> habit — <span class=\"grammar-hl\">listening to that awesome audiobook</span> —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것을 결합한다</span><span class=\"en\"><b>and combines it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 습관과</span><span class=\"en\"><b>with a <span class=\"grammar-hl\">habit</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 기르고 싶어 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">people would like to build</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그러지 않았더라면 미룰 수밖에 없다고 느낄 수도 있는</span><span class=\"en\"><b>but may otherwise feel <span class=\"grammar-hl\">forced to put off</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">운동하기와 같은.</span><span class=\"en\"><b>like <span class=\"grammar-hl\">exercising</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 유혹적인 습관, 즉 그 멋진 오디오북을 듣는 것을 사용하여, 사람들이 기르고 싶어 하지만, 그러지 않았더라면 미룰 수 밖에 없다고 느낄 수도 있는, 운동하기와 같은 습관과 그것을 결합하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 구체적인 작동 원리를 상세히 설명합니다. feel forced to put off는 운동처럼 의지력이 많이 소모되는 일은 혼자 두면 자꾸 뒤로 미루게 되므로, 이를 즉각적인 즐거움과 엮어 실행 동기를 부여했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tempting (현재분사(형용사)): tempting이 뒤의 명사 habit을 수식하여 그 상태를 나타낸다 (= &#39;유혹적인 습관&#39;).</div><div class=\"lec-gr-item\">listening to that awesome audiobook (동명사): 문맥상 앞의 a tempting habit과 동격을 이루어 그 내용을 구체적으로 설명하는 명사적 역할을 한다.</div><div class=\"lec-gr-item\">habit people would like to build (관계대명사): 목적격 관계대명사(that/which)가 생략된 구조로, 관계대명사절 &#39;people would like to build&#39;가 선행사 habit을 수식한다. build의 목적어가 비어있는 불완전한 문장이다.</div><div class=\"lec-gr-item\">forced to put off (수동태): feel 뒤에 쓰인 p.p.(forced) 구조. force는 타동사로 force + O + toV(5형식) 구조를 취하는데, 목적어가 주어 자리로 이동하면서 수동구조 forced가 되고 뒤에 목적격 보어인 toV(to put off)가 남은 형태이다. 기본구조: V + O + toV.</div><div class=\"lec-gr-item\">put off (관용표현): &#39;미루다, 연기하다&#39;라는 뜻의 숙어이다.</div><div class=\"lec-gr-item\">exercising (동명사): 전치사 like의 목적어 역할을 하는 명사적 성질의 단어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tempting</td><td class=\"m\">유혹하는, 매력적인</td></tr><tr><td class=\"w\">feel forced to</td><td class=\"m\">~하도록 강요받는 느낌이 들다, 어쩔 수 없이 ~하다</td></tr><tr><td class=\"w\">put off</td><td class=\"m\">미루다, 연기하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">참가자들은</span><span class=\"en\"><b>The participants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 기기가 ‘볼모로 잡힌’</span><span class=\"en\"><b><span class=\"grammar-hl\">whose</span> devices <span class=\"grammar-hl\">were “held hostage”</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">51퍼센트 더 가능성이 높았다</span><span class=\"en\"><b>were 51 percent more likely</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">체육관을 방문할.</span><span class=\"en\"><b><span class=\"grammar-hl\">to visit</span> the gym.</b></span></div></div><div class=\"lec-sent-ko\">자신의 기기가 ‘볼모로 잡힌’ 참가자들은 체육관을 방문할 가능성이 51퍼센트 더 높았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 즉각적인 결과를 수치로 제시하여 전략의 실효성을 증명합니다. held hostage는 오직 운동할 때만 보상(오디오북)을 누릴 수 있게 제한한 환경이 실제 행동의 빈도를 획기적으로 높였음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whose (관계대명사): 소유격 관계대명사로 선행사 The participants를 수식하며, 뒤에 명사(devices)를 동반하여 문장을 연결한다.</div><div class=\"lec-gr-item\">were “held hostage” (수동태): be동사(were) + p.p.(held) 구조. hold는 타동사인데 뒤에 직접적인 목적어가 없어서 수동구조 were held 형태로 쓴다. 기본구조: V + O + C (hold A hostage: A를 볼모로 잡다).</div><div class=\"lec-gr-item\">to visit (to부정사): 형용사 likely를 수식하는 부사적 용법(형용사 수식)으로, 관용표현 &#39;be likely to(~할 가능성이 있다)&#39;의 일부이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">participant</td><td class=\"m\">참가자</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 정말로 놀라운 것은 ~이다</span><span class=\"en\"><b>And the really <span class=\"grammar-hl\">amazing</span> thing is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 끝난 뒤에 일어난 일인</span><span class=\"en\"><b><span class=\"grammar-hl\">what happened</span> after it was over:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 3분의 2가 비용을 지불하는 것을 선택했다</span><span class=\"en\"><b>nearly two­thirds opted <span class=\"grammar-hl\">to pay</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">체육관에서만 접근하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to have</span> gym­only access</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 기기에!</span><span class=\"en\"><b>for their devices!</b></span></div></div><div class=\"lec-sent-ko\">그리고 정말로 놀라운 것은 그것이 끝난 뒤에 일어난 일인데, 거의 (참가자의) 3분의 2가 자신의 기기에 체육관에서만 접근하도록 비용을 지불하는 것을 선택했다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 결론이자 가장 핵심적인 시사점을 강조하며 글을 마칩니다. opted to pay는 사람들이 이 강제적인 결합 시스템이 자신의 목표 달성에 큰 도움이 된다는 것을 체감하고, 자발적으로 비용을 들여서라도 그 제약 환경을 유지하려 했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">amazing (현재분사(형용사)): amazing이 뒤의 명사 thing을 수식하며 사물의 속성을 나타낸다 (= &#39;놀라운 것&#39;).</div><div class=\"lec-gr-item\">what happened (관계대명사): 선행사를 포함한 관계대명사 what이 이끄는 명사절로, 문장에서 주격 보어 역할을 한다.</div><div class=\"lec-gr-item\">to pay (to부정사): 동사 opted의 목적어 역할을 하는 명사적 용법이다.</div><div class=\"lec-gr-item\">to have (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~하기 위해&#39;로 해석한다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>습관은 뇌의 에너지 절약과 생존을 위해 필수적인 장치다.</li><li>비즈니스와 자기계발에서 습관을 억지로 끊기보다 &#39;유혹 묶기&#39;를 통해 활용하는 것이 효율적이다.</li><li>하고 싶은 일(오디오북)과 해야 하는 일(운동)을 결합하면 행동 실천 확률이 비약적으로 높아진다.</li><li>사람들은 이러한 시스템의 효과를 경험하면 자발적으로 비용을 지불해서라도 그 환경을 지속하려 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People can successfully foster new habits by utilizing temptation bundling that integrates a highly desirable activity with a less appealing but necessary task.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 매우 바람직한 활동과 덜 매력적이지만 필요한 과업을 통합하는 유혹 묶기를 활용함으로써 새로운 습관을 성공적으로 육성할 수 있다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_03월_24번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_24번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_24번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_03월_24번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_03월_24번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_03월_24번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_03월_24번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2026년_03월_24번_강의_audio/8.mp3","hl":"stage-4"}]
