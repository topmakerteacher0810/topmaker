고 본질적인 성과를 내기 위해 속도를 조절하는 것은 현대인에게 필수적인 심리적 자본(Psychological Capital)이 됩니다. 따라서 오늘날의 인내는 단순히 참고 기다리는 패배자의 태도가 아니라, 세상의 속도에 휘둘리지 않고 자신의 삶을 스스로 조절하는 능동적인 힘(Active power)으로 재정의되고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01인내심에 대한 부정적 통념</div><ul><li>전통적으로 인내심은 매력적이지 않고 지나치게 수동적인 태도로 인식되어 왔다.</li><li>매력 없는 과업으로의 인식 (unattractive)</li><li>방해될 정도로 수동적인 성격 (disturbingly passive)</li><li>핵심 키워드: 인내심(patience)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02권력 부재의 수단으로서의 인내</div><ul><li>과거의 인내심은 사회적 약자들에게 낮은 지위를 받아들이게 하는 심리적 도구였다.</li><li>주부나 인종 소수자에게 강요된 미덕 (virtue)</li><li>성과를 알리는 대신 기다리기만 하는 태도 (self-effacing)</li><li>낮은 지위에 순응하게 하는 심리적 조절 (psychologically accommodating)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03현대 사회의 가속화와 패러다임 전환</div><ul><li>사회의 속도가 빨라짐에 따라 인내심의 성격이 권력의 한 형태로 변화하고 있다.</li><li>사회의 가속화 (society accelerates)</li><li>인내심의 의미가 변화하는 시점 (something shifts)</li><li>핵심 키워드: 권력의 형태(form of power)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04저항의 힘으로서의 인내와 현재의 만족</div><ul><li>서두름을 거부하고 사물의 본래 시간을 존중하는 능력은 세상에 대한 통제력과 만족을 준다.</li><li>서두르려는 충동에 대한 저항 (resist the urge to hurry)</li><li>세상에 대한 영향력과 통제력 획득 (gain purchase on the world)</li><li>성취감을 미래로 미루지 않고 현재에서 얻음 (fulfillment)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">patience</td><td class=\"m\">인내, 참을성</td></tr><tr><td class=\"w\">prospect</td><td class=\"m\">전망, 예상, 가망</td></tr><tr><td class=\"w\">disturbingly</td><td class=\"m\">불안하게, 방해가 될 정도로</td></tr><tr><td class=\"w\">virtue</td><td class=\"m\">미덕, 덕목, 장점</td></tr><tr><td class=\"w\">urge upon</td><td class=\"m\">~에게 강력히 권고하다, ~에게 촉구하다</td></tr><tr><td class=\"w\">self-effacing</td><td class=\"m\">자기를 내세우지 않는, 삼가는</td></tr><tr><td class=\"w\">trumpet</td><td class=\"m\">(자랑스럽게) 알리다, 공표하다</td></tr><tr><td class=\"w\">accommodate oneself to</td><td class=\"m\">~에 적응하다, ~에 맞추다</td></tr><tr><td class=\"w\">resign oneself to</td><td class=\"m\">(체념하고) ~을 받아들이다, ~에 감수하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">accelerate</td><td class=\"m\">가속화되다, 빨라지다</td></tr><tr><td class=\"w\">gear for</td><td class=\"m\">~에 맞춰지다, ~에 대비하다</td></tr><tr><td class=\"w\">capacity</td><td class=\"m\">능력, 수용력</td></tr><tr><td class=\"w\">take the time</td><td class=\"m\">시간이 걸리다, 서두르지 않다</td></tr><tr><td class=\"w\">gain purchase on</td><td class=\"m\">~에 대한 영향력을 얻다, ~에 발판을 얻다</td></tr><tr><td class=\"w\">count</td><td class=\"m\">중요하다, 가치가 있다</td></tr><tr><td class=\"w\">derive</td><td class=\"m\">얻다, 끌어내다, 유래하다</td></tr><tr><td class=\"w\">put off</td><td class=\"m\">미루다, 연기하다</td></tr><tr><td class=\"w\">fulfillment</td><td class=\"m\">성취, 이행, 만족</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">말하는 것은 타당하다</span><span class=\"en\"><b><span class=\"grammar-hl\">It’s fair to say</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인내심이 끔찍한 평판을 가지고 있다고.</span><span class=\"en\"><b>that patience has a terrible name.</b></span></div></div><div class=\"lec-sent-ko\">인내심이 끔찍한 평판을 가지고 있다고 말하는 것은 타당하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 사람들이 &#39;인내심&#39;이라는 단어에 대해 부정적인 선입견을 품고 있다는 사실을 화두로 던집니다. has a terrible name은 인내심이라는 덕목이 현대 사회나 과거의 맥락에서 그리 매력적이거나 긍정적인 이미지로 인식되지 못하고 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It’s fair to say (가주어): 진주어: 가주어 It이 문장의 주어 자리에 오고, 진주어인 to부정사구(to say...)는 뒤로 보낸 구조다.</div><div class=\"lec-gr-item\">to say (to부정사): 명사적 용법으로 쓰여 이 문장의 진주어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">patience</td><td class=\"m\">인내, 참을성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우선 한 가지는,</span><span class=\"en\"><b>For one thing,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예상은</span><span class=\"en\"><b>the prospect</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 일을 한다는</span><span class=\"en\"><b>of <span class=\"grammar-hl\">doing</span> anything</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인내심을 요구할 것이라고 여러분이 들은</span><span class=\"en\"><b><span class=\"grammar-hl\">that you’ve been told will require</span> patience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그저 매력 없어 보인다.</span><span class=\"en\"><b>simply seems unattractive.</b></span></div></div><div class=\"lec-sent-ko\">우선 한 가지는, 인내심을 요구할 것이라고 들은 어떤 일을 여러분이 한다는 예상은 정말로 매력 없어 보인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;나쁜 평판&#39;의 첫 번째 이유를 제시합니다. the prospect of doing anything은 앞으로 해야 할 일의 진행 과정을 떠올리는 것인데, 그것이 인내를 요구한다는 말을 듣는 순간 우리는 그 일이 지루하고 고통스러울 것이라고 지레짐작하게 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">doing (동명사): 전치사 of의 목적어로 쓰여 &#39;~하는 것&#39;이라는 행위의 의미를 나타낸다.</div><div class=\"lec-gr-item\">that you’ve been told will require (관계대명사): 주격 관계대명사 that이 이끄는 절이 앞의 명사 anything을 수식한다. 절 내부에서 you&#39;ve been told는 삽입된 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">been told (수동태): be동사(have been)+p.p.(told) 구조. tell은 타동사인데 뒤에 목적어가 없어서 수동구조 been told 형태로 쓴다. 기본구조: tell + O + (that)절 (O에게 ~라고 말하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">patience</td><td class=\"m\">인내, 참을성</td></tr><tr><td class=\"w\">prospect</td><td class=\"m\">전망, 예상, 가망</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">더 구체적으로는, 하지만,</span><span class=\"en\"><b>More specifically, though,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 불안하게 할 정도로 수동적이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">it’s disturbingly passive</span>.</b></span></div></div><div class=\"lec-sent-ko\">더 구체적으로, 역시, 그것은 불안하게 할 정도로 수동적이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 &#39;매력 없음&#39;보다 더 본질적이고 구체적인 비판으로 나아갑니다. disturbingly passive는 인내심이라는 것이 상황을 주도적으로 해결하려 하기보다, 그저 가만히 앉아서 상황이 나아지기만을 기다리는 무기력한 태도로 보인다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it’s disturbingly passive 5형식(SVOC) 구조: 이 문장은 S(it) + V(is) + C(passive)의 2형식(SVC) 구조이며, 부사 disturbingly가 형용사 보어 passive를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">disturbingly</td><td class=\"m\">불안하게, 방해가 될 정도로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 미덕이다</span><span class=\"en\"><b>It is the virtue</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전통적으로 주부들에게 강요되어 온</span><span class=\"en\"><b><span class=\"grammar-hl\">that has traditionally been urged</span> upon housewives,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 남편들이 더 신나는 삶을 이끄는 동안</span><span class=\"en\"><b>while their husbands led more <span class=\"grammar-hl\">exciting</span> lives</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집 밖에서;</span><span class=\"en\"><b>outside the home;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 인종적 소수자들에게 (강요된),</span><span class=\"en\"><b>or on racial minorities,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 몇 십 년을 더 기다리라고 들은</span><span class=\"en\"><b><span class=\"grammar-hl\">told to wait</span> just a few more decades</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 완전한 시민권을 위해.</span><span class=\"en\"><b>for their full civil rights.</b></span></div></div><div class=\"lec-sent-ko\">그것은 전통적으로 남편이 집 밖에서 더 신나는 삶을 이끄는 동안 가정주부에게 강요되었던 미덕이고, 또한, 완전한 시민권을 위해 단지 몇 십 년을 더 기다리라고 들었던, 인종적 소수자에게 강요되었던 미덕이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인내심이 &#39;수동적&#39;이라고 비판받는 역사적, 사회적 배경을 구체적인 예시(주부, 소수자)를 통해 뒷받침합니다. traditionally been urged upon은 기득권층이 피지배층이나 약자들에게 순응을 요구할 때 &#39;인내&#39;라는 이름의 미덕을 도구로 사용해 왔음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that has traditionally been urged (관계대명사): 주격 관계대명사 that이 이끄는 절이 앞의 선행사 the virtue를 수식한다.</div><div class=\"lec-gr-item\">been urged (수동태): be동사(has been)+p.p.(urged) 구조. urge는 타동사인데 목적어가 없어서 수동구조 been urged 형태로 쓴다. 기본구조: urge A upon B (A를 B에게 권고/강요하다)</div><div class=\"lec-gr-item\">exciting (현재분사(형용사)): exciting이 뒤의 명사 lives를 수식하여 &#39;흥미진진한 삶&#39;이라는 의미를 만든다. exciting ≈ lives that are exciting</div><div class=\"lec-gr-item\">told to wait (과거분사(형용사)): 과거분사구 told가 앞의 racial minorities를 수식한다. tell + O + toV(5형식) 구조에서 목적어가 생략되고 p.p. 형태가 된 구조다. told to wait ≈ minorities who were told to wait</div><div class=\"lec-gr-item\">to wait (to부정사): 과거분사 told와 결합하여 보어 역할을 한다. 기본구조인 tell + O + toV에서 목적어가 주어나 수식받는 명사로 나가면서 to부정사가 남은 형태다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">virtue</td><td class=\"m\">미덕, 덕목, 장점</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">재능은 있지만 자신을 내세우지 않는 직원은</span><span class=\"en\"><b>The talented but self­effacing employee</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">승진을 위해 “참을성 있게 기다리는”</span><span class=\"en\"><b><span class=\"grammar-hl\">who “waits patiently” for a promotion</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 느끼기에</span><span class=\"en\"><b>we tend <span class=\"grammar-hl\">to feel</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오랜 시간 기다리게 될 것이다:</span><span class=\"en\"><b>will be waiting a long time:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 자신의 성취를 널리 알리고 있어야 한다</span><span class=\"en\"><b>she ought to <span class=\"grammar-hl\">be trumpeting</span> her achievements</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대신에.</span><span class=\"en\"><b>instead.</b></span></div></div><div class=\"lec-sent-ko\">재능은 있지만 자기를 내세우지 않는, 승진을 위해 ‘인내심 있게 기다리는’ 직원은 오랜 시간을 기다리게 될 것이라고, 우리는 느끼는 경향이 있으니, 대신 그녀는 자신의 성취를 널리 알리고 있어야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 현대 직장 생활의 예를 들어 인내심의 부정적인 측면을 재차 강조합니다. trumpeting her achievements는 가만히 순서를 기다리는 인내심보다는 자신의 가치를 적극적으로 드러내고 목소리를 높이는 것이 오늘날의 생존 방식이라는 사회적 통념을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who “waits patiently” for a promotion (관계대명사): 주격 관계대명사 who가 이끄는 절이 앞의 명사 employee를 수식한다.</div><div class=\"lec-gr-item\">to feel (to부정사): tend의 목적어 역할을 하는 명사적 용법으로 쓰였다. tend to V (~하는 경향이 있다)</div><div class=\"lec-gr-item\">be trumpeting (현재진행): 조동사 ought to 뒤에 be + -ing 형태가 결합하여 &#39;자랑하고 있어야 한다&#39;는 진행의 의미를 강조한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">trumpet</td><td class=\"m\">(자랑스럽게) 알리다, 공표하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그런 모든 경우에,</span><span class=\"en\"><b>In all such cases,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인내심은 방식이다</span><span class=\"en\"><b>patience is a way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분 자신을 심리적으로 순응시키는</span><span class=\"en\"><b>of psychologically <span class=\"grammar-hl\">accommodating</span> yourself</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">권력의 부족에,</span><span class=\"en\"><b>to a lack of power,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(즉) 태도이다</span><span class=\"en\"><b>an attitude</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분을 돕기 위해 의도된</span><span class=\"en\"><b><span class=\"grammar-hl\">intended to help</span> you</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분 자신을 단념하도록</span><span class=\"en\"><b>to resign yourself</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 낮은 지위에,</span><span class=\"en\"><b>to your lowly position,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이론적인 희망 속에서</span><span class=\"en\"><b>in theoretical hopes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다가올 더 나은 날들에 대한.</span><span class=\"en\"><b>of better days <span class=\"grammar-hl\">to come</span>.</b></span></div></div><div class=\"lec-sent-ko\">그런 모든 경우에, 다가올 더 나은 날들에 대한 이론상으로만 존재하는 희망 속에서, 인내심은 권력의 부족에 여러분 자신을 심리적으로 순응시키는 방식이고, 여러분 자신을 낮은 지위로 단념하도록 돕기 위해 의도된 태도이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지 언급한 인내심의 부정적 이미지(수동성, 순응)를 하나로 요약합니다. psychologically accommodating yourself는 상황을 바꿀 힘이 없는 사람이 현실의 불만족을 억지로 참아내며 스스로를 다독이는 자기 합리화에 가깝다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">accommodating (동명사): 전치사 of의 목적어 역할을 하며 &#39;~에 적응시키는 것&#39;이라는 명사적 개념을 나타낸다.</div><div class=\"lec-gr-item\">intended to help (과거분사(형용사)): intended가 앞의 명사 an attitude를 수식한다. intended to help ≈ an attitude which is intended to help</div><div class=\"lec-gr-item\">help you to resign 5형식(SVOC) 구조: 준사역동사 help + 목적어(you) + 목적격보어(to resign) 구조로 &#39;당신이 체념하도록 돕다&#39;는 의미를 나타낸다.</div><div class=\"lec-gr-item\">to come (to부정사): 형용사적 용법으로 앞의 명사 better days를 수식하여 &#39;다가올 더 좋은 날들&#39;이라는 의미를 만든다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">patience</td><td class=\"m\">인내, 참을성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 사회가 가속화됨에 따라,</span><span class=\"en\"><b>But <span class=\"grammar-hl\">as society accelerates</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무언가가 변한다.</span><span class=\"en\"><b>something shifts.</b></span></div></div><div class=\"lec-sent-ko\">그러나 사회가 가속화됨에 따라, 무언가가 변한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 흐름이 완전히 바뀌는 전환점입니다. something shifts는 지금까지 설명한 &#39;수동적인 인내심&#39;의 정의가 현대의 초고속 사회에서는 전혀 다른 가치와 의미를 지니게 되었음을 암시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as society accelerates (관용표현): as가 접속사로 쓰여 &#39;~함에 따라&#39;라는 비례의 의미를 나타내는 부사절을 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">accelerate</td><td class=\"m\">가속화되다, 빨라지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">점점 더 많은 맥락에서,</span><span class=\"en\"><b>In more and more contexts,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인내심은 권력의 한 형태가 된다.</span><span class=\"en\"><b>patience <span class=\"grammar-hl\">becomes a form of power</span>.</b></span></div></div><div class=\"lec-sent-ko\">점점 더 많은 맥락에서, 인내심은 권력의 한 ‘형태’가 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심 주장(요지)입니다. a form of power는 과거에는 약자의 굴욕적인 순응이었던 인내심이, 이제는 남들이 갖지 못한 강력한 경쟁력이자 주도적인 통제 수단이 되었다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">becomes a form of power 5형식(SVOC) 구조: 이 문장은 주어(patience) + 동사(becomes) + 보어(a form of power)로 이루어진 2형식(SVC) 구조다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">patience</td><td class=\"m\">인내, 참을성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">서두름에 맞춰진 세상에서,</span><span class=\"en\"><b>In a world <span class=\"grammar-hl\">geared for hurry</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서두르고 싶은 충동을 억제하는 능력은 —</span><span class=\"en\"><b>the capacity <span class=\"grammar-hl\">to resist</span> the urge <span class=\"grammar-hl\">to hurry</span> —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일에 소요되는 시간이 소요되도록 허용하는 —</span><span class=\"en\"><b><span class=\"grammar-hl\">to allow</span> things to take the time they take —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방식이다</span><span class=\"en\"><b>is a way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세상에 대한 유리한 입장을 얻는</span><span class=\"en\"><b><span class=\"grammar-hl\">to gain</span> purchase on the world,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요한 일을 하고</span><span class=\"en\"><b>to do the work <span class=\"grammar-hl\">that counts</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 만족을 이끌어 내는</span><span class=\"en\"><b>and to derive satisfaction</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행위 그 자체로부터</span><span class=\"en\"><b>from the <span class=\"grammar-hl\">doing</span> itself,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분의 모든 성취를 미루는 대신에</span><span class=\"en\"><b>instead of <span class=\"grammar-hl\">putting off</span> all your fulfillment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미래로.</span><span class=\"en\"><b>to the future.</b></span></div></div><div class=\"lec-sent-ko\">서두름에 맞춰진 세상에서, 서두르고 싶은 충동을 억제하는, 즉 일에 소요되는 시간이 소요되도록 허용하는 능력은 세상에 대한 유리한 입장을 얻고, 중요한 일을 하고, 여러분의 모든 성취를 미래로 미루는 대신에 행위 그 자체로부터 만족을 이끌어 내는 방식이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 결론으로, 현대 사회에서 인내심이 왜 강력한 힘이 되는지 상세히 설명합니다. gain purchase on the world는 속도에 휩쓸리지 않고 상황을 객관적으로 파악하여 주도권을 잡는다는 의미이며, the work that counts는 서두르느라 놓치기 쉬운 본질적이고 가치 있는 성과를 일궈낸다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">geared for hurry (과거분사(형용사)): geared가 앞의 명사 a world를 수식한다. geared for hurry ≈ a world which is geared for hurry</div><div class=\"lec-gr-item\">to resist (to부정사): 형용사적 용법으로 앞의 명사 the capacity를 수식한다.</div><div class=\"lec-gr-item\">to hurry (to부정사): 형용사적 용법으로 앞의 명사 the urge를 수식한다.</div><div class=\"lec-gr-item\">allow things to take 5형식(SVOC) 구조: 동사 allow + 목적어(things) + 목적격보어(to take) 구조로 &#39;상황이 시간을 갖도록 허용하다&#39;는 의미를 만든다.</div><div class=\"lec-gr-item\">to allow (to부정사): 앞의 to resist와 동격 관계이거나 부연 설명을 하는 형용사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">to gain (to부정사): 형용사적 용법으로 앞의 명사 a way를 수식한다. (to do, to derive와 병렬 구조)</div><div class=\"lec-gr-item\">that counts (관계대명사): 주격 관계대명사 that이 이끄는 절이 앞의 명사 the work를 수식한다.</div><div class=\"lec-gr-item\">doing (동명사): 전치사 from의 목적어이며, the와 함께 쓰여 &#39;행위&#39; 그 자체를 나타내는 명사로 기능한다.</div><div class=\"lec-gr-item\">putting off (동명사): 전치사구 instead of의 목적어로 쓰여 &#39;미루는 것&#39;이라는 행위의 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">capacity</td><td class=\"m\">능력, 수용력</td></tr><tr><td class=\"w\">take the time</td><td class=\"m\">시간이 걸리다, 서두르지 않다</td></tr><tr><td class=\"w\">gain purchase on</td><td class=\"m\">~에 대한 영향력을 얻다, ~에 발판을 얻다</td></tr><tr><td class=\"w\">count</td><td class=\"m\">중요하다, 가치가 있다</td></tr><tr><td class=\"w\">derive</td><td class=\"m\">얻다, 끌어내다, 유래하다</td></tr><tr><td class=\"w\">fulfillment</td><td class=\"m\">성취, 이행, 만족</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>과거에 인내심은 약자나 소수자에게 강요되던 수동적이고 굴욕적인 &#39;체념&#39;의 이미지였다.</li><li>하지만 현대 사회가 극도로 빨라지면서 인내심의 의미가 완전히 뒤바뀌었다.</li><li>이제 인내심은 서두름을 강요하는 세상의 압박에 저항할 수 있는 강력한 &#39;능력&#39;이자 &#39;권력&#39;이다.</li><li>이러한 인내심을 통해 우리는 삶의 주도권을 잡고, 진정으로 중요한 성과를 내며 현재의 만족을 누릴 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Patience is evolving from a sign of passive resignation for the marginalized into a strategic form of power by allowing people to resist the societal pressure of hurry for more meaningful achievements.</div>\n              <div class=\"lec-final-sum-ko\">인내는 소외된 이들의 수동적인 체념이라는 꼬리표를 떼고, 더 의미 있는 성취를 위해 사회적인 서두름의 압박을 거부하게 하는 전략적인 힘의 형태로 진화하고 있다.</div></div></div>"],"segs":[[{"audio":"./41_audio/1.mp3","hl":null}],[{"audio":"./41_audio/2.mp3","hl":null}],[{"audio":"./41_audio/3.mp3","hl":null},{"audio":"./41_audio/4.mp3","hl":"stage-0"},{"audio":"./41_audio/5.mp3","hl":"stage-1"},{"audio":"./41_audio/6.mp3","hl":"stage-2"},{"audio":"./41_audio/7.mp3","hl":"stage-3"}],[{"audio":"./41_audio/8.mp3","hl":null}],[{"
