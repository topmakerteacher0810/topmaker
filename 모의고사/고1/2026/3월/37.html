685/wDr0FgO4646jk+3Pr1B9/TlX/RfN2/zQDqKTI9R/nHHP+eaQMpxyOQe47H2JH159PwYC89sY565zn+g9+aX/Pp0poZT0I46/h7fT/PFBKgdRjHr2x368fnQA6j/AD/nH6U0MuM7hjr1H4/jmgsoxkjnHOR37/TvR89/6sA6j/P+NGR6im7lzjI/TH+ef0NAf1/XoO9vx6f5FNY/Kx9ATn6e/P0PcflS5HGMHJx+X+H8/SmnhGKnOFJBPOcDvyM+nJoD8/6/zP/Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Plastic Industry’s Growth and the Deceptive Shift of Responsibility<small>플라스틱 산업의 성장과 책임 전가의 기만성</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">플라스틱 산업은 제2차 세계 대전(World War II) 당시 군수 물자 생산을 위해 비약적으로 발전했으며, 전후에는 그 기술력이 대량 소비재로 이어지며 풍요로운 아메리칸 드림(American Dream)의 상징으로 자리 잡았습니다. 하지만 환경 오염에 대한 우려가 커지자, 기업들은 생산 단계의 변화 대신 재활용을 만능 해결책처럼 홍보하며 오염의 원인을 기업이 아닌 소비자의 책임(Consumer Responsibility)으로 돌리는 전략을 취하기 시작했습니다. 이는 마치 물건을 잔뜩 팔아놓고 그 뒤처리는 구매자가 알아서 하라는 식의 교묘한 마케팅인 그린워싱(Greenwashing)의 시초라고도 볼 수 있습니다. 이러한 역사적 배경을 알면 지문에서 말하는 플라스틱의 &#39;숨겨진 역사&#39;가 단순히 편리함의 역사가 아니라, 책임을 전가해 온 산업의 구조적 전략을 의미한다는 점을 더 깊이 이해할 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01플라스틱 이전의 지속 가능한 삶</div><ul><li>플라스틱이 보편화되기 전 인류는 지금보다 쓰레기 문제가 적은 지속 가능한 삶을 영위했다.</li><li>과거의 지속 가능한 생활 방식 (sustainably)</li><li>현재보다 훨씬 적었던 쓰레기 문제 (fewer waste problems)</li><li>핵심 키워드: 과거(Before plastic)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02플라스틱 산업의 급격한 팽창</div><ul><li>제2차 세계 대전을 거치며 플라스틱은 편리함과 번영을 상징하는 필수적인 존재가 되었다.</li><li>제2차 세계 대전(World War II) 중 급격한 채택과 확산</li><li>아메리칸 드림을 상징하는 편리함(convenience)과 번영(prosperity)</li><li>일상생활에 깊이 뿌리내린 산업 (deeply rooted)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03환경 오염에 대한 자각</div><ul><li>플라스틱 사용이 늘어남에 따라 환경적 대가가 드러났고 이는 초기 환경 운동의 계기가 되었다.</li><li>편리함 이면에 숨겨진 환경적 영향 (environmental impact)</li><li>번영의 대가(price)에 대한 대중의 인식 변화</li><li>환경 운동(environmental movement)의 시작</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04기업의 책임 회피 전략</div><ul><li>플라스틱 업계는 재활용을 해결책으로 내세우며 오염의 책임을 소비자에게 전가했다.</li><li>재활용(recycling)을 만능 해결책으로 제시하는 캠페인 전개</li><li>오염의 원인을 기업(corporations)이 아닌 소비자(consumers)의 탓으로 돌림</li><li>핵심 키워드: 대응 전략(counter) 및 홍보(campaigns)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deeply rooted in</td><td class=\"m\">~에 깊이 뿌리 박힌, 깊이 정착된</td></tr><tr><td class=\"w\">sustainably</td><td class=\"m\">지속 가능하게</td></tr><tr><td class=\"w\">invention</td><td class=\"m\">발명, 발명품</td></tr><tr><td class=\"w\">adoption</td><td class=\"m\">채택, 도입</td></tr><tr><td class=\"w\">explosion</td><td class=\"m\">급증, 폭발적 증가</td></tr><tr><td class=\"w\">symbolize</td><td class=\"m\">상징하다, 나타내다</td></tr><tr><td class=\"w\">convenience</td><td class=\"m\">편리, 편의</td></tr><tr><td class=\"w\">prosperity</td><td class=\"m\">번영, 번창</td></tr><tr><td class=\"w\">come with a price</td><td class=\"m\">대가가 따르다, 희생이 따르다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">impact</td><td class=\"m\">영향, 충격</td></tr><tr><td class=\"w\">plant the seeds of</td><td class=\"m\">~의 씨앗을 뿌리다, ~의 계기를 만들다</td></tr><tr><td class=\"w\">counter</td><td class=\"m\">대응하다, 반박하다</td></tr><tr><td class=\"w\">concern</td><td class=\"m\">우려, 걱정</td></tr><tr><td class=\"w\">launch</td><td class=\"m\">(캠페인 등을) 시작하다, 착수하다</td></tr><tr><td class=\"w\">present</td><td class=\"m\">제시하다, 보여주다</td></tr><tr><td class=\"w\">push the idea</td><td class=\"m\">생각을 강요하다, 아이디어를 밀어붙이다</td></tr><tr><td class=\"w\">fault</td><td class=\"m\">잘못, 책임</td></tr><tr><td class=\"w\">flood the market with</td><td class=\"m\">시장에 ~을 넘쳐나게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 먼저 이해할 필요가 있다</span><span class=\"en\"><b>We first need <span class=\"grammar-hl\">to understand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">짧지만 숨겨진 역사를</span><span class=\"en\"><b>the short but <span class=\"grammar-hl\">hidden</span> history</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플라스틱 산업 이면의</span><span class=\"en\"><b>behind the plastics industry</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것이 어떻게 깊이 뿌리 내리게 되었는지를</span><span class=\"en\"><b>and <span class=\"grammar-hl\">how it became deeply rooted</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 일상생활에</span><span class=\"en\"><b>in our daily lives.</b></span></div></div><div class=\"lec-sent-ko\">우리는 먼저 플라스틱 산업 이면의 짧지만 숨겨진 역사와 어떻게 그것이 우리의 일상생활에 깊이 뿌리 내리게 되었는지를 이해할 필요가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로, 우리가 당연하게 쓰는 플라스틱의 확산 과정에 우리가 미처 몰랐던 전략이나 배경이 있음을 암시하며 독자의 호기심을 유도합니다. became deeply rooted in은 플라스틱이 우리 생활의 아주 사소한 부분까지 파고들어 이제는 그것 없이는 일상이 유지되기 힘들 만큼 필수적인 존재가 되었다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to understand (to부정사): 명사적 용법. 타동사 need의 목적어 역할을 하며 &#39;~하는 것을&#39;로 해석됨.</div><div class=\"lec-gr-item\">hidden (과거분사(형용사)): hidden이 명사 history를 수식함. &#39;숨겨진 역사&#39;라는 의미를 나타냄.</div><div class=\"lec-gr-item\">how it became deeply rooted (간접의문문): [의문사(how) + 주어(it) + 동사(became...)] 어순으로, understand의 목적어 역할을 하는 명사절임.</div><div class=\"lec-gr-item\">became deeply rooted (수동구조): be동사 대신 become이 쓰인 become+p.p. 구조. root는 타동사인데 목적어가 없어서 수동구조 became rooted 형태로 쓴다. 기본구조: root A in B (A를 B에 뿌리 내리게 하다)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deeply rooted in</td><td class=\"m\">~에 깊이 뿌리 박힌, 깊이 정착된</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">플라스틱 이전에는,</span><span class=\"en\"><b>Before plastic,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 더 지속 가능하게 살았다,</span><span class=\"en\"><b>people lived more sustainably,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 적은 쓰레기 문제를 가지고</span><span class=\"en\"><b>with far fewer waste <span class=\"grammar-hl\">problems</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 오늘날 직면한 것보다</span><span class=\"en\"><b><span class=\"grammar-hl\">than we face</span> today.</b></span></div></div><div class=\"lec-sent-ko\">플라스틱 이전에는, 사람들은 우리가 오늘날 직면한 것보다 훨씬 더 적은 쓰레기 문제를 가지고, 더 지속 가능하게 살았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;역사&#39;의 출발점을 보여줍니다. 플라스틱이 없던 시절의 삶을 언급하며 현재의 환경 위기가 결코 자연스러운 것이 아님을 대조적으로 보여줍니다. lived more sustainably는 자원을 한 번 쓰고 버리는 것이 아니라 고쳐 쓰거나 다시 사용하여 환경에 해를 덜 끼치며 살았다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">problems than we face (관계대명사): problems와 we 사이에 목적격 관계대명사(that/which)가 생략되어 있으며, face의 목적어가 빠진 불완전한 절이 이어져 명사 problems를 수식함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sustainably</td><td class=\"m\">지속 가능하게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플라스틱의 발명,</span><span class=\"en\"><b>after the invention of plastic,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제2차 세계 대전 동안 그것의 빠른 채택,</span><span class=\"en\"><b>its rapid adoption during World War II,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 소비재로서의 그것의 폭발적 증가 이후에,</span><span class=\"en\"><b>and its explosion into consumer goods,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플라스틱은 도처에 있었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">plastic was everywhere</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 플라스틱의 발명, 제2차 세계 대전 동안 그것의 빠른 채택, 그리고 소비재로서의 폭발적 증가 이후에, 플라스틱은 도처에 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 지속 가능한 삶이 파괴되는 전환점을 설명합니다. 전쟁이라는 특수한 상황과 이후의 대량 소비 시대가 결합하면서 플라스틱이 세상의 중심이 되었음을 보여줍니다. explosion into consumer goods는 군수 물자로 쓰이던 플라스틱이 전쟁이 끝난 후 민간인들이 쓰는 온갖 물건으로 쏟아져 나오기 시작했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">plastic was everywhere 1형식 구조: 주어(plastic)와 동사(was), 그리고 장소를 나타내는 부사구(everywhere)로 구성된 문장임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">invention</td><td class=\"m\">발명, 발명품</td></tr><tr><td class=\"w\">adoption</td><td class=\"m\">채택, 도입</td></tr><tr><td class=\"w\">explosion</td><td class=\"m\">급증, 폭발적 증가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 성장하는 산업은</span><span class=\"en\"><b>The <span class=\"grammar-hl\">growing</span> industry</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상징하게 되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">came to symbolize</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">편리함과 번영을</span><span class=\"en\"><b>the convenience and prosperity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아메리칸 드림의</span><span class=\"en\"><b>of the American dream.</b></span></div></div><div class=\"lec-sent-ko\">이 성장하는 산업은 아메리칸 드림의 편리함과 번영을 상징하게 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 플라스틱 산업이 단순한 물건 제조를 넘어, 당시 사람들이 갈망하던 풍요로운 삶의 상징이 되었음을 설명합니다. symbolize the convenience and prosperity는 플라스틱 덕분에 집안일이 쉬워지고 누구나 값싸게 물건을 살 수 있게 된 것을 성공한 중산층의 모습과 연결했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">growing (현재분사(형용사)): growing이 industry를 수식하며 &#39;성장하는 산업&#39;이라는 의미를 나타냄. N + -ing 구조임.</div><div class=\"lec-gr-item\">came to symbolize (관용표현): &#39;come to + 동사원형&#39;은 &#39;~하게 되다&#39;라는 뜻으로, 상태나 동작의 변화를 의미함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">symbolize</td><td class=\"m\">상징하다, 나타내다</td></tr><tr><td class=\"w\">convenience</td><td class=\"m\">편리, 편의</td></tr><tr><td class=\"w\">prosperity</td><td class=\"m\">번영, 번창</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 꿈은</span><span class=\"en\"><b>This dream</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대가와 함께 왔다.</span><span class=\"en\"><b><span class=\"grammar-hl\">came with</span> a price.</b></span></div></div><div class=\"lec-sent-ko\">이 꿈은 대가와 함께 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;번영&#39;이라는 긍정적인 면 뒤에 가려진 어두운 이면을 예고하는 전환점입니다. came with a price는 편리하고 풍요로운 생활을 누린 결과로 우리가 살고 있는 지구의 환경이 심각하게 오염되는 부정적인 결과가 발생했다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">came with (관용표현): &#39;~이 따르다&#39;, &#39;~을 동반하다&#39;라는 의미로 쓰임.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시간이 흐르면서,</span><span class=\"en\"><b>Over time,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 알아차리기 시작했고</span><span class=\"en\"><b>people began <span class=\"grammar-hl\">to notice</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경적 영향을,</span><span class=\"en\"><b>the environmental impact,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 초기 씨앗이</span><span class=\"en\"><b>and the early seeds</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘날 환경 운동의</span><span class=\"en\"><b>of today’s environmental movement</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심어졌다.</span><span class=\"en\"><b><span class=\"grammar-hl\">were planted</span>.</b></span></div></div><div class=\"lec-sent-ko\">시간이 흐르면서, 사람들은 환경적 영향을 알아차리기 시작했고, 오늘날 환경 운동의 초기 씨앗이 심어졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 플라스틱 남용의 부작용이 겉으로 드러나면서 시민들이 문제를 제기하기 시작한 역사적 시점을 보여줍니다. early seeds of today’s environmental movement는 환경 오염에 위기감을 느낀 개인들이 모여서 목소리를 내기 시작한 것이 현재 대규모 환경 단체나 활동들의 기원이 되었다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to notice (to부정사): 명사적 용법. 타동사 began의 목적어 역할을 함.</div><div class=\"lec-gr-item\">were planted (수동태): be동사(were)+p.p.(planted) 구조. plant는 타동사인데 뒤에 목적어가 없어서 수동구조 were planted 형태로 쓴다. 기본구조: V + O (plant something)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">impact</td><td class=\"m\">영향, 충격</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만,</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플라스틱 산업은</span><span class=\"en\"><b>the plastics industry</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 우려에 빠르게 대응했다,</span><span class=\"en\"><b>was quick <span class=\"grammar-hl\">to counter</span> these concerns,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캠페인을 시작하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">launching</span> campaigns</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재활용을 제시하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that presented</span> recycling</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해결책으로서</span><span class=\"en\"><b>as the solution</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 모든 문제에 대한</span><span class=\"en\"><b>to all our problems.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 플라스틱 산업은 이러한 우려에 빠르게 대응했고, 우리의 모든 문제에 대한 해결책으로 재활용을 제시하는 캠페인을 시작했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시민들의 비판에 직면한 기업들이 자신들의 이익을 지키기 위해 내놓은 방어 전략을 설명합니다. counter these concerns는 플라스틱에 대한 부정적인 인식이 퍼져서 제품 판매가 줄어들까 봐 기업들이 발 빠르게 여론 조작에 나섰다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to counter (to부정사): 부사적 용법(형용사 수식). 앞에 있는 형용사 quick을 수식하여 &#39;~하기에 (빠른)&#39;이라는 의미를 나타냄.</div><div class=\"lec-gr-item\">launching (분사구문): 현재분사(-ing)가 부사적 기능을 수행함. 원래 절로 변환하면 as it launched가 된다.</div><div class=\"lec-gr-item\">that presented (관계대명사): 주격 관계대명사로, 선행사 campaigns를 수식함. 관계대명사 뒤에는 주어가 없는 불완전한 절이 온다.</div><div class=\"lec-gr-item\">presented recycling as (관용표현): &#39;present A as B&#39; 구조로 &#39;A를 B로 제시하다/묘사하다&#39;라는 의미를 가짐.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">counter</td><td class=\"m\">대응하다, 반박하다</td></tr><tr><td class=\"w\">concern</td><td class=\"m\">우려, 걱정</td></tr><tr><td class=\"w\">launch</td><td class=\"m\">(캠페인 등을) 시작하다, 착수하다</td></tr><tr><td class=\"w\">present</td><td class=\"m\">제시하다, 보여주다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 생각을 밀어붙였다</span><span class=\"en\"><b>They pushed <span class=\"grammar-hl\">the idea</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오염이 소비자의 잘못이라는,</span><span class=\"en\"><b><span class=\"grammar-hl\">that pollution was the fault of consumers</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">기업의 (잘못이) 아니라</span><span class=\"en\"><b>not the corporations</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플라스틱으로 시장을 범람시키는</span><span class=\"en\"><b><span class=\"grammar-hl\">flooding</span> the market with plastic.</b></span></div></div><div class=\"lec-sent-ko\">그들은 오염이 플라스틱으로 시장을 범람시키는 기업의 잘못이 아니라 소비자의 잘못이라는 생각을 밀어붙였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 핵심 결론으로, 기업들이 재활용 캠페인을 통해 환경 오염의 책임을 교묘하게 개인에게 떠넘겼음을 폭로합니다. flooding the market with plastic은 기업들이 뒷감당은 생각하지 않은 채 오로지 이윤을 위해 엄청난 양의 플라스틱 제품을 시장에 공급해왔다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the idea that pollution was the fault of consumers 동격의 that: 명사 idea + that절 구조로, that절 이하가 idea의 구체적인 내용을 설명함. that 뒤에는 주어(pollution)와 보어(the fault)를 갖춘 완전한 절이 온다.</div><div class=\"lec-gr-item\">flooding (현재분사(형용사)): flooding이 corporations를 수식하며 &#39;시장을 플라스틱으로 넘쳐나게 하는 기업들&#39;이라는 의미를 나타냄. N + -ing 구조로, corporations that were flooding과 유사함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fault</td><td class=\"m\">잘못, 책임</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>플라스틱 등장 이전의 인류는 쓰레기 문제 없이 지속 가능한 삶을 살았다.</li><li>전쟁과 소비 시대를 거치며 플라스틱은 편리함과 번영(아메리칸 드림)의 상징으로 자리 잡았다.</li><li>환경 문제가 불거지자 사람들은 환경 운동을 시작하며 기업을 압박했다.</li><li>플라스틱 기업들은 책임을 회피하기 위해 &#39;재활용&#39;을 강조하며 오염의 원인을 소비자의 탓으로 돌리는 캠페인을 펼쳤다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The plastic industry grew into a symbol of modern convenience while strategically placing the burden of environmental pollution on consumers through recycling campaigns.</div>\n              <div class=\"lec-final-sum-ko\">플라스틱 산업은 현대적 편리함의 상징으로 성장한 반면, 재활용 캠페인을 통해 환경 오염의 짐을 소비자에게 전략적으로 지웠다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/7.mp3","hl":"stage-3"}],[{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/8.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/9.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/10.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/11.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/12.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/13.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/14.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/15.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/16.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/17.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/18.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/19.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/20.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/21.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_37번_강의_audio/22.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_
