 유한한 시간 속에 갇힌 개인이면서도 동시에 거대한 인류의 일부인 데이터 스트림이다.</li><li>형체화된 개인(embodied individuals)의 한계</li><li>네트워크화된 데이터 스트림(networked data streams)이자 영향력 행사자</li><li>더 거대한 인류(grander humanity)의 일원</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03좋은 조상이 되어야 할 책임</div><ul><li>오늘날 우리의 결정은 미래에 큰 영향을 미치므로 장기적인 관점에서 미래 세대의 안녕을 고려해야 한다.</li><li>좋은 조상(good ancestors)이 되어야 할 책임(responsibility)</li><li>장기적인 관점(long view)을 통한 미래 상상</li><li>수십억 명의 미래 인구에 대한 안녕(well-being) 고려</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">047세대 관리 원칙의 교훈</div><ul><li>과거 북미 이로쿼이족 지도자들은 의사결정 시 미래의 후손들을 깊이 고려하는 전통을 세웠다.</li><li>7세대 관리 원칙(seven generation stewardship)</li><li>모든 결정이 7세대 후의 자녀에게 미칠 영향(impact)을 고려함</li><li>역사적 리더십의 사례 제시</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05후손을 위한 유산의 보존</div><ul><li>우리는 조상들이 남긴 혜택을 누리는 만큼 후손들이 누려야 할 자원을 훼손하지 말아야 한다.</li><li>조상(ancestors)이 가꾼 정원을 즐기는 현재 세대</li><li>후손(descendants)으로부터 그늘(shade)을 훔치지 말 것</li><li>세대 간의 윤리적 의무와 지속 가능성 강조</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unprecedented</td><td class=\"m\">전례 없는, 유례없는</td></tr><tr><td class=\"w\">embody</td><td class=\"m\">구체화하다, 형태를 부여하다, 구현하다</td></tr><tr><td class=\"w\">far-reaching</td><td class=\"m\">광범위한, 지대한 영향을 미치는</td></tr><tr><td class=\"w\">ancestor</td><td class=\"m\">조상, 선조</td></tr><tr><td class=\"w\">take the long view</td><td class=\"m\">멀리 내다보다, 장기적인 안목을 갖다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">well-being</td><td class=\"m\">안녕, 복지, 행복</td></tr><tr><td class=\"w\">stewardship</td><td class=\"m\">관리, 책임, 보살핌</td></tr><tr><td class=\"w\">instruct</td><td class=\"m\">지시하다, 가르치다</td></tr><tr><td class=\"w\">precious</td><td class=\"m\">귀중한, 값비싼</td></tr><tr><td class=\"w\">descendant</td><td class=\"m\">후손, 자손</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 이제 지점에 와 있다</span><span class=\"en\"><b>We are now at a point</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전례 없는 유전적, 문화적, 그리고 환경적 힘의</span><span class=\"en\"><b>of unprecedented genetic, cultural, and environmental power</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 종으로서</span><span class=\"en\"><b>as a species,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리는 연결되어 있다</span><span class=\"en\"><b>and we <span class=\"grammar-hl\">are linked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거의 지구상의 모든 사람과</span><span class=\"en\"><b>to nearly every other person on Earth.</b></span></div></div><div class=\"lec-sent-ko\">우리는 이제 종으로서 전례 없는 유전적, 문화적, 그리고 환경적 힘의 지점에 와 있고, 우리는 거의 지구상의 한 사람 걸러 한 사람과 연결되어 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 인류가 처한 현재 상황을 제시하며 글을 시작합니다. unprecedented ... power는 과학 기술과 문명의 발달로 과거 그 어느 때보다 인류가 지구 전체에 막강한 영향력을 행사할 수 있게 되었음을 의미합니다. 또한, 전 세계가 긴밀하게 연결되어 있어 한 개인이나 국가의 행동이 전 지구적인 파급력을 가진다는 점을 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are linked (수동태): be동사(are)+p.p.(linked) 구조. link는 타동사인데 뒤에 목적어가 없어서 수동구조 are linked 형태로 쓴다. 기본구조: V + O + to B</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unprecedented</td><td class=\"m\">전례 없는, 유례없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 육체를 가진 개인들이다</span><span class=\"en\"><b>We are embodied individuals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제한된 시간 안에 갇힌</span><span class=\"en\"><b><span class=\"grammar-hl\">trapped within limited time</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 우리는 또한 네트워크화된 데이터 흐름, 기억, 그리고 영향력 행사자들이다</span><span class=\"en\"><b>but we are also <span class=\"grammar-hl\">networked</span> data streams, memories, and influencers,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 더 거대한 인류의 일부이다</span><span class=\"en\"><b>and part of a grander humanity.</b></span></div></div><div class=\"lec-sent-ko\">우리는 제한된 시간 안에 갇힌 육체를 가진 개인이지만, 또 네트워크화된 데이터 흐름이자, 기억이고, 영향력 행사자이며, 더 거대한 인류의 일부이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 인류의 특징을 개인의 차원으로 확장하여 설명합니다. embodied individuals trapped within limited time은 물리적인 육체를 가지고 짧은 수명을 살아가는 인간의 유한성을 뜻합니다. 하지만 글쓴이는 networked data streams, memories, and influencers라는 표현을 통해, 우리가 남긴 기록이나 영향력이 디지털 세상과 사람들의 기억 속에 남아 물리적 죽음 이후에도 인류 전체의 역사로 이어진다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">trapped within limited time (과거분사(형용사)): 과거분사구 trapped가 앞의 명사 individuals를 수식하는 구조이다. (= individuals who are trapped)</div><div class=\"lec-gr-item\">limited (과거분사(형용사)): limited가 뒤의 명사 time을 수식하여 &#39;제한된 시간&#39;이라는 의미를 만든다.</div><div class=\"lec-gr-item\">networked (과거분사(형용사)): networked가 뒤의 명사 data streams를 수식하여 &#39;연결망으로 이어진 데이터 스트림&#39;이라는 의미를 만든다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘 우리의 결정은</span><span class=\"en\"><b>Our decisions today</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">광범위한 영향을 미친다</span><span class=\"en\"><b>have <span class=\"grammar-hl\">far-reaching</span> impacts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게 책임을 지우는</span><span class=\"en\"><b><span class=\"grammar-hl\">that place a responsibility</span> on us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 조상이 되어야 한다는</span><span class=\"en\"><b><span class=\"grammar-hl\">to become good ancestors</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장기적인 관점을 취하고 앞으로 시간 여행을 해야 한다는</span><span class=\"en\"><b><span class=\"grammar-hl\">to take the long view</span> and time travel forward</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수십억 명의 행복을 상상하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to imagine the well-being</span> of billions of people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 현재 만들고 있는 세상에서 삶을 살아가게 될</span><span class=\"en\"><b><span class=\"grammar-hl\">whose lives</span> <span class=\"grammar-hl\">will be lived</span> in the world <span class=\"grammar-hl\">we are currently making</span>.</b></span></div></div><div class=\"lec-sent-ko\">오늘 우리의 결정은, 좋은 조상이 되라는, 즉 장기적인 관점을 취하고 앞으로 시간 여행을 해서 우리가 현재 만들고 있는 이 세계에서 삶을 살아가게 될 수십억 명의 행복을 상상하라는 책임을 우리에게 맡기는 광범위한 영향을 미친다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;영향력&#39;과 &#39;연결성&#39; 때문에 발생하는 도덕적 의무를 도출합니다. become good ancestors는 단순히 자식을 잘 키우는 수준을 넘어, 먼 미래의 후손들에게 살기 좋은 세상을 물려주어야 한다는 뜻입니다. time travel forward는 실제로 시간을 이동하라는 것이 아니라, 우리의 선택이 수백 년 뒤 사람들에게 어떤 결과를 초래할지 미리 깊이 고민하고 예측해 보라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">far-reaching (현재분사(형용사)): far-reaching이 뒤의 명사 impacts를 수식하는 구조이다. (= &#39;광범위한 영향을 미치는 영향&#39;)</div><div class=\"lec-gr-item\">that place a responsibility (관계대명사): 주격 관계대명사 that이 선행사 impacts를 수식하며, 뒤에 주어가 빠진 불완전한 절이 이어진다.</div><div class=\"lec-gr-item\">to become good ancestors (to부정사): 형용사적 용법으로 앞의 명사 responsibility를 수식하여 &#39;~해야 할 책임&#39;이라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">to take the long view (to부정사): 형용사적 용법으로 앞의 명사 responsibility를 수식하는 병렬 구조의 일부이다.</div><div class=\"lec-gr-item\">to imagine the well-being (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~하기 위해서&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">whose lives (관계대명사): 소유격 관계대명사 whose가 선행사 billions of people을 수식하며, 뒤에 명사 lives가 결합된 구조이다.</div><div class=\"lec-gr-item\">will be lived (수동태): be동사(be)+p.p.(lived) 구조. live는 &#39;삶을 살다&#39;라는 의미일 때 타동사(live a life)로 쓰이는데, 목적어가 주어로 나가 수동구조가 되었다. 기본구조: V + O</div><div class=\"lec-gr-item\">we are currently making (관계대명사): 선행사 the world를 수식하는 목적격 관계대명사(that/which)가 생략된 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">far-reaching</td><td class=\"m\">광범위한, 지대한 영향을 미치는</td></tr><tr><td class=\"w\">ancestor</td><td class=\"m\">조상, 선조</td></tr><tr><td class=\"w\">take the long view</td><td class=\"m\">멀리 내다보다, 장기적인 안목을 갖다</td></tr><tr><td class=\"w\">well-being</td><td class=\"m\">안녕, 복지, 행복</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수세기 전</span><span class=\"en\"><b>Centuries ago,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지도자들은</span><span class=\"en\"><b>leaders</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">북미 원주민 이로쿼이족의</span><span class=\"en\"><b>of the native North American Iroquois people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&#39;일곱 세대 관리&#39;를 만들었다</span><span class=\"en\"><b>created “seven generation stewardship,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들에게 가르치면서</span><span class=\"en\"><b><span class=\"grammar-hl\">instructing people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 결정이 그들의 자녀에게 미칠 영향을 고려하라고</span><span class=\"en\"><b><span class=\"grammar-hl\">to consider</span> the impact of every decision on their children,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미래의 일곱 세대까지</span><span class=\"en\"><b>seven generations into the future.</b></span></div></div><div class=\"lec-sent-ko\">수세기 전, 북미 원주민 Iroquois족의 지도자들은 ‘일곱 세대 관리’를 만들었고, 그들의 아이들, 즉, 미래의 일곱 세대에게 미칠 모든 결정의 영향을 고려하라고 부족민에게 가르쳤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 주장한 &#39;장기적 관점의 책임&#39;에 대한 구체적이고 역사적인 사례를 제시합니다. seven generation stewardship은 의사결정을 내릴 때 당장의 이익이 아니라, 내 자녀의 자녀를 지나 무려 7대 후손이 살 세상까지 고려했던 지혜를 보여줍니다. 이는 우리가 가져야 할 책임감의 구체적인 모델로 제시된 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">instructing (분사구문): 현재분사 instructing이 이끄는 분사구문으로, 주절의 동작에 부수적으로 일어나는 상황을 나타낸다. (변환: while they instructed ...)</div><div class=\"lec-gr-item\">instructing people to consider (5형식(SVOC)): 동사 instruct가 목적어(people)와 목적보어(to consider)를 취하는 구조이다.</div><div class=\"lec-gr-item\">to consider (to부정사): instruct의 목적보어로 쓰여 목적어의 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stewardship</td><td class=\"m\">관리, 책임, 보살핌</td></tr><tr><td class=\"w\">instruct</td><td class=\"m\">지시하다, 가르치다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">소중한 몇십 년 동안</span><span class=\"en\"><b>In the precious few decades</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구가 우리 것인</span><span class=\"en\"><b><span class=\"grammar-hl\">that Earth is ours</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 정원을 누리는 동안</span><span class=\"en\"><b>while we enjoy the gardens</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 조상들에 의해 심어진</span><span class=\"en\"><b><span class=\"grammar-hl\">planted by our ancestors</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 그늘을 빼앗아서는 안 된다</span><span class=\"en\"><b>we must not steal the shade</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 후손들로부터</span><span class=\"en\"><b>from our descendants.</b></span></div></div><div class=\"lec-sent-ko\">지구가 우리 것인 소중한 몇십 년 동안, 비록 우리가 조상들에 의해 심어진 정원을 누리더라도, 우리는 후손들로부터 그늘을 빼앗아서는 안 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 내용을 비유적으로 함축하며 결론을 맺습니다. gardens planted by our ancestors는 앞선 세대가 가꾸어 우리에게 물려준 풍요로운 환경과 문명을 의미합니다. steal the shade from our descendants는 현재 세대가 자원을 낭비하거나 환경을 파괴하여, 미래 세대가 누려야 할 권리와 안락함을 빼앗는 행위를 경고하는 표현입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that Earth is ours (관계대명사): 관계대명사 that이 선행사 the precious few decades를 수식한다. (관계부사 when을 대신하여 쓰인 구조이다.)</div><div class=\"lec-gr-item\">planted by our ancestors (과거분사(형용사)): 과거분사구 planted가 앞의 명사 gardens를 수식하는 구조이다. (= gardens that were planted)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ancestor</td><td class=\"m\">조상, 선조</td></tr><tr><td class=\"w\">precious</td><td class=\"m\">귀중한, 값비싼</td></tr><tr><td class=\"w\">descendant</td><td class=\"m\">후손, 자손</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인류는 현재 역사상 가장 강력한 힘을 가졌으며 전 세계가 긴밀히 연결되어 있다.</li><li>개인은 유한한 삶을 살지만, 우리가 남기는 영향력은 인류 전체의 흐름 속에 지속된다.</li><li>따라서 우리는 미래 세대에게 &#39;좋은 조상&#39;이 되어야 할 막중한 책임감을 가져야 한다.</li><li>이로쿼이족의 &#39;7세대 원칙&#39;처럼, 당장의 이익보다 먼 미래 후손의 복지를 우선시하는 태도가 필요하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Current humanity must act as responsible stewards for the future while acknowledging that today’s decisions will shape the lives of generations yet to come.</div>\n              <div class=\"lec-final-sum-ko\">현재의 인류는 오늘날의 결정이 다가올 세대의 삶을 형성한다는 점을 인식하면서 미래를 위한 책임감 있는 관리자로서 행동해야 한다.</div></div></div>"],"segs":[[{"audio":"./21_audio/1.mp3","hl":null}],[{"audio":"./21_audio/2.mp3","hl":null}],[{"audio":"./21_audio/3.mp3","hl":null},{"audio":"./21_audio/4.mp3","hl":"stage-0"},{"audio":"./21_audio/5.mp3","hl":"stage-1"},{"audio":"./21_audio/6.mp3","hl":"stage-2"},{"audio":"./21_audio/7.mp3","hl":"stage-3"},{"audio":"./21_audio/8.mp3","hl":"stage-4"}],[{"audio":"./21_audio/9.mp3","hl":null}],[{"audio":"./21_audio/10.mp3","hl":"main"},{"audio":"./21_audio/11.mp3","hl":"meaning"},{"audio":"./21_audio/12.mp3","hl":"grammar"}],[{"audio":"./21_audio/13.mp3","hl":"main"},{"audio":"./21_audio/14.mp3","hl":"meaning"},{"audio":"./21_audio/15.mp3","hl":"grammar"}],[{"audio":"./21_audio/16.mp3","hl":"main"},{"audio":"./21_audio/17.mp3","hl":"meaning"},{"audio":"./21_audio/18.mp3","hl":"grammar"}],[{"audio":"./21_audio/19.mp3","hl":"main"},{"audio":"./21_audio/20.mp3","hl":"meaning"},{"audio":"./21_audio/21.mp3","hl":"grammar"}],[{"audio":"./21_audio/22.mp3","hl":"main"},{"audio":"./21_audio/23.mp3","hl":"meaning"},{"audio":"./21_audio/24.mp3","hl":"grammar"}],[{"audio":"./21_audio/25.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-
