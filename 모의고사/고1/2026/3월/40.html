lass=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01전문가의 권고</div><ul><li>양육 전문가들은 아이들이 독립성과 회복탄력성을 배워야 한다고 강조한다.</li><li>핵심 역량: 독립성(independence) 및 회복탄력성(resilience)</li><li>아이들이 스스로 행동하며 성장할 필요성 제기</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02현실적 장애물</div><ul><li>현재의 도시 환경과 사회적 분위기는 아이들의 독립적 활동을 가로막는다.</li><li>안전한 보행로 및 자전거 경로(safe walk and bike routes)의 부재</li><li>십 대들을 거부하는 상업 시설과 빽빽한 활동 일정(spreadsheet of activities)</li><li>아이들의 자유 시간(free time) 상실</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03부모의 부담 가중</div><ul><li>아이들이 스스로 이동하거나 활동할 수 없게 되면서 부모의 희생이 강요된다.</li><li>아이들을 대신 챙기기 위한 부모의 시간(time)과 비용(money) 소모</li><li>환경적 한계로 인해 스스로 할 수 없는(can’t do it on their own) 아이들</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04구조적 변화의 필요성</div><ul><li>아이들을 덜 돌보는 육아가 가능해지려면 근본적인 구조 변화가 뒷받침되어야 한다.</li><li>해결책: 구조적 변화(structural change)의 필요성</li><li>단순한 경제적 정책을 넘어선 물리적 구조(physical structures)와 문화적 변화(cultural change) 요구</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05지향점</div><ul><li>아이들이 공공장소에서 안전하고 자유롭게 활동할 수 있는 환경을 조성해야 한다.</li><li>공공장소(public spaces) 내 아동에 대한 사회적 관용(tolerance) 회복</li><li>가벼운 감독(lightly supervised) 하에 자유롭게 이동할 수 있는 안전한 환경 구축</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr><tr><td class=\"w\">resilience</td><td class=\"m\">회복력, 탄성</td></tr><tr><td class=\"w\">kick out</td><td class=\"m\">~을 쫓아내다, ~을 해고하다</td></tr><tr><td class=\"w\">must</td><td class=\"m\">필수적인 것, 꼭 해야 하는 것</td></tr><tr><td class=\"w\">on one&#39;s own</td><td class=\"m\">스스로, 혼자 힘으로</td></tr><tr><td class=\"w\">clinical</td><td class=\"m\">임상의, 냉철한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">structural</td><td class=\"m\">구조적인, 조직상의</td></tr><tr><td class=\"w\">family leave</td><td class=\"m\">육아 휴직, 가족 돌봄 휴가</td></tr><tr><td class=\"w\">populate</td><td class=\"m\">거주하다, 살다, ~에 사람들로 채우다</td></tr><tr><td class=\"w\">build back</td><td class=\"m\">다시 세우다, 복구하다</td></tr><tr><td class=\"w\">tolerance</td><td class=\"m\">관용, 인내, 포용력</td></tr><tr><td class=\"w\">supervise</td><td class=\"m\">감독하다, 관리하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">육아 전문가들은 말한다</span><span class=\"en\"><b><span class=\"grammar-hl\">Parenting</span> experts say</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자녀가 배워야 한다고</span><span class=\"en\"><b>children need <span class=\"grammar-hl\">to learn</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독립심과 회복 탄력성을.</span><span class=\"en\"><b>independence and resilience.</b></span></div></div><div class=\"lec-sent-ko\">육아 전문가들은 자녀가 독립심과 회복 탄력성을 배워야 한다고 말한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 사회적으로 통용되는 양육의 이상적인 목표를 제시합니다. independence and resilience는 아이가 부모에게 의존하지 않고 스스로 문제를 해결하며, 어려운 상황을 스스로 이겨내는 능력을 갖추어야 한다는 보편적인 기대를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Parenting 동명사(명사적 개념): ‘육아/양육’이라는 행위나 활동을 나타내는 명사적 개념으로 뒤의 명사 experts를 수식하는 구조임.</div><div class=\"lec-gr-item\">to learn to부정사(명사적 용법): 타동사 need의 목적어 역할을 하며, &#39;~하는 것&#39;으로 해석되는 명사구 구조임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">independence</td><td class=\"m\">독립, 자립</td></tr><tr><td class=\"w\">resilience</td><td class=\"m\">회복력, 탄성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 도시와 교외 지역은</span><span class=\"en\"><b>But cities and suburbs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">제공하지 않는다</span><span class=\"en\"><b>don’t offer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안전한 도보 및 자전거 통학로를,</span><span class=\"en\"><b>safe walk and bike routes to school,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쇼핑몰은 십 대들을 쫓아낸다</span><span class=\"en\"><b>malls <span class=\"grammar-hl\">kick teenagers out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주말에,</span><span class=\"en\"><b>on the weekends,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 자유 시간은 사라진다</span><span class=\"en\"><b>and free time disappears</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">활동의 스프레드시트 하에.</span><span class=\"en\"><b>under a spreadsheet of activities.</b></span></div></div><div class=\"lec-sent-ko\">그러나 도시와 교외 지역은 안전한 도보 및 자전거 통학로를 제공하지 않고, 쇼핑몰은 주말에 십 대들을 쫓아내며, 자유 시간은 활동의 스프레드시트 하에 사라진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 &#39;독립심&#39;이라는 교육 목표가 현실에서 실현되기 어려운 구체적인 장애물들을 나열합니다. under a spreadsheet of activities는 아이들이 스스로 무엇을 할지 결정하는 대신, 부모가 엑셀 파일처럼 빽빽하게 짜놓은 학원이나 과외 일정에 맞춰 기계적으로 움직이는 현실을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">kick teenagers out (관용표현(구동사)): &#39;A를 쫓아내다&#39;라는 의미의 kick A out 구조이며, 명사 목적어(teenagers)가 동사와 부사 사이에 위치함.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 ‘필수 사항’ 전부가</span><span class=\"en\"><b>All of those “musts”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부모의 시간이나 돈이 더 많이 들게 한다</span><span class=\"en\"><b>take more of the parents’ time or money</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이끄는 데,</span><span class=\"en\"><b><span class=\"grammar-hl\">to navigate</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 자녀가 그것을 할 수 없기 때문이다</span><span class=\"en\"><b>because the child can’t do it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혼자 힘으로.</span><span class=\"en\"><b><span class=\"grammar-hl\">on their own</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 ‘필수 사항’ 전부가 (자녀를) 이끄는 데 부모의 시간이나 돈이 더 많이 들게 하는데, 왜냐하면 자녀가 혼자 힘으로 그것을 할 수 없기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문장의 환경적 제약 때문에 발생하는 부작용을 설명합니다. All of those “musts”는 안전하지 않은 길 때문에 부모가 차로 직접 태워다주어야 하거나, 갈 곳 없는 아이를 위해 비싼 유료 프로그램을 결제해줘야 하는 상황들을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to navigate to부정사(형용사적 용법): 앞의 명사구(parents’ time or money)를 수식하여 &#39;처리하기 위한/헤쳐나가기 위한&#39;의 의미를 나타내는 구조임.</div><div class=\"lec-gr-item\">on their own (관용표현): &#39;그들 스스로/독자적으로&#39;라는 의미로, on one&#39;s own(소유격) 형태를 취하는 이디엄임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">must</td><td class=\"m\">필수적인 것, 꼭 해야 하는 것</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">임상 심리학자인 Darby Saxbe가</span><span class=\"en\"><b>As Darby Saxbe, <span class=\"grammar-hl\">a clinical psychologist</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최근에 썼듯이</span><span class=\"en\"><b>recently wrote</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">New York Times에,</span><span class=\"en\"><b>in the New York Times,</b></span></div></div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전문가의 견해를 인용하여, 아이를 독립적으로 키우지 못하는 것이 부모 개인의 잘못이 아니라 사회 시스템의 문제임을 짚어줍니다. underparenting requires structural change는 부모가 아이를 덜 챙기며 스스로 크게 두고 싶어도, 도시 설계나 사회 제도가 바뀌지 않으면 불가능하다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a clinical psychologist (동격): 앞에 나온 명사 Darby Saxbe와 쉼표(,)로 연결되어 동일 인물임을 나타내며, 주어의 직업이나 신분을 구체적으로 설명하는 구조임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">clinical</td><td class=\"m\">임상의, 냉철한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“언더페어런팅은</span><span class=\"en\"><b>“underparenting</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구조적 변화를 필요로 한다.”</span><span class=\"en\"><b><span class=\"grammar-hl\">requires structural change</span>.”</b></span></div></div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기존의 복지 논의와 이 글이 주장하는 해결책의 차이점을 분명히 합니다. economic policies는 육아 휴직이나 보육비 보조처럼 부모에게 돈이나 시간을 쥐어주는 전통적인 방식의 해결책을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">requires structural change 3형식(SVO) 구조: 타동사 requires가 목적어 structural change를 취하고 있으며, 주어 underparenting에 맞춰 3인칭 단수형 동사가 쓰임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">structural</td><td class=\"m\">구조적인, 조직상의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대부분의 정치 전문가와 달리,</span><span class=\"en\"><b>Unlike most political experts,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 단지 ~에 대해 말하고 있는 것이 아니다</span><span class=\"en\"><b><span class=\"grammar-hl\">she’s not just talking</span> about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경제 정책들에 대해</span><span class=\"en\"><b>economic policies</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족 휴가나 정부 지원 보육과 같은.</span><span class=\"en\"><b>like family leave and <span class=\"grammar-hl\">government­supported</span> childcare.</b></span></div></div><div class=\"lec-sent-ko\">대부분의 정치 전문가와 달리, 그녀는 가족 (돌봄) 휴가나 정부 지원 보육과 같은 경제 정책만을 말하고 있는 것이 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 기존의 복지 논의와 이 글이 주장하는 해결책의 차이점을 분명히 합니다. economic policies는 육아 휴직이나 보육비 보조처럼 부모에게 돈이나 시간을 쥐어주는 전통적인 방식의 해결책을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">she’s not just talking (현재진행): be동사(is) + 현재분사(-ing) 형태가 결합하여 현재 진행 중인 동작이나 상태를 부정문 구조(not)와 함께 나타냄.</div><div class=\"lec-gr-item\">government­supported (과거분사(형용사)): supported가 뒤의 명사 childcare를 수식하며, p.p. + N 구조로 &#39;정부의 지원을 받는 보육&#39;이라는 의미를 형성함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">family leave</td><td class=\"m\">육아 휴직, 가족 돌봄 휴가</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그녀는 ~에 대해 말하고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">She’s talking</span> about</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제적인 물리적 구조와,</span><span class=\"en\"><b>actual physical structures,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 문화적 변화에 대해</span><span class=\"en\"><b>and the cultural change</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에 사는 데 요구되는.</span><span class=\"en\"><b><span class=\"grammar-hl\">required</span> <span class=\"grammar-hl\">to populate</span> them.</b></span></div></div><div class=\"lec-sent-ko\">그녀는 실제적인 물리적 구조와, 그곳에 사는 데 요구되는 문화적 변화에 대해 말하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장을 보완하며 저자가 생각하는 진정한 해결책을 제시합니다. actual physical structures는 아이들이 안전하게 걸어 다닐 수 있는 거리나 공원 같은 도시의 외형적 변화를 의미하며, populate them은 그런 장소에 아이들이 북적거려도 시민들이 이를 자연스럽고 긍정적으로 받아들이는 사회 분위기가 형성되어야 함을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">She’s talking (현재진행): be동사(is) + 현재분사(-ing) 형태로 문장의 서술어 역할을 하며 진행의 의미를 나타냄.</div><div class=\"lec-gr-item\">required (과거분사(형용사)): required가 앞의 명사 the cultural change를 수식하며, N + p.p. 구조로 &#39;요구되는 문화적 변화&#39;를 뜻함.</div><div class=\"lec-gr-item\">to populate to부정사(형용사적 용법): 앞의 명사 change를 수식하거나 보충하여 &#39;사람들이 거주하게(살게) 하기 위한&#39;이라는 의미를 더함.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">populate</td><td class=\"m\">거주하다, 살다, ~에 사람들로 채우다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 필요가 있다</span><span class=\"en\"><b>We need</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“우리의 관용을 다시 구축할</span><span class=\"en\"><b><span class=\"grammar-hl\">to “build back</span> our tolerance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자녀에 대한</span><span class=\"en\"><b>for children</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공공장소에서,”</span><span class=\"en\"><b>in public spaces,”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그녀는 쓰고 있다,</span><span class=\"en\"><b>she writes,</b></span></div></div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 결론으로, 아이들의 독립성을 위해 우리 사회가 지향해야 할 구체적인 모습을 제안합니다. lightly supervised는 부모가 24시간 밀착 감시하지 않아도 사회 안전망과 시민들의 시선 덕분에 아이들이 안전하게 자기 일을 볼 수 있는 상태를 말합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to “build back to부정사(명사적 용법): 타동사 need의 목적어 역할을 하며, ‘다시 쌓는 것/회복하는 것’이라는 행위를 의미함.</div><div class=\"lec-gr-item\">build back (관용표현(구동사)): &#39;다시 쌓다/복구하다&#39;라는 의미의 build back 구조임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">build back</td><td class=\"m\">다시 세우다, 복구하다</td></tr><tr><td class=\"w\">tolerance</td><td class=\"m\">관용, 인내, 포용력</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">“그리고 안전한 환경을 조성할</span><span class=\"en\"><b>“and create safe environments</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감독을 가볍게 받는 아이들이</span><span class=\"en\"><b><span class=\"grammar-hl\">where</span> <span class=\"grammar-hl\">lightly supervised</span> kids</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자유롭게 돌아다닐 수 있는.”</span><span class=\"en\"><b>can <span class=\"grammar-hl\">move around</span> freely.”</b></span></div></div></div>\n        \n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where (관계부사): 선행사 safe environments를 수식하는 절을 이끌며, 뒤에는 주어(lightly supervised kids)와 동사(can move around)가 갖춰진 완전한 절이 온다.</div><div class=\"lec-gr-item\">lightly supervised (과거분사(형용사)): supervised가 뒤의 명사 kids를 수식하며, p.p. + N 구조로 &#39;가볍게 감독받는 아이들&#39;이라는 의미를 형성함.</div><div class=\"lec-gr-item\">move around (관용표현(구동사)): &#39;돌아다니다/주위를 움직이다&#39;라는 의미의 move around 구조임.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">supervise</td><td class=\"m\">감독하다, 관리하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>전문가는 아이의 독립심을 강조하지만, 현재의 도시 환경(위험한 길, 갈 곳 없는 공공장소)은 이를 가로막고 있다.</li><li>결국 부모는 아이를 보호하기 위해 더 많은 시간과 비용을 써야 하는 악순환에 빠진다.</li><li>이 문제는 단순히 육아 휴직 같은 경제적 정책으로 해결되지 않으며, 도시의 물리적 구조 자체가 바뀌어야 한다.</li><li>아이들이 공공장소에서 자유롭고 안전하게 돌아다닐 수 있도록 사회적 관용과 안전한 환경을 복원해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Fostering children&#39;s independence requires creating safe physical environments and building social tolerance for unsupervised children in public spaces.</div>\n              <div class=\"lec-final-sum-ko\">아이들의 독립성을 기르기 위해서는 안전한 물리적 환경을 조성하는 동시에 공공장소 내의 아이들에 대한 사회적 관용을 구축해야 한다.</div></div></div>"],"segs":[[{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/1.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/2.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/3.mp3","hl":null},{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/4.mp3","hl":"stage-0"},{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/5.mp3","hl":"stage-1"},{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/6.mp3","hl":"stage-2"},{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/7.mp3","hl":"stage-3"},{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/8.mp3","hl":"stage-4"}],[{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/9.mp3","hl":null}],[{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/10.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/11.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/12.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/13.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/14.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/15.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/16.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/17.mp3","hl":"meaning"},{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/18.mp3","hl":"grammar"}],[{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/19.mp3","hl":"main"},{"audio":"./모의고사_고1_2026년_03월_40번_강의_audio/20.mp3","hl":"mean
