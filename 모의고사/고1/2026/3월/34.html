내집단 구성원의 행동도 그대로 복제함</li><li>핵심 키워드: 내집단(ingroup), 모방(copy)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02실험을 통한 검증</div><ul><li>퍼즐 상자를 여는 실험을 통해 집단 간 모방 행동을 관찰했다.</li><li>손목 밴드 색상으로 내집단과 외집단(outgroup)을 간단히 구분함</li><li>아동들을 대상으로 퍼즐 상자(puzzle box) 여는 법을 관찰하게 함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03호감도와 집단 소속감의 충돌</div><ul><li>아동들은 집단 소속보다 개인의 사회적 행동 유형에 따라 호감을 느꼈다.</li><li>반사회적(antisocial) 내집단 구성원보다 친사회적 외집단 구성원을 더 좋아함</li><li>내집단원이라도 행동이 바르지 않으면 싫어하는(dislike) 경향을 보임</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04선호도를 압도하는 집단 모방</div><ul><li>개인적 호감도와 관계없이 내집단의 행동을 외집단보다 더 밀접하게 따라 한다.</li><li>싫어하는 마음이 내집단 행동을 모방하는 경향을 막지 못함</li><li>외집단 행동보다 내집단의 행동을 더 똑같이 모방함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05모방의 궁극적 목적</div><ul><li>모방은 단순히 효율적인 방법을 찾는 것이 아니라 집단의 관습을 따르기 위한 행동이다.</li><li>과잉 모방(overimitation)은 효율성보다 &#39;적절한 방식&#39;을 배우려는 과정임</li><li>내집단의 규칙(rules)과 관습(conventions)에 순응(conforming)하려는 목적임</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emphasis</td><td class=\"m\">강조, 역점</td></tr><tr><td class=\"w\">take account of</td><td class=\"m\">~을 고려하다, ~을 참작하다</td></tr><tr><td class=\"w\">ingroup</td><td class=\"m\">내집단</td></tr><tr><td class=\"w\">distinguish</td><td class=\"m\">구별하다, 분별하다</td></tr><tr><td class=\"w\">outgroup</td><td class=\"m\">외집단</td></tr><tr><td class=\"w\">minimal</td><td class=\"m\">최소의, 아주 적은</td></tr><tr><td class=\"w\">antisocial</td><td class=\"m\">반사회적인</td></tr><tr><td class=\"w\">fashion</td><td class=\"m\">방식, 태도</td></tr><tr><td class=\"w\">prosocial</td><td class=\"m\">친사회적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tendency</td><td class=\"m\">경향, 성향</td></tr><tr><td class=\"w\">overimitation</td><td class=\"m\">과잉 모방</td></tr><tr><td class=\"w\">reveal</td><td class=\"m\">드러내다, 밝히다</td></tr><tr><td class=\"w\">efficiently</td><td class=\"m\">효율적으로</td></tr><tr><td class=\"w\">in other words</td><td class=\"m\">다시 말해서, 즉</td></tr><tr><td class=\"w\">conform to</td><td class=\"m\">~에 따르다, ~에 순응하다</td></tr><tr><td class=\"w\">convention</td><td class=\"m\">관습, 관례</td></tr><tr><td class=\"w\">appropriately</td><td class=\"m\">적절하게, 알맞게</td></tr><tr><td class=\"w\">demonstrate</td><td class=\"m\">보여주다, 입증하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">강조는</span><span class=\"en\"><b>The emphasis</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내집단으로부터 배우는 것에 대한</span><span class=\"en\"><b>on <span class=\"grammar-hl\">learning</span> from the ingroup</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개인을 거의 고려하지 않는다.</span><span class=\"en\"><b><span class=\"grammar-hl\">takes little account of</span> individuals.</b></span></div></div><div class=\"lec-sent-ko\">내집단으로부터 배우는 것에 대한 강조는 개인을 거의 고려하지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부입니다. 우리가 속한 집단의 방식을 배우려 할 때, 그 가르침을 주는 사람이 개인적으로 어떤 성품을 가졌는지는 중요하게 여기지 않는다는 점을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">learning (동명사): 전치사 on의 목적어 역할을 하는 명사적 성격의 -ing 형태이다.</div><div class=\"lec-gr-item\">takes little account of (관용표현): &#39;~을 거의 고려하지 않다&#39;라는 의미의 숙어 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emphasis</td><td class=\"m\">강조, 역점</td></tr><tr><td class=\"w\">ingroup</td><td class=\"m\">내집단</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">놀랍게도,</span><span class=\"en\"><b>Amazingly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 우리 내집단에 속한 일부 사람들을 싫어할 수도 있지만,</span><span class=\"en\"><b><span class=\"grammar-hl\">while we may dislike</span> some of the people in our ingroup,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 여전히 그들을 모방한다.</span><span class=\"en\"><b>we still copy them.</b></span></div></div><div class=\"lec-sent-ko\">놀랍게도, 우리는 우리 내집단에 속한 일부 사람들을 싫어할 수도 있지만, 여전히 그들을 모방한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 내용을 구체화하며 반전의 요소를 제시합니다. dislike some of the people은 특정 인물에 대해 부정적인 감정이 생기더라도, 같은 집단이라는 이유만으로 그들의 행동을 따라 하려는 본능이 더 강력하게 작용한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">while we may dislike 부사절 접속사: while이 &#39;비록 ~이지만&#39;이라는 양보의 의미로 쓰여 절을 이끌고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ingroup</td><td class=\"m\">내집단</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Wilks, Kirby, 그리고 Nielsen은</span><span class=\"en\"><b>Wilks, Kirby, and Nielsen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모방 행동을 연구했다</span><span class=\"en\"><b>studied <span class=\"grammar-hl\">copying behavior</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맥락에서</span><span class=\"en\"><b>in the context</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">퍼즐 상자를 여는 방법을 관찰하는.</span><span class=\"en\"><b>of <span class=\"grammar-hl\">observing</span> <span class=\"grammar-hl\">how to open</span> a puzzle box.</b></span></div></div><div class=\"lec-sent-ko\">Wilks, Kirby, 그리고 Nielsen은 퍼즐 상자를 여는 방법을 관찰하는 맥락에서 모방 행동을 연구했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 인간의 독특한 모방 심리를 과학적으로 증명하기 위해 구체적인 실험 사례를 도입합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">copying behavior (동명사): copying이 behavior(행동)의 구체적인 종류나 성격을 나타내는 명사적 개념으로 쓰였다.</div><div class=\"lec-gr-item\">observing (동명사): 전치사 of의 목적어로 쓰여 &#39;~하는 것&#39;이라는 명사적 역할을 한다.</div><div class=\"lec-gr-item\">how to open (to부정사): 의문사 + to부정사 구조로, 명사구 역할을 하여 동사 observing의 목적어로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">내집단과 외집단은</span><span class=\"en\"><b>Ingroups and outgroups</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식별되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">were distinguished</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최소한의 방식으로,</span><span class=\"en\"><b>in a minimal way,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">손목 밴드의 단순한 색상 구분을 사용하여.</span><span class=\"en\"><b><span class=\"grammar-hl\">using simple color coding</span> of wristbands.</b></span></div></div><div class=\"lec-sent-ko\">내집단과 외집단은 손목 밴드의 단순한 색상 구분을 사용하는 최소한의 방식으로 식별되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험의 환경 설정을 설명합니다. distinguished in a minimal way는 거창한 유대 관계가 없더라도 단지 손목 밴드 색깔 같은 사소한 공통점만으로도 인간은 즉각적인 소속감을 느낀다는 배경 지식을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were distinguished (수동태): be동사(were) + p.p.(distinguished) 구조. distinguish는 타동사인데 뒤에 목적어가 없어서 수동구조 were distinguished 형태로 쓴다. 기본구조: V + O (distinguish A from B / distinguish A)</div><div class=\"lec-gr-item\">using simple color coding (분사구문): -ing 형태가 부사적 기능을 수행하며 동작의 동시성이나 수단을 나타낸다. 원래 절로 변환하면 while/as they used simple color coding...으로 쓸 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ingroup</td><td class=\"m\">내집단</td></tr><tr><td class=\"w\">distinguish</td><td class=\"m\">구별하다, 분별하다</td></tr><tr><td class=\"w\">outgroup</td><td class=\"m\">외집단</td></tr><tr><td class=\"w\">minimal</td><td class=\"m\">최소의, 아주 적은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아이들은</span><span class=\"en\"><b>The children</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자기 내집단의 모든 구성원을 단순히 좋아하지는 않았다;</span><span class=\"en\"><b>did not simply like all members of their ingroup;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 사람들을 싫어했다</span><span class=\"en\"><b>they disliked those</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행동한</span><span class=\"en\"><b><span class=\"grammar-hl\">who behaved</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반사회적인 방식으로.</span><span class=\"en\"><b><span class=\"grammar-hl\">in an antisocial fashion</span>.</b></span></div></div><div class=\"lec-sent-ko\">아이들은 자기 내집단의 모든 구성원을 단순히 좋아하지는 않았는데, 반사회적인 방식으로 행동한 이들을 싫어했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험 과정에서 아이들의 심리 상태를 확인합니다. behaved in an antisocial fashion은 무례하거나 나쁜 행동을 하는 사람을 가리키는데, 아이들은 같은 팀일지라도 이런 사람에게는 분명히 도덕적 거부감을 느꼈음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who behaved in an antisocial fashion (관계대명사): 주격 관계대명사 who가 선행사 those(사람들)를 수식하는 형용사절을 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ingroup</td><td class=\"m\">내집단</td></tr><tr><td class=\"w\">antisocial</td><td class=\"m\">반사회적인</td></tr><tr><td class=\"w\">fashion</td><td class=\"m\">방식, 태도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">실제로,</span><span class=\"en\"><b>Indeed,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 이러한 반사회적인 내집단 구성원을 좋아했다</span><span class=\"en\"><b>they liked these antisocial ingroup members</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">외집단의 친사회적인 구성원보다 덜.</span><span class=\"en\"><b><span class=\"grammar-hl\">less than</span> the prosocial members of an outgroup.</b></span></div></div><div class=\"lec-sent-ko\">실제로 그들은 이러한 반사회적인 내집단 구성원을, 외집단의 친사회적인 구성원보다 덜 좋아했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 내용을 더 극적으로 비교합니다. liked... less than the prosocial members of an outgroup은 성격 나쁜 &#39;우리 편&#39;보다 성격 좋은 &#39;남&#39;을 더 선호할 정도로 아이들이 개인의 성품을 정확히 판단하고 있었다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">less than (비교급): &#39;~보다 덜한&#39;이라는 의미로 두 대상을 비교하고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ingroup</td><td class=\"m\">내집단</td></tr><tr><td class=\"w\">outgroup</td><td class=\"m\">외집단</td></tr><tr><td class=\"w\">antisocial</td><td class=\"m\">반사회적인</td></tr><tr><td class=\"w\">prosocial</td><td class=\"m\">친사회적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그럼에도 불구하고,</span><span class=\"en\"><b>Still,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 반감은</span><span class=\"en\"><b>their dislike</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 경향에 영향을 미치지 않았다</span><span class=\"en\"><b>did not affect their tendency</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내집단의 행동을 모방하려는</span><span class=\"en\"><b><span class=\"grammar-hl\">to copy ingroup behavior</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">외집단의 행동보다 더 면밀하게.</span><span class=\"en\"><b>more closely than outgroup behavior.</b></span></div></div><div class=\"lec-sent-ko\">그럼에도 불구하고, 그러한 반감은 외집단의 행동보다 내집단의 행동을 더 면밀히 모방하려는 그들의 경향에 영향을 미치지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심적인 발견입니다. did not affect their tendency to copy는 개인적으로는 그 사람이 싫을지라도, &#39;어떻게 행동해야 하는가&#39;라는 정보를 얻을 때는 여전히 자기 집단 사람의 방식을 우선시한다는 인간의 사회적 학습 본능을 드러냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to copy ingroup behavior (to부정사): 형용사적 용법으로 쓰여 앞의 명사 tendency(경향)를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ingroup</td><td class=\"m\">내집단</td></tr><tr><td class=\"w\">outgroup</td><td class=\"m\">외집단</td></tr><tr><td class=\"w\">tendency</td><td class=\"m\">경향, 성향</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 과잉 모방은 드러낸다</span><span class=\"en\"><b>This overimitation reveals</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 모방하고 있는 것이 아님을</span><span class=\"en\"><b>that we are not copying</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배우기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">in order to learn</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상자를 가장 효율적으로 여는 방법을.</span><span class=\"en\"><b><span class=\"grammar-hl\">how to open</span> a box most efficiently.</b></span></div></div><div class=\"lec-sent-ko\">이 과잉 모방은 우리가 상자를 가장 효율적으로 여는 방법을 배우기 위해 모방하고 있는 것이 아님을 드러낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험 결과를 해석합니다. not... most efficiently는 모방의 주된 목적이 단순히 문제를 빨리 해결하거나 실용적인 기술을 익히는 데 있는 것이 아니라는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in order to learn (to부정사): 부사적 용법 중 목적(~하기 위해서)을 나타내는 관용적 표현이다.</div><div class=\"lec-gr-item\">how to open (to부정사): 의문사 + to부정사 구조로, 동사 learn의 목적어 역할을 하는 명사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">overimitation</td><td class=\"m\">과잉 모방</td></tr><tr><td class=\"w\">reveal</td><td class=\"m\">드러내다, 밝히다</td></tr><tr><td class=\"w\">efficiently</td><td class=\"m\">효율적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 배우고자 한다</span><span class=\"en\"><b>We want to learn</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 하는 법을</span><span class=\"en\"><b><span class=\"grammar-hl\">how to do</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">타당한 방식으로 —</span><span class=\"en\"><b>in the proper way —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다시 말해,</span><span class=\"en\"><b>in other words,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">내집단의 규칙과 관습에 따르는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">conforming to the rules</span> and conventions of the ingroup.</b></span></div></div><div class=\"lec-sent-ko\">우리는 그것을 타당한 방식으로 하는 법을 배우고자 하는데, 다시 말해 내집단의 규칙과 관습에 따르는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 모방의 진짜 이유를 밝힙니다. conforming to the rules and conventions는 특정 행동을 똑같이 따라 하는 행위가 그 집단의 일원으로서 인정받고 그들의 문화를 공유하기 위한 일종의 &#39;사회적 의식&#39;이라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how to do (to부정사): 의문사 + to부정사 구조로, 동사 learn의 목적어 역할을 하는 명사구이다.</div><div class=\"lec-gr-item\">conforming to the rules (분사구문): -ing 형태가 부사적 기능을 수행하여 앞 문장의 내용을 구체적으로 부연 설명한다. 원래 절로 변환하면 which means we conform to... 또는 and we conform to... 정도로 이해할 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ingroup</td><td class=\"m\">내집단</td></tr><tr><td class=\"w\">in other words</td><td class=\"m\">다시 말해서, 즉</td></tr><tr><td class=\"w\">convention</td><td class=\"m\">관습, 관례</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이는 적절하게 입증될 것이다</span><span class=\"en\"><b>This will <span class=\"grammar-hl\">be appropriately demonstrated</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반사회적인 내집단 구성원에 의해서도.</span><span class=\"en\"><b>even by antisocial ingroup members.</b></span></div></div><div class=\"lec-sent-ko\">이는 반사회적인 내집단 구성원에 의해서도 적절하게 입증될 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론을 맺습니다. appropriately demonstrated는 아무리 인간성이 나쁜 사람이라 할지라도, 그가 우리 집단에 속해 있다면 그가 보여주는 방식이 우리 집단의 &#39;표준&#39;이자 &#39;옳은 방식&#39;이라고 믿고 따라 하게 된다는 점을 요약합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">be appropriately demonstrated (수동태): be동사(be) + p.p.(demonstrated) 구조. demonstrate는 타동사인데 뒤에 목적어가 없어서 수동구조 be demonstrated 형태로 쓴다. 기본구조: V + O (demonstrate something)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ingroup</td><td class=\"m\">내집단</td></tr><tr><td class=\"w\">antisocial</td><td class=\"m\">반사회적인</td></tr><tr><td class=\"w\">appropriately</td><td class=\"m\">적절하게, 알맞게</td></tr><tr><td class=\"w\">demonstrate</td><td class=\"m\">보여주다, 입증하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간은 내집단 구성원의 행동을 배울 때, 그 개인에 대한 호감도보다는 집단 소속감을 우선시한다.</li><li>실험 결과, 아이들은 내집단의 무례한 사람보다 외집단의 친절한 사람을 더 좋아했다.</li><li>하지만 실제 행동을 따라 할 때는 개인적 선호와 상관없이 자신이 속한 집단 사람의 방식을 더 정확히 모방했다.</li><li>이는 모방의 목적이 효율적인 기술 습득이 아니라, 집단의 규칙과 관습에 순응하여 소속을 확인하는 데 있기 때문이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Individuals prioritize copying ingroup behaviors to conform to social conventions while disregarding their personal dislike for certain group members.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 특정 구성원에 대한 개인적인 반감에도 불구하고 사회적 관습에 따르기 위해 내집단의 행동을 우선적으로 모방한다.</div></div></div>"],"segs":[[{"audio":"./34_audio/1.mp3","hl":null}],[{"audio":"./34_audio/2.mp3","hl":null}],[{"audio":"./34_audio/3.mp3","hl":null},{"audio":"./34_audio/4.mp3","hl":"stage-0"},{"audio":"./34_audio/5.mp3","hl":"stage-1"},{"audio":"./34_audio/6.mp3","hl":"stage-2"},{"audio":"./34_audio/7.mp3","hl":"stage-3"},{"audio":"./34_audio/8.mp3","hl":"stage-4"}],[{"audio":"./34_audio/9.mp3","hl":null}],[{"audio":"./34_audio/10.mp3","hl":"main"},{"audio":"./34_audio/11.mp3","hl":"meaning"},{"audio":"./34_audio/12.mp3","hl":"grammar"}],[{"audio":"./34_audio/13.mp3","hl":"main"},{"audio":"./34_audio/14.mp3","hl":"meaning"},{"audio":"./34_audio/15.mp3","hl":"grammar"}],[{"audio":"./34_audio/16.mp3","hl":"main"},{"audio":"./34_audio/17.mp3","hl":"meaning"},{"audio":"./34_audio/18.mp3","hl":"grammar"}],[{"audio":"./34_audio/19.mp3","hl":"main"},{"audio":"./34_audio/20.mp3","hl":"meaning"},{"audio":"./34_audio/21.mp3","hl":"grammar"}],[{"audio":"./34_audio/22.mp3","hl":"main"},{"audio":"./34_audio/23.mp3","hl":"me
