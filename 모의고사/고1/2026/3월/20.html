eOn+T7AZW5BH5j298f/AK6XKkHDD07Eenr26Y/Cs+WXb1/q7/Bsff8APt/T0/yuAzgZ9Bn60v0pu4eo/Mfz6A9ue/HNP+6cZUnAIG4E/N079e4Off6tRd1fRdNk7pq36tdb21tYX6br9GIRznvjjkjr/j9KT/H3HX+vPQ5/Po7g9x+BBP1xn6D29KTAJKnHqRnHfPXpnPb9KfJrdPo7O/8AhtsvXVfqHa//AA3e3ffy3E/oOeRj69c/zHXqcYRzlXx1APTtkduR/Ol3D1HtyPfj9PSjHU+xGe3AJ5HTOB1OB6YyaSVrbWun12uutrW16O1ra7B/S9T/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Building a Bond: Why Personal Stories Are Key to Persuasion<small>유대감 형성: 개인적인 이야기가 설득의 열쇠인 이유</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">사람의 마음을 움직이는 설득의 과정에서는 논리적인 증거만큼이나 화자와 청자 사이의 심리적 유대감인 라포(Rapport) 형성이 매우 중요한데요, 심리학에서는 이를 위해 자신의 개인적인 정보나 감정을 의도적으로 드러내는 자기 공개(Self-Disclosure) 기법을 핵심 전략으로 꼽습니다. 사회심리학의 취약성(Vulnerability) 이론에 따르면, 화자가 완벽한 모습만 보이기보다 자신의 결점이나 인간적인 면모를 솔직하게 공유할 때 청중은 오히려 더 큰 신뢰(Trust)를 느끼고 정서적으로 연결되는 경험을 하게 됩니다. 마치 딱딱한 공식 설명보다 선생님의 첫사랑 이야기 같은 개인적 일화(Anecdote)에 우리 모두가 더 집중하게 되는 것처럼, 이러한 감성적 접근은 설득의 3요소 중 하나인 파토스(Pathos)를 자극하여 논리적 주장이 전달될 수 있는 심리적 토대를 마련해 줍니다. 결국 청중은 차가운 논리 그 자체와 소통하는 것이 아니라, 그 논리를 말하는 화자의 인격(Ethos)과 먼저 교감할 때 비로소 마음의 문을 열게 된다는 점을 기억하시면 좋습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입</div><ul><li>청중에게 즉각적이고 강력한 영향력을 미치기 위해 가장 좋은 방법은 개인적인 이야기로 시작하는 것이다.</li><li>개인적인 이야기(personal story)나 일화(anecdote)의 활용</li><li>청중의 마음을 즉각적이고 진실하게 흔들어 놓음 (stir)</li><li>핵심 키워드: 영향력(influence)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02구체적 방법</div><ul><li>거창하고 긴 이야기보다는 진솔하고 소소한 개인적 경험을 공유하는 것이 효과적이다.</li><li>핵심적인 전기적 세부 사항(biographical detail)이나 현재의 감정 공유</li><li>자신을 낮추는 유머인 자기비하적 농담(self-deprecating joke) 활용</li><li>불필요한 요소: 긴 가족 여행 이야기나 아기 사진</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03유대감 형성</div><ul><li>개인적 공유는 낯선 청중과 유대감을 형성하여 설득을 위한 기초를 닦는 과정이다.</li><li>낯선 청중과 유대감을 쌓는 검증된 방식 (bonding)</li><li>향후 이어질 설득(persuade)을 위한 토대 마련 (groundwork)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 원리</div><ul><li>청중은 논리 그 자체보다 발표자라는 사람과 연결될 때 비로소 마음을 연다.</li><li>사람들은 공백 상태의 주장보다 발표자라는 사람(person)과 결속됨</li><li>개인적인 결점(personal flaw)을 공유하여 청중이 발표자와 자신을 동일시(identify)하게 함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stir</td><td class=\"m\">(감정을) 불러일으키다, 동요시키다</td></tr><tr><td class=\"w\">authentically</td><td class=\"m\">진정으로, 확실하게</td></tr><tr><td class=\"w\">open up to</td><td class=\"m\">~에게 마음을 열다, 속마음을 털어놓다</td></tr><tr><td class=\"w\">anecdote</td><td class=\"m\">일화, 개인적인 이야기</td></tr><tr><td class=\"w\">biographical</td><td class=\"m\">전기의, 개인 일대기에 관한</td></tr><tr><td class=\"w\">self-deprecating</td><td class=\"m\">자신을 낮추는, 자기비하적인</td></tr><tr><td class=\"w\">tried-and-tested</td><td class=\"m\">유효성이 증명된, 신뢰할 수 있는</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bond with</td><td class=\"m\">~와 유대감을 형성하다</td></tr><tr><td class=\"w\">lay the groundwork for</td><td class=\"m\">~을 위한 기틀을 마련하다, 기초를 닦다</td></tr><tr><td class=\"w\">persuade</td><td class=\"m\">설득하다, 납득시키다</td></tr><tr><td class=\"w\">in a vacuum</td><td class=\"m\">외부와 단절된 상태에서, 고립된 상태에서</td></tr><tr><td class=\"w\">revealing</td><td class=\"m\">(드러내지 않았던 것을) 드러내는, 흥미로운 사실을 보여주는</td></tr><tr><td class=\"w\">flaw</td><td class=\"m\">결점, 흠</td></tr><tr><td class=\"w\">identify with</td><td class=\"m\">~와 동질감을 느끼다, ~를 이해하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">결코 더 나은 방법은 없다</span><span class=\"en\"><b>There is simply no better way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">청중에게 영향을 주거나 그들을 동요시키는</span><span class=\"en\"><b><span class=\"grammar-hl\">to influence or stir</span> an audience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 즉각적으로, 강력하게, 진정성 있게 —</span><span class=\"en\"><b>— instantly, powerfully, authentically —</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에게 마음을 터놓는 것보다</span><span class=\"en\"><b>than by <span class=\"grammar-hl\">opening up to</span> them</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개인적인 이야기나 일화로</span><span class=\"en\"><b>with a personal story or anecdote.</b></span></div></div><div class=\"lec-sent-ko\">개인적인 이야기나 일화로 청중에게 마음을 터놓는 것보다, 즉각적으로, 강력하게, 그리고 진정성 있게 그들에게 영향을 주거나 그들을 동요시키는 더 나은 방법은 결코 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> opening up to them with a personal story는 연설가가 자신의 사적인 경험을 공유함으로써 청중의 심리적 경계심을 허무는 행동을 의미합니다. 글쓴이는 이 문장을 통해 연설의 성패를 결정짓는 가장 강력한 도구가 &#39;인간적인 연결&#39;임을 강조하며 글을 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to influence or stir (to부정사): 형용사적 용법으로 앞의 명사 way를 수식하며 &#39;~하는 (방법)&#39;으로 해석된다.</div><div class=\"lec-gr-item\">opening up to (관용표현): open up to는 &#39;~에게 마음을 열다/이야기를 시작하다&#39;라는 의미의 구동사이며, 여기서는 전치사 by의 목적어로 쓰인 동명사(opening) 형태다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stir</td><td class=\"m\">(감정을) 불러일으키다, 동요시키다</td></tr><tr><td class=\"w\">authentically</td><td class=\"m\">진정으로, 확실하게</td></tr><tr><td class=\"w\">anecdote</td><td class=\"m\">일화, 개인적인 이야기</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">명확히 하자면: 나는 말하는 것이 아니다</span><span class=\"en\"><b><span class=\"grammar-hl\">To be clear</span>: I’m not saying</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 그들에게 긴 이야기를 해야 한다고</span><span class=\"en\"><b>you need <span class=\"grammar-hl\">to tell</span> them long stories</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족 휴가에 관한</span><span class=\"en\"><b>about your family vacations</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 그들에게 아기 사진을 보여 줘야 한다고</span><span class=\"en\"><b>or show them baby pictures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무대에서</span><span class=\"en\"><b>from the stage.</b></span></div></div><div class=\"lec-sent-ko\">명확히 하자면, 나는 여러분이 그들에게 여러분의 가족 휴가에 관한 긴 이야기를 하거나 무대에서 아기 사진을 보여 줘야 한다고 말하는 것이 아니다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;개인적인 이야기&#39;가 자칫 지루한 &#39;자기자랑&#39;이나 &#39;불필요한 정보&#39;로 오해받을까 봐 범위를 제한하는 문장입니다. long stories about your family vacations는 청중의 관심사와 상관없는 지극히 사적인 내용으로, 오히려 청중의 집중력을 흐트러뜨릴 수 있는 나쁜 사례를 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To be clear (to부정사): 문장 전체를 수식하는 부사적 용법의 관용적 표현으로 &#39;분명히 말하자면&#39;이라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">to tell (to부정사): 일반동사 need의 목적어 역할을 하는 명사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">tell them long stories (4형식(SVOIODO)): tell(V) + them(IO) + long stories(DO) 구조로 &#39;~에게 ~을 말해주다&#39;라는 의미를 가진다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 말하는 것이다</span><span class=\"en\"><b>I’m saying</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 핵심적인 전기적 세부 사항을 공유할 수 있다고</span><span class=\"en\"><b>that you can share a key biographical detail,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 감정을</span><span class=\"en\"><b>or an emotion</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 그 순간에 느끼고 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that you’re feeling</span> in the moment,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 자기비하적인 농담을</span><span class=\"en\"><b>or a self-deprecating joke.</b></span></div></div><div class=\"lec-sent-ko\">나는 여러분이 핵심적인 전기(傳記)적 세부 사항, 혹은 여러분이 그 순간에 느끼고 있는 감정, 또는 자기비하적인 농담을 공유할 수 있다고 말하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 부정적인 예시와 대비하여, 권장되는 구체적인 전략을 제시합니다. self-deprecating joke는 완벽한 척하기보다 자신의 실수나 약점을 가볍게 유머로 승화시키는 것을 말하며, 이는 연설가가 청중보다 우월한 위치에 있으려 하지 않는다는 인상을 주어 친밀감을 높이는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that you’re feeling (관계대명사): 목적격 관계대명사 that이 이끄는 절이 선행사 an emotion을 수식한다. 타동사 feel의 목적어가 생략된 불완전한 절이 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">biographical</td><td class=\"m\">전기의, 개인 일대기에 관한</td></tr><tr><td class=\"w\">self-deprecating</td><td class=\"m\">자신을 낮추는, 자기비하적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 입증된 방법이다</span><span class=\"en\"><b>It is a <span class=\"grammar-hl\">tried-and-tested</span> way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">낯선 사람들인 청중과 유대감을 형성하는</span><span class=\"en\"><b>of <span class=\"grammar-hl\">bonding</span> with an audience of strangers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 그리고 기틀을 마련하는</span><span class=\"en\"><b>— and of laying the groundwork</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 그 후 그들을 설득하기 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">for you to then persuade</span> them.</b></span></div></div><div class=\"lec-sent-ko\">그것은 낯선 사람들인 청중과 유대감을 형성하는, 그리고 여러분이 그 후 그들을 ‘설득하기’ 위한 기틀을 마련하는 입증된 방법이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 사적인 공유가 가져오는 실질적인 이득을 설명합니다. laying the groundwork는 본격적인 논리나 주장을 펼치기 전에 청중이 내 말을 들을 준비가 되게끔 정서적인 밭을 일구는 작업입니다. 즉, 감정적 연결이 논리적 설득보다 앞서야 함을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tried-and-tested (과거분사(형용사)): tried와 tested가 결합되어 뒤의 명사 way를 수식하며 &#39;철저히 검증된&#39;이라는 의미를 전달한다. way that has been tried and tested의 축약 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">bonding (동명사): 전치사 of의 목적어로 쓰여 &#39;~와 유대감을 형성하는 것&#39;이라는 명사적 의미를 가진다.</div><div class=\"lec-gr-item\">for you to then persuade (to부정사): for you는 to부정사(to persuade)의 의미상 주어를 나타내는 &#39;for+목적격&#39; 구조이며, to부정사구 전체는 앞의 groundwork를 수식하거나 목적을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tried-and-tested</td><td class=\"m\">유효성이 증명된, 신뢰할 수 있는</td></tr><tr><td class=\"w\">persuade</td><td class=\"m\">설득하다, 납득시키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">냉혹한 현실은 ~라는 점이다</span><span class=\"en\"><b>The harsh reality is</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 여러분의 주장과 유대감을 형성하지 않을 것이라는</span><span class=\"en\"><b>that people won’t bond with your arguments</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">진공 상태에서는</span><span class=\"en\"><b>in a vacuum,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러나 그들은 그럴 것이다</span><span class=\"en\"><b>but they will,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강연 코치인 Bas van den Beld가 말하기를</span><span class=\"en\"><b><span class=\"grammar-hl\">says speech coach Bas van den Beld</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">“여러분과는 유대감을 형성할”</span><span class=\"en\"><b>“bond with you”</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">— 그 주장을 하는 사람인</span><span class=\"en\"><b>— the person <span class=\"grammar-hl\">making</span> those arguments.</b></span></div></div><div class=\"lec-sent-ko\">냉혹한 현실은 사람들이 진공 상태에서는 여러분의 주장과 유대감을 형성하지 않을 것이나, 강연 코치인 Bas van den Beld가 말하기를, 그 주장을 하는 사람인 ‘여러분과는 유대감을 형성할’ 것이라는 점이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전문가의 말을 인용하여 주장의 객관성을 더합니다. in a vacuum은 맥락이나 인간미가 전혀 없는 상태를 의미하며, 청중은 아무리 훌륭한 논리라도 그것을 말하는 사람에게 매력을 느끼지 못하면 그 내용도 받아들이지 않는다는 인간의 본성을 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">says speech coach Bas van den Beld (도치): 인용구나 삽입절에서 주어(speech coach Bas van den Beld)와 동사(says)의 위치가 바뀐 도치 구조다.</div><div class=\"lec-gr-item\">making (현재분사(형용사)): making이 이끄는 분사구가 앞의 명사 the person을 수식한다. person who is making의 축약 구조로 볼 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bond with</td><td class=\"m\">~와 유대감을 형성하다</td></tr><tr><td class=\"w\">in a vacuum</td><td class=\"m\">외부와 단절된 상태에서, 고립된 상태에서</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">의미심장한 이야기나 개인적인 결점을 공유함으로써</span><span class=\"en\"><b>By sharing a <span class=\"grammar-hl\">revealing</span> story or a personal flaw,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 청중 구성원들에게 방식을 허용한다</span><span class=\"en\"><b>you <span class=\"grammar-hl\">allow audience members a way</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분과 동일시할</span><span class=\"en\"><b><span class=\"grammar-hl\">to identify with</span> you.</b></span></div></div><div class=\"lec-sent-ko\">의미심장한 이야기나 개인적인 결점을 공유함으로써, 여러분은 청중 구성원들이 여러분과 동일시할 방식을 허용한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체를 마무리하며 핵심 전략을 다시 한번 정리합니다. identify with you는 청중이 연설가를 &#39;나와는 다른 대단한 사람&#39;이 아니라 &#39;나와 비슷한 고민과 실수를 하는 사람&#39;으로 느끼게 되어 심리적 거리감이 사라지는 상태를 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">revealing (현재분사(형용사)): revealing이 뒤의 명사 story를 수식하여 &#39;비밀을 드러내는/흥미로운&#39;이라는 상태를 나타낸다.</div><div class=\"lec-gr-item\">allow audience members a way (4형식(SVOIODO)): allow(V) + audience members(IO) + a way(DO) 구조로 &#39;~에게 ~을 허용하다/제공하다&#39;라는 의미를 만든다.</div><div class=\"lec-gr-item\">to identify with (to부정사): 형용사적 용법으로 앞의 명사 way를 수식하며, identify with는 &#39;~와 공감하다/동질감을 느끼다&#39;라는 관용표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">revealing</td><td class=\"m\">(드러내지 않았던 것을) 드러내는, 흥미로운 사실을 보여주는</td></tr><tr><td class=\"w\">flaw</td><td class=\"m\">결점, 흠</td></tr><tr><td class=\"w\">identify with</td><td class=\"m\">~와 동질감을 느끼다, ~를 이해하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>청중의 마음을 즉각적이고 강력하게 움직이는 최고의 방법은 개인적인 이야기를 들려주는 것이다.</li><li>무의미한 사생활 나열이 아니라, 감정이나 인생의 핵심 정보, 자기비하적 유머를 활용해야 한다.</li><li>이러한 전략은 낯선 청중과 유대감을 쌓고 설득을 위한 심리적 토대를 만들어준다.</li><li>사람들은 논리 그 자체보다 그 논리를 말하는 &#39;사람&#39;에게 먼저 반응하고 연결되기 때문이다.</li><li>결국 자신의 약점이나 숨겨진 이야기를 보여주는 것이 청중의 동질감을 끌어내는 핵심이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Speakers should share personal stories to establish a bond with their audience since people are more easily persuaded when they identify with the speaker.</div>\n              <div class=\"lec-final-sum-ko\">청중은 연사에게 공감할 때 더 쉽게 설득되기 때문에, 연사는 청중과 유대감을 형성하기 위해 개인적인 이야기를 공유해야 한다.</div></div></div>"],"segs":[[{"audio":"./20_audio/1.mp3","hl":null}],[{"audio":"./20_audio/2.mp3","hl":null}],[{"audio":
