<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 9월 고1 모의고사 43~45번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 9월 고1 모의고사 43~45번","audioDir":"2026-09-g1-45_new_audio","preview":false,"count":79,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.707em\">43~45번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 9월 고1 모의고사\u003c/div>\u003ch1>The Price of Freedom: Tuti's Clever Escape\u003c/h1>\u003ch2>자유의 가치: Tuti의 영리한 탈출\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>상인이 가둔 앵무새 Tuti가 인도의 친구가 보내준 \u003cb class=\"key\">죽은 \u003c/b>\u003cb class=\"key\">척하기\u003c/b>라는 지혜를 통해 주인을 속이고 마침내 \u003cb class=\"key\">자유\u003c/b>를 되찾는 여정을 담은 이야기입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>True freedom is far more valuable than any material wealth or comfort, and wisdom from others can help one achieve it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"반가워요, 여러분. 오늘은 페르시아의 상인과 앵무새 Tuti의 이야기를 통해 진정한 자유의 가치를 배워볼 거예요. 이 글은 아무리 화려한 삶이라도 자유가 없다면 행복할 수 없다는 소중한 교훈을 담고 있답니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문은 13세기 페르시아의 시인 루미의 우화에서 영감을 얻은 이야기입니다. 흔히 \u003cb class=\"key\">황금 \u003c/b>\u003cb class=\"key\">새장(Golden \u003c/b>\u003cb class=\"key\">Cage)\u003c/b>이라는 비유는 겉보기에는 풍요롭고 안전해 보이지만, 실제로는 개인의 \u003cb class=\"key\">자율성(Autonomy)\u003c/b>이 완전히 억압된 상태를 의미합니다. 우리가 애완동물을 사랑한다는 명목으로 가두어 두는 행위가 동물에게는 일종의 \u003cb class=\"key\">구속\u003c/b>이 될 수 있음을 시사하죠. 마치 좋은 학원을 다니며 공부만 하는 학생이 마음껏 뛰어놀 자유를 꿈꾸는 것과 비슷합니다. 결국 진정한 행복은 물질적 \u003cb class=\"key\">부(Wealth)\u003c/b>보다는 스스로 선택할 수 있는 권리에 있다는 교훈을 줍니다.\u003c/div>","segs":[{"n":2,"text":"이 이야기는 페르시아의 지혜가 담긴 우화입니다. 여기서 황금 새장은 아무리 화려해도 결국 자유가 없는 상태를 상징해요. 영어로는 Golden Cage라고 부르는데, 겉은 화려하지만 속은 구속된 상황을 뜻하죠. 마치 비싼 간식을 먹으면서도 산책을 못 나가는 강아지의 마음과 비슷하달까요. 우리는 이 글을 통해 자유의 소중함을 다시 한번 생각해보게 될 겁니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>황금 새장 속의 슬픈 Tuti\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>페르시아 상인이 인도에서 가져온 Tuti를 \u003cb class=\"key\">황금 \u003c/b>\u003cb class=\"key\">새장\u003c/b>에 가두고 아끼지만, Tuti는 늘 \u003cb class=\"key\">슬퍼 \u003c/b>\u003cb class=\"key\">보입니다\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>Tuti의 부탁\u003csmall>전개 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>상인이 다시 인도로 떠나려 하자, Tuti는 인도의 친구에게 자신의 \u003cb class=\"key\">갇힌 \u003c/b>\u003cb class=\"key\">처지\u003c/b>를 전해달라고 부탁합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>인도 친구의 반응\u003csmall>위기 · 문장 9–12\u003c/small>\u003c/h4>\u003cp>상인이 소식을 전하자 인도의 친구는 \u003cb class=\"key\">갑자기 \u003c/b>\u003cb class=\"key\">쓰러져\u003c/b> 죽은 듯 행동하고 상인은 이를 보고 당황합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>Tuti의 탈출 작전\u003csmall>전환 · 문장 13–17\u003c/small>\u003c/h4>\u003cp>집에 돌아온 상인이 소식을 전하자 Tuti 역시 똑같이 \u003cb class=\"key\">쓰러져 \u003c/b>\u003cb class=\"key\">죽은 \u003c/b>\u003cb class=\"key\">척\u003c/b>을 하고, 상인은 슬퍼하며 그를 품에 안습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>자유의 가치 깨달음\u003csmall>결론 · 문장 18–22\u003c/small>\u003c/h4>\u003cp>상인이 새장에서 꺼내자 Tuti는 \u003cb class=\"key\">자유를 \u003c/b>\u003cb class=\"key\">찾아\u003c/b> 날아가고, 상인은 부보다 \u003cb class=\"key\">자유의 \u003c/b>\u003cb class=\"key\">중요성\u003c/b>을 깨닫게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이야기는 상인이 Tuti를 데려오는 장면부터 자유를 찾아 날아가는 결말까지 다섯 단계로 이어집니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째부터 네 번째 문장에서는 상인이 Tuti를 지극히 아끼며 황금 새장에 가둡니다. 하지만 Tuti는 그 화려함 속에서도 늘 슬픈 모습을 보이죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 다섯 번째부터 여덟 번째 문장에서는 Tuti가 인도에 있는 친구에게 자신의 갇힌 처지를 전해달라고 상인에게 간곡히 부탁하는 장면이 나옵니다.","hl":"f1"},{"n":6,"text":"세 번째 단계인 아홉 번째부터 열두 번째 문장에서 상인은 인도의 친구에게 말을 전하지만, 친구가 갑자기 쓰러지자 크게 당황하며 슬퍼하게 됩니다.","hl":"f2"},{"n":7,"text":"네 번째 단계인 열세 번째부터 열일곱 번째 문장에서는 집에 돌아온 상인이 소식을 전하자 Tuti마저 인도의 친구처럼 쓰러져 죽은 척을 하는 긴박한 상황이 그려집니다.","hl":"f3"},{"n":8,"text":"마지막 다섯 번째 단계인 열여덟 번째부터 스물두 번째 문장에서 Tuti는 창밖으로 탈출에 성공하고, 상인은 세상의 부보다 자유가 더 중요하다는 사실을 깨닫게 되죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순(Chronological Order)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 22번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이야기가 시간의 흐름에 따라 순차적으로 진행되는 \u003cb class=\"key\">Narrative \u003c/b>\u003cb class=\"key\">구조\u003c/b>를 보입니다. 사건의 발단부터 결말까지의 과정을 통해 마지막 문장에서 \u003cb class=\"key\">자유의 \u003c/b>\u003cb class=\"key\">소중함\u003c/b>이라는 핵심 주제를 명시하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>The moment (10)\u003c/b>\u003cspan>즉각적인 사건 발생 신호\u003c/span>\u003cb>Suddenly (18)\u003c/b>\u003cspan>반전의 시작\u003c/span>\u003cb>realized that (22)\u003c/b>\u003cspan>깨달음과 주제 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">shiny golden cage\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cage\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">message\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">trick\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">regain my freedom\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">free\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 시간의 흐름에 따라 사건이 전개되는 시간순 구성을 취하고 있습니다. 마지막 문장에서 주제 의식이 드러나는 미괄식 구조라고 할 수 있죠.","hl":"ty"},{"n":10,"text":"사건의 전환을 알리는 The moment나 Suddenly 같은 표현들이 이야기의 긴장감을 높여줍니다. 특히 인도의 친구와 Tuti의 행동이 똑같이 나타나는 대목이 핵심 복선이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 03c/span>\u003c/div>\u003cdiv>\u003cb>occasionally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>가끔, 때때로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"여기서 regain은 되찾다라는 뜻으로 자유를 회복하는 핵심 단어입니다. 또한 wealth는 상인이 가진 부를 의미하며 자유와 대조되는 개념으로 쓰였어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">freedom\u003c/b>\u003cspan class=\"m\">자유\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">liberty\u003c/span>\u003cspan class=\"s\">independence\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">captivity\u003c/span>\u003cspan class=\"a\">slavery\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wealth\u003c/b>\u003cspan class=\"m\">부, 재산\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">riches\u003c/span>\u003cspan class=\"s\">fortune\u003c/span>\u003cspan class=\"s\">affluence\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">poverty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">tremble\u003c/b>\u003cspan class=\"m\">떨다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shake\u003c/span>\u003cspan class=\"s\">shiver\u003c/span>\u003cspan class=\"s\">quiver\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">trick\u003c/b>\u003cspan class=\"m\">속임수\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deception\u003c/span>\u003cspan class=\"s\">ruse\u003c/span>\u003cspan class=\"s\">scheme\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">realize\u003c/b>\u003cspan class=\"m\">깨닫다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">perceive\u003c/span>\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"s\">comprehend\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"자유를 뜻하는 freedom의 동의어로 independence나 liberty를 꼭 기억하세요. 반대말로는 갇힌 상태인 captivity가 있답니다. 떨다라는 뜻의 tremble은 shake와 같은 의미로 쓰였네요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옛날 페르시아에, \u003c/span>\u003cspan class=\"en\">Once upon a time in Persia,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 상인이 있었다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">merchant\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계를 돌아다녔던 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">traveled\u003c/span> the world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 사업을 위해.\u003c/span>\u003cspan class=\"en\">for his business.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">옛날 페르시아에, 그의 사업을 위해 세계를 돌아다녔던 한 상인이 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 배경인 페르시아와 주인공인 상인을 소개하며, 그가 전 세계를 돌아다니는 \u003cb class=\"key\">사업가\u003c/b>임을 보여주는 \u003cb class=\"key\">도입부\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there be동사 구문\u003c/span> : There + be동사 + 주어(명사) : \"한 상인이 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(a merchant) + who [주어 역할] + 동사 : \"돌아다녔던 (상인)\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Once upon a time in Persia, 옛날 페르시아에. there was a merchant, 한 상인이 있었다. who traveled the world, 세계를 돌아다녔던. for his business, 그의 사업을 위해.. 이 문장 전체를 해석하면, 옛날 페르시아에, 그의 사업을 위해 세계를 돌아다녔던 한 상인이 있었다.","hl":"m"},{"n":14,"text":"이 문장은 옛날이야기를 시작할 때 자주 쓰이는 표현으로 시작해서, 주인공인 상인이 어떤 사람인지 설명하고 있어요. 전 세계를 다니며 사업을 하는 능동적인 인물이라는 점이 이후 사건의 배경이 됩니다.","hl":"mn"},{"n":15,"text":"첫 번째 포인트는 there was a merchant입니다. there be동사 구문은 주어가 뒤에 오기 때문에 주어인 a merchant에 수량을 맞춰 was를 썼어요. 두 번째 포인트는 who traveled입니다. 앞에 나온 상인을 꾸며주는 주격 관계대명사 who가 쓰여서 어떤 상인인지 보충 설명하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도로의 한 여정에서, \u003c/span>\u003cspan class=\"en\">On \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">journeys\u003c/span> to India,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 아름다운 앵무새 한 마리를 받았다 \u003c/span>\u003cspan class=\"en\">he received a beautiful parrot\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선물로 \u003c/span>\u003cspan class=\"en\">as a gift\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그를 Tuti라고 이름 지었다.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">named \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">Tuti\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인도로의 한 여정에서, 그는 아름다운 앵무새 한 마리를 선물로 받았고 그를 Tuti라고 이름 지었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상인이 인도에서 앵무새 Tuti를 선물로 받게 된 \u003cb class=\"key\">사건의 \u003c/b>\u003cb class=\"key\">발단\u003c/b>을 설명하며, 앵무새와의 \u003cb class=\"key\">인연\u003c/b>이 시작됨을 알립니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">one of + 복수 명사\u003c/span> : one of + 한정어 + 복수 명사(journeys) : \"그의 여정들 중 하나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 문장(목적격 보어)\u003c/span> : name [동사] + him [목적어] + Tuti [목적격 보어/명사] : \"그를 Tuti라고 이름 지었다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"On one of his journeys to India, 인도로의 한 여정에서. he received a beautiful parrot, 그는 아름다운 앵무새 한 마리를 받았다. as a gift, 선물로. and named him Tuti, 그리고 그를 Tuti라고 이름 지었다.. 이 문장 전체를 해석하면, 인도로의 한 여정에서, 그는 아름다운 앵무새 한 마리를 선물로 받았고 그를 Tuti라고 이름 지었다.","hl":"m"},{"n":17,"text":"상인이 인도 여행 중에 앵무새를 선물로 받고 Tuti라는 이름을 지어주며 각별한 관계가 시작되는 장면이에요. 이 앵무새가 나중에 지혜를 발휘하는 주인공이 됩니다.","hl":"mn"},{"n":18,"text":"첫 번째로 one of his journeys를 보면, 여러 번의 여행들 중 하나를 말하기 때문에 journey 뒤에 복수 명사 형태를 써야 한다는 점을 주의하세요. 두 번째로 named him Tuti는 오형식 문장이에요. him이라는 목적어 뒤에 Tuti라는 이름이 보어로 와서 그를 투티라고 부르게 된 상황을 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 Tuti를 매우 사랑했고 \u003c/span>\u003cspan class=\"en\">He loved Tuti deeply\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 넣었다 \u003c/span>\u003cspan class=\"en\">and put him\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빛나는 황금 새장에.\u003c/span>\u003cspan class=\"en\">in a shiny golden cage.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 Tuti를 매우 사랑했고 그를 빛나는 황금 새장에 넣었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상인의 사랑이 \u003cb class=\"key\">구속\u003c/b>의 형태로 나타나고 있음을 보여주며, \u003cb class=\"key\">황금 \u003c/b>\u003cb class=\"key\">새장\u003c/b>은 물질적 풍요와 자유의 억압을 동시에 상징합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : 주어(He) + 동사1(loved) + and + 동사2(put) : \"사랑했고 ... 넣었다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"He loved Tuti deeply, 그는 Tuti를 매우 사랑했고. and put him, 그를 넣었다. in a shiny golden cage, 빛나는 황금 새장에.. 이 문장 전체를 해석하면, 그는 Tuti를 매우 사랑했고 그를 빛나는 황금 새장에 넣었다.","hl":"m"},{"n":20,"text":"상인이 앵무새를 너무 아낀 나머지 아주 비싸고 화려한 황금 새장에 가두었다는 내용이에요. 상인은 사랑이라고 생각했지만, 새의 입장에서는 자유를 잃은 답답한 상황이 시작된 것이죠.","hl":"mn"},{"n":21,"text":"여기서는 loved와 and 뒤의 put이 서로 짝을 이루는 동사의 병렬 구조를 확인해야 해요. 특히 put은 현재형과 과거형의 모양이 똑같기 때문에, 앞의 loved와 맞춰서 과거 시제로 쓰였다는 것을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">며칠이 지났지만,\u003c/span>\u003cspan class=\"en\">Days passed,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 아무리 많이\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">matter \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">much\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상인이 그의 앵무새를 돌봤더라도,\u003c/span>\u003cspan class=\"en\">the merchant cared for his parrot,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 화려한 새는 슬퍼 보였다.\u003c/span>\u003cspan class=\"en\">the colorful bird \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">seemed \u003c/span>\u003cspan class=\"tgt\">sad\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">며칠이 지났지만, 상인이 그의 앵무새를 아무리 많이 돌봤더라도, 그 화려한 새는 슬퍼 보였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상인의 지극한 정성에도 불구하고 앵무새가 여전히 \u003cb class=\"key\">우울한 \u003c/b>\u003cb class=\"key\">상태\u003c/b>임을 보여주어, 이후 전개될 \u003cb class=\"key\">갈등의 \u003c/b>\u003cb class=\"key\">실마리\u003c/b>를 제공합니다. 물질적 보살핌이 앵무새의 근본적인 문제인 \u003cb class=\"key\">자유의 \u003c/b>\u003cb class=\"key\">갈망\u003c/b>을 해결하지 못함을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">복합관계부사(양보의 부사절)\u003c/span> : no matter how + 형용사/부사 + 주어 + 동사 : \"아무리 많이 ~하더라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 상태 유지/변화 동사\u003c/span> : seem [동사] + sad [형용사/보어] : \"슬퍼 보였다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Days passed, 며칠이 지났지만. but no matter how much, 하지만 아무리 많이. the merchant cared for his parrot, 상인이 그의 앵무새를 돌봤더라도. the colorful bird seemed sad, 그 화려한 새는 슬퍼 보였다.. 이 문장 전체를 해석하면, 며칠이 지났지만, 상인이 그의 앵무새를 아무리 많이 돌봤더라도, 그 화려한 새는 슬퍼 보였다.","hl":"m"},{"n":23,"text":"상인이 정성껏 돌봐주는데도 앵무새 Tuti는 계속 슬퍼하네요. 앵무새에게 필요한 건 황금 새장이나 보살핌이 아니라 바로 자유라는 복선을 깔아주는 문장입니다.","hl":"mn"},{"n":24,"text":"첫 번째로 no matter how much 부분을 주목하세요. 아무리 많이 뭐뭐하더라도 라는 뜻으로 양보의 의미를 나타내죠. 두 번째로 seemed sad는 seem 뒤에 형용사를 써서 주어의 상태를 표현하는 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 인도로 떠나기 전,\u003c/span>\u003cspan class=\"en\">Before \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">leaving \u003c/span>\u003cspan class=\"tgt\">for\u003c/span> India again,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상인은 Tuti에게 물었다.\u003c/span>\u003cspan class=\"en\">the merchant asked Tuti,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“내가 인도에서 어떤 선물을 가져다주기를 원하니?”\u003c/span>\u003cspan class=\"en\">&quot;What present \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">bring\u003c/span> from India?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다시 인도로 떠나기 전, 상인은 Tuti에게 물었다. “내가 인도에서 어떤 선물을 가져다주기를 원하니?”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상인이 여행을 앞두고 앵무새의 \u003cb class=\"key\">소원\u003c/b>을 물어봄으로써, 앵무새가 \u003cb class=\"key\">자유를 \u003c/b>\u003cb class=\"key\">위한 \u003c/b>\u003cb class=\"key\">계획\u003c/b>을 세울 기회를 제공하는 장면입니다. 상인의 \u003cb class=\"key\">애정\u003c/b>이 담긴 질문이 역설적으로 이별의 계기가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : Before [접속사] + leaving [현재분사] : \"떠나기 전\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 보어로 to부정사를 취하는 동사\u003c/span> : like [동사] + me [목적어] + to bring [목적격 보어] : \"내가 가져다주기를 원하니\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Before leaving for India again, 다시 인도로 떠나기 전. the merchant asked Tuti, 상인은 Tuti에게 물었다.. \"What present would you like me to bring from India?\", “내가 인도에서 어떤 선물을 가져다주기를 원하니?”. 이 문장 전체를 해석하면, 다시 인도로 떠나기 전, 상인은 Tuti에게 물었다. “내가 인도에서 어떤 선물을 가져다주기를 원하니?”","hl":"m"},{"n":26,"text":"상인이 인도로 다시 가기 전에 앵무새에게 갖고 싶은 선물을 묻는 장면이에요. 이 질문 덕분에 Tuti가 인도의 친구에게 메시지를 보낼 수 있게 되죠.","hl":"mn"},{"n":27,"text":"첫 번째로 Before leaving은 접속사를 남겨둔 분사구문이에요. 상인이 직접 떠나는 것이니 능동의 의미인 현재분사를 썼어요. 두 번째로 like me to bring은 내가 가져오기를 원하느냐는 뜻으로 목적격 보어 자리에 to부정사를 쓰는 것이 핵심입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“당신이 인도의 앵무새들을 볼 때, 제 친구를 찾아 그녀에게 저에 대한 모든 것을 말해 주세요.&quot;\u003c/span>\u003cspan class=\"en\">&quot;When you see the parrots of India, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">friend \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">all\u003c/span> about me.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“당신이 인도의 앵무새들을 볼 때, 제 친구를 찾아 그녀에게 저에 대한 모든 것을 말해 주세요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앵무새가 자신의 \u003cb class=\"key\">안부\u003c/b>를 전해달라고 부탁하며, 인도의 친구에게 \u003cb class=\"key\">탈출 \u003c/b>\u003cb class=\"key\">방법\u003c/b>에 대한 힌트를 얻으려는 첫 단계를 보여줍니다. \u003cb class=\"key\">명령문\u003c/b> 형식을 통해 상인에 대한 간절한 부탁을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문의 병렬 구조\u003c/span> : look [동사원형 1] + and [연결어] + tell [동사원형 2] : \"내 친구를 찾아서 말해줘\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식 수여 동사 구조\u003c/span> : tell [동사] + her [간접 목적어] + all [직접 목적어] : \"그녀에게 모든 것을 말해줘\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"\"When you see the parrots of India, “당신이 인도의 앵무새들을 볼 때. look for my friend, 제 친구를 찾아. and tell her all about me.\", 그녀에게 저에 대한 모든 것을 말해 주세요.\". 이 문장 전체를 해석하면, “당신이 인도의 앵무새들을 볼 때, 제 친구를 찾아 그녀에게 저에 대한 모든 것을 말해 주세요.","hl":"m"},{"n":29,"text":"Tuti가 상인에게 부탁하는 말이에요. 인도의 친구에게 자신의 소식을 전해달라는 건데 이게 나중에 어떤 결과로 이어질지 지켜봐야겠네요.","hl":"mn"},{"n":30,"text":"첫 번째로 look for와 tell은 and로 연결된 병렬 구조예요. 둘 다 동사원형으로 시작하는 명령문이죠. 두 번째로 tell her all 부분은 그녀에게 모든 것을 말해주라는 사형식 구조로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀에게 말해 주세요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Tell \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 그녀를 매우 보고 싶어한다고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">love \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> see her,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그럴 수 없다고요\u003c/span>\u003cspan class=\"en\">but I can 't\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제가 새장에 살고 있어서\u003c/span>\u003cspan class=\"en\">because I live in a cage,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tuti가 대답했다.\u003c/span>\u003cspan class=\"en\">Tuti answered.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“그녀에게 제가 그녀를 매우 보고 싶어하지만 새장에 살고 있어서 그럴 수 없다고 말해주세요.” Tuti가 대답했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Tuti가 인도에 있는 친구에게 자신의 \u003cb class=\"key\">갇힌 \u003c/b>\u003cb class=\"key\">처지\u003c/b>를 전해달라고 부탁하는 장면입니다. 상인은 이것을 단순한 안부 인사로 생각하지만, 사실은 탈출을 위한 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">전달\u003c/b>의 시작점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 수여동사 구문\u003c/span> : tell [간접목적어] + [that절 (직접목적어)] : \"그녀에게 ~라는 것을 말해주다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 관용 표현\u003c/span> : would love + [to부정사] : \"정말로 ~하고 싶다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Tell her, 그녀에게 말해 주세요. that I would love to see her, 제가 그녀를 매우 보고 싶어한다고. but I can 't, 하지만 그럴 수 없다고요. because I live in a cage,\", 제가 새장에 살고 있어서. Tuti answered, Tuti가 대답했다.. 이 문장 전체를 해석하면, “그녀에게 제가 그녀를 매우 보고 싶어하지만 새장에 살고 있어서 그럴 수 없다고 말해주세요.” Tuti가 대답했다.","hl":"m"},{"n":32,"text":"Tuti가 주인에게 인도에 있는 친구에게 보낼 메시지를 부탁하는 장면이에요. 여기서 언급된 cage, 즉 새장은 Tuti가 현재 누리지 못하는 자유와 대비되는 구속을 상징하는 중요한 소재가 됩니다.","hl":"mn"},{"n":33,"text":"두 가지 포인트를 볼게요. 첫 번째로 Tell her that 부분은 Tell이라는 사형식 동사가 그녀에게라는 간접목적어와 that 이하라는 직접목적어를 데리고 온 구조예요. 두 번째로 would love to는 단순히 하고 싶다는 표현보다 훨씬 더 간절한 소망을 나타낼 때 사용한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상인은 그의 앵무새를 사랑했다\u003c/span>\u003cspan class=\"en\">The merchant loved his parrot\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무나 많이 그래서 그는 상상할 수 없었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> he couldn't \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">imagine \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 새장 밖으로 풀어 주는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">letting\u003c/span> him out of the cage\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그를 잃는다는 두려움 때문에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">fear \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">losing\u003c/span> him,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그는 그 메시지를 전해 주겠다고 약속했다\u003c/span>\u003cspan class=\"en\">but he promised to deliver the message\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 그의 여행을 가기 위해 떠났다.\u003c/span>\u003cspan class=\"en\">and then left to go on his trip.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">상인은 그의 앵무새를 너무 사랑해서 그를 잃는다는 두려움 때문에 그를 새장 밖으로 풀어 주는 것을 그는 상상할 수는 없었지만, 그는 그 메시지를 전해 주겠다고 약속하고 그의 여행을 가기 위해 떠났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상인의 이기적인 사랑이 드러나는 대목으로, 사랑한다는 핑계로 새를 \u003cb class=\"key\">구속\u003c/b>하고 있음을 보여줍니다. 하지만 약속을 지키기 위해 떠나는 행위가 결국 \u003cb class=\"key\">반전의 \u003c/b>\u003cb class=\"key\">계기\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">so ~ that 구문\u003c/span> : so [부사] + [that절 (결과)] : \"너무나 많이 ~해서 그 결과 ...하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : imagine + [동명사 (V-ing)] : \"내보내 주는 것을 상상하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 관용 표현\u003c/span> : for fear of + [명사/동명사] : \"~를 잃을까 봐 두려워서\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"The merchant loved his parrot, 상인은 그의 앵무새를 사랑했다. so much that he couldn't imagine, 너무나 많이 그래서 그는 상상할 수 없었다. letting him out of the cage, 그를 새장 밖으로 풀어 주는 것을. for fear of losing him, 그를 잃는다는 두려움 때문에. but he promised to deliver the message, 하지만 그는 그 메시지를 전해 주겠다고 약속했다. and then left to go on his trip, 그러고 나서 그의 여행을 가기 위해 떠났다.. 이 문장 전체를 해석하면, 상인은 그의 앵무새를 너무 사랑해서 그를 잃는다는 두려움 때문에 그를 새장 밖으로 풀어 주는 것을 그는 상상할 수는 없었지만, 그는 그 메시지를 전해 주겠다고 약속하고 그의 여행을 가기 위해 떠났다.","hl":"m"},{"n":35,"text":"상인이 앵무새를 정말 아끼긴 하지만 그 방식이 잘못되었음을 보여주는 문장이에요. 잃어버릴까 봐 두려워하는 마음 때문에 앵무새를 새장에만 가두어 두는 상인의 집착을 알 수 있죠.","hl":"mn"},{"n":36,"text":"중요한 문법이 많아요. 첫 번째로 so much that은 너무 많이 사랑해서 그 결과로 상상조차 못했다는 인과관계를 나타내요. 두 번째로 imagine이라는 동사는 뒤에 letting처럼 동명사를 목적어로 쓴다는 걸 꼭 기억하세요. 세 번째로 for fear of losing은 잃어버릴까 봐 두려워서라는 이유를 설명해주는 관용적인 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도로의 방문이 끝날 무렵,\u003c/span>\u003cspan class=\"en\">At the end of his visit to India,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 Tuti의 친구를 찾아\u003c/span>\u003cspan class=\"en\">he found Tuti's friend\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tuti의 정확한 말을 그대로 전달했다.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">repeated\u003c/span> Tuti's exact words.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인도로의 방문이 끝날 무렵, 그는 Tuti의 친구를 찾아 Tuti의 정확한 말을 그대로 전달했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상인이 약속을 이행하여 Tuti의 친구에게 말을 전하는 \u003cb class=\"key\">사건의 \u003c/b>\u003cb class=\"key\">전개\u003c/b> 부분입니다. 'exact words'라는 표현을 통해 메시지가 \u003cb class=\"key\">왜곡 \u003c/b>\u003cb class=\"key\">없이\u003c/b> 전달되었음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 병렬 구조\u003c/span> : [found (과거동사 1)] + and + [repeated (과거동사 2)] : \"찾아서 반복했다(전달했다)\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"At the end of his visit to India, 인도로의 방문이 끝날 무렵. he found Tuti's friend, 그는 Tuti의 친구를 찾아. and repeated Tuti's exact words, Tuti의 정확한 말을 그대로 전달했다.. 이 문장 전체를 해석하면, 인도로의 방문이 끝날 무렵, 그는 Tuti의 친구를 찾아 Tuti의 정확한 말을 그대로 전달했다.","hl":"m"},{"n":38,"text":"상인이 인도 여행을 마치면서 약속대로 Tuti의 말을 친구에게 전해주는 장면이에요. 여기서 exact words, 즉 정확한 말이라는 표현은 이후에 일어날 놀라운 사건의 신빙성을 높여주는 역할을 합니다.","hl":"mn"},{"n":39,"text":"이 문장은 구조가 단순해요. 주어인 he 뒤에 found라는 첫 번째 동사와 repeated라는 두 번째 동사가 and로 연결된 과거형 병렬 구조입니다. 상인이 한 두 가지 동작을 순서대로 보여주고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 순간,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">moment\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상인이 마지막 문장을 끝낸\u003c/span>\u003cspan class=\"en\">the merchant finished the last sentence,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tuti의 친구는 몸을 떨기 시작하고\u003c/span>\u003cspan class=\"en\">Tuti's friend \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">tremble\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰러져 죽고 말았다.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">fell \u003c/span>\u003cspan class=\"tgt\">down \u003c/span>\u003cspan class=\"tgt\">dead\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">상인이 마지막 문장을 끝낸 순간, Tuti의 친구는 몸을 떨기 시작하고 쓰러져 죽고 말았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상인의 말을 들은 인도 앵무새가 \u003cb class=\"key\">충격적인 \u003c/b>\u003cb class=\"key\">반응\u003c/b>을 보이며 쓰러지는 장면입니다. 이는 이후 Tuti가 자유를 얻기 위해 사용하는 \u003cb class=\"key\">자유를 \u003c/b>\u003cb class=\"key\">위한 \u003c/b>\u003cb class=\"key\">전략\u003c/b>의 결정적인 복선이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 역할을 하는 명사구\u003c/span> : The moment + 주어 + 동사 : \"~하는 순간에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : begin + [to-v (목적어)] : \"떨기 시작하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">유사보어(형용사)\u003c/span> : 자동사 + [형용사(상태 설명)] : \"쓰러져 죽다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"The moment, 그 순간. the merchant finished the last sentence, 상인이 마지막 문장을 끝낸. Tuti's friend began to tremble, Tuti의 친구는 몸을 떨기 시작하고. and fell down dead, 쓰러져 죽고 말았다.. 이 문장 전체를 해석하면, 상인이 마지막 문장을 끝낸 순간, Tuti의 친구는 몸을 떨기 시작하고 쓰러져 죽고 말았다.","hl":"m"},{"n":41,"text":"상인이 Tuti의 메시지를 인도에 있는 친구에게 전하자마자 일어난 충격적인 사건을 보여주는 문장이에요. 이 친구 앵무새의 반응은 나중에 Tuti가 탈출하는 데 결정적인 힌트, 즉 자유를 위한 전략이 됩니다.","hl":"mn"},{"n":42,"text":"첫 번째로 문장 맨 앞의 The moment은 접속사처럼 쓰여서 무엇무엇 하는 순간이라는 뜻을 나타내요. 두 번째로 began to tremble은 시작하다라는 동사의 목적어로 to부정사가 쓰인 구조입니다. 세 번째로 fell down 뒤에 나온 dead는 쓰러진 결과 어떤 상태가 되었는지를 설명하는 형용사 보어 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 믿을 수 없었다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">believe\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 눈을.\u003c/span>\u003cspan class=\"en\">his eyes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그의 눈을 믿을 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신의 말을 듣고 갑자기 죽어버린 앵무새를 보며 상인이 느끼는 \u003cb class=\"key\">당혹감\u003c/b>과 \u003cb class=\"key\">놀라움\u003c/b>을 간결하게 표현합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사의 과거 부정\u003c/span> : could not + [동사원형] : \"믿을 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"He couldn't believe, 그는 믿을 수 없었다. his eyes, 그의 눈을.. 이 문장 전체를 해석하면, 그는 그의 눈을 믿을 수 없었다.","hl":"m"},{"n":44,"text":"눈앞에서 갑자기 벌어진 앵무새의 죽음을 보고 상인이 얼마나 큰 충격을 받았는지 보여주는 짧고 강렬한 문장이에요.","hl":"mn"},{"n":45,"text":"여기서는 조동사 can의 과거형인 could에 부정어 not을 붙여서 과거에 무언가를 할 수 없었다는 불가능을 표현하고 있습니다. believe one's eyes라는 표현은 자기 눈으로 본 것을 믿는다는 뜻의 관용구로 아주 자주 쓰인답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“내가 어떻게 말해야 하지\u003c/span>\u003cspan class=\"en\">&quot;How can I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 슬픈 소식을 Tuti에게?”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">sad \u003c/span>\u003cspan class=\"tgt\">news \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Tuti\u003c/span>?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 말했다.\u003c/span>\u003cspan class=\"en\">he said.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“이 슬픈 소식을 Tuti에게 어떻게 전해야 하지?” 그는 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Tuti의 친구가 죽었다는 사실을 전해야 하는 상황에서 상인이 느끼는 \u003cb class=\"key\">죄책감\u003c/b>과 \u003cb class=\"key\">걱정\u003c/b>이 담긴 혼잣말입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">3형식 문장 (tell A to B)\u003c/span> : tell + [목적어(A)] + to + [대상(B)] : \"이 슬픈 소식을 Tuti에게 전하다\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"\"How can I tell, “내가 어떻게 말해야 하지. this sad news to Tuti?\", 이 슬픈 소식을 Tuti에게?”. he said, 그는 말했다.. 이 문장 전체를 해석하면, “이 슬픈 소식을 Tuti에게 어떻게 전해야 하지?” 그는 말했다.","hl":"m"},{"n":47,"text":"상인이 집으로 돌아가서 사랑하는 앵무새 Tuti에게 친구의 부고를 전해야 한다는 사실에 괴로워하는 장면입니다. 상인의 착한 성격과 죄책감이 잘 드러나죠.","hl":"mn"},{"n":48,"text":"의문사 How를 사용해서 방법을 묻고 있어요. 여기서 핵심은 tell A to B 구조인데요. 이 슬픈 소식이라는 목적어를 먼저 쓰고, 그 뒤에 전치사 to를 사용해서 소식을 받는 대상인 Tuti를 연결해 주었습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">며칠 후,\u003c/span>\u003cspan class=\"en\">A few days later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 집에 도착해\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">arrived \u003c/span>\u003cspan class=\"tgt\">home \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧장 Tuti에게 갔다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">went\u003c/span> straight to Tuti.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">며칠 후, 그는 집에 도착해 곧장 Tuti에게 갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인도 여행을 마치고 돌아온 상인이 약속한 대로 Tuti를 찾아가는 \u003cb class=\"key\">귀환\u003c/b>과 \u003cb class=\"key\">재회\u003c/b>의 장면입니다. 상인은 친구의 죽음이라는 슬픈 소식을 전해야 하는 \u003cb class=\"key\">무거운 \u003c/b>\u003cb class=\"key\">마음\u003c/b>을 안고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거동사의 병렬 구조\u003c/span> : Subject + [Verb 1 (arrived)] + and + [Verb 2 (went)] : \"도착해서 갔다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"A few days later, 며칠 후. he arrived home, 그는 집에 도착해. and went straight to Tuti, 곧장 Tuti에게 갔다.. 이 문장 전체를 해석하면, 며칠 후, 그는 집에 도착해 곧장 Tuti에게 갔다.","hl":"m"},{"n":50,"text":"인도 여행을 마친 상인이 드디어 집으로 돌아와 Tuti를 찾아가는 장면이에요. 상인은 인도의 친구가 죽었다는 소식을 전해야 하는 무거운 마음을 안고 재회하고 있죠.","hl":"mn"},{"n":51,"text":"이 문장에서는 접속사 and를 중심으로 과거동사인 arrived와 went가 연결된 병렬 구조가 쓰였어요. 주어인 상인이 수행한 일련의 동작들을 순서대로 보여주는 역할을 하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“당신은 제 메시지를 전해 주었나요\u003c/span>\u003cspan class=\"en\">&quot;Did you give my message\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 친구에게?”\u003c/span>\u003cspan class=\"en\">to my friend?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 앵무새가 그에게 기쁘게 물었다.\u003c/span>\u003cspan class=\"en\">his parrot \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">asked \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">happily\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“당신은 제 친구에게 제 메시지를 전해 주었나요?” 그의 앵무새가 그에게 기쁘게 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소식을 기다리던 Tuti가 \u003cb class=\"key\">순진하고 \u003c/b>\u003cb class=\"key\">기쁜\u003c/b> 태도로 질문을 던지는 장면입니다. 이 기쁨은 곧 이어질 \u003cb class=\"key\">비극적인 \u003c/b>\u003cb class=\"key\">소식\u003c/b>과 대비되어 극적 긴장감을 높입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 동사 수식\u003c/span> : [Verb (asked)] + [Adverb (happily)] : \"기쁘게 물었다\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"\"Did you give my message, “당신은 제 메시지를 전해 주었나요. to my friend?\", 제 친구에게?”. his parrot asked him happily, 그의 앵무새가 그에게 기쁘게 물었다.. 이 문장 전체를 해석하면, “당신은 제 친구에게 제 메시지를 전해 주었나요?” 그의 앵무새가 그에게 기쁘게 물었다.","hl":"m"},{"n":53,"text":"소식을 기다리던 Tuti가 아무것도 모른 채 아주 밝은 모습으로 질문을 던지고 있어요. 이 순진하고 기쁜 모습은 곧 전해질 비극적인 소식과 강하게 대비되어 독자의 안타까움을 자아냅니다.","hl":"mn"},{"n":54,"text":"여기서는 동사 asked를 수식하는 부사 happily가 아주 중요해요. 앵무새의 심리 상태를 묘사해서 곧 일어날 반전의 효과를 극대화하고 천진난만함이라는 분위기를 형성하는 역할을 하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상인은 그에게 말했다\u003c/span>\u003cspan class=\"en\">The merchant \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">told \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 이야기를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">whole \u003c/span>\u003cspan class=\"tgt\">story\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">상인은 그에게 모든 이야기를 말해주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상인이 인도에서 목격한 친구의 \u003cb class=\"key\">충격적인 \u003c/b>\u003cb class=\"key\">죽음\u003c/b>을 있는 그대로 전달하는 장면입니다. 이야기의 흐름상 갈등이 \u003cb class=\"key\">최고조\u003c/b>에 달하는 발단이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 수여동사\u003c/span> : tell + [Indirect Object (him)] + [Direct Object (the whole story)] : \"그에게 모든 이야기를 말해주었다\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"The merchant told him, 상인은 그에게 말했다. the whole story, 모든 이야기를.. 이 문장 전체를 해석하면, 상인은 그에게 모든 이야기를 말해주었다.","hl":"m"},{"n":56,"text":"상인이 인도에서 직접 보고 겪은 충격적인 사건을 Tuti에게 숨김없이 전달하고 있어요. 이 문장은 이야기 속의 긴장감이 최고조로 올라가기 직전의 중요한 전환점입니다.","hl":"mn"},{"n":57,"text":"이 문장은 tell이라는 수여동사를 사용한 전형적인 사형식 구조예요. 간접목적어인 Tuti에게 직접목적어인 사건 전체를 전해주었다는 의미를 명확하게 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 순간\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">moment\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 끝내자마자,\u003c/span>\u003cspan class=\"en\">he finished,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tuti는 몸을 떨고\u003c/span>\u003cspan class=\"en\">Tuti \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">trembled \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쓰러져 죽었다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">fell \u003c/span>\u003cspan class=\"tgt\">down \u003c/span>\u003cspan class=\"tgt\">dead\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인도의 앵무새처럼.\u003c/span>\u003cspan class=\"en\">just like the parrot in India.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 끝내자마자, Tuti는 인도의 앵무새처럼 몸을 떨고 쓰러져 죽었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Tuti는 친구가 전해준 죽은 척하기라는 \u003cb class=\"key\">전략적인 \u003c/b>\u003cb class=\"key\">연기\u003c/b>를 그대로 실행합니다. 이 행동은 주인으로부터 벗어나기 위한 \u003cb class=\"key\">자유의 \u003c/b>\u003cb class=\"key\">계획\u003c/b>이 본격적으로 시작되었음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사로 쓰인 명사구\u003c/span> : The moment + S + V : \"~하는 순간에, 하자마자\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거 동사의 병렬 구조\u003c/span> : V1(past) + and + V2(past) : \"몸을 떨고 쓰러졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">상태를 나타내는 형용사 보어\u003c/span> : fall + 형용사(보어) : \"쓰러져 죽다\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"The moment, 그 순간. he finished, 그가 끝내자마자. Tuti trembled, Tuti는 몸을 떨고. and fell down dead, 쓰러져 죽었다. just like the parrot in India, 인도의 앵무새처럼.. 이 문장 전체를 해석하면, 그가 끝내자마자, Tuti는 인도의 앵무새처럼 몸을 떨고 쓰러져 죽었다.","hl":"m"},{"n":59,"text":"상인이 인도의 소식을 전해주자마자 Tuti가 똑같은 반응을 보이며 쓰러지는 장면이에요. 이건 진짜 죽음이 아니라 자유를 되찾기 위해 친구가 가르쳐준 전략적인 연기를 시작한 것이죠.","hl":"mn"},{"n":60,"text":"첫 번째로 The moment는 문장에서 접속사처럼 쓰여서 주어가 동사하자마자라는 의미를 나타내요. 두 번째로 trembled와 fell은 과거 시제로 연결된 병렬 구조이고요. 마지막으로 dead는 쓰러진 결과가 어떤 상태인지 설명하는 형용사 보어로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충격을 받고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Shocked\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈물이 그의 얼굴을 타고 흘러 내린 채,\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">tears \u003c/span>\u003cspan class=\"tgt\">trickling \u003c/span>\u003cspan class=\"tgt\">down\u003c/span> his face,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상인은 Tuti를 품에 안았다\u003c/span>\u003cspan class=\"en\">the merchant held Tuti\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 팔에.\u003c/span>\u003cspan class=\"en\">in his arms.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">충격을 받고 눈물이 그의 얼굴을 타고 흘러 내린채, 상인은 Tuti를 품에 안았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상인은 Tuti의 죽음이 자신의 탓이라고 믿으며 깊은 \u003cb class=\"key\">슬픔과 \u003c/b>\u003cb class=\"key\">자책\u003c/b>을 느낍니다. 이러한 상인의 진심 어린 반응은 뒤에 이어지는 Tuti의 \u003cb class=\"key\">반전 \u003c/b>\u003cb class=\"key\">탈출\u003c/b>을 더욱 극적으로 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사 구문\u003c/span> : (Being) Shocked : \"충격을 받은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">with + 명사 + 분사 (부대상황)\u003c/span> : with + O + V-ing : \"눈물이 흘러내린 채\"\u003c/div>\u003c/div>","segs":[{"n":61,"text":"Shocked, 충격을 받고. and with tears trickling down his face, 눈물이 그의 얼굴을 타고 흘러 내린 채. the merchant held Tuti, 상인은 Tuti를 품에 안았다. in his arms, 그의 팔에.. 이 문장 전체를 해석하면, 충격을 받고 눈물이 그의 얼굴을 타고 흘러 내린채, 상인은 Tuti를 품에 안았다.","hl":"m"},{"n":62,"text":"상인은 투티가 정말 죽었다고 믿고 큰 슬픔에 빠졌어요. 이 문장에서 묘사된 상인의 간절한 슬픔은 잠시 후에 벌어질 투티의 반전 탈출을 훨씬 더 놀랍게 만들어주는 장치가 됩니다.","hl":"mn"},{"n":63,"text":"첫 번째로 Shocked는 주어인 상인이 충격을 받은 상태임을 알려주는 과거분사 구문이에요. 두 번째로 with tears trickling down은 명사가 분사하는 상황을 묘사하는 부대상황 구문으로 시험에 아주 자주 나오니 꼭 체크해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기,\u003c/span>\u003cspan class=\"en\">Suddenly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 날아올라\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">flew \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">탈출했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">escaped\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창문을 통해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">through\u003c/span> a window\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정원으로.\u003c/span>\u003cspan class=\"en\">into the garden.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">갑자기, 그는 날아올라 창문을 통해 정원으로 탈출했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 죽은 척하던 Tuti가 상인의 방심을 틈타 \u003cb class=\"key\">자유를 \u003c/b>\u003cb class=\"key\">획득\u003c/b>하는 반전의 순간입니다. 친구가 전수한 \u003cb class=\"key\">속임수\u003c/b>가 완벽하게 성공했음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 동사의 병렬 구조\u003c/span> : V1(past) + and + V2(past) : \"날아올라 탈출했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 (관통)\u003c/span> : through + 명사(통로) : \"~을 통해, 통과하여\"\u003c/div>\u003c/div>","segs":[{"n":64,"text":"Suddenly, 갑자기. he flew, 그는 날아올라. and escaped, 탈출했다. through a window, 창문을 통해. into the garden, 정원으로.. 이 문장 전체를 해석하면, 갑자기, 그는 날아올라 창문을 통해 정원으로 탈출했다.","hl":"m"},{"n":65,"text":"죽은 줄 알고 안아주던 상인의 품에서 투티가 갑자기 날아올라 창문 밖 정원으로 탈출하는 반전 장면이에요. 친구의 조언대로 죽은 척했던 연기가 완벽하게 성공해서 드디어 자유를 찾게 된 것이죠.","hl":"mn"},{"n":66,"text":"첫 번째로 flew와 escaped는 과거 시제로 병렬 연결되어 투티의 연속적인 움직임을 표현하고 있어요. 두 번째로 through는 창문이라는 통로를 뚫고 지나가는 관통의 의미를 전달하는 전치사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 너는\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이렇게 행동하는거니?&quot;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">acting\u003c/span> like this?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 Tuti에게 물었다.\u003c/span>\u003cspan class=\"en\">he asked Tuti.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“왜 너는 이렇게 행동하는거니?” 그는 Tuti에게 물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상인이 죽은 줄 알았던 \u003cb class=\"key\">앵무새의 \u003c/b>\u003cb class=\"key\">반전\u003c/b>에 놀라 행동의 이유를 묻는 장면입니다. 앵무새가 갑자기 살아나 탈출한 상황에 대한 \u003cb class=\"key\">당혹감\u003c/b>이 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형 의문문\u003c/span> : 의문사 + be동사 + 주어 + 현재분사(V-ing) : \"왜 너는 행동하고 있니\"\u003c/div>\u003c/div>","segs":[{"n":67,"text":"Why are you, 왜 너는. acting like this?\", 이렇게 행동하는거니?\". he asked Tuti, 그는 Tuti에게 물었다.. 이 문장 전체를 해석하면, “왜 너는 이렇게 행동하는거니?” 그는 Tuti에게 물었다.","hl":"m"},{"n":68,"text":"죽은 줄만 알았던 Tuti가 갑자기 날아가 버리자 상인이 무척 당황해하며 이유를 묻고 있는 장면이에요. 앵무새의 깜짝 반전이 시작되는 지점이죠.","hl":"mn"},{"n":69,"text":"첫 번째로 문장의 구조를 보면 의문문인데요. 왜 무엇을 하고 있는지 묻기 위해 의문사 Why 뒤에 be동사 are와 현재분사인 acting을 써서 현재진행형으로 질문하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“이것은 속임수예요\u003c/span>\u003cspan class=\"en\">&quot;This is a \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">trick \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 친구가 제게 가르쳐 준\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">friend \u003c/span>\u003cspan class=\"tgt\">taught \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 자유를 되찾을 수 있도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">regain\u003c/span> my freedom\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">죽은 척 해서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">playing \u003c/span>\u003cspan class=\"tgt\">dead\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“이것은 죽은 척 해서 제가 자유를 되찾을 수 있도록 제 친구가 제게 가르쳐 준 속임수예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앵무새가 보여준 행동이 사실은 인도 친구가 알려준 \u003cb class=\"key\">탈출 \u003c/b>\u003cb class=\"key\">전략\u003c/b>이었음을 밝힙니다. \u003cb class=\"key\">죽은 \u003c/b>\u003cb class=\"key\">척하기\u003c/b>라는 방법을 통해 상인의 감시를 풀고 자유를 얻으려 한 것입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : 명사(선행사) + [주어 + 타동사] : \"제 친구가 제게 가르쳐 준 속임수\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형 : \"되찾기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사\u003c/span> : by + 동명사(V-ing) + 형용사 : \"죽은 척 함으로써\"\u003c/div>\u003c/div>","segs":[{"n":70,"text":"\"This is a trick, “이것은 속임수예요. my friend taught me, 제 친구가 제게 가르쳐 준. to regain my freedom, 제 자유를 되찾을 수 있도록. by playing dead, 죽은 척 해서.. 이 문장 전체를 해석하면, “이것은 죽은 척 해서 제가 자유를 되찾을 수 있도록 제 친구가 제게 가르쳐 준 속임수예요.","hl":"m"},{"n":71,"text":"인도에 있던 친구가 왜 갑자기 쓰러져 죽었는지 이제야 비밀이 풀리네요. 바로 주인공 Tuti에게 죽은 척해서 탈출하라는 무언의 메시지를 보냈던 것이고, Tuti는 그 전략을 완벽하게 실행한 거예요.","hl":"mn"},{"n":72,"text":"첫 번째로 trick 뒤에는 목적격 관계대명사가 생략되어 있어서 친구가 가르쳐 줬다는 내용이 속임수를 꾸며주고 있어요. 두 번째로 to regain은 자유를 되찾으려는 목적을 나타내는 부사적 용법이고요. 세 번째로 by playing dead는 전치사 by를 써서 죽은 척하는 방법을 통해라는 의미를 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 21 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 좋은 주인이지만,\u003c/span>\u003cspan class=\"en\">You are a good master,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 새이고\u003c/span>\u003cspan class=\"en\">but I am a bird\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자유롭고 싶어요,\u003c/span>\u003cspan class=\"en\">and I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">wish \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">free\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새장 속에서 저의 삶을 사는 것이 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">live\u003c/span> my life in a cage,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Tuti가 대답했다.\u003c/span>\u003cspan class=\"en\">answered Tuti.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 좋은 주인이지만, 저는 새이고, 새장 속에서 저의 삶을 사는 것이 아니라 자유롭고 싶어요.” Tuti가 대답했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상인의 친절함과는 별개로 \u003cb class=\"key\">본능적인 \u003c/b>\u003cb class=\"key\">자유\u003c/b>에 대한 갈망을 고백합니다. 인위적인 안락함보다 \u003cb class=\"key\">자유로운 \u003c/b>\u003cb class=\"key\">삶\u003c/b>의 가치가 더 소중함을 강조하는 결말부의 핵심 대사입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : wish [타동사] + [to be (to부정사구/목적어)] : \"자유로워지는 것을 원하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조와 부정\u003c/span> : wish to be free, not (to) live : \"사는 것이 아니라\"\u003c/div>\u003c/div>","segs":[{"n":73,"text":"You are a good master, 당신은 좋은 주인이지만. but I am a bird, 저는 새이고. and I wish to be free, 자유롭고 싶어요. not live my life in a cage,\", 새장 속에서 저의 삶을 사는 것이 아니라. answered Tuti, Tuti가 대답했다.. 이 문장 전체를 해석하면, 당신은 좋은 주인이지만, 저는 새이고, 새장 속에서 저의 삶을 사는 것이 아니라 자유롭고 싶어요.” Tuti가 대답했다.","hl":"m"},{"n":74,"text":"Tuti는 주인을 싫어한 게 아니었어요. 하지만 아무리 황금 새장 속에서 사랑을 받아도 새의 본질은 날아다니는 자유에 있다는 것을 깨닫게 해주는 감동적인 장면이죠.","hl":"mn"},{"n":75,"text":"첫 번째로 wish라는 동사 뒤에는 무엇을 원하는지 나타내는 목적어가 필요한데요. 여기서는 to be free라는 투부정사구가 목적어 역할을 하고 있어요. 두 번째로 콤마 뒤의 not live는 앞의 to부정사와 연결되어 새장에 갇혀 살기보다는 자유를 원한다는 대조를 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 22 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상인은 깨달았다\u003c/span>\u003cspan class=\"en\">The merchant \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">realized \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자유가 더 중요하다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> freedom \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">mattered\u003c/span> more\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상의 모든 부보다\u003c/span>\u003cspan class=\"en\">than all the wealth in the world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그는 행복했다\u003c/span>\u003cspan class=\"en\">and he was \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">happy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가끔씩 두 마리의 아름다운 앵무새와 함께 하는 것에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> the company of two beautiful parrots occasionally.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">상인은 자유가 세상의 모든 부보다 더 중요하다는 것을 깨달았고, 그는 가끔씩 두 마리의 아름다운 앵무새와 함께 하는 것에 행복해했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 결말로, 상인이 물질적인 부보다 \u003cb class=\"key\">자유의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>가 훨씬 더 중요하다는 교훈을 얻었음을 보여줍니다. 새를 소유하려 했던 욕심을 버리고, 진정한 \u003cb class=\"key\">동반자\u003c/b>로서의 관계를 받아들이며 정신적인 성숙을 이룬 장면입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절)\u003c/span> : realized [동사] + that [접속사] + S + V : \"~라는 것을 깨달았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 matter\u003c/span> : freedom [주어] + mattered [동사] : \"중요했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(감정의 원인)\u003c/span> : happy [형용사] + to have [to부정사구] : \"함께 하는 것에 행복했다\"\u003c/div>\u003c/div>","segs":[{"n":76,"text":"The merchant realized, 상인은 깨달았다. that freedom mattered more, 자유가 더 중요하다는 것을. than all the wealth in the world, 세상의 모든 부보다. and he was happy, 그리고 그는 행복했다. to have the company of two beautiful parrots occasionally, 가끔씩 두 마리의 아름다운 앵무새와 함께 하는 것에. 이 문장 전체를 해석하면, 상인은 자유가 세상의 모든 부보다 더 중요하다는 것을 깨달았고, 그는 가끔씩 두 마리의 아름다운 앵무새와 함께 하는 것에 행복해했다.","hl":"m"},{"n":77,"text":"상인은 이제 금전적인 가치보다 자유가 훨씬 귀하다는 큰 교훈을 얻었네요. 새를 가두어 소유하던 방식에서 벗어나, 가끔 찾아와 주는 소중한 동반자로 여기게 된 점이 인상적입니다. 이것이 바로 이 글이 주는 주제이자 자유의 가치를 강조하는 대목이죠.","hl":"mn"},{"n":78,"text":"첫 번째 포인트로 realized 뒤의 that은 깨달은 내용 전체를 묶어주는 명사절 접속사예요. 목적어 자리이므로 생략도 가능하죠. 두 번째로 matter는 중요하다는 뜻의 자동사인데, 목적어가 필요 없는 완전한 문장을 만듭니다. 마지막으로 happy to have 부분은 행복한 기분이 왜 들었는지 그 감정의 원인을 설명해 주는 투부정사의 부사적 용법입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>상인은 인도에서 온 앵무새 Tuti를 사랑하여 화려한 \u003cb class=\"key\">황금 \u003c/b>\u003cb class=\"key\">새장\u003c/b>에 가두어 기릅니다.\u003c/li>\u003cli>Tuti는 인도의 친구에게 자신의 \u003cb class=\"key\">갇힌 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 전해달라고 상인에게 부탁합니다.\u003c/li>\u003cli>인도의 친구와 Tuti는 죽은 척하는 \u003cb class=\"key\">지혜로운 \u003c/b>\u003cb class=\"key\">속임수\u003c/b>를 사용하여 상인을 속입니다.\u003c/li>\u003cli>상인은 결국 물질적 부보다 \u003cb class=\"key\">자유의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>가 훨씬 더 중요하다는 것을 깨닫습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>True freedom is far more valuable than any material wealth or comfort, and wisdom from others can help one achieve it.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">상인이 가둔 앵무새 Tuti가 인도의 친구가 보내준 \u003cb class=\"key\">죽은 \u003c/b>\u003cb class=\"key\">척하기\u003c/b>라는 지혜를 통해 주인을 속이고 마침내 \u003cb class=\"key\">자유\u003c/b>를 되찾는 여정을 담은 이야기입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":79,"text":"겉으로 보이는 화려함보다 마음의 자유가 얼마나 소중한지 보여주는 감동적인 글이었어요. 여러분도 여러분만의 진정한 자유를 꿈꾸며 오늘 공부를 마무리하시길 바랍니다. 수고 많았어요!","hl":null}]}]});</script></body></html>
