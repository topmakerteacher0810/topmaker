<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>21번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"21번","audioDir":"21_new_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">21번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>Movement: Reclaiming Our Original Design for Life\u003c/h1>\u003ch2>움직임: 생명을 위한 우리의 본래 설계를 되찾는 것\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인간은 \u003cb class=\"key\">경이로운 \u003c/b>\u003cb class=\"key\">움직임\u003c/b>을 하도록 설계되었으나, 현대의 \u003cb class=\"key\">정적인 \u003c/b>\u003cb class=\"key\">생활\u003c/b>과 스마트 기기 사용으로 인해 신체적·정서적 발달 기회를 잃고 \u003cb class=\"key\">설계된 \u003c/b>\u003cb class=\"key\">목적\u003c/b>에서 멀어지고 있다는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Humans were designed for extraordinary lives through movement, but modern sedentary habits and digital devices are depriving us of our physical and emotional potential.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 왜 자꾸 몸이 아프고 마음이 불안한지에 대한 근본적인 이유를 다룬 지문을 함께 공부해보겠습니다. 이 글은 인간은 본래 움직이도록 설계되었지만, 현대의 정적인 생활 방식이 그 설계를 망치고 있다는 점을 꼬집고 있어요. 요약하자면, 움직임이 곧 우리의 생명력이라는 사실을 잊지 말아야 한다는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간은 수만 년 동안 끊임없이 움직이며 사냥과 채집을 하도록 \u003cb class=\"key\">진화(Evolution)\u003c/b>했습니다. 우리 몸의 근육과 신경계는 복잡한 활동을 수행할 때 가장 최적화된 상태를 유지하도록 \u003cb class=\"key\">설계(Design)\u003c/b>되어 있습니다. 하지만 현대 사회에서는 '의자에 앉아 있는 시간'이 늘어나며 신체적 활동이 급격히 줄어든 \u003cb class=\"key\">좌식 \u003c/b>\u003cb class=\"key\">생활(Sedentary \u003c/b>\u003cb class=\"key\">lifestyle)\u003c/b>이 보편화되었습니다. 마치 고성능 스포츠카를 주차장에만 세워두면 고장이 나듯이, 인간도 움직이지 않으면 \u003cb class=\"key\">신체적·정신적 \u003c/b>\u003cb class=\"key\">질병\u003c/b>에 노출됩니다. 일상에서 우리가 겪는 우울증이나 불안감 중 상당 부분은 생물학적 설계인 \u003cb class=\"key\">움직임(Movement)\u003c/b>을 실천하지 않는 데서 기인한다고 볼 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"우리 인류는 수만 년 동안 끊임없이 움직여야 생존할 수 있었던 존재예요. 이걸 진화와 설계라고 부르죠. 하지만 현대 사회는 어떤가요? 우리는 하루 종일 의자에 앉아 있고, 아이들은 밖에서 뛰어노는 대신 스마트폰에 갇혀 있습니다. 마치 경주용 자동차를 좁은 차고에만 가두어 두는 것과 같은 비유가 가능하겠네요. 결국 우리 몸은 설계된 대로 쓰이지 않아 녹슬고 병들고 있는 것입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입: 설계와 현실의 괴리\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>인간은 \u003cb class=\"key\">경이로운 \u003c/b>\u003cb class=\"key\">존재\u003c/b>로 창조되었지만, 정작 그 목적에 맞는 활동에는 참여하지 않고 \u003cb class=\"key\">어디로도 \u003c/b>\u003cb class=\"key\">움직이지 \u003c/b>\u003cb class=\"key\">않는\u003c/b> 삶을 살고 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>구체적 현상: 정체된 일상\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>매일 같은 공간에 \u003cb class=\"key\">머무르는 \u003c/b>\u003cb class=\"key\">습관\u003c/b>과 아이들을 사로잡은 \u003cb class=\"key\">스마트 \u003c/b>\u003cb class=\"key\">기기\u003c/b>가 움직임을 가로막고 있는 구체적 현실을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>부정적 결과: 발달의 저해\u003csmall>영향 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>움직임의 결여는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>를 읽는 법과 \u003cb class=\"key\">운동 \u003c/b>\u003cb class=\"key\">능력\u003c/b>의 상실을 초래하며, 결국 원래 없어야 할 \u003cb class=\"key\">불안과 \u003c/b>\u003cb class=\"key\">질병\u003c/b>을 유발합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론: 움직임의 본질\u003csmall>주장 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>우리가 우리의 \u003cb class=\"key\">설계(Design)\u003c/b>에서 멀어지고 있음을 지적하며, \u003cb class=\"key\">움직임이 \u003c/b>\u003cb class=\"key\">곧 \u003c/b>\u003cb class=\"key\">삶\u003c/b>이라는 본질적인 가치를 강조하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 인간의 원래 모습과 현재의 병든 모습, 그리고 다시 찾아야 할 가치 순으로 논리가 전개됩니다.","hl":null},{"n":4,"text":"처음 두 문장에서는 우리가 경이로운 존재로 창조되었지만, 정작 그 경이로움을 만끽할 움직임에는 참여하지 않고 정체되어 있다는 점을 비판하며 시작합니다.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 매일 같은 자리에만 머무는 우리와 스마트폰에 사로잡힌 아이들의 모습을 구체적으로 보여주며 문제의 원인을 짚어줍니다.","hl":"f1"},{"n":6,"text":"이어서 5번부터 8번까지는 그 결과가 얼마나 참혹한지 설명합니다. 아이들은 사회성을 잃고, 원래 겪지 않아도 될 불안과 우울, 질병을 배우게 된다고 경고하죠.","hl":"f2"},{"n":7,"text":"마지막 9번부터 열한 번째 문장에서는 글의 요점이 명확히 드러납니다. 우리는 움직이도록 만들어졌고, 움직임을 통해서만 특별한 삶을 살 수 있다는 진리를 다시 일깨워 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결(시사)\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부터 중반까지는 움직이지 않는 현대인의 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 상세히 기술하고 있습니다. 후반부인 9번 문장부터 \u003cb class=\"key\">요점(Point)\u003c/b>을 명시하며, 인간의 본래 설계는 \u003cb class=\"key\">움직임\u003c/b>에 있음을 강조하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Instead of (2)\u003c/b>\u003cspan>대조를 통한 현상 강조\u003c/span>\u003cb>As a result (6)\u003c/b>\u003cspan>인과관계에 따른 결과 제시\u003c/span>\u003cb>Instead (8)\u003c/b>\u003cspan>부정적 대체 상황 강조\u003c/span>\u003cb>The point is (9)\u003c/b>\u003cspan>핵심 요지 도입\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">wonderfully made\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">movement repertoire\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">design\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">made to move\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">extraordinary lives\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Movement is life\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Original Design (Our Wonder)\u003c/th>\u003cth>Current Reality (Nowhere)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Participate in wonder\u003c/td>\u003ctd>Moving nowhere\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Movement repertoire\u003c/td>\u003ctd>Held captive by smart devices\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Extraordinary lives\u003c/td>\u003ctd>Anxiety, depression, and diseases\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 문제점 제시 후 결론을 도출하는 구조입니다. 초반에는 현대인의 움직임 결여라는 문제를 다루다가, 마지막에 가서야 움직임이 생명이라는 주제를 강조하는 미괄식 패턴을 보이고 있어요.","hl":"ty"},{"n":9,"text":"여기서 신호어들을 잘 봐야 해요. 두 번째 문장의 Instead of나 8번의 Instead는 우리가 해야 할 일 대신 엉뚱한 일을 하고 있다는 대조를 보여줍니다. 특히 아홉 번째 문장의 The point is는 필자가 하고 싶은 진짜 말을 도입하는 아주 강력한 힌트가 됩니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>wonderfully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>경이롭게\u003c/span>\u003c/div>\u003cdiv>\u003cb>allow ourselves to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우리 자신이 ~하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>participate in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 참여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wonder\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경이로움\u003c/span>\u003c/div>\u003cdiv>\u003cb>create\u003c/b>\u003cem>동사\u003c/em>\u003cspan>창조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead of\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>anywhere and everywhere\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>어디로든 사방으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>occupy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>차지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>square footage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제곱 피트수, 면적\u003c/span>\u003c/div>\u003cdiv>\u003cb>be held captive by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 사로잡히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>device\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기기, 장치\u003c/span>\u003c/div>\u003cdiv>\u003cb>socialize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사회화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>physical cue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신체적 신호\u003c/span>\u003c/div>\u003cdiv>\u003cb>as a result\u003c/b>\u003cem>전치사구\u003c/em>\u003cspan>그 결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>repertoire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>레퍼토리, 목록\u003c/span>\u003c/div>\u003cdiv>\u003cb>mature\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>성숙한\u003c/span>\u003c/div>\u003cdiv>\u003cb>skip\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깡충 뛰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>climb\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기어오르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anxiety\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불안\u003c/span>\u003c/div>\u003cdiv>\u003cb>depression\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우울\u003c/span>\u003c/div>\u003cdiv>\u003cb>be meant to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하도록 되어있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>design\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설계\u003c/span>\u003c/div>\u003cdiv>\u003cb>extraordinary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특별한, 비범한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문에서 captive라는 단어는 포로라는 뜻인데, 여기서는 기기에 사로잡혔다는 뜻으로 쓰였죠. 그리고 repertoire는 우리가 할 수 있는 활동의 목록을 의미하고, extraordinary는 우리가 움직임을 통해 얻어야 할 특별한 삶을 수식하는 핵심 단어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">participate\u003c/b>\u003cspan class=\"m\">참여하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">engage\u003c/span>\u003cspan class=\"s\">join\u003c/span>\u003cspan class=\"s\">take part\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abstain\u003c/span>\u003cspan class=\"a\">withdraw\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">captive\u003c/b>\u003cspan class=\"m\">사로잡힌\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">confined\u003c/span>\u003cspan class=\"s\">imprisoned\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">free\u003c/span>\u003cspan class=\"a\">liberated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mature\u003c/b>\u003cspan class=\"m\">성숙한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">developed\u003c/span>\u003cspan class=\"s\">grown-up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">immature\u003c/span>\u003cspan class=\"a\">childish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">extraordinary\u003c/b>\u003cspan class=\"m\">특별한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">exceptional\u003c/span>\u003cspan class=\"s\">remarkable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">occupy\u003c/b>\u003cspan class=\"m\">차지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inhabit\u003c/span>\u003cspan class=\"s\">take up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">vacate\u003c/span>\u003cspan class=\"a\">empty\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어들을 정리해볼까요? participate는 참여하다라는 뜻으로 engage와 비슷합니다. captive의 반대말은 자유로운 상태를 뜻하는 free가 되겠죠. 성숙하다는 mature는 developed와 통하고, 특별한을 뜻하는 extraordinary의 반대말은 평범한, 즉 ordinary라는 점을 꼭 기억하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 경이롭게 만들어졌지만,\u003c/span>\u003cspan class=\"en\">We are wonderfully made,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 우리 자신이 허락하지 않는다\u003c/span>\u003cspan class=\"en\">yet we don't \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">allow \u003c/span>\u003cspan class=\"tgt\">ourselves \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그 경이로움에 참여하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">participate\u003c/span> in the wonder\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 우리가 창조된 목적인.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">which\u003c/span> we were created.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 경이롭게 만들어졌지만, 우리가 창조된 목적인 그 경이로움에 우리 자신이 참여하게 하지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간은 본래 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">활동성\u003c/b>과 같은 경이로운 잠재력을 갖고 태어났으나, 현대인은 그 \u003cb class=\"key\">잠재력\u003c/b>을 충분히 발휘하며 살지 못하고 있다는 역설을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 동사 allow와 재귀대명사\u003c/span> : allow [동사] + ourselves [목적어] + to participate [목적격 보어(to부정사)] : \"우리 자신이 참여하도록 허락하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 관계대명사\u003c/span> : the wonder [선행사] + for [전치사] + which [관계대명사] : \"~를 위해 (창조된)\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"We are wonderfully made, 우리는 경이롭게 만들어졌지만.  yet we don't allow ourselves,  우리 자신이 허락하지 않는다.  to participate in the wonder,  그 경이로움에 참여하게.  for which we were created,  우리가 창조된 목적인.. 이 문장 전체를 해석하면, 우리는 경이롭게 만들어졌지만, 우리가 창조된 목적인 그 경이로움에 우리 자신이 참여하게 하지 않는다.","hl":"m"},{"n":13,"text":"우리는 본래 아주 대단한 존재로 설계되었는데, 정작 그 설계된 목적대로 살지 못하고 있다는 안타까움을 표현하고 있어요. 여기서 경이로움은 우리가 가진 신체적 활동성과 잠재력을 의미합니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트, 주어와 목적어가 같아서 목적어 자리에 재귀대명사 ourselves를 썼고, allow 동사 때문에 보어 자리에 to부정사가 왔습니다. 두 번째로 for which는 선행사 wonder를 수식하는데, 전치사 for가 관계대명사 앞으로 나온 형태라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어디로든 사방으로 움직이는 대신에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">moving\u003c/span> anywhere and everywhere,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 우리의 대부분은 우리의 시간을 보낸다\u003c/span>\u003cspan class=\"en\">most of us \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">spend \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 어디로도 움직이지 않은 채.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">moving\u003c/span> nowhere.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어디로든 사방으로 움직이는 대신에, 우리의 대부분은 어디로도 움직이지 않은 채 우리의 시간을 보낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 활동적으로 움직여야 할 인간이 현대 사회에서 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">비활동성\u003c/b> 상태에 놓여 있음을 \u003cb class=\"key\">대조적 \u003c/b>\u003cb class=\"key\">표현\u003c/b>을 통해 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사의 목적어(동명사)\u003c/span> : Instead of [전치사] + moving [동명사] : \"움직이는 대신에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">spend 구문\u003c/span> : spend [동사] + our time [시간] + moving [현재분사(v-ing)] : \"움직이면서 시간을 보내다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Instead of moving anywhere and everywhere, 어디로든 사방으로 움직이는 대신에.  most of us spend our time,  우리의 대부분은 우리의 시간을 보낸다.  moving nowhere,  어디로도 움직이지 않은 채.. 이 문장 전체를 해석하면, 어디로든 사방으로 움직이는 대신에, 우리의 대부분은 어디로도 움직이지 않은 채 우리의 시간을 보낸다.","hl":"m"},{"n":16,"text":"어디든 갈 수 있는 존재인데도 실제로는 아무 데도 가지 않는다는 대조가 인상적이죠? 현대인의 신체적 비활동성을 꼬집는 문장입니다.","hl":"mn"},{"n":17,"text":"먼저 instead of라는 전치사 뒤에 동명사 moving이 온 걸 확인하세요. 그리고 가장 중요한 표현, spend 뒤에 시간이나 돈이 나오고 그 뒤에 현재분사 moving을 써서 무엇을 하며 시간을 보내는지 나타내고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 차지한다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">occupy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 의자와 동일한 제곱 피트수를\u003c/span>\u003cspan class=\"en\">the same square footage of a chair\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 매일 몇 시간이고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">hours \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">hours\u003c/span> every day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 매일 몇 시간이고 의자와 동일한 제곱 피트수를 차지한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의자에 앉아 생활하는 시간이 매우 길다는 점을 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">수치\u003c/b>와 표현을 통해 묘사하며, \u003cb class=\"key\">좌식 \u003c/b>\u003cb class=\"key\">생활\u003c/b>의 고착화를 비판합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 시계의 의미\u003c/span> : [주어] + occupy [현재형 동사] : \"차지한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간의 지속을 나타내는 전치사구\u003c/span> : for [전치사] + hours and hours [명사구] : \"몇 시간이고 계속해서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"We occupy, 우리는 차지한다.  the same square footage of a chair,  의자와 동일한 제곱 피트수를.  for hours and hours every day,  매일 몇 시간이고.. 이 문장 전체를 해석하면, 우리는 매일 몇 시간이고 의자와 동일한 제곱 피트수를 차지한다.","hl":"m"},{"n":19,"text":"의자 위라는 아주 좁은 공간에 갇혀 지내는 우리의 모습을 상상해 보세요. 제곱 피트라는 표현을 써서 우리가 얼마나 좁은 공간에 묶여 있는지 생생하게 하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사\u003c/span> : how [의문사] + to run [to부정사] : \"달리는 방법\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : how to A, how to B, or how to C : \"달리는 법, 뛰는 법, 혹은 기어오르는 법\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"They are not even learning, 그들은 심지어 배우고 있지 않다. how to run, 달리는 법. how to skip, 깡충 뛰는 법. or how to climb, 혹은 기어오르는 법조차.. 이 문장 전체를 해석하면, 그들은 심지어 달리는 법, 깡충 뛰는 법, 혹은 기어오르는 법조차 배우고 있지 않다.","hl":"m"},{"n":31,"text":"이 문장은 아이들이 스마트 기기 때문에 기본적인 기초적인 신체 능력을 기를 기회를 놓치고 있다는 점을 보여줍니다. 당연히 누려야 할 움직임의 즐거움을 잃어버린 것이죠.","hl":"mn"},{"n":32,"text":"첫 번째로 how to run은 의문사 뒤에 to부정사가 붙어 목적어 역할을 하고 있어요. 두 번째로 A, B, or C의 형태로 명사구가 세 번 반복되는 병렬 구조에 주목하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에\u003c/span>\u003cspan class=\"en\">Instead,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 배우고 있다\u003c/span>\u003cspan class=\"en\">they are learning\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불안, 우울과 사는 법을,\u003c/span>\u003cspan class=\"en\">how to live with anxiety, depression,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 심지어 질병들과\u003c/span>\u003cspan class=\"en\">and even \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">diseases \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 결코 가지기로 되어 있지 않았던.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">meant \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신에 그들은 결코 가지기로 되어 있지 않았던 불안, 우울, 그리고 심지어 질병들과 사는 법을 배우고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신체 활동 대신 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">질환\u003c/b>과 질병에 노출된 현대 아이들의 비극적인 반전을 보여줍니다. 우리가 본래 \u003cb class=\"key\">의도된 \u003c/b>\u003cb class=\"key\">삶\u003c/b>과는 정반대의 방향으로 나아가고 있음을 비판합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사의 생략\u003c/span> : diseases [명사] + (that/which) [목적격 관계대명사 생략] + they were never meant to have [절] : \"그들이 결코 가지기로 되어 있지 않았던 질병들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be meant to (수동태 관용 표현)\u003c/span> : be [be동사] + meant [past participle] + to-v [to부정사] : \"~하기로 되어 있지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Instead, 대신에. they are learning, 그들은 배우고 있다. how to live with anxiety, depression, 불안, 우울과 사는 법을. and even diseases, 그리고 심지어 질병들과. they were never meant to have, 그들이 결코 가지기로 되어 있지 않았던.. 이 문장 전체를 해석하면, 대신에 그들은 결코 가지기로 되어 있지 않았던 불안, 우울, 그리고 심지어 질병들과 사는 법을 배우고 있다.","hl":"m"},{"n":34,"text":"신체 활동을 배우는 대신 정신적 질환을 앓게 된 비극을 묘사합니다. 우리가 본래 의도된 삶에서 얼마나 멀어졌는지 잘 보여주는 문장입니다.","hl":"mn"},{"n":35,"text":"먼저 diseases 뒤에는 목적격 관계대명사가 생략되어 뒤에서 앞으로 수식해 줍니다. 또한 be meant to 표현은 본래의 설계나 의도를 나타낸다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요점은\u003c/span>\u003cspan class=\"en\">The point is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 되고 있다는 것이다\u003c/span>\u003cspan class=\"en\">we are getting\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 멀어지는 중이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">further \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">further\u003c/span> away\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 설계로부터.\u003c/span>\u003cspan class=\"en\">from our design.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">요점은 우리가 우리의 설계로부터 점점 더 멀어지고 있는 중이라는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문제점들을 요약하며, 우리가 타고난 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">설계\u003c/b>에서 일탈하고 있다는 핵심 메시지를 던집니다. 움직여야 하는 본질을 잊고 \u003cb class=\"key\">부자연스러운 \u003c/b>\u003cb class=\"key\">상태\u003c/b>로 나아가고 있음을 경고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 and 비교급\u003c/span> : further [비교급] + and + further [비교급] : \"점점 더 멀리\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">명사절을 이끄는 접속사 that의 생략\u003c/span> : The point [주어] + is [동사] + (that) [접속사 생략] + we are getting [보어절] : \"요점은 우리가 ~하고 있다는 것이다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The point is, 요점은. we are getting, 우리가 되고 있다는 것이다. further and further away, 점점 더 멀어지는 중이. from our design, 우리의 설계로부터.. 이 문장 전체를 해석하면, 요점은 우리가 우리의 설계로부터 점점 더 멀어지고 있는 중이라는 것이다.","hl":"m"},{"n":37,"text":"이 글의 결론입니다. 인간은 움직이도록 설계되었는데 그 인간의 설계에서 점점 벗어나 부자연스러운 상태가 되고 있다는 뜻이죠.","hl":"mn"},{"n":38,"text":"문장 중간에 접속사 that이 생략된 명사절이 보어로 쓰였습니다. 그리고 비교급 and 비교급 구조를 사용해 거리가 멀어지는 정도가 심화되고 있음을 강조했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 만들어졌다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">움직이도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">move\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">― 그리고 움직임을 통해,\u003c/span>\u003cspan class=\"en\">― and through movement,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 되어있다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">meant \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특별한 삶을 살도록.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">live\u003c/span> extraordinary lives.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 움직이도록 만들어졌으며, 움직임을 통해 특별한 삶을 살도록 되어있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간의 본질적인 \u003cb class=\"key\">설계 \u003c/b>\u003cb class=\"key\">목적\u003c/b>이 움직임에 있음을 강조하며, 단순한 생존을 넘어 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">삶\u003c/b>을 영위하기 위한 핵심 수단이 움직임임을 밝힙니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 수동태 (make + 목적어 + 목적격 보어)\u003c/span> : be made + to-v [보어] : \"움직이도록 만들어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be meant to-v 관용 표현\u003c/span> : be meant + to-v [목적/의도] : \"살도록 되어있다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"We were made, 우리는 만들어졌다.  to move, 움직이도록.  ― and through movement, ― 그리고 움직임을 통해.  we are meant, 우리는 되어있다.  to live extraordinary lives, 특별한 삶을 살도록.. 이 문장 전체를 해석하면, 우리는 움직이도록 만들어졌으며, 움직임을 통해 특별한 삶을 살도록 되어있다.","hl":"m"},{"n":40,"text":"우리는 원래 움직이도록 설계된 존재라는 점을 강조하고 있어요. 움직임이 단순히 몸을 쓰는 게 아니라, 우리 삶을 아주 특별하게 만들어주는 핵심적인 통로가 된다는 뜻입니다.","hl":"mn"},{"n":41,"text":"첫 번째로 were made to move는 5형식 문장이 수동태가 되면서 동사원형이었던 보어가 to부정사로 바뀐 형태예요. 두 번째로 are meant to는 정해진 운명이나 목적과 운명을 말할 때 쓰는 아주 중요한 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">움직임은\u003c/span>\u003cspan class=\"en\">Movement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게.\u003c/span>\u003cspan class=\"en\">to us.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">움직임은 우리에게 삶‘이다.’\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 결론으로, 움직임이 인간의 단순한 기능이 아니라 생명력 그 자체이자 존재의 \u003cb class=\"key\">본질\u003c/b>임을 선언하며 \u003cb class=\"key\">강력한 \u003c/b>\u003cb class=\"key\">결말\u003c/b>을 맺습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장의 주격 보어\u003c/span> : Movement [주어] + is [동사] + life [보어] : \"삶이다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Movement, 움직임은.  is life, 삶이다.  to us, 우리에게.. 이 문장 전체를 해석하면, 움직임은 우리에게 삶‘이다.’","hl":"m"},{"n":43,"text":"이 글의 마지막 결론이죠? 움직임은 우리에게 있어 단순한 활동 이상으로, 생명 그 자체와도 같은 아주 본질적인 것이라는 점을 강력하게 전달하며 마무리하고 있어요.","hl":"mn"},{"n":44,"text":"주어인 Movement와 보어인 life를 연결해서 두 대상이 똑같은 존재라고 말하고 있어요. 이렇게 명사 보어를 써서 움직임이 곧 삶이라는 동격의 의미를 강조한 문장입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>인간은 본래 \u003cb class=\"key\">경이로운 \u003c/b>\u003cb class=\"key\">움직임\u003c/b>을 실천하며 살아가도록 창조된 존재입니다.\u003c/li>\u003cli>현대인들은 \u003cb class=\"key\">스마트 \u003c/b>\u003cb class=\"key\">기기\u003c/b>와 정적인 생활 방식 때문에 자신의 \u003cb class=\"key\">움직임 \u003c/b>\u003cb class=\"key\">레퍼토리\u003c/b>를 개발하지 못하고 있습니다.\u003c/li>\u003cli>신체 활동의 부족은 사회적 기술의 미달과 \u003cb class=\"key\">불안, \u003c/b>\u003cb class=\"key\">우울, \u003c/b>\u003cb class=\"key\">질병\u003c/b>이라는 부정적인 결과를 초래합니다.\u003c/li>\u003cli>인간의 설계 원리는 \u003cb class=\"key\">움직임\u003c/b>에 있으며, 이를 통해서만 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">삶\u003c/b>을 영위할 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Humans were designed for extraordinary lives through movement, but modern sedentary habits and digital devices are depriving us of our physical and emotional potential.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">인간은 \u003cb class=\"key\">경이로운 \u003c/b>\u003cb class=\"key\">움직임\u003c/b>을 하도록 설계되었으나, 현대의 \u003cb class=\"key\">정적인 \u003c/b>\u003cb class=\"key\">생활\u003c/b>과 스마트 기기 사용으로 인해 신체적·정서적 발달 기회를 잃고 \u003cb class=\"key\">설계된 \u003c/b>\u003cb class=\"key\">목적\u003c/b>에서 멀어지고 있다는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"자, 오늘 지문의 핵심은 아주 명확합니다. 인간의 설계도는 움직임에 맞춰져 있다는 거예요. 여러분도 공부하다가 힘들 때는 이 지문을 떠올리며 가볍게 몸을 움직여 보세요. 그게 바로 여러분의 설계에 맞는 삶을 사는 법이니까요. 오늘 수업 여기서 마칩니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
