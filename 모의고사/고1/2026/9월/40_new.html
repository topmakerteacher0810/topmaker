<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>40번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-sno{font-size:13px;color:#8493A1;font-weight:700;margin-bottom:8px}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-brand{background:#fff;color:var(--pk-t);border:1px solid var(--pk);border-radius:3px;font-weight:700;letter-spacing:.02em;padding:2px 11px}
.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-cv h1,.lp-big{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700}
.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"40번","audioDir":"40_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">40번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>Self-Esteem: The Internal Alarm for Our Social Bonds\u003c/h1>\u003ch2>자아존중감: 우리의 사회적 유대를 위한 내부 경보 장치\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>자아존중감은 타인과의 관계에서 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">포함 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 감시하고, 관계적 가치가 낮아질 때 경고 신호를 보내어 행동을 \u003cb class=\"key\">조정\u003c/b>하게 하는 진화적 기제이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Self-esteem functions as a socio-metric indicator that alerts us to shifts in our relational value and prompts behavioral changes to maintain social bonds.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 흔히 말하는 자아존중감이 단순히 기분의 문제가 아니라, 생존을 위한 정교한 시스템이라는 점을 배워볼 거예요. 이 지문은 자아존중감을 사회적 포함 상태를 알려주는 감시 기제로 정의하고 있습니다. 자아존중감이 어떻게 우리 관계를 지켜내는지 그 흥미로운 작동 원리를 함께 살펴볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간은 생존을 위해 무리 생활이 필수적이었기에, 집단에서 \u003cb class=\"key\">배제\u003c/b>되는 것은 과거 생존에 치명적인 위협이었습니다. 이러한 진화적 맥락에서 발달한 것이 바로 심리학자 마크 리어리의 \u003cb class=\"key\">소시오미터 \u003c/b>\u003cb class=\"key\">이론\u003c/b>(Sociometer Theory)입니다. 자아존중감은 마치 자동차의 \u003cb class=\"key\">연료 \u003c/b>\u003cb class=\"key\">게이지\u003c/b>(fuel gauge)처럼, 우리 마음속에서 관계의 질을 실시간으로 측정합니다. 만약 수치가 낮아지면 \u003cb class=\"key\">경고등\u003c/b>이 켜지듯 우리에게 심리적 불편감을 주어 관계를 회복하도록 유도합니다. 즉, 자아존중감은 단순한 느낌이 아니라 사회적 생존을 위한 \u003cb class=\"key\">감시 \u003c/b>\u003cb class=\"key\">도구\u003c/b>인 셈입니다.\u003c/div>","segs":[{"n":2,"text":"인간은 아주 오래전부터 혼자서는 살아남기 힘든 존재였어요. 그래서 집단에서 배제되는 것은 곧 생명과 직결되는 문제였죠. 심리학에서는 이를 설명하기 위해 소시오미터 이론이라는 개념을 사용합니다. 자아존중감을 마치 자동차의 연료 게이지처럼 우리 마음속 관계의 수치를 보여주는 장치로 보는 것이죠. 연료가 떨어지면 경고등이 켜지듯, 관계에 문제가 생기면 자아존중감이라는 신호등에 불이 들어오는 겁니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입: 자아존중감의 정의\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>진화적 관점에서 자아존중감은 관계의 질을 살피는 \u003cb class=\"key\">감시 \u003c/b>\u003cb class=\"key\">기제\u003c/b>로 정의됩니다. 이 시스템은 타인의 반응을 통해 우리의 \u003cb class=\"key\">포함 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에 어떤 변화가 있는지 경보를 보냅니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>전개: 경보 시스템의 작동 방식\u003csmall>전개 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>이 시스템은 평소 \u003cb class=\"key\">무의식적\u003c/b>으로 작동하다가, 관계적 가치가 떨어지면 \u003cb class=\"key\">의식적 \u003c/b>\u003cb class=\"key\">인식\u003c/b>으로 전환됩니다. 이때 우리는 상황을 평가하고 관계를 바로잡기 위해 행동을 \u003cb class=\"key\">수정\u003c/b>할지 고민하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>심화: 진화적 타당성 설명\u003csmall>근거 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>생존과 관계의 밀접한 연결 때문에 우리 몸의 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">자원\u003c/b>은 관계 중심으로 긴밀하게 연결되어 있습니다. 거절을 줄이고 \u003cb class=\"key\">수용\u003c/b>을 높이려는 특정한 기제를 발달시킨 것은 진화적으로 당연한 결과입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론: 사회적 존재로서의 점검\u003csmall>결론 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>관계를 점검하는 것은 \u003cb class=\"key\">인간다움\u003c/b>의 정상적인 과정이며, 우리 모두는 사회적 구조 속 가치를 평가하기 위해 \u003cb class=\"key\">단서\u003c/b>를 찾습니다. 결국 자아존중감은 유대 강화를 위해 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">조정\u003c/b>을 돕는 필수적인 장치입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름은 자아존중감의 정의에서 시작해 실제 작동 방식과 진화적 이유를 거쳐 결론으로 이어집니다.","hl":null},{"n":4,"text":"먼저 도입부에서는 자아존중감이 진화적 관점에서 관계의 질을 살피는 감시 기제라고 정의해요. 우리가 다른 사람들과 잘 지내고 있는지, 포함 상태에 변화는 없는지 알려주는 경보 장치 역할을 한다는 것이죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 이 시스템이 평소에는 무의식적으로 작동하다가, 내 가치가 떨어진다고 느껴질 때 의식적 인식의 영역으로 튀어 올라온다고 설명합니다. 이때 우리는 상황을 객관적으로 평가하고 관계 수정을 고민하게 됩니다.","hl":"f1"},{"n":6,"text":"세 번째로 이런 기제가 왜 생겼는지 근거를 제시해요. 생존을 위해 관계가 너무나 중요했기 때문에, 우리 뇌와 신체의 내부 자원이 관계를 중심으로 고도로 연결되어 발달했다는 점을 강조합니다.","hl":"f2"},{"n":7,"text":"마지막 결론에서는 이러한 지속적인 점검과 탐색 과정이 인간다움의 정상적인 부분이라고 말해요. 결국 자아존중감은 사회적 유대의 문제를 신속하게 파악하고 행동 조정을 돕는 고마운 신호등인 셈입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과 및 기제 설명\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 시작인 1번 문장에서 자아존중감의 정의를 \u003cb class=\"key\">감시 \u003c/b>\u003cb class=\"key\">기제\u003c/b>로 제시하고, 마지막 11번 문장에서 그 기능을 재강조하는 구조입니다. 자아존중감이 왜 생겼는지에 대한 \u003cb class=\"key\">진화적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>과 그것이 실제 어떻게 작동하여 행동을 변화시키는지 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>로 설명하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>From an evolutionary perspective (1)\u003c/b>\u003cspan>관점 제시\u003c/span>\u003cb>until (3)\u003c/b>\u003cspan>전환점 표시\u003c/span>\u003cb>When (4)\u003c/b>\u003cspan>조건 및 시점\u003c/span>\u003cb>It also makes sense that (8)\u003c/b>\u003cspan>추가 논리 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">self-esteem\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">monitoring mechanism\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The system\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The monitoring system\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">interpersonal process\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Self-esteem\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 지문은 자아존중감의 역할과 기능을 설명하는 인과 구조를 띠고 있어요. 첫 문장에서 주제를 던지고 마지막 문장에서 다시 한번 요약해 주는 전형적인 양괄식 구성입니다. 전체적으로 자아존중감이 어떻게 관계 회복이라는 결과로 이어지는지를 논리적으로 풀고 있습니다.","hl":"ty"},{"n":9,"text":"문장 곳곳에 단서가 있어요. 처음에 진화적 관점이라는 표현으로 논의의 틀을 잡고, 중간에 무의식에서 의식으로 넘어가는 지점을 언틸이나 웬 같은 신호어로 보여줍니다. 또한 잇 올소 메이크스 센스라는 표현을 통해 논리를 한 단계 더 확장하고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>evolutionary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진화적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>perspective\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관점, 시각\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-esteem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자아존중감\u003c/span>\u003c/div>\u003cdiv>\u003cb>mechanism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기제, 장치\u003c/span>\u003c/div>\u003cdiv>\u003cb>monitoring\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감시, 점검\u003c/span>\u003c/div>\u003cdiv>\u003cb>reaction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>alarm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경보\u003c/span>\u003c/div>\u003cdiv>\u003cb>alert\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경계시키다, 알리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inclusion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포함\u003c/span>\u003c/div>\u003cdiv>\u003cb>status\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상태, 지위\u003c/span>\u003c/div>\u003cdiv>\u003cb>nonconsciously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>무의식적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>detect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>탐지하다, 찾아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>relational\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관계적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>conscious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의식적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>awareness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인식, 지각\u003c/span>\u003c/div>\u003cdiv>\u003cb>evaluate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>평가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>adjust\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조정하다, 적응하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fix\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바로잡다, 수리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>survival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생존\u003c/span>\u003c/div>\u003cdiv>\u003cb>mobilize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동원하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>internal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>내부의\u003c/span>\u003c/div>\u003cdiv>\u003cb>resource\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원\u003c/span>\u003c/div>\u003cdiv>\u003cb>minimize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>최소화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rejection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거절, 배척\u003c/span>\u003c/div>\u003cdiv>\u003cb>enhance\u003c/b>\u003cem>동사\u003c/em>\u003cspan>향상시키다, 높이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>acceptance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수용, 받아들임\u003c/span>\u003c/div>\u003cdiv>\u003cb>scanning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>점검, 훑어보기\u003c/span>\u003c/div>\u003cdiv>\u003cb>interpersonal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대인관계의\u003c/span>\u003c/div>\u003cdiv>\u003cb>cue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단서, 신호\u003c/span>\u003c/div>\u003cdiv>\u003cb>social bond\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회적 유대\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 모니터링 메커니즘이라는 단어는 이 글의 핵심 키워드이니 꼭 기억하세요. 인클루전은 포함이라는 뜻인데, 반대말인 리젝션 즉 거절과 함께 이해하면 좋습니다. 어드저스트는 관계를 바로잡기 위해 행동을 바꾸는 것을 의미하죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">monitor\u003c/b>\u003cspan class=\"m\">감시하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">watch\u003c/span>\u003cspan class=\"s\">observe\u003c/span>\u003cspan class=\"s\">track\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class 동태입니다. 주어가 타인에 의해 무언가를 받고 있는 중이라는 의미를 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 내 행동을 조정할 필요가 있는가\u003c/span>\u003cspan class=\"en\">Do I need to adjust my behaviors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관계를 바로잡기 위해’\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fix\u003c/span> the relationship?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 관계를 바로잡기 위해 내 행동을 조정할 필요가 있는가?’\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 위협을 해결하기 위해 자신의 행동을 \u003cb class=\"key\">수정\u003c/b>하려는 의지이며, 이를 통해 관계를 \u003cb class=\"key\">회복\u003c/b>하려는 시도입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형 : \"바로잡기 위해\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Do I need to adjust my behaviors, 나는 내 행동을 조정할 필요가 있는가. to fix the relationship?, 관계를 바로잡기 위해’. 이 문장 전체를 해석하면, 나는 관계를 바로잡기 위해 내 행동을 조정할 필요가 있는가?’","hl":"m"},{"n":28,"text":"문제를 인지했다면 이제 해결책을 찾을 차례입니다. 관계 회복을 위해 스스로를 수정하려는 노력이 자존감 메커니즘의 핵심 기능입니다.","hl":"mn"},{"n":29,"text":"to fix는 to부정사의 부사적 용법 중 목적을 나타냅니다. 왜 행동을 조정해야 하는지 그 이유인 목적을 설명해 주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생존을 위한 그러한 높은 가치와 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">high \u003c/span>\u003cspan class=\"tgt\">value \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">survival \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관계와 밀접하게 연결된,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">closely \u003c/span>\u003cspan class=\"tgt\">tied\u003c/span> with relationships,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~는 것은 타당하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">sense \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 관계를 중심으로 내부 자원을 동원하는 방식이\u003c/span>\u003cspan class=\"en\">the way we mobilize our internal resources around relationships\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 뇌와 신체 내에서 고도로 연결되어있다는\u003c/span>\u003cspan class=\"en\">would be highly networked in our brain and body.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">관계와 밀접하게 연결된 생존을 위한 그러한 높은 가치와 함께, 우리가 관계를 중심으로 내부 자원을 동원하는 방식이 우리의 뇌와 신체 내에서 고도로 연결되어있다는 것은 타당하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 관계가 생존에 직결되기 때문에, 인간의 뇌와 신체는 관계 유지를 위해 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">자원\u003c/b>을 효율적으로 사용하도록 \u003cb class=\"key\">고도로 \u003c/b>\u003cb class=\"key\">연결\u003c/b>된 시스템을 갖추게 되었습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">with + 목적어 + 분사 (부대상황)\u003c/span> : with + [목적어] + [p.p.(과거분사)] : \"생존을 위한 높은 가치가 밀접하게 연결된 채로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가주어 it - 진주어 that절\u003c/span> : it (가주어) + makes sense + that (진주어 접속사) + 절 : \"~라는 사실은 타당하다(말이 된다)\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"With such a high value for survival, 생존을 위한 그러한 높은 가치와 함께. closely tied with relationships, 관계와 밀접하게 연결된. it makes sense that, ~는 것은 타당하다. the way we mobilize our internal resources around relationships, 우리가 관계를 중심으로 내부 자원을 동원하는 방식이. would be highly networked in our brain and body, 우리의 뇌와 신체 내에서 고도로 연결되어있다는. 이 문장 전체를 해석하면, 관계와 밀접하게 연결된 생존을 위한 그러한 높은 가치와 함께, 우리가 관계를 중심으로 내부 자원을 동원하는 방식이 우리의 뇌와 신체 내에서 고도로 연결되어있다는 것은 타당하다.","hl":"m"},{"n":31,"text":"인간에게 관계는 생존 그 자체입니다. 그래서 우리 몸의 시스템이 관계를 잘 관리하려고 내부 자원을 끌어다 쓰는데, 이 방식이 뇌와 신체에 아주 깊숙이 고도로 연결되어 있다는 설명입니다.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 with 분사구문입니다. 가치가 관계에 연결되어 있는 수동의 상태라 과거분사 tied를 썼어요. 두 번째는 it이 가주어, that절이 진주어인 구문입니다. 문장이 길어지는 것을 막기 위해 it을 쓰고 진짜 주어인 접속사 that 이하를 뒤로 뺐습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 ~라는 점은 타당하다\u003c/span>\u003cspan class=\"en\">It also makes sense that\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 특정한 기제들을 발달시켰다는 점\u003c/span>\u003cspan class=\"en\">we would develop specific mechanisms\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거절을 최소화하는 것에 주의를 기울이기 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">attend \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">minimizing \u003c/span>\u003cspan class=\"tgt\">rejection \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 수용을 높이는 것에 (주의를 기울이기 위한)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">enhancing \u003c/span>\u003cspan class=\"tgt\">acceptance\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 거절을 최소화하고 수용을 높이는 것에 주의를 기울이기 위한 특정한 기제들을 발달시켰다는 점 또한 타당하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 진화 과정에서 거절당할 위험을 줄이고 공동체에 받아들여질 확률을 높이는 \u003cb class=\"key\">특정한 \u003c/b>\u003cb class=\"key\">기제\u003c/b>들을 발달시킨 것은 지극히 \u003cb class=\"key\">합리적인\u003c/b> 결과입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법 및 동명사 목적어\u003c/span> : [mechanisms (명사)] + [to attend to (to부정사)] + [minimizing (동명사)] : \"거절을 최소화하는 것에 주의를 기울이기 위한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 병렬 구조\u003c/span> : minimizing [A] + and + enhancing [B] : \"거절을 최소화하는 것과 수용을 높이는 것\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It also makes sense that, 또한 ~라는 점은 타당하다. we would develop specific mechanisms, 우리가 특정한 기제들을 발달시켰다는 점. to attend to minimizing rejection, 거절을 최소화하는 것에 주의를 기울이기 위한. and enhancing acceptance, 그리고 수용을 높이는 것에 (주의를 기울이기 위한). 이 문장 전체를 해석하면, 우리가 거절을 최소화하고 수용을 높이는 것에 주의를 기울이기 위한 특정한 기제들을 발달시켰다는 점 또한 타당하다.","hl":"m"},{"n":34,"text":"거절을 피하고 수용되는 것이 생존에 유리했겠죠. 그래서 인류는 이런 상태를 관리하는 특정한 기제를 발달시켜 왔다는 것이 합리적이라는 뜻입니다.","hl":"mn"},{"n":35,"text":"중요한 어법이 두 가지 보입니다. 우선 specific mechanisms를 꾸며주는 to attend는 형용사적 용법이에요. 여기서 attend to의 to는 전치사라서 뒤에 동명사 minimizing이 와야 합니다. 그리고 and를 사이에 두고 minimizing과 enhancing이 동명사 병렬 구조를 이루고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지속적인 점검은 정상적이며,\u003c/span>\u003cspan class=\"en\">The continuous scanning is normal,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간다움의 한 부분이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">human\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지속적인 점검은 정상적이며, 인간다움의 한 부분이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 타인의 반응을 계속 살피는 행위는 이상한 것이 아니라, 인간이라면 누구나 가진 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">본능\u003c/b>이자 \u003cb class=\"key\">보편적인\u003c/b> 특징입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 보충 설명\u003c/span> : [앞 문장 내용] + , + [명사구] : \"인간이라는 것의 한 부분\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 관용 표현\u003c/span> : being + [형용사/명사] : \"인간인 것(인간다움)\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The continuous scanning is normal, 지속적인 점검은 정상적이며. a part of being human, 인간다움의 한 부분이다.. 이 문장 전체를 해석하면, 지속적인 점검은 정상적이며, 인간다움의 한 부분이다.","hl":"m"},{"n":37,"text":"남의 눈치를 보는 게 나쁜 게 아니에요. 우리가 살아남기 위해 끊임없이 주변을 살피는 건 아주 정상적인 생존 전략이고 인간 본성의 일부라는 겁니다.","hl":"mn"},{"n":38,"text":"콤마 뒤에 나온 a part는 앞의 전체적인 상황을 다시 설명해 주는 동격 표현으로 이해하면 됩니다. of 뒤에 쓰인 being human은 인간인 것, 즉 인간다움을 뜻하는 동명사 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 모두는 가지고 있다\u003c/span>\u003cspan class=\"en\">We all have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단서를 찾는 대인관계적 과정을\u003c/span>\u003cspan class=\"en\">an interpersonal process of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">searching \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">cues\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경에서\u003c/span>\u003cspan class=\"en\">from the environment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적 구조 내에서 우리의 가치를 평가하기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">assess\u003c/span> our value in the social structure.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 모두는 사회적 구조 내에서 우리의 가치를 평가하기 위해 환경에서 단서를 찾는 대인관계적 과정을 가지고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간은 누구나 본능적으로 주변 \u003cb class=\"key\">환경\u003c/b>으로부터 타인의 반응과 같은 \u003cb class=\"key\">단서\u003c/b>를 찾아내려 합니다. 이는 집단 내에서 자신의 \u003cb class=\"key\">가치\u003c/b>가 어느 정도인지 끊임없이 파악하려는 생존 전략입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 후치수식\u003c/span> : process [명사] + [searching for (현재분사구)] : \"단서를 찾는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : searching for cues [동사적 의미] + [to assess (to부정사구)] : \"평가하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"We all have, 우리 모두는 가지고 있다. an interpersonal process of searching for cues, 단서를 찾는 대인관계적 과정을. from the environment, 환경에서. to assess our value in the social structure, 사회적 구조 내에서 우리의 가치를 평가하기 위해.. 이 문장 전체를 해석하면, 우리 모두는 사회적 구조 내에서 우리의 가치를 평가하기 위해 환경에서 단서를 찾는 대인관계적 과정을 가지고 있다.","hl":"m"},{"n":40,"text":"우리 인간은 사회적 동물이라서 주변 환경에서 내가 잘 지내고 있는지 확인하고 싶어 해요. 그래서 끊임없이 타인의 반응 같은 단서를 찾아서 내 가치를 평가하려는 본능적인 과정이 있다는 뜻입니다.","hl":"mn"},{"n":41,"text":"여기서 searching은 process를 꾸며주는 현재분사로 쓰였어요. 명사를 뒤에서 능동적으로 수식하고 있죠. 그리고 문장 끝에 나오는 to assess는 왜 단서를 찾는지 그 목적을 설명해 주는 부사적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자아존중감은 작용하며\u003c/span>\u003cspan class=\"en\">Self-esteem works\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감시 기제로써\u003c/span>\u003cspan class=\"en\">as a monitoring mechanism\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들의 사회적 유대에 문제가 있을지도 모른다고 신호를 보내는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">signals\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> problems in people's social bonds,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 그들의 행동을 조정하게 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">allowing \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">adjust\u003c/span> their behavior\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관계를 향상시키기 위해.\u003c/span>\u003cspan class=\"en\">to enhance relationships.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자아존중감은 사람들의 사회적 유대에 문제가 있을지도 모른다고 신호를 보내는 감시 기제로써 작용하며, 이는 그들이 관계를 향상시키기 위해 그들의 행동을 조정하게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자아존중감은 단순히 기분이 좋은 상태가 아니라, \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">유대\u003c/b>의 위험을 알리는 \u003cb class=\"key\">경보 \u003c/b>\u003cb class=\"key\">장치\u003c/b>와 같습니다. 이 신호를 통해 우리는 타인과의 관계를 개선하기 위해 자신의 \u003cb class=\"key\">행동을 \u003c/b>\u003cb class=\"key\">수정\u003c/b>하게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : mechanism [선행사] + [that (주관대)] + signals [동사] : \"신호를 보내는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that (목적어절)\u003c/span> : signals [타동사] + [that (접속사)] + there might be [완전한 절] : \"~가 있을지도 모른다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문과 5형식 구조\u003c/span> : [V-ing (분사구문)] + them [목적어] + [to adjust (목적격 보어)] : \"그들이 조정하게 하면서\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Self-esteem works, 자아존중감은 작용하며. as a monitoring mechanism, 감시 기제로써. that signals that there might be problems in people's social bonds, 사람들의 사회적 유대에 문제가 있을지도 모른다고 신호를 보내는. allowing them to adjust their behavior, 그들이 그들의 행동을 조정하게 한다. to enhance relationships, 관계를 향상시키기 위해.. 이 문장 전체를 해석하면, 자아존중감은 사람들의 사회적 유대에 문제가 있을지도 모른다고 신호를 보내는 감시 기제로써 작용하며, 이는 그들이 관계를 향상시키기 위해 그들의 행동을 조정하게 한다.","hl":"m"},{"n":43,"text":"자존감은 내 인간관계에 빨간불이 켜졌는지 알려주는 모니터링 시스템이에요. 유대에 문제가 생겼다는 신호를 받으면, 우리는 다시 관계를 좋게 만들기 위해 행동을 고치게 되는 거랍니다.","hl":"mn"},{"n":44,"text":"첫 번째 that은 주격 관계대명사로 기제를 꾸며주고, 두 번째 that은 신호의 내용을 알려주는 접속사예요. 그리고 콤마 뒤의 allowing은 분사구문인데, allow 뒤에 목적어와 목적격 보어로 to부정사를 쓴다는 점이 시험에 아주 잘 나옵니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>자아존중감은 관계의 질을 감시하기 위해 \u003cb class=\"key\">진화\u003c/b> 과정에서 발달한 핵심 도구이다.\u003c/li>\u003cli>관계적 가치가 떨어지면 \u003cb class=\"key\">경보\u003c/b>가 울려 상황을 의식적으로 인지하고 평가하게 된다.\u003c/li>\u003cli>인간은 거절을 최소화하고 \u003cb class=\"key\">수용\u003c/b>을 높이기 위해 특정한 내부 기제를 발달시켰다.\u003c/li>\u003cli>사회적 유대 강화를 위해 스스로의 가치를 평가하고 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">조정\u003c/b>을 하는 것은 인간의 정상적인 과정이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Self-esteem functions as a socio-metric indicator that alerts us to shifts in our relational value and prompts behavioral changes to maintain social bonds.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">자아존중감은 타인과의 관계에서 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">포함 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 감시하고, 관계적 가치가 낮아질 때 경고 신호를 보내어 행동을 \u003cb class=\"key\">조정\u003c/b>하게 하는 진화적 기제이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 우리는 자아존중감이 단순한 자신감이 아니라 사회적 생존을 위한 정교한 경보 시스템이라는 점을 배웠습니다. 관계의 위협을 감지하고 행동을 수정하게 만드는 이 기제 덕분에 인간은 사회적 동물로 살아가고 있는 것이죠. 오늘 배운 감시와 조정의 메커니즘을 복습하며 글의 구조를 다시 한번 정리해 보세요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
