div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01에너지 생성 이해</div><ul><li>운동 수행을 이해하려면 몸이 공기와 음식으로 에너지를 만드는 방식을 알아야 한다.</li><li>에너지원은 공기(air)와 음식(food)</li><li>호흡(breathing)은 운동 능력(athletic performance)에 영향을 줌</li><li>핵심 키워드: 에너지 생성(energy production)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02두 가지 호흡 방식</div><ul><li>몸은 산소를 사용하는 방식과 산소 없이 에너지를 만드는 방식으로 나뉜다.</li><li>산소 사용: 유산소 호흡(aerobic respiration)</li><li>산소 없음: 무산소 호흡(anaerobic respiration)</li><li>핵심 키워드: 산소(oxygen)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03무산소 에너지의 특징</div><ul><li>무산소 에너지는 빠르게 얻을 수 있지만 비효율적이고 몸에 부담을 줄 수 있다.</li><li>포도당(glucose)만으로 에너지 생성</li><li>산소가 부족할 때 사용하는 예비 시스템(backup system)</li><li>과도한 젖산(lactic acid)을 만들어 독성(toxic)을 일으킬 수 있음</li><li>핵심 키워드: 무산소 에너지(anaerobic energy)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04운동 초반의 고통</div><ul><li>강한 운동을 시작하면 산소 공급이 따라오지 못해 무산소 과부하가 나타난다.</li><li>증상: 메스꺼움(sickness), 근육 약화(muscle weakness), 땀(sweating)</li><li>폐(lungs)와 호흡계(respiratory system)가 산소 요구량을 즉시 충족하지 못함</li><li>운동 초반이 힘든 이유를 설명함</li><li>핵심 키워드: 무산소 과부하(anaerobic overload)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05준비운동 후 변화</div><ul><li>몸이 충분히 데워지면 산소 공급이 원활해져 유산소 호흡으로 전환된다.</li><li>준비운동 후 운동이 더 쉽게 느껴짐</li><li>몸이 무산소 호흡에서 유산소 호흡으로 전환됨</li><li>산소 공급이 안정되면서 에너지 생성이 효율적이 됨</li><li>핵심 키워드: 전환(switch)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">affect</td><td class=\"m\">영향을 미치다, 작용하다</td></tr><tr><td class=\"w\">athletic</td><td class=\"m\">운동의, 운동선수다운, 체육의</td></tr><tr><td class=\"w\">performance</td><td class=\"m\">수행, 성과, 경기력, 공연</td></tr><tr><td class=\"w\">be known as</td><td class=\"m\">~로 알려져 있다, ~라고 불리다</td></tr><tr><td class=\"w\">aerobic</td><td class=\"m\">산소를 이용하는, 유산소의</td></tr><tr><td class=\"w\">respiration</td><td class=\"m\">호흡, 호흡 작용</td></tr><tr><td class=\"w\">anaerobic</td><td class=\"m\">산소 없이 일어나는, 무산소의</td></tr><tr><td class=\"w\">generate</td><td class=\"m\">발생시키다, 만들어 내다</td></tr><tr><td class=\"w\">glucose</td><td class=\"m\">포도당, 단당류의 일종</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">access</td><td class=\"m\">접근하다, 이용하다, 도달하다</td></tr><tr><td class=\"w\">backup</td><td class=\"m\">예비, 보조, 지원</td></tr><tr><td class=\"w\">have enough</td><td class=\"m\">충분히 가지고 있다, 충분하다</td></tr><tr><td class=\"w\">inefficient</td><td class=\"m\">비효율적인, 낭비가 많은</td></tr><tr><td class=\"w\">toxic</td><td class=\"m\">독성의, 해로운</td></tr><tr><td class=\"w\">push it too hard</td><td class=\"m\">무리하다, 지나치게 몰아붙이다</td></tr><tr><td class=\"w\">overload</td><td class=\"m\">과부하, 지나친 부담</td></tr><tr><td class=\"w\">intense</td><td class=\"m\">강렬한, 격렬한, 극심한</td></tr><tr><td class=\"w\">catch up to</td><td class=\"m\">~을 따라잡다, ~에 맞추다, ~에 이르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">호흡이 운동 수행에 어떻게 영향을 미치는지를 이해하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">To understand how breathing affects athletic performance</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 먼저 이해할 필요가 있다</span><span class=\"en\"><b>we first <span class=\"grammar-hl\">need to understand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몸이 에너지를 어떻게 만들어내는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">how the body makes energy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공기와 음식으로부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from air and food</span>.</b></span></div></div><div class=\"lec-sent-ko\">너지를 만들어내는지를 이해할 필요가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 출발점을 제시합니다. 운동할 때 숨을 어떻게 쉬느냐가 중요하다는 말을 바로 설명하기보다, 그 바탕이 되는 ‘몸의 에너지 생산 방식’을 먼저 알아야 한다고 안내합니다. 뒤 문장들은 이 에너지 생산 방식이 두 가지로 나뉜다는 내용을 이어서 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To understand how breathing affects athletic performance (to부정사): To understand가 문장 앞에서 목적을 나타내는 부사적 용법으로 쓰였다. 구조는 to + 동사원형(understand)이며, 뒤에 understand의 목적어로 how절이 이어진다.</div><div class=\"lec-gr-item\">how breathing affects athletic performance (간접의문문): how + S + V 어순이다. 직접의문문처럼 how does breathing affect가 아니라, understand의 목적어 자리에서 how breathing affects athletic performance라는 평서문 어순을 쓴다.</div><div class=\"lec-gr-item\">breathing affects athletic performance (동명사): breathing은 -ing 형태이지만 문장에서 주어 역할을 하는 명사 성분이다. 따라서 현재분사가 아니라 동명사로 보며, affects의 주어가 된다.</div><div class=\"lec-gr-item\">need to understand (to부정사): need 뒤에 to + 동사원형(understand)이 와서 need의 목적어 역할을 한다. 구조는 need + to V이다.</div><div class=\"lec-gr-item\">how the body makes energy from air and food (간접의문문): how + S(the body) + V(makes) 구조로, understand의 목적어 역할을 한다. 의문사 how가 있지만 어순은 평서문 어순이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">affect</td><td class=\"m\">영향을 미치다, 작용하다</td></tr><tr><td class=\"w\">athletic</td><td class=\"m\">운동의, 운동선수다운, 체육의</td></tr><tr><td class=\"w\">performance</td><td class=\"m\">수행, 성과, 경기력, 공연</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">두 가지 옵션이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">There are two options</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">산소를 사용하는 것</span><span class=\"en\"><b>with oxygen,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유산소 호흡이라고 알려진 과정</span><span class=\"en\"><b>a process <span class=\"grammar-hl\">known as aerobic respiration</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 산소 없이 이루어지는 것</span><span class=\"en\"><b>and without it,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무산소 호흡이라고 불리는</span><span class=\"en\"><b><span class=\"grammar-hl\">which is called anaerobic respiration</span>.</b></span></div></div><div class=\"lec-sent-ko\">두 가지 옵션이 있는데, 산소를 사용하는 것은 유산소 호흡이라고 알려진 과정이고, 산소 없이 이루어지는 것은 무산소 호흡이라고 불린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 에너지 생산 방식을 두 갈래로 나누어 설명합니다. 몸은 산소가 충분할 때와 부족할 때 서로 다른 방식으로 에너지를 만들어 냅니다. 이 구분이 이후 글 전체의 핵심 대비가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There are two options 핵심 구조: There are + 복수명사 구조이다. There는 형식상 주어이고, 실제로 존재하는 대상은 two options이다.</div><div class=\"lec-gr-item\">known as aerobic respiration (과거분사(형용사)): known as aerobic respiration이 앞의 a process를 뒤에서 수식한다. 구조상 a process that is known as aerobic respiration처럼 관계절이 축약된 형태로 볼 수 있으며, 여기서는 명사 수식 p.p.이므로 문장 서술부의 수동태가 아니다.</div><div class=\"lec-gr-item\">which is called anaerobic respiration (관계대명사): which가 앞의 without oxygen이라는 선택지를 받아 관계절을 이끈다. 수동태: be동사(is)+p.p.(called) 구조이다. call은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) is called 형태로 쓴다. 기본구조: call + O + C(5형식, O를 C라고 부르다). 5형식 구조에서 목적어가 주어로 올라가 수동태가 되고, 목적격보어 anaerobic respiration은 그대로 남는다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aerobic</td><td class=\"m\">산소를 이용하는, 유산소의</td></tr><tr><td class=\"w\">respiration</td><td class=\"m\">호흡, 호흡 작용</td></tr><tr><td class=\"w\">anaerobic</td><td class=\"m\">산소 없이 일어나는, 무산소의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">무산소 에너지는</span><span class=\"en\"><b>Anaerobic energy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생성된다</span><span class=\"en\"><b><span class=\"grammar-hl\">is generated</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 포도당(단순당)만으로</span><span class=\"en\"><b>only with glucose (a simple sugar),</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 더 빠르고 더 쉽다</span><span class=\"en\"><b>and it's <span class=\"grammar-hl\">quicker and easier</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 몸이 이용하기에</span><span class=\"en\"><b><span class=\"grammar-hl\">for our bodies to access</span>.</b></span></div></div><div class=\"lec-sent-ko\">무산소 에너지는 오직 포도당(단순당)만으로 생성되며, 그것은 우리 몸이 이용하기에 더 빠르고 더 쉽다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 두 방식 중 ‘무산소 호흡’의 특징을 먼저 설명합니다. 운동을 갑자기 세게 시작하면 몸은 당장 쓸 수 있는 빠른 에너지가 필요합니다. 그래서 산소 공급을 기다리기보다 포도당을 이용해 빠르게 에너지를 끌어다 씁니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is generated (수동태): be동사(is)+p.p.(generated) 구조이다. generate는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) is generated 형태로 쓴다. 기본구조: generate + O(목적어).</div><div class=\"lec-gr-item\">for our bodies to access (to부정사): for our bodies가 to access의 의미상 주어이고, to access는 quicker and easier를 보충하는 형용사 보충 구조로 쓰였다. 구조는 for + 의미상 주어 + to V이다.</div><div class=\"lec-gr-item\">quicker and easier 비교급 병렬: quicker와 easier가 and로 연결되어 같은 문장 성분, 즉 보어 역할을 한다. 둘 다 it에 대한 성질을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aerobic</td><td class=\"m\">산소를 이용하는, 유산소의</td></tr><tr><td class=\"w\">anaerobic</td><td class=\"m\">산소 없이 일어나는, 무산소의</td></tr><tr><td class=\"w\">generate</td><td class=\"m\">발생시키다, 만들어 내다</td></tr><tr><td class=\"w\">glucose</td><td class=\"m\">포도당, 단당류의 일종</td></tr><tr><td class=\"w\">access</td><td class=\"m\">접근하다, 이용하다, 도달하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 일종의 예비 시스템이자 터보 부스트이다</span><span class=\"en\"><b><span class=\"grammar-hl\">It's a kind of backup system and turbo boost</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몸에 충분한 산소가 없을 때의</span><span class=\"en\"><b><span class=\"grammar-hl\">when the body doesn't have enough oxygen</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 몸에 충분한 산소가 없을 때의 일종의 예비 시스템이자 터보 부스트이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 내용을 비유로 쉽게 풀어 줍니다. 무산소 호흡은 평소 주력으로 오래 쓰는 방식이라기보다, 산소가 모자라는 급한 상황에서 몸이 즉시 힘을 내도록 돕는 장치처럼 작동합니다. 운동 초반이나 매우 강한 운동 중에 이 방식이 특히 중요해집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It&#39;s a kind of backup system and turbo boost 핵심 구조: It + be동사(is) + 보어(a kind of backup system and turbo boost)의 2형식 구조이다. It은 앞에서 말한 anaerobic energy를 가리키고, 뒤의 명사구가 주격보어이다.</div><div class=\"lec-gr-item\">a kind of (관용표현): a kind of + 명사 구조로, 어떤 대상을 특정 종류나 유형으로 분류할 때 쓰는 표현이다.</div><div class=\"lec-gr-item\">when the body doesn&#39;t have enough oxygen (부사절): when + S + V 구조로 시간/상황을 나타내는 종속절이다. 주절의 backup system and turbo boost가 작동하는 상황을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">backup</td><td class=\"m\">예비, 보조, 지원</td></tr><tr><td class=\"w\">have enough</td><td class=\"m\">충분히 가지고 있다, 충분하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 무산소 에너지는</span><span class=\"en\"><b>But anaerobic energy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비효율적이고 독성을 띨 수도 있다</span><span class=\"en\"><b>is inefficient and <span class=\"grammar-hl\">can be toxic</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 많은 젖산을 만들어 내면서</span><span class=\"en\"><b><span class=\"grammar-hl\">creating too much lactic acid</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 무산소 에너지는 비효율적이고 독성을 띨 수도 있으며, 너무 많은 젖산을 만들어 낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 글의 흐름이 전환됩니다. 앞에서는 무산소 호흡의 빠른 장점을 말했지만, 이제 그 대가를 설명합니다. 무산소 호흡은 급할 때는 유용하지만 오래 지속되면 몸에 부담을 주고, 젖산이 많이 쌓이면 근육 피로와 불편함을 느끼게 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be toxic 조동사 구조: can + 동사원형(be) + 형용사(toxic) 구조이다. be는 연결동사로 쓰여 주어 anaerobic energy와 보어 toxic을 연결한다.</div><div class=\"lec-gr-item\">creating too much lactic acid (분사구문): creating too much lactic acid는 현재분사구가 앞 절 전체를 부사적으로 보충하는 구조이다. 원래 절로 풀면 because it creates too much lactic acid 정도가 되며, it은 anaerobic energy를 가리킨다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aerobic</td><td class=\"m\">산소를 이용하는, 유산소의</td></tr><tr><td class=\"w\">anaerobic</td><td class=\"m\">산소 없이 일어나는, 무산소의</td></tr><tr><td class=\"w\">inefficient</td><td class=\"m\">비효율적인, 낭비가 많은</td></tr><tr><td class=\"w\">toxic</td><td class=\"m\">독성의, 해로운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 경험하는 메스꺼움, 근육 약화, 그리고 땀은</span><span class=\"en\"><b>The sickness, muscle weakness, and <span class=\"grammar-hl\">sweating</span> <span class=\"grammar-hl\">you experience</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신을 지나치게 몰아붙인 뒤</span><span class=\"en\"><b>after you've pushed it too hard</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">헬스장에서</span><span class=\"en\"><b>at the gym</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무산소 과부하라는 느낌이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is the feeling of anaerobic overload</span>.</b></span></div></div><div class=\"lec-sent-ko\">헬스장에서 자신을 지나치게 몰아붙인 뒤 경험하게 되는 메스꺼움, 근육 약화, 그리고 땀은 바로 무산소 과부하라는 느낌이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 무산소 호흡의 부작용을 실제 경험과 연결합니다. 너무 강하게 운동하면 몸이 산소를 충분히 쓰지 못하고 무산소 방식에 많이 의존하게 됩니다. 그 결과 운동 후 속이 불편하거나 힘이 빠지고 땀이 많이 나는 느낌이 나타납니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">you experience 관계대명사(목적격 생략): The sickness, muscle weakness, and sweating 뒤에 목적격 관계대명사 that/which가 생략된 구조이다. 완전한 형태는 The sickness, muscle weakness, and sweating that you experience이며, 관계절 안에서 experience의 목적어 자리가 비어 있다.</div><div class=\"lec-gr-item\">sweating (동명사): sweating은 -ing 형태이지만 The sickness, muscle weakness와 병렬되어 명사 역할을 한다. 따라서 현재분사가 아니라 동명사로 보며, 긴 주어의 일부가 된다.</div><div class=\"lec-gr-item\">after you &#39;ve pushed it too hard at the gym (관용표현): push it too hard는 무리하게 하다라는 뜻의 관용적 동사구이다. 구조상 after + S + have p.p.로, after절 안에서 현재완료 have pushed가 쓰였다.</div><div class=\"lec-gr-item\">is the feeling of anaerobic overload 핵심 구조: be동사(is)+주격보어(the feeling of anaerobic overload)의 2형식 구조이다. 앞의 긴 주어를 뒤의 명사구 보어와 연결한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aerobic</td><td class=\"m\">산소를 이용하는, 유산소의</td></tr><tr><td class=\"w\">anaerobic</td><td class=\"m\">산소 없이 일어나는, 무산소의</td></tr><tr><td class=\"w\">overload</td><td class=\"m\">과부하, 지나친 부담</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 과정은</span><span class=\"en\"><b>This process</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">설명해 준다</span><span class=\"en\"><b><span class=\"grammar-hl\">explains</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜 고강도 운동의 처음 몇 분이</span><span class=\"en\"><b><span class=\"grammar-hl\">why the first few minutes of an intense workout</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흔히 그렇게 힘든지를</span><span class=\"en\"><b><span class=\"grammar-hl\">are often so miserable</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 과정은 왜 고강도 운동의 처음 몇 분이 흔히 그렇게 힘든지를 설명해 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서 설명한 무산소 과부하를 바탕으로, 운동 초반의 고통을 설명합니다. 갑자기 강한 운동을 시작하면 몸은 아직 충분한 산소를 공급받지 못한 상태입니다. 그래서 빠른 에너지원인 무산소 호흡을 쓰게 되고, 그 때문에 초반이 유난히 괴롭고 숨차게 느껴집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">explains why the first few minutes of an intense workout are often so miserable (간접의문문): why + S(the first few minutes of an intense workout) + V(are) 구조이다. explains의 목적어 역할을 하며, 직접의문문 어순이 아니라 평서문 어순을 쓴다.</div><div class=\"lec-gr-item\">are often so miserable 핵심 구조: be동사(are)+형용사 보어(miserable)의 2형식 구조이다. often은 빈도부사로 be동사 뒤, 형용사 앞에 놓여 보어를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intense</td><td class=\"m\">강렬한, 격렬한, 극심한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 폐와 호흡계는</span><span class=\"en\"><b>Our lungs and respiratory system</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아직 따라잡지 못했다</span><span class=\"en\"><b><span class=\"grammar-hl\">haven't caught up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 몸이 필요로 하는 산소를 공급할 만큼</span><span class=\"en\"><b><span class=\"grammar-hl\">to supply the oxygen</span> our bodies need,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 몸은</span><span class=\"en\"><b>and so the body</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무산소 호흡을 사용할 수밖에 없다</span><span class=\"en\"><b><span class=\"grammar-hl\">has to use</span> anaerobic respiration.</b></span></div></div><div class=\"lec-sent-ko\">우리의 폐와 호흡계는 아직 우리 몸이 필요로 하는 산소를 공급할 만큼 따라잡지 못했기 때문에, 몸은 무산소 호흡을 사용할 수밖에 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 원인을 더 구체적으로 밝힙니다. 운동을 시작하면 근육은 즉시 산소를 많이 요구하지만, 폐와 호흡계가 그 요구량에 맞춰 충분히 산소를 보내기까지 시간이 걸립니다. 그 짧은 공백 동안 몸은 임시로 무산소 호흡에 의존합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">haven&#39;t caught up (관용표현): catch up은 따라잡다, 필요한 수준에 도달하다는 뜻의 구동사이다. haven&#39;t caught up은 have not + p.p. 형태의 현재완료 부정 구조이다.</div><div class=\"lec-gr-item\">to supply the oxygen (to부정사): to supply가 목적을 나타내는 부사적 용법으로 쓰였다. 구조는 to + 동사원형(supply)이며, 앞의 haven&#39;t caught up이 어떤 목적을 위한 것인지 보충한다.</div><div class=\"lec-gr-item\">the oxygen our bodies need 관계대명사(목적격 생략): the oxygen 뒤에 목적격 관계대명사 that/which가 생략된 구조이다. 완전한 형태는 the oxygen that our bodies need이며, 관계절 안에서 need의 목적어 자리가 비어 있다.</div><div class=\"lec-gr-item\">has to use (관용표현): have to + 동사원형 구조로, 의무나 필요를 나타내는 준조동사 표현이다. 여기서는 has to + use 형태로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aerobic</td><td class=\"m\">산소를 이용하는, 유산소의</td></tr><tr><td class=\"w\">respiration</td><td class=\"m\">호흡, 호흡 작용</td></tr><tr><td class=\"w\">anaerobic</td><td class=\"m\">산소 없이 일어나는, 무산소의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 또한 설명해 준다</span><span class=\"en\"><b>This also explains</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜</span><span class=\"en\"><b>why</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 몸이 충분히 풀린 뒤에는</span><span class=\"en\"><b>after <span class=\"grammar-hl\">we're warmed up</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">운동이 더 쉽게 느껴지는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">exercise feels easier</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 또한 왜 우리가 몸이 충분히 풀린 뒤에는 운동이 더 쉽게 느껴지는지도 설명해 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이제 글은 운동 초반의 힘듦에서 워밍업 후의 편안함으로 넘어갑니다. 앞에서 설명한 산소 공급 지연 현상이 해결되면, 운동이 덜 고통스럽게 느껴집니다. 워밍업은 몸의 산소 공급 체계를 운동에 맞게 끌어올리는 과정으로 이해할 수 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">why, after we&#39;re warmed up, exercise feels easier (간접의문문): why + S(exercise) + V(feels) 구조가 explains의 목적어 역할을 한다. 중간에 after we&#39;re warmed up이라는 부사절이 삽입되어 있지만, 기본 어순은 why + 주어 + 동사이다.</div><div class=\"lec-gr-item\">we&#39;re warmed up (수동태): we&#39;re는 we are이고, be동사(are)+p.p.(warmed up) 구조이다. warm up은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) are warmed up 형태로 쓴다. 기본구조: warm up + O(목적어) 또는 warm + O + up.</div><div class=\"lec-gr-item\">exercise feels easier 핵심 구조: feel이 연결동사로 쓰인 2형식 구조이다. 주어 exercise 뒤에 동사 feels가 오고, 형용사 비교급 easier가 주격보어로 쓰인다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몸은</span><span class=\"en\"><b>The body</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전환했다</span><span class=\"en\"><b><span class=\"grammar-hl\">has switched</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무산소에서 유산소 호흡으로</span><span class=\"en\"><b>from anaerobic to aerobic respiration.</b></span></div></div><div class=\"lec-sent-ko\">몸이 무산소에서 유산소 호흡으로 전환한 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장은 앞 문장의 이유를 결론처럼 정리합니다. 몸이 충분히 데워지고 호흡계가 산소를 잘 공급하게 되면, 에너지 생산 방식이 무산소 중심에서 유산소 중심으로 바뀝니다. 그래서 운동 초반보다 더 안정적이고 오래 버틸 수 있는 상태가 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has switched (현재완료): has + p.p.(switched) 구조이다. 과거에 일어난 전환이 현재 상태와 관련되어 있음을 나타내는 완료 시제이다.</div><div class=\"lec-gr-item\">switched from anaerobic to aerobic respiration (관용표현): switch from A to B 구조로, A에서 B로 전환하다는 의미의 동사 패턴이다. from anaerobic과 to aerobic respiration이 전환의 출발점과 도착점을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aerobic</td><td class=\"m\">산소를 이용하는, 유산소의</td></tr><tr><td class=\"w\">respiration</td><td class=\"m\">호흡, 호흡 작용</td></tr><tr><td class=\"w\">anaerobic</td><td class=\"m\">산소 없이 일어나는, 무산소의</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>몸은 공기와 음식으로 에너지를 만들며, 그 방식은 유산소 호흡과 무산소 호흡으로 나뉜다.</li><li>무산소 호흡은 산소가 부족할 때 빠르게 에너지를 내지만, 비효율적이고 젖산을 많이 만들어 몸에 부담을 준다.</li><li>강한 운동을 시작한 직후에는 폐와 호흡계가 산소 요구량을 따라가지 못해 무산소 호흡에 의존한다.</li><li>워밍업이 되면 몸이 유산소 호흡으로 전환되어 운동이 더 쉽게 느껴진다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">The body first relies on inefficient anaerobic respiration when oxygen is limited, but it shifts to aerobic respiration as breathing catches up.</div>\n              <div class=\"lec-final-sum-ko\">몸은 산소가 부족할 때 먼저 비효율적인 무산소 호흡에 의존하지만, 호흡이 따라잡으면 유산소 호흡으로 전환된다.</div></div></div>"],"segs":[[{"audio":"./29_audio/1.mp3","hl":null}],[{"audio":"./29_audio/2.mp3","hl":null}],[{"audio":"./29_audio/3.mp3","hl":null},{"audio":"./29_audio/4.mp3","hl":"stage-0"},{"audio":"./29_audio/5
