ku)는 조합론(Combinatorics)과 논리 추론(Logical reasoning)이 드러나는 대표적인 퍼즐로, 숫자 1~9는 계산 대상이 아니라 서로 구별되는 기호(Symbol)의 역할을 합니다. 즉, 스도쿠에서 중요한 것은 “5가 3보다 크다” 같은 수의 의미가 아니라, 같은 기호가 한 줄이나 한 구역에 반복되지 않도록 배치하는 구조입니다. 이는 마치 좌석 배치에서 같은 팀원이 겹치지 않게 자리를 정하는 것처럼, 제한 조건(Constraints)을 만족시키는 패턴을 찾는 과정이라고 볼 수 있습니다. 따라서 수학을 단순한 산수(Arithmetic)가 아니라 논리와 패턴을 다루는 사고방식으로 이해하면, 지문의 핵심을 훨씬 자연스럽게 받아들일 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01수학의 본질</div><ul><li>수학의 핵심 관심사는 숫자 자체가 아니라 패턴, 구조, 대칭, 연결이다.</li><li>숫자(numbers)보다 패턴(patterns)이 중요함</li><li>구조(structures), 대칭(symmetries), 연결(connections)이 수학의 중심</li><li>핵심 키워드: 패턴(patterns)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02스도쿠의 규칙</div><ul><li>스도쿠는 주어진 단서를 바탕으로 9×9 격자를 완성하는 퍼즐이다.</li><li>각 행(row), 열(column), 3×3 블록(block)에 1~9가 한 번씩 들어가야 함</li><li>몇 개의 주어진 숫자(clues)에서 시작함</li><li>핵심 키워드: 스도쿠(Sudoku)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03숫자의 비본질성</div><ul><li>스도쿠에서 중요한 것은 숫자의 값이 아니라 서로 구별되는 아홉 개의 기호이다.</li><li>숫자 1~9의 실제 값(numerical values)은 중요하지 않음</li><li>아홉 개의 문자(letters)나 모양(shapes)으로도 가능함</li><li>핵심 키워드: 구별되는 기호(distinct symbols)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04수학에 대한 오해</div><ul><li>사람들은 수학이라는 말에 부담을 느끼지만, 스도쿠를 푸는 논리적 사고도 수학이다.</li><li>신문은 “수학이 아니라 추론과 논리(reasoning and logic)”라고 홍보함</li><li>이는 수학이 사람들을 겁먹게 한다는 인식을 보여 줌</li><li>핵심 키워드: 논리(logic)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05결론</div><ul><li>스도쿠를 할 수 있다면 이미 수학적 사고를 하고 있는 것이다.</li><li>수학은 단순 계산이 아니라 패턴을 파악하는 활동임</li><li>스도쿠 능력은 수학적 능력(mathematical ability)의 한 예임</li><li>핵심 키워드: 수학적 사고(mathematical thinking)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pattern</td><td class=\"m\">패턴, 양식, 규칙성</td></tr><tr><td class=\"w\">structure</td><td class=\"m\">구조, 구성, 체계</td></tr><tr><td class=\"w\">symmetry</td><td class=\"m\">대칭, 균형</td></tr><tr><td class=\"w\">connection</td><td class=\"m\">연결, 관련성, 관계</td></tr><tr><td class=\"w\">take for example</td><td class=\"m\">~을 예로 들다, ~을 예시로 삼다</td></tr><tr><td class=\"w\">objective</td><td class=\"m\">목적, 목표</td></tr><tr><td class=\"w\">start from</td><td class=\"m\">~에서 시작하다, ~을 출발점으로 삼다</td></tr><tr><td class=\"w\">ensure</td><td class=\"m\">보장하다, 확실하게 하다</td></tr><tr><td class=\"w\">once and only once</td><td class=\"m\">단 한 번만, 정확히 한 번</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">numerical</td><td class=\"m\">숫자의, 수치상의</td></tr><tr><td class=\"w\">irrelevant</td><td class=\"m\">관련 없는, 무관한, 중요하지 않은</td></tr><tr><td class=\"w\">distinct</td><td class=\"m\">뚜렷한, 별개의, 구별되는</td></tr><tr><td class=\"w\">matter</td><td class=\"m\">중요하다, 문제가 되다</td></tr><tr><td class=\"w\">be involved</td><td class=\"m\">관련되다, 포함되다, 관여하다</td></tr><tr><td class=\"w\">reasoning</td><td class=\"m\">추론, 추리, 논리적 사고</td></tr><tr><td class=\"w\">logic</td><td class=\"m\">논리, 논리학, 타당한 추론</td></tr><tr><td class=\"w\">spoil</td><td class=\"m\">망치다, 손상시키다, 버릇없게 만들다</td></tr><tr><td class=\"w\">scare off</td><td class=\"m\">겁주어 쫓아내다, 겁먹게 하여 멀어지게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수학의 주요 관심사는</span><span class=\"en\"><b>The central concerns of mathematics</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">숫자가 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">are not numbers,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">패턴, 구조, 대칭 그리고 연결이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">but patterns, structures, symmetries and connections</span>.</b></span></div></div><div class=\"lec-sent-ko\">수학의 주요 관심사는 숫자가 아니라, 패턴, 구조, 대칭 그리고 연결이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 문장은 글 전체의 주장을 바로 제시합니다. 사람들은 흔히 수학을 숫자 계산으로 떠올리지만, 글쓴이는 수학의 중심이 사물들 사이에 숨어 있는 규칙과 관계를 찾아내는 데 있다고 말합니다. 뒤에 나오는 스도쿠 예시는 이 주장을 설명하기 위한 구체적인 사례로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are not numbers, but patterns, structures, symmetries and connections 상관 표현: not A but B 구조로, 보어 자리에서 A(numbers)를 부정하고 B(patterns, structures, symmetries and connections)를 대조적으로 제시한다. 주어는 The central concerns of mathematics, 동사는 are이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pattern</td><td class=\"m\">패턴, 양식, 규칙성</td></tr><tr><td class=\"w\">structure</td><td class=\"m\">구조, 구성, 체계</td></tr><tr><td class=\"w\">connection</td><td class=\"m\">연결, 관련성, 관계</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예로 들어보자</span><span class=\"en\"><b><span class=\"grammar-hl\">Take, for example</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일 실리는 스도쿠 퍼즐을</span><span class=\"en\"><b>the Sudoku puzzles <span class=\"grammar-hl\">that appear daily</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신문에.</span><span class=\"en\"><b><span class=\"grammar-hl\">in newspapers</span>.</b></span></div></div><div class=\"lec-sent-ko\">신문에 매일 실리는 스도쿠 퍼즐을 예로 들어보자.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 추상적인 주장을 독자가 쉽게 이해하도록, 글쓴이는 익숙한 퍼즐인 스도쿠를 끌어옵니다. 신문 스도쿠는 많은 사람이 숫자 놀이로 여기지만, 글쓴이는 이를 통해 수학의 본질이 계산보다 논리적 배열에 있음을 보여 주려 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Take, for example (관용표현): take A for example의 변형으로, 명령문 형태에서 예시를 제시할 때 쓰는 구조이다. 주어 you가 생략되고 동사원형 Take가 문두에 온다.</div><div class=\"lec-gr-item\">that appear daily in newspapers (관계대명사): that이 선행사 the Sudoku puzzles를 수식하는 관계대명사절을 이끈다. that은 절 안에서 주어 역할을 하며, 동사는 appear이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 목표는</span><span class=\"en\"><b>The objective</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">9×9 격자를 완성하는 것이다</span><span class=\"en\"><b>is <span class=\"grammar-hl\">to complete a 9 × 9 grid</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 개의 주어진 숫자나 단서로부터 시작하여</span><span class=\"en\"><b><span class=\"grammar-hl\">starting from a few given numbers or clues</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">확실하게 하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">while ensuring</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">각 행, 각 열, 그리고 각 3×3 블록이</span><span class=\"en\"><b><span class=\"grammar-hl\">that each row, each column and each 3 × 3 block</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1부터 9까지의 모든 숫자를 포함하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">contains all the digits from 1 to 9</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 번씩 그리고 오직 한 번만.</span><span class=\"en\"><b><span class=\"grammar-hl\">once and only once</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 목표는 각 행, 각 열, 그리고 각 3×3 블록이 1부터 9까지의 모든 숫자를 한 번씩 그리고 오직 한 번만 포함하는 것을 확실하게 하면서, 몇 개의 주어진 숫자나 단서로부터 시작하여 9×9 격자를 완성하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 스도쿠의 기본 규칙을 설명하며 앞 문장의 예시를 구체화합니다. 스도쿠에서는 각 위치에 들어갈 기호가 주변 칸들과 어떤 관계를 맺는지가 중요합니다. 그래서 독자는 계산을 하는 것이 아니라, 이미 주어진 단서들을 바탕으로 가능한 배치를 좁혀 가게 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to complete a 9 × 9 grid (to부정사): to + 동사원형 complete 구조로, be동사 is 뒤에서 주격보어 역할을 한다. 주어 The objective의 내용을 설명하는 명사적 용법이다.</div><div class=\"lec-gr-item\">starting from a few given numbers or clues (분사구문(현재분사)): starting from은 부사적 기능의 -ing 구문으로, to complete a 9 × 9 grid에 부가 정보를 덧붙인다. 원래 절로 바꾸면 when you start from a few given numbers or clues 정도의 구조가 된다.</div><div class=\"lec-gr-item\">given numbers or clues (과거분사(형용사)): given이 numbers or clues를 앞에서 수식한다. p.p. + N 구조로, numbers or clues that are given처럼 관계절이 축약된 형태로 볼 수 있다.</div><div class=\"lec-gr-item\">while ensuring that each row, each column and each 3 × 3 block contains all the digits from 1 to 9 once and only once (분사구문(현재분사)): while ensuring은 while + -ing 형태의 축약 부사절로, 주절의 행위와 동시에 이루어지는 조건/과정을 나타낸다. 원래 절은 while you ensure that each row, each column and each 3 × 3 block contains all the digits from 1 to 9 once and only once이다.</div><div class=\"lec-gr-item\">that each row, each column and each 3 × 3 block contains all the digits from 1 to 9 once and only once (명사절): that절이 동사 ensuring의 목적어 역할을 한다. that절 내부의 주어는 each row, each column and each 3 × 3 block이고, 동사는 contains이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">objective</td><td class=\"m\">목적, 목표</td></tr><tr><td class=\"w\">once and only once</td><td class=\"m\">단 한 번만, 정확히 한 번</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 숫자의 수치적인 값은</span><span class=\"en\"><b>But the numerical values of the digits</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">관련이 없다;</span><span class=\"en\"><b>are irrelevant;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요한 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">what is important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아홉 개의 별개의 기호가 있다는 것이다.</span><span class=\"en\"><b>is <span class=\"grammar-hl\">that there are nine distinct symbols</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 숫자의 수치적인 값은 관련이 없다. 중요한 것은 아홉 개의 별개의 기호가 있다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞에서 설명한 스도쿠 규칙의 핵심을 다시 해석합니다. 스도쿠에 1부터 9까지의 숫자가 나오지만, 실제로는 더하기나 곱하기 같은 계산을 하지 않습니다. 글쓴이는 여기서 스도쿠가 숫자 계산 문제가 아니라, 서로 다른 아홉 기호를 정해진 규칙에 맞게 배열하는 문제임을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what is important (관계대명사): what은 선행사를 포함한 관계대명사로, the thing that is important와 같은 구조이다. 이 명사절 전체가 뒤 절에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">that there are nine distinct symbols (명사절): that절이 be동사 is 뒤에서 주격보어 역할을 하며, what is important의 구체적 내용을 설명한다. that절 내부는 there are + 복수명사 구조이다.</div><div class=\"lec-gr-item\">there are nine distinct symbols 존재 구문: there + be동사 구조로, 주어처럼 보이는 there는 형식적 요소이고 실제 의미상 중심 명사는 nine distinct symbols이다. 복수명사에 맞추어 be동사 are가 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">numerical</td><td class=\"m\">숫자의, 수치상의</td></tr><tr><td class=\"w\">irrelevant</td><td class=\"m\">관련 없는, 무관한, 중요하지 않은</td></tr><tr><td class=\"w\">distinct</td><td class=\"m\">뚜렷한, 별개의, 구별되는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 아홉 개의 글자 또는 아홉 개의 모양일 수도 있다.</span><span class=\"en\"><b>They <span class=\"grammar-hl\">could be nine letters or nine shapes</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 아홉 개의 글자 또는 아홉 개의 모양일 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ff n></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘수학과 관련이 없습니다</span><span class=\"en\"><b>‘<span class=\"grammar-hl\">There's no maths involved</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 추론과 논리를 사용하세요!’</span><span class=\"en\"><b>simply <span class=\"grammar-hl\">use reasoning and logic</span>!’</b></span></div></div><div class=\"lec-sent-ko\">한 아일랜드 일간지는 ‘수학과 관련이 없습니다. 단지 추론과 논리를 사용하세요!’라는 말과 함께 이러한 퍼즐을 게재했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 사람들의 수학에 대한 인식을 보여 주는 사례입니다. 신문은 독자들이 ‘수학’이라는 말을 보면 부담을 느낄까 봐, 스도쿠를 수학과 분리된 활동처럼 홍보합니다. 그런데 추론과 논리는 수학의 핵심적인 사고방식이므로, 글쓴이는 이 문구 속에 담긴 모순을 드러내고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">with the statement (전치사구): with + 명사구 구조로, 동사 publishes에 부가되어 이 퍼즐들이 어떤 문구와 함께 실린다는 정보를 덧붙인다.</div><div class=\"lec-gr-item\">There&#39;s no maths involved 존재 구문: There is + 명사구 구조이며, 축약형 There&#39;s는 There is이다. no maths가 의미상 중심 명사구이고, involved는 뒤에서 그 명사구에 부가된다.</div><div class=\"lec-gr-item\">involved (과거분사(형용사)): involved가 no maths를 뒤에서 보충·수식한다. no maths that is involved처럼 관계절이 축약된 형태로 볼 수 있으며, 명사 수식 p.p.이므로 수동태 설명이 아니라 분사 수식 구조이다.</div><div class=\"lec-gr-item\">use reasoning and logic (명령문): 주어 you가 생략되고 동사원형 use가 문두에 온 구조이다. reasoning and logic은 use의 목적어로 쓰인 명사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reasoning</td><td class=\"m\">추론, 추리, 논리적 사고</td></tr><tr><td class=\"w\">logic</td><td class=\"m\">논리, 논리학, 타당한 추론</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">보인다</span><span class=\"en\"><b><span class=\"grammar-hl\">It seems</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 그 생각만으로도</span><span class=\"en\"><b><span class=\"grammar-hl\">that even the idea</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무언가가 더럽혀질지도 모른다는</span><span class=\"en\"><b><span class=\"grammar-hl\">that something might be spoiled</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수학에 의해서</span><span class=\"en\"><b><span class=\"grammar-hl\">by mathematics</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">충분하다는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">is enough</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잠재적인 풀이자들을 겁주어 쫓아 버리기에!</span><span class=\"en\"><b><span class=\"grammar-hl\">to scare off potential solvers</span>!</b></span></div></div><div class=\"lec-sent-ko\">수학에 의해서 더럽혀질지도 모른다는 ‘생각’만으로도 잠재적인 풀이자들을 겁주어 쫓아 버리기에 충분한 것처럼 보인다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 신문 문구에 대한 글쓴이의 반응입니다. 많은 사람은 수학이 들어간다고 하면 재미있는 퍼즐도 어렵고 지루하게 느낄 수 있습니다. 글쓴이는 이 점을 약간 풍자적으로 말하면서, 사회적으로 수학이 불필요하게 두려운 대상으로 여겨지는 현실을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It seems that even the idea that something might be spoiled by mathematics is enough to scare off potential solvers (가주어): 진주어: It이 형식상 주어로 앞에 오고, that절이 실제 내용 역할을 한다. seem 뒤에 that + S + V 구조가 이어져 ‘that절의 내용이 그렇게 보인다’는 문장 구조를 만든다.</div><div class=\"lec-gr-item\">that something might be spoiled by mathematics 동격의 that: idea + that절 구조로, that절이 앞 명사 idea의 내용을 구체화한다. 관계대명사 that처럼 절 안에서 주어/목적어 역할을 하는 것이 아니라, ‘무엇이라는 생각’의 내용을 설명하는 명사절이다.</div><div class=\"lec-gr-item\">might be spoiled by mathematics (수동태): 조동사 might 뒤에 be동사 원형(be)+p.p.(spoiled)가 온 수동구조이다. spoil은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 be spoiled 형태로 쓴다. 기본구조: spoil + O(목적어). by mathematics는 행위자를 나타내는 전치사구이다.</div><div class=\"lec-gr-item\">to scare off potential solvers (to부정사): to + 동사원형 scare 구조로, enough 뒤에서 결과/정도를 나타내는 부사적 용법으로 쓰였다. enough to V 구조에서 to부정사는 ‘그 정도가 V하기에 충분함’을 나타낸다.</div><div class=\"lec-gr-item\">scare off (관용표현): scare off는 동사 + 부사로 이루어진 구동사이며, 하나의 동사구처럼 목적어 potential solvers를 취한다. 구조는 scare off + O이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spoil</td><td class=\"m\">망치다, 손상시키다, 버릇없게 만들다</td></tr><tr><td class=\"w\">scare off</td><td class=\"m\">겁주어 쫓아내다, 겁먹게 하여 멀어지게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 상상할 수 있겠는가</span><span class=\"en\"><b><span class=\"grammar-hl\">Could you imagine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전시회 홍보를</span><span class=\"en\"><b><span class=\"grammar-hl\">the promotion of an exhibition</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">국립 미술관에서의</span><span class=\"en\"><b><span class=\"grammar-hl\">in the National Gallery</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 슬로건을 가진</span><span class=\"en\"><b>with the slogan</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘예술과 관련이 없습니다</span><span class=\"en\"><b>‘<span class=\"grammar-hl\">No art involved</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 그림과 조각 뿐’?</span><span class=\"en\"><b>just painting and sculpture’?</b></span></div></div><div class=\"lec-sent-ko\">당신은 ‘예술과 관련이 없습니다. 단지 그림과 조각 뿐’이라는 슬로건을 가진 국립 미술관의 전시회 홍보를 상상할 수 있겠는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞의 신문 문구가 얼마나 이상한지를 비유로 보여 줍니다. 그림과 조각은 예술의 대표적인 형태이므로, 전시회를 홍보하면서 예술이 없다고 말하면 앞뒤가 맞지 않습니다. 마찬가지로 추론과 논리를 사용하는 스도쿠를 두고 수학이 없다고 말하는 것도 어색하다는 점을 독자가 스스로 느끼게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Could you imagine 조동사 의문문: 조동사 Could가 주어 you 앞에 나와 의문문을 만든다. 조동사 뒤의 본동사 imagine은 동사원형으로 쓰인다.</div><div class=\"lec-gr-item\">the promotion of an exhibition in the National Gallery 명사구 구조: the promotion이 중심명사이고, of an exhibition이 그 내용을 설명하는 전치사구로 붙는다. in the National Gallery는 exhibition을 수식하는 전치사구이다.</div><div class=\"lec-gr-item\">No art involved (과거분사(형용사)): involved가 no art를 뒤에서 보충·수식한다. no art that is involved처럼 관계절이 축약된 형태로 볼 수 있으며, 명사 수식 p.p. 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 스도쿠를 할 수 있다면</span><span class=\"en\"><b><span class=\"grammar-hl\">If you can do Sudoku,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 수학을 할 수 있다!</span><span class=\"en\"><b><span class=\"grammar-hl\">you can do maths</span>!</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 스도쿠를 할 수 있다면, 당신은 수학을 할 수 있다!</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론입니다. 글쓴이는 스도쿠를 푸는 능력이 곧 수학적 사고 능력과 연결된다고 말합니다. 여기서 수학은 복잡한 계산 능력만을 뜻하지 않고, 규칙을 파악하고 가능성을 따져 보며 논리적으로 결론에 이르는 능력을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If you can do Sudoku, you can do maths (조건절): If + 주어 + 동사 구조가 조건을 나타내고, 뒤의 you can do maths가 주절이다. 두 절 모두 조동사 can + 동사원형 do 구조를 사용한다.</div><div class=\"lec-gr-item\">do Sudoku 관용적 동사구: do가 Sudoku와 결합해 ‘스도쿠를 하다/풀다’라는 의미의 일반동사로 쓰인다. 조동사 can 뒤이므로 동사원형 do가 온다.</div><div class=\"lec-gr-item\">do maths 관용적 동사구: do가 maths와 결합해 ‘수학을 하다’라는 의미의 일반동사로 쓰인다. 앞의 do Sudoku와 병렬적으로 쓰여 구조를 반복한다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>수학의 핵심은 숫자 계산보다 패턴, 구조, 대칭, 연결을 이해하는 데 있다.</li><li>스도쿠는 숫자를 사용하지만 실제로는 계산보다 규칙에 맞는 배열과 논리를 요구한다.</li><li>숫자는 글자나 도형으로 바뀌어도 스도쿠의 원리는 그대로 유지된다.</li><li>사람들은 수학이라는 말에 겁을 먹지만, 추론과 논리는 이미 수학의 핵심이다.</li><li>스도쿠를 풀 수 있다는 것은 수학적으로 생각할 수 있다는 뜻이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Mathematics is not limited to numbers but centers on patterns and logical structures.</div>\n              <div class=\"lec-final-sum-ko\">수학은 숫자에만 국한되지 않고 패턴과 논리적 구조를 중심으로 한다.</div></div></div>"],"segs":[[{"audio":"./36_audio/1.mp3","hl":null}],[{"audio":"./36_audio/2.mp3","hl":null}],[{"audio":"./36_audio/3.mp3","hl":null},{"audio":"./36_audio/4.mp3","hl":"stage-0"},{"audio":"./36_audio/5.mp3","hl":"stage-1"},{"audio":"./36_audio/6.mp3","hl":"stage-2"},{"audio":"./36_audio/7.mp3","hl":"stage-3"},{"audio":"./36_audio/8.mp3","hl":"stage-4"}],[{"audio":"./36_audio/9.mp3","hl":null}],[{"audio":"./36_audio/10.mp3","hl":"main"},{"audio":"./36_audio/11.mp3","hl":"meaning"},{"audio":"./36_audio/12.mp3","hl":"grammar"}],[{"audio":"./36_audio/13.mp3","hl":"main"},{"audio":"./36_audio/14.mp3","hl":"meaning"},{"audio":"./36_audio/15.mp3","hl":"grammar"}],[{"audio":"./36_audio/16.mp3","hl":"main"},{"audio":"./36_audio/17.mp3","hl":"meaning"},{"audio":"./36_audio/18.mp3","hl":"grammar"}],[{"audio":"./36_audio/19.mp3","hl":"main"},{"audio":"./36_audio/20.mp3","hl":"meaning"},{"audio":"./36_audio/21.mp3","hl":"grammar"}],[{"audio":"./36_audio/22.mp3","hl":"main"},{"audio":"./36_audio/23.mp3","hl":"meaning"},{"audio":"./36_audio/24.mp3","hl":"grammar"}],[{"audio":"./36_audio/25.mp3","hl":"main"},{"audio":"./36_audio/26.mp3","hl":"meaning"},{"audio":"./36_audio/27.mp3","hl":"grammar"}],[{"audio":"./36_audio/28.mp3","hl":"main"},{"audio":"./36_audio/29.mp3","hl":"meaning"},{"audio":"./36_audio/30.mp3","hl":"grammar"}],[{"audio":"./36_audio/31.mp3","hl":"main"},{"audio":"./36_audio/32.mp3","hl":"meaning"},{"audio":"./36_audio/33.mp3","hl":"grammar"}],[{"audio":"./36_audio/34.mp3","hl":"main"},{"audio":"./36_audio/35.mp3","hl":"meaning"},{"audio":"./36_audio/36.mp3","hl":"grammar"}],[{"audio":"./36_audio/37.mp3","hl":"main"},{"audio":"./36_audio/38.mp3","hl":"meaning"},{"audio":"./36_audio/39.mp3","hl":"grammar"}],[{"audio":"./36_audio/40.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
