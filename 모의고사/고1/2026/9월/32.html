event)이 먼저 발생함</li><li>사건의 의미를 해석(interpretation)함</li><li>해석이 감정 반응(emotional response)을 유발함</li><li>핵심 키워드: 해석(interpretation)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03비판 사례</div><ul><li>누군가의 비판 때문에 화가 나는 것은 말 자체보다 그 말을 불공평하거나 위협적으로 판단하기 때문이다.</li><li>비판(criticism)을 받음</li><li>그 말을 불공평(unfair)하거나 위협적(threatening)이라고 봄</li><li>그 판단이 분노(anger)를 일으킴</li><li>핵심 키워드: 위협(threat)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실직 사례</div><ul><li>직장을 잃었을 때 절망하는 이유는 단순한 실직보다 그것이 자신의 가치나 미래를 결정한다고 믿기 때문이다.</li><li>실직(job loss)이라는 사건 발생</li><li>자신의 가치(worth)나 미래(future)와 연결해 해석함</li><li>그 믿음이 절망(devastation)을 만듦</li><li>핵심 키워드: 자기 가치(worth)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05실천적 결론</div><ul><li>판단을 바꾸면 감정도 바뀔 수 있으며, 이는 감정을 억누르는 것이 아니라 자기 내면의 이야기를 점검하는 것이다.</li><li>감정을 억압(suppress)하는 것이 아님</li><li>자신이 만든 이야기(story)를 살펴봄</li><li>더 도움이 되는 해석을 선택함</li><li>핵심 키워드: 판단 변화(change the judgment)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fascinating</td><td class=\"m\">대단히 흥미로운, 매혹적인</td></tr><tr><td class=\"w\">empower</td><td class=\"m\">힘을 주다, 자신감을 주다, 권한을 부여하다</td></tr><tr><td class=\"w\">insight</td><td class=\"m\">통찰, 이해, 식견</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정, 정서</td></tr><tr><td class=\"w\">random</td><td class=\"m\">무작위의, 임의의, 닥치는 대로의</td></tr><tr><td class=\"w\">arise from</td><td class=\"m\">~에서 생기다, ~에서 비롯되다</td></tr><tr><td class=\"w\">judgment</td><td class=\"m\">판단, 판단력, 의견</td></tr><tr><td class=\"w\">overwhelm</td><td class=\"m\">압도하다, 감당하지 못하게 하다, 휩싸이게 하다</td></tr><tr><td class=\"w\">reaction</td><td class=\"m\">반응, 반작용</td></tr><tr><td class=\"w\">shape</td><td class=\"m\">형성하다, 영향을 미치다, 만들다</td></tr><tr><td class=\"w\">interpret</td><td class=\"m\">해석하다, 이해하다, 통역하다</td></tr><tr><td class=\"w\">trigger</td><td class=\"m\">유발하다, 촉발하다</td></tr><tr><td class=\"w\">criticize</td><td class=\"m\">비판하다, 비난하다</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~로 인하여</td></tr><tr><td class=\"w\">perceive</td><td class=\"m\">인식하다, 지각하다, 여기다</td></tr><tr><td class=\"w\">devastated</td><td class=\"m\">엄청난 충격을 받은, 망연자실한, 황폐해진</td></tr><tr><td class=\"w\">suppress</td><td class=\"m\">억누르다, 참다, 진압하다</td></tr><tr><td class=\"w\">examine</td><td class=\"m\">살펴보다, 검토하다, 조사하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fascinating</td><td class=\"m\">대단히 흥미로운, 매혹적인</td></tr><tr><td class=\"w\">empower</td><td class=\"m\">힘을 주다, 자신감을 주다, 권한을 부여하다</td></tr><tr><td class=\"w\">insight</td><td class=\"m\">통찰, 이해, 식견</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정, 정서</td></tr><tr><td class=\"w\">random</td><td class=\"m\">무작위의, 임의의, 닥치는 대로의</td></tr><tr><td class=\"w\">arise from</td><td class=\"m\">~에서 생기다, ~에서 비롯되다</td></tr><tr><td class=\"w\">judgment</td><td class=\"m\">판단, 판단력, 의견</td></tr><tr><td class=\"w\">overwhelm</td><td class=\"m\">압도하다, 감당하지 못하게 하다, 휩싸이게 하다</td></tr><tr><td class=\"w\">reaction</td><td class=\"m\">반응, 반작용</td></tr><tr><td class=\"w\">shape</td><td class=\"m\">형성하다, 영향을 미치다, 만들다</td></tr><tr><td class=\"w\">interpret</td><td class=\"m\">해석하다, 이해하다, 통역하다</td></tr><tr><td class=\"w\">trigger</td><td class=\"m\">유발하다, 촉발하다</td></tr><tr><td class=\"w\">criticize</td><td class=\"m\">비판하다, 비난하다</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~로 인하여</td></tr><tr><td class=\"w\">perceive</td><td class=\"m\">인식하다, 지각하다, 여기다</td></tr><tr><td class=\"w\">devastated</td><td class=\"m\">엄청난 충격을 받은, 망연자실한, 황폐해진</td></tr><tr><td class=\"w\">suppress</td><td class=\"m\">억누르다, 참다, 진압하다</td></tr><tr><td class=\"w\">examine</td><td class=\"m\">살펴보다, 검토하다, 조사하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">스토아 철학에서 가장 매혹적이고 힘을 주는 통찰 중 하나는</span><span class=\"en\"><b><span class=\"grammar-hl\">One of the most fascinating and empowering insights</span> in Stoic philosophy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 감정이 임의적이지 않다는 것이다;</span><span class=\"en\"><b><span class=\"grammar-hl\">is that our emotions are not random</span>;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 생겨난다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">arise</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 판단으로부터.</span><span class=\"en\"><b><span class=\"grammar-hl\">from our judgments</span>.</b></span></div></div><div class=\"lec-sent-ko\">스토아 철학에서 가장 매혹적이고 힘을 주는 통찰 중 하나는 우리의 감정이 임의적이지 않다는 것이다. 즉, 그것들은 우리의 판단으로부터 생겨난다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 문장은 글 전체의 핵심 주장을 제시합니다. 스토아 철학은 사람이 느끼는 분노, 두려움, 슬픔 같은 감정이 외부 사건 자체에서 곧장 생긴다고 보기보다, 그 사건을 마음속에서 어떻게 판단하느냐에 따라 생긴다고 봅니다. 그래서 이 통찰은 사람에게 힘을 줍니다. 감정이 완전히 통제 불가능한 것이 아니라면, 자신의 판단을 살피며 감정에 대응할 여지가 생기기 때문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">fascinating and empowering insights (현재분사(형용사)): fascinating과 empowering이 insights를 앞에서 수식한다. 기본적으로 -ing + N 구조로, insights가 사람을 매료시키고 힘을 주는 성격을 가진다는 의미의 형용사적 수식이다.</div><div class=\"lec-gr-item\">One of the most fascinating and empowering insights 핵심 주어 구조: One of + 복수명사 형태로, 여러 insights 중 하나를 가리킨다. 문장의 실제 동사는 단수 주어 One에 맞추어 is가 쓰였다.</div><div class=\"lec-gr-item\">is that our emotions are not random 명사절 보어: that절이 be동사 is 뒤에서 주격 보어 역할을 한다. that our emotions are not random 전체가 앞의 주어 One of the insights의 내용을 설명하는 보어절이다.</div><div class=\"lec-gr-item\">arise from our judgments (관용표현): arise from은 ‘~에서 생겨나다/비롯되다’라는 의미의 동사구로, arise 뒤에 전치사 from이 결합하여 원인·출처를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fascinating</td><td class=\"m\">대단히 흥미로운, 매혹적인</td></tr><tr><td class=\"w\">empower</td><td class=\"m\">힘을 주다, 자신감을 주다, 권한을 부여하다</td></tr><tr><td class=\"w\">insight</td><td class=\"m\">통찰, 이해, 식견</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정, 정서</td></tr><tr><td class=\"w\">random</td><td class=\"m\">무작위의, 임의의, 닥치는 대로의</td></tr><tr><td class=\"w\">arise from</td><td class=\"m\">~에서 생기다, ~에서 비롯되다</td></tr><tr><td class=\"w\">judgment</td><td class=\"m\">판단, 판단력, 의견</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fascinating</td><td class=\"m\">대단히 흥미로운, 매혹적인</td></tr><tr><td class=\"w\">empower</td><td class=\"m\">힘을 주다, 자신감을 주다, 권한을 부여하다</td></tr><tr><td class=\"w\">insight</td><td class=\"m\">통찰, 이해, 식견</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정, 정서</td></tr><tr><td class=\"w\">random</td><td class=\"m\">무작위의, 임의의, 닥치는 대로의</td></tr><tr><td class=\"w\">arise from</td><td class=\"m\">~에서 생기다, ~에서 비롯되다</td></tr><tr><td class=\"w\">judgment</td><td class=\"m\">판단, 판단력, 의견</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b>This</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀랍게 들릴 수 있다,</span><span class=\"en\"><b><span class=\"grammar-hl\">may sound surprising</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특히 만약 당신이 압도당해 본 적이 있다면</span><span class=\"en\"><b>especially <span class=\"grammar-hl\">if you've ever felt overwhelmed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분노, 두려움 또는 슬픔에 의해.</span><span class=\"en\"><b><span class=\"grammar-hl\">by anger, fear, or sadness</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 특히 만약 당신이 분노, 두려움 또는 슬픔에 압도당해 본 적이 있다면 놀랍게 들릴 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 두 번째 문장은 앞의 주장이 왜 낯설게 느껴질 수 있는지 독자의 경험과 연결합니다. 강한 감정에 휩싸이면 사람은 보통 “감정이 그냥 나를 덮쳤다”고 느낍니다. 글쓴이는 독자가 그런 경험을 떠올리게 하면서, 앞으로 제시할 스토아적 설명이 일상적인 느낌과 다를 수 있음을 준비시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">may sound surprising 조동사 + 연결동사 + 보어: may는 조동사이므로 뒤에 동사원형 sound가 오고, sound는 연결동사로 형용사 보어 surprising을 취한다.</div><div class=\"lec-gr-item\">surprising (현재분사(형용사)): surprising은 현재분사형 형용사로, 주어 This의 성격을 설명하는 주격 보어 역할을 한다.</div><div class=\"lec-gr-item\">if you&#39;ve ever felt overwhelmed by anger, fear, or sadness (조건절): if + 주어 + 동사 구조로 조건을 나타내는 부사절이다. 주절 This may sound surprising의 조건 배경을 제시한다.</div><div class=\"lec-gr-item\">felt overwhelmed (과거분사(형용사)): overwhelmed는 과거분사형 형용사로, 연결동사 felt 뒤에서 주어 you의 상태를 설명하는 주격 보어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">overwhelm</td><td class=\"m\">압도하다, 감당하지 못하게 하다, 휩싸이게 하다</td></tr><tr><td class=\"w\">overwhelm</td><td class=\"m\">압도하다, 감당하지 못하게 하다, 휩싸이게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 스토아학파는</span><span class=\"en\"><b>But the Stoics</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가르쳤다</span><span class=\"en\"><b><span class=\"grammar-hl\">taught</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감정이 단지 자동적인 반응이 아니라고.</span><span class=\"en\"><b><span class=\"grammar-hl\">that emotions aren't just automatic reactions</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 스토아학파는 감정이 단지 자동적인 반응이 아니라고 가르쳤다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞 문장의 ‘놀랍게 들릴 수 있다’는 반응에서 한 걸음 나아가 스토아학파의 관점을 분명히 밝힙니다. 누군가 나를 비판하면 즉시 화가 나는 것처럼 보이지만, 스토아 철학에서는 그 사이에 마음의 판단 과정이 있다고 봅니다. 여기서 글은 감정을 단순 반사처럼 보는 일반적인 느낌에서 벗어나, 감정의 발생 과정을 분석하려고 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">taught that emotions aren&#39;t just automatic reactions 목적어 that절: taught 뒤에 that + S + V 구조의 명사절이 목적어로 왔다. that절 전체가 Stoics가 가르친 내용을 나타낸다.</div><div class=\"lec-gr-item\">aren&#39;t just automatic reactions be동사 부정문: are not의 축약형 aren&#39;t가 쓰였고, automatic reactions는 주어 emotions를 설명하는 주격 보어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emotion</td><td class=\"m\">감정, 정서</td></tr><tr><td class=\"w\">reaction</td><td class=\"m\">반응, 반작용</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정, 정서</td></tr><tr><td class=\"w\">reaction</td><td class=\"m\">반응, 반작용</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것들은 형성된다</span><span class=\"en\"><b><span class=\"grammar-hl\">They're shaped</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 우리가 사건을 해석하는지에 의해.</span><span class=\"en\"><b><span class=\"grammar-hl\">by how we interpret events</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것들은 어떻게 우리가 사건을 해석하는지에 의해 형성된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 바로 앞 문장의 내용을 더 구체화합니다. 어떤 사건이 일어났다는 사실보다, 그 사건을 내가 모욕, 위협, 실패, 기회 등으로 받아들이는 방식이 감정의 방향을 정합니다. 스토아 철학에서 중요한 지점은 외부 사건을 바꿀 수 없어도 그 사건에 대한 해석은 점검할 수 있다는 점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">They&#39;re shaped by how we interpret events (수동태): be동사(are)+p.p.(shaped) 구조이다. shape는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) are shaped 형태로 쓴다. 기본구조: shape + O(목적어). by how we interpret events는 수동구조 뒤에서 행위의 기준·원인을 나타내는 전치사구이다.</div><div class=\"lec-gr-item\">how we interpret events (간접의문문): how + S + V 어순으로 쓰인 명사절이다. 직접의문문 어순인 how do we interpret events가 아니라, 전치사 by의 목적어로 쓰이기 때문에 how we interpret events처럼 평서문 어순을 취한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">shape</td><td class=\"m\">형성하다, 영향을 미치다, 만들다</td></tr><tr><td class=\"w\">interpret</td><td class=\"m\">해석하다, 이해하다, 통역하다</td></tr><tr><td class=\"w\">shape</td><td class=\"m\">형성하다, 영향을 미치다, 만들다</td></tr><tr><td class=\"w\">interpret</td><td class=\"m\">해석하다, 이해하다, 통역하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여기에 그것이 작동하는 방식이 있다:</span><span class=\"en\"><b><span class=\"grammar-hl\">Here's how it works</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무언가가 발생하면,</span><span class=\"en\"><b><span class=\"grammar-hl\">something happens,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 해석하고,</span><span class=\"en\"><b><span class=\"grammar-hl\">you interpret</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 무엇을 의미하는지,</span><span class=\"en\"><b><span class=\"grammar-hl\">what it means,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 해석은</span><span class=\"en\"><b><span class=\"grammar-hl\">and that interpretation</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감정적 반응을 일으킨다.</span><span class=\"en\"><b><span class=\"grammar-hl\">triggers an emotional response</span>.</b></span></div></div><div class=\"lec-sent-ko\">여기에 그것이 작동하는 방식이 있다. 무언가가 발생하면, 당신은 그것이 무엇을 의미하는지 해석하고, 그 해석은 감정적 반응을 일으킨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞에서 말한 원리를 단계별 과정으로 풀어 줍니다. 사건이 먼저 있고, 그다음 사람이 그 사건에 의미를 붙이며, 그 의미 부여가 감정을 만들어 냅니다. 글쓴이는 추상적인 철학 주장을 독자가 쉽게 이해하도록 ‘사건 → 해석 → 감정’이라는 흐름으로 정리하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Here&#39;s how it works (도치): Here + be동사 + 주어 구조로, 장소·제시 부사 Here가 앞에 오면서 be동사 is가 주어 how it works 앞에 놓인 형태이다.</div><div class=\"lec-gr-item\">how it works (간접의문문): how + S + V 어순의 명사절이다. 여기서는 be동사 is 뒤에서 주어처럼 제시되는 내용 역할을 하며, 의문문 어순이 아니라 평서문 어순 it works가 쓰였다.</div><div class=\"lec-gr-item\">what it means (간접의문문): what + S + V 구조의 명사절이다. interpret의 목적어로 쓰였으며, 직접의문문 어순이 아니라 what it means처럼 주어 it + 동사 means의 평서문 어순을 취한다.</div><div class=\"lec-gr-item\">something happens, you interpret what it means, and that interpretation triggers an emotional response 병렬 구조: something happens, you interpret, that interpretation triggers가 순서대로 이어진다. 각 절은 사건 발생, 해석, 감정 반응 유발이라는 단계적 구조를 이룬다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emotion</td><td class=\"m\">감정, 정서</td></tr><tr><td class=\"w\">interpret</td><td class=\"m\">해석하다, 이해하다, 통역하다</td></tr><tr><td class=\"w\">trigger</td><td class=\"m\">유발하다, 촉발하다</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정, 정서</td></tr><tr><td class=\"w\">interpret</td><td class=\"m\">해석하다, 이해하다, 통역하다</td></tr><tr><td class=\"w\">trigger</td><td class=\"m\">유발하다, 촉발하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어:</span><span class=\"en\"><b>For example:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 누군가가 당신을 비난한다면,</span><span class=\"en\"><b><span class=\"grammar-hl\">If someone criticizes you</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 화가 날 수 있다</span><span class=\"en\"><b>you <span class=\"grammar-hl\">may feel angry</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 말 자체 때문이 아니라</span><span class=\"en\"><b>not <span class=\"grammar-hl\">due to the words themselves</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오히려 당신이 그 언급을 인식하기 때문에</span><span class=\"en\"><b>but because you <span class=\"grammar-hl\">perceive the comment</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불공정하거나 위협적인 것으로.</span><span class=\"en\"><b><span class=\"grammar-hl\">as unfair or threatening</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 만약 누군가가 당신을 비난한다면, 당신은 그 말 자체 때문이 아니라 당신이 그 언급을 불공정하거나 위협적이라고 인식하기 때문에 화가 날 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞 문장의 과정을 구체적인 일상 사례로 보여 줍니다. 같은 비판을 들어도 어떤 사람은 배울 점을 찾고, 어떤 사람은 공격받았다고 느낄 수 있습니다. 글쓴이는 화라는 감정이 비판의 문장 자체에서 자동으로 생기는 것이 아니라, 그 비판을 “나를 부당하게 대한다”거나 “내 위치를 위협한다”고 받아들이는 판단에서 생긴다는 점을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If someone criticizes you (조건절): If + S + V 구조의 부사절이다. 주절 you may feel angry의 조건을 제시한다.</div><div class=\"lec-gr-item\">may feel angry 조동사 + 연결동사 + 보어: may 뒤에는 동사원형 feel이 오고, feel은 연결동사로 형용사 angry를 주격 보어로 취한다.</div><div class=\"lec-gr-item\">due to the words themselves (관용표현): due to는 전치사구처럼 쓰여 ‘~ 때문에’라는 원인을 나타낸다. 뒤에는 명사구 the words themselves가 목적어로 온다.</div><div class=\"lec-gr-item\">perceive the comment as unfair or threatening 5형식(SVOC) 구조: perceive + O + as C 구조이다. the comment가 목적어(O), unfair or threatening이 목적격 보어(C)로, 목적어가 어떤 것으로 인식되는지를 설명한다.</div><div class=\"lec-gr-item\">threatening (현재분사(형용사)): threatening은 현재분사형 형용사로, 목적어 the comment의 성격을 설명하는 목적격 보어의 일부로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">criticize</td><td class=\"m\">비판하다, 비난하다</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~로 인하여</td></tr><tr><td class=\"w\">perceive</td><td class=\"m\">인식하다, 지각하다, 여기다</td></tr><tr><td class=\"w\">criticize</td><td class=\"m\">비판하다, 비난하다</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~로 인하여</td></tr><tr><td class=\"w\">perceive</td><td class=\"m\">인식하다, 지각하다, 여기다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 당신이 일자리를 잃는다면,</span><span class=\"en\"><b><span class=\"grammar-hl\">If you lose a job</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 망연자실할 수 있다</span><span class=\"en\"><b>you <span class=\"grammar-hl\">might feel devastated</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단지 일자리 상실 때문만이 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">not simply because of the job loss</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오히려 당신이 믿기 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">but because you believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 당신의 가치나 미래를 규정한다고.</span><span class=\"en\"><b><span class=\"grammar-hl\">it defines your worth or future</span>.</b></span></div></div><div class=\"lec-sent-ko\">만약 당신이 일자리를 잃는다면, 당신은 단지 일자리 상실 때문만이 아니라 그것이 당신의 가치나 미래를 규정한다고 믿기 때문에 망연자실할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞의 비판 사례에 이어 더 큰 삶의 사건을 예로 듭니다. 실직은 실제로 힘든 사건이지만, 사람이 완전히 무너지는 느낌을 받는 데에는 “나는 실패한 사람이다”, “내 미래는 끝났다” 같은 판단이 작용할 수 있습니다. 글쓴이는 감정의 강도가 사건의 크기뿐 아니라 그 사건에 붙인 의미에 따라 달라진다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If you lose a job (조건절): If + S + V 구조의 부사절로, 주절 you might feel devastated가 성립하는 조건을 나타낸다.</div><div class=\"lec-gr-item\">might feel devastated 조동사 + 연결동사 + 보어: might 뒤에 동사원형 feel이 오고, feel은 연결동사로 과거분사형 형용사 devastated를 주격 보어로 취한다.</div><div class=\"lec-gr-item\">devastated (과거분사(형용사)): devastated는 과거분사형 형용사로, 주어 you의 상태를 설명하는 주격 보어 역할을 한다. 여기서는 be동사 + p.p. 수동태가 아니라 feel 뒤의 보어이다.</div><div class=\"lec-gr-item\">not simply because of the job loss but because you believe it defines your worth or future 상관 구조: not simply A but B 구조로, 감정의 원인이 단순히 A가 아니라 B임을 대조한다. because of 뒤에는 명사구가 오고, because 뒤에는 주어+동사가 있는 절이 온다.</div><div class=\"lec-gr-item\">you believe it defines your worth or future 목적절 구조: believe 뒤에 that이 생략된 명사절 it defines your worth or future가 목적어로 쓰였다. 구조는 believe + (that) + S + V이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">devastated</td><td class=\"m\">엄청난 충격을 받은, 망연자실한, 황폐해진</td></tr><tr><td class=\"w\">devastated</td><td class=\"m\">엄청난 충격을 받은, 망연자실한, 황폐해진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 판단을 바꿔라,</span><span class=\"en\"><b><span class=\"grammar-hl\">Change the judgment,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면 당신은 그 감정을 바꾼다.</span><span class=\"en\"><b><span class=\"grammar-hl\">and you change the emotion</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 해석을 바꿔라, 그러면 당신은 그 감정을 바꾼다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞의 두 사례에서 끌어낸 결론입니다. 비판을 성장의 기회로 해석하거나, 실직을 인생 전체의 실패가 아니라 다음 단계로 가는 전환점으로 해석하면 감정도 달라질 수 있습니다. 글쓴이는 감정을 직접 억지로 바꾸려 하기보다, 감정을 만들어 낸 판단을 살피는 것이 핵심이라고 말합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Change the judgment (명령문): 주어 you가 생략되고 동사원형 Change로 문장이 시작된다. 명령문은 기본적으로 동사원형 + 목적어 구조를 취한다.</div><div class=\"lec-gr-item\">Change the judgment, and you change the emotion 명령문 + and 구조: 앞의 명령문이 조건처럼 기능하고, 뒤의 you change the emotion이 그 결과를 나타낸다. 구조적으로는 ‘동사원형..., and + S + V’ 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">emotion</td><td class=\"m\">감정, 정서</td></tr><tr><td class=\"w\">judgment</td><td class=\"m\">판단, 판단력, 의견</td></tr><tr><td class=\"w\">emotion</td><td class=\"m\">감정, 정서</td></tr><tr><td class=\"w\">judgment</td><td class=\"m\">판단, 판단력, 의견</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b>This</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미하는 것이 아니다</span><span class=\"en\"><b><span class=\"grammar-hl\">doesn't mean</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">억누르는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">suppressing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 어떻게 느끼는지를;</span><span class=\"en\"><b><span class=\"grammar-hl\">how you feel</span>;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미한다</span><span class=\"en\"><b><span class=\"grammar-hl\">means</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점검하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">examining</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 스스로에게 하는 이야기를</span><span class=\"en\"><b><span class=\"grammar-hl\">the story you tell yourself</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 하나를 선택하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">and choosing one</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신에게 더 도움이 되는.</span><span class=\"en\"><b><span class=\"grammar-hl\">that serves you better</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 당신이 어떻게 느끼는지를 억누르는 것을 의미하는 것이 아니라, 그것은 당신이 스스로에게 하는 이야기를 점검하고 당신에게 더 도움이 되는 것을 선택하는 것을 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장은 글의 실제 적용 방향을 정리하며 오해를 막습니다. 스토아 철학은 슬픔이나 분노를 못 느끼는 척하라고 말하는 방식이 아닙니다. 여기서 ‘스스로에게 들려주는 이야기’는 “나는 끝났다”, “저 사람은 나를 망치려 한다”처럼 마음속에서 사건에 붙이는 해석을 가리킵니다. 글쓴이는 그 해석을 점검하고, 현실을 더 차분하게 바라보며 앞으로 행동할 수 있게 해 주는 해석을 선택하라고 말합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">doesn&#39;t mean suppressing how you feel (동명사): suppressing how you feel이 동명사구로 mean의 목적어 역할을 한다. mean + -ing 구조는 ‘~하는 것을 의미하다’라는 형태이다.</div><div class=\"lec-gr-item\">how you feel (간접의문문): how + S + V 구조의 명사절이다. suppressing의 목적어로 쓰였고, 의문문 어순이 아니라 how you feel처럼 평서문 어순을 취한다.</div><div class=\"lec-gr-item\">means examining the story you tell yourself and choosing one that serves you better (동명사): examining과 choosing이 병렬로 연결되어 means의 목적어 역할을 한다. 구조는 mean + 동명사구 and 동명사구이다.</div><div class=\"lec-gr-item\">the story you tell yourself (관계대명사): the story 뒤에 목적격 관계대명사 that/which가 생략된 구조이다. 원래 구조는 the story that you tell yourself이며, 관계대명사는 tell의 목적어 자리에 해당한다.</div><div class=\"lec-gr-item\">one that serves you better (관계대명사): that이 선행사 one을 수식하는 관계대명사절을 이끈다. that은 관계절 안에서 serves의 주어 역할을 하므로 생략할 수 없다.</div><div class=\"lec-gr-item\">serves you better (관용표현): serve someone은 ‘누군가에게 도움이 되다/유익하게 작용하다’라는 의미로 쓰인다. 여기서 serves you better는 one을 설명하는 관계절의 동사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">suppress</td><td class=\"m\">억누르다, 참다, 진압하다</td></tr><tr><td class=\"w\">suppress</td><td class=\"m\">억누르다, 참다, 진압하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>스토아 철학은 감정이 우연히 생기는 것이 아니라 판단에서 비롯된다고 본다.</li><li>사람은 사건을 겪고, 그 사건에 의미를 붙이며, 그 해석에 따라 감정을 느낀다.</li><li>비판이나 실직 같은 사건도 그것을 어떻게 받아들이느냐에 따라 분노나 절망의 정도가 달라진다.</li><li>판단을 바꾸면 감정도 달라질 수 있다.</li><li>이는 감정을 억누르라는 말이 아니라, 자신에게 더 도움이 되는 해석을 선택하라는 뜻이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">According to Stoicism, emotions arise from our judgments, and changing those judgments can transform how we feel.</div>\n              <div class=\"lec-final-sum-ko\">스토아 철학에 따르면 감정은 우리의 판단에서 생겨나며, 그 판단을 바꾸면 느끼는 감정도 달라질 수 있다.</div></div></div>"],"segs":[[{"audio":"./32_audio/1.mp3","hl":null}],[{"audio":"./32_audio/2.mp3","hl":null}],[{"audio":"./32_audio/3.mp3","hl":null},{"audio":"./32_audio/4.mp3","hl":"stage-0"},{"audio":"./32_audio/5.mp3","hl":"stage-1"},{"audio":"./32_audio/6.mp3","hl":"stage-2"},{"audio":"./32_audio/7.mp3","hl":"stage-3"},{"audio":"./32_audio/8.mp3","hl":"stage-4"}],[{"audio":"./32_audio/9.mp3","hl":null}],[{"audio":"./32_audio/10.mp3","hl":"main"},{"audio":"./32_audio/11.mp3","hl":"meaning"},{"audio":"./32_audio/12.mp3","hl":"grammar"}],[{"audio":"./32_audio/13.mp3","hl":"main"},{"audio":"./32_audio/14.mp3","hl":"meaning"},{"audio":"./32_audio/15.mp3","hl":"grammar"}],[{"audio":"./32_audio/16.mp3","hl":"main"},{"audio":"./32_audio/17.mp3","hl":"meaning"},{"audio":"./32_audio/18.mp3","hl":"grammar"}],[{"audio":"./32_audio/19.mp3","hl":"main"},{"audio":"./32_audio/20.mp3","hl":"meaning"},{"audio":"./32_audio/21.mp3","hl":"grammar"}],[{"audio":"./32_audio/22.mp3","hl":"main"},{"audio":"./32_audio/23.mp3","hl":"meaning"},{"audio":"./32_audio/24.mp3","hl":"grammar"}],[{"audio":"./32_audio/25.mp3","hl":"main"},{"audio":"./32_audio/26.mp3","hl":"meaning"},{"audio":"./32_audio/27.mp3","hl":"grammar"}],[{"audio":"./32_audio/28.mp3","hl":"main"},{"audio":"./32_audio/29.mp3","hl":"meaning"},{"audio":"./32_audio/30.mp3","hl":"grammar"}],[{"audio":"./32_audio/31.mp3","hl":"main"},{"audio":"./32_audio/32.mp3","hl":"meaning"},{"audio":"./32_audio/33.mp3","hl":"grammar"}],[{"audio":"./32_audio/34.mp3","hl":"main"},{"audio":"./32_audio/35.mp3","hl":"meaning"},{"audio":"./32_audio/36.mp3",
