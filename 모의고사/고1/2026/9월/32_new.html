<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>32번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"32번","audioDir":"32_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">32번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>The Power of Perception: Stoic Lessons on Emotion\u003c/h1>\u003ch2>인식의 힘: 감정에 대한 스토아 철학의 교훈\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>감정은 외부 사건에 의한 자동적인 반응이 아니라 개인의 \u003cb class=\"key\">판단\u003c/b>과 \u003cb class=\"key\">해석\u003c/b>에서 비롯되는 것이므로, 스스로의 생각을 점검함으로써 감정을 조절할 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Emotions are products of our cognitive judgments, and by re-evaluating our interpretations of events, we can manage our emotional responses.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 서른두 번째 지문을 통해 우리의 감정을 다스리는 지혜를 배워보겠습니다. 이번 지문의 핵심은 감정이 외부 사건에 의해 자동으로 생기는 게 아니라, 우리의 판단에 달려 있다는 점이에요. 즉, 해석을 바꾸면 감정도 바꿀 수 있다는 아주 희망적인 메시지를 담고 있습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">스토아 \u003c/b>\u003cb class=\"key\">학파\u003c/b>(Stoicism)는 외부 환경은 우리가 통제할 수 없지만, 그 환경에 대한 우리의 \u003cb class=\"key\">반응\u003c/b>은 통제할 수 있다고 믿었던 고대 철학입니다. 이들은 인간의 괴로움이 사건 그 자체가 아니라 사건에 대한 \u003cb class=\"key\">판단\u003c/b>(Judgment)에서 온다고 보았습니다. 예를 들어, 비가 오는 날 약속이 취소되었을 때 누군가는 \u003cb class=\"key\">실망\u003c/b>하지만, 집에서 쉬고 싶던 누군가는 \u003cb class=\"key\">안도감\u003c/b>을 느끼는 것과 같습니다. 이러한 관점은 현대 심리학의 \u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">치료\u003c/b>(CBT)의 핵심 원리와 맞닿아 있어 오늘날에도 큰 영향을 미칩니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 내용에 앞서 스토아 철학에 대해 알아볼까요? 고대 스토아학파 철학자들은 우리가 세상 모든 일을 다 통제할 수는 없지만, 그 일을 어떻게 바라볼지는 스스로 정할 수 있다고 믿었습니다. 이걸 현대 심리학에서는 인지 치료라고도 부르는데, 비유하자면 똑같은 소나기를 보고도 누군가는 옷이 젖어 짜증을 내고 누군가는 가뭄이 해소되어 기뻐하는 것과 같아요. 결국 중요한 건 비라는 사건이 아니라 그에 대한 판단이라는 거죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>감정의 근원\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>감정은 무작위로 생기는 것이 아니라 우리의 \u003cb class=\"key\">판단\u003c/b>에서 비롯된다는 통찰을 제시합니다. 비록 강렬한 감정에 \u003cb class=\"key\">압도\u003c/b>될 때는 이것이 생소하게 들릴 수 있음을 인정합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>해석의 메커니즘\u003csmall>주장 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>감정은 단순한 \u003cb class=\"key\">자동적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>이 아니라 사건을 어떻게 \u003cb class=\"key\">해석\u003c/b>하느냐에 따라 형성됩니다. 사건 발생, 의미 해석, \u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">반응\u003c/b> 유발로 이어지는 작동 방식을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>비난과 실직의 예시\u003csmall>예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>비난을 받을 때나 일자리를 잃었을 때 느끼는 고통은 사건 자체보다 그것을 \u003cb class=\"key\">불공정\u003c/b>하거나 \u003cb class=\"key\">가치 \u003c/b>\u003cb class=\"key\">규정\u003c/b>의 잣대로 바라보는 해석 때문임을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>판단의 변화와 통제\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>판단을 바꾸면 감정도 바뀌며, 이는 감정의 억제가 아니라 나에게 \u003cb class=\"key\">도움이 \u003c/b>\u003cb class=\"key\">되는 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>를 선택하는 \u003cb class=\"key\">점검\u003c/b>의 과정임을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"자, 그럼 글이 어떤 논리적 단계를 거쳐 이 통찰을 설명하는지 함께 살펴봅시다.","hl":null},{"n":4,"text":"먼저 도입부에서는 감정이 임의적인 게 아니라 판단에서 나온다는 스토아 철학의 매혹적인 통찰을 소개합니다. 감정에 압도당해본 적 있는 사람들에겐 조금 놀라운 이야기일 수 있다는 점도 언급하며 독자의 관심을 끕니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 감정의 작동 원리를 설명해요. 감정은 단순한 자동적 반응이 아니라, 사건을 어떻게 해석하느냐에 의해 형성된다고 강조합니다. 사건, 해석, 감정적 반응으로 이어지는 삼단계 과정을 잘 기억해 두세요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 우리 삶의 구체적인 예시 두 가지를 듭니다. 누군가의 비난을 받았을 때나 일자리를 잃었을 때 우리가 왜 고통을 느끼는지, 그 이면에 숨겨진 인식의 과정을 아주 날카롭게 분석해 주고 있죠.","hl":"f2"},{"n":7,"text":"마지막 결론에서는 판단을 바꾸면 감정도 바뀐다는 실천법을 제시합니다. 이건 단순히 감정을 억누르는 게 아니라, 내가 나 자신에게 들려주는 이야기를 점검하고 더 도움이 되는 쪽을 선택하는 능동적인 과정이라는 점을 강조하며 끝을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거 및 예시\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">감정이 \u003cb class=\"key\">판단\u003c/b>에서 비롯된다는 핵심 주장을 첫 문장에서 명확히 밝히며 시작합니다. 이후 구체적인 \u003cb class=\"key\">작동 \u003c/b>\u003cb class=\"key\">방식\u003c/b>과 비난, 실직이라는 \u003cb class=\"key\">예시\u003c/b>를 통해 주장을 뒷받침한 뒤, 마지막에 판단을 바꾸어 감정을 변화시키라는 \u003cb class=\"key\">실천적 \u003c/b>\u003cb class=\"key\">결론\u003c/b>을 제시합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>This (2)\u003c/b>\u003cspan>앞 문장의 내용을 지칭하며 독자의 공감을 유도\u003c/span>\u003cb>But (3)\u003c/b>\u003cspan>통념에 반대되는 스토아학파의 핵심 주장 도입\u003c/span>\u003cb>For example (6)\u003c/b>\u003cspan>추상적 설명을 구체적인 상황에 적용\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">emotions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">not random\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">judgments\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">not just automatic reactions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">interpret events\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">interpretation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">emotional response\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">story you tell yourself\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 주장과 근거, 그리고 예시로 이루어진 구조입니다. 첫 문장에서 핵심 주장을 던지는 두괄식 패턴을 보이면서도, 마지막 문장에서 다시 한번 그 의미를 정리해주고 있어 양괄식 구조로 볼 수도 있습니다.","hl":"ty"},{"n":9,"text":"논리의 흐름을 보여주는 신호어들을 찾아보세요. 세 번째 문장의 역접 접속사 벗은 통념을 뒤집고 스토아학파의 진짜 주장을 시작하죠. 6번의 포 이그잼플은 추상적인 철학 개념을 일상의 비난과 실직이라는 예시로 아주 쉽게 풀어서 설명해 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>fascinating\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매혹적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>empowering\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>힘을 주는\u003c/span>\u003c/div>\u003cdiv>\u003cb>insight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통찰\u003c/span>\u003c/div>\u003cdiv>\u003cb>Stoic philosophy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스토아 철학\u003c/span>\u003c/div>\u003cdiv>\u003cb>random\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>임의적인, 무작위의\u003c/span>\u003c/div>\u003cdiv>\u003cb>arise from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 생겨나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>judgment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>판단\u003c/span>\u003c/div>\u003cdiv>\u003cb>surprising\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>놀라운\u003c/span>\u003c/div>\u003cdiv>\u003cb>overwhelmed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>압도당한\u003c/span>\u003c/div>\u003cdiv>\u003cb>automatic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자동적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>reaction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>shape\u003c/b>\u003cem>동사\u003c/em>\u003cspan>형성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interpret\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해석하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>trigger\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>emotional response\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감정적 반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>criticize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비난하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>due to\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>perceive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unfair\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불공정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>threatening\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위협적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>devastated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>망연자실한\u003c/span>\u003c/div>\u003cdiv>\u003cb>define\u003c/b>\u003cem>동사\u003c/em>\u003cspan>규정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>worth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가치\u003c/span>\u003c/div>\u003cdiv>\u003cb>suppress\u003c/b>\u003cem>동사\u003c/em>\u003cspan>억누르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>examine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>점검하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>serve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도움이 되다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어 몇 개만 짚어볼까요? 판단을 뜻하는 저지먼트와 해석을 뜻하는 인터프리테이션은 이 글의 핵심 키워드입니다. 또 감정을 유발한다는 의미의 트리거라는 동사도 꼭 챙겨두셔야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">random\u003c/b>\u003cspan class=\"m\">임의적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">arbitrary\u003c/span>\u003cspan class=\"s\">aimless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deliberate\u003c/span>\u003cspan class=\"a\">systematic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">arise from\u003c/b>\u003cspan class=\"m\">~에서 발생하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stem from\u003c/span>\u003cspan class=\"s\">originate from\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">judgment\u003c/b>\u003cspan class=\"m\">판단\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">evaluation\u003c/span>\u003cspan class=\"s\">assessment\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">trigger\u003c/b>\u003cspan class=\"m\">유발하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">provoke\u003c/span>\u003cspan class=\"s\">induce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prevent\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">devastated\u003c/b>\u003cspan class=\"m\">망연자실한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">heartbroken\u003c/span>\u003cspan class=\"s\">distressed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">overjoyed\u003c/span>\u003cspan class=\"a\">ecstatic\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어 정리도 해봅시다. 임의적인이라는 뜻의 랜덤은 알비트러리와 바꿔 쓸 수 있어요. 감정을 유발하다라는 트리거는 프로보크라는 단어와 비슷하고요. 망연자실한이라는 뜻의 데바스테이티드는 시험에서 하트브로큰이나 디스트레스트로 유의어가 나올 수 있으니 주의 깊게 봐두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 매혹적이고 힘을 주는 통찰 중 하나는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">One \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">fascinating \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">empowering \u003c/span>\u003cspan class=\"tgt\">insights \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 스토아 철학에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Stoic \u003c/span>\u003cspan class=\"tgt\">philosophy \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 우리의 감정이 임의적이지 않다는 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">emotions \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">random\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 즉, 그것들은 우리의 판단으로부터 생겨난다.\u003c/span>\u003cspan class=\"en\">they arise from our judgments.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">스토아 철학에서 가장 매혹적이고 힘을 주는 통찰 중 하나는 우리의 감정이 임의적이지 않다는 것이다. 즉, 그것들은 우리의 판단으로부터 생겨난다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 감정이 통제 불가능한 우연이 아니라 우리의 \u003cb class=\"key\">판단\u003c/b>에 따른 결과라는 스토아 철학의 핵심 \u003cb class=\"key\">통찰\u003c/b>을 소개합니다. 감정의 발생 원인을 명확히 하여 우리가 감정을 조절할 수 있다는 \u003cb class=\"key\">가능성\u003c/b>을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : One [주어] + of the [복수 명사] + is [단수 동사] : \"통찰 중 하나는 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : be동사 + that [접속사] + S + V (완전한 문장) : \"우리의 감정이 임의적이지 않다는 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"One of the most fascinating and empowering insights, 가장 매혹적이고 힘을 주는 통찰 중 하나는.  in Stoic philosophy is,  스토아 철학에서.  that our emotions are not random,  우리의 감정이 임의적이지 않다는 것이다..  they arise from our judgments,  즉, 그것들은 우리의 판단으로부터 생겨난다.. 이 문장 전체를 해석하면, 스토아 철학에서 가장 매혹적이고 힘을 주는 통찰 중 하나는 우리의 감정이 임의적이지 않다는 것이다. 즉, 그것들은 우리의 판단으로부터 생겨난다.","hl":"m"},{"n":13,"text":"스토아 철학에서 말하는 아주 흥미롭고 우리에게 힘을 주는 통찰을 소개하고 있어요. 감정은 그냥 멋대로 생기는 게 아니라, 우리가 내리는 판단에서 비롯된다는 인과관계를 설명하는 핵심 문장입니다.","hl":"mn"},{"n":14,"text":"중요한 포인트가 두 가지예요. 첫 번째로 'One of' 뒤에는 'insights'처럼 복수 명사가 오지만, 문장의 진짜 주어는 'One'이라서 단수 동사 'is'를 쓴다는 점이 핵심입니다. 두 번째로 'that'은 문장 뒤에서 보어 역할을 하는 명사절 접속사로 쓰여 뒤에 완전한 문장이 이어집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 놀랍게 들릴 수 있다,\u003c/span>\u003cspan class=\"en\">This may \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sound \u003c/span>\u003cspan class=\"tgt\">surprising\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 특히 만약 당신이 ~해 본 적이 있다면\u003c/span>\u003cspan class=\"en\">especially if you've ever felt\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 압도당해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">overwhelmed\u003c/span> by\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 분노, 두려움 또는 슬픔에\u003c/span>\u003cspan class=\"en\">anger, fear, or sadness.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 특히 만약 당신이 분노, 두려움 또는 슬픔에 압도당해 본 적이 있다면 놀랍게 들릴 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 감정이 판단의 산물이라는 주장이 일반적인 \u003cb class=\"key\">통념\u003c/b>과는 다를 수 있음을 인정합니다. 강렬한 감정의 소용돌이 속에 있을 때는 그것이 \u003cb class=\"key\">자동적\u003c/b>으로 느껴지기 때문에 필자의 주장이 \u003cb class=\"key\">생소함\u003c/b>을 줄 수 있다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상태 유지 동사의 보어\u003c/span> : sound [감각동사] + surprising [형용사 보어] : \"놀랍게 들리다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 수동 의미\u003c/span> : felt [지각/상태동사] + overwhelmed [과거분사/보어] : \"압도당하는 것을 (느끼다)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"This may sound surprising, 이것은 놀랍게 들릴 수 있다.  especially if you've ever felt,  특히 만약 당신이 ~해 본 적이 있다면.  overwhelmed by,  압도당해.  anger, fear, or sadness,  분노, 두려움 또는 슬픔에. 이 문장 전체를 해석하면, 이것은 특히 만약 당신이 분노, 두려움 또는 슬픔에 압도당해 본 적이 있다면 놀랍게 들릴 수 있다.","hl":"m"},{"n":16,"text":"방금 한 말이 좀 당황스럽게 들릴 수도 있다는 점을 인정하는 문장이에요. 우리가 살면서 분노나 슬픔에 휩싸여 정신을 못 차렸던 경험을 떠올려 보면, 감정이 내 판단 때문이라는 말이 생소함을 줄 수 있기 때문이죠.","hl":"mn"},{"n":17,"text":"두 가지를 기억하세요. 첫 번째로 'sound' 뒤에는 감정을 나타내는 형용사 'surprising'이 보어로 와야 합니다. 두 번째로 'overwhelmed'는 주어인 'you'가 감정에 의해 수동의 의미로 압도된 상태를 나타내는 과거분사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 스토아학파는 가르쳤다\u003c/span>\u003cspan class=\"en\">But the Stoics \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">taught \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 감정이 ~이 아니라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">emotions \u003c/span>\u003cspan class=\"tgt\">aren't\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 단지 자동적인 반응이\u003c/span>\u003cspan class=\"en\">just automatic reactions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 스토아학파는 감정이 단지 자동적인 반응이 아니라고 가르쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 일반적인 생각과 달리 감정이 통제 불가능한 \u003cb class=\"key\">무의식적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>이 아님을 분명히 합니다. 'But'을 통해 앞의 의구심을 반박하며 스토아 철학의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">논지\u003c/b>를 다시 한번 확고히 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : taught [타동사] + that [접속사] + S + V (목적어절) : \"감정이 ~이 아니라고 가르쳤다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But the Stoics taught, 하지만 스토아학파는 가르쳤다.  that emotions aren't,  감정이 ~이 아니라고.  just automatic reactions,  단지 자동적인 반응이. 이 문장 전체를 해석하면, 하지만 스토아학파는 감정이 단지 자동적인 반응이 아니라고 가르쳤다.","hl":"m"},{"n":19,"text":"하지만 스토아학파 사람들은 단호하게 말합니다. 우리가 느끼는 감정이 자극에 따라 반사적으로 튀어나오는 그런 자동적 반응이 절대 아니라고 말이죠. 감정은 우리 마음의 작용이라는 거예요.","hl":"mn"},{"n":20,"text":"여기서 'that'은 'taught'라는 타동사의 목적어 역할을 하는 명사절을 이끄는 접속사로 쓰였습니다. 뒤에는 주어와 동사를 갖춘 문장이 와서 가르친 구체적인 내용 전체를 전달하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 형성된다\u003c/span>\u003cspan class=\"en\">They're shaped\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 우리가 사건을 해석하는지에 의해\u003c/span>\u003cspan class=\"en\">by \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">interpret\u003c/span> events.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 어떻게 우리가 사건을 해석하는지에 의해 형성된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 감정은 외부 사건에 의해 즉각적으로 생기는 것이 아니라, 우리의 \u003cb class=\"key\">해석\u003c/b> 과정을 거쳐 만들어진다는 것을 강조합니다. 결국 우리가 상황을 어떻게 바라보느냐에 따라 감정을 \u003cb class=\"key\">조절\u003c/b>할 수 있다는 논리의 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (명사절)\u003c/span> : 의문사(how) + 주어(we) + 동사(interpret) : \"어떻게 우리가 해석하는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">수동태\u003c/span> : be동사(are) + 과거분사(shaped) : \"형성된다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They're shaped, 그것들은 형성된다. by how we interpret events, 어떻게 우리가 사건을 해석하는지에 의해. 이 문장 전체를 해석하면, 그것들은 어떻게 우리가 사건을 해석하는지에 의해 형성된다.","hl":"m"},{"n":22,"text":"이 문장은 감정이 단순히 생기는 게 아니라 우리의 해석이라는 필터를 거쳐 만들어진다는 핵심 원리를 담고 있어요. 우리가 상황을 어떻게 보느냐에 따라 감정을 충분히 조절할 수 있다는 뜻이죠.","hl":"mn"},{"n":23,"text":"첫 번째로 are shaped 부분을 보세요. 감정은 누군가에 의해 만들어지는 것이니 수동태를 사용했습니다. 두 번째 포인트는 how we interpret입니다. 전치사 by 뒤에 명사 자리에 온 간접의문문인데요, 어순이 의문사, 주어, 동사 순서로 되어 있는지 꼭 확인해야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기에 그것이 작동하는 방식이 있다\u003c/span>\u003cspan class=\"en\">Here's how it works:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무언가가 발생하면\u003c/span>\u003cspan class=\"en\">something happens,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 그것이 무엇을 의미하는지 해석하고\u003c/span>\u003cspan class=\"en\">you interpret \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">means\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 해석은\u003c/span>\u003cspan class=\"en\">and that interpretation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감정적 반응을 일으킨다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">triggers\u003c/span> an emotional response.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여기에 그것이 작동하는 방식이 있다. 무언가가 발생하면, 당신은 그것이 무엇을 의미하는지 해석하고, 그 해석은 감정적 반응을 일으킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 감정이 발생하는 과정을 '사건-해석-반응'의 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>로 명확하게 보여주는 문장입니다. 감정의 진정한 원인은 사건 자체가 아니라 그 사이에 낀 \u003cb class=\"key\">판단\u003c/b>이라는 점을 시각화해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (명사절)\u003c/span> : 의문사(what) + 주어(it) + 동사(means) : \"그것이 무엇을 의미하는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 수 일치\u003c/span> : 단수 주어(that interpretation) + 단수 동사(triggers) : \"촉발한다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Here's how it works, 여기에 그것이 작동하는 방식이 있다. something happens, 무언가가 발생하면. you interpret what it means, 당신은 그것이 무엇을 의미하는지 해석하고. and that interpretation, 그리고 그 해석은. triggers an emotional response, 감정적 반응을 일으킨다. 이 문장 전체를 해석하면, 여기에 그것이 작동하는 방식이 있다. 무언가가 발생하면, 당신은 그것이 무엇을 의미하는지 해석하고, 그 해석은 감정적 반응을 일으킨다.","hl":"m"},{"n":25,"text":"감정이 생겨나는 과정을 단계별 인과 관계로 아주 친절하게 설명해주고 있네요. 사건이 바로 감정이 되는 게 아니라, 판단이라는 중간 다리를 거친다는 점이 핵심입니다.","hl":"mn"},{"n":26,"text":"중간에 what it means를 보면 타동사 interpret의 목적어로 간접의문문이 쓰였어요. 그리고 마지막에 triggers는 주어인 that interpretation이 3인칭 단수이기 때문에 동사에 s를 붙여서 수 일치를 해준 것에 주목하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어\u003c/span>\u003cspan class=\"en\">For example:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 누군가가 당신을 비난한다면\u003c/span>\u003cspan class=\"en\">If someone criticizes you,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 화가 날 수 있다\u003c/span>\u003cspan class=\"en\">you may feel angry\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 말 자체 때문이 아니라\u003c/span>\u003cspan class=\"en\">not due to the words themselves\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 그 언급을 인식하기 때문에\u003c/span>\u003cspan class=\"en\">but because you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">perceive \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">comment \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불공정하거나 위협적이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as\u003c/span> unfair or threatening.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 만약 누군가가 당신을 비난한다면, 당신은 그 말 자체 때문이 아니라 당신이 그 언급을 불공정하거나 위협적이라고 인식하기 때문에 화가 날 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비난을 받았을 때 화가 나는 이유는 '말' 때문이 아니라, 그 말을 나쁘게 받아들이는 나의 \u003cb class=\"key\">주관적 \u003c/b>\u003cb class=\"key\">인식\u003c/b> 때문이라는 구체적인 사례를 듭니다. 감정의 주도권이 외부에 있지 않고 \u003cb class=\"key\">내면\u003c/b>에 있음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 구조의 이해\u003c/span> : perceive + 목적어(the comment) + as + 목적격보어(unfair or threatening) : \"그 언급을 ...라고 인식하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">상관접속사의 변형 (A가 아니라 B다)\u003c/span> : not + [전치사구 A] + but + [절 B] : \"...때문이 아니라 ...때문에\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"For example, 예를 들어. If someone criticizes you, 만약 누군가가 당신을 비난한다면. you may feel angry, 당신은 화가 날 수 있다. not due to the words themselves, 그 말 자체 때문이 아니라. but because you perceive the comment, 당신이 그 언급을 인식하기 때문에. as unfair or threatening, 불공정하거나 위협적이라고. 이 문장 전체를 해석하면, 예를 들어, 만약 누군가가 당신을 비난한다면, 당신은 그 말 자체 때문이 아니라 당신이 그 언급을 불공정하거나 위협적이라고 인식하기 때문에 화가 날 수 있다.","hl":"m"},{"n":28,"text":"우리가 화가 나는 상황을 예로 들어서 감정의 진짜 원인을 설명하고 있어요. 화가 나는 건 그 사람의 나쁜 말 때문이 아니라, 내 머릿속에서 그 말을 주관적 인식으로 나쁘게 판단했기 때문이라는 거죠.","hl":"mn"},{"n":29,"text":"문장 구조에서 not due to와 but because가 연결된 부분을 잘 보세요. 원인이 앞의 것이 아니라 뒤의 것이라는 점을 강조하는 구조입니다. 또한 perceive A as B 패턴을 사용해서 목적어의 상태나 성질을 설명하고 있다는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 당신이 일자리를 잃는다면,\u003c/span>\u003cspan class=\"en\">If you lose a job,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 망연자실할 수 있다\u003c/span>\u003cspan class=\"en\">you might feel devastated\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 일자리 상실 때문만이 아니라\u003c/span>\u003cspan class=\"en\">not simply because of the job loss\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 믿기 때문에\u003c/span>\u003cspan class=\"en\">but because you \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 당신의 가치나 미래를 규정한다고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">defines\u003c/span> your worth or future.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 당신이 일자리를 잃는다면, 당신은 단지 일자리 상실 때문만이 아니라 그것이 당신의 가치나 미래를 규정한다고 믿기 때문에 망연자실할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사건 그 자체보다 그 사건에 부여하는 \u003cb class=\"key\">주관적 \u003c/b>\u003cb class=\"key\">해석\u003c/b>이 고통의 진짜 원인이 됨을 보여주는 구체적인 \u003cb class=\"key\">예시\u003c/b> 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that의 생략\u003c/span> : believe + [(that) + S + V] : \"그것이 ~을 규정한다고 믿다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">상관접속사 (not A but B)\u003c/span> : not (simply) [A: 전치사구] but [B: 절] : \"A 때문만이 아니라 B 때문에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"If you lose a job, 만약 당신이 일자리를 잃는다면. you might feel devastated, 당신은 망연자실할 수 있다. not simply because of the job loss, 단지 일자리 상실 때문만이 아니라. but because you believe, 당신이 믿기 때문에. it defines your worth or future, 그것이 당신의 가치나 미래를 규정한다고.. 이 문장 전체를 해석하면, 만약 당신이 일자리를 잃는다면, 당신은 단지 일자리 상실 때문만이 아니라 그것이 당신의 가치나 미래를 규정한다고 믿기 때문에 망연자실할 수 있다.","hl":"m"},{"n":31,"text":"일자리 상실이라는 사건 자체가 아니라, 그 사건이 내 가치를 결정한다는 주관적 해석을 감정적 반응의 근원으로 지적하는 예시 문장이에요.","hl":"mn"},{"n":32,"text":"첫 번째로 not simply because of와 but because를 눈여겨보세요. 단순한 원인이 아닌 부정적 해석이 진짜 원인임을 병렬 구조로 강조하고 있어요. 두 번째로 believe 뒤에는 명사절 접속사 that이 생략되어 문장을 목적어로 취하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 해석을 바꿔라,\u003c/span>\u003cspan class=\"en\">Change the judgment,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 당신은 그 감정을 바꾼다.\u003c/span>\u003cspan class=\"en\">and you change the emotion.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 해석을 바꿔라, 그러면 당신은 그 감정을 바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 판단을 통제함으로써 감정을 변화시킬 수 있다는 스토아 철학의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">요지\u003c/b>를 간결하게 요약한 \u003cb class=\"key\">결론\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">명령문 + and\u003c/span> : 명령문(V) ..., and + 주어 + 동사 : \"~해라, 그러면 ~할 것이다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Change the judgment, 그 해석을 바꿔라. and you change the emotion, 그러면 당신은 그 감정을 바꾼다.. 이 문장 전체를 해석하면, 그 해석을 바꿔라, 그러면 당신은 그 감정을 바꾼다.","hl":"m"},{"n":34,"text":"이 문장은 글 전체의 핵심 결론이에요. 판단을 바꾸면 감정도 조절할 수 있다는 스토아 철학의 요지를 아주 간결하게 보여주죠.","hl":"mn"},{"n":35,"text":"여기서 가장 중요한 건 명령문 뒤에 온 and예요. 무엇을 해라 그러면 어떠할 것이다라는 인과 관계를 나타내는 독특한 구조를 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 의미하는 것이 아니라\u003c/span>\u003cspan class=\"en\">This doesn't mean\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 어떻게 느끼는지를 억누르는 것을;\u003c/span>\u003cspan class=\"en\">suppressing \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 이야기를 점검하는 것을 의미한다\u003c/span>\u003cspan class=\"en\">it means examining the story\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 스스로에게 하는\u003c/span>\u003cspan class=\"en\">you tell yourself\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 하나를 선택하는 것을\u003c/span>\u003cspan class=\"en\">and choosing one\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신에게 더 도움이 되는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">serves \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">better\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 당신이 어떻게 느끼를지를 억누르는 것을 의미하는 것이 아니라, 그것은 당신이 스스로에게 하는 이야기를 점검하고 당신에게 더 도움이 되는 것을 선택하는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 감정 조절이 감정의 \u003cb class=\"key\">억제\u003c/b>가 아니라, 상황을 바라보는 \u003cb class=\"key\">내러티브의 \u003c/b>\u003cb class=\"key\">재구성\u003c/b>을 통해 능동적으로 이루어져야 함을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사(how) + 주어(you) + 동사(feel) : \"당신이 어떻게 느끼는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(one) + that(주격 관대) + 동사(serves) : \"당신에게 더 도움이 되는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동명사의 병렬 구조\u003c/span> : means + [동명사1] ... and [동명사2] : \"점검하는 것과 선택하는 것\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"This doesn't mean, 이것은 의미하는 것이 아니라. suppressing how you feel, 당신이 어떻게 느끼는지를 억누르는 것을;. it means examining the story, 그것은 이야기를 점검하는 것을 의미한다. you tell yourself, 당신이 스스로에게 하는. and choosing one, 그리고 하나를 선택하는 것을. that serves you better, 당신에게 더 도움이 되는.. 이 문장 전체를 해석하면, 이것은 당신이 어떻게 느끼를지를 억누르는 것을 의미하는 것이 아니라, 그것은 당신이 스스로에게 하는 이야기를 점검하고 당신에게 더 도움이 되는 것을 선택하는 것을 의미한다.","hl":"m"},{"n":37,"text":"감정을 무조건 억누르는 게 아니에요. 내가 나 자신에게 들려주는 해석, 즉 내러티브의 재구성을 통해 더 유익한 쪽을 선택하라는 뜻입니다.","hl":"mn"},{"n":38,"text":"첫 번째로 how you feel은 의문사 주어 동사 순서의 간접의문문이고요. 두 번째로 examining과 choosing이 and로 연결된 동명사 병렬 구조라는 점에 주목하세요. 마지막으로 주격 관계대명사 that이 선행사를 꾸며주는 형용사절 역할을 하고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>감정은 우연히 일어나는 것이 아니라 사건에 대한 개인의 \u003cb class=\"key\">판단\u003c/b>에서 비롯된다.\u003c/li>\u003cli>사건이 발생하면 이를 \u003cb class=\"key\">해석\u003c/b>하는 과정을 거치고, 그 해석이 \u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>을 유발한다.\u003c/li>\u003cli>비난이나 실직 같은 부정적 상황도 어떻게 \u003cb class=\"key\">인식\u003c/b>하느냐에 따라 느끼는 고통의 정도가 달라진다.\u003c/li>\u003cli>감정을 조절하려면 감정을 억누르기보다 자신에게 \u003cb class=\"key\">도움이 \u003c/b>\u003cb class=\"key\">되는 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 해석을 바꾸어야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Emotions are products of our cognitive judgments, and by re-evaluating our interpretations of events, we can manage our emotional responses.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">감정은 외부 사건에 의한 자동적인 반응이 아니라 개인의 \u003cb class=\"key\">판단\u003c/b>과 \u003cb class=\"key\">해석\u003c/b>에서 비롯되는 것이므로, 스스로의 생각을 점검함으로써 감정을 조절할 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 배운 내용을 정리하자면, 우리의 감정은 우리 손에 달려 있다는 겁니다. 무언가 나를 힘들게 할 때, 그 사건 자체가 아니라 내가 그걸 어떻게 해석하고 있는지 한 번만 점검해 보세요. 여러분에게 더 도움이 되는 해석을 선택하는 연습을 한다면 영어 성적뿐만 아니라 마음의 근육도 튼튼해질 거예요. 고생 많으셨습니다!","hl":null}]}]});</script></body></html>
