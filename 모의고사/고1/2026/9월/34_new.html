<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>34번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"34번","audioDir":"34_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">34번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>The Hidden Genius of the Human Body: The Subconscious Complexity of Running\u003c/h1>\u003ch2>인체에 숨겨진 천재성: 달리기의 무의식적 복잡성\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>달리기는 겉보기에 자연스럽고 쉬워 보이지만 사실 슈퍼컴퓨터도 감당 못 할 \u003cb class=\"key\">복잡한 \u003c/b>\u003cb class=\"key\">계산\u003c/b>의 결과이며, 우리는 \u003cb class=\"key\">무의식적 \u003c/b>\u003cb class=\"key\">지능\u003c/b>이 지배하는 이 과정을 온전히 이해하기보다 몸의 지혜로 수용해야 합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Running is a sophisticated physiological process driven by deep-seated unconscious intelligence that exceeds human conscious understanding and computational power.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 서른네 번째 지문을 함께 분석해 볼 거예요. 이 글은 우리가 매일 하는 달리기가 사실 얼마나 대단한 과학인지, 그리고 우리 몸이 얼마나 똑똑한지를 다루고 있어요. 먼저 요약을 하자면, 달리기는 겉보기에 단순해 보여도 실제로는 엄청난 계산이 필요한 무의식적 지능의 산물이라는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인류는 오랜 진화 과정을 통해 달리기에 최적화된 \u003cb class=\"key\">이족 \u003c/b>\u003cb class=\"key\">보행\u003c/b> (Bipedalism) 능력을 갖추게 되었습니다. 우리가 무의식중에 발을 내딛는 동작 하나에도 수만 가지의 \u003cb class=\"key\">신경 \u003c/b>\u003cb class=\"key\">신호\u003c/b> (Neural signals)와 근육의 협응이 필요합니다. 이는 마치 우리가 스마트폰 화면을 터치하는 것은 간단하지만, 그 내부에는 수천 줄의 \u003cb class=\"key\">소스 \u003c/b>\u003cb class=\"key\">코드\u003c/b> (Source code)가 복잡하게 얽혀 있는 것과 같습니다. 달리기도 마찬가지로 우리의 의식적인 \u003cb class=\"key\">뇌\u003c/b> (Brain)가 전부 파악할 수 없는 고차원적인 지능의 영역이며, 이를 \u003cb class=\"key\">생체 \u003c/b>\u003cb class=\"key\">역학\u003c/b> (Biomechanics)적으로 분석하려는 시도조차 몸의 본능적인 능력을 따라가기 어렵습니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 전에 배경지식을 좀 쌓아볼까요? 인류는 진화를 통해 두 발로 걷고 뛰는 이족 보행을 하게 되었어요. 그런데 이게 말처럼 쉬운 게 아닙니다. 우리가 한 걸음을 내딛을 때마다 수천 개의 근육과 신경이 소스 코드처럼 얽혀 작동하거든요. 마치 스마트폰 앱은 터치 한 번으로 끝나지만 내부 코딩은 복잡한 것과 같죠. 이런 생체 역학적인 시스템이 우리 DNA에 이미 저장되어 있다는 점이 핵심이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>부상에 대한 의문\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>달리기가 인간에게 매우 \u003cb class=\"key\">자연스러운\u003c/b> 행위임에도 불구하고 왜 쉽게 부상을 입는지에 대한 근본적인 의문을 던집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>달리기의 실체\u003csmall>본론 1 · 문장 2–4\u003c/small>\u003c/h4>\u003cp>달리기가 쉬워 보이는 이유는 우리 몸이 그것에 너무 \u003cb class=\"key\">능숙하기\u003c/b> 때문이며, 실제로는 슈퍼컴퓨터도 처리 못 할 \u003cb class=\"key\">엄청난 \u003c/b>\u003cb class=\"key\">계산\u003c/b>이 필요한 매우 복잡한 과정임을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>지식의 소재와 한계\u003csmall>본론 2 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>달리기 지식은 \u003cb class=\"key\">DNA와 \u003c/b>\u003cb class=\"key\">근섬유\u003c/b> 깊숙이 저장되어 있어 우리가 의식적으로 완벽히 설명할 수는 없지만, 몸은 이미 그 방법을 알고 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>몸의 지능 수용\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>감각을 활성화하고 몸이 가진 지능이 우리의 의식보다 더 뛰어나다는 사실을 받아들임으로써 달리기의 \u003cb class=\"key\">연금술\u003c/b>을 이해해 나갈 수 있다고 제안합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"자, 이제 지문의 논리적인 흐름을 단계별로 짚어보겠습니다.","hl":null},{"n":4,"text":"첫 번째로 첫 번째 문장에서는 질문을 던집니다. 우리 몸이 그렇게 똑똑하다면 왜 달리기처럼 자연스러운 일을 하다가 다치기도 하느냐는 의문을 제기하죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 두 번째에서 네 번째 문장에서는 그 해답의 실마리를 줍니다. 달리기가 쉬운 건 우리 몸이 너무 능숙하기 때문이지, 실제로는 슈퍼컴퓨터도 못 할 엄청난 계산이 뒤에서 일어나고 있다는 거예요.","hl":"f1"},{"n":6,"text":"세 번째로 다섯 번째와 여섯 번째 문장에서는 그 지능의 원천을 설명합니다. 달리기 지식은 DNA와 근섬유 속에 깊이 묻혀 있어서 우리가 말로 다 설명할 수는 없지만, 우리 몸은 분명히 그 방법을 알고 있다는 거죠.","hl":"f2"},{"n":7,"text":"마지막 일곱 번째 문장에서는 결론을 내립니다. 감각을 깨우고 우리 몸이 가진 신비로운 연금술을 믿으며 몸의 지혜를 받아들이는 것이 진정으로 달리기를 이해하는 길이라고 말합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">질문-답변 및 분석\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">1번 문장에서 부상이라는 \u003cb class=\"key\">역설적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 질문으로 던진 뒤, 2~4번 문장에서 그 이면의 복잡성을 설명합니다. 5번 문장에서 우리의 의식적 이해가 가진 \u003cb class=\"key\">한계\u003c/b>를 명시하며 핵심 주장을 펼치고, 마지막에 대안적 태도를 제시하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Why (1)\u003c/b>\u003cspan>질문 제기\u003c/span>\u003cb>On the one hand (2)\u003c/b>\u003cspan>대조적 측면 소개\u003c/span>\u003cb>Because (5)\u003c/b>\u003cspan>인과관계 및 근거 제시\u003c/span>\u003cb>That doesn't mean (6)\u003c/b>\u003cspan>오해 방지 및 논리 보강\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">running\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">running intelligence\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">running knowledge\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the alchemy of running\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Conscious Intelligence (의식적 지능)\u003c/th>\u003cth>Body's Wisdom (신체적 지능)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>설명하기 어려움 (cannot fully explain)\u003c/td>\u003ctd>DNA와 세포 속에 깊이 묻혀 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>슈퍼컴퓨터로도 계산 불가능\u003c/td>\u003ctd>엄청난 수의 계산을 능숙하게 처리함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 질문으로 시작해서 그 현상의 이면을 분석해주는 질문 답변 구조를 가지고 있어요. 특히 글의 중반부인 다섯 번째 문장에서 주제를 명확히 드러내는 중괄식 구조를 띠고 있습니다.","hl":"ty"},{"n":9,"text":"문장 속 신호어들을 잘 보세요. 2번의 온 더 원 핸드는 대조를 나타내고, 5번의 비코즈는 복잡성을 설명할 수 없는 이유를 논리적으로 뒷받침하죠. 또 6번의 댓 더즌트 민은 앞의 내용이 몸의 무지를 뜻하는 게 아니라는 점을 분명히 해줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>injured\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다친, 부상을 입은\u003c/span>\u003c/div>\u003cdiv>\u003cb>seemingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>겉보기에는\u003c/span>\u003c/div>\u003cdiv>\u003cb>natural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자연스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>on the one hand\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한편으로는\u003c/span>\u003c/div>\u003cdiv>\u003cb>administer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관리하다, 처리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enormous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>엄청난\u003c/span>\u003c/div>\u003cdiv>\u003cb>computation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>계산\u003c/span>\u003c/div>\u003cdiv>\u003cb>untethered\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매인 줄이 풀린, 자유로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>intelligence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지능\u003c/span>\u003c/div>\u003cdiv>\u003cb>conscious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의식적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>complicated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>복잡한\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagination\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상상\u003c/span>\u003c/div>\u003cdiv>\u003cb>be buried\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>묻혀 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>muscle fibre\u003c/b>\u003cem>명사\u003c/em>\u003cspan>근섬유\u003c/span>\u003c/div>\u003cdiv>\u003cb>DNA\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유전자 본체\u003c/span>\u003c/div>\u003cdiv>\u003cb>accept\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받아들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>complexity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>복잡성\u003c/span>\u003c/div>\u003cdiv>\u003cb>alchemy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연금술, 신비한 힘\u003c/span>\u003c/div>\u003cdiv>\u003cb>sense\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감각\u003c/span>\u003c/div>\u003cdiv>\u003cb>firing\u003c/b>\u003cem>동사\u003c/em>\u003cspan>활성화시키다, 발화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be capable of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 할 수 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ever will\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>언젠가 그러할 것\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 중요한 단어들을 몇 개 살펴볼게요. 겉보기에는이라는 뜻의 시밍리, 그리고 엄청난이라는 뜻의 이노머스를 기억하세요. 특히 연금술을 뜻하는 알케미는 여기에서 달리기의 신비로운 메커니즘을 비유적으로 표현한 단어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">enormous\u003c/b>\u003cspan class=\"m\">엄청난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"s\">vast\u003c/span>\u003cspan class=\"s\">immense\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">conscious\u003c/b>\u003cspan class=\"m\">의식적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">aware\u003c/span>\u003cspan class=\"s\">mindful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unconscious\u003c/span>\u003cspan class=\"a\">unaware\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">complicated\u003c/b>\u003cspan class=\"m\">복잡한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">complex\u003c/span>\u003cspan class=\"s\">intricate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003cspan class=\"a\">plain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accept\u003c/b>\u003cspan class=\"m\">받아들이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">admit\u003c/span>\u003cspan class=\"s\">acknowledge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">intelligence\u003c/b>\u003cspan class=\"m\">지능\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wisdom\u003c/span>\u003cspan class=\"s\">intellect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignorance\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어 정리도 해볼까요? 이노머스는 휴즈나 배스트와 바꿔 쓸 수 있고, 반대말은 타이니입니다. 복잡한을 뜻하는 컴플리케이티드는 컴플렉스와 동의어고 심플과 반대되죠. 이런 유의어들이 시험에 자주 나오니 꼭 챙겨두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 우리의 몸이 가장 잘 안다면,\u003c/span>\u003cspan class=\"en\">If our bodies know best,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 그들은 쉽게 다칠까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">easily \u003c/span>\u003cspan class=\"tgt\">injured\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 무언가를 할 때\u003c/span>\u003cspan class=\"en\">when we do \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달리기처럼 겉보기에 그렇게 자연스러운?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">seemingly \u003c/span>\u003cspan class=\"tgt\">natural\u003c/span> as running?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 우리의 몸이 가장 잘 안다면, 왜 그들은 우리가 달리기처럼 겉보기에 자연스러운 무언가를 할 때 쉽게 다칠까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 도입부로, \u003cb class=\"key\">몸의 \u003c/b>\u003cb class=\"key\">지능\u003c/b>이 최고라면 왜 부상을 당하는가라는 \u003cb class=\"key\">의문\u003c/b>을 던집니다. 이는 우리가 평소 인식하지 못하는 달리기의 \u003cb class=\"key\">복잡성\u003c/b>을 역설적으로 암시하는 질문입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문의 수동태\u003c/span> : [Why] + [be동사] + [주어] + [p.p.] : \"왜 그것들이 쉽게 다칠까\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 후치 수식\u003c/span> : [-thing/body/one] + [형용사구] : \"겉보기에 그렇게 자연스러운 무언가\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"If our bodies know best, 만약 우리의 몸이 가장 잘 안다면. why are they easily injured, 왜 그들은 쉽게 다칠까. when we do something, 우리가 무언가를 할 때. so seemingly natural as running?, 달리기처럼 겉보기에 그렇게 자연스러운?. 이 문장 전체를 해석하면, 만약 우리의 몸이 가장 잘 안다면, 왜 그들은 우리가 달리기처럼 겉보기에 자연스러운 무언가를 할 때 쉽게 다칠까?","hl":"m"},{"n":13,"text":"이 문장은 우리 몸의 지능이 최고라고들 하는데, 그럼 왜 다치는 걸까 하는 의문을 던지면서 글을 시작하고 있어요. 우리가 평소에 너무 당연하게 생각해서 미처 깨닫지 못하는 달리기의 복잡성을 역설적으로 암시하는 질문이죠.","hl":"mn"},{"n":14,"text":"먼저 something은 형용사가 뒤에서 수식하는 성질이 있어서 뒤에 나오는 형용사구가 뒤에서 수식하고 있다는 점이 중요해요. 그리고 주어인 우리 몸이 부상을 당하는 대상이니까 수동태인 are injured를 사용했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한편으로,\u003c/span>\u003cspan class=\"en\">On the one hand,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달리기는 매우 쉬워 보이지만,\u003c/span>\u003cspan class=\"en\">running \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">easy\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 오직 ~이기 때문이다\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">because\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 몸이 그것을 아주 잘하기\u003c/span>\u003cspan class=\"en\">our bodies are so very good at it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한편으로, 달리기는 매우 쉬워 보이지만, 그것은 오직 우리의 몸이 그것을 아주 잘하기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 달리기가 쉽게 느껴지는 이유가 그 활동 자체가 단순해서가 아니라, 우리 몸의 \u003cb class=\"key\">탁월한 \u003c/b>\u003cb class=\"key\">능력\u003c/b> 때문임을 설명합니다. 겉으로 보이는 \u003cb class=\"key\">쉬움\u003c/b>과 실제 내부의 \u003cb class=\"key\">숙련도\u003c/b> 사이의 관계를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 연결 동사\u003c/span> : [seem] + [형용사(보어)] : \"매우 쉬워 보인다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">원인을 나타내는 because절\u003c/span> : [That is] + [because + 주어 + 동사] : \"그것은 오직 ~이기 때문이다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"On the one hand, 한편으로. running seems very easy, 달리기는 매우 쉬워 보이지만. but that is only because, 그것은 오직 ~이기 때문이다. our bodies are so very good at it, 우리의 몸이 그것을 아주 잘하기. 이 문장 전체를 해석하면, 한편으로, 달리기는 매우 쉬워 보이지만, 그것은 오직 우리의 몸이 그것을 아주 잘하기 때문이다.","hl":"m"},{"n":16,"text":"달리기가 쉽게 느껴지는 건 그게 쉬워서가 아니라 우리 몸의 탁월한 능력 때문이라는 뜻이에요. 겉모습은 쉬워 보이지만 그 이면에는 우리 몸의 엄청난 숙련도가 숨어 있다는 점을 강조하고 있습니다.","hl":"mn"},{"n":17,"text":"첫 번째로 seem은 2형식 동사라서 뒤에 부사가 아니라 형용사 보어를 써야 한다는 점을 꼭 기억하세요. 그리고 that is because는 앞 내용에 대한 원인을 설명할 때 사용하는 아주 중요한 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구상의 가장 강력한 슈퍼 컴퓨터도\u003c/span>\u003cspan class=\"en\">The most powerful supercomputer on the planet\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄청난 수의 계산을 처리할 수 없다\u003c/span>\u003cspan class=\"en\">cannot administer the enormous number of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">computations \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달리는 데 필요한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">takes \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">run\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매인 줄이 풀린 채 두 다리로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">untethered\u003c/span>, on two legs.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">지구상의 가장 강력한 슈퍼 컴퓨터도 매인 줄이 풀린 채 두 다리로 달리는 데 필요한 엄청난 수의 계산을 처리할 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간의 달리기가 슈퍼컴퓨터도 감당하지 못할 정도로 \u003cb class=\"key\">엄청난 \u003c/b>\u003cb class=\"key\">연산\u003c/b>을 필요로 한다는 것을 비교를 통해 강조합니다. 특히 아무 도움 없이 \u003cb class=\"key\">이족 \u003c/b>\u003cb class=\"key\">보행\u003c/b>을 하는 것의 \u003cb class=\"key\">기술적 \u003c/b>\u003cb class=\"key\">난이도\u003c/b>를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : [명사] + [(which/that)] + [주어 + 동사] : \"달리는 데 필요한 계산\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문(형용사적 용법)\u003c/span> : [과거분사(p.p.)] : \"매인 줄이 풀린 채\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The most powerful supercomputer on the planet, 지구상의 가장 강력한 슈퍼 컴퓨터도. cannot administer the enormous number of computations, 엄청난 수의 계산을 처리할 수 없다. it takes to run, 달리는 데 필요한. untethered, on two legs, 매인 줄이 풀린 채 두 다리로. 이 문장 전체를 해석하면, 지구상의 가장 강력한 슈퍼 컴퓨터도 매인 줄이 풀린 채 두 다리로 달리는 데 필요한 엄청난 수의 계산을 처리할 수 없다.","hl":"m"},{"n":19,"text":"달리기가 얼마나 대단한 건지 슈퍼컴퓨터랑 비교하고 있어요. 아무런 지지대 없이 두 다리로만 균형을 잡고 달리는 이족 보행이 기술적으로 엄청난 연산을 필요로 한다는 뜻이죠.","hl":"mn"},{"n":20,"text":"computations 뒤에 it takes가 나오는데 이건 목적격 관계대명사가 생략된 구조예요. 그리고 untethered는 과거분사 형태로 쓰여 >\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 우리의 몸이 그것을 어떻게 하는지 모른다는 것을 의미하지는 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '설명할 수 없다'는 말이 '할 줄 모른다'는 뜻은 아니며, 우리 몸은 \u003cb class=\"key\">무의식적 \u003c/b>\u003cb class=\"key\">지능\u003c/b>을 통해 완벽히 수행하고 있다는 \u003cb class=\"key\">반전의 \u003c/b>\u003cb class=\"key\">강조\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사\u003c/span> : how + to + 동사원형 : \"그것을 하는 방법(어떻게 하는지)\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"That doesn't mean, 그것은 의미하지는 않는다. our bodies don't know how to do it, 우리의 몸이 그것을 어떻게 하는지 모른다는 것을. 이 문장 전체를 해석하면, 그것은 우리의 몸이 그것을 어떻게 하는지 모른다는 것을 의미하지는 않는다.","hl":"m"},{"n":28,"text":"우리가 말로 설명 못 한다고 해서 우리 몸이 바보라는 건 아니라는 뜻이죠. 몸은 이미 그 복잡한 메커니즘을 완벽하게 알고 실행하고 있다는 점을 강조하며 논리를 반전시킵니다.","hl":"mn"},{"n":29,"text":"여기서 how to do it이라는 표현에 주목하세요. 의문사 뒤에 to부정사가 붙어서 '하는 방법'이라는 뜻의 명사 덩어리가 되었습니다. know의 목적어로 아주 자연스럽게 쓰였죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 달리기의 연금술을 이해하는 쪽으로 더듬어 나아갈 수 있다\u003c/span>\u003cspan class=\"en\">We may feel our way towards understanding the alchemy of running\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 감각을 사용하는 법을 배움으로써,\u003c/span>\u003cspan class=\"en\">by learning how to use our senses,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 활성화하게 하고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">getting \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">firing\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들이 무엇을 할 수 있는지 봄으로써,\u003c/span>\u003cspan class=\"en\">and seeing \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">capable \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 우리의 몸이 달리기에 대해 더 잘 알고 있다는 것을 받아들임으로써\u003c/span>\u003cspan class=\"en\">and accepting that our bodies know more about running\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 장차 그러할 것보다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">ever \u003c/span>\u003cspan class=\"tgt\">will\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 우리의 감각을 사용하는 법을 배우고, 그것들을 활성화하게 하고, 그리고 그것들이 무엇을 할 수 있는지 봄으로써, 달리기의 연금술을 이해하고, 우리의 몸이 우리가 장차 그러할 것보다 달리기에 대해 더 잘 알고 있다는 것을 받아들이는 쪽으로 더듬어 나아갈 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 달리기의 복잡성을 의식적으로 완벽히 설명할 수는 없지만, \u003cb class=\"key\">감각\u003c/b>을 통해 몸의 \u003cb class=\"key\">본능적 \u003c/b>\u003cb class=\"key\">지능\u003c/b>을 신뢰하고 체득해 나가는 과정을 설명합니다. '연금술'은 논리로는 다 설명하기 힘든 몸의 \u003cb class=\"key\">신비로운 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 비유합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 get + 목적어 + 목적격 보어\u003c/span> : get + 목적어(them) + 목적격 보어(v-ing) : \"그것들을 활성화하게 하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사(what) + 주어(they) + 동사(are capable of) : \"그것들이 무엇을 할 수 있는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">대동사와 생략\u003c/span> : than + 주어 + 조동사(will) + [동사원형(know) 생략] : \"우리가 장차 그러할 것보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동명사 병렬 구조\u003c/span> : by + [v-ing①], [v-ing②], and [v-ing③], and [v-ing④] : \"배우고, 활성화하게 하고, 보고, 받아들임으로써\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"We may feel our way towards understanding the alchemy of running, 우리는 달리기의 연금술을 이해하는 쪽으로 더듬어 나아갈 수 있다. by learning how to use our senses, 우리의 감각을 사용하는 법을 배움으로써. getting them firing, 그것들을 활성화하게 하고. and seeing what they are capable of, 그리고 그것들이 무엇을 할 수 있는지 봄으로써. and accepting that our bodies know more about running, 그리고 우리의 몸이 달리기에 대해 더 잘 알고 있다는 것을 받아들임으로써. than we ever will, 우리가 장차 그러할 것보다.. 이 문장 전체를 해석하면, 우리는 우리의 감각을 사용하는 법을 배우고, 그것들을 활성화하게 하고, 그리고 그것들이 무엇을 할 수 있는지 봄으로써, 달리기의 연금술을 이해하고, 우리의 몸이 우리가 장차 그러할 것보다 달리기에 대해 더 잘 알고 있다는 것을 받아들이는 쪽으로 더듬어 나아갈 수 있다.","hl":"m"},{"n":31,"text":"이 문장은 우리가 달리기를 의식적으로 다 통제할 수는 없지만, 몸이 가진 신비로운 능력인 연금술을 신뢰해야 한다고 말해요. 우리의 감각을 깨우고 몸의 본능적 지능을 받아들일 때, 비로소 달리기의 복잡한 메커니즘을 진정으로 이해하게 된다는 결론입니다.","hl":"mn"},{"n":32,"text":"먼저 전치사 by 뒤에 네 개의 동명사구가 쉼표와 and로 이어진 병렬 구조에 주목하세요. 또 get 뒤에 목적어와 현재분사를 사용해서 감각이 활성화되는 능동적인 상태를 표현했고요. 마지막으로 will 뒤에는 know가 생략되어 있다는 점을 이해하면 해석이 훨씬 매끄러워집니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>달리기는 겉보기에는 쉬운 행위지만, 사실 인체가 매우 \u003cb class=\"key\">능숙하기\u003c/b> 때문입니다.\u003c/li>\u003cli>지구상의 어떤 슈퍼컴퓨터도 달리기에 필요한 \u003cb class=\"key\">복잡한 \u003c/b>\u003cb class=\"key\">계산\u003c/b>을 완벽히 수행할 수 없습니다.\u003c/li>\u003cli>달리기의 지능은 의식이 아닌 \u003cb class=\"key\">DNA와 \u003c/b>\u003cb class=\"key\">근섬유\u003c/b> 속에 깊이 내재되어 있습니다.\u003c/li>\u003cli>우리는 의식적 분석보다는 \u003cb class=\"key\">감각의 \u003c/b>\u003cb class=\"key\">활용\u003c/b>을 통해 몸의 지혜를 신뢰하고 배워야 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Running is a sophisticated physiological process driven by deep-seated unconscious intelligence that exceeds human conscious understanding and computational power.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">달리기는 겉보기에 자연스럽고 쉬워 보이지만 사실 슈퍼컴퓨터도 감당 못 할 \u003cb class=\"key\">복잡한 \u003c/b>\u003cb class=\"key\">계산\u003c/b>의 결과이며, 우리는 \u003cb class=\"key\">무의식적 \u003c/b>\u003cb class=\"key\">지능\u003c/b>이 지배하는 이 과정을 온전히 이해하기보다 몸의 지혜로 수용해야 합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"자, 오늘 지문 정리해봅시다. 달리기라는 지능은 우리의 의식보다 훨씬 깊은 곳에 있다는 것, 잊지 마세요. 우리 몸이 가진 복잡한 계산 능력을 신뢰하고 감각을 활용하는 게 중요하다는 결론이었습니다. 오늘도 고생 많으셨고, 복습 잊지 마세요!","hl":null}]}]});</script></body></html>
