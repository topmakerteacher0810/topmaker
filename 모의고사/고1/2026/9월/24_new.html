<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"24번","audioDir":"24_new_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">24번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>Embracing Uncertainty: The Art of Planning Without Rigidity\u003c/h1>\u003ch2>불확실성 수용하기: 경직되지 않은 계획의 기술\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인간은 \u003cb class=\"key\">불확실성\u003c/b>에 대한 두려움 때문에 계획의 완벽한 실현에 집착하지만, 진정으로 필요한 것은 계획을 세우되 결과가 달라질 수 있음을 인정하는 \u003cb class=\"key\">유연성\u003c/b>이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>We must learn to balance the necessity of planning with the flexibility to accept that outcomes may differ from our expectations.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 스물네 번째 지문을 함께 분석해 보겠습니다. 이 글은 우리가 미래를 설계할 때 반드시 가져야 할 마음가짐인 불확실성에 대한 수용을 다루고 있어요. 계획을 세우지 말라는 것이 아니라, 계획에 대한 우리의 태도를 어떻게 바꿔야 할지 명확한 요지를 전달하는 글입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간의 뇌는 생존을 위해 주변 환경을 \u003cb class=\"key\">예측(Prediction)\u003c/b>하려는 강한 본능을 가지고 있습니다. 불확실한 상황은 원시 시대부터 잠재적 위험으로 인식되었기에, 우리는 \u003cb class=\"key\">통제 \u003c/b>\u003cb class=\"key\">욕구(Need \u003c/b>\u003cb class=\"key\">for \u003c/b>\u003cb class=\"key\">control)\u003c/b>를 통해 불안을 해소하려 합니다. 마치 내비게이션이 경로를 재탐색하듯, 우리도 계획을 세우지만 실제 도로는 막힐 수 있다는 점을 받아들여야 합니다. 이러한 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">유연성(Mental \u003c/b>\u003cb class=\"key\">Flexibility)\u003c/b>은 현대 사회의 복잡한 변화 속에서 스트레스를 관리하는 핵심 역량입니다.\u003c/div>","segs":[{"n":2,"text":"우리 인간은 본능적으로 미래를 알고 싶어 합니다. 왜냐하면 모르는 것, 즉 불확실성은 우리 뇌에 생존을 위협하는 신호로 전달되기 때문이죠. 그래서 우리는 통제 욕구를 발휘해 모든 것을 예측 가능하게 만들려고 노력합니다. 하지만 삶은 우리 생각대로만 흘러가지 않기에, 이런 본능과 현실 사이의 간극을 이해하는 것이 아주 중요합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>통제 욕구와 불확실성\u003csmall>도입 및 문제 제기 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>통제하려는 욕구를 버리고 \u003cb class=\"key\">불확실성\u003c/b>에 맞서는 용기의 중요성을 언급하며, 인간이 모르는 상황에서 느끼는 \u003cb class=\"key\">두려움과 \u003c/b>\u003cb class=\"key\">경직성\u003c/b>을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>예측 가능성에 대한 집착\u003csmall>현상 분석 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>실제로는 거대한 불확실성 속에 살면서도 상황이 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능\u003c/b>하다고 믿고 싶어 하며, 계획이 그대로 실현되기를 \u003cb class=\"key\">절박하게\u003c/b> 바라는 모습을 묘사합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>계획과 실현의 차이\u003csmall>관점의 전환 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>계획 자체는 아름답고 긍정적인 것이지만, 계획을 세우는 행위와 그것이 반드시 \u003cb class=\"key\">열매를 \u003c/b>\u003cb class=\"key\">맺어야\u003c/b> 한다는 믿음은 별개임을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>과정으로서의 계획\u003csmall>권위자의 인용 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>아이젠하워의 말을 빌려 결과물인 계획보다 \u003cb class=\"key\">계획하는 \u003c/b>\u003cb class=\"key\">과정\u003c/b>이 중요함을 역설하며, 비유적으로 \u003cb class=\"key\">연필\u003c/b>로 계획을 쓰는 유연함을 제안합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>불확실성의 수용\u003csmall>결론 및 제언 · 문장 12–13\u003c/small>\u003c/h4>\u003cp>우리가 생각하는 일이 실제로 일어나지 않을 수도 있다는 점을 \u003cb class=\"key\">염두에 \u003c/b>\u003cb class=\"key\">두고\u003c/b>, 그 상황에 대해 \u003cb class=\"key\">최선\u003c/b>을 다해 수용하는 태도를 가질 것을 권합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 인간의 본능적 두려움에서 시작해, 우리가 가진 잘못된 집착을 지적하고, 마지막에 유연한 대안을 제시하는 논리적 구조를 가지고 있습니다.","hl":null},{"n":4,"text":"먼저 첫 번째에서 세 번째 문장까지는 통제 욕구를 내려놓는 것이 불확실성에 맞서는 용기임을 말합니다. 우리가 무언가를 모를 때 두려움을 느끼고 사고가 경직된다는 점을 짚어주고 있죠.","hl":"f0"},{"n":5,"text":"네 번째와 다섯 번째 문장에서는 우리가 실제로 막대한 불확실성 속에 살면서도, 마치 모든 것이 예측 가능한 것처럼 자신을 속이며 계획에 절박하게 매달리는 현상을 설명합니다.","hl":"f1"},{"n":6,"text":"6번부터 여덟 번째 문장에서는 분위기가 반전됩니다. 계획을 세우는 것 자체는 아름답고 좋지만, 그 계획이 반드시 열매를 맺어야 한다는 결과 중심적 사고에는 문제가 있다고 지적하죠.","hl":"f2"},{"n":7,"text":"9번부터 11번까지는 아이젠하워 대통령의 명언을 인용합니다. 계획이라는 결과물은 쓸모없을지 몰라도 계획을 짜는 과정은 모든 것이라는 점을 강조하며, 연필로 쓰는 유연함을 제안합니다.","hl":"f3"},{"n":8,"text":"마지막 열두 번째와 열세 번째 문장에서는 우리가 생각한 일이 일어나지 않을 수도 있다는 점을 명심하고, 그 사실을 의연하게 받아들이는 최선의 태도를 강조하며 마무리합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박 및 대안 제시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">인간이 불확실성을 두려워하여 계획에 집착한다는 \u003cb class=\"key\">일반적 \u003c/b>\u003cb class=\"key\">경향\u003c/b>을 먼저 제시한 후, 계획과 결과의 실현을 구분해야 한다는 \u003cb class=\"key\">필자의 \u003c/b>\u003cb class=\"key\">주장\u003c/b>을 후반부에 강조하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (8)\u003c/b>\u003cspan>계획의 필요성에서 집착의 위험성으로 화제 전환\u003c/span>\u003cb>Imagine if (10)\u003c/b>\u003cspan>구체적인 비유를 통한 대안 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">need for control\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">want to know\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">predictable\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cling to our plans\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">come to fruition\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">planning is everything\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pencil instead of ink\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Planning (계획하는 것)\u003c/th>\u003cth>Fruition (결과/실현)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>과정이자 준비로서 모든 것이 됨\u003c/td>\u003ctd>반드시 이루어져야 한다는 집착의 대상\u003c/td>\u003c/tr>\u003ctr>\u003ctd>연필로 쓰는 유연함\u003c/td>\u003ctd>잉크로 쓰는 고정됨\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 우리가 흔히 가지는 통념, 즉 계획은 반드시 이루어져야 한다는 생각에 의문을 던지는 통념 반박 구조입니다. 글의 마지막 부분에서 진정한 해결책을 제시하는 미괄식 구조를 취하고 있어요.","hl":"ty"},{"n":10,"text":"여덟 번째 문장의 역접 접속사 'But'이 아주 중요한 역할을 합니다. 여기서부터 계획과 실현을 구분하기 시작하죠. 또한 열 번째 문장의 'Imagine if'는 우리가 가져야 할 유연한 태도를 연필이라는 구체적인 비유를 통해 시각화해 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>let go of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>내려놓다, 버리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통제\u003c/span>\u003c/div>\u003cdiv>\u003cb>aware\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>알아차리는, 인식하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>gather\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모으다\u003c/span>\u003c/div>\u003cdiv>\u003cb>courage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>용기\u003c/span>\u003c/div>\u003cdiv>\u003cb>uncertainty\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불확실성\u003c/span>\u003c/div>\u003cdiv>\u003cb>frightened\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>두려워하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>inflexible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>경직된, 융통성 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>pretend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가장하다, ~인 척하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>predictable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>예측 가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>enormous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>막대한, 엄청난\u003c/span>\u003c/div>\u003cdiv>\u003cb>cling to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>매달리다, 집착하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결과가 나타나다, 판명되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>desperately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>절박하게, 필사적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>fruition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>열매, 결실, 실현\u003c/span>\u003c/div>\u003cdiv>\u003cb>worthless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쓸모없는, 가치 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>figuratively\u003c/b>\u003cem>부사\u003c/em>\u003cspan>비유적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>literally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>문자 그대로\u003c/span>\u003c/div>\u003cdiv>\u003cb>bear in mind\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>염두에 두다, 기억하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>try one's best\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>최선을 다하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어들이 많네요. 'fruition'은 열매를 맺는다는 결실이나 실현을 뜻하고, 'inflexible'은 굽히지 않는 경직된 태도를 말합니다. 특히 'bear in mind'는 무엇을 염두에 두다라는 필수 숙어이니 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">uncertainty\u003c/b>\u003cspan class=\"m\">불확실성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unpredictability\u003c/span>\u003cspan class=\"s\">instability\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">certainty\u003c/span>\u003cspan class=\"a\">predictability\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inflexible\u003c/b>\u003cspan class=\"m\">경직된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rigid\u003c/span>\u003cspan class=\"s\">stiff\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">flexible\u003c/span>\u003cspan class=\"a\">adaptable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fruition\u003c/b>\u003cspan class=\"m\">결실, 성취\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">realization\u003c/span>\u003cspan class=\"s\">fulfillment\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">failure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">worthless\u003c/b>\u003cspan class=\"m\">쓸모없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">useless\u003c/span>\u003cspan class=\"s\">valueless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">valuable\u003c/span>\u003cspan class=\"a\">precious\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cling to\u003c/b>\u003cspan class=\"m\">매달리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adhere to\u003c/span>\u003cspan class=\"s\">stick to\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003cspan class=\"a\">detach\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"불확실성을 뜻하는 'uncertainty'의 반대말은 'certainty'입니다. 또한 경직된이라는 뜻의 'inflexible'은 유연한이라는 뜻의 'flexible'과 반대되죠. 가치 없다는 뜻의 'worthless'는 'valuable'과 대조를 이룬다는 점도 챙겨둡시다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통제하려는 우리의 욕구를 내려놓는 것,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Letting \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> our need for control,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 알아차리는 것은,\u003c/span>\u003cspan class=\"en\">being aware,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 ~에 관한 것이다\u003c/span>\u003cspan class=\"en\">is a lot about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">용기를 모으는 일\u003c/span>\u003cspan class=\"en\">gathering the courage\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불확실성에 맞설.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">face\u003c/span> uncertainty.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">통제하려는 우리의 욕구를 내려놓는 것, 즉 알아차리는 것은, 매우 불확실성에 맞설 용기를 모으는 일에 관한 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 주제문으로, 모든 상황을 \u003cb class=\"key\">통제\u003c/b>하려는 집착을 버리고 현재를 \u003cb class=\"key\">알아차림\u003c/b>으로써 얻게 되는 \u003cb class=\"key\">불확실성\u003c/b>에 대한 용기를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [V-ing] ~ is : \"내려놓는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : courage + [to-v] : \"맞설\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Letting go of our need for control, 통제하려는 우리의 욕구를 내려놓는 것. being aware, 즉 알아차리는 것은. is a lot about, 매우 ~에 관한 것이다. gathering the courage, 용기를 모으는 일. to face uncertainty, 불확실성에 맞설.. 이 문장 전체를 해석하면, 통제하려는 우리의 욕구를 내려놓는 것, 즉 알아차리는 것은, 매우 불확실성에 맞설 용기를 모으는 일에 관한 것이다.","hl":"m"},{"n":14,"text":"이 문장은 글 전체의 핵심 주제예요. 우리가 모든 것을 내 마음대로 하려는 통제 욕구를 버리고 현재를 있는 그대로 받아들이는 알아차림을 실천하려면, 결국 불확실성이라는 두려움에 맞설 큰 용기가 필요하다는 뜻입니다.","hl":"mn"},{"n":15,"text":"첫 번째 포인트로 주어 자리에 동명사구인 Letting go가 쓰였고, 이게 쉼표 뒤의 being aware와 동격으로 연결되어 있어요. 두 번째로 to face는 바로 앞의 명사 courage를 꾸며주는 형용사적 용법으로 쓰였다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간은\u003c/span>\u003cspan class=\"en\">Human beings\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알고 싶어 한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인간은 알고 싶어 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간의 본성인 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>를 짧고 강렬하게 언급하며, 왜 우리가 불확실한 상황에서 \u003cb class=\"key\">불안\u003c/b>을 느끼는지 근본 원인을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : want + [to-v (목적어)] : \"알고 싶어 한다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Human beings, 인간은. want to know, 알고 싶어 한다.. 이 문장 전체를 해석하면, 인간은 알고 싶어 한다.","hl":"m"},{"n":17,"text":"인간은 본능적으로 주변 상황을 명확히 파악하고 싶어 하는 인지적 욕구를 가지고 있어요. 그래서 모르는 상태, 즉 불확실성을 견디기 힘들어하는 것이죠.","hl":"mn"},{"n":18,"text":"여기서는 want라는 동사 뒤에 목적어로 to know가 왔는데요. 동사의 목적어 역할을 하는 to부정사의 명사적 용법이라고 아주 쉽게 이해하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 알지 못할 때,\u003c/span>\u003cspan class=\"en\">When we don't know,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상황이 불확실할 때\u003c/span>\u003cspan class=\"en\">when things are uncertain,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 종종 두려움을 느끼고\u003c/span>\u003cspan class=\"en\">we often feel \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">frightened\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경직된다.\u003c/span>\u003cspan class=\"en\">and become \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">inflexible\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 알지 못할 때, 상황이 불확실할 때 우리는 종종 두려움을 느끼고 경직된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 정보가 부족한 \u003cb class=\"key\">불확실성\u003c/b>에 직면했을 때 인간이 보이는 본능적인 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>인 공포와 \u003cb class=\"key\">경직성\u003c/b>을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감정 유발 분사(과거분사)\u003c/span> : feel + [frightened (형용사/보어)] : \"두려움을 느끼는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">보어 형용사\u003c/span> : become + [inflexible (형용사/보어)] : \"경직된\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"When we don't know, 우리가 알지 못할 때. when things are uncertain, 상황이 불확실할 때. we often feel frightened, 우리는 종종 두려움을 느끼고. and become inflexible, 경직된다.. 이 문장 전체를 해석하면, 우리가 알지 못할 때, 상황이 불확실할 때 우리는 종종 두려움을 느끼고 경직된다.","hl":"m"},{"n":20,"text":"무언가를 알지 못하는 불확실한 상황이 닥치면 인간은 본능적으로 심리적 반응을 보여요. 바로 겁을 먹게 되고, 사고방식이 유연하지 못하게 굳어버리는 경직성을 보이게 된다는 설명입니다.","hl":"mn"},{"n":21,"text":"첫 번째로 feel이라는 감각동사 뒤에 우리가 감정을 느끼는 상태이므로 과거분사 형태인 frightened를 썼고요. 두 번째로 become 뒤에 주어의 상태를 설명하는 형용사 보어 inflexible이 와서 병렬을 이루고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 우리는 가장한다\u003c/span>\u003cspan class=\"en\">So we pretend\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상황이 더 예측 가능하다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">predictable\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로 그것들이 그러한 것보다\u003c/span>\u003cspan class=\"en\">than \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 실제로 살아가고 있음에도 불구하고\u003c/span>\u003cspan class=\"en\">even though we actually live\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 막대한 불확실성과\u003c/span>\u003cspan class=\"en\">with enormous uncertainty all the time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 우리가 항상 막대한 불확실성과 실제로 살아가고 있음에도 불구하고, 우리는 상황이 실제로 그것들이 그러한 것보다 더 예측 가능하다고 가장한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간은 심리적 안정을 위해 삶의 \u003cb class=\"key\">불확실성\u003c/b>을 부정하고, 상황을 실제보다 통제 가능한 것으로 \u003cb class=\"key\">가장하다\u003c/b>라는 태도를 보입니다. 객관적 현실과 우리의 주관적 믿음 사이의 \u003cb class=\"key\">괴리\u003c/b>를 설명하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절)\u003c/span> : pretend [타동사] + that [접속사] + S + V : \"상황이 더 예측 가능하다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대동사\u003c/span> : they [S] + are [대동사] : \"그것들이 실제로 그러한 것(예측 가능한 것)보다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"So we pretend, 그래서 우리는 가장한다. that things are more predictable, 상황이 더 예측 가능하다고. than they really are, 실제로 그것들이 그러한 것보다. even though we actually live, 우리가 실제로 살아가고 있음에도 불구하고. with enormous uncertainty all the time, 항상 막대한 불확실성과. 이 문장 전체를 해석하면, 그래서 우리가 항상 막대한 불확실성과 실제로 살아가고 있음에도 불구하고, 우리는 상황이 실제로 그것들이 그러한 것보다 더 예측 가능하다고 가장한다.","hl":"m"},{"n":23,"text":"우리는 늘 막대한 불확실성 속에 살고 있죠. 하지만 그 불안함을 견디기 힘들어서 상황이 실제보다 더 예측 가능하다고 스스로를 속이며 가장하다라는 태도를 취하게 됩니다. 현실과 믿음 사이의 괴리를 보여주죠.","hl":"mn"},{"n":24,"text":"첫 번째 포인트로 pretend의 목적어 자리에 접속사 that이 이끄는 명사절이 쓰여 완전한 문장이 연결되었습니다. 두 번째로 than 뒤의 are는 앞의 predictable을 대신하는 대동사 역할을 하므로 일반동사인 do를 쓰지 않도록 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 우리의 계획과 생각들에 매달린다\u003c/span>\u003cspan class=\"en\">We cling to our plans and ideas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상황이 어떻게 되어야 하는지에 대한\u003c/span>\u003cspan class=\"en\">about \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 어떻게 결과로 나타나야 하는지에 대해 매우 절박하게\u003c/span>\u003cspan class=\"en\">and turn out ever so desperately.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 상황이 어떻게 되어야 하고 어떻게 결과로 나타나야 하는지에 대한 우리의 계획과 생각들에 매우 절박하게 매달린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미래를 통제하고 싶은 욕구 때문에 자신이 정해놓은 \u003cb class=\"key\">계획\u003c/b>과 방식에 지나치게 \u003cb class=\"key\">집착\u003c/b>하며, 그것이 반드시 실현되어야 한다고 믿는 상태를 묘사합니다. \u003cb class=\"key\">절박하게\u003c/b>라는 표현을 통해 인간의 불안감을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사절)\u003c/span> : about [전치사] + how [의문사] + things [주어] + should be [동사] : \"상황이 어떻게 되어야 하는지에 대해\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"We cling to our plans and ideas, 우리는 우리의 계획과 생각들에 매달린다. about how things should be, 상황이 어떻게 되어야 하는지에 대한. and turn out ever so desperately, 그리고 어떻게 결과로 나타나야 하는지에 대해 매우 절박하게. 이 문장 전체를 해석하면, 우리는 상황이 어떻게 되어야 하고 어떻게 결과로 나타나야 하는지에 대한 우리의 계획과 생각들에 매우 절박하게 매달린다.","hl":"m"},{"n":26,"text":"우리는 상황이 우리가 정한 틀 안에서 흘러가야 한다는 생각에 집착합니다. 아주 절박하게 매달린다는 표현에서 미래를 통제하고 싶은 인간의 강박적인 욕구가 느껴지죠.","hl":"mn"},{"n":27,"text":"전치사 about 뒤에 how로 시작하는 간접의문문 덩어리가 두 개 연결되어 있습니다. 의문사, 주어, 동사의 어순이 지켜진 명사절이 전치사의 목적어 역할을 하고 있다는 점을 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 아무런 잘못도 없다\u003c/span>\u003cspan class=\"en\">And there's nothing wrong\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계획을 가지는 것에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">plans\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 계획을 가지는 것에는 아무런 잘못도 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글쓴이는 계획 자체를 부정하는 것이 아닙니다. 계획을 세우는 행위의 \u003cb class=\"key\">정당성\u003c/b>을 인정하며, 독자에게 계획 자체가 나쁜 것은 아니라는 \u003cb class=\"key\">안도감\u003c/b>을 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사\u003c/span> : with [전치사] + having [동명사] : \"계획을 가지는 것에는\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"And there's nothing wrong, 그리고 아무런 잘못도 없다. with having plans, 계획을 가지는 것에는. 이 문장 전체를 해석하면, 그리고 계획을 가지는 것에는 아무런 잘못도 없다.","hl":"m"},{"n":29,"text":"앞에서 집착에 대해 경고했지만, 그렇다고 계획을 세우는 것 자체가 나쁘다는 건 아닙니다. 계획의 정당성을 인정해주며 독자들에게 안도감을 주는 문장입니다.","hl":"mn"},{"n":30,"text":"전치사 with 뒤에 동사 have가 동명사 형태인 having으로 쓰였습니다. 전치사 뒤에는 목적어 역할을 할 수 있는 명사나 동명사만 올 수 있다는 원칙을 보여주는 쉬운 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각한다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 아주 아름다운 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it's\u003c/span> a beautiful thing.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그것이 아주 아름다운 것이라고 생각한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 '계획을 세우는 행위' 자체의 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 인정하는 문장입니다. 본격적인 비판이나 대조를 시작하기 전에 독자의 공감을 유도하는 \u003cb class=\"key\">완충\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : think [타동사] + (that [명사절 접속사]) + it is [S+V] : \"그것이 ~라고 생각한다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"I think, 나는 생각한다. it's a beautiful thing, 그것이 아주 아름다운 것이라고. 이 문장 전체를 해석하면, 나는 그것이 아주 아름다운 것이라고 생각한다.","hl":"m"},{"n":32,"text":"계획을 세우는 것 그 자체는 분명히 긍정적인 일이라는 뜻이에요. 무작정 계획이 나쁘다는 게 아니라 그 가치를 충분히 인정하면서 이야기를 시작하고 있죠.","hl":"mn"},{"n":33,"text":"think라는 동사 뒤에 바로 주어와 동사가 나오고 있죠? 이 사이에는 목적어절을 이끄는 접속사 that이 생략되어 있다는 점을 꼭 체크하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 차이가 있다\u003c/span>\u003cspan class=\"en\">But there's a difference\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계획을 세우는 것과 생각하는 것 사이에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">planning \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">thinking \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세운 모든 계획이 열매를 맺어야 한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">plans \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> come to fruition.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 계획을 세우는 것과, 세운 모든 계획이 열매를 맺어야 한다고 믿는 것 사이에는 차이가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 핵심적인 \u003cb class=\"key\">대조\u003c/b>가 나타나는 문장입니다. 능동적인 '계획하기'와 결과에 대한 \u003cb class=\"key\">강박적 \u003c/b>\u003cb class=\"key\">집착\u003c/b>을 명확히 구분해야 함을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사의 목적어(병렬 구조)\u003c/span> : between + A (동명사) + and + B (동명사) : \"계획하는 것과 생각하는 것 사이에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 목적어절\u003c/span> : thinking (동명사) + (that) + S + V : \"모든 계획이 ~해야 한다고 생각하는 것\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"But there's a difference, 그러나 차이가 있다. between planning and thinking, 계획을 세우는 것과 생각하는 것 사이에는. all your plans have to come to fruition, 세운 모든 계획이 열매를 맺어야 한다고. 이 문장 전체를 해석하면, 그러나 계획을 세우는 것과, 세운 모든 계획이 열매를 맺어야 한다고 믿는 것 사이에는 차이가 있다.","hl":"m"},{"n":35,"text":"이 지문의 가장 중요한 대조 포인트예요. 단순히 준비를 하는 과정과, 그 결과가 꼭 성공해야 한다는 집착은 전혀 다른 문제라는 뜻이죠.","hl":"mn"},{"n":36,"text":"첫 번째로 between A and B 구조에서 동명사 두 개가 나란히 병렬 연결된 걸 보세요. 그리고 thinking 뒤에는 다시 한번 접속사 that이 생략된 채로 목적어 역할을 하는 긴 문장이 이어지고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국의 대통령 Eisenhower는\u003c/span>\u003cspan class=\"en\">American president Eisenhower\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한때 말했다\u003c/span>\u003cspan class=\"en\">once said:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘계획은 쓸모없지만,\u003c/span>\u003cspan class=\"en\">'\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Plans \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">worthless, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계획하는 것은 모든 것이다.’라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">planning \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">everything\u003c/span>.'\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미국의 대통령 Eisenhower는 한때 ‘계획은 쓸모없지만, 계획하는 것은 모든 것이다.’라고 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유명한 \u003cb class=\"key\">권위자\u003c/b>의 말을 인용하여 주장의 신뢰도를 높입니다. 고정된 결과물인 '계획'보다 유연하게 준비하는 \u003cb class=\"key\">과정\u003c/b>의 중요성을 역설합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 but을 이용한 대조\u003c/span> : S1 + V1, but + S2 + V2 : \"계획은 무가치하지만, 계획하는 과정은 전부이다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"American president Eisenhower, 미국의 대통령 Eisenhower는. once said, 한때 말했다. 'Plans are worthless, ‘계획은 쓸모없지만. but planning is everything.', 계획하는 것은 모든 것이다.’라고. 이 문장 전체를 해석하면, 미국의 대통령 Eisenhower는 한때 ‘계획은 쓸모없지만, 계획하는 것은 모든 것이다.’라고 말했다.","hl":"m"},{"n":38,"text":"아이젠하워라는 권위자의 말을 빌려와서 필자의 주장을 더 설득력 있게 만들고 있어요. 이미 정해진 종이 위의 계획보다, 상황에 맞춰 준비해 나가는 역동적인 과정이 훨씬 더 중요하다는 거죠.","hl":"mn"},{"n":39,"text":"접속사 but이 두 문장을 연결하며 명사 Plans와 행위를 나타내는 planning을 선명하게 대조하고 있어요. 이를 통해 과정의 중요성이라는 메시지를 아주 강렬하게 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상해 보라\u003c/span>\u003cspan class=\"en\">Imagine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 모두가 연필을 사용한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">used\u003c/span> pencil\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잉크 대신에\u003c/span>\u003cspan class=\"en\">instead of ink\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 달력과 플래너에 글을 쓰기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">write\u003c/span> in our calendars and planners.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 모두 우리의 달력과 플래너에 잉크 대신 연필로 글을 쓴다고 상상해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 한 번 쓰면 지울 수 없는 잉크 대신 수정 가능한 \u003cb class=\"key\">연필\u003c/b>을 사용하자는 제안은, 우리의 계획이 언제든 바뀔 수 있음을 인정하자는 비유입니다. 인생의 불확실성에 대비해 \u003cb class=\"key\">유연성\u003c/b>을 갖추어야 함을 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거\u003c/span> : if + 주어 + [과거동사(used)] : \"우리 모두가 사용한다고 (가정하면)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + [write (동사원형)] : \"글을 쓰기 위해\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Imagine, 상상해 보라. if we all used pencil, 우리 모두가 연필을 사용한다고. instead of ink, 잉크 대신에. to write in our calendars and planners, 우리의 달력과 플래너에 글을 쓰기 위해. 이 문장 전체를 해석하면, 우리가 모두 우리의 달력과 플래너에 잉크 대신 연필로 글을 쓴다고 상상해 보라.","hl":"m"},{"n":41,"text":"계획을 잉크로 쓴다는 건 절대 바꿀 수 없다는 고집을 의미하죠. 하지만 연필을 사용하자는 건 상황에 따라 계획을 바꿀 수 있는 유연성을 갖자는 비유적인 표현입니다.","hl":"mn"},{"n":42,"text":"첫 번째 포인트는 가정법 과거입니다. if 뒤에 과거형 동사 used를 써서 지금 당장 일어나는 일은 아니지만 한번 상상해 보자는 느낌을 주죠. 두 번째로 to write는 쓰기 위해서라는 목적을 나타내는 부사적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비유적으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Both \u003c/span>\u003cspan class=\"tgt\">figuratively \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 문자 그대로 둘 다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">literally\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비유적으로 그리고 문자 그대로 둘 다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수정 가능한 태도를 갖자는 \u003cb class=\"key\">비유적\u003c/b> 의미뿐만 아니라, 실제로도 계획을 수정할 수 있게 연필을 쓰라는 \u003cb class=\"key\">물리적\u003c/b> 의미를 동시에 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 Both A and B\u003c/span> : Both [A (부사)] and [B (부사)] : \"비유적으로도 그리고 문자 그대로도 둘 다\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Both figuratively, 비유적으로. and literally, 그리고 문자 그대로 둘 다. 이 문장 전체를 해석하면, 비유적으로 그리고 문자 그대로 둘 다.","hl":"m"},{"n":44,"text":"우리의 마음가짐도 연필처럼 유연해야 한다는 비유적인 뜻도 있고, 진짜로 연필을 써서 일정을 적으라는 실제적인 뜻도 모두 포함하고 있어요.","hl":"mn"},{"n":45,"text":"여기서는 Both A and B 구조가 쓰였네요. figuratively와 literally라는 두 부사가 병렬 구조로 연결되어 두 가지 성격을 동시에 강조하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 염두에 둘 수 있는지를 상상해 보라\u003c/span>\u003cspan class=\"en\">Imagine if we could \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">bear \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">mind \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 적어 놓는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">write \u003c/span>\u003cspan class=\"tgt\">down\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 생각하기에 일어날 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">happen\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로 일어나는 것이 아닐 수도 있다는 점을\u003c/span>\u003cspan class=\"en\">might not be what actually happens.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 우리가 적어 놓는 것, 우리가 생각하기에 일어날 것은 실제로 일어나는 것이 아닐 수도 있다는 점을 염두에 둘 수 있는지를 상상해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 계획한 일이 그대로 일어날 것이라는 \u003cb class=\"key\">확신\u003c/b>을 버리고, 현실은 예측과 \u003cb class=\"key\">다를 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있음\u003c/b>을 항상 기억하라는 조언입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : bear in mind + [that (접속사) + S + V] : \"~라는 점을 염두에 두다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : what + [주어 + 동사 (목적어 없음)] : \"우리가 적어 놓는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">삽입절을 포함한 관계대명사\u003c/span> : what + [we think (삽입절)] + is going to happen : \"우리가 생각하기에 일어날 것\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Imagine if we could bear in mind, 우리가 염두에 둘 수 있는지를 상상해 보라. that what we write down, 우리가 적어 놓는 것이. what we think is going to happen, 우리가 생각하기에 일어날 것이. might not be what actually happens, 실제로 일어나는 것이 아닐 수도 있다는 점을. 이 문장 전체를 해석하면, 우리는 우리가 적어 놓는 것, 우리가 생각하기에 일어날 것은 실제로 일어나는 것이 아닐 수도 있다는 점을 염두에 둘 수 있는지를 상상해 보라.","hl":"m"},{"n":47,"text":"우리가 플래너에 적은 계획과 우리 머릿속의 기대가 실제 현실과는 다를 수 있다는 사실을 항상 잊지 말라는 뜻이에요.","hl":"mn"},{"n":48,"text":"먼저 bear in mind 뒤의 that은 접속사로, 뒤에 긴 문장을 목적어로 끌고 옵니다. 그 안에 있는 what we write down은 우리가 적은 것이라는 의미의 관계대명사절이고요, 그 뒤의 what we think is going to happen은 우리 생각에 일어날 일이라는 뜻으로 삽입절이 포함된 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 우리가 ~할 수 있다면\u003c/span>\u003cspan class=\"en\">And \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최선을 다해 노력할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">try\u003c/span> our best\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">괜찮아지도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">right\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 대해.\u003c/span>\u003cspan class=\"en\">with that.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 그것에 대해 괜찮아지도록 우리가 최선을 다할 수 있는지.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 계획과 현실이 다를 수 있다는 \u003cb class=\"key\">불확실성\u003c/b>을 인정하고, 그 상황에 기꺼이 적응하려는 \u003cb class=\"key\">유연한 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 강조합니다. 12번 문장의 '명심하는 것'에서 한 걸음 나아가, 마음이 \u003cb class=\"key\">괜찮아지는\u003c/b> 감정적 수용의 단계를 제안하며 글을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거\u003c/span> : if + 주어 + 과거동사(could try) : \"우리가 노력할 수 있다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : try one's best + [to be (to부정사구)] : \"괜찮아지도록\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"And if we could, 그리고 우리가 ~할 수 있다면. try our best, 최선을 다해 노력할. to be all right, 괜찮아지도록. with that, 그것에 대해.. 이 문장 전체를 해석하면, 그리고 그것에 대해 괜찮아지도록 우리가 최선을 다할 수 있는지.","hl":"m"},{"n":50,"text":"이 문장은 우리의 계획이 실제 상황과 다를 수 있다는 불확실성을 기꺼이 받아들이자는 권유입니다. 완벽한 통제 대신 마음의 유연함을 갖는 것이 중요하다는 메시지로 글을 마무리하고 있어요.","hl":"mn"},{"n":51,"text":"먼저 이 문장은 앞의 Imagine에 연결되어 상상해 보라는 가정법 구조를 취하고 있습니다. 그리고 try one's best 뒤에 to부정사를 사용해서 우리가 도달해야 할 마음의 상태를 구체적으로 표현했고요. 마지막 단어 that은 앞서 말한 계획과 현실의 차이를 가리키는 대명사입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>인간은 \u003cb class=\"key\">불확실성\u003c/b>을 두려워하여 통제하려 하지만, 진정한 용기는 이를 마주하는 것에서 시작됩니다.\u003c/li>\u003cli>현실의 불확실성을 부정하고 모든 것이 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능\u003c/b>하다고 믿으며 계획에 집착하는 것은 본능적 반응입니다.\u003c/li>\u003cli>계획을 세우는 행위 자체는 가치 있으나, 모든 계획이 반드시 \u003cb class=\"key\">결실\u003c/b>을 맺어야 한다는 생각은 경계해야 합니다.\u003c/li>\u003cli>변화를 수용할 수 있도록 계획을 \u003cb class=\"key\">연필\u003c/b>로 쓰는 것처럼 유연한 마음가짐을 갖는 것이 최선입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>We must learn to balance the necessity of planning with the flexibility to accept that outcomes may differ from our expectations.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">인간은 \u003cb class=\"key\">불확실성\u003c/b>에 대한 두려움 때문에 계획의 완벽한 실현에 집착하지만, 진정으로 필요한 것은 계획을 세우되 결과가 달라질 수 있음을 인정하는 \u003cb class=\"key\">유연성\u003c/b>이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"자, 정리하자면 계획은 세우되 결과에 집착하지 않는 유연함이 핵심입니다. 여러분의 공부 계획도 때로는 수정될 수 있지만, 그 계획을 세우는 과정 자체가 이미 여러분을 성장시키고 있다는 점을 잊지 마세요. 오늘 강의 여기서 마칩니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
