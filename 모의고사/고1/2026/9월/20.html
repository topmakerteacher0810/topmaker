\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01적절한 재미</div><ul><li>학습 게임은 지나치게 재미있기보다 ‘충분히 재미있는(fun enough)’ 수준이어야 한다.</li><li>학습 게임(learning game)은 오락용 게임과 목적이 다름</li><li>재미(fun)는 필요하지만 과도하면 학습을 방해할 수 있음</li><li>핵심 키워드: 충분한 재미(fun enough)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02오락 추구의 문제</div><ul><li>많은 개발자들이 재미있는 게임을 만들려 하지만, 이는 학습을 더 어렵게 만들 수 있다.</li><li>상업용 게임(commercial game)처럼 흥미 위주로 설계하지 말아야 함</li><li>성공 기준은 재미가 아니라 학습 성과(learning outcomes)임</li><li>핵심 키워드: 학습 성과(learning outcomes)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03복잡성 줄이기</div><ul><li>규칙과 요소를 지나치게 많이 넣으려는 유혹을 피해야 한다.</li><li>많은 규칙(rules)은 학습자의 부담을 키울 수 있음</li><li>다양한 게임 요소(game elements)와 역동성(dynamics)을 과도하게 추가하지 않음</li><li>핵심 키워드: 단순한 설계(simple design)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04참여 중심 설계</div><ul><li>게임의 목표는 오락이 아니라 학습자와 내용 간의 상호작용과 참여를 높이는 것이다.</li><li>학습자는 능동적(active)으로 참여해야 함</li><li>중요한 것은 오락(entertainment)보다 참여(engagement)임</li><li>연구에 따르면 교육적 효과는 상호작용(interactivity) 수준과 관련됨</li><li>핵심 키워드: 상호작용과 참여(interactivity and engagement)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fun enough</td><td class=\"m\">충분히 재미있는, 학습을 방해하지 않을 만큼 적당히 재미있는</td></tr><tr><td class=\"w\">entertaining</td><td class=\"m\">재미있는, 즐겁게 해 주는</td></tr><tr><td class=\"w\">rather than</td><td class=\"m\">~라기보다는, ~대신에</td></tr><tr><td class=\"w\">achievement</td><td class=\"m\">성취, 달성, 업적</td></tr><tr><td class=\"w\">outcome</td><td class=\"m\">결과, 성과</td></tr><tr><td class=\"w\">resist the temptation to</td><td class=\"m\">~하고 싶은 유혹을 참다, ~하고 싶은 충동을 억누르다</td></tr><tr><td class=\"w\">a ton of</td><td class=\"m\">아주 많은, 다량의</td></tr><tr><td class=\"w\">pile on</td><td class=\"m\">많이 더하다, 잔뜩 얹다, 과도하게 추가하다</td></tr><tr><td class=\"w\">incorporate</td><td class=\"m\">포함하다, 통합하다, 결합하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dynamic</td><td class=\"m\">역학, 작동 방식, 상호작용 구조</td></tr><tr><td class=\"w\">engaging</td><td class=\"m\">몰입하게 하는, 흥미로운, 매력적인</td></tr><tr><td class=\"w\">focus on</td><td class=\"m\">~에 집중하다, ~에 초점을 맞추다</td></tr><tr><td class=\"w\">engagement</td><td class=\"m\">몰입, 참여, 관여</td></tr><tr><td class=\"w\">entertainment</td><td class=\"m\">오락, 즐거움, 여흥</td></tr><tr><td class=\"w\">interactivity</td><td class=\"m\">상호작용성, 쌍방향성</td></tr><tr><td class=\"w\">instructional</td><td class=\"m\">교육적인, 교육용의, 지시를 주는</td></tr><tr><td class=\"w\">parameter</td><td class=\"m\">기준, 한계, 조건</td></tr><tr><td class=\"w\">make sure</td><td class=\"m\">반드시 ~하다, 확인하다, 확실히 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">학습 게임은</span><span class=\"en\"><b><span class=\"grammar-hl\">Learning games</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">될 필요가 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">need to be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 ‘필요한 만큼 재미있는’이라 부르는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">what we call 'fun enough</span>.'</b></span></div></div><div class=\"lec-sent-ko\">학습 게임은 우리가 ‘필요한 만큼 재미있는’이라 부르는 것이 될 필요가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 기준을 먼저 제시합니다. 학습 게임은 재미가 어느 정도 필요하지만, 그 재미가 게임의 중심 목적이 될 만큼 과도할 필요는 없다는 뜻입니다. 뒤의 문장들은 왜 ‘매우 재미있는 게임’보다 ‘학습에 도움이 될 만큼 몰입되는 게임’이 중요한지를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">need to be (to부정사): need는 뒤에 to부정사를 목적어처럼 취해 need + to V 구조를 만든다. 여기서 to be는 learning games가 어떤 상태가 되어야 하는지를 보충한다.</div><div class=\"lec-gr-item\">what we call &#39;fun enough&#39; (관계대명사): what은 선행사를 포함한 관계대명사로, the thing which 정도의 구조이다. what we call &#39;fun enough&#39; 전체가 be의 보어 역할을 하는 명사절이다.</div><div class=\"lec-gr-item\">what we call &#39;fun enough&#39; (5형식(SVOC)): call은 call + O + C 구조로 쓰일 수 있다. 여기서는 what이 call의 목적어 역할을 하고, &#39;fun enough&#39;가 목적보어 역할을 한다.</div><div class=\"lec-gr-item\">Learning games 동명사(명사적 수식): learning이 games 앞에서 ‘학습이라는 활동/용도’를 나타내는 명사적 개념으로 쓰여 games를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fun enough</td><td class=\"m\">충분히 재미있는, 학습을 방해하지 않을 만큼 적당히 재미있는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 새로운 학습 게임 개발자는</span><span class=\"en\"><b>Many new learning-game developers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">설계하려고 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">try to design</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재미있는 게임을</span><span class=\"en\"><b><span class=\"grammar-hl\">an entertaining game</span>.</b></span></div></div><div class=\"lec-sent-ko\">많은 새로운 학습 게임 개발자는 재미있는 게임을 설계하려고 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 ‘충분한 재미’의 기준을 놓치기 쉬운 사람들로 초보 개발자를 제시합니다. 이들은 학습 게임을 만들면서도 상업용 오락 게임처럼 재미 자체를 크게 키우려는 경향이 있습니다. 이 문장은 뒤에서 비판할 일반적인 실수를 소개하는 역할을 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">try to design (to부정사): try는 뒤에 to부정사를 목적어로 취해 try + to V 구조를 만든다. to design an entertaining game이 ‘시도하는 내용’이다.</div><div class=\"lec-gr-item\">an entertaining game (현재분사(형용사)): entertaining이 game을 앞에서 수식한다. 수식받는 명사 game을 기준으로 ‘사람을 즐겁게 하는 성격의 game’이라는 의미의 형용사적 수식이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">entertaining</td><td class=\"m\">재미있는, 즐겁게 해 주는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">불행히도</span><span class=\"en\"><b>Unfortunately,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은</span><span class=\"en\"><b>that</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 만든다</span><span class=\"en\"><b>often <span class=\"grammar-hl\">makes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학습을</span><span class=\"en\"><b><span class=\"grammar-hl\">learning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 쉽게 라기보다는 오히려 더 어렵게</span><span class=\"en\"><b><span class=\"grammar-hl\">harder</span> <span class=\"grammar-hl\">rather than easier</span>.</b></span></div></div><div class=\"lec-sent-ko\">불행히도 그것은 종종 학습을 더 쉽게 라기보다는 오히려 더 어렵게 만든다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞 문장의 시도를 평가합니다. 재미 요소를 지나치게 넣으면 학습자가 핵심 내용을 익히는 데 써야 할 주의력이 게임 규칙이나 장식적 요소로 흩어질 수 있습니다. 교육용 게임에서는 재미가 학습을 돕는 장치여야 하며, 이 문장은 재미를 많이 넣는 방식이 오히려 학습 효과를 낮출 수 있음을 지적합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes learning harder (5형식(SVOC)): make + O + C 구조이다. learning이 목적어(O), harder가 목적보어(C)로 쓰여 목적어의 상태를 설명한다.</div><div class=\"lec-gr-item\">learning (동명사): learning은 make의 목적어 자리에 온 명사 역할의 -ing 형태이다. 여기서는 ‘학습하는 것/학습’이라는 명사 개념이다.</div><div class=\"lec-gr-item\">rather than easier (관용표현): rather than은 ‘A rather than B’ 구조로 두 요소를 대조한다. 여기서는 harder와 easier라는 비교급 형용사를 대조한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rather than</td><td class=\"m\">~라기보다는, ~대신에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기억하라,</span><span class=\"en\"><b>Remember,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 만들고 있는 것이 아니라는 것을</span><span class=\"en\"><b>you <span class=\"grammar-hl\">are not creating</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 다음의 훌륭한 상업용 게임을</span><span class=\"en\"><b>the next great commercial game</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 학습자를 즐겁게 하기 위한;</span><span class=\"en\"><b><span class=\"grammar-hl\">to entertain your learners</span>;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 만들고 있다</span><span class=\"en\"><b>you <span class=\"grammar-hl\">are creating</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학습 게임을</span><span class=\"en\"><b>a learning game</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 안에서 성공이</span><span class=\"en\"><b><span class=\"grammar-hl\">in which success</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">측정될</span><span class=\"en\"><b><span class=\"grammar-hl\">will be measured</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학습 성과의 달성에 의해</span><span class=\"en\"><b><span class=\"grammar-hl\">by the achievement of learning outcomes</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신은 당신의 학습자를 즐겁게 하기 위한 그 다음의 훌륭한 상업용 게임을 만들고 있는 것이 아니라는 것을 기억하라. 당신은 성공이 학습 성과의 달성에 의해 측정될 학습 게임을 만들고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 경고를 더 분명하게 정리하는 문장입니다. 학습 게임의 평가는 “얼마나 신났는가”보다 “학습자가 목표한 내용을 실제로 배웠는가”에 달려 있습니다. 교육 분야에서는 수업이나 프로그램의 성공을 학습 목표 달성 여부로 판단하는 경우가 많기 때문에, 개발자는 상업 게임 디자이너의 관점보다 교육 설계자의 관점을 가져야 한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are not creating (현재진행): be동사 are + -ing 형태로, 현재 진행 중이거나 현재 하고 있는 행위를 나타내는 구조이다. creating은 여기서 동명사나 현재분사로 따로 분석하지 않고 진행형의 일부로 본다.</div><div class=\"lec-gr-item\">to entertain your learners (to부정사): to entertain은 목적을 나타내는 부사적 용법으로 쓰였다. creating the next great commercial game이라는 행위가 무엇을 위한 것인지 보충한다.</div><div class=\"lec-gr-item\">are creating (현재진행): be동사 are + -ing 형태이다. 주어 you가 현재 하고 있는 행위를 나타내는 서술부 구조이다.</div><div class=\"lec-gr-item\">in which success will be measured by the achievement of learning outcomes (관계대명사): 전치사 + 관계대명사 + S + V 구조이다. in which 뒤에는 success will be measured by the achievement of learning outcomes처럼 주어+동사가 갖춰진 완전한 절(완전문장)이 온다. 이 관계대명사절은 a learning game을 수식한다.</div><div class=\"lec-gr-item\">will be measured by the achievement of learning outcomes (수동태): 조동사 will + be동사(be)+p.p.(measured) 구조이다. measure는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) will be measured 형태로 쓴다. 기본구조: measure + O 또는 measure + O + by 기준.</div><div class=\"lec-gr-item\">learning outcomes 동명사(명사적 수식): learning이 outcomes 앞에서 ‘학습이라는 활동/영역과 관련된’ 명사적 개념으로 쓰여 outcomes를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">achievement</td><td class=\"m\">성취, 달성, 업적</td></tr><tr><td class=\"w\">outcome</td><td class=\"m\">결과, 성과</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">유혹을 억제하라</span><span class=\"en\"><b><span class=\"grammar-hl\">Resist the temptation</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수많은 규칙을 만들고,</span><span class=\"en\"><b><span class=\"grammar-hl\">to create a ton of rules,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 게임 요소들을 쌓아 올리고,</span><span class=\"en\"><b><span class=\"grammar-hl\">pile on different game elements,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 다양한 역학을 포함하려는</span><span class=\"en\"><b><span class=\"grammar-hl\">and incorporate multiple dynamics</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">플레이어의 흥미를 높이기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to keep player interest high</span>.</b></span></div></div><div class=\"lec-sent-ko\">플레이어의 흥미를 높이기 위해 수많은 규칙을 만들고, 다른 게임 요소들을 쌓아 올리고, 다양한 역학을 포함하려는 유혹을 억제하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 구체적인 실천 지침을 줍니다. 개발자가 재미를 높이려고 규칙, 점수 체계, 경쟁 요소, 보상 장치 등을 많이 넣으면 게임은 복잡해지고 학습자는 배워야 할 내용보다 게임 구조를 이해하는 데 에너지를 쓰게 됩니다. 앞 문장에서 말한 ‘학습 성과 중심’이라는 기준을 실제 설계 과정에 적용하라는 조언입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Resist the temptation (명령문): 주어 you가 생략된 동사원형 Resist로 시작하는 명령문 구조이다. Resist가 문장의 핵심 동사이고 the temptation이 목적어이다.</div><div class=\"lec-gr-item\">to create a ton of rules, pile on different game elements, and incorporate multiple dynamics (to부정사): the temptation을 뒤에서 설명하는 형용사적 용법이다. to create, to pile on, to incorporate가 병렬 구조를 이루며, 뒤의 pile on과 incorporate 앞에는 to가 반복되지 않고 생략된 형태로 볼 수 있다.</div><div class=\"lec-gr-item\">a ton of rules (관용표현): a ton of는 수량을 강조하는 표현으로, 뒤에 복수명사 rules가 와서 ‘매우 많은 규칙’이라는 명사구를 만든다.</div><div class=\"lec-gr-item\">pile on different game elements (관용표현): pile on은 ‘많이 덧붙이다/쌓아 올리다’라는 의미의 구동사이다. 여기서는 pile on + O 구조로 different game elements가 목적어이다.</div><div class=\"lec-gr-item\">to keep player interest high (to부정사): to keep은 목적을 나타내는 부사적 용법이다. 앞의 create, pile on, incorporate 행위가 player interest를 high 상태로 유지하기 위한 것임을 나타낸다.</div><div class=\"lec-gr-item\">keep player interest high (5형식(SVOC)): keep + O + C 구조이다. player interest가 목적어(O), high가 목적보어(C)로 쓰여 목적어의 상태를 보충한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">resist the temptation to</td><td class=\"m\">~하고 싶은 유혹을 참다, ~하고 싶은 충동을 억누르다</td></tr><tr><td class=\"w\">a ton of</td><td class=\"m\">아주 많은, 다량의</td></tr><tr><td class=\"w\">pile on</td><td class=\"m\">많이 더하다, 잔뜩 얹다, 과도하게 추가하다</td></tr><tr><td class=\"w\">incorporate</td><td class=\"m\">포함하다, 통합하다, 결합하다</td></tr><tr><td class=\"w\">dynamic</td><td class=\"m\">역학, 작동 방식, 상호작용 구조</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그렇다,</span><span class=\"en\"><b>Yes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">게임은 참여를 이끌어야 하지만</span><span class=\"en\"><b>the game <span class=\"grammar-hl\">should be engaging</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가벼운 수준의 재미를 가지고,</span><span class=\"en\"><b><span class=\"grammar-hl\">with a mild level of fun</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 학습이</span><span class=\"en\"><b>but <span class=\"grammar-hl\">learning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목표가 되어야 한다.</span><span class=\"en\"><b><span class=\"grammar-hl\">should be the goal</span>.</b></span></div></div><div class=\"lec-sent-ko\">그렇다, 게임은 가벼운 수준의 재미를 가지고 참여를 이끌어야 하지만, 학습이 목표가 되어야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 균형을 잡아 줍니다. 글쓴이는 학습 게임이 지루해도 괜찮다고 말하는 것이 아니라, 학습자가 계속 참여할 정도의 재미는 필요하다고 봅니다. 다만 최종 목표는 즐거움 자체가 아니라 학습이므로, 재미는 학습 목표를 향해 학습자를 움직이게 하는 수단으로 배치되어야 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">should be engaging (현재분사(형용사)): engaging은 주격보어로 쓰여 the game의 성질을 설명한다. be + -ing 진행형이 아니라, be동사 뒤에서 형용사처럼 쓰인 분사형 보어이다.</div><div class=\"lec-gr-item\">learning should be the goal (동명사): learning은 문장의 주어 자리에 온 명사 역할의 -ing 형태이다. should be the goal은 조동사 should + 동사원형 be로 이루어진 서술부이다.</div><div class=\"lec-gr-item\">with a mild level of fun (전치사구): with + 명사구 구조로, engaging이라는 보어에 덧붙어 ‘어느 정도의 재미를 동반한’이라는 부가 정보를 제공한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">engaging</td><td class=\"m\">몰입하게 하는, 흥미로운, 매력적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">집중하라</span><span class=\"en\"><b><span class=\"grammar-hl\">Focus</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">참여에</span><span class=\"en\"><b><span class=\"grammar-hl\">on engagement</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오락이 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">rather than entertainment</span>.</b></span></div></div><div class=\"lec-sent-ko\">오락이 아니라 참여에 집중하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 핵심을 짧은 명령문으로 압축한 문장입니다. 여기서 중요한 것은 학습자가 웃고 즐기는 정도보다, 학습 내용과 계속 상호작용하며 생각하고 선택하고 반응하는 상태입니다. 이 문장은 글 전체의 설계 원칙을 가장 간단하게 표현합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Focus on engagement (관용표현): focus on은 ‘~에 집중하다’라는 전치사 결합 표현이다. 명령문이므로 주어 you가 생략되고 동사원형 Focus로 시작한다.</div><div class=\"lec-gr-item\">rather than entertainment (관용표현): rather than은 두 요소를 대조하는 표현이다. 여기서는 engagement와 entertainment라는 두 명사 요소를 대조한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rather than</td><td class=\"m\">~라기보다는, ~대신에</td></tr><tr><td class=\"w\">focus on</td><td class=\"m\">~에 집중하다, ~에 초점을 맞추다</td></tr><tr><td class=\"w\">engagement</td><td class=\"m\">몰입, 참여, 관여</td></tr><tr><td class=\"w\">entertainment</td><td class=\"m\">오락, 즐거움, 여흥</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게임 플레이의 목표는</span><span class=\"en\"><b><span class=\"grammar-hl\">The goals of the game play</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이어야 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">should be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상호작용성과 참여여야</span><span class=\"en\"><b><span class=\"grammar-hl\">interactivity and engagement</span>.</b></span></div></div><div class=\"lec-sent-ko\">게임 플레이의 목표는 상호작용성과 참여여야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 바로 앞 문장의 ‘몰입과 참여’를 더 구체화합니다. 학습자는 화면을 보기만 하는 사람이 아니라, 문제를 풀고 선택을 하고 피드백을 받으며 내용과 계속 관계를 맺어야 합니다. 게임 플레이의 목적은 화려한 재미를 제공하는 데서 끝나는 것이 아니라, 학습자가 활동적으로 학습 내용에 들어오게 만드는 데 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The goals of the game play should be interactivity and engagement (2형식(SVC)): The goals of the game play가 주어(S), should be가 동사(V), interactivity and engagement가 주격보어(C)이다. 보어가 주어의 내용을 설명한다.</div><div class=\"lec-gr-item\">should be 조동사 구조: should 뒤에는 동사원형이 와야 하므로 be가 쓰였다. should be는 ‘~이어야 한다’는 판단이나 당위의 의미를 만드는 조동사 + 동사원형 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">engagement</td><td class=\"m\">몰입, 참여, 관여</td></tr><tr><td class=\"w\">interactivity</td><td class=\"m\">상호작용성, 쌍방향성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">연구는 보여준다</span><span class=\"en\"><b>Research <span class=\"grammar-hl\">shows</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">게임을 교육적으로 만드는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">that what makes games instructional</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상호작용성과 참여의 수준임을</span><span class=\"en\"><b><span class=\"grammar-hl\">is the level of interactivity and engagement</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학습자가 갖는</span><span class=\"en\"><b>the learners have</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">콘텐츠와</span><span class=\"en\"><b>with the content.</b></span></div></div><div class=\"lec-sent-ko\">연구는 게임을 교육적으로 만드는 것은 학습자가 콘텐츠와 갖는 상호작용성과 참여의 수준임을 보여준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞의 주장을 연구 결과로 뒷받침합니다. 교육용 게임의 효과는 게임이 얼마나 재미있어 보이는지보다 학습자가 내용에 얼마나 적극적으로 반응하고 생각하는지와 관련됩니다. 글쓴이는 개인적 의견만 말하는 것이 아니라, 연구를 근거로 상호작용과 몰입의 중요성을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shows that what makes games instructional is the level of interactivity and engagement (명사절): that절이 shows의 목적어 역할을 한다. Research가 주어, shows가 동사, that절 전체가 목적어인 구조이다.</div><div class=\"lec-gr-item\">what makes games instructional (관계대명사): what은 선행사를 포함한 관계대명사로, what makes games instructional 전체가 that절 안의 주어 역할을 한다.</div><div class=\"lec-gr-item\">makes games instructional (5형식(SVOC)): make + O + C 구조이다. games가 목적어(O), instructional이 목적보어(C)로 쓰여 games의 성격을 보충한다.</div><div class=\"lec-gr-item\">the level of interactivity and engagement the learners have with the content (관계대명사): the level of interactivity and engagement 뒤에 목적격 관계대명사 that 또는 which가 생략된 구조이다. the learners have with the content가 앞의 명사구를 수식하며, 생략된 관계대명사는 have의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">engagement</td><td class=\"m\">몰입, 참여, 관여</td></tr><tr><td class=\"w\">interactivity</td><td class=\"m\">상호작용성, 쌍방향성</td></tr><tr><td class=\"w\">instructional</td><td class=\"m\">교육적인, 교육용의, 지시를 주는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러한 요인을 고려할 때,</span><span class=\"en\"><b><span class=\"grammar-hl\">Given those parameters</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보장하는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">making sure</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학습자가 참여하고 능동적인지를</span><span class=\"en\"><b><span class=\"grammar-hl\">the learners are engaged and active</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보다 훨씬 더 중요하다</span><span class=\"en\"><b>is <span class=\"grammar-hl\">far more important than</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보장하는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">making sure</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 즐거워하는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">they are entertained</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러한 요인을 고려할 때, 그들이 즐거워하는 것을 보장하는 것보다 학습자가 참여하고 능동적인지를 보장하는 것이 훨씬 더 중요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장은 글의 결론입니다. 앞에서 제시한 기준, 즉 학습 성과·상호작용·몰입을 종합하면 개발자가 가장 신경 써야 할 일은 학습자가 적극적으로 배우게 만드는 것입니다. 학습 게임에서 즐거움은 필요하지만, 성공의 핵심은 학습자가 내용에 참여하고 실제로 배움에 도달하는 데 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Given those parameters (분사구문): 과거분사 Given으로 시작하는 부사적 표현이다. 원래 절로 풀면 if we are given those parameters 정도로 볼 수 있으며, 뒤 절 전체의 조건이나 전제를 나타낸다.</div><div class=\"lec-gr-item\">making sure the learners are engaged and active (동명사): making sure 전체가 문장의 주어 역할을 한다. making sure 뒤에는 the learners are engaged and active라는 내용절이 이어져 ‘확인하는 내용’을 나타낸다.</div><div class=\"lec-gr-item\">are engaged and active (수동태): be동사(are)+p.p.(engaged) 구조와 형용사 active가 함께 보어 역할을 한다. engage는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) are engaged 형태로 쓴다. 기본구조: engage + O 또는 engage + O + in/with 대상.</div><div class=\"lec-gr-item\">far more important than (비교구문): more important than 구조로 두 대상을 비교한다. far는 비교급 more important를 강조하는 부사이다.</div><div class=\"lec-gr-item\">making sure they are entertained (동명사): making sure가 than 뒤에서 앞의 making sure the learners are engaged and active와 병렬을 이루는 명사 역할의 -ing 구이다.</div><div class=\"lec-gr-item\">are entertained (수동태): be동사(are)+p.p.(entertained) 구조이다. entertain은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) are entertained 형태로 쓴다. 기본구조: entertain + O.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">parameter</td><td class=\"m\">기준, 한계, 조건</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>학습 게임은 지나치게 재미있을 필요 없이, 학습을 돕기에 충분히 재미있으면 된다.</li><li>초보 개발자들은 오락성을 높이려다 오히려 학습을 방해할 수 있다.</li><li>학습 게임의 성공은 재미가 아니라 학습 성과 달성으로 판단된다.</li><li>규칙과 게임 요소를 과하게 넣기보다, 학습자의 상호작용과 몰입을 높이는 데 집중해야 한다.</li><li>연구도 학습 내용과의 적극적인 상호작용이 교육용 게임의 핵심임을 보여 준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Learning games should be fun enough but focused on engagement and interactivity to achieve learning outcomes.</div>\n              <div class=\"lec-final-sum-ko\">학습 게임은 충분히 재미있어야 하지만 학습 성과를 달성하기 위해 몰입과 상호작용에 초점을 맞추어야 한다.</div></div></div>"],"segs":[[{"audio":"./20_audio/1.mp3","hl":null}],[{"audio":"./20_audio/2.mp3","hl":null}],[{"audio":"./20_audio/3.mp3","hl":null},{"audio":"./20_audio/4.mp3","hl":"stage-0"},{"audio":"./20_audio/5.mp3","hl":"stage-1"},{"audio":"./20_audio/6.mp3","hl":"stage-2"},{"audio":"./20_audio/7.mp3","hl":"stage-3"}],[{"audio":"./20_audio/8.mp3","hl":null}],[{"audio":"./20_audio/9.mp3","hl":"main"},{"audio":"./20_audio/10.mp3","hl":"meaning"},{"audio":"./20_audio/11.mp3","hl":"grammar"}],[{"audio":"./20_audio/12.mp3","hl":"main"},{"audio":"./20_audio/13.mp3","hl":"meaning"},{"audio":"./20_au
