le\">Beyond Positive Thinking: Aligning Beliefs with Desires<small>긍정적 사고를 넘어: 욕망과 신념의 일치</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">끌어당김의 법칙(Law of Attraction)은 ‘비슷한 에너지가 비슷한 결과를 끌어온다’는 자기계발 분야의 개념으로, 긍정적 사고(Positive Thinking), 시각화(Visualization), 확언(Affirmation) 같은 방법과 자주 연결됩니다. 다만 심리학적으로 보면 단순히 원하는 장면을 떠올리는 것보다 자신이 무엇을 믿고 어떤 행동을 선택하게 되는지가 더 중요하며, 이는 자기효능감(Self-efficacy)이나 신념 체계(Belief System)와 관련이 깊습니다. 예를 들어 “나는 성공하고 싶다”고 매일 말해도 마음속에 “나는 부족해”라는 제한적 신념(Limiting Belief)이 강하면, 좋은 기회가 와도 스스로 피하거나 의심할 수 있습니다. 그래서 이 글을 이해하려면 끌어당김을 마치 자석처럼 생각하되, 겉으로 하는 말보다 내면의 믿음이 자석의 세기와 방향을 정한다는 점을 떠올리시면 좋습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01끌어당김의 법칙 소개</div><ul><li>끌어당김의 법칙은 비슷한 것이 비슷한 것을 끌어당긴다고 설명한다.</li><li>긍정적 생각은 긍정적 결과를 가져온다고 봄</li><li>부정적 생각은 부정적 결과를 끌어올 수 있음</li><li>핵심 키워드: 끌어당김의 법칙(Law of Attraction)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02흔한 오해</div><ul><li>사람들은 단순히 생각하거나 상상하기만 하면 원하는 것이 실현된다고 오해한다.</li><li>원하는 것을 시각화(visualize)하면 충분하다고 믿음</li><li>생각(thoughts)만으로 현실이 바뀐다고 여김</li><li>핵심 키워드: 실현(manifest)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03더 강력한 요소</div><ul><li>생각과 말도 영향력이 있지만, 가장 강력한 끌어당김의 힘은 믿음 체계에 있다.</li><li>생각과 말은 자기 진동(vibration) 수준에서 작용함</li><li>믿음 체계(belief system)가 실제 끌어당김을 좌우함</li><li>핵심 키워드: 믿음 체계(belief system)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04내면의 믿음 점검</div><ul><li>겉으로 성공이나 사랑을 원해도 스스로 가치 있다고 믿지 않으면 그것을 끌어들이기 어렵다.</li><li>성공적인 직업(career)이나 사랑의 관계(relationship)를 원할 수 있음</li><li>자신이 충분하고 가치 있다고 믿지 않으면 장애가 생김</li><li>핵심 키워드: 자격 있음(deserving)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05제한적 믿음 바꾸기</div><ul><li>자신의 욕구와 충돌하는 제한적 믿음을 찾아 원하는 것과 일치하는 믿음으로 바꾸어야 한다.</li><li>욕구(desires)를 방해하는 제한적 믿음(limiting beliefs)을 확인함</li><li>원하는 것을 끌어당기도록 믿음을 개선(upgrade)함</li><li>핵심 키워드: 믿음 개선(upgrade beliefs)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hear of</td><td class=\"m\">~에 대해 듣다, ~의 존재를 알다</td></tr><tr><td class=\"w\">like attracts like</td><td class=\"m\">비슷한 것은 비슷한 것을 끌어당긴다, 유유상종이다</td></tr><tr><td class=\"w\">focus on</td><td class=\"m\">~에 집중하다, ~에 초점을 맞추다</td></tr><tr><td class=\"w\">bring about</td><td class=\"m\">~을 초래하다, ~을 일으키다</td></tr><tr><td class=\"w\">flaw</td><td class=\"m\">결함, 결점, 약점</td></tr><tr><td class=\"w\">think about</td><td class=\"m\">~에 대해 생각하다, ~을 고려하다</td></tr><tr><td class=\"w\">visualize</td><td class=\"m\">마음속에 그리다, 시각화하다</td></tr><tr><td class=\"w\">manifest</td><td class=\"m\">나타내다, 드러내다, 실현하다</td></tr><tr><td class=\"w\">vibration</td><td class=\"m\">진동, 파동, 기운</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">magnetic</td><td class=\"m\">자성을 띤, 강하게 끌어당기는, 매력적인</td></tr><tr><td class=\"w\">belief system</td><td class=\"m\">신념 체계, 믿음의 구조</td></tr><tr><td class=\"w\">affirm</td><td class=\"m\">단언하다, 확언하다, 긍정하다</td></tr><tr><td class=\"w\">worthy</td><td class=\"m\">가치 있는, 자격이 있는, 훌륭한</td></tr><tr><td class=\"w\">deserving</td><td class=\"m\">~을 받을 만한, 자격이 있는</td></tr><tr><td class=\"w\">challenging</td><td class=\"m\">도전적인, 어려운, 힘든</td></tr><tr><td class=\"w\">limiting belief</td><td class=\"m\">제한적 신념, 가능성을 제한하는 믿음</td></tr><tr><td class=\"w\">contradict</td><td class=\"m\">모순되다, 반박하다, 부정하다</td></tr><tr><td class=\"w\">in line with</td><td class=\"m\">~와 일치하여, ~에 부합하여</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아마</span><span class=\"en\"><b>Perhaps</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신은 끌어당김의 법칙을 들어본 적이 있을 것이다</span><span class=\"en\"><b>you <span class=\"grammar-hl\">have heard of the Law of Attraction</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 말한다</span><span class=\"en\"><b><span class=\"grammar-hl\">which states</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘같은 것은 같은 것을 끌어당긴다’고</span><span class=\"en\"><b><span class=\"grammar-hl\">that 'like attracts like'</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 긍정적 혹은 부정적 생각에 집중함으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">and that by focusing on positive or negative thoughts,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람은 긍정적 혹은 부정적 결과를 가져올 수 있다고</span><span class=\"en\"><b><span class=\"grammar-hl\">one can bring about positive or negative results</span>.</b></span></div></div><div class=\"lec-sent-ko\">아마 당신은 끌어당김의 법칙을 들어본 적이 있을텐데, 이는 ‘같은 것은 같은 것을 끌어당긴다’ 그리고 긍정적 혹은 부정적 생각에 집중함으로써 사람은 긍정적 혹은 부정적 결과를 가져올 수 있다고 말한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글은 먼저 독자가 익숙하게 느낄 만한 개념을 소개합니다. 여기서 끌어당김의 법칙은 사람이 어떤 생각에 집중하느냐에 따라 삶의 결과도 그 방향으로 움직인다는 믿음을 말합니다. 이 문장은 이후에 글쓴이가 이 법칙을 사람들이 어떻게 잘못 이해하는지 설명하기 위한 출발점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have heard of the Law of Attraction (관용표현): hear of는 전치사 of와 함께 쓰여 ‘~에 대해 들어 본 적이 있다’라는 하나의 동사구처럼 쓰인다. 현재완료 have heard가 경험을 나타내고, of the Law of Attraction이 전치사구로 뒤따른다.</div><div class=\"lec-gr-item\">which states that &#39;like attracts like&#39; and that by focusing on positive or negative thoughts, one can bring about positive or negative results (관계대명사): which는 앞의 the Law of Attraction을 선행사로 받으며, 관계대명사절 안에서 주어 역할을 한다. states가 동사이고, 뒤에 두 개의 that절이 병렬로 목적어 역할을 한다.</div><div class=\"lec-gr-item\">that &#39;like attracts like&#39; and that by focusing on positive or negative thoughts, one can bring about positive or negative results (that절): states의 목적어로 쓰인 명사절 두 개가 and로 연결된 구조이다. 첫 번째 that절은 &#39;like attracts like&#39;, 두 번째 that절은 by focusing... one can bring about...의 내용을 담는다.</div><div class=\"lec-gr-item\">by focusing on positive or negative thoughts (동명사): focusing은 전치사 by의 목적어로 쓰인 -ing 형태이므로 명사 역할을 하는 동명사이다. 구조는 by + 동명사 + 전치사구(on positive or negative thoughts)이다.</div><div class=\"lec-gr-item\">bring about positive or negative results (관용표현): bring about은 ‘일으키다/초래하다’ 의미의 구동사로, bring about + 목적어 구조를 이룬다. 여기서는 positive or negative results가 목적어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">like attracts like</td><td class=\"m\">비슷한 것은 비슷한 것을 끌어당긴다, 유유상종이다</td></tr><tr><td class=\"w\">bring about</td><td class=\"m\">~을 초래하다, ~을 일으키다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 법칙에 대한 우리의 이해에서 흔한 오류는</span><span class=\"en\"><b>The common flaw in our understanding of this law</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 믿는다는 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is that we believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 해야 할 전부가</span><span class=\"en\"><b><span class=\"grammar-hl\">all we have to do</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 것을 생각하거나 시각화하는 것이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">is think about or visualize something</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 명백히 하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to manifest it</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 법칙에 대한 우리의 이해에서 흔한 오류는 그것을 명백히 하기 위해 우리가 할 일은 어떤 것을 생각하거나 시각화하는 것이라 믿는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 소개한 끌어당김의 법칙에 대해 글쓴이는 사람들이 자주 빠지는 오해를 지적합니다. 많은 사람이 원하는 것을 머릿속으로 떠올리거나 그림처럼 상상하기만 하면 실제 삶에 나타난다고 생각한다는 뜻입니다. 이 문장은 글 전체의 문제 제기 역할을 하며, 뒤에서 왜 그것만으로는 충분하지 않은지 설명하게 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is that we believe all we have to do is think about or visualize something to manifest it (that절): be동사 is 뒤에서 that절이 주격보어 역할을 한다. 문장 주어 The common flaw의 내용을 that절이 설명하는 SVC 구조이다.</div><div class=\"lec-gr-item\">all we have to do (관계대명사): all 뒤에 목적격 관계대명사 that이 생략된 구조로 볼 수 있다. we have to do가 all을 수식하며, do의 목적어 자리가 선행사 all에 해당한다.</div><div class=\"lec-gr-item\">have to do (관용표현): have to는 ‘~해야 한다’라는 의무 의미를 만드는 준조동사 표현이다. 구조는 have to + 동사원형이며, 여기서는 do가 동사원형으로 쓰였다.</div><div class=\"lec-gr-item\">to do (to부정사): to do는 have 뒤에서 의무 표현 have to의 일부로 동사원형 do와 결합한다. 형태는 to + 동사원형이다.</div><div class=\"lec-gr-item\">is think about or visualize something 보어 구조: all we have to do is 뒤에는 보어로 동사원형 think about과 visualize가 병렬로 온다. all ... do is V 구조에서는 be동사 뒤의 to가 생략되어 동사원형이 쓰일 수 있다.</div><div class=\"lec-gr-item\">think about or visualize something (관용표현): think about은 전치사 about과 결합한 동사구이고, visualize는 타동사로 목적어 something을 직접 취한다. 두 동사구가 or로 병렬 연결되어 있다.</div><div class=\"lec-gr-item\">to manifest it (to부정사): to manifest it은 목적을 나타내는 부사적 용법의 to부정사이다. 구조는 to + 동사원형(manifest) + 목적어(it)이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">flaw</td><td class=\"m\">결함, 결점, 약점</td></tr><tr><td class=\"w\">think about</td><td class=\"m\">~에 대해 생각하다, ~을 고려하다</td></tr><tr><td class=\"w\">visualize</td><td class=\"m\">마음속에 그리다, 시각화하다</td></tr><tr><td class=\"w\">manifest</td><td class=\"m\">나타내다, 드러내다, 실현하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실이다</span><span class=\"en\"><b><span class=\"grammar-hl\">It is true</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 끌어당긴다는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">that we attract</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 진동 수준에 따라</span><span class=\"en\"><b><span class=\"grammar-hl\">at the level of our own vibration</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리의 생각과 말이 매우 강한 자기력을 지니고 있다는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">and that our thoughts and words are extremely magnetic</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리가 자신의 진동 수준에 따라 끌어당기며, 우리의 생각과 말이 매우 강한 자기력을 지니고 있다는 점은 사실이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이는 앞 문장의 오해를 지적한 뒤, 생각과 말의 힘 자체는 인정합니다. 자기계발 분야에서 ‘진동’은 한 사람이 평소 품고 있는 감정 상태, 태도, 에너지의 방향을 가리키는 식으로 쓰입니다. 즉 사람의 생각과 말이 삶의 선택, 행동, 주변 사람과의 관계에 영향을 준다는 점을 받아들이면서도, 다음 문장에서 더 중요한 요소가 있다고 이어 갑니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is true that we attract at the level of our own vibration and that our thoughts and words are extremely magnetic (가주어): 진주어: It은 형식상 주어인 가주어이고, 실제 주어는 뒤의 that절 두 개이다. 구조는 It + be동사 + 형용사 + that절이며, 여기서는 that we attract...와 that our thoughts and words are...가 and로 병렬 연결되어 진주어 역할을 한다.</div><div class=\"lec-gr-item\">that we attract at the level of our own vibration and that our thoughts and words are extremely magnetic (that절): 두 개의 that절이 and로 연결되어 true의 실제 내용 역할을 한다. 첫 번째 절의 동사는 attract이고, 두 번째 절의 동사는 are이다.</div><div class=\"lec-gr-item\">our thoughts and words are extremely magnetic SVC 구조: our thoughts and words가 주어, are가 연결동사, extremely magnetic이 주격보어이다. extremely는 형용사 magnetic을 수식하는 부사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">vibration</td><td class=\"m\">진동, 파동, 기운</td></tr><tr><td class=\"w\">magnetic</td><td class=\"m\">자성을 띤, 강하게 끌어당기는, 매력적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 가장 강력한 끌어당기는 것은</span><span class=\"en\"><b>But <span class=\"grammar-hl\">the most powerful attractor</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 신념 체계이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is our belief system</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 가장 강력한 끌어당기는 것은 우리의 신념 체계이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞 문장에서 인정한 생각과 말의 힘보다 더 깊은 층위가 있음을 강조합니다. 글쓴이는 사람이 겉으로 긍정적인 말을 해도, 마음 깊은 곳에서 자신에 대해 무엇을 믿는지가 실제 삶에 더 큰 영향을 준다고 봅니다. 여기서 논지가 생각과 시각화에서 내면의 믿음 체계로 전환됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the most powerful attractor is our belief system SVC 구조: the most powerful attractor가 주어, is가 연결동사, our belief system이 주격보어이다. 보어가 주어의 정체를 설명하는 명사구로 쓰였다.</div><div class=\"lec-gr-item\">the most powerful attractor 최상급 구조: most powerful은 형용사 powerful의 최상급 형태로, 명사 attractor를 앞에서 수식한다. the + most + 형용사 + 명사 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">belief system</td><td class=\"m\">신념 체계, 믿음의 구조</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 아름다운 포스터 보드를 만들 수 있다</span><span class=\"en\"><b>You can create beautiful poster boards</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 원하는 것들의 이미지로 가득 찬</span><span class=\"en\"><b>full of images of <span class=\"grammar-hl\">what you want</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 확언할 수 있다</span><span class=\"en\"><b>and affirm</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b>every day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 열려 있다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that you are available</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀라울 만큼 성공적이고 열정적인 경력 혹은 사랑이 있는 관계에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">for an incredibly successful, passionate career or a loving relationship</span>;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 만약 당신이 진정으로 믿지 않는다면</span><span class=\"en\"><b>but <span class=\"grammar-hl\">if you don't truly believe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 충분하고, 가치 있고, 사랑받을 만하고, 그럴 자격이 있다고</span><span class=\"en\"><b><span class=\"grammar-hl\">you are enough, worthy, lovable, and deserving</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면 훌륭한 경력이나 관계를 끌어들이는 일은</span><span class=\"en\"><b>then <span class=\"grammar-hl\">attracting a great career or relationship</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 삶 속으로</span><span class=\"en\"><b><span class=\"grammar-hl\">into your life</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 어려울 수도 있다</span><span class=\"en\"><b>may be <span class=\"grammar-hl\">more challenging</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신이 원하는 것들의 이미지로 가득 찬 아름다운 포스터 보드를 만들고, 놀라울 만큼 성공적이고 열정적인 경력 혹은 사랑하고 있는 관계를 누릴만 하다고 매일 확언할 수 있다. 하지만 스스로가 충분하고, 가치 있고, 사랑받을 만하고, 그럴 자격이 있다고 진정으로 믿지 않는다면, 훌륭한 경력이나 관계를 당신의 삶 속으로 끌어들이는 일은 더 어려울 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞 문장의 주장을 구체적인 장면으로 보여 줍니다. 비전 보드를 만들고 매일 긍정 확언을 하는 행동은 자기계발에서 흔히 권장되는 실천입니다. 그러나 마음 깊은 곳에서 자신을 부족하고 사랑받기 어려운 사람으로 여기면, 좋은 기회가 와도 스스로 피하거나, 관계를 의심하거나, 성공을 감당하지 못하는 방식으로 행동할 수 있습니다. 그래서 겉으로는 원하는 삶을 외치면서도 실제 선택과 반응은 그 목표와 어긋날 수 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what you want (관계대명사): what은 선행사를 포함한 관계대명사로, ‘the thing(s) that’의 의미를 가진다. what you want 전체가 전치사 of의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">that you are available for an incredibly successful, passionate career or a loving relationship (that절): affirm의 목적어로 쓰인 명사절이다. that절 내부는 you가 주어, are가 연결동사, available이 주격보어이며, for an incredibly successful, passionate career or a loving relationship이 available을 보충한다.</div><div class=\"lec-gr-item\">available for an incredibly successful, passionate career (관용표현): available for는 ‘~을 할 수 있는/받아들일 수 있는 상태인’이라는 형용사+전치사 결합이다. available이 형용사 보어이고 for 이하가 그 대상을 나타낸다.</div><div class=\"lec-gr-item\">loving relationship (현재분사(형용사)): loving이 명사 relationship을 앞에서 수식한다. 구조는 -ing + N이며, relationship이 ‘사랑을 주고받는 성격의 관계’라는 의미가 되도록 형용사적으로 기능한다.</div><div class=\"lec-gr-item\">if you don&#39;t truly believe you are enough, worthy, lovable, and deserving (조건절): if가 이끄는 부사절로, 주절 then attracting... may be more challenging의 조건을 제시한다. believe 뒤에는 접속사 that이 생략된 명사절 you are enough, worthy, lovable, and deserving이 목적어로 온다.</div><div class=\"lec-gr-item\">you are enough, worthy, lovable, and deserving SVC 구조: you가 주어, are가 연결동사, enough, worthy, lovable, deserving이 병렬 주격보어이다. 여러 형용사 보어가 and로 연결되어 주어의 상태를 설명한다.</div><div class=\"lec-gr-item\">deserving (현재분사(형용사)): deserving은 be동사 are 뒤에서 주격보어로 쓰여 주어 you의 상태를 설명한다. 여기서는 진행형이 아니라 형용사적 보어이다.</div><div class=\"lec-gr-item\">attracting a great career or relationship into your life (동명사): attracting은 문장 주어 역할을 하는 -ing 형태이므로 동명사이다. attracting a great career or relationship into your life 전체가 주어이고, may be more challenging이 서술부이다.</div><div class=\"lec-gr-item\">more challenging (현재분사(형용사)): challenging은 be동사 뒤에서 주격보어로 쓰인 형용사적 -ing 형태이다. more는 비교급을 만드는 부사이고, challenging이 주어 attracting...의 성격을 설명한다.</div><div class=\"lec-gr-item\">what you want to attract (관계대명사): what은 선행사를 포함한 관계대명사로, ‘the thing(s) that’의 의미를 가진다. want의 목적어 역할을 하는 동시에 to attract의 목적어 자리와 연결된다.</div><div class=\"lec-gr-item\">to attract (to부정사): to attract는 동사 want의 목적어 역할을 보충하는 to부정사이다. 구조는 want + to + 동사원형이며, 여기서는 want to attract가 ‘끌어당기고 싶다’라는 동사구를 이룬다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">affirm</td><td class=\"m\">단언하다, 확언하다, 긍정하다</td></tr><tr><td class=\"w\">worthy</td><td class=\"m\">가치 있는, 자격이 있는, 훌륭한</td></tr><tr><td class=\"w\">deserving</td><td class=\"m\">~을 받을 만한, 자격이 있는</td></tr><tr><td class=\"w\">challenging</td><td class=\"m\">도전적인, 어려운, 힘든</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">숙고하라</span><span class=\"en\"><b><span class=\"grammar-hl\">Consider</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 제한적인 신념들을 당신이 가졌는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">what limiting beliefs you have</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 욕구와 모순되는</span><span class=\"en\"><b><span class=\"grammar-hl\">that contradict your desires</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들을 업그레이드하라</span><span class=\"en\"><b>and <span class=\"grammar-hl\">upgrade them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신념으로</span><span class=\"en\"><b><span class=\"grammar-hl\">to beliefs</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 끌어당기고자 하는 것과 일치하는</span><span class=\"en\"><b>that <span class=\"grammar-hl\">are in line with</span> <span class=\"grammar-hl\">what you want to attract</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신의 욕구와 모순되는 어떤 제한적인 신념들을 당신이 가졌는지를 숙고하고, 당신이 끌어당기고자 하는 것과 일치하는 신념으로 그것들을 업그레이드하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장은 앞에서 제기한 문제에 대한 해결책을 제시합니다. 글쓴이는 독자에게 자신이 원하는 삶을 방해하는 내면의 믿음을 찾아보라고 권합니다. 예를 들어 좋은 관계를 원하면서도 속으로는 “나는 사랑받기 힘들다”고 믿는다면, 그 믿음을 자신이 원하는 관계와 어울리는 방향으로 바꾸어야 한다는 뜻입니다. 글은 결국 원하는 것을 상상하는 데서 멈추지 말고, 그 원하는 삶을 받아들일 수 있는 사람이라고 스스로 믿는 단계까지 가야 한다고 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Consider what limiting beliefs you have that contradict your desires (간접의문문): consider의 목적어로 what limiting beliefs you have...가 쓰였다. 구조는 의문사 what + 명사 limiting beliefs + 주어 you + 동사 have로, 직접의문문 어순이 아니라 평서문 어순이다.</div><div class=\"lec-gr-item\">limiting beliefs (현재분사(형용사)): limiting이 명사 beliefs를 앞에서 수식한다. 구조는 -ing + N이며, beliefs가 ‘제한하는 성격을 가진 믿음’이라는 의미가 되도록 형용사적으로 기능한다.</div><div class=\"lec-gr-item\">that contradict your desires (관계대명사): that은 앞의 limiting beliefs를 선행사로 받으며, 관계대명사절 안에서 주어 역할을 한다. contradict가 동사이고 your desires가 목적어이다.</div><div class=\"lec-gr-item\">upgrade them to beliefs 동사 구조: upgrade는 타동사로 목적어 them을 취하고, to beliefs가 변화의 결과 또는 방향을 나타내는 전치사구로 붙는다. 구조는 upgrade + O + to + 명사이다.</div><div class=\"lec-gr-item\">beliefs that are in line with what you want to attract (관계대명사): that은 앞의 beliefs를 선행사로 받으며, 관계대명사절 안에서 주어 역할을 한다. 관계대명사절의 서술부는 are in line with...이고, 이 절 전체가 beliefs를 수식한다.</div><div class=\"lec-gr-item\">are in line with (관용표현): be in line with는 ‘~와 일치하다/부합하다’라는 의미의 관용적 형용사구이다. be동사 are 뒤에 in line with가 보어처럼 쓰이고, 뒤에 목적어 성격의 명사절이 온다.</div><div class=\"lec-gr-item\">what you want to attract (관계대명사): what은 선행사를 포함한 관계대명사로, ‘the thing(s) that’의 의미를 가진다. what you want to attract 전체가 전치사 with의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">to attract (to부정사): to attract는 want 뒤에 와서 want의 목적어 내용을 이루는 명사적 용법의 to부정사이다. 구조는 want + to + 동사원형이며, attract의 목적어 자리는 what과 연결된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">limiting belief</td><td class=\"m\">제한적 신념, 가능성을 제한하는 믿음</td></tr><tr><td class=\"w\">contradict</td><td class=\"m\">모순되다, 반박하다, 부정하다</td></tr><tr><td class=\"w\">in line with</td><td class=\"m\">~와 일치하여, ~에 부합하여</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>끌어당김의 법칙은 생각과 감정이 삶의 결과에 영향을 준다고 본다.</li><li>그러나 원하는 것을 생각하거나 상상하는 것만으로 충분하다고 믿는 데에는 문제가 있다.</li><li>생각과 말도 힘이 있지만, 더 강력한 것은 자신에 대한 깊은 믿음 체계이다.</li><li>좋은 직업이나 사랑을 원해도 스스로 가치 없다고 믿으면 그것을 받아들이기 어렵다.</li><li>자신의 욕망과 충돌하는 제한적 믿음을 찾아 원하는 삶과 맞는 믿음으로 바꾸어야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Positive thoughts may help attraction, but limiting beliefs must be changed to align with one’s desires.</div>\n              <div class=\"lec-final-sum-ko\">긍정적인 생각은 끌어당김에 도움이 될 수 있지만, 제한적인 신념은 자신의 욕망과 일치하도록 바뀌어야 한다.</div></div></div>"],"segs":[[{"audio":"./22_audio/1.mp3","hl":null}],[{"audio":"./22_audio/2.mp3","hl":null}],[{"audio":"./22_audio/3.mp3","hl":null},{"audio":"./22_audio/4.mp3","hl":"stage-0"},{"audio":"./22_audio/5.mp3","hl":"stage-1"},{"audio":"./22_audio/6.mp3","hl":"stage-2"},{"audio":"./22_audio/7.mp3","hl":"stage-3"},{"audio":"./22_audio/8.mp3","hl":"stage-4"}],[{"audio":"./22_audio/9.mp3","hl":null}],[{"audio":"./22_audio/10.mp3","hl":"main"},{"audio":"./22_audio/11.mp3","hl":"meaning"},{"audio":"./22_audio/12.mp3","hl":"grammar"}],[{"audio":"./22_audio/13.mp3","hl":"main"},{"audio":"./22_audio/14.mp3","hl":"meaning"},{"audio":"./22_audio/15.mp3","hl":"grammar"}],[{"audio":"./22_audio/16.mp3","hl":"main"},{"audio":"./22_audio/17.mp3","hl":"meaning"},{"audio":"./22_audio/18.mp3","hl":"grammar"}],[{"audio":"./22_audio/19.mp3","hl":"main"},{"audio":"./22_audio/20.mp3","hl":"meaning"},{"audio":"./22_audio/21.mp3","hl":"grammar"}],[{"audio":"./22_audio/22.mp3","hl":"main"},{"audio":"./22_audio/23.mp3","hl":"meaning"},{"audio":"./22_audio/24.mp3","hl":"grammar"}],[{"audio":"./22_audio/25.mp3","hl":"main"},{"audio":"./22_audio/26.mp3","hl":"meaning"},{"audio":"./22_audio/27.mp3","hl":"grammar"}],[{"audio":"./22_audio/28.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u2
