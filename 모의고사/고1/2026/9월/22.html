<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>22번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#FF6C9D;--pk-t:#C93A70;--pk-l:#FFE3EC;--pk-ll:#FFF6F9;--bl-l:#E3F1F7;--bl-t:#2F6B82;height:100%;min-height:540px;background:#fff;color:#1F1F1F;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}
.lp *{box-sizing:border-box}
.lp{word-break:keep-all;overflow-wrap:break-word}
.lp-top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid #F1F1F1;position:relative}
.lp-top::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--pk),#FFB3CB)}
.lp-brand{font-size:12.5px;font-weight:800;color:#fff;background:var(--pk);border-radius:999px;padding:3px 12px}
.lp-name{flex:1;min-width:0;font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-slide{flex:1;min-height:0;overflow:auto;padding:30px 44px;display:flex;flex-direction:column}
.lp-cap{flex-shrink:0;padding:10px 22px;background:#FFF6F9;border-top:1px solid #FFE3EC;font-size:15px;line-height:1.55;color:#4D4D4D;max-height:30%;overflow:auto}
.lp-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:11px 18px;border-top:1px solid #F1F1F1;background:#FAFAFA;flex-wrap:wrap}
.lp-tl{flex:1;min-width:120px;height:7px;background:#ECECEC;border-radius:6px;overflow:hidden;cursor:pointer}
.lp-tl>i{display:block;height:100%;width:0;background:var(--pk)}
.lp-cnt{font-size:12.5px;color:#8C8C8C;font-variant-numeric:tabular-nums;min-width:50px;text-align:center}
.lp select{width:auto}
.lp button,.lp select{background:#fff;color:#1F1F1F;border:1px solid #DCDCDC;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit}
.lp button.on{background:var(--pk-l);border-color:var(--pk-l);color:var(--pk-t)}
.lp button.lp-play{background:var(--pk);border-color:var(--pk);color:#fff;min-width:96px}
.lp-warn{padding:7px 20px;font-size:12.5px;color:var(--pk-t);background:var(--pk-ll)}
.lp-tag{display:inline-block;align-self:flex-start;font-size:12.5px;font-weight:800;color:var(--pk-t);background:var(--pk-l);border-radius:999px;padding:3px 12px;margin-bottom:14px}
.lp-cover{margin:auto 0;display:flex;gap:22px;align-items:stretch}
.lp-qn{flex:0 0 110px;background:var(--pk);color:#fff;font-weight:800;font-size:28px;border-radius:14px;display:grid;place-items:center}
.lp-cv{flex:1;min-width:0}
.lp-cv .src{color:#8C8C8C;font-weight:700;font-size:14px}
.lp-cv h1{margin:4px 0 2px;font-size:30px;line-height:1.25;font-weight:800}
.lp-cv h2{margin:0 0 14px;font-size:17px;color:#4D4D4D;font-weight:700}
.lp-row{display:flex;gap:10px;align-items:baseline;margin-top:6px;font-size:15.5px;padding:4px 8px;border-radius:8px}
.lp-lb{flex:0 0 auto;font-size:12px;font-weight:800;color:var(--pk-t);background:var(--pk-l);border-radius:4px;padding:1px 8px}
.lp-box{background:var(--pk-ll);border-radius:12px;padding:16px 20px;font-size:16.5px;line-height:1.75;color:#333}
.lp b.key{color:var(--pk-t);background:linear-gradient(transparent 60%,#FFD6E4 60%)}
.lp-st{border:1px solid #F4E1E8;border-radius:12px;padding:11px 16px;margin-bottom:9px}
.lp-st h4{margin:0 0 3px;font-size:16px;color:var(--pk-t);display:flex;gap:8px;align-items:center}
.lp-st h4 i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pk);color:#fff;font-size:12px}
.lp-st h4 small{color:#8C8C8C;font-size:12.5px}
.lp-st p{margin:0;font-size:15px;line-height:1.65;color:#444}
.lp-big{font-size:28px;font-weight:800}
.lp-pill{display:inline-block;font-size:13px;font-weight:800;color:var(--pk-t);background:var(--pk-l);border-radius:999px;padding:3px 12px;margin-left:8px;vertical-align:5px}
.lp-sig{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin-top:8px}
.lp-sig b{color:var(--pk-t)}
.lp-chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:15px}
.lp-chain span.c{background:var(--bl-l);color:var(--bl-t);font-weight:700;border-radius:6px;padding:2px 10px}
.lp-chain span.a{color:#999}
.lp-ct{width:100%;border-collapse:collapse;margin-top:10px;font-size:14.5px}
.lp-ct th,.lp-ct td{border:1px solid #F0E1E7;padding:6px 10px;text-align:left}
.lp-ct th{background:var(--pk-ll);color:var(--pk-t)}
.lp-vg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 22px}
.lp-vg div{display:flex;gap:10px;padding:6px 2px;border-bottom:1px solid #F4F4F4;font-size:15.5px;align-items:baseline}
.lp-vg b{font-weight:800}
.lp-vg em{font-style:normal;font-size:11px;font-weight:700;color:var(--pk-t);background:var(--pk-l);border-radius:4px;padding:0 5px}
.lp-vg span{color:#555;margin-left:auto;text-align:right}
.lp-sa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}
.lp-sa>div{border:1px solid #F1F1F1;border-radius:10px;padding:10px 14px}
.lp-sa b.w{font-size:17px}
.lp-sa .m{color:#666;margin-left:6px;font-size:14px}
.lp-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.lp-chips span{font-size:13.5px;font-weight:700;border-radius:5px;padding:1px 9px}
.lp-chips .s{background:var(--bl-l);color:var(--bl-t)}
.lp-chips .a{background:#FCE7EF;color:#8D4A61}
.lp-chips .x{background:none;color:#999;padding:0}
.lp-sno{font-size:13px;color:#8C8C8C;font-weight:700;margin-bottom:8px}
.lp-sno .es{color:#fff;background:#F05A5A;border-radius:4px;padding:1px 8px;font-size:11.5px;margin-left:8px}
.lp-chunks{display:flex;flex-wrap:wrap;gap:16px 10px;margin-bottom:12px;align-items:flex-end}
.lp-chunk{display:flex;flex-direction:column}
.lp-chunk .ko{font-size:13px;color:var(--pk-t);font-weight:700;line-height:1.3;margin-bottom:2px}
.lp-chunk .en{font-size:24px;font-weight:700;line-height:1.4}
.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #F4E1E8}
.lp .tgt{background:#E2F2F8;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FEFCE8;border:1px solid #F3E9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #FFD6E4;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #FFB3CB,0 0 22px 4px rgba(255,108,157,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    a.src=encodeURI(D.audioDir)+"/"+s.n+".mp3";a.playbackRate=rate;a.play().catch(function(){});}
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;warn.hidden=false;warn.textContent="음성 파일("+D.audioDir+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"22번","audioDir":"22번_audio","preview":false,"count":29,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">22번\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>The Core of the Law of Attraction: Aligning Beliefs with Desires\u003c/h1>\u003ch2>끌어당김의 법칙의 핵심: 욕구와 신념의 일치\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">요약\u003c/span>\u003cspan>\u003cb class=\"key\">끌어당김의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>에서 성공하려면 단순한 \u003cb class=\"key\">시각화\u003c/b>를 넘어, 자신의 내면 깊숙한 곳에 자리 잡은 \u003cb class=\"key\">신념 \u003c/b>\u003cb class=\"key\">체계\u003c/b>를 원하는 목적과 일치시켜야 한다는 내용입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">요지\u003c/span>\u003cspan>Beyond simple visualization, the true power of the Law of Attraction lies in transforming one's underlying belief system to align with their goals.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘은 우리가 흔히 들어본 끌어당김의 법칙에 숨겨진 진짜 진실에 대해 알아볼 거예요. 이 글은 단순히 꿈꾸기만 하면 다 이루어진다는 달콤한 이야기를 넘어서, 우리 내면의 깊은 곳을 들여다보게 합니다. 생각보다 강력한 신념 체계가 어떻게 우리 삶을 결정하는지 요지와 함께 정리해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">자기계발 분야에서 가장 유명한 개념 중 하나인 \u003cb class=\"key\">끌어당김의 \u003c/b>\u003cb class=\"key\">법칙(Law \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">Attraction)\u003c/b>은 우리가 내뿜는 에너지가 같은 종류의 에너지를 끌어온다는 원리입니다. 많은 사람이 단순히 보물지도를 만들거나 \u003cb class=\"key\">상상(Visualize)\u003c/b>만 하면 소원이 이루어진다고 생각하지만, 이 글은 더 깊은 곳의 엔진인 \u003cb class=\"key\">신념(Belief)\u003c/b>이 작동해야 한다고 말하죠. 마치 겉으로는 부자가 되고 싶다고 외치면서도 속으로는 '나는 안 될 거야'라고 믿는다면, 그 \u003cb class=\"key\">무의식적 \u003c/b>\u003cb class=\"key\">신념\u003c/b>이 결과에 더 큰 영향을 미칩니다. 결국 진정한 변화를 위해서는 자신의 한계를 정하는 \u003cb class=\"key\">제한적 \u003c/b>\u003cb class=\"key\">신념\u003c/b>을 찾아내어 이를 긍정적인 방향으로 수정하는 과정이 필수적입니다.\u003c/div>","segs":[{"n":2,"text":"끌어당김의 법칙은 우리가 내뿜는 에너지가 비슷한 에너지를 불러온다는 이론입니다. 많은 학생이 시험 합격을 시각화하면 공부를 안 해도 합격할 거라 믿는 실수를 하곤 하죠. 하지만 실제로는 내면에 자리 잡은 무의식적인 신념이 엔진 역할을 합니다. 내가 정말로 그 결과를 얻을 가치가 있다고 믿는지, 아니면 스스로를 제한하고 있지는 않은지 점검하는 신념의 일치 과정이 필수적입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">논리 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>1\u003c/i>끌어당김의 법칙과 흔한 오류\u003csmall>도입 및 통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>비슷한 것끼리 끌어당긴다는 법칙을 소개하며, 단순히 생각이나 \u003cb class=\"key\">시각화\u003c/b>만 하면 결과가 나타날 것이라는 흔한 \u003cb class=\"key\">이해의 \u003c/b>\u003cb class=\"key\">오류\u003c/b>를 지적합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>2\u003c/i>가장 강력한 인력의 원천\u003csmall>주장 및 반전 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>생각과 말이 자기력을 가지는 것은 사실이지만, 실제로 가장 강력하게 결과를 끌어당기는 핵심 요소는 바로 \u003cb class=\"key\">신념 \u003c/b>\u003cb class=\"key\">체계\u003c/b>임을 강조하며 글의 \u003cb class=\"key\">주제\u003c/b>를 드러냅니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>3\u003c/i>신념의 일치와 개선의 필요성\u003csmall>예시 및 결론 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>원하는 것을 아무리 \u003cb class=\"key\">확언\u003c/b>하더라도 스스로의 가치를 믿지 않으면 성공하기 어렵기에, 욕구와 \u003cb class=\"key\">모순되는 \u003c/b>\u003cb class=\"key\">신념\u003c/b>을 찾아 일치하도록 \u003cb class=\"key\">개선\u003c/b>해야 한다고 조언합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글의 논리적 흐름은 통념을 짚어보고, 진짜 핵심 원인을 밝힌 뒤, 우리가 해야 할 행동으로 마무리됩니다.","hl":null},{"n":4,"text":"먼저 첫번째 문장과 두번째 문장에서는 끌어당김의 법칙을 정의하면서도, 우리가 흔히 빠지기 쉬운 이해의 오류를 지적합니다. 단순히 시각화만 하면 모든 것이 나타날 것이라고 믿는 게 문제라는 거죠.","hl":"f0"},{"n":5,"text":"이어서 세번째 문장과 네번째 문장이 이 글의 핵심입니다. 생각과 말에 자기력이 있다는 걸 인정하면서도, 하지만 진짜 가장 강력한 것은 바로 우리의 신념 체계라는 점을 분명히 합니다.","hl":"f1"},{"n":6,"text":"마지막 다섯번째 문장과 여섯번째 문장에서는 구체적인 예시를 들어 스스로의 가치를 믿지 않는 한 시각화는 소용없다고 말합니다. 그래서 우리의 욕구와 모순되는 신념을 찾아 업그레이드하라는 해결책을 제시하죠.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">많은 이들이 알고 있는 시각화의 힘이라는 \u003cb class=\"key\">통념\u003c/b>을 먼저 제시한 뒤, 4번 문장에서 'But'을 사용해 \u003cb class=\"key\">신념 \u003c/b>\u003cb class=\"key\">체계\u003c/b>가 더 중요하다는 필자의 주장을 강조합니다. 이후 구체적인 \u003cb class=\"key\">예시\u003c/b>를 통해 왜 신념이 바뀌어야 하는지 증명하고 실천 방안을 제시하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #F4E1E8\">\u003cdiv class=\"lp-sig\">\u003cb>The common flaw (2)\u003c/b>\u003cspan>통념의 오류 지적\u003c/span>\u003cb>But (4)\u003c/b>\u003cspan>핵심 주장으로의 전환\u003c/span>\u003cb>Consider (6)\u003c/b>\u003cspan>독자에게 권고하는 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Law of Attraction\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">vibration\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">magnetic\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">belief system\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">limiting beliefs\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Thinking / Visualizing / Affirming\u003c/th>\u003cth>Believing / Worthy / In line with\u003c/th>\u003c/tr>\u003ctr>\u003ctd>겉으로 드러나는 생각과 말\u003c/td>\u003ctd>내면 깊숙이 자리 잡은 신념 체계\u003c/td>\u003c/tr>\u003ctr>\u003ctd>흔한 이해의 오류\u003c/td>\u003ctd>가장 강력한 끌어당김의 요소\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 지문은 전형적인 통념-반박 구조를 취하고 있습니다. 초반부에 누구나 알 법한 끌어당김의 법칙을 설명하다가 중간에 핵심을 찌르는 반박을 던지는 형태죠. 특히 중심 내용이 가운데에 위치한 중괄식 구조로 볼 수 있습니다.","hl":"ty"},{"n":8,"text":"두 번째 문장에서 흔한 오류라는 표현으로 독자의 주의를 끌고, 네 번째 문장에서 역접의 접속사 But을 사용하여 분위기를 반전시킵니다. 마지막에는 숙고하라는 뜻의 consider라는 동사를 통해 명령문 형태로 실천을 강조하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">단어 정리\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>attraction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>끌어당김\u003c/span>\u003c/div>\u003cdiv>\u003cb>state\u003c/b>\u003cem>동사\u003c/em>\u003cspan>말하다, 명시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>focusing on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 집중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 야기하다, 가져오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>flaw\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결함, 오류\u003c/span>\u003c/div>\u003cdiv>\u003cb>visualize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시각화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>manifest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>명백히 하다, 나타나게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vibration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진동\u003c/span>\u003c/div>\u003cdiv>\u003cb>magnetic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자기력이 있는, 강한 인력이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>attractor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>끌어당기는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>belief system\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신념 체계\u003c/span>\u003c/div>\u003cdiv>\u003cb>affirm\u003c/b>\u003cem>동사\u003c/em>\u003cspan>단언하다, 확언하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>available for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 얻을 수 있는, 누릴 자격이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>passionate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>열정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>career\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경력, 직업\u003c/span>\u003c/div>\u003cdiv>\u003cb>worthy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가치 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>lovable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사랑받을 만한\u003c/span>\u003c/div>\u003cdiv>\u003cb>deserving\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자격이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenging\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>어려운, 도전적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>limiting belief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제한적 신념\u003c/span>\u003c/div>\u003cdiv>\u003cb>contradict\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모순되다, 반박하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>desire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>욕구, 갈망\u003c/span>\u003c/div>\u003cdiv>\u003cb>upgrade\u003c/b>\u003cem>동사\u003c/em>\u003cspan>개선하다, 업그레이드하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in line with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 일치하는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"여기서 manifest는 무언가를 명백하게 드러내거나 나타나게 한다는 뜻으로 쓰였고, affirm은 매일 스스로에게 확언을 하는 행동을 말합니다. 제한적 신념을 뜻하는 limiting beliefs라는 표현도 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">유의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">flaw\u003c/b>\u003cspan class=\"m\">결함, 오류\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">defect\u003c/span>\u003cspan class=\"s\">fault\u003c/span>\u003cspan class=\"s\">shortcoming\u003c/span>\u003cspan class=\"x\">↔\u003c/span>\u003cspan class=\"a\">perfection\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">manifest\u003c/b>\u003cspan class=\"m\">명백히 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reveal\u003c/span>\u003cspan class=\"s\">demonstrate\u003c/span>\u003cspan class=\"s\">display\u003c/span>\u003cspan class=\"x\">↔\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">affirm\u003c/b>\u003cspan class=\"m\">확언하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">declare\u003c/span>\u003cspan class=\"s\">assert\u003c/span>\u003cspan class=\"s\">confirm\u003c/span>\u003cspan class=\"x\">↔\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003cspan class=\"a\">refute\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contradict\u003c/b>\u003cspan class=\"m\">모순되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conflict with\u003c/span>\u003cspan class=\"s\">oppose\u003c/span>\u003cspan class=\"x\">↔\u003c/span>\u003cspan class=\"a\">agree\u003c/span>\u003cspan class=\"a\">concur\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">upgrade\u003c/b>\u003cspan class=\"m\">개선하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">improve\u003c/span>\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"x\">↔\u003c/span>\u003cspan class=\"a\">downgrade\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"오류를 뜻하는 플로우의 동의어 defect와 대조되는 perfection을 함께 알아두면 좋습니다. 또한 모순되다는 의미의 contradict는 conflict with와 바꿔 쓸 수 있고, 동의한다는 뜻의 agree와는 반대되는 개념입니다. 개선하다인 upgrade는 improve와 같은 맥락입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 출제 가능\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마 당신은 들어본 적이 있을 텐데 \u003c/span>\u003cspan class=\"en\">Perhaps you have heard of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끌어당김의 법칙을, \u003c/span>\u003cspan class=\"en\">the Law of Attraction,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 ‘같은 것은 같은 것을 끌어당긴다’라고 말한다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">states\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">'like \u003c/span>\u003cspan class=\"tgt\">attracts \u003c/span>\u003cspan class=\"tgt\">like' \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 긍정적 혹은 부정적 생각에 집중함으로써 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> by focusing on positive or negative thoughts,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람은 가져올 수 있다고 \u003c/span>\u003cspan class=\"en\">one can bring about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긍정적 혹은 부정적 결과를.\u003c/span>\u003cspan class=\"en\">positive or negative results.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아마 당신은 끌어당김의 법칙을 들어본 적이 있을텐데, 이는 ‘같은 것은 같은 것을 끌어당긴다’ 그리고 긍정적 혹은 부정적 생각에 집중함으로써 사람은 긍정적 혹은 부정적 결과를 가져올 수 있다고 말한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 도입부로 \u003cb class=\"key\">끌어당김의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>의 기본 정의를 소개하고 있습니다. 생각의 성격이 결과의 성격을 결정한다는 \u003cb class=\"key\">인과관계\u003c/b>를 강조하며 독자의 관심을 유도합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>+ 어법 POINT\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : [명사(선행사)] + [, (콤마)] + [which (주격 관계대명사)] : \"그런데 그것은 (~라고) 말한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that의 병렬 구조\u003c/span> : states [타동사] + [that 절 (목적어 1)] + and + [that 절 (목적어 2)] : \"~라는 것과 ~라는 것\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Perhaps you have heard of 아마 당신은 들어본 적이 있을 텐데 the Law of Attraction 끌어당김의 법칙을 which states that 'like attracts like' 이는 ‘같은 것은 같은 것을 끌어당긴다’라고 말한다 and that by focusing on positive or negative thoughts 그리고 긍정적 혹은 부정적 생각에 집중함으로써 one can bring about 사람은 가져올 수 있다고 positive or negative results 긍정적 혹은 부정적 결과를요. 전체를 해석하면, 아마 당신은 끌어당김의 법칙을 들어본 적이 있을텐데, 이는 ‘같은 것은 같은 것을 끌어당긴다’ 그리고 긍정적 혹은 부정적 생각에 집중함으로써 사람은 긍정적 혹은 부정적 결과를 가져올 수 있다고 말한다.","hl":"m"},{"n":12,"text":"이 문장은 끌어당김의 법칙이라는 생소할 수 있는 개념을 먼저 정의하면서 시작해요. 우리의 생각이 자석처럼 같은 성질의 결과를 끌어온다는 인과관계를 설명하고 있죠.","hl":"mn"},{"n":13,"text":"첫 번째 포인트는 콤마 뒤에 나온 위치입니다. 관계대명사의 계속적 용법으로 쓰여서 앞의 법칙에 대해 부연 설명을 하고 있어요. 두 번째는 대시 절 두 개가 나란히 연결된 병렬 구조인데요, states라는 동사의 목적어가 두 개라는 점을 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 출제 가능\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔한 오류는 \u003c/span>\u003cspan class=\"en\">The common flaw\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 법칙에 대한 우리의 이해에서 \u003c/span>\u003cspan class=\"en\">in our understanding of this law\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 (~라고) 믿는 것이다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">believe\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 할 일은 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 것을 생각하거나 시각화하는 것이라고 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">think\u003c/span> about or visualize something\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 명백히 하기 위해.\u003c/span>\u003cspan class=\"en\">to manifest it.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 법칙에 대한 우리의 이해에서 흔한 오류는 그것을 명백히 하기 위해 우리가 할 일은 어떤 것을 생각하거나 시각화하는 것이라 믿는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 이 법칙에 대해 흔히 범하는 \u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">통념\u003c/b>을 지적하고 있습니다. 단순히 \u003cb class=\"key\">시각화\u003c/b>만 하면 실현될 것이라는 생각이 불충분하다는 것을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>+ 어법 POINT\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that (보어)\u003c/span> : [주어] + is + [that절 (보어)] : \"~라는 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">all 주어 구문의 동사원형 보어\u003c/span> : All [(that) we have to do] + is + [(to) think] : \"우리가 해야 하는 전부(할 일)는 생각하는 것이다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"The common flaw 흔한 오류는 in our understanding of this law 이 법칙에 대한 우리의 이해에서 is that we believe 우리가 믿는 것입니다 all we have to do 우리가 할 일은 is think about or visualize something 어떤 것을 생각하거나 시각화하는 것이라고 to manifest it 그것을 명백히 하기 위해서요. 전체를 해석하면, 이 법칙에 대한 우리의 이해에서 흔한 오류는 그것을 명백히 하기 위해 우리가 할 일은 어떤 것을 생각하거나 시각화하는 것이라 믿는 것이다.","hl":"m"},{"n":15,"text":"사람들이 보통 '간절히 생각만 하면 이루어진다'라고 믿는데, 작가는 그게 바로 잘못된 통념이라고 꼬집고 있어요. 시각화만으로는 부족하다는 거죠.","hl":"mn"},{"n":16,"text":"중요한 문법이 보이네요. 이즈 뒤의 대시는 문장의 보어 역할을 하는 명사절이고요, 올 위 해브 투 두가 주어로 쓰일 때는 보어 자리에 투가 생략된 동사원형을 쓴다는 관용적 표현을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점은 사실이다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">true \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 자신의 진동 수준에 따라 끌어당기며 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> we attract at the level of our own vibration\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 우리의 생각과 말이 \u003c/span>\u003cspan class=\"en\">and that our thoughts and words\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 강한 자기력을 지니고 있다는.\u003c/span>\u003cspan class=\"en\">are extremely magnetic.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 자신의 진동 수준에 따라 끌어당기며, 우리의 생각과 말이 매우 강한 자기력을 지니고 있다는 점은 사실이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 오류를 지적한 뒤, 끌어당김의 법칙에서 일부 \u003cb class=\"key\">인정할 \u003c/b>\u003cb class=\"key\">만한 \u003c/b>\u003cb class=\"key\">사실\u003c/b>을 언급합니다. \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">진동\u003c/b>과 생각의 힘 자체는 부정하지 않는다는 논조입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>+ 어법 POINT\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It, 진주어 that\u003c/span> : It [가주어] + is + true [형용사] + [that절 (진주어)] : \"~라는 것은 사실이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">진주어의 병렬 구조\u003c/span> : It is true + [that절 1] + and + [that절 2] : \"~라는 것과 ~라는 것\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"It is true 사실입니다 that we attract at the level of our own vibration 우리가 자신의 진동 수준에 따라 끌어당긴다는 것은 and that our thoughts and words are extremely magnetic 그리고 우리의 생각과 말이 매우 강한 자기력을 지니고 있다는 점도요. 전체를 해석하면, 우리가 자신의 진동 수준에 따라 끌어당기며, 우리의 생각과 말이 매우 강한 자기력을 지니고 있다는 점은 사실이다.","hl":"m"},{"n":18,"text":"앞서 오류를 말했지만, 생각의 힘 자체가 아예 없다는 건 아니에요. 우리가 내뿜는 에너지나 생각에 자석 같은 힘이 있다는 건 일단 인정하는 단계입니다.","hl":"mn"},{"n":19,"text":"문장의 시작에 나온 잇은 의미가 없는 가주어예요. 진짜 주어는 뒤에 나오는 대시 절 두 개인데, 이 두 개의 진주어가 병렬 구조로 연결되어 '첫 번째라는 것과 두 번째라는 것'은 사실이다라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 강력한 끌어당기는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">powerful \u003c/span>\u003cspan class=\"tgt\">attractor\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 신념 체계이다.\u003c/span>\u003cspan class=\"en\">is our belief system.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 가장 강력한 끌어당기는 것은 우리의 신념 체계이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급된 생각이나 말보다 더 근본적으로 현실을 만드는 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">근본적인 \u003c/b>\u003cb class=\"key\">힘\u003c/b>이 바로 \u003cb class=\"key\">신념 \u003c/b>\u003cb class=\"key\">체계\u003c/b>임을 강조하며 글의 핵심 주제로 넘어가는 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>+ 어법 POINT\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급 표현\u003c/span> : the + 형용사의 최상급(most -ful) + 명사 : \"가장 강력한 끌어당기는 것\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"But 그러나 the most powerful attractor 가장 강력한 끌어당기는 것은 is our belief system 우리의 신념 체계이다. 전체를 해석하면, 그러나 가장 강력한 끌어당기는 것은 우리의 신념 체계이다.","hl":"m"},{"n":21,"text":"앞서 생각과 말이 자기력이 있다고 했지만, 진짜 주인공은 따로 있다는 거죠. 바로 우리 마음속 깊은 곳에 자리 잡은 신념 체계가 가장 강력한 힘을 발휘한다는 내용입니다.","hl":"mn"},{"n":22,"text":"문장에서 the most powerful은 최상급 표현으로, 수많은 끌어당김의 요소 중에서 신념 체계가 단연 가장 강력한 존재임을 강조하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 출제 가능\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 아름다운 포스터 보드를 만들고\u003c/span>\u003cspan class=\"en\">You can create beautiful poster boards\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 원하는 것들의 이미지로 가득 찬\u003c/span>\u003cspan class=\"en\">full of images of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">want\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀라울 만큼 성공적이고 열정적인 경력 혹은 사랑하고 있는 관계를 누릴만 하다고 매일 확언할 수 있다;\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">affirm \u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">day \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> you are available for an incredibly successful, passionate career or a loving relationship;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 스스로가 충분하고, 가치 있고, 사랑받을 만하고, 그럴 자격이 있다고 진정으로 믿지 않는다면,\u003c/span>\u003cspan class=\"en\">but if you don't truly believe you are enough, worthy, lovable, and deserving,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훌륭한 경력이나 관계를 당신의 삶 속으로 끌어들이는 일은\u003c/span>\u003cspan class=\"en\">then \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">attracting \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">career \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">relationship \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 어려울 수도 있다.\u003c/span>\u003cspan class=\"en\">may be more challenging.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 원하는 것들의 이미지로 가득 찬 아름다운 포스터 보드를 만들고, 놀라울 만큼 성공적이고 열정적인 경력 혹은 사랑하고 있는 관계를 누릴만 하다고 매일 확언할 수 있다. 하지만 스스로가 충분하고, 가치 있고, 사랑받을 만하고, 그럴 자격이 있다고 진정으로 믿지 않는다면, 훌륭한 경력이나 관계를 당신의 삶 속으로 끌어들이는 일은 더 어려울 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시각화나 확언 같은 외부적 행동을 하더라도, \u003cb class=\"key\">내면의 \u003c/b>\u003cb class=\"key\">자존감\u003c/b>과 스스로에 대한 믿음이 결여되어 있다면 원하는 것을 성취하기 \u003cb class=\"key\">어려워짐\u003c/b>을 구체적인 예시로 경고하며 \u003cb class=\"key\">신념의 \u003c/b>\u003cb class=\"key\">중요성\u003c/b>을 역설합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>+ 어법 POINT\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : what [선행사를 포함한 관계사] + you want [불완전한 절] : \"당신이 원하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : affirm [타동사] + (every day) + that [접속사] + S + V [완전한 절] : \"매일 ~라고 확언하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : attracting [동명사] + 목적어 + 수식어 : \"훌륭한 경력이나 관계를 당신의 삶 속으로 끌어들이는 것\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"You can create beautiful poster boards 당신이 아름다운 포스터 보드를 만들고 full of images of what you want 당신이 원하는 것들의 이미지로 가득 찬 and affirm every day that you are available for an incredibly successful, passionate career or a loving relationship; 놀라울 만큼 성공적이고 열정적인 경력 혹은 사랑하고 있는 관계를 누릴만 하다고 매일 확언할 수 있다; but if you don't truly believe you are enough, worthy, lovable, and deserving, 하지만 스스로가 충분하고, 가치 있고, 사랑받을 만하고, 그럴 자격이 있다고 진정으로 믿지 않는다면, then attracting a great career or relationship into your life 훌륭한 경력이나 관계를 당신의 삶 속으로 끌어들이는 일은 may be more challenging. 더 어려울 수도 있다. 전체를 해석하면, 당신이 원하는 것들의 이미지로 가득 찬 아름다운 포스터 보드를 만들고, 놀라울 만큼 성공적이고 열정적인 경력 혹은 사랑하고 있는 관계를 누릴만 하다고 매일 확언할 수 있다. 하지만 스스로가 충분하고, 가치 있고, 사랑받을 만하고, 그럴 자격이 있다고 진정으로 믿지 않는다면, 훌륭한 경력이나 관계를 당신의 삶 속으로 끌어들이는 일은 더 어려울 수도 있다.","hl":"m"},{"n":24,"text":"아무리 멋진 꿈의 게시판을 만들고 매일 다짐을 해도 소용없을 수 있다는 거예요. 내면의 자존감, 즉 내가 그럴 자격이 있다는 진짜 믿음이 없으면 꿈을 끌어당기는 일은 더 어려워짐을 보여주는 문장입니다.","hl":"mn"},{"n":25,"text":"첫 번째로 what you want는 선행사를 포함한 관계대명사로, 당신이 원하는 것이라는 뜻의 명사절을 만듭니다. 두 번째로 that절은 확언하다라는 의미의 affirm의 목적어 역할을 하죠. 마지막으로 attracting으로 시작하는 동명사구는 문장의 주어로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 출제 가능\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 제한적인 신념들을 당신이 가졌는지를 숙고하고\u003c/span>\u003cspan class=\"en\">Consider \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">limiting \u003c/span>\u003cspan class=\"tgt\">beliefs \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 욕구와 모순되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">contradict \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">desires\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신념으로 그것들을 업그레이드하라\u003c/span>\u003cspan class=\"en\">and upgrade them to beliefs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 끌어당기고자 하는 것과 일치하는\u003c/span>\u003cspan class=\"en\">that are in line with what you want to attract.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신의 욕구와 모순되는 어떤 제한적인 신념들을 당신이 가졌는지를 숙고하고, 당신이 끌어당기고자 하는 것과 일치하는 신념으로 그것들을 업그레이드하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신의 욕망과 충돌하는 \u003cb class=\"key\">제한적 \u003c/b>\u003cb class=\"key\">신념\u003c/b>을 찾아내고, 이를 목표와 \u003cb class=\"key\">일치하는 \u003c/b>\u003cb class=\"key\">신념\u003c/b>으로 교체하여 근본적인 신념 체계를 변화시키라는 \u003cb class=\"key\">실천적 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>+ 어법 POINT\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문형용사)\u003c/span> : what [의문형용사] + 명사 + S + V : \"당신이 어떤 제한적인 신념들을 가졌는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : limiting beliefs [선행사] + that [관계사] + contradict [동사] : \"당신의 욕구와 모순되는\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"Consider what limiting beliefs you have 어떤 제한적인 신념들을 당신이 가졌는지를 숙고하고 that contradict your desires 당신의 욕구와 모순되는 and upgrade them to beliefs 신념으로 그것들을 업그레이드하라 that are in line with what you want to attract. 당신이 끌어당기고자 하는 것과 일치하는 전체를 해석하면, 당신의 욕구와 모순되는 어떤 제한적인 신념들을 당신이 가졌는지를 숙고하고, 당신이 끌어당기고자 하는 것과 일치하는 신념으로 그것들을 업그레이드하라.","hl":"m"},{"n":27,"text":"이제 실천법을 알려주고 있네요. 내 욕심과 따로 노는 제한적 신념을 찾아내서, 내가 진짜 원하는 것과 일치하는 새로운 신념으로 바꿔주라는 실천적 지침을 담고 있습니다.","hl":"mn"},{"n":28,"text":"먼저 what limiting beliefs you have는 의문사, 주어, 동사 순서의 간접의문문으로, Consider의 목적어입니다. 그리고 that contradict는 앞에 나온 제한적 신념을 꾸며주는 주격 관계대명사 절이죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">끌어당김의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>은 긍정적이거나 부정적인 생각의 결과가 현실이 된다는 원리이다.\u003c/li>\u003cli>단지 상상하고 시각화하는 것만으로 충분하다는 생각은 흔한 \u003cb class=\"key\">이해의 \u003c/b>\u003cb class=\"key\">오류\u003c/b>이다.\u003c/li>\u003cli>현실을 끌어당기는 가장 강력한 힘은 개인이 내면에 품고 있는 \u003cb class=\"key\">신념 \u003c/b>\u003cb class=\"key\">체계\u003c/b>이다.\u003c/li>\u003cli>자신의 욕구와 충돌하는 \u003cb class=\"key\">제한적 \u003c/b>\u003cb class=\"key\">신념\u003c/b>을 찾아내어 원하는 것과 일치하도록 \u003cb class=\"key\">개선\u003c/b>해야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Beyond simple visualization, the true power of the Law of Attraction lies in transforming one's underlying belief system to align with their goals.\u003c/b>\u003cdiv style=\"color:#C93A70;margin-top:4px\">\u003cb class=\"key\">끌어당김의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>에서 성공하려면 단순한 \u003cb class=\"key\">시각화\u003c/b>를 넘어, 자신의 내면 깊숙한 곳에 자리 잡은 \u003cb class=\"key\">신념 \u003c/b>\u003cb class=\"key\">체계\u003c/b>를 원하는 목적과 일치시켜야 한다는 내용입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":29,"text":"오늘 배운 내용을 정리해 보자면, 원하는 것을 얻기 위해서는 겉으로 보이는 시각화보다 내면의 신념을 바꾸는 것이 훨씬 더 중요하다는 것입니다. 스스로를 충분히 가치 있는 사람이라 믿는 것이 성공의 첫걸음이라는 필자의 조언을 잊지 마세요. 오늘 수업은 여기서 마치겠습니다. 수고하셨습니다.","hl":null}]}]});</script></body></html>
