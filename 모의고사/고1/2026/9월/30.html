4xSgZzjHHX5h69ev4fUHA64QtLXvbbXy079xOff8Az/8Ar/WkHGOh/wA/yP1pevp36Fe3B4B/lS449+T1HIAP8sHp97oBxkPf5LX8v8vnqHbta1l8uu+n/BG0evbAJ+gAyfXsDSjnPQ9uvT9Rz7c/TpQ6lVJwcYY8ckADPUA9vmz6fN0oSba9Ur/d91rqw07/ANfj6f12P//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">The Importance of Short but Balanced Paragraphs<small>짧지만 균형 잡힌 문단의 중요성</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">글을 이해하려면 먼저 가독성(Readability)과 시각적 구성(Visual Layout)이라는 개념을 알아두면 좋아요. 독자는 글을 읽기 전에 먼저 ‘눈으로’ 전체 모양을 훑기 때문에, 짧은 단락(Short Paragraph)은 글 사이에 여백을 만들어 심리적으로 읽기 쉬운 느낌을 줍니다. 특히 신문 글쓰기(Newspaper Writing)는 좁은 지면 폭 때문에 단락이 길어 보이기 쉬워서, 보통 2~3문장 단위로 끊어 독자의 인지 부담(Cognitive Load)을 줄입니다. 다만 단락을 너무 잘게 쪼개면 생각의 흐름(Train of Thought)이 끊겨, 마치 대화를 한 단어씩 끊어 말하는 것처럼 오히려 이해가 어려워질 수 있습니다. 따라서 좋은 문단 구성(Paragraphing)은 내용을 논리적으로 발전시키면서도 독자가 편하게 따라올 수 있도록 호흡과 흐름의 균형을 맞추는 기술이라고 볼 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01짧은 문단의 필요성</div><ul><li>글은 먼저 눈에 보이는 시각적 대상이므로, 짧은 문단은 독자가 읽고 싶게 만든다.</li><li>글쓰기(writing)는 뇌(brain)보다 눈(eye)에 먼저 들어옴</li><li>짧은 문단(short paragraphs)은 글 주변에 여백(air)을 만듦</li><li>긴 글덩어리(long chunk)는 독자의 시작을 막을 수 있음</li><li>핵심 키워드: 시각성(visual)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02신문 문단의 특징</div><ul><li>신문에서는 지면 폭이 좁기 때문에 문단을 더 짧게 구성해야 한다.</li><li>신문 문단(newspaper paragraphs)은 보통 두세 문장(two or three sentences)</li><li>신문 활자(newspaper type)는 좁은 폭(narrow width)으로 배열됨</li><li>줄이 빠르게 길어져 독자가 부담을 느낌</li><li>핵심 키워드: 좁은 지면(narrow width)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03짧은 문단에 대한 우려</div><ul><li>너무 자주 문단을 나누면 논리 전개가 약해질까 걱정할 수 있지만, 이점이 더 크다.</li><li>잦은 문단 나누기(frequent paragraphing)가 논점 전개(development)를 해칠까 우려함</li><li>The New Yorker는 이런 두려움에 집착하는 사례로 제시됨</li><li>짧게 나누는 이득(gains)이 위험(hazards)보다 훨씬 큼</li><li>핵심 키워드: 이득(gains)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04지나친 짧음의 문제</div><ul><li>문단을 지나치게 잘게 나누면 자연스러운 생각의 흐름이 끊겨 오히려 읽기 어려워진다.</li><li>너무 작은 문단(tiny paragraphs)의 연속도 긴 문단만큼 짜증남</li><li>현대 기자(modern journalists)의 동사 없는 짧은 문단(verbless wonders) 비판</li><li>생각의 흐름(train of thought)을 잘게 쪼개 독자의 일을 더 어렵게 함</li><li>핵심 키워드: 균형(balance)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">paragraph</td><td class=\"m\">문단, 단락</td></tr><tr><td class=\"w\">visual</td><td class=\"m\">시각적인, 눈에 보이는</td></tr><tr><td class=\"w\">catch the eye</td><td class=\"m\">눈길을 끌다, 시선을 사로잡다</td></tr><tr><td class=\"w\">inviting</td><td class=\"m\">매력적인, 솔깃한, 끌리는</td></tr><tr><td class=\"w\">chunk</td><td class=\"m\">덩어리, 상당히 큰 부분</td></tr><tr><td class=\"w\">discourage</td><td class=\"m\">낙담시키다, 막다, 의욕을 꺾다</td></tr><tr><td class=\"w\">narrow</td><td class=\"m\">좁은, 폭이 좁은</td></tr><tr><td class=\"w\">add up</td><td class=\"m\">늘어나다, 합산되다, 앞뒤가 맞다</td></tr><tr><td class=\"w\">paragraphing</td><td class=\"m\">문단 나누기, 단락 구성</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">development</td><td class=\"m\">전개, 발전, 발달</td></tr><tr><td class=\"w\">be obsessed by</td><td class=\"m\">~에 사로잡히다, ~에 집착하다</td></tr><tr><td class=\"w\">relief</td><td class=\"m\">안도, 완화, 휴식</td></tr><tr><td class=\"w\">outweigh</td><td class=\"m\">~보다 더 크다, ~보다 중요하다, 능가하다</td></tr><tr><td class=\"w\">hazard</td><td class=\"m\">위험, 위험 요소</td></tr><tr><td class=\"w\">go too far</td><td class=\"m\">지나치다, 도를 넘다</td></tr><tr><td class=\"w\">succession</td><td class=\"m\">연속, 잇따름, 계승</td></tr><tr><td class=\"w\">chop up</td><td class=\"m\">잘게 자르다, 토막 내다, 분해하다</td></tr><tr><td class=\"w\">train of thought</td><td class=\"m\">사고의 흐름, 생각의 맥락</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단락을 짧게 유지하라.</span><span class=\"en\"><b><span class=\"grammar-hl\">Keep your paragraphs short</span>.</b></span></div></div><div class=\"lec-sent-ko\">단락을 짧게 유지하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 핵심 조언을 먼저 제시하는 문장입니다. 글쓴이는 독자가 글을 읽기 쉽게 만들려면 문단 길이를 줄이는 것이 중요하다고 말하며, 뒤의 문장들은 왜 짧은 문단이 효과적인지 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Keep your paragraphs short (5형식(SVOC)): 동사 Keep 뒤에 목적어 your paragraphs와 목적격보어 short가 온 구조이다. short는 목적어 your paragraphs의 상태를 설명하는 형용사 보어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">paragraph</td><td class=\"m\">문단, 단락</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">글쓰기는 시각적이다</span><span class=\"en\"><b><span class=\"grammar-hl\">Writing</span> is visual</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">― 그것은 눈을 사로잡는다</span><span class=\"en\"><b>― it <span class=\"grammar-hl\">catches the eye</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 기회를 갖기 전에</span><span class=\"en\"><b>before it has a chance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뇌를 사로잡을</span><span class=\"en\"><b><span class=\"grammar-hl\">to catch the brain</span>.</b></span></div></div><div class=\"lec-sent-ko\">글쓰기는 시각적인데 즉 그것이 뇌를 사로잡을 기회를 갖기 전에 눈을 사로잡는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 조언에 대한 이유를 제시합니다. 독자는 내용을 이해하기 전에 먼저 지면이나 화면에 놓인 글의 모양을 봅니다. 그래서 문단이 빽빽해 보이면 읽기 전부터 부담을 느낄 수 있다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Writing (동명사): Writing은 -ing 형태가 문장 맨 앞에서 명사 역할을 하며, 문장의 주어로 쓰였다.</div><div class=\"lec-gr-item\">to catch the brain (to부정사): to catch가 명사 chance를 뒤에서 수식하는 형용사적 용법이다. 구조는 a chance + to V로, ‘V할 기회’라는 명사 수식 구조이다.</div><div class=\"lec-gr-item\">catches the eye (관용표현): catch the eye는 catch + 목적어 형태가 굳어진 표현으로, 문장에서는 주어 it이 동사 catches의 주어이고 the eye가 목적어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">visual</td><td class=\"m\">시각적인, 눈에 보이는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">짧은 단락은</span><span class=\"en\"><b>Short paragraphs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여백을 넣는다</span><span class=\"en\"><b>put air</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신이 쓴 것 주변에</span><span class=\"en\"><b>around <span class=\"grammar-hl\">what you write</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것을 매력적으로 보이게 한다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">make it look inviting</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반면 긴 활자 덩어리는</span><span class=\"en\"><b>whereas a long chunk of type</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독자를 꺼리게 만들 수 있다</span><span class=\"en\"><b>can discourage a reader</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아예 읽기 시작하는 것조차</span><span class=\"en\"><b><span class=\"grammar-hl\">from even starting</span> <span class=\"grammar-hl\">to read</span>.</b></span></div></div><div class=\"lec-sent-ko\">짧은 단락은 당신이 쓴 것 주변에 여백을 넣어 그것을 매력적으로 보이게 하는 반면, 긴 활자 덩어리는 독자가 아예 읽기 시작하는 것조차 꺼리게 만들 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 짧은 문단과 긴 문단의 효과를 직접 대비합니다. 짧은 문단은 글 사이에 숨 쉴 공간을 만들어 독자가 쉽게 접근하게 하고, 긴 문단은 눈앞에 큰 벽처럼 보여 독자가 첫 문장조차 읽기 부담스럽게 만듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what you write (관계대명사): what은 선행사를 포함한 관계대명사로, what you write 전체가 전치사 around의 목적어 역할을 한다. write 뒤의 목적어 자리가 비어 있고 what이 그 자리를 포함한다.</div><div class=\"lec-gr-item\">make it look inviting (5형식(SVOC)): make가 목적어 it과 목적격보어 look inviting을 취하는 구조이다. make + O + 동사원형 형태에서 look은 목적격보어로 쓰인 원형부정사이다.</div><div class=\"lec-gr-item\">inviting (현재분사(형용사)): inviting이 look 뒤에서 주어 it의 상태를 설명하는 보어 역할을 한다. 형태는 -ing이지만 명사 역할이 아니라 형용사적 보어로 쓰였다.</div><div class=\"lec-gr-item\">to read (to부정사): to read는 starting의 목적어 역할을 하는 명사적 용법의 to부정사이다. 구조는 start + to V이다.</div><div class=\"lec-gr-item\">from even starting (동명사): starting은 전치사 from의 목적어로 쓰인 -ing 형태이다. 전치사 뒤에는 명사 성분이 오므로 여기서는 동명사로 분석한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">paragraph</td><td class=\"m\">문단, 단락</td></tr><tr><td class=\"w\">inviting</td><td class=\"m\">매력적인, 솔깃한, 끌리는</td></tr><tr><td class=\"w\">chunk</td><td class=\"m\">덩어리, 상당히 큰 부분</td></tr><tr><td class=\"w\">discourage</td><td class=\"m\">낙담시키다, 막다, 의욕을 꺾다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">신문 단락은</span><span class=\"en\"><b>Newspaper paragraphs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 두세 문장 길이여야 한다;</span><span class=\"en\"><b>should be only two or three sentences long;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신문의 활자는</span><span class=\"en\"><b>newspaper type</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">짜여 있고</span><span class=\"en\"><b><span class=\"grammar-hl\">is set</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좁은 폭으로</span><span class=\"en\"><b><span class=\"grammar-hl\">in a narrow width</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 인치는</span><span class=\"en\"><b>and the inches</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">빠르게 늘어난다</span><span class=\"en\"><b>quickly <span class=\"grammar-hl\">add up</span>.</b></span></div></div><div class=\"lec-sent-ko\">신문 단락은 오직 두세 문장 길이여야 하는데, 신문의 활자는 좁은 폭으로 짜여 있고, 인치는 빠르게 늘어난다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 원리를 신문이라는 구체적인 사례로 설명합니다. 신문은 한 줄의 폭이 좁아 같은 문장도 세로로 길게 보이기 쉽습니다. 그래서 몇 문장만 이어져도 지면에서 길고 답답한 문단처럼 보일 수 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is set in a narrow width (수동태): be동사(is)+p.p.(set) 구조이다. set은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) is set 형태로 쓴다. 기본구조: set + O + in + 명사구.</div><div class=\"lec-gr-item\">add up (관용표현): add up은 동사 add와 부사 up이 결합한 구동사로, 주어 the inches가 동사구 add up의 주어로 쓰인 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">paragraph</td><td class=\"m\">문단, 단락</td></tr><tr><td class=\"w\">narrow</td><td class=\"m\">좁은, 폭이 좁은</td></tr><tr><td class=\"w\">add up</td><td class=\"m\">늘어나다, 합산되다, 앞뒤가 맞다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신은 생각할 수도 있다</span><span class=\"en\"><b>You may think</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 잦은 단락 나누기가</span><span class=\"en\"><b><span class=\"grammar-hl\">such frequent paragraphing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해를 입힐 것이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">will damage</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">당신의 요지 전개에</span><span class=\"en\"><b><span class=\"grammar-hl\">the development of your point</span>.</b></span></div></div><div class=\"lec-sent-ko\">당신은 이러한 잦은 단락 나누기가 당신의 요지 전개에 해를 입힐 것이라고 생각할 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이는 독자가 가질 만한 걱정을 먼저 꺼냅니다. 문단을 너무 자주 나누면 생각이 끊어지고 주장이 약해 보일까 봐 걱정할 수 있다는 점을 인정하며, 다음 문장에서 그런 두려움이 실제로 어떤 글에서 나타나는지 예로 듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">such frequent paragraphing (동명사): paragraphing은 -ing 형태가 명사 역할을 하며, 형용사 frequent의 수식을 받는다. such frequent paragraphing 전체가 think 뒤 내용절의 주어 역할을 한다.</div><div class=\"lec-gr-item\">will damage the development of your point 기본 구조: will damage는 조동사 will + 동사원형 damage이고, damage 뒤에 목적어 the development of your point가 온 SVO 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">paragraph</td><td class=\"m\">문단, 단락</td></tr><tr><td class=\"w\">paragraphing</td><td class=\"m\">문단 나누기, 단락 구성</td></tr><tr><td class=\"w\">development</td><td class=\"m\">전개, 발전, 발달</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">명백히</span><span class=\"en\"><b>Obviously</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">The New Yorker는</span><span class=\"en\"><b>The New Yorker</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사로잡혀 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is obsessed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 두려움에</span><span class=\"en\"><b><span class=\"grammar-hl\">by this fear</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">― 독자는</span><span class=\"en\"><b>― a reader</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갈 수 있다</span><span class=\"en\"><b>can go</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수 마일 동안</span><span class=\"en\"><b>for miles</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쉼 없이</span><span class=\"en\"><b>without relief.</b></span></div></div><div class=\"lec-sent-ko\">명백히 The New Yorker는 이 두려움에 사로잡혀 있는데, 독자는 쉼 없이 수 마일을 갈 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 걱정의 사례로 지를 언급합니다. 이 잡지는 문단을 자주 나누면 글의 흐름이 깨진다고 지나치게 걱정하는 듯하며, 그 결과 독자는 매우 긴 문단을 계속 읽으며 피로감을 느낀다는 의미입니다. 여기서 글쓴이는 약간의 풍자를 섞어 말합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is obsessed by this fear (수동태): be동사(is)+p.p.(obsessed) 구조이다. obsess는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) is obsessed 형태로 쓴다. 기본구조: obsess + O. by this fear는 행위자/원인에 해당하는 전치사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">relief</td><td class=\"m\">안도, 완화, 휴식</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">걱정하지 마라;</span><span class=\"en\"><b><span class=\"grammar-hl\">Don't worry</span>;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얻는 이점이</span><span class=\"en\"><b>the gains</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 능가한다</span><span class=\"en\"><b><span class=\"grammar-hl\">far outweigh</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위험성을</span><span class=\"en\"><b><span class=\"grammar-hl\">the hazards</span>.</b></span></div></div><div class=\"lec-sent-ko\">걱정하지 마라. 얻는 이점이 위험성을 훨씬 능가한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서 제기한 걱정에 대한 글쓴이의 답입니다. 문단을 자주 나누면 논리 전개가 조금 어색해질 위험이 있을 수 있지만, 독자가 글을 더 쉽게 읽고 시작하게 만드는 장점이 훨씬 크다고 결론짓습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Don&#39;t worry 부정 명령문: Don&#39;t + 동사원형 구조로, 주어 you가 생략된 명령문이다. worry는 동사원형으로 쓰였다.</div><div class=\"lec-gr-item\">far outweigh the hazards 기본 구조: outweigh는 타동사로 뒤에 목적어 the hazards를 취한다. far는 동사 outweigh의 정도를 강화하는 부사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">outweigh</td><td class=\"m\">~보다 더 크다, ~보다 중요하다, 능가하다</td></tr><tr><td class=\"w\">hazard</td><td class=\"m\">위험, 위험 요소</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 가지는 말라</span><span class=\"en\"><b>But <span class=\"grammar-hl\">don't go</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 멀리</span><span class=\"en\"><b><span class=\"grammar-hl\">too far</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 너무 지나치지는 말라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 글의 흐름이 전환됩니다. 지금까지는 짧은 문단의 장점을 강조했지만, 이제 글쓴이는 그 조언을 과하게 적용할 때 생기는 문제를 말하려고 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">don&#39;t go too far (관용표현): go too far는 go + 부사구 too far가 결합한 표현으로, 문장에서는 Don&#39;t + 동사원형 go 형태의 부정 명령문 안에 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">go too far</td><td class=\"m\">지나치다, 도를 넘다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아주 작은 단락의 연속은</span><span class=\"en\"><b>A succession of tiny paragraphs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">짜증스럽다</span><span class=\"en\"><b>is <span class=\"grammar-hl\">as annoying</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">너무 긴 단락만큼이나</span><span class=\"en\"><b><span class=\"grammar-hl\">as a paragraph</span> <span class=\"grammar-hl\">that's too long</span>.</b></span></div></div><div class=\"lec-sent-ko\">아주 작은 단락의 연속은 너무 긴 단락만큼이나 짜증스럽다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 짧은 문단을 무조건 많이 쓰는 것도 문제가 된다는 점을 설명합니다. 너무 긴 문단은 답답하고, 지나치게 잘게 쪼갠 문단은 생각의 흐름을 자꾸 끊어서 독자를 피곤하게 만듭니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">annoying (현재분사(형용사)): annoying은 -ing 형태가 형용사처럼 쓰여 주어 A succession of tiny paragraphs의 성질을 설명하는 주격보어 역할을 한다.</div><div class=\"lec-gr-item\">that&#39;s too long (관계대명사): that은 선행사 a paragraph를 수식하는 관계대명사절의 주어 역할을 한다. that is too long에서 that이 주어, is가 동사이다.</div><div class=\"lec-gr-item\">as annoying as a paragraph (비교구문): as + 형용사 + as 구조로, 앞의 주어 A succession of tiny paragraphs와 뒤의 a paragraph를 같은 정도의 성질로 비교한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">paragraph</td><td class=\"m\">문단, 단락</td></tr><tr><td class=\"w\">succession</td><td class=\"m\">연속, 잇따름, 계승</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 떠올리고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">I'm thinking</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 모든 아주 작은 단락들을</span><span class=\"en\"><b><span class=\"grammar-hl\">of</span> all those tiny paragraphs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">― 동사가 없는 경이로운 것들을 ―</span><span class=\"en\"><b>― <span class=\"grammar-hl\">verbless wonders</span> ―</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현대의 기자들에 의해 쓰여진</span><span class=\"en\"><b><span class=\"grammar-hl\">written by modern journalists</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 기사를 빠르‘고’ 쉽게 만들려고 애쓰는</span><span class=\"en\"><b><span class=\"grammar-hl\">trying to make their articles quick 'n' easy</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 기사를 빠르‘고’ 쉽게 만들려고 애쓰는 현대의 기자들에 의해 쓰여진 그 모든 아주 작은 단락들, 즉 동사가 없는 경이로운 것들을 떠올리고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 ‘너무 작은 문단들’이 무엇을 가리키는지 구체화합니다. 일부 현대 기자들은 기사를 가볍고 빠르게 읽히게 만들려고 한두 단어짜리 조각 문단을 남발합니다. 글쓴이는 이런 방식이 멋있고 간결해 보이려는 시도라고 보며 비판적으로 말합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I&#39;m thinking of (현재진행): be동사(am)+-ing(thinking) 구조로 현재 진행 중인 동작을 나타낸다. 이때 thinking은 진행형을 만드는 동사 형태이므로 동명사나 현재분사로 분석하지 않는다.</div><div class=\"lec-gr-item\">written by modern journalists (과거분사(형용사)): written이 앞의 all those tiny paragraphs / verbless wonders를 뒤에서 수식한다. 구조는 N + p.p.로, 축약 관계절 paragraphs/wonders that are written by modern journalists에 해당한다.</div><div class=\"lec-gr-item\">trying to make their articles quick &#39;n&#39; easy (현재분사(형용사)): trying이 modern journalists를 뒤에서 수식한다. 구조는 N + -ing로, journalists who are trying to make their articles quick &#39;n&#39; easy처럼 관계절을 줄인 형태이다.</div><div class=\"lec-gr-item\">to make their articles quick &#39;n&#39; easy (to부정사): to make는 trying의 목적어 역할을 하는 명사적 용법이다. 구조는 try + to V이다.</div><div class=\"lec-gr-item\">make their articles quick &#39;n&#39; easy (5형식(SVOC)): make 뒤에 목적어 their articles와 목적격보어 quick &#39;n&#39; easy가 온 구조이다. quick &#39;n&#39; easy는 목적어 their articles의 상태를 설명하는 형용사구 보어이다.</div><div class=\"lec-gr-item\">verbless wonders (동격): verbless wonders는 앞의 all those tiny paragraphs를 다시 설명하는 명사구이다. 명사구가 다른 명사구를 같은 대상을 가리키며 보충 설명하는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">paragraph</td><td class=\"m\">문단, 단락</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실</span><span class=\"en\"><b>Actually</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은</span><span class=\"en\"><b>they</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">독자의 일을 더 어렵게 만든다</span><span class=\"en\"><b><span class=\"grammar-hl\">make the reader's job harder</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘라내 버림으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by chopping up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연스러운 생각의 맥락을</span><span class=\"en\"><b><span class=\"grammar-hl\">a natural train of thought</span>.</b></span></div></div><div class=\"lec-sent-ko\">사실 그것들은 자연스러운 생각의 맥락을 잘라내 버림으로써 독자의 일을 더 어렵게 만든다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 최종 결론입니다. 지나치게 짧은 문단은 읽기 쉬워 보일 수 있지만, 실제로는 생각의 연결을 끊어서 독자가 내용을 따라가기 더 어렵게 만듭니다. 글쓴이의 핵심 조언은 문단을 짧게 하되, 자연스러운 흐름이 유지될 만큼의 적절한 길이를 지키라는 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make the reader&#39;s job harder (5형식(SVOC)): make가 목적어 the reader&#39;s job과 목적격보어 harder를 취하는 구조이다. harder는 목적어의 상태를 설명하는 형용사 비교급 보어이다.</div><div class=\"lec-gr-item\">by chopping up (동명사): chopping up은 전치사 by의 목적어로 쓰인 -ing 형태이다. 전치사 뒤에서 명사 역할을 하므로 동명사이다.</div><div class=\"lec-gr-item\">chopping up (관용표현): chop up은 동사 chop과 부사 up이 결합한 구동사이다. 여기서는 by 뒤에서 동명사형 chopping up으로 쓰였다.</div><div class=\"lec-gr-item\">a natural train of thought (관용표현): train of thought는 명사 train과 전치사구 of thought가 결합한 고정 표현이다. 문장에서는 chopping up의 목적어구 안에서 핵심 명사구 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">train of thought</td><td class=\"m\">사고의 흐름, 생각의 맥락</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>글은 내용보다 먼저 눈에 들어오기 때문에 문단의 모양이 중요하다.</li><li>짧은 문단은 여백을 만들어 글을 읽기 쉽게 보이게 한다.</li><li>너무 긴 문단은 독자가 읽기 시작하기도 전에 부담을 느끼게 한다.</li><li>그러나 문단을 지나치게 잘게 나누면 생각의 흐름이 끊어진다.</li><li>좋은 글은 짧고 읽기 쉬운 문단을 쓰되, 자연스러운 논리 흐름을 유지해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Short paragraphs make writing more inviting, but overly tiny paragraphs can interrupt coherence and make reading harder.</div>\n              <div class=\"lec-final-sum-ko\">짧은 문단은 글을 더 읽기 쉽게 만들지만, 지나치게 짧은 문단은 일관성을 방해하고 읽기를 더 어렵게 만들 수 있다.</div></div></div>"],"segs":[[{"audio":"./30_audio/1.mp3","hl":null}],[{"audio":"./30_audio/2.mp3","hl":null}],[{"audio":"./30_audio/3.mp3","hl":null},{"audio":"./30_audio/4.mp3","hl":"stage-0"},{"audio":"./30_audio/5.mp3","hl":"stage-1"},{"audio":"./30_audio/6.mp3","hl":"stage-2"},{"audio":"./30_audio/7.mp3","hl":"stage-3"}],[{"audio":"./30_audio/8.mp3","hl":null}],[{"audio":"./30_audio/9.mp3","hl":"main"},{"audio":"./30_audio/10.mp3","hl":"meaning"},{"audio":"./30_audio/11.mp3","hl":"grammar"}],[{"audio":"./30_audio/12.mp3","hl":"main"},{"audio":"./30_audio/13.mp3","hl":"meaning"},{"audio":"./30_audio/14.mp3","hl":"grammar"}],[{"audio":"./30_audio/15.mp3","hl":"main"},{"audio":"./30_audio/16.mp3","hl":"meaning"},{"audio":"./30_audio/17.mp3","hl":"grammar"}],[{"audio":"./30_audio/18.mp3","hl":"main"},{"audio":"./30_audio/19.mp3","hl":"meaning"},{"audio":"./30_audio/20.mp3","hl":"grammar"}],[{"audio":"./30_audio/21.mp3","hl":"main"},{"audio":"./30_audio/22.mp3","hl":"meaning"},{"audio":"./30_audio/23.mp3","hl":"grammar"}],[{"audio":"./30_audio/24.mp3","hl":"main"},{"audio":"./30_audio/25.mp3","hl":"meaning"},{"audio":"./30_audio/26.mp3","hl":"grammar"}],[{"audio":"./30_audio/27.mp3","hl":"main"},{"audio":"./30_audio/28.mp3","hl":"meaning"},{"audio":"./30_audio/29.mp3","hl":"grammar"}],[{"audio":"./
