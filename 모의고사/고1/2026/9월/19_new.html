@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 9월 고1 모의고사 19번","audioDir":"2026-09-g1-19_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">19번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 9월 고1 모의고사\u003c/div>\u003ch1>A Helping Voice: Maggie Overcomes Stage Fright with Durwood\u003c/h1>\u003ch2>돕는 목소리: Durwood와 함께 무대 공포증을 극복한 Maggie\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>처음 혼자 노래를 부르게 된 Maggie가 극도의 \u003cb class=\"key\">긴장감\u003c/b>을 느끼던 중, 옆에서 함께 노래해 준 Durwood 덕분에 안정을 되찾고 \u003cb class=\"key\">성공적\u003c/b>으로 노래를 마치는 이야기입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Maggie overcame her stage fright and finished her performance successfully thanks to Durwood’s supportive singing.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 고등학교 일학년 구월 모의고사 열아홉 번째 지문을 함께 읽어볼 거예요. 이 글은 무대 위에서 혼자 노래하며 겁에 질렸던 Maggie가 옆에 있던 Durwood의 도움으로 안정을 찾는 과정을 담고 있어요. 불안에서 안심으로 바뀌는 심경의 변화와 따뜻한 협동의 가치를 함께 느껴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">공적인 자리나 무대 위에서 느끼는 압박감을 \u003cb class=\"key\">무대 \u003c/b>\u003cb class=\"key\">공포증(Stage \u003c/b>\u003cb class=\"key\">Fright)\u003c/b>이라고 합니다. 이는 누군가 나를 지켜보고 있다는 의식 때문에 발생하는 신체적 \u003cb class=\"key\">긴장 \u003c/b>\u003cb class=\"key\">반응\u003c/b>으로, 심박수 증가와 근육 경직을 동반합니다. 이때 주변 사람의 지지나 도움인 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">지지(Social \u003c/b>\u003cb class=\"key\">Support)\u003c/b>는 불안을 줄이는 데 큰 역할을 합니다. 마치 혼자 해결하기 힘든 숙제를 친구와 함께 할 때 마음이 \u003cb class=\"key\">편안해지는 \u003c/b>\u003cb class=\"key\">것\u003c/b>과 같습니다. 이 지문에서도 Maggie의 긴장 상태는 Durwood라는 \u003cb class=\"key\">조력자\u003c/b>의 등장으로 해소됩니다.\u003c/div>","segs":[{"n":2,"text":"여러분은 많은 사람 앞에서 발표할 때 목소리가 떨린 적이 있나요? 이런 현상을 영어로 Stage Fright 즉 무대 공포증이라고 해요. 심장이 빠르게 뛰고 몸이 굳어버리는 건 우리가 위협을 느낄 때 나타나는 자연스러운 반응이죠. 이때 누군가 곁에서 함께해 주는 사회적 지지인 Social Support는 공포를 이겨내는 가장 큰 힘이 됩니다. 오늘 지문의 Maggie에게 Durwood가 바로 그런 존재였어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>무대의 시작과 긴장\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Maggie가 처음으로 혼자 노래를 시작하며 느끼는 신체적 \u003cb class=\"key\">불안감\u003c/b>을 묘사합니다. 그녀의 목소리는 떨리고 심장은 빠르게 뛰며 주변의 시선에 \u003cb class=\"key\">압박감\u003c/b>을 느낍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>가사 암기의 압박\u003csmall>전개 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>실수하지 않기 위해 가사에 극도로 집중하며 \u003cb class=\"key\">강박적인 \u003c/b>\u003cb class=\"key\">상태\u003c/b>가 됩니다. 이때 옆에서 일어나는 어떤 \u003cb class=\"key\">움직임\u003c/b>을 알아차리며 분위기가 전환될 준비를 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>조력자의 등장\u003csmall>전환 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>Durwood가 조용히 일어나 노래를 돕자 Maggie는 비로소 참았던 숨을 내쉬며 \u003cb class=\"key\">안도감\u003c/b>을 얻습니다. 조력자의 목소리가 그녀를 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">고립\u003c/b>에서 구해냅니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>안정과 성공적 마무리\u003csmall>결론 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>신체적 긴장이 풀리고 더 이상 얼어붙지 않은 상태로 \u003cb class=\"key\">자신감\u003c/b>을 되찾습니다. 결국 두 사람은 조화롭게 노래를 마침으로써 \u003cb class=\"key\">해피엔딩\u003c/b>을 맞이합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"Maggie의 마음이 어떻게 얼어붙었다가 녹아내리는지 시간 순서에 따라 흐름을 짚어볼게요.","hl":null},{"n":4,"text":"첫 번째부터 세 번째 문장에서는 무대 위에 선 Maggie의 공포심이 생생하게 묘사됩니다. 처음으로 혼자 노래하게 된 상황에서 목소리는 shaking하고 심장은 race하기 시작하죠. 아이들의 시선을 느끼며 그녀의 긴장은 최고조에 달합니다.","hl":"f0"},{"n":5,"text":"네 번째와 다섯 번째 문장에서는 가사를 잊지 않으려고 lyrics에 집중하는 필사적인 모습이 그려져요. 이때 Then이라는 단어와 함께 옆에서 어떤 움직임을 발견하게 되는데, 이것이 이야기의 반전 포인트가 됩니다.","hl":"f1"},{"n":6,"text":"여섯 번째부터 여덟 번째 문장에서 Durwood가 조용히 일어나 sing along 즉 노래를 함께 불러주기 시작해요. 그의 steady하고 calm한 목소리를 듣자 Maggie는 비로소 참았던 숨을 내쉬며 안도하게 됩니다.","hl":"f2"},{"n":7,"text":"마지막 아홉 번째부터 열한 번째 문장에서는 신체적 변화가 나타나요. 어깨의 tightness가 fade하고 가슴의 tension이 ease되죠. 이제 no longer frozen 즉 더 이상 얼어붙지 않은 Maggie는 끝까지 노래를 완벽하게 마칩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">사건의 발생과 심리적 위기, 그리고 해결까지의 과정이 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 순차적으로 전개됩니다. 처음의 부정적인 심리 상태가 조력자의 개입으로 인해 긍정적으로 변화하는 \u003cb class=\"key\">심경 \u003c/b>\u003cb class=\"key\">변화\u003c/b> 구조를 취하고 있습니다. 마지막 문장에서 두 사람이 함께 노래를 마쳤다는 결론을 통해 독자에게 \u003cb class=\"key\">해결의 \u003c/b>\u003cb class=\"key\">카타르시스\u003c/b>를 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Then (5)\u003c/b>\u003cspan>분위기 전환 및 새로운 사건의 시작 지시\u003c/span>\u003cb>no longer (11)\u003c/b>\u003cspan>부정적 상태가 종료되었음을 나타냄\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">shaking\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">race\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">tightness\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">tension\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">frozen\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 사건이 발생한 순서대로 전개되는 시간순 구조를 가지고 있어요. Maggie가 겪는 긴박한 문제 상황이 Durwood의 도움으로 해결되는 과정을 보여주죠. 결론에서 두 사람이 함께 노래를 마치는 미괄식 구조로 마무리됩니다.","hl":"ty"},{"n":9,"text":"이야기의 전환을 알리는 Then이라는 신호어가 다섯 번째 문장에서 아주 중요하게 쓰였어요. 또한 긴장을 뜻하는 tightness와 tension이라는 단어가 사라지는 fade와 ease라는 동사와 결합하며 감정의 변화를 시각적으로 보여주고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>stood up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일어났다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grip\u003c/b>\u003cem>동사\u003c/em>\u003cspan>꽉 붙잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>seat\u003c/b>\u003cem>명사\u003c/em>\u003cspan>좌석\u003c/span>\u003c/div>\u003cdiv>\u003cb>in front of\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 앞에\u003c/span>\u003c/div>\u003cdiv>\u003cb>sung alone\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>혼자 노래했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>open one's mouth\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>입을 열다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shaking\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>떨리는\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>뒤돌아보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>heart\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심장\u003c/span>\u003c/div>\u003cdiv>\u003cb>race\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빠르게 뛰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>focus on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 집중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lyrics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가사\u003c/span>\u003c/div>\u003cdiv>\u003cb>notice\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아차리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>movement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>움직임\u003c/span>\u003c/div>\u003cdiv>\u003cb>beside\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 옆에\u003c/span>\u003c/div>\u003cdiv>\u003cb>quietly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>조용히\u003c/span>\u003c/div>\u003cdiv>\u003cb>sing along\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>함께 노래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>steady\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>안정된\u003c/span>\u003c/div>\u003cdiv>\u003cb>calm\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>차분한\u003c/span>\u003c/div>\u003cdiv>\u003cb>carry forward\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>앞으로 이끌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>let out a breath\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>숨을 내쉬다\u003c/span>\u003c/div>\u003cdiv>\u003cb>realize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨닫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tightness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경직, 긴장\u003c/span>\u003c/div>\u003cdiv>\u003cb>shoulder\u003c/b>\u003cem>명사\u003c/em>\u003cspan>어깨\u003c/span>\u003c/div>\u003cdiv>\u003cb>fade\u003c/b>\u003cem>동사\u003c/em>\u003cspan>서서히 사라지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tension\u003c/b>\u003cem>명사\u003c/em>\u003cspan>긴장\u003c/span>\u003c/div>\u003cdiv>\u003cb>chest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가슴\u003c/span>\u003c/div>\u003cdiv>\u003cb>ease\u003c/b>\u003cem>동사\u003c/em>\u003cspan>누그러지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>continue\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계속하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>frozen\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>얼어붙은\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어 몇 개만 살펴볼까요? 노래 가사를 뜻하는 lyrics와 안정되었다는 뜻의 steady는 꼭 기억하세요. 특히 frozen은 단순히 춥다는 뜻이 아니라 겁에 질려 몸이 굳어버린 상태를 표현할 때 자주 쓰인답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">shaking\u003c/b>\u003cspan class=\"m\">떨리는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trembling\u003c/span>\u003cspan class=\"s\">quivering\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">steady\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">steady\u003c/b>\u003cspan class=\"m\">안정된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stable\u003c/span>\u003cspan class=\"s\">consistent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unstable\u003c/span>\u003cspan class=\"a\">shaky\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fade\u003c/b>\u003cspan class=\"m\">서서히 사라지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disappear\u003c/span>\u003cspan class=\"s\">vanish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">appear\u003c/span>\u003cspan class=\"a\">emerge\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">tension\u003c/b>\u003cspan class=\"m\">긴장\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">strain\u003c/span>\u003cspan class=\"s\">stress\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relaxation\u003c/span>\u003cspan class=\"a\">ease\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">frozen\u003c/b>\u003cspan class=\"m\">얼어붙은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">paralyzed\u003c/span>\u003cspan class=\"s\">stiff\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relaxed\u003c/span>\u003cspan class=\"a\">active\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 봐요. 떨리는 이라는 뜻의 shaking은 trembling과 바꿔 쓸 수 있고, 안정적인이라는 steady와는 반대되는 개념입니다. 긴장이 누그러지다라는 ease는 고통을 덜어주는 relieve와 비슷하다는 점도 함께 챙겨두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Maggie는 자리에서 일어나,\u003c/span>\u003cspan class=\"en\">Maggie stood up,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 손으로 좌석을 꽉 붙잡았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">hands \u003c/span>\u003cspan class=\"tgt\">gripping\u003c/span> the seat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀 앞의.\u003c/span>\u003cspan class=\"en\">in front of her.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Maggie는 자리에서 일어나 그녀 앞의 좌석을 자신의 손으로 꽉 붙잡았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공연을 앞둔 Maggie의 극심한 \u003cb class=\"key\">긴장감\u003c/b>을 묘사하며 글의 분위기를 조성합니다. 좌석을 꽉 붙잡는 행위는 심리적 \u003cb class=\"key\">불안\u003c/b>을 시각적으로 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">독립 분사구문\u003c/span> : [명사(의미상 주어)] + [현재분사(~ing)] : \"그녀의 손으로 꽉 붙잡은 채로\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Maggie stood up, Maggie는 자리에서 일어나.  her hands gripping the seat, 그녀의 손으로 좌석을 꽉 붙잡았다.  in front of her, 그녀 앞의.. 이 문장 전체를 해석하면, Maggie는 자리에서 일어나 그녀 앞의 좌석을 자신의 손으로 꽉 붙잡았다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 주인공의 긴장된 상태를 보여주며 시작해요. 좌석을 꽉 붙잡았다는 표현을 통해 주인공이 지금 얼마나 떨고 있는지 그 심경을 짐작할 수 있습니다.","hl":"mn"},{"n":14,"text":"여기서 her hands gripping 부분에 주목해 보세요. 주절의 주어 Maggie와 손이라는 주어가 다르기 때문에 분사 앞에 her hands를 써준 독립 분사구문이에요. 손이 능동적으로 잡고 있는 것이니까 현재분사 gripping을 쓴 것도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 혼자 노래를 불러본 적이 한 번도 없었고,\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">sung\u003c/span> alone before,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">입을 열어 노래를 시작하자,\u003c/span>\u003cspan class=\"en\">and as she opened her mouth \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">begin\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 목소리가 떨리기 시작했다.\u003c/span>\u003cspan class=\"en\">her voice started shaking.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 혼자 노래를 불러본 적이 한 번도 없었고, 입을 열어 노래를 시작하자 그녀의 목소리가 떨리기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거의 \u003cb class=\"key\">경험 \u003c/b>\u003cb class=\"key\">부재\u003c/b>를 언급하여 긴장의 원인을 설명합니다. 목소리가 떨리는 구체적인 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">증상\u003c/b>을 통해 긴장이 고조됨을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료 (경험)\u003c/span> : had + [과거분사(p.p.)] : \"노래해 본 적이 없었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + [동사원형] : \"시작하기 위해서\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"She had never sung alone before, 그녀는 혼자 노래를 불러본 적이 한 번도 없었고.  and as she opened her mouth to begin, 입을 열어 노래를 시작하자.  her voice started shaking, 그녀의 목소리가 떨리기 시작했다.. 이 문장 전체를 해석하면, 그녀는 혼자 노래를 불러본 적이 한 번도 없었고, 입을 열어 노래를 시작하자 그녀의 목소리가 떨리기 시작했다.","hl":"m"},{"n":16,"text":"두 번째 문장에서는 왜 그녀가 이렇게 긴장하는지 이유가 나옵니다. 솔로 공연이 처음이라서 목소리가 떨리는 신체적인 반응까지 나타나고 있네요.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 had never sung입니다. 노래를 시작한 과거 시점보다 그 이전의 경험을 말하니까 과거완료 시제를 썼어요. 두 번째 포인트는 to begin인데, 입을 연 목적을 나타내는 부사적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 아이들이 뒤돌아보았고\u003c/span>\u003cspan class=\"en\">A few children turned around\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀를 바라보기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">at\u003c/span> her,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 심장이 빠르게 뛰기 시작했다.\u003c/span>\u003cspan class=\"en\">and her heart began \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">race\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 아이들이 뒤돌아 그녀를 바라보았고, 그녀의 심장이 빠르게 뛰기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주변의 \u003cb class=\"key\">시선\u003c/b>이 자신에게 쏠리자 압박감이 심해지는 상황입니다. 심장이 뛰는 묘사로 \u003cb class=\"key\">불안감\u003c/b>이 절정에 달했음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + [동사원형] : \"바라보기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : began + [to부정사] : \"뛰는 것을\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"A few children turned around, 몇몇 아이들이 뒤돌아보았고.  to look at her, 그녀를 바라보기 위해.  and her heart began to race, 그녀의 심장이 빠르게 뛰기 시작했다.. 이 문장 전체를 해석하면, 몇몇 아이들이 뒤돌아 그녀를 바라보았고, 그녀의 심장이 빠르게 뛰기 시작했다.","hl":"m"},{"n":19,"text":"세 번째 문장에서는 주변 반응이 추가됩니다. 아이들이 쳐다보니까 Maggie는 더 긴장하게 되고, 심장 박동이 빨라지는 심리적 압박을 느끼고 있어요.","hl":"mn"},{"n":20,"text":"여기서 to look at은 뒤를 돌아본 목적을 말하는 부사적 용법이에요. 그리고 마지막 부분의 to race는 began이라는 동사의 목적어로 쓰인 명사적 용법입니다. race는 여기서 경주가 아니라 심장이 아주 빨리 뛴다는 뜻으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 애써 집중했다\u003c/span>\u003cspan class=\"en\">She focused hard\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가사에\u003c/span>\u003cspan class=\"en\">on the lyrics,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노력하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">trying\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잊지 않으려고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">forget\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단어들을\u003c/span>\u003cspan class=\"en\">the words.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가사를 잊지 않으려 그녀는 가사에 애써 집중했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 매기가 노래 도중 실수하지 않으려고 \u003cb class=\"key\">필사적\u003c/b>으로 노력하는 긴장된 내면을 보여줍니다. 다른 곳에 눈을 돌릴 여유도 없이 \u003cb class=\"key\">가사\u003c/b>에만 모든 신경을 쏟고 있는 상황입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 분사구문\u003c/span> : [주어] + [동사] ~, [v-ing] (분사구문) : \"노력하며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부정\u003c/span> : not + [to부정사] : \"잊지 않기 위해서\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"She focused hard, 그녀는 애써 집중했다. on the lyrics, 가사에. trying, 노력하며. not to forget, 잊지 않으려고. the words, 단어들을. 이 문장 전체를 해석하면, 가사를 잊지 않으려 그녀는 가사에 애써 집중했다.","hl":"m"},{"n":22,"text":"가사를 잊지 않으려고 애쓰는 매기의 간절함이 느껴지나요? 너무 떨려서 다른 생각은 못 하고 오직 가사에만 신경을 쏟고 있는 절박한 상황이에요.","hl":"mn"},{"n":23,"text":"첫 번째 포인트인 trying은 앞 문장에 이어지는 분사구문으로 주어의 동작을 보충 설명해 줍니다. 두 번째 포인트인 not to forget은 별표를 쳐두세요. 투부정사를 부정할 때는 부정어 not을 반드시 앞에 써야 한다는 규칙을 꼭 기억해야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때\u003c/span>\u003cspan class=\"en\">Then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 알아차렸다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">noticed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">움직임을\u003c/span>\u003cspan class=\"en\">movement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 옆에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">beside\u003c/span> her.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그때 그녀는 자신의 옆에서 움직임을 알아차렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불안감이 극에 달한 순간, 주변의 변화를 감지하며 분위기가 바뀌기 시작하는 \u003cb class=\"key\">전환점\u003c/b>입니다. 혼자라는 두려움 속에서 타인의 \u003cb class=\"key\">존재\u003c/b>를 처음으로 느끼게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사의 과거형\u003c/span> : [주어] + [noticed (타동사 과거형)] + [목적어] : \"알아차렸다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">장소의 전치사\u003c/span> : beside + [명사/대명사] : \"~의 옆에\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Then, 그때. she noticed, 그녀는 알아차렸다. movement, 움직임을. beside her, 자신의 옆에서. 이 문장 전체를 해석하면, 그때 그녀는 자신의 옆에서 움직임을 알아차렸다.","hl":"m"},{"n":25,"text":"혼자 벌벌 떨고 있던 매기에게 어떤 변화가 생기려나 봐요. 옆에서 느껴진 움직임이 과연 무엇일지 궁금증을 유발하는 문장입니다.","hl":"mn"},{"n":26,"text":"여기서는 동사 noticed에 집중해 보세요. 주어가 무언가를 지각했음을 나타내는 타동사로 쓰였습니다. 뒤에 오는 전치사 beside는 가까운 옆자리를 뜻한다는 것도 함께 챙겨둡시다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Durwood가 조용히 일어났다\u003c/span>\u003cspan class=\"en\">Durwood quietly \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stood \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 시작했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">began\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께 노래를 부르기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sing \u003c/span>\u003cspan class=\"tgt\">along\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Durwood가 조용히 일어나 함께 노래를 부르기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 조력자인 Durwood가 매기를 돕기 위해 행동에 나서는 장면입니다. 매기의 \u003cb class=\"key\">긴장\u003c/b>을 덜어주기 위해 조용히 배려하며 \u003cb class=\"key\">동참\u003c/b>하는 모습이 묘사됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 과거형 병렬 구조\u003c/span> : [동사 1 (과거형)] + and + [동사 2 (과거형)] : \"일어났고 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : begin + [to부정사/동명사] : \"함께 노래 부르는 것을\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Durwood quietly stood up, Durwood가 조용히 일어났다. and began, 그리고 시작했다. to sing along, 함께 노래를 부르기. 이 문장 전체를 해석하면, Durwood가 조용히 일어나 함께 노래를 부르기 시작했다.","hl":"m"},{"n":28,"text":"드디어 도와주는 친구가 나타났네요. Durwood가 혼자 떨고 있는 매기를 위해 조용히 옆에서 같이 노래를 불러주기 시작하는 감동적인 장면입니다.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 stood up과 began입니다. 접속사 and가 과거 시점의 두 동작을 나란히 연결하는 병렬 구조를 이루고 있죠. 두 번째 포인트인 to sing along은 시작을 의미하는 동사 began 뒤에 목적으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 목소리는\u003c/span>\u003cspan class=\"en\">His voice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안정되고 차분했고,\u003c/span>\u003cspan class=\"en\">was steady and calm,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 노래를 앞으로 이끌고 있었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">carrying\u003c/span> the song forward.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 목소리는 안정되고 차분했고, 그 노래를 앞으로 이끌고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공포로 얼어붙은 Maggie에게 Durwood가 든든한 지원군이 되어주는 장면으로, 그의 목소리가 \u003cb class=\"key\">안정적인 \u003c/b>\u003cb class=\"key\">조력\u003c/b> 역할을 하여 분위기를 반전시킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사구문\u003c/span> : , [V-ing (현재분사)] : \"이끌면서\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"His voice, 그의 목소리는. was steady and calm, 안정되고 차분했고. carrying the song forward, 그 노래를 앞으로 이끌고 있었다.. 이 문장 전체를 해석하면, 그의 목소리는 안정되고 차분했고, 그 노래를 앞으로 이끌고 있었다.","hl":"m"},{"n":31,"text":"긴장한 Maggie에게 Durwood가 든든한 조력자가 되어주는 장면입니다. 그의 안정된 목소리가 노래를 주도하면서 Maggie가 다시 용기를 얻는 전환점 역할을 하고 있죠.","hl":"mn"},{"n":32,"text":"첫 번째 문법 포인트로 쉼표 뒤에 나온 carrying은 현재분사구문이라고 불러요. 그의 목소리가 노래를 이끌고 나가는 능동적인 상황을 설명하면서 자연스러운 부대상황을 나타내고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Maggie는 숨을 내쉬었다\u003c/span>\u003cspan class=\"en\">Maggie let out a \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">breath \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 깨닫지 못했던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">hadn't \u003c/span>\u003cspan class=\"tgt\">realized\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 참고 있다고.\u003c/span>\u003cspan class=\"en\">she was holding.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Maggie는 자신이 참고 있다고 깨닫지 못했던 숨을 내쉬었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 긴장이 해소되는 순간을 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>으로 묘사한 문장입니다. 참았던 숨을 내뱉는 행위는 주인공의 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">이완\u003c/b>을 상징합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : [선행사] + [(that/which)] + [주어 + 타동사] : \"그녀가 깨닫지 못했던 숨\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료\u003c/span> : had + [p.p. (과거분사)] : \"깨닫지 못했었다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Maggie let out a breath, Maggie는 숨을 내쉬었다. she hadn't realized, 자신이 깨닫지 못했던. she was holding, 자신이 참고 있다고.. 이 문장 전체를 해석하면, Maggie는 자신이 참고 있다고 깨닫지 못했던 숨을 내쉬었다.","hl":"m"},{"n":34,"text":"자신도 모르게 숨을 죽일 만큼 긴박했던 순간이 지나갔음을 보여주는 문장입니다. 참았던 숨을 한꺼번에 내뱉는 행동은 긴장 해소를 상징하는 아주 전형적인 표현이죠.","hl":"mn"},{"n":35,"text":"첫 번째로 breath와 she 사이에는 목적격 관계대명사가 생략되어 뒷문장이 앞의 명사를 꾸며주고 있어요. 두 번째로 hadn't realized는 과거완료 시제인데 숨을 내쉬기 전부터 이미 벌어지고 있었던 일을 강조하기 위해 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경직이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">tightness\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 어깨의\u003c/span>\u003cspan class=\"en\">in her shoulders\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서서히 사라졌다.\u003c/span>\u003cspan class=\"en\">slowly faded.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 어깨의 경직이 서서히 사라졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 불안이 해소되는 과정을 시각적이고 감각적으로 전달합니다. 어깨의 힘이 빠지는 묘사는 주인공의 \u003cb class=\"key\">심경 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 명확히 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">추상명사 주어\u003c/span> : The + [Noun (명사)] : \"경직, 긴장감\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The tightness, 경직이. in her shoulders, 그녀의 어깨의. slowly faded, 서서히 사라졌다.. 이 문장 전체를 해석하면, 그녀의 어깨의 경직이 서서히 사라졌다.","hl":"m"},{"n":37,"text":"심리적인 불안이 사라지면서 잔뜩 들어갔던 몸의 힘이 빠지는 과정입니다. 주인공의 심리 변화를 어깨라는 구체적인 신체 부위의 감각을 통해 시각적으로 전달하고 있어요.","hl":"mn"},{"n":38,"text":"첫 번째로 주어인 The tightness는 명사예요. 어깨라는 장소를 말해주는 전치사구인 in her shoulders가 뒤에서 수식하며 어떤 부위의 경직인지를 구체적으로 설명해주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Durwood가 그녀의 옆에서 노래를 부르자,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">Durwood \u003c/span>\u003cspan class=\"tgt\">singing\u003c/span> beside her,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가슴 속의 긴장이 누그러졌다.\u003c/span>\u003cspan class=\"en\">the tension in her chest eased.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Durwood가 그녀의 옆에서 노래를 부르자 가슴 속의 긴장이 누그러졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Durwood의 도움으로 Maggie가 심리적 \u003cb class=\"key\">안정감\u003c/b>을 되찾는 과정을 보여줍니다. 혼자일 때의 긴장이 타인의 \u003cb class=\"key\">지지\u003c/b>로 인해 해소되는 극적인 전환점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">with 분사구문\u003c/span> : with + 명사(목적어) + 현재분사(~ing) : \"Durwood가 노래를 부르며\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"With Durwood singing beside her, Durwood가 그녀의 옆에서 노래를 부르자. the tension in her chest eased, 가슴 속의 긴장이 누그러졌다.. 이 문장 전체를 해석하면, Durwood가 그녀의 옆에서 노래를 부르자 가슴 속의 긴장이 누그러졌다.","hl":"m"},{"n":40,"text":"Maggie가 혼자 떨고 있을 때 Durwood가 곁에서 같이 노래를 불러주기 시작하죠. 누군가 함께한다는 사실만으로도 큰 위안을 얻어서 긴장이 풀리는 아주 중요한 장면이에요.","hl":"mn"},{"n":41,"text":"첫 번째로 공부할 부분은 With Durwood singing입니다. With 뒤에 목적어와 분사가 나오는 구조인데요. 목적어인 Durwood가 직접 노래를 부르는 능동의 관계이기 때문에 현재분사 singing을 쓴 것이 핵심이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 노래를 이어 갔고,\u003c/span>\u003cspan class=\"en\">She continued the song,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상 얼어붙지 않은 채로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">longer \u003c/span>\u003cspan class=\"tgt\">frozen\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 함께 그것을 마쳤다.\u003c/span>\u003cspan class=\"en\">and they finished it together.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 더 이상 얼어붙지 않은 채로 노래를 이어 갔고, 그들은 함께 그것을 마쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 긴장을 극복한 Maggie가 능동적으로 노래를 완수하며 \u003cb class=\"key\">성취감\u003c/b>을 느끼는 결말입니다. 타인의 도움에서 시작해 스스로 \u003cb class=\"key\">극복\u003c/b>해내는 성장을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(형용사구)\u003c/span> : (being) + no longer + 형용사/과거분사 : \"더 이상 얼어붙지 않은 채로\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"She continued the song, 그녀는 노래를 이어 갔고. no longer frozen, 더 이상 얼어붙지 않은 채로. and they finished it together, 그들은 함께 그것을 마쳤다.. 이 문장 전체를 해석하면, 그녀는 더 이상 얼어붙지 않은 채로 노래를 이어 갔고, 그들은 함께 그것을 마쳤다.","hl":"m"},{"n":43,"text":"이제 Maggie는 겁먹지 않고 당당하게 노래를 끝까지 불러냅니다. 혼자가 아니라 함께 해냄으로써 갈등이 완전히 해소되는 훈훈한 마무리라고 볼 수 있죠.","hl":"mn"},{"n":44,"text":"여기서 주목할 포인트는 no longer frozen입니다. 문맥상 주어의 상태를 설명하는 분사구문인데요. 원래는 Being no longer frozen이었지만 맨 앞의 Being이 생략되면서 형용사인 frozen만 남은 구조라는 걸 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>처음으로 혼자 노래하게 된 Maggie는 목소리가 떨리고 심장이 뛰는 등 극심한 \u003cb class=\"key\">긴장\u003c/b>을 겪었습니다.\u003c/li>\u003cli>가사를 잊지 않으려고 애쓰던 위기의 순간, 친구 Durwood가 곁에서 \u003cb class=\"key\">함께 \u003c/b>\u003cb class=\"key\">노래\u003c/b>하기 시작했습니다.\u003c/li>\u003cli>Durwood의 차분한 목소리는 Maggie에게 안도감을 주었고, 어깨와 가슴의 \u003cb class=\"key\">경직\u003c/b>이 서서히 풀렸습니다.\u003c/li>\u003cli>조력자의 도움으로 용기를 얻은 Maggie는 더 이상 얼어붙지 않고 노래를 \u003cb class=\"key\">완벽하게\u003c/b> 마쳤습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Maggie overcame her stage fright and finished her performance successfully thanks to Durwood’s supportive singing.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">처음 혼자 노래를 부르게 된 Maggie가 극도의 \u003cb class=\"key\">긴장감\u003c/b>을 느끼던 중, 옆에서 함께 노래해 준 Durwood 덕분에 안정을 되찾고 \u003cb class=\"key\">성공적\u003c/b>으로 노래를 마치는 이야기입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"혼자서는 두려웠던 무대를 친구와 함께하며 멋지게 끝낸 Maggie의 이야기, 어떠셨나요? 우리도 힘든 일을 겪을 때 누군가의 따뜻한 곁을 내어주는 사람이 되면 좋겠네요. 오늘 배운 감정 표현들을 복습해 보시길 바라며 강의를 마치겠습니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
