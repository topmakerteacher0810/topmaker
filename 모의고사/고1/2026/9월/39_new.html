<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>39번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"39번","audioDir":"39_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">39번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>Leaf-Cutter Ants: The Master Farmers of the Underground\u003c/h1>\u003ch2>절엽 개미: 지하 세계의 숙련된 농부들\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>절엽 개미는 인간처럼 \u003cb class=\"key\">농경 \u003c/b>\u003cb class=\"key\">생활\u003c/b>을 하며, 잎을 잘라와 이를 \u003cb class=\"key\">비료\u003c/b>로 삼아 \u003cb class=\"key\">균류\u003c/b>를 재배함으로써 거대한 군락과 문명을 유지합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>By cultivating fungus through an organized agricultural system, leaf-cutter ants build and sustain massive underground civilizations similar to those of humans.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 서른아홉 번째 지문을 함께 살펴볼 거예요. 이 지문은 절엽 개미라는 아주 똑똑한 곤충이 어떻게 인간처럼 농사를 짓는지에 대한 이야기입니다. 요약하자면 절엽 개미는 잎을 비료로 써서 버섯 같은 균류를 재배하며 거대한 지하 문명을 이룹니다. 한마디로 개미들의 위대한 농업 일대기라고 할 수 있죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">자연계에는 인간처럼 농사를 짓는 독특한 생물인 \u003cb class=\"key\">절엽 \u003c/b>\u003cb class=\"key\">개미\u003c/b>(leaf-cutter ants)가 존재합니다. 이들은 잎을 직접 먹지 않고, 마치 우리가 \u003cb class=\"key\">비료\u003c/b>(fertilizer)를 써서 채소를 키우듯 잎을 잘게 씹어 \u003cb class=\"key\">균류\u003c/b>(fungus)를 재배하는 양분으로 삼습니다. 이 과정은 매우 정교하여 수백만 마리의 개미가 각자의 역할을 수행하는 \u003cb class=\"key\">분업화\u003c/b>된 사회 구조를 필요로 합니다. 우리 인간이 넓은 들판에 논밭을 일구는 것처럼, 개미들도 지하에 수백 제곱미터에 달하는 \u003cb class=\"key\">농업 \u003c/b>\u003cb class=\"key\">문명\u003c/b>(agricultural civilization)을 건설한다는 점이 이 글의 핵심입니다.\u003c/div>","segs":[{"n":2,"text":"혹시 개미가 잎을 줄지어 나르는 모습을 본 적 있나요? 보통은 개미가 그 잎을 먹으려 한다고 생각하기 쉬운데요, 절엽 개미는 조금 다릅니다. 이들은 마치 우리 인간이 밭에 거름을 주고 채소를 키우는 것처럼 잎을 비료로 활용해요. 잎을 잘게 씹어서 지하 정원에 깔아두고 그 위에서 균류, 즉 버섯 같은 것들을 키우는 거죠. 이런 정교한 생존 방식을 농업이라고 부르는데, 이를 통해 수백만 마리가 사는 거대 군락을 유지합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>농부로서의 절엽 개미\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>절엽 개미를 인간과 유사하게 \u003cb class=\"key\">농경 \u003c/b>\u003cb class=\"key\">생활\u003c/b>을 하는 \u003cb class=\"key\">농부\u003c/b>로 정의하며 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>채집과 가공 과정\u003csmall>과정 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>개미들이 잎을 가져와 \u003cb class=\"key\">비료\u003c/b>로 만들기까지의 구체적인 \u003cb class=\"key\">재배 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 묘사합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>균류 재배와 섭취\u003csmall>결과 · 문장 6\u003c/small>\u003c/h4>\u003cp>개미와 균류의 \u003cb class=\"key\">공생 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 통해 개미의 주된 \u003cb class=\"key\">식량\u003c/b>인 자실체가 만들어짐을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>농업 문명의 완성\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>이러한 전략을 통해 거대한 \u003cb class=\"key\">지하 \u003c/b>\u003cb class=\"key\">둥지\u003c/b>를 건설하며 독자적인 \u003cb class=\"key\">농업 \u003c/b>\u003cb class=\"key\">문명\u003c/b>을 완성했음을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 지문이 어떤 순서로 개미의 농사법을 설명하는지 논리 흐름을 따라가 볼까요?","hl":null},{"n":4,"text":"처음 첫 번째와 두 번째 문장에서는 절엽 개미를 인간과 같은 농부라고 소개하며 흥미를 유발합니다. 수백만 마리의 구성원이 힘을 합쳐 먹이를 직접 경작한다는 점을 강조하고 있어요.","hl":"f0"},{"n":5,"text":"다음 세 번째에서 5번까지는 본격적인 농사 과정을 설명합니다. 밖에서 잎을 가져와서 그냥 먹는 게 아니라, 더 작은 일개미들이 이걸 잘게 씹어서 비료로 만든다는 아주 구체적인 재배 과정이 나오죠.","hl":"f1"},{"n":6,"text":"여섯 번째 문장에서는 그 결과물을 보여줍니다. 개미가 정성껏 키운 균류가 자실체라는 먹을거리로 피어나고, 개미는 비로소 이것을 나중에 먹게 된다는 상호 관계를 설명합니다.","hl":"f2"},{"n":7,"text":"마지막 일곱 번째와 여덟 번째 문장에서는 이 모든 활동의 결과로 지하에 거대한 규모의 둥지를 짓고, 인간처럼 완벽한 농업 문명을 구축했다는 결론을 내립니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비유와 예시\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 시작과 끝에서 절엽 개미를 인간의 \u003cb class=\"key\">농업\u003c/b>에 비유하며 주제를 강조하고 있습니다. 중간 부분은 그 비유를 뒷받침하는 구체적인 \u003cb class=\"key\">작동 \u003c/b>\u003cb class=\"key\">방식\u003c/b>과 \u003cb class=\"key\">규모\u003c/b>에 대한 설명으로 구성됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Just like humans (2)\u003c/b>\u003cspan>비유를 통한 주제 제시\u003c/span>\u003cb>Instead (5)\u003c/b>\u003cspan>통념(잎을 먹음)에 대한 반전 및 대안 제시\u003c/span>\u003cb>Using this (7)\u003c/b>\u003cspan>앞서 설명한 전략의 결과 도출\u003c/span>\u003cb>Just like humans (8)\u003c/b>\u003cspan>비유를 통한 주제 재강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">leaf-cutter ants\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">farmers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">they\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">worker ants\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the ants\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Common Perception\u003c/th>\u003cth>Actual Behavior (Leaf-cutter ants)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Ants eat leaves directly.\u003c/td>\u003ctd>Ants use leaves as fertilizer for fungus.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Simple insect behavior.\u003c/td>\u003ctd>Perfected agricultural civilization.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 절엽 개미를 인간에 비유하는 전개 방식을 사용하고 있어요. 처음과 끝에 인간과 비슷하다는 내용을 배치한 양괄식 구조입니다. 주제문은 개미가 농부라는 점을 선언하는 두 번째 문장과 농업 문명을 완성했다는 여덟 번째 문장으로 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"신호어들을 보면 흐름이 아주 명확해요. 두 번째와 여덟 번째 문장의 인간과 똑같다는 표현이 수미상관을 이루고 있고요. 특히 다섯 번째 문장의 대신에라는 표현은 개미가 잎을 직접 먹지 않는다는 반전의 정보를 강조하는 중요한 장치입니다. 일곱 번째 문장의 이 성공적인 전략을 사용하여라는 부분은 앞서 설명한 모든 과정을 하나로 요약해 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>colony\u003c/b>\u003cem>명사\u003c/em>\u003cspan>군락\u003c/span>\u003c/div>\u003cdiv>\u003cb>leaf-cutter ant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>절엽 개미\u003c/span>\u003c/div>\u003cdiv>\u003cb>cultivate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경작하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>set forth\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>출발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>둥지\u003c/span>\u003c/div>\u003cdiv>\u003cb>vegetation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>식물\u003c/span>\u003c/div>\u003cdiv>\u003cb>chew off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>씹어서 떼어내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>carry back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 실어 나르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>worker ant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일개미\u003c/span>\u003c/div>\u003cdiv>\u003cb>fertilizer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비료\u003c/span>\u003c/div>\u003cdiv>\u003cb>fungus\u003c/b>\u003cem>명사\u003c/em>\u003cspan>균류\u003c/span>\u003c/div>\u003cdiv>\u003cb>underground\u003c/b>\u003cem>부사\u003c/em>\u003cspan>지하에\u003c/span>\u003c/div>\u003cdiv>\u003cb>feed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>먹이를 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>blossom\u003c/b>\u003cem>동사\u003c/em>\u003cspan>꽃이 피다, 발달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fruiting body\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자실체\u003c/span>\u003c/div>\u003cdiv>\u003cb>strategy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전략\u003c/span>\u003c/div>\u003cdiv>\u003cb>enormous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>spanning\u003c/b>\u003cem>형용사/분사\u003c/em>\u003cspan>달하는, 걸쳐 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>hundreds of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>수백의\u003c/span>\u003c/div>\u003cdiv>\u003cb>square meter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제곱미터\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>완성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>agricultural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>농업의\u003c/span>\u003c/div>\u003cdiv>\u003cb>civilization\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문명\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 몇 개 살펴볼까요? 경작하다라는 뜻의 컬티베이트, 비료라는 뜻의 퍼틸라이저, 그리고 균류를 뜻하는 펑거스는 이 지문의 핵심 소재이니 꼭 기억하세요. 또한 거대한이라는 뜻의 이노머스도 자주 나오는 단어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">cultivate\u003c/b>\u003cspan class=\"m\">경작하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">farm\u003c/span>\u003cspan class=\"s\">raise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enormous\u003c/b>\u003cspan class=\"m\">거대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"s\">gigantic\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">perfect\u003c/b>\u003cspan class=\"m\">완성하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">complete\u003c/span>\u003cspan class=\"s\">refine\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ruin\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">civilization\u003c/b>\u003cspan class=\"m\">문명\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">culture\u003c/span>\u003cspan class=\"s\">society\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">strategy\u003c/b>\u003cspan class=\"m\">전략\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">method\u003c/span>\u003cspan class=\"s\">tactic\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 정리해 두면 좋아요. 컬티베이트는 팜이나 레이즈로 바꿔 쓸 수 있고, 이노머스는 휴지나 매시브 같은 단어와 비슷합니다. 문명을 뜻하는 시빌라이제이션과 전략을 뜻하는 스트래터지도 꼭 챙겨가세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수백만 마리의 구성원과 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">millions \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">members \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 한 군락 안에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">colony\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 절엽 개미는\u003c/span>\u003cspan class=\"en\">leaf-cutter ants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그들만의 먹이를 경작한다.\u003c/span>\u003cspan class=\"en\">cultivate their own food.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 군락에 수백만 마리의 구성원이 있는 절엽 개미는 그들만의 먹이를 경작한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 지문의 도입부로, \u003cb class=\"key\">절엽 \u003c/b>\u003cb class=\"key\">개미\u003c/b>의 대규모 군락과 그들이 생존을 위해 스스로 먹이를 \u003cb class=\"key\">경작\u003c/b>한다는 핵심 습성을 소개합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부수 상황/배경\u003c/span> : With + 명사구 + 전치사구 : \"한 군락에 수백만 마리의 구성원이 있는 상태로\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"With millions of members, 수백만 마리의 구성원과 함께.  in a colony,  한 군락 안에.  leaf-cutter ants,  절엽 개미는.  cultivate their own food,  그들만의 먹이를 경작한다.. 이 문장 전체를 해석하면, 한 군락에 수백만 마리의 구성원이 있는 절엽 개미는 그들만의 먹이를 경작한다.","hl":"m"},{"n":13,"text":"이 글의 주인공인 절엽 개미를 소개하는 문장이에요. 아주 많은 수가 모여 살면서 인간처럼 직접 먹이를 경작한다는 핵심 소재를 던지고 있죠.","hl":"mn"},{"n":14,"text":"문장 맨 앞의 With 구문은 개미들이 어떤 환경에 있는지 수적인 배경을 설명해 줍니다. 수백만 마리가 한 군락에 모여 산다는 점이 나중에 대규모 농업을 가능하게 하는 근거가 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간과 마찬가지로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Just \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">humans\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그들은 농부이다.\u003c/span>\u003cspan class=\"en\">they're farmers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인간과 마찬가지로, 그들은 농부이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 절엽 개미의 행동을 인간의 \u003cb class=\"key\">농업 \u003c/b>\u003cb class=\"key\">활동\u003c/b>에 비유하여 독자가 개미의 생태를 쉽게 \u003cb class=\"key\">이해\u003c/b>하도록 돕습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교의 전치사구\u003c/span> : Just like + 명사 : \"인간과 마찬가지로\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Just like humans, 인간과 마찬가지로.  they're farmers,  그들은 농부이다.. 이 문장 전체를 해석하면, 인간과 마찬가지로, 그들은 농부이다.","hl":"m"},{"n":16,"text":"개미를 농부에 비유했어요. 개미의 생존 방식이 인간의 농경 문화와 아주 비슷하다는 점을 강조해서 독자의 이해를 돕고 있습니다.","hl":"mn"},{"n":17,"text":"여기서 Just like는 전치사구로 쓰여서 인간과 마찬가지로라는 의미를 나타내요. 개미의 활동이 단순한 우연이 아니라 인간처럼 체계적인 활동이라는 점을 동일 선상에서 보여주는 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 개미는\u003c/span>\u003cspan class=\"en\">Some of the ants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 둥지를 떠난다\u003c/span>\u003cspan class=\"en\">set forth from the nest\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 신선한 식물을 찾기 위해;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">fresh \u003c/span>\u003cspan class=\"tgt\">vegetation\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그들이 그것을 찾으면,\u003c/span>\u003cspan class=\"en\">when they find it,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그들은 큰 조각을 씹어 떼어낸다\u003c/span>\u003cspan class=\"en\">they chew off large pieces\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그들이 둥지로 다시 짊어지고 올.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">carry \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">nest\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 개미는 신선한 식물을 찾기 위해 둥지를 떠난다. 그리고 그들이 그것을 찾으면, 그들은 그들이 둥지로 다시 짊어지고 올 큰 조각을 씹어 떼어낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 농업의 첫 단계인 \u003cb class=\"key\">원료 \u003c/b>\u003cb class=\"key\">수집\u003c/b> 과정을 설명하며, 개미들이 분업을 통해 신선한 \u003cb class=\"key\">식물 \u003c/b>\u003cb class=\"key\">조각\u003c/b>을 확보하는 구체적인 행동을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형 : \"신선한 식물을 찾기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사\u003c/span> : 명사(선행사) + that + 주어 + 타동사 : \"그들이 둥지로 다시 짊어지고 올\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Some of the ants, 몇몇 개미는.  set forth from the nest,  둥지를 떠난다.  to find fresh vegetation,  신선한 식물을 찾기 위해;.  when they find it,  그들이 그것을 찾으면.  they chew off large pieces,  그들은 큰 조각을 씹어 떼어낸다.  that they carry back to the nest,  그들이 둥지로 다시 짊어지고 올.. 이 문장 전체를 해석하면, 몇몇 개미는 신선한 식물을 찾기 위해 둥지를 떠난다. 그리고 그들이 그것을 찾으면, 그들은 그들이 둥지로 다시 짊어지고 올 큰 조각을 씹어 떼어낸다.","hl":"m"},{"n":19,"text":"농사의 첫 단계인 재료 모으기 단계예요. 일부 개미들이 밖으로 나가서 잎을 잘라오는데, 이게 나중에 농사의 비료가 될 겁니다. 아주 구체적인 원료 수집 과정을 묘사하고 있죠.","hl":"mn"},{"n":20,"text":"중요한 포인트가 두 개 있어요. 첫째, to find는 개미들이 둥지를 나서는 행동의 이유를 말해주는 목적 용법이고요. 둘째, 문장 끝의 that 절은 앞의 나뭇잎 조각들을 꾸며주는 목적격 관계대명사 절입니다. 개미들이 둥지로 가져오는 게 바로 그 조각들이라는 걸 설명해주고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만, \u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미는 \u003c/span>\u003cspan class=\"en\">the ants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹지 않는다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 잎을.\u003c/span>\u003cspan class=\"en\">these leaves.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 개미는 이 잎을 먹지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장에서 잎을 모으는 행위를 설명한 뒤, 통념과 달리 잎이 직접적인 식량이 아니라는 \u003cb class=\"key\">반전\u003c/b>을 제시하며 \u003cb class=\"key\">궁금증\u003c/b>을 유발합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사의 부정문\u003c/span> : do not + [동사원형 (eat)] : \"먹지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"However, 하지만. the ants, 개미는. don't eat, 먹지 않는다. these leaves, 이 잎을.. 이 문장 전체를 해석하면, 하지만, 개미는 이 잎을 먹지 않는다.","hl":"m"},{"n":22,"text":"개미들이 열심히 잎을 물어 왔는데, 정작 그 잎을 직접 먹는 건 아니라고 하네요. 독자의 궁금증을 유발하며 반전의 흐름을 만드는 문장입니다.","hl":"mn"},{"n":23,"text":"주어인 개미들이 복수형이기 때문에 부정할 때 더즌트가 아니라 두 낫의 줄임말인 돈트를 썼다는 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에, \u003c/span>\u003cspan class=\"en\">Instead,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 작은 일개미가 \u003c/span>\u003cspan class=\"en\">smaller worker ants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잎 조각을 가져다가, \u003c/span>\u003cspan class=\"en\">take the pieces of leaves,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 더 작은 조각으로 씹고, \u003c/span>\u003cspan class=\"en\">chew them into smaller pieces,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 비료로 사용한다 \u003c/span>\u003cspan class=\"en\">and use these as fertilizer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균류를 키우기 위한 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">grow\u003c/span> fungus\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커다란 지하 ‘정원’에서.\u003c/span>\u003cspan class=\"en\">in large underground 'gardens.'\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신에, 더 작은 일개미가 잎 조각을 가져다가 그것들을 더 작은 조각으로 씹고, 그것들을 커다란 지하 ‘정원’에서 균류를 키우기 위한 비료로 사용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개미의 구체적인 \u003cb class=\"key\">분업\u003c/b> 과정을 설명하며, 잎이 식량이 아니라 균류를 재배하기 위한 \u003cb class=\"key\">비료\u003c/b>로 쓰인다는 핵심 정보를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + [동사원형 (grow)] : \"키우기 위한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : [동사1] + [동사2] + and + [동사3] : \"가져다가 ... 씹고 ... 사용한다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Instead, 대신에. smaller worker ants, 더 작은 일개미가. take the pieces of leaves, 잎 조각을 가져다가. chew them into smaller pieces, 그것들을 더 작은 조각으로 씹고. and use these as fertilizer, 그것들을 비료로 사용한다. to grow fungus, 균류를 키우기 위한. in large underground 'gardens.', 커다란 지하 ‘정원’에서.. 이 문장 전체를 해석하면, 대신에, 더 작은 일개미가 잎 조각을 가져다가 그것들을 더 작은 조각으로 씹고, 그것들을 커다란 지하 ‘정원’에서 균류를 키우기 위한 비료로 사용한다.","hl":"m"},{"n":25,"text":"잎을 직접 먹지 않고 비료로 활용한다는 점이 핵심입니다. 일개미들이 하는 일의 순차적인 과정이 자세히 설명되어 있죠.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 병렬 구조입니다. 테이크, 츄, 그리고 접속사 뒤에 나오는 유즈까지 세 개의 동사가 나란히 연결되어 있어요. 두 번째는 투 그로우인데, 균류를 키우기 위한 목적으로 비료를 쓴다는 뜻을 더해주는 부사적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미는 \u003c/span>\u003cspan class=\"en\">The ants\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균류에게 먹이를 주고, \u003c/span>\u003cspan class=\"en\">feed the fungus,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균류는 피어난다 \u003c/span>\u003cspan class=\"en\">and the fungus blossoms\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 자실체로 \u003c/span>\u003cspan class=\"en\">into small fruiting bodies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미가 나중에 먹을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">which\u003c/span> the ants later eat.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">개미는 균류에게 먹이를 주고, 균류는 개미가 나중에 먹을 작은 자실체로 피어난다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개미와 균류 사이의 \u003cb class=\"key\">공생\u003c/b> 관계를 보여주며, 개미가 실제로 섭취하는 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">식량\u003c/b>인 자실체의 형성을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사의 목적격\u003c/span> : [명사(선행사)] + which + [주어 + 동사] : \"개미가 나중에 먹을\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The ants, 개미는. feed the fungus, 균류에게 먹이를 주고. and the fungus blossoms, 균류는 피어난다. into small fruiting bodies, 작은 자실체로. which the ants later eat, 개미가 나중에 먹을.. 이 문장 전체를 해석하면, 개미는 균류에게 먹이를 주고, 균류는 개미가 나중에 먹을 작은 자실체로 피어난다.","hl":"m"},{"n":28,"text":"개미는 균류를 보살피고, 균류는 개미에게 먹이를 제공하는 멋진 공생 관계를 보여주는 문장입니다. 결국 개미가 먹는 건 잎이 아니라 이 자실체라는 점을 기억하세요.","hl":"mn"},{"n":29,"text":"마지막의 위치는 관계대명사의 목적격으로 쓰였어요. 선행사인 자실체를 꾸며주면서, 개미가 먹는 대상이 바로 그 자실체라는 것을 연결해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 성공적인 농업 전략을 사용하여,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Using \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">successful \u003c/span>\u003cspan class=\"tgt\">farming \u003c/span>\u003cspan class=\"tgt\">strategy\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개미는 짓는다\u003c/span>\u003cspan class=\"en\">the ants build\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지하에 거대한 둥지,\u003c/span>\u003cspan class=\"en\">enormous nests underground,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수백 제곱미터에 달하는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">spanning\u003c/span> hundreds of square meters.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 성공적인 농업 전략을 사용하여, 개미는 지하에 거대한 둥지, 수백 제곱미터에 달하는 것을 짓는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 체계적인 \u003cb class=\"key\">농업 \u003c/b>\u003cb class=\"key\">전략\u003c/b>을 바탕으로 개미가 거대 군락을 형성함을 강조하며, \u003cb class=\"key\">압도적인 \u003c/b>\u003cb class=\"key\">규모\u003c/b>의 둥지를 통해 그들의 성공을 시각적으로 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(능동)\u003c/span> : V-ing (현재분사) ~, S + V : \"이 성공적인 농업 전략을 사용하여\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사를 수식하는 현재분사\u003c/span> : 명사 + V-ing (현재분사구) : \"수백 제곱미터에 달하는 것\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Using this successful farming strategy, 이 성공적인 농업 전략을 사용하여. the ants build, 개미는 짓는다. enormous nests underground, 지하에 거대한 둥지. something spanning hundreds of square meters, 수백 제곱미터에 달하는 것을.. 이 문장 전체를 해석하면, 이 성공적인 농업 전략을 사용하여, 개미는 지하에 거대한 둥지, 수백 제곱미터에 달하는 것을 짓는다.","hl":"m"},{"n":31,"text":"개미들이 단순히 잎을 옮기는 것을 넘어 아주 체계적인 농업 전략을 쓰고 있다는 내용이에요. 덕분에 아주 거대한 규모의 보금자리를 만들 수 있었다는 성공적인 결과를 강조하고 있죠.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 문장 맨 앞에 나온 분사구문입니다. 개미가 농업 전략을 직접 사용하는 주체이기 때문에 능동의 의미를 담은 현재분사 Using을 썼어요. 두 번째는 뒤에 있는 something spanning 부분인데요. 앞에 나온 둥지의 크기가 수백 제곱미터에 달한다는 능동의 관계를 설명하기 위해 현재분사 spanning이 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간과 마찬가지로,\u003c/span>\u003cspan class=\"en\">Just like humans,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 완성했다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">perfected\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농업 문명을.\u003c/span>\u003cspan class=\"en\">an agricultural civilization.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인간과 마찬가지로, 그들은 농업 문명을 완성했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개미의 생태가 인간의 \u003cb class=\"key\">농업 \u003c/b>\u003cb class=\"key\">발전\u003c/b> 과정과 매우 유사함을 재차 강조하며, \u003cb class=\"key\">문명\u003c/b>이라는 단어로 그들의 사회적 고도화를 정의합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(완료)\u003c/span> : have + p.p. (과거분사) : \"완성했다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Just like humans, 인간과 마찬가지로. they have perfected, 그들은 완성했다. an agricultural civilization, 농업 문명을.. 이 문장 전체를 해석하면, 인간과 마찬가지로, 그들은 농업 문명을 완성했다.","hl":"m"},{"n":34,"text":"이 글의 최종 결론입니다. 개미의 먹이 활동을 단순한 본능이 아니라 인간과 견줄만한 농업 문명으로 격상시켜 표현하고 있습니다.","hl":"mn"},{"n":35,"text":"여기서 주목할 표현은 현재완료 시제입니다. have perfected라고 써서, 개미들이 오랜 세월을 거쳐 농업 시스템을 완벽하게 구축해 온 완성된 상태임을 잘 보여주고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>절엽 개미는 인간처럼 \u003cb class=\"key\">농경 \u003c/b>\u003cb class=\"key\">생활\u003c/b>을 하는 농부로 비유될 만큼 정교한 체계를 갖추고 있습니다.\u003c/li>\u003cli>이들은 잎을 먹는 대신 잘게 씹어 지하 정원에서 \u003cb class=\"key\">균류\u003c/b>를 재배하기 위한 \u003cb class=\"key\">비료\u003c/b>로 사용합니다.\u003c/li>\u003cli>재배된 균류가 \u003cb class=\"key\">자실체\u003c/b>로 피어나면 이를 식량으로 삼는 독특한 \u003cb class=\"key\">공생 \u003c/b>\u003cb class=\"key\">전략\u003c/b>을 취합니다.\u003c/li>\u003cli>이러한 농업 방식을 통해 수백 제곱미터에 이르는 거대하고 정교한 \u003cb class=\"key\">농업 \u003c/b>\u003cb class=\"key\">문명\u003c/b>을 지하에 건설합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>By cultivating fungus through an organized agricultural system, leaf-cutter ants build and sustain massive underground civilizations similar to those of humans.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">절엽 개미는 인간처럼 \u003cb class=\"key\">농경 \u003c/b>\u003cb class=\"key\">생활\u003c/b>을 하며, 잎을 잘라와 이를 \u003cb class=\"key\">비료\u003c/b>로 삼아 \u003cb class=\"key\">균류\u003c/b>를 재배함으로써 거대한 군락과 문명을 유지합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 수업은 여기서 마칠게요. 절엽 개미의 지혜로운 농업 방식이 인간의 문명과 얼마나 닮았는지 잘 이해하셨나요? 잎이 밥이 아니라 비료였다는 사실이 가장 중요한 포인트였죠. 복습할 때 개미가 잎을 모으는 것부터 문명을 이루는 과정까지 머릿속으로 그려보세요. 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
