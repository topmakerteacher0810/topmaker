craters)를 관찰했는데, 이는 마치 눈으로만 보던 세상을 돋보기로 자세히 확인한 것처럼 기존 믿음을 흔드는 강력한 증거가 되었어요. 이처럼 과학 혁명(Scientific Revolution) 시기에는 관찰(Observation), 측정(Measurement), 증거(Evidence)를 바탕으로 자연을 설명하려는 태도가 중요해졌고, 이는 현대 과학의 기본 방식으로 이어졌습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01초기 관측</div><ul><li>망원경이 없던 시대에도 사람들은 별의 움직임을 관찰하며 우주를 이해하려 했다.</li><li>이집트인, 바빌로니아인, 그리스인, 마야인이 별의 움직임을 기록함</li><li>별의 이동(star movements)을 지도화함</li><li>핵심 키워드: 초기 천문 관측(early astronomy)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02코페르니쿠스의 주장</div><ul><li>코페르니쿠스는 당시의 지구 중심 우주관이 틀렸다고 보고 새로운 이론을 제시했다.</li><li>당시 믿음: 태양이 지구 주위를 돈다(Sun around Earth)</li><li>코페르니쿠스의 결론: 지구가 태양 주위를 돈다(Earth around Sun)</li><li>핵심 키워드: 지동설(heliocentric theory)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03반대와 출판</div><ul><li>코페르니쿠스의 생각은 많은 반대에 부딪혔지만, 그는 자신의 이론을 책으로 출판했다.</li><li>혁명적 생각(revolutionary idea)으로 여겨짐</li><li>널리 퍼진 반대(widespread objections)가 있었음</li><li>핵심 키워드: 이론 출판(publication of theory)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04망원경과 갈릴레이</div><ul><li>기술 발전으로 망원경이 개발되었고, 갈릴레이는 이를 활용해 중요한 발견을 했다.</li><li>17세기 초 망원경(telescope) 개발</li><li>목성의 네 큰 위성(moons of Jupiter) 발견</li><li>달의 분화구(craters on the Moon) 관찰</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05우주 지식의 확장</div><ul><li>이후 천문학자들의 연구와 망원경 정보는 우주 작동 원리에 대한 인류의 이해를 발전시켰다.</li><li>갈릴레이가 코페르니쿠스 이론을 확인함</li><li>과학적 발견(scientific discoveries)이 축적됨</li><li>핵심 키워드: 우주 이해(universe knowledge)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">telescope</td><td class=\"m\">망원경</td></tr><tr><td class=\"w\">look out into</td><td class=\"m\">~을 향해 밖을 내다보다, ~쪽으로 시선을 돌리다</td></tr><tr><td class=\"w\">universe</td><td class=\"m\">우주, 만물, 세계</td></tr><tr><td class=\"w\">map</td><td class=\"m\">지도로 나타내다, 체계적으로 기록하다</td></tr><tr><td class=\"w\">movement</td><td class=\"m\">움직임, 이동, 운동</td></tr><tr><td class=\"w\">put forth</td><td class=\"m\">제시하다, 내놓다, 발표하다</td></tr><tr><td class=\"w\">revolutionary</td><td class=\"m\">혁명적인, 획기적인</td></tr><tr><td class=\"w\">measurement</td><td class=\"m\">측정, 측량, 측정값</td></tr><tr><td class=\"w\">by eye</td><td class=\"m\">눈대중으로, 육안으로</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conclude</td><td class=\"m\">결론을 내리다, 끝내다</td></tr><tr><td class=\"w\">at the time</td><td class=\"m\">그 당시에, 그때는</td></tr><tr><td class=\"w\">in fact</td><td class=\"m\">사실은, 실제로는</td></tr><tr><td class=\"w\">widespread</td><td class=\"m\">널리 퍼진, 광범위한</td></tr><tr><td class=\"w\">objection</td><td class=\"m\">반대, 이의, 반론</td></tr><tr><td class=\"w\">theory</td><td class=\"m\">이론, 학설, 견해</td></tr><tr><td class=\"w\">build on</td><td class=\"m\">~을 바탕으로 발전시키다, ~에 기반하다</td></tr><tr><td class=\"w\">lead to</td><td class=\"m\">~로 이어지다, ~을 초래하다</td></tr><tr><td class=\"w\">confirm</td><td class=\"m\">확인하다, 입증하다, 확정하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">망원경이 존재하기도 전에</span><span class=\"en\"><b>Even before telescopes existed,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 밖을 내다보았고</span><span class=\"en\"><b>people <span class=\"grammar-hl\">looked out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주로</span><span class=\"en\"><b><span class=\"grammar-hl\">into space</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 노력했다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">tried</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주를 이해하려고</span><span class=\"en\"><b><span class=\"grammar-hl\">to understand the universe</span>.</b></span></div></div><div class=\"lec-sent-ko\">망원경이 존재하기도 전에, 사람들은 우주로 밖을 내다보았고 우주를 이해하려고 노력했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 출발점입니다. 인간의 우주 탐구가 현대 과학 장비가 생긴 뒤에 갑자기 시작된 일이 아니라, 아주 오래전부터 이어져 온 관심이었다는 배경을 깔아 줍니다. 뒤 문장들은 이 오래된 관심이 여러 문명과 과학자들을 거치며 어떻게 발전했는지를 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">tried to understand the universe (to부정사): try + to V 구조로, to understand가 동사 tried의 목적어 역할을 하는 to부정사구이다. understand는 뒤에 목적어 the universe를 취해 to understand the universe 전체가 ‘무엇을 하려고 했는지’를 나타낸다.</div><div class=\"lec-gr-item\">looked out into space (관용표현): look out into + 장소 구조로, 동사 look에 부사 out과 전치사구 into space가 결합해 ‘바깥쪽/먼 곳을 바라보다’라는 동사구를 만든다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">telescope</td><td class=\"m\">망원경</td></tr><tr><td class=\"w\">universe</td><td class=\"m\">우주, 만물, 세계</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이집트인, 바빌로니아인, 그리스인, 그리고 마야인들은</span><span class=\"en\"><b>The Egyptians, Babylonians, Greeks, and Maya</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">최초의 민족 중에 있었다</span><span class=\"en\"><b><span class=\"grammar-hl\">were among the first peoples</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">별들의 움직임을 지도로 만든</span><span class=\"en\"><b><span class=\"grammar-hl\">to map the movements of the stars</span>.</b></span></div></div><div class=\"lec-sent-ko\">이집트인, 바빌로니아인, 그리스인, 그리고 마야인들은 별들의 움직임을 지도로 만든 최초의 민족 중에 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 “망원경 이전의 우주 이해 노력”을 구체적인 역사 사례로 뒷받침합니다. 고대 문명들은 밤하늘을 꾸준히 관찰해 별이 언제 어디에 나타나는지 정리했고, 이는 농사, 달력, 종교 의식 등과도 관련이 있었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were among the first peoples to map the movements of the stars (to부정사): the first peoples + to V 구조로, to map the movements of the stars가 앞의 the first peoples를 뒤에서 수식한다. ‘별의 움직임을 지도화한 최초의 민족들’처럼 서수/first 계열 명사 뒤에서 to부정사가 형용사적 역할을 한다.</div><div class=\"lec-gr-item\">were among the first peoples 기본 구조: 주어 The Egyptians, Babylonians, Greeks, and Maya + be동사 were + 전치사구 among the first peoples 구조이다. among은 ‘여럿 중에 속함’을 나타내며 보어 역할의 전치사구를 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">map</td><td class=\"m\">지도로 나타내다, 체계적으로 기록하다</td></tr><tr><td class=\"w\">movement</td><td class=\"m\">움직임, 이동, 운동</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">유럽에서는</span><span class=\"en\"><b>In Europe,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Nicolaus Copernicus라고 불리는 16세기의 폴란드 수학자가</span><span class=\"en\"><b>a 16th-century Polish mathematician <span class=\"grammar-hl\">named Nicolaus Copernicus</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 가지 혁명적인 아이디어를 제기했다</span><span class=\"en\"><b><span class=\"grammar-hl\">put forth a revolutionary idea</span>.</b></span></div></div><div class=\"lec-sent-ko\">유럽에서는, Nicolaus Copernicus라고 불리는 16세기의 폴란드 수학자가 한 가지 혁명적인 아이디어를 제기했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 초점이 고대 문명의 관찰에서 한 과학자의 새로운 이론으로 이동합니다. 여기서 “혁명적인 생각”은 당시 사람들이 당연하게 믿던 우주관을 크게 흔드는 주장이라는 뜻입니다. 뒤 문장에서 그 생각의 내용이 설명됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">named Nicolaus Copernicus (과거분사(형용사)): named가 a 16th-century Polish mathematician을 뒤에서 수식하는 N + p.p. 구조이다. a mathematician who was named Nicolaus Copernicus처럼 관계절이 축약된 형태로 볼 수 있다.</div><div class=\"lec-gr-item\">put forth a revolutionary idea (관용표현): put forth는 동사 put과 부사 forth가 결합한 구동사로, 뒤에 목적어 a revolutionary idea를 취한다. 구조는 put forth + O이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">put forth</td><td class=\"m\">제시하다, 내놓다, 발표하다</td></tr><tr><td class=\"w\">revolutionary</td><td class=\"m\">혁명적인, 획기적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Copernicus는</span><span class=\"en\"><b>Copernicus</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">별들을 관찰했고</span><span class=\"en\"><b><span class=\"grammar-hl\">watched the stars</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">측정했다</span><span class=\"en\"><b><span class=\"grammar-hl\">and took measurements</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">맨눈으로</span><span class=\"en\"><b><span class=\"grammar-hl\">by eye</span>.</b></span></div></div><div class=\"lec-sent-ko\">Copernicus는 별들을 관찰했고 맨눈으로 측정했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 코페르니쿠스의 주장이 단순한 상상이 아니라 꾸준한 관찰에서 나왔음을 보여 줍니다. 당시에는 정밀한 망원경이 없었기 때문에 육안 관찰과 계산이 중요한 연구 방법이었습니다. 앞 문장의 “혁명적인 생각”이 어떤 방식으로 준비되었는지를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">watched the stars and took measurements 기본 구조: 주어 Copernicus 뒤에 watched the stars와 took measurements가 and로 병렬 연결된 구조이다. 두 동사 watched와 took이 같은 주어 Copernicus를 공유한다.</div><div class=\"lec-gr-item\">by eye (관용표현): by eye는 전치사 by + 명사 eye로 이루어진 고정 표현이며, 앞의 took measurements를 수식하는 부사구로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">measurement</td><td class=\"m\">측정, 측량, 측정값</td></tr><tr><td class=\"w\">by eye</td><td class=\"m\">눈대중으로, 육안으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 결론지었다</span><span class=\"en\"><b>He concluded</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주에 대한 관점이</span><span class=\"en\"><b>that the view of the universe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 당시에 받아들여진</span><span class=\"en\"><b><span class=\"grammar-hl\">accepted at the time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">─ 즉 태양이 지구 주위를 이동했다는 ─</span><span class=\"en\"><b>─ <span class=\"grammar-hl\">that the Sun traveled around Earth</span> ─</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">틀렸고</span><span class=\"en\"><b>was wrong,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 사실 지구였다고</span><span class=\"en\"><b>and that <span class=\"grammar-hl\">it was in fact Earth</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태양 주위를 이동한 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">that traveled around the Sun</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 그 당시에 받아들여진 우주에 대한 관점, 즉 태양이 지구 주위를 이동했다는 것이 틀렸고, 태양 주위를 이동한 것은 사실 지구였다고 결론지었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 관찰과 측정이 어떤 결론으로 이어졌는지를 말합니다. 당시에는 지구가 우주의 중심이고 태양과 별들이 지구 둘레를 돈다는 생각이 널리 받아들여졌습니다. 코페르니쿠스는 이 믿음을 뒤집고 태양을 중심으로 지구가 움직인다고 주장했으며, 이것이 글에서 말한 “혁명적인 생각”의 핵심입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">accepted at the time (과거분사(형용사)): accepted가 the view of the universe를 뒤에서 수식하는 N + p.p. 구조이다. the view of the universe that was accepted at the time처럼 관계절이 축약된 형태로 볼 수 있다.</div><div class=\"lec-gr-item\">that the Sun traveled around Earth 동격의 that: the view + that절 구조로, that the Sun traveled around Earth가 앞의 명사 the view의 구체적인 내용을 설명한다. 이 that은 관계대명사가 아니라 ‘태양이 지구 주위를 돌았다라는 견해’의 내용을 나타내는 동격절을 이끈다.</div><div class=\"lec-gr-item\">it was in fact Earth that traveled around the Sun (강조구문): It is/was + 강조어구 + that절 구조이다. 여기서는 Earth가 강조어구로 들어가며, 원래 Earth traveled around the Sun이라는 문장에서 주어 Earth를 강조하기 위해 it was Earth that ... 형태를 사용했다.</div><div class=\"lec-gr-item\">that the view of the universe accepted at the time ... was wrong, and that it was in fact Earth that traveled around the Sun 기본 구조: concluded 뒤에 두 개의 that절이 and로 병렬 연결되어 목적어 역할을 한다. 첫 번째 that절은 the view ... was wrong, 두 번째 that절은 it was ... Earth that ... 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">universe</td><td class=\"m\">우주, 만물, 세계</td></tr><tr><td class=\"w\">conclude</td><td class=\"m\">결론을 내리다, 끝내다</td></tr><tr><td class=\"w\">at the time</td><td class=\"m\">그 당시에, 그때는</td></tr><tr><td class=\"w\">in fact</td><td class=\"m\">사실은, 실제로는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그의 아이디어에 대해 널리 퍼진 반대에도 불구하고</span><span class=\"en\"><b><span class=\"grammar-hl\">Despite widespread objections to his ideas</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 그의 이론을 출판했다</span><span class=\"en\"><b>he published his theory</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 권의 책에</span><span class=\"en\"><b>in a book.</b></span></div></div><div class=\"lec-sent-ko\">그의 아이디어에 대해 널리 퍼진 반대에도 불구하고, 그는 한 권의 책에 그의 이론을 출판했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시된 새로운 우주관이 당시 사회에서 쉽게 받아들여지지 않았음을 보여 줍니다. 기존 믿음과 종교적·학문적 권위가 강했기 때문에 코페르니쿠스의 주장은 큰 저항을 받았습니다. 그럼에도 책으로 발표했다는 점은 그의 이론이 후대 과학자들에게 전달되는 결정적 계기가 되었음을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Despite widespread objections to his ideas 기본 구조: Despite + 명사구 형태의 양보 전치사구이다. Despite 뒤에는 절이 아니라 widespread objections to his ideas라는 명사구가 오며, 문장 전체에서 부사구로 쓰여 주절 he published his theory in a book을 수식한다.</div><div class=\"lec-gr-item\">objections to his ideas 기본 구조: objection + to + 명사 구조이다. to his ideas는 앞의 명사 objections를 보충하여 ‘무엇에 대한 반대인지’를 나타내는 전치사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">widespread</td><td class=\"m\">널리 퍼진, 광범위한</td></tr><tr><td class=\"w\">objection</td><td class=\"m\">반대, 이의, 반론</td></tr><tr><td class=\"w\">theory</td><td class=\"m\">이론, 학설, 견해</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">후대의 천문학자들은</span><span class=\"en\"><b>Later astronomers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Copernicus의 연구를 바탕으로 삼았다</span><span class=\"en\"><b><span class=\"grammar-hl\">built on Copernicus' work</span>.</b></span></div></div><div class=\"lec-sent-ko\">나중에 천문학자들은 Copernicus의 연구를 바탕으로 삼았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 코페르니쿠스의 이론이 한 사람의 주장으로 끝나지 않고, 뒤따른 과학자들의 연구 기반이 되었음을 말합니다. 과학은 이전 연구를 검토하고 보완하면서 발전하는데, 이 문장은 바로 그 연속성을 보여 줍니다. 다음 문장부터는 그 발전을 가능하게 한 기술적 변화가 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">built on Copernicus&#39; work (관용표현): build on은 ‘기존의 것에 기반을 두고 발전시키다’라는 의미의 구동사이다. 구조는 build on + 명사이며, 여기서는 Copernicus&#39; work가 전치사 on의 목적어이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기술적인 개선은</span><span class=\"en\"><b>Technological improvements</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">망원경의 발전으로 이어졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">led to the development of the telescope</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">17세기 초에</span><span class=\"en\"><b>in the early 17th century.</b></span></div></div><div class=\"lec-sent-ko\">기술적인 개선은 17세기 초에 망원경의 발전으로 이어졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 “후대 천문학자들의 발전”이 어떤 도구를 통해 가능해졌는지 설명합니다. 망원경은 멀리 있는 천체를 더 자세히 볼 수 있게 해 주었고, 우주에 대한 추측을 더 정확한 관찰로 확인할 수 있게 만들었습니다. 이 문장은 고대의 육안 관찰에서 근대 과학 장비를 활용한 관찰로 넘어가는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">led to the development of the telescope (관용표현): lead to는 ‘결과로 이어지다’를 나타내는 동사구이다. 구조는 lead to + 명사구이며, 여기서는 the development of the telescope가 전치사 to의 목적어이다.</div><div class=\"lec-gr-item\">the development of the telescope 기본 구조: 명사 development 뒤에 of the telescope가 붙어 내용을 보충하는 명사구이다. of the telescope는 ‘무엇의 발전/개발인지’를 나타내는 전치사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">telescope</td><td class=\"m\">망원경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">망원경을 사용하여</span><span class=\"en\"><b><span class=\"grammar-hl\">Using a telescope</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이탈리아 과학자 Galileo Galilei는</span><span class=\"en\"><b>the Italian scientist Galileo Galilei</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목성의 네 개의 가장 큰 위성을 발견했고</span><span class=\"en\"><b><span class=\"grammar-hl\">discovered the four largest moons of Jupiter</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지구의 달에 있는 분화구를 관찰했다</span><span class=\"en\"><b><span class=\"grammar-hl\">and observed craters on Earth's Moon</span>.</b></span></div></div><div class=\"lec-sent-ko\">망원경을 사용하여, 이탈리아 과학자 Galileo Galilei는 목성의 네 개의 가장 큰 위성을 발견했고 지구의 달에 있는 분화구를 관찰했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 망원경이 실제로 어떤 발견을 가능하게 했는지 보여 주는 구체적 예시입니다. 목성 주위를 도는 위성의 발견은 모든 천체가 지구를 중심으로 돈다는 기존 생각을 약화시켰습니다. 또한 달의 분화구 관찰은 하늘의 천체가 완전하고 매끈하다는 오래된 관념에도 충격을 주었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Using a telescope (분사구문): Using a telescope는 현재분사 Using으로 시작하는 부사적 분사구문이다. 원래 절로 바꾸면 when he used a telescope 정도가 되며, 주절의 주어 the Italian scientist Galileo Galilei와 같은 대상을 he로 받아 표현할 수 있다.</div><div class=\"lec-gr-item\">discovered the four largest moons of Jupiter and observed craters on Earth&#39;s Moon 기본 구조: discovered와 observed가 and로 병렬 연결되어 같은 주어 Galileo Galilei를 공유한다. discovered는 목적어 the four largest moons of Jupiter를, observed는 목적어 craters on Earth&#39;s Moon을 각각 취하는 타동사 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">telescope</td><td class=\"m\">망원경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그는 또한 확증했다</span><span class=\"en\"><b>He also <span class=\"grammar-hl\">confirmed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Copernicus의 이론이 옳았음을</span><span class=\"en\"><b><span class=\"grammar-hl\">that Copernicus' theory was correct</span>.</b></span></div></div><div class=\"lec-sent-ko\">그는 또한 Copernicus의 이론이 옳았음을 확증했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 갈릴레오의 관찰 결과가 코페르니쿠스의 태양중심설을 뒷받침했다는 결론입니다. 갈릴레오는 망원경 관찰을 통해 코페르니쿠스의 주장이 단순한 계산상의 가설을 넘어 실제 우주 관찰과 맞아떨어진다는 점을 보여 주었습니다. 그래서 이 문장은 코페르니쿠스와 갈릴레오의 연구를 논리적으로 연결합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">confirmed that Copernicus&#39; theory was correct 기본 구조: confirm + that절 구조로, that Copernicus&#39; theory was correct가 동사 confirmed의 목적어 역할을 한다. that절 내부는 주어 Copernicus&#39; theory + be동사 was + 보어 correct로 이루어져 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">theory</td><td class=\"m\">이론, 학설, 견해</td></tr><tr><td class=\"w\">confirm</td><td class=\"m\">확인하다, 입증하다, 확정하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">수 세기에 걸쳐</span><span class=\"en\"><b>Over the centuries,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과학적 발견과 망원경으로부터 온 정보는</span><span class=\"en\"><b>scientific discoveries and <span class=\"grammar-hl\">information from telescopes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 지식을 전진시켰다</span><span class=\"en\"><b>advanced our knowledge</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우주가 어떻게 작동하는지에 대한</span><span class=\"en\"><b>of <span class=\"grammar-hl\">how the universe works</span>.</b></span></div></div><div class=\"lec-sent-ko\">수 세기에 걸쳐, 망원경으로부터 온 과학적 발견과 정보는 우주가 어떻게 작동하는지에 대한 우리의 지식을 전진시켰다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 전체 글의 결론입니다. 고대의 별 관찰, 코페르니쿠스의 새로운 이론, 망원경의 개발, 갈릴레오의 발견이 모두 이어져 인간의 우주 이해를 넓혀 왔다는 흐름을 정리합니다. 과학 지식은 한 번에 완성되는 것이 아니라 관찰, 이론, 기술, 검증이 쌓이면서 발전한다는 메시지를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how the universe works (간접의문문): how + 주어 + 동사 구조로, 직접의문문 어순인 How does the universe work?가 아니라 평서문 어순 how the universe works로 쓰였다. 이 간접의문문은 전치사 of의 목적어 역할을 하며 knowledge of ... 구조 안에 들어간다.</div><div class=\"lec-gr-item\">information from telescopes 기본 구조: information 뒤에 from telescopes가 붙어 앞의 명사를 수식하는 전치사구이다. from telescopes는 정보의 출처를 나타내며 명사 information을 보충한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">telescope</td><td class=\"m\">망원경</td></tr><tr><td class=\"w\">universe</td><td class=\"m\">우주, 만물, 세계</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간은 망원경이 없던 시대부터 하늘을 관찰하며 우주를 이해하려 했다.</li><li>고대 문명들은 별의 움직임을 기록했고, 이는 초기 천문학의 바탕이 되었다.</li><li>코페르니쿠스는 지구가 태양 주위를 돈다는 혁명적인 이론을 제시했다.</li><li>망원경의 발명 이후 갈릴레오는 관찰을 통해 코페르니쿠스의 이론을 뒷받침했다.</li><li>과학적 발견과 기술 발전이 쌓이면서 인간의 우주 이해는 계속 깊어졌다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People first studied the universe through direct observation, and later telescopes helped confirm new theories and deepen astronomical knowledge.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 처음에 직접 관찰로 우주를 연구했으며, 이후 망원경은 새로운 이론을 확인하고 천문학 지식을 심화하는 데 도움을 주었다.</div></div></div>"],"segs":[[{"audio":"./37_audio/1.mp3","hl":null}],[{"audio":"./37_audio/2.mp3","hl":null}],[{"audio":"./37_audio/3.mp3","hl":null},{"audio":"./37_audio/4.mp3","hl":"stage-0"},{"audio":"./37_audio/5.mp3","hl":"stage-1"},{"audio":"./37_audio/6.mp3","hl":"stage-2"},{"audio":"./37_audio/7.mp3","hl":"stage-3"},{"audio":"./37_audio/8.mp3","hl":"stage-4"}],[{"audio":"./37_audio/9.mp3","hl":null}],[{"audio":"./37_audio/10.mp3","hl":"main"},{"audio":"./37_audio/11.mp3","hl":"meaning"},{"audio":"./37_audio/12.mp3","hl":"grammar"}],[{"audio":"./37_audio/13.mp3","hl":"main"},{"audio":"./37_audi
