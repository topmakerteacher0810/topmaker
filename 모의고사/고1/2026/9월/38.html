요해집니다. 과학사학자 시어도어 포터(Theodore M. Porter)는 측정을 거리의 기술(Technology of Distance)이라고 설명했는데, 이는 서로 다른 지역과 문화의 사람들이 직접 만나지 않아도 공통 규칙을 통해 정보를 주고받게 해 준다는 뜻입니다. 예를 들어 ‘한 뼘’이나 ‘한 발’처럼 신체 단위(Body-based Units)를 쓰면 가까운 사람들끼리는 통하지만, 사람마다 손과 발 크기가 달라 무역(Trade)이나 세금·공물(Tribute)을 정할 때 분쟁이 생기기 쉽습니다. 그래서 고대 사회에서는 점차 공동체 전체가 인정하는 단위(Unit)와 정의(Definition)를 만들 필요가 커졌고, 이는 오늘날 미터(meter)나 킬로그램(kilogram) 같은 국제 표준 단위로 이어졌다고 볼 수 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01일관성의 필요</div><ul><li>측정 단위의 잠재력을 제대로 활용하려면 일정한 일관성(consistency)이 필요하다.</li><li>주관적 척도(subjective measures)는 유용한 지식을 담고 있음</li><li>개인 경험(individual experience)에 기반해 공유가 어려움</li><li>핵심 키워드: 일관성(consistency)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02측정의 역할</div><ul><li>측정은 서로 다른 문화와 지역 사이에서 정보를 주고받게 하는 도구로 설명된다.</li><li>포터(Porter)는 측정을 거리의 기술(technology of distance)이라 부름</li><li>공유된 규칙(shared rules)이 차이를 연결함</li><li>정보 교환(exchange of information)을 가능하게 함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03언어로서의 측정</div><ul><li>측정이 언어와 같다면, 단위도 의사소통을 위해 신뢰할 수 있는 정의가 필요하다.</li><li>단어(words)처럼 단위(units)도 명확한 의미가 필요함</li><li>믿을 만한 정의(reliable definitions)가 있어야 소통 가능</li><li>핵심 키워드: 단위 정의(unit definitions)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04초기 사회의 단순한 기준</div><ul><li>초기 사회에서는 측정 기준이 작은 공동체 안에서만 공유되면 충분했다.</li><li>한 정착지(single settlement) 안에서만 통하면 됨</li><li>특정 신체 부위(body part)를 기준으로 단위를 정함</li><li>정의가 복잡할 필요가 없었음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05공동체 성장과 한계</div><ul><li>공동체가 커지면서 신체 기준 측정의 부족함이 드러나고, 더 큰 일관성이 요구된다.</li><li>거래(trade)나 공물(tribute) 문제에서 다툼 발생 가능</li><li>갈등(conflict)은 더 정확한 측정 기준을 요구함</li><li>핵심 키워드: 측정의 일관성(consistency in measurement)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">harness</td><td class=\"m\">이용하다, 활용하다, 통제하여 동력으로 쓰다</td></tr><tr><td class=\"w\">potential</td><td class=\"m\">잠재력, 가능성</td></tr><tr><td class=\"w\">unit</td><td class=\"m\">단위, 구성 단위, 한 개</td></tr><tr><td class=\"w\">measurement</td><td class=\"m\">측정, 측량, 치수</td></tr><tr><td class=\"w\">consistency</td><td class=\"m\">일관성, 한결같음, 농도</td></tr><tr><td class=\"w\">subjective</td><td class=\"m\">주관적인, 개인의 판단에 따른</td></tr><tr><td class=\"w\">be based on</td><td class=\"m\">~에 근거하다, ~을 바탕으로 하다</td></tr><tr><td class=\"w\">bridge</td><td class=\"m\">연결하다, 차이를 메우다, 다리를 놓다</td></tr><tr><td class=\"w\">allow for</td><td class=\"m\">~을 가능하게 하다, ~을 고려하다, ~을 감안하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exchange</td><td class=\"m\">교환, 주고받음, 거래</td></tr><tr><td class=\"w\">reliable</td><td class=\"m\">신뢰할 수 있는, 믿을 만한</td></tr><tr><td class=\"w\">definition</td><td class=\"m\">정의, 의미 규정, 선명도</td></tr><tr><td class=\"w\">in order to</td><td class=\"m\">~하기 위해, ~할 목적으로</td></tr><tr><td class=\"w\">no more ... than</td><td class=\"m\">~에 지나지 않게, ~보다 더 많이는 아닌, 고작 ~만큼</td></tr><tr><td class=\"w\">settlement</td><td class=\"m\">정착지, 합의, 해결</td></tr><tr><td class=\"w\">be equal to</td><td class=\"m\">~와 같다, ~와 동등하다, ~을 감당할 수 있다</td></tr><tr><td class=\"w\">inadequacy</td><td class=\"m\">부적절함, 불충분함, 결함</td></tr><tr><td class=\"w\">evident</td><td class=\"m\">명백한, 분명한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">측정 단위의 최대 잠재력을 이용하려면</span><span class=\"en\"><b><span class=\"grammar-hl\">To harness the full potential of units of measurement</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 어느 정도의 일관성이 필요하다.</span><span class=\"en\"><b><span class=\"grammar-hl\">we need some degree of consistency</span>.</b></span></div></div><div class=\"lec-sent-ko\">측정 단위의 최대 잠재력을 이용하려면 우리는 어느 정도의 일관성이 필요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 주장을 제시합니다. 측정 단위는 여러 사람이 같은 기준으로 사용할 때 힘을 발휘합니다. 길이, 무게, 양을 재더라도 사람마다 기준이 다르면 비교하거나 거래하거나 기록을 공유하기 어렵기 때문에, 글쓴이는 먼저 “측정에는 공통된 기준이 필요하다”는 출발점을 세웁니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">To harness the full potential of units of measurement (to부정사): To harness는 문장 앞에서 목적을 나타내는 부사적 용법의 to부정사구이다. 기본 구조는 to + 동사원형이며, 뒤의 주절 we need some degree of consistency 전체를 수식한다.</div><div class=\"lec-gr-item\">we need some degree of consistency (기본문형): we가 주어(S), need가 타동사(V), some degree of consistency가 목적어(O)인 3형식 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">harness</td><td class=\"m\">이용하다, 활용하다, 통제하여 동력으로 쓰다</td></tr><tr><td class=\"w\">potential</td><td class=\"m\">잠재력, 가능성</td></tr><tr><td class=\"w\">unit</td><td class=\"m\">단위, 구성 단위, 한 개</td></tr><tr><td class=\"w\">measurement</td><td class=\"m\">측정, 측량, 치수</td></tr><tr><td class=\"w\">consistency</td><td class=\"m\">일관성, 한결같음, 농도</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">주관적인 측정은</span><span class=\"en\"><b>Subjective measures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유용한 지식을 포함하고 있지만</span><span class=\"en\"><b>contain useful knowledge,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것은</span><span class=\"en\"><b>but <span class=\"grammar-hl\">this</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어려울 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">can be difficult</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공유하기가</span><span class=\"en\"><b><span class=\"grammar-hl\">to share</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사실상 기반하고 있기 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">based as it is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개인의 경험에.</span><span class=\"en\"><b><span class=\"grammar-hl\">on an individual's experience</span>.</b></span></div></div><div class=\"lec-sent-ko\">주관적인 측정은 유용한 지식을 포함하고 있지만 이것은 개인의 사실상 경험에 기반하기 때문에 공유하기 어려울 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 “일관성”이 왜 필요한지 뒷받침하는 문장입니다. 어떤 사람이 자기 감각이나 경험으로 “이 정도면 충분하다”, “이만큼이 한 단위다”라고 판단할 수는 있습니다. 하지만 그런 기준은 그 사람의 몸, 경험, 상황에 묶여 있어서 다른 사람에게 똑같이 전달되기 어렵습니다. 그래서 개인적 기준만으로는 사회 전체가 함께 쓰는 측정 체계를 만들기 힘들다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">this can be difficult to share (to부정사): to share는 형용사 difficult를 보충하는 to부정사이다. share의 의미상 목적어는 문장 주어 this로 이해되며, difficult + to V 구조에서 to부정사가 난이도의 대상 동작을 나타낸다.</div><div class=\"lec-gr-item\">based as it is on an individual&#39;s experience (과거분사(분사구문)): based ... on ...은 앞의 this를 보충 설명하는 p.p. 분사구문이다. 원래 절은 because it is based on an individual&#39;s experience 정도로 풀 수 있다.</div><div class=\"lec-gr-item\">based as it is on an individual&#39;s experience (수동태): as it is based on ...의 구조가 based as it is on ... 형태로 들어간 것이다. be동사(is)+p.p.(based) 구조이며, base는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) is based on 형태로 쓴다. 기본구조: base A on B.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">subjective</td><td class=\"m\">주관적인, 개인의 판단에 따른</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과학사학자 Theodore M. Porter는</span><span class=\"en\"><b>The historian of science Theodore M. Porter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">측정을 묘사한다</span><span class=\"en\"><b><span class=\"grammar-hl\">describes measurement</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘거리의 기술’로</span><span class=\"en\"><b><span class=\"grammar-hl\">as a 'technology of distance'</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">도구이다</span><span class=\"en\"><b><span class=\"grammar-hl\">a tool</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공유된 규칙을 사용하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that uses shared rules</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문화와 지리의 차이를 메우기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to bridge differences of culture and geography</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정보의 교환을 가능하게 하면서.</span><span class=\"en\"><b><span class=\"grammar-hl\">allowing for the exchange of information</span>.</b></span></div></div><div class=\"lec-sent-ko\">과학사학자 Theodore M. Porter는 측정을 ‘거리의 기술’이라고 묘사한다. 즉, 문화와 지리의 차이를 메우기 위해 공유된 규칙을 사용하여 정보의 교환을 가능하게 하는 도구이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞의 주장을 권위 있는 학자의 설명으로 확장합니다. 여기서 측정은 단순히 숫자를 매기는 행위가 아니라, 서로 멀리 떨어져 있거나 서로 다른 문화를 가진 사람들이 같은 기준으로 정보를 주고받게 해 주는 장치로 제시됩니다. 예를 들어 서로 다른 지역의 사람들이 같은 무게 단위를 쓰면, 직접 만나지 않아도 물건의 양이나 가치를 비교할 수 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">describes measurement as a &#39;technology of distance&#39; (5형식(SVOC)): describes가 동사(V), measurement가 목적어(O), as a &#39;technology of distance&#39;가 목적격보어(C)에 해당한다. 기본틀은 describe + O + as C로, 목적어를 특정 성격이나 범주로 설명하는 구조이다.</div><div class=\"lec-gr-item\">a tool that uses shared rules (관계대명사): that이 선행사 a tool을 수식하는 관계대명사절을 이끈다. that은 관계대명사절 안에서 주어 역할을 하며, 뒤에 uses shared rules라는 동사구가 이어진다.</div><div class=\"lec-gr-item\">shared rules (과거분사(형용사)): shared가 rules를 앞에서 수식한다. p.p. + N 구조로, shared rules는 rules that are shared가 줄어든 형태로 볼 수 있다.</div><div class=\"lec-gr-item\">to bridge differences of culture and geography (to부정사): to bridge는 목적을 나타내는 부사적 용법의 to부정사이다. shared rules가 어떤 목적을 위해 사용되는지를 설명하며, 구조는 to + 동사원형이다.</div><div class=\"lec-gr-item\">allowing for the exchange of information (현재분사(분사구문)): allowing for ...는 앞의 a tool that uses shared rules to bridge ... 내용을 이어 받아 결과를 덧붙이는 분사구문이다. 원래 절은 and it allows for the exchange of information 정도로 풀 수 있다.</div><div class=\"lec-gr-item\">allowing for the exchange of information (관용표현): allow for는 ‘~을 가능하게 하다/고려하다’라는 의미의 동사구이다. 구조는 allow for + 명사구이며, 여기서는 the exchange of information이 전치사 for의 목적어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">measurement</td><td class=\"m\">측정, 측량, 치수</td></tr><tr><td class=\"w\">bridge</td><td class=\"m\">연결하다, 차이를 메우다, 다리를 놓다</td></tr><tr><td class=\"w\">exchange</td><td class=\"m\">교환, 주고받음, 거래</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 논리에 따라서</span><span class=\"en\"><b><span class=\"grammar-hl\">Following this logic</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">측정이</span><span class=\"en\"><b><span class=\"grammar-hl\">if measurement</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또 다른 종류의 언어라면</span><span class=\"en\"><b><span class=\"grammar-hl\">is another sort of language</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면 단어와 마찬가지로</span><span class=\"en\"><b>then just as with words,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개별 단위는</span><span class=\"en\"><b>individual units</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신뢰할 만한 정의가 필요하다</span><span class=\"en\"><b>need reliable definitions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의사소통을 하기 위해.</span><span class=\"en\"><b><span class=\"grammar-hl\">in order to communicate</span>.</b></span></div></div><div class=\"lec-sent-ko\">이러한 논리에 따라서, 측정이 또 다른 종류의 언어라면, 단어와 마찬가지로, 개별 단위는 의사소통을 하기 위해 신뢰할 만한 정의가 필요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 “측정은 정보를 교환하게 해 주는 도구”라는 생각을 받아, 측정을 언어에 비유합니다. 말이 통하려면 사람들이 같은 단어를 비슷한 의미로 이해해야 하듯이, 측정 단위도 모두가 같은 크기나 양으로 이해해야 합니다. 이 문장은 측정 단위의 정의가 불분명하면 의사소통 자체가 흔들린다는 점을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Following this logic (현재분사(분사구문)): Following this logic은 문장 앞에서 조건을 나타내는 분사구문이다. 원래 절은 if we follow this logic 정도로 풀 수 있으며, following은 동사 follow의 -ing형이 부사적으로 쓰인 것이다.</div><div class=\"lec-gr-item\">if measurement is another sort of language (조건절): if + S + V 구조의 부사절이다. measurement가 주어, is가 동사, another sort of language가 보어인 2형식 구조가 if절 안에 들어 있다.</div><div class=\"lec-gr-item\">in order to communicate (to부정사): in order to communicate는 목적을 나타내는 to부정사구이다. in order to + 동사원형 구조로, individual units need reliable definitions의 목적을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unit</td><td class=\"m\">단위, 구성 단위, 한 개</td></tr><tr><td class=\"w\">measurement</td><td class=\"m\">측정, 측량, 치수</td></tr><tr><td class=\"w\">reliable</td><td class=\"m\">신뢰할 수 있는, 믿을 만한</td></tr><tr><td class=\"w\">definition</td><td class=\"m\">정의, 의미 규정, 선명도</td></tr><tr><td class=\"w\">in order to</td><td class=\"m\">~하기 위해, ~할 목적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 초기의 사회에서</span><span class=\"en\"><b>In the earliest societies,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 정의는</span><span class=\"en\"><b>these definitions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공유될 필요가 있었을 것이다</span><span class=\"en\"><b>might need <span class=\"grammar-hl\">to be shared</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하나의 정착지 정도의 범위로만</span><span class=\"en\"><b><span class=\"grammar-hl\">no more widely than a single settlement</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이는 의미한다</span><span class=\"en\"><b><span class=\"grammar-hl\">meaning that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 정의가</span><span class=\"en\"><b><span class=\"grammar-hl\">the definition</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 이상으로 복잡할 필요가 없다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">can be no more complex</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아는 것보다</span><span class=\"en\"><b><span class=\"grammar-hl\">than knowing that</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 단위가</span><span class=\"en\"><b><span class=\"grammar-hl\">a unit</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대등하다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">was equal</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정 신체 부위와.</span><span class=\"en\"><b><span class=\"grammar-hl\">to a certain body part</span>.</b></span></div></div><div class=\"lec-sent-ko\">가장 초기의 사회에서, 이러한 정의는 하나의 정착지 정도의 범위로만 공유될 필요가 있었을 것이고, 이는 그 정의가 한 단위는 특정 신체 분위와 대등하다는 것을 아는 정도로만 복잡하면 된다는 것을 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 역사적 배경을 제시하며, 초기 사회에서는 왜 단순한 측정 기준도 작동할 수 있었는지 설명합니다. 작은 마을이나 공동체 안에서는 사람들이 서로 직접 알고 비슷한 생활환경을 공유했기 때문에, 팔 길이, 손바닥 너비, 발 길이 같은 몸을 기준으로 삼아도 큰 문제가 생기지 않았습니다. 앞 문장에서 말한 “정의”가 초기에는 매우 단순한 형태로도 가능했다는 흐름입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to be shared (to부정사): might need 뒤에 to be shared가 이어지는 need + to V 구조이다. 여기서 to부정사는 need의 보충어 역할을 하며, 형태는 to + be + p.p.이다.</div><div class=\"lec-gr-item\">to be shared (수동구조): to be shared는 to부정사 안에서 be동사 원형(be)+p.p.(shared)가 결합한 수동구조이다. share는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) to be shared 형태로 쓴다. 기본구조: share + O(목적어).</div><div class=\"lec-gr-item\">meaning that the definition can be no more complex than knowing that a unit was equal to a certain body part (현재분사(분사구문)): meaning that ...은 앞 절 전체의 결과나 설명을 덧붙이는 분사구문이다. 원래 절은 and this means that the definition can be no more complex ... 정도로 풀 수 있다.</div><div class=\"lec-gr-item\">that the definition can be no more complex than knowing that a unit was equal to a certain body part 명사절 that: that절이 meaning의 목적어 역할을 한다. 여기서 that은 앞 명사를 설명하는 동격의 that이 아니라, 동사 meaning의 내용을 받는 명사절 접속사이다.</div><div class=\"lec-gr-item\">knowing that a unit was equal to a certain body part (동명사): knowing은 -ing 형태이지만 명사 역할을 하므로 동명사이다. no more complex than 뒤에서 비교의 기준이 되는 명사적 요소로 쓰이며, that a unit was equal ...은 knowing의 목적어절이다.</div><div class=\"lec-gr-item\">that a unit was equal to a certain body part 명사절 that: that절이 knowing의 목적어 역할을 한다. that 뒤에는 a unit이 주어, was equal to가 서술부인 완전한 절이 온다.</div><div class=\"lec-gr-item\">no more widely than a single settlement (관용표현): no more ... than은 비교급과 함께 쓰여 범위나 정도의 상한을 나타내는 구조이다. 여기서는 widely를 수식하여 공유 범위가 a single settlement를 넘지 않는다는 구조를 만든다.</div><div class=\"lec-gr-item\">no more complex than knowing that a unit was equal to a certain body part (관용표현): no more ... than 구조가 형용사 complex와 함께 쓰였다. no more complex than + 명사적 요소 구조로, 복잡성의 정도를 뒤의 knowing ...과 비교한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unit</td><td class=\"m\">단위, 구성 단위, 한 개</td></tr><tr><td class=\"w\">definition</td><td class=\"m\">정의, 의미 규정, 선명도</td></tr><tr><td class=\"w\">settlement</td><td class=\"m\">정착지, 합의, 해결</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 이러한 공동체들이 규모가 커지면서</span><span class=\"en\"><b><span class=\"grammar-hl\">As these communities grew in size</span>, though,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 체계의 불충분함이</span><span class=\"en\"><b>the inadequacies of this system</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분명해졌을 것이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">would become evident</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 이러한 공동체들이 규모가 커지면서, 이 체계의 불충분함이 분명해졌다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞의 초기 사회 설명에서 전환을 만듭니다. 작은 공동체에서는 몸을 기준으로 한 단위가 통했지만, 공동체가 커지고 사람들의 이동과 교역이 늘어나면 문제가 생깁니다. 사람마다 신체 크기가 다르고 지역마다 관습이 다르기 때문에, 같은 단위라고 해도 실제 크기가 달라질 수 있습니다. 그래서 단순하고 지역적인 기준이 더 넓은 사회에서는 불안정한 체계로 드러난다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">As these communities grew in size (부사절): As + S + V 구조로, 시간의 흐름을 나타내는 종속절이다. these communities가 주어, grew가 동사이며, in size는 grew를 보충하는 전치사구이다.</div><div class=\"lec-gr-item\">would become evident (기본문형): would become evident는 조동사 would + 동사원형 become + 형용사 보어 evident의 구조이다. become은 연결동사로 쓰여 주어 the inadequacies of this system의 상태 변화를 설명하는 2형식(SVC)을 만든다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unit</td><td class=\"m\">단위, 구성 단위, 한 개</td></tr><tr><td class=\"w\">evident</td><td class=\"m\">명백한, 분명한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">불일치를 상상해 보아라</span><span class=\"en\"><b><span class=\"grammar-hl\">Imagine a disagreement</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무역이나 조공에 관한</span><span class=\"en\"><b><span class=\"grammar-hl\">over trade or tribute</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 갈등의 순간이다</span><span class=\"en\"><b><span class=\"grammar-hl\">it is a moment of conflict</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">측정에 있어 더 큰 일관성을 요구하는.</span><span class=\"en\"><b><span class=\"grammar-hl\">that demands greater consistency in measurement</span>.</b></span></div></div><div class=\"lec-sent-ko\">무역이나 조공에 관한 불일치를 상상해 보아라. 그것은 측정에 있어 더 큰 일관성을 요구하는 갈등의 순간이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞 문장에서 말한 문제를 구체적인 장면으로 보여 줍니다. 물건을 사고팔거나 권력자에게 정해진 양을 바쳐야 하는 상황에서는 “얼마만큼이 정확한 양인가”가 매우 중요해집니다. 한쪽은 충분히 냈다고 생각하고 다른 쪽은 부족하다고 판단하면 갈등이 생깁니다. 이 예시는 사회가 커질수록 공통되고 정확한 측정 기준이 필요해진다는 결론을 강화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Imagine a disagreement over trade or tribute (명령문): Imagine이 동사원형으로 문장 앞에 와서 명령문을 만든다. 명령문은 보통 주어 you가 생략된 구조이며, a disagreement over trade or tribute가 Imagine의 목적어이다.</div><div class=\"lec-gr-item\">that demands greater consistency in measurement (관계대명사): that이 선행사 a moment of conflict를 수식하는 관계대명사절을 이끈다. that은 절 안에서 주어 역할을 하고, demands가 동사, greater consistency in measurement가 목적어이다. 여기서 demands 뒤에 that절이 온 것이 아니므로 당위성 that절 구조가 아니다.</div><div class=\"lec-gr-item\">it is a moment of conflict (기본문형): it이 주어(S), is가 연결동사(V), a moment of conflict가 주격보어(C)인 2형식 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">measurement</td><td class=\"m\">측정, 측량, 치수</td></tr><tr><td class=\"w\">consistency</td><td class=\"m\">일관성, 한결같음, 농도</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>측정 단위가 제대로 쓰이려면 여러 사람이 공유하는 일관된 기준이 필요하다.</li><li>개인 경험에 의존한 주관적 측정은 유용할 수 있지만 널리 공유되기 어렵다.</li><li>측정은 문화와 지역의 차이를 넘어 정보를 주고받게 하는 일종의 언어처럼 작동한다.</li><li>초기 사회에서는 신체 부위를 기준으로 한 단순한 단위도 충분했지만, 공동체가 커지자 한계가 드러났다.</li><li>무역이나 공납처럼 이해관계가 걸린 상황에서는 더 정확하고 일관된 측정 기준이 필요해졌다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Subjective measures can contain useful knowledge, but consistent units with shared definitions are necessary for effective communication.</div>\n              <div class=\"lec-final-sum-ko\">주관적 측정은 유용한 지식을 담을 수 있지만, 효과적인 소통을 위해서는 공유된 정의를 가진 일관된 단위가 필요하다.</div></div></div>"],"segs":[[{"audio":"./38_audio/1.mp3","hl":null}],[{"audio":"./38_audio/2.mp3","hl":null}],[{"audio":"./38_audio/3.mp3","hl":null},{"audio":"./38_audio/4.mp3","hl":"stage-0"},{"audio":"./38_audio/5.mp3","hl":"stage-1"},{"audio":"./38_audio/6.mp3","hl":"stage-2"},{"audio":"./38_audio/7.mp3","hl":"stage-3"},{"audio":"./38_audio/8.mp3","hl":"stage-4"}],[{"audio":"./38_audio/9.mp3","hl":null}],[{"audio":"./38_audio/10.mp3","hl":"main"},{"audio":"./38_audio/11.mp3","hl":"meaning"},{"audio":"./38_audio/12.mp3","hl":"grammar"}],[{"audio":"./38_audio/13.mp3","hl":"main"},{"audio":"./38_audio/14.mp3","hl":"meaning"},{"audio":"./38_audio/15.mp3","hl":"grammar"}],[{"audio":"./38_audio/16.mp3","hl":"main"},{"audio":"./38_audio/17.mp3","hl":"meaning"},{"audio":"./38_audio/18.mp3","hl":"grammar"}],[{"audio":"./38_audio/19.mp3","hl":"main"},{"audio":"./38_audio/20.mp3","hl":"meaning"},{"audio":"./38_audio/21.mp3","hl":"grammar"}],[{"audio":"./38_audio/22.mp3","hl":"main"},{"audio":"./38_audio/23.mp3","hl":"meaning"},{"audio":"./38_audio/24.mp3","hl":"grammar"}],[{"audio":"./38_audio/25.mp3","hl":"main"},{"audio":"./38_audio/26.mp3","hl":"meaning"},{"audio":"./38_audio/27.mp3","hl":"grammar"}],[{"audio":"./38_audio/28.mp3","hl":"main"},{"audio":"./38_audio/29.mp3","hl":"meaning"},{"audio":"./38_audio/30.mp3","hl":"grammar"}],[{"audio":"./38_audio/31.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
