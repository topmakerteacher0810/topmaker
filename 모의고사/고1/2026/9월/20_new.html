<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"20번","audioDir":"20_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">20번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>Prioritizing Learning Outcomes over Entertainment in Educational Games\u003c/h1>\u003ch2>학습 게임에서 오락보다 학습 성과를 우선시해야 하는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>학습 게임은 단순히 즐거움을 주는 \u003cb class=\"key\">오락\u003c/b>보다는 학습자가 콘텐츠와 \u003cb class=\"key\">상호작용성\u003c/b>을 갖고 \u003cb class=\"key\">참여\u003c/b>하게 함으로써 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">성과\u003c/b>를 달성하는 데 집중해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Learning games must focus on interactivity and engagement to achieve educational outcomes rather than overemphasizing pure entertainment.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 학습용 게임이 나아가야 할 올바른 방향에 대한 지문을 함께 살펴보겠습니다. 이 글은 우리가 흔히 생각하는 게임의 재미보다는 학습 성과와 참여의 중요성을 강조하고 있어요. 전체적으로 학습 게임은 단순한 오락이 아닌 학습 성과와 상호작용성에 초점을 맞춰 설계되어야 한다는 내용을 담고 있습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">게임을 교육에 활용하는 \u003cb class=\"key\">G-Learning\u003c/b>에서는 재미와 학습 사이의 균형이 무엇보다 중요합니다. 교육적 목적이 상실된 채 재미만 추구하면 학습자는 지식 습득이 아닌 게임의 규칙에만 매몰되는 \u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">과부하\u003c/b>를 겪을 수 있습니다. 이는 마치 \u003cb class=\"key\">비타민제\u003c/b>가 아이들이 먹기 좋게 사탕처럼 달콤해야 하지만, 그 본질은 설탕이 아닌 영양분 공급에 있는 것과 같습니다. 따라서 효과적인 학습 게임 설계를 위해서는 게임의 요소가 학습이라는 \u003cb class=\"key\">본질적 \u003c/b>\u003cb class=\"key\">목표\u003c/b>를 가리지 않도록 주의해야 합니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 분석에 앞서 배경지식을 좀 알아볼까요? 요즘 교육과 게임을 결합한 지러닝이라는 개념이 아주 핫하죠. 하지만 인지 과부하 이론에 따르면, 게임의 규칙이나 시각적인 효과가 너무 화려하고 복잡하면 오히려 우리 뇌는 학습 내용을 처리하는 데 방해를 받게 됩니다. 마치 비타민제가 사탕처럼 맛있어서 먹기는 좋아야 하지만, 우리 몸에 필요한 건 결국 영양분인 것과 같은 이치예요. 그래서 학습 게임에서는 재미라는 요소가 학습이라는 본질적 목표를 가리지 않는 것이 핵심입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>학습 게임의 잘못된 설계 방향\u003csmall>통념 및 문제 제기 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>학습 게임은 적당히 재미있어야 하지만, 많은 \u003cb class=\"key\">개발자\u003c/b>들이 단순히 재미있는 게임을 만드는 데만 치중하는 실수를 범합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>오락성 추구의 부작용과 진정한 목표\u003csmall>주장 및 근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>과도한 재미는 오히려 학습을 방해하므로, 상업적 오락보다는 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">성과\u003c/b>의 달성을 성공의 척도로 삼고 복잡한 게임 요소를 \u003cb class=\"key\">억제\u003c/b>해야 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>참여와 상호작용의 중요성\u003csmall>대안 제시 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>게임의 목표는 단순한 오락이 아니라 학습자의 \u003cb class=\"key\">참여\u003c/b>와 상호작용이어야 하며, 이를 통해 교육적 목적을 달성해야 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>연구 결과와 최종 결론\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>연구에 따르면 교육적 가치는 \u003cb class=\"key\">상호작용성\u003c/b>의 수준에 달려 있으며, 학습자가 \u003cb class=\"key\">능동적인\u003c/b> 상태가 되도록 만드는 것이 가장 중요합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 문장들을 통해 글의 논리적인 흐름을 하나씩 따라가 보겠습니다.","hl":null},{"n":4,"text":"먼저 첫 번째와 두 번째 문장에서는 학습 게임의 잘못된 설계 경향을 지적합니다. 개발자들이 흔히 저지르는 실수가 바로 필요한 만큼만 재미있으면 되는데, 지나치게 재미있는 게임을 만들려고 한다는 것이죠.","hl":"f0"},{"n":5,"text":"3번부터 다섯 번째 문장에서는 이런 오락성 추구가 불러오는 부작용을 경고합니다. 재미에 치중하면 오히려 학습이 더 힘들어질 수 있기 때문에, 상업적 오락보다는 학습 성과를 우선시하고 불필요한 게임 요소를 억제하라고 조언합니다.","hl":"f1"},{"n":6,"text":"이어지는 여섯 번째에서 여덟 번째 문장은 구체적인 대안을 제시하는데요. 게임은 가벼운 재미와 함께 학습자의 참여를 이끌어내야 하며, 오락보다는 상호작용성과 참여 그 자체를 목표로 삼아야 한다고 강조합니다.","hl":"f2"},{"n":7,"text":"마지막 아홉 번째와 열 번째 문장에서는 연구 결과를 바탕으로 결론을 내립니다. 결국 게임을 교육적으로 만드는 핵심은 상호작용성이고, 학습자가 즐거워하는 것보다 능동적인 상태로 참여하는 것이 훨씬 더 중요하다는 사실을 짚어줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부에서 학습 게임의 올바른 정의를 내리고, 후반부인 10번 문장에서 학습자의 참여와 \u003cb class=\"key\">능동적인\u003c/b> 태도가 오락성보다 중요하다는 결론을 내리는 \u003cb class=\"key\">양괄식\u003c/b> 구조입니다. 특히 7번과 10번 문장에서 반복적으로 \u003cb class=\"key\">참여\u003c/b>와 상호작용의 중요성을 강조하며 주제를 강화하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Unfortunately (3)\u003c/b>\u003cspan>기존 시도의 문제점 노출\u003c/span>\u003cb>Remember (4)\u003c/b>\u003cspan>필자가 강조하는 핵심 가치 환기\u003c/span>\u003cb>Resist the temptation (5)\u003c/b>\u003cspan>피해야 할 행동 권고\u003c/span>\u003cb>Focus on (7)\u003c/b>\u003cspan>핵심 전략 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">learning games\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">achievement of learning outcomes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">engaging with a mild level of fun\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">interactivity and engagement\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">engaged and active\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Entertainment (오락성)\u003c/th>\u003cth>Engagement/Interactivity (참여/상호작용)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>상업적 게임의 특징, 지나친 규칙과 요소\u003c/td>\u003ctd>학습 성과 달성, 교육적 가치의 핵심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>학습을 더 어렵게 만들 수 있음\u003c/td>\u003ctd>학습자를 능동적으로 만듦\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식을 보면, 처음에는 학습 게임에 대한 통념과 문제점을 지적하고 마지막에 결론을 내리는 양괄식 구조를 취하고 있습니다. 필자는 시종일관 학습 게임의 존재 이유가 오락이 아닌 학습에 있음을 명확히 하고 있죠. 특히 마지막 문장에서 학습자가 능동적인 태도를 갖는 것이 중요하다는 결론을 내리며 주제를 완성하고 있습니다.","hl":"ty"},{"n":9,"text":"글 곳곳에 중요한 신호어들이 보이네요. 세 번째 문장의 불행히도라는 표현은 재미만 추구했을 때의 부작용을 예고하고요. 4번의 기억하라나 5번의 억제하라는 표현은 필자의 강한 주장을 드러냅니다. 또한 오락과 참여라는 두 개념을 대조하며 읽어야 글의 맥락이 더 명확해집니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>developer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개발자\u003c/span>\u003c/div>\u003cdiv>\u003cb>entertaining\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>재미있는, 즐거움을 주는\u003c/span>\u003c/div>\u003cdiv>\u003cb>unfortunately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>불행히도\u003c/span>\u003c/div>\u003cdiv>\u003cb>commercial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상업용의\u003c/span>\u003c/div>\u003cdiv>\u003cb>measured\u003c/b>\u003cem>동사\u003c/em>\u003cspan>측정되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>achievement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>달성, 성취\u003c/span>\u003c/div>\u003cdiv>\u003cb>outcome\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성과, 결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>resist\u003c/b>\u003cem>동사\u003c/em>\u003cspan>억제하다, 저항하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>temptation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유혹\u003c/span>\u003c/div>\u003cdiv>\u003cb>pile on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>쌓아 올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>element\u003c/b>\u003cem>명사\u003c/em>\u003cspan>요소\u003c/span>\u003c/div>\u003cdiv>\u003cb>incorporate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다, 통합하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dynamics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역학\u003c/span>\u003c/div>\u003cdiv>\u003cb>interest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>흥미\u003c/span>\u003c/div>\u003cdiv>\u003cb>engaging\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>참여를 이끄는, 매력적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>mild\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가벼운, 온건한\u003c/span>\u003c/div>\u003cdiv>\u003cb>goal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목표\u003c/span>\u003c/div>\u003cdiv>\u003cb>focus on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 집중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interactivity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상호작용성\u003c/span>\u003c/div>\u003cdiv>\u003cb>instructional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>교육적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>content\u003c/b>\u003cem>명사\u003c/em>\u003cspan>콘텐츠, 내용\u003c/span>\u003c/div>\u003cdiv>\u003cb>parameter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>요인, 매개변수\u003c/span>\u003c/div>\u003cdiv>\u003cb>active\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>능동적인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들도 체크해 봅시다. 성과를 뜻하는 아웃컴이나 상호작용성을 의미하는 인터액티비티는 이 지문의 핵심 키워드니까 꼭 기억하세요. 그리고 참여를 이끄는이라는 뜻의 인게이징도 교육 관련 지문에서 자주 나오는 표현입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">achievement\u003c/b>\u003cspan class=\"m\">달성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accomplishment\u003c/span>\u003cspan class=\"s\">attainment\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">failure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">outcome\u003c/b>\u003cspan class=\"m\">성과\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">result\u003c/span>\u003cspan class=\"s\">consequence\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">resist\u003c/b>\u003cspan class=\"m\">억제하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">withstand\u003c/span>\u003cspan class=\"s\">refrain from\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">surrender\u003c/span>\u003cspan class=\"a\">yield\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">engagement\u003c/b>\u003cspan class=\"m\">참여\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">involvement\u003c/span>\u003cspan class=\"s\">participation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">detachment\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">active\u003c/b>\u003cspan class=\"m\">능동적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">energetic\u003c/span>\u003cspan class=\"s\">proactive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">passive\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. 달성을 뜻하는 어치브먼트는 어컴플리쉬먼트로 바꿔 쓸 수 있고, 반대말은 실패를 뜻하는 페일러가 되겠죠. 억제하다라는 뜻의 리지스트는 위드스탠드와 비슷한 의미지만, 굴복하다라는 뜻의 일드와는 반대되는 개념입니다. 참여라는 뜻의 인게이지먼트와 능동적인이라는 뜻의 액티브도 꼭 세트로 외워두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학습 게임은\u003c/span>\u003cspan class=\"en\">Learning games\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">될 필요가 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 ~라 부르는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">call\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘필요한 만큼 재미있는’이라\u003c/span>\u003cspan class=\"en\">'fun enough.'\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학습 게임은 우리가 ‘필요한 만큼 재미있는’이라 부르는 것이 될 필요가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">학습용 \u003c/b>\u003cb class=\"key\">게임\u003c/b>의 목적은 무조건적인 재미가 아니라, 교육적 목적을 달성할 수 있을 정도의 \u003cb class=\"key\">적당한 \u003c/b>\u003cb class=\"key\">재미\u003c/b>를 갖추는 것임을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : need [타동사] + [to be (to부정사구/목적어)] : \"될 필요가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용구(선행사를 포함한 관계대명사)\u003c/span> : what [관계대명사] + we call [주어+동사] : \"소위, 우리가 ~라고 부르는 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Learning games, 학습 게임은. need to be, 될 필요가 있다. what we call, 우리가 ~라 부르는 것이. 'fun enough.', ‘필요한 만큼 재미있는’이라. 이 문장 전체를 해석하면, 학습 게임은 우리가 ‘필요한 만큼 재미있는’이라 부르는 것이 될 필요가 있다.","hl":"m"},{"n":13,"text":"첫 문장부터 글의 핵심 소재가 나오죠? 학습 게임은 단순히 재미있기만 해서는 안 되고, 교육에 딱 필요한 만큼의 재미인 적당한 재미를 갖춰야 한다는 뜻이에요.","hl":"mn"},{"n":14,"text":"첫 번째로 need 다음에 오는 to be는 명사적 용법으로 목적어 역할을 합니다. 두 번째로 what we call은 소위, 소위 말하는 이라는 뜻의 관계대명사 관용구로 뒤에 오는 말을 강조해 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 새로운 학습 게임 개발자는\u003c/span>\u003cspan class=\"en\">Many new learning-game developers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">설계하려고 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">design\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재미있는 게임을\u003c/span>\u003cspan class=\"en\">an \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">entertaining\u003c/span> game.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">많은 새로운 학습 게임 개발자는 재미있는 게임을 설계하려고 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신입 개발자들이 흔히 저지르는 \u003cb class=\"key\">실수\u003c/b>를 언급하며, 단순히 \u003cb class=\"key\">오락적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>만을 강조하려는 경향을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사를 목적어로 취하는 동사(노력)\u003c/span> : try + [to design (to부정사/목적어)] : \"설계하려고 애쓰다/노력하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 명사 수식\u003c/span> : [entertaining (현재분사)] + game [명사] : \"재미있는(즐거움을 주는)\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Many new learning-game developers, 많은 새로운 학습 게임 개발자는. try to design, 설계하려고 한다. an entertaining game, 재미있는 게임을. 이 문장 전체를 해석하면, 많은 새로운 학습 게임 개발자는 재미있는 게임을 설계하려고 한다.","hl":"m"},{"n":16,"text":"많은 초보 개발자들이 학습보다는 게임의 재미 그 자체인 오락적 요소에만 집중하는 실수를 저지른다는 배경을 설명하고 있어요.","hl":"mn"},{"n":17,"text":"여기서 try to design은 무언가를 하려고 애쓰는 노력을 의미해요. 또한 entertaining은 뒤에 나오는 명사인 게임을 꾸며주는데 게임이 재미를 주는 주체니까 현재분사 형태를 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불행히도\u003c/span>\u003cspan class=\"en\">Unfortunately,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 종종 만든다\u003c/span>\u003cspan class=\"en\">that often \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학습을 더 어렵게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">learning \u003c/span>\u003cspan class=\"tgt\">harder\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라기보다는 오히려 더 쉽게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than\u003c/span> easier.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">불행히도 그것은 종종 학습을 더 쉽게 라기보다는 오히려 더 어렵게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오락성에만 치중할 경우 발생하는 \u003cb class=\"key\">부작용\u003c/b>에 대한 설명으로, \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">효율성\u003c/b>이 떨어지는 역설적인 상황을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장(목적격 보어)\u003c/span> : make [동사] + learning [목적어] + harder [목적격 보어(형용사)] : \"학습을 더 어렵게 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조의 비교 표현\u003c/span> : A rather than B : \"B라기보다는 오히려 A\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Unfortunately, 불행히도. that often makes, 그것은 종종 만든다. learning harder, 학습을 더 어렵게. rather than easier, 라기보다는 오히려 더 쉽게. 이 문장 전체를 해석하면, 불행히도 그것은 종종 학습을 더 쉽게 라기보다는 오히려 더 어렵게 만든다.","hl":"m"},{"n":19,"text":"재미있게 만들려고 했던 시도가 오히려 학습을 방해해서 공부를 더 어렵게 만든다는 안타까운 결과를 보여주네요. 여기서 그것은 앞 문장에서 말한 오락적인 게임을 만들려는 노력을 뜻합니다.","hl":"mn"},{"n":20,"text":"5형식 문장 구조를 꼭 기억하세요. make 뒤에 목적어인 학습이 오고 그 상태를 설명하는 보어로 형용사 harder가 왔어요. rather than은 뒤의 것보다 오히려 앞의 것이라는 비교 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기억하라,\u003c/span>\u003cspan class=\"en\">Remember,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 그 다음의 훌륭한 상업용 게임을 만들고 있는 것이 아니라는 것을\u003c/span>\u003cspan class=\"en\">you are not creating the next great commercial game\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 학습자를 즐겁게 하기 위한;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">entertain\u003c/span> your learners;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 학습 게임을 만들고 있다\u003c/span>\u003cspan class=\"en\">you are creating a learning game\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">성공이 측정될\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">which\u003c/span> success \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">measured\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학습 성과의 달성에 의해.\u003c/span>\u003cspan class=\"en\">by the achievement of learning outcomes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 당신의 학습자를 즐겁게 하기 위한 그 다음의 훌륭한 상업용 게임을 만들고 있는 것이 아니라는 것을 기억하라. 당신은 성공이 학습 성과의 달성에 의해 측정될 학습 게임을 만들고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 학습 게임의 본질은 단순한 재미가 아니라 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">성과\u003c/b>에 있다는 것을 강조합니다. 개발자가 흔히 빠지는 \u003cb class=\"key\">상업적 \u003c/b>\u003cb class=\"key\">재미\u003c/b>라는 함정에서 벗어나 교육적 목적을 우선순위에 두어야 함을 상기시킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : commercial game [명사] + [to entertain (to부정사)] : \"즐겁게 하기 위한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 관계대명사\u003c/span> : learning game [선행사] + [in which (전치사+관계대명사)] + [완전한 문장] : \"그 게임 속에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">미래 시제 수동태\u003c/span> : will + be + [p.p. (과거분사)] : \"측정될 것이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Remember, 기억하라. you are not creating the next great commercial game, 당신은 그 다음의 훌륭한 상업용 게임을 만들고 있는 것이 아니라는 것을. to entertain your learners, 당신의 학습자를 즐겁게 하기 위한;. you are creating a learning game, 당신은 학습 게임을 만들고 있다. in which success will be measured, 성공이 측정될. by the achievement of learning outcomes, 학습 성과의 달성에 의해.. 이 문장 전체를 해석하면, 당신은 당신의 학습자를 즐겁게 하기 위한 그 다음의 훌륭한 상업용 게임을 만들고 있는 것이 아니라는 것을 기억하라. 당신은 성공이 학습 성과의 달성에 의해 측정될 학습 게임을 만들고 있다.","hl":"m"},{"n":22,"text":"여러분, 이 문장은 학습 게임의 진짜 목적이 무엇인지 짚어주는 핵심 문장이에요. 단순히 학습자를 즐겁게 만드는 상업 게임을 만드는 게 아니라, 결국 얼마나 학습 성과를 냈느냐로 성공을 평가받는 학습 게임을 만들어야 한다는 뜻이죠.","hl":"mn"},{"n":23,"text":"첫 번째로 to entertain은 앞의 명사를 꾸며주는 형용사적 용법으로 쓰였고요. 두 번째로 아주 중요한 전치사 플러스 관계대명사 in which가 나왔네요. 뒤에 완전한 문장이 온다는 점 꼭 기억하세요. 마지막으로 성공이 측정되는 것이니까 미래 수동태인 will be measured가 사용되었습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유혹을 억제하라\u003c/span>\u003cspan class=\"en\">Resist the temptation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수많은 규칙을 만들고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">create \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">ton \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">rules, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 게임 요소들을 쌓아 올리고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">pile \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">game \u003c/span>\u003cspan class=\"tgt\">elements, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 역학을 포함하려는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">incorporate \u003c/span>\u003cspan class=\"tgt\">multiple \u003c/span>\u003cspan class=\"tgt\">dynamics\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플레이어의 흥미를 높이기 위해.\u003c/span>\u003cspan class=\"en\">to \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">player \u003c/span>\u003cspan class=\"tgt\">interest \u003c/span>\u003cspan class=\"tgt\">high\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">플레이어의 흥미를 높이기 위해 수많은 규칙을 만들고, 다른 게임 요소들을 쌓아 올리고, 다양한 역학을 포함하려는 유혹을 억제하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 흥미를 유발하려고 게임의 규칙이나 요소를 무분별하게 추가하는 것이 오히려 \u003cb class=\"key\">학습의 \u003c/b>\u003cb class=\"key\">방해\u003c/b>가 될 수 있음을 경고합니다. 과도한 \u003cb class=\"key\">복잡성\u003c/b>보다는 학습에 집중할 수 있는 단순함이 필요하다는 제언입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법과 병렬 구조\u003c/span> : temptation [명사] + [to create..., (to) pile..., and (to) incorporate...] : \"규칙을 만들고, 쌓고, 포함하려는 유혹\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 문형 (keep + 목적어 + 목적격 보어)\u003c/span> : keep [동사] + player interest [목적어] + high [형용사/보어] : \"플레이어의 흥미를 높게 유지하다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Resist the temptation, 유혹을 억제하라. to create a ton of rules, 수많은 규칙을 만들고. pile on different game elements, 다른 게임 요소들을 쌓아 올리고. and incorporate multiple dynamics, 다양한 역학을 포함하려는. to keep player interest high, 플레이어의 흥미를 높이기 위해.. 이 문장 전체를 해석하면, 플레이어의 흥미를 높이기 위해 수많은 규칙을 만들고, 다른 게임 요소들을 쌓아 올리고, 다양한 역학을 포함하려는 유혹을 억제하라.","hl":"m"},{"n":25,"text":"게임 개발자들은 흔히 흥미를 위해 이것저것 많이 넣고 싶어 하는데요. 이 문장은 그런 유혹을 참으라고 명령하고 있어요. 너무 많은 규칙이나 복잡한 역학이 오히려 독이 될 수 있다는 거죠.","hl":"mn"},{"n":26,"text":"여기서 to create부터 incorporate까지는 전부 유혹이라는 단어를 꾸며주는 병렬 구조예요. 그리고 마지막에 keep player interest high 부분을 보세요. 5형식 구조로 목적어인 흥미를 어떤 상태로 유지하는지 설명하는 형용사 보어 high가 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇다,\u003c/span>\u003cspan class=\"en\">Yes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게임은 참여를 이끌어야 하지만\u003c/span>\u003cspan class=\"en\">the game should be \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">engaging\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가벼운 수준의 재미를 가지고\u003c/span>\u003cspan class=\"en\">with a mild level of fun,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학습이 목표가 되어야 한다.\u003c/span>\u003cspan class=\"en\">but learning should be the goal.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇다, 게임은 가벼운 수준의 재미를 가지고 참여를 이끌어야 하지만, 학습이 목표가 되어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 재미가 아예 없어야 한다는 뜻은 아니며, \u003cb class=\"key\">적절한 \u003c/b>\u003cb class=\"key\">재미\u003c/b>는 참여를 이끄는 도구로 사용되되, 항상 \u003cb class=\"key\">학습\u003c/b>이 최우선 목표임을 잊지 말아야 한다는 균형 잡힌 시각을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 쓰임\u003c/span> : be [동사] + engaging [주격 보어/현재분사] : \"참여를 이끄는(매력적인)\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Yes, 그렇다. the game should be engaging, 게임은 참여를 이끌어야 하지만. with a mild level of fun, 가벼운 수준의 재미를 가지고. but learning should be the goal, 학습이 목표가 되어야 한다.. 이 문장 전체를 해석하면, 그렇다, 게임은 가벼운 수준의 재미를 가지고 참여를 이끌어야 하지만, 학습이 목표가 되어야 한다.","hl":"m"},{"n":28,"text":"맞아요, 게임이니까 당연히 어느 정도의 재미는 있어야 하겠죠. 하지만 그 재미의 수준은 가벼워야 하고, 핵심은 언제나 학습이라는 목표에 맞춰져 있어야 한다는 점을 강조하고 있습니다.","hl":"mn"},{"n":29,"text":"주어인 게임의 특징을 설명하기 위해 engaging이라는 현재분사가 쓰였는데요. 게임이 사람을 끌어당기는 능동적인 역할을 하니까 ing 형태를 쓰는 게 맞습니다. should be라는 조동사 표현이 반복되며 당위성을 강조하고 있네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">참여에 집중하라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Focus \u003c/span>\u003cspan class=\"tgt\">on\u003c/span> engagement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오락이 아니라.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than\u003c/span> entertainment.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오락이 아니라 참여에 집중하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 학습 게임의 본질은 단순히 노는 즐거움인 \u003cb class=\"key\">오락\u003c/b>이 아니라, 학습자가 내용에 깊이 몰입하게 만드는 \u003cb class=\"key\">참여\u003c/b>에 있음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : [동사원형] + ~ : \"집중하라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조의 비교\u003c/span> : A [명사] + rather than + B [명사] : \"~보다는 오히려\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Focus on engagement, 참여에 집중하라. rather than entertainment, 오락이 아니라.. 이 문장 전체를 해석하면, 오락이 아니라 참여에 집중하라.","hl":"m"},{"n":31,"text":"단순히 재미있게만 만드는 오락이 아니라, 학생들이 학습에 깊이 빠져들게 하는 참여에 초점을 맞춰야 한다는 글의 핵심 요지를 담고 있는 문장이에요.","hl":"mn"},{"n":32,"text":"이 문장은 동사원형인 Focus로 시작하는 명령문이에요. 그리고 rather than이라는 표현을 써서 오락보다는 참여가 훨씬 더 중요하다는 우선순위를 강조하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게임 플레이의 목표는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">goals \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">game \u003c/span>\u003cspan class=\"tgt\">play\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상호작용성과 참여여야 한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">interactivity \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">engagement\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게임 플레이의 목표는 상호작용성과 참여여야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 게임을 개발할 때 반드시 고려해야 할 두 가지 핵심 요소로 \u003cb class=\"key\">상호작용성\u003c/b>과 \u003cb class=\"key\">참여\u003c/b>를 명확한 목표로 설정하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사구 주어\u003c/span> : The + goals [핵심 주어] + of the game play [수식어] : \"게임 플레이의 목표들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사를 포함한 병렬 구조\u003c/span> : should be + [A] and [B] : \"상호작용성과 참여여야 한다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The goals of the game play, 게임 플레이의 목표는. should be interactivity and engagement, 상호작용성과 참여여야 한다.. 이 문장 전체를 해석하면, 게임 플레이의 목표는 상호작용성과 참여여야 한다.","hl":"m"},{"n":34,"text":"게임을 설계할 때 가장 우선시해야 할 구체적인 목표를 제시하고 있어요. 바로 상호작용성과 참여라는 두 가지 키워드죠.","hl":"mn"},{"n":35,"text":"주어의 핵심 단어인 goals가 복수형이라는 점을 눈여겨보세요. 조동사 should 뒤에 동사원형 be가 왔고, 그 뒤에 두 개의 명사가 병렬로 나란히 연결되어 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연구는 ~라는 것을 보여준다\u003c/span>\u003cspan class=\"en\">Research shows \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게임을 교육적으로 만드는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">games \u003c/span>\u003cspan class=\"tgt\">instructional\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상호작용성과 참여의 수준이라는 점을\u003c/span>\u003cspan class=\"en\">is the level of interactivity and engagement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학습자가 콘텐츠와 갖는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">learners \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> with the content.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">연구는 게임을 교육적으로 만드는 것은 학습자가 콘텐츠와 갖는 상호작용성과 참여의 수준임을 보여준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단순한 재미가 아니라 \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 근거로 들어, \u003cb class=\"key\">학습자\u003c/b>가 \u003cb class=\"key\">콘텐츠\u003c/b>와 맺는 상호작용의 깊이가 교육적 효과를 결정한다고 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사\u003c/span> : shows [타동사] + that + S' + V' : \"~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what절(주어)\u003c/span> : what [주어] + makes [동사] + games [목적어] + instructional [목적격 보어] : \"게임을 교육적으로 만드는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : engagement [선행사] + (which/that) + the learners [주어] + have [동사] : \"학습자가 갖는\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Research shows that, 연구는 ~라는 것을 보여준다. what makes games instructional, 게임을 교육적으로 만드는 것은. is the level of interactivity and engagement, 상호작용성과 참여의 수준이라는 점을. the learners have with the content, 학습자가 콘텐츠와 갖는.. 이 문장 전체를 해석하면, 연구는 게임을 교육적으로 만드는 것은 학습자가 콘텐츠와 갖는 상호작용성과 참여의 수준임을 보여준다.","hl":"m"},{"n":37,"text":"연구 결과를 인용해서 주장에 신뢰도를 더하고 있어요. 게임의 교육적 가치는 단순히 화면을 보는 게 아니라 학습자가 콘텐츠와 얼마나 활발하게 상호작용하느냐에 달려 있다는 거죠.","hl":"mn"},{"n":38,"text":"첫 번째로 shows의 목적어 역할을 하는 접속사 that이 쓰였고요. 그 안에서 what이 주어 역할을 하는 명사절을 이끌며 단수 취급되고 있어요. 마지막에 have 뒤에는 목적어가 비어 있어서 목적격 관계대명사가 생략된 상태로 앞의 명사를 꾸며주고 있네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 요인을 고려할 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Given \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">parameters\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학습자가 참여하고 능동적인지를 보장하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">sure\u003c/span> the learners are engaged and active\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 중요하다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">far \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">important\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보장하는 것보다\u003c/span>\u003cspan class=\"en\">than making sure\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 즐거워하는 것을\u003c/span>\u003cspan class=\"en\">they are entertained.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러한 요인을 고려할 때, 그들이 즐거워하는 것을 보장하는 것보다 학습자가 참여하고 능동적인지를 보장하는 것이 훨씬 더 중요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 결론부로, 학습 게임 설계 시 단순한 \u003cb class=\"key\">재미\u003c/b>보다는 학습자의 \u003cb class=\"key\">능동적 \u003c/b>\u003cb class=\"key\">참여\u003c/b>를 이끌어내는 것이 교육적 목적을 달성하는 데 훨씬 핵심적이라는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(관용 표현)\u003c/span> : Given + 명사(구) : \"그러한 요인들을 고려할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : Making [동명사 주어] + is [단수 동사] : \"보장하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 강조\u003c/span> : far + more + 형용사 : \"훨씬 더 중요한\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Given those parameters, 그러한 요인을 고려할 때. making sure the learners are engaged and active, 학습자가 참여하고 능동적인지를 보장하는 것이. is far more important, 훨씬 더 중요하다. than making sure, 보장하는 것보다. they are entertained, 그들이 즐거워하는 것을. 이 문장 전체를 해석하면, 그러한 요인을 고려할 때, 그들이 즐거워하는 것을 보장하는 것보다 학습자가 참여하고 능동적인지를 보장하는 것이 훨씬 더 중요하다.","hl":"m"},{"n":40,"text":"학습 게임을 만들 때 우리가 꼭 잊지 말아야 할 원칙을 정리해주는 문장이에요. 단순히 플레이어를 즐겁게 만드는 오락성보다, 학습자가 얼마나 능동적 참여를 하고 있는지를 챙기는 것이 학습 성과라는 목표 달성에 훨씬 더 결정적이라는 뜻이죠.","hl":"mn"},{"n":41,"text":"먼저 문장 앞머리의 Given은 전치사적 분사구문으로 무엇을 고려하면이라는 뜻으로 쓰였습니다. 주어 자리에 온 making sure는 동명사 주어라 단수 동사인 is로 받아야 하고요. 비교급 more 앞에 쓰인 far는 훨씬이라는 뜻으로 비교급 강조를 하고 있습니다. 마지막으로 than 뒤에도 making sure를 써서 주어와 비교 대상을 똑같은 형태로 맞춘 병렬 구조까지 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>학습 게임은 단순히 즐거움을 주는 도구가 아니라 \u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">만큼 \u003c/b>\u003cb class=\"key\">재미있는\u003c/b> 수준을 유지하며 학습 성과를 내야 합니다.\u003c/li>\u003cli>게임의 성공은 상업적 재미가 아닌 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">성과\u003c/b>의 실제적인 달성 여부로 측정되어야 합니다.\u003c/li>\u003cli>불필요하게 많은 규칙이나 복잡한 역학을 쌓아 올리려는 유혹을 \u003cb class=\"key\">억제\u003c/b>하고 본질에 집중해야 합니다.\u003c/li>\u003cli>교육적 효과를 높이는 핵심은 학습자가 콘텐츠와 맺는 \u003cb class=\"key\">상호작용성\u003c/b>과 능동적인 참여에 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Learning games must focus on interactivity and engagement to achieve educational outcomes rather than overemphasizing pure entertainment.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">학습 게임은 단순히 즐거움을 주는 \u003cb class=\"key\">오락\u003c/b>보다는 학습자가 콘텐츠와 \u003cb class=\"key\">상호작용성\u003c/b>을 갖고 \u003cb class=\"key\">참여\u003c/b>하게 함으로써 \u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">성과\u003c/b>를 달성하는 데 집중해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"자, 오늘 학습 게임의 본질에 대해 배워봤는데 어떠셨나요? 핵심은 단순한 재미를 넘어선 학습 성과와 능동적인 참여라는 점, 잊지 마세요. 오늘 배운 상호작용성과 학습 성과라는 키워드를 중심으로 지문을 다시 한번 읽어보시기 바랍니다. 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
