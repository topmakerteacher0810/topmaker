@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 9월 고1 모의고사 26번","audioDir":"2026-09-g1-26_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">26번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 9월 고1 모의고사\u003c/div>\u003ch1>Paul Farmer: A Lifelong Advocate for Global Health Justice\u003c/h1>\u003ch2>폴 파머: 세계 보건 정의를 위한 평생의 옹호자\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">의학 \u003c/b>\u003cb class=\"key\">인류학자\u003c/b>이자 의사인 Paul Farmer의 일생을 통해, 그가 아이티와 같은 소외된 지역에서 \u003cb class=\"key\">공중 \u003c/b>\u003cb class=\"key\">보건\u003c/b> 개선과 빈민 구호를 위해 헌신한 과정과 업적을 다루고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Paul Farmer dedicated his career to bridging the gap in medical treatment and social inequality for the poor through lifelong humanitarian efforts and expertise.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 세계적인 보건 영웅, Paul Farmer의 삶을 다룬 지문을 함께 공부해보겠습니다. 이 글은 그가 어떻게 의학 인류학자로서 소외된 이들을 위해 헌신했는지 그 여정을 보여줍니다. 한 인물의 일생을 통해 진정한 인류애와 실천의 가치를 배워보는 시간을 가져볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">Paul Farmer는 의학 지식과 인류학적 통찰을 결합한 \u003cb class=\"key\">의학 \u003c/b>\u003cb class=\"key\">인류학\u003c/b>(Medical Anthropology)의 선구자입니다. 그는 질병이 단순히 세균 때문이 아니라 가난과 같은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">구조\u003c/b> 때문에 발생한다고 믿었습니다. 그의 활동 무대였던 \u003cb class=\"key\">아이티\u003c/b>(Haiti)는 세계에서 가장 가난한 나라 중 하나로, 그는 이곳에서 직접 환자를 돌보며 병원을 세웠습니다. 마치 \u003cb class=\"key\">꺼지지 \u003c/b>\u003cb class=\"key\">않는 \u003c/b>\u003cb class=\"key\">횃불\u003c/b>처럼 그는 전 세계의 의료 불균형을 해소하기 위해 평생을 바쳤으며, 그가 설립한 \u003cb class=\"key\">Partners \u003c/b>\u003cb class=\"key\">In \u003c/b>\u003cb class=\"key\">Health\u003c/b>는 지금도 전 세계 소외된 곳에서 의료 시스템을 구축하고 있습니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 의학 인류학이라는 용어를 알아두면 좋아요. 이것은 단순히 질병을 치료하는 것을 넘어, 사회적이고 문화적인 배경이 건강에 어떤 영향을 주는지 연구하는 학문입니다. Paul Farmer는 가난이 질병의 가장 큰 원인이라고 생각했고, 이를 해결하기 위해 아이티 같은 곳에서 직접 발로 뛰었습니다. 마치 나이팅게일의 현대판 의사 버전이라고 생각하면 이해가 쉽겠네요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>출생과 초기 배경\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>미국 \u003cb class=\"key\">의학 \u003c/b>\u003cb class=\"key\">인류학자\u003c/b>이자 의사인 Paul Farmer의 출생과 성장을 소개합니다. 그는 어린 시절부터 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">불평등\u003c/b>에 대한 깊은 인식을 가지고 자라났습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>학문적 기초와 아이티 입문\u003csmall>전개 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>대학 시절 프랑스어에 \u003cb class=\"key\">유창함\u003c/b>을 갖추어 아이티 활동의 기반을 닦았으며, 졸업 후에는 아이티에서 \u003cb class=\"key\">자원봉사\u003c/b>를 시작했습니다. 이후 Harvard University에서 석사와 박사 학위를 모두 취득하며 전문성을 쌓았습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>실질적 공헌과 학술 활동\u003csmall>주장 및 근거 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>비영리 단체인 \u003cb class=\"key\">Partners \u003c/b>\u003cb class=\"key\">In \u003c/b>\u003cb class=\"key\">Health\u003c/b>를 공동 설립하여 아이티, 르완다 등에서 보건 체계를 강화했습니다. 또한 수많은 책과 논문을 통해 \u003cb class=\"key\">학술적\u003c/b>으로도 큰 기여를 남겼습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>영예로운 유산\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>생전의 많은 수상과 함께, 사후에는 빈민의 건강 개선을 위한 공로로 \u003cb class=\"key\">WHO \u003c/b>\u003cb class=\"key\">공로상\u003c/b>을 수상하며 그의 \u003cb class=\"key\">평생의 \u003c/b>\u003cb class=\"key\">과업\u003c/b>이 인정받았습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 Paul Farmer가 태어난 순간부터 세상을 떠난 뒤에 받은 영예까지를 시간의 흐름에 따라 보여주고 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 그가 Massachusetts에서 태어나 어린 시절부터 사회적 불평등에 대해 관심을 가졌다는 배경을 설명합니다. 그는 일찍부터 어려운 이웃들의 삶에 눈을 떴던 것이죠.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장에서는 그의 학업 과정을 다룹니다. Duke University 시절 익힌 유창한 French 실력이 나중에 Haiti 활동에 큰 도움이 되었고, Harvard University에서 석사와 박사 학위를 모두 취득하며 실력을 쌓았습니다.","hl":"f1"},{"n":6,"text":"여섯 번째와 일곱 번째 문장은 그의 핵심 업적입니다. Partners In Health라는 단체를 만들어 공중 보건 체계를 세우는 데 앞장섰고, 백 편이 넘는 논문을 써서 학문적으로도 기여했다는 내용입니다.","hl":"f2"},{"n":7,"text":"마지막 여덟 번째 문장에서는 그의 죽음 이후의 소식을 전합니다. 평생 가난한 이들을 위해 헌신한 공로로 WHO로부터 아주 영예로운 상을 받았다는 소식으로 글이 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 한 인물의 일대기를 출생부터 사후의 영예까지 \u003cb class=\"key\">연대기적 \u003c/b>\u003cb class=\"key\">순서\u003c/b>로 기술하고 있습니다. Paul Farmer의 교육 과정, 봉사 활동, 단체 설립, 학술적 성취가 차례대로 나열됩니다. 마지막 여덟 번째 문장에서 그의 평생의 과업을 기리는 \u003cb class=\"key\">WHO \u003c/b>\u003cb class=\"key\">수상\u003c/b> 소식을 언급하며 전체 생애의 가치를 강조하는 \u003cb class=\"key\">미괄식\u003c/b> 구조를 취합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In 1959 (2)\u003c/b>\u003cspan>시간적 기점\u003c/span>\u003cb>During his time at Duke University (3)\u003c/b>\u003cspan>성장 단계 전환\u003c/span>\u003cb>After graduating (4)\u003c/b>\u003cspan>활동 시작점\u003c/span>\u003cb>Later (5)\u003c/b>\u003cspan>추가적 학업\u003c/span>\u003cb>In 1987 (6)\u003c/b>\u003cspan>주요 업적 발생\u003c/span>\u003cb>Throughout his life (7)\u003c/b>\u003cspan>평생의 요약\u003c/span>\u003cb>After his death (8)\u003c/b>\u003cspan>최종적 평가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Paul Farmer\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">American medical anthropologist and physician\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">He\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">co-founded Partners In Health\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">WHO Director-General's Global Health Leaders Award recipient\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 전형적인 시간순 구성입니다. 인물의 탄생, 교육, 활동, 그리고 사후의 평가까지 순차적으로 나열하고 있어요. 마지막 문장에서 그의 전 생애를 아우르는 최종적인 수상을 언급하며 주제를 완성하는 미괄식 구조를 보입니다.","hl":"ty"},{"n":9,"text":"글의 흐름을 잡아주는 신호어들에 주목해 보세요. In 1959, After graduating, In 1987처럼 특정한 시점을 나타내는 표현들이 단계별로 등장하죠. 또한 Paul Farmer라는 이름이 He라는 대명사로 계속 이어지며 응집성을 높이고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>anthropologist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인류학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>physician\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의사(내과)\u003c/span>\u003c/div>\u003cdiv>\u003cb>awareness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인식, 의식\u003c/span>\u003c/div>\u003cdiv>\u003cb>inequality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불평등\u003c/span>\u003c/div>\u003cdiv>\u003cb>fluent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유창한\u003c/span>\u003c/div>\u003cdiv>\u003cb>benefit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도움이 되다, 이익을 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>volunteer work\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자원봉사 활동\u003c/span>\u003c/div>\u003cdiv>\u003cb>graduate from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 졸업하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>earn\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(학위 등을) 취득하다, 얻다\u003c/span>\u003c/div>\u003cdiv>\u003cb>master's degree\u003c/b>\u003cem>명사\u003c/em>\u003cspan>석사 학위\u003c/span>\u003c/div>\u003cdiv>\u003cb>PhD\u003c/b>\u003cem>명사\u003c/em>\u003cspan>박사 학위\u003c/span>\u003c/div>\u003cdiv>\u003cb>co-founded\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공동 설립했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>organization\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단체, 조직\u003c/span>\u003c/div>\u003cdiv>\u003cb>strengthen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>public health\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공중 보건\u003c/span>\u003c/div>\u003cdiv>\u003cb>throughout\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 동안 내내\u003c/span>\u003c/div>\u003cdiv>\u003cb>academic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>학술적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>paper\u003c/b>\u003cem>명사\u003c/em>\u003cspan>논문, 서류\u003c/span>\u003c/div>\u003cdiv>\u003cb>career\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경력, 이력\u003c/span>\u003c/div>\u003cdiv>\u003cb>honored\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영예를 얻다, 기리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lifelong\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>평생의\u003c/span>\u003c/div>\u003cdiv>\u003cb>improve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>개선하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 중요한 단어는 fluent입니다. 유창하다는 뜻인데 외국어 실력이 그의 활동에 Benefit을 주었다고 설명하죠. 또한 Strengthen이라는 단어는 보건 체계를 강화하다라는 맥락으로 쓰였으니 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">inequality\u003c/b>\u003cspan class=\"m\">불평등\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disparity\u003c/span>\u003cspan class=\"s\">imbalance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">equality\u003c/span>\u003cspan class=\"a\">fairness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fluent\u003c/b>\u003cspan class=\"m\">유창한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eloquent\u003c/span>\u003cspan class=\"s\">articulate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hesitant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">strengthen\u003c/b>\u003cspan class=\"m\">강화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reinforce\u003c/span>\u003cspan class=\"s\">fortify\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weaken\u003c/span>\u003cspan class=\"a\">undermine\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">improve\u003c/b>\u003cspan class=\"m\">개선하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"s\">better\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">deteriorate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">benefit\u003c/b>\u003cspan class=\"m\">도움이 되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">aid\u003c/span>\u003cspan class=\"s\">assist\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 체크해볼까요? Inequality는 Disparity와 같은 의미로 불평등을 뜻합니다. Strengthen은 Reinforce로 바꿔 쓸 수 있고, Improve는 Enhance와 같은 단어로 개선하다라는 뜻을 나타내죠. 반의어로 Inequality와 반대되는 Equality도 함께 알아둡시다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Paul Farmer는 이었다\u003c/span>\u003cspan class=\"en\">Paul Farmer was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국의 의학 인류학자이자\u003c/span>\u003cspan class=\"en\">an American \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">medical \u003c/span>\u003cspan class=\"tgt\">anthropologist \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사였다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">physician\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Paul Farmer는 미국의 의학 인류학자이자 의사였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지문의 주인공인 Paul Farmer를 소개하며 그의 직업적 \u003cb class=\"key\">정체성\u003c/b>을 정의하는 \u003cb class=\"key\">도입부\u003c/b> 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사의 병렬 구조\u003c/span> : [명사 1] + and + [명사 2] : \"의학 인류학자이자 의사\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Paul Farmer was, Paul Farmer는 이었다. an American medical anthropologist, 미국의 의학 인류학자이자. and physician, 의사였다.. 이 문장 전체를 해석하면, Paul Farmer는 미국의 의학 인류학자이자 의사였다.","hl":"m"},{"n":13,"text":"이 글의 주인공인 Paul Farmer가 어떤 일을 하는 사람인지 설명하며 시작하는 도입부예요. 그의 전문적인 정체성을 두 가지 직업으로 보여주고 있죠.","hl":"mn"},{"n":14,"text":"첫 번째 문장에서는 was라는 동사 뒤에 두 개의 명사가 and로 연결된 구조를 봐주세요. medical anthropologist와 physician이 병렬을 이루어 Paul Farmer가 어떤 사람인지를 설명하는 보어 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 태어났으며\u003c/span>\u003cspan class=\"en\">He was born\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1959년에 매사추세츠에서\u003c/span>\u003cspan class=\"en\">in 1959 in Massachusetts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">성장했다\u003c/span>\u003cspan class=\"en\">and grew up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이른 인식을 갖고\u003c/span>\u003cspan class=\"en\">with an early awareness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적 불평등에 대한.\u003c/span>\u003cspan class=\"en\">of social inequality.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 1959년에 매사추세츠에서 태어났으며, 사회적 불평등에 대한 이른 인식을 갖고 성장했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그의 \u003cb class=\"key\">성장 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 설명하며, 어린 시절부터 가졌던 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">문제\u003c/b>에 대한 인식이 그의 삶의 방향을 결정했음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 시제 일치 및 병렬 구조\u003c/span> : [He (주어)] + [was (동사 1)] ... + and + [grew up (동사 2)] : \"태어났으며 ... 성장했다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"He was born, 그는 태어났으며. in 1959 in Massachusetts, 1959년에 매사추세츠에서. and grew up, 성장했다. with an early awareness, 이른 인식을 갖고. of social inequality, 사회적 불평등에 대한.. 이 문장 전체를 해석하면, 그는 1959년에 매사추세츠에서 태어났으며, 사회적 불평등에 대한 이른 인식을 갖고 성장했다.","hl":"m"},{"n":16,"text":"그가 어떤 환경에서 자랐는지 보여주는 대목이에요. 특히 어린 시절부터 사회적 불평등을 깊이 인식하며 성장했다는 점이 그의 인생 경로에 큰 영향을 주었음을 알 수 있어요.","hl":"mn"},{"n":17,"text":"두 번째 문장에서는 주어 He 뒤에 나오는 두 동사의 모양을 확인하세요. 수동태인 was born과 능동태인 grew up이 and를 사이에 두고 과거 시제로 나란히 연결되어 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Duke University에 다니는 동안\u003c/span>\u003cspan class=\"en\">During his time at Duke University,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 파리에 살았고\u003c/span>\u003cspan class=\"en\">he lived in Paris\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반년 간\u003c/span>\u003cspan class=\"en\">for half a year\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스어에 유창해졌는데\u003c/span>\u003cspan class=\"en\">and became fluent in French,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 그에게 도움이 되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">benefited \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훗날 아이티에서의 활동에.\u003c/span>\u003cspan class=\"en\">in his future work in Haiti.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Duke University에 다니는 동안 그는 반년 간 파리에 살았고 프랑스어에 유창해졌는데, 이는 그의 훗날 아이티에서의 활동에 도움이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대학 시절 습득한 \u003cb class=\"key\">외국어 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이 미래에 그가 \u003cb class=\"key\">아이티\u003c/b>에서 헌신적인 활동을 하는 데 중요한 자산이 되었음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : [앞 문장 내용] + , (콤마) + which [주격 관계대명사] : \"그런데 그것은 그에게 도움이 되었다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"During his time at Duke University, Duke University에 다니는 동안. he lived in Paris, 그는 파리에 살았고. for half a year, 반년 간. and became fluent in French, 프랑스어에 유창해졌는데. which benefited him, 이는 그에게 도움이 되었다. in his future work in Haiti, 훗날 아이티에서의 활동에.. 이 문장 전체를 해석하면, Duke University에 다니는 동안 그는 반년 간 파리에 살았고 프랑스어에 유창해졌는데, 이는 그의 훗날 아이티에서의 활동에 도움이 되었다.","hl":"m"},{"n":19,"text":"파리에서의 생활과 프랑스어 습득이 단순한 경험으로 끝나지 않고, 나중에 그가 아이티에서 인도주의적 활동을 할 때 아주 중요한 도구가 되었다는 내용이에요.","hl":"mn"},{"n":20,"text":"세 번째 문장에서 가장 중요한 포인트는 콤마 뒤에 나온 which입니다. 관계대명사의 계속적 용법으로 쓰여서, 그가 프랑스어에 유창해졌다는 앞의 사실 전체를 가리킵니다. and it으로 바꿔 이해하면 아주 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Duke University 졸업 후, \u003c/span>\u003cspan class=\"en\">After \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">graduating \u003c/span>\u003cspan class=\"tgt\">from\u003c/span> Duke University,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 시작했다 \u003c/span>\u003cspan class=\"en\">he began\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자원봉사 활동을 \u003c/span>\u003cspan class=\"en\">volunteer work\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이티 Cangé에 있는 병원에서.\u003c/span>\u003cspan class=\"en\">at a hospital in Cangé, Haiti.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Duke University 졸업 후, 그는 아이티 Cangé에 있는 병원에서 자원봉사 활동을 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대학 졸업 후 Paul Farmer가 본격적으로 아이티와 인연을 맺고 \u003cb class=\"key\">현장 \u003c/b>\u003cb class=\"key\">활동\u003c/b>을 시작했음을 나타냅니다. 장차 그가 펼칠 \u003cb class=\"key\">의료 \u003c/b>\u003cb class=\"key\">봉사\u003c/b>의 출발점을 보여주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 뒤의 동명사\u003c/span> : After [전치사] + graduating [동명사] : \"졸업한 후에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"After graduating from Duke University, Duke University 졸업 후. he began, 그는 시작했다. volunteer work, 자원봉사 활동을. at a hospital in Cangé, Haiti, 아이티 Cangé에 있는 병원에서.. 이 문장 전체를 해석하면, Duke University 졸업 후, 그는 아이티 Cangé에 있는 병원에서 자원봉사 활동을 시작했다.","hl":"m"},{"n":22,"text":"이 문장은 주인공이 대학 교육을 마친 직후에 어떤 행동을 했는지 보여줍니다. 아이티라는 장소는 그의 인생에서 가장 중요한 무대가 되는 곳으로, 자원봉사 활동이 그 시작이었음을 알 수 있죠.","hl":"mn"},{"n":23,"text":"첫 번째 포인트로 After라는 전치사 뒤에 graduating이라는 동명사가 쓰인 것을 보세요. 전치사의 목적어 자리에는 동사가 올 때 반드시 동명사 형태로 써야 합니다. 졸업하다라는 뜻의 graduate 뒤에는 어디를 졸업했는지 나타내는 전치사 from이 꼭 필요하다는 점도 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 이후 돌아갔고 \u003c/span>\u003cspan class=\"en\">He later returned\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국으로 \u003c/span>\u003cspan class=\"en\">to the United States\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">취득했다 \u003c/span>\u003cspan class=\"en\">and earned\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">석사 학위와 박사 학위 둘 다를 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">master's \u003c/span>\u003cspan class=\"tgt\">degree \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">PhD\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의학 인류학의 \u003c/span>\u003cspan class=\"en\">in medical anthropology\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Harvard University에서.\u003c/span>\u003cspan class=\"en\">at Harvard University.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 이후 미국으로 돌아갔고, Harvard University에서 의학 인류학의 석사 학위와 박사 학위 둘 다를 취득했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실무 경험 후 다시 미국으로 돌아와 \u003cb class=\"key\">학문적 \u003c/b>\u003cb class=\"key\">전문성\u003c/b>을 쌓는 과정입니다. \u003cb class=\"key\">석사와 \u003c/b>\u003cb class=\"key\">박사\u003c/b> 학위를 모두 취득하며 의학 인류학자로서의 기틀을 다졌음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 both A and B\u003c/span> : both [A] and [B] : \"석사 학위와 박사 학위 둘 다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">과거동사의 병렬 구조\u003c/span> : returned [동사1] + and [접속사] + earned [동사2] : \"돌아갔고 그리고 취득했다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"He later returned, 그는 이후 돌아갔고. to the United States, 미국으로. and earned, 취득했다. both a master's degree and a PhD, 석사 학위와 박사 학위 둘 다를. in medical anthropology, 의학 인류학의. at Harvard University, Harvard University에서.. 이 문장 전체를 해석하면, 그는 이후 미국으로 돌아갔고, Harvard University에서 의학 인류학의 석사 학위와 박사 학위 둘 다를 취득했다.","hl":"m"},{"n":25,"text":"아이티에서의 경험을 뒤로하고 다시 미국으로 돌아와 공부에 매진하는 장면입니다. 하버드라는 최고의 교육 기관에서 두 가지 높은 학위를 모두 따내며 전문가로서의 실력을 갖추게 됩니다.","hl":"mn"},{"n":26,"text":"첫 번째로, returned와 earned라는 두 과거 동사가 and로 연결된 병렬 구조를 확인하세요. 주어인 그가 한 두 가지 동작을 순서대로 나열한 것입니다. 두 번째로, both A and B 구문이 쓰여서 석사 학위와 박사 학위 두 가지 모두를 취득했다는 점을 강조하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 and + strengthen (원형2)] : \"제공하고 강화하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"In 1987, 1987년에. he co-founded Partners In Health, 그는 Partners In Health를 공동 설립했다. an organization, 단개인. that works in countries like Haiti, Rwanda, and Peru, 아이티, 르완다, 그리고 페루와 같은 국가에서 일하는. to provide medical treatment, 의학적 치료를 제공하고. and strengthen public health systems, 공중 보건 체계를 강화하기 위해.. 이 문장 전체를 해석하면, 1987년에 그는 의학적 치료를 제공하고 공중 보건 체계를 강화하기 위해 아이티, 르완다, 그리고 페루와 같은 국가에서 일하는 단체인 Partners In Health를 공동 설립했다.","hl":"m"},{"n":28,"text":"이 문장은 그가 설립한 단체가 구체적으로 어떤 일을 하는지 아주 잘 보여주고 있어요. 가난한 나라들을 돕기 위해 치료뿐만 아니라 시스템 자체를 튼튼하게 만들려는 그의 철학이 담긴 핵심 문장입니다.","hl":"mn"},{"n":29,"text":"첫 번째로, an organization 뒤의 that을 주목하세요. 이 단체가 무엇인지 설명해 주는 주격 관계대명사입니다. 선행사가 단수라서 works에 s가 붙은 것도 꼭 챙기세요. 두 번째로, 뒤쪽의 to provide와 and 뒤의 strengthen은 모두 하기 위해서라는 목적을 나타내는 병렬 구조입니다. strengthen 앞에 to가 생략되었다고 생각하면 쉽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 생애 동안,\u003c/span>\u003cspan class=\"en\">Throughout his life,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 저술했다\u003c/span>\u003cspan class=\"en\">he wrote\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">10권이 넘는 책과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than\u003c/span> ten books\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">100편이 넘는 학술 논문을.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">over\u003c/span> a hundred academic papers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 생애 동안 그는 10권이 넘는 책과 100편이 넘는 학술 논문을 저술했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의사로서의 활동뿐만 아니라 \u003cb class=\"key\">학술적 \u003c/b>\u003cb class=\"key\">기여\u003c/b>도 매우 활발했음을 강조합니다. 책과 논문을 통해 자신의 \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">성과\u003c/b>와 신념을 널리 알렸음을 알 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수치 비교 표현\u003c/span> : more than + [수치/명사] : \"~보다 많은, ~이 넘는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사(수치 초과)\u003c/span> : over + [수치/명사] : \"~이 넘는, ~ 이상의\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Throughout his life, 그의 생애 동안. he wrote, 그는 저술했다. more than ten books, 10권이 넘는 책과. and over a hundred academic papers, 100편이 넘는 학술 논문을.. 이 문장 전체를 해석하면, 그의 생애 동안 그는 10권이 넘는 책과 100편이 넘는 학술 논문을 저술했다.","hl":"m"},{"n":31,"text":"Paul Farmer가 단순히 현장에서 환자만 돌본 것이 아니라, 책과 논문을 써서 학술적 기여도 엄청나게 했다는 걸 보여줍니다. 그의 방대한 연구 성과가 이 문장에 잘 드러나 있죠.","hl":"mn"},{"n":32,"text":"첫 번째로 more than은 수치 앞에 쓰여서 무엇 무엇이 넘는다는 뜻을 나타냅니다. 두 번째로 나오는 over 역시 같은 의미로 쓰여서 백 편 이상의 논문을 썼음을 강조하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 많은 주요 상을 받았고,\u003c/span>\u003cspan class=\"en\">He received many major awards\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 경력 동안,\u003c/span>\u003cspan class=\"en\">during his career,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사망 후에,\u003c/span>\u003cspan class=\"en\">and after his death,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 또한 수상했다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">honored \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">WHO Director-General's Global Health Leaders Award를\u003c/span>\u003cspan class=\"en\">the WHO Director-General's Global Health Leaders Award\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 평생의 과업으로\u003c/span>\u003cspan class=\"en\">for his lifelong work\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가난한 사람들의 건강을 개선하기 위한.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">improve\u003c/span> health for the poor.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 경력 동안 많은 주요 상을 받았고, 사망 후에 그는 또한 가난한 사람들의 건강을 개선하기 위한 평생의 과업으로 WHO Director­General’s Global Health Leaders Award를 수상했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그의 헌신이 세계적으로 높게 평가받았음을 보여줍니다. 특히 \u003cb class=\"key\">사후 \u003c/b>\u003cb class=\"key\">수상\u003c/b> 내역은 \u003cb class=\"key\">취약 \u003c/b>\u003cb class=\"key\">계층\u003c/b>을 위해 바친 그의 일생이 얼마나 가치 있었는지를 증명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(수여/상)\u003c/span> : be [be동사] + honored [과거분사] + with [수단/원인] : \"~를 수상하다, ~로 영예를 얻다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : work [명사] + to improve [to부정사] : \"개선하기 위한\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"He received many major awards, 그는 많은 주요 상을 받았고. during his career, 그의 경력 동안. and after his death, 사망 후에. he was also honored with, 그는 또한 수상했다. the WHO Director-General's Global Health Leaders Award, WHO Director-General's Global Health Leaders Award를. for his lifelong work, 그의 평생의 과업으로. to improve health for the poor, 가난한 사람들의 건강을 개선하기 위한.. 이 문장 전체를 해석하면, 그의 경력 동안 많은 주요 상을 받았고, 사망 후에 그는 또한 가난한 사람들의 건강을 개선하기 위한 평생의 과업으로 WHO Director­General’s Global Health Leaders Award를 수상했다.","hl":"m"},{"n":34,"text":"그가 살아있을 때뿐만 아니라 죽은 뒤에도 세계적인 상을 받았다는 것은 그의 헌신이 정말 대단했다는 걸 보여줍니다. 가난한 사람들을 돕기 위해 바친 그의 평생의 과업이 인정받은 것이죠.","hl":"mn"},{"n":35,"text":"첫 번째로 was also honored with는 수동태 문장으로 그가 상을 받는 영광을 누렸다는 의미를 전달합니다. 두 번째로 to improve는 앞에 있는 명사 work를 꾸며주는 형용사적 용법으로 쓰여서 어떤 일인지를 구체적으로 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Paul Farmer는 미국의 \u003cb class=\"key\">의학 \u003c/b>\u003cb class=\"key\">인류학자\u003c/b>이자 의사로, \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">불평등\u003c/b>을 해결하기 위해 평생을 바쳤습니다.\u003c/li>\u003cli>그는 대학 시절 \u003cb class=\"key\">프랑스어\u003c/b>를 유창하게 익혀 아이티에서의 활동 기반을 마련했으며, 하버드에서 \u003cb class=\"key\">석사 \u003c/b>\u003cb class=\"key\">및 \u003c/b>\u003cb class=\"key\">박사 \u003c/b>\u003cb class=\"key\">학위\u003c/b>를 받았습니다.\u003c/li>\u003cli>1987년에 \u003cb class=\"key\">Partners \u003c/b>\u003cb class=\"key\">In \u003c/b>\u003cb class=\"key\">Health\u003c/b>라는 단체를 설립하여 아이티와 르완다 등에서 \u003cb class=\"key\">공중 \u003c/b>\u003cb class=\"key\">보건 \u003c/b>\u003cb class=\"key\">체계\u003c/b>를 강화하고 의료 지원을 펼쳤습니다.\u003c/li>\u003cli>사후에는 가난한 사람들의 건강을 개선한 공로를 인정받아 \u003cb class=\"key\">WHO \u003c/b>\u003cb class=\"key\">공로상\u003c/b>을 수상하며 그의 업적이 높이 평가받았습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Paul Farmer dedicated his career to bridging the gap in medical treatment and social inequality for the poor through lifelong humanitarian efforts and expertise.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">의학 \u003c/b>\u003cb class=\"key\">인류학자\u003c/b>이자 의사인 Paul Farmer의 일생을 통해, 그가 아이티와 같은 소외된 지역에서 \u003cb class=\"key\">공중 \u003c/b>\u003cb class=\"key\">보건\u003c/b> 개선과 빈민 구호를 위해 헌신한 과정과 업적을 다루고 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Paul Farmer는 의학적 지식을 세상의 불평등을 해소하는 도구로 사용한 멋진 분이었습니다. 여러분도 이 지문을 통해 연대기적 글의 구조를 익히고, 핵심 표현들을 잘 정리하시길 바랍니다. 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
