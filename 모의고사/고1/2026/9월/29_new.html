<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"29번","audioDir":"29_audio","preview":false,"count":41,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">29번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>Energy Systems: The Shift from Anaerobic to Aerobic Respiration\u003c/h1>\u003ch2>에너지 시스템: 무산소에서 유산소 호흡으로의 전환\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리 몸은 산소 유무에 따라 \u003cb class=\"key\">유산소\u003c/b>와 \u003cb class=\"key\">무산소\u003c/b> 두 가지 방식으로 에너지를 만드는데, 운동 초기에 느끼는 고통은 \u003cb class=\"key\">무산소 \u003c/b>\u003cb class=\"key\">과부하\u003c/b> 때문이며 몸이 유산소 시스템으로 \u003cb class=\"key\">전환\u003c/b>되면서 점차 운동이 수월해집니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The initial discomfort of intense exercise is caused by the body's temporary reliance on anaerobic respiration before it transitions to the more efficient aerobic system.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 운동할 때 왜 처음에는 숨이 턱 막히고 힘들다가 시간이 지나면 괜찮아지는지, 그 과학적 이유를 다룬 스물아홉 번째 지문을 함께 공부해보겠습니다. 이 글의 핵심은 우리 몸의 두 가지 에너지 생성 시스템인 유산소와 무산소 호흡의 차이를 이해하는 것입니다. 결국 운동 초기의 고통은 시스템 전환 과정에서 생기는 자연스러운 현상이라는 것이 이 글의 요지입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리 몸이 움직이려면 자동차의 연료처럼 에너지가 필요한데, 이 과정을 \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>(Cellular Respiration)이라고 부릅니다. 세포 호흡은 크게 산소를 사용하는 \u003cb class=\"key\">유산소 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>(Aerobic Respiration)과 산소 없이 포도당을 태우는 \u003cb class=\"key\">무산소 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>(Anaerobic Respiration)으로 나뉩니다. 무산소 호흡은 마치 자동차의 \u003cb class=\"key\">질소 \u003c/b>\u003cb class=\"key\">탱크\u003c/b>처럼 순발력 있게 큰 힘을 내지만, \u003cb class=\"key\">젖산\u003c/b>(Lactic Acid)이라는 찌꺼기를 남겨 근육통과 피로를 유발합니다. 반면 유산소 호흡은 연비가 좋은 엔진처럼 산소를 이용해 효율적으로 에너지를 뽑아내지만, 본격적으로 가동되기까지 시간이 조금 걸립니다. 이 지문은 왜 운동 초반에는 숨이 차고 괴롭다가 시간이 지나면 몸이 가벼워지는지를 이 두 시스템의 원리로 설명합니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 내용에 앞서 배경지식을 좀 쌓아볼까요? 우리 몸은 세포 호흡을 통해 에너지를 만듭니다. 산소를 듬뿍 써서 깨끗하게 에너지를 만드는 유산소 호흡이 있고, 급할 때 산소 없이 포도당만 태워버리는 무산소 호흡이 있죠. 무산소 호흡은 자동차의 터보 기능처럼 순간적인 힘을 내지만, 젖산이라는 피로 물질을 남깁니다. 마치 차가 처음 출발할 때 배터리 힘으로 급가속하다가 나중에 안정적으로 엔진을 돌리는 과정과 아주 비슷하다고 생각하면 쉽습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>호흡과 에너지의 관계\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>운동 수행 능력에 영향을 미치는 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">생성\u003c/b> 방식인 유산소와 무산소 호흡 두 가지 선택지를 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>무산소 호흡의 특징과 한계\u003csmall>근거 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>무산소 호흡은 접근이 \u003cb class=\"key\">빠르고 \u003c/b>\u003cb class=\"key\">쉽지만\u003c/b>, 젖산과 같은 \u003cb class=\"key\">독성 \u003c/b>\u003cb class=\"key\">물질\u003c/b>을 생성하여 신체적 고통과 과부하를 일으킨다는 점을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>운동 단계별 호흡 방식의 전환\u003csmall>결론 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>운동 초기에는 폐가 산소 요구량을 따라잡지 못해 무산소 방식을 쓰다가, 준비가 되면 \u003cb class=\"key\">유산소 \u003c/b>\u003cb class=\"key\">방식\u003c/b>으로 전환되어 운동이 더 \u003cb class=\"key\">쉬워지는\u003c/b> 현상을 해설합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 서론에서 두 호흡 방식을 정의하고, 본론에서 무산소 호흡의 특징을, 결론에서 운동 시의 실제 전환 과정을 보여주는 구조로 짜여 있습니다.","hl":null},{"n":4,"text":"먼저 첫 번째와 두 번째 문장에서는 운동 능력의 핵심인 에너지 생성 방식 두 가지, 즉 유산소 호흡과 무산소 호흡을 소개하며 글을 시작합니다.","hl":"f0"},{"n":5,"text":"3번부터 6번까지는 무산소 호흡을 집중 분석합니다. 포도당을 써서 빠르게 에너지를 내는 장점이 있지만, 젖산이라는 독성 물질 때문에 근육 약화와 어지러움을 유발하는 과부하 상태를 만든다고 경고하죠.","hl":"f1"},{"n":6,"text":"마지막 7번부터 열 번째 문장에서는 실전 운동 상황에 대입합니다. 초반에 괴로운 이유는 폐가 산소 공급을 제때 못 해서 무산소 시스템을 쓰기 때문이고, 몸이 풀리면 유산소로 전환되면서 훨씬 편해진다는 결론을 내립니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 서두에서 호흡과 에너지 생성의 관계라는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>를 던진 후, 무산소와 유산소 호흡을 \u003cb class=\"key\">대조\u003c/b>하며 운동 상황에 적용하고 있습니다. 무산소 호흡의 \u003cb class=\"key\">부작용\u003c/b>과 유산소 호흡으로의 \u003cb class=\"key\">전환\u003c/b>이라는 인과 관계를 통해 주제를 강화합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>There are two options (2)\u003c/b>\u003cspan>분류 및 대조 시작\u003c/span>\u003cb>But (5)\u003c/b>\u003cspan>무산소 호흡의 역접적 단점 제시\u003c/span>\u003cb>This process explains why (7)\u003c/b>\u003cspan>현상에 대한 인과적 설명\u003c/span>\u003cb>This also explains why (9)\u003c/b>\u003cspan>추가적인 인과적 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">energy from air and food\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">aerobic respiration\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">anaerobic respiration\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">backup system\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">turbo boost\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">anaerobic overload\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Anaerobic Respiration (무산소)\u003c/th>\u003cth>Aerobic Respiration (유산소)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Glucose only, no oxygen required\u003c/td>\u003ctd>Oxygen required, from air\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Quicker and easier to access (turbo boost)\u003c/td>\u003ctd>Efficient but takes time to start\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Toxic, creates lactic acid, overload\u003c/td>\u003ctd>Sustainable, feels easier once warmed up\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 지문은 유산소와 무산소라는 두 개념을 대조하는 비교 대조 방식을 취하고 있습니다. 글의 앞부분에 주제를 던지고 뒤에서 구체적인 이유와 사례를 드는 전형적인 두괄식 구조라고 볼 수 있습니다.","hl":"ty"},{"n":8,"text":"두 가지 옵션이 있다는 표현으로 대조를 예고하고, 중간에 하지만이라는 역접어를 써서 무산소 호흡의 단점을 부각합니다. 그리고 이 과정이 왜 그런지를 설명한다는 표현을 반복하며 인과 관계를 명확히 보여줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>performance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수행 능력, 성과\u003c/span>\u003c/div>\u003cdiv>\u003cb>aerobic respiration\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>유산소 호흡\u003c/span>\u003c/div>\u003cdiv>\u003cb>anaerobic respiration\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>무산소 호흡\u003c/span>\u003c/div>\u003cdiv>\u003cb>glucose\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포도당\u003c/span>\u003c/div>\u003cdiv>\u003cb>access\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이용하다, 접근하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>backup system\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예비 시스템\u003c/span>\u003c/div>\u003cdiv>\u003cb>turbo boost\u003c/b>\u003cem>명사\u003c/em>\u003cspan>터보 부스트, 급속 출력\u003c/span>\u003c/div>\u003cdiv>\u003cb>inefficient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비효율적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>toxic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>독성의\u003c/span>\u003c/div>\u003cdiv>\u003cb>lactic acid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>젖산\u003c/span>\u003c/div>\u003cdiv>\u003cb>sickness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>메스꺼움, 어지러움\u003c/span>\u003c/div>\u003cdiv>\u003cb>weakness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무력감, 약화\u003c/span>\u003c/div>\u003cdiv>\u003cb>sweating\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발한, 땀 흘림\u003c/span>\u003c/div>\u003cdiv>\u003cb>push hard\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>강하게 밀어붙이다, 혹사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>overload\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과부하\u003c/span>\u003c/div>\u003cdiv>\u003cb>intense\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>강렬한, 격렬한\u003c/span>\u003c/div>\u003cdiv>\u003cb>workout\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운동\u003c/span>\u003c/div>\u003cdiv>\u003cb>miserable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비참한, 매우 고통스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>respiratory system\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>호흡기계\u003c/span>\u003c/div>\u003cdiv>\u003cb>catch up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>따라잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>supply\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공급하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>warm up\u003c/b>\u003cem>동사\u003c/em>\u003cspan>준비 운동을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>switch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전환하다, 바꾸다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"여기서 중요한 단어는 젖산이라는 뜻의 lactic acid와 비효율적이라는 inefficient, 그리고 전환하다라는 의미의 switch입니다. 특히 switch는 에너지 시스템의 변화를 나타내는 핵심 동사니까 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">inefficient\u003c/b>\u003cspan class=\"m\">비효율적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wasteful\u003c/span>\u003cspan class=\"s\">unproductive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">efficient\u003c/span>\u003cspan class=\"a\">productive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">toxic\u003c/b>\u003cspan class=\"m\">독성의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">poisonous\u003c/span>\u003cspan class=\"s\">harmful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harmless\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">intense\u003c/b>\u003cspan class=\"m\">강렬한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">extreme\u003c/span>\u003cspan class=\"s\">vigorous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\"> s=\"en\">how the body makes energy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공기와 음식으로부터\u003c/span>\u003cspan class=\"en\">from air and food.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">호흡이 운동 능력에 어떻게 영향을 미치는지 이해하기 위해, 우리는 먼저 신체가 공기와 음식으로부터 어떻게 에너지를 만드는지 이해할 필요가 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 호흡과 운동 능력의 상관관계를 설명하기에 앞서, 신체의 근본적인 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">생성\u003c/b> 원리를 먼저 파악해야 함을 시사하는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">문장\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : To + [동사원형(understand)] : \"이해하기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (명사절)\u003c/span> : [의문사(how)] + [주어(breathing)] + [동사(affects)] : \"호흡이 어떻게 운동 능력에 영향을 미치는지\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"To understand, 이해하기 위해서. how breathing affects athletic performance, 호흡이 어떻게 운동 능력에 영향을 미치는지. we first need to understand, 우리는 먼저 이해할 필요가 있습니다. how the body makes energy, 신체가 어떻게 에너지를 만드는지. from air and food, 공기와 음식으로부터. 이 문장 전체를 해석하면, 호흡이 운동 능력에 어떻게 영향을 미치는지 이해하기 위해, 우리는 먼저 신체가 공기와 음식으로부터 어떻게 에너지를 만드는지 이해할 필요가 있습니다.","hl":"m"},{"n":12,"text":"이 글의 시작입니다. 운동을 잘하려면 호흡이 중요한데, 그 원리를 알려면 우리 몸이 공기와 음식으로 에너지 생성 과정을 먼저 알아야 한다는 뜻이죠.","hl":"mn"},{"n":13,"text":"첫 번째로 문장 맨 앞의 To understand는 목적을 나타내는 부사적 용법의 to부정사입니다. 두 번째로 how breathing affects 부분은 의문사 주어 동사 순서로 쓰인 간접의문문으로 understand의 목적어 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 가지 선택권(방식)이 있습니다\u003c/span>\u003cspan class=\"en\">There are two options:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산소를 이용하는 것\u003c/span>\u003cspan class=\"en\">with oxygen,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유산소 호흡이라고 알려진 과정인\u003c/span>\u003cspan class=\"en\">a process \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">known \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> aerobic respiration,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것(산소) 없이 하는 것\u003c/span>\u003cspan class=\"en\">and without it,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 무산소 호흡이라 불립니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">called\u003c/span> anaerobic respiration.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">두 가지 방식이 있는데, 산소를 이용하는 유산소 호흡이라고 알려진 과정과, 그것(산소)이 없는 방식인 무산소 호흡이라 불리는 과정입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 에너지를 만드는 두 가지 핵심 방식인 \u003cb class=\"key\">유산소 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>과 \u003cb class=\"key\">무산소 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>을 정의하고 분류합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구 (후치수식)\u003c/span> : [명사(a process)] + [과거분사(known)] + [as (~로서)] : \"~라고 알려진 과정\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : [, (콤마)] + [관계대명사(which)] + [동사(is called)] : \"그런데 그것은 ~라고 불린다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"There are two options, 두 가지 선택권(방식)이 있습니다. with oxygen, 산소를 이용하는 것. a process known as aerobic respiration, 유산소 호흡이라고 알려진 과정인. and without it, 그리고 그것(산소) 없이 하는 것. which is called anaerobic respiration, 그것은 무산소 호흡이라 불립니다. 이 문장 전체를 해석하면, 두 가지 방식이 있는데, 산소를 이용하는 유산소 호흡이라고 알려진 과정과, 그것(산소)이 없는 방식인 무산소 호흡이라 불리는 과정입니다.","hl":"m"},{"n":15,"text":"우리 몸이 에너지를 뽑아내는 두 가지 옵션을 소개하고 있어요. 산소가 있으면 유산소, 없으면 무산소 호흡이라고 부른다는 정의를 내리고 있습니다.","hl":"mn"},{"n":16,"text":"첫 번째 포인트인 known as는 앞에 있는 명사를 수동으로 꾸며주는 과거분사구입니다. 두 번째 which is called는 콤마 뒤에서 무산소 방식을 보충 설명해주는 관계대명사 계속적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무산소 에너지는 생성됩니다\u003c/span>\u003cspan class=\"en\">Anaerobic energy \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">generated\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포도당(단순당)만으로\u003c/span>\u003cspan class=\"en\">only with glucose (a simple sugar),\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 더 빠르고 더 쉽습니다\u003c/span>\u003cspan class=\"en\">and it's quicker and easier\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 몸이 이용하기에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">bodies \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">access\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무산소 에너지는 포도당(단순당)만으로 생성되며, 우리 몸이 이용하기에 더 빠르고 더 쉽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 무산소 에너지의 주재료인 \u003cb class=\"key\">포도당\u003c/b>을 언급하며, 유산소 에너지보다 \u003cb class=\"key\">속도와 \u003c/b>\u003cb class=\"key\">편의성\u003c/b> 측면에서 장점이 있음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : [be동사(is)] + [과거분사(generated)] : \"생성된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사 03c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">miserable\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 과정은 격렬한 운동의 첫 몇 분이 왜 흔히 그렇게 고통스러운지를 설명해 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 \u003cb class=\"key\">무산소 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>의 독성과 과부하가 운동 초기에 느끼는 신체적 괴로움의 원인이라는 \u003cb class=\"key\">인과관계\u003c/b>를 밝히는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문(명사절)\u003c/span> : explains [타동사] + [why(의문사) + 주어 + 동사(어순)] : \"왜 격렬한 운동의 첫 몇 분이 그렇게 고통스러운지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 보어(형용사)\u003c/span> : are [be동사] + miserable [형용사 보어] : \"비참한, 고통스러운\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"This process explains, 이 과정은 설명합니다. why the first few minutes, 왜 첫 몇 분이. of an intense workout, 격렬한 운동의. are often so miserable, 흔히 그렇게 고통스러운지를.. 이 문장 전체를 해석하면, 이 과정은 격렬한 운동의 첫 몇 분이 왜 흔히 그렇게 고통스러운지를 설명해 줍니다.","hl":"m"},{"n":30,"text":"앞 문장에서 무산소 호흡이 독성이 있고 힘들다고 했죠? 그 무산소 호흡이라는 인과관계 때문에 우리가 운동을 처음 시작할 때 왜 그렇게 힘든지 그 원인을 설명해 주는 문장이에요.","hl":"mn"},{"n":31,"text":"여기서 explains 뒤에 나오는 why절은 목적어 역할을 하는 간접의문문이에요. 의문사 뒤에 주어와 동사가 오는 평서문 어순을 꼭 확인해야 하고요, 마지막에 miserable은 형용사로 쓰여서 주어의 상태를 설명하는 보어 역할을 하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 폐와 호흡계가\u003c/span>\u003cspan class=\"en\">Our lungs and respiratory system\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라잡지 못했고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">haven't \u003c/span>\u003cspan class=\"tgt\">caught \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">산소를 공급할 만큼\u003c/span>\u003cspan class=\"en\">to supply \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">oxygen \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 몸이 필요로 하는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">bodies \u003c/span>\u003cspan class=\"tgt\">need\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 몸은 사용해야 합니다\u003c/span>\u003cspan class=\"en\">and so the body has to use\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무산소 호흡을.\u003c/span>\u003cspan class=\"en\">anaerobic respiration.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 폐와 호흡계가 우리 몸이 필요로 하는 산소를 공급할 만큼 충분히 따라잡지 못했고, 그래서 몸은 무산소 호흡을 사용해야만 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 운동 초기에는 \u003cb class=\"key\">산소 \u003c/b>\u003cb class=\"key\">공급\u003c/b>이 수요를 즉각적으로 충족시키지 못하는 \u003cb class=\"key\">공급 \u003c/b>\u003cb class=\"key\">지연\u003c/b>이 발생하여 무산소 시스템이 가동된다는 구체적인 메커니즘을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료(부정)\u003c/span> : have not + p.p.(past participle) : \"따라잡지 못했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : the oxygen [선행사] + (which/that) + our bodies need [S+V] : \"우리 몸이 필요로 하는 산소\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Our lungs and respiratory system, 우리의 폐와 호흡계가. haven't caught up, 따라잡지 못했고. to supply the oxygen, 산소를 공급할 만큼. our bodies need, 우리 몸이 필요로 하는. and so the body has to use, 그래서 몸은 사용해야 합니다. anaerobic respiration, 무산소 호흡을.. 이 문장 전체를 해석하면, 우리의 폐와 호흡계가 우리 몸이 필요로 하는 산소를 공급할 만큼 충분히 따라잡지 못했고, 그래서 몸은 무산소 호흡을 사용해야만 합니다.","hl":"m"},{"n":33,"text":"운동을 막 시작하면 몸은 산소를 많이 원하는데 폐가 그 속도를 바로 못 따라와요. 산소 공급 지연이 생기니까 몸은 어쩔 수 없이 산소 없이 에너지를 만드는 무산소 호흡을 먼저 쓰는 거죠.","hl":"mn"},{"n":34,"text":"첫 번째 포인트는 현재완료 haven't caught up입니다. 운동 시작 후 지금까지 완료되지 않은 상태를 보여주고요. 두 번째로 oxygen 뒤에는 목적격 관계대명사가 생략되어서 우리 몸이 필요로 하는 산소라는 뜻으로 뒤에서 앞으로 수식해 주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 또한 왜 ~인지 설명해 줍니다,\u003c/span>\u003cspan class=\"en\">This also explains why,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 준비 운동을 마친 후에,\u003c/span>\u003cspan class=\"en\">after we're \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">warmed \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운동이 더 수월하게 느껴지는지를.\u003c/span>\u003cspan class=\"en\">exercise \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">feels \u003c/span>\u003cspan class=\"tgt\">easier\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 또한 왜 우리가 준비 운동을 마친 후에 운동이 더 수월하게 느껴지는지도 설명해 줍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 워밍업을 통해 산소 공급이 원활해지면 무산소에서 \u003cb class=\"key\">유산소 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>으로 전환되므로, 운동이 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">부담\u003c/b>이 적어지는 이유를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(완료적 상태)\u003c/span> : be + warmed up [p.p.] : \"준비 운동이 된, 몸이 풀린\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사 + 형용사 보어\u003c/span> : feel [감각동사] + easier [형용사 비교급/보어] : \"더 쉽게 느껴지다\"\u003c/div>\u003c/div>","segs":[{"n":35,"text":"This also explains why, 이것은 또한 왜 ~인지 설명해 줍니다. after we're warmed up, 우리가 준비 운동을 마친 후에. exercise feels easier, 운동이 더 수월하게 느껴지는지를.. 이 문장 전체를 해석하면, 이것은 또한 왜 우리가 준비 운동을 마친 후에 운동이 더 수월하게 느껴지는지도 설명해 줍니다.","hl":"m"},{"n":36,"text":"준비 운동을 하면 산소 공급 체계가 활성화되거든요. 그러면 무산소 호흡에서 유산소 호흡으로 넘어가니까, 아까 느꼈던 그 괴로운 신체적 부담이 줄어들고 운동이 훨씬 편해지는 겁니다.","hl":"mn"},{"n":37,"text":"warmed up은 '몸이 데워진' 상태를 나타내는 수동태 표현으로 쓰였고요. feels easier 부분을 보세요. feel 같은 감각동사 뒤에는 형용사 보어를 써야 한다는 원칙에 따라 easier라는 형용사의 비교급이 왔습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신체는\u003c/span>\u003cspan class=\"en\">The body\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전환했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">switched\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무산소에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">anaerobic \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유산소 호흡으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">aerobic \u003c/span>\u003cspan class=\"tgt\">respiration\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">신체는 무산소 호흡에서 유산소 호흡으로 전환되었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지문의 결론에 해당하는 문장으로, 운동 초기 무산소 상태에서 \u003cb class=\"key\">안정기\u003c/b>에 접어들며 산소를 활용하는 방식으로의 \u003cb class=\"key\">변화\u003c/b>를 설명합니다. 이 과정을 통해 운동이 더 \u003cb class=\"key\">수월해지는\u003c/b> 이유를 명확히 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 시제\u003c/span> : has + 과거분사(p.p.) : \"전환되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">from A to B 구문\u003c/span> : from [출발점] + to [도착점] : \"무산소에서 유산소 호흡으로\"\u003c/div>\u003c/div>","segs":[{"n":38,"text":"The body, 신체는. has switched, 전환했다. from anaerobic, 무산소에서. to aerobic respiration, 유산소 호흡으로.. 이 문장 전체를 해석하면, 신체는 무산소 호흡에서 유산소 호흡으로 전환되었습니다.","hl":"m"},{"n":39,"text":"운동을 시작하고 워밍업이 되면 우리 몸은 비효율적인 무산소 방식에서 벗어나 안정기에 접어듭니다. 충분한 산소가 공급되면서 이제는 지속 가능한 유산소 호흡으로 시스템 변화가 일어났고, 그 덕분에 운동이 수월해지는 거죠.","hl":"mn"},{"n":40,"text":"여기서 has switched는 현재완료 시제를 사용해서 몸의 상태 변화와 그 결과를 강조합니다. 그리고 from A to B라는 전치사구를 사용해 에너지를 만드는 방식이 다른 형태로 바뀌었음을 아주 깔끔하게 설명하고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>운동 시 에너지는 산소를 쓰는 \u003cb class=\"key\">유산소 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>과 산소 없이 당을 쓰는 \u003cb class=\"key\">무산소 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>을 통해 만들어집니다.\u003c/li>\u003cli>\u003cb class=\"key\">무산소 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>은 빠른 에너지 공급이 가능해 비상시 터보 부스트 역할을 하지만 \u003cb class=\"key\">젖산\u003c/b>이라는 독성 노폐물을 남깁니다.\u003c/li>\u003cli>운동 초반의 고통은 호흡계가 산소 수요를 즉각 따라잡지 못해 발생하는 \u003cb class=\"key\">무산소 \u003c/b>\u003cb class=\"key\">과부하\u003c/b>의 결과입니다.\u003c/li>\u003cli>몸이 충분히 예열되어 \u003cb class=\"key\">유산소 \u003c/b>\u003cb class=\"key\">호흡\u003c/b>으로 전환되면 에너지 효율이 높아져 운동이 훨씬 \u003cb class=\"key\">수월해집니다\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The initial discomfort of intense exercise is caused by the body's temporary reliance on anaerobic respiration before it transitions to the more efficient aerobic system.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리 몸은 산소 유무에 따라 \u003cb class=\"key\">유산소\u003c/b>와 \u003cb class=\"key\">무산소\u003c/b> 두 가지 방식으로 에너지를 만드는데, 운동 초기에 느끼는 고통은 \u003cb class=\"key\">무산소 \u003c/b>\u003cb class=\"key\">과부하\u003c/b> 때문이며 몸이 유산소 시스템으로 \u003cb class=\"key\">전환\u003c/b>되면서 점차 운동이 수월해집니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":41,"text":"정리하자면 운동 초반의 고통은 무산소 과부하 때문이며, 몸이 산소를 충분히 받아들여 유산소 호흡으로 넘어가면 해결된다는 내용이었습니다. 이 시스템의 전환 원리를 이해하면 독해의 흐름이 한눈에 보일 거예요. 오늘 수업은 여기서 마치겠습니다. 고생하셨습니다!","hl":null}]}]});</script></body></html>
