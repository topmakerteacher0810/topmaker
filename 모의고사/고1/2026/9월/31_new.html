<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>31번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"31번","audioDir":"31_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">31번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>Tastes Are Social: Why We Eat What We Eat\u003c/h1>\u003ch2>입맛은 사회적이다: 우리가 음식을 선택하는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>입맛은 단순한 개인의 선호나 음식 자체의 질에 의한 것이 아니라, 타인과의 관계와 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 반영하여 형성되고 전파되는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Our food preferences are shaped by social interactions and our desire for identity rather than the intrinsic qualities of the food.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 우리의 입맛이 단순히 개인적인 취향이 아니라 얼마나 사회적인지를 다룬 흥미로운 지문을 함께 보겠습니다. 우리의 식습관이 주변 사람들과 어떻게 연결되어 있고, 그것이 우리의 정체성을 어떻게 드러내는지 그 사회적 현상을 파헤쳐 보죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간은 태어날 때부터 타인과 연결되어 있으며, 식사 행위는 단순한 영양 섭취를 넘어 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">상호작용\u003c/b>(social interaction)의 핵심입니다. 특히 \u003cb class=\"key\">거울 \u003c/b>\u003cb class=\"key\">뉴런\u003c/b>(mirror neurons)의 원리처럼 우리는 타인의 행동을 관찰하며 입맛을 모방하고 학습합니다. 이는 프랑스의 사회학자 피에르 부르디외가 말한 \u003cb class=\"key\">아비투스\u003c/b>(habitus) 개념과도 연결되는데, 개인의 취향이 계급이나 집단의 정체성을 드러내는 수단이 된다는 것입니다. 친구들과 특정 음식을 먹으며 유대감을 느끼는 일상적인 경험이 바로 \u003cb class=\"key\">입맛의 \u003c/b>\u003cb class=\"key\">사회화\u003c/b>를 보여주는 좋은 예시입니다.\u003c/div>","segs":[{"n":2,"text":"여러분은 혹시 친구가 맛있게 먹는 걸 보고 갑자기 그 음식이 먹고 싶어진 적 있나요? 이건 사회적 상호작용과 거울 뉴런이라는 심리적 요인이 작용한 결과입니다. 사회학에서는 이를 아비투스라고 부르기도 하는데, 우리가 무엇을 먹느냐가 우리의 입맛의 사회화를 증명하는 셈이죠. 단순한 미각의 문제를 넘어선 집단적 행동임을 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>입맛의 사회적 근원\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>입맛은 사회적이라는 핵심 주장을 던지며, 인생의 첫 수유 단계부터 타인과의 \u003cb class=\"key\">인간관계\u003c/b>가 식습관 형성에 개입됨을 설명합니다. 음식 그 자체보다 그 음식을 제공하는 \u003cb class=\"key\">대상과의 \u003c/b>\u003cb class=\"key\">관계\u003c/b>가 중요함을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사회적 환경에서의 학습\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>우리는 다양한 사회적 집단 내에서 먹는 법을 배우며, 음식의 본질보다는 \u003cb class=\"key\">우리가 \u003c/b>\u003cb class=\"key\">누구인지\u003c/b>를 나타내는 \u003cb class=\"key\">집단 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 위해 특정 음식을 선호하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>입맛의 전파 메커니즘\u003csmall>부연 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>입맛은 음식의 질과 무관하게 \u003cb class=\"key\">바이러스\u003c/b>처럼 사람 사이에서 퍼져나갑니다. 우리는 타인의 식생활을 \u003cb class=\"key\">비판적으로 \u003c/b>\u003cb class=\"key\">관찰\u003c/b>하며 자신의 취향을 결정합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>정체성 유지를 위한 거부\u003csmall>사례 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>자신과 너무 비슷한 사람들이 좋아하는 것을 거부함으로써 \u003cb class=\"key\">차별화된 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 지키려는 심리를 보여줍니다. 작가는 2024년의 유행을 피한 경험을 통해 이를 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>로 제시합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"자, 그럼 지문이 어떤 논리적 흐름으로 이어지는지 단계별로 살펴봅시다.","hl":null},{"n":4,"text":"처음에는 입맛의 사회적 근원을 이야기합니다. 우리가 처음 우유를 마시는 아주 어린 시절부터 이미 누군가와의 관계 속에서 음식에 대한 태도가 형성된다는 점을 강조하고 있죠.","hl":"f0"},{"n":5,"text":"다음으로 사회적 환경에서의 학습을 설명합니다. 가족이나 친구, 직장 동료들 사이에서 먹는 법을 배우며 우리가 누구인지를 보여주는 집단 정체성을 형성해 나가는 과정을 보여줍니다.","hl":"f1"},{"n":6,"text":"이어서 입맛의 전파 메커니즘을 다룹니다. 취향이 바이러스처럼 퍼진다는 비유를 통해 우리가 타인을 관찰하고 평가하며 입맛을 공유한다는 점을 설명하죠.","hl":"f2"},{"n":7,"text":"마지막으로 정체성 유지를 위한 거부라는 독특한 심리를 보여줍니다. 나를 돋보이게 하지 않는 사람들과 똑같아 보이기 싫어서 유행을 피하는 개인의 구체적 사례로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거/예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 입맛이 \u003cb class=\"key\">사회적\u003c/b>이라는 핵심 주장을 던진 후, 이를 뒷받침하는 다양한 상황과 심리적 메커니즘을 설명합니다. 마지막에는 2024년의 유행 사례를 들어 주장을 구체화하는 \u003cb class=\"key\">사례 \u003c/b>\u003cb class=\"key\">제시\u003c/b> 구조를 취하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Even when (2)\u003c/b>\u003cspan>초기 단계부터의 강조\u003c/span>\u003cb>like this (6)\u003c/b>\u003cspan>앞서 언급한 방식의 지시\u003c/span>\u003cb>by which I mean (8)\u003c/b>\u003cspan>앞 문장의 구체적 부연 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">social\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">relationship with food\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">learn to eat\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">who we are\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">person to person\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">viral\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>What things are (intrinsic qualities)\u003c/th>\u003cth>Who we are (social identity)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>음식 자체의 성질이나 맛\u003c/td>\u003ctd>사회적 관계와 집단적 소속감\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 입맛은 사회적이라는 주장을 먼저 던지는 전형적인 두괄식 구조입니다. 첫 문장에서 명확한 주제를 제시하고 이를 뒷받침하는 근거와 사례를 나열하고 있어요. 마지막에 사례 제시를 통해 주제를 다시 한번 강조하는 방식입니다.","hl":"ty"},{"n":9,"text":"지문 속 신호어를 보면 입맛이 사회적이라는 주제가 어떻게 반복되는지 알 수 있습니다. 이븐 웬이나 라이크 디스 같은 표현들이 주제를 강화하죠. 특히 바이 위치 아이 민 같은 부연 설명을 통해 작가의 생각을 더 구체화하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>tastes\u003c/b>\u003cem>명사\u003c/em>\u003cspan>입맛, 취향\u003c/span>\u003c/div>\u003cdiv>\u003cb>social\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사회적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>presumably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마도, 짐작건대\u003c/span>\u003c/div>\u003cdiv>\u003cb>messed up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>망쳐놓은, 엉망으로 만든\u003c/span>\u003c/div>\u003cdiv>\u003cb>relationship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관계\u003c/span>\u003c/div>\u003cdiv>\u003cb>decade\u003c/b>\u003cem>명사\u003c/em>\u003cspan>10년\u003c/span>\u003c/div>\u003cdiv>\u003cb>particular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>recipe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조리법, 비결\u003c/span>\u003c/div>\u003cdiv>\u003cb>irrespective of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 관계없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>qualities\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특성, 자질, 질\u003c/span>\u003c/div>\u003cdiv>\u003cb>involved\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관련된\u003c/span>\u003c/div>\u003cdiv>\u003cb>observe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관찰하다, 준수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>judgmentally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>비판적으로, 판단하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~를 질리게 하다, 흥미를 잃게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>identical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>동일한, 똑같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>in every respect\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>모든 면에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>flatter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돋보이게 하다, 아첨하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>viral\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>바이러스처럼 퍼지는, 유행하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>by the skin of one's teeth\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>간신히, 가까스로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 사회적이라는 의미의 social이나 아마도라는 뜻의 presumably 같은 단어들은 꼭 기억해야 합니다. 음식의 질과 무관하다는 뜻의 핵심 숙어인 irrespective of도 아주 중요하니 잘 챙겨두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">social\u003c/b>\u003cspan class=\"m\">사회적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">communal\u003c/span>\u003cspan class=\"s\">collective\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">individual\u003c/span>\u003cspan class=\"a\">private\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">presumably\u003c/b>\u003cspan class=\"m\">아마도\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">probably\u003c/span>\u003cspan class=\"s\">supposedly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">irrespective of\u003c/b>\u003cspan class=\"m\">~와 관계없이\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">regardless of\u003c/span>\u003cspan class=\"s\">notwithstanding\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">identical\u003c/b>\u003cspan class=\"m\">동일한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">same\u003c/span>\u003cspan class=\"s\">indistinguishable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">distinct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">avoid\u003c/b>\u003cspan class=\"m\">피하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shun\u003c/span>\u003cspan class=\"s\">evade\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">embrace\u003c/span>\u003cspan class=\"a\">confront\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어 정리도 해볼까요? identical은 똑같다는 뜻으로 same과 바꿔 쓸 수 있고 반대말은 different입니다. avoid는 피하다라는 뜻의 shun과 같이 기억해 두면 어휘력이 쑥쑥 올라갈 거예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 입맛은\u003c/span>\u003cspan class=\"en\">Our tastes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적이다.\u003c/span>\u003cspan class=\"en\">are \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">social\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 입맛은 사회적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글 전체의 핵심 내용을 담고 있는 \u003cb class=\"key\">주제문\u003c/b>입니다. 인간의 식습관이나 선호도가 개인의 생물학적 특성이 아닌 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">상호작용\u003c/b>에 의해 형성된다는 점을 명시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 보어 역할\u003c/span> : Subject [Our tastes] + be [are] + Adjective [social (Complement)] : \"사회적인\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Our tastes, 우리의 입맛은. are social, 사회적이다.. 이 문장 전체를 해석하면, 우리의 입맛은 사회적이다.","hl":"m"},{"n":13,"text":"이 글의 첫 문장이자 가장 중요한 주제를 던지고 있어요. 우리의 입맛은 타고난 게 아니라 주변 사람들과 소통하며 만들어지는 사회적인 것이라는 점을 강조하죠.","hl":"mn"},{"n":14,"text":"여기서는 주어인 Our tastes 뒤에 비동사 are를 쓰고 보어인 social을 연결해 입맛의 성격을 정의하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 처음 우유를 마셨을 때에도,\u003c/span>\u003cspan class=\"en\">Even when you first drank milk,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우유가 있었다. 그렇다.\u003c/span>\u003cspan class=\"en\">there was the milk, yes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그 우유 뒤에는 사람도 있었다\u003c/span>\u003cspan class=\"en\">but there was also the person behind the milk\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마 형성했거나 망쳐놓았을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who\u003c/span> will have presumably \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">either \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">messed \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식과 당신의 관계를\u003c/span>\u003cspan class=\"en\">your relationship with food\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이후 몇십 년 동안.\u003c/span>\u003cspan class=\"en\">for the couple of decades after that.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신이 처음 우유를 마셨을 때에도, 우유가 있었다. 그렇다. 하지만 그 우유 뒤에는 이후 몇십 년 동안 아마 음식과 당신의 관계를 형성했거나 망쳐놓았을 사람도 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가장 기본적인 생존 활동인 우유 마시기조차 \u003cb class=\"key\">타인\u003c/b>과의 관계 속에서 일어남을 설명합니다. 초기 식생활 경험을 제공하는 사람이 한 개인의 장기적인 \u003cb class=\"key\">식습관\u003c/b>에 지대한 영향을 끼친다는 논리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : the person [선행사] + who [관계대명사] + will have [동사] : \"사람\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 (either A or B)\u003c/span> : either [A: made] or [B: messed up] : \"형성했거나 망쳐놓았을\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Even when you first drank milk, 당신이 처음 우유를 마셨을 때에도. there was the milk, yes, 우유가 있었다. 그렇다.. but there was also the person behind the milk, 하지만 그 우유 뒤에는 사람도 있었다. who will have presumably either made or messed up, 아마 형성했거나 망쳐놓았을. your relationship with food, 음식과 당신의 관계를. for the couple of decades after that, 이후 몇십 년 동안.. 이 문장 전체를 해석하면, 당신이 처음 우유를 마셨을 때에도, 우유가 있었다. 그렇다. 하지만 그 우유 뒤에는 이후 몇십 년 동안 아마 음식과 당신의 관계를 형성했거나 망쳐놓았을 사람도 있었다.","hl":"m"},{"n":16,"text":"갓난아기 때 우유를 먹는 순간조차도 순수하게 음식만 있는 게 아니라는 뜻이에요. 우유를 주는 사람이 누구냐에 따라 미래의 식습관이 결정된다는 비유적 표현을 썼습니다.","hl":"mn"},{"n":17,"text":"첫 번째로 the person 뒤의 who는 주격 관계대명사로 쓰여서 사람을 꾸며주고 있고요. 두 번째로 either A or B 표현이 쓰여서 형성하거나 혹은 망쳐놓는다는 두 가지 가능성을 연결합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 먹는 것을 배운다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">learn \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">eat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족과 친구들로부터,\u003c/span>\u003cspan class=\"en\">from our families and friends,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학교에서 그리고 직장에서.\u003c/span>\u003cspan class=\"en\">at school and in work.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 가족과 친구들로부터, 학교에서 그리고 직장에서 먹는 것을 배운다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 식습관이 본능이 아니라 다양한 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">집단\u003c/b> 내에서 이루어지는 \u003cb class=\"key\">학습의 \u003c/b>\u003cb class=\"key\">결과\u003c/b>임을 구체적인 장소를 들어 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법\u003c/span> : learn [타동사] + to eat [to부정사구/목적어] : \"먹는 것을 배운다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"We learn to eat, 우리는 먹는 것을 배운다. from our families and friends, 가족과 친구들로부터. at school and in work, 학교에서 그리고 직장에서.. 이 문장 전체를 해석하면, 우리는 가족과 친구들로부터, 학교에서 그리고 직장에서 먹는 것을 배운다.","hl":"m"},{"n":19,"text":"식습관이 혼자 생기는 게 아니라 우리가 속한 다양한 집단을 통해 학습된다는 걸 보여줍니다. 가족부터 직장 동료까지 모두가 우리 입맛에 영향을 미치는 거죠.","hl":"mn"},{"n":20,"text":"learn이라는 동사 뒤에 to부정사인 to eat이 와서 무엇을 배우는지 목적어 역할을 하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 마을은 개발한다\u003c/span>\u003cspan class=\"en\">A village develops\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사과파이를 위한 특정 레시피를\u003c/span>\u003cspan class=\"en\">a particular recipe for an apple pie\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">― 마을 밖에서는 누구도 좋아하지 않는 것인,\u003c/span>\u003cspan class=\"en\">― \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">one\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> nobody outside the village likes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 누가 신경 쓰겠는가?\u003c/span>\u003cspan class=\"en\">but who cares?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 마을은 사과파이를 위한 특정 레시피를 개발하는데, 이는 그 마을 밖에서는 누구도 좋아하지 않는 것이지만, 누가 신경 쓰겠는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 특정 공동체 안에서만 공유되는 취향을 통해 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">결속력\u003c/b>을 보여주는 예시입니다. 음식 자체의 맛보다는 우리만의 \u003cb class=\"key\">소속감\u003c/b>이 중요하다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정대명사 (동격)\u003c/span> : a particular recipe [명사구] + one [대명사/동격] : \"것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 목적격\u003c/span> : one [선행사] + that [관계사] + nobody [주어] + likes [타동사] : \"~하는\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"A village develops, 한 마을은 개발한다. a particular recipe for an apple pie, 사과파이를 위한 특정 레시피를. ― one that nobody outside the village likes, ― 마을 밖에서는 누구도 좋아하지 않는 것인. but who cares?, 하지만 누가 신경 쓰겠는가?. 이 문장 전체를 해석하면, 한 마을은 사과파이를 위한 특정 레시피를 개발하는데, 이는 그 마을 밖에서는 누구도 좋아하지 않는 것이지만, 누가 신경 쓰겠는가?","hl":"m"},{"n":22,"text":"마을 사람들만 좋아하는 레시피를 예로 들어서, 입맛이 공동체의 정체성을 확인해 주는 수단이라는 점을 설명하고 있어요. 외부인이 싫어해도 우리끼리 좋으면 그만이라는 태도를 보여주죠.","hl":"mn"},{"n":23,"text":"첫 번째로 대명사 one은 앞의 애플파이 레시피를 가리키는 부정대명사예요. 뒤에 나오는 that은 likes의 목적어가 빠진 문장을 이끄는 목적격 관계대명사로, 우리 마을 사람들만 좋아하는 것이라는 의미를 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 이런 것들을 원한다\u003c/span>\u003cspan class=\"en\">We want these things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 단지 무엇인지 때문만이 아니라,\u003c/span>\u003cspan class=\"en\">not just because of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 누구인지 때문에\u003c/span>\u003cspan class=\"en\">but who we are.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 이런 것들을 그것들이 단지 무엇인지 때문만이 아니라, 우리가 누구인지 때문에 원한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 음식을 선택하는 기준이 단순히 영양소나 맛 같은 \u003cb class=\"key\">본질적 \u003c/b>\u003cb class=\"key\">특성\u003c/b>이 아니라, 우리의 \u003cb class=\"key\">정체성\u003c/b>에 근거한다는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사절)\u003c/span> : what [의문사] + they [주어] + are [동사] : \"그것들이 무엇인지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">상관접속사 (not just A but B)\u003c/span> : not just [A] + but [B] : \"A 때문만이 아니라 B 때문에\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"We want these things, 우리는 이런 것들을 원한다. not just because of what they are, 그것들이 단지 무엇인지 때문만이 아니라. but who we are, 우리가 누구인지 때문에. 이 문장 전체를 해석하면, 우리는 이런 것들을 그것들이 단지 무엇인지 때문만이 아니라, 우리가 누구인지 때문에 원한다.","hl":"m"},{"n":25,"text":"이 글의 주제를 관통하는 아주 중요한 문장이에요. 우리가 무언가를 먹고 싶어 하는 건 그 음식 자체의 맛보다, 그걸 먹는 우리의 모습이나 소속감을 원하기 때문이라는 뜻이죠.","hl":"mn"},{"n":26,"text":"여기서 not just A but B 구문은 A뿐만 아니라 B 때문이라는 점을 강조하고 있어요. 전치사 because of 뒤에 의문사, 주어, 동사 순서의 간접의문문 두 개가 병렬 구조로 연결된 것도 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">입맛은 이렇게 퍼진다,\u003c/span>\u003cspan class=\"en\">Tastes spread like this,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람에서 사람으로,\u003c/span>\u003cspan class=\"en\">person to person,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바이러스처럼,\u003c/span>\u003cspan class=\"en\">like viruses,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연관된 음식의 특성과는 거의 무관하게\u003c/span>\u003cspan class=\"en\">almost \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">irrespective \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> the qualities of the food \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">involved\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">입맛은 이렇게 마치 바이러스처럼 사람에서 사람으로 퍼지며, 연관된 음식의 특성과는 거의 무관하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 입맛의 \u003cb class=\"key\">전염성\u003c/b>을 설명하며, 그 과정이 음식의 객관적인 \u003cb class=\"key\">품질\u003c/b>과는 큰 상관이 없음을 밝히고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : irrespective of [명사/명사구] : \"~와 상관없이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 후치수식\u003c/span> : the food [명사] + involved [과거분사] : \"연관된 음식\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Tastes spread like this, 입맛은 이렇게 퍼진다. person to person, 사람에서 사람으로. like viruses, 바이러스처럼. almost irrespective of the qualities of the food involved, 연관된 음식의 특성과는 거의 무관하게. 이 문장 전체를 해석하면, 입맛은 이렇게 마치 바이러스처럼 사람에서 사람으로 퍼지며, 연관된 음식의 특성과는 거의 무관하다.","hl":"m"},{"n":28,"text":"입맛이 퍼지는 방식이 바이러스와 같다고 비유하고 있어요. 음식이 얼마나 맛있고 건강한지 같은 실제 특징보다는, 주변 사람들의 영향력이 훨씬 더 강력하게 작용한다는 뜻입니다.","hl":"mn"},{"n":29,"text":"irrespective of는 무엇과 상관없이라는 아주 중요한 표현이고요. 마지막에 나온 involved는 앞에 있는 명사 food를 뒤에서 꾸며주는 과거분사로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 관찰한다\u003c/span>\u003cspan class=\"en\">We observe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들을\u003c/span>\u003cspan class=\"en\">other people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 식생활 속에서\u003c/span>\u003cspan class=\"en\">in their food lives,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 비판적으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">judgmentally\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는, 종종 비판적으로, 다른 사람들을 그들의 식생활로 관찰한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리의 입맛이 단순히 개인의 선호가 아니라 타인의 행동을 \u003cb class=\"key\">관찰\u003c/b>하고 \u003cb class=\"key\">평가\u003c/b>하는 과정에서 형성됨을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사구의 독립적 쓰임\u003c/span> : often [부사] + judgmentally [부사] : \"종종 비판적으로\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"We observe, 우리는 관찰한다. other people, 다른 사람들을. in their food lives, 그들의 식생활 속에서. often judgmentally, 종종 비판적으로. 이 문장 전체를 해석하면, 우리는, 종종 비판적으로, 다른 사람들을 그들의 식생활로 관찰한다.","hl":"m"},{"n":31,"text":"이 문장은 우리가 타인의 식생활을 그냥 구경만 하는 게 아니라, 속으로 저건 좋네 나쁘네 하며 평가한다는 내용이에요. 입맛이 사회적이라는 주장을 뒷받침하죠.","hl":"mn"},{"n":32,"text":"문장 끝에 붙은 often judgmentally는 부사구예요. 우리가 관찰을 할 때 어떤 방식으로 하는지, 즉 주관적이고 비판적인 태도로 관찰한다는 점을 강조하기 위해 덧붙여진 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 것도 나를 질리게 만드는 것은 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Nothing \u003c/span>\u003cspan class=\"tgt\">turns \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">off \u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">quicker \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어울리지 않는 사람들이 그것을 좋아하는 것보다 더 빨리\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">wrong \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">liking \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기서 내가 의미하는 바는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">mean\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나와 거의 동일한 사람들이다\u003c/span>\u003cspan class=\"en\">people almost identical to me\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 면에서\u003c/span>\u003cspan class=\"en\">in every respect,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 돋보이게 하지 않는 면에서 그렇다\u003c/span>\u003cspan class=\"en\">in a way that doesn't flatter me.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어울리지 않는 사람들이 그것을 좋아하는 것만큼 나를 어떤 것에서 더 빨리 질리게 만드는 것은 없는데, 여기서 내가 의미하는 바는 모든 면에서 나와 거의 동일한 사람들인데, 그것이 나를 돋보이게 하지 않는 면에서 그렇다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나와 너무 닮아서 나의 \u003cb class=\"key\">특별함\u003c/b>을 해치는 사람이 특정 음식을 좋아할 때, 그 음식에 대한 \u003cb class=\"key\">거부감\u003c/b>이 가장 커진다는 심리를 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 주어와 비교급을 이용한 최상급\u003c/span> : Nothing [부정주어] + [동사] + [비교급] + than : \"~보다 더 빨리 ~하게 하는 것은 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 의미상 주어\u003c/span> : the wrong people [명사/의미상주어] + liking [동명사] : \"어울리지 않는 사람들이 그것을 좋아하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 + 관계대명사 (계속적 용법)\u003c/span> : by [전치사] + which [관계대명사] + S + V : \"그것에 의해 내가 의미하는 바는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Nothing turns me off something quicker, 어떤 것도 나를 질리게 만드는 것은 없다. than the wrong people liking it, 어울리지 않는 사람들이 그것을 좋아하는 것보다 더 빨리. by which I mean, 여기서 내가 의미하는 바는. people almost identical to me, 나와 거의 동일한 사람들이다. in every respect, 모든 면에서. in a way that doesn't flatter me, 나를 돋보이게 하지 않는 면에서 그렇다. 이 문장 전체를 해석하면, 어울리지 않는 사람들이 그것을 좋아하는 것만큼 나를 어떤 것에서 더 빨리 질리게 만드는 것은 없는데, 여기서 내가 의미하는 바는 모든 면에서 나와 거의 동일한 사람들인데, 그것이 나를 돋보이게 하지 않는 면에서 그렇다.","hl":"m"},{"n":34,"text":"내가 싫어하는 사람이 내가 좋아하는 걸 먹으면 정떨어지는 경험 있으시죠? 작가는 특히 나와 너무 비슷한 사람이 그걸 좋아해서 내 특별함이 사라질 때 가장 크게 질린다고 말하고 있어요.","hl":"mn"},{"n":35,"text":"첫 번째로, 부정 주어 Nothing과 비교급 quicker than을 써서 뒤에 나오는 내용이 가장 빠르다는 최상급 의미를 전달합니다. 두 번째로, than 뒤의 liking은 동명사인데, 그 앞에 the wrong people을 써서 누가 좋아하는지를 밝히는 의미상 주어로 썼어요. 마지막으로 by which는 앞의 내용을 구체적으로 다시 설명해 주는 계속적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 피했다\u003c/span>\u003cspan class=\"en\">I avoided\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바이러스처럼 퍼졌던 2024년의 다진 샐러드 순간을\u003c/span>\u003cspan class=\"en\">the viral chopped salad moment of 2024\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간신히\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">skin \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">teeth\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 바이러스처럼 퍼졌던 2024년의 다진 샐러드 순간을 간신히 피했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대중적으로 큰 유행(viral)을 탄 음식을 따라가지 않음으로써, 자신의 \u003cb class=\"key\">주체성\u003c/b>과 타인과의 \u003cb class=\"key\">차별화\u003c/b>를 지켜냈다는 재치 있는 고백입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용구 (Idiom)\u003c/span> : by the skin of one's teeth : \"간신히, 가까스로\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"I avoided, 나는 피했다. the viral chopped salad moment of 2024, 바이러스처럼 퍼졌던 2024년의 다진 샐러드 순간을. by the skin of my teeth, 간신히. 이 문장 전체를 해석하면, 나는 바이러스처럼 퍼졌던 2024년의 다진 샐러드 순간을 간신히 피했다.","hl":"m"},{"n":37,"text":"2024년에 다진 샐러드가 엄청 유행했나 봐요. 작가는 남들 다 하는 유행에 나도 똑같이 휩쓸릴 뻔했지만, 아슬아슬하게 그걸 안 먹고 버텨내서 내 개성을 지켰다고 우스갯소리를 하는 거예요.","hl":"mn"},{"n":38,"text":"여기서 by the skin of my teeth라는 표현을 꼭 기억하세요. 직역하면 내 이빨의 피부라는 뜻인데, 사실 이빨에는 피부가 없죠? 그만큼 아주 얇고 미세한 차이로 간신히 무언가를 피했다는 재미있는 관용구입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>입맛은 생물학적 본능이라기보다 타인과의 상호작용에서 비롯된 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">산물\u003c/b>입니다.\u003c/li>\u003cli>우리는 성장 과정에서 주변 사람들을 통해 무엇을 어떻게 먹을지 \u003cb class=\"key\">사회적으로 \u003c/b>\u003cb class=\"key\">학습\u003c/b>하게 됩니다.\u003c/li>\u003cli>음식의 선택은 물질적 가치보다 우리가 속한 \u003cb class=\"key\">집단의 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 나타내는 수단이 됩니다.\u003c/li>\u003cli>때로는 타인과의 차별화를 위해 대중적인 유행을 의도적으로 \u003cb class=\"key\">회피\u003c/b>하여 개성을 지키려 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Our food preferences are shaped by social interactions and our desire for identity rather than the intrinsic qualities of the food.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">입맛은 단순한 개인의 선호나 음식 자체의 질에 의한 것이 아니라, 타인과의 관계와 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 반영하여 형성되고 전파되는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"입맛이 사회적 산물이라는 점, 그리고 그것이 우리의 집단적 혹은 개인적 정체성을 드러낸다는 사실을 잘 이해했나요? 오늘 배운 내용을 바탕으로 평소 자신의 식습관도 한번 돌아보면 좋겠네요. 오늘 수업은 여기서 마치겠습니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
