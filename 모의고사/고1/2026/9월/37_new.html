<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>37번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"37번","audioDir":"37_audio","preview":false,"count":46,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">37번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>The Evolutionary Journey of Astronomy: From Naked-Eye Observations to Telescopic Proof\u003c/h1>\u003ch2>천문학의 진화 여정: 맨눈 관측에서 망원경을 통한 증명까지\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인류는 고대부터 별을 관찰해 왔으며, \u003cb class=\"key\">코페르니쿠스\u003c/b>의 지동설 제안과 \u003cb class=\"key\">갈릴레이\u003c/b>의 \u003cb class=\"key\">망원경\u003c/b>을 통한 실증적 발견을 거쳐 우주에 대한 지식을 확장해 왔다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The advancement of astronomical knowledge has been driven by revolutionary theoretical shifts and technological innovations in observation.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요! 오늘은 인류가 광활한 우주를 어떻게 이해해 왔는지 그 흥미로운 과정을 담은 지문을 공부해 보겠습니다. 이 글은 고대인들의 관찰부터 망원경의 발명, 그리고 코페르니쿠스와 갈릴레이의 위대한 업적을 다루고 있어요. 요약하자면, 인류의 우주관은 단순한 관찰에서 기술적 증명을 거쳐 발전했다는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인류는 아주 오래전부터 밤하늘의 규칙성을 찾으려 노력했습니다. 고대 문명들은 농사와 항해를 위해 \u003cb class=\"key\">천문 \u003c/b>\u003cb class=\"key\">관측\u003c/b>(astronomical observation)을 수행하며 달력을 만들기도 했죠. 16세기 이전까지 유럽은 지구가 중심이라는 \u003cb class=\"key\">천동설\u003c/b>(Geocentric model)이 지배적이었는데, 이는 마치 우리가 기차 안에 있을 때 바깥 풍경이 움직이는 것처럼 보이는 \u003cb class=\"key\">착각\u003c/b>과 비슷합니다. 코페르니쿠스는 수학적 계산을 통해 지구가 태양을 돈다는 \u003cb class=\"key\">지동설\u003c/b>(Heliocentric model)을 주장했고, 이후 갈릴레이가 망원경으로 실질적인 \u003cb class=\"key\">증거\u003c/b>를 찾아내며 과학 혁명이 완성되었습니다.\u003c/div>","segs":[{"n":2,"text":"우리가 밤하늘을 볼 때 별들이 움직이는 것처럼 보이는 건 사실 지구가 스스로 돌기 때문이에요. 하지만 아주 옛날 사람들은 당연히 땅은 고정되어 있고 하늘이 움직인다고 믿었죠. 이걸 천문 관측 용어로 천동설이라고 합니다. 마치 달리는 기차 안에서 창밖 나무들이 뒤로 가는 걸 보고 나무가 움직인다고 생각하는 착각과 같은 거예요. 코페르니쿠스는 이런 착각을 깨고 지동설이라는 혁명적인 아이디어를 제안했고, 이후 갈릴레이가 망원경이라는 결정적인 증거를 찾아내며 과학의 역사가 바뀌게 되었습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>초기 천문 관측\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>망원경이 없던 시절부터 고대 문명들은 \u003cb class=\"key\">별의 \u003c/b>\u003cb class=\"key\">움직임\u003c/b>을 관찰하고 이를 \u003cb class=\"key\">지도화\u003c/b>하며 우주를 이해하려고 시도했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>코페르니쿠스의 혁명\u003csmall>전환 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>코페르니쿠스는 당시의 통념이었던 천동설을 반박하며, 지구가 태양 주위를 돈다는 \u003cb class=\"key\">혁명적인 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 제안하고 이를 \u003cb class=\"key\">책으로 \u003c/b>\u003cb class=\"key\">출판\u003c/b>했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기술적 개선\u003csmall>전개 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>후대 천문학자들은 코페르니쿠스의 연구를 이어받았으며, 17세기 초 \u003cb class=\"key\">망원경의 \u003c/b>\u003cb class=\"key\">발전\u003c/b>으로 관측 기술의 \u003cb class=\"key\">비약적 \u003c/b>\u003cb class=\"key\">향상\u003c/b>이 일어났습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>실증적 증거 발견\u003csmall>근거 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>갈릴레이는 망원경을 사용해 목성의 위성과 달의 분화구를 발견함으로써 코페르니쿠스의 이론이 \u003cb class=\"key\">정확했음\u003c/b>을 \u003cb class=\"key\">확증\u003c/b>했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>지식의 진보\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>수 세기 동안의 과학적 발견과 망원경의 정보는 우주의 작동 방식에 대한 인류의 \u003cb class=\"key\">지식을 \u003c/b>\u003cb class=\"key\">전진\u003c/b>시켰습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 지문이 어떤 논리적 순서로 전개되는지 단계별로 자세히 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째와 두 번째 문장에서는 망원경도 없던 고대 시절을 소개합니다. 이집트인이나 그리스인 같은 고대인들은 오직 육안으로 별의 움직임을 관찰하고 지도로 기록하며 우주를 탐구하기 시작했죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 3번부터 여섯 번째 문장까지로, 코페르니쿠스의 등장을 다룹니다. 그는 태양이 지구 주위를 돈다는 기존의 잘못된 우주관을 뒤집고, 지구가 태양을 돈다는 혁명적인 아이디어를 제시하며 책을 출판했습니다.","hl":"f1"},{"n":6,"text":"세 번째로 일곱 번째와 여덟 번째 문장에서는 기술적 전환점이 나타납니다. 코페르니쿠스의 연구를 바탕으로 다른 천문학자들이 연구를 이어갔고, 마침내 17세기 초 망원경의 발전이라는 중대한 기술적 개선이 이루어집니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 아홉 번째와 열 번째 문장으로, 갈릴레이의 실증적 발견입니다. 그는 망원경을 이용해 목성의 위성과 달의 분화구를 직접 관찰했고, 이를 통해 코페르니쿠스의 이론이 정확했음을 세상에 확증했습니다.","hl":"f3"},{"n":8,"text":"마지막 열한 번째 문장은 전체적인 결론입니다. 이러한 수 세기에 걸친 과학적 발견과 망원경이 제공한 정보들이 결국 우주의 작동 방식에 대한 우리의 지식을 크게 전진시켰다는 내용으로 마무리됩니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 고대부터 17세기, 그리고 현대에 이르기까지 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 천문학이 어떻게 발전했는지 설명하고 있습니다. 초기 관측에서 이론적 제시, 그리고 도구의 발명으로 이어지는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>가 뚜렷합니다. 마지막 문장에서 이러한 역사적 과정이 우주에 대한 \u003cb class=\"key\">지식의 \u003c/b>\u003cb class=\"key\">진보\u003c/b>로 이어졌음을 정리하는 미괄식 구조를 띠고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Even before (1)\u003c/b>\u003cspan>시점 설정\u003c/span>\u003cb>In Europe (3)\u003c/b>\u003cspan>장소 전환\u003c/span>\u003cb>Despite (6)\u003c/b>\u003cspan>역접/양보\u003c/span>\u003cb>Later (7)\u003c/b>\u003cspan>시간 경과\u003c/span>\u003cb>Over the centuries (11)\u003c/b>\u003cspan>장기적 흐름 정리\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">map the movements of the stars\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">revolutionary idea\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">view of the universe\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">theory\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">scientific discoveries\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">advanced our knowledge\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>The view accepted at the time (천동설)\u003c/th>\u003cth>Copernicus' theory (지동설)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>The Sun traveled around Earth\u003c/td>\u003ctd>Earth traveled around the Sun\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 지문은 전형적인 시간순 전개 방식을 따르고 있습니다. 고대부터 시작해 16세기의 코페르니쿠스, 그리고 17세기의 갈릴레이로 이어지는 역사의 흐름을 보여주죠. 마지막 문장에서 주제를 정리하는 미괄식 구조로 이루어져 있습니다.","hl":"ty"},{"n":10,"text":"글의 흐름을 알려주는 신호어들을 잘 봐야 해요. 세 번째 문장의 유럽에서의 시점 변화, 6번의 반대에도 불구하고라는 표현, 그리고 7번의 나중에라는 시간적 표현이 내용의 전환을 잘 보여줍니다. 또한 천동설과 지동설이라는 두 가지 대조적인 관점을 비교하며 읽는 것이 핵심입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>telescope\u003c/b>\u003cem>명사\u003c/em>\u003cspan>망원경\u003c/span>\u003c/div>\u003cdiv>\u003cb>exist\u003c/b>\u003cem>동사\u003c/em>\u003cspan>존재하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look out into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~으로 밖을 내다보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>universe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우주\u003c/span>\u003c/div>\u003cdiv>\u003cb>map\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지도로 만들다, 파악하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>movement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>움직임\u003c/span>\u003c/div>\u003cdiv>\u003cb>mathematician\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>put forth\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>제기하다, 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>revolutionary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>혁명적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>measurement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>측정\u003c/span>\u003c/div>\u003cdiv>\u003cb>by eye\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>맨눈으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>conclude\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결론짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>accepted\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>받아들여지는, 통용되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 당시에\u003c/span>\u003c/div>\u003cdiv>\u003cb>travel around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 주위를 돌다\u003c/span>\u003c/div>\u003cdiv>\u003cb>despite\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에도 불구하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>widespread\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>널리 퍼진\u003c/span>\u003c/div>\u003cdiv>\u003cb>objection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반대\u003c/span>\u003c/div>\u003cdiv>\u003cb>theory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이론\u003c/span>\u003c/div>\u003cdiv>\u003cb>build on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 바탕으로 삼다\u003c/span>\u003c/div>\u003cdiv>\u003cb>technological\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기술적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>improvement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개선, 발전\u003c/span>\u003c/div>\u003cdiv>\u003cb>lead to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 이어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>development\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발전\u003c/span>\u003c/div>\u003cdiv>\u003cb>discover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>Jupiter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목성\u003c/span>\u003c/div>\u003cdiv>\u003cb>confirm\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확증하다, 확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>advance\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전진시키다, 증진하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어 몇 가지를 짚어볼게요. revolutionary는 기존의 것을 완전히 바꾸는 혁명적인이라는 뜻이고, confirm은 어떤 이론이 맞는지 확실히 증명하거나 확증할 때 쓰는 아주 중요한 단어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">revolutionary\u003c/b>\u003cspan class=\"m\">혁명적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">innovative\u003c/span>\u003cspan class=\"s\">groundbreaking\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conservative\u003c/span>\u003cspan class=\"a\">traditional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">widespread\u003c/b>\u003cspan class=\"m\">널리 퍼진\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prevalent\u003c/span>\u003cspan class=\"s\">pervasive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">limited\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">objection\u003c/b>\u003cspan class=\"m\">반대\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">opposition\u003c/span>\u003cspan class=\"s\">challenge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">agreement\u003c/span>\u003cspan class=\"a\">acceptance\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">confirm\u003c/b>\u003cspan class=\"m\">확증하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">verify\u003c/span>\u003cspan class=\"s\">validate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003cspan class=\"a\">disprove\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">advance\u003c/b>\u003cspan class=\"m\">전진시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">promote\u003c/span>\u003cspan class=\"s\">progress\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">regress\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어도 정리해 두세요. 혁명적인이라는 뜻의 revolutionary는 innovative와 바꿔 쓸 수 있고, 확증하다라는 뜻의 confirm은 verify로도 표현할 수 있습니다. 반대로 지식의 전진을 뜻하는 advance의 반대말은 뒤로 물러나는 regress가 되겠네요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">망원경이 존재하기도 전에,\u003c/span>\u003cspan class=\"en\">Even before telescopes \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">existed\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 우주로 밖을 내다보았고\u003c/span>\u003cspan class=\"en\">people looked out into space\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주를 이해하려고 노력했다.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">tried \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span> the universe.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">망원경이 존재하기도 전에, 사람들은 우주로 밖을 내다보았고 우주를 이해하려고 노력했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 천문학 도구인 \u003cb class=\"key\">망원경\u003c/b>이 발명되기 훨씬 이전부터 인류가 본능적으로 \u003cb class=\"key\">우주\u003c/b>에 대한 깊은 호기심을 가지고 있었음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사의 과거형\u003c/span> : exist [자동사] + -ed : \"존재했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">try + to부정사\u003c/span> : try [동사] + to understand [to부정사/목적어] : \"이해하려고 노력했다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Even before telescopes existed, 망원경이 존재하기도 전에. people looked out into space, 사람들은 우주로 밖을 내다보았고. and tried to understand the universe, 우주를 이해하려고 노력했다.. 이 문장 전체를 해석하면, 망원경이 존재하기도 전에, 사람들은 우주로 밖을 내다보았고 우주를 이해하려고 노력했다.","hl":"m"},{"n":14,"text":"도구가 없던 시절에도 인간은 하늘을 보며 궁금해했어요. 인류가 아주 오래전부터 가졌던 우주에 대한 근본적인 호기심을 강조하는 문장입니다.","hl":"mn"},{"n":15,"text":"첫 번째로 existed는 자동사의 과거형으로 쓰여서 망원경이 존재했던 과거를 나타냅니다. 두 번째로 tried 뒤에 to부정사가 와서 우주를 이해하려고 애썼다는 노력과 의지를 표현하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이집트인, 바빌로니아인, 그리스인, 그리고 마야인들은\u003c/span>\u003cspan class=\"en\">The Egyptians, Babylonians, Greeks, and Maya\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최초의 민족 중에 있었다\u003c/span>\u003cspan class=\"en\">were among the first \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">peoples\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">별들의 움직임을 지도로 만든\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">map\u003c/span> the movements of the stars.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이집트인, 바빌로니아인, 그리스인, 그리고 마야인들은 별들의 움직임을 지도로 만든 최초의 민족 중에 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고대 여러 문명들이 \u003cb class=\"key\">별의 \u003c/b>\u003cb class=\"key\">움직임\u003c/b>을 관찰하고 기록했다는 구체적인 예시를 통해, 천문학적 노력이 \u003cb class=\"key\">범지구적\u003c/b>이었음을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사의 복수형(민족)\u003c/span> : people [집합적 명사] + -s [복수형 어미] : \"민족들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the first peoples [명사] + to map [to부정사] : \"지도로 만든\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"The Egyptians, Babylonians, Greeks, and Maya, 이집트인, 바빌로니아인, 그리스인, 그리고 마야인들은. were among the first peoples, 최초의 민족 중에 있었다. to map the movements of the stars, 별들의 움직임을 지도로 만든. 이 문장 전체를 해석하면, 이집트인, 바빌로니아인, 그리스인, 그리고 마야인들은 별들의 움직임을 지도로 만든 최초의 민족 중에 있었다.","hl":"m"},{"n":17,"text":"구체적인 고대 민족들의 이름을 나열해서 신뢰도를 높였어요. 이들이 별의 움직임을 기록하고 지도로 만든 선구자들이었다는 점이 핵심입니다.","hl":"mn"},{"n":18,"text":"여기서 peoples는 단순히 사람들이 아니라 여러 민족을 뜻하는 명사로 쓰였고요. to map은 앞의 명사를 수식하는 형용사적 용법으로 쓰여서 지도로 만든 민족이라는 의미를 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유럽에서는,\u003c/span>\u003cspan class=\"en\">In Europe,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Nicolaus Copernicus라고 불리는 16세기의 폴란드 수학자가\u003c/span>\u003cspan class=\"en\">a 16th-century Polish mathematician \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">named\u003c/span> Nicolaus Copernicus\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 가지 혁명적인 아이디어를 제기했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">forth\u003c/span> a revolutionary idea.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유럽에서는, Nicolaus Copernicus라고 불리는 16세기의 폴란드 수학자가 한 가지 혁명적인 아이디어를 제기했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현대 천문학의 전환점이 되는 \u003cb class=\"key\">코페르니쿠스\u003c/b>를 소개하며, 기존의 관념을 완전히 바꾸는 \u003cb class=\"key\">혁명적인 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이 등장했음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : mathematician [명사] + named [과거분사] : \"~라고 불리는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사(제시하다)\u003c/span> : put [동사] + forth [부사] : \"제기했다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"In Europe, 유럽에서는. a 16th-century Polish mathematician named Nicolaus Copernicus, Nicolaus Copernicus라고 불리는 16세기의 폴란드 수학자가. put forth a revolutionary idea, 한 가지 혁명적인 아이디어를 제기했다.. 이 문장 전체를 해석하면, 유럽에서는, Nicolaus Copernicus라고 불리는 16세기의 폴란드 수학자가 한 가지 혁명적인 아이디어를 제기했다.","hl":"m"},{"n":20,"text":"이제 지문의 주인공인 코페르니쿠스가 등장합니다. 그가 내놓은 생각은 당시 사람들의 상식을 완전히 뒤집는 아주 혁명적인 것이었죠.","hl":"mn"},{"n":21,"text":"명사 mathematician 뒤에서 named가 수식하고 있는데, 이름이 불리는 대상이므로 과거분사를 썼습니다. 그리고 put forth는 아이디어를 세상에 내놓거나 제안했다는 의미의 구동사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Copernicus는 별들을 관찰했고\u003c/span>\u003cspan class=\"en\">Copernicus watched the stars\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">측정했다\u003c/span>\u003cspan class=\"en\">and took measurements\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맨눈으로.\u003c/span>\u003cspan class=\"en\">by eye.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Copernicus는 별들을 관찰했고 맨눈으로 측정했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 망원경이 발명되기 전, 코페르니쿠스가 오직 \u003cb class=\"key\">육안\u003c/b>만을 이용해 자료를 수집했던 집요한 \u003cb class=\"key\">관찰\u003c/b>의 과정을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : 주어 + [동사1 (watched)] + and + [동사2 (took)] : \"관찰했고 그리고 측정했다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Copernicus watched the stars, Copernicus는 별들을 관찰했고. and took measurements, 측정했다. by eye, 맨눈으로.. 이 문장 전체를 해석하면, Copernicus는 별들을 관찰했고 맨눈으로 측정했다.","hl":"m"},{"n":23,"text":"망원경 같은 장비가 없던 시절에 오로지 인간의 시각인 맨눈으로 데이터를 쌓아간 코페르니쿠스의 노력을 보여주는 문장입니다.","hl":"mn"},{"n":24,"text":"문장에서 watched와 took이라는 두 개의 과거 동사가 and를 사이에 두고 나란히 쓰인 병렬 구조를 확인하세요. 주어는 하나인데 행동이 두 개인 상황이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 결론지었다\u003c/span>\u003cspan class=\"en\">He concluded\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 당시에 받아들여진 우주에 대한 관점이\u003c/span>\u003cspan class=\"en\">that the view of the universe \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">accepted \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 태양이 지구 주위를 이동했다는 것이\u003c/span>\u003cspan class=\"en\">─ \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Sun \u003c/span>\u003cspan class=\"tgt\">traveled \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">Earth\u003c/span> ─\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">틀렸고,\u003c/span>\u003cspan class=\"en\">was wrong,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태양 주위를 이동한 것은 사실 지구였다고\u003c/span>\u003cspan class=\"en\">and that \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">fact \u003c/span>\u003cspan class=\"tgt\">Earth \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(공백)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> traveled around the Sun.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 그 당시에 받아들여진 우주에 대한 관점, 즉 태양이 지구 주위를 이동했다는 것이 틀렸고, 태양 주위를 이동한 것은 사실 지구였다고 결론지었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기존의 \u003cb class=\"key\">천동설\u003c/b>이 잘못되었음을 밝히고 지구가 태양 주위를 도는 \u003cb class=\"key\">지동설\u003c/b>이 진실임을 강조하는 글의 핵심 대목입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : 명사(the view) + [과거분사(accepted) + 수식어] : \"그 당시에 받아들여진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격의 접속사 that\u003c/span> : 명사(the view) + [that + 완전한 문장] : \"태양이 지구 주위를 이동했다는 (관점)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">it ~ that 강조구문\u003c/span> : it was + [강조대상(Earth)] + that + [나머지 문장] : \"사실 지구였다 / 태양 주위를 이동한 것은\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"He concluded, 그는 결론지었다. that the view of the universe accepted at the time, 그 당시에 받아들여진 우주에 대한 관점이. ─ that the Sun traveled around Earth ─, 즉 태양이 지구 주위를 이동했다는 것이. was wrong, 틀렸고. and that it was in fact Earth, 태양 주위를 이동한 것은 사실 지구였다고. that traveled around the Sun, (공백). 이 문장 전체를 해석하면, 그는 그 당시에 받아들여진 우주에 대한 관점, 즉 태양이 지구 주위를 이동했다는 것이 틀렸고, 태양 주위를 이동한 것은 사실 지구였다고 결론지었다.","hl":"m"},{"n":26,"text":"당시 사람들이 믿던 천동설이 틀렸고, 실제로는 지구가 움직인다는 지동설을 과학적으로 정립한 아주 중요한 장면입니다.","hl":"mn"},{"n":27,"text":"첫 번째로 accepted는 앞에 있는 명사 view를 꾸며주는 과거분사입니다. 두 번째로 하이픈 사이에 있는 that은 그 관점이 무엇인지 설명하는 동격의 접속사고요. 마지막으로 it was와 that 사이에 Earth를 넣은 강조 구문은 태양 주위를 도는 것이 바로 지구라는 점을 강하게 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 아이디어에 대해 널리 퍼진 반대에도 불구하고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Despite \u003c/span>\u003cspan class=\"tgt\">widespread \u003c/span>\u003cspan class=\"tgt\">objections\u003c/span> to his ideas,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 그의 이론을 출판했다\u003c/span>\u003cspan class=\"en\">he published his theory\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 권의 책에.\u003c/span>\u003cspan class=\"en\">in a book.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 아이디어에 대해 널리 퍼진 반대에도 불구하고, 그는 한 권의 책에 그의 이론을 출판했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 진리를 전파하기 위해 사회적 \u003cb class=\"key\">반대\u003c/b>와 위험을 무릅쓰는 과학적 \u003cb class=\"key\">용기\u003c/b>와 신념을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 Despite\u003c/span> : Despite [전치사] + [명사구(widespread objections)] : \"널리 퍼진 반대에도 불구하고\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Despite widespread objections to his ideas, 그의 아이디어에 대해 널리 퍼진 반대에도 불구하고. he published his theory, 그는 그의 이론을 출판했다. in a book, 한 권의 책에.. 이 문장 전체를 해석하면, 그의 아이디어에 대해 널리 퍼진 반대에도 불구하고, 그는 한 권의 책에 그의 이론을 출판했다.","hl":"m"},{"n":29,"text":"자신의 주장이 사회적으로 환영받지 못할 것을 알면서도 책을 통해 그 이론을 세상에 내놓은 코페르니쿠스의 결단력을 알 수 있습니다.","hl":"mn"},{"n":30,"text":"문장 맨 앞의 Despite는 전치사입니다. 비록 ~일지라도라는 뜻을 가졌는데, 뒤에 동사가 없는 명사구 형태가 온다는 것이 특징입니다. 이 자리에 접속사 although를 쓰면 안 된다는 것을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나중에 천문학자들은\u003c/span>\u003cspan class=\"en\">Later astronomers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바탕으로 삼았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">built \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Copernicus의 연구를.\u003c/span>\u003cspan class=\"en\">Copernicus' work.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나중에 천문학자들은 Copernicus의 연구를 바탕으로 삼았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코페르니쿠스가 제시한 혁명적인 이론이 후대 과학자들에 의해 계승되고 확장되는 \u003cb class=\"key\">학문적 \u003c/b>\u003cb class=\"key\">토대\u003c/b>가 되었음을 보여주는 문장입니다. 과학의 발전이 \u003cb class=\"key\">누적적인 \u003c/b>\u003cb class=\"key\">과정\u003c/b>임을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사의 과거형\u003c/span> : build on [동사구] + [목적어] : \"~을 바 lso confirmed, 그는 또한 확증했다. that Copernicus' theory was correct, Copernicus의 이론이 옳았음을. 이 문장 전체를 해석하면, 그는 또한 Copernicus의 이론이 옳았음을 확증했다.","hl":"m"},{"n":41,"text":"망원경을 사용한 갈릴레이의 관측 결과가 코페르니쿠스가 세운 가설의 정당성을 뒷받침해 주었다는 뜻입니다.","hl":"mn"},{"n":42,"text":"여기서 타동사 confirmed 뒤에 나오는 접속사 that은 문장의 목적어 역할을 하는 명사절을 이끕니다. 이 명사절 안에는 주어와 동사가 갖춰진 완전한 문장이 와야 하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수 세기에 걸쳐,\u003c/span>\u003cspan class=\"en\">Over the centuries,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">망원경으로부터 온 과학적 발견과 정보는\u003c/span>\u003cspan class=\"en\">scientific discoveries and information from telescopes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 지식을 전진시켰다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">advanced\u003c/span> our knowledge\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우주가 어떻게 작동하는지에 대한\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">universe \u003c/span>\u003cspan class=\"tgt\">works\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수 세기에 걸쳐, 망원경으로부터 온 과학적 발견과 정보는 우주가 어떻게 작동하는지에 대한 우리의 지식을 전진시켰다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 시간이 흐르며 축적된 과학적 데이터가 인류의 \u003cb class=\"key\">우주 \u003c/b>\u003cb class=\"key\">이해\u003c/b>를 비약적으로 \u003cb class=\"key\">발전\u003c/b>시켰음을 요약하는 결론입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사의 시제\u003c/span> : advanced [타동사 과거형] : \"전진시켰다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : how [의문사] + the universe [주어] + works [동사] : \"우주가 어떻게 작동하는지\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"Over the centuries, 수 세기에 걸쳐. scientific discoveries and information from telescopes, 망원경으로부터 온 과학적 발견과 정보는. advanced our knowledge, 우리의 지식을 전진시켰다. of how the universe works, 우주가 어떻게 작동하는지에 대한. 이 문장 전체를 해석하면, 수 세기에 걸쳐, 망원경으로부터 온 과학적 발견과 정보는 우주가 어떻게 작동하는지에 대한 우리의 지식을 전진시켰다.","hl":"m"},{"n":44,"text":"오랜 세월 동안 망원경을 통해 얻은 수많은 정보 덕분에 인류가 우주의 원리를 더 깊이 알게 되었다는 마무리 문장입니다.","hl":"mn"},{"n":45,"text":"첫 번째로 동사 advanced는 지식이라는 목적어를 가지는 타동사로 쓰여 과거의 성취를 나타냅니다. 두 번째로 전치사 of 뒤에는 간접의문문이 왔는데, 의문사 주어 동사 순서로 우주가 어떻게 작동하는지라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">고대 \u003c/b>\u003cb class=\"key\">문명\u003c/b>은 도구가 없던 시절부터 별의 움직임을 지도로 기록하며 우주를 이해하려 했습니다.\u003c/li>\u003cli>코페르니쿠스는 지구가 태양을 돈다는 \u003cb class=\"key\">혁명적인 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 제기하며 당시의 우주관을 뒤집었습니다.\u003c/li>\u003cli>17세기 초 \u003cb class=\"key\">망원경의 \u003c/b>\u003cb class=\"key\">발전\u003c/b>은 육안 관측의 한계를 넘어서는 기술적 토대를 마련했습니다.\u003c/li>\u003cli>갈릴레이의 관측은 코페르니쿠스의 이론이 \u003cb class=\"key\">정확했음\u003c/b>을 입증했고, 이는 우주에 대한 인류의 \u003cb class=\"key\">지식을 \u003c/b>\u003cb class=\"key\">전진\u003c/b>시켰습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The advancement of astronomical knowledge has been driven by revolutionary theoretical shifts and technological innovations in observation.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">인류는 고대부터 별을 관찰해 왔으며, \u003cb class=\"key\">코페르니쿠스\u003c/b>의 지동설 제안과 \u003cb class=\"key\">갈릴레이\u003c/b>의 \u003cb class=\"key\">망원경\u003c/b>을 통한 실증적 발견을 거쳐 우주에 대한 지식을 확장해 왔다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":46,"text":"오늘 수업에서는 천문학이 어떻게 단순한 관찰에서 과학적 증거를 갖춘 학문으로 발전했는지 알아보았습니다. 특히 도구의 발전이 지식의 진보에 얼마나 큰 영향을 미쳤는지 이해하는 것이 중요해요. 오늘 배운 흐름과 핵심 표현들을 다시 한번 복습하면서 여러분의 지식도 함께 전진하기를 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
