<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>35번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"35번","audioDir":"35_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">35번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>Prioritizing Pet Needs over Owner Desires in Grooming\u003c/h1>\u003ch2>반려동물 관리에 있어서 주인의 욕구보다 동물의 필요를 우선시하기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>반려동물을 돌볼 때 주인의 \u003cb class=\"key\">욕구\u003c/b>보다 동물의 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">필요\u003c/b>를 우선시해야 하며, 특히 잦은 \u003cb class=\"key\">목욕\u003c/b>은 개의 피부 건강을 해칠 수 있음을 강조하는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Pet care should be centered on the animal's actual health needs rather than the owner's preferences, especially regarding the frequency of bathing.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘은 반려동물을 돌보는 우리의 자세에 대해 이야기해 볼 거예요. 글의 제목은 주인의 욕구보다 동물의 필요를 우선시하기입니다. 우리가 흔히 하는 실수를 짚어보며 진정한 반려동물 관리가 무엇인지 살펴볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">반려동물의 피부는 사람보다 훨씬 \u003cb class=\"key\">예민\u003c/b>하고 얇아서 외부 자극에 취약합니다. 특히 강아지의 피부는 약알칼리성을 띠고 있어 세균 번식에 취약하며, 잦은 샴푸질은 피부를 보호하는 \u003cb class=\"key\">천연 \u003c/b>\u003cb class=\"key\">유분\u003c/b>을 제거해 건조증이나 피부염을 유발할 수 있습니다. 이를 \u003cb class=\"key\">피부 \u003c/b>\u003cb class=\"key\">장벽(Skin \u003c/b>\u003cb class=\"key\">Barrier)\u003c/b> 손상이라고 합니다. 마치 사람의 \u003cb class=\"key\">세수\u003c/b>를 너무 자주 하면 얼굴이 당기고 따가운 것과 같은 원리입니다. 수의 피부과 전문의들은 \u003cb class=\"key\">과도한 \u003c/b>\u003cb class=\"key\">세정\u003c/b>이 오히려 피부 면역력을 떨어뜨린다고 조언합니다.\u003c/div>","segs":[{"n":2,"text":"강아지의 피부는 사람과 달리 매우 예민하고 얇다는 사실 알고 계셨나요? 샴푸를 너무 자주 사용하면 피부를 보호하는 천연 유분이 사라져서 피부 장벽이 손상될 수 있습니다. 마치 우리가 세수를 너무 많이 하면 얼굴이 당기는 것과 비슷해요. 수의 피부과 전문의들은 과도한 세정이 오히려 피부 질환을 부를 수 있다고 경고하죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>핵심 기준 제시\u003csmall>주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>반려동물을 돌보는 일에서 가장 중요한 \u003cb class=\"key\">기준\u003c/b>은 주인의 편의나 바람이 아니라 동물의 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">필요\u003c/b>와 그들에게 미치는 \u003cb class=\"key\">영향\u003c/b>이어야 함을 명시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>잘못된 관행의 예시\u003csmall>예시 · 문장 3\u003c/small>\u003c/h4>\u003cp>주인들은 \u003cb class=\"key\">냄새\u003c/b>를 없애려 자주 목욕을 시키지만, \u003cb class=\"key\">수의 \u003c/b>\u003cb class=\"key\">피부과 \u003c/b>\u003cb class=\"key\">전문의\u003c/b>들은 그것이 개의 피부 건강에 좋지 않다고 \u003cb class=\"key\">경고\u003c/b>하는 상충하는 상황을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>구체적인 대안 제시\u003csmall>근거 · 문장 4\u003c/small>\u003c/h4>\u003cp>냄새가 고민이라면 \u003cb class=\"key\">물 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">샴푸\u003c/b>나 \u003cb class=\"key\">매일 \u003c/b>\u003cb class=\"key\">빗질\u003c/b>을 활용하되, 실제 목욕 횟수는 일주일에 \u003cb class=\"key\">한두 \u003c/b>\u003cb class=\"key\">번\u003c/b> 이하로 줄일 것을 제안합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>적정 목욕 주기 권고\u003csmall>결론 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>특별한 \u003cb class=\"key\">의학적 \u003c/b>\u003cb class=\"key\">처방\u003c/b>이 없는 한, 털이 굵은 개라도 보통 \u003cb class=\"key\">6~8주\u003c/b> 간격의 목욕이면 충분하다는 사실을 밝히며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 우리가 가져야 할 올바른 기준을 먼저 제시하고 구체적인 사례와 해결책으로 이어지는 구조를 가지고 있습니다.","hl":null},{"n":4,"text":"먼저 첫 번째와 두 번째 문장에서는 반려동물 관리의 핵심 기준이 주인의 욕구가 아닌 동물의 실제 필요가 되어야 한다고 강조합니다.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 냄새를 피하려고 잦은 목욕을 시키는 잘못된 관행이 개의 피부 건강에 해롭다는 점을 예로 들어 설명하죠.","hl":"f1"},{"n":6,"text":"이어서 네 번째 문장은 물 없는 샴푸나 매일 빗질이라는 훌륭한 대안을 제시하며 목욕 횟수를 제한하라고 권고합니다.","hl":"f2"},{"n":7,"text":"마지막으로 다섯 번째와 여섯 번째 문장은 특별한 처방이 없다면 주기적인 목욕은 필요 없으며 6주에서 8주 정도면 충분하다는 결론을 내립니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">1~2번 문장에서 반려동물 케어의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">기준\u003c/b>을 제시하며 글을 시작합니다. 이후 3번 문장에서 주인의 욕구로 인한 \u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">관행\u003c/b>을 사례로 들어 반박합니다. 마지막으로 구체적인 \u003cb class=\"key\">해결책\u003c/b>과 적정 목욕 주기를 제시하며 주장을 뒷받침합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (3)\u003c/b>\u003cspan>구체적 사례 도입\u003c/span>\u003cb>but (3)\u003c/b>\u003cspan>전문가의 반대 입장 대조\u003c/span>\u003cb>If (4)\u003c/b>\u003cspan>대안 제시를 위한 조건\u003c/span>\u003cb>Unless (5)\u003c/b>\u003cspan>예외적인 의학적 상황 설정\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">how we care for our pets\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">what they actually need\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bathe their dogs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">such practices\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">baths\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">medicated baths\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>What I want (Owner)\u003c/th>\u003cth>What they actually need (Pet)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Avoid 'doggy' smell\u003c/td>\u003ctd>Healthy skin condition\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Frequent bathing (Religiously)\u003c/td>\u003ctd>Bathing every 6 to 8 weeks\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음에 주제를 던지는 전형적인 두괄식 구조를 취하고 있어요. 주장과 근거가 명확하게 드러나며 문제 상황에 대한 해결책까지 제시하고 있죠. 첫 번째 문장의 당위성을 나타내는 표현이 글 전체의 방향을 결정하고 있습니다.","hl":"ty"},{"n":9,"text":"지문 속 신호어들을 잘 보세요. For example로 구체적인 예시를 시작하고 있고, but을 통해 전문가의 경고라는 대조적인 입장을 보여줍니다. 또한 Unless를 사용하여 예외적인 상황을 명확히 구분해주고 있네요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>criterion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기준\u003c/span>\u003c/div>\u003cdiv>\u003cb>care for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>actually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>impact\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rather than\u003c/b>\u003cem>전치사구\u003c/em>\u003cspan>~보다는\u003c/span>\u003c/div>\u003cdiv>\u003cb>encounter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>마주치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>owner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주인\u003c/span>\u003c/div>\u003cdiv>\u003cb>bathe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>목욕시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>religiously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>계율을 지키듯이, 철저하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>multiple times\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>여러 번\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>doggy smell\u003c/b>\u003cem>명사구\u003c/em>\u003cspan>개 냄새\u003c/span>\u003c/div>\u003cdiv>\u003cb>veterinary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수의학의\u003c/span>\u003c/div>\u003cdiv>\u003cb>dermatologist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>피부과 전문의\u003c/span>\u003c/div>\u003cdiv>\u003cb>warn against\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대해 경고하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>practice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관행, 습관\u003c/span>\u003c/div>\u003cdiv>\u003cb>concerned about\u003c/b>\u003cem>형용사구\u003c/em>\u003cspan>~에 대해 걱정하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>waterless shampoo\u003c/b>\u003cem>명사구\u003c/em>\u003cspan>물이 필요 없는 샴푸\u003c/span>\u003c/div>\u003cdiv>\u003cb>thoroughly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>철저히, 충분히\u003c/span>\u003c/div>\u003cdiv>\u003cb>brush\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빗질하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at most\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>기껏해야\u003c/span>\u003c/div>\u003cdiv>\u003cb>unless\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하지 않는다면\u003c/span>\u003c/div>\u003cdiv>\u003cb>condition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상태, 질환\u003c/span>\u003c/div>\u003cdiv>\u003cb>prescribe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>처방하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>medicated bath\u003c/b>\u003cem>명사구\u003c/em>\u003cspan>약욕(약물을 푼 물에 하는 목욕)\u003c/span>\u003c/div>\u003cdiv>\u003cb>on a regular basis\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>주기적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>thick\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>빽빽한, 두꺼운\u003c/span>\u003c/div>\u003cdiv>\u003cb>generally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>일반적으로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 religiously라는 단어는 종교적으로라는 뜻보다는 계율을 지키듯이 아주 철저하게라는 의미로 쓰였어요. dermatologist는 피부과 전문의라는 뜻이고, prescribe는 약 등을 처방하다라는 중요한 동사입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">criterion\u003c/b>\u003cspan class=\"m\">기준\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">standard\u003c/span>\u003cspan class=\"s\">measure\u003c/span>\u003cspan class=\"s\">benchmark\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">religiously\u003c/b>\u003cspan class=\"m\">철저하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">faithfully\u003c/span>\u003cspan class=\"s\">conscientiously\u003c/span>\u003cspan class=\"s\">scrupulously\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">irregularly\u003c/span>\u003cspan class=\"a\">casually\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">avoid\u003c/b>\u003cspan class=\"m\">피하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shun\u003c/span>\u003cspan class=\"s\">evade\u003c/span>\u003cspan class=\"s\">escape\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">seek\u003c/span>\u003cspan class=\"a\">confront\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">thoroughly\u003c/b>\u003cspan class=\"m\">철저히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">completely\u003c/span>\u003cspan class=\"s\">exhaustively\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">partially\u003c/span>\u003cspan class=\"a\">superficially\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">prescribe\u003c/b>\u003cspan class=\"m\">처방하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ordain\u003c/span>\u003cspan class=\"s\">dictate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prohibit\u003c/span>\u003cspan class=\"a\">ban\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"criterion은 기준이라는 뜻으로 standard와 바꿔 쓸 수 있습니다. 잦은 목욕을 뜻할 때 쓴 regular는 주기적인이라는 의미로 routine과 비슷하고, 반대말은 irregular가 되겠네요. prescribe는 처방하다라는 뜻인데, 금지하다라는 의미의 prohibit과 반대로 생각하면 쉽습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 첫 번째 기준은\u003c/span>\u003cspan class=\"en\">Our number one criterion\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 우리의 반려동물을 어떻게 돌보는지에 대한\u003c/span>\u003cspan class=\"en\">for \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">care \u003c/span>\u003cspan class=\"tgt\">for\u003c/span> our pets\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘이것이 ~인가?’가 되어야 한다\u003c/span>\u003cspan class=\"en\">should be, &quot;Is this\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 실제로 필요한 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">actually \u003c/span>\u003cspan class=\"tgt\">need\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 우리의 반려동물을 어떻게 돌보는지에 대한 우리의 첫 번째 기준은 ‘내가 무엇을 원하는가?’보다는 ‘이것이 그들이 실제로 필요한 것인가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 반려동물 케어에서 가장 중요한 \u003cb class=\"key\">기준\u003c/b>이 무엇인지 화두를 던지며, 주인의 욕심이 아닌 동물의 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">필요\u003c/b>를 고려해야 함을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : how [의문사] + we [주어] + care for [동사] : \"우리가 돌보는 방식\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">\u003c/span> : what [관계대명사] + they [주어] + need [동사] : \"그들이 실제로 필요한 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Our number one criterion, 우리의 첫 번째 기준은. for how we care for our pets, 우리가 우리의 반려동물을 어떻게 돌보는지에 대한. should be, \"Is this, ‘이것이 ~인가?’가 되어야 한다. what they actually need?, 그들이 실제로 필요한 것. 이 문장 전체를 해석하면, 우리가 우리의 반려동물을 어떻게 돌보는지에 대한 우리의 첫 번째 기준은 ‘내가 무엇을 원하는가?’보다는 ‘이것이 그들이 실제로 필요한 것인가?","hl":"m"},{"n":13,"text":"반려동물을 돌볼 때 우리가 가장 먼저 생각해야 할 기준을 제시하는 문장입니다. 내 욕심이 아니라 반려동물에게 정말로 필요한 것이 무엇인지를 고민해야 한다는 것이죠.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 전치사 for 뒤에 온 간접의문문입니다. 의문사 주어 동사 어순으로 쓰여 명사절 역할을 하고 있죠. 두 번째는 관계대명사 what입니다. 선행사를 포함하고 있어서 ~하는 것이라고 해석하며 문장의 보어 자리에 왔습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 어떻게\u003c/span>\u003cspan class=\"en\">How is it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게 영향을 미치고 있는가?’\u003c/span>\u003cspan class=\"en\">impacting them?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘~보다는’\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 무엇을 원하는가?\u003c/span>\u003cspan class=\"en\">&quot;What do I want?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것이 그들에게 어떻게 영향을 미치고 있는가?’가 되어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인의 주관적인 \u003cb class=\"key\">욕구\u003c/b>와 반려동물에게 미치는 객관적인 \u003cb class=\"key\">영향\u003c/b>을 대조하여, 올바른 보살핌의 방향을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : A rather than B : \"B라기보다는 A\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"How is it, 그것이 어떻게. impacting them?\", 그들에게 영향을 미치고 있는가?’. rather than, ‘~보다는’. \"What do I want?\", 내가 무엇을 원하는가?. 이 문장 전체를 해석하면, 그것이 그들에게 어떻게 영향을 미치고 있는가?’가 되어야 한다.","hl":"m"},{"n":16,"text":"앞 문장에 이어지는 질문입니다. 주인의 단순한 바람보다는 그 행동이 동물에게 어떤 결과를 초래하는지 그 영향력을 따져봐야 한다는 뜻입니다.","hl":"mn"},{"n":17,"text":"여기서 핵심은 rather than 표현입니다. A rather than B 구조로 이해하면 되는데, 뒤에 나오는 주인의 욕구보다 앞에 나온 동물의 영향이 더 중요하다는 점을 대조하여 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 우리는 마주쳐왔다\u003c/span>\u003cspan class=\"en\">For example, we have encountered\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계율을 지키듯이 그들의 개를 목욕시키는 많은 반려동물 주인들을\u003c/span>\u003cspan class=\"en\">many dog owners \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">bathe\u003c/span> their dogs religiously\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일주일에 여러 번\u003c/span>\u003cspan class=\"en\">multiple times a week\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 ‘개’ 냄새를 피하고 싶기 때문에\u003c/span>\u003cspan class=\"en\">because they want to avoid the 'doggy' smell,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수의 피부과 전문의는 그러한 관행에 대해 경고한다\u003c/span>\u003cspan class=\"en\">but veterinary dermatologists warn against such practices,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 개의 피부에 좋지 않기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as\u003c/span> they are not good for a dog's skin.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 그들은 ‘개’ 냄새를 피하고 싶기 때문에 일주일에 여러 번 계율을 지키듯이 그들의 개를 목욕시키는 많은 반려동물 주인들을 마주쳐왔지만 수의 피부과 전문의는 그것들이 개의 피부에 좋지 않기 때문에 그러한 관행에 대해 경고한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과도한 목욕이라는 구체적인 \u003cb class=\"key\">사례\u003c/b>를 들어, 주인의 욕심이 반려동물의 \u003cb class=\"key\">건강\u003c/b>에 해로울 수 있다는 점을 입증합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : owners [선행사] + who [주격 관계대명사] + bathe [동사] : \"목욕시키는 주인들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">\u003c/span> : as + 주어 + 동사 : \"~이기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"For example, we have encountered, 예를 들어, 우리는 마주쳐왔다. many dog owners who bathe their dogs religiously, 계율을 지키듯이 그들의 개를 목욕시키는 많은 반려동물 주인들을. multiple times a week, 일주일에 여러 번. because they want to avoid the 'doggy' smell, 그들은 ‘개’ 냄새를 피하고 싶기 때문에. but veterinary dermatologists warn against such practices, 수의 피부과 전문의는 그러한 관행에 대해 경고한다. as they are not good for a dog's skin, 그것들이 개의 피부에 좋지 않기 때문에. 이 문장 전체를 해석하면, 예를 들어, 그들은 ‘개’ 냄새를 피하고 싶기 때문에 일주일에 여러 번 계율을 지키듯이 그들의 개를 목욕시키는 많은 반려동물 주인들을 마주쳐왔지만 수의 피부과 전문의는 그것들이 개의 피부에 좋지 않기 때문에 그러한 관행에 대해 경고한다.","hl":"m"},{"n":19,"text":"주인의 편의나 취향 때문에 동물에게 좋지 않은 행동을 하는 사례가 나옵니다. 냄새가 싫어서 너무 자주 씻기는 것이 오히려 개의 피부에는 해롭다는 전문가의 의견을 덧붙이고 있죠.","hl":"mn"},{"n":20,"text":"먼저 many dog owners를 수식하는 주격 관계대명사 who가 보이죠. 이들이 하는 구체적인 행동을 설명해 줍니다. 마지막 부분의 as는 이유를 나타내는 접속사로, 왜 전문가들이 경고하는지를 설명해 주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 누군가가 정말로 걱정한다면\u003c/span>\u003cspan class=\"en\">If someone is really concerned\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 개의 냄새에 대해\u003c/span>\u003cspan class=\"en\">about their dog's smell\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 물이 필요 없는 샴푸를 사용할 수 있고\u003c/span>\u003cspan class=\"en\">they can use waterless shampoo\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매일 충분히 그들의 개를 빗질해줄 수 있지만\u003c/span>\u003cspan class=\"en\">and thoroughly brush their dog every day\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">목욕은 ~로 제한해야 한다\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">baths \u003c/span>\u003cspan class=\"tgt\">down \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기껏해야 일주일에 한두 번으로.\u003c/span>\u003cspan class=\"en\">once or twice a week at most.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 누군가가 그들의 개의 냄새에 대해 정말로 걱정한다면, 그들은 물이 필요 없는 샴푸를 사용할 수 있고 매일 충분히 그들의 개를 빗질해줄 수 있지만, 목욕은 기껏해야 일주일에 한두 번으로 제한해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 반려견의 냄새를 제거하기 위해 빈번한 목욕 대신 선택할 수 있는 실질적인 \u003cb class=\"key\">대안적인 \u003c/b>\u003cb class=\"key\">해결책\u003c/b>을 제시합니다. 개의 피부 건강을 위해 목욕 횟수를 최소한으로 \u003cb class=\"key\">제한\u003c/b>할 것을 권장하는 맥락입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사 keep down to\u003c/span> : keep + [목적어] + down to + [수치/정도] : \"목욕을 ~로 제한하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">조동사 뒤 동사원형의 병렬 구조\u003c/span> : can + [V1 (use)] + [V2 (brush)] + but + [V3 (keep)] : \"사용하고 빗질해줄 수 있지만 제한해야 한다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"If someone is really concerned, 만약 누군가가 정말로 걱정한다면. about their dog's smell, 그들의 개의 냄새에 대해. they can use waterless shampoo, 그들은 물이 필요 없는 샴푸를 사용할 수 있고. and thoroughly brush their dog every day, 매일 충분히 그들의 개를 빗질해줄 수 있지만. but keep the baths down to, 목욕은 ~로 제한해야 한다. once or twice a week at most, 기껏해야 일주일에 한두 번으로.. 이 문장 전체를 해석하면, 만약 누군가가 그들의 개의 냄새에 대해 정말로 걱정한다면, 그들은 물이 필요 없는 샴푸를 사용할 수 있고 매일 충분히 그들의 개를 빗질해줄 수 있지만, 목욕은 기껏해야 일주일에 한두 번으로 제한해야 한다.","hl":"m"},{"n":22,"text":"개의 냄새가 걱정될 때 무조건 자주 씻기기보다 대안적인 해결책을 찾으라는 조언이에요. 목욕 횟수를 제한하여 개의 건강을 지키는 것이 핵심입니다.","hl":"mn"},{"n":23,"text":"먼저 조동사 can 뒤에 use, brush, 그리고 keep이 병렬 구조로 연결되어 할 수 있는 행동 세 가지를 나열하고 있어요. keep down to는 횟수를 특정 수준으로 억제하거나 제한한다는 뜻입니다. 마지막에 쓰인 at most는 기껏해야라는 뜻으로 횟수의 최대치를 못 박아 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 피부 상태를 가지고 있지 않는다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Unless\u003c/span> they have a skin condition\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수의사가 약욕을 처방한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">which\u003c/span> a vet has prescribed medicated baths,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 개는 필요가 없다\u003c/span>\u003cspan class=\"en\">most dogs don't need\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주기적으로 목욕시켜질.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">bathed\u003c/span> on a regular basis.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들이 수의사가 약욕을 처방한 피부 상태를 가지고 있지 않는다면, 대부분의 개는 주기적으로 목욕시켜질 ‘필요’가 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 특수한 \u003cb class=\"key\">의학적 \u003c/b>\u003cb class=\"key\">사유\u003c/b>가 있는 경우를 제외하고는, 인간의 편의를 위한 정기적인 목욕이 실제로는 개에게 \u003cb class=\"key\">불필요\u003c/b>하다는 점을 분명히 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사절 접속사(부정 조건)\u003c/span> : Unless + [주어] + [동사] (= If ~ not) : \"~하지 않는다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 관계대명사\u003c/span> : [선행사(condition)] + [for which] + [완전한 문장] : \"그 피부 상태를 위해 (~가 처방한)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 수동태\u003c/span> : need + [to be p.p.] : \"목욕시켜질 (필요)\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Unless they have a skin condition, 그들이 피부 상태를 가지고 있지 않는다면. for which a vet has prescribed medicated baths, 수의사가 약욕을 처방한. most dogs don't need, 대부분의 개는 필요가 없다. to be bathed on a regular basis, 주기적으로 목욕시켜질.. 이 문장 전체를 해석하면, 그들이 수의사가 약욕을 처방한 피부 상태를 가지고 있지 않는다면, 대부분의 개는 주기적으로 목욕시켜질 ‘필요’가 없다.","hl":"m"},{"n":25,"text":"특별한 의학적 사유가 있는 게 아니라면, 사람이 정해놓은 주기대로 목욕을 시킬 필요가 없다는 뜻입니다. 개의 입장에서 생각해보라는 것이죠.","hl":"mn"},{"n":26,"text":"접속사 Unless는 ~하지 않는다면이라는 부정의 조건을 나타내고요. for which 부분은 수의사가 그 피부 상태를 위해 처방했다는 의미로 선행사 skin condition을 꾸며줍니다. 마지막으로 개는 씻겨지는 존재니까 to be bathed라는 수동태 형태의 부정사를 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 빽빽하고 무거운 털이 있는 개조차도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Even \u003c/span>\u003cspan class=\"tgt\">dogs \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">thick, \u003c/span>\u003cspan class=\"tgt\">heavy \u003c/span>\u003cspan class=\"tgt\">coats\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반적으로 오직 목욕을 필요로 한다\u003c/span>\u003cspan class=\"en\">generally only need baths\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">6주에서 8주마다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">6 \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">8 \u003c/span>\u003cspan class=\"tgt\">weeks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심지어 빽빽하고 무거운 털이 있는 개조차도 일반적으로 오직 6주에서 8주마다 목욕을 필요로 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 목욕이 자주 필요해 보이는 \u003cb class=\"key\">이례적인 \u003c/b>\u003cb class=\"key\">사례\u003c/b>인 털이 많은 개들조차도, 실제로는 인간의 생각보다 훨씬 긴 \u003cb class=\"key\">주기\u003c/b>의 목욕으로 충분하다는 근거를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수식어를 동반한 명사구 주어\u003c/span> : Even + [명사(dogs)] + [전치사구(with ~)] : \"빽빽하고 무거운 털을 가진 개들조차도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">반복되는 주기를 나타내는 every\u003c/span> : every + [기수] + [복수명사] : \"6주에서 8주마다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Even dogs with thick, heavy coats, 심지어 빽빽하고 무거운 털이 있는 개조차도. generally only need baths, 일반적으로 오직 목욕을 필요로 한다. every 6 to 8 weeks, 6주에서 8주마다.. 이 문장 전체를 해석하면, 심지어 빽빽하고 무거운 털이 있는 개조차도 일반적으로 오직 6주에서 8주마다 목욕을 필요로 한다.","hl":"m"},{"n":28,"text":"털이 아주 많아서 금방 더러워질 것 같은 개들조차도 실제로는 두 달 가까운 긴 주기로 목욕해도 충분하다는 객관적 사실을 보여줍니다.","hl":"mn"},{"n":29,"text":"주어 부분에 Even을 써서 이런 경우조차도 그렇다며 강조하고 있어요. with thick, heavy coats는 개들의 특징을 설명하는 수식어고요. 마지막에 every는 ~마다라는 뜻으로 쓰여 목욕 주기를 구체적으로 나타내고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>반려동물 관리의 기준은 주인의 \u003cb class=\"key\">욕구\u003c/b>가 아니라 동물의 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">필요\u003c/b>와 안녕이어야 합니다.\u003c/li>\u003cli>냄새를 없애려는 \u003cb class=\"key\">잦은 \u003c/b>\u003cb class=\"key\">목욕\u003c/b>은 개의 \u003cb class=\"key\">피부 \u003c/b>\u003cb class=\"key\">건강\u003c/b>을 해칠 수 있으므로 주의해야 합니다.\u003c/li>\u003cli>\u003cb class=\"key\">물 \u003c/b>\u003cb class=\"key\">없는 \u003c/b>\u003cb class=\"key\">샴푸\u003c/b>와 \u003cb class=\"key\">매일 \u003c/b>\u003cb class=\"key\">빗질\u003c/b>은 목욕 횟수를 줄이면서도 청결을 유지하는 좋은 대안입니다.\u003c/li>\u003cli>의학적 처방이 없는 한 대부분의 개는 \u003cb class=\"key\">6주에서 \u003c/b>\u003cb class=\"key\">8주\u003c/b> 정도의 긴 목욕 주기로도 충분합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Pet care should be centered on the animal's actual health needs rather than the owner's preferences, especially regarding the frequency of bathing.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">반려동물을 돌볼 때 주인의 \u003cb class=\"key\">욕구\u003c/b>보다 동물의 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">필요\u003c/b>를 우선시해야 하며, 특히 잦은 \u003cb class=\"key\">목욕\u003c/b>은 개의 피부 건강을 해칠 수 있음을 강조하는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 배운 내용을 정리하자면 반려동물을 돌볼 때는 우리의 편의보다는 그들의 건강을 먼저 생각해야 한다는 것입니다. 특히 피부 건강을 위해 과도한 목욕은 피하고 빗질을 자주 해주는 것이 좋겠네요. 오늘 분석한 내용 복습 철저히 하시고 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
