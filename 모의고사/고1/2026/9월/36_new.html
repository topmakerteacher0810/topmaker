<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>36번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"36번","audioDir":"36_new_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">36번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>Mathematics: The Science of Patterns and Logic\u003c/h1>\u003ch2>수학: 패턴과 논리의 학문\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>수학의 본질은 숫자가 아니라 \u003cb class=\"key\">패턴과 \u003c/b>\u003cb class=\"key\">구조\u003c/b>에 있으며, 스도쿠처럼 숫자를 사용하지만 \u003cb class=\"key\">논리적 \u003c/b>\u003cb class=\"key\">추론\u003c/b>을 바탕으로 하는 활동은 모두 수학에 해당합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Mathematics is fundamentally defined by patterns and logical structures rather than numerical calculation, as demonstrated by the logic of Sudoku.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 우리가 흔히 오해하고 있는 수학의 진짜 정체에 대해 이야기해 볼 거예요. 서른여섯 번째 지문은 수학이 숫자를 계산하는 게 아니라 패턴을 다루는 학문이라는 점을 강조하고 있죠. 스도쿠라는 친숙한 예시를 통해 수학의 본질이 무엇인지 함께 파헤쳐 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">많은 사람들은 수학을 복잡한 연산이나 숫자를 다루는 학문으로만 생각하지만, 현대 수학의 핵심은 대상 간의 \u003cb class=\"key\">관계와 \u003c/b>\u003cb class=\"key\">질서\u003c/b>를 탐구하는 것입니다. 수학자들은 숫자 그 자체보다 숫자가 이루는 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">구조(abstract \u003c/b>\u003cb class=\"key\">structure)\u003c/b>에 더 큰 관심을 가집니다. 스도쿠(Sudoku)는 1부터 9까지의 숫자를 채워 넣는 게임이지만, 사실 덧셈이나 뺄셈 같은 \u003cb class=\"key\">산술(arithmetic)\u003c/b>이 전혀 필요하지 않은 게임입니다. 숫자는 단지 자리를 구별하기 위한 \u003cb class=\"key\">기호(symbol)\u003c/b>의 역할을 할 뿐이며, 퍼즐을 푸는 과정은 전적으로 \u003cb class=\"key\">연역적 \u003c/b>\u003cb class=\"key\">추론(deductive \u003c/b>\u003cb class=\"key\">reasoning)\u003c/b>에 기반합니다. 마치 악보를 읽는 법이 음악의 전부는 아니듯, 숫자를 다루는 법이 수학의 전부가 아님을 이해하는 것이 중요합니다.\u003c/div>","segs":[{"n":2,"text":"여러분은 수학 하면 무엇이 먼저 떠오르나요? 아마 복잡한 수식이나 계산이 생각날 텐데, 사실 수학은 대상들 사이의 규칙이나 구조를 찾는 학문에 가깝습니다. 지문에서 언급된 스도쿠도 사실 숫자 계산이 전혀 필요 없어요. 숫자는 그저 자리를 표시하는 기호일 뿐이고, 문제를 푸는 건 순전히 논리적인 추론과 관계를 파악하는 과정이죠. 이 배경을 이해하면 오늘 지문이 훨씬 쉽게 읽힐 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>수학의 정의\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>수학의 핵심 관심사가 숫자가 아닌 \u003cb class=\"key\">패턴과 \u003c/b>\u003cb class=\"key\">구조\u003c/b>임을 정의하고, 이를 설명하기 위해 \u003cb class=\"key\">스도쿠 \u003c/b>\u003cb class=\"key\">퍼즐\u003c/b>을 예로 듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>스도쿠의 규칙과 본질\u003csmall>설명 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>스도쿠의 목표를 설명하며, 숫자의 수치적 값은 \u003cb class=\"key\">무관함\u003c/b>을 강조하고 중요한 것은 오직 \u003cb class=\"key\">패턴\u003c/b>임을 밝힙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>수학에 대한 대중적 거부감\u003csmall>통념 지적 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>수학이라는 단어가 주는 \u003cb class=\"key\">거부감\u003c/b> 때문에, 신문사들이 스도쿠를 홍보할 때 수학과 관련 없다고 \u003cb class=\"key\">거짓 \u003c/b>\u003cb class=\"key\">강조\u003c/b>하는 현상을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>비유를 통한 반박과 결론\u003csmall>주장 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>예술과 기술을 분리할 수 없듯이 수학과 논리도 분리될 수 없음을 \u003cb class=\"key\">미술관 \u003c/b>\u003cb class=\"key\">비유\u003c/b>로 꼬집으며, 스도쿠가 곧 \u003cb class=\"key\">수학\u003c/b>임을 결론짓습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 수학의 정의에서 시작해 스도쿠라는 구체적인 사례를 거쳐 수학에 대한 우리의 편견을 꼬집는 흐름으로 진행됩니다.","hl":null},{"n":4,"text":"먼저 수학의 주요 관심사가 숫자가 아니라 패턴, 구조, 대칭, 그리고 연결이라는 정의를 내리며 시작합니다. 그리고 우리 주변에서 쉽게 볼 수 있는 스도쿠 퍼즐을 그 구체적인 예시로 제시하고 있죠.","hl":"f0"},{"n":5,"text":"스도쿠의 목표는 격자를 채우는 것인데, 여기서 중요한 포인트는 숫자의 수치적 값은 전혀 중요하지 않다는 거예요. 숫자가 아니라 글자나 모양이 있어도 상관없다는 점을 통해 중요한 것은 오직 패턴이라는 점을 명확히 합니다.","hl":"f1"},{"n":6,"text":"그런데 흥미롭게도 어떤 신문은 수학이라는 단어가 주는 거부감을 피하려고 스도쿠에 수학이 없다는 식으로 광고합니다. 사람들이 수학이라는 말만 들어도 겁을 먹고 도망칠까 봐 걱정하는 모습이 참 아이러니하죠.","hl":"f2"},{"n":7,"text":"마지막으로 저자는 이를 국립 미술관 홍보에 비유하며 비판합니다. 그림과 조각이 있는데 예술이 없다는 말이 성립하지 않듯이, 추론과 논리를 사용하는 스도쿠가 수학이 아닐 리 없다는 결론을 내리며 우리 모두가 수학을 할 수 있다고 응원합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비유와 예시\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">1번 문장에서 수학의 정의를 \u003cb class=\"key\">패턴\u003c/b>으로 규정한 후, 마지막 문장에서 스도쿠가 곧 \u003cb class=\"key\">수학적 \u003c/b>\u003cb class=\"key\">활동\u003c/b>임을 다시 한번 강조합니다. 숫자가 수치적 의미가 없는 \u003cb class=\"key\">기호\u003c/b>일 뿐이라는 점을 근거로 활용하며, 수학에 대한 사람들의 \u003cb class=\"key\">고정관념\u003c/b>을 깨뜨리는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Take, for example (2)\u003c/b>\u003cspan>구체적 사례 도입\u003c/span>\u003cb>But (4)\u003c/b>\u003cspan>수치적 가치에 대한 통념 뒤집기\u003c/span>\u003cb>It's ... that (6)\u003c/b>\u003cspan>패턴의 중요성 강조\u003c/span>\u003cb>If ... , you can ... (10)\u003c/b>\u003cspan>조건문을 통한 최종 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">numbers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">given numbers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">numerical values\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">digits\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">symbols\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">letters\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">shapes\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Numerical values / Arithmetic\u003c/th>\u003cth>Patterns / Logic / Reasoning\u003c/th>\u003c/tr>\u003ctr>\u003ctd>계산의 대상이 되는 숫자\u003c/td>\u003ctd>추론의 대상이 되는 구조와 대칭\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사람들이 겁을 먹는 수학의 이미지\u003c/td>\u003ctd>스도쿠처럼 즐기는 실제 수학의 본질\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 첫 문장에서 수학의 정의를 내리고 마지막 문장에서 스도쿠가 수학임을 다시 강조하는 양괄식 구조를 가지고 있어요. 특히 주장과 근거 전개 방식을 사용해서, 스도쿠라는 친숙한 예시를 통해 수학의 넓은 의미를 설득력 있게 전달하고 있습니다.","hl":"ty"},{"n":9,"text":"두 번째 문장의 Take for example은 예시를 보여주는 전형적인 신호어입니다. 네 번째 문장의 But은 숫자에 대한 우리의 고정관념을 뒤집는 전환의 역할을 하고요. 여섯 번째 문장은 It is that 강조 구문을 써서 패턴의 중요성을 아주 강하게 전달하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>central concerns\u003c/b>\u003cem>명사구\u003c/em>\u003cspan>주요 관심사\u003c/span>\u003c/div>\u003cdiv>\u003cb>symmetries\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대칭\u003c/span>\u003c/div>\u003cdiv>\u003cb>objective\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목표\u003c/span>\u003c/div>\u003cdiv>\u003cb>grid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>격자\u003c/span>\u003c/div>\u003cdiv>\u003cb>clues\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단서\u003c/span>\u003c/div>\u003cdiv>\u003cb>ensuring\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확실하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>column\u003c/b>\u003cem>명사\u003c/em>\u003cspan>열\u003c/span>\u003c/div>\u003cdiv>\u003cb>digits\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숫자\u003c/span>\u003c/div>\u003cdiv>\u003cb>once and only once\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>한 번씩 그리고 오직 한 번만\u003c/span>\u003c/div>\u003cdiv>\u003cb>numerical values\u003c/b>\u003cem>명사구\u003c/em>\u003cspan>수치적인 값\u003c/span>\u003c/div>\u003cdiv>\u003cb>irrelevant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관련이 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>distinct\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>별개의\u003c/span>\u003c/div>\u003cdiv>\u003cb>symbols\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기호\u003c/span>\u003c/div>\u003cdiv>\u003cb>matters\u003c/b>\u003cem>동사\u003c/em>\u003cspan>중요하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>statement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문구, 진술\u003c/span>\u003c/div>\u003cdiv>\u003cb>involved\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관련된\u003c/span>\u003c/div>\u003cdiv>\u003cb>reasoning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>추론\u003c/span>\u003c/div>\u003cdiv>\u003cb>spoiled\u003c/b>\u003cem>동사\u003c/em>\u003cspan>더럽히다, 망치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>scare off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>겁주어 쫓아버리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>potential\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잠재적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>promotion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>홍보\u003c/span>\u003c/div>\u003cdiv>\u003cb>exhibition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전시회\u003c/span>\u003c/div>\u003cdiv>\u003cb>slogan\u003c/b>\u003cem>명사\u003c/em>\u003cspan>슬로건\u003c/span>\u003c/div>\u003cdiv>\u003cb>painting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그림\u003c/span>\u003c/div>\u003cdiv>\u003cb>sculpture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조각\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어를 살펴보면, 관련이 없다는 뜻의 irrelevant가 핵심적입니다. 숫자의 계산적 가치가 퍼즐과 무관하다는 뜻이죠. 또한 reasoning과 logic은 추론과 논리라는 뜻으로, 이 지문에서 수학의 본질을 나타내는 아주 중요한 키워드입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">central\u003c/b>\u003cspan class=\"m\">주요한, 중심적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">primary\u003c/span>\u003cspan class=\"s\">pivotal\u003c/span>\u003cspan class=\"s\">core\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">peripheral\u003c/span>\u003cspan class=\"a\">marginal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">irrelevant\u003c/b>\u003cspan class=\"m\">관련이 없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unrelated\u003c/span>\u003cspan class=\"s\">immaterial\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relevant\u003c/span>\u003cspan class=\"a\">pertinent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distinct\u003c/b>\u003cspan class=\"m\">별개의, 뚜렷한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">separate\u003c/span>\u003cspan class=\"s\">discrete\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">involved\u003c/b>\u003cspan class=\"m\">관련된, 포함된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">included\u003c/span>\u003cspan class=\"s\">associated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">excluded\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">spoiled\u003c/b>\u003cspan class=\"m\">망가진, 손상된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ruined\u003c/span>\u003cspan class=\"s\">damaged\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">preserved\u003c/span>\u003cspan class=\"a\">enhanced\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 챙겨볼까요? 중심적인이라는 뜻의 central은 pivotal과 의미가 비슷하고 주변의라는 뜻의 peripheral과 반대됩니다. 무관한이라는 뜻의 irrelevant는 시험에 정말 자주 나오는데, 반대말인 relevant와 꼭 묶어서 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수학의 주요 관심사는\u003c/span>\u003cspan class=\"en\">The central concerns of mathematics\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이다\u003c/span>\u003cspan class=\"en\">are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숫자가 아니라,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">numbers, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">패턴, 구조,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">patterns\u003c/span>, structures,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대칭 그리고 연결이다.\u003c/span>\u003cspan class=\"en\">symmetries and connections.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수학의 주요 관심사는 숫자가 아니라, 패턴, 구조, 대칭 그리고 연결이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수학의 본질이 단순히 숫자를 다루는 \u003cb class=\"key\">계산\u003c/b>에 있는 것이 아니라, 요소들 사이의 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 파악하는 것임을 정의하는 \u003cb class=\"key\">주제문\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 (not A but B)\u003c/span> : not [A] but [B] : \"숫자가 아니라 패턴\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The central concerns of mathematics, 수학의 주요 관심사는. are, 이다. not numbers, 숫자가 아니라. but patterns, structures, 패턴, 구조. symmetries and connections, 대칭 그리고 연결이다.. 이 문장 전체를 해석하면, 수학의 주요 관심사는 숫자가 아니라, 패턴, 구조, 대칭 그리고 연결이다.","hl":"m"},{"n":13,"text":"수학하면 보통 숫자를 먼저 떠올리죠? 하지만 이 글은 수학의 진짜 핵심이 숫자가 아니라 요소들 간의 추상적 관계인 패턴이나 구조에 있다는 점을 강조하며 시작하는 주제문이에요.","hl":"mn"},{"n":14,"text":"여기서 가장 중요한 문법은 상관접속사 not A but B 구문입니다. 숫자가 아니라 패턴이라는 점을 명확히 대조해서 보여주고 있죠. 보어 자리에 온 명사구들이 병렬 구조를 이루고 있는 것도 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어보자,\u003c/span>\u003cspan class=\"en\">Take, for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스도쿠 퍼즐을\u003c/span>\u003cspan class=\"en\">the Sudoku \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">puzzles \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신문에 매일 실리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">appear\u003c/span> daily in newspapers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">신문에 매일 실리는 스도쿠 퍼즐을 예로 들어보자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 수학의 특징(패턴과 구조)을 설명하기 위해 우리에게 친숙한 \u003cb class=\"key\">스도쿠\u003c/b>를 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>로 도입하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 명사(선행사) + [that (주격 관계대명사) + 동사] : \"실리는 퍼즐\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Take, for example, 예를 들어보자. the Sudoku puzzles, 스도쿠 퍼즐을. that appear daily in newspapers, 신문에 매일 실리는. 이 문장 전체를 해석하면, 신문에 매일 실리는 스도쿠 퍼즐을 예로 들어보자.","hl":"m"},{"n":16,"text":"추상적인 수학 이야기를 구체적으로 풀기 위해서 스도쿠라는 아주 좋은 예시를 가져왔어요. 신문에서 흔히 볼 수 있는 소재로 독자의 흥미를 끌고 있죠.","hl":"mn"},{"n":17,"text":"puzzles라는 명사 뒤에 나오는 that은 주격 관계대명사예요. 신문에 매일 실리는이라는 의미로 앞의 퍼즐을 꾸며주고 있습니다. appear는 자동사라 뒤에 목적어가 없어도 괜찮아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 목표는\u003c/span>\u003cspan class=\"en\">The objective \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">9×9 격자를 완성하는 것이다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">complete\u003c/span> a 9 × 9 grid,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 개의 주어진 숫자나 단서로부터 시작하여,\u003c/span>\u003cspan class=\"en\">starting from a few given numbers or clues,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각 행, 각 열, 그리고 각 3×3 블록이 확실하게 하면서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">ensuring \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> each row, each column and each 3 × 3 block\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1부터 9까지의 모든 숫자를 포함하는 것을\u003c/span>\u003cspan class=\"en\">contains all the digits from 1 to 9\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 번씩 그리고 오직 한 번만.\u003c/span>\u003cspan class=\"en\">once and only once.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 목표는 각 행, 각 열, 그리고 각 3×3 블록이 1부터 9까지의 모든 숫자를 한 번씩 그리고 오직 한 번만 포함하는 것을 확실하게 하면서, 몇 개의 주어진 숫자나 단서로부터 시작하여 9×9 격자를 완성하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스도쿠의 구체적인 \u003cb class=\"key\">게임 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 설명하면서, 이것이 수치의 계산이 아니라 숫자를 이용한 \u003cb class=\"key\">논리적 \u003c/b>\u003cb class=\"key\">배치\u003c/b>와 \u003cb class=\"key\">패턴\u003c/b>의 문제임을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (보어)\u003c/span> : be동사 + [to + 동사원형 (보어)] : \"완성하는 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사가 생략되지 않은 분사구문\u003c/span> : while + [-ing (현재분사)] + 접속사 that : \"확실하게 하면서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The objective is, 그 목표는. to complete a 9 × 9 grid, 9×9 격자를 완성하는 것이다. starting from a few given numbers or clues, 몇 개의 주어진 숫자나 단서로부터 시작하여. while ensuring that each row, each column and each 3 × 3 block, 각 행, 각 열, 그리고 각 3×3 블록이 확실하게 하면서. contains all the digits from 1 to 9, 1부터 9까지의 모든 숫자를 포함하는 것을. once and only once, 한 번씩 그리고 오직 한 번만.. 이 문장 전체를 해석하면, 그 목표는 각 행, 각 열, 그리고 각 3×3 블록이 1부터 9까지의 모든 숫자를 한 번씩 그리고 오직 한 번만 포함하는 것을 확실하게 하면서, 몇 개의 주어진 숫자나 단서로부터 시작하여 9×9 격자를 완성하는 것이다.","hl":"m"},{"n":19,"text":"스도쿠의 규칙을 아주 상세하게 설명하고 있죠. 여기서 중요한 건 숫자를 더하고 빼는 게 아니라, 정해진 칸에 숫자를 겹치지 않게 배치하는 규칙, 즉 패턴을 완성하는 게 목표라는 점이에요.","hl":"mn"},{"n":20,"text":"문장의 뼈대는 The objective is to complete입니다. 명사적 용법의 to부정사가 보어로 쓰였고요. 중간에 while ensuring은 분사구문인데, 확실하게 하면서라는 의미를 강조하기 위해 접속사 while을 생략하지 않고 썼습니다. ensuring 뒤에는 목적어 역할을 하는 명사절 접속사 that이 생략된 채로 절이 이어지고 있네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 수치적인 값은\u003c/span>\u003cspan class=\"en\">But the numerical values\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숫자의\u003c/span>\u003cspan class=\"en\">of the digits\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관련이 없다.\u003c/span>\u003cspan class=\"en\">are irrelevant;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">important\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다는 것이다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아홉 개의 별개의 기호가\u003c/span>\u003cspan class=\"en\">nine distinct symbols.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 숫자의 수치적인 값은 관련이 없다. 중요한 것은 아홉 개의 별개의 기호가 있다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스도쿠의 본질이 숫자의 \u003cb class=\"key\">산술적 \u003c/b>\u003cb class=\"key\">계산\u003c/b>에 있는 것이 아님을 설명합니다. 숫자는 단지 구분을 위한 \u003cb class=\"key\">기호\u003c/b>일 뿐이라는 점을 강조하여 수학의 본질이 패턴임을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what (주어절)\u003c/span> : what [주어/관계사] + is [동사] + important [보어] : \"중요한 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that (보어절)\u003c/span> : is [be동사] + that [접속사] + there are [완전한 절] : \"~라는 것이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But the numerical values, 그러나 수치적인 값은. of the digits, 숫자의. are irrelevant, 관련이 없다.. what is important, 중요한 것은. is that there are, 있다는 것이다. nine distinct symbols, 아홉 개의 별개의 기호가. 이 문장 전체를 해석하면, 그러나 숫자의 수치적인 값은 관련이 없다. 중요한 것은 아홉 개의 별개의 기호가 있다는 것이다.","hl":"m"},{"n":22,"text":"스도쿠에 써진 숫자가 1인지 9인지는 계산상 아무 의미가 없어요. 여기서 숫자는 그저 서로를 구별하기 위한 기호일 뿐이라는 점을 통해 수학의 진정한 성격이 단순한 숫자가 아님을 보여줍니다.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 관계대명사 왓입니다. 선행사를 포함해서 문장에서 주어 역할을 하고 있죠. 두 번째는 대절입니다. 비동사 뒤에서 보어 자리에 오며 뒤에 완전한 문장이 이어지는 접속사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 ~일 수도 있다\u003c/span>\u003cspan class=\"en\">They \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아홉 개의 글자\u003c/span>\u003cspan class=\"en\">nine letters\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 아홉 개의 모양일 수도\u003c/span>\u003cspan class=\"en\">or nine shapes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 아홉 개의 글자 또는 아홉 개의 모양일 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 언급한 \u003cb class=\"key\">기호\u003c/b>의 예시를 들어 숫자의 \u003cb class=\"key\">대체 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 보여줍니다. 스도쿠의 논리가 숫자에 국한되지 않는 \u003cb class=\"key\">보편적 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>임을 증명하는 보충 설명입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 (추측)\u003c/span> : could [조동사] + be [동사원형] : \"~일 수도 있다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They could be, 그것들은 ~일 수도 있다. nine letters, 아홉 개의 글자. or nine shapes, 또는 아홉 개의 모양일 수도. 이 문장 전체를 해석하면, 그것들은 아홉 개의 글자 또는 아홉 개의 모양일 수도 있다.","hl":"m"},{"n":25,"text":"숫자가 아니라 알파벳이나 그림으로 스도쿠를 해도 게임의 본질은 변하지 않아요. 수학이란 것이 숫자에 매몰된 학문이 아니라는 점을 뒷받침하는 구체적인 예시입니다.","hl":"mn"},{"n":26,"text":"여기서 조동사 쿠드는 과거형이 아니라 현재의 약한 추측을 나타냅니다. 숫자가 아닐 수도 있다는 가능성을 열어두는 부드러운 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 것은 패턴이다\u003c/span>\u003cspan class=\"en\">It's the pattern\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 것은\u003c/span>\u003cspan class=\"en\">that \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">matters\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">중요한 것은 패턴이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 핵심 주제를 \u003cb class=\"key\">강조 \u003c/b>\u003cb class=\"key\">구문\u003c/b>을 통해 명확히 드러내는 문장입니다. 수학의 정수가 숫자 자체가 아닌 \u003cb class=\"key\">구조와 \u003c/b>\u003cb class=\"key\">배열\u003c/b>에 있음을 선언합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 (중요하다)\u003c/span> : the pattern [단수 주어] + matters [동사/현재형] : \"중요하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">it ~ that 강조 구문\u003c/span> : It is + [강조 대상] + that + [나머지] : \"중요한 것은 바로 패턴이다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It's the pattern, 중요한 것은 패턴이다. that matters, 중요한 것은. 이 문장 전체를 해석하면, 중요한 것은 패턴이다.","hl":"m"},{"n":28,"text":"이 문장이 바로 이 글의 결론이자 핵심입니다. 수학에서 가장 핵심적인 요소가 무엇인지 한 문장으로 정의하며 주제를 강력하게 전달하고 있어요.","hl":"mn"},{"n":29,"text":"이 문장은 잇댓 강조 구문이 쓰였습니다. 원래는 패턴 매터스라는 짧은 문장이지만 패턴을 강조하기 위해 잇 이즈와 댓 사이에 넣은 것이죠. 매터가 중요하다는 뜻의 자동사라는 점도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 아일랜드 일간지는\u003c/span>\u003cspan class=\"en\">One Irish daily paper\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 퍼즐을 게재했다\u003c/span>\u003cspan class=\"en\">publishes these puzzles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말과 함께\u003c/span>\u003cspan class=\"en\">with the statement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘수학과 관련이 없습니다,\u003c/span>\u003cspan class=\"en\">'There's no maths \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">involved\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 추론과 논리를 사용하세요!’라는\u003c/span>\u003cspan class=\"en\">simply use reasoning and logic!'\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 아일랜드 일간지는 ‘수학과 관련이 없습니다. 단지 추론과 논리를 사용하세요!’라는 말과 함께 이러한 퍼즐을 게재했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스도쿠가 수학이 아니라고 오해하는 대중의 심리에 맞춰, \u003cb class=\"key\">신문사\u003c/b>가 마케팅을 하고 있음을 보여줍니다. 하지만 실제로는 \u003cb class=\"key\">논리\u003c/b>와 \u003cb class=\"key\">추론\u003c/b> 자체가 수학의 본질임을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : no maths [명사] + involved [과거분사] : \"관련된 수학\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"One Irish daily paper, 한 아일랜드 일간지는. publishes these puzzles, 이러한 퍼즐을 게재했다. with the statement, 말과 함께. 'There's no maths involved, ‘수학과 관련이 없습니다. simply use reasoning and logic!', 단지 추론과 논리를 사용하세요!’라는. 이 문장 전체를 해석하면, 한 아일랜드 일간지는 ‘수학과 관련이 없습니다. 단지 추론과 논리를 사용하세요!’라는 말과 함께 이러한 퍼즐을 게재했다.","hl":"m"},{"n":31,"text":"신문사에서 스도쿠를 홍보할 때 쓴 문구를 인용하고 있어요. 사람들이 수학을 어려워하니까 신문사가 마케팅을 위해 논리나 추론은 수학이 아니라고 거짓말을 하는 셈이죠. 사실은 논리와 추론이 바로 수학인데 말이에요.","hl":"mn"},{"n":32,"text":"여기서 involved는 앞의 maths를 꾸며주는 과거분사입니다. 명사 뒤에서 수동의 느낌을 주며 관련된 수학이라는 의미를 완성하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인 것처럼 보인다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘생각’만으로도\u003c/span>\u003cspan class=\"en\">even the idea\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무언가가 더럽혀질지도 모른다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">spoiled\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수학에 의해서\u003c/span>\u003cspan class=\"en\">by mathematics\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겁주어 쫓아 버리기에 충분한\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">scare \u003c/span>\u003cspan class=\"tgt\">off\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠재적인 풀이자들을!\u003c/span>\u003cspan class=\"en\">potential solvers!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수학에 의해서 더럽혀질지도 모른다는 ‘생각’만으로도 잠재적인 풀이자들을 겁주어 쫓아 버리기에 충분한 것처럼 보인다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수학이라는 단어가 대중에게 주는 \u003cb class=\"key\">거부감\u003c/b>이 얼마나 큰지를 강조합니다. 사람들은 수학이 개입되면 즐거운 놀이가 \u003cb class=\"key\">훼손\u003c/b>될 것이라고 믿는 경향이 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It과 접속사 that\u003c/span> : It [가주어] + seems [동사] + that [접속사] + S + V : \"~인 것처럼 보인다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격의 접속사 that\u003c/span> : the idea [추상명사] + that [접속사] + [완전한 문장] : \"~라는 생각\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">enough to 부정사\u003c/span> : enough [형용사] + to scare [to부정사] : \"쫓아 버리기에 충분한\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It seems that, 인 것처럼 보인다. even the idea, ‘생각’만으로도. that something might be spoiled, 무언가가 더럽혀질지도 모른다는. by mathematics, 수학에 의해서. is enough to scare off, 겁주어 쫓아 버리기에 충분한. potential solvers!, 잠재적인 풀이자들을!. 이 문장 전체를 해석하면, 수학에 의해서 더럽혀질지도 모른다는 ‘생각’만으로도 잠재적인 풀이자들을 겁주어 쫓아 버리기에 충분한 것처럼 보인다!","hl":"m"},{"n":34,"text":"사람들이 수학을 얼마나 기피하는지 설명하는 문장이에요. 수학이라는 말만 들어도 즐거움이 망쳐질 거라고 생각해서 도망간다는 거죠. 그만큼 대중이 가진 수학에 대한 공포감이 크다는 걸 말해주고 있습니다.","hl":"mn"},{"n":35,"text":"어법이 세 가지나 들어있는 아주 중요한 문장입니다. 첫 번째로 It은 가주어이고 진짜 내용은 that절 뒤에 나옵니다. 두 번째로 idea 뒤의 that은 동격의 접속사로, 어떤 생각인지를 보충 설명해 주죠. 마지막으로 enough to는 겁주어 쫓아 버리기에 충분하다는 뜻으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 상상할 수 있겠는가\u003c/span>\u003cspan class=\"en\">Could you imagine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전시회 홍보를\u003c/span>\u003cspan class=\"en\">the promotion of an exhibition\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국립 미술관의\u003c/span>\u003cspan class=\"en\">in the National Gallery\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슬로건을 가진\u003c/span>\u003cspan class=\"en\">with the slogan\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘예술과 관련이 없습니다,\u003c/span>\u003cspan class=\"en\">'No art \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">involved\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 그림과 조각 뿐’이라는?\u003c/span>\u003cspan class=\"en\">just painting and sculpture'?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신은 ‘예술과 관련이 없습니다. 단지 그림과 조각 뿐’이라는 슬로건을 가진 국립 미술관의 전시회 홍보를 상상할 수 있겠는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스도쿠에서 수학을 빼는 것이, 미술관에서 \u003cb class=\"key\">예술\u003c/b>을 빼는 것만큼 \u003cb class=\"key\">모순적\u003c/b>임을 비유를 통해 비판합니다. 그림과 조각이 예술의 일부이듯, 스도쿠도 \u003cb class=\"key\">수학\u003c/b>의 일부임을 역설합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : No art [명사] + involved [과거분사] : \"관련된 예술\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Could you imagine, 당신은 상상할 수 있겠는가. the promotion of an exhibition, 전시회 홍보를. in the National Gallery, 국립 미술관의. with the slogan, 슬로건을 가진. 'No art involved, ‘예술과 관련이 없습니다. just painting and sculpture'?, 단지 그림과 조각 뿐’이라는?. 이 문장 전체를 해석하면, 당신은 ‘예술과 관련이 없습니다. 단지 그림과 조각 뿐’이라는 슬로건을 가진 국립 미술관의 전시회 홍보를 상상할 수 있겠는가?","hl":"m"},{"n":37,"text":"앞에서 말한 신문사의 광고가 얼마나 황당한지를 비유하고 있어요. 미술관에서 그림을 전시하면서 예술은 아니라고 말하는 게 말이 안 되듯이, 스도쿠를 하면서 수학이 아니라고 말하는 것도 똑같이 이상하다는 뜻이죠.","hl":"mn"},{"n":38,"text":"여기서도 명사 art 뒤에 involved가 쓰였습니다. 관련된 예술이라는 뜻으로 과거분사가 명사를 뒤에서 수식하는 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 당신이 스도쿠를 할 수 있다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">Sudoku\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 수학을 할 수 있다!\u003c/span>\u003cspan class=\"en\">you can do maths!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 당신이 스도쿠를 할 수 있다면, 당신은 수학을 할 수 있다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 최종 결론으로, 스도쿠가 단순히 숫자를 채우는 놀이가 아니라 \u003cb class=\"key\">패턴과 \u003c/b>\u003cb class=\"key\">논리\u003c/b>를 다루는 수학적 활동임을 선언합니다. 이를 통해 수학에 막연한 두려움을 가진 독자들에게 스도쿠를 할 줄 안다면 이미 \u003cb class=\"key\">수학적 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 갖춘 것이라고 격려하며 글을 맺습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 if\u003c/span> : if + 주어 + 동사(현재시제) : \"만약 당신이 스도쿠를 할 수 있다면\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"If you can do Sudoku, 만약 당신이 스도쿠를 할 수 있다면. you can do maths!, 당신은 수학을 할 수 있다!. 이 문장 전체를 해석하면, 만약 당신이 스도쿠를 할 수 있다면, 당신은 수학을 할 수 있다!","hl":"m"},{"n":40,"text":"이 문장은 이 글의 최종 결론이에요. 스도쿠가 단순히 숫자를 채워 넣는 게임이 아니라 패턴과 논리를 다루는 수학적 활동이라는 점을 강조하고 있죠. 결국 스도쿠를 즐기는 여러분은 이미 훌륭한 수학적 능력을 갖추고 있다는 뜻입니다.","hl":"mn"},{"n":41,"text":"여기서 사용된 접속사 이프는 조건을 나타내는 부사절을 이끌어요. 만약 당신이 스도쿠를 할 수 있다면이라는 조건이 성립하면 수학도 할 수 있다는 논리적 귀결을 보여주고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>수학의 본질은 단순 계산이 아니라 \u003cb class=\"key\">패턴과 \u003c/b>\u003cb class=\"key\">연결\u003c/b>을 찾는 학문입니다.\u003c/li>\u003cli>스도쿠에서 숫자는 수치적 계산을 위한 것이 아니라 구분을 위한 \u003cb class=\"key\">별개의 \u003c/b>\u003cb class=\"key\">기호\u003c/b>일 뿐입니다.\u003c/li>\u003cli>수학에 대한 대중적 거부감 때문에 스도쿠가 \u003cb class=\"key\">비수학적\u003c/b>인 것처럼 마케팅되기도 합니다.\u003c/li>\u003cli>논리와 추론을 사용하는 스도쿠는 예술의 그림처럼 \u003cb class=\"key\">수학적 \u003c/b>\u003cb class=\"key\">본질\u003c/b>을 담고 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Mathematics is fundamentally defined by patterns and logical structures rather than numerical calculation, as demonstrated by the logic of Sudoku.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">수학의 본질은 숫자가 아니라 \u003cb class=\"key\">패턴과 \u003c/b>\u003cb class=\"key\">구조\u003c/b>에 있으며, 스도쿠처럼 숫자를 사용하지만 \u003cb class=\"key\">논리적 \u003c/b>\u003cb class=\"key\">추론\u003c/b>을 바탕으로 하는 활동은 모두 수학에 해당합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"결국 수학은 숫자의 감옥이 아니라 논리라는 날개를 다는 과정입니다. 스도쿠를 즐길 수 있다면 여러분은 이미 훌륭한 수학적 사고를 하고 있는 셈이죠. 수학에 대한 두려움을 버리고 패턴을 즐기는 여러분이 되길 바랍니다. 오늘 수업은 여기서 마칠게요!","hl":null}]}]});</script></body></html>
