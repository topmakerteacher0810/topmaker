/hew5mAyMc/r0OPpgnv8AkMAmMsSMcYzn9Mde/TvQxBc8pt4wFZAOnPIJ/POOvFJgHOCpxj+Iex5549euOuDR6is/689hM98D6YH068cevc8HqKcWJ4OCMg9v6U3j+8v/AH0v+NHHqv8A30v+NH9f5AODnvyAMYH/AAIDn2z6YBznPNOLEn0Az6++D7joDwBkDIFMGO5X/vpfX60ZHqv/AH0vv759Pb1oAduboent17jOR6E8D2BpCxOc4654/p254HfgA03juy/gy/8AxX/66OO5X/vpef1o/r+vvD+mFHbnnt9c8Dj+fb2FHHqv/fS/40cf3l/77X/GgAo6jj8MjH5jj/PNHH95f++l/wAaOP7y/wDfS/40AL1HXp0/r/L6fj1T+nIo+XoSvv8AMvf6n9M+3FLx/eXP+8vTp6+/tij0fb7v+D+oAWJ/z9T+pJ/P0xSliTyc/wD6/f8APnvk9SaT0OV/NTn3Azzx9fXPNAA9R+Y/TnJz7DuOxFACZznjHJ/znv8A575oIyODg/5x2PX6H3FGOwIOTxyOT6deCOhBPy9DinhGwcBT8pOTgjoSOOp9xyDnBx1oA//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Beyond Imitation: Why Art Cannot Be Defined Only as Copying Reality<small>모방을 넘어서: 예술이 현실의 복제로만 정의될 수 없는 이유</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">고대 그리스 예술에서 중요한 개념은 모방(Mimesis)인데, 이는 예술이 현실 세계를 얼마나 그럴듯하게 재현하느냐를 중시하는 생각입니다. 특히 제욱시스(Zeuxis)와 파라시오스(Parrhasius)의 일화는 그림이 실제처럼 보일 정도의 눈속임(Trompe-l&#39;œil)을 이상적인 기술로 여겼음을 보여 주는 유명한 사례예요. 반면 20세기 중반 잭슨 폴록(Jackson Pollock)이 이끈 추상표현주의(Abstract Expressionism)는 사물의 모습을 베끼기보다 행위, 감정, 우연성 자체를 예술로 드러내려는 흐름이었습니다. 예를 들어 사진처럼 사과를 그리는 것이 모방 중심 예술이라면, 폴록의 드리핑(Dripping) 기법은 음악에 맞춰 몸을 움직이듯 물감을 흩뿌려 내면의 에너지를 표현하는 방식에 가깝습니다. 따라서 이 지문을 이해하려면 예술을 ‘현실의 복사’로 볼 것인지, 아니면 ‘새로운 표현과 경험의 창조’로 볼 것인지에 대한 미학(Aesthetics)의 논쟁을 알고 있으면 좋습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01고대 그리스의 예술관</div><ul><li>고대 그리스인들은 시각 예술의 목표를 눈에 보이는 경험을 그대로 복사하는 것으로 보았다.</li><li>예술가의 목표: 시각 경험(visual experience)의 재현</li><li>조각(sculpture)과 도자기(pottery)의 사실주의(realism)에 반영됨</li><li>핵심 키워드: 모방(mimesis)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02회화 자료의 부재</div><ul><li>고대 그리스 회화는 시간과 날씨의 영향으로 현재 남아 있지 않다.</li><li>고대 그리스 화가들의 그림(paintings)은 현존하지 않음</li><li>작품 수준은 이야기(tales), 조각 기술, 도자기 그림을 통해 추정함</li><li>핵심 키워드: 추정(surmise)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03폴록의 반례</div><ul><li>잭슨 폴록은 기존 사물을 의도적으로 복사하지 않는 예술을 만들었다.</li><li>뉴욕 화파(New York School)의 대표 화가</li><li>알아볼 수 있는 대상(recognizable objects)을 피함</li><li>핵심 키워드: 비재현(non-representation)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04모방 이론의 한계</div><ul><li>폴록의 작품은 예술을 단순한 현실 복사로 정의할 수 없음을 보여 준다.</li><li>아무것도 복사하지 않는 작품 제작에 성공함</li><li>고대 그리스의 모방론(mimesis)은 예술 정의로 충분하지 않음</li><li>핵심 키워드: 예술 정의(definition of art)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">copy</td><td class=\"m\">베끼다, 복사하다, 모방하다</td></tr><tr><td class=\"w\">approach</td><td class=\"m\">접근법, 방식, 태도</td></tr><tr><td class=\"w\">realism</td><td class=\"m\">사실주의, 현실성, 현실주의</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~로 인하여</td></tr><tr><td class=\"w\">surmise</td><td class=\"m\">추측하다, 짐작하다</td></tr><tr><td class=\"w\">based on</td><td class=\"m\">~에 근거하여, ~을 바탕으로</td></tr><tr><td class=\"w\">such as</td><td class=\"m\">~와 같은, 예를 들어</td></tr><tr><td class=\"w\">survive</td><td class=\"m\">남아 있다, 살아남다, 생존하다</td></tr><tr><td class=\"w\">definition</td><td class=\"m\">정의, 의미 규정</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reality</td><td class=\"m\">현실, 실제, 실재</td></tr><tr><td class=\"w\">intentionally</td><td class=\"m\">의도적으로, 고의로</td></tr><tr><td class=\"w\">consciously</td><td class=\"m\">의식적으로, 의도적으로</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 회피하다, 막다</td></tr><tr><td class=\"w\">resemble</td><td class=\"m\">닮다, 유사하다</td></tr><tr><td class=\"w\">recognizable</td><td class=\"m\">알아볼 수 있는, 식별 가능한</td></tr><tr><td class=\"w\">succeed at</td><td class=\"m\">~에 성공하다, ~을 해내다</td></tr><tr><td class=\"w\">demonstrate</td><td class=\"m\">보여 주다, 입증하다, 설명하다</td></tr><tr><td class=\"w\">mimesis</td><td class=\"m\">모방, 재현, 미메시스</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고대 그리스인들은</span><span class=\"en\"><b>The ancient Greeks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각했다</span><span class=\"en\"><b><span class=\"grammar-hl\">felt</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시각 예술가의 목표가</span><span class=\"en\"><b><span class=\"grammar-hl\">that the visual artist's goal</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시각적 경험을 모방하는 것이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">was to copy visual experience</span>.</b></span></div></div><div class=\"lec-sent-ko\">고대 그리스인들은 시각 예술가의 목표가 시각적 경험을 모방하는 것이라고 생각했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 출발점입니다. 고대 그리스인들은 예술가가 눈으로 본 세계를 최대한 비슷하게 재현해야 한다고 보았습니다. 여기서 예술은 현실을 창조적으로 바꾸는 활동보다, 실제로 보이는 대상을 충실히 옮기는 활동으로 이해됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was to copy visual experience (to부정사): be동사(was) 뒤에서 to copy가 주격보어 역할을 하며, 주어 the visual artist&#39;s goal의 내용을 설명한다. 구조는 S + be + toV 형태이다.</div><div class=\"lec-gr-item\">felt that the visual artist&#39;s goal was to copy visual experience (that절): felt의 목적어 역할을 하는 명사절이다. that + S + V 구조로, felt의 내용이 되는 절이 뒤에 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">copy</td><td class=\"m\">베끼다, 복사하다, 모방하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이런 접근은</span><span class=\"en\"><b>This approach</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나타난다</span><span class=\"en\"><b><span class=\"grammar-hl\">appears</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고대 그리스 조각과 도자기의 사실주의에</span><span class=\"en\"><b><span class=\"grammar-hl\">in the realism of ancient Greek sculpture and pottery</span>.</b></span></div></div><div class=\"lec-sent-ko\">이런 접근은 고대 그리스 조각과 도자기의 사실주의에 나타난다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 생각이 실제 작품에서 어떻게 드러났는지 보여 주는 문장입니다. 고대 그리스 조각과 도자기는 사람의 몸, 움직임, 형태 등을 실제처럼 표현하려 했고, 그래서 당시의 예술관이 작품 속에 반영되어 있다고 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">appears in the realism of ancient Greek sculpture and pottery (기본문형): 주어 This approach + 동사 appears + 전치사구 in the realism... 구조이다. appear는 여기서 자동사로 쓰여 뒤에 직접목적어를 취하지 않고, in 이하가 장소·분야를 나타내는 부사구로 붙는다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">approach</td><td class=\"m\">접근법, 방식, 태도</td></tr><tr><td class=\"w\">realism</td><td class=\"m\">사실주의, 현실성, 현실주의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">슬프게도 주목해야 한다</span><span class=\"en\"><b>must sadly <span class=\"grammar-hl\">note</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간과 날씨의 작용 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">that, due to the action of time and weather,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고대 그리스 예술가들의 회화 작품이 하나도</span><span class=\"en\"><b><span class=\"grammar-hl\">no paintings from ancient Greek artists</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘날 존재하지 않는다는 점을</span><span class=\"en\"><b><span class=\"grammar-hl\">exist today</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 시간과 날씨의 작용 때문에 고대 그리스 예술가들의 회화 작품이 오늘날 존재하지 않는다는 점을 슬프게도 주목해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서 고대 그리스 예술을 말했지만, 그림 자체는 직접 확인하기 어렵다는 한계를 제시합니다. 오래된 회화는 벽, 나무판, 천 같은 재료에 그려진 경우가 많아 시간이 지나며 손상되기 쉽습니다. 그래서 고대 그리스 회화의 수준을 직접 작품으로 판단하기 어렵다는 배경을 깔아 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">due to the action of time and weather (관용표현): due to는 전치사구처럼 쓰여 ‘~때문에’의 원인 표현을 만든다. 여기서는 the action of time and weather라는 명사구를 목적어로 취해 문장 전체에 원인 정보를 덧붙인다.</div><div class=\"lec-gr-item\">note that, due to the action of time and weather, no paintings from ancient Greek artists exist today (that절): note의 목적어 역할을 하는 명사절이다. that + S + V 구조에서 no paintings가 that절의 주어, exist가 동사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~로 인하여</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는</span><span class=\"en\"><b>We</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들의 질을 오직 짐작할 수 있을 뿐이다</span><span class=\"en\"><b>can only surmise their quality</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Zeuxis와 Parhassios의 그것과 같은 이야기를 바탕으로</span><span class=\"en\"><b><span class=\"grammar-hl\">based on tales</span> <span class=\"grammar-hl\">such as that of Zeuxis and Parhassios</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고대 그리스 조각의 분명한 기량을 바탕으로</span><span class=\"en\"><b>the obvious skill in ancient Greek sculpture,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 남아 있는 그림들을 바탕으로</span><span class=\"en\"><b>and in <span class=\"grammar-hl\">drawings that survive</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고대 그리스 도자기 위에</span><span class=\"en\"><b><span class=\"grammar-hl\">on ancient Greek pottery</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 Zeuxis와 Parhassios의 그것과 같은 이야기, 고대 그리스 조각의 분명한 기량, 그리고 고대 그리스 도자기 위에 남아있는 그림들을 바탕으로 그것들의 질을 오직 짐작할 수 있을 뿐이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 고대 그리스 회화가 남아 있지 않다고 했기 때문에, 여기서는 그 회화의 수준을 간접적으로 짐작하는 방법을 설명합니다. 전해지는 일화, 뛰어난 조각 기술, 도자기에 남은 그림들이 단서가 됩니다. 즉 글쓴이는 고대 그리스 회화의 실물을 볼 수는 없지만, 주변 증거를 통해 그들이 사실적인 표현을 중시했을 가능성을 말하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">based on tales (과거분사): based on은 과거분사 based가 전치사 on과 결합한 형태로, 앞의 동작 surmise their quality에 근거를 덧붙이는 부사적 표현처럼 쓰인다. 이 경우는 서술부의 be동사+p.p. 수동태가 아니라, 고정된 분사 표현에 가깝다.</div><div class=\"lec-gr-item\">such as that of Zeuxis and Parhassios (관용표현): such as는 예시를 제시하는 표현으로, 앞의 tales의 구체적 예를 뒤에 연결한다. that of Zeuxis and Parhassios에서 that은 앞의 단수 명사 tale을 대신하는 지시대명사이다.</div><div class=\"lec-gr-item\">drawings that survive on ancient Greek pottery (관계대명사): that이 선행사 drawings를 수식하는 관계대명사절을 이끈다. that은 관계절 안에서 주어 역할을 하며, 구조는 drawings + that + V(survive)이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surmise</td><td class=\"m\">추측하다, 짐작하다</td></tr><tr><td class=\"w\">based on</td><td class=\"m\">~에 근거하여, ~을 바탕으로</td></tr><tr><td class=\"w\">such as</td><td class=\"m\">~와 같은, 예를 들어</td></tr><tr><td class=\"w\">survive</td><td class=\"m\">남아 있다, 살아남다, 생존하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">현실을 모방하는 것으로서의 예술의 이런 정의는</span><span class=\"en\"><b>This definition of art <span class=\"grammar-hl\">as copying reality</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문제가 있다</span><span class=\"en\"><b>has a problem,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>though.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 현실을 모방하는 것으로의 예술의 이런 정의는 문제가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 여기서 글의 방향이 바뀝니다. 앞부분은 고대 그리스의 예술관을 설명했지만, 이제부터는 그 관점이 모든 예술을 설명하기에는 부족하다는 주장을 펼치려 합니다. 이 문장은 뒤에 나올 잭슨 폴록의 사례를 예고하는 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">copying reality (동명사): copying은 -ing 형태가 명사 역할을 하며, 전치사 as의 목적어로 쓰였다. 구조는 as + 동명사구(copying reality)이다.</div><div class=\"lec-gr-item\">as copying reality (전치사구): as는 ‘~로서/~라고’의 기준·정의 관계를 나타내며, 뒤에 동명사구 copying reality를 목적어로 취한다. 이 전치사구가 art의 정의 내용을 보충한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">copy</td><td class=\"m\">베끼다, 복사하다, 모방하다</td></tr><tr><td class=\"w\">definition</td><td class=\"m\">정의, 의미 규정</td></tr><tr><td class=\"w\">reality</td><td class=\"m\">현실, 실제, 실재</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Jackson Pollock은</span><span class=\"en\"><b>Jackson Pollock,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1950년대 뉴욕 화파의 리더인</span><span class=\"en\"><b><span class=\"grammar-hl\">a leader in the New York School of the 1950's</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의도적으로 기존 사물을 모방하지 않았다</span><span class=\"en\"><b>intentionally <span class=\"grammar-hl\">did not copy</span> <span class=\"grammar-hl\">existing objects</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 예술 안에서</span><span class=\"en\"><b>in his art.</b></span></div></div><div class=\"lec-sent-ko\">1950년대 뉴욕 화파의 리더 Jackson Pollock은 그의 예술 안에서 기존 사물을 의도적으로 모방하지 않았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제기한 문제를 구체적인 예술가의 사례로 보여 줍니다. 폴록은 추상표현주의를 대표하는 화가로, 사과, 사람, 풍경처럼 알아볼 수 있는 대상을 그리려 하지 않았습니다. 그는 물감을 흘리거나 뿌리는 방식으로 작품을 만들며, 예술이 반드시 현실의 사물을 닮아야 한다는 생각을 흔들었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">a leader in the New York School of the 1950&#39;s (동격): a leader...는 Jackson Pollock을 다시 설명하는 명사구이다. 고유명사 뒤에 명사구가 이어져 앞 명사의 신분이나 역할을 보충한다.</div><div class=\"lec-gr-item\">existing objects (현재분사(형용사)): existing이 objects를 앞에서 수식한다. 구조는 -ing + N이며, objects가 ‘존재하는’ 대상이라는 성질을 나타내는 형용사적 현재분사이다.</div><div class=\"lec-gr-item\">did not copy (부정문): 일반동사 copy의 과거시제 부정은 조동사 did + not + 동사원형 copy로 만든다. did가 시제를 담당하고, 본동사 copy는 원형으로 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">copy</td><td class=\"m\">베끼다, 복사하다, 모방하다</td></tr><tr><td class=\"w\">intentionally</td><td class=\"m\">의도적으로, 고의로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 작품들을 그리는 동안</span><span class=\"en\"><b><span class=\"grammar-hl\">While painting these works</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Pollock과 그의 동료 예술가들은</span><span class=\"en\"><b>Pollock and his fellow artists</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">흔적이나 부분을 만드는 것을 의식적으로 피하곤 했다</span><span class=\"en\"><b>would consciously <span class=\"grammar-hl\">avoid making marks or passages</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알아볼 수 있는 사물과 닮은</span><span class=\"en\"><b>that resembled recognizable objects.</b></span></div></div><div class=\"lec-sent-ko\">이러한 작품들을 그리는 동안, Pollock과 그의 동료 예술가들은 알아볼 수 있는 사물과 닮은 흔적이나 부분을 만드는 것을 의식적으로 피하곤 했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 내용을 더 자세히 설명합니다. 폴록과 동료들은 그림 속에서 우연히 사람, 동물, 사물처럼 보이는 형태가 생기지 않도록 주의했습니다. 이는 그들이 단순히 현실을 덜 닮게 그린 정도가 아니라, 현실의 사물을 떠올리게 하는 요소 자체를 피하려 했다는 점을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">While painting these works (분사구문): While painting은 접속사 while이 남아 있는 현재분사구문이다. 원래 절은 while they were painting these works로 볼 수 있으며, 주절의 주어 Pollock and his fellow artists와 의미상 주어가 같다.</div><div class=\"lec-gr-item\">avoid making marks or passages (동명사): making은 동사 avoid의 목적어 역할을 하는 동명사이다. avoid는 뒤에 to부정사가 아니라 동명사를 목적어로 취하는 동사이므로 avoid + V-ing 구조가 된다.</div><div class=\"lec-gr-item\">marks or passages that resembled recognizable objects (관계대명사): that이 선행사 marks or passages를 수식하는 관계대명사절을 이끈다. that은 관계절 안에서 주어 역할을 하고, resembled가 동사, recognizable objects가 목적어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consciously</td><td class=\"m\">의식적으로, 의도적으로</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 회피하다, 막다</td></tr><tr><td class=\"w\">resemble</td><td class=\"m\">닮다, 유사하다</td></tr><tr><td class=\"w\">recognizable</td><td class=\"m\">알아볼 수 있는, 식별 가능한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>They</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">성공했다</span><span class=\"en\"><b><span class=\"grammar-hl\">succeeded</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술 작품을 만드는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">at making artwork</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 것도 모방하지 않은</span><span class=\"en\"><b>that did not copy anything,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러므로 보여주었다</span><span class=\"en\"><b>thus demonstrating</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고대 그리스의 관점은</span><span class=\"en\"><b>that the ancient Greek view</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술을 모사, 즉 단순한 모방으로 보는</span><span class=\"en\"><b>of art as mimesis ― <span class=\"grammar-hl\">simple copying</span> ―</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예술을 충분히 정의하지는 못한다는 점을</span><span class=\"en\"><b>does not sufficiently define art.</b></span></div></div><div class=\"lec-sent-ko\">그들은 어떤 것도 모방하지 않은 예술 작품을 만드는 데 성공했고, 그러므로 모사, 즉 단순한 모방으로서의 고대 그리스 예술관은 예술을 충분히 정의하지는 못한다는 점을 보여주었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론입니다. 폴록과 뉴욕 화파의 작품은 현실의 대상을 베끼지 않고도 예술로 인정받았습니다. 따라서 글쓴이는 예술을 ‘보이는 현실의 재현’으로만 설명하면 현대 추상미술 같은 중요한 예술 형식을 담아낼 수 없다고 말합니다. 앞부분의 고대 그리스 예술관과 뒷부분의 현대 추상미술 사례가 대비되며, 예술의 정의가 더 넓어져야 한다는 결론으로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">succeeded at making artwork (관용표현): succeed at + V-ing 구조로, succeeded at 뒤에 동명사 making이 전치사 at의 목적어로 온다. making artwork 전체가 ‘작품을 만드는 일’이라는 명사구 역할을 한다.</div><div class=\"lec-gr-item\">artwork that did not copy anything (관계대명사): that이 선행사 artwork를 수식하는 관계대명사절을 이끈다. that은 관계절 안에서 주어 역할을 하며, did not copy anything이 관계절의 서술부이다.</div><div class=\"lec-gr-item\">thus demonstrating that the ancient Greek view of art as mimesis does not sufficiently define art (분사구문): demonstrating은 현재분사로, 앞 절 전체의 결과를 덧붙이는 부사적 분사구문이다. 원래 절은 and they thus demonstrated that the ancient Greek view of art as mimesis does not sufficiently define art로 볼 수 있다.</div><div class=\"lec-gr-item\">demonstrating that the ancient Greek view of art as mimesis does not sufficiently define art (that절): demonstrating의 목적어 역할을 하는 명사절이다. that + S + V 구조에서 the ancient Greek view of art as mimesis가 주어, does not sufficiently define이 서술부이다.</div><div class=\"lec-gr-item\">simple copying (동명사): copying은 -ing 형태가 명사 역할을 하며, simple의 수식을 받아 mimesis의 내용을 다시 설명하는 명사구로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">copy</td><td class=\"m\">베끼다, 복사하다, 모방하다</td></tr><tr><td class=\"w\">mimesis</td><td class=\"m\">모방, 재현, 미메시스</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>고대 그리스인들은 예술가의 목표를 눈에 보이는 현실을 모방하는 것으로 보았다.</li><li>이런 생각은 고대 그리스 조각과 도자기의 사실적인 표현에서 확인된다.</li><li>고대 그리스 회화는 남아 있지 않아, 일화와 조각, 도자기 그림을 통해 간접적으로만 짐작할 수 있다.</li><li>그러나 잭슨 폴록과 뉴욕 화파는 의도적으로 현실의 사물을 모방하지 않는 작품을 만들었다.</li><li>이 사례는 예술을 단순한 현실 모방으로만 정의할 수 없다는 점을 보여 준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Although art was traditionally viewed as copying reality, nonrepresentational artworks show that imitation alone cannot fully define art.</div>\n              <div class=\"lec-final-sum-ko\">예술은 전통적으로 현실의 모방으로 여겨졌지만, 비재현적 작품은 모방만으로는 예술을 완전히 정의할 수 없음을 보여 준다.</div></div></div>"],"segs":[[{"audio":"./33_audio/1.mp3","hl":null}],[{"audio":"./33_audio/2.mp3","hl":null}],[{"audio":"./33_audio/3.mp3","hl":null},{"audio":"./33_audio/4.mp3","hl":"stage-0"},{"audio":"./33_audio/5.mp3","hl":"stage-1"},{"audio":"./33_audio/6.mp3","hl":"stage-2"},{"audio":"./33_audio/7.mp3","hl":"stage-3"}],[{"audio":"./33_audio/8.mp3","hl":null}],[{"audio":"./33_audio/9.mp3","hl":"main"},{"audio":"./33_audio/10.mp3","hl":"meaning"},{"audio":"./33_audio/11.mp3","hl":"grammar"}],[{"audio":"./33_audio/12.mp3","hl":"main"},{"audio":"./33_audio/13.mp3","hl":"meaning"},{"audio":"./33_audio/14.mp3","hl":"grammar"}],[{"audio":"./33_audio/15.mp3","hl":"main"},{"audio":"./33_audio/16.mp3","hl":"meaning"},{"audio":"./33_audio/17.mp3","hl":"grammar
