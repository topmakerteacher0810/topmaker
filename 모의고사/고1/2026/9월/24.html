wecZ+v0oyvJ69SADnP/6u/uR0pMdD2PI468dfr2/THQ1cI+8rxeztrZXuraLfRvTy3vsXa8mtfTbXW2mut+/yEHIxyMHnGPY9sdc54A/CmsAVYAcqDjPTnk8eh9+PSjemfvIRxj5hnv7nsDg8Z9+tMcqAxGGGGGeDkkYOME569MA4JyMDNbR3Vt/da0vu0k2u176bp6dGL8T/2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Planning with Flexibility in an Uncertain World<small>불확실한 세상에서 유연하게 계획하기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">불확실성(Uncertainty)은 결과를 정확히 예측할 수 없는 상태를 말하며, 심리학에서는 사람들이 이런 상황에서 불안을 느끼고 통제 욕구(Need for Control)를 강하게 보인다고 설명해요. 이때 자신의 계획이나 생각에 지나치게 매달리면 인지적 경직성(Cognitive Rigidity)이 생겨 변화에 유연하게 대응하기 어려워질 수 있습니다. 반대로 마음챙김(Mindfulness)과 심리적 유연성(Psychological Flexibility)은 “모든 것이 계획대로 되지 않을 수 있다”는 사실을 받아들이고 현재 상황에 맞게 행동하도록 돕는 개념이에요. 예를 들어 여행 일정을 세우는 것은 좋지만, 비가 오거나 교통이 지연될 때 계획을 연필로 쓴 것처럼 고칠 수 있다고 생각하면 스트레스를 훨씬 덜 받을 수 있습니다. 아이젠하워(Eisenhower)의 “계획은 쓸모없지만, 계획하는 과정은 중요하다”는 말도 완벽한 예측보다 변화에 대비하는 사고방식이 더 중요하다는 맥락에서 이해할 수 있어요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01통제 욕구 내려놓기</div><ul><li>통제를 내려놓고 알아차림을 실천하려면 불확실성(uncertainty)을 마주할 용기가 필요하다.</li><li>인간은 본능적으로 알고 싶어 함</li><li>모르는 상황에서 두려움(fear)을 느낌</li><li>핵심 키워드: 통제(control), 알아차림(awareness)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02불확실성에 대한 반응</div><ul><li>사람들은 불확실할 때 불안해지고, 세상이 실제보다 더 예측 가능하다고 믿으려 한다.</li><li>불확실하면 경직됨(inflexible)</li><li>현실에는 늘 큰 불확실성이 존재함</li><li>예측 가능성(predictability)을 과장함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03계획에 집착하기</div><ul><li>우리는 일이 반드시 자신의 계획대로 되어야 한다고 생각하며 계획과 생각에 매달린다.</li><li>계획(plans) 자체는 나쁜 것이 아님</li><li>문제는 계획이 반드시 실현되어야 한다고 믿는 태도</li><li>핵심 키워드: 집착(cling), 실현(fruition)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04유연한 계획의 필요성</div><ul><li>아이젠하워의 말처럼 계획표보다 계획하는 과정이 중요하며, 계획은 바뀔 수 있음을 인정해야 한다.</li><li>“계획은 쓸모없지만, 계획하기는 모든 것이다”</li><li>달력과 계획표를 잉크(ink)가 아니라 연필(pencil)로 쓰는 태도</li><li>예상과 실제 결과가 다를 수 있음을 받아들임</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">let go of</td><td class=\"m\">~을 놓아주다, ~을 포기하다, 집착을 버리다</td></tr><tr><td class=\"w\">control</td><td class=\"m\">통제, 지배, 조절</td></tr><tr><td class=\"w\">be aware</td><td class=\"m\">알고 있다, 의식하고 있다, 자각하고 있다</td></tr><tr><td class=\"w\">gather the courage to</td><td class=\"m\">~할 용기를 내다, ~할 용기를 모으다</td></tr><tr><td class=\"w\">uncertainty</td><td class=\"m\">불확실성, 불확실한 상태, 의문</td></tr><tr><td class=\"w\">frightened</td><td class=\"m\">겁먹은, 두려워하는</td></tr><tr><td class=\"w\">inflexible</td><td class=\"m\">융통성 없는, 완고한, 잘 변하지 않는</td></tr><tr><td class=\"w\">pretend</td><td class=\"m\">~인 척하다, 가장하다</td></tr><tr><td class=\"w\">predictable</td><td class=\"m\">예측 가능한, 뻔한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">live with</td><td class=\"m\">~을 감수하고 살다, ~와 함께 살다, ~을 받아들이다</td></tr><tr><td class=\"w\">all the time</td><td class=\"m\">항상, 내내, 언제나</td></tr><tr><td class=\"w\">cling to</td><td class=\"m\">~을 고수하다, ~에 매달리다, ~을 꽉 붙잡다</td></tr><tr><td class=\"w\">turn out</td><td class=\"m\">~로 드러나다, 결국 ~이 되다, 결과가 ~이 되다</td></tr><tr><td class=\"w\">desperately</td><td class=\"m\">필사적으로, 절망적으로, 몹시</td></tr><tr><td class=\"w\">there be nothing wrong with</td><td class=\"m\">~에 문제가 없다, ~해도 괜찮다</td></tr><tr><td class=\"w\">come to fruition</td><td class=\"m\">결실을 맺다, 실현되다, 성과를 내다</td></tr><tr><td class=\"w\">worthless</td><td class=\"m\">가치 없는, 쓸모없는</td></tr><tr><td class=\"w\">bear in mind</td><td class=\"m\">명심하다, 마음에 두다, 기억하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">통제하려는 우리의 욕구를 내려놓는 것</span><span class=\"en\"><b><span class=\"grammar-hl\">Letting go of our need for control</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즉 알아차리는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">being aware</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상당 부분 불확실성에 맞설 용기를 모으는 일에 관한 것이다.</span><span class=\"en\"><b>is a lot about <span class=\"grammar-hl\">gathering the courage</span> <span class=\"grammar-hl\">to face uncertainty</span>.</b></span></div></div><div class=\"lec-sent-ko\">통제하려는 우리의 욕구를 내려놓는 것, 즉 알아차리는 것은, 매우 불확실성에 맞설 용기를 모으는 일에 관한 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 핵심 주제를 여는 문장입니다. 여기서 말하는 ‘깨어 있음’은 모든 일을 내 뜻대로 만들려고 애쓰는 태도를 잠시 내려놓고, 앞으로 무슨 일이 생길지 모르는 상태를 피하지 않고 바라보는 태도입니다. 뒤 문장들은 왜 인간이 불확실성을 두려워하고, 그래서 통제하려 드는지를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Letting go of our need for control (동명사구): Letting go of our need for control 전체가 명사 역할을 하며 문장의 주어로 쓰였다. 동사 is의 주어가 되는 구조이다.</div><div class=\"lec-gr-item\">Letting go of (관용표현): let go of는 ‘붙잡고 있던 것을 놓다’라는 의미의 동사구이며, 여기서는 -ing 형태 Letting으로 바뀌어 동명사구를 이룬다.</div><div class=\"lec-gr-item\">being aware (동명사구): being aware는 명사적 역할을 하는 -ing 구로, 앞의 Letting go of our need for control을 부연 설명하는 동격적 요소로 쓰였다.</div><div class=\"lec-gr-item\">gathering the courage (동명사구): 전치사 about 뒤에는 명사 역할이 필요하므로 gathering the courage가 전치사의 목적어로 쓰였다.</div><div class=\"lec-gr-item\">to face uncertainty (to부정사): to face uncertainty는 앞의 명사 the courage를 수식하는 형용사적 용법으로, ‘불확실성에 맞설 용기’에서 어떤 용기인지 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">control</td><td class=\"m\">통제, 지배, 조절</td></tr><tr><td class=\"w\">uncertainty</td><td class=\"m\">불확실성, 불확실한 상태, 의문</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인간은 알고 싶어 한다.</span><span class=\"en\"><b><span class=\"grammar-hl\">Human beings want to know</span>.</b></span></div></div><div class=\"lec-sent-ko\">인간은 알고 싶어 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 ‘불확실성’이 왜 어려운지를 짧게 설명합니다. 사람은 본능적으로 앞으로 무슨 일이 일어날지, 상황이 어떻게 흘러갈지 알고 싶어 합니다. 이 문장은 인간이 통제 욕구를 갖게 되는 심리적 출발점을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">want to know (to부정사): want는 뒤에 to부정사를 목적어로 취할 수 있으며, want to know는 want + to V 구조이다.</div><div class=\"lec-gr-item\">Human beings want to know (기본문형): Human beings가 주어, want가 동사, to know가 목적어 역할을 하는 to부정사구인 SVO 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 알지 못할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">When we don't know</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상황이 불확실할 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when things are uncertain</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 종종 두려움을 느끼고</span><span class=\"en\"><b>we often <span class=\"grammar-hl\">feel frightened</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경직된다.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">become inflexible</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리가 알지 못할 때, 상황이 불확실할 때 우리는 종종 두려움을 느끼고 경직된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 ‘인간은 알고 싶어 한다’는 말을 구체화합니다. 알 수 없는 상황에 놓이면 사람은 불안해지고, 마음이 굳어져 다양한 가능성을 받아들이기 어려워집니다. 그래서 뒤 문장에서처럼 현실을 있는 그대로 보기보다 예측 가능한 것처럼 꾸미려는 태도가 나타납니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">When we don&#39;t know (부사절): When + 주어 + 동사 구조로 시간·상황을 나타내는 부사절이며, 뒤의 주절 we often feel frightened and become inflexible을 수식한다.</div><div class=\"lec-gr-item\">when things are uncertain (부사절): when things are uncertain은 When + S + be + 형용사 구조의 부사절로, 주절이 일어나는 상황을 제시한다.</div><div class=\"lec-gr-item\">feel frightened (과거분사(형용사)): frightened는 과거분사 형태가 형용사처럼 쓰여 주어 we의 상태를 설명하는 주격보어 역할을 한다. 구조는 S + feel + C이다.</div><div class=\"lec-gr-item\">become inflexible (기본문형): become은 2형식 동사로, 뒤에 형용사 보어 inflexible을 취해 주어 we의 상태 변화를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">frightened</td><td class=\"m\">겁먹은, 두려워하는</td></tr><tr><td class=\"w\">inflexible</td><td class=\"m\">융통성 없는, 완고한, 잘 변하지 않는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서 우리는 가장한다</span><span class=\"en\"><b>So we <span class=\"grammar-hl\">pretend</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상황이 더 예측 가능하다고</span><span class=\"en\"><b><span class=\"grammar-hl\">that things are more predictable</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로 그것들이 그러한 것보다</span><span class=\"en\"><b>than they really are,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비록 우리는 실제로 살아가고 있음에도</span><span class=\"en\"><b><span class=\"grammar-hl\">even though we actually live</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">막대한 불확실성과</span><span class=\"en\"><b><span class=\"grammar-hl\">with enormous uncertainty</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">항상.</span><span class=\"en\"><b>all the time.</b></span></div></div><div class=\"lec-sent-ko\">그래서 우리가 항상 막대한 불확실성과 실제로 살아가고 있음에도 불구하고, 우리는 상황이 실제로 그것들이 그러한 것보다 더 예측 가능하다고 가장한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 두려움과 경직성이 낳는 행동을 설명합니다. 사람은 불확실성을 견디기 힘들어서 세상이 꽤 안정적이고 계산 가능하다고 스스로 믿으려 합니다. 이 문장은 인간이 현실의 불확실성을 줄여 보이려는 심리적 방어를 말하며, 다음 문장의 ‘계획에 집착하는 태도’로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">pretend that things are more predictable (명사절): pretend 뒤의 that절이 pretend의 목적어 역할을 한다. 구조는 S + pretend + that + S + V이다.</div><div class=\"lec-gr-item\">more predictable than they really are (비교구문): more + 형용사 + than 구조이며, than절의 they really are 뒤에는 predictable이 반복을 피하기 위해 생략된 것으로 볼 수 있다.</div><div class=\"lec-gr-item\">even though we actually live with enormous uncertainty 양보 부사절: even though + 주어 + 동사 구조로, 주절의 내용과 대조되는 사실을 나타내는 부사절이다.</div><div class=\"lec-gr-item\">live with enormous uncertainty 동사구 구조: live with는 live + 전치사 with의 결합으로, with enormous uncertainty가 전치사구로 동사 live를 보충한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">uncertainty</td><td class=\"m\">불확실성, 불확실한 상태, 의문</td></tr><tr><td class=\"w\">pretend</td><td class=\"m\">~인 척하다, 가장하다</td></tr><tr><td class=\"w\">predictable</td><td class=\"m\">예측 가능한, 뻔한</td></tr><tr><td class=\"w\">live with</td><td class=\"m\">~을 감수하고 살다, ~와 함께 살다, ~을 받아들이다</td></tr><tr><td class=\"w\">all the time</td><td class=\"m\">항상, 내내, 언제나</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 우리의 계획과 생각들에 매달린다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">cling to our plans and ideas</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상황이 어떻게 되어야 하고 결과로 나타나야 하는지에 대한</span><span class=\"en\"><b>about <span class=\"grammar-hl\">how things should be</span> and <span class=\"grammar-hl\">turn out</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 절박하게.</span><span class=\"en\"><b><span class=\"grammar-hl\">ever so desperately</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 상황이 어떻게 되어야 하고 어떻게 결과로 나타나야 하는지에 대한 우리의 계획과 생각들에 매우 절박하게 매달린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 ‘예측 가능한 척하기’가 실제 생활에서 어떻게 드러나는지 보여 줍니다. 사람들은 자신이 세운 계획, 자신이 바라는 결과, 자신이 생각한 올바른 흐름에 강하게 매달립니다. 글쓴이는 여기서 계획 자체보다, 계획대로 되어야만 마음이 놓이는 태도를 문제 삼기 위한 준비를 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cling to our plans and ideas (관용표현): cling to는 ‘단단히 붙잡다/집착하다’라는 의미의 동사구이며, to는 전치사로 뒤에 명사구 our plans and ideas가 온다.</div><div class=\"lec-gr-item\">how things should be (간접의문문): how + 주어 + 조동사 + 동사원형 구조의 명사절이다. 전치사 about의 목적어 역할을 하며, 의문문 어순이 아니라 평서문 어순을 쓴다.</div><div class=\"lec-gr-item\">turn out (관용표현): turn out은 ‘결과적으로 ~이 되다/드러나다’라는 의미의 동사구로, 앞의 should be와 병렬되어 things의 상태나 결과를 나타낸다.</div><div class=\"lec-gr-item\">ever so desperately (관용표현): ever so는 형용사나 부사를 강조하는 표현이며, 여기서는 부사 desperately를 강화한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cling to</td><td class=\"m\">~을 고수하다, ~에 매달리다, ~을 꽉 붙잡다</td></tr><tr><td class=\"w\">turn out</td><td class=\"m\">~로 드러나다, 결국 ~이 되다, 결과가 ~이 되다</td></tr><tr><td class=\"w\">desperately</td><td class=\"m\">필사적으로, 절망적으로, 몹시</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 아무런 잘못도 없다</span><span class=\"en\"><b>And <span class=\"grammar-hl\">there's nothing wrong</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계획을 가지는 것에는.</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> <span class=\"grammar-hl\">having plans</span>.</b></span></div></div><div class=\"lec-sent-ko\">그리고 계획을 가지는 것에는 아무런 잘못도 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장만 보면 계획을 세우는 일 자체를 비판하는 것처럼 보일 수 있어서, 글쓴이는 균형을 잡습니다. 계획은 삶을 정리하고 목표를 향해 움직이게 해 주는 유용한 도구입니다. 이 문장은 뒤에서 나올 ‘계획하기’와 ‘계획에 집착하기’의 차이를 설명하기 위한 전환점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there&#39;s nothing wrong with (관용표현): there is nothing wrong with는 ‘~에는 문제가 없다’라는 고정 표현이며, with 뒤에는 명사나 동명사가 온다.</div><div class=\"lec-gr-item\">having plans (동명사구): having plans는 전치사 with의 목적어로 쓰인 명사 역할의 -ing 구이다.</div><div class=\"lec-gr-item\">there&#39;s nothing wrong there 구문: there is + 주어 구조에서 실제 주어는 nothing wrong이며, there는 문장 앞에서 존재를 나타내는 형식적 요소로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 생각한다</span><span class=\"en\"><b><span class=\"grammar-hl\">I think</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것이 아주 아름다운 것이라고.</span><span class=\"en\"><b><span class=\"grammar-hl\">it's a beautiful thing</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 그것이 아주 아름다운 것이라고 생각한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 생각을 더 강하게 보충합니다. 글쓴이는 계획을 세우는 행위를 긍정적으로 봅니다. 계획은 미래를 상상하고, 삶을 더 나은 방향으로 이끌려는 인간의 능동적인 태도이기 때문입니다. 그래서 다음 문장에서 계획의 가치와 집착의 위험을 구분합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">I think it&#39;s a beautiful thing (명사절): think 뒤에는 접속사 that이 생략된 내용절이 목적어로 온다. 전체 구조는 I think (that) it is a beautiful thing이다.</div><div class=\"lec-gr-item\">it&#39;s a beautiful thing (기본문형): it이 주어, is가 be동사, a beautiful thing이 주격보어인 SVC 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 차이가 있다</span><span class=\"en\"><b>But <span class=\"grammar-hl\">there's a difference</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계획을 세우는 것과</span><span class=\"en\"><b><span class=\"grammar-hl\">between</span> <span class=\"grammar-hl\">planning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">믿는 것 사이에는</span><span class=\"en\"><b>and <span class=\"grammar-hl\">thinking</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">세운 모든 계획이 열매를 맺어야 한다고.</span><span class=\"en\"><b><span class=\"grammar-hl\">all your plans have to come to fruition</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 계획을 세우는 것과, 세운 모든 계획이 열매를 맺어야 한다고 믿는 것 사이에는 차이가 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 긍정적 평가 뒤에 핵심 구분을 제시합니다. 계획을 세우는 것은 필요하지만, 세운 계획이 모두 그대로 이루어져야 한다고 믿으면 현실의 변화에 유연하게 대응하기 어려워집니다. 이 문장은 글 전체의 중심 주장에 가깝고, 다음의 아이젠하워 인용문이 이를 뒷받침합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">there&#39;s a difference between there 구문: there is + 주어 구조이며, 실제 주어는 a difference이다. between은 뒤의 두 요소를 연결해 차이가 나는 대상을 제시한다.</div><div class=\"lec-gr-item\">planning (동명사): planning은 between 뒤에서 명사 역할을 하며, thinking과 병렬 구조를 이룬다.</div><div class=\"lec-gr-item\">thinking all your plans have to come to fruition (동명사구): thinking은 between의 목적어로 쓰인 명사 역할의 -ing 형태이며, 뒤의 all your plans have to come to fruition은 thinking의 내용절이다.</div><div class=\"lec-gr-item\">have to come to fruition 준조동사 구조: have to + 동사원형 구조로 의무나 필요를 나타내며, 뒤에 동사원형 come이 온다. come to fruition은 하나의 동사구로 연결된다.</div><div class=\"lec-gr-item\">come to fruition (관용표현): come to fruition은 ‘계획·생각 등이 실현되다’라는 의미의 관용적 동사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">come to fruition</td><td class=\"m\">결실을 맺다, 실현되다, 성과를 내다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">미국의 대통령 Eisenhower는</span><span class=\"en\"><b>American president Eisenhower</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한때 말했다</span><span class=\"en\"><b><span class=\"grammar-hl\">once said</span>:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘계획은 쓸모없지만</span><span class=\"en\"><b>‘<span class=\"grammar-hl\">Plans are worthless</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계획하는 것은 모든 것이다.’</span><span class=\"en\"><b>but <span class=\"grammar-hl\">planning is everything</span>.’</b></span></div></div><div class=\"lec-sent-ko\">미국의 대통령 Eisenhower는 한때 ‘계획은 쓸모없지만, 계획하는 것은 모든 것이다.’라고 말했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 구분을 유명한 인용으로 강화합니다. 아이젠하워의 말은 전쟁이나 국가 운영처럼 변수가 많은 상황에서는 처음 세운 계획이 그대로 맞아떨어지기 어렵지만, 계획을 세우며 상황을 분석하고 대비하는 과정은 매우 중요하다는 뜻입니다. 글쓴이는 이 말을 통해 고정된 결과보다 유연한 준비 자세가 중요하다고 말합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">once said 동사 구조: said가 문장의 주동사이며, 뒤의 직접 인용 내용 전체가 said의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">Plans are worthless (기본문형): Plans가 주어, are가 be동사, worthless가 주격보어인 SVC 구조이다.</div><div class=\"lec-gr-item\">planning is everything (동명사): planning은 명사 역할을 하며 문장의 주어로 쓰였다. is everything은 주어 planning을 설명하는 보어 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">worthless</td><td class=\"m\">가치 없는, 쓸모없는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">상상해 보라</span><span class=\"en\"><b><span class=\"grammar-hl\">Imagine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 모두 연필을 사용한다고</span><span class=\"en\"><b><span class=\"grammar-hl\">if we all used pencil</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잉크 대신</span><span class=\"en\"><b><span class=\"grammar-hl\">instead of ink</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">글을 쓰기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to write</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 달력과 플래너에.</span><span class=\"en\"><b><span class=\"grammar-hl\">in our calendars and planners</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리가 모두 우리의 달력과 플래너에 잉크 대신 연필로 글을 쓴다고 상상해 보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 추상적인 주장을 일상적인 이미지로 바꿔 보여 줍니다. 잉크는 쉽게 지우기 어렵고, 연필은 고치기 쉽습니다. 달력과 일정표를 연필로 쓴다는 상상은 우리의 계획도 상황에 따라 수정될 수 있다는 태도를 상징합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Imagine if we all used pencil instead of ink 조건절 구조: Imagine 뒤에 if절이 와서 가정하는 내용을 제시한다. if we all used pencil은 if + 주어 + 과거동사 구조로, 실제가 아닌 상황을 상상하게 하는 형태이다.</div><div class=\"lec-gr-item\">to write in our calendars and planners (to부정사): to write는 목적을 나타내는 부사적 용법으로, used pencil instead of ink가 어떤 목적을 위한 것인지 설명한다.</div><div class=\"lec-gr-item\">instead of ink (전치사구): instead of는 ‘~ 대신에’라는 의미의 전치사구이며, 뒤에 명사 ink가 목적어로 온다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 11 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비유적으로 그리고 문자 그대로 둘 다.</span><span class=\"en\"><b><span class=\"grammar-hl\">Both figuratively and literally</span>.</b></span></div></div><div class=\"lec-sent-ko\">비유적으로 그리고 문자 그대로 둘 다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 이미지를 두 방향으로 확장합니다. 비유적으로는 마음속 계획을 유연하게 가져가자는 뜻이고, 실제로는 일정표를 정말 고칠 수 있게 적어 보자는 뜻입니다. 짧은 문장이지만 글쓴이가 말하는 유연성이 단순한 생각에 머물지 않고 생활 방식으로 이어질 수 있음을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Both figuratively and literally 병렬 구조: both A and B 구조로 두 부사 figuratively와 literally를 대등하게 연결한다.</div><div class=\"lec-gr-item\">figuratively and literally (부사구): 두 부사가 병렬로 연결되어 앞 문장의 Imagine if we all used pencil instead of ink라는 내용을 수식하는 생략된 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 12 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">상상해 보라</span><span class=\"en\"><b>Imagine</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 염두에 둘 수 있는지를</span><span class=\"en\"><b>if we could <span class=\"grammar-hl\">bear in mind</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 적어 놓는 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">that what we write down,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 생각하기에 일어날 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">what we think is going to happen,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아닐 수도 있음을</span><span class=\"en\"><b><span class=\"grammar-hl\">might not be</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">실제로 일어나는 것이.</span><span class=\"en\"><b><span class=\"grammar-hl\">what actually happens</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 우리가 적어 놓는 것, 우리가 생각하기에 일어날 것은 실제로 일어나는 것이 아닐 수도 있다는 점을 염두에 둘 수 있는지를 상상해 보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 ‘연필로 쓰기’ 비유를 더 직접적으로 풀어 설명합니다. 계획표에 적은 일정이나 머릿속 예상은 미래의 확정된 모습이 아니라 현재의 예상일 뿐입니다. 이 문장은 현실이 계획과 다르게 흘러갈 수 있음을 늘 의식하는 태도를 강조하며, 마지막 문장의 받아들임으로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">bear in mind (관용표현): bear in mind는 ‘명심하다/마음에 두다’라는 의미의 동사구이며, 뒤에 that절을 목적어로 취한다.</div><div class=\"lec-gr-item\">that what we write down, what we think is going to happen, might not be what actually happens (명사절): that절 전체가 bear in mind의 목적어 역할을 한다. 구조는 bear in mind + that + S + V이며, that절 안의 주어 부분이 what절들로 이루어져 있다.</div><div class=\"lec-gr-item\">what we write down (관계대명사): what은 선행사를 포함한 관계대명사로, the thing that의 의미를 가진다. what we write down 전체가 명사절로 쓰이며 that절 안에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">write down (관용표현): write down은 ‘적어 두다’라는 의미의 구동사이며, what이 write down의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">what we think is going to happen (관계대명사): what은 선행사를 포함한 관계대명사로, 전체 what절이 앞의 what we write down과 동격적으로 나열된다. we think는 삽입절처럼 들어가고, what이 is going to happen의 주어 역할을 한다.</div><div class=\"lec-gr-item\">is going to happen (미래표현): be going to + 동사원형 구조로 예정·예측을 나타내며, 여기서는 is going to 뒤에 동사원형 happen이 온다.</div><div class=\"lec-gr-item\">what actually happens (관계대명사): what은 선행사를 포함한 관계대명사로, the thing that actually happens의 구조이다. be동사 뒤에서 보어 역할을 하는 명사절로 쓰였다.</div><div class=\"lec-gr-item\">might not be 조동사 구조: might not + 동사원형 be 구조로, 확실하지 않은 가능성을 나타낸다. 조동사 뒤에는 동사원형이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bear in mind</td><td class=\"m\">명심하다, 마음에 두다, 기억하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 13 / 13</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그리고 우리가 최선을 다할 수 있는지를</span><span class=\"en\"><b>And <span class=\"grammar-hl\">if we could try our best</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">괜찮아지도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to be all right</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것에 대해.</span><span class=\"en\"><b><span class=\"grammar-hl\">with that</span>.</b></span></div></div><div class=\"lec-sent-ko\">그리고 그것에 대해 괜찮아지도록 우리가 최선을 다할 수 있는지.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 상상을 이어받아 글의 결론을 맺습니다. 여기서 ‘그것’은 계획한 일과 실제 일어난 일이 달라지는 상황을 가리킵니다. 글쓴이는 불확실성을 완전히 없애려 하기보다, 계획이 바뀌고 예상이 빗나가도 마음을 무너뜨리지 않고 받아들이는 태도를 제안합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">if we could try our best 조건절 구조: if + 주어 + 조동사 + 동사원형 구조이다. could try는 가정적 상황에서의 가능성을 나타낸다.</div><div class=\"lec-gr-item\">try our best (관용표현): try one&#39;s best는 ‘최선을 다하다’라는 의미의 관용표현이며, our가 one&#39;s 자리에 들어간 형태이다.</div><div class=\"lec-gr-item\">to be all right with that (to부정사): to be는 try our best 뒤에 이어져 ‘무엇을 하려고 최선을 다하는지’를 나타내는 부사적 용법이다.</div><div class=\"lec-gr-item\">be all right with that (관용표현): be all right with는 ‘~을 괜찮게 받아들이다/문제없다고 여기다’라는 의미의 표현이며, with 뒤에 that이 전치사의 목적어로 온다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간은 미래를 알고 싶어 하지만, 실제 삶은 늘 불확실성으로 가득하다.</li><li>불확실성이 두려워 사람들은 세상이 예측 가능하다고 믿고 자신의 계획에 집착한다.</li><li>계획을 세우는 일은 가치 있지만, 모든 계획이 반드시 그대로 실현되어야 한다고 믿으면 경직된다.</li><li>글쓴이는 계획을 연필로 쓰듯 유연하게 수정하고, 예상과 다른 현실도 받아들이는 태도를 제안한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People often cling to plans to avoid uncertainty, but true awareness requires accepting that things may not happen as expected.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 불확실성을 피하려고 계획에 집착하지만, 진정한 자각은 일이 예상대로 일어나지 않을 수 있음을 받아들이는 것을 필요로 한다.</div></div></div>"],"segs":[[{"audio":"./24_audio/1.mp3","hl":null}],[{"audio":"./24_audio/2.mp3","hl":null}],[{"audio":"./24_audio/3.mp3","hl":null},{"audio":"./24_audio/4.mp3","hl":"stage-0"},{"audio":"./24_audio/5.mp3","hl":"stage-1"},{"audio":"./24_audio/6.mp3","hl":"stage-2"},{"audio":"./24_audio/7.mp3","hl"
