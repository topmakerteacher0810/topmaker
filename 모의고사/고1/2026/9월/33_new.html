<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>33번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"33번","audioDir":"33_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">33번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>Beyond Mimesis: Rethinking the Definition of Art\u003c/h1>\u003ch2>모방을 넘어서: 예술의 정의에 대한 재고\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>고대 그리스인들은 예술을 시각적 경험의 \u003cb class=\"key\">모방\u003c/b>이라 정의했으나, 잭슨 폴락과 같은 현대 예술가들은 의도적으로 모방을 거부함으로써 예술이 \u003cb class=\"key\">단순한 \u003c/b>\u003cb class=\"key\">모사\u003c/b>만으로 정의될 수 없음을 입증했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The traditional view of art as a representation of reality, originated in ancient Greece, is insufficient to define art, as demonstrated by modern abstract artists who avoid copying existing objects.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 예술의 정의가 시대에 따라 어떻게 변해왔는지 다루는 흥미로운 지문을 공부해 보겠습니다. 이 글은 고대 그리스의 모방 중심 예술관이 현대의 추상 예술을 만나 어떻게 그 한계를 드러내는지 설명하고 있어요. 한마디로 요약하면 예술은 단순한 모사 그 이상이라는 것이죠. 그럼 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">미메시스\u003c/b>(Mimesis)는 고대 그리스어로 '모방'을 뜻하며, 플라톤과 아리스토텔레스 이후 서구 예술의 핵심 원리였습니다. 당시 예술가들은 마치 \u003cb class=\"key\">거울\u003c/b>이 세상을 비추듯 현실을 똑같이 재현하는 능력을 최고의 가치로 여겼습니다. 제욱시스(Zeuxis)가 그린 포도 그림에 새들이 날아와 쪼았다는 일화는 당시의 \u003cb class=\"key\">사실주의\u003c/b>(Realism) 열망을 잘 보여줍니다. 하지만 20세기 \u003cb class=\"key\">추상표현주의\u003c/b>(Abstract Expressionism)의 등장은 이러한 전통적 관점을 완전히 뒤집었습니다. 잭슨 폴락은 형상을 그리는 대신 물감을 뿌리는 행위 자체를 예술로 승화시키며, 예술의 본질이 \u003cb class=\"key\">재현\u003c/b>에만 있지 않음을 보여주었습니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 독해에 앞서 미메시스라는 개념을 알아두면 좋습니다. 고대 그리스인들에게 예술은 자연을 비추는 거울과 같았어요. 얼마나 실물과 똑같이 그리느냐가 실력의 척도였죠. 하지만 1950년대 뉴욕 화파의 잭슨 폴락은 물감을 뿌리는 액션 페인팅을 통해 이런 전통을 깼습니다. 사물의 형태가 없는 그림도 예술이 될 수 있다는 걸 보여준 추상표현주의의 등장을 이해하는 것이 이 글의 핵심 배경입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>고대 그리스의 예술관\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>고대 그리스인들은 예술의 목표가 시각적 경험을 \u003cb class=\"key\">모방\u003c/b>하는 것이라고 믿었습니다. 이러한 관점은 당시 조각과 도자기에 나타난 \u003cb class=\"key\">사실주의\u003c/b>적 화풍에 잘 반영되어 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>유실된 회화와 추론\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>그리스 시대의 회화는 현재 남아있지 않지만, 기록된 \u003cb class=\"key\">일화\u003c/b>나 도자기 그림을 통해 그들의 뛰어난 \u003cb class=\"key\">모사 \u003c/b>\u003cb class=\"key\">기량\u003c/b>을 충분히 짐작할 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>기존 정의의 문제점\u003csmall>전환 · 문장 5\u003c/small>\u003c/h4>\u003cp>예술을 단순히 현실의 복제로 보는 정의는 \u003cb class=\"key\">한계\u003c/b>가 있으며, 모든 예술을 설명하기에는 \u003cb class=\"key\">문제가 \u003c/b>\u003cb class=\"key\">있음\u003c/b>을 시사합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>현대 예술의 반례\u003csmall>반례 및 결론 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>잭슨 폴락은 의도적으로 실재하는 대상을 \u003cb class=\"key\">모방하지 \u003c/b>\u003cb class=\"key\">않는\u003c/b> 작품 활동을 했습니다. 그는 알아볼 수 있는 형상을 피함으로써, 예술은 단순한 \u003cb class=\"key\">미메시스\u003c/b>만으로 충분히 정의되지 않는다는 사실을 증명했습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 과거의 전통적 관점에서 시작해서 현대의 반례를 통해 결론을 도출하는 전형적인 논리 구조를 가지고 있습니다.","hl":null},{"n":4,"text":"먼저 첫 번째와 두 번째 문장은 고대 그리스인들의 생각을 보여줍니다. 예술가의 목표는 오직 시각적 경험을 모방하는 것이었죠. 조각과 도자기에서 나타나는 사실주의가 그 증거라고 말하고 있습니다.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 비록 당시의 회화 작품은 날씨와 시간 때문에 사라졌지만, 제욱시스 같은 전설적인 화가들의 이야기나 도자기의 기량을 통해 그 수준이 엄청났음을 추측할 수 있다고 덧붙입니다.","hl":"f1"},{"n":6,"text":"하지만 다섯 번째 문장에서 분위기가 확 바뀝니다. 현실을 모방하는 것으로 예술을 정의하는 데 문제가 있다는 점을 지적하죠. 여기서부터 글의 필자가 진짜 하고 싶은 이야기가 시작되는 전환점입니다.","hl":"f2"},{"n":7,"text":"마지막으로 6번부터 8번까지는 잭슨 폴락의 사례를 듭니다. 그는 의도적으로 아무것도 닮지 않은 그림을 그렸어요. 이를 통해 예술을 단순한 모방인 미메시스로만 정의하는 것은 충분하지 않다는 결론을 내리고 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">초반부에는 예술을 모방으로 보았던 고대 그리스의 \u003cb class=\"key\">전통적 \u003c/b>\u003cb class=\"key\">통념\u003c/b>을 설명합니다. 하지만 5번 문장의 \u003cb class=\"key\">역접어\u003c/b> though를 기점으로 분위기를 전환하며, 잭슨 폴락이라는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">반례\u003c/b>를 제시합니다. 마지막 문장에서 모방만으로는 예술을 \u003cb class=\"key\">충분히 \u003c/b>\u003cb class=\"key\">정의\u003c/b>할 수 없다는 결론을 내리고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>though (5)\u003c/b>\u003cspan>역접 및 전환\u003c/span>\u003cb>thus (8)\u003c/b>\u003cspan>인과 및 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">copy visual experience\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">realism\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mimesis\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">simple copying\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>고대 그리스 예술관\u003c/th>\u003cth>잭슨 폴락(뉴욕 화파)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>시각적 경험의 모방(Mimesis)\u003c/td>\u003ctd>의도적으로 기존 사물을 모방하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사실주의적 조각과 도자기\u003c/td>\u003ctd>알아볼 수 있는 형상을 피함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 초반에 고정 관념을 제시하고 뒤에서 이를 뒤집는 통념 반박 구조를 취하고 있습니다. 마지막 문장에 결론이 위치하는 미괄식 구성이라 끝까지 집중해서 읽어야 주제를 명확히 잡을 수 있습니다.","hl":"ty"},{"n":9,"text":"문장 중간에 숨어있는 though라는 신호어에 주목하세요. 문장 끝에 왔지만 하지만이라는 뜻으로 글의 흐름을 꺾어줍니다. 또한 마지막 문장의 thus는 인과 관계를 나타내며 최종적인 요지를 정리해 주는 역할을 하죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>ancient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>visual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>시각적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>goal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목표\u003c/span>\u003c/div>\u003cdiv>\u003cb>copy\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모방하다, 복제하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경험\u003c/span>\u003c/div>\u003cdiv>\u003cb>approach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>접근(법)\u003c/span>\u003c/div>\u003cdiv>\u003cb>realism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사실주의\u003c/span>\u003c/div>\u003cdiv>\u003cb>sculpture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조각\u003c/span>\u003c/div>\u003cdiv>\u003cb>pottery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도자기\u003c/span>\u003c/div>\u003cdiv>\u003cb>note\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주목하다, 언급하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>due to\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>surmise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>짐작하다, 추측하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질, 품질\u003c/span>\u003c/div>\u003cdiv>\u003cb>based on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 근거하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>obvious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>분명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>skill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기량, 기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>survive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>살아남다, 남아있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>definition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정의\u003c/span>\u003c/div>\u003cdiv>\u003cb>intentionally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>의도적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>existing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기존의, 존재하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>consciously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>의식적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>resemble\u003c/b>\u003cem>동사\u003c/em>\u003cspan>닮다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recognizable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>알아볼 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>demonstrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입증하다, 보여주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mimesis\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모사, 모방\u003c/span>\u003c/div>\u003cdiv>\u003cb>sufficiently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>충분히\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 살펴볼까요? 모방하다라는 뜻의 copy는 지문 전체의 핵심 키워드입니다. surmise는 짐작하다라는 뜻인데 수능에서도 자주 나오니 꼭 외워두세요. 그리고 추상 예술을 설명할 때 나온 recognizable은 알아볼 수 있는이라는 뜻입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">copy\u003c/b>\u003cspan class=\"m\">모방하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">imitate\u003c/span>\u003cspan class=\"s\">replicate\u003c/span>\u003cspan class=\"s\">reproduce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">originate\u003c/span>\u003cspan class=\"a\">create\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">surmise\u003c/b>\u003cspan class=\"m\">추측하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guess\u003c/span>\u003cspan class=\"s\">infer\u003c/span>\u003cspan class=\"s\">conjecture\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">confirm\u003c/span>\u003cspan class=\"a\">know\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">intentionally\u003c/b>\u003cspan class=\"m\">의도적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deliberately\u003c/span>\u003cspan class=\"s\">purposely\u003c/span>\u003cspan class=\ \u003cdiv class=\"lp-ko\">고대 그리스인들은 시각 예술가의 목표가 시각적 경험을 모방하는 것이라고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고대 그리스인들이 생각했던 예술의 핵심 목적이 현실에 대한 \u003cb class=\"key\">재현\u003c/b>과 \u003cb class=\"key\">모방\u003c/b>에 있었음을 설명하는 도입부 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : felt [동사] + [that (접속사) + S + V (목적어절)] : \"~라고 생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (보어)\u003c/span> : was [be동사] + [to copy (to부정사구/보어)] : \"모방하는 것이었다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The ancient Greeks felt, 고대 그리스인들은 생각했다. that the visual artist's goal, 시각 예술가의 목표가. was to copy visual experience, 시각적 경험을 모방하는 것이라고.. 이 문장 전체를 해석하면, 고대 그리스인들은 시각 예술가의 목표가 시각적 경험을 모방하는 것이라고 생각했다.","hl":"m"},{"n":13,"text":"예술이 단순히 아름다움을 창조하는 것이 아니라, 우리가 눈으로 보는 세상을 그대로 재현하고 모방하는 데 목적이 있었다는 당시의 관점을 보여줍니다.","hl":"mn"},{"n":14,"text":"첫 번째로 felt 뒤의 that은 목적어 자리에 오는 명사절 접속사입니다. 생략도 가능하죠. 두 번째로 to copy는 be동사 뒤에서 목표가 무엇인지 보충 설명하는 보어 역할을 하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 접근은 나타난다\u003c/span>\u003cspan class=\"en\">This approach \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">appears\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실주의에\u003c/span>\u003cspan class=\"en\">in the realism\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 그리스 조각과 도자기의.\u003c/span>\u003cspan class=\"en\">of ancient Greek sculpture and pottery.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 접근은 고대 그리스 조각과 도자기의 사실주의에 나타난다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 '모방'이라는 예술적 접근 방식이 실제 고대 유물인 \u003cb class=\"key\">조각\u003c/b>과 \u003cb class=\"key\">도자기\u003c/b>에 어떻게 구현되었는지 보여주는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 수 일치\u003c/span> : This approach [단수 주어] + [appears (단수 동사)] : \"나타난다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"This approach appears, 이런 접근은 나타난다. in the realism, 사실주의에. of ancient Greek sculpture and pottery, 고대 그리스 조각과 도자기의.. 이 문장 전체를 해석하면, 이런 접근은 고대 그리스 조각과 도자기의 사실주의에 나타난다.","hl":"m"},{"n":16,"text":"모방을 중시하는 태도가 추상적인 생각이 아니라, 우리가 박물관에서 보는 실제 조각상이나 도자기의 아주 사실적인 묘사 속에 녹아있다는 뜻입니다.","hl":"mn"},{"n":17,"text":"문장의 주어가 This approach라는 단수 형태인 것에 주목하세요. 그래서 동사 appear 뒤에 s를 붙인 단수 동사 형태를 사용해야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 슬프게도 주목해야 한다\u003c/span>\u003cspan class=\"en\">We must sadly \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">note \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간과 날씨의 작용 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">due \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> the action of time and weather,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 그리스 예술가들의 어떤 회화 작품도\u003c/span>\u003cspan class=\"en\">no paintings from ancient Greek artists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날 존재하지 않는다는 점을.\u003c/span>\u003cspan class=\"en\">exist today.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 시간과 날씨의 작용 때문에 고대 그리스 예술가들의 회화 작품이 오늘날 존재하지 않는다는 점을 슬프게도 주목해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 조각이나 도자기와 달리 고대 그리스의 \u003cb class=\"key\">회화(그림)\u003c/b>는 보존상의 이유로 사라졌다는 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">사실\u003c/b>을 언급하며 정보의 공백을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : note [동사] + [that (접속사) + S + V (목적어절)] : \"~라는 점에 주목하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유의 전치사구\u003c/span> : due to [전치사] + [the action (명사구)] : \"~때문에\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"We must sadly note that, 우리는 슬프게도 주목해야 한다. due to the action of time and weather, 시간과 날씨의 작용 때문에. no paintings from ancient Greek artists, 고대 그리스 예술가들의 어떤 회화 작품도. exist today, 오늘날 존재하지 않는다는 점을.. 이 문장 전체를 해석하면, 우리는 시간과 날씨의 작용 때문에 고대 그리스 예술가들의 회화 작품이 오늘날 존재하지 않는다는 점을 슬프게도 주목해야 한다.","hl":"m"},{"n":19,"text":"그리스 예술의 모방 정신을 보여줄 수 있는 그림들이 시간의 흐름과 날씨 탓에 모두 사라져 버렸다는 안타까운 사실을 전하고 있습니다.","hl":"mn"},{"n":20,"text":"동사 note와 그 목적어인 that절 사이에 이유를 나타내는 due to 전치사구가 끼어들어 문장이 길어졌습니다. because와 달리 due to 뒤에는 주어 동사가 없는 명사구가 온다는 점 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 오직 그것들의 질을 짐작할 수 있을 뿐이다\u003c/span>\u003cspan class=\"en\">We can only surmise their quality\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Zeuxis와 Parhassios의 그것과 같은 이야기,\u003c/span>\u003cspan class=\"en\">based on tales such as \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> Zeuxis and Parhassios,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 그리스 조각의 분명한 기량,\u003c/span>\u003cspan class=\"en\">the obvious skill in ancient Greek sculpture,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 고대 그리스 도자기 위에 남아있는 그림들을 바탕으로.\u003c/span>\u003cspan class=\"en\">and in drawings \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">survive\u003c/span> on ancient Greek pottery.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 Zeuxis와 Parhassios의 그것과 같은 이야기, 고대 그리스 조각의 분명한 기량, 그리고 고대 그리스 도자기 위에 남아있는 그림들을 바탕으로 그것들의 질을 오직 짐작할 수 있을 뿐이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실제 고대 그리스 회화가 남아있지 않아 문학적 \u003cb class=\"key\">기록\u003c/b>과 현존하는 조각, 도자기의 \u003cb class=\"key\">숙련도\u003c/b>를 통해 실력을 추론한다는 내용입니다. 고대 그리스 예술가들의 실력이 매우 뛰어났음을 \u003cb class=\"key\">간접적 \u003c/b>\u003cb class=\"key\">근거\u003c/b>로 증명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 that\u003c/span> : [단수 명사(tales 아님)] → [that] : \"그것(이야기)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : [선행사(drawings)] + [that (주격 관대)] + [동사(survive)] : \"남아있는 (그림들)\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"We can only surmise their quality, 우리는 오직 그것들의 질을 짐작할 수 있을 뿐이다. based on tales such as that of Zeuxis and Parhassios, Zeuxis와 Parhassios의 그것과 같은 이야기. the obvious skill in ancient Greek sculpture, 고대 그리스 조각의 분명한 기량. and in drawings that survive on ancient Greek pottery, 그리고 고대 그리스 도자기 위에 남아있는 그림들을 바탕으로.. 이 문장 전체를 해석하면, 우리는 Zeuxis와 Parhassios의 그것과 같은 이야기, 고대 그리스 조각의 분명한 기량, 그리고 고대 그리스 도자기 위에 남아있는 그림들을 바탕으로 그것들의 질을 오직 짐작할 수 있을 뿐이다.","hl":"m"},{"n":22,"text":"그리스 시대의 그림은 날씨와 시간 때문에 다 사라져서 볼 수가 없어요. 그래서 우리는 당시 기록이나 조각상의 실력을 보고 당시 그림도 대단했을 거라고 간접적 근거를 통해 추론할 수밖에 없다는 점을 설명하는 문장입니다.","hl":"mn"},{"n":23,"text":"여기서 대단히 중요한 포인트가 두 개 나옵니다. 첫 번째는 지시대명사 that인데요. 앞의 내용과 중복을 피하기 위해 쓴 명사 대용어입니다. 두 번째는 drawings를 꾸며주는 주격 관계대명사 that입니다. 문장이 길지만 이 관계사절이 무엇을 수식하는지 파악하고 수 일치까지 챙겨야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술의 이런 정의는\u003c/span>\u003cspan class=\"en\">This definition of art\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현실을 모방하는 것으로의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">copying\u003c/span> reality\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 문제가 있다.\u003c/span>\u003cspan class=\"en\">has a problem, though.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 현실을 모방하는 것으로의 예술의 이런 정의는 문제가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 예술을 단순한 \u003cb class=\"key\">재현\u003c/b>이나 복제로 보는 고대 그리스식 관점의 \u003cb class=\"key\">한계\u003c/b>를 지적하기 시작하는 문장입니다. 문장 끝의 \u003cb class=\"key\">though\u003c/b>는 문맥 전체의 흐름을 뒤집는 연결어 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : [전치사(as)] + [동명사(copying)] : \"모방하는 것으로서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : [단수 주어(definition)] + [수식어구] + [단수 동사(has)] : \"정의는 ~을 가진다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"This definition of art, 예술의 이런 정의는. as copying reality, 현실을 모방하는 것으로의. has a problem, though, 하지만 문제가 있다.. 이 문장 전체를 해석하면, 하지만, 현실을 모방하는 것으로의 예술의 이런 정의는 문제가 있다.","hl":"m"},{"n":25,"text":"그리스인들은 예술이 현실을 그대로 베끼는 것이라고 생각했어요. 하지만 이 문장부터는 그런 생각에 결함이 있다는 것을 보여주며 글의 방향이 바뀝니다.","hl":"mn"},{"n":26,"text":"주어는 맨 앞의 definition이고 동사는 한참 뒤에 있는 has입니다. 수 일치 문제를 풀 때 중간에 있는 단어들에 속지 말고 진짜 주어를 찾는 게 핵심입니다. 또한 전치사 as 뒤에 동명사 copying이 와서 모방하는 것이라는 의미를 완성하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jackson Pollock은\u003c/span>\u003cspan class=\"en\">Jackson Pollock,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1950년대 뉴욕 화파의 리더인\u003c/span>\u003cspan class=\"en\">a leader in the New York School of the 1950's,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의도적으로 모방하지 않았다\u003c/span>\u003cspan class=\"en\">intentionally did not copy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 예술 안에서 기존 사물을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">existing\u003c/span> objects in his art.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1950년대 뉴욕 화파의 리더 Jackson Pollock은 그의 예술 안에서 기존 사물을 의도적으로 모방하지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 고대 그리스의 모방 중심 예술관에 반하는 \u003cb class=\"key\">현대 \u003c/b>\u003cb class=\"key\">미술\u003c/b>의 예시로 잭슨 폴록을 제시합니다. 현실의 대상을 \u003cb class=\"key\">재현하지 \u003c/b>\u003cb class=\"key\">않는\u003c/b> 새로운 형태의 예술이 등장했음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사(명사 수식)\u003c/span> : [현재분사(existing)] + [명사(objects)] : \"기존의(현존하는) 사물들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동격의 콤마\u003c/span> : [명사1(Jackson Pollock)] , [명사2(a leader...)] , : \"리더인 (잭슨 폴록)\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Jackson Pollock, Jackson Pollock은. a leader in the New York School of the 1950's, 1950년대 뉴욕 화파의 리더인. intentionally did not copy, 의도적으로 모방하지 않았다. existing objects in his art, 그의 예술 안에서 기존 사물을. 이 문장 전체를 해석하면, 1950년대 뉴욕 화파의 리더 Jackson Pollock은 그의 예술 안에서 기존 사물을 의도적으로 모방하지 않았다.","hl":"m"},{"n":28,"text":"앞서 말한 예술의 정의에 반대되는 실제 인물로 잭슨 폴록을 소개하고 있습니다. 그는 현실 세계의 물건들을 똑같이 그리려 하지 않았던 현대 미술의 대표 주자입니다.","hl":"mn"},{"n":29,"text":"주어인 이름 뒤에 콤마가 보이죠? 이건 잭슨 폴록이 누구인지 설명해주는 동격의 콤마입니다. 그리고 사물을 꾸며주는 existing은 현재분사로 쓰여서 이미 존재하고 있는 사물이라는 뜻을 더해줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 작품들을 그리는 동안,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While \u003c/span>\u003cspan class=\"tgt\">painting\u003c/span> these works,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Pollock과 그의 동료 예술가들은\u003c/span>\u003cspan class=\"en\">Pollock and his fellow artists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흔적이나 부분을 만드는 것을 의식적으로 피하곤 했다\u003c/span>\u003cspan class=\"en\">would consciously \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">avoid \u003c/span>\u003cspan class=\"tgt\">making\u003c/span> marks or passages\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알아볼 수 있는 사물과 닮은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">resembled\u003c/span> recognizable objects.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 작품들을 그리는 동안, Pollock과 그의 동료 예술가들은 알아볼 수 있는 사물과 닮은 흔적이나 부분을 만드는 것을 의식적으로 피하곤 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 잭슨 폴록과 그의 동료들이 추상화를 그리며 대상의 \u003cb class=\"key\">재현적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>를 의도적으로 배제했음을 설명합니다. 이는 고대 그리스의 \u003cb class=\"key\">모방론\u003c/b>에 반하는 현대 미술의 태도를 보여주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (접속사 명시)\u003c/span> : While + [v-ing] : \"그리는 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : avoid + [v-ing (목적어)] : \"만드는 것을 피하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 (주격)\u003c/span> : marks or passages [선행사] + [that (주격 관계대명사) + resembled (동사)] : \"닮은\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"While painting these works, 이러한 작품들을 그리는 동안. Pollock and his fellow artists, Pollock과 그의 동료 예술가들은. would consciously avoid making marks or passages, 흔적이나 부분을 만드는 것을 의식적으로 피하곤 했다. that resembled recognizable objects, 알아볼 수 있는 사물과 닮은. 이 문장 전체를 해석하면, 이러한 작품들을 그리는 동안, Pollock과 그의 동료 예술가들은 알아볼 수 있는 사물과 닮은 흔적이나 부분을 만드는 것을 의식적으로 피하곤 했다.","hl":"m"},{"n":31,"text":"폴록은 사물을 있는 그대로 베끼는 것이 아니라 재현적 요소를 의도적으로 제거했습니다. 이것은 그리스 시대부터 이어진 모방론에 반기를 든 현대 미술의 핵심적인 태도입니다.","hl":"mn"},{"n":32,"text":"첫 번째로 While 뒤에 동사 원형이 아닌 painting이 왔죠. 접속사의 의미를 명확히 살린 분사구문입니다. 두 번째로 avoid는 뒤에 동명사만을 목적어로 쓰기 때문에 making이 와야 합니다. 마지막으로 that은 사물을 수식하며 주어 역할을 하는 주격 관계대명사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 예술 작품을 만드는 데 성공했고,\u003c/span>\u003cspan class=\"en\">They succeeded at making artwork\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 것도 모방하지 않은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">copy\u003c/span> anything,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로 ~라는 점을 보여주었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">thus \u003c/span>\u003cspan class=\"tgt\">demonstrating\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모사, 즉 단순한 모방으로서의 고대 그리스 예술관은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ancient \u003c/span>\u003cspan class=\"tgt\">Greek \u003c/span>\u003cspan class=\"tgt\">view\u003c/span> of art as mimesis ― simple copying ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예술을 충분히 정의하지는 못한다는 점을\u003c/span>\u003cspan class=\"en\">does not sufficiently define art.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 어떤 것도 모방하지 않은 예술 작품을 만드는 데 성공했고, 그러므로 모사, 즉 단순한 모방으로서의 고대 그리스 예술관은 예술을 충분히 정의하지는 못한다는 점을 보여주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 추상 미술의 성공을 통해 \u003cb class=\"key\">미메시스\u003c/b> 중심의 전통적 예술 정의가 가진 \u003cb class=\"key\">한계\u003c/b>를 입증하며 글을 마무리하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 (주격)\u003c/span> : artwork [선행사] + [that (주격 관계대명사) + did not copy (동사구)] : \"어떤 것도 모방하지 않은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (결과)\u003c/span> : [, thus + v-ing] : \"그러므로 ~을 보여주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절)\u003c/span> : demonstrating [타동사] + [that (접속사) + S + V (목적어)] : \"~라는 점을\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"They succeeded at making artwork, 그들은 예술 작품을 만드는 데 성공했고. that did not copy anything, 어떤 것도 모방하지 않은. thus demonstrating that, 그러므로 ~라는 점을 보여주었다. the ancient Greek view of art as mimesis ― simple copying ―, 모사, 즉 단순한 모방으로서의 고대 그리스 예술관은. does not sufficiently define art, 예술을 충분히 정의하지는 못한다는 점을. 이 문장 전체를 해석하면, 그들은 어떤 것도 모방하지 않은 예술 작품을 만드는 데 성공했고, 그러므로 모사, 즉 단순한 모방으로서의 고대 그리스 예술관은 예술을 충분히 정의하지는 못한다는 점을 보여주었다.","hl":"m"},{"n":34,"text":"결국 추상화의 성공은 예술이 단순히 대상을 복제하는 것이 아니라는 것을 증명했습니다. 전통적인 미메시스 관점이 가진 한계를 명확히 짚어주는 결론 부분입니다.","hl":"mn"},{"n":35,"text":"먼저 that은 artwork를 꾸며주는 형용사절을 이끌고 있어요. 다음으로 콤마 뒤에 나온 thus demonstrating은 결과를 나타내는 분사구문으로 해석하면 자연스럽습니다. 마지막으로 커다란 that은 문장 끝까지 이어지며 보여주는 내용 전체를 묶어주는 명사절 접속사입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>고대 그리스의 예술가들은 시각적 경험을 그대로 \u003cb class=\"key\">모방\u003c/b>하는 것을 일차적 목표로 삼았습니다.\u003c/li>\u003cli>현존하는 조각과 도자기를 통해 당시 예술의 뛰어난 \u003cb class=\"key\">사실주의적\u003c/b> 측면을 엿볼 수 있습니다.\u003c/li>\u003cli>잭슨 폴락은 기존 사물을 \u003cb class=\"key\">재현하지 \u003c/b>\u003cb class=\"key\">않는\u003c/b> 추상적 방식을 통해 고전적 예술 정의에 도전했습니다.\u003c/li>\u003cli>현대 예술의 사례는 예술이 단순한 \u003cb class=\"key\">미메시스\u003c/b>만으로는 정의될 수 없음을 분명히 보여줍니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The traditional view of art as a representation of reality, originated in ancient Greece, is insufficient to define art, as demonstrated by modern abstract artists who avoid copying existing objects.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">고대 그리스인들은 예술을 시각적 경험의 \u003cb class=\"key\">모방\u003c/b>이라 정의했으나, 잭슨 폴락과 같은 현대 예술가들은 의도적으로 모방을 거부함으로써 예술이 \u003cb class=\"key\">단순한 \u003c/b>\u003cb class=\"key\">모사\u003c/b>만으로 정의될 수 없음을 입증했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 지문을 통해 예술은 단순한 복제가 아니라 훨씬 더 넓은 범위를 포함한다는 걸 배웠습니다. 그리스의 미메시스부터 폴락의 추상화까지의 흐름을 잘 기억해 두세요. 특히 다섯 번째 문장에서의 역접과 마지막 문장의 결론 도출 과정을 복습하신다면 비슷한 구조의 지문을 만날 때 큰 도움이 될 겁니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
