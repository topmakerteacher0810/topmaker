<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"30번","audioDir":"30_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">30번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>The Visual Power of Short Paragraphs in Writing\u003c/h1>\u003ch2>글쓰기에서 짧은 단락이 가진 시각적 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>글의 시각적인 인상을 결정하는 \u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">단락\u003c/b>의 중요성을 강조하며, 독자의 몰입을 위해 \u003cb class=\"key\">적절한 \u003c/b>\u003cb class=\"key\">길이\u003c/b>의 단락 나누기가 필요함을 설명하는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Maintain short paragraphs for visual appeal and readability, but avoid over-fragmentation to preserve the flow of thought.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 효율적인 글쓰기 전략에 대해 다룬 지문을 함께 분석해 보겠습니다. 이 글은 독자의 시선을 사로잡기 위해 단락을 짧게 유지하는 것이 왜 중요한지, 그리고 그때 주의할 점은 무엇인지를 담고 있어요. 시각적 인상이 독서에 미치는 영향에 집중하며 들어보세요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">독자는 글의 내용을 파악하기 전, 먼저 눈으로 전체적인 \u003cb class=\"key\">레이아웃\u003c/b>을 스캔합니다. 이를 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">가독성\u003c/b>(Visual Readability)이라 하며, 빽빽한 글보다는 여백이 있는 글에 더 쉽게 다가갑니다. 마치 빽빽한 \u003cb class=\"key\">전공 \u003c/b>\u003cb class=\"key\">서적\u003c/b>보다 여백이 많은 시집이 더 가볍게 느껴지는 것과 같습니다. 적절한 \u003cb class=\"key\">단락 \u003c/b>\u003cb class=\"key\">나누기\u003c/b>(Paragraphing)는 독자의 심리적 장벽을 낮추는 중요한 전략입니다. 또한, 매체의 특성에 따라 \u003cb class=\"key\">글의 \u003c/b>\u003cb class=\"key\">너비\u003c/b>가 달라지면 단락의 길이도 조절해야 합니다.\u003c/div>","segs":[{"n":2,"text":"우리가 글을 읽을 때 뇌가 내용을 이해하기 전, 눈이 먼저 글의 형태를 봅니다. 이걸 시각적 가독성이라고 부르는데요. 빽빽한 전공 서적보다 여백이 넉넉한 시집을 볼 때 마음이 더 편해지는 것과 같은 원리죠. 단락 나누기는 단순히 내용을 끊는 것이 아니라, 독자의 심리적 장벽을 낮추는 레이아웃 전략입니다. 글의 너비에 따라 독자가 느끼는 피로도가 다르다는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>시각적 우위\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>단락을 짧게 유지하라는 주장과 함께, 글쓰기의 \u003cb class=\"key\">시각적\u003c/b> 특성을 강조합니다. 뇌가 내용을 이해하기 전에 \u003cb class=\"key\">눈\u003c/b>이 먼저 글의 인상을 결정하기 때문입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>가독성과 유인\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>짧은 단락은 여백을 통해 \u003cb class=\"key\">가독성\u003c/b>을 높이고 독자를 유인하지만, 긴 활자 덩어리는 거부감을 줍니다. 신문 기사의 \u003cb class=\"key\">좁은 \u003c/b>\u003cb class=\"key\">너비\u003c/b>가 단락 길이에 미치는 실제 사례를 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>우려에 대한 반박\u003csmall>전환 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>잦은 단락 나누기가 내용 전개를 해칠 것이라는 \u003cb class=\"key\">두려움\u003c/b>에 대해 논박합니다. 얻는 \u003cb class=\"key\">이점\u003c/b>이 예상되는 위험보다 훨씬 크다고 안심시킵니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>과도한 분절 경고\u003csmall>결론 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>지나치게 짧은 단락의 연속은 오히려 \u003cb class=\"key\">부작용\u003c/b>을 낳습니다. 생각의 흐름을 끊어 독자의 일을 더 \u003cb class=\"key\">어렵게\u003c/b> 만들기 때문입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 짧은 단락의 이점부터 시작해서, 흔한 걱정에 대한 반박, 그리고 과유불급의 원칙까지 체계적으로 이어집니다.","hl":null},{"n":4,"text":"먼저 첫 번째 단계에서는 글쓰기가 시각적이라는 점을 강조하며 단락을 짧게 하라고 주장합니다. 우리의 뇌가 의미를 파악하기도 전에 눈이 먼저 글을 보고 읽을지 말지 결정하기 때문이죠.","hl":"f0"},{"n":5,"text":"두 번째로는 짧은 단락이 여백을 만들어 독자를 환영하는 느낌을 준다고 설명해요. 반대로 신문 기사처럼 좁은 너비의 글에서 긴 덩어리가 보이면 가독성이 떨어져 독자가 시작조차 안 할 수 있습니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 단락을 자주 나누면 논리 전개가 손상될까 걱정하는 사람들에게 답을 줍니다. 필자는 그런 위험성보다 얻는 이점이 훨씬 크니 걱정하지 말라고 조언하고 있어요.","hl":"f2"},{"n":7,"text":"마지막으로는 주의사항을 덧붙입니다. 너무 짧은 단락만 계속되면 오히려 짜증을 유발할 수 있어요. 자연스러운 생각의 맥락을 잘라버려 독자의 일을 더 어렵게 만드는 부작용이 생기기 때문입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-반박-주의사항\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">초반에 짧은 단락의 시각적 이점을 \u003cb class=\"key\">주장\u003c/b>하며 독자의 시선을 끄는 법을 설명합니다. 중반부에는 단락 나누기의 위험성에 대한 우려를 \u003cb class=\"key\">반박\u003c/b>하며 타당성을 부여합니다. 마지막에는 너무 파편화된 단락이 줄 수 있는 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 언급하며 균형 잡힌 글쓰기를 제안합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>whereas (3)\u003c/b>\u003cspan>짧은 단락과 긴 활자 덩어리의 대조\u003c/span>\u003cb>But (8)\u003c/b>\u003cspan>과도한 단락 나누기에 대한 주의 전환\u003c/span>\u003cb>Actually (11)\u003c/b>\u003cspan>기대와 다른 실제 부정적 결과 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">short paragraphs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">air around what you write\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">inviting\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">frequent paragraphing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">gains\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">succession of tiny paragraphs\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Short Paragraphs\u003c/th>\u003cth>Long Chunks / Excessive Tiny Paragraphs\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Put air around writing, looking inviting\u003c/td>\u003ctd>Discourage reading, or annoy the reader\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Visual appeal before brain catches\u003c/td>\u003ctd>Chop up a natural train of thought\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 먼저 필자의 주장을 던지고 이를 뒷받침하는 근거를 제시하는 구조를 취하고 있습니다. 하지만 마지막에 예외적인 상황을 언급하며 균형을 맞추는 양괄식 구성을 보이고 있죠. 도입부의 주장과 후반부의 결론이 서로 보완적인 관계를 이룹니다.","hl":"ty"},{"n":9,"text":"세 번째 문장의 웨어래즈(whereas)를 통해 짧은 단락과 긴 활자 덩어리를 아주 명확하게 대조하고 있어요. 또한 여덟 번째 문장의 밧(But)은 과도한 짧음의 위험성으로 화제를 전환하는 중요한 신호어입니다. 마지막 11번의 액추얼리(Actually)는 일반적인 생각과 다른 부정적 실제 결과를 강조하며 마무리하죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>paragraph\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단락\u003c/span>\u003c/div>\u003cdiv>\u003cb>visual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>시각적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>eye\u003c/b>\u003cem>명사\u003c/em>\u003cspan>눈\u003c/span>\u003c/div>\u003cdiv>\u003cb>brain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뇌\u003c/span>\u003c/div>\u003cdiv>\u003cb>inviting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매력적인, 유혹하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>whereas\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하는 반면에\u003c/span>\u003c/div>\u003cdiv>\u003cb>chunk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>덩어리\u003c/span>\u003c/div>\u003cdiv>\u003cb>discourage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>낙담시키다, 꺼리게 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>narrow\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>좁은\u003c/span>\u003c/div>\u003cdiv>\u003cb>width\u003c/b>\u003cem>명사\u003c/em>\u003cspan>너비, 폭\u003c/span>\u003c/div>\u003cdiv>\u003cb>add up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>늘어나다, 합계가 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>frequent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잦은, 빈번한\u003c/span>\u003c/div>\u003cdiv>\u003cb>damage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>손상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>development\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전개, 발전\u003c/span>\u003c/div>\u003cdiv>\u003cb>obviously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>명백하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>be obsessed by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 사로잡히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fear\u003c/b>\u003cem>명사\u003c/em>\u003cspan>두려움\u003c/span>\u003c/div>\u003cdiv>\u003cb>relief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안도, 쉼\u003c/span>\u003c/div>\u003cdiv>\u003cb>outweigh\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~보다 중요하다, 능가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hazard\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위험\u003c/span>\u003c/div>\u003cdiv>\u003cb>succession\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연속\u003c/span>\u003c/div>\u003cdiv>\u003cb>tiny\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아주 작은\u003c/span>\u003c/div>\u003cdiv>\u003cb>annoying\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>짜증스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>verbless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>동사가 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>modern\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>현대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>journalist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기자\u003c/span>\u003c/div>\u003cdiv>\u003cb>train of thought\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>생각의 맥락\u003c/span>\u003c/div>\u003cdiv>\u003cb>chopping up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>잘게 써는 것, 잘라내는 것\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"가장 중요한 단어는 단락을 뜻하는 패러그래프(paragraph)입니다. 그리고 시각적이라는 의미의 비주얼(visual), 글을 읽고 싶게 만드는 매력적인이라는 뜻의 인바이팅(inviting)도 꼭 기억해야 할 핵심 어휘들입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">visual\u003c/b>\u003cspan class=\"m\">시각적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">optical\u003c/span>\u003cspan class=\"s\">ocular\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inviting\u003c/b>\u003cspan class=\"m\">매력적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">attractive\u003c/span>\u003cspan class=\"s\">appealing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repellent\u003c/span>\u003cspan class=\"a\">unappealing\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">frequent\u003c/b>\u003cspan class=\"m\">빈번한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">constant\u003c/span>\u003cspan class=\"s\">recurrent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rare\u003c/span>\u003cspan class=\"a\">occasional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">damage\u003c/b>\u003cspan class=\"m\">손상시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">harm\u003c/span>\u003cspan class=\"s\">impair\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">improve\u003c/span>\u003cspan class=\"a\">enhance\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">outweigh\u003c/b>\u003cspan class=\"m\">~보다 크다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">surpass\u003c/span>\u003cspan class=\"s\">exceed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">annoying\u003c/b>\u003cspan class=\"m\">짜증스러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">irritating\u003c/span>\u003cspan class=\"s\">bothersome\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">pleasant\u003c/span>\u003cspan class=\"a\">delightful\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"비주얼(visual)은 시각적인이라는 뜻으로 옵티컬(optical)과 비슷하게 쓰입니다. 매력적인이라는 뜻의 인바이팅(inviting)은 매혹적인 어필링(appealing)과 유의어이고, 반대말로는 불쾌한 리펠런트(repellent)가 있어요. 잦은이라는 뜻의 프리퀀트(frequent)는 드문이라는 뜻의 레어(rare)와 대조됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유지하라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Keep \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 단락을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">paragraphs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">짧게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">sh 03cspan class=\"en\">Obviously\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">The New Yorker는 이 두려움에 사로잡혀 있는데 ―\u003c/span>\u003cspan class=\"en\">The New Yorker \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">obsessed \u003c/span>\u003cspan class=\"tgt\">by\u003c/span> this fear ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독자는 수 마일을 갈 수 있다\u003c/span>\u003cspan class=\"en\">a reader can go for miles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쉼 없이.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">relief\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">명백히 The New Yorker는 이 두려움에 사로잡혀 있는데, 독자는 쉼 없이 수 마일을 갈 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단락 나누기를 꺼려하는 잡지 'The New Yorker'를 예로 들어, 단락이 너무 길면 독자가 느끼는 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">피로\u003c/b>가 얼마나 큰지 강조합니다. 여기서 \u003cb class=\"key\">relief\u003c/b>는 긴 글 사이의 여백이 주는 휴식을 비유합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 관용 표현\u003c/span> : be + obsessed + by [with] : \"~에 사로잡혀 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : without + 명사 : \"쉼 없이 (휴식 없이)\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Obviously, 명백히. The New Yorker is obsessed by this fear ―, The New Yorker는 이 두려움에 사로잡혀 있는데 ―. a reader can go for miles, 독자는 수 마일을 갈 수 있다. without relief, 쉼 없이.. 이 문장 전체를 해석하면, 명백히 The New Yorker는 이 두려움에 사로잡혀 있는데, 독자는 쉼 없이 수 마일을 갈 수 있다.","hl":"m"},{"n":28,"text":"The New Yorker라는 실제 잡지사를 예로 들었네요. 이 잡지는 단락을 너무 안 나눠서, 독자들이 읽다가 숨이 턱턱 막힐 정도로 긴 글의 숲을 헤매게 된다는 점을 비꼬아서 표현한 거예요.","hl":"mn"},{"n":29,"text":"is obsessed by는 무언가에 강박적으로 사로잡힌 상태를 말할 때 씁니다. 문장 끝의 without relief는 단락이라는 쉼표가 없어서 독자가 쉴 수 없다는 점을 강조하는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">걱정하지 마라;\u003c/span>\u003cspan class=\"en\">Don't worry;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얻는 이점이 훨씬 능가한다\u003c/span>\u003cspan class=\"en\">the gains \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">far\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">outweigh\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위험성을.\u003c/span>\u003cspan class=\"en\">the hazards.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">걱정하지 마라. 얻는 이점이 위험성을 훨씬 능가한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 잦은 단락 나누기가 글의 논리 전개를 방해할까 봐 불안해할 필요가 없다는 뜻입니다. 짧은 단락이 주는 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">이점\u003c/b>이 그로 인해 발생할 수 있는 \u003cb class=\"key\">내용적 \u003c/b>\u003cb class=\"key\">손실\u003c/b>보다 훨씬 크다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 강조 부사\u003c/span> : far/much/even/still/a lot + [비교를 나타내는 동사/형용사] : \"훨씬\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사\u003c/span> : [A] + outweigh + [B] : \"~보다 더 크다(중요하다)\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Don't worry, 걱정하지 마라;. the gains far outweigh, 얻는 이점이 훨씬 능가한다. the hazards, 위험성을.. 이 문장 전체를 해석하면, 걱정하지 마라. 얻는 이점이 위험성을 훨씬 능가한다.","hl":"m"},{"n":31,"text":"단락을 자꾸 나누면 글이 망가질까 봐 걱정하는 분들이 있죠? 하지만 필자는 단락을 짧게 해서 얻는 시각적 가독성이 혹시 모를 위험보다 훨씬 더 중요하다고 확신을 주고 있습니다.","hl":"mn"},{"n":32,"text":"여기서 far는 뒤에 나오는 동사 outweigh에 담긴 비교의 의미를 훨씬이라는 말로 더 강조해 줘요. 그리고 outweigh라는 동사는 주어가 목적어보다 더 비중이 크고 가치 있다는 뜻으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지 말라.\u003c/span>\u003cspan class=\"en\">don't go\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 지나치지는\u003c/span>\u003cspan class=\"en\">too far.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 너무 지나치지는 말라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 짧은 단락의 장점을 설명하다가 이제는 그 정도가 지나칠 때의 \u003cb class=\"key\">부작용\u003c/b>을 언급하려는 \u003cb class=\"key\">전환점\u003c/b>입니다. 글쓰기에서 무엇이든 \u003cb class=\"key\">적절한 \u003c/b>\u003cb class=\"key\">선\u003c/b>을 지키는 것이 중요하다는 경고입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">연결어 (역접)\u003c/span> : But + [앞 내용과 대조되는 문장] : \"하지만\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"But, 하지만. don't go, 가지 말라.. too far, 너무 지나치지는. 이 문장 전체를 해석하면, 하지만 너무 지나치지는 말라.","hl":"m"},{"n":34,"text":"단락을 짧게 나누는 게 시각적으로 좋긴 하지만, 뭐든지 지나치면 독이 된다는 말이죠? 이 문장은 단락 나누기의 적절한 수위를 지키라는 주의를 환기하는 역할을 합니다.","hl":"mn"},{"n":35,"text":"역접의 연결어 But을 사용해서 문장의 흐름을 뒤집고 있어요. 장점만 나열하다가 이제는 너무 짧게 나눌 때 생기는 문제점을 다룰 준비를 하는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연속은 아주 작은 단락의 만큼이나 짜증스럽다 단락만큼이나 너무 긴.\u003c/span>\u003cspan class=\"en\">A succession of tiny paragraphs is as ④ annoying as a paragraph \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that's \u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">long\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아주 작은 단락의 연속은 너무 긴 단락만큼이나 짜증스럽다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 너무 짧은 단락들이 꼬리에 꼬리를 물고 나오는 것은, 반대로 너무 긴 단락만큼이나 독자의 \u003cb class=\"key\">피로도\u003c/b>를 높입니다. \u003cb class=\"key\">원급 \u003c/b>\u003cb class=\"key\">비교\u003c/b>를 통해 두 가지 극단적인 경우의 폐해가 같음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : paragraph [선행사] + that [주격 관계대명사] + is [동사] : \"너무 긴 단락\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">원급 비교 (as ~ as)\u003c/span> : as + [형용사/부사의 원급] + as : \"~만큼 짜증스러운\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"A succession of, 연속은. tiny paragraphs, 아주 작은 단락의. is as annoying, 만큼이나 짜증스럽다. as a paragraph, 단락만큼이나. that's too long, 너무 긴.. 이 문장 전체를 해석하면, 아주 작은 단락의 연속은 너무 긴 단락만큼이나 짜증스럽다.","hl":"m"},{"n":37,"text":"단락이 너무 길어도 숨이 막히지만, 너무 자잘하게 쪼개진 단락들이 줄줄이 나오는 것도 독자에게는 똑같이 고통스럽다는 걸 비유적으로 표현한 문장입니다.","hl":"mn"},{"n":38,"text":"먼저 as annoying as는 원급 비교 구문입니다. 두 가지 상황이 똑같이 나쁘다는 걸 강조하죠. 그 뒤에 나오는 that's too long은 앞에 있는 단락을 구체적으로 꾸며주는 주격 관계대명사 절입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 ~을 떠올리고 있다\u003c/span>\u003cspan class=\"en\">I'm thinking of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 모든 아주 작은 단락들을\u003c/span>\u003cspan class=\"en\">all those tiny paragraphs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 동사가 없는 경이로운 것들인\u003c/span>\u003cspan class=\"en\">― verbless wonders ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현대의 기자들에 의해 쓰여진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">written \u003c/span>\u003cspan class=\"tgt\">by\u003c/span> modern journalists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기사를 빠르고 쉽게 만들려고 애쓰는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">trying \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> their articles quick 'n' easy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 기사를 빠르‘고’ 쉽게 만들려고 애쓰는 현대의 기자들에 의해 쓰여진 그 모든 아주 작은 단락들, 즉 동사가 없는 경이로운 것들을 떠올리고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단락을 너무 짧게 나누는 기자들의 습관을 비판하는 문장입니다. \u003cb class=\"key\">동사 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 문장처럼 극단적으로 짧은 단락이 가독성을 높이기보다 오히려 글의 완성도를 \u003cb class=\"key\">해칠 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있음\u003c/b>을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구(수식)\u003c/span> : [명사] + [written (과거분사구)] : \"쓰여진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구(수식)\u003c/span> : [명사] + [trying (현재분사구)] : \"애쓰는\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"I'm thinking of, 나는 ~을 떠올리고 있다. all those tiny paragraphs, 그 모든 아주 작은 단락들을. ― verbless wonders ―, 즉 동사가 없는 경이로운 것들인. written by modern journalists, 현대의 기자들에 의해 쓰여진. trying to make their articles quick 'n' easy, 기사를 빠르고 쉽게 만들려고 애쓰는. 이 문장 전체를 해석하면, 나는 기사를 빠르‘고’ 쉽게 만들려고 애쓰는 현대의 기자들에 의해 쓰여진 그 모든 아주 작은 단락들, 즉 동사가 없는 경이로운 것들을 떠올리고 있다.","hl":"m"},{"n":40,"text":"너무 짧은 단락 나누기에 대한 비판적인 시각이 담긴 문장이에요. 기자들이 가독성을 위해 동사조차 없는 극단적으로 짧은 문장들을 쓰는 상황을 묘사하고 있죠.","hl":"mn"},{"n":41,"text":"여기서 명사를 수식하는 두 가지 분사를 확인해야 합니다. 첫 번째로 written은 앞의 paragraphs가 기자들에 의해 쓰여진 것이라 수동의 뜻을 가진 과거분사로 쓰였고요. 두 번째로 trying은 기자들이 직접 노력하고 있는 것이라 능동의 뜻인 현재분사로 쓰여서 현대의 기자들을 꾸며주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실\u003c/span>\u003cspan class=\"en\">Actually\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 독자의 일을 더 어렵게 만든다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">reader's \u003c/span>\u003cspan class=\"tgt\">job \u003c/span>\u003cspan class=\"tgt\">⑤ \u003c/span>\u003cspan class=\"tgt\">easier\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잘라내 버림으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">chopping \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연스러운 생각의 맥락을\u003c/span>\u003cspan class=\"en\">a natural train of thought.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실 그것들은 자연스러운 생각의 맥락을 잘라내 버림으로써 독자의 일을 더 어렵게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 너무 잦은 단락 나누기가 글의 흐름을 끊어 독해를 방해한다는 결론입니다. 문맥상 easier는 \u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이며, 실제로는 글의 맥락이 끊겨 독자의 일이 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">힘들어짐\u003c/b>을 의미합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장(사역/상태 유지)\u003c/span> : make [목적어] + [형용사 (목적격 보어)] : \"독자의 일을 더 쉽게 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사\u003c/span> : by + [chopping up (동명사구)] : \"잘라냄으로써\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Actually, 사실. they make the reader's job 다섯 번째 easier, 그것들은 독자의 일을 더 어렵게 만든다. by chopping up, 잘라내 버림으로써. a natural train of thought, 자연스러운 생각의 맥락을. 이 문장 전체를 해석하면, 사실 그것들은 자연스러운 생각의 맥락을 잘라내 버림으로써 독자의 일을 더 어렵게 만든다.","hl":"m"},{"n":43,"text":"단락을 너무 잘게 나누면 오히려 독서가 힘들어집니다. 생각의 흐름이 툭툭 끊기기 때문이죠. 이 문장의 easier는 사실 문맥상 틀린 단어로 출제된 것인데, 실제 의미는 더 어렵게 만든다는 뜻입니다.","hl":"mn"},{"n":44,"text":"두 가지 포인트를 짚어볼게요. 첫 번째로 5형식 동사 make를 주목하세요. 목적어 뒤에 보어인 easier가 형용사 형태로 잘 왔는지 확인해야 합니다. 두 번째는 수단을 나타내는 표현인 바이 아이앤지 구문인데요. 생각의 흐름을 잘게 조각냄으로써라는 의미로 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>독자의 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">인상\u003c/b>을 긍정적으로 형성하기 위해 단락의 길이를 짧게 유지해야 합니다.\u003c/li>\u003cli>짧은 단락은 글 주변에 여백을 만들어 \u003cb class=\"key\">가독성\u003c/b>을 높이고 독자가 읽기를 시작하도록 유인합니다.\u003c/li>\u003cli>단락을 자주 나누는 것이 논리 전개를 해칠까 걱정될 수 있지만, 실제로는 \u003cb class=\"key\">이점\u003c/b>이 위험을 능가합니다.\u003c/li>\u003cli>다만 생각의 흐름을 방해할 정도의 지나치게 \u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">단락\u003c/b>의 연속은 독자에게 짜증을 줄 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Maintain short paragraphs for visual appeal and readability, but avoid over-fragmentation to preserve the flow of thought.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">글의 시각적인 인상을 결정하는 \u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">단락\u003c/b>의 중요성을 강조하며, 독자의 몰입을 위해 \u003cb class=\"key\">적절한 \u003c/b>\u003cb class=\"key\">길이\u003c/b>의 단락 나누기가 필요함을 설명하는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 배운 내용을 정리하자면, 글을 쓸 때는 독자의 가독성을 위해 단락을 짧게 하되, 전체적인 생각의 흐름이 끊기지 않도록 적절한 길이를 유지해야 한다는 것입니다. 시각적 인상과 논리적 전개 사이의 균형을 찾는 것이 핵심이겠네요. 오늘 수업은 여기까지입니다. 고생 많으셨어요!","hl":null}]}]});</script></body></html>
