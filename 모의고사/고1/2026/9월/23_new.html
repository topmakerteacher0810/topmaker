<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>23번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"23번","audioDir":"23_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">23번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>The Evolutionary Necessity of Cognitive Diversity\u003c/h1>\u003ch2>인지적 다양성의 진화적 필연성\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인간의 다양한 \u003cb class=\"key\">마음 \u003c/b>\u003cb class=\"key\">유형\u003c/b>은 환경 변화 속에서 종의 \u003cb class=\"key\">생존\u003c/b>을 보장하며, 이는 찰스 다윈의 \u003cb class=\"key\">변이\u003c/b> 개념이 인간 정신에도 적용됨을 보여줍니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Variation in human minds is a fundamental prerequisite for the survival and evolvability of our species.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 우리 인류가 왜 한 가지 생각만 하지 않고 서로 다른 다양한 마음을 가지게 되었는지, 그 비밀을 생물학적 관점에서 풀어보는 시간을 가질 거예요. 이 지문은 인간의 마음이 다양한 이유가 단순히 성격 차이가 아니라 종의 생존을 위한 필수 전략이라는 점을 강조하고 있습니다. 핵심은 변이가 생존의 열쇠라는 것이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">찰스 다윈의 \u003cb class=\"key\">자연선택\u003c/b>(Natural Selection) 이론에 따르면, 생물체들 사이의 \u003cb class=\"key\">변이\u003c/b>(variation)가 있어야만 환경에 더 잘 적응한 개체가 살아남아 형질을 전달할 수 있습니다. 이는 단순히 외형적인 몸의 구조에만 국한되는 것이 아니라, \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이나 사고방식에도 동일하게 적용되는 원리입니다. 비유하자면, 다양한 모양의 열쇠가 있어야 갑자기 바뀐 \u003cb class=\"key\">자물쇠\u003c/b>를 열 수 있는 것과 같습니다. 이 지문은 최근 주목받는 \u003cb class=\"key\">신경다양성\u003c/b>(neurodiversity)의 중요성을 진화론적 관점에서 설명하며, 종의 \u003cb class=\"key\">진화 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>(evolvability)을 유지하기 위해 다양한 정신적 특성이 필수적임을 강조합니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 전에 배경지식을 좀 알아볼까요? 찰스 다윈의 자연선택 이론에 따르면, 생명체는 환경에 더 잘 맞는 개체가 살아남습니다. 그런데 여기서 중요한 전제 조건이 바로 변이입니다. 모든 개체가 똑같다면 환경이 변했을 때 다 같이 죽을 수밖에 없거든요. 마치 다양한 사이즈의 옷이 있어야 체격이 다른 사람들이 모두 입을 수 있는 것과 같은 이치입니다. 오늘은 이 원리가 인간의 마음에도 어떻게 적용되는지 살펴볼 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입: 변이와 생존\u003csmall>주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>인간에게 다양한 \u003cb class=\"key\">마음 \u003c/b>\u003cb class=\"key\">유형\u003c/b>이 존재하는 이유는 그것이 종의 \u003cb class=\"key\">생존\u003c/b>에 결정적인 \u003cb class=\"key\">변이\u003c/b>의 형태이기 때문이며, 이는 다윈의 핵심 통찰이기도 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>근거: 환경 변화와 멸종 위험\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>환경이 급변할 때 \u003cb class=\"key\">변이\u003c/b>가 없는 종은 \u003cb class=\"key\">멸종\u003c/b>할 위험이 크지만, 변이가 큰 종은 변화에 \u003cb class=\"key\">적응\u003c/b>한 생존자를 가질 확률이 높습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>확장: 신체에서 마음으로\u003csmall>전환 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>동물의 신체에 적용되는 \u003cb class=\"key\">변이의 \u003c/b>\u003cb class=\"key\">원리\u003c/b>는 인간의 마음에도 똑같이 적용되며, 만약 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">본성\u003c/b>이 하나뿐이라면 재난 상황에서 인류는 사라졌을 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론: 인류의 진화 가능성 보존\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>다행히 인류는 문화 내외적으로 다양한 \u003cb class=\"key\">마음\u003c/b>을 지니고 있으며, 이러한 다양성이 종의 \u003cb class=\"key\">진화 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 보존해 줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"전체적인 글의 흐름을 보면, 변이의 중요성에서 시작해서 환경 변화라는 구체적인 예시를 들고, 이를 인간의 마음으로 확장하며 결론을 맺는 아주 논리적인 구조를 가지고 있습니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째와 두 번째 문장에서는 인간이 다양한 마음 유형을 갖는 것이 생존에 왜 결정적인지 설명합니다. 다윈의 통찰을 빌려 변이가 자연선택의 필수적인 선행 조건임을 명확히 밝히고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 세 번째와 네 번째 문장은 구체적인 근거를 제시합니다. 식량 감소나 기온 상승 같은 재앙이 닥쳤을 때, 변이가 없는 종은 완전히 사라질 수 있지만 변이가 큰 종은 적응한 생존자를 낼 수 있다는 예시를 들어줍니다.","hl":"f1"},{"n":6,"text":"세 번째 단계인 다섯 번째와 여섯 번째 문장에서는 이 원리를 동물에서 인간으로 확장합니다. 신체적 변이와 마찬가지로 인간의 마음에도 동일한 원리가 적용되며, 만약 우리가 똑같은 마음만 가졌다면 재난 상황에서 멸종했을 것이라고 경고하죠.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계인 일곱 번째와 여덟 번째 문장은 결론입니다. 다행히 인류는 문화 내외적으로 다양한 마음을 가졌기에 멸종을 피할 수 있고, 이러한 다양성이 우리 종의 진화 가능성을 보존한다는 점을 강조하며 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과 및 예시\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">1번 문장에서 변이의 \u003cb class=\"key\">중요성\u003c/b>을 주장하고, 3-4번에서 생태학적 예시를 통해 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 설명합니다. 마지막 8번 문장에서 다시 한번 \u003cb class=\"key\">변이\u003c/b>가 인류의 진화 가능성을 보존한다는 주제를 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>because (1)\u003c/b>\u003cspan>이유 설명\u003c/span>\u003cb>Think about it (3)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>the same principle applies to (5)\u003c/b>\u003cspan>원리의 확장\u003c/span>\u003cb>Thankfully (7)\u003c/b>\u003cspan>반전 및 결론 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">variation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">prerequisite for natural selection\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">many kinds of minds\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">evolvability\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Species without much variation\u003c/th>\u003cth>Species with great variation\u003c/th>\u003c/tr>\u003ctr>\u003ctd>completely wiped out by environmental changes\u003c/td>\u003ctd>more likely to have survivors suited for new environment\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음에 핵심 주장을 던지고 마지막에 다시 정리하는 양괄식 구조를 취하고 있습니다. 특히 주장을 뒷받침하기 위해 생태학적 원리를 인간의 심리에 대입하는 유추와 인과 관계를 적절히 섞어서 설명하고 있어요.","hl":"ty"},{"n":9,"text":"문장 곳곳에 단서가 숨어 있어요. 1번의 비코즈는 이유를 설명하고, 3번의 띵크 어바웃 잇은 예시를 통해 생각해보라는 신호죠. 5번의 더 세임 프린시플 어플라이즈 투는 앞서 설명한 생물학적 원리를 인간의 정신 영역으로 넘기겠다는 아주 중요한 전환점 역할을 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>variation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변이, 차이\u003c/span>\u003c/div>\u003cdiv>\u003cb>critical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>결정적인, 중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>survival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생존\u003c/span>\u003c/div>\u003cdiv>\u003cb>species\u003c/b>\u003cem>명사\u003c/em>\u003cspan>종\u003c/span>\u003c/div>\u003cdiv>\u003cb>insight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통찰\u003c/span>\u003c/div>\u003cdiv>\u003cb>prerequisite\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선행 조건\u003c/span>\u003c/div>\u003cdiv>\u003cb>natural selection\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자연선택\u003c/span>\u003c/div>\u003cdiv>\u003cb>catastrophic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>재앙적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>drop\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감소\u003c/span>\u003c/div>\u003cdiv>\u003cb>supply\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공급\u003c/span>\u003c/div>\u003cdiv>\u003cb>wipe out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사라지게 하다, 멸종시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>survivor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생존자\u003c/span>\u003c/div>\u003cdiv>\u003cb>catastrophe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재앙\u003c/span>\u003c/div>\u003cdiv>\u003cb>suited\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>적합한\u003c/span>\u003c/div>\u003cdiv>\u003cb>observe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관찰하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>principle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원리\u003c/span>\u003c/div>\u003cdiv>\u003cb>apply to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>적용되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>human nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인간 본성\u003c/span>\u003c/div>\u003cdiv>\u003cb>disaster\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재난\u003c/span>\u003c/div>\u003cdiv>\u003cb>strike\u003c/b>\u003cem>동사\u003c/em>\u003cspan>닥치다, 발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>extinct\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멸종된\u003c/span>\u003c/div>\u003cdiv>\u003cb>within\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 내에\u003c/span>\u003c/div>\u003cdiv>\u003cb>across\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~ 간에, 전반에 걸쳐\u003c/span>\u003c/div>\u003cdiv>\u003cb>preserve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>evolvability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진화 가능성\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 꼭 기억할 단어는 베리에이션 즉 변이입니다. 그리고 자연선택의 선행 조건인 프리레퀴짓, 완전히 멸종시킨다는 의미의 와이프 아웃, 마지막으로 진화 가능성을 뜻하는 이볼버빌리티는 이 글의 핵심 키워드이니 꼭 챙겨두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">variation\u003c/b>\u003cspan class=\"m\">변이, 다양성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">diversity\u003c/span>\u003cspan class=\"s\">difference\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uniformity\u003c/span>\u003cspan class=\"a\">sameness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">critical\u003c/b>\u003cspan class=\"m\">결정적인, 필수적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">insignificant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">prerequisite\u003c/b>\u003cspan class=\"m\">선행 조건\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">precondition\u003c/span>\u003cspan class=\"s\">requirement\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wipe out\u003c/b>\u003cspan class=\"m\">완전히 없애다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eradicate\u003c/span>\u003cspan class=\"s\">eliminate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">protect\u003c/span>\u003cspan class=\"a\">preserve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">preserve\u003c/b>\u003cspan class=\"m\">보존하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">maintain\u003c/span>\u003cspan class=\"s\">sustain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">damage\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어도 체크해 볼까요? 베리에이션은 다이버시티와 비슷하고, 필수적인 이라는 뜻의 크리티컬은 에센셜이나 크루셜로 바꿔 쓸 수 있습니다. 반대로 베리에이션의 반대말은 획일성을 뜻하는 유니포미티나 세임니스가 되겠네요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">humans \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 유형의 마음을 갖는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have\u003c/span> many kinds of minds,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변이는 결정적이기 때문이다\u003c/span>\u003cspan class=\"en\">because variation is critical\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종의 생존에\u003c/span>\u003cspan class=\"en\">for the survival of a species.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인간이 다양한 유형의 마음을 갖는 것은 중요한데, 변이는 종의 생존에 결정적이기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간의 \u003cb class=\"key\">사고방식\u003c/b>이 다양해야 하는 이유를 생물학적 원리인 \u003cb class=\"key\">종의 \u003c/b>\u003cb class=\"key\">생존\u003c/b>과 \u003cb class=\"key\">변이\u003c/b>의 중요성을 들어 설명하는 도입부입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어-진주어 구문 및 의미상 주어\u003c/span> : It [가주어] + be동사 + 형용사 + for [의미상 주어] + to-v [진주어] : \"인간이 ~하는 것은 중요하다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"It's important, 중요한데. for humans, 인간이. to have many kinds of minds, 다양한 유형의 마음을 갖는 것은. because variation is critical, 변이는 결정적이기 때문이다. for the survival of a species, 종의 생존에. 이 문장 전체를 해석하면, 인간이 다양한 유형의 마음을 갖는 것은 중요한데, 변이는 종의 생존에 결정적이기 때문이다.","hl":"m"},{"n":13,"text":"인간이 서로 다른 생각을 하는 게 왜 중요한지 설명하는 문장이에요. 생태계에서 개체 간의 차이인 변이가 있어야만 종이 살아남을 수 있다는 원리를 인간에게 대입하고 있습니다.","hl":"mn"},{"n":14,"text":"문장의 시작에 가주어 It이 나오고 진짜 주어는 뒤에 있는 to have 이하의 구문입니다. 이때 to부정사 앞에 있는 for humans는 누가 마음을 갖는지를 나타내는 의미상 주어라고 부릅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Charles Darwin의 가장 위대한 통찰 중 하나는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">One \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Charles \u003c/span>\u003cspan class=\"tgt\">Darwin's \u003c/span>\u003cspan class=\"tgt\">greatest \u003c/span>\u003cspan class=\"tgt\">insights\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변이가 ~라는 점이었다\u003c/span>\u003cspan class=\"en\">was that variation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선행 조건이라는\u003c/span>\u003cspan class=\"en\">is a prerequisite\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연선택이 작동하기 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">natural \u003c/span>\u003cspan class=\"tgt\">selection \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Charles Darwin의 가장 위대한 통찰 중 하나는 변이가 자연선택이 작동하기 위한 선행 조건이라는 점이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 생물학의 거장 다윈의 \u003cb class=\"key\">자연선택\u003c/b> 이론을 인용하여, 변화가 일어나기 위해 \u003cb class=\"key\">변이\u003c/b>가 반드시 먼저 존재해야 한다는 \u003cb class=\"key\">필수 \u003c/b>\u003cb class=\"key\">전제\u003c/b>를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">One of + 복수 명사\u003c/span> : One of + [최상급] + 복수 명사 [주어] : \"가장 위대한 통찰 중 하나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어\u003c/span> : for + 명사 + to-v : \"자연선택이 작동하기 위한\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"One of Charles Darwin's greatest insights, Charles Darwin의 가장 위대한 통찰 중 하나는. was that variation, 변이가 ~라는 점이었다. is a prerequisite, 선행 조건이라는. for natural selection to work, 자연선택이 작동하기 위한. 이 문장 전체를 해석하면, Charles Darwin의 가장 위대한 통찰 중 하나는 변이가 자연선택이 작동하기 위한 선행 조건이라는 점이었다.","hl":"m"},{"n":16,"text":"유명한 학자 다윈의 말을 빌려 변이의 가치를 증명하는 대목이에요. 자연이 적자생존의 원리로 생물을 선택하려면, 그전에 선택받을 수 있는 다양한 변이들이 먼저 깔려있어야 한다는 뜻입니다.","hl":"mn"},{"n":17,"text":"One of 뒤에는 항상 복수 명사인 insights를 써야 한다는 점을 주의하세요. 또한 마지막 부분의 for natural selection은 뒤에 나오는 to work라는 동작을 누가 하는지 밝혀주는 의미상 주어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각해 보라.\u003c/span>\u003cspan class=\"en\">Think about it:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약에 환경에 거대한 변화가 있다면,\u003c/span>\u003cspan class=\"en\">If there's a huge change in the environment,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식량 공급에서의 재앙적 감소나\u003c/span>\u003cspan class=\"en\">like a catastrophic drop in the food supply\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기온에서의 큰 상승과 같은\u003c/span>\u003cspan class=\"en\">or a big increase in temperature,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 변이가 없는 종은\u003c/span>\u003cspan class=\"en\">a species without much variation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 사라질 수도 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">completely \u003c/span>\u003cspan class=\"tgt\">wiped \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">생각해 보라. 만약에 식량 공급에서의 재앙적 감소나 기온에서의 큰 상승과 같은 환경에 거대한 변화가 있다면, 많은 변이가 없는 종은 완전히 사라질 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 환경의 급격한 변화라는 \u003cb class=\"key\">재앙적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 가정하여, \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">다양성\u003c/b>이 없는 종은 변화에 적응하지 못하고 결국 \u003cb class=\"key\">멸종\u003c/b>할 수 있음을 경고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 수동태\u003c/span> : 조동사 + be + p.p. [과거분사] : \"완전히 휩쓸려 사라질 수도 있다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Think about it, 생각해 보라.. If there's a huge change in the environment, 만약에 환경에 거대한 변화가 있다면. like a catastrophic drop in the food supply, 식량 공급에서의 재앙적 감소나. or a big increase in temperature, 기온에서의 큰 상승과 같은. a species without much variation, 많은 변이가 없는 종은. might be completely wiped out, 완전히 사라질 수도 있다.. 이 문장 전체를 해석하면, 생각해 보라. 만약에 식량 공급에서의 재앙적 감소나 기온에서의 큰 상승과 같은 환경에 거대한 변화가 있다면, 많은 변이가 없는 종은 완전히 사라질 수도 있다.","hl":"m"},{"n":19,"text":"구체적인 위기 상황을 가정하고 있습니다. 먹이가 줄어들거나 온도가 치솟는 재앙이 닥쳤을 때, 모두가 똑같이 반응하는 종은 살아남을 확률이 없어서 멸종한다는 무서운 경고를 담고 있어요.","hl":"mn"},{"n":20,"text":"문장의 주어인 종이 멸종을 당하는 입장이기 때문에 be wiped out이라는 수동태를 사용했습니다. 여기에 '그럴지도 모른다'는 약한 추측의 의미를 가진 조동사 might를 더해 완성했네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변이가 큰 종은\u003c/span>\u003cspan class=\"en\">A species with great variation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 가질 가능성이 높다\u003c/span>\u003cspan class=\"en\">will \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 생존자들을\u003c/span>\u003cspan class=\"en\">some survivors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 재앙 이후에도\u003c/span>\u003cspan class=\"en\">after any catastrophe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 그 구성원들인데\u003c/span>\u003cspan class=\"en\">― the members\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 환경에 잘 적응한 (구성원들이다).\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">suited \u003c/span>\u003cspan class=\"tgt\">for\u003c/span> the new environment.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">변이가 큰 종은 어떤 재앙 이후에도 몇몇 생존자들 즉 새로운 환경에 잘 적응한 구성원들을 가질 가능성이 더 크다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 다양성이 풍부한 종은 환경이 급변하는 \u003cb class=\"key\">재앙\u003c/b>이 닥쳐도, 그 상황에 \u003cb class=\"key\">적응\u003c/b>한 개체가 살아남을 확률이 높다는 것을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be likely to의 변형/부사적 활용\u003c/span> : will + [more likely (부사구)] + [have (동사원형)] : \"더 가질 가능성이 크다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : the members [선행사] + who [주격 관계대명사] + are [동사] : \"~에 잘 적응한 구성원들\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"A species with great variation, 변이가 큰 종은. will more likely have, 더 가질 가능성이 높다. some survivors, 몇몇 생존자들을. after any catastrophe, 어떤 재앙 이후에도. ― the members, 즉 그 구성원들인데. who are well suited for the new environment, 새로운 환경에 잘 적응한 (구성원들이다).. 이 문장 전체를 해석하면, 변이가 큰 종은 어떤 재앙 이후에도 몇몇 생존자들 즉 새로운 환경에 잘 적응한 구성원들을 가질 가능성이 더 크다.","hl":"m"},{"n":22,"text":"다양한 특성을 가진 종이 왜 유리한지 말해주는 문장이에요. 갑작스러운 재앙이 닥쳐도 그 중 누군가는 새로운 환경에 적응해서 살아남을 가능성이 크기 때문이죠.","hl":"mn"},{"n":23,"text":"첫 번째로 more likely have 부분을 보면, likely가 부사처럼 쓰여 가능성을 강조하고 있어요. 두 번째로 관계대명사 who 뒤에 be suited for라는 수동태가 쓰여서 환경에 적합하게 맞춰졌다는 의미를 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Darwin은 변이를 관찰했으며\u003c/span>\u003cspan class=\"en\">Darwin observed variation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물의 몸에서\u003c/span>\u003cspan class=\"en\">in the bodies of animals,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동일한 원리는\u003c/span>\u003cspan class=\"en\">and the same principle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 마음에도 적용된다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">applies \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> human minds.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Darwin은 동물의 몸에서 변이를 관찰했으며, 동일한 원리는 인간의 마음에도 적용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 생물학적 신체에서 발견되는 \u003cb class=\"key\">자연선택\u003c/b>의 원리가 인간의 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">다양성\u003c/b>에도 똑같이 작용한다는 핵심 논리로 전환되는 구간입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사구\u003c/span> : [주어] + apply to [~에 적용되다] : \"~에 적용된다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Darwin observed variation, Darwin은 변이를 관찰했으며. in the bodies of animals, 동물의 몸에서. and the same principle, 동일한 원리는. applies to human minds, 인간의 마음에도 적용된다.. 이 문장 전체를 해석하면, Darwin은 동물의 몸에서 변이를 관찰했으며, 동일한 원리는 인간의 마음에도 적용된다.","hl":"m"},{"n":25,"text":"다윈이 동물의 몸에서 발견한 생물학적 규칙이 이제 인간의 정신 세계로 확장됩니다. 몸뿐만 아니라 마음의 다양성도 생존에 필수적이라는 뜻이죠.","hl":"mn"},{"n":26,"text":"여기서 핵심은 applies to라는 표현입니다. 어떤 원리나 규칙이 다른 대상에게도 그대로 적용될 때 자주 쓰이는 자동사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 우리가 모두 같은 유형의 마음을 가지고 있고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">had\u003c/span> the same kind of mind\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 인간 본성이 하나뿐이라면\u003c/span>\u003cspan class=\"en\">― \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">were\u003c/span> only one human nature ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때 재난이 닥쳤을 때\u003c/span>\u003cspan class=\"en\">then when disaster struck,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 멸종할지도 모른다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">become\u003c/span> extinct.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 우리가 모두 같은 유형의 마음을 가지고 있고 인간 본성이 하나뿐이라면, 재난이 닥쳤을 때 우리는 멸종할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간의 정신이 다양하지 않고 \u003cb class=\"key\">획일화\u003c/b>되어 있을 때 발생할 수 있는 \u003cb class=\"key\">멸종\u003c/b>의 위험성을 경고하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거\u003c/span> : If + 주어 + [과거동사(had)] : \"만약 우리 모두가 ~를 가지고 있다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가정법 과거 (be동사)\u003c/span> : If + there + [were] : \"만약 ~가 있다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가정법 과거 주절\u003c/span> : 주어 + [조동사의 과거형(might)] + [동사원형(become)] : \"우리는 ~하게 될지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"If we all had the same kind of mind, 만약 우리가 모두 같은 유형의 마음을 가지고 있고. ― if there were only one human nature ―, 즉 인간 본성이 하나뿐이라면. then when disaster struck, 그때 재난이 닥쳤을 때. we might become extinct, 우리는 멸종할지도 모른다.. 이 문장 전체를 해석하면, 만약 우리가 모두 같은 유형의 마음을 가지고 있고 인간 본성이 하나뿐이라면, 재난이 닥쳤을 때 우리는 멸종할지도 모른다.","hl":"m"},{"n":28,"text":"만약 우리 모두가 똑같은 생각만 한다면 어떻게 될까요? 큰 재난이 왔을 때 아무도 대처하지 못해서 인류 전체가 멸종할 수도 있다는 무서운 가정입니다.","hl":"mn"},{"n":29,"text":"이 문장은 전형적인 가정법 과거 문장이에요. 현재 사실과 반대되는 상황을 상상하기 때문에 If절에는 had나 were 같은 과거 동사를 썼고, 주절에는 might become이라는 조동사 과거형을 사용했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다행히도, \u003c/span>\u003cspan class=\"en\">Thankfully,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 종은 다양한 유형의 마음을 지니고 있어서 \u003c/span>\u003cspan class=\"en\">our species has many kinds of minds,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단일 문화 내와 문화 간 둘 다에서 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">within \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">single \u003c/span>\u003cspan class=\"tgt\">culture \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">across \u003c/span>\u003cspan class=\"tgt\">cultures\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 사라질 가능성이 더 낮다.\u003c/span>\u003cspan class=\"en\">so we're \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">wiped \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다행히도 우리 종은 단일 문화 내와 문화 간 둘 다에서 다양한 유형의 마음을 지니고 있어서 우리는 사라질 가능성이 더 낮다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가상의 재난 상황에서 인류를 구원해 주는 \u003cb class=\"key\">다양성\u003c/b>의 실체를 설명합니다. 문화 내·외부에 존재하는 \u003cb class=\"key\">마음의 \u003c/b>\u003cb class=\"key\">변이\u003c/b>가 인류의 생존 확률을 높여준다는 결론을 도출합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">both A and B (상관접속사)\u003c/span> : both [A: 전치사구] and [B: 전치사구] : \"단일 문화 내와 문화 간 둘 다에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be likely to V의 부정적 비교 및 수동태\u003c/span> : be + [less likely (부사구)] + [to be wiped out (to부정사 수동태)] : \"사라질 가능성이 더 낮은\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Thankfully, 다행히도. our species has many kinds of minds, 우리 종은 다양한 유형의 마음을 지니고 있어서. both within a single culture and across cultures, 단일 문화 내와 문화 간 둘 다에서. so we're less likely to be wiped out, 우리는 사라질 가능성이 더 낮다.. 이 문장 전체를 해석하면, 다행히도 우리 종은 단일 문화 내와 문화 간 둘 다에서 다양한 유형의 마음을 지니고 있어서 우리는 사라질 가능성이 더 낮다.","hl":"m"},{"n":31,"text":"이 문장은 인간의 다양성이 구체적으로 어떻게 존재하는지 보여줍니다. 하나의 문화 안에서도 사람마다 생각이 다르고, 서로 다른 문화 사이에서도 차이가 있다는 것이 우리를 재앙으로부터 지켜주는 보호막이 된다는 뜻이죠.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 보스 에이 앤 비 상관접속사입니다. 위드인과 어크로스라는 전치사구를 병렬 구조로 연결해서 다양성의 범위를 확장하고 있어요. 두 번째로 비 라이클리 투 구문 사이에 레스를 넣어 가능성이 낮음을 표현했고, 투 뒤에는 비 와이프트 아웃이라는 수동태를 써서 전멸당하는 상황을 묘사했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 변이는 \u003c/span>\u003cspan class=\"en\">This variation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 종의 진화 가능성을 보존한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">preserves\u003c/span> the evolvability of our species.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 변이는 우리 종의 진화 가능성을 보존한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 최종 결론으로, 변이가 단순히 현재의 생존을 돕는 것을 넘어 종이 계속해서 변화하고 적응할 수 있는 \u003cb class=\"key\">진화적 \u003c/b>\u003cb class=\"key\">잠재력\u003c/b>을 유지시킨다는 점을 명시합니다. \u003cb class=\"key\">변이\u003c/b>가 생물학적 지속성의 핵심임을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 수 일치\u003c/span> : This variation [단수 주어] + preserves [단수 동사] : \"보존한다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"This variation, 이러한 변이는. preserves the evolvability of our species, 우리 종의 진화 가능성을 보존한다.. 이 문장 전체를 해석하면, 이러한 변이는 우리 종의 진화 가능성을 보존한다.","hl":"m"},{"n":34,"text":"마지막 결론입니다. 앞서 말한 다양한 마음의 차이, 즉 변이가 있기 때문에 우리 인류는 환경 변화에 맞춰 계속 진화해 나갈 수 있는 힘을 얻게 된다는 논리입니다.","hl":"mn"},{"n":35,"text":"문장이 짧지만 기본이 중요하죠. 주어인 디스 베리에이션이 3인칭 단수이기 때문에 동사 프리저브 뒤에 반드시 에스를 붙여서 수 일치를 해줘야 합니다. 시험에서 동사 형태를 물을 때 자주 나오는 포인트예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">변이\u003c/b>는 자연선택이 작동하기 위한 필수적인 \u003cb class=\"key\">선행 \u003c/b>\u003cb class=\"key\">조건\u003c/b>이다.\u003c/li>\u003cli>환경의 급격한 변화가 닥쳤을 때, \u003cb class=\"key\">변이\u003c/b>가 없는 종은 \u003cb class=\"key\">멸종\u003c/b>할 위험이 크다.\u003c/li>\u003cli>신체적 변이와 마찬가지로 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">마음\u003c/b>에도 동일한 원리가 적용되어 다양성이 존재한다.\u003c/li>\u003cli>다양한 마음 유형은 종의 \u003cb class=\"key\">진화 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 보존하여 인류의 생존을 돕는다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Variation in human minds is a fundamental prerequisite for the survival and evolvability of our species.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">인간의 다양한 \u003cb class=\"key\">마음 \u003c/b>\u003cb class=\"key\">유형\u003c/b>은 환경 변화 속에서 종의 \u003cb class=\"key\">생존\u003c/b>을 보장하며, 이는 찰스 다윈의 \u003cb class=\"key\">변이\u003c/b> 개념이 인간 정신에도 적용됨을 보여줍니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"자, 오늘 수업 정리해 볼까요? 인류가 다양한 마음을 가진 것은 단순히 우연이 아니라, 멸종을 막고 진화를 계속하기 위한 자연의 위대한 설계라는 점을 이해하셨나요? 변이가 없다면 생존도 없다는 다윈의 가르침을 꼭 기억하세요. 오늘도 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
