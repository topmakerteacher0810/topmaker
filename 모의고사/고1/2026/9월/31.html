마신 우유(milk)에도 사람의 영향이 함께 존재함</li><li>이후 수십 년간 음식과의 관계(relationship with food)에 영향을 줄 수 있음</li><li>핵심 키워드: 사회적 취향(social tastes)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02공동체 속 학습</div><ul><li>우리는 가족, 친구, 학교, 직장 같은 사회적 환경에서 먹는 방식을 배운다.</li><li>가족과 친구(families and friends)에게서 식습관을 배움</li><li>학교와 직장(school and work)에서도 음식 취향이 형성됨</li><li>마을 고유의 사과파이(apple pie) 조리법처럼 집단별 취향이 생김</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03정체성과 음식</div><ul><li>사람들은 음식의 맛 자체뿐 아니라 자신이 속한 집단과 정체성 때문에 특정 음식을 원한다.</li><li>음식은 단순한 물질이 아니라 ‘우리가 누구인가’와 연결됨</li><li>외부인이 싫어해도 공동체 내부에서는 의미가 있음</li><li>핵심 키워드: 정체성(identity)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04취향의 전염</div><ul><li>취향은 음식의 실제 품질과 무관하게 사람에서 사람으로 바이러스처럼 퍼진다.</li><li>취향은 개인 간 전파(person to person)로 확산됨</li><li>음식의 질(qualities of food)보다 사회적 영향이 더 크게 작용할 수 있음</li><li>핵심 키워드: 전염성 확산(viral spread)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05판단과 거리두기</div><ul><li>사람들은 다른 사람의 음식 선택을 관찰하고 판단하며, 특정 집단이 좋아한다는 이유로 음식을 피하기도 한다.</li><li>타인의 식생활(food lives)을 판단적으로 바라봄</li><li>마음에 들지 않는 사람들(wrong people)이 좋아하면 흥미를 잃음</li><li>2024년 유행한 chopped salad를 가까스로 피한 사례 제시</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">taste</td><td class=\"m\">취향, 기호, 맛</td></tr><tr><td class=\"w\">social</td><td class=\"m\">사회적인, 사람들과의 관계에 관한</td></tr><tr><td class=\"w\">presumably</td><td class=\"m\">아마, 추정컨대</td></tr><tr><td class=\"w\">mess up</td><td class=\"m\">망치다, 엉망으로 만들다</td></tr><tr><td class=\"w\">relationship</td><td class=\"m\">관계, 관련성</td></tr><tr><td class=\"w\">develop</td><td class=\"m\">발달하다, 발전시키다, 생기다</td></tr><tr><td class=\"w\">particular</td><td class=\"m\">특정한, 특별한, 까다로운</td></tr><tr><td class=\"w\">who cares?</td><td class=\"m\">누가 신경 써?, 상관없어</td></tr><tr><td class=\"w\">spread</td><td class=\"m\">퍼지다, 퍼뜨리다, 확산되다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">virus</td><td class=\"m\">바이러스, 전염성 있는 것</td></tr><tr><td class=\"w\">irrespective of</td><td class=\"m\">~와 상관없이, ~에 관계없이</td></tr><tr><td class=\"w\">quality</td><td class=\"m\">질, 품질, 특성</td></tr><tr><td class=\"w\">observe</td><td class=\"m\">관찰하다, 알아차리다, 지키다</td></tr><tr><td class=\"w\">judgmentally</td><td class=\"m\">비판적으로, 판단하듯이</td></tr><tr><td class=\"w\">turn off</td><td class=\"m\">흥미를 잃게 하다, 싫증나게 하다, 끄다</td></tr><tr><td class=\"w\">identical</td><td class=\"m\">동일한, 똑같은</td></tr><tr><td class=\"w\">flatter</td><td class=\"m\">돋보이게 하다, 아첨하다</td></tr><tr><td class=\"w\">by the skin of one&#39;s teeth</td><td class=\"m\">간신히, 가까스로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 입맛은 사회적이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">Our tastes are social</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리의 입맛은 사회적이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글 전체의 핵심 주장입니다. 사람들이 어떤 음식을 좋아하게 되는 과정은 혼자만의 감각으로 결정되는 것이 아니라, 주변 사람들과의 관계 속에서 만들어진다는 뜻입니다. 뒤에 나오는 우유, 가족, 마을의 애플파이, 유행 샐러드 이야기는 모두 이 주장을 뒷받침하는 예시로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Our tastes are social (문장구조): Our tastes가 주어(S), are가 연결동사(V), social이 주격보어(C)인 2형식(SVC) 구조이다. 보어 social은 주어의 성질을 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">taste</td><td class=\"m\">취향, 기호, 맛</td></tr><tr><td class=\"w\">social</td><td class=\"m\">사회적인, 사람들과의 관계에 관한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">당신이 처음 우유를 마셨을 때에도</span><span class=\"en\"><b><span class=\"grammar-hl\">Even when you first drank milk</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우유가 있었다</span><span class=\"en\"><b>there was the milk,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그렇다</span><span class=\"en\"><b>yes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그 우유 뒤의 사람도 있었다</span><span class=\"en\"><b>but there was also the person behind the milk</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 사람은 아마도 형성했거나 망쳐 놓았을</span><span class=\"en\"><b><span class=\"grammar-hl\">who will have presumably either made or messed up</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식과 당신의 관계를</span><span class=\"en\"><b><span class=\"grammar-hl\">your relationship with food</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 이후 몇십 년 동안</span><span class=\"en\"><b>for the couple of decades after that.</b></span></div></div><div class=\"lec-sent-ko\">당신이 처음 우유를 마셨을 때에도, 우유가 있었다. 그렇다. 하지만 그 우유 뒤에는 이후 몇십 년 동안 아마 음식과 당신의 관계를 형성했거나 망쳐놓았을 사람도 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 “취향은 사회적이다”라는 주장을 아주 어린 시절의 경험으로 풀어 설명합니다. 아기가 우유를 마실 때 중요한 것은 우유의 맛만이 아니라, 누가 어떻게 먹였는지입니다. 부모나 보호자가 따뜻하고 안정적으로 먹였는지, 강압적이거나 불쾌한 방식으로 먹였는지가 이후 오랫동안 음식에 대한 태도에 영향을 줄 수 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Even when you first drank milk (부사절): Even when + S + V 구조로, when절이 전체 문장의 시간·양보 배경을 나타내는 종속절로 쓰였다.</div><div class=\"lec-gr-item\">who will have presumably either made or messed up your relationship with food (관계대명사): who가 앞의 the person을 선행사로 받아 관계대명사절을 이끈다. 관계절 안에서 who는 주어 역할을 하며, 뒤에 will have made or messed up이라는 서술부가 이어진다.</div><div class=\"lec-gr-item\">will have presumably either made or messed up (과거분사): will have + p.p. 구조의 미래완료이다. made와 messed up은 각각 make, mess up의 과거분사로, 여기서는 수동태가 아니라 완료시제를 만드는 p.p.로 쓰였다.</div><div class=\"lec-gr-item\">messed up your relationship with food (관용표현): mess up + O 구조의 구동사로, mess와 up이 결합해 하나의 동사구처럼 쓰이며 목적어 your relationship with food를 취한다.</div><div class=\"lec-gr-item\">either made or messed up (상관접속): either A or B 구조로 made와 messed up이라는 두 동사구를 병렬로 연결한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">presumably</td><td class=\"m\">아마, 추정컨대</td></tr><tr><td class=\"w\">relationship</td><td class=\"m\">관계, 관련성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 먹는 것을 배운다</span><span class=\"en\"><b><span class=\"grammar-hl\">We learn to eat</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족과 친구들로부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from our families and friends</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학교에서 그리고 직장에서</span><span class=\"en\"><b>at school and in work.</b></span></div></div><div class=\"lec-sent-ko\">우리는 가족과 친구들로부터, 학교에서 그리고 직장에서 먹는 것을 배운다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞의 개인적 어린 시절 경험을 더 넓은 사회적 환경으로 확장합니다. 사람은 집에서 식습관을 배우고, 친구들과 어울리며 좋아하는 음식을 따라 하며, 학교나 직장에서 점심 문화와 간식 문화도 익힙니다. 먹는 행위는 생물학적 필요를 채우는 행동이면서 동시에 사회생활 속에서 배워지는 행동이라는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to eat (to부정사): learn + to V 구조에서 to eat은 동사 learn의 목적어 역할을 하는 명사적 용법의 to부정사이다.</div><div class=\"lec-gr-item\">We learn to eat from our families and friends (문장구조): We가 주어(S), learn이 동사(V), to eat이 목적어 역할을 하는 to부정사구이며, from our families and friends는 출처를 나타내는 전치사구이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 마을은</span><span class=\"en\"><b>A village</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사과파이를 위한 특정 레시피를 개발한다</span><span class=\"en\"><b>develops a particular recipe for an apple pie</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">― 하나인데</span><span class=\"en\"><b>― <span class=\"grammar-hl\">one</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 마을 밖에서는 누구도 좋아하지 않는</span><span class=\"en\"><b><span class=\"grammar-hl\">that nobody outside the village likes</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 누가 신경 쓰겠는가?</span><span class=\"en\"><b>but <span class=\"grammar-hl\">who cares?</span></b></span></div></div><div class=\"lec-sent-ko\">한 마을은 사과파이를 위한 특정 레시피를 개발하는데, 이는 그 마을 밖에서는 누구도 좋아하지 않는 것이지만, 누가 신경 쓰겠는가?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 지역 공동체의 예시를 통해 취향이 집단 안에서 만들어진다는 점을 보여 줍니다. 어떤 마을 사람들에게는 익숙하고 특별한 애플파이 맛이 외부인에게는 이상하게 느껴질 수 있습니다. 그러나 그 마을 사람들에게 중요한 것은 외부의 평가가 아니라, 그 조리법이 자신들의 추억과 소속감을 담고 있다는 점입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">one that nobody outside the village likes (관계대명사): that이 선행사 one을 수식하는 관계대명사절을 이끈다. 관계절 내부에서 nobody outside the village가 주어, likes가 동사이고, likes의 목적어 자리가 비어 있어 that이 그 목적어 역할을 한다.</div><div class=\"lec-gr-item\">who cares? (관용표현): who cares?는 직역형 의문문이라기보다 ‘상관없다/누가 신경 쓰겠어?’라는 식으로 쓰이는 관용적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">develop</td><td class=\"m\">발달하다, 발전시키다, 생기다</td></tr><tr><td class=\"w\">particular</td><td class=\"m\">특정한, 특별한, 까다로운</td></tr><tr><td class=\"w\">who cares?</td><td class=\"m\">누가 신경 써?, 상관없어</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 이런 것들을 원한다</span><span class=\"en\"><b>We want these things</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 무엇인지 때문만이 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">not just because of what they are,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 누구인지 때문에</span><span class=\"en\"><b><span class=\"grammar-hl\">but who we are</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 이런 것들을 그것들이 단지 무엇인지 때문만이 아니라, 우리가 누구인지 때문에 원한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 애플파이 예시를 일반화하는 문장입니다. 사람들이 어떤 음식을 좋아하는 이유에는 맛, 재료, 품질뿐 아니라 자신이 속한 가족, 지역, 계층, 세대, 친구 관계가 들어갑니다. 여기서 “우리가 누구인지”는 음식 취향이 정체성과 연결된다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">not just because of what they are, but who we are (관용표현): not just A but B 구조로, A뿐만 아니라 B도 중요하다는 대등·대조 구조를 만든다. 여기서는 because of what they are와 who we are가 대조적으로 연결된다.</div><div class=\"lec-gr-item\">what they are (간접의문문): what + S + V 어순의 의문사절로, 직접의문문 어순인 what are they가 아니라 what they are가 쓰였다. 전체 절은 because of의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">who we are (간접의문문): who + S + V 어순의 의문사절로, 직접의문문 어순인 who are we가 아니라 who we are가 쓰였다. 앞의 because of가 의미상 반복되어 ‘우리가 누구인가’라는 명사절 역할을 한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">입맛은 퍼진다</span><span class=\"en\"><b>Tastes spread</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이렇게</span><span class=\"en\"><b>like this,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람에서 사람으로</span><span class=\"en\"><b><span class=\"grammar-hl\">person to person</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바이러스처럼</span><span class=\"en\"><b>like viruses,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연관된 음식의 특성과는 거의 무관하게</span><span class=\"en\"><b>almost <span class=\"grammar-hl\">irrespective of the qualities</span> of the food <span class=\"grammar-hl\">involved</span>.</b></span></div></div><div class=\"lec-sent-ko\">입맛은 이렇게 마치 바이러스처럼 사람에서 사람으로 퍼지며, 연관된 음식의 특성과는 거의 무관하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞에서 말한 사회적 취향이 어떻게 퍼지는지를 설명합니다. 어떤 음식이 유행하는 이유는 그 음식이 뛰어나서만이 아니라, 사람들이 서로 따라 하고 추천하고 공유하기 때문입니다. 특히 현대 사회에서는 친구, 직장 동료, SNS, 유튜브, 틱톡 같은 매체를 통해 특정 음식이 빠르게 퍼질 수 있다는 배경을 떠올리면 이해하기 쉽습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">involved (과거분사(형용사)): involved가 food를 뒤에서 수식하는 N + p.p. 구조이다. food involved는 food that is involved처럼 관계절이 축약된 형태로 볼 수 있다.</div><div class=\"lec-gr-item\">irrespective of the qualities (관용표현): irrespective of는 전치사구처럼 쓰여 ‘~와 상관없이’라는 의미를 만들며, 뒤에 명사구 the qualities of the food involved를 목적어로 취한다.</div><div class=\"lec-gr-item\">person to person (관용표현): person to person은 전치사 to를 사이에 두고 같은 명사가 반복된 형태로, 한 사람에서 다른 사람으로 전달되는 방식을 나타내는 부사적 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">taste</td><td class=\"m\">취향, 기호, 맛</td></tr><tr><td class=\"w\">spread</td><td class=\"m\">퍼지다, 퍼뜨리다, 확산되다</td></tr><tr><td class=\"w\">virus</td><td class=\"m\">바이러스, 전염성 있는 것</td></tr><tr><td class=\"w\">irrespective of</td><td class=\"m\">~와 상관없이, ~에 관계없이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 다른 사람들을 관찰한다</span><span class=\"en\"><b><span class=\"grammar-hl\">We observe other people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 식생활에서</span><span class=\"en\"><b>in their food lives,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종종 비판적으로</span><span class=\"en\"><b><span class=\"grammar-hl\">often judgmentally</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는, 종종 비판적으로, 다른 사람들을 그들의 식생활로 관찰한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 취향이 사람 사이로 퍼진다고 했다면, 이 문장은 그 과정에 평가와 판단이 섞인다고 덧붙입니다. 사람들은 누가 무엇을 먹는지, 어떤 식당을 좋아하는지, 어떤 유행을 따라가는지를 보며 그 사람의 이미지까지 판단합니다. 음식 취향은 단순한 선택을 넘어 사회적 신호처럼 작동한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">We observe other people (문장구조): We가 주어(S), observe가 타동사(V), other people이 목적어(O)인 3형식(SVO) 구조이다.</div><div class=\"lec-gr-item\">often judgmentally (부사구): often은 빈도부사, judgmentally는 방식부사로, 둘 다 동사 observe를 수식하여 관찰이 얼마나 자주, 어떤 태도로 이루어지는지를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">observe</td><td class=\"m\">관찰하다, 알아차리다, 지키다</td></tr><tr><td class=\"w\">judgmentally</td><td class=\"m\">비판적으로, 판단하듯이</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">아무것도</span><span class=\"en\"><b>Nothing</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나를 어떤 것에서 질리게 만들지 않는다</span><span class=\"en\"><b><span class=\"grammar-hl\">turns me off something</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어울리지 않는 사람들이 그것을 좋아하는 것보다 더 빨리</span><span class=\"en\"><b>quicker than the wrong people <span class=\"grammar-hl\">liking it</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여기서 내가 의미하는 바는 사람들이다</span><span class=\"en\"><b><span class=\"grammar-hl\">by which I mean people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나와 거의 동일한</span><span class=\"en\"><b><span class=\"grammar-hl\">almost identical to me</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모든 면에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in every respect</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 방식으로</span><span class=\"en\"><b>in a way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나를 돋보이게 하지 않는</span><span class=\"en\"><b><span class=\"grammar-hl\">that doesn't flatter me</span>.</b></span></div></div><div class=\"lec-sent-ko\">어울리지 않는 사람들이 그것을 좋아하는 것만큼 나를 어떤 것에서 더 빨리 질리게 만드는 것은 없는데, 여기서 내가 의미하는 바는 모든 면에서 나와 거의 동일한 사람들인데, 그것이 나를 돋보이게 하지 않는 면에서 그렇다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞 문장의 “판단하듯이 본다”는 내용을 글쓴이 자신의 경험으로 구체화합니다. 글쓴이는 자신과 너무 비슷한 사람들이 어떤 음식을 좋아하는 모습을 볼 때, 그 음식까지 싫어질 수 있다고 말합니다. 이는 취향이 자기 이미지를 드러내는 도구처럼 느껴지기 때문입니다. 자신과 닮았지만 닮고 싶지 않은 사람들이 좋아하는 것을 보면, 그 유행을 따라가는 일이 자신의 모습까지 불편하게 비추는 것처럼 느껴진다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">turns me off something (관용표현): turn someone off something 구조의 구동사로, turns가 동사, me가 목적어, off something이 결합된 표현이다. 전체가 하나의 동사구처럼 쓰인다.</div><div class=\"lec-gr-item\">liking it (현재분사(형용사)): liking it이 people을 뒤에서 수식하는 현재분사구이다. the wrong people liking it은 the wrong people who like it처럼 관계절이 축약된 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">by which I mean people almost identical to me in every respect (관계대명사): 기본틀은 전치사 + 관계대명사 + S + V ... 구조이다. by which 뒤에 I(S) + mean(V)이 이어지며, 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절(완전문장)이 온다. which는 앞의 the wrong people liking it이라는 내용을 받아 설명한다.</div><div class=\"lec-gr-item\">that doesn&#39;t flatter me (관계대명사): that이 선행사 a way를 수식하는 관계대명사절을 이끈다. 절 안에서 that이 주어 역할을 하며 doesn&#39;t flatter me가 서술부로 이어진다.</div><div class=\"lec-gr-item\">identical to me (관용표현): identical to는 형용사 identical이 전치사 to와 함께 쓰이는 고정 결합으로, people을 뒤에서 보충 설명하는 형용사구이다.</div><div class=\"lec-gr-item\">in every respect (관용표현): in every respect는 ‘모든 면에서’라는 뜻의 전치사구로, identical to me를 수식하여 유사성의 범위를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">identical</td><td class=\"m\">동일한, 똑같은</td></tr><tr><td class=\"w\">flatter</td><td class=\"m\">돋보이게 하다, 아첨하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">나는 피했다</span><span class=\"en\"><b><span class=\"grammar-hl\">I avoided</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바이러스처럼 퍼졌던 2024년의 다진 샐러드 순간을</span><span class=\"en\"><b><span class=\"grammar-hl\">the viral chopped salad moment of 2024</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">간신히</span><span class=\"en\"><b><span class=\"grammar-hl\">by the skin of my teeth</span>.</b></span></div></div><div class=\"lec-sent-ko\">나는 바이러스처럼 퍼졌던 2024년의 다진 샐러드 순간을 간신히 피했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장은 앞의 내용을 유머 있게 마무리합니다. 2024년에 온라인에서 크게 퍼진 잘게 썬 샐러드 유행을 글쓴이는 거의 따라갈 뻔했지만 간신히 피해 갔다고 말합니다. 이 문장은 음식 유행이 실제로 바이러스처럼 퍼지고, 사람들은 그 유행에 끌리면서도 동시에 “내가 저걸 따라 해도 괜찮을까?” 하고 자기 이미지를 의식한다는 앞의 논지를 가볍게 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">chopped salad (과거분사(형용사)): chopped가 salad를 앞에서 수식하는 p.p. + N 구조이다. chopped salad는 ‘잘게 썰린 샐러드’처럼 salad의 상태를 설명한다.</div><div class=\"lec-gr-item\">by the skin of my teeth (관용표현): by the skin of my teeth는 ‘간신히/아슬아슬하게’라는 뜻의 고정된 숙어로, 동사 avoided를 수식하는 부사적 표현이다.</div><div class=\"lec-gr-item\">I avoided the viral chopped salad moment of 2024 (문장구조): I가 주어(S), avoided가 타동사(V), the viral chopped salad moment of 2024가 목적어(O)인 3형식(SVO) 구조이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우리의 음식 취향은 개인의 감각만으로 생기는 것이 아니라 주변 사람들과의 관계 속에서 만들어진다.</li><li>가족, 친구, 학교, 직장, 지역 공동체는 우리가 무엇을 좋아하고 어떻게 먹는지를 형성한다.</li><li>어떤 음식은 품질과 상관없이 사람에서 사람으로 퍼지며 유행이 된다.</li><li>우리는 다른 사람의 음식 취향을 보며 그 사람을 판단하고, 그 판단 때문에 어떤 음식을 좋아하거나 피하기도 한다.</li><li>글쓴이는 2024년의 잘게 썬 샐러드 유행을 간신히 피했다는 말로, 취향과 유행의 사회성을 유머러스하게 보여 준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Food tastes develop through social relationships and spread from person to person, shaping preferences more by identity than by food quality.</div>\n              <div class=\"lec-final-sum-ko\">음식 취향은 사회적 관계를 통해 형성되고 사람들 사이에서 퍼지며, 음식의 질보다 정체성에 의해 더 크게 좌우된다.</div></div></div>"],"segs":[[{"audio":"./31_audio/1.mp3","hl":null}],[{"audio":"./31_audio/2.mp3","hl":null}],[{"audio":"./31_audio/3.mp3","hl":null},{"audio":"./31_audio/4.mp3","hl":"stage-0"},{"audio":"./31_audio/5.mp3","hl":"stage-1"},{"audio":"./31_audio/6.mp3","hl":"stage-2"},{"audio":"./31_audio/7.mp3","hl":"stage-3"},{"audio":"./31_audio/8.mp3","hl":"stage-4"}],[{"audio":"./31_audio/9.mp3","hl":null}],[{"audio":"./31_audio/10.mp3","hl":"main"},{"audio":"./31_audio/11.mp3","hl":"meaning"},{"audio":"./31_audio/12.mp3","hl":"grammar"}],[{"audio":"./31_audio/13.mp3","hl":"main"},{"audio":"./31_audio/14.mp3","hl":"meaning"},{"audio":"./31_audio/15.mp3","hl":"grammar"}],[{"audio":"./31_audio/16.mp3","hl":"main"},{"audio":"./31_audio/17.mp3","hl":"meaning"},{"audio":"./31_audio/18.mp3","hl":"grammar"}],[{"audio":"./31_audio/19.mp3","hl":"main"},{"audio":"./31_audio/20.mp3","hl":"meaning"},{"audio":"./31_audio/21.mp3","hl":"grammar"}],[{"audio":"./31_audio/22.mp3","hl":"main"},{"audio":"./31_audio/23.mp3","hl":"meaning"},{"audio":"./31_audio/24.mp3","hl":"grammar"}],[{"audio":"./31_audio/25.mp3","hl":"main"},{"audio":"./31_audio/26.mp3","hl":"meaning"},{
