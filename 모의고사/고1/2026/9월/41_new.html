<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>41~42번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"41~42번","audioDir":"42_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.707em\">41~42번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>How the Internet Revolutionized Slang and Democratized Language\u003c/h1>\u003ch2>인터넷이 슬랭의 역할을 혁신하고 언어를 민주화한 방식\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">인터넷\u003c/b>과 소셜 미디어의 등장으로 과거 \u003cb class=\"key\">표준 \u003c/b>\u003cb class=\"key\">영어\u003c/b> 중심의 언어 장벽이 허물어지고, 콘텐츠 제작자들이 주도하는 슬랭의 \u003cb class=\"key\">민주화\u003c/b>와 빠른 확산이 이루어지고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The internet and social media have shifted the power of language from traditional rule-makers to everyday content creators, allowing slang to spread more freely and rapidly.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 인터넷이 우리가 쓰는 언어, 특히 슬랭에 어떤 엄청난 변화를 가져왔는지 다루는 지문을 함께 공부해 보겠습니다. 이 글은 과거의 엄격했던 언어 규칙이 소셜 미디어 시대에 어떻게 무너지고 민주화되었는지를 잘 설명해 주고 있어요. 요약하자면, 콘텐츠 제작자들이 이제는 새로운 언어의 주도권을 쥐게 되었다는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">전통적으로 언어는 국립국어원이나 사전 편찬자와 같은 \u003cb class=\"key\">언어 \u003c/b>\u003cb class=\"key\">규칙 \u003c/b>\u003cb class=\"key\">제정자\u003c/b>(rule makers)들이 정의한 '올바른 형태'가 지배해 왔습니다. 이는 마치 방송국이나 신문사라는 \u003cb class=\"key\">성벽\u003c/b>(barrier) 안의 사람들만 대중에게 말을 걸 수 있었던 구조와 같습니다. 하지만 소셜 미디어는 이 성벽을 허물고 누구나 참여할 수 있는 평평한 \u003cb class=\"key\">경기장\u003c/b>(playing field)을 만들었습니다. 이제는 유명한 앵커가 아니더라도 일반인 \u003cb class=\"key\">콘텐츠 \u003c/b>\u003cb class=\"key\">제작자\u003c/b>(content creators)가 쓰는 용어가 대중적인 영향력을 얻으며 언어의 \u003cb class=\"key\">합법성\u003c/b>(legitimacy)을 부여받는 시대가 된 것입니다.\u003c/div>","segs":[{"n":2,"text":"여러분이 평소에 쓰는 슬랭들이 어떻게 유행하게 되었는지 생각해 본 적 있나요? 예전에는 국립국어원 같은 언어 규칙 제정자들이 정한 올바른 형태의 표준 영어만 대중 매체에서 사용될 수 있었어요. 마치 높은 성벽이 쳐진 성 안에서만 허가된 말들이 밖으로 나갈 수 있었던 것과 같죠. 하지만 소셜 미디어라는 장벽 파괴자가 등장하면서 이제는 누구나 경기장에 들어와 대등하게 소통할 수 있게 되었답니다. 이제는 방송국이 아니라 콘텐츠 제작자가 언어의 정당성을 부여하는 시대가 온 것이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>전통적 언어 규범의 지배\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>인터넷 이전에는 \u003cb class=\"key\">표준 \u003c/b>\u003cb class=\"key\">영어\u003c/b>를 중시하는 규칙 제정자들이 언어의 경로를 지배했으며, 대중에게 목소리를 내려면 \u003cb class=\"key\">전통 \u003c/b>\u003cb class=\"key\">매체\u003c/b>의 엄격한 기대를 따라야 했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>소셜 미디어에 의한 장벽 붕괴\u003csmall>전환 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>는 이러한 권위적인 장벽을 허물고 누구나 공적인 인물이 될 수 있는 \u003cb class=\"key\">민주화\u003c/b>된 환경을 조성하여 옛 규칙의 힘을 약화시켰습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>콘텐츠 제작자와 슬랭의 확산\u003csmall>근거 및 예시 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>다양한 배경을 가진 \u003cb class=\"key\">콘텐츠 \u003c/b>\u003cb class=\"key\">제작자\u003c/b>들은 슬랭을 일상적으로 사용하며, 이들의 영향력은 슬랭에 \u003cb class=\"key\">정당성\u003c/b>을 부여하고 사회적 장벽을 넘어 퍼지게 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>온라인 네트워크와 밈의 전파\u003csmall>결론 · 문장 11\u003c/small>\u003c/h4>\u003cp>온라인의 강력한 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">네트워크\u003c/b>를 통해 슬랭과 \u003cb class=\"key\">밈\u003c/b>은 과거보다 훨씬 빠른 속도로 전 세계에 전파되고 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 지문이 어떤 논리적 순서로 이 변화를 설명하는지 구체적으로 살펴볼까요?","hl":null},{"n":4,"text":"먼저 1번부터 세 번째 문장까지는 인터넷 이전의 상황을 설명합니다. 당시에는 표준 영어의 규범이 지배적이었고, 대중에게 목소리를 내려면 인쇄물이나 방송 매체가 요구하는 엄격한 기준에 무조건 순응해야만 했죠.","hl":"f0"},{"n":5,"text":"하지만 4번부터 여섯 번째 문장에서 반전이 일어납니다. 소셜 미디어가 그 장벽을 완전히 허물어 버린 것이죠. 이제는 누구나 공적인 인물이 될 수 있고, 옛날의 낡은 규칙을 강요할 사람도 더 이상 남아 있지 않게 되었습니다.","hl":"f1"},{"n":6,"text":"일곱 번째에서 열 번째 문장은 현대의 콘텐츠 제작자들의 역할을 강조합니다. 그들은 전통 매체 종사자들보다 배경이 훨씬 다양하며, 이들이 슬랭을 일상적으로 사용하면서 그 용어들에 정당성을 부여하고 사회적 장벽을 넘도록 돕습니다.","hl":"f2"},{"n":7,"text":"마지막 열한 번째 문장에서는 결론을 맺습니다. 온라인상의 강한 사회적 네트워크 덕분에 이제 슬랭이나 밈은 지리적 한계를 넘어 아주 빠른 속도로 전 세계에 전파된다는 것이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 인터넷으로 인해 \u003cb class=\"key\">슬랭\u003c/b>의 역할이 근본적으로 변했다는 \u003cb class=\"key\">주제\u003c/b>를 명확히 제시합니다. 이후 과거의 \u003cb class=\"key\">폐쇄적 \u003c/b>\u003cb class=\"key\">구조\u003c/b>와 현재의 \u003cb class=\"key\">민주적 \u003c/b>\u003cb class=\"key\">구조\u003c/b>를 비교하며 그 원인과 결과를 상세히 설명하는 구조를 가집니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>because of the internet (1)\u003c/b>\u003cspan>변화의 핵심 원인 제시\u003c/span>\u003cb>Since (2)\u003c/b>\u003cspan>과거 상황의 시작점 설정\u003c/span>\u003cb>completely broke that barrier (4)\u003c/b>\u003cspan>반전을 알리는 핵심 사건\u003c/span>\u003cb>This means that (10)\u003c/b>\u003cspan>앞서 언급한 상황의 결과적 의미 요약\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">slang\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Standard English\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">prescriptive norms\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">correct version\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">strict expectations\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">democratized\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">legitimizes these terms\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">memes\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Traditional Media / Rule Makers\u003c/th>\u003cth>Social Media / Content Creators\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Prescriptive norms and strict expectations\u003c/td>\u003ctd>Democratized access and no old rules\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Limited to print or broadcast\u003c/td>\u003ctd>Open platforms for anyone\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Limited slang growth due to barriers\u003c/td>\u003ctd>Rapid transmission of slang and memes\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 인과 관계의 흐름을 따르고 있습니다. 인터넷이라는 원인이 언어의 민주화와 슬랭의 확산이라는 결과를 가져왔다는 것을 보여주죠. 또한 첫 문장에서 바로 핵심 주제를 던지는 두괄식 구조를 취하고 있어 주제를 파악하기가 아주 쉽습니다.","hl":"ty"},{"n":9,"text":"글의 흐름을 바꾸는 신호어들을 잘 보세요. 네 번째 문장에서 소셜 미디어가 장벽을 완전히 허물었다는 표현이 나오는데, 여기가 바로 과거와 현재를 가르는 중요한 전환점입니다. 또한 열 번째 문장의 디스 민즈 댓은 앞서 설명한 변화가 어떤 실제적인 결과를 낳았는지 정리해 주는 아주 중요한 신호입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>slang\u003c/b>\u003cem>명사\u003c/em>\u003cspan>슬랭, 속어\u003c/span>\u003c/div>\u003cdiv>\u003cb>fundamentally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>근본적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>emergence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>등장\u003c/span>\u003c/div>\u003cdiv>\u003cb>Standard English\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표준 영어\u003c/span>\u003c/div>\u003cdiv>\u003cb>rule maker\u003c/b>\u003cem>명사\u003c/em>\u003cspan>규칙 제정자\u003c/span>\u003c/div>\u003cdiv>\u003cb>be in charge\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>통제하다, 담당하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>prescriptive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>규범적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>norm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>규범, 기준\u003c/span>\u003c/div>\u003cdiv>\u003cb>dominate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지배하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>conform to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 순응하다, 따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>barrier\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장벽\u003c/span>\u003c/div>\u003cdiv>\u003cb>level\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>평평한, 대등한\u003c/span>\u003c/div>\u003cdiv>\u003cb>democratize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>민주화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>public figure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공인, 공적인 인물\u003c/span>\u003c/div>\u003cdiv>\u003cb>enforce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강제하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>content creator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>콘텐츠 제작자\u003c/span>\u003c/div>\u003cdiv>\u003cb>regularly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정기적으로, 일상적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>legitimize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>합법화하다, 정당성을 부여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>platform\u003c/b>\u003cem>명사\u003c/em>\u003cspan>플랫폼, 기반\u003c/span>\u003c/div>\u003cdiv>\u003cb>variety\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다양성\u003c/span>\u003c/div>\u003cdiv>\u003cb>background\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배경\u003c/span>\u003c/div>\u003cdiv>\u003cb>geographically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>지리적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>transmit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전파하다, 전송하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rapid\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>빠른\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 짚어 볼까요? 표준 영어라는 뜻의 스탠더드 잉글리시와 규범적인이라는 뜻의 프리스크립티브는 꼭 기억하세요. 그리고 정당성을 부여하다 혹은 합법화하다라는 의미의 레지티마이즈는 이 지문의 핵심적인 동사입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">fundamentally\u003c/b>\u003cspan class=\"m\">근본적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">essentially\u003c/span>\u003cspan class=\"s\">basically\u003c/span>\u003cspan class=\"s\">radically\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dominate\u003c/b>\u003cspan class=\"m\">지배하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">control\u003c/span>\u003cspan class=\"s\">rule\u003c/span>\u003cspan class=\"s\">govern\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">submit\u003c/span>\u003cspan class=\"a\">follow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">barrier\u003c/b>\u003cspan class=\"m\">장벽\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">obstacle\u003c/span>\u003cspan class=\"s\">hurdle\u003c/span>\u003cspan class=\"s\">obstruction\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">opening\u003c/span>\u003cspan class=\"a\">passage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">legitimize\u003c/b>\u003cspan class=\"m\">합법화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">validate\u003c/span>\u003cspan class=\"s\">justify\u003c/span>\u003cspan class=\"s\">authorize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">invalidate\u003c/span>\u003cspan class=\"a\">outlaw\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rapid\u003c/b>\u003cspan class=\"m\">빠른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fast\u003c/span>\u003cspan class=\"s\">swift\u003c/span>\u003cspan class=\"s\">quick\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slow\u003c/span>\u003cspan class=\"a\">sluggish\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 챙겨 봅시다. 근본적으로라는 의미의 펀더멘털리는 에센셜리나 베이직컬리로 바꿔 쓸 수 있습니다. 지배하다라는 뜻의 도미네이트는 컨트롤과 비슷하지만, 반대로 복종하다는 의미인 서브밋과는 반대 개념이죠. 장벽이라는 바리어는 허들이나 옵스태클과 같은 의미로 이해하면 됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘슬랭’의 역할은\u003c/span>\u003cspan class=\"en\">The role of 'slang'\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대중 문화에서\u003c/span>\u003cspan class=\"en\">in popular culture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근본적으로 변화해 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">fundamentally \u003c/span>\u003cspan class=\"tgt\">changed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인터넷 때문에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> the internet.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대중 문화에서 ‘슬랭’의 역할은 인터넷 때문에 근본적으로 변화해 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인터넷의 등장이 대중문화 속 \u003cb class=\"key\">슬랭\u003c/b>의 지위와 역할을 어떻게 바꾸어 놓았는지 도입하는 문장입니다. 과거와는 다른 새로운 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">환경\u003c/b>이 조성되었음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 시제\u003c/span> : have/has + [과거분사(p.p.)] : \"변화해 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : because of + [명사/명사구] : \"~때문에\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The role of 'slang', ‘슬랭’의 역할은. in popular culture, 대중 문화에서. has fundamentally changed, 근본적으로 변화해 왔다. because of the internet, 인터넷 때문에.. 이 문장 전체를 해석하면, 대중 문화에서 ‘슬랭’의 역할은 인터넷 때문에 근본적으로 변화해 왔다.","hl":"m"},{"n":13,"text":"이 문장은 전체 글의 주제를 던지고 있어요. 인터넷이라는 도구 덕분에 우리가 사용하는 슬랭이 대중문화 안에서 차지하는 위상이 예전과는 완전히 달라졌다는 뜻입니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트로 동사 부분을 보면 해즈 체인지드라는 현재완료 시제가 쓰였죠. 과거부터 지금까지 쭉 변화의 상태가 이어져 왔음을 강조하는 거예요. 두 번째로 비코즈 오브는 뒤에 인터넷이라는 명사구가 나오기 때문에 접속사 비코즈와 헷갈리면 안 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">표준 영어의 등장 이후,\u003c/span>\u003cspan class=\"en\">Since the emergence of Standard English,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언어 규칙 제정자들이\u003c/span>\u003cspan class=\"en\">the rule makers of language\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통제해왔으며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">charge\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 규범적 기준이\u003c/span>\u003cspan class=\"en\">and their prescriptive norms\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영어의 ‘올바른’ 형태에 대한\u003c/span>\u003cspan class=\"en\">about a 'correct' version of the English language\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 의사소통 경로를 지배해 왔다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">dominated\u003c/span> our channels of communication.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">표준 영어의 등장 이후, 언어 규칙 제정자들이 통제해왔으며, 영어의 ‘올바른’ 형태에 대한 그들의 규범적 기준이 우리의 의사소통 경로를 지배해 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">표준 \u003c/b>\u003cb class=\"key\">영어\u003c/b>라는 틀 안에서 소수의 권력자가 언어의 정답을 결정하던 \u003cb class=\"key\">권위주의적\u003c/b> 시대를 설명합니다. 특정 '올바른' 형태만 소통 창구에서 허용되었음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 시제 (상태 유지)\u003c/span> : have + [been (be동사의 p.p.)] : \"통제해왔으며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 시제 (영향력)\u003c/span> : have + [dominated (dominate의 p.p.)] : \"지배해 왔다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Since the emergence of Standard English, 표준 영어의 등장 이후. the rule makers of language, 언어 규칙 제정자들이. have been in charge, 통제해왔으며. and their prescriptive norms, 그들의 규범적 기준이. about a 'correct' version of the English language, 영어의 ‘올바른’ 형태에 대한. have dominated our channels of communication, 우리의 의사소통 경로를 지배해 왔다.. 이 문장 전체를 해석하면, 표준 영어의 등장 이후, 언어 규칙 제정자들이 통제해왔으며, 영어의 ‘올바른’ 형태에 대한 그들의 규범적 기준이 우리의 의사소통 경로를 지배해 왔다.","hl":"m"},{"n":16,"text":"인터넷 이전의 시대를 묘사하고 있어요. 표준 영어가 생긴 뒤로는 소수의 전문가들이 언어의 규칙을 만들었고, 그들이 정한 정답만이 소통 채널에서 인정받았다는 배경 설명입니다.","hl":"mn"},{"n":17,"text":"여기서는 시제가 핵심입니다. 신스라는 표현과 짝을 맞춰서 해브 빈 인 차지와 해브 도미네이티드라는 현재완료가 연달아 쓰였어요. 과거부터 오랜 시간 동안 언어의 주도권을 그들이 쥐고 있었다는 점을 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 당신이 원했다면\u003c/span>\u003cspan class=\"en\">If you wanted\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 목소리가 대중에게 들리기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">voice \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">heard\u003c/span> by the public,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신은 활동해야만 했다\u003c/span>\u003cspan class=\"en\">you had to work\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 제약 안에서\u003c/span>\u003cspan class=\"en\">within their limits,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄격한 기대에 순응하며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">conforming \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> the strict expectations\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인쇄 혹은 방송 매체의.\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">either \u003c/span>\u003cspan class=\"tgt\">print \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">broadcast \u003c/span>\u003cspan class=\"tgt\">media\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 당신이 당신의 목소리가 대중에게 들리기를 원했다면, 당신은 인쇄 혹은 방송 매체의 엄격한 기대에 순응하며, 그들의 제약 안에서 활동해야만 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대중에게 메시지를 전달하려면 기존 매체의 \u003cb class=\"key\">엄격한 \u003c/b>\u003cb class=\"key\">규범\u003c/b>을 따라야만 했던 과거의 제약을 설명합니다. 개인의 자유로운 언어 표현보다 \u003cb class=\"key\">매체의 \u003c/b>\u003cb class=\"key\">기준\u003c/b>이 우선시되었음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문형 (목적격 보어로 수동형 부정사)\u003c/span> : want [동사] + your voice [목적어] + to be heard [목적격 보어] : \"당신의 목소리가 들리게 되는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : [현재분사(v-ing)] + ~ : \"순응하며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">상관접속사\u003c/span> : either A or B : \"인쇄 혹은 방송 매체\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"If you wanted, 만약 당신이 원했다면. your voice to be heard by the public, 당신의 목소리가 대중에게 들리기를. you had to work, 당신은 활동해야만 했다. within their limits, 그들의 제약 안에서. conforming to the strict expectations, 엄격한 기대에 순응하며. of either print or broadcast media, 인쇄 혹은 방송 매체의.. 이 문장 전체를 해석하면, 만약 당신이 당신의 목소리가 대중에게 들리기를 원했다면, 당신은 인쇄 혹은 방송 매체의 엄격한 기대에 순응하며, 그들의 제약 안에서 활동해야만 했다.","hl":"m"},{"n":19,"text":"예전에는 대중에게 내 생각을 알리려면 신문이나 방송 같은 매체의 허락을 받아야 했다는 거예요. 그 매체들이 요구하는 아주 까다로운 기준과 규칙을 무조건 지켜야만 했던 시절을 말합니다.","hl":"mn"},{"n":20,"text":"이 문장은 서술형으로 나오기 정말 좋아요. 먼저 목적어인 목소리가 대중에게 들려지는 수동 관계니까 투 비 허드라는 수동형 부정사를 썼고요. 콤마 뒤에 컨포밍은 뭐뭐하면서라는 뜻의 분사구문입니다. 마지막으로 에이더 에이 오어 비 구조까지 꼼꼼히 챙기세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소셜 미디어가\u003c/span>\u003cspan class=\"en\">Social media\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 허물었다\u003c/span>\u003cspan class=\"en\">completely broke\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 장벽을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">barrier\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소셜 미디어가 그 장벽을 완전히 허물었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전통 매체가 세워둔 엄격한 언어적 규범이라는 \u003cb class=\"key\">장벽 \u003c/b>\u003cb class=\"key\">허물기\u003c/b>를 선언하며, 글의 흐름을 전환하는 핵심 문장입니다. \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>의 등장으로 인해 언어의 주도권이 대중에게 넘어왔음을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시 형용사\u003c/span> : that [지시 형용사] + barrier [명사] : \"그 장벽\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Social media, 소셜 미디어가. completely broke, 완전히 허물었다. that barrier, 그 장벽을.. 이 문장 전체를 해석하면, 소셜 미디어가 그 장벽을 완전히 허물었다.","hl":"m"},{"n":22,"text":"지금까지의 글이 전통 매체의 엄격한 규칙을 설명했다면, 이 문장부터는 소셜 미디어로 인한 변화를 보여줘요. 소셜 미디어가 기성 매체의 장벽을 허물었다는 핵심 전환점이죠.","hl":"mn"},{"n":23,"text":"여기서 that barrier가 가리키는 게 뭔지 찾는 게 중요해요. 바로 앞 문장에 나온 인쇄나 방송 매체의 엄격한 규칙들을 가리키는 지사어입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경기장은\u003c/span>\u003cspan class=\"en\">The playing field\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 평평하며,\u003c/span>\u003cspan class=\"en\">is now level,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대중의 접근은\u003c/span>\u003cspan class=\"en\">and public access\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">민주화되었다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">democratized\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">경기장은 이제 평평하며, 대중의 접근은 민주화되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 스포츠 경기를 비유로 들어, 누구나 \u003cb class=\"key\">동등한 \u003c/b>\u003cb class=\"key\">조건\u003c/b>에서 의사소통할 수 있게 되었음을 설명합니다. 정보와 매체에 대한 접근권이 특정 계층이 아닌 대중에게로 향하는 \u003cb class=\"key\">민주화\u003c/b> 현상을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : is [be동사] + democratized [과거분사] : \"민주화되었다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The playing field, 경기장은. is now level, 이제 평평하며. and public access, 대중의 접근은. is democratized, 민주화되었다.. 이 문장 전체를 해석하면, 경기장은 이제 평평하며, 대중의 접근은 민주화되었다.","hl":"m"},{"n":25,"text":"경기장이 평평하다는 건 어느 한쪽이 유리하지 않은 동등한 조건을 뜻하는 비유예요. 이제 누구나 매체에 접근할 수 있게 된 민주화 상황을 보여줍니다.","hl":"mn"},{"n":26,"text":"마지막의 is democratized는 수동태예요. 대중의 접근이라는 주어가 스스로 하는 게 아니라 환경 변화에 의해 민주화된 상태가 되었다는 의미를 담고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누구나 그리고 모두가\u003c/span>\u003cspan class=\"en\">Anybody and everybody\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공적인 인물이 될 수 있으며\u003c/span>\u003cspan class=\"en\">can become a public figure\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 의사소통 플랫폼에서,\u003c/span>\u003cspan class=\"en\">on the new communicative platforms,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 ~임을 의미한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">meaning \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무도 남겨진 사람이 없음을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">nobody's \u003c/span>\u003cspan class=\"tgt\">left \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옛 규칙을 강제하기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">enforce\u003c/span> the old rules.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">누구나 그리고 모두가 새로운 의사소통 플랫폼에서 공적인 인물이 될 수 있으며, 이는 옛 규칙을 강제하기 위해 남겨진 사람이 아무도 없음을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 누구나 \u003cb class=\"key\">공적 \u003c/b>\u003cb class=\"key\">영향력\u003c/b>을 가질 수 있게 되면서, 과거의 언어 규칙을 감시하고 강요하던 권위자가 사라진 \u003cb class=\"key\">탈권위적\u003c/b> 상황을 묘사합니다. 이로 인해 슬랭이 더 자유롭게 쓰이는 배경이 완성됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문(결과)\u003c/span> : meaning [현재분사] + that [접속사절] : \"~을 의미하며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 + to부정사의 형용사적 용법\u003c/span> : nobody is left [수동태] + to enforce [to부정사] : \"강제할 사람이 아무도 남아있지 않다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Anybody and everybody, 누구나 그리고 모두가. can become a public figure, 공적인 인물이 될 수 있으며. on the new communicative platforms, 새로운 의사소통 플랫폼에서. meaning that, 이는 ~임을 의미한다. nobody's left, 아무도 남겨진 사람이 없음을. to enforce the old rules, 옛 규칙을 강제하기 위해.. 이 문장 전체를 해석하면, 누구나 그리고 모두가 새로운 의사소통 플랫폼에서 공적인 인물이 될 수 있으며, 이는 옛 규칙을 강제하기 위해 남겨진 사람이 아무도 없음을 의미한다.","hl":"m"},{"n":28,"text":"이제 누구나 공적 영향력을 가진 인플루언서가 될 수 있어요. 그러다 보니 옛날 식의 딱딱한 규칙을 굳이 지키라고 강요할 사람이 없는 탈권위적 환경이 된 것이죠.","hl":"mn"},{"n":29,"text":"meaning that은 앞 문장 내용이 어떤 결과를 가져오는지 설명하는 분사구문입니다. 그리고 nobody is left to enforce 부분은 수동태와 to부정사가 만나서 규칙 강제를 할 사람이 없다는 뜻을 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">TV 진행자와 기자들은\u003c/span>\u003cspan class=\"en\">TV presenters and journalists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슬랭을 사용할 수 없었을지도 모르지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> use slang,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">콘텐츠 제작자들은 할 수 있다.\u003c/span>\u003cspan class=\"en\">but content creators \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">TV 진행자와 기자들은 슬랭을 사용할 수 없었을지도 모르지만, 콘텐츠 제작자들은 할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거의 권위 있는 매체와 달리, 현재의 \u003cb class=\"key\">콘텐츠 \u003c/b>\u003cb class=\"key\">제작자\u003c/b>들은 언어 사용의 \u003cb class=\"key\">자율성\u003c/b>을 가지고 있음을 대조하여 보여주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 뒤 완료형(추측)\u003c/span> : might + not + have + p.p. : \"사용할 수 없었을지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대동사\u003c/span> : can + (use slang) : \"할 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"TV presenters and journalists, TV 진행자와 기자들은. might not have been able to use slang, 슬랭을 사용할 수 없었을지도 모르지만. but content creators can, 콘텐츠 제작자들은 할 수 있다.. 이 문장 전체를 해석하면, TV 진행자와 기자들은 슬랭을 사용할 수 없었을지도 모르지만, 콘텐츠 제작자들은 할 수 있다.","hl":"m"},{"n":31,"text":"과거에는 TV 진행자나 기자들이 엄격한 규칙 때문에 슬랭을 쓰지 못했을 거예요. 하지만 지금의 콘텐츠 제작자들은 그런 제약 없이 자유롭게 슬랭을 사용할 수 있다는 점을 대조하고 있습니다.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 조동사 뒤에 완료형이 쓰인 점입니다. 과거 사실에 대한 추측을 나타내죠. 두 번째로 문장 끝의 캔은 앞에 나온 유즈 슬랭을 대신하는 대동사로 쓰여서 의미를 간결하게 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 단어들을 일상적으로 사용하며\u003c/span>\u003cspan class=\"en\">We regularly use words\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘function’과 ‘side-eye’ 같은\u003c/span>\u003cspan class=\"en\">like 'function' and 'side-eye,'\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 영향력은 이러한 용어들을 합법화하고\u003c/span>\u003cspan class=\"en\">and our influence \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">legitimizes \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">terms \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들에게 큰 플랫폼을 제공한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">gives\u003c/span> them a large platform\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 빠르게 퍼질 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">spread\u003c/span> quicker than\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이전보다\u003c/span>\u003cspan class=\"en\">they could have before.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 ‘function’과 ‘side­eye’ 같은 단어를 일상적으로 사용하며, 우리의 영향력은 이러한 용어를 합법화하고 그것들이 이전보다 더 빠르게 퍼질 수 있는 큰 플랫폼을 제공한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 일반 대중의 언어 사용이 슬랭에 \u003cb class=\"key\">정당성\u003c/b>을 부여하고, 과거보다 훨씬 빠른 \u003cb class=\"key\">확산\u003c/b>을 가능하게 한다는 핵심 원리를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사의 병렬 구조\u003c/span> : both A [동사1] and B [동사2] : \"이 용어들을 합법화하기도 하고 제공하기도 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : platform [명사] + to spread [to부정사] : \"퍼질 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"We regularly use words, 우리는 단어들을 일상적으로 사용하며. like 'function' and 'side-eye,', ‘function’과 ‘side-eye’ 같은. and our influence both legitimizes these terms, 우리의 영향력은 이러한 용어들을 합법화하고. and gives them a large platform, 그것들에게 큰 플랫폼을 제공한다. to spread quicker than, 더 빠르게 퍼질 수 있는. they could have before, 이전보다. 이 문장 전체를 해석하면, 우리는 ‘function’과 ‘side­eye’ 같은 단어를 일상적으로 사용하며, 우리의 영향력은 이러한 용어를 합법화하고 그것들이 이전보다 더 빠르게 퍼질 수 있는 큰 플랫폼을 제공한다.","hl":"m"},{"n":34,"text":"우리가 일상에서 슬랭을 자꾸 쓰면 그게 힘을 얻게 돼요. 우리의 영향력이 그런 용어들을 정식 단어처럼 인정받게 만들고, 예전과는 비교도 안 될 정도로 빠르게 퍼지게 도와준다는 뜻입니다.","hl":"mn"},{"n":35,"text":"중요한 문법 요소는 보스 에이 앤드 비 구조입니다. 합법화하다라는 단어와 제공하다라는 단어가 병렬 구조로 연결되어 주어의 영향력을 설명하죠. 또한 투 스프레드는 형용사적 용법으로 쓰여서 플랫폼을 꾸며주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">콘텐츠 제작자들은 또한 출신이다\u003c/span>\u003cspan class=\"en\">Content creators also come from\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 큰 다양한 배경\u003c/span>\u003cspan class=\"en\">a greater variety of backgrounds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일하는 사람들보다\u003c/span>\u003cspan class=\"en\">than \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전통적인 매체에서\u003c/span>\u003cspan class=\"en\">traditional media.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">콘텐츠 제작자들은 또한 전통적인 매체에서 일하는 사람들보다 더 큰 다양한 배경 출신이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 제작자들의 \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">다양성\u003c/b>이 슬랭이 기존의 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">장벽\u003c/b>을 뛰어넘게 만드는 원동력임을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 명사 수식\u003c/span> : people [명사] + working [현재분사구] : \"일하는 사람들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">비교급\u003c/span> : greater [형용사 비교급] + than : \"~보다 더 큰\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Content creators also come from, 콘텐츠 제작자들은 또한 출신이다. a greater variety of backgrounds, 더 큰 다양한 배경. than people working in, 일하는 사람들보다. traditional media, 전통적인 매체에서. 이 문장 전체를 해석하면, 콘텐츠 제작자들은 또한 전통적인 매체에서 일하는 사람들보다 더 큰 다양한 배경 출신이다.","hl":"m"},{"n":37,"text":"지금의 유튜버나 틱톡커들은 예전의 방송국 사람들보다 훨씬 다양한 환경에서 자란 사람들이에요. 이런 다양한 출신 배경 덕분에 슬랭이 더 넓게 퍼질 수 있는 거죠.","hl":"mn"},{"n":38,"text":"여기서 워킹 인은 현재분사로 쓰였습니다. 앞에 있는 명사 피플을 뒤에서 수식하며 일하고 있는 사람들이라는 능동의 의미를 전달하죠. 또한 비교급 형용사를 써서 전통 매체보다 배경이 더 다양하다는 점을 명확히 하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 의미한다\u003c/span>\u003cspan class=\"en\">This means\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슬랭이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">slang \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 자연스럽게 넘어설 수 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">can\u003c/span> more naturally go beyond\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경제적, 사회적 장벽을\u003c/span>\u003cspan class=\"en\">the economic and social barriers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한때 그것의 성장을 제한했던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">once \u003c/span>\u003cspan class=\"tgt\">limited\u003c/span> its growth.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 슬랭이 한때 그것의 성장을 제한했던 경제적, 사회적 장벽을 더 자연스럽게 넘어설 수 있다는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 콘텐츠 제작자들의 배경이 다양해짐에 따라, 슬랭이 과거의 \u003cb class=\"key\">계층적 \u003c/b>\u003cb class=\"key\">장벽\u003c/b>을 뛰어넘어 자유롭게 퍼진다는 뜻입니다. 언어의 성장을 가로막던 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">제약\u003c/b>이 인터넷 덕분에 해소되었음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : means [타동사] + [that (접속사) + 주어 + 동사 (목적어절)] : \"슬랭이 ~할 수 있다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : barriers [선행사] + [that (주어역할) + limited (동사)] : \"한때 제한했던\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"This means, 이것은 의미한다. that slang, 슬랭이. can more naturally go beyond, 더 자연스럽게 넘어설 수 있다는 것을. the economic and social barriers, 경제적, 사회적 장벽을. that once limited its growth, 한때 그것의 성장을 제한했던. 이 문장 전체를 해석하면, 이것은 슬랭이 한때 그것의 성장을 제한했던 경제적, 사회적 장벽을 더 자연스럽게 넘어설 수 있다는 것을 의미한다.","hl":"m"},{"n":40,"text":"전통적인 미디어와 달리 다양한 배경을 가진 제작자들이 활동하면서, 슬랭이 과거의 계층적 장벽을 허물게 되었다는 내용이에요. 언어의 성장을 가로막던 사회적 제약이 이제는 사라졌다는 걸 보여줍니다.","hl":"mn"},{"n":41,"text":"여기서 첫 번째 that은 means의 목적어로 쓰인 명사절 접속사이고요. 두 번째 that은 선행사 barriers를 꾸며주는 주격 관계대명사입니다. 이 두 가지 구조를 잘 파악해야 문장 전체를 정확히 해석할 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">느슨한 사회적 네트워크가\u003c/span>\u003cspan class=\"en\">The loose social networks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이전에는 지리적으로 우리를 연결했던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">previously \u003c/span>\u003cspan class=\"tgt\">connected\u003c/span> us geographically\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온라인상에서는 단순히 더 강하며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are\u003c/span> simply stronger online,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밈은 이제 전파된다\u003c/span>\u003cspan class=\"en\">and memes \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">transmitted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠른 속도로\u003c/span>\u003cspan class=\"en\">at rapid pace.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이전에는 지리적으로 우리를 연결했던 느슨한 사회적 네트워크가 온라인상에서는 단순히 더 강하며, 밈은 이제 빠른 속도로 전파된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지리적 한계에 갇혀 있던 \u003cb class=\"key\">느슨한 \u003c/b>\u003cb class=\"key\">유대\u003c/b> 관계가 온라인에서 강화되면서 정보 전파력이 커졌다는 의미입니다. 이러한 환경이 \u003cb class=\"key\">밈\u003c/b>의 급속한 확산을 가능하게 만드는 토대가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : networks [선행사] + [that (주어역할) + connected (동사)] : \"이전에는 연결했던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수의 일치\u003c/span> : networks [복수 주어] + (관계대명사구) + are [복수 동사] : \"~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be [동사] + transmitted [과거분사] : \"이제 전파된다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"The loose social networks, 느슨한 사회적 네트워크가. that previously connected us geographically, 이전에는 지리적으로 우리를 연결했던. are simply stronger online, 온라인상에서는 단순히 더 강하며. and memes are now transmitted, 밈은 이제 전파된다. at rapid pace, 빠른 속도로. 이 문장 전체를 해석하면, 이전에는 지리적으로 우리를 연결했던 느슨한 사회적 네트워크가 온라인상에서는 단순히 더 강하며, 밈은 이제 빠른 속도로 전파된다.","hl":"m"},{"n":43,"text":"과거에는 지리적 한계 때문에 느슨했던 유대 관계가 온라인에서는 아주 강력해졌다는 뜻이에요. 이런 느슨한 유대를 통해 밈이 전 세계적으로 순식간에 확산될 수 있는 것이죠.","hl":"mn"},{"n":44,"text":"주어인 networks와 동사인 are 사이의 수의 일치가 아주 중요해요. 중간에 관계대명사절이 길게 끼어 있어도 주어가 복수니까 복수 동사를 써야 하죠. 또한 밈이 전파되는 것이므로 수동 형태인 be transmitted를 쓴 점도 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>과거에는 \u003cb class=\"key\">표준 \u003c/b>\u003cb class=\"key\">영어\u003c/b>의 규범을 지키는 규칙 제정자들이 미디어와 의사소통 경로를 지배했다.\u003c/li>\u003cli>\u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>는 기존의 엄격한 언어 장벽을 허물고 누구나 공적인 목소리를 낼 수 있게 했다.\u003c/li>\u003cli>현대의 \u003cb class=\"key\">콘텐츠 \u003c/b>\u003cb class=\"key\">제작자\u003c/b>들은 다양한 배경에서 슬랭을 사용하며 그 용어에 \u003cb class=\"key\">정당성\u003c/b>을 부여한다.\u003c/li>\u003cli>온라인의 강력한 네트워크를 통해 \u003cb class=\"key\">슬랭\u003c/b>과 밈은 지리적 한계를 넘어 과거보다 훨씬 빠르게 전파된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The internet and social media have shifted the power of language from traditional rule-makers to everyday content creators, allowing slang to spread more freely and rapidly.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">인터넷\u003c/b>과 소셜 미디어의 등장으로 과거 \u003cb class=\"key\">표준 \u003c/b>\u003cb class=\"key\">영어\u003c/b> 중심의 언어 장벽이 허물어지고, 콘텐츠 제작자들이 주도하는 슬랭의 \u003cb class=\"key\">민주화\u003c/b>와 빠른 확산이 이루어지고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 배운 내용을 정리해 보자면, 인터넷이 언어의 권위주의를 무너뜨리고 대중적인 슬랭의 전성시대를 열었다는 것입니다. 소셜 미디어와 콘텐츠 제작자들이 언어의 새로운 규칙을 만들고 있다는 점이 흥미롭죠? 오늘 배운 핵심 표현들과 논리 구조를 다시 한번 복습하면서 여러분의 것으로 만드세요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
