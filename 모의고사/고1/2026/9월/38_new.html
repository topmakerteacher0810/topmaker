<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>38번 — 일등급샘 아카이브</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"38번","audioDir":"38_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">38번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">\u003c/div>\u003ch1>The Necessity of Consistent Measurement in Expanding Societies\u003c/h1>\u003ch2>확장되는 사회에서 일관된 측정의 필요성\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>측정 단위가 제 기능을 발휘하려면 \u003cb class=\"key\">일관성\u003c/b>과 \u003cb class=\"key\">공유된 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>이 필수적이며, 사회가 성장하고 교류가 복잡해짐에 따라 주관적 기준에서 객관적이고 신뢰할 만한 정의로의 발전이 요구되었습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Consistency and shared definitions in measurement are essential for bridging differences and facilitating communication as societies grow and engage in complex trade.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 측정 단위가 사회 내에서 어떤 역할을 하며 왜 일관성을 가져야 하는지를 다룬 서른여덟 번째 지문을 함께 분석해 보겠습니다. 이 글은 측정이 단순한 숫자의 나열이 아니라, 소통을 위한 핵심적인 도구임을 강조하죠. 우리는 오늘 측정의 잠재력과 일관성의 관계, 그리고 사회 변화에 따른 측정의 진화를 살펴볼 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">측정(Measurement)은 단순한 숫자를 넘어 서로 다른 환경의 사람들이 소통하기 위한 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">약속\u003c/b>입니다. 마치 우리가 '한 뼘'이라고 말할 때 사람마다 손 크기가 달라 혼란이 생기는 것과 같습니다. 과학사학자 시어도어 포터는 측정을 \u003cb class=\"key\">거리의 \u003c/b>\u003cb class=\"key\">기술(technology \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">distance)\u003c/b>이라 정의하며, 지리적·문화적 차이를 극복하게 해주는 도구로 보았습니다. 초기 사회에서는 마을 내에서만 통하는 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">부위(body \u003c/b>\u003cb class=\"key\">part)\u003c/b> 기준도 충분했지만, 국가 간 무역이 활발해지며 표준화가 절실해졌습니다. 이는 마치 지역마다 다른 \u003cb class=\"key\">사투리\u003c/b>를 쓰던 사람들이 원활한 소통을 위해 표준어를 정립하는 과정과 매우 유사합니다.\u003c/div>","segs":[{"n":2,"text":"강의에 앞서 배경지식을 좀 쌓아볼까요? 측정은 단순한 계산이 아니라 사회적 약속입니다. 옛날에는 자기 팔 길이를 기준으로 물건을 팔기도 했지만, 사람마다 팔 길이가 다르니 당연히 싸움이 났겠죠? 과학사학자 포터는 이를 거리의 기술이라고 불렀는데, 이는 멀리 떨어진 사람들과도 정보를 교환하기 위한 수단이라는 뜻입니다. 마치 우리가 전국 어디서나 소통하기 위해 표준어를 정하는 것과 비슷하다고 생각하면 이해하기 쉬울 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>일관성의 필요성과 주관성의 한계\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>측정 단위가 잠재력을 발휘하려면 \u003cb class=\"key\">일관성\u003c/b>이 필요하며, 개인의 경험에 기반한 \u003cb class=\"key\">주관적 \u003c/b>\u003cb class=\"key\">측정\u003c/b>은 공유하기 어렵다는 한계를 지적합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>측정의 사회적 기능: 거리의 기술\u003csmall>개념 정의 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>측정은 문화와 지리의 차이를 메우는 \u003cb class=\"key\">공유된 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>이자 언어와 같은 소통 도구이므로 신뢰할 만한 \u003cb class=\"key\">정의\u003c/b>가 필수적입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>사회 성장에 따른 체계의 변화와 결론\u003csmall>인과 및 결론 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>초기 정착지 수준의 단순한 정의는 사회가 커지면서 \u003cb class=\"key\">불충분함\u003c/b>이 드러나고, 무역 갈등은 더 높은 \u003cb class=\"key\">일관성\u003c/b>을 요구하게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 측정의 본질적 특성에서 시작해서 사회적 요구에 따른 변화를 시간 순서에 따라 설명하고 있습니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째와 두 번째 문장에서는 측정의 일관성이 왜 필요한지 말해줍니다. 개인의 경험에 의존하는 주관적 측정은 유용할지 몰라도 다른 사람과 공유하기에는 큰 한계가 있다는 점을 짚어주고 있네요.","hl":"f0"},{"n":5,"text":"두 번째 단계인 세 번째에서 다섯 번째 문장은 측정의 정의를 확장합니다. 측정을 문화와 지리의 차이를 메워주는 공유된 규칙으로 보며, 의사소통을 위해 단어처럼 신뢰할 만한 정의가 필요하다고 비유적으로 설명합니다.","hl":"f1"},{"n":6,"text":"마지막으로 여섯 번째에서 여덟 번째 문장에서는 사회가 커지면서 발생하는 변화를 다룹니다. 마을 단위에서는 신체 부위 같은 단순한 기준도 괜찮았지만, 무역이나 조공처럼 복잡한 갈등 상황이 생기면서 결국 더 높은 일관성을 요구하게 된 것이죠.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과 및 사회적 변화\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 측정의 \u003cb class=\"key\">일관성\u003c/b>이라는 핵심 주제를 던진 후, 사회가 소규모에서 대규모로 확장됨에 따라 그 필요성이 어떻게 \u003cb class=\"key\">강화\u003c/b>되는지 설명합니다. 특히 측정 단위를 \u003cb class=\"key\">언어\u003c/b>에 비유하여 신뢰할 수 있는 정의의 중요성을 논리적으로 풀어내고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Following this logic (5)\u003c/b>\u003cspan>앞선 비유를 바탕으로 결론 도출\u003c/span>\u003cb>As these communities grew... though (7)\u003c/b>\u003cspan>상황 변화에 따른 한계 및 대조 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">units of measurement\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">subjective measures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">technology of distance\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">shared rules\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">another sort of language\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reliable definitions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">consistency\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Early/Subjective Measurement\u003c/th>\u003cth>Developed/Consistent Measurement\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Individual's experience\u003c/td>\u003ctd>Shared rules &amp; Shared definitions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Single settlement / Body parts\u003c/td>\u003ctd>Across culture and geography\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Simple &amp; Localized\u003c/td>\u003ctd>Complex trade &amp; Consistency\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 지문은 일관성이라는 주제를 먼저 던지는 두괄식 구성을 취하고 있습니다. 전체적인 전개는 사회가 성장함에 따라 발생하는 필요성을 보여주는 인과 구조를 띠고 있어요. 측정이 사회적 소통의 도구라는 점을 논리적으로 잘 보여주는 글입니다.","hl":"ty"},{"n":8,"text":"다섯 번째 문장의 Following this logic은 앞선 비유를 결론으로 연결하는 중요한 신호입니다. 또한 일곱 번째 문장의 As these communities grew와 though를 통해 사회가 커짐에 따라 이전 체계의 불충분함이 드러나는 전환점을 명확히 보여주고 있죠. 측정 단위를 언어에 비유한 부분도 눈여겨봐야 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>harness\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이용하다, 활용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>potential\u003c/b>\u003cem>명사\u003c/em>\u003cspan>잠재력\u003c/span>\u003c/div>\u003cdiv>\u003cb>unit of measurement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>측정 단위\u003c/span>\u003c/div>\u003cdiv>\u003cb>consistency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일관성\u003c/span>\u003c/div>\u003cdiv>\u003cb>subjective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주관적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>knowledge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지식\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경험\u003c/span>\u003c/div>\u003cdiv>\u003cb>historian\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>describe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묘사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>distance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거리\u003c/span>\u003c/div>\u003cdiv>\u003cb>shared\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공유된\u003c/span>\u003c/div>\u003cdiv>\u003cb>bridge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>메우다, 가로지르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>geography\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지리\u003c/span>\u003c/div>\u003cdiv>\u003cb>exchange\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교환\u003c/span>\u003c/div>\u003cdiv>\u003cb>reliable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신뢰할 만한\u003c/span>\u003c/div>\u003cdiv>\u003cb>definition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정의\u003c/span>\u003c/div>\u span class=\"en\">on an individual's experience.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">주관적인 측정은 유용한 지식을 포함하고 있지만 이것은 개인의 사실상 경험에 기반하기 때문에 공유하기 어려울 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개인의 \u003cb class=\"key\">주관적 \u003c/b>\u003cb class=\"key\">측정\u003c/b>은 가치가 있을지 몰라도, 타인과 공유하기에는 \u003cb class=\"key\">객관성\u003c/b>이 부족하다는 한계를 지적합니다. 이는 곧 \u003cb class=\"key\">공통된 \u003c/b>\u003cb class=\"key\">단위\u003c/b>가 필요한 이유로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시 대명사\u003c/span> : this = [앞 문장의 내용] : \"이것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">as를 활용한 강조 분사구문\u003c/span> : P.P. + as + S + is/does : \"기반하기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"Subjective measures, 주관적인 측정은. contain useful knowledge, 유용한 지식을 포함하고 있지만. but this, 이것은. can be difficult to share, 공유하기 어려울 수 있다. based as it is, 기반하기 때문에. on an individual's experience, 개인의 사실상 경험에. 이 문장 전체를 해석하면, 주관적인 측정은 유용한 지식을 포함하고 있지만 이것은 개인의 사실상 경험에 기반하기 때문에 공유하기 어려울 수 있다.","hl":"m"},{"n":15,"text":"개인마다 느끼는 주관적인 측정값도 나름의 정보는 되겠지만, 그건 그 사람만의 경험일 뿐이라 남들에게 똑같이 전달하기는 힘들다는 뜻이죠.","hl":"mn"},{"n":16,"text":"여기서 this는 앞부분의 유용한 지식을 뜻해요. 특히 based as it is라는 표현은 분사구문의 강조 형태인데, 주관적 측정의 한계가 발생하는 근거를 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학사학자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">historian \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">science\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Theodore M.\u003c/span>\u003cspan class=\"en\">Theodore M.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">과학사학자 Theodore M.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주관적 측정의 한계를 극복할 대안을 제시하기 위해 \u003cb class=\"key\">전문가\u003c/b>인 시어도어 포터를 소개하며 \u003cb class=\"key\">논거\u003c/b>를 강화하기 시작합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사구 (주어 부분)\u003c/span> : The + [명사] + of + [명사] : \"과학사학자\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"The historian of science, 과학사학자. Theodore M, Theodore M.. 이 문장 전체를 해석하면, 과학사학자 Theodore M.","hl":"m"},{"n":18,"text":"이제 측정의 중요성을 뒷받침해 줄 전문가인 시어도어 포터라는 학자를 소개하려는 문장의 시작입니다.","hl":"mn"},{"n":19,"text":"이 부분은 문장의 주어 역할을 하는 명사구입니다. 과학의 역사를 연구하는 사학자라는 직함이 먼저 나오고 뒤에 인물 이름이 이어지고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Porter는 측정을 묘사한다\u003c/span>\u003cspan class=\"en\">Porter \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">describes \u003c/span>\u003cspan class=\"tgt\">measurement \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘거리의 기술’이라고:\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as\u003c/span> a 'technology of distance':\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공유된 규칙을 사용하는 도구인\u003c/span>\u003cspan class=\"en\">a tool \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">uses\u003c/span> shared rules\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문화와 지리의 차이를 메우기 위해,\u003c/span>\u003cspan class=\"en\">to bridge differences of culture and geography,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정보의 교환을 가능하게 하는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">allowing \u003c/span>\u003cspan class=\"tgt\">for\u003c/span> the exchange of information.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">과학사학자 Theodore M. Porter는 측정을 ‘거리의 기술’이라고 묘사한다. 즉, 문화와 지리의 차이를 메우기 위해 공유된 규칙을 사용하여 정보의 교환을 가능하게 하는 도구이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 측정이 단순히 숫자를 세는 것을 넘어, 서로 떨어진 사람들 사이의 벽을 허무는 \u003cb class=\"key\">거리의 \u003c/b>\u003cb class=\"key\">기술\u003c/b>임을 설명합니다. 멀리 떨어진 사람들도 측정이라는 \u003cb class=\"key\">공유된 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>을 통해 원활하게 정보를 주고받을 수 있게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">describe A as B\u003c/span> : describe [목적어] + as [목적격 보어(명사/형용사)] : \"측정을 ~라고 묘사한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a tool [선행사] + that [주격 관계대명사] + uses [동사] : \"사용하는 도구\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사 (분사구문)\u003c/span> : [절] + , [v-ing(분사구문)] : \"가능하게 하는 / 가능하게 하면서\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Porter describes measurement, Porter는 측정을 묘사한다. as a 'technology of distance', ‘거리의 기술’이라고:. a tool that uses shared rules, 공유된 규칙을 사용하는 도구인. to bridge differences of culture and geography, 문화와 지리의 차이를 메우기 위해. allowing for the exchange of information, 정보의 교환을 가능하게 하는.. 이 문장 전체를 해석하면, 과학사학자 Theodore M. Porter는 측정을 ‘거리의 기술’이라고 묘사한다. 즉, 문화와 지리의 차이를 메우기 위해 공유된 규칙을 사용하여 정보의 교환을 가능하게 하는 도구이다.","hl":"m"},{"n":21,"text":"과학사학자 포터는 측정을 거리의 기술이라고 불렀어요. 문화나 지역이 달라도 측정이라는 공유된 규칙만 있다면 서로 정보를 교환할 수 있는 도구가 된다는 뜻이죠.","hl":"mn"},{"n":22,"text":"첫 번째로 describe A as B 구문이 쓰여서 측정을 거리의 기술로 정의하고 있습니다. 두 번째로 관계대명사 that이 tool을 꾸며주며 어떤 도구인지 설명하고요. 마지막으로 콤마 뒤에 나온 현재분사 allowing for는 그 결과 정보 교환이 가능해졌음을 나타내는 분사구문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 논리에 따라서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Following \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">logic\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 측정이 또 다른 종류의 언어라면,\u003c/span>\u003cspan class=\"en\">if measurement is another sort of language,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단어와 마찬가지로,\u003c/span>\u003cspan class=\"en\">then just as with words,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개별 단위는 신뢰할 만한 정의가 필요하다\u003c/span>\u003cspan class=\"en\">individual units need reliable definitions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사소통을 하기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">communicate\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 논리에 따라서, 측정이 또 다른 종류의 언어라면, 단어와 마찬가지로, 개별 단위는 의사소통을 하기 위해 신뢰할 만한 정의가 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 측정을 \u003cb class=\"key\">언어\u003c/b>에 비유하여 그 성격을 명확히 합니다. 단어의 뜻이 통해야 대화가 되듯, 측정 단위도 모두가 믿을 수 있는 \u003cb class=\"key\">신뢰할 \u003c/b>\u003cb class=\"key\">만한 \u003c/b>\u003cb class=\"key\">정의\u003c/b>가 있어야만 소통의 도구로 작동할 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사구 (관용적 표현)\u003c/span> : Following [현재분사] + [목적어] : \"이러한 논리에 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : in order to + [동사원형] : \"의사소통을 하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Following this logic, 이러한 논리에 따라서. if measurement is another sort of language, 만약 측정이 또 다른 종류의 언어라면. then just as with words, 단어와 마찬가지로. individual units need reliable definitions, 개별 단위는 신뢰할 만한 정의가 필요하다. in order to communicate, 의사소통을 하기 위해.. 이 문장 전체를 해석하면, 이러한 논리에 따라서, 측정이 또 다른 종류의 언어라면, 단어와 마찬가지로, 개별 단위는 의사소통을 하기 위해 신뢰할 만한 정의가 필요하다.","hl":"m"},{"n":24,"text":"앞선 논리를 따라가 보면 측정은 일종의 언어와 같아요. 우리가 단어의 뜻을 공유해야 말이 통하듯이, 측정 단위도 신뢰할 만한 정의가 있어야 소통이 가능해집니다.","hl":"mn"},{"n":25,"text":"문장 맨 앞의 Following은 분사구문으로 앞 내용과의 논리적 흐름을 이어줍니다. 문장 끝의 in order to communicate는 목적을 나타내는데, 소통을 하기 위해 정의가 필요하다는 점을 강조하고 있네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 초기의 사회에서,\u003c/span>\u003cspan class=\"en\">In the earliest societies,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 정의는 공유될 필요가 있었을 것이다\u003c/span>\u003cspan class=\"en\">these definitions might need \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">shared\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 정착지 정도의 범위로만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">widely \u003c/span>\u003cspan class=\"tgt\">than\u003c/span> a single settlement,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 그 정의가 더 복잡할 필요가 없음을 의미한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">meaning \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> the definition can be no more complex\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 단위는 특정 신체 부위와 대등하다는 것을 아는 정도보다.\u003c/span>\u003cspan class=\"en\">than knowing that a unit was equal to a certain body part.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가장 초기의 사회에서, 이러한 정의는 하나의 정착지 정도의 범위로만 공유될 필요가 있었을 것이고, 이는 그 정의가 한 단위는 특정 신체 분위와 대등하다는 것을 아는 정도로만 복잡하면 된다는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거에는 소규모 공동체 안에서만 소통하면 되었기에, 측정이 \u003cb class=\"key\">단순\u003c/b>해도 문제가 없었습니다. 신체 부위 같은 \u003cb class=\"key\">직관적인 \u003c/b>\u003cb class=\"key\">기준\u003c/b>만으로도 충분했던 초기 사회의 상황을 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 수동태\u003c/span> : need [동사] + to be [p.p.] : \"공유될 (필요가 있다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정 비교 (only의 의미)\u003c/span> : no more [부사/형용사] than : \"~정도의 범위로만 / ~에 불과한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사(분사구문) + 명사절\u003c/span> : , [meaning (분사)] + that [접속사] + [절] : \"~라는 것을 의미하면서\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"In the earliest societies, 가장 초기의 사회에서. these definitions might need to be shared, 이러한 정의는 공유될 필요가 있었을 것이다. no more widely than a single settlement, 하나의 정착지 정도의 범위로만. meaning that the definition can be no more complex, 이는 그 정의가 더 복잡할 필요가 없음을 의미한다. than knowing that a unit was equal to a certain body part, 한 단위는 특정 신체 부위와 대등하다는 것을 아는 정도보다.. 이 문장 전체를 해석하면, 가장 초기의 사회에서, 이러한 정의는 하나의 정착지 정도의 범위로만 공유될 필요가 있었을 것이고, 이는 그 정의가 한 단위는 특정 신체 분위와 대등하다는 것을 아는 정도로만 복잡하면 된다는 것을 의미한다.","hl":"m"},{"n":27,"text":"초기 사회는 규모가 아주 작았어요. 그래서 측정 단위의 정의가 한 마을 안에서만 통하면 됐고, 신체 부위 같은 아주 단순한 기준만 있어도 충분했답니다.","hl":"mn"},{"n":28,"text":"먼저 definitions가 공유되는 것이므로 to be shared라는 수동태를 썼습니다. 그리고 no more widely than은 단지 그 정도로만 좁게라는 의미로 쓰여서 공유 범위를 한정하고 있죠. 마지막으로 콤마 뒤의 meaning that은 앞의 상황이 어떤 결과를 낳는지 보충 설명하는 분사구문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 공동체들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As\u003c/span> these communities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">규모가 커지면서,\u003c/span>\u003cspan class=\"en\">grew in size,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">though,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 체계의 불충분함이\u003c/span>\u003cspan class=\"en\">the inadequacies of this system\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분명해졌다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">become\u003c/span> evident.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 이러한 공동체들이 규모가 커지면서, 이 체계의 불충분함이 분명해졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공동체가 커짐에 따라 신체 부위를 기준으로 하던 이전의 주관적 측정 방식이 더 이상 통하지 않는 \u003cb class=\"key\">한계점\u003c/b>에 도달했음을 나타냅니다. 즉, 사회가 발전하며 더 정밀하고 공통된 \u003cb class=\"key\">표준화\u003c/b>가 필요해지는 시점을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as(~함에 따라)\u003c/span> : As [접속사] + communities [주어] + grew [동사] : \"~함에 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 would(과거의 추측/경향)\u003c/span> : would [조동사] + become [연결동사] + evident [형용사/보어] : \"분명해졌을 것이다\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"As these communities, 이러한 공동체들이. grew in size, 규모가 커지면서. though, 하지만. the inadequacies of this system, 이 체계의 불충분함이. would become evident, 분명해졌다.. 이 문장 전체를 해석하면, 하지만 이러한 공동체들이 규모가 커지면서, 이 체계의 불충분함이 분명해졌다.","hl":"m"},{"n":30,"text":"공동체의 규모가 커지면 사람마다 다른 신체 길이를 기준으로 하는 방식은 당연히 문제가 생기겠죠. 이 문장은 측정 체계의 변화가 필요해진 결정적인 한계점을 짚어주는 단계입니다.","hl":"mn"},{"n":31,"text":"첫 번째로 접속사 As는 규모가 커짐에 따라라는 변화의 과정을 나타내는 부사절 접속사로 쓰였습니다. 두 번째로 would become은 당시 상황에서 당연히 그렇게 되었을 것이라는 필연적인 결과나 추측을 부드럽게 표현하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불일치를 상상해 보아라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Imagine\u003c/span> a disagreement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무역이나 조공에 관한:\u003c/span>\u003cspan class=\"en\">over trade or tribute:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 갈등의 순간이다\u003c/span>\u003cspan class=\"en\">it is a moment of conflict\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요구하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">demands\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">측정에 있어 더 큰 일관성을.\u003c/span>\u003cspan class=\"en\">greater consistency in measurement.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무역이나 조공에 관한 불일치를 상상해 보아라. 그것은 측정에 있어 더 큰 일관성을 요구하는 갈등의 순간이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 무역이나 조공처럼 이해관계가 얽힌 상황에서는 정확한 기준이 없으면 \u003cb class=\"key\">분쟁\u003c/b>이 발생하게 됨을 보여줍니다. 이러한 \u003cb class=\"key\">갈등 \u003c/b>\u003cb class=\"key\">해결\u003c/b>을 위해 더 높은 수준의 객관적인 기준이 반드시 필요함을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : Imagine [동사원형] + a disagreement [목적어] : \"상상해 보아라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a moment of conflict [선행사] + that [관계대명사] + demands [동사] : \"요구하는 갈등의 순간\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Imagine a disagreement, 불일치를 상상해 보아라. over trade or tribute, 무역이나 조공에 관한:. it is a moment of conflict, 그것은 갈등의 순간이다. that demands, 요구하는. greater consistency in measurement, 측정에 있어 더 큰 일관성을.. 이 문장 전체를 해석하면, 무역이나 조공에 관한 불일치를 상상해 보아라. 그것은 측정에 있어 더 큰 일관성을 요구하는 갈등의 순간이다.","hl":"m"},{"n":33,"text":"서로 이익을 다투는 무역 상황을 생각해보면 왜 측정의 일관성이 중요한지 바로 알 수 있죠. 갈등이 생겨야만 비로소 강력하고 통일된 규칙이 필요해진다는 논리입니다.","hl":"mn"},{"n":34,"text":"첫 문장은 동사원형으로 시작하는 명령문으로 예시를 제시하고 있습니다. 두 번째 문장의 that demands는 주격 관계대명사절로, 앞에 나온 갈등이 일관성을 강력하게 요구하고 있다는 점을 수식해주고 있네요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>측정 단위의 잠재력을 이용하기 위해 어느 정도의 \u003cb class=\"key\">일관성\u003c/b>이 필수적입니다.\u003c/li>\u003cli>측정은 문화적·지리적 차이를 넘어서는 \u003cb class=\"key\">공유된 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>이자 소통 도구입니다.\u003c/li>\u003cli>초기 사회의 단순한 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">부위\u003c/b> 기준은 사회 성장에 따라 한계를 보였습니다.\u003c/li>\u003cli>무역과 같은 갈등 상황은 측정의 더 높은 \u003cb class=\"key\">일관성\u003c/b>을 요구하게 되었습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Consistency and shared definitions in measurement are essential for bridging differences and facilitating communication as societies grow and engage in complex trade.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">측정 단위가 제 기능을 발휘하려면 \u003cb class=\"key\">일관성\u003c/b>과 \u003cb class=\"key\">공유된 \u003c/b>\u003cb class=\"key\">규칙\u003c/b>이 필수적이며, 사회가 성장하고 교류가 복잡해짐에 따라 주관적 기준에서 객관적이고 신뢰할 만한 정의로의 발전이 요구되었습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":35,"text":"정리하자면, 측정은 단순한 도구가 아니라 사회를 연결하는 언어이며, 사회가 복잡해질수록 일관성은 더욱 중요해졌다는 내용이었습니다. 오늘 배운 일관성, 공유된 규칙, 거리의 기술이라는 키워드들을 잘 정리해 두세요. 오늘 강의는 여기서 마치겠습니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
