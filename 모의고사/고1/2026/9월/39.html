 data-hl=\"stage-1\"><div class=\"lec-stage-head\">02잎 수집 과정</div><ul><li>일부 개미들은 둥지 밖으로 나가 신선한 식물(vegetation)을 찾아 큰 잎 조각을 가져온다.</li><li>둥지(nest)에서 출발해 식물 탐색</li><li>신선한 잎을 발견하면 큰 조각으로 잘라 운반</li><li>핵심 키워드: 식물 수집(vegetation gathering)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03잎의 실제 용도</div><ul><li>개미들은 잎을 직접 먹지 않고, 작은 일개미(worker ants)가 잎을 잘게 씹어 균류 재배에 사용한다.</li><li>잎(leaves)은 먹이가 아니라 비료(fertilizer)로 사용</li><li>작은 일개미들이 잎을 더 작은 조각으로 만듦</li><li>핵심 키워드: 비료(fertilizer)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04균류 재배와 섭취</div><ul><li>개미들은 지하 정원(underground gardens)에서 균류(fungus)를 기르고, 자란 균류의 열매체를 먹는다.</li><li>잎 조각으로 균류(fungus)를 성장시킴</li><li>균류가 작은 열매체(fruiting bodies)를 형성</li><li>개미들은 나중에 이 열매체를 먹음</li><li>핵심 키워드: 균류 농장(fungus garden)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05농업 문명의 완성</div><ul><li>성공적인 농업 전략(farming strategy)을 통해 잎꾼개미는 거대한 지하 둥지와 농업 문명을 이룬다.</li><li>지하에 수백 제곱미터 규모의 둥지(nest)를 건설</li><li>인간처럼 농업 문명(agricultural civilization)을 발전시킴</li><li>핵심 키워드: 농업 문명(agricultural civilization)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">colony</td><td class=\"m\">군체, 집단, 식민지</td></tr><tr><td class=\"w\">leaf-cutter ant</td><td class=\"m\">잎꾼개미, 잎을 잘라 나르는 개미</td></tr><tr><td class=\"w\">cultivate</td><td class=\"m\">경작하다, 재배하다, 기르다</td></tr><tr><td class=\"w\">set forth</td><td class=\"m\">출발하다, 떠나다, 제시하다</td></tr><tr><td class=\"w\">vegetation</td><td class=\"m\">초목, 식물, 식물군</td></tr><tr><td class=\"w\">chew off</td><td class=\"m\">씹어 떼어내다, 물어뜯다</td></tr><tr><td class=\"w\">fertilizer</td><td class=\"m\">비료, 거름</td></tr><tr><td class=\"w\">fungus</td><td class=\"m\">균류, 곰팡이, 버섯류</td></tr><tr><td class=\"w\">underground</td><td class=\"m\">지하의, 땅속의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">blossom into</td><td class=\"m\">~으로 피어나다, ~으로 발전하다</td></tr><tr><td class=\"w\">fruiting body</td><td class=\"m\">자실체, 포자를 만드는 균류의 구조</td></tr><tr><td class=\"w\">strategy</td><td class=\"m\">전략, 계획, 방책</td></tr><tr><td class=\"w\">enormous</td><td class=\"m\">거대한, 막대한</td></tr><tr><td class=\"w\">span</td><td class=\"m\">걸치다, 걸쳐 이어지다, 포괄하다</td></tr><tr><td class=\"w\">perfect</td><td class=\"m\">완성하다, 완벽하게 하다, 숙달하다</td></tr><tr><td class=\"w\">agricultural</td><td class=\"m\">농업의, 농사의</td></tr><tr><td class=\"w\">civilization</td><td class=\"m\">문명, 문명사회</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한 군락에 수백만 마리의 구성원이 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">With millions of members in a colony</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">절엽 개미는</span><span class=\"en\"><b><span class=\"grammar-hl\">leaf-cutter ants</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들만의 먹이를 경작한다.</span><span class=\"en\"><b><span class=\"grammar-hl\">cultivate their own food</span>.</b></span></div></div><div class=\"lec-sent-ko\">한 군락에 수백만 마리의 구성원이 있는 절엽 개미는 그들만의 먹이를 경작한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 첫 문장은 글의 핵심 주제를 제시합니다. 잎꾼개미가 단순히 먹이를 찾아다니는 곤충이 아니라, 거대한 집단을 이루어 먹이를 직접 길러 먹는 존재라는 점을 강조합니다. 뒤 문장들은 이 개미들이 어떤 방식으로 ‘농사’를 짓는지 단계적으로 설명하게 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">With millions of members in a colony (전치사구): With + 명사구 + 전치사구 구조로, 문장 앞에서 전체 절의 배경 조건을 나타내는 부사어 역할을 한다.</div><div class=\"lec-gr-item\">leaf-cutter ants cultivate their own food 기본 3형식: 주어(leaf-cutter ants) + 동사(cultivate) + 목적어(their own food) 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">colony</td><td class=\"m\">군체, 집단, 식민지</td></tr><tr><td class=\"w\">leaf-cutter ant</td><td class=\"m\">잎꾼개미, 잎을 잘라 나르는 개미</td></tr><tr><td class=\"w\">cultivate</td><td class=\"m\">경작하다, 재배하다, 기르다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인간과 마찬가지로</span><span class=\"en\"><b><span class=\"grammar-hl\">Just like humans</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 농부이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">they're farmers</span>.</b></span></div></div><div class=\"lec-sent-ko\">인간과 마찬가지로, 그들은 농부이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 내용을 인간의 농업과 연결해 이해시키는 문장입니다. 글쓴이는 잎꾼개미의 행동을 인간의 농사와 나란히 놓으면서, 개미 사회가 매우 조직적이고 계획적으로 먹이를 생산한다는 인상을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Just like humans (관용표현): just like + 명사 구조로, 뒤의 명사(humans)와 주어(they)를 비교하는 부사구 역할을 한다.</div><div class=\"lec-gr-item\">they&#39;re farmers (2형식): 주어(they) + be동사(are) + 주격보어(farmers) 구조로, 보어가 주어의 정체를 설명한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">몇몇 개미는</span><span class=\"en\"><b>Some of the ants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">떠난다</span><span class=\"en\"><b><span class=\"grammar-hl\">set forth</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">둥지에서</span><span class=\"en\"><b><span class=\"grammar-hl\">from the nest</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">신선한 식물을 찾기 위해;</span><span class=\"en\"><b><span class=\"grammar-hl\">to find fresh vegetation</span>;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 그것을 찾으면</span><span class=\"en\"><b><span class=\"grammar-hl\">when they find it</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 큰 조각을 씹어 떼어낸다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">chew off large pieces</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 둥지로 다시 짊어지고 올.</span><span class=\"en\"><b><span class=\"grammar-hl\">that they carry back to the nest</span>.</b></span></div></div><div class=\"lec-sent-ko\">몇몇 개미는 신선한 식물을 찾기 위해 둥지를 떠난다. 그리고 그들이 그것을 찾으면, 그들은 그들이 둥지로 다시 짊어지고 올 큰 조각을 씹어 떼어낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 개미 농사의 첫 단계를 보여 줍니다. 모든 개미가 같은 일을 하는 것이 아니라, 일부 개미가 둥지 밖으로 나가 식물 조각을 모아 오는 역할을 맡습니다. 앞 문장에서 말한 ‘농부’라는 비유를 실제 행동으로 뒷받침하는 예시입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">set forth from the nest (관용표현): set forth는 하나의 동사구처럼 쓰이며, from the nest가 출발 지점을 나타내는 전치사구로 붙는다.</div><div class=\"lec-gr-item\">to find fresh vegetation (to부정사): to + 동사원형(find) 구조로, 앞의 동사구(set forth)를 수식하여 목적을 나타내는 부사적 용법이다.</div><div class=\"lec-gr-item\">when they find it (부사절): when + 주어(they) + 동사(find) 구조로, 뒤 절의 동작이 일어나는 시간을 나타내는 종속절이다.</div><div class=\"lec-gr-item\">chew off large pieces (관용표현): chew off는 동사 + 부사로 이루어진 구동사이며, 목적어 large pieces가 뒤에 온 3형식 구조이다.</div><div class=\"lec-gr-item\">that they carry back to the nest (관계대명사): that은 앞의 명사구 large pieces를 선행사로 하며, 관계절 안에서 carry의 목적어 역할을 한다. 관계절 내부는 they carry back to the nest처럼 목적어 자리가 비어 있는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">set forth</td><td class=\"m\">출발하다, 떠나다, 제시하다</td></tr><tr><td class=\"w\">vegetation</td><td class=\"m\">초목, 식물, 식물군</td></tr><tr><td class=\"w\">chew off</td><td class=\"m\">씹어 떼어내다, 물어뜯다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만</span><span class=\"en\"><b>However,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개미는</span><span class=\"en\"><b><span class=\"grammar-hl\">the ants</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 잎을 먹지 않는다.</span><span class=\"en\"><b><span class=\"grammar-hl\">don't eat these leaves</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만, 개미는 이 잎을 먹지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 독자의 예상에 변화를 줍니다. 앞 문장에서 개미들이 잎을 열심히 가져오므로 잎이 먹이처럼 보이지만, 글은 잎의 진짜 쓰임을 다음 문장에서 설명하려고 방향을 바꿉니다. 여기서 잎은 최종 먹이가 아니라 농사를 위한 재료로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the ants don&#39;t eat these leaves (부정문): 일반동사 eat의 현재시제 부정은 do not을 사용하며, 주어(the ants) + don&#39;t + 동사원형(eat) + 목적어(these leaves) 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신에</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 작은 일개미가</span><span class=\"en\"><b>smaller worker ants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잎 조각을 가져다가</span><span class=\"en\"><b><span class=\"grammar-hl\">take the pieces of leaves,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 더 작은 조각으로 씹고</span><span class=\"en\"><b><span class=\"grammar-hl\">chew them into smaller pieces,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것들을 비료로 사용한다</span><span class=\"en\"><b><span class=\"grammar-hl\">and use these as fertilizer</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">균류를 키우기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to grow fungus</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">커다란 지하 ‘정원’에서.</span><span class=\"en\"><b>in large underground 'gardens.'</b></span></div></div><div class=\"lec-sent-ko\">대신에, 더 작은 일개미가 잎 조각을 가져다가 그것들을 더 작은 조각으로 씹고, 그것들을 커다란 지하 ‘정원’에서 균류를 키우기 위한 비료로 사용한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 잎의 실제 역할을 설명합니다. 잎꾼개미 사회에는 밖에서 잎을 가져오는 개미와, 안에서 잎을 잘게 처리해 균류를 기르는 개미가 나뉘어 있습니다. 인간 농업에서 밭을 관리하고 작물을 키우듯, 이 개미들도 지하 공간에서 먹이가 될 균류를 체계적으로 기릅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">take the pieces of leaves, chew them into smaller pieces, and use these as fertilizer (병렬구조): take, chew, use가 같은 주어(smaller worker ants)에 연결된 동사들로 병렬되어 있으며, 각각 목적어를 취하는 3형식 동사구이다.</div><div class=\"lec-gr-item\">chew them into smaller pieces 결과 전치사구: chew + 목적어(them) + into + 명사구(smaller pieces) 구조로, 목적어가 어떤 결과 상태가 되는지를 into 전치사구가 나타낸다.</div><div class=\"lec-gr-item\">as fertilizer (전치사구): as + 명사 구조로, use these 뒤에서 목적어 these의 용도나 역할을 보충한다.</div><div class=\"lec-gr-item\">to grow fungus (to부정사): to + 동사원형(grow) 구조로, 앞의 use these as fertilizer를 수식하여 목적을 나타내는 부사적 용법이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fertilizer</td><td class=\"m\">비료, 거름</td></tr><tr><td class=\"w\">fungus</td><td class=\"m\">균류, 곰팡이, 버섯류</td></tr><tr><td class=\"w\">underground</td><td class=\"m\">지하의, 땅속의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">개미는</span><span class=\"en\"><b>The ants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">균류에게 먹이를 주고</span><span class=\"en\"><b><span class=\"grammar-hl\">feed the fungus</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">균류는</span><span class=\"en\"><b>and the fungus</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작은 자실체로 피어난다</span><span class=\"en\"><b><span class=\"grammar-hl\">blossoms into small fruiting bodies</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개미가 나중에 먹을.</span><span class=\"en\"><b><span class=\"grammar-hl\">which the ants later eat</span>.</b></span></div></div><div class=\"lec-sent-ko\">개미는 균류에게 먹이를 주고, 균류는 개미가 나중에 먹을 작은 자실체로 피어난다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 개미 농사의 결과를 보여 줍니다. 개미들이 잎을 이용해 균류를 키우면, 균류가 먹을 수 있는 부분을 만들어 내고 개미들은 그것을 먹습니다. 앞 문장에서 설명한 ‘균류 재배’가 실제 식량 생산으로 이어지는 과정입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">feed the fungus 기본 3형식: 주어(The ants) + 동사(feed) + 목적어(the fungus) 구조로, feed가 목적어를 직접 취한다.</div><div class=\"lec-gr-item\">blossoms into small fruiting bodies 동사구 구조: blossom into + 명사구 구조로, into 이하가 변화의 결과로 생긴 대상을 나타낸다.</div><div class=\"lec-gr-item\">fruiting bodies (현재분사(형용사)): fruiting이 뒤의 명사 bodies를 수식한다. -ing + N 구조로, bodies가 특정 기능이나 상태를 가진 명사임을 나타내며 bodies that are fruiting 정도의 축약된 수식 구조로 볼 수 있다.</div><div class=\"lec-gr-item\">which the ants later eat (관계대명사): which는 앞의 명사구 small fruiting bodies를 선행사로 하며, 관계절 안에서 eat의 목적어 역할을 한다. 관계절 내부는 the ants later eat처럼 목적어 자리가 비어 있는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fungus</td><td class=\"m\">균류, 곰팡이, 버섯류</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이 성공적인 농업 전략을 사용하여</span><span class=\"en\"><b><span class=\"grammar-hl\">Using this successful farming strategy</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개미는</span><span class=\"en\"><b>the ants</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">거대한 둥지를 짓는다</span><span class=\"en\"><b><span class=\"grammar-hl\">build enormous nests</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지하에</span><span class=\"en\"><b><span class=\"grammar-hl\">underground</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수백 제곱미터에 달하는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">something spanning hundreds of square meters</span>.</b></span></div></div><div class=\"lec-sent-ko\">이 성공적인 농업 전략을 사용하여, 개미는 지하에 거대한 둥지, 수백 제곱미터에 달하는 것을 짓는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 농사 전략의 효과를 설명합니다. 안정적으로 먹이를 생산할 수 있기 때문에 잎꾼개미는 매우 큰 집단을 유지하고, 지하에 넓은 둥지를 만들 수 있습니다. 앞에서 말한 먹이 생산 방식이 단순한 행동을 넘어 거대한 사회 구조를 가능하게 한다는 흐름입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Using this successful farming strategy (분사구문): 현재분사 Using으로 시작하는 부사적 구조이며, 주절의 주어 the ants와 의미상 주어가 같다. 원래 절은 because they use this successful farming strategy로 바꿀 수 있다.</div><div class=\"lec-gr-item\">farming strategy (동명사(명사적)): farming이 행위나 활동 개념으로 strategy를 꾸미는 구조이다. 즉 farming + strategy는 ‘농사라는 활동과 관련된 전략’이라는 명사적 수식이다.</div><div class=\"lec-gr-item\">build enormous nests underground 기본 3형식: 주어(the ants) + 동사(build) + 목적어(enormous nests) 구조이며, underground는 장소를 나타내는 부사 역할을 한다.</div><div class=\"lec-gr-item\">something spanning hundreds of square meters (현재분사(형용사)): spanning이 앞의 something을 뒤에서 수식한다. N + -ing 구조로, something that spans hundreds of square meters처럼 관계절이 축약된 형태이다.</div><div class=\"lec-gr-item\">hundreds of square meters 수량 표현: hundreds of + 복수명사 구조로, 정확한 수치가 아니라 많은 수의 단위를 나타내는 명사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">underground</td><td class=\"m\">지하의, 땅속의</td></tr><tr><td class=\"w\">strategy</td><td class=\"m\">전략, 계획, 방책</td></tr><tr><td class=\"w\">enormous</td><td class=\"m\">거대한, 막대한</td></tr><tr><td class=\"w\">span</td><td class=\"m\">걸치다, 걸쳐 이어지다, 포괄하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인간과 마찬가지로</span><span class=\"en\"><b><span class=\"grammar-hl\">Just like humans</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은</span><span class=\"en\"><b>they</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">농업 문명을 완성했다.</span><span class=\"en\"><b><span class=\"grammar-hl\">have perfected</span> <span class=\"grammar-hl\">an agricultural civilization</span>.</b></span></div></div><div class=\"lec-sent-ko\">인간과 마찬가지로, 그들은 농업 문명을 완성했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장은 글 전체의 결론입니다. 글쓴이는 잎꾼개미가 먹이를 찾는 수준을 넘어, 역할 분담과 재배 방식, 대규모 둥지까지 갖춘 정교한 농업 사회를 이루었다고 정리합니다. 첫부분의 인간과의 비교가 다시 등장하면서, 개미의 농사 방식이 얼마나 발달했는지를 강하게 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Just like humans (관용표현): just like + 명사 구조로, humans와 they를 비교하는 부사구 역할을 한다.</div><div class=\"lec-gr-item\">have perfected (현재완료): have + p.p.(perfected) 구조로, 주어 they가 과거부터 현재까지 이어지는 결과나 성취를 나타내는 서술부이다.</div><div class=\"lec-gr-item\">an agricultural civilization 목적어 구조: 타동사 perfected의 목적어로 쓰인 명사구이며, 관사 an + 형용사 agricultural + 명사 civilization의 순서로 구성된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perfect</td><td class=\"m\">완성하다, 완벽하게 하다, 숙달하다</td></tr><tr><td class=\"w\">agricultural</td><td class=\"m\">농업의, 농사의</td></tr><tr><td class=\"w\">civilization</td><td class=\"m\">문명, 문명사회</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>잎꾼개미는 거대한 군체를 이루며 자기 먹이를 직접 재배한다.</li><li>일부 개미는 밖에서 잎을 가져오고, 다른 개미는 그 잎을 잘게 씹어 균류를 기르는 데 사용한다.</li><li>개미들이 실제로 먹는 것은 잎이 아니라, 잎을 비료 삼아 자란 균류의 일부이다.</li><li>이런 농업 방식 덕분에 잎꾼개미는 거대한 지하 둥지와 조직적인 농업 사회를 이룰 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Leaf-cutter ants use leaves to grow fungus as food and develop huge underground colonies through advanced farming.</div>\n              <div class=\"lec-final-sum-ko\">잎꾼개미는 잎을 이용해 먹이인 균류를 재배하고 발달된 농업을 통해 거대한 지하 군집을 형성한다.</div></div></div>"],"segs":[[{"audio":"./39_audio/1.mp3","hl":null}],[{"audio":"./39_audio/2.mp3","hl":null}],[{"audio":"./39_audio/3.mp3","hl":null},{"audio":"./39_audio/4.mp3","hl":"stage-0"},{"audio":"./39_audio/5.mp3","hl":"stage-1"},{"audio":"./39_audio/6.mp3","hl":"stage-2"},{"audio":"./39_audio/7.mp3","hl":"stage-3"},{"audio":"./39_audio/8.mp3","hl":"stage-4"}],[{"audio":"./39_audio/9.mp3","hl":null}],[{"audio":"./39_audio/10.mp3","hl":"main"},{"audio":"./39_audio/11.mp3","hl":"meaning"},{"audio":"./39_audio/12.mp3","hl":"grammar"}],[{"audio":"./39_audio/13.mp3","hl":"main"},{"audio":"./39_audio/14.mp3","hl":"meaning"},{"audio":"./39_audio/15.mp3","hl":"grammar"}],[{"audio":"./39_audio/16.mp3","hl":"main"},{"audio":"./39_audio/17.mp3","hl":"meaning"},{"audio":"./39_audio/18.mp3","hl":"grammar"}],[{"audio":"./39_audio/19.mp3","hl":"main"},{"audio":"./39_audio/20.mp3","hl":"meaning"},{"audio":"./39_audio/21.mp3","hl":"grammar"}],[{"audio":"./39_audio/22.mp3","hl":"main"},{"audio":"./39_audio/23.mp3","hl":"meaning"},{"audio":"./39_audio/24.mp3","hl":"grammar"}],[{"audio":"./39_audio/25.mp3","hl":"main"},{"audio":"./39_audio/26.mp3","hl":"meaning"},{"audio":"./39_audio/27.mp3","hl":"grammar"}],[{"audio":"./39_audio/28.mp3","hl":"main"},{"audio":"./39_audio/29.mp3","hl":"meaning"},{"audio":"./39_audio/30.mp3","hl":"grammar"}],[{"audio":"./39_audio/31.mp3","hl":"main"},{"audio":"./39_audio/32.mp3","hl":"meaning"},{"audio":"./39_audio/33.m
