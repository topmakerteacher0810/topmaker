련이 되는 셈입니다. 반대로 좌식 생활(Sedentary lifestyle)과 과도한 스마트 기기 사용(Screen time)은 신체 활동 부족뿐 아니라 불안(Anxiety), 우울(Depression), 사회적 단서(Social cues)를 읽는 능력 저하와 관련이 있다는 연구들이 많이 보고되고 있습니다. 그래서 이 지문을 이해할 때는 “움직임은 선택적인 취미가 아니라 인간이 건강하게 배우고 소통하며 성장하기 위한 기본 설계”라는 관점을 알고 읽으면 좋습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01인간의 본래 설계</div><ul><li>인간은 놀라운 존재로 만들어졌지만, 그 가능성을 충분히 누리지 못하고 있다.</li><li>우리는 움직이도록 설계된 존재(design)</li><li>창조된 경이로움(wonder)에 참여하지 못함</li><li>핵심 키워드: 인간의 설계(human design)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02움직임의 부족</div><ul><li>현대인은 하루 대부분을 의자에 앉아 거의 움직이지 않는 생활을 한다.</li><li>같은 공간(square footage)에 오랜 시간 머묾</li><li>어디든 움직이기보다 아무 데도 움직이지 않음</li><li>핵심 키워드: 정적인 생활(sedentary life)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03스마트 기기의 영향</div><ul><li>많은 아이들이 스마트 기기에 붙잡혀 밖에서 놀거나 사람들과 어울리지 못한다.</li><li>스마트폰과 태블릿(smart devices)에 의존</li><li>밖에서 놀기(outside play) 부족</li><li>사회적 단서(physical cues)를 읽는 경험 부족</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04움직임 능력의 상실</div><ul><li>아이들은 다양한 움직임을 배우지 못해 학습과 소통, 정서 발달의 기회를 잃는다.</li><li>움직임 목록(movement repertoire)을 형성하지 못함</li><li>달리기(run), 깡충뛰기(skip), 오르기(climb)를 배우지 못함</li><li>학습(learn), 소통(communicate), 창조(create)에 악영향</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05삶의 질 저하와 결론</div><ul><li>움직임에서 멀어질수록 불안, 우울, 질병에 가까워지며, 움직임은 삶의 핵심이다.</li><li>불안(anxiety), 우울(depression), 질병(diseases) 증가</li><li>인간의 본래 설계(design)에서 멀어짐</li><li>핵심 키워드: 움직임은 생명(movement is life)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">participate</td><td class=\"m\">참여하다, 참가하다, 관여하다</td></tr><tr><td class=\"w\">wonder</td><td class=\"m\">경이, 놀라움, 경탄</td></tr><tr><td class=\"w\">instead of</td><td class=\"m\">~대신에, ~하지 않고</td></tr><tr><td class=\"w\">occupy</td><td class=\"m\">차지하다, 점유하다, 사용하다</td></tr><tr><td class=\"w\">hold someone captive</td><td class=\"m\">~을 포로로 잡아 두다, ~을 사로잡아 두다, ~을 구속하다</td></tr><tr><td class=\"w\">socialize</td><td class=\"m\">사귀다, 사회생활을 하다, 사회화하다</td></tr><tr><td class=\"w\">cue</td><td class=\"m\">신호, 단서, 암시</td></tr><tr><td class=\"w\">as a result</td><td class=\"m\">그 결과, 결과적으로</td></tr><tr><td class=\"w\">movement</td><td class=\"m\">움직임, 운동, 신체 활동</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">repertoire</td><td class=\"m\">레퍼토리, 기량의 범위, 목록</td></tr><tr><td class=\"w\">mature</td><td class=\"m\">성숙한, 충분히 발달한, 어른스러운</td></tr><tr><td class=\"w\">live with</td><td class=\"m\">~을 안고 살다, ~을 견디다, ~와 함께 살다</td></tr><tr><td class=\"w\">anxiety</td><td class=\"m\">불안, 걱정, 염려</td></tr><tr><td class=\"w\">depression</td><td class=\"m\">우울증, 우울감, 침체</td></tr><tr><td class=\"w\">be meant to</td><td class=\"m\">~하도록 의도되다, ~해야 하다, ~할 운명이다</td></tr><tr><td class=\"w\">get away from</td><td class=\"m\">~에서 벗어나다, ~에서 멀어지다, ~을 피하다</td></tr><tr><td class=\"w\">design</td><td class=\"m\">설계, 의도, 구조</td></tr><tr><td class=\"w\">extraordinary</td><td class=\"m\">비범한, 놀라운, 특별한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 경이롭게 만들어졌다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">are wonderfully made</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 우리는 우리 자신에게 허용하지 않는다</span><span class=\"en\"><b>yet we don't <span class=\"grammar-hl\">allow ourselves</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 경이로움에 참여하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to participate</span> in the wonder</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 위해 우리가 창조된</span><span class=\"en\"><b><span class=\"grammar-hl\">for which we were created</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 경이롭게 만들어졌지만, 우리가 창조된 목적인 그 경이로움에 우리 자신이 참여하게 하지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글쓴이는 사람의 몸과 삶이 본래 놀라운 가능성을 갖고 있다고 말하며 글을 시작합니다. 그런데 현대인은 그 가능성을 충분히 쓰지 못하고 있다는 문제의식을 바로 제시합니다. 여기서 ‘경이에 참여한다’는 말은 인간이 가진 몸의 능력, 움직임, 성장 가능성을 실제 생활 속에서 누리며 살아가는 것을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are wonderfully made (수동태): be동사(are)+p.p.(made) 구조이다. make는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) are made 형태로 쓴다. 기본구조: make + O(목적어), 또는 make + O + C(목적격보어). wonderfully는 과거분사 made를 수식하는 부사이다.</div><div class=\"lec-gr-item\">allow ourselves to participate (5형식(SVOC)): allow + O + toV 구조이다. ourselves가 목적어(O), to participate가 목적격보어(C) 역할을 하며, ‘목적어가 어떤 행동을 하도록 허용하다’라는 구조를 만든다.</div><div class=\"lec-gr-item\">to participate in the wonder (to부정사): to + 동사원형(participate) 구조이다. 앞의 allow ourselves와 결합하여 목적어 ourselves의 행동을 설명하는 목적격보어 역할을 한다.</div><div class=\"lec-gr-item\">for which we were created (전치사+관계대명사): 기본틀은 전치사 + 관계대명사 + S + V이다. for which 뒤에 we were created처럼 주어+동사가 갖춰진 완전한 절이 오며, which는 앞의 the wonder를 가리킨다. 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절(완전문장)이 온다.</div><div class=\"lec-gr-item\">were created (수동태): be동사(were)+p.p.(created) 구조이다. create는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) were created 형태로 쓴다. 기본구조: create + O(목적어), 또는 create + O + for + 목적/대상.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">participate</td><td class=\"m\">참여하다, 참가하다, 관여하다</td></tr><tr><td class=\"w\">wonder</td><td class=\"m\">경이, 놀라움, 경탄</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어디로든 사방으로 움직이는 대신에</span><span class=\"en\"><b><span class=\"grammar-hl\">Instead of moving anywhere and everywhere</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 대부분은</span><span class=\"en\"><b>most of us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 시간을 보낸다</span><span class=\"en\"><b><span class=\"grammar-hl\">spend our time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어디로도 움직이지 않으며</span><span class=\"en\"><b><span class=\"grammar-hl\">moving nowhere</span>.</b></span></div></div><div class=\"lec-sent-ko\">어디로든 사방으로 움직이는 대신에, 우리의 대부분은 어디로도 움직이지 않은 채 우리의 시간을 보낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞문장의 문제의식을 구체화합니다. 인간은 다양한 장소와 상황 속에서 몸을 움직이며 살아가도록 되어 있는데, 실제 생활은 거의 움직임 없이 흘러간다는 뜻입니다. 현대 사회에서는 공부, 업무, 여가까지 의자와 화면 앞에서 이루어지는 경우가 많아 이런 비판이 나옵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Instead of moving anywhere and everywhere (동명사): 전치사 of 뒤에 동사원형이 올 수 없으므로 moving처럼 -ing 형태가 전치사의 목적어 역할을 한다. 여기서 moving은 명사 역할이므로 동명사이다.</div><div class=\"lec-gr-item\">spend our time moving nowhere (관용표현): spend + 시간 + -ing 구조이다. spend our time 뒤의 moving은 시간을 어떻게 사용하는지를 나타내는 고정적인 결합으로 쓰인다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">instead of</td><td class=\"m\">~대신에, ~하지 않고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 의자와 동일한 제곱 피트수를 차지한다</span><span class=\"en\"><b><span class=\"grammar-hl\">We occupy the same square footage</span> of a chair</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇 시간이고 몇 시간이고</span><span class=\"en\"><b><span class=\"grammar-hl\">for hours and hours</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일</span><span class=\"en\"><b><span class=\"grammar-hl\">every day</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 매일 몇 시간이고 의자와 동일한 제곱 피트수를 차지한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞문장의 ‘움직이지 않는 삶’을 눈에 보이는 장면으로 보여 줍니다. 사람이 하루 종일 의자에 앉아 있는 모습을 통해 현대인의 생활이 얼마나 정적인지 강조합니다. 이 문장은 단순히 앉아 있다는 사실을 말하는 데서 끝나지 않고, 몸을 쓰지 않는 생활이 일상이 되었다는 점을 비판합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">We occupy the same square footage (기본문형): 주어 We + 동사 occupy + 목적어 the same square footage의 3형식(SVO) 구조이다. occupy는 타동사이므로 뒤에 명사 목적어가 온다.</div><div class=\"lec-gr-item\">for hours and hours every day (전치사구): for + 시간 표현 구조로, 동작이 지속되는 기간을 나타내는 부사구 역할을 한다. every day는 빈도를 나타내는 부사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">occupy</td><td class=\"m\">차지하다, 점유하다, 사용하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">오늘날 많은 아이들은</span><span class=\"en\"><b>Many kids today</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사로잡혀 있는 중이다</span><span class=\"en\"><b><span class=\"grammar-hl\">are being held captive</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">폰과 태블릿 같은 ‘스마트’ 기기들에 의해</span><span class=\"en\"><b><span class=\"grammar-hl\">by 'smart' devices</span> like phones and tablets.</b></span></div></div><div class=\"lec-sent-ko\">오늘날 많은 아이들은 폰과 태블릿 같은 ‘스마트’ 기기들에 사로잡혀 있는 중이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이제 초점이 현대인 전체에서 아이들로 좁혀집니다. 글쓴이는 특히 성장기 아이들이 스마트 기기에 많은 시간을 빼앗기는 현실을 문제로 봅니다. ‘붙잡혀 있다’는 표현은 아이들이 기기를 스스로 조절하며 쓰는 수준을 넘어, 기기에 생활과 관심을 지배당하는 모습을 떠올리게 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are being held captive (수동태): be동사(are)+being+p.p.(held) 구조의 진행 수동태이다. hold는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) are being held captive 형태로 쓴다. 기본구조: hold + O(목적어) + C(목적격보어), 여기서는 hold many kids captive가 능동의 기본 구조이다.</div><div class=\"lec-gr-item\">held captive (5형식(SVOC)): 능동 구조는 hold + O + C이다. captive는 목적어의 상태를 설명하는 목적격보어이고, 수동 전환 후에도 보어 captive는 남아 are being held captive 구조를 이룬다.</div><div class=\"lec-gr-item\">by &#39;smart&#39; devices (전치사구): by + 명사 구조로, 수동태에서 행위자를 나타내는 부사구 역할을 한다. devices가 수동 동작을 일으키는 주체로 제시된다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 밖으로 나가지 않고 있다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">are not going outside</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">놀기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to play</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 배우고 있지 않다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">are not learning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사회화하는 법을</span><span class=\"en\"><b><span class=\"grammar-hl\">how to socialize</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 타인으로부터 신체적 신호를 읽는 법을</span><span class=\"en\"><b><span class=\"grammar-hl\">and read physical cues from others</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 놀기 위해 밖으로 나가지 않고 있으며, 그들은 사회화하는 법과 타인으로부터 신체적 신호를 읽는 법을 배우고 있지 않다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞문장에서 말한 스마트 기기 의존의 결과가 설명됩니다. 아이들이 밖에서 뛰어놀지 않으면 친구들과 몸을 부딪치고 표정, 자세, 거리감, 반응을 읽는 경험이 줄어듭니다. 성장기에는 놀이를 통해 사회성도 배우기 때문에, 글쓴이는 기기 사용이 단순한 여가 문제가 아니라 발달 문제와 연결된다고 봅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are not going outside (현재진행): be동사(are)+동사-ing(going) 구조이다. 현재 진행 중이거나 현재의 반복적 상황을 나타내는 서술부로 쓰였다.</div><div class=\"lec-gr-item\">to play (to부정사): to + 동사원형(play) 구조이다. 앞의 going outside를 수식하여 ‘무엇을 하러 밖에 나가는지’를 나타내는 목적의 부사적 용법이다.</div><div class=\"lec-gr-item\">are not learning (현재진행): be동사(are)+동사-ing(learning) 구조이다. not이 be동사 뒤에 와서 부정 진행형을 만든다.</div><div class=\"lec-gr-item\">how to socialize and read physical cues from others (간접의문문): 의문사 how + to부정사 구조로, ‘어떻게 ~할지’라는 내용을 명사구처럼 만든다. learn의 목적어 역할을 하며, to는 socialize와 read에 공통으로 연결된다.</div><div class=\"lec-gr-item\">to socialize and read physical cues from others (to부정사): to + 동사원형 구조이다. socialize와 read가 and로 병렬 연결되어 하나의 to에 함께 걸린다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">socialize</td><td class=\"m\">사귀다, 사회생활을 하다, 사회화하다</td></tr><tr><td class=\"w\">cue</td><td class=\"m\">신호, 단서, 암시</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 결과</span><span class=\"en\"><b>As a result</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 배우거나 형성하지 않고 있다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">are not learning or building</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 움직임 레퍼토리를</span><span class=\"en\"><b>their movement repertoire,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바로 그것을</span><span class=\"en\"><b><span class=\"grammar-hl\">the very thing</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 도와줄</span><span class=\"en\"><b><span class=\"grammar-hl\">that will help them</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학습하고, 소통하고, 창조하며</span><span class=\"en\"><b><span class=\"grammar-hl\">learn, communicate, create,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 정서적으로 성숙해지도록</span><span class=\"en\"><b><span class=\"grammar-hl\">and become emotionally mature</span>.</b></span></div></div><div class=\"lec-sent-ko\">그 결과 그들은 그들의 움직임 레퍼토리, 즉 그들이 학습하고 소통하고 창조하며 정서적으로 성숙해지도록 도와줄 바로 그것을 배우거나 형성하지 않고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞문장의 결과를 더 깊게 설명합니다. 아이들이 다양한 움직임을 경험하지 못하면 몸을 쓰는 능력만 줄어드는 것이 아니라 학습, 의사소통, 창의성, 감정 발달에도 영향을 받는다는 주장입니다. 발달 심리와 교육 분야에서는 신체 활동이 뇌 발달, 감정 조절, 사회적 상호작용과 연결된다고 봅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are not learning or building (현재진행): be동사(are)+동사-ing 구조이다. learning과 building이 or로 병렬 연결되어 같은 be동사 are에 걸린다.</div><div class=\"lec-gr-item\">the very thing that will help them learn, communicate, create, and become emotionally mature (관계대명사): that이 앞의 the very thing을 선행사로 받으며, 관계절 안에서 주어 역할을 한다. that will help them... 전체가 the very thing을 수식한다.</div><div class=\"lec-gr-item\">help them learn, communicate, create, and become emotionally mature (5형식(SVOC)): help + O + 동사원형 구조이다. them이 목적어(O), learn, communicate, create, become이 목적격보어(C)에 해당하는 동사원형들이다. help는 목적격보어로 to부정사 또는 동사원형을 취할 수 있다.</div><div class=\"lec-gr-item\">become emotionally mature (2형식(SVC)): become은 연결동사로 쓰이고, emotionally mature가 주격보어(C) 역할을 한다. emotionally는 형용사 mature를 수식하는 부사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">as a result</td><td class=\"m\">그 결과, 결과적으로</td></tr><tr><td class=\"w\">movement</td><td class=\"m\">움직임, 운동, 신체 활동</td></tr><tr><td class=\"w\">repertoire</td><td class=\"m\">레퍼토리, 기량의 범위, 목록</td></tr><tr><td class=\"w\">mature</td><td class=\"m\">성숙한, 충분히 발달한, 어른스러운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 심지어 배우고 있지 않다</span><span class=\"en\"><b>They <span class=\"grammar-hl\">are not even learning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달리는 법을</span><span class=\"en\"><b><span class=\"grammar-hl\">how to run,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">깡충 뛰는 법을</span><span class=\"en\"><b><span class=\"grammar-hl\">how to skip,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혹은 기어오르는 법을</span><span class=\"en\"><b><span class=\"grammar-hl\">or how to climb</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들은 심지어 달리는 법, 깡충 뛰는 법, 혹은 기어오르는 법조차 배우고 있지 않다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞문장에서 말한 ‘움직임의 폭’을 아주 기본적인 예로 풀어 줍니다. 달리기, 뛰기, 오르기는 아이들이 놀이를 통해 자연스럽게 익히는 움직임입니다. 글쓴이는 오늘날 아이들이 이런 기본 활동마저 충분히 경험하지 못할 정도로 몸을 덜 쓰고 있다고 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are not even learning (현재진행): be동사(are)+동사-ing(learning) 구조이다. not은 부정, even은 강조 부사로 learning 앞에서 의미를 강화한다.</div><div class=\"lec-gr-item\">how to run, how to skip, or how to climb (간접의문문): how + to부정사 구조가 병렬로 연결되어 learn의 목적어 역할을 한다. 각각 ‘어떻게 달릴지/뛸지/오를지’에 해당하는 명사구 기능을 한다.</div><div class=\"lec-gr-item\">to run, how to skip, or how to climb (to부정사): to + 동사원형(run/skip/climb) 구조이다. 세 개의 to부정사구가 병렬로 연결되어 learning의 목적어 내용을 이룬다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신에</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 배우고 있다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">are learning</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사는 법을</span><span class=\"en\"><b><span class=\"grammar-hl\">how to live</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불안, 우울, 그리고 심지어 질병들과</span><span class=\"en\"><b><span class=\"grammar-hl\">with anxiety, depression, and even diseases</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 결코 가지기로 되어 있지 않았던</span><span class=\"en\"><b>they <span class=\"grammar-hl\">were never meant to have</span>.</b></span></div></div><div class=\"lec-sent-ko\">대신에 그들은 결코 가지기로 되어 있지 않았던 불안, 우울, 그리고 심지어 질병들과 사는 법을 배우고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞문장과 대비를 이루며, 아이들이 건강한 움직임을 배우는 대신 정신적·신체적 문제에 익숙해지고 있다고 말합니다. 여기서 글쓴이는 움직임 부족이 불안, 우울, 질병과 연결될 수 있다는 점을 강하게 드러냅니다. 현대 의학에서도 신체 활동 부족은 비만, 대사 질환, 수면 문제, 정서 문제의 위험을 높이는 요인으로 자주 언급됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are learning (현재진행): be동사(are)+동사-ing(learning) 구조이다. 현재의 진행 중인 상태나 현재 형성되고 있는 상황을 나타낸다.</div><div class=\"lec-gr-item\">how to live with anxiety, depression, and even diseases (간접의문문): how + to부정사 구조로, learn의 목적어 역할을 한다. 의문사 how가 to live와 결합해 ‘어떻게 살아갈지’라는 명사구를 만든다.</div><div class=\"lec-gr-item\">to live with anxiety, depression, and even diseases (to부정사): to + 동사원형(live) 구조이다. how와 결합하여 learn의 목적어가 되는 명사구를 이룬다.</div><div class=\"lec-gr-item\">diseases they were never meant to have (관계대명사): diseases 뒤에 목적격 관계대명사 that/which가 생략된 구조이다. 관계절 they were never meant to have 안에서 have의 목적어 자리가 비어 있고, 그 자리를 선행사 diseases가 채운다.</div><div class=\"lec-gr-item\">were never meant to have (수동태): be동사(were)+p.p.(meant) 구조이다. mean은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) were meant 형태로 쓴다. 기본구조: mean + O(목적어) + toV이며, 수동 전환 후 목적어가 주어로 올라가고 to have가 뒤에 남는다.</div><div class=\"lec-gr-item\">were never meant to have (5형식(SVOC)): 능동 기본틀은 mean + O + toV이다. O가 수동문의 주어 they로 올라가 were meant가 되고, 목적격보어였던 to have는 구조상 그대로 남는다.</div><div class=\"lec-gr-item\">to have (to부정사): to + 동사원형(have) 구조이다. were meant 뒤에 남아 주어 they에게 연결되는 보어적 역할을 하며, 관계절 안에서는 have의 목적어가 앞의 diseases로 이동해 있다.</div><div class=\"lec-gr-item\">were never meant to have (관용표현): be meant to V는 ‘~하도록 의도되다/예정되다’라는 뜻의 고정 표현처럼 쓰인다. 구조상 be + p.p. + to부정사 형태를 가진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">live with</td><td class=\"m\">~을 안고 살다, ~을 견디다, ~와 함께 살다</td></tr><tr><td class=\"w\">anxiety</td><td class=\"m\">불안, 걱정, 염려</td></tr><tr><td class=\"w\">depression</td><td class=\"m\">우울증, 우울감, 침체</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">요점은 이것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">The point is</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 점점 더 멀어지고 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">we are getting further and further away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 설계로부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from our design</span>.</b></span></div></div><div class=\"lec-sent-ko\">요점은 우리가 우리의 설계로부터 점점 더 멀어지고 있는 중이라는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지의 사례를 한 문장으로 정리하는 부분입니다. 글쓴이는 인간이 움직이며 살도록 만들어졌는데, 현대 생활은 그 방향에서 멀어지고 있다고 결론짓습니다. ‘본래 설계’는 인간의 몸과 마음이 활동, 놀이, 상호작용, 탐험을 통해 잘 작동하도록 되어 있다는 생각을 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The point is we are getting further and further away from our design (기본문형): The point가 주어, is가 연결동사, 뒤의 절 we are getting further and further away from our design이 보어 역할을 하는 2형식(SVC) 구조이다.</div><div class=\"lec-gr-item\">are getting further and further away (현재진행): be동사(are)+동사-ing(getting) 구조이다. getting 뒤에 형용사/부사구 further and further away가 보어처럼 와서 상태 변화의 방향을 나타낸다.</div><div class=\"lec-gr-item\">further and further 비교급 반복: 비교급 further를 and로 반복하여 정도가 점점 커지는 구조를 만든다. 형용사/부사 비교급 + and + 형용사/부사 비교급 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">design</td><td class=\"m\">설계, 의도, 구조</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 만들어졌다</span><span class=\"en\"><b>We <span class=\"grammar-hl\">were made</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">움직이도록 ―</span><span class=\"en\"><b><span class=\"grammar-hl\">to move</span> ―</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 움직임을 통해</span><span class=\"en\"><b>and through movement,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 되어 있다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">are meant</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특별한 삶을 살도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to live extraordinary lives</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 움직이도록 만들어졌으며, 움직임을 통해 특별한 삶을 살도록 되어있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞문장의 결론을 긍정적인 방향으로 확장합니다. 인간에게 움직임은 단순한 운동 시간이 아니라 배우고 관계 맺고 창조하며 삶을 풍성하게 만드는 통로라는 뜻입니다. 글쓴이는 몸을 움직이는 삶이 인간다운 삶의 핵심 조건이라고 힘주어 말합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were made to move (수동태): be동사(were)+p.p.(made) 구조이다. make는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) were made 형태로 쓴다. 기본구조: make + O + 동사원형의 5형식이며, 수동 전환 후 O가 주어 We로 올라가고 목적격보어는 to move 형태로 남는다.</div><div class=\"lec-gr-item\">made to move (5형식(SVOC)): 능동 기본틀은 make + O + 동사원형이다. 수동태가 되면 목적어가 주어가 되고, 원래 목적격보어였던 동사원형은 to부정사 형태로 바뀌어 to move가 된다.</div><div class=\"lec-gr-item\">to move (to부정사): to + 동사원형(move) 구조이다. 수동태 were made 뒤에서 주어 We의 행동을 설명하는 보어 역할을 한다.</div><div class=\"lec-gr-item\">are meant to live (수동태): be동사(are)+p.p.(meant) 구조이다. mean은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) are meant 형태로 쓴다. 기본구조: mean + O + toV이며, 수동 전환 후 목적어가 주어로 올라가고 to live가 뒤에 남는다.</div><div class=\"lec-gr-item\">meant to live extraordinary lives (5형식(SVOC)): 능동 기본틀은 mean + O + toV이다. O가 수동문의 주어 we로 올라가 are meant가 되고, 목적격보어였던 to live extraordinary lives는 그대로 이어진다.</div><div class=\"lec-gr-item\">to live extraordinary lives (to부정사): to + 동사원형(live) 구조이다. are meant 뒤에 연결되어 주어 we에게 예정되거나 의도된 행동을 나타내는 보어 역할을 한다.</div><div class=\"lec-gr-item\">are meant to live extraordinary lives (관용표현): be meant to V는 ‘~하도록 의도되다/예정되다’라는 뜻의 고정 표현처럼 쓰인다. be동사 + meant + to부정사 구조로 이루어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">movement</td><td class=\"m\">움직임, 운동, 신체 활동</td></tr><tr><td class=\"w\">extraordinary</td><td class=\"m\">비범한, 놀라운, 특별한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">움직임은 삶이다</span><span class=\"en\"><b><span class=\"grammar-hl\">Movement is life</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게</span><span class=\"en\"><b><span class=\"grammar-hl\">to us</span>.</b></span></div></div><div class=\"lec-sent-ko\">움직임은 우리에게 삶‘이다.’</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 최종 메시지입니다. 앞에서 말한 신체 발달, 사회성, 정서 건강, 창의성의 논의를 모두 압축해 움직임의 중요성을 선언합니다. 글쓴이는 움직임을 선택 사항처럼 보지 않고, 인간이 건강하고 충만하게 살아가기 위해 반드시 필요한 삶의 원리로 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Movement is life to us (기본문형): Movement가 주어(S), is가 연결동사(V), life가 주격보어(C)인 2형식(SVC) 구조이다. to us는 ‘우리에게’라는 기준을 나타내는 전치사구로 문장 전체를 보충한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">movement</td><td class=\"m\">움직임, 운동, 신체 활동</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간은 본래 움직이며 살도록 만들어진 존재다.</li><li>그러나 현대인은 의자와 스마트 기기 앞에서 많은 시간을 보내며 움직임을 잃고 있다.</li><li>특히 아이들은 밖에서 놀며 사회성, 몸의 능력, 정서적 성숙을 키울 기회를 놓치고 있다.</li><li>움직임 부족은 불안, 우울, 질병 같은 문제와 연결될 수 있다.</li><li>글쓴이는 움직임이 인간다운 삶의 핵심이며, 움직임을 통해 더 풍성한 삶을 살 수 있다고 말한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Modern sedentary habits prevent children from developing movement and social abilities, and they lead people away from the healthy lives they were designed to live.</div>\n              <div class=\"lec-final-sum-ko\">현대의 좌식 습관은 아이들이 움직임과 사회적 능력을 발달시키지 못하게 하며, 사람들이 본래 의도된 건강한 삶에서 멀어지게 한다.</div></div></div>"],"segs":[[{"audio":"./21_audio/1.mp3","hl":null}],[{"audio":"./21_audio/2.mp3","hl":null}],[{"audio":"./21_audio/3.mp3","hl":null},{"audio":"./21_audio/4.mp3","hl":"stage-0"},{"audio":"./21_audio/5.mp3","hl":"stage-1"},{"audio":"./21_audio/6.mp3","hl":"stage-2"},{"audio":"./21_audio/7.mp3","hl":"stage-3"},{"audio":"./21_audio/8.mp3","hl":"stage-4"}],[{"audio":"./21_audio/9.mp3","hl":null}],[{"audio":"./21_audio/10.mp3","hl":"main"},{"audio":"./21_audio/11.mp3","hl":"meaning"},{"audio":"./21_audio/12.mp3","hl":"grammar"}],[{"audio":"./21_audio/13.mp3","hl":"main"},{"audio":"./21_audio/14.mp3","hl":"meaning"},{"audio":"./21_audio/15.mp3","hl":"grammar"}],[{"audio":"./21_audio/16.mp3","hl":"main"},{"audio":"./21_audio/17.mp3","hl":"meaning"},{"audio":"./21_audio/18.mp3","hl":"grammar"}],[{"audio":"./21_audio/19.mp3","hl":"main"},{"audio":"./21_audio/20.mp3","hl":"meaning"},{"audio":"./21_audio/21.mp3","hl":"grammar"}],[{"audio":"./21_audio/22.mp3","hl":"main"},{"audio":"./21_audio/23.mp3","hl":"meaning"},{"audio":"./21_audio/24.mp3"
