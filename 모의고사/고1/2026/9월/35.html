doggy smell)’를 싫어해 주 2회 이상 목욕시킴</li><li>수의 피부과 전문의(veterinary dermatologists)는 잦은 목욕을 경고</li><li>핵심 키워드: 과도한 목욕(excessive bathing)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03냄새 관리 대안</div><ul><li>냄새가 걱정된다면 목욕 대신 피부에 부담이 적은 관리 방법을 사용할 수 있다.</li><li>물 없는 샴푸(waterless shampoo) 사용 가능</li><li>매일 꼼꼼히 빗질(brush)해 냄새와 털 관리</li><li>목욕은 최대 주 1~2회로 제한</li><li>핵심 키워드: 대안적 관리(alternative care)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04적절한 목욕 빈도</div><ul><li>대부분의 개는 정기적인 목욕이 필요하지 않으며, 특별한 피부 질환이 있을 때만 예외가 된다.</li><li>수의사가 처방한 약용 목욕(medicated baths)은 예외</li><li>두껍고 무거운 털(thick, heavy coats)을 가진 개도 보통 6~8주마다 목욕</li><li>핵심 키워드: 적정 빈도(proper frequency)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">criterion</td><td class=\"m\">기준, 표준, 판단 기준</td></tr><tr><td class=\"w\">care for</td><td class=\"m\">~을 돌보다, ~을 보살피다, ~을 좋아하다</td></tr><tr><td class=\"w\">impact</td><td class=\"m\">영향을 주다, 충격을 주다</td></tr><tr><td class=\"w\">rather than</td><td class=\"m\">~라기보다는, ~대신에</td></tr><tr><td class=\"w\">encounter</td><td class=\"m\">마주치다, 접하다, 경험하다</td></tr><tr><td class=\"w\">bathe</td><td class=\"m\">목욕시키다, 목욕하다, 씻기다</td></tr><tr><td class=\"w\">religiously</td><td class=\"m\">꼬박꼬박, 철저히, 신앙적으로</td></tr><tr><td class=\"w\">multiple</td><td class=\"m\">여러 번의, 다수의, 복합적인</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 방지하다, 회피하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">veterinary</td><td class=\"m\">수의학의, 동물 진료의</td></tr><tr><td class=\"w\">warn against</td><td class=\"m\">~하지 말라고 경고하다, ~에 대해 주의를 주다</td></tr><tr><td class=\"w\">practice</td><td class=\"m\">관행, 습관, 실행, 연습</td></tr><tr><td class=\"w\">be concerned about</td><td class=\"m\">~을 걱정하다, ~에 관심을 가지다</td></tr><tr><td class=\"w\">thoroughly</td><td class=\"m\">철저히, 완전히, 꼼꼼히</td></tr><tr><td class=\"w\">keep down to</td><td class=\"m\">~을 ~로 제한하다, ~을 ~ 이하로 억제하다</td></tr><tr><td class=\"w\">at most</td><td class=\"m\">많아야, 기껏해야, 최대한</td></tr><tr><td class=\"w\">prescribe</td><td class=\"m\">처방하다, 규정하다, 지시하다</td></tr><tr><td class=\"w\">on a regular basis</td><td class=\"m\">정기적으로, 규칙적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 우리의 반려동물을 어떻게 돌보는지에 대한 우리의 첫 번째 기준은</span><span class=\"en\"><b>Our number one criterion <span class=\"grammar-hl\">for how we care for our pets</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘이것이 그들이 실제로 필요한 것인가? 그것이 그들에게 어떻게 영향을 미치고 있는가?’가 되어야 하며</span><span class=\"en\"><b>should be, \"Is this <span class=\"grammar-hl\">what they actually need</span>? How is it impacting them?\"</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘내가 무엇을 원하는가?’보다는</span><span class=\"en\"><b><span class=\"grammar-hl\">rather than</span>, \"What do I want?\"</b></span></div></div><div class=\"lec-sent-ko\">(우리가 우리의 반려동물을 어떻게 돌보는지에 대한 우리의 첫 번째 기준은 ‘내가 무엇을 원하는가?’보다는 ‘이것이 그들이 실제로 필요한 것인가? 그것이 그들에게 어떻게 영향을 미치고 있는가?’가 되어야 한다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글 전체의 핵심 원칙을 제시합니다. 반려동물을 돌볼 때 보호자의 취향이나 편리함을 먼저 생각하기보다, 그 행동이 동물의 건강과 삶에 실제로 도움이 되는지를 먼저 따져야 한다는 뜻입니다. 뒤의 문장들은 이 원칙을 개 목욕 사례로 구체화합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">for how we care for our pets (간접의문문): 전치사 for의 목적어로 의문사 how + 주어 we + 동사 care 구조가 온 명사절이다. 직접의문문 어순이 아니라 평서문 어순(how + S + V)을 쓴다.</div><div class=\"lec-gr-item\">what they actually need (관계대명사): what은 선행사를 포함하는 관계대명사로, ‘the thing that’의 구조이다. need의 목적어 자리가 비어 있고 what이 그 역할을 하며, 전체 what절이 보어 역할을 한다.</div><div class=\"lec-gr-item\">is impacting them (현재진행): be동사(is) + -ing(impacting) 구조로, 문장의 서술부에서 진행 중인 동작을 나타낸다. 이 경우 -ing는 명사 역할이 아니므로 동명사가 아니라 진행형의 일부이다.</div><div class=\"lec-gr-item\">rather than (관용표현): rather than은 두 선택지나 기준을 대조하는 연결 표현으로, 앞의 기준 should be ...와 뒤의 기준 What do I want?를 대비시킨다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">criterion</td><td class=\"m\">기준, 표준, 판단 기준</td></tr><tr><td class=\"w\">care for</td><td class=\"m\">~을 돌보다, ~을 보살피다, ~을 좋아하다</td></tr><tr><td class=\"w\">impact</td><td class=\"m\">영향을 주다, 충격을 주다</td></tr><tr><td class=\"w\">rather than</td><td class=\"m\">~라기보다는, ~대신에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 마주쳐왔지만</span><span class=\"en\"><b>we have encountered</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 반려동물 주인들을</span><span class=\"en\"><b>many dog owners</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 개를 목욕시키는</span><span class=\"en\"><b><span class=\"grammar-hl\">who bathe their dogs</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">계율을 지키듯이</span><span class=\"en\"><b><span class=\"grammar-hl\">religiously</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일주일에 여러 번</span><span class=\"en\"><b><span class=\"grammar-hl\">multiple times a week</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 피하고 싶기 때문에</span><span class=\"en\"><b>because they want <span class=\"grammar-hl\">to avoid</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘개’ 냄새를</span><span class=\"en\"><b><span class=\"grammar-hl\">the 'doggy' smell</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수의 피부과 전문의는</span><span class=\"en\"><b>but veterinary dermatologists</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러한 관행에 대해 경고하는데</span><span class=\"en\"><b><span class=\"grammar-hl\">warn against such practices</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 개의 피부에 좋지 않기 때문이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">as they are not good for a dog's skin</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 그들은 ‘개’ 냄새를 피하고 싶기 때문에 일주일에 여러 번 계율을 지키듯이 그들의 개를 목욕시키는 많은 반려동물 주인들을 마주쳐왔지만 수의 피부과 전문의는 그것들이 개의 피부에 좋지 않기 때문에 그러한 관행에 대해 경고한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞 문장의 원칙을 뒷받침하는 예시입니다. 보호자는 냄새를 줄이고 싶어 자주 씻기지만, 전문가의 관점에서는 그런 행동이 개의 피부 건강을 해칠 수 있습니다. 즉 보호자가 보기에는 깨끗하게 관리하는 행동처럼 보여도, 개의 몸에는 부담이 될 수 있다는 점을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who bathe their dogs religiously multiple times a week (관계대명사): who가 선행사 many dog owners를 수식하는 관계대명사절을 이끈다. who는 관계절 안에서 주어 역할을 하고, bathe가 동사, their dogs가 목적어이다.</div><div class=\"lec-gr-item\">to avoid the &#39;doggy&#39; smell (to부정사): to + 동사원형 avoid 구조로, want 뒤에서 want to V 형태를 이루며 want의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">warn against such practices (관용표현): warn against A는 ‘A를 하지 말라고 경고하다’라는 전치사 결합 표현이다. 동사 warn 뒤에 전치사 against + 명사구 such practices가 이어지는 구조이다.</div><div class=\"lec-gr-item\">as they are not good for a dog&#39;s skin (부사절): as는 이유를 나타내는 접속사로 쓰였고, 뒤에 주어 they + 동사 are가 있는 절이 이어져 앞 절의 warn against such practices를 이유 면에서 보충한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">encounter</td><td class=\"m\">마주치다, 접하다, 경험하다</td></tr><tr><td class=\"w\">bathe</td><td class=\"m\">목욕시키다, 목욕하다, 씻기다</td></tr><tr><td class=\"w\">religiously</td><td class=\"m\">꼬박꼬박, 철저히, 신앙적으로</td></tr><tr><td class=\"w\">multiple</td><td class=\"m\">여러 번의, 다수의, 복합적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 방지하다, 회피하다</td></tr><tr><td class=\"w\">veterinary</td><td class=\"m\">수의학의, 동물 진료의</td></tr><tr><td class=\"w\">warn against</td><td class=\"m\">~하지 말라고 경고하다, ~에 대해 주의를 주다</td></tr><tr><td class=\"w\">practice</td><td class=\"m\">관행, 습관, 실행, 연습</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 누군가가</span><span class=\"en\"><b><span class=\"grammar-hl\">If someone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정말로 걱정한다면</span><span class=\"en\"><b><span class=\"grammar-hl\">is really concerned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 개의 냄새에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">about their dog's smell</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 사용할 수 있고</span><span class=\"en\"><b>they can use</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물이 필요 없는 샴푸를</span><span class=\"en\"><b>waterless shampoo</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매일 충분히 그들의 개를 빗질해줄 수 있지만</span><span class=\"en\"><b>and thoroughly brush their dog every day</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">목욕은 기껏해야 일주일에 한두 번으로 제한해야 한다.</span><span class=\"en\"><b>but <span class=\"grammar-hl\">keep the baths down to once or twice a week</span> at most.</b></span></div></div><div class=\"lec-sent-ko\">만약 누군가가 그들의 개의 냄새에 대해 정말로 걱정한다면, 그들은 물이 필요 없는 샴푸를 사용할 수 있고 매일 충분히 그들의 개를 빗질해줄 수 있지만, 목욕은 기껏해야 일주일에 한두 번으로 제한해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞에서 제기된 문제에 대한 현실적인 대안을 제시합니다. 냄새가 걱정될 때 무조건 물목욕 횟수를 늘리는 대신, 피부에 부담이 덜한 방법을 쓰고 빗질로 털과 냄새를 관리하라는 의미입니다. 글쓴이는 보호자의 걱정을 인정하면서도, 개의 피부에 해가 덜 가는 관리 방식을 권합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If someone is really concerned about their dog&#39;s smell (조건절): If + 주어 someone + 동사 is 구조로 조건을 나타내는 부사절이다. 뒤의 they can use ...와 연결되어 ‘조건이 성립할 때 가능한 행동’을 나타낸다.</div><div class=\"lec-gr-item\">concerned (과거분사(형용사)): concerned가 be동사 is 뒤에서 주어 someone의 상태를 설명하는 보어로 쓰였다. 여기서는 명사를 수식하는 분사가 아니라 주격보어 역할의 형용사적 과거분사이다.</div><div class=\"lec-gr-item\">is really concerned about their dog&#39;s smell (관용표현): be concerned about A는 ‘A에 대해 걱정하다/염려하다’라는 고정적인 형용사+전치사 표현이다. be동사 + concerned + about + 명사구 구조이다.</div><div class=\"lec-gr-item\">keep the baths down to once or twice a week 5형식(SVOC) 구조: keep + 목적어(the baths) + 목적격보어(down to once or twice a week) 구조이다. 목적격보어가 목적어 the baths의 제한된 상태를 설명한다.</div><div class=\"lec-gr-item\">keep the baths down to once or twice a week (관용표현): keep A down to B는 ‘A를 B 수준으로 제한하다’라는 표현이다. A 자리에 the baths가 오고, B 자리에 once or twice a week가 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">thoroughly</td><td class=\"m\">철저히, 완전히, 꼼꼼히</td></tr><tr><td class=\"w\">at most</td><td class=\"m\">많아야, 기껏해야, 최대한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들이 가지고 있지 않는다면</span><span class=\"en\"><b><span class=\"grammar-hl\">Unless they have</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피부 상태를</span><span class=\"en\"><b><span class=\"grammar-hl\">a skin condition</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수의사가 약욕을 처방한</span><span class=\"en\"><b><span class=\"grammar-hl\">for which a vet has prescribed medicated baths</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 개는</span><span class=\"en\"><b>most dogs</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">주기적으로 목욕시켜질 ‘필요’가 없다.</span><span class=\"en\"><b>don't need <span class=\"grammar-hl\">to be bathed</span> <span class=\"grammar-hl\">on a regular basis</span>.</b></span></div></div><div class=\"lec-sent-ko\">그들이 수의사가 약욕을 처방한 피부 상태를 가지고 있지 않는다면, 대부분의 개는 주기적으로 목욕시켜질 ‘필요’가 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞의 조언을 더 일반적인 원칙으로 확장합니다. 특별한 피부 질환이 있어서 수의사의 지시를 받은 경우에는 치료 목적의 목욕이 필요할 수 있습니다. 하지만 보통의 개라면 사람이 생각하는 것처럼 자주 씻겨야 하는 동물이 아니며, 목욕 횟수는 건강 상태와 전문가의 판단에 맞추어야 한다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">for which a vet has prescribed medicated baths (관계대명사): 기본틀은 전치사 + 관계대명사 + S + V ... 구조이다. for which 뒤에 a vet has prescribed medicated baths라는 주어+동사가 갖춰진 절이 오며, 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절(완전문장)이 온다. 이 관계절은 앞의 a skin condition을 수식한다.</div><div class=\"lec-gr-item\">has prescribed (과거분사): has prescribed는 have/has + p.p. 형태의 현재완료 구조이다. has가 조동사 역할을 하고 prescribed가 과거분사로 쓰여 서술부를 이룬다.</div><div class=\"lec-gr-item\">medicated baths (과거분사(형용사)): medicated가 baths를 앞에서 수식한다. p.p. + N 구조로, baths가 ‘약물이 사용된/약용의’ 성격을 가진다는 뜻의 명사 수식 구조이다.</div><div class=\"lec-gr-item\">to be bathed (to부정사): need 뒤에 to + 동사원형 구조가 와서 need to V 형태를 이룬다. 여기서는 to be + p.p. 형태로 수동 의미의 to부정사구가 만들어져 dogs의 필요 내용을 나타낸다.</div><div class=\"lec-gr-item\">to be bathed (수동태): be동사 원형(be)+p.p.(bathed) 구조이다. bathe는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) to be bathed 형태로 쓴다. 기본구조: bathe + O(목적어).</div><div class=\"lec-gr-item\">on a regular basis (관용표현): on a regular basis는 ‘정기적으로’라는 뜻의 고정적인 전치사구 표현이다. 전치사 on + 명사구 a regular basis가 부사구처럼 쓰여 be bathed의 빈도를 나타낸다.</div><div class=\"lec-gr-item\">Unless they have a skin condition (부사절): Unless는 ‘~하지 않는 한’이라는 조건을 나타내는 접속사이다. Unless + 주어 they + 동사 have 구조의 조건절이 뒤의 most dogs don&#39;t need ... 전체를 조건으로 제한한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bathe</td><td class=\"m\">목욕시키다, 목욕하다, 씻기다</td></tr><tr><td class=\"w\">prescribe</td><td class=\"m\">처방하다, 규정하다, 지시하다</td></tr><tr><td class=\"w\">on a regular basis</td><td class=\"m\">정기적으로, 규칙적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">심지어 빽빽하고 무거운 털이 있는 개조차도</span><span class=\"en\"><b><span class=\"grammar-hl\">Even dogs with thick, heavy coats</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일반적으로</span><span class=\"en\"><b><span class=\"grammar-hl\">generally</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 6주에서 8주마다 목욕을 필요로 한다.</span><span class=\"en\"><b><span class=\"grammar-hl\">only need baths every 6 to 8 weeks</span>.</b></span></div></div><div class=\"lec-sent-ko\">심지어 빽빽하고 무거운 털이 있는 개조차도 일반적으로 오직 6주에서 8주마다 목욕을 필요로 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 결론을 강화하는 구체적 기준을 제시합니다. 털이 많고 관리가 어려워 보이는 개도 생각보다 자주 목욕할 필요가 없다는 점을 말합니다. 앞 문장에서 “대부분의 개는 정기적인 목욕이 필요하지 않다”고 한 내용을 실제 주기로 설명해, 보호자가 목욕 빈도를 조절할 수 있게 해 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Even dogs with thick, heavy coats 주어 구조: Even dogs가 문장의 주어이고, with thick, heavy coats는 전치사구로 dogs를 뒤에서 수식한다. Even은 포함·강조의 의미를 더하는 부사로 주어 전체를 부각한다.</div><div class=\"lec-gr-item\">generally only need baths every 6 to 8 weeks (기본문형): 주어 Even dogs with thick, heavy coats + 동사 need + 목적어 baths의 3형식(SVO) 구조이다. generally, only, every 6 to 8 weeks는 각각 빈도·제한·시간 간격을 나타내는 부사적 요소이다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>반려동물을 돌볼 때는 보호자의 욕구보다 동물에게 실제로 필요한지를 먼저 따져야 한다.</li><li>개 냄새를 없애려고 자주 목욕시키는 보호자가 많지만, 이는 개의 피부에 좋지 않을 수 있다.</li><li>냄새가 걱정되면 물 없는 샴푸나 매일 빗질 같은 덜 부담스러운 방법을 사용할 수 있다.</li><li>대부분의 개는 특별한 피부 질환이 없으면 자주 목욕할 필요가 없으며, 털이 많은 개도 보통 6~8주에 한 번이면 충분하다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Dog care should prioritize dogs’ actual needs, and excessive bathing should be avoided to protect their skin health.</div>\n              <div class=\"lec-final-sum-ko\">개의 돌봄은 실제 필요를 우선해야 하며, 피부 건강을 보호하기 위해 과도한 목욕은 피해야 한다.</div></div></div>"],"segs":[[{"audio":"./35_audio/1.mp3","hl":null}],[{"audio":"./35_audio/2.mp3","hl":null}],[{"audio":"./35_audio/3.mp3","hl":null},{"audio":"./35_audio/4.mp3","hl":"stage-0"},{"audio":"./35_audio/5.mp3","hl":"stage-1"},{"audio":"./35_audio/6.mp3","hl":"stage-2"},{"audio":"./35_audio/7.mp3","hl":"stage-3"}],[{"audio":"./35_audio/8.mp3","hl":null}],[{"audio":"./35_audio/9.mp3","hl":"main"},{"audio":"./35_audio/10.mp3","hl":"meaning"},{"audio":"./35_audio/11.mp3","hl":"grammar"}],[{"audio":"./35_audio/12.mp3","hl":"main"},{"audio":"./35_audio/13.mp3","hl":"meaning"},{"audio":"./35_audio/14.mp3","hl":"grammar"}],[{"audio":"./35_audio/15.mp3","hl":"main"},{"audio":"./35_audio/16.mp3","hl":"meaning"},{"audio":"./35_audio/17.mp3","hl":"grammar"}],[{"audio":"./35_audio/18.mp3","hl":"main"},{"audio":"./35_audio/19.mp3","hl":"meaning"},{"audio":"./35_audio/20.mp3","hl":"grammar"}],[{"audio":"./35_audio/21.mp3","hl":"main"},{"audio":"./35_audio/22.mp3","hl":"meaning"},{"audio":"./35_audio/23.mp3","hl":"grammar"}],[{"audio":"./35_audio/24.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
