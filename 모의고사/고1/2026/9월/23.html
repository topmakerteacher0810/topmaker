)이 크면 병충해나 기후 변화가 닥쳤을 때 일부는 살아남을 수 있지만, 모두 똑같은 품종이면 한 번에 큰 피해를 입을 수 있어요. 이 원리는 신체적 특징뿐 아니라 인간의 사고방식, 성격, 문제 해결 방식의 다양성을 뜻하는 인지적 다양성(Cognitive Diversity)에도 비유적으로 적용될 수 있습니다. 즉, 어떤 사람은 분석에 강하고, 어떤 사람은 창의적 상상에 강하며, 또 어떤 사람은 공동체적 판단에 강한 것처럼 다양한 마음의 방식은 사회가 위기 상황에 더 유연하게 대응하게 해 줍니다. 또한 진화가능성(Evolvability)은 한 종이 변화하는 환경 속에서 계속 적응하고 진화할 수 있는 잠재력을 뜻하며, 다양성은 이 가능성을 높이는 중요한 바탕이 됩니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01다양성의 필요성</div><ul><li>인류에게 여러 종류의 마음이 중요한 이유는 다양성이 종의 생존에 필수적이기 때문이다.</li><li>인간은 다양한 마음(minds)을 가질 필요가 있음</li><li>종의 생존(survival)은 변이(variation)에 크게 의존함</li><li>핵심 키워드: 변이(variation)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02다윈의 통찰</div><ul><li>다윈은 자연선택이 작동하려면 변이가 먼저 존재해야 한다고 보았다.</li><li>찰스 다윈(Charles Darwin)의 중요한 통찰 제시</li><li>자연선택(natural selection)의 전제 조건은 변이임</li><li>변이가 있어야 환경 변화에 적응할 가능성이 생김</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03환경 재난과 생존</div><ul><li>식량 부족이나 기온 상승 같은 큰 변화가 생기면 변이가 적은 종은 멸종할 위험이 커진다.</li><li>식량 공급(food supply)의 급격한 감소 가능성</li><li>온도(temperature)의 큰 상승 같은 재난 발생 가능</li><li>변이가 큰 종은 새 환경에 맞는 생존자(survivors)를 남길 가능성이 높음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04인간 마음의 다양성</div><ul><li>동물의 몸에서 보이는 변이 원리는 인간의 마음에도 적용된다.</li><li>다윈은 동물의 신체(bodies)에서 변이를 관찰함</li><li>같은 원리가 인간의 마음(human minds)에도 적용됨</li><li>모두 같은 마음만 가졌다면 재난 때 멸종(extinction) 위험이 커짐</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05진화 가능성 보존</div><ul><li>인류는 문화 안팎에서 다양한 마음을 지니기 때문에 멸종 가능성이 줄고 진화 가능성이 유지된다.</li><li>한 문화(single culture) 안에서도 다양한 마음이 존재함</li><li>여러 문화(across cultures) 사이에서도 마음의 차이가 있음</li><li>이러한 다양성은 종의 진화 가능성(evolvability)을 보존함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variation</td><td class=\"m\">변화, 차이, 변이</td></tr><tr><td class=\"w\">critical</td><td class=\"m\">중요한, 결정적인, 위기의</td></tr><tr><td class=\"w\">survival</td><td class=\"m\">생존, 살아남음</td></tr><tr><td class=\"w\">species</td><td class=\"m\">종, 생물의 종류</td></tr><tr><td class=\"w\">insight</td><td class=\"m\">통찰, 이해, 식견</td></tr><tr><td class=\"w\">prerequisite</td><td class=\"m\">전제 조건, 필수 조건</td></tr><tr><td class=\"w\">natural selection</td><td class=\"m\">자연 선택, 자연 도태</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경, 주변 상황, 서식지</td></tr><tr><td class=\"w\">catastrophic</td><td class=\"m\">재앙적인, 파멸적인, 대참사의</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wipe out</td><td class=\"m\">완전히 파괴하다, 없애다, 전멸시키다</td></tr><tr><td class=\"w\">be likely to</td><td class=\"m\">~할 가능성이 있다, ~할 것 같다</td></tr><tr><td class=\"w\">be suited for</td><td class=\"m\">~에 적합하다, ~에 알맞다</td></tr><tr><td class=\"w\">principle</td><td class=\"m\">원리, 원칙, 법칙</td></tr><tr><td class=\"w\">apply to</td><td class=\"m\">~에 적용되다, ~와 관련되다</td></tr><tr><td class=\"w\">extinct</td><td class=\"m\">멸종된, 사라진</td></tr><tr><td class=\"w\">both ... and ...</td><td class=\"m\">~와 … 둘 다, ~뿐만 아니라 …도</td></tr><tr><td class=\"w\">preserve</td><td class=\"m\">보존하다, 지키다, 유지하다</td></tr><tr><td class=\"w\">evolvability</td><td class=\"m\">진화 가능성, 진화할 수 있는 능력</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 중요하다</span><span class=\"en\"><b><span class=\"grammar-hl\">It's important</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간이 다양한 유형의 마음을 갖는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">for humans to have many kinds of minds</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 변이는 결정적이기 때문이다</span><span class=\"en\"><b><span class=\"grammar-hl\">because variation is critical</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">종의 생존에</span><span class=\"en\"><b><span class=\"grammar-hl\">for the survival of a species</span>.</b></span></div></div><div class=\"lec-sent-ko\">인간이 다양한 유형의 마음을 갖는 것은 중요한데, 변이는 종의 생존에 결정적이기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글 전체의 핵심 주장을 먼저 제시합니다. 여기서 글쓴이는 인간들 사이에 생각하는 방식, 느끼는 방식, 문제를 해결하는 방식이 다양해야 한다고 말합니다. 생물학적으로 한 종 안에 차이가 많을수록 갑작스러운 환경 변화에 대응할 가능성이 커지기 때문에, 인간의 정신적 다양성도 종의 생존과 연결된다는 논리를 시작하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It&#39;s important for humans to have many kinds of minds (가주어): 진주어: It이 형식상 주어이고, 진짜 주어는 뒤의 to부정사구 for humans to have many kinds of minds이다. 구조는 It + be동사 + 형용사 + for 의미상 주어 + toV 형태이다.</div><div class=\"lec-gr-item\">to have many kinds of minds (to부정사): to have가 명사적 용법으로 쓰여 문장 전체에서 진주어 역할을 한다. for humans는 to부정사의 의미상 주어를 나타낸다.</div><div class=\"lec-gr-item\">because variation is critical for the survival of a species (부사절): because + S + V 구조로, 주절의 내용에 대한 이유를 나타내는 종속절이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variation</td><td class=\"m\">변화, 차이, 변이</td></tr><tr><td class=\"w\">critical</td><td class=\"m\">중요한, 결정적인, 위기의</td></tr><tr><td class=\"w\">survival</td><td class=\"m\">생존, 살아남음</td></tr><tr><td class=\"w\">species</td><td class=\"m\">종, 생물의 종류</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Charles Darwin의 가장 위대한 통찰 중 하나는</span><span class=\"en\"><b><span class=\"grammar-hl\">One of Charles Darwin's greatest insights</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">변이가 선행 조건이라는 점이었다</span><span class=\"en\"><b>was <span class=\"grammar-hl\">that variation is a prerequisite</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연선택이 작동하기 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">for natural selection to work</span>.</b></span></div></div><div class=\"lec-sent-ko\">Charles Darwin의 가장 위대한 통찰 중 하나는 변이가 자연선택이 작동하기 위한 선행 조건이라는 점이었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 주장을 다윈의 이론으로 뒷받침하는 문장입니다. 자연선택은 어떤 환경에서 더 잘 살아남는 개체가 후손을 남기는 과정인데, 개체들 사이에 차이가 있어야 그중 유리한 특징을 가진 개체가 선택될 수 있습니다. 글쓴이는 인간 마음의 다양성을 설명하기 전에, 생물 진화의 기본 원리를 먼저 깔아 둡니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that variation is a prerequisite for natural selection to work (명사절): that + S + V 구조의 that절이 be동사 was 뒤에서 주격보어 역할을 한다. 여기서 that절은 앞 명사의 동격이 아니라, 주어 One of Charles Darwin&#39;s greatest insights의 내용을 보어로 설명하는 명사절이다.</div><div class=\"lec-gr-item\">to work (to부정사): to work가 for natural selection 뒤에 이어져 for + 의미상 주어 + toV 구조를 이룬다. natural selection이 to work의 의미상 주어이고, 전체는 prerequisite의 내용을 보충한다.</div><div class=\"lec-gr-item\">One of Charles Darwin&#39;s greatest insights 주어 구조: One of + 복수명사 형태로 ‘여러 통찰 중 하나’라는 의미를 만들며, 핵심 주어는 One이므로 단수 동사 was와 연결된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variation</td><td class=\"m\">변화, 차이, 변이</td></tr><tr><td class=\"w\">insight</td><td class=\"m\">통찰, 이해, 식견</td></tr><tr><td class=\"w\">prerequisite</td><td class=\"m\">전제 조건, 필수 조건</td></tr><tr><td class=\"w\">natural selection</td><td class=\"m\">자연 선택, 자연 도태</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것에 대해 생각해 보라:</span><span class=\"en\"><b>Think about it:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만약 환경에 거대한 변화가 있다면</span><span class=\"en\"><b><span class=\"grammar-hl\">If there's a huge change in the environment</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">식량 공급에서의 재앙적 감소와 같은</span><span class=\"en\"><b>like a catastrophic drop in the food supply</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 기온에서의 큰 상승과 같은</span><span class=\"en\"><b>or a big increase in temperature,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">많은 변이가 없는 종은</span><span class=\"en\"><b>a species without much variation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">완전히 사라질 수도 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">might be completely wiped out</span>.</b></span></div></div><div class=\"lec-sent-ko\">생각해 보라. 만약에 식량 공급에서의 재앙적 감소나 기온에서의 큰 상승과 같은 환경에 거대한 변화가 있다면, 많은 변이가 없는 종은 완전히 사라질 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞에서 말한 자연선택의 원리를 구체적인 상황으로 풀어 설명합니다. 먹이가 갑자기 줄거나 기온이 크게 올라가면, 모든 개체가 비슷한 특성을 가진 종은 변화된 조건을 견딜 개체를 찾기 어렵습니다. 그래서 글쓴이는 다양성이 부족한 집단이 재난 앞에서 얼마나 취약한지를 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If there&#39;s a huge change in the environment (조건절): If + S + V 구조로, 주절의 상황이 성립하는 조건을 나타내는 부사절이다. there is 구문은 there를 형식상 주어처럼 두고 뒤의 a huge change가 실제 존재하는 대상을 나타낸다.</div><div class=\"lec-gr-item\">might be completely wiped out (수동태): 조동사 might 뒤에 be동사 원형(be)+p.p.(wiped out)가 온 수동구조이다. wipe out는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) might be completely wiped out 형태로 쓴다. 기본구조: wipe out + O(목적어).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variation</td><td class=\"m\">변화, 차이, 변이</td></tr><tr><td class=\"w\">species</td><td class=\"m\">종, 생물의 종류</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경, 주변 상황, 서식지</td></tr><tr><td class=\"w\">catastrophic</td><td class=\"m\">재앙적인, 파멸적인, 대참사의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">변이가 큰 종은</span><span class=\"en\"><b>A species with great variation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">몇몇 생존자들을 가질 가능성이 더 크다</span><span class=\"en\"><b><span class=\"grammar-hl\">will more likely have some survivors</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 재앙 이후에도</span><span class=\"en\"><b>after any catastrophe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">― 그 구성원들</span><span class=\"en\"><b>― the members</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잘 적응한</span><span class=\"en\"><b><span class=\"grammar-hl\">who are well suited</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 환경에</span><span class=\"en\"><b><span class=\"grammar-hl\">for the new environment</span>.</b></span></div></div><div class=\"lec-sent-ko\">변이가 큰 종은 어떤 재앙 이후에도 몇몇 생존자들 즉 새로운 환경에 잘 적응한 구성원들을 가질 가능성이 더 크다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 위험한 경우와 대비되는 설명입니다. 같은 종 안에서도 특성이 다양하면, 재앙이 닥쳤을 때 그중 일부는 새로운 환경에 맞아 살아남을 수 있습니다. 글쓴이는 여기서 다양성이 단순히 차이가 많다는 의미를 넘어, 위기 상황에서 종 전체가 이어질 수 있게 해 주는 안전장치라고 말하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who are well suited for the new environment (관계대명사): who가 선행사 the members를 수식하는 관계대명사절을 이끈다. who는 관계절 안에서 주어 역할을 하며, 구조는 선행사 + who + V 형태이다.</div><div class=\"lec-gr-item\">are well suited for the new environment (수동태): be동사(are)+p.p.(suited) 구조이다. suit는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) are well suited 형태로 쓴다. 기본구조: suit + O(목적어), 또는 suit + O + for/to N 구조로 ‘O가 N에 맞다’의 패턴을 이룬다.</div><div class=\"lec-gr-item\">will more likely have some survivors 핵심 문장 구조: 주어 A species with great variation 뒤에 조동사 will과 일반동사 have가 이어지는 S + 조동사 + V + O 구조이다. more likely는 조동사와 본동사 사이에서 가능성의 정도를 나타내는 부사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variation</td><td class=\"m\">변화, 차이, 변이</td></tr><tr><td class=\"w\">species</td><td class=\"m\">종, 생물의 종류</td></tr><tr><td class=\"w\">environment</td><td class=\"m\">환경, 주변 상황, 서식지</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Darwin은</span><span class=\"en\"><b><span class=\"grammar-hl\">Darwin</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">변이를 관찰했으며</span><span class=\"en\"><b><span class=\"grammar-hl\">observed variation</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물의 몸에서</span><span class=\"en\"><b><span class=\"grammar-hl\">in the bodies of animals</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 동일한 원리는</span><span class=\"en\"><b>and the same principle</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적용된다</span><span class=\"en\"><b><span class=\"grammar-hl\">applies</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간의 마음에도</span><span class=\"en\"><b><span class=\"grammar-hl\">to human minds</span>.</b></span></div></div><div class=\"lec-sent-ko\">Darwin은 동물의 몸에서 변이를 관찰했으며, 동일한 원리는 인간의 마음에도 적용된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 논의를 동물의 신체적 다양성에서 인간의 정신적 다양성으로 확장합니다. 다윈은 부리 모양, 몸집, 생김새 같은 신체 차이가 생존에 영향을 준다는 점을 보았고, 글쓴이는 그 원리를 인간의 사고방식에도 적용합니다. 즉 사람마다 판단하고 배우고 적응하는 방식이 다른 것도 생존 가능성과 관련될 수 있다는 흐름으로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Darwin observed variation in the bodies of animals 핵심 문장 구조: Darwin이 주어, observed가 타동사, variation이 목적어인 S + V + O 구조이다. in the bodies of animals는 variation이 나타난 위치를 보충하는 전치사구이다.</div><div class=\"lec-gr-item\">applies to human minds (관용표현): apply to는 ‘~에 적용되다/~와 관련되다’라는 동사구 표현이다. 구조는 apply to + N이며, 여기서는 the same principle이 주어이고 to human minds가 적용 대상을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variation</td><td class=\"m\">변화, 차이, 변이</td></tr><tr><td class=\"w\">principle</td><td class=\"m\">원리, 원칙, 법칙</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 우리가 모두 같은 유형의 마음을 가지고 있다면</span><span class=\"en\"><b><span class=\"grammar-hl\">If we all had the same kind of mind</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">― 즉 인간 본성이 하나뿐이라면 ―</span><span class=\"en\"><b>― <span class=\"grammar-hl\">if there were only one human nature</span> ―</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그러면</span><span class=\"en\"><b>then</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">재난이 닥쳤을 때</span><span class=\"en\"><b>when disaster struck,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 멸종할지도 모른다</span><span class=\"en\"><b><span class=\"grammar-hl\">we might become extinct</span>.</b></span></div></div><div class=\"lec-sent-ko\">만약 우리가 모두 같은 유형의 마음을 가지고 있고 인간 본성이 하나뿐이라면, 재난이 닥쳤을 때 우리는 멸종할지도 모른다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 제시한 원리를 인간에게 적용한 가상의 상황입니다. 모든 인간이 똑같이 생각하고 똑같이 행동한다면, 위기가 왔을 때 모두가 같은 방식으로 실패할 위험이 커집니다. 글쓴이는 인간 내부의 정신적 차이가 위기 대응 방식의 폭을 넓혀 주기 때문에 중요하다는 점을 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">If we all had the same kind of mind (조건절): If + S + V 구조의 부사절이다. had는 현재 사실과 반대되는 가정의 의미를 나타내는 과거형으로 쓰였고, 주절의 might become과 연결된다.</div><div class=\"lec-gr-item\">if there were only one human nature (가정법): if절에서 there were가 쓰여 현재 사실과 반대되는 가정적 상황을 나타낸다. there were는 존재 구문이고, only one human nature가 실제 의미상 주어 역할을 한다.</div><div class=\"lec-gr-item\">we might become extinct 핵심 문장 구조: 주어 we 뒤에 조동사 might와 연결동사 become, 주격보어 extinct가 이어지는 S + 조동사 + V + C 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">extinct</td><td class=\"m\">멸종된, 사라진</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다행히도</span><span class=\"en\"><b>Thankfully,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 종은 다양한 유형의 마음을 지니고 있다</span><span class=\"en\"><b>our species has many kinds of minds,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단일 문화 내에서도</span><span class=\"en\"><b><span class=\"grammar-hl\">both within a single culture</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 문화 간에도</span><span class=\"en\"><b><span class=\"grammar-hl\">and across cultures</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 우리는 가능성이 더 낮다</span><span class=\"en\"><b>so <span class=\"grammar-hl\">we're less likely</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사라질</span><span class=\"en\"><b><span class=\"grammar-hl\">to be wiped out</span>.</b></span></div></div><div class=\"lec-sent-ko\">다행히도 우리 종은 단일 문화 내와 문화 간 둘 다에서 다양한 유형의 마음을 지니고 있어서 우리는 사라질 가능성이 더 낮다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞의 가정적 위험에서 현실의 긍정적 조건으로 전환합니다. 사람들은 같은 사회 안에서도 성향과 사고방식이 다르고, 문화가 달라지면 세상을 이해하고 문제를 푸는 방식도 더 다양해집니다. 글쓴이는 이런 정신적·문화적 다양성이 인간 전체의 생존 가능성을 높인다고 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">both within a single culture and across cultures 상관접속 표현: both A and B 구조로, within a single culture와 across cultures라는 두 전치사구를 병렬로 연결한다.</div><div class=\"lec-gr-item\">we&#39;re less likely to be wiped out (관용표현): be likely toV는 ‘~할 가능성이 있다’라는 형용사구 패턴이다. 여기서는 less가 likely를 수식해 가능성이 더 낮다는 구조를 만든다.</div><div class=\"lec-gr-item\">to be wiped out (to부정사): to be wiped out은 to + 동사원형 구조이며, likely 뒤에서 형용사 보충어 역할을 한다. 내부에 be + p.p.가 포함된 수동부정사 구조이다.</div><div class=\"lec-gr-item\">to be wiped out (수동태): to부정사 안에서 be동사 원형(be)+p.p.(wiped out)가 결합한 수동구조이다. wipe out는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) to be wiped out 형태로 쓴다. 기본구조: wipe out + O(목적어).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">species</td><td class=\"m\">종, 생물의 종류</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 변이는</span><span class=\"en\"><b><span class=\"grammar-hl\">This variation</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 종의 진화 가능성을 보존한다</span><span class=\"en\"><b><span class=\"grammar-hl\">preserves the evolvability of our species</span>.</b></span></div></div><div class=\"lec-sent-ko\">이러한 변이는 우리 종의 진화 가능성을 보존한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장은 글 전체의 결론입니다. 인간에게 다양한 마음이 있기 때문에 새로운 환경이 닥쳐도 일부 사람들은 새로운 방식으로 적응하고, 그 적응이 다음 변화의 출발점이 될 수 있습니다. 글쓴이는 인간의 다양성이 현재의 생존뿐 아니라 앞으로도 계속 변화하고 적응할 수 있는 능력을 지켜 준다고 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">This variation preserves the evolvability of our species 핵심 문장 구조: This variation이 주어, preserves가 타동사, the evolvability of our species가 목적어인 S + V + O 구조이다. of our species는 evolvability를 수식하는 전치사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">variation</td><td class=\"m\">변화, 차이, 변이</td></tr><tr><td class=\"w\">species</td><td class=\"m\">종, 생물의 종류</td></tr><tr><td class=\"w\">preserve</td><td class=\"m\">보존하다, 지키다, 유지하다</td></tr><tr><td class=\"w\">evolvability</td><td class=\"m\">진화 가능성, 진화할 수 있는 능력</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간에게 여러 종류의 마음이 있는 것은 종의 생존에 중요하다.</li><li>다윈의 자연선택 원리에 따르면, 다양성이 있어야 변화한 환경에 맞는 개체가 살아남을 수 있다.</li><li>다양성이 적은 종은 큰 재앙이 닥치면 모두 사라질 위험이 크다.</li><li>반대로 다양성이 큰 종은 일부 구성원이 새로운 환경에 맞아 살아남을 가능성이 높다.</li><li>인간의 정신적·문화적 다양성은 우리 종이 멸종을 피하고 계속 진화할 수 있게 해 준다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Mental variation helps humans survive environmental change by preserving the species’ ability to adapt and evolve.</div>\n              <div class=\"lec-final-sum-ko\">정신적 다양성은 종의 적응과 진화 능력을 보존함으로써 인간이 환경 변화에서 살아남도록 돕는다.</div></div></div>"],"segs":[[{"audio":"./23_audio/1.mp3","hl":null}],[{"audio":"./23_audio/2.mp3","hl":null}],[{"audio":"./23_audio/3.mp3","hl":null},{"audio":"./23_audio/4.mp3","hl":"stage-0"},{"audio":"./23_audio/5.mp3","hl":"stage-1"},{"audio":"./23_audio/6.mp3","hl":"stage-2"},{"audio":"./23_audio/7.mp3","hl":"stage-3"},{"audio":"./23_audio/8.mp3","hl":"stage-4"}],[{"audio":"./23_audio/9.mp3","hl":null}],[{"audio":"./23_audio/10.mp3","hl":"main"},{"audio":"./23_audio/11.mp3","hl":"meaning"},{"audio":"./23_audio/12.mp3","hl":"grammar"}],[{"audio":"./23_audio/13.mp3","hl":"main"},{"audio":"./23_audio/14.mp3","hl":"meaning"},{"audio":"./23_audio/15.mp3","hl":"grammar"}],[{"audio":"./23_audio/16.mp3","hl":"main"},{"audio":"./23_audio/17.mp3","hl":"meaning"},{"audio":"./23_audio/18.mp3","hl":"grammar"}],[{"audio":"./23_audio/19.mp3","hl":"main"},{"audio":"./23_audio/20.mp3","hl":"m
