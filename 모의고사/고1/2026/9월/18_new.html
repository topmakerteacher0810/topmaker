@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 9월 고1 모의고사 18번","audioDir":"2026-09-g1-18_audio","preview":false,"count":38,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">18번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 9월 고1 모의고사\u003c/div>\u003ch1>Notification of School Field Trip Location Change Due to Cold Weather\u003c/h1>\u003ch2>한파로 인한 현장 체험 학습 장소 변경 안내\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>금요일로 예정된 현장 학습이 \u003cb class=\"key\">기온 \u003c/b>\u003cb class=\"key\">급강하\u003c/b>로 인한 학생 안전 우려 때문에 기존 드림랜드 놀이공원에서 실내인 \u003cb class=\"key\">시립 \u003c/b>\u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">박물관\u003c/b>으로 변경되었습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The school field trip destination was changed from an outdoor amusement park to an indoor science museum to ensure student safety during extreme cold.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 고등학교 일학년 구월 모의고사 열여덟 번째 지문을 함께 공부해보겠습니다. 이 글은 학교에서 학부모님들께 보내는 가정통신문 형식의 안내문이에요. 요약하자면, 갑작스러운 추위 때문에 학생들의 안전을 위해 현장 체험 학습 장소를 변경한다는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">학교에서 진행하는 \u003cb class=\"key\">현장 \u003c/b>\u003cb class=\"key\">체험 \u003c/b>\u003cb class=\"key\">학습\u003c/b>(field trip)은 교실 밖에서 직접 보고 배우는 교육 활동입니다. 하지만 야외 활동의 경우 \u003cb class=\"key\">기상 \u003c/b>\u003cb class=\"key\">예보\u003c/b>(weather forecast)에 매우 민감할 수밖에 없는데, 특히 \u003cb class=\"key\">저온 \u003c/b>\u003cb class=\"key\">현상\u003c/b>(low temperatures)은 학생들의 건강을 해칠 수 있습니다. 이는 마치 친구들과 야외 농구 시합을 약속했다가 갑작스러운 비 때문에 실내 체육관으로 장소를 바꾸는 \u003cb class=\"key\">플랜 \u003c/b>\u003cb class=\"key\">B\u003c/b>의 상황과 같습니다. 학교 측은 교육 효과와 학생의 \u003cb class=\"key\">안전\u003c/b>(safety)이라는 두 마리 토끼를 잡기 위해 장소를 신중하게 변경하게 됩니다.\u003c/div>","segs":[{"n":2,"text":"우리 고등학생 친구들도 체험 학습 많이 가죠? 보통 field trip이라고 부르는데, 야외 활동은 날씨의 영향을 정말 많이 받습니다. 특히 이번 지문처럼 기온이 너무 낮을 때는 저온 현상, 즉 low temperatures가 큰 문제가 됩니다. 여러분이 친구들과 밖에서 축구를 하기로 했는데 갑자기 한파가 몰아쳐서 실내 PC방이나 카페로 장소를 옮기는 상황을 생각하면 이해가 빠를 거예요. 학교도 학생들의 안전과 교육적 목적을 모두 고려해서 장소를 결정하게 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>학부모님께 평소의 협조에 대한 \u003cb class=\"key\">감사\u003c/b>를 전하며 이번 금요일에 예정된 \u003cb class=\"key\">현장 \u003c/b>\u003cb class=\"key\">학습\u003c/b> 정보를 공유하고자 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문제 발생\u003csmall>전환 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>원래 드림랜드 놀이공원에 가려 했으나 \u003cb class=\"key\">기상 \u003c/b>\u003cb class=\"key\">예보\u003c/b>에 따르면 심한 \u003cb class=\"key\">추위\u003c/b>가 예상되어 학생들에게 위험할 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>해결책 및 변경\u003csmall>주장 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>신중한 검토 끝에 장소를 \u003cb class=\"key\">시립 \u003c/b>\u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">박물관\u003c/b>으로 변경하였으며, 그곳에서 체험 활동과 \u003cb class=\"key\">전시 \u003c/b>\u003cb class=\"key\">관람\u003c/b>을 진행할 예정입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>마무리\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>학부모님의 너그러운 \u003cb class=\"key\">이해\u003c/b>를 부탁드리며 교감의 서명으로 글을 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 인사로 시작해서 문제 상황을 설명하고 최종 결정을 전달하는 순서로 흐릅니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 학부모님들께 평소의 협조에 감사 인사를 전하며, 이번 금요일 현장 학습에 대한 새로운 정보를 알려주겠다고 말하며 시작합니다.","hl":"f0"},{"n":5,"text":"세 번째 문장부터 다섯 번째 문장까지는 원래 계획과 문제점을 이야기해요. 원래는 드림랜드 놀이공원에 가려고 했지만, 기상 예보에서 매우 낮은 기온이 예상되어 야외 활동이 학생들에게 안전하지 않을 수 있다는 점을 짚어줍니다.","hl":"f1"},{"n":6,"text":"여섯 번째와 일곱 번째 문장은 해결책입니다. 신중한 고려 끝에 장소를 시립 과학 박물관으로 변경했고, 그곳에서 전시 관람과 직접 해보는 hands on 활동을 할 것이라고 설명합니다.","hl":"f2"},{"n":7,"text":"마지막 여덟 번째와 아홉 번째 문장에서는 학부모님들께 너그러운 이해를 구하며 교감 선생님의 서명으로 격식 있게 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 중반부인 여섯 번째 문장에서 \u003cb class=\"key\">장소 \u003c/b>\u003cb class=\"key\">변경\u003c/b>이라는 핵심 결정사항이 제시됩니다. 초반에 기존 계획을 말하고, 중반에 \u003cb class=\"key\">추위\u003c/b>라는 문제점을 제시한 뒤 해결책으로 새로운 장소를 제안하는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b> 구조를 가집니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (4)\u003c/b>\u003cspan>문제점 제시 및 흐름 반전\u003c/span>\u003cb>After careful consideration (6)\u003c/b>\u003cspan>결론 도출 과정 강조\u003c/span>\u003cb>Instead of (7)\u003c/b>\u003cspan>대조를 통한 대안 명시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">outdoor field trip\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">outdoor\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">change the location\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Instead of the amusement park\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">City Science Museum\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Dreamland Amusement Park\u003c/th>\u003cth>City Science Museum\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Outdoor (야외)\u003c/td>\u003ctd>Indoor (실내)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Potentially unsafe (위험 가능성)\u003c/td>\u003ctd>Guided/Hands-on (교육적/안전)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결이라는 구조로 되어 있어요. 기상 악화라는 문제가 발생하자  격식 있는 인사말을 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 appreciate\u003c/span> : appreciate [타동사] + your support and cooperation [목적어] : \"감사하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : support [명사1] + and [접속사] + cooperation [명사2] : \"지원과 협조\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Dear Parents and Guardians, 학부모님 및 보호자님께. We appreciate your support and cooperation, 우리는 귀하의 지원과 협조에 감사드립니다. in our school programs, 우리 학교 프로그램에 대한.. 이 문장 전체를 해석하면, 학부모님 및 보호자님께, 우리 학교 프로그램에 대한 여러분의 지원과 협조에 감사드립니다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 정중한 인사로 글을 시작하고 있어요. 학교 운영을 도와주시는 학부모님들께 감사를 표하며 좋은 관계를 형성하는 도입부입니다.","hl":"mn"},{"n":14,"text":"여기서 appreciate는 타동사로 쓰여서 뒤에 your support와 cooperation이라는 목적어를 바로 가집니다. 두 명사가 and로 묶여서 병렬 구조를 이루고 있는 점도 확인해 보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 ~하고 싶습니다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요한 정보를 공유하는 것을\u003c/span>\u003cspan class=\"en\">share important information\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이번 주 금요일 학교 현장 학습에 관한.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">regarding\u003c/span> this Friday's school field trip.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이번 주 금요일 학교 현장 학습에 관한 중요한 정보를 공유하고자 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이번 글을 쓰게 된 구체적인 \u003cb class=\"key\">목적\u003c/b>을 제시하는 문장입니다. 예정된 \u003cb class=\"key\">현장 \u003c/b>\u003cb class=\"key\">학습\u003c/b>에 대해 알릴 사항이 있음을 정중하게 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 관용 표현\u003c/span> : would like to [정중한 표현] + share [동사원형] : \"~하고 싶다, ~하고자 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 역할을 하는 분사\u003c/span> : regarding [전치사] + this Friday's school field trip [명사구] : \"~에 관한\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"We would like to, 우리는 ~하고 싶습니다. share important information, 중요한 정보를 공유하는 것을. regarding this Friday's school field trip, 이번 주 금요일 학교 현장 학습에 관한.. 이 문장 전체를 해석하면, 이번 주 금요일 학교 현장 학습에 관한 중요한 정보를 공유하고자 합니다.","hl":"m"},{"n":16,"text":"두 번째 문장은 글의 핵심 용건을 꺼내는 부분입니다. 이번 금요일에 있을 현장 학습에 대해 알려줄 중요한 정보가 있다는 것을 시사하고 있죠.","hl":"mn"},{"n":17,"text":"첫 번째 포인트인 would like to는 정중하게 자신의 의사를 밝힐 때 쓰는 아주 중요한 표현입니다. 두 번째로 regarding은 무엇에 관한 정보인지를 설명해 주는 전치사처럼 이해하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 학교는\u003c/span>\u003cspan class=\"en\">Our school\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원래 계획했었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">originally \u003c/span>\u003cspan class=\"tgt\">planned\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야외 현장 학습을\u003c/span>\u003cspan class=\"en\">an \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">outdoor\u003c/span> field trip\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">드림랜드 놀이공원으로의.\u003c/span>\u003cspan class=\"en\">to Dreamland Amusement Park.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 학교는 원래 드림랜드 놀이공원으로의 야외 현장 학습을 계획했었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 변경 전의 원래 \u003cb class=\"key\">계획\u003c/b>을 설명하는 문장입니다. 이후 문장에서 언급될 \u003cb class=\"key\">변동 \u003c/b>\u003cb class=\"key\">사항\u003c/b>과 대조를 이루기 위한 배경 정보를 제공합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료 시제\u003c/span> : had [조동사] + planned [과거분사] : \"원래 계획했었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 명사 수식\u003c/span> : outdoor [형용사] + field trip [명사] : \"야외의\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Our school, 우리 학교는. had originally planned, 원래 계획했었습니다. an outdoor field trip, 야외 현장 학습을. to Dreamland Amusement Park, 드림랜드 놀이공원으로의.. 이 문장 전체를 해석하면, 우리 학교는 원래 드림랜드 놀이공원으로의 야외 현장 학습을 계획했었습니다.","hl":"m"},{"n":19,"text":"세 번째 문장에서는 처음에 세웠던 계획을 말해주고 있어요. 원래는 드림랜드 놀이공원이라는 야외 장소로 가려고 했었다는 사실을 전달합니다.","hl":"mn"},{"n":20,"text":"첫 번째로 had planned라는 과거완료 시제를 쓴 이유를 아는 것이 중요해요. 계획을 바꾼 과거의 시점보다 더 이전에 세웠던 원래 계획이라는 점을 분명히 하기 위해서죠. 두 번째로 outdoor는 야외라는 뜻으로 현장 학습의 성격을 잘 보여주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최신 일기 예보에 따르면,\u003c/span>\u003cspan class=\"en\">according to the latest weather forecast,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 낮은 기온이\u003c/span>\u003cspan class=\"en\">extremely low temperatures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">금요일 내내 예상됩니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">expected\u003c/span> throughout Friday.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 최신 일기 예보에 따르면, 금요일 내내 매우 낮은 기온이 예상됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 원래 계획했던 야외 활동을 변경해야 하는 결정적인 \u003cb class=\"key\">날씨 \u003c/b>\u003cb class=\"key\">요인\u003c/b>과 그 \u003cb class=\"key\">이유\u003c/b>를 설명하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + p.p.)\u003c/span> : extremely low temperatures [주어] + are [be동사] + expected [과거분사] : \"예상됩니다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"However, 하지만. according to the latest weather forecast, 최신 일기 예보에 따르면. extremely low temperatures, 매우 낮은 기온이. are expected throughout Friday, 금요일 내내 예상됩니다.. 이 문장 전체를 해석하면, 하지만 최신 일기 예보에 따르면, 금요일 내내 매우 낮은 기온이 예상됩니다.","hl":"m"},{"n":22,"text":"이 문장은 앞서 말한 소풍 계획을 수정해야 하는 이유를 말해주고 있어요. However 라는 연결사를 통해 날씨라는 변수가 생겼음을 강조하며 글의 흐름을 바꾸고 있죠.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 are expected 라는 수동태 표현이에요. 기온이라는 주어는 스스로 예상하는 게 아니라 사람들에 의해 예상되는 것이기 때문에 be동사와 과거분사를 결합한 수동태를 써야 맞습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야외에서 긴 시간을 보내는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Spending\u003c/span> long hours outdoors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 조건 하에서\u003c/span>\u003cspan class=\"en\">under these conditions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠재적으로 안전하지 않을 수 있습니다\u003c/span>\u003cspan class=\"en\">may be potentially unsafe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들에게.\u003c/span>\u003cspan class=\"en\">for students.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 조건 하에서 야외에서 긴 시간을 보내는 것은 학생들에게 잠재적으로 안전하지 않을 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 추운 날씨에 야외 활동을 강행할 경우 발생할 수 있는 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">문제\u003c/b>에 대해 학교 측의 \u003cb class=\"key\">우려\u003c/b>를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : Spending [동명사/주어] + may be [조동사+동사원형/동사] : \"보내는 것은\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Spending long hours outdoors, 야외에서 긴 시간을 보내는 것은. under these conditions, 이러한 조건 하에서. may be potentially unsafe, 잠재적으로 안전하지 않을 수 있습니다. for students, 학생들에게.. 이 문장 전체를 해석하면, 이러한 조건 하에서 야외에서 긴 시간을 보내는 것은 학생들에게 잠재적으로 안전하지 않을 수 있습니다.","hl":"m"},{"n":25,"text":"학교가 왜 장소를 바꾸기로 했는지 그 핵심적인 근거가 담긴 문장이에요. 바로 학생들의 안전을 가장 최우선으로 고려하고 있다는 점을 학부모님들께 알리고 있습니다.","hl":"mn"},{"n":26,"text":"첫 번째로 보실 부분은 Spending 이에요. 동사에 ing를 붙여서 주어 자리에 쓴 동명사 구문이죠. 해석할 때는 보내는 것이라고 하면 되고, 만약 뒤에 일반 동사가 온다면 항상 단수 취급한다는 점도 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신중한 고려 끝에,\u003c/span>\u003cspan class=\"en\">After careful consideration,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 결정했습니다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">decided\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장소를 변경하기로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">change\u003c/span> the location.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">신중한 고려 끝에, 저희는 장소를 변경하기로 결정했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 충분히 고민하고 검토했음을 밝히며, 장소 변경이라는 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">결정\u003c/b>을 \u003cb class=\"key\">공식적\u003c/b>으로 선언합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 (have + p.p.)\u003c/span> : we [주어] + have [조동사] + decided [과거분사] : \"결정했습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : decided [타동사] + to change [to부정사구/목적어] : \"변경하기로\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"After careful consideration, 신중한 고려 끝에. we have decided, 저희는 결정했습니다. to change the location, 장소를 변경하기로.. 이 문장 전체를 해석하면, 신중한 고려 끝에, 저희는 장소를 변경하기로 결정했습니다.","hl":"m"},{"n":28,"text":"학교가 독단적으로 정한 것이 아니라 심사숙고해서 내린 결론이라는 점을 강조하고 있어요. 장소 변경이라는 이 편지의 가장 중요한 본론이 나오는 대목입니다.","hl":"mn"},{"n":29,"text":"첫 번째로 have decided 는 현재완료 시제입니다. 지금 막 결정을 마친 상태라는 점을 보여주죠. 두 번째로 to change 는 decide 의 짝꿍이에요. 무엇을 결정했는지 나타내는 목적어 자리에 to부정사를 쓴다는 점을 확인해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">놀이공원 대신에,\u003c/span>\u003cspan class=\"en\">Instead of the amusement park,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들은 시립 과학 박물관을 방문할 것입니다,\u003c/span>\u003cspan class=\"en\">students will visit the City Science Museum,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서 그들은 참여할 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">where\u003c/span> they will participate in\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안내되는 전시와 직접 해보는 학습 활동에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">guided\u003c/span> exhibitions and hands-on learning activities.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">놀이공원 대신에, 학생들은 시립 과학 박물관을 방문할 것이고, 그곳에서 그들은 안내를 받는 전시와 직접 해보는 학습 활동에 참여할 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 추운 날씨로 인해 야외 놀이공원 대신 실내인 과학 박물관으로 \u003cb class=\"key\">장소 \u003c/b>\u003cb class=\"key\">변경\u003c/b>되었음을 알리는 문장입니다. 박물관에서도 유익한 \u003cb class=\"key\">체험 \u003c/b>\u003cb class=\"key\">학습\u003c/b>이 이루어질 것임을 강조하여 부모님들을 안심시키고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사의 계속적 용법\u003c/span> : [선행사(City Science Museum)] + , where + [완전한 문장] : \"그리고 그곳에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 수식\u003c/span> : [과거분사(guided)] + [명사(exhibitions)] : \"안내되는 (전시)\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Instead of the amusement park, 놀이공원 대신에. students will visit the City Science Museum, 학생들은 시립 과학 박물관을 방문할 것입니다. where they will participate in, 그곳에서 그들은 참여할 것입니다. guided exhibitions and hands-on learning activities, 안내되는 전시와 직접 해보는 학습 활동에.. 이 문장 전체를 해석하면, 놀이공원 대신에, 학생들은 시립 과학 박물관을 방문할 것이고, 그곳에서 그들은 안내를 받는 전시와 직접 해보는 학습 활동에 참여할 것입니다.","hl":"m"},{"n":31,"text":"날씨가 너무 추워서 학생들이 밖에서 고생할 수 있으니까, 안전한 실내인 과학 박물관으로 장소를 바꾼다는 내용이에요. 단순히 구경만 하는 게 아니라 직접 체험하는 유익한 활동이 준비되어 있다는 점을 알려주고 있죠.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 콤마 뒤에 쓰인 관계부사 where 입니다. 여기서는 그리고 그곳에서 라는 의미로 앞의 박물관을 설명해주는 계속적 용법으로 쓰였어요. 두 번째는 guided 입니다. 전시는 누군가에 의해 안내되는 것이기 때문에 수동의 의미를 담아 과거분사 형태로 명사를 꾸며줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 정중히 요청합니다\u003c/span>\u003cspan class=\"en\">We kindly \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ask \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 양해를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for\u003c/span> your understanding.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">너그러운 양해를 부탁드립니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 갑작스러운 일정과 장소의 변경에 대해 학부모님들에게 \u003cb class=\"key\">양해\u003c/b>를 구하는 정중한 \u003cb class=\"key\">끝인사\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(숙어)\u003c/span> : ask + for + [명사(목적어)] : \"~을 요청하다/부탁하다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"We kindly ask, 우리는 정중히 요청합니다. for your understanding, 여러분의 양해를.. 이 문장 전체를 해석하면, 너그러운 양해를 부탁드립니다.","hl":"m"},{"n":34,"text":"일정이 바뀌어서 당황스러울 수 있는 학부모님들께 예의를 갖춰서 이해해 달라고 부탁하는 마무리 멘트예요. 공식적인 안내문에서 자주 쓰이는 표현입니다.","hl":"mn"},{"n":35,"text":"여기서 핵심은 ask for 라는 표현이에요. 질문하다 라는 뜻이 아니라 뒤에 나오는 명사를 요청하다 라는 의미로 하나의 덩어리처럼 쓰인다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진심을 담아,\u003c/span>\u003cspan class=\"en\">Sincerely,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Michael Thompson\u003c/span>\u003cspan class=\"en\">Michael Thompson\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교감\u003c/span>\u003cspan class=\"en\">Vice Principal\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">진심을 담아, Michael Thompson 교감\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지나 공지문을 끝낼 때 쓰는 격식 있는 \u003cb class=\"key\">맺음말\u003c/b>과 보낸 사람의 성함 및 \u003cb class=\"key\">직함\u003c/b>입니다.\u003c/div>","segs":[{"n":36,"text":"Sincerely, 진심을 담아. Michael Thompson, Michael Thompson. Vice Principal, 교감. 이 문장 전체를 해석하면, 진심을 담아, Michael Thompson 교감","hl":"m"},{"n":37,"text":"이 편지를 쓴 사람이 누구인지 밝히는 부분입니다. Michael Thompson 이라는 교감 선생님이 학교를 대표해서 보낸 공지문이라는 것을 알 수 있죠.","hl":"mn"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>이번 금요일에 예정된 학교 \u003cb class=\"key\">현장 \u003c/b>\u003cb class=\"key\">학습\u003c/b> 장소가 변경되었음을 공지합니다.\u003c/li>\u003cli>원래 야외 놀이공원에 갈 계획이었으나, 최신 예보상 \u003cb class=\"key\">낮은 \u003c/b>\u003cb class=\"key\">기온\u003c/b>이 예상되었습니다.\u003c/li>\u003cli>학생들이 추운 야외에서 장시간 머무는 것은 \u003cb class=\"key\">안전성\u003c/b>에 문제가 될 수 있다고 판단했습니다.\u003c/li>\u003cli>이에 따라 장소를 실내인 \u003cb class=\"key\">시립 \u003c/b>\u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">박물관\u003c/b>으로 변경하여 전시 관람과 체험 활동을 진행합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The school field trip destination was changed from an outdoor amusement park to an indoor science museum to ensure student safety during extreme cold.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">금요일로 예정된 현장 학습이 \u003cb class=\"key\">기온 \u003c/b>\u003cb class=\"key\">급강하\u003c/b>로 인한 학생 안전 우려 때문에 기존 드림랜드 놀이공원에서 실내인 \u003cb class=\"key\">시립 \u003c/b>\u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">박물관\u003c/b>으로 변경되었습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":38,"text":"자, 오늘 지문은 학교 현장 학습 장소가 왜 바뀌었는지 그 이유와 결과를 파악하는 것이 핵심이었습니다. 안내문 형식이라 문장이 간결하고 명확하니 꼭 다시 읽어보세요. 오늘도 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
