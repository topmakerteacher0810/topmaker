jj+X/ANfvQzKMfMPzHXt7dPfg5zR/Xfr/AF6dTNwi9Iuz7Xvd3jZdbKz1tvzLvqvQ7geccenr9PTI9scdwZ44xjqD/TB4/wA9KCc4OVx3OfcgfiT1yT+owm4fdGM565HU5IB64HB9O3HoGdne3ey9Lq6vs16NX16IaXG4g5Hpxx7+nt0GOhHBpu4Ybv8AePXPAHI7kHGe3t7UOOc5ByRzuH9WJ6kDGMdfeo9oTOO4J5IP0XjOR8wA7nnrnIE1K1n2t+D+531t3t1Kbcbw23b729U7bNbH/9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Running: Trusting the Wisdom of the Body<small>달리기: 신체의 지혜를 신뢰하기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">달리기(Running)는 단순히 다리를 빠르게 움직이는 행동이 아니라, 뇌와 신경계(Nervous System), 근육(Muscles), 감각(Senses)이 함께 작동하는 매우 복잡한 운동 조절(Motor Control) 과정입니다. 특히 몸의 위치와 움직임을 스스로 감지하는 고유수용감각(Proprioception)은 우리가 땅을 딛는 힘, 균형, 보폭을 순간적으로 조절하게 해 주는데, 이는 마치 자전거를 탈 때 일일이 생각하지 않아도 몸이 균형을 잡는 것과 비슷합니다. 이런 능력은 말로 설명하기 어려운 암묵지(Implicit Knowledge)에 가까워서, 우리는 달리는 법을 완전히 의식적으로 이해하기보다는 몸이 이미 알고 있는 방식에 의존합니다. 또한 생체역학(Biomechanics) 관점에서 보면 잘못된 자세, 과도한 훈련, 감각 둔화는 부상(Injury)으로 이어질 수 있기 때문에, 달리기를 이해하려면 ‘의지’보다 몸의 신호를 듣는 능력이 중요하다는 점을 알아두면 좋습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 제기</div><ul><li>달리기(running)는 자연스러운 행동처럼 보이지만, 왜 쉽게 부상을 입는지 의문을 제기한다.</li><li>몸이 가장 잘 안다면 왜 부상(injury)이 생기는가</li><li>달리기는 겉으로는 쉬워 보이는 활동</li><li>핵심 키워드: 자연스러움(natural), 부상(injury)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02쉬워 보이는 이유</div><ul><li>달리기가 쉬워 보이는 것은 실제로 단순해서가 아니라, 우리 몸이 매우 능숙하게 수행하기 때문이다.</li><li>몸은 달리기에 뛰어난 능력(intelligence)을 지님</li><li>두 다리로 자유롭게 달리는 것은 복잡한 계산(computations)을 요구함</li><li>핵심 키워드: 신체 능력(body ability), 복잡한 계산(computations)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03의식 밖의 복잡성</div><ul><li>달리기는 대부분 의식적으로 조절되는 것이 아니며, 인간이 완전히 설명하기 어려울 만큼 복잡하다.</li><li>달리기 지식(running knowledge)은 의식(consciousness) 밖에 있음</li><li>슈퍼컴퓨터(supercomputer)도 완전히 처리하기 어려운 수준</li><li>상상 속 로봇(T-1000 Terminators)만이 완벽히 해낼 것처럼 묘사됨</li><li>핵심 키워드: 무의식(unconscious), 복잡성(complexity)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04몸에 새겨진 지식</div><ul><li>달리기에 대한 지식은 근육, 세포, DNA 깊숙이 묻혀 있으므로 인간은 그 복잡성을 완전히 설명할 수 없다.</li><li>근육 섬유(muscle fibres)에 지식이 내재됨</li><li>세포(cells)와 DNA에도 달리기 지식이 담겨 있음</li><li>설명 불가능성이 곧 몸의 무지를 뜻하지는 않음</li><li>핵심 키워드: 내재된 지식(embedded knowledge), DNA</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05감각을 통한 이해</div><ul><li>우리는 감각을 활용하고 몸의 능력을 받아들임으로써 달리기를 더 깊이 이해할 수 있다.</li><li>감각(senses)을 깨우고 활용해야 함</li><li>몸이 무엇을 할 수 있는지 관찰함</li><li>몸은 인간의 의식보다 달리기를 더 잘 안다는 점을 인정함</li><li>핵심 키워드: 감각(senses), 수용(acceptance)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">know best</td><td class=\"m\">가장 잘 알다, 최선의 판단을 하다</td></tr><tr><td class=\"w\">injure</td><td class=\"m\">부상을 입히다, 다치게 하다, 손상시키다</td></tr><tr><td class=\"w\">seemingly</td><td class=\"m\">겉보기에는, 외견상, 보아하니</td></tr><tr><td class=\"w\">on the one hand</td><td class=\"m\">한편으로는, 한 가지 관점에서는</td></tr><tr><td class=\"w\">be good at</td><td class=\"m\">~을 잘하다, ~에 능숙하다</td></tr><tr><td class=\"w\">administer</td><td class=\"m\">관리하다, 집행하다, 투여하다</td></tr><tr><td class=\"w\">enormous</td><td class=\"m\">거대한, 막대한, 엄청난</td></tr><tr><td class=\"w\">computation</td><td class=\"m\">계산, 연산, 산출</td></tr><tr><td class=\"w\">untethered</td><td class=\"m\">묶이지 않은, 속박되지 않은, 자유로운</td></tr><tr><td class=\"w\">conscious</td><td class=\"m\">의식하는, 자각하는, 의식이 있는</td></tr><tr><td class=\"w\">complicated</td><td class=\"m\">복잡한, 이해하기 어려운</td></tr><tr><td class=\"w\">be able to</td><td class=\"m\">~할 수 있다, ~할 능력이 있다</td></tr><tr><td class=\"w\">bury</td><td class=\"m\">묻다, 숨기다, 깊이 감추다</td></tr><tr><td class=\"w\">complexity</td><td class=\"m\">복잡성, 복잡한 특징</td></tr><tr><td class=\"w\">feel one&#39;s way towards</td><td class=\"m\">조심스럽게 나아가다, 더듬어 찾아가다</td></tr><tr><td class=\"w\">alchemy</td><td class=\"m\">연금술, 신비로운 변화 과정</td></tr><tr><td class=\"w\">sense</td><td class=\"m\">감각, 감지 능력, 느낌</td></tr><tr><td class=\"w\">be capable of</td><td class=\"m\">~할 수 있다, ~할 능력이 있다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">know best</td><td class=\"m\">가장 잘 알다, 최선의 판단을 하다</td></tr><tr><td class=\"w\">injure</td><td class=\"m\">부상을 입히다, 다치게 하다, 손상시키다</td></tr><tr><td class=\"w\">seemingly</td><td class=\"m\">겉보기에는, 외견상, 보아하니</td></tr><tr><td class=\"w\">on the one hand</td><td class=\"m\">한편으로는, 한 가지 관점에서는</td></tr><tr><td class=\"w\">be good at</td><td class=\"m\">~을 잘하다, ~에 능숙하다</td></tr><tr><td class=\"w\">administer</td><td class=\"m\">관리하다, 집행하다, 투여하다</td></tr><tr><td class=\"w\">enormous</td><td class=\"m\">거대한, 막대한, 엄청난</td></tr><tr><td class=\"w\">computation</td><td class=\"m\">계산, 연산, 산출</td></tr><tr><td class=\"w\">untethered</td><td class=\"m\">묶이지 않은, 속박되지 않은, 자유로운</td></tr><tr><td class=\"w\">conscious</td><td class=\"m\">의식하는, 자각하는, 의식이 있는</td></tr><tr><td class=\"w\">complicated</td><td class=\"m\">복잡한, 이해하기 어려운</td></tr><tr><td class=\"w\">be able to</td><td class=\"m\">~할 수 있다, ~할 능력이 있다</td></tr><tr><td class=\"w\">bury</td><td class=\"m\">묻다, 숨기다, 깊이 감추다</td></tr><tr><td class=\"w\">complexity</td><td class=\"m\">복잡성, 복잡한 특징</td></tr><tr><td class=\"w\">feel one&#39;s way towards</td><td class=\"m\">조심스럽게 나아가다, 더듬어 찾아가다</td></tr><tr><td class=\"w\">alchemy</td><td class=\"m\">연금술, 신비로운 변화 과정</td></tr><tr><td class=\"w\">sense</td><td class=\"m\">감각, 감지 능력, 느낌</td></tr><tr><td class=\"w\">be capable of</td><td class=\"m\">~할 수 있다, ~할 능력이 있다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 우리의 몸이 가장 잘 안다면</span><span class=\"en\"><b><span class=\"grammar-hl\">If our bodies know best</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜 그것들은 쉽게 다칠까</span><span class=\"en\"><b>why <span class=\"grammar-hl\">are they easily injured</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 달리기처럼 겉보기에 그렇게 자연스러운 무언가를 할 때</span><span class=\"en\"><b>when we do something <span class=\"grammar-hl\">so seemingly natural as running</span>?</b></span></div></div><div class=\"lec-sent-ko\">만약 우리의 몸이 가장 잘 안다면, 왜 그들은 우리가 달리기처럼 겉보기에 자연스러운 무언가를 할 때 쉽게 다칠까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글 전체의 문제를 던집니다. 사람의 몸은 본능적으로 움직이는 법을 알고 있는 듯한데도, 달리기를 하면 부상을 당하는 일이 많습니다. 글쓴이는 이 모순처럼 보이는 상황을 통해 “달리기는 정말 단순한 행동인가?”, “몸은 달리기를 얼마나 알고 있는가?”라는 질문으로 독자를 끌어들입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are they easily injured (수동태): be동사(are)+p.p.(injured) 구조이다. injure는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) are injured 형태로 쓴다. 기본구조: injure + O(목적어).</div><div class=\"lec-gr-item\">If our bodies know best (관용표현): know best는 ‘가장 잘 알다’라는 의미의 관용적 동사구이다. If절은 조건 부사절로, 뒤의 주절 why are they easily injured... 전체의 조건을 나타낸다.</div><div class=\"lec-gr-item\">running (동명사): running은 동사 run에 -ing가 붙었지만 여기서는 명사 역할을 하며, as 뒤에서 ‘달리기’라는 행위 자체를 가리킨다.</div><div class=\"lec-gr-item\">so seemingly natural as running (관용표현): so A as B 구조로, A와 B를 비교해 ‘B만큼 A한’이라는 비교 구조를 만든다. 여기서는 something을 so seemingly natural이 수식하고, as running이 비교 기준으로 붙는다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">know best</td><td class=\"m\">가장 잘 알다, 최선의 판단을 하다</td></tr><tr><td class=\"w\">injure</td><td class=\"m\">부상을 입히다, 다치게 하다, 손상시키다</td></tr><tr><td class=\"w\">seemingly</td><td class=\"m\">겉보기에는, 외견상, 보아하니</td></tr><tr><td class=\"w\">know best</td><td class=\"m\">가장 잘 알다, 최선의 판단을 하다</td></tr><tr><td class=\"w\">injure</td><td class=\"m\">부상을 입히다, 다치게 하다, 손상시키다</td></tr><tr><td class=\"w\">seemingly</td><td class=\"m\">겉보기에는, 외견상, 보아하니</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">한편으로</span><span class=\"en\"><b><span class=\"grammar-hl\">On the one hand</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달리기는 매우 쉬워 보인다</span><span class=\"en\"><b><span class=\"grammar-hl\">running seems very easy</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그것은 오직 그렇다</span><span class=\"en\"><b>but that is only</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 몸이 그것을 아주 잘하기 때문에</span><span class=\"en\"><b>because our bodies <span class=\"grammar-hl\">are so very good at it</span>.</b></span></div></div><div class=\"lec-sent-ko\">한편으로, 달리기는 매우 쉬워 보이지만, 그것은 오직 우리의 몸이 그것을 아주 잘하기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 질문에 대한 첫 설명입니다. 달리기가 쉬워 보이는 이유는 달리기 자체가 단순해서가 아니라, 우리 몸이 오랜 시간 동안 그 동작을 자연스럽게 처리할 만큼 뛰어나기 때문이라는 뜻입니다. 글쓴이는 여기서 겉보기의 쉬움과 실제 내부 작동의 복잡함을 구분하기 시작합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">On the one hand (관용표현): On the one hand는 대조를 시작할 때 쓰는 연결 표현으로, 문장 전체 앞에서 담화 표지 역할을 한다.</div><div class=\"lec-gr-item\">running seems very easy (동명사): running은 문장의 주어로 쓰인 명사 역할의 -ing형이다. 구조는 S(running)+V(seems)+C(very easy)의 2형식 구조이다.</div><div class=\"lec-gr-item\">are so very good at it (관용표현): be good at + 명사 구조로, 형용사 good이 전치사 at과 함께 쓰이고 at의 목적어로 it이 온다. 구조는 be동사(are)+형용사구(good at it)이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">on the one hand</td><td class=\"m\">한편으로는, 한 가지 관점에서는</td></tr><tr><td class=\"w\">on the one hand</td><td class=\"m\">한편으로는, 한 가지 관점에서는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지구상의 가장 강력한 슈퍼 컴퓨터도</span><span class=\"en\"><b>The most powerful supercomputer on the planet</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">엄청난 수의 계산을 처리할 수 없다</span><span class=\"en\"><b>cannot administer the enormous number of <span class=\"grammar-hl\">computations</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">필요한</span><span class=\"en\"><b><span class=\"grammar-hl\">it takes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달리는 데, 매인 줄이 풀린 채</span><span class=\"en\"><b><span class=\"grammar-hl\">to run</span>, <span class=\"grammar-hl\">untethered</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 다리로</span><span class=\"en\"><b>on two legs.</b></span></div></div><div class=\"lec-sent-ko\">지구상의 가장 강력한 슈퍼 컴퓨터도 매인 줄이 풀린 채 두 다리로 달리는 데 필요한 엄청난 수의 계산을 처리할 수 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 “몸이 달리기를 매우 잘한다”는 점을 강하게 뒷받침합니다. 달리기는 균형 잡기, 근육 조절, 속도 조절, 지면 반응 처리 같은 수많은 판단이 동시에 이루어지는 행동입니다. 로봇공학에서도 사람처럼 자유롭게 두 발로 달리는 것은 매우 어려운 과제이므로, 글쓴이는 인간의 몸이 무의식적으로 수행하는 능력이 얼마나 정교한지 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">computations it takes to run (관계대명사): computations 뒤에 목적격 관계대명사 that/which가 생략된 구조이다. 원래 구조는 computations that/which it takes to run이며, 관계절 안에서는 it takes ___ to run처럼 생략된 관계대명사가 takes의 목적어 자리에 해당한다.</div><div class=\"lec-gr-item\">it takes to run, untethered, on two legs (가주어): 진주어: it takes + O + toV 구조에서 it은 형식상 주어이고, to run, untethered, on two legs가 실제 동작 내용을 나타내는 진주어 역할을 한다. enormous number of computations는 takes의 목적어이다.</div><div class=\"lec-gr-item\">to run, untethered, on two legs (to부정사): to + 동사원형(run) 구조이다. it takes + O + toV 구문 안에서 to run은 필요한 계산이 쓰이는 동작 내용을 나타내며, to부정사구 전체가 문장 구조상 진주어 역할을 한다.</div><div class=\"lec-gr-item\">untethered (분사구문): untethered는 과거분사 형태로, 주절의 주체가 어떤 상태로 run하는지를 부사적으로 보충한다. 원래 절로 바꾸면 while it is untethered 정도의 구조가 된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">administer</td><td class=\"m\">관리하다, 집행하다, 투여하다</td></tr><tr><td class=\"w\">enormous</td><td class=\"m\">거대한, 막대한, 엄청난</td></tr><tr><td class=\"w\">computation</td><td class=\"m\">계산, 연산, 산출</td></tr><tr><td class=\"w\">untethered</td><td class=\"m\">묶이지 않은, 속박되지 않은, 자유로운</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">administer</td><td class=\"m\">관리하다, 집행하다, 투여하다</td></tr><tr><td class=\"w\">enormous</td><td class=\"m\">거대한, 막대한, 엄청난</td></tr><tr><td class=\"w\">computation</td><td class=\"m\">계산, 연산, 산출</td></tr><tr><td class=\"w\">untethered</td><td class=\"m\">묶이지 않은, 속박되지 않은, 자유로운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 달리기 지능이 어디에 있든 간에</span><span class=\"en\"><b><span class=\"grammar-hl\">Wherever our running intelligence is</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달리기는 우리에게 완전히 의식적이지 않고</span><span class=\"en\"><b><span class=\"grammar-hl\">running is not all conscious to us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 너무 복잡해서</span><span class=\"en\"><b>and is <span class=\"grammar-hl\">so complicated</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오직 우리의 상상 속 T-1000 터미네이터만이</span><span class=\"en\"><b><span class=\"grammar-hl\">that only the T-1000 Terminators of our imagination</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 할 수 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">are able to do it</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리의 달리기 지능이 어디에 있든 간에, 달리기는 우리에게 완전히 의식적이지 않고, 너무 복잡해서 오직 우리의 상상 속 T­1000 터미네이터만이 그것을 할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 달리기가 의식적인 생각만으로 통제되는 행동이 아니라는 점을 이어서 설명합니다. 우리는 달릴 때 매 순간 “발목을 이렇게 움직이고, 무릎을 이 각도로 굽히고, 상체를 이만큼 기울이자”라고 계산하지 않습니다. T-1000 같은 상상 속 고성능 로봇을 언급한 것은 인간의 자연스러운 달리기가 기계적으로 구현하기 어려운 수준의 복잡한 능력이라는 점을 강조하기 위한 예시입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Wherever our running intelligence is (관계부사): Wherever는 장소를 나타내는 복합관계부사로, ‘우리의 달리기 지능이 어디에 있든’이라는 부사절을 이끈다. 구조는 wherever + S(our running intelligence)+V(is)이다.</div><div class=\"lec-gr-item\">running intelligence (동명사): running은 ‘달리기’라는 활동 개념을 나타내며 뒤의 명사 intelligence를 꾸민다. 여기서는 ‘달리기와 관련된 지능’이라는 명사적 수식 구조이다.</div><div class=\"lec-gr-item\">running is not all conscious to us (동명사): running은 문장의 주어로 쓰였고, ‘달리기’라는 행위 자체를 명사처럼 나타낸다. 구조는 S(running)+V(is)+C(not all conscious to us)이다.</div><div class=\"lec-gr-item\">so complicated that only the T-1000 Terminators of our imagination are able to do it (관용표현): so + 형용사 + that절 구조로, 앞의 형용사 complicated의 정도가 뒤 that절의 결과로 이어진다. that절 안에서는 only the T-1000 Terminators of our imagination이 주어이고 are able to do it이 서술부이다.</div><div class=\"lec-gr-item\">to do it (to부정사): to + 동사원형(do) 구조이며, 형용사 able 뒤에서 able toV 형태를 만든다. are able to do it은 be able to + 동사원형의 구조로 가능을 나타낸다.</div><div class=\"lec-gr-item\">do it (대동사): do는 앞에서 말한 running/run the act를 대신하여 반복을 피한다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conscious</td><td class=\"m\">의식하는, 자각하는, 의식이 있는</td></tr><tr><td class=\"w\">complicated</td><td class=\"m\">복잡한, 이해하기 어려운</td></tr><tr><td class=\"w\">conscious</td><td class=\"m\">의식하는, 자각하는, 의식이 있는</td></tr><tr><td class=\"w\">complicated</td><td class=\"m\">복잡한, 이해하기 어려운</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 달리기 지식은 아주 깊이 묻혀 있기 때문에</span><span class=\"en\"><b>Because our <span class=\"grammar-hl\">running knowledge</span> <span class=\"grammar-hl\">is buried so deeply</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">근섬유, 세포, 그리고 우리의 DNA 속에</span><span class=\"en\"><b><span class=\"grammar-hl\">within muscle fibres, cells and our DNA</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 받아들여야 한다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">have to accept</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 그것의 복잡성을 완전히 설명할 수 없다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that we cannot fully explain its complexities</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리의 달리기 지식은 근섬유, 세포, 그리고 우리의 DNA 속에 아주 깊이 묻혀 있기 때문에, 우리는 우리가 그것의 복잡성을 완전히 설명할 수 없다는 것을 받아들여야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 “달리기는 의식적으로 다 알 수 없는 복잡한 행동”이라는 내용을 더 깊게 발전시킵니다. 달리기는 머리로 외워서 수행하는 기술만이 아니라, 몸의 조직과 신경계, 진화적으로 형성된 움직임의 패턴 속에 들어 있는 능력으로 제시됩니다. 그래서 과학적으로 분석할 수 있는 부분은 있어도, 사람이 자기 몸 안에서 일어나는 모든 조절 과정을 완전히 말로 설명하기는 어렵다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">running knowledge (동명사): running은 ‘달리기’라는 활동 개념을 나타내며 knowledge를 수식한다. 즉 running knowledge는 ‘달리기에 관한 지식’이라는 명사구이다.</div><div class=\"lec-gr-item\">is buried so deeply within muscle fibres, cells and our DNA (수동태): be동사(is)+p.p.(buried) 구조이다. bury는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) is buried 형태로 쓴다. 기본구조: bury + O(목적어) + within/in + 장소·영역.</div><div class=\"lec-gr-item\">have to accept (관용표현): have to + 동사원형 구조로, 조동사처럼 쓰여 뒤에 동사원형 accept가 온다. 문장 구조상 주어 we 뒤에서 서술부 have to accept를 이룬다.</div><div class=\"lec-gr-item\">that we cannot fully explain its complexities (명사절): that절이 동사 accept의 목적어 역할을 한다. 구조는 accept + that + S(we)+V(cannot explain)+O(its complexities)이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 의미하지 않는다</span><span class=\"en\"><b><span class=\"grammar-hl\">That doesn't mean</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 몸이 모른다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">our bodies don't know</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 어떻게 하는지</span><span class=\"en\"><b><span class=\"grammar-hl\">how to do it</span>.</b></span></div></div><div class=\"lec-sent-ko\">그것은 우리의 몸이 그것을 어떻게 하는지 모른다는 것을 의미하지는 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 앞 문장에서 생길 수 있는 오해를 바로잡습니다. 우리가 달리기의 복잡한 원리를 완전히 설명하지 못해도, 몸은 실제로 달리기를 수행합니다. 즉, 의식적으로 설명 가능한 지식과 몸이 실제로 해내는 능력은 다를 수 있으며, 글쓴이는 몸의 무의식적 지혜를 인정해야 한다고 말합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how to do it (간접의문문(축약형)): how + to부정사 구조로, know의 목적어 역할을 한다. 완전한 절 how we should do it에서 주어와 조동사가 축약된 형태로 볼 수 있다.</div><div class=\"lec-gr-item\">to do it (to부정사): to + 동사원형(do) 구조이며, how와 결합해 how toV 형태를 만든다. 이 덩어리 전체가 know의 목적어로 쓰인다.</div><div class=\"lec-gr-item\">do it (대동사): do는 앞에서 언급된 running/run을 대신해 반복을 피한다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다</div><div class=\"lec-gr-item\">That doesn&#39;t mean our bodies don&#39;t know how to do it 기본 구조: That이 주어이고 doesn&#39;t mean이 동사구이며, 뒤의 our bodies don&#39;t know how to do it이 mean의 목적어 역할을 하는 내용절이다. 여기서 do/does는 일반동사의 부정문을 만드는 조동사로 쓰였다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리는 더듬어 나아갈 수 있다</span><span class=\"en\"><b>We may <span class=\"grammar-hl\">feel our way</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달리기의 연금술을 이해하는 쪽으로</span><span class=\"en\"><b><span class=\"grammar-hl\">towards</span> understanding the alchemy of <span class=\"grammar-hl\">running</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 감각을 사용하는 법을 배움으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by learning how to use our senses,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들을 활성화하게 함으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">getting them firing,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것들이 무엇을 할 수 있는지 봄으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">and seeing what they are capable of,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 받아들이는 쪽으로</span><span class=\"en\"><b><span class=\"grammar-hl\">and accepting</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 몸이 더 많이 안다는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">that our bodies know more</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">달리기에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">about running</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 장차 그러할 것보다</span><span class=\"en\"><b><span class=\"grammar-hl\">than we ever will</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리는 우리의 감각을 사용하는 법을 배우고, 그것들을 활성화하게 하고, 그리고 그것들이 무엇을 할 수 있는지 봄으로써, 달리기의 연금술을 이해하고, 우리의 몸이 우리가 장차 그러할 것보다 달리기에 대해 더 잘 알고 있다는 것을 받아들이는 쪽으로 더듬어 나아갈 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막 문장은 글의 결론 역할을 합니다. 달리기를 완전히 이론으로 설명하려 하기보다, 몸의 감각에 귀 기울이고 실제 움직임을 통해 조금씩 이해해 가야 한다는 뜻입니다. “달리기의 연금술”이라는 표현은 달리기가 단순한 운동 기술을 넘어, 몸의 감각·균형·반응·무의식적 조절이 섞여 만들어지는 신비로운 과정임을 나타냅니다. 앞 문장들이 달리기의 복잡성과 몸의 숨은 지혜를 설명했다면, 이 문장은 우리가 취해야 할 태도, 즉 몸을 신뢰하며 감각을 통해 배워야 한다는 결론을 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">feel our way towards (관용표현): feel one&#39;s way towards는 ‘더듬어 나아가다/점차 접근하다’라는 관용적 동사구이다. 구조는 feel + one&#39;s way + towards + 명사구이다.</div><div class=\"lec-gr-item\">towards understanding (동명사): understanding은 전치사 towards의 목적어로 쓰인 -ing형이다. 전치사 뒤에는 명사 성분이 와야 하므로 understand가 understanding으로 바뀌었다.</div><div class=\"lec-gr-item\">by learning how to use our senses, getting them firing, and seeing what they are capable of, and accepting that our bodies know more about running than we ever will (동명사): by 뒤에 learning, getting, seeing, accepting이 병렬로 이어져 전치사 by의 목적어 역할을 한다. 구조는 by + -ing구 여러 개의 병렬 연결이다.</div><div class=\"lec-gr-item\">how to use our senses (간접의문문(축약형)): how + to부정사 구조로, learning의 목적어 역할을 한다. to use는 to + 동사원형(use) 형태이며, ‘어떻게 사용할지’라는 명사구 역할을 한다.</div><div class=\"lec-gr-item\">getting them firing 5형식(SVOC) 구조: getting이 동사 역할을 하고 them이 목적어, firing이 목적격보어이다. 구조는 get + O + C이며, 목적어 them의 상태를 보어 firing이 설명한다.</div><div class=\"lec-gr-item\">firing (현재분사): firing은 목적어 them의 동작·상태를 설명하는 목적격보어로 쓰였다. them firing은 ‘them이 firing하는 상태’라는 구조로, 현재분사가 목적어의 상태를 보충한다.</div><div class=\"lec-gr-item\">what they are capable of (간접의문문): what + S(they)+V(are)+형용사구(capable of) 구조로, seeing의 목적어 역할을 한다. 의문문 어순이 아니라 평서문 어순 they are가 쓰인다.</div><div class=\"lec-gr-item\">are capable of (관용표현): be capable of + 명사 구조로, 형용사 capable이 전치사 of와 함께 쓰인다. what they are capable of에서는 what이 전치사 of의 의미상 목적어 역할을 한다.</div><div class=\"lec-gr-item\">accepting that our bodies know more about running than we ever will (명사절): accepting 뒤의 that절은 accepting의 목적어 역할을 한다. that절 내부는 S(our bodies)+V(know)+O(more about running)+비교절(than we ever will)의 구조이다.</div><div class=\"lec-gr-item\">running (동명사): running은 전치사 about의 목적어로 쓰여 ‘달리기’라는 행위 자체를 명사처럼 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">alchemy</td><td class=\"m\">연금술, 신비로운 변화 과정</td></tr><tr><td class=\"w\">sense</td><td class=\"m\">감각, 감지 능력, 느낌</td></tr><tr><td class=\"w\">alchemy</td><td class=\"m\">연금술, 신비로운 변화 과정</td></tr><tr><td class=\"w\">sense</td><td class=\"m\">감각, 감지 능력, 느낌</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>달리기는 자연스럽고 쉬워 보이지만, 실제로는 매우 복잡한 신체 활동이다.</li><li>인간의 몸은 달리기에 필요한 수많은 조절과 계산을 무의식적으로 처리한다.</li><li>우리는 달리기의 모든 원리를 완전히 설명할 수 없지만, 몸은 이미 그것을 수행할 줄 안다.</li><li>달리기를 이해하려면 이론만으로 접근하기보다 감각을 깨우고 몸의 지혜를 받아들여야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Although running appears natural and easy, it relies on deep unconscious bodily intelligence that we can better sense than fully explain.</div>\n              <div class=\"lec-final-sum-ko\">달리기는 자연스럽고 쉬워 보이지만, 완전히 설명하기보다 감각으로 더 잘 느낄 수 있는 깊은 무의식적 신체 지능에 의존한다.</div></div></div>"],"segs":[[{"audio":"./34_audio/1.mp3","hl":null}],[{"audio":"./34_audio/2.mp3","hl":null}],[{"audio":"./34_audio/3.mp3","hl":null},{"audio":"./34_audio/4.mp3","hl":"stage-0"},{"audio":"./34_audio/5.mp3","hl":"stage-1"},{"audio":"./34_audio/6.mp3","hl":"stage-2"},{"audio":"./34_audio/7.mp3","hl":"stage-3"},{"audio":"./34_audio/8.mp3","hl":"stage-4"}],[{"audio":"./34_audio/9.mp3","hl":null}],[{"audio":"./34_audio/10.mp3","hl":"main"},{"audio":"./34_audio/11.mp3","hl":"meaning"},{"audio":"./34_audio/12.mp3","hl":"grammar"}],[{"audio":"./34_audio/13.mp3","hl":"main"},{"audio":"./34_audio/14.mp3","hl":"meaning"},{"audio":"./34_audio/15.mp3","hl":"grammar"}],[{"audio":"./34_audio/16.mp3","hl":"main"},{"audio":"./34_audio/17.mp3","hl":"meaning"},{"audio":"./34_audio/18.mp3","hl":"grammar"}],[{"audio":"./34_audio/19.mp3","hl":"main"},{"audio":"./34_audio/20.mp3","hl":"meaning"},{"audio":"./34_audio/21.mp3","hl":"grammar"}],[{"audio":"
