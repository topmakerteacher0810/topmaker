</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"2026년 고2 9월 모의고사 22번","audioDir":"22_audio","preview":false,"count":44,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">22번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>The Cost of Constant Connectivity: Mindful Eating vs. Digital Multitasking\u003c/h1>\u003ch2>끊임없는 접속의 대가: 마음챙김 식사와 디지털 멀티태스킹\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>끊임없이 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">콘텐츠\u003c/b>를 소비하며 식사하는 멀티태스킹은 인지적 과부하를 초래하므로, 온전히 음식에 집중하는 \u003cb class=\"key\">마음챙김 \u003c/b>\u003cb class=\"key\">식사\u003c/b>가 필요하다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>To avoid cognitive overload and physical discomfort, one should prioritize mindful eating over simultaneous digital interaction.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요! 오늘은 고2 모의고사 스물두 번째 지문을 함께 살펴볼 거예요. 우리가 평소에 밥 먹으면서 스마트폰을 보는 습관이 있는데, 이 행동이 우리 몸에 어떤 영향을 주는지 다루고 있죠. 핵심 요약은 끊임없는 디지털 콘텐츠 소비가 우리에게 인지적 과부하를 주니 식사할 땐 마음챙김 식사를 하라는 겁니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 현대 사회에서 스마트폰을 통해 정보를 계속 확인하는 \u003cb class=\"key\">상시 \u003c/b>\u003cb class=\"key\">접속 \u003c/b>\u003cb class=\"key\">상태(always \u003c/b>\u003cb class=\"key\">on)\u003c/b>를 유지합니다. 이는 뇌가 끊임없이 정보를 처리해야 하는 인지적 과부하를 야기합니다. 마치 우리가 컴퓨터에서 여러 개의 프로그램을 동시에 실행하면 속도가 느려지는 \u003cb class=\"key\">멀티태스킹(multitasking)\u003c/b>의 문제와 비슷합니다. 식사 중에 문자를 확인하는 행동은 뇌의 에너지를 분산시켜 소화 기능에 부정적인 영향을 주는 \u003cb class=\"key\">신경성 \u003c/b>\u003cb class=\"key\">소화 \u003c/b>\u003cb class=\"key\">불량(nervous \u003c/b>\u003cb class=\"key\">indigestion)\u003c/b>을 유발할 수 있습니다. 따라서 정신적 에너지를 한곳에 집중하는 \u003cb class=\"key\">마음챙김(mindfulness)\u003c/b>의 가치가 강조됩니다.\u003c/div>","segs":[{"n":2,"text":"자, 배경지식부터 살펴볼게요. 우리는 매 순간 인터넷에 연결된 상시 접속 상태로 살아가요. 이게 뇌에 엄청난 피로감을 주죠. 컴퓨터에서 여러 프로그램을 동시에 돌리면 속도가 느려지듯이, 사람의 뇌도 멀티태스킹을 하면 과부하가 걸려요. 식사 중 문자를 하면 뇌 에너지가 분산되어서 결국 신경성 소화 불량이 올 수도 있죠. 그래서 요즘은 마음챙김, 즉 지금 하는 일에 온전히 집중하는 태도가 중요하게 여겨져요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>현대인의 디지털 습관\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>현대인은 깨어 있는 동안 끊임없이 디지털 \u003cb class=\"key\">콘텐츠 \u003c/b>\u003cb class=\"key\">섭취\u003c/b>를 이어갑니다. 이메일 확인부터 게시물 작성까지, 뇌는 쉬지 않고 \u003cb class=\"key\">상시 \u003c/b>\u003cb class=\"key\">접속 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 유지하며 정보를 처리하느라 바쁩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>멀티태스킹의 문제점\u003csmall>문제 제기 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>식사 중에 디지털 기기를 함께 사용하는 \u003cb class=\"key\">멀티태스킹\u003c/b>은 우리 뇌에 과부하를 줍니다. 뇌가 가상 콘텐츠를 소화하느라 정작 음식을 섭취하고 분해하는 물리적 과정에 쓸 \u003cb class=\"key\">의지력\u003c/b>을 분산시키기 때문입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>일상적인 실수와 결과\u003csmall>예시 및 인과 · 문장 4–7\u003c/small>\u003c/h4>\u003cp>많은 이들이 바쁜 일상 속에서 식사를 하며 문자를 보내는 것을 당연하게 여깁니다. 하지만 이런 행위는 대충 쓴 문자로 인한 오해와 신체적 불편함인 \u003cb class=\"key\">신경성 \u003c/b>\u003cb class=\"key\">소화 \u003c/b>\u003cb class=\"key\">불량\u003c/b>이라는 좋지 않은 결과를 낳습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>의식적인 분리 제안\u003csmall>주장 및 결론 · 문장 8–11\u003c/small>\u003c/h4>\u003cp>저자는 샌드위치를 먹을 때는 오직 그것에만 집중하라고 조언합니다. 디지털 기기를 잠시 내려놓고 음식을 충분히 즐긴 뒤에 \u003cb class=\"key\">문자 \u003c/b>\u003cb class=\"key\">보내기\u003c/b>를 하는 것이 건강한 삶의 방식입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 현대인의 디지털 습관이라는 문제점에서 시작해 그로 인한 신체적 불균형을 짚고, 결국 의식적인 행동 분리라는 해결책으로 이어지는 구조예요.","hl":null},{"n":4,"text":"첫 번째 단계는 현대인의 일상이에요. 우리는 깨어 있는 동안 쉴 새 없이 디지털 콘텐츠를 섭취하죠. 거의 강박적으로 상시 접속 상태를 유지하고 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 문제 제기예요. 식사할 때 멀티태스킹을 하면 뇌는 가상 정보를 처리하느라 에너지를 다 써버려요. 물리적인 음식 소화에 집중할 의지력이 남아나지 않는 거죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 구체적인 예시와 결과예요. 바쁜 현대인들은 대충 쓴 문자를 보내고 서둘러 음식을 먹어요. 그 결과, 오해 섞인 메시지가 오가고 소화 불량까지 겪게 됩니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 저자의 주장이에요. 샌드위치를 먹을 때는 오직 맛을 느끼는 데만 집중하세요. 문자는 그다음으로 미루는 것이 훨씬 건강한 방식이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 현대인의 식사 중 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">멀티태스킹\u003c/b>이라는 문제를 먼저 지적합니다. 그 후 멀티태스킹이 인체에 미치는 부정적인 영향을 설명하며 인과관계를 드러냅니다. 마지막에 가서야 구체적인 해결책으로 식사와 문자를 분리하는 행동을 제안합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>If (2)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>The result (7)\u003c/b>\u003cspan>결과 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">always on\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">multitasking\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">forces are diverted\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">nervous indigestion\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Eat your sandwich\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>가상 콘텐츠(디지털 활동)\u003c/th>\u003cth>물리적 내용물(음식)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>주의력 분산 유발\u003c/td>\u003ctd>소화 작용 대상\u003c/td>\u003c/tr>\u003ctr>\u003ctd>멀티태스킹의 원인\u003c/td>\u003ctd>집중해야 할 본질\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제 제기 후 원인과 결과를 분석하고 마지막에 해결책을 제시하는 문제 해결 구조예요. 주제문은 마지막 부근인 여덟 번째 문장, 즉 샌드위치를 먹으라는 대목에 있죠. 그래서 결론을 나중에 보여주는 미괄식 구성을 띄고 있어요.","hl":"ty"},{"n":9,"text":"글 중간에 보면 If라는 단어로 조건 상황을 만들고, The result라는 표현으로 인과관계를 아주 명확하게 짚어주고 있어요. 이런 신호어들을 잘 따라가면 필자가 무엇을 문제 삼고 있는지 쉽게 파악할 수 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>always on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>항상 접속되어 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>constantly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>끊임없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>ingest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>섭취하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>content\u003c/b>\u003cem>명사\u003c/em>\u003cspan>내용물, 콘텐츠\u003c/span>\u003c/div>\u003cdiv>\u003cb>multitasking\u003c/b>\u003cem>명사\u003c/em>\u003cspan>멀티태스킹\u003c/span>\u003c/div>\u003cdiv>\u003cb>overloading\u003c/b>\u003cem>동사\u003c/em>\u003cspan>과부하를 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>will\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의지\u003c/span>\u003c/div>\u003cdiv>\u003cb>attempt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>digest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>virtual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가상의\u003c/span>\u003c/div>\u003cdiv>\u003cb>diverted\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분산되다, 전환되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>physical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>물리적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>skilled\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>능숙한\u003c/span>\u003c/div>\u003cdiv>\u003cb>half-hearted\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>성의 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>shorthand\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>속기의, 짧게 줄인\u003c/span>\u003c/div>\u003cdiv>\u003cb>hurriedly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>급하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>misunderstood\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>오해받는\u003c/span>\u003c/div>\u003cdiv>\u003cb>clarifying\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>분명히 설명하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>nervous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신경성의\u003c/span>\u003c/div>\u003cdiv>\u003cb>indigestion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소화 불량\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요 단어로는 ingest, 즉 섭취하다라는 단어와 가상의라는 뜻인 virtual을 꼭 알아두세요. physical과 대조되는 개념으로 자주 나오니까요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">constant\u003c/b>\u003cspan class=\"m\">끊임없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">continuous\u003c/span>\u003cspan class=\"s\">perpetual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">intermittent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">divert\u003c/b>\u003cspan class=\"m\">분산시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">distract\u003c/span>\u003cspan class=\"s\">redirect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">focus\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">virtual\u003c/b>\u003cspan class=\"m\">가상의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">digital\u003c/span>\u003cspan class=\"s\">online\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">physical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">physical\u003c/b>\u003cspan class=\"m\">물리적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">material\u003c/span>\u003cspan class=\"s\">tangible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">virtual\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">skilled\u003c/b>\u003cspan class=\"m\">능숙한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">proficient\u003c/span>\u003cspan class=\"s\">adept\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inept\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hurriedly\u003c/b>\u003cspan class=\"m\">급하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rushedly\u003c/span>\u003cspan class=\"s\">hastily\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">leisurely\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘인 constant는 continuous로 바꿔 쓸 수 있고 반대말은 간헐적인이라는 의미의 intermittent예요. divert는 distract나 redirect로 쓰이고, 집중하다인 focus가 반대말이죠. physical은 물질적인이라는 material과 같고 가상의라는 virtual과 대조된다는 점 꼭 기억하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 '항상 접속되어' 있을 때\u003c/span>\u003cspan class=\"en\">When we are 'always on'\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 끊임없이 콘텐츠를 섭취한다\u003c/span>\u003cspan class=\"en\">we are constantly ingesting content\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">― 알림과 문자 읽기, 좋아요 누르기, 이메일 확인하기,\u003c/span>\u003cspan class=\"en\">― \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">reading \u003c/span>\u003cspan class=\"tgt\">alerts \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">texts, \u003c/span>\u003cspan class=\"tgt\">liking, \u003c/span>\u003cspan class=\"tgt\">checking \u003c/span>\u003cspan class=\"tgt\">emails, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다운로드하기, 업로드하기, 업그레이드하기, 업데이트하기, 삭제하기,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">downloading, \u003c/span>\u003cspan class=\"tgt\">uploading, \u003c/span>\u003cspan class=\"tgt\">upgrading, \u003c/span>\u003cspan class=\"tgt\">updating, \u003c/span>\u003cspan class=\"tgt\">deleting, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">답변 제출하기, 그리고 게시물 올리기와 같이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">submitting \u003c/span>\u003cspan class=\"tgt\">responses, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">posting.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 ‘항상 접속되어’ 있을 때 우리는 알림과 문자 읽기, ‘좋아요’ 누르기, 이메일 확인하기, 다운로드하기, 업로드하기, 업그레이드하기, 업데이트하기, 삭제하기, 답변 제출하기, 그리고 게시물 올리기와 같이 끊임없이 콘텐츠를 섭취한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현대인이 디지털 기기에 매몰되어 겪는 \u003cb class=\"key\">과잉 \u003c/b>\u003cb class=\"key\">자극\u003c/b> 상태를 설명해요. 수많은 디지털 활동을 \u003cb class=\"key\">섭취\u003c/b>라는 표현으로 비유하여 우리가 끊임없이 정보를 받아들이고 있음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사의 병렬 구조\u003c/span> : 동명사(ing) + , + 동명사(ing) + ... + and + 동명사(ing) : \"알림 읽기부터 게시물 올리기까지의 활동들\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"When we are 'always on', 우리가 '항상 접속되어' 있을 때. we are constantly ingesting content, 우리는 끊임없이 콘텐츠를 섭취한다. ― reading alerts and texts, liking, checking emails, ― 알림과 문자 읽기, 좋아요 누르기, 이메일 확인하기. downloading, uploading, upgrading, updating, deleting, 다운로드하기, 업로드하기, 업그레이드하기, 업데이트하기, 삭제하기. submitting responses, and posting, 답변 제출하기, 그리고 게시물 올리기와 같이. 이 문장 전체를 해석하면, 우리가 ‘항상 접속되어’ 있을 때 우리는 알림과 문자 읽기, ‘좋아요’ 누르기, 이메일 확인하기, 다운로드하기, 업로드하기, 업그레이드하기, 업데이트하기, 삭제하기, 답변 제출하기, 그리고 게시물 올리기와 같이 끊임없이 콘텐츠를 섭취한다.","hl":"m"},{"n":13,"text":"여러분, 첫 번째 문장은 우리가 디지털 기기를 쓸 때 뇌가 겪는 과잉 자극을 말해요. 여기서 콘텐츠를 먹는다는 섭취라는 단어를 쓴 건, 우리가 마치 음식을 먹듯 쉼 없이 정보를 받아들이고 있다는 걸 강조하기 위해서예요.","hl":"mn"},{"n":14,"text":"첫 번째로, 하이픈 뒤에 줄줄이 이어지는 단어들을 보세요. 모두 ing로 끝나죠? 이건 동명사들이 줄지어 있는 병렬 구조예요. 나열되는 항목들이 같은 자격이라는 걸 동명사라는 형태를 통해 명확히 보여주는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 우리가 그것을 한다면\u003c/span>\u003cspan class=\"en\">If we do it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 먹는 동안\u003c/span>\u003cspan class=\"en\">while we are eating,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 멀티태스킹은 우리에게 과부하를 주고 있다.\u003c/span>\u003cspan class=\"en\">our multi-tasking \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">overloading\u003c/span> us.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 우리가 음식을 먹는 동안 그것을 한다면, 우리의 멀티태스킹은 우리에게 과부하를 주고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 식사라는 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">행위\u003c/b>와 디지털 콘텐츠 소비라는 \u003cb class=\"key\">가상 \u003c/b>\u003cb class=\"key\">행위\u003c/b>를 동시에 할 때 발생하는 부정적 결과를 경고합니다. 우리 뇌가 한 번에 두 가지 일을 처리하느라 \u003cb class=\"key\">과부하\u003c/b> 상태가 된다는 점을 지적하죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + 동사원형-ing : \"과부하를 주고 있는 중이다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"If we do it, 만약 우리가 그것을 한다면. while we are eating, 우리가 먹는 동안. our multi-tasking is overloading us, 우리의 멀티태스킹은 우리에게 과부하를 주고 있다.. 이 문장 전체를 해석하면, 만약 우리가 음식을 먹는 동안 그것을 한다면, 우리의 멀티태스킹은 우리에게 과부하를 주고 있다.","hl":"m"},{"n":16,"text":"두 번째 문장은 식사 시간에 폰을 보지 말라는 핵심 주제를 예고해요. 음식을 먹는 행위와 콘텐츠 소비를 동시에 하는 멀티태스킹이 우리 뇌에 엄청난 무리를 준다는 걸 아주 명확하게 짚어주고 있죠.","hl":"mn"},{"n":17,"text":"여기서는 is overloading이라는 현재진행형이 쓰였는데요. 단순히 과부하를 준다는 게 아니라, 지금 이 순간에도 계속해서 우리 뇌를 힘들게 하고 있다는 진행의 의미를 더 강조하는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 의지가 가상 콘텐츠를 소화하려고 시도함에 따라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">attempts \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">digest\u003c/span> the virtual content\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 힘은 분산된다\u003c/span>\u003cspan class=\"en\">its forces \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">diverted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물리적 내용물인 우리의 음식으로부터\u003c/span>\u003cspan class=\"en\">from the physical content, our food.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 의지가 가상 콘텐츠를 소화하려고 시도함에 따라, 그것의 힘은 물리적 내용물인 우리의 음식으로부터 분산된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리의 주의력(의지)은 한정된 자원임을 말합니다. 가상 세계에 집중하느라 정작 \u003cb class=\"key\">식사\u003c/b>라는 물리적 행위에 필요한 에너지가 \u003cb class=\"key\">분산\u003c/b>되어 소화 기능까지 떨어질 수 있음을 경고하는 핵심 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as(~함에 따라)\u003c/span> : As + 주어 + 동사 : \"우리의 의지가 소화하려고 시도함에 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + 과거분사(p.p.) : \"분산된다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"As our will attempts to digest the virtual content, 우리의 의지가 가상 콘텐츠를 소화하려고 시도함에 따라. its forces are diverted, 그것의 힘은 분산된다. from the physical content, our food, 물리적 내용물인 우리의 음식으로부터. 이 문장 전체를 해석하면, 우리의 의지가 가상 콘텐츠를 소화하려고 시도함에 따라, 그것의 힘은 물리적 내용물인 우리의 음식으로부터 분산된다.","hl":"m"},{"n":19,"text":"세 번째 문장은 글의 논리가 돋보이는 문장이에요. 우리가 가상 콘텐츠를 볼 때 쓰는 에너지가 한정되어 있는데, 이걸 폰 보는 데 다 써버리면 정작 밥 먹는 데 쓸 힘이 없어서 분산된다는 거죠. 아주 중요한 통찰입니다.","hl":"mn"},{"n":20,"text":"첫 번째로 as는 여기서 상황이 바뀌는 과정이라는 뜻으로 쓰였고요. 두 번째로 are diverted를 보세요. 힘은 스스로 나뉘는 게 아니라 멀티태스킹 때문에 나뉘어지는 거니까 수동태를 써야 완벽한 문장이 되는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class
