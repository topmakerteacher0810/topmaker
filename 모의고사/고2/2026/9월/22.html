}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 22번","audioDir":"22_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">22번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Measuring the Mass of Stars: Theory-Laden Measurement\u003c/h1>\u003ch2>별의 질량 측정과 이론의 역할\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이 글은 \u003cb class=\"key\">볼링공\u003c/b>은 \u003cb class=\"key\">저울\u003c/b>로 직접 \u003cb class=\"key\">질량\u003c/b>을 재지만, \u003cb class=\"key\">쌍성\u003c/b>의 \u003cb class=\"key\">질량\u003c/b>은 \u003cb class=\"key\">케플러 \u003c/b>\u003cb class=\"key\">제3법칙\u003c/b> 같은 \u003cb class=\"key\">이론\u003c/b>을 바탕으로 다른 \u003cb class=\"key\">수치\u003c/b>들을 측정해 \u003cb class=\"key\">계산\u003c/b>한다는 것을 보여 준다. 따라서 \u003cb class=\"key\">측정\u003c/b>은 독립적 속성의 단순한 추정이 아니라 \u003cb class=\"key\">인정된 \u003c/b>\u003cb class=\"key\">이론\u003c/b>을 배경으로 한 \u003cb class=\"key\">크기\u003c/b>의 \u003cb class=\"key\">결정\u003c/b>이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Measurement is not a simple and unmediated estimation but a determination of certain magnitudes before the background of accepted theories.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 살펴볼 지문은 별의 질량을 어떻게 측정하는지에 대한 글입니다. 이 글은 볼링공처럼 직접 저울에 올려 재는 측정과 달리 별의 질량은 여러 이론을 바탕으로 계산한다는 내용을 다룹니다. 핵심 요지는 measurement is not a simple and unmediated estimation but a determination of certain magnitudes before the background of accepted theories, 즉 측정은 단순하고 중재되지 않은 추정이 아니라 인정된 이론들을 배경으로 특정 크기들을 결정하는 일이라는 것입니다. 그럼 본문을 함께 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">과학에서 \u003cb class=\"key\">측정\u003c/b>은 흔히 자(ruler)나 저울(balance)처럼 도구로 직접 값을 읽는 일로 여겨진다. 하지만 천문학에서는 별을 저울에 올릴 수 없어 \u003cb class=\"key\">간접 \u003c/b>\u003cb class=\"key\">측정\u003c/b>이 필요하다. \u003cb class=\"key\">쌍성\u003c/b>(binary star)은 두 별이 서로의 주위를 도는 계로, 두 별의 공통 \u003cb class=\"key\">질량 \u003c/b>\u003cb class=\"key\">중심\u003c/b>(center of mass)과 \u003cb class=\"key\">공전 \u003c/b>\u003cb class=\"key\">주기\u003c/b>(period)를 관측할 수 있다. 여기에 \u003cb class=\"key\">케플러 \u003c/b>\u003cb class=\"key\">제3법칙\u003c/b>(Kepler's Third Law)을 적용하면 질량을 계산할 수 있다. 이는 마치 체중계로 직접 몸무게를 재는 대신, 자동차의 연비와 주행 거리로 기름 소비량을 알아내는 것과 비슷하다. 즉 측정은 \u003cb class=\"key\">이론\u003c/b>이라는 배경 없이 이루어지기 어렵다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 간단히 짚고 갈게요. 과학에서 측정은 흔히 자나 저울처럼 도구로 값을 직접 읽는 일이라고 생각하기 쉽죠. 그런데 천문학에서는 별을 저울에 올릴 수 없기 때문에 간접 측정이 필요합니다. 쌍성은 두 별이 서로의 주위를 도는 계인데, 두 별의 공통 질량 중심과 공전 주기를 관측할 수 있어요. 여기에 케플러 제3법칙을 적용하면 질량을 계산할 수 있습니다. 이것은 체중계로 직접 몸무게를 재는 대신 자동차의 연비와 주행 거리로 기름 소비량을 알아내는 것과 비슷합니다. 결국 측정은 이론이라는 배경 없이 이루어지기 어렵습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>일상적 질량 측정\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>볼링공은 \u003cb class=\"key\">저울\u003c/b>에 올려 이미 알고 있는 금속 큐브 질량과 비교하는 \u003cb class=\"key\">직접 \u003c/b>\u003cb class=\"key\">측정\u003c/b>이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>별 질량 측정의 난관\u003csmall>전환 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>먼 별은 저울에 올릴 수 없으므로 \u003cb class=\"key\">측정\u003c/b>이 훨씬 복잡해지고, 어떻게 측정할지 \u003cb class=\"key\">질문\u003c/b>을 던진다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>쌍성 질량 계산\u003csmall>근거 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>별 질량 측정에는 다양한 \u003cb class=\"key\">이론\u003c/b>이 필요하며, \u003cb class=\"key\">쌍성\u003c/b>의 경우 \u003cb class=\"key\">질량 \u003c/b>\u003cb class=\"key\">중심\u003c/b>, 거리, \u003cb class=\"key\">공전 \u003c/b>\u003cb class=\"key\">주기\u003c/b>, \u003cb class=\"key\">케플러 \u003c/b>\u003cb class=\"key\">제3법칙\u003c/b>을 이용해 \u003cb class=\"key\">계산\u003c/b>한다. 즉 다른 \u003cb class=\"key\">수치\u003c/b>를 측정해 \u003cb class=\"key\">방정식\u003c/b>으로 질량을 구한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>측정의 재정의\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>측정은 독립적으로 존재하는 속성의 \u003cb class=\"key\">단순하고 \u003c/b>\u003cb class=\"key\">중재되지 \u003c/b>\u003cb class=\"key\">않은 \u003c/b>\u003cb class=\"key\">측정\u003c/b>이 아니라, \u003cb class=\"key\">인정된 \u003c/b>\u003cb class=\"key\">이론\u003c/b>을 배경으로 한 \u003cb class=\"key\">크기\u003c/b>의 결정이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 정리해 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 일상적인 질량 측정입니다. 저자는 볼링공의 질량을 재기 위해 저울에 올려놓고 이미 알고 있는 금속 큐브와 비교한다고 말합니다. 이건 직접 측정의 전형적인 사례이죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 별 질량 측정의 난관입니다. 먼 별은 저울에 올릴 수 없으니 상황이 훨씬 복잡해집니다. 그래서 저자는 어떻게 측정할지 질문을 던집니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 쌍성 질량의 계산입니다. 별의 질량을 측정하려면 다양한 이론이 필요하고, 쌍성의 경우 질량 중심과 거리, 공전 주기, 케플러 제3법칙을 이용해 계산합니다. 다시 말해 다른 수치를 측정해 방정식으로 질량을 구하는 것이죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 측정의 재정의입니다. 마지막 문장에서 측정은 독립적으로 존재하는 속성의 단순하고 중재되지 않은 추정이 아니라 인정된 이론들을 배경으로 특정 크기들을 결정하는 일이라고 결론 내립니다. 여기서 저자의 핵심 주장이 드러납니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">볼링공\u003c/b>의 직접 측정을 제시하고, 이어서 \u003cb class=\"key\">쌍성\u003c/b>의 질량 측정이 복잡하다고 대조한다. 문장 5와 6에서 \u003cb class=\"key\">케플러 \u003c/b>\u003cb class=\"key\">제3법칙\u003c/b>과 \u003cb class=\"key\">방정식\u003c/b>을 통한 계산을 설명한 뒤, 문장 7에서 결론을 내린다. 따라서 전개 방식은 \u003cb class=\"key\">비교·대조\u003c/b>이고, 결론이 마지막에 있으므로 \u003cb class=\"key\">미괄식\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>How do I measure it? (3)\u003c/b>\u003cspan>질문\u003c/span>\u003cb>In other words (6)\u003c/b>\u003cspan>재진술\u003c/span>\u003cb>but (7)\u003c/b>\u003cspan>대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">measure the mass\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">measuring the mass of a star\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">measure other quantities\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">calculate the mass\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">determination of certain magnitudes\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>볼링공 질량 측정\u003c/th>\u003cth>별 질량 측정\u003c/th>\u003c/tr>\u003ctr>\u003ctd>저울에 올려 비교\u003c/td>\u003ctd>질량 중심·거리·주기 관측\u003c/td>\u003c/tr>\u003ctr>\u003ctd>이미 알고 있는 질량과 직접 비교\u003c/td>\u003ctd>케플러 제3법칙으로 계산\u003c/td>\u003c/tr>\u003ctr>\u003ctd>단순하고 직접적임\u003c/td>\u003ctd>다양한 이론 필요\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 비교와 대조입니다. 첫 문장에서 볼링공의 직접 측정을 제시하고, 이어서 쌍성의 질량 측정이 복잡하다고 대조하죠. 문장 다섯과 여섯에서 케플러 제3법칙과 방정식을 통한 계산을 설명한 뒤, 마지막 문장에서 결론을 내리고 있습니다. 결론이 마지막에 있으므로 전체 구조는 미괄식이에요.","hl":"ty"},{"n":9,"text":"신호어를 확인해 볼게요. 세 번째 문장의 How do I measure it은 질문을 던져 화제를 전환합니다. 여섯 번째 문장의 In other words는 앞의 쌍성 측정 과정을 다시 진술하는 신호입니다. 마지막 문장의 but은 단순한 직접 측정이 아니라 이론 기반의 결정이라는 대조를 드러냅니다. 또 measure the mass, measuring the mass of a star, measure other quantities, determination of certain magnitudes 같은 표현이 같은 개념을 되풀이하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>determine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결정하다, 알아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mass\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질량\u003c/span>\u003c/div>\u003cdiv>\u003cb>bowling ball\u003c/b>\u003cem>명사\u003c/em>\u003cspan>볼링공\u003c/span>\u003c/div>\u003cdiv>\u003cb>balance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>저울\u003c/span>\u003c/div>\u003cdiv>\u003cb>compare\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비교하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>known\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>알려진\u003c/span>\u003c/div>\u003cdiv>\u003cb>metal cube\u003c/b>\u003cem>명사\u003c/em>\u003cspan>금속 큐브\u003c/span>\u003c/div>\u003cdiv>\u003cb>weigh\u003c/b>\u003cem>동사\u003c/em>\u003cspan>무게가 나가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>complicated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>복잡한\u003c/span>\u003c/div>\u003cdiv>\u003cb>distant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>먼\u003c/span>\u003c/div>\u003cdiv>\u003cb>star\u003c/b>\u003cem>명사\u003c/em>\u003cspan>별\u003c/span>\u003c/div>\u003cdiv>\u003cb>measure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>측정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>roughly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대략적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>involve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다, 수반하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>theory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이론\u003c/span>\u003c/div>\u003cdiv>\u003cb>binary star\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쌍성\u003c/span>\u003c/div>\u003cdiv>\u003cb>center of mass\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질량 중심\u003c/span>\u003c/div>\u003cdiv>\u003cb>distance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>거리\u003c/span>\u003c/div>\u003cdiv>\u003cb>period\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공전 주기\u003c/span>\u003c/div>\u003cdiv>\u003cb>Kepler's Third Law\u003c/b>\u003cem>명사\u003c/em>\u003cspan>케플러 제3법칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>calculate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in other words\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 말해서\u003c/span>\u003c/div>\u003cdiv>\u003cb>quantity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수치, 양\u003c/span>\u003c/div>\u003cdiv>\u003cb>value\u003c/b>\u003cem>명사\u003c/em>\u003cspan>값\u003c/span>\u003c/div>\u003cdiv>\u003cb>equation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방정식\u003c/span>\u003c/div>\u003cdiv>\u003cb>measurement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>측정\u003c/span>\u003c/div>\u003cdiv>\u003cb>unmediated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중재되지 않은, 직접적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>magnitude\u003c/b>\u003cem>명사\u003c/em>\u003cspan>크기\u003c/span>\u003c/div>\u003cdiv>\u003cb>background\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배경, 바탕\u003c/span>\u003c/div>\u003cdiv>\u003cb>accepted\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정립된, 인정된\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 짚어 볼게요. balance는 저울, mass는 질량, binary star는 쌍성, center of mass는 질량 중심입니다. period는 공전 주기, Kepler's Third Law는 케플러 제3법칙, equation은 방정식이죠. measurement는 측정, unmediated는 중재되지 않은, magnitude는 크기라는 뜻으로 정리해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">measure\u003c/b>\u003cspan class=\"m\">측정하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">quantify\u003c/span>\u003cspan class=\"s\">assess\u003c/span>\u003cspan class=\"s\">gauge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">guess\u003c/span>\u003cspan class=\"a\">estimate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">complicated\u003c/b>\u003cspan class=\"m\">복잡한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">complex\u003c/span>\u003cspan class=\"s\">intricate\u003c/span>\u003cspan class=\"s\">involved\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003cspan class=\"a\">straightforward\u003c/span>\u003cspan class=\"a\">plain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distant\u003c/b>\u003cspan class=\"m\">먼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">remote\u003c/span>\u003cspan class=\"s\">faraway\u003c/span>\u003cspan class=\"s\">far-off\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">near\u003c/span>\u003cspan class=\"a\">close\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accepted\u003c/b>\u003cspan class=\"m\">정립된, 인정된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">established\u003c/span>\u003cspan class=\"s\">recognized\u003c/span>\u003cspan class=\"s\">acknowledged\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rejected\u003c/span>\u003cspan class=\"a\">controversial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">calculate\u003c/b>\u003cspan class=\"m\">계산하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">compute\u003c/span>\u003cspan class=\"s\">determine\u003c/span>\u003cspan class=\"s\">work out\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">guess\u003c/span>\u003cspan class=\"a\">estimate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">simple\u003c/b>\u003cspan class=\"m\">단순한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">plain\u003c/span>\u003cspan class=\"s\">straightforward\u003c/span>\u003cspan class=\"s\">uncomplicated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">complicated\u003c/span>\u003cspan class=\"a\">complex\u003c/span>\u003cspan class=\"a\">intricate\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 함께 봅시다. measure는 quantify, assess, gauge와 바꿔 쓸 수 있어요. complicated는 complex, intricate와 유의어이고 반의어로 simple, straightforward가 있어요. distant는 remote, faraway와 유의어이고 near, close와 반대입니다. accepted는 established, recognized와 유의어이고 rejected, controversial와 반대입니다. calculate는 compute, determine와 유의어이고 guess, estimate와 반대되는 정밀한 계산의 뉘앙스를 기억하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 볼링공의 질량을 측정하기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">determine \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mass \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">bowling \u003c/span>\u003cspan class=\"tgt\">ball\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그것을 저울에 올려놓을 수도 있고\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">onto \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">balance \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 이미 알고 있는 질량과 비교할 수 있는데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">compare \u003c/span>\u003cspan class=\"tgt\">it\u003c/span> with a known mass,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어 여러 개의 금속 큐브 같은\u003c/span>\u003cspan class=\"en\">such as a number of metal cubes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각각 1그램, 10그램, 또는 100그램이 나가는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">weighing \u003c/span>\u003cspan class=\"tgt\">1, \u003c/span>\u003cspan class=\"tgt\">10, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">100 \u003c/span>\u003cspan class=\"tgt\">grams\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">볼링공 질량을 측정하기 위해, 나는 그것을 저울에 올려놓고 각 1g, 10g, 또는 100g이 나가는 여러 개의 금속 큐브 같은 이미 알고 있는 질량과 그것을 비교할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 볼링공 질량을 재는 일상적인 방법을 제시해요. 저울에 올려 \u003cb class=\"key\">비교\u003c/b>하는 방식이며, 특히 이미 알고 있는 \u003cb class=\"key\">질량\u003c/b>을 기준으로 삼는다는 점을 보여줍니다. 이후 별의 질량 측정과 \u003cb class=\"key\">대비\u003c/b>되는 도입 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : To determine + 목적어(the mass of my bowling ball) + , 주어 + 동사 : \"내 볼링공의 질량을 측정하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 might + 동사원형\u003c/span> : 주어 + might + 동사원형(put) and (동사원형) compare + 목적어 : \"그것을 저울에 올려놓고 비교할 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사 구문(each + -ing)\u003c/span> : 명사(metal cubes) + each + 현재분사(weighing) + 수량 : \"각각 1, 10, 또는 100그램이 나가는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"To determine the mass of my bowling ball, 내 볼링공의 질량을 측정하기 위해. I might put it onto a balance, 나는 그것을 저울에 올려놓을 수도 있고. and compare it with a known mass, 그것을 이미 알고 있는 질량과 비교할 수 있는데. such as a number of metal cubes, 예를 들어 여러 개의 금속 큐브 같은. each weighing 1, 10, or 100 grams, 각각 1그램, 10그램, 또는 100그램이 나가는.. 이 문장 전체를 해석하면, 볼링공 질량을 측정하기 위해, 나는 그것을 저울에 올려놓고 각 1g, 10g, 또는 100g이 나가는 여러 개의 금속 큐브 같은 이미 알고 있는 질량과 그것을 비교할 수 있다.","hl":"m"},{"n":13,"text":"이 문장은 볼링공의 질량을 재는 아주 일상적인 방법을 소개하고 있어요. 저울에 올려서 이미 알고 있는 질량과 비교하는 방식이죠. 앞으로 나올 먼 별의 질량 측정과 대비시키는 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째로, To determine the mass of my bowling ball에서 To determine은 to부정사의 부사적 용법 목적입니다. 질량을 측정하기 위해라고 해석되죠. 두 번째로, might put은 조동사 might에 동사원형 put이 연결되어 가능성을 나타냅니다. 세 번째로, each weighing은 앞에 나온 metal cubes를 수식하는 현재분사 구문이고, 각각 무게가 얼마인지를 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상황은 훨씬 더 복잡해진다\u003c/span>\u003cspan class=\"en\">Things \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">get \u003c/span>\u003cspan class=\"tgt\">much \u003c/spa 다면. the mass of a distant star, 먼 별의 질량을. 이 문장 전체를 해석하면, 만약 내가 먼 별의 질량을 알고 싶다면 상황은 훨씬 더 복잡해진다.","hl":"m"},{"n":16,"text":"이 문장은 볼링공 질량을 재는 것과 달리, 먼 별의 질량을 재는 일은 훨씬 어렵다는 이야기를 하고 있어요. 앞의 일상적인 측정과 대비되면서 뒤에 이어질 설명을 기대하게 만드는 전환점 역할이죠.","hl":"mn"},{"n":17,"text":"첫 번째로, get much more complicated에서 get은 뒤에 형용사 보어가 오는 변화의 get입니다. much는 비교급 more complicated를 강조해 줘요. 두 번째로, if I want to know는 조건의 부사절입니다. 만약 내가 알고 싶다면이라는 조건을 나타내죠. 세 번째로, the mass of a distant star에서 of는 뒤에 있는 명사가 앞의 mass를 수식하게 만드는 전치사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 측정할까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">measure \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 어떻게 그것을 측정할까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 질문 형식으로 별 질량 측정 방법에 대한 \u003cb class=\"key\">의문\u003c/b>을 제기합니다. 두 번째 문장에서 복잡하다고 한 내용을 구체적으로 묻는 역할이며, 뒤에 나올 설명의 \u003cb class=\"key\">도입\u003c/b> 질문입니다. how로 시작하는 \u003cb class=\"key\">의문문\u003c/b>임을 주목해야 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 how + do + 주어 + 동사원형\u003c/span> : How + do + 주어 + 동사원형(measure) + 목적어(it)? : \"나는 어떻게 그것을 측정할까?\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"How, 어떻게. do I measure, 내가 측정할까. it?, 그것을. 이 문장 전체를 해석하면, 나는 어떻게 그것을 측정할까?","hl":"m"},{"n":19,"text":"이 문장은 먼 별의 질량을 어떻게 재는지 직접 질문하고 있어요. 앞 문장에서 복잡하다고 한 상황을 구체적으로 물으면서 다음 설명을 이끌어 내는 역할을 하죠.","hl":"mn"},{"n":20,"text":"How do I measure it에서 how는 방법을 묻는 의문사이고, 일반동사 measure를 사용한 의문문이라 조동사 do가 필요해요. do 뒤에는 동사원형 measure가 온다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 대략적으로 말할 수 있다\u003c/span>\u003cspan class=\"en\">We can roughly say\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">별의 질량을 측정하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">measuring \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mass \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">star \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 이론을 포함한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">involves \u003c/span>\u003cspan class=\"tgt\">various \u003c/span>\u003cspan class=\"tgt\">theories\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 별의 질량을 측정하는 것은 다양한 이론을 포함한다고 대략적으로 말할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 별의 질량 측정이 단순한 재기가 아니라 여러 과학 이론에 의존한다는 전체 논지의 도입부입니다. roughly say를 통해 정확한 정의보다는 대략적인 설명임을 암시합니다. 여기서 \u003cb class=\"key\">measuring \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">mass \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">star\u003c/b>는 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">이론\u003c/b>을 포함하는 과정이라고 말합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : say + [that + 완전한 절] : \"~한다고, ~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사(구) 주어\u003c/span> : measuring + 목적어(the mass of a star) + 동사(involves) : \"별의 질량을 측정하는 것은\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"We can roughly say, 우리는 대략적으로 말할 수 있다. that measuring the mass of a star, 별의 질량을 측정하는 것이. involves various theories, 다양한 이론을 포함한다고. 이 문장 전체를 해석하면, 우리는 별의 질량을 측정하는 것은 다양한 이론을 포함한다고 대략적으로 말할 수 있다.","hl":"m"},{"n":22,"text":"이 문장은 별의 질량을 측정하는 일이 그냥 저울에 올려놓는 것과 달리 여러 과학 이론을 필요로 한다는 전체 논지를 깔아 주는 문장이에요. roughly say라고 하면서 대략적으로 말할 수 있다고 한 점이 중요해요. measuring the mass of a star, 즉 별의 질량을 측정하는 것이 다양한 이론을 포함한다는 거죠.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 say 뒤에 오는 that절이에요. that measuring the mass of a star involves various theories 전체가 say의 목적어 자리에 있는 명사절이고, 이때 that은 명사절을 이끄는 접속사라서 따로 해석하지 않아요. 두 번째 포인트는 that절 안의 주어인 measuring the mass of a star입니다. measuring은 동명사이고 뒤에 the mass of a star라는 목적어를 데리고 와서 주어 역할을 하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 쌍성의 질량을 측정하기를 원한다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">measure \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mass \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">binary \u003c/span>\u003cspan class=\"tgt\">star\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 먼저 두 별들 사이의 질량 중심을 결정하고\u003c/span>\u003cspan class=\"en\">we first determine a center of mass between the two stars,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 다음에 우리가 그제서야 사용할 수 있는 그 중심으로부터 떨어진 그것들의 거리를\u003c/span>\u003cspan class=\"en\">then their distance from that center \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">then \u003c/span>\u003cspan class=\"tgt\">use\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공전 주기의 값과 케플러 제3법칙의 특정한 사례와 함께\u003c/span>\u003cspan class=\"en\">together with a value for the period and a certain instance of Kepler's Third Law,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">질량을 계산한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">calculate \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mass\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 쌍성의 질량을 측정하기를 원한다면, 질량을 계산하기 위해 우리는 먼저 두 별들 사이의 질량 중심을, 그 다음에 우리가 그제서야 사용할 수 있는 그 중심으로부터 떨어진 그것들의 거리를 공전 주기의 값과 케플러 제3 법칙의 특정한 사례를 가지고 측정한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 별의 질량 측정이 이론에 의존한다는 앞 문장을 쌍성의 예로 구체화합니다. 쌍성의 질량을 계산하려면 먼저 \u003cb class=\"key\">질량 \u003c/b>\u003cb class=\"key\">중심\u003c/b>을 정하고, 그 중심에서 별까지의 \u003cb class=\"key\">거리\u003c/b>를 구한 뒤 \u003cb class=\"key\">공전 \u003c/b>\u003cb class=\"key\">주기\u003c/b>와 케플러 제3법칙을 함께 사용해야 합니다. 즉 측정은 여러 단계와 이론을 거치는 복잡한 과정임을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 (if)\u003c/span> : If + 주어 + 동사(want) + to부정사구, 주절 : \"우리가 쌍성의 질량을 측정하기를 원한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 which\u003c/span> : 선행사(distance) + which + 주어(we) + can use : \"우리가 그때 사용할 수 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : use ... to calculate + 목적어 : \"질량을 계산하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"If we want to measure the mass of a binary star, 우리가 쌍성의 질량을 측정하기를 원한다면. we first determine a center of mass between the two stars, 우리는 먼저 두 별들 사이의 질량 중심을 결정하고. then their distance from that center which we can then use, 그 다음에 우리가 그제서야 사용할 수 있는 그 중심으로부터 떨어진 그것들의 거리를. together with a value for the period and a certain instance of Kepler's Third Law, 공전 주기의 값과 케플러 제3법칙의 특정한 사례와 함께. to calculate the mass, 질량을 계산한다. 이 문장 전체를 해석하면, 우리가 쌍성의 질량을 측정하기를 원한다면, 질량을 계산하기 위해 우리는 먼저 두 별들 사이의 질량 중심을, 그 다음에 우리가 그제서야 사용할 수 있는 그 중심으로부터 떨어진 그것들의 거리를 공전 주기의 값과 케플러 제3 법칙의 특정한 사례를 가지고 측정한다.","hl":"m"},{"n":25,"text":"이 문장은 별 질량 측정이 이론에 의존한다는 앞 내용을 쌍성이라는 구체적 예로 보여 줘요. 쌍성의 질량을 계산하려면 두 별 사이의 질량 중심을 먼저 잡고, 그 중심으로부터 각 별까지의 거리를 구해야 해요. 여기에 공전 주기의 값과 케플러 제3법칙의 특정한 사례를 함께 사용해서 질량을 계산한다는 거예요.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 문장 맨 앞에 나온 If 조건절이에요. If we want to measure the mass of a binary star는 우리가 쌍성의 질량을 측정하기를 원한다면이라는 조건을 나타내고, want 뒤의 to measure는 want의 목적어로 쓰인 to부정사예요. 두 번째 포인트는 which we can then use입니다. 이 which는 앞에 있는 their distance from that center, 즉 그 중심으로부터의 거리를 선행사로 받는 관계대명사이고, 절 안에서는 use의 목적어 역할을 해요. 세 번째 포인트는 문장 끝에 있는 to calculate the mass입니다. 이 to부정사는 목적을 나타내는 부사적 용법이라서 질량을 계산하기 위해라고 해석하면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 말해서\u003c/span>\u003cspan class=\"en\">In other words,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">별의 질량을 측정하기 위해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">&quot;measure&quot; \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">star \u003c/span>\u003cspan class=\"tgt\">mass\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 다른 수치들을 측정하고 그 값들을 사용한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">measure \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">quantities \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">values\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정한 방정식들과 함께\u003c/span>\u003cspan class=\"en\">together with certain equations,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">질량을 계산하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">calculate \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mass\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다시 말해서, 별의 질량을 ‘측정’하기 위해서 우리는 다양한 수치들을 측정하고 그 값들을 특정 방정식들과 함께 사용하여 질량을 계산한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 쌍성의 사례를 일반화하여 별의 질량 측정이 직접적이지 않음을 다시 말해 줍니다. 질량 자체를 재는 대신, 다른 \u003cb class=\"key\">수치\u003c/b>를 측정하고 \u003cb class=\"key\">방정식\u003c/b>에 대입해 계산한다는 것이 핵심입니다. 이는 측정이 독립된 성질의 단순한 확인이 아니라 \u003cb class=\"key\">이론\u003c/b>을 배경으로 한 결정임을 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : in order to + 동사원형(measure) : \"별의 질량을 측정하기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬\u003c/span> : measure + A + and + use + B : \"측정하고 사용한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : use ... to calculate + 목적어 : \"질량을 계산하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"In other words, 다시 말해서. in order to \"measure\" the star mass, 별의 질량을 측정하기 위해서. we measure other quantities and use those values, 우리는 다른 수치들을 측정하고 그 값들을 사용한다. together with certain equations, 특정한 방정식들과 함께. to calculate the mass, 질량을 계산하기 위해. 이 문장 전체를 해석하면, 다시 말해서, 별의 질량을 ‘측정’하기 위해서 우리는 다양한 수치들을 측정하고 그 값들을 특정 방정식들과 함께 사용하여 질량을 계산한다.","hl":"m"},{"n":28,"text":"이 문장은 앞선 쌍성의 예를 다시 말해서 정리해 주는 문장이에요. 별의 질량을 직접 재는 게 아니라, 다른 여러 수치를 먼저 측정하고 그 값들을 특정 방정식과 함께 사용해서 질량을 계산한다는 거죠. 결과적으로 별의 질량 측정은 단순한 관찰이 아니라 여러 이론을 바탕으로 한 계산 과정이라는 점을 강조해요.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 in order to measure the star mass입니다. in order to는 목적을 나타내는 to부정사로, 별의 질량을 측정하기 위해서라고 해석해요. 두 번째 포인트는 we measure other quantities and use those values에서 measure와 use가 and로 연결된 병렬 구조예요. 다른 수치를 측정하고 그 값들을 사용한다는 두 동작이 대등하게 이어져 있어요. 세 번째 포인트는 문장 끝의 to calculate the mass입니다. 이것도 목적을 나타내는 to부정사라서 질량을 계산하기 위해라고 해석하면 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">측정은 단순하고 중재되지 않은 측정이 아니라\u003c/span>\u003cspan class=\"en\">Measurement is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">simple \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">unmediated \u003c/span>\u003cspan class=\"tgt\">estimation \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독립적으로 존재하는 값들에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">independently \u003c/span>\u003cspan class=\"tgt\">existing \u003c/span>\u003cspan class=\"tgt\">properties, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오히려 특정 크기들의 계산이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">determination\u003c/span> of certain magnitudes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이미 정립된 여러 이론들을 바탕으로\u003c/span>\u003cspan class=\"en\">before the background of a number of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">accepted \u003c/span>\u003cspan class=\"tgt\">theories\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">측정은 독립적으로 존재하는 값들의 단순하고 중재되지 않은 측정이 아니라, 이미 정립된 여러 이론들을 바탕으로 특정 크기들을 계산하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 핵심 결론으로, 측정이 단순히 대상을 직접 읽는 행위가 아니라 \u003cb class=\"key\">받아들여진 \u003c/b>\u003cb class=\"key\">이론들\u003c/b>을 배경으로 이루어지는 \u003cb class=\"key\">이론 \u003c/b>\u003cb class=\"key\">의존적\u003c/b> 활동임을 정리한다. 별의 질량 측정처럼 이론과 방정식을 통해 값을 계산하는 과정을 일반화하며, not A but B 구조로 \u003cb class=\"key\">단순한 \u003c/b>\u003cb class=\"key\">측정관\u003c/b>을 부정하고 대안을 제시한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">not A but B 구문\u003c/span> : not + A(명사구) + but + B(명사구) : \"단순하고 중재되지 않은 측정이 아니라 특정 크기들의 계산\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : accepted(과거분사) + theories(명사) : \"받아들여진 이론들\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Measurement is not a simple and unmediated estimation, 측정은 단순하고 중재되지 않은 측정이 아니라. of independently existing properties, 독립적으로 존재하는 값들에 대한. but a determination of certain magnitudes, 오히려 특정 크기들의 계산이다. before the background of a number of accepted theories, 이미 정립된 여러 이론들을 바탕으로. 이 문장 전체를 해석하면, 측정은 독립적으로 존재하는 값들의 단순하고 중재되지 않은 측정이 아니라, 이미 정립된 여러 이론들을 바탕으로 특정 크기들을 계산하는 것이다.","hl":"m"},{"n":31,"text":"이 문장은 글 전체의 결론이에요. 측정이라는 게 그냥 대상을 직접 읽어서 값을 얻는 단순한 과정이 아니라, 이미 받아들여진 이론들을 배경으로 해서 특정한 크기들을 계산하는 행위라는 거죠. 앞에서 별의 질량을 측정할 때 여러 이론과 방정식을 사용했던 것처럼, 일반적인 측정도 이론에 의존한다는 점을 정리하고 있어요.","hl":"mn"},{"n":32,"text":"이 문장의 첫 번째 어법 포인트는 not A but B 구문입니다. Measurement is not a simple and unmediated estimation of independently existing properties, but a determination of certain magnitudes 이 부분에서 not 다음에는 a simple and unmediated estimation이라는 명사구, but 다음에는 a determination이라는 명사구가 왔어요. 둘 다 명사구로 병렬되었고, not 다음 내용을 부정한 뒤 but 다음 내용을 강조하고 있죠. 여기서는 단순한 측정이 아니라 이론에 근거한 계산이라는 뜻을 전달해요. 두 번째 어법 포인트는 accepted theories입니다. accepted는 과거분사로 뒤의 명사 theories를 수식해요. 그래서 받아들여진 이론들이라는 수동의 의미가 되는 거죠. 과거분사가 명사를 꾸며 주면 수동의 뜻을 표현한다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">볼링공\u003c/b>은 \u003cb class=\"key\">저울\u003c/b>에 올려 \u003cb class=\"key\">이미 \u003c/b>\u003cb class=\"key\">알고 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">질량\u003c/b>과 직접 비교하여 측정한다.\u003c/li>\u003cli>그러나 \u003cb class=\"key\">먼 \u003c/b>\u003cb class=\"key\">별\u003c/b>은 직접 측정할 수 없어 \u003cb class=\"key\">쌍성\u003c/b>의 \u003cb class=\"key\">질량 \u003c/b>\u003cb class=\"key\">중심\u003c/b>, 거리, \u003cb class=\"key\">공전 \u003c/b>\u003cb class=\"key\">주기\u003c/b>, \u003cb class=\"key\">케플러 \u003c/b>\u003cb class=\"key\">제3법칙\u003c/b>을 이용한다.\u003c/li>\u003cli>이처럼 별의 질량은 다른 \u003cb class=\"key\">수치\u003c/b>들을 측정해 \u003cb class=\"key\">방정식\u003c/b>으로 \u003cb class=\"key\">계산\u003c/b>하는 것이다.\u003c/li>\u003cli>따라서 \u003cb class=\"key\">측정\u003c/b>은 단순하고 중재되지 않은 추정이 아니라 \u003cb class=\"key\">인정된 \u003c/b>\u003cb class=\"key\">이론\u003c/b>을 배경으로 한 \u003cb class=\"key\">크기\u003c/b>의 결정이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Measurement is not a simple and unmediated estimation but a determination of certain magnitudes before the background of accepted theories.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 글은 \u003cb class=\"key\">볼링공\u003c/b>은 \u003cb class=\"key\">저울\u003c/b>로 직접 \u003cb class=\"key\">질량\u003c/b>을 재지만, \u003cb class=\"key\">쌍성\u003c/b>의 \u003cb class=\"key\">질량\u003c/b>은 \u003cb class=\"key\">케플러 \u003c/b>\u003cb class=\"key\">제3법칙\u003c/b> 같은 \u003cb class=\"key\">이론\u003c/b>을 바탕으로 다른 \u003cb class=\"key\">수치\u003c/b>들을 측정해 \u003cb class=\"key\">계산\u003c/b>한다는 것을 보여 준다. 따라서 \u003cb class=\"key\">측정\u003c/b>은 독립적 속성의 단순한 추정이 아니라 \u003cb class=\"key\">인정된 \u003c/b>\u003cb class=\"key\">이론\u003c/b>을 배경으로 한 \u003cb class=\"key\">크기\u003c/b>의 \u003cb class=\"key\">결정\u003c/b>이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글을 정리할게요. 볼링공은 저울로 직접 질량을 재지만 별은 그럴 수 없습니다. 쌍성의 질량은 질량 중심, 거리, 공전 주기, 케플러 제3법칙 같은 이론을 통해 계산하죠. 그래서 측정은 단순한 직접 읽기가 아니라 인정된 이론을 배경으로 특정 크기를 결정하는 일입니다. 이것이 이 지문의 핵심입니다. 오늘 수업은 여기까지입니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
