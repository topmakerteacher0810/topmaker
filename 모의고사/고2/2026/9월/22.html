i>에너지가 물리적 음식에서 가상 콘텐츠 처리로 분산됨(diverted)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03동시 작업의 부정적 결과</div><ul><li>급하게 식사하며 문자를 보내는 행동은 신체와 소통 모두에 악영향을 초래한다.</li><li>오해를 부르는 문자(misunderstood text) 발생 및 추가 해명 필요</li><li>신체적 문제인 신경성 소화불량(nervous indigestion) 시작</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04순차적 행동의 권고</div><ul><li>한 번에 하나의 일에 집중하여 발생할 수 있는 문제를 예방해야 한다.</li><li>먼저 음식에 온전히 집중하여 맛을 느끼고 삼킬 것</li><li>식사를 완전히 마친 후에 문자(text)를 보낼 것</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ingest</td><td class=\"m\">섭취하다, 흡수하다</td></tr><tr><td class=\"w\">content</td><td class=\"m\">콘텐츠, 내용물, 목차</td></tr><tr><td class=\"w\">alert</td><td class=\"m\">알림, 경계, 경보</td></tr><tr><td class=\"w\">overload</td><td class=\"m\">과부하가 걸리게 하다, 너무 많이 싣다</td></tr><tr><td class=\"w\">attempt</td><td class=\"m\">시도하다, 애쓰다</td></tr><tr><td class=\"w\">digest</td><td class=\"m\">소화하다, 완전히 이해하다</td></tr><tr><td class=\"w\">virtual</td><td class=\"m\">가상의, 사실상의</td></tr><tr><td class=\"w\">divert</td><td class=\"m\">전환시키다, 다른 데로 돌리다</td></tr><tr><td class=\"w\">physical</td><td class=\"m\">물리적인, 신체의, 물질적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be skilled at</td><td class=\"m\">~에 능숙하다, ~에 숙련되다</td></tr><tr><td class=\"w\">at the same time</td><td class=\"m\">동시에, 함께</td></tr><tr><td class=\"w\">half-hearted</td><td class=\"m\">마음이 내키지 않는, 열성이 없는</td></tr><tr><td class=\"w\">shorthand</td><td class=\"m\">약어의, 속기의, 간략화된</td></tr><tr><td class=\"w\">hurriedly</td><td class=\"m\">서둘러서, 황급히</td></tr><tr><td class=\"w\">clarify</td><td class=\"m\">명확하게 하다, 분명히 말하다</td></tr><tr><td class=\"w\">indigestion</td><td class=\"m\">소화 불량</td></tr><tr><td class=\"w\">go down</td><td class=\"m\">(음식물이) 넘어가다, 내려가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 &#39;항상 접속되어&#39; 있을 때</span><span class=\"en\"><b>When we are 'always on'</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 끊임없이 콘텐츠를 섭취한다</span><span class=\"en\"><b>we <span class=\"grammar-hl\">are constantly ingesting</span> content</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">― 알림과 문자 읽기, &#39;좋아요&#39; 누르기, 이메일 확인하기,</span><span class=\"en\"><b>― <span class=\"grammar-hl\">reading alerts and texts, liking, checking emails,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다운로드하기, 업로드하기, 업그레이드하기, 업데이트하기, 삭제하기,</span><span class=\"en\"><b><span class=\"grammar-hl\">downloading, uploading, upgrading, updating, deleting,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">답변 제출하기, 그리고 게시물 올리기</span><span class=\"en\"><b><span class=\"grammar-hl\">submitting responses, and posting</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리가 ‘항상 접속되어’ 있을 때 우리는 알림과 문자 읽기, ‘좋아요’ 누르기, 이메일 확인하기, 다운로드하기, 업로드하기, 업그레이드하기, 업데이트하기, 삭제하기, 답변 제출하기, 그리고 게시물 올리기와 같이 끊임없이 콘텐츠를 섭취한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> always on은 스마트폰이나 컴퓨터 같은 디지털 기기에 늘 연결되어 인터넷과 소셜 미디어 등을 쉴 새 없이 사용하는 현대인의 일상적인 상태를 가리킵니다. 글의 도입부로서 우리가 눈을 뜨고 있는 동안 얼마나 많은 정보와 자극을 들이마시고 배뱉고 있는지 나열하여 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are constantly ingesting (현재진행): be동사(are) + -ing(ingesting) 형태로, 현재 계속해서 진행 중인 동작(&#39;끊임없이 섭취하고 있다&#39;)을 나타낸다.</div><div class=\"lec-gr-item\">reading alerts and texts, liking, checking emails, downloading, uploading, upgrading, updating, deleting, submitting responses, and posting (분사구문): 문장의 부가적인 상황이나 주절과 동시에 일어나는 동작(부대상황)을 나타내는 현재분사(-ing)들의 병렬 구조이다. 원래 절은 &#39;while we read ..., like, check ..., download, upload, upgrade, update, delete, submit ..., and post&#39;로 볼 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ingest</td><td class=\"m\">섭취하다, 흡수하다</td></tr><tr><td class=\"w\">content</td><td class=\"m\">콘텐츠, 내용물, 목차</td></tr><tr><td class=\"w\">alert</td><td class=\"m\">알림, 경계, 경보</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 우리가 그것을 한다면</span><span class=\"en\"><b>If we do it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 먹는 동안,</span><span class=\"en\"><b>while we are eating,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 멀티태스킹은 우리에게 과부하를 주고 있다.</span><span class=\"en\"><b>our <span class=\"grammar-hl\">multi-tasking</span> <span class=\"grammar-hl\">is overloading</span> us.</b></span></div></div><div class=\"lec-sent-ko\">만약 우리가 음식을 먹는 동안 그것을 한다면, 우리의 멀티태스킹은 우리에게 과부하를 주고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 디지털 활동을 식사 시간에까지 병행하는 상황을 가정하며 문제점을 제기합니다. is overloading us는 뇌가 새로운 정보를 처리하는 동시에 입으로 음식을 씹어 삼키는 두 가지 일을 하려다 보니, 우리의 몸과 정신이 감당할 수 있는 한계를 넘어 무리를 겪게 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">multi-tasking (동명사): 동사(multi-task)에 -ing가 붙어 명사 역할을 하며, 문장의 주어로 쓰였다.</div><div class=\"lec-gr-item\">is overloading (현재진행): be동사(is) + -ing(overloading) 구조로, 현재 진행 중인 동작을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">overload</td><td class=\"m\">과부하가 걸리게 하다, 너무 많이 싣다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 의지가 가상 콘텐츠를 소화하려고 시도함에 따라</span><span class=\"en\"><b>As our will attempts <span class=\"grammar-hl\">to digest</span> the virtual content</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것의 힘은 분산된다</span><span class=\"en\"><b>its forces <span class=\"grammar-hl\">are diverted</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물리적 내용물인 우리의 음식으로부터.</span><span class=\"en\"><b>from <span class=\"grammar-hl\">the physical content, our food</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리의 의지가 가상 콘텐츠를 소화하려고 시도함에 따라, 그것의 힘은 물리적 내용물인 우리의 음식으로부터 분산된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;과부하&#39;가 일어나는 구체적인 원리를 설명합니다. 글쓴이는 여기서 digest the virtual content라는 표현으로 머릿속 정보 처리 과정을 음식 소화에 빗대어 묘사합니다. 우리의 정신적 에너지가 스마트폰 속 화면을 읽고 이해하는 데 집중되면서, 정작 눈앞의 음식을 씹고 넘기는 데 온전히 쓰여야 할 몸의 에너지는 엉뚱한 곳으로 빼앗겨 버린다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to digest (to부정사): 명사적 용법으로 쓰여 타동사 attempts의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">are diverted (수동태): be동사(are) + p.p.(diverted) 구조. 기본구조: divert A from B (A를 B로부터 딴 데로 돌리다/전환하다). divert는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are diverted 형태로 쓴다.</div><div class=\"lec-gr-item\">the physical content, our food (동격): 콤마(,)를 사용하여 the physical content와 our food가 같은 대상임을 나타내는 동격 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">content</td><td class=\"m\">콘텐츠, 내용물, 목차</td></tr><tr><td class=\"w\">attempt</td><td class=\"m\">시도하다, 애쓰다</td></tr><tr><td class=\"w\">digest</td><td class=\"m\">소화하다, 완전히 이해하다</td></tr><tr><td class=\"w\">virtual</td><td class=\"m\">가상의, 사실상의</td></tr><tr><td class=\"w\">divert</td><td class=\"m\">전환시키다, 다른 데로 돌리다</td></tr><tr><td class=\"w\">physical</td><td class=\"m\">물리적인, 신체의, 물질적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">쉬운 일이다</span><span class=\"en\"><b><span class=\"grammar-hl\">It's easy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">샌드위치를 먹는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">to eat</span> a sandwich</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1분 내로</span><span class=\"en\"><b>in a minute</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전화 통화를 하는 동안.</span><span class=\"en\"><b><span class=\"grammar-hl\">while talking</span> on the phone.</b></span></div></div><div class=\"lec-sent-ko\">전화 통화를 하는 동안 1분 내로 샌드위치를 먹는 것은 쉬운 일이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일상에서 흔히 볼 수 있는 구체적인 예시를 들어 앞선 설명을 뒷받침합니다. 디지털 기기 사용과 식사를 동시에 하는 행동이 얼마나 순식간에, 그리고 음식에 대한 아무런 자각 없이 일어나는지를 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It&#39;s easy to eat (가주어): 진주어: It은 가주어이고, 뒤의 to eat 이하가 진짜 주어인 진주어 역할을 한다.</div><div class=\"lec-gr-item\">to eat (to부정사): 문장의 진주어를 이끄는 명사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">while talking (분사구문): 접속사 while의 의미를 명확히 남겨둔 현재분사구문이다. 원래 절은 &#39;while we talk&#39; (또는 &#39;while we are talking&#39;)이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은 능숙하다</span><span class=\"en\"><b>Some people are skilled</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">두 가지를 하는 데</span><span class=\"en\"><b>at <span class=\"grammar-hl\">doing</span> both</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동시에.</span><span class=\"en\"><b><span class=\"grammar-hl\">at the same time</span>.</b></span></div></div><div class=\"lec-sent-ko\">어떤 사람들은 동시에 두 가지를 하는 데 능숙하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 샌드위치를 먹으며 폰을 사용하는 멀티태스킹 상황에서 겉보기에는 아무 문제 없이 밥 먹기와 스마트폰 하기를 척척 해내는 듯한 사람들의 경우를 언급합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">doing (동명사): 전치사 at의 목적어 역할을 하는 동명사이다.</div><div class=\"lec-gr-item\">at the same time (관용표현): &#39;동시에&#39;라는 뜻을 가진 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at the same time</td><td class=\"m\">동시에, 함께</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들은 성의 없고 짧게 줄인 문자를 쓴다</span><span class=\"en\"><b>Others write a half-hearted, shorthand text</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 샌드위치를 급하게 먹는 동안</span><span class=\"en\"><b>while they hurriedly eat their sandwich</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동시에.</span><span class=\"en\"><b><span class=\"grammar-hl\">at the same time</span>.</b></span></div></div><div class=\"lec-sent-ko\">다른 사람들은 샌드위치를 급하게 먹는 동시에 성의 없고 짧게 줄인 문자를 쓴다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과 대조적으로, 두 가지를 완벽하게 해내지 못해 이도 저도 안 되는 사람들의 모습을 묘사합니다. a half-hearted, shorthand text는 음식 먹는 데 신경이 팔리거나 여유가 없어서 성의 없이 대충 줄여 쓴 문자를 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">at the same time (관용표현): &#39;동시에&#39;라는 뜻을 가진 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">at the same time</td><td class=\"m\">동시에, 함께</td></tr><tr><td class=\"w\">half-hearted</td><td class=\"m\">마음이 내키지 않는, 열성이 없는</td></tr><tr><td class=\"w\">shorthand</td><td class=\"m\">약어의, 속기의, 간략화된</td></tr><tr><td class=\"w\">hurriedly</td><td class=\"m\">서둘러서, 황급히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그 결과는 오해 섞인 메시지일 수 있다</span><span class=\"en\"><b>The result can be a <span class=\"grammar-hl\">misunderstood</span> text</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더욱 명백히 설명하는 문자가 필요한</span><span class=\"en\"><b>with the need for further <span class=\"grammar-hl\">clarifying</span> texts</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 신경성 소화 불량의 시작.</span><span class=\"en\"><b>and the beginnings of nervous indigestion.</b></span></div></div><div class=\"lec-sent-ko\">그 결과는 더욱 명백히 설명하는 문자가 필요한 오해 섞인 메시지와 신경성 소화 불량의 시작일 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 5번과 6번 문장에서 언급한 식사 중 멀티태스킹이 결국 어떤 부작용을 낳는지 결론지어 줍니다. the need for further clarifying texts에서 짐작할 수 있듯 대충 보낸 문자 때문에 상대방이 뜻을 잘못 알아들어 다시 구구절절 설명해야 하는 수고로움이 생기고, 급하게 씹어 넘긴 샌드위치 탓에 배탈이 나는 등 식사도 소통도 모두 망치게 된다는 것을 구체적으로 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">misunderstood (과거분사(형용사)): misunderstood가 뒤의 명사 text를 수식하는 구조이다(= &#39;오해를 일으키는/잘못 이해된 문자&#39;).</div><div class=\"lec-gr-item\">clarifying (현재분사(형용사)): clarifying이 뒤의 명사 texts를 수식하는 구조이다(= &#39;명확히 설명하는 문자&#39;).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">digest</td><td class=\"m\">소화하다, 완전히 이해하다</td></tr><tr><td class=\"w\">clarify</td><td class=\"m\">명확하게 하다, 분명히 말하다</td></tr><tr><td class=\"w\">indigestion</td><td class=\"m\">소화 불량</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">샌드위치를 먹어라.</span><span class=\"en\"><b><span class=\"grammar-hl\">Eat</span> your sandwich.</b></span></div></div><div class=\"lec-sent-ko\">샌드위치를 먹어라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제기된 멀티태스킹의 문제점에 대한 해결책을 글쓴이가 짧고 단호한 명령문으로 제시하기 시작합니다. 밥을 먹을 때는 다른 것에 한눈팔지 말고 오직 먹는 행위 자체에만 집중하라는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Eat (명령문): 주어(You)가 생략되고 동사원형으로 시작하여 지시나 명령을 나타내는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">맛을 느껴라.</span><span class=\"en\"><b><span class=\"grammar-hl\">Taste</span> it.</b></span></div></div><div class=\"lec-sent-ko\">맛을 느껴라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 이어 식사에 온전히 집중하는 구체적인 방법을 알려줍니다. 스마트폰 화면에서 눈을 떼고 입안에 들어간 음식의 질감과 풍미를 충분히 느끼며 먹으라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Taste (명령문): 동사원형으로 시작하는 명령문 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것을 내려가게 하라.</span><span class=\"en\"><b><span class=\"grammar-hl\">Let it go</span> down.</b></span></div></div><div class=\"lec-sent-ko\">그것을 내려가게 하라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> Let it go down은 문자 그대로 음식이 목구멍으로 자연스럽게 넘어가게 두라는 뜻으로, 급하게 욱여넣지 말고 천천히 씹어 속으로 편안하게 내려가도록 소화의 과정을 온전히 누리라는 당부입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Let it go 5형식(SVOC) 구조: 사역동사 let + 목적어(it) + 목적격보어(go, 동사원형) 형태이다. 목적어가 목적격보어 하도록 &#39;하게 하다/내버려 두다&#39;의 의미를 만든다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">go down</td><td class=\"m\">(음식물이) 넘어가다, 내려가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 11 / 11</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러고 나서 문자를 보내라.</span><span class=\"en\"><b>Then <span class=\"grammar-hl\">text</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러고 나서 문자를 보내라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 최종 결론입니다. 식사를 완전히 끝마치고 난 뒤에야 비로소 스마트폰을 들고 문자를 보내든 다른 디지털 활동을 하든 한 번에 하나씩만 온전히 처리하라는 메시지를 분명하게 전달합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">text (명령문): 동사원형으로 쓰여 &#39;문자를 보내라&#39;는 명령을 나타낸다.</div></div>\n        ","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>현대인들은 늘 디지털 기기에 접속해 엄청난 양의 정보를 쉴 새 없이 처리한다.</li><li>밥을 먹으면서까지 스마트폰을 하는 멀티태스킹은 우리의 몸과 뇌에 과부하를 일으킨다.</li><li>정보 처리에 에너지를 뺏겨 소통에 오해가 생기거나 소화불량에 시달리는 부작용이 발생한다.</li><li>따라서 식사할 때는 오직 음식의 맛과 소화에만 집중하고, 디지털 기기 사용은 식사 후에 따로 해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Multitasking with digital devices during meals causes mental overload and physical indigestion, so we must focus entirely on eating before dealing with virtual content.</div>\n              <div class=\"lec-final-sum-ko\">식사 중 디지털 기기를 통한 다중 작업은 정신적 과부하와 신체적 소화불량을 유발하므로, 가상 콘텐츠를 다루기 전에 식사에 온전히 집중해야 한다.</div></div></div>"],"segs":[[{"audio":"./22_audio/1.mp3","hl":null}],[{"audio":"./22_audio/2.mp3","hl":null}],[{"audio":"./22_audio/3.mp3","hl":null},{"audio":"./22_audio/4.mp3","hl":"stage-0"},{"audio":"./22_audio/5.mp3","hl":"stage-1"},{"audio":"./22_audio/6.mp3","hl":"stage-2"},{"audio":"./
