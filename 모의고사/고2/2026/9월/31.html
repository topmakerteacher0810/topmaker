</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 31번","audioDir":"31_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">31번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Identifying Resources in Advance to Foster Creativity\u003c/h1>\u003ch2>창의성을 키우는 사전 자원 식별\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>학생의 \u003cb class=\"key\">창의성\u003c/b>을 가로막는 요인은 과제 수행에 필요한 \u003cb class=\"key\">자원\u003c/b>을 \u003cb class=\"key\">사전에 \u003c/b>\u003cb class=\"key\">인식하지 \u003c/b>\u003cb class=\"key\">못하는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이다. 각 활동에 필요한 자원을 미리 파악하면 \u003cb class=\"key\">수행이 \u003c/b>\u003cb class=\"key\">수월해지고\u003c/b>, 자원이 없더라도 \u003cb class=\"key\">주제 \u003c/b>\u003cb class=\"key\">변경\u003c/b>이나 \u003cb class=\"key\">대체 \u003c/b>\u003cb class=\"key\">자원\u003c/b> 탐색으로 이어져 창의성에 도움이 된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Identifying the resources needed for a learning task in advance can foster creativity, even when some of those resources are unavailable.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 다룰 지문은 창의성을 방해하는 요소와 자원 사전 인식의 중요성에 대한 글입니다. 이 글은 학생이 과제를 할 때 필요한 자원을 미리 파악하는 것이 창의성에 도움이 된다는 내용을 담고 있어요. 요약하면, 자원에 대한 무인식이 창의성을 막을 수 있고, 사전에 자원을 식별하면 수행이 쉬워지며 창의적 대안까지 이어질 수 있다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">창의성 creativity는 흔히 자유로운 발상으로 여겨지지만, 실제 학습 과제에서는 필요한 자원 resource을 인식하는 \u003cb class=\"key\">실용적 \u003c/b>\u003cb class=\"key\">판단\u003c/b>도 중요합니다. 예를 들어 학교 축제를 준비할 때 필요한 물품과 장소를 미리 확인하지 않으면 좋은 아이디어도 실행하기 어려운 것과 같아요. 이 글에서 말하는 자원은 실험실, 장비, 화학 물질 같은 \u003cb class=\"key\">물적 \u003c/b>\u003cb class=\"key\">자원\u003c/b>뿐 아니라 실험실 기술자, 구입 자금 같은 \u003cb class=\"key\">인적·재정적 \u003c/b>\u003cb class=\"key\">자원\u003c/b>까지 포함합니다. 사전 조사 prior investigation는 단순한 확인이 아니라 실현 가능성을 높이는 \u003cb class=\"key\">준비 \u003c/b>\u003cb class=\"key\">과정\u003c/b>입니다. 이런 \u003cb class=\"key\">자원 \u003c/b>\u003cb class=\"key\">인식\u003c/b> resource awareness은 창의성을 억제하기보다 오히려 대체 자원을 찾게 하여 \u003cb class=\"key\">창의성\u003c/b>을 자극할 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"창의성은 흔히 자유로운 아이디어 발상이라고 생각하기 쉽지만, 실제 학습 과제에서는 준비와 자원 확인이 매우 중요해요. 예를 들어 학교 축제를 준비할 때 필요한 물품과 장소, 돈과 도움을 줄 사람을 미리 확인하지 않으면 좋은 아이디어도 실행하기 어렵죠. 이 글에서 말하는 자원 resource이라는 개념은 실험실, 장비, 화학 물질 같은 물적 자원뿐 아니라 실험실 기술자나 구입 자금 같은 인적 자원 human resource과 재정적 자원 financial resource까지 포함해요. 사전 조사 prior investigation이라는 것은 단순한 확인이 아니라 실현 가능성을 높이는 준비 과정입니다. 이런 자원 인식 resource awareness은 창의성을 억제하기보다 오히려 대체 자원을 찾게 하여 창의성을 자극할 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>창의성을 막는 자원 무인식\u003csmall>문제 제기 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 번째와 두 번째 문장은 \u003cb class=\"key\">창의성\u003c/b>을 방해하는 요인으로 각 활동에 필요한 \u003cb class=\"key\">자원\u003c/b>에 대한 무인식을 지적합니다. 학생들은 자신에게 요구되는 과제를 수행하는 데 필요한 자원들을 제대로 \u003cb class=\"key\">식별\u003c/b>하지 못하는 경우가 많다고 설명합니다. 즉, 무엇이 필요한지 모르는 상태가 창의적 사고를 막는 출발점이 된다는 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>자원 인식의 이점\u003csmall>주장 · 문장 3\u003c/small>\u003c/h4>\u003cp>세 번째 문장은 자원이 \u003cb class=\"key\">특정 \u003c/b>\u003cb class=\"key\">학습 \u003c/b>\u003cb class=\"key\">과제\u003c/b>에 필수적일 수 있으며, 그것들을 \u003cb class=\"key\">인식\u003c/b>하면 활동 수행이 \u003cb class=\"key\">평이\u003c/b>해질 수 있다고 말합니다. 자원을 안다는 것이 단순한 준비물 확인을 넘어 과제 수행의 난이도를 낮춘다는 핵심 주장입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>실험 사례와 사전 조사\u003csmall>예시·근거 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>네 번째부터 여섯 번째 문장은 \u003cb class=\"key\">실험\u003c/b> 사례를 들어 설명합니다. 학생들이 프로젝트에서 실험을 하고 싶다면 실험실, 장비, 화학 물질에 대한 \u003cb class=\"key\">접근 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 사전에 조사해야 합니다. 이는 학생의 성공을 위해 \u003cb class=\"key\">준비\u003c/b>가 필수적이며, 인적·재정적 자원까지 포함한다는 뜻입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사전 식별과 창의적 대안\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>일곱 번째와 여덟 번째 문장은 필요한 자원 중 일부가 이용 가능하지 않더라도 \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">식별\u003c/b>이 창의성에 도움이 된다고 강조합니다. 자원 부족을 미리 알면 \u003cb class=\"key\">주제 \u003c/b>\u003cb class=\"key\">변경\u003c/b>이나 \u003cb class=\"key\">대체 \u003c/b>\u003cb class=\"key\">자원\u003c/b> 탐색으로 이어질 수 있습니다. 결국 사전 인식이 오히려 새로운 가능성을 열어 준다는 결론입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장 흐름을 따라가면서, 자원 무인식이라는 문제가 사전 식별을 통한 창의적 해결로 이어지는 구조를 함께 봅시다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 창의성을 방해하는 요인으로 자원에 대한 무인식을 지적해요. 학생들은 자신에게 요구되는 과제를 수행하는 데 필요한 자원을 제대로 식별하지 못하는 경우가 많다고 합니다. 결국 무엇이 필요한지 모르는 상태가 창의적 사고를 가로막는 출발점이 된다는 거죠.","hl":"f0"},{"n":5,"text":"세 번째 문장은 특정 학습 과제에 여러 자원이 필수적일 수 있다고 말해요. 그 자원들을 인식하면 활동 수행이 평이해질 수 있다고 하면서 자원 인식의 이점을 분명히 합니다. 단순한 준비물 확인이 아니라 과제 수행 난이도를 낮추는 핵심 주장으로 볼 수 있어요.","hl":"f1"},{"n":6,"text":"네 번째 문장부터 여섯 번째 문장은 실험을 예로 들어 구체화해요. 학생들이 프로젝트에서 실험을 하고 싶다면 실험실, 장비, 화학 물질에 접근할 수 있는지 미리 조사해야 한다는 거죠. 이는 학생의 성공을 위해 준비가 필수적이며, 인적 자원과 재정적 자원까지 포함한다는 뜻이에요.","hl":"f2"},{"n":7,"text":"일곱 번째와 여덟 번째 문장은 자원 일부가 이용 가능하지 않더라도 사전에 식별하는 것이 창의성에 도움이 된다고 강조해요. 자원 부족을 미리 알면 주제를 바꾸거나 대체 자원을 찾는 등 다른 방법을 모색하게 됩니다. 사전 인식이 오히려 새로운 가능성을 열어 준다는 결론이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">자원 \u003c/b>\u003cb class=\"key\">무인식\u003c/b>이 창의성을 방해한다는 문제를 제기한 뒤, \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">조사\u003c/b>와 \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">식별\u003c/b>이라는 해결책을 제시합니다. 실험 사례를 근거로 준비의 중요성을 설명하고, 마지막 일곱 번째 문장에서 자원이 없어도 사전 식별이 창의성에 도움이 된다고 결론을 내립니다. 결론이 문단의 뒤에 있으므로 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (4)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>It means (6)\u003c/b>\u003cspan>앞 문장의 의미 정리\u003c/span>\u003cb>Even if (7)\u003c/b>\u003cspan>양보·전환과 결론 유도\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">resources required in each activity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the resources they need\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Different resources may be compulsory\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">laboratory, equipment, and chemicals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">human and financial resources\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">some of the resources required for a task\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">alternative resources\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>자원 무인식\u003c/th>\u003cth>자원 사전 식별\u003c/th>\u003c/tr>\u003ctr>\u003ctd>창의성을 방해함\u003c/td>\u003ctd>창의성에 도움이 됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과제 수행이 어렵고 막막함\u003c/td>\u003ctd>활동 수행이 평이해짐\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자원 부족을 뒤늦게 발견함\u003c/td>\u003ctd>주제 변경·대체 자원 탐색으로 이어짐\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"전개 방식은 문제 해결 구조입니다. 자원 무인식이 창의성을 막는다는 문제를 제기하고, 사전 조사와 사전 식별이라는 해결책을 제시한 뒤 예시로 뒷받침하고 마지막 문장에서 창의성에 도움이 된다고 결론을 내려요. 문단의 결론이 뒤에 있는 미괄식 구조로 볼 수 있어요. 주제문은 일곱 번째 문장입니다.","hl":"ty"},{"n":9,"text":"흐름을 잡아 주는 신호어를 볼게요. 네 번째 문장의 For example은 예시를 시작하는 신호예요. 여섯 번째 문장의 It means는 앞 문장의 의미를 정리해 주고요. 일곱 번째 문장의 Even if는 양보와 전환을 나타내면서 결론으로 넘어가는 역할을 해요. 또 resources required, resources they need, human and financial resources, alternative resources처럼 자원이라는 같은 개념이 계속 다르게 표현되고 있다는 점도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>hinder\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>creativity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>창의성\u003c/span>\u003c/div>\u003cdiv>\u003cb>unawareness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무인식, 인식 없음\u003c/span>\u003c/div>\u003cdiv>\u003cb>resources\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원\u003c/span>\u003c/div>\u003cdiv>\u003cb>required\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>요구되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>activity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>활동\u003c/span>\u003c/div>\u003cdiv>\u003cb>identify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>식별하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>perform\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>task\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과제\u003c/span>\u003c/div>\u003cdiv>\u003cb>compulsory\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>필수적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>specific\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>recognize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>simplify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>평이하게 하다, 단순화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>performance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수행\u003c/span>\u003c/div>\u003cdiv>\u003cb>conduct\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experiments\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실험\u003c/span>\u003c/div>\u003cdiv>\u003cb>prior investigation\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사전 조사\u003c/span>\u003c/div>\u003cdiv>\u003cb>access\u003c/b>\u003cem>명사\u003c/em>\u003cspan>접근\u003c/span>\u003c/div>\u003cdiv>\u003cb>laboratory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실험실\u003c/span>\u003c/div>\u003cdiv>\u003cb>equipment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장비\u003c/span>\u003c/div>\u003cdiv>\u003cb>chemicals\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화학 물질\u003c/span>\u003c/div>\u003cdiv>\u003cb>vital\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>필수적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>financial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>재정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>technicians\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술자\u003c/span>\u003c/div>\u003cdiv>\u003cb>purchase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구입하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>where applicable\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>적용 가능한 경우에\u003c/span>\u003c/div>\u003cdiv>\u003cb>available\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이용 가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>in advance\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사전에, 미리\u003c/span>\u003c/div>\u003cdiv>\u003cb>alternative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대체의\u003c/span>\u003c/div>\u003cdiv>\u003cb>means\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방법\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개 짚어 볼게요. hinder는 방해하다, identify는 식별하다라는 뜻이에요. compulsory는 필수적인, vital도 필수적인이라는 뜻으로 서로 바꿔 쓸 수 있는 맥락이에요. available은 이용 가능한, alternative는 대체의라는 뜻으로 마지막 결론의 핵심 어휘이니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">hinder\u003c/b>\u003cspan class=\"m\">방해하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">obstruct\u003c/span>\u003cspan class=\"s\">impede\u003c/span>\u003cspan class=\"s\">hamper\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">facilitate\u003c/span>\u003cspan class=\"a\">promote\u003c/span>\u003cspan class=\"a\">aid\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">identify\u003c/b>\u003cspan class=\"m\">식별하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">distinguish\u003c/span>\u003cspan class=\"s\">detect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003cspan class=\"a\">confuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">compulsory\u003c/b>\u003cspan class=\"m\">필수적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mandatory\u003c/span>\u003cspan class=\"s\">obligatory\u003c/span>\u003cspan class=\"s\">required\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">optional\u003c/span>\u003cspan class=\"a\">voluntary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">vital\u003c/b>\u003cspan class=\"m\">필수적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"s\">critical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">optional\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">available\u003c/b>\u003cspan class=\"m\">이용 가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accessible\u003c/span>\u003cspan class=\"s\">obtainable\u003c/span>\u003cspan class=\"s\">usable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unavailable\u003c/span>\u003cspan class=\"a\">inaccessible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">alternative\u003c/b>\u003cspan class=\"m\">대체의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">substitute\u003c/span>\u003cspan class=\"s\">different\u003c/span>\u003cspan class=\"s\">other\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">original\u003c/span>\u003cspan class=\"a\">primary\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 볼게요. hinder는 obstruct, impede, hamper와 동의어이고, facilitate나 promote와는 반대예요. compulsory는 mandatory, obligatory, required와 동의어이고 optional, voluntary와 반대입니다. vital은 essential, crucial, critical과 동의어이고 optional이나 trivial과 반대예요. available은 accessible, obtainable, usable과 동의어이고 unavailable, inaccessible과 반대입니다. alternative는 substitute, different, other와 동의어이고 original과 대비될 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 가지 요소는\u003c/span>\u003cspan class=\"en\">One factor\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창의성을 방해할 수도 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">hinder \u003c/span>\u003cspan class=\"tgt\">creativity\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자원에 대한 인식이 없다는 것이다\u003c/span>\u003cspan class=\"en\">is unawareness of the resources\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각 활동에 요구되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">required \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">activity\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들의 학습에서\u003c/span>\u003cspan class=\"en\">in students' learning.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">창의성을 방해할 수도 있는 한 가지 요소는 학생들의 학습에서 각 활동에 요구되는 자원에 대한 인식이 없다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 창의성을 막는 원인으로 \u003cb class=\"key\">필요 \u003c/b>\u003cb class=\"key\">자원에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">인식 \u003c/b>\u003cb class=\"key\">부족\u003c/b>을 제시합니다. 학생들이 각 활동에서 어떤 자원이 필요한지 모르는 상태가 창의성 발휘에 걸림돌이 된다는 것입니다. 여기서 resources는 실험실, 장비, 화학 약품 같은 물적 기반을 포함한 넓은 의미입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사(One factor) + that + 동사(may hinder) + 목적어(creativity) : \"창의성을 방해할 수도 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 후치수식\u003c/span> : the resources + required (과거분사) + in each activity : \"각 활동에 요구되는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"One factor, 한 가지 요소는. that may hinder creativity, 창의성을 방해할 수도 있는. is unawareness of the resources, 자원에 대한 인식이 없다는 것이다. required in each activity, 각 활동에 요구되는. in students' learning, 학생들의 학습에서. 이 문장 전체를 해석하면, 창의성을 방해할 수도 있는 한 가지 요소는 학생들의 학습에서 각 활동에 요구되는 자원에 대한 인식이 없다는 것이다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 창의성을 막는 가장 큰 요인으로 필요한 자원에 대한 인식 부족을 제시합니다. 학생들이 어떤 활동을 할 때 어떤 자원이 필요한지 모르는 상태가 창의성 발휘에 방해가 된다는 뜻이에요. 여기서 자원은 실험실이나 장비, 화학 약품 같은 구체적인 것까지 포함하는 넓은 표현입니다.","hl":"mn"},{"n":14,"text":"어법 포인트는 두 가지입니다. 첫째, that may hinder creativity에서 that은 주격 관계대명사로 선행사 One factor를 수식합니다. 관계대명사 that 뒤에는 주어가 없는 불완전한 절이 와서 that이 주어 역할을 하죠. 둘째, required in each activity는 과거분사구로 앞에 있는 명사 the resources를 뒤에서 수식합니다. 수동의 뜻을 담아 각 활동에 요구되는 자원으로 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 학생들은 식별할 수 없다\u003c/span>\u003cspan class=\"en\">Often students are unable to identify\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자원들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">resources \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 수행하는 데 필요한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">need\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003  need에서 목적격 관계대명사 which 또는 that이 생략되어 있어요. 원래는 the resources which they need인데 which가 생략되고 they need가 직접 resources를 수식하죠. 둘째, to perform the task는 need의 목적어로 쓰인 to부정사의 명사적 용법입니다. 수행하는 것이라는 뜻이에요. 셋째, required of them은 the task를 뒤에서 수식하는 과거분사구로 그들에게 요구되는이라는 수동의 의미를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 가지의 자원들이 필수적일 수 있다\u003c/span>\u003cspan class=\"en\">Different resources \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">compulsory\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정 학습 과제들에 대해\u003c/span>\u003cspan class=\"en\">for specific learning tasks,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들을 인식하는 것은\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">recognizing \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">활동의 수행을 평이하게 해 줄 수도 있다\u003c/span>\u003cspan class=\"en\">may simplify the activity's performance.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러 가지의 자원들이 특정 학습 과제들에 대해 필수적일 수 있어서 그것들을 인식하는 것은 활동의 수행을 평이하게 해 줄 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 문장은 자원이 특정 과제에는 반드시 필요할 수 있으며, 이를 미리 알아두면 활동 수행이 수월해진다는 논리입니다. 이는 자원 인식이 창의성에 긍정적일 수 있다는 뒷받침이 됩니다. \u003cb class=\"key\">필수 \u003c/b>\u003cb class=\"key\">자원\u003c/b>과 \u003cb class=\"key\">인식의 \u003c/b>\u003cb class=\"key\">이점\u003c/b>을 연결하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may의 가능성/추측\u003c/span> : 주어(Different resources) + may be + 형용사(compulsory) : \"필수적일 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : Recognizing them + may simplify + 목적어(the activity's performance) : \"그것들을 인식하는 것은\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Different resources may be compulsory, 여러 가지의 자원들이 필수적일 수 있다. for specific learning tasks, 특정 학습 과제들에 대해. and recognizing them, 그리고 그것들을 인식하는 것은. may simplify the activity's performance, 활동의 수행을 평이하게 해 줄 수도 있다. 이 문장 전체를 해석하면, 여러 가지의 자원들이 특정 학습 과제들에 대해 필수적일 수 있어서 그것들을 인식하는 것은 활동의 수행을 평이하게 해 줄 수도 있다.","hl":"m"},{"n":19,"text":"세 번째 문장은 자원이 특정 과제에 따라 반드시 필요할 수 있고, 그 자원을 미리 인식하면 과제 수행이 훨씬 수월해질 수 있다는 점을 말해요. 따라서 필요한 자원을 아는 것이 활동 성과에 도움이 된다는 논리를 펼치고 있습니다.","hl":"mn"},{"n":20,"text":"어법 포인트는 두 가지입니다. 첫째, may be compulsory에서 may는 가능성이나 추측을 나타내는 조동사로 뒤에 동사 원형 be가 왔어요. 필수적일 수 있다는 뜻입니다. 둘째, recognizing them은 recognize에 ing가 붙은 동명사구로 문장의 주어 역할을 합니다. 그것들을 인식하는 것은이라는 의미로 뒤에 may simplify가 이어지죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 학생들이 원한다는 것일 수도 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> students desire\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 실험을 수행하기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">conduct \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">experiments\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 프로젝트에서.\u003c/span>\u00 \">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사절)\u003c/span> : whether + 주어 + 동사 : \"학생들이 접근할 수 있을지 (여부)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사구의 형용사적 용법(후치수식)\u003c/span> : 명사 + required (과거분사) + for 명사 : \"그 실험에 요구되는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"There must be, 반드시 있어야 한다. a prior investigation, 사전 조사가. of whether, ~인지 아닌지에 대한. the students will have access, 학생들이 접근할 수 있을지. to the laboratory, equipment, and chemicals, 실험실, 장비, 그리고 화학 물질에. required for the experiment, 그 실험에 요구되는.. 이 문장 전체를 해석하면, 학생들이 실험에 요구되는 실험실, 장비, 그리고 화학 물질에 접근할 수 있을지 여부에 대한 사전 조사가 있어야 한다.","hl":"m"},{"n":25,"text":"이 문장은 준비의 구체적인 내용으로 사전 조사가 필요하다는 점을 강조하고 있어요. 학생들이 실험에 필요한 실험실, 장비, 화학 물질에 접근할 수 있는지를 미리 확인해야 한다는 거예요. 그래서 자원 접근성을 확인하는 것이 창의성을 돕는다는 논지로 이어져요.","hl":"mn"},{"n":26,"text":"첫 번째 어법은 there 존재 구문이에요. There must be에서 there은 형식적인 주어이고 실제 주어는 a prior investigation이에요. 조동사 must가 있어서 반드시 있어야 한다는 의무의 뜻을 더해요. 두 번째 어법은 간접의문문이에요. whether the students will have access는 전치사 of의 목적어로 쓰인 명사절인데, 간접의문문은 의문사 더하기 주어 더하기 동사 어순이라서 will have가 평서문 어순으로 와요. 세 번째 어법은 과거분사구의 형용사적 용법이에요. required for the experiment가 앞의 실험실, 장비, 화학 물질을 뒤에서 수식하면서 요구되는이라는 수동의 의미를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 의미한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">준비가 필수적이라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">preparation \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">vital\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들이 성공하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">succeed\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 ~에 대한 것일 수도 있다\u003c/span>\u003cspan class=\"en\">and it may be about\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인적 그리고 재정적 자원\u003c/span>\u003cspan class=\"en\">human and financial resources\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실험실 기술자, 화학 물질 구입 자금, 그리고 장비와 같은\u003c/span>\u003cspan class=\"en\">such as laboratory technicians, money \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">purchase \u003c/span>\u003cspan class=\"tgt\">chemicals\u003c/span>, and equipment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 학습을 위해 적용할 수 있는 경우에.\u003c/span>\u003cspan class=\"en\">for their learning where applicable.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 학생들이 성공하기 위해 준비가 필수적이라는 것을 의미하며, 그들의 학습을 위해 적용할 수 있는 경우에 그것은 실험실 기술자, 화학 물질 구입 자금, 그리고 장비와 같은 인적 그리고 재정적 자원에 대한 것일 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 강조한 준비의 의미를 명확히 정의하며, 준비가 학생들의 성공에 \u003cb class=\"key\">필수\u003c/b>적이라고 정리한다. 또한 준비의 내용이 \u003cb class=\"key\">인적·재정적 \u003c/b>\u003cb class=\"key\">자원\u003c/b>과 같은 구체적인 요소를 포함한다는 점을 밝혀 준다. 글 전체에서 \u003cb class=\"key\">준비의 \u003c/b>\u003cb class=\"key\">중요성\u003c/b>을 요약하는 핵심 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that 생략 (목적절)\u003c/span> : It means (that) + 주어 + 동사 : \"그것은 준비가 필수적이라는 것을 의미한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어\u003c/span> : for + 목적격 + to부정사 : \"학생들이 성공하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : money + to부정사구 (수식) : \"화학 물질을 구매할 (자금)\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It means, 그것은 의미한다. preparation is vital, 준비가 필수적이라는 것을. for the students to succeed, 학생들이 성공하기 위해. and it may be about, 그리고 그것은 ~에 대한 것일 수도 있다. human and financial resources, 인적 그리고 재정적 자원. such as laboratory technicians, money to purchase chemicals, and equipment, 실험실 기술자, 화학 물질 구입 자금, 그리고 장비와 같은. for their learning where applicable, 그들의 학습을 위해 적용할 수 있는 경우에.. 이 문장 전체를 해석하면, 그것은 학생들이 성공하기 위해 준비가 필수적이라는 것을 의미하며, 그들의 학습을 위해 적용할 수 있는 경우에 그것은 실험실 기술자, 화학 물질 구입 자금, 그리고 장비와 같은 인적 그리고 재정적 자원에 대한 것일 수도 있다.","hl":"m"},{"n":28,"text":"이 문장은 앞에서 강조한 준비의 의미를 정리하는 핵심 문장이에요. 준비가 학생들의 성공에 필수적이라고 정의하고, 그 준비가 인적 재정적 자원 같은 구체적인 요소를 포함한다고 말해요. 그래서 이 문장이 글 전체의 준비의 중요성을 요약해요.","hl":"mn"},{"n":29,"text":"첫 번째 어법은 that 생략이에요. It means preparation is vital에서 means 뒤에 목적절을 이끄는 that이 생략된 거예요. 두 번째 어법은 to부정사의 의미상 주어예요. for the students to succeed에서 for 다음에 목적격으로 to부정사의 주체가 학생들이라는 걸 보여 줘요. 세 번째 어법은 to부정사의 형용사적 용법이에요. to purchase chemicals가 앞의 money를 수식해서 화학 물질을 구매할 돈이라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 ~일지라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Even \u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과제에 요구되는 자원들 중 일부\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">resources \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">required \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">task \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이용 가능하지 않을 수도 있지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">available\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사전에 그것들을 식별하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">identifying \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">advance\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들의 창의성에 도움이 될 수도 있다.\u003c/span>\u003cspan class=\"en\">may help students' creativity.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">과제에 요구되는 자원들 중 일부가 이용 가능하지 않을 수도 있지만, 사전에 그것들을 식별하는 것은 학생들의 창의성에 도움이 될 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자원 중 일부가 없더라도 \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">식별\u003c/b>이 오히려 \u003cb class=\"key\">창의성\u003c/b>에 도움이 된다는 주장입니다. 무조건 자원이 준비되어야만 창의적인 것이 아니라, 부족한 자원을 미리 파악하는 과정에서 대안 탐색과 문제 해결이 촉진된다는 흐름을 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보 부사절 (even if)\u003c/span> : Even if + 주어 + 동사, 주절 : \"비록 과제에 요구되는 자원들 중 일부가 이용 가능하지 않을 수도 있지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치수식\u003c/span> : the resources + required for a task (≈ the resources which are required for a task) : \"과제에 요구되는 자원들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : Identifying them in advance + may help + students' creativity : \"사전에 그것들을 식별하는 것은\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Even if, 비록 ~일지라도. some of the resources required for a task, 과제에 요구되는 자원들 중 일부. may not be available, 이용 가능하지 않을 수도 있지만. identifying them in advance, 사전에 그것들을 식별하는 것은. may help students' creativity, 학생들의 창의성에 도움이 될 수도 있다.. 이 문장 전체를 해석하면, 과제에 요구되는 자원들 중 일부가 이용 가능하지 않을 수도 있지만, 사전에 그것들을 식별하는 것은 학생들의 창의성에 도움이 될 수도 있다.","hl":"m"},{"n":31,"text":"여기서는 자원이 없다고 해서 창의성이 막히는 게 아니라, 자원을 미리 식별하는 과정 자체가 창의성을 돕는다고 말해요. 학생이 필요한 자원을 미리 파악하면 부족한 부분에 대비할 수 있고, 그 과정에서 문제를 새롭게 보게 되죠. 따라서 이 문장은 자원의 사전 식별이 창의성에 도움이 된다는 핵심 주장을 담고 있어요.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 Even if 절입니다. Even if는 설령 그렇다 하더라도라는 뜻으로, 뒤에 완전한 절이 와서 주절의 내용과 대비되는 양보의 상황을 만들어요. 여기서는 자원이 이용 가능하지 않을 수도 있다는 상황을 먼저 제시하고, 그래도 그것들을 미리 식별하는 것이 창의성에 도움이 된다는 주절을 이어 줍니다. 두 번째 포인트는 required for a task인데, resources를 뒤에서 수동의 의미로 꾸며 주는 과거분사구예요. 관계대명사와 be동사가 생략된 분사구라고 볼 수 있어요. 세 번째 포인트는 identifying them in advance가 문장의 주어로 쓰인 동명사구라는 점입니다. 동명사구는 단수로 취급해서 may help가 바로 이어지죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">It\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 ~로 이어질 수도 있다\u003c/span>\u003cspan class=\"en\">may even \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lead \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주제 변경,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">changing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">topic, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대체 자원들 찾기,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">finding \u003c/span>\u003cspan class=\"tgt\">alternative \u003c/span>\u003cspan class=\"tgt\">resources, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다른 방법으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">means\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 심지어 주제 변경, 대체 자원들 찾기, 그리고 다른 방법으로 이어질 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 말한 \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">식별\u003c/b>이 결국 \u003cb class=\"key\">주제 \u003c/b>\u003cb class=\"key\">변경\u003c/b>이나 \u003cb class=\"key\">대체 \u003c/b>\u003cb class=\"key\">자원\u003c/b> 탐색 같은 유연한 대응으로 이어진다는 내용입니다. 자원 부족을 단순한 장애물이 아니라 창의적 전환의 출발점으로 보게 만드는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 to의 목적어로 쓰인 동명사구 병렬\u003c/span> : lead to [changing the topic], [finding alternative resources], and [other means] : \"주제 변경, 대체 자원들 찾기, 그리고 다른 방법으로 이어지다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It, 그것은. may even lead to, 심지어 ~로 이어질 수도 있다. changing the topic, 주제 변경. finding alternative resources, 대체 자원들 찾기. and other means, 그리고 다른 방법으로.. 이 문장 전체를 해석하면, 그것은 심지어 주제 변경, 대체 자원들 찾기, 그리고 다른 방법으로 이어질 수도 있다.","hl":"m"},{"n":34,"text":"앞 문장에서 말한 자원의 사전 식별은 단순히 확인에 그치지 않고, 주제를 바꾸거나 대체 자원을 찾거나 다른 방법을 모색하는 쪽으로 나아갈 수 있어요. 이는 자원이 없을 때 창의적 대응이 시작된다는 의미이죠. 결과적으로 문제에 유연하게 대처하는 것이 창의성의 핵심임을 보여주는 문장입니다.","hl":"mn"},{"n":35,"text":"여기서 핵심은 lead to 뒤에 동사 원형이 아니라 동명사가 온다는 거예요. lead to의 to는 전치사이기 때문에 뒤에는 명사 상당 어구가 와야 하고, 그래서 changing the topic과 finding alternative resources처럼 동명사구가 병렬로 연결됐어요. and other means까지 합쳐서 세 개가 병렬 구조를 이루고 있다는 점도 함께 짚어 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">창의성\u003c/b>을 방해하는 요인은 학습 활동에 필요한 \u003cb class=\"key\">자원\u003c/b>에 대한 \u003cb class=\"key\">무인식\u003c/b>이다.\u003c/li>\u003cli>특정 과제에는 \u003cb class=\"key\">필수 \u003c/b>\u003cb class=\"key\">자원\u003c/b>이 있으며, 이를 \u003cb class=\"key\">인식\u003c/b>하면 수행이 \u003cb class=\"key\">평이\u003c/b>해질 수 있다.\u003c/li>\u003cli>실험 사례에서 보듯 \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">조사\u003c/b>와 \u003cb class=\"key\">준비\u003c/b>는 인적·재정적 자원까지 포함해 성공에 \u003cb class=\"key\">필수적\u003c/b>이다.\u003c/li>\u003cli>자원이 \u003cb class=\"key\">이용 \u003c/b>\u003cb class=\"key\">가능\u003c/b>하지 않아도 \u003cb class=\"key\">사전 \u003c/b>\u003cb class=\"key\">식별\u003c/b>은 \u003cb class=\"key\">주제 \u003c/b>\u003cb class=\"key\">변경\u003c/b>이나 대체 자원 탐색으로 이어져 창의성에 도움이 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Identifying the resources needed for a learning task in advance can foster creativity, even when some of those resources are unavailable.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">학생의 \u003cb class=\"key\">창의성\u003c/b>을 가로막는 요인은 과제 수행에 필요한 \u003cb class=\"key\">자원\u003c/b>을 \u003cb class=\"key\">사전에 \u003c/b>\u003cb class=\"key\">인식하지 \u003c/b>\u003cb class=\"key\">못하는 \u003c/b>\u003cb class=\"key\">것\u003c/b>이다. 각 활동에 필요한 자원을 미리 파악하면 \u003cb class=\"key\">수행이 \u003c/b>\u003cb class=\"key\">수월해지고\u003c/b>, 자원이 없더라도 \u003cb class=\"key\">주제 \u003c/b>\u003cb class=\"key\">변경\u003c/b>이나 \u003cb class=\"key\">대체 \u003c/b>\u003cb class=\"key\">자원\u003c/b> 탐색으로 이어져 창의성에 도움이 된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 지문을 정리하면, 창의성을 높이려면 과제에 필요한 자원을 미리 식별하고 준비하는 것이 중요하다는 내용입니다. 자원이 부족하더라도 사전에 알면 주제 변경이나 대체 자원 탐색 같은 창의적 선택을 할 수 있어요. 이 글은 우리가 학습 과제를 할 때 자원 점검을 소홀히 하지 말라는 메시지를 주고 있어요. 오늘 수업은 여기까지입니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
