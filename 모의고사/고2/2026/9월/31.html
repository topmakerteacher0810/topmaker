로 떠도는 새로운 인류의 모습을 양자인(Quantum people)이라는 신선한 물리적 개념으로 비유하고 있다는 점을 미리 알아두시면 지문을 훨씬 깊이 있게 소화하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01지리학적 경계의 모호화</div><ul><li>사람들이 지속적으로 이동하면서 인간 지리학의 경계가 불분명해지고 있다.</li><li>잦은 이동(on the move)으로 인한 인간 지리학(human geography)의 모호화</li><li>물질의 상태가 변하는 상전이(phase shift) 현상에 비유</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02양자적 인간의 등장</div><ul><li>인간의 이동 양상이 양자 물리학의 입자처럼 속도와 위치가 항상 변하는 상태가 되었다.</li><li>인간을 양자 물리학(quantum physics)의 입자(particles)에 비유</li><li>속도(velocity)와 위치(location)가 끊임없이 유동적(in flux)인 상태</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03영구적 정착의 어려움</div><ul><li>과거와 같은 안정성을 되찾기 어려우며 현대 세계에서는 한 곳에 정착하기 힘들다.</li><li>안정성(stability)으로의 회귀가 불가능한 현실</li><li>세계의 복잡성(complexity)으로 인해 영구적 정착(settle permanently)이 어려워짐</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04새로운 인구통계학적 변화</div><ul><li>계층을 불문하고 끊임없이 이동하는 삶을 사는 사람들이 전 세계적으로 증가하고 있다.</li><li>디지털 노마드, 억만장자, 이주 노동자(migratory workers) 등 다양한 계층 포함</li><li>다양하게 증가하는 양자 인간(quantum people)의 인구통계(demographic) 형성</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">on the move</td><td class=\"m\">끊임없이 이동하는, 이동 중인</td></tr><tr><td class=\"w\">phase shift</td><td class=\"m\">상전이, 단계 변화</td></tr><tr><td class=\"w\">transition</td><td class=\"m\">전환되다, 변이하다, 넘어가다</td></tr><tr><td class=\"w\">heat up</td><td class=\"m\">뜨거워지다, 가열되다</td></tr><tr><td class=\"w\">loosen from</td><td class=\"m\">~에서 느슨해지다, ~로부터 떨어지다</td></tr><tr><td class=\"w\">vibrate</td><td class=\"m\">진동하다, 떨리다</td></tr><tr><td class=\"w\">particle</td><td class=\"m\">입자, 미립자, 아주 작은 조각</td></tr><tr><td class=\"w\">quantum</td><td class=\"m\">양자의, 획기적인</td></tr><tr><td class=\"w\">velocity</td><td class=\"m\">속도, 속력</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in flux</td><td class=\"m\">끊임없이 변하는, 유동적인</td></tr><tr><td class=\"w\">stability</td><td class=\"m\">안정성, 안정</td></tr><tr><td class=\"w\">complexity</td><td class=\"m\">복잡성, 복잡함</td></tr><tr><td class=\"w\">increasingly</td><td class=\"m\">점점 더, 갈수록 더</td></tr><tr><td class=\"w\">settle</td><td class=\"m\">정착하다, 자리 잡다</td></tr><tr><td class=\"w\">permanently</td><td class=\"m\">영구적으로, 불변하게</td></tr><tr><td class=\"w\">as well as</td><td class=\"m\">~뿐만 아니라, ~에 더하여</td></tr><tr><td class=\"w\">migratory</td><td class=\"m\">이주하는, 이동하는</td></tr><tr><td class=\"w\">demographic</td><td class=\"m\">인구 집단, 인구 통계</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인문 지리학은 모호해지고 있다.</span><span class=\"en\"><b>Human geography <span class=\"grammar-hl\">is becoming unclear</span>.</b></span></div></div><div class=\"lec-sent-ko\">인문 지리학은 모호해지고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 핵심 주제를 제시하며 시작합니다. Human geography는 사람들이 어디에 정착하고 어떻게 분포해 사는지를 다루는 분야인데, 이것이 불분명해진다는 것은 사람들이 한곳에 정착해 사는 전통적인 거주 방식이 흔들리고 그 경계가 흐려지고 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is becoming unclear 2형식(SVC) 구조: becoming은 불완전 자동사로 쓰여 뒤에 주격보어로 형용사 unclear를 취한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들이 상황에 놓이게 됨에 따라</span><span class=\"en\"><b>As people <span class=\"grammar-hl\">find themselves</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정기적으로 이동하는,</span><span class=\"en\"><b><span class=\"grammar-hl\">regularly on the move</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 상태 변화를 경험하고 있다</span><span class=\"en\"><b>we are experiencing a phase shift</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물질이 변할 때와 같은</span><span class=\"en\"><b>like when matter transitions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">고체에서 액체로, 기체로:</span><span class=\"en\"><b>from solid to liquid to gas:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">분자들이 가열되어 느슨해진다</span><span class=\"en\"><b>molecules heat up and loosen</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">서로에게서,</span><span class=\"en\"><b>from one another,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 빠르게 진동하면서.</span><span class=\"en\"><b><span class=\"grammar-hl\">vibrating more rapidly</span>.</b></span></div></div><div class=\"lec-sent-ko\">사람들이 정기적으로 이동하는 상황에 놓이게 됨에 따라, 우리는 물질이 고체에서 액체로, 액체에서 기체로 변할 때와 같은 상태 변화를 경험하고 있다. 즉, 분자들이 가열되어 서로에게서 느슨해져, 더 빠르게 진동하는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 현상의 원인과 양상을 물리학에 빗대어 자세히 설명합니다. experiencing a phase shift는 얼음이 물이 되고 수증기가 되듯 인류의 삶의 방식이 근본적으로 형태를 바꾸고 있다는 의미입니다. 과거에는 사람들이 고체처럼 한 지역에 단단히 결속되어 살았다면, 이제는 기체 분자처럼 서로 간의 유대나 지역적 얽힘에서 벗어나 전 세계를 무대로 빠르고 자유롭게 이동하는 상태가 되었음을 시각적으로 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">find themselves regularly on the move 5형식(SVOC) 구조: find는 5형식 타동사이며, themselves가 목적어(O), 전치사구 on the move가 목적보어(C) 역할을 한다.</div><div class=\"lec-gr-item\">on the move (관용표현): &#39;이동 중에 있는&#39;, &#39;바쁘게 활동하는&#39;이라는 뜻의 숙어이다.</div><div class=\"lec-gr-item\">vibrating more rapidly (분사구문): 현재분사 vibrating이 부사적 기능으로 쓰였다. 주절의 분자들(molecules)이 진동한다는 동시상황을 나타내며, 원래 절은 &#39;as they vibrate more rapidly&#39;로 풀어 쓸 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">on the move</td><td class=\"m\">끊임없이 이동하는, 이동 중인</td></tr><tr><td class=\"w\">phase shift</td><td class=\"m\">상전이, 단계 변화</td></tr><tr><td class=\"w\">transition</td><td class=\"m\">전환되다, 변이하다, 넘어가다</td></tr><tr><td class=\"w\">heat up</td><td class=\"m\">뜨거워지다, 가열되다</td></tr><tr><td class=\"w\">loosen from</td><td class=\"m\">~에서 느슨해지다, ~로부터 떨어지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">혹자는 심지어 말할지도 모른다</span><span class=\"en\"><b>One might even <span class=\"grammar-hl\">say</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간이 양자 물리학의 입자처럼 되고 있다고,</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> humans are becoming like particles in quantum physics,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즉 그들의 속도와 위치가 늘 끊임없는 변화 속에 있다고.</span><span class=\"en\"><b><span class=\"grammar-hl\">their velocity and location always in flux</span>.</b></span></div></div><div class=\"lec-sent-ko\">혹자는 심지어 인간이 양자 물리학의 입자처럼 되고 있다고 말하는데, 즉 그들의 속도와 위치가 늘 끊임없는 변화 속에 있다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 기체 분자의 비유를 한 단계 더 끌어올려 현대인의 특성을 규정합니다. particles in quantum physics는 어디로 얼마나 빨리 이동할지 정확히 예측할 수 없는 현대인의 역동적인 삶의 궤적을 가리킵니다. always in flux는 끊임없이 변하고 움직인다는 뜻으로, 첫 문장에서 말한 인문 지리가 불분명해졌다는 상황을 양자역학의 개념을 빌려 논리적으로 뒷받침해 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">say that 명사절 접속사: that이 타동사 say의 목적어 역할을 하는 명사절을 이끈다.</div><div class=\"lec-gr-item\">their velocity and location always in flux (분사구문(독립분사구문)): 주절의 주어(humans)와 의미상 주어(their velocity and location)가 달라 주어를 명시하고, 뒤에 현재분사 being이 생략된 채 전치사구(in flux)만 남은 구조이다. 원래 절은 &#39;while their velocity and location are always in flux&#39;로 볼 수 있다.</div><div class=\"lec-gr-item\">in flux (관용표현): &#39;끊임없이 변하는&#39;, &#39;유동적인&#39;이라는 의미의 이디엄이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">particle</td><td class=\"m\">입자, 미립자, 아주 작은 조각</td></tr><tr><td class=\"w\">quantum</td><td class=\"m\">양자의, 획기적인</td></tr><tr><td class=\"w\">velocity</td><td class=\"m\">속도, 속력</td></tr><tr><td class=\"w\">in flux</td><td class=\"m\">끊임없이 변하는, 유동적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">좋을 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">It would be nice</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어느 정도 안정된 모습으로 돌아가는 것이,</span><span class=\"en\"><b><span class=\"grammar-hl\">to return</span> to some form of stability,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 상황은 그렇게 돌아가지 않는다</span><span class=\"en\"><b>but that's not <span class=\"grammar-hl\">how things work</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">양자 세계에서는.</span><span class=\"en\"><b>in a quantum world.</b></span></div></div><div class=\"lec-sent-ko\">어느 정도 안정된 모습으로 돌아가는 것이 좋겠지만, 양자 세계에서 상황은 그렇게 돌아가지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 흐름을 살짝 전환하여, 과거의 정착 생활을 그리워할 수도 있다는 인간적인 감정을 짚어줍니다. 이어서 that&#39;s not how things work를 통해 이미 한곳에 머무르지 않고 끊임없이 이동하는 새로운 시대적 흐름이 굳어졌음을 단호하게 선언합니다. 과거의 안정적인 시대로 되돌아가는 것은 이제 불가능한 현실임을 일깨워줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It would be nice to return (가주어): 진주어: It은 형식적인 가주어이며, 뒤의 to부정사구(to return)가 진짜 주어 역할을 한다.</div><div class=\"lec-gr-item\">to return (to부정사): 명사적 용법으로 쓰여 문장의 진주어 역할을 한다.</div><div class=\"lec-gr-item\">how things work (간접의문문): 의문사(how) + 주어(things) + 동사(work) 어순으로 명사절을 이끌어 주격보어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">quantum</td><td class=\"m\">양자의, 획기적인</td></tr><tr><td class=\"w\">stability</td><td class=\"m\">안정성, 안정</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대신에,</span><span class=\"en\"><b>Instead,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오늘날 세계의 복잡성은</span><span class=\"en\"><b>the complexity of today's world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점점 어렵게 만든다</span><span class=\"en\"><b><span class=\"grammar-hl\">makes it increasingly difficult</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어느 곳에든 영구적으로 정착하는 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">to settle</span> permanently anywhere.</b></span></div></div><div class=\"lec-sent-ko\">대신에, 오늘날 세계의 복잡성은 어느 곳에든 영구적으로 정착하는 것을 점점 어렵게 만든다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 결론에 대한 구체적이고 현실적인 이유를 제시합니다. settle permanently anywhere는 태어난 곳에서 평생을 보내거나 한 국가에 뼈를 묻는 전통적인 삶의 방식을 의미합니다. 현대 사회는 경제, 기술, 직업 환경이 너무나 빠르고 복잡하게 얽혀 돌아가기 때문에, 사람들이 생존하고 적응하려면 필연적으로 한곳에 머물 수 없음을 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">makes it increasingly difficult to settle 5형식(SVOC) 구조: makes는 5형식 동사, it은 가목적어, increasingly difficult는 목적보어 역할을 한다. 진짜 목적어는 뒤에 나오는 to부정사구(to settle)이다.</div><div class=\"lec-gr-item\">to settle permanently anywhere (to부정사): 명사적 용법으로 쓰여 문장의 진목적어(가목적어 it이 가리키는 내용) 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">complexity</td><td class=\"m\">복잡성, 복잡함</td></tr><tr><td class=\"w\">increasingly</td><td class=\"m\">점점 더, 갈수록 더</td></tr><tr><td class=\"w\">settle</td><td class=\"m\">정착하다, 자리 잡다</td></tr><tr><td class=\"w\">permanently</td><td class=\"m\">영구적으로, 불변하게</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">고액 연봉의 디지털 유목민들과 여러 개의 여권을 가진 억만장자들은</span><span class=\"en\"><b><span class=\"grammar-hl\">Highly paid digital nomads</span> and billionaires with multiple passports</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이주 노동자뿐만 아니라</span><span class=\"en\"><b><span class=\"grammar-hl\">as well as</span> migratory workers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모두 일부이다</span><span class=\"en\"><b>are all part</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양하고 증가하는 글로벌 인구 집단의</span><span class=\"en\"><b>of the diverse and <span class=\"grammar-hl\">growing global demographic</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">양자 인류라는.</span><span class=\"en\"><b>of quantum people.</b></span></div></div><div class=\"lec-sent-ko\">이주 노동자뿐만 아니라 고액 연봉의 디지털 유목민들과 여러 개의 여권을 가진 억만장자들도 모두 다양하고 증가하는 양자 인류라는 글로벌 인구 집단의 일부이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 마지막으로 앞서 추상적으로 설명한 인류의 변화가 현실에서 구체적으로 어떻게 나타나는지 예를 들어 글을 마무리합니다. migratory workers부터 billionaires with multiple passports까지 나열한 것은, 끊임없이 이동하는 삶의 방식이 생계를 위한 가난한 노동자부터 세계적인 부호에 이르기까지 경제적 계층을 뛰어넘어 현대 인류 전체를 아우르는 보편적인 현상으로 자리 잡았음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Highly paid digital nomads (과거분사(형용사)): paid가 뒤의 명사구 digital nomads를 수식(= 고수익을 받는 디지털 노마드). p.p. + N 구조로 &#39;p.p.된 N&#39;의 수동적 의미를 나타낸다.</div><div class=\"lec-gr-item\">as well as (관용표현): &#39;B뿐만 아니라 A도&#39;라는 의미를 지니며 등위접속사처럼 기능하는 숙어이다.</div><div class=\"lec-gr-item\">growing global demographic (현재분사(형용사)): growing이 뒤의 명사구 global demographic을 수식(= 커져 가는 인구 집단). -ing + N 구조로 &#39;...하는/커지는 N&#39;의 능동/진행적 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">quantum</td><td class=\"m\">양자의, 획기적인</td></tr><tr><td class=\"w\">as well as</td><td class=\"m\">~뿐만 아니라, ~에 더하여</td></tr><tr><td class=\"w\">migratory</td><td class=\"m\">이주하는, 이동하는</td></tr><tr><td class=\"w\">demographic</td><td class=\"m\">인구 집단, 인구 통계</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>현대인들은 끊임없이 이동하며, 전통적으로 한곳에 정착해 살던 인문 지리의 경계가 허물어지고 있다.</li><li>이러한 변화는 마치 물질이 고체에서 기체로 변하거나 양자 물리학의 입자가 끊임없이 움직이는 것과 같다.</li><li>현대 사회의 구조가 너무나 복잡해졌기 때문에 과거처럼 한곳에 안정적으로 머무는 것은 더 이상 불가능해졌다.</li><li>부유한 억만장자부터 생계를 위한 이주 노동자까지, 계층을 불문하고 멈추지 않고 이동하는 &#39;양자 인류&#39;가 세계적인 표준이 되어가고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Modern humans are constantly moving like unpredictable quantum particles, so permanent settlement has become increasingly difficult.</div>\n              <div class=\"lec-final-sum-ko\">현대인들은 예측 불가능한 양자 입자처럼 끊임없이 이동하고 있으며, 그래서 영구적인 정착이 점점 더 어려워지고 있다.</div></div></div>"],"segs":[[{"audio":"./31_audio/1.mp3","hl":null}],[{"audio":"./31_audio/2.mp3","hl":null}],[{"audio":"./31_audio/3.mp3","hl":null},{"audio":"./31_audio/4.mp3","hl":"stage-0"},{"audio":"./31_audio/5.mp3","hl":"stage-1"},{"audio":"./31_audio/6.mp3","hl":"stage-2"},{"audio":"./31_audio/7.mp3","hl":"stage-3"}],[{"audio":"./31_audio/8.mp3","hl":null}],[{"audio":"./31_audio/9.mp3","hl":"main"},{"audio":"./31_audio/10.mp3","hl":"meaning"},{"audio":"./31_audio/11.mp3","hl":"grammar"}],[{"audio":"./31_audio/12.mp3","hl":"main"},{"audio":"./31_audio/13.mp3","hl":"meaning"},{"audio":"./31_audio/14.mp3","hl":"grammar"}],[{"audio":"./31_audio/15.mp3","hl":"main"},{"audio":"./31_audio/16.mp3","hl":"meaning"},{"aud .removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
