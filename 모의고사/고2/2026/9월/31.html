</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

}
lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 31번","audioDir":"31_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">31번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Quantum People and the Changing Human Geography\u003c/h1>\u003ch2>양자 인간과 변화하는 인문 지리학\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사람들이 정기적으로 이동하면서 \u003cb class=\"key\">인문 \u003c/b>\u003cb class=\"key\">지리학\u003c/b>은 모호해지고, 인간은 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">입자\u003c/b>처럼 속도와 위치가 늘 \u003cb class=\"key\">유동적\u003c/b>이 된다. 오늘날 세계의 \u003cb class=\"key\">복잡성\u003c/b>은 영구적 정착을 어렵게 하며, 디지털 유목민에서 이주 노동자까지 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">인류\u003c/b>라는 글로벌 인구 집단이 증가하고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Human geography is becoming unclear as increasingly mobile people, like particles in quantum physics, form a growing global demographic of quantum people.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 인문 지리학이 점점 모호해지고 사람들이 양자 입자처럼 유동적으로 움직이는 시대에 대한 지문을 함께 볼게요. 이 글은 현대인들이 정기적으로 이동하면서 겪는 상태 변화와 양자 인류라는 새로운 인구 집단의 등장을 다루고 있어요. 먼저 요약과 요지를 잡고 들어가면, 인문 지리학이 모호해지고 오늘날의 복잡성이 영구적 정착을 어렵게 만든다는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인문 지리학(human geography)은 인간의 이동과 정착, 공간과의 관계를 다루는 분야예요. 이 글은 현대인들이 한곳에 정착하기보다 정기적으로 이동하는 모습을 \u003cb class=\"key\">상태 \u003c/b>\u003cb class=\"key\">변화\u003c/b>에 비유하고 있어요. 고체(solid)에서 액체(liquid), 기체(gas)로 갈수록 분자들이 서로에게서 느슨해지고 더 빠르게 진동하듯, 사람들의 \u003cb class=\"key\">이동성\u003c/b>도 커졌어요. 양자 물리학(quantum physics)에서 입자의 위치와 속도는 늘 \u003cb class=\"key\">불확정성\u003c/b>을 지니듯, 현대인의 삶도 고정되어 있지 않아요. 일상의 비유로, 평생 한 직장과 한 집에 머무는 대신 원격 근무로 여러 도시를 옮겨 다니는 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">유목민(digital \u003c/b>\u003cb class=\"key\">nomad)\u003c/b>을 떠올리면 돼요. 고액 연봉자부터 이주 노동자(migratory worker)까지 다양한 계층이 이 변화 속에 포함돼요.\u003c/div>","segs":[{"n":2,"text":"인문 지리학은 인간의 이동과 정착, 공간과의 관계를 다루는 분야예요. 이 지문은 현대인들이 한곳에 정착하기보다 정기적으로 이동하는 모습을 상태 변화에 비유하고 있어요. 고체에서 액체와 기체로 갈수록 분자들이 서로에게서 느슨해지고 더 빠르게 진동하듯, 사람들의 이동성도 커졌다는 거죠. 양자 물리학에서는 입자의 위치와 속도를 동시에 정확히 알 수 없고 늘 불확정성을 지니는데, 현대인의 삶도 이와 비슷하게 고정되어 있지 않아요. 일상적으로는 평생 한 직장과 한 집에 머무는 대신 원격 근무로 여러 도시를 옮겨 다니는 디지털 유목민을 떠올리면 쉬워요. 고액 연봉자부터 이주 노동자까지 다양한 계층이 이 변화 속에 포함돼 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>지리학의 모호함과 상태 변화 비유\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 문장에서 \u003cb class=\"key\">인문 \u003c/b>\u003cb class=\"key\">지리학\u003c/b>이 모호해지고 있다고 문제를 제기합니다. 이어 사람들이 정기적으로 이동하는 상황을 물질의 \u003cb class=\"key\">상태 \u003c/b>\u003cb class=\"key\">변화\u003c/b>에 비유합니다. 고체에서 액체, 기체로 변할 때 분자들이 가열되어 서로에게서 느슨해지고 더 빠르게 진동하는 모습과 인간의 이동성을 연결합니다. 이 단계는 현대인의 유동성을 설명하기 위한 비유의 시작입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>양자 입자 비유 확장\u003csmall>비유 확장 · 문장 3\u003c/small>\u003c/h4>\u003cp>인간이 양자 물리학의 \u003cb class=\"key\">입자\u003c/b>처럼 되고 있다고 말합니다. 이들의 속도와 위치는 늘 \u003cb class=\"key\">유동적\u003c/b>이며 끊임없는 변화 속에 있습니다. 앞선 상태 변화 비유를 더 추상적인 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">세계\u003c/b>의 불확정성으로 확장합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>안정 불가능과 복잡성\u003csmall>주장 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>안정된 모습으로 돌아가고 싶지만 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">세계\u003c/b>에서는 그렇게 작동하지 않는다고 대조합니다. 대신 오늘날 세계의 \u003cb class=\"key\">복잡성\u003c/b>이 어느 곳에든 영구적으로 \u003cb class=\"key\">정착\u003c/b>하는 것을 점점 어렵게 만든다고 핵심 주장을 제시합니다. 이 부분은 비유를 넘어 현실적 결론을 내리는 단계입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>양자 인류의 사례\u003csmall>예시 · 문장 6\u003c/small>\u003c/h4>\u003cp>고액 연봉의 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">유목민\u003c/b>과 여러 개의 여권을 가진 \u003cb class=\"key\">억만장자\u003c/b>, 그리고 \u003cb class=\"key\">이주 \u003c/b>\u003cb class=\"key\">노동자\u003c/b>를 사례로 듭니다. 이들은 모두 다양하고 증가하는 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">인류\u003c/b>라는 글로벌 인구 집단의 일부입니다. 앞선 주장을 구체적 계층으로 뒷받침합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장별로 글의 흐름을 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 인문 지리학이 모호해지고 있다고 문제를 제기한 뒤, 사람들이 정기적으로 이동하는 상황을 물질의 상태 변화에 비유해요. 고체에서 액체, 기체로 변할 때 분자들이 가열되어 서로에게서 느슨해지고 더 빠르게 진동하는 모습과 인간의 이동성을 연결하고 있어요. 이렇게 현대인의 유동성을 설명하기 위한 비유가 시작돼요.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 인간이 양자 물리학의 입자처럼 되고 있다고 말해요. 이들의 속도와 위치는 늘 유동적이고 끊임없는 변화 속에 있다고 설명하죠. 앞선 상태 변화 비유를 더 추상적인 양자 세계의 불확정성으로 확장하고 있어요.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장에서는 안정된 모습으로 돌아가고 싶지만 양자 세계에서는 그렇게 작동하지 않는다고 대조해요. 대신 오늘날 세계의 복잡성이 어느 곳에든 영구적으로 정착하는 것을 점점 어렵게 만든다는 핵심 주장을 제시해요. 이 부분은 비유를 넘어 현실적 결론을 내리는 단계예요.","hl":"f2"},{"n":7,"text":"여섯 번째 문장에서는 고액 연봉의 디지털 유목민과 여러 개의 여권을 가진 억만장자, 그리고 이주 노동자를 사례로 들어요. 이들은 모두 다양하고 증가하는 양자 인류라는 글로벌 인구 집단의 일부라고 정리하고 있어요. 앞선 주장을 구체적 계층으로 뒷받침하는 거죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째부터 네 번째 문장에서는 현대인의 이동성을 \u003cb class=\"key\">상태 \u003c/b>\u003cb class=\"key\">변화\u003c/b>와 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">입자\u003c/b>에 비유하며 현상을 설명합니다. 다섯 번째 문장에서 오늘날의 복잡성이 영구적 \u003cb class=\"key\">정착\u003c/b>을 어렵게 만든다는 핵심 주장이 제시됩니다. 여섯 번째 문장에서 디지털 유목민과 이주 노동자라는 구체적 \u003cb class=\"key\">예시\u003c/b>로 주장을 뒷받침합니다. 주장이 중간에 제시되고 앞뒤로 비유와 예시가 배치된 \u003cb class=\"key\">중괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>As (2)\u003c/b>\u003cspan>원인·때\u003c/span>\u003cb>like (2)\u003c/b>\u003cspan>비유\u003c/span>\u003cb>One might even say (3)\u003c/b>\u003cspan>비유 확장\u003c/span>\u003cb>but (4)\u003c/b>\u003cspan>대조·전환\u003c/span>\u003cb>Instead (5)\u003c/b>\u003cspan>주장·대조\u003c/span>\u003cb>as well as (6)\u003c/b>\u003cspan>추가·예시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Human geography is becoming unclear\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">people find themselves regularly on the move\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a phase shift\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">humans are becoming like particles in quantum physics\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their velocity and location always in flux\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">quantum people\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>안정으로의 회귀\u003c/th>\u003cth>양자 세계의 유동성\u003c/th>\u003c/tr>\u003ctr>\u003ctd>바람직함\u003c/td>\u003ctd>현실의 작동 방식\u003c/td>\u003c/tr>\u003ctr>\u003ctd>영구적 정착 가능\u003c/td>\u003ctd>이동과 유동의 증가\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거 전개 방식으로 볼 수 있어요. 첫 번째부터 네 번째 문장에서는 현대인의 이동성을 상태 변화와 양자 입자에 비유하며 현상을 설명하고, 다섯 번째 문장에서 오늘날의 복잡성이 영구적 정착을 어렵게 만든다는 핵심 주장을 제시해요. 여섯 번째 문장에서 디지털 유목민과 이주 노동자라는 구체적 예시로 주장을 뒷받침하죠. 주장이 중간에 제시되고 앞뒤로 비유와 예시가 배치된 중괄식 구조라고 할 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 두 번째 문장의 As는 원인이나 때를, like는 비유를 나타내요. 세 번째 문장의 One might even say는 비유를 한 단계 확장하는 표현이에요. 네 번째 문장의 but은 안정에 대한 바람과 현실 사이의 대조를 보여 주고, 다섯 번째 문장의 Instead는 앞선 내용을 뒤집으며 주장을 이끌어요. 여섯 번째 문장의 as well as는 예시를 추가하는 역할을 해요. 또한 human geography is becoming unclear부터 people on the move, particles in quantum physics, velocity and location in flux, quantum people까지 같은 개념을 여러 표현으로 재진술하며 흐름을 강화하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>human geography\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인문 지리학\u003c/span>\u003c/div>\u003cdiv>\u003cb>unclear\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>모호한\u003c/span>\u003c/div>\u003cdiv>\u003cb>on the move\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>이동하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>phase shift\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상태 변화\u003c/span>\u003c/div>\u003cdiv>\u003cb>matter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물질\u003c/span>\u003c/div>\u003cdiv>\u003cb>transition\u003c/b>\u003cem>동사\u003c/em>\u003cspan>변화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>solid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고체\u003c/span>\u003c/div>\u003cdiv>\u003cb>liquid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>액체\u003c/span>\u003c/div>\u003cdiv>\u003cb>gas\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기체\u003c/span>\u003c/div>\u003cdiv>\u003cb>molecule\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분자\u003c/span>\u003c/div>\u003cdiv>\u003cb>heat up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가열되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>loosen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>느슨해지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vibrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진동하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>particle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>입자\u003c/span>\u003c/div>\u003cdiv>\u003cb>quantum physics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양자 물리학\u003c/span>\u003c/div>\u003cdiv>\u003cb>velocity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>속도\u003c/span>\u003c/div>\u003cdiv>\u003cb>location\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위치\u003c/span>\u003c/div>\u003cdiv>\u003cb>in flux\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>끊임없는 변화 속에\u003c/span>\u003c/div>\u003cdiv>\u003cb>stability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안정\u003c/span>\u003c/div>\u003cdiv>\u003cb>quantum world\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양자 세계\u003c/span>\u003c/div>\u003cdiv>\u003cb>complexity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>복잡성\u003c/span>\u003c/div>\u003cdiv>\u003cb>increasingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>점점\u003c/span>\u003c/div>\u003cdiv>\u003cb>settle\u003c/b>\u003cem>동사\u003c/em>\u003cspan>정착하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>permanently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>영구적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>highly paid\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고액 연봉의\u003c/span>\u003c/div>\u003cdiv>\u003cb>digital nomad\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디지털 유목민\u003c/span>\u003c/div>\u003cdiv>\u003cb>billionaire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>억만장자\u003c/span>\u003c/div>\u003cdiv>\u003cb>migratory worker\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이주 노동자\u003c/span>\u003c/div>\u003cdiv>\u003cb>quantum people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양자 인류\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 어휘를 짚어 볼게요. human geography는 인문 지리학, unclear는 모호한, on the move는 이동하는 뜻이에요. phase shift는 상태 변화, quantum physics는 양자 물리학, velocity는 속도, location은 위치, in flux는 끊임없는 변화 속에 있어요. settle은 정착하다, permanently는 영구적으로, digital nomad는 디지털 유목민, migratory worker는 이주 노동자, quantum people은 양자 인류라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">unclear\u003c/b>\u003cspan class=\"m\">모호한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ambiguous\u003c/span>\u003cspan class=\"s\">vague\u003c/span>\u003cspan class=\"s\">obscure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clear\u003c/span>\u003cspan class=\"a\">distinct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">on the move\u003c/b>\u003cspan class=\"m\">이동하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mobile\u003c/span>\u003cspan class=\"s\">traveling\u003c/span>\u003cspan class=\"s\">wandering\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stationary\u003c/span>\u003cspan class=\"a\">settled\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stability\u003c/b>\u003cspan class=\"m\">안정\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">steadiness\u003c/span>\u003cspan class=\"s\">security\u003c/span>\u003cspan class=\"s\">balance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">instability\u003c/span>\u003cspan class=\"a\">fluctuation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">complexity\u003c/b>\u003cspan class=\"m\">복잡성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">complication\u003c/span>\u003cspan class=\"s\">intricacy\u003c/span>\u003cspan class=\"s\">difficulty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">simplicity\u003c/span>\u003cspan class=\"a\">ease\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">settle\u003c/b>\u003cspan class=\"m\">정착하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reside\u003c/span>\u003cspan class=\"s\">dwell\u003c/span>\u003cspan class=\"s\">establish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">move\u003c/span>\u003cspan class=\"a\">migrate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">in flux\u003c/b>\u003cspan class=\"m\">끊임없는 변화 속에\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">changing\u003c/span>\u003cspan class=\"s\">fluid\u003c/span>\u003cspan class=\"s\">unstable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fixed\u003c/span>\u003cspan class=\"a\">stable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">diverse\u003c/b>\u003cspan class=\"m\">다양한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">varied\u003c/span>\u003cspan class=\"s\">various\u003c/span>\u003cspan class=\"s\">different\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uniform\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 동의어와 반의어를 정리해 볼게요. unclear은 ambiguous, vague, obscure과 비슷하고 반대는 clear, distinct예요. on the move는 mobile, traveling과 비슷하고 stationary, settled와 반대예요. stability는 steadiness, security와 비슷하고 instability와 반대예요. complexity는 complication, intricacy와 비슷하고 simplicity와 반대예요. settle은 reside, dwell과 비슷하고 move, migrate와 반대예요. in flux는 changing, fluid와 비슷하고 fixed, stable과 반대예요. diverse는 varied, various와 비슷하고 uniform, identical과 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인문 지리학은\u003c/span>\u003cspan class=\"en\">Human geography\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모호해지고 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">becoming \u003c/span>\u003cspan class=\"tgt\">unclear\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인문 지리학은 모호해지고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 화두를 던집니다. 인문 지리학, 즉 인간과 장소의 관계가 \u003cb class=\"key\">모호\u003c/b>해지고 있다는 주장입니다. 뒤에 전개될 양자 인류 논의의 \u003cb class=\"key\">출발점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : 주어 + be동사 + 현재분사(V-ing) + 형용사(주격 보어) : \"모호해지고 있다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Human geography, 인문 지리학은. is becoming unclear, 모호해지고 있다.. 이 문장 전체를 해석하면, 인문 지리학은 모호해지고 있다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 화두를 던집니다. 인문 지리학, 즉 인간이 장소와 맺는 관계가 모호해지고 있다는 주장입니다. 뒤에 나올 양자 인류 논의의 출발점 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 is becoming unclear입니다. be동사와 becoming이 결합한 현재진행형으로, 지금 진행 중인 변화를 나타냅니다. becoming은 become의 현재분사이고, unclear은 주격 보어입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 정기적으로 이동하는 상황에 놓이게 됨에 따라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">themselves \u003c/span>\u003cspan class=\"tgt\">regularly \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">move\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 상태 변화를 경험하고 있다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">experiencing\u003c/span> a phase shift\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물질이 고체에서 액체로, 액체에서 기체로 변할 때와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">matter \u003c/span>\u003cspan class=\"tgt\">transitions \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">solid \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">liquid \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">gas\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분자들이 가열되어 서로에게서 느슨해져\u003c/span>\u003cspan class=\"en\">molecules heat up and loosen from one another,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 빠르게 진동하는 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">vibrating \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">rapidly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들이 정기적으로 이동하는 상황에 놓이게 됨에 따라, 우리는 물질이 고체에서 액체로, 액체에서 기체로 변할 때와 같은 상태 변화를 경험하고 있다. 즉, 분자들이 가열되어 서로에게서 느슨해져, 더 빠르게 진동하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사람의 이동을 물질의 \u003cb class=\"key\">상태 \u003c/b>\u003cb class=\"key\">변화\u003c/b>에 비유합니다. 분자가 가열되면 서로에게서 느슨해지고 더 빠르게 진동하듯, 사람들도 이동이 잦아지며 기존의 안정된 관계에서 \u003cb class=\"key\">느슨\u003c/b>해지고 있다는 뜻입니다. 즉, 인문 지리학이 모호해지는 이유를 비유적으로 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 As (부사절)\u003c/span> : As + 주어 + 동사, 주절 : \"사람들이 정기적으로 이동하는 상황에 놓이게 됨에 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + 현재분사(V-ing) : \"경험하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 like + 의문사절\u003c/span> : like + when + 주어 + 동사 : \"물질이 고체에서 액체로, 액체에서 기체로 변할 때와 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">분사구문 (부대상황)\u003c/span> : V-ing (동시상황·부대상황) : \"더 빠르게 진동하는 것이다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"As people find themselves regularly on the move, 사람들이 정기적으로 이동하는 상황에 놓이게 됨에 따라. we are experiencing a phase shift, 우리는 상태 변화를 경험하고 있다. like when matter transitions from solid to liquid to gas, 물질이 고체에서 액체로, 액체에서 기체로 변할 때와 같은. molecules heat up and loosen from one another, 분자들이 가열되어 서로에게서 느슨해져. vibrating more rapidly, 더 빠르게 진동하는 것이다.. 이 문장 전체를 해석하면, 사람들이 정기적으로 이동하는 상황에 놓이게 됨에 따라, 우리는 물질이 고체에서 액체로, 액체에서 기체로 변할 때와 같은 상태 변화를 경험하고 있다. 즉, 분자들이 가열되어 서로에게서 느슨해져, 더 빠르게 진동하는 것이다.","hl":"m"},{"n":16,"text":"이 문장은 사람의 이동을 물질의 상태 변화에 비유합니다. 분자가 가열되면 서로에게서 느슨해지고 더 빠르게 진동하듯, 사람들도 이동이 잦아지며 기존의 안정된 관계에서 느슨해지고 있다는 뜻입니다. 즉, 인문 지리학이 모호해지는 이유를 비유적으로 설명합니다.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 As people find themselves regularly on the move입니다. As는 여기서 ~함에 따라라는 뜻으로 뒤에 부사절을 이끌어요. 두 번째 어법 포인트는 are experiencing으로, be동사와 현재분사가 결합한 현재진행형이에요. 세 번째 어법 포인트는 like when matter transitions from solid to liquid to gas인데, 전치사 like가 뒤에 의문사절인 when절을 목적어로 취해 비교 대상이 되는 상황을 설명해요. 네 번째 어법 포인트는 vibrating more rapidly로, 분자들이 가열되어 느슨해질 때의 동시 상황을 나타내는 분사구문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹자는 심지어 말하는데\u003c/span>\u003cspan class=\"en\">One \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간이 입자처럼 되고 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">humans \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">becoming \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">particles\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">양자 물리학의\u003c/span>\u003cspan class=\"en\">in quantum physics,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 속도와 위치가 늘 끊임없는 변화 속에 있다는 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">velocity \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">location \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">flux\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">혹자는 심지어 인간이 양자 물리학의 입자처럼 되고 있다고 말하는데, 즉 그들의 속도와 위치가 늘 끊임없는 변화 속에 있다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 비유를 한 단계 더 발전시켜 인간을 양자 물리학의 입자로 봅니다. 양자 입자는 위치와 속도가 고정되지 않고 늘 요동하듯, 현대인도 한곳에 머물지 못하고 이동한다는 것입니다. 이는 뒤에 나오는 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">인류\u003c/b>라는 표현을 끌어내는 핵심 \u003cb class=\"key\">연결 \u003c/b>\u003cb class=\"key\">고리\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 might (가능성)\u003c/span> : might + 동사원형 : \"혹자는 심지어 말할지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that (목적어)\u003c/span> : 동사 + that + 주어 + 동사 : \"인간이 입자처럼 되고 있다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">독립분사구문 (being 생략)\u003c/span> : 주어 + (being) + 전치사구/형용사 : \"그들의 속도와 위치가 늘 끊임없는 변화 속에 있다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"One might even say, 혹자는 심지어 말하는데. that humans are becoming like particles, 인간이 입자처럼 되고 있다고. in quantum physics, 양자 물리학의. their velocity and location always in flux, 그들의 속도와 위치가 늘 끊임없는 변화 속에 있다는 것이다.. 이 문장 전체를 해석하면, 혹자는 심지어 인간이 양자 물리학의 입자처럼 되고 있다고 말하는데, 즉 그들의 속도와 위치가 늘 끊임없는 변화 속에 있다는 것이다.","hl":"m"},{"n":19,"text":"이 문장은 비유를 한 단계 더 발전시켜 인간을 양자 물리학의 입자로 봅니다. 양자 입자는 위치와 속도가 고정되지 않고 늘 요동하듯, 현대인도 한곳에 머물지 못하고 이동한다는 것입니다. 이는 뒤에 나오는 양자 인류라는 표현을 끌어내는 핵심 연결 고리입니다.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 might even say입니다. might는 조심스러운 가능성을 나타내는 조동사이고, 뒤에 동사원형 say가 옵니다. 두 번째 어법 포인트는 that humans are becoming like particles로, say의 목적어 자리에 명사절을 이끄는 접속사 that이 쓰였습니다. 세 번째 어법 포인트는 their velocity and location always in flux로, 주절과 다른 자체 주어를 가지는 독립분사구문이며 being이 생략된 형태입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋을 텐데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">nice \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 정도 안정된 모습으로 돌아가는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">return \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">form \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">stability\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그것은 일이 돌아가는 방식이 아니다\u003c/span>\u003cspan class=\"en\">but that's not \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">양자 세계에서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">quantum \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어느 정도 안정된 모습으로 돌아가는 것이 좋겠지만, 양자 세계에서 상황은 그렇게 돌아가지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 인간이 양자 물리학 입자처럼 속도와 위치가 계속 변한다고 했죠. 이 문장은 안정된 모습으로 돌아가고 싶지만 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">세계\u003c/b>에서는 그렇게 돌아가지 않는다고 하면서 안정을 바라는 마음을 접게 합니다. 여기서 '일이 그런 식으로 돌아가지 않는다'는 것은 현실의 \u003cb class=\"key\">작동 \u003c/b>\u003cb class=\"key\">원리\u003c/b>를 뜻해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it과 to부정사 진주어\u003c/span> : It would be nice + [to return to some form of stability (to부정사구/진주어)] : \"어느 정도 안정된 모습으로 돌아가는 것은 좋을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 how가 이끄는 간접의문문\u003c/span> : not + [how things work in a quantum world (간접의문문/명사절)] : \"양자 세계에서 일이 돌아가는 방식이 아니다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It would be nice, 좋을 텐데. to return to some form of stability, 어느 정도 안정된 모습으로 돌아가는 것은. but that's not how things work, 하지만 그것은 일이 돌아가는 방식이 아니다. in a quantum world, 양자 세계에서는. 이 문장 전체를 해석하면, 어느 정도 안정된 모습으로 돌아가는 것이 좋겠지만, 양자 세계에서 상황은 그렇게 돌아가지 않는다.","hl":"m"},{"n":22,"text":"이 문장은 안정된 상태로 돌아가고 싶지만 양자 세계에서는 그렇게 돌아가지 않는다고 말합니다. 앞에서 인간이 양자 물리학 입자처럼 속도와 위치가 늘 변한다고 했죠. 그래서 현실의 작동 원리가 안정적인 복귀를 허락하지 않는다는 뜻이에요.","hl":"mn"},{"n":23,"text":"첫 번째, It would be nice to return to some form of stability에서 It이 가주어이고 진짜 주어는 to return 이하입니다. 주어가 길어서 뒤로 보내고 가주어 It을 쓴 거예요. 두 번째, but that's not how things work in a quantum world에서 how things work는 how가 이끄는 간접의문문이 be동사의 보어로 쓰였습니다. how는 '어떻게'가 아니라 '일이 돌아가는 방식'처럼 명사절로 해석하는 게 자연스러워요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에\u003c/span>\u003cspan class=\"en\">Instead,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날 세계의 복잡성은\u003c/span>\u003cspan class=\"en\">the complexity of today's world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 점점 더 어렵게 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">increasingly \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 곳에든 영구적으로 정착하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">settle \u003c/span>\u003cspan class=\"tgt\">permanently \u003c/span>\u003cspan class=\"tgt\">anywhere\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신에, 오늘날 세계의 복잡성은 어느 곳에든 영구적으로 정착하는 것을 점점 어렵게 만든다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대신, 오늘날 세계의 \u003cb class=\"key\">복잡성\u003c/b>이 어느 곳에든 \u003cb class=\"key\">영구적으로 \u003c/b>\u003cb class=\"key\">정착\u003c/b>하는 것을 점점 더 어렵게 만든다는 문장입니다. 앞 문장의 '안정으로 돌아갈 수 없다'는 말을 받아서 그 이유를 설명해요. 즉 불안정한 이동이 개인의 선택이 아니라 \u003cb class=\"key\">세계의 \u003c/b>\u003cb class=\"key\">복잡성\u003c/b> 때문에 어쩔 수 없다는 논리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가목적어 it과 to부정사 진목적어\u003c/span> : make + it(가목적어) + [increasingly difficult(목적보어)] + [to settle permanently anywhere(진목적어/to부정사구)] : \"영구적으로 정착하는 것을 점점 더 어렵게 만든다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Instead, 대신에. the complexity of today's world, 오늘날 세계의 복잡성은. makes it increasingly difficult, 그것을 점점 더 어렵게 만든다. to settle permanently anywhere, 어느 곳에든 영구적으로 정착하는 것을. 이 문장 전체를 해석하면, 대신에, 오늘날 세계의 복잡성은 어느 곳에든 영구적으로 정착하는 것을 점점 어렵게 만든다.","hl":"m"},{"n":25,"text":"Instead는 앞 문장과 반대로 오늘날 세계의 복잡성이 어느 곳에든 영구적으로 정착하는 것을 점점 더 어렵게 만든다고 말합니다. 안정을 바라는 마음과 달리 복잡한 세계가 이동과 불안정을 강제한다는 뜻이죠. 그래서 이 문장은 이 글 전체의 핵심 원인에 해당합니다.","hl":"mn"},{"n":26,"text":"이 문장의 핵심 어법은 makes it increasingly difficult to settle permanently anywhere입니다. 동사 makes의 목적어 자리에 가목적어 it이 오고 목적보어 difficult가 그 상태를 설명합니다. 진짜 목적어는 to settle permanently anywhere라는 to부정사구인데 목적어가 길어서 뒤로 보낸 구조예요. 이렇게 make it difficult to do 같은 형태는 무엇인가 하는 것을 어렵게 만들다라는 뜻으로 자주 출제됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고액 연봉의 디지털 유목민들과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Highly \u003c/span>\u003cspan class=\"tgt\">paid \u003c/span>\u003cspan class=\"tgt\">digital \u003c/span>\u003cspan class=\"tgt\">nomads\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 개의 여권을 가진 억만장자들과\u003c/span>\u003cspan class=\"en\">and billionaires \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">multiple \u003c/span>\u003cspan class=\"tgt\">passports\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이주 노동자들도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">migratory \u003c/span>\u003cspan class=\"tgt\">workers\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두 다양하고 증가하는 양자 인류라는 글로벌 인구 집단의 일부이다\u003c/span>\u003cspan class=\"en\">are all part of the diverse and growing global demographic of quantum people.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이주 노동자뿐만 아니라 고액 연봉의 디지털 유목민들과 여러 개의 여권을 가진 억만장자들도 모두 다양하고 증가하는 양자 인류라는 글로벌 인구 집단의 일부이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 고액 연봉의 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">유목민\u003c/b>, 여러 개의 여권을 가진 \u003cb class=\"key\">억만장자\u003c/b>, \u003cb class=\"key\">이주 \u003c/b>\u003cb class=\"key\">노동자\u003c/b>까지 서로 다른 계층을 나열해요. 이들은 모두 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">인류\u003c/b>라는 글로벌 인구 집단의 일부라는 겁니다. 앞 문장의 복잡한 세계에서 이동하는 사람들을 구체적 사례로 보여주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : [Highly paid (과거분사구/형용사적 수식)] + digital nomads : \"고액 연봉의 디지털 유목민들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : billionaires + [with multiple passports (전치사구/형용사적 수식)] : \"여러 개의 여권을 가진 억만장자들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">상관접속사 as well as에 의한 병렬\u003c/span> : A and B as well as C : \"이주 노동자들뿐만 아니라\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Highly paid digital nomads, 고액 연봉의 디지털 유목민들과. and billionaires with multiple passports, 여러 개의 여권을 가진 억만장자들과. as well as migratory workers, 이주 노동자들도. are all part of the diverse and growing global demographic of quantum people, 모두 다양하고 증가하는 양자 인류라는 글로벌 인구 집단의 일부이다. 이 문장 전체를 해석하면, 이주 노동자뿐만 아니라 고액 연봉의 디지털 유목민들과 여러 개의 여권을 가진 억만장자들도 모두 다양하고 증가하는 양자 인류라는 글로벌 인구 집단의 일부이다.","hl":"m"},{"n":28,"text":"이 문장은 고액 연봉의 디지털 유목민들과 여러 개의 여권을 가진 억만장자들, 그리고 이주 노동자들까지 모두 양자 인류라는 글로벌 인구 집단의 일부라고 말합니다. 앞 문장에서 오늘날 세계의 복잡성이 정착을 어렵게 만든다고 했잖아요. 그에 따라 부자부터 노동자까지 다양한 사람들이 이동하는 삶을 살고 있다는 것을 구체적으로 보여주는 문장입니다.","hl":"mn"},{"n":29,"text":"첫 번째로 Highly paid digital nomads에서 Highly paid는 과거분사 paid가 형용사처럼 digital nomads를 꾸며 줍니다. 두 번째로 billionaires with multiple passports에서 전치사구 with multiple passports가 앞의 명사 billionaires를 뒤에서 수식합니다. 세 번째로 and billionaires with multiple passports as well as migratory workers는 A and B as well as C 병렬 구조입니다. as well as는 뒤에 오는 말보다 앞의 A와 B에 더 힘을 주면서 모두 포함한다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>현대인들은 정기적으로 \u003cb class=\"key\">이동\u003c/b>하며, 물질이 고체에서 액체와 기체로 변하는 \u003cb class=\"key\">상태 \u003c/b>\u003cb class=\"key\">변화\u003c/b>와 같은 현상을 겪는다.\u003c/li>\u003cli>인간은 마치 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">입자\u003c/b>처럼 되어 속도와 위치가 언제나 \u003cb class=\"key\">유동적\u003c/b>이다.\u003c/li>\u003cli>안정된 모습으로 돌아가고 싶지만, 오늘날 세계의 \u003cb class=\"key\">복잡성\u003c/b> 때문에 영구적으로 \u003cb class=\"key\">정착\u003c/b>하기가 점점 어렵다.\u003c/li>\u003cli>고액 연봉의 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">유목민\u003c/b>과 여러 개의 여권을 가진 억만장자, 이주 노동자까지 모두 증가하는 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">인류\u003c/b>의 일부이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Human geography is becoming unclear as increasingly mobile people, like particles in quantum physics, form a growing global demographic of quantum people.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사람들이 정기적으로 이동하면서 \u003cb class=\"key\">인문 \u003c/b>\u003cb class=\"key\">지리학\u003c/b>은 모호해지고, 인간은 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">입자\u003c/b>처럼 속도와 위치가 늘 \u003cb class=\"key\">유동적\u003c/b>이 된다. 오늘날 세계의 \u003cb class=\"key\">복잡성\u003c/b>은 영구적 정착을 어렵게 하며, 디지털 유목민에서 이주 노동자까지 \u003cb class=\"key\">양자 \u003c/b>\u003cb class=\"key\">인류\u003c/b>라는 글로벌 인구 집단이 증가하고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"정리하면 이 글은 현대인의 이동성이 커지면서 인문 지리학이 모호해지고, 양자 입자처럼 유동적인 양자 인류가 등장하고 있다는 내용이에요. 안정된 정착을 바라지만 오늘날의 복잡성 때문에 영구적으로 한곳에 머물기 어렵다는 주장을 사례와 함께 전달하고 있어요. 시험에서는 상태 변화와 양자 물리학 비유의 공통점, 그리고 Instead 이하의 핵심 주장을 정확히 연결하는 것이 중요해요. 오늘 강의는 여기까지예요, 수고했어요.","hl":null}]}]});</script></body></html>
