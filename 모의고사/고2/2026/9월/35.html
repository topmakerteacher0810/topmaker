 최근에는 사물인터넷(Internet of Things)과 초고속 통신망이 결합하면서 그 수준이 완전히 달라졌답니다. 현실의 사물에 부착된 센서(Sensor)가 실시간 데이터(Real-time data)를 끊임없이 통신망으로 보내주면, 가상 세계의 쌍둥이 모델도 현실과 똑같이 실시간으로 상태를 업데이트하며 동기화되는 원리죠. 예를 들어, 실제 비행기를 띄우거나 발전소를 가동하기 전에 가상의 환경에서 미리 기계를 돌려보며 어느 부품이 언제 고장이 날지 미리 예측하고 분석할 수 있기 때문에, 산업 현장에서 기계 멈춤으로 인해 발생할 수 있는 막대한 비용 손실과 위험을 예방하는 핵심 기술로 활용되고 있습니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01개념 및 과거의 활용</div><ul><li>디지털 트윈은 자산이나 활동의 디지털 복제본으로, 과거부터 산업 전반에서 활용되었습니다.</li><li>자산(assets)이나 활동의 디지털 복제본(digital replicas)</li><li>과거에도 3D 렌더링 및 공정 시뮬레이션(process simulations) 형태로 존재함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02기술 발전에 따른 진화</div><ul><li>무선 네트워크와 실시간 데이터의 발전으로 디지털 트윈이 더욱 정교하고 역동적으로 변했습니다.</li><li>더 빠른 무선 네트워크(wireless networks)의 등장</li><li>실시간 데이터(real-time data)의 가용성 증가</li><li>상세하고 동적인 디지털 표현(dynamic digital representations) 구현</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실시간 연동 및 작동 원리</div><ul><li>센서 데이터를 지속적으로 반영하여 물리적 대상과 완벽하게 동일한 실시간 복제본을 만듭니다.</li><li>센서(sensors)가 기기에서 데이터를 수집</li><li>수집된 데이터로 디지털 트윈을 지속적으로 업데이트(continuously update)</li><li>물리적 객체(physical object)의 속성과 상태를 실시간으로 정확히 복사</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실제 산업 적용 사례</div><ul><li>고가이거나 가동이 멈추면 큰 손실이 발생하는 주요 자산에 디지털 트윈이 널리 쓰이고 있습니다.</li><li>발전용 터빈, 제트 엔진 등 물리적 자산(physical assets)에 적용</li><li>자산의 가치가 매우 높을 때 유용함</li><li>가동 중단 시간(downtime)으로 인한 비용 손실이 큰 경우에 필수적</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">replica</td><td class=\"m\">복제품, 모형</td></tr><tr><td class=\"w\">asset</td><td class=\"m\">자산, 재산</td></tr><tr><td class=\"w\">representation</td><td class=\"m\">표현, 묘사</td></tr><tr><td class=\"w\">simulation</td><td class=\"m\">모의실험, 시뮬레이션</td></tr><tr><td class=\"w\">resulting</td><td class=\"m\">그 결과로 생기는, 결과적인</td></tr><tr><td class=\"w\">availability</td><td class=\"m\">유용성, 이용 가능성</td></tr><tr><td class=\"w\">detailed</td><td class=\"m\">상세한, 자세한</td></tr><tr><td class=\"w\">dynamic</td><td class=\"m\">역동적인, 동적인</td></tr><tr><td class=\"w\">continuously</td><td class=\"m\">계속해서, 연속적으로</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">update</td><td class=\"m\">갱신하다, 최신 상태로 만들다</td></tr><tr><td class=\"w\">accurate</td><td class=\"m\">정확한, 정밀한</td></tr><tr><td class=\"w\">property</td><td class=\"m\">속성, 특성, 재산</td></tr><tr><td class=\"w\">state</td><td class=\"m\">상태, 형편</td></tr><tr><td class=\"w\">for instance</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">valuable</td><td class=\"m\">가치 있는, 귀중한</td></tr><tr><td class=\"w\">downtime</td><td class=\"m\">작동 불능 시간, 휴지 시간</td></tr><tr><td class=\"w\">costly</td><td class=\"m\">비용이 많이 드는, 대가가 큰</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">디지털 트윈은 자산이나 활동의 디지털 복제본이다</span><span class=\"en\"><b>Digital twins are digital replicas of assets or activities</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">모델링과 센서를 사용하는</span><span class=\"en\"><b><span class=\"grammar-hl\">using</span> modeling and sensors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디지털 표현을 만들기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to create</span> digital representations.</b></span></div></div><div class=\"lec-sent-ko\">디지털 트윈은 디지털 표현을 만들기 위해 모델링과 센서를 사용하는 자산이나 활동의 디지털 복제본이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심 소재인 &#39;디지털 트윈&#39;의 개념을 정의하며 글을 시작합니다. 현실 세계의 물건이나 움직임을 컴퓨터 속에 똑같이 구현해 놓은 쌍둥이라는 의미입니다. 이때 create digital representations는 현실의 모습을 디지털 세상에 시각적이고 수치화된 데이터 형태로 고스란히 재현해 낸다는 뜻을 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">using (현재분사(형용사적)): using이 앞의 명사(digital replicas 또는 assets or activities)를 수식(= &#39;모델링과 센서를 사용하는 N&#39;). N + -ing 구조로 명사가 직접 동작을 수행하는 &#39;...을 하는/사용하는 N&#39;의 의미를 나타낸다.</div><div class=\"lec-gr-item\">to create (to부정사): 부사적 용법(목적)으로 쓰여 &#39;디지털 표현(표상)을 만들기 위해서&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">replica</td><td class=\"m\">복제품, 모형</td></tr><tr><td class=\"w\">asset</td><td class=\"m\">자산, 재산</td></tr><tr><td class=\"w\">representation</td><td class=\"m\">표현, 묘사</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">디지털 트윈은 새로운 것이 아니다</span><span class=\"en\"><b>Digital twins are not new;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 산업의 엔지니어링 팀은</span><span class=\"en\"><b>engineering teams in various industries</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">3D 렌더링을 사용해 왔다</span><span class=\"en\"><b><span class=\"grammar-hl\">have used</span> 3D renderings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">컴퓨터 지원 설계 모델, 자산 모델 및 공정 시뮬레이션의</span><span class=\"en\"><b>of <span class=\"grammar-hl\">computer-aided</span> design models, asset models, and process simulations</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수년 동안</span><span class=\"en\"><b>for years.</b></span></div></div><div class=\"lec-sent-ko\">디지털 트윈은 새로운 것이 아니다. 가령 다양한 산업의 엔지니어링 팀은 수년 동안 컴퓨터 지원 설계(CAD) 모델의 3D 렌더링, 자산 모델 및 공정 시뮬레이션을 사용해 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 소개한 디지털 트윈이 최근에 갑자기 발명된 개념이 아님을 밝히며 배경지식을 더해 줍니다. are not new — 글쓴이는 여기서 힘주어 말합니다. 이미 오래전부터 여러 산업 현장의 설계자들이 설계도나 공정 과정을 3차원 컴퓨터 그래픽으로 미리 그려보며 작업에 활용해 왔다는 역사적 사실을 환기시킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">have used (현재완료): have + p.p.(과거분사) 구조로, 과거 수년 전부터 현재까지 지속적으로 사용해 왔음을 나타낸다.</div><div class=\"lec-gr-item\">computer-aided (과거분사(형용사적)): computer-aided가 뒤의 명사 design models를 수식(= &#39;컴퓨터의 지원을 받는 N&#39;). p.p. + N ≈ &#39;p.p.된 N&#39;의 수동적 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">asset</td><td class=\"m\">자산, 재산</td></tr><tr><td class=\"w\">simulation</td><td class=\"m\">모의실험, 시뮬레이션</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 더 빠른 무선 네트워크와</span><span class=\"en\"><b>However, faster wireless networks</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그로 인한 실시간 데이터의 가용성은</span><span class=\"en\"><b>and the <span class=\"grammar-hl\">resulting</span> availability of real-time data</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 상세하고 역동적인 디지털 표현을 가능하게 한다</span><span class=\"en\"><b>enable much more <span class=\"grammar-hl\">detailed</span> and dynamic digital representations.</b></span></div></div><div class=\"lec-sent-ko\">그러나 더 빠른 무선 네트워크와 그로 인한 실시간 데이터의 가용성은 훨씬 더 상세하고 역동적인 디지털 표현을 가능하게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 내용에서 흐름을 전환하여, 과거에도 비슷한 기술이 있었지만 현대 통신 기술의 발전으로 그 수준이 완전히 달라졌음을 강조합니다. resulting availability of real-time data를 &#39;그로 인한 실시간 데이터의 가용성&#39;이라고 옮기면 어렵게 느껴집니다. 쉽게 말해 무선 인터넷이 빨라진 덕분에, 현실 기계에서 발생하는 데이터를 지연 없이 곧바로 컴퓨터로 받아볼 수 있게 되었다는 의미입니다. 이를 통해 과거보다 훨씬 정교하고 생동감 넘치는 가상 모델을 만들 수 있게 되었습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">resulting (현재분사(형용사적)): resulting이 뒤의 명사 availability를 수식(= &#39;결과로 발생하는 N&#39;). -ing + N ≈ &#39;...하는 N&#39; 의미를 나타낸다.</div><div class=\"lec-gr-item\">detailed (과거분사(형용사적)): detailed가 뒤의 명사 representations를 수식(= &#39;상세화된 N&#39;). p.p. + N ≈ &#39;p.p.된 N&#39;의 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">representation</td><td class=\"m\">표현, 묘사</td></tr><tr><td class=\"w\">resulting</td><td class=\"m\">그 결과로 생기는, 결과적인</td></tr><tr><td class=\"w\">availability</td><td class=\"m\">유용성, 이용 가능성</td></tr><tr><td class=\"w\">detailed</td><td class=\"m\">상세한, 자세한</td></tr><tr><td class=\"w\">dynamic</td><td class=\"m\">역동적인, 동적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">센서가 데이터를 수집할 때</span><span class=\"en\"><b>When sensors collect data</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">연결된 기기로부터,</span><span class=\"en\"><b>from a <span class=\"grammar-hl\">connected</span> device,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 센서 데이터는 사용될 수 있다</span><span class=\"en\"><b>the sensor data <span class=\"grammar-hl\">can be used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">디지털 트윈을 지속적으로 업데이트하는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">to continuously update</span> the digital twin.</b></span></div></div><div class=\"lec-sent-ko\">연결된 기기로부터 센서가 데이터를 수집할 때, 그 센서 데이터는 디지털 트윈을 지속적으로 업데이트하는 데 사용될 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 &#39;실시간 데이터&#39;가 실제로 어떻게 가상 모델을 역동적으로 만드는지 그 원리를 구체적으로 설명합니다. 현실 기계에 부착된 센서가 정보를 보내면, 가상 컴퓨터 모델이 그 정보에 맞춰 쉴 새 없이 자신의 상태를 현실과 똑같이 맞추며 변화한다는 뜻을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">connected (과거분사(형용사적)): connected가 뒤의 명사 device를 수식(= &#39;연결된 N&#39;). p.p. + N ≈ &#39;p.p.된 N&#39;의 의미를 나타낸다.</div><div class=\"lec-gr-item\">can be used (수동태): 조동사(can) + be동사(be) + p.p.(used) 구조. use는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 can be used 형태로 쓴다. 기본구조: use + O(목적어) + toV (O를 ~하는 데 사용하다)에서 목적어가 주어로 올라가 수동태가 되고, 뒤의 부정사(toV)는 구조가 그대로 남는 형태이다.</div><div class=\"lec-gr-item\">to continuously update (to부정사): 부사적 용법(목적)으로 쓰여 &#39;지속적으로 업데이트하기 위해&#39;라는 의미를 나타낸다. 부사 continuously가 to와 동사원형 사이에 위치하여 동사를 직접 수식하는 분리부정사 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">continuously</td><td class=\"m\">계속해서, 연속적으로</td></tr><tr><td class=\"w\">update</td><td class=\"m\">갱신하다, 최신 상태로 만들다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">디지털 트윈은 정확한 실시간 복사본이 된다</span><span class=\"en\"><b>The digital twin <span class=\"grammar-hl\">becomes</span> a real-time accurate copy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">물리적 객체의 속성과 상태의</span><span class=\"en\"><b>of a physical object's properties and states.</b></span></div></div><div class=\"lec-sent-ko\">디지털 트윈은 물리적 객체의 속성과 상태에 대한 정확한 실시간 복사본이 된다. (유사하게, 디지털 트윈은 엄격하게 기술적인 맥락을 벗어난 논의를 제한하며 감정적이거나 문화적인 요소를 포착하지 못한다.)</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 데이터 업데이트 과정의 결과를 요약합니다. 현실의 사물과 컴퓨터 속 모델이 완전히 동기화되는 단계입니다. a real-time accurate copy는 &#39;실시간의 정확한 복사본&#39;이라는 직역에서 더 나아가, 현실 기계의 온도, 속도, 부품 마모 상태 등 현재 벌어지고 있는 모든 상황이 컴퓨터 화면 속 가상 모델에 오차 없이 즉각적으로 반영되는 상태를 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">becomes 2형식(SVC) 구조: 불완전 자동사 becomes 뒤에 주어의 상태 변화를 나타내는 명사 주격 보어(a real-time accurate copy)가 온 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">accurate</td><td class=\"m\">정확한, 정밀한</td></tr><tr><td class=\"w\">state</td><td class=\"m\">상태, 형편</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 6</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어, 물리적 자산의 디지털 트윈은</span><span class=\"en\"><b>For instance, digital twins of physical assets</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">발전 터빈, 제트 엔진, 기차 엔진과 같은</span><span class=\"en\"><b><span class=\"grammar-hl\">such as</span> power-generation turbines, jet engines, and train engines</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일반화되고 있다</span><span class=\"en\"><b>are becoming common</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자산이 매우 가치 있을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when the assets are very valuable</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 가동 중단 비용이 매우 클 때</span><span class=\"en\"><b><span class=\"grammar-hl\">and when downtime would be very costly</span>.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 발전 터빈, 제트 엔진, 기차 엔진과 같은 물리적 자산의 디지털 트윈은 자산이 매우 가치 있고 가동 중단 비용이 매우 클 때 일반화되고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 완성된 현대적 디지털 트윈 기술이 실제 산업 현장에서 어떻게 쓰이는지 구체적인 예시를 들어 글을 마무리합니다. when downtime would be very costly에서 downtime은 기계가 고장 나서 멈춰 있는 시간을 뜻하며, 이 시간 동안 금전적 손실이 어마어마하게 발생하는 상황을 의미합니다. 즉, 비행기 엔진이나 발전기처럼 한 번 멈추면 큰일이 나는 값비싼 장비들의 사고를 미리 막고 효율적으로 관리하기 위해 이 기술을 적극적으로 도입하고 있다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">such as (관용표현): &#39;~와 같은&#39;이라는 의미의 전치사구로 쓰여, 앞의 physical assets에 대한 구체적인 예시를 나열할 때 사용된다.</div><div class=\"lec-gr-item\">when the assets are very valuable and when downtime would be very costly (병렬구조): 두 개의 시간 부사절(when절)이 등위접속사 and로 연결되어 동일한 문법적 비중과 형태를 취하고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">asset</td><td class=\"m\">자산, 재산</td></tr><tr><td class=\"w\">for instance</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">valuable</td><td class=\"m\">가치 있는, 귀중한</td></tr><tr><td class=\"w\">downtime</td><td class=\"m\">작동 불능 시간, 휴지 시간</td></tr><tr><td class=\"w\">costly</td><td class=\"m\">비용이 많이 드는, 대가가 큰</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>디지털 트윈은 현실의 기계 장치나 활동을 센서와 데이터를 이용해 컴퓨터 속에 똑같이 재현해 놓은 가상 모델이다.</li><li>과거에도 3D 설계도 같은 형태로 존재했지만, 최근 무선 통신의 발전으로 실시간 데이터를 다룰 수 있게 되며 크게 진화했다.</li><li>이제는 현실 기계의 상태 변화가 가상 모델에 즉각적이고 정확하게 동기화되어 실시간 복사본 역할을 한다.</li><li>현재 이 기술은 고장이 날 경우 막대한 경제적 손실을 초래하는 값비싼 대형 장비들을 관리하고 예방하는 데 흔하게 쓰이고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Digital twins are not new concepts, but they have evolved into highly accurate real-time replicas through faster networks and sensor data.</div>\n              <div class=\"lec-final-sum-ko\">디지털 트윈은 새로운 개념이 아니지만, 더 빠른 네트워크와 센서 데이터를 통해 매우 정확한 실시간 복제본으로 진화했다.</div></div></div>"],"segs":[[{"audio":"./35_audio/1.mp3","hl":null}],[{"audio":"./35_audio/2.mp3","hl":null}],[{"audio":"./35_audio/3.mp3","hl":null},{"audio":"./35_audio/4.mp3","hl":"stage-0"},{"audio":"./35_audio/5.mp3","hl":"stage-1"},{"audio":"./35_audio/6.mp3","hl":"stage-2"},{"audio":"./35_audio/7.mp3","hl":"stage-3"}],[{"audio":"./35_audio/8.mp3","hl":null}],[{"audio":"./35_audio/9.mp3","hl":"main"},{"audio":"./35_audio/10.mp3","hl":"meaning"},{"audio":"./35_audio/11.mp3","hl":"grammar"}],[{"audio":"./35_audio/12.mp3","hl":"main"},{"audio":"./35_audio/13.mp3","hl":"meaning"},{"audio":"./35_audio/14.mp3","hl":"grammar"}],[{"audio":"./35_audio/15.mp3","hl":"main"},{"audio":"./35_audio/16.mp3","hl":"mea
