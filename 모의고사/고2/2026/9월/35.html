}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 35번","audioDir":"35_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">35번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>The Tragedy of the Commons: From Individual Gain to Collective Crash\u003c/h1>\u003ch2>공유지의 비극: 개별 이익에서 공동 몰락까지\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>새로운 자원은 \u003cb class=\"key\">공동의 \u003c/b>\u003cb class=\"key\">자원\u003c/b>을 공유하며 개별 이익을 얻지만, 과도한 사용으로 \u003cb class=\"key\">공유지의 \u003c/b>\u003cb class=\"key\">비극\u003c/b>이 발생하고, 결국 자원의 \u003cb class=\"key\">재생산 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이 파괴되는 \u003cb class=\"key\">몰락 \u003c/b>\u003cb class=\"key\">역학\u003c/b>으로 이어진다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Overuse of a shared resource leads to the tragedy of the commons, a crash dynamic that destroys the resource's ability to regenerate itself.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 공유지의 비극을 다룬 글입니다. 이 글은 새로운 자원이 공동의 자원을 공유하며 개인에게 이익이 되는 상황에서 시작해, 과도한 사용이 결국 공동의 몰락을 부른다는 내용이에요. 요약하면, 공동의 자원을 함께 쓰는 과정에서 과도한 사용이 공유지의 비극을 낳고, 몰락 역학이 자원의 재생산 능력을 파괴한다는 것입니다. 요지는 Overuse of a shared resource leads to the tragedy of the commons and destroys its ability to regenerate itself입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">여러 사람이 함께 쓰는 \u003cb class=\"key\">공동 \u003c/b>\u003cb class=\"key\">자원\u003c/b>(common resource)은 개인이 조금씩 더 쓰면 당장 이익이 되지만, 모두가 그렇게 하면 결국 자원이 망가지는 현상을 \u003cb class=\"key\">공유지의 \u003c/b>\u003cb class=\"key\">비극\u003c/b>(tragedy of the commons)이라고 해요. 공항, 쇼핑센터, 도로 같은 시설도 처음에는 공동 예산으로 지어져 개인에게 이익을 주지만 \u003cb class=\"key\">과도한 \u003c/b>\u003cb class=\"key\">사용\u003c/b>이 문제를 일으키죠. 일상에서는 학교 공용 프린터를 무료로 쓰다가 다들 필요한 것보다 많이 인쇄해서 빨리 고장 나는 상황과 비슷해요. 이 글에서 중요한 것은 자원을 망가뜨리는 \u003cb class=\"key\">몰락 \u003c/b>\u003cb class=\"key\">역학\u003c/b>(crash dynamic)이에요. 공동 자원이 스스로 회복하는 능력, 즉 \u003cb class=\"key\">재생산 \u003c/b>\u003cb class=\"key\">능력\u003c/b>(regenerative ability)이 파괴되면 비극이 더 커진다는 것이 핵심입니다.\u003c/div>","segs":[{"n":2,"text":"공유지의 비극, tragedy of the commons은 여러 사람이 함께 쓰는 자원, common resource이 모두의 조금씩 더 쓰려는 선택 때문에 결국 망가지는 현상을 말해요. 개인에게는 당장 이익이지만 전체로 보면 자원이 고갈되거나 훼손되죠. 예를 들어 학교에서 공용 프린터를 무료로 쓸 수 있다면 다들 필요한 것보다 더 많이 인쇄하게 되고, 결국 프린터가 빨리 고장 나는 것과 비슷해요. 이때 중요한 개념이 공유지의 비극을 더 비극적으로 만드는 몰락 역학, crash dynamic이에요. 공동 자원이 스스로 재생산할 수 있는 능력, regenerative ability이 파괴되면서 회복이 어려워지는 거죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>공동 자원과 개별 이익\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>새로운 자원이 등장하면 사람들은 \u003cb class=\"key\">공동의 \u003c/b>\u003cb class=\"key\">자원\u003c/b>(예: 시·주 예산)을 공유하면서 \u003cb class=\"key\">개별적으로 \u003c/b>\u003cb class=\"key\">이익\u003c/b>을 얻으며 시작합니다. 공항이나 쇼핑센터 같은 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">자원\u003c/b>은 처음에는 모두에게 긍정적인 기회로 보입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>과도한 사용과 비극 발생\u003csmall>전환 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>이용이 늘면서 \u003cb class=\"key\">교통량\u003c/b>이 공유지가 견딜 수 있는 수준을 넘어서고, \u003cb class=\"key\">교통 \u003c/b>\u003cb class=\"key\">체증\u003c/b>, \u003cb class=\"key\">과밀\u003c/b>, \u003cb class=\"key\">과도한 \u003c/b>\u003cb class=\"key\">사용\u003c/b>이 나타납니다. 그 결과 공유 자원이 모두에게 주던 혜택이 줄어드는 \u003cb class=\"key\">공유지의 \u003c/b>\u003cb class=\"key\">비극\u003c/b>이 발생합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>혼자서는 해결 불가\u003csmall>문제 심화 · 문장 4\u003c/small>\u003c/h4>\u003cp>자원을 확장하거나 공간을 더 제공하지 못하면 \u003cb class=\"key\">문제\u003c/b>가 되고, 이 문제는 \u003cb class=\"key\">동료 \u003c/b>\u003cb class=\"key\">운전자\u003c/b>나 \u003cb class=\"key\">경쟁 \u003c/b>\u003cb class=\"key\">사용자\u003c/b>들과 분리된 채 혼자 해결할 수 없습니다. 공유 문제는 공동의 대응이 필요합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>정점 이후의 몰락\u003csmall>결론 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>총활동과 개인 활동이 계속 증가하다가 \u003cb class=\"key\">공동 \u003c/b>\u003cb class=\"key\">사용\u003c/b>과 \u003cb class=\"key\">과도한 \u003c/b>\u003cb class=\"key\">사용\u003c/b>의 역학이 너무 오래 지속되면 \u003cb class=\"key\">정점\u003c/b> 이후 둘 다 떨어지며 \u003cb class=\"key\">몰락\u003c/b>으로 이어집니다. ‘공유지의 비극’을 더 비극적으로 만드는 것은 \u003cb class=\"key\">몰락 \u003c/b>\u003cb class=\"key\">역학\u003c/b>, 곧 공동 자원이 자신을 재생산할 수 있는 능력이 \u003cb class=\"key\">파괴\u003c/b>되거나 \u003cb class=\"key\">퇴보\u003c/b>하는 것입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장별 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 공동 자원과 개별 이익의 도입이에요. 첫 번째 문장에서 새로운 자원, 예를 들어 새 공항이나 새 쇼핑센터는 시나 주의 예산처럼 공동의 자원을 공유하며 사람들이 개별적으로 이익을 얻는 모습으로 시작된다고 말해요. 처음에는 모두에게 긍정적인 기회로 보이는 단계죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 과도한 사용과 비극의 발생이에요. 두 번째와 세 번째 문장에서 교통량이 어느 시점에 공유지가 견디기에 너무 커지고, 교통 체증과 과밀, 과도한 사용이 나타난다고 해요. 그 결과 공유 자원이 모두에게 주던 혜택이 줄어드는 공유지의 비극, tragedy of the commons이 발생하죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 혼자서는 해결할 수 없는 문제의 심화예요. 네 번째 문장에서 자원을 확장하거나 추가 공간을 제공할 수 없으면 문제가 되고, 동료 운전자나 보행자, 경쟁하는 사용자들과 고립된 채로는 이 문제를 해결할 수 없다고 말해요. 공유 문제는 공동의 대응이 필요한 거죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 정점 이후의 몰락이라는 결론이에요. 다섯 번째 문장에서 이 새로운 자원에 대한 총활동과 개인 활동이 계속 증가하지만, 공동 사용과 과도한 사용의 역학이 너무 오래 지속되면 정점 이후에 둘 다 떨어지면서 몰락으로 이어진다고 해요. 여섯 번째 문장은 공유지의 비극을 더 비극적이게 만드는 것이 몰락 역학, 즉 공동 자원이 스스로를 재생산할 수 있는 능력의 파괴나 퇴보라고 강조합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">지문은 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">자원\u003c/b>의 \u003cb class=\"key\">개별 \u003c/b>\u003cb class=\"key\">이익\u003c/b>에서 시작해 \u003cb class=\"key\">과도한 \u003c/b>\u003cb class=\"key\">사용\u003c/b>이 \u003cb class=\"key\">공유지의 \u003c/b>\u003cb class=\"key\">비극\u003c/b>을 낳고, 마지막 문장에서 \u003cb class=\"key\">몰락 \u003c/b>\u003cb class=\"key\">역학\u003c/b>과 \u003cb class=\"key\">재생산 \u003c/b>\u003cb class=\"key\">능력\u003c/b>의 파괴로 귀결되는 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다. 이는 \u003cb class=\"key\">인과\u003c/b>에 따라 전개되며, 처음의 이익과 이후의 손실을 대조해 비극의 본질을 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Any new resource (1)\u003c/b>\u003cspan>도입·예시\u003c/span>\u003cb>Soon, at some point (2)\u003c/b>\u003cspan>시간 경과·전환\u003c/span>\u003cb>the tragedy of the commons (3)\u003c/b>\u003cspan>핵심 개념\u003c/span>\u003cb>cannot be solved ... in isolation (4)\u003c/b>\u003cspan>부정·한계\u003c/span>\u003cb>keeps increasing (5)\u003c/b>\u003cspan>증가 추세\u003c/span>\u003cb>What makes ... is (6)\u003c/b>\u003cspan>강조·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">common resource\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the commons\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the common resource\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">common use\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">common resource's ability to regenerate itself\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>개별 이익(초기)\u003c/th>\u003cth>공동 비극(후반)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>새로운 자원으로 개인이 이익을 얻음\u003c/td>\u003ctd>과도한 사용으로 공동 자원의 혜택이 감소함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>총활동·개인 활동이 계속 증가함\u003c/td>\u003ctd>정점 이후 둘 다 하락하며 몰락으로 이어짐\u003c/td>\u003c/tr>\u003ctr>\u003ctd>공동 자원이 스스로 재생산함\u003c/td>\u003ctd>몰락 역학이 재생산 능력을 파괴·퇴보시킴\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 지문은 인과, 원인과 결과의 전개 방식으로 되어 있어요. 처음에는 새로운 자원의 개별 이익을 소개하지만, 과도한 사용이 공유지의 비극을 일으키고 결국 몰락 역학으로 귀결되는 흐름이죠. 주제는 마지막 문장에 있기 때문에 미괄식 구조로 볼 수 있어요. 마지막 문장에 공유지의 비극을 더 비극적으로 만드는 것이 바로 몰락 역학이라는 핵심이 제시되어 있으니까요.","hl":"ty"},{"n":9,"text":"신호어와 재진술, 대조를 같이 짚어 볼게요. 첫 번째 문장의 Any new resource는 도입과 예시를 나타내고, 두 번째 문장의 Soon, at some point는 시간이 지나면서 상황이 바뀐다는 전환 신호예요. 세 번째 문장에서는 the tragedy of the commons이라는 핵심 개념이 직접 제시되고, 다섯 번째 문장의 keeps increasing은 증가 추세를 강조해요. 마지막 문장의 What makes the tragedy of commons tragic is는 강조와 결론을 이끄는 표현이죠. 또 common resource라는 표현이 the commons, the common resource, common use, common resource's ability to regenerate itself로 계속 바뀌어 나오면서 공동의 자원이라는 개념을 반복하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>resource\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원\u003c/span>\u003c/div>\u003cdiv>\u003cb>common\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공동의, 공통된\u003c/span>\u003c/div>\u003cdiv>\u003cb>individually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>개별적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>benefit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이익을 얻다, 혜택을 보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>share\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>common resource\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공동의 자원\u003c/span>\u003c/div>\u003cdiv>\u003cb>budget\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예산\u003c/span>\u003c/div>\u003cdiv>\u003cb>at some point\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어느 시점에서\u003c/span>\u003c/div>\u003cdiv>\u003cb>traffic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교통, 교통량\u003c/span>\u003c/div>\u003cdiv>\u003cb>commons\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공유지\u003c/span>\u003c/div>\u003cdiv>\u003cb>support\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지탱하다, 견디다\u003c/span>\u003c/div>\u003cdiv>\u003cb>traffic jam\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교통 체증\u003c/span>\u003c/div>\u003cdiv>\u003cb>overcrowding\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과밀, 혼잡\u003c/span>\u003c/div>\u003cdiv>\u003cb>overuse\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과도한 사용\u003c/span>\u003c/div>\u003cdiv>\u003cb>lessen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>줄이다, 감소시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tragedy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비극\u003c/span>\u003c/div>\u003cdiv>\u003cb>expand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>additional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>추가적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>in isolation\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>고립되어, 따로 떨어져\u003c/span>\u003c/div>\u003cdiv>\u003cb>fellow\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>동료의, 같은 처지의\u003c/span>\u003c/div>\u003cdiv>\u003cb>competing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>경쟁하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>total\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>총, 전체의\u003c/span>\u003c/div>\u003cdiv>\u003cb>dynamic\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역학, 변동\u003c/span>\u003c/div>\u003cdiv>\u003cb>peak\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정점, 절정\u003c/span>\u003c/div>\u003cdiv>\u003cb>crash\u003c/b>\u003cem>명사\u003c/em>\u003cspan>몰락, 붕괴\u003c/span>\u003c/div>\u003cdiv>\u003cb>destruction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>파괴\u003c/span>\u003c/div>\u003cdiv>\u003cb>degeneration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>퇴보, 악화\u003c/span>\u003c/div>\u003cdiv>\u003cb>regenerate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재생하다, 재생산하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘도 몇 개만 정리할게요. common은 공동의, 공통된이라는 뜻이고, tragedy는 비극, overuse는 과도한 사용, lessen은 줄이다, expand는 확장하다, dynamic은 역학, crash는 몰락, regenerate는 재생하다예요. 문장에서 common resource, tragedy of the commons, crash dynamic 같은 표현으로 자주 묶여 나오니까 함께 기억해두면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">common\u003c/b>\u003cspan class=\"m\">공동의, 공통된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shared\u003c/span>\u003cspan class=\"s\">collective\u003c/span>\u003cspan class=\"s\">mutual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">individual\u003c/span>\u003cspan class=\"a\">private\u003c/span>\u003cspan class=\"a\">separate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">benefit\u003c/b>\u003cspan class=\"m\">이익, 혜택\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">advantage\u003c/span>\u003cspan class=\"s\">profit\u003c/span>\u003cspan class=\"s\">gain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">loss\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003cspan class=\"a\">damage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">overuse\u003c/b>\u003cspan class=\"m\">과도한 사용\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">overexploitation\u003c/span>\u003cspan class=\"s\">excessive use\u003c/span>\u003cspan class=\"s\">overconsumption\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conservation\u003c/span>\u003cspan class=\"a\">moderation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lessen\u003c/b>\u003cspan class=\"m\">줄이다, 감소시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reduce\u003c/span>\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">diminish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">expand\u003c/span>\u003cspan class=\"a\">grow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">crash\u003c/b>\u003cspan class=\"m\">몰락, 붕괴\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">collapse\u003c/span>\u003cspan class=\"s\">breakdown\u003c/span>\u003cspan class=\"s\">fall\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">recovery\u003c/span>\u003cspan class=\"a\">regeneration\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">destruction\u003c/b>\u003cspan class=\"m\">파괴\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ruin\u003c/span>\u003cspan class=\"s\">damage\u003c/span>\u003cspan class=\"s\">devastation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">construction\u003c/span>\u003cspan class=\"a\">creation\u003c/span>\u003cspan class=\"a\">restoration\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">regenerate\u003c/b>\u003cspan class=\"m\">재생하다, 재생산하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">renew\u003c/span>\u003cspan class=\"s\">restore\u003c/span>\u003cspan class=\"s\">revive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">deplete\u003c/span>\u003cspan class=\"a\">exhaust\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 시험에 자주 나오는 동의어와 반의어를 정리해 볼게요. common은 shared, collective, mutual과 바꿔 쓸 수 있고, 반대는 individual, private, separate예요. benefit은 advantage, profit, gain과 유사하고, 반대는 loss, harm, damage예요. lessen은 reduce, decrease, diminish와 유사하고, 반대는 increase, expand, grow예요. overuse는 overexploitation, excessive use, overconsumption과 유사하고, 반대는 conservation, moderation이에요. crash는 collapse, breakdown, fall과 유사하고, 반대는 recovery, regeneration이에요. destruction은 ruin, damage, devastation과 유사하고, 반대는 construction, creation, restoration이에요. regenerate는 renew, restore, revive와 유사하고, 반대는 destroy, deplete, exhaust예요. 이렇게 짝을 지어두면 어휘 문제나 빈칸 추론에서 도움이 돼요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 새로운 자원(예를 들어, 새로운 공항, 새로운 쇼핑센터)은\u003c/span>\u003cspan class=\"en\">Any new resource (e.g., a new airport, a new mall)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 시작된다\u003c/span>\u003cspan class=\"en\">always opens\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 개별적으로 이익을 얻으면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">benefiting \u003c/span>\u003cspan class=\"tgt\">individually\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공동의 자원(예를 들어, 시 또는 주 예산)을 공유함으로써.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">sharing \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">common \u003c/span>\u003cspan class=\"tgt\">resource\u003c/span> (e.g., the city or state budget).\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 새로운 자원(예를 들어, 새로운 공항, 새로운 쇼핑센터)은 항상 공동의 자원(예를 들어, 시 또는 주 예산)을 공유함으로써 사람들이 개별적으로 이익을 얻으면서 시작된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새로운 공항이나 쇼핑센터 같은 자원은 처음부터 개인이 따로 이익을 보는 것이 아니라, \u003cb class=\"key\">공동의 \u003c/b>\u003cb class=\"key\">자원\u003c/b>을 함께 사용하면서 각자 이익을 얻는 구조로 출발한다는 뜻이에요. 여기서 \u003cb class=\"key\">개별적 \u003c/b>\u003cb class=\"key\">이익\u003c/b>과 \u003cb class=\"key\">공동의 \u003c/b>\u003cb class=\"key\">자원\u003c/b>이라는 대비가 이 글 전체의 갈등을 깔아 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">with + 목적어 + 현재분사 구문\u003c/span> : with + [명사(people)] + [현재분사(benefiting)] : \"사람들이 개별적으로 이익을 얻으면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사 (방법·수단)\u003c/span> : by + [동명사구(sharing a common resource)] : \"공동의 자원을 공유함으로써\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Any new resource (e.g., a new airport, a new mall), 어떤 새로운 자원(예를 들어, 새로운 공항, 새로운 쇼핑센터)은. always opens, 항상 시작된다. with people benefiting individually, 사람들이 개별적으로 이익을 얻으면서. by sharing a common resource (e.g., the city or state budget), 공동의 자원(예를 들어, 시 또는 주 예산)을 공유함으로써.. 이 문장 전체를 해석하면, 어떤 새로운 자원(예를 들어, 새로운 공항, 새로운 쇼핑센터)은 항상 공동의 자원(예를 들어, 시 또는 주 예산)을 공유함으로써 사람들이 개별적으로 이익을 얻으면서 시작된다.","hl":"m"},{"n":13,"text":"이 문장은 새로운 자원이 처음에는 공동의 자원을 함께 쓰면서 사람들이 각자 이익을 보는 방식으로 시작된다는 뜻이에요. 공항이나 쇼핑센터가 생기면 개인이 혜택을 보지만, 그 밑에는 시 예산이나 주 예산 같은 공동 자원이 깔려 있다는 점을 짚어 줍니다. 앞으로 이 공동 자원이 비극으로 가는 출발점을 설명하는 역할이에요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 with people benefiting individually입니다. with 다음에 사람을 뜻하는 people이 오고, 그다음에 benefiting이라는 현재분사가 와서 사람들이 개별적으로 이익을 얻는 동시 상황을 나타내요. people이 benefiting의 의미상 주어이고, 능동 관계니까 현재분사를 쓴 거예요. 두 번째 포인트는 by sharing a common resource입니다. 전치사 by 뒤에는 동명사가 와서 공동의 자원을 공유함으로써라는 방법을 나타냅니다. 전치사의 목적어 자리이기 때문에 sharing이라는 동명사 형태가 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧, 어느 시점에서,\u003c/span>\u003cspan class=\"en\">Soon, at some point,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교통량은\u003c/span>\u003cspan class=\"en\">the amount of traffic\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 커진다\u003c/span>\u003cspan class=\"en\">grows \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">large \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘공유지’가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">&quot;commons&quot; \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">견디기에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">support\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곧, 어느 시점에서, 교통량은 ‘공유지’가 견디기에 너무 커진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 시간이 지나면서 교통량이 공유지가 감당할 수 있는 한계를 넘어선다는 뜻이에요. \u003cb class=\"key\">too \u003c/b>\u003cb class=\"key\">large\u003c/b>와 \u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">support\u003c/b>가 짝을 이루어 ‘너무 커서 견딜 수 없다’는 부정적 결과를 나타냅니다. 공유지의 비극으로 넘어가는 변곡점을 보여 주는 역할이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">too + 형용사 + for + 목적격 + to부정사\u003c/span> : too + [형용사(large)] + for + [목적격(the 'commons')] + [to부정사(to support)] : \"‘공유지’가 견디기에 너무 커진다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Soon, at some point, 곧, 어느 시점에서. the amount of traffic, 교통량은. grows too large, 너무 커진다. for the \"commons\", ‘공유지’가. to support, 견디기에.. 이 문장 전체를 해석하면, 곧, 어느 시점에서, 교통량은 ‘공유지’가 견디기에 너무 커진다.","hl":"m"},{"n":16,"text":"교통량이 점점 늘어나서 어느 순간 공유지가 견딜 수 없을 만큼 커진다는 의미예요. too large와 to support가 만나 너무 커서 지탱할 수 없다는 뜻을 만들어요. 이 문장은 공유지가 감당할 수 있는 한계를 지나치는 순간을 말해 주고, 다음 문장의 비극으로 이어지는 연결고리 역할을 해요.","hl":"mn"},{"n":17,"text":"이 문장의 핵심 어법은 too large for the commons to support입니다. too 다음에 large라는 형용사가 오고, for the commons가 끼어든 다음 to support라는 to부정사가 이어져요. 이 구문은 너무 커서 공유지가 견딜 수 없다는 뜻의 too to 구문이고, for the commons는 to support의 의미상 주어를 나타냅니다. 형용사 large가 원인, to support가 그 결과를 표현한다고 정리하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교통 체증, 과밀, 그리고 과도한 사용은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Traffic \u003c/span>\u003cspan class=\"tgt\">jams, \u003c/span>\u003cspan class=\"tgt\">overcrowding, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">overuse\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">줄인다\u003c/span>\u003cspan class=\"en\">lessen\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두를 위한 공유 자원의 혜택을\u003c/span>\u003cspan class=\"en\">the benefits of the common resource for everyone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 즉 공유지의 비극이다!\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">― \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">tragedy \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">commons!\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">교통 체증, 과밀, 그리고 과도한 사용은 모두를 위한 공유 자원의 혜택을 줄이는데, 이것은 즉 공유지의 비극이다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 교통 체증, 과밀, 과도한 사용이 결국 모든 사람을 위한 공유 자원의 이익을 떨어뜨린다고 정의해요. 대시 뒤에서 이를 \u003cb class=\"key\">공유지의 \u003c/b>\u003cb class=\"key\">비극\u003c/b>이라고 명명합니다. \u003cb class=\"key\">공동 \u003c/b>\u003cb class=\"key\">이익\u003c/b>이 \u003cb class=\"key\">과도한 \u003c/b>\u003cb class=\"key\">사용\u003c/b>으로 손상되는 핵심 개념을 압축한 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">A, B, and C 병렬 구조\u003c/span> : [명사구 A], [명사구 B], and [명사구 C] : \"교통 체증, 과밀, 그리고 과도한 사용\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대시(dash)를 이용한 동격(부연 설명)\u003c/span> : 앞 문장 전체, ― [동격 명사구] : \"이것은 즉 공유지의 비극이다!\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Traffic jams, overcrowding, and overuse, 교통 체증, 과밀, 그리고 과도한 사용은. lessen, 줄인다. the benefits of the common resource for everyone, 모두를 위한 공유 자원의 혜택을. ― the tragedy of the commons!, 이것은 즉 공유지의 비극이다!. 이 문장 전체를 해석하면, 교통 체증, 과밀, 그리고 과도한 사용은 모두를 위한 공유 자원의 혜택을 줄이는데, 이것은 즉 공유지의 비극이다!","hl":"m"},{"n":19,"text":"교통 체증과 과밀, 과도한 사용이 모두를 위한 공유 자원의 혜택을 줄인다는 뜻이에요. 대시 뒤에서 이 현상을 공유지의 비극이라고 이름 붙여 줍니다. 이 문장은 글의 핵심 용어를 정의하는, 서술형으로도 출제될 만한 중요한 문장이에요.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 Traffic jams, overcrowding, and overuse입니다. 세 개의 명사구가 and로 병렬 연결되어 주어 역할을 해요. 병렬 구조에서는 형태와 품사를 맞추는 게 중요합니다. 두 번째 포인트는 대시 뒤의 the tragedy of the commons입니다. 앞에서 설명한 상황 전체를 공유지의 비극이라는 명사구로 요약하는 동격 표현이에요. 대시가 앞 내용과 같은 뜻을 덧붙여 주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 새로운 자원이 확장될 수 없거나 추가적인 공간이 제공될 수 없다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">resource \u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">expanded \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">provided \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">additional \u003c/span>\u003cspan class=\"tgt\">space,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 문제가 되고,\u003c/span>\u003cspan class=\"en\">it becomes a problem,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 여러분은 혼자서 문제를 해결할 수 없고,\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">solve \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">problem \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">own,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 동료 운전자나 보행자 또는 경쟁 사용자들로부터 고립된 상태로.\u003c/span>\u003cspan class=\"en\">in isolation from your fellow drivers or walkers or competing users.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 새로운 자원이 확장될 수 없거나 추가적인 공간이 제공될 수 없다면, 이것은 문제가 되고, 여러분은 여러분의 동료 운전자나 보행자 또는 경쟁 사용자들로부터 고립된 상태로 혼자서 문제를 해결할 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 새로운 자원이 더 이상 확장되거나 추가 공간을 확보할 수 없으면 문제가 되고, 혼자서는 해결할 수 없다고 말한다. 공유지 비극에서 \u003cb class=\"key\">개별 \u003c/b>\u003cb class=\"key\">해결 \u003c/b>\u003cb class=\"key\">불가능\u003c/b>과 \u003cb class=\"key\">공동의 \u003c/b>\u003cb class=\"key\">문제\u003c/b>를 강조하는 역할을 하며, 동료 운전자나 보행자 같은 경쟁 사용자와의 \u003cb class=\"key\">고립\u003c/b>이 문제를 악화시킨다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절과 조동사 수동태\u003c/span> : If + S + cannot be expanded or provided ... : \"만약 새로운 자원이 확장될 수 없거나 추가적인 공간이 제공될 수 없다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 cannot + 부사구\u003c/span> : cannot + solve + 목적어 + on one's own : \"여러분은 혼자서 문제를 해결할 수 없다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"If the new resource cannot be expanded or provided with additional space, 만약 새로운 자원이 확장될 수 없거나 추가적인 공간이 제공될 수 없다면. it becomes a problem, 이것은 문제가 되고. and you cannot solve the problem on your own, 그리고 여러분은 혼자서 문제를 해결할 수 없고. in isolation from your fellow drivers or walkers or competing users, 여러분의 동료 운전자나 보행자 또는 경쟁 사용자들로부터 고립된 상태로.. 이 문장 전체를 해석하면, 만약 새로운 자원이 확장될 수 없거나 추가적인 공간이 제공될 수 없다면, 이것은 문제가 되고, 여러분은 여러분의 동료 운전자나 보행자 또는 경쟁 사용자들로부터 고립된 상태로 혼자서 문제를 해결할 수 없다.","hl":"m"},{"n":22,"text":"이 문장은 새로운 자원이 더 이상 확장되거나 추가 공간을 확보할 수 없으면 문제가 되고, 그 문제는 혼자서 해결할 수 없다는 뜻이에요. 공유지 비극에서 개별 해결 불가능이 중요하고, 같은 자원을 쓰는 동료 운전자나 보행자, 경쟁 사용자들과 함께 풀어야 할 공동의 문제라는 점을 강조해요.","hl":"mn"},{"n":23,"text":"어법 포인트를 짚어 볼게요. 첫 번째, If로 시작하는 조건절 안에 cannot be expanded or provided라는 조동사 수동태가 왔어요. can의 부정 cannot과 be expanded, be provided가 결합한 수동태라서 자원이 확장되거나 공간이 제공되는 수동의 의미를 나타내요. 두 번째, you cannot solve the problem on your own에서 cannot은 불가능을 나타내고 뒤에 동사원형 solve가 왔어요. on your own은 혼자서라는 뜻으로, 공유지 문제는 혼자서 해결할 수 없다는 개별 해결 불가능을 강조해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 새로운 자원에 대한 총활동은 계속 증가하고,\u003c/span>\u003cspan class=\"en\">The total activity on this new resource \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">keeps \u003c/span>\u003cspan class=\"tgt\">increasing\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 개인 활동도 증가한다.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">individual \u003c/span>\u003cspan class=\"tgt\">activity\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 만약 공동 사용과 과도한 사용의 역학이 너무 오래 지속되면,\u003c/span>\u003cspan class=\"en\">but if the dynamic of common use and overuse continues too long,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둘 다 정점 이후에 떨어지기 시작하고,\u003c/span>\u003cspan class=\"en\">both begin to fall after a peak,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몰락으로 이어진다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">leading \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">crash\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 새로운 자원에 대한 총활동은 계속 증가하고, 개인 활동도 증가한다. 그러나 만약 공동 사용과 과도한 사용의 역학이 너무 오래 지속되면, 둘 다 정점 이후에 떨어지기 시작하고, 몰락으로 이어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공동 사용과 과도한 사용의 \u003cb class=\"key\">총활동 \u003c/b>\u003cb class=\"key\">역학\u003c/b>이 지속되면 증가하던 총활동과 개인 활동이 정점을 지나 떨어지고 \u003cb class=\"key\">몰락\u003c/b>에 이른다고 요약한다. 공유지 비극의 \u003cb class=\"key\">정점 \u003c/b>\u003cb class=\"key\">이후 \u003c/b>\u003cb class=\"key\">하락\u003c/b>을 보여 주는 문장으로, 다음 문장에서 말할 몰락 역학을 예고한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 (keep + ~ing)\u003c/span> : keep + v-ing : \"계속 증가한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">도치 (so + 조동사/do동사 + 주어)\u003c/span> : so + does + 주어 : \"개인 활동도 증가한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사 결과 부사적 용법\u003c/span> : S+V+, leading to + 명사 : \"몰락으로 이어진다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The total activity on this new resource keeps increasing, 이 새로운 자원에 대한 총활동은 계속 증가하고. and so does individual activity, 그리고 개인 활동도 증가한다.. but if the dynamic of common use and overuse continues too long, 그러나 만약 공동 사용과 과도한 사용의 역학이 너무 오래 지속되면. both begin to fall after a peak, 둘 다 정점 이후에 떨어지기 시작하고. leading to a crash, 몰락으로 이어진다.. 이 문장 전체를 해석하면, 이 새로운 자원에 대한 총활동은 계속 증가하고, 개인 활동도 증가한다. 그러나 만약 공동 사용과 과도한 사용의 역학이 너무 오래 지속되면, 둘 다 정점 이후에 떨어지기 시작하고, 몰락으로 이어진다.","hl":"m"},{"n":25,"text":"이 문장은 이 새로운 자원에 대한 전체 활동과 개인 활동이 계속 증가하지만, 공동 사용과 과도한 사용의 흐름이 너무 오래 지속되면 둘 다 정점 이후에 떨어지고 몰락으로 이어진다는 뜻이에요. 공유지 비극이 단순한 과밀이 아니라 정점 이후 하락과 몰락 역학을 겪는다는 걸 보여 줘요.","hl":"mn"},{"n":26,"text":"어법 포인트는 세 가지예요. 첫 번째, keeps increasing에서 keep은 동명사를 목적어로 취하는 동사라서 increasing이 동명사로 왔어요. 두 번째, so does individual activity는 앞 절의 increasing을 반복하지 않고 so로 받은 도치 구문이에요. does를 주어 앞에 두어 개인 활동도 증가한다고 말해요. 세 번째, 문장 끝에 leading to a crash는 결과를 나타내는 현재분사구예요. and leads to a crash로 바꿔 쓸 수 있고 몰락으로 이어진다는 결과를 보여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘공유지의 비극’을 더 비극적이게 만드는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">&quot;tragedy \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">commons&quot; \u003c/span>\u003cspan class=\"tgt\">tragic\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몰락 역학이다, 즉\u003c/span>\u003cspan class=\"en\">is the crash dynamic ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">파괴 또는 퇴보\u003c/span>\u003cspan class=\"en\">the \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">destruction \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">degeneration\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공동 자원이 스스로를 재생산할 수 있는 능력의\u003c/span>\u003cspan class=\"en\">of the common resource's \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">ability \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">regenerate \u003c/span>\u003cspan class=\"tgt\">itself\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘공유지의 비극’을 더 비극적이게 만드는 것은 몰락 역학, 즉 그 스스로를 재생산할 수 있는 공동 자원의 능력의 파괴 또는 퇴보이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공유지의 비극을 진짜 비극으로 만드는 것이 바로 \u003cb class=\"key\">몰락 \u003c/b>\u003cb class=\"key\">역학\u003c/b>임을 정의한다. 공유 자원이 스스로를 재생산할 수 있는 능력의 \u003cb class=\"key\">파괴 \u003c/b>\u003cb class=\"key\">또는 \u003c/b>\u003cb class=\"key\">퇴보\u003c/b>가 핵심이며, 지문 전체의 주제를 요약한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what (선행사 포함)\u003c/span> : What + makes + 목적어 + 형용사 보어 : \"‘공유지의 비극’을 더 비극적이게 만드는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 or의 병렬 구조\u003c/span> : A or B : \"파괴 또는 퇴보\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : ability + to-v : \"스스로를 재생산할 수 있는 능력\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"What makes the \"tragedy of commons\" tragic, ‘공유지의 비극’을 더 비극적이게 만드는 것은. is the crash dynamic ―, 몰락 역학이다, 즉. the destruction or degeneration, 파괴 또는 퇴보. of the common resource's ability to regenerate itself, 공동 자원이 스스로를 재생산할 수 있는 능력의. 이 문장 전체를 해석하면, ‘공유지의 비극’을 더 비극적이게 만드는 것은 몰락 역학, 즉 그 스스로를 재생산할 수 있는 공동 자원의 능력의 파괴 또는 퇴보이다.","hl":"m"},{"n":28,"text":"이 문장은 공유지의 비극을 진짜 비극으로 만드는 것이 바로 몰락 역학이라고 정의해요. 공동 자원이 스스로를 재생산할 수 있는 능력이 파괴되거나 퇴보되는 것이 핵심이며, 지문 전체의 주제를 요약하는 문장이에요.","hl":"mn"},{"n":29,"text":"어법 포인트를 세 가지로 정리해 볼게요. 첫 번째, 문장 맨 앞에 What makes the tragedy of commons tragic이 왔는데요, What은 선행사를 포함한 관계대명사로 the thing that과 같은 의미예요. 이 절 전체가 주어 역할을 하고 공유지의 비극을 더 비극적이게 만드는 것이라는 뜻이에요. 두 번째, the destruction or degeneration은 등위접속사 or이 두 명사를 이은 병렬 구조예요. 세 번째, ability to regenerate itself에서 to부정사가 ability를 수식하는 형용사적 용법이에요. 스스로를 재생산할 수 있는 능력이라는 의미로 이어져요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>새로운 자원은 \u003cb class=\"key\">공동의 \u003c/b>\u003cb class=\"key\">자원\u003c/b>을 공유하면서 개인이 이익을 얻는 방식으로 시작된다.\u003c/li>\u003cli>이용량이 커지면 \u003cb class=\"key\">교통 \u003c/b>\u003cb class=\"key\">체증\u003c/b>과 \u003cb class=\"key\">과도한 \u003c/b>\u003cb class=\"key\">사용\u003c/b>이 공유 자원의 혜택을 줄이는 \u003cb class=\"key\">공유지의 \u003c/b>\u003cb class=\"key\">비극\u003c/b>이 발생한다.\u003c/li>\u003cli>자원 확장이 불가능하면 이 문제는 \u003cb class=\"key\">고립\u003c/b>된 개인이 아니라 공동으로 해결해야 한다.\u003c/li>\u003cli>공동 사용과 과도한 사용이 지속되면 정점 이후 \u003cb class=\"key\">몰락\u003c/b>이 오고, \u003cb class=\"key\">재생산 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이 파괴되는 \u003cb class=\"key\">몰락 \u003c/b>\u003cb class=\"key\">역학\u003c/b>이 비극을 더 비극적으로 만든다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Overuse of a shared resource leads to the tragedy of the commons, a crash dynamic that destroys the resource's ability to regenerate itself.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">새로운 자원은 \u003cb class=\"key\">공동의 \u003c/b>\u003cb class=\"key\">자원\u003c/b>을 공유하며 개별 이익을 얻지만, 과도한 사용으로 \u003cb class=\"key\">공유지의 \u003c/b>\u003cb class=\"key\">비극\u003c/b>이 발생하고, 결국 자원의 \u003cb class=\"key\">재생산 \u003c/b>\u003cb class=\"key\">능력\u003c/b>이 파괴되는 \u003cb class=\"key\">몰락 \u003c/b>\u003cb class=\"key\">역학\u003c/b>으로 이어진다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 지문을 정리하면, 공유 자원의 개별 이익으로 시작한 새로운 자원이 과도한 사용을 거치면서 공유지의 비극이 되고, 혼자서는 해결할 수 없으며, 결국 재생산 능력이 파괴되는 몰락 역학으로 이어진다는 내용이었어요. 공동의 자원을 쓸 때는 개인의 이익만 보면 안 된다는 교훈을 담고 있죠. 오늘 수업은 여기까지입니다. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
