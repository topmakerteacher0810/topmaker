</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 35번","audioDir":"35_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">35번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Digital Twins: From Static 3D Models to Real-Time Replicas\u003c/h1>\u003ch2>디지털 트윈: 정적 3D 모델에서 실시간 복제본으로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>디지털 트윈은 모델링과 센서로 만든 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">복제본\u003c/b>이며, 더 빠른 무선 네트워크와 \u003cb class=\"key\">실시간 \u003c/b>\u003cb class=\"key\">데이터\u003c/b> 덕분에 물리적 객체의 속성과 상태를 반영하는 \u003cb class=\"key\">실시간 \u003c/b>\u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">복사본\u003c/b>으로 발전했다. 특히 \u003cb class=\"key\">가동 \u003c/b>\u003cb class=\"key\">중단\u003c/b> 비용이 매우 큰 고가치 자산에서 일반화되고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Faster wireless networks and real-time sensor data enable digital twins to become real-time accurate copies, especially for valuable physical assets.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 살펴볼 지문은 디지털 트윈에 관한 글이에요. 이 글은 디지털 트윈이 무엇인지 정의하고, 빠른 무선 네트워크와 실시간 데이터 덕분에 어떻게 실시간 정확한 복사본으로 발전했는지 설명합니다. 마지막에는 발전 터빈이나 제트 엔진 같은 고가치 자산의 예를 들어 정리해 주죠. 자, 그럼 본격적으로 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">디지털 트윈은 실제 물건이나 활동을 컴퓨터 속에 똑같이 복제한 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">사본\u003c/b>으로, 현실의 상태를 가상 공간에 반영하는 기술입니다. 설계 분야에서는 예전부터 CAD(computer-aided design) 모델과 3D 렌더링을 활용해 제품 외형을 만들어 왔죠. 최근에는 사물인터넷(IoT) 센서가 발전하면서 온도, 진동, 압력 같은 실시간 데이터를 수집할 수 있게 되었습니다. 이것은 마치 운동할 때 스마트워치가 심박수를 실시간으로 화면에 보여 주는 것과 비슷합니다. 값비싼 터빈이나 제트 엔진처럼 고장 나면 손실이 큰 자산일수록 \u003cb class=\"key\">가동 \u003c/b>\u003cb class=\"key\">중단\u003c/b>을 줄이기 위해 디지털 트윈을 적극 도입하고 있습니다.\u003c/div>","segs":[{"n":2,"text":"디지털 트윈은 현실의 물건이나 활동을 컴퓨터 안에 똑같이 복제해 놓은 디지털 사본이에요. 예전부터 설계 분야에서는 CAD 컴퓨터 지원 설계 모델과 3D 렌더링을 많이 사용해 왔죠. 최근에는 사물인터넷 센서가 발전하면서 온도나 진동 같은 실시간 데이터를 수집할 수 있게 되었어요. 이것은 운동할 때 스마트워치가 심박수를 실시간으로 화면에 보여 주는 것과 비슷하다고 생각하면 됩니다. 발전 터빈이나 제트 엔진처럼 고장 나면 손실이 큰 자산일수록 가동 중단을 줄이기 위해 디지털 트윈을 적극 도입하고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>디지털 트윈의 정의\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>첫 번째 문장은 디지털 트윈이 \u003cb class=\"key\">모델링\u003c/b>과 \u003cb class=\"key\">센서\u003c/b>를 사용해 디지털 표현을 만드는 자산이나 활동의 디지털 복제본이라고 정의합니다. 현실 세계의 자산이나 활동을 가상 공간에 재현한다는 점이 핵심입니다. 이 정의는 뒤에 나올 실시간 업데이트 개념의 출발점이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>과거와 현재의 대조\u003csmall>전환 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>두 번째 문장은 디지털 트윈이 새롭지 않으며, 여러 산업에서 \u003cb class=\"key\">3D \u003c/b>\u003cb class=\"key\">렌더링\u003c/b>과 공정 시뮬레이션을 수년간 사용해 왔다고 말합니다. 그러나 세 번째 문장에서 however로 전환하여, 더 빠른 \u003cb class=\"key\">무선 \u003c/b>\u003cb class=\"key\">네트워크\u003c/b>와 \u003cb class=\"key\">실시간 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>의 가용성이 훨씬 더 상세하고 동적인 표현을 가능하게 한다고 설명합니다. 과거의 정적 표현과 현재의 동적 표현을 대조하는 지점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>실시간 업데이트 과정\u003csmall>주장 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>네 번째 문장은 연결된 기기에서 센서가 데이터를 수집하면, 그 \u003cb class=\"key\">센서 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>가 디지털 트윈을 지속적으로 업데이트한다고 말합니다. 다섯 번째 문장은 그 결과 디지털 트윈이 물리적 객체의 속성과 상태에 대한 \u003cb class=\"key\">실시간 \u003c/b>\u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">복사본\u003c/b>이 된다고 정리합니다. 센서 데이터의 지속적 반영이 디지털 트윈의 핵심 원리입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>고가치 자산의 예시\u003csmall>예시 · 문장 6\u003c/small>\u003c/h4>\u003cp>여섯 번째 문장은 발전 터빈, 제트 엔진, 기차 엔진 같은 물리적 자산의 디지털 트윈이 일반화되고 있다고 예를 듭니다. 특히 자산이 매우 가치 있고 \u003cb class=\"key\">가동 \u003c/b>\u003cb class=\"key\">중단\u003c/b> 비용이 매우 클 때 유용합니다. 이는 실시간 모니터링이 경제적 가치가 큰 분야에서 먼저 도입된다는 점을 보여 줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문단의 흐름을 따라가 볼게요. 전체적으로 정의, 과거와 현재의 대조, 실시간 업데이트 과정, 그리고 실제 예시 순서로 전개됩니다.","hl":null},{"n":4,"text":"첫 번째 문장은 디지털 트윈의 정의를 제시합니다. 디지털 트윈은 모델링과 센서를 사용해서 자산이나 활동의 디지털 표현을 만드는 디지털 복제본이에요. 현실 세계의 자산이나 활동을 가상 공간에 재현한다는 점을 먼저 잡아 두세요.","hl":"f0"},{"n":5,"text":"두 번째 문장은 디지털 트윈이 새롭지 않다고 말해요. 여러 산업의 엔지니어링 팀이 컴퓨터 지원 설계 모델의 3D 렌더링과 공정 시뮬레이션을 수년 동안 사용해 왔죠. 그런데 세 번째 문장에서 however로 전환하면서, 더 빠른 무선 네트워크와 실시간 데이터의 가용성이 훨씬 더 상세하고 역동적인 디지털 표현을 가능하게 한다고 말합니다. 과거의 정적인 표현과 현재의 동적인 표현을 대조하는 지점이에요.","hl":"f1"},{"n":6,"text":"네 번째 문장은 연결된 기기에서 센서가 데이터를 수집할 때 그 센서 데이터가 디지털 트윈을 지속적으로 업데이트한다고 설명해요. 다섯 번째 문장에서는 그 결과 디지털 트윈이 물리적 객체의 속성과 상태에 대한 실시간 정확한 복사본이 된다고 정리합니다. 여기가 이 글의 핵심 주장에 해당하죠.","hl":"f2"},{"n":7,"text":"여섯 번째 문장은 예시를 들어 줍니다. 발전 터빈, 제트 엔진, 기차 엔진 같은 물리적 자산의 디지털 트윈이 점점 일반화되고 있다는 거예요. 특히 자산이 매우 가치 있고 가동 중단 비용이 매우 클 때 유용하다는 점을 기억하세요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 디지털 트윈의 \u003cb class=\"key\">과거\u003c/b>와 \u003cb class=\"key\">현재\u003c/b>를 비교·대조하면서 핵심 주장을 이끌어 내는 구조입니다. 첫 문장에서 디지털 트윈을 정의하고, 두 번째와 세 번째 문장에서 과거의 정적 표현과 현재의 동적 표현을 대조합니다. 네 번째와 다섯 번째 문장에서 실시간 업데이트의 원리와 결과를 제시하므로 다섯 번째 문장을 주제문으로 볼 수 있습니다. 여섯 번째 문장은 예시이므로 \u003cb class=\"key\">중괄식\u003c/b> 구조라고 판단했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (3)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>When (4)\u003c/b>\u003cspan>조건\u003c/span>\u003cb>For instance (6)\u003c/b>\u003cspan>예시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">digital replicas\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">digital representations\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">digital twin\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">real-time accurate copy\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">digital twins of physical assets\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>과거 디지털 트윈\u003c/th>\u003cth>현재 디지털 트윈\u003c/th>\u003c/tr>\u003ctr>\u003ctd>3D 렌더링·CAD 모델·공정 시뮬레이션으로 정적\u003c/td>\u003ctd>빠른 무선 네트워크·실시간 데이터로 동적\u003c/td>\u003c/tr>\u003ctr>\u003ctd>실시간 업데이트 제한\u003c/td>\u003ctd>물리적 객체의 정확한 실시간 복사본\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 지문은 과거의 디지털 트윈과 현재의 디지털 트윈을 비교하고 대조하는 구조예요. 핵심 주제문은 다섯 번째 문장, 즉 디지털 트윈이 실시간 정확한 복사본이 된다는 부분입니다. 첫 번째 문장에서 정의를 제시하고, 두 번째와 세 번째 문장에서 과거와 현재를 대조한 뒤, 네 번째와 다섯 번째 문장에서 핵심을 말하고, 마지막 문장에서 예를 드는 중괄식 구성으로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"이 글에서는 however와 For instance 같은 신호어가 중요해요. 세 번째 문장의 however는 과거의 디지털 트윈에서 현재의 디지털 트윈으로 논점을 전환해 주고, 여섯 번째 문장의 For instance는 앞서 설명한 내용을 구체적 사례로 보여 줘요. 또 digital replicas, digital representations, real-time accurate copy 같은 표현은 모두 디지털 트윈을 다시 가리키는 재진술이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>digital twin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디지털 트윈\u003c/span>\u003c/div>\u003cdiv>\u003cb>digital replica\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디지털 복제본\u003c/span>\u003c/div>\u003cdiv>\u003cb>asset\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자산\u003c/span>\u003c/div>\u003cdiv>\u003cb>activity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>활동\u003c/span>\u003c/div>\u003cdiv>\u003cb>modeling\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모델링\u003c/span>\u003c/div>\u003cdiv>\u003cb>sensor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>센서\u003c/span>\u003c/div>\u003cdiv>\u003cb>representation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표현, 재현\u003c/span>\u003c/div>\u003cdiv>\u003cb>engineering team\u003c/b>\u003cem>명사\u003c/em>\u003cspan>엔지니어링 팀\u003c/span>\u003c/div>\u003cdiv>\u003cb>industry\u003c/b>\u003cem>명사\u003c/em>\u003cspan>산업\u003c/span>\u003c/div>\u003cdiv>\u003cb>3D rendering\u003c/b>\u003cem>명사\u003c/em>\u003cspan>3D 렌더링\u003c/span>\u003c/div>\u003cdiv>\u003cb>computer-aided design model\u003c/b>\u003cem>명사\u003c/em>\u003cspan>컴퓨터 지원 설계(CAD) 모델\u003c/span>\u003c/div>\u003cdiv>\u003cb>process simulation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공정 시뮬레이션\u003c/span>\u003c/div>\u003cdiv>\u003cb>wireless network\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무선 네트워크\u003c/span>\u003c/div>\u003cdiv>\u003cb>real-time data\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실시간 데이터\u003c/span>\u003c/div>\u003cdiv>\u003cb>availability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가용성, 이용 가능성\u003c/span>\u003c/div>\u003cdiv>\u003cb>enable\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가능하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>detailed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상세한\u003c/span>\u003c/div>\u003cdiv>\u003cb>dynamic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>역동적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>connected device\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연결된 기기\u003c/span>\u003c/div>\u003cdiv>\u003cb>collect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수집하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>continuously update\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지속적으로 업데이트하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>accurate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정확한\u003c/span>\u003c/div>\u003cdiv>\u003cb>physical object\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물리적 객체\u003c/span>\u003c/div>\u003cdiv>\u003cb>property\u003c/b>\u003cem>명사\u003c/em>\u003cspan>속성\u003c/span>\u003c/div>\u003cdiv>\u003cb>state\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상태\u003c/span>\u003c/div>\u003cdiv>\u003cb>power-generation turbine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발전 터빈\u003c/span>\u003c/div>\u003cdiv>\u003cb>jet engine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제트 엔진\u003c/span>\u003c/div>\u003cdiv>\u003cb>train engine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기차 엔진\u003c/span>\u003c/div>\u003cdiv>\u003cb>valuable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가치 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>downtime\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가동 중단\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘에서는 asset을 자산, downtime을 가동 중단이라는 뜻으로 익혀 두세요. valuable은 가치 있는, accurate는 정확한이라는 뜻이에요. real-time data는 실시간 데이터, connected device는 연결된 기기라는 표현으로 시험에 자주 나옵니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">accurate\u003c/b>\u003cspan class=\"m\">정확한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">correct\u003c/span>\u003cspan class=\"s\">precise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inaccurate\u003c/span>\u003cspan class=\"a\">incorrect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">valuable\u003c/b>\u003cspan class=\"m\">가치 있는, 값비싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">precious\u003c/span>\u003cspan class=\"s\">costly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worthless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dynamic\u003c/b>\u003cspan class=\"m\">역동적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">active\u003c/span>\u003cspan class=\"s\">changing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">static\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">detailed\u003c/b>\u003cspan class=\"m\">상세한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">elaborate\u003c/span>\u003cspan class=\"s\">thorough\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enable\u003c/b>\u003cspan class=\"m\">가능하게 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">allow\u003c/span>\u003cspan class=\"s\">permit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prevent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">collect\u003c/b>\u003cspan class=\"m\">수집하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gather\u003c/span>\u003cspan class=\"s\">accumulate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disperse\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 시험에 자주 나오는 동의어와 반의어를 정리할게요. accurate는 correct나 precise와 같은 뜻이고, 반대는 inaccurate예요. dynamic은 active나 changing과 비슷하고 static과 반대입니다. valuable은 precious나 costly와 가까운 말이고, worthless와 반대죠. enable은 allow나 permit과 통하고 prevent와 반대라는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디지털 트윈은\u003c/span>\u003cspan class=\"en\">Digital twins\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디지털 복제본이다\u003c/span>\u003cspan class=\"en\">are digital replicas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자산이나 활동의\u003c/span>\u003cspan class=\"en\">of assets or activities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모델링과 센서를 사용하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">modeling \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">sensors\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디지털 표현을 만들기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">create \u003c/span>\u003cspan class=\"tgt\">digital \u003c/span>\u003cspa 이 아니라 사용되는 것이기 때문에 수동태로 표현했어요. 세 번째, to continuously update는 used의 목적을 나타내는 to부정사예요. 무엇을 위해 사용되는지, 즉 지속적으로 업데이트하기 위해 사용된다는 목적을 설명해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디지털 트윈은 ~이 된다\u003c/span>\u003cspan class=\"en\">The digital twin \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">becomes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정확한 실시간 복사본이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">real-time \u003c/span>\u003cspan class=\"tgt\">accurate \u003c/span>\u003cspan class=\"tgt\">copy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물리적 객체의 속성과 상태에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">physical \u003c/span>\u003cspan class=\"tgt\">object's \u003c/span>\u003cspan class=\"tgt\">properties \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">states\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">디지털 트윈은 물리적 객체의 속성과 상태에 대한 정확한 실시간 복사본이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 업데이트된 디지털 트윈의 결과물을 정의해요. 센서 데이터로 계속 갱신된 디지털 트윈이 실제 물리 객체의 \u003cb class=\"key\">속성\u003c/b>과 \u003cb class=\"key\">상태\u003c/b>를 정확하게 반영하는 \u003cb class=\"key\">실시간 \u003c/b>\u003cb class=\"key\">복사본\u003c/b>이 된다는 뜻이에요. properties와 states를 통해 물리 객체가 가진 여러 특성을 모두 복사한다는 점을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 become\u003c/span> : S + become + C : \"~이 된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">한정사와 형용사의 전치 수식\u003c/span> : a + 형용사 + 형용사 + 명사 : \"정확한 실시간 복사본이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">of 전치사구의 형용사적 용법\u003c/span> : 명사 + of + 소유격 명사구 : \"물리적 객체의 속성과 상태에 대한\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The digital twin becomes, 디지털 트윈은 ~이 된다. a real-time accurate copy, 정확한 실시간 복사본이. of a physical object's properties and states, 물리적 객체의 속성과 상태에 대한. 이 문장 전체를 해석하면, 디지털 트윈은 물리적 객체의 속성과 상태에 대한 정확한 실시간 복사본이 된다.","hl":"m"},{"n":25,"text":"이 문장은 디지털 트윈의 결과물이 무엇인지 정의하고 있어요. 센서 데이터로 계속 업데이트된 디지털 트윈이 실제 물리적 객체의 속성과 상태를 정확하게 실시간으로 복사한 것, 즉 실시간 복사본이 된다는 뜻이에요. properties는 속성, states는 상태로 물리 객체가 가진 여러 특성을 모두 반영한다는 점을 강조해요.","hl":"mn"},{"n":26,"text":"첫 번째, becomes는 2형식 동사로 주어인 The digital twin과 보어인 a real-time accurate copy를 연결해 줘요. become은 어떤 상태로 변화하는 것을 나타내는 2형식 동사예요. 두 번째, a real-time accurate copy는 한정사 a와 형용사 real-time, accurate가 명사 copy를 앞에서 수식하는 구조예요. 세 번째, of a physical object's properties and states는 앞의 copy를 수식하는 형용사구로, 무엇에 대한 복사본인지 그 대상이 물리적 객체의 속성과 상태임을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For instance,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물리적 자산의 디지털 트윈은\u003c/span>\u003cspan class=\"en\">digital twins of physical assets\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발전 터빈, 제트 엔진, 기차 엔진과 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">power-generation \u003c/span>\u003cspan class=\"tgt\">turbines, \u003c/span>\u003cspan class=\"tgt\">jet \u003c/span>\u003cspan class=\"tgt\">engines, \u003c/span>\u003cspan class=\"tgt\">and \u00 ss=\"gn\">현재진행형\u003c/span> : be + -ing : \"일반화되고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">when이 이끄는 부사절의 병렬\u003c/span> : when + S + V and when + S + V : \"자산이 매우 가치 있고 가동 중단 비용이 매우 클 때\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"For instance, 예를 들어. digital twins of physical assets, 물리적 자산의 디지털 트윈은. such as power-generation turbines, jet engines, and train engines, 발전 터빈, 제트 엔진, 기차 엔진과 같은. are becoming common, 일반화되고 있다. when the assets are very valuable, 자산이 매우 가치 있고. and when downtime would be very costly, 가동 중단 비용이 매우 클 때. 이 문장 전체를 해석하면, 예를 들어, 발전 터빈, 제트 엔진, 기차 엔진과 같은 물리적 자산의 디지털 트윈은 자산이 매우 가치 있고 가동 중단 비용이 매우 클 때 일반화되고 있다.","hl":"m"},{"n":28,"text":"이 문장은 디지털 트윈이 특히 유용한 조건을 예시를 들어 설명하고 있어요. 발전 터빈, 제트 엔진, 기차 엔진처럼 자산 가치가 매우 높고, 가동 중단 비용이 매우 클 때 디지털 트윈이 일반화되고 있다는 뜻이에요. such as로 대표적인 물리적 자산들을 나열하면서 앞 문장의 내용을 구체화하고 있어요.","hl":"mn"},{"n":29,"text":"첫 번째, such as power-generation turbines, jet engines, and train engines는 such as를 써서 예시를 나열하는 표현이에요. 뒤에 세 개의 명사구가 and로 연결되어 병렬 구조를 이루고 있어요. 두 번째, are becoming common은 현재진행형이에요. 단순 현재가 아니라 are becoming을 써서 점점 일반화되어 가는 변화의 흐름을 나타내고 있죠. 세 번째, when the assets are very valuable and when downtime would be very costly는 when이 이끄는 두 개의 부사절이 and로 병렬 연결된 구조예요. 디지털 트윈이 일반화되는 두 가지 조건을 대등하게 이어 주고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>디지털 트윈은 \u003cb class=\"key\">모델링\u003c/b>과 \u003cb class=\"key\">센서\u003c/b>를 사용해 자산이나 활동의 디지털 표현을 만드는 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">복제본\u003c/b>이다.\u003c/li>\u003cli>디지털 트윈 자체는 새롭지 않으며, 과거에는 주로 \u003cb class=\"key\">3D \u003c/b>\u003cb class=\"key\">렌더링\u003c/b>과 \u003cb class=\"key\">공정 \u003c/b>\u003cb class=\"key\">시뮬레이션\u003c/b>에 머물렀다.\u003c/li>\u003cli>더 빠른 \u003cb class=\"key\">무선 \u003c/b>\u003cb class=\"key\">네트워크\u003c/b>와 \u003cb class=\"key\">실시간 \u003c/b>\u003cb class=\"key\">데이터\u003c/b> 덕분에 센서 데이터가 디지털 트윈을 계속 업데이트하여 \u003cb class=\"key\">실시간 \u003c/b>\u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">복사본\u003c/b>을 만든다.\u003c/li>\u003cli>이러한 디지털 트윈은 발전 터빈, 제트 엔진, 기차 엔진처럼 \u003cb class=\"key\">가동 \u003c/b>\u003cb class=\"key\">중단\u003c/b> 비용이 큰 \u003cb class=\"key\">고가치 \u003c/b>\u003cb class=\"key\">자산\u003c/b>에서 일반화되고 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Faster wireless networks and real-time sensor data enable digital twins to become real-time accurate copies, especially for valuable physical assets.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">디지털 트윈은 모델링과 센서로 만든 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">복제본\u003c/b>이며, 더 빠른 무선 네트워크와 \u003cb class=\"key\">실시간 \u003c/b>\u003cb class=\"key\">데이터\u003c/b> 덕분에 물리적 객체의 속성과 상태를 반영하는 \u003cb class=\"key\">실시간 \u003c/b>\u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">복사본\u003c/b>으로 발전했다. 특히 \u003cb class=\"key\">가동 \u003c/b>\u003cb class=\"key\">중단\u003c/b> 비용이 매우 큰 고가치 자산에서 일반화되고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 지문을 정리하면, 디지털 트윈은 원래 오래된 개념이지만 빠른 무선 네트워크와 실시간 데이터 덕분에 훨씬 더 정밀하고 동적인 실시간 복사본이 되었어요. 특히 발전 터빈이나 제트 엔진처럼 고가치 자산에서 가동 중단을 줄이기 위해 널리 쓰이고 있습니다. 이 흐름을 머릿속에 넣고 복습하면 좋겠어요. 오늘 수고 많았어요.","hl":null}]}]});</script></body></html>
