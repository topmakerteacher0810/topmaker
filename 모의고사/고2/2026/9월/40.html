ass=\"lec-cover-bkg-txt\">심리학에는 우리가 스스로의 과거 행동을 관찰하며 자신의 성향이나 태도를 파악한다는 자기지각이론(Self-Perception Theory)이 있습니다. 예를 들어, 길거리에서 쓰레기를 주웠던 내 모습을 떠올리며 &#39;나는 참 착한 사람이야&#39;라고 생각하게 되면, 이후에도 타인을 돕는 친사회적 행동(Prosocial Behavior)을 훨씬 더 적극적으로 하게 되는 원리죠. 하지만 이때 중요한 것은 행동의 이유인데, 다른 사람의 칭찬이나 시선을 의식하는 외재적 동기(Extrinsic Motivation)보다는 선행 그 자체에 순수한 가치를 두는 내재적 동기(Intrinsic Motivation)를 가질 때 사람들은 더 큰 관대함을 보입니다. 이는 마치 누군가에게 보여주기 위해 억지로 산 선물이 아니라, 정말 마음이 우러나와 준비한 선물이 훨씬 더 정성스러운 것과 같은 이치랍니다. 앞으로 읽으실 지문은 과거의 선행을 떠올리는 방식과 그 이면에 숨겨진 동기가 우리의 향후 기부나 선행의 크기에 어떤 결정적인 영향을 미치는지를 실제 대학생들의 실험을 통해 흥미롭게 보여주고 있으니, 평소 나의 선행 동기는 어디에 가까울지 상상하며 읽어보시면 훨씬 쉽게 이해되실 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입 및 핵심 원리</div><ul><li>성인의 뇌는 선행을 지속하려는 성향이 있으며, 자신을 선한 사람으로 인식하면 더 큰 선행을 하게 된다.</li><li>선하고 공정한 행동(good, fair behavior)을 영구화하려는 선호도 유지</li><li>자신을 선한 행동(good deeds)을 하는 사람으로 인식할 때 미래의 선행에 동기 부여됨</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02실험 결과 1 - 선행 회상의 효과</div><ul><li>과거의 행동 회상이 기부 금액에 미치는 영향을 알아본 대학생 실험 결과이다.</li><li>과거의 선행을 기록한 피험자(subjects)는 자선단체(charity)에 수입의 절반 이상을 기부함</li><li>악행(bad deeds)을 회상한 집단보다 거의 두 배 많은 기부금을 냄</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03실험 결과 2 - 타인 반응 고려의 효과</div><ul><li>선행을 할 때 타인의 반응까지 신경 쓴 집단과 행동 자체에만 집중한 집단의 기부액 차이를 보여준다.</li><li>사람들의 반응(how people responded)까지 묘사한 사람은 기부액이 현저히 적음</li><li>행동 자체(actions themselves)에만 순수하게 집중한 사람이 더 많이 기부함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 시사점</div><ul><li>타인의 평가나 겉보기보다 선행 그 자체를 추구하는 사람이 이타적인 행동에 더 관대하다.</li><li>겉모습(appearances)이나 타인에게 미치는 영향에 관심 있는 사람은 덜 관대함(less generous)</li><li>선행 그 자체(doing good for its own sake)를 중시하는 사람이 더 큰 관대함을 보임</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">retain</td><td class=\"m\">유지하다, 간직하다</td></tr><tr><td class=\"w\">preference</td><td class=\"m\">선호, 좋아함</td></tr><tr><td class=\"w\">perpetuate</td><td class=\"m\">영구화하다, 계속되게 하다</td></tr><tr><td class=\"w\">perceive</td><td class=\"m\">인식하다, 인지하다</td></tr><tr><td class=\"w\">deed</td><td class=\"m\">행위, 행동</td></tr><tr><td class=\"w\">accordingly</td><td class=\"m\">그에 따라, 부응하여</td></tr><tr><td class=\"w\">motivate</td><td class=\"m\">동기를 부여하다, 자극하다</td></tr><tr><td class=\"w\">write down</td><td class=\"m\">~을 적다, 기록하다</td></tr><tr><td class=\"w\">donate</td><td class=\"m\">기부하다, 기증하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">on average</td><td class=\"m\">평균적으로, 대체로</td></tr><tr><td class=\"w\">instruct</td><td class=\"m\">지시하다, 가르치다</td></tr><tr><td class=\"w\">recall</td><td class=\"m\">기억해 내다, 상기하다</td></tr><tr><td class=\"w\">in addition</td><td class=\"m\">게다가, 덧붙여</td></tr><tr><td class=\"w\">take pains</td><td class=\"m\">공을 들이다, 애를 쓰다</td></tr><tr><td class=\"w\">focus on</td><td class=\"m\">~에 집중하다, 초점을 맞추다</td></tr><tr><td class=\"w\">in other words</td><td class=\"m\">다시 말해서, 즉</td></tr><tr><td class=\"w\">generous</td><td class=\"m\">관대한, 후한</td></tr><tr><td class=\"w\">for its own sake</td><td class=\"m\">그 자체를 위해, 자기 목적을 위해</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리의 성인 뇌는 선호를 유지한다</span><span class=\"en\"><b>Our adult brains retain a preference</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선하고 공정한 행동을 영속시키는 것에 대한</span><span class=\"en\"><b><span class=\"grammar-hl\">for perpetuating</span> good, fair behavior.</b></span></div></div><div class=\"lec-sent-ko\">우리의 성인 뇌는 선하고 공정한 행동을 영속시키는 것에 대한 선호를 유지한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 인간의 뇌가 본능적으로 착하고 공정한 행동을 계속 이어나가고 싶어 하는 성향을 지니고 있음을 밝힙니다. retain a preference for perpetuating은 단순히 일회성으로 끝나는 것이 아니라, 좋은 행동을 한 번 하면 그 이후에도 끊임없이 반복하고자 하는 인간의 심리적 경향을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">for perpetuating (동명사): 전치사 for의 목적어 역할을 하는 명사적 기능의 구조이며, 뒤에 목적어(good, fair behavior)를 취하고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">retain</td><td class=\"m\">유지하다, 간직하다</td></tr><tr><td class=\"w\">preference</td><td class=\"m\">선호, 좋아함</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">단순히 우리 자신을 인식하고</span><span class=\"en\"><b>Simply <span class=\"grammar-hl\">perceiving ourselves</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람으로</span><span class=\"en\"><b><span class=\"grammar-hl\">as people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 행위를 하는</span><span class=\"en\"><b><span class=\"grammar-hl\">who do good deeds</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그에 맞춰 행동하는 것만으로도</span><span class=\"en\"><b><span class=\"grammar-hl\">and behaving accordingly</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리에게 동기를 부여한다</span><span class=\"en\"><b><span class=\"grammar-hl\">motivates us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 큰 선을 행하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to do</span> greater good</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미래에</span><span class=\"en\"><b>in the future.</b></span></div></div><div class=\"lec-sent-ko\">단순히 우리 자신을 좋은 행위를 하는 사람으로 인식하고 그에 맞춰 행동하는 것만으로도 우리가 미래에 더 큰 선을 행하도록 동기를 부여한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 원리를 구체화하는 문장입니다. 스스로를 착한 사람이라고 생각하고 그 생각에 맞춰 행동하는 과정 자체가, 앞으로 더 큰 선행을 베풀게 만드는 강력한 원동력이 된다고 설명합니다. behaving accordingly는 머릿속으로 스스로를 착한 사람이라고 인식하는 데 그치지 않고 실제 현실에서도 그 기준에 맞춰 올바르게 행동으로 옮기는 것을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">perceiving ourselves as people who do good deeds and behaving accordingly (동명사): perceiving과 behaving이 등위접속사 and로 연결되어 문장 전체의 주어 역할을 하는 동명사구 구조이다. 구(Phrase) 주어이므로 서술어로 단수 동사(motivates)가 이어진다.</div><div class=\"lec-gr-item\">who do (관계대명사): 주격 관계대명사 who가 이끄는 절이 선행사 people을 수식한다. 절 내부에서 who가 주어 역할을 한다.</div><div class=\"lec-gr-item\">motivates us to do 5형식(SVOC) 구조: 기본구조는 motivate + O(목적어) + toV(목적격보어)이다. 대명사 us가 목적어, to부정사구(to do)가 목적격 보어 역할을 하여 앞선 동명사 주어의 서술어 역할을 한다.</div><div class=\"lec-gr-item\">to do (to부정사): 5형식 동사 motivate의 목적격 보어 역할을 하는 명사적 용법의 부정사 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deed</td><td class=\"m\">행위, 행동</td></tr><tr><td class=\"w\">accordingly</td><td class=\"m\">그에 따라, 부응하여</td></tr><tr><td class=\"w\">motivate</td><td class=\"m\">동기를 부여하다, 자극하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">100명의 대학생을 대상으로 한 보수가 지급되는 한 연구에서,</span><span class=\"en\"><b>In one <span class=\"grammar-hl\">paid study</span> of one hundred college students,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피실험자들은</span><span class=\"en\"><b>subjects</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과거 좋은 행위의 목록을 작성한</span><span class=\"en\"><b><span class=\"grammar-hl\">who wrote down a list of past good deeds</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 나서 요청받은</span><span class=\"en\"><b><span class=\"grammar-hl\">and were then asked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자선 단체에 기부할 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to donate money</span> to a charity</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">평균적으로 수익의 절반 이상을 기부했다</span><span class=\"en\"><b>gave, on average, over half <span class=\"grammar-hl\">the earnings</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 연구를 통해 번</span><span class=\"en\"><b><span class=\"grammar-hl\">they'd made</span> from the study</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">- 거의 두 배였다</span><span class=\"en\"><b>- almost twice as much</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들보다</span><span class=\"en\"><b>as <span class=\"grammar-hl\">those</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지시받았던</span><span class=\"en\"><b><span class=\"grammar-hl\">who had been instructed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이전의 나쁜 행위를 회상하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to recall</span> previous bad deeds.</b></span></div></div><div class=\"lec-sent-ko\">100명의 대학생을 대상으로 한 보수가 지급되는 한 연구에서, 과거 좋은 행위의 목록을 작성한 후 자선 단체에 기부할 것을 요청받은 피실험자들은 평균적으로 연구를 통해 번 수익의 절반 이상을 기부했다. 이는 이전의 나쁜 행위를 회상하도록 지시받았던 사람들보다 거의 두 배였다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 제시한 주장을 뒷받침하기 위해 구체적인 실험 결과를 예시로 제시합니다. 자신의 과거 선행을 떠올린 집단이 악행을 떠올린 집단보다 기부금을 훨씬 더 많이 냈다는 사실을 통해, 스스로를 긍정적으로 인식하는 것이 실제 이타적인 행동으로 이어진다는 점을 증명합니다. almost twice as much as those에서 글쓴이는 선행을 떠올린 효과가 그렇지 않은 경우에 비해 기부액을 두 배 가까이 껑충 뛰게 만들었다는 극적인 차이를 강조하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">paid study (과거분사(형용사)): paid가 뒤에 오는 명사 study를 수식하는 형용사 역할을 한다. p.p. + N 구조로 &#39;보수를 받는 연구/유급 연구&#39;라는 수동적 의미를 나타낸다.</div><div class=\"lec-gr-item\">who wrote down a list of past good deeds and were then asked to donate money (관계대명사): 주격 관계대명사 who가 이끄는 절이 선행사 subjects를 수식한다. 절 내부에서 과거동사 wrote down과 수동태 동사구 were then asked가 and로 병렬 연결되어 있다.</div><div class=\"lec-gr-item\">write down (관용표현): &#39;~을 적다, 기록하다&#39;라는 의미를 나타내는 구동사(이어동사) 구조이다.</div><div class=\"lec-gr-item\">were then asked to donate (수동태): be동사(were) + p.p.(asked) 구조. ask는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) were asked 형태로 쓴다. 기본구조: ask + O(목적어) + toV (5형식). 목적어가 주어로 올라가 수동구조가 되고, 목적격 보어인 to부정사(to donate)는 구조가 그대로 남는다.</div><div class=\"lec-gr-item\">to donate (to부정사): 수동태로 전환된 5형식 동사 ask 뒤에 그대로 남아 목적격 보어 역할을 하는 부정사 구조이다.</div><div class=\"lec-gr-item\">the earnings they&#39;d made (관계대명사): 선행사 명사(the earnings)와 대명사(they) 사이에 목적격 관계대명사(which 또는 that)가 생략된 구조이다. 뒤에 이어진 주어+동사(they had made) 절이 앞의 명사를 수식한다.</div><div class=\"lec-gr-item\">those who had been instructed to recall (관계대명사): 주격 관계대명사 who가 이끄는 형용사절이 대명사 선행사 those(~한 사람들)를 수식한다. 절 내부에서 who가 주어 역할을 한다.</div><div class=\"lec-gr-item\">had been instructed to recall (수동태): 과거완료 수동태인 be동사(been) + p.p.(instructed) 구조. instruct는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) had been instructed 형태로 쓴다. 기본구조: instruct + O(목적어) + toV (5형식). 목적어가 주어로 올라가 수동구조가 되고, 목적격 보어인 to부정사(to recall)는 구조가 그대로 남는다.</div><div class=\"lec-gr-item\">to recall (to부정사): 수동태로 전환된 5형식 동사 instruct 뒤에 남아 목적격 보어 역할을 하는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deed</td><td class=\"m\">행위, 행동</td></tr><tr><td class=\"w\">donate</td><td class=\"m\">기부하다, 기증하다</td></tr><tr><td class=\"w\">on average</td><td class=\"m\">평균적으로, 대체로</td></tr><tr><td class=\"w\">instruct</td><td class=\"m\">지시하다, 가르치다</td></tr><tr><td class=\"w\">recall</td><td class=\"m\">기억해 내다, 상기하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">게다가,</span><span class=\"en\"><b>In addition,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">피실험자들은</span><span class=\"en\"><b>subjects</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공들여 묘사했던</span><span class=\"en\"><b><span class=\"grammar-hl\">who'd taken pains</span> <span class=\"grammar-hl\">to describe</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신이 타인에게 얼마나 친절했는지 뿐만 아니라</span><span class=\"en\"><b>not only <span class=\"grammar-hl\">how they'd been nice to others</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 어떻게 반응했는지까지</span><span class=\"en\"><b>but <span class=\"grammar-hl\">how people responded</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 적게 기부하는 경향이 있었다</span><span class=\"en\"><b>were <span class=\"grammar-hl\">likely to donate</span> significantly less</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들보다</span><span class=\"en\"><b>than <span class=\"grammar-hl\">those</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">순수하게 행위 그 자체에만 초점을 둔</span><span class=\"en\"><b><span class=\"grammar-hl\">who focused</span> purely on the actions themselves.</b></span></div></div><div class=\"lec-sent-ko\">게다가, 자신이 타인에게 얼마나 친절했는지 뿐만 아니라 사람들이 어떻게 반응했는지까지 공들여 묘사했던 피실험자들은, 순수하게 행위 그 자체에만 초점을 둔 사람들보다 훨씬 적게 기부하는 경향이 있었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 실험 결과에 흥미로운 조건을 덧붙여 논의를 심화하는 문장입니다. 똑같이 선행을 떠올렸더라도, 자신의 착한 행동 자체보다 그로 인해 남들이 어떻게 반응했는지에 신경 쓴 사람들은 오히려 기부액이 뚝 떨어졌다는 새로운 발견을 보여줍니다. taken pains to describe는 자신의 선행이 남들에게 얼마나 좋게 보였는지 굳이 공들여 포장하고 서술하려는 태도를 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who&#39;d taken pains (관계대명사): 주격 관계대명사 who가 선행사 subjects를 수식하는 형용사절을 이끈다. (&#39;d는 과거완료 조동사 had의 축약형이다.)</div><div class=\"lec-gr-item\">taken pains (관용표현): take pains는 &#39;수고를 아끼지 않다, 애쓰다&#39;라는 의미를 가진 숙어 구조이다.</div><div class=\"lec-gr-item\">to describe (to부정사): take pains toV 구조로 쓰여 명사 pains를 수식하거나 목적/결과를 나타내는 부사적 역할을 하는 부정사 구조이다.</div><div class=\"lec-gr-item\">how they&#39;d been nice to others (간접의문문): 의문부사(how) + 주어(they) + 동사(had been) 어순으로 구성된 명사절로, 동사 describe의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">how people responded (간접의문문): 의문부사(how) + 주어(people) + 동사(responded) 어순으로 구성된 명사절이다. 앞선 간접의문문과 not only A but (also) B 구문으로 병렬 연결되어 describe의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">likely to donate (to부정사): be likely toV 관용구조에서 형용사 likely 뒤에 연결되어 주어의 행동 가능성을 나타내는 부사적 수식 구조이다.</div><div class=\"lec-gr-item\">those who focused (관계대명사): 주격 관계대명사 who가 이끄는 절이 대명사 선행사 those를 수식한다. 절 내부에서 who가 주어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">donate</td><td class=\"m\">기부하다, 기증하다</td></tr><tr><td class=\"w\">in addition</td><td class=\"m\">게다가, 덧붙여</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">다시 말해서,</span><span class=\"en\"><b>In other words,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은</span><span class=\"en\"><b>people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">겉모습에 신경을 쓰는 것처럼 보이는</span><span class=\"en\"><b><span class=\"grammar-hl\">who seemed concerned</span> about appearances</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(예를 들어, 자신의 좋은 행위가 미칠 영향력에,</span><span class=\"en\"><b>(e.g., the impact of their good deed,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">좋은 행위 그 자체만큼이나)</span><span class=\"en\"><b>as much as the deed itself)</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">덜 관대했다</span><span class=\"en\"><b>were less generous</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들보다</span><span class=\"en\"><b>than <span class=\"grammar-hl\">those</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선을 그 자체를 위해 행하는 것에 더 마음을 쓰는</span><span class=\"en\"><b><span class=\"grammar-hl\">who cared</span> more about <span class=\"grammar-hl\">doing</span> good <span class=\"grammar-hl\">for its own sake</span>.</b></span></div></div><div class=\"lec-sent-ko\">다시 말해서, 겉모습(예를 들어, 좋은 행위 그 자체만큼이나 자신의 좋은 행위가 미칠 영향력)에 신경을 쓰는 것처럼 보이는 사람들은, 선을 그 자체를 위해 행하는 것에 더 마음을 쓰는 사람들보다 덜 관대했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 실험 결과를 종합하여 글 전체의 결론을 내립니다. 남의 시선이나 칭찬을 의식해서 착한 일을 하는 사람에 비해, 선행 그 자체가 가치 있다고 믿고 행동하는 사람이 실제 현실에서도 훨씬 더 베풀고 나누는 삶을 산다는 점을 분명히 합니다. concerned about appearances는 타인이 나를 어떻게 평가할지에 촉각을 곤두세우는 태도를 말하며, for its own sake는 어떤 보상이나 칭찬을 바라지 않고 순수하게 착한 일 자체의 목적에만 충실하다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who seemed concerned (관계대명사): 주격 관계대명사 who가 선행사 people을 수식하는 형용사절을 이끈다. 절 내부에서 who가 주어 역할을 한다.</div><div class=\"lec-gr-item\">concerned (과거분사(형용사)): 2형식 동사 seemed의 주격 보어 역할을 하는 과거분사 구조로, 주어인 선행사(people)가 느끼는 감정이나 심리적 상태를 설명한다.</div><div class=\"lec-gr-item\">those who cared (관계대명사): 주격 관계대명사 who가 대명사 선행사 those(~한 사람들)를 수식하는 형용사절을 이끈다.</div><div class=\"lec-gr-item\">doing (동명사): 전치사 about의 목적어 역할을 하는 명사적 기능의 동명사 구조이며, 뒤에 명사(good)를 목적어로 취한다.</div><div class=\"lec-gr-item\">for its own sake (관용표현): &#39;그 자체를 위해, 그 자체의 목적으로&#39;라는 의미를 나타내는 숙어 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deed</td><td class=\"m\">행위, 행동</td></tr><tr><td class=\"w\">in other words</td><td class=\"m\">다시 말해서, 즉</td></tr><tr><td class=\"w\">generous</td><td class=\"m\">관대한, 후한</td></tr><tr><td class=\"w\">for its own sake</td><td class=\"m\">그 자체를 위해, 자기 목적을 위해</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간의 뇌는 스스로 착한 사람이라고 인식할 때 선행을 계속 이어가려는 경향이 있다.</li><li>과거의 선행을 떠올리게 한 실험에서 사람들은 평소보다 훨씬 더 많은 금액을 기부하며 이를 증명했다.</li><li>하지만 같은 선행이라도 타인의 칭찬이나 반응에 신경 쓴 사람들은 오히려 기부액이 크게 줄어들었다.</li><li>결국 남의 시선을 의식하는 것보다 순수하게 선행 자체에 집중할 때 인간은 가장 관대해진다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Recalling our own past good deeds encourages future generosity, while focusing on external validation rather than the intrinsic act itself decreases our willingness to give.</div>\n              <div class=\"lec-final-sum-ko\">과거의 선행을 상기하는 것은 미래의 관대함을 장려하는 반면, 내재적 행동 자체보다는 외적인 인정에 집중하는 것은 베풀고자 하는 의지를 감소시킨다.</div></div></div>"],"segs":[[{"audio":"./40_audio/1.mp3","hl":null}],[{"audio":"./40_audio/2.mp3","hl":null}],[{"audio":"./40_audio/3.mp3","hl":null},{"audio":"./40_audio/4.mp3","hl":"stage-0"},{"audio":"./40_audio/5.mp3","hl":"stage-1"},{"audio":"./40_audio/6.mp3","hl":"stage-2"},{"audio":"./40_audio/7.mp3","hl":"stage-3"}],[{"audio":"./40_audio/8.mp3","hl":null}],[{"audio":"./40_audio/9.mp3","hl":"main"},{"audio":"./40_audio/10.mp3","hl":"meaning"},{"audio":"./40_audio/11.mp3","hl":"grammar"}],[{"audio":"./40_audio/12.mp3","hl":"main"},{"audio":"./40_audio/13.mp3","hl":"meaning"},{"audio":"./40_audio/14.mp3","hl":"grammar"}],[{"audio":"./40_audio/15.mp3","hl":"main"},{"audio":"./40_audio/16.mp3","hl":"meaning"},{"audio":"./40_audio/17.mp3","hl":"grammar"}],[{"audio":"./40_audio/18.mp3","hl":"main"},{"audio":"./40_audio/19.mp3","hl":"meaning"},{"audio":"./40_audio/20.mp3","hl":"grammar"}],[{"audio":"./40_audio/21.mp3","hl":"main"},{"audio":"./40_audio/22.mp3","hl":"meaning"},{"audio":"./40_audio/23.mp3","hl":"grammar"}],[{"audio":"./40_audio/24.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.seg
