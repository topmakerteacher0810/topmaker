</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 40번","audioDir":"40_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">40번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>How Object-Color Associations Shape Perceived Color\u003c/h1>\u003ch2>사물과 색의 인지적 연상이 색 지각에 미치는 영향\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Delk와 Fillenbaum의 실험은 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>이 \u003cb class=\"key\">지각된 \u003c/b>\u003cb class=\"key\">세계\u003c/b>에 영향을 미친다는 생각을 뒷받침한다. 같은 다홍색 판지라도 \u003cb class=\"key\">빨간색 \u003c/b>\u003cb class=\"key\">연관 \u003c/b>\u003cb class=\"key\">물체\u003c/b>는 배경에 더 많은 빨강을 요구하여, \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">연상\u003c/b>이 \u003cb class=\"key\">색 \u003c/b>\u003cb class=\"key\">지각\u003c/b>을 바꾼다는 것을 보여 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Cognitive associations between objects and colors influence how we perceive color.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 살펴볼 지문은 Delk와 Fillenbaum의 실험을 다룬 글이에요. 이 글은 인지적 요인이 우리가 지각하는 세계의 현상학에 영향을 미친다는 주장을 실험으로 뒷받침하고 있어요. 요약하면, 빨간색과 연관된 물체일수록 배경에 더 많은 빨강을 요구했고, 이것은 사물과 색의 인지적 연관성이 색 지각에 영향을 준다는 뜻입니다. 자, 그럼 본문으로 들어가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 색을 본다고 할 때 눈에 들어오는 빛의 파장만으로 색이 정해지는 것은 아니다. 뇌는 과거 경험과 기억을 바탕으로 들어온 정보를 적극적으로 해석하는데, 이를 심리학에서는 하향 처리(top-down processing)라고 한다. 예를 들어 같은 농도의 갈색이라도 익숙한 초콜릿 모양이면 더 진하고 달콤해 보일 수 있다. 이는 마치 좋아하는 사람의 목소리는 같은 말도 더 반갑게 들리는 것과 비슷하다. Delk와 Fillenbaum의 실험은 물체와 색의 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">연관\u003c/b>(cognitive association)이 실제 \u003cb class=\"key\">색 \u003c/b>\u003cb class=\"key\">지각\u003c/b>에 관여한다는 증거를 제공한다.\u003c/div>","segs":[{"n":2,"text":"색을 본다는 것은 눈에 들어온 빛만으로 결정되지 않아요. 뇌는 과거 경험과 기억을 이용해 들어온 정보를 적극적으로 해석하는데, 심리학에서는 이를 하향 처리 top-down processing라고 부릅니다. 예를 들어 같은 농도의 갈색이라도 초콜릿 모양이면 더 진하고 달콤해 보일 수 있어요. 좋아하는 사람의 목소리가 같은 말도 더 반갑게 들리는 것과 비슷하죠. Delk와 Fillenbaum의 실험은 사물과 색의 인지적 연관성, cognitive association이 실제 색 지각에 관여한다는 증거를 보여 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인지와 지각의 관계 제시\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>연구 하나를 소개하며 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>이 \u003cb class=\"key\">지각된 \u003c/b>\u003cb class=\"key\">세계\u003c/b>의 \u003cb class=\"key\">현상학\u003c/b>에 영향을 미친다는 생각을 뒷받침한다고 밝힌다. 이 문장은 글 전체의 주장을 먼저 제시하는 역할을 한다. 즉, 우리가 세상을 어떻게 경험하는지는 단순한 감각 입력만이 아니라 머릿속 인지 과정과 연결된다는 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>실험 재료와 조건 설정\u003csmall>근거·실험 설계 · 문장 2–6\u003c/small>\u003c/h4>\u003cp>Delk와 Fillenbaum은 참가자들에게 형상 색을 배경과 맞추도록 했다. 형상 중에는 사과, 입술, \u003cb class=\"key\">상징적 \u003c/b>\u003cb class=\"key\">하트\u003c/b>처럼 빨강과 연관된 물체가 있었고, 버섯이나 종처럼 \u003cb class=\"key\">빨간색 \u003c/b>\u003cb class=\"key\">비연관 \u003c/b>\u003cb class=\"key\">물체\u003c/b>도 있었다. 그러나 모든 형상은 \u003cb class=\"key\">동일한 \u003c/b>\u003cb class=\"key\">다홍색 \u003c/b>\u003cb class=\"key\">판지\u003c/b>로 만들어져 실제 색은 같았다. 이렇게 조건을 통제하여 물체의 의미 외 다른 변수를 배제했다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>색 대응 과제와 실험 결과\u003csmall>실험 결과 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>참가자들은 진한 빨강에서 연한 빨강까지 \u003cb class=\"key\">배경색\u003c/b>을 조절하며 형상과 일치하도록 맞춰야 했다. 연구자들은 \u003cb class=\"key\">빨간색 \u003c/b>\u003cb class=\"key\">연관 \u003c/b>\u003cb class=\"key\">물체\u003c/b>가 배경과 일치한다고 판단되기 위해 더 많은 빨강을 요구한다는 것을 발견했다. 이는 같은 실제 색이라도 물체의 \u003cb class=\"key\">의미\u003c/b>가 색 판단 기준을 달라지게 한다는 뜻이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>인지적 연상의 영향 결론\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>실험 결과는 물체와 색의 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">연관성\u003c/b>이 우리가 색을 \u003cb class=\"key\">지각\u003c/b>하는 방식에 영향을 미친다는 것을 \u003cb class=\"key\">함의\u003c/b>한다. 처음 제시한 주장이 실험 근거를 통해 다시 확인되는 마무리이다. 따라서 지각은 물리적 자극의 반영일 뿐 아니라 우리의 기대와 지식이 개입하는 능동적 과정이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 먼저 주장을 제시하고, 실험 설계와 결과를 거쳐 마지막에 결론을 다시 확인하는 흐름이에요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 연구 하나가 인지적 요인과 지각된 세계의 현상학 사이의 관계를 뒷받침한다고 말해요. 즉 우리가 세상을 경험하는 방식은 단순한 감각 입력만이 아니라 머릿속 인지 과정과 연결된다는 주장을 먼저 던지는 거죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 실험 설계예요. Delk와 Fillenbaum은 참가자들에게 형상의 색을 배경 색과 맞추도록 요청했어요. 사과, 입술, 상징적 하트처럼 빨간색과 연관된 물체가 있었고, 버섯이나 종처럼 빨간색과 연관되지 않은 물체도 있었죠. 그런데 모든 형상은 동일한 다홍색 판지로 만들어져서 실제 색은 같았어요. 이렇게 물체의 의미 외에 다른 변수를 통제한 거예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 실험 결과예요. 참가자들은 진한 빨강에서 연한 빨강까지 배경색을 조절하며 형상과 일치하도록 맞춰야 했어요. 연구자들은 빨간색 연관 물체가 배경과 일치한다고 판단되기 위해 더 많은 빨강을 요구한다는 것을 발견했죠. 같은 실제 색이라도 물체의 의미가 색 판단 기준을 달라지게 한다는 뜻이에요.","hl":"f2"},{"n":7,"text":"마지막 단계는 결론이에요. 물체와 색의 인지적 연관성이 우리가 색을 지각하는 방식에 영향을 미친다는 것을 함의해요. 처음 제시한 주장이 실험 근거를 통해 다시 확인되는 마무리죠. 그래서 지각은 물리적 자극의 반영일 뿐 아니라 우리의 기대와 지식이 개입하는 능동적 과정이라는 점을 알 수 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>이 \u003cb class=\"key\">지각된 \u003c/b>\u003cb class=\"key\">세계\u003c/b>의 현상학에 영향을 미친다는 주장을 제시한다. 이어서 Delk와 Fillenbaum의 실험을 \u003cb class=\"key\">근거\u003c/b>로 제시하며, 빨간색 연관 물체와 비연관 물체를 대조하여 결과를 보여 준다. 마지막 문장은 This implies로 시작하며 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 일반화한 \u003cb class=\"key\">결론\u003c/b>을 다시 진술한다. 따라서 주장을 먼저 밝히고 실험으로 뒷받침하는 \u003cb class=\"key\">두괄식\u003c/b> 구조이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (6)\u003c/b>\u003cspan>조건 통제를 드러내는 대조 신호어\u003c/span>\u003cb>found (9)\u003c/b>\u003cspan>실험 결과 제시\u003c/span>\u003cb>This implies (10)\u003c/b>\u003cspan>결론 및 일반화\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">cognitive factors influence the phenomenology of the perceived world\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">figures depicted objects associated with a particular color\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">objects that are not usually associated with red\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">red-associated objects\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the cognitive association of objects to color influences how we perceive that color\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>빨간색 연관 물체\u003c/th>\u003cth>빨간색 비연관 물체\u003c/th>\u003c/tr>\u003ctr>\u003ctd>사과, 입술, 상징적 하트 등\u003c/td>\u003ctd>버섯, 종 등\u003c/td>\u003c/tr>\u003ctr>\u003ctd>배경에 더 많은 빨강을 요구함\u003c/td>\u003ctd>상대적으로 적은 빨강으로도 일치 판단됨\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거 구조이고, 두괄식으로 볼 수 있어요. 첫 문장에서 인지적 요인이 지각된 세계의 현상학에 영향을 미친다는 주장을 제시하죠. 이어서 Delk와 Fillenbaum의 실험을 근거로 내세우고, 빨간색 연관 물체와 비연관 물체를 대조해서 결과를 보여 줘요. 마지막 문장은 This implies로 시작하며 실험 결과를 일반화한 결론을 다시 진술합니다. 그래서 주장을 먼저 밝히고 실험으로 뒷받침하는 두괄식 구조로 보는 게 자연스러워요.","hl":"ty"},{"n":9,"text":"신호어를 보면 However가 여섯 번째 문장에서 모든 형상이 같은 판지라는 조건 통제를 대조적으로 드러내요. 아홉 번째 문장의 found는 실험 결과를 이끌고, 열 번째 문장의 This implies는 결론을 일반화하는 신호예요. 같은 개념도 cognitive factors influence the phenomenology of the perceived world에서 cognitive association of objects to color influences how we perceive that color로 재진술되면서 글의 주제가 반복되고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>research\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구\u003c/span>\u003c/div>\u003cdiv>\u003cb>supports\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뒷받침하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cognitive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인지적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>influence\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>phenomenology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현상학\u003c/span>\u003c/div>\u003cdiv>\u003cb>perceived\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지각된\u003c/span>\u003c/div>\u003cdiv>\u003cb>match\u003c/b>\u003cem>동사\u003c/em>\u003cspan>맞추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>figures\u003c/b>\u003cem>명사\u003c/em>\u003cspan>형상들\u003c/span>\u003c/div>\u003cdiv>\u003cb>background\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배경\u003c/span>\u003c/div>\u003cdiv>\u003cb>depicted\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묘사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>associated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>연관된\u003c/span>\u003c/div>\u003cdiv>\u003cb>included\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>typically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>전형적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>symbolic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상징적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>presented\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>일반적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>made out of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 만들어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cardboard\u003c/b>\u003cem>명사\u003c/em>\u003cspan>판지\u003c/span>\u003c/div>\u003cdiv>\u003cb>varying\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>dark\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진한\u003c/span>\u003c/div>\u003cdiv>\u003cb>light\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>연한\u003c/span>\u003c/div>\u003cdiv>\u003cb>judged\u003c/b>\u003cem>동사\u003c/em>\u003cspan>판단하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>required\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>implies\u003c/b>\u003cem>동사\u003c/em>\u003cspan>함의하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>association\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연관성\u003c/span>\u003c/div>\u003cdiv>\u003cb>perceive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지각하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개만 짚어 볼게요. cognitive는 인지적인, influence는 영향을 미치다, perceive는 지각하다라는 뜻이에요. associated는 연관된, require는 요구하다라는 의미로 실험 결과를 이해하는 데 중요한 단어들이죠. 이 단어들은 지문의 주장과 결론을 연결하는 축이 되니까 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">influence\u003c/b>\u003cspan class=\"m\">영향을 미치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">affect\u003c/span>\u003cspan class=\"s\">impact\u003c/span>\u003cspan class=\"s\">sway\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">perceive\u003c/b>\u003cspan class=\"m\">지각하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">see\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"s\">discern\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">associate\u003c/b>\u003cspan class=\"m\">연관시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">connect\u003c/span>\u003cspan class=\"s\">link\u003c/span>\u003cspan class=\"s\">relate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">separate\u003c/span>\u003cspan class=\"a\">dissociate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">typical\u003c/b>\u003cspan class=\"m\">전형적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">usual\u003c/span>\u003cspan class=\"s\">normal\u003c/span>\u003cspan class=\"s\">standard\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unusual\u003c/span>\u003cspan class=\"a\">atypical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">require\u003c/b>\u003cspan class=\"m\">요구하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">need\u003c/span>\u003cspan class=\"s\">demand\u003c/span>\u003cspan class=\"s\">call for\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">offer\u003c/span>\u003cspan class=\"a\">provide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">imply\u003c/b>\u003cspan class=\"m\">함의하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">suggest\u003c/span>\u003cspan class=\"s\">indicate\u003c/span>\u003cspan class=\"s\">mean\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">state\u003c/span>\u003cspan class=\"a\">express\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 시험에 자주 나오는 동의어와 반의어를 정리해 볼게요. influence는 affect, impact와 바꿔 쓸 수 있고, 반의어로는 ignore, neglect가 있어요. perceive는 see, notice와 유사하고, 반의어는 overlook, miss예요. associate는 connect, link, relate와 통하고, separate, dissociate와 반대입니다. typical은 usual, normal과 비슷하고 unusual, atypical과 반대예요. require는 need, demand와 연결되고, imply는 suggest, indicate와 유사하니 함께 묶어서 기억하면 좋아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연구가 있다\u003c/span>\u003cspan class=\"en\">There is research\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 생각을 뒷받침하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">supports \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">idea\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인지적 요인들이 영향을 미친다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">cognitive \u003c/span>\u003cspan class=\"tgt\">factors \u003c/span>\u003cspan class=\"tgt\">influence\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지각된 세계의 현상학에\u003c/span>\u003cspan class=\"en\">the phenomenology of the \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">perceived \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인지적 요인들이 지각된 세계의 현상학에 영향을 미친다는 생각을 뒷받침하는 연구가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>이 \u003cb class=\"key\">지각된 \u003c/b>\u003cb class=\"key\">세계\u003c/b>에 영향을 준다는 생각을 뒷받침하는 연구가 있다고 소개합니다. 여기서 현상학(phenomenology)은 우리가 실제로 경험하는 세계의 모습을 연구하는 학문으로, 다소 추상적이지만 글 전체의 \u003cb class=\"key\">논지\u003c/b>를 미리 압축해 제시하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : research [선행사] + that [주격 관계대명사] + supports [동사] + the idea [목적어] : \"그 생각을 뒷받침하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격절을 이끄는 접속사 that\u003c/span> : the idea [선행사] + that [접속사] + cognitive factors influence ... [완전한 절] : \"인지적 요인들이 영향을 미친다는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : perceived [과거분사] + world [피수식 명사] : \"지각된 세계\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"There is research, 연구가 있다. that supports the idea, 그 생각을 뒷받침하는. that cognitive factors influence, 인지적 요인들이 영향을 미친다는. the phenomenology of the perceived world, 지각된 세계의 현상학에. 이 문장 전체를 해석하면, 인지적 요인들이 지각된 세계의 현상학에 영향을 미친다는 생각을 뒷받침하는 연구가 있다.","hl":"m"},{"n":13,"text":"이 문장은 인지적 요인이 지각된 세계에 영향을 준다는 생각을 뒷받침하는 연구가 있다고 소개하는 문장이에요. phenomenology라는 단어가 조금 어려운데, 우리가 경험하는 세계의 모습을 연구하는 학문이라고 생각하면 돼요. 글 전체의 논지를 미리 압축해서 제시하는 도입 문장이죠.","hl":"mn"},{"n":14,"text":"첫 번째 that은 선행사 research를 수식하는 주격 관계대명사 that이고, 뒤에 supports가 이어지면서 주어 역할을 해요. 두 번째 that은 앞의 idea의 내용을 설명하는 동격절 접속사 that인데, 이 that절은 주어 cognitive factors와 동사 influence를 갖춘 완전한 절이라서 관계대명사와 구분됩니다. 마지막으로 perceived world는 perceive의 과거분사 perceived가 뒤 명사 world를 수식하는 과거분사의 형용사적 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Delk와 Fillenbaum은 참가자들에게 요청했다\u003c/span>\u003cspan class=\"en\">Delk and Fillenbaum \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">asked \u003c/span>\u003cspan class=\"tgt\">participants \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">형상들의 색상을 맞추도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">match \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">color \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">figures \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들의 배경 색상과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">color \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">background\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Delk와 Fillenbaum은 참가자들에게 형상들의 색상을 배경 색상과 맞추도록 요청했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 연구자들이 참가자들에게 \u003cb class=\"key\">형상\u003c/b>의 색과 \u003cb class=\"key\">배경\u003c/b> 색을 서로 \u003cb class=\"key\">일치\u003c/b>시키도록 지시한 실험 절차를 보여줍니다. figure는 단순한 도형이 아니라 이후에 사과, 입술 같은 특정 사물을 본뜬 모양으로 제시된다는 점이 중요합니다. 따라서 이 문장은 실험 설계의 첫 단계를 소개하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">ask + 목적어 + to부정사\u003c/span> : ask [타동사] + participants [목적어] + to match [to부정사구] : \"참가자들에게 맞추도록 요청했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">match A with B\u003c/span> : match + A [the color of figures] + with + B [the color of their background] : \"형상들의 색상을 그것들의 배경 색상과 맞추다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Delk and Fillenbaum asked participants, Delk와 Fillenbaum은 참가자들에게 요청했다. to match the color of figures, 형상들의 색상을 맞추도록. with the color of their background, 그것들의 배경 색상과. 이 문장 전체를 해석하면, Delk와 Fillenbaum은 참가자들에게 형상들의 색상을 배경 색상과 맞추도록 요청했다.","hl":"m"},{"n":16,"text":"이 문장은 Delk와 Fillenbaum이 참가자들에게 형상의 색과 배경의 색을 서로 맞추도록 요청한 실험 절차를 소개해요. figure는 나중에 사과나 입술 같은 특정 사물을 본뜬 모양으로 제시되기 때문에 단순한 도형과 다르다는 점을 기억해 두면 좋아요. 실험 설계의 첫 단계를 알려주는 문장이죠.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 ask 다음에 목적어가 오고 그다음에 to부정사가 오는 구문이에요. ask는 participants를 목적어로, to match를 목적격 보어로 취해서 참가자들이 맞추도록 요청했다는 의미를 만듭니다. 두 번째 포인트는 match A with B 표현인데, 형상들의 색상을 배경 색상과 일치시키다는 뜻으로 with 뒤에 비교 대상이 나와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 형상들은\u003c/span>\u003cspan class=\"en\">Some of the figures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물체들을 묘사했다\u003c/span>\u003cspan class=\"en\">depicted objects\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정 색상과 연관된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">associated \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">particular \u003c/span>\u003cspan class=\"tgt\">color\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 형상들은 특정 색상과 연관된 물체들을 묘사했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 형상들 중 일부가 특정 색을 \u003cb class=\"key\">연상\u003c/b>시키는 사물을 그렸다는 것을 설명합니다. 사과나 입술처럼 사람들이 보통 빨간색을 떠올리는 물체가 등장한다는 의미로, 다음 문장의 구체적 예시를 이끌어 냅니다. 따라서 이 문장은 실험에 사용된 \u003cb class=\"key\">자극\u003c/b>의 성격을 규정하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(후치수식)\u003c/span> : objects [선행사] + associated [과거분사] + with a particular color [전치사구] : \"특정 색상과 연관된 물체들\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Some of the figures, 몇몇 형상들은. depicted objects, 물체들을 묘사했다. associated with a particular color, 특정 색상과 연관된. 이 문장 전체를 해석하면, 몇몇 형상들은 특정 색상과 연관된 물체들을 묘사했다.","hl":"m"},{"n":19,"text":"이 문장은 몇몇 형상들이 특정 색상과 연관된 물체를 묘사했다는 뜻이에요. 예를 들어 사과나 입술처럼 사람들이 보통 빨간색을 떠올리는 물체가 나온다는 거죠. 실험에 사용된 자극의 성격을 규정하는 문장이에요.","hl":"mn"},{"n":20,"text":"여기서 associated with a particular color는 과거분사가 앞의 objects를 뒤에서 수식하는 후치수식이에요. associate A with B가 수동태로 쓰여서 특정 색상과 연관된 물체들이라는 의미를 만들어요. 즉 objects를 꾸며 주는 형용사 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 포함했다\u003c/span>\u003cspan class=\"en\">These included\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전형적인 빨간색 물체를\u003c/span>\u003cspan class=\"en\">typically red objects\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사과, 입술, 상징적인 하트\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">apple, \u003c/span>\u003cspan class=\"tgt\">lips, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">symbolic \u003c/span>\u003cspan class=\"tgt\">heart\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 사과, 입술, 상징적인 하트 모양과 같이 전형적인 빨간색 물체를 포함했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 말한 색과 연관된 사물의 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 제시해요. 사과, 입술, 상징적인 하트처럼 누구나 \u003cb class=\"key\">빨간색\u003c/b>을 떠올리는 전형적인 물체들이에요. symbolic heart는 실제 심장이 아니라 하트 모양의 상징을 뜻한다는 점도 함께 이해해 두세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">such as를 이용한 예시와 A, B, and C 병렬 구조\u003c/span> : such as + [예시 명사구 A], [B], and [C] : \"사과, 입술, 그리고 상징적인 하트와 같은\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"These included, 그것들은 포함했다. typically red objects, 전형적인 빨간색 물체를. such as, ~와 같은. an apple, lips, and a symbolic heart, 사과, 입술, 상징적인 하트. 이 문장 전체를 해석하면, 그것들은 사과, 입술, 상징적인 하트 모양과 같이 전형적인 빨간색 물체를 포함했다.","hl":"m"},{"n":22,"text":"이 문장은 앞 문장에서 말한 색과 연관된 사물의 구체적 예시를 제시해요. 사과, 입술, 상징적인 하트처럼 누구나 빨간색을 떠올리는 전형적인 물체들이에요. symbolic heart는 실제 심장이 아니라 하트 모양의 상징을 뜻한다는 점도 함께 이해해 두세요.","hl":"mn"},{"n":23,"text":"이 문장에는 such as 다음에 사과, 입술, 상징적인 하트가 나열되어 있어요. such as는 예시를 소개할 때 쓰는 표현이고, 세 개처럼 여러 개를 나열할 때는 마지막 앞에 and를 두는 병렬 구조를 취해요. such as an apple, lips, and a symbolic heart를 하나의 덩어리로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 물체들이 제시되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Other \u003c/span>\u003cspan class=\"tgt\">objects \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">presented\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간색과 일반적으로 연관되지 않는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">usually \u003c/span>\u003cspan class=\"tgt\">associated \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">red\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">버섯이나 종과 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">mushroom \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">bell\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">버섯이나 종과 같이 빨간색과 일반적으로 연관이 되지 않는 다른 물체들도 제시되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 빨간색과 일반적으로 연관되지 않는 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">물체들\u003c/b>도 실험에 사용되었음을 알려줘요. 버섯이나 종처럼 \u003cb class=\"key\">빨간색 \u003c/b>\u003cb class=\"key\">비연상\u003c/b> 조건을 만드는 물체들로, 앞 문장의 빨간색 연상 물체와 대비되는 역할을 해요. 실험 자극에서 두 집단을 나누는 기준이 된다는 점을 기억하세요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be p.p.)\u003c/span> : [주어 Other objects] + [be동사 were] + [p.p. presented] : \"다른 물체들이 제시되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that절과 선행사의 분리\u003c/span> : [선행사 Other objects] + [동사 were presented] + [주격 관계대명사 that + be + p.p. + 전치사구] : \"그것들은 빨간색과 일반적으로 연관되지 않는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">such as 예시 표현\u003c/span> : such as + [예시 명사구] + or + [예시 명사구] : \"버섯이나 종과 같은\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Other objects were presented, 다른 물체들이 제시되었다. that are not usually associated with red, 빨간색과 일반적으로 연관되지 않는. such as a mushroom or a bell, 버섯이나 종과 같은. 이 문장 전체를 해석하면, 버섯이나 종과 같이 빨간색과 일반적으로 연관이 되지 않는 다른 물체들도 제시되었다.","hl":"m"},{"n":25,"text":"이 문장은 빨간색과 일반적으로 연관되지 않는 다른 물체들도 실험에 사용되었다는 뜻이에요. 버섯이나 종이 그 예인데, 앞 문장에 나온 빨간색 연상 물체와 대비되는 빨간색 비연상 조건을 만들어요. 이렇게 두 부류의 물체를 비교하는 실험 설계라는 점을 기억해 두세요.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 수동태입니다. Other objects were presented에서 물체들은 스스로 제시하는 것이 아니라 제시되는 대상이므로 be p.p. 형태의 수동태가 쓰였어요. 두 번째 포인트는 뒤에 떨어진 that절이에요. that are not usually associated with red는 사실 주어인 Other objects를 수식하는 주격 관계대명사절인데 동사 were presented 뒤로 분리되어 있어요. 이걸 분리 후치 수식이라고 해요. 세 번째 포인트는 such as 예시 표현입니다. such as a mushroom or a bell처럼 예시를 나열할 때 such as를 쓰고 두 개는 or로 연결한다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 형상들은\u003c/span>\u003cspan class=\"en\">all the figures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~로 만들어졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동일한 다홍색 판지로\u003c/span>\u003cspan class=\"en\">the same red-orange cardboard.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나, 모든 형상들은 동일한 다홍색 판지로 만들어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 모든 형상이 실제로는 같은 \u003cb class=\"key\">다홍색\u003c/b> 판지로 만들어졌다는 사실을 강조해요. 빨간색 연상 물체와 비연상 물체의 겉보기 색이 사실상 같았다는 점을 보여 주는 \u003cb class=\"key\">통제 \u003c/b>\u003cb class=\"key\">조건\u003c/b>이에요. 앞 문장들의 분류와 However로 대비되면서 뒤의 인식 차이를 설명하는 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 However\u003c/span> : However + [절] : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (be made out of)\u003c/span> : [주어 all the figures] + [be동사 were] + [made out of] + [재료 the same red-orange cardboard] : \"~로 만들어지다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"However, 그러나. all the figures, 모든 형상들은. were made out of, ~로 만들어졌다. the same red-orange cardboard, 동일한 다홍색 판지로. 이 문장 전체를 해석하면, 그러나, 모든 형상들은 동일한 다홍색 판지로 만들어졌다.","hl":"m"},{"n":28,"text":"이 문장은 모든 형상이 실제로는 같은 다홍색 판지로 만들어졌다는 사실을 강조해요. 빨간색 연상 물체와 빨간색 비연상 물체의 겉보기 색이 사실상 같았다는 거예요. 이 문장은 실험의 통제 조건이에요. 그래서 뒤에서 색 판단이 달라진 이유를 물체가 가진 색 연상에서 찾도록 이끄는 중요한 문장이에요.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 However입니다. 접속부사로 앞 문장과 대조를 만들면서 같은 색이라는 중요한 조건을 소개해요. 두 번째 포인트는 were made out of에요. be made out of는 어떤 재료로 만들어졌는지를 나타내는 표현이고, 여기서는 모든 형상이 같은 재료인 다홍색 판지로 만들어졌다는 사실을 드러내요. 이 표현은 수동태 형태로 쓰인다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 참가자들은 맞춰야 했다\u003c/span>\u003cspan class=\"en\">Participants then \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">match\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 형상을\u003c/span>\u003cspan class=\"en\">the figure\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배경색과\u003c/span>\u003cspan class=\"en\">to a background\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진한 빨간색에서 연한 빨간색까지 다양한.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">varying \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">dark \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">light \u003c/span>\u003cspan class=\"tgt\">red\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러고 나서 참가자들은 그 형상을 진한 빨간색에서 연한 빨간색까지 다양한 배경색과 맞춰야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 실험 절차의 후반부로, 참가자들이 형상 색을 \u003cb class=\"key\">배경색\u003c/b>에 대응시키는 과제를 했음을 설명합니다. 배경색은 진한 빨간색에서 연한 빨간색까지 \u003cb class=\"key\">색상 \u003c/b>\u003cb class=\"key\">범위\u003c/b>를 가졌고, 참가자들은 그 범위 안에서 형상 색과 일치한다고 판단되는 배경을 선택했습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have to + 동사원형 (과거형 had to)\u003c/span> : had to + match(동사원형) : \"맞춰야 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구 (형용사적 용법)\u003c/span> : a background [varying from dark to light red] : \"진한 빨간색에서 연한 빨간색까지 다양한\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Participants then had to match, 그러고 나서 참가자들은 맞춰야 했다. the figure, 그 형상을. to a background, 배경색과. varying from dark to light red, 진한 빨간색에서 연한 빨간색까지 다양한.. 이 문장 전체를 해석하면, 그러고 나서 참가자들은 그 형상을 진한 빨간색에서 연한 빨간색까지 다양한 배경색과 맞춰야 했다.","hl":"m"},{"n":31,"text":"이 문장은 실험 절차의 후반부로, 참가자들이 형상 색을 배경색에 대응시키는 과제를 했음을 설명합니다. 배경색은 진한 빨간색에서 연한 빨간색까지 색상 범위를 가졌고, 참가자들은 그 범위 안에서 형상 색과 일치한다고 판단되는 배경을 선택했습니다.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 had to match입니다. have to는 의무나 필요를 나타내는 조동사구인데, 여기서는 과거 시제로 had to를 쓰고 뒤에 동사원형 match가 왔습니다. 두 번째 포인트는 varying from dark to light red입니다. 이 현재분사구는 앞에 있는 명사 background를 꾸며 주는데, 능동의 의미를 가지면서 진한 빨간색에서 연한 빨간색까지 다양하다는 뜻입니다. 관계대명사와 be동사가 생략된 분사구로 볼 수 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 해야 했다\u003c/span>\u003cspan class=\"en\">They had to \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배경색이 일치하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">background \u003c/span>\u003cspan class=\"tgt\">color \u003c/span>\u003cspan class=\"tgt\">match\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">형상들의 색과.\u003c/span>\u003cspan class=\"en\">the color of the figures.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 배경색이 형상들의 색과 일치하게 해야 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 바로 앞 문장의 과제를 더 구체적으로 설명합니다. 참가자들이 형상을 고르는 것이 아니라 \u003cb class=\"key\">배경색\u003c/b>을 조정하여 형상들의 색과 일치시키는 방향임을 분명히 합니다. \u003cb class=\"key\">사역동사 \u003c/b>\u003cb class=\"key\">make\u003c/b>가 쓰여 목적어와 목적격 보어의 관계로 과제 행동을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 동사원형\u003c/span> : make + [the background color] + [match (동사원형)] : \"배경색이 일치하게 하다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"They had to make, 그들은 해야 했다. the background color match, 배경색이 일치하도록. the color of the figures, 형상들의 색과.. 이 문장 전체를 해석하면, 그들은 배경색이 형상들의 색과 일치하게 해야 했다.","hl":"m"},{"n":34,"text":"이 문장은 바로 앞 문장의 과제를 더 구체적으로 설명합니다. 참가자들이 형상을 고르는 것이 아니라 배경색을 조정하여 형상들의 색과 일치시키는 방향임을 분명히 합니다. 사역동사 make가 쓰여 목적어와 목적격 보어의 관계로 과제 행동을 보여 줍니다.","hl":"mn"},{"n":35,"text":"이 문장의 핵심 어법은 make the background color match입니다. make는 사역동사이므로 목적어 the background color 다음에 목적격 보어로 동사원형 match를 씁니다. 배경색이 형상들의 색과 일치하도록 만드는 행위를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연구자들은 발견했다\u003c/span>\u003cspan class=\"en\">The researchers found\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간색과 연관된 물체들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">red-associated \u003c/span>\u003cspan class=\"tgt\">objects \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 빨간색을 요구했다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">required \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">red\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배경에서\u003c/span>\u003cspan class=\"en\">in the background\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일치한다고 판단되기 위해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">judged \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">match\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 물체들이 그러한 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">objects\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빨간색과 연관되지 않은.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">associated \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">color \u003c/span>\u003cspan class=\"tgt\">red\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">연구자들은 빨간색과 연관된 물체들이 빨간색과 연관이 없는 물체가 그러한 것보다 배경과 일치한다고 판단되기 위해서 배경에서 더 빨간 색을 요구한다는 것을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 실험의 핵심 결과입니다. 빨간색과 개념적으로 연관된 사물은 그렇지 않은 사물보다 배경에 더 많은 빨간색이 있어야 \u003cb class=\"key\">일치 \u003c/b>\u003cb class=\"key\">판단\u003c/b>을 받았습니다. 이는 사물에 대한 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">연상\u003c/b>이 \u003cb class=\"key\">색 \u003c/b>\u003cb class=\"key\">지각\u003c/b>에 영향을 준다는 주장을 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that (명사절 목적어)\u003c/span> : found + [that + 주어(red-associated objects) + 동사(required)] : \"빨간색과 연관된 물체들이 더 많은 빨간색을 요구했다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적) + 수동태\u003c/span> : required more red [to be judged a match] : \"일치한다고 판단되기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교구문에서의 도치 (조동사 did + 주어)\u003c/span> : than + did(조동사) + the objects(주어) : \"그 물체들이 그러한 것보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : the objects [that are not associated with the color red] : \"빨간색과 연관되지 않은 물체들\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The researchers found, 연구자들은 발견했다. that red-associated objects, 빨간색과 연관된 물체들이. required more red, 더 많은 빨간색을 요구했다는 것을. in the background, 배경에서. to be judged a match, 일치한다고 판단되기 위해서. than did the objects, 그 물체들이 그러한 것보다. that are not associated with the color red, 빨간색과 연관되지 않은.. 이 문장 전체를 해석하면, 연구자들은 빨간색과 연관된 물체들이 빨간색과 연관이 없는 물체가 그러한 것보다 배경과 일치한다고 판단되기 위해서 배경에서 더 빨간 색을 요구한다는 것을 발견했다.","hl":"m"},{"n":37,"text":"이 문장은 실험의 핵심 결과입니다. 빨간색과 개념적으로 연관된 사물은 그렇지 않은 사물보다 배경에 더 많은 빨간색이 있어야 일치 판단을 받았습니다. 이는 사물에 대한 인지적 연상이 색 지각에 영향을 준다는 주장을 뒷받침합니다.","hl":"mn"},{"n":38,"text":"첫 번째 포인트는 found 뒤에 오는 that절입니다. 이 that절은 명사절로 found의 목적어 역할을 하며, 빨간색과 연관된 물체들이 더 많은 빨간색을 요구했다는 내용을 전달합니다. 두 번째 포인트는 to be judged a match입니다. 이 to부정사는 목적의 의미를 나타내고, 판단을 받는 수동의 의미라서 to be judged로 썼습니다. 세 번째 포인트는 than did the objects입니다. 비교절에서 주어 the objects와 동사 did가 도치된 형태인데, 원래 순서는 than the objects did입니다. 네 번째 포인트는 that are not associated with the color red입니다. 이 that은 주격 관계대명사로 선행사 the objects를 수식하고, are associated with가 수동태로 쓰여 빨간색과 연관되지 않은 이라는 뜻입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 함의한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">implies\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물체와 색의 인지적 연관성이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cognitive \u003c/span>\u003cspan class=\"tgt\">association \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">objects \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">color \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영향을 미친다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">influences\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 어떻게 지각하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">perceive \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 색을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">color\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 색과 물체의 인지적 연관성이 우리가 그 색을 어떻게 지각하는가에 영향을 미친다는 것을 함의한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 실험 결과를 바탕으로 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">연관성\u003c/b>이 \u003cb class=\"key\">색 \u003c/b>\u003cb class=\"key\">지각\u003c/b>에 영향을 미친다는 결론을 내리는 문장입니다. 'This'는 앞선 실험 내용 전체를 가리키며, 'implies that'은 '~라는 것을 \u003cb class=\"key\">함의\u003c/b>한다'로 해석됩니다. 곧, 사물과 색을 연결하는 기억과 개념이 우리가 그 색을 실제보다 다르게 보이도록 만든다는 것입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사 This와 동사 implies\u003c/span> : This + implies + [that절] : \"이것은 ~을 함의한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that절 목적어 (주어-동사 수일치)\u003c/span> : that + [단수 주어 + 단수 동사] + ... : \"물체와 색의 인지적 연관성이 영향을 미친다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사 how가 이끄는 명사절)\u003c/span> : influence + [how + 주어 + 동사] : \"우리가 그 색을 어떻게 지각하는지에\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"This implies, 이것은 함의한다. that, ~라는 것을. the cognitive association of objects to color, 물체와 색의 인지적 연관성이. influences, 영향을 미친다. how we perceive, 우리가 어떻게 지각하는지. that color, 그 색을. 이 문장 전체를 해석하면, 이것은 색과 물체의 인지적 연관성이 우리가 그 색을 어떻게 지각하는가에 영향을 미친다는 것을 함의한다.","hl":"m"},{"n":40,"text":"이 문장은 앞 실험 결과를 정리하면서 물체와 색의 인지적 연관성이 색을 지각하는 방식에 영향을 미친다는 결론을 내리는 문장이에요. This는 앞 문장의 실험 내용 전체를 가리키고, implies that은 이 내용이 어떤 점을 시사하는지 보여 줘요. 즉, 사물이 색과 연결되어 있다는 우리의 기억이 그 색을 실제보다 더 진하게 또는 다르게 보이게 만든다는 의미예요.","hl":"mn"},{"n":41,"text":"어법 포인트를 짚어 볼게요. 첫 번째, This implies에서 This는 앞선 실험 결과 전체를 가리키는 지시대명사예요. implies는 타동사라서 뒤에 목적어로 that절이 나와요. 두 번째, that the cognitive association of objects to color influences에서 that절은 implies의 목적어로 쓰인 명사절이에요. 절 안의 주어가 the cognitive association이라는 단수 명사라서 동사 influences에 s가 붙어 수일치가 이루어졌어요. 세 번째, how we perceive that color는 의문사 how가 이끄는 명사절이에요. 간접의문문 어순이라서 how we perceive처럼 의문사 다음에 주어 we와 동사 perceive가 오는 평서문 어순을 지켜요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Delk와 Fillenbaum의 실험은 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>이 \u003cb class=\"key\">지각된 \u003c/b>\u003cb class=\"key\">세계\u003c/b>의 현상학에 영향을 미친다는 주장을 뒷받침한다.\u003c/li>\u003cli>실험에서는 사과, 입술, 상징적 하트 같은 \u003cb class=\"key\">빨간색 \u003c/b>\u003cb class=\"key\">연관 \u003c/b>\u003cb class=\"key\">물체\u003c/b>와 버섯, 종 같은 \u003cb class=\"key\">빨간색 \u003c/b>\u003cb class=\"key\">비연관 \u003c/b>\u003cb class=\"key\">물체\u003c/b>를 모두 \u003cb class=\"key\">동일한 \u003c/b>\u003cb class=\"key\">다홍색 \u003c/b>\u003cb class=\"key\">판지\u003c/b>로 제시했다.\u003c/li>\u003cli>참가자들이 배경색을 맞추었을 때 \u003cb class=\"key\">빨간색 \u003c/b>\u003cb class=\"key\">연관 \u003c/b>\u003cb class=\"key\">물체\u003c/b>는 일치 판단을 위해 배경에 더 많은 \u003cb class=\"key\">빨강\u003c/b>을 요구했다.\u003c/li>\u003cli>이 결과는 물체와 색의 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">연관성\u003c/b>이 우리가 색을 \u003cb class=\"key\">지각\u003c/b>하는 방식에 영향을 미친다는 것을 \u003cb class=\"key\">함의\u003c/b>한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Cognitive associations between objects and colors influence how we perceive color.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Delk와 Fillenbaum의 실험은 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">요인\u003c/b>이 \u003cb class=\"key\">지각된 \u003c/b>\u003cb class=\"key\">세계\u003c/b>에 영향을 미친다는 생각을 뒷받침한다. 같은 다홍색 판지라도 \u003cb class=\"key\">빨간색 \u003c/b>\u003cb class=\"key\">연관 \u003c/b>\u003cb class=\"key\">물체\u003c/b>는 배경에 더 많은 빨강을 요구하여, \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">연상\u003c/b>이 \u003cb class=\"key\">색 \u003c/b>\u003cb class=\"key\">지각\u003c/b>을 바꾼다는 것을 보여 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 정리해 볼게요. 이 글은 인지적 요인이 지각에 영향을 미친다는 주장을 Delk와 Fillenbaum의 색 대응 실험으로 뒷받침했어요. 핵심은 같은 색이라도 사물과 색의 인지적 연관성 때문에 우리 눈에는 다르게 보일 수 있다는 점이에요. 주장과 근거의 두괄식 구조, 그리고 대조되는 실험 조건을 잘 잡아 두면 문제 풀이에 큰 도움이 될 거예요. 오늘 수고 많았어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
