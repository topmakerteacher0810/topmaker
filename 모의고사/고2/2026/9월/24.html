lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 24번","audioDir":"24_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">24번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>The Upgrade Cycle: Sowing Doubt and Shaping Desire\u003c/h1>\u003ch2>업그레이드 순환: 의심을 심고 욕구를 형성하다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>생산자들은 \u003cb class=\"key\">현재 \u003c/b>\u003cb class=\"key\">기기의 \u003c/b>\u003cb class=\"key\">적절성\u003c/b>에 대한 의심의 씨앗을 뿌려 \u003cb class=\"key\">업그레이드 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>를 부추기고, 이 순환이 \u003cb class=\"key\">소비자 \u003c/b>\u003cb class=\"key\">전자기기\u003c/b> 전반으로 번지면서 \u003cb class=\"key\">원하는 \u003c/b>\u003cb class=\"key\">것과 \u003c/b>\u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">것\u003c/b>의 경계를 흐려 \u003cb class=\"key\">최신 \u003c/b>\u003cb class=\"key\">트렌드\u003c/b>를 따르게 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Manufacturers sow doubt about our current devices, blurring the line between want and need to drive ceaseless upgrading.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 지문은 생산자가 우리에게 업그레이드 욕구를 심어 주는 과정을 다루고 있어요. 요약하면 생산자가 현재 기기에 대한 의심의 씨앗을 뿌려서 원하는 것과 필요한 것의 경계를 흐리고 끊임없는 업그레이드로 이끈다는 내용이에요. 핵심 요지는 Manufacturers sow doubt about our current devices, blurring the line between want and need to drive ceaseless upgrading. 이렇게 잡으면 됩니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">여러분은 스마트폰을 한 번 사면 몇 년은 쓸 수 있는데도 새 모델이 나올 때마다 왜 마음이 흔들리는지 생각해 본 적 있나요? 현대 소비사회에서 기업들은 제품의 수명을 실제보다 짧게 느끼게 만드는 \u003cb class=\"key\">계획적 \u003c/b>\u003cb class=\"key\">구식화\u003c/b>(planned obsolescence) 전략을 사용합니다. 여기에 새 기능에 대한 기대 심리가 더해져 \u003cb class=\"key\">업그레이드 \u003c/b>\u003cb class=\"key\">순환\u003c/b>(upgrade cycle)이 만들어져요. 이는 단순한 광고가 아니라 우리의 \u003cb class=\"key\">욕구\u003c/b>를 자극하는 구조예요. 옷장에 옷이 많은데도 새 계절이 되면 또 옷을 사고 싶은 마음과 비슷합니다. 지문에서 말하는 이 순환은 \u003cb class=\"key\">소비자 \u003c/b>\u003cb class=\"key\">전자기기\u003c/b> 전반으로 번져 나가는 모습으로 나타나요.\u003c/div>","segs":[{"n":2,"text":"여러분, 새 휴대폰이 나올 때마다 왜 마음이 흔들리는지 생각해 본 적 있죠? 현대 소비사회에는 계획적 구식화라는 개념이 있어요. 영어로는 planned obsolescence라고 하는데, 제품이 실제 수명보다 빨리 낡은 것처럼 느껴지게 만드는 전략이에요. 여기에 새 기능에 대한 기대 심리가 더해져서 업그레이드 순환, upgrade cycle이 만들어져요. 옷장에 옷이 많은데도 새 계절이 되면 또 사고 싶은 것과 비슷한 심리예요. 지문은 이런 구조가 소비자 전자기기 전반에 퍼져 있다고 말하고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>의심 심기\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>생산자는 노련하게 현재 기기에 대한 \u003cb class=\"key\">의심의 \u003c/b>\u003cb class=\"key\">씨앗\u003c/b>을 심어요. 그러면 일 년 전만 해도 \u003cb class=\"key\">목숨줄\u003c/b> 같았던 휴대폰이 갑자기 \u003cb class=\"key\">시대에 \u003c/b>\u003cb class=\"key\">뒤떨어진\u003c/b> 물건으로 느껴지게 되죠. 디지털 수요를 따라가지 못한다는 느낌이 핵심입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>욕구의 시작과 확산\u003csmall>전환 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>진짜 필요가 있기 전에 \u003cb class=\"key\">업그레이드 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>가 시작된다고 지문은 말해요. 이 순환은 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">용품\u003c/b>에만 국한되지 않고 \u003cb class=\"key\">자율 \u003c/b>\u003cb class=\"key\">주행 \u003c/b>\u003cb class=\"key\">자동차\u003c/b>부터 \u003cb class=\"key\">스마트 \u003c/b>\u003cb class=\"key\">냉장고\u003c/b>까지 번져 나갑니다. 소비자 전자기기의 거의 모든 영역으로 확산되는 거예요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>욕구 형성의 본질\u003csmall>주장 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>모든 제품은 \u003cb class=\"key\">다음 \u003c/b>\u003cb class=\"key\">세대\u003c/b>를 향해 멈출 수 없는 행진을 하며 혁명을 약속해요. 핵심은 우리가 최신 기기를 원하는 게 아니라 \u003cb class=\"key\">필요하다고 \u003c/b>\u003cb class=\"key\">믿도록\u003c/b> 이끌린다는 점이에요. 그 결과 \u003cb class=\"key\">원하는 \u003c/b>\u003cb class=\"key\">것과 \u003c/b>\u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">것\u003c/b>의 구분이 흐려지고 재정적 우선순위가 바뀌죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>유혹의 지속\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>끊임없는 업그레이드에 반대하는 논리적인 논쟁에도 불구하고 그 \u003cb class=\"key\">매력\u003c/b>은 여전히 강력해요. 이렇게 \u003cb class=\"key\">끊임없는 \u003c/b>\u003cb class=\"key\">업그레이드\u003c/b>의 유혹은 쉽게 사라지지 않는다고 정리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 의심 심기예요. 생산자는 노련하게 현재 기기의 적절성에 대한 의심의 씨앗을 뿌려요. 그러면 일 년 전만 해도 목숨줄 같았던 휴대폰이 갑자기 시대에 뒤떨어진 물건으로 느껴지게 되죠. 디지털 수요를 따라가지 못한다는 느낌이 핵심이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 욕구의 시작과 확산이에요. 진짜 필요가 있기 전에 업그레이드에 대한 욕구가 시작된다고 지문은 말해요. 이 순환은 디지털 용품에만 국한되지 않고 자율 주행 자동차부터 스마트 냉장고까지 소비자 전자기기 거의 모든 영역으로 번져 나가요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 욕구 형성의 본질이에요. 모든 제품은 다음 세대를 향해 멈출 수 없는 행진을 하고, 우리 삶에 혁명을 일으키겠다고 약속해요. 그런데 흥미롭고도 당황스러운 점은 우리가 최신 기기를 원하는 게 아니라 필요하다고 믿도록 이끌린다는 거예요. 그래서 원하는 것과 필요한 것의 구분이 흐려지고 재정적 우선순위까지 바뀌죠.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 유혹의 지속이에요. 끊임없는 업그레이드에 반대하는 논리적인 주장이 많은데도, 그 매력은 여전히 강력하다고 정리하고 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 처음에 생산자가 \u003cb class=\"key\">의심의 \u003c/b>\u003cb class=\"key\">씨앗\u003c/b>을 심어 \u003cb class=\"key\">업그레이드 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>를 만드는 현상을 제시하고, 중간의 여덟 번째 문장에서 핵심 주장이 나와요. 그 뒤로 재정적 우선순위와 \u003cb class=\"key\">끊임없는 \u003c/b>\u003cb class=\"key\">업그레이드\u003c/b>의 유혹이라는 결과를 덧붙여 주장을 강화합니다. 그래서 주제문이 중간에 있는 \u003cb class=\"key\">중괄식\u003c/b> 구조로 볼 수 있어요. 앞뒤가 모두 주제문을 설명하는 역할을 하죠.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>And thus (3)\u003c/b>\u003cspan>결과·전환\u003c/span>\u003cb>What's fascinating, or perhaps disturbing (7)\u003c/b>\u003cspan>평가·전환\u003c/span>\u003cb>not so much that...;... (8)\u003c/b>\u003cspan>대조·강조\u003c/span>\u003cb>For all (10)\u003c/b>\u003cspan>양보·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">our current devices\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your lifeline a year ago\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">museum piece\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">digital companions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">consumer electronics\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">next version, next generation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">newest device\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">staying current with trends\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ceaseless upgrading\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>want (원하는 것)\u003c/th>\u003cth>need (필요한 것)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>감정적 끌림에서 비롯됨\u003c/td>\u003ctd>실제 필수 조건에서 비롯됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>최신 기기에 대한 소유욕\u003c/td>\u003ctd>기존 기능의 충분성\u003c/td>\u003c/tr>\u003ctr>\u003ctd>이 순환에서 우선순위를 지배\u003c/td>\u003ctd>논리로는 구분되지만 흐려짐\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거 방식으로 전개되면서도, 핵심 주장이 중간에 나오는 중괄식 구조예요. 앞부분은 의심을 심고 욕구가 시작되는 예시와 현상을 제시하고, 여덟 번째 문장에서 핵심 주장이 나와요. 그 뒤로 재정 우선순위와 유혹이라는 결과를 덧붙여서 주장을 강화하고 있죠. 그래서 중간 문장을 중심으로 앞뒤를 연결하면 글이 훨씬 잘 읽혀요.","hl":"ty"},{"n":9,"text":"신호어를 볼까요? And thus는 그 결과로 이어지는 전환을 보여 주고, What's fascinating, or perhaps disturbing은 평가와 전환을 나타내요. not so much that A but B 구조는 앞의 내용을 부정하고 뒤의 내용을 강조하는 대조 신호예요. For all은 양보의 뜻으로 마지막 결론을 이끌어요. 이 신호어들을 따라가면 흐름을 놓치지 않아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>masterfully\u003c/b>\u003cem>부사\u003c/em>\u003cspan>능숙하게, 노련하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>sow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(씨앗을) 뿌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>seeds of doubt\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>의심의 씨앗\u003c/span>\u003c/div>\u003cdiv>\u003cb>adequacy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>적절성, 충분함\u003c/span>\u003c/div>\u003cdiv>\u003cb>device\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기기, 장치\u003c/span>\u003c/div>\u003cdiv>\u003cb>lifeline\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생명줄, 필수품\u003c/span>\u003c/div>\u003cdiv>\u003cb>museum piece\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시대에 뒤떨어진 물건\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep pace with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 보조를 맞추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>digital demands\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디지털 수요\u003c/span>\u003c/div>\u003cdiv>\u003cb>itch\u003c/b>\u003cem>명사\u003c/em>\u003cspan>욕구, 가려움\u003c/span>\u003c/div>\u003cdiv>\u003cb>upgrade\u003c/b>\u003cem>동사\u003c/em>\u003cspan>업그레이드하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>genuine\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진정한, 진짜의\u003c/span>\u003c/div>\u003cdiv>\u003cb>cycle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>순환, 주기\u003c/span>\u003c/div>\u003cdiv>\u003cb>be confined to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 국한되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>consumer electronics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소비자 전자기기\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-driving car\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자율 주행 자동차\u003c/span>\u003c/div>\u003cdiv>\u003cb>smart fridge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스마트 냉장고\u003c/span>\u003c/div>\u003cdiv>\u003cb>unstoppable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>멈출 수 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb> /div>\u003c/div>","segs":[{"n":11,"text":"이제 시험에 자주 나오는 어휘의 동의어와 반의어를 정리할게요. genuine은 진정한이라는 뜻으로 real, authentic와 바꿔 쓸 수 있고, 반대는 fake나 false예요. desire는 욕구라는 뜻으로 want, craving과 유사하고, aversion이나 indifference가 반대 개념이에요. blur는 흐려지다는 뜻으로 obscure, dim과 통하고, clarify나 sharpen이 반대예요. ceaseless는 끊임없는이라는 뜻으로 endless, constant와 유사하고 intermittent, temporary가 반대예요. compelling은 강력한이라는 뜻으로 convincing, persuasive와 유사하고 weak, unconvincing이 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생산자들은 노련하게 의심의 씨앗을 뿌린다\u003c/span>\u003cspan class=\"en\">Manufacturers masterfully \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sow \u003c/span>\u003cspan class=\"tgt\">seeds \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">doubt\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적절성에 대해\u003c/span>\u003cspan class=\"en\">about \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">adequacy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 현재 기기들의.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">current \u003c/span>\u003cspan class=\"tgt\">devices\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">생산자들은 노련하게 우리의 현재 기기들의 적절성에 대한 의심의 씨앗을 뿌린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 도입부로, \u003cb class=\"key\">생산자들이 \u003c/b>\u003cb class=\"key\">의도적으로 \u003c/b>\u003cb class=\"key\">소비자의 \u003c/b>\u003cb class=\"key\">불안감\u003c/b>을 만든다는 핵심 주장을 제시합니다. 씨앗을 뿌린다는 \u003cb class=\"key\">비유적 \u003c/b>\u003cb class=\"key\">표현\u003c/b>을 통해 의심이 점점 자라나도록 조장한다는 느낌을 줍니다. 뒤에 이어질 휴대폰 예시의 배경을 깔아 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 (비유적 표현)\u003c/span> : sow seeds of [추상명사] : \"의심의 씨앗을 뿌리다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : the adequacy + of + [명사구] : \"우리 현재 기기들의 적절성\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Manufacturers masterfully sow seeds of doubt, 생산자들은 노련하게 의심의 씨앗을 뿌린다. about the adequacy, 적절성에 대해. of our current devices, 우리의 현재 기기들의.. 이 문장 전체를 해석하면, 생산자들은 노련하게 우리의 현재 기기들의 적절성에 대한 의심의 씨앗을 뿌린다.","hl":"m"},{"n":13,"text":"첫 문장은 제조사들이 우리가 쓰는 기기에 대해 일부러 의심을 심는다는 주장을 하고 있어요. 씨앗을 뿌린다는 표현은 의심이 마음속에서 점점 자라도록 만든다는 비유적 표현이에요. 이 문장은 뒤에 나올 휴대폰 예시의 원인을 제시하는 도입부 역할을 하죠.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 sow seeds of doubt라는 표현입니다. 문자 그대로 씨앗을 심는 게 아니라 의심을 퍼뜨린다는 비유적 표현이에요. 두 번째 포인트는 the adequacy of our current devices 부분인데요, of our current devices가 앞의 adequacy를 뒤에서 수식해서 우리의 현재 기기들의 적절성이라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑자기, 그 휴대폰은\u003c/span>\u003cspan class=\"en\">Suddenly, the phone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일 년 전에는 당신의 목숨줄이었던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">lifeline \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">year \u003c/span>\u003cspan class=\"tgt\">ago\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제는 시대에 뒤떨어진 것이고\u003c/span>\u003cspan class=\"en\">is now a museum piece,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 디지털 수요를 따라가지 못하는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">unable \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">keep \u003c/span>\u003cspan class=\"tgt\">pace \u003c/span>\u003cspan class=\"tgt\">with\u003c/span> your digital demands.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">갑자기, 1년 전의 당신의 목숨줄이었던 휴대폰이 지금은 당신의 디지털 수요를 따라가지 못하는, 시대에 뒤떨어진 것이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 첫 문장의 주장을 뒷받침하는 구체적 예시로, 일 년 전에는 없어서는 안 될 존재였던 휴대폰이 이제는 한물간 물건처럼 여겨진다는 \u003cb class=\"key\">인식의 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 보여 줍니다. 여기서 lifeline과 museum piece의 \u003cb class=\"key\">대비\u003c/b>가 소비자의 체감 가치가 급격히 떨어지는 느낌을 강조합니다. 디지털 수요를 따라가지 못한다는 표현이 새 기기에 대한 욕구를 자연스럽게 이끌어 내는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 + that + was + 보어 : \"일 년 전에 당신의 목숨줄이었던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (형용사 수식)\u003c/span> : unable + to keep pace : \"보조를 맞출 수 없는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">숙어\u003c/span> : keep pace with + [명사구] : \"~와 보조를 맞추다, ~를 따라가다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Suddenly, the phone, 갑자기, 그 휴대폰은. that was your lifeline a year ago, 일 년 전에는 당신의 목숨줄이었던. is now a museum piece, 이제는 시대에 뒤떨어진 것이고. unable to keep pace with your digital demands, 당신의 디지털 수요를 따라가지 못하는.. 이 문장 전체를 해석하면, 갑자기, 1년 전의 당신의 목숨줄이었던 휴대폰이 지금은 당신의 디지털 수요를 따라가지 못하는, 시대에 뒤떨어진 것이 되었다.","hl":"m"},{"n":16,"text":"두 번째 문장은 일 년 전만 해도 목숨줄 같았던 휴대폰이 이제는 박물관 전시품처럼 한물간 물건으로 느껴진다는 이야기예요. 목숨줄과 박물관 전시품의 대비를 통해 제조사가 만든 의심이 소비자의 인식을 이렇게 바꿔 놓는다는 걸 보여 줘요. 디지털 수요를 따라가지 못한다는 말이 곧 새 기기에 대한 욕구로 이어지게 되는 거죠.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 that was your lifeline a year ago 부분에서 that이에요. 이 that은 앞의 the phone을 수식하는 주격 관계대명사이고, 절 안에서 주어 역할을 합니다. 두 번째 포인트는 unable to keep pace에서 to keep pace인데요, to부정사가 형용사 unable을 수식하는 부사적 용법으로 쓰였어요. 세 번째 포인트는 keep pace with라는 숙어인데, 무엇과 보조를 맞춘다는 뜻이고, 여기서는 디지털 수요를 따라가지 못한다는 의미가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 업그레이드에 대한 욕구가 시작된다\u003c/span>\u003cspan class=\"en\">And thus, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">itch \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">upgrade\u003c/span> begins,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 ~ 전에\u003c/span>\u003cspan class=\"en\">often \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진짜 필요가 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">there's \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">genuine \u003c/span>\u003cspan class=\"tgt\">need\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 종종 진짜 필요가 있기 이전에 업그레이드에 대한 욕구가 시작된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞의 예시에서 이끌어 낸 결론으로, 진정한 필요보다 \u003cb class=\"key\">불안과 \u003c/b>\u003cb class=\"key\">유행\u003c/b>이 업그레이드 욕구를 먼저 일으킨다는 점을 요약합니다. 여기서 itch는 단순한 가려움이 아니라 참기 어려운 \u003cb class=\"key\">욕구\u003c/b>를 뜻하는 비유입니다. 소비가 이성적 필요가 아니라 감정적 충동에 이끌린다는 글의 주제를 강화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사 + to부정사구 : \"업그레이드에 대한 욕구\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간의 부사절을 이끄는 접속사 before\u003c/span> : before + 주어 + 동사 : \"진짜 필요가 있기 전에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">there is 구문\u003c/span> : There is + [주어] : \"진짜 필요가 있다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"And thus, the itch to upgrade begins, 그래서 업그레이드에 대한 욕구가 시작된다. often before, 종종 ~ 전에. there's a genuine need, 진짜 필요가 있다. 이 문장 전체를 해석하면, 그래서 종종 진짜 필요가 있기 이전에 업그레이드에 대한 욕구가 시작된다.","hl":"m"},{"n":19,"text":"세 번째 문장은 그래서 업그레이드하고 싶은 욕구가 진짜 필요가 생기기 전에 먼저 시작된다고 정리해 줘요. itch라는 단어는 가려움이 아니라 참을 수 없는 욕구를 비유하는 표현이에요. 결국 소비자들이 필요해서가 아니라 충동과 불안에 이끌려 소비한다는 흐름을 보여 줘요.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 the itch to upgrade에서 to upgrade인데요, 이 to부정사는 앞에 있는 명사 the itch를 수식하는 형용사적 용법입니다. 두 번째 포인트는 there's a genuine need에 나오는 there is 구문이에요. 이때 there는 유도부사이고 실제 주어는 a genuine need입니다. 세 번째 포인트는 before가 이끄는 시간의 부사절인데요, before 뒤에 주어와 동사가 오면서 진짜 필요가 있기 전에라는 시점을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 순환은\u003c/span>\u003cspan class=\"en\">This cycle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 국한되지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">isn't \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">confined\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 디지털 용품에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">digital \u003c/span>\u003cspan class=\"tgt\">companions\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 순환은 단지 우리의 디지털 용품에 국한되지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 업그레이드 유혹이 디지털 기기만의 문제가 아니라고 선언하며 글의 논의 범위를 확장합니다. 'confined to'는 '~에 국한되다'라는 뜻으로 \u003cb class=\"key\">수동태\u003c/b> 형태지만 사실상 '국한되어 있다'는 상태를 나타냅니다. 'digital companions'는 스마트폰 같은 기기를 사람처럼 친한 동반자에 비유한 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be confined to)\u003c/span> : be동사 + (just) + 과거분사 confined + 전치사 to : \"단지 ~에 국한되지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 to + 명사구 (동반어구)\u003c/span> : confined + to + 명사구 : \"우리의 디지털 용품에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"This cycle, 이러한 순환은. isn't just confined, 단지 국한되지 않는다. to our digital companions, 우리의 디지털 용품에. 이 문장 전체를 해석하면, 이러한 순환은 단지 우리의 디지털 용품에 국한되지 않는다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 업그레이드 유혹이 디지털 기기만의 문제가 아니라 다른 전자 제품으로 넓어진다고 말해 주는 전환 문장이에요. 여기서 confined to는 국한되다는 뜻인데 수동태 형태지만 상태를 나타내고요. digital companions는 스마트폰 같은 기기를 디지털 동반자로 비유해서 표현한 거예요.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 isn't just confined의 수동태입니다. confine은 타동사라서 be confined to 형태로 쓰여 국한되다는 뜻이 돼요. just는 be동사 뒤, 과거분사 앞에서 수동태를 꾸며 주는 부사이고요. 두 번째 포인트는 to our digital companions의 전치사 to입니다. 이 to는 방향이 아니라 국한되는 범위를 가리키니까 confined to를 하나의 묶음으로 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 번져나간다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">spills \u003c/span>\u003cspan class=\"tgt\">over\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 모든 영역으로\u003c/span>\u003cspan class=\"en\">into almost every aspect\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소비자 전자 기기들의\u003c/span>\u003cspan class=\"en\">of consumer electronics,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자율 주행 자동차부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">self-driving \u003c/span>\u003cspan class=\"tgt\">car \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스마트 냉장고에 이르기까지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">smart \u003c/span>\u003cspan class=\"tgt\">fridge\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 자율 주행 자동차부터 스마트 냉장고에 이르기까지 소비자 전자 기기들의 거의 모든 영역까지 번져나간다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞의 '순환'이 소비자 전자 기기 전반으로 확산된다는 점을 구체적 예시와 함께 보여 줍니다. 'spill over'는 물이나 가루가 담긴 용기에서 \u003cb class=\"key\">넘쳐흐르다\u003c/b>라는 뜻인데, 여기서는 어떤 현상이 \u003cb class=\"key\">범위를 \u003c/b>\u003cb class=\"key\">넘어 \u003c/b>\u003cb class=\"key\">번져 \u003c/b>\u003cb class=\"key\">나가다\u003c/b>로 확장되었습니다. 'from A to B'는 두 대상을 끝점으로 제시해 확산 범위를 극명하게 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사 (phrasal verb)\u003c/span> : spill over [자동사구] + into/from/to : \"번져 나간다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">from A to B 구문 (범위)\u003c/span> : from + 명사구 A + to + 명사구 B : \"자율 주행 자동차부터 스마트 냉장고까지\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It spills over, 그것은 번져나간다. into almost every aspect, 거의 모든 영역으로. of consumer electronics, 소비자 전자 기기들의. from the self-driving car, 자율 주행 자동차부터. to the smart fridge, 스마트 냉장고에 이르기까지. 이 문장 전체를 해석하면, 이것은 자율 주행 자동차부터 스마트 냉장고에 이르기까지 소비자 전자 기기들의 거의 모든 영역까지 번져나간다.","hl":"m"},{"n":25,"text":"이 문장은 앞의 업그레이드 순환이 소비자 전자 기기 전체로 번진다고 말하고 있어요. spill over는 원래 액체 같은 게 넘쳐흐르는 뜻인데 여기서는 어떤 현상이 범위를 넘어 번져 나가는 걸로 확장됐어요. from the self-driving car to the smart fridge를 통해서 자율 주행 자동차부터 스마트 냉장고까지 폭넓게 퍼진다는 걸 보여 주죠.","hl":"mn"},{"n":26,"text":"첫 번째로 spill over라는 구동사를 볼게요. spill은 엎지르다, over는 넘어서라는 느낌을 더해요. 그래서 spill over는 넘쳐서 번져 나가다라는 뜻의 자동사 구동사가 되고요, 뒤에 into가 붙어서 번져 들어가는 영역을 알려 줘요. 두 번째로 from the self-driving car to the smart fridge는 from A to B 구문인데요, A부터 B까지라는 범위를 나타내서 소비자 전자 기기의 거의 모든 영역을 구체적으로 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 제품은 ~처럼 보인다\u003c/span>\u003cspan class=\"en\">Every product \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~인 것으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">멈출 수 없는 행진을 하고 있는\u003c/span>\u003cspan class=\"en\">on an unstoppable march\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음 버전을 향해\u003c/span>\u003cspan class=\"en\">towards \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">version, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 다음 세대\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">generation\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 삶을 혁명적으로 바꾸겠다고 약속하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">promises \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">revolutionize \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 제품은 다음 버전, 즉, 당신의 삶에 변혁을 일으키겠다는 약속을 하는 다음 세대를 향한 멈출 수 없는 행진을 하는 것으로 보인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 모든 제품이 예외 없이 다음 세대를 향해 쉬지 않고 나아가는 것처럼 보인다고 요약합니다. 'unstoppable march'는 막을 수 없는 군대의 행군과 같은 \u003cb class=\"key\">비유\u003c/b>로, 소비자가 거스를 수 없는 기술 발전의 \u003cb class=\"key\">압박감\u003c/b>을 느끼게 합니다. 'the next generation'은 'the next version'과 \u003cb class=\"key\">동격\u003c/b>이며, 뒤에 관계절 'that promises...'가 붙어 다음 세대가 삶을 혁신할 것이라고 약속하는 존재로 그려집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (주격 보어)\u003c/span> : seem + to부정사구 (to be ...) : \"~인 것처럼 보인다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격 (apposition)\u003c/span> : 명사구 + , + 명사구 (동격) : \"다음 버전, 즉 다음 세대\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 + that + 동사 : \"당신의 삶을 혁명적으로 바꾸겠다고 약속하는\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Every product seems, 모든 제품은 ~처럼 보인다. to be, ~인 것으로. on an unstoppable march, 멈출 수 없는 행진을 하고 있는. towards the next version, 다음 버전을 향해. the next generation, 그 다음 세대. that promises to revolutionize your life, 당신의 삶을 혁명적으로 바꾸겠다고 약속하는. 이 문장 전체를 해석하면, 모든 제품은 다음 버전, 즉, 당신의 삶에 변혁을 일으키겠다는 약속을 하는 다음 세대를 향한 멈출 수 없는 행진을 하는 것으로 보인다.","hl":"m"},{"n":28,"text":"이 문장은 모든 제품이 예외 없이 다음 세대를 향해 멈추지 않고 나아가는 것처럼 보인다고 요약하는 문장이에요. unstoppable march는 막을 수 없는 행군이라는 뜻인데 소비자가 기술 발전의 압박을 거스를 수 없다는 느낌을 주죠. the next generation은 the next version과 같은 대상을 다시 말하는 동격이고, 뒤에 that절이 붙어서 다음 세대가 당신의 삶을 혁명적으로 바꿀 것이라고 약속하는 존재라고 그려요.","hl":"mn"},{"n":29,"text":"첫 번째로 seems to be를 볼게요. seem은 보이다라는 뜻인데 뒤에 to부정사를 써서 주어가 어떤 상태인지를 서술해요. 그래서 Every product seems to be on an unstoppable march는 모든 제품이 멈출 수 없는 행진을 하고 있는 것처럼 보인다는 뜻이죠. 두 번째로 the next version 다음에 콤마가 있고 the next generation이 나오는데요, 이것은 동격입니다. 앞에 나온 다음 버전이라는 말을 다음 세대라고 다시 설명해 주는 거예요. 세 번째로 that promises to revolutionize your life에서 that은 주격 관계대명사입니다. 선행사 the next generation을 받아서 뒤에 오는 절에서 주어 역할을 하고, 당신의 삶을 혁명적으로 바꾸겠다고 약속하는 다음 세대라는 뜻으로 앞의 명사를 수식해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흥미로운 것은,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What's \u003c/span>\u003cspan class=\"tgt\">fascinating\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 아마도 당황스러운 것은,\u003c/span>\u003cspan class=\"en\">or perhaps disturbing,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전한 효과이다\u003c/span>\u003cspan class=\"en\">is the utter efficacy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 순환의\u003c/span>\u003cspan class=\"en\">of this cycle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 욕구를 형성하는 데 있어서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">shaping \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">desires\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">흥미로운 점, 또는 어쩌면 당황스러운 점은 우리의 욕구를 형성하는 이 순환의 절대적인 효과이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 제품 업그레이드 순환이 우리의 욕구를 형성하는 힘이 거의 완벽할 정도로 효과적이라는 점을 말한다. utter efficacy는 그 순환의 \u003cb class=\"key\">절대적인 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 뜻하며, fascinating과 disturbing을 함께 써서 신기하면서도 불안한 감정을 동시에 드러낸다. 앞서 예로 든 기기 교체 욕구를 일반화해, 다음 문장에서 원함과 필요함의 구분이 흐려진다는 논의로 이어 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what (선행사 포함)\u003c/span> : What is fascinating (명사절 주어) + is + the utter efficacy (주격 보어) : \"흥미로운 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 (전치사의 목적어)\u003c/span> : in + [shaping our desires (동명사구)] : \"우리의 욕구를 형성하는 데 있어서\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"What's fascinating, 흥미로운 것은. or perhaps disturbing, 혹은 아마도 당황스러운 것은. is the utter efficacy, 완전한 효과이다. of this cycle, 이 순환의. in shaping our desires, 우리의 욕구를 형성하는 데 있어서.. 이 문장 전체를 해석하면, 흥미로운 점, 또는 어쩌면 당황스러운 점은 우리의 욕구를 형성하는 이 순환의 절대적인 효과이다.","hl":"m"},{"n":31,"text":"이 문장은 기기 교체를 부추기는 순환이 우리의 욕구를 형성하는 힘이 거의 완벽할 정도로 효과적이라는 뜻이에요. utter efficacy는 그 순환의 절대적인 효과를 말하고, fascinating과 disturbing을 함께 써서 신기하면서도 불안한 감정을 동시에 드러내죠. 앞 문장에서 말한 업그레이드 순환을 정리하면서, 다음에 나올 원함과 필요함의 혼동 이야기로 자연스럽게 이어 줍니다.","hl":"mn"},{"n":32,"text":"첫 번째 문법 포인트는 What's fascinating에 쓰인 관계대명사 what이에요. what은 선행사를 포함한 관계대명사로, 여기서는 이끄는 명사절이 문장 전체의 주어 역할을 합니다. what은 절 안에서 주어이고 fascinating은 그 절의 주격 보어예요. 두 번째 문법 포인트는 in shaping our desires에 쓰인 동명사구입니다. 전치사 in의 목적어 자리에는 명사가 와야 하므로 동사 shape가 shaping으로 바뀌었어요. 전치사 뒤에 동사가 오면 반드시 동명사 형태를 쓴다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 많지는 않다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 가장 최신 기기를 원한다는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> we want the newest device;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 믿도록 이끌린다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we're \u003c/span>\u003cspan class=\"tgt\">led \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 그것을 필요로 한다고.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 가장 최신 기기를 원하는 것이 아니라, 우리가 그것을 원한다고 믿도록 유도된 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 우리가 최신 기기를 단순히 원해서가 아니라 필요하다고 믿도록 유도된다는 뜻이다. not so much that은 어떤 내용이 그다지 크지 않다는 표현으로, 진짜 문제는 뒤에 나오는 we're led to believe에 있다. 결국 소비자의 자발적 욕구처럼 보이지만 실제로는 외부의 유도에 따라 \u003cb class=\"key\">필요\u003c/b>로 느끼게 된다는 점을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어-진주어 (It~that절)\u003c/span> : It(가주어) + is + not so much + that + S + V ... : \"그렇게 많이 ... 것은 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 + to부정사\u003c/span> : be led + to believe (to부정사구) : \"우리는 믿도록 이끌린다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적절을 이끄는 that의 생략\u003c/span> : believe + [(that) + S + V] : \"우리가 그것을 필요로 한다고 믿다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It's not so much, 그렇게 많지는 않다. that we want the newest device, 우리가 가장 최신 기기를 원한다는 것이. we're led to believe, 우리는 믿도록 이끌린다. we need it, 우리가 그것을 필요로 한다고.. 이 문장 전체를 해석하면, 우리가 가장 최신 기기를 원하는 것이 아니라, 우리가 그것을 원한다고 믿도록 유도된 것이다.","hl":"m"},{"n":34,"text":"이 문장은 우리가 최신 기기를 단순히 원해서가 아니라 필요하다고 믿도록 유도된다는 뜻이에요. not so much that은 어떤 내용이 그다지 크지 않다는 표현으로, 진짜 문제는 뒤에 나오는 we're led to believe에 있어요. 결국 소비자의 자발적 욕구처럼 보이지만 실제로는 마케팅의 유도에 따라 필요로 느끼게 된다는 점을 보여 줍니다.","hl":"mn"},{"n":35,"text":"첫 번째 문법 포인트는 It's not so much that에 쓰인 가주어 진주어 구문입니다. It이 가주어이고 that 이하가 진주어로, that절이 문장의 주어 역할을 해요. 두 번째 문법 포인트는 we're led to believe에 쓰인 수동태와 to부정사입니다. lead는 목적어와 to부정사를 함께 취하는 동사인데, 수동태가 되면 목적어가 주어로 오고 to부정사는 그대로 남아요. 세 번째 문법 포인트는 believe we need it에서 that이 생략된 목적절입니다. believe 뒤에 that이 생략되었고, 이 절이 believe의 목적어 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원하는 것과 필요한 것 사이의 구분이 흐려지면서,\u003c/span>\u003cspan class=\"en\">The distinction between want and need blurs,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 재정적인 우선순위를 바꾸면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shifting \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">financial \u003c/span>\u003cspan class=\"tgt\">priorities\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~을 선호하여\u003c/span>\u003cspan class=\"en\">in favor of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최신 트렌드를 유지하는 것.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">staying \u003c/span>\u003cspan class=\"tgt\">current \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">trends\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">최신 트렌드를 유지하는 것을 선호하는 쪽으로 우리의 재정적인 우선순위를 바꾸면서, 원하는 것과 필요한 것 사이의 구분이 흐릿해진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 원하는 것과 필요한 것의 경계가 흐려지고, 그 결과 재정적 우선순위까지 최신 트렌드를 따르는 쪽으로 이동한다고 설명한다. blur는 \u003cb class=\"key\">구분이 \u003c/b>\u003cb class=\"key\">흐려짐\u003c/b>을 뜻하고, 분사구문 shifting 이하는 그로 인한 \u003cb class=\"key\">재정적 \u003c/b>\u003cb class=\"key\">우선순위 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 덧붙인다. 결국 합리적 판단보다 유행을 따라가는 데 돈을 쓰게 되는 흐름을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (현재분사, 동시동작·결과)\u003c/span> : 주절(The distinction ... blurs), + [shifting our financial priorities (분사구문)] : \"우리의 재정적인 우선순위를 바꾸면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 (전치사의 목적어)\u003c/span> : in favor of + [staying current with trends (동명사구)] : \"최신 트렌드를 유지하는 것\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The distinction between want and need blurs, 원하는 것과 필요한 것 사이의 구분이 흐려지면서. shifting our financial priorities, 우리의 재정적인 우선순위를 바꾸면서. in favor of, ~을 선호하여. staying current with trends, 최신 트렌드를 유지하는 것.. 이 문장 전체를 해석하면, 최신 트렌드를 유지하는 것을 선호하는 쪽으로 우리의 재정적인 우선순위를 바꾸면서, 원하는 것과 필요한 것 사이의 구분이 흐릿해진다.","hl":"m"},{"n":37,"text":"이 문장은 원하는 것과 필요한 것 사이의 경계가 흐려지고, 그 결과 우리의 재정적 우선순위가 최신 트렌드를 유지하는 쪽으로 옮겨 간다는 뜻입니다. blur는 경계가 분명하지 않게 되는 상태를 나타내고, shifting 이하는 그로 인한 재정적 우선순위 변화를 분사구문으로 덧붙였어요. 결국 합리적 판단보다 유행을 따라가는 데 돈을 쓰게 되는 흐름을 보여 줍니다.","hl":"mn"},{"n":38,"text":"첫 번째 문법 포인트는 shifting our financial priorities에 쓰인 분사구문입니다. 주절에 이어서 shifting 이하가 부사 역할을 하며, 의미상 주어는 The distinction이고 능동 관계라 현재분사 형태를 씁니다. 두 번째 문법 포인트는 staying current with trends에 쓰인 동명사구입니다. 전치사 of의 목적어 자리에는 명사가 필요한데, 동사 stay가 동명사 staying으로 바뀌어 쓰였어요. stay current with trends는 최신 트렌드를 유지하다라는 뜻으로 통째로 익혀 두면 좋습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에도 불구하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">For \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">논리적인 논쟁들은\u003c/span>\u003cspan class=\"en\">the logical arguments\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 끊임없는 업그레이드를 하는 것에 반대하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">against \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">ceaseless \u003c/span>\u003cspan class=\"tgt\">upgrading\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 매력은\u003c/span>\u003cspan class=\"en\">the temptation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 강력하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">remains \u003c/span>\u003cspan class=\"tgt\">compelling\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 끊임없는 업그레이드를 하는 것에 대한 논리적인 논쟁에도 불구하고, 매력은 여전히 강력하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체를 마무리하는 문장으로, 계속되는 업그레이드에 대한 논리적 반대가 있음에도 불구하고 \u003cb class=\"key\">유혹\u003c/b>은 여전히 \u003cb class=\"key\">강력하다\u003c/b>는 역설을 강조합니다. For all은 '~에도 불구하고'라는 \u003cb class=\"key\">양보\u003c/b>의 의미를 지니며, ceaseless는 '끊임없는'이라는 뜻으로 업그레이드의 반복성을 나타냅니다. 소비자의 이성적 판단보다 감정적 이끌림이 더 크다는 점을 보여 주는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사적 표현 For all (양보)\u003c/span> : For all + [명사구], [주어+동사] : \"~에도 불구하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : [명사] + against + [명사구] : \"이런 끊임없는 업그레이드를 하는 것에 반대하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">2형식 동사 remain + 주격보어\u003c/span> : remain + [형용사·주격보어] : \"여전히 강력하다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"For all, ~에도 불구하고. the logical arguments, 논리적인 논쟁들은. against this ceaseless upgrading, 이런 끊임없는 업그레이드를 하는 것에 반대하는. the temptation, 그 매력은. remains compelling, 여전히 강력하다. 이 문장 전체를 해석하면, 이런 끊임없는 업그레이드를 하는 것에 대한 논리적인 논쟁에도 불구하고, 매력은 여전히 강력하다.","hl":"m"},{"n":40,"text":"이 문장은 글 전체의 마무리입니다. 계속되는 업그레이드에 반대하는 논리적인 주장이 많음에도 불구하고, 새 기기에 대한 유혹은 여전히 강력하다는 역설을 말하고 있어요. For all은 '~에도 불구하고'라는 양보의 의미를 나타내고, ceaseless는 '끊임없는', compelling은 '매력적인' 또는 '설득력 있는'이라는 뜻으로 쓰였습니다. 소비자의 이성적인 판단보다 감정적인 이끌림이 더 크다는 점을 강조하는 문장이에요.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 For all입니다. For all은 '모두 ~임에도 불구하고'라는 뜻으로, despite나 in spite of와 같은 양보의 의미를 나타내는 전치사적 표현이에요. 뒤에 명사구가 오고 주절이 뒤따르는 구조입니다. 두 번째 어법 포인트는 against this ceaseless upgrading입니다. 이 전치사구는 앞에 있는 명사 the logical arguments를 수식하는 형용사적 용법이에요. 논리적인 논쟁들이 무엇에 반대하는 것인지 구체적으로 설명해 줍니다. 세 번째 어법 포인트는 remains compelling입니다. remain은 '여전히 ~이다'라는 뜻의 불완전자동사로, 뒤에 주격보어 형용사 compelling을 취해서 '여전히 매력적이다'라는 상태의 유지를 나타냅니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>생산자들은 현재 기기에 대한 \u003cb class=\"key\">의심의 \u003c/b>\u003cb class=\"key\">씨앗\u003c/b>을 심어 곧 \u003cb class=\"key\">업그레이드 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>를 일으킨다.\u003c/li>\u003cli>이 순환은 디지털 기기를 넘어 \u003cb class=\"key\">소비자 \u003c/b>\u003cb class=\"key\">전자기기\u003c/b> 전반으로 번진다.\u003c/li>\u003cli>핵심은 우리가 최신 기기를 원하는 것이 아니라 \u003cb class=\"key\">필요하다고 \u003c/b>\u003cb class=\"key\">믿도록\u003c/b> 이끌린다는 점이다.\u003c/li>\u003cli>그 결과 \u003cb class=\"key\">원하는 \u003c/b>\u003cb class=\"key\">것과 \u003c/b>\u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">것\u003c/b>의 구분이 흐려지고, \u003cb class=\"key\">끊임없는 \u003c/b>\u003cb class=\"key\">업그레이드\u003c/b>의 유혹은 여전히 강력하다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Manufacturers sow doubt about our current devices, blurring the line between want and need to drive ceaseless upgrading.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">생산자들은 \u003cb class=\"key\">현재 \u003c/b>\u003cb class=\"key\">기기의 \u003c/b>\u003cb class=\"key\">적절성\u003c/b>에 대한 의심의 씨앗을 뿌려 \u003cb class=\"key\">업그레이드 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>를 부추기고, 이 순환이 \u003cb class=\"key\">소비자 \u003c/b>\u003cb class=\"key\">전자기기\u003c/b> 전반으로 번지면서 \u003cb class=\"key\">원하는 \u003c/b>\u003cb class=\"key\">것과 \u003c/b>\u003cb class=\"key\">필요한 \u003c/b>\u003cb class=\"key\">것\u003c/b>의 경계를 흐려 \u003cb class=\"key\">최신 \u003c/b>\u003cb class=\"key\">트렌드\u003c/b>를 따르게 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 지문은 생산자가 심는 의심이 업그레이드 욕구로 이어지고, 그것이 소비자 전자기기 전반으로 확산된다는 흐름이었어요. 가장 중요한 문장은 우리가 최신 기기를 원하는 것이 아니라 필요하다고 믿도록 이끌린다는 부분이에요. 이 순환의 논리를 이해하면, 나의 소비 선택을 더 객관적으로 볼 수 있어요. 오늘 강의는 여기까지입니다. 다음 시간에 또 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
