</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 24번","audioDir":"24_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">24번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Attention Literacy: Becoming Critical Users of Digital Media\u003c/h1>\u003ch2>주의력 문해력: 디지털 미디어의 비판적 사용자 되기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 진보적 교육자와 사서는 \u003cb class=\"key\">주의력 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>을 가르치는 교육과정을 개발하고 있으며, 학생들이 소셜 미디어 피드나 뉴스 사이트의 구조가 \u003cb class=\"key\">의도적인 \u003c/b>\u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">선택\u003c/b>임을 인식하게 하여 수동적 소비자가 아닌 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사용자\u003c/b>가 되도록 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Young people should learn to recognize the deliberate design choices behind digital media so that they become critical users rather than passive consumers.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 다룰 지문은 주의력 문해력을 가르치는 교육과정에 대한 글입니다. 한 문장으로 정리하면 학생들이 디지털 미디어의 의도적인 설계를 인식하고 비판적인 사용자가 되어야 한다는 내용이에요. 자 이제 같이 살펴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">스마트폰 앱을 보면 왜 계속 스크롤을 내리게 될까요. 잘 팔리는 과자를 눈높이에 진열하는 마트처럼 앱도 사용자의 관심을 오래 붙잡아 두도록 설계됩니다. \u003cb class=\"key\">무한 \u003c/b>\u003cb class=\"key\">스크롤\u003c/b>은 끝이 없어 계속 보게 만들고, \u003cb class=\"key\">알림\u003c/b>은 특정 색상과 소리로 주의를 끌죠. 이런 설계는 \u003cb class=\"key\">심리학\u003c/b>과 \u003cb class=\"key\">이윤 \u003c/b>\u003cb class=\"key\">동기\u003c/b>에서 나온 경우가 많습니다. 그래서 기존의 \u003cb class=\"key\">미디어 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>이 정보의 신뢰성을 평가하는 데 초점을 맞췄다면, 최근에는 자신의 주의가 어떻게 빼앗기는지까지 읽어 내는 \u003cb class=\"key\">주의력 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>이 강조됩니다.\u003c/div>","segs":[{"n":2,"text":"우리가 스마트폰에서 보는 앱들은 왜 계속 스크롤을 내리게 할까요. 잘 팔리는 과자를 눈높이에 진열하는 마트처럼 앱도 사용자의 관심을 오래 붙잡아 두려고 설계됩니다. 무한 스크롤은 끝이 없어서 계속 보게 만들고 알림은 특정 색상과 소리로 주의를 끌죠. 이런 설계는 심리학과 이윤 동기에서 나온 경우가 많습니다. 그래서 최근 교육에서는 단순히 정보의 신뢰성을 평가하는 미디어 문해력을 넘어 주의력 문해력이라는 개념을 가르치기 시작했어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>주의력 문해력 등장\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>진보적 교육자와 사서는 \u003cb class=\"key\">주의력 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>을 가르치기 위한 교육과정을 개발하고 있다. 이는 소셜 미디어 피드나 뉴스 사이트의 구조가 의도적으로 \u003cb class=\"key\">산만하게 \u003c/b>\u003cb class=\"key\">하거나 \u003c/b>\u003cb class=\"key\">자극하도록\u003c/b> 설계되어 있음을 학생들이 인식하도록 돕는 것을 의미한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>미디어 문해력의 확장\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>미디어 문해력 수업은 전통적으로 정보원의 \u003cb class=\"key\">신뢰성\u003c/b> 평가를 다루었지만, 이제는 \u003cb class=\"key\">클릭베이트\u003c/b> 인식, \u003cb class=\"key\">알고리즘\u003c/b>이 어떤 콘텐츠를 제공하는지에 미치는 역할 이해, 자신의 \u003cb class=\"key\">주의산만 \u003c/b>\u003cb class=\"key\">패턴\u003c/b> 관찰까지 포함한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>구체적 수업 사례\u003csmall>예시 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>학생은 숙제 한 시간 동안 \u003cb class=\"key\">작업 \u003c/b>\u003cb class=\"key\">전환\u003c/b>과 휴대폰 확인 횟수를 추적하여 \u003cb class=\"key\">프래그멘테이션\u003c/b>에 대한 자기 인식을 높인다. 또한 인기 앱이 페이지 대신 \u003cb class=\"key\">무한 \u003c/b>\u003cb class=\"key\">스크롤\u003c/b>을 쓰는 이유와 특정 색상과 소리로 나타나는 알림 설계를 분석한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>비판적 사용자로 성장\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>이러한 것들을 \u003cb class=\"key\">의도적인 \u003c/b>\u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">선택\u003c/b>으로 취급함으로써 젊은이들은 수동적 소비자가 아니라 더 \u003cb class=\"key\">비판적인 \u003c/b>\u003cb class=\"key\">사용자\u003c/b>가 된다. 심리학과 이윤 동기에 뿌리를 둔 설계 의도를 읽어 내는 것이 핵심이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름은 먼저 주의력 문해력이라는 개념을 제시하고 전통적인 미디어 문해력과 비교한 다음 구체적인 수업 사례를 들고 마지막에 비판적 사용자가 된다는 결론으로 이어집니다.","hl":null},{"n":4,"text":"도입에서는 진보적인 교육자와 사서가 주의력 문해력을 가르치기 위한 교육과정을 개발하고 있다는 점을 소개합니다. 이는 소셜 미디어 피드나 뉴스 사이트의 구조가 의도적으로 우리를 산만하게 하거나 자극하도록 설계되어 있다는 사실을 인식하도록 돕는 것을 의미하죠.","hl":"f0"},{"n":5,"text":"기존의 미디어 문해력 수업은 정보원의 신뢰성을 평가하는 데 초점을 맞췄어요. 그런데 이제는 클릭베이트를 알아보고 어떤 콘텐츠가 제공되는지에 영향을 주는 알고리즘의 역할을 이해하고 자신만의 주의 산만 패턴을 관찰하는 것까지 포함합니다.","hl":"f1"},{"n":6,"text":"구체적으로 학생들은 숙제를 한 시간 동안 하면서 작업을 몇 번 전환하는지 휴대폰을 몇 번 확인하는지 추적하는 과제를 받을 수 있어요. 또 인기 앱이 왜 페이지 대신 무한 스크롤을 쓰는지 왜 알림이 특정 색상과 소리로 나타나는지 분석하기도 합니다.","hl":"f2"},{"n":7,"text":"이런 것들을 의도적인 디자인 선택으로 바라보게 되면 젊은이들은 수동적인 소비자가 아니라 더 비판적인 사용자가 됩니다. 이 설계의 이면에는 심리학과 이윤 동기가 깔려 있다는 점을 이해하는 게 핵심이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">주의력 \u003c/b>\u003cb class=\"key\">문해력\u003c/b> 교육과정 개발이라는 주제를 제시하고, 이후 \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어 \u003c/b>\u003cb class=\"key\">피드\u003c/b> 구조, \u003cb class=\"key\">클릭베이트\u003c/b>, \u003cb class=\"key\">무한 \u003c/b>\u003cb class=\"key\">스크롤\u003c/b> 등의 예시로 주장을 뒷받침한다. 마지막 문장에서 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사용자\u003c/b>가 된다는 결론을 내리며, 전통적인 미디어 문해력과 대조되는 새로운 접근임을 분명히 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (2)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>traditionally ... now (3)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>Why (5)\u003c/b>\u003cspan>예시·질문\u003c/span>\u003cb>By treating these (7)\u003c/b>\u003cspan>결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">deliberately designed to distract or provoke them\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">deliberate design choices\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>수동적 소비자\u003c/th>\u003cth>비판적 사용자\u003c/th>\u003c/tr>\u003ctr>\u003ctd>미디어 설계 의도를 모른 채 소비함\u003c/td>\u003ctd>설계 의도를 읽어 내며 사용함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>클릭베이트·알림에 수동적으로 반응\u003c/td>\u003ctd>클릭베이트·알림을 분석하고 주의를 관리함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거 방식으로 되어 있고 첫 문장에서 주제를 제시하는 두괄식 구조입니다. 처음에 주의력 문해력이라는 개념을 꺼낸 뒤 이어지는 문장들에서 그 개념을 뒷받침하는 예시들을 제시하고 마지막에 결론으로 마무리하죠.","hl":"ty"},{"n":9,"text":"신호어를 보면 for example이 나오면서 예시가 시작되고 traditionally와 now가 대조를 이룹니다. 마지막 문장의 By treating these는 앞에 나온 내용을 정리하면서 결론을 이끄는 신호로 볼 수 있어요. 또한 deliberately designed와 deliberate design choices는 같은 개념을 다르게 표현한 재진술입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>progressive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>진보적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>educator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교육자\u003c/span>\u003c/div>\u003cdiv>\u003cb>librarian\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사서\u003c/span>\u003c/div>\u003cdiv>\u003cb>curriculum\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교육과정\u003c/span>\u003c/div>\u003cdiv>\u003cb>attention literacy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주의력 문해력\u003c/span>\u003c/div>\u003cdiv>\u003cb>recognize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>architecture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구조, 설계\u003c/span>\u003c/div>\u003cdiv>\u003cb>feed\u003c/b>\u003cem>명사\u003c/em>\u003cspan>피드\u003c/span>\u003c/div>\u003cdiv>\u003cb>deliberately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>의도적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>distract\u003c/b>\u003cem>동사\u003c/em>\u003cspan>산만하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>provoke\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자극하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>media literacy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미디어 문해력\u003c/span>\u003c/div>\u003cdiv>\u003cb>evaluate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>평가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>credibility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신뢰성\u003c/span>\u003c/div>\u003cdiv>\u003cb>clickbait\u003c/b>\u003cem>명사\u003c/em>\u003cspan>클릭베이트\u003c/span>\u003c/div>\u003cdiv>\u003cb>algorithm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>알고리즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>serve up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>observe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관찰하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>distraction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주의산만\u003c/span>\u003c/div>\u003cdiv>\u003cb>track\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추적하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fragmentation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>프래그멘테이션\u003c/span>\u003c/div>\u003cdiv>\u003cb>unpack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분석하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>infinite scrolling\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무한 스크롤\u003c/span>\u003c/div>\u003cdiv>\u003cb>notification\u003c/b>\u003cem>명사\u003c/em>\u003cspan>알림\u003c/span>\u003c/div>\u003cdiv>\u003cb>deliberate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의도적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>profit motive\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이윤 동기\u003c/span>\u003c/div>\u003cdiv>\u003cb>critical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비판적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>passive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수동적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>consumer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소비자\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 정리하면 attention literacy는 주의력 문해력, clickbait은 클릭베이트, algorithm은 알고리즘, infinite scrolling은 무한 스크롤, deliberate는 의도적인이라는 뜻입니다. 시험에 자주 출제되니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">recognize\u003c/b>\u003cspan class=\"m\">인식하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">identify\u003c/span>\u003cspan class=\"s\">perceive\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">deliberate\u003c/b>\u003cspan class=\"m\">의도적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">intentional\u003c/span>\u003cspan class=\"s\">planned\u003c/span>\u003cspan class=\"s\">purposeful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accidental\u003c/span>\u003cspan class=\"a\">unintentional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">critical\u003c/b>\u003cspan class=\"m\">비판적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">analytical\u003c/span>\u003cspan class=\"s\">discerning\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uncritical\u003c/span>\u003cspan class=\"a\">passive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">passive\u003c/b>\u003cspan class=\"m\">수동적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inactive\u003c/span>\u003cspan class=\"s\">submissive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">active\u003c/span>\u003cspan class=\"a\">critical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distract\u003c/b>\u003cspan class=\"m\">산만하게 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">divert\u003c/span>\u003cspan class=\"s\">sidetrack\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">focus\u003c/span>\u003cspan class=\"a\">concentrate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">evaluate\u003c/b>\u003cspan class=\"m\">평가하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assess\u003c/span>\u003cspan class=\"s\">judge\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">disregard\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">credibility\u003c/b>\u003cspan class=\"m\">신뢰성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trustworthiness\u003c/span>\u003cspan class=\"s\">reliability\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unreliability\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 봅시다. recognize는 identify나 notice와 바꿔 쓸 수 있고 반대는 ignore나 overlook입니다. deliberate는 intentional, planned와 같은 뜻이고 반대는 accidental, unintentional이에요. critical은 analytical, discerning과 연결되고 uncritical과 대조됩니다. passive는 inactive, submissive와 유사하고 active와 반대입니다. distract는 divert와 비슷하고 focus와 반대되죠. evaluate는 assess, judge와 통하고 disregard와 반대, credibility는 reliability와 통하고 unreliability와 대조됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진보적인 교육자들과 사서들은\u003c/span>\u003cspan class=\"en\">Progressive educators and librarians\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개발하고 있다\u003c/span>\u003cspan class=\"en\">are developing\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교육과정을\u003c/span>\u003cspan class=\"en\">curricula\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가르치기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">teach\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 무엇이라 부를 수 있는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">call \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주의력 문해력\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">attention \u003c/span>\u003cspan class=\"tgt\">literacy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">진보적인 교육자들과 사서들은 우리가 주의력 문해력이라 부를 만한 것을 가르치기 위한 교육과정을 개발하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 글의 핵심 개념인 \u003cb class=\"key\">주의력 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>을 처음 제시하며, 미디어 문해력 수업을 새롭게 확장하는 \u003cb class=\"key\">교육과정\u003c/b>을 개발한다는 주제를 연다. 기존의 문해력이 글을 읽고 쓰는 능력이었다면, 여기서는 디지털 환경에서 자신의 \u003cb class=\"key\">주의력\u003c/b>을 지키는 능력으로 의미가 넓어진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [curricula] + [to teach ...] : \"가르치기 위한 교육과정\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">선행사를 포함한 관계대명사 what\u003c/span> : [what] + [주어 we] + [동사 might call] + [목적보어 attention literacy] : \"우리가 주의력 문해력이라 부를 수 있는 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Progressive educators and librarians, 진보적인 교육자들과 사서들은. are developing, 개발하고 있다. curricula, 교육과정을. to teach, 가르치기 위해. what we might call, 우리가 무엇이라 부를 수 있는 것. attention literacy, 주의력 문해력. 이 문장 전체를 해석하면, 진보적인 교육자들과 사서들은 우리가 주의력 문해력이라 부를 만한 것을 가르치기 위한 교육과정을 개발하고 있다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 화두인 주의력 문해력을 처음 소개하는 문장이에요. 문해력이라고 하면 보통 글을 읽고 쓰는 능력을 떠올리지만, 여기서는 디지털 환경에서 자신의 주의력을 인식하고 지키는 능력까지 넓혀서 쓰고 있어요. 진보적인 교육자들과 사서가 그런 교육과정을 개발하고 있다는 점을 기억하세요.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 to teach가 앞에 있는 명사 curricula를 수식하는 to부정사의 형용사적 용법이라는 거예요. curricula to teach는 가르치기 위한 교육과정으로 해석돼요. 두 번째 포인트는 what we might call attention literacy에서 what이 선행사를 포함한 관계대명사로 쓰였다는 점이에요. 이 부분은 우리가 주의력 문해력이라 부를 수 있는 것으로 해석되고, 전체적으로 명사절 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 의미한다\u003c/span>\u003cspan class=\"en\">This means\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어 학생들이 인식하도록 돕는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">helping \u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003cspan class=\"tgt\">recognize\u003c/span>, for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소셜 미디어 피드나 뉴스 사이트의 구조가 어떻게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">architecture \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">media \u003c/span>\u003cspan class=\"tgt\">feed \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">news \u003c/span>\u003cspan class=\"tgt\">site \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의도적으로 설계되어 있는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">deliberately \u003c/span>\u003cspan class=\"tgt\">designed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 산만하게 하거나 자극하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">distract \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">provoke \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 이것은 소셜 미디어 피드나 뉴스 사이트의 구조가 학생들을 산만하게 하거나 자극하도록 어떻게 의도적으로 설계되었는지 그들이 인식하도록 돕는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 주의력 문해력이 실제로 무엇을 뜻하는지, 소셜 미디어 피드나 뉴스 사이트의 \u003cb class=\"key\">구조\u003c/b>가 사용자를 산만하게 하거나 자극하도록 \u003cb class=\"key\">의도적으로 \u003c/b>\u003cb class=\"key\">설계\u003c/b>되어 있음을 인식시키는 예로 풀어준다. 즉, 화면의 배열이나 작동 방식이 중립적이지 않고 사용자의 심리를 겨냥한 \u003cb class=\"key\">설계\u003c/b>라는 점을 아는 것이 핵심이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">help의 목적격보어 (원형부정사)\u003c/span> : [help] + [목적어 students] + [원형부정사 recognize] : \"학생들이 인식하도록 돕는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (how + 주어 + 동사)\u003c/span> : [how] + [주어 the architecture] + [동사 is designed] : \"소셜 미디어 피드나 뉴스 사이트의 구조가 어떻게 의도적으로 설계되어 있는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : [be designed] + [to distract or provoke ...] : \"그들을 산만하게 하거나 자극하도록\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"This means, 이것은 의미한다. helping students recognize, for example, 예를 들어 학생들이 인식하도록 돕는 것을. how the architecture of a social media feed or a news site, 소셜 미디어 피드나 뉴스 사이트의 구조가 어떻게. is deliberately designed, 의도적으로 설계되어 있는지. to distract or provoke them, 그들을 산만하게 하거나 자극하도록. 이 문장 전체를 해석하면, 예를 들어, 이것은 소셜 미디어 피드나 뉴스 사이트의 구조가 학생들을 산만하게 하거나 자극하도록 어떻게 의도적으로 설계되었는지 그들이 인식하도록 돕는 것을 의미한다.","hl":"m"},{"n":16,"text":"이 문장은 앞서 나온 주의력 문해력이 구체적으로 무엇인지 설명하는 문장이에요. 소셜 미디어 피드나 뉴스 사이트의 구조가 사용자의 주의를 흩뜨리고 감정을 자극하도록 의도적으로 설계되어 있다는 점을 학생들이 인식하게 하는 것을 의미해요. 즉 디지털 화면이 단순히 정보를 보여 주는 중립적 공간이 아니라 사용자의 심리와 반응을 겨냥한 설계라는 비판적 시각을 강조하는 거죠.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 helping students recognize에서 help가 목적어 students를 받고 그 뒤에 원형부정사 recognize를 목적격보어로 쓴 거예요. 학생들이 인식하도록 돕는다는 의미 관계가 성립해서 목적격보어 자리에 to가 없는 원형부정사가 왔어요. 두 번째 포인트는 how 이하가 간접의문문으로 recognize의 목적어 자리에 쓰였다는 거예요. 간접의문문은 how 다음에 주어 the architecture, 동사 is designed 순서로 오는 의주동 어순을 지켜야 해요. 세 번째 포인트는 to distract or provoke them이 무엇을 위해 설계되었는지 목적을 나타내는 to부정사의 부사적 용법이라는 점이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미디어 문해력 수업은\u003c/span>\u003cspan class=\"en\">Classes in media literacy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전통적으로 다루지만\u003c/span>\u003cspan class=\"en\">traditionally cover\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정보원의 신뢰성을 평가하는 방법을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">evaluate \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">credibility \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">sources\u003c/span> ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제는 또한 포함한다\u003c/span>\u003cspan class=\"en\">now they also include\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">클릭베이트를 인식하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">recognizing \u003c/span>\u003cspan class=\"tgt\">clickbait, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 콘텐츠가 제공되는 데 있어 알고리즘의 역할을 이해하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">understanding \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">role \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">algorithms \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">content \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">served \u003c/span>\u003cspan class=\"tgt\">up, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신만의 주의산만 패턴을 관찰하는 것도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">observing \u003c/span>\u003cspan class=\"tgt\">one's \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">patterns \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">distraction\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미디어 문해력 수업은 전통적으로 어떻게 정보원의 신뢰성을 평가하는지 다루었지만, 이제는 클릭베이트(특정 링크를 클릭하도록 유도하는 수법)를 인식하고, 어떤 콘텐츠가 제공되는 것에 있어 알고리즘의 역할을 이해하며, 자신만의 주의산만 패턴을 관찰하는 것도 포함한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기존 미디어 문해력 수업이 정보원의 \u003cb class=\"key\">신뢰성\u003c/b> 평가를 다루었다면, 이제는 \u003cb class=\"key\">클릭베이트\u003c/b> 인식, \u003cb class=\"key\">알고리즘\u003c/b>의 역할 이해, 자신의 \u003cb class=\"key\">주의산만 \u003c/b>\u003cb class=\"key\">패턴\u003c/b> 관찰까지 포함한다는 대조를 보여 준다. 이를 통해 수업 내용이 수동적 정보 판단을 넘어 디지털 환경에 대한 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사용자\u003c/b> 훈련으로 확장된다는 점을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사\u003c/span> : [how] + [to evaluate] + [목적어 the credibility of sources] : \"정보원의 신뢰성을 평가하는 방법\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 병렬 구조\u003c/span> : [include] + [recognizing ... / understanding ... / observing ...] : \"클릭베이트 인식, 알고리즘 역할 이해, 자신의 주의산만 패턴 관찰\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Classes in media literacy, 미디어 문해력 수업은. traditionally cover, 전통적으로 다루지만. how to evaluate the credibility of sources ―, 정보원의 신뢰성을 평가하는 방법을. now they also include, 이제는 또한 포함한다. recognizing clickbait, 클릭베이트를 인식하고. understanding the role of algorithms in what content is served up, 어떤 콘텐츠가 제공되는 데 있어 알고리즘의 역할을 이해하고. and observing one's own patterns of distraction, 자신만의 주의산만 패턴을 관찰하는 것도. 이 문장 전체를 해석하면, 미디어 문해력 수업은 전통적으로 어떻게 정보원의 신뢰성을 평가하는지 다루었지만, 이제는 클릭베이트(특정 링크를 클릭하도록 유도하는 수법)를 인식하고, 어떤 콘텐츠가 제공되는 것에 있어 알고리즘의 역할을 이해하며, 자신만의 주의산만 패턴을 관찰하는 것도 포함한다.","hl":"m"},{"n":19,"text":"이 문장은 전통적인 미디어 문해력 수업과 새롭게 확장된 수업 내용을 대조해 주는 문장이에요. 기존에는 정보원의 신뢰성을 평가하는 방법을 다루었지만, 이제는 클릭베이트를 인식하고, 알고리즘이 어떤 콘텐츠를 제공하는지 이해하고, 자신의 주의산만 패턴을 관찰하는 것까지 포함한다는 거예요. 수업이 단순한 정보 판단을 넘어 디지털 환경을 비판적으로 바라보게 하는 방향으로 바뀌고 있다는 점을 꼭 잡으세요.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 how to evaluate가 의문사와 to부정사가 결합한 형태라는 거예요. how to evaluate는 평가하는 방법이라는 뜻으로 cover의 목적어 자리에 명사구처럼 쓰였어요. 두 번째 포인트는 include 뒤에 recognizing, understanding, observing이 이어지는 동명사의 병렬 구조예요. 세 개의 동명사구가 쉼표와 and로 연결되어 클릭베이트 인식, 알고리즘의 역할 이해, 자신의 주의산만 패턴 관찰처럼 모두 '~하는 것'으로 해석돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생은 추적하는 과제를 받을 수도 있다\u003c/span>\u003cspan class=\"en\">A student \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">tasked \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">tracking\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼마나 여러 번 자신이 작업을 전환하거나 전화기를 확인하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">times \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">switch \u003c/span>\u003cspan class=\"tgt\">tasks \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">check \u003c/span>\u003cspan class=\"tgt\">th tasked with tracking, 학생은 추적하는 과제를 받을 수도 있다. how many times they switch tasks or check their phone, 얼마나 여러 번 자신이 작업을 전환하거나 전화기를 확인하는지. in an hour of homework, 숙제하는 한 시간 동안에. to raise self-awareness about fragmentation, 프래그멘테이션에 대한 자기 인식을 높이기 위해. 이 문장 전체를 해석하면, 학생은 프래그멘테이션(정보를 의도적으로 흩어놓거나 단계를 복잡하게 쪼개는 수법)에 대한 자기 인식을 높이기 위해, 숙제하는 한 시간에 얼마나 여러 번 작업을 전환하거나 전화기를 확인하는지 추적하는 과제를 받을 수도 있다.","hl":"m"},{"n":22,"text":"이 문장은 앞 문장에서 말한 자신만의 주의산만 패턴을 관찰하는 것을 구체화한 예시입니다. 학생에게 숙제 한 시간 동안 작업 전환을 몇 번 하는지, 전화기를 몇 번 확인하는지를 기록하게 해서 자기 인식을 높이려는 것이죠. 여기서 fragmentation은 주의가 여러 조각으로 계속 깨지는 현상을 말합니다.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 might be tasked with tracking입니다. be tasked with는 어떤 일을 부여받다는 수동태 표현이고, with 뒤에는 동명사인 tracking이 왔어요. 전치사 뒤에는 명사나 동명사가 온다는 점을 기억하세요. 두 번째 어법 포인트는 how many times they switch tasks or check their phone입니다. 이 부분은 의문사 how many times가 이끄는 간접의문문으로, 의문사 다음에 주어와 동사가 오는 어순을 지켜야 하죠. 세 번째 어법 포인트는 to raise self-awareness about fragmentation으로, 여기서 to부정사는 목적을 나타내는 부사적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 수업은 분석하는 것을 포함할 수 있다\u003c/span>\u003cspan class=\"en\">Another lesson might \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">involve \u003c/span>\u003cspan class=\"tgt\">unpacking\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인기 앱들의 설계를\u003c/span>\u003cspan class=\"en\">the design of popular apps:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 앱은 무한 스크롤을 사용하는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">app \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> infinite scrolling\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">페이지 대신\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">pages\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또 다른 수업은 인기 앱들의 설계를 분석하는 것을 포함할 수 있다. 왜 앱은 페이지 대신 무한 스크롤을 사용할까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 '또 다른 수업'을 구체적으로 보여주는 예시로, 인기 앱의 설계를 \u003cb class=\"key\">분석\u003c/b>하는 활동을 제시한다. 특히 '왜 infinite scrolling을 사용할까?'라는 질문을 던져, 페이지 방식이 아니라 무한 스크롤을 선택한 것이 \u003cb class=\"key\">의도적 \u003c/b>\u003cb class=\"key\">설계\u003c/b>임을 학생이 발견하게 한다. 이는 다음 문장의 알림 색상·소리 질문과 \u003cb class=\"key\">짝을 \u003c/b>\u003cb class=\"key\">이루는\u003c/b> 질문이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사 involve\u003c/span> : involve + [unpacking (동명사구)] : \"분석하는 것을 포함하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">Why 의문문과 do 조동사\u003c/span> : Why + do/does + 주어 + 동사원형 : \"왜 앱은 사용하는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 instead of\u003c/span> : instead of + [pages (명사)] : \"페이지 대신\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Another lesson might involve unpacking, 또 다른 수업은 분석하는 것을 포함할 수 있다. the design of popular apps, 인기 앱들의 설계를. Why does an app use infinite scrolling, 왜 앱은 무한 스크롤을 사용하는가. instead of pages?, 페이지 대신. 이 문장 전체를 해석하면, 또 다른 수업은 인기 앱들의 설계를 분석하는 것을 포함할 수 있다. 왜 앱은 페이지 대신 무한 스크롤을 사용할까?","hl":"m"},{"n":25,"text":"이 문장은 또 다른 수업 활동으로 인기 앱의 설계를 분석해 보는 예시를 듭니다. 특히 앱이 페이지가 아니라 무한 스크롤을 쓰는 이유를 직접 물어봄으로써 설계가 우연이 아니라 의도된 선택임을 학생들이 생각해 보게 합니다. 질문 형식을 통해 다음 문장의 구체적인 질문으로 자연스럽게 연결됩니다.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 involve unpacking입니다. involve는 뒤에 동명사를 목적어로 취하는 동사라서 unpack이라는 동사에 ing를 붙인 형태가 왔어요. 두 번째 어법 포인트는 Why does an app use infinite scrolling입니다. why로 시작하는 의문문에서는 의문사 다음에 does라는 조동사가 오고 주어인 an app, 그리고 동사원형 use가 오는 어순을 지킵니다. 세 번째 어법 포인트는 instead of pages입니다. instead of는 무엇 대신에라는 뜻의 전치사이므로 뒤에 명사나 동명사가 목적어로 와요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 알림은 나타날까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">notifications \u003c/span>\u003cspan class=\"tgt\">appear\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정한 색상과 소리로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">specific \u003c/span>\u003cspan class=\"tgt\">colors \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">sounds\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 알림은 특정한 색상과 소리로 나타날까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바로 앞 문장의 질문과 \u003cb class=\"key\">쌍을 \u003c/b>\u003cb class=\"key\">이루는\u003c/b> 짧은 질문으로, 앱이 알림을 보낼 때 특정 색상과 소리를 사용하는 것도 우연이 아니라 사용자의 주의를 끌기 위한 \u003cb class=\"key\">의도적 \u003c/b>\u003cb class=\"key\">선택\u003c/b>임을 지적한다. 앱의 작은 요소까지도 \u003cb class=\"key\">심리학과 \u003c/b>\u003cb class=\"key\">이윤 \u003c/b>\u003cb class=\"key\">동기\u003c/b>에 뿌리를 둔 설계라는 점을 학생이 의심하도록 이끈다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Why 의문문과 do 조동사\u003c/span> : Why + do + 주어 + 동사원형 : \"왜 알림이 나타나는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with의 방식·도구 용법\u003c/span> : appear + [with + 명사구] : \"특정한 색상과 소리로\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Why do notifications appear, 왜 알림은 나타날까. with specific colors and sounds?, 특정한 색상과 소리로. 이 문장 전체를 해석하면, 왜 알림은 특정한 색상과 소리로 나타날까?","hl":"m"},{"n":28,"text":"이 짧은 질문은 바로 앞 문장의 질문과 짝을 이루면서 앱 설계에서 알림의 색상과 소리까지도 의도된 선택임을 지적합니다. 알림이 붉은색, 특정 소리로 나타나는 것이 우연이 아니라 사용자의 주의를 끌기 위한 설계라는 점을 생각하게 합니다. 그래서 이 두 질문은 인기 앱 설계를 분석하는 구체적인 수업 내용이 됩니다.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 Why do notifications appear입니다. why로 시작하는 의문문에서는 의문사 다음에 do라는 조동사가 오고 주어인 notifications, 동사원형 appear가 오는 어순이에요. 두 번째 어법 포인트는 with specific colors and sounds입니다. 여기서 with는 특정한 색상과 소리로 나타난다는 방식이나 수단을 나타내는 전치사로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 것들을 의도적인 디자인 선택으로 취급함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">treating \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">deliberate \u003c/span>\u003cspan class=\"tgt\">design \u003c/span>\u003cspan class=\"tgt\">choices\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(흔히 심리학과 이윤 동기에 뿌리를 둔),\u003c/span>\u003cspan class=\"en\">(often \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rooted \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">psychology \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">profit \u003c/span>\u003cspan class=\"tgt\">motives\u003c/span>),\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">젊은이들은 더 비판적인 사용자가 된다\u003c/span>\u003cspan class=\"en\">young people become more critical users\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수동적인 소비자가 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">passive \u003c/span>\u003cspan class=\"tgt\">consumers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 것들을 (흔히 심리학과 이윤 동기에 뿌리를 둔) 의도적인 디자인 선택으로 취급함으로써, 젊은이들은 수동적인 소비자가 아니라 더 비판적인 사용자가 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지문 전체의 마지막 결론으로, 앞서 설명한 앱과 사이트 설계 분석을 종합합니다. 우연이 아니라 심리학과 이윤 동기에 뿌리를 둔 의도적인 디자인 선택으로 보면, 젊은이들이 휘둘리는 소비자가 아니라 주체적으로 판단하는 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사용자\u003c/b>가 된다는 것을 강조합니다. 특히 \u003cb class=\"key\">수동적 \u003c/b>\u003cb class=\"key\">소비자\u003c/b>와 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사용자\u003c/b>를 대조하여 주의력 문해력 교육의 지향점을 드러내는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사 (방법·수단)\u003c/span> : By + [treating these as deliberate design choices (동명사구)] : \"이러한 것들을 의도적인 디자인 선택으로 취급함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사(구)의 수동·형용사적 용법\u003c/span> : choices (which are) rooted in psychology and profit motives : \"심리학과 이윤 동기에 뿌리를 둔\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">rather than을 이용한 비교·병렬 표현\u003c/span> : more critical users rather than passive consumers : \"수동적인 소비자가 아니라 더 비판적인 사용자\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"By treating these as deliberate design choices, 이러한 것들을 의도적인 디자인 선택으로 취급함으로써. (often rooted in psychology and profit motives), (흔히 심리학과 이윤 동기에 뿌리를 둔). young people become more critical users, 젊은이들은 더 비판적인 사용자가 된다. rather than passive consumers, 수동적인 소비자가 아니라. 이 문장 전체를 해석하면, 이러한 것들을 (흔히 심리학과 이윤 동기에 뿌리를 둔) 의도적인 디자인 선택으로 취급함으로써, 젊은이들은 수동적인 소비자가 아니라 더 비판적인 사용자가 된다.","hl":"m"},{"n":31,"text":"이 문장은 글 전체의 마지막 결론이에요. 앱이나 사이트의 설계를 우연이 아니라 심리학과 이윤 동기에 뿌리를 둔 의도적인 디자인 선택으로 보면, 젊은이들이 수동적인 소비자가 아니라 더 비판적인 사용자가 된다고 정리합니다. 특히 수동적인 소비자와 비판적인 사용자를 대조해서 주체적인 태도를 강조하는 문장이에요.","hl":"mn"},{"n":32,"text":"첫 번째 포인트, By treating these as deliberate design choices에서 By 다음에 treating이 온 것은 전치사 by의 목적어로 동명사가 쓰였기 때문이에요. 여기서 by는 수단이나 방법을 나타내고, treating은 이러한 것들을 의도적인 디자인 선택으로 취급한다는 뜻이에요. 이때 as는 취급의 결과로 붙는 목적격 보어를 이끌어요. 두 번째 포인트, rooted in psychology and profit motives는 수동의 과거분사예요. 디자인 선택이 뿌리를 내린 게 아니라 심리학과 이윤 동기에 뿌리를 둔 것이므로 rooted를 썼고, 앞의 design choices를 수식하는 형용사 역할을 해요. 세 번째 포인트, rather than passive consumers는 수동적인 소비자가 아니라라는 비교 표현으로, 앞의 more critical users와 병렬 대조를 이룹니다. rather than은 앞의 것을 선택하는 뉘앙스를 강조해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>진보적 교육자와 사서는 \u003cb class=\"key\">주의력 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>을 가르치는 교육과정을 개발하고 있다.\u003c/li>\u003cli>소셜 미디어 피드나 뉴스 사이트의 구조는 의도적으로 사용자를 \u003cb class=\"key\">산만하게 \u003c/b>\u003cb class=\"key\">하거나 \u003c/b>\u003cb class=\"key\">자극하도록\u003c/b> 설계되어 있다.\u003c/li>\u003cli>미디어 문해력 수업은 \u003cb class=\"key\">클릭베이트\u003c/b> 인식, \u003cb class=\"key\">알고리즘\u003c/b> 역할 이해, 자신의 \u003cb class=\"key\">주의산만 \u003c/b>\u003cb class=\"key\">패턴\u003c/b> 관찰을 포함한다.\u003c/li>\u003cli>이러한 의도적인 디자인 선택을 분석함으로써 젊은이들은 \u003cb class=\"key\">수동적인 \u003c/b>\u003cb class=\"key\">소비자\u003c/b>가 아니라 \u003cb class=\"key\">비판적인 \u003c/b>\u003cb class=\"key\">사용자\u003c/b>가 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Young people should learn to recognize the deliberate design choices behind digital media so that they become critical users rather than passive consumers.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 진보적 교육자와 사서는 \u003cb class=\"key\">주의력 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>을 가르치는 교육과정을 개발하고 있으며, 학생들이 소셜 미디어 피드나 뉴스 사이트의 구조가 \u003cb class=\"key\">의도적인 \u003c/b>\u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">선택\u003c/b>임을 인식하게 하여 수동적 소비자가 아닌 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사용자\u003c/b>가 되도록 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글을 정리하면 디지털 미디어의 화면 구성과 기능들은 우연이 아니라 사용자의 주의를 붙잡고 이윤을 얻기 위한 의도적인 설계입니다. 학생들이 이런 설계를 스스로 관찰하고 분석하는 훈련을 하면 그냥 끌려 다니는 소비자가 아니라 주도적으로 판단하는 비판적 사용자로 성장할 수 있어요. 주의력 문해력이라는 개념을 기억하면서 여러분도 평소에 앱을 쓸 때 한 번쯤 그 설계 의도를 생각해 보길 바랍니다. 오늘 수고 많았어요.","hl":null}]}]});</script></body></html>
