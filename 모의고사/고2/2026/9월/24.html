agmentation)를 유발하죠. 따라서 단순히 가짜 뉴스와 정보의 참거짓을 판별하던 기존의 미디어 리터러시(Media literacy)를 넘어, 이러한 디지털 환경의 숨은 설계 의도를 간파하고 내 집중력을 주도적으로 지켜내는 주의력 리터러시(Attention literacy)가 왜 오늘날 교육의 필수 역량으로 떠오르고 있는지 본문을 통해 흥미롭게 확인하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01주의력 리터러시의 개념</div><ul><li>교육자들은 학생들이 디지털 환경의 의도를 파악할 수 있도록 새로운 교육 과정을 개발하고 있다.</li><li>핵심 개념: 주의력 리터러시(attention literacy)</li><li>소셜 미디어나 뉴스 사이트의 구조(architecture)가 의도적으로 설계되었음을 인식함</li><li>주요 목적: 플랫폼이 어떻게 주의를 분산(distract)시키고 자극(provoke)하는지 파악</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02미디어 리터러시 교육의 변화</div><ul><li>전통적인 출처 평가를 넘어 현대 디지털 환경에 맞춘 새로운 내용이 교육에 포함되고 있다.</li><li>과거: 정보 출처의 신뢰성(credibility) 평가에 집중</li><li>현재: 클릭베이트(clickbait) 인식 및 알고리즘(algorithms)의 역할 이해 추가</li><li>자신의 주의 산만 패턴(patterns of distraction) 관찰 유도</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03교육 과정의 실제 사례</div><ul><li>학생들의 자기 인식을 높이고 앱의 디자인 의도를 분석하게 하는 구체적인 과제들이 주어진다.</li><li>파편화(fragmentation)에 대한 자기 인식: 과제 중 스마트폰 확인 횟수 추적</li><li>앱 디자인 분석: 페이지 대신 무한 스크롤(infinite scrolling)을 사용하는 이유 탐구</li><li>알림에 특정 색상과 소리가 사용되는 원리 파악</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04교육의 궁극적 목표</div><ul><li>디지털 플랫폼의 설계 의도를 간파하여 능동적이고 비판적인 미디어 이용 태도를 기른다.</li><li>앱의 설계를 심리학과 이윤 동기(profit motives)에 기반한 의도적 선택으로 간주</li><li>수동적 소비자(passive consumers)에서 벗어나게 함</li><li>주체적이고 비판적인 사용자(critical users)로 성장하도록 도움</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">progressive</td><td class=\"m\">진보적인, 점진적인</td></tr><tr><td class=\"w\">curriculum</td><td class=\"m\">교육과정, 교과과정</td></tr><tr><td class=\"w\">literacy</td><td class=\"m\">문해력, 이해력, 읽고 쓰는 능력</td></tr><tr><td class=\"w\">deliberately</td><td class=\"m\">의도적으로, 고의로</td></tr><tr><td class=\"w\">distract</td><td class=\"m\">주의를 딴 데로 돌리다, 산만하게 하다</td></tr><tr><td class=\"w\">provoke</td><td class=\"m\">자극하다, 유발하다, 도발하다</td></tr><tr><td class=\"w\">evaluate</td><td class=\"m\">평가하다, 감정하다</td></tr><tr><td class=\"w\">credibility</td><td class=\"m\">신뢰성, 진실성</td></tr><tr><td class=\"w\">serve up</td><td class=\"m\">~을 제공하다, 내놓다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be tasked with</td><td class=\"m\">~의 임무를 맡다, ~을 하도록 지시받다</td></tr><tr><td class=\"w\">fragmentation</td><td class=\"m\">파편화, 단편화, 분열</td></tr><tr><td class=\"w\">unpack</td><td class=\"m\">분석하다, 짐을 풀다</td></tr><tr><td class=\"w\">instead of</td><td class=\"m\">~대신에</td></tr><tr><td class=\"w\">notification</td><td class=\"m\">알림, 통지, 신고</td></tr><tr><td class=\"w\">be rooted in</td><td class=\"m\">~에 뿌리를 두다, ~에 기인하다</td></tr><tr><td class=\"w\">motive</td><td class=\"m\">동기, 목적, 이유</td></tr><tr><td class=\"w\">critical</td><td class=\"m\">비판적인, 중요한, 위태로운</td></tr><tr><td class=\"w\">passive</td><td class=\"m\">수동적인, 소극적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">진보적인 교육자들과 사서들은</span><span class=\"en\"><b>Progressive educators and librarians</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">교육과정을 개발하고 있다</span><span class=\"en\"><b>are developing curricula</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가르치기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to teach</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 주의력 문해력이라 부를 만한 것을.</span><span class=\"en\"><b><span class=\"grammar-hl\">what</span> we might <span class=\"grammar-hl\">call attention literacy</span>.</b></span></div></div><div class=\"lec-sent-ko\">진보적인 교육자들과 사서들은 우리가 주의력 문해력이라 부를 만한 것을 가르치기 위한 교육과정을 개발하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로, 교육계에서 새롭게 떠오르는 주제를 소개합니다. attention literacy는 단순히 글을 읽고 쓰는 능력을 넘어, 현대 사회에서 자신의 주의력을 통제하고 지키는 능력을 가리킵니다. 정보가 넘쳐나는 디지털 환경 속에서 학생들에게 꼭 필요한 새로운 교육 개념이 등장했음을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to teach (to부정사): 명사 curricula를 수식하는 형용사적 용법(~할 커리큘럼)이거나, 목적을 나타내는 부사적 용법(~하기 위해)으로 구조를 이룬다.</div><div class=\"lec-gr-item\">what (관계대명사): 선행사를 포함하여 명사절을 이끌며, 앞선 teach의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">call attention literacy 5형식(SVOC) 구조: 기본구조인 &#39;call + O + OC (O를 OC라고 부르다)&#39;에서 관계대명사 what이 목적어(O) 역할을 하여 빠져 있고, attention literacy가 목적격 보어(OC)로 남은 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">progressive</td><td class=\"m\">진보적인, 점진적인</td></tr><tr><td class=\"w\">literacy</td><td class=\"m\">문해력, 이해력, 읽고 쓰는 능력</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 의미한다</span><span class=\"en\"><b>This means</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들이 인식하도록 돕는 것을,</span><span class=\"en\"><b><span class=\"grammar-hl\">helping students recognize</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>for example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">소셜 미디어 피드나 뉴스 사이트의 구조가 어떻게</span><span class=\"en\"><b><span class=\"grammar-hl\">how the architecture of a social media feed or a news site</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의도적으로 설계되었는지</span><span class=\"en\"><b><span class=\"grammar-hl\">is deliberately designed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">학생들을 산만하게 하거나 자극하도록.</span><span class=\"en\"><b><span class=\"grammar-hl\">to distract or provoke</span> them.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 이것은 소셜 미디어 피드나 뉴스 사이트의 구조가 학생들을 산만하게 하거나 자극하도록 어떻게 의도적으로 설계되었는지 그들이 인식하도록 돕는 것을 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 &#39;주의력 리터러시&#39;가 구체적으로 어떤 내용인지 예를 들어 설명합니다. the architecture of a social media feed를 &#39;피드의 건축물&#39;이라고 직역하기보다 &#39;소셜 미디어 화면의 구조나 설계 방식&#39;이라고 이해하면 의미가 훨씬 선명해집니다. 기업들이 사용자들의 시선을 빼앗고 감정을 자극하기 위해 화면 배치와 기능을 고도로 계산하여 만들고 있다는 사실을 깨닫게 하는 것이 이 교육의 핵심입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">helping (동명사): 동사 means의 목적어 역할을 하는 명사적 쓰임이다.</div><div class=\"lec-gr-item\">helping students recognize 5형식(SVOC) 구조: 사역동사(준사역동사) help + 목적어(students) + 목적격 보어(동사원형 recognize) 구조이다.</div><div class=\"lec-gr-item\">how the architecture of a social media feed or a news site is deliberately designed (간접의문문): &#39;의문사(how) + 주어(the architecture...) + 동사(is...designed)&#39; 어순으로 명사절을 이루어 동사 recognize의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">is deliberately designed (수동태): be동사(is) + p.p.(designed) 구조. design은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is designed 형태로 쓴다. 기본구조: design + O + toV (O를 ~하도록 설계하다)에서 목적어가 주어로 올라가고 보어인 toV가 남는 구조이다.</div><div class=\"lec-gr-item\">to distract or provoke (to부정사): 수동태로 전환된 5형식 구조(be designed toV)에서 목적어가 주어로 간 뒤 남아있는 목적격 보어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deliberately</td><td class=\"m\">의도적으로, 고의로</td></tr><tr><td class=\"w\">distract</td><td class=\"m\">주의를 딴 데로 돌리다, 산만하게 하다</td></tr><tr><td class=\"w\">provoke</td><td class=\"m\">자극하다, 유발하다, 도발하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">미디어 문해력 수업은</span><span class=\"en\"><b>Classes in media literacy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전통적으로 다루었지만</span><span class=\"en\"><b>traditionally cover</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 정보원의 신뢰성을 평가하는지</span><span class=\"en\"><b><span class=\"grammar-hl\">how to evaluate</span> the credibility of sources ―</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">― 이제는 또한 포함한다</span><span class=\"en\"><b>now they also include</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">클릭베이트(특정 링크를 클릭하도록 유도하는 수법)를 인식하고,</span><span class=\"en\"><b><span class=\"grammar-hl\">recognizing</span> clickbait,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알고리즘의 역할을 이해하며,</span><span class=\"en\"><b><span class=\"grammar-hl\">understanding</span> the role of algorithms</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 콘텐츠가 제공되는 것에 있어</span><span class=\"en\"><b>in <span class=\"grammar-hl\">what content is served up</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신만의 주의산만 패턴을 관찰하는 것도.</span><span class=\"en\"><b>and <span class=\"grammar-hl\">observing</span> one's own patterns of distraction.</b></span></div></div><div class=\"lec-sent-ko\">미디어 문해력 수업은 전통적으로 어떻게 정보원의 신뢰성을 평가하는지 다루었지만, 이제는 클릭베이트(특정 링크를 클릭하도록 유도하는 수법)를 인식하고, 어떤 콘텐츠가 제공되는 것에 있어 알고리즘의 역할을 이해하며, 자신만의 주의산만 패턴을 관찰하는 것도 포함한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 과거와 현재의 미디어 교육이 어떻게 달라졌는지 비교하며 글의 논리를 전개합니다. 과거에는 뉴스와 정보가 진짜인지 가짜인지 판별하는 데 집중했다면, 현대에는 recognizing clickbait나 알고리즘의 작동 방식을 파악하여 기술이 우리의 주의력을 어떻게 조종하는지 방어하는 방향으로 교육이 확장되었음을 보여줍니다. 덧붙여 자신이 스마트폰에 어떻게 빠져드는지 스스로 돌아보는 메타인지 능력도 중요해졌다는 것을 알 수 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how to evaluate 의문사 + to부정사: &#39;how + to부정사(~하는 방법)&#39; 형태로 명사구 역할을 하여 동사 cover의 목적어가 된다.</div><div class=\"lec-gr-item\">recognizing (동명사): 동사 include의 목적어 역할을 하며, 뒤의 understanding, observing과 병렬구조를 이룬다.</div><div class=\"lec-gr-item\">understanding (동명사): 동사 include의 목적어 역할을 하며 recognizing과 병렬구조를 이룬다.</div><div class=\"lec-gr-item\">what content is served up (간접의문문): 의문형용사(what)가 포함된 명사구(what content)가 주어 역할을 하고 뒤에 동사(is served up)가 오는 &#39;의문사(주어) + 동사&#39; 어순으로 전치사 in의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">is served up (수동태): be동사(is) + p.p.(served) 구조. serve(up)는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is served 형태로 쓴다. 기본구조: serve up + O (O를 제공하다).</div><div class=\"lec-gr-item\">observing (동명사): 동사 include의 목적어 역할을 하며 앞의 동명사들과 병렬구조를 이룬다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">literacy</td><td class=\"m\">문해력, 이해력, 읽고 쓰는 능력</td></tr><tr><td class=\"w\">distract</td><td class=\"m\">주의를 딴 데로 돌리다, 산만하게 하다</td></tr><tr><td class=\"w\">evaluate</td><td class=\"m\">평가하다, 감정하다</td></tr><tr><td class=\"w\">credibility</td><td class=\"m\">신뢰성, 진실성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">학생은</span><span class=\"en\"><b>A student</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과제를 받을 수도 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">might be tasked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">추적하는</span><span class=\"en\"><b>with <span class=\"grammar-hl\">tracking</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">얼마나 여러 번</span><span class=\"en\"><b><span class=\"grammar-hl\">how many times</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작업을 전환하거나 전화기를 확인하는지</span><span class=\"en\"><b><span class=\"grammar-hl\">they switch tasks or check their phone</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">숙제하는 한 시간에,</span><span class=\"en\"><b>in an hour of homework,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자기 인식을 높이기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to raise</span> self-awareness</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">프래그멘테이션(정보를 의도적으로 흩어놓거나 단계를 복잡하게 쪼개는 수법)에 대한.</span><span class=\"en\"><b>about fragmentation.</b></span></div></div><div class=\"lec-sent-ko\">학생은 프래그멘테이션(정보를 의도적으로 흩어놓거나 단계를 복잡하게 쪼개는 수법)에 대한 자기 인식을 높이기 위해, 숙제하는 한 시간에 얼마나 여러 번 작업을 전환하거나 전화기를 확인하는지 추적하는 과제를 받을 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 바로 앞 문장에서 언급한 &#39;자신만의 주의 산만 패턴 관찰&#39;을 실제 교실에서 어떻게 과제로 내주는지 구체적인 상황을 그려줍니다. raise self-awareness about fragmentation은 자신의 집중력이 하나로 길게 이어지지 못하고 여러 가지 일이나 스마트폰 알림 때문에 조각조각 끊어지고 있다는 사실을 학생 스스로 생생하게 체감하도록 만든다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">might be tasked (수동태): be동사(be) + p.p.(tasked) 구조. task는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 be tasked 형태로 쓴다. 기본구조: task + O + with B (O에게 B의 과업을 맡기다)에서 목적어가 주어로 올라가고 전치사구 with B가 남은 형태이다.</div><div class=\"lec-gr-item\">tracking (동명사): 전치사 with의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">how many times they switch tasks or check their phone (간접의문문): &#39;의문사구(how many times) + 주어(they) + 동사(switch... or check...)&#39; 어순으로 명사절을 이루어 동명사 tracking의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">to raise (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~하기 위해&#39;라는 의미를 나타내는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be tasked with</td><td class=\"m\">~의 임무를 맡다, ~을 하도록 지시받다</td></tr><tr><td class=\"w\">fragmentation</td><td class=\"m\">파편화, 단편화, 분열</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또 다른 수업은</span><span class=\"en\"><b>Another lesson</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">포함할 수 있다</span><span class=\"en\"><b>might involve</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인기 앱들의 설계를 분석하는 것을:</span><span class=\"en\"><b><span class=\"grammar-hl\">unpacking</span> the design of popular apps:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜 앱은</span><span class=\"en\"><b>Why does an app</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무한 스크롤을 사용할까</span><span class=\"en\"><b>use <span class=\"grammar-hl\">infinite scrolling</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">페이지 대신?</span><span class=\"en\"><b>instead of pages?</b></span></div></div><div class=\"lec-sent-ko\">또 다른 수업은 인기 앱들의 설계를 분석하는 것을 포함할 수 있다. 왜 앱은 페이지 대신 무한 스크롤을 사용할까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 4번 문장에 이어, 두 번째 구체적인 수업 방식을 제시합니다. unpacking the design of popular apps에서 unpack은 짐을 푼다는 뜻에서 나아가, 앱이 왜 하필 이런 모양과 기능을 갖게 되었는지 그 속에 숨겨진 의도와 구조를 낱낱이 파헤쳐 분석한다는 뜻을 담고 있습니다. &#39;무한 스크롤&#39;처럼 우리가 무심코 편리하다고 느끼는 기능조차 사용자가 앱을 끄지 못하게 만들려는 치밀한 장치임을 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">unpacking (동명사): 동사 involve의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">infinite scrolling (동명사(명사적)): -ing 형태인 scrolling이 &#39;스크롤하기&#39;라는 활동/기능을 나타내는 명사적 개념으로 쓰여 infinite의 수식을 받는다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unpack</td><td class=\"m\">분석하다, 짐을 풀다</td></tr><tr><td class=\"w\">instead of</td><td class=\"m\">~대신에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">왜 알림은 나타날까</span><span class=\"en\"><b>Why do notifications <span class=\"grammar-hl\">appear</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정한 색상과 소리로?</span><span class=\"en\"><b>with specific colors and sounds?</b></span></div></div><div class=\"lec-sent-ko\">왜 알림은 특정한 색상과 소리로 나타날까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과 같은 맥락으로, 수업에서 다루는 또 다른 질문을 던집니다. 앱에서 알림이 울릴 때 강렬한 빨간색 배지가 뜨거나 뾰족한 소리가 나는 것이 우연이 아니라, 인간의 본능적인 호기심과 불안감을 이끌어내기 위해 철저히 계산된 장치임을 암시하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">appear (자동사): 주어(notifications) 뒤에 쓰여 &#39;나타나다&#39;의 의미를 가지며 목적어가 필요 없는 1형식 동사 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">notification</td><td class=\"m\">알림, 통지, 신고</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 것들을 취급함으로써</span><span class=\"en\"><b>By <span class=\"grammar-hl\">treating these</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의도적인 디자인 선택으로</span><span class=\"en\"><b><span class=\"grammar-hl\">as deliberate design choices</span> (often <span class=\"grammar-hl\">rooted</span> in psychology and profit motives),</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(흔히 심리학과 이윤 동기에 뿌리를 둔),</span><span class=\"en\"><b>young people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">젊은이들은</span><span class=\"en\"><b>become more critical users</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 비판적인 사용자가 된다</span><span class=\"en\"><b>rather than passive consumers.</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">수동적인 소비자가 아니라.</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">이러한 것들을 (흔히 심리학과 이윤 동기에 뿌리를 둔) 의도적인 디자인 선택으로 취급함으로써, 젊은이들은 수동적인 소비자가 아니라 더 비판적인 사용자가 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론부에 해당하며, 앞서 열거한 주의력 리터러시 교육의 궁극적인 목적과 효과를 정리합니다. deliberate design choices — 글쓴이는 여기서 힘주어 말합니다. 앱의 기능과 화면은 단순히 보기 좋게 만든 것이 아니라, 사람들의 뇌와 심리를 자극해 기업의 이윤을 극대화하려는 철저한 상업적 의도의 결과물이라는 의미입니다. 이를 통해 학생들이 스마트폰이 주는 대로만 멍하게 받아들이는 상태에서 벗어나, 기술의 의도를 꿰뚫어 보고 주체적으로 앱을 통제하는 능력을 갖추게 됨을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">treating (동명사): 전치사 by의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">treating these as deliberate design choices 5형식(SVOC) 변형 관용구조: treat + O + as + B (O를 B로 취급하다/여기다) 구조로, these가 목적어, deliberate design choices가 목적격 보어 역할을 한다.</div><div class=\"lec-gr-item\">rooted (과거분사(형용사)): rooted가 앞의 명사 choices를 수식(= &#39;뿌리를 둔 선택&#39;). N + p.p. ≈ &#39;N that is/was p.p.&#39; 형태의 축약 관계절로 기능한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">motive</td><td class=\"m\">동기, 목적, 이유</td></tr><tr><td class=\"w\">critical</td><td class=\"m\">비판적인, 중요한, 위태로운</td></tr><tr><td class=\"w\">passive</td><td class=\"m\">수동적인, 소극적인</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>최근 교육계에서는 학생들이 디지털 환경에서 자신의 집중력을 지킬 수 있도록 돕는 &#39;주의력 리터러시&#39; 교육을 도입하고 있다.</li><li>과거 미디어 교육이 정보의 사실 확인에 집중했다면, 지금은 알고리즘과 클릭베이트가 우리의 주의를 어떻게 빼앗는지 가르친다.</li><li>학생들은 자신의 주의력 분산 패턴을 기록하고, 무한 스크롤이나 알림 소리 등 앱 디자인에 숨겨진 기업의 의도를 분석한다.</li><li>이러한 교육을 통해 학생들은 상업적 의도에 휘둘리는 수동적 소비자에서 벗어나, 기술을 주체적으로 통제하는 비판적 사용자로 성장하게 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Educators teach attention literacy to reveal the intentional manipulative design of digital media, and encourage students to become critical users rather than passive consumers.</div>\n              <div class=\"lec-final-sum-ko\">교육자들은 디지털 미디어의 의도적인 조작 설계를 밝히기 위해 주의력 리터러시를 가르치고, 학생들이 수동적인 소비자 대신 비판적인 사용자가 되도록 장려한다.</div></div></div>"],"segs":[[{"audio":"./24_audio/1.mp3","hl":null}],[{"audio":"./24_audio/2.mp3","hl":null}],[{"audio":"./24_audio/3.mp3","hl":null},{"audio":"./24_audio/4.mp3","hl":"stage-0"},{"audio":"./24_audio/5.mp3","hl":"stage-1"},{"audio":"./24_audio/6.mp3","hl":"stage-2"},{"audio":"./24_audio/7.mp3","hl":"stage-3"}],[{"audio":"./24_audio/8.mp3","hl":null}],[{"audio":"./24_audio/9.mp3","hl":"main"},{"audio":"./24_audio/10.mp3","hl":"meaning"},{"audio":"./24_audio/11.mp3","hl":"grammar"}],[{"audio":"./24_audio/12.mp3","hl":"main"},{"audio":"./24_audio/13.mp3","hl":"meaning"},{"audio":"./24_audio/14.mp3","hl":"grammar"}],[{"audio":"./24_audio/15.mp3","hl":"main"},{"audio":"./24_audio/16.mp3","hl":"meaning"},{"audio":"./24_audio/17.mp3","hl":"grammar"}],[{"audio":"./24_audio/18.mp3","hl":"main"},{"audio":"./24_audio/19.mp3","hl":"meaning"},{"audio":"./24_audio/20.mp3","hl":"grammar"}],[{"audio":"./24_audio/21.mp3","hl":"main"},{"audio":"./24_audio/22.mp3","hl":"meaning"},{"audio":"./24_audio/23.mp3","hl":"grammar"}],[{"audio":"./24_audio/24.mp3","hl":"main"},{"audio":"./24_audio/25.mp3","hl":"meaning"},{"audio":"./24_audio/26.mp3","hl":"grammar"}],[{"audio":"./24_audio/27.mp3","hl":"main"},{"audio":"./24_audio/28.mp3","hl":"meaning"},{"audio":"./24_audio/29.mp3","hl":"grammar"}],[{"audio":"./24_audio/30.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerO
