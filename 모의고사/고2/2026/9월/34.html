\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입</div><ul><li>새로운 기술의 명백한 측면에만 집중하면 시간에 따라 축적되는 미묘한 변화를 놓치게 된다.</li><li>단기적인 명백한 측면(obvious aspects)에 주로 주목함</li><li>점진적으로 축적되는 미묘한 측면(subtle aspects)은 간과함</li><li>핵심 키워드: 미디어(media), 기술(technology)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02사례 제시</div><ul><li>1980년대 도입된 전자레인지는 조리 시간을 단축하며 단기적인 편리함을 제공했다.</li><li>전자레인지(microwave oven)의 등장으로 음식 준비 시간 단축</li><li>요리 담당자에게 해방감과 편리함(convenience)을 제공함</li><li>핵심 키워드: 단기적 영향(short-term implications)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03장기적 결과</div><ul><li>단기적 편리함 때문에 가족이 함께 모여 식사하는 전통이 사라지는 장기적 결과를 놓쳤다.</li><li>한 사람이 요리하고 가족이 함께 저녁을 먹는(eat dinner) 횟수 감소</li><li>오랜 시간이 걸리는 식사는 과거의 사치(luxury of the past)가 됨</li><li>핵심 키워드: 장기적 영향(long-term implications)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론</div><ul><li>기술이 가족 생활에 미친 이러한 장기적이고 점진적인 영향은 당시에 예상하기 어려웠다.</li><li>가족 생활(family life)에 미친 근본적 변화</li><li>변화를 미리 예상하지 못함(unanticipated)</li><li>핵심 키워드: 예견하기 어려운(difficult to foresee)</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">focus on</td><td class=\"m\">~에 초점을 맞추다, ~에 집중하다</td></tr><tr><td class=\"w\">obvious</td><td class=\"m\">명백한, 분명한</td></tr><tr><td class=\"w\">aspect</td><td class=\"m\">측면, 양상</td></tr><tr><td class=\"w\">accumulate</td><td class=\"m\">축적되다, 모이다</td></tr><tr><td class=\"w\">day to day</td><td class=\"m\">매일매일, 나날이</td></tr><tr><td class=\"w\">apparent</td><td class=\"m\">분명한, 눈에 띄는</td></tr><tr><td class=\"w\">subtle</td><td class=\"m\">미묘한, 감지하기 힘든</td></tr><tr><td class=\"w\">revolutionize</td><td class=\"m\">대변혁을 일으키다, 혁신하다</td></tr><tr><td class=\"w\">the better part of</td><td class=\"m\">~의 대부분, ~의 태반</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fix</td><td class=\"m\">(음식을) 준비하다, 마련하다</td></tr><tr><td class=\"w\">liberate</td><td class=\"m\">해방시키다, 자유롭게 하다</td></tr><tr><td class=\"w\">tend to</td><td class=\"m\">~하는 경향이 있다, ~하기 쉽다</td></tr><tr><td class=\"w\">implication</td><td class=\"m\">영향, 결과, 함의</td></tr><tr><td class=\"w\">overlook</td><td class=\"m\">간과하다, 못 보고 넘어가다</td></tr><tr><td class=\"w\">as time goes on</td><td class=\"m\">시간이 지남에 따라</td></tr><tr><td class=\"w\">except for</td><td class=\"m\">~을 제외하고</td></tr><tr><td class=\"w\">anticipate</td><td class=\"m\">예상하다, 예측하다</td></tr><tr><td class=\"w\">foresee</td><td class=\"m\">예견하다, 내다보다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 매체의 분명한 측면에 집중할 때,</span><span class=\"en\"><b>When we focus on the obvious aspects of media,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 변화를 놓친다</span><span class=\"en\"><b>we miss the changes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간이 흐름에 따라 축적되지만</span><span class=\"en\"><b><span class=\"grammar-hl\">that accumulate over time</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하루 하루 뚜렷하게 보이지 않는</span><span class=\"en\"><b><span class=\"grammar-hl\">but are not apparent day to day</span>.</b></span></div></div><div class=\"lec-sent-ko\">우리가 매체의 분명한 측면에 집중할 때, 우리는 시간이 흐름에 따라 축적되지만 하루 하루 뚜렷하게 보이지 않는 변화를 놓친다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 시작하며 핵심 주제를 던지는 문장입니다. 사람들은 눈에 띄는 겉모습만 보느라, accumulate over time, 즉 오랜 시간 동안 서서히 쌓여서 나중에서야 비로소 드러나는 거대한 변화의 흐름을 알아차리지 못한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that accumulate over time but are not apparent day to day (관계대명사): that이 선행사 the changes를 수식하는 주격 관계대명사절을 이끈다. 절 내부에서 주어가 빠진 자리를 대신하며, 동사 accumulate와 are가 접속사 but으로 병렬 구조를 이룬다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">focus on</td><td class=\"m\">~에 초점을 맞추다, ~에 집중하다</td></tr><tr><td class=\"w\">obvious</td><td class=\"m\">명백한, 분명한</td></tr><tr><td class=\"w\">aspect</td><td class=\"m\">측면, 양상</td></tr><tr><td class=\"w\">accumulate</td><td class=\"m\">축적되다, 모이다</td></tr><tr><td class=\"w\">day to day</td><td class=\"m\">매일매일, 나날이</td></tr><tr><td class=\"w\">apparent</td><td class=\"m\">분명한, 눈에 띄는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리들 대부분은 분명한 측면은 알아차린다</span><span class=\"en\"><b>Most of us notice the obvious aspects</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 매체나 기술의</span><span class=\"en\"><b>of a new medium or technology</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 미묘한 측면들을 놓치는 동안</span><span class=\"en\"><b><span class=\"grammar-hl\">while missing</span> the more subtle aspects.</b></span></div></div><div class=\"lec-sent-ko\">우리들 대부분은 더 미묘한 측면들을 놓치는 동안 새로운 매체나 기술의 분명한 측면은 알아차린다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 주장을 다시 한번 강조하며 구체화합니다. the more subtle aspects를 &#39;더 미묘한 측면&#39;이라고 옮기면 어렵게 느껴집니다. 쉽게 말해 당장 겉으로 크게 드러나지는 않지만 사람들의 일상이나 관계를 서서히 바꿔놓는 숨겨진 영향력을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">while missing (분사구문): 접속사 while의 의미를 명확히 하기 위해 생략하지 않은 현재분사구문이다. 주절의 주어(Most of us)와 같아 생략되었으며, 대명사 we를 사용하여 원래 절로 변환하면 &#39;while we miss&#39;가 된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">obvious</td><td class=\"m\">명백한, 분명한</td></tr><tr><td class=\"w\">aspect</td><td class=\"m\">측면, 양상</td></tr><tr><td class=\"w\">subtle</td><td class=\"m\">미묘한, 감지하기 힘든</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어, 전자레인지를 보라.</span><span class=\"en\"><b><span class=\"grammar-hl\">Take, for example,</span> the microwave oven.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 전자레인지를 보라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이제 앞서 말한 &#39;눈에 띄는 측면과 숨겨진 측면&#39;을 설명하기 위해 친숙한 가전제품을 구체적인 예시로 끌어옵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Take, for example, 관용표현 및 명령문: &#39;take ~ for example(~을 예로 들다)&#39;라는 관용표현이 동사원형 Take로 시작하는 명령문 형태로 쓰여, 구체적인 사례를 제시할 때 사용되는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 4 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 도입되었고</span><span class=\"en\"><b>It <span class=\"grammar-hl\">was introduced</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1980년대 초반에</span><span class=\"en\"><b>in the early 1980s</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식 준비 과정에 혁명을 일으켰다.</span><span class=\"en\"><b>and revolutionized food preparation.</b></span></div></div><div class=\"lec-sent-ko\">그것은 1980년대 초반에 도입되었고 음식 준비 과정에 혁명을 일으켰다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전자레인지가 처음 등장했을 때 가져온 눈에 띄는 변화를 설명합니다. revolutionized food preparation은 요리하는 데 드는 수고와 시간을 극적으로 줄여주어 주방의 풍경을 완전히 뒤바꿔 놓았다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">was introduced (수동태): be동사(was) + p.p.(introduced) 구조. introduce는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 was introduced 형태로 쓴다. 기본구조: introduce + O (O를 도입하다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">revolutionize</td><td class=\"m\">대변혁을 일으키다, 혁신하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">전통적으로,</span><span class=\"en\"><b>Traditionally,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한 사람이 오후의 대부분을 보냈다</span><span class=\"en\"><b>one person <span class=\"grammar-hl\">spent the better part of an afternoon</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족을 위한 저녁 식사를 준비하느라.</span><span class=\"en\"><b><span class=\"grammar-hl\">fixing</span> an evening meal for a family.</b></span></div></div><div class=\"lec-sent-ko\">전통적으로, 한 사람이 가족을 위한 저녁 식사를 준비하느라 오후의 대부분을 보냈다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전자레인지 도입 이전의 과거 상황을 보여주는 문장입니다. the better part of an afternoon은 오후 시간 중 절반 이상을 뜻하며, 과거에는 누군가가 온 가족이 먹을 저녁을 차리기 위해 하루의 상당 시간을 부엌에서 쏟아야 했음을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">spent the better part of an afternoon fixing 관용표현 및 동명사: &#39;spend + 시간/노력 + -ing(~하는 데 시간/노력을 쓰다)&#39;의 관용구조이며, fixing은 전치사(in 등)가 생략된 상태에서 목적어 역할을 하는 동명사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">the better part of</td><td class=\"m\">~의 대부분, ~의 태반</td></tr><tr><td class=\"w\">fix</td><td class=\"m\">(음식을) 준비하다, 마련하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이제,</span><span class=\"en\"><b>Now,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능해졌다</span><span class=\"en\"><b><span class=\"grammar-hl\">it was possible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">음식을 매우 빠르게 준비하는 것이,</span><span class=\"en\"><b><span class=\"grammar-hl\">to prepare</span> foods very quickly,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 이러한 준비 시간의 단축은</span><span class=\"en\"><b>and this shortening of preparation time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해방시켰다</span><span class=\"en\"><b>was liberating</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족 내 요리사들을,</span><span class=\"en\"><b>for the cooks in the family,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들 대부분은 여성인 경향이 있었다.</span><span class=\"en\"><b><span class=\"grammar-hl\">most of whom</span> tended <span class=\"grammar-hl\">to be</span> women.</b></span></div></div><div class=\"lec-sent-ko\">이제 음식을 매우 빠르게 준비하는 것이 가능해졌고, 이러한 준비 시간의 단축은 대부분 여성인 경향이 있었던 가족 내 요리사들을 해방시켰다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전자레인지가 도입된 후 생긴 긍정적이고 명백한 변화를 설명합니다. 요리 시간이 확 줄어들면서, 과거에 주로 부엌일을 전담해야 했던 여성들이 가사 노동의 부담에서 벗어나 자유 시간을 얻게 되었다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it was possible to prepare (가주어): 진주어 및 to부정사: it이 문장의 가주어이고, to prepare foods very quickly가 진주어인 구조이다. to prepare는 진주어 역할을 하는 명사적 용법의 to부정사이다.</div><div class=\"lec-gr-item\">most of whom (관계대명사): &#39;대명사/수량사 + 전치사(of) + 목적격 관계대명사(whom)&#39; 구조로, 콤마(,) 뒤에서 앞의 선행사 the cooks를 부연 설명하는 계속적 용법이다. 절 내부에서 most of whom 전체가 주어 역할을 한다.</div><div class=\"lec-gr-item\">to be (to부정사): 동사 tend의 목적어 역할을 하는 명사적 용법의 to부정사이다. (기본구조: tend + to V)</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 더 큰 편리함이라는 단기적이고 분명한 영향은</span><span class=\"en\"><b>But the short-term, obvious implications of greater convenience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">쉽게 만들었다</span><span class=\"en\"><b><span class=\"grammar-hl\">made it easy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장기적인 영향을 간과하기</span><span class=\"en\"><b><span class=\"grammar-hl\">to overlook</span> the long-term implications</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 이상 한 사람이 음식을 준비하지 않게 되는 것의</span><span class=\"en\"><b>of no longer <span class=\"grammar-hl\">having one person fix</span> food</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가족이 함께 먹기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">for the family to eat</span> together</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저녁 식사에서</span><span class=\"en\"><b>at an evening meal.</b></span></div></div><div class=\"lec-sent-ko\">하지만 더 큰 편리함이라는 단기적이고 분명한 영향은 더 이상 한 사람이 가족이 저녁 식사에서 함께 먹기 위해 음식을 준비하지 않게 되는 것의 장기적인 영향을 간과하기 쉽게 만들었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 긍정적인 변화를 뒤집으며 이 글의 핵심 문제의식을 드러내는 문장입니다. 글쓴이는 여기서 힘주어 말합니다. the short-term, obvious implications, 즉 &#39;조리가 편해졌다&#39;는 눈앞의 이점에 취해서, 온 가족이 함께 먹을 밥을 누군가 정성껏 차리고 그걸 매개로 식탁에 모이던 가족 문화 자체가 사라져버린다는 거대한 결과를 아무도 눈치채지 못했다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">made it easy to overlook 5형식(SVOC) 구조, 가목적어-진목적어 및 to부정사: make(불완전 타동사) + it(가목적어) + easy(목적격 보어) + to overlook~(진목적어)로 이루어진 5형식 구조이다. to overlook은 진목적어 역할을 하는 명사적 용법의 to부정사이다.</div><div class=\"lec-gr-item\">having one person fix 동명사 및 5형식(SVOC) 구조: 전치사 of의 목적어로 쓰인 동명사 having이 사역동사의 성질을 가져, having + one person(목적어) + fix(목적격 보어, 동사원형)의 5형식 구조를 취한다. 목적어와 보어가 능동 관계이므로 목적격 보어로 동사원형(fix)이 쓰였다.</div><div class=\"lec-gr-item\">for the family to eat 의미상 주어 및 to부정사: to eat은 앞의 food를 수식하는 형용사적 용법 또는 목적을 나타내는 부사적 용법의 to부정사이며, for the family는 그 to부정사의 동작 주체를 명시하는 의미상 주어(for + 명사) 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">obvious</td><td class=\"m\">명백한, 분명한</td></tr><tr><td class=\"w\">fix</td><td class=\"m\">(음식을) 준비하다, 마련하다</td></tr><tr><td class=\"w\">implication</td><td class=\"m\">영향, 결과, 함의</td></tr><tr><td class=\"w\">overlook</td><td class=\"m\">간과하다, 못 보고 넘어가다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시간이 흐르면서,</span><span class=\"en\"><b>As time <span class=\"grammar-hl\">went on</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점점 더 적은 수의 가족들이 함께 둘러앉았다</span><span class=\"en\"><b>fewer and fewer families sat down together</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">저녁을 먹기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to eat dinner</span>.</b></span></div></div><div class=\"lec-sent-ko\">시간이 흐르면서, 점점 더 적은 수의 가족들이 저녁을 먹기 위해 함께 둘러앉았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전자레인지라는 기술이 장기적으로 가족의 일상에 미친 영향을 보여줍니다. 각자 편할 때 음식을 쉽게 데워 먹게 되면서, 정해진 시간에 온 식구가 식탁에 둘러앉아 밥을 먹으며 대화하는 풍경이 점차 사라지게 된 현상을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went on (관용표현): &#39;go on(시간이 지나다, 계속되다)&#39;이라는 의미를 나타내는 구조이다.</div><div class=\"lec-gr-item\">to eat dinner (to부정사): 부사적 용법(목적)으로 쓰여 &#39;저녁을 먹기 위해&#39;라는 의미를 나타내는 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 9 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">준비하는 데 오랜 시간이 걸리는 식사는</span><span class=\"en\"><b>Meals <span class=\"grammar-hl\">that took a long time to prepare</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과거의 사치품이 되었다,</span><span class=\"en\"><b>became a luxury of the past,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아마도 특별한 경우를 제외하고는</span><span class=\"en\"><b>except perhaps for special occasions.</b></span></div></div><div class=\"lec-sent-ko\">아마도 특별한 경우를 제외하고는, 준비하는 데 오랜 시간이 걸리는 식사는 과거의 사치품이 되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 오랜 시간이 걸리는 식사 준비가 일상에서 완전히 사라졌음을 덧붙입니다. a luxury of the past는 이제 평소에는 찾아보기 힘들고, 생일이나 명절 같은 특별한 날에만 큰맘 먹고 하는 아주 귀하고 드문 일이 되어버렸다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that took a long time to prepare (관계대명사): that이 선행사 Meals를 수식하는 주격 관계대명사절을 이끈다. 절 내부에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">took a long time to prepare 관용표현 및 to부정사: &#39;take + 시간/노력 + to V(~하는 데 시간/노력이 걸리다)&#39; 구조로 쓰였다. to prepare는 부사적 용법으로 쓰인 to부정사이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 10 / 10</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">전자레인지가 가정 생활에 미친 영향은</span><span class=\"en\"><b>The effects of the microwave oven on family life</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예상되지 못했으며,</span><span class=\"en\"><b><span class=\"grammar-hl\">were not anticipated</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예견하기도 어려웠을 것이다.</span><span class=\"en\"><b>and would have been difficult <span class=\"grammar-hl\">to foresee</span>.</b></span></div></div><div class=\"lec-sent-ko\">전자레인지가 가정 생활에 미친 영향은 예상되지 못했으며, 예견하기도 어려웠을 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 사례를 요약하며 글 전체의 주장을 마무리합니다. 새로운 기술이 처음 등장했을 때 그것이 우리의 인간관계나 삶의 방식을 어떻게 근본적으로 바꿔놓을지는 당장 알아채기 힘들고 미리 짐작할 수도 없다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">were not anticipated (수동태): be동사(were) + p.p.(anticipated) 구조. anticipate는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 were not anticipated 형태로 쓴다. 기본구조: anticipate + O (O를 예상하다).</div><div class=\"lec-gr-item\">to foresee (to부정사): 앞의 형용사 difficult를 수식하는 부사적 용법(형용사 수식)의 to부정사로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">anticipate</td><td class=\"m\">예상하다, 예측하다</td></tr><tr><td class=\"w\">foresee</td><td class=\"m\">예견하다, 내다보다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>우리는 새로운 기술이 등장할 때 겉으로 드러나는 명백한 장점에만 주목하는 경향이 있다.</li><li>전자레인지의 발명은 요리 시간을 획기적으로 줄여주는 큰 편리함을 가져왔다.</li><li>하지만 그 편리함 이면에는 온 가족이 함께 식탁에 모여 밥을 먹는 전통적인 가족 문화의 상실이라는 미묘하고 장기적인 변화가 숨어 있었다.</li><li>이처럼 새로운 기술이 우리의 일상과 관계에 미치는 장기적인 영향력은 당장 눈에 띄지 않아 미리 예측하기가 매우 어렵다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People easily notice the obvious conveniences of new technologies, but they often fail to recognize the subtle and long-term changes in their daily lives.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 새로운 기술의 명백한 편리함을 쉽게 알아차리지만, 일상생활에서 일어나는 미묘하고 장기적인 변화는 종종 인식하지 못한다.</div></div></div>"],"segs":[[{"audio":"./34_audio/1.mp3","hl":null}],[{"audio":"./34_audio/2.mp3","hl":null}],[{"audio":"./34_audio/3.mp3","hl":null},{"audio":"./34_audio/4.mp3","hl":"stage-0"},{"audio":"./34_audio/5.mp3","hl":"stage-1"},{"audio":"./34_audio/6.mp3","hl":"stage-2"},{"audio":"./34_audio/7.mp3","hl":"stage-3"}],[{"audio":"./34_audio/8.mp3","hl":null}],[{"audio":"./34_audio/9.mp3","hl":"main"},{"audio":"./34_audio/10.mp3","hl":"meaning"},{"audio":"./34_audio/11.mp3","hl":"grammar"}],[{"audio":"./34_audio/12.mp3","hl":"main"},{"audio":"./34_audio/13.mp3","hl":"meaning"},{"audio":"./34_audio/14.mp3","hl":"grammar"}],[{"aud
