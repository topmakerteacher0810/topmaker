}
lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 34번","audioDir":"34_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">34번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Obvious Convenience, Subtle Consequences\u003c/h1>\u003ch2>명백한 편리함, 미묘한 결과\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리는 매체의 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">측면\u003c/b>에 집중해 \u003cb class=\"key\">미묘한 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 놓치기 쉽다. 전자레인지가 가져온 \u003cb class=\"key\">단기적 \u003c/b>\u003cb class=\"key\">편리함\u003c/b>은 \u003cb class=\"key\">장기적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>인 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">식사 \u003c/b>\u003cb class=\"key\">감소\u003c/b>를 간과하게 만들었다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Focusing on the obvious short-term convenience of a new technology often makes us overlook its subtle long-term effects.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 고등학교 이학년 구월 모의고사에 출제된 지문을 함께 분석해 보겠습니다. 이 지문은 새로운 기술의 명백한 편리함이 미묘한 장기적 변화를 가리는 문제를 다룹니다. 요약하면, 전자레인지가 가져온 단기적 편리함 때문에 가족 식사 감소 같은 장기적 영향을 놓치기 쉽다는 내용이죠. 요지는 focusing on the obvious short-term convenience of a new technology often makes us overlook its subtle long-term effects입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">새로운 매체나 기술은 대개 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">측면\u003c/b>부터 눈에 띕니다. 예를 들어 전자레인지는 음식 준비 시간을 줄여 주었지만, \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">식사\u003c/b>라는 일상적 의례에는 \u003cb class=\"key\">장기적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 미쳤습니다. 이렇게 단기적으로는 편리해 보여도 시간이 지나면서 축적되는 변화는 \u003cb class=\"key\">하루하루\u003c/b> 잘 보이지 않습니다. 미디어 연구에서는 이런 현상을 \u003cb class=\"key\">unintended \u003c/b>\u003cb class=\"key\">consequences\u003c/b>나 \u003cb class=\"key\">long-term \u003c/b>\u003cb class=\"key\">effects\u003c/b>라고 부릅니다. 우리도 스마트폰의 편리함 때문에 대화 시간이 줄어드는 변화를 나중에야 알아차리는 경우가 많죠.\u003c/div>","segs":[{"n":2,"text":"새로운 매체나 기술은 대개 명백한 측면부터 눈에 띄어요. 전자레인지는 음식 준비 시간을 줄여 주었지만, 가족 식사라는 일상적 의례에는 장기적 영향을 미쳤습니다. 이렇게 단기적으로는 편리해 보여도 시간이 지나면서 축적되는 변화는 하루하루 잘 보이지 않아요. 미디어 연구에서는 이런 현상을 unintended consequences나 long-term effects라고 부릅니다. 우리도 스마트폰의 편리함 때문에 대화 시간이 줄어드는 변화를 나중에야 알아차리는 경우가 많죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>명백한 측면과 미묘한 변화\u003csmall>주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>우리가 매체의 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">측면\u003c/b>에 집중하면, 시간이 흐르며 축적되지만 하루하루 뚜렷하게 보이지 않는 \u003cb class=\"key\">변화\u003c/b>를 놓친다. 대부분의 사람들은 새로운 매체나 기술의 \u003cb class=\"key\">미묘한 \u003c/b>\u003cb class=\"key\">측면\u003c/b>을 놓치면서도 눈에 보이는 측면만 알아차린다. 즉 저자는 글의 첫머리에서 \u003cb class=\"key\">단기적 \u003c/b>\u003cb class=\"key\">인식\u003c/b>과 \u003cb class=\"key\">장기적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>의 괴리를 주장한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>전자레인지 도입과 편리함\u003csmall>예시 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>대표적 사례로 \u003cb class=\"key\">전자레인지\u003c/b>가 등장한다. 전자레인지는 1980년대 초에 도입되어 \u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">준비\u003c/b>에 혁명을 일으켰다. 전통적으로는 한 사람이 오후 대부분을 가족의 저녁 식사를 준비하는 데 썼지만, 이제 음식을 빠르게 준비할 수 있게 되었다. 이 \u003cb class=\"key\">준비 \u003c/b>\u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">단축\u003c/b>은 대부분 여성이었던 가족 내 요리사에게 \u003cb class=\"key\">해방감\u003c/b>을 주었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>간과된 장기적 결과\u003csmall>전환 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>하지만 더 큰 \u003cb class=\"key\">편리함\u003c/b>이라는 단기적이고 분명한 영향은 \u003cb class=\"key\">장기적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 간과하기 쉽게 만들었다. 곧, 더 이상 한 사람이 가족이 함께 먹기 위해 음식을 준비하지 않게 되는 변화가 생겼다. 시간이 흐르면서 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">식사\u003c/b>를 함께하는 가정은 점점 줄어들었고, 오래 준비하는 식사는 \u003cb class=\"key\">사치품\u003c/b>이 되었다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>예측 어려운 영향\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>전자레인지가 \u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">생활\u003c/b>에 미친 영향은 예상되지 못했고, 예견하기도 어려웠다. 이는 기술의 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">측면\u003c/b>에만 집중하면 \u003cb class=\"key\">미묘한 \u003c/b>\u003cb class=\"key\">장기적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 놓친다는 첫 주장을 다시 확인시킨다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 처음 두 문장에서 주장을 제시하고, 전자레인지 사례를 들어 설명한 뒤, 마지막에 다시 장기적 영향의 예측 어려움을 정리하는 흐름입니다.","hl":null},{"n":4,"text":"첫 번째 문장과 두 번째 문장에서는 핵심 주장이 나옵니다. 우리가 매체의 명백한 측면에 집중하면 시간이 흐르며 축적되는 변화를 놓친다는 것이죠. 대부분의 사람들은 새로운 기술의 미묘한 측면을 놓치고 눈에 보이는 측면만 알아차립니다. 그러니까 글의 도입부에서 단기적 인식과 장기적 변화의 괴리를 미리 깔아 두는 겁니다.","hl":"f0"},{"n":5,"text":"이제 전자레인지 예시가 나옵니다. 전자레인지는 음식 준비에 혁명을 일으켰고, 전통적으로 한 사람이 오후 내내 하던 저녁 식사 준비를 빠르게 바꿔 놓았어요. 이 준비 시간의 단축은 가족 내 요리사, 특히 여성에게 해방감을 주었지요. 이렇게 단기적 편리함은 분명하게 드러납니다.","hl":"f1"},{"n":6,"text":"하지만 일곱 번째 문장에서 흐름이 전환됩니다. 더 큰 편리함이라는 단기적이고 분명한 영향 때문에 장기적 영향을 간과하기 쉬워졌어요. 더 이상 한 사람이 가족이 함께 먹기 위해 음식을 준비하지 않게 되는 변화가 생긴 거죠. 시간이 흐르면서 함께 저녁을 먹는 가족이 줄어들고, 오래 준비하는 식사는 사치품이 되었습니다.","hl":"f2"},{"n":7,"text":"마지막 문장은 이 사례의 결론입니다. 전자레인지가 가정 생활에 미친 영향은 예상되지 못했고 예견하기도 어려웠다고 정리하죠. 이는 처음에 말한 명백한 측면에 집중하면 미묘한 장기적 변화를 놓친다는 주장을 다시 확인해 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 처음 두 문장에서 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">측면\u003c/b>에 집중하면 \u003cb class=\"key\">미묘한 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 놓친다는 핵심 주장을 제시한다. 이어서 'Take, for example'로 \u003cb class=\"key\">전자레인지\u003c/b> 예시를 들며 주장을 뒷받침하고, 마지막 문장에서 다시 \u003cb class=\"key\">장기적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>의 예측 어려움을 강조한다. 따라서 \u003cb class=\"key\">두괄식\u003c/b> 구조이며, 전개 방식은 \u003cb class=\"key\">예시\u003c/b>에 해당한다. 예시 내부에서는 \u003cb class=\"key\">단기적 \u003c/b>\u003cb class=\"key\">편리함\u003c/b>과 \u003cb class=\"key\">장기적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 대조되며, 이 대조가 주장을 구체화한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Take, for example (3)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>Traditionally (5)\u003c/b>\u003cspan>과거 관행 제시\u003c/span>\u003cb>Now (6)\u003c/b>\u003cspan>변화·대조\u003c/span>\u003cb>But (7)\u003c/b>\u003cspan>역접·장기적 영향 전환\u003c/span>\u003cb>As time went on (8)\u003c/b>\u003cspan>시간 경과에 따른 결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the obvious aspects of media\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the more subtle aspects\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">changes that accumulate over time but are not apparent day to day\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the short-term, obvious implications of greater convenience\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the long-term implications of no longer having one person fix food for the family to eat together at an evening meal\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>단기적·명백한 측면\u003c/th>\u003cth>장기적·미묘한 측면\u003c/th>\u003c/tr>\u003ctr>\u003ctd>눈에 즉시 보임\u003c/td>\u003ctd>하루하루 드러나지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>요리 시간 단축\u003c/td>\u003ctd>가족 식사 감소\u003c/td>\u003c/tr>\u003ctr>\u003ctd>편리함으로 인식\u003c/td>\u003ctd>영향을 예측하기 어려움\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 두괄식 구조입니다. 처음 두 문장에서 주장을 제시하고, 이어서 전자레인지 예시를 들어 설명하니까 전개 방식은 예시에 해당합니다. 문장 구조를 보면 명백한 측면과 미묘한 측면, 단기적 영향과 장기적 영향이 대조되면서 논지가 선명해져요.","hl":"ty"},{"n":9,"text":"신호어를 함께 볼게요. 세 번째 문장의 Take, for example은 예시를 도입하는 신호입니다. 다섯 번째 문장의 Traditionally와 여섯 번째 문장의 Now는 과거와 현재를 대조해 주죠. 일곱 번째 문장의 But은 단기적 편리함에서 장기적 영향으로 논점을 전환하고, 여덟 번째 문장의 As time went on은 시간 경과에 따른 결과를 보여 줍니다. 이 신호어들 때문에 글의 초점이 단기에서 장기로 이동한다는 걸 알 수 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>focus on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 집중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>obvious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>분명한, 명백한\u003c/span>\u003c/div>\u003cdiv>\u003cb>aspect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>측면, 면\u003c/span>\u003c/div>\u003cdiv>\u003cb>media\u003c/b>\u003cem>명사\u003c/em>\u003cspan>매체, 미디어\u003c/span>\u003c/div>\u003cdiv>\u003cb>miss\u003c/b>\u003cem>동사\u003c/em>\u003cspan>놓치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>accumulate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>축적되다, 쌓이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>apparent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>뚜렷한, 명백한\u003c/span>\u003c/div>\u003cdiv>\u003cb>subtle\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>미묘한, 감지하기 어려운\u003c/span>\u003c/div>\u003cdiv>\u003cb>medium\u003c/b>\u003cem>명사\u003c/em>\u003cspan>매체, 수단\u003c/span>\u003c/div>\u003cdiv>\u003cb>technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>introduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도입하다, 소개하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>revolutionize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>혁명을 일으키다, 일대 변혁을 가져오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>food preparation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음식 준비\u003c/span>\u003c/div>\u003cdiv>\u003cb>traditionally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>전통적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>fix\u003c/b>\u003 nconvenience\u003c/span>\u003cspan class=\"a\">discomfort\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 같이 봅시다. obvious는 apparent나 clear와 바꿔 쓸 수 있고, 반대는 subtle이나 hidden입니다. subtle의 반대는 obvious나 clear죠. overlook는 miss나 ignore와 유사하고, 반대는 notice나 observe입니다. anticipate는 expect나 foresee와 동의어이고 convenience는 ease와 유사하지만 inconvenience와 반대입니다. 이렇게 묶어서 기억하면 어휘 문제에 바로 활용할 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 매체의 분명한 측면에 집중할 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">focus \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">obvious \u003c/span>\u003cspan class=\"tgt\">aspects \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">media\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 그 변화를 놓친다\u003c/span>\u003cspan class=\"en\">we miss the changes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간이 흐름에 따라 축적되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">accumulate \u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 하루하루 뚜렷하게 보이지 않는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">apparent \u003c/span>\u003cspan class=\"tgt\">day \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">day\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 매체의 분명한 측면에 집중할 때, 우리는 시간이 흐름에 따라 축적되지만 하루 하루 뚜렷하게 보이지 않는 변화를 놓친다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 미디어의 \u003cb class=\"key\">분명한 \u003c/b>\u003cb class=\"key\">측면\u003c/b>에만 집중하면 시간이 지나며 \u003cb class=\"key\">축적되는 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 놓친다는 이 글의 핵심 주장입니다. 하루하루는 잘 보이지 않지만 장기적으로 중요한 \u003cb class=\"key\">변화\u003c/b>가 있다는 점을 강조하며, 뒤에 전자레인지 예시가 나오는 도입 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사절 접속사 When\u003c/span> : When + 주어 + 동사 ~, 주절 : \"우리가 매체의 분명한 측면에 집중할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사(the changes) + that + 동사(accumulate/are) : \"시간이 흐름에 따라 축적되지만 하루하루 뚜렷하게 보이지 않는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"When we focus on the obvious aspects of media, 우리가 매체의 분명한 측면에 집중할 때. we miss the changes, 우리는 그 변화를 놓친다. that accumulate over time, 시간이 흐름에 따라 축적되는. but are not apparent day to day, 하지만 하루하루 뚜렷하게 보이지 않는. 이 문장 전체를 해석하면, 우리가 매체의 분명한 측면에 집중할 때, 우리는 시간이 흐름에 따라 축적되지만 하루 하루 뚜렷하게 보이지 않는 변화를 놓친다.","hl":"m"},{"n":13,"text":"이 문장은 미디어의 분명한 측면에만 집중하면 시간이 지나며 축적되는 변화를 놓친다는 이 글의 핵심 주장입니다. 하루하루는 잘 보이지 않지만 장기적으로 중요한 변화가 있다는 뜻이죠. 뒤에 전자레인지 예시로 이어지는 도입 역할을 해요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 When이 이끄는 부사절입니다. When we focus on the obvious aspects of media에서 When은 우리가 매체의 분명한 측면에 집중할 때라는 의미를 나타내요. 두 번째 어법 포인트는 that이 이끄는 주격 관계대명사절이에요. the changes를 수식하면서 시간이 흐름에 따라 축적되지만 하루하루 뚜렷하게 보이지 않는 이라는 의미를 덧붙여 주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리들 대부분은 분명한 측면들을 알아차린다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\ "},{"n":16,"text":"이 문장은 우리 대부분이 새로운 매체나 기술의 분명한 측면은 잘 알아차리지만 더 미묘한 측면은 놓친다는 일반적 경향을 말해요. 첫 번째 문장을 좀 더 구체적으로 풀어 주고, 뒤에 전자레인지 예시가 나올 수 있게 연결하는 역할을 하죠.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 notice가 타동사로 쓰였다는 점입니다. notice 뒤에 the obvious aspects라는 목적어가 와서 분명한 측면들을 알아차리다라는 의미를 완성해요. 두 번째 어법 포인트는 while missing the more subtle aspects입니다. while 다음에 -ing 형태가 오면서 주어가 생략된 분사구문으로, 더 미묘한 측면들을 놓치면서라는 동시 동작을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Take, \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">example,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전자레인지를 보라.\u003c/span>\u003cspan class=\"en\">the microwave oven.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 전자레인지를 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전자레인지를 구체적 예시로 제시하며 논의를 시작합니다. \u003cb class=\"key\">전자레인지\u003c/b>라는 친숙한 사례를 통해 앞서 말한 \u003cb class=\"key\">분명한 \u003c/b>\u003cb class=\"key\">측면\u003c/b>과 \u003cb class=\"key\">미묘한 \u003c/b>\u003cb class=\"key\">측면\u003c/b>의 대비를 보여 주려는 신호입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : 동사원형(Take) + 목적어(the microwave oven) + for example : \"예를 들어 ...을 보라\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Take, for example, 예를 들어. the microwave oven, 전자레인지를 보라.. 이 문장 전체를 해석하면, 예를 들어, 전자레인지를 보라.","hl":"m"},{"n":19,"text":"이 문장은 앞에서 설명한 원리를 보여 줄 구체적인 예로 전자레인지를 제시해요. 독자에게 예를 들어 보라는 명령문으로 주의를 환기시키고, 이제부터 전자레인지 이야기를 하겠다는 신호를 줍니다.","hl":"mn"},{"n":20,"text":"이 문장은 Take, for example로 시작하는 명령문입니다. 주어 없이 동사원형 Take가 문장 맨 앞에 오고, Take A for example은 A를 예로 들다라는 뜻이에요. 여기서는 the microwave oven을 예로 들라는 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 도입되었다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">introduced\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1980년대 초반에\u003c/span>\u003cspan class=\"en\">in the early 1980s\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 혁명을 일으켰다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">revolutionized\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식 준비 과정에\u003c/span>\u003cspan class=\"en\">food preparation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 1980년대 초반에 도입되었고 음식 준비 과정에 혁명을 일으켰다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전자레인지가 도입된 시점과 그 직접적 영향인 음식 준비의 혁명을 소개하는 문장입니다. 지문에서는 전자레인지의 도입이 음식 준비 시간을 획기적으로 줄여 \u003cb class=\"key\">요리 \u003c/b>\u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">단축\u003c/b>을 가져왔음을 드러냅니다. revolutionized는 단순한 변화가 아니라 음식 준비 과정 자체를 완전히 바꾼 것을 의미합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태(과거 시제)\u003c/span> : be동사의 과거형 + 과거분사 : \"도입되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조(동사 연결)\u003c/span> : A and B (두 동사구 병렬) : \"그리고 혁명을 일으켰다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It was introduced, 그것은 도입되었다. in the early 1980s, 1980년대 초반에. and revolutionized, 그리고 혁명을 일으켰다. food preparation, 음식 준비 과정에. 이 문장 전체를 해석하면, 그것은 1980년대 초반에 도입되었고 음식 준비 과정에 혁명을 일으켰다.","hl":"m"},{"n":22,"text":"이 문장은 전자레인지가 처음 등장해서 음식 준비 방식을 완전히 바꿨다는 사실을 소개합니다. 문장 앞부분의 수동태 표현이 전자레인지가 도입되었다는 수동적 상황을 보여 주고, revolutionized는 단순한 변화가 아니라 음식 준비 과정의 혁명적인 변화를 강조합니다. 전자레인지 도입과 혁명이라는 두 동작이 and로 연결되어 전자레인지의 초기 성격을 명확히 보여 줍니다.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 수동태입니다. was introduced에서 주어 It이 가리키는 전자레인지는 스스로 도입된 주체가 아니라 도입을 당한 대상이기 때문에 be동사 과거형과 과거분사 introduced를 씁니다. 두 번째 어법 포인트는 병렬 구조입니다. was introduced와 revolutionized가 and로 연결되어 주어 It에 대한 두 개의 서술어 역할을 합니다. 어법 문제에서는 and 앞뒤로 시제와 형태가 맞는지 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전통적으로,\u003c/span>\u003cspan class=\"en\">Traditionally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 사람이\u003c/span>\u003cspan class=\"en\">one person\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오후의 대부분을 보냈다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">spent \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">afternoon \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저녁 식사를 준비하느라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">fixing\u003c/span> an evening meal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족을 위한\u003c/span>\u003cspan class=\"en\">for a family.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전통적으로, 한 사람이 가족을 위한 저녁 식사를 준비하느라 오후의 대부분을 보냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전통적으로 한 사람이 가족 저녁 식사 준비에 오후 대부분을 썼다는, 전자레인지 도입 이전의 관례를 설명합니다. spend 시간 -ing 표현은 시간을 어떤 행동에 썼는지 나타내고, fixing an evening meal이 그 행동입니다. the better part of는 '~의 대부분'이라는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">spend + 시간 + -ing\u003c/span> : spend + [시간] + [동명사구] : \"오후의 대부분을 저녁 식사를 준비하며 보냈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 표현\u003c/span> : the better part of + 시간 : \"오후의 대부분\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Traditionally, 전통적으로. one person, 한 사람이. spent the better part of an afternoon, 오후의 대부분을 보냈다. fixing an evening meal, 저녁 식사를 준비하느라. for a family, 가족을 위한. 이 문장 전체를 해석하면, 전통적으로, 한 사람이 가족을 위한 저녁 식사를 준비하느라 오후의 대부분을 보냈다.","hl":"m"},{"n":25,"text":"이 문장은 전자레인지가 생기기 전의 전통적인 저녁 식사 준비 방식을 설명합니다. 한 사람이 가족을 위해 오후 대부분을 저녁 식사 준비에 썼다는 것은 시간이 오래 걸리는 요리 관행을 보여 줍니다. 여기서 fixing an evening meal은 식사를 준비한다는 뜻이고, for a family는 가족을 위한 것임을 나타냅니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 spend 시간 -ing 구문입니다. spent의 목적어로 시간 표현인 the better part of an afternoon이 왔고, 어떤 일을 하며 그 시간을 보냈는지는 동명사 fixing이 이끄는 구로 나타냅니다. 두 번째 포인트는 관용 표현입니다. the better part of an afternoon은 오후의 대부분이라는 뜻인데, better part가 더 좋은 부분이 아니라 대부분을 의미한다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제,\u003c/span>\u003cspan class=\"en\">Now,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">possible \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식을 매우 빠르게 준비하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">prepare \u003c/span>\u003cspan class=\"tgt\">foods \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">quickly\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이러한 준비 시간의 단축은\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">shortening \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">preparation \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족 내 요리사들을 해방시켰다\u003c/span>\u003cspan class=\"en\">was liberating for the cooks in the family,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 대부분은 여성인 경향이 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">whom \u003c/span>\u003cspan class=\"tgt\">tended \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">women\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이제 음식을 매우 빠르게 준비하는 것이 가능해졌고, 이러한 준비 시간의 단축은 대부분 여성인 경향이 있었던 가족 내 요리사들을 해방시켰다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전자레인지로 음식을 빨리 준비하게 된 변화가 여성 요리사에게 해방감을 주었다는 핵심 문장입니다. it was possible to prepare는 \u003cb class=\"key\">가주어-진주어\u003c/b> 구조로 '음식을 매우 빠르게 준비하는 것'이 가능했다는 뜻이고, most of whom은 앞의 the cooks를 받는 \u003cb class=\"key\">관계대명사\u003c/b> 계속적 용법입니다. 즉, 가족 내 요리사들은 대부분 여성이었고, 조리 시간 단축이 그들에게 \u003cb class=\"key\">해방감\u003c/b>을 주었다는 점에서 전자레인지의 명백한 단기적 이점을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어-진주어 구문\u003c/span> : It is/was + 형용사 + to부정사 : \"음식을 매우 빠르게 준비하는 것이 가능했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 명사적 용법\u003c/span> : this + [동명사] + of ... : \"이러한 준비 시간의 단축은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 whom (전치사+관계대명사)\u003c/span> : 선행사 + , + most of whom + 동사 : \"그들 대부분은 여성인 경향이 있었다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Now, 이제. it was possible, 가능했다. to prepare foods very quickly, 음식을 매우 빠르게 준비하는 것이. and this shortening of preparation time, 그리고 이러한 준비 시간의 단축은. was liberating for the cooks in the family, 가족 내 요리사들을 해방시켰다. most of whom tended to be women, 그들 대부분은 여성인 경향이 있었다. 이 문장 전체를 해석하면, 이제 음식을 매우 빠르게 준비하는 것이 가능해졌고, 이러한 준비 시간의 단축은 대부분 여성인 경향이 있었던 가족 내 요리사들을 해방시켰다.","hl":"m"},{"n":28,"text":"이 문장은 전자레인지가 가져온 단기적 이점과 그것이 누구에게 어떤 영향을 주었는지를 설명합니다. 음식을 빠르게 준비할 수 있게 되면서 가족 내 요리사들이 시간에서 해방되었는데, 그들은 대부분 여성이었습니다. 여기서 liberating은 요리사들이 부담에서 벗어나는 해방감을 주었다는 의미이고, most of whom은 앞서 나온 요리사를 계속적 용법으로 설명합니다.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 가주어-진주어 구문입니다. It was possible to prepare foods very quickly에서 It은 가주어이고, 진짜 주어는 to prepare foods very quickly입니다. 이 구조는 주어가 길 때 It을 앞세우고 to부정사를 뒤로 보내는 것입니다. 두 번째 포인트는 관계대명사입니다. most of whom tended to be women에서 whom은 앞에 나온 the cooks를 받고, 전치사 of의 목적어이므로 목적격 whom을 씁니다. 대부분의 요리사가 여성이었다는 뜻을 덧붙이는 계속적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 단기적이고 분명한 영향은\u003c/span>\u003cspan class=\"en\">But the short-term, obvious implications\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 큰 편리함의\u003c/span>\u003cspan class=\"en\">of greater convenience\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간과하기 쉽게 만들었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">easy \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">overlook\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장기적인 영향을\u003c/span>\u003cspan class=\"en\">the long-term implications\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상 한 사람이 음식을 준비하지 않게 되는 것의\u003c/span>\u003cspan class=\"en\">of no longer \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">person \u003c/span>\u003cspan class=\"tgt\">fix \u003c/span>\u003cspan class=\"tgt\">food\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족이 함께 먹기 위한\u003c/span>\u003cspan class=\"en\">for the family to eat together\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저녁 식사에서\u003c/span>\u003cspan class=\"en\">at an evening meal.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 더 큰 편리함이라는 단기적이고 분명한 영향은 더 이상 한 사람이 가족이 저녁 식사에서 함께 먹기 위해 음식을 준비하지 않게 되는 것의 장기적인 영향을 간과하기 쉽게 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 전자레인지가 준 \u003cb class=\"key\">단기적\u003c/b>인 \u003cb class=\"key\">편리함\u003c/b>이 가족이 함께 저녁을 먹던 \u003cb class=\"key\">장기적\u003c/b> 변화를 \u003cb class=\"key\">간과\u003c/b>하게 만든다고 말합니다. 즉각적인 이점이 오히려 시간이 지나며 나타날 가족 식사 문화의 해체를 보지 못하게 했다는 역설이 핵심이에요. 시험에서는 단기와 장기의 대비와 make it easy to overlook 구조를 함께 묻기 좋은 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가목적어 it\u003c/span> : make it [형용사] to V(진목적어) : \"~을 간과하는 것을 쉽게 만들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 have\u003c/span> : have + 목적어 + 동사원형 : \"한 사람이 음식을 준비하게 하는 것\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"But the short-term, obvious implications, 하지만 단기적이고 분명한 영향은. of greater convenience, 더 큰 편리함의. made it easy to overlook, 간과하기 쉽게 만들었다. the long-term implications, 장기적인 영향을. of no longer having one person fix food, 더 이상 한 사람이 음식을 준비하지 않게 되는 것의. for the family to eat together, 가족이 함께 먹기 위한. at an evening meal, 저녁 식사에서. 이 문장 전체를 해석하면, 하지만 더 큰 편리함이라는 단기적이고 분명한 영향은 더 이상 한 사람이 가족이 저녁 식사에서 함께 먹기 위해 음식을 준비하지 않게 되는 것의 장기적인 영향을 간과하기 쉽게 만들었다.","hl":"m"},{"n":31,"text":"이 문장이 말하는 핵심은 전자레인지가 준 단기적인 편리함이 가족이 함께 저녁을 먹던 장기적인 변화를 간과하게 만들었다는 거예요. 표면적으로는 요리 시간이 줄어 해방감을 줬지만, 한 사람이 가족 식사를 준비하던 전통이 사라지는 결과를 미처 보지 못한 거죠. 시험에서는 단기와 장기의 대비, 그리고 made it easy to overlook 구조를 함께 물어볼 수 있어요.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 made it easy to overlook입니다. 여기서 it은 가목적어이고, 진짜 목적어는 to overlook 이하의 to부정사구예요. 목적어가 길어지면 이렇게 가목적어 it을 쓰고 진짜 목적어는 뒤로 보내는 게 영어의 전형적인 패턴이죠. 두 번째 어법 포인트는 having one person fix food입니다. having은 동명사로 of의 목적어 역할을 하고, 그 안에 사역동사 have가 쓰여서 one person이 fix 하게 한다는 뜻을 만들어요. fix는 동사원형, 즉 원형부정사로 목적격 보어예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간이 흐르면서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">went \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 적은 수의 가족들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">fewer \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">fewer \u003c/span>\u003cspan class=\"tgt\">families\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">함께 둘러앉았다\u003c/span>\u003cspan class=\"en\">sat down together\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저녁을 먹기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">eat \u003c/span>\u003cspan class=\"tgt\">dinner\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시간이 흐르면서, 점점 더 적은 수의 가족들이 저녁을 먹기 위해 함께 둘러앉았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 시간이 지나면서 \u003cb class=\"key\">가족이 \u003c/b>\u003cb class=\"key\">함께 \u003c/b>\u003cb class=\"key\">저녁을 \u003c/b>\u003cb class=\"key\">먹는\u003c/b> 모습이 점점 줄어들었음을 보여줍니다. 앞 문장에서 말한 한 사람이 가족 식사를 준비하지 않게 된 결과를 구체적으로 제시하는 역할이에요. 전자레인지의 편리함이 불러온 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">식사 \u003c/b>\u003cb class=\"key\">문화의 \u003c/b>\u003cb class=\"key\">해체\u003c/b>를 보여 주는 예시 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as (시간)\u003c/span> : As + S + V, S + V : \"시간이 흐르면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 반복\u003c/span> : 비교급 + and + 비교급 : \"점점 더 적은 수의 가족들이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형: ~하기 위해 : \"저녁을 먹기 위해\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"As time went on, 시간이 흐르면서. fewer and fewer families, 점점 더 적은 수의 가족들이. sat down together, 함께 둘러앉았다. to eat dinner, 저녁을 먹기 위해. 이 문장 전체를 해석하면, 시간이 흐르면서, 점점 더 적은 수의 가족들이 저녁을 먹기 위해 함께 둘러앉았다.","hl":"m"},{"n":34,"text":"이 문장은 전자레인지가 등장한 이후 가족들이 함께 저녁을 먹는 일이 점점 줄어드는 모습을 보여 줘요. 앞에서 설명한 대로 한 사람이 가족 식사를 준비하는 일이 사라지면서 나타난 장기적인 변화의 구체적인 증거이죠. 짧고 단순한 문장이지만 변화의 흐름을 잘 보여주는 문장이에요.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 As time went on입니다. as가 시간의 경과를 나타내는 접속사로 쓰였고, went on은 시간이 지나다는 뜻의 자동사구예요. 두 번째 어법 포인트는 fewer and fewer families입니다. 같은 비교급을 and로 반복해서 갈수록 더 적은이라는 점진적인 변화를 나타내요. 세 번째 어법 포인트는 to eat dinner입니다. to부정사가 sat down의 목적을 나타내는 부사적 용법으로 쓰였죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오랜 시간이 걸리는 식사는\u003c/span>\u003cspan class=\"en\">Meals \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">준비하는 데\u003c/span>\u003cspan class=\"en\">to prepare\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과거의 사치품이 되었다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">became \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">luxury \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">past\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 특별한 경우를 제외하고는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">except \u003c/span>\u003cspan class=\"tgt\">perhaps \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">special \u003c/span>\u003cspan class=\"tgt\">occasions\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">아마도 특별한 경우를 제외하고는, 준비하는 데 오랜 시간이 걸리는 식사는 과거의 사치품이 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 오래 걸리는 식사가 더 이상 일상이 아니라 \u003cb class=\"key\">특별한 \u003c/b>\u003cb class=\"key\">경우\u003c/b>에만 누리는 \u003cb class=\"key\">사치품\u003c/b>처럼 되었음을 나타냅니다. 가족이 함께 시간을 들여 식사하던 전통이 사라지고 그 자리를 간편식이 대신하게 된 \u003cb class=\"key\">장기적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 구체적으로 보여 주는 역할을 해요. luxury of the past는 과거에는 일상이었지만 지금은 사라진 것을 비유적으로 표현한 말이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사(Meals) + that + 불완전한 절 : \"오랜 시간이 걸리는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">불완전자동사 become + 주격보어\u003c/span> : become + [형용사/명사] 보어 : \"과거의 사치품이 되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 except for\u003c/span> : except for + 명사구 : \"특별한 경우를 제외하고는\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Meals that took a long time, 오랜 시간이 걸리는 식사는. to prepare, 준비하는 데. became a luxury of the past, 과거의 사치품이 되었다. except perhaps for special occasions, 아마도 특별한 경우를 제외하고는. 이 문장 전체를 해석하면, 아마도 특별한 경우를 제외하고는, 준비하는 데 오랜 시간이 걸리는 식사는 과거의 사치품이 되었다.","hl":"m"},{"n":37,"text":"이 문장은 준비하는 데 오랜 시간이 걸리는 식사가 더 이상 일상적인 것이 아니라 특별한 날에만 즐기는 과거의 사치품이 되었다는 뜻이에요. 함께 시간을 들여 차려 먹는 전통적인 식사가 사라지고 있다는 걸 luxury of the past라는 표현으로 강조하고 있죠. 전자레인지가 바꾼 가족 식사의 변화를 마무리하는 문장이에요.","hl":"mn"},{"n":38,"text":"첫 번째 어법 포인트는 that took a long time입니다. that은 선행사 Meals를 수식하는 주격 관계대명사이고, 뒤에 주어가 없는 불완전한 절이 왔어요. 두 번째 어법 포인트는 became a luxury of the past입니다. became은 불완전자동사여서 뒤에 주격 보어 a luxury of the past가 와서 상태의 변화를 나타내요. 세 번째 어법 포인트는 except perhaps for special occasions입니다. except for는 무언가를 제외할 때 쓰는 전치사이고, perhaps가 덧붙어서 예외의 가능성을 조심스럽게 표현했어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전자레인지가 가정 생활에 미친 영향은\u003c/span>\u003cspan class=\"en\">The effects of the microwave oven on family life\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예상되지 못했으며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">anticipated\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예견하기도 어려웠을 것이다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">foresee\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전자레인지가 가정 생활에 미친 영향은 예상되지 못했으며, 예견하기도 어려웠을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 전자레인지 예시를 마무리하면서, 전자레인지가 가정 생활에 미친 영향이 \u003cb class=\"key\">예상되지 \u003c/b>\u003cb class=\"key\">못했으며\u003c/b> \u003cb class=\"key\">예견하기도 \u003c/b>\u003cb class=\"key\">어려웠을 \u003c/b>\u003cb class=\"key\">것\u003c/b>이라는 점을 요약합니다. 글 전체의 주제인 '분명한 측면만 보면 장기적이고 미묘한 변화를 놓친다'를 재확인하는 역할을 하며, 편리함 같은 단기적 효과에 가려 가족 식사 문화의 변화 같은 \u003cb class=\"key\">장기적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 놓쳤다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : 주어 + be동사 + not + 과거분사 : \"예상되지 못했으며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 would have + 과거분사\u003c/span> : would + have + been + difficult + to부정사 : \"예견하기도 어려웠을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (판단의 근거)\u003c/span> : 형용사(difficult) + to부정사 : \"예견하기 어려운\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"The effects of the microwave oven on family life, 전자레인지가 가정 생활에 미친 영향은. were not anticipated, 예상되지 못했으며. and would have been difficult to foresee, 예견하기도 어려웠을 것이다. 이 문장 전체를 해석하면, 전자레인지가 가정 생활에 미친 영향은 예상되지 못했으며, 예견하기도 어려웠을 것이다.","hl":"m"},{"n":40,"text":"이 문장은 전자레인지 예시를 마무리하는 문장이에요. 전자레인지가 가정 생활에 미친 영향이 당시에는 예상되지 못했고, 설령 예견하려 했어도 어려웠을 것이라고 요약해요. 앞에서 말한 분명한 측면에만 집중하면 장기적이고 미묘한 변화를 놓친다는 주제를 다시 확인해 주는 역할이죠.","hl":"mn"},{"n":41,"text":"첫 번째 포인트는 수동태예요. were not anticipated는 be동사와 과거분사가 결합한 수동태로, 전자레인지의 영향이 예상하는 주체가 아니라 예상되는 대상이기 때문에 쓰였어요. 두 번째 포인트는 would have been difficult to foresee인데요. would have에 과거분사 been이 결합한 형태로, 과거에 대한 추측이나 아쉬움을 나타내요. 이미 지나간 일을 돌아보며 그때 예견하기가 어려웠을 것이라는 뜻을 전해줘요. 세 번째 포인트는 difficult to foresee의 to부정사예요. difficult, easy, hard 같은 형용사 뒤에 to부정사가 오면 그 형용사의 구체적인 내용을 나타내는 부사적 용법으로 볼 수 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>새로운 매체의 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">측면\u003c/b>에 집중하면 \u003cb class=\"key\">미묘한 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 놓친다.\u003c/li>\u003cli>전자레인지는 \u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">준비\u003c/b>를 혁신해 \u003cb class=\"key\">요리 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 단축시켰다.\u003c/li>\u003cli>그러나 \u003cb class=\"key\">단기적 \u003c/b>\u003cb class=\"key\">편리함\u003c/b>이 \u003cb class=\"key\">장기적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 간과하게 만들었다.\u003c/li>\u003cli>결국 전자레인지의 \u003cb class=\"key\">가정 \u003c/b>\u003cb class=\"key\">생활\u003c/b>에 대한 영향은 \u003cb class=\"key\">예측\u003c/b>하기 어려웠다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Focusing on the obvious short-term convenience of a new technology often makes us overlook its subtle long-term effects.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리는 매체의 \u003cb class=\"key\">명백한 \u003c/b>\u003cb class=\"key\">측면\u003c/b>에 집중해 \u003cb class=\"key\">미묘한 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 놓치기 쉽다. 전자레인지가 가져온 \u003cb class=\"key\">단기적 \u003c/b>\u003cb class=\"key\">편리함\u003c/b>은 \u003cb class=\"key\">장기적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>인 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">식사 \u003c/b>\u003cb class=\"key\">감소\u003c/b>를 간과하게 만들었다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 지문을 정리하면, 새로운 기술의 명백한 단기적 편리함에 집중하면 미묘한 장기적 변화를 놓치기 쉽다는 것입니다. 전자레인지의 편리함이 가족 식사 감소라는 뜻밖의 결과를 가져온 사례였죠. 이 구조를 기억하면서 비슷한 유형의 지문을 읽을 때는 처음 주장과 예시의 관계, 그리고 신호어를 꼭 챙기세요. 오늘 강의는 여기까지입니다. 수고했어요.","hl":null}]}]});</script></body></html>
