</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});

}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 34번","audioDir":"34_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">34번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Weber's Law and the Just-Noticeable Difference\u003c/h1>\u003ch2>베버의 법칙과 겨우 알아차릴 수 있는 차이\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: \u003cb class=\"key\">베버의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>은 두 자극 사이의 차이에 대한 \u003cb class=\"key\">지각\u003c/b>에 관한 것이다. 자극의 수준이 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">크거나 \u003c/b>\u003cb class=\"key\">강할수록\u003c/b> 두 표본을 \u003cb class=\"key\">구별\u003c/b>하기 어렵다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Weber's law means that it is harder to distinguish between two samples when those samples are larger or stronger levels of the stimuli.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 살펴볼 지문은 Weber's law, 베버의 법칙에 대한 내용입니다. 이 글은 자극의 차이를 얼마나 예민하게 느끼는지가 기준이 되는 자극의 강도에 따라 달라진다는 점을 설명하고 있어요. 핵심 요지는 stronger or larger stimuli make it harder to distinguish between two samples, 즉 자극이 강하거나 클수록 두 표본을 구별하기 어렵다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">베버의 법칙(Weber's law)은 물리적 자극의 절대적인 변화보다 \u003cb class=\"key\">상대적 \u003c/b>\u003cb class=\"key\">차이\u003c/b>의 지각과 관련돼 있어요. 예컨대 1kg짜리 가방에 1kg을 더하면 바로 무거워진 걸 느끼지만, 20kg짜리 가방에 1kg을 더하면 잘 느끼지 못하는 것과 같아요. 이때 겨우 알아차릴 수 있는 최소 차이를 \u003cb class=\"key\">JND\u003c/b> (just-noticeable difference)라고 해요. 실험 심리학에서는 소리, 빛, 무게 같은 \u003cb class=\"key\">자극의 \u003c/b>\u003cb class=\"key\">강도\u003c/b>가 커질수록 차이를 느끼는 문턱도 함께 커진다는 것을 확인했어요. 조용한 도서관에서는 스마트폰 진동 소리를 금방 알아차리지만, 시끄러운 공사장에서는 같은 진동 소리를 잘 듣지 못하는 것과 같아요. 이렇게 감각의 차이 식별은 \u003cb class=\"key\">기준 \u003c/b>\u003cb class=\"key\">자극\u003c/b>의 크기에 상대적으로 영향을 받아요.\u003c/div>","segs":[{"n":2,"text":"베버의 법칙은 물리적 자극의 절대적인 차이보다 상대적인 차이에 대한 지각을 다뤄요. 무거운 가방을 떠올려 보세요. 일 킬로그램짜리 가방에 일 킬로그램을 더하면 바로 무거워진 걸 느끼지만, 이십 킬로그램짜리 가방에 일 킬로그램을 더하면 거의 느끼지 못하는 경우가 많아요. 이렇게 겨우 알아차릴 수 있는 최소 차이를 JND, just-noticeable difference라고 해요. 실험 심리학에서는 소리나 빛 같은 자극의 강도가 클수록 차이를 느끼는 문턱도 함께 커진다는 것을 확인했어요. 조용한 도서관에서는 스마트폰 진동 소리를 금방 알아차리지만, 시끄러운 공사장에서는 같은 진동 소리를 잘 못 듣는 것과 같아요. 이렇게 감각의 차이 식별은 기준 자극의 크기에 상대적으로 영향을 받습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>법칙의 정의와 선 길이 예시\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 번째 문장은 \u003cb class=\"key\">베버의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>이 두 자극 사이의 \u003cb class=\"key\">차이\u003c/b>에 대한 \u003cb class=\"key\">지각\u003c/b>에 관한 것이라고 정의합니다. 두 번째 문장은 466mm와 467mm 선에서는 1mm 차이를 감지하지 못하지만 2mm와 3mm 선에서는 1mm 차이를 감지할 수 있다는 예를 들어요. 같은 절대적 차이라도 기준 자극이 작을 때 더 잘 느낄 수 있다는 뜻이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>촛불 예시\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>세 번째 문장은 어두운 방에서 촛불 한 개가 켜지면 \u003cb class=\"key\">감지\u003c/b>할 수 있다고 말합니다. 네 번째 문장은 이미 100개의 촛불이 타고 있는 방에서는 촛불 한 개를 더 켜도 \u003cb class=\"key\">알아차리지\u003c/b> 못할 수 있다고 해요. \u003cb class=\"key\">기준 \u003c/b>\u003cb class=\"key\">자극\u003c/b>이 강해지면 동일한 자극의 \u003cb class=\"key\">차이\u003c/b>를 감지하기 어렵다는 점을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>JND와 신호 세기\u003csmall>주장 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>다섯 번째 문장은 \u003cb class=\"key\">JND\u003c/b>가 신호의 \u003cb class=\"key\">세기\u003c/b>에 따라 달라진다고 정리합니다. 여섯 번째 문장은 JND가 훨씬 더 작은 소리에 대한 것보다 매우 큰 소음에 대해 더 크다고 말해요. 이제 원리가 소리 강도에 적용됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>소리 크기 예시\u003csmall>근거 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>일곱 번째 문장은 소리가 매우 \u003cb class=\"key\">약할\u003c/b> 때에는 다른 소리가 간신히 더 크더라도 더 크다는 것을 \u003cb class=\"key\">구분\u003c/b>할 수 있다고 설명합니다. 여덟 번째 문장은 소리가 매우 \u003cb class=\"key\">클\u003c/b> 때에는 다른 소리가 훨씬 더 커야 더 크다는 것을 구분할 수 있다고 말해요. 이 대조를 통해 JND가 \u003cb class=\"key\">기준 \u003c/b>\u003cb class=\"key\">자극\u003c/b>의 강도에 따라 달라진다는 것을 확인할 수 있어요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>베버의 법칙 결론\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>마지막 문장은 따라서 \u003cb class=\"key\">베버의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>이 표본들이 \u003cb class=\"key\">자극의 \u003c/b>\u003cb class=\"key\">수준이 \u003c/b>\u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">크거나 \u003c/b>\u003cb class=\"key\">강할 \u003c/b>\u003cb class=\"key\">때\u003c/b> 두 표본을 \u003cb class=\"key\">구별\u003c/b>하기 어렵다는 것을 의미한다고 결론 내립니다. 처음 정의를 더 구체적으로 재진술하면서 글을 마무리해요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장 순서대로 글의 흐름을 짚어 볼게요.","hl":null},{"n":4,"text":"첫 번째 문장은 베버의 법칙이 두 자극 사이의 차이에 대한 지각에 관한 것이라고 정의합니다. 두 번째 문장은 사백육십육 밀리미터와 사백육십칠 밀리미터 선에서는 일 밀리미터 차이를 감지하지 못하지만, 이 밀리미터와 삼 밀리미터 선에서는 일 밀리미터 차이를 감지할 수 있다는 예를 들어요. 즉 같은 절대적 차이라도 기준 자극이 작을 때 더 잘 느낄 수 있다는 뜻이에요.","hl":"f0"},{"n":5,"text":"세 번째 문장은 어두운 방에서 촛불 한 개가 켜지면 그 빛을 감지할 수 있다고 말합니다. 네 번째 문장은 이미 백 개의 촛불이 타고 있는 방에서는 촛불 한 개를 더 켜도 그 빛을 알아차리지 못할 수 있다고 해요. 빛의 예시를 통해서도 기준 자극이 강해지면 동일한 자극의 차이를 감지하기 어렵다는 점을 보여 줍니다.","hl":"f1"},{"n":6,"text":"다섯 번째 문장은 따라서 겨우 알아차릴 수 있는 차이, JND가 신호의 세기에 따라 달라진다고 정리합니다. 여섯 번째 문장은 예를 들어 JND가 아주 작은 소리보다 매우 큰 소음에서 더 크다고 말해요. 이제 원리가 소리의 강도에 적용되기 시작합니다.","hl":"f2"},{"n":7,"text":"일곱 번째 문장은 소리가 매우 약할 때는 다른 소리가 간신히 더 크더라도 더 크다는 것을 구분할 수 있다고 설명합니다. 여덟 번째 문장은 소리가 매우 클 때는 다른 소리가 훨씬 더 커야 더 크다는 것을 구분할 수 있다고 말해요. 이 대조를 통해 JND가 기준 자극의 강도에 따라 달라진다는 것을 확인할 수 있어요.","hl":"f3"},{"n":8,"text":"마지막 아홉 번째 문장은 따라서 베버의 법칙은 표본들이 자극의 수준에서 더 크거나 강할 때 두 표본을 구별하기가 더 어렵다는 것을 의미한다고 결론 내립니다. 처음 정의를 더 구체적으로 재진술하면서 글을 마무리해요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">베버의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>을 정의하고, 중간 문장들은 \u003cb class=\"key\">선 \u003c/b>\u003cb class=\"key\">길이\u003c/b>, \u003cb class=\"key\">촛불\u003c/b>, \u003cb class=\"key\">소리\u003c/b> 예시를 제시하며, 마지막 문장에서 다시 법칙의 의미를 재진술하기 때문에 \u003cb class=\"key\">양괄식\u003c/b> 구조입니다. 예시들은 모두 \u003cb class=\"key\">약한 \u003c/b>\u003cb class=\"key\">자극과 \u003c/b>\u003cb class=\"key\">강한 \u003c/b>\u003cb class=\"key\">자극\u003c/b>의 대조를 보여 주어 \u003cb class=\"key\">JND\u003c/b>가 \u003cb class=\"key\">신호의 \u003c/b>\u003cb class=\"key\">세기\u003c/b>에 따라 달라진다는 원리를 뒷받침합니다. 따라서 \u003cb class=\"key\">주제문\u003c/b>은 첫 문장이지만 마지막 문장이 동일한 주장을 반복해서 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (3)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>But (4)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>Therefore (5)\u003c/b>\u003cspan>결론\u003c/span>\u003cb>For example (6)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>Thus (9)\u003c/b>\u003cspan>결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Weber's law\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this principle\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the Just-noticeable difference (JND)\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the strength of the signals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">larger or stronger levels of the stimuli\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>약한/작은 자극\u003c/th>\u003cth>강한/큰 자극\u003c/th>\u003c/tr>\u003ctr>\u003ctd>2mm와 3mm 선은 1mm 차이 감지 가능\u003c/td>\u003ctd>466mm와 467mm 선은 1mm 차이 감지 어려움\u003c/td>\u003c/tr>\u003ctr>\u003ctd>어두운 방에서 촛불 1개 켜짐 감지 가능\u003c/td>\u003ctd>100개 켜진 방에서 촛불 1개는 감지 어려움\u003c/td>\u003c/tr>\u003ctr>\u003ctd>약한 소리는 조금만 커도 구분 가능\u003c/td>\u003ctd>큰 소리는 훨씬 커져야 구분 가능\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 처음에 베버의 법칙을 정의하고, 중간에서 선 길이와 촛불과 소리 예시를 든 뒤, 마지막에 다시 베버의 법칙의 의미를 재진술하는 양괄식 구조예요. 따라서 독해할 때는 첫 문장과 마지막 문장을 연결해 핵심 주장을 잡아야 해요. 중간 예시들은 모두 약한 자극과 강한 자극을 대조하고 있어서, 이 대조 구도를 잡는 것이 중요합니다.","hl":"ty"},{"n":10,"text":"신호어를 보면 세 번째 문장의 For example은 새로운 예시를 도입하고, 네 번째 문장의 But은 어두운 방과 밝은 방의 대조를 보여 줘요. 다섯 번째 문장의 Therefore는 앞선 예시들을 바탕으로 결론을 끌어내고, 아홉 번째 문장의 Thus도 마지막 결론을 이끄는 신호어입니다. 그리고 this principle은 베버의 법칙을 다시 가리키는 표현이고, the strength of the signals는 뒤에서 larger or stronger levels of the stimuli로 재진술되는 표현이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Weber's law\u003c/b>\u003cem>명사\u003c/em>\u003cspan>베버의 법칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>perception\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지각, 인식\u003c/span>\u003c/div>\u003cdiv>\u003cb>difference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>차이\u003c/span>\u003c/div>\u003cdiv>\u003cb>stimuli\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자극(들)\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>암시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>detect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감지하다, 알아차리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>compare\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비교하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>length\u003c/b>\u003cem>명사\u003c/em>\u003cspan>길이\u003c/span>\u003c/div>\u003cdiv>\u003cb>principle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원리, 원칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>light\u003c/b>\u003cem>동사\u003c/em>\u003cspan>불을 켜다\u003c/span>\u003c/div>\u003cdiv>\u003cb>notice\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아차리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>already\u003c/b>\u003cem>부사\u003c/em>\u003cspan>이미\u003c/span>\u003c/div>\u003cdiv>\u003cb>therefore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러므로\u003c/span>\u003c/div>\u003cdiv>\u003cb>Just-noticeable difference (JND)\u003c/b>\u003cem>명사\u003c/em>\u003cspan>겨우 알아차릴 수 있는 차이\u003c/span>\u003c/div>\u003cdiv>\u003cb>vary\u003c/b>\u003cem>동사\u003c/em>\u003cspan>달라지다, 변하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>as a function of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 함수로서, ~에 따라\u003c/span>\u003c/div>\u003cdiv>\u003cb>strength\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세기, 강도\u003c/span>\u003c/div>\u003cdiv>\u003cb>signals\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신호(들)\u003c/span>\u003c/div>\u003cdiv>\u003cb>greater\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>loud noises\u003c/b>\u003cem>명사\u003c/em>\u003cspan>큰 소음\u003c/span>\u003c/div>\u003cdiv>\u003cb>quiet sounds\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작은 소리\u003c/span>\u003c/div>\u003cdiv>\u003cb>weak\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>약한\u003c/span>\u003c/div>\u003cdiv>\u003cb>tell\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구분하다, 알다\u003c/span>\u003c/div>\u003cdiv>\u003cb>barely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>간신히, 거의 ~아니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>louder\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 큰 소리의\u003c/span>\u003c/div>\u003cdiv>\u003cb>distinguish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구별하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>samples\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표본(들)\u003c/span>\u003c/div>\u003cdiv>\u003cb>larger\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 큰\u003c/span>\u003c/div>\u003cdiv>\u003cb>stronger\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 강한\u003c/span>\u003c/div>\u003cdiv>\u003cb>levels\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수준\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"어휘를 정리하면 perception은 지각, stimuli는 자극이라는 뜻이에요. detect와 notice는 알아차리다, distinguish는 구별하다, barely는 간신히라는 의미로 자주 출제되니까 꼭 기억하세요. Just-noticeable difference는 겨우 알아차릴 수 있는 차이, JND로 줄여 씁니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">detect\u003c/b>\u003cspan class=\"m\">감지하다, 알아차리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"s\">perceive\u003c/span>\u003cspan class=\"s\">discern\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distinguish\u003c/b>\u003cspan class=\"m\">구별하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">differentiate\u003c/span>\u003cspan class=\"s\">tell apart\u003c/span>\u003cspan class=\"s\">discern\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">confuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">weak\u003c/b>\u003cspan class=\"m\">약한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">faint\u003c/span>\u003cspan class=\"s\">feeble\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">strong\u003c/span>\u003cspan class=\"a\">intense\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">loud\u003c/b>\u003cspan class=\"m\">큰 소리의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">noisy\u003c/span>\u003cspan class=\"s\">blaring\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">quiet\u003c/span>\u003cspan class=\"a\">soft\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">barely\u003c/b>\u003cspan class=\"m\">간신히\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">scarcely\u003c/span>\u003cspan class=\"s\">hardly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fully\u003c/span>\u003cspan class=\"a\">completely\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">vary\u003c/b>\u003cspan class=\"m\">달라지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">differ\u003c/span>\u003cspan class=\"s\">change\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">remain constant\u003c/span>\u003cspan class=\"a\">stay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">notice\u003c/b>\u003cspan class=\"m\">알아차리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">detect\u003c/span>\u003cspan class=\"s\">perceive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"시험에 자주 나오는 동의어와 반의어도 함께 볼게요. detect는 notice, perceive, discern과 바꿔 쓸 수 있고, 반대말은 miss나 overlook이에요. distinguish는 differentiate, tell apart와 유사하고, confuse와 반대입니다. weak는 faint, feeble과 동의어이고, strong이나 intense와 반대예요. loud는 noisy와 가깝고, quiet이나 soft와 반대입니다. barely는 scarcely, hardly와 동의어이고, fully나 completely와 반대입니다. vary는 differ나 change와 유사하고, remain constant와 반대예요. 이 묶음을 함께 외우면 어휘 문제에서 빠르게 답을 찾을 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">베버의 법칙은 ~에 관한 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Weber's \u003c/span>\u003cspan class=\"tgt\">law \u003c/span>\u003cspan class=\"tgt\">concerns\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차이에 대한 감지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">perception \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">difference\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 자극 사이의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">stimuli\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">베버의 법칙은 두 자극 사이의 차이에 대한 감지에 관한 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 베버의 법칙이 무엇을 다루는지 명확히 정의하면서 글 전체의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">개념\u003c/b>을 제시한다. 여기서 \u003cb class=\"key\">자극\u003c/b>은 비교 대상이 되는 빛, 소리, 길이 같은 물리적 입력을 뜻하고, \u003cb class=\"key\">차이의 \u003c/b>\u003cb class=\"key\">감지\u003c/b>는 두 자극이 다르다고 느끼는 능력을 말한다. 뒤에 이어질 구체적인 예시들의 기준점이 되는 도입 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반적 사실을 나타내는 현재 시제\u003c/span> : 주어 + 동사 현재형 : \"베버의 법칙은 ~에 관한 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사구 (the + 명사 + of + 명사)\u003c/span> : the perception + of + difference : \"차이에 대한 감지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 (between + 명사)\u003c/span> : between + two stimuli : \"두 자극 사이의\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Weber's law concerns, 베버의 법칙은 ~에 관한 것이다. the perception of difference, 차이에 대한 감지. between two stimuli, 두 자극 사이의. 이 문장 전체를 해석하면, 베버의 법칙은 두 자극 사이의 차이에 대한 감지에 관한 것이다.","hl":"m"},{"n":14,"text":"이 문장은 베버의 법칙이 무엇을 다루는지 정의하는 문장이에요. 두 자극 사이의 차이를 감지하는 능력에 관한 법칙이라는 뜻이죠. 여기서 자극은 빛이나 소리처럼 비교하는 대상을 말하고, 차이의 감지란 그 둘이 다르다고 느끼는 능력을 말해요. 앞으로 나올 예시들의 기준점이 되는 첫 문장입니다.","hl":"mn"},{"n":15,"text":"첫 번째 문장에서는 일반적인 법칙을 말할 때 현재 시제를 쓴다는 점을 잡아두세요. Weber's law concerns에서 주어가 삼인칭 단수라서 concerns에 s가 붙었어요. 그리고 the perception of difference는 명사구인데 of가 차이에 대한 감지라는 의미로 앞의 명사를 뒤에서 수식해요. 마지막으로 between two stimuli는 두 자극 사이의 전치사구로 앞의 difference를 꾸며 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 암시한다\u003c/span>\u003cspan class=\"en\">It suggests\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 감지할 수 없을지도 모른다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">detect\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1mm의 차이\u003c/span>\u003cspan class=\"en\">a 1-mm difference\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 466mm와 467mm 길이인 선들을 보고 있을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">looking \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">lines \u003c/span>\u003cspan class=\"tgt\">466 \u003c/span>\u003cspan class=\"tgt\">mm \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">467 \u003c/span>\u003cspan class=\"tgt\">mm \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">length\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 우리가 감지할 수 있을지도 모른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">detect\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1mm의 차이\u003c/span>\u003cspan class=\"en\">a 1-mm difference\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 2mm 길이의 선을 3mm 길이의 선과 비교할 때\u003c/span>\u003cspan class=\"en\">when we are comparing \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">line \u003c/span>\u003cspan class=\"tgt\">2 \u003c/span>\u003cspan class=\"tgt\">mm \u003c/span>\u003cspan class=\"tgt\">long\u003c/span> with one 3 mm long.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 우리가 466mm와 467mm 길이인 선들을 볼 때 1mm의 차이를 감지할 수 없지만, 우리가 2mm 길이와 3mm 길이인 선을 비교할 때는 1mm의 차이를 감지할 수 있을지도 모른다는 것을 암시한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 베버의 법칙을 길이 자극의 예로 설명한다. \u003cb class=\"key\">466mm와 \u003c/b>\u003cb class=\"key\">467mm\u003c/b>처럼 큰 자극에서는 1mm 차이가 상대적으로 작아 감지하기 어렵지만, \u003cb class=\"key\">2mm와 \u003c/b>\u003cb class=\"key\">3mm\u003c/b>처럼 작은 자극에서는 같은 1mm 차이가 크게 느껴져 감지할 수 있다는 내용이다. 앞 문장의 정의를 구체화하면서 '자극의 크기에 따라 감지 가능한 차이가 달라진다'는 핵심 원리를 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절 (목적어)\u003c/span> : suggests + that + 완전한 문장 : \"우리가 감지할 수 없을지도 모른다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 부사절 (when)\u003c/span> : when + 주어 + 동사 : \"우리가 466mm와 467mm 길이인 선들을 보고 있을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 may + be able to + 동사원형\u003c/span> : may + be able to + detect : \"우리가 감지할 수 있을지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">후치 수식 형용사 long\u003c/span> : a line + 2 mm + long : \"2mm 길이의 선\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"It suggests, 이것은 암시한다. that we might not be able to detect, 우리가 감지할 수 없을지도 모른다는 것을. a 1-mm difference, 1mm의 차이. when we are looking at lines 466 mm and 467 mm in length, 우리가 466mm와 467mm 길이인 선들을 보고 있을 때. but we may be able to detect, 그러나 우리가 감지할 수 있을지도 모른다. a 1-mm difference, 1mm의 차이. when we are comparing a line 2 mm long with one 3 mm long, 우리가 2mm 길이의 선을 3mm 길이의 선과 비교할 때. 이 문장 전체를 해석하면, 이것은 우리가 466mm와 467mm 길이인 선들을 볼 때 1mm의 차이를 감지할 수 없지만, 우리가 2mm 길이와 3mm 길이인 선을 비교할 때는 1mm의 차이를 감지할 수 있을지도 모른다는 것을 암시한다.","hl":"m"},{"n":17,"text":"이 문장은 베버의 법칙을 길이 자극의 예로 설명해요. 사백육십육 밀리미터와 사백육십칠 밀리미터처럼 큰 자극에서는 일 밀리미터 차이가 상대적으로 작아 감지하기 어렵지만, 이 밀리미터와 삼 밀리미터처럼 작은 자극에서는 같은 일 밀리미터 차이가 크게 느껴져 감지할 수 있다는 내용이죠. 앞 문장의 정의를 구체화하면서 자극의 크기에 따라 감지 가능한 차이가 달라진다는 핵심 원리를 보여 줍니다.","hl":"mn"},{"n":18,"text":"여기서 that절은 동사 suggests의 목적어로 쓰였어요. when we are looking at lines four hundred sixty-six millimeters and four hundred sixty-seven millimeters in length는 시간 부사절로, 큰 선들을 보고 있을 때라는 조건을 달아 줘요. but we may be able to detect에서 may와 be able to가 함께 쓰여 가능성을 나타내고요. 마지막에 a line two millimeters long처럼 형용사 long이 명사 뒤에서 수식하는 후치 수식 구조도 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 원리의 또 다른 예는\u003c/span>\u003cspan class=\"en\">Another example of this principle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 하나의 촛불을 감지할 수 있다는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">detect \u003c/span>\u003cspan class=\"tgt\">1 \u003c/span>\u003cspan class=\"tgt\">candle\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 켜졌을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">lit\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">촛불이 켜지지 않았으면 어두웠을 방에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">otherwise \u003c/span>\u003cspan class=\"tgt\">dark \u003c/span>\u003cspan class=\"tgt\">room\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 원리의 또 다른 예는 촛불이 켜지지 않았으면 어두웠을 방안에 하나의 촛불이 켜졌을 때 이것을 감지할 수 있다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 빛 자극을 이용한 또 다른 예이다. \u003cb class=\"key\">어두운 \u003c/b>\u003cb class=\"key\">방\u003c/b>에서는 촛불 하나의 작은 빛도 뚜렷하게 감지되지만, 이는 자극이 약할 때 작은 차이도 쉽게 느낄 수 있다는 원리를 보여 준다. 앞 문장의 선 길이 예에서 나아가 빛의 세기라는 다른 감각 영역으로 \u003cb class=\"key\">일반화\u003c/b>한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 이끄는 명사절 (보어)\u003c/span> : S + be동사 + that + 완전한 문장 : \"우리가 하나의 촛불을 감지할 수 있다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간 부사절 (when) + 수동태\u003c/span> : when + 주어 + be동사 + 과거분사 : \"그것이 켜졌을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 (in + 명사구)\u003c/span> : in + an otherwise dark room : \"촛불이 켜지지 않았으면 어두웠을 방에\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Another example of this principle, 이 원리의 또 다른 예는. is, ~이다. that we can detect 1 candle, 우리가 하나의 촛불을 감지할 수 있다는 것. when it is lit, 그것이 켜졌을 때. in an otherwise dark room, 촛불이 켜지지 않았으면 어두웠을 방에. 이 문장 전체를 해석하면, 이 원리의 또 다른 예는 촛불이 켜지지 않았으면 어두웠을 방안에 하나의 촛불이 켜졌을 때 이것을 감지할 수 있다는 것이다.","hl":"m"},{"n":20,"text":"이 문장은 빛 자극의 예를 들어 베버의 법칙을 설명해요. 원래 어두운 방에서는 촛불 하나의 작은 불빛도 뚜렷하게 감지할 수 있죠. 자극이 약할 때는 작은 차이도 쉽게 알아차린다는 원리를 보여 주는 문장입니다.","hl":"mn"},{"n":21,"text":"여기서 that절은 is의 보어로 쓰여서 이 원리의 또 다른 예가 무엇인지 설명해 줘요. when it is lit에서 it은 촛불을 가리키고, 촛불은 스스로 켜지는 것이 아니라 켜져지는 것이니까 수동태로 표현했어요. 그리고 otherwise는 그렇지 않았다면 어두웠을 방이라는 뉘앙스를 주는 부사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 하나의 촛불이 켜졌을 때\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">1 \u003c/span>\u003cspan class=\"tgt\">candle \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">lit\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방에\u003c/span>\u003cspan class=\"en\">in a room\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">100개의 촛불이 이미 타고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">100 \u003c/span>\u003cspan class=\"tgt\">candles \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">already \u003c/span>\u003cspan class=\"tgt\">burning\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 알아차리지 못할지도 모른다\u003c/span>\u003cspan class=\"en\">we may not notice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 촛불의 빛을\u003c/span>\u003cspan class=\"en\">the light from this candle.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 100개의 촛불이 이미 타고 있는 방에 하나의 촛불이 켜졌을 때, 우리는 이 촛불의 빛을 알아차리지 못할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 촛불 예시의 두 번째 상황으로, \u003cb class=\"key\">배경 \u003c/b>\u003cb class=\"key\">자극\u003c/b>이 강하면 같은 촛불 하나의 빛도 감지되지 않을 수 있음을 보여 줍니다. 절대적인 빛의 양이 아니라 주변 밝기와의 \u003cb class=\"key\">상대적인 \u003c/b>\u003cb class=\"key\">차이\u003c/b>가 감지에 중요하다는 베버 법칙의 예시 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 속 수동태\u003c/span> : when + 주어 + be동사 + 과거분사 : \"하나의 촛불이 켜졌을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사+관계대명사\u003c/span> : in which + 주어 + 동사 : \"100개의 촛불이 이미 타고 있는 방에\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"But when 1 candle is lit, 그러나 하나의 촛불이 켜졌을 때. in a room, 방에. in which 100 candles are already burning, 100개의 촛불이 이미 타고 있는. we may not notice, 우리는 알아차리지 못할지도 모른다. the light from this candle, 이 촛불의 빛을. 이 문장 전체를 해석하면, 그러나 100개의 촛불이 이미 타고 있는 방에 하나의 촛불이 켜졌을 때, 우리는 이 촛불의 빛을 알아차리지 못할지도 모른다.","hl":"m"},{"n":23,"text":"이 문장은 어두운 방에서는 촛불 하나를 쉽게 느끼지만, 이미 백 개의 촛불이 타고 있는 방에서는 같은 촛불 하나를 못 느낄 수 있다는 거예요. 같은 자극이라도 배경 자극이 강하면 감지가 어렵다는 베버 법칙의 예시입니다. 빛의 차이가 절대적인 양보다 상대적인 비율로 느껴진다는 점을 보여 주죠.","hl":"mn"},{"n":24,"text":"첫 번째, when one candle is lit는 when 부사절 안에서 수동태가 쓰였어요. 촛불이 스스로 켜는 게 아니라 켜지는 것이니까 be동사와 과거분사 lit을 씁니다. 두 번째, in which one hundred candles are already burning은 전치사와 관계대명사 which가 함께 쓰여 앞의 a room을 꾸며 줘요. 전치사와 관계대명사는 뒤에 완전한 절이 오고, 해석은 그 방에라고 하면 자연스럽죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로,\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겨우 알아차릴 수 있는 차이(JND)는\u003c/span>\u003cspan class=\"en\">the Just-noticeable difference (JND)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 따라 달라진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">varies \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">function \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신호의 세기에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">strength \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">signals\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로, 겨우 알아차릴 수 있는 차이(JND)는 신호의 세기에 대한 함수에 의해 달라진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞선 예시들을 바탕으로 내린 결론으로, \u003cb class=\"key\">JND\u003c/b>가 신호의 세기에 따라 달라진다는 베버 법칙의 일반 원리를 진술합니다. 촛불이나 소리 같은 구체적 사례를 떠나 \u003cb class=\"key\">신호의 \u003c/b>\u003cb class=\"key\">세기\u003c/b>라는 변수로 개념을 확장한 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 (as a function of)\u003c/span> : vary [자동사] + as a function of [전치사구] : \"~에 따라 달라진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">of 전치사구 (명사 수식)\u003c/span> : the strength + of + the signals : \"신호들의 세기\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Therefore, 그러므로. the Just-noticeable difference (JND), 겨우 알아차릴 수 있는 차이(JND)는. varies as a function of, ~에 따라 달라진다. the strength of the signals, 신호의 세기에. 이 문장 전체를 해석하면, 그러므로, 겨우 알아차릴 수 있는 차이(JND)는 신호의 세기에 대한 함수에 의해 달라진다.","hl":"m"},{"n":26,"text":"이 문장은 앞선 촛불 예시를 일반화해서, 겨우 알아차릴 수 있는 차이 즉 JND가 신호의 세기에 따라 달라진다고 정리해요. 신호가 강할수록 JND가 커지는 경향을 함수 관계로 표현한 거죠. 따라서 베버 법칙의 핵심 원리가 이 문장에 담겨 있어요.","hl":"mn"},{"n":27,"text":"첫 번째, as a function of는 에 따라 또는 의 함수로라는 뜻의 전치사구예요. JND가 신호의 세기에 따라 달라진다는 관계를 수식합니다. 두 번째, the strength of the signals에서 of 전치사구가 앞의 the strength를 꾸며서 신호들의 세기라는 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">JND는 더 크다\u003c/span>\u003cspan class=\"en\">the JND is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">greater \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 큰 소음에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">loud \u003c/span>\u003cspan class=\"tgt\">noises \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 조용한 소리에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">quiet \u003c/span>\u003cspan class=\"tgt\">sounds\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, JND는 훨씬 더 작은 소리에 대한 것보다 매우 큰 소음에 대해 더 크다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 원리를 소리 자극으로 구체화한 예시로, \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">소음\u003c/b>에서는 JND가 더 크고 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">소리\u003c/b>에서는 더 작다는 비교를 보여 줍니다. 자극이 강할수록 차이를 알아차리기 위해 필요한 차이도 커진다는 베버 법칙을 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 + than (병렬 비교)\u003c/span> : greater + for A + than + it is + for B : \"매우 큰 소음에 대해 훨씬 더 조용한 소리에 대한 것보다 더 크다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">much + 비교급 (more quiet)\u003c/span> : much + more quiet : \"훨씬 더 조용한\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"For example, 예를 들어. the JND is greater, JND는 더 크다. for very loud noises, 매우 큰 소음에 대해. than it is, ~이다. for much more quiet sounds, 훨씬 더 조용한 소리에 대해. 이 문장 전체를 해석하면, 예를 들어, JND는 훨씬 더 작은 소리에 대한 것보다 매우 큰 소음에 대해 더 크다.","hl":"m"},{"n":29,"text":"이 문장은 앞 문장의 원리를 소리의 크기로 보여 주는 예시예요. 아주 큰 소음에서는 JND가 크고, 아주 작은 소리에서는 JND가 작다는 뜻이죠. 큰 자극일수록 차이를 느끼려면 더 큰 차이가 필요하다는 베버 법칙을 구체적으로 설명해요.","hl":"mn"},{"n":30,"text":"첫 번째, greater for very loud noises than it is for much more quiet sounds는 비교급 than 구문이에요. 큰 소음에 대한 JND와 조용한 소리에 대한 JND를 비교하고, than 뒤에 it is for를 넣어 비교 대상을 병치했어요. 두 번째, much more quiet에서 much가 비교급 more quiet를 강조해서 훨씬 더 조용한이라는 뜻을 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소리가 매우 약할 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">sound \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">weak\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 구분할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 소리가 더 크다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"tgt\">sound \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">louder\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 그것이 간신히 더 클지라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">barely \u003c/span>\u003cspan class=\"tgt\">louder\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 소리가 매우 약할 때, 우리는 그것이 간신히 더 클지라도, 또 다른 소리가 더 크다는 것을 구분할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 소리가 약한 경우에는 \u003cb class=\"key\">간신히\u003c/b> 더 큰 정도의 차이도 알아차릴 수 있다는 뜻이다. even if 이하가 아주 작은 차이를 강조하여, \u003cb class=\"key\">약한 \u003c/b>\u003cb class=\"key\">자극\u003c/b>에서는 민감하게 구분한다는 점을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사절(때·조건) when\u003c/span> : When + 주어 + 동사, 주절 : \"소리가 매우 약할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that절 (명사절 목적어)\u003c/span> : tell + that + 주어 + 동사 : \"또 다른 소리가 더 크다는 것을 구분할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">even if 양보 부사절\u003c/span> : even if + 주어 + 동사 : \"비록 그것이 간신히 더 클지라도\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"When a sound is very weak, 소리가 매우 약할 때. we can tell, 우리는 구분할 수 있다. that another sound is louder, 또 다른 소리가 더 크다는 것을. even if it is barely louder, 비록 그것이 간신히 더 클지라도. 이 문장 전체를 해석하면, 한 소리가 매우 약할 때, 우리는 그것이 간신히 더 클지라도, 또 다른 소리가 더 크다는 것을 구분할 수 있다.","hl":"m"},{"n":32,"text":"이 문장은 소리가 약한 경우에는 아주 작은 차이도 쉽게 구분된다는 뜻이에요. even if 이하가 간신히 더 큰 정도의 차이까지도 알아차릴 수 있다는 점을 강조하죠. 그래서 약한 자극 수준에서는 JND가 작다는 앞선 설명과 연결됩니다.","hl":"mn"},{"n":33,"text":"첫 번째, When a sound is very weak는 when이 이끄는 부사절로 주절의 조건이나 때를 미리 제시해 줍니다. 두 번째, we can tell that another sound is louder에서 that절은 tell의 목적어로 쓰여서 무엇을 구분하는지 알려줍니다. 세 번째, even if it is barely louder는 양보 부사절로, 비록 간신히 더 클지라도 구분할 수 있다는 뜻을 덧붙입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소리가 매우 클 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">sound \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">loud\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구분하기 위해서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 소리가 훨씬 더 크다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"tgt\">sound \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">louder\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 소리는 훨씬 더 커야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">louder\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 소리가 매우 클 때, 다른 소리가 훨씬 더 크다는 것을 구분하기 위해서는, 그 소리는 훨씬 더 커야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 소리가 큰 경우에는 \u003cb class=\"key\">JND\u003c/b>가 훨씬 커진다는 점을 구체화한다. 목적을 나타내는 to tell 이하와 필요 조건을 나타내는 it has to be much louder가 결합하여, 큰 소리에서는 차이가 \u003cb class=\"key\">훨씬\u003c/b> 커야 구분된다는 뜻이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사절(때·조건) when\u003c/span> : When + 주어 + 동사, 주절 : \"소리가 매우 클 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형 + that절 : \"또 다른 소리가 훨씬 더 크다는 것을 구분하기 위해서는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">have to 필요\u003c/span> : 주어 + have/has to + 동사원형 : \"그 소리는 훨씬 더 커야 한다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"When a sound is very loud, 소리가 매우 클 때. to tell, 구분하기 위해서는. that another sound is even louder, 또 다른 소리가 훨씬 더 크다는 것을. it has to be much louder, 그 소리는 훨씬 더 커야 한다. 이 문장 전체를 해석하면, 어떤 소리가 매우 클 때, 다른 소리가 훨씬 더 크다는 것을 구분하기 위해서는, 그 소리는 훨씬 더 커야 한다.","hl":"m"},{"n":35,"text":"이 문장은 소리가 큰 경우에는 비교 대상이 더 크다는 것을 알아차리려면 차이가 훨씬 커야 한다는 뜻이에요. to tell 이하는 목적을 나타내고, it has to be much louder가 그 필요 조건을 말해 줍니다. 결국 큰 소리에서는 JND가 커진다는 것을 보여주죠.","hl":"mn"},{"n":36,"text":"첫 번째, When a sound is very loud는 when이 이끄는 부사절로 조건이나 때를 제시합니다. 두 번째, to tell that another sound is even louder는 목적을 나타내는 to부정사로, 구분하기 위해서라는 의미예요. 세 번째, it has to be much louder에서 has to는 필요를 나타내서 훨씬 더 커야 한다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Thus\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">베버의 법칙은 의미한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Weber's \u003c/span>\u003cspan class=\"tgt\">law \u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 더 어렵다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">harder \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 표본을 구별하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">distinguish \u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">samples\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 표본들이 자극의 더 크거나 강한 수준일 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">samples \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">larger \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">stronger \u003c/span>\u003cspan class=\"tgt\">levels \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">stimuli\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로, 베버의 법칙은 그 표본들이 자극의 수준이 더 크거나 강할 때 두 표본을 구별하기가 더 어렵다는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞선 예들을 종합하여 \u003cb class=\"key\">베버의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>의 핵심을 결론으로 제시한다. 가주어 it 구문으로 두 표본을 구별하는 것이 더 어렵다고 말한 뒤, when 이하에서 그 조건이 표본들이 더 크거나 강한 \u003cb class=\"key\">자극 \u003c/b>\u003cb class=\"key\">수준\u003c/b>일 때임을 밝힌다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사\u003c/span> : Thus, + 문장 : \"그러므로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that절 (명사절 목적어)\u003c/span> : means + that + 주어 + 동사 : \"베버의 법칙은 ~라는 것을 의미한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가주어·진주어\u003c/span> : It + be동사 + 형용사 + to부정사구 : \"두 표본을 구별하는 것이 더 어렵다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">부사절(때·조건) when\u003c/span> : when + 주어 + 동사 : \"그 표본들이 더 크거나 강한 수준의 자극일 때\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Thus, 그러므로. Weber's law means, 베버의 법칙은 의미한다. that it is harder, 그것이 더 어렵다는 것을. to distinguish between two samples, 두 표본을 구별하는 것이. when those samples are larger or stronger levels of the stimuli, 그 표본들이 자극의 더 크거나 강한 수준일 때. 이 문장 전체를 해석하면, 그러므로, 베버의 법칙은 그 표본들이 자극의 수준이 더 크거나 강할 때 두 표본을 구별하기가 더 어렵다는 것을 의미한다.","hl":"m"},{"n":38,"text":"이 문장은 결론으로, 표본 자체가 더 크거나 강한 수준일수록 둘을 구별하기가 더 어렵다는 것이 베버의 법칙이라는 뜻이에요. it is harder to distinguish 구문에서 it은 가주어이고 진짜 주어는 to distinguish 이하예요. 앞서 나온 큰 소리와 촛불 예를 모두 정리해 준 문장이죠.","hl":"mn"},{"n":39,"text":"첫 번째, Thus는 앞에서 설명한 내용을 정리하며 결론으로 넘기는 접속부사예요. 두 번째, Weber's law means that에서 that절은 means의 목적어로 쓰여서 법칙의 내용을 명사절로 제시합니다. 세 번째, it is harder to distinguish between two samples는 가주어 진주어 구문으로, 진짜 주어는 to distinguish between two samples예요. 네 번째, when those samples are larger or stronger levels of the stimuli는 when 부사절로, 구별이 더 어려운 조건을 구체적으로 말해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">베버의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>은 두 자극 사이의 \u003cb class=\"key\">차이\u003c/b>에 대한 \u003cb class=\"key\">지각\u003c/b>에 관한 것이다.\u003c/li>\u003cli>선 길이와 촛불 예시는 자극의 \u003cb class=\"key\">기준 \u003c/b>\u003cb class=\"key\">강도\u003c/b>가 작을 때는 작은 차이도 \u003cb class=\"key\">감지\u003c/b>할 수 있음을 보여 준다.\u003c/li>\u003cli>\u003cb class=\"key\">JND\u003c/b>는 신호의 \u003cb class=\"key\">세기\u003c/b>에 따라 달라지며, 강한 자극일수록 JND가 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">크다\u003c/b>.\u003c/li>\u003cli>따라서 자극이 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">크거나 \u003c/b>\u003cb class=\"key\">강할수록\u003c/b> 두 표본을 \u003cb class=\"key\">구별\u003c/b>하기 어렵다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Weber's law means that it is harder to distinguish between two samples when those samples are larger or stronger levels of the stimuli.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: \u003cb class=\"key\">베버의 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>은 두 자극 사이의 차이에 대한 \u003cb class=\"key\">지각\u003c/b>에 관한 것이다. 자극의 수준이 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">크거나 \u003c/b>\u003cb class=\"key\">강할수록\u003c/b> 두 표본을 \u003cb class=\"key\">구별\u003c/b>하기 어렵다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"오늘 지문을 정리하면, 베버의 법칙은 같은 차이도 기준 자극이 약할 때는 잘 느끼고, 기준 자극이 강할 때는 잘 느끼지 못한다는 원리예요. 선 길이와 촛불과 소리 예시가 모두 이 원리를 뒷받침합니다. 마지막 문장처럼 자극이 더 크거나 강할수록 두 표본을 구별하기 어렵다는 점을 꼭 기억해 두세요. 오늘 수업은 여기까지입니다. 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
