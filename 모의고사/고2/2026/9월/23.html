</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});

lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"2026년 고2 9월 모의고사 23번","audioDir":"23_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">23번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>The Role of Tension in Music\u003c/h1>\u003ch2>음악에서 긴장감이 하는 역할\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>음악은 그 자체로 만족을 줄 수 있지만, 더 큰 즐거움을 위해서는 \u003cb class=\"key\">긴장감(tension)\u003c/b>을 통한 전개가 필수적이다. 이는 리듬의 \u003cb class=\"key\">모호함(ambiguity)\u003c/b>이나 화음의 변화를 통해 나타나며, 곡의 전개라는 경험을 만들어 낸다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Musical satisfaction is generated not just by comfort, but by the dynamic process of tension and resolution.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 2026년 고2 9월 모의고사 스물세 번째 지문을 함께 분석해 볼 거예요. 음악을 들을 때 왜 우리는 어떤 부분에서 전율을 느끼는지에 대한 내용인데요. 글의 핵심은 음악의 만족감이 단순히 편안함에서 오는 게 아니라, 의도적인 긴장과 해소라는 전개 과정에서 온다는 점입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">음악을 들을 때 우리는 흔히 안정적인 화음에서 편안함을 느끼지만, 좋은 음악은 우리를 계속 몰입하게 만드는 \u003cb class=\"key\">긴장감(tension)\u003c/b>이 필요합니다. 이를 음악 용어로 \u003cb class=\"key\">전조(modulation)\u003c/b>나 리듬의 변화라고 하는데요, 마치 맛있는 요리에 단맛과 짠맛의 조화가 필요한 것과 같습니다. 이 과정을 통해 곡은 단순히 듣기 좋은 소리를 넘어 하나의 서사가 있는 \u003cb class=\"key\">드라마(drama)\u003c/b>로 발전합니다. 즉, 예측 가능한 요소와 예상치 못한 요소가 만나 감정의 파동을 만드는 것이 핵심입니다.\u003c/div>","segs":[{"n":2,"text":"자, 먼저 배경지식 좀 짚어볼게요. 여러분, 음악은 그냥 듣기 좋은 소리만으로 구성되지 않아요. 곡의 흐름을 만드는 긴장감인 tension이 있어야 하죠. 예를 들어, 우리가 영화를 볼 때도 주인공에게 아무 일도 안 생기면 재미가 없잖아요? 음악도 마찬가지예요. 전조라고 부르는 modulation을 통해 분위기를 바꾸거나 리듬을 변화시켜 우리를 계속 몰입하게 만드는 거죠. 이게 바로 곡의 드라마를 만들어내는 핵심 요소예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>음악의 기본적인 만족\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>음악은 청취자에게 편안한 \u003cb class=\"key\">리듬(rhythm)\u003c/b>을 제공하며 그 자체로 만족을 줄 수 있습니다. 하지만 이는 아주 기초적인 수준의 만족감에 해당합니다. 음악의 첫인상을 결정하는 단계라고 볼 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>더 큰 만족을 향한 욕구\u003csmall>전환 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>대부분의 사람들은 음악에서 더 많은 것을 기대하며, 이를 위해 의도적인 \u003cb class=\"key\">과정(process)\u003c/b>이 필요합니다. 음악은 단순히 머무르는 것이 아니라 특정한 방향으로 \u003cb class=\"key\">움직임(movement)\u003c/b>을 만들어내야 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>긴장을 통한 흥분 유발\u003csmall>주장 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>긴장감을 생성하고 해소하는 과정에서 청취자는 큰 즐거움을 얻습니다. 이러한 원리는 마디가 정해지지 않은 \u003cb class=\"key\">전주곡(prelude)\u003c/b>에서도 똑같이 적용됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>긴장과 전개의 관계\u003csmall>근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>리듬의 모호함이나 예상치 못한 \u003cb class=\"key\">화음(chord)\u003c/b> 변화는 곡의 드라마를 만들어냅니다. 이러한 긴장과 해소의 반복은 음악을 하나의 완전한 \u003cb class=\"key\">전개(development)\u003c/b> 과정으로 완성시킵니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"전체적으로 음악이 어떻게 더 높은 수준의 만족감을 만들어내는지 그 논리적 단계를 따라가 볼게요.","hl":null},{"n":4,"text":"처음엔 음악이 주는 아주 기본적인 만족감을 말해요. 그 자체로도 편안하고 듣기 좋죠. 하지만 글쓴이는 여기서 멈추지 않아요.","hl":"f0"},{"n":5,"text":"하지만 대다수의 경우 우리는 그 이상을 원하거든요. 그래서 곡을 특정한 방향으로 밀고 나가는 긴장감이 필요하다고 강조해요. 여기서부터가 진짜 재미있는 음악의 시작이죠.","hl":"f1"},{"n":6,"text":"이 과정에서 생기는 흥분이 우리에게 진정한 만족감을 줍니다. 마디가 없는 전주곡 같은 경우에도 리듬의 모호함을 이용해 긴장을 만들어내죠.","hl":"f2"},{"n":7,"text":"마지막으로 이렇게 만들어진 긴장감이 후속 악장에서 해소되고, 또 새로운 긴장이 생기는 과정을 반복해요. 이 과정 자체가 음악을 하나의 완성된 작품으로 만들어준답니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">필자는 단순히 편안한 음악보다 긴장감을 조성하여 특정한 방향으로 나아가는 \u003cb class=\"key\">전개(development)\u003c/b> 과정이 중요하다고 주장합니다. 3번 문장에서 이 과정의 필요성을 제시한 뒤, 전주곡과 다양한 음악적 요소들을 통해 그 근거를 구체화하고 있습니다. 전체적으로 긴장감이 어떻게 \u003cb class=\"key\">만족감(satisfaction)\u003c/b>으로 이어지는지를 논리적으로 설명합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>however (2)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>Therefore (7)\u003c/b>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">satisfying\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">excitement\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">satisfaction and pleasure\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>단순한 편안함\u003c/th>\u003cth>긴장을 통한 드라마\u003c/th>\u003c/tr>\u003ctr>\u003ctd>그 자체로 머무름\u003c/td>\u003ctd>특정한 방향으로 이동\u003c/td>\u003c/tr>\u003ctr>\u003ctd>예측 가능한 리듬\u003c/td>\u003ctd>예상치 못한 화음과 전조\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장-근거의 전개 방식을 따르고 있어요. 음악에는 긴장감이 필수적이라는 주장을 먼저 던지고, 전주곡이나 화음의 변화를 근거로 들어 설명하는 두괄식 구조를 띄고 있죠.","hl":"ty"},{"n":9,"text":"글 중간에 나온 however라는 표현을 주목하세요. 이 단어 뒤에 글의 진짜 핵심인 긴장감의 필요성이 나오거든요. 그리고 따라서라는 뜻의 therefore를 통해 긴장감이 어떻게 전개라는 결과로 이어지는지를 깔끔하게 정리해 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>rhythm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>리듬\u003c/span>\u003c/div>\u003cdiv>\u003cb>satisfying\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>만족스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>in and of itself\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 자체로\u003c/span>\u003c/div>\u003cdiv>\u003cb>tension\u003c/b>\u003cem>명사\u003c/em>\u003cspan>긴장(감)\u003c/span>\u003c/div>\u003cdiv>\u003cb>movement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>움직임, 악장\u003c/span>\u003c/div>\u003cdiv>\u003cb>in particular\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>특정한, 특히\u003c/span>\u003c/div>\u003cdiv>\u003cb>excitement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>흥분, 자극\u003c/span>\u003c/div>\u003cdiv>\u003cb>arise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>satisfaction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>만족\u003c/span>\u003c/div>\u003cdiv>\u003cb>measureless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>마디가 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>prelude\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전주곡\u003c/span>\u003c/div>\u003cdiv>\u003cb>ambiguity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모호함\u003c/span>\u003c/div>\u003cdiv>\u003cb>fluid\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유동적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>release\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해소하다, 방출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>subsequent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>그 다음의, 후속의\u003c/span>\u003c/div>\u003cdiv>\u003cb>in turn\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>차례대로, 결과적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>unambiguous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>모호하지 않은\u003c/span>\u003c/div>\u003cdiv>\u003cb>predictable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>예측 가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>unexpected\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>예상치 못한\u003c/span>\u003c/div>\u003cdiv>\u003cb>chord\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화음\u003c/span>\u003c/div>\u003cdiv>\u003cb>modulation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전조\u003c/span>\u003c/div>\u003cdiv>\u003cb>drama\u003c/b>\u003cem>명사\u003c/em>\u003cspan>드라마, 극적 요소\u003c/span>\u003c/div>\u003cdiv>\u003cb>development\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전개\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"특히 주목해야 할 단어는 ambiguity와 development예요. 모호함이 긴장을 만들고, 그 긴장이 쌓여 음악의 전개를 만들어낸다는 흐름을 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">tension\u003c/b>\u003cspan class=\"m\">긴장\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">strain\u003c/span>\u003cspan class=\"s\">suspense\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relaxation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ambiguity\u003c/b>\u003cspan class=\"m\">모호함\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">vagueness\u003c/span>\u003cspan class=\"s\">uncertainty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clarity\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">satisfaction\u003c/b>\u003cspan class=\"m\">만족\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fulfillment\u003c/span>\u003cspan class=\"s\">gratification\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dissatisfaction\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">predictable\u003c/b>\u003cspan class=\"m\">예측 가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">foreseeable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unpredictable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">subsequent\u003c/b>\u003cspan class=\"m\">후속의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">following\u003c/span>\u003cspan class=\"s\">succeeding\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">previous\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어 정리도 빼놓을 수 없죠. 긴장을 뜻하는 tension, 반대말은 편안함인 relaxation이에요. 또 모호함을 뜻하는 ambiguity는 명확함을 뜻하는 clarity와 대조되니 꼭 챙겨두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악은 우리를 이끌 수 있다\u003c/span>\u003cspan class=\"en\">Music can bring us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 편안한 리듬 속으로,\u003c/span>\u003cspan class=\"en\">into a very comfortable rhythm,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 만족감을 줄 수 있다\u003c/span>\u003cspan class=\"en\">and it can be satisfying\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 자체로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">itself\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">음악은 우리를 매우 편안한 리듬 속으로 이끌 수 있으며, 그 자체로 만족감을 줄 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 음악이 주는 기본적인 \u003cb class=\"key\">안정감\u003c/b>과 \u003cb class=\"key\">단순한 \u003c/b>\u003cb class=\"key\">즐거움\u003c/b>을 언급하며 글의 도입부를 엽니다. 'in and of itself'는 음악이 외부적 요인 없이도 그 \u003cb class=\"key\">본질적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>만으로 충분하다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용적 표현\u003c/span> : 전치사구 조합 : \"그 자체로\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Music can bring us, 음악은 우리를 이끌 수 있다. into a very comfortable rhythm, 매우 편안한 리듬 속으로. and it can be satisfying, 그리고 그것은 만족감을 줄 수 있다. in and of itself, 그 자체로.. 이 문장 전체를 해석하면, 음악은 우리를 매우 편안한 리듬 속으로 이끌 수 있으며, 그 자체로 만족감을 줄 수 있다.","hl":"m"},{"n":13,"text":"음악이 주는 기본적인 안정감과 단순한 즐거움을 언급하며 글의 도입부를 여는 문장이에요. 여기서 말하는 in and of itself는 음악이 외부적 요인 없이도 그 본질적 가치만으로 충분하다는 점을 강조하고 있답니다.","hl":"mn"},{"n":14,"text":"첫 번째로 in and of itself라는 표현을 기억하세요. 어떤 대상이 외부 조건에 의존하지 않고 본질적인 성질을 가짐을 나타내는 아주 중요한 관용 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 대부분의 경우,\u003c/span>\u003cspan class=\"en\">Most of the time, however,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 무언가 더 많은 것을 원한다\u003c/span>\u003cspan class=\"en\">we want \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일어나기를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">happen\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 대부분의 경우, 우리는 그 이상의 무언가가 일어나기를 원한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장에서 말한 편안함에 안주하지 않고, \u003cb class=\"key\">능동적인 \u003c/b>\u003cb class=\"key\">변화\u003c/b>나 \u003cb class=\"key\">추가적인 \u003c/b>\u003cb class=\"key\">자극\u003c/b>을 갈망하는 인간의 심리를 보여줍니다. 'something more'는 곡의 전개를 요구하는 \u003cb class=\"key\">음악적 \u003c/b>\u003cb class=\"key\">기대감\u003c/b>을 의미해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사(something more) + to부정사 : \"일어날 더 많은 무언가\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Most of the time, however, 하지만 대부분의 경우. we want something more, 우리는 무언가 더 많은 것을 원한다. to happen, 일어나기를.. 이 문장 전체를 해석하면, 하지만 대부분의 경우, 우리는 그 이상의 무언가가 일어나기를 원한다.","hl":"m"},{"n":16,"text":"앞선 문장에서 말한 편안함에 안주하지 않고, 능동적인 변화나 추가적인 자극을 갈망하는 인간의 심리를 보여주는 문장이에요. 여기서 something more는 곡의 전개를 요구하는 음악적 기대감을 의미한다고 보면 돼요.","hl":"mn"},{"n":17,"text":"첫 번째로 something more to happen 부분을 볼게요. to부정사가 앞의 명사를 수식하는 형용사적 용법으로 쓰였는데, 일어날 대상이 미래의 사건임을 나타내는 것이 핵심이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과정이 필요하다\u003c/span>\u003cspan class=\"en\">There needs to be a process\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긴장감을 조성하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">creates \u003c/span>\u003cspan class=\"tgt\">tension\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 악장을 몰아가는\u003c/span>\u003cspan class=\"en\">and drives the movement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정한 무언가를 향해.\u003c/span>\u003cspan class=\"en\">towards something in particular.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">긴장감을 조성하고 특정한 무언가를 향해 악장을 몰아가는 과정이 필요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 음악이 정체되지 않고 발전하기 위해 반드시 필요한 \u003cb class=\"key\">긴장감\u003c/b>의 역할을 설명합니다. 이 긴장감은 곡의 \u003cb class=\"key\">방향성\u003c/b>을 결정하며, 단순히 듣는 것 이상의 \u003cb class=\"key\">음악적 \u003c/b>\u003cb class=\"key\">경험\u003c/b>을 제공하게 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(a process) + that(주격 관계대명사) + 동사(creates) : \"긴장감을 조성하는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"There needs to be a process, 과정이 필요하다. that creates tension, 긴장감을 조성하는. and drives the movement, 그리고 악장을 몰아가는. towards something in particular, 특정한 무언가를 향해.. 이 문장 전체를 해석하면, 긴장감을 조성하고 특정한 무언가를 향해 악장을 몰아가는 과정이 필요하다.","hl":"m"},{"n":19,"text":"음악이 정체되지 않고 발전하기 위해 반드시 필요한 긴장감의 역할을 설명하는 아주 핵심적인 문장이에요. 이 긴장감은 곡의 방향성을 결정하며, 단순히 듣는 것 이상의 음악적 경험을 제공하게 하죠.","hl":"mn"},{"n":20,"text":"첫 번째로 that creates tension에서 that은 주격 관계대명사예요. 앞의 명사 a process를 수식하는데, 뒤에 바로 동사가 나오는 주격 관계대명사 구문에서는 항상 선행사와의 수 일치를 신경 써야 한다는 점 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 흥분은\u003c/span>\u003cspan class=\"en\">The excitement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 과정에서 발생하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">arises \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">process\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만족감과 즐거움을 만들어 낸다.\u003c/span>\u003cspan class=\"en\">creates satisfaction and pleasure.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 과정에서 발생하는 흥분은 만족감과 즐거움을 만들어 낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 음악이 \u003cb class=\"key\">긴장감\u003c/b>을 생성하고 이를 해결해 나가는 \u003cb class=\"key\">음악적 \u003c/b>\u003cb class=\"key\">서사\u003c/b>의 원리를 설명하는 문장입니다. 청자가 느끼는 \u003cb class=\"key\">쾌감\u003c/b>의 원천이 바로 이 긴장과 이완의 과정에 있다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사절\u003c/span> : 선행사(The excitement) + [that(주격 관계대명사) + arises(자동사)] : \"이 과정에서 발생하는\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The excitement, 그 흥분은. that arises in this process, 이 과정에서 발생하는. creates satisfaction and pleasure, 만족감과 즐거움을 만들어 낸다.. 이 문장 전체를 해석하면, 이 과정에서 발생하는 흥분은 만족감과 즐거움을 만들어 낸다.","hl":"m"},{"n":22,"text":"음악에서 긴장을 만들고 그 긴장이 해결되는 과정이 우리에게 어떤 영향을 주는지 말해주고 있어요. 이 과정에서 생겨나는 흥분이 결과적으로 만족감과 즐거움을 준다는 내용이죠.","hl":"mn"},{"n":23,"text":"먼저 주어인 The excitement를 꾸며주는 that arises in this process를 보세요. 주격 관계대명사절이 앞에서 명사를 설명해주는 형태랍니다. 문장의 핵심 구조인 주어와 동사를 잘 연결해서 해석하는 게 중요해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 보인다\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">seen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마디가 없는 전주곡에도\u003c/span>\u003cspan class=\"en\">in the measureless prelude\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한\u003c/span>\u003cspan class=\"en\">as well.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 마디가 없는 전주곡에도 보인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장에서 말한 \u003cb class=\"key\">긴장과 \u003c/b>\u003cb class=\"key\">이완의 \u003c/b>\u003cb class=\"key\">원리\u003c/b>가 특정 형식의 음악인 \u003cb class=\"key\">전주곡(prelude)\u003c/b>에서도 예외 없이 적용됨을 보여줍니다. \u003cb class=\"key\">마디가 \u003c/b>\u003cb class=\"key\">없는\u003c/b>이라는 표현을 통해 음악적 자유로움 속에서도 구조적 특성은 유지됨을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사(is) + 과거분사(seen) : \"보인다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"This is seen, 이것은 보인다. in the measureless prelude, 마디가 없는 전주곡에도. as well, 또한. 이 문장 전체를 해석하면, 이것은 마디가 없는 전주곡에도 보인다.","hl":"m"},{"n":25,"text":"앞서 말한 만족감을 주는 원리가 단순히 리듬이 뚜렷한 음악뿐만 아니라, 마디가 정해져 있지 않은 전주곡에서도 똑같이 나타난다는 사실을 짚어주고 있네요.","hl":"mn"},{"n":26,"text":"여기서는 This is seen이라는 수동태 표현이 쓰였어요. 주어가 스스로를 보는 게 아니라 보여지는 입장이니까 수동태를 쓰는 게 자연스럽죠. 뒤에 나오는 as well은 또한이라는 뜻으로 문장 전체를 자연스럽게 이어줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그곳에서\u003c/span>\u003cspan class=\"en\">But there\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긴장감은\u003c/span>\u003cspan class=\"en\">the tension\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발생할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">caused \u003c/span>\u003cspan class=\"tgt\">by\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">리듬의 모호함에 의해\u003c/span>\u003cspan class=\"en\">the ambiguity of the rhythm.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그곳에서 긴장감은 리듬의 모호함에 의해 발생할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전주곡이라는 특수한 상황에서 \u003cb class=\"key\">긴장감\u003c/b>이 구체적으로 어떤 요소에 의해 유발되는지를 분석합니다. 일반적인 곡과는 다르게 \u003cb class=\"key\">리듬의 \u003c/b>\u003cb class=\"key\">모호함\u003c/b>이 긴장의 원인이 된다는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사를 포함한 수동태\u003c/span> : 조동사(might) + be + 과거분사(caused) : \"발생할 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"But there, 하지만 그곳에서. the tension, 긴장감은. might be caused by, 발생할 수 있다. the ambiguity of the rhythm, 리듬의 모호함에 의해. 이 문장 전체를 해석하면, 하지만 그곳에서 긴장감은 리듬의 모호함에 의해 발생할 수 있다.","hl":"m"},{"n":28,"text":"그렇다면 전주곡에서는 도대체 무엇이 긴장감을 유발하는 걸까요? 리듬이 딱딱 정해져 있지 않고 오히려 모호하기 때문에, 바로 그 점이 청자로 하여금 긴장을 느끼게 만든다는 설명이에요.","hl":"mn"},{"n":29,"text":"조동사 might와 수동태 be caused by를 합쳐서 might be caused by라고 표현했죠. 추측의 의미와 수동의 의미를 동시에 전달하는 중요한 표현이에요. 리듬의 모호함이 긴장을 유발한다는 논리적 흐름을 놓치지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서 전주곡에서의 유동적인 움직임은\u003c/span>\u003cspan class=\"en\">Therefore, the fluid movement in the prelude\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보통 긴장감을 형성한다\u003c/span>\u003cspan class=\"en\">usually creates a tension\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해소될 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">released\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정해진 리듬이 있는 후속 악장에서\u003c/span>\u003cspan class=\"en\">in the subsequent movement with a set rhythm.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 전주곡에서의 유동적인 움직임은 보통 정해진 리듬이 있는 후속 악장에서 해소될 수 있는 긴장감을 형성한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 음악적 \u003cb class=\"key\">긴장감\u003c/b>이 어떻게 생성되고 해결되는지에 대한 과정을 설명하며, 전주곡의 불확실성이 후속 악장의 안정된 구조를 통해 \u003cb class=\"key\">해소\u003c/b>되는 논리적 흐름을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : [선행사(a tension)] + [that(주격 관계대명사)] + [be + p.p.(수동태)] : \"해소될 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Therefore, the fluid movement in the prelude, 따라서 전주곡에서의 유동적인 움직임은. usually creates a tension, 보통 긴장감을 형성한다. that can be released, 해소될 수 있는. in the subsequent movement with a set rhythm, 정해진 리듬이 있는 후속 악장에서. 이 문장 전체를 해석하면, 따라서 전주곡에서의 유동적인 움직임은 보통 정해진 리듬이 있는 후속 악장에서 해소될 수 있는 긴장감을 형성한다.","hl":"m"},{"n":31,"text":"이 문장은 앞선 문장에서 언급된 전주곡의 긴장감이 어떻게 쓰이는지 설명하죠. 유동적인 움직임이 만드는 긴장감은 결국 정해진 리듬이라는 규칙 속에서 해소되는 구조를 가지고 있답니다.","hl":"mn"},{"n":32,"text":"첫 번째로 주격 관계대명사를 보세요. 긴장감을 선행사로 받으면서 수동태를 써서 해소될 수 있다는 의미를 명확히 전달하고 있어요. 이때 수동태가 쓰인 이유가 긴장감은 해소되는 대상이기 때문이라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 다음에는 새롭고 다른 종류의 긴장감을 만들어 내는데,\u003c/span>\u003cspan class=\"en\">This, in turn, creates new and other types of tensions,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서는 리듬이 모호하지 않고 예측 가능하지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">rhythm \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">unambiguous \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">predictable\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예상치 못한 화음과 전조가\u003c/span>\u003cspan class=\"en\">but where unexpected chords and modulations\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">드라마를 형성하고 곡의 전개라는 경험을 만들어 낸다.\u003c/span>\u003cspan class=\"en\">create drama and an experience of development in the piece.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 다음에는 새롭고 다른 종류의 긴장감을 만들어 내는데, 그곳에서는 리듬이 모호하지 않고 예측 가능하지만, 예상치 못한 화음과 전조가 드라마를 형성하고 곡의 전개라는 경험을 만들어 낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 음악이 단순한 안정감에 그치지 않고 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>과 \u003cb class=\"key\">의외성\u003c/b>을 결합하여 청중에게 다채로운 극적 경험을 제공하는 과정을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사절(병렬구조)\u003c/span> : [where] + [S + V] + [but] + [where] + [S + V] : \"그곳에서는 리듬이 모호하지 않고 예측 가능하지만\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"This, in turn, creates new and other types of tensions, 이것은 다음에는 새롭고 다른 종류의 긴장감을 만들어 내는데. where the rhythm is unambiguous and predictable, 그곳에서는 리듬이 모호하지 않고 예측 가능하지만. but where unexpected chords and modulations, 예상치 못한 화음과 전조가. create drama and an experience of development in the piece, 드라마를 형성하고 곡의 전개라는 경험을 만들어 낸다.. 이 문장 전체를 해석하면, 이것은 다음에는 새롭고 다른 종류의 긴장감을 만들어 내는데, 그곳에서는 리듬이 모호하지 않고 예측 가능하지만, 예상치 못한 화음과 전조가 드라마를 형성하고 곡의 전개라는 경험을 만들어 낸다.","hl":"m"},{"n":34,"text":"여기서는 음악의 구조가 어떻게 더 복잡하고 흥미롭게 발전하는지를 말해줍니다. 리듬은 규칙적이라 예측이 되는데, 오히려 화음이나 전조 같은 요소로 반전을 줘서 극적인 재미를 느끼게 한다는 거예요.","hl":"mn"},{"n":35,"text":"여기서는 관계부사 where가 두 번 쓰여서 병렬구조를 이루고 있어요. 리듬이 예측 가능하다는 점과 예상치 못한 화음이 나온다는 점을 대조적으로 보여주기 위해 이렇게 같은 구조를 반복해서 사용했죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>음악은 편안함을 줄 수 있지만 더 큰 만족을 위해 긴장감이 필요하다.\u003c/li>\u003cli>긴장감을 조성하는 과정은 곡을 특정한 방향으로 이끈다.\u003c/li>\u003cli>리듬의 모호함이나 화음 변화는 음악의 드라마를 형성한다.\u003c/li>\u003cli>결국 음악의 만족감은 긴장과 해소의 조화로운 전개에서 온다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Musical satisfaction is generated not just by comfort, but by the dynamic process of tension and resolution.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">음악은 그 자체로 만족을 줄 수 있지만, 더 큰 즐거움을 위해서는 \u003cb class=\"key\">긴장감(tension)\u003c/b>을 통한 전개가 필수적이다. 이는 리듬의 \u003cb class=\"key\">모호함(ambiguity)\u003c/b>이나 화음의 변화를 통해 나타나며, 곡의 전개라는 경험을 만들어 낸다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 수업 어땠나요? 음악의 구조를 긴장과 해소의 관점에서 보니 훨씬 이해가 빠르죠? 여러분도 음악을 들을 때 긴장감이 어디서 느껴지는지 찾아보는 습관을 가져보세요. 오늘 배운 핵심 개념들 꼭 다시 복습하고요, 다음 시간에 만나요!","hl":null}]}]});</script></body></html>
