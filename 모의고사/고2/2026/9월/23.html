e213sEvW6W3z6eXp5bIbz07D/AB7enTp3zg47uHI7cc59u3P+evoKArHorHAz91h8uRz93nrx1/KkKyDDFX24/unI69RgnOew/LvVXbXXdW9NH56atv59ASv/AF17L9NtdAIBxkZAzjtyR7fQflUJQgep5P4AjoM9evXIA7mpwr5A2OCRn7pwfUA45P0oCSbc7H79Ubp2HQ8469wecdqzd5Pyuulm9tr3T8m9rtdNDbddn6r/ACZV5GcnAPTp1HXPPXGTgZxySMc08oSASRye/JOfb6HPPH408qxOFif5l7hjnBGeMDrxx1OfvE9XAPg7kYY9Azcg5P8ABnpk4BPQfWqira62b0VnZ7O70Wu3p6hq9kui6dUl233f43W4dOPTjqPp/h+YqdEyecZIxnpgHORnt+FNWJ2x8j84Iwh7HkHjuARnnkYzx8tlIpTJGqxSZdgq/I7Zb5QMkDqSQRnAP0obacIpdV07NWS1Wr9LfeI//9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Tension and Release: The Driving Force of Musical Drama<small>긴장과 해소: 음악적 드라마의 원동력</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">음악을 들을 때 우리가 쾌감을 느끼는 핵심 원리 중 하나는 바로 긴장과 이완(Tension and Release)인데, 이는 마치 고무줄을 팽팽하게 당겼다가 탁 놓았을 때 느껴지는 후련함이나 스릴 넘치는 영화를 볼 때의 감정선 변화와 비슷하답니다. 이 지문에 등장하는 박자가 없는 전주곡(Measureless prelude)은 일정한 템포가 없어서 언제 다음 음이 이어질지 모르는 리듬의 모호성(Ambiguity)을 통해 청자에게 독특한 긴장감을 부여하는 음악 형식이에요. 이러한 전주곡 뒤에 규칙적인 박자를 가진 다음 악장이 이어지면 앞선 리듬적 긴장은 해소되지만, 작곡가들은 음악이 지루해지지 않도록 곧바로 새로운 장치를 도입합니다. 즉, 리듬이 예측 가능해진 대신 예상치 못한 화음(Chords)이나 곡의 조성 자체를 바꾸는 조바꿈(Modulations)을 활용하여 마치 영화의 반전처럼 새로운 드라마(Drama)를 만들어내는 것이죠. 따라서 이 글을 읽으실 때, 음악이 단순히 듣기 좋은 소리의 나열이 아니라 끊임없이 긴장을 밀고 당기며 전개되는 역동적인 과정(Process)이라는 점을 기억하시면 지문의 맥락을 훨씬 더 깊이 있게 이해하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01편안함과 긴장의 필요성</div><ul><li>음악은 편안한 리듬을 제공하지만, 청자는 대개 그 이상의 긴장감과 전개를 원합니다.</li><li>편안한 리듬(comfortable rhythm) 자체로도 만족감을 줌</li><li>하지만 긴장(tension)을 유발하고 움직임을 이끄는 과정이 필요함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02긴장감이 유발하는 만족</div><ul><li>음악적 긴장이 조성되는 과정에서 발생하는 흥분은 더 큰 만족과 기쁨을 만들어냅니다.</li><li>긴장 유발 과정에서 흥분(excitement)이 발생함</li><li>이 흥분이 궁극적인 만족과 기쁨(satisfaction and pleasure)을 창출함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03전주곡의 모호한 리듬과 긴장</div><ul><li>마디 구분이 없는 전주곡에서는 리듬의 모호성이 특유의 긴장감을 형성합니다.</li><li>무박자 전주곡(measureless prelude)의 유동적 움직임이 예시로 등장</li><li>리듬의 모호성(ambiguity)이 긴장감을 유발함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04긴장의 해소와 새로운 발전</div><ul><li>전주곡의 긴장감은 정해진 리듬에서 해소되며, 화음과 조바꿈을 통해 새로운 극적 긴장감을 만듭니다.</li><li>이어지는 정해진 리듬(set rhythm)의 악장에서 기존 긴장이 해소(release)됨</li><li>명확한 리듬 속에서 예상치 못한 화음(unexpected chords)과 조바꿈(modulations)이 등장</li><li>이를 통해 곡의 발전(development)을 경험하며 새로운 긴장감과 드라마를 형성함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in and of itself</td><td class=\"m\">본질적으로, 그것 자체로</td></tr><tr><td class=\"w\">most of the time</td><td class=\"m\">대부분의 경우, 대개</td></tr><tr><td class=\"w\">tension</td><td class=\"m\">긴장, 긴장감</td></tr><tr><td class=\"w\">in particular</td><td class=\"m\">특히, 특별히</td></tr><tr><td class=\"w\">arise</td><td class=\"m\">발생하다, 생기다</td></tr><tr><td class=\"w\">measureless</td><td class=\"m\">박자가 없는, 무한한</td></tr><tr><td class=\"w\">prelude</td><td class=\"m\">전주곡, 서곡</td></tr><tr><td class=\"w\">as well</td><td class=\"m\">또한, 역시</td></tr><tr><td class=\"w\">ambiguity</td><td class=\"m\">모호함, 애매성</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fluid</td><td class=\"m\">부드러운, 유동적인, 흐르는 듯한</td></tr><tr><td class=\"w\">release</td><td class=\"m\">해소하다, 방출하다, 풀어주다</td></tr><tr><td class=\"w\">subsequent</td><td class=\"m\">그 다음의, 차후의</td></tr><tr><td class=\"w\">set</td><td class=\"m\">정해진, 고정된</td></tr><tr><td class=\"w\">in turn</td><td class=\"m\">결과적으로, 차례차례</td></tr><tr><td class=\"w\">unambiguous</td><td class=\"m\">모호하지 않은, 분명한</td></tr><tr><td class=\"w\">predictable</td><td class=\"m\">예측 가능한</td></tr><tr><td class=\"w\">chord</td><td class=\"m\">화음</td></tr><tr><td class=\"w\">modulation</td><td class=\"m\">조바꿈, 변조</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">음악은 우리를 이끌 수 있으며</span><span class=\"en\"><b>Music can bring us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 편안한 리듬 속으로,</span><span class=\"en\"><b>into a very comfortable rhythm,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 만족감을 줄 수 있다</span><span class=\"en\"><b>and it can be <span class=\"grammar-hl\">satisfying</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 자체로</span><span class=\"en\"><b><span class=\"grammar-hl\">in and of itself</span>.</b></span></div></div><div class=\"lec-sent-ko\">음악은 우리를 매우 편안한 리듬 속으로 이끌 수 있으며, 그 자체로 만족감을 줄 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글의 도입부로, 음악이 기본적으로 우리에게 주는 편안함이라는 일반적인 특징을 제시합니다. in and of itself는 특별한 변화나 자극이 없어도 그저 편안하게 흘러가는 리듬만으로도 음악이 청취자에게 충분한 만족감을 줄 수 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">satisfying (현재분사(형용사)): 주격 보어 역할. satisfy(만족시키다)에 -ing가 결합하여 &#39;만족감을 주는&#39;이라는 능동적 의미를 나타낸다. 주어인 it(음악)이 만족감을 주는 원인이므로 현재분사가 쓰였다.</div><div class=\"lec-gr-item\">in and of itself (관용표현): &#39;그 자체로&#39;, &#39;본질적으로&#39;라는 의미를 나타내는 부사구로 쓰인다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in and of itself</td><td class=\"m\">본질적으로, 그것 자체로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 대부분의 경우,</span><span class=\"en\"><b>Most of the time, however,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 그 이상의 무언가가 일어나기를 원한다.</span><span class=\"en\"><b>we <span class=\"grammar-hl\">want something more to happen</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 대부분의 경우, 우리는 그 이상의 무언가가 일어나기를 원한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과 대조를 이루며 글의 전개를 바꿉니다. 잔잔한 편안함만으로는 청취자의 기대를 온전히 채울 수 없음을 지적합니다. something more to happen은 단순히 소리가 이어지는 것을 넘어, 귀를 기울이고 집중하게 만드는 극적인 흐름이나 변화가 필요하다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">want something more to happen 5형식(SVOC) 구조: &#39;want + O(목적어) + to V(목적격 보어)&#39;의 기본구조이다. 목적어인 something more가 주술 관계를 이루어 &#39;더 많은 무언가가 발생하기를 원하다&#39;라는 의미 구조를 형성한다.</div><div class=\"lec-gr-item\">to happen (to부정사): 5형식 동사 want의 목적격 보어 역할을 하여, 앞의 목적어(something more)가 할 동작이나 상태를 설명한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">most of the time</td><td class=\"m\">대부분의 경우, 대개</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">과정이 필요하다</span><span class=\"en\"><b>There needs <span class=\"grammar-hl\">to be</span> a process</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">긴장감을 조성하고</span><span class=\"en\"><b><span class=\"grammar-hl\">that creates tension</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">악장을 몰아가는</span><span class=\"en\"><b><span class=\"grammar-hl\">and drives the movement</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정한 무언가를 향해</span><span class=\"en\"><b><span class=\"grammar-hl\">towards something in particular</span>.</b></span></div></div><div class=\"lec-sent-ko\">긴장감을 조성하고 특정한 무언가를 향해 악장을 몰아가는 과정이 필요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 &#39;뭔가 더 많은 일&#39;의 구체적인 내용을 설명합니다. 음악이 지루해지지 않으려면 일정한 긴장을 유발하고 목적지를 향해 나아가는 역동적인 전개가 있어야 함을 강조합니다. drives the movement towards something in particular는 음악의 멜로디나 화성이 뚜렷한 목표 지점을 향해 나아가며 청취자의 기대감을 고조시키는 과정을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to be (to부정사): 명사적 용법. 동사 needs의 목적어 역할을 하여 &#39;~가 있을 필요가 있다&#39;는 구조를 구성한다.</div><div class=\"lec-gr-item\">that creates tension and drives the movement towards something in particular (관계대명사): 주격 관계대명사 that이 이끄는 관계대명사절이 선행사 a process를 수식한다. 절 내부에서 that이 주어 역할을 하며, 동사 creates와 drives가 병렬 구조를 이룬다.</div><div class=\"lec-gr-item\">in particular (관용표현): &#39;특히&#39;라는 의미로 명사 something 뒤에서 이를 수식 및 한정하는 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tension</td><td class=\"m\">긴장, 긴장감</td></tr><tr><td class=\"w\">in particular</td><td class=\"m\">특히, 특별히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">흥분은</span><span class=\"en\"><b>The excitement</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 과정에서 발생하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that arises in this process</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">만족감과 즐거움을 만들어 낸다.</span><span class=\"en\"><b>creates satisfaction and pleasure.</b></span></div></div><div class=\"lec-sent-ko\">이 과정에서 발생하는 흥분은 만족감과 즐거움을 만들어 낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 긴장감과 전개의 과정이 최종적으로 청취자에게 어떤 긍정적 감정을 일으키는지 결론짓습니다. 긴장감을 느끼며 몰입하다가 그것이 목적지에 도달해 해소될 때 느끼는 짜릿함이 음악 감상의 핵심적인 즐거움이라는 의미입니다. The excitement that arises in this process는 음악적 전개에 귀를 기울이면서 마음이 동요하고 다음 순간을 기다리게 되는 감정 상태를 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that arises in this process (관계대명사): 주격 관계대명사 that이 이끄는 관계대명사절이 선행사 The excitement를 수식한다. 절 내부에서 that이 주어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">arise</td><td class=\"m\">발생하다, 생기다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 보인다</span><span class=\"en\"><b>This <span class=\"grammar-hl\">is seen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">마디가 없는 전주곡에서도.</span><span class=\"en\"><b>in the measureless prelude as well.</b></span></div></div><div class=\"lec-sent-ko\">이것은 마디가 없는 전주곡에도 보인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지 설명한 음악적 긴장과 해소의 원리가 실제 음악의 형식에 어떻게 적용되는지 구체적인 예시를 도입합니다. measureless prelude는 악보에 마디나 박자가 엄격하게 정해지지 않아 연주자가 자유롭게 템포를 조절하며 연주하는 도입부 음악을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is seen (수동태): be동사(is) + p.p.(seen) 구조. see는 타동사(목적어를 취하는 동사)로 기본구조는 &#39;see + O(목적어)&#39;인데, 뒤에 목적어가 없어서 수동구조 is seen 형태로 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">measureless</td><td class=\"m\">박자가 없는, 무한한</td></tr><tr><td class=\"w\">prelude</td><td class=\"m\">전주곡, 서곡</td></tr><tr><td class=\"w\">as well</td><td class=\"m\">또한, 역시</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 그곳에서 긴장감은 발생할 수 있다</span><span class=\"en\"><b>But there the tension <span class=\"grammar-hl\">might be caused</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">리듬의 모호함에 의해.</span><span class=\"en\"><b>by the ambiguity of the rhythm.</b></span></div></div><div class=\"lec-sent-ko\">하지만 그곳에서 긴장감은 리듬의 모호함에 의해 발생할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 박자가 없는 전주곡만이 가진 독특한 긴장감의 원천을 설명합니다. the ambiguity of the rhythm은 박자가 뚜렷하지 않아 다음에 어떤 박자와 멜로디가 나올지 전혀 예측하기 어려운 상태를 뜻하며, 바로 이 불확실성이 청취자의 마음을 조마조마하게 만들어 묘한 긴장감을 부여한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">might be caused (수동태): 조동사 뒤 be동사(be) + p.p.(caused) 구조. cause는 타동사(목적어를 취하는 동사)로 기본구조는 &#39;cause + O(목적어)&#39;인데, 뒤에 목적어가 없어서 수동구조 might be caused 형태로 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tension</td><td class=\"m\">긴장, 긴장감</td></tr><tr><td class=\"w\">ambiguity</td><td class=\"m\">모호함, 애매성</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">따라서 전주곡에서의 유동적인 움직임은</span><span class=\"en\"><b>Therefore, the fluid movement in the prelude</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">보통 긴장감을 형성한다</span><span class=\"en\"><b>usually creates a tension</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">해소될 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">that can be released</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">정해진 리듬이 있는 후속 악장에서.</span><span class=\"en\"><b>in the subsequent movement with a <span class=\"grammar-hl\">set</span> rhythm.</b></span></div></div><div class=\"lec-sent-ko\">따라서 전주곡에서의 유동적인 움직임은 보통 정해진 리듬이 있는 후속 악장에서 해소될 수 있는 긴장감을 형성한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전주곡에서 만들어진 모호한 리듬의 긴장감이 뒤따르는 본 악장과 어떻게 연결되며 해소되는지 설명합니다. released in the subsequent movement with a set rhythm은 전주곡이 끝난 뒤 규칙적이고 안정된 박자를 가진 다음 악장이 시작되면서, 앞서 느꼈던 불안정과 모호함이 일순간에 씻겨 내려가는 과정을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that can be released (관계대명사): 주격 관계대명사 that이 이끄는 관계대명사절이 선행사 a tension을 수식한다. 절 내부에서 that이 주어 역할을 한다.</div><div class=\"lec-gr-item\">can be released (수동태): 조동사 뒤 be동사(be) + p.p.(released) 구조. release는 타동사(목적어를 취하는 동사)로 기본구조는 &#39;release + O(목적어)&#39;인데, 뒤에 목적어가 없어서 수동구조 can be released 형태로 쓴다.</div><div class=\"lec-gr-item\">set (과거분사(형용사)): p.p. + N 형태. set이 뒤의 명사 rhythm을 수식하여 수동 및 완료의 의미(= &#39;정해진 리듬&#39;)를 나타내는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tension</td><td class=\"m\">긴장, 긴장감</td></tr><tr><td class=\"w\">prelude</td><td class=\"m\">전주곡, 서곡</td></tr><tr><td class=\"w\">fluid</td><td class=\"m\">부드러운, 유동적인, 흐르는 듯한</td></tr><tr><td class=\"w\">release</td><td class=\"m\">해소하다, 방출하다, 풀어주다</td></tr><tr><td class=\"w\">subsequent</td><td class=\"m\">그 다음의, 차후의</td></tr><tr><td class=\"w\">set</td><td class=\"m\">정해진, 고정된</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 다음에는 새롭고 다른 종류의 긴장감을 만들어 내는데,</span><span class=\"en\"><b>This, <span class=\"grammar-hl\">in turn</span>, creates new and other types of tensions,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그곳에서는 리듬이 모호하지 않고 예측 가능하지만,</span><span class=\"en\"><b><span class=\"grammar-hl\">where the rhythm is unambiguous and predictable</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예상치 못한 화음과 전조가</span><span class=\"en\"><b>but <span class=\"grammar-hl\">where unexpected chords and modulations</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">드라마와 전개라는 경험을 만들어 낸다</span><span class=\"en\"><b><span class=\"grammar-hl\">create drama and an experience of development</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">곡에서.</span><span class=\"en\"><b><span class=\"grammar-hl\">in the piece</span>.</b></span></div></div><div class=\"lec-sent-ko\">이것은 다음에는 새롭고 다른 종류의 긴장감을 만들어 내는데, 그곳에서는 리듬이 모호하지 않고 예측 가능하지만, 예상치 못한 화음과 전조가 드라마를 형성하고 곡의 전개라는 경험을 만들어 낸다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이어지는 본 악장에서 리듬의 긴장감은 해소되었지만, 그 자리를 다른 방식의 긴장감이 채운다는 점을 보여 줍니다. unexpected chords and modulations는 박자가 안정된 대신, 전혀 예상하지 못했던 낯선 화성이나 다른 조로 분위기를 바꾸는 기법을 통해 청취자에게 놀라움과 극적인 변화를 선사하여 다시 음악에 몰입하게 만든다는 것을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in turn (관용표현): &#39;결과적으로&#39;, &#39;차례로&#39;라는 의미의 부사구 역할을 한다.</div><div class=\"lec-gr-item\">where the rhythm is unambiguous and predictable (관계부사): where가 이끄는 관계부사절이 선행사 tensions(상황이나 상태를 나타내는 추상적 공간 개념)를 수식한다. 뒤에는 주어(the rhythm)와 보어(unambiguous and predictable)를 모두 갖춘 완전한 절이 온다.</div><div class=\"lec-gr-item\">where unexpected chords and modulations create drama and an experience of development in the piece (관계부사): 앞의 where 절과 접속사 but으로 병렬 연결되어 선행사 tensions를 수식하는 두 번째 관계부사절이다. 뒤에는 주어, 동사, 목적어를 모두 갖춘 완전한 절이 온다.</div><div class=\"lec-gr-item\">unexpected (과거분사(형용사)): p.p. + N 형태. unexpected가 뒤의 명사 chords and modulations를 수식하여 수동의 의미(= &#39;예상치 못한 화음과 전조&#39;)를 나타내는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tension</td><td class=\"m\">긴장, 긴장감</td></tr><tr><td class=\"w\">in turn</td><td class=\"m\">결과적으로, 차례차례</td></tr><tr><td class=\"w\">unambiguous</td><td class=\"m\">모호하지 않은, 분명한</td></tr><tr><td class=\"w\">predictable</td><td class=\"m\">예측 가능한</td></tr><tr><td class=\"w\">chord</td><td class=\"m\">화음</td></tr><tr><td class=\"w\">modulation</td><td class=\"m\">조바꿈, 변조</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>음악은 편안함 자체로도 좋지만, 우리는 보통 긴장감과 극적인 전개에서 오는 즐거움을 더 원한다.</li><li>박자가 자유로운 전주곡은 리듬이 모호해서 예측 불가능한 긴장감을 만들어낸다.</li><li>이 긴장감은 이어지는 규칙적인 박자의 악장에서 해소되며 안정감을 준다.</li><li>하지만 이어지는 악장에서는 예측 가능한 박자 대신, 예상치 못한 화음과 조바꿈이 등장해 또 다른 형태의 극적인 긴장감을 선사한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Music may offer comfort in itself, but it ultimately creates deeper satisfaction through the continuous process of building and releasing tension.</div>\n              <div class=\"lec-final-sum-ko\">음악은 그 자체로 편안함을 제공할 수도 있지만, 궁극적으로 긴장을 형성하고 해소하는 지속적인 과정을 통해 더 깊은 만족감을 창출한다.</div></div></div>"],"segs":[[{"audio":"./23_audio/1.mp3","hl":null}],[{"audio":"./23_audio/2.mp3","hl":null}],[{"audio":"./23_audio/3.mp3","hl":null},{"audio":"./23_audio/4.mp3","hl":"stage-0"},{"audio":"./23_audio/5.mp3","hl":"stage-1"},{"audio":"./23_audio/6.mp3","hl":"stage-2"},{"audio":"./23_audio/7.mp3","hl":"stage-3"}],[{"audio":"./23_audio/8.mp3","hl":null}],[{"audio":"./23_audio/9.mp3","hl":"main"},{"audio":"./23_audio/10.mp3","hl":"meaning"},{"audio":"./23_audio/11.mp3","hl":"grammar"}],[{"audio":"./23_audio/12.mp3","hl":"main"},{"audio":"./23_audio/13.mp3","hl":"meaning"},{"audio":"./23_audio/14.mp3","hl":"grammar"}],[{"audio":"./23_audio/15.mp3","hl":"main"},{"audio":"./23_audio/16.mp3","hl":"meaning"},{"audio":"./23_audio/17.mp3","hl":"grammar"}],[{"audio":"./23_audio/18.mp3","hl":"main"},{"audio":"./23_audio/19.mp3","hl":"meaning"},{"audio":"./23_audio/20.mp3","hl":"grammar"}],[{"audio":"./23_audio/21.mp3","hl":"main"},{"audio":"./23_audio/22.mp3","hl":"meaning"},{"audio":"./23_audio/23.mp3","hl":"grammar"}],[{"audio":"./23_audio/24.mp3","hl":"main"},{"audio":"./23_audio/25.mp3","hl":"meaning"},{"audio":"./23_audio/26.mp3","hl":"grammar"}],[{"audio":"./23_audio/27.mp3","hl":"main"},{"audio":"./23_audio/28.mp3","hl":"meaning"},{"audio":"./23_audio/29.mp3","hl":"grammar"}],[{"audio":"./23_audio/30.mp3","hl":"main"},{"audio":"./23_audio/31.mp3","hl":"meaning"},{"audio":"./23_audio/32.mp3","hl":"grammar"}],[{"audio":"./23_audio/33.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \
