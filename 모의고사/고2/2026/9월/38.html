</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 38번","audioDir":"38_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">38번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Crowding: A Neutral Force That Intensifies Mood and Behavior\u003c/h1>\u003ch2>혼잡성: 기분과 행동을 강화하는 중립적 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">환경심리학자\u003c/b>들은 객관적 \u003cb class=\"key\">밀도\u003c/b>와 주관적 \u003cb class=\"key\">혼잡성\u003c/b>을 구분하며, 혼잡성은 그 자체로 부정적이기보다 \u003cb class=\"key\">중립적\u003c/b>이어서 밀도가 높아지면 사람들의 \u003cb class=\"key\">기분과 \u003c/b>\u003cb class=\"key\">행동\u003c/b>이 강화된다고 본다. 따라서 혼잡성은 개인의 기대와 집단의 \u003cb class=\"key\">지배적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 \u003cb class=\"key\">두드러지게\u003c/b> 하며, 공원이나 보행 구역 같은 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">공간\u003c/b>은 \u003cb class=\"key\">긴장감\u003c/b>을 완화할 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Crowding is neutral in itself: it intensifies people's moods and behaviors according to their expectations, and positive urban spaces can help reduce tension.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 살펴볼 지문은 환경심리학에서 말하는 밀도와 혼잡성의 차이, 그리고 혼잡성이 사람들의 기분과 행동에 미치는 영향을 다룹니다. 핵심을 먼저 요약하면, 혼잡성은 그 자체로 나쁜 것이 아니라 중립적이며 사람들이 가진 기분이나 집단의 행동을 더 강하게 만든다는 것입니다. 마지막으로 도시 공간에서 긍정적인 사회적 공간을 만들면 긴장을 완화할 수 있다는 내용도 함께 전합니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람이 많다고 반드시 불쾌한 것은 아닙니다. \u003cb class=\"key\">환경심리학\u003c/b>(environmental psychology)에서는 객관적 \u003cb class=\"key\">밀도\u003c/b>(density)와 주관적 \u003cb class=\"key\">혼잡성\u003c/b>(crowding)을 구분합니다. 밀도는 특정 공간에 얼마나 많은 사람이 있는지 물리적으로 측정할 수 있는 값이고, 혼잡성은 공간이 부족하다고 느끼는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">느낌\u003c/b>입니다. 예를 들어 만원 엘리베이터에서는 같은 밀도라도 불편하지만, 좋아하는 가수의 콘서트장에서는 밀도가 높아도 즐거움을 느끼는 것과 같습니다. 또 주변 환경이 주는 \u003cb class=\"key\">감각적 \u003c/b>\u003cb class=\"key\">과부하\u003c/b>(sensory overload)와 통제력 상실은 스트레스를 높일 수 있습니다. 그래서 도시 설계에서는 밀도 자체를 줄이기보다 공원과 보행 공간 같은 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">공간\u003c/b>을 만들어 긴장을 낮추려는 접근이 중요합니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 사람이 많은 곳이 무조건 싫지만은 않다는 경험 있죠. 만원 엘리베이터는 답답하지만, 좋아하는 가수의 콘서트장은 오히려 사람이 많을수록 신나기도 합니다. 환경심리학 environmental psychology에서는 객관적 밀도 density와 주관적 혼잡성 crowding을 구분합니다. 밀도는 특정 공간에 얼마나 많은 사람이 있는지 물리적으로 측정할 수 있는 값이고, 혼잡성은 공간이 부족하다고 느끼는 심리적 느낌입니다. 혼잡성은 감각적 과부하 sensory overload와 통제력 상실을 일으켜 스트레스와 불안을 높일 수 있어요. 그래서 도시 설계에서는 밀도를 낮추는 것만큼 공원이나 보행 공간 같은 긍정적 사회적 공간을 만드는 일이 중요합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>밀도와 혼잡성 구분\u003csmall>도입·통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>환경심리학자들은 객관적 \u003cb class=\"key\">밀도\u003c/b>와 주관적 \u003cb class=\"key\">혼잡성\u003c/b>을 구분한다. 대개 높은 밀도가 혼잡 현상의 조건이 되며, 사람들은 \u003cb class=\"key\">감각적 \u003c/b>\u003cb class=\"key\">과부하\u003c/b>와 통제 결여로 스트레스와 불안을 경험한다. 이것이 혼잡성을 부정적으로 보는 기존 시각이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>혼잡성의 중립성과 기대\u003csmall>전환·주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>일부 심리학자들은 혼잡성을 \u003cb class=\"key\">중립적\u003c/b>으로 본다. 밀도가 높아지면 사람들의 \u003cb class=\"key\">기분과 \u003c/b>\u003cb class=\"key\">행동\u003c/b>이 강화된다는 주장이다. 콘서트를 기대하는 개인에게 혼잡성은 공연의 \u003cb class=\"key\">즐거움\u003c/b>을 높여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>부정적 사례와 집단 행동\u003csmall>반례·확장 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>행사를 두려워하면 혼잡성이 경험을 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">나쁘게\u003c/b> 만든다. 공동체 환경에서는 혼잡성이 \u003cb class=\"key\">지배적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 두드러지게 하여 공격적인 집단이 \u003cb class=\"key\">폭력적\u003c/b>으로 될 수 있다. 혼잡성은 기존 감정이나 집단 성향을 증폭시킨다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>긍정적 사회 공간의 설계\u003csmall>해결·결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>높은 밀도의 도시 환경에서도 공원이나 보행 구역 같은 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">공간\u003c/b>을 만들면 전체적인 기분을 올리고 \u003cb class=\"key\">긴장감\u003c/b>을 완화할 수 있다. 혼잡성의 부정적 영향을 줄이려면 밀도 자체보다 공간의 성격과 사람들의 기대를 바꾸는 것이 중요하다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 전체 흐름을 네 단계로 정리해 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 밀도와 혼잡성의 구분입니다. 환경심리학자들은 객관적 밀도와 주관적 혼잡성을 구분하고, 보통 높은 밀도가 혼잡 현상의 조건이 된다고 설명합니다. 이때 사람들은 감각적 과부하, 통제 결여, 스트레스와 불안을 경험하게 됩니다. 이것이 혼잡성을 부정적으로 보는 일반적인 시각입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 혼잡성의 중립성과 기대의 역할입니다. 여기서 그러나로 전환하며, 일부 심리학자들은 혼잡성을 변함없이 부정적인 것으로 보지 않고 중립적으로 본다고 말합니다. 밀도가 올라가면 사람들의 기분과 행동이 강화된다는 것이 핵심 주장입니다. 예를 들어 콘서트를 기대하는 사람은 혼잡성의 느낌 덕분에 공연을 더 즐길 수 있습니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 부정적 기대와 집단 행동의 사례입니다. 행사를 두려워하는 경우에는 혼잡성이 그 경험을 훨씬 더 나쁘게 만들죠. 공동체 환경에서는 혼잡성이 지배적 행동을 두드러지게 합니다. 그래서 공격적인 집단은 밀도가 올라가면 폭력적으로 변할 수 있습니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 긍정적 사회적 공간의 설계입니다. 반대로 높은 밀도의 도시 환경에서도 공원이나 보행 구역 같은 긍정적인 사회적 공간을 만들면 전체적인 기분을 올리고 긴장감을 완화할 수 있습니다. 결국 공간의 성격을 바꾸면 혼잡성의 부정적 영향을 줄일 수 있다는 내용으로 글을 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 먼저 \u003cb class=\"key\">밀도\u003c/b>와 \u003cb class=\"key\">혼잡성\u003c/b>을 구분한 뒤, 혼잡성이 보통 \u003cb class=\"key\">부정적\u003c/b>이라는 \u003cb class=\"key\">통념\u003c/b>을 제시한다. 이어서 그러나로 전환하여 혼잡성이 \u003cb class=\"key\">중립적\u003c/b>이며 기분과 행동을 \u003cb class=\"key\">강화\u003c/b>한다는 주장을 내세운다. 이후 콘서트와 두려운 행사, 공격적 집단의 예로 주장을 뒷받침하고, 마지막에 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">공간\u003c/b>이라는 해결책을 덧붙인다. 따라서 전개 방식은 \u003cb class=\"key\">통념-반박\u003c/b>이며, 주제문이 중간에 있으므로 \u003cb class=\"key\">중괄식\u003c/b> 구조로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Usually (2)\u003c/b>\u003cspan>일반적 통념 제시\u003c/span>\u003cb>However (3)\u003c/b>\u003cspan>반전·주장 도입\u003c/span>\u003cb>So (4)\u003c/b>\u003cspan>예시·결과\u003c/span>\u003cb>But (5)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>Conversely (7)\u003c/b>\u003cspan>대조·대안 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">density\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">how many people are in a particular space\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">high density\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">density increases\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">density rises\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">high-density urban environments\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>혼잡성에 대한 부정적 통념\u003c/th>\u003cth>혼잡성에 대한 중립적 관점\u003c/th>\u003c/tr>\u003ctr>\u003ctd>높은 밀도는 스트레스와 불안을 일으킨다\u003c/td>\u003ctd>밀도가 높아지면 기분과 행동이 강화된다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>부정적 기대는 경험을 악화시킨다\u003c/td>\u003ctd>긍정적 기대는 즐거움을 높인다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>공격적 집단은 폭력적이 될 수 있다\u003c/td>\u003ctd>긍정적 공간은 긴장을 완화한다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 통념과 반박 구조로 전개됩니다. 먼저 높은 밀도가 혼잡을 일으켜 부정적이라는 일반적인 통념을 소개하고, 그러나로 전환하여 혼잡성은 중립적이며 기분과 행동을 강화한다는 주장을 제시합니다. 중간에 주제문이 있으므로 중괄식 구조로 볼 수 있어요. 마지막에는 긍정적 사회적 공간이라는 해결책을 덧붙여 주장을 실제 환경에 적용합니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 글의 흐름이 아주 선명하게 드러납니다. 두 번째 문장의 usually는 일반적인 통념을 제시하고, 세 번째 문장의 however는 반전의 신호로 주제문이 나올 것임을 알려 줍니다. 네 번째 문장의 so와 다섯 번째 문장의 but은 기대에 따라 결과가 달라지는 예시를 대조해 주죠. 마지막 문장의 conversely는 부정적 사례와 반대되는 긍정적 대안으로 전환한다는 것을 보여 줍니다. 또 density는 how many people are in a particular space, high density, density increases, high-density urban environments처럼 계속 같은 개념을 바꿔 말하고 있으니 함께 묶어 읽으면 좋아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>make a distinction\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>구분하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>physical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>물리적\u003c/span>\u003c/div>\u003cdiv>\u003cb>measurement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>측정\u003c/span>\u003c/div>\u003cdiv>\u003cb>density\u003c/b>\u003cem>명사\u003c/em>\u003cspan>밀도\u003c/span>\u003c/div>\u003cdiv>\u003cb>particular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>crowding\u003c/b>\u003cem>명사\u003c/em>\u003cspan>혼잡성\u003c/span>\u003c/div>\u003cdiv>\u003cb>psychological\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>심리적\u003c/span>\u003c/div>\u003cdiv>\u003cb>feeling\u003c/b>\u003cem>명사\u003c/em>\u003cspan>느낌\u003c/span>\u003c/div>\u003cdiv>\u003cb>space\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공간\u003c/span>\u003c/div>\u003cdiv>\u003cb>phenomenon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현상\u003c/span>\u003c/div>\u003cdiv>\u003cb>sensory overload\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감각적 과부하\u003c/span>\u003c/div>\u003cdiv>\u003cb>lack\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결여, 부족\u003c/span>\u003c/div>\u003cdiv>\u003cb>control\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통제\u003c/span>\u003c/div>\u003cdiv>\u003cb>stress\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스트레스\u003c/span>\u003c/div>\u003cdiv>\u003cb>anxiety\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불안\u003c/span>\u003c/div>\u003cdiv>\u003cb>neutral\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중립적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>invariably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>변함없이, 항상\u003c/span>\u003c/div>\u003cdiv>\u003cb>negative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>mood\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기분\u003c/span>\u003c/div>\u003cdiv>\u003cb>behavior\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>intensify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>individual\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인\u003c/span>\u003c/div>\u003cdiv>\u003cb>look forward to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enhance\u003c/b>\u003cem>동사\u003c/em>\u003cspan>높이다, 향상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dread\u003c/b>\u003cem>동사\u003c/em>\u003cspan>두려워하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>accentuate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>두드러지게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dominant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지배적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>aggressive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공격적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>violent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>폭력적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>conversely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>반대로\u003c/span>\u003c/div>\u003cdiv>\u003cb>pedestrian area\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보행 구역\u003c/span>\u003c/div>\u003cdiv>\u003cb>high-density\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>높은 밀도의\u003c/span>\u003c/div>\u003cdiv>\u003cb>urban\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>도시의\u003c/span>\u003c/div>\u003cdiv>\u003cb>lift\u003c/b>\u003cem>동사\u003c/em>\u003cspan>올리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>defuse\u003c/b>\u003cem>동사\u003c/em>\u003cspan>완화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tension\u003c/b>\u003cem>명사\u003c/em>\u003cspan>긴장감\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이 지문에서 꼭 알아야 할 단어를 몇 개 짚어 볼게요. density는 밀도, crowding은 혼잡성이라는 뜻이고, make a distinction은 구분하다라는 숙어입니다. intensify는 강화하다, accentuate는 두드러지게 하다, defuse tension은 긴장을 완화하다로 연결해서 기억하면 좋습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">intensify\u003c/b>\u003cspan class=\"m\">강화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">strengthen\u003c/span>\u003cspan class=\"s\">amplify\u003c/span>\u003cspan class=\"s\">heighten\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weaken\u003c/span>\u003cspan class=\"a\">diminish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">enhance\u003c/b>\u003cspan class=\"m\">높이다, 향상시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">improve\u003c/span>\u003cspan class=\"s\">boost\u003c/span>\u003cspan class=\"s\">heighten\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">diminish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">neutral\u003c/b>\u003cspan class=\"m\">중립적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">impartial\u003c/span>\u003cspan class=\"s\">unbiased\u003c/span>\u003cspan class=\"s\">indifferent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">biased\u003c/span>\u003cspan class=\"a\">partial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dominant\u003c/b>\u003cspan class=\"m\">지배적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prevailing\u003c/span>\u003cspan class=\"s\">predominant\u003c/span>\u003cspan class=\"s\">ruling\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">submissive\u003c/span>\u003cspan class=\"a\">recessive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accentuate\u003c/b>\u003cspan class=\"m\">두드러지게 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">emphasize\u003c/span>\u003cspan class=\"s\">highlight\u003c/span>\u003cspan class=\"s\">stress\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">understate\u003c/span>\u003cspan class=\"a\">downplay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dread\u003c/b>\u003cspan class=\"m\">두려워하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fear\u003c/span>\u003cspan class=\"s\">apprehend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">look forward to\u003c/span>\u003cspan class=\"a\">anticipate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">defuse\u003c/b>\u003cspan class=\"m\">완화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ease\u003c/span>\u003cspan class=\"s\">alleviate\u003c/span>\u003cspan class=\"s\">reduce\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">aggravate\u003c/span>\u003cspan class=\"a\">intensify\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 두면 어휘 문제에 강해집니다. intensify는 강화하다라는 뜻으로 strengthen, amplify, heighten과 바꿔 쓸 수 있고, 반대는 weaken이나 diminish입니다. enhance는 높이다, 향상시키다라는 뜻으로 improve, boost와 유사하고, worsen과 반대입니다. neutral은 중립적인이라는 뜻으로 impartial, unbiased와 비슷해요. dominant는 지배적인이라는 뜻으로 predominant, ruling과 연결되고, submissive와 대비됩니다. defuse는 완화하다라는 뜻으로 ease, alleviate와 유사하고, aggravate와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경심리학자들은 구분을 한다\u003c/span>\u003cspan class=\"en\">Environmental psychologists \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">distinction \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밀도의 물리적 측정 사이를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">between\u003c/span> the physical measurement of density\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정 장소에 얼마나 많은 사람들이 있는가\u003c/span>\u003cspan class=\"en\">(how many people are in a particular space)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 혼잡성\u003c/span>\u003cspan class=\"en\">and crowding\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공간이 충분치 않다는 심리적 감정\u003c/span>\u003cspan class=\"en\">(the psychological feeling of not having enough space).\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">환경심리학자들은 밀도(특정 장소에 얼마나 많은 사람들이 있는가)의 물리적 측정과 혼잡성(공간이 충분치 않다는 심리적 감정)을 구분한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 환경심리학의 핵심 개념인 \u003cb class=\"key\">밀도\u003c/b>와 \u003cb class=\"key\">혼잡성\u003c/b>을 구분하며 시작해요. 밀도는 특정 공간에 실제로 몇 명이 있는지 측정하는 물리적 개념이고, 혼잡성은 공간이 부족하다고 느끼는 심리적 감정이에요. 글 전체에서 이 둘의 차이를 기준으로 논의를 전개하려는 의도예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">숙어 make a distinction between A and B\u003c/span> : make + a distinction + between A and B : \"A와 B를 구분하다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Environmental psychologists make a distinction, 환경심리학자들은 구분을 한다. between the physical measurement of density, 밀도의 물리적 측정 사이를. (how many people are in a particular space), 특정 장소에 얼마나 많은 사람들이 있는가. and crowding, 그리고 혼잡성. (the psychological feeling of not having enough space), 공간이 충분치 않다는 심리적 감정. 이 문장 전체를 해석하면, 환경심리학자들은 밀도(특정 장소에 얼마나 많은 사람들이 있는가)의 물리적 측정과 혼잡성(공간이 충분치 않다는 심리적 감정)을 구분한다.","hl":"m"},{"n":13,"text":"이 문장은 환경심리학의 핵심 개념인 밀도와 혼잡성을 구분해서 정의하고 있어요. density는 특정 공간에 실제로 몇 명이 있는지를 측정하는 물리적 개념이고, crowding은 공간이 충분하지 않다고 느끼는 심리적 감정이에요. 이 둘의 차이를 먼저 잡아 두면 이어지는 논의가 훨씬 명확해져요.","hl":"mn"},{"n":14,"text":"이 문장에서 짚을 어법 포인트는 make a distinction between이에요. make는 명사구 a distinction과 결합해서 구분하다라는 관용 표현을 만들어요. between 뒤에는 밀도의 물리적 측정과 혼잡성, 이 두 개념이 병렬 구조로 나오죠. 그래서 무엇과 무엇을 구분하는지 깔끔하게 보여 주는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대개 높은 밀도가 요구된다\u003c/span>\u003cspan class=\"en\">Usually, high density \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">needed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혼잡 현상을 위해\u003c/span>\u003cspan class=\"en\">for the phenomenon of crowding,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 사람들이 경험하게 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">experience\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감각적 과부하\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">sensory \u003c/span>\u003cspan class=\"tgt\">overload, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통제 결여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">lack \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">control, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 증가하는 스트레스와 불안을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">rising \u003c/span>\u003cspan class=\"tgt\">stress \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">anxiety\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대개 높은 밀도는 혼잡 현상이 요구되고, 이는 사람들이 감각적 과부하, 통제 결여와 증가하는 스트레스와 불안을 경험하게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 문장은 보통 \u003cb class=\"key\">높은 \u003c/b>\u003cb class=\"key\">밀도\u003c/b>가 있어야 \u003cb class=\"key\">혼잡\u003c/b> 현상이 생기고, 그 혼잡이 사람들에게 \u003cb class=\"key\">감각적 \u003c/b>\u003cb class=\"key\">과부하\u003c/b>, 통제력 상실, 스트레스와 불안을 일으킨다고 설명해요. 즉 밀도가 높아지면 부정적 심리 반응으로 이어질 수 있다는 일반론을 제시하는 거예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be + p.p. (+ for + 명사) : \"요구된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 which의 계속적 용법\u003c/span> : 선행사 + , which + 동사 : \"그런데 그것은 사람들이 경험하게 만든다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">A, B, and C 병렬 구조\u003c/span> : A, B, and C : \"감각적 과부하, 통제 결여, 그리고 증가하는 스트레스와 불안\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Usually, high density is needed, 대개 높은 밀도가 요구된다. for the phenomenon of crowding, 혼잡 현상을 위해. which makes people experience, 그것은 사람들이 경험하게 만든다. sensory overload, 감각적 과부하. a lack of control, 통제 결여. and rising stress and anxiety, 그리고 증가하는 스트레스와 불안을. 이 문장 전체를 해석하면, 대개 높은 밀도는 혼잡 현상이 요구되고, 이는 사람들이 감각적 과부하, 통제 결여와 증가하는 스트레스와 불안을 경험하게 한다.","hl":"m"},{"n":16,"text":"이 문장은 높은 밀도가 있어야 혼잡이 생기고, 그 혼잡이 사람들에게 감각적 과부하와 통제 결여, 그리고 점점 커지는 스트레스와 불안을 일으킨다는 일반적인 설명을 해 줘요. 밀도가 높아지면 왜 부정적인 심리 반응이 나타나는지 그 원리로 이해하면 돼요.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 is needed예요. 주어 high density가 필요로 되어지는 대상이니까 수동태로 쓴 거예요. 두 번째는 which makes people experience인데요, comma 뒤의 which는 앞에 나온 혼잡 현상을 계속해서 설명하는 계속적 용법이고, 그 혼잡이 사람들이 경험하게 만드는 거예요. 세 번째로 sensory overload, a lack of control, and rising stress and anxiety는 A, B, and C 병렬 구조예요. 경험하는 내용을 세 가지 감각과 감정으로 나란히 묶어서 구체적으로 보여 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 몇몇 심리학자들은 혼잡성을 중립적으로 본다\u003c/span>\u003cspan class=\"en\">However, some psychologists \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">crowding \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">neutral\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변함없이 부정적이라기보다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">invariably \u003c/span>\u003cspan class=\"tgt\">negative\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 믿는다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들의 기분과 행동이 강화된다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">people's \u003c/span>\u003cspan class=\"tgt\">moods \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">behaviors \u003c/span>\u003cspan class=\"tgt\">intensify\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밀도가 증가함에 따라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">density \u003c/span>\u003cspan class=\"tgt\">increases\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 몇몇 심리학자들은 혼잡성을 변함없이 부정적인 것으로 보기보다 중립적으로 보고, 밀도가 올라감에 따라 사람들의 기분과 행동도 강화된다는 것을 믿는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 문장은 앞 문장과 달리 혼잡성을 \u003cb class=\"key\">중립적\u003c/b>으로 보는 학자들의 관점을 소개해요. 혼잡 자체가 반드시 나쁜 것이 아니라 밀도가 높아질수록 사람들의 \u003cb class=\"key\">기분과 \u003c/b>\u003cb class=\"key\">행동\u003c/b>이 더 \u003cb class=\"key\">강화\u003c/b>된다는 것이 핵심이에요. 이 대조된 관점이 다음 문장의 콘서트와 싫은 사건 예시로 이어져요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">see + 목적어 + as + 형용사\u003c/span> : see + 목적어 + as + 형용사/명사 : \"혼잡성을 중립적인 것으로 보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">rather than을 이용한 대조\u003c/span> : rather than + 형용사구 : \"변함없이 부정적이라기보다는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사 believe + that절 목적어\u003c/span> : believe + that + 완전한 절 : \"사람들의 기분과 행동이 강화된다고 믿는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">부사절 접속사 as\u003c/span> : as + 주어 + 동사 : \"밀도가 증가함에 따라\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"However, some psychologists see crowding as neutral, 하지만 몇몇 심리학자들은 혼잡성을 중립적으로 본다. rather than invariably negative, 변함없이 부정적이라기보다는. and believe, 그리고 믿는다. that people's moods and behaviors intensify, 사람들의 기분과 행동이 강화된다는 것을. as density increases, 밀도가 증가함에 따라. 이 문장 전체를 해석하면, 하지만 몇몇 심리학자들은 혼잡성을 변함없이 부정적인 것으로 보기보다 중립적으로 보고, 밀도가 올라감에 따라 사람들의 기분과 행동도 강화된다는 것을 믿는다.","hl":"m"},{"n":19,"text":"이 문장은 앞 문장과 대조되는 관점을 소개해요. 일부 심리학자들은 혼잡성을 무조건 부정적으로 보지 않고 중립적으로 보면서, 밀도가 높아질수록 사람들의 기분과 행동이 더 강하게 나타난다고 봐요. 이 관점이 바로 다음 문장의 콘서트 예시나 싫은 사건 예시로 연결되는 핵심이에요.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 see crowding as neutral이에요. see는 목적어 뒤에 as를 붙여서 무엇을 어떤 성질로 여긴다는 뜻을 나타내요. 두 번째는 rather than invariably negative인데요, 뒤의 내용을 부정하고 앞의 중립적이라는 시각을 선택하는 대조 표현이에요. 세 번째로 believe that people's moods and behaviors intensify에서는 that절 전체가 believe의 목적어 역할을 해요. 네 번째로 as density increases는 밀도가 증가함에 따라라는 뜻으로, 기분과 행동이 강해지는 조건을 자연스럽게 연결해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 만약 한 개인이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">So \u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">individual \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">콘서트를 기대하고 있다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">looking \u003c/span>\u003cspan class=\"tgt\">forward \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">concert\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">say\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혼잡성의 느낌은\u003c/span>\u003cspan class=\"en\">the feeling of crowding\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공연의 즐거움을 높인다.\u003c/span>\u003cspan class=\"en\">enhances their enjoyment of the performance.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서, 예를 들어, 한 개인이 콘서트를 기대하고 있다면, 혼잡성의 느낌은 공연의 즐거움을 높인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 밀도가 높아지면 기분과 행동이 강화된다는 원리를 긍정적 예로 보여 줍니다. 기대하는 콘서트라면 \u003cb class=\"key\">혼잡성\u003c/b>이 즐거움을 떨어뜨리지 않고 오히려 \u003cb class=\"key\">강화\u003c/b>합니다. say는 예를 들어라는 뜻으로, 화자가 콘서트를 하나의 사례로 든 것입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 if와 현재진행형\u003c/span> : if + 주어 + be + -ing, 주절 : \"그래서 만약 한 개인이 콘서트를 기대하고 있다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">예시를 나타내는 삽입어\u003c/span> : ..., say, ... : \"예를 들어\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"So if an individual, 그래서 만약 한 개인이. is looking forward to a concert, 콘서트를 기대하고 있다면. say, 예를 들어. the feeling of crowding, 혼잡성의 느낌은. enhances their enjoyment of the performance, 공연의 즐거움을 높인다.. 이 문장 전체를 해석하면, 그래서, 예를 들어, 한 개인이 콘서트를 기대하고 있다면, 혼잡성의 느낌은 공연의 즐거움을 높인다.","hl":"m"},{"n":22,"text":"이 문장은 혼잡성이 무조건 나쁜 게 아니라 기대하는 상황에서는 즐거움을 더 키워 준다는 걸 보여줍니다. 앞에서 말한 밀도가 높아지면 기분과 행동이 강화된다는 원리의 긍정적인 예시입니다. say는 예를 들어라는 뜻으로 콘서트를 하나의 사례로 든 거죠.","hl":"mn"},{"n":23,"text":"첫 번째 어법은 조건의 부사절입니다. if가 이끄는 절에서 is looking forward to a concert는 지금 기대하고 있는 상태를 현재진행형으로 표현했습니다. 두 번째 어법은 say입니다. 문장 중간에 들어가서 예를 들어라는 뜻을 나타내는 삽입어로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 만약 그들이\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행사를 두려워하고 있다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">dreading \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">event\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혼잡성은 만들 것이다\u003c/span>\u003cspan class=\"en\">crowding \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인의 그것을 겪는 경험을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">person's \u003c/span>\u003cspan class=\"tgt\">experience \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 나쁘게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">worse\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 만약 그들이 행사를 두려워하고 있다면, 혼잡성은 개인의 그것을 겪는 경험을 훨씬 더 나쁘게 만들 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> But으로 긍정적 예와 대조하며, 싫어하는 행사에서는 혼잡성이 부정적 감정을 \u003cb class=\"key\">악화\u003c/b>시킨다고 말합니다. 즐거움과 두려움 어느 쪽이든 혼잡성이 \u003cb class=\"key\">기존 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 더 크게 만든다는 중립적 시각을 뒷받침합니다. it은 앞에 나온 an event를 가리킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 if와 현재진행형\u003c/span> : if + 주어 + be + -ing : \"만약 그들이 행사를 두려워하고 있다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 목적격 보어(형용사)\u003c/span> : make + 목적어 + 형용사 : \"개인의 그것을 겪는 경험을 훨씬 더 나쁘게 만들 것이다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"But if they, 그러나 만약 그들이. are dreading an event, 행사를 두려워하고 있다면. crowding will make, 혼잡성은 만들 것이다. the person's experience of it, 개인의 그것을 겪는 경험을. even worse, 훨씬 더 나쁘게. 이 문장 전체를 해석하면, 그러나 만약 그들이 행사를 두려워하고 있다면, 혼잡성은 개인의 그것을 겪는 경험을 훨씬 더 나쁘게 만들 것이다.","hl":"m"},{"n":25,"text":"이 문장은 But으로 앞 문장과 대조를 이루면서, 두려워하는 행사에서는 혼잡성이 오히려 경험을 더 나쁘게 만든다는 걸 보여줍니다. 결국 혼잡성은 기존의 감정을 더 크게 만드는 중립적인 역할을 한다는 흐름입니다. it은 an event를 가리킵니다.","hl":"mn"},{"n":26,"text":"첫 번째 어법은 조건의 부사절과 현재진행형입니다. if they are dreading an event에서 dread가 진행형으로 쓰여 두려워하는 상태를 강조합니다. 두 번째 어법은 사역동사 make입니다. make는 목적어 the person's experience of it 뒤에 형용사 worse를 보어로 두어 무엇을 어떻게 만들다라는 뜻을 나타냅니다. 이 구조는 오형식 구조라고 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공동체 환경에 넣어보면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Put \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">community \u003c/span>\u003cspan class=\"tgt\">setting\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혼잡성은 두드러지게 할 수 있다\u003c/span>\u003cspan class=\"en\">crowding may accentuate\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지배적 행동을\u003c/span>\u003cspan class=\"en\">the dominant behavior ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공격적인 집단은\u003c/span>\u003cspan class=\"en\">an aggressive group\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">폭력적으로 될 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">turn \u003c/span>\u003cspan class=\"tgt\">violent\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밀도가 올라감에 따라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">density \u003c/span>\u003cspan class=\"tgt\">rises\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공동체 환경에 넣어보면, 혼잡성은 지배적 행동을 두드러지게 하는데, 공격적인 집단이 밀도가 올라감에 따라 폭력적으로 될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개인을 넘어 공동체 차원에서는 혼잡성이 \u003cb class=\"key\">지배적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 더 두드러지게 한다고 말합니다. 예컨대 공격적인 집단은 밀도가 높아질수록 폭력적으로 변할 수 있어서, 혼잡성이 집단의 \u003cb class=\"key\">주된 \u003c/b>\u003cb class=\"key\">성향\u003c/b>을 \u003cb class=\"key\">강화\u003c/b>한다는 요지입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구문\u003c/span> : Put(과거분사) + 전치사구 : \"공동체 환경에 넣어보면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">변화 동사 turn + 형용사 보어\u003c/span> : turn + 형용사 : \"폭력적으로 될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 as (때, 비례)\u003c/span> : as + 주어 + 동사 : \"밀도가 올라감에 따라\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Put into a community setting, 공동체 환경에 넣어보면. crowding may accentuate, 혼잡성은 두드러지게 할 수 있다. the dominant behavior ―, 지배적 행동을. an aggressive group, 공격적인 집단은. may turn violent, 폭력적으로 될 수 있다. as density rises, 밀도가 올라감에 따라. 이 문장 전체를 해석하면, 공동체 환경에 넣어보면, 혼잡성은 지배적 행동을 두드러지게 하는데, 공격적인 집단이 밀도가 올라감에 따라 폭력적으로 될 수 있다.","hl":"m"},{"n":28,"text":"이 문장은 혼잡성이 공동체에서는 지배적인 행동을 더 두드러지게 만든다고 말합니다. 공격적인 집단은 밀도가 높아질수록 폭력적으로 변할 수 있다는 예를 들어 집단의 주된 성향이 강화된다는 요지를 전달합니다. Put into a community setting은 공동체 환경에 놓여질 경우라는 뜻입니다.","hl":"mn"},{"n":29,"text":"첫 번째 어법은 과거분사구문입니다. Put into a community setting은 주어 crowding이 수동으로 놓여지는 의미라서 과거분사 Put으로 시작했습니다. 두 번째 어법은 변화 동사 turn입니다. may turn violent에서 turn은 변하다라는 뜻으로 뒤에 형용사 violent를 보어로 취했습니다. 세 번째 어법은 접속사 as입니다. as density rises는 밀도가 올라감에 따라라는 뜻으로 앞의 변화가 일어나는 조건을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반대로,\u003c/span>\u003cspan class=\"en\">Conversely,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긍정적인 사회적 공간을 만드는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">creating \u003c/span>\u003cspan class=\"tgt\">positive \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">spaces\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공원이나 보행 구역과 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">parks \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">pedestrian \u003c/span>\u003cspan class=\"tgt\">areas\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">높은 밀도의 도시 환경에 있는\u003c/span>\u003cspan class=\"en\">in high-density urban environments\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전체적인 기분을 올리고 긴장감을 완화하는 것을 도울 수 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">lift \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">general \u003c/span>\u003cspan class=\"tgt\">mood\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">defuse \u003c/span>\u003cspan class=\"tgt\">tension\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반대로 높은 밀도의 도시 환경에 있는 공원이나 보행 구역과 같은 긍정적인 사회적 공간은 전체적인 기분을 올리고 긴장감을 완화하는 것을 도울 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞선 부정적 사례를 반전시켜, \u003cb class=\"key\">고밀도 \u003c/b>\u003cb class=\"key\">도시 \u003c/b>\u003cb class=\"key\">환경\u003c/b>에서도 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">공간\u003c/b>을 만들면 사람들의 기분을 좋게 하고 \u003cb class=\"key\">긴장\u003c/b>을 낮출 수 있다는 대안을 제시한다. 특히 defuse는 원래 폭탄을 제거한다는 뜻으로, 여기서는 긴장감을 비유적으로 \u003cb class=\"key\">완화\u003c/b>한다는 의미로 쓰였다. 글 전체의 ‘crowding은 중립적’이라는 입장을 도시 공간 설계에 적용한 결론이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : [Creating ~] + may help ... : \"긍정적인 사회적 공간을 만드는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">such as 전치사\u003c/span> : such as + 명사구 : \"공원이나 보행 구역과 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">help + to부정사\u003c/span> : help + [to lift ~] : \"전체적인 기분을 올리는 것을 도울 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">등위접속사 and 병렬\u003c/span> : to lift ... and defuse ... : \"그리고 긴장감을 완화하다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Conversely, 반대로. creating positive social spaces, 긍정적인 사회적 공간을 만드는 것은. such as parks and pedestrian areas, 공원이나 보행 구역과 같은. in high-density urban environments, 높은 밀도의 도시 환경에 있는. may help to lift the general mood and defuse tension, 전체적인 기분을 올리고 긴장감을 완화하는 것을 도울 수 있다.. 이 문장 전체를 해석하면, 반대로 높은 밀도의 도시 환경에 있는 공원이나 보행 구역과 같은 긍정적인 사회적 공간은 전체적인 기분을 올리고 긴장감을 완화하는 것을 도울 수 있다.","hl":"m"},{"n":31,"text":"이 문장은 반대로 긍정적인 사회 공간을 만들면 고밀도 도시 환경에서도 전체적인 기분을 올리고 긴장감을 완화할 수 있다는 대안을 말하고 있어요. defuse는 원래 폭탄을 제거한다는 의미인데 여기서는 tension과 함께 쓰여 긴장을 완화한다는 비유적인 표현이에요. 앞 문장의 부정적인 밀집 효과를 반전시켜, 공원 같은 공간이 도시의 분위기를 긍정적으로 바꿀 수 있다는 결론이죠.","hl":"mn"},{"n":32,"text":"첫 번째로, creating positive social spaces에서 creating은 동명사로, 주어 자리에서 긍정적인 사회적 공간을 만드는 것이라는 의미를 갖습니다. 두 번째로, such as parks and pedestrian areas는 공원이나 보행 구역과 같은이라는 뜻으로 예시를 들 때 쓰는 표현이에요. 세 번째로, may help to lift the general mood에서 help는 to부정사를 목적어로 취해 전체적인 기분을 올리는 것을 돕는다는 뜻이 됩니다. 네 번째로, and defuse tension은 앞의 to lift와 병렬 구조를 이루어, 전체적인 기분을 올리고 긴장감을 완화하는 것을 도울 수 있다는 의미로 이어져요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>환경심리학자들은 물리적 \u003cb class=\"key\">밀도\u003c/b>와 심리적 \u003cb class=\"key\">혼잡성\u003c/b>을 구분한다.\u003c/li>\u003cli>대개 높은 밀도는 혼잡을 일으켜 \u003cb class=\"key\">감각적 \u003c/b>\u003cb class=\"key\">과부하\u003c/b>, \u003cb class=\"key\">통제 \u003c/b>\u003cb class=\"key\">결여\u003c/b>, \u003cb class=\"key\">스트레스\u003c/b>와 \u003cb class=\"key\">불안\u003c/b>을 유발한다.\u003c/li>\u003cli>그러나 혼잡성은 \u003cb class=\"key\">중립적\u003c/b>이어서 기분과 행동을 \u003cb class=\"key\">강화\u003c/b>하며, 긍정적 기대는 즐거움을 높이고 부정적 기대는 경험을 악화시킨다.\u003c/li>\u003cli>공격적 집단은 \u003cb class=\"key\">폭력적\u003c/b>이 될 수 있지만, \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">공간\u003c/b>은 기분을 올리고 \u003cb class=\"key\">긴장감\u003c/b>을 완화할 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Crowding is neutral in itself: it intensifies people's moods and behaviors according to their expectations, and positive urban spaces can help reduce tension.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">환경심리학자\u003c/b>들은 객관적 \u003cb class=\"key\">밀도\u003c/b>와 주관적 \u003cb class=\"key\">혼잡성\u003c/b>을 구분하며, 혼잡성은 그 자체로 부정적이기보다 \u003cb class=\"key\">중립적\u003c/b>이어서 밀도가 높아지면 사람들의 \u003cb class=\"key\">기분과 \u003c/b>\u003cb class=\"key\">행동\u003c/b>이 강화된다고 본다. 따라서 혼잡성은 개인의 기대와 집단의 \u003cb class=\"key\">지배적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 \u003cb class=\"key\">두드러지게\u003c/b> 하며, 공원이나 보행 구역 같은 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">공간\u003c/b>은 \u003cb class=\"key\">긴장감\u003c/b>을 완화할 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 지문을 정리하면, 환경심리학자들은 물리적 밀도와 심리적 혼잡성을 구분합니다. 혼잡성은 그 자체로 중립적이어서 사람들의 기분과 행동을 강화하는데, 콘서트처럼 긍정적인 기대는 즐거움을 높이고 공격적인 집단처럼 부정적인 상황은 폭력성을 키울 수 있습니다. 따라서 공원이나 보행 구역 같은 긍정적인 사회적 공간을 만들어 긴장을 완화하는 것이 중요하겠죠. 오늘 내용을 바탕으로 밀도와 혼잡성의 차이, 그리고 혼잡성이 기분을 증폭시킨다는 핵심을 꼭 기억하세요. 수고 많았습니다.","hl":null}]}]});</script></body></html>
