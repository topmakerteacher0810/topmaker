div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01개념 구분</div><ul><li>환경 심리학자들은 객관적인 측정치인 밀도와 주관적 느낌인 혼잡을 구분한다.</li><li>밀도(density): 특정 공간에 있는 사람의 수를 나타내는 물리적 측정치</li><li>혼잡(crowding): 공간이 충분하지 않다고 느끼는 심리적 감정</li><li>핵심 개념: 구분(distinction)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02일반적 인식</div><ul><li>일반적으로 높은 밀도는 혼잡 현상을 유발하여 사람들에게 부정적인 경험을 준다.</li><li>감각 과부하(sensory overload) 및 통제력 상실 유발</li><li>스트레스와 불안(anxiety)의 상승 원인</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03새로운 시각</div><ul><li>일부 심리학자들은 혼잡을 무조건 부정적인 것이 아니라 감정의 증폭제로 본다.</li><li>혼잡 자체를 부정적이기보다는 중립적(neutral)인 것으로 간주함</li><li>밀도가 증가할수록 사람들의 기분과 행동이 증폭됨(intensify)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04감정 증폭의 예시</div><ul><li>혼잡은 개인이 처한 기존의 감정 상태를 더욱 강하게 만든다.</li><li>기대하던 콘서트에서는 공연의 즐거움(enjoyment)을 향상함</li><li>두려워하던 행사에서는 개인의 경험을 훨씬 더 악화시킴</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05사회적 확장 및 시사점</div><ul><li>지역사회 설정에서 혼잡은 집단의 지배적 행동을 두드러지게 하며, 공간 설계를 통해 완화할 수 있다.</li><li>공격적인 집단은 밀도 상승 시 폭력적으로 변할 수 있음</li><li>공원 등 긍정적인 사회 공간 조성은 전반적 분위기를 개선하고 긴장(tension)을 완화함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make a distinction</td><td class=\"m\">구별하다, 차이를 두다</td></tr><tr><td class=\"w\">density</td><td class=\"m\">밀도, 빽빽함</td></tr><tr><td class=\"w\">crowding</td><td class=\"m\">혼잡, 붐빔</td></tr><tr><td class=\"w\">phenomenon</td><td class=\"m\">현상, 경이로운 것</td></tr><tr><td class=\"w\">sensory</td><td class=\"m\">감각의, 지각의</td></tr><tr><td class=\"w\">overload</td><td class=\"m\">과부하, 초과</td></tr><tr><td class=\"w\">neutral</td><td class=\"m\">중립적인, 한쪽으로 치우치지 않은</td></tr><tr><td class=\"w\">rather than</td><td class=\"m\">~보다는, ~대신에</td></tr><tr><td class=\"w\">invariably</td><td class=\"m\">변함없이, 예외 없이</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intensify</td><td class=\"m\">심해지다, 강화하다</td></tr><tr><td class=\"w\">look forward to</td><td class=\"m\">~을 고대하다, ~을 기대하다</td></tr><tr><td class=\"w\">enhance</td><td class=\"m\">향상시키다, 높이다</td></tr><tr><td class=\"w\">dread</td><td class=\"m\">두려워하다, 무서워하다</td></tr><tr><td class=\"w\">accentuate</td><td class=\"m\">강조하다, 두드러지게 하다</td></tr><tr><td class=\"w\">conversely</td><td class=\"m\">정반대로, 역으로</td></tr><tr><td class=\"w\">pedestrian</td><td class=\"m\">보행자의, 도보의</td></tr><tr><td class=\"w\">defuse</td><td class=\"m\">(긴장을) 완화하다, 진정시키다</td></tr><tr><td class=\"w\">tension</td><td class=\"m\">긴장, 불안</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">환경심리학자들은 구분한다</span><span class=\"en\"><b>Environmental psychologists <span class=\"grammar-hl\">make a distinction</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밀도의 물리적 측정과</span><span class=\"en\"><b><span class=\"grammar-hl\">between</span> the physical measurement of density</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(특정 장소에 얼마나 많은 사람들이 있는가)</span><span class=\"en\"><b>(<span class=\"grammar-hl\">how many people are in a particular space</span>)</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혼잡성 사이를</span><span class=\"en\"><b>and crowding</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(공간이 충분치 않다는 심리적 감정)</span><span class=\"en\"><b>(the psychological feeling of <span class=\"grammar-hl\">not having</span> enough space).</b></span></div></div><div class=\"lec-sent-ko\">환경심리학자들은 밀도(특정 장소에 얼마나 많은 사람들이 있는가)의 물리적 측정과 혼잡성(공간이 충분치 않다는 심리적 감정)을 구분한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로 두 가지 핵심 개념을 제시합니다. make a distinction은 눈에 보이는 물리적 수치인 &#39;밀도&#39;와 사람이 주관적으로 답답함을 느끼는 &#39;혼잡&#39;을 서로 다른 개념으로 나누어 본다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make a distinction between (관용표현): &#39;make a distinction between A and B&#39; 구조로 &#39;A와 B 사이를 구별하다&#39;라는 의미로 쓰이는 숙어이다.</div><div class=\"lec-gr-item\">how many people are in a particular space (간접의문문): 의문사구(how many people)가 주어 역할을 하며 동사(are)가 이어지는 &#39;의문사(주어) + 동사&#39; 구조의 간접의문문으로, 앞 명사(measurement of density)의 내용을 구체적으로 부연 설명하는 명사절 역할을 한다.</div><div class=\"lec-gr-item\">not having (동명사): 전치사 of의 목적어 역할을 하는 동명사 having이며, 준동사인 동명사를 부정하기 위해 바로 앞에 부정어 not이 위치한 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">make a distinction</td><td class=\"m\">구별하다, 차이를 두다</td></tr><tr><td class=\"w\">density</td><td class=\"m\">밀도, 빽빽함</td></tr><tr><td class=\"w\">crowding</td><td class=\"m\">혼잡, 붐빔</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대개 높은 밀도는 요구된다</span><span class=\"en\"><b>Usually, high density <span class=\"grammar-hl\">is needed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혼잡 현상을 위해</span><span class=\"en\"><b>for the phenomenon of crowding,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이는 사람들이 경험하게 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">which</span> <span class=\"grammar-hl\">makes people experience</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감각적 과부하, 통제 결여, 그리고 증가하는 스트레스와 불안을</span><span class=\"en\"><b>sensory overload, a lack of control, and <span class=\"grammar-hl\">rising</span> stress and anxiety.</b></span></div></div><div class=\"lec-sent-ko\">대개 높은 밀도는 혼잡 현상이 요구되고, 이는 사람들이 감각적 과부하, 통제 결여와 증가하는 스트레스와 불안을 경험하게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 구별한 두 개념의 관계를 설명하며 사람들이 흔히 가지는 통념을 보여 줍니다. 물리적으로 사람이 빽빽할 때 심리적인 답답함을 느끼고, 이로 인해 부정적인 감정을 겪는다는 것입니다. sensory overload는 사람이 한 번에 처리할 수 있는 범위를 넘어서는 너무 많은 자극(시각적 복잡함, 소음 등)이 뇌로 쏟아져 들어오는 상태를 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is needed (수동태): be동사(is) + p.p.(needed) 구조. need는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) is needed 형태로 쓴다. 기본구조: need + O (O를 필요로 하다).</div><div class=\"lec-gr-item\">which (관계대명사): 앞의 명사구(the phenomenon of crowding)를 선행사로 받아 부연 설명하는 계속적 용법의 주격 관계대명사이며, 뒤에는 주어가 생략된 불완전한 절이 이어진다.</div><div class=\"lec-gr-item\">makes people experience 5형식(SVOC) 구조: 사역동사 make(V) + 목적어(people) + 목적격 보어(동사원형 experience) 구조로, 목적어가 보어 동작을 &#39;하게 만들다&#39;라는 의미를 형성한다.</div><div class=\"lec-gr-item\">rising (현재분사): &#39;-ing + N&#39; 구조로, 현재분사 rising이 뒤의 명사구(stress and anxiety)를 수식하여 &#39;상승하는/증가하는 스트레스와 불안&#39;이라는 동작 및 상태의 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">density</td><td class=\"m\">밀도, 빽빽함</td></tr><tr><td class=\"w\">crowding</td><td class=\"m\">혼잡, 붐빔</td></tr><tr><td class=\"w\">phenomenon</td><td class=\"m\">현상, 경이로운 것</td></tr><tr><td class=\"w\">sensory</td><td class=\"m\">감각의, 지각의</td></tr><tr><td class=\"w\">overload</td><td class=\"m\">과부하, 초과</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 몇몇 심리학자들은 혼잡성을 본다</span><span class=\"en\"><b>However, some psychologists <span class=\"grammar-hl\">see crowding</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">변함없이 부정적인 것으로 보기보다 중립적으로</span><span class=\"en\"><b><span class=\"grammar-hl\">as neutral</span> <span class=\"grammar-hl\">rather than</span> invariably negative,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 믿는다</span><span class=\"en\"><b>and believe</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들의 기분과 행동이 강화된다고</span><span class=\"en\"><b>that people's moods and behaviors intensify</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밀도가 올라감에 따라</span><span class=\"en\"><b>as density increases.</b></span></div></div><div class=\"lec-sent-ko\">하지만 몇몇 심리학자들은 혼잡성을 변함없이 부정적인 것으로 보기보다 중립적으로 보고, 밀도가 올라감에 따라 사람들의 기분과 행동도 강화된다는 것을 믿는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 역접을 통해 앞의 통념을 뒤집으며 이 글의 핵심 주제를 드러냅니다. 글쓴이는 여기서 neutral을 힘주어 말합니다. 혼잡함 그 자체는 좋고 나쁨이 없으며, 단지 사람이 원래 가지고 있던 감정이나 행동을 더 크고 강하게 부풀려 주는 확성기 같은 역할을 할 뿐이라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">see crowding as neutral (관용표현): &#39;see A as B&#39; 기본구조로 &#39;A(crowding)를 B(neutral)로 간주하다/여기다&#39;라는 의미를 나타내는 표현이다.</div><div class=\"lec-gr-item\">rather than (관용표현): &#39;~라기보다는&#39;이라는 의미로 쓰여 앞뒤의 어구를 비교하거나 대조할 때 사용하는 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">density</td><td class=\"m\">밀도, 빽빽함</td></tr><tr><td class=\"w\">crowding</td><td class=\"m\">혼잡, 붐빔</td></tr><tr><td class=\"w\">neutral</td><td class=\"m\">중립적인, 한쪽으로 치우치지 않은</td></tr><tr><td class=\"w\">rather than</td><td class=\"m\">~보다는, ~대신에</td></tr><tr><td class=\"w\">invariably</td><td class=\"m\">변함없이, 예외 없이</td></tr><tr><td class=\"w\">intensify</td><td class=\"m\">심해지다, 강화하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그래서, 예를 들어, 한 개인이 콘서트를 기대하고 있다면,</span><span class=\"en\"><b>So if an individual is <span class=\"grammar-hl\">looking forward to</span> a concert, say,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혼잡성의 느낌은 높인다</span><span class=\"en\"><b>the feeling of crowding enhances</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 공연의 즐거움을</span><span class=\"en\"><b>their enjoyment of the performance.</b></span></div></div><div class=\"lec-sent-ko\">그래서, 예를 들어, 한 개인이 콘서트를 기대하고 있다면, 혼잡성의 느낌은 공연의 즐거움을 높인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;감정이 강렬해진다&#39;는 주장에 대한 긍정적 예시입니다. enhances their enjoyment는 원래 기대하고 즐거워하던 마음이 주변에 사람이 빽빽하게 모여 같이 열광함으로 인해 더욱 들뜨고 신나게 커진다는 것을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">looking forward to (관용표현): &#39;look forward to + 명사(또는 동명사)&#39; 구조로 &#39;~을 고대하다, 기대하다&#39;라는 의미로 쓰이는 숙어이다. 여기서 to는 전치사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">crowding</td><td class=\"m\">혼잡, 붐빔</td></tr><tr><td class=\"w\">enhance</td><td class=\"m\">향상시키다, 높이다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 만약 그들이 행사를 두려워하고 있다면,</span><span class=\"en\"><b>But if they are dreading an event,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혼잡성은 개인의 그것을 겪는 경험을 만들 것이다</span><span class=\"en\"><b>crowding will <span class=\"grammar-hl\">make the person's experience of it</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">훨씬 더 나쁘게</span><span class=\"en\"><b><span class=\"grammar-hl\">even worse</span>.</b></span></div></div><div class=\"lec-sent-ko\">그러나 만약 그들이 행사를 두려워하고 있다면, 혼잡성은 개인의 그것을 겪는 경험을 훨씬 더 나쁘게 만들 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 긍정적 예시와 대비되는 부정적 예시를 덧붙여 주장을 뒷받침합니다. even worse는 참석하기 싫은 자리에 사람까지 붐비게 되면 불쾌감과 짜증이 평소보다 훨씬 더 심해진다는 뜻입니다. 혼잡함이 원래의 감정을 증폭시킨다는 원리가 그대로 적용된 장면입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make the person&#39;s experience of it even worse 5형식(SVOC) 구조: 불완전 타동사 make(V) + 목적어(the person&#39;s experience of it) + 목적격 보어(형용사 비교급 even worse) 구조로, 목적어를 보어 상태로 &#39;만들다&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">crowding</td><td class=\"m\">혼잡, 붐빔</td></tr><tr><td class=\"w\">dread</td><td class=\"m\">두려워하다, 무서워하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">공동체 환경에 넣어보면,</span><span class=\"en\"><b><span class=\"grammar-hl\">Put into a community setting</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">혼잡성은 지배적 행동을 두드러지게 할 수 있다</span><span class=\"en\"><b>crowding may accentuate the dominant behavior</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즉 공격적인 집단이 폭력적으로 될 수 있다</span><span class=\"en\"><b>― an aggressive group may turn violent</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">밀도가 올라감에 따라</span><span class=\"en\"><b>as density rises.</b></span></div></div><div class=\"lec-sent-ko\">공동체 환경에 넣어보면, 혼잡성은 지배적 행동을 두드러지게 하는데, 공격적인 집단이 밀도가 올라감에 따라 폭력적으로 될 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 논의의 초점을 개인의 감정에서 집단 및 지역 사회의 행동 증폭으로 확장합니다. 학술 글에서 주로 쓰이는 accentuate the dominant behavior는 그 집단이 원래 띠고 있던 가장 주된 성향이나 분위기를 더욱 눈에 띄게 폭발시킨다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Put into a community setting (분사구문): 과거분사(p.p.) Put으로 시작하여 부사적 기능을 하는 분사구문이다. 원래 절로의 변환은 &#39;when + it + is + put into a community setting&#39; (또는 if + it + is + put...) 이며, 접속사와 주어(주절의 주어 crowding을 받는 대명사 it)가 생략되고 동사가 과거분사 형태(put-put-put)로 남은 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">density</td><td class=\"m\">밀도, 빽빽함</td></tr><tr><td class=\"w\">crowding</td><td class=\"m\">혼잡, 붐빔</td></tr><tr><td class=\"w\">accentuate</td><td class=\"m\">강조하다, 두드러지게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">반대로 긍정적인 사회적 공간을 만드는 것은</span><span class=\"en\"><b>Conversely, <span class=\"grammar-hl\">creating</span> positive social spaces</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공원이나 보행 구역과 같은</span><span class=\"en\"><b>such as parks and pedestrian areas</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">높은 밀도의 도시 환경에서</span><span class=\"en\"><b>in high-density urban environments</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전체적인 기분을 올리고 긴장감을 완화하는 것을 도울 수 있다</span><span class=\"en\"><b>may help <span class=\"grammar-hl\">to lift</span> the general mood and <span class=\"grammar-hl\">defuse</span> tension.</b></span></div></div><div class=\"lec-sent-ko\">반대로 높은 밀도의 도시 환경에 있는 공원이나 보행 구역과 같은 긍정적인 사회적 공간은 전체적인 기분을 올리고 긴장감을 완화하는 것을 도울 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급된 폭력적 집단의 예시와 대비하여, 긍정적인 환경 조성을 통해 좋은 방향으로 감정을 증폭시키는 해결책을 제시하며 글을 마무리합니다. defuse tension은 사람들이 빽빽하게 모여 있어 생길 수 있는 심리적 압박감이나 갈등의 불씨를 부드럽게 가라앉히고 해소해 준다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">creating (동명사): 동사원형에 -ing가 결합되어 문장 전체의 주어 역할을 하는 명사적 기능을 수행한다.</div><div class=\"lec-gr-item\">to lift (to부정사): 동사 help의 목적어 역할을 하는 명사적 용법의 to부정사 구조이다. help는 목적어로 to부정사나 동사원형을 취할 수 있다.</div><div class=\"lec-gr-item\">defuse (to부정사): 등위접속사 and를 통해 앞의 to lift와 병렬 구조를 이루며, 앞에 to가 생략된 원형 부정사(to부정사) 형태로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">density</td><td class=\"m\">밀도, 빽빽함</td></tr><tr><td class=\"w\">conversely</td><td class=\"m\">정반대로, 역으로</td></tr><tr><td class=\"w\">pedestrian</td><td class=\"m\">보행자의, 도보의</td></tr><tr><td class=\"w\">defuse</td><td class=\"m\">(긴장을) 완화하다, 진정시키다</td></tr><tr><td class=\"w\">tension</td><td class=\"m\">긴장, 불안</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>환경 심리학자들은 물리적 수치인 &#39;밀도&#39;와 주관적 느낌인 &#39;혼잡&#39;을 구분한다.</li><li>흔히 혼잡을 스트레스와 불안을 유발하는 부정적 현상으로만 생각하기 쉽다.</li><li>하지만 혼잡은 그 자체로 부정적인 것이 아니라, 사람들이 원래 가지고 있던 기분이나 행동을 증폭시키는 중립적 역할을 한다.</li><li>따라서 개인이 긍정적인 상황에 있다면 즐거움이 더 커지지만, 부정적 상황이나 공격적인 집단에서는 불쾌감과 폭력성이 더 심해진다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Although crowding is often perceived as a negative experience caused by high density, it actually functions as a neutral psychological amplifier that intensifies people&#39;s existing emotions and dominant behaviors.</div>\n              <div class=\"lec-final-sum-ko\">혼잡함은 종종 높은 밀도로 인해 발생하는 부정적인 경험으로 인식되지만, 실제로는 사람들의 기존 감정과 지배적인 행동을 강화하는 중립적인 심리적 증폭기로 기능한다.</div></div></div>"],"segs":[[{"audio":"./38_audio/1.mp3","hl":null}],[{"audio":"./38_audio/2.mp3","hl":null}],[{"audio":"./38_audio/3.mp3","hl":null},{"audio":"./38_audio/4.mp3","hl":"stage-0"},{"audio":"./38_audio/5.mp3","hl":"stage-1"},{"audio":"./38_audio/6.mp3","hl":"stage-2"},{"audio":"./38_audio/7.mp3","hl":"stage-3"},{"audio":"./38_audio/8.mp3","hl":"stage-4"}],[{"audio":"./38_audio/9.mp3","hl":null}],[{"audio":"./38_audio/10.mp3","hl":"main"},{"audio":"./38_audio/11.mp3","hl":"meaning"},{"audio":"./38_audio/12.mp3","hl":"grammar"}],[{"audio":"./38_audio/13.mp3","hl":"main"},{"audio":"./38_audio/14.mp3","hl":"meaning"},{"audio":"./38_audio/15.mp3","hl":"grammar"}],[{"audio":"./38_audio/16.mp3","hl":"main"},{"audio":"./38_audio/17.mp3","hl":"meaning"},{"audio":"./38_audio/18.mp3","hl":"grammar"}],[{"audio":"./38_audio/19.mp3","hl":"main"},{"audio":"./38_audio/20.mp3","hl":"meaning"},{"audio":"./38_audio/21.mp3","hl":"grammar"}],[{"audio":"./38_audio/22.mp3","hl":"main"},{"audio":"./38_audio/23.mp3","hl":"meaning"},{"audio":"./38_audio/24.mp3","hl":"grammar"}],[{"audio":"./38_audio/25.mp3","hl":"main"},{"audio":"./38_audio/26.mp3","hl":"meaning"},{"audio":"./38_audio/27.mp3","hl":"grammar"}],[{"audio":"./38_audio/28.mp3","hl":"main"},{"audio":"./38_audio/29.mp3","hl":"meaning"},{"audio":"./38_audio/30.mp3","hl":"grammar"}],[{"audio":"./38_audio/31.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
