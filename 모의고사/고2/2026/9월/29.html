iv>","<div class=\"lec-cover-title\">Capitalism&#39;s Survival Strategy: The Search for Cheap Frontiers<small>자본주의의 생존 전략: 저렴한 프런티어(개척지)를 향한 탐색</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 깊이 있게 이해하시려면 자본주의(Capitalism)가 단순히 돈을 주고받는 경제 시스템을 넘어 자연과 인력을 어떻게 활용하는지 분석하는 세계-생태학(World-ecology)적 관점을 알아두시는 것이 좋습니다. 마치 우리가 대형 마트에서 아주 싼값에 식재료를 살 수 있는 이면에는 누군가의 값싼 노동력과 보이지 않는 환경 파괴가 존재하는 것처럼, 자본주의는 모든 것이 돈으로 연결된 화폐 관계(Cash nexus)를 유지하기 위해 외부로부터 끊임없이 저렴한 자연(Cheap nature)을 착취하며 굴러갑니다. 하지만 노동자의 권리 의식이 높아져 노동 비용이 오르고 기후 변화로 자원이 고갈되면서 이 시스템을 유지하는 비용이 점점 비싸지게 되는데, 경제학자들은 이를 자본주의의 구조적 위기(Structural crisis)라고 부르죠. 따라서 자본주의는 위기를 극복하기 위해 마치 새로운 금광을 찾아 떠나는 카우보이처럼, 아직 값싸게 빼앗을 수 있는 인력과 자원이 남아있는 프런티어(Frontiers), 즉 새로운 개척지를 필사적으로 찾아 헤매게 된다는 전체적인 맥락을 기억하시고 지문을 읽어보세요!</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01자본주의의 구조</div><ul><li>자본주의는 현금이 지배하는 시스템이 아니라, 값싼 자연이라는 바다 속에 존재하는 현금 교환의 섬과 같다.</li><li>현금 교환의 섬(islands of cash exchange)과 값싼 자연(cheap natures)의 바다로 구성됨</li><li>현금 결합(cash nexus) 내에서 생명을 재생산하는 비용은 갈수록 비싸짐</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02불평등과 사회적 위기</div><ul><li>노동자의 임금을 억제하더라도, 결국 불평등이 심화되어 사회적 위기와 저항을 초래한다.</li><li>노동자 임금(wages)의 동결 및 삭감에는 한계가 존재함</li><li>심화된 불평등(inequality)은 포퓰리즘 시위와 같은 위기(crises)를 유발함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03생산 요소의 비용 상승</div><ul><li>시간이 지남에 따라 노동, 에너지, 식량 등 자본주의를 유지하는 데 필요한 자원들의 비용이 증가한다.</li><li>노동자의 존엄성 요구로 인한 노동(labor) 비용 상승</li><li>자원의 소모로 인해 더 이상 값싸지 않은 에너지(energy)</li><li>기후 변화로 인한 농작물(crops) 수확량 감소</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04프런티어의 중요성 대두</div><ul><li>모든 비용이 상승하는 구조 속에서, 자본주의는 새롭게 착취할 수 있는 값싼 개척지를 필수적으로 요구한다.</li><li>새로운 값싼 자원(cheap things)을 확보할 수 있는 장소 제공</li><li>인간과 자연의 값싼 노동(cheap work)을 강제적으로 탈취할 수 있음</li><li>비용 상승의 탈출구로서 프런티어(frontiers)가 매우 중요해짐</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">capitalism</td><td class=\"m\">자본주의</td></tr><tr><td class=\"w\">potentially</td><td class=\"m\">잠재적으로, 어쩌면</td></tr><tr><td class=\"w\">reproduce</td><td class=\"m\">재생산하다, 번식하다, 복제하다</td></tr><tr><td class=\"w\">over time</td><td class=\"m\">시간이 지남에 따라, 서서히</td></tr><tr><td class=\"w\">wage</td><td class=\"m\">임금, 급료</td></tr><tr><td class=\"w\">freeze</td><td class=\"m\">동결하다, 얼다</td></tr><tr><td class=\"w\">roll back</td><td class=\"m\">(가격을) 인하하다, (과거 상태로) 되돌리다</td></tr><tr><td class=\"w\">in the end</td><td class=\"m\">결국, 마침내</td></tr><tr><td class=\"w\">inequality</td><td class=\"m\">불평등, 불균형</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">bring about</td><td class=\"m\">야기하다, 초래하다</td></tr><tr><td class=\"w\">populist</td><td class=\"m\">대중주의적인, 포퓰리즘의</td></tr><tr><td class=\"w\">dignity</td><td class=\"m\">존엄성, 품위</td></tr><tr><td class=\"w\">burn through</td><td class=\"m\">(자원 등을) 빠르게 소모하다, 다 써버리다</td></tr><tr><td class=\"w\">no longer</td><td class=\"m\">더 이상 ~않다</td></tr><tr><td class=\"w\">abundantly</td><td class=\"m\">풍부하게, 넘칠 정도로</td></tr><tr><td class=\"w\">frontier</td><td class=\"m\">미개척지, 국경</td></tr><tr><td class=\"w\">seize</td><td class=\"m\">장악하다, 빼앗다, 꽉 쥐다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">자본주의는 시스템이 아니다</span><span class=\"en\"><b>Capitalism is not a system</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현금이 어디에나 존재하는</span><span class=\"en\"><b><span class=\"grammar-hl\">where</span> cash is everywhere</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">오히려 시스템(것)이다</span><span class=\"en\"><b>but rather one</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현금 교환이라는 섬들이 존재하는</span><span class=\"en\"><b><span class=\"grammar-hl\">in which</span> islands of cash exchange exist</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">값싼 혹은 잠재적으로 값싼 만물의 바다 안에</span><span class=\"en\"><b>within oceans of cheap ― or potentially cheap ― natures.</b></span></div></div><div class=\"lec-sent-ko\">자본주의는 현금이 어디에나 존재하는 시스템이라기보다는, 값싼 혹은 잠재적으로 값싼 만물의 바다 안에 현금 교환이라는 섬들이 존재하는 시스템이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 주제를 제시하는 첫 문장입니다. 자본주의가 단순히 모든 것을 돈으로 사고파는 체제가 아님을 밝히며 시작합니다. islands of cash exchange exist within oceans of cheap natures는 넓은 바다처럼 끝없이 펼쳐진 값싼 자연환경이나 자원이 바탕에 깔려 있어야만, 그 위에서 섬처럼 제한된 영역에서 벌어지는 화폐 경제가 유지될 수 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where (관계부사): 장소적 개념의 선행사 a system을 수식하며, 뒤에 주어(cash)와 동사(is)를 갖춘 완전한 절이 이어지는 구조이다.</div><div class=\"lec-gr-item\">not a system ... but rather one (관용표현): 상관접속사 &#39;not A but (rather) B&#39; 구조로 &#39;A가 아니라 (오히려) B&#39;라는 의미를 나타낸다. 여기서 one은 앞의 단수 명사 a system을 대신하는 대명사이다.</div><div class=\"lec-gr-item\">in which (전치사+관계대명사): &#39;전치사(in) + 관계대명사(which) + S + V ...&#39;의 관계대명사절 구조로 앞의 대명사 one을 수식한다. 뒤에 주어(islands of cash exchange)와 자동사(exist)가 위치하여 문장을 이룬다. 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절(완전문장)이 온다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">capitalism</td><td class=\"m\">자본주의</td></tr><tr><td class=\"w\">potentially</td><td class=\"m\">잠재적으로, 어쩌면</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">현금 거래 관계 내에서 삶을 재생산하는 것은</span><span class=\"en\"><b><span class=\"grammar-hl\">Reproducing</span> life within the cash nexus</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비싸다</span><span class=\"en\"><b>is expensive,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그것은 더 비싸진다</span><span class=\"en\"><b>and it grows more expensive</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시간이 흐를수록</span><span class=\"en\"><b>over time.</b></span></div></div><div class=\"lec-sent-ko\">현금 거래 관계 내에서 삶을 재생산하는 것은 비싸고, 시간이 흐를수록 그것은 더 비싸진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 &#39;현금 교환이라는 섬&#39; 내부의 현실을 구체적으로 설명합니다. 화폐 경제 안에서 살아가는 데 막대한 비용이 든다는 점을 지적합니다. Reproducing life within the cash nexus는 사람들이 임금을 받고 물건을 사며 생계를 이어가는 자본주의 시스템의 한가운데서 먹고살고 아이를 기르는 일상적인 삶을 유지하는 과정을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Reproducing (동명사): -ing가 명사 역할을 하여 문장의 주어로 쓰였다. 구(phrase) 주어이므로 뒤에 단수 동사 is가 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">over time</td><td class=\"m\">시간이 지남에 따라, 서서히</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">노동자의 임금은 동결될 수 있다</span><span class=\"en\"><b>Workers' wages <span class=\"grammar-hl\">can be frozen</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심지어 삭감될(수도 있다)</span><span class=\"en\"><b>even <span class=\"grammar-hl\">rolled back</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 결국</span><span class=\"en\"><b>but in the end</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불평등은 그런 종류의 위기를 초래한다</span><span class=\"en\"><b>inequality <span class=\"grammar-hl\">leads to</span> crises of the kind</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 최근 포퓰리스트 시위를 발생시켰다고 목격한</span><span class=\"en\"><b>we've recently <span class=\"grammar-hl\">seen bring about</span> populist protests</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국과 영국에서</span><span class=\"en\"><b>in the United States and the United Kingdom.</b></span></div></div><div class=\"lec-sent-ko\">노동자의 임금은 동결되거나 심지어 삭감될 수 있지만, 결국 불평등은 우리가 최근 미국과 영국에서 포퓰리스트 시위를 발생시켰다고 목격한 것과 같은 종류의 위기를 초래한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 비용 상승 문제와 연결되어, 이를 억누르려 할 때 발생하는 부작용을 제시합니다. 자본주의가 비용을 줄이려고 노동자에게 돌아가는 돈을 억눌러도, 그로 인해 불평등이 심해지면 사회적 폭발이 일어난다는 논리입니다. leads to crises of the kind는 미국이나 영국의 대중 시위처럼 정치적, 사회적 안정을 송두리째 흔드는 걷잡을 수 없는 혼란 상태를 만들어 낸다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be frozen (수동태): 조동사(can) + be동사(be) + p.p.(frozen) 구조. 기본구조: freeze + O (얼리다/동결하다). freeze는 타동사인데 뒤에 목적어가 없어서 수동구조 can be frozen 형태로 쓴다.</div><div class=\"lec-gr-item\">rolled back (수동태): 병렬 구조로 인해 앞에 can be가 생략된 (can be) + p.p.(rolled) 구조. 기본구조: roll back + O (되돌리다/철회하다). roll back은 타동사인데 뒤에 목적어가 없어서 수동구조 rolled back 형태로 쓴다.</div><div class=\"lec-gr-item\">leads to (관용표현): lead to + 명사/동명사 (~로 이어지다, ~을 초래하다) 구조로, 전치사 to가 쓰이는 표현이다.</div><div class=\"lec-gr-item\">seen bring about 5형식(SVOC) 구조: 기본구조는 &#39;지각동사(see) + O + 목적격 보어(동사원형 bring about)&#39;이다. 여기서는 선행사 the kind 뒤에 목적격 관계대명사가 생략되어 관계대명사가 목적어 역할을 대신하고, 그 결과 목적격 보어인 동사원형 bring about이 동사 바로 뒤에 남은 구조이다.</div><div class=\"lec-gr-item\">bring about (관용표현): 타동사구로 &#39;~을 야기하다, 초래하다&#39;라는 의미를 지닌다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">wage</td><td class=\"m\">임금, 급료</td></tr><tr><td class=\"w\">in the end</td><td class=\"m\">결국, 마침내</td></tr><tr><td class=\"w\">inequality</td><td class=\"m\">불평등, 불균형</td></tr><tr><td class=\"w\">bring about</td><td class=\"m\">야기하다, 초래하다</td></tr><tr><td class=\"w\">populist</td><td class=\"m\">대중주의적인, 포퓰리즘의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">노동자들은 존엄성을 요구한다</span><span class=\"en\"><b>Workers <span class=\"grammar-hl\">demand dignity</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그들의 노동력은 비싸진다</span><span class=\"en\"><b>and their labor becomes expensive.</b></span></div></div><div class=\"lec-sent-ko\">노동자들은 존엄성을 요구하고, 그들의 노동력은 비싸진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 시위와 위기를 겪은 후 이어지는 상황을 보여줍니다. 사람들은 기계 부품 취급을 거부하고 합당한 대우를 원하게 되며, 이는 결국 노동 비용의 상승으로 귀결됨을 설명합니다. Workers demand dignity는 단순히 임금 인상을 넘어, 최소한의 인간다운 삶을 보장받고 정당한 권리를 인정해 달라고 노동자들이 목소리를 내는 모습을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">demand dignity (타동사+목적어): demand는 타동사로 바로 뒤에 목적어 dignity를 취하여 3형식 문장을 구성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dignity</td><td class=\"m\">존엄성, 품위</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">생산 과정은 섬을 고갈시킨다</span><span class=\"en\"><b>Production processes <span class=\"grammar-hl\">burn through</span> an island,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 에너지는 더 이상 값싸지 않게 된다</span><span class=\"en\"><b>and energy is <span class=\"grammar-hl\">no longer</span> cheap.</b></span></div></div><div class=\"lec-sent-ko\">생산 과정은 섬(현금 교환의 섬)을 고갈시키며, 에너지는 더 이상 값싸지 않게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 노동 비용 상승에 이어 자원 비용 상승의 문제를 다룹니다. 물건을 만들어내는 과정이 자원을 마구 소모하여 비용 부담을 가중시키는 상황을 묘사합니다. burn through an island에서 글쓴이는 첫 문장의 &#39;섬&#39; 비유를 다시 가져옵니다. 제한된 자원이나 에너지를 생산 활동에 쏟아부어 완전히 고갈시켜 버리는 상태를 눈에 보이듯이 표현하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">burn through (관용표현): &#39;~을 다 써버리다, 빠르게 소모하다&#39;라는 의미를 나타내는 타동사적 구동사이다.</div><div class=\"lec-gr-item\">no longer (관용표현): &#39;더 이상 ~않다&#39;라는 의미의 부사구로, 동사를 부정하여 문장 전체에 부정의 의미를 더한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">burn through</td><td class=\"m\">(자원 등을) 빠르게 소모하다, 다 써버리다</td></tr><tr><td class=\"w\">no longer</td><td class=\"m\">더 이상 ~않다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">기후가 변화한다</span><span class=\"en\"><b>The climate changes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 작물은 더 이상 자랄 수 없다</span><span class=\"en\"><b>and crops can no longer grow</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한때 그랬던 것처럼 풍부하게</span><span class=\"en\"><b><span class=\"grammar-hl\">as abundantly as</span> they once <span class=\"grammar-hl\">did</span>.</b></span></div></div><div class=\"lec-sent-ko\">기후가 변화하고, 작물은 한때 그랬던 것처럼 더 이상 풍부하게 자라지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 에너지 비용에 이어 식량 자원 문제까지 언급하며 위기 상황을 더욱 확장합니다. 환경 파괴로 인해 기본적인 먹거리 생산마저 위협받고 있음을 뒷받침합니다. as abundantly as they once did는 자연이 스스로 풍요롭게 자원을 내어주던 과거의 상태가 이제는 한계에 부딪혀 끝났음을 확인시켜 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">as abundantly as (동등비교): &#39;as + 원급 + as&#39; 구조로 &#39;~만큼 ...한/하게&#39;라는 의미이다. 앞의 동사 grow를 수식하므로 부사 abundantly가 쓰였다.</div><div class=\"lec-gr-item\">did (대동사): 앞의 일반동사구(grow as abundantly)를 대신하여 반복을 피하는 대동사(pro-verb)이다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">no longer</td><td class=\"m\">더 이상 ~않다</td></tr><tr><td class=\"w\">abundantly</td><td class=\"m\">풍부하게, 넘칠 정도로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">미개척 영역이 매우 중요하다</span><span class=\"en\"><b>Frontiers are so important</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 과정에서</span><span class=\"en\"><b>in these processes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 그것이 장소를 제공하기 때문이다</span><span class=\"en\"><b>because they offer places</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 값싼 것들이 확보될 수 있는</span><span class=\"en\"><b><span class=\"grammar-hl\">where</span> the new cheap things <span class=\"grammar-hl\">can be seized</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">즉, 값싼 인간의 노동력과 다른 만물이</span><span class=\"en\"><b>― and the cheap work of humans and other natures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강제로 취해질 수 있다는 (것이다)</span><span class=\"en\"><b><span class=\"grammar-hl\">can be forcefully taken</span>.</b></span></div></div><div class=\"lec-sent-ko\">이러한 과정에서 미개척 영역이 중요한데, 왜냐하면 그것이 새로운 값싼 것들이 확보될 수 있는 장소를 제공하기 때문이다. 즉, 값싼 인간의 노동력과 다른 만물이 강제로 취해질 수 있다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞에서 나열한 비용 상승과 자원 고갈이라는 한계를 돌파하기 위한 자본주의의 해결책을 제시하며 글을 맺습니다. 결국 자본주의는 비용이 폭발하는 기존의 체제를 유지하기 위해 또 다른 값싼 자연과 노동력이 존재하는 외부로 눈을 돌려야만 한다는 결론입니다. new cheap things can be seized는 정당한 대가를 치르지 않고 아직 자본주의에 편입되지 않은 새로운 지역의 자원과 사람들을 헐값에 탈취하고 착취하는 폭력적인 속성을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">where (관계부사): 장소를 나타내는 선행사 places를 수식하며, 뒤에 수동태로 이루어져 구조적으로 완전한 절이 이어진다.</div><div class=\"lec-gr-item\">can be seized (수동태): 조동사(can) + be동사(be) + p.p.(seized) 구조. 기본구조: seize + O (붙잡다/장악하다/빼앗다). seize는 타동사인데 뒤에 목적어가 없어서 수동구조 can be seized 형태로 쓴다.</div><div class=\"lec-gr-item\">can be forcefully taken (수동태): 조동사(can) + be동사(be) + 부사(forcefully) + p.p.(taken) 구조. 기본구조: take + O (가져가다/취하다). take는 타동사인데 뒤에 목적어가 없어서 수동구조 can be taken 형태로 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">frontier</td><td class=\"m\">미개척지, 국경</td></tr><tr><td class=\"w\">seize</td><td class=\"m\">장악하다, 빼앗다, 꽉 쥐다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>자본주의는 막대한 무상 자연 위에 세워진 제한적인 화폐 경제다.</li><li>이 체제 안에서는 생계 유지 비용이 계속 상승하며, 노동자의 몫을 억누르면 불평등으로 인한 거센 저항에 부딪힌다.</li><li>노동 비용 증가, 자원 고갈, 기후 변화로 인해 내부적으로 생산을 이어가는 일은 갈수록 감당하기 어려워진다.</li><li>결국 자본주의는 이 위기를 극복하기 위해, 값싼 자원과 노동력을 강제로 빼앗을 수 있는 새로운 미개척지를 끊임없이 찾아 나서게 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">As the cost of sustaining capitalism naturally increases over time, the system constantly requires new frontiers to seize cheap resources and labor.</div>\n              <div class=\"lec-final-sum-ko\">자본주의를 유지하는 비용이 시간이 지남에 따라 필연적으로 증가함에 따라, 이 체제는 저렴한 자원과 노동력을 확보하기 위해 끊임없이 새로운 프런티어(개척지)를 요구한다.</div></div></div>"],"segs":[[{"audio":"./29_audio/1.mp3","hl":null}],[{"audio":"./29_audio/2.mp3","hl":null}],[{"audio":"./29_audio/3.mp3","hl":null},{"audio":"./29_audio/4.mp3","hl":"stage-0"},{"audio":"./29_audio/5.mp3","hl":"stage-1"},{"audio":"./29_audio/6.mp3","hl":"stage-2"},{"audio":"./29_audio/7.mp3","hl":"stage-3"}],[{"audio":"./29_audio/8.mp3","hl":null}],[{"audio":"./29_audio/9.mp3","hl":"main"},{"audio":"./29_audio/10.mp3","hl":"meaning"},{"audio":"./29_audio/11.mp3","hl":"grammar"}],[{"audio":"./29_audio/12.mp3","hl":"main"},{"audio":"./29_audio/13.mp3","hl":"meaning"},{"audio":"./29_audio/14.mp3","hl":"grammar"}],[{"audio":"./29_audio/15.mp3","hl":"main"},{"audio":"./29_audio/16.mp3","hl":"meaning"},{"audio":"./29_audio/17.mp3","hl":"grammar"}],[{"audio":"./29_audio/18.mp3","hl":"main"},{"audio":"./29_audio/19.mp3","hl":"meaning"},{"audio":"./29_audio/20.mp3","hl":"grammar"}],[{"audio":"./29_audio/21.mp3","hl":"main"},{"audio":"./29_audio/22.mp3","hl":"meaning"},{"audio":"./29_audio/23.mp3","hl":"grammar"}],[{"audio":"./29_audio/24.mp3","hl":"main"},{"audio":"./29_audio/25.mp3","hl":"meaning"},{"audio":"./29_audio/26.mp3","hl":"grammar"}],[{"audio":"./29_audio/27.mp3","hl":"main"},{"audio":"./29_audio/28.mp3","hl":"meaning"},{"audio":"./29_audio/29.mp3","hl":"grammar"}],[{"audio":"./29_audio/30.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
