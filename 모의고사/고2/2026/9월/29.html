lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 29번","audioDir":"29_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">29번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Conditioned Place Preference: How We Know What Animals Want\u003c/h1>\u003ch2>동물이 원하는 것을 알아내는 조건부 장소 선호도\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">조건부 \u003c/b>\u003cb class=\"key\">장소 \u003c/b>\u003cb class=\"key\">선호도\u003c/b>는 \u003cb class=\"key\">동물\u003c/b>이 \u003cb class=\"key\">보상\u003c/b>이나 \u003cb class=\"key\">불쾌한 \u003c/b>\u003cb class=\"key\">자극\u003c/b>을 어떻게 느끼는지 \u003cb class=\"key\">장소\u003c/b>에 대한 선호 변화로 측정한다. \u003cb class=\"key\">암\u003c/b>에 걸린 쥐가 \u003cb class=\"key\">모르핀\u003c/b>이 주어진 장소를 선호한 것은 \u003cb class=\"key\">통증 \u003c/b>\u003cb class=\"key\">완화\u003c/b>를 원했음을 시사한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Conditioned Place Preference reveals what animals want by measuring shifts in their preference for places associated with rewarding or unpleasant experiences.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 전국연합학력평가 스물아홉 번 문항에 나온 지문을 함께 볼게요. Conditioned Place Preference라는 실험 방법으로 동물이 무엇을 원하는지 알아내는 내용이에요. 동물의 장소 선호 변화를 통해 보상과 불쾌한 자극을 판단하는 글이죠. 요지는 Conditioned Place Preference reveals what animals want by measuring shifts in their preference for places associated with rewarding or unpleasant experiences입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">조건부 \u003c/b>\u003cb class=\"key\">장소 \u003c/b>\u003cb class=\"key\">선호도\u003c/b> Conditioned Place Preference, 줄여서 CPP는 동물이 특정 장소와 \u003cb class=\"key\">경험\u003c/b>을 \u003cb class=\"key\">연합\u003c/b>시키는 학습을 이용한 실험 방법이다. 고등학생 여러분이 어떤 카페에서 좋은 일이 있으면 그 카페에 다시 가고 싶어지는 것과 비슷하다. 실험에서는 한 장소에 \u003cb class=\"key\">보상\u003c/b> reward나 \u003cb class=\"key\">불쾌한 \u003c/b>\u003cb class=\"key\">자극\u003c/b> unpleasant stimulus를 주고, 다른 장소에는 아무것도 주지 않는다. 동물이 나중에 어느 장소를 더 선택하는지 측정하면 그 경험이 좋았는지 싫었는지 간접적으로 알 수 있다. 이 지문의 예시에서 \u003cb class=\"key\">모르핀\u003c/b> morphine은 통증을 완화하는 약물이고, \u003cb class=\"key\">식염수\u003c/b> saline은 생리식염수로 치료 효과가 없는 대조 물질이다. 건강한 쥐는 모르핀과 식염수 장소를 구분하지 않지만, 암에 걸린 쥐는 모르핀 장소를 선호하는 것을 통해 \u003cb class=\"key\">통증 \u003c/b>\u003cb class=\"key\">완화\u003c/b>를 원한다는 점을 보여 준다.\u003c/div>","segs":[{"n":2,"text":"조건부 장소 선호도는 Conditioned Place Preference라고 하고 줄여서 CPP라고도 해요. 동물이 특정 장소와 경험을 연합시키는 학습을 이용한 방법인데, 여러분이 어떤 카페에서 좋은 일이 있으면 그 카페에 다시 가고 싶어지는 것과 비슷해요. 실험에서는 한 장소에 reward, 즉 보상을 주고 다른 장소에는 아무것도 주지 않아요. 불쾌한 자극인 unpleasant stimulus를 주는 경우도 있어요. 여기서 morphine은 통증을 완화하는 약물이고 saline은 생리식염수예요. 건강한 쥐와 암에 걸린 쥐를 비교해서 모르핀의 효과를 간접적으로 알아내는 겁니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>장소 선호 실험 설계\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>첫 문단은 \u003cb class=\"key\">조건부 \u003c/b>\u003cb class=\"key\">장소 \u003c/b>\u003cb class=\"key\">선호도\u003c/b>가 동물이 무엇을 원하는지 알아내는 방법임을 소개한다. 연구자들은 동물이 한 장소를 음식이나 시끄러운 소리 같은 경험과, 다른 장소는 아무 일도 일어나지 않는 곳과 \u003cb class=\"key\">연관\u003c/b>시키도록 훈련한다. 두 장소를 \u003cb class=\"key\">명백히 \u003c/b>\u003cb class=\"key\">다르게\u003c/b> 만들어 동물이 장소와 경험의 연결을 쉽게 하도록 한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>선호도 측정과 보상 확인\u003csmall>주장 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>두 장소에서 경험하기 전과 후의 \u003cb class=\"key\">선호도\u003c/b>를 측정한다. 만약 보상을 위해 시간을 보내는 장소에 \u003cb class=\"key\">변화\u003c/b>가 생기면, 동물이 그 경험을 좋아했고 \u003cb class=\"key\">반복\u003c/b>하려 한다는 뜻이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>불쾌한 자극의 해석\u003csmall>대조 · 문장 6\u003c/small>\u003c/h4>\u003cp>반대로 동물이 자극이 나타났던 장소를 피하고 자극을 경험하지 않은 장소를 선호하기 시작하면, 그 자극이 \u003cb class=\"key\">불쾌\u003c/b>했다는 신호이다. 이 대조적 해석은 보상과 불쾌한 자극을 \u003cb class=\"key\">구분\u003c/b>하는 기준이 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>암 쥐와 모르핀 사례\u003csmall>예시 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>예를 들어 암에 걸린 쥐는 \u003cb class=\"key\">모르핀\u003c/b>이 주어진 장소를 \u003cb class=\"key\">식염수\u003c/b>를 받은 장소보다 선호했다. 반면 건강한 쥐는 그런 선호를 보이지 않았다. 이는 암에 걸린 쥐가 통증 완화를 위해 \u003cb class=\"key\">모르핀\u003c/b>을 원했음을 시사한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 실험 설계예요. 첫 문장에서 Conditioned Place Preference가 동물이 무엇을 원하는지 알아내는 방법이라고 소개해요. 연구자들은 동물이 한 장소를 음식이나 시끄러운 소리 같은 경험과 연관시키고, 다른 장소는 아무 일도 일어나지 않는 곳과 연관시키도록 훈련해요. 두 장소를 명백히 다르게 만들어 동물이 장소와 경험을 쉽게 연결하게 합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 선호도 측정과 보상의 해석이에요. 두 장소에서 경험하기 전과 후에 선호도를 측정해요. 보상을 위해 시간을 보내는 장소에 변화가 생기면 그 경험을 좋아했고 반복하려 한다는 뜻이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 불쾌한 자극의 해석이에요. Conversely라는 신호어로 대조가 시작돼요. 동물이 자극이 나타났던 장소를 피하고 자극을 경험하지 않은 장소를 선호하기 시작하면 그 자극이 불쾌했다는 신호예요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 암에 걸린 쥐의 예시예요. For example로 예시가 시작되고, 암에 걸린 쥐는 식염수보다 모르핀이 주어진 장소를 선호했어요. 건강한 쥐는 그런 선호가 생기지 않았고요. 이는 암에 걸린 쥐가 모르핀을 원했음을 시사합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 첫 문장에서 \u003cb class=\"key\">조건부 \u003c/b>\u003cb class=\"key\">장소 \u003c/b>\u003cb class=\"key\">선호도\u003c/b>가 동물이 무엇을 원하는지 알아내는 방법이라고 정의하며 \u003cb class=\"key\">두괄식\u003c/b>으로 시작한다. 이어서 실험 설계와 해석 기준을 보상과 불쾌한 자극으로 대조하여 설명한다. 마지막에는 암에 걸린 쥐의 모르핀 선호 사례를 통해 결론을 다시 확인하므로 \u003cb class=\"key\">양괄식\u003c/b> 구조로 볼 수 있다. 따라서 주제문은 첫 번째 문장이고, 마지막 문장은 예시의 시사점을 정리한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Conversely (6)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>For example (7)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>This suggests (5)\u003c/b>\u003cspan>추론\u003c/span>\u003cb>whereas (7)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>This suggests (8)\u003c/b>\u003cspan>결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Conditioned Place Preference\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">preference for being in one place or another\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a shift in where the animal chooses to spend its time\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">show a preference for the place\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">developed no such preference\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>보상 경험 장소\u003c/th>\u003cth>불쾌한 자극 장소\u003c/th>\u003c/tr>\u003ctr>\u003ctd>선호가 증가한다\u003c/td>\u003ctd>회피하고 다른 장소를 선호한다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>경험을 좋아하여 반복하려 한다\u003c/td>\u003ctd>자극을 불쾌하게 느낀다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 비교와 대조, 그리고 예시를 사용하는 구조예요. 첫 문장에서 개념을 정의하고, 마지막 문장에서 다시 시사점을 정리하는 양괄식 전개를 하고 있어요. 보상 경험 장소와 불쾌한 자극 장소를 대조하면서 조건부 장소 선호도의 해석 원리를 설명하죠. 마지막에 암에 걸린 쥐와 건강한 쥐를 비교해 앞선 설명을 구체화합니다.","hl":"ty"},{"n":9,"text":"신호어를 확인해 볼게요. 여섯 번째 문장의 Conversely는 앞의 보상 해석과 대조되는 불쾌한 자극 해석을 이끌어요. 일곱 번째 문장의 For example은 예시를 시작하고, 다섯 번째와 여덟 번째 문장의 This suggests는 관찰 결과의 해석을 제시해요. 일곱 번째 문장의 whereas도 암에 걸린 쥐와 건강한 쥐를 대조하는 역할을 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Conditioned Place Preference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조건부 장소 선호도\u003c/span>\u003c/div>\u003cdiv>\u003cb>find out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>알아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>train\u003c/b>\u003cem>동사\u003c/em>\u003cspan>훈련시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>associate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연관시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경험\u003c/span>\u003c/div>\u003cdiv>\u003cb>such as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>completely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>obviously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>명백히\u003c/span>\u003c/div>\u003cdiv>\u003cb>preference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선호도\u003c/span>\u003c/div>\u003cdiv>\u003cb>measure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>측정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shift\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변화\u003c/span>\u003c/div>\u003cdiv>\u003cb>reward\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보상\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>시사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>repeat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반복하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>conversely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>반대로\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stimulus\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자극\u003c/span>\u003c/div>\u003cdiv>\u003cb>unpleasant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불쾌한\u003c/span>\u003c/div>\u003cdiv>\u003cb>cancer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>암\u003c/span>\u003c/div>\u003cdiv>\u003cb>used to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 데 사용되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>relieve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>완화시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>saline\u003c/b>\u003cem>명사\u003c/em>\u003cspan>식염수\u003c/span>\u003c/div>\u003cdiv>\u003cb>rather than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>whereas\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>반면에\u003c/span>\u003c/div>\u003cdiv>\u003cb>healthy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>건강한\u003c/span>\u003c/div>\u003cdiv>\u003cb>no such preference\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그러한 선호가 없다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 짚어 볼게요. Conditioned Place Preference는 조건부 장소 선호도라는 뜻이고요. preference는 선호도, shift는 변화, reward는 보상이에요. conversely는 반대로, unpleasant는 불쾌한, whereas는 반면에라는 뜻으로 대조 흐름에서 자주 나옵니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">preference\u003c/b>\u003cspan class=\"m\">선호도\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">liking\u003c/span>\u003cspan class=\"s\">inclination\u003c/span>\u003cspan class=\"s\">partiality\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">aversion\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">associate\u003c/b>\u003cspan class=\"m\">연관시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">connect\u003c/span>\u003cspan class=\"s\">link\u003c/span>\u003cspan class=\"s\">relate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">separate\u003c/span>\u003cspan class=\"a\">dissociate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reward\u003c/b>\u003cspan class=\"m\">보상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prize\u003c/span>\u003cspan class=\"s\">compensation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">punishment\u003c/span>\u003cspan class=\"a\">penalty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">avoid\u003c/b>\u003cspan class=\"m\">피하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">evade\u003c/span>\u003cspan class=\"s\">shun\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">approach\u003c/span>\u003cspan class=\"a\">confront\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unpleasant\u003c/b>\u003cspan class=\"m\">불쾌한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disagreeable\u003c/span>\u003cspan class=\"s\">aversive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">pleasant\u003c/span>\u003cspan class=\"a\">agreeable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">shift\u003c/b>\u003cspan class=\"m\">변화\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">change\u003c/span>\u003cspan class=\"s\">alteration\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stability\u003c/span>\u003cspan class=\"a\">constancy\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 어휘 관계도 정리해 둘게요. preference의 동의어는 liking, inclination, partiality 정도이고 반의어는 aversion, dislike예요. associate는 connect, link, relate와 연결되고 separate, dissociate와는 반대죠. reward는 prize, compensation과 비슷하고 punishment, penalty와 반대예요. avoid는 evade, shun과 가깝고 approach, confront와 반대이며, unpleasant는 disagreeable, aversive와 비슷하고 pleasant, agreeable과 반대입니다. shift는 change, alteration과 통하고 stability, constancy와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조건부 장소 선호도는\u003c/span>\u003cspan class=\"en\">Conditioned Place Preference\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 방법이다\u003c/span>\u003cspan class=\"en\">is a way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알아내는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">finding \u003c/span>\u003cspan class=\"tgt\">out\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물들이 무엇을 원하는지.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">animals \u003c/span>\u003cspan class=\"tgt\">want\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">조건부 장소 선호도는 동물들이 무엇을 원하는지 알아내는 하나의 방법이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 조건부 장소 선호도(Conditioned Place Preference)가 \u003cb class=\"key\">동물이 \u003c/b>\u003cb class=\"key\">원하는 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 알아내는 방법임을 정의한다. 글 전체의 \u003cb class=\"key\">주제문\u003c/b> 역할을 하며, 이후 문장들은 이 방법의 구체적 절차를 설명한다. ‘finding out’은 ‘알아내는 것’, ‘what animals want’는 ‘동물이 원하는 것’을 뜻한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 (전치사의 목적어)\u003c/span> : 전치사 of + [finding out (동명사구)] : \"알아내는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사 what + 주어 animals + 동사 want : \"동물들이 무엇을 원하는지\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Conditioned Place Preference, 조건부 장소 선호도는. is a way, 하나의 방법이다. of finding out, 알아내는. what animals want, 동물들이 무엇을 원하는지.. 이 문장 전체를 해석하면, 조건부 장소 선호도는 동물들이 무엇을 원하는지 알아내는 하나의 방법이다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 조건부 장소 선호도가 동물이 원하는 것을 알아내는 방법이라는 정의를 내리는 문장이에요. 그래서 이 문장은 글 전체의 주제문 역할을 하죠. finding out은 알아내는 것, what animals want는 동물이 원하는 것이라는 뜻이에요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 of finding out이에요. 전치사 of 다음에는 명사가 와야 하니까 동사 find를 동명사 finding으로 바꿔서 명사 역할을 하게 한 거예요. 두 번째 어법 포인트는 what animals want인데요, 의문사 what이 이끄는 절이 문장에서 목적어 역할을 하는 간접의문문이에요. 간접의문문은 의문사 다음에 주어와 동사 순서로 온다는 걸 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연구자들은 그것들을 훈련시킨다\u003c/span>\u003cspan class=\"en\">Researchers train them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 장소를 연관시키도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">associate \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">place\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경험과\u003c/span>\u003cspan class=\"en\">with an experience\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음식이나 시끄러운 소리와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">loud \u003c/span>\u003cspan class=\"tgt\">noise\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 또 다른 장소를\u003c/span>\u003cspan class=\"en\">and another place\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완벽히 다른 어떤 것과\u003c/span>\u003cspan class=\"en\">with something completely different,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대개 아무것도 일어나지 않는 곳에\u003c/span>\u003cspan class=\"en\">usually \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">nothing \u003c/span>\u003cspan class=\"tgt\">happens\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">연구자들은 그것들이 한 장소를 음식이나 시끄러운 소리와 같은 경험과 연관시키고 또 다른 장소를 완벽히 다른 어떤 것과 연관시키도록 훈련시키는데 대개 그곳에서는 아무것도 일어나지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 문장은 연구자들이 동물에게 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">장소를 \u003c/b>\u003cb class=\"key\">서로 \u003c/b>\u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">경험과 \u003c/b>\u003cb class=\"key\">연관\u003c/b>시키도록 훈련시키는 과정을 설명한다. 한 장소는 음식이나 큰 소리 같은 \u003cb class=\"key\">자극\u003c/b>과 연결하고, 다른 장소는 보통 아무 일도 일어나지 않는 \u003cb class=\"key\">중립적인 \u003c/b>\u003cb class=\"key\">장소\u003c/b>로 만든다는 내용이다. 이는 이후 동물의 선호도를 측정하기 위한 실험 설계를 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : train + 목적어 + [to associate (to부정사구)] : \"한 장소를 연관시키도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">such as (예시)\u003c/span> : such as + 명사구 : \"음식이나 시끄러운 소리와 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계부사 where\u003c/span> : 선행사(장소) + where + 주어 + 동사 : \"아무것도 일어나지 않는 곳에\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Researchers train them, 연구자들은 그것들을 훈련시킨다. to associate one place, 한 장소를 연관시키도록. with an experience, 경험과. such as food or a loud noise, 음식이나 시끄러운 소리와 같은. and another place, 그리고 또 다른 장소를. with something completely different, 완벽히 다른 어떤 것과. usually where nothing happens, 대개 아무것도 일어나지 않는 곳에. 이 문장 전체를 해석하면, 연구자들은 그것들이 한 장소를 음식이나 시끄러운 소리와 같은 경험과 연관시키고 또 다른 장소를 완벽히 다른 어떤 것과 연관시키도록 훈련시키는데 대개 그곳에서는 아무것도 일어나지 않는다.","hl":"m"},{"n":16,"text":"두 번째 문장은 연구자들이 동물을 훈련시켜서 한 장소는 음식이나 큰 소리 같은 경험과 연결하고, 다른 장소는 보통 아무 일도 일어나지 않는 중립적인 장소와 연결하게 한다는 내용이에요. 이렇게 두 장소를 분명히 다르게 만들어서 동물이 각 장소를 특정 경험과 연관시키도록 훈련하는 거죠.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 to associate one place인데요, train 목적어 다음에 to부정사가 와서 훈련의 목적을 나타내는 거예요. 두 번째는 such as인데, 뒤에 예시를 나열하면서 음식이나 큰 소리 같은 것이라는 뜻을 더해 줘요. 세 번째는 where nothing happens인데, where는 장소를 나타내는 관계부사로 앞에 나온 another place를 꾸며 주는 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 두 장소는\u003c/span>\u003cspan class=\"en\">The two places\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명백히 다르게 만들어진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">obviously \u003c/span>\u003cspan class=\"tgt\">different\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능한 한 쉽게 만들기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">easy \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">possible\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 동물이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">animal \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각 장소를 연관시키는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">associate \u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">place\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거기에서 그것에게 일어난 일과\u003c/span>\u003cspan class=\"en\">with \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">happened \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">there\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 두 장소는 그 동물이 각 장소를 거기에서 그것에게 일어난 일과 연관시키는 것을 가능한 한 쉽게 만들기 위해 명백히 다르게 만들어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 문장은 두 장소가 \u003cb class=\"key\">명백히 \u003c/b>\u003cb class=\"key\">다르게\u003c/b> 만들어진 이유를 설명한다. 동물이 각 장소를 그곳에서 겪은 일과 \u003cb class=\"key\">최대한 \u003c/b>\u003cb class=\"key\">쉽게 \u003c/b>\u003cb class=\"key\">연관\u003c/b>시키도록 하기 위한 \u003cb class=\"key\">목적\u003c/b>이라는 것이다. ‘make it as easy as possible’은 ‘가능한 한 쉽게 만들다’라는 뜻으로, it은 가목적어이고 진짜 목적어는 뒤의 to부정사구이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + [made (과거분사)] + 주격보어(obviously different) : \"명백히 다르게 만들어진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + [make (동사원형)] + it + as easy as possible : \"가능한 한 쉽게 만들기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 의미상 주어 (for + 목적격)\u003c/span> : for + [목적격] + to부정사 : \"그 동물이 각 장소를 연관시키는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사 what + 동사 happened + to it + there : \"거기에서 그것에게 일어난 일\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The two places, 그 두 장소는. are made obviously different, 명백히 다르게 만들어진다. to make it as easy as possible, 가능한 한 쉽게 만들기 위해. for the animal, 그 동물이. to associate each place, 각 장소를 연관시키는 것을. with what happened to it there, 거기에서 그것에게 일어난 일과. 이 문장 전체를 해석하면, 그 두 장소는 그 동물이 각 장소를 거기에서 그것에게 일어난 일과 연관시키는 것을 가능한 한 쉽게 만들기 위해 명백히 다르게 만들어진다.","hl":"m"},{"n":19,"text":"세 번째 문장은 두 장소를 명백히 다르게 만든 이유를 설명해요. 동물이 각 장소를 그곳에서 겪은 일과 최대한 쉽게 연관시키도록 하기 위한 목적이 있다는 거죠. make it as easy as possible은 가능한 한 쉽게 만들다라는 뜻인데, 여기서 it은 가목적어이고 진짜 목적어는 뒤에 있는 to부정사구예요.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 are made obviously different인데요, 주어인 두 장소가 만들어지는 대상이니까 수동태로 표현했어요. 두 번째는 to make it as easy as possible인데, 이 to부정사는 목적을 나타내는 부사적 용법으로 가능한 한 쉽게 만들기 위해라고 해석해요. 세 번째는 for the animal to associate each place인데, for 목적격 다음에 to부정사가 와서 to부정사의 의미상 주어를 나타내는 거예요. 네 번째는 what happened to it there인데, 의문사 what이 이끄는 간접의문문이 전치사 with의 목적어로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 동물의 선호도는\u003c/span>\u003cspan class=\"en\">The animal's preference\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 장소나 다른 장소에 있는 것에 대한\u003c/span>\u003cspan class=\"en\">for \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">place \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">another\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">측정된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">measured\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 경험들 전과 후 모두\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">experiences\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 장소에서\u003c/span>\u003cspan class=\"en\">in the two places.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 장소나 다른 장소에 있는 것에 대한 그 동물의 선호도는 두 장소에서 경험하기 전과 후에 모두 측정된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 선호도 측정의 시점을 설명해요. 동물이 두 장소에서 경험하기 전과 후에 선호도를 비교해야 그 경험이 \u003cb class=\"key\">긍정적\u003c/b>이었는지 부정적이었는지 판단할 수 있어요. 여기서 \u003cb class=\"key\">선호도\u003c/b>는 동물이 실제로 한 장소에 머무는 선택으로 측정된다는 점이 중요해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구\u003c/span> : 전치사 for + [being ... (동명사구)] : \"한 장소나 다른 장소에 있는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + 과거분사 (by 행위자 생략) : \"측정된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">상관접속사 both A and B\u003c/span> : both [before] + and + [after] ... : \"그것의 경험들 전과 후 모두\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The animal's preference, 그 동물의 선호도는. for being in one place or another, 한 장소나 다른 장소에 있는 것에 대한. is measured, 측정된다. both before and after its experiences, 그것의 경험들 전과 후 모두. in the two places, 두 장소에서. 이 문장 전체를 해석하면, 한 장소나 다른 장소에 있는 것에 대한 그 동물의 선호도는 두 장소에서 경험하기 전과 후에 모두 측정된다.","hl":"m"},{"n":22,"text":"이 문장은 선호도 측정의 시점을 설명해요. 동물이 두 장소에서 경험하기 전과 후에 선호도를 비교해야 그 경험이 긍정적이었는지 부정적이었는지 판단할 수 있어요. 여기서 선호도는 동물이 실제로 한 장소에 머무는 선택으로 측정된다는 점이 중요해요.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 is measured예요. 선호도는 스스로 측정하는 주체가 아니라 측정되는 대상이므로 수동태를 씁니다. 두 번째 어법 포인트는 being in one place or another예요. 전치사 for의 목적어로 명사 역할을 하도록 동사 be를 동명사 being으로 바꿨어요. 세 번째 어법 포인트는 both before and after its experiences예요. before와 after를 상관접속사 both A and B로 묶어 두 시점을 모두 강조합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 변화가 있다면\u003c/span>\u003cspan class=\"en\">If there is a shift\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 동물이 어디에서 시간을 보낼지 선택하는 것에\u003c/span>\u003cspan class=\"en\">in \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">animal \u003c/span>\u003cspan class=\"tgt\">chooses \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">spend \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보상을 위해\u003c/span>\u003cspan class=\"en\">for the reward,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 시사한다\u003c/span>\u003cspan class=\"en\">this suggests\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 그 경험을 좋아했다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">liked \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">experience \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 반복하려고 노력하는 중이라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">trying \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">repeat \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 동물이 보상을 위해 어디에서 시간을 보내기로 선택하는지에 변화가 있다면, 이것은 그것이 그 경험을 좋아했고 그것을 반복하려고 노력하는 중이라는 것을 시사한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 보상이 있는 경험 후에 동물이 시간을 보내는 장소가 달라지면 그 경험을 \u003cb class=\"key\">긍정적\u003c/b>으로 느꼈다는 뜻이에요. shift는 단순한 이동이 아니라 기존과 다른 선택의 변화를 말해요. 따라서 보상을 \u003cb class=\"key\">반복\u003c/b>하려는 동기로 해석할 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 where절 (간접의문문)\u003c/span> : 전치사 in + [where + 주어 + 동사 ~] : \"그 동물이 어디에서 시간을 보낼지 선택하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법\u003c/span> : choose [타동사] + [to spend ... (to부정사구/목적어)] : \"시간을 보내는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">that절 (목적어)\u003c/span> : suggests [타동사] + [that + 주어 + 동사 ~] : \"그것이 그 경험을 좋아했고 그것을 반복하려고 노력하는 중이라는 것을\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"If there is a shift, 만약 변화가 있다면. in where the animal chooses to spend its time, 그 동물이 어디에서 시간을 보낼지 선택하는 것에. for the reward, 보상을 위해. this suggests, 이것은 시사한다. that it liked the experience, 그것이 그 경험을 좋아했다는 것을. and is trying to repeat it, 그리고 그것을 반복하려고 노력하는 중이라는 것을. 이 문장 전체를 해석하면, 만약 동물이 보상을 위해 어디에서 시간을 보내기로 선택하는지에 변화가 있다면, 이것은 그것이 그 경험을 좋아했고 그것을 반복하려고 노력하는 중이라는 것을 시사한다.","hl":"m"},{"n":25,"text":"이 문장은 보상이 있는 경험 후에 동물이 시간을 보내는 장소가 달라지면 그 경험을 긍정적으로 느꼈다는 뜻이에요. shift는 단순한 이동이 아니라 기존과 다른 선택의 변화를 말해요. 따라서 보상을 반복하려는 동기로 해석할 수 있어요.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 where the animal chooses to spend its time예요. where가 이끄는 절이 전치사 in의 목적어로 쓰이는 간접의문문입니다. 평서문 어순으로 주어 the animal, 동사 chooses가 이어져요. 두 번째 어법 포인트는 to spend its time예요. 동사 choose는 to부정사를 목적어로 취해 무엇을 하는 것을 선택하다라는 뜻이에요. 세 번째 어법 포인트는 that it liked the experience and is trying to repeat it예요. suggest가 타동사이므로 that절이 목적어로 와서 시사하는 내용을 이끌어요. liked와 is trying은 and로 병렬 연결된 동사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반대로,\u003c/span>\u003cspan class=\"en\">Conversely,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그것이 이제 그 장소를 피한다면\u003c/span>\u003cspan class=\"en\">if it now avoids \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">place \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자극이 나타났던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">stimulus \u003c/span>\u003cspan class=\"tgt\">appeared\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 장소를 선호하기 시작한다면\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">starts \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">prefer \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">place \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 그것을 경험하지 않았던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">experience \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 이것은 시사한다\u003c/span>\u003cspan class=\"en\">then this suggests\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 그 자극을 불쾌하게 느꼈다는 것을\u003c/span>\u003cspan class=\"en\">that it \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">stimulus \u003c/span>\u003cspan class=\"tgt\">unpleasant\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반대로, 만약 그것이 이제 자극이 나타났던 장소를 피하고 그것이 그것을 경험하지 않았던 장소를 선호하기 시작한다면, 그러면 이것은 그것이 그 자극을 불쾌하게 느꼈다는 것을 시사한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 다섯 번째 문장과 대조되는 경우예요. 자극이 나타났던 장소를 피하고 자극이 없던 장소를 선호하면 그 자극을 \u003cb class=\"key\">불쾌한 \u003c/b>\u003cb class=\"key\">자극\u003c/b>으로 여겼다는 뜻이에요. Conversely를 통해 앞 문장의 긍정적 반응과 \u003cb class=\"key\">반대\u003c/b> 방향의 해석을 제시해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사 where 생략\u003c/span> : 선행사 the place + [where] + 주어(the stimulus) + 동사(appeared) : \"자극이 나타났던 장소\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법\u003c/span> : start [자동사] + [to prefer ... (to부정사구)] : \"그 장소를 선호하기 시작한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계부사 where 생략\u003c/span> : 선행사 the place + [where] + 주어(it) + 동사(did not experience) + 목적어(it) : \"그것이 그것을 경험하지 않았던 장소\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">5형식 (find + 목적어 + 목적격 보어)\u003c/span> : find [타동사] + [목적어] + [목적격 보어(형용사)] : \"그 자극이 불쾌하다고 느꼈다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Conversely, 반대로. if it now avoids the place, 만약 그것이 이제 그 장소를 피한다면. the stimulus appeared, 자극이 나타났던. and starts to prefer the place, 그리고 그 장소를 선호하기 시작한다면. it did not experience it, 그것이 그것을 경험하지 않았던. then this suggests, 그러면 이것은 시사한다. that it found the stimulus unpleasant, 그것이 그 자극을 불쾌하게 느꼈다는 것을. 이 문장 전체를 해석하면, 반대로, 만약 그것이 이제 자극이 나타났던 장소를 피하고 그것이 그것을 경험하지 않았던 장소를 선호하기 시작한다면, 그러면 이것은 그것이 그 자극을 불쾌하게 느꼈다는 것을 시사한다.","hl":"m"},{"n":28,"text":"이 문장은 다섯 번째 문장과 대조되는 경우예요. 자극이 나타났던 장소를 피하고 자극이 없던 장소를 선호하면 그 자극을 불쾌한 자극으로 여겼다는 뜻이에요. Conversely를 통해 앞 문장의 긍정적 반응과 반대 방향의 해석을 제시해요.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 the place the stimulus appeared예요. 장소를 나타내는 선행사 the place 뒤에서 관계부사 where가 생략되어 앞의 명사를 꾸며줘요. 나타난 주체가 the stimulus이므로 동사 appeared가 옵니다. 두 번째 어법 포인트는 starts to prefer the place예요. start는 to부정사를 목적어로 취해 어떤 행동을 시작한다는 의미를 나타내요. 세 번째 어법 포인트는 the place it did not experience it예요. 여기서도 관계부사 where가 생략되었어요. 뒤에 오는 it은 동물, 마지막 it은 자극을 가리켜서 그 동물이 그 자극을 경험하지 않았던 장소라는 뜻이 됩니다. 네 번째 어법 포인트는 found the stimulus unpleasant예요. find가 무엇을 어떠하다고 느끼다라는 뜻으로 쓰이는 오형식 구조예요. 목적격 보어 unpleasant가 목적어 the stimulus의 상태를 설명합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 암에 걸린 쥐는\u003c/span>\u003cspan class=\"en\">For example, mice with cancer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장소에 대한 선호를 보여 준다\u003c/span>\u003cspan class=\"en\">show a preference for the place\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서 모르핀이 주어졌었던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">given \u003c/span>\u003cspan class=\"tgt\">morphine\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통증을 완화시키는 데 사용되는 약인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">drug \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">relieve \u003c/span>\u003cspan class=\"tgt\">pain\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">식염수를 받아 왔었던 곳보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">received \u003c/span>\u003cspan class=\"tgt\">saline\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면에 건강한 쥐는 그러한 선호가 생기지 않았다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">whereas \u003c/span>\u003cspan class=\"tgt\">healthy \u003c/span>\u003cspan class=\"tgt\">mice \u003c/span>\u003cspan class=\"tgt\">developed \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">preference\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 암에 걸린 쥐가 식염수를 받아 왔었던 곳보다 통증을 완화시키는 데 사용되는 약인 모르핀이 주어졌었던 장소에 대한 선호를 보여 준 반면, 건강한 쥐는 그러한 선호가 생기지 않았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">예시\u003c/b>를 통해 조건화된 장소 선호 실험의 실제 결과를 보여 줍니다. 암에 걸린 쥐는 \u003cb class=\"key\">모르핀\u003c/b>이 제공된 장소를 선호했지만, 건강한 쥐는 그러한 \u003cb class=\"key\">선호\u003c/b>를 보이지 않았다는 대조가 핵심입니다. 이를 통해 동물이 약물의 \u003cb class=\"key\">보상 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 원한다는 점을 추론할 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사 where + 현재완료 수동태\u003c/span> : 선행사(place) + where + S + have/has been p.p. : \"그들이 모르핀을 투여받아 온 장소\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법 (수동)\u003c/span> : a drug (which is) used to relieve pain : \"통증을 완화시키는 데 사용되는 약\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">rather than 비교 병렬\u003c/span> : A rather than B : \"B라기보다는 A / B보다 A\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">whereas 대조 접속사\u003c/span> : S + V whereas S + V : \"반면에 건강한 쥐는 그러한 선호가 생기지 않았다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"For example, mice with cancer, 예를 들어, 암에 걸린 쥐는. show a preference for the place, 장소에 대한 선호를 보여 준다. where they have been given morphine, 그곳에서 모르핀이 주어졌었던. a drug used to relieve pain, 통증을 완화시키는 데 사용되는 약인. rather than where they have received saline, 식염수를 받아 왔었던 곳보다. whereas healthy mice developed no such preference, 반면에 건강한 쥐는 그러한 선호가 생기지 않았다.. 이 문장 전체를 해석하면, 예를 들어, 암에 걸린 쥐가 식염수를 받아 왔었던 곳보다 통증을 완화시키는 데 사용되는 약인 모르핀이 주어졌었던 장소에 대한 선호를 보여 준 반면, 건강한 쥐는 그러한 선호가 생기지 않았다.","hl":"m"},{"n":31,"text":"이 문장은 조건화된 장소 선호 실험의 구체적인 예시를 보여 줍니다. 암에 걸린 쥐는 모르핀이 주어진 장소를 식염수 장소보다 더 선호했고, 건강한 쥐는 그런 선호가 없었어요. 이 대조를 통해 모르핀이 암에 걸린 쥐에게 보상으로 작용했다는 것을 알 수 있습니다.","hl":"mn"},{"n":32,"text":"어법 포인트를 순서대로 설명해 드릴게요. 첫 번째는 관계부사 where입니다. the place where they have been given morphine에서 where는 선행사 the place를 꾸미고, have been given은 현재완료 수동태예요. 두 번째는 a drug used to relieve pain인데, used는 과거분사로 a drug를 수식하면서 수동의 뜻을 나타냅니다. 세 번째는 rather than 비교 표현으로, 모르핀을 받은 장소와 식염수를 받은 장소를 비교해요. 네 번째는 whereas인데, 암에 걸린 쥐와 건강한 쥐의 결과를 대조해 주는 접속사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 시사한다\u003c/span>\u003cspan class=\"en\">This suggests\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">암에 걸린 쥐가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mice \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">cancer \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 모르핀을 원했음을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">wanted \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">morphine\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 암에 걸린 쥐가 그 모르핀을 원했음을 시사한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 실험 결과를 한 줄로 \u003cb class=\"key\">결론\u003c/b> 내리는 역할을 합니다. 암에 걸린 쥐의 \u003cb class=\"key\">장소 \u003c/b>\u003cb class=\"key\">선호\u003c/b>가 곧 모르핀에 대한 \u003cb class=\"key\">욕구\u003c/b>였음을 시사하며, 앞선 실험 내용을 일반화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">that 명사절 (목적어)\u003c/span> : suggest + that + S + V : \"암에 걸린 쥐가 그 모르핀을 원했다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : 명사 + with + 명사 : \"암에 걸린\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"This suggests, 이것은 시사한다. that the mice with cancer, 암에 걸린 쥐가. wanted the morphine, 그 모르핀을 원했음을. 이 문장 전체를 해석하면, 이것은 암에 걸린 쥐가 그 모르핀을 원했음을 시사한다.","hl":"m"},{"n":34,"text":"이 문장은 앞선 실험 결과를 한 문장으로 정리해요. 암에 걸린 쥐가 모르핀을 원했다는 결론을 직접 제시하면서, 조건화된 장소 선호가 동물의 욕구를 알아내는 방법이라는 글 전체의 논지를 뒷받침합니다.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 that 명사절입니다. suggests 뒤에 that절이 목적어로 와서, 이 문장이 무엇을 시사하는지 그 내용을 이끌어요. 두 번째는 with cancer인데, with cancer가 앞의 the mice를 꾸며 주는 형용사적 전치사구입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">조건부 \u003c/b>\u003cb class=\"key\">장소 \u003c/b>\u003cb class=\"key\">선호도\u003c/b>는 동물이 무엇을 원하는지 알아내는 방법이다.\u003c/li>\u003cli>동물에게 한 장소는 \u003cb class=\"key\">경험\u003c/b>과, 다른 장소는 아무 일도 없는 것과 연관시키고 두 장소를 \u003cb class=\"key\">명백히 \u003c/b>\u003cb class=\"key\">다르게\u003c/b> 만든다.\u003c/li>\u003cli>\u003cb class=\"key\">보상\u003c/b>이 있는 장소로 선택이 이동하면 그 경험을 좋아한 것이고, \u003cb class=\"key\">자극\u003c/b> 장소를 피하면 불쾌하게 느낀 것이다.\u003c/li>\u003cli>암에 걸린 쥐는 \u003cb class=\"key\">모르핀\u003c/b> 장소를 선호했고 이는 통증 완화를 원했음을 시사한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Conditioned Place Preference reveals what animals want by measuring shifts in their preference for places associated with rewarding or unpleasant experiences.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">조건부 \u003c/b>\u003cb class=\"key\">장소 \u003c/b>\u003cb class=\"key\">선호도\u003c/b>는 \u003cb class=\"key\">동물\u003c/b>이 \u003cb class=\"key\">보상\u003c/b>이나 \u003cb class=\"key\">불쾌한 \u003c/b>\u003cb class=\"key\">자극\u003c/b>을 어떻게 느끼는지 \u003cb class=\"key\">장소\u003c/b>에 대한 선호 변화로 측정한다. \u003cb class=\"key\">암\u003c/b>에 걸린 쥐가 \u003cb class=\"key\">모르핀\u003c/b>이 주어진 장소를 선호한 것은 \u003cb class=\"key\">통증 \u003c/b>\u003cb class=\"key\">완화\u003c/b>를 원했음을 시사한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 배운 조건부 장소 선호도는 동물이 무엇을 원하는지 알아내는 실험 방법이에요. 보상 장소를 선택하면 좋아한 것이고 불쾌한 자극 장소를 피하면 싫어한 것이죠. 암에 걸린 쥐의 모르핀 장소 선호는 통증 완화를 원했다는 결론을 뒷받침합니다. 오늘 수업은 여기까지입니다.","hl":null}]}]});</script></body></html>
