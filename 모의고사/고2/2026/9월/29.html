</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 29번","audioDir":"29_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">29번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Capitalism's Dependence on Cheap Natures and Frontiers\u003c/h1>\u003ch2>값싼 자연과 미개척 영역에 의존하는 자본주의\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>자본주의는 \u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">만물\u003c/b>의 바다에 \u003cb class=\"key\">현금 \u003c/b>\u003cb class=\"key\">교환의 \u003c/b>\u003cb class=\"key\">섬\u003c/b>들을 세워 유지되지만, 삶의 재생산·임금·에너지·기후의 비용이 오르면서 \u003cb class=\"key\">위기\u003c/b>를 맞는다. 그래서 새로운 값싼 것과 노동을 강제로 확보할 수 있는 \u003cb class=\"key\">미개척 \u003c/b>\u003cb class=\"key\">영역\u003c/b>이 중요해진다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Capitalism depends on cheap natures, and as reproduction, labor, energy, and climate become expensive, it turns to frontiers to seize new cheap things and work.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 자본주의가 왜 값싼 자연과 미개척 영역에 의존하는지를 다룬 지문입니다. 이 글은 자본주의를 현금이 넘치는 체제가 아니라 값싼 만물의 바다에 현금 교환의 섬들이 떠 있는 구조로 정의합니다. 핵심은 값싼 것이 점점 비싸지면서 위기가 오고, 그래서 미개척 영역이 중요해진다는 것입니다. 같이 차근차근 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">자본주의는 모든 것을 \u003cb class=\"key\">현금\u003c/b>으로 환산하는 듯 보이지만, 실제로는 \u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">자연\u003c/b>과 값싼 노동이 받쳐 주지 않으면 유지되기 어렵습니다. 자연과 노동처럼 자본이 비용을 치르지 않고 이용해 온 투입물을 학자들은 cheap nature, 곧 ‘값싼 만물’이라고 부릅니다. 그런데 삶의 재생산 비용, 노동자의 존엄 요구, 에너지 고갈, 기후 변화가 겹치면 값싼 것이 더 이상 싸지 않게 됩니다. 마치 공짜로 보이는 뷔페도 손님이 몰리고 재료가 떨어지면 비용이 올라가는 것과 비슷합니다. 자본주의는 이 위기를 피하려고 외부의 \u003cb class=\"key\">미개척 \u003c/b>\u003cb class=\"key\">영역\u003c/b>, 즉 frontier에서 새로운 값싼 자원과 노동을 찾으려 합니다. 이 지문은 그 메커니즘을 압축해서 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"자본주의는 겉으로 보면 모든 것을 현금으로 환산하는 것 같지만, 실제로는 값싼 자연과 값싼 노동이 바탕에 깔려 있어야 돌아갑니다. 이렇게 자본이 비용을 거의 치르지 않고 이용하는 자연이나 노동을 영어로 cheap nature라고 해요. 그런데 삶을 재생산하는 비용, 노동자의 존엄 요구, 에너지 고갈, 기후 변화가 겹치면 값싼 것이 더 이상 싸지 않게 됩니다. 일상에 비유하면 공짜처럼 보이던 뷔페도 손님이 몰리고 재료가 떨어지면 비용이 올라가는 것과 비슷하죠. 자본주의는 이 위기를 피하려고 외부의 미개척 영역, 영어로 frontier에서 새로운 값싼 자원과 노동을 찾으려 합니다. 이 지문은 그 메커니즘을 압축해서 보여 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>자본주의의 숨은 조건\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 번째 문장은 자본주의가 현금이 어디에나 있는 체제가 아니라 \u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">만물\u003c/b>의 바다 안에 \u003cb class=\"key\">현금 \u003c/b>\u003cb class=\"key\">교환의 \u003c/b>\u003cb class=\"key\">섬\u003c/b>들이 존재하는 구조라고 정의합니다. 두 번째 문장은 이 구조 안에서 삶을 \u003cb class=\"key\">재생산\u003c/b>하는 것이 비싸고 시간이 지날수록 더 비싸진다고 말합니다. 이는 자본주의가 처음부터 값싼 자연에 기대고 있으며 그 조건이 점점 불안정해진다는 도입입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>불평등과 노동의 위기\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>세 번째 문장은 \u003cb class=\"key\">임금\u003c/b> 동결·삭감이 결국 \u003cb class=\"key\">불평등\u003c/b>을 낳고 미국과 영국의 포퓰리스트 시위 같은 \u003cb class=\"key\">위기\u003c/b>로 이어진다고 합니다. 네 번째 문장은 노동자들이 존엄성을 요구하면 그들의 노동력이 비싸진다고 말합니다. 즉 값싼 노동을 유지하려는 시도가 오히려 사회적 저항과 비용 상승을 부릅니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>자연의 한계\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>다섯 번째 문장은 \u003cb class=\"key\">생산 \u003c/b>\u003cb class=\"key\">과정\u003c/b>이 현금 교환의 섬을 고갈시켜 \u003cb class=\"key\">에너지\u003c/b>가 더 이상 값싸지 않게 된다고 합니다. 여섯 번째 문장은 \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">변화\u003c/b>로 작물이 예전만큼 풍부하게 자라지 않는다고 덧붙입니다. 이 두 문장은 인간의 저항뿐 아니라 자연적 조건까지 비용 상승을 부추긴다는 근거입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>미개척 영역의 중요성\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>일곱 번째 문장은 이러한 과정에서 \u003cb class=\"key\">미개척 \u003c/b>\u003cb class=\"key\">영역\u003c/b>이 중요한 이유를 설명합니다. 그곳은 새로운 \u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">것\u003c/b>들을 확보하고 인간과 자연의 값싼 노동을 \u003cb class=\"key\">강제로\u003c/b> 취할 수 있는 장소입니다. 따라서 자본주의는 값싼 것이 고갈될 때마다 외부의 개척지를 찾아 문제를 해결하려 한다는 결론입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름은 크게 도입, 두 가지 근거, 결론으로 이어집니다.","hl":null},{"n":4,"text":"첫 번째 문장과 두 번째 문장은 자본주의의 숨은 조건을 보여 줍니다. 자본주의는 현금이 어디에나 있는 체제가 아니라 값싼 만물의 바다 안에 현금 교환의 섬들이 존재하는 구조라고 정의합니다. 그런데 이 구조 안에서 삶을 재생산하는 일은 비싸고, 시간이 흐를수록 더 비싸진다는 거죠. 결국 자본주의가 처음부터 값싼 자연에 기대고 있다는 전제가 깔립니다.","hl":"f0"},{"n":5,"text":"세 번째 문장과 네 번째 문장은 임금과 불평등의 문제를 다룹니다. 임금이 동결되거나 삭감될 수는 있지만 결국 불평등이 위기를 불러오고, 미국과 영국에서 포퓰리스트 시위를 일으킨 것도 그런 위기라는 거예요. 노동자들은 존엄성을 요구하고, 그러면 노동력이 비싸집니다. 값싼 노동을 억지로 유지하려다 오히려 사회적 저항과 비용 상승을 부르는 셈이죠.","hl":"f1"},{"n":6,"text":"다섯 번째 문장과 여섯 번째 문장은 자연적 한계를 짚습니다. 생산 과정이 현금 교환의 섬을 고갈시키면 에너지가 더 이상 값싸지 않게 됩니다. 기후가 변화하면 작물도 예전처럼 풍부하게 자라지 못하죠. 이렇게 인간의 저항만 아니라 에너지와 기후라는 자연 조건도 비용 상승을 부추깁니다.","hl":"f2"},{"n":7,"text":"일곱 번째 문장에서 결론이 나옵니다. 이런 모든 과정 때문에 미개척 영역이 중요하다는 거예요. 미개척 영역은 새로운 값싼 것들을 확보할 수 있는 장소이고, 인간과 자연의 값싼 노동을 강제로 취할 수 있는 곳입니다. 결국 자본주의는 값싼 것이 고갈될 때마다 외부에서 새로운 개척지를 찾아 문제를 해결하려 한다는 주장으로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 마지막 문장에서 \u003cb class=\"key\">미개척 \u003c/b>\u003cb class=\"key\">영역\u003c/b>의 중요성을 주장하기 위해 앞부분을 근거로 배치한 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다. 첫 문장은 \u003cb class=\"key\">자본주의\u003c/b>가 값싼 만물에 의존한다는 정의를 제시하고, 이어서 임금·노동·에너지·기후의 비용 상승과 위기를 근거로 나열합니다. 마지막 문장에서 because를 써서 이러한 과정에서 미개척 영역이 왜 중요한지를 결론으로 도출합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (3)\u003c/b>\u003cspan>역접·전환\u003c/span>\u003cb>in the end (3)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>because (7)\u003c/b>\u003cspan>이유·인과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">cheap — or potentially cheap — natures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">new cheap things\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cheap work of humans and other natures\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 전개 방식으로 보면 주장과 근거에 해당하고, 구조는 미괄식입니다. 앞부분 여섯 문장이 근거이고 마지막 문장이 핵심 주장이에요. 첫 번째 문장에서 자본주의가 값싼 만물에 의존한다는 정의를 제시하고, 이어서 임금과 노동, 에너지와 기후의 비용 상승과 위기를 근거로 나열합니다. 마지막 문장에서 이 모든 과정 때문에 미개척 영역이 중요하다고 결론을 내립니다.","hl":"ty"},{"n":9,"text":"이 글을 읽을 때는 신호어가 중요합니다. 세 번째 문장의 but은 역접 전환을 보여 주고, in the end는 결과를 이끌어요. 일곱 번째 문장의 because는 이유를 나타내며 앞부분 전체를 근거로 연결합니다. 또 cheap이라는 말이 반복되고, 새로운 값싼 것, 값싼 노동 같은 재진술로 이어지므로 같은 개념이 어떻게 변주되는지 잡아야 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>capitalism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자본주의\u003c/span>\u003c/div>\u003cdiv>\u003cb>cash\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현금\u003c/span>\u003c/div>\u003cdiv>\u003cb>exchange\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교환\u003c/span>\u003c/div>\u003cdiv>\u003cb>island\u003c/b>\u003cem>명사\u003c/em>\u003cspan>섬\u003c/span>\u003c/div>\u003cdiv>\u003cb>ocean\u003c/b>\u003cem>명사\u003c/em>\u003cspan>바다, 대양\u003c/span>\u003c/div>\u003cdiv>\u003cb>cheap\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>값싼\u003c/span>\u003c/div>\u003cdiv>\u003cb>potentially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>잠재적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자연, 만물\u003c/span>\u003c/div>\u003cdiv>\u003cb>reproduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재생산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cash nexus\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현금 거래 관계\u003c/span>\u003c/div>\u003cdiv>\u003cb>expensive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비싼\u003c/span>\u003c/div>\u003cdiv>\u003cb>over time\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시간이 흐를수록\u003c/span>\u003c/div>\u003cdiv>\u003cb>wage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>임금\u003c/span>\u003c/div>\u003cdiv>\u003cb>freeze\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>roll back\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>삭감하다, 되돌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inequality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불평등\u003c/span>\u003c/div>\u003cdiv>\u003cb>crisis\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위기\u003c/span>\u003c/div>\u003cdiv>\u003cb>populist\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>포퓰리스트의, 대중영합주의의\u003c/span>\u003c/div>\u003cdiv>\u003cb>protest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시위\u003c/span>\u003c/div>\u003cdiv>\u003cb>dignity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>존엄성\u003c/span>\u003c/div>\u003cdiv>\u003cb>labor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노동, 노동력\u003c/span>\u003c/div>\u003cdiv>\u003cb>production\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생산\u003c/span>\u003c/div>\u003cdiv>\u003cb>process\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과정\u003c/span>\u003c/div>\u003cdiv>\u003cb>burn through\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>고갈시키다, 태워 없애다\u003c/span>\u003c/div>\u003cdiv>\u003cb>energy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>에너지\u003c/span>\u003c/div>\u003cdiv>\u003cb>climate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기후\u003c/span>\u003c/div>\u003cdiv>\u003cb>crop\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작물\u003c/span>\u003c/div>\u003cdiv>\u003cb>abundantly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>풍부하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>frontier\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미개척 영역, 변경\u003c/span>\u003c/div>\u003cdiv>\u003cb>seize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>붙잡다, 확보하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 어휘를 몇 개 짚어 볼게요. capitalism은 자본주의, cash nexus는 현금 거래 관계라는 뜻이지만 지문에서는 nexus를 관계나 연결로 보시면 됩니다. roll back은 임금을 삭감하다, burn through는 고갈시키다, frontier는 미개척 영역이나 변경을 뜻합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">cheap\u003c/b>\u003cspan class=\"m\">값싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inexpensive\u003c/span>\u003cspan class=\"s\">low-cost\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expensive\u003c/span>\u003cspan class=\"a\">costly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expensive\u003c/b>\u003cspan class=\"m\">비싼\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">costly\u003c/span>\u003cspan class=\"s\">pricey\u003c/span>\u003cspan class=\"s\">high-priced\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cheap\u003c/span>\u003cspan class=\"a\">inexpensive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inequality\u003c/b>\u003cspan class=\"m\">불평등\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disparity\u003c/span>\u003cspan class=\"s\">imbalance\u003c/span>\u003cspan class=\"s\">unfairness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">equality\u003c/span>\u003cspan class=\"a\">fairness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">crisis\u003c/b>\u003cspan class=\"m\">위기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">emergency\u003c/span>\u003cspan class=\"s\">catastrophe\u003c/span>\u003cspan class=\"s\">disaster\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stability\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dignity\u003c/b>\u003cspan class=\"m\">존엄성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">self-respect\u003c/span>\u003cspan class=\"s\">worth\u003c/span>\u003cspan class=\"s\">honor\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indignity\u003c/span>\u003cspan class=\"a\">humiliation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">frontier\u003c/b>\u003cspan class=\"m\">미개척 영역, 변경\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">border\u003c/span>\u003cspan class=\"s\">boundary\u003c/span>\u003cspan class=\"s\">front\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">center\u003c/span>\u003cspan class=\"a\">interior\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">abundant\u003c/b>\u003cspan class=\"m\">풍부한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">plentiful\u003c/span>\u003cspan class=\"s\">ample\u003c/span>\u003cspan class=\"s\">rich\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">scarce\u003c/span>\u003cspan class=\"a\">insufficient\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 둡시다. cheap은 inexpensive나 low-cost와 바꿔 쓸 수 있고, 반대는 expensive나 costly입니다. expensive는 costly나 pricey와 비슷하고 반대는 cheap이에요. inequality는 disparity나 imbalance와 통하고 equality와 반대이며, dignity는 self-respect나 worth와 비슷하고 indignity나 humiliation과 반대입니다. crisis는 emergency나 catastrophe와 통하고 stability와 반대라는 점도 기억하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자본주의는 시스템이 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Capitalism \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">system \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현금이 어디에나 존재하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">cash \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">everywhere \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오히려 현금 교환이라는 섬들이 존재하는 하나(시스템)이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">one\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">islands \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">cash \u003c/span>\u003cspan class=\"tgt\">exchange \u003c/span>\u003cspan class=\"tgt\">exist\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">값싼 혹은 잠재적으로 값싼 만물의 바다 안에\u003c/span>\u003cspan class=\"en\">within oceans of cheap ― or potentially cheap ― natures.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자본주의는 현금이 어디에나 존재하는 시스템이라기보다는, 값싼 혹은 잠재적으로 값싼 만물의 바다 안에 현금 교환이라는 섬들이 존재하는 시스템이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 자본주의가 모든 곳에 돈이 있는 체제가 아니라, 값싼 \u003cb class=\"key\">만물\u003c/b>이라는 바다 속에 \u003cb class=\"key\">현금 \u003c/b>\u003cb class=\"key\">교환\u003c/b>의 섬들이 드문드문 존재하는 구조라고 정의합니다. 자본주의의 본질을 섬과 바다라는 공간적 \u003cb class=\"key\">비유\u003c/b>로 압축해 글 전체의 문제의식을 엽니다. 여기서 cheap natures는 노동력과 자원처럼 자본이 값싸게 동원하려는 자연과 인간의 \u003cb class=\"key\">살림\u003c/b>을 뜻합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">not A but B (상관 접속사)\u003c/span> : not [A system where cash is everywhere] but rather [one in which ...] : \"현금이 어디에나 존재하는 시스템이 아니라 오히려 ... 하나(시스템)이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사 where\u003c/span> : [선행사 a system] + [where + 완전한 절] : \"현금이 어디에나 존재하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사+관계대명사\u003c/span> : [one] + [in which + 완전한 절] : \"현금 교환이라는 섬들이 존재하는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Capitalism is not a system, 자본주의는 시스템이 아니라. where cash is everywhere, 현금이 어디에나 존재하는. but rather one in which islands of cash exchange exist, 오히려 현금 교환이라는 섬들이 존재하는 하나(시스템)이다. within oceans of cheap ― or potentially cheap ― natures, 값싼 혹은 잠재적으로 값싼 만물의 바다 안에. 이 문장 전체를 해석하면, 자본주의는 현금이 어디에나 존재하는 시스템이라기보다는, 값싼 혹은 잠재적으로 값싼 만물의 바다 안에 현금 교환이라는 섬들이 존재하는 시스템이다.","hl":"m"},{"n":13,"text":"이 문장은 자본주의가 돈이 모든 곳에 있는 게 아니라, 값싼 만물이라는 넓은 바다 안에 현금 교환이라는 섬들이 드문드문 존재하는 구조라고 정의해요. 자본주의의 본질을 섬과 바다라는 공간적 비유로 압축해서 글 전체의 문제의식을 열어 줍니다. 여기서 cheap natures는 노동력과 자원처럼 자본이 값싸게 동원하려는 자연과 인간의 살림을 뜻하죠.","hl":"mn"},{"n":14,"text":"어법 포인트를 정리할게요. 첫 번째, not a system where cash is everywhere but rather one에서 not A but B 구문이 쓰였어요. 현금이 어디에나 존재하는 시스템이 아니라 오히려 다른 하나라는 뜻으로 상관 접속사가 앞뒤를 대비시켜 줍니다. 두 번째, where cash is everywhere는 관계부사 where가 앞의 a system을 받으면서 뒤에 완전한 절을 이끌어요. where는 in which로 바꿔 쓸 수 있죠. 세 번째, in which islands of cash exchange exist는 전치사와 관계대명사 구조예요. 앞의 one을 수식하면서 그 안에서 현금 교환의 섬들이 존재한다는 뜻을 덧붙여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현금 거래 관계 내에서 삶을 재생산하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Reproducing \u003c/span>\u003cspan class=\"tgt\">life \u003c/span>\u003cspan class=\"tgt\">within \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cash \u003c/span>\u003cspan class=\"tgt\">nexus\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비싸고,\u003c/span>\u003cspan class=\"en\">is expensive,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 더 비싸진다\u003c/span>\u003cspan class=\"en\">and it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">grows \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">expensive\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간이 흐를수록.\u003c/span>\u003cspan class=\"en\">over time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">현금 거래 관계 내에서 삶을 재생산하는 것은 비싸고, 시간이 흐를수록 그것은 더 비싸진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 현금 거래 관계 안에서 삶을 재생산하는 비용이 계속 \u003cb class=\"key\">상승\u003c/b>한다고 말합니다. 임금은 억제되어도 노동자와 자연이 스스로를 회복하는 데 필요한 비용은 오히려 커지는 \u003cb class=\"key\">모순\u003c/b>을 짚습니다. 이는 곧이어 노동자의 저항과 생산 위기로 이어지는 논리의 \u003cb class=\"key\">연결고리\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [Reproducing life within the cash nexus] + [is] + [expensive] : \"현금 거래 관계 내에서 삶을 재생산하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">불완전자동사 grow + 형용사 보어\u003c/span> : [it] + [grows] + [more expensive] : \"그것은 더 비싸진다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Reproducing life within the cash nexus, 현금 거래 관계 내에서 삶을 재생산하는 것은. is expensive, 비싸고. and it grows more expensive, 그리고 그것은 더 비싸진다. over time, 시간이 흐를수록.. 이 문장 전체를 해석하면, 현금 거래 관계 내에서 삶을 재생산하는 것은 비싸고, 시간이 흐를수록 그것은 더 비싸진다.","hl":"m"},{"n":16,"text":"이 문장은 현금 거래 관계 안에서 삶을 재생산하는 비용이 계속 상승한다고 말해요. 임금은 억제되어도 노동자와 자연이 스스로를 회복하는 데 필요한 비용은 오히려 커지는 모순을 짚어 줍니다. 이 점이 바로 뒤에 노동자의 저항과 생산 위기로 이어지는 논리의 연결고리가 됩니다.","hl":"mn"},{"n":17,"text":"어법 포인트는 두 가지예요. 첫 번째, Reproducing life within the cash nexus는 동명사구가 주어로 쓰였어요. 긴 주어지만 단수로 취급해서 동사 is가 왔습니다. 두 번째, grows more expensive에서 grow는 불완전자동사로 점점 더 비싸진다는 뜻이에요. 뒤에 형용사 보어 more expensive를 취했고, more가 붙은 비교급 형태죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노동자의 임금은 동결될 수 있고,\u003c/span>\u003cspan class=\"en\">Workers' wages \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">frozen\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 삭감될 수도 있지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">rolled \u003c/span>\u003cspan class=\"tgt\">back\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국 불평등은 위기를 초래한다\u003c/span>\u003cspan class=\"en\">but in the end inequality leads to crises\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 최근 목격한 종류의\u003c/span>\u003cspan class=\"en\">of the kind \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">we've \u003c/span>\u003cspan class=\"tgt\">recently \u003c/span>\u003cspan class=\"tgt\">seen \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포퓰리스트 시위를 발생시킨\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">bring \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">populist \u003c/span>\u003cspan class=\"tgt\">protests\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국과 영국에서.\u003c/span>\u003cspan class=\"en\">in the United States and the United Kingdom.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">노동자의 임금은 동결되거나 심지어 삭감될 수 있지만, 결국 불평등은 우리가 최근 미국과 영국에서 포퓰리스트 시위를 발생시켰다고 목격한 것과 같은 종류의 위기를 초래한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 임금이 동결과 삭감될 수는 있어도 결국 \u003cb class=\"key\">불평등\u003c/b>이 위기를 부른다고 말합니다. 최근 미국과 영국의 \u003cb class=\"key\">포퓰리즘 \u003c/b>\u003cb class=\"key\">시위\u003c/b>를 그 위기의 예로 들어 현실감을 더합니다. 값싼 노동을 억압만으로 유지할 수 없으며, 자본주의 안의 \u003cb class=\"key\">모순\u003c/b>이 정치적 저항으로 폭발한다는 흐름을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 + be + 과거분사 수동태\u003c/span> : [Workers' wages] + [can be frozen] : \"노동자의 임금은 동결될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 병렬 생략\u003c/span> : [can be] + [rolled back] (can be 생략) : \"심지어 삭감될 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">지각동사 see + 목적어 + 동사원형\u003c/span> : [we] + [have recently seen] + [목적어(관계대명사 생략)] + [bring about ...] : \"최근 포퓰리스트 시위를 발생시켰다고 목격한\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Workers' wages can be frozen, 노동자의 임금은 동결될 수 있고. even rolled back, 심지어 삭감될 수도 있지만. but in the end inequality leads to crises, 결국 불평등은 위기를 초래한다. of the kind we've recently seen, 우리가 최근 목격한 종류의. bring about populist protests, 포퓰리스트 시위를 발생시킨. in the United States and the United Kingdom, 미국과 영국에서.. 이 문장 전체를 해석하면, 노동자의 임금은 동결되거나 심지어 삭감될 수 있지만, 결국 불평등은 우리가 최근 미국과 영국에서 포퓰리스트 시위를 발생시켰다고 목격한 것과 같은 종류의 위기를 초래한다.","hl":"m"},{"n":19,"text":"이 문장은 임금이 동결되거나 삭감될 수는 있어도 결국 불평등이 위기를 부른다고 말해요. 최근 미국과 영국의 포퓰리즘 시위를 그 위기의 예로 들어서 현실감을 더해 줍니다. 값싼 노동을 억압만으로 유지할 수 없기 때문에 자본주의 안의 모순이 정치적 저항으로 폭발한다는 흐름을 보여 줍니다.","hl":"mn"},{"n":20,"text":"어법 포인트를 세 가지로 정리할게요. 첫 번째, can be frozen은 조동사 can 뒤에 be 동사와 과거분사가 이어지는 수동태예요. 노동자의 임금이 스스로 동결되는 것이 아니라 동결되는 상황을 나타내죠. 두 번째, even rolled back에서는 앞의 can be가 생략된 병렬 구조예요. 공통된 요소가 반복되지 않도록 can be를 생략한 수동태 병렬입니다. 세 번째, we've recently seen bring about populist protests는 지각동사 see가 목적어의 동작을 동사원형 bring about으로 받는 용법이에요. 목적어인 kind는 관계대명사가 생략된 형태로 보면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노동자들은 존엄성을 요구하고,\u003c/span>\u003cspan class=\"en\">Workers demand dignity,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들의 노동력은\u003c/span>\u003cspan class=\"en\">and their labor\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비싸진다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">becomes \u003c/span>\u003cspan class=\"tgt\">expensive\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">노동자들은 존엄성을 요구하고, 그들의 노동력은 비싸진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 값싼 노동력이 더 이상 값싸지 않게 되는 과정을 보여 준다. 노동자들이 단지 임금만이 아니라 \u003cb class=\"key\">존엄성\u003c/b>을 요구하면 그들의 노동 비용이 올라가고, 이는 자본주의가 \u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">자연\u003c/b>에 의존하는 흐름을 깨뜨린다. 앞서 불평등이 위기를 초래한다는 내용에 이어, 노동력 상승이 또 다른 위기 요인임을 구체화한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 become + 주격 보어\u003c/span> : S + become + C(형용사/명사) : \"비싸진다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Workers demand dignity, 노동자들은 존엄성을 요구하고. and their labor, 그리고 그들의 노동력은. becomes expensive, 비싸진다.. 이 문장 전체를 해석하면, 노동자들은 존엄성을 요구하고, 그들의 노동력은 비싸진다.","hl":"m"},{"n":22,"text":"이 문장은 값싼 노동력이 더 이상 값싸지 않게 되는 과정을 보여 줍니다. 노동자들이 존엄성을 요구하면 그들의 노동 비용이 올라가고, 이는 자본주의가 값싼 자연에 의존하는 흐름을 깨뜨려요. 앞서 불평등이 위기를 초래한다는 내용에 이어, 노동력 상승이 또 다른 위기 요인임을 구체화합니다.","hl":"mn"},{"n":23,"text":"어법 포인트는 becomes expensive입니다. become은 이 문장에서 이 되다라는 뜻의 불완전 자동사로 쓰였고, 뒤에 형용사 expensive가 주격 보어로 와서 주어 their labor의 상태 변화를 설명해요. 그래서 그들의 노동력이 비싸진다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생산 과정은\u003c/span>\u003cspan class=\"en\">Production processes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">섬(현금 교환의 섬)을 고갈시키며,\u003c/span>\u003cspan class=\"en\">burn through an island,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 에너지는\u003c/span>\u003cspan class=\"en\">and energy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상 값싸지 않게 된다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">longer \u003c/span>\u003cspan class=\"tgt\">cheap\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">생산 과정은 섬(현금 교환의 섬)을 고갈시키며, 에너지는 더 이상 값싸지 않게 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 생산 과정이 현금 교환의 섬을 고갈시키면 에너지가 더 이상 값싸지 않게 된다는 뜻이다. \u003cb class=\"key\">섬\u003c/b>은 1번 문장에서 말한 자원의 중심지이고, 생산이 계속되면 그 자원이 \u003cb class=\"key\">고갈\u003c/b>되어 비용이 오른다. 이는 기후 변화와 함께 값싼 자연이 사라지는 사례를 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be 동사 + no longer + 주격 보어\u003c/span> : S + be + no longer + C(형용사) : \"더 이상 값싸지 않게 된다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Production processes, 생산 과정은. burn through an island, 섬(현금 교환의 섬)을 고갈시키며. and energy, 그리고 에너지는. is no longer cheap, 더 이상 값싸지 않게 된다.. 이 문장 전체를 해석하면, 생산 과정은 섬(현금 교환의 섬)을 고갈시키며, 에너지는 더 이상 값싸지 않게 된다.","hl":"m"},{"n":25,"text":"이 문장은 생산이 진행되면 자원이 소진되어 에너지가 더 이상 값싸게 유지될 수 없다는 뜻입니다. 여기서 섬은 현금 교환이 일어나는 자원의 고갈 대상이고, 결국 에너지 비용 상승이 자본주의의 위기를 불러요. 다음 문장의 기후 변화와 함께 값싼 것들이 사라지는 사례로 이어집니다.","hl":"mn"},{"n":26,"text":"어법 포인트는 is no longer cheap입니다. be 동사 뒤에 no longer라는 부사구가 들어가서 더 이상 어떤 상태가 아니라는 부정의 뜻을 만들어요. cheap은 주어 energy의 상태를 설명하는 주격 보어입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기후가 변화하고,\u003c/span>\u003cspan class=\"en\">The climate changes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 작물은\u003c/span>\u003cspan class=\"en\">and crops\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상 자랄 수 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">longer \u003c/span>\u003cspan class=\"tgt\">grow\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그만큼 풍부하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">abundantly \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한때 그랬던 것처럼.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">once \u003c/span>\u003cspan class=\"tgt\">did\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기후가 변화하고, 작물은 한때 그랬던 것처럼 더 이상 풍부하게 자라지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 기후 변화로 인해 작물 생산량이 이전만큼 풍부하지 않게 되었음을 나타낸다. 'as abundantly as they once did'는 과거의 풍요로움과 현재를 비교하는 \u003cb class=\"key\">원급 \u003c/b>\u003cb class=\"key\">비교\u003c/b> 표현이다. 이 또한 자본주의가 의존하던 \u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">자연\u003c/b>이 더 이상 값싸게 유지될 수 없음을 보여 주는 사례이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 부정 부사(no longer) + 동사원형\u003c/span> : can + no longer + V : \"더 이상 자랄 수 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">원급 비교 (as + 부사 + as + S + V)\u003c/span> : as + [부사 원급] + as + [S + V] : \"한때 그랬던 것만큼 풍부하게\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The climate changes, 기후가 변화하고. and crops, 그리고 작물은. can no longer grow, 더 이상 자랄 수 없다. as abundantly, 그만큼 풍부하게. as they once did, 한때 그랬던 것처럼.. 이 문장 전체를 해석하면, 기후가 변화하고, 작물은 한때 그랬던 것처럼 더 이상 풍부하게 자라지 않는다.","hl":"m"},{"n":28,"text":"이 문장은 기후 변화로 인해 작물 생산량이 이전만큼 풍부하지 않게 되었다는 뜻입니다. as abundantly as they once did는 과거의 풍요로움과 현재를 비교하는 표현이에요. 이것도 자본주의가 의존하던 값싼 자연이 더 이상 값싸게 유지될 수 없음을 보여 주는 사례입니다.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 can no longer grow입니다. 조동사 can은 할 수 있다는 능력의 뜻을 나타내고, no longer라는 부정어구가 붙어서 더 이상 자랄 수 없다는 능력의 부정을 만들어요. 두 번째 어법 포인트는 as abundantly as they once did입니다. 앞의 as는 부사로 그만큼, 뒤의 as는 접속사로 만큼이라는 뜻이고, 그 뒤에 비교 대상인 과거의 상황이 이어져서 원급 비교 구문이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미개척 영역은 이러한 과정에서 매우 중요하다\u003c/span>\u003cspan class=\"en\">Frontiers are so important in these processes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그것들은 장소를 제공하기 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">offer \u003c/span>\u003cspan class=\"tgt\">places\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 값싼 것들이 확보될 수 있는 곳\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">cheap \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">seized\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 인간과 다른 만물의 값싼 노동력이\u003c/span>\u003cspan class=\"en\">― and the cheap work of humans and other natures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강제로 취해질 수 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">forcefully \u003c/span>\u003cspan class=\"tgt\">taken\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 과정에서 미개척 영역이 중요한데, 왜냐하면 그것이 새로운 값싼 것들이 확보될 수 있는 장소를 제공하기 때문이다. 즉, 값싼 인간의 노동력과 다른 만물이 강제로 취해질 수 있다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 여기서 frontiers는 단순한 국경이 아니라, 자본주의가 값싼 자원과 노동력을 새로 확보하기 위해 진입하는 \u003cb class=\"key\">미개척 \u003c/b>\u003cb class=\"key\">영역\u003c/b>을 뜻합니다. 이 문장은 글 전체의 결론으로, 자본주의가 위기에 빠질 때마다 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 찾아 확장해야 하는 이유를 요약합니다. 특히 인간과 다른 만물의 노동력이 \u003cb class=\"key\">강제로 \u003c/b>\u003cb class=\"key\">취해질\u003c/b> 수 있다는 표현은 착취의 성격을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유의 부사절 접속사 because\u003c/span> : 주절 + [because + 주어 + 동사] : \"왜냐하면 그것들은 장소를 제공하기 때문이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사 where\u003c/span> : 선행사(places) + where + 완전한 절 : \"새로운 값싼 것들이 확보될 수 있는 곳\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 + 수동태\u003c/span> : can + be + p.p.(+부사) : \"강제로 취해질 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Frontiers are so important in these processes, 미개척 영역은 이러한 과정에서 매우 중요하다. because they offer places, 왜냐하면 그것들은 장소를 제공하기 때문이다. where the new cheap things can be seized, 새로운 값싼 것들이 확보될 수 있는 곳. ― and the cheap work of humans and other natures, 그리고 인간과 다른 만물의 값싼 노동력이. can be forcefully taken, 강제로 취해질 수 있다.. 이 문장 전체를 해석하면, 이러한 과정에서 미개척 영역이 중요한데, 왜냐하면 그것이 새로운 값싼 것들이 확보될 수 있는 장소를 제공하기 때문이다. 즉, 값싼 인간의 노동력과 다른 만물이 강제로 취해질 수 있다는 것이다.","hl":"m"},{"n":31,"text":"이 문장은 글 전체의 결론이에요. 미개척 영역은 새로운 값싼 것들을 확보할 수 있는 장소를 제공하기 때문에 자본주의에 꼭 필요하죠. 특히 인간과 다른 만물의 값싼 노동력이 강제로 취해질 수 있다는 표현은 이 과정에 착취의 성격이 있다는 걸 보여줘요.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 because로, 이유를 나타내는 부사절 접속사예요. 두 번째 포인트는 where로, 장소 선행사 places를 수식하는 관계부사이고 뒤에 완전한 절이 와요. 세 번째 포인트는 can be forcefully taken으로, 조동사 can 뒤에 be와 과거분사가 오는 조동사 수동태 구조예요. can be seized도 같은 조동사 수동태이고, 둘 다 주어가 당하는 수동의 의미를 나타내요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>자본주의는 \u003cb class=\"key\">현금\u003c/b>이 어디에나 있는 체제가 아니라 \u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">만물\u003c/b>의 바다에 \u003cb class=\"key\">현금 \u003c/b>\u003cb class=\"key\">교환의 \u003c/b>\u003cb class=\"key\">섬\u003c/b>들이 있는 시스템이다.\u003c/li>\u003cli>삶의 재생산, 노동자의 존엄 요구, 에너지 고갈, 기후 변화로 인해 \u003cb class=\"key\">비용\u003c/b>이 상승하고 \u003cb class=\"key\">위기\u003c/b>가 발생한다.\u003c/li>\u003cli>임금 삭감과 불평등은 \u003cb class=\"key\">포퓰리스트 \u003c/b>\u003cb class=\"key\">시위\u003c/b> 같은 사회적 위기를 부른다.\u003c/li>\u003cli>따라서 새로운 값싼 것과 노동을 \u003cb class=\"key\">강제로\u003c/b> 확보할 수 있는 \u003cb class=\"key\">미개척 \u003c/b>\u003cb class=\"key\">영역\u003c/b>이 중요해진다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Capitalism depends on cheap natures, and as reproduction, labor, energy, and climate become expensive, it turns to frontiers to seize new cheap things and work.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">자본주의는 \u003cb class=\"key\">값싼 \u003c/b>\u003cb class=\"key\">만물\u003c/b>의 바다에 \u003cb class=\"key\">현금 \u003c/b>\u003cb class=\"key\">교환의 \u003c/b>\u003cb class=\"key\">섬\u003c/b>들을 세워 유지되지만, 삶의 재생산·임금·에너지·기후의 비용이 오르면서 \u003cb class=\"key\">위기\u003c/b>를 맞는다. 그래서 새로운 값싼 것과 노동을 강제로 확보할 수 있는 \u003cb class=\"key\">미개척 \u003c/b>\u003cb class=\"key\">영역\u003c/b>이 중요해진다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 지문을 정리하면, 자본주의는 값싼 만물의 바다 위에 현금 교환의 섬을 세운 시스템이지만, 삶의 재생산과 노동, 에너지, 기후의 비용이 오르면서 위기를 맞습니다. 그러면 새로운 값싼 것과 노동을 강제로 확보할 수 있는 미개척 영역이 중요해진다는 주장이었어요. 이 흐름을 지문에 그대로 적용해 보면 어렵지 않게 정답을 찾을 수 있을 거예요. 오늘 수업은 여기까지입니다. 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
