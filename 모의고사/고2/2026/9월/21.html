}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 21번","audioDir":"21_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">21번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Instant Virtue Is Impossible\u003c/h1>\u003ch2>즉각적인 미덕은 불가능하다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>약을 먹고 생긴 \u003cb class=\"key\">일회적 \u003c/b>\u003cb class=\"key\">관대함\u003c/b>은 칭찬할 만해도 \u003cb class=\"key\">진정한 \u003c/b>\u003cb class=\"key\">관대함\u003c/b>이 아니다. 미덕은 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>에 자리한 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">습관\u003c/b>으로 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">역사\u003c/b>의 결과이므로 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">미덕\u003c/b>은 불가능하다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>True virtue is a stable moral habit formed through personal history, so instant virtue from a pill is impossible.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요. 오늘 다룰 지문은 전국연합학력평가 스물한 번째 문제입니다. 평소 인색한 친구가 관대함 효능 촉진제를 먹고 선물을 주는 이야기로 시작해요. 글의 요지는 진짜 미덕은 개인 역사 속에서 형성된 습관이므로 즉각적으로 만들어질 수 없다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">윤리학에는 행동보다 \u003cb class=\"key\">성품\u003c/b>과 \u003cb class=\"key\">습관\u003c/b>을 중시하는 \u003cb class=\"key\">미덕 \u003c/b>\u003cb class=\"key\">윤리\u003c/b>(virtue ethics) 전통이 있습니다. 미국 철학자 Linda Zagzebski는 미덕을 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>(moral identity)의 일부로 설명합니다. 관대함(generosity) 같은 미덕은 한 번의 선택이 아니라 반복된 행동으로 형성된 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">습관\u003c/b>(emotional habit)입니다. 이는 마치 근육이 하루아침에 생기지 않고 꾸준한 운동으로 자라나는 것과 비슷합니다. 약물로 감정을 바꾸는 \u003cb class=\"key\">즉각적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>는 성품 형성과 다릅니다. 그래서 이 글은 진짜 미덕은 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">역사\u003c/b>의 결과라고 말합니다.\u003c/div>","segs":[{"n":2,"text":"철학에는 미덕 윤리 virtue ethics라는 분야가 있습니다. 사람의 성품과 습관을 중요하게 보는 관점이죠. 미국 철학자 자그젭스키는 도덕적 정체성 moral identity이라는 말을 씁니다. 관대함은 그냥 한 번 베푸는 행동이 아니라 내가 어떤 사람인지를 보여 주는 정서적 습관 emotional habit이에요. 근육처럼 반복된 행동과 경험이 쌓여서 만들어집니다. 그래서 약 한 알로 성품이 바뀌기는 어렵습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>약효 뒤의 선물\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>평소 \u003cb class=\"key\">인색한\u003c/b> 친구가 \u003cb class=\"key\">관대함 \u003c/b>\u003cb class=\"key\">효능 \u003c/b>\u003cb class=\"key\">촉진제\u003c/b>를 먹고 크리스마스 선물을 사 주는 가상 상황을 제시합니다. 우리는 그 행동에 \u003cb class=\"key\">칭찬할 \u003c/b>\u003cb class=\"key\">만한 \u003c/b>\u003cb class=\"key\">점\u003c/b>이 있다고 느끼게 됩니다. 이렇게 구체적 사례가 화제를 엽니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>고마움과 아쉬움\u003csmall>통념 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>선물을 받아 \u003cb class=\"key\">기쁨\u003c/b>을 느끼고, 고맙다는 말도 \u003cb class=\"key\">진심\u003c/b>으로 하게 됩니다. 하지만 But이 등장하며 친구의 \u003cb class=\"key\">마음의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 완전히 만족스럽지는 않다고 반전을 만듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>진짜 관대함\u003csmall>주장 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>미국 철학자 \u003cb class=\"key\">재그젭스키\u003c/b>에 따르면 그 친구는 진정으로 \u003cb class=\"key\">관대한\u003c/b> 것이 아닙니다. 선물을 하나 준 사람은 관대한 게 아니며, 관대함은 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>의 안정된 일부입니다. 이는 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">습관\u003c/b>이라고 정의됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>미덕과 개인 역사\u003csmall>근거 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>미덕은 \u003cb class=\"key\">비전형적인 \u003c/b>\u003cb class=\"key\">충동\u003c/b>과 달리 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">역사\u003c/b>의 결과입니다. 이것들은 인품이 형성된 방식의 일부이므로 \u003cb class=\"key\">그 \u003c/b>\u003cb class=\"key\">사람의 \u003c/b>\u003cb class=\"key\">모습\u003c/b> 중 일부입니다. 즉 하루아침에 생기지 않습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>즉각적 미덕 불가\u003csmall>결론 · 문장 12–13\u003c/small>\u003c/h4>\u003cp>그러므로 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">미덕\u003c/b>은 있을 수 없습니다. 약 한 알을 먹는 것이 여러분을 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">나은 \u003c/b>\u003cb class=\"key\">사람\u003c/b>으로 만들 수는 없습니다. \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">역사\u003c/b>를 통한 형성만이 진짜 미덕을 만듭니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글은 가상의 사례에서 시작해 일반 원리로 나아가고, 마지막에 즉각적인 미덕은 불가능하다고 결론 내립니다.","hl":null},{"n":4,"text":"첫 번째 단계에서는 평소 인색한 친구가 관대함 효능 촉진제를 먹고 크리스마스 선물을 사 주는 상황을 상상해 보라고 합니다. 우리는 그 행동이 칭찬할 만하다고 느낄 거예요. 이렇게 구체적인 사례가 도입됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 우리의 일상적 반응이 나옵니다. 선물을 받아 기쁘고 고맙다는 말도 진심으로 하겠죠. 그런데 문장에서 But이 나오며 마음의 변화가 완전히 만족스럽지는 않다고 짚습니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 미국 철학자 자그젭스키를 인용합니다. 선물을 한 번 준 사람은 진정으로 관대한 게 아니라고 해요. 관대함은 도덕적 정체성의 안정된 일부이고 정서적 습관이라고 정의합니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 이유를 일반화합니다. 미덕은 비전형적인 충동과 달리 개인 역사의 결과라는 거예요. 그것들이 인품이 형성된 방식의 일부이기 때문에 그 사람의 모습 중 일부가 됩니다.","hl":"f3"},{"n":8,"text":"마지막 단계에서는 결론을 내립니다. 그러므로 즉각적인 미덕은 있을 수 없고, 약 한 알을 먹는 것이 여러분을 더 나은 사람으로 만들 수는 없다고 정리합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 친구의 선물이라는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>로 시작해, 철학자 인용을 통해 \u003cb class=\"key\">진정한 \u003c/b>\u003cb class=\"key\">관대함\u003c/b>의 개념을 정의한 뒤 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">미덕\u003c/b> 불가능이라는 결론으로 나아갑니다. 주제문이 마지막에 있으므로 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다. But과 Instead가 \u003cb class=\"key\">대조\u003c/b>를 이끌고 Thus와 therefore가 \u003cb class=\"key\">결론\u003c/b>을 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Imagine (1)\u003c/b>\u003cspan>가상 예시 도입\u003c/span>\u003cb>But (6)\u003c/b>\u003cspan>반전 및 의문 제기\u003c/span>\u003cb>According to Zagzebski (7)\u003c/b>\u003cspan>권위 인용을 통한 주장\u003c/span>\u003cb>Instead (9)\u003c/b>\u003cspan>대조적 정의\u003c/span>\u003cb>Thus (10)\u003c/b>\u003cspan>일반화와 근거 제시\u003c/span>\u003cb>therefore (12)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a generosity booster\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">generous\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">generosity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">virtues\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Instant virtue\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>진짜 미덕 (virtue)\u003c/th>\u003cth>비전형적 충동 (nontypical impulse)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>도덕적 정체성의 안정된 일부\u003c/td>\u003ctd>일시적이고 비전형적 충동\u003c/td>\u003c/tr>\u003ctr>\u003ctd>개인 역사의 결과로 형성됨\u003c/td>\u003ctd>약물로 유발된 즉각적 변화\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 가상의 사례를 제시하고 그에 대한 반응을 살핀 뒤, 철학자의 주장을 빌려 일반 원리를 설명하는 방식입니다. 결론이 마지막에 있으므로 미괄식 구조입니다. 예시에서 시작해 therefore로 끝나는 흐름을 잡아야 해요.","hl":"ty"},{"n":10,"text":"Imagine은 가상의 예시를 여는 신호이고, But은 만족스럽지 않다는 반전을 보여 줍니다. According to Zagzebski는 권위를 빌려 주장을 전달하고, Instead는 진짜 관대함을 정의하며 대조해요. Thus와 therefore는 결론으로 이끄는 신호어입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>usually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>보통, 평소에\u003c/span>\u003c/div>\u003cdiv>\u003cb>stingy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인색한\u003c/span>\u003c/div>\u003cdiv>\u003cb>delights in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 몹시 기뻐하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>generosity booster\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관대함 효능 촉진제\u003c/span>\u003c/div>\u003cdiv>\u003cb>take\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(약을) 복용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>undoubtedly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>의심할 여지없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>praiseworthy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>칭찬할 만한\u003c/span>\u003c/div>\u003cdiv>\u003cb>pleased\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기쁜\u003c/span>\u003c/div>\u003cdiv>\u003cb>receive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean it\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>진심으로 말하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>change of heart\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>마음의 변화\u003c/span>\u003c/div>\u003cdiv>\u003cb>satisfying\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>만족스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>according to\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에 따르면\u003c/span>\u003c/div>\u003cdiv>\u003cb>philosopher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>철학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>generous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>praise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>칭찬하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>character\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인품, 성격\u003c/span>\u003c/div>\u003cdiv>\u003cb>virtue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미덕\u003c/span>\u003c/div>\u003cdiv>\u003cb>stable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>안정된\u003c/span>\u003c/div>\u003cdiv>\u003cb>moral identity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도덕적 정체성\u003c/span>\u003c/div>\u003cdiv>\u003cb>emotional habit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정서적 습관\u003c/span>\u003c/div>\u003cdiv>\u003cb>as opposed to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와는 달리\u003c/span>\u003c/div>\u003cdiv>\u003cb>nontypical impulse\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비전형적인 충동\u003c/span>\u003c/div>\u003cdiv>\u003cb>personal history\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인 역사\u003c/span>\u003c/div>\u003cdiv>\u003cb>instant virtue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>즉각적인 미덕\u003c/span>\u003c/div>\u003cdiv>\u003cb>impossible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>popping a pill\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>약 한 알을 먹는 것\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이번 지문에서 stingy는 인색한, praiseworthy는 칭찬할 만한이라는 뜻이에요. change of heart는 마음의 변화라는 숙어이고, as opposed to는 와는 달리라는 뜻으로 대조를 나타냅니다. popping a pill은 약 한 알을 먹는 것을 가리켜요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">generous\u003c/b>\u003cspan class=\"m\">관대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">charitable\u003c/span>\u003cspan class=\"s\">benevolent\u003c/span>\u003cspan class=\"s\">giving\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stingy\u003c/span>\u003cspan class=\"a\">selfish\u003c/span>\u003cspan class=\"a\">mean\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stingy\u003c/b>\u003cspan class=\"m\">인색한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">miserly\u003c/span>\u003cspan class=\"s\">tightfisted\u003c/span>\u003cspan class=\"s\">cheap\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">generous\u003c/span>\u003cspan class=\"a\">giving\u003c/span>\u003cspan class=\"a\">liberal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">virtue\u003c/b>\u003cspan class=\"m\">미덕\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">goodness\u003c/span>\u003cspan class=\"s\">morality\u003c/span>\u003cspan class=\"s\">righteousness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">vice\u003c/span>\u003cspan class=\"a\">wickedness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stable\u003c/b>\u003cspan class=\"m\">안정된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">steady\u003c/span>\u003cspan class=\"s\">constant\u003c/span>\u003cspan class=\"s\">firm\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unstable\u003c/span>\u003cspan class=\"a\">changeable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">impossible\u003c/b>\u003cspan class=\"m\">불가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unachievable\u003c/span>\u003cspan class=\"s\">inconceivable\u003c/span>\u003cspan class=\"s\">unattainable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">possible\u003c/span>\u003cspan class=\"a\">achievable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">praiseworthy\u003c/b>\u003cspan class=\"m\">칭찬할 만한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">commendable\u003c/span>\u003cspan class=\"s\">admirable\u003c/span>\u003cspan class=\"s\">laudable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">blameworthy\u003c/span>\u003cspan class=\"a\">reprehensible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">impulse\u003c/b>\u003cspan class=\"m\">충동\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">urge\u003c/span>\u003cspan class=\"s\">whim\u003c/span>\u003cspan class=\"s\">inclination\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">habit\u003c/span>\u003cspan class=\"a\">pattern\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"generous는 관대한이라는 뜻으로 charitable, benevolent와 비슷하고 stingy와 반대입니다. stingy는 인색한으로 miserly, tightfisted와 가깝고 generous와 반대예요. virtue는 미덕으로 goodness, morality와 유사하고 vice와 반대입니다. stable은 안정된으로 steady, constant와 비슷하고 unstable과 반대예요. impossible은 불가능한으로 unachievable과 가깝고 possible과 반대이며, praiseworthy는 commendable, admirable과 가깝고 blameworthy와 반대입니다. impulse는 urge, whim과 비슷하고 habit과 대비됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라고 상상해 보라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Imagine \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평소에 인색한 여러분의 친구가\u003c/span>\u003cspan class=\"en\">your usually stingy friend\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분에게 크리스마스 선물을 사 주며 매우 기뻐한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">delights \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">buying\u003c/span> you a Christmas present\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관대함 효능 촉진제를 먹고 난 이후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">taking\u003c/span> a generosity booster.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">평소에 인색한 여러분의 친구가 관대함 효능 촉진제를 먹고 난 이후에 여러분에게 크리스마스 선물을 사 주며 매우 기뻐한다고 상상해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 평소 \u003cb class=\"key\">인색한\u003c/b> 친구가 \u003cb class=\"key\">관대함 \u003c/b>\u003cb class=\"key\">효능 \u003c/b>\u003cb class=\"key\">촉진제\u003c/b>를 먹고 선물을 사 주는 가상 상황을 제시한다. 글 전체에서 ‘약으로 만든 미덕’이 진짜 미덕인지 묻는 논의의 출발점이다. 상상하라는 명령문으로 독자를 구체적 상황에 끌어들인다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문과 that절 목적어\u003c/span> : Imagine [동사원형] + [that절 (목적어)] : \"~라고 상상해 보라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 in의 목적어로 쓰인 동명사\u003c/span> : delight in + [buying (동명사구)] : \"사는 것을 매우 기뻐하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 after와 동명사\u003c/span> : after + [taking (동명사구)] : \"먹고 난 이후에\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Imagine that, ~라고 상상해 보라. your usually stingy friend, 평소에 인색한 여러분의 친구가. delights in buying you a Christmas present, 여러분에게 크리스마스 선물을 사 주며 매우 기뻐한다. after taking a generosity booster, 관대함 효능 촉진제를 먹고 난 이후에. 이 문장 전체를 해석하면, 평소에 인색한 여러분의 친구가 관대함 효능 촉진제를 먹고 난 이후에 여러분에게 크리스마스 선물을 사 주며 매우 기뻐한다고 상상해 보라.","hl":"m"},{"n":14,"text":"평소에는 인색한 친구가 관대함 효능 촉진제라는 약을 먹고 나서 선물을 사 주며 즐거워하는 상황을 상상해 보라는 문장이에요. 이건 글 전체에서 약으로 미덕을 만들 수 있는지 묻는 논의의 출발점이에요. 독자를 구체적인 상황으로 끌어들이려는 장치이기도 하죠.","hl":"mn"},{"n":15,"text":"첫 번째 문법 포인트는 Imagine that이에요. 동사원형으로 시작하는 명령문이고, that절 전체가 Imagine의 목적어 역할을 해요. 두 번째는 delights in buying인데, 전치사 in 뒤라서 buy가 동명사 buying으로 바뀌었어요. delight in은 무언가를 매우 기뻐하다라는 관용 표현이에요. 세 번째는 after taking인데, after가 전치사라서 동사 take가 동명사 taking으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게\u003c/span>\u003cspan class=\"en\">How\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">느끼겠는가?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">feel\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 어떻게 느끼겠는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 제시한 가상 상황에 대한 독자의 \u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>을 직접 묻는다. 독자가 등장인물의 행동을 먼저 \u003cb class=\"key\">직관적\u003c/b>으로 평가하게 만드는 역할을 한다. 이 질문은 곧이어 ‘칭찬할 만한 점이 있다’는 긍정적 반응으로 이어진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 would를 이용한 의문문\u003c/span> : How + would + 주어(you) + 동사원형(feel)? : \"어떻게 느끼겠는가?\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"How, 어떻게. would you feel?, 느끼겠는가?. 이 문장 전체를 해석하면, 여러분은 어떻게 느끼겠는가?","hl":"m"},{"n":17,"text":"이 문장은 앞에서 상상한 상황에 대해 여러분이라면 어떻게 느낄지 감정적 반응을 직접 묻는 질문이에요. 독자가 그 행동을 먼저 직관적으로 평가해 보도록 만드는 역할을 하죠. 이 질문은 다음 문장에서 칭찬할 만한 점이 있다는 긍정적인 반응으로 자연스럽게 연결돼요.","hl":"mn"},{"n":18,"text":"여기서 핵심 문법은 would you feel이에요. How 다음에 조동사 would가 오고, 주어 you, 그다음 동사원형 feel이 오는 의문문 구조예요. 가상의 상황에서 상대방의 느낌을 물을 때 would를 써서 가정적인 분위기를 만들어 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의심할 여지없이\u003c/span>\u003cspan class=\"en\">Undoubtedly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">칭찬할 만한 점이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">praiseworthy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 행동에는\u003c/span>\u003cspan class=\"en\">about the action.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">의심할 여지없이, 그 행동에는 칭찬할 만한 점이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구가 선물을 준 \u003cb class=\"key\">행동\u003c/b> 자체에는 \u003cb class=\"key\">칭찬할 \u003c/b>\u003cb class=\"key\">만한\u003c/b> 점이 있음을 인정하는 문장이다. 그러나 이는 일시적 행동에 대한 평가일 뿐이며, 뒤에서 진정한 \u003cb class=\"key\">미덕\u003c/b>은 습관이어야 한다는 반전으로 이어진다. 상대방을 일단 인정해 준 뒤 논지를 펴는 구조다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there is 구문\u003c/span> : There is + [단수명사(something)] + [형용사(praiseworthy)] : \"칭찬할 만한 점이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">-thing 계열 대명사의 형용사 후치 수식\u003c/span> : something + [형용사(praiseworthy)] : \"칭찬할 만한 무언가\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Undoubtedly, 의심할 여지없이. there is something praiseworthy, 칭찬할 만한 점이 있다. about the action, 그 행동에는. 이 문장 전체를 해석하면, 의심할 여지없이, 그 행동에는 칭찬할 만한 점이 있다.","hl":"m"},{"n":20,"text":"이 문장은 친구가 선물을 준 행동 자체에는 분명히 칭찬할 만한 점이 있다고 인정하는 거예요. 하지만 이건 어디까지나 일시적인 행동에 대한 평가일 뿐이에요. 뒤에서 진짜 미덕은 안정된 습관이어야 한다는 반전으로 이어지는 중요한 연결 고리예요.","hl":"mn"},{"n":21,"text":"첫 번째 문법 포인트는 there is something praiseworthy인데, 새로운 정보를 소개하는 there is 구문이에요. something은 단수니까 is가 왔어요. 두 번째는 something praiseworthy 어순이에요. something처럼 thing으로 끝나는 부정대명사는 형용사가 뒤에서 수식해서 something praiseworthy가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 기뻐할 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">You'd\u003c/span> be pleased\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선물을 받아서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">receive \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">gift\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 선물을 받아서 기뻐할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 인색한 친구가 준 선물을 받으면 느끼는 즉각적인 기쁨을 말합니다. 겉으로 드러난 행동 자체는 좋고 환영할 만하다는 점을 인정하는 역할이에요. 여기서 중요한 것은 \u003cb class=\"key\">선물을 \u003c/b>\u003cb class=\"key\">받는 \u003c/b>\u003cb class=\"key\">기쁨\u003c/b>이 친구의 성품까지 바뀌었다는 뜻은 아니라는 점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 would의 축약\u003c/span> : You'd(=You would) + be pleased : \"여러분은 ~일 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(감정의 원인)\u003c/span> : be pleased + to receive the gift : \"선물을 받아서\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"You'd be pleased, 여러분은 기뻐할 것이다. to receive the gift, 선물을 받아서. 이 문장 전체를 해석하면, 여러분은 선물을 받아서 기뻐할 것이다.","hl":"m"},{"n":23,"text":"이 문장은 인색한 친구가 준 선물을 받으면 일단 기분이 좋다는 사실을 말하고 있어요. 겉으로 드러난 행동 자체는 좋고 환영할 만하다는 점을 인정하는 거죠. 하지만 여기서 말하는 기쁨은 선물을 받는 즉각적인 기쁨일 뿐, 친구의 성품까지 바뀌었다는 뜻은 아니에요.","hl":"mn"},{"n":24,"text":"첫 번째로 You'd는 You would의 축약이에요. 상상 속의 상황을 가정하는 맥락이라 조동사 would를 썼고, 말할 때는 You'd로 줄여서 표현합니다. 두 번째로 to receive the gift는 to부정사의 부사적 용법인데요, pleased라는 감정의 원인을 to 이하가 설명해 줍니다. 이처럼 어떤 감정의 원인을 나타내는 to부정사는 부사적 용법으로 쓰여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 ‘고마워’라고 말하고\u003c/span>\u003cspan class=\"en\">You'd \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">say \u003c/span>\u003cspan class=\"tgt\">'thank \u003c/span>\u003cspan class=\"tgt\">you', \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 진심일 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">mean \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 ‘고마워’라고 말하고, 그것은 진심일 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 고맙다는 말이 단순한 인사치레가 아니라 \u003cb class=\"key\">진심\u003c/b>이라는 점을 분명히 합니다. 받는 사람의 감사는 진짜이지만, 그렇다고 친구가 \u003cb class=\"key\">관대한 \u003c/b>\u003cb class=\"key\">사람\u003c/b>이 되었다는 증거는 되지 못해요. 긍정적 반응을 인정하면서도 다음 문장의 반전을 준비하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬 구조\u003c/span> : You'd + say~ and (You'd) + mean~ : \"말하고, 그것은 진심이다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"You'd say 'thank you', 여러분은 ‘고마워’라고 말하고. and mean it, 그것은 진심일 것이다. 이 문장 전체를 해석하면, 여러분은 ‘고마워’라고 말하고, 그것은 진심일 것이다.","hl":"m"},{"n":26,"text":"이 문장은 고맙다는 인사가 인사치레가 아니라 진심이라는 걸 말해요. 선물을 받은 사람으로서 느끼는 고마움은 진짜지만, 그렇다고 그 친구가 관대한 사람이 되었다는 뜻은 아니에요. 그래서 긍정적인 반응이 인정되면서도 다음 문장에서 반전이 일어날 수 있는 여지를 남겨요.","hl":"mn"},{"n":27,"text":"여기서 say thank you와 mean it이 and로 연결된 병렬 구조예요. say thank you와 mean it은 같은 자리에 있는 동사구이고, 두 번째 mean 앞에는 You'd가 생략되어 있죠. 이런 식으로 and 앞뒤에 같은 형태의 말을 두어 문장을 대등하게 연결하는 게 병렬 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그의 마음의 변화는\u003c/span>\u003cspan class=\"en\">But his change of heart\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 만족스럽지는 않다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">entirely \u003c/span>\u003cspan class=\"tgt\">satisfying\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그의 마음의 변화는 완전히 만족스럽지는 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 하지만 친구의 \u003cb class=\"key\">마음의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">만족스럽지\u003c/b>는 않다고 말하며 논점을 전환합니다. 선물과 고마움이라는 긍정적 요소가 있어도 약으로 만든 일시적 변화는 진짜 \u003cb class=\"key\">미덕\u003c/b>으로 이어지지 못한다는 문제를 제기해요. 이 문장은 뒤에서 설명할 즉각적 미덕은 불가능하다는 주장의 징검다리 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부분 부정과 현재분사 satisfying의 주격 보어\u003c/span> : S(change) + is + not entirely satisfying : \"완전히 만족스럽지는 않은\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"But his change of heart, 하지만 그의 마음의 변화는. is not entirely satisfying, 완전히 만족스럽지는 않다. 이 문장 전체를 해석하면, 하지만 그의 마음의 변화는 완전히 만족스럽지는 않다.","hl":"m"},{"n":29,"text":"이 문장은 하지만이라는 연결어로 논점을 전환해요. 선물을 받고 고마워하는 긍정적인 반응에도 불구하고, 약으로 만든 친구의 마음 변화는 완전히 만족스럽지 않다고 말하고 있죠. 이 문장이 뒤에서 즉각적인 미덕은 있을 수 없다는 주장으로 넘어가는 징검다리 역할을 합니다.","hl":"mn"},{"n":30,"text":"not entirely satisfying에서 not entirely는 완전히 그런 것은 아니라는 부분 부정을 나타내요. satisfying은 주어인 change를 서술하는 주격 보어로 쓰였고, 만족시키는이 아니라 만족스러운이라는 형용사적 의미로 쓰였어요. 그래서 그의 마음 변화가 완전히 만족스러운 것은 아니라는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Zagzebski에 따르면,\u003c/span>\u003cspan class=\"en\">According to Zagzebski,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국의 철학자인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">American \u003c/span>\u003cspan class=\"tgt\">philosopher\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 진정으로 관대한 것이 아니다\u003c/span>\u003cspan class=\"en\">he is not really generous.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미국의 철학자인 Zagzebski에 따르면, 그는 진정으로 관대한 것이 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 친구의 마음 변화가 완전히 만족스럽지 않은 이유를 철학자의 권위를 빌려 정리한다. 선물 하나를 준 행동은 칭찬할 만해도 \u003cb class=\"key\">진정한 \u003c/b>\u003cb class=\"key\">관대함\u003c/b>은 아니라는 것이다. 여기서 really는 ‘진정으로’로, 단순한 일회적 행동과 \u003cb class=\"key\">인품\u003c/b>을 구분하는 핵심 표현이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격 (apposition)\u003c/span> : [Zagzebski] + [an American philosopher] : \"미국의 철학자인\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"According to Zagzebski, Zagzebski에 따르면. an American philosopher, 미국의 철학자인. he is not really generous, 그는 진정으로 관대한 것이 아니다. 이 문장 전체를 해석하면, 미국의 철학자인 Zagzebski에 따르면, 그는 진정으로 관대한 것이 아니다.","hl":"m"},{"n":32,"text":"이 문장은 선물을 주는 행동만으로는 그 사람이 진정으로 관대해졌다고 볼 수 없다는 점을 철학자의 말로 정리해 줍니다. 여기서 really는 진정으로라는 뜻으로, 일회성 행동과 실제 인품을 구분하는 중요한 부사예요.","hl":"mn"},{"n":33,"text":"이 문장의 어법 포인트는 an American philosopher가 동격 표현이라는 점입니다. 콤마로 묶여 앞에 나온 Zagzebski가 누구인지 미국의 철학자라고 다시 설명해 주고 있어요. 동격은 앞의 명사와 같은 대상을 다른 말로 부연하는 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 누군가의 인품을 칭찬할 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">praise \u003c/span>\u003cspan class=\"tgt\">someone's \u003c/span>\u003cspan class=\"tgt\">character\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 미덕에 대한 단어를 사용한다\u003c/span>\u003cspan class=\"en\">we use words for various virtues:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘관대한,’ ‘친절한,’ ‘용기 있는’ 등\u003c/span>\u003cspan class=\"en\">'generous', 'kind', 'courageous', etc.\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선물을 하나 준 사람이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">person \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">gives \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">gift\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관대한 것은 아니다\u003c/span>\u003cspan class=\"en\">isn't generous.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 누군가의 인품을 칭찬할 때 ‘관대한,’ ‘친절한,’ ‘용기 있는’ 등 다양한 미덕에 대한 단어를 사용한다. 선물을 하나 준 사람이 관대한 것은 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 칭찬할 때 쓰는 다양한 미덕 단어들을 예로 들며, 한 번 선물을 준 사람은 관대하다고 말하지 않는다는 점을 보여 준다. 즉 한 번의 행동으로는 \u003cb class=\"key\">인품\u003c/b>을 판단할 수 없으며, 미덕은 반복되는 \u003cb class=\"key\">성향\u003c/b>이어야 한다는 논리로 연결된다. a person who gives one gift는 관계대명사 who로 사람을 수식하는 표현이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 (when)\u003c/span> : When + 주어 + 동사 ~, 주어 + 동사 ~ : \"우리가 누군가의 인품을 칭찬할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 (who)\u003c/span> : 선행사 [A person] + [who + 동사(gives) ~] : \"선물을 하나 준 사람\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"When we praise someone's character, 우리가 누군가의 인품을 칭찬할 때. we use words for various virtues, 다양한 미덕에 대한 단어를 사용한다. 'generous', 'kind', 'courageous', etc, ‘관대한,’ ‘친절한,’ ‘용기 있는’ 등. A person who gives one gift, 선물을 하나 준 사람이. isn't generous, 관대한 것은 아니다. 이 문장 전체를 해석하면, 우리가 누군가의 인품을 칭찬할 때 ‘관대한,’ ‘친절한,’ ‘용기 있는’ 등 다양한 미덕에 대한 단어를 사용한다. 선물을 하나 준 사람이 관대한 것은 아니다.","hl":"m"},{"n":35,"text":"이 문장은 어떤 사람을 칭찬할 때 관대한, 친절한, 용기 있는 같은 다양한 미덕 단어를 쓴다는 점을 먼저 말하고, 선물 하나 준 사람은 관대하지 않다는 논리를 덧붙입니다. 한 번의 행동만으로는 인품을 평가할 수 없다는 뜻이죠. 이는 미덕이 단순한 충동과 다르다는 다음 문장으로 이어집니다.","hl":"mn"},{"n":36,"text":"첫 번째 어법 포인트는 When we praise someone's character에서 when이 이끄는 시간 부사절입니다. when은 언제라는 뜻으로 뒤에 주어 동사가 오는 절을 이끌고, 문장 전체의 시간 배경을 나타내요. 두 번째 어법 포인트는 A person who gives one gift에서 관계대명사 who입니다. who는 앞의 a person을 수식하면서 gives의 주어 역할을 하는 주격 관계대명사예요. 해석은 선물을 하나 주는 사람처럼 앞에서 뒤로 걸어 읽으면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에,\u003c/span>\u003cspan class=\"en\">Instead,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관대함은 안정된 일부이다\u003c/span>\u003cspan class=\"en\">generosity is a stable part\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가의 ‘도덕적 정체성’의\u003c/span>\u003cspan class=\"en\">of a person's 'moral identity',\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정서적 습관인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">emotional \u003c/span>\u003cspan class=\"tgt\">habit\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 모습의 일부인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신에, 관대함은 누군가의 ‘도덕적 정체성’의 안정된 일부인데 그것은 여러분의 모습의 일부인 정서적 습관이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 관대함이 단순한 행동이 아니라 사람의 도덕적 정체성에 자리 잡은 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">습관\u003c/b>임을 정의한다. an emotional habit는 앞의 ‘moral identity’를 다시 설명하는 동격이며, who you are는 그 사람의 \u003cb class=\"key\">정체성\u003c/b> 자체를 가리킨다. 따라서 즉각적인 미덕이 불가능하다는 다음 문장의 논거를 제공한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격 (apposition)\u003c/span> : [a person's 'moral identity'] + [an emotional habit] : \"정서적 습관인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 (that)\u003c/span> : 선행사 [an emotional habit] + [that + 동사(is) ~] : \"여러분의 모습의 일부인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문 (명사절)\u003c/span> : 전치사 [of] + [who + 주어 + 동사] : \"여러분이 어떤 사람인지\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Instead, 대신에. generosity is a stable part, 관대함은 안정된 일부이다. of a person's 'moral identity', 누군가의 ‘도덕적 정체성’의. an emotional habit, 정서적 습관인. that is part of who you are, 여러분의 모습의 일부인. 이 문장 전체를 해석하면, 대신에, 관대함은 누군가의 ‘도덕적 정체성’의 안정된 일부인데 그것은 여러분의 모습의 일부인 정서적 습관이다.","hl":"m"},{"n":38,"text":"이 문장은 관대함이 그 사람의 도덕적 정체성에 자리 잡은 안정된 정서적 습관이라고 정의해 줍니다. an emotional habit는 앞의 도덕적 정체성을 다시 설명하는 동격 표현이고, who you are는 그 사람의 정체성 자체를 가리켜요. 따라서 알약 하나로 즉각적인 미덕을 가질 수 없다는 주장의 핵심 근거가 됩니다.","hl":"mn"},{"n":39,"text":"첫 번째 어법 포인트는 an emotional habit이 동격 표현이라는 점입니다. 콤마 뒤에서 앞에 나온 도덕적 정체성을 정서적 습관이라고 다시 설명해 주고 있어요. 두 번째 포인트는 that is part of who you are에서 관계대명사 that이 앞의 an emotional habit을 수식한다는 것이에요. that이 is의 주어 역할을 하므로 주격 관계대명사입니다. 세 번째 포인트는 who you are가 간접의문문 명사절이라는 점이에요. 전치사 of의 목적어 자리에 쓰였고, 의문문이 아니라서 어순이 who you are로 유지됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서 미덕은,\u003c/span>\u003cspan class=\"en\">Thus virtues,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비전형적인 충동과는 달리,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">opposed \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">nontypical \u003c/span>\u003cspan class=\"tgt\">impulse\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분 개인 역사의 결과이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">result \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> your personal history.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 미덕은, 비전형적인 충동과는 달리, 여러분 개인 역사의 결과이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 미덕이 개인의 정체성에 안정적으로 자리 잡은 감정적 습관이라고 말한 내용을 정리한다. 이 문장은 \u003cb class=\"key\">비전형적인 \u003c/b>\u003cb class=\"key\">충동\u003c/b>과 달리 미덕은 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">역사\u003c/b>의 산물임을 대조해 보여 준다. 곧 미덕은 하루아침에 생기지 않는다는 논거가 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">as opposed to 전치사구\u003c/span> : as opposed to + [명사구] : \"비전형적인 충동과는 달리\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장(주격 보어)\u003c/span> : [주어] + [be동사] + [명사구 보어] : \"~의 결과이다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Thus virtues, 따라서 미덕은. as opposed to nontypical impulse, 비전형적인 충동과는 달리. are the result of your personal history, 여러분 개인 역사의 결과이다.. 이 문장 전체를 해석하면, 따라서 미덕은, 비전형적인 충동과는 달리, 여러분 개인 역사의 결과이다.","hl":"m"},{"n":41,"text":"미덕은 비전형적인 충동과 달리 여러분 개인 역사의 결과라는 문장이에요. 즉, 미덕은 순간적인 충동이 아니라 오랜 시간 동안 쌓인 개인의 경험이 만든 성품이라는 뜻이죠. 그래서 미덕이 하루아침에 생기지 않는다는 논거가 됩니다.","hl":"mn"},{"n":42,"text":"첫 번째 포인트는 as opposed to nontypical impulse입니다. as opposed to는 전치사구로, '~와는 달리'라는 뜻이에요. 여기서는 미덕과 비전형적인 충동을 대조해 주고 있습니다. 두 번째 포인트는 are the result of입니다. 주어가 복수인 virtues라서 be동사 are를 썼고, 뒤에 명사구 보어인 the result of your personal history가 와서 여러분 개인 역사의 결과라는 상태를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 여러분이 누구인지의 일부이다,\u003c/span>\u003cspan class=\"en\">They are part of \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 일부이기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">part \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 인품이 형성되었던 방식의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">character \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">formed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들이 여러분의 인품이 형성되었던 방식의 일부이기 때문에 그것들은 여러분의 모습 중 일부이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미덕이 왜 그 사람 자신의 일부인지를 설명한다. 성품이 형성되어 온 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">역사\u003c/b>의 산물이기 때문에 지금의 '자신'을 이루는 요소라는 논리다. 이는 앞 문장의 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">역사\u003c/b>를 정체성과 연결한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 who가 이끄는 명사절\u003c/span> : of + [who you are (명사절)] : \"여러분이 누구인지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 as(이유)와 의문사 how 명사절\u003c/span> : [주절] + as + [이유절] : \"그것들이 여러분의 인품이 형성되었던 방식의 일부이기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"They are part of who you are, 그것들은 여러분이 누구인지의 일부이다. as they are part, 그것들이 일부이기 때문에. of how your character was formed, 여러분의 인품이 형성되었던 방식의. 이 문장 전체를 해석하면, 그것들이 여러분의 인품이 형성되었던 방식의 일부이기 때문에 그것들은 여러분의 모습 중 일부이다.","hl":"m"},{"n":44,"text":"미덕이 왜 그 사람 자신의 일부인지를 설명하는 문장이에요. 성품이 형성되어 온 개인 역사의 산물이기 때문에 지금의 자신을 이루는 요소라는 논리죠. 앞 문장에서 말한 개인 역사를 정체성과 연결해 주고 있습니다.","hl":"mn"},{"n":45,"text":"첫 번째 포인트는 who you are입니다. 전치사 of의 목적어로 쓰인 명사절이고, 여러분이 누구인지라는 뜻이에요. 두 번째 포인트는 as they are part of how your character was formed입니다. 여기서 as는 '~때문에'라는 이유의 접속사이고, how your character was formed는 수동태가 포함된 명사절이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉각적인 미덕은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Instant \u003c/span>\u003cspan class=\"tgt\">virtue \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로 있을 수 없다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">therefore \u003c/span>\u003cspan class=\"tgt\">impossible\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 즉각적인 미덕은 있을 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 논의를 한 문장으로 결론 내린다. \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">미덕\u003c/b>은 불가능하며, 다음 문장의 '약 한 알' 비유로 이어진다. 이 지문의 핵심 주장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(주격 보어)\u003c/span> : [주어] + [be동사] + [보어] : \"즉각적인 미덕은 불가능하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속부사 therefore\u003c/span> : [앞 문장] + therefore + [결론] : \"그러므로\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"Instant virtue, 즉각적인 미덕은. is therefore impossible, 그러므로 있을 수 없다.. 이 문장 전체를 해석하면, 그러므로 즉각적인 미덕은 있을 수 없다.","hl":"m"},{"n":47,"text":"앞선 논의를 한 문장으로 결론 내리는 문장이에요. 즉각적인 미덕은 불가능하다는 뜻이고, 다음 문장의 약 한 알 비유로 이어집니다. 이 문장이 이 지문의 핵심 주장입니다.","hl":"mn"},{"n":48,"text":"첫 번째 포인트는 Instant virtue is impossible 구조입니다. be동사 뒤에 보어 impossible이 와서 주어의 상태를 설명하는 2형식 문장이에요. 두 번째 포인트는 therefore입니다. 접속부사로 앞 문장과의 논리적 결론을 이어주며 그러므로라는 뜻입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 한 알을 먹는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Popping \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">pill\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들 수 없어요\u003c/span>\u003cspan class=\"en\">cannot \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 나은 사람으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">person\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">약 한 알을 먹는 것이 여러분을 더 나은 사람으로 만들 수는 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">미덕은 \u003c/b>\u003cb class=\"key\">있을 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없다\u003c/b>는 주장을 \u003cb class=\"key\">알약 \u003c/b>\u003cb class=\"key\">복용\u003c/b>이라는 구체적 예시로 뒷받침하는 결론입니다. 약을 먹어서 일시적 변화가 있을 수는 있지만, 미덕은 오랜 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">정체성\u003c/b> 형성 없이는 만들어지지 않는다는 글 전체의 핵심을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : Popping a pill + cannot make ... : \"약 한 알을 먹는 것이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make + 목적어 + 명사 보어 (5형식)\u003c/span> : make + [you (목적어)] + [a better person (명사 보어)] : \"여러분을 더 나은 사람으로 만들다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"Popping a pill, 약 한 알을 먹는 것이. cannot make, 만들 수 없어요. you, 여러분을. a better person, 더 나은 사람으로.. 이 문장 전체를 해석하면, 약 한 알을 먹는 것이 여러분을 더 나은 사람으로 만들 수는 없다.","hl":"m"},{"n":50,"text":"바로 앞 문장에서 말한 즉각적인 미덕은 있을 수 없다는 주장을 알약 복용이라는 구체적 예시로 뒷받침하는 결론이에요. 약을 먹어서 잠깐 달라질 수는 있어도, 진짜 미덕은 도덕적 정체성이 오랜 시간에 걸쳐 형성되어야 생긴다는 걸 강조하고 있습니다.","hl":"mn"},{"n":51,"text":"첫 번째 포인트는 Popping a pill이 동명사구 주어로 쓰인 거예요. 동명사구가 주어 자리에 오면 단수 취급을 받는다는 점을 기억해 두세요. 여기서는 cannot이라는 조동사 뒤라서 동사원형 make가 오는 구조였어요. 두 번째 포인트는 make you a better person인데, make가 목적어 you와 목적격 보어 a better person을 취하는 오형식 구조입니다. you와 a better person은 의미상 여러분이 더 나은 사람이 되는 관계이므로, make는 여러분을 더 나은 사람으로 만든다는 뜻을 나타냅니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>약을 먹고 선물을 주는 행동은 \u003cb class=\"key\">칭찬할 \u003c/b>\u003cb class=\"key\">만한 \u003c/b>\u003cb class=\"key\">점\u003c/b>이 있지만, \u003cb class=\"key\">마음의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 완전히 만족스럽지는 않다.\u003c/li>\u003cli>관대함은 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>의 안정된 일부이며, \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">습관\u003c/b>이다.\u003c/li>\u003cli>미덕은 \u003cb class=\"key\">비전형적인 \u003c/b>\u003cb class=\"key\">충동\u003c/b>과 달리 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">역사\u003c/b>의 결과이며, 인품 형성 과정의 일부이다.\u003c/li>\u003cli>그러므로 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">미덕\u003c/b>은 불가능하고, 약 한 알로 더 나은 사람이 될 수 없다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>True virtue is a stable moral habit formed through personal history, so instant virtue from a pill is impossible.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">약을 먹고 생긴 \u003cb class=\"key\">일회적 \u003c/b>\u003cb class=\"key\">관대함\u003c/b>은 칭찬할 만해도 \u003cb class=\"key\">진정한 \u003c/b>\u003cb class=\"key\">관대함\u003c/b>이 아니다. 미덕은 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>에 자리한 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">습관\u003c/b>으로 \u003cb class=\"key\">개인 \u003c/b>\u003cb class=\"key\">역사\u003c/b>의 결과이므로 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">미덕\u003c/b>은 불가능하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 핵심을 정리하면, 관대함은 한 번의 행동이 아니라 도덕적 정체성에 자리한 정서적 습관입니다. 미덕은 개인 역사의 결과이기 때문에 즉각적인 미덕은 불가능해요. 약 한 알로 더 나은 사람이 될 수는 없습니다. 오늘 수업 여기까지입니다.","hl":null}]}]});</script></body></html>
