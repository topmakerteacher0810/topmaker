t+OmmvTz77ProL0A/lxwe/Az/AE/Sjp79/wAfofXHQ+3ameYnTcCTzwQcD1PsPX9TTiwXHPUjHPPP09O3f3NJ/wBf8N/VtWULjv7f1xR17/hyCfpj04z+VJvUjIIIyenrnnjr9cdse1BKnuP++uf0xwf89KaS2vZd9yW7bp3fZ36Lpp+X3XFPbk/T3P8A+rn2zkUjEAMfQZx3x+OffGf503eoYEuo4yPmHbvjOD+OO2M0jtkMAAcg4wQwHpuGMdSDj0BOMDjWKpwtrpbVt8ztpd3S/wA38jP35aO9u+i/S3Z9fTQ//9k=\" alt=\"\"></div>","<div class=\"lec-cover-title\">Meetings in Flexible-Time Cultures: Growing Like a Tree<small>유연한 시간 문화권의 회의: 나무처럼 자라나다</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 더 깊이 이해하기 위해서는 미국의 인류학자 에드워드 홀(Edward T. Hall)이 연구한 시간관에 대한 문화적 차이(Cultural differences in time orientation)라는 개념을 미리 알아두시면 좋습니다. 홀의 이론에 따르면 서구 비즈니스 환경은 보통 시간을 일직선으로 보고 엄격한 계획을 중시하는 단일 시간관(Monochronic time)을 갖는 반면, 남미나 중동 등은 사람과의 관계나 상황 변화를 우선시하는 다원적 시간관(Polychronic time), 즉 지문에 등장하는 유연한 시간 문화(Flexible-time culture)를 띠는 경향이 있습니다. 이를 우리의 일상에 비유하자면, 친구들과 여행할 때 엑셀로 분 단위 일정을 짜서 움직이는 것이 단일 시간관이라면, &quot;일단 출발하자!&quot;라고 나선 뒤 길을 가다 예쁜 카페가 보이면 즉흥적으로 일정을 바꾸는 것이 바로 다원적 시간관이라고 할 수 있죠. 이러한 문화권에서는 사전에 정해진 안건(Agenda)을 딱딱하게 지키는 것보다 그때그때 발생한 긴급한 요구나 흐름에 유연하게 대처하는 것을 훨씬 더 생산적(Productive)이라고 여깁니다. 이러한 인류학적 배경지식을 바탕으로 지문을 읽어보시면, 왜 이들의 회의 방식이 정해진 선을 따라가는 것이 아니라 예측할 수 없이 자유롭게 가지를 뻗어 나가는 한 그루의 나무에 비유되었는지 그 숨은 맥락을 아주 재미있고 쉽게 이해하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01유연한 시간 문화의 회의</div><ul><li>유연한 시간 문화권에서의 회의는 상록수의 형태와 유사한 특징을 띤다.</li><li>남미, 유럽 일부 등 유연한 시간 문화(flexible-time culture)의 회의 방식</li><li>회의의 진행 과정을 상록수(evergreen tree)에 비유하여 설명함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02안건의 역할과 비선형적 진행</div><ul><li>미리 공유된 안건은 나무의 기둥 역할을 하지만, 회의가 일직선으로 진행되지는 않는다.</li><li>회의 시작 전 공유되는 안건(agenda)은 나무의 기둥(trunk) 역할을 함</li><li>회의가 선형적인 방식(linear manner)으로 진행될 것이라 기대하지 않음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03논의의 확장과 가지뻗기</div><ul><li>우선순위의 변화나 갑작스러운 상황에 따라 논의가 새로운 방향으로 뻗어 나간다.</li><li>현재 시점의 우선순위(priority)에 맞춰 논의가 새로운 방향으로 가지를 뻗음(branch off)</li><li>긴급한 통화, 소그룹 형성 등 다양한 요인으로 새로운 가지(branches)가 생겨남</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04성공적인 회의와 관리자의 태도</div><ul><li>이러한 문화권에서는 예측 불가능하게 전개되는 회의가 가장 생산적이라고 여겨진다.</li><li>생산적인 회의(productive meetings)는 예측 불가능한 방식으로 성장함</li><li>유능한 관리자는 변화하는 요구에 유연하게 대처하여 활용함(capitalize on)</li><li>방해나 방향 전환을 자연스럽고 필수적인(natural and necessary) 과정으로 인식함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">agenda</td><td class=\"m\">안건, 의제</td></tr><tr><td class=\"w\">circulate</td><td class=\"m\">배포하다, 돌리다, 순환하다</td></tr><tr><td class=\"w\">serve as</td><td class=\"m\">~의 역할을 하다, ~로 쓰이다</td></tr><tr><td class=\"w\">progress</td><td class=\"m\">진행되다, 진척되다, 발전하다</td></tr><tr><td class=\"w\">linear</td><td class=\"m\">직선적인, 순차적인</td></tr><tr><td class=\"w\">priority</td><td class=\"m\">우선순위, 우선권</td></tr><tr><td class=\"w\">craft</td><td class=\"m\">공들여 만들다, 제작하다</td></tr><tr><td class=\"w\">not necessarily</td><td class=\"m\">반드시 ~인 것은 아닌</td></tr><tr><td class=\"w\">branch off</td><td class=\"m\">(이야기 등이) 갈라지다, 샛길로 빠지다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sprout</td><td class=\"m\">생겨나다, 싹이 트다</td></tr><tr><td class=\"w\">urgent</td><td class=\"m\">긴급한, 다급한</td></tr><tr><td class=\"w\">timely</td><td class=\"m\">시기적절한, 때맞춘</td></tr><tr><td class=\"w\">unpredictable</td><td class=\"m\">예측할 수 없는, 종잡을 수 없는</td></tr><tr><td class=\"w\">capitalize on</td><td class=\"m\">~을 이용하다, ~을 기회로 삼다</td></tr><tr><td class=\"w\">arise</td><td class=\"m\">발생하다, 생겨나다</td></tr><tr><td class=\"w\">interruption</td><td class=\"m\">중단, 방해</td></tr><tr><td class=\"w\">frequent</td><td class=\"m\">잦은, 빈번한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">유연한 시간 문화에서의 회의는</span><span class=\"en\"><b>A meeting in a flexible-time culture</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">남미, 유럽의 일부 지역, 아프리카, 그리고 중동에서 발견되는 것들과 같은</span><span class=\"en\"><b>like <span class=\"grammar-hl\">those found</span> in South America, parts of Europe, Africa, and the Middle East</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상록수와 더 비슷하다</span><span class=\"en\"><b>is more like an evergreen tree.</b></span></div></div><div class=\"lec-sent-ko\">남미, 유럽의 일부 지역, 아프리카, 그리고 중동에서 발견되는 것들과 같은 유연한 시간 문화에서의 회의는 상록수와 더 비슷하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서 특정 문화권의 회의 방식을 나무에 비유하여 설명하기 시작합니다. 시간관념이 덜 엄격한 문화권에서는 정해진 틀에 얽매이지 않고 자연스럽게 뻗어나가는 상록수처럼 회의가 진행된다는 핵심 비유를 제시합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">those found (과거분사(형용사)): found가 대명사 those를 뒤에서 수식(= N + p.p.). &#39;p.p.된 N&#39;(= 발견되는 것들)의 의미를 나타내며, 명사와 분사 사이에 주격 관계대명사와 be동사가 축약된 형태의 수식 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">회의 시작 시간과 주제가 있는 의제가</span><span class=\"en\"><b>An agenda with a meeting start time and a topic</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아마도 배부될 것이다</span><span class=\"en\"><b><span class=\"grammar-hl\">will probably be circulated</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">회의 전에</span><span class=\"en\"><b>before the meeting.</b></span></div></div><div class=\"lec-sent-ko\">회의 시작 시간과 주제가 있는 하나의 의제가 아마도 회의 전에 배부될 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 상록수 비유를 구체화하는 첫 단계입니다. 본격적인 회의를 하기 위해 기본적인 뼈대가 되는 시작 시간과 주요 안건을 참가자들에게 미리 전달하는 일반적인 절차를 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">will probably be circulated (수동태): be동사(be) + p.p.(circulated) 구조. circulate는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 be circulated 형태로 쓴다. 기본구조: circulate + O (O를 배포하다/돌리다).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">agenda</td><td class=\"m\">안건, 의제</td></tr><tr><td class=\"w\">circulate</td><td class=\"m\">배포하다, 돌리다, 순환하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이것은 역할을 하게 된다</span><span class=\"en\"><b>This will <span class=\"grammar-hl\">serve</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나무의 줄기</span><span class=\"en\"><b><span class=\"grammar-hl\">as</span> the trunk of the tree.</b></span></div></div><div class=\"lec-sent-ko\">이것은 나무의 줄기 역할을 하게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 기본 안건이 상록수 비유 안에서 어떤 기능을 하는지 짚어줍니다. 미리 공유된 안건이 전체 회의가 흔들리지 않도록 중심을 잡아주는 굵은 기둥이 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">serve as (관용표현): serve as 구조로 뒤에 명사나 명사구를 취하여 &#39;~의 역할을 하다&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">serve as</td><td class=\"m\">~의 역할을 하다, ~로 쓰이다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 예상은 없다</span><span class=\"en\"><b>But there's no <span class=\"grammar-hl\">expectation</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">회의가 진행될 것이라는</span><span class=\"en\"><b><span class=\"grammar-hl\">that the meeting will progress</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선형적인 방식으로</span><span class=\"en\"><b><span class=\"grammar-hl\">in a linear manner</span>.</b></span></div></div><div class=\"lec-sent-ko\">하지만 회의가 선형적인 방식으로 진행될 것이라고 예상할 수 없다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 내용에서 흐름을 뒤집어 유연한 시간 문화의 진짜 특징을 드러냅니다. progress in a linear manner는 정해진 안건의 순서대로 차근차근 직진하듯 진행된다는 의미입니다. 중심 기둥(안건)이 있다고 해서 사람들이 반드시 그 차례대로만 회의를 이어갈 것으로 생각하지 않는다는 점을 알려줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">expectation that the meeting will progress in a linear manner 동격의 that: 명사(expectation) + that + S(the meeting) + V(will progress) 구조로, 뒤 that절이 앞 명사의 내용(…라는 기대)을 구체화하고 설명하는 동격의 that이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">progress</td><td class=\"m\">진행되다, 진척되다, 발전하다</td></tr><tr><td class=\"w\">linear</td><td class=\"m\">직선적인, 순차적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">지난주에 우선순위처럼 보였던 것이</span><span class=\"en\"><b><span class=\"grammar-hl\">What seemed</span> like a priority <span class=\"grammar-hl\">last week</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의제가 작성되었을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">when the agenda was crafted</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">지금 당장 반드시 우선순위인 것은 아니다</span><span class=\"en\"><b>is not necessarily the priority right now</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">― 그래서 논의는 가지를 뻗어 나갈 수 있다</span><span class=\"en\"><b>― so discussion may <span class=\"grammar-hl\">branch off</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">새로운 방향으로</span><span class=\"en\"><b>in a new direction.</b></span></div></div><div class=\"lec-sent-ko\">의제가 작성되었던 지난주에 우선순위처럼 보였던 것이 지금 당장 반드시 우선순위는 아니다. 그래서 논의는 새로운 방향으로 가지를 뻗어 나갈 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 회의가 왜 순서대로 진행되지 않는지 그 구체적인 이유를 설명합니다. branch off in a new direction을 &#39;새로운 방향으로 가지를 뻗다&#39;라고 옮기면 비유적이라 낯설 수 있습니다. 쉽게 말해 상황이 변함에 따라 미리 정해둔 안건에 얽매이지 않고 그때그때 더 중요한 새로운 화제로 자유롭게 넘어가는 모습을 보여 주는 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">What seemed (관계대명사): what이 이끄는 관계대명사절로 선행사를 자체적으로 포함하며, 문장 전체에서 주어 역할을 하는 명사절을 이끈다.</div><div class=\"lec-gr-item\">last week when the agenda was crafted (관계부사): 관계부사 when이 이끄는 절(when + S + V)이 완전한 형태의 문장을 취하여 앞의 시간 선행사(last week)를 수식하는 구조이다.</div><div class=\"lec-gr-item\">was crafted (수동태): be동사(was) + p.p.(crafted) 구조. craft는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 was crafted 형태로 쓴다. 기본구조: craft + O (O를 공들여 만들다/작성하다).</div><div class=\"lec-gr-item\">branch off (관용표현): branch off 구조로 &#39;(새로운 방향으로) 갈라지다&#39; 또는 &#39;나뉘다&#39;라는 의미를 나타내는 동사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">agenda</td><td class=\"m\">안건, 의제</td></tr><tr><td class=\"w\">priority</td><td class=\"m\">우선순위, 우선권</td></tr><tr><td class=\"w\">craft</td><td class=\"m\">공들여 만들다, 제작하다</td></tr><tr><td class=\"w\">not necessarily</td><td class=\"m\">반드시 ~인 것은 아닌</td></tr><tr><td class=\"w\">branch off</td><td class=\"m\">(이야기 등이) 갈라지다, 샛길로 빠지다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또 다른 가지들이 싹틀 수도 있다</span><span class=\"en\"><b>Other branches may sprout</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일부 구성원이 긴급한 전화를 받음에 따라</span><span class=\"en\"><b>as some members have urgent phone <span class=\"grammar-hl\">calls</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들을 회의를 들락날락하게 만드는</span><span class=\"en\"><b><span class=\"grammar-hl\">that take them in and out of the meeting</span>.</b></span></div></div><div class=\"lec-sent-ko\">일부 구성원이 회의를 들락날락하게 만드는 긴급한 전화를 받음에 따라 또 다른 가지들이 싹틀 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 곁가지가 뻗어 나가는 또 다른 예시를 듭니다. 엄격한 문화에서는 예의에 어긋난다고 여겨질 수 있는 행동(전화를 받기 위해 자리를 뜨는 것)조차 유연한 문화에서는 자연스럽게 발생하며, 이로 인해 원래 안건과는 무관한 또 다른 논의가 생겨남을 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">calls that take them in and out of the meeting (관계대명사): that이 주격 관계대명사로 쓰여 앞의 선행사(urgent phone calls)를 수식하며, 절 내부에서 that이 주어 역할을 한다(= 빠진 자리 존재).</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sprout</td><td class=\"m\">생겨나다, 싹이 트다</td></tr><tr><td class=\"w\">urgent</td><td class=\"m\">긴급한, 다급한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">또는 소그룹이 형성될 수도 있다</span><span class=\"en\"><b>Or sub-groups may form</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">회의실 내에서</span><span class=\"en\"><b>within the room</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시의적절한 주제를 논의하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to discuss</span> timely <span class=\"grammar-hl\">subjects</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 방식으로든 주요한 회의 줄기와 연결된</span><span class=\"en\"><b><span class=\"grammar-hl\">linked in some way to the main meeting trunk</span>.</b></span></div></div><div class=\"lec-sent-ko\">또는 회의실 내에서 소그룹이 형성되어 주요한 회의 줄기와 어떤 방식으로든 연결된 시의적절한 주제를 논의할 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 곁가지가 생기는 세 번째 상황을 추가로 제시합니다. 참석자 전원이 하나에 집중하는 것이 아니라, 큰 틀과 관련이 있다면 몇몇 사람끼리 삼삼오오 모여 지금 당장 필요한 세부 논의를 자유롭게 펼친다는 점을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to discuss (to부정사): 부사적 용법으로 쓰여 동사(form)의 목적(&#39;~하기 위해&#39;)을 나타내는 구조이다.</div><div class=\"lec-gr-item\">subjects linked in some way to the main meeting trunk (과거분사(형용사)): linked가 앞의 명사 subjects를 수식(= N + p.p.). &#39;p.p.된 N&#39;(= 연결된 주제들)의 의미로 명사를 뒤에서 수식하는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">timely</td><td class=\"m\">시기적절한, 때맞춘</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">유연한 시간 문화에서,</span><span class=\"en\"><b>In flexible-time cultures,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">명확해 보인다</span><span class=\"en\"><b><span class=\"grammar-hl\">it seems clear</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 생산적인 회의는 성장하며</span><span class=\"en\"><b><span class=\"grammar-hl\">that the most productive meetings grow</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예측 불가능한 방식으로,</span><span class=\"en\"><b><span class=\"grammar-hl\">in unpredictable ways</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 유능한 관리자는 충분히 유연하고 전문적이라는 것이</span><span class=\"en\"><b>and the effective manager is flexible and professional <span class=\"grammar-hl\">enough</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우선순위와 변화하는 요구사항을 활용할 수 있을 만큼</span><span class=\"en\"><b><span class=\"grammar-hl\">to capitalize on</span> priorities and <span class=\"grammar-hl\">changing needs</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들이 발생할 때</span><span class=\"en\"><b>as they arise.</b></span></div></div><div class=\"lec-sent-ko\">유연한 시간 문화에서, 가장 생산적인 회의는 예측 불가능한 방식으로 성장하며, 유능한 관리자는 우선순위와 변화하는 요구사항이 발생할 때 이를 활용할 수 있을 만큼 충분히 유연하고 전문적이라는 것이 명확해 보인다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지의 예시를 종합하여 글의 결론을 내립니다. capitalize on — 글쓴이는 여기서 힘주어 말합니다. 예상치 못한 상황 변화를 그저 수용하는 데 그치지 않고, 오히려 그것을 긍정적인 기회로 삼아 회의의 성과를 한껏 끌어올리는 것이 능력을 갖춘 관리자의 진짜 모습이라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it seems clear that the most productive meetings grow in unpredictable ways (가주어): 진주어: it이 가주어이고, that이 이끄는 명사절(that the most productive meetings ...)이 진주어로 쓰인 구조이다.</div><div class=\"lec-gr-item\">enough to capitalize on (to부정사): 형용사(flexible and professional) 뒤에서 &#39;enough to V&#39; 구조를 이루어, &#39;~할 만큼 충분히 ...하다&#39;라는 정도나 기준을 나타내는 부사적 역할이다.</div><div class=\"lec-gr-item\">capitalize on (관용표현): capitalize on + 명사 형태로 &#39;~을 활용하다/이용하다&#39;라는 의미의 숙어 구조이다.</div><div class=\"lec-gr-item\">changing needs (현재분사(형용사)): changing이 명사 needs를 수식(= -ing + N). &#39;변화하는 요구&#39;처럼 동작이나 상태를 나타내며 수식하는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">unpredictable</td><td class=\"m\">예측할 수 없는, 종잡을 수 없는</td></tr><tr><td class=\"w\">capitalize on</td><td class=\"m\">~을 이용하다, ~을 기회로 삼다</td></tr><tr><td class=\"w\">arise</td><td class=\"m\">발생하다, 생겨나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">방해, 의제 변경과 빈번한 방향 전환은</span><span class=\"en\"><b>Interruptions, agenda changes, and frequent shifts in direction</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자연스럽고 필수적인 것으로 간주된다.</span><span class=\"en\"><b><span class=\"grammar-hl\">are seen as</span> natural and necessary.</b></span></div></div><div class=\"lec-sent-ko\">방해, 의제 변경과 빈번한 방향 전환은 자연스럽고 필수적인 것으로 간주된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞의 결론을 다시 한번 짤막하게 요약하며 글을 맺습니다. 비즈니스 관련 글에서 frequent shifts in direction은 처음에 계획했던 의제에서 벗어나 논의의 흐름이 수시로 바뀌는 현상을 가리킵니다. 다른 문화권에서는 회의를 망치는 요인으로 여겨질 법한 산만한 상황들이 이 문화권에서는 유연하고 풍성한 결과를 얻기 위해 당연히 거쳐야 할 과정으로 인정받음을 짚어 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are seen as (수동태): be동사(are) + p.p.(seen) 구조. see는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are seen 형태로 쓴다. 기본구조: see + O + as + B (O를 B로 간주하다)에서 목적어(O)가 주어로 올라가 수동태가 되고 뒤의 as B는 구조가 남는다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">agenda</td><td class=\"m\">안건, 의제</td></tr><tr><td class=\"w\">interruption</td><td class=\"m\">중단, 방해</td></tr><tr><td class=\"w\">frequent</td><td class=\"m\">잦은, 빈번한</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>유연한 시간 관념을 가진 문화권의 회의는 중심 안건을 바탕으로 자유롭게 논의를 뻗어 나가는 상록수와 같다.</li><li>이런 문화에서는 정해진 순서대로 회의가 진행되지 않으며, 상황 변화나 참석자의 사정에 따라 방향이 수시로 바뀐다.</li><li>논의의 잦은 전환과 끼어들기 등은 방해가 아니라 오히려 생산성을 높이는 자연스럽고 필수적인 요소로 여겨진다.</li><li>따라서 훌륭한 관리자는 이러한 예측 불가능한 변화를 억누르지 않고 회의의 성과를 높이는 기회로 잘 활용할 줄 알아야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Meetings in flexible-time cultures progress unpredictably beyond the initial agenda, so managers must adapt flexibly to changing needs.</div>\n              <div class=\"lec-final-sum-ko\">유연한 시간 문화권의 회의는 초기 안건을 넘어 예측 불가능하게 진행되므로, 관리자는 변화하는 필요에 유연하게 적응해야 한다.</div></div></div>"],"segs":[[{"audio":"./21_audio/1.mp3","hl":null}],[{"audio":"./21_audio/2.mp3","hl":null}],[{"audio":"./21_audio/3.mp3","hl":null},{"audio":"./21_audio/4.mp3","hl":"stage-0"},{"audio":"./21_audio/5.mp3","hl":"stage-1"},{"audio":"./21_audio/6.mp3","hl":"stage-2"},{"audio":"./21_audio/7.mp3","hl":"stage-3"}],[{"audio":"./21_audio/8.mp3","hl":null}],[{"audio":"./21_audio/9.mp3","hl":"main"},{"audio":"./21_audio/10.mp3","hl":"meaning"},{"audio":"./21_audio/11.mp3","hl":"grammar"}],[{"audio":"./21_audio/12.mp3","hl":"main"},{"audio":"./21_audio/13.mp3","hl":"meaning"},{"audio":"./21_audio/14.mp3","hl":"grammar"}],[{"audio":"./21_audio/15.mp3","hl":"main"},{"audio":"./21_audio/16.mp3","hl":"meaning"},{"audio":"./21_audio/17.mp3","hl":"grammar"}],[{"audio":"./21_audio/18.mp3","hl":"main"},{"audio":"./21_audio/19.mp3","hl":"meaning"},{"audio":"./21_audio/20.mp3","hl":"grammar"}],[{"audio":"./21_audio/21.mp3","hl":"main"},{"audio":"./21_audio/22.mp3","hl":"meaning"},{"audio":"./21_audio/23.mp3","hl":"grammar"}],[{"audio":"./21_audio/24.mp3","hl":"main"},{"audio":"./21_audio/25.mp3","hl":"meaning"},{"audio":"./21_audio/26.mp3","hl":"grammar"}],[{"audio":"./21_audio/27.mp3","hl":"main"},{"audio":"./21_audio/28.mp3","hl":"meaning"},{"audio":"./21_audio/29.mp3","hl":"grammar"}],[{"audio":"./21_audio/30.mp3","hl":"main"},{"audio":"./21_audio/31.mp3","hl":"meaning"},{"audio":"./21_audio/32.mp3","hl":"grammar"}],[{"audio":"./21_audio/33.mp3","hl":"main"},{"audio":"./21_audio/34.mp3","hl":"meaning"},{"audio":"./21_audio/35.mp3","hl":"grammar"}],[{"audio":"./21_audio/36.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nod
