</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"2026년 고2 9월 모의고사 21번","audioDir":"21_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">21번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Meetings in Flexible-Time Cultures: Growing Like an Evergreen Tree\u003c/h1>\u003ch2>유연한 시간 문화에서의 회의: 상록수처럼 성장하기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">유연한 \u003c/b>\u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">문화\u003c/b>에서의 회의는 고정된 계획을 따르기보다 상황에 맞춰 \u003cb class=\"key\">비선형적\u003c/b>이고 유동적으로 진행되며, 이를 통해 \u003cb class=\"key\">생산성\u003c/b>을 높입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>In flexible-time cultures, meetings function like living trees where agendas serve as a base, but the actual progress involves unpredictable and natural shifts to address evolving priorities.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 유연한 시간 문화를 가진 나라들의 아주 독특한 회의 방식을 배워볼 거예요. 이들은 회의를 하나의 살아있는 나무에 비유하는데요, 정해진 대로만 움직이지 않는 이들의 생산적인 비결이 무엇인지 요약과 요지를 통해 먼저 살펴봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인류학자 에드워드 홀은 시간을 대하는 태도에 따라 문화를 두 가지로 나누었습니다. 서구권처럼 시간을 엄격히 지키는 \u003cb class=\"key\">선형적 \u003c/b>\u003cb class=\"key\">시간관\u003c/b>(Monochronic)과 남미·중동처럼 여러 일을 동시에 처리하는 \u003cb class=\"key\">다중 \u003c/b>\u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">문화\u003c/b>(Polychronic)가 그것입니다. 이 지문은 후자인 \u003cb class=\"key\">유연한 \u003c/b>\u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">문화\u003c/b>(Flexible-time culture)의 회의 방식을 설명합니다. 이곳에서 시간은 '지켜야 할 규칙'이라기보다 '활용해야 할 자원'에 가깝습니다. 마치 \u003cb class=\"key\">강물\u003c/b>이 지형에 따라 굽이치듯, 이들의 회의도 정해진 의제라는 \u003cb class=\"key\">줄기\u003c/b>를 바탕으로 상황에 따라 자유롭게 \u003cb class=\"key\">가지\u003c/b>를 뻗어 나가는 특성을 보입니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 서구권 사람들은 시간을 선처럼 딱딱 지키는 것을 중요하게 여기죠? 하지만 남미나 중동 같은 곳은 다릅니다. 이들은 다중 시간적 문화를 가지고 있어서, 시간보다는 인간관계나 지금 벌어지는 상황의 맥락을 훨씬 중요하게 생각해요. 마치 정해진 고속도로를 달리는 게 아니라, 주변 풍경에 따라 경로를 바꾸는 숲길 여행과 비슷하다고 이해하면 쉽습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>회의와 나무의 비유\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>유연한 시간 문화에서의 회의를 \u003cb class=\"key\">상록수\u003c/b>에 비유하며 시작합니다. 회의 전 배부되는 \u003cb class=\"key\">의제\u003c/b>는 나무의 \u003cb class=\"key\">줄기\u003c/b> 역할을 하며 중심을 잡아줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>비선형적 진행의 특징\u003csmall>전환 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>회의가 순차적으로 흐를 것이라는 \u003cb class=\"key\">선형적 \u003c/b>\u003cb class=\"key\">기대\u003c/b>를 버려야 함을 강조합니다. 지난주에 정한 \u003cb class=\"key\">우선순위\u003c/b>가 현재는 바뀔 수 있어 논의 방향이 자유롭게 \u003cb class=\"key\">변화\u003c/b>할 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>구체적인 변수와 확장\u003csmall>예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>구성원들이 전화를 받으러 나가는 상황이나 회의실 내 \u003cb class=\"key\">소그룹\u003c/b> 형성 등을 새로운 \u003cb class=\"key\">가지\u003c/b>가 싹트는 과정으로 묘사합니다. 이는 본래의 \u003cb class=\"key\">의제 \u003c/b>\u003cb class=\"key\">줄기\u003c/b>와 연결된 자연스러운 과정입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>유능한 관리자의 자질과 결론\u003csmall>주장 및 결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>예측 불가능한 성장을 수용하는 \u003cb class=\"key\">유연성\u003c/b>이 관리자의 핵심 역량임을 밝힙니다. 갑작스러운 \u003cb class=\"key\">방해\u003c/b>나 방향 전환을 필수적이고 \u003cb class=\"key\">자연스러운\u003c/b> 현상으로 간주하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이 독특한 회의가 나무의 성장과 어떻게 닮았는지 논리적인 흐름을 따라가 볼까요?","hl":null},{"n":4,"text":"먼저 도입부에서는 회의를 상록수에 비유합니다. 회의 시작 전 나눠주는 의제는 나무의 튼튼한 줄기 역할을 하지만, 이건 단지 시작일 뿐이라는 점을 보여줍니다.","hl":"f0"},{"n":5,"text":"다음으로 전환 단계에서는 회의가 직선적으로 흐르지 않는다는 점을 강조합니다. 지난주에 중요했던 일이 지금은 아닐 수 있기 때문에, 논의가 새로운 방향으로 가지를 뻗는 것이 당연하다는 논리죠.","hl":"f1"},{"n":6,"text":"구체적인 예시로 넘어오면, 회의 중에 누군가 전화를 받으러 나가거나 안에서 소그룹이 생기는 상황이 등장합니다. 이런 것들이 회의를 방해하는 게 아니라, 줄기에서 뻗어 나오는 새로운 가지들처럼 묘사됩니다.","hl":"f2"},{"n":7,"text":"마지막 결론에서는 이런 예측 불가능함을 잘 활용하는 것이 관리자의 진짜 실력이라고 말합니다. 중단이나 방향 전환을 자연스럽고 필수적인 요소로 받아들이는 것이 이 문화의 핵심입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비유 및 예시\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">회의를 \u003cb class=\"key\">상록수\u003c/b>에 비유하여 독자의 이해를 돕고 있습니다. 도입부에서 비유를 제시하고, 마지막에 유연한 관리자의 \u003cb class=\"key\">전문성\u003c/b>과 변화의 \u003cb class=\"key\">필연성\u003c/b>을 강조하며 주제를 완성하는 \u003cb class=\"key\">양괄식\u003c/b> 구조를 취합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (4)\u003c/b>\u003cspan>대조 및 전환\u003c/span>\u003cb>so (5)\u003c/b>\u003cspan>인과\u003c/span>\u003cb>Other branches (6)\u003c/b>\u003cspan>추가 예시\u003c/span>\u003cb>Or (7)\u003c/b>\u003cspan>대안적 예시\u003c/span>\u003cb>In flexible-time cultures (8)\u003c/b>\u003cspan>결론 요약\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">evergreen tree\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">trunk of the tree\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">branch off\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Other branches\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sprout\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">grow\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Linear-time culture (implied)\u003c/th>\u003cth>Flexible-time culture\u003c/th>\u003c/tr>\u003ctr>\u003ctd>회의가 정해진 순서대로 진행됨\u003c/td>\u003ctd>회의가 비선형적이고 예측 불가능하게 진행됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>의제를 엄격히 고수함\u003c/td>\u003ctd>상황에 따라 의제와 우선순위가 변함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>방해나 중단을 부정적으로 봄\u003c/td>\u003ctd>방해와 방향 전환을 자연스럽고 필수적으로 봄\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 지문은 회의를 상록수에 빗대어 설명하는 비유의 방식을 사용하고 있습니다. 처음에는 나무의 비유를 제시하고 마지막에 유능한 관리자의 태도를 정리하며 끝맺는 양괄식 구조를 띄고 있어요.","hl":"ty"},{"n":9,"text":"문장 사번에 있는 역접의 연결어 버트를 기점으로 선형적 진행에 대한 기대가 깨집니다. 또한 나무 줄기라는 표현이 가지, 싹트다, 성장하다 같은 단어들과 연결되며 하나의 거대한 비유의 사슬을 만들고 있는 것을 확인할 수 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>flexible-time\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유연한 시간의\u003c/span>\u003c/div>\u003cdiv>\u003cb>evergreen tree\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상록수\u003c/span>\u003c/div>\u003cdiv>\u003cb>agenda\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의제, 안건\u003c/span>\u003c/div>\u003cdiv>\u003cb>circulate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>배부하다, 순환시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>trunk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나무 줄기\u003c/span>\u003c/div>\u003cdiv>\u003cb>expectation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예상, 기대\u003c/span>\u003c/div>\u003cdiv>\u003cb>progress\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진행되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>linear\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>선형적인, 직선의\u003c/span>\u003c/div>\u003cdiv>\u003cb>manner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방식, 태도\u003c/span>\u003c/div>\u003cdiv>\u003cb>priority\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우선순위\u003c/span>\u003c/div>\u003cdiv>\u003cb>craft\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공들여 만들다, 작성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>not necessarily\u003c/b>\u003cem>부사구\u003c/em>\u003cspan>반드시 ~인 것은 아닌\u003c/span>\u003c/div>\u003cdiv>\u003cb>branch off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>가지를 뻗다, 갈라져 나오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sprout\u003c/b>\u003cem>동사\u003c/em>\u003cspan>싹이 트다\u003c/span>\u003c/div>\u003cdiv>\u003cb>urgent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긴급한\u003c/span>\u003c/div>\u003cdiv>\u003cb>sub-group\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소그룹, 하위 집단\u003c/span>\u003c/div>\u003cdiv>\u003cb>timely\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>시의적절한\u003c/span>\u003c/div>\u003cdiv>\u003cb>productive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>생산적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>unpredictable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>예측 불가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>capitalize on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 활용하다, 이용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>arise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interruption\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방해, 중단\u003c/span>\u003c/div>\u003cdiv>\u003cb>shift\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전환, 변화\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어로는 의제를 뜻하는 아젠다, 그리고 활용하다라는 뜻의 숙어 캐피털라이즈 온을 꼭 기억하세요. 또한 선형적이라는 뜻의 리니어는 이 글의 핵심적인 대조 개념입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">flexible\u003c/b>\u003cspan class=\"m\">유연한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adaptable\u003c/span>\u003cspan class=\"s\">pliant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rigid\u003c/span>\u003cspan class=\"a\">stiff\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">linear\u003c/b>\u003cspan class=\"m\">선형적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sequential\u003c/span>\u003cspan class=\"s\">straight\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nonlinear\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">priority\u003c/b>\u003cspan class=\"m\">우선순위\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">precedence\u003c/span>\u003cspan class=\"s\">primary concern\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unpredictable\u003c/b>\u003cspan class=\"m\">예측 불가능한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">erratic\u003c/span>\u003cspan class=\"s\">volatile\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">foreseeable\u003c/span>\u003cspan class=\"a\">predictable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">capitalize on\u003c/b>\u003cspan class=\"m\">활용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">exploit\u003c/span>\u003cspan class=\"s\">take advantage of\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">natural\u003c/b>\u003cspan class=\"m\">자연스러운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">innate\u003c/span>\u003cspan class=\"s\">inherent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">artificial\u003c/span>\u003cspan class=\"a\">unnatural\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"플렉시블은 상황에 잘 적응하는 어댑터블과 동의어이고, 딱딱한 리지드와는 반대말입니다. 예측 불가능하다는 의미의 언프레딕터블은 에라틱이라는 단어로도 바꿔 쓸 수 있으니 함께 정리해 둡시다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유연한 시간 문화에서의 회의는\u003c/span>\u003cspan class=\"en\">A meeting in a flexible-time culture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남미, 유럽의 일부 지역, 아프리카, 그리고 중동에서 발견되는 것들과 같은\u003c/span>\u003cspan class=\"en\">like \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">those\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">found\u003c/span> in South America, parts of Europe, Africa, and the Middle East\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상록수와 더 비슷하다.\u003c/span>\u003cspan class=\"en\">is more like an evergreen tree.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">남미, 유럽의 일부 지역, 아프리카, 그리고 중동에서 발견되는 것들과 같은 유연한 시간 문화에서의 회의는 상록수와 더 비슷하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">유연한 \u003c/b>\u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">문화\u003c/b>의 회의 방식이 \u003cb class=\"key\">상록수\u003c/b>와 같이 유동적이고 생명력 있게 변화한다는 비유를 통해 글의 주제를 도입하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사의 일치\u003c/span> : [복수 명사(cultures)] → [대명사 those] : \"것들(문화들)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : [those (명사구)] + [found (과거분사)] : \"발견되는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"A meeting in a flexible-time culture, 유연한 시간 문화에서의 회의는. like those found in South America, parts of Europe, Africa, and the Middle East, 남미, 유럽의 일부 지역, 아프리카, 그리고 중동에서 발견되는 것들과 같은. is more like an evergreen tree, 상록수와 더 비슷하다.. 이 문장 전체를 해석하면, 남미, 유럽의 일부 지역, 아프리카, 그리고 중동에서 발견되는 것들과 같은 유연한 시간 문화에서의 회의는 상록수와 더 비슷하다.","hl":"m"},{"n":13,"text":"이 글은 시간 개념이 유연한 문화권의 회의 방식을 설명해요. 회의가 딱딱하게 정해진 대로만 흘러가는 게 아니라, 살아있는 상록수처럼 여러 방향으로 뻗어 나간다는 비유를 시작하는 도입부입니다.","hl":"mn"},{"n":14,"text":"첫 번째로 those는 앞에 나온 cultures를 대신하는 대명사예요. 뒤에 나오는 found는 과거분사로, those를 꾸며주며 발견되는이라는 수동의 의미를 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 의제가\u003c/span>\u003cspan class=\"en\">An agenda\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">회의 시작 시간과 주제가 있는\u003c/span>\u003cspan class=\"en\">with a meeting start time and a topic\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 배부될 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">probably \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">circulated\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">회의 전에.\u003c/span>\u003cspan class=\"en\">before the meeting.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">회의 시작 시간과 주제가 있는 하나의 의제가 아마도 회의 전에 배부될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 회의의 기초가 되는 \u003cb class=\"key\">기본 \u003c/b>\u003cb class=\"key\">계획\u003c/b>이 수립되지만, 이것은 절대적인 규칙이 아닌 \u003cb class=\"key\">출발점\u003c/b>에 불과함을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">미래 수동태\u003c/span> : will + be + p.p. (과거분사) : \"배부될 것이다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"An agenda, 하나의 의제가. with a meeting start time and a topic, 회의 시작 시간과 주제가 있는. will probably be circulated, 아마도 배부될 것이다. before the meeting, 회의 전에.. 이 문장 전체를 해석하면, 회의 시작 시간과 주제가 있는 하나의 의제가 아마도 회의 전에 배부될 것이다.","hl":"m"},{"n":16,"text":"회의 전에 시간과 주제가 담긴 의제가 미리 공유된다는 점을 설명해요. 하지만 이 의제는 뒤에 나올 내용처럼 고정된 규칙이 아니라 성장을 위한 기초일 뿐입니다.","hl":"mn"},{"n":17,"text":"동사 부분을 보면 미래 수동태가 쓰였어요. 의제는 스스로 배부하는 게 아니라 사람에 의해 배부되는 대상이기 때문에 수동 표현을 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은\u003c/span>\u003cspan class=\"en\">This\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역할을 하게 된다\u003c/span>\u003cspan class=\"en\">will \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">serve \u003c/span>\u003cspan class=\"tgt\">as\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무의 줄기.\u003c/span>\u003cspan class=\"en\">the trunk of the tree.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 나무의 줄기 역할을 하게 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 \u003cb class=\"key\">의제\u003c/b>를 나무의 \u003cb class=\"key\">줄기\u003c/b>에 비유하여, 회의가 이를 중심으로 나중에 다양한 방향으로 확장될 것임을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사+전치사 구문\u003c/span> : serve [자동사] + as [전치사] + 명사 : \"~의 역할을 하다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"This, 이것은. will serve as, 역할을 하게 된다. the trunk of the tree, 나무의 줄기.. 이 문장 전체를 해석하면, 이것은 나무의 줄기 역할을 하게 된다.","hl":"m"},{"n":19,"text":"여기서 이것은 앞에서 언급한 미리 배부된 의제를 가리켜요. 의제라는 튼튼한 줄기를 바탕으로 회의의 논의가 가지를 뻗듯 확장될 것임을 예고하는 문장입니다.","hl":"mn"},{"n":20,"text":"serve as라는 표현을 기억하세요. 뒤에 역할이 나와서 무엇무엇의 역할을 하다라는 의미로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 예상할 수 없다 \u003c/span>\u003cspan class=\"en\">But there's no expectation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">회의가 진행될 것이라고 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">meeting \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">progress \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선형적인 방식으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">linear \u003c/span>\u003cspan class=\"tgt\">manner\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 회의가 선형적인 방식으로 진행될 것이라고 예상할 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유연한 시간 문화에서는 회의가 정해진 순서대로만 흘러가지 않는다는 \u003cb class=\"key\">비선형성\u003c/b>을 강조하며, 상록수 비유의 \u003cb class=\"key\">유동성\u003c/b>을 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 접속사 that\u003c/span> : expectation [명사] + that [접속사] + [완전한 문장] : \"회의가 선형적인 방식으로 진행될 것이라는 (예상)\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"But there's no expectation, 하지만 예상할 수 없다. that the meeting will progress, 회의가 진행될 것이라고. in a linear manner, 선형적인 방식으로.. 이 문장 전체를 해석하면, 하지만 회의가 선형적인 방식으로 진행될 것이라고 예상할 수 없다.","hl":"m"},{"n":22,"text":"유연한 시간 문화에서는 회의가 1번부터 끝까지 순서대로만 진행될 거라는 비선형성을 강조하고 있어요. 나무가 사방으로 자라듯 회의도 유동적으로 변할 수 있다는 거죠.","hl":"mn"},{"n":23,"text":"여기서 접속사 that은 앞의 명사인 expectation을 보충 설명하는 동격절을 이끌어요. 뒤에 빠진 성분이 없는 완전한 문장이 오는 게 특징입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지난주에 우선순위처럼 보였던 것이 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">seemed \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">priority \u003c/span>\u003cspan class=\"tgt\">last \u003c/span>\u003cspan class=\"tgt\">week\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의제가 작성되었던 당시에 \u003c/span>\u003cspan class=\"en\">when the agenda was crafted\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지금 당장 반드시 우선순위는 아니다 \u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">necessarily\u003c/span> the priority right now\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 논의는 가지를 뻗어 나갈 수 있다 \u003c/span>\u003cspan class=\"en\">― so discussion may branch off\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 방향으로.\u003c/span>\u003cspan class=\"en\">in a new direction.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">의제가 작성되었던 지난주에 우선순위처럼 보였던 것이 지금 당장 반드시 우선순위는 아니다. 그래서 논의는 새로운 방향으로 가지를 뻗어 나갈 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 계획 당시의 우선순위가 현재와 다를 수 있음을 인정하고, \u003cb class=\"key\">상황의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>에 따라 대화의 방향이 \u003cb class=\"key\">자유롭게 \u003c/b>\u003cb class=\"key\">전환\u003c/b>될 수 있음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : What [주어 역할] + seemed [동사] ... : \"지난주에 우선순위처럼 보였던 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부분 부정\u003c/span> : not + necessarily [부사] : \"반드시 ~인 것은 아니다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"What seemed like a priority last week, 지난주에 우선순위처럼 보였던 것이. when the agenda was crafted, 의제가 작성되었던 당시에. is not necessarily the priority right now, 지금 당장 반드시 우선순위는 아니다. ― so discussion may branch off, 그래서 논의는 가지를 뻗어 나갈 수 있다. in a new direction, 새로운 방향으로.. 이 문장 전체를 해석하면, 의제가 작성되었던 지난주에 우선순위처럼 보였던 것이 지금 당장 반드시 우선순위는 아니다. 그래서 논의는 새로운 방향으로 가지를 뻗어 나갈 수 있다.","hl":"m"},{"n":25,"text":"의제를 만들었던 과거의 계획보다 현재의 상황을 더 중요하게 본다는 뜻이에요. 상황이 바뀌면 나무에 새로운 가지가 나듯이 대화 주제도 자유롭게 전환될 수 있다는 설명입니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 관계대명사 what이에요. 선행사를 포함해서 주어 노릇을 하는 명사절을 만들죠. 두 번째로 not necessarily는 전체 부정이 아니라 반드시 그런 건 아니라는 부분 부정을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 가지들이 싹틀 수도 있다 \u003c/span>\u003cspan class=\"en\">Other branches may sprout\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일부 구성원이 긴급한 전화를 받음에 따라 \u003c/span>\u003cspan class=\"en\">as some members have urgent phone calls\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 회의에서 들락날락하게 만드는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">meeting\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일부 구성원이 회의를 들락날락하게 만드는 긴급한 전화를 받음에 따라 또 다른 가지들이 싹틀 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 참석자들의 돌발 행동(전화 등)이 새로운 \u003cb class=\"key\">논의의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>을 만드는 원인이 되며, 이것이 해당 문화권에서는 \u003cb class=\"key\">자연스러운 \u003c/b>\u003cb class=\"key\">현상\u003c/b>임을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : phone calls [선행사] + that [관계대명사/주어] + take [동사] : \"그들을 회의에서 들락날락하게 만드는 (전화)\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Other branches may sprout, 또 다른 가지들이 싹틀 수도 있다. as some members have urgent phone calls, 일부 구성원이 긴급한 전화를 받음에 따라. that take them in and out of the meeting, 그들을 회의에서 들락날락하게 만드는.. 이 문장 전체를 해석하면, 일부 구성원이 회의를 들락날락하게 만드는 긴급한 전화를 받음에 따라 또 다른 가지들이 싹틀 수도 있다.","hl":"m"},{"n":28,"text":"사람들이 전화를 받으러 나갔다 들어오면서 생기는 흐름의 변화가 나무에 새로운 가지가 돋는 것과 같다고 비유하고 있어요. 이런 돌발 상황이 새로운 논의의 흐름을 만든다는 거죠.","hl":"mn"},{"n":29,"text":"여기서 that은 주격 관계대명사로 쓰였어요. 바로 앞에 있는 urgent phone calls를 꾸며주죠. 선행사가 복수니까 동사 take도 복수형으로 맞춰준 점을 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 소그룹이 형성될 수도 있다\u003c/span>\u003cspan class=\"en\">Or sub-groups may form\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">회의실 내에서\u003c/span>\u003cspan class=\"en\">within the room\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시의적절한 주제를 논의하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">discuss\u003c/span> timely subjects\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 방식으로든 연결된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">linked\u003c/span> in some way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주요한 회의 줄기와\u003c/span>\u003cspan class=\"en\">to the main meeting trunk.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또는 회의실 내에서 소그룹이 형성되어 주요한 회의 줄기와 어떤 방식으로든 연결된 시의적절한 주제를 논의할 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 회의가 하나의 흐름을 유지하는 것이 아니라, 여러 개의 \u003cb class=\"key\">가지\u003c/b>가 뻗어 나가듯 소그룹 논의로 확장될 수 있음을 설명합니다. 이는 유연한 시간 문화의 \u003cb class=\"key\">상호작용\u003c/b> 중심적인 특징을 보여주는 비유입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : form [자동사] + to discuss [to부정사구/목적] : \"논의하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 후치수식\u003c/span> : subjects [명사] + linked [과거분사] : \"연결된\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Or sub-groups may form, 또는 소그룹이 형성될 수도 있다. within the room, 회의실 내에서. to discuss timely subjects, 시의적절한 주제를 논의하기 위해. linked in some way, 어떤 방식으로든 연결된. to the main meeting trunk, 주요한 회의 줄기와. 이 문장 전체를 해석하면, 또는 회의실 내에서 소그룹이 형성되어 주요한 회의 줄기와 어떤 방식으로든 연결된 시의적절한 주제를 논의할 수도 있다.","hl":"m"},{"n":31,"text":"회의가 단순히 줄기 하나로만 자라는 게 아니라, 여러 소그룹이라는 가지가 뻗어 나갈 수 있다는 뜻이에요. 이 문화에서는 메인 주제와 연결만 되어 있다면 즉흥적인 소모임도 생산적인 활동으로 봅니다.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 to discuss인데요, 소그룹이 형성되는 이유를 설명하는 목적의 부사적 용법입니다. 두 번째는 linked입니다. 앞에 있는 주제들이 연결되어 있는 상태를 꾸며주기 위해 과거분사 형태를 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유연한 시간 문화에서\u003c/span>\u003cspan class=\"en\">In flexible-time cultures,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라는 것이 명확해 보인다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003cspan class=\"tgt\">clear \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 생산적인 회의는 성장한다는\u003c/span>\u003cspan class=\"en\">the most productive meetings grow\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예측 불가능한 방식으로\u003c/span>\u003cspan class=\"en\">in unpredictable ways,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 유능한 관리자는 충분히 유연하고 전문적이라는 것이\u003c/span>\u003cspan class=\"en\">and the effective manager is \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">flexible \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">professional \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우선순위와 변화하는 요구사항을 활용할 만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">capitalize\u003c/span> on priorities and changing needs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 발생할 때\u003c/span>\u003cspan class=\"en\">as they arise.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유연한 시간 문화에서, 가장 생산적인 회의는 예측 불가능한 방식으로 성장하며, 유능한 관리자는 우선순위와 변화하는 요구사항이 발생할 때 이를 활용할 수 있을 만큼 충분히 유연하고 전문적이라는 것이 명확해 보인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 \u003cb class=\"key\">결론\u003c/b>으로, 정해진 의제보다 상황 변화에 대처하는 능력을 강조합니다. 관리자에게 필요한 덕목은 고정된 계획을 고수하는 것이 아니라 \u003cb class=\"key\">유연성\u003c/b>을 발휘하여 새로운 기회를 포착하는 것임을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it - 진주어 that 구문\u003c/span> : it [가주어] + seems [동사] + clear [보어] + that [접속사/진주어] : \"~라는 것이 명확해 보인다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">adj + enough + to-v\u003c/span> : adj [보어] + enough [부사] + to [to부정사] : \"활용할 만큼 충분히 유연하고 전문적인\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"In flexible-time cultures, 유연한 시간 문화에서. it seems clear that, ~라는 것이 명확해 보인다. the most productive meetings grow, 가장 생산적인 회의는 성장한다는. in unpredictable ways, 예측 불가능한 방식으로. and the effective manager is flexible and professional enough, 그리고 유능한 관리자는 충분히 유연하고 전문적이라는 것이. to capitalize on priorities and changing needs, 우선순위와 변화하는 요구사항을 활용할 만큼. as they arise, 그것들이 발생할 때. 이 문장 전체를 해석하면, 유연한 시간 문화에서, 가장 생산적인 회의는 예측 불가능한 방식으로 성장하며, 유능한 관리자는 우선순위와 변화하는 요구사항이 발생할 때 이를 활용할 수 있을 만큼 충분히 유연하고 전문적이라는 것이 명확해 보인다.","hl":"m"},{"n":34,"text":"이 문장은 주제를 관통하는 핵심이에요. 최고의 회의는 계획대로가 아니라 예측할 수 없게 흘러가며, 유능한 리더는 그 순간 나타나는 변화와 우선순위를 잘 잡아낼 줄 알아야 한다는 거죠.","hl":"mn"},{"n":35,"text":"첫 부분의 it은 가주어이고 진짜 주어는 that부터 끝까지입니다. 이 내용 전체가 명확하다는 뜻이죠. 그리고 enough의 위치를 보세요. flexible과 professional이라는 형용사 뒤에서 꾸며주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방해, 의제 변경\u003c/span>\u003cspan class=\"en\">Interruptions, agenda changes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 빈번한 방향 전환은\u003c/span>\u003cspan class=\"en\">and frequent shifts in direction\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~한 것으로 간주된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">seen \u003c/span>\u003cspan class=\"tgt\">as\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연스럽고 필수적인\u003c/span>\u003cspan class=\"en\">natural and necessary.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">방해, 의제 변경과 빈번한 방향 전환은 자연스럽고 필수적인 것으로 간주된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 보통의 문화에서는 회의의 방해 요소로 여겨지는 것들이 유연한 문화에서는 오히려 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">신호\u003c/b>로 받아들여진다는 점을 명시합니다. 이러한 요소들이 있어야만 회의가 유기적으로 \u003cb class=\"key\">성장\u003c/b>할 수 있다고 믿는 가치관을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (see A as B의 변형)\u003c/span> : A [주어] + are seen [be+p.p.] + as [전치사] + B [보어] : \"~로 간주된다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Interruptions, agenda changes, 방해, 의제 변경. and frequent shifts in direction, 그리고 빈번한 방향 전환은. are seen as, ~한 것으로 간주된다. natural and necessary, 자연스럽고 필수적인. 이 문장 전체를 해석하면, 방해, 의제 변경과 빈번한 방향 전환은 자연스럽고 필수적인 것으로 간주된다.","hl":"m"},{"n":37,"text":"마지막으로 이 문화권의 가치관을 정리해주고 있어요. 남들이 보기엔 회의를 방해하는 것처럼 보이는 돌발 상황들을 이들은 오히려 자연스럽고 꼭 필요한 과정이라고 생각합니다.","hl":"mn"},{"n":38,"text":"동사 are seen as를 잘 보세요. 여러 개의 주어들이 그런 것으로 여겨진다는 수동태 표현입니다. natural과 necessary라는 형용사가 as 뒤에 와서 주어의 상태를 설명하고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>유연한 시간 문화의 회의는 \u003cb class=\"key\">상록수\u003c/b>와 같아서, \u003cb class=\"key\">의제\u003c/b>가 나무 줄기처럼 중심을 잡아준다.\u003c/li>\u003cli>회의는 \u003cb class=\"key\">비선형적\u003c/b>으로 진행되며, 현재의 상황에 따라 \u003cb class=\"key\">우선순위\u003c/b>가 유동적으로 변한다.\u003c/li>\u003cli>긴급 전화나 소그룹 형성 같은 \u003cb class=\"key\">돌발 \u003c/b>\u003cb class=\"key\">상황\u003c/b>은 새로운 가지가 싹트는 \u003cb class=\"key\">자연스러운\u003c/b> 과정이다.\u003c/li>\u003cli>유능한 관리자는 이러한 \u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">불가능성\u003c/b>을 수용하고 변화를 \u003cb class=\"key\">활용\u003c/b>하는 전문성을 갖춰야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>In flexible-time cultures, meetings function like living trees where agendas serve as a base, but the actual progress involves unpredictable and natural shifts to address evolving priorities.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">유연한 \u003c/b>\u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">문화\u003c/b>에서의 회의는 고정된 계획을 따르기보다 상황에 맞춰 \u003cb class=\"key\">비선형적\u003c/b>이고 유동적으로 진행되며, 이를 통해 \u003cb class=\"key\">생산성\u003c/b>을 높입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"자, 이제 유연한 시간 문화의 회의가 왜 상록수처럼 움직이는지 이해되셨나요? 정해진 틀에 갇히기보다 변화를 기회로 삼는 이들의 유연함을 잘 기억하면서 오늘 배운 비유 표현들을 복습해 보세요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
