</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 19번","audioDir":"19_audio","preview":false,"count":67,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">19번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>A Happy Accident: The Joke That Revealed Our Victory\u003c/h1>\u003ch2>장난이 드러낸 우리의 우승\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>오디션 결과를 확인하러 들어온 화자는 부원들의 \u003cb class=\"key\">시무룩한 \u003c/b>\u003cb class=\"key\">얼굴\u003c/b>과 Immy의 말에 실패를 확신하지만, 곧 그것이 \u003cb class=\"key\">장난\u003c/b>이었고 \u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">Happy \u003c/b>\u003cb class=\"key\">Accident\u003c/b>가 바로 자신들임을 알게 되어 \u003cb class=\"key\">기쁨\u003c/b>을 느낀다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A joke about the audition result briefly made the narrator believe they had lost, but the truth that A Happy Accident was their own band filled them with joy.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 이번 모의고사 지문을 함께 볼게요. 이 글은 밴드 오디션 결과를 확인하러 온 화자가 잠시 실패했다고 생각했지만, 사실은 부원들이 장난을 친 것이었다는 이야기예요. 핵심은 결과를 둘러싼 오해가 걱정과 눈물로 이어졌다가 진실이 밝혀지면서 기쁨으로 바뀐다는 거예요. 자, 그럼 시작해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">밴드 오디션(band audition)에서 결과를 기다리는 상황은 누구나 겪는 \u003cb class=\"key\">긴장\u003c/b>의 순간이다. 친구끼리 모인 밴드라면 우승을 뜻하는 win, 성공을 뜻하는 make it 같은 표현이 \u003cb class=\"key\">주제어\u003c/b>로 반복될 수 있다. 이 글의 화자는 자신들의 오디션이 flawless, 곧 \u003cb class=\"key\">완벽\u003c/b>했다고 믿었기에 더 큰 \u003cb class=\"key\">실망\u003c/b>을 느낀다. 흔히 친구들이 시무룩한 표정(long faces)을 지으면 부정적 결과를 \u003cb class=\"key\">예측\u003c/b>하듯, 화자도 그 순간 오해에 빠진다. 마지막에 Immy의 \u003cb class=\"key\">장난\u003c/b>이 밝혀지면서 긴장이 \u003cb class=\"key\">기쁨\u003c/b>으로 바뀐다. 이는 놀람이 주는 감정의 \u003cb class=\"key\">반전\u003c/b>이 이야기 동력이 되는 경우다.\u003c/div>","segs":[{"n":2,"text":"밴드 오디션은 band audition이라고 하죠. 여러분도 반에서 장기자랑 팀을 짤 때 결과를 기다리는 마음을 생각해 보면 이 글의 긴장이 쉽게 느껴질 거예요. 화자는 자신의 밴드 오디션이 flawless, 다시 말해 완벽했다고 믿었고, 그래서 우승을 뜻하는 win이라는 말을 간절히 기다렸어요. 그런데 친구들이 long faces, 시무룩한 표정을 짓자 상황을 부정적으로 해석하게 됩니다. 이때 Immy가 다른 밴드 이름을 말하며 joke, 장난을 치죠. 마지막에 We made it이라는 성공 표현이 나오면서 오해가 풀립니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>시무룩한 분위기\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>화자가 \u003cb class=\"key\">숨을 \u003c/b>\u003cb class=\"key\">가쁘게 \u003c/b>\u003cb class=\"key\">쉬며\u003c/b> 음악실로 뛰어 들어간다. 부원들은 \u003cb class=\"key\">시무룩한 \u003c/b>\u003cb class=\"key\">얼굴\u003c/b>로 앉아 있고, Immy는 고개를 가로저으며 좋지 않은 분위기를 만든다. 화자는 묻기도 전에 \u003cb class=\"key\">실패\u003c/b>를 짐작하며 의자에 주저앉는다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>완벽했다는 믿음과 눈물\u003csmall>기대 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>화자는 오디션이 \u003cb class=\"key\">완벽\u003c/b>했다고 \u003cb class=\"key\">믿음\u003c/b>을 드러낸다. 그 믿음 때문에 누가 우승했는지 묻는 순간 \u003cb class=\"key\">무거운 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 되고, 눈물을 참게 된다. 기대가 클수록 실패에 대한 \u003cb class=\"key\">두려움\u003c/b>도 커진다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>다른 밴드 우승 발표\u003csmall>위기 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>Immy가 \u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">Happy \u003c/b>\u003cb class=\"key\">Accident\u003c/b>라는 밴드가 우승했다고 차분하게 말한다. 이 말은 화자에게 패배가 \u003cb class=\"key\">확정\u003c/b>된 것처럼 들린다. 앞선 \u003cb class=\"key\">긴장\u003c/b>이 더 깊어지는 순간이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>장난과 반전\u003csmall>반전 · 문장 10–15\u003c/small>\u003c/h4>\u003cp>잠시 후 Immy의 \u003cb class=\"key\">미소\u003c/b>와 부원들의 \u003cb class=\"key\">환호\u003c/b>가 분위기를 바꾼다. 화자가 그게 우리 아니냐고 묻자, Immy는 \u003cb class=\"key\">늦게 \u003c/b>\u003cb class=\"key\">온\u003c/b> 화자에게 \u003cb class=\"key\">장난\u003c/b>을 친 것이라고 설명한다. 이어 \u003cb class=\"key\">우리가 \u003c/b>\u003cb class=\"key\">해냈다\u003c/b>는 말로 진짜 성공이 드러난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>기쁨과 포옹\u003csmall>결론 · 문장 16–18\u003c/small>\u003c/h4>\u003cp>화자는 \u003cb class=\"key\">기쁨\u003c/b>으로 벅차고, 부원들은 \u003cb class=\"key\">벌떡 \u003c/b>\u003cb class=\"key\">일어나\u003c/b> 서로 껴안는다. 심장이 \u003cb class=\"key\">흥분\u003c/b>으로 요동치는 모습에서 감정의 \u003cb class=\"key\">반전\u003c/b>이 완성된다. 처음의 \u003cb class=\"key\">무거운 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이 완전히 해소된 결말이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이야기는 크게 다섯 단계로 흘러가는데, 처음의 어두운 분위기에서 중간의 반전을 거쳐 마지막 기쁨으로 이어져요.","hl":null},{"n":4,"text":"첫 번째 단계는 첫 문장부터 네 번째 문장까지예요. 화자가 숨을 가쁘게 쉬며 음악실로 뛰어 들어가는데, 나머지 부원들은 long faces, 시무룩한 얼굴로 앉아 있고 Immy는 고개를 가로저어요. 화자는 그 모습만 보고도 좋지 않은 결과를 짐작하며 의자에 주저앉아요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 다섯 번째 문장부터 일곱 번째 문장까지예요. 화자는 오디션이 완벽했다고 믿었기 때문에 무거운 가슴으로 누가 우승했는지 묻고, 눈물을 참아요. 이 부분에서 화자의 기대와 실망 사이의 거리가 커져요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 여덟 번째 문장부터 아홉 번째 문장까지예요. Immy가 A Happy Accident라는 밴드가 우승했다고 차분하게 말해요. 이 말은 화자에게 실패 확정처럼 들려요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 열 번째 문장부터 열다섯 번째 문장까지예요. 잠시 후 Immy가 크게 웃고 다른 부원들이 환호하면서 분위기가 반전돼요. 화자가 그게 우리 아니냐고 묻자, Immy가 네가 늦게 와서 장난을 쳤다고 말하고 우리가 해냈다고 알려 줘요. 이 대목이 글의 핵심 반전이에요.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 열여섯 번째 문장부터 열여덟 번째 문장까지예요. 기쁨으로 벅찬 화자와 부원들은 벌떡 일어나 서로 껴안고, 심장이 흥분으로 요동쳐요. 처음의 무거운 마음이 완전히 긍정적인 감정으로 바뀌는 마무리예요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 15번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 사건이 \u003cb class=\"key\">시간순\u003c/b>으로 전개되며 화자의 감정이 점점 고조된다. 그러나 주제는 초반이 아니라 후반부의 \u003cb class=\"key\">We \u003c/b>\u003cb class=\"key\">made \u003c/b>\u003cb class=\"key\">it\u003c/b>에서 밝혀지므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있다. 앞부분의 \u003cb class=\"key\">시무룩한 \u003c/b>\u003cb class=\"key\">표정\u003c/b>과 \u003cb class=\"key\">장난\u003c/b>은 모두 핵심 반전을 위한 \u003cb class=\"key\">복선\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>A moment later (10)\u003c/b>\u003cspan>시간 전환\u003c/span>\u003cb>Since (14)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>We made it (15)\u003c/b>\u003cspan>주제 강조\u003c/span>\u003cb>was filled with joy (16)\u003c/b>\u003cspan>감정 결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">would make it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">won\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">We made it!\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 글은 사건이 시간 순서대로 전개되는 time order, 시간순 구조예요. 화자가 음악실에 들어오는 순간부터 결과를 알고 기뻐하는 순간까지 순서대로 제시되어요. 그런데 주제가 처음이 아니라 뒤에서 드러나기 때문에 두괄식보다는 미괄식에 가까워요. 핵심 문장은 We made it이라는 열다섯 번째 문장으로, 앞의 긴장과 오해가 모두 이 한 문장으로 풀려요.","hl":"ty"},{"n":10,"text":"흐름을 잡아 주는 신호어를 볼게요. A moment later는 잠시 후라는 뜻으로 분위기가 바뀌는 전환 신호예요. Since you were late는 장난을 친 이유를 설명하는 원인 신호이죠. 같은 성공 개념이 make it, won, We made it처럼 반복되면서 주제가 강조돼요. 이렇게 신호어와 재진술을 함께 보면 이야기의 반전과 주제를 놓치지 않아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>run into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 뛰어 들어가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>breathe heavily\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>숨을 가쁘게 쉬다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>나머지\u003c/span>\u003c/div>\u003cdiv>\u003cb>long faces\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>시무룩한 얼굴\u003c/span>\u003c/div>\u003cdiv>\u003cb>look up at\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 올려다보다\u003c/span>\u003c/div>\ >\u003cdiv>\u003cb>jump up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>벌떡 일어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hug\u003c/b>\u003cem>동사\u003c/em>\u003cspan>껴안다\u003c/span>\u003c/div>\u003cdiv>\u003cb>race\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요동치다, 빠르게 뛰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>excitement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>흥분\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이번 지문에서 시험에 잘 나오는 표현 몇 개만 정리할게요. run into는 뛰어 들어가다, long faces는 시무룩한 얼굴, make it은 해내다 또는 성공하다라는 뜻이에요. flawless는 완벽한, hold back tears는 눈물을 참다, play a joke on은 누구에게 장난을 치다라는 뜻으로 기억하면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">flawless\u003c/b>\u003cspan class=\"m\">완벽한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">perfect\u003c/span>\u003cspan class=\"s\">impeccable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">flawed\u003c/span>\u003cspan class=\"a\">defective\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hold back\u003c/b>\u003cspan class=\"m\">참다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">suppress\u003c/span>\u003cspan class=\"s\">restrain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003cspan class=\"a\">let out\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">calmly\u003c/b>\u003cspan class=\"m\">차분하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">composedly\u003c/span>\u003cspan class=\"s\">coolly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">excitedly\u003c/span>\u003cspan class=\"a\">anxiously\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">make it\u003c/b>\u003cspan class=\"m\">해내다, 성공하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">succeed\u003c/span>\u003cspan class=\"s\">achieve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">joy\u003c/b>\u003cspan class=\"m\">기쁨\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">delight\u003c/span>\u003cspan class=\"s\">happiness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sorrow\u003c/span>\u003cspan class=\"a\">grief\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">excitement\u003c/b>\u003cspan class=\"m\">흥분\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">thrill\u003c/span>\u003cspan class=\"s\">enthusiasm\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">boredom\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 연결해서 외워 두면 어휘 문제에서 유리해요. flawless는 perfect, impeccable과 바꿔 쓸 수 있고 반대는 flawed, defective예요. hold back은 suppress, restrain과 비슷하고 release, let out과는 반대예요. joy는 delight, happiness와 비슷하고 sorrow, grief와 반대, excitement는 thrill, enthusiasm과 비슷하고 boredom, calm과 반대예요. 이렇게 짝을 지어 익히면 독해에서 감정의 흐름도 빨리 파악돼요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 뛰었다\u003c/span>\u003cspan class=\"en\">I ran\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악실로\u003c/span>\u003cspan class=\"en\">into the music room,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가쁘게 숨쉬면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">breathing \u003c/span>\u003cspan class=\"tgt\">heavily\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 숨을 가쁘게 쉬며 음악실로 뛰어 들어갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공이 심하게 숨을 몰아쉬며 음악실에 급하게 도착한 상황을 보여 주는 도입 문장입니다. 음악실로 뛰어 들어갔다와 가쁘게 숨쉬면서를 함께 제시해 오디션 결과에 대한 \u003cb class=\"key\">긴장감\u003c/b>과 \u003cb class=\"key\">서두름\u003c/b>을 전달합니다. 이 장면은 뒤이어 밴드 부원들의 시무룩한 표정과 대조되면서 \u003cb class=\"key\">장난\u003c/b>의 복선을 깔고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (현재분사의 부대상황·동시동작)\u003c/span> : I ran into the music room, [breathing heavily (현재분사구문)] : \"가쁘게 숨쉬면서\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"I ran, 나는 뛰었다. into the music room, 음악실로. breathing heavily, 가쁘게 숨쉬면서. 이 문장 전체를 해석하면, 나는 숨을 가쁘게 쉬며 음악실로 뛰어 들어갔다.","hl":"m"},{"n":14,"text":"이 문장은 주인공이 숨을 가쁘게 쉬면서 음악실로 급하게 뛰어 들어가는 장면을 보여 줘요. 오디션 결과가 궁금해서 서둘렀다는 긴장감과 기대가 담겨 있죠. 뒤에 밴드 부원들이 시무룩한 표정을 짓는 모습과 대조되면서 장난의 분위기를 만들어 주는 역할을 해요.","hl":"mn"},{"n":15,"text":"이 문장의 어법 포인트는 breathing heavily라는 현재분사 구문이에요. 주절과 같은 시점에 일어나는 동작을 나타내면서 주어 I가 숨을 쉬는 주체이기 때문에 능동의 의미인 현재분사로 쓴 거예요. 가쁘게 숨쉬면서라는 부대 상황을 덧붙여 주는 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밴드의 나머지 부원들은\u003c/span>\u003cspan class=\"en\">The rest of the band\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">앉아 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">sitting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시무룩한 얼굴로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">faces\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">밴드의 나머지 부원들은 시무룩한 얼굴로 앉아 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오디션 결과를 기다리는 밴드 부원들의 표정과 태도를 묘사하는 문장입니다. long faces는 슬프거나 실망스러운 표정을 뜻하는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로, 주인공이 패배를 짐작하게 만드는 \u003cb class=\"key\">분위기\u003c/b>를 만듭니다. 실제로는 합격한 상황에서 벌이는 \u003cb class=\"key\">연기\u003c/b>라는 점이 다음 문장들에서 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거 진행형\u003c/span> : The rest of the band + were + sitting (~ing) : \"앉아 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 (with + 명사구, 상태·표정)\u003c/span> : with + [long faces (형용사 + 명사)] : \"시무룩한 얼굴로\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"The rest of the band, 밴드의 나머지 부원들은. were sitting, 앉아 있었다. with long faces, 시무룩한 얼굴로. 이 문장 전체를 해석하면, 밴드의 나머지 부원들은 시무룩한 얼굴로 앉아 있었다.","hl":"m"},{"n":17,"text":"이 문장은 밴드의 나머지 부원들이 시무룩한 얼굴로 앉아 있는 모습을 묘사해요. 오디션 결과가 나쁜 것처럼 보이도록 주인공을 속이려는 상황이죠. long faces는 단순히 긴 얼굴이 아니라 실망하거나 슬픈 표정을 뜻하는 관용 표현이라는 점을 꼭 기억해 두세요.","hl":"mn"},{"n":18,"text":"첫 번째 포인트는 were sitting이라는 과거 진행형이에요. 과거의 특정 시점에 앉아 있는 상태가 계속되고 있었음을 나타내고, 주어 the rest of the band를 복수로 취급해서 were를 쓴 거예요. 두 번째 포인트는 with long faces라는 전치사구예요. with 다음에 표정을 나타내는 명사구를 붙여서 시무룩한 얼굴로라는 상태를 표현하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Immy는 나를 올려다보았다\u003c/span>\u003cspan class=\"en\">Immy \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">looked \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 고개를 가로저었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">shook \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">head\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Immy는 나를 올려다보며 고개를 가로저었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Immy가 주인공을 올려다보고 고개를 가로젓는 모습을 묘사한 문장입니다. 고개를 가로젓다는 부정이나 실망의 신호로, 주인공에게 탈락을 \u003cb class=\"key\">암시\u003c/b>하며 \u003cb class=\"key\">긴장\u003c/b>을 높입니다. 하지만 이 행동은 실제 사실이 아니라 주인공을 속이기 위한 \u003cb class=\"key\">연기\u003c/b>의 일부입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and를 이용한 동사 병렬\u003c/span> : Immy [looked up at me] and [shook her head] : \"나를 올려다보았고 고개를 가로저었다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Immy looked up at me, Immy는 나를 올려다보았다. and shook her head, 그리고 고개를 가로저었다. 이 문장 전체를 해석하면, Immy는 나를 올려다보며 고개를 가로저었다.","hl":"m"},{"n":20,"text":"이 문장은 Immy가 주인공을 올려다보면서 고개를 가로젓는 행동을 나타내요. 고개를 가로젓는 것은 보통 부정이나 실망의 신호이기 때문에 주인공에게 탈락을 암시하면서 긴장감을 높여요. 하지만 실제로는 주인공을 속이기 위한 연기라는 점이 이 글의 재미있는 포인트예요.","hl":"mn"},{"n":21,"text":"이 문장의 어법 포인트는 and가 이끄는 병렬 구조예요. looked up at me와 shook her head라는 두 동사구가 and로 연결되어 Immy의 연속된 동작을 표현해요. 두 동사 모두 과거 시제를 사용해서 같은 시간대에 일어난 일이라는 점을 나타내고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 주저앉았다\u003c/span>\u003cspan class=\"en\">I sank\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의자에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">chair\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 의자에 주저앉았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Immy가 고개를 가로저은 직후, 나는 힘없이 의자에 주저앉습니다. 이 장면은 기대했던 결과가 아니라는 신호에 대한 나의 실망과 충격을 몸짓으로 보여 줍니다. \u003cb class=\"key\">주저앉다\u003c/b>라는 표현은 그냥 앉는 것이 아니라 힘없이 무너지듯 앉는 느낌을 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 into의 방향·이동 쓰임\u003c/span> : into [전치사] + a chair [명사구] : \"의자에(로) 주저앉다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"I sank, 나는 주저앉았다. into a chair, 의자에. 이 문장 전체를 해석하면, 나는 의자에 주저앉았다.","hl":"m"},{"n":23,"text":"Immy가 고개를 가로젓는 모습을 본 뒤에 주인공은 힘없이 의자에 주저앉아요. 그냥 앉는 게 아니라 기대가 무너지면서 몸이 의자로 가라앉는 느낌, 그래서 주저앉다라는 표현을 쓴 거죠. 결과가 좋지 않을 것이라는 분위기를 몸짓으로 먼저 보여 주는 문장입니다.","hl":"mn"},{"n":24,"text":"여기서 into a chair는 into라는 전치사가 어디로 향하는 방향이나 그 속으로 들어가는 느낌을 나타내요. 동사 sank와 함께 쓰여서 의자에 주저앉는 동작을 표현합니다. into 다음에는 장소인 a chair가 왔죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 정말로 믿었었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">truly \u003c/span>\u003cspan class=\"tgt\">believed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 해낼 것이라고\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 오디션은 완벽했었다\u003c/span>\u003cspan class=\"en\">our audition had been flawless.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 정말로 우리가 해낼 것이라고 믿었다. 우리의 오디션은 완벽했기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오디션 결과를 듣기 전, 화자는 결과가 좋을 것이라는 강한 확신을 가졌습니다. had truly believed와 had been flawless는 모두 \u003cb class=\"key\">과거완료\u003c/b>로, 그 시점 이전부터 완벽하다고 믿어 왔음을 강조합니다. 세미콜론 뒤는 그 확신의 구체적 근거, 즉 오디션이 \u003cb class=\"key\">완벽했다\u003c/b>는 사실을 덧붙입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료 (had + p.p.)\u003c/span> : had [조동사] + truly [부사] + believed [과거분사] : \"정말로 믿었었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 will의 과거형 would + 동사원형 (과거 시점의 미래)\u003c/span> : would [조동사] + make [동사원형] + it [목적어] : \"해낼 것이라고\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"I had truly believed, 나는 정말로 믿었었다. we would make it, 우리가 해낼 것이라고. our audition had been flawless, 우리의 오디션은 완벽했었다. 이 문장 전체를 해석하면, 나는 정말로 우리가 해낼 것이라고 믿었다. 우리의 오디션은 완벽했기 때문이다.","hl":"m"},{"n":26,"text":"결과를 확인하기 전에 화자는 우리가 성공할 거라고 아주 강하게 믿었어요. had truly believed와 had been flawless처럼 had에 과거분사가 오는 과거완료형을 써서, 믿음과 완벽했던 상태가 결과를 듣는 순간보다 앞선 때부터 이어져 왔음을 보여 줘요. 세미콜론 뒤에서는 그렇게 믿은 이유, 즉 우리 오디션이 완벽했다는 사실을 덧붙이고 있습니다.","hl":"mn"},{"n":27,"text":"첫 번째 포인트는 had truly believed예요. had 뒤에 과거분사가 오는 과거완료로, 결과를 듣기 전까지 그 믿음이 계속되어 왔다는 뜻을 나타내요. 두 번째 포인트는 would make it인데, 과거 시점에서 바라본 미래를 표현하고 make it은 해내다라는 뜻의 관용 표현입니다. 이 문장은 믿음의 근거까지 제시하면서 주인공의 기대를 강하게 쌓아 주는 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 가슴은 무거웠다\u003c/span>\u003cspan class=\"en\">My chest \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">felt \u003c/span>\u003cspan class=\"tgt\">heavy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 물으면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">asked\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;그래서, 누가 우승했어?&quot;\u003c/span>\u003cspan class=\"en\">&quot;So, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">won\u003c/span>?&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 “그래서, 누가 우승했어?”라고 물으며 무거운 마음을 느꼈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 결과를 묻는 순간 화자가 느낀 \u003cb class=\"key\">무거운 \u003c/b>\u003cb class=\"key\">마음\u003c/b>을 보여 줍니다. as는 물으면서 동시에 가슴이 무거웠다는, 두 상황의 \u003cb class=\"key\">동시\u003c/b> 발생을 연결합니다. 앞선 강한 확신과 대비되면서 기대와 긴장이 섞인 심리를 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사 feel + 형용사 보어 (2형식)\u003c/span> : felt [감각동사] + heavy [형용사 보어] : \"무겁게 느껴졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 as (때, 동시 동작)\u003c/span> : as [접속사] + I asked [주어+동사] : \"내가 물으면서, 내가 물었을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사 who + 동사 (주어 묻기)\u003c/span> : who [의문사] + won [동사] : \"누가 우승했어?\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"My chest felt heavy, 내 가슴은 무거웠다. as I asked, 내가 물으면서. \"So, who won?\", \"그래서, 누가 우승했어?\". 이 문장 전체를 해석하면, 나는 “그래서, 누가 우승했어?”라고 물으며 무거운 마음을 느꼈다.","hl":"m"},{"n":29,"text":"이 문장은 결과를 묻는 순간에도 가슴이 무거웠다고 말해요. as가 물었을 때라는 시간의 연결을 해 주어서, 묻는 동시에 불안하고 긴장된 마음이 컸음을 보여 줍니다. 앞에서 완벽하다고 믿었던 문장과 대비되는 순간이에요.","hl":"mn"},{"n":30,"text":"첫 번째 포인트는 felt heavy예요. feel은 느껴지다라는 뜻의 감각 동사인데, 뒤에 형용사 보어 heavy가 와서 주어인 My chest의 상태를 설명해요. 두 번째는 as I asked로, as는 어떤 일이 동시에 일어날 때 쓰는 시간 접속사입니다. 세 번째는 who won인데, who가 주어 역할을 하는 의문문이라서 의문사 뒤에 바로 동사 won이 오는 평서문 어순이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">참고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">holding \u003c/span>\u003cspan class=\"tgt\">back\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 눈물을\u003c/span>\u003cspan class=\"en\">my tears.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 눈물을 참고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 오디션 결과를 묻고 나서 화자가 슬픔을 억누르는 모습을 보여 주는 문장이다. \u003cb class=\"key\">hold \u003c/b>\u003cb class=\"key\">back\u003c/b>은 눈물이나 감정을 겉으로 드러내지 않고 참는다는 뜻으로, 긴장 속에 화자의 \u003cb class=\"key\">슬픔\u003c/b>을 드러낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : was + [holding back (현재분사)] : \"참고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"I, 나는. was holding back, 참고 있었다. my tears, 내 눈물을. 이 문장 전체를 해석하면, 나는 눈물을 참고 있었다.","hl":"m"},{"n":32,"text":"이 문장은 오디션 결과를 듣기 전, 화자가 슬픔을 꾹 참고 있는 모습을 보여 줘요. hold back은 눈물이나 감정을 겉으로 드러내지 않고 참는다는 의미예요. 그래서 뒤에 이어질 반전의 긴장을 높여 주는 역할을 하죠.","hl":"mn"},{"n":33,"text":"was holding back은 과거진행형이에요. 과거의 특정 시점에 진행 중이던 동작을 나타내고, 이때 hold back은 눈물을 참다, 억누르다라는 뜻의 구동사죠. 형태는 was에 ing를 붙인 현재분사를 함께 써서 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 밴드\u003c/span>\u003cspan class=\"en\">&quot;A band\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라고 불리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">A Happy Accident.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">Happy \u003c/span>\u003cspan class=\"tgt\">Accident\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“A Happy Accident라고 불리는 밴드야.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Immy가 '누가 우승했어?'라는 질문에 답하며 우승 밴드의 이름을 알려 주는 문장이다. 실제로 이 밴드는 화자가 속한 밴드이므로, 화자의 슬픔과 대비되는 \u003cb class=\"key\">아이러니\u003c/b>가 만들어진다. \u003cb class=\"key\">called\u003c/b>는 '~라고 불리는'이라는 뜻의 \u003cb class=\"key\">과거분사\u003c/b>로, 뒤에서 a band를 수식한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구 후치수식\u003c/span> : [a band] + [called A Happy Accident (과거분사구)] : \"A Happy Accident라고 불리는\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"\"A band, 한 밴드. called, 라고 불리는. A Happy Accident, A Happy Accident.. 이 문장 전체를 해석하면, “A Happy Accident라고 불리는 밴드야.","hl":"m"},{"n":35,"text":"이 문장은 Immy가 아까 질문에 답하면서 우승한 밴드의 이름을 말하는 부분이에요. A Happy Accident가 사실은 이 화자가 속한 밴드인데, 화자는 아직 이 사실을 모르고 있어요. called가 뒤에서 a band를 수식하는 과거분사라서 A Happy Accident라고 불리는 밴드가 됩니다.","hl":"mn"},{"n":36,"text":"called A Happy Accident에서 called는 뒤에서 a band를 꾸며 주는 과거분사예요. 영어에서 과거분사가 명사 뒤에 오면 그 명사를 수식하는 후치수식이 됩니다. 뜻은 A Happy Accident라고 불리는 이라고 해석하면 되고, 이름이 붙여진 수동의 의미를 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꽤 잘하더라,&quot;\u003c/span>\u003cspan class=\"en\">were quite good,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 차분하게 말했다.\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said \u003c/span>\u003cspan class=\"tgt\">calmly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들 꽤 잘하더라.”고 그녀가 차분하게 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Immy가 A Happy Accident 밴드가 꽤 잘했다고 덧붙이며 침착하게 말을 마무리하는 문장이다. \u003cb class=\"key\">calmly\u003c/b>는 감정을 숨기고 태연하게 말하는 태도를 보여 주며, 뒤에 이어질 반전과 대비된다. 화자의 슬픔을 더 깊어 보이게 하는 \u003cb class=\"key\">장치\u003c/b> 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 동사 수식\u003c/span> : [said (동사)] + [calmly (부사)] : \"차분하게 말했다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"They, 그들은. were quite good,\", 꽤 잘하더라,\". she said calmly, 그녀가 차분하게 말했다.. 이 문장 전체를 해석하면, 그들 꽤 잘하더라.”고 그녀가 차분하게 말했다.","hl":"m"},{"n":38,"text":"이 문장은 Immy가 A Happy Accident 밴드가 꽤 잘했다고 덧붙이며 차분하게 말을 마무리하는 부분이에요. 여기서 calmly는 그녀가 속마음을 감추고 태연하게 말하는 태도를 보여 줘요. 이 차분함이 뒤이어 나오는 반전과 대비되어 장난의 효과를 높여 주죠.","hl":"mn"},{"n":39,"text":"said calmly에서 calmly는 동사 said를 꾸며 주는 부사예요. 말하는 방식이나 태도를 나타내며, 해석은 차분하게 말했다가 자연스럽습니다. 형용사 calm에 ly가 붙은 부사 형태라는 것도 함께 기억해 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠시 후,\u003c/span>\u003cspan class=\"en\">A moment later,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환한 미소가\u003c/span>\u003cspan class=\"en\">a big smile\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Immy의 얼굴에 번졌고,\u003c/span>\u003cspan class=\"en\">spread across Immy's face,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 다른 부원들이 환호하기 시작했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">others \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">cheer\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">잠시 후, Immy의 얼굴에 환한 미소가 번졌고, 다른 부원들이 환호하기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 시무룩했던 분위기가 반전되는 장면이다. Immy의 얼굴에 미소가 \u003cb class=\"key\">퍼지면서\u003c/b> 다른 부원들이 환호하기 시작하는데, 이는 사실 밴드가 우승했음을 암시하는 \u003cb class=\"key\">복선\u003c/b> 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬 연결\u003c/span> : S + V ~, and S + V ~ : \"그리고 다른 부원들이 환호하기 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">begin + to부정사\u003c/span> : begin + to부정사(to cheer) : \"환호하기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"A moment later, 잠시 후. a big smile, 환한 미소가. spread across Immy's face, Immy의 얼굴에 번졌고. and the others began to cheer, 그리고 다른 부원들이 환호하기 시작했다.. 이 문장 전체를 해석하면, 잠시 후, Immy의 얼굴에 환한 미소가 번졌고, 다른 부원들이 환호하기 시작했다.","hl":"m"},{"n":41,"text":"앞에서 시무룩했던 분위기가 갑자기 뒤집히는 장면이에요. Immy의 얼굴에 큰 미소가 번지면서 다른 부원들이 환호하기 시작하는데, 이건 사실 이 밴드가 우승했다는 복선이에요. big smile이 spread across her face라는 표현은 미소가 얼굴에 퍼지는 모습을 생생하게 보여 줘요.","hl":"mn"},{"n":42,"text":"첫 번째 어법 포인트는 began to cheer의 to부정사예요. begin은 to부정사를 목적어로 가져서 어떤 일을 시작하다라고 해석해요. 두 번째 포인트는 and의 병렬 연결인데요, and가 앞뒤 두 절을 대등하게 이어 주면서 두 사건을 나란히 보여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“잠깐,\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Wait\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뭐라고?\u003c/span>\u003cspan class=\"en\">what?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“잠깐, 뭐라고?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자가 믿기 어려운 상황에 놀라며 되묻는 \u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">감탄문\u003c/b>이다. 앞 문장의 반전을 받아들이지 못하고 \u003cb class=\"key\">혼란\u003c/b>을 드러내는 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : 동사원형으로 시작하는 명령문 : \"잠깐\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"\"Wait, “잠깐. what?, 뭐라고?. 이 문장 전체를 해석하면, “잠깐, 뭐라고?","hl":"m"},{"n":44,"text":"화자가 방금 들은 말을 믿을 수 없어서 놀라며 되묻는 짧은 감탄문이에요. 앞의 분위기 전환을 받아들이지 못하고 혼란을 드러내는 역할을 해요.","hl":"mn"},{"n":45,"text":"이 문장의 어법 포인트는 Wait의 명령문이에요. 명령문은 주어 없이 동사원형으로 시작해서 상대방의 동작을 멈추게 하거나 주의를 끌 때 쓰여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그건\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리잖아!”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">us!\u003c/span>&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그건 우리잖아!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 화자가 앞서 Immy가 말한 밴드 이름 A Happy Accident이 바로 자신들의 밴드임을 깨닫는 \u003cb class=\"key\">확신\u003c/b>의 순간이다. 이 한 문장으로 오해가 풀리고 \u003cb class=\"key\">우승\u003c/b>의 기쁨으로 전환된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">축약형과 구어적 표현\u003c/span> : That is → That's / be동사 뒤에 목적격 us : \"그건 우리잖아!\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"That's, 그건. us!\", 우리잖아!”. 이 문장 전체를 해석하면, 그건 우리잖아!”","hl":"m"},{"n":47,"text":"화자가 Immy가 말한 밴드 이름 A Happy Accident이 바로 자기 밴드라는 걸 깨닫는 확신의 순간이에요. 이 말로 오해가 풀리면서 우승의 기쁨으로 넘어가게 돼요.","hl":"mn"},{"n":48,"text":"이 문장의 어법 포인트는 That's us의 표현이에요. 회화에서는 be동사 뒤에 주격 대신 목적격 us를 써서 바로 우리다라고 자연스럽게 말해요. That's는 That is의 축약형이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">said\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">라고 내가 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 화자가 'Wait, what? That's us!'라고 외친 말을 정리해 주는 짧은 전달문이에요. \u003cb class=\"key\">전달 \u003c/b>\u003cb class=\"key\">동사\u003c/b> said를 통해 대화가 빠르게 이어지면서 화자의 놀란 반응을 보여 줘요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제\u003c/span> : 주어 I + said (say의 과거형) : \"말했다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"I, 나는. said, 말했다.. 이 문장 전체를 해석하면, 라고 내가 말했다.","hl":"m"},{"n":50,"text":"이 문장은 짧은 전달문이에요. 앞에서 화자가 Wait, what, That's us라고 외친 말을 다시 나는 말했다로 연결해 주고 있어요. 그래서 등장인물들의 대화가 빠르게 이어지는 느낌을 줘요.","hl":"mn"},{"n":51,"text":"여기서 said는 say의 과거형이에요. 지문 전체가 과거에 있었던 일을 돌아보며 쓰이고 있으니까 과거시제를 쓴 거죠. 주어 I에 맞춰 과거형 said가 나온 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Immy가 웃으며 말했다.\u003c/span>\u003cspan class=\"en\">Immy laughed and said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네가 늦게 와서\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Since \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">late\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 장난 좀 치기로 했지!\u003c/span>\u003cspan class=\"en\">we decided \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">play \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">joke \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">you\u003c/span>!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Immy가 웃으며 말했다. “네가 늦게 와서 우리가 장난 좀 치기로 했지!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Immy가 웃으며 밝힌 반전 문장이에요. 화자가 늦게 와서 장난을 친 것이고, 사실은 오디션에 합격했다는 내용을 이끌어요. \u003cb class=\"key\">Since\u003c/b>는 '~때문에'로 이유를 나타내고, \u003cb class=\"key\">play \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">joke \u003c/b>\u003cb class=\"key\">on\u003c/b>은 '~에게 장난을 치다'라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 since의 이유 부사절\u003c/span> : Since + 주어 + 동사, 주절 : \"네가 늦게 와서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : decide + to-v (목적어) : \"장난을 치기로\"\u003c/div>\u003c/div>","segs":[{"n":52,"text":"Immy laughed and said, Immy가 웃으며 말했다.. \"Since you were late, 네가 늦게 와서. we decided to play a joke on you!, 우리가 장난 좀 치기로 했지!. 이 문장 전체를 해석하면, Immy가 웃으며 말했다. “네가 늦게 와서 우리가 장난 좀 치기로 했지!","hl":"m"},{"n":53,"text":"이 문장은 Immy가 웃으며 사실을 밝히는 장면이에요. 네가 늦게 와서 우리가 장난을 치기로 했다는 거죠. 앞에서 Immy가 고개를 가로저은 것은 진짜 실패한 게 아니라 반전의 장난이었음을 알려 줘요.","hl":"mn"},{"n":54,"text":"첫 번째로 Since you were late에서 Since는 왜냐하면과 비슷하게 이유를 나타내는 접속사예요. 네가 늦게 와서라는 부사절이 뒤에 주절 we decided to play a joke on you를 꾸며 주는 구조죠. 두 번째로 to play a joke on you는 to부정사가 decided의 목적어로 쓰인 거예요. decide는 to부정사를 목적어로 취하는 대표 동사라서 decide to play처럼 외워 두면 어법 문제에 잘 나와요. 그리고 play a joke on you는 누구에게 장난을 치다는 뜻으로 통째로 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 18\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는\u003c/span>\u003cspan class=\"en\">We\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해냈어!”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>!&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 해냈어!”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Immy의 대화를 마무리하는 핵심 선언이에요. \u003cb class=\"key\">make \u003c/b>\u003cb class=\"key\">it\u003c/b>이 '해내다, 성공하다'라는 뜻이라서 오디션에서 우승했다는 기쁜 결과를 짧게 전달해요. 감탄문으로 쓰여 감정이 폭발하는 순간을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 make it의 과거형\u003c/span> : make it = succeed (성공하다) : \"해냈어\"\u003c/div>\u003c/div>","segs":[{"n":55,"text":"We, 우리는. made it!\", 해냈어!”. 이 문장 전체를 해석하면, 우리가 해냈어!”","hl":"m"},{"n":56,"text":"이 문장은 밴드가 결국 오디션에서 우승했다는 결정적인 선언이에요. made it은 해내다, 성공하다라는 뜻이라서 그동안의 슬픈 분위기가 기쁨으로 바뀌는 순간을 보여 줘요. 짧은 감탄문이라서 감정이 폭발하는 느낌을 강하게 줘요.","hl":"mn"},{"n":57,"text":"여기서 made it은 make it의 과거형으로, 무언가를 성공해 냈다는 뜻이에요. 만들다로 해석하면 이상해지니까 해내다, 성공하다로 외워야 해요. 특히 시험이나 오디션, 목표 달성 같은 상황에서 자주 쓰이는 관용 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가득 차 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">filled \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기쁨으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">joy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 기쁨으로 벅찼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 장난이 사실이었음을 확인한 뒤 화자가 느낀 감정을 단순하게 요약한다. \u003cb class=\"key\">be \u003c/b>\u003cb class=\"key\">filled \u003c/b>\u003cb class=\"key\">with\u003c/b>는 수동태 형태이지만 '~로 가득 차다'라는 \u003cb class=\"key\">상태\u003c/b>를 나타내는 관용 표현이다. \u003cb class=\"key\">joy\u003c/b>는 기쁨이라는 감정을 직접 가리키는 추상명사이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + pp + with)\u003c/span> : I + was filled + with joy : \"나는 기쁨으로 가득 차 있었다\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"I, 나는. was filled, 가득 차 있었다. with joy, 기쁨으로. 이 문장 전체를 해석하면, 나는 기쁨으로 벅찼다.","hl":"m"},{"n":59,"text":"이 문장은 오디션 합격을 확인한 뒤에 느낀 기쁨을 단순하게 요약해 줍니다. be filled with는 수동태처럼 보이지만 실제로는 무엇인가 가득 찬 상태를 나타내는 관용 표현이에요. joy는 기쁨이라는 감정을 직접 가리키는 추상 명사입니다.","hl":"mn"},{"n":60,"text":"열여섯 번째 문장에서 짚을 어법은 수동태입니다. was filled with joy는 be동사 과거형 was와 과거분사 filled가 결합한 수동태 형태인데, 여기서는 채워진 상태를 나타내는 관용 표현으로 굳어졌어요. fill은 원래 채우다라는 타동사이지만 주어 I가 채워진 대상이 되면서 수동태가 쓰였습니다. be filled with는 기쁨이나 감정에 가득 차다로 통째로 외워 두면 좋아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 벌떡 일어났다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">jumped \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 껴안았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">hugged\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">other\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 벌떡 일어나 서로를 껴안았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 기쁨을 몸으로 표현하는 연속된 동작을 보여 준다. \u003cb class=\"key\">jumped \u003c/b>\u003cb class=\"key\">up\u003c/b>과 \u003cb class=\"key\">hugged\u003c/b>가 and로 병렬되어 순차적인 행동을 나타내고, \u003cb class=\"key\">each \u003c/b>\u003cb class=\"key\">other\u003c/b>는 부원들이 서로를 껴안는 상호 관계를 드러낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 and의 병렬\u003c/span> : We [jumped up] and [hugged] each other : \"우리는 벌떡 일어났고 껴안았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상호대명사\u003c/span> : hugged each other : \"서로를 껴안았다\"\u003c/div>\u003c/div>","segs":[{"n":61,"text":"We jumped up, 우리는 벌떡 일어났다. and hugged, 그리고 껴안았다. each other, 서로를. 이 문장 전체를 해석하면, 우리는 벌떡 일어나 서로를 껴안았다.","hl":"m"},{"n":62,"text":"이 문장은 기쁨을 몸으로 표현하는 연속된 동작을 보여 줍니다. jumped up과 hugged가 and로 병렬되어 일어나고 껴안는 행동이 순서대로 이어져요. each other는 부원들이 서로를 껴안는 상호 관계를 나타냅니다.","hl":"mn"},{"n":63,"text":"열일곱 번째 문장에는 두 가지 어법을 짚을게요. 첫 번째는 등위접속사 and의 병렬입니다. jumped up과 hugged가 and로 연결되어 우리가 일어난 동작과 껴안은 동작을 같은 무게로 나란히 보여 줘요. 두 번째는 상호대명사 each other입니다. each other는 서로를 뜻하고, 여기서는 hugged의 목적어 자리에 와서 부원들이 서로를 껴안는 관계를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 18\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 심장은\u003c/span>\u003cspan class=\"en\">My heart\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요동치고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">racing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흥분으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">excitement\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내 심장은 흥분으로 요동치고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마지막 문장은 신체 반응을 통해 흥분의 절정을 생생하게 보여 준다. \u003cb class=\"key\">was \u003c/b>\u003cb class=\"key\">racing\u003c/b>은 과거진행형으로 그 순간 심장이 빠르게 뛰고 있는 상태를 강조하고, \u003cb class=\"key\">with \u003c/b>\u003cb class=\"key\">excitement\u003c/b>은 그 원인이 흥분임을 덧붙인다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : My heart + was racing : \"내 심장은 요동치고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 (원인·감정)\u003c/span> : racing with excitement : \"흥분으로 요동치고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":64,"text":"My heart, 내 심장은. was racing, 요동치고 있었다. with excitement, 흥분으로. 이 문장 전체를 해석하면, 내 심장은 흥분으로 요동치고 있었다.","hl":"m"},{"n":65,"text":"마지막 문장은 신체 반응을 통해 흥분의 절정을 생생하게 보여 줍니다. was racing은 과거진행형이라서 그 순간 심장이 빠르게 뛰고 있는 상태를 강조해요. with excitement은 그 빠른 심장 박동의 원인이 흥분이라는 것을 덧붙여 줍니다.","hl":"mn"},{"n":66,"text":"열여덟 번째 문장의 어법 첫 번째는 과거진행형입니다. was racing은 be동사 과거형 was와 현재분사 racing이 결합해서 과거의 그 순간에 심장이 요동치고 있던 진행 중인 상태를 나타내요. 두 번째는 전치사구 with excitement입니다. with는 원인이나 수반을 나타내는 전치사이고, excitement가 심장이 빨리 뛴 이유를 덧붙여 주는 표현이에요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>화자는 \u003cb class=\"key\">오디션\u003c/b> 결과를 확인하러 \u003cb class=\"key\">음악실\u003c/b>로 뛰어 들어갔지만, 부원들의 \u003cb class=\"key\">시무룩한 \u003c/b>\u003cb class=\"key\">얼굴\u003c/b>을 보고 실패를 예감했다.\u003c/li>\u003cli>자신들의 \u003cb class=\"key\">오디션\u003c/b>이 \u003cb class=\"key\">완벽\u003c/b>했다고 믿었기에, 화자는 \u003cb class=\"key\">눈물\u003c/b>을 참으며 우승 팀을 물었다.\u003c/li>\u003cli>Immy가 \u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">Happy \u003c/b>\u003cb class=\"key\">Accident\u003c/b>라는 밴드가 우승했다고 말했다가, 이내 \u003cb class=\"key\">장난\u003c/b>임을 밝히며 그게 \u003cb class=\"key\">바로 \u003c/b>\u003cb class=\"key\">우리\u003c/b>라고 알려 주었다.\u003c/li>\u003cli>부원들은 \u003cb class=\"key\">우리가 \u003c/b>\u003cb class=\"key\">해냈다\u003c/b>는 사실에 \u003cb class=\"key\">기쁨\u003c/b>으로 벅차 서로 \u003cb class=\"key\">껴안았다\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A joke about the audition result briefly made the narrator believe they had lost, but the truth that A Happy Accident was their own band filled them with joy.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">오디션 결과를 확인하러 들어온 화자는 부원들의 \u003cb class=\"key\">시무룩한 \u003c/b>\u003cb class=\"key\">얼굴\u003c/b>과 Immy의 말에 실패를 확신하지만, 곧 그것이 \u003cb class=\"key\">장난\u003c/b>이었고 \u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">Happy \u003c/b>\u003cb class=\"key\">Accident\u003c/b>가 바로 자신들임을 알게 되어 \u003cb class=\"key\">기쁨\u003c/b>을 느낀다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":67,"text":"오늘 지문은 짧은 이야기지만 화자의 감정이 실망에서 기쁨으로 바뀌는 반전이 핵심이었어요. 앞부분의 시무룩한 표정과 눈물은 모두 친구들의 장난 때문에 생긴 오해였고, 마지막에 We made it이라는 한마디로 성공이 드러나요. 이런 이야기 구조에서는 시간 흐름과 신호어를 잡고, 성공을 뜻하는 표현이 반복되는지 확인하면 주제를 빠르게 찾을 수 있어요. 오늘 수업은 여기까지예요, 수고 많았어요.","hl":null}]}]});</script></body></html>
