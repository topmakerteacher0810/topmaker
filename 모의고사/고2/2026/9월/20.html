    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}

}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 20번","audioDir":"20_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">20번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Mathematical Literacy and Critical Thinking in Math Education\u003c/h1>\u003ch2>수학 교육에서의 수학적 문해력과 비판적 사고\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>수학적 문해력은 수학이 관련된 사회 문제에 대해 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>로 \u003cb class=\"key\">정보에 \u003c/b>\u003cb class=\"key\">입각한 \u003c/b>\u003cb class=\"key\">결정\u003c/b>을 내리는 능력이며, 이러한 문제는 \u003cb class=\"key\">범교과적 \u003c/b>\u003cb class=\"key\">접근\u003c/b>과 혁신적 교수법을 요구한다. 따라서 수학 교육은 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b> 및 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정 \u003c/b>\u003cb class=\"key\">과정\u003c/b>과의 상호작용 속에서 이루어져야 하고 학생들의 발달을 \u003cb class=\"key\">명시적으로\u003c/b> 지원해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Mathematical literacy means thinking critically about math-related societal issues to make informed decisions, so teaching mathematics must be integrated with critical thinking and decision-making processes.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 수학적 문해력과 비판적 사고의 관계를 다룬 지문을 함께 볼게요. 수학이 단순한 계산이 아니라 사회 문제를 해결하고 정보에 입각한 결정을 내리는 힘이라는 내용이에요. 그래서 수학 교육은 비판적 사고와 의사 결정 과정 속에서 이루어져야 한다는 게 이 글의 요지입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">수학적 문해력은 mathematical literacy라고 하며, 계산 능력뿐 아니라 실생활과 사회 문제에서 수학적으로 추론하고 판단하는 능력이에요. 여기에 critical thinking, 곧 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>가 더해져야 복잡한 문제를 합리적으로 해석할 수 있죠. 예를 들어 뉴스에 나오는 통계 수치를 그대로 믿지 않고 비교하고 해석하는 것도 \u003cb class=\"key\">수학적 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>의 일부예요. OECD의 PISA 평가도 이처럼 \u003cb class=\"key\">실생활 \u003c/b>\u003cb class=\"key\">문제\u003c/b> 해결을 강조하고 있어요. 이 글은 수학 수업이 단순 계산 훈련이 아니라 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>와 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 품어야 한다고 이야기합니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 수학적 문해력이라는 말은 mathematical literacy인데요, 단순히 연산을 잘하는 능력이 아니라 실생활 맥락에서 수학적으로 추론하고 판단하는 능력을 뜻해요. 여기에 critical thinking, 곧 비판적 사고가 더해져야 복잡한 사회 문제를 합리적으로 해석할 수 있죠. 예를 들어 뉴스에서 통계 수치가 나올 때 그 숫자를 그대로 믿기보다 비교하고 해석하는 것이 수학적 문해력이에요. OECD에서도 수학 소양을 평가할 때 실생활 문제 해결을 강조하고 있어요. 그래서 이 지문은 수학 수업이 단순 계산 훈련이 아니라 비판적 사고와 의사 결정 과정을 품어야 한다고 말하는 겁니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>수학적 문해력의 정의와 혁신적 교수법\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>수학적 문해력은 수학이 관련된 사회 문제에 대해 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>로 접근해 \u003cb class=\"key\">정보에 \u003c/b>\u003cb class=\"key\">입각한 \u003c/b>\u003cb class=\"key\">결정\u003c/b>을 내리는 능력이다. 그런 복잡한 문제는 실생활 문제를 반영하므로, \u003cb class=\"key\">범교과적 \u003c/b>\u003cb class=\"key\">접근\u003c/b>으로 다루어야 한다. 이를 위해 수학 교수법을 계획하고 조직하는 \u003cb class=\"key\">혁신적\u003c/b> 방법이 요구된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>세계 탐색과 수학적 사고 기능\u003csmall>주장 · 문장 3\u003c/small>\u003c/h4>\u003cp>세계 탐색은 수량화, 측정, 추산, 분류, 비교, 패턴 발견, 추측, 근거 제시, 증명, 일반화를 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b> 안에서 그리고 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 사용할 때 하는 것을 의미한다. 여기에는 매우 다양한 \u003cb class=\"key\">수학적 \u003c/b>\u003cb class=\"key\">사고 \u003c/b>\u003cb class=\"key\">기능\u003c/b>이 포함된다. 이는 수학이 단순 계산 기술이 아니라 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>와 맞물려 있음을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>의사 결정의 필수 조건\u003csmall>근거 · 문장 4\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정\u003c/b>은 질적인 결정이라도 \u003cb class=\"key\">수학\u003c/b>과 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b> 없이는 가능하지 않다. 이 문장은 앞서 제시한 \u003cb class=\"key\">수학적 \u003c/b>\u003cb class=\"key\">사고 \u003c/b>\u003cb class=\"key\">기능\u003c/b>이 실제 결정에 필수적임을 강조한다. 따라서 수학과 비판적 사고는 선택이 아니라 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정\u003c/b>의 필수 조건이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>수학 교육의 지향점\u003csmall>결론 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">수학 \u003c/b>\u003cb class=\"key\">교육\u003c/b>은 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b> 및 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정 \u003c/b>\u003cb class=\"key\">과정\u003c/b>과의 상호작용 속에서 이루어져야 한다. 이러한 능력들은 수학적 맥락에서 발전될 수 있다. 따라서 학생들이 그것들을 발전시키도록 \u003cb class=\"key\">명시적으로\u003c/b> 도와주어야 한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 이 글의 흐름을 문장 순서대로 짚어 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 첫 문장과 두 번째 문장이에요. 수학적 문해력이 있다는 것은 수학과 관련된 사회적 이슈에 대해 비판적으로 생각하고 정보에 입각한 결정을 내리는 능력이라고 정의해요. 그런 복잡한 문제를 범교과적 접근으로 다루면서 실생활 문제를 반영하려면 수학 교수 방법을 계획하고 조직하는 혁신적인 방법이 필요하다고 연결됩니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 세 번째 문장인데요. 우리가 세상을 탐색한다는 것은 수량화하고 측정하고 추산하고 분류하고 비교하고 패턴을 찾고 추측하고 근거를 제시하고 증명하고 일반화하는 활동을 비판적 사고 안에서 그리고 비판적 사고를 사용할 때 하는 것을 의미해요. 여기서 다양한 수학적 사고 기능이 모두 비판적 사고와 묶여 있다는 점이 중요합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 네 번째 문장이에요. 그래서 질적인 결정조차 수학과 비판적 사고를 사용하지 않고는 가능하지 않다고 말해요. 이 문장은 앞서 말한 수학적 사고 기능이 실제 의사 결정의 필수 조건임을 강조합니다.","hl":"f2"},{"n":7,"text":"마지막 단계는 다섯 번째 문장과 여섯 번째 문장이에요. 따라서 수학을 가르치는 일은 의사 결정 과정과 함께 비판적 사고와의 상호 작용 속에서 이루어져야 한다고 결론 내려요. 그리고 그러한 능력들은 수학적 맥락 안에서 발전될 수 있다고 덧붙이며, 학생들이 그것들을 발전시키도록 명시적으로 도와야 한다고 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 먼저 수학적 문해력의 정의를 제시하고, 세계 탐색에 필요한 \u003cb class=\"key\">수학적 \u003c/b>\u003cb class=\"key\">사고 \u003c/b>\u003cb class=\"key\">기능\u003c/b>과 수학·비판적 사고 없이는 의사 결정이 불가능하다는 근거를 제시한다. 그다음 마지막에 수학 교육은 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b> 및 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정 \u003c/b>\u003cb class=\"key\">과정\u003c/b>과 함께해야 한다는 주장을 도출한다. 따라서 전개 방식은 \u003cb class=\"key\">주장-근거\u003c/b>로 볼 수 있다. 첫 문장에서 개념을 정의하고 마지막 문장에서 핵심 교수 원칙을 제시하므로 \u003cb class=\"key\">미괄식\u003c/b> 구조이며, 주제문은 다섯 번째 문장이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Therefore (4)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003cb>Thus (5)\u003c/b>\u003cspan>최종 주장\u003c/span>\u003cb>so that (6)\u003c/b>\u003cspan>목적·결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">societal issues\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">such complex problems\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">real-world problems\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Navigating our world\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">make informed decisions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">decision-making process\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거 방식으로 전개되고 있어요. 첫 문장에서 수학적 문해력의 정의를 제시하고, 중간 문장들에서는 세상 탐색에 필요한 여러 수학적 사고 기능과 수학과 비판적 사고 없이는 의사 결정이 불가능하다는 근거를 쌓아요. 그리고 마지막 다섯 번째 문장에서 수학 교육을 비판적 사고 및 의사 결정 과정과 함께해야 한다는 핵심 주장을 내놓으니 미괄식 구조로 볼 수 있죠. 핵심 주제문은 다섯 번째 문장입니다.","hl":"ty"},{"n":9,"text":"신호어를 볼까요. 네 번째 문장의 Therefore는 그러므로라는 뜻으로 앞 문장의 내용을 받아 결론을 이끌어요. 다섯 번째 문장의 Thus는 따라서라는 뜻으로 최종 주장을 강조하죠. 여섯 번째 문장의 so that은 목적이나 결과를 나타내며 명시적 지원의 필요성을 덧붙여요. 또 societal issues가 such complex problems와 real-world problems로, make informed decisions가 decision-making process로 바뀌어 반복되니까 이 재진술을 따라가면 글의 초점을 놓치지 않아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>mathematically literate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수학적 문해력이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>think critically\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>비판적으로 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>societal issues\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회적 이슈(문제)\u003c/span>\u003c/div>\u003cdiv>\u003cb>have bearing on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 관련이 있다, ~에 영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>informed decisions\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정보에 입각한 결정\u003c/span>\u003c/div>\u003cdiv>\u003cb>solve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dealing with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 다루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>complex problems\u003c/b>\u003cem>명사\u003c/em>\u003cspan>복잡한 문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>interdisciplinary approaches\u003c/b>\u003cem>명사\u003c/em>\u003cspan>범교과적(학제 간) 접근법\u003c/span>\u003c/div>\u003cdiv>\u003cb>real-world problems\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실생활 문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>innovative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>혁신적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>teaching methods\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교수 방법\u003c/span>\u003c/div>\u003cdiv>\u003cb>navigating\u003c/b>\u003cem>동사\u003c/em>\u003cspan>길을 찾다, 탐색하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quantify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수량화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>measure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>측정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>estimate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추산하다, 어림잡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>classify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분류하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>compare\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비교하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>find patterns\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>패턴을 찾다\u003c/span>\u003c/div>\u003cdiv>\u003cb>conjecture\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추측하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>justify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>근거를 제시하다, 정당화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>prove\u003c/b>\u003cem>동사\u003c/em>\u003cspan>증명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>generalize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일반화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>qualitatively\u003c/b>\u003cem>부사\u003c/em>\u003cspan>질적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>in interaction with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 상호작용하며\u003c/span>\u003c/div>\u003cdiv>\u003cb>decision-making process\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의사 결정 과정\u003c/span>\u003c/div>\u003cdiv>\u003cb>mathematical context\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수학적 맥락\u003c/span>\u003c/div>\u003cdiv>\u003cb>no excuse\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변명의 여지가 없음\u003c/span>\u003c/div>\u003cdiv>\u003cb>explicitly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>명시적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>support\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지원하다, 뒷받침하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개만 짚을게요. mathematically literate는 수학적 문해력이 있는 이라는 뜻이고, have bearing on은 관련이 있다는 표현이에요. interdisciplinary approaches는 범교과적 접근법, conjecture는 추측하다, justify는 근거를 제시하다, explicitly는 명시적으로 같은 뜻이니 반드시 외워 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">literate\u003c/b>\u003cspan class=\"m\">글을 읽고 쓸 수 있는, 학식 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">educated\u003c/span>\u003cspan class=\"s\">learned\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">illiterate\u003c/span>\u003cspan class=\"a\">ignorant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">complex\u003c/b>\u003cspan class=\"m\">복잡한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">complicated\u003c/span>\u003cspan class=\"s\">intricate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">simple\u003c/span>\u003cspan class=\"a\">basic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">innovative\u003c/b>\u003cspan class=\"m\">혁신적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">creative\u003c/span>\u003cspan class=\"s\">original\u003c/span>\u003cspan class=\"s\">novel\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conventional\u003c/span>\u003cspan class=\"a\">traditional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">navigate\u003c/b>\u003cspan class=\"m\">탐색하다, 길을 찾다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guide\u003c/span>\u003cspan class=\"s\">steer\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">mislead\u003c/span>\u003cspan class=\"a\">confuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">conjecture\u003c/b>\u003cspan class=\"m\">추측하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guess\u003c/span>\u003cspan class=\"s\">speculate\u003c/span>\u003cspan class=\"s\">hypothesize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prove\u003c/span>\u003cspan class=\"a\">verify\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">justify\u003c/b>\u003cspan class=\"m\">근거를 제시하다, 정당화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">defend\u003c/span>\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"s\">rationalize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">contradict\u003c/span>\u003cspan class=\"a\">disprove\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">generalize\u003c/b>\u003cspan class=\"m\">일반화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">universalize\u003c/span>\u003cspan class=\"s\">broaden\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">specify\u003c/span>\u003cspan class=\"a\">particularize\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">explicitly\u003c/b>\u003cspan class=\"m\">명시적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clearly\u003c/span>\u003cspan class=\"s\">expressly\u003c/span>\u003cspan class=\"s\">definitely\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">implicitly\u003c/span>\u003cspan class=\"a\">vaguely\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 챙겨 볼게요. literate는 educated나 learned와 비슷하고, illiterate나 ignorant와 반대예요. complex는 complicated나 intricate와 동의어이고 simple이나 basic과 반대죠. innovative는 creative나 novel과 가깝고 conventional이나 traditional과 반대예요. conjecture는 guess나 speculate과 비슷하고 prove나 verify와 반대이며, explicitly는 clearly와 비슷하고 implicitly와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수학적 문해력이 있다는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">mathematically \u003c/span>\u003cspan class=\"tgt\">literate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비판적으로 생각할 수 있다는 것을 의미한다\u003c/span>\u003cspan class=\"en\">means \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">critically\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수학이 관련된 사회적 이슈에 대해\u003c/span>\u003cspan class=\"en\">about societal issues \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">mathematics \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">bearing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정보에 입각한 결정을 내리기 위해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">informed \u003c/span>\u003cspan class=\"tgt\">decisions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 문제들을 어떻게 해결할지에 대해.\u003c/span>\u003cspan class=\"en\">about how to solve these problems.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수학적 문해력이 있다는 것은 수학과 관련된 사회적 이슈에 대해 이러한 문제들을 어떻게 해결할지에 대한 정보에 입각한 결정을 하기 위해서 비판적으로 생각할 수 있다는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">수학적 \u003c/b>\u003cb class=\"key\">문해력\u003c/b>의 정의를 내립니다. 수학이 관련된 사회 문제를 해결하기 위해 \u003cb class=\"key\">정보에 \u003c/b>\u003cb class=\"key\">입각한 \u003c/b>\u003cb class=\"key\">결정\u003c/b>을 하려면 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>가 필요하다는 핵심 개념을 제시해요. 글 전체의 출발점이 되는 정의 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(주어)\u003c/span> : To be mathematically literate + means ~ : \"수학적 문해력이 있다는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : means + [to be able to think critically] : \"비판적으로 생각할 수 있다는 것을 의미한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사＋관계대명사\u003c/span> : societal issues + on which + mathematics has bearing : \"수학이 관련된 사회적 이슈\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">so as to의 부사적 용법(목적)\u003c/span> : so as to + make informed decisions : \"정보에 입각한 결정을 내리기 위해서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"To be mathematically literate, 수학적 문해력이 있다는 것은. means to be able to think critically, 비판적으로 생각할 수 있다는 것을 의미한다. about societal issues on which mathematics has bearing, 수학이 관련된 사회적 이슈에 대해. so as to make informed decisions, 정보에 입각한 결정을 내리기 위해서. about how to solve these problems, 이러한 문제들을 어떻게 해결할지에 대해.. 이 문장 전체를 해석하면, 수학적 문해력이 있다는 것은 수학과 관련된 사회적 이슈에 대해 이러한 문제들을 어떻게 해결할지에 대한 정보에 입각한 결정을 하기 위해서 비판적으로 생각할 수 있다는 것을 의미한다.","hl":"m"},{"n":13,"text":"이 문장은 수학적 문해력의 정의를 제시합니다. 수학이 관련된 사회 문제를 해결하기 위해 정보에 입각한 결정을 내리려면 비판적으로 생각할 수 있어야 한다는 뜻이에요. 즉 수학적 문해력은 단순 계산이 아니라 비판적 사고와 의사결정까지 포함하는 능력이죠.","hl":"mn"},{"n":14,"text":"첫 번째, To be mathematically literate는 to부정사가 문장 맨 앞에서 주어로 쓰였어요. 수학적 문해력이 있다는 것은 이라고 해석하죠. 두 번째, means to be able to think critically는 동사 means의 목적어로 to부정사 명사적 용법이 왔어요. 세 번째, on which mathematics has bearing에서 on which는 전치사와 관계대명사가 결합한 형태예요. 선행사는 societal issues이고 mathematics has bearing on the issues라는 관계가 성립해요. 네 번째, so as to make informed decisions는 목적을 나타내는 부사적 용법이에요. 정보에 입각한 결정을 내리기 위해서라는 뜻이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">범교과적인 접근법을 통해 그러한 복잡한 문제들을 다루는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Dealing \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">complex \u003c/span>\u003cspan class=\"tgt\">problems \u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">interdisciplinary \u003c/span>\u003cspan class=\"tgt\">approaches\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실생활 문제들을 반영하는 것은 혁신적인 방법들을 요구한다\u003c/span>\u003cspan class=\"en\">mirroring real-world problems \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">requires \u003c/span>\u003cspan class=\"tgt\">innovative \u003c/span>\u003cspan class=\"tgt\">ways\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수학적 교수 방법을 계획하고 조직하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">planning \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">organizing \u003c/span>\u003cspan class=\"tgt\">mathematical \u003c/span>\u003cspan class=\"tgt\">teaching \u003c/span>\u003cspan class=\"tgt\">methods\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">범교과적인 접근법을 통해 그러한 복잡한 문제들을 다루는 과정에서 실생활 문제들을 반영하는 것은 수학적 교수 방법을 계획하고 조직하는 혁신적인 방법들을 요구한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">범교과적 \u003c/b>\u003cb class=\"key\">접근\u003c/b>으로 \u003cb class=\"key\">실생활 \u003c/b>\u003cb class=\"key\">문제\u003c/b>를 다루는 수업이 필요하며, 이를 위해 수학 교수법을 \u003cb class=\"key\">혁신적\u003c/b>으로 계획하고 조직해야 한다고 말합니다. 복잡한 실제 문제를 반영할수록 기존의 전통적인 수업 방식으로는 부족하다는 점을 강조해요. 앞 문장의 수학적 문해력 정의를 교육 방법으로 연결하는 역할입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : Dealing with + such complex problems + through interdisciplinary approaches : \"범교과적인 접근법을 통해 그러한 복잡한 문제들을 다루는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수 일치\u003c/span> : [동명사구 주어] + requires + innovative ways : \"혁신적인 방법들을 요구한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사의 병렬\u003c/span> : of + planning and organizing + mathematical teaching methods : \"수학적 교수 방법을 계획하고 조직하는 것의\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Dealing with such complex problems through interdisciplinary approaches, 범교과적인 접근법을 통해 그러한 복잡한 문제들을 다루는 것은. mirroring real-world problems requires innovative ways, 실생활 문제들을 반영하는 것은 혁신적인 방법들을 요구한다. of planning and organizing mathematical teaching methods, 수학적 교수 방법을 계획하고 조직하는. 이 문장 전체를 해석하면, 범교과적인 접근법을 통해 그러한 복잡한 문제들을 다루는 과정에서 실생활 문제들을 반영하는 것은 수학적 교수 방법을 계획하고 조직하는 혁신적인 방법들을 요구한다.","hl":"m"},{"n":16,"text":"이 문장은 복잡한 문제를 범교과적으로 다루고 실생활 문제를 반영하려면, 수학 수업을 계획하고 조직하는 방식이 혁신적으로 바뀌어야 한다는 뜻이에요. 즉 실제 세계의 복합적 문제를 반영한 수업이 필요하고, 여기에는 기존과 다른 교수법이 요구된다는 주장이 담겨 있어요.","hl":"mn"},{"n":17,"text":"첫 번째, Dealing with such complex problems through interdisciplinary approaches는 동명사구가 주어로 쓰였어요. 주어가 길지만 전체를 하나로 보고 requires라는 단수 동사가 왔죠. 두 번째, requires innovative ways는 주어인 동명사구를 단수로 받아서 3인칭 단수형 requires를 쓴 거예요. 세 번째, of planning and organizing mathematical teaching methods에서 planning과 organizing은 전치사 of의 목적어로 쓰인 동명사예요. and로 병렬 연결되어 있어서 수학적 교수 방법을 계획하고 조직하는 것이라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 세계를 탐색한다는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Navigating \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수량화하고, 측정하고, 추산하고, 분류하고, 비교할 수 있다는 것을 의미한다\u003c/span>\u003cspan class=\"en\">means \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">quantify\u003c/span>, measure, estimate, classify, compare,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">패턴을 찾고, 추측하고, 근거를 제시하고, 증명하고, 일반화하는\u003c/span>\u003cspan class=\"en\">find patterns, conjecture, justify, prove, and generalize\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비판적 사고 안에서 그리고 비판적 사고를 사용할 때\u003c/span>\u003cspan class=\"en\">within critical thinking and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">critical \u003c/span>\u003cspan class=\"tgt\">thinking\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 세계를 탐색한다는 것은 비판적 사고 안에서 그리고 비판적 사고를 사용할 때 수량화하고, 측정하고, 추산하고, 분류하고, 비교하고, 패턴을 찾고, 추측하고, 근거를 제시하고, 증명하고, 일반화할 수 있다는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 세상을 탐색한다는 것이 구체적으로 어떤 수학적 사고 활동을 포함하는지 열거합니다. 수량화, 측정, 추산, 분류, 비교, 패턴 찾기, 추측, 근거 제시, 증명, 일반화 같은 \u003cb class=\"key\">수학적 \u003c/b>\u003cb class=\"key\">사고 \u003c/b>\u003cb class=\"key\">기능\u003c/b>이 모두 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b> 안에서 이루어져야 한다는 점을 강조해요. 수학적 활동이 비판적 사고와 분리될 수 없다는 논지를 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : Navigating our world + means ~ : \"우리의 세계를 탐색한다는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be able to 관용 표현\u003c/span> : means + being able to quantify : \"수량화할 수 있다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : when + using critical thinking : \"비판적 사고를 사용할 때\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Navigating our world, 우리의 세계를 탐색한다는 것은. means being able to quantify, measure, estimate, classify, compare, 수량화하고, 측정하고, 추산하고, 분류하고, 비교할 수 있다는 것을 의미한다. find patterns, conjecture, justify, prove, and generalize, 패턴을 찾고, 추측하고, 근거를 제시하고, 증명하고, 일반화하는. within critical thinking and when using critical thinking, 비판적 사고 안에서 그리고 비판적 사고를 사용할 때. 이 문장 전체를 해석하면, 우리의 세계를 탐색한다는 것은 비판적 사고 안에서 그리고 비판적 사고를 사용할 때 수량화하고, 측정하고, 추산하고, 분류하고, 비교하고, 패턴을 찾고, 추측하고, 근거를 제시하고, 증명하고, 일반화할 수 있다는 것을 의미한다.","hl":"m"},{"n":19,"text":"세 번째 문장은 세상을 탐색한다는 것이 구체적으로 어떤 수학적 사고 활동을 포함하는지 열거합니다. 수량화, 측정, 추산, 분류, 비교, 패턴 찾기, 추측, 근거 제시, 증명, 일반화 같은 활동이 모두 비판적 사고 안에서 이루어져야 한다는 점이 중요해요. 즉 이런 수학적 기술들을 단순히 기계적으로 하는 것이 아니라 비판적으로 사용할 때 의미가 있다는 거죠.","hl":"mn"},{"n":20,"text":"첫 번째, Navigating our world는 동명사구가 주어로 쓰였어요. 우리의 세계를 탐색한다는 것은 이라고 해석하고 뒤에 means라는 단수 동사가 옵니다. 두 번째, being able to quantify에서 be able to는 can과 비슷한 능력 표현이에요. 여기서 being은 동사 means의 목적어로 쓰인 동명사라서 being able to quantify는 수량화할 수 있다는 것이라고 해석해요. 세 번째, when using critical thinking은 when we use critical thinking이 줄어든 분사구문이에요. 비판적 사고를 사용할 때 라고 해석하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사 결정을 하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">decisions\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">질적인 경우에라도\u003c/span>\u003cspan class=\"en\">even qualitatively,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능하지 않다\u003c/span>\u003cspan class=\"en\">is not possible\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수학과 비판적 사고를 사용하지 않고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">mathematics \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">critical \u003c/span>\u003cspan class=\"tgt\">thinking\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로, 수학과 비판적 사고를 사용하지 않고 의사 결정을 하는 것은 질적인 경우에라도 가능하지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 세상을 살아가는 데 \u003cb class=\"key\">수학\u003c/b>과 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>가 필요하다는 내용을 이어받아, 의사 결정은 수학과 비판적 사고 없이는 질적인 판단조차 불가능하다는 점을 강조한다. even qualitatively는 '질적인 경우에라도'로, 수치 계산이 아닌 질적 판단마저 예외가 아님을 보여 준다. 따라서 수학과 비판적 사고가 단순한 도구가 아니라 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정\u003c/b>의 필수 조건임을 이끌어 낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구의 주어 역할\u003c/span> : Making decisions + is not possible : \"의사 결정을 하는 것은 ~ 가능하지 않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 without + 동명사구\u003c/span> : without + using mathematics and critical thinking : \"수학과 비판적 사고를 사용하지 않고\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Therefore, 그러므로. making decisions, 의사 결정을 하는 것은. even qualitatively, 질적인 경우에라도. is not possible, 가능하지 않다. without using mathematics and critical thinking, 수학과 비판적 사고를 사용하지 않고. 이 문장 전체를 해석하면, 그러므로, 수학과 비판적 사고를 사용하지 않고 의사 결정을 하는 것은 질적인 경우에라도 가능하지 않다.","hl":"m"},{"n":22,"text":"이 문장은 앞 문장의 흐름을 이어서 수학과 비판적 사고 없이는 의사 결정이 불가능하다는 점을 강조합니다. even qualitatively가 들어가 있어서 단순한 수치 계산뿐 아니라 질적인 판단조차 예외가 아니라는 뜻이에요. 따라서 수학과 비판적 사고가 의사 결정의 필수 조건이라는 핵심 주장을 펼치는 문장입니다.","hl":"mn"},{"n":23,"text":"첫 번째, making decisions는 동명사구가 문장의 주어로 쓰였어요. 의사 결정을 하는 것이라는 의미로 단수 취급을 해서 is를 받아요. 두 번째, without using mathematics and critical thinking에서 without은 전치사라서 뒤에 동명사 using이 왔어요. 따라서 수학과 비판적 사고를 사용하지 않고라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서\u003c/span>\u003cspan class=\"en\">Thus,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수학을 가르치는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">teaching \u003c/span>\u003cspan class=\"tgt\">mathematics\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이루어져야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">done\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비판적 사고와의 상호 작용 안에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">interaction \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">critical \u003c/span>\u003cspan class=\"tgt\">thinking \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사 결정 과정과 함께\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">along \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">decision-making \u003c/span>\u003cspan class=\"tgt\">process\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서, 수학을 가르치는 것은 의사 결정 과정과 함께 비판적 사고와의 상호 작용 안에서 이루어져야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 수학과 비판적 사고 없이는 의사 결정이 불가능하다고 했으므로, 이 문장은 수학 교육이 나아가야 할 방향을 제시한다. 수학을 가르칠 때 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>와 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정 \u003c/b>\u003cb class=\"key\">과정\u003c/b>이 서로 분리되지 않고 상호 작용 속에서 이루어져야 한다는 뜻이다. in interaction with는 '상호 작용 안에서'로, 단순 지식 전달이 아니라 사고 과정과 결정 과정을 통합해야 한다는 주장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구의 주어 역할\u003c/span> : Teaching mathematics + should be done : \"수학을 가르치는 것은 이루어져야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 should + 수동태\u003c/span> : should + be + done(과거분사) : \"이루어져야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구의 병렬 수반 구조\u003c/span> : in interaction with A along with B : \"A와의 상호 작용 속에서 B와 함께\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Thus, 따라서. teaching mathematics, 수학을 가르치는 것은. should be done, 이루어져야 한다. in interaction with critical thinking, 비판적 사고와의 상호 작용 안에서. along with a decision-making process, 의사 결정 과정과 함께. 이 문장 전체를 해석하면, 따라서, 수학을 가르치는 것은 의사 결정 과정과 함께 비판적 사고와의 상호 작용 안에서 이루어져야 한다.","hl":"m"},{"n":25,"text":"이 문장은 수학 수업이 단순히 수학 지식만 가르치는 것이 아니라 비판적 사고와 의사 결정 과정이 함께 일어나도록 설계되어야 한다는 결론을 내려 줍니다. 앞 문장에서 수학과 비판적 사고 없이는 의사 결정이 불가능하다고 했기 때문에 수학 교육에서 그 둘을 통합해야 한다는 논리예요. should be done은 의무라기보다는 바람직한 방향을 나타내는 조동사 표현으로 보면 됩니다.","hl":"mn"},{"n":26,"text":"첫 번째, teaching mathematics는 동명사구가 주어로 쓰였습니다. 수학을 가르치는 것이라는 뜻이죠. 두 번째, should be done은 조동사 should 뒤에 be done이 와서 이루어져야 한다는 수동태 표현입니다. 세 번째, in interaction with critical thinking과 along with a decision-making process는 전치사구가 이어져서 비판적 사고와 의사 결정 과정이 함께 수반된다는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은\u003c/span>\u003cspan class=\"en\">They\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발전될 수 있고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">developed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수학적인 맥락 안에서\u003c/span>\u003cspan class=\"en\">into the mathematical context,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 변명의 여지가 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> there is no excuse\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들을 명시적으로 지원하지 않을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">explicitly \u003c/span>\u003cspan class=\"tgt\">support \u003c/span>\u003cspan class=\"tgt\">students\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 발전시키도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">develop \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 수학적인 맥락 안에서 발전될 수 있고, 학생들이 그것들을 발전시킬 수 있도록 명시적으로 도움을 주지 않을 경우 변명의 여지가 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장의 They는 앞 문장에서 언급한 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>와 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정 \u003c/b>\u003cb class=\"key\">과정\u003c/b>을 가리킨다. 그 능력들은 수학적 맥락 속에서도 충분히 길러질 수 있으므로, 교사가 학생들에게 그것들을 키우도록 명시적으로 지도하지 않는 것은 \u003cb class=\"key\">핑계\u003c/b>가 될 수 없다고 강조한다. 결국 수학 수업에서 비판적 사고와 의사 결정 능력을 가르치는 것이 \u003cb class=\"key\">교사의 \u003c/b>\u003cb class=\"key\">책임\u003c/b>이라는 메시지를 전한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 수동태\u003c/span> : can + be + developed(과거분사) : \"발전될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">결과를 나타내는 접속사 so that\u003c/span> : S + V, so that S + V : \"그래서 ~하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사구의 형용사적 용법 (excuse 수식)\u003c/span> : no excuse + to not explicitly support students : \"학생들을 명시적으로 지원하지 않을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : support students + to develop them : \"그것들을 발전시키도록\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"They, 그것들은. can be developed, 발전될 수 있고. into the mathematical context, 수학적인 맥락 안에서. so that there is no excuse, 그래서 변명의 여지가 없다. to not explicitly support students, 학생들을 명시적으로 지원하지 않을. to develop them, 그것들을 발전시키도록. 이 문장 전체를 해석하면, 그것들은 수학적인 맥락 안에서 발전될 수 있고, 학생들이 그것들을 발전시킬 수 있도록 명시적으로 도움을 주지 않을 경우 변명의 여지가 없다.","hl":"m"},{"n":28,"text":"이 문장에서 They는 앞 문장에 나온 비판적 사고와 의사 결정 과정을 가리킵니다. 그런 능력들은 수학적 맥락 안에서도 충분히 길러질 수 있고, 그래서 교사가 학생들에게 그것들을 키워 주도록 명시적으로 도와주지 않을 변명의 여지가 없다는 뜻입니다. 결국 수학 수업에서 비판적 사고와 의사 결정 능력을 가르치는 것이 교사의 책임이라는 메시지를 전해요.","hl":"mn"},{"n":29,"text":"첫 번째, can be developed는 조동사 can 뒤에 수동태 be developed가 와서 발전될 수 있다는 뜻입니다. 두 번째, so that 이하는 결과를 나타내는 접속사로 그래서 변명의 여지가 없다로 해석합니다. 세 번째, to not explicitly support students는 no excuse를 수식하는 to부정사구로, to와 support 사이에 not explicitly가 있는 분리 부정사 형태예요. 네 번째, to develop them은 그것들을 발전시키도록이라는 목적의 의미를 나타냅니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>수학적 문해력은 수학이 관련된 사회 문제에 대해 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>로 \u003cb class=\"key\">정보에 \u003c/b>\u003cb class=\"key\">입각한 \u003c/b>\u003cb class=\"key\">결정\u003c/b>을 내리는 능력이다.\u003c/li>\u003cli>실생활 문제를 반영한 복잡한 문제는 \u003cb class=\"key\">범교과적 \u003c/b>\u003cb class=\"key\">접근\u003c/b>과 혁신적인 \u003cb class=\"key\">수학적 \u003c/b>\u003cb class=\"key\">교수 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 요구한다.\u003c/li>\u003cli>세계 탐색에는 수량화, 측정, 패턴 발견, 증명, 일반화 등이 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b> 안에서 사용된다.\u003c/li>\u003cli>따라서 수학 교육은 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b> 및 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정 \u003c/b>\u003cb class=\"key\">과정\u003c/b>과의 상호작용 속에서 이루어져야 하고, 학생들의 발달을 \u003cb class=\"key\">명시적으로\u003c/b> 지원해야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Mathematical literacy means thinking critically about math-related societal issues to make informed decisions, so teaching mathematics must be integrated with critical thinking and decision-making processes.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">수학적 문해력은 수학이 관련된 사회 문제에 대해 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>로 \u003cb class=\"key\">정보에 \u003c/b>\u003cb class=\"key\">입각한 \u003c/b>\u003cb class=\"key\">결정\u003c/b>을 내리는 능력이며, 이러한 문제는 \u003cb class=\"key\">범교과적 \u003c/b>\u003cb class=\"key\">접근\u003c/b>과 혁신적 교수법을 요구한다. 따라서 수학 교육은 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">사고\u003c/b> 및 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">결정 \u003c/b>\u003cb class=\"key\">과정\u003c/b>과의 상호작용 속에서 이루어져야 하고 학생들의 발달을 \u003cb class=\"key\">명시적으로\u003c/b> 지원해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 지문을 정리하면, 수학적 문해력은 사회 문제에 대한 비판적 사고와 정보에 입각한 결정을 요구하고, 이것이 곧 수학 교육이 비판적 사고와 의사 결정 과정 속에서 이루어져야 하는 이유입니다. 여러분도 수학을 실생활 문제를 해결하는 도구로, 그리고 생각하는 힘과 연결해서 공부해 보세요. 오늘 수업은 여기까지예요. 수고 많았어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
