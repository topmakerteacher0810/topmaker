</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"일등급샘 아카이브","title":"2026년 고2 9월 모의고사 20번","audioDir":"20_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">20번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Choosing the Right Readers for Your Story: Insight Over Closeness\u003c/h1>\u003ch2>자신의 글을 보여줄 독자 선택하기: 친밀감보다 비판적 통찰력\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>글에 대해 스스로 \u003cb class=\"key\">최선의 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 다한 후에는, 단순히 친밀한 사람이 아닌 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">통찰력\u003c/b>을 가진 동료 작가나 전문가에게 피드백을 구해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>You should seek feedback from readers who offer critical insight, such as fellow writers, rather than those close to you.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 우리가 함께 공부할 지문은 2026년 고2 9월 모의고사 스무 번째 문항입니다. 이 글은 여러분이 쓴 글을 언제, 그리고 누구에게 보여주어 피드백을 받아야 하는지에 대한 아주 현실적인 조언을 담고 있어요. 결론부터 말씀드리면, 내가 만족할 때까지 고친 후 비판적 통찰력이 있는 사람에게 보여주라는 것이 핵심입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">글쓰기는 창의적인 작업이면서 동시에 객관적인 평가가 필요한 과정입니다. 작가는 자신의 글에 대해 \u003cb class=\"key\">주관적\u003c/b>일 수밖에 없기 때문에, 외부의 시선인 \u003cb class=\"key\">피드백(Feedback)\u003c/b>이 필수적입니다. 하지만 이때 주의할 점은 '누구에게 보여줄 것인가'입니다. 비유하자면, 내가 요리한 음식을 \u003cb class=\"key\">어머니\u003c/b>께 드리면 항상 맛있다고 하시겠지만, \u003cb class=\"key\">요리사\u003c/b>에게 드리면 보완할 점을 정확히 짚어주는 것과 같습니다. 전문 용어로 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">통찰력(Critical \u003c/b>\u003cb class=\"key\">Insight)\u003c/b>이란 글의 구조적 결함이나 개선점을 냉철하게 분석하는 능력을 말합니다. 고등학생 여러분도 수행평가나 논술을 쓸 때, 친한 친구보다는 내용을 잘 아는 \u003cb class=\"key\">동료나 \u003c/b>\u003cb class=\"key\">선생님\u003c/b>께 검토받는 것이 실력 향상에 더 유리하다는 점을 기억하세요.\u003c/div>","segs":[{"n":2,"text":"우리가 무언가를 창작하면 주변 사람들에게 자랑하고 싶어지죠? 하지만 글쓰기라는 과정에서는 누군가의 평가가 실력을 키우는 아주 중요한 역할을 합니다. 여기서 중요한 건, 무조건적인 칭찬보다는 글의 문제점을 정확히 봐줄 비판적 통찰력이 필요하다는 거예요. 부모님이나 친한 친구는 여러분을 사랑하기 때문에 냉정한 평가를 내리기 어렵다는 점을 먼저 이해해야 합니다. 작가들이 모여 서로의 글을 합평하는 작가 모임이나 수업이 존재하는 이유도 바로 이런 객관적인 시각을 확보하기 위해서랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>공유의 전제 조건\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>작품을 남에게 보여주기 전에 먼저 작성자 스스로가 \u003cb class=\"key\">최선의 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 다해 그 결과물에 \u003cb class=\"key\">만족하는 \u003c/b>\u003cb class=\"key\">상태\u003c/b>가 되어야 함을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>지인 피드백의 한계\u003csmall>통념 및 반박 · 문장 2\u003c/small>\u003c/h4>\u003cp>가장 가깝고 소중한 사람들에게 글을 보여주는 것은 자연스러운 일이지만, 실제 \u003cb class=\"key\">작품의 \u003c/b>\u003cb class=\"key\">발전\u003c/b>을 위한 실질적인 \u003cb class=\"key\">이득\u003c/b>을 기대하기는 어렵습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>독자 선택의 기준\u003csmall>주장 · 문장 3\u003c/small>\u003c/h4>\u003cp>피드백의 가치는 관계의 \u003cb class=\"key\">친밀함\u003c/b>이 아니라, 독자가 가진 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">통찰력\u003c/b>에서 나오므로 이를 기준으로 독자를 선별해야 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>최적의 조언자와 선별 방법\u003csmall>근거 및 결론 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">동료 \u003c/b>\u003cb class=\"key\">작가\u003c/b>가 가장 이상적인 독자이며, \u003cb class=\"key\">작가 \u003c/b>\u003cb class=\"key\">모임\u003c/b> 등의 경험을 통해 누구의 의견이 실제로 도움이 되는지 파악하여 조언자를 선택해야 합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문의 논리적인 흐름을 문장별로 하나씩 따라가 볼까요?","hl":null},{"n":4,"text":"첫 번째 문장에서는 글을 공개하는 시점에 대해 말하고 있습니다. 남에게 보여주기 전에 우선 본인이 할 수 있는 최선을 다해서 스스로 만족하는 상태가 되어야 한다는 전제 조건을 강조하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 문장에서는 가까운 사람들에게 글을 보여주는 것이 나쁜 건 아니지만, 그들에게서 작품에 큰 이득이 될 만한 견해를 기대하지는 말라고 경고합니다. 지인의 피드백에는 한계가 있다는 통념을 짚어준 거예요.","hl":"f1"},{"n":6,"text":"세 번째 문장이 이 글의 핵심 주장입니다. 가치 있는 피드백은 관계의 친밀함이 아니라 독자의 비판적 통찰력에서 나온다는 거죠. 따라서 독자를 선택할 때 이 통찰력을 기준으로 삼아야 한다고 말합니다.","hl":"f2"},{"n":7,"text":"마지막으로 네 번째와 다섯 번째 문장에서는 구체적인 대안을 제시합니다. 동료 작가가 가장 이상적이며, 작가 모임이나 수업을 통해 과거에 누가 유익한 의견을 주었는지 기억해 두었다가 그들에게 도움을 요청하라고 조언하며 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 작품을 공유하기 위한 \u003cb class=\"key\">시기적 \u003c/b>\u003cb class=\"key\">전제\u003c/b>를 제시하며 독자의 주의를 환기합니다. 이후 독자 선택에서 \u003cb class=\"key\">친밀함\u003c/b>보다는 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">통찰력\u003c/b>이 중요하다는 핵심 주장을 펼칩니다. 마지막으로 \u003cb class=\"key\">동료 \u003c/b>\u003cb class=\"key\">작가\u003c/b>라는 구체적인 대상을 언급하며, 과거의 경험을 바탕으로 \u003cb class=\"key\">유익한 \u003c/b>\u003cb class=\"key\">조언자\u003c/b>를 가려내야 한다는 실천적인 근거를 제시하며 글을 맺습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Only when (1)\u003c/b>\u003cspan>강조를 통한 조건 제시\u003c/span>\u003cb>but (2)\u003c/b>\u003cspan>지인 피드백의 한계 지적\u003c/span>\u003cb>likely to come from (3)\u003c/b>\u003cspan>가치 있는 피드백의 출처 명시\u003c/span>\u003cb>Fellow writers (4)\u003c/b>\u003cspan>구체적인 대안 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">your story\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">your work\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">valuable feedback\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">critical insight\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">whose opinions have been helpful\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Nearest and dearest (지인)\u003c/th>\u003cth>Fellow writers / Critical readers (전문가/동료)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>친밀함(Closeness)\u003c/td>\u003ctd>비판적 통찰력(Critical Insight)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>괜찮음(Fine) / 큰 이득 없음\u003c/td>\u003ctd>가장 가치 있는 피드백(Most valuable)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 주장과 근거의 구조를 취하고 있습니다. 특히 첫 문장에서 강조 구문을 통해 주제를 던지는 두괄식 구성을 보이고 있죠. 작가로서 가져야 할 태도와 독자를 고르는 구체적인 방법론을 순차적으로 설명하고 있습니다.","hl":"ty"},{"n":9,"text":"첫 번째 문장의 Only when은 강한 조건을 걸어 주제를 부각합니다. 두 번째 문장의 but은 지인 피드백에 대한 기대를 꺾으며 반전을 주죠. 또 세 번째 문장의 closeness와 critical insight의 대조를 통해 우리가 추구해야 할 가치가 무엇인지 명확하게 보여주고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>best you can\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>할 수 있는 최선\u003c/span>\u003c/div>\u003cdiv>\u003cb>happy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>만족하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>show\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>someone else\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다른 누군가\u003c/span>\u003c/div>\u003cdiv>\u003cb>may well\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 것도 당연하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>nearest and dearest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가장 가깝고 소중한 사람들\u003c/span>\u003c/div>\u003cdiv>\u003cb>most cases\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대부분의 경우\u003c/span>\u003c/div>\u003cdiv>\u003cb>look to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 도움을 구하다, ~에 기대다\u003c/span>\u003c/div>\u003cdiv>\u003cb>benefit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이득, 혜택\u003c/span>\u003c/div>\u003cdiv>\u003cb>valuable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가치 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>feedback\u003c/b>\u003cem>명사\u003c/em>\u003cspan>피드백, 반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>likely to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 가능성이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>source\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원천, 출처\u003c/span>\u003c/div>\u003cdiv>\u003cb>critical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비판적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>insight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통찰력\u003c/span>\u003c/div>\u003cdiv>\u003cb>closeness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>친밀함\u003c/span>\u003c/div>\u003cdiv>\u003cb>fellow\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>동료의\u003c/span>\u003c/div>\u003cdiv>\u003cb>ideal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>imagine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상상하다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>writers' circle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작가 모임\u003c/span>\u003c/div>\u003cdiv>\u003cb>admire\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동경하다, 칭찬하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>past\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과거\u003c/span>\u003c/div>\u003cdiv>\u003cb>opinion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의견\u003c/span>\u003c/div>\u003cdiv>\u003cb>helpful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>도움이 되는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 critical이라는 단어는 나쁘게 말하는 비난이 아니라, 분석적으로 따져보는 비판적이라는 의미로 쓰였습니다. insight는 글의 내면을 꿰뚫어 보는 통찰력을 뜻하죠. 그리고 nearest and dearest는 가장 가깝고 소중한 사람들, 즉 가족이나 절친한 친구를 가리키는 관용적인 표현이니 꼭 외워두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">valuable\u003c/b>\u003cspan class=\"m\">가치 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">precious\u003c/span>\u003cspan class=\"s\">priceless\u003c/span>\u003cspan class=\"s\">worthwhile\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worthless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">insight\u003c/b>\u003cspan class=\"m\">통찰력\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">perception\u003c/span>\u003cspan class=\"s\">discernment\u003c/span>\u003cspan class=\"s\">acumen\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">benefit\u003c/b>\u003cspan class=\"m\">이득\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">advantage\u003c/span>\u003cspan class=\"s\">profit\u003c/span>\u003cspan class=\"s\">gain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disadvantage\u003c/span>\u003cspan class=\"a\">loss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ideal\u003c/b>\u003cspan class=\"m\">이상적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">perfect\u003c/span>\u003cspan class=\"s\">optimal\u003c/span>\u003cspan class=\"s\">exemplary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">flawed\u003c/span>\u003cspan class=\"a\">imperfect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">critical\u003c/b>\u003cspan class=\"m\">비판적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">analytical\u003c/span>\u003cspan class=\"s\">evaluative\u003c/span>\u003cspan class=\"s\">discerning\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uncritical\u003c/span>\u003cspan class=\"a\">complimentary\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 어휘인 valuable은 귀중한이라는 뜻으로 precious와 동의어입니다. 반대로 가치 없다는 worthless라고 하죠. 또한 ideal은 가장 완벽하고 이상적인 상태를 말하며, optimal과 비슷한 맥락으로 쓰일 수 있습니다. 통찰력을 뜻하는 insight도 perception 같은 단어와 함께 묶어서 정리해 두면 좋습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 오직 만족할 때만\u003c/span>\u003cspan class=\"en\">Only when you're happy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 할 수 있는 최선을 다했다는 것에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">you've \u003c/span>\u003cspan class=\"tgt\">done\u003c/span> the best you can\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 이야기에 대해\u003c/span>\u003cspan class=\"en\">for your story\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 다른 사람에게 보여 주어야 한다.\u003c/span>\u003cspan class=\"en\">should you show it to someone else.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 자신의 이야기에 대해 스스로 할 수 있는 최선을 다해서 만족할 때만 그것을 다른 사람에게 보여 주어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글을 남에게 보여주기 전에 스스로 \u003cb class=\"key\">완성도\u003c/b>를 최대한으로 높이는 과정이 반드시 선행되어야 함을 강조합니다. 즉, 성급하게 피드백을 구하기보다는 본인 스스로의 \u003cb class=\"key\">만족\u003c/b>이 우선이라는 점을 명시하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사 뒤의 명사절 접속사\u003c/span> : happy [형용사] + that [접속사] + S + V : \"다했다는 것에 (만족하는)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">부정어구(제한) 도치\u003c/span> : Only + 부사절 + 조동사(should) + 주어(you) + 동사원형(show) : \"오직 ~할 때만 보여 주어야 한다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Only when you're happy, 여러분은 오직 만족할 때만. that you've done the best you can, 여러분이 할 수 있는 최선을 다했다는 것에. for your story, 자신의 이야기에 대해. should you show it to someone else, 그것을 다른 사람에게 보여 주어야 한다.. 이 문장 전체를 해석하면, 여러분은 자신의 이야기에 대해 스스로 할 수 있는 최선을 다해서 만족할 때만 그것을 다른 사람에게 보여 주어야 한다.","hl":"m"},{"n":13,"text":"글쓰기에서 가장 중요한 첫 번째 원칙을 말하고 있어요. 무작정 남에게 보여주지 말고, 스스로가 납득할 수 있는 완성도를 먼저 갖추라는 조언이죠.","hl":"mn"},{"n":14,"text":"이 문장은 서술형 단골인 도치 구문이 쓰였어요. Only로 시작하는 긴 부사절이 앞으로 나오면서 주어인 you와 조동사 should의 자리가 바뀐 부정어 도치 형태를 꼭 기억하세요. 또한 happy 뒤의 that절은 만족하는 구체적인 이유를 보충 설명해주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 그것을 보여 주고 싶은 것이 당연하고,\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">well\u003c/span> want to show it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 가깝고 소중한 사람들에게\u003c/span>\u003cspan class=\"en\">to your nearest and dearest,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 괜찮지만,\u003c/span>\u003cspan class=\"en\">and that's fine,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 경우\u003c/span>\u003cspan class=\"en\">but in most cases\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 그들의 견해에 기대서는 안 된다\u003c/span>\u003cspan class=\"en\">you shouldn't \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">reading \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작품에 있어 어떤 큰 이득을 얻고자\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for\u003c/span> any great benefit to your work.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분이 가장 가깝고 소중한 사람들에게 그것을 보여 주고 싶은 것이 당연하고, 그것은 괜찮지만, 대부분의 경우 여러분은 작품에 있어 어떤 큰 이득을 얻고자 그들의 견해에 기대서는 안 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 가까운 지인들에게 글을 보여주고 싶은 \u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>는 이해하지만, 그들의 피드백이 전문적인 \u003cb class=\"key\">발전\u003c/b>에는 도움이 되지 않을 수 있음을 경고합니다. 공과 사를 구분하여 객관적인 시각을 확보하라는 메시지입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 관용 표현\u003c/span> : may well + 동사원형 : \"~하는 것이 당연하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구동사 (look to A for B)\u003c/span> : look to [A] for [B] : \"어떤 큰 이득을 얻고자 그들의 견해에 기대다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"You may well want to show it, 여러분이 그것을 보여 주고 싶은 것이 당연하고. to your nearest and dearest, 가장 가깝고 소중한 사람들에게. and that's fine, 그것은 괜찮지만. but in most cases, 대부분의 경우. you shouldn't look to their reading, 여러분은 그들의 견해에 기대서는 안 된다. for any great benefit to your work, 작품에 있어 어떤 큰 이득을 얻고자. 이 문장 전체를 해석하면, 여러분이 가장 가깝고 소중한 사람들에게 그것을 보여 주고 싶은 것이 당연하고, 그것은 괜찮지만, 대부분의 경우 여러분은 작품에 있어 어떤 큰 이득을 얻고자 그들의 견해에 기대서는 안 된다.","hl":"m"},{"n":16,"text":"가까운 사람에게 인정받고 싶은 건 인간의 본능이죠. 하지만 그들은 당신을 아끼기 때문에 객관적인 비평을 하기 어렵다는 현실적인 조언을 해주고 있습니다.","hl":"mn"},{"n":17,"text":"첫 번째 포인트인 may well은 당연하다는 의미의 조동사 표현으로 want를 수식합니다. 그리고 look to A for B 구문은 목적을 위해 누군가에게 의존하는 상황을 묘사할 때 자주 쓰이니 통째로 외워두면 유용합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 가치 있는 피드백은\u003c/span>\u003cspan class=\"en\">The most valuable feedback\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 곳에서 나올 가능성이 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> come from other sources:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉, 여러분은 독자를 선택해야 한다\u003c/span>\u003cspan class=\"en\">you should choose readers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 비판적 통찰력을 보고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">critical \u003c/span>\u003cspan class=\"tgt\">insight, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분과의 친밀함이 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class span class=\"tgt\">imagine\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 작가나 도움이 될 것이라고.\u003c/span>\u003cspan class=\"en\">that any writer \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">동료 작가들이 이상적이긴 하지만, 어느 작가나 도움이 될 것이라고 생각하지 마라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 피드백을 받기에 \u003cb class=\"key\">동료 \u003c/b>\u003cb class=\"key\">작가\u003c/b>가 가장 좋지만, 모든 작가가 다 적절한 조언을 해주는 것은 아니라는 \u003cb class=\"key\">경계\u003c/b>의 메시지입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 명령문\u003c/span> : [Don't] + [동사원형 (imagine)] : \"생각하지 마라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">자동사 do (충분하다/적절하다)\u003c/span> : [주어] + [will do (자동사)] : \"도움이 될 것이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Fellow writers are ideal, 동료 작가들이 이상적이긴 하지만. but don't imagine, 생각하지 마라. that any writer will do, 어느 작가나 도움이 될 것이라고.. 이 문장 전체를 해석하면, 동료 작가들이 이상적이긴 하지만, 어느 작가나 도움이 될 것이라고 생각하지 마라.","hl":"m"},{"n":22,"text":"피드백을 받기에 동료 작가가 가장 좋지만, 모든 작가가 다 적절한 조언을 해주는 것은 아니라는 경계의 메시지예요.","hl":"mn"},{"n":23,"text":"여기서 don't imagine은 하지 마라는 부정 명령문으로 쓰여 충고를 나타내고 있고요. 뒤에 나오는 will do는 조동사 뒤에서 충분하다 혹은 도움이 되다라는 의미의 자동사로 쓰였으니 뜻을 혼동하지 않게 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 여러분이 작가 모임이나 수업의 일원이라면,\u003c/span>\u003cspan class=\"en\">If you are part of a writers' circle or class,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 누구의 글을 동경하는지 알 것이며,\u003c/span>\u003cspan class=\"en\">you'll know \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">whose \u003c/span>\u003cspan class=\"tgt\">writing \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">admire\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 과거에 피드백을 받아본 적이 있다면\u003c/span>\u003cspan class=\"en\">and if you've had feedback in the past\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누구의 의견이 도움이 되었고\u003c/span>\u003cspan class=\"en\">you'll know whose opinions \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">helpful\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누구의 의견이 그렇지 않았는지 알 것이다.\u003c/span>\u003cspan class=\"en\">― and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">whose \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">not\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 여러분이 작가 모임이나 수업의 일원이라면, 여러분이 누구의 글을 동경하는지 알 것이며, 그리고 과거에 피드백을 받아본 적이 있다면 누구의 의견이 도움이 되었고 누구의 의견이 그렇지 않았는지 알 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신이 존경하는 \u003cb class=\"key\">글쓰기 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>이나 과거 경험을 통해, 누구의 \u003cb class=\"key\">피드백\u003c/b>을 선별해서 수용해야 할지 이미 \u003cb class=\"key\">판단 \u003c/b>\u003cb class=\"key\">기준\u003c/b>이 있음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문형용사)\u003c/span> : [whose (의문형용사)] + [명사 (writing)] + [주어 (you)] + [동사 (admire)] : \"누구의 글을 동경하는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 (상태의 지속)\u003c/span> : [have] + [p.p. (been)] + [형용사 (helpful)] : \"도움이 되어 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">소유대명사와 생략\u003c/span> : [whose (소유대명사)] + [have not (been helpful)] : \"누구의 의견이 그렇지 않았는지\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"If you are part of a writers' circle or class, 만약 여러분이 작가 모임이나 수업의 일원이라면. you'll know whose writing you admire, 여러분이 누구의 글을 동경하는지 알 것이며. and if you've had feedback in the past, 그리고 과거에 피드백을 받아본 적이 있다면. you'll know whose opinions have been helpful, 누구의 의견이 도움이 되었고. ― and whose have not, 누구의 의견이 그렇지 않았는지 알 것이다.. 이 문장 전체를 해석하면, 만약 여러분이 작가 모임이나 수업의 일원이라면, 여러분이 누구의 글을 동경하는지 알 것이며, 그리고 과거에 피드백을 받아본 적이 있다면 누구의 의견이 도움이 되었고 누구의 의견이 그렇지 않았는지 알 것이다.","hl":"m"},{"n":25,"text":"자신이 존경하는 글쓰기 스타일이나 과거 경험을 통해, 누구의 피드백을 선별해서 수용해야 할지 이미 판단 기준이 있음을 강조하는 내용이에요.","hl":"mn"},{"n":26,"text":"첫 번째 포인트인 whose writing you admire는 의문 형용사가 명사를 수식하는 간접의문문 어순이고요. have been helpful은 과거부터 지금까지의 상태를 나타내는 현재완료 시제예요. 마지막의 whose have not은 소유 대명사 뒤에 반복되는 been helpful이 생략된 형태라는 점을 주의 깊게 보세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>작품에 대해 스스로 \u003cb class=\"key\">최선의 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 다해 만족한 시점이 남에게 보여줄 때이다.\u003c/li>\u003cli>\u003cb class=\"key\">가까운 \u003c/b>\u003cb class=\"key\">지인\u003c/b>은 심리적 안정은 줄 수 있으나 작품 발전에 실질적 \u003cb class=\"key\">이득\u003c/b>을 주기는 어렵다.\u003c/li>\u003cli>가장 가치 있는 피드백은 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">통찰력\u003c/b>을 가진 사람으로부터 나오므로 이를 기준으로 독자를 정해야 한다.\u003c/li>\u003cli>\u003cb class=\"key\">동료 \u003c/b>\u003cb class=\"key\">작가\u003c/b>들 중에서도 자신의 글을 객관적으로 봐줄 수 있는 \u003cb class=\"key\">도움이 \u003c/b>\u003cb class=\"key\">되는 \u003c/b>\u003cb class=\"key\">의견\u003c/b>을 줄 사람을 선별하라.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>You should seek feedback from readers who offer critical insight, such as fellow writers, rather than those close to you.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">글에 대해 스스로 \u003cb class=\"key\">최선의 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 다한 후에는, 단순히 친밀한 사람이 아닌 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">통찰력\u003c/b>을 가진 동료 작가나 전문가에게 피드백을 구해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"자, 정리해 볼까요? 좋은 글을 쓰기 위해서는 스스로 최선을 다한 뒤에, 나를 좋아하는 사람이 아니라 내 글을 비판적으로 봐줄 수 있는 통찰력 있는 동료를 찾아야 합니다. 여러분도 오늘 배운 내용을 생각하며 자신의 글을 객관적으로 바라보는 연습을 해보길 바랍니다. 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
