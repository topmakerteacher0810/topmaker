 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01피드백 요청 시점</div><ul><li>자신의 글에 대해 최선을 다했다고 스스로 만족할 때만 다른 사람에게 글을 보여주어야 한다.</li><li>스스로 만족할 때 글 공개 (happy)</li><li>자신의 이야기(story)에 최선을 다한 후 피드백 요청</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02가까운 지인의 한계</div><ul><li>가까운 사람에게 글을 보여주는 것은 괜찮지만, 작품에 큰 도움이 되기를 기대해서는 안 된다.</li><li>가장 가까운 지인(nearest and dearest)의 피드백 한계</li><li>작품에 대한 실질적 이점(great benefit) 기대 불가</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03올바른 독자 선택 기준</div><ul><li>가치 있는 피드백은 친밀도가 아닌 비판적 통찰력을 가진 독자로부터 나온다.</li><li>피드백 제공자의 핵심 조건: 비판적 통찰력(critical insight)</li><li>독자 선택 시 피해야 할 기준: 친밀도(closeness)</li><li>가장 가치 있는 피드백(valuable feedback)의 출처 확보</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04이상적인 피드백 대상</div><ul><li>동료 작가가 이상적이지만, 아무나 선택하지 말고 신중하게 선별해야 한다.</li><li>가장 이상적인 독자: 동료 작가(fellow writers)</li><li>평소 존경(admire)하는 글을 쓰는 사람 선택</li><li>과거에 도움이 되었던 의견(helpful opinions)을 제공한 사람 선택</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">do the best one can</td><td class=\"m\">최선을 다하다</td></tr><tr><td class=\"w\">may well</td><td class=\"m\">아마 ~일 것이다, ~하는 것도 당연하다</td></tr><tr><td class=\"w\">nearest and dearest</td><td class=\"m\">가장 가까운 사람들, 가족과 친지</td></tr><tr><td class=\"w\">look to</td><td class=\"m\">~에 기대다, ~에 의지하다</td></tr><tr><td class=\"w\">benefit</td><td class=\"m\">이익, 혜택</td></tr><tr><td class=\"w\">valuable</td><td class=\"m\">가치 있는, 유용한</td></tr><tr><td class=\"w\">feedback</td><td class=\"m\">피드백, 반응, 의견</td></tr><tr><td class=\"w\">be likely to</td><td class=\"m\">~할 가능성이 있다, ~할 것 같다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">source</td><td class=\"m\">출처, 근원, 원천</td></tr><tr><td class=\"w\">critical</td><td class=\"m\">비판적인, 분석적인, 중요한</td></tr><tr><td class=\"w\">insight</td><td class=\"m\">통찰력, 이해, 식견</td></tr><tr><td class=\"w\">closeness</td><td class=\"m\">친밀함, 가까움</td></tr><tr><td class=\"w\">fellow</td><td class=\"m\">동료의, 같은 처지에 있는</td></tr><tr><td class=\"w\">ideal</td><td class=\"m\">이상적인, 완벽한</td></tr><tr><td class=\"w\">will do</td><td class=\"m\">충분하다, 알맞다, 소용에 닿다</td></tr><tr><td class=\"w\">admire</td><td class=\"m\">존경하다, 높이 평가하다, 감탄하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분이 만족할 때만</span><span class=\"en\"><b><span class=\"grammar-hl\">Only when you're happy</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">스스로 할 수 있는 최선을 다해서</span><span class=\"en\"><b><span class=\"grammar-hl\">that you've done the best you can</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 이야기에 대해</span><span class=\"en\"><b><span class=\"grammar-hl\">for your story</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것을 보여 주어야 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">should you show</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람에게</span><span class=\"en\"><b>to someone else.</b></span></div></div><div class=\"lec-sent-ko\">여러분은 자신의 이야기에 대해 스스로 할 수 있는 최선을 다해서 만족할 때만 그것을 다른 사람에게 보여 주어야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 문장은 글쓰기에 있어서 타인에게 피드백을 구하는 적절한 시기를 제시하며 글의 전제를 깝니다. Only when ~ should you ~는 작가 스스로 더 이상 고칠 곳이 없을 만큼 최선을 다해 원고를 완성한 상태에 이르렀을 때 비로소 다른 사람에게 글을 보여주어야 한다는 점을 힘주어 강조하는 구문입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">Only when you&#39;re happy that you&#39;ve done the best you can for your story should you show (도치): 부정어구에 준하는 &#39;Only + 부사절(when...)&#39;이 문장 맨 앞에 위치하면서 주절에서 주어와 조동사가 도치되었다. 조동사(should) + 주어(you) + 동사원형(show)의 어순 구조를 가진다.</div><div class=\"lec-gr-item\">happy that 접속사 that: 감정을 나타내는 형용사 happy 뒤에 위치하여, 주어가 느끼는 감정의 원인이나 판단의 근거를 설명하는 부사절을 이끄는 구조이다.</div><div class=\"lec-gr-item\">the best you can (관계대명사): 선행사 the best와 주어 you 사이에 목적격 관계대명사 that이 생략된 구조이다. 조동사 can 뒤에는 일반동사 do가 생략되어 있으며, 생략된 관계대명사절이 앞의 명사를 수식한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">여러분이 그것을 보여 주고 싶은 것이 당연하고</span><span class=\"en\"><b>You <span class=\"grammar-hl\">may well want</span> <span class=\"grammar-hl\">to show</span> it</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 가깝고 소중한 사람들에게</span><span class=\"en\"><b>to your nearest and dearest,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 괜찮지만</span><span class=\"en\"><b>and that's fine,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대부분의 경우</span><span class=\"en\"><b>but in most cases</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 그들의 견해에 기대서는 안된다</span><span class=\"en\"><b>you shouldn't <span class=\"grammar-hl\">look to their reading</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">작품에 있어 어떤 큰 이득을 얻고자</span><span class=\"en\"><b><span class=\"grammar-hl\">for</span> any great benefit to your work.</b></span></div></div><div class=\"lec-sent-ko\">여러분이 가장 가깝고 소중한 사람들에게 그것을 보여 주고 싶은 것이 당연하고, 그것은 괜찮지만, 대부분의 경우 여러분은 작품에 있어 어떤 큰 이득을 얻고자 그들의 견해에 기대서는 안된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 글을 보여줄 준비가 끝났다면, 이제 누구에게 보여줄 것인가에 대한 이야기를 꺼내며 논의의 방향을 좁혀갑니다. nearest and dearest는 흔히 가족이나 절친한 친구를 묶어서 부르는 관용적인 표현입니다. look to their reading for any great benefit은 지인들이 내 글을 읽고 작품을 발전시킬 만한 날카로운 조언을 줄 것이라고 기대하는 상황을 구체적으로 보여줍니다. 애정 어린 응원은 받을 수 있겠지만, 실제 글의 완성도를 높이는 데는 그들의 피드백이 별다른 쓸모가 없다는 현실적인 한계를 짚어줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">may well want (관용표현): 조동사구 &#39;may well + 동사원형&#39; 형태로, &#39;~하는 것은 당연하다&#39; 혹은 &#39;아마 ~일 것이다&#39;라는 의미를 나타내는 구조이다.</div><div class=\"lec-gr-item\">to show (to부정사): 타동사 want의 목적어 자리에 쓰인 명사적 용법의 to부정사 구조이다.</div><div class=\"lec-gr-item\">look to their reading for (관용표현): &#39;look to A for B&#39; 구조를 취하여 &#39;B를 얻기 위해 A에 기대다, 의존하다&#39;라는 의미를 형성하는 동사구 형태이다.</div><div class=\"lec-gr-item\">reading (동명사): 소유격 대명사 their의 수식을 받으며 전치사 to의 목적어 자리에 쓰인 명사적 역할의 동명사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">may well</td><td class=\"m\">아마 ~일 것이다, ~하는 것도 당연하다</td></tr><tr><td class=\"w\">nearest and dearest</td><td class=\"m\">가장 가까운 사람들, 가족과 친지</td></tr><tr><td class=\"w\">look to</td><td class=\"m\">~에 기대다, ~에 의지하다</td></tr><tr><td class=\"w\">benefit</td><td class=\"m\">이익, 혜택</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 가치 있는 피드백은</span><span class=\"en\"><b>The most valuable feedback</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">나올 가능성이 있다</span><span class=\"en\"><b><span class=\"grammar-hl\">is likely to come</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 곳에서:</span><span class=\"en\"><b>from other sources:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 독자를 선택해야 한다</span><span class=\"en\"><b>you should choose readers</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 비판적 통찰력을 보고</span><span class=\"en\"><b>for their critical insight,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분과의 친밀함이 아니라</span><span class=\"en\"><b>not their closeness to you.</b></span></div></div><div class=\"lec-sent-ko\">가장 가치 있는 피드백은 다른 곳에서 나올 가능성이 있다. 즉, 여러분은 그들의 여러분과의 친밀함이 아니라 그들의 비판적 통찰력을 보고 독자를 선택해야 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 가족이나 친구의 피드백이 가진 한계를 지적한 앞 문장에 이어, 그렇다면 진정으로 도움이 되는 조언을 누구에게서 얻어야 하는지 명확한 기준을 제시합니다. choose readers for their critical insight는 글을 냉정하게 분석하고 문제점을 짚어낼 수 있는 안목을 가진 사람을 첫 독자로 삼아야 한다는 글쓴이의 핵심 주장을 담고 있습니다. 나와의 개인적인 친분에 얽매이지 말고, 오직 작품의 질을 높여줄 수 있는 능력을 최우선 기준으로 평가자를 골라야 한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is likely to come (to부정사): &#39;be likely to + 동사원형&#39; 구문으로, to부정사가 주격 보어로 쓰여 주어의 상태나 향후 가능성을 서술하는 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">valuable</td><td class=\"m\">가치 있는, 유용한</td></tr><tr><td class=\"w\">feedback</td><td class=\"m\">피드백, 반응, 의견</td></tr><tr><td class=\"w\">source</td><td class=\"m\">출처, 근원, 원천</td></tr><tr><td class=\"w\">critical</td><td class=\"m\">비판적인, 분석적인, 중요한</td></tr><tr><td class=\"w\">insight</td><td class=\"m\">통찰력, 이해, 식견</td></tr><tr><td class=\"w\">closeness</td><td class=\"m\">친밀함, 가까움</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">동료 작가들이 이상적이긴 하지만</span><span class=\"en\"><b>Fellow writers are ideal,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생각하지 마라</span><span class=\"en\"><b>but don't <span class=\"grammar-hl\">imagine</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어느 작가나 도움이 될 것이라고</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> any writer <span class=\"grammar-hl\">will do</span>.</b></span></div></div><div class=\"lec-sent-ko\">동료 작가들이 이상적이긴 하지만, 어느 작가나 도움이 될 것이라고 생각하지 마라.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;비판적 통찰력을 가진 독자&#39;의 가장 훌륭한 후보로 동료 작가를 꼽으면서도, 동시에 조건을 덧붙여 논리를 한 단계 더 엄격하게 다듬습니다. any writer will do는 단지 글을 쓰는 사람이라고 해서 무조건 내 작품에 알맞고 훌륭한 조언을 해줄 수 있을 것이라는 착각을 꼬집는 표현입니다. 글을 쓰는 동료 중에서도 내게 맞는 사람을 가려내야 한다고 경고하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">imagine that 명사절 접속사: 타동사 imagine 뒤에서 목적어 역할을 하는 완전한 절을 이끄는 명사절 접속사 that 구조이다.</div><div class=\"lec-gr-item\">will do (관용표현): 일반동사 do가 목적어를 취하지 않는 완전자동사로 사용되어 &#39;충분하다&#39; 또는 &#39;적절하다&#39;는 관용적 의미를 형성하는 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fellow</td><td class=\"m\">동료의, 같은 처지에 있는</td></tr><tr><td class=\"w\">ideal</td><td class=\"m\">이상적인, 완벽한</td></tr><tr><td class=\"w\">will do</td><td class=\"m\">충분하다, 알맞다, 소용에 닿다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">만약 여러분이 작가 모임이나 수업의 일원이라면</span><span class=\"en\"><b>If you are part of a writers' circle or class,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 알 것이다</span><span class=\"en\"><b>you'll know</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분이 누구의 글을 동경하는지</span><span class=\"en\"><b><span class=\"grammar-hl\">whose writing you admire</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 만약 피드백을 받아본 적이 있다면</span><span class=\"en\"><b>and if you've had feedback</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과거에</span><span class=\"en\"><b>in the past</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">여러분은 알 것이다</span><span class=\"en\"><b>you'll know</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">누구의 의견이 도움이 되었는지</span><span class=\"en\"><b><span class=\"grammar-hl\">whose opinions have been helpful</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">― 그리고 누구의 의견이 그렇지 않았는지</span><span class=\"en\"><b>― and <span class=\"grammar-hl\">whose have not</span>.</b></span></div></div><div class=\"lec-sent-ko\">만약 여러분이 작가 모임이나 수업의 일원이라면, 여러분이 누구의 글을 동경하는지 알 것이며, 그리고 과거에 피드백을 받아본 적이 있다면 누구의 의견이 도움이 되었고 누구의 의견이 그렇지 않았는지 알 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 아무 작가나 안 된다고 한 앞 문장의 경고에 대한 구체적인 해결책을 제시하며 글을 마무리합니다. whose writing you admire는 평소 내가 실력을 인정하고 존경할 만한 수준의 글을 쓰는 사람을 멘토나 평가자로 찾아야 한다는 뜻입니다. 더불어 과거의 경험을 돌이켜보아, 뜬구름 잡는 소리가 아니라 실질적으로 내 글의 단점을 보완하고 완성도를 높이는 데 기여한 조언을 해준 사람을 신중하게 선택해야 한다는 실천적인 지침을 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">whose writing you admire (간접의문문): 의문형용사 whose가 명사 writing을 수식하여 의문사구를 이루고, &#39;의문사구 + 주어(you) + 동사(admire)&#39;의 평서문 어순을 취해 타동사 know의 목적어 역할을 하는 명사절 구조이다.</div><div class=\"lec-gr-item\">whose opinions have been helpful (간접의문문): 의문사구(whose opinions) 자체가 명사절 내에서 주어 역할을 하므로 &#39;의문사(주어) + 동사(have been)&#39;의 어순을 유지하며, 타동사 know의 목적어 역할을 하는 명사절 구조이다.</div><div class=\"lec-gr-item\">whose have not 간접의문문 및 생략: 앞 절과 동일한 구조의 간접의문문으로, 의문사 whose 뒤에 명사 opinions가 생략되었고, 조동사 have not 뒤에 과거분사구 been helpful이 생략되어 타동사 know의 목적어로 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">feedback</td><td class=\"m\">피드백, 반응, 의견</td></tr><tr><td class=\"w\">admire</td><td class=\"m\">존경하다, 높이 평가하다, 감탄하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>작가는 스스로 최선을 다해 원고를 완성한 후에만 다른 사람에게 피드백을 구해야 한다.</li><li>가족이나 친한 친구는 위안이 될 수 있지만, 작품의 질을 높이는 데는 실질적인 도움이 되지 않는다.</li><li>작품에 대한 평가는 개인적인 친분보다는 냉철한 비판적 통찰력을 가진 사람에게 맡겨야 한다.</li><li>동료 작가가 가장 이상적인 평가자이지만, 그중에서도 평소 내가 실력을 흠모하거나 과거에 실질적인 도움을 주었던 사람을 신중하게 가려내어 조언을 구해야 한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Although it is natural to share your story with close people, you should choose readers with critical insight to receive valuable feedback.</div>\n              <div class=\"lec-final-sum-ko\">가까운 사람들과 글을 공유하는 것은 자연스럽지만, 가치 있는 피드백을 받기 위해서는 비판적 통찰력을 가진 독자를 선택해야 한다.</div></div></div>"],"segs":[[{"audio":"./20_audio/1.mp3","hl":null}],[{"audio":"./20_audio/2.mp3","hl":null}],[{"audio":"./20_audio/3.mp3","hl":null},{"audio":"./20_audio/4.mp3","hl":"stage-0"},{"audio":"./20_audio/5.mp3","hl":"stage-1"},{"audio":"./20_audio/6.mp3","hl":"stage-2"},{"audio":"./20_audio/7.mp3","hl":"stage-3"}],[{"audio":"./20_audio/8.mp3","hl":null}],[{"audio":"./20_audio/9.mp3","hl":"main"},{"audio":"./20_audio/10.mp3","hl":"meaning"},{"audio":"./20_audio/11.mp3","hl":"grammar"}],[{"audio":"./20_audio/12.mp3","hl":"main"},{"audio":"./20_audio/13.mp3","hl":"meaning"},{"audio":"./20_audio/14.mp3","hl":"grammar"}],[{"audio":"./20_audio/15.mp3","hl":"main"},{"audio":"./20_audio/16.mp3","hl":"meaning"},{"audio":"./20_audio/17.mp3","hl":"grammar"}],[{"audio":"./20_audio/18.mp3","hl":"main"},{"audio":"./20_audio/19.mp3","hl":"meaning"},{"audio":"./20_audio/20.mp3","hl":"grammar"}],[{"audio":"./20_audio/21.mp3","hl":"main"},{"audio":"./20_audio/22.mp3","hl":"meaning"},{"audio":"./20_audio/23.mp3","hl":"grammar"}],[{"audio":"./20_audio/24.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).ove
