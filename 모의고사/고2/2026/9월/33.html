이 매우 중요하다고 동의한다.</li><li>애도(grieving)는 개인적, 집단적 상실 모두에서 중요하게 다루어짐</li><li>인간의 의식(consciousness)에 필수적인 역동적 감정 과정임</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02심리적 기능</div><ul><li>애도는 인간의 취약성을 직면하게 하고 삶의 에너지를 회복시킨다.</li><li>자신과 타인의 취약성(vulnerability)과 필멸성(mortality)을 마주하게 함</li><li>큰 상실(significant loss) 이후 생명 에너지를 회복하도록 지원함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03자기 변형의 기반</div><ul><li>애도 작업은 상실을 존중하며 삶의 지속과 변화를 준비하는 과정이다.</li><li>상실과 슬픔(sadness)의 경험을 온전히 존중함</li><li>사랑과 연민에 뿌리를 둔 헌신의 행동(act of devotion)</li><li>삶의 지속과 자기 변형(self-transformation)을 위한 기반을 마련함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04긍정적 동기부여</div><ul><li>상실을 애도함으로써 남은 것에 대한 사랑이 커지고 행동할 동기를 얻는다.</li><li>남은 것에 대한 사랑과 헌신(commitment)을 강화함</li><li>상실로 인한 피해를 복구하거나 보상(compensating)하려는 열망을 구축함</li><li>슬픔은 궁극적으로 우리가 행동하도록 강력하게 동기부여(motivated to act)함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">agree on</td><td class=\"m\">~에 동의하다, ~에 의견을 같이하다</td></tr><tr><td class=\"w\">grieve</td><td class=\"m\">비통해하다, 애도하다</td></tr><tr><td class=\"w\">essential to</td><td class=\"m\">~에 필수적인, ~에 절대 필요한</td></tr><tr><td class=\"w\">consciousness</td><td class=\"m\">의식, 자각</td></tr><tr><td class=\"w\">face into</td><td class=\"m\">~을 직면하다, ~에 맞서다</td></tr><tr><td class=\"w\">vulnerability</td><td class=\"m\">취약성, 상처받기 쉬움</td></tr><tr><td class=\"w\">transience</td><td class=\"m\">일시적임, 덧없음</td></tr><tr><td class=\"w\">mortality</td><td class=\"m\">필멸성, 죽어야 할 운명</td></tr><tr><td class=\"w\">set up</td><td class=\"m\">준비하다, 마련하다, 세우다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">devotion</td><td class=\"m\">헌신, 몰두</td></tr><tr><td class=\"w\">root in</td><td class=\"m\">~에 뿌리를 두다, ~에 기원을 두다</td></tr><tr><td class=\"w\">compassion</td><td class=\"m\">연민, 동정심</td></tr><tr><td class=\"w\">clear the way</td><td class=\"m\">길을 열어주다, 장애물을 치우다</td></tr><tr><td class=\"w\">commitment</td><td class=\"m\">헌신, 약속, 전념</td></tr><tr><td class=\"w\">in time</td><td class=\"m\">이윽고, 시간이 지나면, 제때에</td></tr><tr><td class=\"w\">make good</td><td class=\"m\">보상하다, 벌충하다, 실현하다</td></tr><tr><td class=\"w\">compensate for</td><td class=\"m\">~을 보상하다, ~을 메우다</td></tr><tr><td class=\"w\">motivated</td><td class=\"m\">동기가 부여된, 자극받은</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">심리학 분야 전반에서 심리학 이론들은</span><span class=\"en\"><b>Psychological theories across the field</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중요성에 동의한다</span><span class=\"en\"><b>agree on the importance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리의 상실을 애도하는 것의,</span><span class=\"en\"><b>of <span class=\"grammar-hl\">grieving</span> our losses,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 개인적인 것부터</span><span class=\"en\"><b><span class=\"grammar-hl\">from the highly personal</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">명백히 집단적인 것에 이르기까지</span><span class=\"en\"><b><span class=\"grammar-hl\">through to the broadly collective</span>.</b></span></div></div><div class=\"lec-sent-ko\">심리학 분야 전반에서 심리학 이론들은 매우 개인적인 것부터 명백히 집단적인 것에 이르기까지, 우리의 상실을 애도하는 것의 중요성에 동의한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글을 시작하며 상실을 슬퍼하는 일(애도)이 심리학적으로 얼마나 중요한지 화두를 던집니다. agree on the importance of grieving our losses는 개인적인 슬픔이든 사회적 참사 같은 집단적 슬픔이든, 상실을 겪었을 때 충분히 슬퍼하는 과정이 마음 건강에 필수적이라는 점에 모든 심리학자가 뜻을 같이한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">grieving (동명사): 전치사 of의 목적어로 쓰인 명사적 개념의 동명사이다. &#39;우리의 상실을 슬퍼하는 것&#39;이라는 행위나 활동을 나타낸다.</div><div class=\"lec-gr-item\">from the highly personal through to the broadly collective (관용표현): &#39;from A through to B&#39; 구조로 &#39;A에서 B에 이르기까지&#39;라는 의미를 나타내는 전치사구이다. &#39;the + 형용사&#39;가 결합하여 명사구(the personal, the collective) 역할을 하고 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">agree on</td><td class=\"m\">~에 동의하다, ~에 의견을 같이하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">애도는 의식에 필수적인 역동적인 정서적 과정이다.</span><span class=\"en\"><b>Grief is a dynamic emotional process <span class=\"grammar-hl\">essential to consciousness</span>.</b></span></div></div><div class=\"lec-sent-ko\">애도는 의식에 필수적인 역동적인 정서적 과정이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 슬픔의 중요성을 구체적으로 설명하는 문장입니다. 심리학에서 dynamic emotional process는 시간의 흐름에 따라 이리저리 형태를 바꾸며 마음속에서 활발하게 작용하는 일련의 흐름을 뜻합니다. 즉, 슬픔은 인간이 온전한 정신을 유지하기 위해 반드시 온몸으로 겪어내야 하는 마음의 작용이라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">essential to consciousness 형용사구 후치 수식: 형용사 essential이 이끄는 구가 앞의 명사구 a dynamic emotional process를 뒤에서 수식한다. 명사와 형용사구 사이에 주격 관계대명사 + be동사(which is)가 생략된 구조로 볼 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">essential to</td><td class=\"m\">~에 필수적인, ~에 절대 필요한</td></tr><tr><td class=\"w\">consciousness</td><td class=\"m\">의식, 자각</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">심리적 수준에서,</span><span class=\"en\"><b>At a psychological level,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 우리를 지원한다</span><span class=\"en\"><b>it <span class=\"grammar-hl\">supports us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 자신과 타인의 연약함, 덧없음, 그리고 죽음을 직시하는 것도,</span><span class=\"en\"><b><span class=\"grammar-hl\">to both face</span> into our own and others' vulnerability, transience and mortality,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 삶의 에너지를 회복하는 것도</span><span class=\"en\"><b>and <span class=\"grammar-hl\">to repair</span> life energy</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">중대한 상실 이후에</span><span class=\"en\"><b>after significant loss.</b></span></div></div><div class=\"lec-sent-ko\">심리적 수준에서, 그것은 우리 자신과 타인의 연약함, 덧없음, 그리고 죽음을 직시하는 것도, 중대한 상실 이후의 삶의 에너지를 회복하는 것도 지원한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 슬픔이라는 감정 과정이 구체적으로 어떤 역할을 하는지 두 가지 측면에서 뒷받침합니다. face into our own and others&#39; vulnerability, transience and mortality는 인간이 얼마나 상처받기 쉽고 언젠가 죽을 수밖에 없는 유한한 존재인지를 외면하지 않고 있는 그대로 직시하게 해준다는 의미입니다. 나아가 이런 뼈아픈 현실을 바닥까지 받아들임으로써 큰 충격 이후에 다시 살아갈 힘을 얻게 해준다는 논리로 이어집니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">supports us to both face 5형식(SVOC) 구조 및 to부정사: 기본구조는 &#39;support + O(목적어) + to V(목적격 보어)&#39; 형태로, 목적어 us가 목적격 보어(to face) 하도록 돕거나 지원한다는 의미의 구조를 취하고 있다.</div><div class=\"lec-gr-item\">to repair (to부정사): 상관접속사(both A and B) 구문에 의해 앞의 목적격 보어인 to face와 병렬 구조를 이루며, 동일하게 목적격 보어(명사적 기능) 역할을 하는 to부정사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">face into</td><td class=\"m\">~을 직면하다, ~에 맞서다</td></tr><tr><td class=\"w\">vulnerability</td><td class=\"m\">취약성, 상처받기 쉬움</td></tr><tr><td class=\"w\">transience</td><td class=\"m\">일시적임, 덧없음</td></tr><tr><td class=\"w\">mortality</td><td class=\"m\">필멸성, 죽어야 할 운명</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">애도 작업은 상실, 슬픔, 그리고 경험을 존중한다</span><span class=\"en\"><b>Grief work honours the loss, the sadness and the experience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위축이나 부재의,</span><span class=\"en\"><b>of diminishment or absence,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">한편으로는 기반을 마련하기도 하면서</span><span class=\"en\"><b><span class=\"grammar-hl\">while also setting up</span> the ground</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자기 변신과 삶의 지속을 위한</span><span class=\"en\"><b>for self-transformation and the continuation of life.</b></span></div></div><div class=\"lec-sent-ko\">애도 작업(Grief work)은 상실, 슬픔, 그리고 위축이나 부재의 경험을 존중하고, 한편으로는 자기 변신과 삶의 지속을 위한 기반을 마련하기도 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 슬픔이 회복으로 이어진다는 앞 문장의 논리를 &#39;애도 작업&#39;이라는 개념으로 확장합니다. Grief work를 &#39;애도 작업&#39;이라고 옮기면 심리치료 용어처럼 느껴집니다. 쉽게 말해 잃어버린 대상을 떠나보내기 위해 마음속으로 애쓰고 눈물 흘리는 모든 과정을 가리킵니다. 상실로 인한 아픔과 텅 빈 느낌을 충분히 인정하고 보듬어 주는 동시에, 그 아픔을 딛고 이전과는 다른 성숙한 나로 변화하여 앞으로의 삶을 살아갈 수 있도록 토대를 다져준다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">while also setting up (분사구문): 접속사 while이 명시된 현재분사 구문이다. 부사적 기능으로 쓰였으며, 원래 절인 &#39;while it(grief work) also sets up ...&#39;에서 주어(it)가 앞 절과 같아 생략되고 동사가 -ing 형태인 현재분사로 변환된 구조이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">심리치료사 Fran Weller는 묘사한다</span><span class=\"en\"><b>Psychotherapist Fran Weller describes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">애도 작업은 &quot;헌신적인 행위&quot;라고,</span><span class=\"en\"><b>grief work is \"an act of devotion,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사랑과 연민에 뿌리를 둔</span><span class=\"en\"><b><span class=\"grammar-hl\">rooted in love and compassion</span>\"</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">&quot;지속적인 실천&quot;을 요구하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> requires \"an ongoing practice</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심화, 주의 기울이기와 경청의</span><span class=\"en\"><b>of <span class=\"grammar-hl\">deepening, attending and listening</span>.\"</b></span></div></div><div class=\"lec-sent-ko\">심리치료사 Fran Weller는 애도 작업을 ‘심화, 주의 기울이기와 경청의 지속적인 실천’을 요구하는 ‘사랑과 연민에 뿌리를 둔 헌신적인 행위’라고 묘사한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 전문가의 견해를 인용하여 애도 작업이 가진 깊은 의미를 뒷받침합니다. &quot;an act of devotion, rooted in love and compassion&quot; — 글쓴이는 여기서 힘주어 말합니다. 상실을 슬퍼하는 일은 대상에 대한 깊은 사랑과 애틋함에서 비롯되는 아주 숭고하고 정성스러운 행위라는 의미입니다. 이를 위해서는 내면의 아픈 목소리에 귀를 기울이고 감정을 깊이 들여다보는 꾸준한 노력이 필요함을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">rooted in love and compassion (과거분사(형용사)): 수식받는 명사(an act of devotion)를 기준으로 &#39;사랑과 연민에 뿌리를 둔 헌신적인 행동&#39;이라는 의미로 수식한다. N + p.p. 형태(an act of devotion that is rooted)의 축약 관계절 구조로 명사를 뒤에서 꾸며준다.</div><div class=\"lec-gr-item\">that (관계대명사): 주격 관계대명사로 선행사 &#39;an act of devotion, rooted in love and compassion&#39;을 수식하는 형용사절을 이끈다. 관계대명사 뒤에 주어가 빠지고 동사(requires)가 바로 이어지는 불완전한 구조이다.</div><div class=\"lec-gr-item\">deepening, attending and listening (동명사): 전치사 of의 목적어로 쓰인 명사적 개념의 동명사 세 개가 등위접속사 and로 병렬 연결된 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">devotion</td><td class=\"m\">헌신, 몰두</td></tr><tr><td class=\"w\">compassion</td><td class=\"m\">연민, 동정심</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">우리가 애도할 때</span><span class=\"en\"><b>When we grieve</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잃어버린 것에 대해,</span><span class=\"en\"><b>for <span class=\"grammar-hl\">what</span> <span class=\"grammar-hl\">is lost</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것은 길을 열어 준다</span><span class=\"en\"><b>it clears the way</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사랑과 헌신을 강화하는 것을 향한</span><span class=\"en\"><b>towards a strengthening of love and commitment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">남아 있는 것에 대한</span><span class=\"en\"><b>for <span class=\"grammar-hl\">what</span> remains.</b></span></div></div><div class=\"lec-sent-ko\">우리가 잃어버린 것에 대해 애도할 때, 그것은 남아 있는 것에 대한 사랑과 헌신을 강화하는 길을 열어 준다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 슬픔이 어떻게 삶을 긍정적으로 변화시키는지 그 구체적인 효과를 제시합니다. clears the way towards는 방해물을 치워 앞으로 나아갈 수 있게 닦아준다는 의미입니다. 잃어버린 대상을 향해 충분히 아파하고 나면, 역설적으로 우리 곁에 여전히 남아있는 사람이나 가치를 더욱 단단하게 사랑하고 소중히 여기게 된다는 인과관계를 설명합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what (관계대명사): 선행사를 포함하는 관계대명사로, 전치사(for)의 목적어 역할을 하는 명사절을 이끈다.</div><div class=\"lec-gr-item\">is lost (수동태): be동사(is)+p.p.(lost) 구조이다. 원형 동사 lose는 타동사(기본구조: lose + O(목적어))인데, 뒤에 목적어가 없어서 수동구조 is lost 형태로 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grieve</td><td class=\"m\">비통해하다, 애도하다</td></tr><tr><td class=\"w\">commitment</td><td class=\"m\">헌신, 약속, 전념</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">시간이 지나면</span><span class=\"en\"><b>In time</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이것은 욕구를 형성할 수도 있다</span><span class=\"en\"><b>this may build a desire</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상실로부터 이로움을 만들어내려는</span><span class=\"en\"><b><span class=\"grammar-hl\">to make good</span> from the loss</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 할 수 있는 한 많은 피해들을 고침으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">by repairing as many damages as we can</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고</span><span class=\"en\"><b><span class=\"grammar-hl\">and</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 그것들을 보상함으로써</span><span class=\"en\"><b><span class=\"grammar-hl\">or compensating</span> for them.</b></span></div></div><div class=\"lec-sent-ko\">시간이 지나면 이것은 우리가 할 수 있는 한 많은 피해들을 고치고/고치거나 그것들을 보상함으로써 상실로부터 이로움을 만들어내려는 욕구를 형성할 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 커진 사랑과 헌신이 구체적인 행동의 동기로 이어짐을 보여주는 결론부입니다. make good from the loss는 상실이라는 뼈아픈 경험을 자양분 삼아 세상의 망가진 부분들을 고치고 채워 넣으면서, 무언가 긍정적이고 가치 있는 결과를 이끌어내려는 마음이 생겨난다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to make good (to부정사): 앞의 명사 a desire를 뒤에서 수식하는 형용사적 기능의 to부정사 구문이다.</div><div class=\"lec-gr-item\">by repairing as many damages as we can and or compensating (동명사): 전치사 by의 목적어로 쓰인 명사적 기능의 동명사 구문이며, repairing과 compensating이 등위접속사 and or로 병렬 연결된 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in time</td><td class=\"m\">이윽고, 시간이 지나면, 제때에</td></tr><tr><td class=\"w\">make good</td><td class=\"m\">보상하다, 벌충하다, 실현하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">애도는 우리를 만들 수 있다</span><span class=\"en\"><b>Grief can <span class=\"grammar-hl\">make us</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">매우 슬프게 그리고 매우 동기부여되게</span><span class=\"en\"><b><span class=\"grammar-hl\">both very sad and very motivated</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행동하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">to act</span>.</b></span></div></div><div class=\"lec-sent-ko\">애도는 우리를 매우 슬프게 만드는 동시에 행동하도록 강하게 동기를 부여할 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글 전체의 논지를 한 문장으로 압축하여 맺음말을 던집니다. both very sad and very motivated to act는 슬픔이라는 감정이 가진 양면성이자 순기능을 짚어줍니다. 슬픔은 몹시 고통스러운 감정이지만, 동시에 그 아픔을 딛고 일어나 더 나은 삶과 세상을 위해 적극적으로 땀 흘려 행동하게 만드는 강력한 원동력이 된다는 점을 강조하며 마무리합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">make us both very sad and very motivated 5형식(SVOC) 구조: 기본구조 &#39;make + O(목적어) + C(목적격 보어)&#39; 형태이다. 목적어 us 뒤에 목적격 보어로 형용사 sad와 과거분사(형용사 역할) motivated가 both A and B 구문으로 병렬 연결되어 있다.</div><div class=\"lec-gr-item\">motivated (과거분사): 5형식 구조의 목적격 보어로 쓰여 목적어 us가 &#39;동기부여된&#39; 상태임을 설명한다.</div><div class=\"lec-gr-item\">to act (to부정사): 부사적 기능으로 쓰여 앞의 목적격 보어(과거분사) motivated를 수식하며, &#39;행동하도록 동기부여된&#39;이라는 의미 구조를 완성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">motivated</td><td class=\"m\">동기가 부여된, 자극받은</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>심리학에서는 상실을 겪을 때 충분히 슬퍼하는 과정(애도)이 마음 건강에 필수적이라고 본다.</li><li>애도 작업은 인간의 유한함을 인정하게 하고, 상실의 아픔을 보듬어 삶의 에너지를 회복시켜 준다.</li><li>잃어버린 것을 위해 충분히 슬퍼하고 나면, 곁에 남은 것을 더욱 사랑하고 소중히 여기게 된다.</li><li>결국 슬픔은 우리를 아프게 하지만, 동시에 세상을 더 낫게 만들고자 행동하게 하는 강력한 원동력이 된다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Grieving requires us to deeply face the sadness of loss, but it ultimately empowers us to heal and move forward.</div>\n              <div class=\"lec-final-sum-ko\">애도는 상실의 슬픔을 깊이 직면하도록 요구하지만, 궁극적으로 우리가 치유하고 앞으로 나아가도록 힘을 준다.</div></div></div>"],"segs":[[{"audio":"./33_audio/1.mp3","hl":null}],[{"audio":"./33_audio/2.mp3","hl":null}],[{"audio":"./33_audio/3.mp3","hl":null},{"audio":"./33_audio/4.mp3","hl":"stage-0"},{"audio":"./33_audio/5.mp3","hl":"stage-1"},{"audio":"./33_audio/6.mp3","hl":"stage-2"},{"audio":"./33_audio/7.mp3","hl":"stage-3"}],[{"audio":"./33_audio/8.mp3","hl":null}],[{"audio":"./33_audio/9.mp3","hl":"main"},{"audio":"./33_audio/10.mp3","hl":"meaning"},{"audio":"./33_audio/11.mp3","hl":"grammar"}],[{"audio":"./33_audio/12.mp3","hl":"main"},{"audio":"./33_audio/13.mp3","hl":"meaning"},{"audio":"./33_audio/14.mp3","hl":"grammar"}],[{"audio":"./33_audio/15.mp3","hl":"main"},{"audio":"./33_audio/16.mp3","hl":"meaning"},{"audio":"./33_audio/17.mp3","hl":"grammar"}],[{"audio":"./33_audio/18.mp3","hl":"main"},{"audio":"./33_audio/19.mp3","hl":"meaning"},{"audio":"./33_audio/20.mp3","hl":"grammar"}],[{"audio":"./33_audio/21.mp3","hl":"main"},{"audio":"./33_audio/22.mp3","hl":"meaning"},{"audio":"./33_audio/23.mp3","hl":"grammar"}],[{"audio":"./33_audio/24.mp3","hl":"main"},{"audio":"./33_audio/25.mp3","hl":"meaning"},{"audio":"./33_audio/26.mp3","hl":"grammar"}],[{"audio":"./33_audio/27.mp3","hl":"main"},{"audio":"./33_audio/28.mp3","hl":"meaning"},{"audio":"./33_audio/29.mp3","hl":"grammar"}],[{"audio":"./33_audio/30.mp3","hl":"main"},{"audio":"./33_audio/31.mp3","hl":"meaning"},{"audio":"./33_audio/32.mp3","hl":"grammar"}],[{"audio":"./33_audio/33.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove(
