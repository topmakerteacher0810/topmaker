</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 33번","audioDir":"33_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">33번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Reading as a Spectrum: From a Single Concept to Family Resemblances\u003c/h1>\u003ch2>스펙트럼으로서의 읽기: 단일 개념에서 가족 유사성으로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>읽기는 하나의 명백한 특성을 공통적으로 가지지 않은 채 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">유사성\u003c/b> 때문에 묶이는 헐겁게 연결된 행동이며, 읽기와 읽기가 아닌 것의 \u003cb class=\"key\">경계\u003c/b>는 유연해서 \u003cb class=\"key\">스펙트럼\u003c/b>으로 이해해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Reading is best understood not as a single, logically consistent concept but as a spectrum of loosely related behaviors connected by family resemblances without a single defining trait.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 살펴볼 지문은 전국연합학력평가에서 나온 읽기 개념에 대한 글이에요. 이 글은 읽기를 하나의 단일한 개념으로 보는 시각에 의문을 던지고, 가족 유사성과 스펙트럼이라는 틀로 다시 설명합니다. 요지는 읽기는 한 가지 공통 특성으로 규정되기보다 유연한 스펙트럼으로 보아야 한다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">어떤 말을 정의할 때 하나의 명확한 기준만 떠올리기 쉽지만, 실제 개념은 그보다 훨씬 유연한 경우가 많습니다. 비트겐슈타인이 말한 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">유사성\u003c/b> family resemblance은 가족 구성원들이 하나의 동일한 특징이 아니라 여러 특징을 서로 겹쳐 공유한다는 발상입니다. 읽기에도 종이책 읽기, 훑어 읽기, 오디오북 듣기 같은 활동이 겹치면서 \u003cb class=\"key\">읽기와 \u003c/b>\u003cb class=\"key\">읽기가 \u003c/b>\u003cb class=\"key\">아닌 \u003c/b>\u003cb class=\"key\">것\u003c/b>의 경계가 모호해집니다. 이는 마치 무지개에서 색과 색의 경계를 칼로 자르듯 명확히 나눌 수 없는 것과 비슷합니다. 따라서 이 글은 읽기를 하나의 고정된 정의가 아니라 \u003cb class=\"key\">스펙트럼\u003c/b>처럼 폭넓게 이해하자고 제안합니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 어떤 단어를 정의할 때 우리는 종종 필요충분조건을 떠올리는데, 실제 개념은 그렇게 딱 떨어지지 않아요. 비트겐슈타인이 말한 가족 유사성 family resemblance는 가족 구성원들이 하나의 같은 특징이 아니라 여러 특징을 겹쳐 공유한다는 개념입니다. 읽기에도 종이책 읽기, 훑어 읽기, 오디오북 듣기 같은 활동이 겹치기 때문에 경계가 모호해져요. 이건 마치 무지개에서 색과 색의 경계를 명확히 자르기 어려운 것과 비슷합니다. 그래서 이 글은 읽기를 스펙트럼처럼 폭넓게 보자고 제안해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>단일 개념이라는 통념\u003csmall>통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 문장과 두 번째 문장은 읽기를 \u003cb class=\"key\">단일 \u003c/b>\u003cb class=\"key\">개념\u003c/b>으로 보는 시각을 소개하고 질문한다. 사람들은 책을 가지고 하는 다른 행동과 \u003cb class=\"key\">깔끔하게 \u003c/b>\u003cb class=\"key\">분리\u003c/b>될 수 있는 읽기가 있다고 주장한다. 이어지는 질문은 이러한 전제에 의문을 던진다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>가족 유사성으로의 전환\u003csmall>전환 · 문장 3\u003c/small>\u003c/h4>\u003cp>세 번째 문장은 읽기를 생산적으로 생각하는 방법을 제시한다. 읽기는 하나의 명백한 특성을 공통으로 가지지 않은 채 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">유사성\u003c/b> 때문에 묶인 \u003cb class=\"key\">헐겁게 \u003c/b>\u003cb class=\"key\">연결된 \u003c/b>\u003cb class=\"key\">행동\u003c/b>이라고 본다. 여기서 글의 핵심 관점이 드러난다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>경계 설정의 실패\u003csmall>근거 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>네 번째 문장은 읽기와 읽기가 아닌 것을 구분하려는 노력이 \u003cb class=\"key\">실패\u003c/b>한다고 본다. 애초에 무엇이 읽기로서의 자격을 주는지 \u003cb class=\"key\">동의\u003c/b>가 없기 때문이다. 다섯 번째 문장은 경계를 알려고 하면 할수록 \u003cb class=\"key\">특이 \u003c/b>\u003cb class=\"key\">사례\u003c/b>가 나와 유연한 경계가 늘어난다고 설명한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>스펙트럼으로의 수용\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>여섯 번째 문장은 \u003cb class=\"key\">예외적인 \u003c/b>\u003cb class=\"key\">읽기\u003c/b> 형태를 하나의 토론의 장으로 모으자고 제안한다. 이는 읽기가 시작되고 끝나는 \u003cb class=\"key\">경계\u003c/b>를 정하려는 사람들이 겪는 어려움을 부각한다. 일곱 번째 문장은 읽기를 별개의 활동을 수용하는 \u003cb class=\"key\">스펙트럼\u003c/b>으로 이해하게 된다고 마무리한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장 흐름을 따라가며 글의 논리를 정리해 볼게요.","hl":null},{"n":4,"text":"첫 번째 문장과 두 번째 문장에서는 읽기를 하나의 논리적으로 일관된 개념으로 보는 통념을 소개해요. 사람들은 책으로 하는 다른 행동과 깔끔하게 분리되는 읽기가 있다고 주장하죠. 그런데 바로 이어서 읽기가 정말 그렇게 단순한지 질문을 던집니다.","hl":"f0"},{"n":5,"text":"세 번째 문장에서 저자는 읽기를 생산적으로 사고하는 관점을 제시합니다. 읽기는 하나의 명백한 특성을 공통으로 가지지 않고 가족 유사성 때문에 묶인 헐겁게 연결된 행동의 묶음이라고 말해요. 여기서 가족 유사성 family resemblance이라는 표현이 핵심이에요.","hl":"f1"},{"n":6,"text":"네 번째 문장은 결론적으로 읽기와 읽기가 아닌 것을 구분하려는 노력이 실패한다고 봐요. 애초에 무엇이 읽기로서 자격을 주는지에 대한 동의가 없기 때문이죠. 다섯 번째 문장에서는 경계를 알려고 할수록 더 많은 특이 사례가 나와서 유연한 경계가 확장된다고 설명합니다.","hl":"f2"},{"n":7,"text":"여섯 번째 문장은 예외적인 읽기의 형태를 하나의 토론의 장으로 모으는 시도가 가치 있다고 제안해요. 이 토론의 장은 읽기가 시작되고 끝나는 경계를 정하려는 사람이 마주하는 어려움을 부각하죠. 마지막으로 일곱 번째 문장은 읽기를 별개의 읽기 활동을 수용할 만큼 광범위한 스펙트럼으로 이해하게 된다고 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 처음에 읽기가 하나의 \u003cb class=\"key\">단일 \u003c/b>\u003cb class=\"key\">개념\u003c/b>이라는 통념을 제시하고 곧바로 의문을 던진다. 세 번째 문장에서 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">유사성\u003c/b>에 기반한 새로운 관점을 내놓으므로 중심 주장이 앞부분에 드러난다. 이후에는 \u003cb class=\"key\">경계\u003c/b> 설정이 실패하는 이유와 특이 사례를 근거로 제시하고, 마지막에 \u003cb class=\"key\">스펙트럼\u003c/b>으로 수용하자는 제안으로 마무리한다. 따라서 \u003cb class=\"key\">두괄식\u003c/b> 구조의 \u003cb class=\"key\">통념-반박\u003c/b> 전개로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Is reading really that simple? (2)\u003c/b>\u003cspan>질문/전환\u003c/span>\u003cb>Consequently (4)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>The more ..., the more ... (5)\u003c/b>\u003cspan>비례/강조\u003c/span>\u003cb>Thus (6)\u003c/b>\u003cspan>결론/제안\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a single, logically consistent concept known as reading\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reading\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a loosely related set of behaviors\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">family resemblances\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">exceptional forms of reading\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reading as a spectrum\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>읽기를 단일 개념으로 보는 관점\u003c/th>\u003cth>읽기를 스펙트럼으로 보는 관점\u003c/th>\u003c/tr>\u003ctr>\u003ctd>하나의 명백한 특성을 공유함\u003c/td>\u003ctd>공통 특성 없이 가족 유사성으로 연결됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>읽기와 읽기가 아닌 것의 경계가 명확함\u003c/td>\u003ctd>경계가 유연하고 특이 사례가 많음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 통념 반박 구조예요. 처음에 읽기가 단일 개념이라는 통념을 던지고 바로 의문을 제기한 다음, 가족 유사성에 기반한 새로운 관점을 제시합니다. 그 후 경계 설정이 실패하는 이유를 근거로 들고, 최종적으로 스펙트럼이라는 대안으로 마무리하죠. 중심 주장이 세 번째 문장에 나오므로 두괄식 구조로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 네 번째 문장의 consequently는 앞선 제안에서 따라 나오는 결과를 나타내요. 여섯 번째 문장의 thus는 최종 제안을 이끄는 결론 신호어이죠. 또한 reading, loosely related set of behaviors, exceptional forms of reading, spectrum은 같은 읽기 개념을 조금씩 다르게 재진술한 표현이에요. 읽기와 읽기가 아닌 것의 대조도 계속 반복되니 그 경계의 유연함에 주목하세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>argue\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>logically consistent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>논리적으로 일관된\u003c/span>\u003c/div>\u003cdiv>\u003cb>concept\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개념\u003c/span>\u003c/div>\u003cdiv>\u003cb>set apart\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>분리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>productive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>생산적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>loosely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>헐겁게\u003c/span>\u003c/div>\u003cdiv>\u003cb>related\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관련된\u003c/span>\u003c/div>\u003cdiv>\u003cb>owing to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~ 때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>family resemblances\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가족 유사성\u003c/span>\u003c/div>\u003cdiv>\u003cb>defining trait\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결정적 특성\u003c/span>\u003c/div>\u003cdiv>\u003cb>consequently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>결론적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>distinguish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구별하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>destined\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>~할 운명인\u003c/span>\u003c/div>\u003cdiv>\u003cb>agreement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동의\u003c/span>\u003c/div>\u003cdiv>\u003cb>qualify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자격을 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the first place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>애초에\u003c/span>\u003c/div>\u003cdiv>\u003cb>figure out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>알아내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>border\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경계\u003c/span>\u003c/div>\u003cdiv>\u003cb>edge cases\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특이 사례\u003c/span>\u003c/div>\u003cdiv>\u003cb>stretch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>flexible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유연한\u003c/span>\u003c/div>\u003cdiv>\u003cb>exceptional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>예외적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>forum\u003c/b>\u003cem>명사\u003c/em>\u003cspan>토론의 장\u003c/span>\u003c/div>\u003cdiv>\u003cb>highlight\u003c/b>\u003cem>동사\u003c/em>\u003cspan>돋보이게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>establish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>spectrum\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스펙트럼\u003c/span>\u003c/div>\u003cdiv>\u003cb>expansive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>광범위한\u003c/span>\u003c/div>\u003cdiv>\u003cb>accommodate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>distinct\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>별개의\u003c/span>\u003c/div>\u003cdiv>\u003cb>activities\u003c/b>\u003cem>명사\u003c/em>\u003cspan>활동\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘 중에서 family resemblance는 가족 유사성이라는 뜻으로 이 글의 핵심 개념이에요. distinguish는 구별하다, qualify는 자격을 주다, edge cases는 특이 사례라는 뜻이죠. spectrum은 스펙트럼, expansive는 광범위한, accommodate는 수용하다로 정리해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">productive\u003c/b>\u003cspan class=\"m\">생산적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fruitful\u003c/span>\u003cspan class=\"s\">effective\u003c/span>\u003cspan class=\"s\">constructive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unproductive\u003c/span>\u003cspan class=\"a\">fruitless\u003c/span>\u003cspan class=\"a\">ineffective\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distinguish\u003c/b>\u003cspan class=\"m\">구별하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">differentiate\u003c/span>\u003cspan class=\"s\">discern\u003c/span>\u003cspan class=\"s\">tell apart\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">confuse\u003c/span>\u003cspan class=\"a\">conflate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">flexible\u003c/b>\u003cspan class=\"m\">유연한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adaptable\u003c/span>\u003cspan class=\"s\">elastic\u003c/span>\u003cspan class=\"s\">pliable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rigid\u003c/span>\u003cspan class=\"a\">inflexible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exceptional\u003c/b>\u003cspan class=\"m\">예외적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unusual\u003c/span>\u003cspan class=\"s\">extraordinary\u003c/span>\u003cspan class=\"s\">atypical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">typical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expansive\u003c/b>\u003cspan class=\"m\">광범위한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">broad\u003c/span>\u003cspan class=\"s\">extensive\u003c/span>\u003cspan class=\"s\">inclusive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">narrow\u003c/span>\u003cspan class=\"a\">limited\u003c/span>\u003cspan class=\"a\">restricted\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accommodate\u003c/b>\u003cspan class=\"m\">수용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">include\u003c/span>\u003cspan class=\"s\">fit\u003c/span>\u003cspan class=\"s\">adapt\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"productive는 생산적인이라는 뜻이고 fruitful이나 effective와 바꿔 쓸 수 있어요. distinguish는 differentiate나 discern과 유의어이고, confuse와는 반대말이에요. flexible은 adaptable이나 elastic과 가깝고 rigid나 inflexible과는 반대예요. exceptional은 unusual과 비슷하고 ordinary와 반대이며, expansive는 broad와 가깝고 narrow와 반대입니다. accommodate는 include와 유의어이고 exclude와 반대라는 점까지 함께 기억해 두면 좋아요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇몇 사람들은 주장한다\u003c/span>\u003cspan class=\"en\">Some people argue\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유일하고 논리적으로 일관성 있는 개념이 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">single, \u003c/span>\u003cspan class=\"tgt\">logically \u003c/span>\u003cspan class=\"tgt\">consistent \u003c/span>\u003cspan class=\"tgt\">concept\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">읽기로 알려진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">known \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">reading\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깔끔하게 분리될 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">neatly \u003c/span>\u003cspan class=\"tgt\">set \u003c/span>\u003cspan class=\"tgt\">apart \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 책으로 하는 모든 다른 행동들로부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">everything \u003c/span>\u003cspan class=\"tgt\">else \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">books\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">몇몇 사람들은 사람들이 책을 가지고 하는 모든 다른 행동들로부터 깔끔하게 분리될 수 있는, 읽기로 알려진 유일하고 논리적으로 일관성 있는 개념이 있다고 주장한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 읽기를 하나의 \u003cb class=\"key\">단일하게 \u003c/b>\u003cb class=\"key\">정의되는 \u003c/b>\u003cb class=\"key\">개념\u003c/b>으로 보는 전통적 시각을 제시합니다. 글쓴이가 곧바로 의문을 제기할 대상이므로, 이 문장은 논의의 출발점 역할을 합니다. '책으로 하는 모든 다른 행동'과 \u003cb class=\"key\">깔끔하게 \u003c/b>\u003cb class=\"key\">분리\u003c/b>될 수 있다는 표현은 읽기의 경계가 분명하다는 가정을 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : argue + [that + 완전한 절] : \"유일하고 논리적으로 일관성 있는 개념이 있다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사(구)의 형용사적 용법\u003c/span> : a single, logically consistent concept + [known as reading] : \"읽기로 알려진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 [a single, logically consistent concept known as reading] + [that + can be neatly set apart...] : \"사람들이 책으로 하는 모든 다른 행동들로부터 깔끔하게 분리될 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Some people argue, 몇몇 사람들은 주장한다. that there is a single, logically consistent concept, 유일하고 논리적으로 일관성 있는 개념이 있다고. known as reading, 읽기로 알려진. that can be neatly set apart, 깔끔하게 분리될 수 있는. from everything else people do with books, 사람들이 책으로 하는 모든 다른 행동들로부터. 이 문장 전체를 해석하면, 몇몇 사람들은 사람들이 책을 가지고 하는 모든 다른 행동들로부터 깔끔하게 분리될 수 있는, 읽기로 알려진 유일하고 논리적으로 일관성 있는 개념이 있다고 주장한다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 읽기를 하나의 단일하고 논리적으로 일관된 개념으로 보는 전통적인 시각을 소개해요. 여기서는 읽기가 책으로 하는 다른 행동들과 깔끔하게 분리될 수 있다고 가정하고 있어요. 이 문장은 다음 문장에서 의문을 제기하기 위한 도입부 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 명사절 접속사 that이에요. argue라는 타동사의 목적어 자리에 that절이 왔고, that절 안은 완전한 문장이에요. 두 번째 포인트는 known as reading인데, 과거분사 known이 앞의 명사 concept을 꾸며 주는 형용사적 용법이에요. 세 번째 포인트는 관계대명사 that으로, 선행사 concept을 수식하면서 절 안에서 주어 역할을 합니다. which로 바꿔 쓸 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">읽기는\u003c/span>\u003cspan class=\"en\">Is reading\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정말 그렇게 단순할까\u003c/span>\u003cspan class=\"en\">really \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">simple\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">읽기는 정말로 그렇게 단순할까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 짧은 의문문은 앞 문장의 전통적 가정을 \u003cb class=\"key\">반박\u003c/b>하려는 것이 아니라 의문을 제기합니다. 'really that simple'이라는 표현으로 읽기가 단일 개념이라는 주장을 흔들며, 다음 문장에서 대안을 제시할 계기를 만듭니다. 글 전체에서 \u003cb class=\"key\">논지 \u003c/b>\u003cb class=\"key\">전환\u003c/b>의 고리 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사 that\u003c/span> : that + [형용사 simple] : \"그렇게 단순한\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Is reading, 읽기는. really that simple?, 정말 그렇게 단순할까. 이 문장 전체를 해석하면, 읽기는 정말로 그렇게 단순할까?","hl":"m"},{"n":16,"text":"이 문장은 앞 문장이 제시한 읽기에 대한 전통적인 시각에 정말로 그렇게 단순한지 의문을 던져요. 이 질문은 단순한 답을 요구하기보다는 뒤에서 읽기를 다른 방식으로 설명하도록 유도해요. 전체 글에서 논지를 전환하는 연결고리 역할을 합니다.","hl":"mn"},{"n":17,"text":"여기서 포인트는 that simple이에요. that은 지시사가 아니라 형용사 simple을 꾸며 주는 부사로 쓰여서 그렇게 단순한이라는 뜻을 만들어요. 이 표현 덕분에 읽기가 단순하다는 앞 문장의 전제에 의문이 생기게 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">읽기에 대해 생각하는 가장 생산적인 방식은\u003c/span>\u003cspan class=\"en\">The most productive way \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">reading\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">헐겁게 연결된 행동의 묶음으로서이다\u003c/span>\u003cspan class=\"en\">is as a loosely related set of behaviors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족 유사성 때문에 함께 속하게 되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">belong \u003c/span>\u003cspan class=\"tgt\">together \u003c/span>\u003cspan class=\"tgt\">owing \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">family \u003c/span>\u003cspan class=\"tgt\">resemblances\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Ludwig Wittgenstein이 그 어구를 사용한 것처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">Ludwig \u003c/span>\u003cspan class=\"tgt\">Wittgenstein \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">phrase\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공통적으로 가지지 않은 채\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">having \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">common \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 명백한 특성을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">single \u003c/span>\u003cspan class=\"tgt\">defining \u003c/span>\u003cspan class=\"tgt\">trait\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">읽기에 대해 생각하는 가장 생산적인 방식은 하나의 명백한 특성을 공통적으로 가지지 않은 채 Ludwig Wittgenstein이 그 어구를 사용한 것처럼 가족 유사성 때문에 함께 속하게 되는 헐겁게 연결된 행동의 묶음으로서이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글쓴이의 핵심 주장으로, 읽기는 \u003cb class=\"key\">공통의 \u003c/b>\u003cb class=\"key\">단일 \u003c/b>\u003cb class=\"key\">특성\u003c/b>이 아니라 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">유사성\u003c/b>에 의해 묶인 행동들의 집합이라고 재정의합니다. Wittgenstein의 비유를 통해 읽기의 경계가 명확하지 않음을 보여 주며, 다음에 이어질 예외적 읽기 사례들을 포괄할 근거를 마련합니다. without having in common a single defining trait라는 표현은 \u003cb class=\"key\">단일 \u003c/b>\u003cb class=\"key\">정의 \u003c/b>\u003cb class=\"key\">특성이 \u003c/b>\u003cb class=\"key\">없음\u003c/b>을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : way + [to think about reading (to부정사구)] : \"읽기에 대해 생각하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 [a loosely related set of behaviors] + [that + belong together...] : \"가족 유사성 때문에 함께 속하게 되는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 as (방식)\u003c/span> : [as + 주어 + 동사] : \"Ludwig Wittgenstein이 그 어구를 사용한 것처럼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">동명사구 (전치사 without의 목적어)\u003c/span> : without + [having in common a single defining trait] : \"하나의 명백한 특성을 공통적으로 가지지 않은 채\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The most productive way to think about reading, 읽기에 대해 생각하는 가장 생산적인 방식은. is as a loosely related set of behaviors, 헐겁게 연결된 행동의 묶음으로서이다. that belong together owing to family resemblances, 가족 유사성 때문에 함께 속하게 되는. as Ludwig Wittgenstein used the phrase, Ludwig Wittgenstein이 그 어구를 사용한 것처럼. without having in common, 공통적으로 가지지 않은 채. a single defining trait, 하나의 명백한 특성을. 이 문장 전체를 해석하면, 읽기에 대해 생각하는 가장 생산적인 방식은 하나의 명백한 특성을 공통적으로 가지지 않은 채 Ludwig Wittgenstein이 그 어구를 사용한 것처럼 가족 유사성 때문에 함께 속하게 되는 헐겁게 연결된 행동의 묶음으로서이다.","hl":"m"},{"n":19,"text":"세 번째 문장은 글쓴이의 핵심 주장이에요. 읽기는 공통의 단일 특성이 있는 개념이 아니라, 가족 유사성 때문에 함께 묶이는 헐겁게 연결된 행동의 묶음이라고 설명해요. Wittgenstein의 표현을 빌려서 읽기의 경계가 유연하다는 것을 보여 주고, 다음에 나올 예외적 읽기 사례들을 담을 수 있는 틀을 제시합니다.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 to think about reading이에요. 이 to부정사구는 앞의 명사 way를 꾸며 주는 형용사적 용법으로, 읽기에 대해 생각하는 가장 생산적인 방식이라는 뜻을 만들어요. 두 번째 포인트는 관계대명사 that인데, 선행사 behaviors를 수식하면서 절 안에서 주어 역할을 하고, 선행사가 복수라 동사 belong이 쓰였어요. 세 번째 포인트는 as Ludwig Wittgenstein used the phrase인데, 여기서 as는 ~처럼이라는 뜻의 접속사이고, Wittgenstein이 그 어구를 사용한 것처럼이라는 비유를 나타내요. 네 번째 포인트는 without having in common a single defining trait로, 전치사 without의 목적어로 동명사구 having이 와서 공통적으로 가지지 않은 채라는 부대 상황을 표현해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결론적으로, 읽기와 읽기가 아닌 것을 구분하려는 노력은\u003c/span>\u003cspan class=\"en\">Consequently, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">efforts \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">distinguish \u003c/span>\u003cspan class=\"tgt\">reading \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">nonreading\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실패할 운명인데 왜냐하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">destined \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fail\u003c/span> because\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동의가 없다\u003c/span>\u003cspan class=\"en\">there is no agreement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇이 읽기로서의 자격을 주는지에 대한\u003c/span>\u003cspan class=\"en\">on \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">qualifies \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">reading\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">애초에.\u003c/span>\u003cspan class=\"en\">in the first place.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결론적으로, 읽기와 읽기가 아닌 것을 구분하려는 노력은 실패로 돌아가는데, 왜냐하면 애초에 무엇이 읽기로서의 자격을 주는가에 대한 동의가 없기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 읽기와 읽기가 아닌 것을 구분하려는 시도가 실패할 수밖에 없는 이유를 설명합니다. 무엇이 \u003cb class=\"key\">읽기로서의 \u003c/b>\u003cb class=\"key\">자격\u003c/b>을 주는지에 대한 \u003cb class=\"key\">동의\u003c/b>가 애초에 없기 때문이라는 점을 강조해요. 앞선 가족 유사성 논의를 이어받아 경계 설정이 불가능함을 결론적으로 제시하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : efforts [명사] + to distinguish [to부정사구/형용사적 수식] : \"읽기와 읽기가 아닌 것을 구분하려는 노력\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be destined to부정사\u003c/span> : be destined + to fail [to부정사] : \"실패할 운명이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사절(전치사의 목적어)\u003c/span> : on + what qualifies as reading [의문사절/명사절] : \"무엇이 읽기로서의 자격을 주는지\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Consequently, efforts to distinguish reading from nonreading, 결론적으로, 읽기와 읽기가 아닌 것을 구분하려는 노력은. are destined to fail because, 실패할 운명인데 왜냐하면. there is no agreement, 동의가 없다. on what qualifies as reading, 무엇이 읽기로서의 자격을 주는지에 대한. in the first place, 애초에.. 이 문장 전체를 해석하면, 결론적으로, 읽기와 읽기가 아닌 것을 구분하려는 노력은 실패로 돌아가는데, 왜냐하면 애초에 무엇이 읽기로서의 자격을 주는가에 대한 동의가 없기 때문이다.","hl":"m"},{"n":22,"text":"이 문장은 읽기와 읽기가 아닌 것을 구분하려는 시도가 결국 실패할 수밖에 없는 이유를 말해 줍니다. 무엇이 읽기로서의 자격을 주는지, 즉 reading으로 인정받는 기준에 대한 동의가 애초에 없기 때문이에요. 따라서 경계를 정하려는 노력은 성립하기 어렵다는 논지의 핵심 근거가 되는 문장입니다.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 efforts to distinguish reading from nonreading에 있는 to부정사입니다. 여기서 to distinguish는 앞에 있는 명사 efforts를 수식하는 형용사적 용법으로, 읽기와 읽기가 아닌 것을 구분하려는 노력이라는 뜻을 만들어요. 두 번째는 are destined to fail입니다. be destined to부정사는 실패할 운명이다라는 의미로, to부정사와 함께 굳어진 표현이에요. 세 번째는 what qualifies as reading입니다. 의문사 what이 이끄는 절이 전치사 on의 목적어로 쓰여서, 무엇이 읽기로서의 자격을 주는지에 대한 이라는 명사절 역할을 해요. 의문사절 안에서는 what, qualifies, as reading의 어순이 그대로 유지돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많이 알아내려고 하면 할수록\u003c/span>\u003cspan class=\"en\">The more one tries to figure out\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경계가 어디에 있는지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">border \u003c/span>\u003cspan class=\"tgt\">lies\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">읽기와 읽기가 아닌 것 사이의\u003c/span>\u003cspan class=\"en\">between reading and not-reading,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 특이 사례들이 발견될 것이다\u003c/span>\u003cspan class=\"en\">the more edge cases \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">found \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 용어의 유연한 경계를 확장하는 것으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stretch \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">term's \u003c/span>\u003cspan class=\"tgt\">flexible \u003c/span>\u003cspan class=\"tgt\">boundaries\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">읽기와 읽기가 아닌 것 사이의 경계가 어디에 있는가를 알려고 하면 할수록, 더욱 많은 특이 사례들이 그 용어의 유연한 경계를 확장하고 있다는 것이 밝혀질 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 읽기의 경계를 알아내려고 할수록 오히려 예외가 더 많이 드러난다고 말합니다. \u003cb class=\"key\">edge \u003c/b>\u003cb class=\"key\">cases\u003c/b>라는 표현은 기존 경계에 맞지 않는 \u003cb class=\"key\">특이 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 뜻해요. 이로써 읽기라는 용어의 경계가 유연하고 넓어질 수밖에 없음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : figure out + where the border lies [간접의문문] : \"경계가 어디에 있는지를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 + to부정사\u003c/span> : will be found + to stretch [to부정사] : \"그 용어의 유연한 경계를 확장하는 것으로 밝혀질 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">the 비교급 구문\u003c/span> : The more + 주어 + 동사, the more + 주어 + 동사 : \"더 많이 알아내려고 하면 할수록, 더 많은 특이 사례들이 발견될 것이다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The more one tries to figure out, 더 많이 알아내려고 하면 할수록. where the border lies, 경계가 어디에 있는지를. between reading and not-reading, 읽기와 읽기가 아닌 것 사이의. the more edge cases will be found, 더 많은 특이 사례들이 발견될 것이다. to stretch the term's flexible boundaries, 그 용어의 유연한 경계를 확장하는 것으로. 이 문장 전체를 해석하면, 읽기와 읽기가 아닌 것 사이의 경계가 어디에 있는가를 알려고 하면 할수록, 더욱 많은 특이 사례들이 그 용어의 유연한 경계를 확장하고 있다는 것이 밝혀질 것이다.","hl":"m"},{"n":25,"text":"이 문장은 읽기와 읽기가 아닌 것 사이의 경계를 알아내려고 하면 할수록, 오히려 더 많은 특이 사례들이 나타나서 그 용어의 경계가 유연하게 늘어난다는 의미예요. the 비교급 구문이 앞과 뒤의 변화를 함께 보여 주며, edge cases는 경계에 딱 맞지 않는 예외적인 사례를 가리켜요. 그래서 읽기의 경계를 확정하려는 시도가 점점 더 어려워진다는 흐름을 만들어 줍니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 The more one tries to figure out, the more edge cases will be found입니다. 이건 the 비교급, the 비교급 구문으로, 앞절의 정도가 커질수록 뒤절의 정도도 커진다는 뜻이에요. 더 많이 알아내려고 하면 할수록 더 많은 특이 사례들이 발견될 것이다라고 해석합니다. 두 번째는 where the border lies입니다. 의문사 where 다음에 the border가 주어, lies가 동사로 와서 간접의문문 어순이 만들어졌어요. figure out의 목적어 역할을 하면서 경계가 어디에 있는지를 의미합니다. 세 번째는 will be found to stretch입니다. 수동태 be found 뒤에 to부정사가 붙어서, 경계를 확장하는 것으로 밝혀질 것이다라는 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로, 함께 모으려고 시도하는 것은 가치가 있다\u003c/span>\u003cspan class=\"en\">Thus, it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">worth \u003c/span>\u003cspan class=\"tgt\">attempting\u003c/span> to collect together\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 예외적인  번째는 one highlighting the challenges입니다. one은 앞의 a single forum을 가리키는 동격이고, highlighting은 능동의 현재분사로 one을 수식해요. 세 번째는 faced by anyone wishing to establish the boundaries입니다. faced는 challenges를 수식하는 과거분사로 수동의 의미이고, wishing은 anyone을 수식하는 현재분사로 능동의 의미예요. 네 번째는 where reading begins and ends입니다. 관계부사 where가 선행사 boundaries를 수식하면서, 읽기가 시작되고 끝나는 경계라는 뜻을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 시도는 ~로 나아간다\u003c/span>\u003cspan class=\"en\">The attempt moves toward\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">읽기에 대한 이해로\u003c/span>\u003cspan class=\"en\">an understanding of reading\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스펙트럼으로서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">spectrum\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충분히 광범위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">expansive\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">별개의 읽기 활동들을 수용할 만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">accommodate \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">distinct \u003c/span>\u003cspan class=\"tgt\">reading \u003c/span>\u003cspan class=\"tgt\">activities\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러한 시도는 별개의 읽기 활동들을 다 수용할 만큼 충분히 광범위한 스펙트럼으로서 읽기를 이해하는 것으로 발전한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 읽기를 하나의 고정된 정의가 아니라, 별개의 읽기 활동들을 담을 수 있는 넓은 \u003cb class=\"key\">스펙트럼\u003c/b>으로 이해하려는 시도라고 정리합니다. 앞서 논의한 예외적인 읽기 형태들을 한데 모으는 시도가 결국 읽기의 경계를 유연하게 넓히는 방향으로 이어진다는 흐름을 마무리합니다. 핵심은 읽기를 배타적으로 구분하는 대상이 아니라 서로 다른 활동을 \u003cb class=\"key\">수용\u003c/b>하는 관점으로 보는 것입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 as의 자격·역할 용법\u003c/span> : as + 명사구 : \"스펙트럼으로서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 that의 주격 용법\u003c/span> : 선행사 spectrum + that + 동사(is) : \"광범위한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">enough + to부정사 구문\u003c/span> : 형용사(expansive) + enough + to부정사 : \"별개의 읽기 활동들을 수용할 만큼 충분히\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The attempt moves toward, 그 시도는 ~로 나아간다. an understanding of reading, 읽기에 대한 이해로. as a spectrum, 스펙트럼으로서. that is expansive enough, 충분히 광범위한. to accommodate the distinct reading activities, 별개의 읽기 활동들을 수용할 만큼. 이 문장 전체를 해석하면, 그러한 시도는 별개의 읽기 활동들을 다 수용할 만큼 충분히 광범위한 스펙트럼으로서 읽기를 이해하는 것으로 발전한다.","hl":"m"},{"n":31,"text":"이 문장은 읽기를 하나로 딱 떨어지는 정의로 보지 말고, 별개의 읽기 활동들을 다 담을 수 있을 만큼 넓은 스펙트럼으로 이해하려는 시도라고 정리하는 문장이에요. 앞에서 말한 예외적인 읽기 형태들을 한데 모으는 시도가 결국 읽기의 경계를 유연하게 넓히는 방향으로 이어진다는 뜻이죠. 핵심은 읽기를 배타적으로 구분하는 대상이 아니라 서로 다른 활동을 포용하는 연속적인 스펙트럼으로 보는 관점이에요.","hl":"mn"},{"n":32,"text":"첫 번째, as a spectrum에서 as는 ~로서라는 자격을 나타내는 전치사예요. 그래서 reading as a spectrum은 읽기를 스펙트럼으로서 본다는 뜻이 됩니다. 두 번째, that is expansive에서 that은 바로 앞의 명사 spectrum을 받는 관계대명사이고, 절 안에서 주어 역할을 해요. 뒤에 동사 is가 있기 때문에 앞의 spectrum을 꾸며 주는 형용사절이 되는 거죠. 세 번째, enough to accommodate the distinct reading activities는 enough와 to부정사가 함께 쓰인 구문이에요. expansive enough는 충분히 광범위한, 그 뒤에 to accommodate는 수용할 만큼이라는 정도를 나타내요. 이 부분 전체는 별개의 읽기 활동들을 다 수용할 만큼 충분히 광범위하다는 의미가 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>처음에는 읽기를 다른 행동과 \u003cb class=\"key\">깔끔하게 \u003c/b>\u003cb class=\"key\">분리\u003c/b>되는 \u003cb class=\"key\">단일 \u003c/b>\u003cb class=\"key\">개념\u003c/b>으로 보는 시각이 제시된다.\u003c/li>\u003cli>그러나 읽기는 공통된 \u003cb class=\"key\">결정적 \u003c/b>\u003cb class=\"key\">특성\u003c/b> 없이 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">유사성\u003c/b>으로 묶인 헐거운 행동 집합이다.\u003c/li>\u003cli>읽기와 읽기가 아닌 것의 \u003cb class=\"key\">경계\u003c/b>는 유연해서 \u003cb class=\"key\">특이 \u003c/b>\u003cb class=\"key\">사례\u003c/b>가 계속 나타난다.\u003c/li>\u003cli>따라서 읽기는 별개의 활동을 수용하는 \u003cb class=\"key\">스펙트럼\u003c/b>으로 이해해야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Reading is best understood not as a single, logically consistent concept but as a spectrum of loosely related behaviors connected by family resemblances without a single defining trait.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">읽기는 하나의 명백한 특성을 공통적으로 가지지 않은 채 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">유사성\u003c/b> 때문에 묶이는 헐겁게 연결된 행동이며, 읽기와 읽기가 아닌 것의 \u003cb class=\"key\">경계\u003c/b>는 유연해서 \u003cb class=\"key\">스펙트럼\u003c/b>으로 이해해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글의 핵심은 읽기를 하나의 단일 개념으로 보지 말고 가족 유사성에 따라 묶인 스펙트럼으로 이해해야 한다는 거예요. 이렇게 보면 읽기와 읽기가 아닌 것의 경계는 유연하고, 예외적인 형태까지 포용할 수 있습니다. 여러분도 문제를 풀 때 경계를 지나치게 딱 잘라 정의하려는 선택지는 조심해야 해요. 오늘 강의는 여기까지입니다. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
