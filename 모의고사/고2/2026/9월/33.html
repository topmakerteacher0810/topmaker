}
lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 33번","audioDir":"33_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">33번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>From Grief to Action: The Healing Power of Grief Work\u003c/h1>\u003ch2>애도에서 행동으로: 애도 작업의 치유력\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이 글은 \u003cb class=\"key\">애도\u003c/b>가 의식에 필수적인 \u003cb class=\"key\">역동적 \u003c/b>\u003cb class=\"key\">정서 \u003c/b>\u003cb class=\"key\">과정\u003c/b>으로, 상실과 슬픔을 존중하며 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">에너지\u003c/b>를 회복하고 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">변신\u003c/b>을 준비하게 한다고 설명한다. 애도는 남아 있는 것에 대한 \u003cb class=\"key\">사랑과 \u003c/b>\u003cb class=\"key\">헌신\u003c/b>을 강화하고 피해를 \u003cb class=\"key\">복구·보상\u003c/b>하려는 \u003cb class=\"key\">욕구\u003c/b>와 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">동기\u003c/b>를 불러일으킨다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Grieving is an essential dynamic emotional process that strengthens love and commitment for what remains and motivates action to repair and compensate after loss.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 고등학교 이학년 구월 모의고사 서른세 번째 문항 지문을 함께 보겠습니다. 이 글은 심리학 이론들이 말하는 애도의 중요성에서 시작해서 애도가 삶의 회복과 행동으로 이어지는 과정을 설명해요. 요지는 애도가 슬픔처럼 보이지만 사실은 사랑과 헌신을 강화하고 행동을 이끄는 필수적인 과정이라는 점입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">심리학에서는 \u003cb class=\"key\">애도(grief)\u003c/b>를 사랑하는 대상이나 중요한 것을 잃은 뒤 나타나는 자연스러운 \u003cb class=\"key\">정서 \u003c/b>\u003cb class=\"key\">반응\u003c/b>으로 본다. 슬픔, 분노, 죄책감 같은 감정이 함께 나타나며, 이를 단순한 약함이 아니라 \u003cb class=\"key\">상실(loss)\u003c/b>을 받아들이고 삶을 재구성하는 과정으로 이해한다. 이 지문은 개인적 상실에서 \u003cb class=\"key\">집단적 \u003c/b>\u003cb class=\"key\">상실(collective \u003c/b>\u003cb class=\"key\">loss)\u003c/b>까지 넓게 다룬다. 프란 웰러 같은 \u003cb class=\"key\">심리치료사(psychotherapist)\u003c/b>는 애도 작업을 사랑과 연민에서 나온 실천으로 강조한다. 일상에서 상처 난 피부를 소독해야 새살이 차오르는 것처럼, 마음도 충분히 애도해야 회복과 성장이 가능하다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 짚어 볼게요. 심리학에서 grief는 사랑하는 대상이나 중요한 것을 잃은 뒤 나타나는 자연스러운 정서 반응이에요. 여기에는 sadness뿐 아니라 분노와 죄책감 같은 감정이 함께 나타나죠. 많은 사람이 슬픔을 약함이나 나쁜 것으로 여기지만 심리학자들은 loss를 받아들이고 삶을 다시 세우는 과정으로 봅니다. 이 지문은 개인적인 상실 loss에서 집단적인 상실 collective loss까지 폭넓게 다루고 있어요. 상처 난 피부를 소독해야 새살이 차오르는 것처럼 마음도 충분히 애도해야 회복할 수 있다고 생각하면 이해하기 쉬워요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>애도의 중요성과 정의\u003csmall>주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 문장에서 \u003cb class=\"key\">심리학 \u003c/b>\u003cb class=\"key\">이론\u003c/b>들은 개인적 상실부터 집단적 상실까지 \u003cb class=\"key\">애도\u003c/b>의 중요성에 동의한다고 제시한다. 두 번째 문장은 애도를 \u003cb class=\"key\">의식\u003c/b>에 필수적인 \u003cb class=\"key\">역동적 \u003c/b>\u003cb class=\"key\">정서 \u003c/b>\u003cb class=\"key\">과정\u003c/b>으로 정의한다. 즉 애도는 단순한 슬픔이 아니라 의식의 핵심적 움직임이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>애도의 심리적 기능\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>세 번째 문장은 애도가 자신과 타인의 \u003cb class=\"key\">연약함\u003c/b>, \u003cb class=\"key\">덧없음\u003c/b>, \u003cb class=\"key\">죽음\u003c/b>을 직시하고 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">에너지\u003c/b>를 회복하도록 지원한다고 설명한다. 네 번째 문장은 \u003cb class=\"key\">애도 \u003c/b>\u003cb class=\"key\">작업\u003c/b>이 상실과 슬픔, 위축이나 부재를 존중하면서 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">변신\u003c/b>과 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">지속\u003c/b>의 기반을 마련한다고 말한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>애도 작업의 정의\u003csmall>예시 · 문장 5\u003c/small>\u003c/h4>\u003cp>심리치료사 Fran Weller는 애도 작업을 \u003cb class=\"key\">사랑과 \u003c/b>\u003cb class=\"key\">연민\u003c/b>에 뿌리를 둔 \u003cb class=\"key\">헌신적 \u003c/b>\u003cb class=\"key\">행위\u003c/b>라고 정의한다. 여기에는 \u003cb class=\"key\">심화\u003c/b>, \u003cb class=\"key\">주의 \u003c/b>\u003cb class=\"key\">기울이기\u003c/b>, \u003cb class=\"key\">경청\u003c/b>의 지속적 실천이 필요하다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>애도의 결과와 행동 동기\u003csmall>결론 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>잃어버린 것을 애도하면 남아 있는 것에 대한 \u003cb class=\"key\">사랑과 \u003c/b>\u003cb class=\"key\">헌신\u003c/b>이 강화된다. 시간이 지나면 피해를 \u003cb class=\"key\">복구·보상\u003c/b>하여 상실로부터 이로움을 만들려는 \u003cb class=\"key\">욕구\u003c/b>가 생긴다. 마지막 문장은 애도가 매우 슬프게 하면서도 행동하도록 강하게 \u003cb class=\"key\">동기 \u003c/b>\u003cb class=\"key\">부여\u003c/b>한다고 정리한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 전체 흐름을 애도의 정의, 심리적 기능, 전문가의 정의, 결과와 행동 동기 순서로 정리할게요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장은 글의 도입이자 주장입니다. 첫 번째 문장에서 심리학 이론들이 개인적인 상실부터 집단적인 상실까지 애도의 중요성에 동의한다고 말해요. 두 번째 문장은 애도를 의식에 필수적인 역동적 정서 과정으로 정의합니다. 그러니까 애도는 단순히 슬픈 감정이 아니라 의식의 핵심적인 움직임이라는 거죠.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장은 애도의 심리적 기능을 설명해요. 애도는 자신과 타인의 연약함, 덧없음, 죽음을 직시하게 하고 중대한 상실 이후 삶의 에너지를 회복하도록 지원하지요. 애도 작업은 상실과 슬픔, 위축이나 부재의 경험을 존중하면서 동시에 자기 변신과 삶의 지속을 위한 기반을 마련합니다.","hl":"f1"},{"n":6,"text":"다섯 번째 문장에서는 심리치료사 프란 웰러의 말을 인용해 애도 작업을 정의해요. 프란 웰러는 애도 작업이 사랑과 연민에 뿌리 둔 헌신적 행위라고 말했어요. 여기에는 심화, 주의 기울이기, 경청의 지속적 실천이 필요하다고 강조합니다.","hl":"f2"},{"n":7,"text":"여섯 번째부터 여덟 번째 문장은 애도의 결과와 행동 동기를 제시합니다. 잃어버린 것을 애도하면 남아 있는 것에 대한 사랑과 헌신을 강화하는 길이 열려요. 시간이 지나면 가능한 한 많은 피해를 고치고 보상하여 상실로부터 이로움을 만들어 내려는 욕구가 생깁니다. 마지막으로 애도는 우리를 매우 슬프게 하면서도 행동하도록 강하게 동기를 부여한다고 정리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 상실 \u003cb class=\"key\">애도\u003c/b>의 중요성이라는 \u003cb class=\"key\">주장\u003c/b>을 제시하고, 이어서 애도의 정의와 심리적 기능, 전문가 인용, 결과를 \u003cb class=\"key\">근거\u003c/b>로 전개한다. 마지막 문장까지 애도의 긍정적 효과를 밝히므로 \u003cb class=\"key\">두괄식\u003c/b> 구조로 판단할 수 있다. 신호어와 재진술을 따라가면 애도가 회복과 행동으로 이어지는 흐름이 드러난다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>At a psychological level (3)\u003c/b>\u003cspan>구체화\u003c/span>\u003cb>while (4)\u003c/b>\u003cspan>병렬·추가\u003c/span>\u003cb>When we grieve (6)\u003c/b>\u003cspan>조건·결과\u003c/span>\u003cb>In time (7)\u003c/b>\u003cspan>시간 경과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">grieving our losses\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Grief\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Grief work\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an act of devotion\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">When we grieve for what is lost\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Grief\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거 전개 방식으로 볼 수 있고 두괄식 구조예요. 첫 문장에서 애도의 중요성이라는 주장을 제시하고 뒤에서 정의와 기능, 전문가 인용, 결과로 근거를 보강해요. 마지막에는 애도의 이중 효과를 덧붙여 마무리하죠. 중심 문장은 첫 번째 문장입니다.","hl":"ty"},{"n":9,"text":"흐름을 잡아 주는 신호어를 볼게요. 세 번째 문장의 At a psychological level은 심리적 수준으로 설명을 구체화한다는 신호예요. 네 번째 문장의 while은 상실을 존중하는 것과 자기 변신의 기반을 마련하는 것을 병렬로 연결해요. 여섯 번째 문장의 When we grieve는 애도할 때 어떤 결과가 오는지 조건과 결과를 보여 주죠. 일곱 번째 문장의 In time은 시간이 지난 뒤의 변화를 나타냅니다. 그리고 애도를 가리키는 표현이 grieving our losses, grief, grief work, an act of devotion으로 다시 나타나는데 같은 개념을 바꿔 말한 것으로 묶어 읽어야 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>psychological\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>심리학의, 심리적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>theory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이론\u003c/span>\u003c/div>\u003cdiv>\u003cb>grieve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>애도하다, 슬퍼하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>loss\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상실\u003c/span>\u003c/div>\u003cdiv>\u003cb>personal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>개인적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>collective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>집단적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>grief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비탄, 애도\u003c/span>\u003c/div>\u003cdiv>\u003cb>dynamic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>역동적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>emotional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정서적인, 감정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>process\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과정\u003c/span>\u003c/div>\u003cdiv>\u003cb>consciousness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의식\u003c/span>\u003c/div>\u003cdiv>\u003cb>face\u003c/b>\u003cem>동사\u003c/em>\u003cspan>직면하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vulnerability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>취약성, 연약함\u003c/span>\u003c/div>\u003cdiv>\u003cb>transience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>덧없음, 무상함\u003c/span>\u003c/div>\u003cdiv>\u003cb>mortality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>죽음, 사멸성\u003c/span>\u003c/div>\u003cdiv>\u003cb>repair\u003c/b>\u003cem>동사\u003c/em>\u003cspan>회복하다, 고치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grief work\u003c/b>\u003cem>명사\u003c/em>\u003cspan>애도 작업\u003c/span>\u003c/div>\u003cdiv>\u003cb>honor\u003c/b>\u003cem>동사\u003c/em>\u003cspan>존중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-transformation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자기 변신\u003c/span>\u003c/div>\u003cdiv>\u003cb>continuation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지속\u003c/span>\u003c/div>\u003cdiv>\u003cb>psychotherapist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>심리치료사\u003c/span>\u003c/div>\u003cdiv>\u003cb>devotion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>헌신\u003c/span>\u003c/div>\u003cdiv>\u003cb>compassion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연민\u003c/span>\u003c/div>\u003cdiv>\u003cb>ongoing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지속적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>practice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실천, 수행\u003c/span>\u003c/div>\u003cdiv>\u003cb>strengthening\u003c/b>\u003cem>명사\u003c/em>\u003cspan>강화\u003c/span>\u003c/div>\u003cdiv>\u003cb>commitment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>헌신, 약속\u003c/span>\u003c/div>\u003cdiv>\u003cb>desire\u003c/b>\u003cem>명사\u003c/em>\u003cspan>욕구, 바람\u003c/span>\u003c/div>\u003cdiv>\u003cb>damage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>피해, 손해\u003c/span>\u003c/div>\u003cdiv>\u003cb>compensate for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 보상하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘를 정리할게요. grief는 비탄이나 애도라는 뜻이고 loss는 상실이에요. repair는 회복하거나 고친다는 의미이고 devotion은 헌신, compassion은 연민이라는 뜻이에요. psychological은 심리학의, vulnerability는 취약성이나 연약함, transience는 덧없음, mortality는 죽음 또는 사멸성이라는 뜻이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">grief\u003c/b>\u003cspan class=\"m\">비탄, 애도\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sorrow\u003c/span>\u003cspan class=\"s\">mourning\u003c/span>\u003cspan class=\"s\">sadness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">joy\u003c/span>\u003cspan class=\"a\">happiness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">loss\u003c/b>\u003cspan class=\"m\">상실\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deprivation\u003c/span>\u003cspan class=\"s\">bereavement\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gain\u003c/span>\u003cspan class=\"a\">recovery\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">repair\u003c/b>\u003cspan class=\"m\">회복하다, 고치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">restore\u003c/span>\u003cspan class=\"s\">fix\u003c/span>\u003cspan class=\"s\">mend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">damage\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">devotion\u003c/b>\u003cspan class=\"m\">헌신\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dedication\u003c/span>\u003cspan class=\"s\">commitment\u003c/span>\u003cspan class=\"s\">loyalty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indifference\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">vulnerability\u003c/b>\u003cspan class=\"m\">취약성, 연약함\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fragility\u003c/span>\u003cspan class=\"s\">weakness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">invulnerability\u003c/span>\u003cspan class=\"a\">strength\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">transience\u003c/b>\u003cspan class=\"m\">덧없음\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">impermanence\u003c/span>\u003cspan class=\"s\">brevity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">permanence\u003c/span>\u003cspan class=\"a\">eternity\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">compassion\u003c/b>\u003cspan class=\"m\">연민\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">sympathy\u003c/span>\u003cspan class=\"s\">empathy\u003c/span>\u003cspan class=\"s\">mercy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cruelty\u003c/span>\u003cspan class=\"a\">indifference\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 함께 정리해 둡시다. grief는 sorrow, mourning, sadness와 유사하고 joy, happiness와 반대예요. loss는 deprivation, bereavement가 비슷하고 gain, recovery가 반대입니다. repair는 restore, fix, mend가 비슷하고 damage나 destroy가 반대예요. devotion은 dedication, commitment, loyalty와 비슷하고 indifference, neglect와 반대입니다. compassion은 sympathy, empathy, mercy가 비슷하고 cruelty, indifference가 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심리학 분야 전반에서 심리학 이론들은\u003c/span>\u003cspan class=\"en\">Psychological theories across the field\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동의한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">agree \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 상실을 애도하는 것의 중요성에\u003c/span>\u003cspan class=\"en\">the importance of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">grieving \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">losses\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 개인적인 것부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">highly \u003c/span>\u003cspan class=\"tgt\">personal \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명백히 집단적인 것에 이르기까지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">broadly \u003c/span>\u003cspan class=\"tgt\">collective\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심리학 분야 전반에서 심리학 이론들은 매우 개인적인 것부터 명백히 집단적인 것에 이르기까지, 우리의 상실을 애도하는 것의 중요성에 동의한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심리학 분야 전반의 이론들이 \u003cb class=\"key\">상실의 \u003c/b>\u003cb class=\"key\">애도\u003c/b>가 중요하다고 동의한다는 주제문입니다. 애도의 범위를 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">상실에서 \u003c/b>\u003cb class=\"key\">집단적 \u003c/b>\u003cb class=\"key\">상실\u003c/b>까지로 넓혀, 뒤에 나올 구체적 설명의 출발점을 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구 (동사 + 전치사)\u003c/span> : agree on + [the importance ...] : \"~에 동의하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구 (전치사의 목적어)\u003c/span> : of + [grieving our losses (동명사구)] : \"우리의 상실을 애도하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관용 표현 (from A through to B)\u003c/span> : from + [the highly personal] + through to + [the broadly collective] : \"매우 개인적인 것부터 명백히 집단적인 것에 이르기까지\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Psychological theories across the field, 심리학 분야 전반에서 심리학 이론들은. agree on, 동의한다. the importance of grieving our losses, 우리의 상실을 애도하는 것의 중요성에. from the highly personal, 매우 개인적인 것부터. through to the broadly collective, 명백히 집단적인 것에 이르기까지. 이 문장 전체를 해석하면, 심리학 분야 전반에서 심리학 이론들은 매우 개인적인 것부터 명백히 집단적인 것에 이르기까지, 우리의 상실을 애도하는 것의 중요성에 동의한다.","hl":"m"},{"n":13,"text":"이 문장은 글의 첫 번째 문장으로, 심리학 분야 전반의 이론들이 상실의 애도가 중요하다고 동의한다는 주제를 제시합니다. 매우 개인적인 것부터 명백히 집단적인 것까지 애도의 범위가 넓다는 점을 강조하고 있어요.","hl":"mn"},{"n":14,"text":"먼저 agree on은 agree가 전치사 on과 함께 쓰여 동의하는 대상을 연결하는 표현이에요. 두 번째로 the importance of grieving our losses에서 grieving은 전치사 of의 목적어 자리에 쓰인 동명사입니다. 동사 grieve가 동명사가 되면서 our losses를 목적어로 데리고 와서 상실을 애도하는 것이라는 명사적 의미를 만들어요. 마지막으로 from the highly personal through to the broadly collective는 from A through to B, 즉 A에서 B까지라는 범위를 나타내는 관용 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">애도는\u003c/span>\u003cspan class=\"en\">Grief\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역동적인 정서적 과정\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">dynamic \u003c/span>\u003cspan class=\"tgt\">emotional \u003c/span>\u003cspan class=\"tgt\">process\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의식에 필수적인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">essential \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">consciousness\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">애도는 의식에 필수적인 역동적인 정서적 과정이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 애도가 단순한 슬픔이 아니라 \u003cb class=\"key\">역동적인 \u003c/b>\u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">과정\u003c/b>이며, \u003cb class=\"key\">의식\u003c/b>에 필수적이라는 정의를 내리는 핵심 문장입니다. 즉 애도는 멈춰 있는 감정이 아니라 우리가 자신과 세계를 인식하는 데 필요한 살아 있는 마음의 작용이라는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사구의 형용사 수식\u003c/span> : a + [dynamic emotional] + process : \"역동적인 정서적 과정\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사구의 후치수식\u003c/span> : a dynamic emotional process + [essential to consciousness (형용사구)] : \"의식에 필수적인\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Grief, 애도는. is, ~이다. a dynamic emotional process, 역동적인 정서적 과정. essential to consciousness, 의식에 필수적인. 이 문장 전체를 해석하면, 애도는 의식에 필수적인 역동적인 정서적 과정이다.","hl":"m"},{"n":16,"text":"이 문장은 애도가 단순한 슬픔이 아니라 역동적인 정서적 과정이며, 의식에 필수적이라고 정의합니다. 애도는 멈춰 있는 감정이 아니라 살아 있는 마음의 작용이라는 뜻이에요.","hl":"mn"},{"n":17,"text":"이 문장의 핵심은 a dynamic emotional process 뒤에 essential to consciousness가 온 구조예요. 형용사구 essential to consciousness가 바로 앞의 명사 process를 뒤에서 수식합니다. 원래는 a dynamic emotional process which is essential to consciousness에서 which is가 생략된 형태로 보면 됩니다. 그래서 해석은 의식에 필수적인 역동적인 정서적 과정이 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심리적 수준에서,\u003c/span>\u003cspan class=\"en\">At a psychological level,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 우리를 지원한다\u003c/span>\u003cspan class=\"en\">it supports \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둘 다 직시하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">face \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 자신과 타인의 연약함, 덧없음, 그리고 죽음을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">others' \u003c/span>\u003cspan class=\"tgt\">vulnerability, \u003c/span>\u003cspan class=\"tgt\">transience \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">mortality, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 삶의 에너지를 회복하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">repair \u003c/span>\u003cspan class=\"tgt\">life \u003c/span>\u003cspan class=\"tgt\">energy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중대한 상실 이후에\u003c/span>\u003cspan class=\"en\">after significant loss.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심리적 수준에서, 그것은 우리 자신과 타인의 연약함, 덧없음, 그리고 죽음을 직시하는 것도, 중대한 상실 이후의 삶의 에너지를 회복하는 것도 지원한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심리적 수준에서 애도가 두 가지를 지원한다고 설명합니다. \u003cb class=\"key\">연약함, \u003c/b>\u003cb class=\"key\">덧없음, \u003c/b>\u003cb class=\"key\">죽음\u003c/b>을 직시하는 것과 \u003cb class=\"key\">중대한 \u003c/b>\u003cb class=\"key\">상실 \u003c/b>\u003cb class=\"key\">이후\u003c/b> 삶의 에너지를 회복하는 것입니다. 애도는 고통을 회피하지 않고 삶을 다시 살아가게 하는 기능을 한다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 목적격 보어\u003c/span> : support + [us] + [to both face into ... (to부정사구)] : \"우리가 ... 직시하도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 both A and B\u003c/span> : both + [face into our own ... mortality] + and + [to repair life energy] : \"둘 다 ... 직시하고 ... 회복하는 것\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"At a psychological level, 심리적 수준에서. it supports us, 그것은 우리를 지원한다. to both face into, 둘 다 직시하도록. our own and others' vulnerability, transience and mortality, 우리 자신과 타인의 연약함, 덧없음, 그리고 죽음을. and to repair life energy, 그리고 삶의 에너지를 회복하도록. after significant loss, 중대한 상실 이후에. 이 문장 전체를 해석하면, 심리적 수준에서, 그것은 우리 자신과 타인의 연약함, 덧없음, 그리고 죽음을 직시하는 것도, 중대한 상실 이후의 삶의 에너지를 회복하는 것도 지원한다.","hl":"m"},{"n":19,"text":"이 문장은 심리적 수준에서 애도가 두 가지를 지원한다고 말해요. 우리 자신과 타인의 연약함, 덧없음, 죽음을 직시하는 것과 중대한 상실 이후 삶의 에너지를 회복하는 것입니다. 그래서 애도는 고통을 외면하지 않으면서 다시 살아갈 힘을 주는 역할을 합니다.","hl":"mn"},{"n":20,"text":"이 문장은 support us to do 구문이에요. support는 목적어 us 뒤에 to부정사를 써서 우리가 어떤 행동을 하도록 지원한다는 의미를 만듭니다. 또 both A and B 구조가 나오는데, to both face into our own and others' vulnerability, transience and mortality, and to repair life energy after significant loss에서 both와 and를 통해 직시하는 것과 회복하는 것을 병렬하고 있어요. 다만 첫 번째에는 to가 both 앞에 있고 두 번째에는 to repair로 반복해서, 형태가 완전히 같지는 않지만 두 가지를 모두 지원한다는 뜻을 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">애도 작업은 상실, 슬픔, 그리고 위축이나 부재의 경험을 존중하고,\u003c/span>\u003cspan class=\"en\">Grief work honours \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">loss, \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">sadness \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">experience \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">diminishment \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">absence\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한편으로는 자기 변신과 삶의 지속을 위한 기반을 마련하기도 한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">setting \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">ground\u003c/span> for self-transformation and the continuation of life.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">애도 작업(Grief work)은 상실, 슬픔, 그리고 위축이나 부재의 경험을 존중하고, 한편으로는 자기 변신과 삶의 지속을 위한 기반을 마련하기도 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 애도 작업이 가진 두 측면을 정리한다. 상실과 슬픔을 존중하는 동시에 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">변신\u003c/b>과 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">지속\u003c/b>을 위한 기반을 마련한다는 점에서 애도의 수동적 애도와 능동적 회복 기능을 함께 보여 준다. while also setting up은 두 기능이 동시에 일어남을 나타낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">A, B and C 병렬 구조\u003c/span> : [the loss], [the sadness] and [the experience of diminishment or absence] : \"상실, 슬픔, 그리고 위축이나 부재의 경험\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">while + 현재분사 (분사구문)\u003c/span> : while [setting up the ground] (접속사+현재분사구) : \"한편으로는 기반을 마련하면서\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Grief work honours the loss, the sadness and the experience of diminishment or absence, 애도 작업은 상실, 슬픔, 그리고 위축이나 부재의 경험을 존중하고. while also setting up the ground for self-transformation and the continuation of life, 한편으로는 자기 변신과 삶의 지속을 위한 기반을 마련하기도 한다.. 이 문장 전체를 해석하면, 애도 작업(Grief work)은 상실, 슬픔, 그리고 위축이나 부재의 경험을 존중하고, 한편으로는 자기 변신과 삶의 지속을 위한 기반을 마련하기도 한다.","hl":"m"},{"n":22,"text":"이 문장은 애도 작업이 상실과 슬픔을 존중하는 데 그치지 않고 자기 변신과 삶의 지속을 위한 기반까지 마련한다고 말합니다. 상실을 애도하는 수동적 측면과 삶을 회복하는 능동적 측면이 동시에 일어난다는 게 핵심이에요.","hl":"mn"},{"n":23,"text":"첫 번째 어법은 the loss, the sadness and the experience of diminishment or absence입니다. 명사구 세 개가 and로 연결된 병렬 구조로, 애도 작업이 존중하는 세 가지 대상을 나란히 나열해요. 두 번째 어법은 while also setting up the ground입니다. while 다음에 주어와 be동사가 생략된 분사구문으로, 주절과 동시에 일어나는 동작을 나타냅니다. 주절의 주어와 같기 때문에 생략할 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심리치료사 Fran Weller는 묘사한다\u003c/span>\u003cspan class=\"en\">Psychotherapist Fran Weller describes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">애도 작업이 ‘사랑과 연민에 뿌리를 둔 헌신적인 행위’라고\u003c/span>\u003cspan class=\"en\">grief work is &quot;an act of devotion, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">rooted \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">love \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">compassion\u003c/span>&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ‘심화, 주의 기울이기와 경청의 지속적인 실천’을 요구한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">requires\u003c/span> &quot;an ongoing practice of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">deepening, \u003c/span>\u003cspan class=\"tgt\">attending \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">listening\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심리치료사 Fran Weller는 애도 작업을 ‘심화, 주의 기울이기와 경청의 지속적인 실천’을 요구하는 ‘사랑과 연민에 뿌리를 둔 헌신적인 행위’라고 묘사한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 프란 웰러의 정의를 인용하여 애도 작업이 단순한 감정 처리가 아니라 \u003cb class=\"key\">사랑과 \u003c/b>\u003cb class=\"key\">연민\u003c/b>에 뿌리를 둔 \u003cb class=\"key\">헌신적인 \u003c/b>\u003cb class=\"key\">행위\u003c/b>임을 강조한다. 여기에 \u003cb class=\"key\">지속적인 \u003c/b>\u003cb class=\"key\">실천\u003c/b>으로서의 심화, 주의 기울이기, 경청이 필요하다는 점을 더해 애도 작업의 적극적이고 관계적인 성격을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사(구)의 형용사적 용법\u003c/span> : [an act of devotion], rooted in love and compassion (명사 + 과거분사구) : \"사랑과 연민에 뿌리를 둔\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [an act of devotion] that requires ... (선행사 + 관계대명사절) : \"그것은 ~을 요구한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">A, B and C 병렬 구조\u003c/span> : [deepening], [attending] and [listening] : \"심화, 주의 기울이기와 경청\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Psychotherapist Fran Weller describes, 심리치료사 Fran Weller는 묘사한다. grief work is \"an act of devotion, rooted in love and compassion\", 애도 작업이 ‘사랑과 연민에 뿌리를 둔 헌신적인 행위’라고. that requires \"an ongoing practice of deepening, attending and listening.\", 그것은 ‘심화, 주의 기울이기와 경청의 지속적인 실천’을 요구한다. 이 문장 전체를 해석하면, 심리치료사 Fran Weller는 애도 작업을 ‘심화, 주의 기울이기와 경청의 지속적인 실천’을 요구하는 ‘사랑과 연민에 뿌리를 둔 헌신적인 행위’라고 묘사한다.","hl":"m"},{"n":25,"text":"프란 웰러는 애도 작업을 사랑과 연민에 뿌리를 둔 헌신적인 행위라고 정의합니다. 여기에 그 행위가 단 한 번이 아니라 심화, 주의 기울이기, 경청을 지속적으로 실천해야 한다는 점을 덧붙여요. 그러니까 애도는 감정 표현을 넘어서 꾸준히 훈련해야 하는 태도라는 겁니다.","hl":"mn"},{"n":26,"text":"첫 번째 어법은 rooted in love and compassion입니다. rooted는 root의 과거분사로, 앞에 있는 an act of devotion을 뒤에서 수동의 의미로 수식해요. 두 번째 어법은 that requires입니다. that은 앞의 an act of devotion을 선행사로 받는 주격 관계대명사예요. 세 번째 어법은 deepening, attending and listening입니다. 동명사 세 개가 and로 연결된 병렬 구조로, 지속적인 실천의 내용을 나란히 나열합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 잃어버린 것에 대해 애도할 때,\u003c/span>\u003cspan class=\"en\">When we grieve for \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">lost\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 남아 있는 것에 대한 사랑과 헌신의 강화를 향한 길을 열어 준다.\u003c/span>\u003cspan class=\"en\">it clears the way towards a strengthening of love and commitment for \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">remains\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 잃어버린 것에 대해 애도할 때, 그것은 남아 있는 것에 대한 사랑과 헌신을 강화하는 길을 열어 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 애도의 결과가 단지 슬픔에 머무는 것이 아니라 남아 있는 대상에 대한 \u003cb class=\"key\">사랑과 \u003c/b>\u003cb class=\"key\">헌신\u003c/b>을 강화한다는 핵심 논점을 제시한다. 잃어버린 것에 대한 애도가 오히려 \u003cb class=\"key\">남아 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">것\u003c/b>에 대한 가치를 깨닫게 하고 관계를 더 단단하게 만든다는 역설적 전환을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what (선행사 포함)\u003c/span> : [what is lost] (what + 불완전한 절) : \"잃어버린 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what (선행사 포함)\u003c/span> : [what remains] (what + 불완전한 절) : \"남아 있는 것\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"When we grieve for what is lost, 우리가 잃어버린 것에 대해 애도할 때. it clears the way towards a strengthening of love and commitment for what remains, 그것은 남아 있는 것에 대한 사랑과 헌신의 강화를 향한 길을 열어 준다.. 이 문장 전체를 해석하면, 우리가 잃어버린 것에 대해 애도할 때, 그것은 남아 있는 것에 대한 사랑과 헌신을 강화하는 길을 열어 준다.","hl":"m"},{"n":28,"text":"이 문장은 애도가 남아 있는 것에 대한 사랑과 헌신을 강화하는 길을 열어 준다고 말합니다. 잃어버린 것에 집중하는 것 같지만 실제로는 남아 있는 것의 소중함을 깨닫게 해준다는 역설적인 전환이 핵심이에요. 그래서 애도는 관계를 더 단단하게 만드는 동력이 됩니다.","hl":"mn"},{"n":29,"text":"첫 번째 어법은 what is lost입니다. what은 선행사를 포함한 관계대명사라서 뒤에 불완전한 절이 오고 잃어버린 것이라는 명사구를 만들어요. 두 번째 어법은 what remains입니다. 같은 관계대명사 what으로, 남아 있는 것이라는 뜻이에요. 둘 다 전치사 for의 목적어로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간이 지나면\u003c/span>\u003cspan class=\"en\">In time\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 욕구를 형성할 수도 있다\u003c/span>\u003cspan class=\"en\">this may build a desire\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 상실로부터 이로움을 만들어내려는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">loss\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 할 수 있는 한 많은 피해들을 고침으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">repairing \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">damages \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고/또는 그것들을 보상함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and/or \u003c/span>\u003cspan class=\"tgt\">compensating \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시간이 지나면 이것은 우리가 할 수 있는 한 많은 피해들을 고치고/고치거나 그것들을 보상함으로써 상실로부터 이로움을 만들어내려는 욕구를 형성할 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 애도가 남은 것에 대한 사랑과 헌신을 강화한다고 했는데, 이 문장은 시간이 지나면 그 애도가 복구와 보상을 통해 상실을 좋은 것으로 바꾸려는 욕구로 발전할 수 있다는 뜻입니다. \u003cb class=\"key\">make \u003c/b>\u003cb class=\"key\">good \u003c/b>\u003cb class=\"key\">from \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">loss\u003c/b>는 상실로부터 이로움을 만들어낸다는 표현이고, \u003cb class=\"key\">by \u003c/b>\u003cb class=\"key\">repairing \u003c/b>\u003cb class=\"key\">and/or \u003c/b>\u003cb class=\"key\">compensating\u003c/b>은 그 욕구를 실현하는 구체적인 행동 방식을 보여 줍니다. 즉 슬픔이 수동적 감정에 그치지 않고 적극적인 복구와 보상의 동력이 된다는 흐름을 이어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법(명사 수식)\u003c/span> : a desire + to make good from the loss : \"상실로부터 이로움을 만들어내려는 욕구\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">by + 동명사 병렬\u003c/span> : by + repairing as many damages as we can and/or compensating for them : \"피해를 고치고/고치거나 그것들을 보상함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">as + many + 복수명사 + as + 주어 + can\u003c/span> : as many damages as we can : \"우리가 할 수 있는 한 많은 피해들\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In time, 시간이 지나면. this may build a desire, 이것은 욕구를 형성할 수도 있다. to make good from the loss, 그 상실로부터 이로움을 만들어내려는. by repairing as many damages as we can, 우리가 할 수 있는 한 많은 피해들을 고침으로써. and/or compensating for them, 그리고/또는 그것들을 보상함으로써. 이 문장 전체를 해석하면, 시간이 지나면 이것은 우리가 할 수 있는 한 많은 피해들을 고치고/고치거나 그것들을 보상함으로써 상실로부터 이로움을 만들어내려는 욕구를 형성할 수도 있다.","hl":"m"},{"n":31,"text":"이 문장은 앞 문장에서 말한 애도의 힘이 시간이 지나면서 행동으로 나타날 수 있다고 설명해요. 상실을 그냥 슬퍼만 하는 게 아니라 그 상실을 계기로 make good from the loss, 즉 상실로부터 이로움을 만들어내려는 욕구가 생긴다는 거죠. 그 방법이 바로 by repairing as many damages as we can and or compensating for them, 즉 피해를 고치고 보상하는 구체적인 행동입니다. 핵심은 슬픔이 복구와 보상의 동력이 될 수 있다는 거예요.","hl":"mn"},{"n":32,"text":"문법 포인트를 짚어 볼게요. 첫 번째, to make good from the loss는 to부정사의 형용사적 용법으로 앞의 명사 desire를 수식해요. 어떤 욕구인지 설명해 주는 거죠. 두 번째, by repairing as many damages as we can and or compensating for them은 전치사 by 다음에 동명사 repairing과 compensating이 and or로 병렬 연결된 구조입니다. 손실을 어떻게 복구하고 보상할지를 나타내는 방법의 부사구예요. 세 번째, as many damages as we can은 as many 복수명사 as 주어 can 형태로 가능한 한 많은이라는 관용 표현이에요. 여기서 as we can 뒤에는 repair가 생략되어 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">애도는 우리를 만들 수 있다\u003c/span>\u003cspan class=\"en\">Grief can \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 슬프게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">sad \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 행동하도록 매우 동기 부여된 상태로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">motivated \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">act\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">애도는 우리를 매우 슬프게 만드는 동시에 행동하도록 강하게 동기를 부여할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 애도의 이중적 성격을 요약합니다. \u003cb class=\"key\">very \u003c/b>\u003cb class=\"key\">sad\u003c/b>와 \u003cb class=\"key\">very \u003c/b>\u003cb class=\"key\">motivated \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">act\u003c/b>가 both A and B로 묶여 슬픔과 행동 동기가 동시에 일어난다는 점을 강조합니다. 앞서 설명한 애도의 정서적 과정과 행동적 전환을 한 문장으로 정리하며 글의 논지를 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 목적격 보어 (5형식)\u003c/span> : make + us + both very sad and very motivated to act : \"우리를 매우 슬프게도 행동하도록 매우 동기 부여된 상태로도 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 both A and B\u003c/span> : both + very sad + and + very motivated to act : \"매우 슬픈 것과 행동하도록 매우 동기 부여된 것 둘 다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Grief can make us, 애도는 우리를 만들 수 있다. both very sad, 매우 슬프게. and very motivated to act, 그리고 행동하도록 매우 동기 부여된 상태로. 이 문장 전체를 해석하면, 애도는 우리를 매우 슬프게 만드는 동시에 행동하도록 강하게 동기를 부여할 수 있다.","hl":"m"},{"n":34,"text":"이 문장은 애도의 중요한 이중성을 요약합니다. very sad, 매우 슬픈 감정과 very motivated to act, 행동하도록 강하게 동기 부여된 상태를 both A and B로 나란히 연결했어요. 애도는 그저 우울하게 가라앉는 과정이 아니라 슬픔과 동시에 행동의 동력을 함께 준다는 게 글의 핵심이에요.","hl":"mn"},{"n":35,"text":"첫 번째, make us both very sad and very motivated to act는 사역동사 make가 목적어 us와 목적격 보어를 취하는 오형식 구조예요. make us very sad는 우리를 매우 슬프게 만들다, make us very motivated to act는 우리를 행동하도록 매우 동기 부여된 상태로 만들다로 해석되죠. 두 번째, both very sad and very motivated to act는 상관접속사 both A and B입니다. A 자리에는 very sad, B 자리에는 very motivated to act가 와서 슬픔과 행동 동기를 대등하게 묶어 줘요. both A and B는 A와 B 둘 다라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">심리학 \u003c/b>\u003cb class=\"key\">이론\u003c/b>들은 개인적 상실부터 \u003cb class=\"key\">집단적 \u003c/b>\u003cb class=\"key\">상실\u003c/b>까지 \u003cb class=\"key\">애도\u003c/b>의 중요성에 동의한다.\u003c/li>\u003cli>\u003cb class=\"key\">애도\u003c/b>는 \u003cb class=\"key\">의식\u003c/b>에 필수적인 \u003cb class=\"key\">역동적 \u003c/b>\u003cb class=\"key\">정서 \u003c/b>\u003cb class=\"key\">과정\u003c/b>으로, 상실을 직시하고 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">에너지\u003c/b>를 회복하게 한다.\u003c/li>\u003cli>\u003cb class=\"key\">애도 \u003c/b>\u003cb class=\"key\">작업\u003c/b>은 상실과 슬픔을 존중하면서 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">변신\u003c/b>과 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">지속\u003c/b>을 준비한다.\u003c/li>\u003cli>애도는 남은 것에 대한 \u003cb class=\"key\">사랑과 \u003c/b>\u003cb class=\"key\">헌신\u003c/b>을 강화하고, 피해를 \u003cb class=\"key\">복구·보상\u003c/b>하려는 욕구와 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">동기\u003c/b>를 만든다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Grieving is an essential dynamic emotional process that strengthens love and commitment for what remains and motivates action to repair and compensate after loss.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 글은 \u003cb class=\"key\">애도\u003c/b>가 의식에 필수적인 \u003cb class=\"key\">역동적 \u003c/b>\u003cb class=\"key\">정서 \u003c/b>\u003cb class=\"key\">과정\u003c/b>으로, 상실과 슬픔을 존중하며 \u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">에너지\u003c/b>를 회복하고 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">변신\u003c/b>을 준비하게 한다고 설명한다. 애도는 남아 있는 것에 대한 \u003cb class=\"key\">사랑과 \u003c/b>\u003cb class=\"key\">헌신\u003c/b>을 강화하고 피해를 \u003cb class=\"key\">복구·보상\u003c/b>하려는 \u003cb class=\"key\">욕구\u003c/b>와 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">동기\u003c/b>를 불러일으킨다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 정리할게요. 이 지문은 애도가 단순한 슬픔이 아니라 의식에 필수적인 과정이며 상실을 직시하고 삶의 에너지를 회복하게 한다는 내용이에요. 애도 작업은 사랑과 연민에 뿌리 둔 헌신적 실천이고 남은 것에 대한 사랑과 헌신을 강화합니다. 결국 애도는 슬픔과 행동 동기를 동시에 만들어 낸다는 점을 기억하세요. 오늘 수업은 여기까지입니다.","hl":null}]}]});</script></body></html>
