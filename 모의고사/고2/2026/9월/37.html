}
lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 37번","audioDir":"37_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">37번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Language as a Manifestation of Culture\u003c/h1>\u003ch2>문화의 발현으로서의 언어\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>언어는 \u003cb class=\"key\">문화의 \u003c/b>\u003cb class=\"key\">발현\u003c/b>으로, 아이들은 언어 자체가 아니라 \u003cb class=\"key\">상황적 \u003c/b>\u003cb class=\"key\">맥락\u003c/b>에서 소통하게 하는 \u003cb class=\"key\">상호작용 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>을 배우며, 개인주의 문화는 \u003cb class=\"key\">직접적·명시적\u003c/b> 의사소통을, 집단주의 문화는 \u003cb class=\"key\">간접적·암시적\u003c/b> 의사소통을 발달시킨다. 영어의 I 대문자 표기와 일본어의 다양한 자칭 표현은 이러한 \u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">특유의 \u003c/b>\u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">양식\u003c/b>을 보여 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Language reflects culture, and children acquire culture-specific communication styles—direct and explicit in individualistic cultures, indirect and implicit in collectivistic cultures—as shown by the English capital I and Japanese self-reference words.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 언어와 문화의 관계를 다룬 글이에요. 언어는 문화의 발현이라는 핵심 문장을 시작으로, 개인주의 문화와 집단주의 문화의 의사소통 방식이 어떻게 다른지 살펴볼 거예요. 영어의 I 대문자 표기와 일본어의 자칭 표현이라는 흥미로운 예도 함께 봅니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 쓰는 언어에는 그 사회의 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>가 녹아 있어요. 영어권처럼 individualism 개인주의 문화에서는 자기 생각을 분명히 드러내는 direct communication이 미덕이고, 동아시아처럼 collectivism 집단주의 문화에서는 관계의 harmony를 지키려고 indirect communication을 선호하죠. 언어 습득은 단순한 문법 학습이 아니라 culture-specific communication style을 익히는 과정이라고 볼 수 있어요. 일상에서 친구에게는 직설적으로 말하지만 선생님 앞에서는 완곡하게 말하는 것과 비슷해요. 특히 영어에서 I를 항상 capital letter로 쓰는 것은 self를 중시하는 영어권 문화의 뿌리를 보여 주는 단서가 될 수 있어요.\u003c/div>","segs":[{"n":2,"text":"여러분, 우리가 매일 쓰는 말에는 문화적 가치가 녹아 있어요. 영어권처럼 individualism 즉 개인주의가 강한 문화에서는 자기 생각을 분명히 드러내는 direct communication이 중요하고, 동아시아처럼 collectivism 즉 집단주의 문화에서는 관계의 harmony를 지키기 위해 indirect communication을 선호하죠. 언어 습득도 단순히 문법을 외우는 것이 아니라 culture-specific communication style을 익히는 과정이라고 볼 수 있어요. 예를 들어 친구에게는 직설적으로 말해도 선생님 앞에서는 완곡하게 말하는 것과 비슷해요. 특히 영어에서 I를 항상 capital letter로 쓰는 것은 자아를 중시하는 영어권 문화의 뿌리를 보여 주는 단서가 될 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>언어는 문화의 발현\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>언어는 \u003cb class=\"key\">문화의 \u003c/b>\u003cb class=\"key\">발현\u003c/b>이다. 아이들은 언어 습득 단계에서 언어 자체 per se보다 \u003cb class=\"key\">상호작용 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>과 \u003cb class=\"key\">양식\u003c/b>을 배운다. 이를 통해 다양한 \u003cb class=\"key\">상황적 \u003c/b>\u003cb class=\"key\">맥락\u003c/b>에서 유능한 소통가로 기능하게 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문화 특유의 소통 양식\u003csmall>주장 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>아이들은 \u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">특유의 \u003c/b>\u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">양식\u003c/b>을 발달시킨다. 개인주의 문화에서는 \u003cb class=\"key\">직접적이고 \u003c/b>\u003cb class=\"key\">명시적\u003c/b>인 스타일이, 집단주의 문화에서는 \u003cb class=\"key\">간접적이고 \u003c/b>\u003cb class=\"key\">암시적\u003c/b>인 스타일이 나타난다. 직접적 스타일은 absolutely, certainly, positively 같은 \u003cb class=\"key\">단정적인 \u003c/b>\u003cb class=\"key\">단어\u003c/b>와 연결되고, 집단주의는 maybe, perhaps, probably 같은 \u003cb class=\"key\">모호한 \u003c/b>\u003cb class=\"key\">표현\u003c/b>을 사용한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>영어의 I 대문자\u003csmall>예시 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>영어는 세계에서 유일하게 I를 \u003cb class=\"key\">대문자\u003c/b>로 쓴다. 이 현상은 \u003cb class=\"key\">개인주의의 \u003c/b>\u003cb class=\"key\">뿌리\u003c/b>가 잉글랜드에 있다는 사실을 반영할 수 있다. 즉 영어의 대문자 I는 \u003cb class=\"key\">자아\u003c/b>를 중시하는 문화적 특성을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>일본어의 자칭 표현\u003csmall>반례/대조 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>반면 일본어에는 영어 I에 \u003cb class=\"key\">상응하는 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이 없다. 대신 사회적 상황, 화자의 성별, 나이, 청자와의 관계 등에 따라 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">단어\u003c/b>로 자신을 지칭한다. 이는 집단주의 문화에서 \u003cb class=\"key\">자아\u003c/b>보다 \u003cb class=\"key\">관계\u003c/b>가 중요함을 보여 준다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 짚어 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 언어가 문화의 발현이라는 도입을 제시해요. 아이들은 언어 습득 단계에서 언어 그 자체보다는 언어적 상호작용의 다양한 패턴과 양식을 배운다고 해요. 이를 통해 다양한 상황적 맥락에서 유능한 소통가로 기능하게 된다는 거죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 문화 특유의 의사소통 양식을 발달시킨다는 주장이 나와요. 개인주의 문화에서는 직접적이고 명시적인 스타일이 나타나고, 집단주의 문화에서는 간접적이고 암시적인 스타일이 나타난다고 해요. 직접적 스타일은 absolutely, certainly, positively 같은 단정적인 단어와 연결되고, 집단주의 스타일은 maybe, perhaps, probably 같은 모호한 표현을 사용한다는 거죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 영어의 I 대문자 표기를 예로 들어요. 영어는 세계에서 유일하게 I를 대문자로 쓰는데, 이 현상은 개인주의의 뿌리가 잉글랜드에 있다는 사실을 반영할 수 있다고 해요. 대문자 I는 자아를 중시하는 문화적 특성을 보여 주는 셈이죠.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 일본어의 자칭 표현을 대조적으로 제시해요. 일본어에는 영어 I에 상응하는 표현이 없고, 사회적 상황이나 화자의 성별, 나이, 청자와의 관계에 따라 다른 단어로 자신을 지칭한다고 해요. 이는 집단주의 문화에서 자아보다 관계가 중요함을 보여 주는 사례예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 언어는 \u003cb class=\"key\">문화의 \u003c/b>\u003cb class=\"key\">발현\u003c/b>이라는 핵심 주장을 제시하고, 이후 문장에서 \u003cb class=\"key\">개인주의\u003c/b>와 \u003cb class=\"key\">집단주의\u003c/b> 문화의 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">양식\u003c/b>을 대조하며 근거를 제시한다. 영어의 I 대문자와 일본어의 다양한 자칭 표현이라는 구체적인 \u003cb class=\"key\">사례\u003c/b>를 통해 문화적 차이를 비교·대조한다. 따라서 전체 구조는 \u003cb class=\"key\">두괄식\u003c/b>이며, 세부 전개는 \u003cb class=\"key\">비교·대조\u003c/b> 방식이다. 신호어인 By contrast가 단락 중간에서 대조를 분명히 드러낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>for example (3)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>By contrast (5)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>This phenomenon (7)\u003c/b>\u003cspan>재진술·지시\u003c/span>\u003cb>no Japanese equivalent (8)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>Different words (9)\u003c/b>\u003cspan>상술·대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">direct and explicit in individualistic cultures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">categorical words like absolutely, certainly, or positively\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">indirect and implicit in collectivistic cultures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">implicit and even ambiguous use of words, using terms like maybe, perhaps, or probably\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the English language spells I with a capital letter\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">There is no Japanese equivalent for the English I\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Different words are used to refer to the self\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>개인주의 문화(individualistic cultures)\u003c/th>\u003cth>집단주의 문화(collectivistic cultures)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>직접적·명시적 스타일(direct and explicit)\u003c/td>\u003ctd>간접적·암시적 스타일(indirect and implicit)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>absolutely, certainly, positively 같은 단정적 단어\u003c/td>\u003ctd>maybe, perhaps, probably 같은 모호한 표현\u003c/td>\u003c/tr>\u003ctr>\u003ctd>영어에서 I를 대문자로 표기\u003c/td>\u003ctd>일본어에 I의 상응 표현 없음, 상황에 따라 다양한 자칭 표현\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 첫 문장에서 언어는 문화의 발현이라는 주제문을 제시하는 두괄식 구조예요. 본문에서는 개인주의와 집단주의의 의사소통 양식을 표로 정리하듯 비교 대조하면서 구체적인 근거를 들고 있어요. 영어의 I 대문자와 일본어의 다양한 자칭 표현이 대표적인 사례죠. 따라서 전체 전개 방식은 비교 대조, 구조는 두괄식으로 보는 것이 가장 자연스러워요.","hl":"ty"},{"n":9,"text":"이 글에는 대조를 알리는 신호어가 중요해요. 세 번째 문장의 for example은 문화 특유의 의사소통 양식의 예시를 끌어오고, 다섯 번째 문장의 By contrast는 개인주의와 집단주의를 명시적으로 대조해요. 일곱 번째 문장의 This phenomenon은 앞서 나온 영어의 I 대문자 현상을 다시 가리키면서 설명을 이어 가요. 여덟 번째와 아홉 번째 문장에서는 no Japanese equivalent와 Different words 같은 표현으로 일본어의 자칭 방식을 대조적으로 상술하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>manifestation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발현, 표현\u003c/span>\u003c/div>\u003cdiv>\u003cb>acquisition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>습득\u003c/span>\u003c/div>\u003cdiv>\u003cb>per se\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그 자체로\u003c/span>\u003c/div>\u003cdiv>\u003cb>rather\u003c/b>\u003cem>부사\u003c/em>\u003cspan>오히려, 그보다는\u003c/span>\u003c/div>\u003cdiv>\u003cb>pattern\u003c/b>\u003cem>명사\u003c/em>\u003cspan>패턴, 양식\u003c/span>\u003c/div>\u003cdiv>\u003cb>interaction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상호작용\u003c/span>\u003c/div>\u003cdiv>\u003cb>enable\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가능하게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>competent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>communicator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소통가, 의사소통자\u003c/span>\u003c/div>\u003cdiv>\u003cb>situational context\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>상황적 맥락\u003c/span>\u003c/div>\u003cdiv>\u003cb>develop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발달시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>culture-specific\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>문화 특유의\u003c/span>\u003c/div>\u003cdiv>\u003cb>direct\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>직접적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>explicit\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>명시적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>individualistic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>개인주의적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>indirect\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>간접적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>implicit\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>암시적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>collectivistic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>집단주의적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>categorical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>단정적인, 절대적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>by contrast\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>대조적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>assumption\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전제, 가정\u003c/span>\u003c/div>\u003cdiv>\u003cb>interdependence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상호 의존\u003c/span>\u003c/div>\u003cdiv>\u003cb>harmony\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화합, 조화\u003c/span>\u003c/div>\u003cdiv>\u003cb>ambiguous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>모호한\u003c/span>\u003c/div>\u003cdiv>\u003cb>capital letter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대문자\u003c/span>\u003c/div>\u003cdiv>\u003cb>phenomenon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현상\u003c/span>\u003c/div>\u003cdiv>\u003cb>reflect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반영하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>equivalent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상응하는 표현, 동등한 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>refer to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 지칭하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attribute\u003c/b>\u003cem>명사\u003c/em>\u003cspan>속성\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개 정리할게요. manifestation은 발현이나 표현이라는 뜻이고, acquisition은 습득, per se는 그 자체로라는 뜻이에요. direct와 explicit은 직접적이고 명시적인, indirect와 implicit은 간접적이고 암시적인이라는 뜻으로 짝을 이뤄요. categorical은 단정적인, ambiguous는 모호한, equivalent는 상응하는 표현이라는 뜻이니 문맥 속에서 함께 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">explicit\u003c/b>\u003cspan class=\"m\">명시적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clear\u003c/span>\u003cspan class=\"s\">definite\u003c/span>\u003cspan class=\"s\">unambiguous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">implicit\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003cspan class=\"a\">ambiguous\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">implicit\u003c/b>\u003cspan class=\"m\">암시적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">implied\u003c/span>\u003cspan class=\"s\">suggested\u003c/span>\u003cspan class=\"s\">unspoken\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">explicit\u003c/span>\u003cspan class=\"a\">clear\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">individualistic\u003c/b>\u003cspan class=\"m\">개인주의적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">independent\u003c/span>\u003cspan class=\"s\">self-reliant\u003c/span>\u003cspan class=\"s\">egocentric\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">collectivistic\u003c/span>\u003cspan class=\"a\">communal\u003c/span>\u003cspan class=\"a\">interdependent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">collectivistic\u003c/b>\u003cspan class=\"m\">집단주의적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">communal\u003c/span>\u003cspan class=\"s\">group-oriented\u003c/span>\u003cspan class=\"s\">interdependent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">individualistic\u003c/span>\u003cspan class=\"a\">independent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">categorical\u003c/b>\u003cspan class=\"m\">단정적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">absolute\u003c/span>\u003cspan class=\"s\">unconditional\u003c/span>\u003cspan class=\"s\">definite\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ambiguous\u003c/span>\u003cspan class=\"a\">tentative\u003c/span>\u003cspan class=\"a\">qualified\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ambiguous\u003c/b>\u003cspan class=\"m\">모호한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">vague\u003c/span>\u003cspan class=\"s\">unclear\u003c/span>\u003cspan class=\"s\">equivocal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clear\u003c/span>\u003cspan class=\"a\">explicit\u003c/span>\u003cspan class=\"a\">definite\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">harmony\u003c/b>\u003cspan class=\"m\">화합, 조화\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">agreement\u003c/span>\u003cspan class=\"s\">concord\u003c/span>\u003cspan class=\"s\">unity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conflict\u003c/span>\u003cspan class=\"a\">discord\u003c/span>\u003cspan class=\"a\">disharmony\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">equivalent\u003c/b>\u003cspan class=\"m\">상응하는 표현\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">counterpart\u003c/span>\u003cspan class=\"s\">match\u003c/span>\u003cspan class=\"s\">parallel\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">unrelated\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 시험에 자주 나오는 동의어와 반의어를 정리할게요. explicit은 clear, definite, unambiguous와 동의어이고, implicit, vague, ambiguous와 반의어예요. implicit은 implied, suggested, unspoken과 동의어이고, explicit, clear와 반대죠. individualistic은 independent, self-reliant와 비슷하고, collectivistic, communal과 반대예요. collectivistic은 communal, group-oriented와 동의어이고, individualistic, independent와 반대예요. categorical은 absolute, unconditional과 비슷하고, ambiguous, tentative와 반대이며, ambiguous는 vague, unclear과 동의어이고 clear, explicit, definite와 반대예요. harmony는 agreement, concord, unity와 비슷하고 conflict, discord, disharmony와 반대이니 함께 묶어서 암기하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언어는 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Language \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발현(표현)\u003c/span>\u003cspan class=\"en\">a manifestation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문화의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">culture\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">언어는 문화의 발현이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 글 전체의 핵심 명제로, 언어와 문화의 관계를 \u003cb class=\"key\">발현\u003c/b>으로 정의한다. manifestation은 추상적 문화가 언어라는 구체적 모습으로 \u003cb class=\"key\">드러난 \u003c/b>\u003cb class=\"key\">것\u003c/b>이라는 뜻이다. 이후 문장들은 이 명제를 바탕으로 언어 습득이 곧 문화적 \u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">방식\u003c/b> 습득임을 설명한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 문장(S+V+C)\u003c/span> : S + V(be) + C : \"언어는 ~이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(of+명사)의 형용사적 용법\u003c/span> : 명사 + of + 명사 : \"문화의\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Language is, 언어는 ~이다. a manifestation, 발현(표현). of culture, 문화의. 이 문장 전체를 해석하면, 언어는 문화의 발현이다.","hl":"m"},{"n":13,"text":"첫 문장은 이 글의 가장 중요한 명제를 제시해요. 언어는 문화의 발현, 즉 문화가 구체적으로 드러난 모습이라는 거죠. 앞으로 언어 습득과 문화의 관계를 설명하겠다고 방향을 잡아 주는 문장입니다.","hl":"mn"},{"n":14,"text":"Language is는 be동사를 쓴 2형식 문장이라서 뒤에 주격보어가 필요해요. a manifestation of culture라는 명사구가 보어로 와서 주어 Language를 정의하고 있습니다. of culture는 앞 명사 manifestation을 수식하는 전치사구예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언어 습득의 여러 단계에서\u003c/span>\u003cspan class=\"en\">At different language acquisition stages,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들은 언어 그 자체만을 배우지 않는다\u003c/span>\u003cspan class=\"en\">children \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span> language per se;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오히려 다양한 패턴과 양식을 배운다\u003c/span>\u003cspan class=\"en\">rather they learn the various patterns and styles\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언어적 상호작용의\u003c/span>\u003cspan class=\"en\">of language interaction\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 제 역할을 할 수 있게 해주는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">enable \u003c/span>\u003cspan class=\"tgt\">them\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">function \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유능한 소통가로서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">competent \u003c/span>\u003cspan class=\"tgt\">communicators\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 상황적 맥락 속에서\u003c/span>\u003cspan class=\"en\">in different situational contexts.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">언어 습득의 여러 단계에서 아이들은 언어 그 자체만을 배우지 않는다. 그보다는 다양한 상황적 맥락 속에서 유능한 소통가로서 제 역할을 할 수 있게 해주는 언어적 상호작용의 다양한 패턴과 양식을 배운다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 아이들이 언어를 배울 때 언어 그 자체가 아니라 \u003cb class=\"key\">상황적 \u003c/b>\u003cb class=\"key\">맥락\u003c/b> 속에서 쓰이는 \u003cb class=\"key\">상호작용 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>과 양식을 배운다는 핵심을 제시한다. per se는 '그 자체로서'라는 뜻이며, 대조의 부사 rather가 앞 내용을 부정하고 진짜 학습 내용을 이끈다. 이를 통해 언어 습득이 곧 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">의사소통\u003c/b> 능력의 습득임을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정문(do not + 동사원형)\u003c/span> : do not + V : \"배우지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 + that + V : \"그들이 ~할 수 있게 해주는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 목적격 보어\u003c/span> : enable + O + to-V : \"유능한 소통가로서 제 역할을 하는 것\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"At different language acquisition stages, 언어 습득의 여러 단계에서. children do not learn language per se, 아이들은 언어 그 자체만을 배우지 않는다. rather they learn the various patterns and styles, 오히려 다양한 패턴과 양식을 배운다. of language interaction, 언어적 상호작용의. that enable them to function, 그들이 제 역할을 할 수 있게 해주는. as competent communicators, 유능한 소통가로서. in different situational contexts, 다양한 상황적 맥락 속에서. 이 문장 전체를 해석하면, 언어 습득의 여러 단계에서 아이들은 언어 그 자체만을 배우지 않는다. 그보다는 다양한 상황적 맥락 속에서 유능한 소통가로서 제 역할을 할 수 있게 해주는 언어적 상호작용의 다양한 패턴과 양식을 배운다.","hl":"m"},{"n":16,"text":"이 문장은 아이들이 언어를 배울 때 언어 그 자체가 아니라, 상황에 맞게 소통할 수 있게 해 주는 상호작용의 패턴과 양식을 배운다는 핵심을 말해요. 특히 per se는 그 자체로서라는 뜻이고, rather는 앞 내용을 부정하며 진짜 중요한 내용을 이끄는 표현이에요. 결국 언어 습득은 문화적 의사소통 방식을 익히는 과정이라는 거죠.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 do not learn의 부정문이에요. 일반동사 learn을 부정할 때 do not을 쓰고 동사는 원형으로 쓴다는 점을 확인하세요. 두 번째, that enable them에서 that은 앞의 the various patterns and styles를 받는 주격 관계대명사예요. 뒤에 주어 없이 동사 enable이 바로 오는 것이 주격 관계대명사의 단서입니다. 세 번째, to function as competent communicators는 enable과 함께 쓰여 목적어 them의 동작을 나타내는 to부정사 목적격 보어입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 발달시킨다\u003c/span>\u003cspan class=\"en\">They develop\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문화 특유의 의사소통 양식을\u003c/span>\u003cspan class=\"en\">a culture-specific communication style\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~인, 예를 들어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is, \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">example,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인주의 문화에서 직접적이고 명시적인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">direct \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">explicit \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">individualistic \u003c/span>\u003cspan class=\"tgt\">cultures \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 집단주의 문화에서 간접적이고 암시적인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">indirect \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">implicit \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">collectivistic \u003c/span>\u003cspan class=\"tgt\">cultures\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들은 문화 특유의 의사소통 양식을 발달시키는데, 예를 들어 개인주의 문화에서는 직접적이고 명시적이나, 집단주의 문화에서는 간접적이고 암시적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 문화에 따라 의사소통 양식이 달라진다는 구체적 예로, 개인주의 문화에서는 \u003cb class=\"key\">직접적·명시적\u003c/b> 양식이, 집단주의 문화에서는 \u003cb class=\"key\">간접적·암시적\u003c/b> 양식이 발달함을 보여 준다. culture-specific는 '문화 특유의'이고, for example은 앞 문장의 예시를 자연스럽게 덧붙이는 삽입 표현이다. 결국 의사소통 양식의 차이는 \u003cb class=\"key\">문화적 \u003c/b>\u003cb class=\"key\">차이\u003c/b>에서 비롯된다는 점을 드러낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that + be동사 + 삽입어\u003c/span> : 선행사 + that is + (삽입어) : \"~인, 예를 들어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 or에 의한 병렬 구조\u003c/span> : A or B : \"개인주의 문화에서는 직접적이고 명시적이거나 집단주의 문화에서는 간접적이고 암시적이다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They develop, 그들은 발달시킨다. a culture-specific communication style, 문화 특유의 의사소통 양식을. that is, for example, ~인, 예를 들어. direct and explicit in individualistic cultures, 개인주의 문화에서 직접적이고 명시적인. or indirect and implicit in collectivistic cultures, 혹은 집단주의 문화에서 간접적이고 암시적인. 이 문장 전체를 해석하면, 그들은 문화 특유의 의사소통 양식을 발달시키는데, 예를 들어 개인주의 문화에서는 직접적이고 명시적이나, 집단주의 문화에서는 간접적이고 암시적이다.","hl":"m"},{"n":19,"text":"세 번째 문장은 문화에 따라 의사소통 양식이 어떻게 다른지 구체적으로 보여 줘요. 개인주의 문화에서는 직접적이고 명시적인 표현을, 집단주의 문화에서는 간접적이고 암시적인 표현을 발달시킨다는 거죠. culture-specific는 문화 특유의라는 뜻이고, for example이 삽입되어 예시를 부드럽게 덧붙이고 있어요.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 that is의 that이에요. 앞에 나온 a culture-specific communication style을 받는 주격 관계대명사이고, 뒤에 주격보어 direct and explicit가 와서 양식을 수식합니다. 두 번째로 direct and explicit in individualistic cultures와 or indirect and implicit in collectivistic cultures가 등위접속사 or로 병렬 연결되었어요. 개인주의 문화와 집단주의 문화의 양식을 대조하는 병렬 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직접적인 양식과 연결된 단어의 사례들은\u003c/span>\u003cspan class=\"en\">Examples of words \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">linked \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">direct \u003c/span>\u003cspan class=\"tgt\">style\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단정적인 단어들이다\u003c/span>\u003cspan class=\"en\">are categorical words\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘전적으로(absolutely)’, ‘확실히(certainly)’, 또는 ‘분명히(positively)’와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">absolutely, \u003c/span>\u003cspan class=\"tgt\">certainly, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">positively\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">직접적인 양식과 연결된 단어의 사례로는 ‘전적으로(absolutely)’, ‘확실히(certainly)’, 또는 ‘분명히(positively)’와 같은 단정적인 단어들이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 직접적인 의사소통 양식의 구체적 예를 제시한다. \u003cb class=\"key\">단정적인\u003c/b> 어휘인 absolutely, certainly, positively는 \u003cb class=\"key\">직접적이고 \u003c/b>\u003cb class=\"key\">명시적인\u003c/b> 문화 스타일을 보여 준다. 즉, 표현이 \u003cb class=\"key\">확정적\u003c/b>일수록 개인주의 문화의 직접적 화법에 속한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 명사 후치수식\u003c/span> : words [linked with the direct style] : \"직접적인 양식과 연결된 단어들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 like와 부사 병렬\u003c/span> : like [absolutely], [certainly], or [positively] : \"‘전적으로’, ‘확실히’, 또는 ‘분명히’와 같은\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Examples of words linked with the direct style, 직접적인 양식과 연결된 단어의 사례들은. are categorical words, 단정적인 단어들이다. like absolutely, certainly, or positively, ‘전적으로(absolutely)’, ‘확실히(certainly)’, 또는 ‘분명히(positively)’와 같은. 이 문장 전체를 해석하면, 직접적인 양식과 연결된 단어의 사례로는 ‘전적으로(absolutely)’, ‘확실히(certainly)’, 또는 ‘분명히(positively)’와 같은 단정적인 단어들이 있다.","hl":"m"},{"n":22,"text":"이 문장은 직접적인 양식이 실제로 어떤 단어로 나타나는지 보여주는 예시문이에요. absolutely나 certainly, positively 같은 단어는 확실하고 단정적인 말투의 대표적인 표현이죠. 그래서 이런 표현이 많은 문화는 개인주의적이고 직접적인 소통을 선호한다고 볼 수 있어요.","hl":"mn"},{"n":23,"text":"첫 번째, linked with the direct style는 과거분사 linked가 앞의 명사 words를 뒤에서 꾸며 주는 구조예요. 수동의 뜻으로 연결된 단어들이라는 의미를 만들어요. 두 번째, like absolutely, certainly, or positively는 like가 ~와 같은이라는 뜻의 전치사이고, 세 부사가 or로 병렬 연결된 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대조적으로,\u003c/span>\u003cspan class=\"en\">By contrast,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상호 의존과 화합이라는 문화적 전제는\u003c/span>\u003cspan class=\"en\">the cultural assumptions of interdependence and harmony\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요구한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">require \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집단주의자들이 스스로를 제한하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">collectivists \u003c/span>\u003cspan class=\"tgt\">limit \u003c/span>\u003cspan class=\"tgt\">themselves\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">암시적이고 심지어 모호한 어휘 사용으로\u003c/span>\u003cspan class=\"en\">to implicit and even ambiguous use of words,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘어쩌면(maybe)’, ‘아마도(perhaps)’, 혹은 ‘그럴지도(probably)’와 같은 표현을 쓰면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">using \u003c/span>\u003cspan class=\"tgt\">terms \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">maybe, \u003c/span>\u003cspan class=\"tgt\">perhaps, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">probably\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대조적으로, 상호 의존과 화합이라는 문화적 전제는 집단주의자들이 ‘어쩌면(maybe)’, ‘아마도(perhaps)’, 혹은 ‘그럴지도(probably)’와 같은 표현을 쓰면서 암시적이고 심지어 모호한 어휘 사용으로 스스로를 제한하도록 요구한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 집단주의 문화의 \u003cb class=\"key\">간접적\u003c/b> 언어 사용을 이끄는 문화적 전제를 설명한다. 상호 의존과 화합을 중시하는 문화에서는 상대의 체면이나 관계를 지키기 위해 명확한 표현 대신 \u003cb class=\"key\">완곡한\u003c/b> 표현을 사용해야 한다는 것이다. maybe, perhaps, probably처럼 \u003cb class=\"key\">가능성\u003c/b>을 열어 두는 말이 그러한 태도를 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">require + that절 + 동사원형\u003c/span> : require that + 주어 + [limit (동사원형)] : \"집단주의자들이 스스로를 제한하도록 요구한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구문(부대상황)\u003c/span> : S + V ~, [using terms like maybe, perhaps, or probably] : \"~와 같은 표현을 쓰면서\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"By contrast, 대조적으로. the cultural assumptions of interdependence and harmony, 상호 의존과 화합이라는 문화적 전제는. require, 요구한다. that collectivists limit themselves, 집단주의자들이 스스로를 제한하도록. to implicit and even ambiguous use of words, 암시적이고 심지어 모호한 어휘 사용으로. using terms like maybe, perhaps, or probably, ‘어쩌면(maybe)’, ‘아마도(perhaps)’, 혹은 ‘그럴지도(probably)’와 같은 표현을 쓰면서. 이 문장 전체를 해석하면, 대조적으로, 상호 의존과 화합이라는 문화적 전제는 집단주의자들이 ‘어쩌면(maybe)’, ‘아마도(perhaps)’, 혹은 ‘그럴지도(probably)’와 같은 표현을 쓰면서 암시적이고 심지어 모호한 어휘 사용으로 스스로를 제한하도록 요구한다.","hl":"m"},{"n":25,"text":"이 문장은 집단주의 문화에서 왜 직접적인 표현을 피하는지 그 배경을 설명해 주고 있어요. 상호 의존과 화합이라는 문화적 가치 때문에 집단주의자들은 말을 너무 확실하게 하지 않고, 오히려 암시적이고 모호한 표현으로 자신을 제한한다는 거죠. 그래서 maybe나 perhaps, probably 같은 여지를 남기는 표현을 쓰게 된다는 뜻이에요.","hl":"mn"},{"n":26,"text":"첫 번째, require that collectivists limit themselves에서 require 다음의 that절은 요구나 주장을 나타내는 동사원형 구문이에요. collectivists가 복수 주어라서 limit에 따로 변화가 없지만, 시제와 상관없이 동사원형이 오는 구조라는 걸 기억하세요. 두 번째, using terms like maybe, perhaps, or probably는 현재분사구문으로 주절의 내용과 동시에 일어나는 부수적인 상황을 나타내요. 집단주의자들이 표현을 쓰면서 스스로를 제한한다는 의미로 이어져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영어는\u003c/span>\u003cspan class=\"en\">The English language is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계에서 유일한 언어이다\u003c/span>\u003cspan class=\"en\">the only language in the world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">I를 대문자로 표기하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">spells \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">capital \u003c/span>\u003cspan class=\"tgt\">letter\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">영어는 전 세계에서 ‘I’를 대문자로 표기하는 유일한 언어이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 영어가 유일하게 I를 대문자로 쓴다는 사실을 제시한다. 이는 곧 \u003cb class=\"key\">개인주의\u003c/b>의 뿌리가 잉글랜드에 있다는 다음 문장의 근거로 작용한다. 영어의 \u003cb class=\"key\">자아\u003c/b> 표기가 시각적으로도 강조된다는 점에서 개인의 중요성을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : the only language [that spells I with a capital letter] : \"I를 대문자로 표기하는 유일한 언어\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The English language is, 영어는. the only language in the world, 전 세계에서 유일한 언어이다. that spells I with a capital letter, I를 대문자로 표기하는. 이 문장 전체를 해석하면, 영어는 전 세계에서 ‘I’를 대문자로 표기하는 유일한 언어이다.","hl":"m"},{"n":28,"text":"이 문장은 영어에서 I가 대문자로 표기되는 세계 유일의 언어라는 사실을 짚고 있어요. 이 사실은 곧 개인주의의 뿌리가 잉글랜드에 있다는 다음 문장의 근거로 연결되죠. 문자 표기에서조차 자아가 강조된다는 점에서 문화와 언어의 연결을 보여 주는 예시예요.","hl":"mn"},{"n":29,"text":"여기서 that spells I with a capital letter는 앞에 있는 the only language를 꾸며 주는 주격 관계대명사절이에요. that이 선행사를 받아서 spells의 주어 역할을 하고, I를 대문자로 표기하는 언어라는 뜻을 만들어요. 선행사에 the only가 있으니 that을 쓰는 게 아주 자연스럽죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 현상은\u003c/span>\u003cspan class=\"en\">This phenomenon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반영할 수도 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">reflect\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fact \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인주의의 뿌리가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">roots \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">individualism \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잉글랜드에 있다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">England\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 현상은 개인주의의 뿌리가 잉글랜드에 있다는 사실을 반영하는 것일 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 살펴본 I 대문자 표기가 잉글랜드에 개인주의의 뿌리가 있다는 사실을 반영할 수도 있다고 해석해 줘요. 여기서 the fact that은 \u003cb class=\"key\">동격\u003c/b> 접속사로, that 이하가 fact의 구체적인 내용을 설명해요. 결과적으로 영어의 표기 방식이 \u003cb class=\"key\">개인주의\u003c/b> 문화라는 가치를 담고 있음을 보여 주는 연결 고리 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may + 동사원형\u003c/span> : [may + 동사원형] : \"반영할 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격 that절\u003c/span> : [the fact] + [that + 완전한 문장] : \"개인주의의 뿌리가 잉글랜드에 있다는 사실\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"This phenomenon, 이 현상은. may reflect, 반영할 수도 있다. the fact, 사실을. that the roots of individualism, 개인주의의 뿌리가. are in England, 잉글랜드에 있다는. 이 문장 전체를 해석하면, 이러한 현상은 개인주의의 뿌리가 잉글랜드에 있다는 사실을 반영하는 것일 수도 있다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 말한 I를 대문자로 쓰는 현상이 잉글랜드에 개인주의의 뿌리가 있다는 사실을 반영하는 것일 수도 있다고 설명해 줍니다. 여기서 the fact that은 뒤에 오는 that절이 fact와 같은 내용을 설명하는 동격의 접속사예요. 결국 이 문장은 언어의 형태가 문화적 가치를 담고 있다는 걸 보여 주는 역할을 해요.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 the fact that이에요. that 이하는 앞에 있는 fact와 동격인 명사절로, 사실이라는 명사의 내용을 구체적으로 설명해 줍니다. that 뒤에는 완전한 문장이 오는 것이 특징이에요. 두 번째 어법 포인트는 may reflect예요. 조동사 may가 동사 reflect 앞에서 추측의 의미를 더해 주어서 반영할 수도 있다로 해석하면 자연스럽습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일본어의 상응 표현은 존재하지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">Japanese \u003c/span>\u003cspan class=\"tgt\">equivalent\u003c/span>\u003c/span>\u003c/div> n>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">self\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 따라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">depending \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적 상황\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">situation, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화자의 성별과 나이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">speaker's \u003c/span>\u003cspan class=\"tgt\">gender, \u003c/span>\u003cspan class=\"tgt\">age, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 여타의 사회적 속성들\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">attributes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청자에 대한\u003c/span>\u003cspan class=\"en\">relative to the listener.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사회적 상황, 화자의 성별과 나이, 그리고 청자에 대한 여타의 사회적 속성들에 따라 각기 다른 단어들이 자신을 지칭하는 데 사용된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 일본어에서 자신을 가리키는 말이 하나로 정해져 있지 않고 사회적 상황, 화자의 성별과 나이, 청자에 대한 여러 사회적 속성에 따라 \u003cb class=\"key\">각기 \u003c/b>\u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">단어\u003c/b>가 쓰인다고 설명해요. 이는 영어의 I와 달리 일본어의 자아 표현이 \u003cb class=\"key\">관계적\u003c/b>이고 맥락 의존적임을 보여 줘요. 앞 문장에서 말한 영어 I에 상응하는 일본어 표현이 없다는 내용을 구체적으로 뒷받침하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : [be동사 + 과거분사] : \"사용된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to + 동사원형] : \"자신을 지칭하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : [depending on + 명사구] : \"~에 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : [A, B, and C] : \"사회적 상황, 화자의 성별과 나이, 그리고 여타의 사회적 속성들\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Different words are used, 각기 다른 단어들이 사용된다. to refer to the self, 자신을 지칭하기 위해. depending on, ~에 따라. the social situation, 사회적 상황. the speaker's gender, age, 화자의 성별과 나이. and the other social attributes, 그리고 여타의 사회적 속성들. relative to the listener, 청자에 대한. 이 문장 전체를 해석하면, 사회적 상황, 화자의 성별과 나이, 그리고 청자에 대한 여타의 사회적 속성들에 따라 각기 다른 단어들이 자신을 지칭하는 데 사용된다.","hl":"m"},{"n":37,"text":"이 문장은 일본어에서 자신을 가리키는 말이 하나로 정해져 있지 않고 사회적 상황이나 화자의 성별과 나이, 청자에 대한 여러 사회적 속성에 따라 각기 다른 단어가 쓰인다고 설명해 줘요. 영어의 I와 달리 일본어의 자아 표현은 관계적이고 맥락 의존적이라는 점을 보여 주는 거예요. 그래서 앞 문장의 Japanese equivalent가 없다는 내용을 구체적으로 뒷받침해 줘요.","hl":"mn"},{"n":38,"text":"첫 번째 어법 포인트는 are used예요. 주어 Different words가 사용되는 대상이기 때문에 be동사와 과거분사로 이루어진 수동태가 쓰였어요. 두 번째는 to refer to the self예요. to부정사가 used를 수식하면서 자신을 지칭하기 위해라는 목적의 의미를 나타내고 있어요. 세 번째는 depending on으로 시작하는 분사구문이에요. 주절의 동작이 일어나는 조건이나 상황을 덧붙여 주면서 에 따라로 해석하면 자연스러워요. 네 번째는 the social situation, the speaker's gender, age, and the other social attributes라는 병렬 구조인데요. 쉼표와 and로 여러 명사구가 같은 자격으로 나열되고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>언어는 문화의 \u003cb class=\"key\">발현\u003c/b>이며, 아이들은 언어 자체보다 다양한 \u003cb class=\"key\">상황적 \u003c/b>\u003cb class=\"key\">맥락\u003c/b>에서 소통하게 하는 \u003cb class=\"key\">상호작용 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>을 배운다.\u003c/li>\u003cli>이렇게 발달한 \u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">특유의 \u003c/b>\u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">양식\u003c/b>은 개인주의 문화에서 \u003cb class=\"key\">직접적이고 \u003c/b>\u003cb class=\"key\">명시적\u003c/b>으로, 집단주의 문화에서 \u003cb class=\"key\">간접적이고 \u003c/b>\u003cb class=\"key\">암시적\u003c/b>으로 나타난다.\u003c/li>\u003cli>개인주의 문화에서는 absolutely, certainly, positively 같은 \u003cb class=\"key\">단정적인 \u003c/b>\u003cb class=\"key\">단어\u003c/b>를, 집단주의 문화에서는 maybe, perhaps, probably 같은 \u003cb class=\"key\">모호한 \u003c/b>\u003cb class=\"key\">표현\u003c/b>을 사용한다.\u003c/li>\u003cli>영어가 I를 \u003cb class=\"key\">대문자\u003c/b>로 쓰는 것은 \u003cb class=\"key\">개인주의의 \u003c/b>\u003cb class=\"key\">뿌리\u003c/b>가 잉글랜드에 있음을 보여 주며, 일본어에는 I에 \u003cb class=\"key\">상응하는 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이 없어 상황에 따라 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">단어\u003c/b>로 자신을 지칭한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Language reflects culture, and children acquire culture-specific communication styles—direct and explicit in individualistic cultures, indirect and implicit in collectivistic cultures—as shown by the English capital I and Japanese self-reference words.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">언어는 \u003cb class=\"key\">문화의 \u003c/b>\u003cb class=\"key\">발현\u003c/b>으로, 아이들은 언어 자체가 아니라 \u003cb class=\"key\">상황적 \u003c/b>\u003cb class=\"key\">맥락\u003c/b>에서 소통하게 하는 \u003cb class=\"key\">상호작용 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>을 배우며, 개인주의 문화는 \u003cb class=\"key\">직접적·명시적\u003c/b> 의사소통을, 집단주의 문화는 \u003cb class=\"key\">간접적·암시적\u003c/b> 의사소통을 발달시킨다. 영어의 I 대문자 표기와 일본어의 다양한 자칭 표현은 이러한 \u003cb class=\"key\">문화 \u003c/b>\u003cb class=\"key\">특유의 \u003c/b>\u003cb class=\"key\">의사소통 \u003c/b>\u003cb class=\"key\">양식\u003c/b>을 보여 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 지문의 핵심을 정리하면, 언어는 문화의 발현이고 아이들은 문화 특유의 의사소통 양식을 익힌다는 것이 핵심이에요. 개인주의 문화는 직접적이고 명시적인 표현을, 집단주의 문화는 간접적이고 암시적인 표현을 발달시키죠. 영어의 I 대문자와 일본어의 다양한 자칭 표현은 이런 문화적 차이를 잘 보여 주는 사례예요. 오늘 분석한 구조와 표현을 바탕으로 복습해 보세요. 수고했어요.","hl":null}]}]});</script></body></html>
