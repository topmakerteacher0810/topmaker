Yxnv9cl13X/Db/cOUbX3Xr0203euq3t9zupMkgc4A9eMc8g/5+lJ27e2ccnrnj8/1pA6HgOvc9R26+/8An3pPMQY+de38Qz7e5549fWheXf8AH+v61J1WlmrXfW6vb0/pj89cfT/Ptkfp+NB59fr/AJ/L+mKj8xM43Lx/tD0+vPH9OvOFMi44ZScf3vXOPft/+qgd5PTXXT8v+B9/mDggg8H68DB5zk9c9cd8c9KjJ4CjhRjA6j/PT3yBnnOVZwcMWU8c8k8nj0z6EDoP4gCSKblem5fXrzx27A9s/wBehS6a7Kz9dP6+ZpFWSvvbovON9rprbX07MDwOeh/L/OD+XWmllKuOpwMZ6cnnrwcY5A5wQcgc1FIy8YYdyOeCcjj8/cA/iMsyACSd3VRjPJPAGBkkn8evUjrrCDfK7u6lFq0b2akk9Nd9vw12dP0vqn9zX9f8Gx//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Language as a Reflection of Cultural Characteristics<small>문화적 특성의 반영으로서의 언어</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 지문을 더 깊이 이해하기 위해서는 인류학자 에드워드 홀(Edward T. Hall)이 제안한 고맥락 문화(High-context culture)와 저맥락 문화(Low-context culture)라는 개념을 미리 알아두시면 좋습니다. 마치 우리가 친밀한 친구와는 눈빛만 봐도 속마음을 아는 것처럼, 관계와 조화를 중시하는 집단주의(Collectivism) 사회는 명시적인 단어보다 숨은 맥락을 파악해야 하는 간접적인 고맥락 소통을 선호합니다. 반면에, 가전제품의 상세한 조립 설명서처럼 모든 것을 겉으로 꼼꼼하게 표현하는 개인주의(Individualism) 사회는 직접적이고 명확한 저맥락 소통을 중요하게 생각하지요. 더불어, 언어가 화자의 성별이나 나이 같은 사회적 조건에 따라 어떻게 변하는지 연구하는 사회언어학(Sociolinguistics)의 관점을 함께 떠올려보시면, 지문에 등장하는 영어의 대문자 &#39;I&#39;와 일본어의 다양한 1인칭 대명사들이 단순한 문법 차이가 아니라 그 사회의 고유한 문화적 지문이라는 사실을 훨씬 재미있게 이해하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01언어 습득과 문화</div><ul><li>언어는 문화의 발현이며, 언어 습득은 문화적 상호작용 방식을 배우는 과정이다.</li><li>아이들은 상황적 맥락(situational contexts)에 맞는 소통 방식을 학습함</li><li>언어 자체보다 상호작용의 패턴과 스타일(patterns and styles)을 익힘</li><li>핵심 키워드: 문화의 발현(manifestation of culture)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02문화별 의사소통 스타일</div><ul><li>문화의 성격에 따라 서로 다른 의사소통 방식이 발달한다.</li><li>개인주의 문화(individualistic cultures): 직접적이고 명시적(direct and explicit)</li><li>집단주의 문화(collectivistic cultures): 간접적이고 암시적(indirect and implicit)</li><li>핵심 키워드: 문화 특유의 의사소통 스타일(culture-specific communication style)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03어휘 선택의 차이</div><ul><li>문화가 중시하는 가치에 따라 단정적이거나 모호한 어휘를 선택하게 된다.</li><li>직접적 스타일: 단정적인 단어(categorical words) 사용 (예: absolutely)</li><li>간접적 스타일: 상호의존(interdependence)과 조화(harmony)를 위해 모호한 단어 사용</li><li>핵심 키워드: 모호한 단어 사용(ambiguous use of words)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04자아 지칭어의 문화적 사례</div><ul><li>영어와 일본어의 1인칭 대명사 사용은 이러한 문화적 차이를 극명하게 보여준다.</li><li>영어: &#39;I&#39;를 대문자(capital letter)로 표기하여 개인주의의 뿌리를 반영함</li><li>일본어: 영어의 &#39;I&#39;에 정확히 상응하는 단어(equivalent)가 없음</li><li>사회적 상황(social situation)과 화자의 속성에 따라 다른 자아 지칭어를 사용함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">manifestation</td><td class=\"m\">발현, 징후, 나타남</td></tr><tr><td class=\"w\">acquisition</td><td class=\"m\">습득, 획득</td></tr><tr><td class=\"w\">per se</td><td class=\"m\">그 자체로, 본질적으로</td></tr><tr><td class=\"w\">enable</td><td class=\"m\">~할 수 있게 하다, 가능하게 하다</td></tr><tr><td class=\"w\">competent</td><td class=\"m\">유능한, 능력이 있는</td></tr><tr><td class=\"w\">context</td><td class=\"m\">맥락, 문맥, 상황</td></tr><tr><td class=\"w\">explicit</td><td class=\"m\">명백한, 뚜렷한, 노골적인</td></tr><tr><td class=\"w\">implicit</td><td class=\"m\">암묵적인, 내포된, 은연중의</td></tr><tr><td class=\"w\">categorical</td><td class=\"m\">단정적인, 절대적인</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">by contrast</td><td class=\"m\">대조적으로, 그에 반해</td></tr><tr><td class=\"w\">assumption</td><td class=\"m\">가정, 추정, 전제</td></tr><tr><td class=\"w\">interdependence</td><td class=\"m\">상호 의존, 상호 의존성</td></tr><tr><td class=\"w\">ambiguous</td><td class=\"m\">모호한, 애매한</td></tr><tr><td class=\"w\">phenomenon</td><td class=\"m\">현상, 사건</td></tr><tr><td class=\"w\">equivalent</td><td class=\"m\">동등한 것, 상응하는 것, 등가물</td></tr><tr><td class=\"w\">refer to</td><td class=\"m\">~을 가리키다, ~을 언급하다</td></tr><tr><td class=\"w\">depend on</td><td class=\"m\">~에 따라 결정되다, ~에 달려 있다, ~에 의존하다</td></tr><tr><td class=\"w\">relative to</td><td class=\"m\">~와 관련된, ~에 비하여</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">언어는 문화의 발현이다.</span><span class=\"en\"><b>Language <span class=\"grammar-hl\">is a manifestation</span> of culture.</b></span></div></div><div class=\"lec-sent-ko\">언어는 문화의 발현이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 시작하며 전체 주제를 던집니다. 언어와 문화가 뗄 수 없는 관계이며, 언어를 보면 그 사회의 문화를 알 수 있다는 핵심 주장을 제시합니다. 학술 글에서 manifestation of culture는 겉으로 드러나지 않는 문화적 특징이 언어라는 구체적인 형태로 눈에 보이게 나타나는 현상을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is a manifestation 2형식 구조: 주어(Language) + 동사(is) + 주격보어(a manifestation)의 2형식 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">manifestation</td><td class=\"m\">발현, 징후, 나타남</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">언어 습득의 여러 단계에서</span><span class=\"en\"><b>At different language acquisition stages,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아이들은 언어 그 자체만을 배우지 않는다</span><span class=\"en\"><b>children do not learn language <span class=\"grammar-hl\">per se</span>;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그보다는</span><span class=\"en\"><b>rather</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들은 언어적 상호작용의 다양한 패턴과 양식을 배운다</span><span class=\"en\"><b>they learn the various patterns and styles of language interaction</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 제 역할을 할 수 있게 해주는</span><span class=\"en\"><b><span class=\"grammar-hl\">that enable</span> them <span class=\"grammar-hl\">to function</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유능한 소통가로서</span><span class=\"en\"><b>as competent communicators</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다양한 상황적 맥락 속에서</span><span class=\"en\"><b>in different situational contexts.</b></span></div></div><div class=\"lec-sent-ko\">언어 습득의 여러 단계에서 아이들은 언어 그 자체만을 배우지 않는다. 그보다는 다양한 상황적 맥락 속에서 유능한 소통가로서 제 역할을 할 수 있게 해주는 언어적 상호작용의 다양한 패턴과 양식을 배운다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 주장을 아이들의 언어 학습 과정에 적용하여 구체화합니다. language per se를 &#39;언어 그 자체&#39;라고 옮기면 조금 막연하게 느껴집니다. 쉽게 말해 아이들은 문법이나 단어 같은 기계적인 규칙만 외우는 것이 어니라, 특정한 상황에서 누구에게 어떤 말투로 말해야 하는지 그 사회의 문화가 녹아있는 대화 방식을 함께 습득한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">per se (관용표현): &#39;그 자체로&#39;라는 의미의 라틴어 유래 관용표현으로, 명사 뒤에 쓰여 해당 명사의 본질적인 특성을 강조한다.</div><div class=\"lec-gr-item\">that enable (관계대명사): that은 주격 관계대명사로 선행사 the various patterns and styles of language interaction을 수식하며, 뒤에 주어가 없는 불완전한 절이 온다.</div><div class=\"lec-gr-item\">enable them to function 5형식(SVOC) 구조: 관계대명사절의 동사 enable은 5형식 동사로, 목적어(them) 뒤에 목적격 보어로 to부정사(to function)를 취한다. 기본구조: enable + O(목적어) + toV</div><div class=\"lec-gr-item\">to function (to부정사): 5형식 동사 enable의 목적격 보어로 쓰인 명사적 용법의 to부정사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">acquisition</td><td class=\"m\">습득, 획득</td></tr><tr><td class=\"w\">per se</td><td class=\"m\">그 자체로, 본질적으로</td></tr><tr><td class=\"w\">enable</td><td class=\"m\">~할 수 있게 하다, 가능하게 하다</td></tr><tr><td class=\"w\">competent</td><td class=\"m\">유능한, 능력이 있는</td></tr><tr><td class=\"w\">context</td><td class=\"m\">맥락, 문맥, 상황</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그들은 문화 특유의 의사소통 양식을 발달시킨다</span><span class=\"en\"><b>They develop a culture-specific communication style</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예를 들어, 직접적이고 명시적인</span><span class=\"en\"><b><span class=\"grammar-hl\">that is</span>, for example, direct and explicit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개인주의 문화에서는</span><span class=\"en\"><b>in individualistic cultures</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">또는 간접적이고 암시적인</span><span class=\"en\"><b>or indirect and implicit</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집단주의 문화에서는</span><span class=\"en\"><b>in collectivistic cultures.</b></span></div></div><div class=\"lec-sent-ko\">(C) 그들은 문화 특유의 의사소통 양식을 발달시키는데, 예를 들어 개인주의 문화에서는 직접적이고 명시적이나, 집단주의 문화에서는 간접적이고 암시적이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 언급한 &#39;상호작용 패턴&#39;이 문화에 따라 어떻게 다른지 개인주의와 집단주의를 비교하며 예시를 듭니다. culture-specific communication style은 자신이 속한 사회가 개인을 중시하는지, 아니면 집단의 조화를 중시하는지에 따라 의사소통하는 방식이 아예 다르게 형성된다는 것을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that is (관계대명사): that은 주격 관계대명사로 선행사 a culture-specific communication style을 수식하며, 관계대명사절 내부에서 주어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">explicit</td><td class=\"m\">명백한, 뚜렷한, 노골적인</td></tr><tr><td class=\"w\">implicit</td><td class=\"m\">암묵적인, 내포된, 은연중의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">직접적인 양식과 연결된 단어의 사례들은</span><span class=\"en\"><b>Examples of words <span class=\"grammar-hl\">linked with the direct style</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">단정적인 단어들이다</span><span class=\"en\"><b>are categorical words</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘전적으로’, ‘확실히’, 또는 ‘분명히’와 같은</span><span class=\"en\"><b>like absolutely, certainly, or positively.</b></span></div></div><div class=\"lec-sent-ko\">직접적인 양식과 연결된 단어의 사례로는 ‘전적으로(absolutely)’, ‘확실히(certainly)’, 또는 ‘분명히(positively)’와 같은 단정적인 단어들이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;개인주의 문화의 직접적인 스타일&#39;에 대한 구체적인 단어 예시를 제시합니다. categorical words를 사전적으로 &#39;정언적인 단어&#39;라고 옮기면 어렵게 느껴집니다. 쉽게 말해 모호함 없이 자기 생각이나 주장을 확고하고 단호하게 내세울 때 쓰는 낱말들입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">linked with the direct style (과거분사(형용사)): linked가 앞의 명사 words를 수식한다. N + p.p. 구조로 &#39;words that are linked&#39;와 같은 축약 관계절의 형태이며, 수식받는 명사 words 기준으로 &#39;연결된&#39;이라는 수동의 의미를 지닌다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">categorical</td><td class=\"m\">단정적인, 절대적인</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대조적으로</span><span class=\"en\"><b>By contrast,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">상호 의존과 화합이라는 문화적 전제는</span><span class=\"en\"><b>the cultural assumptions of interdependence and harmony</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">요구한다</span><span class=\"en\"><b><span class=\"grammar-hl\">require</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">집단주의자들이 스스로를 제한하도록</span><span class=\"en\"><b><span class=\"grammar-hl\">that collectivists limit</span> themselves</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">암시적이고 심지어 모호한 어휘 사용으로</span><span class=\"en\"><b>to implicit and even ambiguous use of words,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">표현을 쓰면서</span><span class=\"en\"><b><span class=\"grammar-hl\">using terms</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘어쩌면’, ‘아마도’, 혹은 ‘그럴지도’와 같은</span><span class=\"en\"><b><span class=\"grammar-hl\">like maybe, perhaps, or probably</span>.</b></span></div></div><div class=\"lec-sent-ko\">(B) 대조적으로, 상호 의존과 화합이라는 문화적 전제는 집단주의자들이 ‘어쩌면(maybe)’, ‘아마도(perhaps)’, 혹은 ‘그럴지도(probably)’와 같은 표현을 쓰면서 암시적이고 심지어 모호한 어휘 사용으로 스스로를 제한하도록 요구한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장과 정반대로 집단주의 문화의 특징을 설명하며 대비 효과를 높입니다. limit themselves to implicit and even ambiguous use of words — 글쓴이는 여기서 힘주어 말합니다. 표현력이 부족해서가 아니라, 남들과의 관계가 상할까 봐 의도적으로 자기주장을 낮추고 빙빙 둘러서 말하는 방식을 선택한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">require that collectivists limit 당위성 that절(가정법 현재): V(당위성) + that + S + 동사원형 구조이다. require(요구하다) 같은 당위성을 나타내는 동사의 목적어 that절이며, 주어(collectivists) 뒤에 should가 생략된 동사원형(limit)이 쓰인 구조다.</div><div class=\"lec-gr-item\">using terms like maybe, perhaps, or probably (분사구문): 현재분사 using이 이끄는 분사구문으로 동시동작 또는 부대상황을 나타낸다. 원래 절로 변환하면 &#39;while they use terms like maybe, perhaps, or probably&#39; 형태가 된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">implicit</td><td class=\"m\">암묵적인, 내포된, 은연중의</td></tr><tr><td class=\"w\">by contrast</td><td class=\"m\">대조적으로, 그에 반해</td></tr><tr><td class=\"w\">assumption</td><td class=\"m\">가정, 추정, 전제</td></tr><tr><td class=\"w\">interdependence</td><td class=\"m\">상호 의존, 상호 의존성</td></tr><tr><td class=\"w\">ambiguous</td><td class=\"m\">모호한, 애매한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">영어는 전 세계에서 유일한 언어이다</span><span class=\"en\"><b>The English language is the only language in the world</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘I’를 표기하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that spells I</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대문자로</span><span class=\"en\"><b>with a capital letter.</b></span></div></div><div class=\"lec-sent-ko\">영어는 전 세계에서 ‘I’를 대문자로 표기하는 유일한 언어이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 지금까지의 일반적인 설명을 실제 언어인 &#39;영어&#39;의 특징에 적용하여 새로운 예시를 시작합니다. spells I with a capital letter는 문장 중간에 나오는 소문자 &#39;나(I)&#39;를 항상 대문자로 크게 쓰는 영어의 표기법을 짚어주며 개인주의 문화의 단면을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that spells I (관계대명사): that은 주격 관계대명사로 선행사 the only language in the world를 수식하며, 절 내부에서 주어 역할을 한다. 선행사에 the only가 포함되어 있어 주로 that을 사용한다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 현상은 사실을 반영하는 것일 수도 있다</span><span class=\"en\"><b>This phenomenon may reflect <span class=\"grammar-hl\">the fact</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개인주의의 뿌리가</span><span class=\"en\"><b><span class=\"grammar-hl\">that the roots of individualism</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">잉글랜드에 있다는</span><span class=\"en\"><b><span class=\"grammar-hl\">are in England</span>.</b></span></div></div><div class=\"lec-sent-ko\">(A) 이러한 현상은 개인주의의 뿌리가 잉글랜드에 있다는 사실을 반영하는 것일 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 영어가 &#39;I&#39;를 대문자로 쓰는 이유를 역사적, 문화적 배경과 연결합니다. roots of individualism은 &#39;개인주의의 뿌리&#39;, 곧 나 자신을 가장 중요하게 여기는 문화적 배경이 영어라는 언어의 표기 방식에 그대로 새겨져 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">the fact that the roots of individualism are in England 동격의 that: 명사(the fact) + that + S + V 구조이다. that절이 앞 명사 the fact의 내용을 구체화하고 설명(…라는 사실)하는 동격절을 이끈다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">phenomenon</td><td class=\"m\">현상, 사건</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일본어 표현은 존재하지 않는다</span><span class=\"en\"><b><span class=\"grammar-hl\">There is no Japanese equivalent</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">영어의 ‘I’에 상응하는</span><span class=\"en\"><b>for the English I.</b></span></div></div><div class=\"lec-sent-ko\">영어의 ‘I’에 상응하는 일본어 표현은 존재하지 않는다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 영어를 쓰는 문화권과 뚜렷하게 대비되는 집단주의 문화권의 예시로 일본어를 끌어와 앞선 주장을 더욱 강화합니다. equivalent for the English I는 어떤 상황에서나 똑같이 &#39;나&#39;를 가리키는 고정된 단어가 일본어에는 존재하지 않는다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">There is no Japanese equivalent (도치): 장소/방향을 나타내는 유도부사 There가 문장 맨 앞에 오면서 동사(is) + 주어(no Japanese equivalent)의 순서로 도치가 발생한 1형식 구조이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">equivalent</td><td class=\"m\">동등한 것, 상응하는 것, 등가물</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">각기 다른 단어들이 사용된다</span><span class=\"en\"><b>Different words <span class=\"grammar-hl\">are used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신을 지칭하는 데</span><span class=\"en\"><b><span class=\"grammar-hl\">to refer</span> to the self,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사회적 상황, 화자의 성별과 나이에 따라</span><span class=\"en\"><b><span class=\"grammar-hl\">depending on</span> the social situation, the speaker's gender, age,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 여타의 사회적 속성들에</span><span class=\"en\"><b>and the other social attributes</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">청자에 대한</span><span class=\"en\"><b>relative to the listener.</b></span></div></div><div class=\"lec-sent-ko\">사회적 상황, 화자의 성별과 나이, 그리고 청자에 대한 여타의 사회적 속성들에 따라 각기 다른 단어들이 자신을 지칭하는 데 사용된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 일본어에 고정된 &#39;I&#39;가 없는 이유를 구체적으로 풀어냅니다. relative to the listener는 단순히 내 나이나 성별이 중요한 것이 아니라, 내 앞에 있는 상대방이 누구냐에 따라 나와의 관계를 계산하여 나를 낮추거나 높이는 대명사를 수시로 바꿔 써야 하는 집단주의 문화의 모습을 나타냅니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are used (수동태): be동사(are) + p.p.(used) 구조. use는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are used 형태로 쓴다. 기본구조: use + O(목적어) + toV (O를 ~하기 위해 사용하다).</div><div class=\"lec-gr-item\">to refer (to부정사): 수동태 동사구(are used) 뒤에 목적(~하기 위해)을 나타내는 부사적 용법으로 쓰였다.</div><div class=\"lec-gr-item\">depending on (관용표현): 분사 형태에서 굳어진 전치사적 관용표현으로 &#39;~에 따라&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">refer to</td><td class=\"m\">~을 가리키다, ~을 언급하다</td></tr><tr><td class=\"w\">relative to</td><td class=\"m\">~와 관련된, ~에 비하여</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>언어는 단순한 규칙의 집합이 아니라 그 사회의 문화가 반영된 의사소통 방식이다.</li><li>개인주의 문화권(예: 영어권)은 화자 자신을 중시하여 직접적이고 단호한 표현을 쓰며, &#39;나(I)&#39;를 항상 대문자로 쓴다.</li><li>집단주의 문화권(예: 일본어권)은 관계와 조화를 중시하여 모호하고 간접적인 표현을 쓰며, 상대방과의 관계에 따라 자신을 지칭하는 단어가 계속 바뀐다.</li><li>결국 우리가 언어를 배운다는 것은 그 언어에 깃든 문화적 상호작용의 방식을 습득하는 과정이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Language acts as a direct manifestation of culture, so people develop different communication styles depending on their cultural backgrounds.</div>\n              <div class=\"lec-final-sum-ko\">언어는 문화의 직접적인 발현 역할을 하므로, 사람들은 문화적 배경에 따라 각기 다른 의사소통 방식을 발달시킨다.</div></div></div>"],"segs":[[{"audio":"./37_audio/1.mp3","hl":null}],[{"audio":"./37_audio/2.mp3","hl":null}],[{"audio":"./37_audio/3.mp3","hl":null},{"audio":"./37_audio/4.mp3","hl":"stage-0"},{"audio":"./37_audio/5.mp3","hl":"stage-1"},{"audio":"./37_audio/6.mp3","hl":"stage-2"},{"audio":"./37_audio/7.mp3","hl":"stage-3"}],[{"audio":"./37_audio/8.mp3","hl":null}],[{"audio":"./37_audio/9.mp3","hl":"main"},{"audio":"./37_audio/10.mp3","hl":"meaning"},{"audio":"./37_audio/11.mp3","hl":"grammar"}],[{"audio":"./37_audio/12.mp3","hl":"main"},{"audio":"./37_audio/13.mp3","hl":"meaning"},{"audio":"./37_audio/14.mp3","hl":"grammar"}],[{"audio":"./37_audio/15.mp3","hl":"main"},{"audio":"./37_audio/16.mp3","hl":"meaning"},{"audio":"./37_audio/17.mp3","hl":"grammar"}],[{"audio":"./37_audio/18.mp3","hl":"main"},{"audio":"./37_audio/19.mp3","hl":"meaning"},{"audio":"./37_audio/20.mp3","hl":"grammar"}],[{"audio":"./37_audio/21.mp3","hl":"main"},{"audio":"./37_audio/22.mp3","hl":"meaning"},{"audio":"./37_audio/23.mp3","hl":"grammar"}],[{"audio":"./37_audio/24.mp3","hl":"main"},{"audio":"./37_audio/25.mp3","hl":"meaning"},{"audio":"./37_audio/26.mp3","hl":"grammar"}],[{"audio":"./37_audio/27.mp3","hl":"main"},{"audio":"./37_audio/28.mp3","hl":"meaning"},{"audio":"./37_audio/29.mp3","hl":"grammar"}],[{"audio":"./37_audio/30.mp3","hl":"main"},{"audio":"./37_audio/31.mp3","hl":"meaning"},{"audio":"./37_audio/32.mp3","hl":"grammar"}],[{"audio":"./37_audio/33.mp3","hl":"main"},{"audio":"./37_audio/34.mp3","hl":"meaning"},{"audio":"./37_audio/35.mp3","hl":"grammar"}],[{"audio":"./37_audio/36.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnimationFrame(step);};requestAnimationFrame(step);}catch(_){try{el.scrollIntoView({block:"start"});}catch(__){}}}function applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
