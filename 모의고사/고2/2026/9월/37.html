lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 37번","audioDir":"37_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">37번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Scientific Explanations as Creative Frameworks, Not Mere Facts\u003c/h1>\u003ch2>과학적 설명: 단순한 사실이 아닌 창의적 틀\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>과학적 설명은 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>가 담긴 \u003cb class=\"key\">틀\u003c/b>을 구축하는 작업이며, 이를 단순한 \u003cb class=\"key\">사실\u003c/b>로 간주하면 모델의 한계를 놓칠 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Scientific explanations are creative constructions, not mere chronologies of facts, and ignoring their imaginative contributions can blind us to a model's limitations.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 과학적 설명의 성격에 관한 글입니다. 이 글은 과학을 단순한 사실 나열로 보는 통념을 반박하고, 과학적 설명에 창의적 요소가 담겨 있음을 강조합니다. 핵심은 scientific explanations가 creative elements와 framework를 통해 구성된다는 점이고, 요지는 Scientific explanations are creative constructions, not mere chronologies of facts, and ignoring their imaginative contributions can blind us to a model's limitations입니다. 그럼 시작해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">많은 학생이 과학을 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>에 엄밀히 충실한 객관적 지식의 영역이라고 생각합니다. 그러나 과학철학에서는 과학적 설명이 \u003cb class=\"key\">패러다임\u003c/b>(paradigm)과 \u003cb class=\"key\">틀\u003c/b>(framework)에 따라 체계적으로 선택된 데이터를 해석하는 작업임을 강조합니다. 빛을 입자로 보는 모델과 파동으로 보는 모델은 같은 실험 데이터도 서로 다른 줄거리로 엮습니다. 이는 마치 같은 장면도 어떤 카메라 렌즈를 쓰느냐에 따라 다르게 찍히는 것과 비슷합니다. 따라서 과학적 상상과 모델의 한계를 함께 살피는 태도가 필요합니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 과학 하면 흔히 객관적 데이터와 실험이 떠오르죠. 그런데 과학철학에서는 과학적 설명이 paradigm과 framework에 따라 데이터를 해석하는 작업임을 강조합니다. 예를 들어 빛을 입자로 보는 model과 파동으로 보는 model은 같은 실험 데이터도 서로 다른 storyline으로 엮어 냅니다. 이는 마치 같은 장면도 어떤 카메라 렌즈를 쓰느냐에 따라 다르게 찍히는 것과 비슷합니다. 따라서 scientific imagination과 model의 limitation을 함께 살펴야 한다는 점을 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>과학의 통념\u003csmall>통념 · 문장 1\u003c/small>\u003c/h4>\u003cp>과학 연구에서는 설명하는 이야기가 실험 데이터에 엄밀히 충실할 것으로 기대됩니다. 또 경험의 규칙적이고 예측 가능한 특징을 밝힐 것으로 여겨집니다. 이는 과학을 객관적 \u003cb class=\"key\">사실\u003c/b>의 영역으로 보는 \u003cb class=\"key\">통념\u003c/b>입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>창의성의 은폐\u003csmall>전환 · 문장 2\u003c/small>\u003c/h4>\u003cp>그러나 이러한 \u003cb class=\"key\">패러다임\u003c/b>은 때때로 이론들이 연구 프로젝트의 구성과 증거의 해석을 형성하는 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>로 철저히 채워져 있다는 사실을 감춥니다. 과학의 객관성 이면에 해석과 상상이 숨어 있다는 반전입니다. 따라서 과학을 단순한 데이터 축적으로 보는 시각은 수정이 필요합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>과학적 설명의 실제\u003csmall>주장 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>과학적 설명들은 단순히 사실들의 연대기를 말하는 것이 아닙니다. 그것들은 관찰된 것에 대한 일관적이고 의미 있는 설명을 제공하기 위해 체계적으로 선택된 데이터에 대한 \u003cb class=\"key\">틀\u003c/b>을 구축합니다. 그러한 구성들은 우리가 특정한 유형의 관계에서 구체적인 종류의 주제를 상상하도록 하며, 그 \u003cb class=\"key\">줄거리\u003c/b>는 어떤 특징 분석에 더 효과적입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>창의성 무시의 위험\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>우리가 그러한 과학적 상상의 창의적 기여를 무시하고 모델과 해석적 설명을 단순한 사실, 훨씬 더 심하게는 현실을 전부 포괄하는 사실로 간주할 때가 문제입니다. 이렇게 되면 우리는 주어진 모델의 \u003cb class=\"key\">한계\u003c/b>에 눈멀게 됩니다. 잘못 적용되는 상황에서 오해할 가능성도 알아차리지 못하게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 단계별로 정리해 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 과학에 대한 기존 통념입니다. 과학 연구에서 설명하는 이야기는 실험 데이터에 엄밀히 충실해야 하고 경험의 규칙적이고 예측 가능한 특징을 밝혀야 한다고 기대되죠. 이렇게 과학을 객관적 사실의 영역으로 보는 시각이 먼저 제시됩니다.","hl":"f0"},{"n":5,"text":"그런데 두 번째 단계에서 However가 등장하며 전환이 일어납니다. 이러한 paradigm이 이론들이 연구 프로젝트의 구성과 증거의 해석을 형성하는 creative elements로 철저히 채워져 있다는 사실을 감춘다는 거예요. 과학의 객관성 이면에 해석과 상상이 숨어 있다는 반전입니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 과학적 설명의 실제 모습을 설명합니다. 과학적 설명은 단순히 사실들의 연대기를 말하는 것이 아니라, 체계적으로 선택된 데이터에 대한 framework를 구축합니다. 이러한 construction은 우리가 특정 관계 속에서 구체적인 주제를 상상하게 하고, 그 storyline은 어떤 특징을 분석하는 데 더 효과적입니다.","hl":"f2"},{"n":7,"text":"마지막 단계에서는 창의성을 무시할 때의 위험을 경고합니다. 과학적 imagination의 기여를 무시하고 model과 interpretive explanation을 현실 전부인 사실로 간주하면, 주어진 model의 limitation에 눈멀게 됩니다. 잘못 적용되는 상황에서 오해할 가능성도 알아차리지 못하게 되죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장은 과학적 설명이 실험 데이터에 충실하다는 \u003cb class=\"key\">통념\u003c/b>을 제시합니다. 그러나 두 번째 문장에서 However로 반박하며 이론에 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>가 깊이 담겨 있음을 저자의 주장으로 내세웁니다. 이후 문장들은 과학적 설명이 \u003cb class=\"key\">틀\u003c/b>과 줄거리를 구축한다는 근거를 제시하고, 마지막 문장은 이를 무시할 때의 위험을 경고합니다. 따라서 주제문이 앞부분에 있는 두괄식 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (2)\u003c/b>\u003cspan>통념에서 반박으로 전환\u003c/span>\u003cb>do not just (3)\u003c/b>\u003cspan>단순 사실 연대기 부정을 통한 강조\u003c/span>\u003cb>Such constructions (5)\u003c/b>\u003cspan>앞 문장의 틀 구축을 재진술\u003c/span>\u003cb>When we neglect (6)\u003c/b>\u003cspan>조건을 통한 경고\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">explanatory tales\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">scientific explanations\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">frameworks\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">constructions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">models and interpretive explanations\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>과학에 대한 기존 통념: 데이터 충실·사실 나열\u003c/th>\u003cth>실제 과학적 설명: 창의적 틀·상상의 구성\u003c/th>\u003c/tr>\u003ctr>\u003ctd>실험 데이터에 엄밀히 충실\u003c/td>\u003ctd>체계적으로 선택된 데이터에 틀 구축\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사실들의 연대기\u003c/td>\u003ctd>일관적이고 의미 있는 설명\u003c/td>\u003c/tr>\u003ctr>\u003ctd>모델을 현실 전부로 간주\u003c/td>\u003ctd>창의적 기여와 한계 인식\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 통념 반박 구조로 전개됩니다. 처음에 과학을 데이터 중심으로 보는 통념을 제시하고, However로 반박하며 창의적 요소를 주장하죠. 주제문은 두 번째 문장에 있으므로 두괄식 구조라고 볼 수 있습니다. 글의 앞부분에서 저자의 핵심 주장이 나오고 뒤에서 근거와 경고가 이어집니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 However가 통념에서 반박으로 전환하는 역할을 합니다. do not just는 과학적 설명이 단순 사실 나열이 아님을 강조하고, Such constructions는 앞에서 말한 framework를 다시 가리키며 논지를 잇습니다. When we neglect는 조건을 나타내며 마지막 경고로 이끄는 신호입니다. 또한 explanatory tales가 scientific explanations, frameworks, constructions, models and interpretive explanations로 재진술되는 흐름도 짚어 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>scientific research\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학 연구\u003c/span>\u003c/div>\u003cdiv>\u003cb>explanatory tales\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설명하는 이야기\u003c/span>\u003c/div>\u003cdiv>\u003cb>be expected to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 것으로 기대되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>adhere to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 충실하다, 고수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experimental data\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실험 데이터\u003c/span>\u003c/div>\u003cdiv>\u003cb>illuminate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>밝히다, 조명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>predictable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>예측 가능한\u003c/span>\u003c/div>\u003cdiv 3c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실험 데이터에 엄밀히 충실할 것으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">adhere \u003c/span>\u003cspan class=\"tgt\">closely \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">experimental \u003c/span>\u003cspan class=\"tgt\">data \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 경험의 규칙적이고 예측 가능한 특징들을 밝힐 것으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">illuminate \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">regular \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">predictable \u003c/span>\u003cspan class=\"tgt\">features \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">experience\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">과학 연구에 관해서는, 설명하는 이야기들이 실험의 데이터에 엄밀히 충실할 것으로 기대되고 경험의 규칙적이고 예측 가능한 특징들을 밝힐 것으로 기대된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과학 연구에서 \u003cb class=\"key\">설명적 \u003c/b>\u003cb class=\"key\">이야기\u003c/b>는 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>에 엄밀히 충실하고 경험의 \u003cb class=\"key\">규칙적이고 \u003c/b>\u003cb class=\"key\">예측 \u003c/b>\u003cb class=\"key\">가능한 \u003c/b>\u003cb class=\"key\">특징\u003c/b>을 밝혀야 한다는 전통적 기대를 제시합니다. 이 문장은 뒤에 나올 창의적 요소 논의와 대비되는 출발점이에요. explanatory tales는 과학적 설명을 이야기 형식으로 본 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태의 관용적 표현 (be concerned)\u003c/span> : Where + S + is concerned : \"과학 연구에 관해서는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 + to부정사\u003c/span> : be expected to + 동사원형 : \"~할 것으로 기대되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 병렬 구조\u003c/span> : to A and to B : \"실험 데이터에 충실하고 경험의 특징을 밝히는 것\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Where scientific research is concerned, 과학 연구에 관해서는. explanatory tales are expected, 설명하는 이야기들은 기대된다. to adhere closely to experimental data, 실험 데이터에 엄밀히 충실할 것으로. and to illuminate the regular and predictable features of experience, 그리고 경험의 규칙적이고 예측 가능한 특징들을 밝힐 것으로. 이 문장 전체를 해석하면, 과학 연구에 관해서는, 설명하는 이야기들이 실험의 데이터에 엄밀히 충실할 것으로 기대되고 경험의 규칙적이고 예측 가능한 특징들을 밝힐 것으로 기대된다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 과학 연구에서 설명적인 이야기가 실험 데이터에 철저히 붙어 있어야 하고, 경험에서 규칙적이고 예측 가능한 면을 밝혀야 한다는 전통적인 기대를 정리해 줍니다. 이건 나중에 나올 창의적 요소와 대비되는 출발점이에요. explanatory tales는 과학적 설명을 이야기 형식으로 나타낸 표현입니다.","hl":"mn"},{"n":14,"text":"첫 번째, Where scientific research is concerned에서 be concerned는 어떤 일이 주어와 관련되어 있다는 뜻의 관용적 수동태 표현입니다. 두 번째, are expected to adhere는 be expected to 부정사 구조로 어떤 행동을 할 것으로 기대된다는 뜻이에요. 세 번째, to adhere와 and to illuminate가 이어지면서 to부정사가 병렬로 연결되어 기대되는 두 가지 내용을 나란히 보여 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 패러다임은 때때로 그 사실을 감춘다\u003c/span>\u003cspan class=\"en\">this paradigm sometimes conceals \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fact \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이론들이 철저히 채워져 있다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">theories \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">deeply \u003c/span>\u003cspan class=\"tgt\">loaded \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창의적인 요소들로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">creative \u003c/span>\u003cspan class=\"tgt\">elements\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연구 프로젝트의 구성을 형성하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">shape \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">construction \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">research \u003c/span>\u003cspan class=\"tgt\">projects \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 증거의 해석을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">interpretations \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">evidence\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나, 이러한 패러다임은 때때로 이론들이 연구 프로젝트의 구성과 증거의 해석을 형성하는 창의적인 요소들로 철저히 채워져 있다는 사실을 감춘다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 전통적 기대와 달리, 이러한 패러다임이 이론 속 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>를 감춘다고 말합니다. 이론은 단순한 데이터 반영이 아니라 연구 프로젝트의 구성과 증거의 해석을 \u003cb class=\"key\">형성하는\u003c/b> 창의성을 지니고 있죠. the fact that은 뒤에 오는 that절이 fact의 내용을 설명하는 \u003cb class=\"key\">동격\u003c/b> 구조입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격 that절\u003c/span> : the fact + that + 완전한 문장 : \"이론들이 창의적 요소들로 철저히 채워져 있다는 사실\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (be loaded with)\u003c/span> : be loaded with + 명사 : \"~로 철저히 채워져 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사(creative elements) + that + 동사(shape) : \"연구 프로젝트의 구성과 증거의 해석을 형성하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">명사구 병렬\u003c/span> : A and B : \"연구 프로젝트의 구성과 증거의 해석\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"However, 그러나. this paradigm sometimes conceals the fact, 이러한 패러다임은 때때로 그 사실을 감춘다. that theories are deeply loaded, 이론들이 철저히 채워져 있다는. with creative elements, 창의적인 요소들로. that shape the construction of research projects, 연구 프로젝트의 구성을 형성하는. and the interpretations of evidence, 그리고 증거의 해석을. 이 문장 전체를 해석하면, 그러나, 이러한 패러다임은 때때로 이론들이 연구 프로젝트의 구성과 증거의 해석을 형성하는 창의적인 요소들로 철저히 채워져 있다는 사실을 감춘다.","hl":"m"},{"n":16,"text":"두 번째 문장은 그러나 이런 패러다임이 이론에 창의적인 요소가 가득 들어 있다는 사실을 감추기도 한다고 말합니다. 이 창의적 요소는 연구 프로젝트를 어떻게 구성하고 증거를 어떻게 해석할지를 형성하죠. 결국 이론은 단순히 데이터를 반영한 결과물이 아니라 창의성의 산물이라는 뜻이에요.","hl":"mn"},{"n":17,"text":"첫 번째로, the fact that 이하는 fact가 어떤 사실인지 설명하는 동격 that절입니다. 두 번째로, are deeply loaded with는 be loaded with 구조로 무엇으로 가득 차 있다는 뜻의 수동태 표현이에요. 세 번째로, that shape는 앞에 나온 creative elements를 선행사로 받는 주격 관계대명사 that입니다. 네 번째로, the construction of research projects와 the interpretations of evidence가 and로 병렬 연결되어 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학적 설명들은\u003c/span>\u003cspan class=\"en\">Scientific explanations\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 말하는 것은 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">relate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실들의 연대기를\u003c/span>\u003cspan class=\"en\">a chronology of facts.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">과학적 설명들은 단순히 사실들의 연대기를 말하는 것은 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과학적 설명이 단순한 사실 나열이 아니라 더 많은 역할을 한다는 점을 분명히 합니다. 앞 문장의 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">요소\u003c/b> 논의를 위한 \u003cb class=\"key\">전제\u003c/b>로, 과학 설명은 사실의 시간순 나열만 하지 않는다는 뜻입니다. a chronology of facts는 사실을 시간 순서대로 늘어놓은 \u003cb class=\"key\">연대기\u003c/b>를 의미합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부분 부정\u003c/span> : do not just + 동사원형 : \"단지 ~하는 것은 아니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Scientific explanations, 과학적 설명들은. do not just relate, 단지 말하는 것은 아니다. a chronology of facts, 사실들의 연대기를. 이 문장 전체를 해석하면, 과학적 설명들은 단순히 사실들의 연대기를 말하는 것은 아니다.","hl":"m"},{"n":19,"text":"세 번째 문장은 과학적 설명이 사실의 연대기를 단순히 나열하는 것이 아니라고 말합니다. 이 뒤로는 설명이 체계적으로 자료를 구성하고 해석의 틀을 만든다는 내용이 이어지죠. 여기서 a chronology of facts는 사실들을 시간 순서대로 늘어놓은 목록을 뜻해요.","hl":"mn"},{"n":20,"text":"do not just relate에서 not just는 부분 부정 표현으로, 단지 어떤 동작만 하는 것은 아니라는 뉘앙스를 줍니다. 직역하면 단지 사실들의 연대기를 말하는 것은 아니다가 되고, 그 이상의 설명 기능이 있다는 의미를 함축해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 틀을 구축한다\u003c/span>\u003cspan class=\"en\">They construct frameworks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">체계적으로 선택된 데이터에 대한\u003c/span>\u003cspan class=\"en\">for \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">systematically \u003c/span>\u003cspan class=\"tgt\">chosen \u003c/span>\u003cspan class=\"tgt\">data\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제공하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">provide\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일관적이고 의미 있는 설명을\u003c/span>\u003cspan class=\"en\">a consistent and meaningful explanation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관찰된 것에 대한\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">observed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 관찰된 것에 대한 일관적이고 의미 있는 설명을 제공하기 위해 체계적으로 선택된 데이터에 대한 틀을 구축한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과학적 설명이 단순한 사실 나열이 아니라, 관찰된 것에 \u003cb class=\"key\">일관된\u003c/b> 설명을 제공하기 위해 체계적으로 선택된 \u003cb class=\"key\">데이터\u003c/b>로 \u003cb class=\"key\">틀\u003c/b>을 구축한다는 것을 말합니다. 앞 문장과 대비되며 과학적 설명의 구성적 성격을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 수식\u003c/span> : [systematically chosen (과거분사구)] data : \"체계적으로 선택된 데이터\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : in order to + provide (동사원형) : \"제공하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">선행사 포함 관계대명사 what\u003c/span> : what is observed = the thing which is observed : \"관찰된 것\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"They construct frameworks, 그것들은 틀을 구축한다. for systematically chosen data, 체계적으로 선택된 데이터에 대한. in order to provide, 제공하기 위해. a consistent and meaningful explanation, 일관적이고 의미 있는 설명을. of what is observed, 관찰된 것에 대한. 이 문장 전체를 해석하면, 그것들은 관찰된 것에 대한 일관적이고 의미 있는 설명을 제공하기 위해 체계적으로 선택된 데이터에 대한 틀을 구축한다.","hl":"m"},{"n":22,"text":"이 문장은 과학적 설명이 단순한 사실 나열이 아니라, 관찰된 것에 일관적이고 의미 있는 설명을 주기 위해 데이터를 체계적으로 골라서 틀을 만든다는 점을 말합니다. 앞 문장과 연결해서 보면 과학적 설명의 구성적 성격이 드러나죠.","hl":"mn"},{"n":23,"text":"어법 포인트를 짚어 볼게요. 첫 번째, systematically chosen data에서 chosen은 과거분사이고 data를 수식합니다. data가 선택되는 수동 관계이기 때문에 과거분사 chosen을 쓴 거예요. 두 번째, in order to provide는 목적을 나타내는 to부정사의 부사적 용법이에요. 틀을 구축하는 목적이 제공하기 위함이라는 뜻을 줍니다. 세 번째, of what is observed에서 what은 선행사를 포함한 관계대명사로 the thing which is observed, 즉 관찰된 것이라는 의미를 만들어요. observed는 수동태 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 구성들은 우리를 이끈다\u003c/span>\u003cspan class=\"en\">Such constructions \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lead \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">구체적인 종류의 주제를 상상하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">imagine\u003c/span> specific kinds of subject matter\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정한 유형의 관계에서\u003c/span>\u003cspan class=\"en\">in particular sorts of relations,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들이 고취하는 줄거리는\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">storylines \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">inspire\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 효과적일 것으로 판명될 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">prove \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">effective\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경험의 일부 특징을 분석하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">analyzing\u003c/span> some features of experience\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 것들보다\u003c/span>\u003cspan class=\"en\">over others.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러한 구성들은 우리가 특정한 유형의 관계에서 구체적인 종류의 주제를 상상하도록 하며, 그것들이 고취하는 줄거리는 다른 것들보다 경험의 일부 특징을 분석하는 데 더 효과적일 것으로 판명될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 과학적 설명이 만든 \u003cb class=\"key\">틀\u003c/b>이 우리의 \u003cb class=\"key\">상상\u003c/b>을 특정한 방식으로 이끌고, 그 이야기 구조가 어떤 경험에는 더 잘 맞고 어떤 경험에는 덜 맞음을 보여 줍니다. 즉, 과학적 설명은 모든 현상에 동일하게 적용되는 중립적 사실이 아니라 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">설명력\u003c/b>을 지닌다는 것입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 동사 lead + 목적어 + to부정사\u003c/span> : lead + us (목적어) + to imagine (to부정사구) : \"우리가 상상하도록 이끈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : the storylines [(which/that) they inspire] : \"그것들이 고취하는 줄거리\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">2형식 동사 prove + 주격 보어\u003c/span> : prove + more effective (형용사구) : \"더 효과적일 것으로 판명될 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사 for의 목적어로 쓰인 동명사\u003c/span> : for + analyzing (동명사구) : \"분석하는 데\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Such constructions lead us, 그러한 구성들은 우리를 이끈다. to imagine specific kinds of subject matter, 구체적인 종류의 주제를 상상하도록. in particular sorts of relations, 특정한 유형의 관계에서. and the storylines they inspire, 그리고 그것들이 고취하는 줄거리는. will prove more effective, 더 효과적일 것으로 판명될 것이다. for analyzing some features of experience, 경험의 일부 특징을 분석하는 데. over others, 다른 것들보다. 이 문장 전체를 해석하면, 그러한 구성들은 우리가 특정한 유형의 관계에서 구체적인 종류의 주제를 상상하도록 하며, 그것들이 고취하는 줄거리는 다른 것들보다 경험의 일부 특징을 분석하는 데 더 효과적일 것으로 판명될 것이다.","hl":"m"},{"n":25,"text":"이 문장은 과학적 설명이 만든 틀이 우리의 상상 방향을 특정한 관계와 주제로 이끌고, 그 이야기 구조가 어떤 경험에는 더 잘 맞고 어떤 경험에는 덜 맞는다는 점을 말합니다. 과학적 설명은 모든 현상에 똑같이 적용되는 중립적 사실이 아니라 선택적 설명력을 지닌다는 뜻이에요.","hl":"mn"},{"n":26,"text":"첫 번째 어법은 lead us to imagine입니다. lead는 목적어 us와 to부정사 imagine을 함께 취해서 우리가 상상하도록 이끈다는 의미를 만들죠. 두 번째, the storylines they inspire에서 they inspire는 관계대명사절인데, inspire의 목적어 자리에 관계대명사가 생략되어 있어요. the storylines which they inspire 또는 the storylines that they inspire에서 which나 that이 빠진 형태입니다. 세 번째, will prove more effective에서 prove는 뒤에 형용사 보어를 취해서 임이 판명되다라는 의미를 나타냅니다. more effective가 주격 보어 역할을 하죠. 네 번째, for analyzing은 전치사 for의 목적어로 동명사 analyzing이 쓰인 거예요. 전치사 뒤에는 동사 원형이 올 수 없기 때문에 동명사로 바꾼 겁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 그러한 과학적 상상의 창의적 기여를 무시하고\u003c/span>\u003cspan class=\"en\">When we neglect the creative contributions of such scientific imagination\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모델과 해석적 설명을 단순한 사실로 간주할 때\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">treat \u003c/span>\u003cspan class=\"tgt\">models \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">interpretive \u003c/span>\u003cspan class=\"tgt\">explanations \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">straightforward \u003c/span>\u003cspan class=\"tgt\">facts\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 심하게는 현실을 전부 포괄하는 사실로\u003c/span>\u003cspan class=\"en\">— even worse, as facts including all of reality —\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 주어진 모델의 한계에 대해 우리 스스로를 눈멀게 하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">blind \u003c/span>\u003cspan class=\"tgt\">ourselves \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">limitations \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">given \u003c/span>\u003cspan class=\"tgt\">model\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것이 상황을 오해할 가능성을 알아차리지 못할 수 있다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">fail \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">note \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">potential\u003c/span> for misunderstanding a situation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 잘못 적용되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">ill \u003c/span>\u003cspan class=\"tgt\">applies\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 그러한 과학적 상상의 창의적 기여를 무시하고 모델과 해석적 설명을 단순한 사실, 훨씬 더 심하게는 현실을 전부 포괄하는 사실로 간주할 때, 우리는 주어진 모델의 한계에 대해 우리 스스로를 눈멀게 하며 그것이 잘못 적용되는 상황에 대해 오해할 가능성을 알아차리지 못할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 과학적 모델이 지닌 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">기여\u003c/b>를 무시하고 그것을 현실 전부인 것처럼 여기면, 그 모델의 \u003cb class=\"key\">한계\u003c/b>와 \u003cb class=\"key\">잘못된 \u003c/b>\u003cb class=\"key\">적용\u003c/b> 가능성을 보지 못하게 된다고 경고합니다. 글 전체의 논지를 마무리하는 핵심 문장으로, 과학적 설명을 사실로 착각하는 태도의 위험성을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">treat A as B 구문\u003c/span> : treat + models and interpretive explanations (A) + as + straightforward facts (B) : \"모델과 해석적 설명을 단순한 사실로 간주하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형, 재귀대명사 목적어\u003c/span> : can + blind (동사원형) + ourselves (재귀대명사) : \"우리는 주어진 모델의 한계에 대해 스스로를 눈멀게 할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">fail + to부정사 (목적어 역할)\u003c/span> : fail + to note (to부정사구) : \"가능성을 알아차리지 못하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사+관계대명사\u003c/span> : a situation + to which it ill applies : \"그것이 잘못 적용되는 상황\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"When we neglect the creative contributions of such scientific imagination, 우리가 그러한 과학적 상상의 창의적 기여를 무시하고. and treat models and interpretive explanations as straightforward facts, 모델과 해석적 설명을 단순한 사실로 간주할 때. — even worse, as facts including all of reality —, 훨씬 더 심하게는 현실을 전부 포괄하는 사실로. we can blind ourselves to the limitations of a given model, 우리는 주어진 모델의 한계에 대해 우리 스스로를 눈멀게 하며. and fail to note its potential for misunderstanding a situation, 그리고 그것이 상황을 오해할 가능성을 알아차리지 못할 수 있다. to which it ill applies, 그것이 잘못 적용되는. 이 문장 전체를 해석하면, 우리가 그러한 과학적 상상의 창의적 기여를 무시하고 모델과 해석적 설명을 단순한 사실, 훨씬 더 심하게는 현실을 전부 포괄하는 사실로 간주할 때, 우리는 주어진 모델의 한계에 대해 우리 스스로를 눈멀게 하며 그것이 잘못 적용되는 상황에 대해 오해할 가능성을 알아차리지 못할 수 있다.","hl":"m"},{"n":28,"text":"이 문장은 과학적 모델이 지닌 창의적 기여를 무시하고 그것을 현실 전부인 것처럼 여기면, 그 모델의 한계와 잘못된 적용 가능성을 보지 못하게 된다고 경고합니다. 글 전체의 논지를 마무리하는 핵심 문장으로, 과학적 설명을 사실로 착각하는 태도의 위험성을 강조합니다.","hl":"mn"},{"n":29,"text":"첫 번째 어법은 treat A as B 구문입니다. treat models and interpretive explanations as straightforward facts에서 treat가 목적어와 as 이하를 함께 취해서 A를 B로 간주하다라는 의미를 만들죠. 두 번째, we can blind ourselves to the limitations of a given model에서 조동사 can 뒤에는 동사원형 blind가 왔고, 주어와 같은 대상을 가리키는 재귀대명사 ourselves가 목적어로 쓰였어요. blind oneself to something이라는 표현은 어떤 것을 보지 못하게 되다, 눈멀게 되다라는 의미입니다. 세 번째, fail to note its potential에서 fail은 to부정사를 목적어로 취해서 알아차리지 못하다라는 의미를 만들어요. 네 번째, to which it ill applies는 전치사 to가 관계대명사 which 앞으로 이동한 구조입니다. apply to something에서 to가 앞으로 나온 형태이고, 선행사 a situation을 수식해요. ill은 부적절하게라는 뜻으로 apply를 꾸며줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>과학 연구에서는 설명 이야기가 실험 데이터에 충실하고 경험의 규칙적 특징을 밝힐 것이라는 \u003cb class=\"key\">통념\u003c/b>이 있다.\u003c/li>\u003cli>그러나 이론은 연구 구성과 증거 해석을 형성하는 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>로 깊이 채워져 있다.\u003c/li>\u003cli>과학적 설명은 체계적으로 선택된 데이터에 \u003cb class=\"key\">틀\u003c/b>을 구축하여 일관적이고 의미 있는 설명을 제공한다.\u003c/li>\u003cli>과학적 상상의 기여를 무시하고 모델을 \u003cb class=\"key\">사실\u003c/b>로 간주하면 모델의 \u003cb class=\"key\">한계\u003c/b>에 눈멀 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Scientific explanations are creative constructions, not mere chronologies of facts, and ignoring their imaginative contributions can blind us to a model's limitations.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">과학적 설명은 \u003cb class=\"key\">창의적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>가 담긴 \u003cb class=\"key\">틀\u003c/b>을 구축하는 작업이며, 이를 단순한 \u003cb class=\"key\">사실\u003c/b>로 간주하면 모델의 한계를 놓칠 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 글을 정리하면, 과학적 설명은 단순한 사실 나열이 아니라 창의적 틀을 구축하는 작업입니다. 이러한 창의적 기여를 무시하면 모델의 한계에 눈멀 수 있다는 경고를 꼭 기억하세요. 시험에서 통념 반박 구조를 만나면 However 뒤의 주장을 잡고 마지막 경고까지 연결해서 읽는 연습을 해 보세요. 오늘 수고 많았습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
