</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 40번","audioDir":"401_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">40번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Self-Perception and the Motivation to Do Good\u003c/h1>\u003ch2>자기 인식과 선행 동기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>성인 뇌는 \u003cb class=\"key\">선하고 \u003c/b>\u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 지속하려는 \u003cb class=\"key\">선호\u003c/b>를 지니며, 자신을 \u003cb class=\"key\">선행\u003c/b>을 하는 사람으로 인식하면 더 큰 선을 행하게 된다. 연구에서 \u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">선행\u003c/b>을 회상한 집단이 더 많이 기부했지만, \u003cb class=\"key\">겉모습\u003c/b>에 신경 쓰는 사람은 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">자체\u003c/b>에 집중하는 사람보다 덜 관대했다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Perceiving ourselves as doers of good motivates greater generosity, but focusing on appearances undermines it.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 모의고사 지문 하나를 함께 볼게요. 이 글은 우리 뇌가 선하고 공정한 행동을 이어 가려는 성향을 지니고 있으며, 자신을 선한 사람으로 인식하는 것이 미래의 더 큰 선행으로 이어진다는 내용을 전합니다. 다만 겉모습에 신경 쓰면 오히려 관대함이 줄어든다는 실험 결과도 함께 나오죠. 그러면 본문을 자세히 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 자신의 행동을 관찰하며 태도를 형성하기도 하는데, 이를 사회심리학에서는 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">지각 \u003c/b>\u003cb class=\"key\">이론\u003c/b>(self-perception theory)이라고 해요. 예를 들어, 누가 시켜서가 아니라 스스로 \u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">일\u003c/b>을 했다고 느끼면 '나는 원래 \u003cb class=\"key\">선한 \u003c/b>\u003cb class=\"key\">사람\u003c/b>'이라는 정체성이 생기죠. 반대로 겉으로 드러나는 보상이나 \u003cb class=\"key\">평판\u003c/b>(reputation)에 신경 쓰면 \u003cb class=\"key\">외재적 \u003c/b>\u003cb class=\"key\">동기\u003c/b>(extrinsic motivation)가 강해져 \u003cb class=\"key\">내재적 \u003c/b>\u003cb class=\"key\">동기\u003c/b>(intrinsic motivation)가 약해질 수 있어요. 마치 칭찬 스티커를 받으려고 양보하는 아이보다 그냥 친구가 좋아서 양보하는 아이가 더 진심으로 친절한 것과 비슷하죠. 이 지문은 그런 심리적 기제가 \u003cb class=\"key\">기부 \u003c/b>\u003cb class=\"key\">행동\u003c/b>에서 어떻게 나타나는지 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 짚어 볼게요. 사람은 자기 자신의 행동을 보고 태도를 형성하기도 하는데, 이를 self-perception theory, 자기 지각 이론이라고 해요. 스스로 좋은 일을 했다고 느끼면 나는 원래 선한 사람이라는 정체성이 생기죠. 반대로 칭찬이나 평판처럼 겉으로 드러나는 보상에 신경 쓰면 extrinsic motivation, 외재적 동기가 강해져서 intrinsic motivation, 내재적 동기가 약해질 수 있어요. 마치 칭찬 스티커를 받으려고 양보하는 아이보다 그냥 친구가 좋아서 양보하는 아이가 더 진심으로 친절한 것과 비슷하죠. 이 지문은 그런 심리적 기제가 기부 행동에서 어떻게 나타나는지 보여 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>선호와 자기 인식\u003csmall>주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>먼저 성인 뇌가 \u003cb class=\"key\">선하고 \u003c/b>\u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 지속하려는 \u003cb class=\"key\">선호\u003c/b>를 지닌다고 제시한다. 이어서 자신을 \u003cb class=\"key\">선행\u003c/b>을 하는 사람으로 인식하고 그에 맞게 행동하는 것이 미래의 더 큰 선을 행하도록 동기를 부여한다는 주장이 나온다. 즉 자기 인식이 선행의 핵심 동력이라는 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>선행 회상의 효과\u003csmall>근거 · 문장 3\u003c/small>\u003c/h4>\u003cp>세 번째 문장에서 구체적 \u003cb class=\"key\">연구\u003c/b>가 제시된다. \u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">선행\u003c/b>을 적은 집단은 평균적으로 연구 수익의 절반 이상을 기부했다. 이는 \u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">악행\u003c/b>을 회상한 집단보다 거의 두 배 많은 금액으로, 선행 회상이 관대한 행동을 이끌었다는 근거가 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>겉모습 집중의 역효과\u003csmall>반례 · 문장 4\u003c/small>\u003c/h4>\u003cp>네 번째 문장에서는 타인의 반응까지 묘사한 사람들이 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">자체\u003c/b>에만 집중한 사람들보다 훨씬 적게 기부했다는 대조 근거가 추가된다. 이는 \u003cb class=\"key\">겉모습\u003c/b>에 신경 쓰는 것이 오히려 기부를 줄일 수 있음을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>순수한 동기의 힘\u003csmall>결론 · 문장 5\u003c/small>\u003c/h4>\u003cp>마지막 문장은 In other words로 앞 내용을 재진술한다. \u003cb class=\"key\">겉모습\u003c/b>에 신경 쓰는 사람은 \u003cb class=\"key\">선을 \u003c/b>\u003cb class=\"key\">그 \u003c/b>\u003cb class=\"key\">자체를 \u003c/b>\u003cb class=\"key\">위해 \u003c/b>\u003cb class=\"key\">행하는 \u003c/b>\u003cb class=\"key\">사람\u003c/b>보다 덜 관대하다는 결론을 내린다. 결국 \u003cb class=\"key\">순수한 \u003c/b>\u003cb class=\"key\">동기\u003c/b>가 더 큰 선행으로 이어진다는 메시지로 마무리된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 볼게요. 주장을 제시하고 연구 근거, 추가 대조 근거, 결론 순으로 전개됩니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 주장이 나옵니다. 성인의 뇌는 선하고 공정한 행동을 계속 이어 가려는 선호를 유지한다고 해요. 그리고 자신을 좋은 일을 하는 사람으로 인식하고 그에 맞게 행동하면 미래에 더 큰 선을 행하게 된다는 핵심 주장을 제시합니다. 여기서 self-perception, 자기 인식이 중요한 역할을 하죠.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 연구 근거가 나옵니다. 백 명의 대학생을 대상으로 한 유급 연구에서 과거 선행을 적은 집단은 평균적으로 연구 수익의 절반 이상을 기부했어요. 이는 이전의 나쁜 행위를 회상한 집단보다 거의 두 배나 많은 금액이었죠. 따라서 과거 선행을 떠올리는 것이 현재의 관대한 행동으로 이어졌다고 볼 수 있습니다.","hl":"f1"},{"n":6,"text":"네 번째 문장에서는 추가 대조 근거가 나옵니다. 자신이 친절했던 일뿐만 아니라 상대방의 반응까지 공들여 묘사한 사람들은 행동 자체에만 집중한 사람들보다 훨씬 적게 기부했어요. 즉 타인의 반응이나 겉모습에 신경 쓰는 것이 오히려 기부를 줄인다는 뜻이죠.","hl":"f2"},{"n":7,"text":"마지막 다섯 번째 문장에서는 결론을 내립니다. 겉모습, 예를 들어 선행의 영향력까지 신경 쓰는 사람은 선을 그 자체를 위해 행하는 사람보다 덜 관대하다는 거예요. 결국 순수한 동기가 더 큰 선행으로 이어진다는 메시지로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">주장-근거\u003c/b> 구조이며, 처음 두 문장에서 핵심 주장을 제시하고 뒤에서 연구와 대조 근거를 든다. 핵심 주장이 앞에 있으므로 \u003cb class=\"key\">두괄식\u003c/b>에 해당한다. 마지막 문장은 앞 내용을 \u003cb class=\"key\">재진술\u003c/b>하는 방식으로 마무리된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In one paid study (3)\u003c/b>\u003cspan>예시·근거 도입\u003c/span>\u003cb>In addition (4)\u003c/b>\u003cspan>추가 정보·대조 근거\u003c/span>\u003cb>In other words (5)\u003c/b>\u003cspan>재진술·요약\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">perpetuating good, fair behavior\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">doing good deeds\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">greater good\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">doing good for its own sake\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>겉모습에 신경 쓰는 사람\u003c/th>\u003cth>선행 자체에 집중하는 사람\u003c/th>\u003c/tr>\u003ctr>\u003ctd>타인의 반응까지 묘사\u003c/td>\u003ctd>행위 그 자체에만 초점\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기부액 훨씬 적음\u003c/td>\u003ctd>기부액 절반 이상\u003c/td>\u003c/tr>\u003ctr>\u003ctd>겉모습·영향력에 관심\u003c/td>\u003ctd>선을 그 자체를 위해 행함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거 구조로 전개되며 두괄식에 해당합니다. 처음 두 문장에서 핵심 주장을 제시하고, 세 번째와 네 번째 문장에서 연구와 대조 근거를 든 뒤, 마지막 문장에서 In other words로 재진술하며 마무리하죠. 따라서 처음에 제시된 자기 인식과 동기의 관계를 뒷받침하는 구조예요.","hl":"ty"},{"n":9,"text":"연결 신호어를 짚어 볼게요. 세 번째 문장의 In one paid study는 예시와 근거를 도입하고, 네 번째 문장의 In addition은 추가 대조 근거를 알려 줍니다. 마지막 문장의 In other words는 앞 내용을 더 쉬운 말로 재진술하는 신호예요. 이 신호어들을 따라가면 글의 논리적 흐름을 놓치지 않을 수 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>retain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>유지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>preference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선호\u003c/span>\u003c/div>\u003cdiv>\u003cb>perpetuate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영속시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fair\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>behavior\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>perceive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>good deeds\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>선행\u003c/span>\u003c/div>\u003cdiv>\u003cb>accordingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그에 맞춰\u003c/span>\u003c/div>\u003cdiv>\u003cb>motivate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동기를 부여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>greater good\u003c/b>\u003cem>명사\u003c/em>\u003cspan>더 큰 선\u003c/span>\u003c/div>\u003cdiv>\u003cb>paid\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>보수가 지급되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>subject\u003c/b>\u003cem>명사\u003c/em>\u003cspan>피실험자\u003c/span>\u003c/div>\u003cdiv>\u003cb>donate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기부하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>charity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자선 단체\u003c/span>\u003c/div>\u003cdiv>\u003cb>on average\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>평균적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>twice\u003c/b>\u003cem>부사\u003c/em>\u003cspan>두 배\u003c/span>\u003c/div>\u003cdiv>\u003cb>instruct\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recall\u003c/b>\u003cem>동사\u003c/em>\u003cspan>회상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>previous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이전의\u003c/span>\u003c/div>\u003cdiv>\u003cb>in addition\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>take pains\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>공들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>describe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묘사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>respond\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반응하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>likely\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>~할 가능성이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>significantly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>상당히\u003c/span>\u003c/div>\u003cdiv>\u003cb>purely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>순수하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>appearance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>겉모습\u003c/span>\u003c/div>\u003cdiv>\u003cb>impact\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영향\u003c/span>\u003c/div>\u003cdiv>\u003cb>generous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>for its own sake\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그 자체를 위해\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘도 정리해 볼게요. retain은 유지하다, preference는 선호, perceive는 인식하다, donate는 기부하다, generous는 관대한이라는 뜻이에요. 특히 take pains는 공들이다, for its own sake는 그 자체를 위해라는 뜻으로 문맥상 중요하죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">retain\u003c/b>\u003cspan class=\"m\">유지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">maintain\u003c/span>\u003cspan class=\"s\">keep\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discard\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">perceive\u003c/b>\u003cspan class=\"m\">인식하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"s\">discern\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">motivate\u003c/b>\u003cspan class=\"m\">동기를 부여하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inspire\u003c/span>\u003cspan class=\"s\">encourage\u003c/span>\u003cspan class=\"s\">drive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discourage\u003c/span>\u003cspan class=\"a\">deter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">donate\u003c/b>\u003cspan class=\"m\">기부하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">contribute\u003c/span>\u003cspan class=\"s\">give\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">generous\u003c/b>\u003cspan class=\"m\">관대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">charitable\u003c/span>\u003cspan class=\"s\">giving\u003c/span>\u003cspan class=\"s\">liberal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stingy\u003c/span>\u003cspan class=\"a\">selfish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">concerned\u003c/b>\u003cspan class=\"m\">신경 쓰는, 걱정하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">interested\u003c/span>\u003cspan class=\"s\">preoccupied\u003c/span>\u003cspan class=\"s\">attentive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">indifferent\u003c/span>\u003cspan class=\"a\">unconcerned\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 함께 외워 두면 좋아요. retain은 maintain, keep과 비슷하고 discard, lose와는 반대예요. motivate는 inspire, encourage와 비슷하고 discourage와 반대죠. generous는 charitable, giving과 비슷하고 stingy, selfish와는 반대입니다. 이렇게 묶어서 기억하면 어휘 문제에 빠르게 대응할 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 성인 뇌는 유지한다\u003c/span>\u003cspan class=\"en\">Our adult brains retain\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선호를\u003c/span>\u003cspan class=\"en\">a preference\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영속시키는 것에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">perpetuating \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선하고 공정한 행동을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">good, \u003c/span>\u003cspan class=\"tgt\">fair \u003c/span>\u003cspan class=\"tgt\">behavior\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 성인 뇌는 선하고 공정한 행동을 영속시키는 것에 대한 선호를 유지한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 지문의 첫 문장으로, 성인의 뇌가 \u003cb class=\"key\">선하고 \u003c/b>\u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 계속하려는 \u003cb class=\"key\">선호\u003c/b>를 지니고 있다는 핵심 주장을 제시한다. perpetuating은 좋은 행동을 일회성에 그치지 않고 \u003cb class=\"key\">지속\u003c/b>시키려는 성향을 뜻하며, 이후 이어질 실험의 배경이 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for + 동명사구\u003c/span> : a preference for + [동명사구] : \"선하고 공정한 행동을 영속시키는 것에 대한 선호\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Our adult brains retain, 우리의 성인 뇌는 유지한다. a preference, 선호를. for perpetuating, 영속시키는 것에 대한. good, fair behavior, 선하고 공정한 행동을. 이 문장 전체를 해석하면, 우리의 성인 뇌는 선하고 공정한 행동을 영속시키는 것에 대한 선호를 유지한다.","hl":"m"},{"n":13,"text":"이 문장은 글 전체의 출발점이에요. 성인의 뇌가 선하고 공정한 행동을 계속해서 이어 가려는 선호를 이미 가지고 있다는 핵심 주장을 던지고 있어요. perpetuate라는 단어는 어떤 행동을 한 번에 그치지 않고 계속 지속시킨다는 뜻이에요. 그래서 우리 뇌는 단순히 착한 행동을 하는 데서 더 나아가 그런 행동을 오래 유지하려는 성향이 있다는 말이에요.","hl":"mn"},{"n":14,"text":"문법 포인트는 for perpetuating good, fair behavior 부분이에요. 전치사 for 뒤에는 명사가 와야 하니까 원래 동사 perpetuate를 동명사 perpetuating으로 바꿔서 쓴 거예요. 이렇게 하면 a preference for 선호라는 표현과 함께 선하고 공정한 행동을 영속시키는 것에 대한 선호라는 뜻이 자연스럽게 완성되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순히 우리 자신을 인식하는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Simply \u003c/span>\u003cspan class=\"tgt\">perceiving \u003c/span>\u003cspan class=\"tgt\">ourselves \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">좋은 행위를 하는 사람으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">deeds \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그에 맞춰 행동하는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">behaving \u003c/span>\u003cspan class=\"tgt\">accordingly\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게 동기를 부여한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">motivates \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미래에 더 큰 선을 행하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">greater \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">future\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">단순히 우리 자신을 좋은 행위를 하는 사람으로 인식하고 그에 맞춰 행동하는 것만으로도 우리가 미래에 더 큰 선을 행하도록 동기를 부여한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 단순히 \u003cb class=\"key\">자신을 \u003c/b>\u003cb class=\"key\">좋은 \u003c/b>\u003cb class=\"key\">사람으로 \u003c/b>\u003cb class=\"key\">인식\u003c/b>하고 그에 맞춰 행동하는 것만으로도 더 큰 선행을 하고 싶은 \u003cb class=\"key\">동기\u003c/b>가 생긴다는 원리를 설명한다. 앞 문장의 선호가 어떻게 발현되는지 보여 주며, 뒤에 나올 구체적 실험 결과를 예고하는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">원리\u003c/b> 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [동명사구 A and 동명사구 B] + 단수 동사 : \"단순히 우리 자신을 좋은 행위를 하는 사람으로 인식하고 그에 맞춰 행동하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사 people + [주격 관계대명사 who + 동사 do] : \"좋은 행위를 하는 사람\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 동사 motivate와 to부정사\u003c/span> : motivate + 목적어(us) + [to부정사구(목적격 보어)] : \"우리가 미래에 더 큰 선을 행하도록 동기를 부여한다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Simply perceiving ourselves, 단순히 우리 자신을 인식하는 것. as people who do good deeds, 좋은 행위를 하는 사람으로. and behaving accordingly, 그리고 그에 맞춰 행동하는 것. motivates us, 우리에게 동기를 부여한다. to do greater good in the future, 미래에 더 큰 선을 행하도록. 이 문장 전체를 해석하면, 단순히 우리 자신을 좋은 행위를 하는 사람으로 인식하고 그에 맞춰 행동하는 것만으로도 우리가 미래에 더 큰 선을 행하도록 동기를 부여한다.","hl":"m"},{"n":16,"text":"이 문장은 앞 문장의 선호가 어떻게 행동으로 나타나는지 설명해요. 우리 스스로를 좋은 행위를 하는 사람으로 인식하고 그렇게 행동하는 것만으로도 나중에 더 큰 선을 행하려는 동기가 생긴다는 원리예요. 여기서 and behaving accordingly는 인식한 대로 행동하는 두 가지가 같이 간다는 걸 보여 주고, 그 두 개가 하나의 주어로 묶여서 motivates라는 단수 동사를 받는 점이 중요해요.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 문장 앞부분 전체가 동명사구 주어라는 점이에요. perceiving ourselves as people who do good deeds와 behaving accordingly가 and로 병렬 연결되어서 주어 역할을 하고, 주어가 동명사구라서 단수 동사 motivates를 받아요. 두 번째 포인트는 people who do good deeds에서 who가 쓰인 부분이에요. who는 선행사 people을 수식하는 주격 관계대명사라서 뒤에 do라는 동사만 바로 오죠. 세 번째 포인트는 motivates us to do greater good in the future에요. motivate는 목적어와 to부정사를 함께 쓰는 동사라서 우리가 미래에 더 큰 선을 행하도록 동기를 부여한다는 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">100명의 대학생을 대상으로 한 보수가 지급되는 한 연구에서,\u003c/span>\u003cspan class=\"en\">In one paid study of one hundred college students,\u00 았던 사람들보다\u003c/span>\u003cspan class=\"en\">as those who had been instructed to recall previous bad deeds.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">100명의 대학생을 대상으로 한 보수가 지급되는 한 연구에서, 과거 좋은 행위의 목록을 작성한 후 자선 단체에 기부할 것을 요청받은 피실험자들은 평균적으로 연구를 통해 번 수익의 절반 이상을 기부했다. 이는 이전의 나쁜 행위를 회상하도록 지시받았던 사람들보다 거의 두 배였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 제시한 원리를 뒷받침하는 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">증거\u003c/b>로, 과거 좋은 행위를 적은 학생들이 나쁜 행위를 회상한 학생들보다 거의 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">배\u003c/b> 많이 기부했다는 결과를 제시한다. 특히 over half the earnings라는 구체적 수치를 통해 자기 인식이 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">행동\u003c/b>으로 이어짐을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사 subjects + [주격 관계대명사 who + 동사 wrote] : \"과거 좋은 행위의 목록을 작성한 피실험자들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태와 ask의 to부정사\u003c/span> : were + asked(과거분사) + [to부정사구] : \"자선 단체에 기부할 것을 요청받은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : 선행사 the earnings + [(which/that) they had made] : \"그들이 연구를 통해 번 수익\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In one paid study of one hundred college students, 100명의 대학생을 대상으로 한 보수가 지급되는 한 연구에서. subjects who wrote down a list of past good deeds, 과거 좋은 행위의 목록을 작성한 피실험자들. and were then asked to donate money to a charity, 그리고 나서 자선 단체에 기부할 것을 요청받은. gave, on average, over half the earnings, 평균적으로 수익의 절반 이상을 기부했다. they'd made from the study, 그들이 연구를 통해 번. - almost twice as much, 거의 두 배였다. as those who had been instructed to recall previous bad deeds, 이전의 나쁜 행위를 회상하도록 지시받았던 사람들보다. 이 문장 전체를 해석하면, 100명의 대학생을 대상으로 한 보수가 지급되는 한 연구에서, 과거 좋은 행위의 목록을 작성한 후 자선 단체에 기부할 것을 요청받은 피실험자들은 평균적으로 연구를 통해 번 수익의 절반 이상을 기부했다. 이는 이전의 나쁜 행위를 회상하도록 지시받았던 사람들보다 거의 두 배였다.","hl":"m"},{"n":19,"text":"이 문장은 앞에서 말한 원리를 실험으로 확인해 주는 결과예요. 백 명의 대학생을 대상으로 보수를 주는 연구에서 과거에 좋은 행동을 적은 학생들은 연구로 번 돈의 절반 이상을 기부했어요. 이 수치는 나쁜 행동을 회상한 학생들보다 거의 두 배나 많은 금액이에요. 그래서 자신을 좋은 사람으로 인식하는 것이 실제 기부라는 선한 행동으로 이어졌다는 게 증명되죠.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 subjects who wrote down a list of past good deeds에서 who가 주격 관계대명사로 쓰였다는 점이에요. 선행사 subjects를 수식하면서 뒤에 wrote라는 동사가 바로 나오죠. 두 번째 포인트는 were then asked to donate money to a charity에서 수동태가 보여요. 학생들이 요청을 받은 대상이라서 were asked가 쓰였고, ask가 to부정사를 동반하는 동사라서 to donate가 그대로 이어져요. 세 번째 포인트는 the earnings they'd made from the study에서 관계대명사가 생략된 구조예요. 원래는 the earnings which they had made인데 목적격 관계대명사 which가 생략되면서 earnings 뒤에 바로 주어 they가 왔어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가,\u003c/span>\u003cspan class=\"en\">In addition,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공들여 묘사했던 피실험자들은\u003c/span>\u003cspan class=\"en\">subjects \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who'd \u003c/span>\u003cspan class=\"tgt\">taken \u003c/span>\u003cspan class=\"tgt\">pains \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">describe\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 타인에게 얼마나 친절했는지뿐만 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">they'd \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">nice \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">others \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 어떻게 반응했는지도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">responded\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 적게 기부하는 경향이 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">donate\u003c/span> significantly less\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">순수하게 행위 그 자체에만 초점을 둔 사람들보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">focused \u003c/span>\u003cspan class=\"tgt\">purely \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">actions \u003c/span>\u003cspan class=\"tgt\">themselves\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가, 자신이 타인에게 얼마나 친절했는지 뿐만 아니라 사람들이 어떻게 반응했는지까지 공들여 묘사했던 피실험자들은, 순수하게 행위 그 자체에만 초점을 둔 사람들보다 훨씬 적게 기부하는 경향이 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 실험 결과에 이어지는 추가 결과입니다. 좋은 행위 자체에만 집중하지 않고 \u003cb class=\"key\">사람들의 \u003c/b>\u003cb class=\"key\">반응\u003c/b>까지 공들여 묘사한 피실험자들은 기부를 훨씬 적게 했습니다. 이를 통해 \u003cb class=\"key\">겉모습\u003c/b>에 신경 쓸수록 선행이 줄어든다는 다음 문장의 일반화를 이끌어냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who + to부정사의 부사적 용법(목적)\u003c/span> : take pains + to do : \"공들여 묘사했던 피실험자들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 not only A but B\u003c/span> : not only + [간접의문문] + but + [간접의문문] : \"자신이 타인에게 얼마나 친절했는지뿐만 아니라 사람들이 어떻게 반응했는지도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be likely to부정사\u003c/span> : be likely + to + 동사원형 : \"기부하는 경향이 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">비교급 + than + 주격 관계대명사절\u003c/span> : less ~ than + those who... : \"순수하게 행위 그 자체에만 초점을 둔 사람들보다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"In addition, 게다가. subjects who'd taken pains to describe, 공들여 묘사했던 피실험자들은. not only how they'd been nice to others, 자신이 타인에게 얼마나 친절했는지뿐만 아니라. but how people responded, 사람들이 어떻게 반응했는지도. were likely to donate significantly less, 훨씬 적게 기부하는 경향이 있었다. than those who focused purely on the actions themselves, 순수하게 행위 그 자체에만 초점을 둔 사람들보다. 이 문장 전체를 해석하면, 게다가, 자신이 타인에게 얼마나 친절했는지 뿐만 아니라 사람들이 어떻게 반응했는지까지 공들여 묘사했던 피실험자들은, 순수하게 행위 그 자체에만 초점을 둔 사람들보다 훨씬 적게 기부하는 경향이 있었다.","hl":"m"},{"n":22,"text":"이 문장은 실험에서 자기 행동뿐만 아니라 사람들의 반응까지 함께 묘사한 사람들이 오히려 기부를 훨씬 적게 했다는 것을 보여줘요. 행위 자체보다 보이는 모습에 신경 쓸수록 선행의 순수성이 떨어진다는 흐름으로 이어지는 핵심 근거가 됩니다.","hl":"mn"},{"n":23,"text":"첫 번째로 who'd taken pains to describe에서 who는 subjects를 수식하는 주격 관계대명사예요. had taken pains는 과거완료로 본동사 were likely보다 앞선 시점을 나타냅니다. 두 번째로 to describe는 take pains to do 구문에서 목적을 나타내는 to부정사의 부사적 용법이에요. 세 번째로 not only how they'd been nice to others but how people responded는 not only A but B 상관접속사이고 A와 B 자리에 간접의문문이 병렬로 왔습니다. 네 번째로 were likely to donate는 be likely to부정사 구문으로 가능성이나 경향을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 말해서,\u003c/span>\u003cspan class=\"en\">In other words,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">겉모습에 신경을 쓰는 것처럼 보이는 사람들은\u003c/span>\u003cspan class=\"en\">people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">seemed \u003c/span>\u003cspan class=\"tgt\">concerned \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">appearances\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어 좋은 행위 그 자체만큼이나 자신의 좋은 행위가 미칠 영향력\u003c/span>\u003cspan class=\"en\">(e.g., the impact of their good deed, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">deed \u003c/span>\u003cspan class=\"tgt\">itself\u003c/span>)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">덜 관대했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">generous \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선을 그 자체를 위해 행하는 것에 더 마음을 쓰는 사람들보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">those\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">cared \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">sake\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다시 말해서, 겉모습(예를 들어, 좋은 행위 그 자체만큼이나 자신의 좋은 행위가 미칠 영향력)에 신경을 쓰는 것처럼 보이는 사람들은, 선을 그 자체를 위해 행하는 것에 더 마음을 쓰는 사람들보다 덜 관대했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실험 결과를 다시 말해 일반화한 문장입니다. 좋은 행동이 미칠 \u003cb class=\"key\">영향력\u003c/b>이나 보이는 모습에 신경 쓰는 사람은 선을 \u003cb class=\"key\">그 \u003c/b>\u003cb class=\"key\">자체를 \u003c/b>\u003cb class=\"key\">위해\u003c/b> 행하는 사람보다 덜 관대하다는 핵심 주장을 정리합니다. 동기에서 \u003cb class=\"key\">순수성\u003c/b>이 중요하다는 것을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : N + who + V + 형용사 : \"겉모습에 신경을 쓰는 것처럼 보이는 사람들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">as much as + 명사\u003c/span> : as much as + N : \"좋은 행위 그 자체만큼이나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 less + 형용사 + than\u003c/span> : less + 형용사 + than + 명사 : \"사람들보다 덜 관대했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who + 동명사 doing\u003c/span> : who + V + about + doing : \"선을 그 자체를 위해 행하는 것에 더 마음을 쓰는 사람들\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In other words, 다시 말해서. people who seemed concerned about appearances, 겉모습에 신경을 쓰는 것처럼 보이는 사람들은. (e.g., the impact of their good deed, as much as the deed itself), 예를 들어 좋은 행위 그 자체만큼이나 자신의 좋은 행위가 미칠 영향력. were less generous, 덜 관대했다. than those who cared more about doing good for its own sake, 선을 그 자체를 위해 행하는 것에 더 마음을 쓰는 사람들보다. 이 문장 전체를 해석하면, 다시 말해서, 겉모습(예를 들어, 좋은 행위 그 자체만큼이나 자신의 좋은 행위가 미칠 영향력)에 신경을 쓰는 것처럼 보이는 사람들은, 선을 그 자체를 위해 행하는 것에 더 마음을 쓰는 사람들보다 덜 관대했다.","hl":"m"},{"n":25,"text":"이 문장은 실험 결과를 다시 말해 일반화한 문장이에요. 좋은 행동이 미칠 영향력이나 보이는 모습에 신경 쓰는 사람은 선을 그 자체를 위해 행하는 사람보다 덜 관대하다는 핵심 주장을 정리합니다. 동기에서 순수성이 중요하다는 것을 강조해요.","hl":"mn"},{"n":26,"text":"첫 번째로 who seemed concerned about appearances에서 who는 people을 수식하는 주격 관계대명사이고 seemed는 뒤에 concerned를 보어로 취하는 이 형식 동사예요. 두 번째로 as much as the deed itself는 영향력이 그 행위 자체와 같은 정도라는 동등 비교입니다. 세 번째로 were less generous than those는 less와 than으로 비교급 구문을 만듭니다. 네 번째로 who cared more about doing good for its own sake에서 who는 those를 수식하는 주격 관계대명사이고 doing good은 about의 목적어로 쓰인 동명사구예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>성인 뇌는 \u003cb class=\"key\">선하고 \u003c/b>\u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 지속하려는 \u003cb class=\"key\">선호\u003c/b>를 유지한다.\u003c/li>\u003cli>자신을 \u003cb class=\"key\">선행\u003c/b>을 하는 사람으로 \u003cb class=\"key\">인식\u003c/b>하면 미래에 더 큰 선을 행하도록 동기가 부여된다.\u003c/li>\u003cli>연구에서 \u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">선행\u003c/b>을 회상한 집단은 \u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">악행\u003c/b>을 회상한 집단보다 기부액이 거의 두 배였다.\u003c/li>\u003cli>타인의 반응이나 \u003cb class=\"key\">겉모습\u003c/b>에 신경 쓰는 사람은 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">자체\u003c/b>에 집중하는 사람보다 덜 관대하다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Perceiving ourselves as doers of good motivates greater generosity, but focusing on appearances undermines it.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">성인 뇌는 \u003cb class=\"key\">선하고 \u003c/b>\u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 지속하려는 \u003cb class=\"key\">선호\u003c/b>를 지니며, 자신을 \u003cb class=\"key\">선행\u003c/b>을 하는 사람으로 인식하면 더 큰 선을 행하게 된다. 연구에서 \u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">선행\u003c/b>을 회상한 집단이 더 많이 기부했지만, \u003cb class=\"key\">겉모습\u003c/b>에 신경 쓰는 사람은 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">자체\u003c/b>에 집중하는 사람보다 덜 관대했다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"오늘 내용을 정리하면, 우리는 자신을 선한 사람으로 인식할 때 더 큰 선을 행하게 되지만, 겉모습에 신경 쓰면 그 효과가 줄어든다는 것입니다. 글의 주장과 연구 근거, 대조 근거를 연결해서 읽는 연습을 해 보세요. 다음 시간에도 더 유익한 분석으로 찾아올게요. 감사합니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
