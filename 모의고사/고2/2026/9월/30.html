</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 30번","audioDir":"30_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">30번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Moral Licensing and Eco-Guilt in Pro-Environmental Behavior\u003c/h1>\u003ch2>친환경 행동을 둘러싼 도덕적 허가와 환경 죄책감\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>친환경 제품 구매 후에는 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">허가\u003c/b>로 오히려 비윤리적 행동을 할 수 있지만, 환경에 해로운 행동을 떠올리면 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">죄책감\u003c/b>을 느끼고 이를 보상하기 위해 친환경 행동을 추구한다. 사람들은 도덕적 균형을 빠르게 회복하려는 마음에 \u003cb class=\"key\">임시방편\u003c/b>을 믿는 경향이 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>People adjust their moral self-image through moral licensing or eco-guilt, leading to either unethical behavior after eco-friendly choices or pro-environmental actions to compensate for guilt.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 다룰 지문은 고등학교 이학년 구월 모의고사 서른 번째 지문입니다. 이 글은 도덕적 허가와 환경 죄책감이라는 심리적 기제가 친환경 행동과 비윤리적 행동에 어떻게 영향을 주는지 설명해요. 핵심은 사람들이 도덕적 균형을 회복하려는 마음 때문에 친환경 행동을 하기도 하고 반대로 일탈 행동을 하기도 한다는 것이에요. 이제 본문과 문제를 함께 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">도덕 심리학에서는 사람들이 자신의 행동을 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">회계\u003c/b>처럼 계산하는 경향이 있다고 설명해요. 예를 들어 다이어트 중에 운동을 한 날은 오늘 운동했으니 아이스크림 좀 먹어도 된다고 생각하는 것과 같아요. 이런 현상을 도덕적 허가 moral licensing라고 부르는데, 착한 행동을 한 뒤 스스로에게 면죄부를 주는 거예요. 반대로 자신이 환경에 해를 끼쳤다고 느끼면 환경 죄책감 eco-guilt이 생겨서 이를 만회하려는 행동이 나타나요. 이 글은 친환경 행동도 단순히 이타적이기보다 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">균형\u003c/b>을 회복하려는 심리에서 비롯될 수 있다는 점을 보여 줍니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 우리는 흔히 착한 일을 하면 마음이 편해지고 그 다음에는 좀 방심하게 되는 경우가 있죠. 예를 들어 다이어트 중에 운동을 하고 나면 오늘은 좀 먹어도 된다고 생각하는 것처럼요. 이런 현상을 도덕적 허가 moral licensing라고 해요. 반대로 자신이 환경에 해를 끼쳤다고 느끼면 환경 죄책감 eco-guilt이 생기고 이를 만회하려는 행동이 나타나요. 이 글은 친환경 행동도 단순히 선해서가 아니라 도덕적 균형을 되찾으려는 심리에서 나올 수 있다는 걸 보여 줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도덕적 허가\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>친환경 제품을 사고 나면 자신이 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">허가\u003c/b>를 받았다고 느껴 오히려 속이거나 훔치는 행동을 할 수 있다. 이는 친환경 선택을 \u003cb class=\"key\">선행\u003c/b>으로 간주하기 때문이다. 도덕적 허가는 환경 협력 장면에서도 관찰된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>환경 죄책감\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>사람들은 자신이 환경에 해를 끼친 행동을 떠올리면 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">죄책감\u003c/b>을 느낀다. 이 죄책감을 보상하고 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">균형\u003c/b>을 회복하기 위해 친환경 행동을 찾는다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>빠른 해결책 선호\u003csmall>전개 · 문장 5\u003c/small>\u003c/h4>\u003cp>환경 죄책감을 느낀 사람들은 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">균형\u003c/b>을 재정립하고 싶어 한다. 그래서 가능한 한 빠르고 쉽게 죄책감에서 벗어나려고 \u003cb class=\"key\">임시방편\u003c/b>을 믿는 경향을 보인다. 이처럼 균형을 빠르게 되찾으려는 심리가 강하게 작용한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>태도와 행동의 불일치 해소\u003csmall>주장 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>사람들은 \u003cb class=\"key\">태도와 \u003c/b>\u003cb class=\"key\">행동의 \u003c/b>\u003cb class=\"key\">불일치\u003c/b>를 줄이기 위해 태도를 바꾸듯, 과거 환경 부담 행동과 미래 친환경 행동에 대한 평가를 바꿀 수 있다. 예를 들어 환경 훼손 증거를 본 사람은 \u003cb class=\"key\">친환경 \u003c/b>\u003cb class=\"key\">행동\u003c/b>인 청원 서명에 나설 가능성이 높다. 이것은 미래 행동 평가 변화의 구체적 근거이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글은 도덕적 허가에서 시작해 환경 죄책감, 빠른 해결책 선호, 태도와 행동의 불일치 해소로 이어집니다.","hl":null},{"n":4,"text":"첫 번째 단계는 도덕적 허가입니다. 사람들은 친환경 제품을 사고 나면 자신이 착한 일을 했다고 여겨서 속이거나 훔칠 가능성이 높아져요. 이런 도덕적 허가는 환경을 위한 협력에서도 나타납니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 환경 죄책감입니다. 사람들은 자신이 환경에 해를 끼친 행동을 떠올리면 환경 죄책감을 느껴요. 이 죄책감을 보상하고 균형을 회복하기 위해 친환경 행동을 찾게 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 빠른 해결책 선호입니다. 사람들은 도덕적 균형을 재정립하고 싶어 하고, 가능한 한 빠르고 쉽게 죄책감에서 벗어나고 싶어 해요. 그래서 임시방편을 믿으려는 경향이 있어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 태도와 행동의 불일치 해소입니다. 사람들은 태도와 행동 사이의 불일치를 줄이기 위해 태도를 바꾸는 것처럼, 과거의 환경 부담 행동과 미래의 친환경 행동에 대한 평가도 바꿀 수 있어요. 예를 들어 환경 훼손의 증거를 본 사람은 환경 훼손을 다루는 청원서에 서명할 가능성이 더 높습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째부터 다섯 번째 문장까지 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">허가\u003c/b>와 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">죄책감\u003c/b>의 구체적 사례를 제시하고, 여섯 번째 문장에서 태도와 행동의 불일치를 줄이려는 일반 원리를 주장한다. 일곱 번째 문장은 그 근거로 \u003cb class=\"key\">청원 \u003c/b>\u003cb class=\"key\">서명\u003c/b> 예시를 든다. 따라서 주제문이 중간에 위치하는 \u003cb class=\"key\">중괄식\u003c/b> 구조이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>probably because (1)\u003c/b>\u003cspan>원인\u003c/span>\u003cb>also (2)\u003c/b>\u003cspan>첨가\u003c/span>\u003cb>When (3)\u003c/b>\u003cspan>조건\u003c/span>\u003cb>because (5)\u003c/b>\u003cspan>원인\u003c/span>\u003cb>In the same way (6)\u003c/b>\u003cspan>유사 비교\u003c/span>\u003cb>For instance (7)\u003c/b>\u003cspan>예시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">feel licensed\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">moral licensing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">eco-guilt\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">restore balance\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">quick-fixes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">inconsistencies between attitudes and behavior\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">evaluation of past and future behaviors\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>도덕적 허가 moral licensing\u003c/th>\u003cth>환경 죄책감 eco-guilt\u003c/th>\u003c/tr>\u003ctr>\u003ctd>친환경 선택 후 나타남\u003c/td>\u003ctd>환경 해로운 행동 회상 후 나타남\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자격을 느껴 비윤리 행동 가능\u003c/td>\u003ctd>죄책감을 보상하려 친환경 행동 추구\u003c/td>\u003c/tr>\u003ctr>\u003ctd>도덕적 균형이 이미 맞춰졌다고 여김\u003c/td>\u003ctd>도덕적 균형이 깨졌다고 여김\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 구체적 사례들을 먼저 보여 주고 중간에 일반 원리를 제시한 다음 다시 예시로 마무리하는 중괄식 구조예요. 여섯 번째 문장이 주제문으로, 태도와 행동의 불일치를 줄이기 위해 과거와 미래 행동을 재평가한다는 원리를 말해요. 앞부분은 도덕적 허가와 환경 죄책감 사례, 뒷부분은 청원 서명 예시로 주제문을 뒷받침하죠. 전개 방식은 주장과 근거로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 볼게요. 첫 번째 문장의 probably because는 원인을, 두 번째 문장의 also는 첨가를 나타내요. 여섯 번째 문장의 In the same way는 유사한 방식을 비교하고, 일곱 번째 문장의 For instance는 예시를 이끌어요. 또한 feel licensed와 moral licensing, quick-fixes와 re-establish the moral balance처럼 같은 개념을 다르게 표현한 것도 구조를 파악하는 데 도움이 됩니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>be likely to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 가능성이 높다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cheat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>속이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>steal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>훔치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>purchase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구매하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>eco-friendly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>친환경적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>licensed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>허가받은, 자격이 있다고 느끼는\u003c/span>\u003c/div>\u003cdiv>\u003cb>account A as B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A를 B로 간주하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>good deed\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선행, 착한 행위\u003c/span>\u003c/div>\u003cdiv>\u003cb>moral licensing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도덕적 허가\u003c/span>\u003c/div>\u003cdiv>\u003cb>observe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관찰하다, 발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cooperation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>협조, 협력\u003c/span>\u003c/div>\u003cdiv>\u003cb>be reminded of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 상기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>harmful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>해로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>eco-guilt\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경 죄책감\u003c/span>\u003c/div>\u003cdiv>\u003cb>compensate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>restore balance\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>균형을 회복하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>be inclined to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 경향이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quick-fix\u003c/b>\u003cem>명사\u003c/em>\u003cspan>임시방편\u003c/span>\u003c/div>\u003cdiv>\u003cb>re-establish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재확립하다, 재정립하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>escape\u003c/b>\u003cem>동사\u003c/em>\u003cspan>벗어나다, 탈출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inconsistency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불일치, 모순\u003c/span>\u003c/div>\u003cdiv>\u003cb>evaluation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>평가\u003c/span>\u003c/div>\u003cdiv>\u003cb>burdening\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부담을 주는\u003c/span>\u003c/div>\u003cdiv>\u003cb>sign a petition\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>청원서에 서명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>address\u003c/b>\u003cem>동사\u003c/em>\u003cspan>문제를 다루다, 해결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>evidence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>증거\u003c/span>\u003c/div>\u003cdiv>\u003cb>human-caused\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인간이 유발한\u003c/span>\u003c/div>\u003cdiv>\u003cb>environmental damage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경 훼손\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요 단어를 몇 개 짚어 볼게요. eco-friendly는 친환경적인, moral licensing은 도덕적 허가, eco-guilt는 환경 죄책감이에요. be inclined to는 어떤 경향이 있다는 뜻이고, inconsistency는 태도와 행동의 불일치를 뜻해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">moral licensing\u003c/b>\u003cspan class=\"m\">도덕적 허가\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">moral credentialing\u003c/span>\u003cspan class=\"s\">self-licensing\u003c/span>\u003cspan class=\"s\">virtue licensing\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">eco-guilt\u003c/b>\u003cspan class=\"m\">환경 죄책감\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">green guilt\u003c/span>\u003cspan class=\"s\">environmental guilt\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">eco-pride\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">compensate\u003c/b>\u003cspan class=\"m\">보상하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">make up for\u003c/span>\u003cspan class=\"s\">offset\u003c/span>\u003cspan class=\"s\">atone\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">harmful\u003c/b>\u003cspan class=\"m\">해로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">damaging\u003c/span>\u003cspan class=\"s\">detrimental\u003c/span>\u003cspan class=\"s\">injurious\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">beneficial\u003c/span>\u003cspan class=\"a\">harmless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inconsistency\u003c/b>\u003cspan class=\"m\">불일치\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discrepancy\u003c/span>\u003cspan class=\"s\">mismatch\u003c/span>\u003cspan class=\"s\">contradiction\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">consistency\u003c/span>\u003cspan class=\"a\">agreement\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">evaluation\u003c/b>\u003cspan class=\"m\">평가\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">assessment\u003c/span>\u003cspan class=\"s\">judgment\u003c/span>\u003cspan class=\"s\">appraisal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quick-fix\u003c/b>\u003cspan class=\"m\">임시방편\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">band-aid solution\u003c/span>\u003cspan class=\"s\">stopgap\u003c/span>\u003cspan class=\"s\">makeshift\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fundamental solution\u003c/span>\u003cspan class=\"a\">root cure\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리할게요. moral licensing은 moral credentialing이나 self-licensing과 비슷해요. compensate는 make up for나 offset과 같은 뜻이고 반대는 neglect나 ignore이에요. harmful은 damaging이나 detrimental과 비슷하고 beneficial이나 harmless와 반대되죠. inconsistency는 discrepancy나 mismatch와 가깝고 consistency와 반대예요. quick-fix는 band-aid solution이나 stopgap과 비슷하고 fundamental solution과 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람들은 속이거나 훔칠 가능성이 더 높다\u003c/span>\u003cspan class=\"en\">Some people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">cheat \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">steal\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">'친환경' 제품을 구매한 후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">purchasing \u003c/span>\u003cspan class=\"tgt\">&quot;eco-friendly&quot; \u003c/span>\u003cspan class=\"tgt\">products\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 그들은 그렇게 할 자격이 있다고 느끼기 때문일 것이다\u003c/span>\u003cspan class=\"en\">probably because they \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">licensed \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">so\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그들은 '친환경적' 선택을 '착한' 행위라고 도덕적으로 간주하기 때문이다\u003c/span>\u003cspan class=\"en\">since they morally \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">account \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">&quot;eco-friendly&quot; \u003c/span>\u003cspan class=\"tgt\">choice \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">&quot;good&quot; \u003c/span>\u003cspan class=\"tgt\">deed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 사람들은 ‘친환경’ 제품을 구매한 후에 속이거나 훔칠 가능성이 더 높은데, 아마도 그들은 ‘친환경적’ 선택을 ‘착한’ 행위라고 도덕적으로 간주하여 그렇게 할 자격이 있다고 느끼기 때문일 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 친환경 제품을 구매한 뒤 오히려 \u003cb class=\"key\">비도덕적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 할 가능성이 커지는 현상을 보여줘요. 사람들이 친환경 선택을 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">선행\u003c/b>으로 간주해 나쁜 행동을 정당화하는 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">허가\u003c/b> 심리를 구체적 사례로 도입하는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be likely to부정사 구문\u003c/span> : be likely to + 동사원형 : \"속이거나 훔칠 가능성이 더 높다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 after + 동명사구\u003c/span> : 전치사 after + 동명사구 : \"'친환경' 제품을 구매한 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">feel + 과거분사(형용사) + to부정사\u003c/span> : feel licensed (과거분사/형용사) + to do so (to부정사구) : \"그렇게 할 자격이 있다고 느끼다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">account A as B (A를 B로 간주하다)\u003c/span> : account + 목적어 + as + 명사구 : \"'친환경적' 선택을 '착한' 행위로 간주하다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Some people are more likely to cheat and steal, 어떤 사람들은 속이거나 훔칠 가능성이 더 높다. after purchasing \"eco-friendly\" products, '친환경' 제품을 구매한 후에. probably because they feel licensed to do so, 아마도 그들은 그렇게 할 자격이 있다고 느끼기 때문일 것이다. since they morally account the \"eco-friendly\" choice as a \"good\" deed, 왜냐하면 그들은 '친환경적' 선택을 '착한' 행위라고 도덕적으로 간주하기 때문이다. 이 문장 전체를 해석하면, 어떤 사람들은 ‘친환경’ 제품을 구매한 후에 속이거나 훔칠 가능성이 더 높은데, 아마도 그들은 ‘친환경적’ 선택을 ‘착한’ 행위라고 도덕적으로 간주하여 그렇게 할 자격이 있다고 느끼기 때문일 것이다.","hl":"m"},{"n":13,"text":"이 문장은 친환경 제품을 산 사람이 오히려 부정행위를 할 가능성이 커진다는 현상을 설명해요. 친환경 선택을 착한 행동으로 여겨서 도덕적 자격을 얻었다고 느끼기 때문이라는 거죠. 여기 나오는 개념이 바로 도덕적 허가예요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 be likely to 구문이에요. be likely to 뒤에 동사원형이 오면 무엇을 할 가능성이 높다는 뜻이 됩니다. 두 번째는 after purchasing인데, after는 전치사라서 뒤에 동명사 purchasing이 왔어요. 세 번째는 feel licensed to do so예요. feel 다음에 과거분사 licensed가 형용사로 쓰여서 그렇게 할 자격이 있다고 느끼다는 뜻을 만들어요. 네 번째는 account A as B 구문으로, A를 B로 간주하다라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도덕적 허가는 또한 관찰되어 왔다\u003c/span>\u003cspan class=\"en\">Moral licensing \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">observed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">협조의 맥락 안에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">context \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">cooperation\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경의 이익을 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">good \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">environment\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">도덕적 허가는 환경의 이익을 위한 협조의 맥락 안에서도 관찰되어 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 문장은 도덕적 허가가 환경을 위한 \u003cb class=\"key\">협조\u003c/b> 상황에서도 관찰된다는 점을 알려줘요. 앞 문장의 개별 사례를 일반적인 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">협력\u003c/b> 영역으로 확장하는 연결 역할을 해요. for the good of the environment는 '환경의 이익을 위해'라는 \u003cb class=\"key\">전치사구\u003c/b>예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 수동태\u003c/span> : have/has + been + 과거분사 : \"또한 관찰되어 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 in the context of\u003c/span> : in the context of + 명사구 : \"협조의 맥락 안에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 for the good of\u003c/span> : for the good of + 명사 : \"환경의 이익을 위해\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Moral licensing has also been observed, 도덕적 허가는 또한 관찰되어 왔다. in the context of cooperation, 협조의 맥락 안에서. for the good of the environment, 환경의 이익을 위한. 이 문장 전체를 해석하면, 도덕적 허가는 환경의 이익을 위한 협조의 맥락 안에서도 관찰되어 왔다.","hl":"m"},{"n":16,"text":"이 문장은 도덕적 허가가 환경을 위한 협력이라는 상황에서도 관찰되었다고 말해요. 그러니까 앞 문장에서 나온 친환경 제품 구매 사례가 단순한 소비에 그치지 않고 환경을 위한 협력 전반으로 확장된 거죠. 도덕적 허가라는 핵심 개념이 본격적으로 등장하는 연결 문장이에요.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 현재완료 수동태 has been observed예요. have 또는 has been 과거분사 형태로 무엇이 관찰되어 왔다는 의미를 나타내요. 두 번째는 in the context of cooperation인데, in the context of는 어떤 상황이나 맥락 안에서라는 뜻의 전치사구입니다. 세 번째는 for the good of the environment인데, for the good of는 무엇의 이익을 위하여라는 뜻으로 환경의 이익을 위해라는 해석이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 행동들을 떠올릴 때\u003c/span>\u003cspan class=\"en\">When people \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">reminded \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">deeds \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 해왔던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">done\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 환경에 해롭다고 알고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">know \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">harmful \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">environment\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게는 '환경에 대한 죄책감(eco-guilt)'이라는 감정이 남을 수 있다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">left \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">feeling\u003c/span> of &quot;eco-guilt.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들이 자신이 해왔던 환경에 해롭다고 알고 있는 행동들을 떠올릴 때, 그들에게는 ‘환경에 대한 죄책감(eco­guilt)’이라는 감정이 남을 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 문장은 사람들이 환경에 해로운 과거 행동을 떠올리면 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">죄책감\u003c/b>이 생길 수 있다고 말해요. are reminded of와 be left with 같은 \u003cb class=\"key\">수동태\u003c/b> 표현이 감정이 의도 없이 생기는 느낌을 줘요. 앞에서 다룬 도덕적 허가와 대비되는 \u003cb class=\"key\">에코 \u003c/b>\u003cb class=\"key\">길트\u003c/b> 개념을 도입하는 전환점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 remind A of B\u003c/span> : be reminded of + 명사 : \"행동들을 떠올리게 되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : 선행사 deeds + (which/that) + 주어 + 동사 : \"그들이 해왔던 행동들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that + 삽입절\u003c/span> : 선행사 + that(주격) + 삽입절(they know) + 동사(were) : \"그들이 환경에 해롭다고 알고 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">조동사 might + 수동태 be left with\u003c/span> : might + be left with + 명사구 : \"감정이 남을 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"When people are reminded of deeds, 사람들이 행동들을 떠올릴 때. they have done, 그들이 해왔던. that they know were harmful to the environment, 그들이 환경에 해롭다고 알고 있는. they might be left with a feeling of \"eco-guilt.\", 그들에게는 '환경에 대한 죄책감(eco-guilt)'이라는 감정이 남을 수 있다. 이 문장 전체를 해석하면, 사람들이 자신이 해왔던 환경에 해롭다고 알고 있는 행동들을 떠올릴 때, 그들에게는 ‘환경에 대한 죄책감(eco­guilt)’이라는 감정이 남을 수 있다.","hl":"m"},{"n":19,"text":"이 문장은 사람들이 과거에 자신이 환경에 해롭다고 알고 있었던 행동을 떠올리면 환경에 대한 죄책감, 즉 eco-guilt이라는 감정이 남을 수 있다고 설명해요. 수동태 are reminded of와 be left with가 쓰여서 스스로 의도해서가 아니라 저절로 그런 감정이 생긴다는 뉘앙스를 줘요. 앞 문장까지 다룬 도덕적 허가와 대비되는 새로운 개념인 eco-guilt을 도입하는 역할을 해요.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 are reminded of예요. remind A of B는 A에게 B를 상기시키다라는 뜻인데 수동태로 쓰여 사람들이 행동을 떠올리게 되다는 해석이 돼요. 두 번째는 deeds they have done인데, deeds와 they have done 사이에 목적격 관계대명사 that이나 which가 생략되어 있어요. 세 번째는 that they know were harmful to the environment예요. 관계대명사 that이 선행사 deeds를 수식하고, they know는 삽입절로 들어가 그 행동들이 해롭다고 알고 있다는 의미를 더해줘요. 네 번째는 might be left with a feeling인데, be left with는 어떤 감정이 남겨진다는 수동태 표현이고 might가 붙어 가능성을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경에 대한 죄책감을 경험하는 사람들은\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">experience \u003c/span>\u003cspan class=\"tgt\">eco-guilt\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친환경적인 행동을 추구한다\u003c/span>\u003cspan class=\"en\">seek pro-environmental actions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 죄책감을 보상하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">compensate \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">guilt \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 균형을 회복하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">restore \u003c/span>\u003cspan class=\"tgt\">balance\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">환경에 대한 죄책감을 경험하는 사람들은 이 죄책감을 보상하고 균형을 회복하기 위한 친환경적인 행동을 추구한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 제시한 eco-guilt를 경험한 사람들이 어떤 반응을 보이는지 설명하는 문장입니다. 그들은 \u003cb class=\"key\">죄책감\u003c/b>을 상쇄하고 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">균형\u003c/b>을 되찾기 위해 친환경적 행동을 \u003cb class=\"key\">추구\u003c/b>한다는 핵심 주장을 담고 있습니다. 여기서 친환경 행동은 단순한 선행이 아니라 죄책감에 대한 보상심리에서 비롯된다는 점이 중요합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : People [선행사] + who experience eco-guilt [주격 관계대명사절] : \"환경에 대한 죄책감을 경험하는 사람들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : seek pro-environmental actions + to compensate for this guilt and restore balance : \"이 죄책감을 보상하고 균형을 회복하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"People who experience eco-guilt, 환경에 대한 죄책감을 경험하는 사람들은. seek pro-environmental actions, 친환경적인 행동을 추구한다. to compensate for this guilt, 이 죄책감을 보상하기 위해. and restore balance, 그리고 균형을 회복하기 위해. 이 문장 전체를 해석하면, 환경에 대한 죄책감을 경험하는 사람들은 이 죄책감을 보상하고 균형을 회복하기 위한 친환경적인 행동을 추구한다.","hl":"m"},{"n":22,"text":"이 문장은 환경에 대한 죄책감, 즉 eco-guilt를 경험한 사람들이 친환경적 행동을 추구한다고 말해요. 핵심은 그 행동이 이 죄책감을 보상하고 균형을 회복하기 위한 목적이라는 점입니다. 단순히 환경을 사랑해서가 아니라 심리적 균형을 되찾으려는 동기가 깔려 있다는 걸 기억하세요.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 who experience eco-guilt에서 who가 주격 관계대명사로 쓰였다는 거예요. 선행사 People을 수식하면서 뒤에 experience라는 동사를 바로 연결해 주고 있죠. 두 번째 포인트는 to compensate for this guilt and restore balance에서 to부정사가 목적을 나타내는 부사적 용법이라는 겁니다. 친환경 행동을 추구하는 이유를 설명해 주고 있어요. and로 to compensate와 restore balance가 병렬 연결되어 있다는 점도 함께 봐두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 균형을 찾는 과정에서\u003c/span>\u003cspan class=\"en\">In their search for such a balance,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 ‘임시방편’을 믿으려는 경향이 있는데\u003c/span>\u003cspan class=\"en\">people are inclined to believe in &quot;quick-fixes,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 도덕적 균형을 재정립하고 싶어하기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">re-establish \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">moral \u003c/span>\u003cspan class=\"tgt\">balance \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 죄책감을 벗어나고 싶어하기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">escape \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">guilt \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능한 한 빠르고 쉽게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">quickly \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">easily \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">possible\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 균형을 찾는 과정에서 사람들은 ‘임시방편’을 믿으려 하는 경향이 있는데, 이는 그들이 도덕적 균형을 재정립하고 가능한 한 빠르고 쉽게 죄책감을 벗어나고 싶어하기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 균형을 찾는 과정에서 왜 \u003cb class=\"key\">임시방편\u003c/b>에 기대는지 이유를 제시하는 문장입니다. 이들은 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">균형\u003c/b>을 다시 세우고 \u003cb class=\"key\">죄책감\u003c/b>을 최대한 빠르고 쉽게 벗어나고 싶어 하기 때문에 quick-fixes를 믿으려는 경향을 보입니다. 즉, 친환경 행동의 질보다는 빠른 심리적 안정이 우선될 수 있다는 비판적 시각을 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사절 접속사 because\u003c/span> : because + S + V : \"그들이 도덕적 균형을 재정립하고 죄책감을 벗어나고 싶어하기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">as + 원급 + as possible 구문\u003c/span> : as quickly and easily as possible : \"가능한 한 빠르고 쉽게\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In their search for such a balance, 이러한 균형을 찾는 과정에서. people are inclined to believe in \"quick-fixes,\", 사람들은 ‘임시방편’을 믿으려는 경향이 있는데. because they want to re-establish the moral balance, 그들이 도덕적 균형을 재정립하고 싶어하기 때문에. and escape the guilt, 그리고 죄책감을 벗어나고 싶어하기 때문에. as quickly and easily as possible, 가능한 한 빠르고 쉽게. 이 문장 전체를 해석하면, 이러한 균형을 찾는 과정에서 사람들은 ‘임시방편’을 믿으려 하는 경향이 있는데, 이는 그들이 도덕적 균형을 재정립하고 가능한 한 빠르고 쉽게 죄책감을 벗어나고 싶어하기 때문이다.","hl":"m"},{"n":25,"text":"이 문장은 사람들이 균형을 찾는 과정에서 왜 임시방편을 믿으려 하는지 이유를 설명해줘요. 도덕적 균형을 재정립하고 죄책감을 가능한 한 빠르고 쉽게 벗어나고 싶은 마음 때문에 그런 경향이 생긴다는 거죠. 핵심은 빠르고 쉽게 해결하려는 심리가 quick-fixes에 대한 믿음으로 이어진다는 점입니다.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 because가 이유의 부사절을 이끈다는 점이에요. because 뒤에 they want to re-establish and escape라는 완전한 절이 와서 앞 문장의 원인을 설명해 주고 있죠. 두 번째 포인트는 as quickly and easily as possible 구문입니다. as possible이 붙으면 가능한 한 빠르고 쉽게라는 뜻이 되고, quickly와 easily는 and로 병렬 연결된 부사들이에요. 원급 비교 구문이라는 점도 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~와 같은 방식으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 태도를 바꿀 수 있는\u003c/span>\u003cspan class=\"en\">people may change their attitudes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">태도와 행동 사이의 불일치를 줄이기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reduce \u003c/span>\u003cspan class=\"tgt\">inconsistencies \u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">attitudes \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">behavior\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 평가를 바꿀 수도 있다\u003c/span>\u003cspan class=\"en\">people may also change their evaluation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과거의 환경에 부담을 주는 행동에 대한\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">past \u003c/span>\u003cspan class=\"tgt\">environmentally \u003c/span>\u003cspan class=\"tgt\">burdening \u003c/span>\u003cspan class=\"tgt\">behaviors \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 미래의 친환경적 행동에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">future \u003c/span>\u003cspan class=\"tgt\">environmentally \u003c/span>\u003cspan class=\"tgt\">friendly \u003c/span>\u003cspan class=\"tgt\">behaviors\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들이 태도와 행동 사이의 불일치를 줄이기 위해 태도를 바꿀 수 있는 것과 같은 방식으로, 사람들은 과거의 환경에 부담을 주는 행동과 미래의 친환경적 행동에 대한 평가를 바꿀 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 말한 태도와 행동의 불일치를 줄이기 위한 태도 변화와 같은 원리로, 환경 행동에 대한 평가도 바뀔 수 있다는 논리입니다. 사람들은 \u003cb class=\"key\">과거의 \u003c/b>\u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">부담 \u003c/b>\u003cb class=\"key\">행동\u003c/b>과 \u003cb class=\"key\">미래의 \u003c/b>\u003cb class=\"key\">친환경 \u003c/b>\u003cb class=\"key\">행동\u003c/b>에 대한 \u003cb class=\"key\">평가\u003c/b>를 바꿔 심리적 일관성을 유지하려 한다는 것입니다. 즉, 행동뿐 아니라 해석과 평가까지도 조정된다는 점을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현\u003c/span> : In the same way that + S + V : \"~와 같은 방식으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : change their attitudes + to reduce inconsistencies between attitudes and behavior : \"태도와 행동 사이의 불일치를 줄이기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : past environmentally burdening behaviors + and + future environmentally friendly behaviors : \"과거의 환경에 부담을 주는 행동과 미래의 친환경적 행동\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"In the same way that, ~와 같은 방식으로. people may change their attitudes, 사람들이 태도를 바꿀 수 있는. to reduce inconsistencies between attitudes and behavior, 태도와 행동 사이의 불일치를 줄이기 위해. people may also change their evaluation, 사람들은 평가를 바꿀 수도 있다. of past environmentally burdening behaviors, 과거의 환경에 부담을 주는 행동에 대한. and future environmentally friendly behaviors, 그리고 미래의 친환경적 행동에 대한. 이 문장 전체를 해석하면, 사람들이 태도와 행동 사이의 불일치를 줄이기 위해 태도를 바꿀 수 있는 것과 같은 방식으로, 사람들은 과거의 환경에 부담을 주는 행동과 미래의 친환경적 행동에 대한 평가를 바꿀 수도 있다.","hl":"m"},{"n":28,"text":"이 문장은 태도와 행동의 불일치를 줄이기 위해 태도를 바꾸는 것과 같은 방식으로, 사람들이 환경 행동에 대한 평가도 바꿀 수 있다고 말해요. 과거에 환경에 부담을 준 행동과 미래의 친환경적 행동을 재평가해서 심리적 일관성을 유지한다는 거죠. 여기서 평가를 바꾼다는 말은 단순한 행동 변화가 아니라 해석의 변화까지 포함한다는 뜻입니다.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 In the same way that이라는 관용 표현이에요. 이 표현은 그 뒤에 오는 절과 같은 방식으로, 혹은 동일한 방식으로라는 의미를 만들어 줘요. 두 번째 포인트는 to reduce 이하가 목적을 나타내는 to부정사라는 점입니다. 태도를 바꾸는 이유를 설명해 주고 있죠. 세 번째 포인트는 past environmentally burdening behaviors와 future environmentally friendly behaviors가 and로 병렬 연결된 구조에요. 전치사 of의 목적어 자리에서 과거와 미래를 대비시켜 주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For instance,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 청원서에 서명할 가능성이 더 높다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sign \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">petition\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경 훼손을 다루는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">addressing \u003c/span>\u003cspan class=\"tgt\">environmental \u003c/span>\u003cspan class=\"tgt\">damage\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간이 유발한 환경 훼손의 증거를 본 후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">viewing \u003c/span>\u003cspan class=\"tgt\">evidence\u003c/span> of \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">human-caused \u003c/span>\u003cspan class=\"tgt\">environmental \u003c/span>\u003cspan class=\"tgt\">damage\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 사람들은 인간이 유발한 환경 훼손의 증거를 본 후에 환경 훼손을 다루는 청원서에 서명할 가능성이 더 높다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 \u003cb class=\"key\">태도 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 뒷받침하는 구체적인 예다. 사람들은 인간이 유발한 환경 훼손의 증거를 보면, 환경 훼손을 다루는 \u003cb class=\"key\">청원서에 \u003c/b>\u003cb class=\"key\">서명\u003c/b>할 가능성이 높아진다. 이는 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">훼손\u003c/b>에 대한 죄책감을 줄이고 친환경적 행동으로 도덕적 균형을 되찾으려는 심리와 연결된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be likely to부정사 (가능성 표현)\u003c/span> : [people] + [are more likely] + [to sign a petition] : \"사람들은 청원서에 서명할 가능성이 더 높다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 수식 (분사구)\u003c/span> : [a petition] + [addressing environmental damage (현재분사구)] : \"환경 훼손을 다루는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : [after] + [viewing (동명사)] + [evidence (목적어)] : \"증거를 본 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">과거분사 수식 (형용사적 용법)\u003c/span> : [human-caused (과거분사)] + [environmental damage (명사)] : \"인간이 유발한 환경 훼손\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"For instance, 예를 들어. people are more likely to sign a petition, 사람들은 청원서에 서명할 가능성이 더 높다. addressing environmental damage, 환경 훼손을 다루는. after viewing evidence of human-caused environmental damage, 인간이 유발한 환경 훼손의 증거를 본 후에. 이 문장 전체를 해석하면, 예를 들어, 사람들은 인간이 유발한 환경 훼손의 증거를 본 후에 환경 훼손을 다루는 청원서에 서명할 가능성이 더 높다.","hl":"m"},{"n":31,"text":"이 문장은 앞 문장의 태도 변화를 뒷받침하는 구체적인 예예요. 사람들은 인간이 유발한 환경 훼손의 증거를 보면 환경 훼손을 다루는 청원서에 서명할 가능성이 높아진다는 거죠. 이는 환경 훼손에 대한 죄책감을 줄이려는 친환경적 행동으로 도덕적 균형을 되찾으려는 심리와 연결됩니다.","hl":"mn"},{"n":32,"text":"첫 번째로 people are more likely to sign a petition에서 be likely to부정사 표현을 볼게요. likely는 형용사인데 뒤에 to부정사를 취해서 ~할 가능성이 높다는 뜻을 만들어요. 그래서 사람들은 청원서에 서명할 가능성이 더 높다가 되는 거죠. 두 번째로 addressing environmental damage는 현재분사구예요. 앞에 있는 a petition을 뒤에서 수식하는데, petition이 환경 훼손을 능동적으로 다루는 능동 관계니까 현재분사 addressing을 쓴 거예요. 세 번째로 after viewing evidence에서 after는 전치사라서 뒤에 동명사 viewing이 왔어요. 전치사 뒤에는 명사나 동명사가 와야 하니까 view를 viewing으로 바꾼 거죠. 네 번째로 human-caused environmental damage에서 human-caused는 과거분사가 명사를 수식하는 거예요. 인간에 의해 유발된이라는 수동 의미를 가져서 caused가 온 거죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>친환경 제품 구매 후 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">허가\u003c/b>를 느껴 오히려 비윤리적 행동을 할 수 있다.\u003c/li>\u003cli>환경에 해로운 행동을 떠올리면 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">죄책감\u003c/b>이 생겨 친환경 행동으로 보상하려 한다.\u003c/li>\u003cli>사람들은 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">균형\u003c/b>을 빠르게 회복하려고 \u003cb class=\"key\">임시방편\u003c/b>을 믿는 경향이 있다.\u003c/li>\u003cli>태도와 행동의 불일치를 줄이듯 과거와 미래 행동을 재평가하여 \u003cb class=\"key\">친환경 \u003c/b>\u003cb class=\"key\">행동\u003c/b>에 나선다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>People adjust their moral self-image through moral licensing or eco-guilt, leading to either unethical behavior after eco-friendly choices or pro-environmental actions to compensate for guilt.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">친환경 제품 구매 후에는 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">허가\u003c/b>로 오히려 비윤리적 행동을 할 수 있지만, 환경에 해로운 행동을 떠올리면 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">죄책감\u003c/b>을 느끼고 이를 보상하기 위해 친환경 행동을 추구한다. 사람들은 도덕적 균형을 빠르게 회복하려는 마음에 \u003cb class=\"key\">임시방편\u003c/b>을 믿는 경향이 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글을 정리하면 사람들은 착한 행동 뒤에는 도덕적 허가로 오히려 일탈할 수 있고, 나쁜 행동 뒤에는 환경 죄책감으로 보상 행동을 한다는 거예요. 핵심은 도덕적 균형을 회복하려는 심리가 우리의 환경 행동에 크게 영향을 준다는 점이에요. 이 구조를 기억하면 비슷한 심리학 지문도 쉽게 읽을 수 있을 거예요. 오늘 수고 많았어요, 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
