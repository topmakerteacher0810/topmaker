</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 30번","audioDir":"30_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">30번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>When Birds Breed: Seasonal Triggers, Physical Limits, and Brood Variation\u003c/h1>\u003ch2>새는 언제 번식하는가: 계절 신호, 신체적 한계, 새끼 수의 다양성\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>새의 번식 시기는 \u003cb class=\"key\">지역\u003c/b>에 따라 다르며, 온대·극지방은 주로 \u003cb class=\"key\">낮 \u003c/b>\u003cb class=\"key\">길이의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>에 의해 번식기가 결정된다. 하지만 \u003cb class=\"key\">유목성 \u003c/b>\u003cb class=\"key\">사막 \u003c/b>\u003cb class=\"key\">종\u003c/b>은 비를 계기로 번식하고, 종에 따라 한 시즌에 기르는 \u003cb class=\"key\">무리 \u003c/b>\u003cb class=\"key\">수\u003c/b>도 다르다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Bird breeding seasons are mainly triggered by day length, constrained by reproductive physiology, with exceptions like desert species and variation in brood number among species.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 살펴볼 지문은 새의 번식 시기와 새끼 수에 대한 설명문입니다. 새가 언제 번식하는지, 왜 그 시기에만 가능한지, 종마다 새끼를 몇 번 기르는지에 관한 내용이에요. 요지는 새의 번식 시기가 주로 낮 길이 변화에 의해 결정되고 신체 구조와 종 특성에 따라 다양하다는 것입니다. 그럼 함께 문장을 따라가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">새의 번식은 계절과 밀접한 관련이 있어요. 온대나 극지방에서는 \u003cb class=\"key\">광주기 \u003c/b>\u003cb class=\"key\">photoperiod\u003c/b>라고 부르는 낮 길이의 변화가 계절 달력처럼 작동합니다. 그래서 새들은 \u003cb class=\"key\">먹이 \u003c/b>\u003cb class=\"key\">공급 \u003c/b>\u003cb class=\"key\">최고조\u003c/b>에 맞춰 새끼를 기르려고 하죠. 농부가 작물을 심을 시기를 날씨와 해 길이로 판단하는 것과 비슷해요. 또 번식기에는 \u003cb class=\"key\">번식 \u003c/b>\u003cb class=\"key\">기관 \u003c/b>\u003cb class=\"key\">reproductive \u003c/b>\u003cb class=\"key\">system\u003c/b>이 커지지만 번식기가 지나면 위축되면서 날아다니기에 유리해집니다. 사막처럼 예측하기 어려운 환경에서는 \u003cb class=\"key\">유목성 \u003c/b>\u003cb class=\"key\">사막 \u003c/b>\u003cb class=\"key\">종 \u003c/b>\u003cb class=\"key\">nomadic \u003c/b>\u003cb class=\"key\">desert \u003c/b>\u003cb class=\"key\">species\u003c/b>이 비가 내린 직후에 번식을 시작합니다.\u003c/div>","segs":[{"n":2,"text":"새의 번식은 계절과 밀접한 관련이 있어요. 온대나 극지방에서는 광주기 photoperiod라고 부르는 낮 길이의 변화가 계절 달력처럼 작동합니다. 그래서 새들은 먹이가 가장 풍부한 시기에 맞춰 새끼를 기르려고 하죠. 농부가 작물을 심을 시기를 날씨와 해 길이로 판단하는 것과 비슷해요. 또 번식기에는 번식 기관 reproductive system이 커지지만 번식기가 지나면 위축되면서 날아다니기에 유리해집니다. 사막처럼 예측하기 어려운 환경에서는 유목성 사막 종 nomadic desert species는 비가 내린 직후에 번식을 시작합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>적도와 온대·극지방의 대비\u003csmall>도입·대조 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>적도 근처에서는 많은 새가 \u003cb class=\"key\">일 \u003c/b>\u003cb class=\"key\">년 \u003c/b>\u003cb class=\"key\">내내\u003c/b> 번식한다. 그러나 온대와 극지방에서는 새들의 \u003cb class=\"key\">번식기\u003c/b>가 대개 뚜렷하게 정해진다. 계절이 뚜렷한 지역의 번식은 연중 번식과 달리 특정 시기에 집중된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>낮 길이와 먹이 공급\u003csmall>원인·결과 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>이 번식기는 주로 \u003cb class=\"key\">낮 \u003c/b>\u003cb class=\"key\">길이의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>에 의해 촉발된다. 모든 것이 잘 진행되면 새들은 \u003cb class=\"key\">먹이 \u003c/b>\u003cb class=\"key\">공급이 \u003c/b>\u003cb class=\"key\">최고조\u003c/b>에 이를 때 새끼를 기르는 결과를 얻는다. 즉 환경 신호가 번식 시기를 결정한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>대부분 새의 신체적 제약과 사막 예외\u003csmall>주장·근거·반례 · 문장 5–9\u003c/small>\u003c/h4>\u003cp>대부분의 새는 다른 때에 번식하기 싫을 뿐 아니라 \u003cb class=\"key\">신체적으로 \u003c/b>\u003cb class=\"key\">불가능\u003c/b>하다. \u003cb class=\"key\">번식 \u003c/b>\u003cb class=\"key\">기관\u003c/b>이 줄어들어 날 때 몸무게를 줄이는 이점이 있기 때문이다. 그런데 \u003cb class=\"key\">유목성 \u003c/b>\u003cb class=\"key\">사막 \u003c/b>\u003cb class=\"key\">종\u003c/b>은 비가 오면 며칠 만에 번식 주기를 시작하는 주요 예외다. 이는 갑작스러운 \u003cb class=\"key\">번식 \u003c/b>\u003cb class=\"key\">기회\u003c/b>를 최대한 활용하기 위한 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>종별로 다른 새끼 수\u003csmall>분류·예시 · 문장 10–13\u003c/small>\u003c/h4>\u003cp>또한 종마다 \u003cb class=\"key\">번식 \u003c/b>\u003cb class=\"key\">기간\u003c/b>을 나누는 방식이 다르다. 대부분의 \u003cb class=\"key\">바닷새\u003c/b>는 한 배의 새끼만 기르지만, 따뜻한 지역의 \u003cb class=\"key\">명금\u003c/b>은 몇 달 안에 여러 가족을 기를 수 있다. 특히 참새는 좋은 해에 \u003cb class=\"key\">마라톤과 \u003c/b>\u003cb class=\"key\">같은 \u003c/b>\u003cb class=\"key\">번식 \u003c/b>\u003cb class=\"key\">노력\u003c/b>으로 여러 배의 새끼를 연이어 기른다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 전체 흐름을 크게 네 부분으로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 적도와 온대 극지방을 대비하는 부분이에요. 적도 근처에서는 많은 새가 일 년 내내 번식하지만, 온대와 극지방에서는 번식 시기가 뚜렷하게 정해져요. 이 대비를 통해 계절이 있는 지역의 번식이 특정 시기에 집중된다는 점을 알 수 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 번식기를 촉발하는 원인과 결과가 나와요. 번식기는 주로 낮 길이의 변화에 의해 시작돼요. 모든 것이 잘되면 먹이 공급이 최고조에 이를 때 새끼를 기르게 되죠. 그래서 환경 신호가 번식 타이밍을 결정한다고 이해하면 돼요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 대부분 새의 신체적 제약과 예외를 다뤄요. 대부분의 새는 다른 때에 번식을 꺼릴 뿐 아니라 몸도 그렇게 할 수 없어요. 번식 기관이 줄어들어 날면서 몸무게를 아낄 수 있기 때문이죠. 그런데 유목성 사막 종은 비가 오면 며칠 안에 번식 주기를 시작하는 주요 예외예요. 이는 갑작스러운 번식 기회를 최대한 활용하려는 전략이에요.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 종마다 새끼를 몇 번 기르는지에 대한 내용이에요. 대부분의 바닷새는 한 배의 새끼만 기르고, 따뜻한 지역의 명금은 몇 달 안에 여러 가족을 기를 수 있어요. 특히 참새는 환경이 좋은 해에는 마라톤 같은 번식 노력으로 여러 배의 새끼를 연이어 기르죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 적도 지역의 연중 번식을 제시한 뒤, 두 번째 문장에서 온대·극지방의 번식기가 뚜렷하게 정해진다는 초점을 드러낸다. 이후 \u003cb class=\"key\">낮 \u003c/b>\u003cb class=\"key\">길이의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>, \u003cb class=\"key\">먹이 \u003c/b>\u003cb class=\"key\">공급 \u003c/b>\u003cb class=\"key\">최고조\u003c/b>, \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">제약\u003c/b>, 사막 예외, 종별 새끼 수 차이를 덧붙인다. 대조 신호어 But, however와 예외 신호어 The main exception이 글의 뼈대를 이룬다. 따라서 두괄식 구조로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>mainly (3)\u003c/b>\u003cspan>주된 원인\u003c/span>\u003cb>If all goes well (4)\u003c/b>\u003cspan>조건\u003c/span>\u003cb>not simply...but also (5)\u003c/b>\u003cspan>첨가·강조\u003c/span>\u003cb>This is because (6)\u003c/b>\u003cspan>원인·근거\u003c/span>\u003cb>The main exception (7)\u003c/b>\u003cspan>예외 제시\u003c/span>\u003cb>Also (10)\u003c/b>\u003cspan>추가 정보\u003c/span>\u003cb>however (12)\u003c/b>\u003cspan>대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">breed all year round\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">breeding seasons\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">raise their young\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">breeding cycle\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">breeding season\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">raise a single brood\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">raise several families\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">raise successive broods\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>온대·극지방 새\u003c/th>\u003cth>유목성 사막 종\u003c/th>\u003c/tr>\u003ctr>\u003ctd>낮 길이 변화가 번식기를 촉발한다\u003c/td>\u003ctd>비가 오면 며칠 안에 번식 주기를 시작한다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>번식 기관이 줄어들어 비번식기 번식이 어렵다\u003c/td>\u003ctd>갑작스러운 번식 기회를 최대한 활용한다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 뚜렷한 주제문 하나만으로 요약하기보다는 새의 번식과 관련된 여러 정보를 순서대로 제시하는 두괄식 설명문이에요. 첫 번째 문장에서 적도 지역을 배경으로 깔고, 두 번째 문장이 온대와 극지방의 번식기라는 핵심 대상을 드러냅니다. 이후 낮 길이, 신체적 제약, 예외, 종별 차이가 뒤따라요. 따라서 앞부분에서 초점을 잡고 뒤에서 상세 정보를 붙이는 구조로 읽으면 좋아요.","hl":"ty"},{"n":9,"text":"신호어로는 But이 이끄는 대조, This is because가 이끄는 원인 설명, The main exception이 이끄는 예외 제시, Also가 이끄는 추가 정보를 주목하세요. 또 breeding season, breeding cycle, raise successive broods처럼 번식 관련 표현이 반복되면서 같은 개념을 다시 말해 주고 있어요. 이 표현들을 연결하면 글의 중심 흐름을 놓치지 않아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>equator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>적도\u003c/span>\u003c/div>\u003cdiv>\u003cb>breed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>번식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>all year round\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일 년 내내\u003c/span>\u003c/div>\u003cdiv>\u003cb>temperate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>온대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>polar\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>극지방의\u003c/span>\u003c/div>\u003cdiv>\u003cb>breeding season\u003c/b>\u003cem>명사\u003c/em>\u003cspan>번식기\u003c/span>\u003c/div>\u003cdiv>\u003cb>sharply defined\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>뚜렷하게 정해진\u003c/span>\u003c/div>\u003cdiv>\u003cb>trigger\u003c/b>\u003cem>동사\u003c/em>\u003cspan>촉발하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>day length\u003c/b>\u003cem>명사\u003c/em>\u003cspan>낮의 길이\u003c/span>\u003c/div>\u003cdiv>\u003cb>outcome\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>raise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at its peak\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>최고조에\u003c/span>\u003c/div>\u003cdiv>\u003cb>reluctant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>꺼리는\u003c/span>\u003c/div>\u003cdiv>\u003cb>incapable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>할 수 없는\u003c/span>\u003c/div>\u003cdiv>\u003c ss=\"m\">잇따른\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">consecutive\u003c/span>\u003cspan class=\"s\">sequential\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리할게요. trigger는 initiate, activate와 바꿔 쓸 수 있고 반대말은 prevent, inhibit입니다. reluctant는 unwilling, hesitant와 비슷하고 willing, eager와 반대예요. incapable는 unable과 가깝고 capable, able과 반대입니다. shrink는 contract, reduce와 비슷하고 expand, swell과 반대죠. initiate는 begin, start와 가깝고 terminate, end와 반대예요. exception은 anomaly와 비슷하고 rule이나 norm과 반대입니다. successive는 consecutive, sequential과 가깝죠.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적도 근처에서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Near \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">equator,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새의 많은 종들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">species \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">bird \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일 년 내내 번식한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">breed\u003c/span> all year round.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">적도 근처에서, 새의 많은 종들은 일 년 내내 번식한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 적도 근처에서는 많은 새가 일 년 내내 번식한다는 일반적 사실을 제시하며, 뒤에 나올 온대·극지방과 \u003cb class=\"key\">대조\u003c/b>되는 기준점을 만든다. 'breed all year round'는 계절의 제약 없이 연중 번식한다는 뜻으로, 번식기가 특별히 정해져 있지 않음을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(장소)\u003c/span> : Near + [the equator] (전치사 + 명사구) : \"적도 근처에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : many species(복수 주어) + breed(복수 동사) : \"많은 종들이 번식한다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Near the equator, 적도 근처에서. many species of bird, 새의 많은 종들은. breed all year round, 일 년 내내 번식한다.. 이 문장 전체를 해석하면, 적도 근처에서, 새의 많은 종들은 일 년 내내 번식한다.","hl":"m"},{"n":13,"text":"이 문장은 적도 근처에서는 많은 종의 새가 일 년 내내 번식한다는 일반적인 사실을 제시합니다. all year round는 계절의 제약 없이 연중 내내라는 뜻입니다. 이 내용은 뒤에 나올 온대와 극지방의 번식기와 대조되는 기준점이 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째로 Near the equator는 문장 맨 앞에서 장소의 배경을 제시하는 전치사구 부사구입니다. 주어와 동사의 수 일치에는 영향을 주지 않아요. 두 번째로 many species of bird breed에서 many species는 복수로 취급되기 때문에 동사 breed도 복수형으로 쓰였습니다. bird는 단수지만 새라는 종류 전체를 대표하는 표현이라는 점도 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 온대와 극지방에서는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">But\u003c/span> in temperate and polar regions,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새들의 번식기들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">breeding \u003c/span>\u003cspan class=\"tgt\">seasons \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">birds\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대개 뚜렷하게 정해진다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">sharply \u003c/span>\u003cspan class=\"tgt\">defined\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 온대와 극지방에서는 새들의 번식기들이 대개 뚜렷하게 정해진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 문장은 But으로 방향을 전환하여 온대와 극지방의 번식기는 \u003cb class=\"key\">뚜렷하게 \u003c/b>\u003cb class=\"key\">정해진다\u003c/b>고 말한다. 'sharply defined'는 계절적으로 경계가 분명하다는 뜻이며, 이는 뒤에 제시될 \u003cb class=\"key\">낮의 \u003c/b>\u003cb class=\"key\">길이\u003c/b>라는 원인과 연결된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대조의 접속사\u003c/span> : But + S + V ~ : \"하지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of의 소유격 용법\u003c/span> : A of B (B의 A) : \"새들의 번식기들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태(be + pp)\u003c/span> : be동사(are) + 부사(often) + 과거분사(defined) : \"대개 뚜렷하게 정해진다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But in temperate and polar regions, 하지만 온대와 극지방에서는. the breeding seasons of birds, 새들의 번식기들이. are often sharply defined, 대개 뚜렷하게 정해진다.. 이 문장 전체를 해석하면, 하지만 온대와 극지방에서는 새들의 번식기들이 대개 뚜렷하게 정해진다.","hl":"m"},{"n":16,"text":"두 번째 문장은 But으로 방향을 바꿔서 온대와 극지방에서는 새들의 번식기가 대개 뚜렷하게 정해진다고 말합니다. sharply defined는 계절적 경계가 분명하다는 뜻이에요. 이 문장은 다음 문장에서 원인이 설명될 번식기의 특징을 먼저 제시합니다.","hl":"mn"},{"n":17,"text":"첫 번째로 But은 앞 문장의 내용과 반대 방향 정보를 연결하는 대조의 접속사입니다. 두 번째로 the breeding seasons of birds는 of가 소유 관계를 나타내서 새들의 번식기들이라고 해석해요. 세 번째로 are often sharply defined는 be 동사와 과거분사가 결합한 수동태입니다. 번식기가 스스로 정해지는 것이 아니라 외부 요인에 의해 정해진다는 수동의 의미를 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 촉발된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">They\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">triggered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주로 변화에 의해\u003c/span>\u003cspan class=\"en\">mainly \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">changes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낮의 길이의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">day \u003c/span>\u003cspan class=\"tgt\">length\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 주로 낮의 길이의 변화에 의해 촉발된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 문장은 앞 문장의 번식기가 정해지는 원인을 짚는다. 새들의 번식기는 주로 \u003cb class=\"key\">낮의 \u003c/b>\u003cb class=\"key\">길이의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>에 의해 촉발되며, 이는 생물이 환경 신호에 반응하는 \u003cb class=\"key\">광주기성\u003c/b>의 예로 볼 수 있다. 대명사 They가 앞 문장의 breeding seasons를 가리킨다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">인칭 대명사의 문맥 지시\u003c/span> : They = the breeding seasons : \"그것들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(be + pp)\u003c/span> : be동사(are) + 과거분사(triggered) : \"촉발된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태의 행위자 표시 by\u003c/span> : by + 명사구(changes in day length) : \"낮의 길이의 변화에 의해\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"They are triggered, 그것들은 촉발된다. mainly by changes, 주로 변화에 의해. in day length, 낮의 길이의. 이 문장 전체를 해석하면, 그것들은 주로 낮의 길이의 변화에 의해 촉발된다.","hl":"m"},{"n":19,"text":"세 번째 문장은 앞 문장의 번식기가 정해지는 원인을 설명합니다. 대명사 They는 앞 문장의 the breeding seasons of birds를 가리켜요. 새들의 번식기는 주로 낮의 길이 변화에 의해 촉발된다는 뜻으로, 생물이 환경 신호에 반응하는 원리를 보여 줍니다.","hl":"mn"},{"n":20,"text":"첫 번째로 They는 앞 문장에 나온 the breeding seasons of birds를 대신 받는 인칭 대명사입니다. 이렇게 대명사를 쓰면 문장 연결이 자연스러워져요. 두 번째로 are triggered는 be 동사와 과거분사가 결합한 수동태입니다. 세 번째로 by changes in day length는 수동태에서 행위자를 나타내는 by 전치사구로 낮의 길이의 변화에 의해라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 모든 것이 잘 진행된다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">goes \u003c/span>\u003cspan class=\"tgt\">well\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결과는 ~이다\u003c/span>\u003cspan class=\"en\">the outcome is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새들이 새끼들을 기르는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">birds \u003c/span>\u003cspan class=\"tgt\">raise \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">young\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먹이 공급이 최고조에 이를 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">food \u003c/span>\u003cspan class=\"tgt\">supply \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">peak\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약에 모든 것이 잘 진행된다면, 결과는 새들이 먹이 공급이 최고조에 이를 때 새끼들을 기르는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모든 조건이 잘 맞아떨어지면 새끼를 기르는 시기가 \u003cb class=\"key\">먹이 \u003c/b>\u003cb class=\"key\">공급\u003c/b>이 \u003cb class=\"key\">최고조\u003c/b>에 달하는 때와 정확히 겹친다는 뜻이에요. 이 문장은 앞의 번식 시기 결정이 단순한 습관이 아니라 새끼 생존에 유리한 \u003cb class=\"key\">환경적 \u003c/b>\u003cb class=\"key\">설계\u003c/b>임을 보여 줘요. 'all goes well'은 날씨와 먹이 조건 등이 모두 좋은 상황을 뜻하는 비유적 표현이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 if\u003c/span> : if + 주어 + 현재시제, 주절 : \"만약 모든 것이 잘 진행된다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that절의 주격 보어\u003c/span> : 주어 + be + that절 (명사절 보어) : \"새들이 새끼들을 기르는 것이라는 결과\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간의 부사절 when\u003c/span> : when + 주어 + 동사 : \"먹이 공급이 최고조에 이를 때\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"If all goes well, 만약 모든 것이 잘 진행된다면. the outcome is, 결과는 ~이다. that birds raise their young, 새들이 새끼들을 기르는 것. when the food supply is at its peak, 먹이 공급이 최고조에 이를 때. 이 문장 전체를 해석하면, 만약에 모든 것이 잘 진행된다면, 결과는 새들이 먹이 공급이 최고조에 이를 때 새끼들을 기르는 것이다.","hl":"m"},{"n":22,"text":"이 문장은 모든 조건이 잘 맞아떨어지면 새끼를 기르는 시기가 먹이 공급이 최고조에 달하는 때와 정확히 겹친다는 뜻이에요. 앞 문장의 번식 시기 결정이 단순한 습관이 아니라 새끼 생존에 유리한 환경적 설계임을 보여 주죠. 여기서 all goes well은 날씨와 먹이 조건이 모두 좋은 상황을 뜻하는 비유적 표현이에요.","hl":"mn"},{"n":23,"text":"네 번째 문장의 어법 포인트를 짚어 볼게요. 첫 번째, If all goes well은 조건의 부사절로 미래가 아니라 현재시제 goes로 씁니다. 두 번째, that birds raise their young은 the outcome을 보충 설명하는 명사절로 주격 보어 역할을 해요. 세 번째, when the food supply is at its peak는 시간의 부사절로 새끼를 기르는 시점을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 새들은 ~이다\u003c/span>\u003cspan class=\"en\">Most birds are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 번식하기를 꺼리는 것만이 아니라\u003c/span>\u003cspan class=\"en\">not simply \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">reluctant \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\" 이다. physically incapable of doing so, 신체적으로 그렇게 할 수 없는. 이 문장 전체를 해석하면, 대부분의 새들은 다른 때에 번식하기를 단지 꺼리는 것뿐만 아니라 또한 신체적으로 그렇게 할 수 없는 것이다.","hl":"m"},{"n":25,"text":"이 문장은 대부분의 새들이 번식 시기가 지나면 하기 싫다는 심리적 거부에 그치지 않고 몸이 따라주지 않는 생리적 불능 상태가 된다는 뜻이에요. 번식 시기가 엄격히 정해진 이유가 단순한 선택이 아니라 신체적 한계 때문임을 강조하죠. 뒤 문장에서 그 신체적 이유로 생식 기관 축소를 설명해 줘요.","hl":"mn"},{"n":26,"text":"다섯 번째 문장의 어법 포인트입니다. 첫 번째, reluctant to breed에서 to breed는 감정의 원인을 나타내는 to부정사의 부사적 용법으로 꺼리다라는 형용사를 수식해요. 두 번째, doing so는 앞에 나온 breed at other times를 대신하는 표현으로 여기서 so는 대동사 역할을 합니다. 세 번째, incapable of doing so는 형용사 incapable이 전치사 of와 함께 쓰이고 뒤에 동명사 doing이 와야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 왜냐하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">because\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 번식 기관이 줄어들기 때문이고\u003c/span>\u003cspan class=\"en\">their reproductive system shrinks,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 사실은 나는 새들이 몸무게를 줄일 수 있도록 도와준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">helps \u003c/span>\u003cspan class=\"tgt\">flying \u003c/span>\u003cspan class=\"tgt\">birds \u003c/span>\u003cspan class=\"tgt\">save \u003c/span>\u003cspan class=\"tgt\">weight\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 왜냐하면 그들의 번식 기관이 줄어들기 때문이고, 이 사실은 나는 새들이 몸무게를 줄일 수 있도록 도와준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 번식기가 아니면 새들의 \u003cb class=\"key\">번식 \u003c/b>\u003cb class=\"key\">기관\u003c/b>이 크게 줄어드는데, 그래서 몸이 가벼워지고 날기에 유리해져요. 이 문장은 왜 대부분의 새들이 번식기에만 번식할 수밖에 없는지 그 \u003cb class=\"key\">생물학적 \u003c/b>\u003cb class=\"key\">이유\u003c/b>를 설명해 줘요. 날아다니는 새에게 무게를 줄이는 것은 생존을 위한 중요한 \u003cb class=\"key\">적응 \u003c/b>\u003cb class=\"key\">전략\u003c/b>이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">because 보어절\u003c/span> : This is because + 주어 + 동사 : \"이것은 왜냐하면 ~ 때문이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 which의 계속적 용법\u003c/span> : 선행사, + which + 동사 : \"이 사실은 나는 새들이 몸무게를 줄일 수 있도록 도와준다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">help + 목적어 + 목적격보어(원형부정사)\u003c/span> : help + 목적어 + 동사원형 : \"나는 새들이 몸무게를 줄일 수 있도록 도와준다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This is because, 이것은 왜냐하면. their reproductive system shrinks, 그들의 번식 기관이 줄어들기 때문이고. which helps flying birds save weight, 이 사실은 나는 새들이 몸무게를 줄일 수 있도록 도와준다. 이 문장 전체를 해석하면, 이것은 왜냐하면 그들의 번식 기관이 줄어들기 때문이고, 이 사실은 나는 새들이 몸무게를 줄일 수 있도록 도와준다.","hl":"m"},{"n":28,"text":"이 문장은 번식기가 아니면 새들의 번식 기관이 크게 줄어들고 그래서 몸이 가벼워져 날기에 유리해진다는 뜻이에요. 왜 대부분의 새들이 번식기에만 번식할 수밖에 없는지 그 생물학적 이유를 설명해 주죠. 날아다니는 새에게 무게를 줄이는 것은 생존을 위한 중요한 적응 전략이에요.","hl":"mn"},{"n":29,"text":"여섯 번째 문장의 어법 포인트입니다. 첫 번째, This is because에서 because절은 주격 보어 자리에 오는 명사절로 이유를 설명해요. 두 번째, which helps flying birds save weight에서 which는 앞의 their reproductive system shrinks 전체를 선행사로 받는 관계대명사의 계속적 용법이고 and this처럼 해석해요. 세 번째, helps flying birds save weight는 help 목적어 동사원형 구조로 help가 목적어 flying birds 뒤에 원형부정사 save를 목적격 보어로 취하는 형태입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 규칙에 대한 주요 예외가\u003c/span>\u003cspan class=\"en\">The main exception to this rule\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유목성 사막 종들이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">nomadic \u003c/span>\u003cspan class=\"tgt\">desert \u003c/span>\u003cspan class=\"tgt\">species\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유목성 사막 종은 이 규칙의 주요 예외이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 '대부분의 새는 번식기가 정해져 있고 생식 기관이 위축되어 시기를 놓치면 번식할 수 없다'는 내용을 받아, 그 규칙의 가장 큰 예외가 \u003cb class=\"key\">유목성 \u003c/b>\u003cb class=\"key\">사막 \u003c/b>\u003cb class=\"key\">종\u003c/b>이라는 점을 제시하는 문장이에요. 'main exception'은 \u003cb class=\"key\">주요 \u003c/b>\u003cb class=\"key\">예외\u003c/b>라는 뜻이고, 여기서 'this rule'은 바로 앞에 말한 일반적인 번식 규칙을 가리켜요. 문장 구조는 보어인 'the main exception'이 앞에 와서 강조된 \u003cb class=\"key\">도치\u003c/b> 문장으로 이해할 수 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">도치(보어+동사+주어)\u003c/span> : The main exception to this rule(보어) + are(동사) + nomadic desert species(주어) : \"유목성 사막 종들이 있다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The main exception to this rule, 이 규칙에 대한 주요 예외가. are, ~이다. nomadic desert species, 유목성 사막 종들이다. 이 문장 전체를 해석하면, 유목성 사막 종은 이 규칙의 주요 예외이다.","hl":"m"},{"n":31,"text":"이 문장은 앞서 말한 일반적인 번식 규칙에 대한 주요 예외를 알려주는 문장이에요. 대부분의 새는 낮 길이 변화에 맞춰 번식기를 정하고 번식기가 지나면 생식 기관이 위축되지만, 유목성 사막 종은 여기서 제외된답니다. 여기서 주의할 점은 문장의 보어가 앞으로 나온 도치 구조라는 점이에요.","hl":"mn"},{"n":32,"text":"어법 포인트는 도치입니다. 원래라면 nomadic desert species are the main exception to this rule이라고 해야 하는데, 문장의 보어인 the main exception to this rule을 강조하려고 문장 앞으로 보냈어요. 그러면서 진짜 주어인 nomadic desert species가 동사 are 뒤에 오는 도치 구조가 만들어졌어요. 동사 are는 뒤에 있는 주어 species에 맞춰 복수로 쓰였다는 점도 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이들은\u003c/span>\u003cspan class=\"en\">These\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시작할 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">initiate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 번식 주기를\u003c/span>\u003cspan class=\"en\">their breeding cycle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비가 온 지 며칠 안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">within \u003c/span>\u003cspan class=\"tgt\">days \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">rain\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이들은 비가 오는 날들에 번식 주기를 시작할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에 나온 유목성 사막 종이 예외적으로 번식하는 방식을 구체적으로 설명해요. 'These'는 유목성 사막 종을 가리키며, 이들은 날씨나 낮 길이 변화가 아니라 비가 오는 순간을 신호로 삼아 \u003cb class=\"key\">번식 \u003c/b>\u003cb class=\"key\">주기\u003c/b>를 시작한다는 뜻이에요. 'within days of rain'은 '비가 온 지 며칠 안에'라는 표현으로 사막에서 비가 오면 곧바로 번식에 들어간다는 \u003cb class=\"key\">신속성\u003c/b>을 강조해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : These(주어) + can(조동사) + initiate(동사원형) : \"시작할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구(시간 부사구)\u003c/span> : within + days + of + rain : \"비가 온 지 며칠 안에\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"These, 이들은. can initiate, 시작할 수 있다. their breeding cycle, 그들의 번식 주기를. within days of rain, 비가 온 지 며칠 안에. 이 문장 전체를 해석하면, 이들은 비가 오는 날들에 번식 주기를 시작할 수 있다.","hl":"m"},{"n":34,"text":"앞 문장의 유목성 사막 종이 비가 오면 바로 번식 주기를 시작한다는 구체적인 정보를 주는 문장이에요. within days of rain이 비가 온 지 며칠 안에라는 뜻이라서, 사막의 비가 번식 신호가 된다는 점을 함께 이해해야 해요. 일반 새들이 낮 길이 변화에 반응하는 것과 대비되는 부분이죠.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 조동사 can입니다. can은 능력이나 가능을 나타내는 조동사인데 뒤에 반드시 동사원형이 오죠. 여기서도 initiate가 동사원형으로 와서 시작할 수 있다라는 뜻을 만들어요. 두 번째 어법 포인트는 within days of rain이라는 전치사구입니다. 이 전체가 비가 온 지 며칠 안에라는 시간의 부사 역할을 해서 initiate를 수식해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 만들기 위한 것이다\u003c/span>\u003cspan class=\"en\">It's for \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">④ \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갑작스러운 번식 기회를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> the sudden breeding opportunity.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 갑작스러운 번식 기회를 최대한으로 활용하기 위한 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사막 종이 비가 오면 며칠 안에 번식 주기를 시작하는 이유를 설명해요. 'It'은 앞 문장의 그런 능력, 곧 비가 온 지 며칠 안에 번식 주기를 개시하는 능력을 받아요. 'making the most of'는 '~을 최대한 활용하다'라는 뜻의 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로, 사막에 비가 왔을 때 생기는 \u003cb class=\"key\">갑작스러운 \u003c/b>\u003cb class=\"key\">번식 \u003c/b>\u003cb class=\"key\">기회\u003c/b>를 놓치지 않고 최대한 이용한다는 의미를 담고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 make the most of\u003c/span> : make the most of + 명사(기회) : \"~을 최대한 활용하다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"It's for making, 그것은 만들기 위한 것이다. the 네 번째 most, 최대한. of the sudden breeding opportunity, 갑작스러운 번식 기회를. 이 문장 전체를 해석하면, 그것은 갑작스러운 번식 기회를 최대한으로 활용하기 위한 것이다.","hl":"m"},{"n":37,"text":"이 문장은 유목성 사막 종이 비가 오자마자 번식 주기를 시작하는 이유를 설명해요. make the most of는 무엇을 최대한 활용하다라는 뜻의 중요한 표현이에요. 사막에 비가 오면 먹이가 갑자기 많아지는데, 그 짧은 번식 기회를 최대로 이용하려고 바로 번식한다는 거예요.","hl":"mn"},{"n":38,"text":"이 문장의 어법 포인트는 관용 표현 make the most of입니다. make the most of는 뒤에 목적어를 써서 무엇을 최대한 활용한다는 뜻이에요. 여기서는 목적어로 the sudden breeding opportunity가 왔고, 갑작스러운 번식 기회를 최대한 활용한다는 의미가 됩니다. 이 표현은 문장에서 그대로 묶어서 외워 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한,\u003c/span>\u003cspan class=\"en\">Also,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 종들은\u003c/span>\u003cspan class=\"en\">different species\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">번식 기간을 나눈다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">divide \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">breeding \u003c/span>\u003cspan class=\"tgt\">season \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 방식으로.\u003c/span>\u003cspan class=\"en\">in different ways.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한, 다른 종들은 번식 기간을 다른 방식으로 나눈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장들에서 번식 시기와 예외적 경우를 다뤘고, 이 문장은 종마다 번식 기간을 활용하는 방식이 다르다는 사실을 여는 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">문장\u003c/b>이다. divide the breeding season up은 번식 기간을 쪼개어 사용한다는 뜻이고, in different ways는 종마다 서로 다른 번식 전략을 가리킨다. 이 문장 뒤에 바닷새와 명금의 구체적 사례가 이어진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분리 가능한 구동사\u003c/span> : divide + 목적어 + up: ~을 나누다 : \"번식 기간을 나눈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 명사 수식\u003c/span> : breeding + season: 번식하는 계절 : \"번식(하기 위한) 계절\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Also, 또한. different species, 다른 종들은. divide the breeding season up, 번식 기간을 나눈다. in different ways, 다른 방식으로.. 이 문장 전체를 해석하면, 또한, 다른 종들은 번식 기간을 다른 방식으로 나눈다.","hl":"m"},{"n":40,"text":"이 문장은 문단의 도입 문장이에요. 종마다 번식 기간을 활용하는 방식이 서로 다르다는 점을 먼저 밝히고, 이어서 바닷새와 명금의 사례를 끌어오죠. divide the breeding season up은 번식 기간을 쪼개어 사용한다는 뜻이고, in different ways는 종마다 다른 번식 전략을 가리킵니다.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 divide the breeding season up이에요. divide up처럼 동사와 부사가 결합한 구동사는 목적어가 길면 동사와 부사 사이에 넣어서 뜻을 명확하게 해요. 여기서는 the breeding season이 사이에 들어가서 번식 기간을 나눈다는 뜻이 되죠. 두 번째 어법 포인트는 breeding이에요. breed에 ing가 붙어 season을 수식하는 형태로, 번식을 위한 계절이라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 바닷새들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Most \u003c/span>\u003cspan class=\"tgt\">seabirds\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">raise\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 무리의 함께 태어난 새끼를.\u003c/span>\u003cspan class=\"en\">a single brood.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분의 바닷새들은 한 무리의 함께 태어난 새끼를 기른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 제시한 종마다 다른 번식 방식을 뒷받침하는 첫 번째 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>이다. Most seabirds는 대부분의 바닷새들이라는 뜻이고, a single brood는 한 배의 함께 태어난 새끼 집단을 가리킨다. 바닷새는 번식 기간에 한 번의 새끼 집단만 기른다는 점을 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">most 한정사의 복수명사 수식\u003c/span> : most + [복수명사] + 복수동사: 대부분의 ~들 : \"대부분의 바닷새들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">타동사의 목적어\u003c/span> : raise + [목적어]: ~을 기르다 : \"한 무리의 새끼를 기른다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Most seabirds, 대부분의 바닷새들은. raise, 기른다. a single brood, 한 무리의 함께 태어난 새끼를.. 이 문장 전체를 해석하면, 대부분의 바닷새들은 한 무리의 함께 태어난 새끼를 기른다.","hl":"m"},{"n":43,"text":"이 문장은 앞 문장에서 말한 종마다 다른 번식 방식을 뒷받침하는 첫 번째 사례예요. 대부분의 바닷새들은 번식 기간에 한 배의 새끼만 기른다는 뜻이죠. brood는 함께 태어난 새끼 집단을 가리키고, single은 단 하나의 배를 강조해요.","hl":"mn"},{"n":44,"text":"첫 번째 어법 포인트는 Most seabirds에요. most는 뒤에 복수명사를 이끌어 대부분의 바닷새들이라는 뜻을 만들어요. 동사도 복수형 raise로 받는 게 자연스럽죠. 두 번째 어법 포인트는 raise인데요. raise는 타동사라서 뒤에 목적어가 필요해요. 여기서는 a single brood를 목적어로 취해서 한 배의 새끼를 기른다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따뜻한 지역에서는,\u003c/span>\u003cspan class=\"en\">In warm regions,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">however\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명금(鳴禽)들이\u003c/span>\u003cspan class=\"en\">songbirds\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기를 수도 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">raise\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 자녀들을\u003c/span>\u003cspan class=\"en\">several families\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 달 안에.\u003c/span>\u003cspan class=\"en\">in a few months.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나, 따뜻한 지역에서는, 명금(鳴禽)들이 몇 달 안에 여러 자녀들을 기를 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 바닷새 사례와 대조되는 두 번째 사례이다. 따뜻한 지역의 명금들은 몇 달 안에 여러 배의 새끼를 기를 수도 있다는 뜻으로, 환경과 종에 따라 번식 기간 활용이 크게 다름을 보여준다. however는 앞뒤 문장을 \u003cb class=\"key\">대조\u003c/b>하고, may는 가능성을 나타내어 단정을 피한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사의 대조 기능\u003c/span> : however: 그러나, 하지만 : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 may의 가능성 용법\u003c/span> : may + 동사원형: ~할 수도 있다, ~일지도 모른다 : \"기를 수도 있다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"In warm regions, 따뜻한 지역에서는. however, 그러나. songbirds, 명금(鳴禽)들이. may raise, 기를 수도 있다. several families, 여러 자녀들을. in a few months, 몇 달 안에.. 이 문장 전체를 해석하면, 그러나, 따뜻한 지역에서는, 명금(鳴禽)들이 몇 달 안에 여러 자녀들을 기를 수도 있다.","hl":"m"},{"n":46,"text":"이 문장은 앞의 바닷새 사례와 대조되는 두 번째 사례예요. 따뜻한 지역의 명금들은 몇 달 안에 여러 배의 새끼를 기를 수도 있다는 뜻이죠. however가 대조를 만들어 주고 may는 가능성을 나타냅니다.","hl":"mn"},{"n":47,"text":"첫 번째 어법 포인트는 however에요. however는 접속부사로 앞 문장과의 대조를 만들어 주죠. 접속사가 아니기 때문에 두 개의 절을 콤마 하나로 연결하지 못한다는 점을 조심해야 해요. 두 번째 어법 포인트는 may raise인데요. may는 가능성을 나타내는 조동사라서 뒤에 동사원형 raise가 와요. 따라서 기를 수도 있다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유난히 좋은 해에는\u003c/span>\u003cspan class=\"en\">In an exceptionally good year,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">참새 한 쌍은\u003c/span>\u003cspan class=\"en\">a pair of House Sparrows,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명금의 한 종류인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">songbird,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잇따라 태어난 여러 무리의 새끼들을 기를 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">raise\u003c/span> successive broods\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마라톤과 같은 번식 노력을 통해\u003c/span>\u003cspan class=\"en\">through a marathon reproductive effort.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유난히 좋은 해에는 명금(鳴禽)의 한 종류인 참새 한 쌍은 마라톤과 같은 번식 노력을 통해 잇따라 태어난 여러 무리의 함께 태어난 새끼들을 기를 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 언급한 따뜻한 지역의 \u003cb class=\"key\">명금\u003c/b>이 여러 가족을 기른다는 일반적 내용을 구체적 사례로 뒷받침한다. 유난히 좋은 해에 참새 한 쌍이 \u003cb class=\"key\">마라톤\u003c/b> 같은 번식 노력으로 \u003cb class=\"key\">연속적인 \u003c/b>\u003cb class=\"key\">새끼 \u003c/b>\u003cb class=\"key\">무리\u003c/b>를 기른다는 뜻으로, 번식이 얼마나 길고 힘든 과정인지 비유적으로 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격 (apposition)의 콤마 사용\u003c/span> : 선행 명사구, 동격 명사구, ... : \"명금의 한 종류인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : can [동사원형] : \"기를 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"In an exceptionally good year, 유난히 좋은 해에는. a pair of House Sparrows, 참새 한 쌍은. a kind of songbird, 명금의 한 종류인. can raise successive broods, 잇따라 태어난 여러 무리의 새끼들을 기를 수 있다. through a marathon reproductive effort, 마라톤과 같은 번식 노력을 통해. 이 문장 전체를 해석하면, 유난히 좋은 해에는 명금(鳴禽)의 한 종류인 참새 한 쌍은 마라톤과 같은 번식 노력을 통해 잇따라 태어난 여러 무리의 함께 태어난 새끼들을 기를 수 있다.","hl":"m"},{"n":49,"text":"이 문장은 앞 문장에서 말한 노래하는 새들이 따뜻한 지역에서 여러 가족을 기른다는 내용을 구체적인 예로 보여 줍니다. 유난히 좋은 해에는 참새 한 쌍이 마라톤처럼 길고 힘든 번식 노력을 통해 잇따라 여러 무리의 새끼를 기를 수 있다는 뜻이에요. 여기서 마라톤은 번식 노력의 길고 지속적인 성격을 비유한 거예요.","hl":"mn"},{"n":50,"text":"첫 번째 어법 포인트는 콤마로 둘러싸인 a kind of songbird라는 동격 표현이에요. 이건 앞에 있는 House Sparrows가 어떤 새인지 부연 설명해 주는 말이고, 문장에서 생략해도 성립하는 삽입 요소예요. 두 번째 어법 포인트는 can raise예요. 조동사 can은 뒤에 반드시 동사원형이 와야 하고, 여기서는 기를 수 있다는 능력을 나타내요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>새의 번식 시기는 \u003cb class=\"key\">지역\u003c/b>에 따라 달라, 적도 근처에서는 연중 번식이 나타난다.\u003c/li>\u003cli>온대·극지방에서는 \u003cb class=\"key\">낮 \u003c/b>\u003cb class=\"key\">길이의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 번식기를 촉발하고, 먹이 공급 최고조에 새끼를 기른다.\u003c/li>\u003cli>대부분의 새는 \u003cb class=\"key\">번식 \u003c/b>\u003cb class=\"key\">기관\u003c/b>이 줄어들어 다른 때 번식하기 어렵지만, \u003cb class=\"key\">유목성 \u003c/b>\u003cb class=\"key\">사막 \u003c/b>\u003cb class=\"key\">종\u003c/b>은 비를 계기로 번식한다.\u003c/li>\u003cli>종에 따라 \u003cb class=\"key\">한배 \u003c/b>\u003cb class=\"key\">새끼\u003c/b> 수가 달라, 바닷새는 한 배를, 따뜻한 지역의 명금은 여러 배를 기를 수 있다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Bird breeding seasons are mainly triggered by day length, constrained by reproductive physiology, with exceptions like desert species and variation in brood number among species.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">새의 번식 시기는 \u003cb class=\"key\">지역\u003c/b>에 따라 다르며, 온대·극지방은 주로 \u003cb class=\"key\">낮 \u003c/b>\u003cb class=\"key\">길이의 \u003c/b>\u003cb class=\"key\">변화\u003c/b>에 의해 번식기가 결정된다. 하지만 \u003cb class=\"key\">유목성 \u003c/b>\u003cb class=\"key\">사막 \u003c/b>\u003cb class=\"key\">종\u003c/b>은 비를 계기로 번식하고, 종에 따라 한 시즌에 기르는 \u003cb class=\"key\">무리 \u003c/b>\u003cb class=\"key\">수\u003c/b>도 다르다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"오늘 지문은 새의 번식 시기가 환경 요인과 신체 조건에 따라 결정된다는 내용이었어요. 온대와 극지방에서는 낮 길이 변화가 신호가 되고, 사막에서는 비가 신호가 되죠. 또 종마다 한 배 또는 여러 배의 새끼를 기르는 방식이 달랐어요. 이제 문장 흐름과 핵심 어휘를 다시 복습하면서 마무리할게요. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
