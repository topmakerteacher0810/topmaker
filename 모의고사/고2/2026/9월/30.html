2P4enp+tIWJxnHHTgZ5GOv0/nRjJGGTksPvL1XOR94cdM/XGORkC54yOM9xnI6jAPqD25/Si0E9LeV2m09n+qEkk9vwXT+vwv5tMnGM+uOOvT8f4QPw7c0hGe/X88j1+v48cetLwRkMuMkfeH+OP1z9RQRj0/76X2zjnn27e/endd182v87Ff1/X9f5h1x9B6duB6fTnnHPSkIz/noe2c8f079qUEHphuccEE56Y6kcZznH49BSkY9PzHHXjqO3U4HI/Muu6+9CWn9fdf5aX62E5GCevPQY5GO3+e+aOTkD0ye3p9On5DHFKemSR9PwyeBwMcZ/8A1ZaemB1z1wT19OfXpxx9OKOaKe6/O229r99upnKUndJcrW7XRdtNl960TtpYDg/T/PbPfvzzSNwjY5ODyfp04I78c+3elLKMncMdDyvUD2Pfg56fXujkYYAFi3ypjk8jt2J9B0OAcYzjKMm5Rb196L79Ve2y2Js27J69NdOjbs9bba29D//Z\" alt=\"\"></div>","<div class=\"lec-cover-title\">Eco-Guilt and Moral Licensing: The Psychological Balancing Act<small>친환경적 죄책감과 도덕적 허용: 심리적 균형 잡기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 읽기 전에 심리학에서 자주 다루는 &#39;도덕적 허용(Moral licensing)&#39;과 &#39;환경적 죄책감(Eco-guilt)&#39;이라는 개념을 알아두시면 좋습니다. 마치 다이어트 중에 점심으로 샐러드를 먹었으니 저녁에는 햄버거를 먹어도 괜찮다고 합리화하는 것처럼, 도덕적 허용(Moral licensing)은 착한 행동을 한 뒤에 다소 이기적이거나 나쁜 행동을 해도 스스로에게 면죄부를 주는 심리를 말해요. 반대로 환경에 해를 끼쳤을 때 느끼는 환경적 죄책감(Eco-guilt)은 마음을 매우 불편하게 만드는데, 이는 우리의 태도와 행동이 어긋날 때 발생하는 심리적 스트레스인 인지부조화(Cognitive dissonance) 이론의 원리로 설명할 수 있습니다. 인간은 이런 불편한 감정을 오래 견디지 못하기 때문에 이를 빠르게 씻어내고자 즉각적인 환경 보호 활동에 참여하는 등 보상 행동을 찾거나 자신의 과거 행동에 대한 평가를 바꾸며 무너진 심리적, 도덕적 균형을 회복하려고 노력한다는 점을 기억하시면 지문의 맥락이 훨씬 쉽게 다가올 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도덕적 허용</div><ul><li>친환경 제품을 구매한 후 자신이 선행을 했다고 여겨 비도덕적인 행동을 정당화하는 경향이 있습니다.</li><li>친환경(eco-friendly) 제품 구매 후 속이거나 훔칠 가능성 증가</li><li>스스로에게 면죄부를 주는 도덕적 허용(moral licensing) 심리 작용</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02친환경적 죄책감</div><ul><li>사람들은 자신이 과거에 환경에 해를 끼친 행동을 떠올릴 때 심리적인 불편함을 느낍니다.</li><li>환경에 유해한(harmful) 행동을 자각할 때 발생</li><li>이러한 불편한 감정은 친환경적 죄책감(eco-guilt)으로 이어짐</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03균형 회복과 임시방편</div><ul><li>죄책감에서 빠르게 벗어나고 도덕적인 균형을 되찾기 위해 즉각적인 해결책을 추구합니다.</li><li>죄책감을 보상(compensate)하고 도덕적 균형(balance)을 회복하려는 욕구</li><li>빠르고 쉽게 죄책감을 덜어줄 임시방편(quick-fixes)을 맹신하는 경향</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04태도 변화와 실천</div><ul><li>태도와 행동 사이의 모순을 줄이기 위해 과거와 미래의 환경 관련 행동에 대한 평가를 바꿉니다.</li><li>행동과 태도의 불일치(inconsistencies)를 줄이기 위한 인지적 노력</li><li>환경 훼손 증거를 본 후 탄원서에 서명(sign a petition)하는 실천 사례</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be likely to</td><td class=\"m\">~할 가능성이 있다, ~하기 쉽다</td></tr><tr><td class=\"w\">eco-friendly</td><td class=\"m\">친환경적인, 환경 친화적인</td></tr><tr><td class=\"w\">deed</td><td class=\"m\">행위, 행동</td></tr><tr><td class=\"w\">for the good of</td><td class=\"m\">~의 이익을 위하여, ~을 위하여</td></tr><tr><td class=\"w\">be reminded of</td><td class=\"m\">~을 상기하다, ~이 생각나다</td></tr><tr><td class=\"w\">harmful</td><td class=\"m\">해로운, 유해한</td></tr><tr><td class=\"w\">compensate for</td><td class=\"m\">~을 보상하다, ~을 상쇄하다</td></tr><tr><td class=\"w\">restore</td><td class=\"m\">회복시키다, 복구하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be inclined to</td><td class=\"m\">~하는 경향이 있다, ~하고 싶어 하다</td></tr><tr><td class=\"w\">quick-fix</td><td class=\"m\">임시방편, 즉각적인 해결책</td></tr><tr><td class=\"w\">inconsistency</td><td class=\"m\">불일치, 모순</td></tr><tr><td class=\"w\">burden</td><td class=\"m\">부담을 주다, 무겁게 하다</td></tr><tr><td class=\"w\">for instance</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">petition</td><td class=\"m\">청원, 탄원서</td></tr><tr><td class=\"w\">address</td><td class=\"m\">(문제를) 다루다, 해결하려고 애쓰다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떤 사람들은 속이거나 훔칠 가능성이 더 높다</span><span class=\"en\"><b>Some people <span class=\"grammar-hl\">are more likely to cheat and steal</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘친환경’ 제품을 구매한 후에,</span><span class=\"en\"><b>after <span class=\"grammar-hl\">purchasing</span> \"eco-friendly\" products,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">아마도 그들이 그렇게 할 자격이 있다고 느끼기 때문일 것이다</span><span class=\"en\"><b>probably because they feel <span class=\"grammar-hl\">licensed</span> <span class=\"grammar-hl\">to do so</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 ‘친환경적’ 선택을 도덕적으로 간주하기 때문에</span><span class=\"en\"><b>since they morally <span class=\"grammar-hl\">account the \"eco-friendly\" choice</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘착한’ 행위라고</span><span class=\"en\"><b><span class=\"grammar-hl\">as a \"good\" deed</span>.</b></span></div></div><div class=\"lec-sent-ko\">어떤 사람들은 ‘친환경’ 제품을 구매한 후에 속이거나 훔칠 가능성이 더 높은데, 아마도 그들은 ‘친환경적’ 선택을 ‘착한’ 행위라고 도덕적으로 간주하여 그렇게 할 자격이 있다고 느끼기 때문일 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 도입부로서 흥미로운 인간의 심리 현상을 제시합니다. 사람들은 친환경 제품을 샀다는 착한 행동을 하나 하고 나면, 마음속에 일종의 도덕적 마일리지를 쌓았다고 여깁니다. feel licensed to do so는 &#39;그렇게 해도 되는 허락을 받았다&#39;는 의미로, 이미 착한 일을 했으니 이제 나쁜 행동(속임수나 도둑질)을 조금 해도 괜찮다고 스스로 정당화하는 모습을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are more likely to cheat and steal to부정사 및 관용표현: &#39;be likely to V&#39;는 &#39;~할 가능성이 높다&#39;라는 의미의 관용표현이며, to cheat와 뒤의 steal은 등위접속사 and로 연결된 to부정사이다.</div><div class=\"lec-gr-item\">purchasing (동명사): 전치사 after의 목적어로 쓰인 명사적 역할의 -ing 형태이다.</div><div class=\"lec-gr-item\">licensed (과거분사(형용사)): 2형식 동사 feel의 주격 보어로 쓰인 과거분사이다. 의미상 주어인 they가 권한을 &#39;부여받은&#39; 수동적 상태이므로 과거분사를 썼다.</div><div class=\"lec-gr-item\">to do so (to부정사): 앞의 licensed를 수식하거나 보완하여 &#39;~할 권한을 부여받은&#39;의 의미를 완성하는 부사적/형용사적 역할을 한다.</div><div class=\"lec-gr-item\">account the &quot;eco-friendly&quot; choice as a &quot;good&quot; deed 5형식(SVOC) 구조 및 관용표현: &#39;account + O + as + C&#39; 구조로 쓰여 &#39;목적어(the eco-friendly choice)를 보어(a good deed)로 간주하다/여기다&#39;라는 의미의 5형식 틀을 형성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">eco-friendly</td><td class=\"m\">친환경적인, 환경 친화적인</td></tr><tr><td class=\"w\">deed</td><td class=\"m\">행위, 행동</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">도덕적 허가는 또한 관찰되어 왔다</span><span class=\"en\"><b>Moral licensing <span class=\"grammar-hl\">has also been observed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">협조의 맥락 안에서도</span><span class=\"en\"><b>in the context of cooperation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경의 이익을 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">for the good of</span> the environment.</b></span></div></div><div class=\"lec-sent-ko\">도덕적 허가는 환경의 이익을 위한 협조의 맥락 안에서도 관찰되어 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 현상의 개념을 정의하고, 이를 환경을 위한 구체적인 상황과 연결하는 문장입니다. 학술 글에서 Moral licensing은 선행을 베풀고 난 뒤 스스로에게 비도덕적 행동을 면제해 주는 심리를 가리킵니다. 앞서 설명한 제품 구매 상황뿐만 아니라 환경을 위해 함께 노력하는 상황 전반에서도 이와 똑같은 심리가 나타난다고 덧붙이고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has also been observed (수동태): 현재완료(has + p.p.)와 수동태(be + p.p.)가 결합된 has been + p.p.(observed) 구조이다. observe는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 has been observed 형태로 쓴다. 기본구조: observe + O (O를 관찰하다/목격하다).</div><div class=\"lec-gr-item\">for the good of (관용표현): &#39;~의 이익을 위하여&#39;라는 의미로 쓰이는 숙어 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for the good of</td><td class=\"m\">~의 이익을 위하여, ~을 위하여</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들이 자신이 해왔던 행동들을 떠올릴 때</span><span class=\"en\"><b>When people <span class=\"grammar-hl\">are reminded</span> of deeds <span class=\"grammar-hl\">they have done</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경에 해롭다고 그들이 알고 있는,</span><span class=\"en\"><b><span class=\"grammar-hl\">that they know were harmful</span> to the environment,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들에게는 남을 수 있다</span><span class=\"en\"><b>they <span class=\"grammar-hl\">might be left</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘환경에 대한 죄책감’이라는 감정이</span><span class=\"en\"><b>with a feeling of \"eco-guilt.\"</b></span></div></div><div class=\"lec-sent-ko\">사람들이 자신이 해왔던 환경에 해롭다고 알고 있는 행동들을 떠올릴 때, 그들에게는 ‘환경에 대한 죄책감(eco­guilt)’이라는 감정이 남을 수 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장까지는 &#39;착한 행동 이후&#39;를 다뤘다면, 여기서부터는 반대로 &#39;나쁜 행동 이후&#39;라는 새로운 상황으로 화제를 전환합니다. 자신이 환경을 망치는 행동을 했다는 사실을 떠올리게 되면, 사람들은 마음이 불편해지고 환경에 대한 무거운 마음의 짐, 즉 죄책감에 시달리게 됩니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are reminded (수동태): be동사(are) + p.p.(reminded) 구조이다. remind는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are reminded 형태로 쓴다. 기본구조: remind + O + of B (O에게 B를 상기시키다). 목적어(O)가 주어로 올라가 수동전환된 구조이다.</div><div class=\"lec-gr-item\">they have done (관계대명사): done의 목적어가 없는 불완전한 절이므로, 선행사 deeds를 수식하는 목적격 관계대명사(that 또는 which)가 deeds와 they 사이에 생략되어 있다.</div><div class=\"lec-gr-item\">that they know were harmful (관계대명사): that은 선행사 deeds를 수식하는 주격 관계대명사이다. 뒤에 삽입절(they know)이 들어가고 동사(were)가 이어지는 구조로, 관계대명사절 내부에서 that이 주어 역할을 한다.</div><div class=\"lec-gr-item\">might be left (수동태): 조동사(might) + be동사(be) + p.p.(left) 구조이다. leave는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 might be left 형태로 쓴다. 기본구조: leave + O + with B (O에게 B를 남기다). 목적어(O)가 주어로 올라가 수동전환된 형태이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deed</td><td class=\"m\">행위, 행동</td></tr><tr><td class=\"w\">harmful</td><td class=\"m\">해로운, 유해한</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">환경에 대한 죄책감을 경험하는 사람들은</span><span class=\"en\"><b>People <span class=\"grammar-hl\">who experience</span> eco-guilt</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">친환경적인 행동을 추구한다</span><span class=\"en\"><b>seek pro-environmental actions</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 죄책감을 보상하고 균형을 회복하기 위한</span><span class=\"en\"><b><span class=\"grammar-hl\">to compensate</span> for this guilt and <span class=\"grammar-hl\">restore</span> balance.</b></span></div></div><div class=\"lec-sent-ko\">환경에 대한 죄책감을 경험하는 사람들은 이 죄책감을 보상하고 균형을 회복하기 위한 친환경적인 행동을 추구한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 발생한 &#39;환경적 죄책감&#39;을 사람들이 어떻게 해결하려 하는지 보여 주는 문장입니다. 나쁜 행동을 해서 마음의 도덕적 저울이 기울어졌으니, 다시 착한 일(친환경적 행동)을 해서 마음의 빚을 갚고 도덕적 평온을 되찾으려 시도한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who experience (관계대명사): who는 주격 관계대명사로 선행사 People을 수식하며, 관계사절 내에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">to compensate (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~을 보상하기 위해서&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">restore (to부정사): 등위접속사 and에 의해 앞의 to compensate와 병렬 구조를 이루며, to가 생략된 동사원형 형태의 부정사이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">compensate for</td><td class=\"m\">~을 보상하다, ~을 상쇄하다</td></tr><tr><td class=\"w\">restore</td><td class=\"m\">회복시키다, 복구하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 균형을 찾는 과정에서,</span><span class=\"en\"><b>In their search for such a balance,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 ‘임시방편’을 믿는 경향이 있다,</span><span class=\"en\"><b>people <span class=\"grammar-hl\">are inclined to believe</span> in \"quick-fixes,\"</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이는 그들이 도덕적 균형을 재정립하고 싶어하기 때문이다</span><span class=\"en\"><b>because they want <span class=\"grammar-hl\">to re-establish</span> the moral balance</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 죄책감을 벗어나고 싶어하기 때문이다</span><span class=\"en\"><b>and <span class=\"grammar-hl\">escape</span> the guilt</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가능한 한 빠르고 쉽게</span><span class=\"en\"><b><span class=\"grammar-hl\">as quickly and easily as possible</span>.</b></span></div></div><div class=\"lec-sent-ko\">이러한 균형을 찾는 과정에서 사람들은 ‘임시방편’을 믿으려 하지 않는데( →하는 경향이 있는데), 이는 그들이 도덕적 균형을 재정립하고 가능한 한 빠르고 쉽게 죄책감을 벗어나고 싶어하기 때문이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;균형 회복&#39; 과정이 구체적으로 어떤 특징을 띠는지 설명합니다. 사람들은 죄책감이라는 불편한 감정을 오래 견디기 싫어하기 때문에, 복잡하고 힘든 노력보다는 당장 눈앞에 보이는 쉽고 간단한 행동을 통해 빨리 마음의 짐을 덜어내려 합니다. &quot;quick-fixes&quot;는 근본적인 해결책이라기보다는 임시방편으로 재빨리 문제를 덮는 조치를 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are inclined to believe (수동태): be동사(are) + p.p.(inclined) 구조이다. incline은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are inclined 형태로 쓴다. 기본구조: incline + O + to V (O가 ~하는 경향이 있게 하다). 목적어(O)가 주어로 올라가 수동전환되고, 뒤의 목적보어인 to V(to believe)는 구조가 그대로 남는다.</div><div class=\"lec-gr-item\">to re-establish (to부정사): 타동사 want의 목적어 역할을 하는 명사적 용법의 to부정사이다.</div><div class=\"lec-gr-item\">escape (to부정사): 등위접속사 and에 의해 앞의 to re-establish와 병렬 구조를 이루며, to가 생략된 동사원형으로 쓰였다.</div><div class=\"lec-gr-item\">as quickly and easily as possible (관용표현): &#39;as + 부사/형용사 + as possible&#39; 구조로 &#39;가능한 한 ~하게&#39;라는 의미를 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">quick-fix</td><td class=\"m\">임시방편, 즉각적인 해결책</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들이 태도를 바꿀 수 있는 것과 같은 방식으로</span><span class=\"en\"><b>In the same way <span class=\"grammar-hl\">that people may change their attitudes</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태도와 행동 사이의 불일치를 줄이기 위해,</span><span class=\"en\"><b><span class=\"grammar-hl\">to reduce</span> inconsistencies between attitudes and behavior,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 평가를 바꿀 수도 있다</span><span class=\"en\"><b>people may also change their evaluation</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">과거의 환경에 부담을 주는 행동과 미래의 친환경적 행동에 대한</span><span class=\"en\"><b>of past environmentally <span class=\"grammar-hl\">burdening</span> behaviors and future environmentally friendly behaviors.</b></span></div></div><div class=\"lec-sent-ko\">사람들이 태도와 행동 사이의 불일치를 줄이기 위해 태도를 바꿀 수 있는 것과 같은 방식으로, 사람들은 과거의 환경에 부담을 주는 행동과 미래의 친환경적 행동에 대한 평가를 바꿀 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 심리학의 인지부조화 이론을 바탕으로 앞선 내용들을 뒷받침하는 문장입니다. 사람들은 보통 자신의 생각과 행동이 어긋나면 마음이 불편해서 생각이나 행동 중 하나를 스스로 수정하려고 합니다. 이와 마찬가지로, reduce inconsistencies는 마음속의 모순으로 인한 불편함을 없애려 한다는 뜻으로, 사람들은 환경에 나쁜 짓을 한 과거와 환경을 보호하려는 미래의 행동을 머릿속에서 유리하게 재평가하여 자신의 죄책감을 덜어내는 방향으로 마음의 타협을 본다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that people may change their attitudes (관계부사): that은 선행사 the same way를 수식하는 관계부사 대용으로 쓰였다. the way와 how는 함께 쓸 수 없으므로, 대신 that이나 in which를 사용하여 뒤에 완전한 문장을 이끈다.</div><div class=\"lec-gr-item\">to reduce (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~을 줄이기 위해서&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">burdening (현재분사(형용사)): burdening이 뒤의 명사 behaviors를 수식하는 -ing + N 구조이다. &#39;부담을 주는&#39;이라는 능동/진행의 의미를 나타내며, behaviors that are burdening과 같은 의미 관계로 볼 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">burden</td><td class=\"m\">부담을 주다, 무겁게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 7</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For instance,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들은 청원서에 서명할 가능성이 더 높다</span><span class=\"en\"><b>people <span class=\"grammar-hl\">are more likely to sign</span> a petition</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경 훼손을 다루는</span><span class=\"en\"><b><span class=\"grammar-hl\">addressing</span> environmental damage</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인간이 유발한 환경 훼손의 증거를 본 후에</span><span class=\"en\"><b>after <span class=\"grammar-hl\">viewing</span> evidence of <span class=\"grammar-hl\">human-caused</span> environmental damage.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 사람들은 인간이 유발한 환경 훼손의 증거를 본 후에 환경 훼손을 다루는 청원서에 서명할 가능성이 더 높다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 바로 앞 문장과 전체 글의 내용을 마무리하며 보여 주는 구체적인 사례입니다. 인간이 자연을 파괴했다는 사실을 눈으로 확인하여 환경적 죄책감이 생기면, 이를 빨리 덜어내고 도덕적 균형을 맞추기 위해 &#39;청원서 서명&#39;이라는 아주 쉽고 빠른 해결책을 선택한다는 일련의 과정을 생생하게 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are more likely to sign to부정사 및 관용표현: &#39;be likely to V&#39;는 &#39;~할 가능성이 높다&#39;라는 의미의 관용표현이며, to sign은 to부정사이다.</div><div class=\"lec-gr-item\">addressing (현재분사(형용사)): addressing이 앞의 명사 a petition을 수식하는 N + -ing 구조이다. &#39;다루는&#39;이라는 능동의 의미로, a petition that addresses 와 같은 축약 관계로 볼 수 있다.</div><div class=\"lec-gr-item\">viewing (동명사): 전치사 after의 목적어로 쓰인 명사적 역할의 -ing 형태이다.</div><div class=\"lec-gr-item\">human-caused (과거분사(형용사)): caused가 뒤의 명사 environmental damage를 수식하는 p.p. + N 구조이다. &#39;인간에 의해 야기된&#39;이라는 수동의 의미를 지닌다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for instance</td><td class=\"m\">예를 들어</td></tr><tr><td class=\"w\">petition</td><td class=\"m\">청원, 탄원서</td></tr><tr><td class=\"w\">address</td><td class=\"m\">(문제를) 다루다, 해결하려고 애쓰다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>사람들은 친환경 제품 구매 같은 착한 행동을 하고 나면 스스로 도덕적 자격을 얻었다고 여겨 오히려 나쁜 행동을 할 가능성이 커진다.</li><li>반대로 자신의 행동이 환경을 훼손했음을 깨달으면 환경적 죄책감을 느끼게 된다.</li><li>이 죄책감으로 인해 무너진 도덕적 균형을 회복하고자 사람들은 다시 친환경적인 행동을 찾게 된다.</li><li>이때 사람들은 불편한 감정에서 빨리 벗어나기 위해 청원서 서명과 같이 쉽고 빠르게 마음의 짐을 덜 수 있는 임시방편적인 해결책을 선호한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People might commit unethical acts after making eco-friendly choices due to moral licensing, while they seek quick pro-environmental actions to compensate for their eco-guilt.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 도덕적 허용으로 인해 친환경적 선택을 한 후 비도덕적인 행동을 저지를 수 있는 반면, 친환경적 죄책감을 보상하기 위해서는 빠른 친환경적 행동을 추구한다.</div></div></div>"],"segs":[[{"audio":"./30_audio/1.mp3","hl":null}],[{"audio":"./30_audio/2.mp3","hl":null}],[{"audio":"./30_audio/3.mp3","hl":null},{"audio":"./30_audio/4.mp3","hl":"stage-0"},{"audio":"./30_audio/5.mp3","hl":"stage-1"},{"audio":"./30_audio/6.mp3","hl":"stage-2"},{"audio":"./30_audio
