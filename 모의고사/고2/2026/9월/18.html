</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 18번","audioDir":"18_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">18번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Request for Additional Budget Allocation for Internship Program\u003c/h1>\u003ch2>인턴십 프로그램 예산 조정 요청\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>부서에서 계획보다 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">명 \u003c/b>\u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">인턴\u003c/b>을 고용하여 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">예산\u003c/b>이 필요해지자, 담당자가 경영 관리자에게 임금·훈련비·물품을 위한 \u003cb class=\"key\">예산 \u003c/b>\u003cb class=\"key\">배당\u003c/b>을 요청하는 이메일이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The coordinator requests an additional budget allocation to cover wages, training costs, and materials for the three extra interns hired by the department.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 전국연합학력평가 지문으로, 인턴십 프로그램 예산 조정을 요청하는 이메일입니다. 간단히 요약하면, 부서에서 인턴을 계획보다 세 명 더 고용해서 임금과 훈련비, 물품을 위한 추가 예산이 필요해졌고, 담당자가 경영 관리자에게 예산 배당을 요청하는 내용이에요. 요지는 한 문장으로, 담당자가 추가 고용으로 생긴 비용을 충당하기 위해 추가 예산 배당을 요청한다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문은 회사에서 오가는 \u003cb class=\"key\">business \u003c/b>\u003cb class=\"key\">email\u003c/b> 형식의 글입니다. 조직에서는 한 해 예산을 미리 승인받아 두는데, 상황이 바뀌면 \u003cb class=\"key\">budget \u003c/b>\u003cb class=\"key\">adjustment\u003c/b>을 요청해야 합니다. 인턴십 프로그램 \u003cb class=\"key\">internship \u003c/b>\u003cb class=\"key\">program\u003c/b>은 학생이나 신입이 실무를 배우는 제도로, 보통 임금과 교육비가 듭니다. 이 글의 부서는 계획보다 인턴을 더 고용해 예산이 부족해졌고, 그 부족분을 메우려고 \u003cb class=\"key\">additional \u003c/b>\u003cb class=\"key\">budget \u003c/b>\u003cb class=\"key\">allocation\u003c/b>을 요청하는 상황이에요. 마치 용돈 계획을 세웠는데 친구가 세 명 더 놀러 와서 식재료비가 더 필요해진 것과 비슷합니다.\u003c/div>","segs":[{"n":2,"text":"이 지문은 회사에서 오가는 business email 형식의 글이에요. 부서 department와 예산 budget, 인턴십 프로그램 internship program 같은 용어가 나오죠. 조직에서는 한 해 예산을 미리 승인받아 두는데, 상황이 바뀌면 예산 조정 budget adjustment을 요청해야 해요. 마치 용돈 계획을 세웠는데 친구가 세 명 더 놀러 와서 식재료비가 더 필요해진 상황과 비슷하죠. 그래서 이 글의 핵심은 예산 부족을 해결하기 위한 additional budget allocation, 즉 추가 예산 배당이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>문제 제기와 목적 밝힘\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>인턴십 프로그램이 시작되기 일주일 전이라고 \u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 밝히며, 부서에서 생긴 사안에 대해 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">고려\u003c/b>가 필요하다고 말합니다. 자신이 왜 이 글을 쓰는지 \u003cb class=\"key\">글의 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 분명히 드러내는 부분입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>예산 조정 필요와 원인\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>업무 담당자로서 보니, 이전에 승인받은 예산을 \u003cb class=\"key\">조정\u003c/b>해야 할 필요가 분명해졌습니다. 최근 생겨난 수정 사항을 충족하려면 예산 변동이 필요하고, 특히 계획보다 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">명의 \u003c/b>\u003cb class=\"key\">인턴\u003c/b>을 더 고용한 것이 핵심 원인입니다. 가장 비용이 많이 드는 부족한 부분은 추가 \u003cb class=\"key\">자금\u003c/b>이며, 인턴들의 임금과 훈련 비용, 물품을 다루는 데 필요합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>추가 예산 요청\u003csmall>주장·해결 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>이 모든 비용을 위해 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">예산 \u003c/b>\u003cb class=\"key\">배당\u003c/b>을 정중하게 요청합니다. 구체적인 내역은 \u003cb class=\"key\">첨부물\u003c/b>을 참고해 달라고 안내하며 요구를 뒷받침합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>감사와 마무리\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>관심을 가져 준 것에 대해 \u003cb class=\"key\">감사\u003c/b>를 표현하고, 담당자 매트 페리가 편지를 끝맺습니다. 요청 사항을 공손하게 마무리하는 \u003cb class=\"key\">예의\u003c/b>를 갖춘 결말입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글은 크게 문제 제기, 원인 설명, 요청, 마무리 단계로 흘러가요. 이 순서로 읽으면 내용이 깔끔하게 잡힙니다.","hl":null},{"n":4,"text":"첫 번째 단계는 문제 제기와 글의 목적 제시예요. 첫 번째 문장에서 인턴십 프로그램이 시작되기 일주일 전이라는 시간적 배경을 말하고, 바로 두 번째 문장에서 부서의 사안에 대해 즉각적인 고려가 필요하다고 하며 주의를 환기하죠. 이메일의 서두로 아주 공손하게 시작하는 부분이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 예산 조정의 필요와 원인을 설명하는 부분이에요. 세 번째 문장에서 담당자로서 보니 이전에 승인받은 예산을 조정해야 할 필요가 분명해졌다고 말하고, 네 번째 문장에서 그 이유가 계획보다 세 명의 인턴을 더 고용했기 때문이라고 밝힙니다. 그래서 추가 자금이 필요하고, 그 돈은 인턴들의 임금과 훈련 비용, 물품을 충당하는 데 쓰인다는 거죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 핵심 요청이에요. 다섯 번째 문장에서 이 비용들을 위해 추가 예산 배당을 정중하게 요청합니다. 여섯 번째 문장에서 자세한 내용은 첨부물을 참고해 달라고 안내하죠. 이 부분이 바로 이메일의 주제문이에요.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 감사와 마무리예요. 일곱 번째 문장에서 관심을 가져 준 것에 대해 감사하다고 하고, 여덟 번째 문장에서 매트 페리가 인사와 함께 편지를 끝맺습니다. 공손한 요청 이메일의 전형적인 마무리라고 보면 돼요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 문제 제기의 목적을 밝히고, 중간에서 예산 조정의 필요와 원인을 설명한 뒤, 문장 5번에서 핵심인 \u003cb class=\"key\">추가 \u003c/b>\u003cb class=\"key\">예산 \u003c/b>\u003cb class=\"key\">배당 \u003c/b>\u003cb class=\"key\">요청\u003c/b>을 제시합니다. 이처럼 \u003cb class=\"key\">주제문\u003c/b>이 글의 중간에 위치하고 앞뒤로 배경과 마무리가 오는 전형적인 \u003cb class=\"key\">중괄식\u003c/b> 구조입니다. 'I kindly request...'가 요지에 해당하고, 이후 첨부물 안내와 감사 인사는 보조적인 마무리입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>I am writing to bring your attention (2)\u003c/b>\u003cspan>목적 제시\u003c/span>\u003cb>needs some adjustments (3)\u003c/b>\u003cspan>문제·필요 제기\u003c/span>\u003cb>Since (4)\u003c/b>\u003cspan>원인·이유\u003c/span>\u003cb>I kindly request (5)\u003c/b>\u003cspan>요청·주제문\u003c/span>\u003cb>Please refer (6)\u003c/b>\u003cspan>보조 요청\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a matter that requires immediate consideration\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the issue my department has\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">needs some adjustments\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">emerging modifications\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">additional funding\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">additional budget allocation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these expenses\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"전개 방식은 문제 해결 유형이고, 구조는 중괄식이에요. 글의 앞부분에서 부서의 문제를 제기하고, 중간에서 그 원인과 필요한 조치를 설명한 뒤, 다섯 번째 문장에서 추가 예산 배당 요청이라는 주제문이 나옵니다. 주제문이 글의 중간에 위치하고 앞뒤로 배경과 마무리가 있는 형태라서 중괄식이라고 정리할 수 있어요.","hl":"ty"},{"n":9,"text":"흐름을 잡아 주는 신호어를 볼게요. 두 번째 문장의 I am writing to bring your attention은 글의 목적을 알려 주고, 세 번째 문장의 needs some adjustments는 예산 문제를 드러내요. 네 번째 문장의 Since는 인턴을 더 고용한 원인을 연결해 주고, 다섯 번째 문장의 I kindly request가 바로 핵심 요청이죠. 이렇게 신호어를 따라가면 주제문을 놓치지 않아요. 재진술 표현으로는 adjustments와 additional funding, budget allocation이 같은 개념을 가리키고 있다는 점도 체크하세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>internship program\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인턴십 프로그램\u003c/span>\u003c/div>\u003cdiv>\u003cb>bring one's attention to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 주의를 환기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>matter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사안, 문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>require\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>immediate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>즉각적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>consideration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고려\u003c/span>\u003c/div>\u003cdiv>\u003cb>regarding\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에 관해서\u003c/span>\u003c/div>\u003cdiv>\u003cb>issue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사안, 문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>department\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부서\u003c/span>\u003c/div>\u003cdiv>\u003cb>coordinator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>업무 담당자, 조정자\u003c/span>\u003c/div>\u003cdiv>\u003cb>apparent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>분명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>budget\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예산\u003c/span>\u003c/div>\u003cdiv>\u003cb>previously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>이전에\u003c/span>\u003c/div>\u003cdiv>\u003cb>approved\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>승인된\u003c/span>\u003c/div>\u003cdiv>\u003cb>adjustment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조정\u003c/span>\u003c/div>\u003cdiv>\u003cb>in order to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하기 위해서\u003c/span>\u003c/div>\u003cdiv>\u003cb>meet\u003c/b>\u003cem>동사\u003c/em>\u003cspan>충족시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>emerging\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최근 생겨난\u003c/span>\u003c/div>\u003cdiv>\u003cb>modification\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수정 사항\u003c/span>\u003c/div>\u003cdiv>\u003cb>Since\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>hire\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>initially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>처음에\u003c/span>\u003c/div>\u003cdiv>\u003cb>additional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>추가적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>funding\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자금\u003c/span>\u003c/div>\u003cdiv>\u003cb>cover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(비용을) 충당하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wages\u003c/b>\u003cem>명사\u003c/em>\u003cspan>임금\u003c/sp v class=\"lp-chips\">\u003cspan class=\"s\">instant\u003c/span>\u003cspan class=\"s\">prompt\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">delayed\u003c/span>\u003cspan class=\"a\">postponed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">request\u003c/b>\u003cspan class=\"m\">요청하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ask\u003c/span>\u003cspan class=\"s\">solicit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003cspan class=\"a\">deny\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expense\u003c/b>\u003cspan class=\"m\">비용\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">cost\u003c/span>\u003cspan class=\"s\">expenditure\u003c/span>\u003cspan class=\"s\">outlay\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">income\u003c/span>\u003cspan class=\"a\">savings\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">require\u003c/b>\u003cspan class=\"m\">요구하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">need\u003c/span>\u003cspan class=\"s\">demand\u003c/span>\u003cspan class=\"s\">necessitate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forgo\u003c/span>\u003cspan class=\"a\">waive\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리할게요. adjustment는 modification이나 revision과 바꿔 쓸 수 있어요. additional은 extra나 supplementary, apparent는 evident나 obvious와 유의어 관계죠. immediate는 instant나 prompt, request는 ask나 solicit, expense는 cost나 expenditure와 연결돼요. 반의어로는 adjustment의 경우 fixation, immediate는 delayed, request는 refuse, expense는 income 정도를 기억해 두면 됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슐츠 부장님께,\u003c/span>\u003cspan class=\"en\">Dear Executive Manager Schulz,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일주일입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">week\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인턴십 프로그램이 시작되기 전에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">internship \u003c/span>\u003cspan class=\"tgt\">program \u003c/span>\u003cspan class=\"tgt\">starts\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인턴십 프로그램을 시작하기 일주일 전입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인사와 함께 인턴십 시작까지 일주일 남았음을 알리는 배경 설명이다. \u003cb class=\"key\">시간적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 제시하여 이후 예산 조정 요청의 긴박성을 부드럽게 깔아 준다. Dear Executive Manager Schulz는 \u003cb class=\"key\">수신자 \u003c/b>\u003cb class=\"key\">호칭\u003c/b>으로 비즈니스 이메일 형식을 따른다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비인칭 주어 it\u003c/span> : It is a week : \"일주일이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 before가 이끄는 시간의 부사절\u003c/span> : It is a week before [the internship program starts] : \"인턴십 프로그램이 시작되기 전에\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Dear Executive Manager Schulz, 슐츠 부장님께. It is a week, 일주일입니다. before the internship program starts, 인턴십 프로그램이 시작되기 전에.. 이 문장 전체를 해석하면, 인턴십 프로그램을 시작하기 일주일 전입니다.","hl":"m"},{"n":13,"text":"이 문장은 인턴십 시작까지 일주일 남았다는 시간적 배경을 깔아 주는 인사이자 서론입니다. Dear Executive Manager Schulz는 비즈니스 이메일의 수신자 호칭이고, It is a week before the internship program starts는 남은 시간이 얼마나 빠듯한지를 강조해 주죠. 뒤에 나올 예산 조정 요청이 급박하다는 느낌을 자연스럽게 만듭니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트, It is a week는 시간을 나타내는 비인칭 it 구문입니다. 주어 It이 특정 대상을 가리키지 않고 시간을 나타내죠. 두 번째 포인트, before the internship program starts는 before가 이끄는 시간의 부사절로, 인턴십 프로그램이 시작되기 전이라는 뜻을 덧붙입니다. 부사절 안에서 주어 the internship program이 삼인칭 단수라 starts로 받은 점도 함께 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 쓰고 있습니다\u003c/span>\u003cspan class=\"en\">I am writing\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 관심을 환기시키기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">bring \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">attention \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 문제에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">matter\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉각적인 고려가 필요한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">requires \u003c/span>\u003cspan class=\"tgt\">immediate \u003c/span>\u003cspan class=\"tgt\">consideration\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사안에 관해\u003c/span>\u003cspan class=\"en\">regarding \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">issue \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희 부서가 가지고 있는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">department \u003c/span>\u003cspan class=\"tgt\">has\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저희 부서의 사안과 관련하여 즉각적인 고려가 필요한 문제에 대해 당신의 관심을 환기하기 위해 이 글을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 공식 이메일에서 글을 쓰는 목적을 밝히는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">화행\u003c/b>이다. to bring your attention to a matter는 상대방의 관심을 환기하려는 의도를, that requires immediate consideration은 그 문제가 \u003cb class=\"key\">즉각적 \u003c/b>\u003cb class=\"key\">고려\u003c/b>가 필요함을 전달한다. regarding the issue my department has는 부서가 겪고 있는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">문제\u003c/b>를 덧붙여 요청의 명분을 강화한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : I am writing + [to bring your attention to a matter] : \"당신의 관심을 환기시키기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : a matter + [that requires immediate consideration] : \"즉각적인 고려가 필요한 문제\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : the issue + [(that) my department has] : \"저희 부서가 가지고 있는 사안\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"I am writing, 저는 쓰고 있습니다. to bring your attention, 당신의 관심을 환기시키기 위해. to a matter, 한 문제에 대해. that requires immediate consideration, 즉각적인 고려가 필요한. regarding the issue, 그 사안에 관해. my department has, 저희 부서가 가지고 있는.. 이 문장 전체를 해석하면, 저희 부서의 사안과 관련하여 즉각적인 고려가 필요한 문제에 대해 당신의 관심을 환기하기 위해 이 글을 씁니다.","hl":"m"},{"n":16,"text":"이 문장은 공식 이메일에서 글을 쓰는 목적을 직접 밝히는 핵심 문장입니다. to bring your attention to a matter는 상대방의 관심을 환기시키려는 의도이고, that requires immediate consideration은 그 문제가 즉각적인 고려가 필요함을 말해 줍니다. 뒤에 regarding the issue my department has는 그 문제가 저희 부서의 구체적인 사안임을 덧붙여 요청의 명분을 강화해요.","hl":"mn"},{"n":17,"text":"첫 번째 포인트, to bring your attention to a matter는 to부정사의 부사적 용법 목적입니다. I am writing의 목적, 즉 무엇 때문에 이 글을 쓰는지를 설명해요. 두 번째 포인트, that requires immediate consideration은 주격 관계대명사 that이 이끄는 절로, 선행사 a matter를 수식합니다. 세 번째 포인트, the issue my department has는 목적격 관계대명사가 생략된 표현입니다. 원래 the issue that my department has에서 that이 생략되었고, has의 목적어 자리이기 때문에 목적격 관계대명사를 생략할 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">업무 담당자로서,\u003c/span>\u003cspan class=\"en\">As the coordinator,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저에게 분명해지고 있습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">becoming \u003c/span>\u003cspan class=\"tgt\">apparent \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 예산이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> the budget,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이전에 당신의 부서로부터 승인받은,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">previously \u003c/span>\u003cspan class=\"tgt\">approved \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">department\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약간의 조정이 필요하다는 것이\u003c/span>\u003cspan class=\"en\">needs some adjustments\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최근 생겨난 수정 사항을 충족시키기 위해서입니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">meet \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">emerging \u003c/span>\u003cspan class=\"tgt\">modifications\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">업무 담당자로서 최근 생겨난 수정 사항을 충족시키기 위해서, 이전에 당신의 부서로부터 승인받은 예산은 약간의 조정이 필요함이 분명해지고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 예산 조정이 필요하다는 판단을 담당자로서 제시하는 중심 문장이다. As the coordinator는 발신자의 \u003cb class=\"key\">직책과 \u003c/b>\u003cb class=\"key\">책임\u003c/b>을 드러내고, it is becoming apparent to me that은 판단이 분명해지고 있음을 조심스럽게 전달한다. the budget 뒤에 삽입된 previously approved by your department는 예산이 \u003cb class=\"key\">이미 \u003c/b>\u003cb class=\"key\">승인된 \u003c/b>\u003cb class=\"key\">것\u003c/b>임을 상기시키고, 그럼에도 \u003cb class=\"key\">조정 \u003c/b>\u003cb class=\"key\">필요\u003c/b>를 말함으로써 요청의 논리를 구성한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it과 진주어 that절\u003c/span> : It is becoming apparent to me [that the budget needs some adjustments] : \"~라는 것이 저에게 분명해지고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구(수동) 후치수식\u003c/span> : the budget + [previously approved by your department] : \"이전에 당신의 부서로부터 승인받은 예산\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : needs some adjustments + [in order to meet the emerging modifications] : \"최근 생겨난 수정 사항을 충족시키기 위해\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"As the coordinator, 업무 담당자로서. it is becoming apparent to me, 저에게 분명해지고 있습니다. that the budget, 그 예산이. previously approved by your department, 이전에 당신의 부서로부터 승인받은. needs some adjustments, 약간의 조정이 필요하다는 것이. in order to meet the emerging modifications, 최근 생겨난 수정 사항을 충족시키기 위해서입니다.. 이 문장 전체를 해석하면, 업무 담당자로서 최근 생겨난 수정 사항을 충족시키기 위해서, 이전에 당신의 부서로부터 승인받은 예산은 약간의 조정이 필요함이 분명해지고 있습니다.","hl":"m"},{"n":19,"text":"이 문장은 예산 조정이 필요하다는 판단을 담당자로서 제시하는 중심 문장입니다. As the coordinator는 발신자의 책임을 드러내고, it is becoming apparent to me that은 판단이 분명해지고 있음을 조심스럽게 전달해요. the budget 뒤에 삽입된 previously approved by your department는 예산이 이미 승인된 것임을 상기시키면서, 그 예산에 adjustments가 필요하다고 말하며 요청의 논리를 구성합니다.","hl":"mn"},{"n":20,"text":"첫 번째 포인트, it is becoming apparent to me that은 가주어 it과 진주어 that절 구문입니다. 진짜 주어는 that 이하의 the budget needs some adjustments이고, it이 자리를 채우는 구조예요. 두 번째 포인트, previously approved by your department는 과거분사구로 선행사 the budget을 수식합니다. 승인받은 예산이라는 수동의 의미를 담고 있죠. 세 번째 포인트, in order to meet the emerging modifications는 목적을 나타내는 to부정사입니다. 조정이 필요한 목적이 최근 생겨난 수정 사항을 충족시키기 위한 것임을 분명히 보여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 부서가 고용했기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Since \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">department \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">hired\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세 명의 인턴을 더\u003c/span>\u003cspan class=\"en\">three more interns\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음에 계획했던 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">planned \u003c/span>\u003cspan class=\"tgt\">initially\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 비용이 많이 드는 필요한 부분은\u003c/span>\u003cspan class=\"en\">the most expensive need is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">추가적인 자금을 위한\u003c/span>\u003cspan class=\"en\">for additional funding\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 임금, 훈련 비용, 물품들을 다루기 위해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">cover \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">wages, \u003c/span>\u003cspan class=\"tgt\">training \u003c/span>\u003cspan class=\"tgt\">costs, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">materials\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 부서에서 처음에 계획됐던 것보다 세 명의 인턴을 더 고용했기 때문에, 가장 비용이 많이 드는 부족한 부분은 그들의 임금, 훈련 비용, 물품들을 다루기 위한 추가적인 자금입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 예산 조정이 필요한 이유를 설명하는 핵심 근거 문장이에요. 원래 계획보다 \u003cb class=\"key\">세 \u003c/b>\u003cb class=\"key\">명의 \u003c/b>\u003cb class=\"key\">인턴\u003c/b>을 더 고용했기 때문에 임금, 훈련 비용, 물품들을 감당할 추가 자금이 가장 많이 부족하다는 뜻이에요. \u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">most \u003c/b>\u003cb class=\"key\">expensive \u003c/b>\u003cb class=\"key\">need\u003c/b>는 가장 돈이 많이 필요한 부분, 즉 추가 자금을 가리켜요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 since (이유)\u003c/span> : Since + 주어 + 동사~, 주어 + 동사~ : \"우리 부서가 ~했기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 + than (과거분사) 관용 표현\u003c/span> : 비교급 + than + 과거분사 (주어+be동사 생략) : \"처음에 계획된 것보다 더\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법 (수식)\u003c/span> : 명사 + to cover + 목적어 : \"임금, 훈련 비용, 물품들을 다루기 위한\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Since my department has hired, 우리 부서가 고용했기 때문에. three more interns, 세 명의 인턴을 더. than planned initially, 처음에 계획했던 것보다. the most expensive need is, 가장 비용이 많이 드는 필요한 부분은. for additional funding, 추가적인 자금을 위한. to cover their wages, training costs, and materials, 그들의 임금, 훈련 비용, 물품들을 다루기 위해서. 이 문장 전체를 해석하면, 우리 부서에서 처음에 계획됐던 것보다 세 명의 인턴을 더 고용했기 때문에, 가장 비용이 많이 드는 부족한 부분은 그
