</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 18번","audioDir":"18_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">18번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Inquiring About Brochure Printing Costs\u003c/h1>\u003ch2>브로셔 인쇄 비용 문의\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Pendington 고등학교 교사가 학교 홍보 \u003cb class=\"key\">브로셔\u003c/b>의 디자인을 \u003cb class=\"key\">업데이트\u003c/b>하기 위해 새로운 \u003cb class=\"key\">인쇄 \u003c/b>\u003cb class=\"key\">업체\u003c/b>를 고려하고 있다. 네 쪽 분량의 \u003cb class=\"key\">컬러\u003c/b> 500부 인쇄를 진행하기 전에 \u003cb class=\"key\">인쇄 \u003c/b>\u003cb class=\"key\">비용\u003c/b>을 문의하여 \u003cb class=\"key\">예산과 \u003c/b>\u003cb class=\"key\">일정\u003c/b>을 효과적으로 세우려는 내용이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A teacher at Pendington High School writes to a printing company to ask about the cost of printing 500 full-color copies of a four-page promotional brochure.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 고등학교 모의고사 지문 중에서 브로셔 인쇄 비용 문의 편지를 함께 분석해 볼게요. 이 글은 펜딩턴 고등학교의 교사가 인쇄 업체에 보내는 공식적인 이메일이에요. 간단히 요약하면, 새 학교 홍보 브로셔를 만들기 위해 인쇄 업체에 비용을 문의하는 내용이죠. 핵심은 네 쪽 분량의 컬러 브로셔 오백 부를 인쇄하는 데 드는 비용을 묻는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">비즈니스 레터(business letter)에서 견적 문의(inquiry)는 거래 전에 필요한 정보를 요청하는 공식적인 편지예요. 이때 상대방에게 예의를 갖추기 위해 'To whom it may concern' 같은 표현을 쓰죠. 브로셔(brochure)는 학교나 회사를 홍보하는 소책자로, 디자인(design)과 인쇄 방식(printing format)이 중요해요. 마치 새 옷을 맞추기 전에 여러 가게에 가격을 물어보는 것처럼, 인쇄 업체에도 비용을 문의하고 예산(budget)을 세우는 거예요. 이 과정에서 'quote'나 'estimate'라는 용어를 쓰는데, 이는 예상 견적을 뜻해요. 따라서 이 편지는 단순한 \u003cb class=\"key\">인쇄 \u003c/b>\u003cb class=\"key\">비용\u003c/b> 문의이지만, 상대방의 \u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>을 칭찬하며 관계를 맺으려는 의도도 담겨 있어요.\u003c/div>","segs":[{"n":2,"text":"이 편지는 비즈니스 레터 형식이에요. 비즈니스 레터에서는 견적을 문의할 때 상대방에게 공손하게 요청하는 표현을 씁니다. 브로셔는 학교나 회사를 소개하는 작은 책자로, 디자인과 인쇄 방식이 아주 중요하죠. 마치 새 옷을 사기 전에 여러 가게에 가격을 물어보는 것처럼, 인쇄 업체에도 예상 비용을 물어보고 예산을 세우는 거예요. 이 편지에는 투 후엄 잇 메이 컨선이라는 공식적인 수신자 표시와 함께, 저는 펜딩턴 고등학교의 교사입니다라는 자기소개가 나와요. 그리고 네 쪽 분량의 컬러 브로셔 오백 부 인쇄를 요청하며 비용을 묻고 있죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>브로셔 준비와 업체 고려\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>발신자는 Pendington 고등학교 교사로, 현재 새로운 \u003cb class=\"key\">학교 \u003c/b>\u003cb class=\"key\">홍보 \u003c/b>\u003cb class=\"key\">브로셔\u003c/b>를 준비하고 있다. 전반적인 \u003cb class=\"key\">디자인\u003c/b>을 업데이트하기를 원해서, 새로운 \u003cb class=\"key\">인쇄 \u003c/b>\u003cb class=\"key\">업체\u003c/b>와 일하는 것을 고려 중이다. 이 단계는 편지의 \u003cb class=\"key\">도입\u003c/b>으로, 상대방에게 자신의 상황을 알린다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>디자인 적합성과 인쇄 계획\u003csmall>전개 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>여러 \u003cb class=\"key\">선택지\u003c/b>를 검토하던 중, 귀사의 \u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>과 \u003cb class=\"key\">인쇄 \u003c/b>\u003cb class=\"key\">형식\u003c/b>이 저희의 \u003cb class=\"key\">요구사항\u003c/b>에 잘 맞아 보인다고 느꼈다. 또한 네 쪽 분량의 \u003cb class=\"key\">브로셔\u003c/b>를 만들어 \u003cb class=\"key\">컬러\u003c/b>로 500부 \u003cb class=\"key\">인쇄\u003c/b>하려는 구체적인 계획을 밝힌다. 이는 단순한 칭찬이 아니라, \u003cb class=\"key\">파트너\u003c/b>로 선택할 의향을 내비치는 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>비용 문의와 목적\u003csmall>핵심 요청 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>일을 \u003cb class=\"key\">진행\u003c/b>하기에 앞서, \u003cb class=\"key\">인쇄 \u003c/b>\u003cb class=\"key\">비용\u003c/b>이 얼마나 드는지 \u003cb class=\"key\">문의\u003c/b>하고 싶다고 말한다. 이 정보는 \u003cb class=\"key\">예산\u003c/b>과 \u003cb class=\"key\">일정\u003c/b>을 더 효과적으로 정하는 데 크게 도움이 될 것이라고 설명한다. 이 부분이 편지의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">요청\u003c/b>이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>감사와 답변 요청\u003csmall>마무리 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>시간 내어 도움 준 것에 대해 \u003cb class=\"key\">감사\u003c/b>를 표하고, 상대방의 \u003cb class=\"key\">답변\u003c/b>을 기다리겠다고 한다. \u003cb class=\"key\">Sincerely\u003c/b>로 예의를 갖춰 편지를 끝맺는다. 이는 공식적인 \u003cb class=\"key\">비즈니스 \u003c/b>\u003cb class=\"key\">레터\u003c/b>의 전형적인 마무리다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서 발신자는 자신이 펜딩턴 고등학교의 교사임을 밝히고, 현재 새 학교 홍보 브로셔를 준비하고 있다고 말해요. 전반적인 디자인을 업데이트하고 싶어서 새로운 인쇄 업체와 일하는 것을 고려 중이라고 하죠. 이 부분은 편지의 도입으로, 상대방에게 자신의 상황을 알리는 역할을 해요.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 여러 선택지를 검토하던 중 귀사의 디자인 스타일과 인쇄 형식이 우리 요구에 잘 맞아 보인다고 말해요. 그리고 네 쪽 분량의 브로셔를 컬러로 오백 부 인쇄하려는 구체적인 계획도 밝히죠. 이는 단순한 칭찬이 아니라 이 업체를 선택할 의향이 있다는 신호로 볼 수 있어요.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장이 이 편지의 핵심이에요. 진행하기 전에 인쇄 비용이 얼마나 드는지 공식적으로 문의하고 있죠. 이 정보가 예산과 일정을 효과적으로 세우는 데 크게 도움이 될 거라고 덧붙여요. 그래서 이 부분이 바로 우리가 찾아야 할 핵심 요청이에요.","hl":"f2"},{"n":7,"text":"일곱 번째부터 아홉 번째 문장까지는 마무리 부분이에요. 도움에 감사하고 답변을 기다린다는 인사로 끝나죠. 신실리라는 표현으로 공식적인 편지의 예의를 갖췄어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 편지는 먼저 \u003cb class=\"key\">상황\u003c/b>을 설명하고, 중간에 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">요청\u003c/b>인 비용 문의를 배치한 후, 마지막에 \u003cb class=\"key\">감사\u003c/b>와 \u003cb class=\"key\">답변\u003c/b> 요청으로 마무리한다. 따라서 핵심 문장은 다섯 번째 문장으로, \u003cb class=\"key\">중괄식\u003c/b> 구조에 해당한다. 앞부분은 왜 새로운 \u003cb class=\"key\">인쇄 \u003c/b>\u003cb class=\"key\">업체\u003c/b>를 고려하는지에 대한 \u003cb class=\"key\">이유\u003c/b>를 제시하고, 뒷부분은 \u003cb class=\"key\">예의\u003c/b>를 갖추는 역할을 한다. 전개 방식은 \u003cb class=\"key\">인과\u003c/b>로, \u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">업데이트\u003c/b>가 필요해서 \u003cb class=\"key\">업체 \u003c/b>\u003cb class=\"key\">고려\u003c/b>, \u003cb class=\"key\">비용 \u003c/b>\u003cb class=\"key\">문의\u003c/b>로 이어지는 흐름이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>As we wish to update (2)\u003c/b>\u003cspan>이유 제시\u003c/span>\u003cb>While reviewing several options (3)\u003c/b>\u003cspan>검토 과정\u003c/span>\u003cb>Before proceeding (5)\u003c/b>\u003cspan>요청 전환\u003c/span>\u003cb>This will greatly help (6)\u003c/b>\u003cspan>결과/이유\u003c/span>\u003cb>Thank you very much (7)\u003c/b>\u003cspan>감사 표현\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">new school promotional brochure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">our brochure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">four-paged brochure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">print 500 copies in full color\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 인과 관계로 볼 수 있어요. 디자인을 업데이트해야 해서 새로운 인쇄 업체를 고려하고, 그래서 비용을 문의하는 흐름이거든요. 구조는 중괄식이에요. 핵심 요청인 비용 문의가 다섯 번째 문장, 즉 편지 중간에 나오죠. 앞부분은 그 요청을 하게 된 배경과 이유를 설명하고, 뒷부분은 감사와 답변 요청으로 예의를 갖추는 구조예요.","hl":"ty"},{"n":9,"text":"신호어를 볼게요. 두 번째 문장의 As we wish to update는 이유를 제시하는 표현이에요. 세 번째 문장의 While reviewing several options는 검토 과정을 나타내고요. 다섯 번째 문장의 Before proceeding은 요청으로 넘어가는 전환 신호예요. 여섯 번째 문장의 This will greatly help는 앞의 요청이 왜 중요한지 그 결과를 설명해 줘요. 그리고 같은 개념이 여러 표현으로 반복되는데, new school promotional brochure에서 our brochure, four-paged brochure, five hundred copies in full color로 이어지면서 브로셔라는 핵심 개념을 강조하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>To whom it may concern\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>관계자분께\u003c/span>\u003c/div>\u003cdiv>\u003cb>teacher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교사\u003c/span>\u003c/div>\u003cdiv>\u003cb>currently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>현재\u003c/span>\u003c/div>\u003cdiv>\u003cb>prepare\u003c/b>\u003cem>동사\u003c/em>\u003cspan>준비하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>promotional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>홍보용의\u003c/span>\u003c/div>\u003cdiv>\u003cb>brochure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소책자, 브로셔\u003c/span>\u003c/div>\u003cdiv>\u003cb>wish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>원하다, 바라다\u003c/span>\u003c/div>\u003cdiv>\u003cb>update\u003c/b>\u003cem>동사\u003c/em>\u003cspan>업데이트하다, 갱신하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>overall\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전반적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>design\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디자인, 설계\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고려하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>printing company\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>인쇄 업체\u003c/span>\u003c/div>\u003cdiv>\u003cb>review\u003c/b>\u003cem>동사\u003c/em>\u003cspan>검토하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>option\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선택지, 옵션\u003c/span>\u003c/div>\u003cdiv>\u003cb>design style\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>디자인 스타일\u003c/span>\u003c/div>\u003cdiv>\u003cb>printing format\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>인쇄 형식\u003c/span>\u003c/div>\u003cdiv>\u003cb>seem\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~처럼 보이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>suit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~에 맞다, 적합하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>need\u003c/b>\u003cem>명사\u003c/em>\u003cspan>요구, 필요\u003c/span>\u003c/div>\u003cdiv>\u003cb>intend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~할 작정이다, 의도하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>four-paged\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>네 쪽 분량의\u003c/span>\u003c/div>\u003cdiv>\u003cb>print\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인쇄하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>copy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부, 권\u003c/span>\u003c/div>\u003cdiv>\u003cb>full color\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>풀컬러, 전체 색상\u003c/span>\u003c/div>\u003cdiv>\u003cb>proceed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cost\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비용\u003c/span>\u003c/div>\u003cdiv>\u003cb>budget\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예산\u003c/span>\u003c/div>\u003cdiv>\u003cb>schedule\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일정\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이제 중요 어휘를 몇 개 짚어 볼게요. 컨선은 관심이나 관계라는 뜻이고, 투 후엄 잇 메이 컨선은 관계자분께라는 공식적인 편지 첫인사예요. 브로슈어는 소책자, 프린팅 컴퍼니는 인쇄 업체를 뜻하죠. 업데이트는 갱신하다, 컨시더는 고려하다, 인텐드는 의도하다라는 의미로 쓰였어요. 프로시드는 진행하다, 코스트는 비용, 버짓과 스케줄은 예산과 일정을 말해요. 룩 포워드 투는 기대하다라는 뜻으로, 답변을 기다릴 때 자주 쓰는 표현이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">update\u003c/b>\u003cspan class=\"m\">업데이트하다, 갱신하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">revise\u003c/span>\u003cspan class=\"s\">renew\u003c/span>\u003cspan class=\"s\">modernize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">maintain\u003c/span>\u003cspan class=\"a\">preserve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consider\u003c/b>\u003cspan class=\"m\">고려하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">contemplate\u003c/span>\u003cspan class=\"s\">think about\u003c/span>\u003cspan class=\"s\">weigh\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">disregard\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">suit\u003c/b>\u003cspan class=\"m\">~에 맞다, 적합하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fit\u003c/span>\u003cspan class=\"s\">match\u003c/span>\u003cspan class=\"s\">satisfy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">mismatch\u003c/span>\u003cspan class=\"a\">clash\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">proceed\u003c/b>\u003cspan class=\"m\">진행하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">continue\u003c/span>\u003cspan class=\"s\">go ahead\u003c/span>\u003cspan class=\"s\">advance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003cspan class=\"a\">halt\u003c/span>\u003cspan class=\"a\">cease\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">effectively\u003c/b>\u003cspan class=\"m\">효과적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">efficiently\u003c/span>\u003cspan class=\"s\">successfully\u003c/span>\u003cspan class=\"s\">productively\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ineffectively\u003c/span>\u003cspan class=\"a\">inefficiently\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">assistance\u003c/b>\u003cspan class=\"m\">도움, 지원\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">help\u003c/span>\u003cspan class=\"s\">support\u003c/span>\u003cspan class=\"s\">aid\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hindrance\u003c/span>\u003cspan class=\"a\">obstruction\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 정리해 볼게요. 업데이트의 동의어는 리바이즈, 리뉴이고, 반의어는 메인테인, 프리저브예요. 컨시더의 동의어는 컨템플레이트, 싱크 어바웃이고, 반의어는 이그노어, 디스리게드입니다. 슈트는 핏, 매치와 같은 뜻이고, 반대는 미스매치, 클래시예요. 프로시드는 컨티뉴, 고 어헤드와 유사하고, 스탑, 홀트가 반대말이에요. 이펙티블리는 이피션틀리, 석세스풀리와 통하고, 인이펙티블리, 인이피션틀리가 반의어입니다. 어시스턴스는 헬프, 서포트, 에이드와 같은 말이고, 힌드런스가 반대 개념이에요. 마지막으로 룩 포워드 투는 어웨이트, 안티시페이트와 비슷하고, 드레드, 피어가 반대 느낌이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관계자분께,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">whom \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">concern\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 교사입니다\u003c/span>\u003cspan class=\"en\">I am a teacher\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Pendington 고등학교에서\u003c/span>\u003cspan class=\"en\">at Pendington High School,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 저희는 현재 준비하고 있습니다\u003c/span>\u003cspan class=\"en\">and we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">currently \u003c/span>\u003cspan class=\"tgt\">preparing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 학교 홍보 소책자를\u003c/span>\u003cspan class=\"en\">a new school promotional brochure.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">관계자분께, 저는 Pendington 고등학교의 교사이며, 현재 저희는 새로운 학교 홍보 소책자를 준비하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 편지의 \u003cb class=\"key\">도입부\u003c/b>로, 발신자가 자신을 소개하고 편지를 쓰는 \u003cb class=\"key\">목적\u003c/b>을 밝힙니다. Pendington 고등학교 교사로서 학교 홍보 소책자를 준비 중이라는 사실을 알리며, 그 뒤 문의의 바탕을 제공합니다. To whom it may concern은 담당자가 특정되지 않았을 때 쓰는 \u003cb class=\"key\">격식 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">편지 \u003c/b>\u003cb class=\"key\">인사말\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사+관계대명사 whom (격식 인사말)\u003c/span> : to + whom + it may concern : \"관계자분께, 담당자 귀하\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + currently + -ing : \"현재 준비하고 있다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"To whom it may concern, 관계자분께. I am a teacher, 저는 교사입니다. at Pendington High School, Pendington 고등학교에서. and we are currently preparing, 그리고 저희는 현재 준비하고 있습니다. a new school promotional brochure, 새로운 학교 홍보 소책자를. 이 문장 전체를 해석하면, 관계자분께, 저는 Pendington 고등학교의 교사이며, 현재 저희는 새로운 학교 홍보 소책자를 준비하고 있습니다.","hl":"m"},{"n":13,"text":"이 문장은 편지의 도입부예요. 발신자가 자신을 소개하고 편지를 쓰는 목적을 밝히면서 학교 홍보 소책자를 준비하고 있다고 알리고 있어요. To whom it may concern은 담당자가 특정되지 않았을 때 쓰는 격식 있는 인사말이에요.","hl":"mn"},{"n":14,"text":"첫 번째로, To whom it may concern에서 whom은 전치사 to 뒤에 온 관계대명사예요. 담당자가 정해지지 않았을 때 쓰는 격식 표현이고, 관계자분께나 담당자 귀하로 해석하면 자연스러워요. 두 번째로, are currently preparing은 현재진행형이에요. 지금 준비를 진행하고 있다는 뜻을 나타내요. currently와 함께 쓰여서 현재 진행 중인 현황을 강조하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희가 업데이트하기를 원하므로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">wish \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">update\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전반적인 디자인을\u003c/span>\u003cspan class=\"en\">the overall design\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희 소책자의\u003c/span>\u003cspan class=\"en\">of our brochure,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 고려하고 있습니다\u003c/span>\u003cspan class=\"en\">we are considering\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 인쇄 업체와 함께 일하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class= \u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 선택지를 검토하던 중,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While \u003c/span>\u003cspan class=\"tgt\">reviewing \u003c/span>\u003cspan class=\"tgt\">several \u003c/span>\u003cspan class=\"tgt\">options\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 느꼈습니다\u003c/span>\u003cspan class=\"en\">we felt\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">귀사의 디자인 스타일과 인쇄 형식이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">design \u003c/span>\u003cspan class=\"tgt\">style \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">printing \u003c/span>\u003cspan class=\"tgt\">formats \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희의 요구사항에 잘 맞아 보인다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">seemed \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">suit \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003cspan class=\"tgt\">well\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러 선택지를 검토하던 중, 귀사의 디자인 스타일과 인쇄 형식이 저희의 요구사항에 잘 맞아 보인다고 느꼈습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 여러 업체를 검토한 끝에 이 회사에 대해 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">평가\u003c/b>를 내렸음을 전합니다. 'suit our needs well'은 우리의 요구에 잘 들어맞는다는 뜻으로, 이 회사를 선택하게 된 \u003cb class=\"key\">근거\u003c/b>가 됩니다. 앞으로 비용 문의로 이어지는 \u003cb class=\"key\">연결 \u003c/b>\u003cb class=\"key\">고리\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">while + 현재분사 (분사구문)\u003c/span> : While + -ing (주어 생략) : \"여러 선택지를 검토하던 중\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that\u003c/span> : felt that + 주어 + 동사 : \"디자인 스타일과 인쇄 형식이 요구에 잘 맞는 것 같다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">seem + to부정사\u003c/span> : seem + to부정사 : \"~인 것 같다, ~처럼 보이다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"While reviewing several options, 여러 선택지를 검토하던 중. we felt, 저희는 느꼈습니다. that your design style and printing formats, 귀사의 디자인 스타일과 인쇄 형식이. seemed to suit our needs well, 저희의 요구사항에 잘 맞아 보인다고. 이 문장 전체를 해석하면, 여러 선택지를 검토하던 중, 귀사의 디자인 스타일과 인쇄 형식이 저희의 요구사항에 잘 맞아 보인다고 느꼈습니다.","hl":"m"},{"n":19,"text":"이 문장은 여러 업체를 검토한 끝에 이 회사에 대해 긍정적인 평가를 내렸음을 전하고 있어요. suit our needs well은 우리의 요구에 잘 들어맞는다는 뜻으로, 이 회사를 선택하게 된 근거가 돼요. 이렇게 마음에 든 회사이기 때문에 앞으로 비용 문의로 이어지는 연결 고리 역할을 해요.","hl":"mn"},{"n":20,"text":"첫 번째로, While reviewing several options에서 while 뒤에 주어와 be동사가 생략된 분사구문이에요. 주절의 주어 we와 일치하니까 while we were reviewing에서 we were를 생략하고 reviewing만 남긴 형태예요. 두 번째로, felt 다음에 나오는 that절은 felt의 목적어로 쓰였어요. 완전한 절을 이끌면서 무엇을 느꼈는지 그 느낌의 내용을 나타내요. 세 번째로, seemed to suit에서 seem은 to부정사를 취해서 어떤 것 같다라는 추측의 의미를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 만들려고 합니다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">intend \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네 쪽짜리 소책자를\u003c/span>\u003cspan class=\"en\">a four-paged brochure\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 인쇄하려고 합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">print\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">500부를\u003c/span>\u003cspan class=\"en\">500 copies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전체 컬러로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">full \u003c/span>\u003cspan class=\"tgt\">color\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저희는 네 쪽의 소책자를 만들어 컬러로 500부 인쇄하려고 합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 네 쪽 분량의 소책자를 500부, 컬러로 인쇄할 계획을 알리는 문장입니다. 견적 요청을 위해 \u003cb class=\"key\">제작 \u003c/b>\u003cb class=\"key\">조건\u003c/b>을 구체적으로 제시하고 있습니다. 여기서 full color는 \u003cb class=\"key\">전면 \u003c/b>\u003cb class=\"key\">컬러\u003c/b> 인쇄를 뜻합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법\u003c/span> : intend [타동사] + [to make (to부정사구/목적어)] : \"만들기를 의도하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 병렬 구조 (to 생략)\u003c/span> : intend to [make A] and [(to) print B] : \"그리고 인쇄하려고 합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 (방식/상태)\u003c/span> : in + full color (전치사구) : \"전체 컬러로\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"We intend to make, 저희는 만들려고 합니다. a four-paged brochure, 네 쪽짜리 소책자를. and print, 그리고 인쇄하려고 합니다. 500 copies, 500부를. in full color, 전체 컬러로. 이 문장 전체를 해석하면, 저희는 네 쪽의 소책자를 만들어 컬러로 500부 인쇄하려고 합니다.","hl":"m"},{"n":22,"text":"이 문장은 네 쪽짜리 소책자를 오백 부, 전체 컬러로 인쇄할 계획을 밝히는 부분이에요. 견적을 요청하기 전에 제작 조건을 구체적으로 제시하고 있죠. full color는 전면 컬러라는 뜻으로 인쇄 방식을 나타내요.","hl":"mn"},{"n":23,"text":"네 번째 문장의 어법 포인트를 볼게요. 첫 번째, intend는 to부정사를 목적어로 취하는 타동사예요. to make가 intend의 목적어 역할을 하면서 만들기를 의도하다로 해석되죠. 두 번째, and print는 앞의 to make와 병렬 연결된 표현이에요. print 앞에는 to가 생략되어 있어요. 세 번째, in full color는 전체 컬러로라는 뜻의 전치사구로 인쇄 방식을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진행하기 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Before \u003c/span>\u003cspan class=\"tgt\">proceeding\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 당신께 여쭤보고 싶습니다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">ask\u003c/span> you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 얼마나 들지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">cost\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일을 진행하기에 앞서, 인쇄 비용이 얼마나 들지 문의드리고 싶습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 일을 진행하기 전에 인쇄 비용이 얼마인지 묻고 싶다는 요청을 전달합니다. 이메일의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">목적\u003c/b>인 \u003cb class=\"key\">견적 \u003c/b>\u003cb class=\"key\">문의\u003c/b>가 드러나는 문장입니다. how much it would cost는 간접의문문으로, 의문문이 아니라 문장의 일부로 쓰였습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : before [전치사] + proceeding [동명사] : \"진행하기 전에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">would like to + 동사원형 (공손한 표현)\u003c/span> : would like [to ask (to부정사구)] : \"여쭤보고 싶습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사절)\u003c/span> : ask + you(목적어) + how much + it(주어) + would(조동사) + cost(동사) : \"그것이 얼마나 들지\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Before proceeding, 진행하기 전에. we would like to ask you, 저희는 당신께 여쭤보고 싶습니다. how much it would cost, 그것이 얼마나 들지. 이 문장 전체를 해석하면, 일을 진행하기에 앞서, 인쇄 비용이 얼마나 들지 문의드리고 싶습니다.","hl":"m"},{"n":25,"text":"이 문장은 본격적으로 일을 진행하기 전에 인쇄 비용이 얼마나 드는지 문의하고 싶다고 말하는 부분이에요. 이메일 전체에서 가장 중요한 견적 문의가 드러나죠. how much it would cost는 간접의문문으로, 의문문이 아니라 문장의 일부로 쓰였어요.","hl":"mn"},{"n":26,"text":"다섯 번째 문장의 어법 포인트를 정리할게요. 첫 번째, Before proceeding에서 before는 전치사라서 뒤에 동명사 proceeding이 왔어요. 진행하기 전에라는 뜻이 되죠. 두 번째, would like to는 want to보다 훨씬 공손한 표현이에요. 뒤에 to부정사를 써서 정중한 요청을 나타내요. 세 번째, how much it would cost는 간접의문문이에요. 의문사 how much 다음에 주어 it, 조동사 would, 동사 cost 순서로 와야 해요. 이게 바로 간접의문문의 어순이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 저희를 크게 도울 것입니다\u003c/span>\u003cspan class=\"en\">This will greatly \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">help \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예산과 일정을 정하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">setting\u003c/span> our \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">budget \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">schedule\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 효과적으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">effectively\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 저희가 예산과 일정을 더 효과적으로 정하는 데 크게 도움이 될 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비용 정보를 요청한 이유를 설명하는 문장입니다. 인쇄 비용을 알면 \u003cb class=\"key\">예산\u003c/b>과 \u003cb class=\"key\">일정\u003c/b>을 더 효과적으로 세울 수 있다는 점을 부드럽게 덧붙입니다. 이메일의 요청이 정당함을 뒷받침하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 (전치사 in의 목적어)\u003c/span> : help + us(목적어) + in + setting(동명사구) : \"우리가 정하는 데 도움이 되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조 (명사 and 명사)\u003c/span> : budget and schedule : \"예산과 일정\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 부사\u003c/span> : more + effectively(부사의 비교급) : \"더 효과적으로\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"This will greatly help us, 이것은 저희를 크게 도울 것입니다. in setting our budget and schedule, 예산과 일정을 정하는 데. more effectively, 더 효과적으로. 이 문장 전체를 해석하면, 이는 저희가 예산과 일정을 더 효과적으로 정하는 데 크게 도움이 될 것입니다.","hl":"m"},{"n":28,"text":"이 문장은 비용 정보를 요청한 이유를 설명하고 있어요. 비용을 미리 알면 예산과 일정을 더 효과적으로 세울 수 있다는 뜻이죠. 요청에 대한 합리적인 근거를 제시해서 상대방의 이해를 돕는 역할을 해요.","hl":"mn"},{"n":29,"text":"여섯 번째 문장의 어법 포인트를 볼게요. 첫 번째, help us in setting에서 in은 전치사라서 뒤에 동명사 setting이 왔어요. 예산과 일정을 정하는 데 도움이 된다는 뜻입니다. 두 번째, budget and schedule은 명사 두 개가 and로 병렬 연결된 구조예요. 세 번째, more effectively는 이 음절 이상 부사의 비교급으로 더 효과적으로라는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대단히 감사합니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Thank \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간 내어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 도움 주셔서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">assistance\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">시간 내어 도움 주셔서 대단히 감사합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 상대방의 \u003cb class=\"key\">시간\u003c/b>과 \u003cb class=\"key\">도움\u003c/b>에 대해 감사를 표현하는 정중한 마무리 인사입니다. your time and assistance는 상대가 자신의 요청을 검토하는 데 들일 시간과 노력을 함께 가리키며, 편지에서 예의를 갖추는 역할을 합니다. Thank you for + 명사는 '~에 대해 감사하다'라는 \u003cb class=\"key\">감사 \u003c/b>\u003cb class=\"key\">표현\u003c/b>으로, 뒤에 명사나 동명사가 옵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감사 관용 표현 (thank + for + 명사/동명사)\u003c/span> : Thank you + very much + for + 명사구/동명사구 : \"~에 대해 대단히 감사합니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬구조\u003c/span> : 명사구 + and + 명사구 : \"당신의 시간과 도움\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Thank you very much, 대단히 감사합니다. for your time, 시간 내어. and assistance, 그리고 도움 주셔서. 이 문장 전체를 해석하면, 시간 내어 도움 주셔서 대단히 감사합니다.","hl":"m"},{"n":31,"text":"이 문장은 상대방의 시간과 도움에 대해 감사를 표현하는 정중한 마무리 인사예요. your time and assistance는 상대가 요청 사항을 검토하느라 들일 시간과 노력을 함께 가리키고, 편지에서 예의를 갖추는 역할을 해요. Thank you for 다음에는 명사나 동명사가 와서 감사 표현을 만든다는 점도 기억해 두면 좋아요.","hl":"mn"},{"n":32,"text":"첫 번째 문법 포인트는 Thank you very much for예요. Thank you for 다음에는 명사나 동명사가 와서 에 대해 감사하다는 뜻을 나타내요. 여기서는 your time and assistance가 for의 목적어로 쓰였어요. 두 번째 문법 포인트는 your time and assistance예요. and가 명사구 두 개를 대등하게 연결하는 병렬구조로, time과 assistance는 둘 다 for의 목적어 역할을 하면서 시간과 도움으로 해석돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기다리겠습니다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">forward \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">귀하의 답변을\u003c/span>\u003cspan class=\"en\">your response.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">귀하의 답변을 기다리겠습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 상대방의 \u003cb class=\"key\">답변\u003c/b>을 기다리겠다는 기대를 표현하며, 편지의 마무리에서 다음 행동을 촉구하는 역할을 합니다. look forward to는 '~을 고대하다'라는 뜻으로, 뒤에 \u003cb class=\"key\">명사\u003c/b>나 \u003cb class=\"key\">동명사\u003c/b>가 오는 점이 중요합니다. 전체적으로 정중하면서도 기대감을 전하는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 to를 취하는 관용 표현 (look forward to + 명사/동명사)\u003c/span> : look forward to + 명사/동명사 : \"~을 고대하다, 기대하다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"I look forward to, 기다리겠습니다. your response, 귀하의 답변을. 이 문장 전체를 해석하면, 귀하의 답변을 기다리겠습니다.","hl":"m"},{"n":34,"text":"이 문장은 상대방의 답변을 기다리겠다는 기대를 정중하게 표현하는 마무리예요. look forward to는 고대하다라는 뜻인데, 여기서 to는 전치사라서 뒤에 명사나 동명사가 온다는 점이 중요해요. 전체적으로 다음 답변을 자연스럽게 촉구하는 역할을 해요.","hl":"mn"},{"n":35,"text":"문법 포인트는 look forward to예요. look forward to에서 to는 to부정사가 아니라 전치사예요. 그래서 뒤에 반드시 명사나 동명사가 와야 하고, 이 문장에서는 your response라는 명사가 전치사 to의 목적어로 쓰였어요. 이 표현은 고대하다라는 뜻으로 편지에서 기대를 나타낼 때 자주 사용해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진심으로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Sincerely,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Sarah Clayton\u003c/span>\u003cspan class=\"en\">Sarah Clayton\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Sarah Clayton 드림\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 편지의 \u003cb class=\"key\">끝인사\u003c/b>와 서명으로, 공식적인 편지 형식에서 정중함을 마무리합니다. Sincerely는 '진심으로'라는 뜻으로, 모르는 상대에게 보내는 공식 편지에서 흔히 쓰는 \u003cb class=\"key\">맺음말\u003c/b>입니다. 뒤에 이름을 쓰면 그 사람이 \u003cb class=\"key\">발신자\u003c/b>임을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">편지 끝인사에 쓰이는 부사 (complimentary close)\u003c/span> : Sincerely, + 서명/이름 : \"진심으로, Sarah Clayton\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Sincerely, 진심으로. Sarah Clayton, Sarah Clayton. 이 문장 전체를 해석하면, Sarah Clayton 드림","hl":"m"},{"n":37,"text":"이 문장은 편지의 끝인사와 서명으로, 공식적인 편지 형식에서 정중함을 마무리하는 부분이에요. Sincerely는 진심으로라는 뜻으로, 모르는 상대에게 보내는 공식 편지에서 흔히 쓰는 맺음말이에요. 뒤에 이름을 쓰면 그 사람이 발신자임을 나타내요.","hl":"mn"},{"n":38,"text":"문법 포인트는 Sincerely예요. Sincerely는 진심으로라는 뜻의 부사로, 공식적인 편지의 끝인사에서 콤마와 함께 쓰여요. 이 뒤에는 보내는 사람의 이름을 써서 예의를 갖춘 마무리를 해요. 여기서는 Sarah Clayton이 발신자 이름으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Pendington 고등학교 교사가 새로운 \u003cb class=\"key\">학교 \u003c/b>\u003cb class=\"key\">홍보 \u003c/b>\u003cb class=\"key\">브로셔\u003c/b>를 준비하고 있다.\u003c/li>\u003cli>브로셔의 \u003cb class=\"key\">디자인\u003c/b>을 업데이트하기 위해 새로운 \u003cb class=\"key\">인쇄 \u003c/b>\u003cb class=\"key\">업체\u003c/b>와 일하는 것을 고려 중이다.\u003c/li>\u003cli>여러 선택지를 검토한 후, 귀사의 \u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">스타일\u003c/b>과 \u003cb class=\"key\">인쇄 \u003c/b>\u003cb class=\"key\">형식\u003c/b>이 요구에 맞다고 판단했다.\u003c/li>\u003cli>네 쪽 분량의 \u003cb class=\"key\">브로셔\u003c/b>를 \u003cb class=\"key\">컬러\u003c/b>로 500부 인쇄하기 전에 \u003cb class=\"key\">인쇄 \u003c/b>\u003cb class=\"key\">비용\u003c/b>을 문의하여 \u003cb class=\"key\">예산과 \u003c/b>\u003cb class=\"key\">일정\u003c/b>을 효과적으로 세우려 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A teacher at Pendington High School writes to a printing company to ask about the cost of printing 500 full-color copies of a four-page promotional brochure.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Pendington 고등학교 교사가 학교 홍보 \u003cb class=\"key\">브로셔\u003c/b>의 디자인을 \u003cb class=\"key\">업데이트\u003c/b>하기 위해 새로운 \u003cb class=\"key\">인쇄 \u003c/b>\u003cb class=\"key\">업체\u003c/b>를 고려하고 있다. 네 쪽 분량의 \u003cb class=\"key\">컬러\u003c/b> 500부 인쇄를 진행하기 전에 \u003cb class=\"key\">인쇄 \u003c/b>\u003cb class=\"key\">비용\u003c/b>을 문의하여 \u003cb class=\"key\">예산과 \u003c/b>\u003cb class=\"key\">일정\u003c/b>을 효과적으로 세우려는 내용이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘은 브로셔 인쇄 비용 문의 편지를 분석했어요. 핵심은 다섯 번째 문장에서 비용을 묻는 부분이고, 그 앞뒤로 배경과 예의 표현이 있는 중괄식 구조였죠. 이런 공식적인 이메일에서는 상대방을 배려하는 표현과 명확한 요청이 중요하다는 점을 기억하세요. 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
