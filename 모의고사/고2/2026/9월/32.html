</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}

lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 32번","audioDir":"32_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">32번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Why a Hotel Room Cannot Replace a Stable Group\u003c/h1>\u003ch2>호텔 방이 안정적 집단을 대신할 수 없는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사람은 \u003cb class=\"key\">불확실성\u003c/b>을 줄이기 위해 환경을 이해하고 \u003cb class=\"key\">공유된 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">이해\u003c/b>를 원한다. 캠퍼스 호텔 방은 물질적으로 좋아 보여도 \u003cb class=\"key\">안정적인 \u003c/b>\u003cb class=\"key\">집단\u003c/b>에 속하지 못해 결국 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">적소\u003c/b>를 찾기 전 불확실성을 겪게 된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>People need shared social understanding from membership in a stable group, so uncertainty itself becomes the problem.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 다룰 지문은 대학 캠퍼스 호텔 이야기를 통해 사람이 왜 공유된 사회적 이해를 필요로 하는지 설명하는 글이에요. 요지는 사람은 안정적인 집단에 속해 공유된 사회적 이해를 얻어야 불확실성을 줄일 수 있다는 것입니다. 요약하면, 물질적으로 좋아 보이는 호텔 방도 사회적 소속감이 없으면 문제가 된다는 거예요. 이제 배경지식부터 차근차근 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람은 불확실한 상황을 싫어해서 주변 환경을 이해하고 예측하려는 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">동기\u003c/b>, cognitive motivation를 가지고 있어요. 그중에서도 특히 중요한 것은 다른 사람과 \u003cb class=\"key\">의미를 \u003c/b>\u003cb class=\"key\">공유\u003c/b>하는 것이에요. 예를 들어 새 학기 반 배정 전에는 누구와 같은 반이 될지 몰라 불안하죠. 이처럼 사회적 소속감이 없으면 어디에 자리 잡을지 몰라 \u003cb class=\"key\">불확실성\u003c/b>을 크게 느껴요. 이 글에서 말하는 사회적 적소, social niche는 자신이 속한 집단 안에서 편안하게 자리 잡은 위치를 뜻해요. 캠퍼스 호텔 방이 아무리 좋아도 그런 \u003cb class=\"key\">소속감\u003c/b>을 주지 못하면 문제가 되는 거예요.\u003c/div>","segs":[{"n":2,"text":"여러분, 사람은 불확실한 상황을 싫어해서 주변 환경을 이해하고 예측하려는 인지적 동기, cognitive motivation를 가지고 있어요. 그중에서도 특히 중요한 것은 다른 사람과 의미를 공유하는 겁니다. 예를 들어 새 학기 반 배정 전에는 누구와 같은 반이 될지 몰라 불안하죠. 이처럼 사회적 소속감이 없으면 어디에 자리 잡을지 몰라 불확실성을 크게 느껴요. 이 글에서 말하는 사회적 적소, social niche는 자신이 속한 집단 안에서 편안하게 자리 잡은 위치를 뜻해요. 캠퍼스 호텔 방이 아무리 좋아도 그런 소속감을 주지 못하면 문제가 되는 거죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>인지적 동기와 공유된 의미\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>인지적 동기 중 가장 근본적인 것은 \u003cb class=\"key\">불확실성\u003c/b>에 대비해 환경을 이해하고 예측하는 것이다. 가장 중요한 것은 사람들이 다른 사람과 \u003cb class=\"key\">공유되는 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 발전시키는 것을 선호한다는 점이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>과잉 입학과 임시 숙소\u003csmall>예시 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>대학이 예상보다 많은 합격자가 오면 일부 학생은 기숙사 라운지나 캠퍼스 호텔에서 지낸다. 라운지가 문제인 것은 쉽게 알 수 있지만, 호텔은 개인 욕실, 전용 TV, 넓은 방이 있어 \u003cb class=\"key\">겉보기에는\u003c/b> 나쁘지 않다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>호텔 생활의 진짜 문제\u003csmall>반박 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>사실 호텔 생활이 문제인 이유는 그 학생들이 일 년 동안 이웃이 될 사람들과 \u003cb class=\"key\">안정적인 \u003c/b>\u003cb class=\"key\">집단\u003c/b>을 이루지 못하기 때문이다. 그래서 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">적소\u003c/b>를 찾기 전까지 불확실한 상태에서 기다려야 하며, \u003cb class=\"key\">불확실성 \u003c/b>\u003cb class=\"key\">그 \u003c/b>\u003cb class=\"key\">자체\u003c/b>가 문제이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>공유된 사회적 이해의 결여\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>사람들은 보통 \u003cb class=\"key\">안정적인 \u003c/b>\u003cb class=\"key\">집단의 \u003c/b>\u003cb class=\"key\">구성원 \u003c/b>\u003cb class=\"key\">자격\u003c/b>에서 생기는 \u003cb class=\"key\">공유된 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">이해\u003c/b>가 결여되어 있다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름은 먼저 핵심 주장을 던지고, 캠퍼스 호텔 사례를 들어 반박한 뒤 결론을 다시 정리하는 순서로 이어집니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 인지적 동기 중 가장 근본적인 것이 불확실성에 대비해 환경을 이해하고 예측하는 것임을 말해요. 특히 중요한 것은 사람들이 다른 사람과 공유되는 의미를 발전시키는 것을 선호한다는 점이에요. 즉 인간은 혼자보다 함께 의미를 만들어 가며 불안을 줄이려는 존재라는 거죠.","hl":"f0"},{"n":5,"text":"세 번째 문장부터 여섯 번째 문장까지는 구체적인 예시가 나와요. 대학이 예상한 것보다 더 많은 학생이 입학 허가를 받아들이면 일부 학생은 기숙사 라운지나 캠퍼스 호텔에 배정됩니다. 라운지 생활은 옷장도 없어서 문제인 게 바로 보이죠. 그런데 호텔은 개인 욕실도 있고 전용 TV도 있고 방도 넓으니 얼핏 괜찮아 보인다고 반문해요.","hl":"f1"},{"n":6,"text":"일곱 번째와 여덟 번째 문장에서 진짜 문제가 드러나요. 캠퍼스 호텔 학생들은 일 년 동안 이웃이 될 사람들과 안정적인 집단을 이루지 못해요. 그래서 사회적 적소를 찾기 전까지 불확실한 상태에서 기다려야 하고, 바로 그 불확실성 그 자체가 문제라고 강조해요.","hl":"f2"},{"n":7,"text":"마지막 아홉 번째 문장은 결론이에요. 사람은 안정적인 집단의 구성원 자격에서 보통 생기는 공유된 사회적 이해가 결여되어 있어요. 결국 좋은 방보다 중요한 것은 소속감과 공유된 이해라는 말이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">처음 두 문장에서 사람들이 \u003cb class=\"key\">불확실성\u003c/b>을 줄이기 위해 \u003cb class=\"key\">공유되는 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 선호한다는 핵심 주장을 제시한다. 이어서 과잉 입학으로 캠퍼스 호텔에 배정된 학생들의 사례를 근거로 들어 \u003cb class=\"key\">안정적인 \u003c/b>\u003cb class=\"key\">집단\u003c/b>과 \u003cb class=\"key\">공유된 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">이해\u003c/b>가 없다는 것을 보여 준다. 마지막 문장에서 다시 \u003cb class=\"key\">공유된 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">이해\u003c/b>의 결여를 언급하며 주장을 재확인하는 두괄식 구조이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (3)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>But (5)\u003c/b>\u003cspan>반론 제기\u003c/span>\u003cb>After all (6)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003cb>In fact (7)\u003c/b>\u003cspan>반박·강조\u003c/span>\u003cb>itself (8)\u003c/b>\u003cspan>강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">develop meanings that are shared with other people\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a stable group\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">their social niche\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a shared social understanding\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">membership in a stable group\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>캠퍼스 호텔의 겉보기 장점\u003c/th>\u003cth>실제 사회적 문제\u003c/th>\u003c/tr>\u003ctr>\u003ctd>개인 욕실, 전용 TV, 넓은 방\u003c/td>\u003ctd>안정적 집단에 속하지 못함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>물질적으로 편리해 보임\u003c/td>\u003ctd>사회적 적소를 찾기 전의 불확실성\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전형적인 주장과 근거 구조예요. 처음 두 문장에서 핵심 주장을 먼저 제시하는 두괄식으로 시작해서, 뒤에서 캠퍼스 호텔 사례를 근거로 들고 마지막에 결론을 다시 확인해 줍니다. 특히 중간에 하지만, 사실 같은 표현으로 예상되는 반론을 반박하는 힘을 주고 있어요. 주제문은 두 번째 문장으로 보는 게 자연스럽습니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 For example이 세 번째 문장에서 예시를 시작해 주고, But이 다섯 번째 문장에서 예상되는 반론을 끌어와요. After all이 여섯 번째 문장에서 호텔이 괜찮아 보이는 이유를 덧붙이고, In fact가 일곱 번째 문장에서 기대를 뒤집는 진짜 이유를 강조하죠. 또 uncertainty라는 단어가 첫 문장에서 불확실성의 경우로 나오고, 일곱 번째와 여덟 번째 문장에서 불확실한 상태와 불확실성 그 자체로 되풀이되면서 핵심 개념으로 부각됩니다. shared meanings는 마지막에 a shared social understanding로 재진술되면서 주제가 선명해져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>cognitive motivations\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인지적 동기\u003c/span>\u003c/div>\u003cdiv>\u003cb>fundamental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>근본적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>encourage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~하도록 이끌다, 장려하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>predict\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예측하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>uncertainty\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불확실성\u003c/span>\u003c/div>\u003cdiv>\u003cb>prefer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shared\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공유된\u003c/span>\u003c/div>\u003cdiv>\u003cb>accept offers of admission\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>입학 허가를 받아들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>expects\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quite a few\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>꽤 많은\u003c/span>\u003c/div>\u003cdiv>\u003cb>end up -ing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결국 ~하게 되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dorm lounges\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기숙사 라운지\u003c/span>\u003c/div>\u003cdiv>\u003cb>campus hotels\u003c/b>\u003cem>명사\u003c/em>\u003cspan>캠퍼스 호텔\u003c/span>\u003c/div>\u003cdiv>\u003cb>problematic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>문제가 되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>closet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>옷장\u003c/span>\u003c/div>\u003cdiv>\u003cb>for one thing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우선, 한 가지 이유로\u003c/span>\u003c/div>\u003cdiv>\u003cb>After all\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결국, 어쨌든\u003c/span>\u003c/div>\u003cdiv>\u003cb>private bathrooms\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인 욕실\u003c/span>\u003c/div>\u003cdiv>\u003cb>stable group\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안정적인 집단\u003c/span>\u003c/div>\u003cdiv>\u003cb>neighbors\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이웃\u003c/span>\u003c/div>\u003cdiv>\u003cb>wait in uncertainty\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>불확실한 상태에서 기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>social niche\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회적 적소\u003c/span>\u003c/div>\u003cdiv>\u003cb>uncertainty itself\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불확실성 그 자체\u003c/span>\u003c/div>\u003cdiv>\u003cb>lack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결여되어 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>a shared social understanding\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공유된 사회적 이해\u003c/span>\u003c/div>\u003cdiv>\u003cb>membership\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구성원 자격\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘를 몇 개 짚어 볼게요. cognitive motivations는 인지적 동기, fundamental은 근본적인이라는 뜻이에요. predict는 예측하다, quite a few는 꽤 많은이라는 뜻이고, end up -ing는 결국 어떤 상태에 이르다는 표현이에요. stable group은 안정적인 집단, social niche는 사회적 적소라는 뜻으로 이 지문의 핵심 개념이에요. 마지막으로 lack은 결여되어 있다는 뜻의 동사로 쓰였어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">fundamental\u003c/b>\u003cspan class=\"m\">근본적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">basic\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">primary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">secondary\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">uncertainty\u003c/b>\u003cspan class=\"m\">불확실성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unpredictability\u003c/span>\u003cspan class=\"s\">doubt\u003c/span>\u003cspan class=\"s\">instability\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">certainty\u003c/span>\u003cspan class=\"a\">predictability\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">prefer\u003c/b>\u003cspan class=\"m\">선호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">favor\u003c/span>\u003cspan class=\"s\">choose\u003c/span>\u003cspan class=\"s\">opt for\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dislike\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">problematic\u003c/b>\u003cspan class=\"m\">문제가 되는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">troublesome\u003c/span>\u003cspan class=\"s\">difficult\u003c/span>\u003cspan class=\"s\">challenging\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unproblematic\u003c/span>\u003cspan class=\"a\">easy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stable\u003c/b>\u003cspan class=\"m\">안정적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">secure\u003c/span>\u003cspan class=\"s\">steady\u003c/span>\u003cspan class=\"s\">constant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unstable\u003c/span>\u003cspan class=\"a\">shaky\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">lack\u003c/b>\u003cspan class=\"m\">결여되어 있다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">be without\u003c/span>\u003cspan class=\"s\">need\u003c/span>\u003cspan class=\"s\">miss\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">have\u003c/span>\u003cspan class=\"a\">possess\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">shared\u003c/b>\u003cspan class=\"m\">공유된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"s\">collective\u003c/span>\u003cspan class=\"s\">mutual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">individual\u003c/span>\u003cspan class=\"a\">private\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 동의어와 반의어로 시험 어휘를 정리해 볼게요. uncertainty는 불확실성이라는 뜻이고, unpredictability나 doubt와 같은 말로 바꿔 쓸 수 있어요. 반대는 certainty나 predictability입니다. stable은 안정적인이라는 뜻으로 secure나 steady와 통하고, unstable이나 shaky와 반대예요. lack은 무엇이 없다는 뜻으로 be without과 가깝고, have나 possess와 반대입니다. shared는 공유된이라는 뜻으로 common이나 mutual과 가깝고, 반대는 individual이나 private이에요. 이렇게 핵심 어휘를 묶어서 기억하면 독해와 어휘 문제에 모두 도움이 됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인지적 동기들 중에서\u003c/span>\u003cspan class=\"en\">Of the cognitive motivations,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 근본적인 것은\u003c/span>\u003cspan class=\"en\">the most fundamental one\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 자신의 환경을 이해하도록 이끈다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">encourages \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understand \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">environment\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇이 일어날지 예측하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">predict \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">happen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불확실성의 경우에\u003c/span>\u003cspan class=\"en\">in case of uncertainties.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인지적 동기 중에서, 가장 근본적인 것은 사람들이 불확실성의 경우에서 무엇이 일어날지 예측하기 위해 자신의 환경을 이해하게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인지적 동기 중 가장 근본적인 동기는 사람들이 \u003cb class=\"key\">불확실성\u003c/b>이 닥칠 때를 대비해 환경을 이해하고 예측하려 한다는 뜻이다. 글 전체의 출발점으로, 뒤에 나올 공유된 의미와 불확실성 문제의 바탕을 깔아준다. 여기서 environment는 단순한 자연 환경이 아니라 \u003cb class=\"key\">자신이 \u003c/b>\u003cb class=\"key\">처한 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 뜻한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 목적격 보어 (5형식)\u003c/span> : encourage + 목적어(people) + to부정사(목적격 보어) : \"사람들이 자신의 환경을 이해하도록 이끈다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to understand ... to predict : \"무엇이 일어날지 예측하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사절)\u003c/span> : predict + [what + is + going to happen] : \"무엇이 일어날 것인지\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Of the cognitive motivations, 인지적 동기들 중에서. the most fundamental one, 가장 근본적인 것은. encourages people to understand their environment, 사람들이 자신의 환경을 이해하도록 이끈다. to predict what is going to happen, 무엇이 일어날지 예측하도록. in case of uncertainties, 불확실성의 경우에. 이 문장 전체를 해석하면, 인지적 동기 중에서, 가장 근본적인 것은 사람들이 불확실성의 경우에서 무엇이 일어날지 예측하기 위해 자신의 환경을 이해하게 한다.","hl":"m"},{"n":13,"text":"이 문장은 인지적 동기 중에서 가장 근본적인 것이 무엇인지 설명해요. 사람들은 불확실한 상황에서 무슨 일이 일어날지 예측하기 위해 자신의 환경을 이해하려고 한다는 거예요. 여기서 말하는 불확실성이라는 개념이 이 글 전체의 핵심 키워드로 계속 이어집니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 encourages people to understand their environment에서 to부정사가 목적격 보어로 쓰인 거예요. encourage는 목적어 people 뒤에 to부정사를 취해서 사람들이 이해하도록 이끈다는 의미를 만들어요. 두 번째 포인트는 to predict가 앞선 to understand의 목적을 나타내는 부사적 용법이라는 점이에요. 마지막으로 what is going to happen은 predict의 목적어로 쓰인 간접의문문인데, 의문사 what 다음에 주어와 동사가 평서문 어순으로 온다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 중요한 것은,\u003c/span>\u003cspan class=\"en\">Most important,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 선호한다\u003c/span>\u003cspan class=\"en\">people prefer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미를 발전시키는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">develop \u003c/span>\u003cspan class=\"tgt\">meanings\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공유되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">shared \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가장 중요한 점은, 사람들이 다른 사람들과 공유되는 의미를 발전시키는 것을 선호한다는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 가장 중요하게 여기는 것은 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">사람들과 \u003c/b>\u003cb class=\"key\">공유되는 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 만들어 내는 것이라는 내용이다. 앞 문장의 환경 이해보다 더 핵심적인 인지적 동기를 제시하며, 뒤에 나올 안정적 집단과 공유된 사회적 이해의 부재를 설명하는 단초가 된다. 여기서 meanings는 혼자만의 생각이 아니라 \u003cb class=\"key\">사회적으로 \u003c/b>\u003cb class=\"key\">통용되는 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 말한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법\u003c/span> : prefer + [to develop meanings (to부정사구/목적어)] : \"의미를 발전시키는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 that (주격) + 수동태\u003c/span> : meanings + [that + are shared(with other people)] : \"다른 사람들과 공유되는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Most important, 가장 중요한 것은. people prefer, 사람들은 선호한다. to develop meanings, 의미를 발전시키는 것을. that are shared, 공유되는. with other people, 다른 사람들과. 이 문장 전체를 해석하면, 가장 중요한 점은, 사람들이 다른 사람들과 공유되는 의미를 발전시키는 것을 선호한다는 것이다.","hl":"m"},{"n":16,"text":"이 문장은 가장 중요한 점으로 사람들이 다른 사람들과 공유되는 의미를 발전시키는 것을 선호한다고 말해요. 앞 문장에서 말한 환경 예측보다 더 상위에 있는 동기라고 볼 수 있죠. 공유된 의미가 없다는 게 이 글 후반부 불확실성 문제와 연결됩니다.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 prefer 다음에 오는 to develop meanings가 to부정사의 명사적 용법으로 prefer의 목적어 역할을 한다는 거예요. 두 번째는 meanings를 수식하는 관계대명사 that 절인데, that are shared with other people에서 that이 주격 관계대명사이고 are shared는 수동태입니다. 선행사 meanings가 공유되는 대상이라는 수동의 의미를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 해에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">given \u003c/span>\u003cspan class=\"tgt\">year \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 사람들이 입학 허가를 받아들이면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">accept \u003c/span>\u003cspan class=\"tgt\">offers \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">admission \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 대학이 예상하는 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">college \u003c/span>\u003cspan class=\"tgt\">expects\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꽤 다수의 학생들이 결국 살게 된다\u003c/span>\u003cspan class=\"en\">quite a few students \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">end \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">living\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기숙사 라운지에서\u003c/span>\u003cspan class=\"en\">in dorm lounges\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 캠퍼스 호텔에서\u003c/span>\u003cspan class=\"en\">or campus hotels.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 어떤 해에 대학이 예상한 것보다 더 많은 사람이 입학 허가를 받아들이면, 꽤 다수의 학생이 결국 기숙사 라운지나 캠퍼스 호텔에서 살게 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 말한 \u003cb class=\"key\">불확실성\u003c/b>이 실제로 생기는 구체적인 사례를 든 문장이다. 예상보다 입학 수락자가 많으면 기숙사 배정이 어려워져 라운지나 캠퍼스 호텔 같은 임시 거처에 머물게 된다는 것이다. 'quite a few'는 적지 않은, \u003cb class=\"key\">꽤 \u003c/b>\u003cb class=\"key\">많은\u003c/b>이라는 관용적 표현이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 (if)\u003c/span> : if + 주어(more people) + 동사(accept) + 목적어(offers) : \"어떤 해에 더 많은 사람들이 입학 허가를 받아들이면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교구문 (more ~ than)\u003c/span> : more + 명사(people) + than + 주어+동사 : \"한 대학이 예상하는 것보다 더 많은 사람들이 입학 허가를 받아들이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">end up + 동명사\u003c/span> : end up + [-ing(동명사)] : \"결국 ~하게 된다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"For example, 예를 들어. if in a given year, 어떤 해에. more people accept offers of admission, 더 많은 사람들이 입학 허가를 받아들이면. than a college expects, 한 대학이 예상하는 것보다. quite a few students end up living, 꽤 다수의 학생들이 결국 살게 된다. in dorm lounges, 기숙사 라운지에서. or campus hotels, 또는 캠퍼스 호텔에서. 이 문장 전체를 해석하면, 예를 들어, 어떤 해에 대학이 예상한 것보다 더 많은 사람이 입학 허가를 받아들이면, 꽤 다수의 학생이 결국 기숙사 라운지나 캠퍼스 호텔에서 살게 된다.","hl":"m"},{"n":19,"text":"이 문장은 앞에서 말한 불확실성이 실제로 어떤 상황에서 생기는지 예를 들어 보여줘요. 어떤 해에 대학이 예상한 것보다 입학 허가를 받아들이는 사람이 많으면, 많은 학생들이 기숙사 라운지나 캠퍼스 호텔에서 살게 된다는 거예요. quite a few는 꽤 많은이라는 뜻의 관용 표현입니다.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 if가 이끄는 조건의 부사절이에요. 어떤 해에 더 많은 사람들이 입학 허가를 받아들이면이라는 조건을 나타내죠. 두 번째는 more people than a college expects에서 more와 than이 짝을 이루는 비교구문입니다. 대학이 예상하는 것보다 더 많은 사람이라는 뜻이에요. 세 번째는 quite a few students end up living에서 end up 다음에 동명사 living이 와서 결국 살게 된다는 결과를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해하기는 쉽다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">easy \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">라운지에서 사는 것이 왜 문제가 되는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">living \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">lounge \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">problematic\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(우선 옷장이 없다).\u003c/span>\u003cspan class=\"en\">(no closet, for one thing).\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">라운지에서 사는 것이 왜 문제가 되는지 이해하기는 쉽다(우선 옷장이 없다).\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 라운지에서 사는 것이 왜 문제인지 \u003cb class=\"key\">이해하기 \u003c/b>\u003cb class=\"key\">쉽다\u003c/b>고 전제하며, 뒤에 나올 캠퍼스 호텔과 대비하기 위한 \u003cb class=\"key\">출발점\u003c/b> 역할을 합니다. 'no closet' 같은 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 괄호로 덧붙여 독자의 공감을 끌어냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어-진주어 구문\u003c/span> : It(가주어) + is + easy(보어) + to understand(진주어) : \"이해하는 것은 쉽다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사 why가 이끄는 명사절)\u003c/span> : understand + [why + 주어(living in the lounge) + 동사(is) + 보어(problematic)] : \"라운지에서 사는 것이 왜 문제가 되는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사구 주어 역할\u003c/span> : living(동명사) + in the lounge(부사구) : \"라운지에서 사는 것\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It is easy to understand, 이해하기는 쉽다. why living in the lounge is problematic, 라운지에서 사는 것이 왜 문제가 되는지. (no closet, for one thing), (우선 옷장이 없다).. 이 문장 전체를 해석하면, 라운지에서 사는 것이 왜 문제가 되는지 이해하기는 쉽다(우선 옷장이 없다).","hl":"m"},{"n":22,"text":"이 문장은 라운지에서 사는 것이 왜 문제인지 이해하기 쉽다고 전제하면서, 뒤에 캠퍼스 호텔과 대비하기 위한 출발점을 만들어요. 괄호로 옷장이 없다는 구체적 예시를 덧붙여서 독자가 바로 공감하게 하죠. 결국 라운지 문제는 명백하다는 걸 짚고 넘어가는 거예요.","hl":"mn"},{"n":23,"text":"첫 번째, It is easy to understand에서 It이 가주어이고 to understand 이하가 진주어입니다. 이해하는 것은 쉽다라고 해석하죠. 실제 주어인 to부정사구가 길기 때문에 문장 맨 앞에 형식상의 It을 두고 진짜 주어를 뒤로 보낸 구조예요. 두 번째, why living in the lounge is problematic은 understand의 목적어로 쓰인 간접의문문입니다. 의문사 why 다음에 living in the lounge가 주어, is가 동사, problematic이 보어로 와서 라운지에서 사는 것이 왜 문제가 되는지라는 명사절을 만들어요. 세 번째, living in the lounge는 동명사구로 여기서 주어 역할을 합니다. 사는 것이라는 명사적 의미를 가지죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무엇이 문제인가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">wrong \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">room\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">캠퍼스 호텔의?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">campus \u003c/span>\u003cspan class=\"tgt\">hotels\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 캠퍼스 호텔의 방은 무엇이 문제일까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 바로 앞 문장의 \u003cb class=\"key\">라운지\u003c/b> 문제와 달리, 시설이 더 좋아 보이는 \u003cb class=\"key\">캠퍼스 \u003c/b>\u003cb class=\"key\">호텔\u003c/b>의 방은 무엇이 문제인지 묻습니다. \u003cb class=\"key\">수사 \u003c/b>\u003cb class=\"key\">의문문\u003c/b> 형태로 독자의 호기심을 자극하고, 다음 문장에서 호텔의 장점을 나열할 준비를 합니다. What is wrong with something은 &quot;~에 무슨 문제가 있는가?&quot;라는 \u003cb class=\"key\">관용적 \u003c/b>\u003cb class=\"key\">표현\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">what을 이용한 의문문\u003c/span> : What(의문사) + is(동사) + wrong(보어) + with a room(전치사구) : \"방은 무엇이 문제인가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : at + campus hotels(명사구) : \"캠퍼스 호텔에 있는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"But, 하지만. what is wrong, 무엇이 문제인가. with a room, 방에. at campus hotels?, 캠퍼스 호텔의?. 이 문장 전체를 해석하면, 하지만 캠퍼스 호텔의 방은 무엇이 문제일까?","hl":"m"},{"n":25,"text":"이 문장은 라운지와 달리 시설이 더 좋아 보이는 캠퍼스 호텔의 방이 무엇이 문제인지 물어보는 수사 의문문입니다. 독자의 호기심을 불러일으키면서 다음 문장에서 호텔의 장점을 나열할 준비를 해요. What is wrong with something은 무엇에 무슨 문제가 있느냐고 묻는 관용적 표현이죠.","hl":"mn"},{"n":26,"text":"첫 번째, what is wrong with a room은 타동사 없이 be동사가 쓰인 의문문입니다. 의문사 what이 문장 맨 앞에 오고 is가 그 뒤를 따르면서 방은 무엇이 문제인가라고 묻죠. 이 표현은 어떤 대상에 문제가 있는지 물을 때 자주 쓰는 관용적 어법이에요. 두 번째, at campus hotels는 전치사 at이 이끄는 전치사구입니다. 앞에 있는 명사 a room을 뒤에서 수식해서 캠퍼스 호텔에 있는 방이라는 뜻을 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결국,\u003c/span>\u003cspan class=\"en\">After all,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호텔에 있는 학생들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">students \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">hotel\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인 욕실을 갖게 되고,\u003c/span>\u003cspan class=\"en\">get \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">private \u003c/span>\u003cspan class=\"tgt\">bathrooms, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전용 TV를 갖게 되고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">TV, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 더 넓은 방을 갖게 된다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">larger \u003c/span>\u003cspan class=\"tgt\">rooms\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결국, 호텔에 있는 학생들은 개인 욕실, 전용 TV, 그리고 더 넓은 방을 갖게 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">캠퍼스 \u003c/b>\u003cb class=\"key\">호텔\u003c/b>에 사는 학생들이 누리는 \u003cb class=\"key\">표면적 \u003c/b>\u003cb class=\"key\">장점\u003c/b>을 나열합니다. 'After all'로 방금 한 질문에 대한 \u003cb class=\"key\">근거\u003c/b>를 덧붙이며, 겉으로 보기에는 호텔이 더 좋아 보인다는 점을 인정하는 역할을 합니다. 그러나 이 장점들은 뒤에서 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">소속감\u003c/b>이 없다는 진짜 문제와 대비됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : students + in a hotel(전치사구) : \"호텔에 있는 학생들은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">A, B, and C 병렬 구조\u003c/span> : A(private bathrooms), B(their own TV), and C(larger rooms) : \"개인 욕실, 전용 TV, 그리고 더 넓은 방\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"After all, 결국. students in a hotel, 호텔에 있는 학생들은. get private bathrooms, 개인 욕실을 갖게 되고. their own TV, 전용 TV를 갖게 되고. and larger rooms, 그리고 더 넓은 방을 갖게 된다.. 이 문장 전체를 해석하면, 결국, 호텔에 있는 학생들은 개인 욕실, 전용 TV, 그리고 더 넓은 방을 갖게 된다.","hl":"m"},{"n":28,"text":"이 문장은 호텔에 사는 학생들이 겉으로 보기에 누리는 장점들을 나열합니다. 결국이라는 After all로 앞선 질문에 대한 근거를 덧붙이며, 호텔이 시설만 보면 더 좋아 보인다는 점을 인정해요. 하지만 이런 표면적 장점은 다음 문장에서 사회적 소속감 부족이라는 진짜 문제와 대비됩니다.","hl":"mn"},{"n":29,"text":"첫 번째, students in a hotel에서 전치사구 in a hotel이 앞의 명사 students를 뒤에서 수식합니다. 그래서 호텔에 있는 학생들이라고 해석하죠. 두 번째, private bathrooms, their own TV, and larger rooms는 세 개의 명사구가 and로 연결된 병렬 구조입니다. 모두 동사 get의 목적어로 쓰여서 학생들이 갖게 되는 것들을 나란히 나열해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실, 이런 호텔에서 사는 것은 문제가 된다\u003c/span>\u003cspan class=\"en\">In fact, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">living \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">hotels\u003c/span> is problematic\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그 학생 거주자들이 안정적인 집단의 일원이 아니기 때문이다\u003c/span>\u003cspan class=\"en\">because the student residents are not a part of a stable group\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그해 동안 그들의 이웃이 될 사람들과 함께하는\u003c/span>\u003cspan class=\"en\">with people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">neighbors \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">year\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 불확실한 상태에서 기다려야만 한다\u003c/span>\u003cspan class=\"en\">they must wait in uncertainty\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 사회적 적소를 찾기 전까지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">finding \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">niche\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사실, 이런 호텔에서 사는 것이 문제가 되는데 왜냐하면 그 학생 거주자들이 그해 동안 이웃이 될 사람들과 함께하는 안정적인 집단의 일원이 아니기 때문이다. 그래서 그들은 자신의 사회적 적소를 찾기 전까지 불확실한 상태에서 기다려야만 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 캠퍼스 호텔이 겉보기에는 좋아 보여도 문제인 이유를 예시에서 일반화해 주는 문장이다. 학생들이 일 년 동안 함께할 \u003cb class=\"key\">안정적인 \u003c/b>\u003cb class=\"key\">집단\u003c/b>에 속하지 못해 자신의 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">적소\u003c/b>를 찾기 전까지 \u003cb class=\"key\">불확실성\u003c/b>을 겪는다는 점이 핵심이다. social niche은 사회 안에서 자신이 자리 잡을 위치나 역할을 뜻하는 표현이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구의 주어 역할\u003c/span> : living in those hotels [동명사구] + is + problematic : \"그 호텔들에서 사는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : people + who [주격 관계대명사] + will be + their neighbors for the year : \"그해 동안 그들의 이웃이 될\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 before + 동명사\u003c/span> : before + finding [동명사구] : \"자신의 사회적 적소를 찾기 전에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In fact, living in those hotels is problematic, 사실, 이런 호텔에서 사는 것은 문제가 된다. because the student residents are not a part of a stable group, 왜냐하면 그 학생 거주자들이 안정적인 집단의 일원이 아니기 때문이다. with people who will be their neighbors for the year, 그해 동안 그들의 이웃이 될 사람들과 함께하는. they must wait in uncertainty, 그들은 불확실한 상태에서 기다려야만 한다. before finding their social niche, 자신의 사회적 적소를 찾기 전까지. 이 문장 전체를 해석하면, 사실, 이런 호텔에서 사는 것이 문제가 되는데 왜냐하면 그 학생 거주자들이 그해 동안 이웃이 될 사람들과 함께하는 안정적인 집단의 일원이 아니기 때문이다. 그래서 그들은 자신의 사회적 적소를 찾기 전까지 불확실한 상태에서 기다려야만 한다.","hl":"m"},{"n":31,"text":"이 문장은 캠퍼스 호텔이 겉보기에는 좋아도 문제가 되는 까닭을 정리해 줍니다. 학생들이 일 년 동안 함께할 안정적인 집단에 속하지 못하면 자신의 사회적 적소를 찾기 전까지 불확실성을 겪는다는 게 핵심이에요. 여기서 사회적 적소라는 말은 사회 안에서 자기가 자리 잡을 위치나 역할을 뜻합니다.","hl":"mn"},{"n":32,"text":"문법 포인트는 세 가지예요. 첫 번째로 living in those hotels는 동명사구가 주어로 쓰였고, 단수 취급되어 is가 왔습니다. 두 번째로 who will be their neighbors for the year는 앞의 people을 수식하는 주격 관계대명사절입니다. 세 번째로 before finding their social niche에서 before가 전치사라서 뒤에 동명사 finding이 왔습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불확실성 그 자체는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">uncertainty \u003c/span>\u003cspan class=\"tgt\">itself\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문제이다\u003c/span>\u003cspan class=\"en\">is the problem.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">불확실성 그 자체가 문제인 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 바로 앞 문장의 핵심 원인을 한 문장으로 압축한 결론이다. 호텔 시설 자체가 나쁜 것이 아니라 예측할 수 없는 상태, 즉 \u003cb class=\"key\">불확실성 \u003c/b>\u003cb class=\"key\">그 \u003c/b>\u003cb class=\"key\">자체\u003c/b>가 문제임을 강조한다. 따라서 앞의 호텔 사례를 일반 원리로 전환하는 역할을 한다.\u003c/div>\u003cdiv class=\"l \">이해\u003c/b>이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>People need shared social understanding from membership in a stable group, so uncertainty itself becomes the problem.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사람은 \u003cb class=\"key\">불확실성\u003c/b>을 줄이기 위해 환경을 이해하고 \u003cb class=\"key\">공유된 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">이해\u003c/b>를 원한다. 캠퍼스 호텔 방은 물질적으로 좋아 보여도 \u003cb class=\"key\">안정적인 \u003c/b>\u003cb class=\"key\">집단\u003c/b>에 속하지 못해 결국 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">적소\u003c/b>를 찾기 전 불확실성을 겪게 된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 지문을 정리하면, 사람은 불확실성을 줄이기 위해 환경을 이해하고 특히 다른 사람과 공유되는 의미를 선호한다는 것이 핵심이에요. 캠퍼스 호텔 방은 물질적으로 좋아 보이지만 안정적인 집단이 아니어서 사회적 적소를 찾기 전에는 불확실성이 계속됩니다. 결국 필요한 것은 안정적인 집단의 구성원 자격에서 오는 공유된 사회적 이해라는 거죠. 오늘은 여기까지입니다. 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
