 것도 모두 사회적 적소(Social niche), 즉 무리 내에서 나의 안정적인 위치를 찾기 위한 자연스러운 행동이랍니다. 결국 인간에게는 아무리 물질적으로 화려하고 좋은 개인 환경이 주어지더라도 소속감과 심리적 안정감을 주는 확고한 집단이 없다면 그 불확실성 자체가 큰 스트레스가 될 수 있다는 심리학적 배경을 바탕에 두고 지문을 읽어보시면 훨씬 이해가 쉬우실 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입</div><ul><li>인간의 가장 근본적인 인지적 동기는 불확실성에 대비해 환경을 이해하고 타인과 의미를 공유하는 것이다.</li><li>불확실성(uncertainties)에 대비하여 환경을 예측하려는 본능</li><li>타인과 공유된 의미(shared meanings)를 형성하려는 선호</li><li>핵심 키워드: 인지적 동기(cognitive motivations)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02상황 예시</div><ul><li>대학의 신입생 초과 수용으로 인해 학생들이 임시 거주지에 머물게 되는 상황을 제시한다.</li><li>입학 수락 인원 초과(accept offers of admission)</li><li>기숙사 라운지나 캠퍼스 호텔(campus hotels)에 거주하게 된 학생들</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03의문 제기</div><ul><li>시설이 열악한 라운지와 달리, 더 좋은 시설을 갖춘 호텔 거주가 왜 문제가 되는지 의문을 던진다.</li><li>라운지 거주의 문제점은 명백함(옷장 부재 등)</li><li>호텔은 개인 욕실과 TV 등 더 나은 물리적 시설을 제공함</li><li>의문점: 그런데도 왜 호텔 거주가 문제가 되는가?</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04문제의 원인</div><ul><li>호텔 거주의 진짜 문제는 이웃이 될 안정적인 집단에 속하지 못해 생기는 불안정성이다.</li><li>안정적인 집단(stable group)의 일부가 되지 못함</li><li>자신의 사회적 적소(social niche)를 찾기 전까지 기다려야 하는 상황</li><li>핵심 키워드: 불확실성(uncertainty)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05결론</div><ul><li>결국 사람들에게는 안정적인 집단을 통해 형성되는 공유된 사회적 이해가 필수적이다.</li><li>불확실성 그 자체가 근본적인 문제임</li><li>안정적인 집단의 멤버십(membership) 부재</li><li>공유된 사회적 이해(shared social understanding)의 결핍 현상 발생</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cognitive</td><td class=\"m\">인지의, 인식의</td></tr><tr><td class=\"w\">motivation</td><td class=\"m\">동기, 자극</td></tr><tr><td class=\"w\">fundamental</td><td class=\"m\">근본적인, 기본적인</td></tr><tr><td class=\"w\">encourage</td><td class=\"m\">격려하다, 촉구하다</td></tr><tr><td class=\"w\">predict</td><td class=\"m\">예측하다, 예견하다</td></tr><tr><td class=\"w\">in case of</td><td class=\"m\">~의 경우에, ~을 대비하여</td></tr><tr><td class=\"w\">uncertainty</td><td class=\"m\">불확실성, 반신반의</td></tr><tr><td class=\"w\">admission</td><td class=\"m\">입학, 입장</td></tr><tr><td class=\"w\">end up</td><td class=\"m\">결국 ~하게 되다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">problematic</td><td class=\"m\">문제가 있는, 의심스러운</td></tr><tr><td class=\"w\">for one thing</td><td class=\"m\">우선 한 가지 이유는, 첫째로는</td></tr><tr><td class=\"w\">after all</td><td class=\"m\">어쨌든, 결국</td></tr><tr><td class=\"w\">resident</td><td class=\"m\">거주자, 주민</td></tr><tr><td class=\"w\">stable</td><td class=\"m\">안정적인, 견고한</td></tr><tr><td class=\"w\">niche</td><td class=\"m\">틈새, 적합한 환경</td></tr><tr><td class=\"w\">lack</td><td class=\"m\">부족하다, 결핍되다</td></tr><tr><td class=\"w\">membership</td><td class=\"m\">회원 자격, 소속</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">인지적 동기 중에서,</span><span class=\"en\"><b>Of the cognitive motivations,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">가장 근본적인 것은</span><span class=\"en\"><b>the most fundamental one</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이</span><span class=\"en\"><b><span class=\"grammar-hl\">encourages people</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 환경을 이해하게 하는데</span><span class=\"en\"><b><span class=\"grammar-hl\">to understand</span> their environment</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이는 예측하기 위해서이다</span><span class=\"en\"><b><span class=\"grammar-hl\">to predict</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇이 일어날지</span><span class=\"en\"><b><span class=\"grammar-hl\">what is going to happen</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불확실성의 경우에서.</span><span class=\"en\"><b><span class=\"grammar-hl\">in case of</span> uncertainties.</b></span></div></div><div class=\"lec-sent-ko\">인지적 동기 중에서, 가장 근본적인 것은 사람들이 불확실성의 경우에서 무엇이 일어날지 예측하기 위해 자신의 환경을 이해하게 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 주제를 제시하는 첫 문장입니다. 사람은 본능적으로 불안한 상황을 꺼리기 때문에, 주변 환경을 파악하여 앞으로의 일을 미리 알고 대비하고 싶어 한다는 점을 보여줍니다. 학술적인 글에서 Of the cognitive motivations는 인간이 무언가를 알고자 하는 여러 심리적 원인들 중 하나를 짚어줄 때 쓰는 표현입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">encourages people to understand 5형식(SVOC) 구조: encourage는 목적어와 목적격 보어를 취하는 5형식 동사로, 기본구조 &#39;encourage + 목적어(O) + to부정사(toV)&#39; 형태로 쓰여 &#39;목적어가 ~하도록 장려하다/권장하다&#39;라는 의미를 만든다.</div><div class=\"lec-gr-item\">to understand (to부정사): 5형식 동사 encourage의 목적격 보어 역할을 하는 to부정사이다.</div><div class=\"lec-gr-item\">to predict (to부정사): 부사적 용법(목적)으로 쓰여 &#39;~하기 위해서&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">what is going to happen (간접의문문): 의문사 what이 이끄는 절이 동사 predict의 목적어 역할을 한다. what이 의문사이면서 동시에 절의 주어 역할을 하므로 &#39;의문사(+주어) + 동사&#39;의 어순으로 명사절을 이끈다.</div><div class=\"lec-gr-item\">in case of (관용표현): &#39;~의 경우에 대비하여, ~할 경우에&#39;라는 의미를 나타내는 전치사구 형태의 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cognitive</td><td class=\"m\">인지의, 인식의</td></tr><tr><td class=\"w\">motivation</td><td class=\"m\">동기, 자극</td></tr><tr><td class=\"w\">fundamental</td><td class=\"m\">근본적인, 기본적인</td></tr><tr><td class=\"w\">encourage</td><td class=\"m\">격려하다, 촉구하다</td></tr><tr><td class=\"w\">predict</td><td class=\"m\">예측하다, 예견하다</td></tr><tr><td class=\"w\">in case of</td><td class=\"m\">~의 경우에, ~을 대비하여</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가장 중요한 점은,</span><span class=\"en\"><b>Most important,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 선호한다는 것인데</span><span class=\"en\"><b>people prefer</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의미를 발전시키는 것을</span><span class=\"en\"><b><span class=\"grammar-hl\">to develop</span> meanings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공유되는</span><span class=\"en\"><b><span class=\"grammar-hl\">that are shared</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">다른 사람들과.</span><span class=\"en\"><b>with other people.</b></span></div></div><div class=\"lec-sent-ko\">가장 중요한 점은, 사람들이 다른 사람들과 공유되는 의미를 발전시키는 것을 선호한다는 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 말한 환경 파악의 연장선으로, 혼자서만 상황을 이해하는 데 그치지 않고 타인과 유대감을 맺으며 함께 상황을 파악하려 한다는 점을 덧붙입니다. develop meanings that are shared를 직역하면 &#39;공유되는 의미를 개발하다&#39;가 되는데, 쉽게 말해 주변 사람들과 소속감을 느끼며 같은 생각과 가치관을 나누고 싶어 한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to develop (to부정사): 동사 prefer의 목적어 역할을 하는 명사적 용법의 to부정사이다.</div><div class=\"lec-gr-item\">that are shared (관계대명사): that은 선행사 meanings를 수식하는 주격 관계대명사로, 뒤에 주어 없이 동사(are shared)가 이어지는 불완전한 절(형용사절)을 이끈다.</div><div class=\"lec-gr-item\">are shared (수동태): be동사(are) + p.p.(shared) 구조. share는 타동사로 기본구조가 &#39;share A with B (A를 B와 공유하다)&#39;인데, 목적어(A)가 주어로 이동하고 뒤에 목적어가 없어서 수동구조 are shared 형태로 쓴다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어,</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 해에</span><span class=\"en\"><b>if in a <span class=\"grammar-hl\">given</span> year</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 많은 사람이 받아들이면</span><span class=\"en\"><b>more people accept</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">입학 허가를</span><span class=\"en\"><b>offers of admission</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">대학이 예상한 것보다,</span><span class=\"en\"><b>than a college expects,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">꽤 다수의 학생이</span><span class=\"en\"><b><span class=\"grammar-hl\">quite a few</span> students</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">결국 살게 되는데</span><span class=\"en\"><b><span class=\"grammar-hl\">end up living</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이는 기숙사 라운지나 캠퍼스 호텔에서이다.</span><span class=\"en\"><b>in dorm lounges or campus hotels.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 어떤 해에 대학이 예상한 것보다 더 많은 사람이 입학 허가를 받아들이면, 꽤 다수의 학생이 결국 기숙사 라운지나 캠퍼스 호텔에서 살게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 인간의 심리를 보여주기 위해 대학 기숙사 배정 문제라는 구체적인 예시를 시작합니다. 신입생이 갑자기 몰려 정상적인 기숙사 방을 배정받지 못하고 임시 거처에 머물게 되는 난감하고 불안정한 상황을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">given (과거분사(형용사)): given이 뒤의 명사 year를 수식(= &#39;특정한/주어진 해&#39;). p.p. + N 구조로 명사의 의미를 한정한다.</div><div class=\"lec-gr-item\">end up living (관용표현): &#39;end up -ing&#39;는 &#39;결국 ~하게 되다&#39;라는 의미의 관용표현이다. 여기서 living은 전치사적 의미 뒤에 쓰인 동명사이다.</div><div class=\"lec-gr-item\">quite a few (관용표현): &#39;꽤 많은&#39;이라는 의미를 나타내며, 뒤에 셀 수 있는 복수 명사(students)가 이어지는 수량 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">admission</td><td class=\"m\">입학, 입장</td></tr><tr><td class=\"w\">end up</td><td class=\"m\">결국 ~하게 되다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이해하기는 쉬운데</span><span class=\"en\"><b><span class=\"grammar-hl\">It is easy to understand</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">라운지에서 사는 것이 왜</span><span class=\"en\"><b><span class=\"grammar-hl\">why living in the lounge</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문제가 되는지를 말이다</span><span class=\"en\"><b><span class=\"grammar-hl\">is problematic</span> (no closet, <span class=\"grammar-hl\">for one thing</span>).</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">(우선 옷장이 없다).</span><span class=\"en\"></span></div></div><div class=\"lec-sent-ko\">라운지에서 사는 것이 왜 문제가 되는지 이해하기는 쉽다(우선 옷장이 없다).</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급된 두 임시 거처 중 먼저 휴게실 숙박의 단점을 언급합니다. 휴게실은 애초에 거주용 공간이 아니므로 옷장 같은 기본 시설조차 없어 물리적으로 매우 불편한 곳임을 짚어 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It is easy to understand (가주어): 진주어: It은 형식적인 가주어 역할을 하고, 뒤의 to understand 이하의 명사구가 진짜 주어인 진주어 역할을 한다.</div><div class=\"lec-gr-item\">to understand (to부정사): 문장의 진짜 주어 역할을 하는 명사적 용법의 to부정사(진주어)이다.</div><div class=\"lec-gr-item\">why living in the lounge is problematic (간접의문문): 의문부사 why가 이끄는 절이 to understand의 목적어 역할을 한다. &#39;의문사(why) + 주어(living in the lounge) + 동사(is)&#39;의 평서문 어순을 따르는 명사절이다.</div><div class=\"lec-gr-item\">for one thing (관용표현): &#39;(여러 가지 이유 중에서) 우선 한 가지 이유는, 첫째로는&#39;이라는 의미로 쓰이는 부사적 관용표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">problematic</td><td class=\"m\">문제가 있는, 의심스러운</td></tr><tr><td class=\"w\">for one thing</td><td class=\"m\">우선 한 가지 이유는, 첫째로는</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">하지만 무엇이 문제일까</span><span class=\"en\"><b>But <span class=\"grammar-hl\">what is wrong</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">방은</span><span class=\"en\"><b><span class=\"grammar-hl\">with</span> a room</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">캠퍼스 호텔의?</span><span class=\"en\"><b>at campus hotels?</b></span></div></div><div class=\"lec-sent-ko\">하지만 캠퍼스 호텔의 방은 무엇이 문제일까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이번에는 또 다른 임시 거처인 캠퍼스 호텔로 화제를 전환하며 독자에게 질문을 던집니다. 휴게실과 달리 호텔은 시설이 좋을 텐데 왜 문제가 되는지 의문을 제기하며 다음 문장의 설명을 유도합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">what is wrong with (관용표현): &#39;~에 무슨 문제가 있는가, ~이 어때서&#39;라는 의미로 문제점이나 의문을 제기할 때 쓰이는 표현이다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">결국,</span><span class=\"en\"><b><span class=\"grammar-hl\">After all</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">호텔에 있는 학생들은</span><span class=\"en\"><b>students in a hotel</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">갖게 되는데</span><span class=\"en\"><b>get</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개인 욕실,</span><span class=\"en\"><b>private bathrooms,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">전용 TV,</span><span class=\"en\"><b>their own TV,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 더 넓은 방을 말이다.</span><span class=\"en\"><b>and larger rooms.</b></span></div></div><div class=\"lec-sent-ko\">결국, 호텔에 있는 학생들은 개인 욕실, 전용 TV, 그리고 더 넓은 방을 갖게 된다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 질문에 대한 배경 설명으로, 호텔 방은 개인 욕실이나 TV, 넓은 공간 등 물리적인 조건만 놓고 보면 일반 기숙사 방보다 훨씬 더 훌륭하고 편안한 환경임을 보여줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">After all (관용표현): &#39;결국, 어쨌든, (이유를 덧붙이며) 하긴&#39;이라는 의미로 앞의 말에 대한 근거나 양보의 뜻을 나타내는 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">after all</td><td class=\"m\">어쨌든, 결국</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사실,</span><span class=\"en\"><b>In fact,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이런 호텔에서 사는 것이</span><span class=\"en\"><b>living in those hotels</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문제가 되는데</span><span class=\"en\"><b>is problematic</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">왜냐하면 그 학생 거주자들이</span><span class=\"en\"><b>because the student residents</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안정적인 집단의 일원이 아니기 때문이며</span><span class=\"en\"><b>are not a part of a stable group</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이들은 사람들과 함께하는</span><span class=\"en\"><b>with people</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이웃이 될</span><span class=\"en\"><b><span class=\"grammar-hl\">who will be their neighbors</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그해 동안이다;</span><span class=\"en\"><b>for the year;</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그래서 그들은 기다려야만 하는데</span><span class=\"en\"><b>they must wait</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">불확실한 상태에서</span><span class=\"en\"><b>in uncertainty</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">자신의 사회적 적소를 찾기 전까지이다.</span><span class=\"en\"><b><span class=\"grammar-hl\">before finding</span> their social niche.</b></span></div></div><div class=\"lec-sent-ko\">사실, 이런 호텔에서 사는 것이 문제가 되는데 왜냐하면 그 학생 거주자들이 그해 동안 이웃이 될 사람들과 함께하는 안정적인 집단의 일원이 아니기 때문이다. 그래서 그들은 자신의 사회적 적소를 찾기 전까지 불확실한 상태에서 기다려야만 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심이 담긴 문장으로, 시설이 좋은 호텔이 왜 문제가 되는지 그 진짜 이유를 밝힙니다. finding their social niche를 &#39;사회적 적소를 찾다&#39;라고 옮기면 어렵게 느껴집니다. 글쓴이는 여기서 힘주어 말합니다. 시설이 아무리 좋아도 정규 기숙사처럼 1년 내내 함께 어울릴 친구 무리에 끼지 못한 채, 자신이 속할 자리를 찾지 못해 불안에 떨어야 하는 상황이 학생들을 가장 힘들게 만든다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">who will be their neighbors (관계대명사): who는 선행사 people을 수식하는 주격 관계대명사로, 뒤에 주어 없이 동사(will be)가 이어지는 관계대명사절을 이끌어 앞의 명사를 수식한다.</div><div class=\"lec-gr-item\">before finding (분사구문): 접속사 before의 의미를 명확히 남겨둔 부사적 기능의 현재분사구문이다. 원래 절로 변환하면 before + they(the student residents) + find 형태가 된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">uncertainty</td><td class=\"m\">불확실성, 반신반의</td></tr><tr><td class=\"w\">problematic</td><td class=\"m\">문제가 있는, 의심스러운</td></tr><tr><td class=\"w\">resident</td><td class=\"m\">거주자, 주민</td></tr><tr><td class=\"w\">stable</td><td class=\"m\">안정적인, 견고한</td></tr><tr><td class=\"w\">niche</td><td class=\"m\">틈새, 적합한 환경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">불확실성 그 자체가</span><span class=\"en\"><b>The uncertainty <span class=\"grammar-hl\">itself</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">문제인 것이다.</span><span class=\"en\"><b>is the problem.</b></span></div></div><div class=\"lec-sent-ko\">불확실성 그 자체가 문제인 것이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 내용을 압축하여 결론을 내립니다. 물리적인 불편함이 원인이 될 수 없고, 내가 누구와 함께 지내게 될지 혹은 소속될 집단이 있는지 없는지를 알 수 없는 심리적인 불안감 자체가 근본적인 고통의 원인임을 명확히 합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">itself 기본구조(명사 강조): 재귀대명사의 강조 용법으로, 주어인 명사 The uncertainty 바로 뒤에 쓰여 &#39;그 자체&#39;라는 뜻으로 주어의 의미를 강조한다. 생략해도 문법적으로 완전하다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">uncertainty</td><td class=\"m\">불확실성, 반신반의</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">사람들은 결여되어 있는데</span><span class=\"en\"><b>People lack</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공유된 사회적 이해가,</span><span class=\"en\"><b>a <span class=\"grammar-hl\">shared</span> social understanding,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이는 보통 발전되는 것이다</span><span class=\"en\"><b>normally <span class=\"grammar-hl\">developed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">구성원 자격으로부터</span><span class=\"en\"><b>from membership</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">안정적인 집단의.</span><span class=\"en\"><b>in a stable group.</b></span></div></div><div class=\"lec-sent-ko\">사람들은 안정적인 집단의 구성원 자격으로부터 보통 발전되는 공유된 사회적 이해가 결여되어 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 첫 부분에서 언급했던 타인과 의미를 공유하고자 하는 인간의 본성과 연결하며 글을 마무리합니다. shared social understanding은 안정된 집단에 소속되어 다른 사람들과 관계를 맺고 공감대를 쌓아야 비로소 얻을 수 있는 사회적 안정감과 유대감을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">shared (과거분사(형용사)): shared가 뒤의 명사 understanding을 수식(= &#39;공유된 이해&#39;). p.p. + N 형태로 명사를 수식한다.</div><div class=\"lec-gr-item\">developed (과거분사(형용사)): developed가 앞의 명사 understanding을 수식(= &#39;형성된 이해&#39;). N + p.p. 형태로 수식받는 명사 기준으로 수동의 의미를 나타내며 &#39;N that is/was p.p.&#39; 형태의 축약 관계로 볼 수 있다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stable</td><td class=\"m\">안정적인, 견고한</td></tr><tr><td class=\"w\">lack</td><td class=\"m\">부족하다, 결핍되다</td></tr><tr><td class=\"w\">membership</td><td class=\"m\">회원 자격, 소속</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>인간은 불확실성을 줄이고 환경을 이해하려는 본능이 있으며, 타인과 공감대를 형성하는 것을 매우 중요하게 여긴다.</li><li>대학 신입생이 갑자기 몰려 기숙사 휴게실이나 캠퍼스 호텔에 임시로 머물게 되는 상황을 보면 이를 잘 알 수 있다.</li><li>캠퍼스 호텔은 물리적 시설이 뛰어남에도 불구하고, 학생들에게 큰 심리적 문제를 일으킨다.</li><li>그 이유는 정규 기숙사처럼 안정적인 무리에 소속되지 못하고, 자신이 어디에 속할지 모르는 불확실성 속에서 사회적 유대감을 나누지 못하기 때문이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">People fundamentally seek to predict and reduce environmental uncertainties, so they strive to develop shared social understandings by belonging to stable groups.</div>\n              <div class=\"lec-final-sum-ko\">사람들은 근본적으로 환경적 불확실성을 예측하고 줄이려고 노력하며, 그래서 안정적인 집단에 소속되어 공유된 사회적 이해를 발달시키고자 애쓴다.</div></div></div>"],"segs":[[{"audio":"./32_audio/1.mp3","hl":null}],[{"audio":"./32_audio/2.mp3","hl":null}],[{"audio":"./32_audio/3.mp3","hl":null},{"audio":"./32_audio/4.mp3","hl":"stage-0"},{"audio":"./32_audio/5.mp3","hl":"stage-1"},{"audio":"./32_audio/6.mp3","hl":"stage-2"},{"audio":"./32_audio/7.mp3","hl":"stage-3"},{"audio":"./32_audio/8.mp3","hl":"stage-4"}],[{"audio":"./32_audio/9.mp3","hl":null}],[{"audio":"./32_audio/10.mp3","hl":"main"},{"audio":"./32_audio/11.mp3","hl":"meaning"},{"audio":"./32_audio/12.mp3","hl":"grammar"}],[{"audio":"./32_audio/13.mp3","hl":"main"},{"audio":"./32_audio/14.mp3","hl":"meaning"},{"audio":"./32_audio/15.mp3","hl":"grammar"}],[{"audio":"./32_audio/16.mp3","hl":"main"},{"audio":"./32_audio/17.mp3","hl":"meaning"},{"audio":"./32_audio/18.mp3","hl":"grammar"}],[{"audio":"./32_audio/19.mp3","hl":"main"},{"audio":"./32_audio/2 ion applyHl(key){clearHl();if(!key)return;var el=s.querySelector("[data-hl=\""+key+"\"]");if(el){el.classList.add("lec-hl");scrollHl(el);}}function clrTmr(){if(tmr){clearTimeout(tmr);tmr=null;}}function setSeg(){clrTmr();fill.style.width="0%";var seg=segsOf(i)[j];clearHl();if(!seg||!seg.audio){a.removeAttribute("src");if(seg)applyHl(seg.hl);if(playing){tmr=setTimeout(segEnd,1500);}return;}applyHl(seg.hl);a.src=seg.audio;a.playbackRate=rate;if(playing){a.play().catch(function(){});}}function segEnd(){if(!playing)return;var segs=segsOf(i);if(j<segs.length-1){j++;setSeg();}else if(i<D.slides.length-1){go(1);}else{playing=false;pp.textContent="\u25b6 \uc7ac\uc0dd";clearHl();}}var rsel=document.getElementById("rate");if(rsel){rsel.onchange=function(){rate=parseFloat(rsel.value)||1;try{a.playbackRate=rate;}catch(_){}};}function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;show();</script></body></html>
