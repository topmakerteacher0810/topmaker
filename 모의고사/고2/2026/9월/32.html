</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 32번","audioDir":"32_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">32번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Every Translation Is a Crowd Translation\u003c/h1>\u003ch2>모든 번역은 군중 번역이다\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>번역은 겉보기에는 \u003cb class=\"key\">개인\u003c/b>의 작업이지만, 번역가는 \u003cb class=\"key\">독자 \u003c/b>\u003cb class=\"key\">공동체\u003c/b>의 기대와 \u003cb class=\"key\">여러 \u003c/b>\u003cb class=\"key\">원문\u003c/b>을 바탕으로 해석을 구성한다. 따라서 모든 번역은 \u003cb class=\"key\">군중 \u003c/b>\u003cb class=\"key\">번역\u003c/b>이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Every translation is a crowd translation because translators always draw on multiple sources and are shaped by the expectations of readers.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 지문은 번역이 사실은 혼자 하는 일이 아니라 여러 사람의 힘으로 이루어진다는 내용이에요. 제목은 Every Translation Is a Crowd Translation이고, 핵심 요지는 모든 번역은 군중 번역이라는 것입니다. 알렉산더 포프의 일리아스 번역 사례를 통해 이 주장을 확인해 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">번역은 흔히 번역가 혼자 원문과 맞서는 일대일 작업으로 오해받지만, 실제로는 여러 자료와 사람이 개입합니다. 번역가는 \u003cb class=\"key\">사전\u003c/b>, \u003cb class=\"key\">주석\u003c/b>, \u003cb class=\"key\">선행 \u003c/b>\u003cb class=\"key\">번역\u003c/b> 등 여러 원문을 참고합니다. 독자가 누구인지에 따라 번역투와 어휘 선택이 달라지므로 \u003cb class=\"key\">독자 \u003c/b>\u003cb class=\"key\">공동체\u003c/b>의 기대도 번역에 영향을 줍니다. 이런 점에서 번역은 상호텍스트성(intertextuality)과 협력(collaboration)의 산물입니다. 요리할 때 레시피 하나만 보지 않고 여러 레시피와 먹을 사람의 입맛을 함께 고려하는 것과 같습니다.\u003c/div>","segs":[{"n":2,"text":"번역이라고 하면 번역가 혼자 책상에 앉아 하는 작업을 떠올리기 쉽죠. 하지만 번역가는 사전 dictionary, 해설 commentary, 그리고 이미 나온 번역 previous translation을 참고합니다. 게다가 번역 결과를 읽을 독자 공동체 reader community의 기대 expectation도 번역에 영향을 줘요. 이런 현상은 상호텍스트성 intertextuality과 협력 collaboration이라는 개념으로 설명할 수 있습니다. 요리를 할 때 레시피 하나만 보는 게 아니라 여러 레시피와 먹을 사람의 입맛을 함께 고려하는 것과 비슷하답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>번역은 공동 작업\u003csmall>주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>번역가들은 \u003cb class=\"key\">독자 \u003c/b>\u003cb class=\"key\">공동체\u003c/b>로부터 압박을 느끼고, 모든 해석은 다른 사람들과의 \u003cb class=\"key\">대화\u003c/b>에서 나온다. 즉 번역은 처음부터 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">행위\u003c/b>이다. ‘the community of readers’와 ‘dialogue with other people’이 번역의 조건임을 제시한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>포프의 번역 사례\u003csmall>예시 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>알렉산더 포프는 그리스어를 꽤 잘했지만 \u003cb class=\"key\">혼자\u003c/b> 번역하지 않았다. 그는 \u003cb class=\"key\">그리스어 \u003c/b>\u003cb class=\"key\">해설\u003c/b>, 영어·라틴어·프랑스어 번역본, 사전을 참고했다. 유명한 시인조차 \u003cb class=\"key\">여러 \u003c/b>\u003cb class=\"key\">참고 \u003c/b>\u003cb class=\"key\">자료\u003c/b>를 활용했음을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>혼자여도 다수와 연결\u003csmall>근거 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>번역가는 항상 \u003cb class=\"key\">여러 \u003c/b>\u003cb class=\"key\">원문\u003c/b>을 활용하며, 혼자 번역하는 장면에서도 언어 지식은 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">텍스트와 \u003c/b>\u003cb class=\"key\">대화\u003c/b>에서 비롯된다. 번역의 목적은 수신자의 \u003cb class=\"key\">기대\u003c/b>에 영향을 받는다. 겉으로는 혼자여도 실제로는 많은 사람과 자료가 연결되어 있다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>군중 번역 결론\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>이 두 가지 의미에서 모든 번역은 \u003cb class=\"key\">군중 \u003c/b>\u003cb class=\"key\">번역\u003c/b>이다. 활용하는 자료가 다수라는 점과 번역 목적이 독자의 기대에 좌우된다는 점이 결론의 두 축이다. 앞서 제시한 주장을 하나의 표현으로 압축한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문단의 흐름을 처음부터 끝까지 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 번역가들이 독자 공동체의 압박을 느끼고 다른 사람들과의 대화 속에서 해석에 도달한다고 말합니다. 번역은 처음부터 사회적 행위라는 뜻이죠. the community of readers라는 표현과 dialogue with other people이라는 표현을 잘 기억해 두세요.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장은 알렉산더 포프의 일리아스 번역 사례입니다. 포프는 그리스어를 꽤 잘했지만 혼자 번역하지 않았어요. 그리스어 해설과 영어, 라틴어, 프랑스어 번역본, 그리고 사전까지 참고했습니다.","hl":"f1"},{"n":6,"text":"다섯 번째부터 일곱 번째 문장에서는 번역가가 항상 여러 원문을 활용한다고 일반화합니다. 혼자서 번역하는 것처럼 보여도 그 사람의 언어 지식은 많은 텍스트와 대화에서 나온다는 거죠. 번역의 목적도 독자의 기대에 영향을 받습니다.","hl":"f2"},{"n":7,"text":"마지막으로 여덟 번째 문장에서 이 두 가지 의미에서 모든 번역은 군중 번역이라고 결론 내립니다. 참고하는 자료가 여럿이라는 점, 그리고 번역 목적이 독자의 기대에 좌우된다는 점이 결론의 두 축입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 번역이 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">행위\u003c/b>임을 제시하고, 중간에 포프 사례와 개인 번역 상황을 근거로 든 뒤, 마지막 문장에서 \u003cb class=\"key\">군중 \u003c/b>\u003cb class=\"key\">번역\u003c/b>으로 다시 주장을 요약합니다. 따라서 \u003cb class=\"key\">양괄식\u003c/b> 구조이며, 주장을 뒷받침하는 예시와 일반화가 이어지는 \u003cb class=\"key\">주장-근거\u003c/b> 전개입니다. 처음과 끝의 주장이 같은 개념을 반복하므로 중심 문장은 마지막 문장으로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>All translators (1)\u003c/b>\u003cspan>주장의 출발점\u003c/span>\u003cb>And all translators (2)\u003c/b>\u003cspan>동일 주장 강화\u003c/span>\u003cb>but when (3)\u003c/b>\u003cspan>예시로 전환\u003c/span>\u003cb>Even when (6)\u003c/b>\u003cspan>양보와 일반화\u003c/span>\u003cb>And then (7)\u003c/b>\u003cspan>추가 근거 제시\u003c/span>\u003cb>In both these senses (8)\u003c/b>\u003cspan>결론 신호\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">pressure from the community of readers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">in dialogue with other people\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">not on his own\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">draw on more than one source text\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">lots of other texts and other conversations\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">expectations of the person or people\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">crowd translation\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>개인 번역으로 보이는 현장\u003c/th>\u003cth>실제 군중 번역\u003c/th>\u003c/tr>\u003ctr>\u003ctd>한 사람이 펜과 종이, 책만 가짐\u003c/td>\u003ctd>여러 사전·해설·선행 번역을 참고함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>혼자서 해석하는 듯 보임\u003c/td>\u003ctd>다른 사람과의 대화와 독자 기대가 개입함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 지문은 주장을 먼저 제시하고 중간에 예시와 근거를 든 뒤 마지막에 다시 주장을 반복하는 양괄식 구조입니다. 첫 번째와 두 번째 문장에서 번역이 사회적 행위임을 말하고, 마지막 문장에서 모든 번역은 군중 번역이라고 정리하죠. 전개 방식은 주장과 근거의 구조로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 보면 첫 문장의 All translators, 두 번째 문장의 And all translators가 주장을 나란히 이끌어요. 세 번째 문장의 but when은 포프 사례로 넘어가는 전환 신호이고, 일곱 번째 문장의 And then은 근거를 추가하는 표현입니다. 마지막 문장의 In both these senses는 앞의 두 가지 의미를 묶어 결론으로 이끄는 신호예요. 그리고 crowd translation은 앞에 나온 pressure from the community of readers, dialogue with other people, not on his own, draw on more than one source text 같은 표현들을 다시 정리한 재진술입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>translator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>번역가\u003c/span>\u003c/div>\u003cdiv>\u003cb>pressure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>압박, 부담\u003c/span>\u003c/div>\u003cdiv>\u003cb>community\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공동체\u003c/span>\u003c/div>\u003cdiv>\u003cb>reader\u003c/b>\u003cem>명사\u003c/em>\u003cspan>독자\u003c/span>\u003c/div>\u003cdiv>\u003cb>interpretation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해석\u003c/span>\u003c/div>\u003cdiv>\u003cb>dialogue\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대화\u003c/span>\u003c/div>\u003cdiv>\u003cb>poet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시인\u003c/span>\u003c/div>\u003cdiv>\u003cb>Greek\u003c/b>\u003cem>명사\u003c/em>\u003cspan>그리스어\u003c/span>\u003c/div>\u003cdiv>\u003cb>set about\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 착수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>on one's own\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>혼자서\u003c/span>\u003c/div>\u003cdiv>\u003cb>commentary\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해설\u003c/span>\u003c/div>\u003cdiv>\u003cb>translation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>번역본, 번역\u003c/span>\u003c/div>\u003cdiv>\u003cb>dictionary\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사전\u003c/span>\u003c/div>\u003cdiv>\u003cb>draw on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>활용하다, 의지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>source text\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원문\u003c/span>\u003c/div>\u003cdiv>\u003cb>scene\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현장, 장면\u003c/span>\u003c/div>\u003cdiv>\u003cb>consist of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 구성되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>orally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>구두로, 말로\u003c/span>\u003c/div>\u003cdiv>\u003cb>linguistic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>언어의, 언어적\u003c/span>\u003c/div>\u003cdiv>\u003cb>knowledge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지식\u003c/span>\u003c/div>\u003cdiv>\u003cb>arise from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 생기다, 비롯되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>conversation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대화\u003c/span>\u003c/div>\u003cdiv>\u003cb>purpose\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목적\u003c/span>\u003c/div>\u003cdiv>\u003cb>expectation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기대\u003c/span>\u003c/div>\u003cdiv>\u003cb>crowd translation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>군중 번역\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요 어휘를 몇 개 짚어 볼게요. draw on은 활용하다, 의지하다라는 뜻의 숙어이고요, commentary는 해설, source text는 원문입니다. crowd translation은 군중 번역이라는 뜻으로 이 지문의 핵심 표현이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">pressure\u003c/b>\u003cspan class=\"m\">압박, 부담\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stress\u003c/span>\u003cspan class=\"s\">strain\u003c/span>\u003cspan class=\"s\">burden\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relief\u003c/span>\u003cspan class=\"a\">ease\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">interpretation\u003c/b>\u003cspan class=\"m\">해석\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">explanation\u003c/span>\u003cspan class=\"s\">reading\u003c/span>\u003cspan class=\"s\">rendering\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misinterpretation\u003c/span>\u003cspan class=\"a\">distortion\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dialogue\u003c/b>\u003cspan class=\"m\">대화\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conversation\u003c/span>\u003cspan class=\"s\">exchange\u003c/span>\u003cspan class=\"s\">discussion\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">monologue\u003c/span>\u003cspan class=\"a\">silence\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">draw on\u003c/b>\u003cspan class=\"m\">활용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">use\u003c/span>\u003cspan class=\"s\">utilize\u003c/span>\u003cspan class=\"s\">employ\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">purpose\u003c/b>\u003cspan class=\"m\">목적\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">aim\u003c/span>\u003cspan class=\"s\">goal\u003c/span>\u003cspan class=\"s\">intention\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">aimlessness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">community\u003c/b>\u003cspan class=\"m\">공동체\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">society\u003c/span>\u003cspan class=\"s\">public\u003c/span>\u003cspan class=\"s\">group\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">individual\u003c/span>\u003cspan class=\"a\">isolation\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 잘 나오는 어휘의 동의어와 반의어도 정리해 둡시다. pressure는 stress, strain, burden과 바꿔 쓸 수 있고 반대말은 relief, ease입니다. interpretation은 explanation, reading, rendering과 유사하고 반대는 misinterpretation, distortion이에요. draw on은 use, utilize, employ와 비슷하고 ignore, neglect와는 반대입니다. purpose는 aim, goal, intention과 같은 뜻이고 aimlessness는 목적 없음이죠. community는 society, public, group과 가깝고 individual, isolation과 대비됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 번역가들은 약간의 압박을 느낀다\u003c/span>\u003cspan class=\"en\">All translators feel some pressure\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독자들의 공동체로부터\u003c/span>\u003cspan class=\"en\">from the community of readers\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 대상으로 작업하고 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">whom \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 번역가들은 그들이 대상으로 작업하고 있는 독자들의 공동체로부터 약간의 압박을 느낀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 모든 번역가는 자신이 번역서를 바칠 독자 집단으로부터 일정한 부담을 느낀다는 첫 문장입니다. 이어질 '번역은 혼자 하는 일이 아니다'라는 주장의 전제로, 번역이라는 행위가 \u003cb class=\"key\">독자\u003c/b>라는 타자와의 관계 속에서 이루어짐을 보여줍니다. 특히 for whom 이하는 앞의 readers를 수식하는 \u003cb class=\"key\">관계대명사\u003c/b>절로, 번역가가 '누구를 위해' 일하는지를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사+관계대명사 (관계대명사 whom의 목적격)\u003c/span> : the readers + [for whom + S + V] : \"그들이 대상으로 작업하고 있는 독자들\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"All translators feel some pressure, 모든 번역가들은 약간의 압박을 느낀다. from the community of readers, 독자들의 공동체로부터. for whom they are doing their work, 그들이 대상으로 작업하고 있는. 이 문장 전체를 해석하면, 모든 번역가들은 그들이 대상으로 작업하고 있는 독자들의 공동체로부터 약간의 압박을 느낀다.","hl":"m"},{"n":13,"text":"이 문장의 의미를 정리해 볼게요. 번역가라고 해서 혼자 자유롭게 번역하는 게 아니라, 그 번역을 읽을 독자 집단의 기대와 요구에서 오는 부담을 늘 느낀다는 말이에요. 여기서 for whom 이하는 앞에 나온 the community of readers를 수식하는 관계대명사절이에요. 즉 번역가가 누구를 위해 일하는지를 정확하게 보여 주면서, 번역이 독자라는 타자와의 관계 속에서 이루어진다는 첫 번째 근거를 제시하고 있어요.","hl":"mn"},{"n":14,"text":"어법 포인트를 확인해 볼게요. for whom they are doing their work에서 whom은 앞에 있는 readers를 받는 관계대명사입니다. 원래 문장은 they are doing their work for the readers인데, 전치사 for의 목적어를 관계대명사 whom으로 바꾸면서 for whom을 관계절 앞에 두었어요. 그래서 해석은 그들이 대상으로 작업하고 있는 독자들이 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 모든 번역가들은 그들의 해석에 도달한다\u003c/span>\u003cspan class=\"en\">And all translators \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">arrive \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">interpretations\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들과의 대화에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">dialogue \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 모든 번역가들은 다른 사람들과의 대화에서 그들의 해석에 도달한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 문장은 번역가의 해석이 고립된 사고가 아니라 다른 사람들과의 \u003cb class=\"key\">대화\u003c/b> 속에서 형성된다고 말합니다. 앞 문장의 '독자로부터의 압박'에 이어, 이번에는 동시대 사람들과의 의견 교환이라는 또 다른 사회적 요소를 추가합니다. 이는 결국 번역이 혼자가 아닌 \u003cb class=\"key\">공동 \u003c/b>\u003cb class=\"key\">작업\u003c/b>이라는 마지막 문장의 결론으로 이어지는 징검다리가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사+전치사 (arrive at)\u003c/span> : arrive at + [their interpretations] : \"그들의 해석에 도달하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 (방식·동반)\u003c/span> : in dialogue with + other people : \"다른 사람들과의 대화에서\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"And all translators arrive at their interpretations, 그리고 모든 번역가들은 그들의 해석에 도달한다. in dialogue with other people, 다른 사람들과의 대화에서. 이 문장 전체를 해석하면, 그리고 모든 번역가들은 다른 사람들과의 대화에서 그들의 해석에 도달한다.","hl":"m"},{"n":16,"text":"이 문장은 번역가의 해석이 혼자만의 생각이 아니라 다른 사람들과의 대화를 통해 만들어진다는 뜻이에요. 앞 문장에서 독자 집단의 압박을 말했다면, 여기서는 대화라는 또 다른 요소를 덧붙이고 있어요. 그래서 번역은 처음부터 사회적인 활동이라는 흐름을 강화해 준다고 보면 됩니다.","hl":"mn"},{"n":17,"text":"어법 포인트를 살펴볼게요. 첫 번째로 arrive at their interpretations에서 arrive는 자동사라서 목적어를 바로 가질 수 없고, 전치사 at과 함께 쓰여서 어떤 결론이나 해석에 도달한다는 의미를 만들어요. 두 번째로 in dialogue with other people은 해석에 도달하는 방식이 대화임을 나타내는 전치사구입니다. 이 두 표현이 번역가의 해석이 사회적 과정이라는 점을 문법적으로 보여줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영국의 시인 알렉산더 포프는 그리스어를 꽤 잘했다\u003c/span>\u003cspan class=\"en\">The English poet Alexander Pope had pretty good Greek,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그가 호머의 ‘Iliad’를 번역하는 일에 착수했을 때\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">set \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">translating \u003c/span>\u003cspan class=\"tgt\">Homer's \u003c/span>\u003cspan class=\"tgt\">Iliad\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">18세기 초에\u003c/span>\u003cspan class=\"en\">in the early 18th century\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 혼자 한 것이 아니었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">own\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">영국의 시인 알렉산더 포프는 그리스어를 꽤 잘했지만, 18세기 초에 호머의 ‘Iliad’를 번역하는 것에 대해 착수했을 때 그는 혼자 한 것이 아니었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 문장은 구체적인 예로 영국의 시인 \u003cb class=\"key\">포프\u003c/b>를 듭니다. 포프는 그리스어 실력이 좋았지만, 호머의 『Iliad』를 번역할 때 혼자가 아니었음을 통해 번역이 언제나 \u003cb class=\"key\">타자\u003c/b>와의 관계 속에서 이루어진다는 앞선 진술을 뒷받침합니다. 'not on his own'은 글 전체의 핵심인 혼자가 아니었다는 점을 직접 드러내는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when + set about + 동명사\u003c/span> : when + S + set about + [동명사구] : \"그가 호머의 ‘Iliad’를 번역하는 일에 착수했을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">on one's own (전치사구 관용 표현)\u003c/span> : be + not + on one's own : \"그는 혼자 한 것이 아니었다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The English poet Alexander Pope had pretty good Greek, 영국의 시인 알렉산더 포프는 그리스어를 꽤 잘했다. but when he set about translating Homer's Iliad, 그러나 그가 호머의 ‘Iliad’를 번역하는 일에 착수했을 때. in the early 18th century, 18세기 초에. he was not on his own, 그는 혼자 한 것이 아니었다. 이 문장 전체를 해석하면, 영국의 시인 알렉산더 포프는 그리스어를 꽤 잘했지만, 18세기 초에 호머의 ‘Iliad’를 번역하는 것에 대해 착수했을 때 그는 혼자 한 것이 아니었다.","hl":"m"},{"n":19,"text":"이 문장은 알렉산더 포프라는 실제 사례를 들어서 번역이 혼자 하는 일이 아니라는 점을 보여 줘요. 포프가 그리스어를 잘했는데도 혼자 번역하지 않았다고 말함으로써, 언어 실력과 무관하게 번역은 주변의 도움과 대화 속에서 이루어진다는 논리를 강화하고 있어요. 여기서 he was not on his own은 이 문장의 핵심 표현으로, 혼자가 아니었다는 의미를 분명하게 전해 줍니다.","hl":"mn"},{"n":20,"text":"어법 포인트를 확인해 볼게요. 첫 번째로 when he set about translating Homer's Iliad에서 when은 시간을 나타내는 접속사이고, set about은 뒤에 동명사 translating을 목적어로 취해서 착수하다라는 뜻을 만들어요. 두 번째로 he was not on his own에서 on one's own은 혼자서라는 뜻의 전치사구 표현입니다. 여기에 not이 붙어서 혼자가 아니었다, 즉 다른 자원이나 사람들의 도움을 받았다는 사실을 강조하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 참고할 그리스어 해설을 가지고 있었고,\u003c/span>\u003cspan class=\"en\">He had Greek commentaries \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">refer \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이미 영어, 라틴어, 프랑스어로 번역되어 있던 번역본들을\u003c/span>\u003cspan class=\"en\">and translations \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">already \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">done \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">English, \u003c/span>\u003cspan class=\"tgt\">Latin, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">French\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 물론 그는 사전을 가지고 있었다.\u003c/span>\u003cspan class=\"en\">― and of course he had dictionaries.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 참고할 그리스어 해설과 이미 영어, 라틴어, 프랑스어로 된 번역본을 가지고 있었고, 물론 사전도 가지고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Pope가 『일리아스』를 번역할 때 혼자가 아니었다는 구체적인 사례를 보여 줘요. 그리스어 \u003cb class=\"key\">해설\u003c/b>과 이미 나온 영어·라틴어·프랑스어 \u003cb class=\"key\">번역본\u003c/b>, 그리고 \u003cb class=\"key\">사전\u003c/b>까지 참고했다는 점에서 번역가가 여러 자료를 활용한다는 일반화로 이어지는 문장입니다. commentaries는 원문을 설명한 참고서를 뜻해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : Greek commentaries + to refer to : \"참고할\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 that + 과거완료 수동태\u003c/span> : translations [that + had already been done ...] : \"이미 영어, 라틴어, 프랑스어로 번역되어 있던\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"He had Greek commentaries to refer to, 그는 참고할 그리스어 해설을 가지고 있었고. and translations that had already been done in English, Latin, and French, 그리고 이미 영어, 라틴어, 프랑스어로 번역되어 있던 번역본들을. ― and of course he had dictionaries, 그리고 물론 그는 사전을 가지고 있었다.. 이 문장 전체를 해석하면, 그는 참고할 그리스어 해설과 이미 영어, 라틴어, 프랑스어로 된 번역본을 가지고 있었고, 물론 사전도 가지고 있었다.","hl":"m"},{"n":22,"text":"이 문장은 Pope가 혼자 번역한 게 아니라 그리스어 해설과 이미 나와 있던 영어, 라틴어, 프랑스어 번역본, 그리고 사전까지 참고했다는 구체적인 사례예요. 번역가가 여러 자료를 활용한다는 다음 문장의 일반화를 뒷받침하는 역할을 하죠. commentaries는 원문을 설명한 참고서라는 뜻이에요.","hl":"mn"},{"n":23,"text":"첫 번째 어법은 to refer to예요. Greek commentaries를 뒤에서 수식하는 to부정사로 참고할 해설이라는 뜻이에요. refer to의 to는 전치사라 앞에 있는 명사 commentaries가 to의 목적어 자리로 연결되는 점이 포인트죠. 두 번째 어법은 that had already been done in English, Latin, and French예요. translations를 수식하는 관계대명사 that절이고 had been done은 과거완료 수동태예요. Pope가 참고하기 전에 이미 그 번역이 완료된 상태를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">번역가들은 항상 활용한다\u003c/span>\u003cspan class=\"en\">Translators always \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">draw \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 가지 이상의 원문을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">source \u003c/span>\u003cspan class=\"tgt\">text\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">번역가들은 항상 한 가지 이상의 원문을 활용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 Pope 사례를 일반화한 문장으로, 번역가라면 누구나 항상 하나 이상의 원문을 활용한다는 핵심 주장을 담고 있어요. \u003cb class=\"key\">draw \u003c/b>\u003cb class=\"key\">on\u003c/b>은 자원을 끌어다 쓰듯 여러 자료를 적극 이용한다는 느낌을 주는 표현이에요. 글의 후반부에서 모든 번역이 \u003cb class=\"key\">crowd \u003c/b>\u003cb class=\"key\">translation\u003c/b>이라는 결론으로 가는 논리적 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구, 숙어\u003c/span> : draw on + [목적어] : \"~을 활용하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수량 표현 + 단수명사\u003c/span> : more than one + [단수명사] : \"한 가지 이상의 원문\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Translators always draw on, 번역가들은 항상 활용한다. more than one source text, 한 가지 이상의 원문을.. 이 문장 전체를 해석하면, 번역가들은 항상 한 가지 이상의 원문을 활용한다.","hl":"m"},{"n":25,"text":"이 문장은 앞 문장의 Pope 사례를 일반화한 핵심 문장이에요. 모든 번역가가 항상 하나 이상의 원문을 활용한다는 뜻이고, draw on은 지식이나 자료를 끌어다 쓴다는 느낌을 줘요. 이 문장이 글의 결론인 모든 번역이 crowd translation이라는 주장으로 이어지는 논리적 다리 역할을 하죠.","hl":"mn"},{"n":26,"text":"첫 번째 어법은 draw on이에요. draw on은 무엇을 활용하다라는 뜻의 동사구인데요. 원래 끌어당기다라는 이미지가 자원이나 지식을 끌어다 쓴다로 확장됐어요. 두 번째 어법은 more than one source text예요. more than one은 뜻은 복수지만 문법적으로는 단수 취급을 해서 source text라는 단수 명사가 왔어요. 우리말로는 한 가지 이상의 원문이라고 해석하지만 영어 구조에서는 단수로 본다는 점이 중요해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 번역 현장이 단지 한 사람으로 구성될 때에도\u003c/span>\u003cspan class=\"en\">Even when the scene of translation \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">consists \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> just one person\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">펜, 종이, 그리고 번역되고 있는 책을 가진\u003c/span>\u003cspan class=\"en\">with a pen, paper, and the book \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">translated\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 심지어 그것이 단지 한 사람이 다른 사람을 위해 구두로 번역하고 있을 때에도\u003c/span>\u003cspan class=\"en\">or even when it is just one person \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">translating \u003c/span>\u003cspan class=\"tgt\">orally \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">another\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 사람의 언어적 지식은 많은 다른 텍스트와 다른 대화에서 발생한다.\u003c/span>\u003cspan class=\"en\">that person's linguistic knowledge \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">arises \u003c/span>\u003cspan class=\"tgt\">from\u003c/span> lots of other texts and other conversations.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심지어 번역 현장이 하나의 펜, 종이, 그리고 번역 중인 책을 가진 단 한 사람으로 구성되어 있거나, 한 사람이 다른 사람을 위해 구두로 번역 중일 때에도, 그 사람의 언어적 지식은 많은 다른 텍스트와 다른 대화에서 발생한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 겉으로 보기에 번역이 혼자 하는 작업이거나 말로 통역하는 상황이어도, 그 사람의 언어 지식 자체가 이미 많은 다른 텍스트와 대화에서 비롯된다는 점을 강조해요. 그래서 한 사람이 원문 하나만 보는 것처럼 보여도 실제로는 여러 자료와 사람들의 영향이 섞여 있다는 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">가지 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 제시하는 문장입니다. 이는 모든 번역이 \u003cb class=\"key\">crowd \u003c/b>\u003cb class=\"key\">translation\u003c/b>이라는 마지막 결론을 뒷받침해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구, 수동태 불가\u003c/span> : consist of + [명사구] : \"~로 구성되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 that + 현재진행 수동태\u003c/span> : the book [that + is being translated] : \"번역되고 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사, 명사 뒤 수식\u003c/span> : one person + translating orally for another : \"다른 사람을 위해 구두로 번역하고 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">동사구, 출처\u003c/span> : arise from + [명사구] : \"~에서 발생하다, 비롯되다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Even when the scene of translation consists of just one person, 심지어 번역 현장이 단지 한 사람으로 구성될 때에도. with a pen, paper, and the book that is being translated, 펜, 종이, 그리고 번역되고 있는 책을 가진. or even when it is just one person translating orally for another, 또는 심지어 그것이 단지 한 사람이 다른 사람을 위해 구두로 번역하고 있을 때에도. that person's linguistic knowledge arises from lots of other texts and other conversations, 그 사람의 언어적 지식은 많은 다른 텍스트와 다른 대화에서 발생한다.. 이 문장 전체를 해석하면, 심지어 번역 현장이 하나의 펜, 종이, 그리고 번역 중인 책을 가진 단 한 사람으로 구성되어 있거나, 한 사람이 다른 사람을 위해 구두로 번역 중일 때에도, 그 사람의 언어적 지식은 많은 다른 텍스트와 다른 대화에서 발생한다.","hl":"m"},{"n":28,"text":"이 문장은 눈에 보이는 번역 현장이 아무리 단순해도, 즉 혼자서 책을 보며 번역하거나 다른 사람을 위해 말로 통역하는 상황에서도 그 사람의 언어 지식 자체는 이미 많은 다른 텍스트와 대화에서 생겨난 것이라고 말해요. 겉으로는 단일 출처처럼 보여도 실제로는 여러 자료와 사람들의 영향이 섞여 있다는 걸 강조하죠. 그래서 뒤에 나오는 모든 번역이 crowd translation이라는 결론을 자연스럽게 이끌어내는 문장이에요.","hl":"mn"},{"n":29,"text":"첫 번째 어법은 consist of예요. consist of는 무엇으로 구성되다라는 뜻의 동사구인데 수동태로 쓰지 않는 게 포인트예요. 두 번째 어법은 that is being translated인데요. the book을 수식하는 관계대명사 that절이고 is being translated는 지금 번역되고 있는 중이라는 현재진행 수동태예요. 세 번째는 translating orally for another인데요. one person을 뒤에서 수식하는 현재분사로 능동의 의미를 가져요. 네 번째 arises from은 어디에서 발생하다, 비롯되다라는 뜻의 동사구로 지식의 출처를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러고 나서 그 또는 그녀의 생각은\u003c/span>\u003cspan class=\"en\">And then his or her idea\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">번역의 목적에 대한\u003c/span>\u003cspan class=\"en\">of the translation's purpose\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영향을 받을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">influenced\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기대에 의해\u003c/span>\u003cspan class=\"en\">by the expectations\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람 또는 사람들의\u003c/span>\u003cspan class=\"en\">of the person or people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 대상이 되는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러고 나서 번역의 목적에 대한 그 또는 그녀의 생각은 이것의 대상이 되는 사람 또는 사람들의 기대에 의해 영향을 받는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 번역가가 가진 번역의 목적에 대한 생각은 \u003cb class=\"key\">의도된 \u003c/b>\u003cb class=\"key\">독자\u003c/b>나 청자의 \u003cb class=\"key\">기대\u003c/b>에 의해 좌우된다는 뜻입니다. 앞 문장에서 언어 지식이 여러 텍스트와 대화에서 나온다고 했는데, 여기서는 번역의 방향성까지 수용자의 기대에 영향을 받는다는 점을 덧붙입니다. 결국 번역은 번역가 혼자만의 작업이 아니라 타인과의 관계 속에서 이루어짐을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will + 수동태\u003c/span> : will be influenced + by + 행위자 : \"영향을 받을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : 선행사 (the person or people) + [(that/whom) + 주어 + 동사] : \"그것이 대상으로 하는 사람 또는 사람들\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"And then his or her idea, 그러고 나서 그 또는 그녀의 생각은. of the translation's purpose, 번역의 목적에 대한. will be influenced, 영향을 받을 것이다. by the expectations, 기대에 의해. of the person or people, 사람 또는 사람들의. it is for, 그것이 대상이 되는.. 이 문장 전체를 해석하면, 그러고 나서 번역의 목적에 대한 그 또는 그녀의 생각은 이것의 대상이 되는 사람 또는 사람들의 기대에 의해 영향을 받는다.","hl":"m"},{"n":31,"text":"이 문장은 번역가가 가진 번역의 목적에 대한 생각이 결국 그 번역을 사용할 의도된 독자나 청자의 기대에 영향을 받는다는 뜻이에요. 앞 문장에서는 언어 지식 자체가 여러 텍스트와 대화에서 나온다고 했고, 여기서는 번역의 방향성까지도 수용자의 기대에 좌우된다고 덧붙이고 있어요. 그래서 번역은 혼자 하는 게 아니라 타인과의 관계 속에서 만들어지는 작업이라는 걸 보여 줘요.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 will be influenced예요. will은 미래를 나타내고 be influenced는 be와 과거분사로 수동태를 만드는데, 주어 his or her idea가 영향을 주는 게 아니라 기대에 의해 영향을 받는 입장이라서 수동태가 쓰였어요. 행위자는 by로 나타내고요. 두 번째 어법 포인트는 it is for예요. 앞에 있는 the person or people를 수식하는데, 목적격 관계대명사 that이나 whom이 생략된 형태예요. 원래는 the person or people whom it is for처럼 관계대명사가 들어갈 자리인데 회화나 간결한 문장에서는 생략해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 두 가지 의미에서\u003c/span>\u003cspan class=\"en\">In \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">senses\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 번역은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">translation \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">군중 번역이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is\u003c/span> a crowd translation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 두 가지 의미에서 모든 번역은 군중 번역이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 말한 두 가지 의미, 즉 번역가의 언어 지식이 여러 텍스트와 대화에서 나온다는 점과 번역의 목적이 수용자의 기대에 영향받는다는 점을 종합하여 모든 번역은 \u003cb class=\"key\">군중 \u003c/b>\u003cb class=\"key\">번역\u003c/b>이라고 결론짓습니다. 번역은 결코 개인의 고립된 작업이 아니라 여러 사람의 참여와 영향으로 이루어지는 \u003cb class=\"key\">협력\u003c/b>의 산물이라는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">both + 지시형용사 + 복수명사\u003c/span> : both + these + 복수 명사 : \"이 두 가지 의미 모두\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">every + 단수명사 + 단수동사\u003c/span> : every + 단수 명사 + 단수 동사 : \"모든 번역은 ...이다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"In both these senses, 이 두 가지 의미에서. every translation, 모든 번역은. is a crowd translation, 군중 번역이다.. 이 문장 전체를 해석하면, 이 두 가지 의미에서 모든 번역은 군중 번역이다.","hl":"m"},{"n":34,"text":"이 문장은 지문 전체의 결론으로, 앞에서 말한 두 가지 의미에서 모든 번역은 군중 번역이라는 거예요. 번역가의 언어 지식이 여러 텍스트와 대화에서 나오고 번역의 목적도 수용자의 기대에 영향받으니까, 번역은 개인의 작업이 아니라 여러 사람의 참여로 이루어지는 협력의 산물이라는 뜻이에요. crowd translation이라는 표현이 핵심이에요.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 both these senses예요. both는 두 가지를 모두 가리키고, these는 가까이 있는 대상을 가리키는 지시형용사예요. 이 둘이 복수 명사 senses를 함께 수식하는데, both of these senses에서 of가 생략된 표현으로 보면 자연스러워요. 두 번째 어법 포인트는 every translation is예요. every는 뒤에 단수 명사를 쓰고 동사도 단수형으로 받아요. 그래서 번역이 여러 개여도 하나하나를 가리키면서 is가 쓰인 거예요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>모든 번역가는 \u003cb class=\"key\">독자 \u003c/b>\u003cb class=\"key\">공동체\u003c/b>의 압박을 느끼고, 다른 사람과의 \u003cb class=\"key\">대화\u003c/b> 속에서 해석에 이른다.\u003c/li>\u003cli>알렉산더 포프의 『일리아스』 번역은 \u003cb class=\"key\">그리스어 \u003c/b>\u003cb class=\"key\">해설\u003c/b>, 기존 번역본, 사전을 참고한 \u003cb class=\"key\">협력\u003c/b> 작업이었다.\u003c/li>\u003cli>번역가는 항상 \u003cb class=\"key\">여러 \u003c/b>\u003cb class=\"key\">원문\u003c/b>을 활용하며, 혼자 번역해도 언어 지식은 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">텍스트와 \u003c/b>\u003cb class=\"key\">대화\u003c/b>에서 비롯된다.\u003c/li>\u003cli>따라서 모든 번역은 \u003cb class=\"key\">군중 \u003c/b>\u003cb class=\"key\">번역\u003c/b>이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Every translation is a crowd translation because translators always draw on multiple sources and are shaped by the expectations of readers.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">번역은 겉보기에는 \u003cb class=\"key\">개인\u003c/b>의 작업이지만, 번역가는 \u003cb class=\"key\">독자 \u003c/b>\u003cb class=\"key\">공동체\u003c/b>의 기대와 \u003cb class=\"key\">여러 \u003c/b>\u003cb class=\"key\">원문\u003c/b>을 바탕으로 해석을 구성한다. 따라서 모든 번역은 \u003cb class=\"key\">군중 \u003c/b>\u003cb class=\"key\">번역\u003c/b>이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 지문은 번역이 겉으로 보기에는 개인 작업 같지만 실제로는 여러 자료와 독자의 기대가 함께 작용한다는 것을 포프의 사례를 통해 보여 주었어요. 결국 모든 번역은 군중 번역이라는 표현으로 마무리되죠. 독해할 때는 첫 문장과 마지막 문장을 연결하고 중간 예시가 결론을 어떻게 뒷받침하는지 살펴보는 습관을 기르세요. 오늘 수업은 여기까지입니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
