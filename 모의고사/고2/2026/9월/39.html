  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}

}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 39번","audioDir":"39_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">39번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Hobbes: Morality, the Sovereign, and Fear in the State of Nature\u003c/h1>\u003ch2>홉스가 말하는 자연 상태, 도덕, 그리고 두려움\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>홉스에 따르면 인간은 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에서 \u003cb class=\"key\">이기심\u003c/b> 때문에 도덕적으로 행동할 수 없고, \u003cb class=\"key\">군림하는 \u003c/b>\u003cb class=\"key\">권력\u003c/b>인 \u003cb class=\"key\">국가\u003c/b>가 등장해야 도덕이 적용된다. 따라서 자연 상태는 \u003cb class=\"key\">전쟁 \u003c/b>\u003cb class=\"key\">상태\u003c/b>와 같으며, 사회는 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">간의 \u003c/b>\u003cb class=\"key\">두려움\u003c/b> 때문에 형성된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>According to Hobbes, morality begins only when a sovereign power emerges, since people in the state of nature are selfish and are brought together by mutual fear rather than mutual affection.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 전국연합학력평가 서른아홉 번째 지문, 홉스의 자연 상태와 국가에 대한 글을 함께 볼게요. 이 글은 인간이 자연 상태에서는 도덕적으로 행동할 수 없고, 국가가 등장해야 도덕과 사회가 시작된다는 내용을 담고 있어요. 먼저 핵심 요지를 정리하면, 인간은 이기심 때문에 자연 상태에서 전쟁 상태에 놓이며, 사회는 애정이 아니라 두려움 때문에 만들어진다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">홉스(Thomas Hobbes)는 영국의 정치철학자로, 국가가 없는 상태를 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">상태\u003c/b>(state of nature)라고 불렀어요. 이 상태에서는 모든 사람이 자기 생존을 위해 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">이익\u003c/b>을 추구하므로, 갈등이 끊이지 않고 \u003cb class=\"key\">만인에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">만인의 \u003c/b>\u003cb class=\"key\">투쟁\u003c/b>(war of all against all)이 벌어질 수 있다고 보았죠. 그래서 홉스는 사람들이 스스로의 생명과 안전을 지키기 위해 계약을 맺고 \u003cb class=\"key\">주권자\u003c/b>(sovereign)에게 권력을 넘겨 \u003cb class=\"key\">국가\u003c/b>(commonwealth)를 만든다고 주장했어요. 일상에 비유하면, 규칙이 없는 무인도에서 각자 살아남으려 하다가 싸움이 벌어지고, 결국 모두의 안전을 위해 대장을 정하는 것과 비슷해요. 이 글에서는 자연 상태의 인간이 왜 \u003cb class=\"key\">반사회적\u003c/b>이고 \u003cb class=\"key\">이기적\u003c/b>인지, 그리고 사회를 만드는 진짜 동력이 \u003cb class=\"key\">두려움\u003c/b>임을 설명하고 있어요.\u003c/div>","segs":[{"n":2,"text":"홉스는 영국의 정치철학자로, 국가가 없는 상태를 state of nature, 즉 자연 상태라고 불렀어요. 이 상태에서는 모든 사람이 자기 생존을 위해 이익을 추구하기 때문에 만인에 대한 만인의 투쟁, war of all against all이 벌어질 수 있다고 보았죠. 그래서 사람들은 생명과 안전을 지키기 위해 계약을 맺고 sovereign, 즉 주권자에게 권력을 넘겨 commonwealth, 국가를 만든다고 주장했어요. 일상에 비유하면 규칙이 없는 무인도에서 각자 살아남으려다 싸움이 벌어지고, 결국 모두의 안전을 위해 대장을 정하는 것과 비슷해요. 이 글은 자연 상태에서 인간이 왜 반사회적이고 이기적인지, 사회를 만드는 진짜 힘이 두려움임을 설명하고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>자연 상태에선 도덕 불가\u003csmall>주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>홉스는 인간이 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에서 \u003cb class=\"key\">본능\u003c/b>을 무릅쓰고 도덕적으로 행동할 수 없다고 본다. 따라서 \u003cb class=\"key\">도덕\u003c/b>과 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">자유\u003c/b>는 \u003cb class=\"key\">군림하는 \u003c/b>\u003cb class=\"key\">권력\u003c/b>인 \u003cb class=\"key\">국가\u003c/b>가 나타날 때만 적용되기 시작한다. 즉 도덕은 타고난 것이 아니라 \u003cb class=\"key\">국가\u003c/b>라는 정치적 장치가 필요하다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>자연 상태는 전쟁 상태\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>홉스는 자연 상태에서 인간의 삶이 \u003cb class=\"key\">고독하고, \u003c/b>\u003cb class=\"key\">가난하며, \u003c/b>\u003cb class=\"key\">불결하고, \u003c/b>\u003cb class=\"key\">잔인하고, \u003c/b>\u003cb class=\"key\">짧은\u003c/b> 상황이라고 묘사한다. 이는 모두를 통제할 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">권력\u003c/b> 없이 살면 사람들이 \u003cb class=\"key\">전쟁 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에 놓인다는 뜻이다. 자연 상태는 평화가 아니라 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">경쟁\u003c/b>의 장이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>인간은 반사회적·이기적 존재\u003csmall>부연 · 문장 5\u003c/small>\u003c/h4>\u003cp>홉스는 자연 상태의 인간이 \u003cb class=\"key\">사회적이고 \u003c/b>\u003cb class=\"key\">정치적인 \u003c/b>\u003cb class=\"key\">존재\u003c/b>가 아니라는 점을 받아들인다. 그 권력 없이 인간은 \u003cb class=\"key\">이기심\u003c/b>에 기초해 \u003cb class=\"key\">반사회적\u003c/b>이고 \u003cb class=\"key\">이성적\u003c/b>이라고 믿는다. 이기적 합리성은 남과 협력하기보다 자기 보호를 우선하게 만든다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사회 형성의 원리는 두려움\u003csmall>전환/결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>사회는 \u003cb class=\"key\">자연적인 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이 아니고 사람들을 하나로 모으는 자연적 힘도 없다. 그래서 사회를 만드는 것은 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">간의 \u003c/b>\u003cb class=\"key\">애정\u003c/b>이 아니다. 오히려 \u003cb class=\"key\">현재와 \u003c/b>\u003cb class=\"key\">미래에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">간의 \u003c/b>\u003cb class=\"key\">두려움\u003c/b>이 사람들을 모은다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장 흐름을 따라 글의 논리를 네 단계로 정리해 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 첫 번째 문장부터 두 번째 문장까지로, 홉스의 핵심 주장이 나와요. 자연 상태에서 인간은 자신의 존재를 보호하려는 본능 때문에 도덕적으로 행동할 수 없어요. 그래서 도덕과 도덕적 자유는 군림하는 권력, 즉 국가가 출현하는 곳에서만 적용되기 시작한다고 말하죠. 다시 말해 도덕은 타고난 것이 아니라 국가라는 정치적 장치가 필요하다는 거예요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 세 번째 문장과 네 번째 문장으로, 자연 상태가 어떤 상태인지 구체적으로 설명해요. 홉스는 자연 상태에서 인간의 삶이 고독하고 가난하며 불결하고 잔인하고 짧다고 묘사해요. 그리고 모두를 통제할 일반적인 권력 없이 살아가면 사람들은 실로 전쟁 상태에 놓인다고 말하죠. 자연 상태는 평화가 아니라 생존 경쟁의 장이라는 거예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 다섯 번째 문장으로, 자연 상태 인간의 본성에 대한 홉스의 견해를 부연해요. 그는 자연 상태의 인간이 사회적이고 정치적인 존재가 아니라는 점을 받아들였어요. 그래서 권력 없이 사는 인간은 이기심에 기초해 반사회적이고 이성적이라고 믿었죠. 이기적 합리성은 남과 협력하기보다 자기 보호를 우선하게 만든다는 설명이에요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 여섯 번째 문장과 일곱 번째 문장으로, 사회 형성의 원리가 두려움이라는 결론이에요. 사회는 자연적인 현상이 아니고 사람들을 하나로 모으는 자연적 힘도 없어요. 그래서 사회를 만드는 것은 상호 간의 애정이 아니라 오히려 현재와 미래에 대한 상호 간의 두려움이라고 하죠. 결국 두려움의 동기가 자연 상태 사람들 사이의 공통된 추진력이라는 거예요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 홉스의 핵심 주장을 제시하고, 이후 문장들이 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">상태\u003c/b>의 성격과 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">형성\u003c/b> 원리를 근거로 제시하는 구조다. 특히 두 번째 문장에서 \u003cb class=\"key\">국가\u003c/b>의 필요성을 이끌어 내고, 세 번째부터 일곱 번째 문장까지 \u003cb class=\"key\">전쟁 \u003c/b>\u003cb class=\"key\">상태\u003c/b>, \u003cb class=\"key\">이기심\u003c/b>, \u003cb class=\"key\">두려움\u003c/b>을 설명한다. 따라서 주장을 먼저 밝히고 근거를 뒤에 배치한 \u003cb class=\"key\">두괄식\u003c/b>이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Hence (2)\u003c/b>\u003cspan>결과·추론\u003c/span>\u003cb>thus (3)\u003c/b>\u003cspan>결과·요약\u003c/span>\u003cb>In other words (5)\u003c/b>\u003cspan>재진술\u003c/span>\u003cb>Moreover (6)\u003c/b>\u003cspan>추가 근거\u003c/span>\u003cb>rather (7)\u003c/b>\u003cspan>대조·환언\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a sovereign power, namely the state\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a general power to control them all\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the power\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mutual fear of men's present and future\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the cause of fear\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>자연 상태\u003c/th>\u003cth>국가 아래 사회\u003c/th>\u003c/tr>\u003ctr>\u003ctd>도덕 적용 불가\u003c/td>\u003ctd>도덕 적용 시작\u003c/td>\u003c/tr>\u003ctr>\u003ctd>반사회적·이기적 존재\u003c/td>\u003ctd>사회 형성 가능\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 주장과 근거 구조인데, 첫 문장에서 핵심 주장을 제시하고 뒤에서 자연 상태의 성격과 사회 형성 원리를 근거로 드는 두괄식이에요. 특히 두 번째 문장에서 국가의 필요성을 이끌어 내고, 세 번째 문장부터 일곱 번째 문장까지 전쟁 상태, 이기심, 두려움을 차례로 설명하죠. 따라서 처음에 주장을 밝히고 근거를 뒤에 배치한 두괄식 구조로 읽는 게 자연스러워요.","hl":"ty"},{"n":9,"text":"신호어와 재진술, 대조를 짚어 보면 좋아요. Hence는 앞 문장에서 도덕 불가능의 논리를 국가의 필요성으로 이끄는 결과 신호어예요. thus는 앞선 내용을 요약하면서 자연 상태를 전쟁 상태로 규정해요. In other words는 다섯 번째 문장에서 홉스의 인간관을 다시 풀어 말해 줘요. 마지막 문장의 It is, rather는 상호 간의 애정을 부정하고 상호 간의 두려움을 강조하는 대조 표현이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>according to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 따르면\u003c/span>\u003c/div>\u003cdiv>\u003cb>being\u003c/b>\u003cem>명사\u003c/em>\u003cspan>존재, 생물\u003c/span>\u003c/div>\u003cdiv>\u003cb>in spite of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에도 불구하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>instinct\u003c/b>\u003cem>명사\u003c/em>\u003cspan>본능\u003c/span>\u003c/div>\u003cdiv>\u003cb>existence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>존재, 생존\u003c/span>\u003c/div>\u003cdiv>\u003cb>state of nature\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자연 상태\u003c/span>\u003c/div>\u003cdiv>\u003cb>hence\u003c/b>\u003cem>부사\u003c/em>\u003cspan>따라서\u003c/span>\u003c/div>\u003cdiv>\u003cb>morality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도덕, 도덕성\u003c/span>\u003c/div>\u003cdiv>\u003cb>moral liberty\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도덕적 자유\u003c/span>\u003c/div>\u003cdiv>\u003cb>sovereign\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>군림하는, 주권의\u003c/span>\u003c/div>\u003cdiv>\u003cb>emerge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>출현하다, 나타나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>circumstance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상황, 환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>solitary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고독한\u003c/span>\u003c/div>\u003cdiv>\u003cb>nasty\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불결한, 추잡한\u003c/span>\u003c/div>\u003cdiv>\u003cb>brutish\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잔인한, 짐승 같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>short\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>짧은\u003c/span>\u003c/div>\u003cdiv>\u003cb>general power\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일반적인 권력\u003c/span>\u003c/div>\u003cdiv>\u003cb>a state of war\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전쟁 상태\u003c/span>\u003c/div>\u003cdiv>\u003cb>in other words\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>즉, 다시 말해\u003c/span>\u003c/div>\u003cdiv>\u003cb>antisocial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>반사회적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>rational\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이성적인, 합리적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>selfishness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이기심\u003c/span>\u003c/div>\u003cdiv>\u003cb>moreover\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가\u003c/span>\u003c/div>\u003cdiv>\u003cb>natural phenomenon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자연적 현상\u003c/span>\u003c/div>\u003cdiv>\u003cb>mutual affection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상호 간의 애정\u003c/span>\u003c/div>\u003cdiv>\u003cb>mutual fear\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상호 간의 두려움\u003c/span>\u003c/div>\u003cdiv>\u003cb>assemble\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모으다, 모이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>common drive\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공통된 추진력\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘에서는 state of nature가 자연 상태, sovereign power는 군림하는 권력, mutual affection은 상호 간의 애정이라는 표현을 꼭 알아두세요. 또 solitary는 고독한, brutish는 잔인한, antisocial은 반사회적인이라는 뜻으로 이 글의 핵심 어휘예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">defend\u003c/span>\u003cspan class=\"s\">guard\u003c/span>\u003cspan class=\"s\">shield\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">attack\u003c/span>\u003cspan class=\"a\">endanger\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">emerge\u003c/b>\u003cspan class=\"m\">출현하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appear\u003c/span>\u003cspan class=\"s\">arise\u003c/span>\u003cspan class=\"s\">surface\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disappear\u003c/span>\u003cspan class=\"a\">vanish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">solitary\u003c/b>\u003cspan class=\"m\">고독한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lonely\u003c/span>\u003cspan class=\"s\">isolated\u003c/span>\u003cspan class=\"s\">alone\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">social\u003c/span>\u003cspan class=\"a\">sociable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">antisocial\u003c/b>\u003cspan class=\"m\">반사회적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unsociable\u003c/span>\u003cspan class=\"s\">unfriendly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">social\u003c/span>\u003cspan class=\"a\">sociable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rational\u003c/b>\u003cspan class=\"m\">이성적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reasonable\u003c/span>\u003cspan class=\"s\">logical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">irrational\u003c/span>\u003cspan class=\"a\">emotional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mutual\u003c/b>\u003cspan class=\"m\">상호 간의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reciprocal\u003c/span>\u003cspan class=\"s\">shared\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">one-sided\u003c/span>\u003cspan class=\"a\">unilateral\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리하면 좋아요. emerge는 appear와 arise와 비슷하고, disappear와 반대예요. solitary는 lonely와 isolated와 가깝고, social과 반대죠. antisocial은 unsociable과 unfriendly와 비슷하고, social이나 sociable과 반대예요. rational은 reasonable과 logical과 가깝고, irrational이나 emotional과 반대예요. mutual은 reciprocal이나 shared와 비슷하고, one-sided와 반대라는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">홉스에 따르면,\u003c/span>\u003cspan class=\"en\">According to Hobbes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간은 존재가 아니다\u003c/span>\u003cspan class=\"en\">man is not a being\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도덕적으로 행동할 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">act \u003c/span>\u003cspan class=\"tgt\">morally\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 본능에도 불구하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">spite \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">instinct\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 존재를 보호하려는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">protect \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">existence\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연 상태에서.\u003c/span>\u003cspan class=\"en\">in the state of nature.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">홉스에 따르면, 인간은 자연 상태에서 자신의 존재를 보호하려는 그의 본능을 무릅쓰고 도덕적으로 행동할 수 있는 존재가 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 홉스의 핵심 전제로, 인간은 자연 상태에서 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">보존 \u003c/b>\u003cb class=\"key\">본능\u003c/b>을 이길 만한 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">존재\u003c/b>가 아니라는 뜻입니다. 이 문장은 자연 상태에서의 인간은 도덕적으로 행동할 수 없다고 규정하여, 뒤에서 \u003cb class=\"key\">국가의 \u003c/b>\u003cb class=\"key\">필요성\u003c/b>을 이끌어 내는 도입부 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : a being who [can act morally] : \"도덕적으로 행동할 수 있는 존재\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 in spite of\u003c/span> : in spite of + 명사구 : \"그의 본능에도 불구하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : instinct + to protect + his existence : \"자신의 존재를 보호하려는 본능\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"According to Hobbes, 홉스에 따르면.  man is not a being, 인간은 존재가 아니다.  who can act morally, 도덕적으로 행동할 수 있는.  in spite of his instinct, 그의 본능에도 불구하고.  to protect his existence, 자신의 존재를 보호하려는.  in the state of nature, 자연 상태에서.. 이 문장 전체를 해석하면, 홉스에 따르면, 인간은 자연 상태에서 자신의 존재를 보호하려는 그의 본능을 무릅쓰고 도덕적으로 행동할 수 있는 존재가 아니다.","hl":"m"},{"n":13,"text":"이 문장은 홉스의 핵심 전제로, 인간은 자연 상태에서 자기 보존 본능을 이길 만한 도덕적 존재가 아니라는 뜻이에요. 다시 말해 인간은 자연 상태에서는 도덕적으로 행동할 수 있는 존재가 아니라는 주장이죠. 이렇게 도덕이 불가능한 상태로 규정하기 때문에 뒤에서 국가의 필요성이 도출되는 흐름으로 이어져요.","hl":"mn"},{"n":14,"text":"첫 번째 문법 포인트는 who can act morally예요. 선행사 a being을 수식하는 주격 관계대명사 who가 주어 역할을 하면서 뒤에 동사 can act가 이어져요. 두 번째 포인트는 to protect his existence인데, to부정사가 앞 명사 instinct를 수식하는 형용사적 용법으로 쓰였어요. 세 번째 포인트는 in spite of his instinct으로, in spite of는 뒤에 명사구를 취해 양보의 의미를 나타내는 전치사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서,\u003c/span>\u003cspan class=\"en\">Hence,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유일한 장소는\u003c/span>\u003cspan class=\"en\">the only place\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도덕과 도덕적 자유가 적용을 찾기 시작할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">morality \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">moral \u003c/span>\u003cspan class=\"tgt\">liberty \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">begin \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">application\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 장소에서 시작된다\u003c/span>\u003cspan class=\"en\">begins in a place\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">군림하는 권력, 즉 국가가 출현하는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">sovereign \u003c/span>\u003cspan class=\"tgt\">power, \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">namely \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">state, \u003c/span>\u003cspan class=\"tgt\">emerges\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서, 도덕과 도덕적 자유가 적용을 찾기 시작하는 유일한 곳은 군림하는 권력, 즉 국가가 출현하는 곳에서 나타난다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">도덕\u003c/b>과 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">자유\u003c/b>가 적용되기 시작하는 유일한 곳은 국가라는 \u003cb class=\"key\">군림하는 \u003c/b>\u003cb class=\"key\">권력\u003c/b>이 출현하는 곳임을 말합니다. 자연 상태에서는 도덕이 작동하지 않으므로, 국가가 생겨야 비로소 도덕이 의미를 갖는다는 논리적 연결 고리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사 where\u003c/span> : the only place + where + 완전한 절 : \"도덕과 도덕적 자유가 적용을 찾기 시작할 유일한 장소\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사 where\u003c/span> : a place + where + 완전한 절 : \"군림하는 권력, 즉 국가가 출현하는 장소\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격 표현\u003c/span> : a sovereign power, namely the state : \"군림하는 권력, 즉 국가\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Hence, 따라서.  the only place, 유일한 장소는.  where morality and moral liberty will begin to find an application, 도덕과 도덕적 자유가 적용을 찾기 시작할.  begins in a place, 한 장소에서 시작된다.  where a sovereign power, namely the state, emerges, 군림하는 권력, 즉 국가가 출현하는.. 이 문장 전체를 해석하면, 따라서, 도덕과 도덕적 자유가 적용을 찾기 시작하는 유일한 곳은 군림하는 권력, 즉 국가가 출현하는 곳에서 나타난다.","hl":"m"},{"n":16,"text":"이 문장은 도덕과 도덕적 자유가 적용되기 시작하는 유일한 장소가 군림하는 권력, 즉 국가가 출현하는 곳이라는 뜻이에요. 자연 상태에서는 도덕이 작동하지 않으므로 국가라는 통치 권력이 생겨야 비로소 도덕이 의미를 갖는다는 논리예요. 이는 홉스가 국가의 필요성을 강조하는 연결 고리 역할을 해요.","hl":"mn"},{"n":17,"text":"첫 번째 문법 포인트는 where morality and moral liberty will begin to find an application으로, 선행사 the only place를 수식하는 관계부사 where가 완전한 절을 이끌어요. 두 번째 포인트도 where a sovereign power, namely the state, emerges인데, 역시 장소 선행사 a place를 수식하는 관계부사 where이고 뒤에 주어 a sovereign power와 동사 emerges가 오는 완전한 절이에요. 세 번째 포인트는 namely the state로, 앞의 a sovereign power를 동격으로 구체화하는 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서 홉스는 묘사한다\u003c/span>\u003cspan class=\"en\">Hobbes thus \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">describes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연 상태를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">state \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">nature \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상황으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">circumstance\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 삶이 ~인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">man's \u003c/span>\u003cspan class=\"tgt\">life \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘고독하고, 가난하며, 불결하고, 잔인하고, 짧은’.\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">solitary, \u003c/span>\u003cspan class=\"tgt\">poor, \u003c/span>\u003cspan class=\"tgt\">nasty, \u003c/span>\u003cspan class=\"tgt\">brutish \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">short\u003c/span>&quot;.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 홉스는 자연 상태를 인간의 삶이 ‘고독하고, 가난하며, 불결하고, 잔인하고, 짧은’ 상황으로 묘사한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 홉스는 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 인간의 삶이 ‘고독하고, 가난하며, 불결하고, 잔인하고, 짧은’ 상황으로 묘사합니다. 이는 국가 없는 상태의 비참함을 구체적으로 보여 주는 유명한 표현으로, 앞 문장의 논지를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사 describe A as B\u003c/span> : describe + 목적어(A) + as + 명사(B) : \"자연 상태를 상황으로 묘사하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 관계대명사 (in which)\u003c/span> : a circumstance + in which + 완전한 절 : \"인간의 삶이 그러한 상태인 상황\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사 병렬 구조\u003c/span> : A, B, C, D and E (형용사 5개 병렬) : \"고독하고, 가난하며, 불결하고, 잔인하고, 짧은\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Hobbes thus describes, 따라서 홉스는 묘사한다.  the state of nature, 자연 상태를.  as a circumstance, 상황으로.  in which man's life is, 인간의 삶이 ~인.  \"solitary, poor, nasty, brutish and short\", ‘고독하고, 가난하며, 불결하고, 잔인하고, 짧은’.. 이 문장 전체를 해석하면, 따라서 홉스는 자연 상태를 인간의 삶이 ‘고독하고, 가난하며, 불결하고, 잔인하고, 짧은’ 상황으로 묘사한다.","hl":"m"},{"n":19,"text":"이 문장은 홉스가 자연 상태를 인간의 삶이 고독하고, 가난하며, 불결하고, 잔인하고, 짧은 상황으로 묘사한다는 내용이에요. 이는 인간의 삶이 보호받지 못하고 서로 갈등하는 전쟁 상태와 같다는 유명한 표현이에요. 앞 문장에서 말한 국가 없는 상태의 비참함을 구체적으로 보여 주면서 문단의 논지를 강조해요.","hl":"mn"},{"n":20,"text":"첫 번째 문법 포인트는 describes the state of nature as a circumstance인데, describe는 목적어를 as 이하의 명사로 묘사하는 형태로 쓰였어요. 두 번째 포인트는 in which man's life is로, 전치사 in과 관계대명사 which가 결합해 선행사 a circumstance를 수식해요. 세 번째 포인트는 solitary, poor, nasty, brutish and short인데, 다섯 개의 형용사가 콤마와 and로 병렬되어 인간 삶의 상태를 나열해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 의미한다\u003c/span>\u003cspan class=\"en\">It means\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 살아갈 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">live\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반적인 권력 없이\u003c/span>\u003cspan class=\"en\">without a general power\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 모두를 통제할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">control \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">all\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 실로\u003c/span>\u003cspan class=\"en\">they are indeed\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전쟁 상태에 있다\u003c/span>\u003cspan class=\"en\">in a state of war.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 사람들이 그들 모두를 통제할 일반적인 권력 없이 살아갈 때, 그들은 실로 전쟁 상태에 놓여 있는 것임을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 홉스가 말한 자연 상태의 비참함을 요약하며, 모든 사람을 통제할 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">권력\u003c/b>이 없으면 인간은 \u003cb class=\"key\">전쟁 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에 놓인다는 점을 분명히 해 주는 문장이다. 앞 문장의 자연 상태 묘사를 '전쟁 상태'라는 개념으로 연결해 주는 역할을 한다. to control them all은 권력의 통제 범위가 일부가 아니라 모든 사람임을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절을 이끄는 접속사 when\u003c/span> : when + 주어 + 동사 : \"사람들이 살아갈 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : a general power + to control them all : \"그들 모두를 통제할 일반적인 권력\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It means, 그것은 의미한다. when people live, 사람들이 살아갈 때. without a general power, 일반적인 권력 없이. to control them all, 그들 모두를 통제할. they are indeed, 그들은 실로. in a state of war, 전쟁 상태에 있다. 이 문장 전체를 해석하면, 그것은 사람들이 그들 모두를 통제할 일반적인 권력 없이 살아갈 때, 그들은 실로 전쟁 상태에 놓여 있는 것임을 의미한다.","hl":"m"},{"n":22,"text":"이 문장은 자연 상태에서 일반적인 권력이 없으면 전쟁 상태가 된다는 홉스의 주장을 요약해요. 앞 문장에서 말한 비참한 삶의 이유를 전쟁 상태라는 표현으로 다시 정의해 주는 역할이에요. to control them all에서 권력이 모든 사람을 통제한다는 점이 강조돼요.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 when people live예요. 여기서 when은 시간 부사절을 이끄는 접속사로 사람들이 살아갈 때라는 뜻을 만들어요. 두 번째 포인트는 to control them all이에요. 이 to부정사는 앞에 있는 명사 a general power를 꾸며 주는 형용사적 용법이라서 그들 모두를 통제할 일반적인 권력이라고 해석돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 다시 말해,\u003c/span>\u003cspan class=\"en\">In other words,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">홉스는, 인정했던\u003c/span>\u003cspan class=\"en\">Hobbes, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">accepted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간이 사회적이고 정치적인 존재가 아니라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">beings \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">political \u003c/span>\u003cspan class=\"tgt\">beings \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연 상태에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">state \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">nature\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 권력 없이는 믿는다\u003c/span>\u003cspan class=\"en\">believes \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">power \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연 상태에 있는 인간은 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">beings \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">state \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">nature \u003c/span>\u003cspan class=\"tgt\">are\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이기심에 기초해 반사회적이고 이성적이다\u003c/span>\u003cspan class=\"en\">&quot;antisocial and rational \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">based \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">selfishness\u003c/span>&quot;.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">즉 다시 말해, 자연 상태에 있는 인간은 사회적이고 정치적인 존재가 아니라는 것을 인정한 홉스는 그 권력이 없이 자연 상태에 있는 인간은 ‘이기심에 기초해 반사회적이고 이성적’이라고 믿는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 자연 상태의 인간이 사회적·정치적 존재가 아니라는 전제를 다시 확인하고, 그 권력이 없을 때 인간이 \u003cb class=\"key\">이기심\u003c/b>에 기초해 \u003cb class=\"key\">반사회적\u003c/b>이고 이성적이라고 본 홉스의 생각을 요약한다. 앞 문장에서 말한 전쟁 상태의 구체적 성격을 인간의 본성과 연결해 설명하는 역할을 한다. based on their selfishness는 반사회적 태도와 이성적 판단의 근거가 이기심임을 드러낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비제한적 관계대명사 who\u003c/span> : Hobbes, who accepted ~ : \"인정했던 홉스\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that\u003c/span> : accepted + that + 완전한 절 : \"인간이 사회적이고 정치적인 존재가 아니라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사 that\u003c/span> : believes + that + 완전한 절 : \"그 권력 없이는 자연 상태의 인간이 ...라고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">과거분사구\u003c/span> : rational + based on their selfishness : \"이기심에 기초한\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In other words, 즉 다시 말해. Hobbes, who accepted, 홉스는, 인정했던. that human beings are not social and political beings, 인간이 사회적이고 정치적인 존재가 아니라는 것을. in the state of nature, 자연 상태에서. believes that without the power, 그 권력 없이는 믿는다. human beings in the state of nature are, 자연 상태에 있는 인간은 ~이다. \"antisocial and rational based on their selfishness\", 이기심에 기초해 반사회적이고 이성적이다. 이 문장 전체를 해석하면, 즉 다시 말해, 자연 상태에 있는 인간은 사회적이고 정치적인 존재가 아니라는 것을 인정한 홉스는 그 권력이 없이 자연 상태에 있는 인간은 ‘이기심에 기초해 반사회적이고 이성적’이라고 믿는다.","hl":"m"},{"n":25,"text":"이 문장은 자연 상태의 인간이 사회적이고 정치적인 존재가 아니라는 전제를 다시 확인해요. 그 권력이 없을 때 인간은 이기심에 기초해 반사회적이고 이성적이라는 홉스의 생각을 정리해 주죠. 앞 문장의 전쟁 상태를 인간 본성과 연결해 설명하는 역할을 해요.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 who accepted예요. 이 who는 콤마 뒤에서 Hobbes를 부연 설명하는 비제한적 관계대명사예요. 두 번째 포인트는 that human beings are not social and political beings in the state of nature예요. 이 that절은 accepted의 목적어 역할을 하는 명사절이에요. 세 번째 포인트는 believes 다음의 that절이에요. that without the power human beings in the state of nature are로 이어지면서 believes의 목적어가 되고, 그 권력 없이는 자연 상태의 인간이 어떠하다는 내용을 이끌어요. 네 번째 포인트는 based on their selfishness예요. 과거분사 based가 이끄는 분사구가 이기심에 기초한이라는 뜻으로 앞의 rational을 수식해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가, 사회가\u003c/span>\u003cspan class=\"en\">Moreover, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">since \u003c/span>\u003cspan class=\"tgt\">society \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연적인 현상이 아니고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">natural \u003c/span>\u003cspan class=\"tgt\">phenomenon \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 자연적인 힘이 없다는 점 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">natural \u003c/span>\u003cspan class=\"tgt\">force\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을 하나로 모으는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">bringing \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">together\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 함께 모이게 할 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">bring \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">together \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회로서 상호 간의 애정이 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">society\u003c/span> is not mutual affection\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">홉스에 따르면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">according \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">Hobbes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가, 사회는 자연적인 현상이 아니며 사람들을 하나로 모으는 자연적인 힘도 없기 때문에, 홉스에 따르면 그들을 사회로 함께 모이게 하는 것은 상호 간의 애정이 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사회가 저절로 생기는 자연적 현상이 아니며 사람들을 묶는 \u003cb class=\"key\">자연적인 \u003c/b>\u003cb class=\"key\">힘\u003c/b>도 없다는 점을 이유로 제시한다. 따라서 사회를 구성하게 만드는 원리가 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">간의 \u003c/b>\u003cb class=\"key\">애정\u003c/b>이 아니라고 단정하면서, 다음 문장에서 상호 간의 두려움이라는 대안을 이끌어 내는 논리적 전환점 역할을 한다. according to Hobbes는 이 판단이 홉스의 견해임을 분명히 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">since가 이끄는 이유의 부사절\u003c/span> : since + 주어 + 동사, 주절 : \"사회가 자연적인 현상이 아니고 자연적인 힘이 없기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구\u003c/span> : force + bringing people together : \"사람들을 하나로 모으는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 what절\u003c/span> : what + 주어 + 동사 + ... + 동사 : \"그들을 사회로 함께 모이게 할 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : according to + 명사 : \"홉스에 따르면\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Moreover, since society, 게다가, 사회가. is not a natural phenomenon, 자연적인 현상이 아니고. and there is no natural force, 그리고 자연적인 힘이 없다는 점 때문에. bringing people together, 사람들을 하나로 모으는. what will bring them together, 그들을 함께 모이게 할 것은. as a society is not mutual affection, 사회로서 상호 간의 애정이 아니다. according to Hobbes, 홉스에 따르면. 이 문장 전체를 해석하면, 게다가, 사회는 자연적인 현상이 아니며 사람들을 하나로 모으는 자연적인 힘도 없기 때문에, 홉스에 따르면 그들을 사회로 함께 모이게 하는 것은 상호 간의 애정이 아니다.","hl":"m"},{"n":28,"text":"이 문장은 사회가 자연적인 현상이 아니고 사람들을 하나로 모으는 자연적인 힘도 없다는 이유를 먼저 제시해요. 그렇다면 사회를 만드는 것은 상호 간의 애정이 아니라 다른 무엇이라는 점을 말하고 있어요. 뒤 문장에서 그 대안으로 상호 간의 두려움이 등장하기 때문에 이 문장은 논리적 전환점 역할을 해요.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 since가 이끄는 부사절이에요. since society is not a natural phenomenon and there is no natural force는 사회가 자연적인 현상이 아니고 자연적인 힘이 없다는 이유를 나타내요. 두 번째 포인트는 bringing people together예요. 이 현재분사구는 앞의 명사 force를 꾸며서 사람들을 하나로 모으는 힘이라고 해석돼요. 세 번째 포인트는 what will bring them together as a society예요. 이 what절은 문장의 주어 역할을 하고, 그들을 사회로 함께 모이게 할 것이라는 뜻이에요. 네 번째 포인트는 according to Hobbes예요. according to는 무엇에 따르면이라는 뜻의 전치사구예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오히려,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is, \u003c/span>\u003cspan class=\"tgt\">rather, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 현재와 미래에 대한 상호 간의 두려움이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">mutual \u003c/span>\u003cspan class=\"tgt\">fear \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">men's \u003c/span>\u003cspan class=\"tgt\">present \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">future \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 모으는 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">assembles \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두려움의 원인이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">since \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cause \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">fear \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공통된 추진력이기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">common \u003c/span>\u003cspan class=\"tgt\">drive \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연 상태에 있는 사람들 사이에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">among \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">state \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">nature\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">두려움으로부터의 동기가 자연 상태에 있는 사람들 사이의 공통된 추진력이기 때문에, 오히려, 그들을 모으는 것은 인간의 현재와 미래에 대한 상호 간의 두려움이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사회가 생기는 원동력이 애정이 아니라 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">간의 \u003c/b>\u003cb class=\"key\">두려움\u003c/b>이라는 홉스의 주장을 압축합니다. 이어지는 since절은 그 이유를 덧붙여, 두려움의 원인이 자연 상태의 모든 사람에게 공통된 \u003cb class=\"key\">추진력\u003c/b>이기 때문이라고 설명합니다. 즉, 인간을 서로 결속시키는 감정은 호의가 아니라 두려움이라는 점을 강조하는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">it ~ that 강조구문\u003c/span> : It is(was) + 강조할 어구 + that + 나머지 : \"오히려 그들을 모으는 것은 인간의 현재와 미래에 대한 상호 간의 두려움이다.\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">since 이유의 부사절\u003c/span> : 주절 + since + 주어 + 동사 : \"두려움의 원인이 자연 상태에 있는 사람들 사이의 공통된 추진력이기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"It is, rather, 오히려. mutual fear of men's present and future, 인간의 현재와 미래에 대한 상호 간의 두려움이. that assembles them, 그들을 모으는 것입니다. since the cause of fear, 두려움의 원인이. is a common drive, 공통된 추진력이기 때문에. among people in the state of nature, 자연 상태에 있는 사람들 사이에서. 이 문장 전체를 해석하면, 두려움으로부터의 동기가 자연 상태에 있는 사람들 사이의 공통된 추진력이기 때문에, 오히려, 그들을 모으는 것은 인간의 현재와 미래에 대한 상호 간의 두려움이다.","hl":"m"},{"n":31,"text":"이 문장은 홉스의 핵심 주장을 정리한 문장이에요. 앞 문장에서 사회를 만드는 것이 상호 간의 애정이 아니라고 했죠. 이 문장은 바로 그들을 모으는 것이 상호 간의 두려움이라고 말하고, 그 이유를 since절에서 두려움의 원인이 자연 상태의 공통된 추진력이기 때문이라고 설명합니다. 그래서 결국 인간을 결속시키는 것은 호의가 아니라 두려움이라는 논리가 완성됩니다.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 It is, rather, mutual fear of men's present and future that assembles them입니다. 이건 it that 강조구문이에요. 원래 문장은 mutual fear of men's present and future assembles them인데, 이 주어를 강조하려고 It is와 that 사이에 넣은 거죠. 따라서 that은 관계대명사가 아니라 강조구문의 that으로 보아야 해요. 두 번째로 since the cause of fear is a common drive among people in the state of nature는 since가 이끄는 이유의 부사절입니다. 앞 문장의 이유를 설명하면서, 두려움의 원인이 자연 상태 사람들의 공통된 추진력이기 때문이라고 말해 주고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>홉스는 인간이 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에서 \u003cb class=\"key\">본능\u003c/b>을 무릅쓰고 도덕적으로 행동할 수 없다고 본다.\u003c/li>\u003cli>\u003cb class=\"key\">도덕\u003c/b>과 \u003cb class=\"key\">도덕적 \u003c/b>\u003cb class=\"key\">자유\u003c/b>는 \u003cb class=\"key\">군림하는 \u003c/b>\u003cb class=\"key\">권력\u003c/b>인 \u003cb class=\"key\">국가\u003c/b>가 등장할 때만 적용된다.\u003c/li>\u003cli>자연 상태는 모두를 통제할 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">권력\u003c/b>이 없어 \u003cb class=\"key\">전쟁 \u003c/b>\u003cb class=\"key\">상태\u003c/b>와 같고, 인간은 \u003cb class=\"key\">이기심\u003c/b>에 기초해 \u003cb class=\"key\">반사회적\u003c/b>이고 \u003cb class=\"key\">이성적\u003c/b>이다.\u003c/li>\u003cli>사회는 \u003cb class=\"key\">자연적인 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이 아니라 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">간의 \u003c/b>\u003cb class=\"key\">두려움\u003c/b> 때문에 형성된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>According to Hobbes, morality begins only when a sovereign power emerges, since people in the state of nature are selfish and are brought together by mutual fear rather than mutual affection.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">홉스에 따르면 인간은 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에서 \u003cb class=\"key\">이기심\u003c/b> 때문에 도덕적으로 행동할 수 없고, \u003cb class=\"key\">군림하는 \u003c/b>\u003cb class=\"key\">권력\u003c/b>인 \u003cb class=\"key\">국가\u003c/b>가 등장해야 도덕이 적용된다. 따라서 자연 상태는 \u003cb class=\"key\">전쟁 \u003c/b>\u003cb class=\"key\">상태\u003c/b>와 같으며, 사회는 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">간의 \u003c/b>\u003cb class=\"key\">두려움\u003c/b> 때문에 형성된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 정리하면, 홉스는 자연 상태의 인간은 이기적이고 반사회적이라서 도덕적으로 행동할 수 없으며, 모두가 서로를 통제할 권력이 없으면 전쟁 상태에 빠진다고 보았어요. 그래서 국가가 등장해야 도덕이 적용되고, 사회는 애정이 아니라 인간의 현재와 미래에 대한 두려움 때문에 만들어진다는 거예요. 이 논리를 첫 문장의 주장에서부터 근거와 결론까지 흐름으로 잡아 두면 좋아요. 오늘 강의는 여기까지예요, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
