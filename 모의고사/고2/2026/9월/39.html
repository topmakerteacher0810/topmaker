ZQT2B685/Hue9Hzt939dQVr7Pz6dF62/4HkSKdp5z05x25/z+JxTt3IHcgfqOPXv61AJABguvvhhj+ffP0P5Ub1/vL3/iH+Pf/wDXSsn59vw+93SGm9rS1tp5Pltr8/lZkjZyeuASB+Zpp5689/6/jTQynHzL1PG4fpz9Prz06A3L/fX/AL6GPb+X+NML+Ttp0tqkvyvr8wwCApHTBGevGMc/zHb8ckC5yfbt/d4Hfvjjjt+dIGB43KcZ53Lz6fz9ucYzmlDr/eTj3Xp19fw564+lH4208/n+Yubyl9z02u/yTHUv5+39aj3r/eXAyT8y9wPfg9OvGPc0eYgPLqO4yw7f5B/PqKBqTdtJWvrpba2/4d+pJk568+/X/P8A+qkpN4PzF1Oe4IGfpyewPrSb0/vL+Y/x/lmgTeuz/Pttve1/PZrdC5A9AAfpjPP+f8TTXI2n6DGDz83GMeuPyprOoPVSe2GB+vfggY5yenAHNRHHzNncW4ycHk9F6YHTp6e2K0jFN3v/AC2XVu6vbrvdX0s1a7uZSbaellG/R6bWvr07eZ//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Organizational Exclusion: Its Negative Effects and the Need for Precautions<small>조직 내 배제: 부정적 영향과 예방 조치의 필요성</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">우리가 직장이나 학교에서 무리에 끼지 못하고 혼자 밥을 먹을 때 느끼는 막막함처럼, 심리학에서는 집단 내에서 무시당하거나 고립되는 현상을 조직 소외(Organizational exclusion)라고 부릅니다. 인간은 본능적으로 타인과 연결되고 싶어 하는 기본적 욕구(Basic needs)를 지니고 있는데, 이 욕구가 위협받으면 사람들은 어떻게든 집단에 다시 속하기 위해 타인에게 친절을 베푸는 등의 긍정적 사회 행동(Positive social behaviors)을 보이게 됩니다. 하지만 이런 노력에도 불구하고 집단에 적응하지 못하면 결국 상처를 받고 소통을 단절하게 되는데, 이는 업무 성과(Employee performance)의 급격한 저하로 이어집니다. 따라서 이 지문을 읽으실 때는 개인의 소속감(Belonging)과 자존감(Self-respect)이 조직 내에서 얼마나 중요한 심리적 기제로 작용하며, 소외 현상을 방치했을 때 기업에 어떤 치명적인 악순환을 초래하는지 염두에 두시면 훨씬 깊이 있게 이해하실 수 있을 거예요.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01문제 제기</div><ul><li>조직 내 배제 현상이 심리학자들에게 간과되어 예방책이 부족한 실정이다.</li><li>배제(exclusion)는 조직 심리학에서 무시되는 상태임</li><li>조직 내 배제에 대한 예방책(precautions)이 취해지지 않을 가능성이 큼</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02개인의 초기 반응과 적응</div><ul><li>개인은 위협받는 기본 욕구를 채우기 위해 긍정적인 사회 행동을 시도한다.</li><li>위협받은 기본 욕구(basic needs)를 강화하는 방식으로 반응함</li><li>긍정적 사회 행동(positive social behaviors)은 소속감과 자존감을 형성함</li><li>긍정적으로 적응(adapt)하려는 개인은 배제될 가능성이 감소함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03부적응과 악순환의 형성</div><ul><li>집단에 적응하지 못한 개인은 활동에서 멀어지고 이는 다시 배제를 심화시킨다.</li><li>집단에 적응하지 못하면 더 큰 배제에 직면함</li><li>소통(communication) 및 사회 활동과 멀어지며 조직 기여도가 하락함</li><li>상황이 방치될 경우 배제가 증폭되어 직원 성과(performance)에 부정적 영향을 미침</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 시사점</div><ul><li>조직 내 배제는 비즈니스에 치명적이므로 반드시 예방 조치를 취해야 한다.</li><li>배제의 부정적 악순환을 차단해야 함</li><li>비즈니스를 위해 조직 내 배제에 대한 예방책(precautions) 마련이 필수적임</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exclusion</td><td class=\"m\">배제, 제외</td></tr><tr><td class=\"w\">ignore</td><td class=\"m\">무시하다, 모르는 체하다</td></tr><tr><td class=\"w\">precaution</td><td class=\"m\">예방 조치, 대비</td></tr><tr><td class=\"w\">react to</td><td class=\"m\">~에 반응하다, ~에 대처하다</td></tr><tr><td class=\"w\">strengthen</td><td class=\"m\">강화하다, 튼튼하게 하다</td></tr><tr><td class=\"w\">threaten</td><td class=\"m\">위협하다, 협박하다</td></tr><tr><td class=\"w\">belonging</td><td class=\"m\">소속감, 친밀감</td></tr><tr><td class=\"w\">self-respect</td><td class=\"m\">자아존중감, 자존감</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">likelihood</td><td class=\"m\">가능성, 가망</td></tr><tr><td class=\"w\">adapt to</td><td class=\"m\">~에 적응하다, ~에 맞추다</td></tr><tr><td class=\"w\">decrease</td><td class=\"m\">감소하다, 줄어들다</td></tr><tr><td class=\"w\">be faced with</td><td class=\"m\">~에 직면하다, ~와 마주치다</td></tr><tr><td class=\"w\">grow away from</td><td class=\"m\">~로부터 멀어지다, ~와 소원해지다</td></tr><tr><td class=\"w\">contribution</td><td class=\"m\">기여, 공헌</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 방지하다</td></tr><tr><td class=\"w\">in a negative way</td><td class=\"m\">부정적인 방법으로, 부정적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">배제는 상태이다</span><span class=\"en\"><b>Exclusion is a state</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">간과되는</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> <span class=\"grammar-hl\">is ignored</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조직 심리학자들에 의해</span><span class=\"en\"><b>by the organization psychologists.</b></span></div></div><div class=\"lec-sent-ko\">배제는 조직 심리학자들에 의해 간과되는 상태이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글을 시작하며 문제 상황을 제시합니다. 조직 생활에서 직원이 따돌림이나 소외를 당하는 현상에 대해, 그것을 연구하고 해결책을 내놓아야 할 학자들조차 그 심각성을 간과하고 있다는 의미를 담고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that (관계대명사): 주격 관계대명사. 선행사 a state를 수식하는 관계사절을 이끌며, 절 내부에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">is ignored (수동태): be동사(is) + p.p.(ignored) 구조. ignore는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is ignored 형태로 쓴다. (기본구조: ignore + O)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exclusion</td><td class=\"m\">배제, 제외</td></tr><tr><td class=\"w\">ignore</td><td class=\"m\">무시하다, 모르는 체하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">따라서, ~할 가능성이 있다</span><span class=\"en\"><b>Therefore, <span class=\"grammar-hl\">it is possible</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조직 배제에 관한 예방 조치가</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> precautions regarding organizational exclusion</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">취해지지 않을</span><span class=\"en\"><b><span class=\"grammar-hl\">are not taken</span>.</b></span></div></div><div class=\"lec-sent-ko\">따라서 조직 배제에 관한 예방 조치가 취해지지 않을 가능성이 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 결과로 나타나는 현실적인 문제점을 지적합니다. 학자들이 이 문제를 깊이 다루지 않기 때문에, 실제 기업 현장에서도 직원이 소외되는 상황을 막기 위한 아무런 사전 대책을 마련하지 않게 된다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">it is possible that (가주어): 진주어: it은 형식적인 주어(가주어) 역할을 하고, that절(that precautions ~ are not taken)이 진짜 주어(진주어) 역할을 하는 명사절이다.</div><div class=\"lec-gr-item\">are not taken (수동태): be동사(are) + p.p.(taken) 구조. take는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are not taken 형태로 쓴다. (기본구조: take + O)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exclusion</td><td class=\"m\">배제, 제외</td></tr><tr><td class=\"w\">precaution</td><td class=\"m\">예방 조치, 대비</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">개인들은 조직 배제에 반응한다</span><span class=\"en\"><b>Individuals <span class=\"grammar-hl\">react to</span> organizational exclusion</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들의 기본적인 욕구를 강화하려고 노력함으로써,</span><span class=\"en\"><b>by <span class=\"grammar-hl\">trying</span> <span class=\"grammar-hl\">to strengthen</span> their basic needs,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">위협 받는</span><span class=\"en\"><b><span class=\"grammar-hl\">which</span> <span class=\"grammar-hl\">are threatened</span>.</b></span></div></div><div class=\"lec-sent-ko\">개인들은 위협 받는 그들의 기본적인 욕구를 강화하려고 노력함으로써 조직 배제에 반응한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이제 배제를 당한 개인의 입장에서 어떤 일이 벌어지는지 설명합니다. try to strengthen their basic needs는 단순히 욕구를 키운다는 뜻을 넘어, 소속감이나 인정 같은 본능적인 인간의 욕구가 충족되지 않아 불안해진 상태에서 이를 어떻게든 채우려고 발버둥 치는 모습을 가리킵니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">react to (관용표현): &#39;~에 반응하다&#39;라는 뜻으로 쓰이는 동사구이다.</div><div class=\"lec-gr-item\">trying (동명사): 전치사 by의 목적어 역할을 하며, &#39;by -ing(~함으로써)&#39;의 구조를 이룬다.</div><div class=\"lec-gr-item\">to strengthen (to부정사): 명사적 용법. 동사 try의 목적어 역할을 하여 &#39;~하는 것을(강화하는 것을) 노력하다&#39;라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">which (관계대명사): 주격 관계대명사의 계속적 용법(콤마 뒤). 선행사 their basic needs를 부연 설명하며 절 내부에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">are threatened (수동태): be동사(are) + p.p.(threatened) 구조. threaten은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are threatened 형태로 쓴다. (기본구조: threaten + O)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exclusion</td><td class=\"m\">배제, 제외</td></tr><tr><td class=\"w\">react to</td><td class=\"m\">~에 반응하다, ~에 대처하다</td></tr><tr><td class=\"w\">strengthen</td><td class=\"m\">강화하다, 튼튼하게 하다</td></tr><tr><td class=\"w\">threaten</td><td class=\"m\">위협하다, 협박하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">긍정적인 사회적 행동은 소속감과 자기 존중을 발달시킨다.</span><span class=\"en\"><b>Positive social behaviors develop <span class=\"grammar-hl\">belonging</span> and self-respect.</b></span></div></div><div class=\"lec-sent-ko\">긍정적인 사회적 행동은 소속감과 자기 존중을 발달시킨다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 말한 기본적 욕구를 채우기 위해 개인이 취할 수 있는 긍정적인 해결 방식을 소개합니다. 동료들과 잘 어울리고 협력하는 등 바람직한 방식으로 행동하게 되면, 조직의 일원이라는 느낌과 스스로를 존중하는 마음을 얻게 된다는 뜻입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">belonging (동명사(명사적)): 동사 develop의 목적어 자리에 쓰여 &#39;소속되는 것/소속감&#39;이라는 명사적 개념을 나타낸다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">belonging</td><td class=\"m\">소속감, 친밀감</td></tr><tr><td class=\"w\">self-respect</td><td class=\"m\">자아존중감, 자존감</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">가능성은</span><span class=\"en\"><b><span class=\"grammar-hl\">The likelihood</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">긍정적인 사회적 행동에 적응하려고 노력하는 개인들이</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> individuals <span class=\"grammar-hl\">who</span> try <span class=\"grammar-hl\">to adapt</span> to positive social behaviors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조직 배제를 경험할</span><span class=\"en\"><b>will experience organizational exclusion</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">낮아진다.</span><span class=\"en\"><b>decreases.</b></span></div></div><div class=\"lec-sent-ko\">긍정적인 사회적 행동에 적응하려고 노력하는 개인들이 조직 배제를 경험할 가능성은 낮아진다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 긍정적 행동이 가져오는 결과를 설명합니다. try to adapt to positive social behaviors는 조직 문화에 맞추어 원만하게 행동하려고 애쓰는 모습을 가리키며, 이렇게 노력하는 사람은 동료들에게 자연스럽게 섞이게 되어 소외당할 일이 줄어든다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">The likelihood that 동격의 that: 명사(likelihood) + that + S + V 구조. 뒤 that절이 앞 명사(likelihood)의 내용을 구체화/설명(…라는 가능성)하는 역할을 한다.</div><div class=\"lec-gr-item\">who (관계대명사): 주격 관계대명사. 선행사 individuals를 수식하는 형용사절을 이끌며, 절 내부에서 주어 역할을 한다.</div><div class=\"lec-gr-item\">to adapt (to부정사): 명사적 용법. 동사 try의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exclusion</td><td class=\"m\">배제, 제외</td></tr><tr><td class=\"w\">likelihood</td><td class=\"m\">가능성, 가망</td></tr><tr><td class=\"w\">adapt to</td><td class=\"m\">~에 적응하다, ~에 맞추다</td></tr><tr><td class=\"w\">decrease</td><td class=\"m\">감소하다, 줄어들다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나, 개인들은 더 많은 배제를 직면하게 될 수도 있다</span><span class=\"en\"><b>However, individuals may <span class=\"grammar-hl\">be faced</span> with more exclusion</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 집단에 적응하지 못할 때</span><span class=\"en\"><b>when they cannot <span class=\"grammar-hl\">adapt to</span> a group.</b></span></div></div><div class=\"lec-sent-ko\">그러나, 개인들이 집단에 적응하지 못할 때 그들은 더 많은 배제를 직면하게 될 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 긍정적 결과와 반대되는 상황으로 논의의 방향을 뒤집습니다. 조직의 분위기나 인간관계에 제대로 섞여 들어가지 못하는 사람은 앞서 말한 긍정적인 방식을 취하지 못해 도리어 더 심하게 따돌림을 받게 될 위험이 있다는 것을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">be faced (수동태): be동사(be) + p.p.(faced) 구조. face는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 be faced 형태로 쓴다. (기본구조: face + O + with B / face + O)</div><div class=\"lec-gr-item\">adapt to (관용표현): &#39;~에 적응하다&#39;라는 의미로 쓰이는 숙어이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exclusion</td><td class=\"m\">배제, 제외</td></tr><tr><td class=\"w\">adapt to</td><td class=\"m\">~에 적응하다, ~에 맞추다</td></tr><tr><td class=\"w\">be faced with</td><td class=\"m\">~에 직면하다, ~와 마주치다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">배제된 개인들이 멀어질 때</span><span class=\"en\"><b>When <span class=\"grammar-hl\">excluded</span> individuals <span class=\"grammar-hl\">grow away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">의사소통 및 사회 활동과,</span><span class=\"en\"><b><span class=\"grammar-hl\">from</span> communication and social activities,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 속한 조직에 대한 기여도는</span><span class=\"en\"><b>their contribution to <span class=\"grammar-hl\">the organization they are in</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">감소할 수도 있다.</span><span class=\"en\"><b>may decrease.</b></span></div></div><div class=\"lec-sent-ko\">배제된 개인들이 의사소통 및 사회 활동과 멀어질 때, 그들이 속한 조직에 대한 기여도는 감소할 수도 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 배제가 심화되었을 때 일어나는 연쇄적인 악영향을 다룹니다. grow away from communication and social activities는 동료들과 대화를 나누거나 회식 같은 모임에 참여하는 것을 아예 포기해 버리는 상태를 뜻합니다. 이렇게 고립된 사람은 자연스레 업무 협력도 피하게 되어 회사에 도움이 되지 못한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">excluded (과거분사(형용사)): excluded가 뒤의 명사 individuals를 수식하여 &#39;배제된 개인들&#39;이라는 의미를 나타낸다.</div><div class=\"lec-gr-item\">grow away from (관용표현): &#39;~로부터 멀어지다&#39;라는 의미로 쓰이는 동사구이다.</div><div class=\"lec-gr-item\">the organization they are in 관계대명사 생략: 선행사 the organization 뒤에 목적격 관계대명사(which/that)가 생략된 구조. 뒤에 이어지는 전치사 in의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">decrease</td><td class=\"m\">감소하다, 줄어들다</td></tr><tr><td class=\"w\">grow away from</td><td class=\"m\">~로부터 멀어지다, ~와 소원해지다</td></tr><tr><td class=\"w\">contribution</td><td class=\"m\">기여, 공헌</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이러한 상황을 피하지 못할 경우,</span><span class=\"en\"><b>When this situation <span class=\"grammar-hl\">is not avoided</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">배제는 훨씬 더 늘어나고</span><span class=\"en\"><b>exclusion increases even more</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">직원 성과에 강하게 영향을 미친다</span><span class=\"en\"><b>and strongly affects the performance of the employee</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">부정적인 방식으로</span><span class=\"en\"><b>in a negative way.</b></span></div></div><div class=\"lec-sent-ko\">이러한 상황을 피하지 못할 경우, 배제는 훨씬 더 늘어나고 직원 성과에 부정적인 방식으로 강하게 영향을 미친다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 악순환이 절정에 달하는 단계를 설명합니다. When this situation is not avoided는 고립된 직원이 스스로 겉돌고 기여도가 떨어지는 상황을 조직 차원에서 그대로 방치하는 것을 가리킵니다. 결국 소외된 직원은 업무 성과마저 뚝 떨어지게 되어 개인과 조직 모두에게 큰 손해를 끼치게 됨을 글쓴이는 힘주어 말하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">is not avoided (수동태): be동사(is) + p.p.(avoided) 구조. avoid는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is not avoided 형태로 쓴다. (기본구조: avoid + O)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exclusion</td><td class=\"m\">배제, 제외</td></tr><tr><td class=\"w\">avoid</td><td class=\"m\">피하다, 방지하다</td></tr><tr><td class=\"w\">in a negative way</td><td class=\"m\">부정적인 방법으로, 부정적으로</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 9 / 9</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예방 조치는 취해져야 할 필요가 있다</span><span class=\"en\"><b>Precautions need <span class=\"grammar-hl\">to be taken</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">조직 배제에 관해,</span><span class=\"en\"><b>regarding organizational exclusion,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이는 매우 중요하다</span><span class=\"en\"><b><span class=\"grammar-hl\">which</span> is very important</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">업무에서</span><span class=\"en\"><b>for business.</b></span></div></div><div class=\"lec-sent-ko\">조직 배제에 관한 예방 조치는 취해져야 할 필요가 있는데, 이는 업무에서 매우 중요하다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 글의 결론이자 필자의 핵심 주장입니다. 첫 두 문장에서 제기했던 문제로 다시 돌아와, 기업이 원활하게 운영되고 이윤을 내기 위해서는 직원들이 소외당하지 않도록 회사가 적극적으로 미리 막고 관리해야 한다고 촉구하고 있습니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to be taken (수동태/to부정사): to부정사에 수동태가 결합된 형태. take는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 to be taken 형태로 쓴다. (기본구조: take + O)</div><div class=\"lec-gr-item\">which (관계대명사): 주격 관계대명사의 계속적 용법(콤마 뒤). 선행사 organizational exclusion을 부연 설명하며, 절 내부에서 주어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">exclusion</td><td class=\"m\">배제, 제외</td></tr><tr><td class=\"w\">precaution</td><td class=\"m\">예방 조치, 대비</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>조직 내 배제 현상은 심리학자들에게 간과되어 기업 현장에서 예방 조치가 제대로 이루어지지 않고 있다.</li><li>배제 위기에 처한 개인은 긍정적으로 대처할 경우 소속감을 얻고 고립을 피할 수 있다.</li><li>반면 조직에 적응하지 못하면 대인관계를 단절하게 되어 배제가 더 심해진다.</li><li>결국 이는 직원의 업무 성과와 기여도 하락으로 이어지므로, 비즈니스 차원의 예방 조치가 필수적이다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Employees facing organizational exclusion often withdraw and show decreased performance, so businesses must take active precautions to prevent this issue.</div>\n              <div class=\"lec-final-sum-ko\">조직 내 배제에 직면한 직원들은 종종 고립되어 저하된 성과를 보이므로, 기업은 이 문제를 예방하기 위해 적극적인 조치를 취해야 한다.</div></div></div>"],"segs":[[{"audio":"./39_audio/1.mp3","hl":null}],[{"audio":"./39_audio/2.mp3","hl":null}],[{"audio":"./39_audio/3.mp3","hl":null},{"audio":"./39_audio/4.mp3","hl":"stage-0"},{"audio":"./39_audio/5.mp3","hl":"stage-1"},{"audio":"./39
