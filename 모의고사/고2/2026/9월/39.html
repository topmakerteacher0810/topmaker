}
lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 39번","audioDir":"39_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">39번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>The Hidden Cost of Organizational Exclusion\u003c/h1>\u003ch2>조직 배제의 숨겨진 대가\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>조직 내 \u003cb class=\"key\">배제\u003c/b>는 심리학자들에게 \u003cb class=\"key\">간과\u003c/b>되어 \u003cb class=\"key\">예방 \u003c/b>\u003cb class=\"key\">조치\u003c/b>가 부족하며, 개인의 \u003cb class=\"key\">기본적인 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>가 위협받고 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>에 적응하지 못하면 \u003cb class=\"key\">배제\u003c/b>가 심화되어 \u003cb class=\"key\">직원 \u003c/b>\u003cb class=\"key\">성과\u003c/b>에 부정적 영향을 미치므로 \u003cb class=\"key\">예방 \u003c/b>\u003cb class=\"key\">조치\u003c/b>가 필요하다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Organizations must take precautions against exclusion because it threatens employees' basic needs, reduces their contribution, and harms performance.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"네, 여러분 안녕하세요. 오늘은 조직 심리학에서 다루는 배제라는 개념을 다룬 지문을 함께 보겠습니다. 이 글은 조직 배제가 왜 위험한지, 그리고 어떤 예방 조치가 필요한지 설명합니다. 핵심 요지를 먼저 말씀드리면 조직은 직원의 기본적인 욕구를 위협하는 배제를 예방해야 한다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리는 학교나 직장에서 무리에 끼지 못하고 소외되는 경험을 흔히 \u003cb class=\"key\">조직 \u003c/b>\u003cb class=\"key\">배제\u003c/b>라고 부릅니다. 조직 심리학에서는 개인이 집단에 속하려는 \u003cb class=\"key\">기본적인 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>인 소속 욕구(belongingness)가 좌절될 때 여러 부정적 반응이 나타난다고 봅니다. \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>(positive social behaviors)은 인사하고 협력하며 도움을 주는 행동으로 \u003cb class=\"key\">소속감\u003c/b>(belonging)과 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">존중\u003c/b>(self-respect)을 키워 줍니다. 반면 집단 규범에 적응하지 못하면 고립이 깊어지고, \u003cb class=\"key\">의사소통\u003c/b>이 줄면서 조직에 대한 \u003cb class=\"key\">기여도\u003c/b>도 떨어질 수 있습니다. 이는 마치 학급에서 점심시간에 무리에 끼지 못하는 학생이 점점 말수가 적어지고 모둠 활동에서도 손을 놓는 상황과 비슷합니다. 따라서 조직은 \u003cb class=\"key\">배제\u003c/b>를 단순한 개인 문제로 두지 말고 \u003cb class=\"key\">예방 \u003c/b>\u003cb class=\"key\">조치\u003c/b>를 마련해야 합니다.\u003c/div>","segs":[{"n":2,"text":"배제는 학교나 직장에서 무리에 끼지 못하고 소외되는 상태를 말해요. 조직 심리학에서는 소속 욕구 belongingness가 좌절되면 여러 부정적 반응이 나타난다고 봅니다. 긍정적인 사회적 행동 positive social behaviors은 인사하고 협력하며 도움을 주는 행동으로 소속감 belonging과 자기 존중 self-respect을 길러 줘요. 반대로 집단에 적응하지 못하면 고립이 깊어지고 의사소통이 줄면서 기여도가 떨어질 수 있습니다. 마치 학급에서 점심시간에 무리에 끼지 못하는 학생이 점점 말수가 적어지는 것과 비슷하죠. 그래서 조직은 배제를 개인 문제로 두지 말고 예방 조치를 마련해야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>간과된 배제\u003csmall>문제 제기 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>조직 심리학자들이 \u003cb class=\"key\">배제\u003c/b>를 \u003cb class=\"key\">간과\u003c/b>하기 때문에 조직 배제에 관한 \u003cb class=\"key\">예방 \u003c/b>\u003cb class=\"key\">조치\u003c/b>가 취해지지 않을 가능성이 있다는 내용입니다. 배제가 중요한 문제임에도 조직 차원의 대비가 없는 상태를 지적합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>기본 욕구와 긍정적 행동\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>개인은 \u003cb class=\"key\">기본적인 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>가 위협받으면 이를 강화하려고 반응합니다. \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>은 \u003cb class=\"key\">소속감\u003c/b>과 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">존중\u003c/b>을 발달시키므로, 여기에 적응하려는 개인은 조직 배제를 경험할 가능성이 \u003cb class=\"key\">낮아집니다\u003c/b>.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>적응 실패와 기여 감소\u003csmall>전환 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>그러나 집단에 \u003cb class=\"key\">적응하지 \u003c/b>\u003cb class=\"key\">못하면\u003c/b> 오히려 더 많은 \u003cb class=\"key\">배제\u003c/b>를 직면할 수 있습니다. 배제된 개인은 \u003cb class=\"key\">의사소통\u003c/b>과 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">활동\u003c/b>에서 멀어지고 조직에 대한 \u003cb class=\"key\">기여도\u003c/b>가 감소할 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>배제 심화와 예방 필요\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>이 상황을 피하지 못하면 \u003cb class=\"key\">배제\u003c/b>가 더욱 늘어나 \u003cb class=\"key\">직원 \u003c/b>\u003cb class=\"key\">성과\u003c/b>에 부정적 영향을 미칩니다. 따라서 업무에서 매우 중요한 조직 배제에 관한 \u003cb class=\"key\">예방 \u003c/b>\u003cb class=\"key\">조치\u003c/b>가 필요하다고 결론짓습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 크게 네 단계로 흐름을 잡을 수 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 조직 심리학자들이 배제를 간과하고 있다는 문제를 제기합니다. 배제가 중요한데도 예방 조치가 취해지지 않을 가능성이 있다는 것이지요. 따라서 배제는 조직이 미리 막아야 할 상태라는 점을 먼저 기억합시다.","hl":"f0"},{"n":5,"text":"세 번째 문장부터 다섯 번째 문장까지는 개인이 배제에 어떻게 반응하는지 보여 줍니다. 위협받는 기본적인 욕구를 강화하려고 노력하는데, 긍정적인 사회적 행동이 소속감과 자기 존중을 발달시킵니다. 그래서 긍정적인 사회적 행동에 적응하려는 개인은 조직 배제를 경험할 가능성이 낮아져요.","hl":"f1"},{"n":6,"text":"여섯 번째와 일곱 번째 문장에서는 반대로 집단에 적응하지 못하는 상황을 다룹니다. 이 경우 오히려 더 많은 배제를 직면할 수 있고, 의사소통과 사회 활동에서 멀어지면서 조직에 대한 기여도가 감소할 수 있습니다. 적응 실패가 배제를 더 부른다는 점을 주목하세요.","hl":"f2"},{"n":7,"text":"여덟 번째와 아홉 번째 문장은 결론입니다. 이 상황을 피하지 못하면 배제가 더 늘어나 직원 성과에 부정적인 영향을 미친다고 말해요. 그래서 업무에서 매우 중요한 조직 배제에 관한 예방 조치가 필요하다고 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">배제\u003c/b>가 \u003cb class=\"key\">간과\u003c/b>되는 문제를 제기하고, 중간에서 배제가 개인과 조직에 미치는 영향을 분석한 뒤, 마지막 문장에서 \u003cb class=\"key\">예방 \u003c/b>\u003cb class=\"key\">조치\u003c/b>가 필요하다는 해결책을 제시합니다. 이렇게 처음과 끝에 핵심 주장이 모두 나타나므로 \u003cb class=\"key\">양괄식\u003c/b> 구조로 볼 수 있습니다. 글의 주제문이자 결론은 마지막 문장입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Therefore (2)\u003c/b>\u003cspan>결과·인과\u003c/span>\u003cb>However (6)\u003c/b>\u003cspan>역접·전환\u003c/span>\u003cb>When (7)\u003c/b>\u003cspan>조건\u003c/span>\u003cb>When this situation is not avoided (8)\u003c/b>\u003cspan>조건·심화\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">organizational exclusion\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">exclusion\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more exclusion\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">exclusion increases even more\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>긍정적 사회적 행동에 적응\u003c/th>\u003cth>집단에 적응하지 못함\u003c/th>\u003c/tr>\u003ctr>\u003ctd>배제 경험 가능성 낮아짐\u003c/td>\u003ctd>더 많은 배제 직면\u003c/td>\u003c/tr>\u003ctr>\u003ctd>조직 기여도 유지·발달 가능\u003c/td>\u003ctd>의사소통·사회 활동 멀어져 기여도 감소\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제 해결 구조로 볼 수 있어요. 첫 부분에서 조직 배제가 간과되는 문제를 제기하고, 중간에서 배제가 개인에게 미치는 영향을 설명한 뒤, 마지막에서 예방 조치가 필요하다는 해결책을 제시합니다. 핵심 문장은 마지막 문장이지만 첫 문장도 문제를 던지기 때문에 양괄식 구조로 이해하면 좋습니다.","hl":"ty"},{"n":9,"text":"두 번째 문장의 Therefore는 앞 문장의 원인에 따른 결과를 이끄는 신호어예요. 여섯 번째 문장의 However는 긍정적인 상황에서 부정적인 상황으로 전환되는 지점입니다. 일곱 번째와 여덟 번째 문장의 When은 조건을 나타내며 배제가 심화되는 과정을 연결해 줍니다. 또한 organizational exclusion이 exclusion, more exclusion으로 재진술되며 배제의 강도가 커지는 흐름도 함께 봐야 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>exclusion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배제\u003c/span>\u003c/div>\u003cdiv>\u003cb>state\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상태\u003c/span>\u003c/div>\u003cdiv>\u003cb>ignored\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무시된, 간과된\u003c/span>\u003c/div>\u003cdiv>\u003cb>organizational psychologists\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>조직 심리학자들\u003c/span>\u003c/div>\u003cdiv>\u003cb>precautions\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예방 조치\u003c/span>\u003c/div>\u003cdiv>\u003cb>taken\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>취해진\u003c/span>\u003c/div>\u003cdiv>\u003cb>individuals\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인들\u003c/span>\u003c/div>\u003cdiv>\u003cb>react\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반응하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>strengthen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>basic needs\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기본적인 욕구\u003c/span>\u003c/div>\u003cdiv>\u003cb>threatened\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위협받는\u003c/span>\u003c/div>\u003cdiv>\u003cb>positive social behaviors\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>긍정적인 사회적 행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>develop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발달시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>belonging\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소속감\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-respect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자기 존중\u003c/span>\u003c/div>\u003cdiv>\u003cb>likelihood\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가능성\u003c/span>\u003c/div>\u003cdiv>\u003cb>adapt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>적응하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>experience\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decreases\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감소하다, 낮아지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>faced with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 직면한\u003c/span>\u003c/div>\u003cdiv>\u003cb>grow away from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 멀어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>communication\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의사소통\u003c/span>\u003c/div>\u003cdiv>\u003cb>social activities\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사회 활동\u003c/span>\u003c/div>\u003cdiv>\u003cb>contribution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기여도\u003c/span>\u003c/div>\u003cdiv>\u003cb>avoid\u003c/b>\u003cem>동사\u003c/em>\u003cspan>피하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>affects\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>performance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성과\u003c/span>\u003c/div>\u003cdiv>\u003cb>in a negative way\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>부정적인 방식으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>important\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>business\u003c/b>\u003cem>명사\u003c/em>\u003cspan>업무\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이 지문에서 알아둘 단어로는 exclusion 배제, precautions 예방 조치, basic needs 기본적인 욕구, belonging 소속감, self-respect 자기 존중, adapt 적응하다, contribution 기여도, performance 성과 등이 있어요. 이 어휘들은 조직과 개인의 관계를 다루는 글에서 자주 나오니까 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">exclusion\u003c/b>\u003cspan class=\"m\">배제\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rejection\u003c/span>\u003cspan class=\"s\">isolation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inclusion\u003c/span>\u003cspan class=\"a\">acceptance\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">strengthen\u003c/b>\u003cspan class=\"m\">강화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reinforce\u003c/span>\u003cspan class=\"s\">bolster\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weaken\u003c/span>\u003cspan class=\"a\">undermine\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">belonging\u003c/b>\u003cspan class=\"m\">소속감\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">membership\u003c/span>\u003cspan class=\"s\">acceptance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">alienation\u003c/span>\u003cspan class=\"a\">exclusion\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">adapt\u003c/b>\u003cspan class=\"m\">적응하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adjust\u003c/span>\u003cspan class=\"s\">accommodate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">resist\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decrease\u003c/b>\u003cspan class=\"m\">감소하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">diminish\u003c/span>\u003cspan class=\"s\">decline\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">rise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contribution\u003c/b>\u003cspan class=\"m\">기여\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">input\u003c/span>\u003cspan class=\"s\">service\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">withdrawal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">performance\u003c/b>\u003cspan class=\"m\">성과\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">achievement\u003c/span>\u003cspan class=\"s\">productivity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">failure\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 봅시다. exclusion은 rejection이나 isolation과 동의어이고 inclusion이나 acceptance와 반대예요. strengthen은 reinforce와 비슷하고 weaken과 반대입니다. belonging은 membership과 가깝고 alienation과 반대이며, adapt는 adjust와 유사하고 resist와 반대예요. decrease는 diminish와 가깝고 increase와 반대이고, contribution은 input이나 service와 유사하고 withdrawal과 대비됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배제는 한 상태이다\u003c/span>\u003cspan class=\"en\">Exclusion is a state\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간과되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">ignored\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조직 심리학자들에 의해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">organization \u003c/span>\u003cspan class=\"tgt\">psychologists\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">배제는 조직 심리학자들에 의해 간과되는 상태이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 조직 배제가 \u003cb class=\"key\">조직 \u003c/b>\u003cb class=\"key\">심리학자들\u003c/b>에게도 주목받지 못하는 \u003cb class=\"key\">간과된 \u003c/b>\u003cb class=\"key\">상태\u003c/b>임을 정의합니다. 글의 첫 문장으로서, 뒤에서 예방 조치가 부재할 수 있다는 논지의 \u003cb class=\"key\">전제\u003c/b>를 깔아 줍니다. ignored는 단순히 모르는 것이 아니라 관심 밖으로 밀려난 상태를 뜻합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 that의 주격 + 수동태\u003c/span> : a state + that + is ignored : \"간과되는 (상태)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 by의 행위자 표시\u003c/span> : by + 행위자(organization psychologists) : \"조직 심리학자들에 의해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Exclusion is a state, 배제는 한 상태이다. that is ignored, 간과되는. by the organization psychologists, 조직 심리학자들에 의해. 이 문장 전체를 해석하면, 배제는 조직 심리학자들에 의해 간과되는 상태이다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 배제가 조직 심리학자들에게 간과된 상태라고 정의합니다. ignored라는 표현은 단순히 모른다는 뜻이 아니라 관심 밖으로 밀려난 상태라는 뉘앙스입니다. 이 정의가 지문의 전제가 되어서, 예방 조치가 없을 수 있다는 다음 문장으로 이어집니다.","hl":"mn"},{"n":14,"text":"첫 번째로 that is ignored를 보면, 주격 관계대명사 that이 선행사 a state를 수식하고 뒤에 be pp가 와서 수동태를 이룹니다. 두 번째로 by the organization psychologists는 수동태에서 행위자를 나타내는 전치사 by입니다. 능동태로 고치면 조직 심리학자들이 배제를 간과한다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능성이 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">possible \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조직 배제에 관한 예방 조치가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> precautions \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">regarding \u003c/span>\u003cspan class=\"tgt\">organizational \u003c/span>\u003cspan class=\"tgt\">exclusion\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">취해지지 않는다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">taken\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서 조직 배제에 관한 예방 조치가 취해지지 않을 가능성이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 결과를 이끌며, 조직 배제에 대한 \u003cb class=\"key\">예방 \u003c/b>\u003cb class=\"key\">조치\u003c/b>가 \u003cb class=\"key\">취해지지 \u003c/b>\u003cb class=\"key\">않을 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>이 있다는 핵심 주장을 제시합니다. it is possible that 구문을 통해 단정 대신 \u003cb class=\"key\">가능성\u003c/b>을 말함으로써 논지의 폭을 조절합니다. 따라서 조직 배제 문제가 방치될 위험이 있음을 경고하는 역할입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 it과 that절 진주어\u003c/span> : It is possible + that S+V : \"~할 가능성이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 regarding\u003c/span> : regarding + 명사(organizational exclusion) : \"조직 배제에 관한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태의 부정\u003c/span> : be not + pp : \"취해지지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Therefore, 따라서. it is possible, 가능성이 있다. that precautions regarding organizational exclusion, 조직 배제에 관한 예방 조치가. are not taken, 취해지지 않는다는. 이 문장 전체를 해석하면, 따라서 조직 배제에 관한 예방 조치가 취해지지 않을 가능성이 있다.","hl":"m"},{"n":16,"text":"이 문장은 따라서라는 접속 부사로 앞 문장을 이어 받으면서, 조직 배제에 관한 예방 조치가 취해지지 않을 가능성이 있다고 말합니다. it is possible that은 단정하지 않고 가능성으로 표현하는 가주어 진주어 구문입니다. 이 때문에 조직 배제가 방치될 위험이 있다는 경고로 읽힙니다.","hl":"mn"},{"n":17,"text":"첫 번째로 it is possible that을 보면, 가주어 it이 문장 앞에 오고 that 이하 절이 진주어 역할을 합니다. that 이하가 가능하다는 뜻을 명사절로 표현한 구조입니다. 두 번째로 regarding organizational exclusion은 전치사 regarding이 조직 배제에 관한이라는 뜻으로 precautions를 수식합니다. 세 번째로 are not taken은 be not plus pp 형태의 수동태 부정입니다. 예방 조치는 스스로 취하는 것이 아니라 취해지는 대상이므로 수동태가 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인들은 조직 배제에 반응한다\u003c/span>\u003cspan class=\"en\">Individuals react to organizational exclusion\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 기본적인 욕구를 강화하려고 노력함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">trying\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">strengthen \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">basic \u003c/span>\u003cspan class=\"tgt\">needs\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것들은 위협받는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">threatened\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">개인들은 위협 받는 그들의 기본적인 욕구를 강화하려고 노력함으로써 조직 배제에 반응한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 조직 배제를 당한 개인이 \u003cb class=\"key\">기본적인 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>가 위협받을 때 이를 \u003cb class=\"key\">강화하려는\u003c/b> 방식으로 반응한다는 내용입니다. by trying to strengthen은 반응의 \u003cb class=\"key\">수단\u003c/b>을 나타내며, which are threatened는 앞의 basic needs를 부연하는 \u003cb class=\"key\">계속적 \u003c/b>\u003cb class=\"key\">용법\u003c/b>입니다. 배제가 욕구를 위협하고, 그 욕구를 되찾으려는 노력이 나타난다는 글의 핵심 기제를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 by + 동명사\u003c/span> : by + trying (동명사) : \"노력함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">try + to부정사 (목적어)\u003c/span> : try [타동사] + to strengthen (to부정사구/목적어) : \"그들의 기본적인 욕구를 강화하려고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 which의 계속적 용법 + 수동태\u003c/span> : , which are threatened (S+V) : \"그리고 그것들은 위협받는다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Individuals react to organizational exclusion, 개인들은 조직 배제에 반응한다. by trying to strengthen their basic needs, 그들의 기본적인 욕구를 강화하려고 노력함으로써. which are threatened, 그리고 그것들은 위협받는다. 이 문장 전체를 해석하면, 개인들은 위협 받는 그들의 기본적인 욕구를 강화하려고 노력함으로써 조직 배제에 반응한다.","hl":"m"},{"n":19,"text":"이 문장은 조직 배제를 당한 개인이 어떤 방식으로 반응하는지 설명합니다. 기본적인 욕구가 위협받을 때, 그것을 강화하려고 노력함으로써 반응한다는 뜻입니다. by trying to strengthen은 반응의 수단이며, which are threatened는 앞의 기본적인 욕구를 계속적 용법으로 부연 설명합니다.","hl":"mn"},{"n":20,"text":"첫 번째로 by trying을 보면, 전치사 by는 수단을 나타내므로 뒤에 동명사 trying이 와서 노력함으로써라는 뜻이 됩니다. 두 번째로 to strengthen their basic needs는 try가 to부정사를 목적어로 취하는 구조입니다. to strengthen 이하 구 전체가 try의 목적어가 됩니다. 세 번째로 which are threatened는 콤마 뒤에 관계대명사 which가 와서 계속적 용법으로 쓰였고, 뒤에 수동태 are threatened가 왔습니다. 그래서 그리고 그것들은 위협받는다 정도의 부연 설명이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긍정적인 사회적 행동은\u003c/span>\u003cspan class=\"en\">Positive social behaviors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발달시킨다\u003c/span>\u003cspan class=\"en\">develop\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소속감과 자기 존중을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">belonging \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">self-respect\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">긍정적인 사회적 행동은 소속감과 자기 존중을 발달시킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 배제가 기본 욕구를 위협한다고 했는데, 이 문장은 긍정적인 사회적 행동이 그중 \u003cb class=\"key\">소속감\u003c/b>과 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">존중\u003c/b>을 키워 준다고 말합니다. 이는 배제에 대응하는 개인의 행동 방향을 제시하는 역할이에요. 따라서 단순한 정의가 아니라, 다음 문장에서 적응 노력이 배제 가능성을 낮춘다는 주장으로 이어지는 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조 (and)\u003c/span> : belonging + and + self-respect : \"소속감과 자기 존중\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Positive social behaviors, 긍정적인 사회적 행동은. develop, 발달시킨다. belonging and self-respect, 소속감과 자기 존중을.. 이 문장 전체를 해석하면, 긍정적인 사회적 행동은 소속감과 자기 존중을 발달시킨다.","hl":"m"},{"n":22,"text":"이 문장은 긍정적인 사회적 행동이 소속감과 자기 존중을 발달시킨다는 내용이에요. 앞 문장에서 배제로 위협받는 기본 욕구를 회복하는 방법으로 긍정적인 행동을 제시하고 있어요. 그래서 다음 문장의 적응 노력과 배제 가능성 감소로 이어지는 근거가 됩니다.","hl":"mn"},{"n":23,"text":"여기서 문법 포인트는 belonging and self-respect예요. and가 belonging과 self-respect를 대등하게 연결하는 병렬 구조인데, 둘 다 develop의 목적어 역할을 해요. 즉 긍정적인 사회적 행동이 발달시키는 두 가지 대상이 소속감과 자기 존중이라는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능성은\u003c/span>\u003cspan class=\"en\">The likelihood\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">individuals \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긍정적인 사회적 행동에 적응하려고 노력하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">adapt \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">positive \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">behaviors \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조직 배제를 경험할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">experience \u003c/span>\u003cspan class=\"tgt\">organizational \u003c/span>\u003cspan class=\"tgt\">exclusion\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낮아진다.\u003c/span>\u003cspan class=\"en\">decreases.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">긍정적인 사회적 행동에 적응하려고 노력하는 개인들이 조직 배제를 경험할 가능성은 낮아진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 긍정적인 사회적 행동을 하려고 노력하는 개인은 \u003cb class=\"key\">조직 \u003c/b>\u003cb class=\"key\">배제\u003c/b>를 경험할 확률이 낮아진다는 핵심 주장입니다. 앞 문장의 긍정적인 행동이 소속감과 자존감을 키운다는 내용을 받아서, 그런 행동에 적응하려는 노력이 배제 예방으로 이어짐을 설명해요. 이 문장의 '가능성이 낮아진다'는 표현은 절대 배제되지 않는다가 아니라 위험이 줄어든다는 점을 \u003cb class=\"key\">확률\u003c/b>로 완화해 표현한 것입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격 that절\u003c/span> : The likelihood + that + [완전한 절] : \"개인들이 조직 배제를 경험할 것이라는 가능성\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사 individuals + who + 동사 : \"긍정적인 사회적 행동에 적응하려고 노력하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(목적어)\u003c/span> : try + to adapt : \"긍정적인 사회적 행동에 적응하려고\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The likelihood, 가능성은. that individuals, 개인들이. who try to adapt to positive social behaviors, 긍정적인 사회적 행동에 적응하려고 노력하는. will experience organizational exclusion, 조직 배제를 경험할. decreases, 낮아진다.. 이 문장 전체를 해석하면, 긍정적인 사회적 행동에 적응하려고 노력하는 개인들이 조직 배제를 경험할 가능성은 낮아진다.","hl":"m"},{"n":25,"text":"이 문장은 긍정적인 사회적 행동에 적응하려고 노력하는 개인들이 조직 배제를 경험할 가능성이 낮아진다는 핵심 주장이에요. 앞 문장의 긍정적인 행동이 소속감과 자기 존중을 발달시킨다는 내용을 받아서, 그런 행동을 하려는 사람은 배제될 위험이 줄어든다고 말하고 있어요. 가능성이 낮아진다는 표현은 배제가 완전히 사라지는 게 아니라 위험이 줄어든다는 뜻을 확률적으로 표현한 거죠.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 The likelihood 다음에 오는 that절이에요. 이 that절은 likelihood의 내용을 구체적으로 설명하는 동격절이고, 절 안에 주어와 동사가 완전하게 갖춰져 있어요. 두 번째는 who try to adapt to positive social behaviors에서 who가 선행사 individuals를 수식하는 주격 관계대명사예요. 세 번째는 try to adapt에서 to adapt가 try의 목적어 역할을 하는 to부정사 명사적 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인들은 더 많은 배제를 직면하게 될 수도 있다\u003c/span>\u003cspan class=\"en\">individuals \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">faced \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">exclusion\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 집단에 적응하지 못할 때.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">cannot \u003c/span>\u003cspan class=\"tgt\">adapt \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">group\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나, 개인들이 집단에 적응하지 못할 때 그들은 더 많은 배제를 직면하게 될 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> However로 앞 문장과 대조되며, 긍정적 행동에 적응하려 해도 \u003cb class=\"key\">집단 \u003c/b>\u003cb class=\"key\">적응\u003c/b>에 실패하면 오히려 배제가 더 커질 수 있다는 예외 상황을 제시해요. 개인의 노력 부족이 아니라 집단에 적응하지 못하는 조건을 when절로 덧붙여, 배제의 위험이 여전히 남아 있음을 보여줍니다. 이는 다음 문장에서 배제가 조직 기여 감소로 이어지는 부정적 흐름의 출발점이 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may + 수동태\u003c/span> : may + be + p.p.(faced) + with : \"더 많은 배제를 직면하게 될 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간·조건 부사절을 이끄는 when\u003c/span> : when + 주어 + 동사 : \"그들이 집단에 적응하지 못할 때\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"However, 그러나. individuals may be faced with more exclusion, 개인들은 더 많은 배제를 직면하게 될 수도 있다. when they cannot adapt to a group, 그들이 집단에 적응하지 못할 때.. 이 문장 전체를 해석하면, 그러나, 개인들이 집단에 적응하지 못할 때 그들은 더 많은 배제를 직면하게 될 수도 있다.","hl":"m"},{"n":28,"text":"이 문장은 앞 문장과 대조되는 상황을 제시해요. 긍정적인 행동에 적응하려 해도, 집단에 적응하지 못하면 오히려 더 많은 배제에 직면할 수 있다는 거예요. However가 앞뒤 논리를 전환해 주고, when절이 조건을 덧붙여서 예외적인 경우를 설명하고 있죠.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 may be faced with more exclusion이에요. be faced with는 직면하다라는 수동태 표현인데 조동사 may가 붙어서 직면하게 될 수도 있다는 가능성을 나타내요. 두 번째는 when they cannot adapt to a group에서 when이 이끄는 부사절이에요. when절이 조건 시점을 나타내면서 뒤에 주어와 동사가 오는 구조죠. cannot adapt는 can not에 동사원형 adapt가 붙은 형태로 집단에 적응하지 못한다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배제된 개인들이\u003c/span>\u003cspan class=\"en\">When \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">excluded \u003c/span>\u003cspan class=\"tgt\">individuals\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의사소통 및 사회 활동과 멀어질 때\u003c/span>\u003cspan class=\"en\">grow away from communication and social activities,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 속한 조직에 대한 그들의 기여도는\u003c/span>\u003cspan class=\"en\">their contribution to \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">organization \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감소할 수도 있다\u003c/span>\u003cspan class=\"en\">may decrease.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">배제된 개인들이 의사소통 및 사회 활동과 멀어질 때, 그들이 속한 조직에 대한 기여도는 감소할 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 배제된 개인이 조직과 점점 멀어지면 \u003cb class=\"key\">조직 \u003c/b>\u003cb class=\"key\">기여도\u003c/b>가 떨어진다는 인과관계를 제시합니다. 앞 문장에서 말한 '적응하지 못할 때 배제가 더 커질 수 있다'는 내용을 구체화하여, 배제가 개인의 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">활동\u003c/b> 위축으로 이어지고 결국 조직 손실로 나타난다는 점을 보여 줍니다. 'grow away from'은 사람과의 관계에서 서서히 \u003cb class=\"key\">멀어지다\u003c/b>라는 뜻으로, 단순한 물리적 거리가 아니라 심리적 유대가 약해지는 것을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : excluded(과거분사) + individuals(명사) : \"배제된 개인들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : 선행사(the organization) + [which/that] + 주어(they) + 동사(are) + 전치사(in) : \"그들이 속한 조직\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"When excluded individuals, 배제된 개인들이. grow away from communication and social activities, 의사소통 및 사회 활동과 멀어질 때. their contribution to the organization they are in, 그들이 속한 조직에 대한 그들의 기여도는. may decrease, 감소할 수도 있다. 이 문장 전체를 해석하면, 배제된 개인들이 의사소통 및 사회 활동과 멀어질 때, 그들이 속한 조직에 대한 기여도는 감소할 수도 있다.","hl":"m"},{"n":31,"text":"이 문장은 배제된 개인이 의사소통과 사회 활동에서 멀어지면 조직 기여도가 감소한다는 인과 관계를 보여 줍니다. 배제로 인해 사회적 활동이 위축되고, 그 결과 조직에 대한 공헌이 줄어들 수 있다는 뜻이에요. grow away from은 사람이나 활동에서 서서히 멀어지는 것을 의미합니다.","hl":"mn"},{"n":32,"text":"첫 번째, excluded는 과거분사로 명사 individuals를 수식하는 형용사적 용법이에요. 배제된 이라는 수동의 의미를 나타내서 excluded individuals는 배제된 개인들이라는 뜻이 됩니다. 두 번째, the organization they are in에는 목적격 관계대명사가 생략되어 있어요. 원래는 the organization which they are in 또는 the organization that they are in인데, 전치사 in의 목적어로 쓰인 관계대명사를 생략한 것입니다. 그래서 그들이 속한 조직으로 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 상황이\u003c/span>\u003cspan class=\"en\">When this situation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">회피되지 않을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">avoided\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배제는 훨씬 더 늘어나고\u003c/span>\u003cspan class=\"en\">exclusion \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">increases \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 직원의 성과에 강하게 영향을 미친다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">strongly \u003c/span>\u003cspan class=\"tgt\">affects\u003c/span> the performance of the employee\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부정적인 방식으로\u003c/span>\u003cspan class=\"en\">in a negative way.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 상황을 피하지 못할 경우, 배제는 훨씬 더 늘어나고 직원 성과에 부정적인 방식으로 강하게 영향을 미친다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 배제가 피해지지 않을 때 나타나는 \u003cb class=\"key\">악순환\u003c/b>과 그 결과를 설명합니다. 배제가 더 심해지고, 그것이 직원의 성과를 부정적으로 강하게 \u003cb class=\"key\">저하\u003c/b>시킨다는 점을 보여줍니다. 앞 문장에서 말한 기여도 감소가 방치되면 배제가 더욱 커지고, 결국 개인의 업무 성과까지 \u003cb class=\"key\">악영향\u003c/b>을 미친다는 흐름입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (be + not + 과거분사)\u003c/span> : this situation + is not + avoided(과거분사) : \"이러한 상황이 회피되지 않을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬 구조\u003c/span> : exclusion + [increases even more] and [strongly affects] : \"배제는 훨씬 더 늘어나고 강하게 영향을 미친다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"When this situation, 이러한 상황이. is not avoided, 회피되지 않을 때. exclusion increases even more, 배제는 훨씬 더 늘어나고. and strongly affects the performance of the employee, 그리고 직원의 성과에 강하게 영향을 미친다. in a negative way, 부정적인 방식으로. 이 문장 전체를 해석하면, 이러한 상황을 피하지 못할 경우, 배제는 훨씬 더 늘어나고 직원 성과에 부정적인 방식으로 강하게 영향을 미친다.","hl":"m"},{"n":34,"text":"이 문장은 배제가 피해지지 않으면 배제가 더욱 커지고 직원 성과에 부정적인 영향을 강하게 미친다는 악순환을 설명해요. 앞 문장에서 말한 기여도 감소를 그대로 두면 배제가 더 심해지고, 결국 업무 성과까지 저하된다는 거죠. 결국 배제가 개인의 성과에 악영향을 준다는 핵심 흐름을 보여 줍니다.","hl":"mn"},{"n":35,"text":"첫 번째, is not avoided는 수동태예요. 주어 this situation이 avoid의 대상이므로 피해지다로 해석합니다. not이 be동사 뒤에 와서 이러한 상황이 피해지지 않을 때라는 뜻이 됩니다. 두 번째, increases even more and strongly affects는 and에 의해 병렬로 연결된 구조예요. 주어 exclusion이 두 동작을 연속해서 받으면서 배제는 더 늘어나고 강하게 영향을 미친다라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예방 조치는\u003c/span>\u003cspan class=\"en\">Precautions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">취해져야 할 필요가 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">taken\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조직 배제에 관하여\u003c/span>\u003cspan class=\"en\">regarding organizational exclusion,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 업무에서 매우 중요하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">business\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">조직 배제에 관한 예방 조치는 취해져야 할 필요가 있는데, 이는 업무에서 매우 중요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 결론으로, 조직 배제에 대한 \u003cb class=\"key\">예방 \u003c/b>\u003cb class=\"key\">조치\u003c/b>가 업무에서 \u003cb class=\"key\">매우 \u003c/b>\u003cb class=\"key\">중요\u003c/b>하므로 반드시 필요하다는 주장을 합니다. 앞 문장까지 설명한 배제의 부정적 영향과 악순환을 끊기 위해서는 사전 대책이 필수적이라는 점을 강조합니다. 'which'는 앞의 조직 배제 예방 조치를 가리키며, 기업 경영에서 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">과제\u003c/b>임을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 수동태 (to be + 과거분사)\u003c/span> : need + to be taken(과거분사) : \"취해져야 할 필요가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">계속적 용법의 관계대명사 which\u003c/span> : 선행사(organizational exclusion) + , which + be동사 + 보어 : \"이는 업무에서 매우 중요하다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Precautions, 예방 조치는. need to be taken, 취해져야 할 필요가 있다. regarding organizational exclusion, 조직 배제에 관하여. which is very important for business, 이는 업무에서 매우 중요하다. 이 문장 전체를 해석하면, 조직 배제에 관한 예방 조치는 취해져야 할 필요가 있는데, 이는 업무에서 매우 중요하다.","hl":"m"},{"n":37,"text":"이 문장은 글 전체의 결론으로 조직 배제에 대한 예방 조치가 업무에서 매우 중요하므로 반드시 필요하다고 강조합니다. 앞에서 본 배제의 부정적 영향과 악순환을 막으려면 사전에 대책을 세워야 한다는 거죠. which는 조직 배제 예방 조치를 가리키면서 기업에서 핵심 과제임을 보여 줍니다.","hl":"mn"},{"n":38,"text":"첫 번째, need to be taken은 to부정사의 수동태예요. 예방 조치가 취해지는 대상이므로 능동이 아니라 수동태로 씁니다. 그래서 취해져야 할 필요가 있다로 해석합니다. 두 번째, which is very important for business는 계속적 용법의 관계대명사 which예요. 앞에 콤마가 있고 앞의 조직 배제 예방 조치 전체를 받으면서 업무에서 매우 중요하다고 부연 설명합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>조직 배제는 조직 심리학자들이 \u003cb class=\"key\">간과\u003c/b>하는 상태이므로 \u003cb class=\"key\">예방 \u003c/b>\u003cb class=\"key\">조치\u003c/b>가 취해지지 않을 수 있다.\u003c/li>\u003cli>개인은 \u003cb class=\"key\">기본적인 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>가 위협받으면 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>에 적응하여 \u003cb class=\"key\">소속감\u003c/b>과 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">존중\u003c/b>을 얻으려 한다.\u003c/li>\u003cli>그러나 집단에 \u003cb class=\"key\">적응하지 \u003c/b>\u003cb class=\"key\">못하면\u003c/b> 더 많은 \u003cb class=\"key\">배제\u003c/b>를 경험하고 \u003cb class=\"key\">의사소통\u003c/b>과 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">활동\u003c/b>에서 멀어져 \u003cb class=\"key\">기여도\u003c/b>가 감소한다.\u003c/li>\u003cli>결국 \u003cb class=\"key\">배제\u003c/b>가 심화되어 \u003cb class=\"key\">직원 \u003c/b>\u003cb class=\"key\">성과\u003c/b>에 부정적 영향을 미치므로 업무에서 중요한 \u003cb class=\"key\">예방 \u003c/b>\u003cb class=\"key\">조치\u003c/b>가 필요하다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Organizations must take precautions against exclusion because it threatens employees' basic needs, reduces their contribution, and harms performance.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">조직 내 \u003cb class=\"key\">배제\u003c/b>는 심리학자들에게 \u003cb class=\"key\">간과\u003c/b>되어 \u003cb class=\"key\">예방 \u003c/b>\u003cb class=\"key\">조치\u003c/b>가 부족하며, 개인의 \u003cb class=\"key\">기본적인 \u003c/b>\u003cb class=\"key\">욕구\u003c/b>가 위협받고 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>에 적응하지 못하면 \u003cb class=\"key\">배제\u003c/b>가 심화되어 \u003cb class=\"key\">직원 \u003c/b>\u003cb class=\"key\">성과\u003c/b>에 부정적 영향을 미치므로 \u003cb class=\"key\">예방 \u003c/b>\u003cb class=\"key\">조치\u003c/b>가 필요하다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 정리하면 조직 배제는 기본적인 욕구를 위협하고, 긍정적인 사회적 행동에 적응하지 못하면 점점 더 심해져서 직원 성과를 떨어뜨립니다. 따라서 조직 차원의 예방 조치가 반드시 필요하다는 것이 이 지문의 핵심입니다. 이 구조를 떠올리며 관련 어휘와 동의어 반의어를 복습해 두세요. 오늘 수고 많았습니다.","hl":null}]}]});</script></body></html>
