>당장 먹이가 많은 흰 가문비나무 대신 붉은 가문비나무(red spruce trees)를 선택</li><li>초여름 시기에 우선적으로 영토(territories)를 확립함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04미래를 대비한 육아 환경 확보</div><ul><li>솔새가 당장의 먹이가 적은 곳을 선택한 이유는 훗날 새끼를 먹일 때 더 유리하기 때문이다.</li><li>새끼 새에게 영양(nourishment)이 필요한 시기에 더 쉽게 먹이를 구할 수 있음</li><li>현재보다 미래의 육아 필요(future parenting needs)에 적합한 장소에 정착함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surroundings</td><td class=\"m\">환경, 주변, 주위 상황</td></tr><tr><td class=\"w\">forage</td><td class=\"m\">먹이를 찾다, 수렵 채집하다</td></tr><tr><td class=\"w\">predator</td><td class=\"m\">포식자, 약탈자</td></tr><tr><td class=\"w\">availability</td><td class=\"m\">이용 가능성, 유용성</td></tr><tr><td class=\"w\">determinant</td><td class=\"m\">결정 요인, 결정 요소</td></tr><tr><td class=\"w\">reproductive</td><td class=\"m\">생식의, 번식의</td></tr><tr><td class=\"w\">offspring</td><td class=\"m\">자식, 새끼, 자손</td></tr><tr><td class=\"w\">remarkable</td><td class=\"m\">놀라운, 주목할 만한</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">seek out</td><td class=\"m\">~을 찾아내다, ~을 추구하다</td></tr><tr><td class=\"w\">necessity</td><td class=\"m\">필수품, 필요성</td></tr><tr><td class=\"w\">anticipate</td><td class=\"m\">예상하다, 예측하다</td></tr><tr><td class=\"w\">territory</td><td class=\"m\">영역, 영토</td></tr><tr><td class=\"w\">preferentially</td><td class=\"m\">우선적으로, 특혜를 주어</td></tr><tr><td class=\"w\">nourishment</td><td class=\"m\">영양분, 자양분</td></tr><tr><td class=\"w\">settle in</td><td class=\"m\">~에 자리 잡다, 정착하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">일련의 환경을 선택하는 능력은</span><span class=\"en\"><b>The ability <span class=\"grammar-hl\">to select</span> a set of surroundings</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">먹이 찾아다니기, 천적으로부터의 은신처, 그리고 짝을 만날 가능성에 적합한</span><span class=\"en\"><b>suitable for <span class=\"grammar-hl\">foraging</span>, shelter from predators, and the availability of mates</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">생물학적 성공의 가장 중요한 결정 요소 중 하나이다</span><span class=\"en\"><b>is one of the most important determinants of biological success</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">― 번식 연령까지의 생존과 새끼를 낳는 것으로 측정되는</span><span class=\"en\"><b>― <span class=\"grammar-hl\">measured</span> as survival to reproductive age and the production of offspring.</b></span></div></div><div class=\"lec-sent-ko\">먹이 찾아다니기, 천적으로부터의 은신처 그리고 짝을 만날 가능성에 적합한 일련의 환경을 선택하는 능력은 번식 연령까지의 생존과 새끼를 낳는 것으로 측정되는 생물학적 성공의 가장 중요한 결정 요소 중 하나이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심 주제를 제시하며 시작합니다. 동물이 먹이를 구하고 천적을 피하며 짝을 찾기 좋은 장소를 고르는 능력이 생존과 번식이라는 궁극적인 목표를 달성하는 데 가장 중요한 요소임을 설명합니다. 학술 글에서 biological success는 동물이 죽지 않고 살아남아 자신의 새끼를 무사히 낳아 기르는 전체 과정을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">to select (to부정사): 형용사적 용법으로 쓰여 앞의 명사 The ability를 수식하는 구조이다(= 선택하는 능력).</div><div class=\"lec-gr-item\">foraging (동명사): 전치사 for의 목적어 역할을 하는 명사적 개념으로 쓰였다(= 먹이 찾기/먹이 활동).</div><div class=\"lec-gr-item\">measured (과거분사(형용사)): measured가 앞의 명사구 biological success를 부연하여 수식하는 구조(= 생존과 생산으로 측정되는 생물학적 성공)이다. N + p.p. 형태의 축약 구조로 뒤에서 앞의 명사를 수식한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surroundings</td><td class=\"m\">환경, 주변, 주위 상황</td></tr><tr><td class=\"w\">predator</td><td class=\"m\">포식자, 약탈자</td></tr><tr><td class=\"w\">availability</td><td class=\"m\">이용 가능성, 유용성</td></tr><tr><td class=\"w\">determinant</td><td class=\"m\">결정 요인, 결정 요소</td></tr><tr><td class=\"w\">reproductive</td><td class=\"m\">생식의, 번식의</td></tr><tr><td class=\"w\">offspring</td><td class=\"m\">자식, 새끼, 자손</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">많은 연구는 보여 주어 왔다</span><span class=\"en\"><b>Many studies have shown</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">동물이 놀라운 능력을 갖추고 있을 뿐만 아니라</span><span class=\"en\"><b>that <span class=\"grammar-hl\">not only do animals have</span> a remarkable ability</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이용 가능한 최적의 장소를 찾아내는</span><span class=\"en\"><b><span class=\"grammar-hl\">to seek out</span> the best available locations</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">삶의 필수 요소들을 위해</span><span class=\"en\"><b>for the necessities of life,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그들이 예측할 수 있다는 것을</span><span class=\"en\"><b>but that they are able to anticipate</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">환경이 자신들의 미래의 필요를 어떻게 충족시킬지</span><span class=\"en\"><b><span class=\"grammar-hl\">how a setting will serve their future needs</span>.</b></span></div></div><div class=\"lec-sent-ko\">많은 연구는 동물이 삶의 필수 요소들을 찾기 위해 이용 가능한 최적의 장소를 찾아내는 놀라운 능력을 갖추고 있을 뿐만 아니라, 환경이 자신들의 미래의 필요를 어떻게 충족시킬지 예측할 수 있다는 것을 보여 주어 왔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 언급한 동물의 장소 선택 능력을 더욱 확장하여 설명합니다. 동물들은 현재 당장 필요한 것을 찾는 것은 물론이고, 나아가 serve their future needs가 의미하듯 앞으로 다가올 상황에서 그 장소가 자신에게 얼마나 유용할지 미리 내다보고 서식지를 선택하는 능력이 있음을 강조합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">not only do animals have (도치): 부정어구(not only)가 문장 맨 앞으로 나오면서 &#39;조동사(do) + 주어(animals) + 일반동사 원형(have)&#39;의 형태로 주어와 동사가 도치된 구조이다.</div><div class=\"lec-gr-item\">to seek out (to부정사): 형용사적 용법으로 쓰여 앞의 명사 a remarkable ability를 수식하는 구조이다(= 찾아내는 놀라운 능력).</div><div class=\"lec-gr-item\">how a setting will serve their future needs (간접의문문): &#39;의문사(how) + 주어(a setting) + 동사(will serve)&#39;의 평서문 어순으로 이루어진 명사절로, 동사 anticipate의 목적어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">remarkable</td><td class=\"m\">놀라운, 주목할 만한</td></tr><tr><td class=\"w\">seek out</td><td class=\"m\">~을 찾아내다, ~을 추구하다</td></tr><tr><td class=\"w\">anticipate</td><td class=\"m\">예상하다, 예측하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">예를 들어</span><span class=\"en\"><b>For example,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">검은가슴푸른솔새는</span><span class=\"en\"><b>the black-throated green warbler,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">북미 동부의 가문비나무 숲에 둥지를 트는 작은 명금류인</span><span class=\"en\"><b>a small songbird <span class=\"grammar-hl\">that nests</span> in spruce forests of eastern North America,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우선적으로 활동 영역을 형성한다</span><span class=\"en\"><b>establishes territories preferentially</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">붉은 가문비나무들 사이에</span><span class=\"en\"><b>among the red spruce trees</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이른 여름 몇 달 동안에</span><span class=\"en\"><b>early in the summer months,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이 나무들이 먹이를 적게 제공함에도</span><span class=\"en\"><b>even though these trees offer less food</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">인접한 흰 가문비나무보다</span><span class=\"en\"><b>than the neighboring white spruce trees.</b></span></div></div><div class=\"lec-sent-ko\">예를 들어, 북미 동부의 가문비나무 숲에 둥지를 트는 작은 명금류인 검은가슴푸른솔새는 붉은 가문비나무들이 인접한 흰 가문비나무보다 먹이를 적게 제공함에도, 이른 여름 몇 달 동안에 우선적으로 붉은 가문비나무 사이에 활동 영역을 형성한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞서 설명한 &#39;미래를 예측하는 장소 선택&#39;에 대한 구체적인 예시로 검은목푸른솔새의 행동을 제시합니다. 이 새가 당장 먹이가 더 풍부한 흰가문비나무 숲을 놔두고 굳이 먹이가 부족한 붉은가문비나무 숲을 고르는 겉보기엔 비합리적인 행동을 보여 주며 독자의 궁금증을 유발합니다. establishes territories preferentially는 다른 서식지 후보들보다 그곳을 가장 먼저 자신의 구역으로 찜해 둔다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">that nests (관계대명사): 주격 관계대명사 that이 이끄는 절이 앞의 선행사 a small songbird를 수식한다. 절 내부에서 that이 주어 역할을 하며 동사 nests로 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">preferentially</td><td class=\"m\">우선적으로, 특혜를 주어</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러나 나중에</span><span class=\"en\"><b>Later, though,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">둥지가 지어지고 배고픈 어린 새들이 먹이가 필요할 때</span><span class=\"en\"><b>when nests <span class=\"grammar-hl\">are built</span> and hungry baby birds need nourishment,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">바로 붉은 가문비나무 숲이다</span><span class=\"en\"><b><span class=\"grammar-hl\">it is the red spruce forest</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 쉽게 채집물을 제공하는 곳은</span><span class=\"en\"><b><span class=\"grammar-hl\">that offers</span> the easier pickings.</b></span></div></div><div class=\"lec-sent-ko\">그러나 나중에 둥지가 지어지고 배고픈 어린 새들이 먹이가 필요할 때, 더 쉽게 채집물을 제공하는 곳은 바로 붉은 가문비나무 숲이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에서 생긴 궁금증을 완벽히 해결해 주는 문장입니다. 시간이 흘러 새끼가 태어나고 본격적으로 먹이가 많이 필요해지는 미래의 시점에는 붉은가문비나무 숲이 먹이를 구하기 훨씬 수월한 장소로 탈바꿈한다는 사실을 알려 줍니다. 글쓴이는 여기서 the easier pickings라는 표현을 써서, 부모 새가 둥지 주변에서 새끼에게 줄 먹이를 힘들이지 않고 쏙쏙 골라 잡을 수 있는 풍요로운 상태를 생생하게 묘사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">are built (수동태): be동사(are)+p.p.(built) 구조. build는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are built 형태로 쓴다. 기본구조: build + O(목적어)</div><div class=\"lec-gr-item\">it is the red spruce forest that offers (강조구문): &#39;It is ~ that&#39; 구조를 사용하여 문장의 주어인 the red spruce forest를 강조하는 형태이다. that 뒤에는 강조된 주어가 빠진 불완전한 절이 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nourishment</td><td class=\"m\">영양분, 자양분</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 5</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">어떻게든</span><span class=\"en\"><b>Somehow,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그 솔새는 자리를 잡도록 유도되었다</span><span class=\"en\"><b>the warbler <span class=\"grammar-hl\">has been guided to settle</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">장소에</span><span class=\"en\"><b>in locations</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미래의 양육 필요에 더 적합할</span><span class=\"en\"><b><span class=\"grammar-hl\">that will suit</span> its future parenting needs better</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">현재의 필요보다</span><span class=\"en\"><b>than its present ones.</b></span></div></div><div class=\"lec-sent-ko\">어떻게든, 그 솔새는 현재의 필요보다 미래의 양육 필요에 더 적합할 장소에 자리를 잡도록 유도되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 예시를 마무리하며 글 전체의 주제를 다시 한번 짚어 주는 결론 문장입니다. 솔새가 처음에 먹이가 적은 곳을 택했던 이유가 결국 자신이 당장 배를 채우는 것보다 훗날 새끼를 먹여 살려야 하는 중대한 과제를 위해 본능적으로 미래지향적인 선택을 한 것임을 보여 줍니다. has been guided to settle in locations를 통해 동물이 오랜 진화 과정에서 철저히 미래의 양육에 유리한 방향으로 자연스럽게 행동하도록 프로그래밍되어 생존을 이어왔음을 시사합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">has been guided to settle (수동태): be동사(been)+p.p.(guided)가 포함된 현재완료 수동태 구조. guide는 타동사로 기본구조 &#39;guide + O(목적어) + toV&#39; (5형식) 구조인데, 목적어가 주어로 올라가 수동구조 has been guided가 되고, 뒤의 보어/부정사(to settle)는 구조가 그대로 남는다.</div><div class=\"lec-gr-item\">that will suit (관계대명사): 주격 관계대명사 that이 이끄는 절이 앞의 선행사 locations를 수식한다. 절 내부에서 that이 주어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">settle in</td><td class=\"m\">~에 자리 잡다, 정착하다</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>동물의 생존과 번식에는 자신에게 꼭 맞는 환경을 찾아 선택하는 능력이 매우 중요하다.</li><li>동물은 단순히 현재의 필요를 채우는 수준을 넘어, 미래의 필요까지 미리 예측하여 장소를 고른다.</li><li>그 예로, 검은목푸른솔새는 당장 먹이가 많은 곳을 포기하고 나중에 새끼에게 먹이를 주기 쉬운 숲을 서식지로 선택한다.</li><li>즉, 동물은 본능적으로 현재 자신의 이익보다 미래의 성공적인 양육과 번식에 유리한 환경을 최우선으로 삼아 정착한다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Animals possess the ability to seek out optimal locations for their immediate survival, and they also anticipate how these environments will satisfy their future reproductive needs.</div>\n              <div class=\"lec-final-sum-ko\">동물들은 당장의 생존을 위한 최적의 장소를 찾는 능력을 지니고 있으며, 나아가 이러한 환경이 미래의 번식 요건을 어떻게 충족시킬지까지 예측한다.</div></div></div>"],"segs":[[{"audio":"./36_audio/1.mp3","hl":null}],[{"audio":"./36_audio/2.mp3","hl":null}],[{"audio":"./36_audio/3.mp3","hl":null},{"audio":"./36_audio/4.mp3","hl":"stage-0"},{"audio":"./36_audio/5.mp3","hl":"stage-1"},{"audio":"./36_audio/6.mp3","hl":"stage-2"},{"audio":"./36_audio/7.mp3","hl":"stage-3"}],[{"audio":"./36_audio/8.mp3","hl":null}],[{"audio":"./36_audio/9.mp3","hl":"main"},{"audio":"./36_audio/10.mp3","hl":"meaning"},{"audio":"./36_audio/11.mp3","hl":"grammar"}],[{"audio":"./36_audio/12.mp3","hl":"main"},{"audio":"./36_audio/13.mp3","hl":"meaning"},{"audio":"./36_audio/14.mp3","hl":"grammar"}],[{"audio":"./36_audio/15.
