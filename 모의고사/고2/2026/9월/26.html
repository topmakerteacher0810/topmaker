7r7wvv9339n/kIPwxjt/Q/wD1qD9M/wCf89ePcUo/AY5PK475PBI654JoPGeQPxX9Oef88cjJbW9te633Wnn5i8r/AOen3+V+9/MMDOe9Jz2455zzxnnHp/npTiMDJK4/3h3+h/8A1d/SmbhnH1/MY4Hr1/zmmv6/4JVndqzuuln5f5perSHf1oPTqfy+vpz6dMH+qY79iMjj9f8APvnPACkHBI7DP0H49j1wOo+YetK68um2u+23fQWujTaV07peV1utN09FfQ//2Q==\" alt=\"\"></div>","<div class=\"lec-cover-title\">Frederick Law Olmsted: The Father of American Landscape Architecture<small>프레더릭 로 옴스테드: 미국 조경 건축의 아버지</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 더 깊이 이해하기 위해서는 먼저 조경(Landscape architecture)이라는 개념을 알아두시면 좋은데, 이는 마치 텅 빈 거실에 알맞은 가구와 화분을 배치하는 인테리어처럼 우리가 살아가는 도시라는 거대한 공간을 자연 친화적이고 쓸모있게 디자인하는 전문 분야입니다. 지문에 등장하는 센트럴 파크(Central Park)와 이를 설계한 그린스워드 플랜(Greensward Plan)은 삭막한 콘크리트 빌딩 숲이었던 뉴욕 한복판에 시민들이 숨 쉴 수 있는 &#39;거대한 허파&#39;를 만들어낸 역사적인 공원 조성 프로젝트를 의미해요. 또한 그가 남북전쟁 중 사무총장으로 일했던 미국 위생위원회(United States Sanitary Commission)는 오늘날의 적십자처럼 부상병들의 구호와 공중보건을 담당하던 조직으로, 그가 단순히 나무와 숲을 가꾸는 것을 넘어 사람들의 건강과 삶의 질을 치유하는 데 깊은 철학을 가졌음을 보여주는 중요한 배경이 됩니다. 훗날 미국 정부가 그의 공간을 국립 사적지(National Historic Site)로 지정한 것도, 마치 우리가 역사적인 위인의 생가를 보존하여 뜻을 기리듯 삭막한 현대 도시인들에게 자연이라는 최고의 휴식처를 선물한 그의 위대한 유산을 영원히 기억하기 위함이랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01탄생과 유년기 배경</div><ul><li>미국 조경 건축의 아버지로 불리는 옴스테드의 탄생과 어린 시절을 소개한다.</li><li>1822년 출생하여 미국 조경 건축의 아버지(father of American landscape architecture)로 알려짐</li><li>아버지와 함께 시골(countryside)로 자주 여행을 다니며 자연을 접함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02시련과 새로운 경험</div><ul><li>대학 진학의 좌절과 이를 대체한 다양한 직업 경험을 설명한다.</li><li>심한 옻나무 중독(sumac poisoning)으로 인한 시력 손상으로 예일대 입학 좌절</li><li>대학 진학 대신 점원(clerk), 선원(sailor), 농부(farmer)로 일하며 실무 경험을 쌓음</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03주요 업적과 공직 활동</div><ul><li>센트럴 파크 설계 우승과 남북전쟁 당시의 두드러진 활동을 제시한다.</li><li>1858년 뉴욕 센트럴 파크 설계 공모전(design competition)에서 우승함</li><li>남북전쟁(Civil War) 당시 미국 위생 위원회의 총장으로 복무함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04후대의 계승과 유산</div><ul><li>그의 죽음 이후에도 계속된 디자인 철학의 계승과 역사적 기념을 다룬다.</li><li>1903년 타계 후에도 아들과 후계자들이 그의 디자인 철학(design philosophy)을 이어나감</li><li>1979년 그의 유산(legacy)을 기리기 위해 자택 등이 국립 사적지(National Historic Site)로 지정됨</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">known as</td><td class=\"m\">~로 알려진, ~라고 불리는</td></tr><tr><td class=\"w\">landscape architecture</td><td class=\"m\">조경, 조경학</td></tr><tr><td class=\"w\">go on</td><td class=\"m\">(여행 등을) 가다, 떠나다, 시작하다</td></tr><tr><td class=\"w\">scenery</td><td class=\"m\">경치, 풍경</td></tr><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~에 기인하는</td></tr><tr><td class=\"w\">severe</td><td class=\"m\">극심한, 심각한, 엄격한</td></tr><tr><td class=\"w\">damage</td><td class=\"m\">손상시키다, 피해를 입히다</td></tr><tr><td class=\"w\">eyesight</td><td class=\"m\">시력, 시각</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">instead of</td><td class=\"m\">~대신에</td></tr><tr><td class=\"w\">serve as</td><td class=\"m\">~의 역할을 하다, ~로 복무하다</td></tr><tr><td class=\"w\">pass away</td><td class=\"m\">사망하다, 돌아가시다</td></tr><tr><td class=\"w\">successor</td><td class=\"m\">후계자, 계승자</td></tr><tr><td class=\"w\">philosophy</td><td class=\"m\">철학, 신조, 원칙</td></tr><tr><td class=\"w\">designate</td><td class=\"m\">지정하다, 지명하다</td></tr><tr><td class=\"w\">honor</td><td class=\"m\">기리다, 예우하다, 존경하다</td></tr><tr><td class=\"w\">legacy</td><td class=\"m\">유산, 업적</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Frederick Law Olmsted는,</span><span class=\"en\"><b>Frederick Law Olmsted,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국 조경 건축의 아버지로 알려진,</span><span class=\"en\"><b><span class=\"grammar-hl\">known</span> as the father of American landscape architecture,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">태어났다</span><span class=\"en\"><b><span class=\"grammar-hl\">was born</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1822년에</span><span class=\"en\"><b>in 1822.</b></span></div></div><div class=\"lec-sent-ko\">미국 조경 건축의 아버지로 알려진 Frederick Law Olmsted는 1822년에 태어났다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인물의 소개를 시작하는 첫 문장입니다. known as the father of American landscape architecture는 Olmsted가 단순히 조경 일을 한 것을 넘어 미국 조경 분야를 체계적으로 개척하고 확립한 선구자로 평가받고 있다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">known (과거분사(형용사)): known이 Frederick Law Olmsted를 수식하는 구조이다. 기본틀은 &#39;N + p.p.&#39;로 &#39;p.p.된 N&#39;(= N that is/was p.p.)의 의미를 지니는 축약 관계절의 형태를 띤다.</div><div class=\"lec-gr-item\">was born (수동태): be동사(was) + p.p.(born) 구조. bear(낳다)는 타동사(목적어를 취하는 동사)로 기본구조가 &#39;bear + O(목적어)&#39;인데, 뒤에 목적어가 없어서 수동구조 was born 형태로 쓴다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">known as</td><td class=\"m\">~로 알려진, ~라고 불리는</td></tr><tr><td class=\"w\">landscape architecture</td><td class=\"m\">조경, 조경학</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Olmsted가 어렸을 때,</span><span class=\"en\"><b>When Olmsted was young,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 자주 여행을 다녔다</span><span class=\"en\"><b>he often <span class=\"grammar-hl\">went on trips</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">시골로</span><span class=\"en\"><b>to the countryside</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 아버지와,</span><span class=\"en\"><b>with his father<span class=\"grammar-hl\">,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">경치를 사랑했던</span><span class=\"en\"><b><span class=\"grammar-hl\">who</span> loved scenery.</b></span></div></div><div class=\"lec-sent-ko\">Olmsted가 어렸을 때, 그는 경치를 사랑했던 그의 아버지와 자주 시골로 여행을 다녔다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장에 이어 그가 조경에 관심을 두게 된 유년 시절의 배경을 설명합니다. went on trips to the countryside는 아버지의 영향을 받아 어릴 적부터 자연경관을 깊이 접하며 훗날 조경가로서 필요한 감수성과 안목을 기르기 시작했음을 보여 줍니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">went on trips (관용표현): go on a trip / go on trips (여행을 가다)라는 의미를 지닌다.</div><div class=\"lec-gr-item\">, who (관계대명사): 주격 관계대명사 who가 계속적 용법으로 쓰여 선행사 his father를 부연 설명한다. 관계사절 내부에서 주어 역할을 하므로 뒤에 바로 동사(loved)가 이어진다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">scenery</td><td class=\"m\">경치, 풍경</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">14세에,</span><span class=\"en\"><b>At age 14,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 스스로 준비하고 있었다</span><span class=\"en\"><b>he was <span class=\"grammar-hl\">preparing himself</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">공부하기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to study</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Yale College에서,</span><span class=\"en\"><b>at Yale College,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">하지만 그는 입학할 수 없었다</span><span class=\"en\"><b>but he could not enter</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">심각한 옻나무 중독 때문에</span><span class=\"en\"><b>due to a severe sumac poisoning</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 시력에 손상을 준</span><span class=\"en\"><b><span class=\"grammar-hl\">that</span> damaged his eyesight.</b></span></div></div><div class=\"lec-sent-ko\">14세에 그는 Yale College에서 공부하기 위해 준비하고 있었지만, 그의 시력에 손상을 준 심각한 옻나무 중독 때문에 입학할 수 없었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그의 삶에 닥친 첫 번째 큰 좌절을 나타냅니다. preparing himself to study at Yale College는 당초 엘리트 학업 과정을 밟으려 했음을 보여 주며, 예기치 않은 질병 탓에 원래 계획했던 정규 교육의 길을 포기해야만 했음을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">preparing himself to study 5형식(SVOC) 구조: prepare + O(목적어) + to V(목적격 보어) 구조이다. 목적어(himself)가 스스로 보어(to study)하도록 준비시킨다는 의미를 나타낸다.</div><div class=\"lec-gr-item\">to study (to부정사): 5형식 동사 prepare의 목적격 보어 역할을 하는 명사적 쓰임이다.</div><div class=\"lec-gr-item\">that (관계대명사): 주격 관계대명사 that이 선행사 a severe sumac poisoning을 수식한다. that절 내부에서 주어 역할을 하므로 바로 동사(damaged)가 이어져 절을 구성한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">due to</td><td class=\"m\">~때문에, ~에 기인하는</td></tr><tr><td class=\"w\">severe</td><td class=\"m\">극심한, 심각한, 엄격한</td></tr><tr><td class=\"w\">damage</td><td class=\"m\">손상시키다, 피해를 입히다</td></tr><tr><td class=\"w\">eyesight</td><td class=\"m\">시력, 시각</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">대학에 다니는 대신에,</span><span class=\"en\"><b>Instead of <span class=\"grammar-hl\">attending</span> a college,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 경험을 쌓았다</span><span class=\"en\"><b>he gained experience</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점원, 선원, 그리고 농부로 일하며</span><span class=\"en\"><b><span class=\"grammar-hl\">working</span> as a clerk, a sailor, and a farmer.</b></span></div></div><div class=\"lec-sent-ko\">대학에 다니는 대신에, 그는 점원, 선원, 그리고 농부로 일하며 경험을 쌓았다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 좌절 이후 진로가 어떻게 바뀌었는지 보여 줍니다. gained experience working은 책상에 앉아 정규 교육을 받는 대신 여러 직업 현장에서 부딪치며 세상에 대한 식견을 넓히고 조경에 필요한 실물 감각과 자양분을 얻었음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">attending (동명사): 전치사 of의 목적어 역할을 하는 명사적 기능의 -ing 형태이다.</div><div class=\"lec-gr-item\">working (분사구문): working이 부사적 기능(동시동작/연속상황)으로 쓰였다. 원래 절로 변환하면 while + he + worked ... 또는 as + he + worked ... 의 형태가 된다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">instead of</td><td class=\"m\">~대신에</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1858년에,</span><span class=\"en\"><b>In 1858,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그는 일했고</span><span class=\"en\"><b>he <span class=\"grammar-hl\">worked</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Calvert Vaux와 함께</span><span class=\"en\"><b><span class=\"grammar-hl\">with Calvert Vaux</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">설계 공모전에서 당선되었다</span><span class=\"en\"><b><span class=\"grammar-hl\">and won</span> the design competition</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">뉴욕시의 Central Park</span><span class=\"en\"><b>for New York City's Central Park</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">‘Greensward Plan’으로</span><span class=\"en\"><b>with the \"Greensward Plan.\"</b></span></div></div><div class=\"lec-sent-ko\">1858년에 그는 Calvert Vaux와 함께 일하며, ‘Greensward Plan’으로 뉴욕시의 Central Park 설계 공모전에서 당선되었다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 다양한 현장 경험을 쌓은 후 조경가로서 거둔 첫 번째 큰 성공을 제시합니다. won the design competition은 정식 대학 교육을 받지 않았음에도 그가 쌓은 실무 감각을 바탕으로 당대 최고의 공원 설계 프로젝트를 따내며 그 실력을 공식적으로 인정받게 되었음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">worked with Calvert Vaux and won (병렬구조): 등위접속사 and를 중심으로 두 개의 과거형 동사 worked와 won이 주어 he에 연결되어 병렬구조를 이룬다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">Civil War 기간 동안,</span><span class=\"en\"><b>During the Civil War,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Olmsted는 General Secretary로 일했다</span><span class=\"en\"><b>Olmsted <span class=\"grammar-hl\">served as</span> General Secretary</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">미국 Sanitary Commission의</span><span class=\"en\"><b>of the United States Sanitary Commission.</b></span></div></div><div class=\"lec-sent-ko\">Civil War 기간 동안, Olmsted는 미국 Sanitary Commission의 General Secretary로 일했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 센트럴 파크 성공 이후 전시 상황에서의 새로운 행보를 덧붙여 줍니다. served as General Secretary는 그가 조경 설계에만 머물지 않고 국가적 위기 상황에서 공중 보건과 행정 분야를 총괄하며 사회 전반에 헌신했음을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">served as (관용표현): serve as (~로서 역할을 하다, ~로 복무하다) 구조로 쓰여 직책이나 임무를 나타낸다.</div></div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">비록 그는 사망했지만</span><span class=\"en\"><b>Although he <span class=\"grammar-hl\">passed away</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">1903년에,</span><span class=\"en\"><b>in 1903,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 아들들과 후계자들이</span><span class=\"en\"><b>his sons and successors</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 디자인 철학을 계승했다</span><span class=\"en\"><b>continued his design philosophy.</b></span></div></div><div class=\"lec-sent-ko\">비록 그는 1903년에 사망했지만, 그의 아들들과 후계자들이 그의 디자인 철학을 계승했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 인물의 생애가 끝난 후에도 그가 남긴 영향력이 계속되었음을 설명합니다. continued his design philosophy는 그가 확립한 미국 자연주의 조경의 기본 원칙이 후대에까지 널리 전승되어 오늘날 미국 경관의 근간으로 자리 잡았음을 의미합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">passed away (관용표현): pass away (사망하다, 돌아가시다)라는 의미의 숙어 표현이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">successor</td><td class=\"m\">후계자, 계승자</td></tr><tr><td class=\"w\">philosophy</td><td class=\"m\">철학, 신조, 원칙</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">1979년,</span><span class=\"en\"><b>In 1979,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">National Park Service는 지정했다</span><span class=\"en\"><b>the National Park Service <span class=\"grammar-hl\">designated</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">Massachusetts주 Brookline에 있는 그의 집과 사무실을</span><span class=\"en\"><b><span class=\"grammar-hl\">his home and office in Brookline, Massachusetts,</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">National Historic Site로</span><span class=\"en\"><b><span class=\"grammar-hl\">as a National Historic Site</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그의 유산을 기리기 위해</span><span class=\"en\"><b><span class=\"grammar-hl\">to honor</span> his legacy.</b></span></div></div><div class=\"lec-sent-ko\">1979년, National Park Service는 그의 유산을 기리기 위해 Massachusetts주 Brookline에 있는 그의 집과 사무실을 National Historic Site로 지정했다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 그의 업적이 현대에 어떻게 평가받고 있는지 보여 주며 글을 맺습니다. to honor his legacy는 국가 기관 차원에서 그가 미국 시민들의 삶과 환경에 미친 역사적 공로를 공식적으로 예우하고 기념한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">designated his home and office in Brookline, Massachusetts, as a National Historic Site 5형식(SVOC) 구조: designate + O + as + C (목적어를 ~로 지정하다)의 기본구조를 취한다. his home and office in Brookline, Massachusetts가 목적어(O), as a National Historic Site가 목적격 보어(C) 역할을 한다.</div><div class=\"lec-gr-item\">to honor (to부정사(부사적)): &#39;기리기 위하여&#39;라는 목적의 의미를 나타내는 부사적 용법으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">designate</td><td class=\"m\">지정하다, 지명하다</td></tr><tr><td class=\"w\">honor</td><td class=\"m\">기리다, 예우하다, 존경하다</td></tr><tr><td class=\"w\">legacy</td><td class=\"m\">유산, 업적</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>Frederick Law Olmsted는 미국 조경 건축의 개척자로, 어릴 적 자연을 사랑하는 아버지 밑에서 감각을 키웠다.</li><li>예기치 않은 질병으로 엘리트 대학 진학을 포기해야 했으나, 다양한 현장 직업을 거치며 실무 경험을 쌓았다.</li><li>이를 바탕으로 센트럴 파크 설계 공모전에서 우승하며 실력을 입증했고, 남북 전쟁 중에는 공중 보건 분야에도 헌신했다.</li><li>사후에도 그의 조경 철학은 후계자들에게 이어졌고, 그의 자취는 국립 사적지로 지정되어 오늘날까지 국가적 존경을 받고 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Frederick Law Olmsted overcame early educational hardships to pioneer American landscape architecture, and his great legacy continues to be honored.</div>\n              <div class=\"lec-final-sum-ko\">프레더릭 로 옴스테드는 초기의 교육적 역경을 극복하고 미국 조경 건축을 개척했으며, 그의 위대한 유산은 계속해서 기려지고 있다.</div></div></div>"],"segs":[[{"audio":"./26_audio/1.mp3","hl":null}],[{"audio":"./26_audio/2.mp3","hl":null}],[{"audio":"./26_audio/3.mp3","hl":null},{"audio":"./26_audio/4.mp3","hl":"stage-0"},{"audio":"./26_audio/5.mp3","hl":"stage-1"},{"audio":"./26_audio/6.mp3","hl":"stage-2"},{"audio":"./26_audio/7.mp3","hl":"stage-3"}],[{"audio":"./26_audio/8.mp3","hl":null}],[{"audio":"./26_audio/9.mp3","hl":"main"},{"audio":"./26_audio/10.mp3","hl":"meaning"},{"audio":"./26_audio/11.mp3","hl":"grammar"}],[{"audio":"./26_audio/12.mp3","hl":"main"},{"audio":"./26_audio/13.mp3","hl":"meaning"},{"audio":"./26_audio/14.mp3","hl":"grammar"}],[{"audio":"./26_audio/15.mp3","hl":"main"},{"audio":"./26_audio/16.mp3","hl":"meaning"},{"audio":"./26_audio/17.mp3","hl":"grammar"}],[{"audio":"./26_audio/18.mp3","hl":"main"},{"audio":"./26_audio/19.mp3","hl":"meaning"},{"audio":"./26_audio/20.mp3","hl":"grammar"}],[{"audio":"./26_audio/21.mp3","hl":"main"},{"audio":"./26_audio/22.mp3","hl":"meaning"},{"audio":"./26_audio/23.mp3","hl":"grammar"}],[{"audio":"./26_audio/24.mp3","hl":"main"},{"audio":"./26_audio/25.mp3","hl":"meaning"},{"audio":"./26_audio/26.mp3","hl":"grammar"}],[{"audio":"./26_audio/27.mp3","hl":"main"},{"audio":"./26_audio/28.mp3","hl":"meaning"},{"audio":"./26_audio/29.mp3","hl":"grammar"}],[{"audio":"./26_audio/30.mp3","hl":"main"},{"audio":"./26_audio/31.mp3","hl":"meaning"},{"audio":"./26_audio/32.mp3","hl":"grammar"}],[{"audio":"./26_audio/33.mp3","hl":null}]]};var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.c
