}
lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 26번","audioDir":"26_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">26번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Frederick Law Olmsted: Father of American Landscape Architecture\u003c/h1>\u003ch2>미국 조경 건축의 아버지, Frederick Law Olmsted\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>미국 조경 건축의 아버지로 알려진 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">Frederick \u003c/b>\u003cb class=\"key\">Law \u003c/b>\u003cb class=\"key\">Olmsted \u003c/b>는 어린 시절 아버지와의 시골 여행에서 자연 감수성을 키웠고, 대학 진학이 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">옻나무 \u003c/b>\u003cb class=\"key\">중독 \u003c/b>으로 좌절되었지만 다양한 실무 경험을 거쳐 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">Central \u003c/b>\u003cb class=\"key\">Park \u003c/b> 설계 공모전에서 당선되었다. 사후에도 그의 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">철학 \u003c/b>은 후계자들에 의해 계승되어 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">National \u003c/b>\u003cb class=\"key\">Historic \u003c/b>\u003cb class=\"key\">Site \u003c/b>로 기념되고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Frederick Law Olmsted became the father of American landscape architecture by gaining practical experience and designing Central Park, and his legacy is honored as a National Historic Site.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 미국 조경 건축의 아버지로 알려진 Frederick Law Olmsted의 생애를 다룬 지문을 함께 읽어 볼게요. 이 글은 그가 태어나서 어린 시절을 보내고, 중간에 어려움을 겪지만 결국 Central Park 설계로 이름을 알리고, 그의 철학이 후대에 이어지는 과정을 시간 순서로 보여 줍니다. 요지로는 그가 실무 경험과 공원 설계를 통해 미국 조경 건축의 아버지가 되었고 그 유산이 오늘날 기념되고 있다는 점을 기억해 두면 좋아요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">landscape \u003c/b>\u003cb class=\"key\">architecture \u003c/b>는 땅과 자연을 아름답고 쓸모 있게 설계하는 분야로, 공원이나 정원, 도시 외부 공간을 다룬다. Olmsted가 활동한 19세기 미국은 산업화와 도시화가 빠르게 진행되던 때라, 도시민이 숨 쉴 수 있는 공원의 필요성이 커졌다. \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">sumac \u003c/b>은 옻나무를 뜻하는데, 여기에 심하게 노출되면 피부 발진과 시력 저하 같은 증상이 나타날 수 있다. Central Park는 뉴욕 맨해튼 한가운데 조성된 대표적인 도시 공원으로, Olmsted와 Calvert Vaux의 설계안이 뽑혔다. 남북전쟁 시기 그가 몸담은 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">United \u003c/b>\u003cb class=\"key\">States \u003c/b>\u003cb class=\"key\">Sanitary \u003c/b>\u003cb class=\"key\">Commission \u003c/b>은 군대의 위생과 의료 지원을 맡은 기관이다. 우리나라의 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">남산공원 \u003c/b> 같은 도심 속 자연 공간을 설계한 사람을 기념한다고 이해하면 된다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 먼저 살펴볼게요. landscape architecture는 조경 건축이라고 해서 자연과 땅을 아름답고 실용적으로 설계하는 분야예요. Olmsted가 활동한 미국은 산업화와 도시화가 빠르게 진행되면서 도시민이 편히 쉴 수 있는 공원의 필요성이 커지고 있었죠. 옻나무는 영어로 sumac인데 심하게 노출되면 시력 저하 같은 증상이 나타날 수 있어요. Central Park는 뉴욕 맨해튼 한가운데 있는 대표적인 도시 공원이고요. 미국 남북전쟁 시기에 Olmsted가 몸담았던 United States Sanitary Commission은 군인들의 위생과 의료 지원을 담당한 기관입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>자연과의 만남\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>1822년 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">Frederick \u003c/b>\u003cb class=\"key\">Law \u003c/b>\u003cb class=\"key\">Olmsted \u003c/b>가 태어나면서 이야기가 시작된다. 그는 경치를 사랑한 아버지와 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">시골 \u003c/b>\u003cb class=\"key\">여행 \u003c/b>을 자주 다녔다. 이 경험은 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">감수성 \u003c/b>의 밑바탕이 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>진학 좌절과 실무 경험\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>14세에 Yale College 진학을 준비했지만 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">옻나무 \u003c/b>\u003cb class=\"key\">중독 \u003c/b>으로 시력이 상해 입학하지 못했다. 대학에 다니는 대신 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">점원, \u003c/b>\u003cb class=\"key\">선원, \u003c/b>\u003cb class=\"key\">농부 \u003c/b>로 일하며 경험을 쌓았다. \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">진학 \u003c/b>\u003cb class=\"key\">실패 \u003c/b>가 오히려 현장 경험으로 이어지는 전환점이 된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>Central Park와 공직\u003csmall>주장·근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">Calvert \u003c/b>\u003cb class=\"key\">Vaux \u003c/b>와 협력해 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">Greensward \u003c/b>\u003cb class=\"key\">Plan \u003c/b>으로 뉴욕시 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">Central \u003c/b>\u003cb class=\"key\">Park \u003c/b> 설계 공모전에서 당선되었다. 남북전쟁 중에는 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">Sanitary \u003c/b>\u003cb class=\"key\">Commission \u003c/b>의 General Secretary로 일했다. \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">설계 \u003c/b>\u003cb class=\"key\">업적 \u003c/b>과 공직 경험이 인물의 전문성을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>유산의 계승과 기념\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>1903년 사망했지만 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">아들들과 \u003c/b>\u003cb class=\"key\">후계자들 \u003c/b>이 그의 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">철학 \u003c/b>을 계승했다. 1979년에는 자택과 사무실이 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">National \u003c/b>\u003cb class=\"key\">Historic \u003c/b>\u003cb class=\"key\">Site \u003c/b>로 지정되어 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">유산 \u003c/b>을 기리고 있다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 자연과의 만남입니다. Olmsted는 어렸을 때 경치를 사랑하는 아버지를 따라 시골로 자주 여행을 다녔어요. 이 경험이 훗날 조경 건축가로서 디자인 감각을 키우는 밑바탕이 됩니다. 그래서 어린 시절의 시골 여행을 자연 감수성 형성의 출발점으로 봐야 해요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 진학 좌절과 실무 경험입니다. 열네 살 때 Yale College 진학을 준비했지만 심각한 옻나무 중독으로 시력이 나빠져 입학하지 못했어요. 하지만 대학에 다니는 대신 점원과 선원과 농부로 일하면서 경험을 쌓았죠. 이 부분은 역경을 전환점 삼아 다양한 현장 경험을 얻은 과정으로 이해하면 좋아요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 Central Park와 공직 활동입니다. Olmsted는 Calvert Vaux와 함께 Greensward Plan으로 뉴욕시 Central Park 설계 공모전에서 당선되었어요. 이 업적은 그가 미국 조경 건축의 아버지로 불리게 된 결정적 계기가 됩니다. 남북전쟁 중에는 United States Sanitary Commission에서 General Secretary로 일하며 공공의 복지에도 힘썼죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 유산의 계승과 기념입니다. Olmsted는 세상을 떠났지만 그의 아들들과 후계자들이 디자인 철학을 이어 갔어요. 이후에 National Park Service가 매사추세츠 주 브루클라인에 있는 그의 집과 사무실을 National Historic Site로 지정해서 그의 유산을 기렸습니다. 이 장면은 한 인물의 업적이 제도와 후대에 의해 보존되는 결말로 정리할 수 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 Frederick Law Olmsted의 출생부터 사망, 기념까지 생애 전반을 다루므로 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">시간순 \u003c/b> 전개가 가장 뚜렷합니다. 첫 문장에서 '미국 조경 건축의 아버지'라는 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">정체성 \u003c/b>과 출생을 제시한 뒤, 어린 시절, 14세, Central Park 공모전, 남북전쟁, 사망과 기념으로 이어집니다. 따라서 전체 내용을 먼저 소개하는 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">두괄식 \u003c/b> 패턴으로 볼 수 있습니다. 시간을 나타내는 신호어들이 각 문단의 시작을 이끌며 사건을 순서대로 배열하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When Olmsted was young (2)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>At age 14 (3)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>In 1858 (5)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>During the Civil War (6)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>In 1979 (8)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Frederick Law Olmsted\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">he\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Olmsted\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his sons and successors\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">his home and office\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간순 구조를 취하고 있어요. 첫 문장에서 Frederick Law Olmsted의 정체성과 출생을 제시하는 두괄식 구성을 하고 있고요. 그 뒤로 어린 시절, 열네 살 때, Central Park 공모전 당선, 남북전쟁, 그리고 이후의 기념까지 시간의 흐름에 따라 사건이 이어집니다. 이런 글은 시점을 알리는 표현을 따라가며 인물의 행적과 평가를 순서대로 정리하면 돼요.","hl":"ty"},{"n":9,"text":"신호어를 보면 when he was young, at age fourteen 같은 시간 표현이 사건의 순서를 안내해 주죠. 이 표현들은 인물의 생애를 따라가는 이정표 역할을 합니다. Although he passed away는 역접을 나타내며 죽음에도 불구하고 철학이 계승된다는 점을 강조하고요. Frederick Law Olmsted가 he와 his로 재진술되는 것도 주의해서 보면 좋아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>known as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 알려진\u003c/span>\u003c/div>\u003cdiv>\u003cb>landscape architecture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조경 건축\u003c/span>\u003c/div>\u003cdiv>\u003cb>be born\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>태어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>countryside\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시골\u003c/span>\u003c/div>\u003cdiv>\u003cb>scenery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경치\u003c/span>\u003c/div>\u003cdiv>\u003cb>prepare oneself to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 준비를 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>enter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입학하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>due to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~때문에\u003c/span>\u003c/div>\u003cdiv>\u003cb>severe\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>심각한\u003c/span>\u003c/div>\u003cdiv>\u003cb>sumac poisoning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>옻나무 중독\u003c/span>\u003c/div>\u003cdiv>\u003cb>damage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>손상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>eyesight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시력\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>attend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gain experience\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>경험을 쌓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>clerk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>점원\u003c/span>\u003c/div>\u003cdiv>\u003cb>sailor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선원\u003c/span>\u003c/div>\u003cdiv>\u003cb>farmer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>농부\u003c/span>\u003c/div>\u003cdiv>\u003cb>work with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 함께 일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>design competition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설계 공모전\u003c/span>\u003c/div>\u003cdiv>\u003cb>serve as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 일하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>General Secretary\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사무총장\u003c/span>\u003c/div>\u003cdiv>\u003cb>Sanitary Commission\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위생 위원회\u003c/span>\u003c/div>\u003cdiv>\u003cb>pass away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사망하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>successor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>후계자\u003c/span>\u003c/div>\u003cdiv>\u003cb>design philosophy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디자인 철학\u003c/span>\u003c/div>\u003cdiv>\u003cb>designate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>National Historic Site\u003c/b>\u003cem>명사\u003c/em>\u003cspan>국가 사적지\u003c/span>\u003c/div>\u003cdiv>\u003cb>honor\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>legacy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유산\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 어휘를 짚어 볼게요. landscape architecture는 조경 건축이고요. due to는 때문에라는 뜻으로 원인을 나타냅니다. severe는 심각한이라는 뜻으로 시력 손상이 얼마나 큰지 보여 줘요. design competition은 설계 공모전이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">severe\u003c/b>\u003cspan class=\"m\">심각한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">serious\u003c/span>\u003cspan class=\"s\">acute\u003c/span>\u003cspan class=\"s\">intense\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">mild\u003c/span>\u003cspan class=\"a\">moderate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">damage\u003c/b>\u003cspan class=\"m\">손상시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">harm\u003c/span>\u003cspan class=\"s\">impair\u003c/span>\u003cspan class=\"s\">injure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repair\u003c/span>\u003cspan class=\"a\">restore\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gain\u003c/b>\u003cspan class=\"m\">얻다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"s\">earn\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">forfeit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">continue\u003c/b>\u003cspan class=\"m\">계속하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">maintain\u003c/span>\u003cspan class=\"s\">carry on\u003c/span>\u003cspan class=\"s\">sustain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stop\u003c/span>\u003cspan class=\"a\">cease\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">honor\u003c/b>\u003cspan class=\"m\">기리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">respect\u003c/span>\u003cspan class=\"s\">commemorate\u003c/span>\u003cspan class=\"s\">celebrate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dishonor\u003c/span>\u003cspan class=\"a\">disgrace\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 함께 정리해 둡시다. severe는 심각한이라는 뜻인데 serious와 acute로 바꿔 쓸 수 있어요. 반대로 mild는 가벼운이라는 뜻이에요. damage는 손상시키다라는 뜻이고 harm이나 impair와 동의어 관계예요. gain은 얻다라는 뜻으로 acquire와 earn이 함께 쓰여요. continue는 계속하다라는 뜻인데 maintain이나 carry on으로 바꿔 쓸 수 있고요. honor는 기리다라는 뜻으로 respect, commemorate와 같이 쓰이고 dishonor는 그 반대말이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Frederick Law Olmsted는\u003c/span>\u003cspan class=\"en\">Frederick Law Olmsted,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아버지로 알려진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">known \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">father \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 조경 건축의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">American \u003c/span>\u003cspan class=\"tgt\">landscape \u003c/span>\u003cspan class=\"tgt\">architecture\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1822년에 태어났다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">born\u003c/span> in 1822.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미국 조경 건축의 아버지로 알려진 Frederick Law Olmsted는 1822년에 태어났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 인물의 \u003cb class=\"key\">출생\u003c/b>과 신분을 소개하는 문장이다. Frederick Law Olmsted가 \u003cb class=\"key\">미국 \u003c/b>\u003cb class=\"key\">조경 \u003c/b>\u003cb class=\"key\">건축의 \u003c/b>\u003cb class=\"key\">아버지\u003c/b>로 불린다는 점을 먼저 제시해 글 전체의 중심인물을 압축적으로 보여 준다. 여기서 아버지는 실제 가족 관계가 아니라 그 분야를 \u003cb class=\"key\">개척\u003c/b>한 대표적 인물이라는 비유적 표현이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사(구)의 형용사적 용법(비제한적 수식)\u003c/span> : Frederick Law Olmsted, [known as ~] , was born ~ : \"미국 조경 건축의 아버지로 알려진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태(과거 시제)\u003c/span> : 주어 + was [be동사] + born [과거분사] : \"태어났다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Frederick Law Olmsted, Frederick Law Olmsted는. known as the father, 아버지로 알려진. of American landscape architecture, 미국 조경 건축의. was born in 1822, 1822년에 태어났다.. 이 문장 전체를 해석하면, 미국 조경 건축의 아버지로 알려진 Frederick Law Olmsted는 1822년에 태어났다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 Frederick Law Olmsted가 미국 조경 건축의 아버지라는 별명과 천팔백이십이 년 출생 정보를 함께 제시합니다. 여기서 아버지라는 말은 실제 가족 관계가 아니라 그 분야를 개척한 대표적 인물이라는 비유적 표현이에요. 그래서 글을 시작하면서 중심인물의 신분과 출생을 요약해 주는 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째 문장의 어법 포인트는 두 가지입니다. 첫째, known as the father of American landscape architecture는 Frederick Law Olmsted를 뒤에서 부연 설명하는 과거분사구예요. 원래는 who was known as로 시작하는 관계대명사절이 줄어든 형태이고 수동의 의미를 담고 있어요. 둘째, was born은 수동태로, bear의 과거분사 born이 be동사와 결합해 태어났다라는 뜻을 만듭니다. 과거 시제이므로 was를 쓴 거예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Olmsted가 어렸을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">Olmsted \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">young\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 자주 여행을 다녔다\u003c/span>\u003cspan class=\"en\">he often went on trips\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시골로\u003c/span>\u003cspan class=\"en\">to the countryside\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 아버지와\u003c/span>\u003cspan class=\"en\">with his father,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경치를 사랑했던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">loved \u003c/span>\u003cspan class=\"tgt\">scenery\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Olmsted가 어렸을 때, 그는 경치를 사랑했던 그의 아버지와 자주 시골로 여행을 다녔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Olmsted의 어린 시절 경험이 조경 건축가로 성장하는 데 배경이 되었음을 보여 준다. 아버지를 따라 시골로 자주 여행하며 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">풍경\u003c/b>에 \u003cb class=\"key\">조예\u003c/b>를 키웠을 것이라는 암시가 담겨 있다. 특히 관계대명사 who로 아버지가 \u003cb class=\"key\">경치를 \u003c/b>\u003cb class=\"key\">사랑하는\u003c/b> 사람임을 덧붙여 인물의 형성 배경을 구체화한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 부사절 접속사 when\u003c/span> : When [주어+동사], [주절] : \"Olmsted가 어렸을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : 선행사(his father) + who + 동사 : \"경치를 사랑했던\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"When Olmsted was young, Olmsted가 어렸을 때. he often went on trips, 그는 자주 여행을 다녔다. to the countryside, 시골로. with his father, 그의 아버지와. who loved scenery, 경치를 사랑했던. 이 문장 전체를 해석하면, Olmsted가 어렸을 때, 그는 경치를 사랑했던 그의 아버지와 자주 시골로 여행을 다녔다.","hl":"m"},{"n":16,"text":"두 번째 문장은 Olmsted가 어렸을 때 아버지와 자주 시골로 여행을 다녔다는 사실을 전해 줍니다. 아버지가 경치를 사랑했던 분이라는 설명을 who loved scenery로 덧붙여서, 어린 Olmsted가 자연 풍경을 가까이 접했다는 점을 강조해요. 이 경험이 이후 조경 건축가라는 진로에 영향을 준 배경이라고 볼 수 있죠.","hl":"mn"},{"n":17,"text":"두 번째 문장의 어법 포인트도 두 가지입니다. 첫째, When Olmsted was young는 시간을 나타내는 부사절로, 뒤에 올 주절의 시점을 먼저 알려 줘요. When 뒤에 주어와 동사를 갖춘 완전한 절이 왔죠. 둘째, who loved scenery는 아버지를 수식하는 주격 관계대명사절이에요. who가 his father를 받으면서 동시에 loved의 주어 역할을 하고, 콤마가 있으므로 부가 정보를 덧붙이는 비제한적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">14세에\u003c/span>\u003cspan class=\"en\">At age 14,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 자신을 준비하고 있었다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">preparing \u003c/span>\u003cspan class=\"tgt\">himself\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Yale College에서 공부하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">study \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">Yale \u003c/span>\u003cspan class=\"tgt\">College\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그는 입학할 수 없었다\u003c/span>\u003cspan class=\"en\">but he could not enter\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심각한 옻나무 중독 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">due \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">severe \u003c/span>\u003cspan class=\"tgt\">sumac \u003c/span>\u003cspan class=\"tgt\">poisoning\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 시력에 손상을 준\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">damaged \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">eyesight\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">14세에 그는 Yale College에서 공부하기 위해 준비하고 있었지만, 그의 시력에 손상을 준 심각한 옻나무 중독 때문에 입학할 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Olmsted가 대학 진학을 준비했으나 \u003cb class=\"key\">시력 \u003c/b>\u003cb class=\"key\">손상\u003c/b>으로 좌절한 사건을 서술한다. to study at Yale College는 공부하려는 \u003cb class=\"key\">목적\u003c/b>을, due to는 입학하지 못한 \u003cb class=\"key\">원인\u003c/b>을 분명히 드러낸다. 이 경험은 그가 대학 대신 다양한 일을 경험하게 되는 \u003cb class=\"key\">전환점\u003c/b>이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : 주어 + was + preparing [현재분사] : \"준비하고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : prepare oneself + [to study (to부정사구/목적)] : \"Yale College에서 공부하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 due to (원인)\u003c/span> : due to + [명사구 (a severe sumac poisoning)] : \"심각한 옻나무 중독 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사(sumac poisoning) + that + 동사 : \"그의 시력에 손상을 준\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"At age 14, 14세에. he was preparing himself, 그는 자신을 준비하고 있었다. to study at Yale College, Yale College에서 공부하기 위해. but he could not enter, 그러나 그는 입학할 수 없었다. due to a severe sumac poisoning, 심각한 옻나무 중독 때문에. that damaged his eyesight, 그의 시력에 손상을 준. 이 문장 전체를 해석하면, 14세에 그는 Yale College에서 공부하기 위해 준비하고 있었지만, 그의 시력에 손상을 준 심각한 옻나무 중독 때문에 입학할 수 없었다.","hl":"m"},{"n":19,"text":"세 번째 문장은 Olmsted가 열네 살에 Yale College에서 공부하기 위해 준비하고 있었지만 심각한 옻나무 중독 때문에 시력이 손상되어 입학할 수 없었다는 이야기를 담고 있어요. to study는 대학 공부라는 목적을, due to는 실패의 원인을 분명하게 연결해 줘요. 이 사건이 그가 대학에 가지 않고 여러 직업을 경험하게 된 전환점이 됩니다.","hl":"mn"},{"n":20,"text":"세 번째 문장의 어법 포인트는 네 가지입니다. 첫째, was preparing himself는 과거진행형으로, 열네 살이라는 과거의 특정 시점에 준비가 진행 중이었음을 나타냅니다. 둘째, to study at Yale College는 to부정사의 부사적 용법으로, 준비한 목적을 나타내어 공부하기 위해라고 해석해요. 셋째, due to a severe sumac poisoning은 원인을 나타내는 전치사구로, 입학하지 못한 이유를 설명합니다. 넷째, that damaged his eyesight는 sumac poisoning을 수식하는 주격 관계대명사절이고, that이 주어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대학에 다니는 대신에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">attending \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">college\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 경험을 쌓았다\u003c/span>\u003cspan class=\"en\">he gained experience\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점원, 선원, 그리고 농부로 일하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">working \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">clerk, \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">sailor, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">farmer\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대학에 다니는 대신에, 그는 점원, 선원, 그리고 농부로 일하며 경험을 쌓았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Olmsted가 대학 진학 대신 다양한 실무 경험을 쌓았다는 사실을 보여 줍니다. 앞 문장에서 시력 문제로 Yale College에 못 갔으므로, 여기서는 그 대안으로 점원, 선원, 농부 등 여러 일을 하며 경험을 쌓았다고 연결해 줍니다. \u003cb class=\"key\">Instead \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">attending \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">college\u003c/b>는 '대학에 다니는 대신에'라는 뜻이고, \u003cb class=\"key\">working \u003c/b>\u003cb class=\"key\">as\u003c/b>는 '~로 일하면서'로 동시에 일하며 경험을 쌓은 부대 상황을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사 (instead of + -ing)\u003c/span> : Instead of [attending (동명사구)] : \"대학에 다니는 대신에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구문 (부대상황)\u003c/span> : [he gained experience] + [working as ~ (현재분사구)] : \"점원, 선원, 그리고 농부로 일하면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조 (A, B, and C)\u003c/span> : [a clerk], [a sailor], and [a farmer] : \"점원, 선원, 그리고 농부\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Instead of attending a college, 대학에 다니는 대신에. he gained experience, 그는 경험을 쌓았다. working as a clerk, a sailor, and a farmer, 점원, 선원, 그리고 농부로 일하면서. 이 문장 전체를 해석하면, 대학에 다니는 대신에, 그는 점원, 선원, 그리고 농부로 일하며 경험을 쌓았다.","hl":"m"},{"n":22,"text":"이 문장은 올름스테드가 대학에 가지 않고 점원, 선원, 농부 같은 여러 일을 하면서 경험을 쌓았다는 걸 보여 줍니다. 앞 문장에서 시력 문제로 예일 대학에 들어가지 못했기 때문에, 이 문장은 그 대신 현장에서 경험을 쌓은 대안적인 길을 제시해 줍니다. 대신에라는 뜻의 Instead of attending a college와 일하면서라는 뜻의 working as가 핵심 표현이에요.","hl":"mn"},{"n":23,"text":"첫 번째 문법 포인트는 Instead of attending a college입니다. 전치사 instead of 뒤에는 동명사가 와야 해서 attend가 attending으로 바뀌었고, 뜻은 대학에 다니는 대신에입니다. 두 번째 문법 포인트는 working as a clerk, a sailor, and a farmer입니다. 이 현재분사구문은 주절의 동작과 동시에 일어나는 부대 상황을 나타내는데, 일하면서 경험을 쌓았다는 의미를 더해 줍니다. 세 번째 문법 포인트는 a clerk, a sailor, and a farmer의 병렬 구조입니다. 세 개의 명사구를 콤마와 and로 이어서 형태를 동일하게 맞춘 목록이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1858년에\u003c/span>\u003cspan class=\"en\">In 1858,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 Calvert Vaux와 함께 일했고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">worked \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">Calvert \u003c/span>\u003cspan class=\"tgt\">Vaux \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 설계 공모전에서 당선되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">won\u003c/span> the design competition\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뉴욕시의 Central Park를 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">New \u003c/span>\u003cspan class=\"tgt\">York \u003c/span>\u003cspan class=\"tgt\">City's \u003c/span>\u003cspan class=\"tgt\">Central \u003c/span>\u003cspan class=\"tgt\">Park\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘Greensward Plan’으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">&quot;Greensward \u003c/span>\u003cspan class=\"tgt\">Plan.&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1858년에 그는 Calvert Vaux와 함께 일하며, ‘Greensward Plan’으로 뉴욕시의 Central Park 설계 공모전에서 당선되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Olmsted가 Calvert Vaux와 함께 Central Park 설계 공모전에서 당선된 중요한 사건을 서술합니다. 앞 문장의 다양한 경력이 결국 조경 설계 분야의 성공으로 이어졌음을 보여 주며, \u003cb class=\"key\">Greensward \u003c/b>\u003cb class=\"key\">Plan\u003c/b>이라는 설계안으로 \u003cb class=\"key\">Central \u003c/b>\u003cb class=\"key\">Park\u003c/b>를 설계하게 된 핵심 장면입니다. 여기서 \u003cb class=\"key\">won \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">design \u003c/b>\u003cb class=\"key\">competition\u003c/b>은 '설계 공모전에서 당선되었다'는 뜻으로, 공식적인 설계 경쟁에서 뽑혔다는 의미입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조 (동사 and 동사)\u003c/span> : [he worked with Calvert Vaux] and [won the design competition] : \"그는 Calvert Vaux와 함께 일했고, 설계 공모전에서 당선되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 (목적)\u003c/span> : for [New York City's Central Park (명사구)] : \"뉴욕시의 Central Park를 위한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 (수단·도구)\u003c/span> : with [the &quot;Greensward Plan&quot; (명사구)] : \"‘Greensward Plan’으로\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In 1858, 1858년에. he worked with Calvert Vaux, 그는 Calvert Vaux와 함께 일했고. and won the design competition, 그리고 설계 공모전에서 당선되었다. for New York City's Central Park, 뉴욕시의 Central Park를 위한. with the \"Greensward Plan.\", ‘Greensward Plan’으로. 이 문장 전체를 해석하면, 1858년에 그는 Calvert Vaux와 함께 일하며, ‘Greensward Plan’으로 뉴욕시의 Central Park 설계 공모전에서 당선되었다.","hl":"m"},{"n":25,"text":"이 문장은 1858년에 올름스테드가 칼버트 복스와 함께 뉴욕시 센트럴파크 설계 공모전에서 그린스워드 플랜으로 당선된 사건을 다룹니다. 앞 문장에서 쌓은 다양한 경험이 실제 조경 설계 분야의 성공으로 이어졌다는 걸 보여 줍니다. 여기서 won the design competition은 설계 공모전에서 당선되었다는 뜻이고, with the Greensward Plan은 그린스워드 플랜이라는 설계안을 가지고 당선된 수단을 나타내요.","hl":"mn"},{"n":26,"text":"첫 번째 문법 포인트는 he worked with Calvert Vaux and won입니다. 주어 he에 대해 worked와 won이 and로 연결된 병렬 구조인데, 둘 다 과거 시제로 형태를 맞췄어요. 두 번째 문법 포인트는 with the Greensward Plan입니다. 전치사 with가 어떤 설계안을 가지고 당선되었는지 수단이나 도구의 의미를 나타내고, 뒤에 명사구가 옵니다. 세 번째 문법 포인트는 for New York City's Central Park입니다. 전치사 for가 어느 공원을 위한 공모전인지 목적을 나타내면서 competition을 수식해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Civil War 기간 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">During \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Civil \u003c/span>\u003cspan class=\"tgt\">War\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Olmsted는 일했다\u003c/span>\u003cspan class=\"en\">Olmsted \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">served \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">General Secretary로서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">General \u003c/span>\u003cspan class=\"tgt\">Secretary\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 Sanitary Commission의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">United \u003c/span>\u003cspan class=\"tgt\">States \u003c/span>\u003cspan class=\"tgt\">Sanitary \u003c/span>\u003cspan class=\"tgt\">Commission\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Civil War 기간 동안, Olmsted는 미국 Sanitary Commission의 General Secretary로 일했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 남북전쟁이라는 시대적 배경 속에서 Olmsted가 맡은 공적 역할을 보여 줍니다. \u003cb class=\"key\">Civil \u003c/b>\u003cb class=\"key\">War\u003c/b>는 미국 남북전쟁을 가리키며, \u003cb class=\"key\">served \u003c/b>\u003cb class=\"key\">as \u003c/b>\u003cb class=\"key\">General \u003c/b>\u003cb class=\"key\">Secretary\u003c/b>는 '사무총장으로 일했다'는 뜻입니다. 그가 단순한 조경가가 아니라 국가적 위생 위원회의 실무 책임자로도 활동했다는 점에서 그의 다양한 이력을 강조해 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 (시간)\u003c/span> : During [the Civil War (명사구)] : \"Civil War 기간 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">serve as + 직책\u003c/span> : served as [General Secretary (직책)] : \"General Secretary로 일했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 (소속·소유)\u003c/span> : of [the United States Sanitary Commission (명사구)] : \"미국 Sanitary Commission의\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"During the Civil War, Civil War 기간 동안. Olmsted served, Olmsted는 일했다. as General Secretary, General Secretary로서. of the United States Sanitary Commission, 미국 Sanitary Commission의. 이 문장 전체를 해석하면, Civil War 기간 동안, Olmsted는 미국 Sanitary Commission의 General Secretary로 일했다.","hl":"m"},{"n":28,"text":"이 문장은 미국 남북전쟁 기간 동안 올름스테드가 미국 위생 위원회의 사무총장으로 일했다는 사실을 알려 줍니다. 그가 조경가일 뿐만 아니라 국가 기관의 실무 책임자로도 활동했다는 점에서 이력의 폭을 보여 줍니다. served as General Secretary는 사무총장으로 일했다는 뜻이고, of the United States Sanitary Commission은 어느 기관의 사무총장인지를 설명해 줘요.","hl":"mn"},{"n":29,"text":"첫 번째 문법 포인트는 During the Civil War입니다. 전치사 During이 어떤 기간 동안이라는 시간의 의미를 나타내며 문장 맨 앞에서 시점을 알려 줍니다. 두 번째 문법 포인트는 served as General Secretary입니다. serve as는 어떤 직책으로 일하다는 뜻이고, as는 자격을 나타내는 전치사예요. 세 번째 문법 포인트는 of the United States Sanitary Commission입니다. 전치사 of가 앞의 General Secretary를 꾸며 주는 형용사구 역할을 해서 어느 기관의 사무총장인지 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 그는 1903년에 사망했지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">passed \u003c/span>\u003cspan class=\"tgt\">away \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">1903,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 아들들과 후계자들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">sons \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">successors\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계승했다\u003c/span>\u003cspan class=\"en\">continued\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 디자인 철학을\u003c/span>\u003cspan class=\"en\">his design philosophy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비록 그는 1903년에 사망했지만, 그의 아들들과 후계자들이 그의 디자인 철학을 계승했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 올름스테드가 세상을 떠난 뒤에도 그의 \u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">철학\u003c/b>이 \u003cb class=\"key\">후계자들\u003c/b>에 의해 이어졌음을 보여 줍니다. although를 사용해 죽음이라는 한계와 철학의 계승이라는 대조적인 흐름을 연결하고 있습니다. 따라서 그의 업적이 개인에 그치지 않고 지속되었다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사절을 이끄는 접속사 Although (양보)\u003c/span> : Although + 주어 + 동사, 주어 + 동사 : \"비록 그는 1903년에 사망했지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">and를 이용한 병렬 구조\u003c/span> : A and B : \"그의 아들들과 후계자들이\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Although he passed away in 1903, 비록 그는 1903년에 사망했지만. his sons and successors, 그의 아들들과 후계자들이. continued, 계승했다. his design philosophy, 그의 디자인 철학을. 이 문장 전체를 해석하면, 비록 그는 1903년에 사망했지만, 그의 아들들과 후계자들이 그의 디자인 철학을 계승했다.","hl":"m"},{"n":31,"text":"이 문장은 올름스테드가 세상을 떠난 뒤에도 그의 아들들과 후계자들이 디자인 철학을 이어 갔다는 내용입니다. although가 앞 절의 죽음과 뒤 절의 계승을 대조하며 연결해 주고 있죠. pass away는 죽음을 완곡하게 표현한 것이고 successors는 후계자들이라는 뜻이에요.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 although예요. although는 뒤에 주어와 동사를 갖춘 절을 이끌고, 주절과 대조되는 양보의 뜻을 나타내는 접속사입니다. 여기서는 그가 사망했다는 사실과 철학이 이어졌다는 사실을 대조하며 이어 주고 있어요. 두 번째 포인트는 his sons and successors에 쓰인 and 병렬 구조입니다. and가 두 명사를 대등하게 연결해서 주어 역할을 하고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1979년에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">1979,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">National Park Service는\u003c/span>\u003cspan class=\"en\">the National Park Service\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지정했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">designated \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 집과 사무실을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">home \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">office \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Massachusetts주 Brookline에 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Brookline, \u003c/span>\u003cspan class=\"tgt\">Massachusetts, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">National Historic Site로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">National \u003c/span>\u003cspan class=\"tgt\">Historic \u003c/span>\u003cspan class=\"tgt\">Site\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 유산을 기리기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">honor \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">legacy.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1979년, National Park Service는 그의 유산을 기리기 위해 Massachusetts주 Brookline에 있는 그의 집과 사무실을 National Historic Site로 지정했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 1979년에 National Park Service가 그의 집과 사무실을 \u003cb class=\"key\">National \u003c/b>\u003cb class=\"key\">Historic \u003c/b>\u003cb class=\"key\">Site\u003c/b>로 지정했다는 사실을 전합니다. to honor his legacy는 지정의 \u003cb class=\"key\">목적\u003c/b>으로, 그의 업적을 공식적으로 기리고자 했다는 점을 보여 줍니다. 글 전체에서 그의 \u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">철학\u003c/b>이 후대에도 이어지고 인정받고 있음을 마무리하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 전치사구\u003c/span> : In + 연도 : \"1979년에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 동사 designated와 목적격 보어\u003c/span> : designate + 목적어 + as + 명사 : \"그의 집과 사무실을 National Historic Site로 지정했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + 동사원형 + 목적어 : \"그의 유산을 기리기 위해\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"In 1979, 1979년에. the National Park Service, National Park Service는. designated, 지정했다. his home and office, 그의 집과 사무실을. in Brookline, Massachusetts, Massachusetts주 Brookline에 있는. as a National Historic Site, National Historic Site로. to honor his legacy, 그의 유산을 기리기 위해. 이 문장 전체를 해석하면, 1979년, National Park Service는 그의 유산을 기리기 위해 Massachusetts주 Brookline에 있는 그의 집과 사무실을 National Historic Site로 지정했다.","hl":"m"},{"n":34,"text":"이 문장은 1979년에 National Park Service가 올름스테드의 집과 사무실을 National Historic Site로 지정했다는 사실을 알려 줍니다. to honor his legacy는 그의 유산을 기리기 위해서라는 뜻으로 지정의 목적을 나타내요. 이로써 올름스테드의 업적이 공식적으로 기념되고 있다는 점을 보여 주고 있습니다.","hl":"mn"},{"n":35,"text":"첫 번째 포인트는 designated his home and office as a National Historic Site입니다. designate는 목적어와 목적격 보어로 as 명사를 취해서 무엇을 무엇으로 지정하다는 뜻의 5형식 동사예요. 두 번째 포인트는 to honor his legacy입니다. 이 to부정사는 지정한 행위의 목적을 나타내는 부사적 용법으로 쓰였어요. 즉 그의 유산을 기리기 위해서 지정했다는 뜻이죠. 세 번째 포인트는 in 1979입니다. 시간을 나타내는 전치사구가 문장 앞에서 시간적 배경을 제시하고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">Frederick \u003c/b>\u003cb class=\"key\">Law \u003c/b>\u003cb class=\"key\">Olmsted \u003c/b>는 미국 조경 건축의 아버지로 알려진 인물로 1822년 태어났다.\u003c/li>\u003cli>어린 시절 아버지와의 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">시골 \u003c/b>\u003cb class=\"key\">여행 \u003c/b>은 자연 감수성을 키웠고, 14세 때 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">옻나무 \u003c/b>\u003cb class=\"key\">중독 \u003c/b>으로 Yale College 진학이 좌절되었다.\u003c/li>\u003cli>대학 대신 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">점원, \u003c/b>\u003cb class=\"key\">선원, \u003c/b>\u003cb class=\"key\">농부 \u003c/b>로 경험을 쌓고, 1858년 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">Central \u003c/b>\u003cb class=\"key\">Park \u003c/b> 설계 공모전에서 당선되었다.\u003c/li>\u003cli>남북전쟁 기간 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">Sanitary \u003c/b>\u003cb class=\"key\">Commission \u003c/b>에서 일했고, 사후 그의 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">철학 \u003c/b>은 아들들과 후계자에 의해 계승되었으며 1979년 자택과 사무실이 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">National \u003c/b>\u003cb class=\"key\">Historic \u003c/b>\u003cb class=\"key\">Site \u003c/b>로 지정되었다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Frederick Law Olmsted became the father of American landscape architecture by gaining practical experience and designing Central Park, and his legacy is honored as a National Historic Site.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">미국 조경 건축의 아버지로 알려진 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">Frederick \u003c/b>\u003cb class=\"key\">Law \u003c/b>\u003cb class=\"key\">Olmsted \u003c/b>는 어린 시절 아버지와의 시골 여행에서 자연 감수성을 키웠고, 대학 진학이 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">옻나무 \u003c/b>\u003cb class=\"key\">중독 \u003c/b>으로 좌절되었지만 다양한 실무 경험을 거쳐 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">Central \u003c/b>\u003cb class=\"key\">Park \u003c/b> 설계 공모전에서 당선되었다. 사후에도 그의 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">디자인 \u003c/b>\u003cb class=\"key\">철학 \u003c/b>은 후계자들에 의해 계승되어 \u003cb class=\"key\"> \u003c/b>\u003cb class=\"key\">National \u003c/b>\u003cb class=\"key\">Historic \u003c/b>\u003cb class=\"key\">Site \u003c/b>로 기념되고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"이제 전체를 정리할게요. 이 지문은 Frederick Law Olmsted가 어린 시절 자연을 접하고, 옻나무 중독으로 대학 진학이 어려워졌지만, 점원과 선원과 농부로 경험을 쌓고, Central Park 설계 공모전에서 당선된 뒤, 그의 디자인 철학이 후계자에게 이어져 National Historic Site로 기념되는 과정을 시간순으로 서술합니다. 시점 표현과 역접을 잡아 글의 흐름을 따라가면 충분히 해석할 수 있어요. 오늘 내용 꼼꼼히 복습하고 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
