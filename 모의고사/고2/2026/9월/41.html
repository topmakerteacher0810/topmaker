  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}

}
lecturePlayer(document.getElementById("app"),{"brand":"고2 9모","title":"2026년 고2 9월 모의고사 41~42번","audioDir":"41_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.707em\">41~42번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 9월 모의고사\u003c/div>\u003ch1>Choice Architecture and Human Agency in an Algorithmic World\u003c/h1>\u003ch2>알고리즘이 이끄는 선택 구조와 인간 주체성\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>선택 구조를 설계하는 \u003cb class=\"key\">알고리즘\u003c/b>은 우리가 보는 정보를 선별하며 \u003cb class=\"key\">넛지\u003c/b>하지만, 설계자의 목표가 개인의 \u003cb class=\"key\">복지\u003c/b>와 \u003cb class=\"key\">자율성\u003c/b>에 어긋나면 \u003cb class=\"key\">조작\u003c/b>이 될 수 있다. 따라서 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">관여\u003c/b>와 \u003cb class=\"key\">건전한 \u003c/b>\u003cb class=\"key\">회의론\u003c/b>으로 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">주체성\u003c/b>을 길러야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>In an increasingly algorithmic world, protecting human agency requires conscious critical engagement with technology, including seeking diverse perspectives, challenging recommendations, and maintaining healthy skepticism toward algorithm outputs.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 choice architecture를 다루는 글입니다. 알고리즘이 우리의 선택 환경을 설계하면서 어떤 영향을 주는지, 그리고 그 속에서 우리의 human agency를 어떻게 지켜야 하는지가 핵심이에요. 요약하면 알고리즘 넛지가 유익할 수도 있지만 조작으로 이어질 수 있고, 그래서 비판적 관여와 건전한 회의론이 필요하다는 내용이죠. 요지는 알고리즘 세계에서 인간 주체성을 지키려면 의식적이고 비판적인 노력이 필요하다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">행동 경제학 behavioral economics에서는 사람이 늘 합리적으로만 선택하지 않는다고 봐요. 선택 구조 choice architecture는 선택지의 배치나 환경 설계로 결정을 이끄는 개념이고, 넛지 nudge는 금지나 강제 없이 부드럽게 유도하는 개입이에요. 일상적으로 매점 진열대에서 과일을 눈높이에 두면 학생들이 과일을 더 집게 되는 것이 \u003cb class=\"key\">선택 \u003c/b>\u003cb class=\"key\">구조\u003c/b>의 예시죠. 알고리즘도 우리가 보는 피드를 선별하는 디지털 환경의 \u003cb class=\"key\">설계자\u003c/b> 역할을 해요. 이런 넛지가 유익할 수 있지만 설계자의 목표가 개인의 \u003cb class=\"key\">복지\u003c/b>나 \u003cb class=\"key\">자율성\u003c/b>과 어긋나면 \u003cb class=\"key\">조작\u003c/b>으로 이어질 수 있어요. 그래서 알고리즘 세상에서 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">주체성\u003c/b>을 지키는 것이 중요해요.\u003c/div>","segs":[{"n":2,"text":"행동 경제학 behavioral economics에서는 사람이 늘 합리적으로만 선택하지 않는다고 봐요. 선택 구조 choice architecture는 선택지의 배치나 환경 설계로 결정을 이끄는 개념이고, 넛지 nudge는 금지나 강제 없이 부드럽게 유도하는 개입이에요. 일상적으로 매점 진열대에서 과일을 눈높이에 두면 학생들이 과일을 더 집게 되는 것이 선택 구조의 예시죠. 알고리즘도 우리가 보는 피드를 선별하는 디지털 환경의 설계자 역할을 해요. 이런 넛지가 유익할 수 있지만 설계자의 목표가 개인의 복지나 자율성과 어긋나면 조작으로 이어질 수 있어요. 그래서 알고리즘 세상에서 인간 주체성을 지키는 것이 중요해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>선택 구조와 알고리즘\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 문장은 \u003cb class=\"key\">선택 \u003c/b>\u003cb class=\"key\">구조\u003c/b> 개념을 소개하며 선택이 이루어지는 환경의 설계가 결정에 큰 영향을 미친다고 말한다. 두 번째 문장은 \u003cb class=\"key\">알고리즘\u003c/b>이 우리 디지털 환경의 본질적인 \u003cb class=\"key\">설계자\u003c/b>라고 규정한다. 이렇게 일반 개념을 알고리즘 세계에 적용하며 글을 시작한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>넛지의 두 얼굴\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>세 번째 문장은 알고리즘이 우리가 보고 추천받는 것을 선별해 \u003cb class=\"key\">넛지\u003c/b>한다고 설명한다. 네 번째 문장은 넛지가 건강한 습관처럼 \u003cb class=\"key\">유익한 \u003c/b>\u003cb class=\"key\">목적\u003c/b>으로 쓰일 수 있지만, 설계자의 목표가 개인의 \u003cb class=\"key\">복지\u003c/b>나 \u003cb class=\"key\">자율성\u003c/b>과 어긋나면 \u003cb class=\"key\">조작\u003c/b> 가능성이 있다고 경고한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>인간 주체성의 질문\u003csmall>전환 · 문장 5\u003c/small>\u003c/h4>\u003cp>다섯 번째 문장은 글의 중심 질문을 던진다. 점점 더 알고리즘화되는 세상에서 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">주체성\u003c/b>을 어떻게 기르고 보호할 수 있을지 묻는다. 이 질문이 앞의 문제 인식과 뒤의 해결 방안을 연결한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>비판적 관여와 회의론\u003csmall>결론 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>여섯 번째 문장은 \u003cb class=\"key\">의식적인 \u003c/b>\u003cb class=\"key\">노력\u003c/b>과 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">관여\u003c/b>가 필요하다고 말한다. 일곱 번째 문장은 다양한 관점을 찾고 \u003cb class=\"key\">알고리즘의 \u003c/b>\u003cb class=\"key\">추천\u003c/b>에 도전하며 예측된 흐름에 반하는 \u003cb class=\"key\">의도적인 \u003c/b>\u003cb class=\"key\">선택\u003c/b>을 구체적으로 제시한다. 여덟 번째 문장은 \u003cb class=\"key\">건전한 \u003c/b>\u003cb class=\"key\">회의론\u003c/b>을 기르고 알고리즘 데이터가 과거 현실의 반영일 뿐 미래 번영의 처방은 아니라고 기억해야 한다고 강조한다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 선택 구조 개념에서 시작해서 알고리즘의 넛지, 조작 가능성, 그리고 인간 주체성 보호 방안으로 흘러가요.","hl":null},{"n":4,"text":"첫 번째 단계는 선택 구조 개념과 알고리즘을 연결하는 도입이에요. 선택이 이루어지는 환경의 설계가 사람들의 결정에 큰 영향을 준다는 게 choice architecture 개념이죠. 알고리즘은 본질적으로 우리 디지털 환경의 정교한 설계자라고 말해요.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 알고리즘이 우리를 넛지하는 방식과 그 위험을 설명해요. 우리가 무엇을 보고 추천받고 어떤 옵션을 제시받는지 선별해서 특정 경로로 가볍게 자극하죠. 넛지는 건강한 습관처럼 유익할 수도 있지만 설계자의 목표가 개인의 복지나 자율성과 어긋나면 조작 가능성도 있다고 해요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 글의 전환점으로 질문을 던져요. 점점 더 알고리즘화되는 세상에서 우리 인간 주체성을 어떻게 기르고 보호할 수 있을지 묻죠.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 그 답을 제시해요. 의식적인 노력으로 기술과 비판적인 관계를 유지해야 하고, 적극적으로 다양한 관점을 찾고 알고리즘 추천에 도전하며 예측된 흐름에 반하는 의도적 선택을 해야 해요. 또 알고리즘의 겉보기에 객관적인 결과물에 대한 건전한 회의론을 기르고, 그 데이터는 과거 현실의 반영일 뿐 미래 번영을 위한 처방은 아니라고 기억해야 하죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">앞부분에서 \u003cb class=\"key\">선택 \u003c/b>\u003cb class=\"key\">구조\u003c/b>와 알고리즘 \u003cb class=\"key\">넛지\u003c/b>의 개념을 설명한 뒤, \u003cb class=\"key\">조작\u003c/b> 가능성이라는 문제를 제기한다. 다섯 번째 문장이 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">주체성\u003c/b> 보호라는 중심 질문을 던져 주제문 역할을 한다. 이후 여섯 번째부터 여덟 번째 문장까지 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">관여\u003c/b>와 \u003cb class=\"key\">건전한 \u003c/b>\u003cb class=\"key\">회의론\u003c/b>이라는 해결책을 구체화한다. 따라서 문제를 인식하고 질문을 던진 뒤 해결 방안을 제시하는 \u003cb class=\"key\">문제-해결\u003c/b> 전개이며, 중심 질문이 중간에 있어 \u003cb class=\"key\">중괄식\u003c/b> 구조로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In essence (2)\u003c/b>\u003cspan>환언\u003c/span>\u003cb>While (4)\u003c/b>\u003cspan>대조·양보\u003c/span>\u003cb>such as (4)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>The question then becomes (5)\u003c/b>\u003cspan>전환·문제 제기\u003c/span>\u003cb>It requires (6)\u003c/b>\u003cspan>해결 제시\u003c/span>\u003cb>It means (7)\u003c/b>\u003cspan>구체화\u003c/span>\u003cb>It involves (8)\u003c/b>\u003cspan>추가 구체화\u003c/span>\u003cb>not necessarily (8)\u003c/b>\u003cspan>한정·부정\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">choice architecture\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">architects\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">curating\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">nudge\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">nudges\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">manipulation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">human agency\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">conscious effort\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">critical engagement\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">healthy skepticism\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">past realities\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">future flourishing\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>유익한 넛지\u003c/th>\u003cth>조작 가능성\u003c/th>\u003c/tr>\u003ctr>\u003ctd>개인의 복지와 자율성 증진\u003c/td>\u003ctd>설계자 목표와 개인 목표의 불일치\u003c/td>\u003c/tr>\u003ctr>\u003ctd>건강한 습관 권장\u003c/td>\u003ctd>특정 경로로의 교묘한 유도\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 지문은 문제 해결 구조로 볼 수 있어요. 앞부분에서 선택 구조와 알고리즘 넛지, 조작 가능성이라는 문제를 설명하고, 중간의 질문을 중심으로 뒷부분에서 해결책을 제시하죠. 주제문은 다섯 번째 문장의 질문으로 볼 수 있고, 그래서 중괄식 구조에 가까워요. 앞뒤로 배경과 답이 펼쳐지는 거예요.","hl":"ty"},{"n":9,"text":"첫 번째 문장에서 choice architecture가 나오고 두 번째 문장에서 in essence로 다시 설명해요. 네 번째 문장에서 While이 나와서 넛지의 유익함과 조작 가능성을 대조하고, 다섯 번째 문장의 The question then becomes가 전환 신호예요. 여섯 번째부터 It requires, It means, It involves가 반복되며 해결책을 구체화하고, 여덟 번째 문장의 not necessarily가 데이터의 한계를 강조해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>choice architecture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선택 구조\u003c/span>\u003c/div>\u003cdiv>\u003cb>popularize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대중화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>behavioral economics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동 경제학\u003c/span>\u003c/div>\u003cdiv>\u003cb>significantly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>상당히\u003c/span>\u003c/div>\u003cdiv>\u003cb>influence\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in essence\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>본질적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>sophisticated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정교한\u003c/span>\u003c/div>\u003cdiv>\u003cb>architect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설계자\u003c/span>\u003c/div>\u003cdiv>\u003cb>digital environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디지털 환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>curate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선별하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recommend\u003c/b 은 미묘한, nudge는 가볍게 자극하다, manipulation은 조작, autonomy는 자율성이라는 뜻이에요. critical engagement는 비판적 관여, healthy skepticism은 건전한 회의론으로 주체성 보호의 핵심 표현이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">nudge\u003c/b>\u003cspan class=\"m\">가볍게 자극하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prompt\u003c/span>\u003cspan class=\"s\">push\u003c/span>\u003cspan class=\"s\">encourage\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">force\u003c/span>\u003cspan class=\"a\">coerce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">manipulation\u003c/b>\u003cspan class=\"m\">조작\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">exploitation\u003c/span>\u003cspan class=\"s\">control\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">autonomy\u003c/span>\u003cspan class=\"a\">fairness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">beneficial\u003c/b>\u003cspan class=\"m\">유익한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">helpful\u003c/span>\u003cspan class=\"s\">advantageous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harmful\u003c/span>\u003cspan class=\"a\">detrimental\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">autonomy\u003c/b>\u003cspan class=\"m\">자율성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">independence\u003c/span>\u003cspan class=\"s\">freedom\u003c/span>\u003cspan class=\"s\">self-determination\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dependence\u003c/span>\u003cspan class=\"a\">control\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cultivate\u003c/b>\u003cspan class=\"m\">기르다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">develop\u003c/span>\u003cspan class=\"s\">foster\u003c/span>\u003cspan class=\"s\">nurture\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u00 span class=\"tgt\">popularized \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">behavioral \u003c/span>\u003cspan class=\"tgt\">economics\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강조한다\u003c/span>\u003cspan class=\"en\">highlights\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선택이 이루어지는 환경의 설계가 어떻게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">design \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">environment \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">choices \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 내리는 결정에 크게 영향을 미칠 수 있는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">significantly \u003c/span>\u003cspan class=\"tgt\">influence \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">decisions \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">make\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">행동 경제학에서 대중화된 ‘선택 구조’라는 개념은 선택이 이루어지는 환경의 설계가 사람들이 내리는 결정에 어떻게 큰 영향을 미칠 수 있는지를 강조한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 행동 경제학의 핵심 개념인 \u003cb class=\"key\">선택 \u003c/b>\u003cb class=\"key\">구조\u003c/b>를 정의하고, 선택이 이루어지는 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">설계\u003c/b>가 사람들의 \u003cb class=\"key\">결정\u003c/b>에 큰 영향을 준다는 점을 도입한다. 'popularized'는 '대중화된'이라는 뜻으로, 이 개념이 행동 경제학 분야에서 널리 알려졌음을 나타낸다. 글 전체의 출발점으로, 이후 알고리즘이 우리 디지털 환경의 설계자라는 주장의 이론적 기반을 마련한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : The concept of &quot;choice architecture,&quot; (which is) popularized in behavioral economics : \"행동 경제학에서 대중화된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 how가 이끄는 명사절(목적어)\u003c/span> : highlights + how + 주어 + 동사 : \"어떻게 ~할 수 있는지를 강조한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사+관계대명사(in which)\u003c/span> : the environment + in which + choices are made : \"선택이 이루어지는 환경\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 that의 생략\u003c/span> : the decisions + (that) people make : \"사람들이 내리는 결정\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The concept of \"choice architecture,\", '선택 구조'라는 개념은. popularized in behavioral economics, 행동 경제학에서 대중화된. highlights, 강조한다. how the design of the environment in which choices are made, 선택이 이루어지는 환경의 설계가 어떻게. can significantly influence the decisions people make, 사람들이 내리는 결정에 크게 영향을 미칠 수 있는지. 이 문장 전체를 해석하면, 행동 경제학에서 대중화된 ‘선택 구조’라는 개념은 선택이 이루어지는 환경의 설계가 사람들이 내리는 결정에 어떻게 큰 영향을 미칠 수 있는지를 강조한다.","hl":"m"},{"n":13,"text":"이 문장은 행동 경제학의 핵심 개념인 선택 구조를 정의하고, 선택이 이루어지는 환경 설계가 사람들의 결정에 큰 영향을 준다는 점을 소개합니다. popularized는 대중화된이라는 뜻으로, 이 개념이 행동 경제학 분야에서 널리 알려졌음을 나타냅니다. 글 전체의 이론적 출발점으로, 이후 알고리즘이 디지털 환경의 설계자라는 주장으로 이어집니다.","hl":"mn"},{"n":14,"text":"첫 번째, popularized in behavioral economics는 과거분사구로 앞의 The concept를 수동의 의미로 수식합니다. 과거분사는 수동과 완료의 뜻을 가지며 여기서는 대중화된이라는 뜻으로 쓰였습니다. 두 번째, in which choices are made는 전치사와 관계대명사가 결합된 형태로 앞의 the environment를 수식합니다. 선택이 그 안에서 이루어지는 환경이라는 뜻이죠. 세 번째, the decisions people make에서는 목적격 관계대명사 that이 생략되어 있습니다. people make가 앞의 decisions를 수식하는 관계절이며, 선행사가 관계절 안에서 목적어일 때 생략이 가능합니다. 네 번째, how 이하가 완전한 절을 이루며 highlights의 목적어로 쓰인 의문사절입니다. 어떻게 영향을 미칠 수 있는지를 강조하는 명사절이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알고리즘은,\u003c/span>\u003cspan class=\"en\">Algorithms are,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">본질적으로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">essence\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정교한 설계자이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sophisticated \u003c/span>\u003cspan class=\"tgt\">architects \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 디지털 환경의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">digital \u003c/span>\u003cspan class=\"tgt\">environments\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">알고리즘은 본질적으로 우리 디지털 환경의 정교한 설계자이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 알고리즘을 \u003cb class=\"key\">디지털 \u003c/b>\u003cb class=\"key\">환경\u003c/b>의 \u003cb class=\"key\">정교한 \u003c/b>\u003cb class=\"key\">설계자\u003c/b>에 비유한 문장이다. 'in essence'는 \u003cb class=\"key\">본질적으로\u003c/b>라는 뜻으로, 알고리즘의 실제 역할을 강조한다. 앞 문장의 선택 구조 개념을 디지털 맥락에 연결하며, 뒤에서 넛지와 조작 가능성을 논할 핵심 비유가 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">삽입 부사구(전치사구)\u003c/span> : Algorithms are, in essence, sophisticated architects : \"본질적으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장과 전치사구의 명사 수식\u003c/span> : S(Algorithms) + V(are) + C(sophisticated architects) + 전치사구(of our digital environments) : \"우리 디지털 환경의 정교한 설계자\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Algorithms are, 알고리즘은. in essence, 본질적으로. sophisticated architects, 정교한 설계자이다. of our digital environments, 우리 디지털 환경의. 이 문장 전체를 해석하면, 알고리즘은 본질적으로 우리 디지털 환경의 정교한 설계자이다.","hl":"m"},{"n":16,"text":"알고리즘을 디지털 환경의 정교한 설계자에 비유한 문장입니다. in essence는 본질적으로라는 뜻으로, 알고리즘의 실제 역할을 강조합니다. 앞 문장의 선택 구조 개념을 디지털 맥락에 연결하며, 뒤에서 넛지와 조작 가능성을 논할 핵심 비유가 됩니다.","hl":"mn"},{"n":17,"text":"첫 번째, sophisticated architects of our digital environments는 보어 역할을 하는 명사구이고, of our digital environments는 architects를 뒤에서 수식하는 전치사구입니다. are는 이형식 동사로 주격보어를 취합니다. 두 번째, in essence는 전치사구가 문장 중간에 삽입되어 본질적으로라는 뜻으로 문장 전체를 수식합니다. 삽입구는 콤마로 분리되어 있어도 문장의 핵심 구조에는 영향을 주지 않습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선별함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">curating \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 보는 것, 추천받는 것, 그리고 어떤 옵션이 우리에게 제시되는지,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">see, \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">recommended, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">options \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">presented \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 미묘하게, 때로는 그렇게 미묘하지 않게,\u003c/span>\u003cspan class=\"en\">they subtly, and sometimes not so subtly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 가볍게 자극한다\u003c/span>\u003cspan class=\"en\">nudge us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정 경로로 향하도록\u003c/span>\u003cspan class=\"en\">towards particular paths.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 무엇을 보고, 무엇을 추천받으며, 어떤 옵션이 우리에게 제시되는지를 선별함으로써, 그것들은 미묘하게, 때로는 그렇게 미묘하지 않게 우리를 특정 경로로 향하도록 가볍게 자극한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 알고리즘이 무엇을 보여주고 추천하고 제시하는지 \u003cb class=\"key\">선별\u003c/b>함으로써 우리를 특정 방향으로 \u003cb class=\"key\">넛지\u003c/b>한다는 구체적 작동 방식을 설명한다. 'subtly, and sometimes not so subtly'는 미묘하게 또는 노골적으로 영향을 준다는 뜻으로, 알고리즘의 영향력이 단순하지 않음을 보여준다. 이는 넛지의 \u003cb class=\"key\">이중적 \u003c/b>\u003cb class=\"key\">성격\u003c/b>을 논하는 다음 문장으로 이어진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구를 이끄는 전치사 by의 부사적 용법(수단)\u003c/span> : By + 동명사구(curating + 명사절들) : \"~을 선별함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 what 명사절의 병렬\u003c/span> : what + S + V, what + S + V, and what + S + V : \"우리가 보는 것, 추천받는 것, 제시되는 옵션\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사절 내 수동태\u003c/span> : what + S + be + p.p.(recommended) : \"우리가 추천받는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be + p.p.(presented) + to + 행위자(us) : \"우리에게 제시되다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"By curating, 선별함으로써. what we see, what we are recommended, and what options are presented to us, 우리가 보는 것, 추천받는 것, 그리고 어떤 옵션이 우리에게 제시되는지. they subtly, and sometimes not so subtly, 그것들은 미묘하게, 때로는 그렇게 미묘하지 않게. nudge us, 우리를 가볍게 자극한다. towards particular paths, 특정 경로로 향하도록. 이 문장 전체를 해석하면, 우리가 무엇을 보고, 무엇을 추천받으며, 어떤 옵션이 우리에게 제시되는지를 선별함으로써, 그것들은 미묘하게, 때로는 그렇게 미묘하지 않게 우리를 특정 경로로 향하도록 가볍게 자극한다.","hl":"m"},{"n":19,"text":"알고리즘이 무엇을 보여주고 추천하고 제시하는지 선별함으로써 우리를 특정 방향으로 넛지한다는 구체적 작동 방식을 설명합니다. subtly and sometimes not so subtly는 미묘하게 또는 노골적으로 영향을 준다는 뜻으로, 알고리즘의 영향력이 단순하지 않음을 보여줍니다. 이는 넛지의 이중적 성격을 논하는 다음 문장으로 이어집니다.","hl":"mn"},{"n":20,"text":"첫 번째, By curating은 전치사 by가 동명사 curating을 취하여 무엇을 선별함으로써라는 수단을 나타냅니다. 전치사와 동명사가 결합한 형태는 부사구 역할을 합니다. 두 번째, what we see, what we are recommended, and what options are presented to us는 what이 이끄는 명사절 세 개가 and로 병렬되어 curating의 목적어로 쓰였습니다. 세 번째, what we are recommended는 수동태로, 우리가 추천을 받는 입장임을 나타냅니다. 네 번째, are presented to us도 수동태인데, to를 써서 우리에게 제시된다는 방향성을 더했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">넛지가 사용될 수 있지만\u003c/span>\u003cspan class=\"en\">While nudges \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">used\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유익한 목적으로\u003c/span>\u003cspan class=\"en\">for beneficial purposes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 건강한 습관을 권장하는 것과 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">encouraging \u003c/span>\u003cspan class=\"tgt\">healthier \u003c/span>\u003cspan class=\"tgt\">habits\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 또한 조작의 가능성을 지니고\u003c/span>\u003cspan class=\"en\">they also carry the potential for manipulation,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특히 설계자의 근본적인 목표가\u003c/span>\u003cspan class=\"en\">particularly when the underlying objectives of the architects\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일치하지 않을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">aligned \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인의 복지나 자율성과\u003c/span>\u003cspan class=\"en\">the well-being or autonomy of the individual.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">넛지(가벼운 자극)는 더 건강한 습관을 권장하는 것과 같이 유익한 목적으로 사용될 수 있지만, 특히 설계자의 잠재적인 목표가 개인의 복지나 자율성과 일치하지 않을 때 그것들은 조작의 가능성 또한 내포하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 넛지가 유익할 수도 있지만 조작 가능성도 있다는 대조를 제시하며, 특히 설계자의 목표가 개인의 복지·자율성과 어긋날 때 위험해진다는 조건을 덧붙입니다. 앞서 알고리즘이 우리를 특정 경로로 \u003cb class=\"key\">넛지\u003c/b>한다고 했는데, 그 넛지가 항상 좋은 방향은 아니라고 전환하는 역할을 해요. \u003cb class=\"key\">조작\u003c/b>의 가능성은 개인의 \u003cb class=\"key\">자율성\u003c/b>과 대비되며, 이후 인간 주체성 보호라는 질문으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can이 포함된 수동태\u003c/span> : can + be used (과거분사) : \"사용될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">such as + 동명사구\u003c/span> : such as + encouraging healthier habits (동명사구) : \"더 건강한 습관을 권장하는 것과 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be aligned with(~와 일치하다)의 수동태\u003c/span> : 주어 + are not aligned with + 목적어 : \"~와 일치하지 않다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"While nudges can be used, 넛지가 사용될 수 있지만. for beneficial purposes, 유익한 목적으로. such as encouraging healthier habits, 더 건강한 습관을 권장하는 것과 같은. they also carry the potential for manipulation, 그것들은 또한 조작의 가능성을 지니고. particularly when the underlying objectives of the architects, 특히 설계자의 근본적인 목표가. are not aligned with, 일치하지 않을 때. the well-being or autonomy of the individual, 개인의 복지나 자율성과. 이 문장 전체를 해석하면, 넛지(가벼운 자극)는 더 건강한 습관을 권장하는 것과 같이 유익한 목적으로 사용될 수 있지만, 특히 설계자의 잠재적인 목표가 개인의 복지나 자율성과 일치하지 않을 때 그것들은 조작의 가능성 또한 내포하고 있다.","hl":"m"},{"n":22,"text":"이 문장은 넛지가 건강 습관처럼 좋은 목적으로도 쓰이지만, 조작 가능성도 함께 지닌다는 대조를 보여줍니다. 특히 설계자의 근본적인 목표가 개인의 복지나 자율성과 일치하지 않을 때 조작의 위험이 커진다는 조건을 덧붙이고 있어요. 여기서 조작이라는 말은 개인의 자율성과 대비되면서, 다음에 나오는 인간 주체성 보호라는 질문으로 자연스럽게 이어집니다.","hl":"mn"},{"n":23,"text":"첫 번째, can be used는 조동사 can 다음에 be used가 온 수동태 표현입니다. 주어 넛지가 스스로 사용하는 주체가 아니라 사용되는 대상이기 때문에 수동태를 쓴 거예요. 두 번째, such as encouraging healthier habits에서 such as는 예시를 들 때 쓰는 표현이고 뒤에 동명사 encouraging이 왔습니다. 동명사구가 such as의 목적어 역할을 하는 거죠. 세 번째, are not aligned with는 be aligned with가 수동태로 쓰여 일치하지 않다라는 뜻이 됩니다. 설계자의 목표가 개인의 복지나 자율성과 맞지 않는다는 의미로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 질문은 다음과 같다\u003c/span>\u003cspan class=\"en\">The question then becomes:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 우리가 인간의 주체성을 기르고 보호할 수 있을까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">cultivate \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">protect \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">agency\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 알고리즘화되는 세상에서?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">increasingly \u003c/span>\u003cspan class=\"tgt\">algorithmic \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 질문은 다음과 같다. 점점 더 알고리즘화되는 세상에서 우리는 어떻게 인간의 주체성을 기르고 보호할 수 있을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 언급한 넛지의 양면성을 바탕으로, 점점 더 알고리즘이 지배하는 세상에서 우리가 어떻게 인간적 주체성을 지킬 것인지라는 글의 중심 질문을 던집니다. 'the question then becomes'는 논의를 문제 제기로 전환하는 표현입니다. \u003cb class=\"key\">human \u003c/b>\u003cb class=\"key\">agency\u003c/b>는 이후 문장들이 설명할 핵심 개념으로, 여기서는 점점 더 \u003cb class=\"key\">알고리즘화된\u003c/b> 세상 속에서 스스로 선택하는 힘을 뜻해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 how + 조동사 can + 주어 we의 의문문\u003c/span> : How + can + we + cultivate and protect + our human agency? : \"우리가 어떻게 우리의 인간 주체성을 기르고 보호할 수 있을까?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 in + 명사구\u003c/span> : in + an [increasingly algorithmic] world : \"점점 더 알고리즘화되는 세상에서\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The question then becomes, 그러면 질문은 다음과 같다. how can we cultivate and protect our human agency, 어떻게 우리가 인간의 주체성을 기르고 보호할 수 있을까. in an increasingly algorithmic world?, 점점 더 알고리즘화되는 세상에서?. 이 문장 전체를 해석하면, 그러면 질문은 다음과 같다. 점점 더 알고리즘화되는 세상에서 우리는 어떻게 인간의 주체성을 기르고 보호할 수 있을까?","hl":"m"},{"n":25,"text":"이 문장은 논의를 본격적인 질문으로 전환하는 역할을 합니다. 점점 더 알고리즘화되는 세상에서 우리가 어떻게 인간 주체성을 기르고 보호할 수 있을지를 묻고 있어요. 여기서 인간 주체성이라는 표현이 이 글의 핵심 개념이고, 뒤 문장들은 그 방법을 설명합니다.","hl":"mn"},{"n":26,"text":"첫 번째, how can we cultivate and protect our human agency는 의문사 how가 앞에 오고 조동사 can이 주어 we 앞으로 간 의문문 어순입니다. how는 방법을 묻는 의문사이고, cultivate와 protect는 and로 병렬 연결되어 공통 목적어 our human agency를 받아요. 두 번째, in an increasingly algorithmic world는 전치사 in이 이끄는 전치사구입니다. increasingly가 algorithmic을 수식하고, algorithmic이 world를 수식하는 구조로 되어 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 의식적인 노력을 필요로 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">requires \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">conscious \u003c/span>\u003cspan class=\"tgt\">effort \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비판적인 관계를 유지하려는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">maintain \u003c/span>\u003cspan class=\"tgt\">critical \u003c/span>\u003cspan class=\"tgt\">engagement\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 사용하는 기술과\u003c/span>\u003cspan class=\"en\">with \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">technologies \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">use\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 우리가 사용하는 기술과 비판적인 관계를 유지하려는 의식적인 노력을 필요로 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 질문에 대한 첫 번째 답으로, 인간 주체성을 지키려면 기술을 무비판적으로 사용하지 말고 의식적으로 비판적 관계를 유지해야 한다고 말합니다. it은 앞서 제기된 질문, 즉 주체성 보호를 가리키며, \u003cb class=\"key\">의식적인 \u003c/b>\u003cb class=\"key\">노력\u003c/b>이 필요하다는 당위를 제시합니다. \u003cb class=\"key\">critical \u003c/b>\u003cb class=\"key\">engagement\u003c/b>는 단순한 기술 사용을 넘어 추천과 환경을 따져 보는 태도를 뜻해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 It + 진주어 to부정사구\u003c/span> : It(가주어) + requires + a conscious effort + to maintain... (진주어) : \"비판적인 관계를 유지하는 것은 의식적인 노력을 필요로 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : the technologies (that/which) + we use : \"우리가 사용하는 기술\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"It requires a conscious effort, 그것은 의식적인 노력을 필요로 한다. to maintain critical engagement, 비판적인 관계를 유지하려는. with the technologies we use, 우리가 사용하는 기술과. 이 문장 전체를 해석하면, 그것은 우리가 사용하는 기술과 비판적인 관계를 유지하려는 의식적인 노력을 필요로 한다.","hl":"m"},{"n":28,"text":"이 문장은 바로 앞의 질문에 대한 첫 번째 답변입니다. 인간 주체성을 지키려면 우리가 사용하는 기술과 비판적인 관계를 유지하려는 의식적인 노력이 필요하다고 말해요. 여기서 말하는 비판적 관계는 기술을 무비판적으로 따르지 않고 능동적으로 따져 보는 태도를 뜻합니다.","hl":"mn"},{"n":29,"text":"첫 번째, It requires a conscious effort to maintain critical engagement 구문은 가주어 It과 진주어 to부정사 구조입니다. 문장의 실질적인 주어는 to maintain 이하인데, 주어가 길기 때문에 It을 앞에 세우고 진짜 주어를 뒤로 보낸 거예요. 두 번째, the technologies we use는 선행사 the technologies를 수식하는 목적격 관계대명사가 생략된 표현입니다. we use 뒤에 목적어가 없어서 관계대명사 that이나 which가 생략되었음을 알 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 의미한다\u003c/span>\u003cspan class=\"en\">It \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">means \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적극적으로 다양한 관점을 찾는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">actively \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">seeking \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">diverse \u003c/span>\u003cspan class=\"tgt\">perspectives, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알고리즘의 추천에 도전하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">challenging \u003c/span>\u003cspan class=\"tgt\">algorithmic \u003c/span>\u003cspan class=\"tgt\">recommendations, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 의도적인 선택을 하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">deliberate \u003c/span>\u003cspan class=\"tgt\">choices\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예측된 흐름에 반하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">against \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">predicted \u003c/span>\u003cspan class=\"tgt\">grain\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 적극적으로 다양한 관점을 찾고, 알고리즘의 추천에 도전하며, 예측된 흐름에 반하는 의도적인 선택을 하는 것을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 의식적인 노력을 구체화하는 문장이다. 알고리즘이 보여주는 추천 흐름에 수동적으로 따르지 말고, 다양한 관점을 찾고 추천에 반하는 선택을 통해 \u003cb class=\"key\">알고리즘 \u003c/b>\u003cb class=\"key\">예측의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>을 거슬러야 한다고 조언한다. 특히 predicted grain은 알고리즘이 예측한 \u003cb class=\"key\">소비 \u003c/b>\u003cb class=\"key\">경향\u003c/b>을 뜻하는 비유적 표현이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">mean + 동명사구 (목적어)\u003c/span> : mean [타동사] + [actively seeking out diverse perspectives (동명사구/목적어)] : \"적극적으로 찾는 것을 의미한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구의 병렬 구조\u003c/span> : seeking A, challenging B, and making C : \"다양한 관점을 찾는 것, 알고리즘의 추천에 도전하는 것, 의도적인 선택을 하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : choices [선행사] + that [주격 관계대명사] go against the predicted grain : \"예측된 흐름에 반하는\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"It means, 그것은 의미한다. actively seeking out diverse perspectives, 적극적으로 다양한 관점을 찾는 것을. challenging algorithmic recommendations, 알고리즘의 추천에 도전하는 것을. and making deliberate choices, 그리고 의도적인 선택을 하는 것을. that go against the predicted grain, 예측된 흐름에 반하는. 이 문장 전체를 해석하면, 이는 적극적으로 다양한 관점을 찾고, 알고리즘의 추천에 도전하며, 예측된 흐름에 반하는 의도적인 선택을 하는 것을 의미한다.","hl":"m"},{"n":31,"text":"이 문장은 앞에서 말한 의식적인 노력이 구체적으로 무엇인지 알려줍니다. 알고리즘이 우리 성향을 예측해서 보여주는 추천 흐름, 즉 predicted grain을 그냥 따르지 말고, 다양한 관점을 적극적으로 찾고 추천에 도전하며, 예측된 흐름을 거스르는 의도적 선택을 하라는 조언입니다. 핵심은 알고리즘의 예측에 수동적으로 끌려가지 않고 주체적으로 움직인다는 데 있습니다.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 means actively seeking out입니다. mean은 여기서 의미하다라는 뜻으로 목적어에 동명사구 seeking out을 취합니다. mean to 부정사는 의도하다라는 뜻이 되므로 해석에 주의해야 합니다. 두 번째 어법 포인트는 seeking, challenging, making의 병렬 구조입니다. 셋 다 동명사로 A, B, and C 형태로 연결되어 있습니다. 세 번째 어법 포인트는 that go against the predicted grain입니다. 이 that은 choices를 수식하는 주격 관계대명사로, 뒤에 동사 go가 왔습니다. 주격 관계대명사 that은 사람과 사물 모두 수식할 수 있고, 여기서는 사물인 choices를 수식합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 건전한 회의론을 기르는 것을 포함한다\u003c/span>\u003cspan class=\"en\">It involves \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">cultivating \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">healthy \u003c/span>\u003cspan class=\"tgt\">skepticism \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알고리즘의 겉보기에 객관적인 결과물에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">towards \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">seemingly \u003c/span>\u003cspan class=\"tgt\">objective \u003c/span>\u003cspan class=\"tgt\">outputs \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">algorithms \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 기억하는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">remembering\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 시스템이 특정 목표를 가진 인간에 의해 설계되었다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">systems \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">designed \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">humans \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">specific \u003c/span>\u003cspan class=\"tgt\">goals\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그 데이터는 과거 현실의 반영이라는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">data \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">reflection \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">past \u003c/span>\u003cspan class=\"tgt\">realities\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반드시 미래의 번영을 위한 처방은 아닌\u003c/span>\u003cspan class=\"en\">not necessarily a prescription for future flourishing.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 알고리즘의 겉보기에 객관적인 결과물에 대해 건전한 회의론을 기르고, 이러한 시스템이 특정 목표를 가진 인간에 의해 설계되었으며, 그 데이터는 과거 현실의 반영일 뿐 반드시 미래의 번영을 위한 처방은 아니라는 점을 기억하는 것을 포함한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 알고리즘의 겉보기에 객관적인 결과물에 대한 \u003cb class=\"key\">건전한 \u003c/b>\u003cb class=\"key\">회의론\u003c/b>을 갖는 것이 주체성 보호의 핵심이라고 말한다. 알고리즘 시스템은 특정 목표를 가진 인간이 설계한 것이며, 그 데이터는 과거 현실의 반영일 뿐 \u003cb class=\"key\">미래 \u003c/b>\u003cb class=\"key\">번영을 \u003c/b>\u003cb class=\"key\">보장하는 \u003c/b>\u003cb class=\"key\">처방\u003c/b>이 아니다. 겉으로 객관적인 정보처럼 보여도 그 뒤에 설계 의도가 숨어 있음을 기억하라는 것이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구의 병렬 구조\u003c/span> : involve [동명사구] + cultivating A and remembering B : \"건전한 회의론을 기르는 것과 기억하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : remembering that [완전한 절: these systems are designed ...] : \"이러한 시스템이 특정 목표를 가진 인간에 의해 설계되었다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태 (be designed by)\u003c/span> : be designed by + 행위자 [humans with specific goals] : \"특정 목표를 가진 인간에 의해 설계된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that (병렬)\u003c/span> : remembering that [절] and that [절] : \"그리고 그 데이터는 과거 현실의 반영이라는 것을\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"It involves cultivating a healthy skepticism, 그것은 건전한 회의론을 기르는 것을 포함한다. towards the seemingly objective outputs of algorithms, 알고리즘의 겉보기에 객관적인 결과물에 대해. and remembering, 그리고 기억하는 것을. that these systems are designed by humans with specific goals, 이러한 시스템이 특정 목표를 가진 인간에 의해 설계되었다는 것을. and that their data is a reflection of past realities, 그리고 그 데이터는 과거 현실의 반영이라는 것을. not necessarily a prescription for future flourishing, 반드시 미래의 번영을 위한 처방은 아닌. 이 문장 전체를 해석하면, 그것은 알고리즘의 겉보기에 객관적인 결과물에 대해 건전한 회의론을 기르고, 이러한 시스템이 특정 목표를 가진 인간에 의해 설계되었으며, 그 데이터는 과거 현실의 반영일 뿐 반드시 미래의 번영을 위한 처방은 아니라는 점을 기억하는 것을 포함한다.","hl":"m"},{"n":34,"text":"이 문장은 알고리즘 세계에서 주체성을 지키는 두 번째 태도를 말합니다. 알고리즘 결과물이 객관적으로 보여도 그 이면에는 인간의 목표와 데이터 선택이 숨어 있으므로 건전한 회의론을 가져야 합니다. 특히 데이터는 과거 현실의 반영일 뿐 미래의 번영을 보장하는 처방이 아니라는 점을 기억하라는 것입니다.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 cultivating과 remembering의 병렬입니다. involves는 목적어로 동명사를 취하고, 두 개의 동명사구가 and로 연결됐습니다. 두 번째 어법 포인트는 that these systems are designed by humans with specific goals입니다. 여기서 that은 remembering의 목적어 역할을 하는 명사절을 이끄는 접속사이고, 이 절 안에는 are designed by로 수동태가 쓰였습니다. 세 번째 어법 포인트는 and that their data is a reflection of past realities입니다. 이 that도 앞의 that절과 병렬로 연결된 명사절 접속사입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">선택 \u003c/b>\u003cb class=\"key\">구조\u003c/b>는 선택이 이루어지는 환경의 설계가 사람들의 결정에 큰 영향을 미친다고 강조한다.\u003c/li>\u003cli>알고리즘은 우리 디지털 환경의 \u003cb class=\"key\">설계자\u003c/b>로서 정보를 선별해 우리를 특정 경로로 \u003cb class=\"key\">넛지\u003c/b>한다.\u003c/li>\u003cli>넛지는 유익할 수 있지만 설계자의 목표가 개인의 \u003cb class=\"key\">복지\u003c/b>나 \u003cb class=\"key\">자율성\u003c/b>과 어긋나면 \u003cb class=\"key\">조작\u003c/b> 가능성이 있다.\u003c/li>\u003cli>따라서 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">주체성\u003c/b>을 보호하려면 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">관여\u003c/b>와 \u003cb class=\"key\">건전한 \u003c/b>\u003cb class=\"key\">회의론\u003c/b>을 바탕으로 한 의도적 선택이 필요하다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>In an increasingly algorithmic world, protecting human agency requires conscious critical engagement with technology, including seeking diverse perspectives, challenging recommendations, and maintaining healthy skepticism toward algorithm outputs.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">선택 구조를 설계하는 \u003cb class=\"key\">알고리즘\u003c/b>은 우리가 보는 정보를 선별하며 \u003cb class=\"key\">넛지\u003c/b>하지만, 설계자의 목표가 개인의 \u003cb class=\"key\">복지\u003c/b>와 \u003cb class=\"key\">자율성\u003c/b>에 어긋나면 \u003cb class=\"key\">조작\u003c/b>이 될 수 있다. 따라서 \u003cb class=\"key\">비판적 \u003c/b>\u003cb class=\"key\">관여\u003c/b>와 \u003cb class=\"key\">건전한 \u003c/b>\u003cb class=\"key\">회의론\u003c/b>으로 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">주체성\u003c/b>을 길러야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"오늘 지문의 핵심은 알고리즘의 선택 설계가 우리를 넛지하지만 우리의 주체성을 반
