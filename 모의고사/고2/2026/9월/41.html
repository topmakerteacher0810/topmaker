</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 41~42번","audioDir":"41_audio","preview":false,"count":52,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.707em\">41~42번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Why a Patch of Cells Can Share the Same Mutation\u003c/h1>\u003ch2>한 세포 집단이 같은 돌연변이를 공유하는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">게놈 \u003c/b>\u003cb class=\"key\">복제\u003c/b>가 반복되면 \u003cb class=\"key\">오류\u003c/b>가 쌓여 변이가 누적되며, 대부분의 변이는 무해하지만 일부는 홍채 색 이상이나 \u003cb class=\"key\">모반\u003c/b>처럼 \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">집단\u003c/b>에 동시에 나타난다. 그 이유는 \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">계보\u003c/b> 초기의 변이가 해당 세포 집단 전체에 공유되기 때문이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Repeated genome copying accumulates mutations, and a mutation early in cell lineage can affect a whole patch of cells.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 전국연합학력평가 지문을 함께 공부해 볼게요. 이 글은 게놈 복제 과정에서 생기는 변이가 어떻게 쌓이고, 왜 일부 세포 집단에 동시에 나타나는지를 설명합니다. 핵심 요지는 반복된 게놈 복제가 변이를 축적하고, 세포 계보 초기의 변이가 세포 집단 전체에 공유된다는 겁니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리 몸의 세포는 분열할 때마다 \u003cb class=\"key\">게놈\u003c/b> genome을 복제하는데, 이 과정은 책을 손으로 베껴 쓰는 일과 비슷합니다. 복제가 반복되면 \u003cb class=\"key\">염색체\u003c/b> chromosome에 작은 \u003cb class=\"key\">오류\u003c/b> error가 생깁니다. 대부분의 오류는 무해하지만, 유전자에 생긴 변이는 단백질 기능을 바꿀 수도 있어요. 특히 발생 초기의 세포 하나에 생긴 변이는 그 세포가 분열해 만든 모든 후손 세포에 전해집니다. 이렇게 한 세포에서 갈라져 나온 계보를 \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">계보\u003c/b> cell lineage라고 하고, 조직이 완전히 분화된 상태 differentiated state에 이를 때까지 이어집니다. 예를 들어, 한 번 잘못 찍힌 도장이 여러 장의 종이에 같은 흔적을 남기는 것과 같습니다.\u003c/div>","segs":[{"n":2,"text":"우리 몸의 세포가 분열할 때마다 게놈을 복제하는데, 이 과정은 책을 손으로 베껴 쓰는 일과 비슷합니다. 복제가 반복되면 염색체에 작은 오류가 생겨요. 대부분의 오류는 아무런 해가 없지만, 유전자에 생긴 변이는 단백질 기능을 바꾸기도 합니다. 특히 발생 초기의 세포 하나에 생긴 변이는 그 세포가 분열해서 만든 모든 후손 세포에 전해집니다. 이렇게 한 세포에서 갈라져 나온 계보를 cell lineage라고 하고, 조직이 완전히 분화된 상태에 이를 때까지 이어집니다. 예를 들어, 잘못 찍힌 도장이 여러 장의 종이에 같은 흔적을 남기는 것과 같습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>게놈 복제 오류의 누적\u003csmall>도입·주장 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>우리 몸에서 \u003cb class=\"key\">게놈 \u003c/b>\u003cb class=\"key\">복제\u003c/b>가 일어날 때마다 적어도 한 쌍의 \u003cb class=\"key\">염색체\u003c/b>에 오류가 생길 확률이 약 칠십 퍼센트에 이릅니다. 복제가 반복될수록 이런 \u003cb class=\"key\">오류\u003c/b>가 \u003cb class=\"key\">축적\u003c/b>됩니다. 이는 변이의 기본적인 발생과 누적 원리를 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>중세 필사본의 비유\u003csmall>비유·근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>이 현상은 \u003cb class=\"key\">중세 \u003c/b>\u003cb class=\"key\">서적\u003c/b>의 변화와 유사합니다. 손으로 복사할 때마다 우연히 변화가 생기고, 그 변화가 쌓이면서 복사본은 \u003cb class=\"key\">원본\u003c/b>과 다른 의미를 갖게 됩니다. 마찬가지로 더 많이 복제된 \u003cb class=\"key\">게놈\u003c/b>일수록 더 많은 \u003cb class=\"key\">실수\u003c/b>를 갖게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>복구 유전자의 훼손\u003csmall>심화·인과 · 문장 6\u003c/small>\u003c/h4>\u003cp>설상가상으로 변이는 \u003cb class=\"key\">오류 \u003c/b>\u003cb class=\"key\">확인과 \u003c/b>\u003cb class=\"key\">복구\u003c/b>를 담당하는 유전자를 훼손할 수 있습니다. 그렇게 되면 \u003cb class=\"key\">변이\u003c/b> 도입이 더욱 가속됩니다. 오류를 잡아 주는 장치마저 고장 나는 셈이지요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>무해한 변이와 눈에 띄는 변이\u003csmall>예시·대조 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>대부분의 \u003cb class=\"key\">게놈 \u003c/b>\u003cb class=\"key\">변이\u003c/b>는 뚜렷한 영향이 없습니다. 마치 kingdom에서 i를 y로 바꿔도 단어의 \u003cb class=\"key\">가독성\u003c/b>이 유지되는 것과 같습니다. 그러나 때때로 변이는 \u003cb class=\"key\">홍채\u003c/b>가 두 가지 색을 띠는 눈을 만들거나, 피부에 \u003cb class=\"key\">모반\u003c/b>을 만듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>세포 계보의 원리\u003csmall>질문·답변 · 문장 11–13\u003c/small>\u003c/h4>\u003cp>그렇다면 변이가 특정 세포 하나에만 생겼는데 왜 여러 세포로 이루어진 \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">집단\u003c/b>이 동시에 영향을 받을까요? 답은 \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">계보\u003c/b>에 있습니다. 조직이 발달하는 초기 단계에서 변이가 생기면, 그 세포가 분열해 만들어진 모든 후손 세포가 그 \u003cb class=\"key\">변이\u003c/b>를 물려받습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 다섯 단계로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 게놈 복제 오류의 누적입니다. 우리 몸에서 게놈 복제가 일어날 때마다 적어도 한 쌍의 염색체에 오류가 생길 확률이 약 칠십 퍼센트에 이릅니다. 복제가 반복될수록 이런 오류가 축적됩니다. 이는 변이의 기본적인 발생과 누적 원리를 보여 줍니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 중세 필사본의 비유입니다. 이 현상은 중세 서적의 변화와 비슷합니다. 손으로 복사할 때마다 우연히 변화가 생기고, 그 변화가 쌓이면서 복사본은 원본과 다른 뜻을 갖게 됩니다. 마찬가지로 더 많이 복제된 게놈일수록 더 많은 실수를 갖게 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 복구 유전자의 훼손입니다. 설상가상으로 변이는 오류 확인과 복구를 담당하는 유전자를 손상시킬 수 있습니다. 그러면 변이 도입이 더욱 가속됩니다. 오류를 잡아 주는 장치마저 고장 나는 셈이지요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 무해한 변이와 눈에 띄는 변이입니다. 대부분의 게놈 변이는 뚜렷한 영향이 없습니다. 마치 kingdom에서 i를 y로 바꿔도 단어의 가독성이 유지되는 것과 같습니다. 그러나 때때로 변이는 홍채가 두 가지 색을 띠는 눈을 만들거나 피부에 모반을 만듭니다.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 세포 계보의 원리입니다. 변이가 특정 세포 하나에만 생겼는데 왜 여러 세포로 이루어진 세포 집단이 동시에 영향을 받을까요. 답은 세포 계보에 있습니다. 조직이 발달하는 초기 단계에서 변이가 생기면, 그 세포가 분열해 만든 모든 후손 세포가 그 변이를 물려받습니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫째 문단에서 \u003cb class=\"key\">게놈 \u003c/b>\u003cb class=\"key\">복제\u003c/b>가 반복될수록 \u003cb class=\"key\">오류\u003c/b>가 쌓인다는 핵심 주장을 먼저 제시합니다. 이후 \u003cb class=\"key\">중세 \u003c/b>\u003cb class=\"key\">서적\u003c/b>의 필사 비유와 \u003cb class=\"key\">변이\u003c/b>의 예시, \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">계보\u003c/b>의 원리를 통해 주장을 뒷받침합니다. 따라서 핵심 문장이 앞부분에 오는 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Similarly (5)\u003c/b>\u003cspan>앞의 비유를 게놈에 적용\u003c/span>\u003cb>To make things worse (6)\u003c/b>\u003cspan>상황 악화 추가\u003c/span>\u003cb>But (9)\u003c/b>\u003cspan>무해한 변이에서 눈에 띄는 변이로 전환\u003c/span>\u003cb>If (11)\u003c/b>\u003cspan>의문 제기\u003c/span>\u003cb>The answer lies in (12)\u003c/b>\u003cspan>답변 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">error\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">alterations\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">changes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mistakes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mutations\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>대부분의 변이\u003c/th>\u003cth>일부 변이\u003c/th>\u003c/tr>\u003ctr>\u003ctd>뚜렷한 효과가 없다\u003c/td>\u003ctd>홍채 색 이상이나 모반 등 눈에 띈다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>개별 세포 수준에 그침\u003c/td>\u003ctd>세포 계보를 통해 세포 집단에 동시에 나타난다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 주장과 근거 구조로 되어 있고, 첫머리에서 핵심 주장을 먼저 제시하는 두괄식입니다. 첫 문단에서 게놈 복제가 반복될수록 오류가 쌓인다고 말하고, 뒤에서 중세 서적의 비유와 변이 사례, 세포 계보의 원리로 근거를 보강합니다. 따라서 핵심 문장은 두 번째 문장에 해당하고, 나머지는 이를 뒷받침하는 전개라고 볼 수 있어요.","hl":"ty"},{"n":10,"text":"전개 신호어를 보면, Similarly는 앞의 비유를 게놈에 적용하고, To make things worse는 상황이 더 나빠진다는 뜻으로 변이 가속을 덧붙입니다. But은 무해한 변이에서 눈에 띄는 변이로 전환해 주고요. 마지막에 If로 질문을 던진 뒤 The answer lies in으로 답을 제시하는 질문 답변 흐름을 확인할 수 있습니다. 같은 개념은 error에서 alterations, changes, mistakes, mutations로 표현이 바뀌어 가며 반복되고요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>genome copying\u003c/b>\u003cem>명사\u003c/em>\u003cspan>게놈 복제\u003c/span>\u003c/div>\u003cdiv>\u003cb>chromosome\u003c/b>\u003cem>명사\u003c/em>\u003cspan>염색체\u003c/span>\u003c/div>\u003cdiv>\u003cb>error\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오류\u003c/span>\u003c/div>\u003cdiv>\u003cb>accumulate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>축적하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>alteration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변화, 변경\u003c/span>\u003c/div>\u003cdiv>\u003cb>medieval\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중세의\u003c/span>\u003c/div>\u003cdiv>\u003cb>copy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>복사본, 사본\u003c/span>\u003c/div>\u003cdiv>\u003cb>by hand\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>손으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>accidentally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>우연히\u003c/span>\u003c/div>\u003cdiv>\u003cb>stack up\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>쌓이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>acquire\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얻다, 획득하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at variance with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 불일치하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>original\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원본\u003c/span>\u003c/div>\u003cdiv>\u003cb>undergo\u003c/b>\u003cem>동사\u003c/em>\u003cspan>겪다, 거치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mistake\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실수\u003c/span>\u003c/div>\u003cdiv>\u003cb>mutation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변이, 돌연변이\u003c/span>\u003c/div>\u003cdiv>\u003cb>make things worse\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>설상가상으로 만들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>damage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>훼손하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>responsible for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 책임지는\u003c/span>\u003c/div>\u003cdiv>\u003cb>error checking and repair\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오류 확인과 복구\u003c/span>\u003c/div>\u003cdiv>\u003cb>accelerate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가속하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>noticeable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>눈에 띄는\u003c/span>\u003c/div>\u003cdiv>\u003cb>readability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가독성\u003c/span>\u003c/div>\u003cdiv>\u003cb>iris\u003c/b>\u003cem>명사\u003c/em>\u003cspan>홍채\u003c/span>\u003c/div>\u003cdiv>\u003cb>birthmark\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모반\u003c/span>\u003c/div>\u003cdiv>\u003cb>multiply\u003c/b>\u003cem>동사\u003c/em>\u003cspan>증식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cell lineage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세포 계보\u003c/span>\u003c/div>\u003cdiv>\u003cb>developmental history\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발달 변천\u003c/span>\u003c/div>\u003cdiv>\u003cb>differentiated state\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분화된 상태\u003c/span>\u003c/div>\u003cdiv>\u003cb>inherit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>물려받다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"핵심 단어를 정리할게요. genome copying은 게놈 복제, chromosome은 염색체, mutation은 변이나 돌연변이라는 뜻입니다. accumulate는 축적하다, damage는 훼손하다, inherit는 물려받다로 꼭 기억하세요. 필사본 비유에 나오는 at variance with는 무엇과 불일치하는이라는 뜻이고, 세포 계보는 cell lineage라고 표현합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">error\u003c/b>\u003cspan class=\"m\">오류\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mistake\u003c/span>\u003cspan class=\"s\">flaw\u003c/span>\u003cspan class=\"s\">fault\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accuracy\u003c/span>\u003cspan class=\"a\">correctness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accumulate\u003c/b>\u003cspan class=\"m\">축적하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">build up\u003c/span>\u003cspan class=\"s\">gather\u003c/span>\u003cspan class=\"s\">collect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">scatter\u003c/span>\u003cspan class=\"a\">disperse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">alteration\u003c/b>\u003cspan class=\"m\">변화\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">change\u003c/span>\u003cspan class=\"s\">modification\u003c/span>\u003cspan class=\"s\">variation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">preservation\u003c/span>\u003cspan class=\"a\">uniformity\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">damage\u003c/b>\u003cspan class=\"m\">훼손하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">harm\u003c/span>\u003cspan class=\"s\">impair\u003c/span>\u003cspan class=\"s\">injure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">repair\u003c/span>\u003cspan class=\"a\">fix\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">noticeable\u003c/b>\u003cspan class=\"m\">눈에 띄는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">visible\u003c/span>\u003cspan class=\"s\">evident\u003c/span>\u003cspan class=\"s\">obvious\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unnoticeable\u003c/span>\u003cspan class=\"a\">subtle\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">multiply\u003c/b>\u003cspan class=\"m\">증식하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">proliferate\u003c/span>\u003cspan class=\"s\">reproduce\u003c/span>\u003cspan class=\"s\">increase\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decrease\u003c/span>\u003cspan class=\"a\">diminish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inherit\u003c/b>\u003cspan class=\"m\">물려받다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">receive\u003c/span>\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"s\">get\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bequeath\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"이제 시험에 자주 나오는 동의어와 반의어를 볼게요. accumulate는 build up이나 gather와 뜻이 가깝고, scatter와 반대입니다. damage는 harm 또는 impair와 바꿔 쓸 수 있고, repair와 반대입니다. noticeable은 visible 또는 evident와 같은 뜻이고, unnoticeable이나 subtle과 반대입니다. multiply는 proliferate와 유사하고, inherit는 receive와 가깝지만 bequeath와 반대 방향입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 몸속 게놈 복제의 각 과정마다\u003c/span>\u003cspan class=\"en\">In each round of genome copying in our body,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 70%의 확률이 여전히 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">still \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">70 \u003c/span>\u003cspan class=\"tgt\">percent \u003c/span>\u003cspan class=\"tgt\">chance\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적어도 한 쌍의 염색체가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">least \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">pair \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">chromosomes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오류를 가질 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">error\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 몸속 게놈 복제의 각 과정마다, 적어도 한 쌍의 염색체들이 오류를 가질 확률이 여전히 약 70%이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 매 게놈 복제마다 오류가 생길 확률이 70%나 된다는 \u003cb class=\"key\">수치\u003c/b>를 제시해, 복제 과정이 결코 완벽하지 않음을 보여 줍니다. 여기서 chance 다음의 \u003cb class=\"key\">that절\u003c/b>은 그 확률의 구체적인 내용을 설명하고, \u003cb class=\"key\">there \u003c/b>\u003cb class=\"key\">is\u003c/b>는 '~가 있다'는 존재의 의미를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there is 구문 (유도부사)\u003c/span> : there is[are] + 수식어 + 주어(명사구) : \"약 70%의 확률이 여전히 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사 뒤 that절 (동격)\u003c/span> : [추상 명사] + that + 완전한 문장 : \"적어도 한 쌍의 염색체가 오류를 가질 것이라는\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"In each round of genome copying in our body, 우리 몸속 게놈 복제의 각 과정마다. there is still about a 70 percent chance, 약 70%의 확률이 여전히 있다. that at least one pair of chromosomes, 적어도 한 쌍의 염색체가. will have an error, 오류를 가질 것이다. 이 문장 전체를 해석하면, 우리 몸속 게놈 복제의 각 과정마다, 적어도 한 쌍의 염색체들이 오류를 가질 확률이 여전히 약 70%이다.","hl":"m"},{"n":14,"text":"이 문장은 게놈 복제가 매번 일어날 때마다 염색체 한 쌍 이상에 오류가 생길 확률이 칠십 퍼센트나 된다는 사실을 수치로 제시합니다. 이 높은 확률은 복제 과정이 결코 완벽하지 않다는 점을 강조하고, 뒤에서 오류가 쌓인다는 설명의 전제가 됩니다. 여기서 chance 다음에 오는 that절은 그 확률의 구체적인 내용을 알려 주는 동격절입니다.","hl":"mn"},{"n":15,"text":"문장 앞부분의 there is는 유도부사 구문입니다. 진짜 주어는 뒤에 있는 a seventy percent chance이고, there는 의미 없이 자리만 잡아 주므로 약 칠십 퍼센트의 확률이 있다고 해석합니다. 두 번째로, chance 다음의 that은 명사 뒤에서 그 내용을 설명하는 동격절입니다. that절 안은 완전한 문장이므로 관계대명사와 다르게 동격의 that으로 봐야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게놈 복제의 각 과정마다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">round \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">genome \u003c/span>\u003cspan class=\"tgt\">copying,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오류들이 쌓인다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">errors \u003c/span>\u003cspan class=\"tgt\">accumulate\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게놈 복제의 각 과정마다, 오류들이 쌓인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 문장은 게놈 복제가 거듭될수록 오류가 \u003cb class=\"key\">축적\u003c/b>된다는 핵심 원리를 압축적으로 제시합니다. 앞 문장의 확률을 바탕으로, 복제 횟수가 많을수록 오류가 단순히 생기는 데 그치지 않고 \u003cb class=\"key\">쌓인다\u003c/b>는 점을 강조합니다. 여기서 \u003cb class=\"key\">with \u003c/b>\u003cb class=\"key\">each \u003c/b>\u003cb class=\"key\">round\u003c/b>는 '매번 복제할 때마다'라는 반복 조건을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 with + 명사구\u003c/span> : with + [명사구] : \"게놈 복제의 각 과정마다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">일반동사 현재 시제\u003c/span> : 주어(복수) + 동사원형 : \"오류들이 쌓인다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"With each round of genome copying, 게놈 복제의 각 과정마다. errors accumulate, 오류들이 쌓인다. 이 문장 전체를 해석하면, 게놈 복제의 각 과정마다, 오류들이 쌓인다.","hl":"m"},{"n":17,"text":"두 번째 문장은 복제가 거듭될 때마다 오류가 축적된다는 이 글의 핵심 원리를 간결하게 요약합니다. 첫 번째 문장에서 확률이 높다는 사실을 제시했다면, 이 문장은 그 오류가 한 번으로 끝나지 않고 누적된다는 점을 강조합니다. 뒤에 나오는 중세 서적의 비유와 몸속 세포의 돌연변이 설명이 모두 이 문장의 원리에서 나옵니다.","hl":"mn"},{"n":18,"text":"첫 번째로, 문장 앞의 with each round는 with가 이끄는 전치사구로, 매번의 복제 과정마다라는 반복 조건을 나타냅니다. 두 번째로, errors accumulate는 복수 주어 errors에 맞춰 동사에 s를 붙이지 않은 현재 시제 문장입니다. accumulate는 오류들이 스스로 쌓이는 자동사이므로 쌓인다로 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은\u003c/span>\u003cspan class=\"en\">This\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~와 유사하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">similar \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중세 서적에 있어서의 변화\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">alterations \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">medieval \u003c/span>\u003cspan class=\"tgt\">books\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 중세 서적에 있어서의 변화와 유사하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 문장은 앞에서 말한 오류 축적을 \u003cb class=\"key\">중세 \u003c/b>\u003cb class=\"key\">서적\u003c/b>의 변화에 비유하기 시작하는 전환 문장입니다. 게놈 복제 오류라는 현대 과학 개념을 당시 사람들이 손으로 책을 베끼며 생긴 \u003cb class=\"key\">변화\u003c/b>와 연결해 독자의 이해를 돕습니다. 이 \u003cb class=\"key\">비유\u003c/b>는 다음 문장에서 구체적으로 설명됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be similar to (숙어)\u003c/span> : be similar to + 명사(구) : \"~와 유사하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 수식\u003c/span> : 명사 + in + 명사구 : \"중세 서적에서의 변화\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"This, 이것은. is similar to, ~와 유사하다. alterations in medieval books, 중세 서적에 있어서의 변화. 이 문장 전체를 해석하면, 이것은 중세 서적에 있어서의 변화와 유사하다.","hl":"m"},{"n":20,"text":"세 번째 문장은 게놈 복제 오류가 중세 서적의 변화와 비슷하다는 비유를 시작하는 전환 문장입니다. 복잡한 유전학 개념을 우리가 아는 역사적 상황에 빗대어 이해하기 쉽게 만들어 줍니다. 이 비유는 바로 다음 문장에서 손으로 책을 베낄 때 생긴 변화로 이어집니다.","hl":"mn"},{"n":21,"text":"첫 번째로, is similar to는 무엇과 유사하다는 뜻의 숙어입니다. to는 전치사라서 뒤에 비교 대상인 alterations in medieval books라는 명사구가 왔습니다. 두 번째로, in medieval books는 앞의 alterations를 뒤에서 수식하는 전치사구입니다. 그래서 중세 서적에서의 변화라고 해석합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 복사본이 사람 손으로 만들어질 때마다\u003c/span>\u003cspan class=\"en\">Each time a copy \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">hand\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일부 변화들이 우연히 도입되었고\u003c/span>\u003cspan class=\"en\">some changes \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">introduced \u003c/span>\u003cspan class=\"tgt\">accidentally\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변화들이 쌓이면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">changes \u003c/span>\u003cspan class=\"tgt\">stacked \u003c/span>\u003cspan class=\"tgt\">up\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">복사본은 원본과 불일치하는 의미를 축적했을 것이다\u003c/span>\u003cspan class=\"en\">the copies \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">acquired\u003c/span> meanings at variance with the original.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하나의 복사본이 사람 손으로 만들어질 때마다, 일부 변화들이 우연히 도입되었고, 변화들이 쌓이면서, 복사본은 원본과 불일치하는 의미를 축적했을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중세 책을 사람 손으로 복사할 때마다 우연한 변화가 생기고, 그 변화가 쌓이면 원본과 다른 의미가 될 수 있다는 비유입니다. 앞 문장의 \u003cb class=\"key\">중세 \u003c/b>\u003cb class=\"key\">책 \u003c/b>\u003cb class=\"key\">변형\u003c/b>을 구체화하여 \u003cb class=\"key\">오류의 \u003c/b>\u003cb class=\"key\">누적\u003c/b>을 설명하고, 다음 문장의 게놈 복제 오류와 연결하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + 과거분사 + by + 행위자 : \"사람 손으로 만들어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + 과거분사 + 부사 : \"우연히 도입되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 as\u003c/span> : as + 주어 + 동사 : \"변화들이 쌓이면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">조동사 + have + 과거분사\u003c/span> : may + have + p.p. : \"획득했을 것이다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Each time a copy was made by hand, 하나의 복사본이 사람 손으로 만들어질 때마다. some changes were introduced accidentally, 일부 변화들이 우연히 도입되었고. as changes stacked up, 변화들이 쌓이면서. the copies may have acquired meanings at variance with the original, 복사본은 원본과 불일치하는 의미를 축적했을 것이다. 이 문장 전체를 해석하면, 하나의 복사본이 사람 손으로 만들어질 때마다, 일부 변화들이 우연히 도입되었고, 변화들이 쌓이면서, 복사본은 원본과 불일치하는 의미를 축적했을 것이다.","hl":"m"},{"n":23,"text":"이 문장은 중세 책을 사람 손으로 복사할 때마다 우연한 오류가 생기고, 그 오류가 쌓이면 원본과 다른 의미가 될 수 있다는 비유예요. 여기서 말하는 변화의 누적이 바로 앞 문장의 alterations in medieval books를 구체화한 거고, 다음 문장의 게놈 오류 누적과 연결됩니다. 결국 복사를 거듭할수록 원래 정보에서 멀어질 수 있다는 점을 보여 주는 거죠.","hl":"mn"},{"n":24,"text":"첫 번째, was made by hand는 수동태로, 책이 만들어진 것이므로 be동사와 과거분사 made가 쓰였어요. 두 번째, were introduced accidentally도 수동태인데, 변화들이 우연히 도입된 것이니까 주어가 변화들이고 도입된 거니까 수동태가 맞습니다. 세 번째, as changes stacked up에서 as는 뭔가가 동시에 일어나는 상황을 이끄는 접속사예요. 네 번째, may have acquired는 과거의 일에 대한 추측을 나타내는 조동사 may와 have 과거분사 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마찬가지로\u003c/span>\u003cspan class=\"en\">Similarly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게놈은\u003c/span>\u003cspan class=\"en\">genomes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 복제 과정들을 거친\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">undergone \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">copying \u003c/span>\u003cspan class=\"tgt\">processes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 실수들을 축적하게 될 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">gathered\u003c/span> more mistakes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마찬가지로, 더 많은 복제 과정들을 거친 게놈은 더 많은 실수들을 축적하게 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중세 책 비유를 게놈에 적용하여, 복제 과정을 더 많이 거친 게놈일수록 더 많은 실수가 쌓인다는 핵심 문장입니다. \u003cb class=\"key\">관계대명사 \u003c/b>\u003cb class=\"key\">that\u003c/b>이 genomes를 수식해 '더 많은 복제 과정을 거친 게놈'을 특정하고, \u003cb class=\"key\">will \u003c/b>\u003cb class=\"key\">have \u003c/b>\u003cb class=\"key\">gathered\u003c/b>로 미래의 누적 결과를 표현합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사절\u003c/span> : 선행사(genomes) + that + 동사 : \"더 많은 복제 과정들을 거친\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 + have + 과거분사\u003c/span> : will + have + p.p. : \"축적하게 될 것이다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Similarly, 마찬가지로. genomes, 게놈은. that have undergone more copying processes, 더 많은 복제 과정들을 거친. will have gathered more mistakes, 더 많은 실수들을 축적하게 될 것이다. 이 문장 전체를 해석하면, 마찬가지로, 더 많은 복제 과정들을 거친 게놈은 더 많은 실수들을 축적하게 될 것이다.","hl":"m"},{"n":26,"text":"이 문장은 앞의 중세 책 비유를 게놈에 그대로 적용한 거예요. 더 많은 복제 과정을 거친 게놈일수록 그만큼 많은 실수가 쌓인다는 뜻입니다. 그래서 복제 횟수와 오류 누적이 비례한다는 핵심 논리를 이 문장이 정리해 주고 있어요.","hl":"mn"},{"n":27,"text":"첫 번째, that have undergone more copying processes는 주격 관계대명사 that이 앞의 genomes를 꾸며 주는 절입니다. 선행사가 사물이고 주격이라 that을 쓴 거예요. 두 번째, will have gathered는 will have 과거분사 형태로, 미래의 어느 시점까지 그 동작이 완료되어 있을 것이라는 뜻을 나타냅니다. 여기서는 복제를 거친 게놈이 미래에는 실수를 더 많이 축적한 상태일 거라는 뉘앙스예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">설상가상으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003cspan class=\"tgt\">worse\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변이들은 유전자를 훼손할 수도 있다\u003c/span>\u003cspan class=\"en\">mutations \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">damage \u003c/span>\u003cspan class=\"tgt\">genes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게놈의 오류 확인과 복구를 책임지는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">responsible \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">error \u003c/span>\u003cspan class=\"tgt\">checking \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">repair \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">genomes\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변이들의 도입을 더욱 가속한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">further \u003c/span>\u003cspan class=\"tgt\">accelerating \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">introduction \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">mutations\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">설상가상으로, 변이들은 게놈의 오류 확인과 복구를 책임지는 유전자를 훼손해 변이들의 도입을 더욱 가속할 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 변이가 오류 수리 유전자를 훼손하면 변이 도입이 더 가속되는 악순환을 설명하는 문장입니다. \u003cb class=\"key\">responsible \u003c/b>\u003cb class=\"key\">for\u003c/b>가 '~을 책임지는' 뜻으로 genes를 수식하고, \u003cb class=\"key\">further \u003c/b>\u003cb class=\"key\">accelerating\u003c/b>은 분사구문으로 결과를 덧붙입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 관용 표현\u003c/span> : To + 동사원형 + 목적어, S+V : \"설상가상으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 may\u003c/span> : may + 동사원형 : \"유전자를 훼손할 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사구의 후치 수식\u003c/span> : 명사(genes) + 형용사구(responsible for...) : \"게놈의 오류 확인과 복구를 책임지는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : S+V, ~ing ~ : \"변이들의 도입을 더욱 가속하면서\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"To make things worse, 설상가상으로. mutations may damage genes, 변이들은 유전자를 훼손할 수도 있다. responsible for error checking and repair of genomes, 게놈의 오류 확인과 복구를 책임지는. further accelerating the introduction of mutations, 변이들의 도입을 더욱 가속한다. 이 문장 전체를 해석하면, 설상가상으로, 변이들은 게놈의 오류 확인과 복구를 책임지는 유전자를 훼손해 변이들의 도입을 더욱 가속할 수도 있다.","hl":"m"},{"n":29,"text":"이 문장은 변이가 단순히 남는 데 그치지 않고, 오류를 확인하고 복구하는 유전자까지 손상시켜서 변이가 더 빨리 늘어나는 악순환을 말하고 있어요. 그래서 게놈 복제 오류가 갈수록 심해질 수 있다는 논리를 보여 주는 겁니다.","hl":"mn"},{"n":30,"text":"첫 번째, To make things worse는 설상가상으로라고 해석하는 관용적인 to부정사 표현입니다. 두 번째, may damage genes는 조동사 may가 가능성을 나타내서 훼손할 수도 있다는 뜻이에요. 세 번째, responsible for error checking and repair of genomes는 형용사구가 앞의 genes를 뒤에서 꾸며 주는 후치 수식 구조입니다. 네 번째, further accelerating the introduction of mutations는 분사구문으로, 앞 절 전체의 결과나 부가 상황을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 게놈 변이들은\u003c/span>\u003cspan class=\"en\">Most genome mutations\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지고 있지 않다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떠한 뚜렷한 영향도.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">noticeable \u003c/span>\u003cspan class=\"tgt\">effects\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분의 게놈 변이들은 어떠한 뚜렷한 영향이 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대부분의 게놈 변이는 우리가 눈치챌 수 있는 뚜렷한 영향을 주지 않는다는 뜻입니다. 앞에서 변이가 쌓이고 실수를 더 만들 수 있다고 했지만, 여기서는 \u003cb class=\"key\">대부분의 \u003c/b>\u003cb class=\"key\">변이\u003c/b>는 무해하다는 점을 강조합니다. 바로 다음에 나오는 kingdom 비유를 이끌어 내는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 부정문\u003c/span> : [주어] + [do/does/did not] + [동사원형] : \"가지고 있지 않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정문에서 any의 용법\u003c/span> : [부정문] + [any + 복수명사] : \"어떠한 뚜렷한 영향도\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Most genome mutations, 대부분의 게놈 변이들은. do not have, 가지고 있지 않다. any noticeable effects, 어떠한 뚜렷한 영향도.. 이 문장 전체를 해석하면, 대부분의 게놈 변이들은 어떠한 뚜렷한 영향이 없다.","hl":"m"},{"n":32,"text":"이 문장은 대부분의 게놈 변이는 우리가 눈치챌 수 있는 뚜렷한 영향을 주지 않는다는 뜻입니다. 앞에서 변이가 쌓이고 실수를 더 만들 수 있다고 했지만, 여기서는 대부분의 변이는 무해하다는 점을 강조합니다. 바로 다음에 나오는 kingdom 비유를 이끌어 내는 역할을 합니다.","hl":"mn"},{"n":33,"text":"첫 번째 어법 포인트는 do not have입니다. 주어 Most genome mutations가 복수이기 때문에 do not have를 써서 일반동사 have를 부정합니다. 두 번째 포인트는 any noticeable effects입니다. 부정문에서 some 대신 any를 쓰면 어떠한 뚜렷한 영향도 없다는 뜻이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 마치 ~와 같다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">i를 y로 바꾸는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">changing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">i \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">y\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">kingdom에서\u003c/span>\u003cspan class=\"en\">in &quot;kingdom&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜곡하지 않을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">distort\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 단어의 가독성을.\u003c/span>\u003cspan class=\"en\">the word's readability.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 마치 ‘kingdom’에서 ‘i’를 ‘y’로 변경하는 것이 그 단어의 가독성을 왜곡하지 않는 것과 같다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 말한 대부분의 게놈 변이가 눈에 띄지 않는다는 점을 kingdom의 철자 바꾸기에 비유합니다. i를 y로 바꿔도 단어의 읽기 쉬운 정도는 변하지 않듯이, \u003cb class=\"key\">대부분의 \u003c/b>\u003cb class=\"key\">변이\u003c/b>는 큰 영향이 없다는 것입니다. 여기서 changing the i for a y는 \u003cb class=\"key\">동명사구\u003c/b>로 주어 역할을 한다는 점도 중요합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유사 표현 (just like + 절)\u003c/span> : [It is just like] + [주어 + 동사] : \"그것은 마치 ~와 같다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사구의 주어 역할\u003c/span> : [동명사구] + [would not distort] + [목적어] : \"i를 y로 변경하는 것은 ... 왜곡하지 않을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 would의 가정적 용법\u003c/span> : [주어] + [would not + 동사원형] : \"왜곡하지 않을 것이다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"It is just like, 그것은 마치 ~와 같다. changing the i for a y, i를 y로 바꾸는 것이. in \"kingdom\", kingdom에서. would not distort, 왜곡하지 않을 것이다. the word's readability, 그 단어의 가독성을.. 이 문장 전체를 해석하면, 그것은 마치 ‘kingdom’에서 ‘i’를 ‘y’로 변경하는 것이 그 단어의 가독성을 왜곡하지 않는 것과 같다.","hl":"m"},{"n":35,"text":"이 문장은 앞 문장에서 말한 대부분의 게놈 변이가 눈에 띄지 않는다는 점을 kingdom의 철자 바꾸기에 비유합니다. i를 y로 바꿔도 단어의 읽기 쉬운 정도는 변하지 않듯이, 대부분의 변이는 큰 영향이 없다는 것입니다. 여기서 changing the i for a y는 동명사구로 주어 역할을 한다는 점도 중요합니다.","hl":"mn"},{"n":36,"text":"첫 번째 어법 포인트는 It is just like입니다. 뒤에 절을 이끌어 마치 무엇과 같다는 비유를 나타냅니다. 두 번째 포인트는 changing the i for a y입니다. 이 동명사구가 would not distort의 주어 역할을 하고, 동명사구가 주어일 때 단수 취급합니다. 세 번째 포인트는 would not distort입니다. 실제 상황이 아니라 가정적인 상황을 나타내며, 왜곡하지 않을 것이라는 뜻입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 때때로\u003c/span>\u003cspan class=\"en\">But sometimes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간 유전자에 대한 변이는\u003c/span>\u003cspan class=\"en\">a mutation to a human gene\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 결과로 낳는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">results \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>, for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈을\u003c/span>\u003cspan class=\"en\">an eye\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">홍채가 두 가지 다른 색을 띠는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">whose \u003c/span>\u003cspan class=\"tgt\">iris \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">two \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">colors\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 예를 들어, 때때로 인간 유전자에 대한 변이는 홍채가 두 가지 다른 색을 띠는 눈을 초래하기도 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 일반적인 진술과 대조되는 예외를 보여줍니다. 대부분의 변이는 무해하지만, 때때로 인간 유전자의 변이는 두 가지 다른 색의 홍채를 가진 눈처럼 눈에 보이는 결과를 초래한다는 뜻입니다. 여기서 whose iris는 an eye를 수식하는 \u003cb class=\"key\">관계대명사절\u003c/b>로, \u003cb class=\"key\">눈의 \u003c/b>\u003cb class=\"key\">홍채\u003c/b>가 두 색이라는 구체적인 예를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구 result in\u003c/span> : [a mutation] + [results in] + [an eye] : \"~을 초래하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유격 관계대명사 whose\u003c/span> : [선행사 an eye] + [whose + 명사(iris)] + [동사 is] : \"홍채가 두 가지 다른 색을 띠는 눈\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be of + 명사\u003c/span> : [주어] + [be of] + [명사구] : \"두 가지 다른 색을 띠다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"But sometimes, 그러나 때때로. a mutation to a human gene, 인간 유전자에 대한 변이는. results in, for example, 예를 들어, 결과로 낳는다. an eye, 눈을. whose iris is of two different colors, 홍채가 두 가지 다른 색을 띠는.. 이 문장 전체를 해석하면, 그러나 예를 들어, 때때로 인간 유전자에 대한 변이는 홍채가 두 가지 다른 색을 띠는 눈을 초래하기도 한다.","hl":"m"},{"n":38,"text":"이 문장은 앞 문장의 일반적인 진술과 대조되는 예외를 보여줍니다. 대부분의 변이는 무해하지만, 때때로 인간 유전자의 변이는 두 가지 다른 색의 홍채를 가진 눈처럼 눈에 보이는 결과를 초래한다는 뜻입니다. 여기서 whose iris는 an eye를 수식하는 관계대명사절로, 눈의 홍채가 두 색이라는 구체적인 예를 제시합니다.","hl":"mn"},{"n":39,"text":"첫 번째 어법 포인트는 results in입니다. result in은 원인이 되는 변이가 결과로 눈을 초래한다는 뜻의 타동사구입니다. 두 번째 포인트는 whose iris is of two different colors입니다. whose는 선행사 an eye를 받아 그 눈의라는 뜻으로, 소유격 관계대명사이므로 뒤에 명사 iris가 옵니다. 세 번째 포인트는 is of two different colors입니다. be of plus 명사는 그런 속성을 지닌다는 뜻으로, 두 가지 다른 색을 띤다는 의미를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마찬가지로,\u003c/span>\u003cspan class=\"en\">Similarly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 모두가 모반이 있는데,\u003c/span>\u003cspan class=\"en\">almost everyone has birthmarks,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 변이들 때문인데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">due \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">mutations\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발생한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">occurred\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 몸의 세포가 증식하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">body's \u003c/span>\u003cspan class=\"tgt\">cells \u003c/span>\u003cspan class=\"tgt\">multiplied\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">피부를 형성하기 위하여.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">form \u003c/span>\u003cspan class=\"tgt\">skin\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마찬가지로, 거의 모두가 모반이 있는데, 이는 우리 몸의 세포가 피부를 형성하기 위하여 증식하면서 발생한 변이들 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 홍채 색 변이와 유사하게, 우리 몸에 흔한 \u003cb class=\"key\">모반\u003c/b>도 세포가 피부를 형성하기 위해 증식하는 과정에서 생긴 변이 때문임을 설명한다. \u003cb class=\"key\">due \u003c/b>\u003cb class=\"key\">to \u003c/b>\u003cb class=\"key\">mutations\u003c/b>가 원인을 나타내며, \u003cb class=\"key\">which\u003c/b>는 birthmarks를 받는 계속적 용법으로 문장을 자연스럽게 연결한다. 변이가 세포 속 게놈 변화인데도 여러 세포에 퍼질 수 있다는 다음 의문으로 넘어가는 예시 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 which의 계속적 용법\u003c/span> : 선행사 birthmarks + , which + 불완전절 : \"이는 변이들 때문인데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 mutations + that + occurred (동사) : \"발생한 변이들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간 부사절 접속사 as\u003c/span> : as + 주어 + 동사 (multiplied) : \"우리 몸의 세포가 증식하면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : 세포가 증식하다 + to form skin (to부정사구) : \"피부를 형성하기 위하여\"\u003c/div>\u003c/div>","segs":[{"n":40,"text":"Similarly, 마찬가지로. almost everyone has birthmarks, 거의 모두가 모반이 있는데. which are due to mutations, 이는 변이들 때문인데. that occurred, 발생한. as our body's cells multiplied, 우리 몸의 세포가 증식하면서. to form skin, 피부를 형성하기 위하여.. 이 문장 전체를 해석하면, 마찬가지로, 거의 모두가 모반이 있는데, 이는 우리 몸의 세포가 피부를 형성하기 위하여 증식하면서 발생한 변이들 때문이다.","hl":"m"},{"n":41,"text":"이 문장은 앞 문장의 눈 홍채 색 변이와 비슷하게, 누구나 가진 모반도 세포 증식 과정에서 생긴 변이로 설명한다는 내용이에요. which가 앞 문장 전체가 아니라 birthmarks를 받는 계속적 용법이라서, 문장의 흐름을 부드럽게 이어 주는 역할을 해요. due to mutations는 변이들 때문에 모반이 생겼다는 원인을 나타내고, to form skin은 피부를 형성하기 위해서라는 목적을 나타내요.","hl":"mn"},{"n":42,"text":"첫 번째로, which are due to mutations에서 which는 계속적 용법으로 쓰인 관계대명사예요. 콤마 뒤에서 앞의 birthmarks를 받으면서 이는 변이들 때문인데로 해석하고, 앞 내용을 이어 주죠. 두 번째로, that occurred는 선행사 mutations를 수식하는 주격 관계대명사에요. that 뒤에 동사 occurred가 와서 주어가 빠진 불완전한 절을 이끌어요. 세 번째로, as our body's cells multiplied에서 as는 시간 접속사로 ~하면서라는 뜻이에요. 네 번째로, to form skin은 to부정사의 부사적 용법으로, 피부를 형성하기 위해서라는 목적을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 변이들이 변화라면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">mutations \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">changes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 특정 세포의 게놈에 대한\u003c/span>\u003cspan class=\"en\">to the genome of one particular cell,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 세포 집단이\u003c/span>\u003cspan class=\"en\">how can a patch of cells\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">홍채에 있는\u003c/span>\u003cspan class=\"en\">in an iris\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 피부 전체 세포 집단이\u003c/span>\u003cspan class=\"en\">or a whole patch of skin,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 개별 세포들로 구성된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">consisting \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">individual \u003c/span>\u003cspan class=\"tgt\">cells\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동시에 영향을 받을 수 있을까?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">affected\u003c/span> simultaneously?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 변이들이 하나의 특정 세포의 게놈에 대한 변화라면, 많은 개별적인 세포들로 구성된 홍채의 세포 집단이나 피부 전체 세포 집단이 어떻게 동시에 영향을 받을 수 있을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 변이가 한 \u003cb class=\"key\">특정 \u003c/b>\u003cb class=\"key\">세포\u003c/b>의 게놈 변화라면, 많은 개별 세포로 구성된 \u003cb class=\"key\">홍채\u003c/b>나 피부의 세포 집단이 어떻게 동시에 영향을 받을 수 있는지 묻는 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">제기\u003c/b> 문장이다. if 조건절로 상황을 가정하고, how 의문문으로 궁금증을 강조한다. \u003cb class=\"key\">consisting \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">many \u003c/b>\u003cb class=\"key\">individual \u003c/b>\u003cb class=\"key\">cells\u003c/b>는 앞의 세포 집단을 수식하는 분사구로, 세포 집단이 하나의 세포가 아니라 여러 세포로 이루어져 있다는 점을 부각해 답을 이끌어 낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 접속사 if\u003c/span> : If + 주어 + are + 보어, 주절 : \"만약 변이들이 변화라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구의 비제한적 수식\u003c/span> : 명사구 + , + consisting of 명사구 : \"많은 개별 세포들로 구성된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 can + 수동태\u003c/span> : can + be + affected (과거분사) : \"영향을 받을 수 있을까\"\u003c/div>\u003c/div>","segs":[{"n":43,"text":"If mutations are changes, 만약 변이들이 변화라면. to the genome of one particular cell, 하나의 특정 세포의 게놈에 대한. how can a patch of cells, 어떻게 세포 집단이. in an iris, 홍채에 있는. or a whole patch of skin, 또는 피부 전체 세포 집단이. consisting of many individual cells, 많은 개별 세포들로 구성된. be affected simultaneously?, 동시에 영향을 받을 수 있을까?. 이 문장 전체를 해석하면, 만약 변이들이 하나의 특정 세포의 게놈에 대한 변화라면, 많은 개별적인 세포들로 구성된 홍채의 세포 집단이나 피부 전체 세포 집단이 어떻게 동시에 영향을 받을 수 있을까?","hl":"m"},{"n":44,"text":"이 문장은 앞 문장에서 말한 모반과 홍채 변이를 보면서 생기는 의문을 제기하는 문제 제기 문장이에요. 변이는 원래 특정 세포 하나의 게놈에 생기는 변화인데, 그렇다면 많은 세포로 이루어진 조직 전체가 어떻게 동시에 영향을 받을 수 있는지 묻고 있어요. if 조건절은 가정의 상황을 던지고, how 의문문이 궁금증을 강하게 드러내요. consisting of many individual cells는 앞의 patch를 수식하는 현재분사구로, 세포 집단이 많은 개별 세포로 구성되어 있다는 점을 강조해요.","hl":"mn"},{"n":45,"text":"첫 번째로, If mutations are changes에서 if는 조건의 부사절을 이끄는 접속사로 만약 ~라면이라는 뜻이에요. 변이가 특정 세포의 게놈 변화라면이라는 조건을 먼저 제시하고 뒤에서 질문을 던지는 구조죠. 두 번째로, consisting of many individual cells는 현재분사구로, 앞에 나온 a patch of cells in an iris or a whole patch of skin을 수식하면서 많은 개별 세포들로 구성된이라는 뜻을 덧붙여요. 세 번째로, be affected는 수동태로, 세포 집단이 영향을 받는 것, 즉 당하는 의미를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 대답은 있다\u003c/span>\u003cspan class=\"en\">The answer \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lies \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세포 계보에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">in\u003c/span> the cell lineage,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조직의 발달 변천사\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">developmental \u003c/span>\u003cspan class=\"tgt\">history \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">tissue\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정 세포에서부터\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">particular \u003c/span>\u003cspan class=\"tgt\">cells \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 완전히 분화된 상태까지.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">fully \u003c/span>\u003cspan class=\"tgt\">differentiated \u003c/span>\u003cspan class=\"tgt\">state\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 대답은 세포 계보, 즉 특정 세포에서 그들의 완전히 차별화된 상태까지의 조직 발달 변천에 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 의문에 대한 \u003cb class=\"key\">답\u003c/b>이 \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">계보\u003c/b>에 있음을 밝히는 문장이다. 세포 계보란 특정 세포에서 출발해 완전히 \u003cb class=\"key\">분화된\u003c/b> 상태에 이르기까지 조직이 발달해 온 변천사, 즉 세포가 분열하고 분화해 온 계통을 뜻한다. \u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">developmental \u003c/b>\u003cb class=\"key\">history \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">a \u003c/b>\u003cb class=\"key\">tissue\u003c/b>가 앞의 cell lineage를 동격으로 풀이하며, 뒤 문장에서 초기 변이가 세포 집단 전체로 이어지는 원리를 설명할 단서를 제공한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사 lie의 전치사 in 결합\u003c/span> : lie + in + 명사구 : \"~에 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격(apposition)\u003c/span> : the cell lineage, + the developmental history of a tissue : \"세포 계보, 즉 조직의 발달 변천사\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 from A through to B\u003c/span> : from + A(particular cells) + through to + B(their fully differentiated state) : \"특정 세포에서 완전히 분화된 상태까지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : fully + differentiated (과거분사) + state (명사) : \"완전히 분화된 상태\"\u003c/div>\u003c/div>","segs":[{"n":46,"text":"The answer lies, 그 대답은 있다. in the cell lineage, 세포 계보에. the developmental history of a tissue, 조직의 발달 변천사. from particular cells, 특정 세포에서부터. through to their fully differentiated state, 그들이 완전히 분화된 상태까지.. 이 문장 전체를 해석하면, 그 대답은 세포 계보, 즉 특정 세포에서 그들의 완전히 차별화된 상태까지의 조직 발달 변천에 있다.","hl":"m"},{"n":47,"text":"이 문장은 앞 문장의 의문에 대한 답을 제시하는 문장이에요. 홍채나 피부의 여러 세포가 동시에 변이를 가지는 이유가 cell lineage, 즉 세포 계보에 있다고 말하고 있어요. 세포 계보는 특정 세포에서 출발해서 완전히 분화된 상태에 이르기까지의 조직 발달 역사를 뜻하죠. 이 표현은 생물학에서 세포가 분열하고 분화하며 서로 어떤 계통으로 이어지는지를 설명하는 핵심 개념이에요.","hl":"mn"},{"n":48,"text":"첫 번째로, lies in에서 lie는 자동사이고 in the cell lineage라는 전치사구와 함께 ~에 있다라는 뜻이에요. The answer lies는 그 대답이 어디에 있는지를 나타내요. 두 번째로, the cell lineage 뒤에 콤마가 있고 the developmental history of a tissue가 오는데, 이는 동격이에요. 세포 계보가 곧 조직 발달의 역사라는 것을 풀어서 설명해 주는 거죠. 세 번째로, from particular cells through to their fully differentiated state는 from A through to B 구조로, 특정 세포에서 완전히 분화된 상태까지의 범위를 나타내요. 네 번째로, fully differentiated state에서 differentiated는 과거분사가 state를 앞에서 꾸며 주는 형용사 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 변이가 초기에 발생했다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">mutation \u003c/span>\u003cspan class=\"tgt\">occurred \u003c/span>\u003cspan class=\"tgt\">early \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발달 중인 홍채의 계보에서\u003c/span>\u003cspan class=\"en\">in the lineage of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">developing \u003c/span>\u003cspan class=\"tgt\">iris\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇다면 그 세포 집단의 모든 세포는\u003c/span>\u003cspan class=\"en\">then all cells in that patch\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 변화를 물려받아 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">inherited \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">change\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 발달 중인 홍채의 계보 초기에 변이가 발생했다면, 그렇다면 그 세포 집단의 모든 세포는 그 변화를 물려받아 왔을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞선 질문, 즉 여러 세포로 이루어진 부위가 어떻게 한꺼번에 변이를 보일 수 있는지에 대한 답입니다. 발달 중인 홍채의 초기 세포에서 변이가 일어나면 그 세포가 분열해 만들어진 모든 후손 세포가 같은 변이를 공유하게 됩니다. 따라서 특정 \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">집단\u003c/b> 전체가 변이를 지닌 것은 그 변이가 \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">계보\u003c/b> 초기에 생긴 사건이기 때문입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절을 이끄는 if\u003c/span> : If + S + V(과거), S + V : \"만약 변이가 초기에 발생했다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 명사 수식\u003c/span> : V-ing + 명사 : \"발달 중인 홍채\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재완료\u003c/span> : have/has + p.p. : \"그 변화를 물려받아 왔다\"\u003c/div>\u003c/div>","segs":[{"n":49,"text":"If the mutation occurred early on, 만약 변이가 초기에 발생했다면. in the lineage of the developing iris, 발달 중인 홍채의 계보에서. then all cells in that patch, 그렇다면 그 세포 집단의 모든 세포는. have inherited that change, 그 변화를 물려받아 왔다. 이 문장 전체를 해석하면, 만약 발달 중인 홍채의 계보 초기에 변이가 발생했다면, 그렇다면 그 세포 집단의 모든 세포는 그 변화를 물려받아 왔을 것이다.","hl":"m"},{"n":50,"text":"이 문장은 앞서 던진 질문, 즉 여러 세포로 이루어진 부위가 어떻게 한꺼번에 변이를 보일 수 있느냐에 대한 답이에요. 발달 중인 홍채의 계보 초기에 변이가 생기면, 그 세포가 분열해서 생긴 모든 딸세포가 그 변이를 함께 물려받게 됩니다. 그래서 특정 세포 집단 전체가 같은 변이를 보이는 거죠.","hl":"mn"},{"n":51,"text":"첫 번째로 if절을 볼게요. If the mutation occurred early on은 조건을 나타내는 부사절로, 만약 변이가 초기에 발생했다면 이라는 뜻이에요. 두 번째는 the developing iris인데, developing이 현재분사로 뒤의 명사 iris를 수식해서 발달 중인 홍채라는 의미를 만들어요. 마지막으로 have inherited that change는 현재완료 형태로, 과거의 변이가 지금까지 이어져 왔음을 나타냅니다. 현재완료는 have에 과거분사를 붙인 형태라는 걸 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">게놈 \u003c/b>\u003cb class=\"key\">복제\u003c/b>가 거듭될수록 \u003cb class=\"key\">오류\u003c/b>가 쌓이고 변이가 늘어난다.\u003c/li>\u003cli>이는 \u003cb class=\"key\">중세 \u003c/b>\u003cb class=\"key\">서적\u003c/b>의 필사에서 변화가 누적되는 것과 유사하다.\u003c/li>\u003cli>대부분의 \u003cb class=\"key\">변이\u003c/b>는 뚜렷한 영향이 없지만, 일부는 홍채 색 이상이나 \u003cb class=\"key\">모반\u003c/b>처럼 눈에 보이기도 한다.\u003c/li>\u003cli>세포 집단이 동시에 영향을 받는 이유는 \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">계보\u003c/b> 초기에 생긴 변이가 공유되기 때문이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Repeated genome copying accumulates mutations, and a mutation early in cell lineage can affect a whole patch of cells.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">게놈 \u003c/b>\u003cb class=\"key\">복제\u003c/b>가 반복되면 \u003cb class=\"key\">오류\u003c/b>가 쌓여 변이가 누적되며, 대부분의 변이는 무해하지만 일부는 홍채 색 이상이나 \u003cb class=\"key\">모반\u003c/b>처럼 \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">집단\u003c/b>에 동시에 나타난다. 그 이유는 \u003cb class=\"key\">세포 \u003c/b>\u003cb class=\"key\">계보\u003c/b> 초기의 변이가 해당 세포 집단 전체에 공유되기 때문이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":52,"text":"오늘 글을 정리하면, 게놈 복제가 반복될수록 오류가 쌓이고, 대부분의 변이는 무해하지만 일부는 눈에 띄는 변화를 만듭니다. 세포 집단이 동시에 영향을 받는 이유는 세포 계보 초기에 생긴 변이가 공유되기 때문입니다. 이 비유와 질문 답변 구조를 잘 기억해 두면 독해 문제에서도 유리할 거예요. 오늘 수업은 여기까지입니다. 수고 많았어요.","hl":null}]}]});</script></body></html>
