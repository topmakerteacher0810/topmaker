>","<div class=\"lec-cover-title\">Protecting Human Agency Against Algorithmic Influence<small>알고리즘의 영향에 맞서 인간의 주체성 보호하기</small></div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식</b><div class=\"lec-cover-bkg-txt\">이 글을 더 깊이 이해하시려면 사람들의 심리와 경제적 선택을 연구하는 학문인 행동경제학(Behavioral Economics)과 그 핵심 개념인 넛지(Nudge)를 미리 알아두시면 좋아요. 넛지는 원래 &#39;팔꿈치로 슬쩍 찌르다&#39;라는 뜻으로, 구내식당 눈높이에 샐러드를 배치해 자연스럽게 건강한 식습관을 유도하는 것처럼 강제성 없이 사람들의 선택을 특정한 방향으로 이끄는 부드러운 개입을 의미합니다. 이렇게 사람들이 결정을 내리는 환경 자체를 영리하게 디자인하는 것을 선택 설계(Choice Architecture)라고 부르는데, 오늘날 우리가 매일 접하는 유튜브나 쇼핑몰의 추천 알고리즘이 바로 이 디지털 세상의 설계자 역할을 하고 있죠. 따라서 알고리즘이 만들어놓은 편리한 환경에 그저 무비판적으로 이끌려 가기보다는, 스스로 생각하고 결정하는 힘인 인간의 주체성(Human Agency)을 잃지 않고 의식적으로 알고리즘의 추천을 합리적으로 의심해 보는 태도가 왜 중요한지 생각하며 글을 읽어보시기를 바랍니다.</div></div>","<div class=\"lec-section-tag\">글의 흐름</div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01개념 도입</div><ul><li>선택이 이루어지는 환경의 디자인이 사람들의 결정에 큰 영향을 미친다는 개념을 소개한다.</li><li>환경의 구조가 인간의 의사 결정에 영향을 줌</li><li>핵심 개념: 선택 설계(choice architecture)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02알고리즘의 역할</div><ul><li>알고리즘은 우리의 디지털 환경을 구성하는 정교한 선택 설계자로서 작용한다.</li><li>정보와 선택지를 큐레이션(curating)하여 제공함</li><li>사용자들을 특정한 경로로 유도(nudge)함</li><li>핵심 개념: 알고리즘(Algorithms)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03알고리즘의 양면성</div><ul><li>알고리즘의 유도는 유익할 수도 있지만, 개인의 자율성을 침해하는 조작의 위험도 안고 있다.</li><li>긍정적인 목적으로 사용될 수 있으나 조작(manipulation)의 가능성도 존재함</li><li>설계자의 목표와 개인의 자율성(autonomy)이 불일치할 때 위험이 발생함</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04문제 제기</div><ul><li>점점 더 알고리즘화되는 세상에서 인간의 주체성을 어떻게 기르고 보호할 것인지 질문을 던진다.</li><li>알고리즘의 막강한 영향력에 대한 문제의식을 제기함</li><li>핵심 개념: 인간 주체성(human agency)</li></ul></div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05해결 방안</div><ul><li>주체성을 지키기 위해서는 알고리즘을 향한 비판적 참여와 의식적인 노력이 필요하다.</li><li>예측된 경로를 거스르는 의도적 선택(deliberate choices) 실천</li><li>알고리즘의 결과물에 대해 건강한 회의주의(healthy skepticism) 유지</li><li>알고리즘은 과거 현실의 반영(reflection of past realities)일 뿐임을 인식함</li></ul></div></div>","<div class=\"lec-section-tag\">단어 정리</div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">highlight</td><td class=\"m\">강조하다, 돋보이게 하다</td></tr><tr><td class=\"w\">in essence</td><td class=\"m\">본질적으로, 기본적으로</td></tr><tr><td class=\"w\">sophisticated</td><td class=\"m\">정교한, 복잡한, 세련된</td></tr><tr><td class=\"w\">curate</td><td class=\"m\">선별하다, 기획하다, (콘텐츠를) 수집하여 제공하다</td></tr><tr><td class=\"w\">subtly</td><td class=\"m\">미묘하게, 은연중에, 교묘하게</td></tr><tr><td class=\"w\">nudge</td><td class=\"m\">슬쩍 밀다, 넌지시 권하다, 유도하다</td></tr><tr><td class=\"w\">manipulation</td><td class=\"m\">조작, 속임수, 교묘한 처리</td></tr><tr><td class=\"w\">underlying</td><td class=\"m\">근본적인, 밑에 있는, 숨겨진</td></tr><tr><td class=\"w\">be aligned with</td><td class=\"m\">~와 일치하다, ~와 뜻을 같이하다</td></tr></tbody></table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">autonomy</td><td class=\"m\">자율성, 자주성, 자치</td></tr><tr><td class=\"w\">cultivate</td><td class=\"m\">기르다, 함양하다, 경작하다</td></tr><tr><td class=\"w\">agency</td><td class=\"m\">주체성, 행위 능력, 대행 기관</td></tr><tr><td class=\"w\">engagement</td><td class=\"m\">관여, 참여, 약혼</td></tr><tr><td class=\"w\">seek out</td><td class=\"m\">찾아내다, (열심히) 구하다</td></tr><tr><td class=\"w\">deliberate</td><td class=\"m\">의도적인, 신중한, 고의의</td></tr><tr><td class=\"w\">go against</td><td class=\"m\">~에 거스르다, ~에 반대하다, ~와 어긋나다</td></tr><tr><td class=\"w\">skepticism</td><td class=\"m\">회의론, 의심, 회의적 태도</td></tr><tr><td class=\"w\">prescription</td><td class=\"m\">처방, 처방전, 규정</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 1 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">&#39;선택 구조&#39;라는 개념은</span><span class=\"en\"><b>The concept of \"choice architecture,\"</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">행동 경제학에서 대중화된</span><span class=\"en\"><b><span class=\"grammar-hl\">popularized in behavioral economics</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">강조한다</span><span class=\"en\"><b>highlights</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떻게 환경의 설계가</span><span class=\"en\"><b><span class=\"grammar-hl\">how the design of the environment</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">선택이 이루어지는</span><span class=\"en\"><b><span class=\"grammar-hl\">in which choices are made</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">사람들이 내리는 결정에 큰 영향을 미칠 수 있는지를</span><span class=\"en\"><b><span class=\"grammar-hl\">can significantly influence</span> the decisions people make.</b></span></div></div><div class=\"lec-sent-ko\">행동 경제학에서 대중화된 ‘선택 구조’라는 개념은 선택이 이루어지는 환경의 설계가 사람들이 내리는 결정에 어떻게 큰 영향을 미칠 수 있는지를 강조한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 이 글의 핵심 배경이 되는 개념을 소개하며 시작합니다. choice architecture는 우리가 결정을 내릴 때 주변 환경이나 상황이 어떻게 구성되어 있는지에 따라 우리의 선택이 크게 달라질 수 있다는 점을 보여 줍니다. 식당 메뉴판의 음식 배치나 대형 마트의 상품 진열 방식이 우리의 구매를 자연스럽게 이끄는 것이 그 예입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">popularized in behavioral economics (과거분사(형용사)): popularized가 수식받는 앞의 명사 The concept of &quot;choice architecture&quot;를 수식하는 축약 관계절 역할을 한다. (N + p.p. 구조)</div><div class=\"lec-gr-item\">how the design of the environment in which choices are made can significantly influence (간접의문문): 의문사(how) + 주어(the design of the environment ~) + 동사(can significantly influence)의 어순으로 명사절을 이루어 동사 highlights의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">in which (전치사+관계대명사): 전치사(in) + 관계대명사(which) + S + V 구조이다. 관계대명사 뒤에는 주어+동사가 갖춰진 완전한 절(완전문장)이 온다. 이 문장에서는 뒤에 choices(주어) are made(동사)로 이루어진 완전한 절이 이어져 environment를 수식한다.</div><div class=\"lec-gr-item\">are made (수동태): be동사(are) + p.p.(made) 구조. make는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are made 형태로 쓴다. (기본구조: make + O)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">highlight</td><td class=\"m\">강조하다, 돋보이게 하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 2 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">알고리즘은 ~이다</span><span class=\"en\"><b>Algorithms are,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">본질적으로</span><span class=\"en\"><b><span class=\"grammar-hl\">in essence</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리 디지털 환경의 정교한 설계자</span><span class=\"en\"><b>sophisticated architects of our digital environments.</b></span></div></div><div class=\"lec-sent-ko\">알고리즘은 본질적으로 우리 디지털 환경의 정교한 설계자이다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 &#39;선택 설계&#39; 개념을 디지털 세계로 가져와 알고리즘에 적용합니다. architects of our digital environments는 현실 세계의 상점이나 메뉴판처럼, 인터넷 공간에서는 알고리즘이 우리가 정보를 접하는 화면과 순서를 교묘하게 짜놓는 주체라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">in essence (관용표현(이디엄)): &#39;본질적으로&#39;라는 의미로 쓰인 전치사구이다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in essence</td><td class=\"m\">본질적으로, 기본적으로</td></tr><tr><td class=\"w\">sophisticated</td><td class=\"m\">정교한, 복잡한, 세련된</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 3 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">선별함으로써</span><span class=\"en\"><b>By <span class=\"grammar-hl\">curating</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 무엇을 보고</span><span class=\"en\"><b><span class=\"grammar-hl\">what we see</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">무엇을 추천받으며</span><span class=\"en\"><b>what we <span class=\"grammar-hl\">are recommended</span>,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">어떤 옵션이 우리에게 제시되는지를</span><span class=\"en\"><b>and what options <span class=\"grammar-hl\">are presented</span> to us,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 미묘하게, 때로는 그렇게 미묘하지 않게 우리를 가볍게 자극한다</span><span class=\"en\"><b>they subtly, and sometimes not so subtly, nudge us</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정 경로로 향하도록</span><span class=\"en\"><b>towards particular paths.</b></span></div></div><div class=\"lec-sent-ko\">우리가 무엇을 보고, 무엇을 추천받으며, 어떤 옵션이 우리에게 제시되는지를 선별함으로써, 그것들은 미묘하게, 때로는 그렇게 미묘하지 않게 우리를 특정 경로로 향하도록 가볍게 자극한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 알고리즘이 어떻게 디지털 환경의 설계자 역할을 하는지 구체적인 방법을 설명합니다. 행동경제학에서 비롯된 nudge us towards particular paths는 사용자에게 강제로 명령하는 방식 대신, 맞춤형 추천 동영상이나 타겟 광고 등을 통해 자연스럽게 특정 콘텐츠를 소비하고 물건을 사도록 이끈다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">curating (동명사): 전치사 By의 목적어 역할을 하는 명사적 쓰임이다.</div><div class=\"lec-gr-item\">what we see (관계대명사): 선행사를 포함하는 관계대명사 what이 이끄는 명사절로, 동명사 curating의 목적어 역할을 한다.</div><div class=\"lec-gr-item\">are recommended (수동태): be동사(are) + p.p.(recommended) 구조. recommend는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are recommended 형태로 쓴다. (기본구조: recommend + O + to B 또는 recommend + I.O + D.O)</div><div class=\"lec-gr-item\">are presented (수동태): be동사(are) + p.p.(presented) 구조. present는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are presented 형태로 쓴다. (기본구조: present + O + to B)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">subtly</td><td class=\"m\">미묘하게, 은연중에, 교묘하게</td></tr><tr><td class=\"w\">nudge</td><td class=\"m\">슬쩍 밀다, 넌지시 권하다, 유도하다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 4 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">넛지는 사용될 수 있지만</span><span class=\"en\"><b>While nudges <span class=\"grammar-hl\">can be used</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">유익한 목적으로</span><span class=\"en\"><b>for beneficial purposes,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">더 건강한 습관을 권장하는 것과 같이</span><span class=\"en\"><b>such as <span class=\"grammar-hl\">encouraging</span> healthier habits,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그것들은 조작의 가능성 또한 내포하고 있다</span><span class=\"en\"><b>they also carry the potential for manipulation,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특히 설계자의 잠재적인 목표가</span><span class=\"en\"><b>particularly when the <span class=\"grammar-hl\">underlying</span> objectives of the architects</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">일치하지 않을 때</span><span class=\"en\"><b><span class=\"grammar-hl\">are not aligned</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">개인의 복지나 자율성과</span><span class=\"en\"><b>with the well-being or autonomy of the individual.</b></span></div></div><div class=\"lec-sent-ko\">넛지(가벼운 자극)는 더 건강한 습관을 권장하는 것과 같이 유익한 목적으로 사용될 수 있지만, 특히 설계자의 잠재적인 목표가 개인의 복지나 자율성과 일치하지 않을 때 그것들은 조작의 가능성 또한 내포하고 있다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 알고리즘의 긍정적인 면을 인정하면서도, 이 글이 다루고자 하는 문제점을 본격적으로 제기합니다. the underlying objectives of the architects — 글쓴이는 여기서 힘주어 말합니다. 알고리즘을 만든 기업의 진짜 목적이 사용자의 이익이 아니라 자신들의 이윤 창출이나 정치적 영향력 확대에 있을 때, 사용자는 자신도 모르는 사이에 철저히 조종당할 위험에 처하게 된다는 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">can be used (수동태): 조동사(can) + be동사(be) + p.p.(used) 구조. use는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 be used 형태로 쓴다. (기본구조: use + O + for B)</div><div class=\"lec-gr-item\">encouraging (동명사): 전치사구 such as의 목적어 역할을 하는 명사적 쓰임이다.</div><div class=\"lec-gr-item\">underlying (현재분사(형용사)): underlying이 수식받는 뒤의 명사 objectives를 수식하여 &#39;기저에 있는/근본적인 목적&#39;이라는 의미를 형성한다. (-ing + N 구조)</div><div class=\"lec-gr-item\">are not aligned (수동태): be동사(are) + p.p.(aligned) 구조. align은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are aligned 형태로 쓴다. (기본구조: align + O + with B)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nudge</td><td class=\"m\">슬쩍 밀다, 넌지시 권하다, 유도하다</td></tr><tr><td class=\"w\">manipulation</td><td class=\"m\">조작, 속임수, 교묘한 처리</td></tr><tr><td class=\"w\">underlying</td><td class=\"m\">근본적인, 밑에 있는, 숨겨진</td></tr><tr><td class=\"w\">autonomy</td><td class=\"m\">자율성, 자주성, 자치</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 5 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그러면 질문은 다음과 같다:</span><span class=\"en\"><b>The question then becomes:</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리는 어떻게 인간의 주체성을 기르고 보호할 수 있을까</span><span class=\"en\"><b><span class=\"grammar-hl\">how can we cultivate and protect</span> our human agency</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">점점 더 알고리즘화되는 세상에서</span><span class=\"en\"><b>in an increasingly algorithmic world?</b></span></div></div><div class=\"lec-sent-ko\">그러면 질문은 다음과 같다. 점점 더 알고리즘화되는 세상에서 우리는 어떻게 인간의 주체성을 기르고 보호할 수 있을까?</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞선 문제 제기에 이어, 글의 방향을 해결책 모색으로 전환합니다. cultivate and protect our human agency는 알고리즘이 치밀하게 짜놓은 판에 수동적으로 끌려가는 대신, 내 삶의 주인이 되어 스스로 판단하고 결정하는 능력을 지켜내야 한다는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">how can we cultivate and protect (의문문): 의문사(how) + 조동사(can) + 주어(we) + 동사원형(cultivate and protect)의 직접의문문 어순으로 쓰였다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cultivate</td><td class=\"m\">기르다, 함양하다, 경작하다</td></tr><tr><td class=\"w\">agency</td><td class=\"m\">주체성, 행위 능력, 대행 기관</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 6 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 의식적인 노력을 필요로 한다</span><span class=\"en\"><b><span class=\"grammar-hl\">It requires a conscious effort</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">비판적인 관계를 유지하려는</span><span class=\"en\"><b><span class=\"grammar-hl\">to maintain</span> critical engagement</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">우리가 사용하는 기술과</span><span class=\"en\"><b>with the technologies we use.</b></span></div></div><div class=\"lec-sent-ko\">그것은 우리가 사용하는 기술과 비판적인 관계를 유지하려는 의식적인 노력을 필요로 한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 앞 문장의 질문에 대한 첫 번째 해답을 제시합니다. maintain critical engagement를 &#39;비판적인 개입을 유지하다&#39;라고 옮기면 딱딱하게 느껴집니다. 쉽게 말해 스마트폰이나 앱이 제공하는 편리함을 아무 생각 없이 받아들이지 않고, 이 기술이 내 생각과 행동에 어떤 영향을 미치고 있는지 끊임없이 질문하고 경계하는 태도를 가져야 한다는 것입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">It requires a conscious effort to maintain (가주어): 진주어: It은 문장의 형식적인 가주어이며, to maintain 이하의 to부정사구가 내용상 주어 역할을 하는 진주어이다.</div><div class=\"lec-gr-item\">to maintain (to부정사): 명사적 용법으로 쓰여 진주어 역할을 한다.</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">engagement</td><td class=\"m\">관여, 참여, 약혼</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 7 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">이는 의미한다</span><span class=\"en\"><b>It means</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">적극적으로 다양한 관점을 찾고</span><span class=\"en\"><b>actively <span class=\"grammar-hl\">seeking out</span> diverse perspectives,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알고리즘의 추천에 도전하며</span><span class=\"en\"><b>challenging algorithmic recommendations,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 의도적인 선택을 하는 것을</span><span class=\"en\"><b>and making deliberate choices</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">예측된 흐름에 반하는</span><span class=\"en\"><b><span class=\"grammar-hl\">that go against the predicted grain</span>.</b></span></div></div><div class=\"lec-sent-ko\">이는 적극적으로 다양한 관점을 찾고, 알고리즘의 추천에 도전하며, 예측된 흐름에 반하는 의도적인 선택을 하는 것을 의미한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 비판적인 태도가 구체적으로 어떤 실천인지 자세히 풀어줍니다. go against the predicted grain은 알고리즘이 나의 과거 기록을 분석해 &#39;이 사람이 좋아할 것&#39;이라고 예측해 주는 뻔한 콘텐츠를 거부하고, 일부러 내 평소 취향과 전혀 다른 낯선 정보나 의견을 클릭하여 스스로 시야를 넓히는 적극적인 행동을 뜻합니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">seeking out (동명사): 타동사 means의 목적어 역할을 하는 명사적 쓰임이며, 뒤의 challenging, making과 병렬 구조를 이룬다.</div><div class=\"lec-gr-item\">that go against the predicted grain (관계대명사): 주격 관계대명사 that이 이끄는 형용사절로 선행사 deliberate choices를 수식한다. 관계절 내부에서 that이 주어 역할을 하므로 바로 뒤에 동사(go)가 이어진다.</div><div class=\"lec-gr-item\">go against the predicted grain (관용표현(이디엄)): &#39;대세에 역행하다, 순리를 거스르다&#39;라는 의미의 숙어 go against the grain의 응용 표현이다.</div><div class=\"lec-gr-item\">predicted (과거분사(형용사)): predicted가 수식받는 뒤의 명사 grain을 수식하여 &#39;예측된 결(방향)&#39;이라는 의미를 만든다. (p.p. + N 구조)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deliberate</td><td class=\"m\">의도적인, 신중한, 고의의</td></tr><tr><td class=\"w\">go against</td><td class=\"m\">~에 거스르다, ~에 반대하다, ~와 어긋나다</td></tr></tbody></table></div>","<div class=\"lec-sent-no\">문장 8 / 8</div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"ko\">그것은 건전한 회의론을 기르는 것을 포함한다</span><span class=\"en\"><b>It involves <span class=\"grammar-hl\">cultivating</span> a healthy skepticism</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">알고리즘의 겉보기에 객관적인 결과물에 대해</span><span class=\"en\"><b>towards the seemingly objective outputs of algorithms</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 기억하는 것을</span><span class=\"en\"><b>and remembering</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">이러한 시스템이 설계되었으며</span><span class=\"en\"><b><span class=\"grammar-hl\">that these systems are designed</span></b></span></div><div class=\"lec-chunk\"><span class=\"ko\">특정 목표를 가진 인간에 의해</span><span class=\"en\"><b><span class=\"grammar-hl\">by humans</span> with specific goals,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">그리고 그 데이터는 과거 현실의 반영일 뿐이라는 점을</span><span class=\"en\"><b>and that their data is a reflection of past realities,</b></span></div><div class=\"lec-chunk\"><span class=\"ko\">반드시 미래의 번영을 위한 처방은 아니라는</span><span class=\"en\"><b>not necessarily a prescription for future flourishing.</b></span></div></div><div class=\"lec-sent-ko\">그것은 알고리즘의 겉보기에 객관적인 결과물에 대해 건전한 회의론을 기르고, 이러한 시스템이 특정 목표를 가진 인간에 의해 설계되었으며, 그 데이터는 과거 현실의 반영일 뿐 반드시 미래의 번영을 위한 처방은 아니라는 점을 기억하는 것을 포함한다.</div></div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미</b> 주체성을 지키기 위해 가져야 할 마음가짐을 정리하며 글을 마무리합니다. not necessarily a prescription for future flourishing은 알고리즘이 내놓는 결과값이 단지 내가 과거에 했던 행동의 흔적들을 모아 보여 주는 것일 뿐, 내 삶의 성장이나 더 나은 미래를 위해 무조건 따라야 할 정답안은 아니라는 의미입니다.</div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법</b><div class=\"lec-gr-item\">cultivating (동명사): 타동사 involves의 목적어 역할을 하는 명사적 쓰임이며, 뒤의 remembering과 병렬 구조를 이룬다.</div><div class=\"lec-gr-item\">that these systems are designed by humans 명사절 접속사 that: 완전한 절을 이끌어 동명사 remembering의 목적어 역할을 하는 명사절을 형성한다.</div><div class=\"lec-gr-item\">are designed (수동태): be동사(are) + p.p.(designed) 구조. design은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are designed 형태로 쓴다. (기본구조: design + O)</div></div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">skepticism</td><td class=\"m\">회의론, 의심, 회의적 태도</td></tr><tr><td class=\"w\">prescription</td><td class=\"m\">처방, 처방전, 규정</td></tr></tbody></table></div>","<div class=\"lec-section-tag\">최종 정리</div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리</b><ul class=\"lec-overall-list\"><li>행동경제학의 &#39;선택 설계&#39; 개념처럼, 알고리즘은 디지털 환경을 설계하여 우리의 선택을 특정한 방향으로 슬쩍 유도한다.</li><li>이러한 유도는 유익할 수도 있지만, 알고리즘 설계자의 목적에 따라 우리가 조종당할 위험성을 내포하고 있다.</li><li>따라서 알고리즘의 지배력이 커지는 세상에서 우리는 제공되는 정보를 맹목적으로 수용하는 것을 경계하고 비판적인 태도를 가져야 한다.</li><li>알고리즘의 추천을 의심하고 예측을 벗어나는 의도적인 선택을 함으로써 우리는 인간으로서의 주체성을 지켜낼 수 있다.</li></ul></div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약</b>\n              <div class=\"lec-final-sum-en\">Although algorithms subtly shape our decisions in digital spaces, we must actively practice critical engagement to preserve our human agency.</div>\n              <div class=\"lec-final-sum-ko\">알고리즘이 디지털 공간에서 우리의 결정을 은밀하게 형성하지만, 우리는 인간의 주체성을 보존하기 위해 비판적 개입을 적극적으로 실천해야 한다.</div></div></div>"],"segs":[[{"audio":"./41_audio/1.mp3","hl":null}],[{"audio":"./41_audio/2.mp3","hl":null}],[{"audio":"./41_audio/3.mp3","hl":null},{"audio":"./41_audio/4.mp3","hl":"stage-0"},{"audio":"./41_audio/5.mp3","hl":"stage-1"},{"audio":"./41_audio/6.mp3","hl":"stage-2"},{"audio":"./41_audio/7.mp3","hl":"stage-3"},{"audio":"./41_audio/8.mp3","hl":"stage-4"}],[{"audio":"./41_audio/9.mp3","hl":null}],[{"audio":"./41_audio/10.mp3","hl":"main"},{"audio":"./41_audio/11.mp3","hl":"meaning"},{"audio":"./41_audio/12.mp3","hl":"grammar"}],[{"audio":"./41_audio/13.mp3","hl":"main"},{"audio":"./41_audio/14.mp3","hl":"meaning"},{
