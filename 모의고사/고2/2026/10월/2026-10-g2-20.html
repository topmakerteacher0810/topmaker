<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 20번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 20번","audioDir":"2026-10-g2-20_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">20번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>Gardeners vs. Carpenters: The Right Approach to Parenting\u003c/h1>\u003ch2>정원사 대 목수: 올바른 양육 방식\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>부모는 아이를 통제하여 이상적인 모습으로 조각하는 \u003cb class=\"key\">목수\u003c/b>가 아니라, 스스로 성장할 수 있도록 환경을 제공하는 \u003cb class=\"key\">정원사\u003c/b>가 되어 아이의 \u003cb class=\"key\">자율성\u003c/b>과 \u003cb class=\"key\">진취성\u003c/b>을 길러주어야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Parents should act as gardeners who foster a child's natural growth rather than carpenters who force them into a predetermined shape.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 우리가 함께 분석할 지문은 부모의 올바른 양육 방식에 대한 아주 흥미로운 글이에요. 부모는 과연 목수일까요, 아니면 정원사일까요? 이 글의 요약은 부모는 아이를 원하는 모습으로 조각하는 목수가 아니라, 스스로 성장하도록 환경을 제공하는 정원사가 되어 자율성과 진취성을 길러주어야 한다는 내용입니다. 영어 요지로는 Parents should act as gardeners rather than carpenters 쯤이 되겠죠?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">발달 심리학이나 교육학에서 자주 인용되는 '정원사와 목수' 비유는 부모의 \u003cb class=\"key\">양육 \u003c/b>\u003cb class=\"key\">태도\u003c/b>(parenting style)를 설명하는 아주 효과적인 개념입니다. 목수는 설계도에 맞춰 나무를 자르고 깎아 \u003cb class=\"key\">정해진 \u003c/b>\u003cb class=\"key\">결과물\u003c/b>을 통제하며 만들어 냅니다. 반면 정원사는 식물이 스스로 자랄 수 있도록 물과 햇빛, 즉 \u003cb class=\"key\">적절한 \u003c/b>\u003cb class=\"key\">환경\u003c/b>만을 제공할 뿐 식물 자체를 억지로 변형시키려 하지 않습니다. 일상에서도 화분에 물을 주며 꽃이 피길 묵묵히 기다리는 것과 찰흙을 주물러 내 마음대로 모양을 빚는 것은 완전히 다른 접근이죠. 아이들의 \u003cb class=\"key\">자율성\u003c/b>(autonomy)과 \u003cb class=\"key\">진취성\u003c/b>(initiative)을 기르기 위해서는 억지로 빚어내는 목수식 교육보다는 스스로 자라게 돕는 정원사식 교육이 필수적입니다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 조금 더 살펴볼게요. 발달 심리학에서 정원사와 목수의 비유는 양육 태도를 설명할 때 아주 자주 쓰이는 훌륭한 개념입니다. 목수는 설계도에 맞춰 나무를 자르고 깎아서 정해진 결과물을 통제하며 만들어 내잖아요? 반면에 정원사는 식물이 스스로 자랄 수 있도록 물과 햇빛, 즉 적절한 환경만을 제공할 뿐입니다. 화분에 물을 주는 것과 찰흙을 주물러 모양을 빚는 것은 완전히 다른 접근법이죠. 우리 아이들의 자율성과 진취성을 기르기 위해서는 정원사식 교육이 꼭 필요하답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>정원사 비유\u003csmall>도입 및 예시 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>삶의 무한한 가능성을 전제로, 부모가 \u003cb class=\"key\">정원사\u003c/b>처럼 적절한 환경을 제공할 때 아이들은 호기심과 독립심을 가지고 스스로 성장함을 보여줍니다. 이러한 환경에서 자란 아이들은 삶을 사랑하고 \u003cb class=\"key\">진취성\u003c/b>을 갖게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>목수 비유\u003csmall>대조 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>반면 \u003cb class=\"key\">목수\u003c/b>처럼 아이를 부모의 이상적인 모습으로 억지로 형태를 만들려 하면, 아이들은 \u003cb class=\"key\">자율성\u003c/b>을 잃고 수동적으로 변하게 됩니다. 타인이 마련해 주는 것에 익숙해진 아이들은 결국 스스로 길을 선택하지 못해 \u003cb class=\"key\">방향 \u003c/b>\u003cb class=\"key\">감각\u003c/b>을 잃고 맙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>부모의 역할\u003csmall>주장 및 결론 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>따라서 부모는 통제하는 목수가 아닌, 아이가 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">속도\u003c/b>로 자라게 돕는 정원사의 역할을 맡아야 합니다. 교육의 진정한 핵심은 아이들이 복잡한 세상에서 스스로 방향을 찾을 수 있는 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">지도\u003c/b>를 찾도록 돕는 것입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 지문은 크게 두 가지 비유를 대조한 뒤 글쓴이의 결론을 내리는 세 단계로 이루어져 있어요.","hl":null},{"n":4,"text":"첫 번째 단계는 정원사의 비유를 통해 긍정적인 양육을 설명하는 첫 번째부터 세 번째 문장입니다. 정원사처럼 적절한 환경을 제공할 때 아이들은 호기심과 독립심을 키우며 스스로 성장하게 되죠. 그 결과 아이들은 삶을 사랑하고 진취성을 갖게 된다고 이야기합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 네 번째와 다섯 번째 문장으로, 목수의 비유를 들어 부정적인 양육을 경고하고 있어요. 목수처럼 아이를 이상적인 모습으로 억지로 만들려 하면 아이들은 자율성을 잃고 수동적으로 변합니다. 타인이 정해준 길에 익숙해진 아이들은 결국 방향 감각을 잃고 만다는 거죠.","hl":"f1"},{"n":6,"text":"마지막 세 번째 단계는 여섯 번째부터 여덟 번째 문장으로, 부모의 진짜 역할을 강조하는 결론부입니다. 부모는 목수가 아니라 정원사가 되어 아이가 자신의 속도에 맞춰 성장하게 해야 한다고 강하게 주장합니다. 교육의 진짜 핵심은 아이가 복잡한 세상에서 스스로 길을 찾을 수 있도록 자신만의 지도를 찾게 돕는 것이라고 멋지게 마무리하고 있죠.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 부모의 양육 방식을 설명하기 위해 정원사와 목수라는 두 가지 명확한 \u003cb class=\"key\">비유\u003c/b>를 사용하여 서로 \u003cb class=\"key\">대조\u003c/b>하고 있습니다. 전반부에서 두 양육 방식이 가져오는 상반된 결과를 비교한 뒤, 후반부(6~8번 문장)에서 부모가 취해야 할 올바른 역할이라는 강력한 \u003cb class=\"key\">주장\u003c/b>을 도출해 내는 전형적인 \u003cb class=\"key\">미괄식\u003c/b> 구조를 취하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But if we, like carpenters (4)\u003c/b>\u003cspan>대조 전환\u003c/span>\u003cb>As parents, our role should be (6)\u003c/b>\u003cspan>주장 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">gardeners\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">provide a suitable environment\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">let children grow at their own pace\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">providing sunlight, rain, and fertile soil\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">helping children find their own map\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>정원사 (Gardeners)\u003c/th>\u003cth>목수 (Carpenters)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>적절한 환경 제공 (자연스러운 성장)\u003c/td>\u003ctd>이상적 이미지에 맞춰 형태를 만듦 (통제)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>호기심, 독립심, 진취성 발달\u003c/td>\u003ctd>자율성 상실, 수동성 증가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>스스로 방향을 찾음 (자신만의 지도)\u003c/td>\u003ctd>타인의 지시에 따름 (방향 감각 상실)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 아주 전형적인 비교와 대조의 전개 방식을 취하고 있어요. 정원사와 목수라는 명확한 비유를 대비시키고 있죠. 구조적으로는 앞부분에서 두 가지 방식의 결과를 보여준 뒤, 여섯 번째 문장에서 본격적으로 글쓴이의 주장을 펼치는 미괄식 구조입니다.","hl":"ty"},{"n":8,"text":"흐름을 잡아주는 중요한 신호어들을 볼까요? 네 번째 문장에 나오는 But if we, like carpenters에서 대조가 뚜렷하게 시작됨을 명확히 알 수 있습니다. 그리고 여섯 번째 문장의 As parents, our role should be를 통해서 '아, 이제 글쓴이가 강력하게 주장을 던지는구나'하고 눈치채셔야 해요. 글 전체에서 정원사에 해당하는 표현들과 목수에 해당하는 표현들이 어떻게 체인처럼 연결되며 대조되는지 꼭 꼼꼼히 확인해 보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>possibility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가능성\u003c/span>\u003c/div>\u003cdiv>\u003cb>suitable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>적절한, 알맞은\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>pace\u003c/b>\u003cem>명사\u003c/em>\u003cspan>속도, 페이스\u003c/span>\u003c/div>\u003cdiv>\u003cb>spontaneously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자연스럽게, 자발적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>explore\u003c/b>\u003cem>동사\u003c/em>\u003cspan>탐구하다, 탐험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>curiosity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>호기심\u003c/span>\u003c/div>\u003cdiv>\u003cb>creativity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>창의성\u003c/span>\u003c/div>\u003cdiv>\u003cb>independence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>독립심\u003c/span>\u003c/div>\u003cdiv>\u003cb>dare to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>감히 ~하다, 담대하게 ~하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도전하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>possess\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가지다, 소유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>initiative\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진취성, 주도권\u003c/span>\u003c/div>\u003cdiv>\u003cb>carpenter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목수\u003c/span>\u003c/div>\u003cdiv>\u003cb>shape\u003c/b>\u003cem>동사\u003c/em>\u003cspan>형태를 만들다, 형성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ideal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>gradually\u003c/b>\u003cem>부사\u003c/em>\u003cspan>점점, 서서히\u003c/span>\u003c/div>\u003cdiv>\u003cb>autonomy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자율성\u003c/span>\u003c/div>\u003cdiv>\u003cb>accustomed to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 익숙한\u003c/span>\u003c/div>\u003cdiv>\u003cb>instruction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지시, 설명\u003c/span>\u003c/div>\u003cdiv>\u003cb>arrange\u003c/b>\u003cem>동사\u003c/em>\u003cspan>마련하다, 배치하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>actively\u003c/b>\u003cem>부사\u003c/em>\u003cspan>능동적으로, 적극적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>fertile\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기름진, 비옥한\u003c/span>\u003c/div>\u003cdiv>\u003cb>soil\u003c/b>\u003cem>명사\u003c/em>\u003cspan>토양, 흙\u003c/span>\u003c/div>\u003cdiv>\u003cb>carve out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>조각해 내다, 개척하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>according to\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~에 따라\u003c/span>\u003c/div>\u003cdiv>\u003cb>core\u003c/b>\u003cem>명사\u003c/em>\u003cspan>핵심\u003c/span>\u003c/div>\u003cdiv>\u003cb>complex\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>복잡한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"핵심 단어 몇 가지 짚어볼게요. 세 번째 문장의 initiative는 진취성, 주도권이라는 아주 중요한 단어입니다. 내신에서도 자주 나오니 꼭 외워두시고요. 네 번째 문장의 autonomy는 자율성이죠. 여덟 번째 문장의 core는 핵심을 뜻합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">suitable\u003c/b>\u003cspan class=\"m\">적절한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appropriate\u003c/span>\u003cspan class=\"s\">proper\u003c/span>\u003cspan class=\"s\">fitting\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unsuitable\u003c/span>\u003cspan class=\"a\">inappropriate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">spontaneously\u003c/b>\u003cspan class=\"m\">자발적으로, 자연스럽게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">naturally\u003c/span>\u003cspan class=\"s\">voluntarily\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">forcibly\u003c/span>\u003cspan class=\"a\">reluctantly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">independence\u003c/b>\u003cspan class=\"m\">독립심\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">self-reliance\u003c/span>\u003cspan class=\"s\">freedom\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dependence\u003c/span>\u003cspan class=\"a\">reliance\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">initiative\u003c/b>\u003cspan class=\"m\">진취성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">drive\u003c/span>\u003cspan class=\"s\">enterprise\u003c/span>\u003cspan class=\"s\">leadership\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">passivity\u003c/span>\u003cspan class=\"a\">indifference\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">autonomy\u003c/b>\u003cspan class=\"m\">자율성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">independence\u003c/span>\u003cspan class=\"s\">self-determination\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dependence\u003c/span>\u003cspan class=\"a\">subordination\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">actively\u003c/b>\u003cspan class=\"m\">능동적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">proactively\u003c/span>\u003cspan class=\"s\">energetically\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">passively\u003c/span>\u003cspan class=\"a\">inactively\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fertile\u003c/b>\u003cspan class=\"m\">기름진, 비옥한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">productive\u003c/span>\u003cspan class=\"s\">rich\u003c/span>\u003cspan class=\"s\">fruitful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">barren\u003c/span>\u003cspan class=\"a\">infertile\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어와 반의어도 챙겨야 고득점이 가능하겠죠? 자발적으로라는 뜻의 spontaneously는 naturally나 voluntarily로 바꿔 쓸 수 있고요, 반대로 강제로라는 뜻의 forcibly와 대비됩니다. 또 autonomy 자율성은 independence와 맥락이 완벽히 같지만, 의존을 뜻하는 dependence와는 완전한 반의어라는 점 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶은\u003c/span>\u003cspan class=\"en\">Life is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가능성으로 가득 차 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">full \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> possibilities.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">삶은 가능성으로 가득 차 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 도입부로, 우리 삶에는 정해진 하나의 길만 있는 것이 아니라 무수히 많은 \u003cb class=\"key\">방향성\u003c/b>이 열려 있다는 것을 보여줍니다. 이어지는 내용에서 아이들이 스스로의 길을 찾도록 도와야 한다는 \u003cb class=\"key\">주제\u003c/b>를 암시하고 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용표현\u003c/span> : be 동사 + full + of 명사 : \"~로 가득 차 있다\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Life is, 삶은. full of possibilities, 가능성으로 가득 차 있다.. 이 문장 전체를 해석하면, 삶은 가능성으로 가득 차 있다.","hl":"m"},{"n":12,"text":"이 문장은 글의 도입부 역할을 하는데요. 우리 삶에는 정해진 단 하나의 길만 있는 것이 아니라 무수히 많은 방향성이 열려 있다는 것을 보여줘요. 이어지는 내용에서 아이들이 스스로의 길을 찾도록 도와야 한다는 이 글의 주제를 암시하고 있죠.","hl":"mn"},{"n":13,"text":"어법 포인트 짚어볼게요. 첫 번째로 비 풀 오브 형태를 볼 수 있는데요. 명사로 가득 차 있다라는 뜻의 관용표현이에요. 이 표현은 비 필드 위드로 바꿔 쓸 수 있는 아주 자주 쓰이는 표현이니까 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 우리가 정원사처럼\u003c/span>\u003cspan class=\"en\">If we, like gardeners,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적절한 환경을 제공하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">provide \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">suitable \u003c/span>\u003cspan class=\"tgt\">environment \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들이 자라도록 둔다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">let \u003c/span>\u003cspan class=\"tgt\">children \u003c/span>\u003cspan class=\"tgt\">grow\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신의 속도로\u003c/span>\u003cspan class=\"en\">at their own pace,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 자연스럽게 세상을 탐구할 것이다\u003c/span>\u003cspan class=\"en\">they will spontaneously explore the world,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호기심, 창의성, 그리고 독립심을 발달시키며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">developing\u003c/span> curiosity, creativity, and independence.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 우리가 정원사처럼 적절한 환경을 제공하고 아이들이 그들 자신의 속도로 자라도록 둔다면, 그들은 호기심, 창의성, 그리고 독립심을 발달시키며 자연스럽게 세상을 탐구할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 작가는 부모의 역할을 \u003cb class=\"key\">정원사\u003c/b>에 비유하며, 아이들의 \u003cb class=\"key\">자율성\u003c/b>을 존중할 때 긍정적인 발달이 이루어진다고 강조합니다. 이 문장은 글의 핵심 \u003cb class=\"key\">주제문\u003c/b> 역할을 하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : 동사 + and + 동사 : \"제공하고 ... 둔다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사\u003c/span> : let [사역동사] + children [목적어] + grow [목적격 보어/동사원형] : \"아이들이 자라도록 둔다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문 (동시동작)\u003c/span> : V-ing + 명사(목적어) : \"발달시키며\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"If we, like gardeners, 만약 우리가 정원사처럼. provide a suitable environment, 적절한 환경을 제공하고. and let children grow, 아이들이 자라도록 둔다면. at their own pace, 그들 자신의 속도로. they will spontaneously explore the world, 그들은 자연스럽게 세상을 탐구할 것이다. developing curiosity, creativity, and independence, 호기심, 창의성, 그리고 독립심을 발달시키며. 이 문장 전체를 해석하면, 만약 우리가 정원사처럼 적절한 환경을 제공하고 아이들이 그들 자신의 속도로 자라도록 둔다면, 그들은 호기심, 창의성, 그리고 독립심을 발달시키며 자연스럽게 세상을 탐구할 것이다.","hl":"m"},{"n":15,"text":"작가는 부모의 역할을 정원사에 비유하고 있어요. 아이들의 자율성을 존중할 때 긍정적인 발달이 이루어진다고 강조하고 있죠. 이 문장은 전체 글의 핵심적인 주제문 역할을 하고 있습니다.","hl":"mn"},{"n":16,"text":"어법 포인트 살펴볼게요. 첫 번째로 접속사 and를 중심으로 provide와 let 두 개의 동사 원형이 병렬 구조를 이루고 있어요. 두 번째 포인트는 let children grow 부분입니다. 여기서 let은 사역동사라서 목적격 보어 자리에 반드시 동사 원형인 grow를 써야 한다는 점 잊지 마세요. 세 번째로 developing은 동시동작을 나타내는 분사구문이에요. 주절의 주어인 아이들이 스스로 발달시키는 능동의 의미이기 때문에 현재분사 형태인 아이엔지 꼴이 쓰였답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 아이들은\u003c/span>\u003cspan class=\"en\">Such children\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶을 사랑하고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">love \u003c/span>\u003cspan class=\"tgt\">life, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">담대하게 도전하며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">dare \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">challenge, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진취성을 갖는다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">possess \u003c/span>\u003cspan class=\"tgt\">initiative\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러한 아이들은 삶을 사랑하고, 담대하게 도전하며, 진취성을 갖는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급한 정원사 방식의 양육이 가져오는 긍정적 결과를 나열하고 있습니다. 스스로 성장한 아이들은 삶에 대한 애정과 \u003cb class=\"key\">도전 \u003c/b>\u003cb class=\"key\">정신\u003c/b>, 그리고 주도적인 \u003cb class=\"key\">진취성\u003c/b>을 갖게 된다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : 동사1, 동사2, and 동사3 : \"삶을 사랑하고, 담대하게 도전하며, 진취성을 갖는다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"Such children, 그러한 아이들은. love life, 삶을 사랑하고. dare to challenge, 담대하게 도전하며. and possess initiative, 진취성을 갖는다.. 이 문장 전체를 해석하면, 그러한 아이들은 삶을 사랑하고, 담대하게 도전하며, 진취성을 갖는다.","hl":"m"},{"n":18,"text":"앞 문장에서 말한 정원사 방식의 양육이 가져오는 긍정적인 결과를 쭉 나열하고 있는 문장이에요. 부모가 강제하지 않고 스스로 성장한 아이들은 삶에 대한 애정과 도전 정신, 그리고 주도적인 진취성을 갖게 된다는 점을 강조하고 있죠.","hl":"mn"},{"n":19,"text":"어법 포인트 보겠습니다. 첫 번째로 and라는 등위접속사가 주어인 Such children 뒤에 이어지는 세 개의 동사, 즉 love, dare, possess를 나란히 연결해주고 있어요. 이렇게 동사가 세 개 이상 연결될 때 마지막 동사 앞에만 and를 써준다는 점을 확인해 두시면 좋겠습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 만약 우리가 목수처럼,\u003c/span>\u003cspan class=\"en\">But if we, like carpenters,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 아이들의 ‘형태를 만들려고’ 노력한다면\u003c/span>\u003cspan class=\"en\">always \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">try \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">&quot;shape&quot;\u003c/span> children\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 이상적인 모습에 맞춰,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">ideal \u003c/span>\u003cspan class=\"tgt\">image\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 점점 자율성을 잃어버릴 것이다,\u003c/span>\u003cspan class=\"en\">they will gradually lose autonomy,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">타인의 지시를 따르는 데 익숙해지면서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">becoming \u003c/span>\u003cspan class=\"tgt\">accustomed \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">following\u003c/span> others' instructions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 만약 우리가 목수처럼 항상 아이들을 우리의 이상적인 모습에 맞춰 ‘형태를 만들려고’ 노력한다면, 그들은 점점 자율성을 잃어버리고 타인의 지시를 따르는 데 익숙해질 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 정원사와 대비되는 \u003cb class=\"key\">목수\u003c/b>의 비유를 통해, 부모가 아이를 통제하려 할 때 발생하는 부정적 결과를 설명합니다. 아이를 억지로 끼워 맞추려 하면 결국 \u003cb class=\"key\">자율성\u003c/b>을 잃고 수동적인 존재가 된다는 경고를 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : try [타동사] + [to shape (to부정사구/목적어)] : \"형태를 만들려고 노력하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : shape A + into + B : \"우리의 이상적인 모습에 맞춰\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문 및 동명사 관용표현\u003c/span> : becoming [현재분사] + accustomed to [전치사] + [following (동명사)] : \"따르는 데 익숙해지면서\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"But if we, like carpenters, 그러나 만약 우리가 목수처럼. always try to \"shape\" children, 항상 아이들의 ‘형태를 만들려고’ 노력한다면. into our ideal image, 우리의 이상적인 모습에 맞춰. they will gradually lose autonomy, 그들은 점점 자율성을 잃어버릴 것이다. becoming accustomed to following others' instructions, 타인의 지시를 따르는 데 익숙해지면서.. 이 문장 전체를 해석하면, 그러나 만약 우리가 목수처럼 항상 아이들을 우리의 이상적인 모습에 맞춰 ‘형태를 만들려고’ 노력한다면, 그들은 점점 자율성을 잃어버리고 타인의 지시를 따르는 데 익숙해질 것이다.","hl":"m"},{"n":21,"text":"이 문장은 앞서 나온 정원사와 완벽하게 대비되는 목수의 비유를 들고 있어요. 부모가 목수처럼 아이를 부모 마음대로 통제하고 깎아내려 하면, 결국 아이는 자율성을 잃고 남이 시키는 대로만 하는 수동적인 존재가 된다고 경고하는 핵심적인 문장입니다.","hl":"mn"},{"n":22,"text":"어법 포인트 살펴볼게요. 첫 번째로 try to shape 부분을 보면요. try 뒤에 to부정사가 와서 형태를 만들려고 애쓰고 노력한다는 뜻을 나타내고 있어요. 두 번째로 shape 뒤에 나온 into는 변화의 결과를 보여주는 전치사로, 아이들을 우리의 이상적인 모습의 형태로 만든다는 의미를 더해줍니다. 세 번째로 콤마 뒤에 나온 becoming은 동시동작을 나타내는 분사구문이에요. 그들이 익숙해진다는 능동의 의미니까 현재분사를 썼고요. 특히 be accustomed to에서 to는 전치사이기 때문에 뒤에 반드시 동명사인 following이 와야 한다는 점 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 아이들은 그들의 방향 감각을 빠르게 잃어버린다\u003c/span>\u003cspan class=\"en\">Such children quickly lose their sense of direction\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 자라면서,\u003c/span>\u003cspan class=\"en\">as they grow,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그들은 놓여지는 것에 익숙하기 때문이다,\u003c/span>\u003cspan class=\"en\">because they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">arranged \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">능동적으로 자신의 길을 선택하기보다는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">actively \u003c/span>\u003cspan class=\"tgt\">choosing\u003c/span> their path.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러한 아이들은 자라면서 그들의 방향 감각을 빠르게 잃어버리는데, 왜냐하면 그들은 능동적으로 자신의 길을 선택하기보다는 놓여지는 것에 익숙하기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부모의 통제 속에 자란 아이들이 겪게 되는 장기적인 문제점을 구체화합니다. 스스로 선택할 기회가 없었기에 성장 후 삶의 \u003cb class=\"key\">방향 \u003c/b>\u003cb class=\"key\">감각\u003c/b>을 잃게 된다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사의 수동태\u003c/span> : be used to [전치사] + [being p.p. (동명사의 수동형)] : \"놓여지는 것에 익숙하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : rather than + [동명사/현재분사] : \"능동적으로 선택하기보다는\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Such children quickly lose their sense of direction, 그러한 아이들은 그들의 방향 감각을 빠르게 잃어버린다. as they grow, 그들이 자라면서. because they are used to being arranged for, 왜냐하면 그들은 놓여지는 것에 익숙하기 때문이다. rather than actively choosing their path, 능동적으로 자신의 길을 선택하기보다는.. 이 문장 전체를 해석하면, 그러한 아이들은 자라면서 그들의 방향 감각을 빠르게 잃어버리는데, 왜냐하면 그들은 능동적으로 자신의 길을 선택하기보다는 놓여지는 것에 익숙하기 때문이다.","hl":"m"},{"n":24,"text":"목수 같은 부모 밑에서 자란 아이들이 어떤 어른으로 커가는지 보여주는 문장이에요. 누군가 다 정해주는 대로만 살았기 때문에, 어른이 되어서 자기가 진짜 원하는 게 뭔지 방향 감각을 잃게 된다는 안타까운 결과를 설명하고 있죠.","hl":"mn"},{"n":25,"text":"문법을 살펴볼게요. 첫 번째로 are used to being arranged for 부분을 주의 깊게 봐야 해요. 여기서 to는 전치사라서 뒤에 명사나 동명사가 오는데, 아이들 입장에서는 남들에 의해 수동적으로 배치되는 거니까 동명사의 수동태인 being arranged for 형태를 썼어요. 두 번째로 rather than 뒤에 나오는 choosing은 앞의 being arranged for와 병렬 구조를 이루고 있습니다. 전치사 to에 같이 걸려있는 동명사라고 보면 되겠습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부모로서,\u003c/span>\u003cspan class=\"en\">As parents,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 역할은 정원사의 그것이어야 한다,\u003c/span>\u003cspan class=\"en\">our role should be \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">gardeners\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">햇빛, 비, 그리고 기름진 토양을 제공하며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">providing\u003c/span> sunlight, rain, and fertile soil,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이들이 자연스럽게 자라도록 해 준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">allowing \u003c/span>\u003cspan class=\"tgt\">children \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">grow\u003c/span> naturally\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신의 속도로.\u003c/span>\u003cspan class=\"en\">at their own pace.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">부모로서 우리의 역할은 햇빛, 비, 그리고 기름진 토양을 제공하는 것인 정원사의 그것이어야 하고, 이는 아이들이 그들 자신의 속도로 자연스럽게 자라도록 해 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글쓴이가 생각하는 바람직한 부모의 모습을 \u003cb class=\"key\">정원사\u003c/b>에 빗대어 결론짓습니다. 부모는 아이를 통제하는 대신, 아이가 스스로 성장할 수 있는 \u003cb class=\"key\">환경\u003c/b>을 조성해 주어야 함을 역설합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사\u003c/span> : that [대명사] + of + [명사] : \"정원사의 그것(역할)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : [현재분사] + [목적어] : \"제공하며 (제공하는 것인)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문 및 5형식 동사\u003c/span> : allowing [현재분사/5형식 동사] + [목적어] + [to부정사/목적격보어] : \"아이들이 자라도록 해 주면서\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"As parents, 부모로서. our role should be that of gardeners, 우리의 역할은 정원사의 그것이어야 한다. providing sunlight, rain, and fertile soil, 햇빛, 비, 그리고 기름진 토양을 제공하며. allowing children to grow naturally, 아이들이 자연스럽게 자라도록 해 준다. at their own pace, 그들 자신의 속도로.. 이 문장 전체를 해석하면, 부모로서 우리의 역할은 햇빛, 비, 그리고 기름진 토양을 제공하는 것인 정원사의 그것이어야 하고, 이는 아이들이 그들 자신의 속도로 자연스럽게 자라도록 해 준다.","hl":"m"},{"n":27,"text":"이제 필자가 하고 싶은 진짜 결론이 나옵니다. 우리는 목수가 아니라 정원사 같은 부모가 되어야 한다는 거예요. 정원사가 식물에게 물과 햇빛을 주듯, 부모도 아이를 마음대로 뜯어고치려 하지 말고 아이 스스로 성장할 수 있는 환경을 만들어 주어야 한다고 강조하고 있어요.","hl":"mn"},{"n":28,"text":"이 문장 어법 아주 중요합니다. 첫 번째로 that of gardeners에서 that은 바로 앞에 있는 단수 명사 role, 즉 역할을 대신 받는 대명사예요. 복수인 those를 쓰면 안 된다는 점 꼭 체크하세요. 두 번째로 콤마 뒤의 providing은 분사구문입니다. 부모의 역할이 능동적으로 햇빛과 비를 제공하는 거니까 현재분사를 썼죠. 세 번째로 allowing 역시 분사구문이면서 오형식 동사의 성질을 그대로 가지고 있어요. allow 뒤에 목적어 children이 오고, 목적격 보어 자리에 to grow처럼 to부정사가 온다는 완벽한 구조를 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 목수의 그것이면 안 된다,\u003c/span>\u003cspan class=\"en\">It should not be \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> of carpenters,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘완벽한’ 작품을 조각해 내려고 노력하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">trying \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">carve \u003c/span>\u003cspan class=\"tgt\">out\u003c/span> a &quot;perfect&quot; piece\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 의지대로.\u003c/span>\u003cspan class=\"en\">according to our will.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 우리의 의지대로 ‘완벽한’ 작품을 조각해 내려고 노력하는 것인 목수의 그것이면 안 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 말한 정원사와 반대되는 \u003cb class=\"key\">목수\u003c/b>의 비유를 들고 있어요. 부모의 역할이 아이를 부모의 \u003cb class=\"key\">의지\u003c/b>대로 억지로 깎고 다듬어 완벽한 작품으로 만들려는 목수의 역할과 같아서는 안 된다는 것을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 that\u003c/span> : that = the role : \"그것 (역할)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 구문 (능동)\u003c/span> : 명사(carpenters) + 현재분사(trying) : \"조각해 내려고 노력하는\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"It should not be that of carpenters, 그것은 목수의 그것이면 안 된다. trying to carve out a \"perfect\" piece, ‘완벽한’ 작품을 조각해 내려고 노력하는. according to our will, 우리의 의지대로.. 이 문장 전체를 해석하면, 그것은 우리의 의지대로 ‘완벽한’ 작품을 조각해 내려고 노력하는 것인 목수의 그것이면 안 된다.","hl":"m"},{"n":30,"text":"이 문장은 앞서 말한 정원사와 반대되는 목수의 비유를 들고 있어요. 부모의 역할이 아이를 부모의 의지대로 억지로 깎고 다듬어 완벽한 작품으로 만들려는 목수의 역할과 같아서는 안 된다는 것을 강조하고 있죠.","hl":"mn"},{"n":31,"text":"문법 포인트를 짚어볼게요. 첫 번째로 that of carpenters에서 that은 앞 문장에 나온 the role을 대신 받아주는 대명사예요. 단수 명사를 대신하니까 that을 썼죠. 두 번째로 trying은 콤마 뒤에서 목수들, 즉 carpenters가 어떤 행동을 하는지 설명해 주는 현재분사예요. 목수들이 직접 깎아내려고 노력하는 능동적인 입장이니까 현재분사 trying을 썼다는 걸 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교육의 핵심은 ~에서 시작한다\u003c/span>\u003cspan class=\"en\">The core of education starts with\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶을 이해하는 것과 아이들을 돕는 것에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">understanding \u003c/span>\u003cspan class=\"tgt\">life \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">helping \u003c/span>\u003cspan class=\"tgt\">children \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신만의 ‘지도’를 찾도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">find\u003c/span> their own &quot;map&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 방향을 찾기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">direction\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">복잡한 세상에서.\u003c/span>\u003cspan class=\"en\">in a complex world.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">교육의 핵심은 삶을 이해하는 것과 아이들이 복잡한 세상에서 자신의 방향을 찾기 위해 그들 자신만의 ‘지도’를 찾도록 돕는 것에서 시작한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 주제를 요약하는 결론 문장입니다. 참된 교육이란 부모가 정답을 주는 것이 아니라, 아이가 스스로 세상을 항해할 \u003cb class=\"key\">지도\u003c/b>를 찾고 \u003cb class=\"key\">자율성\u003c/b>을 기르도록 돕는 것임을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사의 목적어 병렬구조 (동명사)\u003c/span> : starts with [전치사] + understanding [동명사] and helping [동명사] : \"삶을 이해하는 것과 ~ 돕는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">준사역동사 help + 목적격 보어\u003c/span> : help [5형식 동사] + children [목적어] + find [동사원형/목적격 보어] : \"아이들이 찾도록 돕는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to find [to부정사] : \"그들의 방향을 찾기 위해\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"The core of education starts with, 교육의 핵심은 ~에서 시작한다. understanding life and helping children, 삶을 이해하는 것과 아이들을 돕는 것에서. find their own \"map\", 그들 자신만의 ‘지도’를 찾도록. to find their direction, 자신의 방향을 찾기 위해. in a complex world, 복잡한 세상에서.. 이 문장 전체를 해석하면, 교육의 핵심은 삶을 이해하는 것과 아이들이 복잡한 세상에서 자신의 방향을 찾기 위해 그들 자신만의 ‘지도’를 찾도록 돕는 것에서 시작한다.","hl":"m"},{"n":33,"text":"이 글의 결론이자 주제를 담고 있는 아주 중요한 문장이에요. 진짜 교육이란 부모가 아이의 길을 정해주는 게 아니라, 복잡한 세상 속에서 아이들 스스로 길을 찾을 수 있는 자율성, 즉 자기만의 지도를 갖도록 돕는 것이라는 점을 강조하고 있죠.","hl":"mn"},{"n":34,"text":"문법적으로 중요한 부분들을 살펴볼까요? 첫 번째로 starts with 뒤에 전치사 with의 목적어로 understanding과 helping이라는 동명사가 and로 묶여 병렬 구조를 만들고 있어요. 둘 다 아이엔지가 붙은 형태라는 걸 꼭 확인하세요. 두 번째로 helping children find 부분을 보면, 준사역동사 help의 목적격 보어로 동사원형 find가 쓰였어요. 이 자리에 to find가 와도 괜찮습니다. 마지막으로 to find their direction에서 to find는 방향을 찾기 위해라는 목적의 뜻을 나타내는 to부정사의 부사적 용법으로 쓰였답니다. 서술형으로도 나오기 좋은 문장이니 꼼꼼히 복습해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아이들에게 정원사처럼 \u003cb class=\"key\">적절한 \u003c/b>\u003cb class=\"key\">환경\u003c/b>을 제공하면 자연스럽게 호기심과 \u003cb class=\"key\">독립심\u003c/b>을 발달시킨다.\u003c/li>\u003cli>목수처럼 억지로 \u003cb class=\"key\">이상적인 \u003c/b>\u003cb class=\"key\">모습\u003c/b>에 맞춰 형태를 만들려 하면 아이들은 \u003cb class=\"key\">자율성\u003c/b>을 잃는다.\u003c/li>\u003cli>통제받고 자란 아이들은 스스로 길을 선택하지 못해 \u003cb class=\"key\">방향 \u003c/b>\u003cb class=\"key\">감각\u003c/b>을 빠르게 상실한다.\u003c/li>\u003cli>부모는 아이가 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">속도\u003c/b>로 자라도록 환경을 제공하고 자신만의 \u003cb class=\"key\">지도\u003c/b>를 찾도록 도와야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Parents should act as gardeners who foster a child's natural growth rather than carpenters who force them into a predetermined shape.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">부모는 아이를 통제하여 이상적인 모습으로 조각하는 \u003cb class=\"key\">목수\u003c/b>가 아니라, 스스로 성장할 수 있도록 환경을 제공하는 \u003cb class=\"key\">정원사\u003c/b>가 되어 아이의 \u003cb class=\"key\">자율성\u003c/b>과 \u003cb class=\"key\">진취성\u003c/b>을 길러주어야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":35,"text":"자, 오늘 지문 어떠셨나요? 부모님이 나를 어떻게 키우고 계신지, 나는 나중에 어떤 어른이 될지 깊이 생각해 보게 만드는 좋은 글이었습니다. 아이가 스스로 지도를 그릴 수 있게 환경을 마련해 주는 정원사의 역할, 절대 잊지 마시고요. 복습 꼼꼼하게 하시고 우리는 다음 강의에서 웃으면서 만나요!","hl":null}]}]});</script></body></html>
