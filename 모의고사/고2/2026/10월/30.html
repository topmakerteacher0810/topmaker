<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 30번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 30번","audioDir":"30_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">30번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>The Dominance of Nonverbal Signals over Verbal Messages\u003c/h1>\u003ch2>언어적 메시지에 대한 비언어적 신호의 우위\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사람들은 언어적 메시지보다 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>를 더 신뢰하기 때문에, 두 메시지가 \u003cb class=\"key\">모순되는\u003c/b> 상황에서는 비언어적 의사소통이 우위를 차지한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>People trust nonverbal signals more than verbal messages, especially when the two are conflicting.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 살펴볼 지문은 우리가 대화할 때 말과 행동 중 어떤 것을 더 믿게 되는지에 관한 재미있는 글이에요. 이 글은 사람들은 언어적 메시지보다 비언어적 신호를 더 신뢰하기 때문에, 두 메시지가 모순되는 상황에서는 비언어적 의사소통이 우위를 차지한다는 요지를 담고 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 대화할 때 말의 내용인 \u003cb class=\"key\">언어적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>(verbal message)와 표정이나 몸짓 같은 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>(nonverbal signal)를 함께 사용합니다. 그런데 누군가가 입으로는 괜찮다고 하면서 얼굴은 잔뜩 찡그린다면 우리는 그 사람의 기분이 안 좋다고 판단하죠. 심리학에서는 시각적, 청각적인 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">요소\u003c/b>가 말의 내용보다 훨씬 큰 영향을 미친다고 설명합니다. 마치 예쁘게 포장된 상자를 열었는데 안에서 썩은 냄새가 나면 포장지보다 냄새를 진짜라고 믿는 것과 같습니다. 따라서 두 메시지가 \u003cb class=\"key\">모순되는 \u003c/b>\u003cb class=\"key\">상황\u003c/b>(conflicting situation)일수록 사람들은 비언어적 단서를 통해 상대의 진짜 의도를 파악하려고 합니다.\u003c/div>","segs":[{"n":2,"text":"우리가 대화할 때 말의 내용인 언어적 메시지와 표정이나 몸짓 같은 비언어적 신호를 함께 사용하죠. 그런데 누군가가 입으로는 괜찮다고 하면서 얼굴은 잔뜩 찡그린다면 우리는 그 사람의 기분이 안 좋다고 판단해요. 마치 예쁘게 포장된 상자를 열었는데 안에서 썩은 냄새가 나면 포장지보다 냄새를 진짜라고 믿는 것과 같아요. 심리학에서도 시각적, 청각적인 비언어적 요소가 말의 내용보다 훨씬 큰 영향을 미친다고 설명한답니다. 따라서 두 메시지가 모순되는 상황일수록 사람들은 비언어적 단서를 통해 상대의 진짜 의도를 파악하려고 해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>한 연구에 따르면 사람들의 의사소통에서 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>가 우위를 차지합니다. 특히 말의 내용과 표정, 행동이 일치하지 않는 \u003cb class=\"key\">모순되는\u003c/b> 상황에서 이런 현상은 더욱 두드러집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>주장 및 근거\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>언어와 비언어가 일치하지 않으면 말로 타인을 조종하려는 시도는 \u003cb class=\"key\">실패\u003c/b>하게 됩니다. 왜냐하면 사람들은 본능적으로 언어적 메시지보다 비언어적 메시지를 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">신뢰\u003c/b>하기 때문입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>예시\u003csmall>예시 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>말로는 함께해서 즐겁다고 하지만 눈길을 돌리고 \u003cb class=\"key\">억지웃음\u003c/b>을 지을 때 우리는 그 말을 믿지 않습니다. 또한 병가 후 돌아왔을 때 동료가 언짢은 표정으로 기꺼이 일을 대신해 줬다고 말해도 그 \u003cb class=\"key\">진심\u003c/b>을 믿지 않게 되는 것과 같습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이 글이 어떻게 전개되는지 흐름을 단계별로 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째로 도입부에서는 한 연구에 따르면 사람들의 의사소통에서 비언어적 신호가 우위를 차지한다고 설명해요. 특히 말의 내용과 표정, 행동이 일치하지 않는 모순되는 상황에서 이런 현상은 더욱 두드러지게 나타난다고 하네요.","hl":"f0"},{"n":5,"text":"두 번째로 주장과 근거를 제시하는 부분이에요. 언어와 비언어가 일치하지 않으면 말로 타인을 조종하려는 시도는 실패하게 된다고 주장하죠. 왜냐하면 사람들은 본능적으로 언어적 메시지보다 비언어적 메시지를 더 신뢰하기 때문이라는 근거를 듭니다.","hl":"f1"},{"n":6,"text":"마지막으로 구체적인 예시 두 가지가 나옵니다. 말로는 함께해서 즐겁다고 하지만 눈길을 돌리고 억지웃음을 지을 때 우리는 그 말을 믿지 않죠. 또한 병가 후 돌아왔을 때 동료가 언짢은 표정으로 기꺼이 일을 대신해 줬다고 말해도 그 진심을 믿지 않게 되는 상황을 묘사하며 글을 마무리합니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부에서 비언어적 신호의 \u003cb class=\"key\">우위\u003c/b>를 연구 결과를 통해 제시하고 있습니다. 이어서 언어적 메시지와 비언어적 메시지가 다를 때 비언어적 메시지를 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">신뢰\u003c/b>한다는 글의 \u003cb class=\"key\">주제\u003c/b>를 명확히 밝힙니다. 후반부에는 일상에서 겪을 수 있는 구체적인 \u003cb class=\"key\">예시\u003c/b> 두 가지를 들어 주장을 뒷받침합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>however (2)\u003c/b>\u003cspan>강조 (특정 상황 부각)\u003c/span>\u003cb>therefore (3)\u003c/b>\u003cspan>결과 및 주장 도출\u003c/span>\u003cb>because (4)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">nonverbal signals\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">nonverbal messages\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">accompanying nonverbal communication\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">forcing a smile\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">annoyed expression\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>비언어적 신호 (Nonverbal signals)\u003c/th>\u003cth>언어적 메시지 (Verbal messages)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>표정, 행동 등\u003c/td>\u003ctd>말의 내용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사람들이 더 신뢰함\u003c/td>\u003ctd>사람들이 덜 신뢰함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>진심을 숨기기 어려움\u003c/td>\u003ctd>거짓으로 조작 시도 가능\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 전형적인 주장과 근거, 그리고 예시로 이루어진 두괄식 구조를 띠고 있어요. 글의 초반부에서 비언어적 신호의 우위를 연구 결과를 통해 제시하고, 사람들이 비언어적 메시지를 더 신뢰한다는 주제를 명확히 밝힙니다. 후반부에는 일상에서 겪을 수 있는 구체적인 예시 두 가지를 들어 주장을 튼튼하게 뒷받침하고 있죠.","hl":"ty"},{"n":8,"text":"글의 구조를 파악할 때 연결어를 유심히 보는 것이 아주 중요해요. 두 번째 문장의 however는 특정 상황을 부각시키기 위해 쓰였고, 세 번째 문장의 therefore는 앞의 내용을 바탕으로 결과를 도출해 주장을 완성합니다. 이어서 네 번째 문장의 because는 사람들이 왜 비언어를 더 믿는지 그 근거를 제시해 주죠. 또한 비언어적 신호라는 개념이 글 전체에 걸쳐 행동이나 억지웃음, 언짢은 표정 등으로 반복되며 대조 구조를 잘 보여줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>confirm\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확인하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dominance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우위, 지배\u003c/span>\u003c/div>\u003cdiv>\u003cb>nonverbal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비언어적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>signal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신호\u003c/span>\u003c/div>\u003cdiv>\u003cb>phenomenon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현상\u003c/span>\u003c/div>\u003cdiv>\u003cb>pronounced\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>두드러진, 확연한\u003c/span>\u003c/div>\u003cdiv>\u003cb>conflict\u003c/b>\u003cem>동사\u003c/em>\u003cspan>모순되다, 충돌하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>content\u003c/b>\u003cem>명사\u003c/em>\u003cspan>내용\u003c/span>\u003c/div>\u003cdiv>\u003cb>differ\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다르다, 일치하지 않다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attempt\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시도\u003c/span>\u003c/div>\u003cdiv>\u003cb>manipulate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조종하다, 다루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>verbally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>언어적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>fail\u003c/b>\u003cem>동사\u003c/em>\u003cspan>실패하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>accompany\u003c/b>\u003cem>동사\u003c/em>\u003cspan>동반하다, 수반하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>match\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일치하다, 어울리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>trust\u003c/b>\u003cem>동사\u003c/em>\u003cspan>신뢰하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>look away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>눈길을 돌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>force a smile\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>억지웃음을 짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inclined\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>~하는 경향이 있는, ~하고 싶은\u003c/span>\u003c/div>\u003cdiv>\u003cb>colleague\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동료\u003c/span>\u003c/div>\u003cdiv>\u003cb>annoyed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>언짢은, 짜증 난\u003c/span>\u003c/div>\u003cdiv>\u003cb>expression\u003c/b>\u003cem>명사\u003c/em>\u003cspan>표정, 표현\u003c/span>\u003c/div>\u003cdiv>\u003cb>take over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>떠맡다, 인계받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>workload\u003c/b>\u003cem>명사\u003c/em>\u003cspan>업무량\u003c/span>\u003c/div>\u003cdiv>\u003cb>replace\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대신하다, 대체하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"지문에서 눈여겨봐야 할 핵심 단어들을 짚어볼게요. manipulate는 다른 사람을 내 뜻대로 조종하고 다루려 할 때 쓰는 동사예요. 그리고 inclined는 무엇무엇 하는 경향이 있는, 혹은 하고 싶은 이라는 뜻으로 사람들의 마음이나 행동 패턴을 설명할 때 자주 등장한답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">dominance\u003c/b>\u003cspan class=\"m\">우위\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">superiority\u003c/span>\u003cspan class=\"s\">supremacy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">subordination\u003c/span>\u003cspan class=\"a\">inferiority\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">pronounced\u003c/b>\u003cspan class=\"m\">두드러진\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">noticeable\u003c/span>\u003cspan class=\"s\">distinct\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003cspan class=\"a\">unnoticeable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">conflict\u003c/b>\u003cspan class=\"m\">모순되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">clash\u003c/span>\u003cspan class=\"s\">contradict\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">agree\u003c/span>\u003cspan class=\"a\">accord\u003c/span>\ 여러분이 알아차리면 여러분은 아마도 그들의 말을 덜 믿게 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 말(언어)과 행동(비언어)이 일치하지 않는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 보여줍니다. 상대방이 말로는 좋다고 하면서 시선을 피하고 억지웃음을 지으면 그 말의 \u003cb class=\"key\">신뢰도\u003c/b>가 떨어진다는 것을 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 동사와 명사절 접속사\u003c/span> : tell [간접목적어] + [that + 완전한 문장 (직접목적어)] : \"여러분에게 ~라고 말하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : enjoy + [동명사 (목적어)] : \"보내는 것을 즐기다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문과 병렬 구조\u003c/span> : 의문사(how) + 주어(they) + 동사(are looking ~ and are forcing) : \"그들이 눈길을 돌리고 억지웃음을 짓고 있는 모습을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">be inclined to 부정사\u003c/span> : be inclined + [to부정사] : \"덜 믿게 될\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"When somebody tells you, 누군가가 여러분에게 말할(때). that they enjoy spending time with you, 그들이 여러분과 시간을 보내는 것을 즐긴다고. but you notice, 하지만 여러분이 알아차리면. how they are looking away, 그들이 (어떻게) 눈길을 돌리고 있는지. and are forcing a smile, 그리고 억지웃음을 짓고 있는지(모습을). you are probably less inclined, 여러분은 아마도 덜 ~하게 될 것이다. to believe their words, 그들의 말을 믿게. 이 문장 전체를 해석하면, 누군가가 여러분에게 그들이 여러분과 시간을 보내는 것을 즐긴다고 말하지만 그들이 눈길을 돌리고 억지웃음을 짓고 있는 모습을 여러분이 알아차리면 여러분은 아마도 그들의 말을 덜 믿게 될 것이다.","hl":"m"},{"n":24,"text":"앞서 말한 내용의 구체적 예시를 들고 있어요. 말로는 좋다고 하지만 행동으로는 시선을 피하고 억지로 웃는 등 말과 행동이 다를 때, 우리는 그 사람의 말에 대한 신뢰도가 떨어지게 된다는 걸 일상적인 상황으로 잘 보여줍니다.","hl":"mn"},{"n":25,"text":"어법이 꽤 많아요. 첫 번째로 tells you that을 볼까요. tells 뒤에 여러분에게라는 간접목적어가 오고, 그 뒤에 직접목적어 역할을 하는 명사절 접속사 that이 이끄는 문장이 왔어요. 두 번째는 enjoy spending입니다. enjoy는 목적어로 꼭 동명사만 데리고 다니니까 to spend가 아니라 spending이 온 거 기억하세요. 세 번째로 notice 뒤의 how they are looking away and are forcing 부분은 간접의문문이 notice의 목적어 역할을 하고 있어요. 게다가 안에서 are looking과 are forcing이 and로 묶인 병렬 구조라는 점도 중요합니다. 마지막으로 less inclined to believe는 뭐뭐하는 경향이 있다는 뜻의 be inclined to 부정사에 less가 붙어서, 그럴 가능성이 더 적다, 즉 덜 믿게 될 거다라는 의미를 만들어냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 마찬가지일 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">probably \u003c/span>\u003cspan class=\"tgt\">true\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 회사로 돌아갔을 때\u003c/span>\u003cspan class=\"en\">when you are back at the office\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">병이 나은 후\u003c/span>\u003cspan class=\"en\">after a sickness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 여러분의 동료가 여러분에게 말할 (때에도)\u003c/span>\u003cspan class=\"en\">and your colleague tells you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언짢은 표정으로\u003c/span>\u003cspan class=\"en\">with an \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">annoyed\u003c/span> expression\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즐거웠다고\u003c/span>\u003cspan class=\"en\">that they were \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">happy \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 업무량을 떠맡게 되어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">over\u003c/span> your workload.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분이 병이 나은 후 회사로 돌아갔을 때 여러분의 동료가 여러분의 업무량을 떠맡게 되어 즐거웠다고 언짢은 표정으로 여러분에게 말할 때에도 아마도 마찬가지일 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 언어와 비언어가 일치하지 않아 신뢰하지 못하는 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">예시\u003c/b>입니다. 말로는 내 일을 대신해 줘서 기뻤다지만 표정은 짜증 나 있다면, 앞의 예시처럼 그 말을 곧이곧대로 \u003cb class=\"key\">믿지 \u003c/b>\u003cb class=\"key\">않는다\u003c/b>는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">The same is true of/when 구문\u003c/span> : The same is true + [when 절] : \"아마도 마찬가지일 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감정을 나타내는 과거분사\u003c/span> : annoyed + [expression (명사)] : \"언짢은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(감정의 원인)\u003c/span> : 감정 형용사(happy) + [to부정사] : \"떠맡게 되어 즐거운\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"The same is probably true, 아마도 마찬가지일 것이다. when you are back at the office, 여러분이 회사로 돌아갔을 때. after a sickness, 병이 나은 후. and your colleague tells you, 그리고 여러분의 동료가 여러분에게 말할 (때에도). with an annoyed expression, 언짢은 표정으로. that they were happy, 즐거웠다고. to take over your workload, 여러분의 업무량을 떠맡게 되어. 이 문장 전체를 해석하면, 여러분이 병이 나은 후 회사로 돌아갔을 때 여러분의 동료가 여러분의 업무량을 떠맡게 되어 즐거웠다고 언짢은 표정으로 여러분에게 말할 때에도 아마도 마찬가지일 것이다.","hl":"m"},{"n":27,"text":"이번엔 두 번째 예시를 들어줍니다. 내가 아파서 쉰 동안 내 일을 대신해 준 동료가 말로는 도와줘서 기뻤어라고 하지만 짜증 나는 표정을 짓고 있다면 어떨까요? 방금 전 상황과 똑같이 우리는 동료의 말을 온전히 믿지 않는다는 이야기를 하고 있어요.","hl":"mn"},{"n":28,"text":"어법 세 가지 볼게요. 첫 번째로 맨 앞의 The same is probably true는 앞의 상황이 뒤의 상황에도 똑같이 적용됨을 의미하는 아주 자주 쓰이는 구문이에요. 두 번째로 annoyed expression을 보면, 짜증을 유발하는 게 아니라 동료가 짜증을 느끼는, 즉 표정에 그 수동의 의미가 담겨있기 때문에 과거분사 annoyed를 썼습니다. 세 번째는 happy to take over 부분인데요, 여기서 to take over는 앞의 감정 형용사인 happy의 원인을 설명하는 to부정사의 부사적 용법으로 쓰여서 떠맡게 되어서 기뻤다라고 해석이 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 아마도 믿지 않을 것이다\u003c/span>\u003cspan class=\"en\">You might not \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 여러분을 대신하기를 즐거워했다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> they \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">enjoyed \u003c/span>\u003cspan class=\"tgt\">replacing\u003c/span> you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 없는 동안.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">gone\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 아마도 그들이 여러분이 없는 동안 여러분을 대신하기를 즐거워했다는 것을 믿지 않을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장의 상황에 대한 결론으로, 동료의 말보다 표정이라는 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">메시지\u003c/b>를 더 신뢰하게 됨을 보여줍니다. 언어와 비언어가 불일치할 때 사람들은 비언어적 신호를 더 믿게 된다는 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>를 재확인하며 마무리하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : believe [타동사] + [that + 완전한 절 (명사절/목적어)] : \"믿다 (that 이하)라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : enjoy [타동사] + [V-ing (동명사/목적어)] : \"대신하기를 즐거워했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">시간의 접속사와 숙어 표현\u003c/span> : while [접속사] + [주어 + 동사] : \"여러분이 없는 동안\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"You might not believe, 여러분은 아마도 믿지 않을 것이다. that they enjoyed replacing you, 그들이 여러분을 대신하기를 즐거워했다는 것을. while you were gone, 여러분이 없는 동안.. 이 문장 전체를 해석하면, 여러분은 아마도 그들이 여러분이 없는 동안 여러분을 대신하기를 즐거워했다는 것을 믿지 않을 것이다.","hl":"m"},{"n":30,"text":"이 문장은 바로 앞 문장에서 제시된 상황의 결론이에요. 동료가 일이 기뻤다고 말해도 표정이 짜증 나 보인다면, 우리는 그 비언어적 메시지를 더 믿게 되죠. 결국 그 사람의 말을 믿지 않게 된다는 내용으로, 글 전체의 핵심 주제를 자연스럽게 마무리하고 있어요.","hl":"mn"},{"n":31,"text":"어법 포인트 짚어볼게요. 첫 번째로 believe 뒤에 온 that은 명사절을 이끄는 접속사예요. 목적어 역할을 하는 완전한 절을 연결해주고 있죠. 두 번째로 enjoyed replacing을 보세요. 동사 enjoy는 동명사를 목적어로 취하는 동사라서 뒤에 to replace가 아닌 동명사 replacing이 왔다는 점 꼭 기억하세요. 마지막으로 while you were gone에서 while은 뭐뭐 하는 동안이라는 뜻의 접속사고, be gone은 자리에 없다는 뜻의 관용 표현이랍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Eva McMahan 교수의 연구는 대화에서 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>가 지니는 우위를 확인해 주었다.\u003c/li>\u003cli>이 현상은 말과 행동의 내용이 일치하지 않는 \u003cb class=\"key\">모순되는\u003c/b> 상황에서 특히 두드러진다.\u003c/li>\u003cli>사람들은 언어적 메시지보다 비언어적 메시지를 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">신뢰\u003c/b>하기 때문에, 비언어가 일치하지 않는 언어적 조종 시도는 실패한다.\u003c/li>\u003cli>억지웃음을 짓거나 언짢은 표정으로 좋은 말을 하는 \u003cb class=\"key\">예시\u003c/b>에서 보듯, 우리는 상대방의 비언어적 단서를 통해 진짜 감정을 파악한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>People trust nonverbal signals more than verbal messages, especially when the two are conflicting.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사람들은 언어적 메시지보다 \u003cb class=\"key\">비언어적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>를 더 신뢰하기 때문에, 두 메시지가 \u003cb class=\"key\">모순되는\u003c/b> 상황에서는 비언어적 의사소통이 우위를 차지한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":32,"text":"자, 이렇게 해서 언어적 메시지와 비언어적 신호가 충돌할 때 우리가 무엇을 더 믿는지에 대한 지문을 모두 분석해 보았어요. 사람들이 무의식적으로 행동과 표정을 더 신뢰한다는 점, 잊지 마시고요. 복습 꼼꼼히 하시고 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
