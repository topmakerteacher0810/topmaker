</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 33번","audioDir":"2026-10-g2-33_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">33번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>Human Development as an Ongoing Process: The Concept of Plasticity\u003c/h1>\u003ch2>계속 진행되는 과정으로서의 인간 발달: 가소성의 개념\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인간 발달은 고정된 단계가 아니라 평생에 걸친 \u003cb class=\"key\">가소성\u003c/b>을 바탕으로 변화하고 적응하는 \u003cb class=\"key\">능동적\u003c/b> 과정이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Human development is an ongoing, lifelong process driven by plasticity, enabling continuous adaptation and growth.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘 함께 공부할 지문은 고등학교 2학년 모의고사 영어 독해입니다. 인간의 발달 과정에 대한 현대적인 시각을 다루고 있는 아주 흥미로운 글이에요. 이 지문의 요약은 인간 발달은 고정된 단계가 아니라 평생에 걸친 가소성을 바탕으로 변화하고 적응하는 능동적 과정이라는 것입니다. 요지는 Human development is an ongoing, lifelong process driven by plasticity, enabling continuous adaptation and growth 입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">뇌과학이나 심리학에서 말하는 \u003cb class=\"key\">가소성(Plasticity)\u003c/b>은 형태를 자유롭게 바꿀 수 있는 성질을 뜻해요. 찰흙을 생각하면 이해하기 쉽습니다. 굳어버린 돌과 달리, 찰흙은 외부에서 힘을 가하는 대로 여러 가지 모양으로 \u003cb class=\"key\">변형\u003c/b>될 수 있죠. 예전에는 인간의 뇌와 발달이 어른이 되면 굳어버린다고 생각했어요. 하지만 현대 과학은 인간이 평생 동안 새로운 경험과 환경에 맞춰 스스로를 \u003cb class=\"key\">재구성\u003c/b>할 수 있다는 사실을 밝혀냈답니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 독해에 앞서 배경지식을 좀 살펴볼게요. 뇌과학이나 심리학에서 말하는 가소성은 형태를 자유롭게 바꿀 수 있는 성질을 뜻해요. 영어로는 Plasticity 라고 하죠. 찰흙을 생각하면 이해하기 쉽습니다. 굳어버린 돌과 달리, 찰흙은 외부에서 힘을 가하는 대로 여러 가지 모양으로 변형될 수 있잖아요. 예전에는 인간의 뇌와 발달이 어른이 되면 굳어버린다고 생각했어요. 하지만 현대 과학은 인간이 평생 동안 새로운 경험과 환경에 맞춰 스스로를 재구성할 수 있다는 사실을 밝혀냈답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입\u003csmall>주제 제시 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>인간 발달은 고정된 단계가 아니라 유연하고 계속되는 과정으로 이해되며, 그 핵심에는 \u003cb class=\"key\">가소성\u003c/b>이라는 개념이 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>개념 정의\u003csmall>상술 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>가소성이란 경험과 환경에 반응하여 스스로를 변화시키는 능력이며, 이는 인간이 발달의 \u003cb class=\"key\">능동적인 \u003c/b>\u003cb class=\"key\">주체\u003c/b>임을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>통념\u003csmall>대조 대상 · 문장 5\u003c/small>\u003c/h4>\u003cp>이전에는 발달이 주로 \u003cb class=\"key\">아동기\u003c/b>에만 일어나고 성인기는 안정, 노년기는 쇠퇴하는 시기라고 여겨졌습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>반박 및 결론\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>가소성의 개념은 이러한 경직된 사고에 이의를 제기하며, 변화의 정도는 다를지라도 \u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">생애\u003c/b>에 걸쳐 적응과 변화가 가능하다는 점을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문이 어떻게 전개되는지 그 흐름을 네 단계로 나누어 살펴볼까요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입입니다. 첫 번째 문장과 두 번째 문장이에요. 인간 발달은 고정된 단계가 아니라 유연하고 계속되는 과정으로 이해되며, 그 핵심에는 가소성이라는 개념이 있다고 소개합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 개념 정의입니다. 세 번째, 네 번째 문장이죠. 가소성이란 경험과 환경에 반응하여 스스로를 변화시키는 능력이며, 이는 인간이 발달의 능동적인 주체임을 강조합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 통념입니다. 다섯 번째 문장이에요. 이전에는 발달이 주로 아동기에만 일어나고 성인기는 안정, 노년기는 쇠퇴하는 시기라고 여겨졌다는 과거의 시각을 보여줍니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 반박 및 결론입니다. 여섯 번째, 일곱 번째 문장이에요. 가소성의 개념은 이러한 경직된 사고에 이의를 제기하며, 변화의 정도는 다를지라도 전 생애에 걸쳐 적응과 변화가 가능하다는 점을 강조하면서 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 인간 발달에 대한 현대의 관점을 먼저 제시하는 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다. 과거의 \u003cb class=\"key\">경직된\u003c/b> 관점과 현대의 유연한 \u003cb class=\"key\">가소성\u003c/b> 개념을 뚜렷하게 대비하고 있습니다. 이를 통해 인간은 평생 동안 성장한다는 주제를 효과적으로 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>rather than (1)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>In earlier views (5)\u003c/b>\u003cspan>통념 제시\u003c/span>\u003cb>challenges (6)\u003c/b>\u003cspan>반박\u003c/span>\u003cb>Although (7)\u003c/b>\u003cspan>양보 및 결론 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">ongoing, flexible, and evolving process\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">concept of plasticity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">capacity to change, adapt, and reorganize\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">active agents capable of growth\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">development continues across the entire lifespan\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">room for adaptation and transformation\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>이전의 관점 (Earlier views)\u003c/th>\u003cth>가소성 개념 (Concept of plasticity)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>고정된 순서의 단계들 (fixed sequence of stages)\u003c/td>\u003ctd>진행 중이고 유연한 과정 (ongoing, flexible process)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>발달은 아동기에 주로 발생 (mainly during childhood)\u003c/td>\u003ctd>전 생애에 걸쳐 계속됨 (across the entire lifespan)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>수동적인 수용자 (passive recipients)\u003c/td>\u003ctd>능동적인 주체 (active agents)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 과거의 관점과 현재의 관점을 비교하고 대조하는 방식으로 쓰였어요. 동시에 글의 핵심 주제를 맨 앞에 던져주는 두괄식 구조를 취하고 있습니다. 과거의 경직된 관점과 현대의 유연한 가소성 개념을 뚜렷하게 대비시켜서, 인간은 평생 동안 성장한다는 메시지를 강렬하게 전달하고 있죠.","hl":"ty"},{"n":9,"text":"지문을 읽으면서 눈여겨볼 신호어들이 있어요. 첫 번째 문장에 나오는 rather than 은 고정된 단계가 아니라는 점을 강조하며 대조를 이룹니다. 다섯 번째 문장의 In earlier views 는 과거의 통념을 보여주는 전형적인 신호어죠. 이어서 여섯 번째 문장의 challenges 를 통해 과거의 시각을 강하게 반박하고 있어요. 글 전체에 걸쳐 ongoing process, concept of plasticity, active agents 등의 표현들이 계속해서 같은 개념을 다른 말로 바꾸어 가며 등장한다는 점도 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>development\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발달\u003c/span>\u003c/div>\u003cdiv>\u003cb>increasingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>점점, 갈수록 더\u003c/span>\u003c/div>\u003cdiv>\u003cb>ongoing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>계속 진행 중인\u003c/span>\u003c/div>\u003cdiv>\u003cb>flexible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유연한\u003c/span>\u003c/div>\u003cdiv>\u003cb>evolve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>서서히 발전하다, 진화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sequence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>순서, 연속\u003c/span>\u003c/div>\u003cdiv>\u003cb>perspective\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관점\u003c/span>\u003c/div>\u003cdiv>\u003cb>plasticity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가소성\u003c/span>\u003c/div>\u003cdiv>\u003cb>capacity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>reorganize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재구성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cognitive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인지적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>highlight\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>merely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>단지, 그저\u003c/span>\u003c/div>\u003cdiv>\u003cb>passive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수동적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>recipient\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수용자\u003c/span>\u003c/div>\u003cdiv>\u003cb>agent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주체, 행위자\u003c/span>\u003c/div>\u003cdiv>\u003cb>stability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안정\u003c/span>\u003c/div>\u003cdiv>\u003cb>phase\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단계, 시기\u003c/span>\u003c/div>\u003cdiv>\u003cb>decline\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쇠퇴, 감소\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이의를 제기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rigid\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>경직된\u003c/span>\u003c/div>\u003cdiv>\u003cb>outlook\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사고방식, 관점\u003c/span>\u003c/div>\u003cdiv>\u003cb>emphasize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lifespan\u003c/b>\u003cem>명사\u003c/em>\u003cspan>평생, 전 생애\u003c/span>\u003c/div>\u003cdiv>\u003cb>extent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정도, 규모\u003c/span>\u003c/div>\u003cdiv>\u003cb>vary\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다르다, 다양하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>adaptation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>적응\u003c/span>\u003c/div>\u003cdiv>\u003cb>transformation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변화, 변형\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개 짚고 넘어갈게요. 먼저 plasticity 는 가소성이라는 뜻으로 이 글의 가장 중요한 키워드입니다. 꼭 외워두셔야 해요. 그리고 recipient 는 수용자, agent 는 행위자나 주체라는 뜻인데, 이 두 단어가 지문 속에서 수동과 능동의 대비를 이루며 사용되고 있다는 점을 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">flexible\u003c/b>\u003cspan class=\"m\">유연한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adaptable\u003c/span>\u003cspan class=\"s\">pliable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rigid\u003c/span>\u003cspan class=\"a\">inflexible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">adapt\u003c/b>\u003cspan class=\"m\">적응하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adjust\u003c/span>\u003cspan class=\"s\">accommodate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">passive\u003c/b>\u003cspan class=\"m\">수동적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inactive\u003c/span>\u003cspan class=\"s\">submissive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">active\u003c/span>\u003cspan class=\"a\">dynamic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stability\u003c/b>\u003cspan class=\"m\">안정\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">steadiness\u003c/span>\u003cspan class=\"s\">constancy\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">instability\u003c/span>\u003cspan class=\"a\">fluctuation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">decline\u003c/b>\u003cspan class=\"m\">쇠퇴\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deterioration\u003c/span>\u003cspan class=\"s\">decay\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">growth\u003c/span>\u003cspan class=\"a\">improvement\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rigid\u003c/b>\u003cspan class=\"m\">경직된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">strict\u003c/span>\u003cspan class=\"s\">stiff\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">flexible\u003c/span>\u003cspan class=\"a\">elastic\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 잘 나오는 동의어와 반의어도 정리해 보겠습니다. flexible 은 유연한 이라는 뜻인데요, 동의어로는 adaptable, pliable 이 있고, 반의어로는 지문에도 등장한 rigid, 그리고 inflexible 이 있습니다. passive 는 수동적인 이라는 뜻이죠. 동의어는 inactive, submissive 가 있고, 반의어는 active, dynamic 입니다. decline 은 쇠퇴라는 뜻이고요, 동의어는 deterioration, 반의어는 growth 로 챙겨두시면 좋겠습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간 발달은 오늘날 점점 이해되고 있다\u003c/span>\u003cspan class=\"en\">Human development \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">increasingly \u003c/span>\u003cspan class=\"tgt\">understood\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계속 진행 중이고, 유연하며, 그리고 서서히 발전하는 과정으로\u003c/span>\u003cspan class=\"en\">as an \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ongoing, \u003c/span>\u003cspan class=\"tgt\">flexible, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">evolving\u003c/span> process\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고정된 순서의 단계들이라기보다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than\u003c/span> a fixed sequence of stages.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인간 발달은 고정된 순서의 단계들이라기보다는 계속 진행 중이고, 유연하며, 그리고 서서히 발전하는 과정으로 오늘날 점점 이해되고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 도입부로, 인간 발달에 대한 현대적 관점을 제시합니다. 발달을 특정 시기에 멈추는 \u003cb class=\"key\">고정된 \u003c/b>\u003cb class=\"key\">단계\u003c/b>가 아니라, 평생에 걸쳐 변화하는 \u003cb class=\"key\">유연한 \u003c/b>\u003cb class=\"key\">과정\u003c/b>으로 본다는 점이 이 글의 핵심 주제입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : is [be동사] + understood [p.p.] : \"오늘날 점점 이해되고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 병렬구조\u003c/span> : A, B, and C 병렬 : \"계속 진행 중이고, 유연하며, 그리고 서서히 발전하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">상관접속사 (대조)\u003c/span> : A rather than B : \"~라기보다는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Human development is now increasingly understood, 인간 발달은 오늘날 점점 이해되고 있다. as an ongoing, flexible, and evolving process, 계속 진행 중이고, 유연하며, 그리고 서서히 발전하는 과정으로. rather than a fixed sequence of stages, 고정된 순서의 단계들이라기보다는. 이 문장 전체를 해석하면, 인간 발달은 고정된 순서의 단계들이라기보다는 계속 진행 중이고, 유연하며, 그리고 서서히 발전하는 과정으로 오늘날 점점 이해되고 있다.","hl":"m"},{"n":13,"text":"이 문장은 인간의 발달을 바라보는 요즘의 새로운 시각을 소개하고 있어요. 옛날에는 나이에 따라 딱딱 정해진 고정된 단계가 있다고 생각했지만, 이제는 죽을 때까지 계속 변하고 서서히 발전하는 유연한 과정으로 본다는 거죠. 이 글의 가장 중요한 핵심 주제를 던져주고 있습니다.","hl":"mn"},{"n":14,"text":"어법을 살펴볼게요. 첫 번째로 is now increasingly understood 부분입니다. 주어인 인간 발달은 스스로 무언가를 이해하는 게 아니라 사람들에 의해 이해되는 대상이죠? 그래서 수동태인 비동사 플러스 피피 형태가 쓰였습니다. 두 번째로 ongoing, flexible, and evolving은 모두 뒤에 있는 명사 process를 꾸며주기 위해 분사와 형용사가 나란히 병렬 구조를 이루고 있어요. 세 번째로 rather than은 뒤에 나오는 것보다는 앞에 나오는 거다 라는 뜻을 나타내며 대조의 의미를 강조해 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 관점의 핵심에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">At \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">core \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">perspective \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가소성의 개념이 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">lies \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">concept\u003c/span> of plasticity.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 관점의 핵심에는 가소성의 개념이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급한 '유연한 과정'이라는 관점의 핵심 원리인 \u003cb class=\"key\">가소성\u003c/b>을 처음 소개하는 문장입니다. 장소를 나타내는 부사구가 문장 맨 앞으로 오면서 주어와 동사의 \u003cb class=\"key\">도치\u003c/b>가 일어난 구조적 특징이 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">장소 부사구 도치\u003c/span> : [장소 부사구] + lies [자동사] + the concept [주어] : \"이러한 관점의 핵심에는 ~ 개념이 있다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"At the core of this perspective, 이러한 관점의 핵심에는. lies the concept of plasticity, 가소성의 개념이 있다.. 이 문장 전체를 해석하면, 이러한 관점의 핵심에는 가소성의 개념이 있다.","hl":"m"},{"n":16,"text":"방금 첫 번째 문장에서 말했던 평생에 걸쳐 변화하고 발달한다는 관점, 그 중심에는 바로 가소성이라는 개념이 자리 잡고 있다는 뜻이에요. 이 가소성이라는 단어가 이 글의 진짜 주인공이니까 꼭 기억해 두세요.","hl":"mn"},{"n":17,"text":"이 문장은 서술형으로 아주 잘 나오는 문장이니 별표 쳐 두세요. 첫 번째이자 가장 중요한 포인트는 도치 구문입니다. 장소나 위치를 나타내는 부사구인 At the core of this perspective가 문장 맨 앞으로 강조되어서 튀어나왔어요. 그 결과로 주어와 동사의 위치가 도치되었죠. 그래서 동사 lies가 먼저 오고 주어인 the concept of plasticity가 뒤에 왔습니다. 주어가 단수니까 동사도 반드시 단수형으로 에스를 붙여서 lies라고 써야 한다는 점 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가소성은 인간의 능력을 지칭한다\u003c/span>\u003cspan class=\"en\">Plasticity refers to the human \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">capacity \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인지적, 정서적, 그리고 행동적 패턴들을 변화시키고, 적응시키며, 재구성하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">change, \u003c/span>\u003cspan class=\"tgt\">adapt, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">reorganize\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">cognitive, \u003c/span>\u003cspan class=\"tgt\">emotional, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">behavioural\u003c/span> patterns\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶의 경험들, 환경적 요구들, 그리고 생물학적 변화들에 반응하여.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">response \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> life experiences, environmental demands, and biological changes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가소성은 삶의 경험들, 환경적 요구들, 그리고 생물학적 변화들에 반응하여 인지적, 정서적, 그리고 행동적 패턴들을 변화시키고, 적응시키며, 재구성하는 인간의 능력을 지칭한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 제시된 핵심어인 \u003cb class=\"key\">가소성\u003c/b>의 개념을 구체적으로 정의하는 문장입니다. 인간이 다양한 외부 환경과 내부 변화에 맞추어 자신의 여러 가지 패턴들을 주도적으로 \u003cb class=\"key\">재구성\u003c/b>할 수 있는 능력이 가소성임을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법과 병렬\u003c/span> : capacity [명사] + to [to부정사구 병렬] : \"변화시키고, 적응시키며, 재구성하는 능력\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 병렬\u003c/span> : A, B, and C [형용사] + patterns [명사] : \"인지적, 정서적, 그리고 행동적 패턴들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : in response to + [명사(구)] : \"~에 반응하여\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Plasticity refers to the human capacity, 가소성은 인간의 능력을 지칭한다. to change, adapt, and reorganize cognitive, emotional, and behavioural patterns, 인지적, 정서적, 그리고 행동적 패턴들을 변화시키고, 적응시키며, 재구성하는. in response to life experiences, environmental demands, and biological changes, 삶의 경험들, 환경적 요구들, 그리고 생물학적 변화들에 반응하여.. 이 문장 전체를 해석하면, 가소성은 삶의 경험들, 환경적 요구들, 그리고 생물학적 변화들에 반응하여 인지적, 정서적, 그리고 행동적 패턴들을 변화시키고, 적응시키며, 재구성하는 인간의 능력을 지칭한다.","hl":"m"},{"n":19,"text":"가소성이란 단어가 좀 어려웠죠? 이 문장에서 친절하게 뜻을 설명해 주고 있어요. 살면서 겪는 경험이나 주변 환경의 요구, 또는 몸의 변화 같은 것에 맞춰서 우리의 생각, 감정, 행동 패턴을 유연하게 바꾸고 다시 재구성할 수 있는 능력이 바로 가소성입니다. 즉, 인간은 환경에 맞춰 언제든 변할 수 있다는 뜻이에요.","hl":"mn"},{"n":20,"text":"어법 포인트를 짚어볼게요. 첫 번째로 capacity to change, adapt, and reorganize 부분입니다. 앞의 명사 capacity를 꾸며주는 투부정사의 형용사적 용법이 쓰였어요. 이때 투 뒤에 세 개의 동사원형이 나란히 병렬 연결되어 있다는 점을 눈여겨보세요. 두 번째로 cognitive, emotional, and behavioural 역시 뒤에 있는 명사 patterns를 꾸며주기 위해 세 개의 형용사가 콤마와 접속사 앤드로 예쁘게 병렬 연결되어 있습니다. 세 번째로 in response to는 무엇무엇에 반응하여라는 뜻의 전치사구 표현입니다. 전치사니까 당연히 그 뒤에는 명사구가 와야 하고, 여기서도 세 개의 명사구가 앤드로 연결되어 길게 이어지고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 강조한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">highlights \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인들이 단순히 발달의 수동적인 수용자가 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> individuals are \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">merely \u003c/span>\u003cspan class=\"tgt\">passive \u003c/span>\u003cspan class=\"tgt\">recipients \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">development \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">능동적인 주체들이라는 점을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">active \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">agents \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">성장이 가능한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">capable \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">growth\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평생에 걸쳐\u003c/span>\u003cspan class=\"en\">throughout their lives.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 개인들이 단순히 발달의 수동적인 수용자가 아니라 평생에 걸쳐 성장이 가능한 능동적인 주체들이라는 점을 강조한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 가소성 개념의 핵심을 설명하며, 인간은 환경에 이끌려가는 \u003cb class=\"key\">수동적인 \u003c/b>\u003cb class=\"key\">존재\u003c/b>가 아니라 스스로 변화를 만들어내는 \u003cb class=\"key\">능동적인 \u003c/b>\u003cb class=\"key\">주체\u003c/b>임을 강조합니다. 즉, 성장은 특정 시기에 멈추는 것이 아니라 \u003cb class=\"key\">평생에 \u003c/b>\u003cb class=\"key\">걸쳐\u003c/b> 일어난다는 점을 부각합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : highlight [타동사] + that [명사절 접속사/목적어] : \"그것은 ~라는 점을 강조한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 (not merely A but B)\u003c/span> : not merely A [명사구] but B [명사구] : \"단순히 발달의 수동적인 수용자가 아니라 능동적인 주체들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사구의 후치 수식\u003c/span> : agents [명사] + (who are) + capable of [형용사구] : \"성장이 가능한 주체들\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It highlights, 그것은 강조한다. that individuals are not merely passive recipients of development, 개인들이 단순히 발달의 수동적인 수용자가 아니라. but active agents, 능동적인 주체들이라는 점을. capable of growth, 성장이 가능한. throughout their lives, 평생에 걸쳐. 이 문장 전체를 해석하면, 그것은 개인들이 단순히 발달의 수동적인 수용자가 아니라 평생에 걸쳐 성장이 가능한 능동적인 주체들이라는 점을 강조한다.","hl":"m"},{"n":22,"text":"이 문장은 가소성 개념의 핵심을 설명하며, 인간은 환경에 이끌려가는 수동적인 존재가 아니라 스스로 변화를 만들어내는 능동적인 주체임을 강조해요. 성장이란 특정 시기에 멈추는 것이 아니라 평생에 걸쳐 일어난다는 점을 부각하는 아주 중요한 문장이죠.","hl":"mn"},{"n":23,"text":"첫 번째로 highlight 뒤에 온 that은 목적어 역할을 하는 명사절 접속사 that이에요. 뒤에 완전한 문장이 오죠. 두 번째로 not merely A but B 구조가 쓰였어요. 명사구 두 개가 병렬 구조를 이루는 상관접속사입니다. 세 번째로 agents 뒤에 온 capable of growth는 주격 관계대명사와 be동사가 생략된 채 명사를 뒤에서 수식하는 형용사구라는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이전의 관점들에서는\u003c/span>\u003cspan class=\"en\">In earlier views,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발달이 믿어졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">development \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">believed \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주로 아동기에 일어난다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">occur\u003c/span> mainly during childhood,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">성인기는 간주된 채로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">adulthood \u003c/span>\u003cspan class=\"tgt\">seen \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안정의 시기로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">period \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">stability\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 노년기는 쇠퇴의 단계로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">old \u003c/span>\u003cspan class=\"tgt\">age \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">phase \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">decline.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이전의 관점들에서는 발달이 주로 아동기에 일어난다고 믿어졌으며, 성인기는 안정의 시기로, 그리고 노년기는 쇠퇴의 단계로 간주되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거 사람들이 인간의 발달을 어떻게 바라보았는지, 즉 \u003cb class=\"key\">전통적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>을 소개합니다. 발달은 아동기에만 일어나고 그 이후로는 \u003cb class=\"key\">정체되거나 \u003c/b>\u003cb class=\"key\">쇠퇴\u003c/b>한다고 믿었던 과거의 낡은 사고방식을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 + to부정사\u003c/span> : S [주어] + be believed [수동태] + to V [to부정사] : \"발달이 일어난다고 믿어졌다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">with 분사구문\u003c/span> : with + 명사(adulthood) + 과거분사(seen) : \"성인기는 안정의 시기로 간주되었으며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">생략 및 병렬 구조\u003c/span> : and + old age + (seen) + as a phase... : \"그리고 노년기는 쇠퇴의 단계로 (간주되었다)\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In earlier views, 이전의 관점들에서는. development was believed, 발달이 믿어졌다. to occur mainly during childhood, 주로 아동기에 일어난다고. with adulthood seen, 성인기는 간주된 채로. as a period of stability, 안정의 시기로. and old age as a phase of decline, 그리고 노년기는 쇠퇴의 단계로. 이 문장 전체를 해석하면, 이전의 관점들에서는 발달이 주로 아동기에 일어난다고 믿어졌으며, 성인기는 안정의 시기로, 그리고 노년기는 쇠퇴의 단계로 간주되었다.","hl":"m"},{"n":25,"text":"이 문장에서는 과거 사람들이 인간의 발달을 어떻게 바라보았는지 전통적 관점을 소개하고 있어요. 발달은 아동기에만 일어나고 성인기엔 정체되거나 쇠퇴한다고 믿었던 과거의 낡은 사고방식을 보여주는 부분이죠.","hl":"mn"},{"n":26,"text":"첫 번째로 was believed to occur를 볼게요. 사람들이 발달이 일어난다고 믿었다는 능동태 문장이 수동태로 바뀌면서 종속절의 동사가 to부정사로 변한 거예요. 이렇게 수동태 구문은 해석할 때 발달이 일어난다고 믿어졌다라고 해주면 됩니다. 두 번째, with adulthood seen은 동시동작이나 상태를 나타내는 with 분사구문이에요. 성인기가 간주되는 수동 관계니까 과거분사 seen을 썼죠. 세 번째로 and old age as a phase of decline 부분은 앞선 with 분사구문과 병렬로 연결되면서 중복되는 seen이 생략된 형태라는 것도 알아두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가소성의 개념은 이의를 제기한다\u003c/span>\u003cspan class=\"en\">The concept of plasticity challenges\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 경직된 사고방식에\u003c/span>\u003cspan class=\"en\">this rigid outlook\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강조함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">emphasizing \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발달이 계속된다는 점을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> development continues\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 생애에 걸쳐\u003c/span>\u003cspan class=\"en\">across the entire lifespan.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가소성의 개념은 발달이 전 생애에 걸쳐 계속된다는 점을 강조함으로써 이러한 경직된 사고방식에 이의를 제기한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거의 낡은 생각, 즉 경직된 사고방식을 \u003cb class=\"key\">가소성\u003c/b>이라는 새로운 개념이 어떻게 반박하는지 서술합니다. 발달은 특정 시기에 끝나는 것이 아니라 \u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">생애에 \u003c/b>\u003cb class=\"key\">걸쳐\u003c/b> 일어난다는 것이 이 글의 핵심 \u003cb class=\"key\">주제\u003c/b>임을 다시 한번 명확히 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사 / 명사절 접속사 that\u003c/span> : by + 동명사(-ing) + that [명사절 접속사] : \"강조함으로써 ~라는 점을\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The concept of plasticity challenges, 가소성의 개념은 이의를 제기한다. this rigid outlook, 이러한 경직된 사고방식에. by emphasizing, 강조함으로써. that development continues, 발달이 계속된다는 점을. across the entire lifespan, 전 생애에 걸쳐. 이 문장 전체를 해석하면, 가소성의 개념은 발달이 전 생애에 걸쳐 계속된다는 점을 강조함으로써 이러한 경직된 사고방식에 이의를 제기한다.","hl":"m"},{"n":28,"text":"앞서 말한 과거의 낡은 생각을 가소성이라는 새로운 개념이 어떻게 반박하는지 서술하고 있어요. 발달은 특정 시기에 끝나는 것이 아니라 전 생애에 걸쳐 일어난다는 것이 이 글의 핵심 주제임을 다시 한번 명확히 정리해 줍니다.","hl":"mn"},{"n":29,"text":"여기서 by emphasizing that 구조를 살펴볼까요. by ing는 무언가를 함으로써라는 수단을 나타내요. 그리고 동명사 emphasizing의 목적어 역할을 하기 위해 명사절 접속사 that이 완전한 문장을 이끌고 왔습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 변화의 정도가 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Although\u003c/span> the extent of change\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로 다른 단계들에서 다를지라도, \u003c/span>\u003cspan class=\"en\">may \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">vary\u003c/span> at different stages,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶의 각각의 단계는 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">phase\u003c/span> of life\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적응과 변화를 위한 여지를 허용한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">allows\u003c/span> room for adaptation and transformation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비록 변화의 정도가 서로 다른 단계들에서 다를지라도, 삶의 각각의 단계는 적응과 변화를 위한 여지를 허용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글을 마무리하는 결론부로, 나이에 따라 변화의 크기는 다를 수 있지만 평생에 걸쳐 \u003cb class=\"key\">가소성\u003c/b>이 존재함을 강조합니다. 인간의 발달은 평생 이어지는 과정이라는 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>를 다시 한번 확인해 주는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사\u003c/span> : Although + [주어] + [동사] : \"비록 ~일지라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">완전 자동사\u003c/span> : 주어 + vary (자동사) : \"다르다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">every + 단수명사\u003c/span> : every + [단수명사] : \"각각의 단계\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : 단수 주어(every phase) + 단수 동사(allows) : \"허용한다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Although the extent of change, 비록 변화의 정도가. may vary at different stages, 서로 다른 단계들에서 다를지라도. every phase of life, 삶의 각각의 단계는. allows room for adaptation and transformation, 적응과 변화를 위한 여지를 허용한다.. 이 문장 전체를 해석하면, 비록 변화의 정도가 서로 다른 단계들에서 다를지라도, 삶의 각각의 단계는 적응과 변화를 위한 여지를 허용한다.","hl":"m"},{"n":31,"text":"이 문장은 글을 마무리하는 결론부예요. 나이에 따라 변화의 크기는 다를 수 있지만, 평생에 걸쳐 가소성이 존재한다는 사실을 강조하고 있죠. 결국 인간의 발달은 특정 시기에 끝나는 것이 아니라 평생 이어지는 과정이라는 이 글의 핵심 주제를 다시 한번 확실하게 못 박아 주는 역할을 합니다.","hl":"mn"},{"n":32,"text":"문법 포인트 네 가지 짚어볼게요. 첫 번째로 양보의 접속사 Although를 보세요. 뒤에 주어와 동사가 있는 완벽한 절이 오기 때문에 전치사인 despite가 아니라 접속사 Although를 써야 합니다. 두 번째로 조동사 may 뒤에 쓰인 vary는 목적어가 필요 없는 자동사로 쓰여서 다르다라는 의미를 나타내고 있어요. 세 번째로 every 뒤에 오는 명사를 주의해야 하는데요. every 뒤에는 반드시 단수명사가 와야 하니까 복수형인 phases가 아니라 phase 형태가 쓰인 것을 꼭 확인하세요. 마지막 네 번째는 수 일치입니다. 주어인 every phase of life가 단수 취급되기 때문에 동사 역시 단수형인 allows가 쓰였습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>현대에는 인간 발달을 고정된 단계가 아닌 유연하고 계속되는 과정으로 보며, 그 중심에 \u003cb class=\"key\">가소성\u003c/b>이 있다.\u003c/li>\u003cli>가소성은 경험과 환경에 맞춰 패턴을 재구성하는 능력으로, 인간을 발달의 \u003cb class=\"key\">능동적인\u003c/b> 주체로 만든다.\u003c/li>\u003cli>과거에는 발달이 주로 \u003cb class=\"key\">아동기\u003c/b>에 끝나며, 이후에는 안정되거나 쇠퇴한다고 믿었다.\u003c/li>\u003cli>하지만 가소성은 이러한 경직된 시각에 반대하며, 변화의 폭은 달라도 \u003cb class=\"key\">전 \u003c/b>\u003cb class=\"key\">생애\u003c/b>에 걸쳐 적응과 성장이 가능함을 시사한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Human development is an ongoing, lifelong process driven by plasticity, enabling continuous adaptation and growth.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">인간 발달은 고정된 단계가 아니라 평생에 걸친 \u003cb class=\"key\">가소성\u003c/b>을 바탕으로 변화하고 적응하는 \u003cb class=\"key\">능동적\u003c/b> 과정이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"자, 이렇게 해서 인간 발달의 가소성을 다룬 지문을 모두 분석해 보았습니다. 우리는 굳어있는 존재가 아니라 평생 변화하고 성장할 수 있는 존재라는 사실, 참 멋지지 않나요? 복습 철저히 하시고, 다음 시간에
