</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 23번","audioDir":"23_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">23번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>The Decentralized Nervous System of the Octopus\u003c/h1>\u003ch2>문어의 분산된 신경계\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>문어는 신경 세포의 절반 이상이 중앙의 뇌가 아닌 다리들에 \u003cb class=\"key\">분산\u003c/b>되어 있어, 뇌의 지시 없이도 다리가 독자적으로 움직이고 \u003cb class=\"key\">빨판\u003c/b>을 통해 접촉으로 화학적 신호를 감지하여 사실상 \u003cb class=\"key\">맛\u003c/b>을 볼 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>An octopus has a decentralized nervous system with neurons distributed throughout its arms, allowing them to independently control movements and taste what they touch.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리가 함께 살펴볼 지문은 문어의 놀랍고도 신비한 신경 구조에 관한 이야기입니다. 이 글은 문어의 신경 세포 절반 이상이 중앙의 뇌가 아니라 다리에 분포되어 있다는 아주 흥미로운 사실을 요약하고 있어요. 이를 통해 뇌의 직접적인 지시 없이도 다리들이 독자적으로 통제력을 갖고 맛까지 느낄 수 있다는 것이 오늘 글의 요지입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">일반적으로 인간을 포함한 포유류는 뇌와 척수로 이루어진 중추 신경계(Central Nervous System)가 모든 행동을 중앙에서 통제합니다. 하지만 문어와 같은 두족류(cephalopod)는 중앙의 뇌에만 의존하지 않는 \u003cb class=\"key\">분산된 \u003c/b>\u003cb class=\"key\">신경계\u003c/b>(Decentralized Nervous System)를 가지고 있습니다. 쉽게 비유하자면, 본사 CEO 혼자서 모든 것을 지시하는 회사가 아니라, 각 지역에 대단히 유능한 \u003cb class=\"key\">본부장들\u003c/b>을 두어 현장에서 바로바로 의사결정을 내리게 하는 시스템과 같습니다. 덕분에 문어의 다리들은 뇌의 상세한 지시 없이도 \u003cb class=\"key\">국소적 \u003c/b>\u003cb class=\"key\">통제력\u003c/b>(local control)을 발휘하여 스스로 움직이고, 접촉을 통해 화학 물질을 감지하는 놀라운 능력을 보여줍니다.\u003c/div>","segs":[{"n":2,"text":"지문을 읽기 전에 중추 신경계와 대비되는 분산된 신경계라는 개념을 아시면 좋습니다. 우리 인간처럼 뇌가 중심이 되어 몸 전체를 통제하는 방식을 중앙 집중형 통제라고 한다면요, 문어는 전혀 다릅니다. 문어는 분산된 신경계라는 시스템을 가져서 본사 CEO 혼자 지시하는 게 아니라 각 지역 본부장들이 현장 상황에 맞춰 스스로 결정을 내리는 회사 구조와 같아요. 덕분에 다리에 뉴런이 몰려 있어서, 각 다리가 국소적 통제력을 갖게 되는 것이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>특이점 도입\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>문어의 뉴런은 대략 5억 개이며, 가장 특이한 점은 그 절반 이상이 중앙 뇌가 아닌 \u003cb class=\"key\">다리\u003c/b> 전체에 분포한다는 사실을 소개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>다리의 독자성\u003csmall>설명 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>각 다리에는 신경 세포 네트워크가 있어 뇌의 상세한 지시 없이도 \u003cb class=\"key\">국소적\u003c/b>으로 움직임을 통제하고 환경과 직접 상호작용합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>빨판의 기능\u003csmall>세부 특징 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>다리를 따라 늘어선 \u003cb class=\"key\">빨판\u003c/b>은 강한 접착력을 제공할 뿐만 아니라, 접촉하는 표면의 \u003cb class=\"key\">화학적 \u003c/b>\u003cb class=\"key\">신호\u003c/b>를 탐지하는 중요한 역할을 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>접촉과 미각\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>이러한 원리 덕분에 문어는 다리로 접촉함으로써 화학적 정보를 수집하여 사실상 촉각으로 \u003cb class=\"key\">맛\u003c/b>을 볼 수 있다는 결론을 내립니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제부터 이 글의 전체적인 흐름을 단계별로 하나씩 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째 문장부터 세 번째 문장까지는 도입부입니다. 문어의 뉴런은 대략 5억 개 정도인데 이 중에서 절반이 넘는 신경 세포들이 중앙의 뇌가 아닌 다리에 분포한다는 아주 특이한 점을 소개하며 호기심을 유발하고 있습니다.","hl":"f0"},{"n":5,"text":"네 번째부터 여섯 번째 문장에서는 다리의 독자성이 어떻게 가능한지 그 원리를 설명합니다. 각 다리에는 자체 신경망이 있어서 뇌의 디테일한 지시 없이도 환경과 직접 상호작용하며 국소적으로 움직임을 만들어 낸다고 이야기하죠.","hl":"f1"},{"n":6,"text":"일곱 번째 문장과 여덟 번째 문장은 조금 더 세부적인 특징을 다룹니다. 문어 다리에 붙어 있는 수많은 빨판이 중요한 역할을 하는데요, 표면을 강하게 붙잡는 것뿐만 아니라 화학적 신호를 탐지하는 놀라운 센서 역할까지 한다는 것을 강조합니다.","hl":"f2"},{"n":7,"text":"마지막 아홉 번째와 열 번째 문장은 결론입니다. 해양 생물학자들의 연구를 바탕으로 다리의 이러한 신경계 구조와 빨판 덕분에 문어는 단지 만지는 것만으로도 정보를 모아, 사실상 접촉으로 맛을 볼 수 있다는 아주 재미있는 결과를 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 문어 신경계의 가장 큰 특징인 \u003cb class=\"key\">분산형 \u003c/b>\u003cb class=\"key\">구조\u003c/b>를 초반에 제시하는 전형적인 두괄식 구조입니다. 중앙의 뇌에 전적으로 집중된 형태와 다리에 넓게 분포된 문어의 신경계를 \u003cb class=\"key\">대조\u003c/b>하며 작동 원리를 설명합니다. 후반부에서는 빨판의 화학적 감지 능력을 구체적 근거로 들어, 다리가 곧 \u003cb class=\"key\">미각\u003c/b> 기관이라는 흥미로운 결론을 이끌어냅니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>rather than (3)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>This means that (5)\u003c/b>\u003cspan>결과/부연\u003c/span>\u003cb>Instead (6)\u003c/b>\u003cspan>대조/전환\u003c/span>\u003cb>but also (8)\u003c/b>\u003cspan>추가 정보\u003c/span>\u003cb>In practical terms (10)\u003c/b>\u003cspan>결론/요약\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">roughly five hundred million neurons\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this system\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">those neurons\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">networks of nerve cells\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">highly capable extensions of the nervous system\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>중앙의 뇌 (central brain)\u003c/th>\u003cth>다리 (arms)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>뉴런이 전적으로 집중되지 않음\u003c/td>\u003ctd>뉴런의 절반 이상이 분포함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상세한 지시를 내리지 않음\u003c/td>\u003ctd>국소적으로 움직임을 통제하고 반응함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"글의 전개 구조를 보면, 문어의 분산형 구조를 초반에 바로 제시해주는 아주 깔끔한 두괄식 구성을 띠고 있습니다. 중앙의 뇌에 몽땅 모여 있는 방식과 문어 다리 전체에 넓게 퍼져 있는 방식을 대조하며 설명합니다. 결국 마지막에는 이런 구조 덕분에 손으로 만지는 행위가 미각이라는 결론을 향해 자연스럽게 이어지고 있죠.","hl":"ty"},{"n":9,"text":"문장 속 중요한 신호어들도 꼭 짚고 넘어가야 하는데요. 세 번째 문장에 나오는 rather than은 뇌와 다리의 대비를 명확하게 보여주는 대조의 신호어입니다. 그리고 여섯 번째 문장의 Instead 역시 뇌가 통제하는 대신 다리가 독자적으로 기능한다는 흐름의 전환을 만들어 줍니다. 마지막 문장의 In practical terms는 앞의 모든 내용을 요약하며 결론을 짓는 훌륭한 마무리 역할을 하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>cephalopod\u003c/b>\u003cem>명사\u003c/em>\u003cspan>두족류 동물\u003c/span>\u003c/div>\u003cdiv>\u003cb>neurobiology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신경 생물학\u003c/span>\u003c/div>\u003cdiv>\u003cb>possess\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가지다, 소유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>roughly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대략\u003c/span>\u003c/div>\u003cdiv>\u003cb>neuron\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뉴런, 신경 세포\u003c/span>\u003c/div>\u003cdiv>\u003cb>unusual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특이한, 드문\u003c/span>\u003c/div>\u003cdiv>\u003cb>locate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>위치시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>distribute\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분포시키다, 분배하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>concentrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>집중시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>entirely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>전적으로, 완전히\u003c/span>\u003c/div>\u003cdiv>\u003cb>central\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중앙의\u003c/span>\u003c/div>\u003cdiv>\u003cb>capable of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 수 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>sensory\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>감각의\u003c/span>\u003c/div>\u003cdiv>\u003cb>locally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>국소적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>instruction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지시, 설명\u003c/span>\u003c/div>\u003cdiv>\u003cb>extension\u003c/b>\u003cem>명사\u003c/em>\u lass=\"lp-chunk\">\u003cspan class=\"ko\">두족류 동물 신경 생물학에 관한 연구는\u003c/span>\u003cspan class=\"en\">Research on cephalopod neurobiology\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시사한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">suggests \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문어가 가지고 있다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> an octopus possesses\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대략 5억 개의 뉴런을.\u003c/span>\u003cspan class=\"en\">roughly five hundred million neurons.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">두족류 동물 신경 생물학에 관한 연구는 문어가 대략 5억 개의 뉴런을 가지고 있다는 것을 시사한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 문어의 신경계에 대한 흥미로운 사실을 도입하는 역할을 합니다. 문어가 인간이 생각하는 것보다 훨씬 많은 약 \u003cb class=\"key\">5억 \u003c/b>\u003cb class=\"key\">개의 \u003c/b>\u003cb class=\"key\">뉴런\u003c/b>을 가졌음을 밝히며, 앞으로 이어질 \u003cb class=\"key\">신경망의 \u003c/b>\u003cb class=\"key\">특징\u003c/b>에 대한 호기심을 유발합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : suggests [타동사] + [that (명사절 접속사) + S + V] : \"~라는 것을 시사하다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Research on cephalopod neurobiology, 두족류 동물 신경 생물학에 관한 연구는. suggests, 시사한다. that an octopus possesses, 문어가 가지고 있다는 것을. roughly five hundred million neurons, 대략 5억 개의 뉴런을.. 이 문장 전체를 해석하면, 두족류 동물 신경 생물학에 관한 연구는 문어가 대략 5억 개의 뉴런을 가지고 있다는 것을 시사한다.","hl":"m"},{"n":13,"text":"이 문장은 글의 도입부로, 문어가 무려 5억 개라는 엄청난 수의 뉴런을 가지고 있다는 사실을 알려주죠. 이 놀라운 숫자를 통해 앞으로 문어의 신경망이 어떤 특별한 구조를 띠고 있는지 호기심을 확 끌어올리는 역할을 합니다.","hl":"mn"},{"n":14,"text":"여기서 어법 포인트 하나 보고 갈게요. suggests 바로 뒤에 나오는 that에 주목해 보세요. 이 that은 타동사 suggests의 목적어 역할을 하는 명사절을 이끌고 있어요. 뒤에는 an octopus가 주어, possesses가 동사인 완전한 문장이 잘 따라오고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 체계를 특이하게 만드는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">system \u003c/span>\u003cspan class=\"tgt\">unusual\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 뉴런들 중 다수가 어디에 위치해 있는가이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">neurons \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">located\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 체계를 특이하게 만드는 것은 그 뉴런들 중 다수가 어디에 위치해 있는가이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 5억 개의 뉴런이 일반적인 동물들과 달리 아주 독특한 곳에 위치하고 있음을 밝히는 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">문장\u003c/b>입니다. 뉴런의 단순한 개수보다 \u003cb class=\"key\">위치의 \u003c/b>\u003cb class=\"key\">특수성\u003c/b>이 이 글의 진짜 주제임을 강조하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 What 명사절 (주어)\u003c/span> : What (주격 관계대명사) + V + O + O.C : \"이 체계를 특이하게 만드는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (보어)\u003c/span> : where (의문사) + S + V : \"그 뉴런들 중 다수가 어디에 위치해 있는가\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"What makes this system unusual, 이 체계를 특이하게 만드는 것은. is, ~이다. where many of those neurons are located, 그 뉴런들 중 다수가 어디에 위치해 있는가이다.. 이 문장 전체를 해석하면, 이 체계를 특이하게 만드는 것은 그 뉴런들 중 다수가 어디에 위치해 있는가이다.","hl":"m"},{"n":16,"text":"문어의 신경계가 진짜 특이한 이유는 뉴런의 개수가 아니라 바로 그 뉴런들이 자리 잡은 위치 때문이라는 점을 강조하는 핵심 문장이에요. 이제부터 뉴런의 위치의 특수성에 대한 진짜 이야기가 시작되겠죠.","hl":"mn"},{"n":17,"text":"이 문장은 서술형으로도 나오기 좋은 중요한 문법이 두 개나 있어요. 첫 번째, 주어 자리를 보면 선행사를 포함하는 관계대명사 What이 이끄는 명사절이 왔어요. What 안에는 동사 makes, 목적어 this system, 그리고 형용사 목적격 보어 unusual이 들어있는 오형식 구조죠. 그리고 두 번째, 동사 is 뒤에는 의문사 where 더하기 주어 동사 어순의 간접의문문이 주격 보어 역할을 하고 있답니다. 어순에 꼭 주의해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절반 이상은\u003c/span>\u003cspan class=\"en\">More than half\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다리들 전체에 걸쳐 분포되어 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">distributed\u003c/span> throughout the arms\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전적으로 집중되어 있기보다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">concentrated\u003c/span> entirely\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중앙의 뇌에.\u003c/span>\u003cspan class=\"en\">in the central brain.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">절반 이상은 중앙의 뇌에 전적으로 집중되어 있기보다는 다리들 전체에 걸쳐 분포되어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 문장에서 제기한 뉴런의 위치에 대한 직접적인 답변입니다. 보통 동물이 뇌에 뉴런을 집중시키는 것과 달리, 문어는 뉴런의 \u003cb class=\"key\">절반 \u003c/b>\u003cb class=\"key\">이상\u003c/b>을 다리에 분포시켜 \u003cb class=\"key\">분산된 \u003c/b>\u003cb class=\"key\">신경망\u003c/b>을 형성하고 있음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be + p.p. (과거분사) : \"분포되어 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : A rather than B : \"집중되어 있기보다는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"More than half, 절반 이상은. are distributed throughout the arms, 다리들 전체에 걸쳐 분포되어 있다. rather than concentrated entirely, 전적으로 집중되어 있기보다는. in the central brain, 중앙의 뇌에.. 이 문장 전체를 해석하면, 절반 이상은 중앙의 뇌에 전적으로 집중되어 있기보다는 다리들 전체에 걸쳐 분포되어 있다.","hl":"m"},{"n":19,"text":"앞서 말한 특이한 위치가 도대체 어디인지 구체적으로 알려주는 문장이에요. 인간이나 일반 동물들은 뇌에 뉴런이 몰려 있는데, 문어는 무려 절반 이상의 뉴런이 다리 전체에 퍼져 있다는 놀라운 사실을 말해주고 있죠. 이게 바로 문어만의 분산된 신경망 체계랍니다.","hl":"mn"},{"n":20,"text":"여기서 중요한 문법 두 가지 짚어볼게요. 첫 번째, 동사가 are distributed로 수동태가 쓰였죠. 주어인 뉴런의 절반 이상이 스스로 분포시키는 게 아니라 분포되는 수동의 의미라서 그래요. 두 번째로, rather than 뒤에 concentrated 역시 과거분사입니다. 앞의 distributed와 함께 수동의 의미로 과거분사 형태가 병렬 구조로 짝꿍을 맞추고 있는 거랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각각의 다리는 ~을 포함한다 (갖고 있다)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Each \u003c/span>\u003cspan class=\"tgt\">arm \u003c/span>\u003cspan class=\"tgt\">contains\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신경 세포들의 네트워크를\u003c/span>\u003cspan class=\"en\">networks of nerve cells\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">복잡한 움직임들을 통제할 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">capable \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">controlling \u003c/span>\u003cspan class=\"tgt\">complex \u003c/span>\u003cspan class=\"tgt\">movements \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 감각적 입력에 국소적으로 반응할 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">responding\u003c/span> to sensory input locally.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">각각의 다리는 복잡한 움직임들을 통제하고 감각적 입력에 국소적으로 반응할 수 있는 신경 세포들의 네트워크를 갖고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문어의 다리 안에 복잡한 통제와 반응을 처리할 수 있는 신경망이 있다는 구체적 사실을 설명합니다. 즉, 중앙의 뇌를 거치지 않고 다리 스스로 \u003cb class=\"key\">독립적인 \u003c/b>\u003cb class=\"key\">처리\u003c/b>를 할 수 있다는 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">원리\u003c/b>를 보여주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">단수 취급 (Each)\u003c/span> : Each + [단수명사] + [단수동사] : \"각각의 다리는 포함한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사구 후치수식 및 병렬 구조\u003c/span> : [명사] + capable of + [동명사 1] + and + [동명사 2] : \"복잡한 움직임들을 통제하고 반응할 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Each arm contains, 각각의 다리는 ~을 포함한다 (갖고 있다). networks of nerve cells, 신경 세포들의 네트워크를. capable of controlling complex movements, 복잡한 움직임들을 통제할 수 있는. and responding to sensory input locally, 그리고 감각적 입력에 국소적으로 반응할 수 있는. 이 문장 전체를 해석하면, 각각의 다리는 복잡한 움직임들을 통제하고 감각적 입력에 국소적으로 반응할 수 있는 신경 세포들의 네트워크를 갖고 있다.","hl":"m"},{"n":22,"text":"문어의 다리 안에 단순한 근육이 아니라 복잡한 통제와 감각 반응을 처리할 수 있는 신경망이 있다는 사실을 설명하고 있어요. 중앙에 있는 뇌를 굳이 거치지 않아도 다리 스스로 독립적인 처리를 할 수 있다는 이 글의 핵심 원리를 잘 보여주는 문장입니다.","hl":"mn"},{"n":23,"text":"어법 포인트를 짚어볼까요? 첫 번째로 Each arm contains를 보세요. Each 뒤에는 항상 단수 명사인 arm이 오고, 동사도 단수 동사인 contains가 와야 한다는 수일치 규칙을 꼭 기억하세요. 두 번째로 capable of controlling complex movements and responding 부분을 볼까요? 명사인 nerve cells를 뒤에서 꾸며주는 형용사구인데요. 전치사 of 뒤에 동명사 controlling과 responding이 등위접속사 and로 xt":"이 문장에서는 빨판의 물리적 기능과 감각적 기능을 동시에 설명하고 있어요. 단순히 물체를 잡는 것을 넘어서 화학적 신호까지 감지하는 놀라운 능력을 보여주죠.","hl":"mn"},{"n":35,"text":"어법을 살펴볼까요. 첫 번째로 provide와 detect가 주어 These structures에 연결된 병렬 구조예요. 의미상으로도 제공할 뿐만 아니라 탐지하기도 한다는 점을 잘 보여주죠. 두 번째로 surfaces they contact 부분을 보면요. 명사인 surfaces 뒤에 주어 they와 타동사 contact가 바로 이어지고 있어요. 이 사이에는 목적격 관계대명사가 생략되어 있어서, 뒤의 절이 앞의 명사를 꾸며주게 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문어의 행동을 연구하는 해양 생물학자들은\u003c/span>\u003cspan class=\"en\">Marine biologists \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">studying \u003c/span>\u003cspan class=\"tgt\">octopus \u003c/span>\u003cspan class=\"tgt\">behavior\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라는 것을 보여 주었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">shown \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이 그 동물이 화학적 정보를 수집할 수 있게 한다는 것을\u003c/span>\u003cspan class=\"en\">this \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">allows \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">animal \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">gather\u003c/span> chemical information\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">접촉을 통해.\u003c/span>\u003cspan class=\"en\">through touch.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">문어의 행동을 연구하는 해양 생물학자들은 이것이 그 동물이 접촉을 통해 화학적 정보를 수집할 수 있게 한다는 것을 보여 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장의 사실을 전문가의 연구 결과를 통해 뒷받침합니다. 결국 문어는 다리의 피부 접촉을 통해 \u003cb class=\"key\">미각\u003c/b>을 느낀다는 핵심 결론으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사구 (명사 수식)\u003c/span> : Marine biologists [명사] + studying [현재분사] : \"문어의 행동을 연구하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : have shown [타동사] + that [접속사] : \"~라는 것을 보여 주었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 동사 allow\u003c/span> : allow [5형식 동사] + the animal [목적어] + to gather [목적격 보어] : \"동물이 수집할 수 있게 하다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Marine biologists studying octopus behavior, 문어의 행동을 연구하는 해양 생물학자들은. have shown that, ~라는 것을 보여 주었다. this allows the animal to gather chemical information, 이것이 그 동물이 화학적 정보를 수집할 수 있게 한다는 것을. through touch, 접촉을 통해.. 이 문장 전체를 해석하면, 문어의 행동을 연구하는 해양 생물학자들은 이것이 그 동물이 접촉을 통해 화학적 정보를 수집할 수 있게 한다는 것을 보여 주었다.","hl":"m"},{"n":37,"text":"이 문장은 전문가의 연구 결과를 통해 앞선 내용을 뒷받침하고 있어요. 결국 문어는 다리의 피부 접촉을 통해 미각을 느낀다는 핵심 결론으로 자연스럽게 이어지죠. 서술형으로도 출제되기 좋은 문장입니다.","hl":"mn"},{"n":38,"text":"첫 번째로 studying을 볼게요. 학자들이 직접 연구를 수행하는 능동적 주체이기 때문에 현재분사 studying이 앞의 명사를 꾸며주고 있어요. 두 번째, have shown that에서 that은 동사의 목적어 역할을 하는 명사절을 이끄는 접속사 that이랍니다. 세 번째, allows the animal to gather를 보면, 오형식 동사 allow가 쓰여서 목적격 보어로 to부정사가 왔어요. 목적어가 무엇무엇 하도록 허락하다라는 의미를 만들어주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실질적으로 말해서,\u003c/span>\u003cspan class=\"en\">In practical terms,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문어는 사실상 맛볼 수 있다\u003c/span>\u003cspan class=\"en\">an octopus can effectively taste\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 접촉하는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">touches\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실질적으로 말해서, 문어는 사실상 그것이 접촉하는 것을 맛볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 설명한 문어 다리의 화학적 신호 감지 능력을 우리의 일상적인 감각에 비유하여 쉽게 요약하는 \u003cb class=\"key\">결론\u003c/b>입니다. 다리가 표면과 접촉하며 화학 정보를 얻는다는 것은 결국 우리가 입으로 \u003cb class=\"key\">맛을 \u003c/b>\u003cb class=\"key\">보는 \u003c/b>\u003cb class=\"key\">것\u003c/b>과 같다는 의미를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what (명사절)\u003c/span> : taste [타동사] + [what (관계대명사) + S + V] : \"그것이 접촉하는 것을\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"In practical terms, 실질적으로 말해서. an octopus can effectively taste, 문어는 사실상 맛볼 수 있다. what it touches, 그것이 접촉하는 것을.. 이 문장 전체를 해석하면, 실질적으로 말해서, 문어는 사실상 그것이 접촉하는 것을 맛볼 수 있다.","hl":"m"},{"n":40,"text":"이 문장은 지문 전체의 결론 역할을 합니다. 바로 앞 문장들에서 문어의 다리에 있는 빨판이 접촉을 통해 화학적 신호를 감지한다고 설명했잖아요? 그걸 우리가 단번에 이해하기 쉽게 비유해 주는 거예요. 결국 다리가 어떤 표면에 닿는 순간, 문어는 입이 아니라 다리로 맛을 보는 것과 같다는 흥미로운 결론을 내리고 있습니다.","hl":"mn"},{"n":41,"text":"여기서 챙겨갈 어법 포인트는 딱 하나, 문장 끝부분에 있는 what it touches입니다. 여기서 what은 선행사를 자체적으로 포함하고 있는 관계대명사예요. 앞의 타동사 taste의 목적어 역할을 하는 커다란 명사절을 이끌고 있죠. what 뒤를 잘 살펴보면 touches 뒤에 무엇을 만지는지 목적어가 없는 불완전한 문장이 왔습니다. 해석은 그것이 접촉하는 것 이라고 해주면 아주 깔끔하게 떨어집니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>문어는 약 5억 개의 뉴런을 가지며, 그중 절반 이상이 중앙의 뇌가 아닌 다리들에 \u003cb class=\"key\">분산\u003c/b>되어 있습니다.\u003c/li>\u003cli>각 다리는 뇌의 지시 없이도 복잡한 움직임을 통제하고 감각에 \u003cb class=\"key\">국소적\u003c/b>으로 반응할 수 있습니다.\u003c/li>\u003cli>다리에 있는 \u003cb class=\"key\">빨판\u003c/b>들은 접촉하는 표면의 화학적 신호를 탐지하는 역할을 합니다.\u003c/li>\u003cli>결과적으로 문어는 다리로 접촉함으로써 화학적 정보를 수집하여 사실상 \u003cb class=\"key\">맛\u003c/b>을 볼 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>An octopus has a decentralized nervous system with neurons distributed throughout its arms, allowing them to independently control movements and taste what they touch.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">문어는 신경 세포의 절반 이상이 중앙의 뇌가 아닌 다리들에 \u003cb class=\"key\">분산\u003c/b>되어 있어, 뇌의 지시 없이도 다리가 독자적으로 움직이고 \u003cb class=\"key\">빨판\u003c/b>을 통해 접촉으로 화학적 신호를 감지하여 사실상 \u003cb class=\"key\">맛\u003c/b>을 볼 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"자, 오늘 이렇게 문어의 독특한 분산 신경계에 관한 영어 독해 지문을 함께 살펴봤습니다. 문어는 뇌가 아니라 다리가 독자적으로 생각하고 심지어 촉각으로 맛까지 본다는 사실이 정말 놀랍지 않나요? 글의 구조와 핵심 어휘들 꼼꼼히 복습해 주시고, 다음 시간에 또 새롭고 유익한 지문으로 만나겠습니다. 수고하셨습니다.","hl":null}]}]});</script></body></html>
