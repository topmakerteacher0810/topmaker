<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 31번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 31번","audioDir":"2026-10-g2-31_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">31번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>The Power of Automation in Human Behavior\u003c/h1>\u003ch2>인간 행동에서 자동화의 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인간 행동의 압도적 다수를 차지하는 \u003cb class=\"key\">자동화\u003c/b>된 기본 설정은 삶의 결함이 아니라, 신중한 사고가 필요한 중요한 문제에 집중할 수 있게 하여 복잡한 삶을 감당하게 해주는 인간 설계의 \u003cb class=\"key\">핵심적 \u003c/b>\u003cb class=\"key\">특징\u003c/b>이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The automated default settings of human behavior are essential features that make managing a complex life possible by freeing the conscious mind.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요! 오늘 함께 분석할 지문은 인간의 무의식과 습관에 관한 아주 흥미로운 글입니다. 우리가 매일 숨 쉬고 걷는 것처럼 무의식적으로 하는 행동들이 사실은 우리의 삶을 지탱해 주는 엄청난 능력이라는 사실, 알고 계셨나요? 이 글은 바로 그 인간 행동의 자동화된 기본 설정이 결코 삶의 결함이 아니라고 말합니다. 오히려 우리가 복잡한 삶을 감당할 수 있게 해주는 핵심적 특징이라는 점이 이 글의 요지랍니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간의 뇌는 에너지를 매우 많이 소모하는 기관입니다. 따라서 진화 과정에서 인간은 에너지를 아끼기 위해 일상적이고 반복적인 행동을 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">구두쇠\u003c/b>(Cognitive Miser)처럼 처리하도록 진화했습니다. 즉, 매번 뇌를 풀가동하는 대신 \u003cb class=\"key\">자동화\u003c/b>(Automation)된 습관이나 기본 설정(Default)에 맡기는 것이죠. 비유하자면, 스마트폰의 \u003cb class=\"key\">백그라운드 \u003c/b>\u003cb class=\"key\">앱\u003c/b>이 알아서 돌아가야 우리가 진짜 필요한 작업을 할 때 배터리와 램(RAM)을 효율적으로 쓸 수 있는 것과 같습니다. 이러한 무의식적이고 자동화된 행동 덕분에 우리는 한정된 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">자원\u003c/b>을 정말 중요하고 복잡한 문제에 온전히 쏟을 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"이해를 돕기 위해 잠깐 배경지식을 짚고 넘어갈게요. 인간의 뇌는 에너지를 매우 많이 소모하는 기관이에요. 그래서 진화 과정에서 인간은 에너지를 아끼기 위해 일상적인 행동은 인지적 구두쇠, 즉 Cognitive Miser처럼 처리하도록 진화했죠. 다시 말해, 매번 뇌를 풀가동하는 대신 Automation, 즉 자동화된 습관이나 Default 기본 설정에 맡기는 겁니다. 스마트폰의 백그라운드 앱이 알아서 돌아가야 우리가 무거운 게임이나 앱을 실행할 때 시스템 자원을 효율적으로 쓸 수 있는 것과 같아요. 이러한 작동 방식 덕분에 우리는 한정된 정신적 자원을 정말 중요하고 복잡한 문제에 집중할 수 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 통념 반박\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>인간의 행동 대부분은 오래전 정해진 \u003cb class=\"key\">설정\u003c/b>에 따라 무의식적으로 작동합니다. 하지만 글쓴이는 이것이 결코 \u003cb class=\"key\">절망적인\u003c/b> 생각이 아니라고 말하며 통념을 뒤집습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>주장 및 근거\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>이러한 작동 방식은 사실 인간 설계의 \u003cb class=\"key\">승리\u003c/b>입니다. 왜냐하면 모든 것을 \u003cb class=\"key\">의식적으로\u003c/b> 결정하려면 뇌의 처리 속도가 너무 느리고 대가가 커서 생존 경쟁에서 도태될 것이기 때문입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>비유를 통한 설명\u003csmall>비유 · 문장 5\u003c/small>\u003c/h4>\u003cp>이러한 \u003cb class=\"key\">자동화\u003c/b> 시스템은 마치 배의 선장이 자잘한 일에서 벗어나 정말 중요한 문제에만 집중할 수 있도록 갑판 위로 올라오게 \u003cb class=\"key\">해방\u003c/b>해 주는 것과 같습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>따라서 무의식적인 기본 설정은 인간 설계의 \u003cb class=\"key\">결함\u003c/b>이 아닙니다. 오히려 우리가 복잡한 삶을 조금이라도 감당할 수 있게 만들어 주는 가장 \u003cb class=\"key\">핵심적인 \u003c/b>\u003cb class=\"key\">특징\u003c/b>입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이 지문이 어떻게 논리를 전개하고 있는지 단계별로 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 먼저 도입부와 통념에 대한 반박이 등장합니다. 사람의 행동 대부분은 수십 년 전 만들어진 설정에 따라 무의식적으로 작동한다고 말하죠. 하지만 이어서 이것이 전혀 절망적인 생각일 필요가 없다고 말하며 우리의 시각을 전환시켜 줍니다.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 글쓴이의 본격적인 주장과 그 이유가 나옵니다. 무의식적 설정은 오히려 인간 설계의 승리라고 주장하죠. 왜냐하면 모든 걸 의식적으로 처리하려면 너무 느리고 대가가 커서, 생존 경쟁에서 도태되었을 것이기 때문이에요.","hl":"f1"},{"n":6,"text":"다섯 번째 문장에서는 재미있는 비유가 등장합니다. 뇌의 이런 자동화 시스템은 마치 배의 자동 운항 시스템과 같아요. 자잘한 일들은 알아서 굴러가게 둠으로써, 선장이 정말 중요한 위기 상황이나 결정을 위해 해방될 수 있다는 것이죠.","hl":"f2"},{"n":7,"text":"마지막 여섯 번째와 일곱 번째 문장에서는 다시 한번 주장을 강조하며 결론을 냅니다. 우리가 아무 생각 없이 하는 행동들, 즉 기본 설정은 결함이 아닙니다. 오히려 이 복잡한 삶을 어떻게든 살아낼 수 있게 만들어 주는 가장 핵심적인 특징이라고 쐐기를 박고 있네요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글쓴이는 행동의 대부분이 무의식적이라는 사실을 도입부에 제시한 후, 세 번째 문장에서 그것이 훌륭한 \u003cb class=\"key\">설계\u003c/b>라고 주장합니다. 이후 만약 모든 것을 \u003cb class=\"key\">의식적\u003c/b>으로 해야 한다면 벌어질 문제점을 근거로 제시하고, 선장의 \u003cb class=\"key\">비유\u003c/b>를 들어 이해를 돕습니다. 마지막으로 이것이 복잡한 삶을 가능케 하는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">특징\u003c/b>이라고 다시 한번 강력하게 결론 내립니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>This need not be a hopeless thought. (2)\u003c/b>\u003cspan>통념 반박 및 분위기 전환\u003c/span>\u003cb>If you had to consciously decide (4)\u003c/b>\u003cspan>반대 상황 가정을 통한 근거 제시\u003c/span>\u003cb>arguably the central feature (7)\u003c/b>\u003cspan>최종 결론 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">settings laid down\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">automation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The default\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the central feature\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>자동화된 설정 (automation)\u003c/th>\u003cth>신중한 사고 (deliberate mind)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>오래전 정해져 무의식적으로 작동\u003c/td>\u003ctd>모든 발걸음, 행동, 말을 의식적으로 결정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>선장(의식)을 정말 중요한 문제로 해방시킴\u003c/td>\u003ctd>너무 느리고 대가가 커서 삶을 실시간으로 운영 불가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>복잡한 삶을 감당하게 해주는 핵심 특징\u003c/td>\u003ctd>경쟁에서 패배하게 만듦\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식을 보면, 주장이 앞부분과 뒷부분에 모두 강조되어 있는 양괄식 구조를 띠고 있습니다. 세 번째 문장에서 설계의 승리라고 먼저 선언하고, 마지막 문장에서 핵심 특징이라고 멋지게 마무리하죠. 중간에 나오는 가정법과 비유가 이 주장을 아주 튼튼하게 뒷받침하고 있어요.","hl":"ty"},{"n":9,"text":"신호어를 챙겨봅시다. 두 번째 문장에 나온 This need not be a hopeless thought에서 분위기가 반전되며 필자의 의도가 드러나기 시작하죠. 네 번째 문장의 If you had to consciously decide라는 가정법은 우리가 의식적으로 모든 걸 해야 한다는 극단적 상황을 가정해서, 오히려 자동화가 필수적임을 역설하고 있습니다. 그리고 글 전체에 걸쳐 settings laid down, automation, the default 같은 단어들이 모두 같은 개념을 바꿔치기하며 반복되고 있다는 걸 꼭 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>overwhelming\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>압도적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>majority\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대다수, 다수\u003c/span>\u003c/div>\u003cdiv>\u003cb>behaviour\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>pack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>꽉 채우다, 포장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lay down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>정하다, 규정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rarely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>거의 ~하지 않는\u003c/span>\u003c/div>\u003cdiv>\u003cb>inspect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>점검하다, 검사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hopeless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>절망적인, 가망 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>triumph\u003c/b>\u003cem>명사\u003c/em>\u003cspan>승리, 대성공\u003c/span>\u003c/div>\u003cdiv>\u003cb>engineering\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공학, 설계 기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>consciously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>의식적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>deliberate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>신중한, 의도적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>costly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대가가 큰, 비용이 많이 드는\u003c/span>\u003c/div>\u003cdiv>\u003cb>outcompete\u003c/b>\u003cem>동사\u003c/em>\u003cspan>경쟁에서 이기다, 물리치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>automation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자동화\u003c/span>\u003c/div>\u003cdiv>\u003cb>precisely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정확히, 바로\u003c/span>\u003c/div>\u003cdiv>\u003cb>free\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해방하다, 자유롭게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>require\u003c/b>\u003cem>동사\u003c/em>\u003cspan>필요로 하다, 요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>default\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기본 설정, 초기 설정\u003c/span>\u003c/div>\u003cdiv>\u003cb>flaw\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결함, 흠\u003c/span>\u003c/div>\u003cdiv>\u003cb>arguably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>거의 틀림없이, 주장하건대\u003c/span>\u003c/div>\u003cdiv>\u003cb>central\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중심적인, 핵심적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>feature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특징, 특색\u003c/span>\u003c/div>\u003cdiv>\u003cb>affordable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>감당할 수 있는, 알맞은\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘도 몇 가지 확인해 볼까요? overwhelming은 압도적인이라는 뜻이고, deliberately 대신 쓰인 형용사 deliberate는 신중한, 의도적인이라는 의미입니다. 그리고 affordable은 비용이나 상황을 감당할 수 있다는 뜻으로 지문 마지막에 아주 중요하게 쓰였어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">overwhelming\u003c/b>\u003cspan class=\"m\">압도적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"s\">immense\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rarely\u003c/b>\u003cspan class=\"m\">거의 ~않는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">seldom\u003c/span>\u003cspan class=\"s\">hardly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">frequently\u003c/span>\u003cspan class=\"a\">often\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">deliberate\u003c/b>\u003cspan class=\"m\">신중한, 의도적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conscious\u003c/span>\u003cspan class=\"s\">intentional\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">automatic\u003c/span>\u003cspan class=\"a\">accidental\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">costly\u003c/b>\u003cspan class=\"m\">대가가 큰\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">expensive\u003c/span>\u003cspan class=\"s\">damaging\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cheap\u003c/span>\u003cspan class=\"a\">beneficial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">flaw\u003c/b>\u003cspan class=\"m\">결함\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">defect\u003c/span>\u003cspan class=\"s\">fault\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">perfection\u003c/span>\u003cspan class=\"a\">strength\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">affordable\u003c/b>\u003cspan class=\"m\">감당할 수 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">manageable\u003c/span>\u003cspan class=\"s\">reasonable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unaffordable\u003c/span>\u003cspan class=\"a\">unmanageable\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 정리해 볼게요. deliberate는 의도적이고 신중하다는 뜻이니 conscious나 intentional로 바꿔 쓸 수 있고, 반대말로는 automatic이 되겠죠. 결함을 뜻하는 flaw는 defect나 fault로 대체할 수 있고, 반대말은 strength입니다. 마지막으로 affordable은 감당 가능하다는 의미에서 manageable이나 reasonable로 해석할 수 있겠습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">80년을 사는 사람은 약 2만 9천 일을 살고, 그리고 행동의 압도적인 다수는 그 속에 빽빽이 들어 있는 설정들에 따라 작동한다 대부분이 수십 년 전에 정해져서 그 이후로는 거의 점검되지 않은\u003c/span>\u003cspan class=\"en\">A person \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">lives \u003c/span>\u003cspan class=\"tgt\">eighty \u003c/span>\u003cspan class=\"tgt\">years\u003c/span> lives some twenty­nine thousand days, and the overwhelming majority of the behaviour \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">packed \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">them\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">runs\u003c/span> on settings \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">laid \u003c/span>\u003cspan class=\"tgt\">down, \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">them, \u003c/span>\u003cspan class=\"tgt\">decades \u003c/span>\u003cspan class=\"tgt\">earlier \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">rarely \u003c/span>\u003cspan class=\"tgt\">inspected \u003c/span>\u003cspan class=\"tgt\">since\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">80년을 사는 사람은 약 2만 9천 일을 살고, 그 속에 빽빽이 들어 있는 행동의 압도적인 다수는 대부분이 수십 년 전에 정해져서 그 이후로는 거의 점검되지 않은 설정들에 따라 작동한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 인간의 삶 대부분이 오래전에 무의식적으로 정해진 \u003cb class=\"key\">설정\u003c/b>에 따라 \u003cb class=\"key\">자동\u003c/b>으로 굴러간다는 사실을 제시합니다. 글의 도입부로 인간 행동의 무의식적이고 기계적인 속성을 강조하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사절\u003c/span> : A person [선행사] + who [주격 관계대명사] + lives [동사] : \"80년을 사는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구 (후치수식)\u003c/span> : the behaviour [명사] + packed [과거분사] + into them [전치사구] : \"그 속에 빽빽이 들어 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : the overwhelming majority [부분사] of the behaviour [단수명사 주어] + runs [단수동사] : \"작동한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">과거분사구 (병렬구조)\u003c/span> : settings [명사] + laid down [과거분사 1] ... and ... inspected [과거분사 2] : \"대부분이 수십 년 전에 정해져서 그 이후로는 거의 점검되지 않은\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"A person who lives eighty years, 80년을 사는 사람은. lives some twenty-nine thousand days, 약 2만 9천 일을 살고. and the overwhelming majority of the behaviour, 그리고 행동의 압도적인 다수는. packed into them, 그 속에 빽빽이 들어 있는. runs on settings, 설정들에 따라 작동한다. laid down, most of them, decades earlier, 대부분이 수십 년 전에 정해져서. and rarely inspected since, 그 이후로는 거의 점검되지 않은. 이 문장 전체를 해석하면, 80년을 사는 사람은 약 2만 9천 일을 살고, 그 속에 빽빽이 들어 있는 행동의 압도적인 다수는 대부분이 수십 년 전에 정해져서 그 이후로는 거의 점검되지 않은 설정들에 따라 작동한다.","hl":"m"},{"n":13,"text":"이 문장은 인간의 삶 대부분이 오래전에 무의식적으로 정해진 설정에 따라 자동으로 굴러간다는 사실을 제시해요. 글의 도입부로, 우리 행동의 무의식적이고 기계적인 속성을 강조하고 있죠.","hl":"mn"},{"n":14,"text":"어법 구조가 꽤 복잡하니 잘 보세요. 첫 번째로 who lives는 선행사 A person을 수식하는 주격 관계대명사절이에요. 단수 선행사라서 동사에 -s가 붙었어요. 두 번째로 packed into them은 앞의 behaviour를 꾸며주는 과거분사구예요. 행동이 채워지는 거니까 수동의 의미인 과거분사구를 썼죠. 세 번째로 동사 runs를 보세요. 주어가 overwhelming majority of the behaviour인데, majority of 뒤의 the behaviour가 셀 수 없는 단수명사라서 단수동사 runs를 쓴 거랍니다. 수 일치 문제로 나오기 아주 좋아요. 마지막으로 laid down과 inspected는 settings를 뒤에서 꾸며주는 과거분사 병렬구조라는 점도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이 꼭 절망적인 생각일 필요는 없다\u003c/span>\u003cspan class=\"en\">This \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">절망적인 생각\u003c/span>\u003cspan class=\"en\">a hopeless thought.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것이 꼭 절망적인 생각일 필요는 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 말한 기계적인 행동 양식이 결코 \u003cb class=\"key\">부정적\u003c/b>인 것이 아님을 명시하며 글의 \u003cb class=\"key\">반전\u003c/b>을 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 need\u003c/span> : need [조동사] + not + 동사원형 : \"~일 필요는 없다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"This need not be, 이것이 꼭 절망적인 생각일 필요는 없다. a hopeless thought, 절망적인 생각. 이 문장 전체를 해석하면, 이것이 꼭 절망적인 생각일 필요는 없다.","hl":"m"},{"n":16,"text":"우리가 기계적으로 산다고 해서 그게 나쁜 걸까요? 이 문장은 그런 기계적인 행동 양식이 결코 부정적인 것이 아니라고 말하면서 글의 분위기에 반전을 주고 있어요.","hl":"mn"},{"n":17,"text":"여기서 need not be를 주의 깊게 보세요. 긍정문에서는 일반동사로 쓰이는 need가 부정문에서는 조동사로 쓰일 수 있거든요. 그래서 뒤에 동사원형인 be가 바로 온 거예요. 일반동사처럼 does not need to be로 바꿔 써도 똑같은 뜻이 된답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 관점에서\u003c/span>\u003cspan class=\"en\">In one light\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 설계의 승리이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> a triumph of engineering.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 관점에서 그것은 설계의 승리이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 무의식적이고 자동화된 우리의 행동 체계를 \u003cb class=\"key\">긍정적\u003c/b>으로 평가하고 있습니다. 불필요한 생각의 에너지를 줄여주니까, 인간이라는 복잡한 기계의 훌륭한 \u003cb class=\"key\">설계\u003c/b>라는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 it\u003c/span> : it [대명사] : \"그것은 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"In one light, 어떤 관점에서. it is a triumph of engineering, 그것은 설계의 승리이다.. 이 문장 전체를 해석하면, 어떤 관점에서 그것은 설계의 승리이다.","hl":"m"},{"n":19,"text":"무의식적이고 자동화된 우리의 행동 체계를 아주 긍정적으로 평가하는 문장이에요. 불필요한 생각의 에너지를 줄여주니까, 인간이라는 복잡한 기계의 훌륭한 설계라는 뜻이죠.","hl":"mn"},{"n":20,"text":"여기서 대명사 it이 가리키는 게 뭔지 아는 게 중요해요. it은 첫 번째 문장에서 길게 설명했던, 인간의 행동 대부분이 오래된 설정에 따라 자동으로 작동한다는 그 사실 전체를 받아주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 여러분이 의식적으로 결정해야 한다면\u003c/span>\u003cspan class=\"en\">If you had to consciously decide\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발걸음 하나하나와, 포크를 쥐는 동작 하나하나와, 말 한마디 한마디를\u003c/span>\u003cspan class=\"en\">every footstep and every fork­grip and every word,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 침대에서 결코 빠져나오지 못할 것인데,\u003c/span>\u003cspan class=\"en\">you would never make it out of bed;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 신중한 사고는 너무 느리고 대가가 너무 커서\u003c/span>\u003cspan class=\"en\">the deliberate mind is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">far \u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">slow \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">costly\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶 전체를 실시간으로 운영할 수 없고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">run \u0 class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(the thing) + 주격 관계대명사(that) + 동사(makes) : \"~하게 만드는 (것)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 구조 (make + O + OC)\u003c/span> : make [불완전 타동사] + 목적어 + 목적격 보어 [형용사] : \"복잡한 삶을 감당할 수 있게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"It is arguably the central feature, 그것은 거의 틀림없이 핵심적인 특징이다. the thing that makes, 즉 ~하게 만드는 것이다. a complex life affordable at all, 복잡한 삶을 조금이라도 감당할 수 있게. 이 문장 전체를 해석하면, 그것은 거의 틀림없이 핵심적인 특징, 즉 복잡한 삶을 조금이라도 감당할 수 있게 만드는 것이다.","hl":"m"},{"n":31,"text":"이 문장은 이 지문의 결론에 해당해요. 앞서 말한 우리의 무의식적인 기본값, 즉 자동화가 절대 인간의 결함이 아니라는 거죠. 오히려 이 자동화가 인간의 가장 중요한 핵심 특징이라고 강조하고 있어요. 이 무의식적 자동화가 있기 때문에 우리는 그 수많은 자극으로 가득 찬 복잡한 삶을 엄청난 에너지 낭비 없이 무사히 감당할 수 있다는 멋진 메시지를 전하고 있습니다.","hl":"mn"},{"n":32,"text":"문법 포인트 세 가지를 짚어볼게요. 첫 번째로 feature 뒤에 있는 콤마를 보세요. 이 콤마는 앞의 핵심적인 특징과 뒤에 나오는 the thing을 같게 연결해 주는 동격의 콤마입니다. 즉이라는 말로 자연스럽게 이어서 해석하면 돼요. 두 번째로 the thing 뒤에 있는 that makes를 볼까요? 여기서 that은 선행사 the thing을 꾸며주는 주격 관계대명사예요. 선행사가 단수니까 동사도 반드시 단수형으로 makes라고 써야 한다는 점 잊지 마세요. 세 번째로 makes a complex life affordable 부분을 볼게요. make는 목적어와 목적격 보어를 가지는 오형식 동사죠. a complex life라는 목적어 뒤에 목적격 보어로 감당할 수 있는 이라는 뜻의 형용사 affordable이 왔어요. 보어 자리에는 부사를 쓸 수 없으니까 affordably라고 쓰면 절대 안 된다는 거 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>인간 행동의 다수는 과거에 정해진 \u003cb class=\"key\">설정\u003c/b>에 따라 무의식적으로 작동합니다.\u003c/li>\u003cli>이는 절망적인 일이 아니라, 오히려 인간 설계의 \u003cb class=\"key\">승리\u003c/b>라 할 수 있습니다.\u003c/li>\u003cli>신중한 의식적 사고는 속도가 \u003cb class=\"key\">느리고\u003c/b> 대가가 커서 삶 전체를 실시간으로 운영할 수 없습니다.\u003c/li>\u003cli>\u003cb class=\"key\">자동화\u003c/b>된 기본 설정 덕분에 우리는 복잡한 삶을 감당하며 중요한 문제에 집중할 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The automated default settings of human behavior are essential features that make managing a complex life possible by freeing the conscious mind.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">인간 행동의 압도적 다수를 차지하는 \u003cb class=\"key\">자동화\u003c/b>된 기본 설정은 삶의 결함이 아니라, 신중한 사고가 필요한 중요한 문제에 집중할 수 있게 하여 복잡한 삶을 감당하게 해주는 인간 설계의 \u003cb class=\"key\">핵심적 \u003c/b>\u003cb class=\"key\">특징\u003c/b>이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"자, 오늘 지문 어떠셨나요? 우리가 매일 생각 없이 하는 행동들이 사실은 우리의 뇌가 복잡한 세상을 살아가기 위해 선택한 최고의 생존 전략이라는 점, 정말 흥미롭지 않나요? 글의 요지와 자동화, 의식적 사고의 대조 구조를 꼭 복습하시기 바랍니다. 그럼 다음 강의에서 만나요!","hl":null}]}]});</script></body></html>
