}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 40번","audioDir":"40_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">40번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>How Dolphins Process Echolocation: The Power of Parallel Processing\u003c/h1>\u003ch2>돌고래가 반향 정위를 처리하는 방법: 병렬 처리의 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>돌고래는 고도로 특화된 \u003cb class=\"key\">청각 \u003c/b>\u003cb class=\"key\">피질\u003c/b>을 통해 반향 정위 신호를 순차적이 아닌 \u003cb class=\"key\">병렬로 \u003c/b>\u003cb class=\"key\">처리\u003c/b>함으로써 인지 부하를 줄이고 효율적으로 환경에 반응합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Dolphins utilize highly specialized auditory cortices for parallel processing of echolocation signals, increasing efficiency and reducing cognitive load.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘은 돌고래가 초음파를 이용해 주변을 인식하는 놀라운 방법에 대해 알아보겠습니다. 이 글의 영어 제목은 How Dolphins Process Echolocation, 즉 돌고래가 반향 정위를 처리하는 방법과 병렬 처리의 힘에 대한 내용이에요. 돌고래는 고도로 특화된 뇌를 통해 정보를 순차적이 아닌 병렬로 처리하여 인지 부하를 줄이고 효율을 높인다는 것이 전체 요지입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">돌고래는 초음파를 쏘고 반사되어 돌아오는 소리를 통해 주변을 파악하는 \u003cb class=\"key\">반향 \u003c/b>\u003cb class=\"key\">정위\u003c/b>(echolocation) 능력을 가지고 있습니다. 이 정보를 처리하기 위해 돌고래의 뇌는 특별하게 진화했는데, 그 핵심은 뇌의 소리 처리 중추인 \u003cb class=\"key\">청각 \u003c/b>\u003cb class=\"key\">피질\u003c/b>(auditory cortex)의 특화입니다. 인간을 포함한 많은 포유류가 정보를 하나씩 순서대로 처리하는 \u003cb class=\"key\">순차적 \u003c/b>\u003cb class=\"key\">처리\u003c/b>(sequential processing) 방식을 주로 사용합니다. 반면, 돌고래는 다양한 특징을 동시에 분석하는 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">처리\u003c/b>(parallel processing) 능력이 매우 뛰어납니다. 이는 마치 식당에서 한 사람이 주문, 요리, 서빙을 순서대로 다 하는 것이 아니라, 여러 직원이 각자의 업무를 \u003cb class=\"key\">동시에 \u003c/b>\u003cb class=\"key\">수행\u003c/b>하여 음식을 빠르게 내놓는 것과 같습니다. 이러한 뇌 구조 덕분에 돌고래는 복잡한 수중 환경에서도 에너지를 아끼며 즉각적으로 생존 반응을 보일 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 조금 설명해 드릴게요. 돌고래는 소리를 내고 그 메아리를 듣고 사물을 파악하는 echolocation, 즉 반향 정위 능력이 아주 탁월합니다. 우리가 식당에서 한 명이 주문을 받고 요리하고 서빙까지 전부 다 하면 시간이 오래 걸리겠죠? 이것이 바로 sequential processing, 즉 순차적 처리입니다. 반면에 돌고래의 뇌는 여러 직원이 각자 역할을 나누어 동시에 일하는 것처럼 작동해요. 이를 parallel processing, 병렬 처리라고 부르며, 덕분에 돌고래는 바닷속에서 아주 빠르고 효율적으로 장애물을 피하거나 먹이를 찾을 수 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입\u003csmall>개념 소개 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>돌고래는 \u003cb class=\"key\">반향 \u003c/b>\u003cb class=\"key\">정위\u003c/b> 정보를 효율적으로 처리하도록 진화했습니다. 귀에서 수집된 신호는 소리를 담당하는 핵심 뇌 부위인 \u003cb class=\"key\">청각 \u003c/b>\u003cb class=\"key\">피질\u003c/b>로 빠르게 전달됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>전개\u003csmall>특징 설명 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>다른 포유류와 달리 돌고래의 청각 피질은 여러 \u003cb class=\"key\">개별 \u003c/b>\u003cb class=\"key\">구역\u003c/b>으로 나뉘어 있습니다. 각 구역은 반사파의 타이밍, 주파수, 강도 등을 \u003cb class=\"key\">각기 \u003c/b>\u003cb class=\"key\">따로\u003c/b> 분석하는 역할을 맡습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>핵심/비유\u003csmall>원리 설명 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>이러한 뇌의 특화는 정보의 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">처리\u003c/b>를 가능하게 합니다. 이는 각자 다른 과업을 맡은 노동자들이 일하는 \u003cb class=\"key\">공장 \u003c/b>\u003cb class=\"key\">조립 \u003c/b>\u003cb class=\"key\">라인\u003c/b>과 같은 원리입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론\u003csmall>효과 강조 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>업무 분담을 통한 병렬 처리는 뇌가 정보를 훨씬 빠르고 효율적으로 처리하게 돕습니다. 결과적으로 \u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">부하\u003c/b>가 줄어들어 환경 변화에 \u003cb class=\"key\">빠르게 \u003c/b>\u003cb class=\"key\">반응\u003c/b>할 수 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이 글이 어떻게 전개되는지 네 단계로 나누어 자세히 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째 단계는입부로, 첫 번째 문장부터 세 번째 문장까지의 내용입니다. 돌고래는 반향 정위 정보를 효율적으로 처리하기 위해 특화된 뇌 구역을 진화시켰다고 이야기합니다. 귀로 수집된 소리 신호는 뇌에서 소리 처리를 담당하는 청각 피질로 아주 빠르게 전달되죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 전개부로, 네 번째 문장과 다섯 번째 문장에 해당합니다. 일반 포유류와 달리 돌고래의 청각 피질은 여러 개별 구역으로 나뉘어 있다는 것이 특징이에요. 각각의 구역은 반사파가 돌아오는 시간, 소리의 주파수, 그리고 소리의 강도를 각기 따로따로 분석하는 임무를 맡습니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 핵심 원리와 비유를 다루는 여섯 번째 문장과 일곱 번째 문장입니다. 앞서 말한 뇌의 특화 덕분에 돌고래는 정보를 순서대로 처리하지 않고 한꺼번에 병렬로 처리할 수 있어요. 글쓴이는 독자의 이해를 돕기 위해 이것을 각자 다른 과업을 맡은 노동자들이 줄지어 서 있는 공장 조립 라인에 비유하고 있습니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 결론부로 여덟 번째 문장과 아홉 번째 문장입니다. 이렇게 뇌의 여러 구역이 업무를 분담하면 정보 처리 속도와 효율성이 크게 올라갑니다. 결과적으로 뇌가 정보를 처리할 때 받는 인지 부하가 획기적으로 줄어들어서, 돌고래는 주변 환경의 변화에 즉각적으로 반응할 수 있게 됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비유\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 돌고래 뇌의 진화를 소개하고 마지막 문장에서 그 이점을 요약하는 \u003cb class=\"key\">양괄식\u003c/b> 구조입니다. 돌고래의 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">처리\u003c/b> 방식을 설명하기 위해 다른 일반 포유류와의 대조를 사용합니다. 또한, 독자의 이해를 돕기 위해 공장 조립 라인의 노동자라는 \u003cb class=\"key\">비유\u003c/b>를 활용하여 정보 처리의 효율성을 생생하게 강조하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (4)\u003c/b>\u003cspan>전환 및 대조 (일반 포유류와 돌고래의 차이점 부각)\u003c/span>\u003cb>rather than sequentially (6)\u003c/b>\u003cspan>대조 (병렬 처리와 순차적 처리의 방식 대비)\u003c/span>\u003cb>Imagine (7)\u003c/b>\u003cspan>예시 및 비유 도입 (공장 조립 라인 비유 시작)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">specialized areas dedicated to echolocation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">auditory pathway\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">highly specialized auditory cortex\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">distinct areas\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">process echo information in parallel\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">dividing the work\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">parallel processing\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>돌고래의 병렬 처리\u003c/th>\u003cth>일반적인 순차적 처리\u003c/th>\u003c/tr>\u003ctr>\u003ctd>여러 구역에서 동시에 나누어 처리\u003c/td>\u003ctd>한 번에 하나씩 순서대로 처리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>속도가 빠르고 매우 효율적임\u003c/td>\u003ctd>상대적으로 처리 속도가 느림\u003c/td>\u003c/tr>\u003ctr>\u003ctd>인지 부하가 크게 감소함\u003c/td>\u003ctd>인지 부하가 상대적으로 큼\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 첫 번째 문장에서 주제를 명확히 던져주고 마지막 아홉 번째 문장에서 결론을 내리며 다시 한번 강조하는 양괄식 구조를 띠고 있습니다. 돌고래의 독특한 병렬 처리 방식을 설명하기 위해서 일반적인 포유류의 방식과 대비시켰고, 특히 공장 조립 라인이라는 비유를 사용해 어려운 개념을 아주 쉽게 풀어내고 있어요.","hl":"ty"},{"n":9,"text":"글의 흐름을 단단하게 잡아주는 신호어들을 확인해 볼게요. 네 번째 문장에 However가 나오면서 일반 포유류와 돌고래의 차이점을 부각하기 시작합니다. 여섯 번째 문장의 rather than sequentially는 병렬 처리와 순차적 처리를 대조하면서 핵심을 찌르죠. 일곱 번째 문장의 Imagine은 본격적인 비유가 시작됨을 알리는 중요한 신호입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>evolve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진화하다, 진화시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>specialized\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특화된, 전문화된\u003c/span>\u003c/div>\u003cdiv>\u003cb>dedicated to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 전념하는, ~에 특화된\u003c/span>\u003c/div>\u003cdiv>\u003cb>echolocation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반향 정위\u003c/span>\u003c/div>\u003cdiv>\u003cb>process\u003c/b>\u003cem>동사\u003c/em>\u003cspan>처리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>acoustic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>음향의, 청각의\u003c/span>\u003c/div>\u003cdiv>\u003cb>adaptation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>적응, 적응 구조\u003c/span>\u003c/div>\u003cdiv>\u003cb>auditory pathway\u003c/b>\u003cem>명사\u003c/em>\u003cspan>청각 경로\u003c/span>\u003c/div>\u003cdiv>\u003cb>transmit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전달하다, 전송하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>auditory cortex\u003c/b>\u003cem>명사\u003c/em>\u003cspan>청각 피질\u003c/span>\u003c/div>\u003cdiv>\u003cb>responsible for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 담당하는, ~에 책임이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>mammal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>포유류\u003c/span>\u003c/div>\u003cdiv>\u003cb>distinct\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>뚜렷한, 개별적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>aspect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>측면, 양상\u003c/span>\u003c/div>\u003cdiv>\u003cb>analyze\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분석하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>timing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>타이밍, 시기\u003c/span>\u003c/div>\u003cdiv>\u003cb>echo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>메아리, 반사파\u003c/span>\u003c/div>\u003cdiv>\u003cb>frequency content\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주파수 성분\u003c/span>\u003c/div>\u003cdiv>\u003cb>intensity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>강도, 세기\u003c/span>\u003c/div>\u003cdiv>\u003cb>in parallel\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>병렬로, 동시에\u003c/span>\u003c/div>\u003cdiv>\u003cb>sequentially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>순차적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>assembly line\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조립 라인\u003c/span>\u003c/div>\u003cdiv>\u003cb>divide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나누다, 분담하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>efficiently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>효율적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>cognitive load\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인지 부하\u003c/span>\u003c/div>\u003cdiv>\u003cb>associated with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 관련된, 연관된\u003c/span>\u003c/div>\u003cdiv>\u003cb>react\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반응하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문에서 꼭 알아둬야 할 핵심 단어들을 짚어볼까요. echolocation은 반향 정위라는 뜻으로 이 글을 관통하는 핵심 소재입니다. auditory cortex는 청각 피질이라는 뇌의 특정 부위를 뜻하죠. distinct는 뚜렷이 구별되는 개별적인 구역을 설명할 때 쓰였고, cognitive load는 뇌가 정보를 처리할 때 느끼는 인지 부하를 의미합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">specialized\u003c/b>\u003cspan class=\"m\">특화된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">customized\u003c/span>\u003cspan class=\"s\">adapted\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">generalized\u003c/span>\u003cspan class=\"a\">unspecialized\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">transmit\u003c/b>\u003cspan class=\"m\">전달하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">transfer\u003c/span>\u003cspan class=\"s\">convey\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">retain\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distinct\u003c/b>\u003cspan class=\"m\">개별적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">separate\u003c/span>\u003cspan class=\"s\">different\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003cspan class=\"a\">uniform\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">parallel\u003c/b>\u003cspan class=\"m\">병렬의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">concurrent\u003c/span>\u003cspan class=\"s\">simultaneous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sequential\u003c/span>\u003cspan class=\"a\">consecutive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">intensity\u003c/b>\u003cspan class=\"m\">강도\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">strength\u003c/span>\u003cspan class=\"s\">power\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weakness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">efficiently\u003c/b>\u003cspan class=\"m\">효율적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">effectively\u003c/span>\u003cspan class=\"s\">productively\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inefficiently\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험의 어휘 문제에 대비해서 동의어와 반의어도 같이 정리해 둡시다. distinct의 동의어로는 separate, different가 있고, 반의어로는 identical이나 uniform이 있습니다. parallel은 이 글에서 가장 중요한 단어인데요, 동의어인 concurrent, simultaneous를 꼭 기억해 두세요. 반대말은 글에도 등장한 sequentially의 형용사 형태인 sequential입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌고래들의 뇌는 특화된 구역들을 진화시켰고,\u003c/span>\u003cspan class=\"en\">Dolphins' brains have evolved specialized areas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반향 정위에 사용되는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">dedicated \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">echolocation\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 음향 정보를 처리하게 해 준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">allowing \u003c/span>\u003cspan class=\"tgt\">them \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">process\u003c/span> acoustic information\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 빠르게 그리고 더 적은 에너지로.\u003c/span>\u003cspan class=\"en\">more quickly and with less energy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">돌고래들의 뇌는 반향 정위에 사용되는 특화된 구역들을 진화시켰고, 그것은 그것들이 음향 정보를 더 빠르게 그리고 더 적은 에너지로 처리하게 해 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 핵심 주제를 제시하는 문장입니다. 돌고래가 초음파로 위치를 찾는 능력을 위해 \u003cb class=\"key\">뇌의 \u003c/b>\u003cb class=\"key\">진화\u003c/b>를 이루어냈으며, 그에 따른 \u003cb class=\"key\">결과적 \u003c/b>\u003cb class=\"key\">이점\u003c/b>(빠른 속도, 적은 에너지 소모)이 무엇인지 명확히 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구 (명사 수식)\u003c/span> : 명사(areas) + [과거분사(dedicated) + 전치사구] : \"반향 정위에 사용되는,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (연속 동작/결과)\u003c/span> : , + [현재분사(allowing)] + 목적어(them) + [to부정사(to process)] : \"그것들이 ~을 처리하게 해 준다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Dolphins' brains have evolved specialized areas, 돌고래들의 뇌는 특화된 구역들을 진화시켰고. dedicated to echolocation, 반향 정위에 사용되는. allowing them to process acoustic information, 그것들이 음향 정보를 처리하게 해 준다. more quickly and with less energy, 더 빠르게 그리고 더 적은 에너지로.. 이 문장 전체를 해석하면, 돌고래들의 뇌는 반향 정위에 사용되는 특화된 구역들을 진화시켰고, 그것은 그것들이 음향 정보를 더 빠르게 그리고 더 적은 에너지로 처리하게 해 준다.","hl":"m"},{"n":13,"text":"이 글의 핵심 소재인 돌고래의 뇌 진화에 대해 소개하는 첫 번째 문장이에요. 반향 정위, 즉 초음파로 위치를 파악하는 능력을 위해 뇌가 진화했고, 그 결과 에너지를 덜 쓰면서도 정보를 아주 빠르게 처리할 수 있게 되었다는 거죠.","hl":"mn"},{"n":14,"text":"문법 포인트 두 가지 짚어볼게요. 첫 번째로 dedicated입니다. 앞의 areas를 꾸며주는 과거분사인데요, 구역들이 반향 정위에 사용되도록 할당된 거니까 수동의 의미인 과거분사를 썼어요. 두 번째는 콤마 뒤의 allowing입니다. 앞의 뇌 진화 사실을 받아 그 결과 무언가하게 해준다라고 자연스럽게 이어지는 분사구문이죠. 이때 allow는 목적어 뒤에 목적격 보어로 꼭 to부정사를 데리고 온다는 점도 같이 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 가지 핵심적인 적응 구조는 ~이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">One \u003c/span>\u003cspan class=\"tgt\">key \u003c/span>\u003cspan class=\"tgt\">adaptation \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌고래의 청각 경로의 구조\u003c/span>\u003cspan class=\"en\">the structure of the dolphin's auditory pathway.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 가지 핵심적인 적응 구조는 돌고래의 청각 경로의 구조이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 번째 문장에서 언급한 진화의 구체적인 예시로 넘어가는 \u003cb class=\"key\">연결 \u003c/b>\u003cb class=\"key\">고리\u003c/b> 역할을 합니다. 그 특화된 구역의 실체가 바로 \u003cb class=\"key\">청각 \u003c/b>\u003cb class=\"key\">경로\u003c/b> 구조임을 짚어줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : 단수 주어(One key adaptation) + 단수 동사(is) : \"한 가지 핵심적인 적응 구조는 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"One key adaptation is, 한 가지 핵심적인 적응 구조는 ~이다. the structure of the dolphin's auditory pathway, 돌고래의 청각 경로의 구조. 이 문장 전체를 해석하면, 한 가지 핵심적인 적응 구조는 돌고래의 청각 경로의 구조이다.","hl":"m"},{"n":16,"text":"첫 번째 문장에서 말한 그 진화의 구체적인 예시를 던져주는 문장이에요. 바로 돌고래의 청각 경로 구조가 핵심적인 적응의 결과라는 걸 알려주고 있죠.","hl":"mn"},{"n":17,"text":"주어 자리에 One key adaptation이라는 단수 명사가 왔기 때문에 동사도 단수형인 is를 썼다는 아주 기본적인 수 일치만 가볍게 확인하고 넘어갈게요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">귀로부터의 신호들은\u003c/span>\u003cspan class=\"en\">The signals from the ears\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠르게 전달된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">rapidly \u003c/span>\u003cspan class=\"tgt\">transmitted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">청각 피질로,\u003c/span>\u003cspan class=\"en\">to the auditory cortex\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소리를 처리하는 것을 담당하는 뇌 영역인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">brain \u003c/span>\u003cspan class=\"tgt\">region \u003c/span>\u003cspan class=\"tgt\">responsible \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">processing \u003c/span>\u003cspan class=\"tgt\">sound.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">귀로부터의 신호들은 소리를 처리하는 것을 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 돌고래의 귀로 들어온 소리 신호가 뇌의 어디로 향하는지 그 경로를 구체적으로 설명합니다. 해부학 용어인 \u003cb class=\"key\">청각 \u003c/b>\u003cb class=\"key\">피질\u003c/b>을 등장시키고 그 역할을 \u003cb class=\"key\">동격\u003c/b>으로 알기 쉽게 풀어주고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사(are) + 부사(rapidly) + 과거분사(transmitted) : \"빠르게 전달된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격 및 형용사구 후치 수식\u003c/span> : 명사(cortex) + ,(동격) + [명사(region) + 형용사구(responsible ~)] : \"소리를 처리하는 것을 담당하는 뇌 영역인\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The signals from the ears, 귀로부터의 신호들은. are rapidly transmitted, 빠르게 전달된다. to the auditory cortex, 청각 피질로. the brain region responsible for processing sound, 소리를 처리하는 것을 담당하는 뇌 영역인. 이 문장 전체를 해석하면, 귀로부터의 신호들은 소리를 처리하는 것을 담당하는 뇌 영역인 청각 피질로 빠르게 전달된다.","hl":"m"},{"n":19,"text":"귀로 들어온 소리 신호가 뇌의 어디로 가는지 구체적인 경로를 설명하고 있어요. 신호가 소리 처리를 담당하는 청각 피질로 쏜살같이 전달된다는 내용이죠.","hl":"mn"},{"n":20,"text":"여기서 두 가지 문법 포인트를 확인해 볼까요? 첫 번째, are rapidly transmitted 부분입니다. 귀에서 온 신호들은 자기가 알아서 가는 게 아니라 뇌로 전달되는 거잖아요? 그래서 be동사 플러스 과거분사 형태의 수동태를 썼습니다. 두 번째는 auditory cortex 뒤에 있는 콤마예요. 이건 청각 피질이 뭔지 부연 설명해 주는 동격의 콤마입니다. 그리고 그 뒤에 나온 responsible 앞에는 주격 관계대명사와 be동사가 생략되어 있어서, 뇌 영역을 뒤에서 꾸며주고 있다고 이해하시면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나, 많은 다른 포유류들과 달리,\u003c/span>\u003cspan class=\"en\">However, unlike many other mammals,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌고래는 가지고 있다\u003c/span>\u003cspan class=\"en\">dolphins have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고도로 특화된 청각 피질을\u003c/span>\u003cspan class=\"en\">a highly specialized auditory cortex\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개별 구역들을 가진\u003c/span>\u003cspan class=\"en\">with distinct areas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처리하는 것에 사용되는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">dedicated \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">processing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반향 정위 신호들의 서로 다른 측면들을\u003c/span>\u003cspan class=\"en\">different aspects of echolocation signals.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나, 많은 다른 포유류들과 달리, 돌고래는 반향 정위 신호들의 서로 다른 측면들을 처리하는 것에 사용되는 개별 구역들을 가진 고도로 특화된 청각 피질을 가지고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 돌고래의 \u003cb class=\"key\">청각 \u003c/b>\u003cb class=\"key\">피질\u003c/b>이 다른 포유류와 어떻게 다른지 핵심 차이점을 설명하는 문장입니다. 반향 정위의 여러 측면을 처리하기 위해 뇌의 \u003cb class=\"key\">개별 \u003c/b>\u003cb class=\"key\">구역\u003c/b>들이 세분화되어 역할을 나누어 맡고 있다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구 후치 수식 및 전치사 to\u003c/span> : 명사(distinct areas) + [과거분사(dedicated) + 전치사(to) + 동명사(processing)] : \"처리하는 것에 사용되는\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"However, unlike many other mammals, 그러나, 많은 다른 포유류들과 달리. dolphins have, 돌고래는 가지고 있다. a highly specialized auditory cortex, 고도로 특화된 청각 피질을. with distinct areas, 개별 구역들을 가진. dedicated to processing, 처리하는 것에 사용되는. different aspects of echolocation signals, 반향 정위 신호들의 서로 다른 측면들을. 이 문장 전체를 해석하면, 그러나, 많은 다른 포유류들과 달리, 돌고래는 반향 정위 신호들의 서로 다른 측면들을 처리하는 것에 사용되는 개별 구역들을 가진 고도로 특화된 청각 피질을 가지고 있다.","hl":"m"},{"n":22,"text":"이 문장은 돌고래의 뇌가 다른 동물들과 어떻게 다른지 핵심을 짚어주고 있어요. 돌고래의 청각 피질은 반향 정위의 여러 측면을 처리하기 위해 각각의 개별 구역들이 역할을 세분화해서 나누어 맡고 있다는 점을 강조하죠.","hl":"mn"},{"n":23,"text":"어법 포인트를 살펴볼게요. dedicated to processing을 주의해서 보세요. 명사인 areas 뒤에서 꾸며주는 과거분사구인데요. be dedicated to라는 표현에서 to는 부정사가 아니라 전치사예요. 그래서 뒤에 동사원형이 아니라 동명사인 processing이 와야 한다는 점, 시험에 아주 잘 나오니까 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 구역들은 담당할지도 모른다\u003c/span>\u003cspan class=\"en\">Some areas may be responsible for\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반사파들의 타이밍을 분석하는 것을,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">analyzing\u003c/span> the timing of echoes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한편으로는 다른 구역들은 초점을 맞춘다\u003c/span>\u003cspan class=\"en\">while others focus on\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소리의 주파수 성분 또는 강도에.\u003c/span>\u003cspan class=\"en\">the frequency content or the intensity of the sound.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어떤 구역들은 반사파들의 타이밍을 분석하는 것을 담당할지도 모르지만 한편으로는 다른 구역들은 소리의 주파수 성분 또는 강도에 초점을 맞춘다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급된 개별 구역들이 구체적으로 어떻게 역할을 분담하는지 보여주는 \u003cb class=\"key\">부연 \u003c/b>\u003cb class=\"key\">설명\u003c/b>입니다. 어떤 구역은 타이밍을, 또 다른 구역은 주파수나 강도를 분석하는 식으로 \u003cb class=\"key\">역할 \u003c/b>\u003cb class=\"key\">분담\u003c/b>이 이루어짐을 구체화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사의 목적어\u003c/span> : 전치사(for) + [동명사(analyzing)] : \"분석하는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">부정대명사 상관 접속\u003c/span> : Some + 복수명사 ~, while others(other + 복수명사) ~ : \"어떤 구역들은 ~하지만 한편으로는 다른 구역들은 ~\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Some areas may be responsible for, 어떤 구역들은 담당할지도 모른다. analyzing the timing of echoes, 반사파들의 타이밍을 분석하는 것을. while others focus on, 한편으로는 다른 구역들은 초점을 맞춘다. the frequency content or the intensity of the sound, 소리의 주파수 성분 또는 강도에.. 이 문장 전체를 해석하면, 어떤 구역들은 반사파들의 타이밍을 분석하는 것을 담당할지도 모르지만 한편으로는 다른 구역들은 소리의 주파수 성분 또는 강도에 초점을 맞춘다.","hl":"m"},{"n":25,"text":"앞 문장에서 개별 구역들이 역할을 나눈다고 했죠? 이 문장은 그 역할 분담이 구체적으로 어떻게 이루어지는지 부연 설명하고 있어요. 어떤 구역은 타이밍을 맡고, 다른 구역은 주파수나 강도를 분석한다는 식으로요.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 Some areas와 while others의 연결 고리예요. 여러 개 중에서 일부는 이러하고 다른 일부는 저러하다고 대비할 때 쓰는 부정대명사 패턴이죠. 두 번째로 analyzing을 볼까요? be responsible for에서 for는 전치사니까 당연히 그 뒤에는 전치사의 목적어 역할을 할 수 있도록 동명사 형태가 와야 한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 특화는 해 준다\u003c/span>\u003cspan class=\"en\">This specialization \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">allows \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌고래의 뇌가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">dolphin's \u003c/span>\u0 ext":"첫 번째 포인트는 allows the dolphin's brain to process 부분이에요. 동사 allow는 목적어가 어떤 동작을 하게 해준다고 할 때 목적격 보어로 반드시 to부정사를 써야 하는 대표적인 5형식 동사랍니다. 그래서 to process가 왔죠. 두 번째로 in parallel과 sequentially를 보세요. rather than을 사이에 두고 병렬로라는 뜻의 전치사구와 순차적으로라는 뜻의 부사가 의미상 팽팽하게 대조를 이루고 있다는 점을 알아두시면 해석이 훨씬 매끄러워집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공장 조립 라인을 상상해 보면,\u003c/span>\u003cspan class=\"en\">Imagine a factory assembly line\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그곳에서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">where\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로 다른 노동자들이 담당한다\u003c/span>\u003cspan class=\"en\">different workers are responsible for\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로 다른 과업들을.\u003c/span>\u003cspan class=\"en\">different tasks.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공장 조립 라인을 상상해 보면, 그곳에서는 서로 다른 노동자들이 서로 다른 과업들을 담당한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뇌의 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">처리\u003c/b> 과정을 공장의 \u003cb class=\"key\">조립 \u003c/b>\u003cb class=\"key\">라인\u003c/b>에 비유하여 쉽게 설명합니다. 서로 다른 뇌의 구역이 각자의 임무를 맡아 동시에 일한다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사의 계속적 용법\u003c/span> : [, + where (관계부사)] = [and + there] : \"그곳에서는\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Imagine a factory assembly line, 공장 조립 라인을 상상해 보면. where, 그곳에서는. different workers are responsible for, 서로 다른 노동자들이 담당한다. different tasks, 서로 다른 과업들을.. 이 문장 전체를 해석하면, 공장 조립 라인을 상상해 보면, 그곳에서는 서로 다른 노동자들이 서로 다른 과업들을 담당한다.","hl":"m \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 강조 및 병렬 구조\u003c/span> : [much (비교급 강조 부사)] + [비교급 and 비교급] : \"훨씬 더 빠르고 더 효율적으로\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"By dividing the work, 업무를 분담함으로써. among specialized areas, 특화된 구역들 사이에서. the brain can process information, 뇌는 정보를 처리할 수 있다. much faster and more efficiently, 훨씬 더 빠르고 더 효율적으로.. 이 문장 전체를 해석하면, 특화된 구역들 사이에서 업무를 분담함으로써, 뇌는 정보를 훨씬 더 빠르고 더 효율적으로 처리할 수 있다.","hl":"m"},{"n":34,"text":"앞서 말한 병렬 처리의 효과를 명확히 보여주는 문장입니다. 뇌가 각 구역에 일을 나누어 맡기면 정보를 얼마나 빠르고 효율적으로 처리할 수 있는지 그 장점을 짚어주고 있어요.","hl":"mn"},{"n":35,"text":"첫 번째로 by dividing을 볼까요? 전치사 by 뒤에는 동명사가 와서 수단이나 방법을 나타내요. 그래서 분담함으로써 라고 해석하죠. 두 번째로 much faster and more efficiently를 보면, 부사 much가 비교급들을 꾸며주면서 훨씬이라는 뜻으로 강조를 해주고 있어요. 그리고 and를 중심으로 faster와 more efficiently가 나란히 병렬 구조를 이루고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 병렬 처리는 줄인다\u003c/span>\u003cspan class=\"en\">This parallel processing reduces\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인지 부하를\u003c/span>\u003cspan class=\"en\">the cognitive load\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반향 정위와 연관된,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">associated \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">echolocation\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌고래들이 ~하게 해 준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">allowing \u003c/span>\u003cspan class=\"tgt\">dolphins \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠르게 반응하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">react\u003c/span> quickly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 환경에서의 변화들에.\u003c/span>\u003cspan class=\"en\">to changes in their environment.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 병렬 처리는 반향 정위와 연관된 인지 부하를 줄이고, 돌고래들이 자신의 환경에서의 변화들에 빠르게 반응하게 해 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 돌고래가 갖는 병렬 처리의 \u003cb class=\"key\">최종적인 \u003c/b>\u003cb class=\"key\">이점\u003c/b>을 결론짓는 문장입니다. 인지적 부담이 줄어들어 환경 변화에 \u003cb class=\"key\">빠르게 \u003c/b>\u003cb class=\"key\">대처\u003c/b>할 수 있다는 생존상의 유익을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구 후치 수식\u003c/span> : [명사] + [과거분사구] : \"반향 정위와 연관된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (5형식 동사 allow)\u003c/span> : [, + allowing (현재분사)] + [목적어] + [to부정사] : \"그리고 돌고래들이 반응하게 해 준다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"This parallel processing reduces, 이러한 병렬 처리는 줄인다. the cognitive load, 인지 부하를. associated with echolocation, 반향 정위와 연관된. allowing dolphins, 돌고래들이 ~하게 해 준다. to react quickly, 빠르게 반응하게. to changes in their environment, 자신의 환경에서의 변화들에.. 이 문장 전체를 해석하면, 이러한 병렬 처리는 반향 정위와 연관된 인지 부하를 줄이고, 돌고래들이 자신의 환경에서의 변화들에 빠르게 반응하게 해 준다.","hl":"m"},{"n":37,"text":"이 글의 결론에 해당하는 문장이에요. 돌고래가 가진 뇌의 병렬 처리 능력이 결국 뇌의 피로를 덜어주고, 그 덕분에 주변 환경이 변할 때 아주 신속하게 대처할 수 있다는 생존의 이점을 정리해 주고 있습니다.","hl":"mn"},{"n":38,"text":"첫 번째로 associated with 부분은 과거분사구예요. 앞에 있는 명사인 인지 부하를 뒤에서 꾸며주고 있는데, 인지 부하가 반향 정위와 연관되어 있다는 수동의 뜻을 가지죠. 두 번째로 콤마 뒤에 allowing이 나오는데요, 이건 결과를 나타내는 분사구문이에요. 그래서 그리고 해 준다 라고 자연스럽게 이어서 해석하면 됩니다. 또 동사 allow는 목적격 보어로 to부정사를 데리고 오기 때문에 돌고래 다음에 to react가 온 것도 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>돌고래는 \u003cb class=\"key\">반향 \u003c/b>\u003cb class=\"key\">정위\u003c/b>를 위해 에너지를 적게 쓰고 정보를 빠르게 처리하는 특화된 뇌 구역을 진화시켰습니다.\u003c/li>\u003cli>일반 포유류와 달리 돌고래의 \u003cb class=\"key\">청각 \u003c/b>\u003cb class=\"key\">피질\u003c/b>은 소리의 다양한 측면을 따로따로 분석하는 여러 개별 구역으로 나뉘어 있습니다.\u003c/li>\u003cli>이러한 뇌 구조는 공장 조립 라인처럼 정보를 순차적이 아닌 \u003cb class=\"key\">병렬로 \u003c/b>\u003cb class=\"key\">처리\u003c/b>할 수 있게 해 줍니다.\u003c/li>\u003cli>업무를 분담하는 병렬 처리는 \u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">부하\u003c/b>를 줄여 돌고래가 환경 변화에 빠르게 반응하도록 돕습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Dolphins utilize highly specialized auditory cortices for parallel processing of echolocation signals, increasing efficiency and reducing cognitive load.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">돌고래는 고도로 특화된 \u003cb class=\"key\">청각 \u003c/b>\u003cb class=\"key\">피질\u003c/b>을 통해 반향 정위 신호를 순차적이 아닌 \u003cb class=\"key\">병렬로 \u003c/b>\u003cb class=\"key\">처리\u003c/b>함으로써 인지 부하를 줄이고 효율적으로 환경에 반응합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"자, 이렇게 돌고래의 반향 정위와 병렬 처리 능력에 대한 지문을 모두 분석해 보았습니다. 돌고래가 복잡한 수중 환경에서 어떻게 그토록 빠르고 날렵하게 움직일 수 있는지 뇌 과학적인 원리로 이해할 수 있는 재미있는 글이었습니다. 노트 필기한 내용 꼼꼼히 복습하시고, 다음 시간에 밝은 모습으로 만나요!","hl":null}]}]});</script></body></html>
