lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 29번","audioDir":"29_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">29번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>High Early Mortality: The Historical Norm of Human Survival\u003c/h1>\u003ch2>높은 초기 사망률: 인류 생존의 역사적 표준\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>과거 인류는 자연 상태와 마찬가지로 \u003cb class=\"key\">유아 \u003c/b>\u003cb class=\"key\">사망률\u003c/b>이 매우 높았으며, 최근의 폭발적인 \u003cb class=\"key\">인구 \u003c/b>\u003cb class=\"key\">증가\u003c/b>는 이러한 높은 생존 허들을 극복한 결과이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Historically high early mortality rates kept human populations in check until recent centuries.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 살펴볼 지문은 과거 인류의 생존과 높은 유아 사망률에 대한 글입니다. 과거 인류는 자연 상태와 마찬가지로 유아 사망률이 매우 높았으며, 최근의 폭발적인 인구 증가는 이러한 높은 생존 허들을 극복한 결과라는 것이 전체 요약이에요. 영어 요지로는 Historically high early mortality rates kept human populations in check until recent centuries라고 할 수 있겠네요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">과거 인간의 삶은 척박한 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">상태(state \u003c/b>\u003cb class=\"key\">of \u003c/b>\u003cb class=\"key\">nature)\u003c/b>와 다르지 않았습니다. 영아 사망률(infant mortality rate)은 태어난 아기가 1년 안에 사망하는 비율을 뜻하는데, 전근대 사회에서는 이 수치가 매우 높았습니다. 마치 100명을 뽑는 오디션 프로그램에서 \u003cb class=\"key\">1차 \u003c/b>\u003cb class=\"key\">예선\u003c/b>에 70명이 탈락하는 것과 같은 이치입니다. 수많은 씨앗 중 극소수만 나무로 자라듯, 인류의 조상들도 질병이나 포식자 등 수많은 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">허들(survival \u003c/b>\u003cb class=\"key\">hurdles)\u003c/b>을 넘어야 했습니다. 19세기 이후 의학과 농업의 발달로 이 허들이 낮아지면서, 오늘날 우리가 아는 폭발적인 \u003cb class=\"key\">인구 \u003c/b>\u003cb class=\"key\">증가(population \u003c/b>\u003cb class=\"key\">growth)\u003c/b>가 일어난 것입니다.\u003c/div>","segs":[{"n":2,"text":"과거 인간의 삶은 척박한 자연 상태와 다르지 않았습니다. 영아 사망률은 태어난 아기가 일 년 안에 사망하는 비율을 뜻하는데, 전근대 사회에서는 이 수치가 매우 높았습니다. 마치 백 명을 뽑는 오디션 프로그램에서 일차 예선에 칠십 명이 탈락하는 것과 같은 이치입니다. 수많은 씨앗 중 극소수만 나무로 자라듯, 인류의 조상들도 질병이나 포식자 등 수많은 생존 허들을 넘어야 했습니다. 십구 세기 이후 의학과 농업의 발달로 이 허들이 낮아지면서, 오늘날 우리가 아는 폭발적인 인구 증가가 일어난 것입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입\u003csmall>비유를 통한 상황 제시 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>생존은 매년 뛰어넘어야 하는 \u003cb class=\"key\">허들\u003c/b>과 같았으며, 초기에는 이 허들이 너무 높아 많은 사람이 일찍 목숨을 잃었다고 비유적으로 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>통념/원리\u003csmall>자연의 일반적 원리 제시 · 문장 3\u003c/small>\u003c/h4>\u003cp>인류는 과거 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에 가깝게 살았고, 자연은 본래 생명을 극도로 \u003cb class=\"key\">낭비\u003c/b>하는 속성을 지닌다는 점을 지적합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>예시\u003csmall>자연과 인간의 비교 예시 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>무화과 씨앗이나 개코원숭이의 사례처럼 영장류의 \u003cb class=\"key\">초기 \u003c/b>\u003cb class=\"key\">사망률\u003c/b>은 높았으며, 전근대 농업 사회의 인간 역시 유인원과 비슷하거나 더 높은 \u003cb class=\"key\">유아 \u003c/b>\u003cb class=\"key\">사망률\u003c/b>을 겪었음을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>부연\u003csmall>수렵 채집 사회로의 확장 · 문장 7\u003c/small>\u003c/h4>\u003cp>우리의 수렵 채집 조상들 역시 첫 생일이나 \u003cb class=\"key\">번식기\u003c/b>에 도달하기 전 절반가량이 사망하는 척박한 환경에서 살았음을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>결론\u003csmall>가정을 통한 결과 도출 · 문장 8\u003c/small>\u003c/h4>\u003cp>과거의 이런 높은 사망률이 아니었다면, 오늘날과 같은 거대한 \u003cb class=\"key\">인구 \u003c/b>\u003cb class=\"key\">증가\u003c/b>는 훨씬 더 일찍 일어났을 것이라며 역사적 맥락을 정리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 자연계의 원리가 과거 인간에게 어떻게 적용되었는지 예시를 통해 단계적으로 보여주고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입입니다. 생존은 매년 뛰어넘어야 하는 허들과 같았으며, 초기에는 이 허들이 너무 높아 많은 사람이 일찍 목숨을 잃었다고 이야기합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 통념과 원리입니다. 인류는 자연 상태에 가깝게 살았고, 자연은 본래 생명을 극도로 낭비하는 속성을 지닌다고 설명하죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 예시입니다. 무화과 씨앗이나 개코원숭이의 사례처럼 영장류의 초기 사망률은 높았으며, 전근대 농업 사회의 인간 역시 유인원과 비슷하거나 더 높은 유아 사망률을 겪었다는 점을 보여줍니다.","hl":"f2"},{"n":7,"text":"네 번째 단계는 부연 설명입니다. 우리의 수렵 채집 조상들 역시 첫 생일이나 번식기에 도달하기 전 절반가량이 사망하는 척박한 환경에서 살았음을 강조합니다.","hl":"f3"},{"n":8,"text":"다섯 번째 단계는 결론입니다. 과거의 이런 높은 사망률이 아니었다면, 오늘날과 같은 거대한 인구 증가는 훨씬 더 일찍 일어났을 것이라며 글을 맺습니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-예시\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부에서 과거 인류의 생존을 높은 \u003cb class=\"key\">허들\u003c/b>에 비유하며 주제를 제시합니다. 이후 무화과, 개코원숭이, 유인원, 수렵 채집 조상 등 다양한 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 통해 자연과 인간의 높은 \u003cb class=\"key\">초기 \u003c/b>\u003cb class=\"key\">사망률\u003c/b>을 증명합니다. 마지막 문장에서 이러한 역사적 사실이 최근의 폭발적인 \u003cb class=\"key\">인구 \u003c/b>\u003cb class=\"key\">증가\u003c/b>를 설명하는 핵심 이유임을 밝히며 글을 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Demographically (3)\u003c/b>\u003cspan>관점의 전환 및 개념 확장\u003c/span>\u003cb>which is fairly typical (5)\u003c/b>\u003cspan>일반화 및 부연 설명\u003c/span>\u003cb>Had it been otherwise (8)\u003c/b>\u003cspan>과거 사실의 반대 가정 및 결론 유도\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a race in which a hurdle has to be jumped\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">wasteful of life\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">die before they are a year old\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Infant mortality rates\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">failed to reach their first birthday\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">didn't live long enough to reproduce\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>과거 인류 (19세기 이전)\u003c/th>\u003cth>최근 인류\u003c/th>\u003c/tr>\u003ctr>\u003ctd>자연 상태에 가깝게 삶\u003c/td>\u003ctd>생존 허들을 극복함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>매우 높은 유아 및 초기 사망률\u003c/td>\u003ctd>상대적으로 낮은 유아 사망률\u003c/td>\u003c/tr>\u003ctr>\u003ctd>인구 증가가 거의 없었음\u003c/td>\u003ctd>거대한 인구 증가 발생\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 양괄식 구조와 주장 뒤에 예시가 따르는 전개 방식을 취하고 있습니다. 글의 초반부에서 과거 인류의 생존을 높은 허들에 비유하며 주제를 제시하죠. 이후 무화과, 개코원숭이, 유인원, 수렵 채집 조상 등 다양한 구체적 예시를 통해 자연과 인간의 높은 초기 사망률을 증명합니다. 마지막 문장에서 이러한 역사적 사실이 최근의 폭발적인 인구 증가를 설명하는 핵심 이유임을 밝히며 글을 마무리하는 훌륭한 구조입니다.","hl":"ty"},{"n":10,"text":"구조를 짚어볼 수 있는 신호어들을 살펴볼까요. 세 번째 문장의 Demographically, 즉 인구 통계학적으로라는 표현은 자연 상태로 논의를 확장하는 역할을 합니다. 또한 마지막 문장의 Had it been otherwise, 즉 만약 그렇지 않았더라면 이라는 가정법 표현은 과거의 높은 사망률이라는 사실을 뒤집어 생각하게 하며, 최근의 인구 증가가 예외적인 사건임을 강렬하게 전달하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>survival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생존\u003c/span>\u003c/div>\u003cdiv>\u003cb>hurdle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장애물, 허들\u003c/span>\u003c/div>\u003cdiv>\u003cb>clear\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뛰어넘다, 통과하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>demographically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>인구 통계학적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>humankind\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인류\u003c/span>\u003c/div>\u003cdiv>\u003cb>state of nature\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>자연 상태\u003c/span>\u003c/div>\u003cdiv>\u003cb>extremely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>극도로\u003c/span>\u003c/div>\u003cdiv>\u003cb>wasteful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>낭비하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>fig\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무화과\u003c/span>\u003c/div>\u003cdiv>\u003cb>seed\u003c/b>\u003cem>명사\u003c/em>\u003cspan>씨앗\u003c/span>\u003c/div>\u003cdiv>\u003cb>baboon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개코원숭이\u003c/span>\u003c/div>\u003cdiv>\u003cb>wild\u003c/b>\u003cem>명사\u003c/em>\u003cspan>야생\u003c/span>\u003c/div>\u003cdiv>\u003cb>fairly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>상당히, 꽤\u003c/span>\u003c/div>\u003cdiv>\u003cb>typical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전형적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>primate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영장류\u003c/span>\u003c/div>\u003cdiv>\u003cb>infant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유아\u003c/span>\u003c/div>\u003cdiv>\u003cb>mortality rate\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>사망률\u003c/span>\u003c/div>\u003cdiv>\u003cb>pre-modern\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전근대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>agricultural\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>농업의\u003c/span>\u003c/div>\u003cdiv>\u003cb>society\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회\u003c/span>\u003c/div>\u003cdiv>\u003cb>similar\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비슷한\u003c/span>\u003c/div>\u003cdiv>\u003cb>ape\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유인원\u003c/span>\u003c/div>\u003cdiv>\u003cb>ancestor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조상\u003c/span>\u003c/div>\u003cdiv>\u003cb>hunter-gatherer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수렵 채집인\u003c/span>\u003c/div>\u003cdiv>\u003cb>reproduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>번식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>otherwise\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그렇지 않았다면\u003c/span>\u003c/div>\u003cdiv>\u003cb>huge\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한, 엄청난\u003c/span>\u003c/div>\u003cdiv>\u003cb>recent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최근의\u003c/span>\u003c/div>\u003cdiv>\u003cb>growth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성장, 증가\u003c/span>\u003c/div>\u003cdiv>\u003cb>occur\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일어나다, 발생하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 단어 몇 가지를 짚어볼게요. hurdle은 우리가 아는 장애물이나 생존의 난관을 뜻합니다. mortality rate는 사망률이라는 뜻으로, 인구 변화를 다루는 지문에서 아주 자주 나오는 표현이니 꼭 외워두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">survival\u003c/b>\u003cspan class=\"m\">생존\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">existence\u003c/span>\u003cspan class=\"s\">living\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">death\u003c/span>\u003cspan class=\"a\">extinction\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">wasteful\u003c/b>\u003cspan class=\"m\">낭비하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lavish\u003c/span>\u003cspan class=\"s\">prodigal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">thrifty\u003c/span>\u003cspan class=\"a\">economical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">typical\u003c/b>\u003cspan class=\"m\">전형적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">standard\u003c/span>\u003cspan class=\"s\">normal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unusual\u003c/span>\u003cspan class=\"a\">abnormal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">infant\u003c/b>\u003cspan class=\"m\">유아\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">baby\u003c/span>\u003cspan class=\"s\">toddler\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">adult\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mortality\u003c/b>\u003cspan class=\"m\">사망\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">death\u003c/span>\u003cspan class=\"s\">fatality\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">birth\u003c/span>\u003cspan class=\"a\">life\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reproduce\u003c/b>\u003cspan class=\"m\">번식하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">breed\u003c/span>\u003cspan class=\"s\">multiply\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">huge\u003c/b>\u003cspan class=\"m\">거대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enormous\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">small\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"시험에 잘 나오는 어휘의 동의어와 반의어도 정리해봅시다. wasteful, 즉 낭비하는 이라는 단어는 lavish나 prodigal이라는 단어로 바꿔 쓸 수 있고, 반대말로는 검소한 이라는 뜻의 thrifty나 economical이 있습니다. typical, 즉 전형적인 은 standard나 normal과 결을 같이 하며, 반의어로는 unusual이 있겠죠. 번식하다는 뜻의 reproduce는 breed나 multiply로 흔히 대체되니 함께 알아두시면 좋습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 생존을 생각할지도 모른다\u003c/span>\u003cspan class=\"en\">You might \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">think \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">survival \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경주라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">race\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 안에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">which\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하나의 허들을 뛰어넘어야 하는\u003c/span>\u003cspan class=\"en\">a hurdle \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">jumped\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매년.\u003c/span>\u003cspan class=\"en\">every year.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 생존을 매년 하나의 허들을 뛰어넘어야 하는 경주라고 생각할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 생존을 매년 극복해야 하는 장애물 경주에 비유하여 \u003cb class=\"key\">생존의 \u003c/b>\u003cb class=\"key\">어려움\u003c/b>을 설명하는 도입부입니다. 여기서 허들은 생명을 위협하는 \u003cb class=\"key\">자연적 \u003c/b>\u003cb class=\"key\">위협\u003c/b>을 의미합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사를 동반하는 타동사 구문 (think of A as B)\u003c/span> : think of [목적어] + as [명사] : \"생존을 경주라고 생각하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 관계대명사\u003c/span> : in [전치사] + which [목적격 관계대명사] : \"그(경주) 안에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사의 수동태\u003c/span> : has to [조동사] + be p.p [수동태] : \"뛰어넘어져야 한다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"You might think of survival, 여러분은 생존을 생각할지도 모른다. as a race, 경주라고. in which, 그 안에서. a hurdle has to be jumped, 하나의 허들을 뛰어넘어야 하는. every year, 매년.. 이 문장 전체를 해석하면, 여러분은 생존을 매년 하나의 허들을 뛰어넘어야 하는 경주라고 생각할지도 모른다.","hl":"m"},{"n":14,"text":"이 문장은 생존을 매년 극복해야 하는 장애물 경주에 비유해서 생존의 어려움을 설명하는 도입부예요. 여기서 허들은 생명을 위협하는 자연적 위협을 의미한답니다.","hl":"mn"},{"n":15,"text":"첫 번째로 think of A as B 구문을 사용해서 생존이라는 개념을 장애물 경주라는 비유적 표현으로 나타내고 있어요. 두 번째로 전치사 in과 관계대명사 which가 결합해서 선행사인 a race를 꾸며주고 있죠. 이 전치사 더하기 관계대명사 뒤에는 완전한 문장이 온답니다. 세 번째로 has to be jumped 부분을 볼게요. 허들이 스스로 뛰는 것이 아니라 사람에 의해 뛰어넘어지는 대상이기 때문에 수동태 형태가 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">초기의 허들은 한때 매우 높았고,\u003c/span>\u003cspan class=\"en\">The early hurdles were once very high,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 사람들은 넘어졌다\u003c/span>\u003cspan class=\"en\">and many people fell\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">넘기 전에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">clearing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">처음 몇 개를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">first \u003c/span>\u003cspan class=\"tgt\">few\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">초기의 허들은 한때 매우 높았고, 많은 사람들은 처음 몇 개를 넘기 전에 넘어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거에는 생존을 위협하는 요소들이 너무 강력해서 어릴 때 사망하는 비율이 높았음을 \u003cb class=\"key\">초기 \u003c/b>\u003cb class=\"key\">허들\u003c/b>이라는 비유로 표현하고 있습니다. 이는 과거 인류의 \u003cb class=\"key\">높은 \u003c/b>\u003cb class=\"key\">사망률\u003c/b>을 의미합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사/접속사 + 동명사/분사구문\u003c/span> : before [전치사/접속사] + clearing [동명사/현재분사] : \"넘기 전에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사의 명사 생략\u003c/span> : the first few + (hurdles) : \"처음 몇 개를\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"The early hurdles were once very high, 초기의 허들은 한때 매우 높았고. and many people fell, 많은 사람들은 넘어졌다. before clearing, 넘기 전에. the first few, 처음 몇 개를.. 이 문장 전체를 해석하면, 초기의 허들은 한때 매우 높았고, 많은 사람들은 처음 몇 개를 넘기 전에 넘어졌다.","hl":"m"},{"n":17,"text":"과거에는 생존을 위협하는 요소들이 너무 강력해서 유아기나 아동기 때 사망하는 비율이 높았다는 것을 초기 허들이라는 비유로 표현하고 있어요. 이는 과거 인류의 높은 사망률을 의미하죠.","hl":"mn"},{"n":18,"text":"첫 번째로 before clearing을 살펴볼까요. 시간의 부사절을 이끄는 접속사 before 뒤에 주어가 생략되고 동사에 ing를 붙인 분사구문으로 볼 수도 있고, before를 전치사로 보아 동명사가 온 것으로 볼 수도 있어요. 두 번째로 the first few는 few 뒤에 복수 명사인 hurdles가 생략된 형태로, 생애 초기의 몇몇 장애물들을 뜻한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인구 통계학적으로,\u003c/span>\u003cspan class=\"en\">Demographically,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인류는 살았었고\u003c/span>\u003cspan class=\"en\">humankind was \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">living \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자연 상태에 가깝게,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">close \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> a state of nature,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 자연은\u003c/span>\u003cspan class=\"en\">and nature is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생명을 극도로 낭비한다.\u003c/span>\u003cspan class=\"en\">extremely \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">wasteful \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> life.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">인구 통계학적으로, 인류는 자연 상태에 가깝게 살았었고, 자연은 생명을 극도로 낭비한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거 인류는 문명의 보호 없이 가혹한 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">상태\u003c/b>에 노출되어 있었으며, 자연의 섭리상 수많은 생명이 태어나더라도 살아남는 수는 극히 적다는 \u003cb class=\"key\">자연의 \u003c/b>\u003cb class=\"key\">속성\u003c/b>을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 동사 수식 및 전치사구\u003c/span> : living [현재분사] + close [부사] + to [전치사] : \"~에 가깝게 살고 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 + 전치사\u003c/span> : wasteful [형용사] + of [전치사] : \"~을 낭비하는\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Demographically, 인구 통계학적으로. humankind was living, 인류는 살았었고. close to a state of nature, 자연 상태에 가깝게. and nature is, 그리고 자연은. extremely wasteful of life, 생명을 극도로 낭비한다.. 이 문장 전체를 해석하면, 인구 통계학적으로, 인류는 자연 상태에 가깝게 살았었고, 자연은 생명을 극도로 낭비한다.","hl":"m"},{"n":20,"text":"과거 인류는 문명의 보호 없이 가혹한 자연 상태에 노출되어 있었다는 말이에요. 자연의 섭리상 수많은 생명이 태어나더라도 살아남는 수는 극히 적다는 자연의 속성을 잘 설명해주는 문장이랍니다.","hl":"mn"},{"n":21,"text":"첫 번째로 close to를 볼게요. close는 여기서 부사로 쓰여서 동사 living을 꾸며주고, 전치사 to와 함께 쓰여 가까운 상태를 나타내고 있어요. 두 번째로 wasteful of는 wasteful 뒤에 전치사 of를 써서 생명을 낭비한다는 그 낭비의 대상을 구체적으로 밝혀주고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">극소수의 무화과로부터 나오는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">From \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">number \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">figs \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 씨앗들 중 단 하나만이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">many \u003c/span>\u003cspan class=\"tgt\">seeds \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무화과 나무가 될 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">become\u003c/span> a fig tree.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">극소수의 무화과로부터 나오는 많은 씨앗들 중 단 하나만이 무화과 나무가 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 자연이 생명을 유지하는 데 얼마나 소모적인지를 보여주는 구체적인 \u003cb class=\"key\">예시\u003c/b>입니다. 수많은 씨앗 중에서 오직 소수만이 나무로 자란다는 점을 통해 자연 생태계의 \u003cb class=\"key\">가혹함\u003c/b>을 강조하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 강조로 인한 주어-동사 도치\u003c/span> : [전치사구] + [조동사(will)] + [주어(even one of many seeds)] + [본동사(become)] : \"극소수의 무화과로부터 나오는 많은 씨앗들 중 단 하나만이 무화과 나무가 될 것이다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"From only a very small number of figs, 극소수의 무화과로부터 나오는. will even one of many seeds, 많은 씨앗들 중 단 하나만이. become a fig tree, 무화과 나무가 될 것이다.. 이 문장 전체를 해석하면, 극소수의 무화과로부터 나오는 많은 씨앗들 중 단 하나만이 무화과 나무가 될 것이다.","hl":"m"},{"n":23,"text":"이 문장은 바로 앞 문장에서 말한 자연이 생명을 낭비한다는 것에 대한 구체적인 예시를 들고 있어요. 수많은 씨앗 중에 겨우 하나만 나무로 자란다는 걸 보여주면서 자연 생태계의 가혹함을 강조하고 있는 거죠.","hl":"mn"},{"n":24,"text":"여기서 아주 중요한 어법이 나오는데요. 첫 번째로 살펴볼 부분은 문장 맨 앞에 나온 전치사구입니다. From only a very small number of figs라는 전치사구가 문장 맨 앞으로 강조되어 튀어나오면서 뒤에 주어와 동사의 어순이 뒤집혔어요. 그래서 주어인 even one of many seeds 앞에 조동사 will이 먼저 나온 도치 구문이 쓰였습니다. 서술형으로 나오기 딱 좋은 구조니까 꼭 암기해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개코원숭이의 거의 4분의 1이\u003c/span>\u003cspan class=\"en\">Almost a quarter of baboons\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야생에서 태어난\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">born \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">wild\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 살이 되기 전에 죽는데,\u003c/span>\u003cspan class=\"en\">die before they are a year old\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 꽤 전형적이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">which\u003c/span> is fairly typical\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영장류에게\u003c/span>\u003cspan class=\"en\">for primates.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">야생에서 태어난 개코원숭이의 거의 4분의 1이 한 살이 되기 전에 죽는데, 이것은 영장류에게 꽤 전형적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자연의 가혹함이 식물을 넘어 영장류인 개코원숭이에게도 적용됨을 보여주는 두 번째 \u003cb class=\"key\">예시\u003c/b>입니다. 높은 유아 사망률이 영장류 사이에서 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">현상\u003c/b>임을 설명하여 생존의 어려움을 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 명사 수식\u003c/span> : 명사(baboons) + [과거분사(born)] + 전치사구(in the wild) : \"야생에서 태어난\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사의 계속적 용법\u003c/span> : 콤마(,) + 주격 관계대명사(which) : \"그리고 이것은 ~하다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Almost a quarter of baboons, 개코원숭이의 거의 4분의 1이. born in the wild, 야생에서 태어난. die before they are a year old, 한 살이 되기 전에 죽는데. which is fairly typical, 이것은 꽤 전형적이다. for primates, 영장류에게. 이 문장 전체를 해석하면, 야생에서 태어난 개코원숭이의 거의 4분의 1이 한 살이 되기 전에 죽는데, 이것은 영장류에게 꽤 전형적이다.","hl":"m"},{"n":26,"text":"무화과나무에 이어서 이번에는 영장류인 개코원숭이의 예시를 들고 있어요. 태어난 지 일 년도 안 돼서 많이 죽는다는 건데, 이게 영장류 전체에서 나타나는 일반적인 현상이라는 걸 말해주면서 생존이 쉽지 않음을 뒷받침합니다.","hl":"mn"},{"n":27,"text":"어법 포인트 짚어볼게요. 첫 번째로 born in the wild는 앞에 있는 명사 baboons를 꾸며주는 과거분사구예요. 원숭이가 스스로 낳는 게 아니라 태어나는 거니까 수동의 의미를 지닌 과거분사 born을 썼죠. 두 번째로 콤마 뒤에 나오는 which를 보세요. 이건 주격 관계대명사의 계속적 용법인데요, 여기서 선행사는 앞에 있는 명사 하나가 아니라 앞 문장 전체의 내용이랍니다. 한 살 전에 많이 죽는다는 그 사실 자체가 전형적이라는 뜻이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 유아 사망률은\u003c/span>\u003cspan class=\"en\">Infant mortality rates for humans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전근대 농업 사회에서\u003c/span>\u003cspan class=\"en\">in pre­modern agricultural societies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비슷했고, 때로는 더 높았다\u003c/span>\u003cspan class=\"en\">were \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">similar \u003c/span>\u003cspan class=\"tgt\">to, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">sometimes \u003c/span>\u003cspan class=\"tgt\">higher, \u003c/span>\u003cspan class=\"tgt\">than\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유인원의 그것과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">apes\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전근대 농업 사회에서 인간의 유아 사망률은 유인원의 그것과 비슷했고, 때로는 더 높았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 영장류의 높은 유아 사망률이 과거 \u003cb class=\"key\">인간\u003c/b>에게도 마찬가지였다는 점을 밝히는 문장입니다. 인류 역시 자연의 상태와 다를 바 없는 생존의 \u003cb class=\"key\">어려움\u003c/b>을 겪었음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교 구문의 병렬 연결\u003c/span> : [similar to] and [sometimes higher than] + 공통 목적어(those of apes) : \"~와 비슷했고, 때로는 ~보다 더 높았다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시대명사 those\u003c/span> : 지시대명사(those) + 수식어구(of apes) : \"유인원의 그것(유아 사망률)\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Infant mortality rates for humans, 인간의 유아 사망률은. in pre­modern agricultural societies, 전근대 농업 사회에서. were similar to, and sometimes higher, than, 비슷했고, 때로는 더 높았다. those of apes, 유인원의 그것과. 이 문장 전체를 해석하면, 전근대 농업 사회에서 인간의 유아 사망률은 유인원의 그것과 비슷했고, 때로는 더 높았다.","hl":"m"},{"n":29,"text":"영장류 이야기를 하다가 이제 드디어 인간으로 넘어왔습니다. 옛날 농경 사회에 살던 인간들도 결국 유인원들처럼 유아 사망률이 엄청나게 높았다는 거예요. 인간도 혹독한 자연의 일부로서 생존의 어려움을 겪었다는 맥락입니다.","hl":"mn"},{"n":30,"text":"문법 설명해 드릴게요. 첫 번째 포인트는 맨 끝에 있는 those입니다. 영어는 똑같은 단어 반복하는 걸 정말 싫어하잖아요? 여기서 those는 앞에 나온 유아 사망률, 즉 infant mortality rates를 대신 받는 대명사예요. rates가 복수니까 that이 아니라 복수형 those를 썼다는 거 꼭 기억하세요. 두 번째로 similar to와 higher than이 and를 중심으로 병렬로 연결되어 있는데요, 이 두 표현이 뒤에 있는 those of apes라는 공통의 대상을 함께 취하고 있는 재미있는 구조랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사정은 별로 나을 것이 없었는데,\u003c/span>\u003cspan class=\"en\">Things were \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">little \u003c/span>\u003cspan class=\"tgt\">better\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 수렵 채집 조상들에게도,\u003c/span>\u003cspan class=\"en\">for our hunter­gatherer ancestors\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 중 4분의 1이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">quarter \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">whom\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 첫 번째 생일에 이르지 못했고,\u003c/span>\u003cspan class=\"en\">failed to reach their first birthday,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면에 또 다른 4분의 1은\u003c/span>\u003cspan class=\"en\">while another quarter\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자손을 낳을 만큼 충분히 오래 살지 못했다\u003c/span>\u003cspan class=\"en\">didn't live \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reproduce\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">19세기까지 거의 모든 곳에서\u003c/span>\u003cspan class=\"en\">just about everywhere until the nineteenth century.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 수렵 채집 조상들에게도 사정은 별로 나을 것이 없었는데, 그들 중 4분의 1이 자신들의 첫 번째 생일에 이르지 못했고, 19세기까지 거의 모든 곳에서 또 다른 4분의 1은 자손을 낳을 만큼 충분히 오래 살지 못했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이전 문장에서 언급된 높은 유아 사망률이 \u003cb class=\"key\">수렵 \u003c/b>\u003cb class=\"key\">채집 \u003c/b>\u003cb class=\"key\">조상\u003c/b>들에게도 동일하게 적용되었음을 설명합니다. 자연 상태에서 인류가 겪은 \u003cb class=\"key\">생존의 \u003c/b>\u003cb class=\"key\">어려움\u003c/b>이 19세기 전까지 전 세계적으로 지속되었음을 강조하는 핵심 근거입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정어 little\u003c/span> : little + 비교급 : \"별로 나을 것이 없었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법 (부분사 + of + 관계대명사)\u003c/span> : ,(콤마) + 부분사(a quarter) + of + whom(목적격 관계대명사) : \"그들 중 4분의 1이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사/부사 + enough to 부정사\u003c/span> : 형용사/부사(long) + enough + to부정사(to reproduce) : \"자손을 낳을 만큼 충분히 오래\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Things were little better, 사정은 별로 나을 것이 없었는데. for our hunter­gatherer ancestors, 우리의 수렵 채집 조상들에게도. a quarter of whom, 그들 중 4분의 1이. failed to reach their first birthday, 자신들의 첫 번째 생일에 이르지 못했고. while another quarter, 반면에 또 다른 4분의 1은. didn't live long enough to reproduce, 자손을 낳을 만큼 충분히 오래 살지 못했다. just about everywhere until the nineteenth century, 19세기까지 거의 모든 곳에서. 이 문장 전체를 해석하면, 우리의 수렵 채집 조상들에게도 사정은 별로 나을 것이 없었는데, 그들 중 4분의 1이 자신들의 첫 번째 생일에 이르지 못했고, 19세기까지 거의 모든 곳에서 또 다른 4분의 1은 자손을 낳을 만큼 충분히 오래 살지 못했다.","hl":"m"},{"n":32,"text":"이전 문장들에서 말한 높은 유아 사망률이 수렵 채집 조상들에게도 똑같이 적용되었다는 내용이에요. 자연 상태에서는 생존의 어려움이 얼마나 컸는지를 보여주며, 19세기 전까지는 인류 전체가 높은 사망률을 겪었음을 꼼꼼하게 설명해 주고 있죠.","hl":"mn"},{"n":33,"text":"첫 번째로 little better를 볼게요. 여기서 little은 부정어예요. 그래서 사정이 거의 낫지 않았다고 부정으로 해석해야 하죠. 두 번째로 콤마 뒤에 나온 a quarter of whom이 중요해요. 여기서 whom은 접속사 플러스 대명사인 and them의 역할을 동시에 수행하는 관계대명사랍니다. 내신 서술형에 아주 자주 나오는 형태니 꼭 기억하세요. 세 번째로 long enough to reproduce를 볼까요. 형용사나 부사 뒤에 enough to가 붙어서 자손을 낳을 만큼 충분히 오래라는 의미를 만듭니다. 어순에 꼭 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그렇지 않았더라면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Had \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">otherwise,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최근의 엄청난 인구 증가는\u003c/span>\u003cspan class=\"en\">the huge recent growth in human population\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일어났었을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">occurred\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 일찍.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">earlier\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 그렇지 않았더라면, 최근의 엄청난 인구 증가는 훨씬 더 일찍 일어났었을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 만약 과거에 인류의 생존율이 높았다면 폭발적인 인구 증가가 일찍 시작되었을 것이라는 의미입니다. \u003cb class=\"key\">가정법 \u003c/b>\u003cb class=\"key\">과거완료\u003c/b>를 사용하여, 높은 사망률로 인해 역사적으로 \u003cb class=\"key\">인구 \u003c/b>\u003cb class=\"key\">성장 \u003c/b>\u003cb class=\"key\">지연\u003c/b>이 발생했다는 사실을 극적으로 결론짓고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거완료 (if 생략 도치)\u003c/span> : Had + 주어(it) + p.p(been) ~ : \"만약 그렇지 않았더라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가정법 과거완료 주절\u003c/span> : 조동사 과거형(would) + have + p.p(occurred) : \"일어났었을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">비교급 강조 부사\u003c/span> : 비교급 강조 부사(much) + 비교급(earlier) : \"훨씬 더 일찍\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Had it been otherwise, 만약 그렇지 않았더라면. the huge recent growth in human population, 최근의 엄청난 인구 증가는. would have occurred, 일어났었을 것이다. much earlier, 훨씬 더 일찍.. 이 문장 전체를 해석하면, 만약 그렇지 않았더라면, 최근의 엄청난 인구 증가는 훨씬 더 일찍 일어났었을 것이다.","hl":"m"},{"n":35,"text":"만약 과거 인류의 생존율이 높았다면 인구가 폭발적으로 느는 현상이 옛날에 벌어졌겠지만, 실제로는 유아 사망률이 너무 높아서 인구 성장이 지연되었다는 결론을 내리고 있어요. 가정법을 써서 생존이 얼마나 힘들었는지를 다시 한번 짚어주는 아주 중요한 문장이죠.","hl":"mn"},{"n":36,"text":"첫 번째로 문장 맨 앞의 Had it been otherwise를 볼까요. 원래는 If it had been otherwise라는 가정법 과거완료 문장인데, 접속사 If가 생략되면서 주어 it과 조동사 Had가 도치된 구조예요. 서술형 단골손님이니 확실히 눈여겨보세요. 두 번째로 주절의 동사 would have occurred는 가정법 과거완료의 짝꿍이죠. 조건절의 Had 피피와 맞춰서 과거 사실에 대한 가정을 완성합니다. 세 번째로 much earlier에서 much는 비교급인 earlier를 수식해서 훨씬이라는 뜻을 만들어 주는 비교급 강조 부사랍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>생존은 매년 뛰어넘어야 하는 높은 \u003cb class=\"key\">허들\u003c/b>과 같아서 과거에는 많은 이들이 일찍 사망했습니다.\u003c/li>\u003cli>인류는 자연 상태에 가깝게 살았으며, 자연은 무화과나 개코원숭이의 사례처럼 생명을 크게 \u003cb class=\"key\">낭비\u003c/b>합니다.\u003c/li>\u003cli>19세기 이전 인류의 \u003cb class=\"key\">유아 \u003c/b>\u003cb class=\"key\">사망률\u003c/b>은 유인원과 비슷하거나 더 높았고, 많은 이들이 번식기 이전에 사망했습니다.\u003c/li>\u003cli>과거의 이런 높은 초기 사망률이 아니었다면, 오늘날의 거대한 \u003cb class=\"key\">인구 \u003c/b>\u003cb class=\"key\">증가\u003c/b>는 훨씬 더 일찍 일어났을 것입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Historically high early mortality rates kept human populations in check until recent centuries.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">과거 인류는 자연 상태와 마찬가지로 \u003cb class=\"key\">유아 \u003c/b>\u003cb class=\"key\">사망률\u003c/b>이 매우 높았으며, 최근의 폭발적인 \u003cb class=\"key\">인구 \u003c/b>\u003cb class=\"key\">증가\u003c/b>는 이러한 높은 생존 허들을 극복한 결과이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"자, 이렇게 과거 인류의 생존이 얼마나 치열했는지, 그리고 유아 사망률이 얼마나 높았는지 알아보았습니다. 무화과나 개코원숭이 같은 자연계의 예시가 인간의 역사와 어떻게 연결되는지 파악하는 것이 중요합니다. 마지막 문장의 가정법이 담고 있는 진짜 의미를 잘 곱씹어 보면서 오늘 수업은 여기서 마치겠습니다. 수고하셨습니다.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
