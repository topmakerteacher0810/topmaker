<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 19번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 19번","audioDir":"19_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">19번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>Overcoming Stage Fright: Beryl's Shining Moment\u003c/h1>\u003ch2>무대 공포증 극복: Beryl의 빛나는 순간\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Beryl은 무대에 올라 \u003cb class=\"key\">무대 \u003c/b>\u003cb class=\"key\">공포증\u003c/b>으로 가사를 잊고 얼어붙을 뻔했지만, 친구의 \u003cb class=\"key\">격려\u003c/b>를 떠올리며 마음을 다잡고 성공적으로 노래를 마쳤다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Remembering a friend's encouraging words helps Beryl overcome stage fright and successfully perform on stage.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 함께 살펴볼 지문은 학교 축제 무대에 오른 한 소녀의 이야기입니다. 많은 사람들 앞에 서면 누구나 떨리기 마련이죠? 이 글은 Beryl이라는 주인공이 무대 공포증으로 가사를 잊고 얼어붙을 뻔했지만, 친구의 따뜻한 격려를 떠올리며 이를 극복하고 성공적으로 무대를 마치는 내용을 담고 있습니다. 친구의 응원이 주는 힘과 주인공의 용기를 중심으로 글의 요지를 파악해 보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">큰 무대나 많은 사람 앞에 서면 누구나 긴장하게 되는데, 이를 \u003cb class=\"key\">무대 \u003c/b>\u003cb class=\"key\">공포증\u003c/b>(Stage Fright) 또는 수행 불안(Performance Anxiety)이라고 부릅니다. 뇌가 이 낯선 상황을 '위협'으로 인식해서 스트레스 호르몬을 분비하기 때문이죠. 마치 숲속에서 맹수를 마주쳤을 때 몸이 굳어버리는 것과 같은 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">본능\u003c/b>입니다. 하지만 긍정적인 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">암시\u003c/b>나 주변 사람의 따뜻한 격려는 불안감을 낮추고 자신감을 회복하는 데 큰 도움이 됩니다. 이 글의 Beryl 역시 친구의 말 한마디 덕분에 얼어붙었던 마음을 녹이고 자신의 \u003cb class=\"key\">잠재력\u003c/b>을 발휘할 수 있었습니다.\u003c/div>","segs":[{"n":2,"text":"큰 무대나 발표 자리에 서면 갑자기 머리가 하얗게 변하는 경험, 한 번쯤 해보셨나요? 우리는 이것을 무대 공포증, 영어로는 Stage Fright이라고 부릅니다. 낯설고 긴장되는 상황에 부닥치면 우리 뇌는 이것을 위협으로 느끼고 스트레스 호르몬을 뿜어냅니다. 마치 산에서 호랑이를 마주쳤을 때 몸이 굳어버리는 생존 본능과 같은 원리죠. 하지만 이때 긍정적인 자기 암시를 하거나 주변 사람들의 격려를 떠올리면 불안감을 크게 낮출 수 있습니다. 오늘 지문의 주인공 역시 얼어붙은 몸과 마음을 친구의 말 한마디로 녹여내고 자신의 잠재력을 마음껏 펼쳐 보인답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 위기\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Beryl은 학교 축제 무대에 올랐으나, 극도의 \u003cb class=\"key\">긴장감\u003c/b> 때문에 반복해서 연습했던 가사가 모두 \u003cb class=\"key\">머릿속\u003c/b>에서 사라져 버리는 위기를 맞습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>심리적 압박\u003csmall>문제 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>그녀는 가사를 틀리거나 목소리가 형편없게 들릴까 봐 두려워하며 무대 위에서 완전히 \u003cb class=\"key\">얼어붙을 \u003c/b>\u003cb class=\"key\">뻔\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>전환점\u003csmall>전환 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>절망적인 순간, 무대에 오르는 것 자체가 \u003cb class=\"key\">용감한 \u003c/b>\u003cb class=\"key\">일\u003c/b>이라는 가장 친한 친구 Naomi의 \u003cb class=\"key\">응원\u003c/b>을 떠올리며 마음을 다잡습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>극복 및 성공\u003csmall>결론 · 문장 9–13\u003c/small>\u003c/h4>\u003cp>깊은숨을 쉬고 노래를 시작하자 점차 안정을 찾게 되고, 어깨를 누르던 \u003cb class=\"key\">중압감\u003c/b>을 떨쳐내며 자신의 \u003cb class=\"key\">순간\u003c/b>을 만끽하게 됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이 이야기가 어떻게 전개되는지 시간의 흐름을 따라가 볼까요?","hl":null},{"n":4,"text":"첫 번째 문장부터 세 번째 문장까지는 무대에 오른 Beryl의 모습과 예상치 못한 위기 상황을 보여줍니다. 학교 축제 무대에 올라 반복해서 연습했던 도입부 멜로디가 흘러나오지만, 긴장감 탓에 머릿속에서 모든 가사가 하얗게 지워지고 맙니다.","hl":"f0"},{"n":5,"text":"네 번째 문장부터 여섯 번째 문장에서는 Beryl이 겪는 심리적 압박이 최고조에 달합니다. 가사를 잊어버리면 어쩌지, 내 목소리가 끔찍하게 들리면 어쩌지 걱정하며 무대 위에서 완전히 얼어붙기 일보 직전이 되죠.","hl":"f1"},{"n":6,"text":"일곱 번째 문장과 여덟 번째 문장은 이 이야기의 중요한 전환점입니다. 바로 그 절망적인 순간, 저 무대 위에 올라가는 것만으로도 너는 이미 용감한 일을 하고 있는 것이라던 단짝 친구 Naomi의 응원을 기적처럼 떠올리게 됩니다.","hl":"f2"},{"n":7,"text":"아홉 번째 문장부터 마지막 열세 번째 문장까지는 마침내 두려움을 극복하고 성공적으로 노래를 마치는 결론 부분입니다. 심호흡과 함께 다시 노래를 시작하자 처음엔 떨리던 목소리가 곧 안정을 찾고, 무거운 중압감을 떨쳐낸 Beryl은 자신의 노래가 울려 퍼지는 짜릿한 성취감의 순간을 맞이하게 됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 주인공 Beryl이 무대에 올라 노래 공연을 마치기까지의 과정을 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 묘사하고 있습니다. 처음에는 \u003cb class=\"key\">무대 \u003c/b>\u003cb class=\"key\">공포증\u003c/b>으로 심각한 위기를 겪지만, 친구의 조언을 떠올린 후 이를 극복하는 일화(Narrative) 구조를 가집니다. 갈등이 해소되고 주인공이 충만한 \u003cb class=\"key\">성취감\u003c/b>을 느끼는 결말부가 글의 맨 마지막에 제시되므로 미괄식 구조로 볼 수 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But then (7)\u003c/b>\u003cspan>두려움에서 극복으로의 심리적 전환\u003c/span>\u003cb>When the moment came (9)\u003c/b>\u003cspan>결심 후 행동 개시를 알리는 시간적 배경\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">faded from her mind\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">froze\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">weight on her shoulders\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 지문은 특정 사건이 일어난 순서대로 이야기를 풀어가는 시간순 전개 방식을 취하고 있습니다. 처음에는 위기를 겪지만 결국 이를 이겨내는 일화, 즉 Narrative 형식의 글이죠. 극도의 긴장감이 친구의 말로 인해 해소되고 결국 자신의 무대를 즐기게 되는 결말부가 맨 마지막에 나타나기 때문에 미괄식 구조라고 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"이야기의 흐름이 바뀌는 신호어들을 주의 깊게 보세요. 일곱 번째 문장의 But then은 두려움에 사로잡혀 있던 Beryl의 마음이 긍정적으로 바뀌는 전환점 역할을 합니다. 또한, 부정적인 심리를 묘사할 때 쓰인 faded from her mind나 froze 같은 표현들이, 후반부에서는 weight slowly lifted나 without hesitation과 같은 긍정적이고 거침없는 표현들로 대조되어 나타난다는 점도 놓치지 마세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>performance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공연\u003c/span>\u003c/div>\u003cdiv>\u003cb>festival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>축제\u003c/span>\u003c/div>\u003cdiv>\u003cb>melody\u003c/b>\u003cem>명사\u003c/em>\u003cspan>멜로디, 곡조\u003c/span>\u003c/div>\u003cdiv>\u003cb>tune\u003c/b>\u003cem>명사\u003c/em>\u003cspan>곡조, 선율\u003c/span>\u003c/div>\u003cdiv>\u003cb>practice\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연습하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>over and over\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>반복해서\u003c/span>\u003c/div>\u003cdiv>\u003cb>lyric\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가사\u003c/span>\u003c/div>\u003cdiv>\u003cb>by heart\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>외워서, 암기하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>fade\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사라지다, 희미해지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>freeze\u003c/b>\u003cem>동사\u003c/em>\u003cspan>얼어붙다, 굳어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>awful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>형편없는, 끔찍한\u003c/span>\u003c/div>\u003cdiv>\u003cb>brave\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>용감한\u003c/span>\u003c/div>\u003cdiv>\u003cb>take a deep breath\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>심호흡하다, 깊게 숨을 들이마시다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shaky\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>떨리는, 불안정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>rhythm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>리듬, 흐름\u003c/span>\u003c/div>\u003cdiv>\u003cb>focus\u003c/b>\u003cem>동사\u003c/em>\u003cspan>집중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>weight\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무게, 중압감\u003c/span>\u003c/div>\u003cdiv>\u003cb>lift\u003c/b>\u003cem>동사\u003c/em>\u003cspan>걷히다, 사라지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>flow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>흐르다, 흘러나오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>easily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>수월하게, 쉽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>continue\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계속하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>note\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음, 음표\u003c/span>\u003c/div>\u003cdiv>\u003cb>ring out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>울려 퍼지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hesitation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주저함, 망설임\u003c/span>\u003c/div>\u003cdiv>\u003cb>realize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>깨닫다\u003c/span>\u003c/div>\u003cdiv>\u003cb>moment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>순간, 기회\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이 지문에서 꼭 알아두어야 할 단어들을 살펴볼까요? 세 번째 문장의 by heart는 마음으로라는 뜻에서 발전해 외워서, 암기하여라는 뜻의 아주 중요한 숙어입니다. 열한 번째 문장의 weight는 흔히 무게라고 알고 있지만, 여기서는 마음을 짓누르는 중압감이나 부담감을 의미한다는 점 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">fade\u003c/b>\u003cspan class=\"m\">사라지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disappear\u003c/span>\u003cspan class=\"s\">vanish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">appear\u003c/span>\u003cspan class=\"a\">emerge\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">awful\u003c/b>\u003cspan class=\"m\">형편없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">terrible\u003c/span>\u003cspan class=\"s\">horrible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">wonderful\u003c/span>\u003cspan class=\"a\">excellent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">brave\u003c/b>\u003cspan class=\"m\">용감한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">courageous\u003c/span>\u003cspan class=\"s\">fearless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cowardly\u003c/span>\u003cspan class=\"a\">fearful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">shaky\u003c/b>\u003cspan class=\"m\">떨리는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">trembling\u003c/span>\u003cspan cl  \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 제시합니다. 노래 공연 직전의 \u003cb class=\"key\">긴장감\u003c/b>이 시작되는 시점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : Beryl [주어] + was standing [과거진행형 동사] : \"서 있었다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Beryl was standing on stage, Beryl은 무대 위에 서 있었다.  for her singing performance, 자신의 노래 공연을 위해.  at the school festival, 학교 축제에서.. 이 문장 전체를 해석하면, Beryl은 학교 축제에서 자신의 노래 공연을 위해 무대 위에 서 있었다.","hl":"m"},{"n":13,"text":"이 문장은 Beryl이 무대에 오르는 배경 상황을 제시하고 있어요. 노래 공연 직전의 긴장감이 막 시작되는 첫 장면이죠.","hl":"mn"},{"n":14,"text":"어법을 살펴보면, 첫 번째로 was standing이 쓰였어요. 과거의 특정 시점에 서서 대기하고 있던 동작을 생생하게 보여주기 위해 과거진행형을 사용했답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도입부의 멜로디가 연주되기 시작했다,\u003c/span>\u003cspan class=\"en\">The opening melody began to play\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부드러운 곡조인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">soft \u003c/span>\u003cspan class=\"tgt\">tune\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Beryl이 반복해서 연습했던.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">Beryl \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">practiced\u003c/span> over and over.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Beryl이 반복해서 연습했던 부드러운 곡조인 도입부의 멜로디가 연주되기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Beryl이 수없이 연습한 노래의 전주가 시작되었음을 알립니다. 쉼표를 통해 도입부의 멜로디와 부드러운 곡조가 \u003cb class=\"key\">동격\u003c/b>임을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 콤마\u003c/span> : The opening melody [명사] + , [동격] + a soft tune [명사] : \"부드러운 곡조인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사와 과거완료\u003c/span> : a soft tune [선행사] + that [목적격 관계대명사] + Beryl had practiced [주어 + 과거완료 동사] : \"Beryl이 연습했던\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The opening melody began to play, 도입부의 멜로디가 연주되기 시작했다.  a soft tune, 부드러운 곡조인.  that Beryl had practiced over and over, Beryl이 반복해서 연습했던.. 이 문장 전체를 해석하면, Beryl이 반복해서 연습했던 부드러운 곡조인 도입부의 멜로디가 연주되기 시작했다.","hl":"m"},{"n":16,"text":"Beryl이 무대 위에서 수없이 연습한 노래의 전주가 흘러나오기 시작한 상황이에요. 쉼표를 써서 멜로디가 곧 부드러운 곡조라는 동격 관계를 보여주고 있죠.","hl":"mn"},{"n":17,"text":"어법 포인트 짚어볼게요. 첫 번째로 콤마 뒤에 나온 a soft tune은 앞에 있는 The opening melody와 같은 대상을 가리키는 동격 명사예요. 두 번째로 that Beryl had practiced 부분을 볼까요. 여기서 that은 선행사 a soft tune을 꾸며주는 목적격 관계대명사입니다. 멜로디가 연주되기 시작한 과거 시점보다 Beryl이 연습했던 게 더 먼저 일어난 일이니까 과거완료 시제인 had practiced가 쓰인 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 가사를 외웠지만,\u003c/span>\u003cspan class=\"en\">She knew the lyrics by heart,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 이곳에 서자,\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">here,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것이 사라져 버린 것 같았다\u003c/span>\u003cspan class=\"en\">everything \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">seemed \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">faded\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 머릿속에서.\u003c/span>\u003cspan class=\"en\">from her mind.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 가사를 외웠지만, 그녀가 이곳에 서자 모든 것이 그녀의 머릿속에서 사라져 버린 것 같았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 무대에 서자마자 머릿속이 하얘지는 극도의 \u003cb class=\"key\">무대 \u003c/b>\u003cb class=\"key\">공포증\u003c/b>을 묘사합니다. 준비를 완벽히 했음에도 불구하고 찾아온 엄청난 \u003cb class=\"key\">긴장감\u003c/b>을 부각시킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유의 접속사\u003c/span> : now that [접속사] + she was here [주어 + 동사] : \"그녀가 이곳에 서자,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">완료부정사\u003c/span> : seemed [과거동사] + to have faded [완료부정사] : \"사라져 버린 것 같았다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"She knew the lyrics by heart, 그녀는 가사를 외웠지만.  but now that she was here, 그녀가 이곳에 서자.  everything seemed to have faded, 모든 것이 사라져 버린 것 같았다.  from her mind, 그녀의 머릿속에서.. 이 문장 전체를 해석하면, 그녀는 가사를 외웠지만, 그녀가 이곳에 서자 모든 것이 그녀의 머릿속에서 사라져 버린 것 같았다.","hl":"m"},{"n":19,"text":"그토록 연습을 많이 해서 가사를 다 외웠는데도, 막상 무대에 서자마자 머릿속이 새하얘지는 극도의 무대 공포증을 보여주는 문장이에요. 완벽한 준비와 현재의 긴장감이 대비되고 있죠.","hl":"mn"},{"n":20,"text":"중요한 문법 두 가지를 확인해볼게요. 첫 번째, now that은 이제 뭐뭐이니까, 뭐뭐이기 때문에라는 뜻을 가진 접속사예요. 학생용 해석에서는 이곳에 서자라고 자연스럽게 의역되었죠. 상황의 변화나 원인을 나타냅니다. 두 번째, seemed to have faded가 정말 중요해요. 주절의 동사인 seemed, 즉 뭐뭐인 것 같았다가 과거 시제잖아요? 그런데 가사가 머릿속에서 사라져버린 건 그보다 더 먼저 일어난 일이기 때문에 to have pp 형태인 완료부정사를 사용해서 시제의 차이를 나타냈답니다. 서술형으로도 나오기 아주 좋은 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 거의 얼어붙었다.\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">almost \u003c/span>\u003cspan class=\"tgt\">froze\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 거의 얼어붙었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Beryl이 무대에서 느끼는 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>을 보여주는 문장입니다. 머릿속이 하얘지면서 몸이 굳어버릴 정도로 심하게 \u003cb class=\"key\">긴장한 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 직관적으로 묘사하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 동사 수식\u003c/span> : almost [부사] + froze [동사] : \"거의 얼어붙었다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"She almost froze, 그녀는 거의 얼어붙었다.. 이 문장 전체를 해석하면, 그녀는 거의 얼어붙었다.","hl":"m"},{"n":22,"text":"베릴이 무대 위에서 극도의 긴장감을 느끼는 부분이에요. 머릿속이 하얘지면서 몸까지 굳어버릴 정도로 긴장한 상태를 아주 직관적으로 보여주죠.","hl":"mn"},{"n":23,"text":"여기서는 부사 almost가 동사 froze를 꾸며주고 있어요. 완전히 얼어붙은 건 아니지만 거의 그 정도로 굳어버렸다는 긴장의 정도를 나타내 준답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~하면 어떡하지? \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">What \u003c/span>\u003cspan class=\"tgt\">if\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 가사를 잊어버리면\u003c/span>\u003cspan class=\"en\">I forgot the words?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘내가 가사를 잊어버리면 어떡하지?’\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 무대 위에서 긴장한 Beryl의 \u003cb class=\"key\">내면적 \u003c/b>\u003cb class=\"key\">불안\u003c/b>을 잘 보여줍니다. 가사를 까먹을지도 모른다는 최악의 상황을 머릿속으로 그리며 \u003cb class=\"key\">두려움\u003c/b>을 느끼고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건/가정의 의문문\u003c/span> : What (would happen) if + 주어 + 동사의 과거형 : \"~하면 어떡하지?\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"What if, ~하면 어떡하지?. I forgot the words?, 내가 가사를 잊어버리면. 이 문장 전체를 해석하면, ‘내가 가사를 잊어버리면 어떡하지?’","hl":"m"},{"n":25,"text":"머릿속이 하얘진 베릴이 느끼는 내면적인 불안감을 보여주는 문장이에요. 내가 가사를 잊어버리면 어쩌지 하고 최악의 상황을 가정하면서 두려움을 느끼는 거죠.","hl":"mn"},{"n":26,"text":"첫 번째 포인트로 What if 표현을 볼게요. What if 뒤에 주어와 동사가 오면, 만약 뭐뭐하면 어떡하지라는 뜻이 돼요. 원래는 What would happen if가 줄어든 형태랍니다. 여기서 과거동사 forgot을 써서 아직 일어나지 않은 일에 대한 가정이나 걱정을 나타내고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~하면 어떡하지? \u003c/span>\u003cspan class=\"en\">What if\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 형편없게 들리면\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sounded \u003c/span>\u003cspan class=\"tgt\">awful\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘내가 형편없게 들리면 어떡하지?’\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에 이어 Beryl이 가지는 또 다른 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">상상\u003c/b>입니다. 자신의 노랫소리가 사람들에게 \u003cb class=\"key\">형편없게\u003c/b> 들릴까 봐 스스로를 의심하며 걱정하는 심리가 담겨 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">감각동사 + 형용사 보어\u003c/span> : sounded [감각동사] + awful [형용사 보어] : \"형편없게 들렸다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"What if, ~하면 어떡하지?. I sounded awful?, 내가 형편없게 들리면. 이 문장 전체를 해석하면, ‘내가 형편없게 들리면 어떡하지?’","hl":"m"},{"n":28,"text":"앞 문장에 이어 베릴이 머릿속으로 하는 또 다른 부정적 상상이에요. 혹시나 내 목소리가 사람들에게 너무 형편없게 들리면 어쩌지 하고 스스로를 의심하며 걱정하는 심리가 잘 나타나 있죠.","hl":"mn"},{"n":29,"text":"여기서 눈여겨봐야 할 첫 번째 포인트는 sounded awful이에요. sound는 감각동사라서 뒤에 주어의 상태를 설명해주는 형용사 보어가 와야 한답니다. 그래서 우리말로는 형편없게라고 해석되더라도 부사 awfully를 쓰면 절대 안 되고, 형용사 awful을 써야 한다는 점 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그때\u003c/span>\u003cspan class=\"en\">But then\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 기억났다\u003c/span>\u003cspan class=\"en\">she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">remembered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 가장 친한 친구인 Naomi의 말이\u003c/span>\u003cspan class=\"en\">her best friend Naomi's words.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 그때 그녀는 자신의 가장 친한 친구인 Naomi의 말이 기억났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 무대 위에서 얼어붙은 Beryl이 친구의 응원을 떠올리는 문장입니다. 이 문장을 기점으로 주인공의 심리가 불안에서 \u003cb class=\"key\">자신감\u003c/b>으로 전환되는 중요한 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">완전타동사\u003c/span> : remember [타동사] + [목적어] : \"기억났다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"But then, 그러나 그때. she remembered, 그녀는 기억났다. her best friend Naomi's words, 자신의 가장 친한 친구인 Naomi의 말이. 이 문장 전체를 해석하면, 그러나 그때 그녀는 자신의 가장 친한 친구인 Naomi의 말이 기억났다.","hl":"m"},{"n":31,"text":"무대 위에서 긴장으로 얼어붙었던 Beryl이 친구의 따뜻한 응원을 떠올리는 장면이에요. 이 문장을 기점으로 주인공의 심리가 불안에서 자신감으로 확 바뀌는 아주 중요한 전환점 역할을 한답니다.","hl":"mn"},{"n":32,"text":"어법을 살펴볼게요. 첫 번째로 remembered는 뒤에 목적어를 바로 가지는 타동사예요. 무엇을 기억해 냈는지 그 대상인 Naomi's words가 목적어로 잘 연결되었죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“너는 하고 있는 거야\u003c/span>\u003cspan class=\"en\">&quot;You're doing\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">용감한 일을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">brave\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그냥 거기에 올라가는 것만으로도”\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">getting\u003c/span> up there.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“그냥 거기에 올라가는 것만으로도 너는 용감한 일을 하고 있는 거야.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구 Naomi가 해준 따뜻한 조언의 내용입니다. 완벽한 결과보다는 \u003cb class=\"key\">시도 \u003c/b>\u003cb class=\"key\">자체\u003c/b>가 가치 있다는 격려를 통해 주인공에게 \u003cb class=\"key\">용기\u003c/b>를 불어넣어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">후위 수식 (대명사 + 형용사)\u003c/span> : -thing [대명사] + [형용사] : \"용감한 일을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : by [전치사] + just [부사] + -ing [동명사] : \"그냥 올라가는 것만으로도\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"\"You're doing, “너는 하고 있는 거야. something brave, 용감한 일을. by just getting up there.\", 그냥 거기에 올라가는 것만으로도”. 이 문장 전체를 해석하면, “그냥 거기에 올라가는 것만으로도 너는 용감한 일을 하고 있는 거야.”","hl":"m"},{"n":34,"text":"이 문장은 친구 Naomi가 해준 따뜻한 격려의 말이에요. 완벽한 결과보다는 무대에 오르는 시도 자체가 멋지다는 뜻을 담고 있어서 주인공에게 큰 용기를 불어넣어 주는 문장입니다.","hl":"mn"},{"n":35,"text":"어법 포인트 짚어볼게요. 첫 번째로 something brave입니다. 영어에서 thing으로 끝나는 대명사는 형용사가 반드시 뒤에서 수식해야 해요. 그래서 brave something이 아니라 something brave가 맞습니다. 서술형으로도 자주 나오니 어순을 꼭 기억하세요. 두 번째로 by just getting입니다. 뭐뭐 함으로써라는 뜻을 가진 by ing 구문이 쓰였어요. 전치사 by 뒤에는 꼭 동명사 형태가 와야 한다는 점 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 순간이 오자,\u003c/span>\u003cspan class=\"en\">When the moment came,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Beryl은 깊게 숨을 들이마시고\u003c/span>\u003cspan class=\"en\">Beryl \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">took \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">deep \u003c/span>\u003cspan class=\"tgt\">breath \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노래를 부르기 시작했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">sing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 순간이 오자, Beryl은 깊게 숨을 들이마시고 노래를 부르기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 친구의 말을 떠올리고 마음을 다잡은 Beryl이 드디어 행동을 시작하는 문장입니다. 등위접속사 and를 통해 두 동작이 \u003cb class=\"key\">병렬 \u003c/b>\u003cb class=\"key\">구조\u003c/b>를 이루며 흐름의 \u003cb class=\"key\">연속성\u003c/b>을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 병렬 구조\u003c/span> : took [과거동사] + and + began [과거동사] : \"깊게 숨을 들이마시고 시작했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">begin + to부정사/동명사\u003c/span> : begin [타동사] + [to부정사/동명사 (목적어)] : \"노래를 부르기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"When the moment came, 그 순간이 오자. Beryl took a deep breath, Beryl은 깊게 숨을 들이마시고. and began to sing, 노래를 부르기 시작했다.. 이 문장 전체를 해석하면, 그 순간이 오자, Beryl은 깊게 숨을 들이마시고 노래를 부르기 시작했다.","hl":"m"},{"n":37,"text":"친구의 말로 다시 마음을 다잡은 Beryl이 드디어 용기를 내어 행동으로 옮기는 장면이에요. 깊게 심호흡을 하고 노래를 시작하며 떨림을 극복해 나가는 연속적인 동작이 잘 나타나 있습니다.","hl":"mn"},{"n":38,"text":"문법 포인트 설명해 드릴게요. 첫 번째로 took a deep breath and began 부분이에요. 주어인 Beryl 뒤에 과거형 동사 took과 began이 and로 묶여서 병렬 구조를 만들고 있어요. 시제가 일치하는지 잘 확인해야 합니다. 두 번째로 began to sing입니다. begin이라는 동사는 목적어로 to부정사와 동명사를 둘 다 가질 수 있어요. 그래서 이 자리에 to sing 대신 singing이 와도 어법상 완전히 맞는 표현이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 목소리는, 처음에는 떨렸지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Her \u003c/span>\u003cspan class=\"tgt\">voice, \u003c/span>\u003cspan class=\"tgt\">shaky \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">first,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧 그것의 리듬을 찾았다\u003c/span>\u003cspan class=\"en\">soon found its rhythm\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 집중함에 따라.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">focused\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 목소리는 처음에는 떨렸지만 그녀가 집중함에 따라 곧 그것의 리듬을 찾았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 베릴이 노래에 집중하면서 \u003cb class=\"key\">긴장감\u003c/b>을 극복하고 \u003cb class=\"key\">안정\u003c/b>을 되찾는 과정을 보여줍니다. 불안했던 목소리가 원래의 페이스를 찾는 중요한 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">삽입 구문 (형용사구)\u003c/span> : N + [, + 형용사구 + ,] + V : \"그녀의 목소리는, 처음에는 떨렸지만,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 as (비례/동시동작)\u003c/span> : as + S + V : \"그녀가 집중함에 따라\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Her voice, shaky at first, 그녀의 목소리는, 처음에는 떨렸지만. soon found its rhythm, 곧 그것의 리듬을 찾았다. as she focused, 그녀가 집중함에 따라.. 이 문장 전체를 해석하면, 그녀의 목소리는 처음에는 떨렸지만 그녀가 집중함에 따라 곧 그것의 리듬을 찾았다.","hl":"m"},{"n":40,"text":"이 문장은 베릴이 노래에 집중하면서 긴장감을 극복하고 안정을 되찾는 과정을 잘 보여주고 있어요. 처음에 불안하게 떨리던 목소리가 드디어 원래의 페이스를 찾는 중요한 전환점이 되는 문장입니다.","hl":"mn"},{"n":41,"text":"어법 포인트 짚어볼게요. 첫 번째로 Her voice와 soon found 사이에 쉼표 두 개와 함께 shaky at first가 들어가 있죠? 주어와 동사 사이에 형용사구가 삽입되어서 주어의 상태를 꾸며주는 거예요. 주격 관계대명사와 비동사가 생략된 구조로 이해하면 됩니다. 두 번째로 뒤에 나오는 as는 접속사로 쓰여서 그녀가 집중함에 따라, 혹은 집중하면서라는 동시 동작이나 비례의 의미를 더해주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 어깨 위의 중압감이\u003c/span>\u003cspan class=\"en\">The weight on her shoulders\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서서히 사라졌고,\u003c/span>\u003cspan class=\"en\">slowly lifted,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 가사는\u003c/span>\u003cspan class=\"en\">and the words\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">흘러나오기 시작했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">began \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">flow\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 수월하게.\u003c/span>\u003cspan class=\"en\">more easily.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 어깨 위의 중압감은 서서히 사라졌고, 가사는 더 수월하게 흘러나오기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 긴장감이라는 무거운 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">압박\u003c/b>이 사라지고 마침내 노래를 자연스럽게 부르게 되었다는 것을 비유적으로 표현했습니다. 상황이 \u003cb class=\"key\">긍정적\u003c/b>으로 변했음을 확실히 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사 명사적 용법 (목적어)\u003c/span> : begin + to V / V-ing : \"흘러나오기 시작했다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"The weight on her shoulders, 그녀의 어깨 위의 중압감이. slowly lifted, 서서히 사라졌고. and the words, 그리고 가사는. began to flow, 흘러나오기 시작했다. more easily, 더 수월하게.. 이 문장 전체를 해석하면, 그녀의 어깨 위의 중압감은 서서히 사라졌고, 가사는 더 수월하게 흘러나오기 시작했다.","hl":"m"},{"n":43,"text":"이 문장은 베릴이 느끼던 심리적 압박이 마침내 사라진 상태를 어깨 위의 무게가 걷혔다고 비유적으로 표현했어요. 이제 긴장을 완전히 풀고 노래를 긍정적이고 자연스럽게 부를 수 있게 된 거죠.","hl":"mn"},{"n":44,"text":"어법을 볼까요? 동사 began 뒤에 to flow가 목적어로 왔어요. begin이라는 동사는 목적어로 to부정사와 동명사를 모두 쓸 수 있는 착한 동사랍니다. 그래서 to flow 대신에 flowing이라고 바꿔 써도 문법적으로 완벽하게 맞고 의미도 똑같다는 점 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀가 노래를 계속 부를수록,\u003c/span>\u003cspan class=\"en\">As she \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">continued \u003c/span>\u003cspan class=\"tgt\">singing\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각각의 음이 울려 퍼졌다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">note\u003c/span> rang out\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거침없이 (망설임 없이).\u003c/span>\u003cspan class=\"en\">without hesitation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀가 노래를 계속 부를수록 각각의 음이 거침없이 울려 퍼졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 베릴이 \u003cb class=\"key\">자신감\u003c/b>을 완전히 회복하여 무대를 즐기며 훌륭하게 공연을 해내고 있음을 보여줍니다. 거침없이 울려 퍼지는 음은 그녀의 \u003cb class=\"key\">내적 \u003c/b>\u003cb class=\"key\">성장\u003c/b>과 극복을 의미합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 목적어 (continue)\u003c/span> : continue + V-ing / to V : \"노래를 계속 부르는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">each + 단수명사\u003c/span> : each + [단수명사] + [단수동사] : \"각각의 음이\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"As she continued singing, 그녀가 노래를 계속 부를수록. each note rang out, 각각의 음이 울려 퍼졌다. without hesitation, 거침없이 (망설임 없이).. 이 문장 전체를 해석하면, 그녀가 노래를 계속 부를수록 각각의 음이 거침없이 울려 퍼졌다.","hl":"m"},{"n":46,"text":"처음에 그토록 떨던 베릴이 이제는 완벽하게 자신감을 회복했어요. 망설임 없이 울려 퍼지는 음이라는 표현을 통해서 베릴이 내적 성장을 이루고 무대를 멋지게 장악했다는 걸 알 수 있습니다. 아주 중요한 결론부 문장이에요.","hl":"mn"},{"n":47,"text":"여기서 챙겨갈 문법 두 가지 말씀드릴게요. 첫 번째는 continued 뒤에 나온 singing입니다. continue 동사도 앞서 배운 begin처럼 동명사와 to부정사 둘 다 목적어로 쓸 수 있어요. 그러니까 continued to sing이라고 써도 전혀 문제가 없습니다. 두 번째는 each note 부분인데요. each라는 단어 뒤에는 무조건 단수명사가 와야 한다는 규칙이 있어요. 그래서 notes라고 복수형을 쓰면 절대 안 되고 note라고 써야 한다는 점 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 깨달았다\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">realized \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이 ~임을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 순간(임을)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">moment\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 지금이 자신의 순간임을 깨달았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 두려움을 극복하고 성공적으로 노래를 부르게 된 베릴이 결국 \u003cb class=\"key\">자신감\u003c/b>을 되찾았음을 보여줍니다. 무대 위에서의 압박감을 이겨내고 온전히 \u003cb class=\"key\">자신의 \u003c/b>\u003cb class=\"key\">시간\u003c/b>을 즐기게 된 긍정적인 심리 변화를 나타내는 결론입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : realize [타동사] + [that + S + V (명사절/목적어)] : \"이것이 자신의 순간임을 깨달았다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"She realized, 그녀는 깨달았다. that this was, 이것이 ~임을. her moment, 자신의 순간(임을). 이 문장 전체를 해석하면, 그녀는 지금이 자신의 순간임을 깨달았다.","hl":"m"},{"n":49,"text":"이 문장은 베릴이 긴장과 두려움을 완전히 극복하고, 마침내 무대 위에서 자신감을 되찾았음을 보여줍니다. 압박감을 이겨내고 무대를 온전히 자신의 시간으로 즐기게 되었다는 아주 긍정적인 심리 변화를 나타내면서 이야기가 마무리되고 있죠.","hl":"mn"},{"n":50,"text":"어법 포인트를 짚어보겠습니다. 동사 realized 뒤에 접속사 that이 보이죠? 이 that은 realized의 목적어 역할을 하는 명사절을 이끌고 있어요. 명사절 접속사 that 뒤에는 this was her moment처럼 주어와 동사를 갖춘 완전한 문장이 온다는 점 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Beryl은 학교 축제 무대에 올라 공연을 시작하려 했으나, \u003cb class=\"key\">긴장감\u003c/b>으로 인해 가사를 잊고 \u003cb class=\"key\">얼어붙을 \u003c/b>\u003cb class=\"key\">뻔\u003c/b>했다.\u003c/li>\u003cli>가사를 잊거나 목소리가 이상할까 봐 두려워하던 중, 무대에 오른 것 자체가 \u003cb class=\"key\">용기\u003c/b> 있는 일이라는 친구 Naomi의 말을 떠올렸다.\u003c/li>\u003cli>친구의 말에 힘입어 Beryl은 심호흡을 하고 다시 노래에 \u003cb class=\"key\">집중\u003c/b>하기 시작했다.\u003c/li>\u003cli>처음의 떨림은 곧 사라지고, \u003cb class=\"key\">중압감\u003c/b>을 떨쳐낸 Beryl은 자신의 노래가 거침없이 울려 퍼지는 성공적인 \u003cb class=\"key\">순간\u003c/b>을 맞이했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Remembering a friend's encouraging words helps Beryl overcome stage fright and successfully perform on stage.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Beryl은 무대에 올라 \u003cb class=\"key\">무대 \u003c/b>\u003cb class=\"key\">공포증\u003c/b>으로 가사를 잊고 얼어붙을 뻔했지만, 친구의 \u003cb class=\"key\">격려\u003c/b>를 떠올리며 마음을 다잡고 성공적으로 노래를 마쳤다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"자, 이렇게 해서 Beryl의 감동적인 무대 극복기를 함께 읽어보았습니다. 무대 공포증이라는 커다란 벽을 만났을 때, 친구의 격려 한마디가 얼마나 큰 힘이 되었는지 잘 알 수 있는 글이었죠. 여러분도 긴장되는 순간이 온다면 스스로에게, 혹은 친구에게 이런 용기의 말을 건네보는 건 어떨까요? 오늘 배운 어휘와 인물의 심리 변화 과정을 복습하면서 마무리하시길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
