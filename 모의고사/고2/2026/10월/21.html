<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 21번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 21번","audioDir":"21_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">21번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>Interest Rates: Reflecting the Value of Time and Risk\u003c/h1>\u003ch2>이자율: 시간의 가치와 위험의 반영\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>돈을 빌려줄 때 발생하는 상환받지 못할 위험과 기회비용을 보상하기 위해 \u003cb class=\"key\">이자율\u003c/b>이라는 가격이 매겨지며, 이는 결국 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 반영한다는 내용입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The interest rate serves as the price of money, reflecting the value of time, the risk of non-repayment, and opportunity cost.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 학생 여러분. 오늘 다룰 지문은 돈을 빌려주는 일과 이자율이 어떻게 시간에 대한 사람들의 인식을 바꾸는지에 대한 글이에요. 핵심 요지는 이자율이라는 돈의 가격이 시간의 가치, 즉 돈을 돌려받지 못할 위험과 기회비용을 반영한다는 것이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 은행에 예금하거나 돈을 빌릴 때 적용되는 \u003cb class=\"key\">이자율\u003c/b>(interest rate)은 단순히 돈을 빌려주는 대가가 아닙니다. 이는 미래의 불확실성에 대한 보상, 즉 떼일 \u003cb class=\"key\">위험\u003c/b>(risk)과 내가 당장 그 돈을 쓰지 못하는 \u003cb class=\"key\">기회비용\u003c/b>(opportunity cost)을 포함합니다. 친구에게 10만 원을 빌려주고 한 달 뒤에 받는다면, 그 한 달 동안 내가 그 돈으로 맛있는 것을 사 먹을 기회를 포기한 셈이죠. 대출 기간이 길어질수록 미래를 예측하기 어렵기 때문에 이 \u003cb class=\"key\">비용\u003c/b>은 더 커지게 됩니다. 따라서 이자율은 곧 돈의 가격이자 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>(value of time)를 수치화한 것이라고 볼 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"이 글을 더 잘 이해하려면 이자율과 기회비용이라는 경제 개념을 조금 알아야 해요. 우리가 은행에 예금하거나 돈을 빌릴 때 적용되는 이자율은 단순히 돈을 빌려주는 대가가 아니랍니다. 이는 미래의 불확실성에 대한 보상, 즉 떼일 위험과 내가 당장 그 돈을 쓰지 못하는 기회비용을 모두 포함해요. 예를 들어 친구에게 십만 원을 빌려주고 한 달 뒤에 받는다면, 그 한 달 동안 내가 그 돈으로 맛있는 것을 사 먹을 기회를 포기한 셈이니까요. 대출 기간이 길어질수록 미래를 예측하기 어렵기 때문에 이 비용은 더 커지게 되고요, 따라서 이자율은 곧 돈의 가격이자 시간의 가치를 수치화한 것이라고 볼 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입: 이자율과 인식\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>돈을 빌려주는 행위가 사람의 세계관을 어떻게 바꾸는지 이해하려면 \u003cb class=\"key\">이자율\u003c/b>을 살펴보아야 합니다. 이자율은 사람들이 \u003cb class=\"key\">시간\u003c/b>을 어떻게 인식하는지에 큰 영향을 미칩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>원리: 위험과 기회비용\u003csmall>원인/근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>돈을 빌려줄 때는 상환받지 못할 \u003cb class=\"key\">위험\u003c/b>과 직접 소비하지 못하는 \u003cb class=\"key\">기회비용\u003c/b>이 발생합니다. 대출 기간이 길어질수록 미래의 불확실성이 커져 이러한 비용과 위험은 더욱 증가하게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>결론: 시간의 가치\u003csmall>결론 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>따라서 돈에는 빌리는 사람의 비용이자 빌려준 사람의 수익인 \u003cb class=\"key\">가격\u003c/b>이 매겨지며, 이것이 곧 이자율입니다. 이 가격은 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 반영하며, 불확실한 미래보다 확실한 \u003cb class=\"key\">현재\u003c/b>가 더 가치 있다는 사실을 속담을 통해 보여줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 지문이 어떻게 전개되는지 세 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째와 두 번째 문장에서는 도입부 역할을 해요. 돈을 빌려주는 행위가 사람의 세계관을 어떻게 바꾸는지 이해하려면 이자율을 살펴보아야 한다고 말하죠. 이자율은 사람들이 시간을 어떻게 인식하는지에 큰 영향을 미친다는 것을 강조합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계인 세 번째와 네 번째 문장에서는 그 원리를 설명합니다. 돈을 빌려줄 때는 상환받지 못할 위험과 직접 소비하지 못하는 기회비용이 발생하죠. 대출 기간이 길어질수록 미래의 불확실성이 커져 이러한 비용과 위험은 더욱 증가하게 된다는 것을 구체적으로 풀어주고 있어요.","hl":"f1"},{"n":6,"text":"마지막 단계인 다섯 번째에서 일곱 번째 문장은 결론입니다. 따라서 돈에는 빌리는 사람의 비용이자 빌려준 사람의 수익인 가격이 매겨지며, 이것이 곧 이자율이라는 거죠. 이 가격은 시간의 가치를 반영하며, 결국 불확실한 미래보다 확실한 현재가 더 가치 있다는 사실을 유명한 속담을 통해 보여줍니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 도입부에서 \u003cb class=\"key\">이자율\u003c/b>이 시간에 대한 인식에 영향을 미친다는 화두를 던집니다. 이후 돈을 빌려주는 상황을 가정하여, 이자율이 상환받지 못할 위험과 \u003cb class=\"key\">기회비용\u003c/b>을 보상하기 위해 존재한다는 구체적인 원리를 설명합니다. 마지막으로 이자율이 결국 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 반영한다는 결론을 내리며, 속담을 통해 불확실한 미래보다 확실한 \u003cb class=\"key\">현재\u003c/b>가 중요하다는 점을 강조하는 양괄식 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Imagine (2)\u003c/b>\u003cspan>예시(가정)\u003c/span>\u003cb>In order to (5)\u003c/b>\u003cspan>결과/목적\u003c/span>\u003cb>To put it another way (7)\u003c/b>\u003cspan>재진술(환언)\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">rate of interest\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cost\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">price\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">value of time\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>a bird in the hand (현재의 가치)\u003c/th>\u003cth>two in the bush (미래의 가치)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>현재\u003c/td>\u003ctd>미래\u003c/td>\u003c/tr>\u003ctr>\u003ctd>확실성 (knowable)\u003c/td>\u003ctd>불확실성 (unknowable)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>직접 소비 가능\u003c/td>\u003ctd>기다려야 함 (위험 존재)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 처음과 끝에 핵심 주장이 담긴 양괄식 구조를 취하고 있어요. 도입부에서 이자율이 시간에 대한 인식에 영향을 미친다는 화두를 던지고, 중간에 기회비용과 위험이라는 원리를 설명한 뒤, 마지막에 시간의 가치를 반영한다는 결론과 속담으로 마무리하는 전개 방식을 씁니다.","hl":"ty"},{"n":8,"text":"글 속의 신호어를 보면 전개 과정을 쉽게 파악할 수 있어요. 두 번째 문장의 Imagine은 예시와 가정을 시작한다는 신호고요, 다섯 번째 문장의 In order to는 앞선 설명에 따른 목적과 결과를 나타냅니다. 특히 일곱 번째 문장의 To put it another way는 글의 핵심을 속담으로 환언, 즉 다시 말해준다는 중요한 신호어입니다. 또한 손 안의 새와 덤불 속의 새를 대조시켜 현재와 미래의 가치를 비교한 점도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>borrow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빌려주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>worldview\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세계관\u003c/span>\u003c/div>\u003cdiv>\u003cb>consider\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각해 보다, 고려하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rate of interest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이자율\u003c/span>\u003c/div>\u003cdiv>\u003cb>perception\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인식\u003c/span>\u003c/div>\u003cdiv>\u003cb>reflect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반영하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>risk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위험\u003c/span>\u003c/div>\u003cdiv>\u003cb>repay\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상환하다, 갚다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity cost\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회비용\u003c/span>\u003c/div>\u003cdiv>\u003cb>term\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기간, 조건\u003c/span>\u003c/div>\u003cdiv>\u003cb>loan\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대출, 대여\u003c/span>\u003c/div>\u003cdiv>\u003cb>chance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가능성, 기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>by definition\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>정의상, 당연히\u003c/span>\u003c/div>\u003cdiv>\u003cb>unknowable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>알 수 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>worthwhile\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가치 있는, 보람 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>borrower\u003c/b>\u003cem>명사\u003c/em>\u003cspan>빌리는 사람, 차입자\u003c/span>\u003c/div>\u003cdiv>\u003cb>lender\u003c/b>\u003cem>명사\u003c/em>\u003cspan>빌려주는 사람, 대출자\u003c/span>\u003c/div>\u003cdiv>\u003cb>income\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수입, 소득\u003c/span>\u003c/div>\u003cdiv>\u003cb>factor in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 감안하다, 요소로 넣다\u003c/span>\u003c/div>\u003cdiv>\u003cb>value\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가치\u003c/span>\u003c/div>\u003cdiv>\u003cb>to put it another way\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>달리 말하면\u003c/span>\u003c/div>\u003cdiv>\u003cb>bush\u003c/b>\u003cem>명사\u003c/em>\u003cspan>덤불\u003c/span>\u003c/div>\u003cdiv>\u003cb>spend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소비하다, 쓰다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"지문에 등장하는 단어 중 몇 가지를 짚어볼게요. perception은 인식이라는 뜻이고요, opportunity cost는 기회비용을 의미하는 아주 중요한 경제 용어입니다. factor in은 무엇무엇을 감안하다, 고려하다라는 뜻의 숙어니까 꼭 외워두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">perception\u003c/b>\u003cspan class=\"m\">인식\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">awareness\u003c/span>\u003cspan class=\"s\">recognition\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reflect\u003c/b>\u003cspan class=\"m\">반영하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">show\u003c/span>\u003cspan class=\"s\">display\u003c/span>\u003cspan class=\"s\">demonstrate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">risk\u003c/b>\u003cspan class=\"m\">위험\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">danger\u003c/span>\u003cspan class=\"s\">hazard\u003c/span>\u003cspan class=\"s\">peril\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safety\u003c/span>\u003cspan class=\"a\">security\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unknowable\u003c/b>\u003cspan class=\"m\">알 수 없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unpredictable\u003c/span>\u003cspan class=\"s\">uncertain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">certain\u003c/span>\u003cspan class=\"a\">predictable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">worthwhile\u003c/b>\u003cspan class=\"m\">가치 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">valuable\u003c/span>\u003cspan class=\"s\">rewarding\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worthless\u003c/span>\u003cspan class=\"a\">useless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">income\u003c/b>\u003cspan class=\"m\">수입\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">earnings\u003c/span>\u003cspan class=\"s\">revenue\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">expense\u003c/span>\u003cspan class=\"a\">expenditure\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 어휘의 동의어와 반의어도 알아두면 좋아요. unknowable은 알 수 없는, 즉 불확실하다는 뜻으로 unpredictable이나 uncertain과 같은 의미입니다. 반대로 확실하다는 뜻의 certain이 반의어가 되겠죠. worthwhile은 가치 있는 이라는 뜻으로 valuable과 동의어고요, 쓸모없다는 뜻의 useless나 worthless가 반의어가 됩니다. 꼭 필기해 두고 복습하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알아보기 위해,\u003c/span>\u003cspan class=\"en\">To see\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈을 빌리고 빌려주는 일이 어떻게 한 사람의 세계관을 바꾸는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">borrowing \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">lending \u003c/span>\u003cspan class=\"tgt\">changes\u003c/span> a person's worldview,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각해 보라.\u003c/span>\u003cspan class=\"en\">consider\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이자율이 무슨 일을 하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">rate \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">interest \u003c/span>\u003cspan class=\"tgt\">does\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간에 대한 사람들의 인식에\u003c/span>\u003cspan class=\"en\">to people's perception of time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">돈을 빌리고 빌려주는 일이 어떻게 한 사람의 세계관을 바꾸는지 알아보기 위해, 이자율이 시간에 대한 사람들의 인식에 무슨 일을 하는지 생각해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 \u003cb class=\"key\">도입부\u003c/b>이자 핵심 주제문입니다. 돈을 빌려주는 행위와 \u003cb class=\"key\">이자율\u003c/b>이라는 경제적 개념이 우리의 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">인식\u003c/b>과 세계관에 어떤 영향을 미치는지 설명하겠다는 의도를 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 + 주어 + 동사 (간접의문문)\u003c/span> : how [의문사] + borrowing and lending [주어] + changes [동사] : \"어떻게 돈을 빌리고 빌려주는 일이 ~를 바꾸는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문사 + 주어 + 동사 (간접의문문)\u003c/span> : what [의문사/목적어] + the rate of interest [주어] + does [동사] : \"이자율이 무슨 일을 하는지\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"To see, 알아보기 위해. how borrowing and lending changes a person's worldview, 돈을 빌리고 빌려주는 일이 어떻게 한 사람의 세계관을 바꾸는지. consider, 생각해 보라.. what the rate of interest does, 이자율이 무슨 일을 하는지. to people's perception of time, 시간에 대한 사람들의 인식에. 이 문장 전체를 해석하면, 돈을 빌리고 빌려주는 일이 어떻게 한 사람의 세계관을 바꾸는지 알아보기 위해, 이자율이 시간에 대한 사람들의 인식에 무슨 일을 하는지 생각해 보라.","hl":"m"},{"n":12,"text":"이 글의 도입부이자 가장 중요한 주제문이에요. 돈을 빌려주는 행위와 이자율이라는 경제 개념이 우리의 시간 인식과 세계관에 어떤 영향을 미치는지 설명하겠다고 선언하는 문장입니다.","hl":"mn"},{"n":13,"text":"어법 포인트 짚어볼까요. 첫 번째로, see라는 동사 뒤에 how borrowing and lending changes라는 간접의문문이 목적어로 왔어요. 여기서 borrowing and lending을 하나의 덩어리로 봐서 단수 취급했기 때문에 동사에 s가 붙은 changes가 온 거 꼭 기억하세요. 두 번째로, consider 뒤에도 what the rate of interest does라는 간접의문문이 목적어로 왔죠. what이 does의 목적어 역할과 의문사 역할을 동시에 하고 있는 간접의문문 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상해 보라.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Imagine \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 누군가에게 돈을 빌려주고 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> lending to somebody\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연 10퍼센트의 이자율로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">interest \u003c/span>\u003cspan class=\"tgt\">rate\u003c/span> of 10 percent per year\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">5년 동안\u003c/span>\u003cspan class=\"en\">for five years.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분이 누군가에게 연 10퍼센트의 이자율로 5년 동안 돈을 빌려주고 있다고 상상해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 주제를 구체적으로 이해시키기 위해 \u003cb class=\"key\">예시\u003c/b>를 제시하는 문장입니다. '연 10퍼센트의 이자율'과 '5년'이라는 구체적인 수치를 통해 독자가 \u003cb class=\"key\">대출 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 머릿속에 쉽게 그리도록 돕습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that 생략\u003c/span> : Imagine [타동사] + (that) [명사절 접속사] + you [주어] + are lending [동사] : \"여러분이 ~하고 있다고 상상하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 at\u003c/span> : at [전치사] + an interest rate [명사구] : \"~의 이자율로\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"Imagine, 상상해 보라.. you are lending to somebody, 여러분이 누군가에게 돈을 빌려주고 있다고. at an interest rate of 10 percent per year, 연 10퍼센트의 이자율로. for five years, 5년 동안. 이 문장 전체를 해석하면, 여러분이 누군가에게 연 10퍼센트의 이자율로 5년 동안 돈을 빌려주고 있다고 상상해 보라.","hl":"m"},{"n":15,"text":"첫 번째 문장에서 말한 내용을 구체적인 예시로 풀어주는 문장이에요. 연 10퍼센트, 그리고 5년이라는 숫자를 줘서 우리가 대출 상황을 쉽게 상상하도록 만들어주는 거죠.","hl":"mn"},{"n":16,"text":"어법은 아주 간단한데요. 첫 번째로 imagine 뒤에 여러분이 무엇을 상상하는지 연결해주는 명사절 접속사 that이 생략되어 있어요. 두 번째로, 이자율이나 가격, 속도를 나타낼 때는 at an interest rate처럼 전치사 at을 쓴다는 점 가볍게 챙겨두면 좋겠네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 이자율은 우리에게 말해 준다.\u003c/span>\u003cspan class=\"en\">This rate tells us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빌려준 돈이 대가를 가진다는 것을\u003c/span>\u003cspan class=\"en\">that \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">money \u003c/span>\u003cspan class=\"tgt\">lent\u003c/span> has \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">cost \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위험을 반영하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">reflects\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">risk \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 상환받지 못할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">repaid \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 기회비용을 (반영하는 대가)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">opportunity \u003c/span>\u003cspan class=\"tgt\">cost\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 돈을 직접 소비하지 않는\u003c/span>\u003cspan class=\"en\">of not spending that money yourself.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 이자율은 빌려준 돈이 여러분이 상환받지 못할 위험과 그 돈을 직접 소비하지 않는 기회비용을 반영하는 대가를 가진다는 것을 우리에게 말해 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이자율이라는 수치 속에 숨겨진 두 가지 핵심 요소를 설명합니다. 돈을 빌려줄 때는 돈을 돌려받지 못할 \u003cb class=\"key\">위험성\u003c/b>과, 그 돈을 내가 지금 당장 쓰지 못해 포기해야 하는 \u003cb class=\"key\">기회비용\u003c/b>에 대한 보상이 필요하다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 후치 수식\u003c/span> : the money [명사] + lent [과거분사] : \"빌려준 돈\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a cost [선행사] + that [주격 관계대명사] + reflects [동사] : \"~를 반영하는 대가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : reflects [동사] + the risk [목적어 1] + and [접속사] + the opportunity cost [목적어 2] : \"상환받지 못할 위험과 기회비용\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">동명사의 의미상 주어, 부정, 수동태\u003c/span> : of [전치사] + you [의미상 주어] + not [부정어] + being repaid [동명사 수동태] : \"여러분이 상환받지 못할 (~위험)\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"This rate tells us, 이 이자율은 우리에게 말해 준다.. that the money lent has a cost, 빌려준 돈이 대가를 가진다는 것을. that reflects the risk, 위험을 반영하는. of you not being repaid, 여러분이 상환받지 못할. and the opportunity cost, 그리고 기회비용을 (반영하는 대가). of not spending that money yourself, 그 돈을 직접 소비하지 않는. 이 문장 전체를 해석하면, 이 이자율은 빌려준 돈이 여러분이 상환받지 못할 위험과 그 돈을 직접 소비하지 않는 기회비용을 반영하는 대가를 가진다는 것을 우리에게 말해 준다.","hl":"m"},{"n":18,"text":"이자율 안에 어떤 의미가 숨어있는지 설명하는 아주 중요한 문장이에요. 이자를 왜 받을까요? 첫째, 돈을 떼일 수 있는 위험성 때문이고, 둘째, 내가 지금 당장 그 돈을 쓰지 못해서 생기는 기회비용에 대한 보상 때문이라는 걸 정확히 짚어주고 있어요.","hl":"mn"},{"n":19,"text":"이 문장은 어법 챙길 게 아주 많습니다. 첫 번째, the money 뒤에 lent라는 과거분사가 와서 money를 뒤에서 꾸며주고 있어요. 돈은 빌려지는 수동의 의미니까 과거분사 형태가 온 거죠. 두 번째, a cost 뒤에 that reflects가 보이는데, 여기서 that은 주격 관계대명사예요. 선행사인 a cost가 단수라서 reflect 뒤에 s가 붙어서 reflects가 된 점 중요해요. 세 번째, 전치사 of 뒤에 동명사가 오는데, 구조가 아주 복잡합니다. you not being repaid 부분을 보면, you는 동명사의 의미상 주어고, 빚을 상환받는 거니까 being repaid 수동태가 쓰였고요, 동명사의 부정은 바로 앞에 not을 붙이는 규칙이 완벽하게 다 들어있어요. 마지막 네 번째로, reflects라는 동사의 목적어로 the risk라는 명사구와 and 뒤의 the opportunity cost라는 명사구가 병렬 구조로 예쁘게 연결되어 있습니다. 서술형 쓰기로 출제되기 딱 좋은 문장이니까 꼭 분석해서 외워두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대출 기간이 길어질수록,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">longer \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">term \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">loan, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상환을 못 받을 가능성이 더 높아지는데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">higher \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">chance \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">won't \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">paid \u003c/span>\u003cspan class=\"tgt\">back\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 먼 미래의 일이 되기 때문이며,\u003c/span>\u003cspan class=\"en\">because it is further into the future\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정의상 알 수 없는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">― \u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">definition \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">unknowable \u003c/span>\u003cspan class=\"tgt\">―\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 여러분이 더 오래 기다려야 할 것이다\u003c/span>\u003cspan class=\"en\">and the longer you will have to wait\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 돈을 직접 소비하기 전까지.\u003c/span>\u003cspan class=\"en\">before spending the money yourself.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대출 기간이 길어질수록, 상환을 못 받을 가능성이 더 높아지는데, 정의상 알 수 없는 더 먼 미래의 일이 되기 때문이며, 여러분이 그 돈을 직접 소비하기 전까지 더 오래 기다려야 할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대출 기간이 길어질수록 리스크가 커진다는 것을 \u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">비교급, \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">비교급\u003c/b> 구문을 통해 강조하는 문장입니다. 미래의 불확실성과 돈을 사용하지 못하는 \u003cb class=\"key\">기회비용\u003c/b>이 기간에 비례해서 커진다는 점을 논리적으로 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">the 비교급 ~, the 비교급 ...\u003c/span> : The + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사 : \"대출 기간이 길어질수록, 가능성이 더 높아진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격 혹은 관계부사 대용 생략\u003c/span> : 명사(the chance) + [(that) + 주어 + 동사(완전한 절)] : \"상환을 못 받을 가능성\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : ,(또는 ―) + which + 불완전한 절 : \"정의상 알 수 없는\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"The longer the term of the loan, 대출 기간이 길어질수록. the higher the chance you won't be paid back, 상환을 못 받을 가능성이 더 높아지는데. because it is further into the future, 더 먼 미래의 일이 되기 때문이며. ― which by definition is unknowable ―, 정의상 알 수 없는. and the longer you will have to wait, 그리고 여러분이 더 오래 기다려야 할 것이다. before spending the money yourself, 그 돈을 직접 소비하기 전까지.. 이 문장 전체를 해석하면, 대출 기간이 길어질수록, 상환을 못 받을 가능성이 더 높아지는데, 정의상 알 수 없는 더 먼 미래의 일이 되기 때문이며, 여러분이 그 돈을 직접 소비하기 전까지 더 오래 기다려야 할 것이다.","hl":"m"},{"n":21,"text":"이 문장은 대출 기간이 길어질수록 리스크가 커진다는 것을 the 비교급, the 비교급 구문을 통해 강조하고 있어요. 미래의 불확실성과 내 돈을 직접 쓰지 못하는 기회비용이 기간에 비례해서 커진다는 점을 논리적으로 잘 설명해주고 있죠.","hl":"mn"},{"n":22,"text":"어법을 살펴볼게요. 첫 번째로 The longer the term, the higher the chance 부분은 the 비교급, the 비교급 구문이에요. 뭐뭐하면 할수록 더 뭐뭐하다라는 뜻으로, 기간과 위험성이 비례 관계에 있음을 나타냅니다. 두 번째로 the chance 뒤에는 동격의 접속사 that이나 관계부사 대용의 that이 생략되어 있어서 뒤에 완전한 절이 이어지고 있어요. 세 번째로 which는 계속적 용법의 관계대명사인데요, 선행사인 the future에 대해 부연 설명을 더해주고 있습니다. 하이픈 사이에 삽입구 형태로 쏙 들어가 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것을 가치 있게 만들기 위해서,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">worthwhile\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돈을 빌려준 사람에게\u003c/span>\u003cspan class=\"en\">for the lender,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비용을 돈이 가져야만 한다\u003c/span>\u003cspan class=\"en\">money has to have a price\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빌린 사람에게는 대가이고\u003c/span>\u003cspan class=\"en\">― a cost to the borrower\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빌려준 사람에게는 수입인\u003c/span>\u003cspan class=\"en\">and income to the lender.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">돈을 빌려준 사람에게 이것을 가치 있게 만들기 위해서, 빌린 사람에게는 대가이고 빌려준 사람에게는 수입인 비용을 돈이 가져야만 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대출에 따르는 리스크와 기회비용을 상쇄하기 위해 \u003cb class=\"key\">이자\u003c/b>라는 개념이 필연적으로 존재해야 함을 설명합니다. 빌리는 사람과 빌려주는 사람 양측의 입장에서 \u003cb class=\"key\">비용의 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 재정의하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : In order + to부정사 : \"~을 만들기 위해서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 동사 make\u003c/span> : make [타동사] + 목적어(this) + 목적격 보어(형용사 worthwhile) : \"이것을 가치 있게 만들다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"In order to make this worthwhile, 이것을 가치 있게 만들기 위해서. for the lender, 돈을 빌려준 사람에게. money has to have a price, 비용을 돈이 가져야만 한다. ― a cost to the borrower, 빌린 사람에게는 대가이고. and income to the lender, 빌려준 사람에게는 수입인. 이 문장 전체를 해석하면, 돈을 빌려준 사람에게 이것을 가치 있게 만들기 위해서, 빌린 사람에게는 대가이고 빌려준 사람에게는 수입인 비용을 돈이 가져야만 한다.","hl":"m"},{"n":24,"text":"대출을 해줄 때 생기는 리스크와 기회비용을 상쇄하려면 이자라는 개념이 필연적으로 존재해야 한다는 걸 설명하는 문장입니다. 돈을 빌리는 사람과 빌려주는 사람 모두의 입장에서 이 비용의 의미를 재정의해주고 있답니다.","hl":"mn"},{"n":25,"text":"어법 포인트 짚고 갈게요. 첫 번째로 In order to make는 뭐뭐하기 위해서라는 목적을 아주 명확히 나타내주는 to부정사의 부사적 용법입니다. 두 번째로 make this worthwhile에서 make는 오형식 동사로 쓰였어요. 목적어 this 뒤에 목적격 보어로 형용사인 worthwhile이 와서 이것을 가치 있게 만들다라는 의미 구조를 잘 보여주고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 비용은\u003c/span>\u003cspan class=\"en\">This price\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감안한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">factors \u003c/span>\u003cspan class=\"tgt\">in\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간의 가치를.\u003c/span>\u003cspan class=\"en\">the value of time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 비용은 시간의 가치를 감안한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 이자라는 '비용'이 결국 무엇을 바탕으로 산정되는지 요약하는 문장입니다. 시간이라는 추상적 개념이 경제적 가치로 \u003cb class=\"key\">환산\u003c/b>된다는 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>를 짚어주고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이어동사 (구동사)\u003c/span> : 동사(factor) + 부사(in) : \"~을 감안하다, 고려하다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"This price, 이 비용은. factors in, 감안한다. the value of time, 시간의 가치를.. 이 문장 전체를 해석하면, 이 비용은 시간의 가치를 감안한다.","hl":"m"},{"n":27,"text":"앞 문장에서 말한 이자라는 비용이 결국 무엇을 바탕으로 계산되는지 단적으로 요약해 주는 문장이에요. 시간이라는 눈에 보이지 않는 개념이 경제적인 가치로 환산된다는 이 글의 핵심 주제를 콕 집어주고 있습니다.","hl":"mn"},{"n":28,"text":"여기서 factors in은 뭐뭐를 감안하다 또는 고려하다라는 뜻을 가진 이어동사예요. 하나의 덩어리로 타동사구 역할을 해서 뒤에 목적어를 바로 취하는데요, 목적어가 일반 명사일 때는 지금처럼 부사 in 뒤에 자연스럽게 자리하게 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">달리 말하면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">another \u003c/span>\u003cspan class=\"tgt\">way\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손 안의 새 한 마리가\u003c/span>\u003cspan class=\"en\">a bird in the hand\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가치가 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">worth\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">덤불 속의 두 마리만큼의\u003c/span>\u003cspan class=\"en\">two in the bush.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">달리 말하면, 손 안의 새 한 마리가 덤불 속의 두 마리만큼의 가치가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유명한 영어 속담을 인용해 지문의 핵심을 요약하는 문장입니다. 손 안의 새는 현재 내가 가진 \u003cb class=\"key\">확실한 \u003c/b>\u003cb class=\"key\">돈\u003c/b>을, 덤불 속의 두 마리는 미래에 이자와 함께 돌려받을 \u003cb class=\"key\">불확실한 \u003c/b>\u003cb class=\"key\">돈\u003c/b>을 비유합니다. 즉, 미래의 불확실성을 감수하려면 그에 상응하는 추가적인 가치가 필요하다는 의미를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">독립부사구\u003c/span> : To put + [it (목적어)] + [another way (부사구)] : \"달리 말하면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사 worth의 용법\u003c/span> : be + [worth (형용사/전치사적)] + [명사(구)] : \"~의 가치가 있다\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"To put it another way, 달리 말하면. a bird in the hand, 손 안의 새 한 마리가. is worth, 가치가 있다. two in the bush, 덤불 속의 두 마리만큼의. 이 문장 전체를 해석하면, 달리 말하면, 손 안의 새 한 마리가 덤불 속의 두 마리만큼의 가치가 있다.","hl":"m"},{"n":30,"text":"이 문장은 영어의 아주 유명한 속담을 빌려와서 글 전체의 주제를 요약해 주고 있어요. 여기서 손 안의 새는 지금 내가 손에 쥐고 있는 확실한 돈을 뜻하고요. 덤불 속의 두 마리는 미래에 이자를 쳐서 받을 수도 있지만 확실하지는 않은 불확실한 돈을 뜻해요. 그러니까 확실한 현재의 가치가 불확실한 미래의 가치보다 크기 때문에, 남에게 돈을 빌려줄 때는 이자라는 보상이 꼭 필요하다는 걸 멋지게 비유한 거랍니다.","hl":"mn"},{"n":31,"text":"어법 포인트도 살펴볼게요. 첫 번째로 To put it another way는 독립적으로 문장 전체를 꾸며주는 to 부정사 관용구예요. 여기서 put은 놓다가 아니라 표현하다나 말하다라는 뜻이라서 달리 말하자면이라는 뜻이 됩니다. 두 번째로 is worth에서 worth는 형용사지만 마치 전치사처럼 뒤에 바로 명사를 데리고 와서 무엇무엇의 가치가 있다라는 뜻을 만들어요. 여기서는 뒤에 명사 two가 왔죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>돈을 빌려주는 행위를 통해 \u003cb class=\"key\">이자율\u003c/b>이 시간에 대한 사람들의 \u003cb class=\"key\">인식\u003c/b>에 미치는 영향을 알 수 있습니다.\u003c/li>\u003cli>이자율은 상환받지 못할 \u003cb class=\"key\">위험\u003c/b>과 돈을 직접 쓰지 못하는 \u003cb class=\"key\">기회비용\u003c/b>에 대한 대가입니다.\u003c/li>\u003cli>대출 \u003cb class=\"key\">기간\u003c/b>이 길어질수록 미래의 불확실성이 커져 상환 불이행 위험과 대기 시간이 증가합니다.\u003c/li>\u003cli>돈의 가격인 이자율은 결국 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 반영하며, 이는 불확실한 미래보다 확실한 \u003cb class=\"key\">현재\u003c/b>가 더 가치 있음을 의미합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The interest rate serves as the price of money, reflecting the value of time, the risk of non-repayment, and opportunity cost.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">돈을 빌려줄 때 발생하는 상환받지 못할 위험과 기회비용을 보상하기 위해 \u003cb class=\"key\">이자율\u003c/b>이라는 가격이 매겨지며, 이는 결국 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 반영한다는 내용입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":32,"text":"자, 이렇게 해서 이자율이 시간의 가치와 위험, 기회비용을 어떻게 반영하는지 상세히 분석해 보았습니다. 돈의 가격이라는 것이 결국 현재와 미래에 대한 불확실성을 수치화한 것이라는 점을 잘 기억해 두세요. 오늘 강의는 여기까지입니다. 복습 철저히 하시고 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
