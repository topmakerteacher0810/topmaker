</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 38번","audioDir":"38_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">38번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>Different Safety Limits of Water Quality Depending on Its Use\u003c/h1>\u003ch2>물의 용도에 따라 다르게 설정되는 수질 안전 허용치\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>수질은 단순히 겉모습이 아니라 특정한 \u003cb class=\"key\">기준\u003c/b>을 따르는 것이며, 물의 다양한 \u003cb class=\"key\">용도\u003c/b>에 따라 각기 다른 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">허용치\u003c/b>가 설정되어야 합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Water quality criteria and safety limits vary depending on how the water will be utilized.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 함께 살펴볼 지문은 물의 수질 기준이 용도에 따라 어떻게 달라지는지에 대한 글이에요. 물이 그저 맑아 보인다고 해서 다 같은 기준을 적용받는 게 아니라는 흥미로운 내용이죠. 요약하자면, 수질은 특정한 기준을 따르는 것이며 물의 다양한 용도에 따라 각기 다른 안전 허용치가 설정되어야 한다는 내용입니다. 자, 그럼 핵심 요지인 용도에 따라 다른 안전 허용치가 적용된다는 점을 염두에 두고 자세히 들어가 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">수질(Water quality)을 평가할 때 우리는 단순히 눈에 보이는 맑음 정도만 따지지 않습니다. 물속에 들어 있는 다양한 물질들을 측정하여 특정한 \u003cb class=\"key\">지표\u003c/b>(benchmarks)를 통과해야 비로소 안전하다고 판정하죠. 마치 우리가 옷을 살 때 모든 사람에게 맞는 \u003cb class=\"key\">일률적인\u003c/b>(one size fits all) 프리사이즈 옷만 있지 않고 체형이나 목적에 따라 사이즈가 나뉘는 것과 같습니다. 물도 마실 때, 농사를 지을 때, 공장을 돌릴 때 필요한 \u003cb class=\"key\">용도\u003c/b>가 다릅니다. 따라서 각 상황에 맞게 물리적, 화학적, 생물학적 허용량을 규정한 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">허용치\u003c/b>(safety limits)를 각각 다르게 설정하는 것이 필수적입니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 분석에 앞서 배경지식을 조금 쌓아볼게요. 수질을 평가할 때 우리는 단순히 눈에 보이는 맑음 정도만 따지지 않아요. 물속에 들어 있는 다양한 물질들을 측정하여 특정한 지표를 통과해야 비로소 안전하다고 판정하죠. 마치 우리가 옷을 살 때 모든 사람에게 맞는 일률적인 프리사이즈 옷만 있지 않고 체형이나 목적에 따라 사이즈가 나뉘는 것과 같아요. 물도 마실 때, 농사를 지을 때, 공장을 돌릴 때 필요한 용도가 다릅니다. 따라서 각 상황에 맞게 물리적, 화학적, 생물학적 허용량을 규정한 안전 허용치를 각각 다르게 설정하는 것이 필수적이랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 정의\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>물이 깨끗하다는 것은 단순히 겉모습이 아니라 특정한 \u003cb class=\"key\">기준\u003c/b>이나 \u003cb class=\"key\">지표\u003c/b>를 따르는 것임을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>지침의 역할\u003csmall>부연 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>이 지침들은 물속의 물질 허용량을 알려주며, 다양한 사용 목적에 맞게 물이 \u003cb class=\"key\">안전\u003c/b>하다고 보장하는 역할을 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>일률적 규칙의 한계\u003csmall>주장 · 문장 5\u003c/small>\u003c/h4>\u003cp>물은 아주 다양한 일에 사용되므로, 모두에게 동일한 \u003cb class=\"key\">일률적인\u003c/b> 규칙을 적용할 수는 없다고 주장합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>용도별 기준 차이\u003csmall>예시 및 결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>발전소와 식수의 수질 기준 차이를 예로 들며, 물의 \u003cb class=\"key\">활용\u003c/b> 방법에 따라 각기 다른 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">허용치\u003c/b>를 설정한다는 결론을 내립니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 수질의 개념을 먼저 정의하고, 그 기준이 용도에 따라 어떻게 달라져야 하는지를 논리적으로 전개하고 있습니다.","hl":null},{"n":4,"text":"첫 번째부터 두 번째 문장에서는 도입과 개념 정의를 하고 있어요. 물이 깨끗하다는 것은 단순히 겉모습이 아니라 특정한 기준이나 지표를 따르는 것임을 명확히 설명합니다. 겉으로만 맑아 보인다고 다 안전한 건 아니라는 거죠.","hl":"f0"},{"n":5,"text":"세 번째부터 네 번째 문장에서는 이런 지침들의 역할을 이야기합니다. 이 지침들은 물속의 물질 허용량을 알려주며, 다양한 사용 목적에 맞게 물이 안전하다고 보장해 주는 역할을 한다고 설명하고 있어요.","hl":"f1"},{"n":6,"text":"다섯 번째 문장에서는 중요한 한계점을 제시합니다. 물은 아주 다양한 일에 사용되므로, 모두에게 동일한 일률적인 규칙을 적용할 수는 없다고 강력하게 주장하죠. 한 가지 사이즈가 모두에게 맞을 수는 없다는 비유가 아주 인상적입니다.","hl":"f2"},{"n":7,"text":"마지막 여섯 번째 문장에서는 구체적인 예시와 결론을 보여줍니다. 발전소를 식히는 물과 우리가 마시는 식수의 수질 기준 차이를 예로 들면서, 결국 물의 활용 방법에 따라 각기 다른 안전 허용치를 설정해야 한다는 결론을 짓고 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-예시\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부에서 수질의 개념을 \u003cb class=\"key\">지표\u003c/b>를 따르는 것으로 정의합니다. 이후 물의 사용처가 다양하므로 \u003cb class=\"key\">일률적인\u003c/b> 규칙을 쓸 수 없다는 핵심 주장을 제시합니다. 마지막으로 식수와 산업용수의 구체적인 \u003cb class=\"key\">예시\u003c/b>를 통해 용도에 따른 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">허용치\u003c/b> 설정이라는 결론을 강조하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For instance (6)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>This is why (6)\u003c/b>\u003cspan>결론/인과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a certain set of criteria\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">benchmarks\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">These guidelines\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">These rules\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">different safety limits\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>식수 (water you drink from the kitchen tap)\u003c/th>\u003cth>산업용수 (water that cools down a power plant generator)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>가장 깨끗해야 함\u003c/td>\u003ctd>그만큼 깨끗할 필요 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>엄격한 안전 허용치\u003c/td>\u003ctd>상대적으로 관대한 안전 허용치\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식을 살펴볼게요. 처음에는 개념을 정의하고, 이어서 일률적인 기준을 적용할 수 없다는 주장을 펼친 후, 구체적인 예시로 뒷받침하는 방식입니다. 핵심 주장이 글의 끝부분 예시와 함께 강조되고 있어서 양괄식 구조로 볼 수 있어요. 앞서 말한 지표라는 개념이 뒤로 가면서 어떻게 다르게 적용되는지 흐름을 타는 게 중요합니다.","hl":"ty"},{"n":9,"text":"글의 구조를 잡아주는 중요한 신호어들을 볼까요? 여섯 번째 문장에 나오는 For instance는 아주 구체적인 예시가 시작됨을 알려주는 고마운 신호어예요. 그리고 같은 문장 끝부분의 This is why는 앞의 예시를 바탕으로 최종적인 인과 관계, 즉 결론을 이끌어내고 있습니다. 또한 a certain set of criteria, benchmarks, these guidelines 같은 표현들이 계속해서 같은 개념을 다른 단어로 바꿔 말하고 있다는 점도 꼭 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>clean\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>깨끗한\u003c/span>\u003c/div>\u003cdiv>\u003cb>mean\u003c/b>\u003cem>동사\u003c/em>\u003cspan>의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질, 수질\u003c/span>\u003c/div>\u003cdiv>\u003cb>follow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>certain\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>특정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>criteria\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기준들\u003c/span>\u003c/div>\u003cdiv>\u003cb>benchmark\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지표, 기준점\u003c/span>\u003c/div>\u003cdiv>\u003cb>guideline\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지침\u003c/span>\u003c/div>\u003cdiv>\u003cb>inform\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알려주다, 통지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>exactly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>정확히\u003c/span>\u003c/div>\u003cdiv>\u003cb>physical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>물리적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>chemical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>화학적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>biological\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>생물학적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>stuff\u003c/b>\u003cem>명사\u003c/em>\u003cspan>것, 물질\u003c/span>\u003c/div>\u003cdiv>\u003cb>ensure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>crop\u003c/b>\u003cem>명사\u003c/em>\u003cspan>작물\u003c/span>\u003c/div>\u003cdiv>\u003cb>industrial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>산업의, 산업용의\u003c/span>\u003c/div>\u003cdiv>\u003cb>utilize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>활용하다, 이용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>one size fits all\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일률적인, 널리 적용되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>diverse\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다양한\u003c/span>\u003c/div>\u003cdiv>\u003cb>for instance\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>cool down\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 식히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>generator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발전기\u003c/span>\u003c/div>\u003cdiv>\u003cb>tap\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수도꼭지\u003c/span>\u003c/div>\u003cdiv>\u003cb>limit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>허용치, 한계\u003c/span>\u003c/div>\u003cdiv>\u003cb>dependent on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 따라, ~에 의존하는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문 속 핵심 단어도 몇 가지 짚고 넘어갈게요. criteria는 기준들이라는 뜻의 복수명사로 정말 자주 나오니까 꼭 외워두셔야 해요. utilize는 단순히 쓰다라는 use보다 좀 더 격식 있게 활용하다라는 뜻으로 쓰였고요. one size fits all은 모든 것에 다 들어맞는, 즉 일률적인이라는 뜻의 유용한 표현입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">criteria\u003c/b>\u003cspan class=\"m\">기준들\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">standards\u003c/span>\u003cspan class=\"s\">guidelines\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ensure\u003c/b>\u003cspan class=\"m\">보장하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guarantee\u003c/span>\u003cspan class=\"s\">assure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">diverse\u003c/b>\u003cspan class=\"m\">다양한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">various\u003c/span>\u003cspan class=\"s\">different\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uniform\u003c/span>\u003cspan class=\"a\">identical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">utilize\u003c/b>\u003cspan class=\"m\">활용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">use\u003c/span>\u003cspan class=\"s\">apply\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">limit\u003c/b>\u003cspan class=\"m\">한계, 허용치\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">bound\u003c/span>\u003cspan class=\"s\">restriction\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"어휘력을 더 높여볼까요? criteria의 동의어로는 standards나 guidelines가 있어요. ensure는 보장하다라는 뜻인데 guarantee나 assure와 바꿔 쓸 수 있죠. 그리고 diverse는 다양한이라는 뜻으로 various나 different와 같은 의미지만, 반대말로는 똑같다는 뜻의 uniform이나 identical을 알아두시면 아주 좋습니다. utilize의 동의어로는 use나 apply가 있겠네요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 말할 때,\u003c/span>\u003cspan class=\"en\">When we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">say \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물이 ‘깨끗하다’라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">&quot;clean,&quot;\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 단지 의미하지는 않는다\u003c/span>\u003cspan class=\"en\">we don't just \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">mean \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 마실 물 한 잔처럼 보인다는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">looks \u003c/span>\u003cspan class=\"tgt\">like\u003c/span> a glass of water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 물이 ‘깨끗하다’라고 말할 때, 우리는 단지 그것이 마실 물 한 잔처럼 보인다는 것을 의미하지는 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물이 깨끗하다는 것이 단순히 시각적으로 투명하다는 것을 의미하는 게 아님을 밝히며, 이 글의 핵심 화두인 \u003cb class=\"key\">수질의 \u003c/b>\u003cb class=\"key\">진정한 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 도입하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : say [타동사] + [that + S + V (명사절/목적어)] : \"물이 '깨끗하다'라고 말하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : mean [타동사] + [that + S + V (명사절/목적어)] : \"그것이 ~처럼 보인다는 것을 의미하다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"When we say, 우리가 말할 때. that water is \"clean,\", 물이 ‘깨끗하다’라고. we don't just mean, 우리는 단지 의미하지는 않는다. that it looks like a glass of water, 그것이 마실 물 한 잔처럼 보인다는 것을.. 이 문장 전체를 해석하면, 우리가 물이 ‘깨끗하다’라고 말할 때, 우리는 단지 그것이 마실 물 한 잔처럼 보인다는 것을 의미하지는 않는다.","hl":"m"},{"n":13,"text":"물이 깨끗하다는 게 단순히 눈으로 보기에 투명하고 맑다는 것만을 의미하는 건 아니라고 이야기하고 있어요. 이 문장은 수질의 진정한 의미가 무엇인지 호기심을 유발하며 글의 문을 여는 역할을 하죠.","hl":"mn"},{"n":14,"text":"어법 포인트 짚어볼게요. 첫 번째로 say 뒤에 나오는 that은 목적어 역할을 하는 명사절 접속사 that이에요. '물이 깨끗하다라고' 말할 때처럼 해석되죠. 두 번째로 mean 뒤에 나오는 that도 마찬가지로 목적어 역할을 하는 명사절 접속사예요. 문장 구조가 say that, mean that으로 아주 비슷하게 흘러가고 있다는 점을 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수질은 ~이다\u003c/span>\u003cspan class=\"en\">Water quality is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정한 기준들의 집합을 따르는 것에 관한 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">following\u003c/span> a certain set of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">criteria, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 ‘지표들’을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">&quot;benchmarks.&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수질은 특정한 기준들의 집합, 즉 ‘지표들’을 따르는 것에 관한 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수질 판단은 눈으로 보는 것이 아니라 객관적이고 구체적인 \u003cb class=\"key\">기준\u003c/b>을 충족해야 함을 명확히 정의하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사의 목적어(동명사)\u003c/span> : about [전치사] + [following (동명사)] : \"따르는 것에 관한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격의 or\u003c/span> : A + or + B (A 즉 B) : \"기준들, 즉 '지표들'\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Water quality is, 수질은 ~이다. about following a certain set of criteria, 특정한 기준들의 집합을 따르는 것에 관한 것. or \"benchmarks.\", 즉 ‘지표들’을.. 이 문장 전체를 해석하면, 수질은 특정한 기준들의 집합, 즉 ‘지표들’을 따르는 것에 관한 것이다.","hl":"m"},{"n":16,"text":"앞 문장에서 눈으로 보는 게 다가 아니라고 했잖아요? 그럼 깨끗한 물이란 뭐냐, 바로 객관적이고 구체적인 기준을 따르는 것이 수질이라고 정의하고 있어요.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 about following이에요. about이라는 전치사 뒤에는 명사가 와야 하니까 동사 follow가 동명사 following으로 바뀐 거랍니다. 두 번째로 criteria, or benchmarks에서 or를 볼까요? 여기서 or는 선택을 나타내는 게 아니라, 앞의 criteria와 뒤의 benchmarks가 같다는 것을 보여주는 동격의 or예요. 즉, '기준, 다시 말해 지표' 이렇게 해석하시면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 지침들은 우리에게 정확히 알려 준다\u003c/span>\u003cspan class=\"en\">These guidelines \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">inform \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">exactly \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼마나 많은 물리적, 화학적, 혹은 생물학적인 것들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">physical, \u003c/span>\u003cspan class=\"tgt\">chemical, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">biological \u003c/span>\u003cspan class=\"tgt\">stuff \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물 안에 있을 수 있는지를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 지침들은 우리에게 정확히 얼마나 많은 물리적, 화학적, 혹은 생물학적인 것들이 물 안에 있을 수 있는지를 알려 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 '기준(지침)'이 무엇을 하는지 구체적으로 설명하며, 물속에 허용되는 다양한 물질의 양을 정하는 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">허용치\u003c/b>의 개념을 소개합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 동사 inform + 간접의문문\u003c/span> : inform [4형식 동사] + us [간접목적어] + [how + 형용사 + 명사 + V (간접의문문/직접목적어)] : \"우리에게 ~가 얼마나 많이 물에 있을 수 있는지 알려주다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사=주어)\u003c/span> : [how much + 형용사 + 명사 (의문사구/주어)] + [can be (동사)] : \"얼마나 많은 ~한 것들이 있을 수 있는지\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"These guidelines inform us exactly, 이러한 지침들은 우리에게 정확히 알려 준다. how much physical, chemical, or biological stuff, 얼마나 많은 물리적, 화학적, 혹은 생물학적인 것들이. can be in the water, 물 안에 있을 수 있는지를.. 이 문장 전체를 해석하면, 이러한 지침들은 우리에게 정확히 얼마나 많은 물리적, 화학적, 혹은 생물학적인 것들이 물 안에 있을 수 있는지를 알려 준다.","hl":"m"},{"n":19,"text":"방금 말한 지표나 기준들이 무슨 역할을 하느냐를 설명하고 있어요. 물속에 물리적, 화학적, 생물학적인 물질이 얼만큼 들어 있어도 되는지, 그 양을 정하는 안전 허용치 개념을 소개하는 문장이에요.","hl":"mn"},{"n":20,"text":"중요한 어법이 나오네요. 첫 번째로 inform은 사형식 동사로 쓰여서 us가 간접목적어, 즉 누구누구에게가 되고요. 그 뒤에 나오는 how부터 문장 끝까지가 직접목적어예요. 그리고 이 직접목적어 자리에 온 간접의문문 구조를 잘 봐야 해요. 두 번째 포인트로 넘어갈게요. 의문사 how가 much와 그 뒤의 명사 stuff까지 하나로 묶어서 how much physical, chemical, or biological stuff라는 아주 긴 의문사구를 만들었어요. 그리고 이 덩어리가 의문사인 동시에 주어 역할을 하기 때문에, 따로 주어가 나오지 않고 바로 조동사 can과 동사 be가 이어지는 어순을 꼭 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 규칙들은 보장한다\u003c/span>\u003cspan class=\"en\">These rules \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">ensure \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 물이 안전하다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water\u003c/span> is safe\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 그것으로 하고 싶은 어떤 것에 대해서든\u003c/span>\u003cspan class=\"en\">for \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">anything \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span> with it,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 집에서 물을 마시는 것이든\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">that's \u003c/span>\u003cspan class=\"tgt\">drinking \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">home, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">농장에서 작물들에 물을 주는 것이든\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">watering \u003c/span>\u003cspan class=\"tgt\">crops \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">farm, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 거대한 산업용 보일러를 통해 물을 흘려보내는 것이든 간에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">running \u003c/span>\u003cspan class=\"tgt\">it\u003c/span> through a huge industrial boiler.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 규칙들은 우리가 물로 하고 싶은 것이 집에서 물을 마시는 것이든, 농장에서 작물들에 물을 주는 것이든, 혹은 거대한 산업용 보일러를 통해 물을 흘려보내는 것이든 간에 그것에서 그 물이 안전하다고 보장한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 수질 기준이 필요한 이유를 구체적인 \u003cb class=\"key\">물 \u003c/b>\u003cb class=\"key\">사용 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 들어 설명하고 있어요. 일상, 농업, 산업 등 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에 맞춰 수질 기준이 물의 안전을 보장한다는 걸 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that의 생략\u003c/span> : ensure [타동사] + [(that) + S + V] : \"그 물이 안전하다고 보장하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : anything [선행사] + [(that) + S + V] : \"우리가 하고 싶은 어떤 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">whether A, B, or C (병렬 구조)\u003c/span> : whether + [V-ing], [V-ing], or [V-ing] : \"그것이 집에서 물을 마시는 것이든, 농장에서 작물들에 물을 주는 것이든, 혹은 흘려보내는 것이든 간에\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"These rules ensure, 이러한 규칙들은 보장한다. the water is safe, 그 물이 안전하다고. for anything we want to do with it, 우리가 그것으로 하고 싶은 어떤 것에 대해서든. whether that's drinking it at home, 그것이 집에서 물을 마시는 것이든. watering crops on a farm, 농장에서 작물들에 물을 주는 것이든. or running it through a huge industrial boiler, 혹은 거대한 산업용 보일러를 통해 물을 흘려보내는 것이든 간에. 이 문장 전체를 해석하면, 이러한 규칙들은 우리가 물로 하고 싶은 것이 집에서 물을 마시는 것이든, 농장에서 작물들에 물을 주는 것이든, 혹은 거대한 산업용 보일러를 통해 물을 흘려보내는 것이든 간에 그것에서 그 물이 안전하다고 보장한다.","hl":"m"},{"n":22,"text":"이 문장은 수질 기준이 필요한 이유를 구체적인 물 사용 목적을 들어 설명하고 있어요. 일상이나 농업, 그리고 산업 등 다양한 상황에 맞춰 수질 기준이 물의 안전을 보장한다는 걸 확실히 보여주는 부분이죠.","hl":"mn"},{"n":23,"text":"어법 포인트 짚어볼게요. 첫 번째로 ensure 뒤에 접속사 that이 생략되어 있어서 바로 주어와 동사가 이어집니다. 두 번째로 anything 뒤에도 목적격 관계대명사가 생략되어서 we want to do가 anything을 꾸며주고 있어요. 세 번째는 whether 뒤에 이어지는 병렬 구조인데요. drinking, watering, 그리고 running이 or로 연결되어 동명사 형태를 나란히 맞추고 있다는 점 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 활용할 수 없다\u003c/span>\u003cspan class=\"en\">We can't utilize\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모두에게 동일한 '일률적인' 규칙을\u003c/span>\u003cspan class=\"en\">the same &quot;one size fits all&quot; rule for everyone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 물을 사용하기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아주 많은 다양한 일에\u003c/span>\u003cspan class=\"en\">for so many diverse things.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 물을 아주 많은 다양한 일에 사용하기 때문에 우리는 동일한 ‘일률적인’ 규칙을 모두에게 활용할 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물의 사용 목적이 다양하므로, 모든 상황에 \u003cb class=\"key\">단일한 \u003c/b>\u003cb class=\"key\">기준\u003c/b>을 적용할 수는 없다는 점을 강조해요. 앞 문장의 여러 예시들을 포괄하며 \u003cb class=\"key\">맞춤형 \u003c/b>\u003cb class=\"key\">수질 \u003c/b>\u003cb class=\"key\">기준\u003c/b>의 필요성을 암시하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유의 부사절 접속사\u003c/span> : because + S + V : \"우리가 물을 사용하기 때문에\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"We can't utilize, 우리는 활용할 수 없다. the same \"one size fits all\" rule for everyone, 모두에게 동일한 '일률적인' 규칙을. because we use water, 우리가 물을 사용하기 때문에. for so many diverse things, 아주 많은 다양한 일에. 이 문장 전체를 해석하면, 우리가 물을 아주 많은 다양한 일에 사용하기 때문에 우리는 동일한 ‘일률적인’ 규칙을 모두에게 활용할 수 없다.","hl":"m"},{"n":25,"text":"우리가 물을 쓰는 목적이 아주 다양하잖아요. 그래서 모든 상황에 단일한 기준을 똑같이 적용할 수는 없다는 점을 강조하는 문장이에요. 앞서 나온 여러 예시들을 하나로 묶으면서 맞춤형 수질 기준이 필요하다는 걸 암시하고 있죠.","hl":"mn"},{"n":26,"text":"여기서는 접속사 because가 이끄는 부사절을 잘 봐야 해요. 주절에서 일률적인 규칙을 쓸 수 없다고 말한 뒤에, because 절에서 우리가 물을 아주 다양한 일에 사용한다는 그 명확한 원인을 덧붙여 설명하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 물은\u003c/span>\u003cspan class=\"en\">For instance, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 발전소의 발전기를 식히는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">cools \u003c/span>\u003cspan class=\"tgt\">down\u003c/span> a huge power plant generator\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깨끗할 필요가 없다\u003c/span>\u003cspan class=\"en\">doesn't need to be \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">clean \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 마시는 물만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">water\u003c/span> you drink\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주방 수도꼭지로부터. 이것이 ~한 이유이다\u003c/span>\u003cspan class=\"en\">from the kitchen tap.\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">why\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집단들이 물에 대한 각기 다른 '안전 허용치'를 설정하는\u003c/span>\u003cspan class=\"en\">groups set different &quot;safety limits&quot; for the water\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 어떻게 활용될지에 따라\u003c/span>\u003cspan class=\"en\">dependent on \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">utilized\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 거대한 발전소의 발전기를 식히는 물은 여러분이 주방 수도꼭지로부터 마시는 물만큼 깨끗할 필요가 없다. 이것이 물이 어떻게 활용될지에 따라 집단들이 그것에 대한 각기 다른 ‘안전 허용치’를 설정하는 이유이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 산업용 물과 식수라는 극단적인 비교를 통해, 용도에 따라 요구되는 \u003cb class=\"key\">청정도의 \u003c/b>\u003cb class=\"key\">차이\u003c/b>를 명확히 보여줍니다. 결국 수질 기준은 일률적인 것이 아니라 \u003cb class=\"key\">사용 \u003c/b>\u003cb class=\"key\">목적에 \u003c/b>\u003cb class=\"key\">따른 \u003c/b>\u003cb class=\"key\">맞춤형\u003c/b>이라는 이 글의 핵심 주제를 완성하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 및 수일치\u003c/span> : 명사(단수) + that [주격 관계대명사] + 단수동사 : \"식히는 물\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동등 비교\u003c/span> : as + 형용사/부사 원급 + as : \"그 물만큼 깨끗한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">결과를 나타내는 부사절 유도\u003c/span> : This is why + S + V : \"이것이 ~한 이유이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사 + 주어 + 동사 : \"그것이 어떻게 활용될지\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"For instance, the water, 예를 들어, 물은. that cools down a huge power plant generator, 거대한 발전소의 발전기를 식히는. doesn't need to be as clean, 깨끗할 필요가 없다. as the water you drink, 여러분이 마시는 물만큼. from the kitchen tap.This is why, 주방 수도꼭지로부터. 이것이 ~한 이유이다. groups set different \"safety limits\" for the water, 집단들이 물에 대한 각기 다른 '안전 허용치'를 설정하는. dependent on how it will be utilized, 그것이 어떻게 활용될지에 따라. 이 문장 전체를 해석하면, 예를 들어, 거대한 발전소의 발전기를 식히는 물은 여러분이 주방 수도꼭지로부터 마시는 물만큼 깨끗할 필요가 없다. 이것이 물이 어떻게 활용될지에 따라 집단들이 그것에 대한 각기 다른 ‘안전 허용치’를 설정하는 이유이다.","hl":"m"},{"n":28,"text":"발전소를 식히는 물과 우리가 마시는 식수라는 아주 대조적인 예시를 들고 있어요. 용도에 따라 요구되는 청정도의 차이를 명확히 보여주면서, 수질 기준은 일률적인 게 아니라 사용 목적에 따른 맞춤형이라는 이 글의 핵심 주제를 완벽하게 정리해 주는 문장이랍니다.","hl":"mn"},{"n":29,"text":"어법 꼼꼼히 살펴볼게요. 첫 번째로 the water 뒤에 주격 관계대명사 that이 와서 발전기를 식히는 물이라고 수식하고 있는데, 선행사가 단수니까 동사도 cools로 수일치했어요. 두 번째는 as clean as 동등 비교 구문으로, 뒤에 나오는 물만큼 깨끗할 필요는 없다는 의미를 만듭니다. 형용사 원급이 온다는 것 잊지 마시고요. 세 번째로 This is why 뒤에는 결과가 이어지면서 앞의 내용이 원인이 됨을 보여줍니다. 마지막으로 dependent on 뒤의 전치사 목적어 자리에 의문사 주어 동사 순서의 간접의문문이 쓰였다는 것도 서술형으로 나오기 좋은 중요 출제 포인트입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>물이 깨끗하다는 것은 겉모습이 아니라 특정한 \u003cb class=\"key\">기준\u003c/b>과 지표를 따르는가에 관한 문제입니다.\u003c/li>\u003cli>수질 지침들은 물속의 다양한 물질들이 얼마나 들어있어도 되는지 \u003cb class=\"key\">허용량\u003c/b>을 정확히 알려줍니다.\u003c/li>\u003cli>물은 가정, 농장, 산업 등 아주 다양한 \u003cb class=\"key\">용도\u003c/b>로 사용되기 때문에 일률적인 규칙을 적용할 수 없습니다.\u003c/li>\u003cli>따라서 물이 어떻게 활용될지에 따라 각기 다른 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">허용치\u003c/b>를 설정하는 것이 필요합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Water quality criteria and safety limits vary depending on how the water will be utilized.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">수질은 단순히 겉모습이 아니라 특정한 \u003cb class=\"key\">기준\u003c/b>을 따르는 것이며, 물의 다양한 \u003cb class=\"key\">용도\u003c/b>에 따라 각기 다른 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">허용치\u003c/b>가 설정되어야 합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"자, 이렇게 해서 수질 기준과 물의 용도에 따른 차이를 다룬 지문을 모두 분석해 보았습니다. 물이 활용되는 목적에 따라 안전 허용치가 다르게 설정된다는 핵심 내용, 확실히 이해되셨죠? 복습할 때 동의어와 지시어들이 어떻게 연결되는지 다시 한번 확인해 보시길 바라요. 오늘도 수고 많으셨고, 다음 시간에 또 만나요!","hl":null}]}]});</script></body></html>
