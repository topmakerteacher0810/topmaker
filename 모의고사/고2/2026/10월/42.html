<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 41~42번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 41~42번","audioDir":"42_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.707em\">41~42번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>The Hidden Value of Boredom: An Opportunity for Self-Reflection\u003c/h1>\u003ch2>무료함의 숨겨진 가치: 자기 성찰을 위한 기회\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>무료함은 자칫 해로운 감정을 유발할 수 있다고 여겨지지만, 사실 위험이 없는 안전한 상태에서만 누릴 수 있는 특권이며 이를 낭비된 시간으로 볼 것이 아니라 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">성찰\u003c/b>과 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">발달\u003c/b>을 위한 긍정적인 기회로 활용해야 합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>We should reframe boredom not as a negative or unproductive state, but as a valuable luxury that provides an opportunity for profound self-reflection and personal growth.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 함께 살펴볼 지문은 무료함이 가진 놀라운 가치에 대해 이야기하고 있습니다. 보통 우리는 지루하고 아무것도 안 하는 시간을 낭비라고 생각하죠? 하지만 이 글은 무료함이야말로 진정한 자기 성찰과 개인적 발달을 위한 기회라고 강조합니다. 글의 핵심을 잘 파악하면서 함께 분석해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">현대 사회에서는 끊임없는 자극(stimulation)이 주어지다 보니, 아무것도 안 하는 시간이 생기면 우리는 불안해합니다. 그래서 '아무것도 안 하는 시간은 악마의 작업장이다'라는 말처럼 지루함을 부정적으로 여깁니다. 하지만 심리학자들은 무료함(boredom)이 뇌가 쉴 수 있는 필수적인 시간이라고 말합니다. 마치 화면이 꺼져야 충전되는 \u003cb class=\"key\">스마트폰\u003c/b> 배터리처럼, 뇌도 외부 자극이 차단된 시간 동안 깊은 생각과 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">성찰\u003c/b>(self-reflection)을 할 수 있습니다. 즉, 생존의 위협이 없는 \u003cb class=\"key\">안전지대\u003c/b>(safe zone)에서만 누릴 수 있는 일종의 \u003cb class=\"key\">사치\u003c/b>(luxury)이므로 이를 성장의 기회로 삼아야 합니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 독해에 앞서 배경지식을 조금 쌓아 볼게요. 현대 사회에서는 끊임없는 자극, 즉 스티뮬레이션이 주어지다 보니, 아무것도 안 하는 시간이 생기면 우리는 왠지 불안해합니다. 그래서 스마트폰을 자꾸 들여다보곤 하죠. 하지만 심리학자들은 무료함, 즉 보어덤이 뇌가 쉴 수 있는 안전지대라고 말합니다. 스마트폰 화면이 꺼져야 배터리가 충전되는 것처럼, 뇌도 외부 자극이 차단된 사치스러운 시간 동안 깊은 생각과 자기 성찰을 할 수 있다는 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>무료함의 부정적 인식\u003csmall>통념 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>무료함을 적절히 다루지 못하면 우울이나 짜증 같은 \u003cb class=\"key\">해로운 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 유발할 수 있습니다. 항상 재미만 추구하면 오히려 부정적인 생각이 들고, 아무것도 안 하는 시간은 문제를 일으킨다는 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">인식\u003c/b>이 존재합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>인식의 전환\u003csmall>전환 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>하지만 무료함을 낭비된 시간이 아니라 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">개선\u003c/b>과 긍정적인 성찰의 시간으로 바라보는 \u003cb class=\"key\">인식의 \u003c/b>\u003cb class=\"key\">전환\u003c/b>이 필요합니다. 필자는 우리가 무료할 수 있다는 것 자체가 사실은 매우 큰 행운이라고 반문합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>무료함의 전제 조건\u003csmall>근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>무료함은 생존을 위협하는 위험한 상황에서는 결코 존재할 수 없습니다. 즉, 무료함은 안전하고 할 일이 없는 상황에서만 주어지는 일종의 \u003cb class=\"key\">사치\u003c/b>이자, 주변 환경을 이해할 수 있는 \u003cb class=\"key\">안전지대\u003c/b>의 특권이라는 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>무료함의 적극적 활용\u003csmall>결론 · 문장 9–11\u003c/small>\u003c/h4>\u003cp>그러므로 아무것도 안 하는 순간을 심오한 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">성찰\u003c/b>을 위해 활용하는 것이 가장 중요합니다. 무료함을 비생산적으로 여기기보다 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">발달\u003c/b>과 건설적인 사유를 위한 소중한 기회로 삼아야 합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 통념을 먼저 제시한 뒤, 관점을 완전히 뒤집으면서 필자의 주장을 전개하고 있습니다.","hl":null},{"n":4,"text":"첫 번째로, 첫 번째 문장에서 세 번째 문장까지는 무료함에 대한 부정적 인식을 다룹니다. 무료함을 제대로 다루지 못하면 우울이나 짜증 같은 해로운 감정을 유발할 수 있죠. 사람들은 재미있는 것만 찾다 보니 아무것도 안 하는 시간은 악마의 작업장이라고 부르며 부정적으로 생각합니다.","hl":"f0"},{"n":5,"text":"두 번째로, 네 번째 문장부터 다섯 번째 문장에서는 인식의 전환이 일어납니다. 필자는 무료함을 낭비가 아니라 자기 개선을 위한 완벽한 시간으로 보아야 한다고 말해요. 심지어 우리가 무료할 수 있다는 게 얼마나 큰 행운인지 곰곰이 생각해 보라고 반문하죠.","hl":"f1"},{"n":6,"text":"세 번째로, 여섯 번째 문장에서 여덟 번째 문장은 왜 그것이 행운인지 그 근거를 설명합니다. 위험한 상황에서는 당장 살아남아야 하니까 무료함을 느낄 새가 없겠죠? 따라서 무료함은 안전지대에서만 누릴 수 있는 사치라는 겁니다.","hl":"f2"},{"n":7,"text":"마지막으로, 아홉 번째 문장에서 열한 번째 문장은 이 글의 결론입니다. 그러므로 이 아무것도 안 하는 순간을 낭비로 여기지 말고, 깊은 자기 성찰을 위해 활용해야 합니다. 무료함은 비생산적인 게 아니라, 개인적 발달을 이끄는 아주 소중한 기회인 것이죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 11번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부에서는 무료함이 해로운 감정과 행동을 유발한다는 일반적인 \u003cb class=\"key\">통념\u003c/b>을 제시합니다. 중반부에서는 무료함이 사실 안전한 환경에서만 누릴 수 있는 특권이라며 시각을 전환하는 \u003cb class=\"key\">반박\u003c/b>을 전개합니다. 후반부에서는 따라서 무료함을 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">성찰\u003c/b>과 발달의 기회로 삼아야 한다는 핵심 주제를 결론으로 도출합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>It is suggested that (3)\u003c/b>\u003cspan>통념 제시\u003c/span>\u003cb>The balance is to not see it as (4)\u003c/b>\u003cspan>인식의 전환 및 반박 시작\u003c/span>\u003cb>Thus (9)\u003c/b>\u003cspan>결론 도출\u003c/span>\u003cb>Rather than viewing A, it should be regarded as B (11)\u003c/b>\u003cspan>최종 주장 강조 및 대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">idle time\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">boredom\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a perfect time for self-improvement\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a luxury\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">an opportunity for personal development\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>무료함에 대한 부정적 시각\u003c/th>\u003cth>무료함에 대한 긍정적 시각\u003c/th>\u003c/tr>\u003ctr>\u003ctd>해로운 감정 (우울, 낙담 등)\u003c/td>\u003ctd>긍정적인 성찰 시간\u003c/td>\u003c/tr>\u003ctr>\u003ctd>악마의 작업장 (문제 행동 유발)\u003c/td>\u003ctd>개인적 발달을 위한 기회\u003c/td>\u003c/tr>\u003ctr>\u003ctd>낭비된 시간, 비생산적인 것\u003c/td>\u003ctd>안전지대에서 누리는 사치\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 흔히 사람들이 잘못 알고 있는 생각을 먼저 보여준 뒤, 이를 반박하며 진짜 사실을 알려주는 통념 반박 구조를 취하고 있습니다. 그리고 글의 후반부에 핵심 결론이 강하게 등장하는 미괄식 구조로 되어 있어서, 마지막 부분에 집중해서 읽는 것이 중요해요.","hl":"ty"},{"n":9,"text":"글의 흐름을 알려주는 신호어들을 살펴볼까요? 세 번째 문장의 It is suggested that은 통념을 끌어들이는 전형적인 표현이고요. 아홉 번째 문장의 Thus는 앞의 내용을 종합해서 결론을 내리는 아주 중요한 신호어입니다. 마지막 문장의 Rather than은 무료함을 부정적으로 보는 시각과 긍정적으로 보는 시각을 강하게 대조하며 필자의 주장을 돋보이게 해 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>crucial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중요한, 결정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>recognize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>boredom\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무료함, 지루함\u003c/span>\u003c/div>\u003cdiv>\u003cb>give rise to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>발생시키다, 낳다\u003c/span>\u003c/div>\u003cdiv>\u003cb>adequately\u003c/b>\u003cem>부사\u003c/em>\u003cspan>적절하게, 충분히\u003c/span>\u003c/div>\u003cdiv>\u003cb>address\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다루다, 처리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dependent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의존하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>idle\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>아무것도 안 하는, 게으른\u003c/span>\u003c/div>\u003cdiv>\u003cb>imply\u003c/b>\u003cem>동사\u003c/em>\u003cspan>암시하다, 의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-improvement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자기 개선\u003c/span>\u003c/div>\u003cdiv>\u003cb>reflection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성찰, 반성\u003c/span>\u003c/div>\u003cdiv>\u003cb>presence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>존재, 참석\u003c/span>\u003c/div>\u003cdiv>\u003cb>indulgence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>탐닉, 빠짐\u003c/span>\u003c/div>\u003cdiv>\u003cb>pastime\u003c/b>\u003cem>명사\u003c/em>\u003cspan>활동, 오락\u003c/span>\u003c/div>\u003cdiv>\u003cb>perceive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다, 여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>luxury\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사치\u003c/span>\u003c/div>\u003cdiv>\u003cb>manifest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타나다, 분명해지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>occasion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회, 때\u003c/span>\u003c/div>\u003cdiv>\u003cb>comprehend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hazardous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위험한\u003c/span>\u003c/div>\u003cdiv>\u003cb>unavailable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>손에 넣을 수 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>paramount\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가장 중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>profound\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>심오한, 깊은\u003c/span>\u003c/div>\u003cdiv>\u003cb>observe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관찰하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>appreciate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다, 진가를 알아보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unproductive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비생산적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>constructive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>건설적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>contemplation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사유, 명상, 심사숙고\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문에서 꼭 알아둬야 할 단어들을 짚어볼게요. address는 주소라는 뜻 말고도 이 글에서는 문제를 다루다, 처리하다라는 뜻으로 아주 중요하게 쓰였습니다. 그리고 manifest는 뚜렷해지다, 나타나다라는 뜻을 가진 동사로 꼭 기억해 두세요. hazardous는 위험한이라는 뜻으로 dangerous와 비슷한 고급 어휘입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">crucial\u003c/b>\u003cspan class=\"m\">중대한, 결정적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">vital\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003cspan class=\"a\">insignificant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">idle\u003c/b>\u003cspan class=\"m\">아무것도 안 하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inactive\u003c/span>\u003cspan class=\"s\">unoccupied\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">busy\u003c/span>\u003cspan class=\"a\">active\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hazardous\u003c/b>\u003cspan class=\"m\">위험한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dangerous\u003c/span>\u003cspan class=\"s\">risky\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003cspan class=\"a\">secure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">profound\u003c/b>\u003cspan class=\"m\">심오한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deep\u003c/span>\u003cspan class=\"s\">intense\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">superficial\u003c/span>\u003cspan class=\"a\">shallow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">constructive\u003c/b>\u003cspan class=\"m\">건설적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">productive\u003c/span>\u003cspan class=\"s\">positive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destructive\u003c/span>\u003cspan class=\"a\">negative\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 출제되기 쉬운 핵심 동의어와 반의어를 정리해 볼까요? 먼저 profound는 심오한이라는 뜻인데요. 동의어로는 deep이나 intense가 있고, 반의어로는 얕다는 뜻의 superficial이나 shallow를 쓸 수 있습니다. constructive는 건설적인이라는 뜻이죠. 동의어로 productive나 positive가 가능하고, 반의어로는 파괴적이라는 뜻의 destructive를 알아두시면 완벽합니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~을 인식하는 것은 중요하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">crucial \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">recognize\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무료함이 해로운 감정들을 발생시킬 수 있다는 것을\u003c/span>\u003cspan class=\"en\">boredom can give rise to harmful emotions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우울, 낙담, 그리고 짜증과 같은\u003c/span>\u003cspan class=\"en\">such as depression, despair, and irritation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 적절하게 다뤄지지 않는다면.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">adequately \u003c/span>\u003cspan class=\"tgt\">addressed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무료함이 적절하게 다뤄지지 않는다면 우울, 낙담, 그리고 짜증과 같은 해로운 감정들을 발생시킬 수 있다는 것을 인식하는 것은 중요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 도입부로, \u003cb class=\"key\">무료함\u003c/b>을 방치하면 부정적인 결과를 초래할 수 있다는 \u003cb class=\"key\">문제점\u003c/b>을 제기하고 있습니다. 따라서 무료함을 올바르게 인식하고 대처하는 것이 중요하다는 글의 전체 방향성을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 진주어 구문\u003c/span> : It [가주어] + is crucial + to recognize [진주어] : \"인식하는 것은 중요하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : recognize [타동사] + that [명사절 접속사] + S V : \"~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문 (접속사가 남은 형태)\u003c/span> : if + (it is) + not + adequately + addressed [과거분사] : \"만약 적절하게 다뤄지지 않는다면\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"It is crucial to recognize that, ~을 인식하는 것은 중요하다. boredom can give rise to harmful emotions, 무료함이 해로운 감정들을 발생시킬 수 있다는 것을. such as depression, despair, and irritation, 우울, 낙담, 그리고 짜증과 같은. if not adequately addressed, 만약 적절하게 다뤄지지 않는다면.. 이 문장 전체를 해석하면, 무료함이 적절하게 다뤄지지 않는다면 우울, 낙담, 그리고 짜증과 같은 해로운 감정들을 발생시킬 수 있다는 것을 인식하는 것은 중요하다.","hl":"m"},{"n":13,"text":"이 문장은 글의 도입부로, 무료함을 방치하면 부정적인 결과를 초래할 수 있다는 문제점을 제기하고 있어요. 따라서 무료함을 올바르게 인식하고 대처하는 것이 중요하다는 글의 전체 방향성을 제시해 줍니다.","hl":"mn"},{"n":14,"text":"첫 번째로 It is crucial to recognize를 볼게요. 문장의 진짜 주어인 to부정사구가 너무 길어서 뒤로 보내고 그 자리에 가주어 It을 쓴 형태랍니다. 두 번째로 that은 동사 recognize의 목적어 역할을 하는 명사절을 이끌고 있어요. 뒤에는 당연히 완전한 문장이 오겠죠. 세 번째로 if not adequately addressed는 부사절에서 주어와 be동사가 생략된 구조예요. 의미를 명확히 하려고 접속사를 남겨둔 수동형 과거분사구문이라는 점 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 ~라고 믿으면\u003c/span>\u003cspan class=\"en\">When we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">believe \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행복해지는 유일한 방법이\u003c/span>\u003cspan class=\"en\">the only \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">happy\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재미있는 활동들을 찾는 것에 의해서만이라고\u003c/span>\u003cspan class=\"en\">is by searching for fun activities,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그때 우리는 그러한 활동들에 의존하게 되고,\u003c/span>\u003cspan class=\"en\">then we become dependent on those activities,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부정적인 생각들과 감정들이 생긴다.\u003c/span>\u003cspan class=\"en\">and negative thoughts and emotions \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">arise\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 행복해지는 유일한 방법이 재미있는 활동들을 찾는 것에 의해서만이라고 믿으면, 그때 우리는 그러한 활동들에 의존하게 되고, 부정적인 생각들과 감정들이 생긴다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오직 재미만을 추구하는 태도가 오히려 \u003cb class=\"key\">의존성\u003c/b>과 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 불러일으킨다는 점을 지적합니다. 즉, 외부 활동으로만 무료함을 달래려는 시도의 \u003cb class=\"key\">부작용\u003c/b>을 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : believe [타동사] + that [명사절 접속사] + S V : \"~라고 믿다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사(way) + to be [to부정사] : \"행복해지는 방법\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">자동사\u003c/span> : negative thoughts and emotions [주어] + arise [자동사] : \"생기다, 발생하다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"When we believe that, 우리가 ~라고 믿으면. the only way to be happy, 행복해지는 유일한 방법이. is by searching for fun activities, 재미있는 활동들을 찾는 것에 의해서만이라고. then we become dependent on those activities, 그때 우리는 그러한 활동들에 의존하게 되고. and negative thoughts and emotions arise, 부정적인 생각들과 감정들이 생긴다.. 이 문장 전체를 해석하면, 우리가 행복해지는 유일한 방법이 재미있는 활동들을 찾는 것에 의해서만이라고 믿으면, 그때 우리는 그러한 활동들에 의존하게 되고, 부정적인 생각들과 감정들이 생긴다.","hl":"m"},{"n":16,"text":"이 문장은 오직 재미만을 추구하는 태도가 오히려 의존성과 부정적 감정을 불러일으킨다는 점을 지적하고 있어요. 외부적인 활동으로만 무료함을 달래려고 하면 어떤 부작용이 생기는지 잘 보여주죠.","hl":"mn"},{"n":17,"text":"첫 번째 believe that에서 that은 타동사 believe의 목적어 역할을 하는 명사절 접속사예요. 두 번째 way to be happy를 보면요, to부정사 to be가 앞의 명사 way를 꾸며주고 있죠. 뭐뭐 하는 방법이라는 뜻의 형용사적 수식어 역할을 하고 있답니다. 세 번째로 arise는 목적어가 필요 없는 1형식 자동사예요. 따라서 이 단어는 수동태로 쓸 수 없다는 점을 반드시 기억해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라고 일컬어진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">suggested \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘아무것도 안 하는 시간은 악마의 작업장이다’라는 것은 ~을 암시한다고\u003c/span>\u003cspan class=\"en\">'Idle time is the devil's workshop' \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">implies \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 손에 너무 많은 시간을 가진 사람들이\u003c/span>\u003cspan class=\"en\">those with too much time on their hands\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 시간을 문제를 일으키는 생각들과 행동으로 채울 수 있다는 것을.\u003c/span>\u003cspan class=\"en\">may \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">fill \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">with\u003c/span> troubling thoughts and behavior.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘아무것도 안 하는 시간은 악마의 작업장이다’라는 것은 자신의 손에 너무 많은 시간을 가진 사람들이 그 시간을 문제를 일으키는 생각들과 행동으로 채울 수 있다는 것을 암시한다고 일컬어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유명한 속담을 인용하여, 할 일이 없는 \u003cb class=\"key\">무료한 \u003c/b>\u003cb class=\"key\">시간\u003c/b>이 사람을 해로운 길로 빠지게 할 수 있다는 통념을 소개합니다. 이는 무료함을 부정적으로만 바라보는 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">시각\u003c/b>을 대변합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 진주어와 수동태\u003c/span> : It [가주어] + is suggested [수동태] + that절 [진주어] : \"~라고 일컬어진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : implies [타동사] + that [명사절 접속사] : \"~을 암시한다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사구 (fill A with B)\u003c/span> : fill + that time [A] + with + troubling thoughts and behavior [B] : \"그 시간을 문제를 일으키는 생각들과 행동으로 채우다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It is suggested that, ~라고 일컬어진다. 'Idle time is the devil's workshop' implies that, ‘아무것도 안 하는 시간은 악마의 작업장이다’라는 것은 ~을 암시한다고. those with too much time on their hands, 자신의 손에 너무 많은 시간을 가진 사람들이. may fill that time with troubling thoughts and behavior, 그 시간을 문제를 일으키는 생각들과 행동으로 채울 수 있다는 것을.. 이 문장 전체를 해석하면, ‘아무것도 안 하는 시간은 악마의 작업장이다’라는 것은 자신의 손에 너무 많은 시간을 가진 사람들이 그 시간을 문제를 일으키는 생각들과 행동으로 채울 수 있다는 것을 암시한다고 일컬어진다.","hl":"m"},{"n":19,"text":"유명한 속담을 인용하면서, 할 일이 없는 무료한 시간이 사람을 해로운 길로 빠지게 할 수 있다는 통념을 소개하고 있어요. 이 문장은 무료함을 부정적으로만 바라보는 사람들의 일반적인 시각을 잘 대변해 줍니다.","hl":"mn"},{"n":20,"text":"첫 번째 It is suggested that은요, that절 이하의 내용이 일컬어진다는 의미예요. 가주어 It과 수동태가 결합되어서 진주어인 that절을 뒤로 보낸 구조랍니다. 두 번째 implies that의 that은 동사 implies의 목적어 역할을 하는 명사절 접속사예요. 세 번째 fill that time with 부분은 fill A with B 구조예요. A를 B로 채우다라는 뜻으로 쓰였으니 짝꿍으로 쓰인 전치사 with를 꼭 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균형점은 그것을 보지 않는 것이다\u003c/span>\u003cspan class=\"en\">The balance is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">idle \u003c/span>\u003cspan class=\"tgt\">time, \u003c/span>\u003cspan class=\"tgt\">wasted \u003c/span>\u003cspan class=\"tgt\">time, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">boredom \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오히려 완벽한 시간으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">perfect \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자기 개선, 자기 발견, 그리고 긍정적인 성찰 시간을 위한\u003c/span>\u003cspan class=\"en\">for self­improvement, self­identification, and positive reflection time.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">균형점은 그것을 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로 보는 것이 아니라, 오히려 자기 개선, 자기 발견, 그리고 긍정적인 성찰 시간을 위한 완벽한 시간으로 보는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 필자가 주장하는 \u003cb class=\"key\">해결책\u003c/b>을 제시합니다. 무료함을 단순히 버려지는 시간이 아니라, 나를 발전시키는 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">기회\u003c/b>로 바라보라는 것이 이 글의 핵심 주제입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (보어) 및 부정\u003c/span> : to + not + 동사원형 : \"보지 않는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">not A but B 구문 (병렬)\u003c/span> : not [A] but (rather) [B] (A가 아니라 오히려 B) : \"아무것도 안 하는 시간...이 아니라 오히려 완벽한 시간으로 보는 것\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The balance is to not see it, 균형점은 그것을 보지 않는 것이다. as idle time, wasted time, or boredom, 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로. but rather as a perfect time, 오히려 완벽한 시간으로. for self­improvement, self­identification, and positive reflection time, 자기 개선, 자기 발견, 그리고 긍정적인 성찰 시간을 위한. 이 문장 전체를 해석하면, 균형점은 그것을 아무것도 안 하는 시간, 낭비된 시간, 또는 무료함으로 보는 것이 아니라, 오히려 자기 개선, 자기 발견, 그리고 긍정적인 성찰 시간을 위한 완벽한 시간으로 보는 것이다.","hl":"m"},{"n":22,"text":"이 문장은 글쓴이가 우리에게 제안하는 핵심 해결책을 담고 있어요. 지루함을 그저 낭비되는 시간으로 보지 말고, 나 자신을 발전시키는 긍정적인 기회로 시각을 바꾸라는 아주 중요한 문장이죠.","hl":"mn"},{"n":23,"text":"어법 살펴볼게요. 첫 번째로 to not see를 보면, be동사 뒤에서 보어 역할을 하는 명사적 용법인데요. to부정사를 부정할 때는 not을 반드시 to 바로 앞에 써야 한다는 점 꼭 기억하세요. 두 번째로, not A but rather B 구문이 쓰였어요. A가 아니라 오히려 B다 라는 뜻이죠. 여기서 A와 B 자리에 as로 시작하는 전치사구가 나란히 병렬 구조를 이루면서, 무료함을 긍정적인 시각으로 바라보자는 점을 강조하고 있습니다. 서술형으로 아주 나오기 좋은 구조니까 꼼꼼히 외워두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곰곰이 생각해 보면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Reflecting,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 정말 얼마나 행운인가\u003c/span>\u003cspan class=\"en\">just \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">lucky \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">we\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무료할 수 있어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">bored\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">곰곰이 생각해 보면 우리가 무료할 수 있어서 정말 얼마나 행운인가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 무료함이 오히려 \u003cb class=\"key\">행운의 \u003c/b>\u003cb class=\"key\">징표\u003c/b>라는 발상의 전환을 보여줍니다. 안전한 상태에 있다는 것을 의미하므로, 이 시간을 불평할 것이 아니라 오히려 \u003cb class=\"key\">감사해야 \u003c/b>\u003cb class=\"key\">한다\u003c/b>는 의도가 담겨 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : (If we are) reflecting ~ -&gt; Reflecting ~ : \"곰곰이 생각해 보면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문문 어순 (수사적 의문문)\u003c/span> : how + 형용사 + 동사 + 주어? : \"우리가 얼마나 행운인가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (감정의 원인)\u003c/span> : 감정형용사(lucky) + [to부정사구] : \"무료할 수 있어서\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Reflecting, 곰곰이 생각해 보면. just how lucky are we, 우리가 정말 얼마나 행운인가. to be bored?, 무료할 수 있어서. 이 문장 전체를 해석하면, 곰곰이 생각해 보면 우리가 무료할 수 있어서 정말 얼마나 행운인가?","hl":"m"},{"n":25,"text":"지루함을 느낀다는 게 사실은 아주 안전한 상태에 있다는 뜻이잖아요? 그래서 글쓴이는 무료함이 오히려 행운의 징표라며, 불평할 게 아니라 오히려 감사해야 한다는 발상의 전환을 유도하고 있어요.","hl":"mn"},{"n":26,"text":"문법 포인트 짚어볼게요. 첫 번째로 Reflecting은 부사절을 간결하게 만든 분사구문이에요. 우리가 곰곰이 생각해 본다면 정도의 의미로 해석하면 자연스럽죠. 두 번째로 how lucky are we는 의문문 어순을 취하고 있지만, 실제로는 우리가 얼마나 운이 좋은가 하고 감탄하는 뉘앙스를 담고 있어요. 세 번째로 to be bored는 앞에 있는 lucky라는 감정을 느끼게 된 원인을 설명해 주는 to부정사의 부사적 용법입니다. 지루함을 느끼게 되어서 운이 좋다는 뜻이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무료함은 존재하지 않는데\u003c/span>\u003cspan class=\"en\">Boredom doesn't exist\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위험이 존재하는 곳에서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">presence \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> danger,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 그것이 단지 탐닉 활동이기 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">only\u003c/span> an indulgence pastime\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안전지대 안에서의\u003c/span>\u003cspan class=\"en\">in a safe zone.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무료함은 위험이 존재하는 곳에서는 존재하지 않는데, 왜냐하면 그것이 단지 안전지대 안에서의 탐닉 활동이기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 무료함의 전제 조건이 \u003cb class=\"key\">안전\u003c/b>이라는 점을 명확히 설명합니다. 생존을 다퉈야 하는 위험한 상황에서는 지루할 틈이 없으므로, 지루함은 곧 안전할 때만 누릴 수 있는 \u003cb class=\"key\">특권이자 \u003c/b>\u003cb class=\"key\">여유\u003c/b>임을 뒷받침하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 관용표현\u003c/span> : in + the presence + of + 명사 : \"~이 존재하는 곳에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 접속사 as\u003c/span> : as + [주어 + 동사] : \"왜냐하면 그것이 ~이기 때문이다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Boredom doesn't exist, 무료함은 존재하지 않는데. in the presence of danger, 위험이 존재하는 곳에서는. as it is only an indulgence pastime, 왜냐하면 그것이 단지 탐닉 활동이기 때문이다. in a safe zone, 안전지대 안에서의. 이 문장 전체를 해석하면, 무료함은 위험이 존재하는 곳에서는 존재하지 않는데, 왜냐하면 그것이 단지 안전지대 안에서의 탐닉 활동이기 때문이다.","hl":"m"},{"n":28,"text":"우리가 생존을 다퉈야 하는 위험한 상황이라면 지루할 틈조차 없겠죠? 즉 무료함의 전제 조건은 안전이라는 점을 알려주면서, 무료함이란 우리가 안전하기 때문에 누릴 수 있는 특권이자 여유라는 점을 논리적으로 뒷받침해 주는 문장이에요.","hl":"mn"},{"n":29,"text":"어법 부분 확인해 볼게요. 첫 번째로 in the presence of는 직역하면 무언가의 존재 안에서라는 뜻인데요, 의역해서 무언가가 존재하는 곳에서라고 해석하는 전치사구 관용표현이에요. 여기서는 위험이 존재하는 상황을 말하죠. 두 번째로 as it is only에서 as는 because처럼 이유를 나타내는 접속사로 쓰였어요. 그리고 여기서 대명사 it이 가리키는 건 당연히 boredom, 즉 무료함을 의미한답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무료함은 사치로 인식될 수 있으며\u003c/span>\u003cspan class=\"en\">Boredom \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">perceived\u003c/span> as a luxury\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전형적으로 나타나는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">typically \u003c/span>\u003cspan class=\"tgt\">manifests\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안전하고 할 일이 없는 상황들에서,\u003c/span>\u003cspan class=\"en\">in safe and inactive situations,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기회를 제공한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">providing\u003c/span> an occasion\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경을 인식하고 이해할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">appreciate \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">comprehend\u003c/span> the environment.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무료함은 안전하고 할 일이 없는 상황들에서 전형적으로 나타나는 사치로 인식될 수 있으며, 환경을 인식하고 이해할 기회를 제공한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 무료함은 생존을 걱정해야 하는 위험한 상황이 아니라는 증거이므로 하나의 \u003cb class=\"key\">특권이자 \u003c/b>\u003cb class=\"key\">사치\u003c/b>라고 설명합니다. 이 안전한 시간은 주변을 돌아보고 이해하는 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">계기\u003c/b>가 됨을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 수동태\u003c/span> : 조동사 + be + p.p. : \"인식될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 명사(선행사) + that [주격 관계대명사] + 동사 : \"전형적으로 나타나는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : 콤마(,) + V-ing : \"제공한다 (제공하면서)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사 + to부정사 : \"인식하고 이해할\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Boredom can be perceived as a luxury, 무료함은 사치로 인식될 수 있으며. that typically manifests, 전형적으로 나타나는. in safe and inactive situations, 안전하고 할 일이 없는 상황들에서. providing an occasion, 기회를 제공한다. to appreciate and comprehend the environment, 환경을 인식하고 이해할. 이 문장 전체를 해석하면, 무료함은 안전하고 할 일이 없는 상황들에서 전형적으로 나타나는 사치로 인식될 수 있으며, 환경을 인식하고 이해할 기회를 제공한다.","hl":"m"},{"n":31,"text":"이 문장은 무료함이라는 단어의 의미를 확 뒤집어줍니다. 무료하다는 건 우리가 생존을 걱정해야 하는 위험한 상황이 아니라는 뜻이니까, 오히려 특권이자 사치라는 거죠. 그리고 이 안전한 시간이 주변을 돌아보는 긍정적인 계기가 된다고 설명하고 있어요.","hl":"mn"},{"n":32,"text":"어법 포인트가 아주 많아서 서술형으로 나오기 딱 좋은 문장이에요. 첫 번째로 can be perceived를 볼게요. 주어인 무료함은 사람이 아니니까 스스로 인식할 수 없죠? 그래서 사람들에 의해 인식되는 대상이라는 의미로 조동사 뒤에 수동태 형태를 썼어요. 두 번째로 that typically manifests입니다. 여기서 that은 주격 관계대명사예요. 앞에 있는 선행사 a luxury가 단수니까 동사 뒤에 단수형 s가 붙었다는 걸 꼭 기억하세요. 세 번째는 콤마 뒤에 나온 providing입니다. 접속사와 주어가 날아가고 동사에 ing가 붙은 분사구문이에요. 자연스럽게 그리고 기회를 제공한다라고 해석하면 됩니다. 마지막 네 번째로 to appreciate and comprehend는 앞에 있는 명사 occasion을 꾸며주는 to부정사의 형용사적 용법입니다. 두 개의 동사 원형이 and로 묶여서 to에 공통으로 걸려 있다는 점 챙겨두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">위험한 상황들에서,\u003c/span>\u003cspan class=\"en\">In hazardous circumstances,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무료함이라는 사치는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">luxury \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">boredom\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손에 넣을 수 없다.\u003c/span>\u003cspan class=\"en\">is unavailable.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">위험한 상황들에서, 무료함이라는 사치는 손에 넣을 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 내용을 역으로 강조하는 문장입니다. 생존이 위협받는 \u003cb class=\"key\">위험한 \u003c/b>\u003cb class=\"key\">상황\u003c/b>에서는 무료함을 느낄 여유조차 없다는 점을 명확히 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 of\u003c/span> : 명사 + of + 명사 : \"무료함이라는 사치\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"In hazardous circumstances, 위험한 상황들에서. the luxury of boredom, 무료함이라는 사치는. is unavailable, 손에 넣을 수 없다.. 이 문장 전체를 해석하면, 위험한 상황들에서, 무료함이라는 사치는 손에 넣을 수 없다.","hl":"m"},{"n":34,"text":"방금 앞 문장에서 말한 내용을 다시 한번 강조해 주는 짧고 강력한 문장이에요. 진짜 맹수가 쫓아오거나 전쟁이 난 위험한 상황에서는 심심함을 느낄 여유가 당연히 없겠죠? 그러니 무료함은 안전할 때만 누릴 수 있는 사치라는 겁니다.","hl":"mn"},{"n":35,"text":"여기서는 동격 표현 하나만 가볍게 보고 갈게요. the luxury of boredom에서 전치사 of는 무엇무엇 의라는 뜻이라기보다는 동격의 의미로 쓰였어요. 즉 사치는 사치인데 어떤 사치냐, 바로 무료함이라는 사치라고 자연스럽게 연결해서 해석해 주면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서, 가장 중요하다 아무것도 안 하는 순간들을 활용하는 것은 심오한 자기 성찰을 위해\u003c/span>\u003cspan class=\"en\">Thus, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">paramount \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">utilize\u003c/span> idle moments for profound self­reflection.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">따라서, 심오한 자기 성찰을 위해 아무것도 안 하는 순간들을 활용하는 것은 가장 중요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 결론이자 \u003cb class=\"key\">주제문\u003c/b>입니다. 안전이 보장된 무료한 시간을 낭비로 여기지 말고, 나 자신을 깊이 돌아보고 발전시키는 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">성찰의 \u003c/b>\u003cb class=\"key\">기회\u003c/b>로 삼아야 한다고 당부하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 진주어 구문\u003c/span> : It (가주어) + be 형용사 + to부정사 (진주어) : \"활용하는 것은 가장 중요하다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Thus, 따라서. it is paramount, 가장 중요하다. to utilize idle moments, 아무것도 안 하는 순간들을 활용하는 것은. for profound self-reflection, 심오한 자기 성찰을 위해. 이 문장 전체를 해석하면, 따라서, 심오한 자기 성찰을 위해 아무것도 안 하는 순간들을 활용하는 것은 가장 중요하다.","hl":"m"},{"n":37,"text":"연결어 Thus로 시작하는 이 문장이 바로 지문의 진짜 결론이자 주제문이에요. 무료함이라는 게 안전할 때 주어지는 럭셔리니까, 이걸 그냥 멍때리면서 낭비하지 말라는 거죠. 아무것도 안 하는 그 순간들을 십분 활용해서, 나 자신을 깊게 돌아보는 자기 성찰의 기회로 삼으라는 게 작가의 핵심 주장입니다.","hl":"mn"},{"n":38,"text":"주제문인 만큼 어법도 확실히 챙겨야겠죠. 첫 번째이자 가장 중요한 포인트는 가주어 진주어 구문입니다. it is paramount to utilize 부분에서 it은 해석하지 않는 가짜 주어예요. 원래 주어인 to utilize부터 끝까지가 너무 기니까 뒤로 던져버린 거죠. 해석할 때는 투부정사구 하는 것은 이라고 진짜 주어처럼 해석하고 앞으로 끌고 오면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 기회를 의미한다\u003c/span>\u003cspan class=\"en\">It represents \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">occasion \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경청하고, 관찰하고, 그리고 인식할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">listen, \u003c/span>\u003cspan class=\"tgt\">observe, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">appreciate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">표현하기 전에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">before \u003c/span>\u003cspan class=\"tgt\">expressing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 표현하기 전에 경청하고, 관찰하고, 그리고 인식할 기회를 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지루함의 순간이 외부로 표현하기 전에 스스로 내면을 들여다보고 성찰할 수 있는 \u003cb class=\"key\">기회\u003c/b>임을 강조합니다. 글의 흐름상 지루함이 가진 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">기능\u003c/b>을 구체적으로 설명하는 부분입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법과 병렬 구조\u003c/span> : 명사(an occasion) + to부정사(to + 동사원형1, 동사원형2, and 동사원형3) : \"경청하고, 관찰하고, 인식할 기회\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사 (또는 분사구문)\u003c/span> : 전치사/접속사(before) + 동명사/현재분사(expressing) : \"표현하기 전에\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"It represents an occasion, 그것은 기회를 의미한다. to listen, observe, and appreciate, 경청하고, 관찰하고, 그리고 인식할. before expressing, 표현하기 전에.. 이 문장 전체를 해석하면, 그것은 표현하기 전에 경청하고, 관찰하고, 그리고 인식할 기회를 의미한다.","hl":"m"},{"n":40,"text":"이 문장은 지루함의 순간이 무언가를 외부로 표현하기 전에 스스로 내면을 들여다보고 성찰할 수 있는 기회임을 강조하고 있어요. 지루함이 가진 긍정적 기능을 아주 구체적으로 보여주는 대목이죠.","hl":"mn"},{"n":41,"text":"첫 번째로 an occasion to listen, observe, and appreciate를 볼게요. 여기서 to는 앞의 명사 an occasion을 꾸며주는 to부정사의 형용사적 용법이에요. 그리고 to 뒤에 동사원형 세 개가 콤마와 and로 나란히 병렬 연결되어 있다는 점을 꼭 기억하세요. 두 번째로 before expressing은 before를 전치사로 봐서 뒤에 동명사가 왔다고 이해하거나, 주어와 동사가 생략된 분사구문으로 볼 수 있어요. 표현하기 전에라고 자연스럽게 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무료함을 비생산적이라고 여기기보다,\u003c/span>\u003cspan class=\"en\">Rather than \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">viewing \u003c/span>\u003cspan class=\"tgt\">boredom \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">unproductive\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 여겨져야 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">regarded \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기회로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as\u003c/span> an opportunity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인적 발달과 건설적인 사유를 위한\u003c/span>\u003cspan class=\"en\">for personal development and constructive contemplation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무료함을 비생산적이라고 여기기보다, 그것은 개인적 발달과 건설적인 사유를 위한 기회로 여겨져야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 \u003cb class=\"key\">주제문\u003c/b>으로, 지루함을 부정적으로만 볼 것이 아니라 자기 발전과 성찰의 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">기회\u003c/b>로 삼아야 한다는 필자의 최종 결론을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">view A as B\u003c/span> : view + A(목적어) + as + B(목적격 보어/형용사) : \"무료함을 비생산적이라고 여기는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (regard A as B)\u003c/span> : 주어(it) + 조동사(should) + be p.p.(be regarded) + as : \"그것은 ~로 여겨져야 한다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Rather than viewing boredom as unproductive, 무료함을 비생산적이라고 여기기보다. it should be regarded, 그것은 여겨져야 한다. as an opportunity, 기회로. for personal development and constructive contemplation, 개인적 발달과 건설적인 사유를 위한. 이 문장 전체를 해석하면, 무료함을 비생산적이라고 여기기보다, 그것은 개인적 발달과 건설적인 사유를 위한 기회로 여겨져야 한다.","hl":"m"},{"n":43,"text":"이 지문의 핵심 주제문이에요. 지루함을 단순히 부정적이고 비생산적인 것으로만 볼 게 아니라, 자기 발전과 깊은 성찰을 할 수 있는 긍정적 기회로 삼아야 한다는 필자의 최종 결론이 잘 담겨 있죠.","hl":"mn"},{"n":44,"text":"첫 번째로 viewing boredom as unproductive를 살펴볼게요. view A as B 구문으로 A를 B라고 여기다라는 뜻이에요. 여기서는 목적격 보어 자리에 형용사 unproductive가 쓰였어요. 두 번째로 it should be regarded as 부분이에요. 원래 regard A as B 구문인데, 주어인 그것 즉 지루함이 여겨지는 대상이라서 조동사 뒤에 be regarded 형태의 수동태로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>무료함을 제대로 다루지 못하면 우울과 짜증 등 \u003cb class=\"key\">해로운 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 일으키고 문제 행동으로 이어질 수 있다는 통념이 있습니다.\u003c/li>\u003cli>하지만 필자는 무료함을 낭비된 시간이 아니라 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">개선\u003c/b>과 성찰을 위한 완벽한 시간으로 봐야 한다고 주장합니다.\u003c/li>\u003cli>왜냐하면 무료함은 생명의 위협이 있는 위험한 상황에서는 불가능하며, 오직 \u003cb class=\"key\">안전지대\u003c/b>에서만 주어지는 사치이기 때문입니다.\u003c/li>\u003cli>따라서 아무것도 안 하는 비생산적인 시간처럼 보이는 무료함을 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">발달\u003c/b>과 심오한 사유의 기회로 적극 활용해야 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>We should reframe boredom not as a negative or unproductive state, but as a valuable luxury that provides an opportunity for profound self-reflection and personal growth.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">무료함은 자칫 해로운 감정을 유발할 수 있다고 여겨지지만, 사실 위험이 없는 안전한 상태에서만 누릴 수 있는 특권이며 이를 낭비된 시간으로 볼 것이 아니라 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">성찰\u003c/b>과 \u003cb class=\"key\">개인적 \u003c/b>\u003cb class=\"key\">발달\u003c/b>을 위한 긍정적인 기회로 활용해야 합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"자, 오늘 우리는 무료함이 결코 쓸모없는 시간이 아니라, 안전한 상황에서만 누릴 수 있는 자아 성찰의 럭셔리라는 것을 배웠습니다. 여러분도 때로는 지루함 속에서 자신을 되돌아보는 꿀 같은 시간을 가져보는 건 어떨까요? 오늘 강의는 여기까지입니다. 수고 많으셨어요!","hl":null}]}]});</script></body></html>
