<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 35번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 35번","audioDir":"2026-10-g2-35_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">35번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>Medical Breakthroughs in the Fight Against Infectious Diseases\u003c/h1>\u003ch2>전염병과의 싸움에서 이룬 의학적 획기적 발전\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>의료 분야의 과학적 발전과 기술은 페니실린, 백신, 위생 관리 등을 통해 \u003cb class=\"key\">전염병\u003c/b>의 치료와 예방에 엄청난 \u003cb class=\"key\">진보\u003c/b>를 가져왔다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Scientific and technological advancements in medicine have led to significant progress in treating and preventing infectious diseases.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 우리가 함께 분석할 지문은 전염병과 맞서 싸워 온 인류의 위대한 의학적 발전에 대한 이야기입니다. 이 글은 의료 분야의 과학적 발전이 전염병의 치료와 예방에 엄청난 진보를 가져왔다는 것을 핵심 요지로 삼고 있어요. 페니실린부터 백신까지 흥미로운 사례들이 가득하니 함께 살펴볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">의학 역사에서 \u003cb class=\"key\">전염병\u003c/b>(infectious diseases)과의 싸움은 인류 생존과 직결된 가장 중요한 과제였습니다. 과거에는 병의 원인을 몰라 속수무책으로 당했지만, 과학의 발전으로 병원체를 식별하고 대처할 수 있게 되었습니다. 알렉산더 플레밍의 페니실린(penicillin) 발견은 세균을 죽이는 최초의 \u003cb class=\"key\">항생제\u003c/b>로 수많은 생명을 구하는 계기가 되었습니다. 또한 에드워드 제너의 우두 접종은 병원체를 약하게 만들어 몸에 주입하는 \u003cb class=\"key\">백신\u003c/b>(vaccine)의 시초가 되었습니다. 이는 마치 적의 약한 부대를 미리 만나 우리 몸의 \u003cb class=\"key\">면역 \u003c/b>\u003cb class=\"key\">체계\u003c/b>라는 군대를 훈련시키는 것과 같습니다. 오늘날에는 이러한 치료 및 예방책에 위생 관리(hygiene management)까지 더해져 치명적인 질병을 효과적으로 \u003cb class=\"key\">통제\u003c/b>하고 있습니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 우리 배경지식을 조금 쌓아볼까요? 의학 역사에서 전염병과의 싸움은 인류 생존과 직결된 가장 중요한 과제 중 하나였습니다. 과거에는 병의 원인을 몰라서 그저 속수무책으로 당하기만 했지만요. 과학의 발전으로 병원체를 찾아내고 대처할 수 있게 되었어요. 예를 들어 페니실린 같은 항생제는 몸속 세균을 직접 죽이는 약이고요. 백신은 병원체를 약하게 만들어서 미리 주입해 우리 몸의 면역 체계가 싸우는 법을 연습하게 만드는 거예요. 마치 적의 약한 부대와 모의 전투를 해서 진짜 전쟁에 대비하는 것과 같죠. 요즘엔 이런 약뿐만 아니라 철저한 위생 통제를 통해서도 질병을 예방하고 있답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 주제\u003csmall>주장 · 문장 1\u003c/small>\u003c/h4>\u003cp>의료 분야의 과학적 기술 발전이 \u003cb class=\"key\">전염병\u003c/b>의 치료와 예방에 있어 엄청난 \u003cb class=\"key\">진보\u003c/b>를 가져왔다는 글의 주제를 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>치료 사례\u003csmall>예시1 · 문장 2\u003c/small>\u003c/h4>\u003cp>첫 번째 예시로 알렉산더 플레밍의 페니실린 발견을 언급합니다. 이는 전염병과의 싸움에서 가장 큰 \u003cb class=\"key\">획기적 \u003c/b>\u003cb class=\"key\">발전\u003c/b> 중 하나였습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>예방 사례\u003csmall>예시2 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>두 번째 예시로 에드워드 제너의 천연두 \u003cb class=\"key\">백신\u003c/b> 발견을 설명합니다. 실험실에서 개발된 백신은 질병의 부담을 줄이고 심지어 바이러스의 \u003cb class=\"key\">퇴치\u003c/b>까지 이끌어냈습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>기타 사례\u003csmall>예시3 · 문장 5\u003c/small>\u003c/h4>\u003cp>기타 전염병에 대한 통제 및 \u003cb class=\"key\">위생 \u003c/b>\u003cb class=\"key\">관리\u003c/b> 조치의 효과를 덧붙입니다. 또한 새로운 치료법들이 치명적인 질병을 만성적인 \u003cb class=\"key\">관리 \u003c/b>\u003cb class=\"key\">가능\u003c/b>한 질병으로 바꾸었음을 보여줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 지문은 핵심 주제를 먼저 던져주고, 역사적인 사례들을 하나씩 나열하는 흐름을 가지고 있어요.","hl":null},{"n":4,"text":"첫 번째 문장을 볼까요? 이 문장은 글의 핵심 주제를 담고 있습니다. 의료 분야의 과학적 기술 발전이 전염병의 치료와 예방에 있어서 엄청난 진보를 가져왔다고 뚜렷하게 밝히면서 글을 시작합니다.","hl":"f0"},{"n":5,"text":"두 번째 문장에서는 이 주장에 대한 첫 번째 구체적인 예시가 나옵니다. 바로 알렉산더 플레밍이 페니실린을 발견한 사건이죠. 이 페니실린의 발견은 전염병 치료의 역사에서 가장 큰 획기적 발전 중 하나로 평가받는다는 것을 설명해주고 있어요.","hl":"f1"},{"n":6,"text":"세 번째와 네 번째 문장은 두 번째 예시인 백신에 대해 이야기합니다. 에드워드 제너가 사람들에게 무해한 우두 바이러스를 이용해 치명적인 천연두를 예방한 사실을 보여주죠. 이렇게 실험실에서 개발된 백신 덕분에 우리는 수많은 세균과 바이러스의 위협으로부터 벗어났고, 심지어 특정 질병의 완전한 퇴치까지 이룰 수 있었습니다.","hl":"f2"},{"n":7,"text":"마지막 다섯 번째 문장에서는 백신이나 항생제 외의 다른 노력들을 소개합니다. 콜레라나 말라리아 같은 질병에는 철저한 위생 관리가 큰 효과를 발휘했고요. 또 새로운 치료법들이 계속 개발되면서, 과거엔 걸리면 곧 죽음이었던 치명적인 질병들도 이제는 꾸준히 관리 가능한 만성 질환으로 변했다는 희망적인 내용으로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-예시\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 의학 기술의 발전이 전염병 통제에 기여했다는 \u003cb class=\"key\">주제\u003c/b>를 명확히 밝힙니다. 이후 페니실린, 백신, 위생 관리 등 구체적인 \u003cb class=\"key\">사례\u003c/b>들을 나열하며 주제를 뒷받침하는 전형적인 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>for example (5)\u003c/b>\u003cspan>예시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Scientific developments and technologies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">The discovery of penicillin\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Vaccines developed in laboratories\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">control and hygiene management measures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">treatment therapies\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식을 짚어볼게요. 첫 번째 문장에서 하고 싶은 말을 빵 터뜨리는 전형적인 두괄식 구조를 취하고 있습니다. 맨 앞에서 의학 발전이 전염병 통제에 기여했다는 주제를 명확하게 제시한 뒤에요, 페니실린, 백신, 위생 관리 등 다양한 사례들을 덧붙여서 자신의 주장을 탄탄하게 뒷받침하고 있죠.","hl":"ty"},{"n":9,"text":"글의 흐름을 잡아주는 신호어도 확인해 볼까요? 마지막 문장에 for example, 즉 예를 들어라는 표현이 나오면서 위생 관리의 구체적 대상을 알려주고 있어요. 그리고 글 전체에 걸쳐서 과학적 발전이라는 개념이 페니실린, 백신, 위생 관리, 치료법 등으로 모양만 바꾼 채 계속 재진술되면서 주제를 강조하고 있답니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>scientific\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>과학적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>development\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발전\u003c/span>\u003c/div>\u003cdiv>\u003cb>medical practice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의료 행위\u003c/span>\u003c/div>\u003cdiv>\u003cb>enormous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>엄청난\u003c/span>\u003c/div>\u003cdiv>\u003cb>progress\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진보, 발전\u003c/span>\u003c/div>\u003cdiv>\u003cb>treatment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>치료\u003c/span>\u003c/div>\u003cdiv>\u003cb>prevention\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예방\u003c/span>\u003c/div>\u003cdiv>\u003cb>infectious disease\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전염병\u003c/span>\u003c/div>\u003cdiv>\u003cb>discovery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발견\u003c/span>\u003c/div>\u003cdiv>\u003cb>breakthrough\u003c/b>\u003cem>명사\u003c/em>\u003cspan>획기적 발전\u003c/span>\u003c/div>\u003cdiv>\u003cb>battle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>싸움, 전투\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deadly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>치명적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>smallpox\u003c/b>\u003cem>명사\u003c/em>\u003cspan>천연두\u003c/span>\u003c/div>\u003cdiv>\u003cb>exposure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노출\u003c/span>\u003c/div>\u003cdiv>\u003cb>harmless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무해한\u003c/span>\u003c/div>\u003cdiv>\u003cb>laboratory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실험실\u003c/span>\u003c/div>\u003cdiv>\u003cb>contribute to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 기여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reduction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감소\u003c/span>\u003c/div>\u003cdiv>\u003cb>burden\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부담\u003c/span>\u003c/div>\u003cdiv>\u003cb>bacterial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>세균성의\u003c/span>\u003c/div>\u003cdiv>\u003cb>viral\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>바이러스성의\u003c/span>\u003c/div>\u003cdiv>\u003cb>elimination\u003c/b>\u003cem>명사\u003c/em>\u003cspan>퇴치, 제거\u003c/span>\u003c/div>\u003cdiv>\u003cb>hygiene\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위생\u003c/span>\u003c/div>\u003cdiv>\u003cb>management\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관리\u003c/span>\u003c/div>\u003cdiv>\u003cb>measure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조치, 대책\u003c/span>\u003c/div>\u003cdiv>\u003cb>therapy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>치료, 요법\u003c/span>\u003c/div>\u003cdiv>\u003cb>chronic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>만성적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>manageable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관리 가능한\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 꼭 챙겨야 할 단어들을 살펴봅시다. infectious disease는 전염병을 뜻하는 아주 중요한 표현입니다. 또 breakthrough는 막힌 곳을 뚫고 지나간다는 뉘앙스로 획기적인 발전을 의미하죠. 마지막 문장에 나오는 chronic은 만성적인이라는 뜻으로, 급성 질환과 반대되는 개념이니 꼭 외워두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">enormous\u003c/b>\u003cspan class=\"m\">엄청난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">huge\u003c/span>\u003cspan class=\"s\">massive\u003c/span>\u003cspan class=\"s\">tremendous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">tiny\u003c/span>\u003cspan class=\"a\">minimal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">progress\u003c/b>\u003cspan class=\"m\">진보, 발전\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">advance\u003c/span>\u003cspan class=\"s\">improvement\u003c/span>\u003cspan class=\"s\">breakthrough\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">regression\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">deadly\u003c/b>\u003cspan class=\"m\">치명적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fatal\u003c/span>\u003cspan class=\"s\">lethal\u003c/span>\u003cspan class=\"s\">mortal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harmless\u003c/span>\u003cspan class=\"a\">safe\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">elimination\u003c/b>\u003cspan class=\"m\">퇴치, 제거\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">eradication\u003c/span>\u003cspan class=\"s\">removal\u003c/span>\u003cspan class=\"s\">destruction\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">creation\u003c/span>\u003cspan class=\"a\">introduction\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reduction\u003c/b>\u003cspan class=\"m\">감소\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">decline\u003c/span>\u003cspan class=\"s\">drop\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">rise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">chronic\u003c/b>\u003cspan class=\"m\">만성적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">persistent\u003c/span>\u003cspan class=\"s\">long-lasting\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">acute\u003c/span>\u003cspan class=\"a\">temporary\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"단어들의 동의어와 반의어도 정리해 볼게요. enormous는 엄청난, 막대한 이라는 뜻인데요. 동의어로는 huge, massive, tremendous가 있고 반대말로는 tiny를 쓸 수 있습니다. deadly는 치명적인 이라는 뜻으로 fatal 또는 lethal로 바꿔 쓸 수 있고요. 반대말은 harmless, 즉 무해한 이 됩니다. 질병을 없앤다는 뜻의 elimination은 eradication으로 대체할 수 있다는 점도 기억해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학적 발전들과 기술들은\u003c/span>\u003cspan class=\"en\">Scientific developments and technologies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의료 행위에서의\u003c/span>\u003cspan class=\"en\">in medical practice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리에게 가져다주었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">brought \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄청난 진보를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">enormous \u003c/span>\u003cspan class=\"tgt\">progress\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치료와 예방에 있어\u003c/span>\u003cspan class=\"en\">in the treatment and prevention\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전염병의\u003c/span>\u003cspan class=\"en\">of infectious diseases.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">의료 행위에서의 과학적 발전들과 기술들은 우리에게 전염병의 치료와 예방에 있어 엄청난 진보를 가져다주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 전체 주제를 도입하는 문장입니다. \u003cb class=\"key\">의학 \u003c/b>\u003cb class=\"key\">발전\u003c/b> 덕분에 인류가 \u003cb class=\"key\">전염병\u003c/b>에 맞서 엄청난 성과를 이루어냈다는 핵심적인 큰 그림을 제시하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">4형식 수여동사 + 현재완료\u003c/span> : have brought [수여동사] + us [간접목적어(IO)] + enormous progress [직접목적어(DO)] : \"우리에게 엄청난 진보를 가져다주었다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Scientific developments and technologies, 과학적 발전들과 기술들은. in medical practice, 의료 행위에서의. have brought us, 우리에게 가져다주었다. enormous progress, 엄청난 진보를. in the treatment and prevention, 치료와 예방에 있어. of infectious diseases, 전염병의. 이 문장 전체를 해석하면, 의료 행위에서의 과학적 발전들과 기술들은 우리에게 전염병의 치료와 예방에 있어 엄청난 진보를 가져다주었다.","hl":"m"},{"n":13,"text":"이 글의 전체 주제를 보여주는 첫 번째 문장이에요. 의학 발전 덕분에 우리가 전염병에 맞서 엄청난 발전을 이루었다는 큰 그림을 제시하고 있죠.","hl":"mn"},{"n":14,"text":"어법 포인트 짚어볼게요. 첫 번째로 have brought us enormous progress 부분입니다. 과거부터 지금까지 쭉 가져다준 거니까 현재완료 시제가 쓰였죠. 그리고 bring은 수여동사라서 뒤에 간접목적어 us, 직접목적어 enormous progress가 순서대로 왔다는 점, 사형식 구조를 꼭 기억해두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">페니실린의 발견은\u003c/span>\u003cspan class=\"en\">The discovery of penicillin\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1928년에\u003c/span>\u003cspan class=\"en\">in 1928\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Alexander Fleming에 의한\u003c/span>\u003cspan class=\"en\">by Alexander Fleming,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것에 대해 그는 후에 노벨상을 받았는데,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">later \u003c/span>\u003cspan class=\"tgt\">received \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">Nobel \u003c/span>\u003cspan class=\"tgt\">Prize\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 큰 획기적 발전들 중 하나였으며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 큰 획기적 발전들 중 하나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">biggest \u003c/span>\u003cspan class=\"tgt\">breakthroughs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전염병과의 싸움에서\u003c/span>\u003cspan class=\"en\">in the battle against infectious diseases.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1928년에 Alexander Fleming에 의한 페니실린의 발견은 전염병과의 싸움에서 가장 큰 획기적 발전들 중 하나였으며, 그것에 대해 그는 후에 노벨상을 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 의학 발전의 구체적인 첫 번째 사례입니다. \u003cb class=\"key\">페니실린\u003c/b> 발견이 전염병 퇴치 역사에서 얼마나 엄청난 \u003cb class=\"key\">획기적 \u003c/b>\u003cb class=\"key\">발전\u003c/b>이었는지 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 + 관계대명사 (계속적 용법)\u003c/span> : , [콤마] + for [전치사] + which [관계대명사] + he [주어] + received [동사] ~ : \"그것에 대해 그는 후에 노벨상을 받았는데\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : The discovery [단수 주어] + 수식어구 + was [단수 동사] : \"~였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">one of the 최상급 복수명사\u003c/span> : one of + the biggest [최상급] + breakthroughs [복수명사] : \"가장 큰 획기적 발전들 중 하나\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The discovery of penicillin, 페니실린의 발견은. in 1928, 1928년에. by Alexander Fleming, Alexander Fleming에 의한. for which he later received the Nobel Prize, 그것에 대해 그는 후에 노벨상을 받았는데. was, 가장 큰 획기적 발전들 중 하나였으며. one of the biggest breakthroughs, 가장 큰 획기적 발전들 중 하나. in the battle against infectious diseases, 전염병과의 싸움에서. 이 문장 전체를 해석하면, 1928년에 Alexander Fleming에 의한 페니실린의 발견은 전염병과의 싸움에서 가장 큰 획기적 발전들 중 하나였으며, 그것에 대해 그는 후에 노벨상을 받았다.","hl":"m"},{"n":16,"text":"앞서 말한 의학 발전의 첫 번째 구체적인 사례를 들고 있어요. 바로 알렉산더 플레밍이 발견한 페니실린이죠. 이 발견이 전염병 퇴치에 획기적 발전이 되었다는 내용입니다.","hl":"mn"},{"n":17,"text":"어법 포인트 살펴볼게요. 첫 번째로 콤마 뒤에 나온 for which 부분입니다. 페니실린의 발견에 대해 노벨상을 받았다는 뜻인데, 원래 문장에 있던 전치사 for가 관계대명사 앞으로 나온 계속적 용법의 관계사절이에요. 뒤에는 완전한 문장이 이어집니다. 두 번째로 동사 was입니다. 주어부가 아주 길지만, 진짜 핵심 주어는 맨 앞의 the discovery 단수명사이기 때문에 단수동사 was로 수 일치 시켜야 해요. 세 번째로 one of the biggest breakthroughs를 보면, one of the 최상급 뒤에는 반드시 복수명사가 와야 한다는 규칙에 따라 breakthroughs에 s가 붙어있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Edward Jenner는 발견했다\u003c/span>\u003cspan class=\"en\">Edward Jenner \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">discovered \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1796년경\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">1796 \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간들이 보호된다는 점을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> humans \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">protected\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치명적인 천연두 바이러스로부터\u003c/span>\u003cspan class=\"en\">against the deadly smallpox virus\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우두 바이러스에 노출된 후\u003c/span>\u003cspan class=\"en\">after exposure to the cowpox virus\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간들에게 무해한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">harmless \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">humans\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1796년경 Edward Jenner는 인간들에게 무해한 우두 바이러스에 인간들이 노출된 후 치명적인 천연두 바이러스로부터 보호된다는 점을 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 의학 발전의 두 번째 구체적인 사례입니다. \u003cb class=\"key\">에드워드 \u003c/b>\u003cb class=\"key\">제너\u003c/b>가 덜 위험한 우두 바이러스를 이용해 치명적인 천연두를 예방하는 \u003cb class=\"key\">백신 \u003c/b>\u003cb class=\"key\">원리\u003c/b>를 찾아냈다는 내용입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : discovered [타동사] + around 1796 [부사구] + that [명사절 접속사] + 완전한 문장 : \"1796년경 ~라는 점을 발견했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : 주어(humans) + be동사(were) + p.p.(protected) : \"보호된다는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 (계속적 용법)\u003c/span> : , [콤마] + which [주격 관계대명사] + is [동사] ~ : \"인간들에게 무해한\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Edward Jenner discovered, Edward Jenner는 발견했다. around 1796, 1796년경. that humans were protected, 인간들이 보호된다는 점을. against the deadly smallpox virus, 치명적인 천연두 바이러스로부터. after exposure to the cowpox virus, 우두 바이러스에 노출된 후. which is harmless to humans, 인간들에게 무해한. 이 문장 전체를 해석하면, 1796년경 Edward Jenner는 인간들에게 무해한 우두 바이러스에 인간들이 노출된 후 치명적인 천연두 바이러스로부터 보호된다는 점을 발견했다.","hl":"m"},{"n":19,"text":"두 번째 의학 발전의 사례가 나오네요. 에드워드 제너가 비교적 안전한 우두 바이러스를 이용해 치명적인 천연두를 예방하는 방법을 찾아냈다는 내용입니다. 백신 원리의 기초를 설명해주고 있어요.","hl":"mn"},{"n":20,"text":"어법 살펴볼게요. 첫 번째로 discovered around seventeen ninety-six that 부분인데요. 동사의 목적어 역할을 하는 명사절 접속사 that이 쓰였어요. 동사와 that 사이에 연도를 나타내는 부사구가 끼어들어간 구조랍니다. 두 번째는 were protected 입니다. 인간이 무언가를 보호하는 게 아니라 우두 바이러스를 통해 보호를 받는 대상이니까 수동태로 썼어요. 세 번째로 콤마 뒤에 나온 which is 부분입니다. 앞의 우두 바이러스를 부연 설명해주는 계속적 용법의 관계대명사인데, 선행사가 단수라서 동사 is가 왔다는 점도 잘 봐두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실험실에서 개발된 백신은\u003c/span>\u003cspan class=\"en\">Vaccines \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">developed\u003c/span> in laboratories\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엄청나게 기여했으며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">contributed\u003c/span> enormously\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부담의 감소에\u003c/span>\u003cspan class=\"en\">to the reduction of the burden\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세균성 질병과 바이러스성 질병의\u003c/span>\u003cspan class=\"en\">of bacterial and viral diseases\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 심지어 이끌었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">led\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수두 바이러스의 퇴치로\u003c/span>\u003cspan class=\"en\">to the elimination of poxvirus.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실험실에서 개발된 백신은 세균성 질병과 바이러스성 질병의 부담의 감소에 엄청나게 기여했으며, 심지어 수두 바이러스의 퇴치로 이끌었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 의학 발전의 또 다른 예시로 \u003cb class=\"key\">백신 \u003c/b>\u003cb class=\"key\">개발\u003c/b>의 성과를 강조하고 있어요. 백신이 세균성 및 바이러스성 \u003cb class=\"key\">질병의 \u003c/b>\u003cb class=\"key\">부담\u003c/b>을 줄이고, 나아가 특정 바이러스를 완전히 \u003cb class=\"key\">퇴치\u003c/b>하는 데 기여했음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사 후위 수식\u003c/span> : Vaccines [명사] + developed [과거분사] + in laboratories [전명구] : \"실험실에서 개발된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 시제\u003c/span> : have [조동사] + contributed [과거분사] : \"기여해 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : have contributed [동사 1] ... and [접속사] have even led [동사 2] : \"그리고 심지어 이끌었다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Vaccines developed in laboratories, 실험실에서 개발된 백신은. have contributed enormously, 엄청나게 기여했으며. to the reduction of the burden, 부담의 감소에. of bacterial and viral diseases, 세균성 질병과 바이러스성 질병의. and have even led, 그리고 심지어 이끌었다. to the elimination of poxvirus, 수두 바이러스의 퇴치로. 이 문장 전체를 해석하면, 실험실에서 개발된 백신은 세균성 질병과 바이러스성 질병의 부담의 감소에 엄청나게 기여했으며, 심지어 수두 바이러스의 퇴치로 이끌었다.","hl":"m"},{"n":22,"text":"이 문장은 의학 발전의 또 다른 예시로 백신 개발의 성과를 강조하고 있어요. 백신이 세균성 및 바이러스성 질병의 부담을 줄이고, 나아가 특정 바이러스를 완전히 퇴치하는 데 기여했음을 설명합니다.","hl":"mn"},{"n":23,"text":"어법 포인트를 짚어볼게요. 첫 번째로 developed는 명사인 Vaccines를 뒤에서 꾸며주는 과거분사입니다. 백신이 개발되는 수동의 의미를 지니기 때문에 과거분사 developed를 썼어요. 두 번째로 have contributed는 과거의 백신 개발이 현재까지 계속해서 엄청난 영향을 미치고 있음을 나타내기 위해 현재완료 시제를 사용했어요. 세 번째로 and have even led를 보면, 등위접속사 and를 중심으로 두 개의 현재완료 동사가 주어 Vaccines에 나란히 연결되는 병렬 구조라는 점을 알 수 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 전염병의 경우에는\u003c/span>\u003cspan class=\"en\">For other infectious diseases\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어 콜레라와 말라리아 같은\u003c/span>\u003cspan class=\"en\">(for example cholera and malaria),\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통제와 위생 관리 조치들이\u003c/span>\u003cspan class=\"en\">control and hygiene management measures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들의 부담을 줄였으며,\u003c/span>\u003cspan class=\"en\">have reduced their burden,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또 다른 것들의 경우에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">while\u003c/span> for others\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치료법이 바이러스성 질병을 바꾸었다\u003c/span>\u003cspan class=\"en\">treatment therapies turned viral diseases\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치명적이었던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">deadly\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만성적인 관리 가능한 질병으로.\u003c/span>\u003cspan class=\"en\">into chronic manageable diseases.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어 콜레라와 말라리아 같은 다른 전염병의 경우에는 통제와 위생 관리 조치들이 그것들의 부담을 줄였으며, 또 다른 것들의 경우에는 치료법이 치명적인 바이러스성 질병을 만성적인 관리 가능한 질병으로 바꾸었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전염병에 대한 다양한 \u003cb class=\"key\">대처 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 설명하며 글을 마무리하는 문장이에요. 위생 관리를 통한 예방이나 치료법을 통한 관리 등 의학 기술이 질병의 \u003cb class=\"key\">치명률을 \u003c/b>\u003cb class=\"key\">낮추고\u003c/b> 통제할 수 있게 만들었음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대조의 접속사\u003c/span> : 절 1 [주어 + 동사] + while [접속사] + 절 2 [주어 + 동사] : \"반면에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사절\u003c/span> : viral diseases [선행사] + that [주격 관계대명사] + were deadly [동사 + 보어] : \"치명적이었던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사구 관용표현 (turn A into B)\u003c/span> : turned [동사] + viral diseases [A: 목적어] + into [전치사] + chronic manageable diseases [B: 명사구] : \"바이러스성 질병을 만성적인 관리 가능한 질병으로 바꾸었다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"For other infectious diseases, 다른 전염병의 경우에는. (for example cholera and malaria), 예를 들어 콜레라와 말라리아 같은. control and hygiene management measures, 통제와 위생 관리 조치들이. have reduced their burden, 그것들의 부담을 줄였으며. while for others, 또 다른 것들의 경우에는. treatment therapies turned viral diseases, 치료법이 바이러스성 질병을 바꾸었다. that were deadly, 치명적이었던. into chronic manageable diseases, 만성적인 관리 가능한 질병으로.. 이 문장 전체를 해석하면, 예를 들어 콜레라와 말라리아 같은 다른 전염병의 경우에는 통제와 위생 관리 조치들이 그것들의 부담을 줄였으며, 또 다른 것들의 경우에는 치료법이 치명적인 바이러스성 질병을 만성적인 관리 가능한 질병으로 바꾸었다.","hl":"m"},{"n":25,"text":"전염병에 대한 다양한 대처 방식을 설명하며 글을 마무리하는 문장이에요. 위생 관리를 통한 예방이나 치료법을 통한 관리 등 의학 기술이 질병의 치명률을 낮추고 통제할 수 있게 만들었음을 보여줍니다.","hl":"mn"},{"n":26,"text":"문법을 살펴볼게요. 첫 번째로 while은 앞 절과 뒤 절의 내용을 대조하며 연결하는 접속사로 반면에라는 의미로 쓰였어요. 두 번째로 turned viral diseases into chronic manageable diseases 부분을 볼게요. 여기서 turn A into B 구문이 쓰였는데, 이것은 A를 B로 바꾸다라는 의미를 가집니다. 세 번째로 that were deadly는 선행사인 viral diseases를 꾸며주는 주격 관계대명사절이에요. 선행사가 복수이므로 동사도 복수형 were를 썼답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>의료 행위에서의 과학적 발전과 기술은 전염병 \u003cb class=\"key\">치료\u003c/b>와 \u003cb class=\"key\">예방\u003c/b>에 엄청난 진보를 가져왔습니다.\u003c/li>\u003cli>알렉산더 플레밍의 페니실린 발견은 세균성 전염병과의 싸움에서 가장 큰 \u003cb class=\"key\">획기적 \u003c/b>\u003cb class=\"key\">발전\u003c/b> 중 하나였습니다.\u003c/li>\u003cli>우두 바이러스를 이용한 천연두 \u003cb class=\"key\">백신\u003c/b>의 발견과 개발은 질병의 부담 감소와 퇴치에 기여했습니다.\u003c/li>\u003cli>콜레라 등을 위한 \u003cb class=\"key\">위생 \u003c/b>\u003cb class=\"key\">관리\u003c/b>와 새로운 치료법들은 치명적 전염병을 만성적인 \u003cb class=\"key\">관리 \u003c/b>\u003cb class=\"key\">가능\u003c/b>한 질병으로 바꾸었습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Scientific and technological advancements in medicine have led to significant progress in treating and preventing infectious diseases.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">의료 분야의 과학적 발전과 기술은 페니실린, 백신, 위생 관리 등을 통해 \u003cb class=\"key\">전염병\u003c/b>의 치료와 예방에 엄청난 \u003cb class=\"key\">진보\u003c/b>를 가져왔다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"자, 이렇게 전염병에 맞서는 인류의 의학적 성과를 다룬 지문을 모두 분석해 보았습니다. 페니실린의 발견부터 백신, 그리고 위생 관리에 이르기까지, 과학이 어떻게 우리 삶을 질병으로부터 지켜주었는지 그 흐름을 잘 기억해 두세요. 예시들이 어떻게 주제를 뒷받침하는지 구조를 파악하며 다시 한번 읽어보시길 바랍니다. 수고 많으셨습니다.","hl":null}]}]});</script></body></html>
