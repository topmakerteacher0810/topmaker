<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 24번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 24번","audioDir":"24_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">24번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>The Historical Limitations of Aristotle's Philosophy\u003c/h1>\u003ch2>아리스토텔레스 철학의 역사적 한계\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>아리스토텔레스의 철학은 고대 그리스 사회의 \u003cb class=\"key\">특권 \u003c/b>\u003cb class=\"key\">엘리트 \u003c/b>\u003cb class=\"key\">계층\u003c/b>의 시각을 반영하므로, 오늘날의 기준에서는 포용성이 떨어지며 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">결함\u003c/b>을 지닌 것으로 평가된다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Aristotle's philosophy, despite its greatness, reflects the historical and elitist biases of his time and is therefore flawed by modern inclusive standards.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘 다룰 지문은 고대 철학자 아리스토텔레스에 대한 이야기입니다. 이 글은 아리스토텔레스의 철학이 고대 그리스 사회의 특권 엘리트 계층의 시각을 반영하고 있어서, 오늘날의 기준으로는 심각한 결함을 지니고 있다는 점을 설명하고 있어요. 그의 위대함 이면에 어떤 역사적 한계가 있는지 같이 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리가 옛날 사상가들의 글을 읽을 때는 그들이 살았던 \u003cb class=\"key\">시대적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>(historical context)을 반드시 고려해야 합니다. 아리스토텔레스가 살았던 고대 그리스는 노예제가 합법이었고, 소수의 엘리트가 권력을 쥐고 있던 계급 사회였습니다. 이를 오늘날의 평등하고 \u003cb class=\"key\">포용적\u003c/b>(inclusive)인 잣대로만 평가하면 당시의 맥락을 오해할 수 있습니다. 이는 마치 삐삐나 폴더폰을 쓰던 시대의 사람들에게 왜 스마트폰 앱을 쓰지 않았냐고 따지는 것과 비슷합니다. 따라서 위대한 사상가의 생각도 결국 그 시대의 \u003cb class=\"key\">특정한 \u003c/b>\u003cb class=\"key\">청중\u003c/b>(particular audience)을 향한 것임을 기억해야 철학의 역사적 한계를 제대로 이해할 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 살펴볼까요? 우리가 옛날 사상가들의 글을 읽을 때는 그들이 살았던 시대적 배경을 꼭 고려해야 합니다. 아리스토텔레스가 살았던 시대는 노예제가 당연했고 소수의 귀족이 권력을 잡고 있었죠. 이걸 지금의 포용적이고 평등한 기준으로 평가하면 오해가 생길 수 있어요. 마치 옛날 사람한테 왜 스마트폰 안 썼냐고 따지는 것과 비슷하죠. 그래서 위대한 사상가라도 특정한 청중을 향해 말할 수밖에 없다는 걸 기억해야 해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 통념\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>아리스토텔레스의 사상 중 일부는 오늘날 우리에게 \u003cb class=\"key\">낯설게\u003c/b> 다가옵니다. 그는 노예제를 정당화하고 철학자들이 모든 최고의 것을 가져야 한다고 주장했는데, 이는 다분히 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">잇속만 \u003c/b>\u003cb class=\"key\">차리는\u003c/b> 것처럼 보입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>전환 및 주장\u003csmall>주장 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>하지만 우리는 모든 사상가가 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">시대\u003c/b>에 속해 있다는 점을 기억해야 합니다. 그가 생각한 인간 번영은 오늘날 우리가 바라는 것만큼 \u003cb class=\"key\">포용적\u003c/b>이지 않았습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>결론\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>결국 그의 철학은 고대 그리스 \u003cb class=\"key\">특권 \u003c/b>\u003cb class=\"key\">엘리트 \u003c/b>\u003cb class=\"key\">계층\u003c/b>의 시각을 보여주는 척도입니다. 그 결과, 그의 사상은 훌륭한 점도 있지만 오늘날의 관점에서는 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">결함\u003c/b>을 가지고 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 글이 어떻게 전개되는지 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입부입니다. 첫 번째 문장부터 네 번째 문장까지인데요. 아리스토텔레스의 사상 중 일부가 오늘날 우리에게 낯설게 다가온다고 말합니다. 노예제를 옹호하고 철학자가 최고를 누려야 한다는 주장은 다분히 자기 잇속만 차리는 것처럼 보인다는 거죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 전환과 주장입니다. 다섯 번째와 여섯 번째 문장이에요. 여기서 작가는 모든 사상가가 자신만의 시대에 속해 있다는 점을 강조합니다. 즉, 그가 생각한 인간 번영은 오늘날의 기준만큼 포용적이지 않았다는 걸 이해해야 한다는 겁니다.","hl":"f1"},{"n":6,"text":"마지막 세 번째 단계는 결론부로, 일곱 번째와 여덟 번째 문장입니다. 아리스토텔레스의 철학은 결국 고대 그리스 특권 엘리트 계층의 한계를 보여줍니다. 그래서 배울 점이 있더라도 오늘날의 관점에서는 심각한 결함을 가질 수밖에 없다고 마무리합니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 아리스토텔레스의 사상이 오늘날 이상하게 보이는 현상을 먼저 제시합니다. 그 후 다섯 번째 문장에서 모든 사상가는 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">시대\u003c/b>에 속해 있다는 \u003cb class=\"key\">주제문\u003c/b>을 제시하는 중괄식 구조를 취합니다. 마지막으로 그의 사상은 고대 그리스 엘리트층의 한계를 지니기에 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">결함\u003c/b>이 있다는 결론으로 마무리됩니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>for example (2)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>Because of (3)\u003c/b>\u003cspan>원인\u003c/span>\u003cb>As a result (8)\u003c/b>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">justifying slavery\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">self-serving\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">of her own time\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">not be nearly as inclusive\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">deeply flawed\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>고대 그리스 시대 (아리스토텔레스)\u003c/th>\u003cth>오늘날 (우리)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>노예제 정당화\u003c/td>\u003ctd>포용성 중시\u003c/td>\u003c/tr>\u003ctr>\u003ctd>특권 엘리트의 시각\u003c/td>\u003ctd>모두를 위한 인간 번영\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 아리스토텔레스의 사상이 이상해 보이는 현상과 그 원인을 분석하는 구조를 가지고 있어요. 특히 다섯 번째 문장에서 모든 사상가는 자신만의 시대에 속한다는 주제문을 던지는 중괄식 구조를 취하고 있습니다. 과거와 현재의 기준을 대조하며 평가를 내리는 것이 핵심입니다.","hl":"ty"},{"n":8,"text":"글의 흐름을 알려주는 신호어들을 볼게요. 두 번째 문장의 for example은 노예제 정당화라는 구체적인 예시를 끌어오고 있죠. 세 번째 문장의 Because of는 철학자들이 특권을 누린 원인을 설명해 줍니다. 그리고 마지막 여덟 번째 문장의 As a result를 통해 그의 사상에 심각한 결함이 있다는 최종 결론을 냅니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>consistent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일관적인, 한결같은\u003c/span>\u003c/div>\u003cdiv>\u003cb>justify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>정당화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>slavery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노예제도\u003c/span>\u003c/div>\u003cdiv>\u003cb>era\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시대\u003c/span>\u003c/div>\u003cdiv>\u003cb>philosopher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>철학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>privilege\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특권\u003c/span>\u003c/div>\u003cdiv>\u003cb>influence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영향력\u003c/span>\u003c/div>\u003cdiv>\u003cb>practice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실천, 관행\u003c/span>\u003c/div>\u003cdiv>\u003cb>contemplation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사유, 명상\u003c/span>\u003c/div>\u003cdiv>\u003cb>worthy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>~할 가치가 있는, 받을 만한\u003c/span>\u003c/div>\u003cdiv>\u003cb>assertion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주장\u003c/span>\u003c/div>\u003cdiv>\u003cb>oddly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>이상하게도\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-serving\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자기 잇속만 차리는\u003c/span>\u003c/div>\u003cdiv>\u003cb>audience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>청중\u003c/span>\u003c/div>\u003cdiv>\u003cb>exception\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예외\u003c/span>\u003c/div>\u003cdiv>\u003cb>flourishing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>번영\u003c/span>\u003c/div>\u003cdiv>\u003cb>inclusive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>포용적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>indicator\u003c/b>\u003cem>명사\u003c/em>\u003cspan>척도, 지표\u003c/span>\u003c/div>\u003cdiv>\u003cb>elite\u003c/b>\u003cem>명사\u003c/em>\u003cspan>엘리트 계층\u003c/span>\u003c/div>\u003cdiv>\u003cb>flawed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>결함이 있는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"중요한 단어 몇 가지 짚고 넘어갈게요. slavery는 노예제도라는 뜻이고, contemplation은 깊이 생각하는 사유나 명상을 뜻합니다. self-serving은 자기 잇속만 차린다는 뜻으로, 아리스토텔레스의 주장을 비판적으로 묘사할 때 쓰였죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">justify\u003c/b>\u003cspan class=\"m\">정당화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">defend\u003c/span>\u003cspan class=\"s\">rationalize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">condemn\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">privilege\u003c/b>\u003cspan class=\"m\">특권\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">advantage\u003c/span>\u003cspan class=\"s\">prerogative\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disadvantage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contemplation\u003c/b>\u003cspan class=\"m\">사유, 명상\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">meditation\u003c/span>\u003cspan class=\"s\">reflection\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">self-serving\u003c/b>\u003cspan class=\"m\">자기 잇속만 차리는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">selfish\u003c/span>\u003cspan class=\"s\">self-seeking\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">altruistic\u003c/span>\u003cspan class=\"a\">selfless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inclusive\u003c/b>\u003cspan class=\"m\">포용적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">comprehensive\u003c/span>\u003cspan class=\"s\">embracing\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclusive\u003c/span>\u003cspan class=\"a\">narrow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">flawed\u003c/b>\u003cspan class=\"m\">결함이 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">defective\u003c/span>\u003cspan class=\"s\">imperfect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">flawless\u003c/span>\u003cspan class=\"a\">perfect\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"시험에 잘 나오는 핵심 어휘들의 동의어와 반의어를 살펴볼까요? justify는 정당화하다라는 뜻인데, 동의어로는 defend나 rationalize가 있습니다. 반의어로는 비난하다라는 뜻의 condemn을 알아두세요. inclusive는 포용적인이라는 뜻으로, comprehensive나 embracing과 바꿔 쓸 수 있고, 반의어로는 배타적인이라는 뜻의 exclusive가 있습니다. flawed는 결함이 있는 이라는 형용사인데요. defective나 imperfect와 같은 뜻입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 그가 일관적일지라도,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Consistent \u003c/span>\u003cspan class=\"tgt\">though \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아리스토텔레스의 생각들 중 일부는\u003c/span>\u003cspan class=\"en\">some of Aristotle's ideas\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날 우리에게 다가온다\u003c/span>\u003cspan class=\"en\">meet us today\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낯설게.\u003c/span>\u003cspan class=\"en\">as strange.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비록 아리스토텔레스가 일관적일지라도, 그의 생각들 중 일부는 오늘날 우리에게 낯설게 다가온다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 아리스토텔레스의 사상이 가진 \u003cb class=\"key\">한계성\u003c/b>을 도입하는 첫 문장이에요. 아무리 훌륭한 철학자라도 그의 시대적 배경 때문에 현대의 관점에서는 \u003cb class=\"key\">낯선 \u003c/b>\u003cb class=\"key\">아이디어\u003c/b>를 가질 수 있다는 글의 주제를 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 부사절 (보어 도치)\u003c/span> : 형용사/명사 + [though/as] + 주어 + 동사 : \"비록 그가 일관적일지라도\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Consistent though he may be, 비록 그가 일관적일지라도. some of Aristotle's ideas, 아리스토텔레스의 생각들 중 일부는. meet us today, 오늘날 우리에게 다가온다. as strange, 낯설게.. 이 문장 전체를 해석하면, 비록 아리스토텔레스가 일관적일지라도, 그의 생각들 중 일부는 오늘날 우리에게 낯설게 다가온다.","hl":"m"},{"n":12,"text":"이 문장은 아리스토텔레스의 사상이 가진 한계성을 도입하는 첫 번째 문장이에요. 아무리 훌륭한 철학자라도 그의 시대적 배경 때문에 현대의 관점에서는 낯선 아이디어를 가질 수 있다는 글의 주제를 암시한답니다.","hl":"mn"},{"n":13,"text":"어법 포인트를 살펴볼게요. Consistent though he may be는 양보의 의미를 강조하기 위해 보어인 Consistent가 앞으로 튀어나온 도치 구문이에요. 원래 문장은 Though he may be consistent인데, 여기서 Consistent를 문장 맨 앞으로 보내고 though 주어 동사 어순으로 쓴 거죠. 서술형으로 아주 잘 나오는 구문이니까 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고,\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">difficulty \u003c/span>\u003cspan class=\"tgt\">justifying\u003c/span> slavery,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그의 시대에,\u003c/span>\u003cspan class=\"en\">and in his era,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">철학자들은 지위를 누렸다\u003c/span>\u003cspan class=\"en\">philosophers enjoyed positions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">높은 특권과 영향력이 있는.\u003c/span>\u003cspan class=\"en\">of high privilege and influence.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급한 \u003cb class=\"key\">낯선 \u003c/b>\u003cb class=\"key\">사상\u003c/b>의 구체적인 예시로 \u003cb class=\"key\">노예 \u003c/b>\u003cb class=\"key\">제도 \u003c/b>\u003cb class=\"key\">정당화\u003c/b>를 들고 있어요. 아리스토텔레스가 활동하던 시대적 배경 속에서 철학자들이 어떤 특권을 누렸는지를 보여주며, 그의 사상이 \u003cb class=\"key\">시대적 \u003c/b>\u003cb class=\"key\">한계\u003c/b>를 가질 수밖에 없음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 (have difficulty -ing)\u003c/span> : have (no) difficulty + [-ing (현재분사)] : \"정당화하는 데 아무런 어려움이 없었다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"He had no difficulty justifying slavery, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고. for example, 예를 들어. and in his era, 그리고 그의 시대에. philosophers enjoyed positions, 철학자들은 지위를 누렸다. of high privilege and influence, 높은 특권과 영향력이 있는.. 이 문장 전체를 해석하면, 예를 들어, 그는 노예 제도를 정당화하는 데 아무런 어려움이 없었고, 그의 시대에 철학자들은 높은 특권과 영향력이 있는 지위를 누렸다.","hl":"m"},{"n":15,"text":"앞 문장에서 말한 낯선 사상의 구체적인 예시로 노예 제도 정당화를 들고 있어요. 아리스토텔레스가 활동하던 시대적 배경 속에서 철학자들이 어떤 특권을 누렸는지를 보여주면서, 그의 사상이 시대적 한계를 가질 수밖에 없었음을 설명하는 문장이죠.","hl":"mn"},{"n":16,"text":"어법 포인트 짚어볼게요. had no difficulty justifying을 보세요. 뭐뭐 하는 데 어려움을 겪다는 뜻의 관용 표현 have difficulty ing를 사용했어요. 전치사 in이 생략되어 뒤에 동명사 ing 형태가 오는 것이 핵심이죠. 여기서는 no가 붙어서 정당화하는 데 전혀 어려움이 없었다는 뜻으로 쓰였네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 실천 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Because \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">practice\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사유의\u003c/span>\u003cspan class=\"en\">of contemplation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 최고선에 대한,\u003c/span>\u003cspan class=\"en\">for the highest human good,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">철학자들은 여겨졌다\u003c/span>\u003cspan class=\"en\">philosophers \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">considered \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가질 만하다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">worthy \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶에서 모든 최고의 것들을.\u003c/span>\u003cspan class=\"en\">all the best things in life.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들의 인간의 최고선에 대한 사유의 실천 때문에, 철학자들은 삶에서 모든 최고의 것들을 가질 만하다고 여겨졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 철학자들이 왜 당시 사회에서 특권을 누렸는지 그 \u003cb class=\"key\">이유\u003c/b>를 설명하는 문장입니다. 인간의 \u003cb class=\"key\">최고선\u003c/b>을 추구한다는 명목으로 자신들이 가장 좋은 것을 누려야 한다고 주장했던 당시 철학자들의 \u003cb class=\"key\">자기중심적 \u003c/b>\u003cb class=\"key\">태도\u003c/b>를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 (이유)\u003c/span> : Because of [전치사구] + [명사구] : \"그들의 실천 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태 (5형식 동사)\u003c/span> : 주어 + [be + p.p.] + [목적격 보어(형용사)] + [to부정사] : \"가질 만하다고 여겨졌다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"Because of their practice, 그들의 실천 때문에. of contemplation, 사유의. for the highest human good, 인간의 최고선에 대한. philosophers were considered, 철학자들은 여겨졌다. worthy to have, 가질 만하다고. all the best things in life, 삶에서 모든 최고의 것들을.. 이 문장 전체를 해석하면, 그들의 인간의 최고선에 대한 사유의 실천 때문에, 철학자들은 삶에서 모든 최고의 것들을 가질 만하다고 여겨졌다.","hl":"m"},{"n":18,"text":"이 문장은 철학자들이 왜 당시 사회에서 특권을 누렸는지 그 이유를 설명하고 있어요. 인간의 최고선을 추구한다는 명목으로 자신들이 가장 좋은 것을 누려야 한다고 여겼던 당시 철학자들의 자기중심적 태도를 보여주고 있죠.","hl":"mn"},{"n":19,"text":"어법 포인트를 확인해 볼게요. 첫 번째로 Because of their practice를 보면요. Because of는 전치사이기 때문에 뒤에 문장이 아니라 명사구가 와야 해요. practice라는 명사구가 잘 왔네요. 두 번째로 were considered worthy to have를 볼까요. 오형식 동사 consider가 수동태로 쓰인 건데요. 능동태일 때 목적격 보어였던 형용사 worthy가 수동태가 되면서 주격 보어로 바로 뒤에 남아있는 구조랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왠지 그 주장은 ~처럼 보인다 이상하게도 자기 잇속만 차리는\u003c/span>\u003cspan class=\"en\">Somehow that assertion seems oddly self­serving.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왠지 그 주장은 이상하게도 자기 잇속만 차리는 것처럼 보인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 철학자가 최고라는 \u003cb class=\"key\">아리스토텔레스의 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이 철학자 스스로에게만 유리한 이기적인 주장임을 지적합니다. 이 문장을 기점으로 그의 사상이 가진 \u003cb class=\"key\">한계점\u003c/b>을 비판적으로 바라보는 흐름이 시작됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">2형식 동사 + 형용사 보어\u003c/span> : seem [2형식 동사] + oddly [부사] + self-serving [형용사(현재분사)/주격보어] : \"이상하게도 자기 잇속만 차리는 것처럼 보인다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Somehow, 왠지. that assertion seems, 그 주장은 ~처럼 보인다. oddly self-serving, 이상하게도 자기 잇속만 차리는. 이 문장 전체를 해석하면, 왠지 그 주장은 이상하게도 자기 잇속만 차리는 것처럼 보인다.","hl":"m"},{"n":21,"text":"방금 읽은 문장은 아리스토텔레스가 철학자들에게 최고의 대우를 줘야 한다고 한 주장이 철학자 스스로에게만 유리한 이기적인 주장임을 지적하는 부분이에요. 이 문장을 기점으로 그의 사상이 가진 한계점을 비판적으로 바라보는 흐름이 시작되죠.","hl":"mn"},{"n":22,"text":"어법 포인트 짚어볼게요. 첫 번째로 seems oddly self-serving에서 동사 seem은 뒤에 주격 보어로 형용사를 짝꿍으로 데리고 오죠. 여기서 self-serving이 현재분사 형태로 형용사 역할을 해서 보어 자리에 온 거예요. 그 앞에 있는 oddly는 부사라서 명사인 보어를 꾸미는 게 아니라 형용사인 self-serving을 수식하고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 ‘우리’에게 도움이 되며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">serves \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~~라는 것을 기억하는 데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">remember\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 위대한 사상가는 ~에 속해 있고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">every \u003c/span>\u003cspan class=\"tgt\">great \u003c/span>\u003cspan class=\"tgt\">thinker \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들 자신만의 시대에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">own \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정한 청중들에게 말한다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">speaks\u003c/span> to a particular audience,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확실히 아리스토텔레스도 예외는 아니다.\u003c/span>\u003cspan class=\"en\">and certainly Aristotle is no exception.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 ‘우리’가 모든 위대한 사상가는 그들 자신만의 시대에 속해 있고 특정한 청중들에게 말한다는 것을 기억하는 데 도움이 되며, 확실히 아리스토텔레스도 예외는 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거의 철학자들을 평가할 때는 그들이 살았던 \u003cb class=\"key\">시대적 \u003c/b>\u003cb class=\"key\">배경\u003c/b>을 고려해야 함을 강조합니다. 아리스토텔레스 역시 자신이 속한 고대 그리스 사회의 영향을 벗어날 수 없었다는 점을 설명하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어 진주어 구문\u003c/span> : It [가주어] + serves [동사] + us [목적어] + to remember [진주어] : \"우리가 기억하는 데 도움이 되며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : remember [타동사] + that [명사절 접속사/목적어] + S + V : \"모든 위대한 사상가는 ~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사 병렬 구조\u003c/span> : is [동사 1] + and [등위접속사] + speaks [동사 2] : \"자신만의 시대에 속해 있고 ~ 말한다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"It serves us, 그것은 ‘우리’에게 도움이 되며. to remember that, ~~라는 것을 기억하는 데. every great thinker is, 모든 위대한 사상가는 ~에 속해 있고. of her own time, 그들 자신만의 시대에. and speaks to a particular audience, 특정한 청중들에게 말한다는 것을. and certainly Aristotle is no exception, 확실히 아리스토텔레스도 예외는 아니다.. 이 문장 전체를 해석하면, 그것은 ‘우리’가 모든 위대한 사상가는 그들 자신만의 시대에 속해 있고 특정한 청중들에게 말한다는 것을 기억하는 데 도움이 되며, 확실히 아리스토텔레스도 예외는 아니다.","hl":"m"},{"n":24,"text":"이 문장은 과거의 철학자들을 평가할 때는 그들이 살았던 시대적 배경을 꼭 고려해야 함을 강조하고 있어요. 아리스토텔레스 역시 자신이 속한 고대 그리스 사회의 한계나 영향을 벗어날 수 없었다는 점을 설명해 주죠.","hl":"mn"},{"n":25,"text":"어법 포인트 설명할게요. 첫 번째로 It serves us to remember 부분이에요. 여기서 It은 가짜 주어, 즉 가주어이고 진짜 주어는 to remember 이하의 to부정사구랍니다. 진짜 주어가 너무 길어서 뒤로 빼고 빈자리에 It을 채운 거죠. 두 번째로 to remember that에서 that은 remember의 목적어 역할을 하는 명사절을 이끄는 접속사예요. 당연히 뒤에는 완전한 문장이 따라오게 됩니다. 세 번째로 is of her own time and speaks 부분에서 동사 is와 speaks가 접속사 and를 두고 병렬 구조를 이루고 있어요. 둘 다 단수 주어인 every great thinker에 맞춰서 단수 동사로 형태를 맞춘 점을 잘 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간 번영은\u003c/span>\u003cspan class=\"en\">Human flourishing\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 이해했던 대로의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">understood \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 결코 ~않을 것이다\u003c/span>\u003cspan class=\"en\">probably would \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 ~만큼 포용적이지는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">nearly \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">inclusive \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날 우리가 그것이 그러하기를 원하는 만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as\u003c/span> we would \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">want \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> today.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 이해했던 대로의 인간 번영은 아마도 결코 오늘날 우리가 그것이 그러하기를 원하는 만큼 포용적이지는 않을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아리스토텔레스가 생각한 번영은 오늘날의 기준에서 볼 때 \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">사람\u003c/b>을 포함하지 못하는 편협한 개념이었음을 비판합니다. 고대 그리스 당시에는 노예 등 일부 계층이 번영의 대상에서 철저히 \u003cb class=\"key\">배제\u003c/b>되었기 때문입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양태의 접속사 as\u003c/span> : as [접속사] + he [주어] + understood [동사] + it [목적어] : \"그가 그것을 이해했던 대로의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">as ~ as 원급 비교 구문\u003c/span> : not [부정어] + nearly [부사] + as + inclusive [형용사 원급] + as [접속사] : \"거의 ~만큼 포용적이지는 않은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 동사 want\u003c/span> : want [5형식 동사] + it [목적어] + to be [to부정사/목적격 보어] : \"그것이 그러하기를 원하다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"Human flourishing, 인간 번영은. as he understood it, 그가 이해했던 대로의. probably would not be, 아마도 결코 ~않을 것이다. nearly as inclusive, 거의 ~만큼 포용적이지는. as we would want it to be today, 오늘날 우리가 그것이 그러하기를 원하는 만큼. 이 문장 전체를 해석하면, 그가 이해했던 대로의 인간 번영은 아마도 결코 오늘날 우리가 그것이 그러하기를 원하는 만큼 포용적이지는 않을 것이다.","hl":"m"},{"n":27,"text":"이 문장은 아리스토텔레스가 생각한 번영이라는 게 오늘날의 기준에서 볼 때 모든 사람을 포함하지 못하는 아주 편협한 개념이었음을 꼬집고 있어요. 고대 그리스 당시에는 노예 같은 일부 계층이 그 번영의 대상에서 철저히 배제되었기 때문이죠.","hl":"mn"},{"n":28,"text":"어법 포인트 살펴볼게요. 첫 번째로 as he understood it에서 as는 뭐뭐 하는 대로, 혹은 뭐뭐 처럼이라는 양태의 의미를 가진 접속사로 쓰였어요. 여기서 대명사 it은 문장의 주어인 인간 번영을 가리키죠. 두 번째로 not be nearly as inclusive as를 보면 as 원급 as 동등 비교 구문이 부정어 not, 그리고 부사 nearly와 함께 쓰였어요. 그래서 결코 뒤에 오는 것만큼 포용적이지 않다라는 강한 부정의 비교를 만들어 줍니다. 세 번째로 want it to be에서 want는 목적격 보어로 to부정사를 취하는 오형식 동사예요. 우리가 인간 번영이라는 목적어가 어떠어떠하기를 원한다라는 구조로 해석해 주시면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 옳음과 선을 어떻게 이해했는가는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">understood \u003c/span>\u003cspan class=\"tgt\">right \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">good\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">척도로 가장 잘 여겨진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">best \u003c/span>\u003cspan class=\"tgt\">taken \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> an indicator\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고대 그리스 사회의 특권 엘리트 계층이 어떻게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">privileged \u003c/span>\u003cspan class=\"tgt\">elite \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">ancient \u003c/span>\u003cspan class=\"tgt\">Greek \u003c/span>\u003cspan class=\"tgt\">society \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옳음과 선을 이해하는 경향이 있었는가에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">tended\u003c/span> to understand right and good.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 옳음과 선을 어떻게 이해했는가는 고대 그리스 사회의 특권 엘리트 계층이 옳음과 선을 어떻게 이해하는 경향이 있었는가에 대한 척도로 가장 잘 여겨진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아리스토텔레스의 도덕적 기준은 \u003cb class=\"key\">보편적 \u003c/b>\u003cb class=\"key\">진리\u003c/b>라기보다는 그가 속했던 \u003cb class=\"key\">특권층의 \u003c/b>\u003cb class=\"key\">시각\u003c/b>을 반영한 것임을 지적합니다. 즉, 시대적 한계와 계급적 특성이 그의 철학에 담겨 있다는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (명사절 주어)\u003c/span> : how [의문사] + he [주어] + understood [동사] : \"그가 옳음과 선을 어떻게 이해했는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be taken to be [명사] : \"가장 잘 여겨진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문 (전치사의 목적어)\u003c/span> : of [전치사] + how [의문사] + the privileged elite... [주어] + tended [동사] : \"고대 그리스 사회의 특권 엘리트 계층이 어떻게 ~하는 경향이 있었는가에 대한\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"How he understood right and good, 그가 옳음과 선을 어떻게 이해했는가는. is best taken to be an indicator, 척도로 가장 잘 여겨진다. of how the privileged elite of ancient Greek society, 고대 그리스 사회의 특권 엘리트 계층이 어떻게. tended to understand right and good, 옳음과 선을 이해하는 경향이 있었는가에 대한. 이 문장 전체를 해석하면, 그가 옳음과 선을 어떻게 이해했는가는 고대 그리스 사회의 특권 엘리트 계층이 옳음과 선을 어떻게 이해하는 경향이 있었는가에 대한 척도로 가장 잘 여겨진다.","hl":"m"},{"n":30,"text":"아리스토텔레스의 도덕적 기준은 보편적 진리라기보다는 그가 속했던 특권층의 시각을 반영한 것임을 지적합니다. 즉 시대적 한계와 계급적 특성이 그의 철학에 담겨 있다는 뜻이에요.","hl":"mn"},{"n":31,"text":"첫 번째로 문장의 주어로 쓰인 How he understood right and good을 살펴볼게요. 의문사 주어 동사 어순의 간접의문문이 명사절로 쓰여서 단수 취급을 하기 때문에 단수 동사 is가 왔습니다. 두 번째로 is best taken to be 부분인데요. 수동태로 쓰여서 여겨진다는 의미를 나타냅니다. 마지막으로 전치사 of의 목적어 자리에도 how로 시작하는 간접의문문이 명사절로 와서 전체 문장이 길고 복잡해졌어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 결과,\u003c/span>\u003cspan class=\"en\">As a result,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 장점에도 불구하고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">well\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 또한 심각하게 결함이 있다.\u003c/span>\u003cspan class=\"en\">it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">deeply \u003c/span>\u003cspan class=\"tgt\">flawed\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 결과, 그것의 장점에도 불구하고, 그것은 또한 심각하게 결함이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아리스토텔레스 철학이 가진 뛰어난 성취와 장점에도 불구하고, \u003cb class=\"key\">시대적 \u003c/b>\u003cb class=\"key\">한계\u003c/b>와 \u003cb class=\"key\">계급적 \u003c/b>\u003cb class=\"key\">편향성\u003c/b>으로 인해 심각한 결함을 지니고 있다는 글의 결론입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 관용표현 + 관계대명사 생략\u003c/span> : for all + (that) + it [주어] + does [동사] : \"그것의 장점에도 불구하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사화된 분사\u003c/span> : be + 부사 + flawed : \"또한 심각하게 결함이 있다\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"As a result, 그 결과. for all it does well, 그것의 장점에도 불구하고. it is also deeply flawed, 그것은 또한 심각하게 결함이 있다.. 이 문장 전체를 해석하면, 그 결과, 그것의 장점에도 불구하고, 그것은 또한 심각하게 결함이 있다.","hl":"m"},{"n":33,"text":"아리스토텔레스 철학이 가진 뛰어난 성취와 장점에도 불구하고, 시대적 한계와 계급적 편향성으로 인해 심각한 결함을 지니고 있다는 글의 결론입니다.","hl":"mn"},{"n":34,"text":"첫 번째로 for all 부분은 양보의 의미를 가지는 전치사구 표현입니다. all 뒤에 목적격 관계대명사가 생략되어서 뒤의 문장이 all을 꾸며주고 있어요. 직역하면 그것이 잘하는 모든 것에도 불구하고라는 뜻이 되죠. 두 번째로 deeply flawed 인데요. 과거분사인 flawed가 완전히 형용사처럼 굳어져서 결함이 있는 이라는 상태를 표현하고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>아리스토텔레스의 일부 사상, 특히 노예제 정당화나 철학자의 특권 옹호는 오늘날 우리에게 \u003cb class=\"key\">낯설게\u003c/b> 느껴집니다.\u003c/li>\u003cli>이는 철학자들이 최고선에 대해 사유하므로 최고의 것을 가져야 한다는 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">잇속만 \u003c/b>\u003cb class=\"key\">차리는\u003c/b> 주장으로 보입니다.\u003c/li>\u003cli>하지만 모든 위대한 사상가는 \u003cb class=\"key\">자신만의 \u003c/b>\u003cb class=\"key\">시대\u003c/b>와 특정 청중에게 속해 있다는 사실을 기억해야 합니다.\u003c/li>\u003cli>그의 사상은 고대 그리스 \u003cb class=\"key\">특권 \u003c/b>\u003cb class=\"key\">엘리트 \u003c/b>\u003cb class=\"key\">계층\u003c/b>의 시각을 반영하므로 오늘날 기준에서는 포용성이 떨어지고 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">결함\u003c/b>이 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Aristotle's philosophy, despite its greatness, reflects the historical and elitist biases of his time and is therefore flawed by modern inclusive standards.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">아리스토텔레스의 철학은 고대 그리스 사회의 \u003cb class=\"key\">특권 \u003c/b>\u003cb class=\"key\">엘리트 \u003c/b>\u003cb class=\"key\">계층\u003c/b>의 시각을 반영하므로, 오늘날의 기준에서는 포용성이 떨어지며 \u003cb class=\"key\">심각한 \u003c/b>\u003cb class=\"key\">결함\u003c/b>을 지닌 것으로 평가된다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":35,"text":"자, 이렇게 아리스토텔레스의 철학과 그 역사적 한계에 대해 알아봤습니다. 위대한 철학자의 생각이라도 그 시대의 맥락 속에서 비판적으로 읽어내는 능력이 중요하다는 걸 꼭 기억해 두세요. 복습 철저히 하시고, 다음 시간에 만나요!","hl":null}]}]});</script></body></html>
