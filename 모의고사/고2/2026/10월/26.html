<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 26번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 26번","audioDir":"26_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">26번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>Jacques Piccard: A Pioneer in Deep-Sea Exploration and Environmental Protection\u003c/h1>\u003ch2>자크 피카르: 심해 탐험과 환경 보호의 선구자\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>이 글은 해양 탐험 기계인 \u003cb class=\"key\">배시스케이프\u003c/b>를 개선하여 세계적인 잠수 기록을 세우고, 이후 \u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">보호\u003c/b> 활동에도 앞장선 자크 피카르의 일대기를 다룹니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Jacques Piccard left a lasting legacy through his groundbreaking deep-sea explorations and his dedication to environmental protection.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분. 오늘 우리가 함께 살펴볼 지문은 심해 탐험의 역사를 새로 쓴 자크 피카르의 일대기를 다룬 글입니다. 이 글의 요약부터 말씀드리면요, 배시스케이프라는 해양 탐험 기계를 개선해 세계적인 잠수 기록을 세우고, 이후 해양 환경 보호에도 앞장선 인물의 이야기입니다. 그의 위대한 업적과 남겨진 유산이 글의 핵심 요지라고 할 수 있죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">자크 피카르가 개발에 참여한 \u003cb class=\"key\">배시스케이프\u003c/b>(bathyscaphe)는 엄청난 수압을 견디며 깊은 바다로 내려갈 수 있는 특수 심해 잠수정입니다. 심해는 수압이 매우 높고 빛이 닿지 않아 인간의 접근이 극도로 어렵습니다. 그래서 깊은 바다로 내려가는 기계를 만드는 것은 마치 미지의 우주로 떠나기 위해 튼튼한 \u003cb class=\"key\">우주선\u003c/b>을 만드는 것과 같은 큰 도전입니다. 피카르는 직접 이 기계를 타고 만 미터가 넘는 깊이까지 내려가 \u003cb class=\"key\">기록\u003c/b>을 세웠습니다. 또한 깊은 바다에서도 쓰레기 등 해양 오염을 목격하고는, 단순히 탐험을 넘어 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">보호\u003c/b> 단체(organization)를 설립하는 데 앞장섰습니다.\u003c/div>","segs":[{"n":2,"text":"지문을 읽기 전에 배경지식을 조금 쌓아볼까요? 자크 피카르가 개발에 참여한 배시스케이프는 엄청난 수압을 견디며 깊은 바다로 내려갈 수 있는 특수 심해 잠수정입니다. 심해는 수압이 너무 높고 빛조차 닿지 않아서 인간이 접근하기 극도로 힘든 공간이에요. 그래서 이런 기계를 만드는 것은 마치 미지의 우주로 떠나기 위해 튼튼한 우주선을 만드는 것만큼이나 위대한 도전이었습니다. 피카르는 직접 이 잠수정을 타고 깊은 곳까지 내려가 기록을 세웠고요. 더 나아가 바다 밑바닥에서도 쓰레기를 발견하고는, 단순히 탐험에 그치지 않고 환경 보호 단체를 설립하는 데 앞장섰습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>가문 배경과 초기 경력\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>과학자 집안에서 태어난 피카르는 스위스에서 대학을 졸업한 후 경제학을 가르쳤습니다. 동시에 아버지를 도와 심해 탐험 기계인 \u003cb class=\"key\">배시스케이프\u003c/b>를 개발했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>진로 변경과 신기록 수립\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>기계가 엄청난 깊이 도달에 성공하자, 그는 교직을 떠나 심해 연구에 전념하기로 결심합니다. 결국 미 해군 장교와 함께 하강하며 세계적인 \u003cb class=\"key\">잠수 \u003c/b>\u003cb class=\"key\">기록\u003c/b>을 세우게 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>환경 보호 활동\u003csmall>전개 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>시간이 흘러 심해 잠수 중에 목격한 해양 오염을 계기로 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">보호\u003c/b>에 집중하게 됩니다. 이를 위해 바다와 호수를 연구하는 단체까지 직접 설립했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사망과 남겨진 유산\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>피카르는 세상을 떠났습니다. 하지만 그의 탐험 정신과 헌신은 동료 해양 탐험가들에게 훌륭한 영감과 \u003cb class=\"key\">본보기\u003c/b>로 남아있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글이 어떤 흐름으로 전개되는지 단계별로 차근차근 살펴보겠습니다.","hl":null},{"n":4,"text":"첫 번째 단계는 가문 배경과 초기 경력입니다. 첫 번째 문장과 두 번째 문장인데요. 피카르는 과학자 집안에서 태어나 대학 졸업 후 경제학을 가르치면서 아버지의 배시스케이프 개발을 도왔다는 이야기로 글을 시작합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 진로 변경과 신기록 수립입니다. 세 번째 문장과 네 번째 문장이고요. 기계가 깊은 바다에 성공적으로 도달하자 피카르는 과감하게 교직을 떠나 심해 연구에 뛰어듭니다. 그리고 결국 엄청난 깊이까지 내려가며 세계적인 잠수 기록을 세우게 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 환경 보호 활동 확장입니다. 다섯 번째 문장과 여섯 번째 문장이에요. 특정 시기에 심해 잠수를 하던 중 해양 오염을 직접 목격하게 되고요. 이를 계기로 바다와 호수를 연구하는 환경 보호 단체를 직접 설립하며 활동 범위를 넓혀갑니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 사망과 남겨진 유산입니다. 마지막 일곱 번째 문장입니다. 그는 세상을 떠났지만, 그의 열정과 헌신은 동료 해양 탐험가들에게 위대한 영감과 본보기로 남아있다는 내용으로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">자크 피카르의 생애를 태어난 때부터 사망할 때까지 시간의 흐름에 따라 서술하는 전형적인 \u003cb class=\"key\">일대기\u003c/b> 형식의 글입니다. 시간순으로 업적을 나열하다가 마지막 문장에서 그의 삶이 남긴 \u003cb class=\"key\">유산\u003c/b>과 의의를 평가하며 마무리하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>After graduating (2)\u003c/b>\u003cspan>시간적 선후 관계 제시\u003c/span>\u003cb>When (3)\u003c/b>\u003cspan>특정 시점의 사건 전환\u003c/span>\u003cb>In 1960 (4)\u003c/b>\u003cspan>구체적 연도 제시\u003c/span>\u003cb>In the 1970s (5)\u003c/b>\u003cspan>시대적 흐름 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">exploring both the oceans and the skies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">deep-sea exploration machines\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">deep-sea dives\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">ocean explorers\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식과 구조를 알아볼게요. 이 지문은 인물이 태어난 시점부터 사망에 이르기까지 연도와 시간의 흐름에 따라 사건을 서술하는 시간순 전개 방식을 취하고 있습니다. 전형적인 일대기 형식이죠. 그리고 마지막 문장에 그의 삶이 남긴 유산과 의의를 평가하며 마무리하고 있기 때문에 미괄식 구조라고 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"글의 흐름을 알려주는 신호어들을 짚어볼게요. 두 번째 문장의 After graduating, 세 번째 문장의 When 같은 접속사를 통해 시간적 선후 관계와 전환점을 보여줍니다. 그리고 네 번째 문장의 In 1960, 다섯 번째 문장의 In the 1970s 처럼 구체적인 연도와 시대를 제시하면서 사건의 흐름을 명확하게 짚어주고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>explore\u003c/b>\u003cem>동사\u003c/em>\u003cspan>탐험하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>graduate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>졸업하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>economics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경제학\u003c/span>\u003c/div>\u003cdiv>\u003cb>bathyscaphe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배시스케이프 (심해 탐험 기계)\u003c/span>\u003c/div>\u003cdiv>\u003cb>depth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>깊이\u003c/span>\u003c/div>\u003cdiv>\u003cb>inspire\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영감을 주다, 마음이 생기게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>career\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경력, 직업\u003c/span>\u003c/div>\u003cdiv>\u003cb>focus on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 집중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>improve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>개선하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>underwater\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수중의\u003c/span>\u003c/div>\u003cdiv>\u003cb>naval\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>해군의\u003c/span>\u003c/div>\u003cdiv>\u003cb>officer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장교\u003c/span>\u003c/div>\u003cdiv>\u003cb>set a record\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기록을 세우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>descend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>하강하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>pollution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오염\u003c/span>\u003c/div>\u003cdiv>\u003cb>found\u003c/b>\u003cem>동사\u003c/em>\u003cspan>설립하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>organization\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조직, 단체\u003c/span>\u003c/div>\u003cdiv>\u003cb>legacy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유산\u003c/span>\u003c/div>\u003cdiv>\u003cb>remain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>남다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inspiration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영감\u003c/span>\u003c/div>\u003cdiv>\u003cb>fellow\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>동료의\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문에서 꼭 챙겨야 할 핵심 단어 몇 가지를 볼까요? 두 번째 문장에 나오는 bathyscaphes 는 지문에도 설명되어 있듯 심해 탐험 기계, 즉 심해 잠수정입니다. 네 번째 문장의 descend 는 아래로 내려가다, 하강하다라는 뜻으로, 반대말인 ascend 와 헷갈리지 않게 꼭 외워두세요. 마지막 문장의 legacy 는 유산이라는 뜻으로 인물 관련 지문에서 정말 자주 등장하는 단어랍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">explore\u003c/b>\u003cspan class=\"m\">탐험하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">investigate\u003c/span>\u003cspan class=\"s\">discover\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">improve\u003c/b>\u003cspan class=\"m\">개선하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"s\">upgrade\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">degrade\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">descend\u003c/b>\u003cspan class=\"m\">하강하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">drop\u003c/span>\u003cspan class=\"s\">fall\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ascend\u003c/span>\u003cspan class=\"a\">rise\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">protect\u003c/b>\u003cspan class=\"m\">보호하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guard\u003c/span>\u003cspan class=\"s\">defend\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">harm\u003c/span>\u003cspan class=\"a\">attack\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">found\u003c/b>\u003cspan class=\"m\">설립하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">establish\u003c/span>\u003cspan class=\"s\">create\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abolish\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">legacy\u003c/b>\u003cspan class=\"m\">유산\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">heritage\u003c/span>\u003cspan class=\"s\">inheritance\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 함께 정리해 보겠습니다. 탐험하다라는 뜻의 explore 는 investigate 나 discover 로 바꿔 쓸 수 있어요. 개선하다라는 뜻의 improve 는 enhance 나 upgrade 로 표현할 수 있고, 반의어로는 worsen 이나 degrade 가 있습니다. 설립하다라는 뜻의 found 는 establish 나 create 와 동의어고요, 반대말로는 abolish 나 destroy 를 알아두시면 좋습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jacques Piccard는 태어났다 \u003c/span>\u003cspan class=\"en\">Jacques Piccard was born\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1922년 7월 28일, 벨기에에서 \u003c/span>\u003cspan class=\"en\">on July 28, 1922 in Belgium\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학자 집안에서 \u003c/span>\u003cspan class=\"en\">to a family of scientists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해양과 대기를 모두 탐험한 것으로 유명한.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">famous \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">exploring \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">oceans \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">skies\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Jacques Piccard는 1922년 7월 28일, 벨기에에서 해양과 대기를 모두 탐험한 것으로 유명한 과학자 집안에서 태어났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 \u003cb class=\"key\">도입부\u003c/b>로, 주인공 Jacques Piccard의 출생과 그의 배경이 되는 가문에 대해 소개하고 있습니다. 특히 바다와 하늘을 탐험한 \u003cb class=\"key\">과학자 \u003c/b>\u003cb class=\"key\">집안\u003c/b> 출신이라는 점이 앞으로 이어질 그의 행보에 영향을 주었음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사구의 후치 수식\u003c/span> : 명사(scientists) + 형용사(famous) + 전치사구 : \"해양과 대기를 모두 탐험한 것으로 유명한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사의 목적어(동명사)\u003c/span> : 전치사(for) + 동명사(exploring) : \"탐험한 것으로 유명한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">상관접속사\u003c/span> : both A and B : \"해양과 대기 둘 다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Jacques Piccard was born, Jacques Piccard는 태어났다. on July 28, 1922 in Belgium, 1922년 7월 28일, 벨기에에서. to a family of scientists, 과학자 집안에서. famous for exploring both the oceans and the skies, 해양과 대기를 모두 탐험한 것으로 유명한.. 이 문장 전체를 해석하면, Jacques Piccard는 1922년 7월 28일, 벨기에에서 해양과 대기를 모두 탐험한 것으로 유명한 과학자 집안에서 태어났다.","hl":"m"},{"n":13,"text":"이 문장은 글의 도입부 역할을 하죠. 주인공 자크 피카르가 어떤 배경에서 태어났는지 알려줍니다. 해양과 대기를 탐험한 과학자 집안에서 태어났다는 사실은, 앞으로 그가 어떤 길을 걷게 될지 자연스럽게 암시해 주고 있어요.","hl":"mn"},{"n":14,"text":"첫 번째로 볼 부분은 famous for exploring both the oceans and the skies입니다. 형용사 famous가 이끄는 덩어리가 앞에 있는 명사 scientists를 뒤에서 꾸며주고 있어요. 이 사이에는 주격 관계대명사와 비동사인 who were가 생략되었다고 보면 됩니다. 두 번째로 famous for exploring을 볼까요? 전치사 for 뒤에는 명사 역할을 하는 말이 와야 하니까 동사인 explore가 동명사 exploring으로 형태를 바꿨습니다. 세 번째로 both the oceans and the skies에서는 상관접속사 both A and B가 쓰여서 해양과 대기 둘 다라는 뜻을 만들고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스위스에 있는 대학교를 졸업한 후, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">After \u003c/span>\u003cspan class=\"tgt\">graduating \u003c/span>\u003cspan class=\"tgt\">university \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Switzerland,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 University of Geneva에서 경제학을 가르쳤다, \u003c/span>\u003cspan class=\"en\">he taught economics at the University of Geneva,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 아버지가 배시스케이프를 개발하는 것을 도우면서, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">helping \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">father \u003c/span>\u003cspan class=\"tgt\">develop \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">bathyscaphes, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심해 탐험 기계인.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">deep­sea \u003c/span>\u003cspan class=\"tgt\">exploration \u003c/span>\u003cspan class=\"tgt\">machines.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">스위스에 있는 대학교를 졸업한 후, 그는 자신의 아버지가 심해 탐험 기계인 배시스케이프를 개발하는 것을 도우면서 University of Geneva에서 경제학을 가르쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공의 \u003cb class=\"key\">초기 \u003c/b>\u003cb class=\"key\">경력\u003c/b>을 보여주는 문장입니다. 경제학을 가르치는 동시에 아버지를 도와 \u003cb class=\"key\">심해 \u003c/b>\u003cb class=\"key\">탐험 \u003c/b>\u003cb class=\"key\">기계\u003c/b>를 개발하는 데 참여했음을 설명하며, 그의 관심사가 점차 해양 탐험 쪽으로 연결되고 있음을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : 접속사(After) + V-ing(graduating) : \"스위스에 있는 대학교를 졸업한 후\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사가 남은 분사구문 / 5형식 준사역동사 help\u003c/span> : 접속사(while) + V-ing(helping) + 목적어(his father) + 목적격보어(develop) : \"아버지가 배시스케이프를 개발하는 것을 도우면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격의 콤마\u003c/span> : 명사(bathyscaphes) + ,(콤마) + 명사구(deep-sea exploration machines) : \"심해 탐험 기계인 배시스케이프\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"After graduating university in Switzerland, 스위스에 있는 대학교를 졸업한 후. he taught economics at the University of Geneva, 그는 University of Geneva에서 경제학을 가르쳤다. while helping his father develop bathyscaphes, 자신의 아버지가 배시스케이프를 개발하는 것을 도우면서. deep­sea exploration machines, 심해 탐험 기계인.. 이 문장 전체를 해석하면, 스위스에 있는 대학교를 졸업한 후, 그는 자신의 아버지가 심해 탐험 기계인 배시스케이프를 개발하는 것을 도우면서 University of Geneva에서 경제학을 가르쳤다.","hl":"m"},{"n":16,"text":"이 문장은 주인공이 젊은 시절에 어떤 일을 했는지 초기 경력을 알려줍니다. 대학교에서 경제학을 가르치는 교수였지만, 동시에 아버지를 도와서 심해 탐험 기계를 개발하기도 했어요. 그의 관심사가 해양 탐험 쪽으로 조금씩 기울고 있다는 걸 알 수 있죠.","hl":"mn"},{"n":17,"text":"서술형으로 나오기 딱 좋은 핵심 문장입니다. 첫 번째로 볼 문법은 After graduating university in Switzerland입니다. 부사절을 줄여 쓴 분사구문인데, 뜻을 더 분명하게 하려고 접속사 After를 생략하지 않고 살려뒀어요. 두 번째는 while helping his father develop bathyscaphes입니다. 여기서도 접속사 while이 살아있는 분사구문이 쓰였죠. 그리고 동사 help는 목적격 보어 자리에 동사원형이나 투부정사를 가지니까, 목적어 아빠 뒤에 동사원형 develop이 왔다는 점 꼭 기억하세요. 세 번째는 bathyscaphes 콤마 deep sea exploration machines 부분입니다. 이 콤마는 동격을 나타내서, 배시스케이프가 곧 심해 탐험 기계라는 뜻으로 용어 설명을 해주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 기계들이 성공적으로 6,000미터의 깊이에 도달했을 때, \u003c/span>\u003cspan class=\"en\">When their machines successfully reached a depth of 6,000 meters,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jacques는 그의 교직을 떠날 마음이 생겼다 \u003c/span>\u003cspan class=\"en\">Jacques \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">inspired \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">leave\u003c/span> his teaching career\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심해 연구를 위한 배시스케이프를 개선하는 것에 집중하기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">focus \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">improving\u003c/span> bathyscaphes for underwater research.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들의 기계들이 성공적으로 6,000미터의 깊이에 도달했을 때, Jacques는 심해 연구를 위한 배시스케이프를 개선하는 것에 집중하기 위해 그의 교직을 떠날 마음이 생겼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공의 인생에서 찾아온 중요한 \u003cb class=\"key\">전환점\u003c/b>을 다룹니다. 아버지와 만든 기계의 성공적인 도달 깊이가 계기가 되어, 교직을 그만두고 본격적으로 \u003cb class=\"key\">심해 \u003c/b>\u003cb class=\"key\">연구\u003c/b>에 헌신하게 된 결정적 사건을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 / 목적격보어로 쓰인 to부정사\u003c/span> : be동사(was) + p.p.(inspired) + to부정사(to leave) : \"떠날 마음이 생겼다 (영감을 받았다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적) / 전치사의 목적어\u003c/span> : to + 동사원형(focus) + 전치사(on) + 동명사(improving) : \"개선하는 것에 집중하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"When their machines successfully reached a depth of 6,000 meters, 그들의 기계들이 성공적으로 6,000미터의 깊이에 도달했을 때. Jacques was inspired to leave his teaching career, Jacques는 그의 교직을 떠날 마음이 생겼다. to focus on improving bathyscaphes for underwater research, 심해 연구를 위한 배시스케이프를 개선하는 것에 집중하기 위해.. 이 문장 전체를 해석하면, 그들의 기계들이 성공적으로 6,000미터의 깊이에 도달했을 때, Jacques는 심해 연구를 위한 배시스케이프를 개선하는 것에 집중하기 위해 그의 교직을 떠날 마음이 생겼다.","hl":"m"},{"n":19,"text":"이 문장은 주인공의 인생에서 아주 중요한 전환점을 보여줍니다. 아버지와 함께 만든 기계가 6000미터나 되는 깊이에 성공적으로 도달하자, 이것이 결정적인 계기가 되어서 안정적인 교수 자리를 그만두고 본격적인 심해 연구에 헌신하기로 결심한 거죠.","hl":"mn"},{"n":20,"text":"첫 번째 문법 포인트는 was inspired to leave 부분이에요. 원래 형태는 주어가 목적어에게 투부정사 하도록 영감을 주다라는 뜻의 inspire 목적어 to 부정사 구조였어요. 그런데 이게 수동태로 바뀌면서 자크가 주어로 가고 was inspired 수동태 형태 뒤에 목적격 보어였던 투부정사 to leave가 바로 딱 붙어서 남게 된 겁니다. 두 번째는 to focus on improving을 볼게요. 여기서 to focus는 집중하기 위해라고 해석되는 투부정사의 부사적 용법 중 목적을 나타냅니다. 그리고 focus 뒤에 전치사 on이 보이시죠? 전치사 뒤에는 꼭 명사 짝꿍이 와야 하니까 improve가 동명사인 improving 형태로 쓰였다는 것도 챙겨두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1960년에,\u003c/span>\u003cspan class=\"en\">In 1960,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jacques는 미 해군 장교 Don Walsh와 함께,\u003c/span>\u003cspan class=\"en\">Jacques, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">together \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">U.S. \u003c/span>\u003cspan class=\"tgt\">Naval \u003c/span>\u003cspan class=\"tgt\">Officer \u003c/span>\u003cspan class=\"tgt\">Don \u003c/span>\u003cspan class=\"tgt\">Walsh,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠수 기록을 세웠다,\u003c/span>\u003cspan class=\"en\">set a diving record,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">10,916미터를 하강하면서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">descending \u003c/span>\u003cspan class=\"tgt\">10,916 \u003c/span>\u003cspan class=\"tgt\">meters.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1960년에 Jacques는 미 해군 장교 Don Walsh와 함께 10,916미터를 하강하면서 잠수 기록을 세웠다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Jacques가 동료와 함께 심해 잠수의 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">기록\u003c/b>을 세운 업적을 설명합니다. 그가 자신의 연구 방향을 바꾼 후 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">성과\u003c/b>를 달성한 것을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 (동반)\u003c/span> : together with + [명사구] : \"미 해군 장교 Don Walsh와 함께\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (동시동작)\u003c/span> : descending (현재분사) + [목적어] : \"10,916미터를 하강하면서\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"In 1960, 1960년에. Jacques, together with U.S. Naval Officer Don Walsh, Jacques는 미 해군 장교 Don Walsh와 함께. set a diving record, 잠수 기록을 세웠다. descending 10,916 meters, 10,916미터를 하강하면서.. 이 문장 전체를 해석하면, 1960년에 Jacques는 미 해군 장교 Don Walsh와 함께 10,916미터를 하강하면서 잠수 기록을 세웠다.","hl":"m"},{"n":22,"text":"이 문장은 자크가 동료와 함께 심해 잠수의 역사적 기록을 세운 업적을 설명하고 있어요. 그가 교수직을 떠나 심해 연구에 집중한 뒤 구체적인 성과를 보여주는 문장이죠.","hl":"mn"},{"n":23,"text":"어법 포인트 짚어볼게요. 첫 번째로 together with 구문이 주어와 동사 사이에 삽입되었어요. 미 해군 장교 돈 월시와 함께라는 뜻으로, 주어가 누구와 함께 했는지 동반의 의미를 더해줍니다. 두 번째로 콤마 뒤에 descending이 쓰인 걸 보세요. 주절의 잠수 기록을 세운 상황과 동시에 일어나는 동작을 나타내는 현재 분사구문이에요. 그래서 만 구백십육 미터를 하강하면서라고 자연스럽게 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1970년대에는,\u003c/span>\u003cspan class=\"en\">In the 1970s,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jacques는 환경을 보호하는 것에 집중했다\u003c/span>\u003cspan class=\"en\">Jacques \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">focused \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">protecting\u003c/span> the environment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해양 오염을 목격한 후\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">seeing\u003c/span> the ocean pollution\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 심해 잠수 중에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">during \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">deep­sea \u003c/span>\u003cspan class=\"tgt\">dives.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1970년대에는 Jacques는 자신의 심해 잠수 중에 해양 오염을 목격한 후 환경을 보호하는 것에 집중했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Jacques가 깊은 바다를 탐험하며 오염의 심각성을 직접 목격하고, \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">보호\u003c/b>로 관심사를 넓힌 계기를 설명합니다. 탐험가에서 \u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">운동가\u003c/b>로의 역할 확장을 보여주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사의 목적어 (동명사)\u003c/span> : focus on [전치사] + protecting [동명사] : \"보호하는 것에 집중했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사 (또는 분사구문)\u003c/span> : after [전치사/접속사] + seeing [동명사/현재분사] : \"목격한 후\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 (기간/사건)\u003c/span> : during [전치사] + [명사구/사건] : \"자신의 심해 잠수 중에\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In the 1970s, 1970년대에는. Jacques focused on protecting the environment, Jacques는 환경을 보호하는 것에 집중했다. after seeing the ocean pollution, 해양 오염을 목격한 후. during his deep­sea dives, 자신의 심해 잠수 중에.. 이 문장 전체를 해석하면, 1970년대에는 Jacques는 자신의 심해 잠수 중에 해양 오염을 목격한 후 환경을 보호하는 것에 집중했다.","hl":"m"},{"n":25,"text":"이 문장은 자크가 수없이 깊은 바다를 탐험하면서 오염의 심각성을 두 눈으로 목격하고, 환경 보호로 관심사를 돌리게 된 계기를 말해주고 있어요. 심해 탐험가에서 환경 운동가로 역할이 확장된 중요한 지점이죠.","hl":"mn"},{"n":26,"text":"어법 포인트 정리해 볼게요. 첫 번째로 focused on 뒤에 protecting이 온 것을 주의하세요. 전치사 on 뒤에는 명사나 동명사만 올 수 있기 때문에 protecting이라는 동명사 형태가 쓰인 거랍니다. 두 번째로 after seeing도 마찬가지예요. 전치사 after 뒤에 동명사가 왔다고 보거나, 접속사를 살려둔 분사구문으로 볼 수 있어요. 세 번째로 during을 살펴볼까요. 자신의 심해 잠수라는 특정 사건이 뒤따르기 때문에 접속사 while이 아니라 전치사 during을 써야 한다는 점을 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 그는 바다와 호수를 연구하기 위해 스위스에 단체를 설립했다\u003c/span>\u003cspan class=\"en\">He even \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">founded\u003c/span> an organization in Switzerland\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바다와 호수를 연구하기 위해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">study \u003c/span>\u003cspan class=\"tgt\">oceans \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">lakes.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심지어 그는 바다와 호수를 연구하기 위해 스위스에 단체를 설립했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Jacques가 환경 보호를 실천하기 위해 \u003cb class=\"key\">연구 \u003c/b>\u003cb class=\"key\">단체\u003c/b>까지 설립하는 적극적인 행보를 보여줍니다. 단순히 관심을 갖는 것을 넘어 \u003cb class=\"key\">제도적 \u003c/b>\u003cb class=\"key\">뒷받침\u003c/b>을 마련했다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 과거형 (설립하다)\u003c/span> : found [동사원형] - founded [과거형] : \"설립했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + study [동사원형] : \"바다와 호수를 연구하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"He even founded an organization in Switzerland, 심지어 그는 바다와 호수를 연구하기 위해 스위스에 단체를 설립했다. to study oceans and lakes, 바다와 호수를 연구하기 위해.. 이 문장 전체를 해석하면, 심지어 그는 바다와 호수를 연구하기 위해 스위스에 단체를 설립했다.","hl":"m"},{"n":28,"text":"이 문장은 자크가 단순히 환경 문제에 관심을 갖는 데 그치지 않고, 실제로 연구 단체를 설립하는 적극적인 실천을 보여줍니다. 환경 보호를 위한 제도적 뒷받침을 마련했다는 것을 강조하는 내용이에요.","hl":"mn"},{"n":29,"text":"여기서 중요한 어법 두 가지 짚고 갈게요. 첫 번째로 동사 founded를 조심해야 해요. 이건 찾다라는 뜻의 find의 과거형이 아니라, 설립하다라는 뜻을 가진 원형 동사 found의 과거형이랍니다. 뜻을 헷갈리면 안 되겠죠. 두 번째로 문장 끝에 붙은 to study는 단체를 세운 목적을 설명해 주고 있어요. 바다와 호수를 연구하기 위해라고 해석되는 to부정사의 부사적 용법, 그중에서도 목적에 해당합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 사망했다\u003c/span>\u003cspan class=\"en\">He died\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 2008년 11월 1일에,\u003c/span>\u003cspan class=\"en\">on November 1, 2008,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 하지만 그의 유산은 남아있다\u003c/span>\u003cspan class=\"en\">but his legacy \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">remains \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 영감과 본보기로서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">inspiration \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">example\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\"> 그의 동료 해양 탐험가들에게.\u003c/span>\u003cspan class=\"en\">for his fellow ocean explorers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 2008년 11월 1일에 사망했지만, 그의 유산은 그의 동료 해양 탐험가들에게 영감과 본보기로서 남아있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 인물의 \u003cb class=\"key\">사망\u003c/b>과 그가 남긴 지속적인 \u003cb class=\"key\">영향력\u003c/b>을 설명하며 글을 맺는 역할을 합니다. 비록 생은 마감했지만, 그의 업적과 정신이 후대 탐험가들에게 큰 \u003cb class=\"key\">본보기\u003c/b>가 되고 있음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">2형식 동사 remain\u003c/span> : remain [불완전 자동사] + [명사 보어] : \"영감과 본보기로서 남아있다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"He died, 그는 사망했다.  on November 1, 2008,  2008년 11월 1일에.  but his legacy remains,  하지만 그의 유산은 남아있다.  an inspiration and example,  영감과 본보기로서.  for his fellow ocean explorers,  그의 동료 해양 탐험가들에게.. 이 문장 전체를 해석하면, 그는 2008년 11월 1일에 사망했지만, 그의 유산은 그의 동료 해양 탐험가들에게 영감과 본보기로서 남아있다.","hl":"m"},{"n":31,"text":"이 문장은 주인공 자크 피카르의 사망과 그가 남긴 지속적인 영향력을 설명하며 글을 자연스럽게 맺고 있어요. 비록 그는 세상을 떠났지만, 그가 남긴 위대한 업적과 환경 보호 정신이 후대의 탐험가들에게 여전히 훌륭한 본보기가 되고 있다는 걸 강조해 주고 있죠.","hl":"mn"},{"n":32,"text":"어법 포인트를 살펴볼게요. remains an inspiration and example 부분에서 동사 remains에 주목해 보세요. remain은 주어의 상태가 계속 유지됨을 나타내는 불완전 자동사예요. 그래서 바로 뒤에 명사 보어인 an inspiration and example이 와서 영감과 본보기로서 남아있다는 뜻을 만들어 내고 있죠. 목적어가 필요 없는 자동사이므로 수동태로 쓰지 않도록 주의하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>자크 피카르는 과학자 가문 출신으로, 초기에는 경제학을 가르치며 아버지가 고안한 \u003cb class=\"key\">배시스케이프\u003c/b> 개발을 도왔습니다.\u003c/li>\u003cli>기계가 깊은 바다 도달에 성공하자 교직을 떠나 연구에 전념했고, 엄청난 깊이까지 하강하며 새로운 \u003cb class=\"key\">잠수 \u003c/b>\u003cb class=\"key\">기록\u003c/b>을 세웠습니다.\u003c/li>\u003cli>그는 잠수 중 해양 오염을 목격한 후 이를 심각하게 여겨 바다와 호수를 연구하고 \u003cb class=\"key\">환경을 \u003c/b>\u003cb class=\"key\">보호\u003c/b>하는 단체를 스위스에 설립했습니다.\u003c/li>\u003cli>비록 그는 세상을 떠났지만, 그가 남긴 훌륭한 유산은 동료 탐험가들에게 여전히 커다란 영감이자 \u003cb class=\"key\">본보기\u003c/b>가 되고 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Jacques Piccard left a lasting legacy through his groundbreaking deep-sea explorations and his dedication to environmental protection.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">이 글은 해양 탐험 기계인 \u003cb class=\"key\">배시스케이프\u003c/b>를 개선하여 세계적인 잠수 기록을 세우고, 이후 \u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">환경 \u003c/b>\u003cb class=\"key\">보호\u003c/b> 활동에도 앞장선 자크 피카르의 일대기를 다룹니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"자, 이렇게 자크 피카르의 일대기를 다룬 지문을 모두 분석해 보았습니다. 심해 탐험을 향한 그의 열정과 해양 환경을 지키려는 따뜻한 마음이 참 인상적이죠. 시간의 흐름을 나타내는 표현들과 일대기에 자주 쓰이는 어휘들을 중심으로 꼼꼼하게 복습해 주세요. 수고 많으셨습니다. 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
