</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 39번","audioDir":"39_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">39번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>Social Historians' Creative Approach to Overcoming Biased Records\u003c/h1>\u003ch2>사회사학자들이 편향된 기록을 극복하는 창의적 접근법\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>사회사학자들은 평범한 사람들을 연구하지만 이들이 남긴 기록이 부족하다는 \u003cb class=\"key\">편향성\u003c/b>을 극복하기 위해, 지배층의 기록을 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">방식과 \u003c/b>\u003cb class=\"key\">다르게\u003c/b> 창의적으로 해석한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Social historians must creatively read elite-produced sources against the grain to uncover the history of ordinary people who left few records.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 함께 살펴볼 지문은 사회사학자들이 편향된 역사적 기록을 어떻게 극복하는지에 관한 이야기입니다. 평범한 사람들의 삶을 연구하려 하지만 남겨진 기록이 지배층의 것뿐일 때, 이들은 과연 어떤 방법을 사용할까요? 지문의 요약과 요지를 통해 그들의 창의적인 해결책을 만나보시죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">역사학에서 '사회사(Social History)'는 왕이나 정치인 같은 지배층(elites)이 아닌, \u003cb class=\"key\">평범한 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>(ordinary people)의 삶에 주목하는 학문입니다. 하지만 과거에는 평범한 사람들이 교육을 받지 못해 자신들의 삶을 기록한 \u003cb class=\"key\">원자료\u003c/b>(primary sources)가 턱없이 부족했죠. 마치 유명 연예인의 화려한 일상만 소셜 미디어에 가득하고, 그들을 돕는 수많은 무대 뒤 스태프들의 이야기는 찾아보기 힘든 것과 같습니다. 이러한 기록의 \u003cb class=\"key\">편향성\u003c/b>(biases)을 극복하기 위해 사회사학자들은 지배층이 남긴 문서를 \u003cb class=\"key\">액면 \u003c/b>\u003cb class=\"key\">그대로\u003c/b>(at face value) 믿지 않습니다. 대신 문서의 빈 공간이나 숨겨진 의도 등을 파악하며 문서를 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">방식과 \u003c/b>\u003cb class=\"key\">다르게\u003c/b>(against the grain) 읽는 창의적인 연구 방식을 사용합니다.\u003c/div>","segs":[{"n":2,"text":"역사학에서 사회사는 왕이나 정치인 같은 지배층이 아닌 평범한 사람들의 삶에 주목하는 학문입니다. 하지만 과거에는 평범한 사람들이 교육을 받지 못해 자신들의 삶을 기록한 원자료가 턱없이 부족했죠. 마치 유명 연예인의 화려한 일상만 소셜 미디어에 가득하고, 그들을 돕는 수많은 무대 뒤 스태프들의 이야기는 찾아보기 힘든 것과 같습니다. 이러한 기록의 편향성을 극복하기 위해 사회사학자들은 지배층이 남긴 문서를 액면 그대로 믿지 않습니다. 대신 문서의 빈 공간이나 숨겨진 의도 등을 파악하며 문서를 일반적인 방식과 다르게 읽는 창의적인 연구 방식을 사용합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>사회사학자들은 다른 역사학자들처럼 다양한 \u003cb class=\"key\">원자료\u003c/b>를 사용하지만, 엘리트보다는 \u003cb class=\"key\">평범한 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>에게 주목한다고 밝힙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문제 제기\u003csmall>문제 제기 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>하지만 평범한 사람들은 교육 기회가 부족해 기록을 남기지 못했고, 남겼더라도 \u003cb class=\"key\">기록 \u003c/b>\u003cb class=\"key\">보관소\u003c/b>에 보존되어 이용될 확률이 낮았다는 현실적인 어려움을 꼬집습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>해결 방안\u003csmall>주장 및 해결 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>이러한 역사적 기록의 \u003cb class=\"key\">편향성\u003c/b> 때문에 사회사학자들은 \u003cb class=\"key\">창의적\u003c/b>이어야 한다고 강조합니다. 엘리트들이 만든 자료를 액면 그대로 받아들이지 않고 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">방식과 \u003c/b>\u003cb class=\"key\">다르게\u003c/b> 읽어내는 해결책을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>구체적 예시\u003csmall>예시 · 문장 8\u003c/small>\u003c/h4>\u003cp>노예 소유주의 법적 문서를 예로 들어, 명시된 사실뿐만 아니라 숨겨진 \u003cb class=\"key\">세부 \u003c/b>\u003cb class=\"key\">사항\u003c/b>들을 조사하여 노예들의 태도에 대한 \u003cb class=\"key\">힌트\u003c/b>를 얻는 방식을 구체적으로 보여줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 기록의 편향성이라는 문제를 제시하고, 이를 극복하는 사회사학자들의 창의적인 접근법을 순서대로 보여줍니다.","hl":null},{"n":4,"text":"첫 번째 단계인 도입부입니다. 첫 번째 문장과 두 번째 문장에서 사회사학자들은 다른 역사학자들처럼 다양한 원자료를 사용하지만, 엘리트보다는 평범한 사람들에게 주목한다고 말합니다. 연구의 대상을 명확히 밝히고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 문제 제기입니다. 세 번째 문장과 네 번째 문장에서 평범한 사람들은 교육 기회가 부족해 기록을 남기지 못했다고 합니다. 설령 남겼더라도 기록 보관소에 보존되어 연구자들에게 제공되는 경우가 드물었다며, 역사 연구의 현실적인 어려움을 꼬집고 있습니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 해결 및 주장입니다. 다섯 번째 문장에서 일곱 번째 문장을 보면, 이러한 기록의 편향성 때문에 사회사학자들은 매우 창의적이어야 한다고 강조합니다. 엘리트들이 만든 자료를 그저 액면 그대로 받아들이지 않고, 일반적인 방식과 다르게 읽어내는 획기적인 발상의 전환을 보여주죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 예시입니다. 마지막 여덟 번째 문장에서는 노예 소유주가 남긴 법적 문서를 예로 듭니다. 명시된 사실뿐만 아니라 공백이나 소문 등 숨겨진 세부 사항들을 조사하여 노예들의 태도와 행동에 대한 힌트를 얻는 구체적인 방법을 설명하고 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 평범한 사람들의 기록이 부족하다는 역사적 기록의 \u003cb class=\"key\">편향성\u003c/b>이라는 문제를 먼저 제시합니다. 그 후 이를 해결하기 위해 사회사학자들이 엘리트의 기록을 \u003cb class=\"key\">창의적\u003c/b>으로, 즉 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">방식과 \u003c/b>\u003cb class=\"key\">다르게\u003c/b> 읽는다는 해결책을 중간 부분에 핵심으로 제시하는 구조입니다. 마지막에는 노예 소유주의 문서에서 힌트를 찾는 \u003cb class=\"key\">예시\u003c/b>를 통해 주장을 뒷받침합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Yet (3)\u003c/b>\u003cspan>기존 통념이나 흐름을 뒤집으며 평범한 사람들의 기록이 부족하다는 문제를 제기함\u003c/span>\u003cb>Because of such biases (5)\u003c/b>\u003cspan>앞서 언급된 문제의 원인을 요약하며 사회사학자들의 창의적 접근이라는 해결책을 제시함\u003c/span>\u003cb>Yet rather than (7)\u003c/b>\u003cspan>단순히 표면적으로 수용하는 태도와 대비시켜 사회사학자들만의 독특한 독해 방식을 강조함\u003c/span>\u003cb>So, for example (8)\u003c/b>\u003cspan>앞선 주장을 뒷받침하기 위해 노예 소유주의 법적 문서라는 구체적인 사례를 도입함\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">ordinary people\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">non-elites\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">enslaved peoples\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>액면 그대로 읽기 (At face value)\u003c/th>\u003cth>다르게 읽기 (Against the grain)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>엘리트들이 제공한 명시적 '사실들'에만 주목\u003c/td>\u003ctd>공백, 단절, 소문 등 숨겨진 세부 사항 조사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>표면적 정보만 단순 수용\u003c/td>\u003ctd>문서 이면의 태도와 행동을 유추하는 창의적 해석\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결의 구조를 취하고 있습니다. 평범한 사람들의 기록이 부족하다는 역사적 기록의 편향성이라는 문제를 먼저 제시하죠. 그 후 이를 극복하기 위해 문서를 창의적이고 일반적인 방식과 다르게 읽어야 한다는 핵심 주장을 중간 부분인 다섯 번째 문장과 일곱 번째 문장에서 제시하는 중괄식 구조입니다.","hl":"ty"},{"n":9,"text":"글의 흐름을 알려주는 신호어를 볼까요? 세 번째 문장의 Yet과 다섯 번째 문장의 Because of such biases를 통해 문제와 인과 관계를 분명히 드러냅니다. 일곱 번째 문장의 Yet rather than은 대조를 통해 주장을 강조하고, 여덟 번째 문장의 So, for example은 앞선 주장을 뒷받침하는 명확한 예시를 이끌어냅니다. 지배층의 문서를 액면 그대로 읽는 것과 사회사학자의 다르게 읽기가 뚜렷한 대조를 이룹니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>primary source\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원자료\u003c/span>\u003c/div>\u003cdiv>\u003cb>emphasize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ordinary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>평범한\u003c/span>\u003c/div>\u003cdiv>\u003cb>elite\u003c/b>\u003cem>명사\u003c/em>\u003cspan>엘리트, 지배층\u003c/span>\u003c/div>\u003cdiv>\u003cb>lack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부족하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>access to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 대한 접근\u003c/span>\u003c/div>\u003cdiv>\u003cb>substantial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상당한, 풍부한\u003c/span>\u003c/div>\u003cdiv>\u003cb>amount\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양\u003c/span>\u003c/div>\u003cdiv>\u003cb>documentation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문서 기록\u003c/span>\u003c/div>\u003cdiv>\u003cb>preserve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>available\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>이용 가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>bias\u003c/b>\u003cem>명사\u003c/em>\u003cspan>편향, 편견\u003c/span>\u003c/div>\u003cdiv>\u003cb>creative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>창의적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>official\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관료, 공무원\u003c/span>\u003c/div>\u003cdiv>\u003cb>at face value\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>액면 그대로\u003c/span>\u003c/div>\u003cdiv>\u003cb>against the grain\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일반적인 방식과 다르게, 결을 거슬러\u003c/span>\u003c/div>\u003cdiv>\u003cb>legal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>법적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>document\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문서\u003c/span>\u003c/div>\u003cdiv>\u003cb>provide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>examine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interruption\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단절, 방해\u003c/span>\u003c/div>\u003cdiv>\u003cb>rumor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소문\u003c/span>\u003c/div>\u003cdiv>\u003cb>hint\u003c/b>\u003cem>명사\u003c/em>\u003cspan>힌트, 단서\u003c/span>\u003c/div>\u003cdiv>\u003cb>attitude\u003c/b>\u003cem>명사\u003c/em>\u003cspan>태도\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번 지문에서 꼭 기억해야 할 핵심 어휘들을 짚어보겠습니다. primary source는 원자료라는 뜻으로 역사 연구의 기본이 되는 단어입니다. substantial은 상당한 혹은 풍부한이라는 의미로, 양이나 정도가 클 때 쓰입니다. 그리고 at face value는 액면 그대로, against the grain은 일반적인 방식과 다르게라는 중요한 숙어 표현이니 꼭 암기해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">ordinary\u003c/b>\u003cspan class=\"m\">평범한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"s\">average\u003c/span>\u003cspan class=\"s\">normal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">extraordinary\u003c/span>\u003cspan class=\"a\">special\u003c/span>\u003cspan class=\"a\">elite\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">substantial\u003c/b>\u003cspan class=\"m\">상당한, 풍부한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">considerable\u003c/span>\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">ample\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insignificant\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">preserve\u003c/b>\u003cspan class=\"m\">보존하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">protect\u003c/span>\u003cspan class=\"s\">conserve\u003c/span>\u003cspan class=\"s\">maintain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">ruin\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">bias\u003c/b>\u003cspan class=\"m\">편향\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">prejudice\u003c/span>\u003cspan class=\"s\">partiality\u003c/span>\u003cspan class=\"s\">inclination\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fairness\u003c/span>\u003cspan class=\"a\">impartiality\u003c/span>\u003cspan class=\"a\">objectivity\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">creative\u003c/b>\u003cspan class=\"m\">창의적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inventive\u003c/span>\u003cspan class=\"s\">imaginative\u003c/span>\u003cspan class=\"s\">innovative\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unimaginative\u003c/span>\u003cspan class=\"a\">unoriginal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">examine\u003c/b>\u003cspan class=\"m\">조사하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inspect\u003c/span>\u003cspan class=\"s\">investigate\u003c/span>\u003cspan class=\"s\">analyze\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 출제되는 핵심 어휘의 동의어와 반의어를 살펴보겠습니다. ordinary의 동의어로는 common, average가 있고, 반의어로는 extraordinary, special이 있습니다. bias는 편향이라는 뜻으로, 동의어 prejudice, partiality를 기억하시고 반의어로는 fairness, objectivity를 알아두세요. creative의 동의어로는 inventive, innovative가 있으며, 반의어로는 unimaginative가 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 역사학자들과 마찬가지로,\u003c/span>\u003cspan class=\"en\">Like all historians,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회사학자들은\u003c/span>\u003cspan class=\"en\">social historians\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가져와 쓴다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">draw \u003c/span>\u003cspan class=\"tgt\">from\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 원자료들을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">variety \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> primary sources.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">모든 역사학자들과 마찬가지로, 사회사학자들은 다양한 원자료들을 가져와 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 다른 역사학자들과 마찬가지로 사회사학자 역시 연구를 위해 다양한 \u003cb class=\"key\">원자료\u003c/b>를 활용한다는 점을 도입부에서 제시합니다. 글의 핵심 소재인 사회사학자가 처음 등장하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사\u003c/span> : draw from [~에서 끌어내다/가져오다] : \"가져와 쓴다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사구\u003c/span> : a variety of + 복수명사 : \"다양한\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Like all historians, 모든 역사학자들과 마찬가지로. social historians, 사회사학자들은. draw from, 가져와 쓴다. a variety of primary sources, 다양한 원자료들을. 이 문장 전체를 해석하면, 모든 역사학자들과 마찬가지로, 사회사학자들은 다양한 원자료들을 가져와 쓴다.","hl":"m"},{"n":13,"text":"이 글은 사회사학자들의 연구 방식에 대해 이야기하고 있어요. 첫 문장에서는 사회사학자 역시 다른 역사학자들처럼 연구를 할 때 가장 기본이 되는 다양한 원자료들을 가져와서 쓴다는 사실을 보여주며 글을 시작합니다.","hl":"mn"},{"n":14,"text":"첫 번째로 볼 부분은 draw from입니다. draw는 무언가를 끌어내다라는 뜻인데, 전치사 from과 함께 쓰여서 어디어디에서 가져와 쓰다라는 의미가 됩니다. 두 번째는 a variety of 인데요, 다양한 이라는 뜻으로 primary sources를 꾸며주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회사는\u003c/span>\u003cspan class=\"en\">Social history\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대개 강조한다\u003c/span>\u003cspan class=\"en\">often \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">emphasizes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평범한 사람들을\u003c/span>\u003cspan class=\"en\">ordinary people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엘리트들보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than\u003c/span> elites.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사회사는 대개 엘리트들보다 평범한 사람들을 강조한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사회사 연구가 어떤 특징을 가지는지 명확히 밝히는 문장입니다. 왕이나 귀족 같은 소수의 엘리트 계층보다 대다수의 \u003cb class=\"key\">평범한 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>의 삶에 더 주목하고 강조한다는 것을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">단수 동사 수일치\u003c/span> : Social history [단수주어] + emphasizes [단수동사] : \"강조한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사적 접속사\u003c/span> : ordinary people + rather than + elites : \"~보다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Social history, 사회사는. often emphasizes, 대개 강조한다. ordinary people, 평범한 사람들을. rather than elites, 엘리트들보다. 이 문장 전체를 해석하면, 사회사는 대개 엘리트들보다 평범한 사람들을 강조한다.","hl":"m"},{"n":16,"text":"두 번째 문장에서는 사회사라는 학문 분야가 어떤 특징을 가지는지 알려줍니다. 왕이나 귀족 같은 엘리트들보다는 우리 같은 평범한 사람들의 삶에 더 초점을 맞추고 강조한다는 것이죠.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 emphasizes입니다. 주어인 Social history가 삼인칭 단수이기 때문에 동사 뒤에 s를 붙여 수일치를 시켜준 것입니다. 두 번째 포인트는 rather than이에요. 무엇무엇 보다는 이라는 뜻으로, 엘리트들 보다는 평범한 사람들을 강조한다는 의미를 잘 살려주고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">Yet,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 지역들과 시대들에서,\u003c/span>\u003cspan class=\"en\">in most places and times,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">엘리트가 아닌 사람들은\u003c/span>\u003cspan class=\"en\">non­elites\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교육에 대한 접근 기회가 부족했고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lacked\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">access \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> education\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서,\u003c/span>\u003cspan class=\"en\">and, thus,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생산하지 못했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">produce\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">풍부한 양의 문서로 된 기록을\u003c/span>\u003cspan class=\"en\">substantial amounts of documentation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 대부분의 지역들과 시대들에서, 엘리트가 아닌 사람들은 교육에 대한 접근 기회가 부족했고, 따라서, 풍부한 양의 문서로 된 기록을 생산하지 못했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 평범한 사람들은 과거에 교육을 제대로 받지 못해 자신의 삶을 기록한 \u003cb class=\"key\">문서\u003c/b>를 충분히 남기지 못했다는 점을 설명합니다. 사회사 연구가 직면할 수밖에 없는 근본적인 어려움을 제시하며 글의 흐름을 전환하는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조 (과거 동사)\u003c/span> : lacked [과거동사 1] ... and ... did not produce [과거동사 2] : \"부족했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사\u003c/span> : access [명사] + to [전치사] : \"~에 대한 접근\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조 (과거 동사)\u003c/span> : lacked [과거동사 1] ... and ... did not produce [과거동사 2] : \"생산하지 못했다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Yet, 하지만. in most places and times, 대부분의 지역들과 시대들에서. non­elites, 엘리트가 아닌 사람들은. lacked access to education, 교육에 대한 접근 기회가 부족했고. and, thus, 따라서. did not produce, 생산하지 못했다. substantial amounts of documentation, 풍부한 양의 문서로 된 기록을. 이 문장 전체를 해석하면, 하지만, 대부분의 지역들과 시대들에서, 엘리트가 아닌 사람들은 교육에 대한 접근 기회가 부족했고, 따라서, 풍부한 양의 문서로 된 기록을 생산하지 못했다.","hl":"m"},{"n":19,"text":"세 번째 문장에서는 사회사 연구의 어려움을 이야기하며 흐름을 뒤집습니다. 엘리트가 아닌 평범한 사람들은 과거에 글을 배울 기회가 없었기 때문에, 당연히 자신들이 남긴 문서 기록도 거의 없었다는 사실을 짚어줍니다.","hl":"mn"},{"n":20,"text":"첫 번째로 접속사 and를 중심으로 동사 과거형인 lacked와 did not produce가 병렬 구조를 이루고 있습니다. 주어인 non-elites가 교육 기회가 부족했고 그래서 기록을 생산하지 못했다는 흐름이죠. 두 번째로 access to에서 to는 전치사입니다. 어디어디로의 접근이라는 의미를 만들어줍니다. 마지막으로 did not produce는 앞서 말했듯이 lacked와 병렬 구조를 이루며 주어에 연결된 두 번째 과거 동사라는 점 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 그들이 문서로 된 기록을 정말로 생산했을 때조차도,\u003c/span>\u003cspan class=\"en\">Even when they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">did \u003c/span>\u003cspan class=\"tgt\">produce\u003c/span> documentation,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 자료들은 기록 보관소들에 거의 다다르지 못했다\u003c/span>\u003cspan class=\"en\">these materials \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rarely \u003c/span>\u003cspan class=\"tgt\">ended \u003c/span>\u003cspan class=\"tgt\">up\u003c/span> in archives\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 보존될 수 있고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">preserved \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연구자들에게 이용 가능해질 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">available\u003c/span> to researchers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심지어 그들이 문서로 된 기록을 정말로 생산했을 때조차도, 이러한 자료들은 그것들이 보존될 수 있고 연구자들에게 이용 가능해질 수 있는 기록 보관소들에 거의 다다르지 못했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비엘리트층이 기록을 남겼다고 해도 보존되지 않아 자료가 부족하다는 점을 강조합니다. 즉, 평범한 사람들의 역사를 연구하는 \u003cb class=\"key\">사회사학자들\u003c/b>이 직면한 \u003cb class=\"key\">자료 \u003c/b>\u003cb class=\"key\">수집의 \u003c/b>\u003cb class=\"key\">한계\u003c/b>를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사의 강조\u003c/span> : did [조동사] + produce [동사원형] : \"정말로 생산했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정 부사\u003c/span> : rarely [부정 부사] + ended up [동사] : \"거의 다다르지 못했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계부사의 제한적 용법\u003c/span> : archives [선행사] + where [관계부사] + 완전한 문장 : \"그것들이 보존될 수 있고 ~ 이용 가능해질 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Even when they did produce documentation, 심지어 그들이 문서로 된 기록을 정말로 생산했을 때조차도. these materials rarely ended up in archives, 이러한 자료들은 기록 보관소들에 거의 다다르지 못했다. where they could be preserved, 그것들이 보존될 수 있고. and made available to researchers, 연구자들에게 이용 가능해질 수 있는. 이 문장 전체를 해석하면, 심지어 그들이 문서로 된 기록을 정말로 생산했을 때조차도, 이러한 자료들은 그것들이 보존될 수 있고 연구자들에게 이용 가능해질 수 있는 기록 보관소들에 거의 다다르지 못했다.","hl":"m"},{"n":22,"text":"비엘리트층이 기록을 남겼다고 해도 보존되지 않아서 자료가 부족하다는 점을 강조하는 문장이에요. 즉, 평범한 사람들의 역사를 연구하는 사회사학자들이 직면한 자료 수집의 한계를 잘 보여주고 있죠.","hl":"mn"},{"n":23,"text":"첫 번째로 문장 맨 앞쪽에 did produce를 볼게요. 동사 produce의 의미를 강조하기 위해 조동사 did를 앞에 썼어요. 그래서 정말로 생산했다라고 해석하죠. 두 번째로 rarely ended up 부분입니다. rarely는 부정의 의미를 담고 있어서 낫과 같은 명시적인 부정어가 없어도 문장 전체를 부정문으로 해석해야 해요. 세 번째로 archives 뒤에 있는 where 절을 볼까요. 장소를 나타내는 선행사 archives를 수식하는 관계부사인데요, 뒤에는 수동태로 이루어진 완전한 문장이 이어지고 있답니다. be preserved와 made가 병렬 구조로 연결된 것도 확인해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역사적 기록에서의 그러한 편향들 때문에,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Because \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">biases\u003c/span> in the historical record,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회사학자들은 매우 창의적이어야 한다\u003c/span>\u003cspan class=\"en\">social historians have to be very creative\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 작업에 있어서.\u003c/span>\u003cspan class=\"en\">in their work.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">역사적 기록에서의 그러한 편향들 때문에, 사회사학자들은 자신들의 작업에 있어서 매우 창의적이어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엘리트 위주로 남겨진 기록의 한계 때문에 사회사학자들은 평범한 사람들의 삶을 파악하기 위해 다른 방식을 써야 한다는 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>를 제시합니다. 여기서 '창의적'이라는 말은 뒤이어 나올 \u003cb class=\"key\">이면의 \u003c/b>\u003cb class=\"key\">의미 \u003c/b>\u003cb class=\"key\">읽기\u003c/b> 방식을 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 전치사구\u003c/span> : Because of [전치사구] + 명사(구) : \"그러한 편향들 때문에\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Because of such biases in the historical record, 역사적 기록에서의 그러한 편향들 때문에. social historians have to be very creative, 사회사학자들은 매우 창의적이어야 한다. in their work, 자신들의 작업에 있어서.. 이 문장 전체를 해석하면, 역사적 기록에서의 그러한 편향들 때문에, 사회사학자들은 자신들의 작업에 있어서 매우 창의적이어야 한다.","hl":"m"},{"n":25,"text":"엘리트 위주로 남겨진 기록의 한계 때문에 사회사학자들은 평범한 사람들의 삶을 파악하기 위해 다른 방식을 써야 한다는 이 글의 핵심 주제를 제시하는 문장이에요. 여기서 창의적이라는 말은 뒤이어 나올 이면의 의미 읽기 방식을 미리 예고해 주는 단서가 됩니다.","hl":"mn"},{"n":26,"text":"문장 맨 앞의 Because of를 주의해서 봐야 해요. 뜻은 뭐뭐 때문이라는 뜻으로 같지만, Because of는 접속사가 아니라 전치사이기 때문에 뒤에 주어와 동사가 있는 문장이 오면 안 되고 명사구가 와야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 역사학자들처럼,\u003c/span>\u003cspan class=\"en\">Like other historians,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회사학자들은 텍스트 자료를 분석한다\u003c/span>\u003cspan class=\"en\">social historians analyze textual \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">sources \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정부 관료들, 고용주들, 그리고 다른 엘리트들에 의해 생산된.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">produced \u003c/span>\u003cspan class=\"tgt\">by\u003c/span> government officials, employers, and other elites.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 역사학자들처럼 사회사학자들은 정부 관료들, 고용주들, 그리고 다른 엘리트들에 의해 생산된 텍스트 자료를 분석한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사회사학자들도 기본적으로는 엘리트들이 남긴 공적인 자료를 활용한다는 점을 인정하며, 이들이 \u003cb class=\"key\">창의적인 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 구체적으로 어떻게 적용하는지 설명하기 위한 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 후위 수식\u003c/span> : 명사 [sources] + 과거분사 [produced] : \"생산된 자료\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Like other historians, 다른 역사학자들처럼. social historians analyze textual sources, 사회사학자들은 텍스트 자료를 분석한다. produced by government officials, employers, and other elites, 정부 관료들, 고용주들, 그리고 다른 엘리트들에 의해 생산된.. 이 문장 전체를 해석하면, 다른 역사학자들처럼 사회사학자들은 정부 관료들, 고용주들, 그리고 다른 엘리트들에 의해 생산된 텍스트 자료를 분석한다.","hl":"m"},{"n":28,"text":"사회사학자들도 다른 역사학자들처럼 기본적으로는 엘리트들이 남긴 공적인 자료를 활용한다는 점을 일단 인정하고 있어요. 이 문장은 이들이 창의적인 방식을 구체적으로 어떻게 적용하는지 설명하기 위한 도입 역할을 합니다.","hl":"mn"},{"n":29,"text":"문장 뒷부분에 sources produced by를 잘 보세요. 명사인 sources와 동사 produce의 관계를 따져보면, 자료가 스스로 무언가를 생산하는 게 아니라 사람에 의해 생산되는 거니까 수동의 의미죠. 그래서 과거분사인 produced가 뒤에서 앞의 명사를 꾸며주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 \u003c/span>\u003cspan class=\"en\">Yet\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순히 받아들이기보다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">simply \u003c/span>\u003cspan class=\"tgt\">take\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 자료들을 \u003c/span>\u003cspan class=\"en\">such sources\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">액면 그대로, \u003c/span>\u003cspan class=\"en\">at face value,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그것들을 해석한다 \u003c/span>\u003cspan class=\"en\">they read them\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘일반적인 방식과 다르게’.\u003c/span>\u003cspan class=\"en\">&quot;against the grain&quot;.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그러한 자료들을 단순히 액면 그대로 받아들이기보다 그들은 그것들을 ‘일반적인 방식과 다르게’ 해석한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사회사학자들이 엘리트 계층이 남긴 자료를 다루는 방식을 보여줍니다. 겉으로 드러난 것을 \u003cb class=\"key\">액면 \u003c/b>\u003cb class=\"key\">그대로\u003c/b> 받아들이지 않고, 결을 거슬러 즉 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">방식과 \u003c/b>\u003cb class=\"key\">다르게\u003c/b> 비판적으로 자료를 분석한다는 핵심 논지를 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : rather than + [동사원형] : \"단순히 받아들이기보다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Yet, 하지만. rather than simply take, 단순히 받아들이기보다. such sources, 그러한 자료들을. at face value, 액면 그대로. they read them, 그들은 그것들을 해석한다. \"against the grain\", ‘일반적인 방식과 다르게’.. 이 문장 전체를 해석하면, 하지만 그러한 자료들을 단순히 액면 그대로 받아들이기보다 그들은 그것들을 ‘일반적인 방식과 다르게’ 해석한다.","hl":"m"},{"n":31,"text":"이 문장은 사회사학자들이 엘리트 계층이 남긴 자료를 다루는 방식을 보여줍니다. 겉으로 드러난 것을 액면 그대로 받아들이지 않고, 결을 거슬러 즉 일반적인 방식과 다르게 비판적으로 자료를 분석한다는 핵심 논지를 담고 있어요.","hl":"mn"},{"n":32,"text":"어법 포인트를 짚어볼게요. rather than simply take 부분을 보세요. 주절의 동사 read와 짝을 이루어 연결되었어요. rather than 뒤에 동사원형 take가 쓰여 병렬 구조를 이루고 있다는 점을 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서, 예를 들어, \u003c/span>\u003cspan class=\"en\">So, for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사회사학자는 법적 문서들을 읽을 것이다 \u003c/span>\u003cspan class=\"en\">a social historian will read legal documents\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘사실들’을 얻기 위해서 뿐만 아니라 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">&quot;facts&quot;\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노예 소유주들에 의해 제공된; \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">provided \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">slaveowners\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 또한 조사할 것이다 \u003c/span>\u003cspan class=\"en\">she will also examine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공백들, 단절들, 소문들, 그리고 다른 세부 사항들을 \u003c/span>\u003cspan class=\"en\">the silences, interruptions, rumors, and other details\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">힌트들을 제공하는 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">offer \u003c/span>\u003cspan class=\"tgt\">hints\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노예가 된 사람들의 태도들과 행동들에 대한.\u003c/span>\u003cspan class=\"en\">about the enslaved peoples' attitudes and actions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서, 예를 들어, 어떤 사회사학자는 법적 문서들을 노예 소유주들에 의해 제공된 ‘사실들’을 얻기 위해 읽을 뿐만 아니라, 그녀는 또한 노예가 된 사람들의 태도들과 행동들에 대한 힌트들을 제공하는 공백들, 단절들, 소문들, 그리고 다른 세부 사항들을 조사할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사회사학자가 자료를 어떻게 '결을 거슬러' 읽는지 구체적인 \u003cb class=\"key\">예시\u003c/b>를 통해 설명합니다. 엘리트가 기록한 사실뿐만 아니라, 기록되지 않은 \u003cb class=\"key\">공백과 \u003c/b>\u003cb class=\"key\">세부 \u003c/b>\u003cb class=\"key\">사항\u003c/b>들을 분석해 노예들의 삶을 재구성한다는 점을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 (not only A but also B)\u003c/span> : not only [A] ... ; she will also [B] : \"‘사실들’을 얻기 위해 ~할 뿐만 아니라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사 (명사 수식)\u003c/span> : 명사(the &quot;facts&quot;) + [과거분사구] : \"노예 소유주들에 의해 제공된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(details) + that + [동사] : \"힌트들을 제공하는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"So, for example, 그래서, 예를 들어. a social historian will read legal documents, 어떤 사회사학자는 법적 문서들을 읽을 것이다. not only for the \"facts\", ‘사실들’을 얻기 위해서 뿐만 아니라. provided by slaveowners, 노예 소유주들에 의해 제공된;. she will also examine, 그녀는 또한 조사할 것이다. the silences, interruptions, rumors, and other details, 공백들, 단절들, 소문들, 그리고 다른 세부 사항들을. that offer hints, 힌트들을 제공하는. about the enslaved peoples' attitudes and actions, 노예가 된 사람들의 태도들과 행동들에 대한.. 이 문장 전체를 해석하면, 그래서, 예를 들어, 어떤 사회사학자는 법적 문서들을 노예 소유주들에 의해 제공된 ‘사실들’을 얻기 위해 읽을 뿐만 아니라, 그녀는 또한 노예가 된 사람들의 태도들과 행동들에 대한 힌트들을 제공하는 공백들, 단절들, 소문들, 그리고 다른 세부 사항들을 조사할 것이다.","hl":"m"},{"n":34,"text":"이 문장은 사회사학자가 자료를 어떻게 결을 거슬러 읽는지 구체적인 예시를 통해 설명합니다. 엘리트가 기록한 사실뿐만 아니라, 기록되지 않은 공백과 세부 사항들을 분석해 노예들의 삶을 재구성한다는 점을 보여주죠.","hl":"mn"},{"n":35,"text":"어법 포인트 세 가지를 살펴볼게요. 첫 번째로 not only for the \"facts\" 부분이에요. 이 문장은 문맥상 not only A but also B 구조가 응용되어 쓰였어요. 앞 문장의 not only와 세미콜론 뒤의 also가 짝을 이루어, 사실을 위해 읽을 뿐만 아니라 다른 세부 사항들도 또한 조사할 것이라는 의미를 나타냅니다. 두 번째로 provided by slaveowners를 볼까요? 앞의 명사 facts를 꾸며주는 과거분사예요. 사실들이 스스로 제공하는 것이 아니라 수동적으로 제공되는 관계이니까 과거분사 provided가 쓰였답니다. 세 번째로 that offer hints에서는 that이 앞의 선행사인 details 등을 꾸며주는 주격 관계대명사로 쓰였어요. 뒤에 주어 없이 바로 동사 offer가 이어지는 것을 확인할 수 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사회사학자들은 지배층보다는 \u003cb class=\"key\">평범한 \u003c/b>\u003cb class=\"key\">사람들\u003c/b>의 삶을 연구하는 데 중점을 둡니다.\u003c/li>\u003cli>하지만 평범한 사람들은 문서 기록을 남기기 어려웠기 때문에 역사적 기록에는 \u003cb class=\"key\">편향성\u003c/b>이 존재합니다.\u003c/li>\u003cli>이를 극복하기 위해 사회사학자들은 지배층이 남긴 문서를 \u003cb class=\"key\">액면 \u003c/b>\u003cb class=\"key\">그대로\u003c/b> 받아들이지 않습니다.\u003c/li>\u003cli>대신, 그들은 문서를 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">방식과 \u003c/b>\u003cb class=\"key\">다르게\u003c/b> 읽으며 숨겨진 세부 사항들을 창의적으로 찾아냅니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Social historians must creatively read elite-produced sources against the grain to uncover the history of ordinary people who left few records.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">사회사학자들은 평범한 사람들을 연구하지만 이들이 남긴 기록이 부족하다는 \u003cb class=\"key\">편향성\u003c/b>을 극복하기 위해, 지배층의 기록을 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">방식과 \u003c/b>\u003cb class=\"key\">다르게\u003c/b> 창의적으로 해석한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"자, 이렇게 사회사학자들이 편향된 기록이라는 한계를 어떻게 극복하는지 살펴보았습니다. 없는 기록을 탓하기보다는 있는 기록의 이면을 들여다보는 창의성이 돋보이는 흥미로운 글이었죠. 복습하실 때 오늘 배운 숙어 표현들과 문제 해결 구조를 다시 한번 꼭 확인해 보시기 바랍니다. 수고하셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
