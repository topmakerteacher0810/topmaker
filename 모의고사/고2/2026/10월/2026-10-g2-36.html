</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 36번","audioDir":"2026-10-g2-36_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">36번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>The Importance of Usability Testing for Designers\u003c/h1>\u003ch2>디자이너를 위한 사용성 테스트의 중요성\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>디자이너는 자신이 사용자가 아님을 인정하고 객관성을 확보하기 위해 실제 \u003cb class=\"key\">사용성 \u003c/b>\u003cb class=\"key\">테스트\u003c/b>를 활용하여 제품을 개선해야 합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Designers should use usability testing with real users to objectively evaluate and improve their products.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 함께 살펴볼 지문은 디자이너들이 꼭 알아야 할 아주 중요한 원칙에 대한 글이에요. 핵심 요지부터 말씀드리자면, 디자이너는 자신이 사용자가 아님을 인정하고 객관성을 확보하기 위해 실제 사용성 테스트를 활용해서 제품을 개선해야 한다는 내용입니다. 자, 그럼 어떤 이야기인지 본격적으로 들어가 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">디자인을 할 때 가장 흔히 빠지는 함정은 자신이 만든 것을 너무 잘 안다는 것입니다. 이를 심리학에서는 지식의 저주(Curse of Knowledge)라고도 부릅니다. 내가 이 버튼의 기능을 아니까 다른 사람도 당연히 알 것이라고 착각하는 현상이죠. 마치 내가 만든 \u003cb class=\"key\">요리\u003c/b>를 내가 맛보고 완벽하다고 생각하지만, 처음 먹는 사람에게는 짜거나 매울 수 있는 것과 같습니다. 따라서 디자이너들은 제품을 출시하기 전에 반드시 실제 사용자들을 대상으로 \u003cb class=\"key\">사용성 \u003c/b>\u003cb class=\"key\">테스트\u003c/b>(usability testing)를 거쳐 객관적인 데이터를 얻어야 합니다.\u003c/div>","segs":[{"n":2,"text":"우리가 무언가를 직접 만들다 보면, 자신이 만든 결과물을 너무 잘 알게 되는 함정에 빠지곤 해요. 심리학에서는 이런 현상을 지식의 저주, 영어로는 Curse of Knowledge라고 부르죠. 내가 이 버튼의 기능을 완벽히 이해하니까 남들도 당연히 알 거라고 착각하는 거예요. 마치 내가 만든 요리를 맛보고 완벽하다고 믿지만, 처음 먹는 사람에게는 너무 짜거나 매울 수 있는 것과 똑같아요. 그래서 디자이너들은 제품을 내놓기 전에 반드시 실제 사용자들을 대상으로 usability testing, 즉 사용성 테스트를 거쳐서 객관적인 데이터를 얻어야만 한답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 문제 제기\u003csmall>문제 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 문장부터 디자이너가 저지르기 쉬운 착각을 지적합니다. 디자이너는 자신이 만드는 제품에 너무 가까이 있어 그것을 객관적으로 보지 못합니다. 따라서 자신이 \u003cb class=\"key\">사용자\u003c/b>가 아님을 겸허히 인정해야 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>전환 및 해결책 제시\u003csmall>해결 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>어떻게 하면 더 효과적인 작업을 할 수 있을지 질문을 던지며 분위기를 전환합니다. 그 해답으로, 가장 좋은 인터페이스는 실제 사용자를 관찰하여 만들어지며, 이를 위한 가장 훌륭한 방법이 바로 \u003cb class=\"key\">사용성 \u003c/b>\u003cb class=\"key\">테스트\u003c/b>라고 주장합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>부연 설명 및 결론\u003csmall>결론 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>사용성 테스트의 구체적인 목표와 효과를 부연 설명합니다. 실제 활동에 참여하게 함으로써 문제점을 발견하고 선호도를 파악합니다. 최종적으로 여기서 얻은 발견을 바탕으로 \u003cb class=\"key\">수정\u003c/b>을 거쳐 작업물을 크게 개선할 수 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 디자이너의 흔한 착각이라는 문제점을 먼저 짚어주고, 그에 대한 명확한 해결책을 제시하는 흐름으로 전개되고 있어요.","hl":null},{"n":4,"text":"첫 번째 문장과 두 번째 문장에서는 도입부이자 디자이너가 저지르기 쉬운 착각을 지적하고 있어요. 디자이너는 자신이 만드는 제품에 너무 가까이 밀착되어 있어서 그것을 객관적으로 보지 못한다고 하죠. 그래서 자신이 절대 사용자가 될 수 없음을 겸허히 인정해야 한다는 겁니다.","hl":"f0"},{"n":5,"text":"세 번째 문장부터 다섯 번째 문장까지는 분위기를 전환하며 해결책을 제시하는 부분이에요. 어떻게 하면 디자이너가 더 효과적인 작업을 할 수 있을지 질문을 던지죠. 그 해답으로, 가장 좋은 사용자 환경은 실제 사용자를 관찰할 때 만들어지며, 이를 위한 최고의 방법이 바로 사용성 테스트라고 아주 강하게 주장합니다.","hl":"f1"},{"n":6,"text":"여섯 번째 문장부터 마지막 여덟 번째 문장까지는 그 해결책의 구체적인 목표와 결론을 부연 설명하고 있어요. 실제 참가자들을 활동에 참여시켜서 문제점을 발견하고 선호도를 배우는 게 목적이라고 하죠. 결국, 이런 테스트에서 얻은 발견을 바탕으로 수정을 거쳐야만 최종적으로 작업물을 훌륭하게 개선할 수 있다고 결론을 내립니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 초반부에서 디자이너가 객관성을 잃기 쉽다는 \u003cb class=\"key\">문제점\u003c/b>을 제기합니다. 이어지는 중반부에서 질문과 답변 형식을 통해 \u003cb class=\"key\">사용성 \u003c/b>\u003cb class=\"key\">테스트\u003c/b>라는 구체적인 해결책을 핵심 주제로 제시합니다. 후반부에서는 이 방법의 장점과 최종적인 활용 목적을 설명하며 글을 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>So (4)\u003c/b>\u003cspan>질문을 통한 주의 환기 및 국면 전환\u003c/span>\u003cb>The goal of this method (6)\u003c/b>\u003cspan>앞서 제시된 해결책의 구체적인 목적 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the fact that we are not the user\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">observations of real users\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">usability testing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">findings from representative users\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>디자이너\u003c/th>\u003cth>실제 사용자\u003c/th>\u003c/tr>\u003ctr>\u003ctd>제품에 너무 가까움 (too close)\u003c/td>\u003ctd>실제 활동에 참여 (engage in realistic activities)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>객관성 부족 (cannot objectively see)\u003c/td>\u003ctd>디자인의 실제 성능 검증 (how well a design will perform)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 전형적인 문제와 해결 구조를 띠고 있어요. 초반에는 디자이너의 주관성이라는 문제점을 제기하고, 중반부에서 사용성 테스트라는 구체적인 해결책을 딱 던져주죠. 글의 중간에 핵심 주제가 명확히 등장하는 중괄식 패턴이라고 볼 수 있습니다.","hl":"ty"},{"n":8,"text":"글의 흐름을 잡아주는 중요한 신호어들을 살펴볼까요? 네 번째 문장에서 So라는 접속사로 질문을 던지며 시선을 쫙 끌어모으죠. 그리고 여섯 번째 문장에서는 The goal of this method라고 하면서 앞서 말한 사용성 테스트의 목적을 친절하게 풀어서 설명해 주고 있어요. 디자이너와 실제 사용자라는 명확한 대조 구도를 머릿속에 그리면서 읽으면 전체적인 뼈대가 훨씬 쉽게 잡힐 거예요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>embrace\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수용하다, 받아들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>effective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효과적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>objectively\u003c/b>\u003cem>부사\u003c/em>\u003cspan>객관적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>interact\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상호 작용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interface\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인터페이스, 접점\u003c/span>\u003c/div>\u003cdiv>\u003cb>observation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관찰\u003c/span>\u003c/div>\u003cdiv>\u003cb>usability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사용성, 유용성\u003c/span>\u003c/div>\u003cdiv>\u003cb>uncover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아내다, 밝히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가능성, 기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>preference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선호도, 선호하는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>participant\u003c/b>\u003cem>명사\u003c/em>\u003cspan>참가자\u003c/span>\u003c/div>\u003cdiv>\u003cb>engage in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 참여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>realistic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>실제적인, 현실적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>technique\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술, 기법\u003c/span>\u003c/div>\u003cdiv>\u003cb>subsequent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>차후의, 그 다음의\u003c/span>\u003c/div>\u003cdiv>\u003cb>revision\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수정, 개정\u003c/span>\u003c/div>\u003cdiv>\u003cb>representative\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대표적인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"본문에 나온 중요한 단어들도 챙겨볼게요. embrace는 수용하다, 받아들이다라는 뜻의 동사입니다. 그리고 objectively는 객관적으로라는 뜻의 부사인데, 디자이너가 잃기 쉬운 태도를 나타내는 핵심 단어죠. 마지막으로 subsequent는 차후의, 그 다음의라는 뜻으로, 테스트 이후에 이어지는 개선 과정을 설명할 때 아주 중요하게 쓰인답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">embrace\u003c/b>\u003cspan class=\"m\">수용하다, 받아들이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accept\u003c/span>\u003cspan class=\"s\">adopt\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003cspan class=\"a\">refuse\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">objectively\u003c/b>\u003cspan class=\"m\">객관적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">impartially\u003c/span>\u003cspan class=\"s\">neutrally\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">subjectively\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">uncover\u003c/b>\u003cspan class=\"m\">밝히다, 알아내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reveal\u003c/span>\u003cspan class=\"s\">discover\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">subsequent\u003c/b>\u003cspan class=\"m\">차후의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">following\u003c/span>\u003cspan class=\"s\">succeeding\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">prior\u003c/span>\u003cspan class=\"a\">previous\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">representative\u003c/b>\u003cspan class=\"m\">대표적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">typical\u003c/span>\u003cspan class=\"s\">exemplary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">atypical\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"시험에 자주 나오는 유의어와 반의어도 깔끔하게 정리해 드릴게요. 먼저 embrace는 받아들이다라는 뜻이니까 동의어로 accept나 adopt를 쓸 수 있고, 반의어로는 거절하다는 뜻의 reject나 refuse가 올 수 있어요. objectively는 객관적으로라는 뜻인데, 동의어로 impartially를 쓸 수 있고, 반대로 주관적으로라는 뜻의 subjectively가 반의어가 되겠죠. uncover는 알아내다, 밝히다라는 뜻으로 reveal이나 discover와 같고, 숨기다는 뜻의 conceal이 반의어가 됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순한 진리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">simple \u003c/span>\u003cspan class=\"tgt\">truth \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디자이너들이 수용해야만 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">designers \u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">embrace\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들어 내기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">order \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">create\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 효과적인 제품과 경험을\u003c/span>\u003cspan class=\"en\">more effective products and experiences\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fact \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 사용자가 아니라는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">user.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">디자이너들이 더 효과적인 제품과 경험을 만들어 내기 위해 수용해야만 하는 단순한 진리는 우리가 ‘사용자가 아니라’는 사실이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 주제문으로, 디자이너가 제품을 만들 때 명심해야 할 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">전제\u003c/b>를 제시하고 있습니다. 자신이 곧 사용자라는 착각에서 벗어나야 \u003cb class=\"key\">객관적인 \u003c/b>\u003cb class=\"key\">설계\u003c/b>가 가능하다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사\u003c/span> : 명사 [선행사] + that [목적격 관계대명사] + 주어 + 타동사 : \"디자이너들이 수용해야만 하는 단순한 진리\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : in order + to + 동사원형 : \"만들어 내기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수일치\u003c/span> : 단수 주어(truth) + 단수 동사(is) : \"사실이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">동격의 that\u003c/span> : 명사(the fact) + that [동격 접속사] + 완전한 문장 : \"우리가 사용자가 아니라는 사실\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"A simple truth, 단순한 진리는. that designers must embrace, 디자이너들이 수용해야만 하는. in order to create, 만들어 내기 위해. more effective products and experiences, 더 효과적인 제품과 경험을. is the fact, 사실이다. that we are not the user, 우리가 사용자가 아니라는. 이 문장 전체를 해석하면, 디자이너들이 더 효과적인 제품과 경험을 만들어 내기 위해 수용해야만 하는 단순한 진리는 우리가 ‘사용자가 아니라’는 사실이다.","hl":"m"},{"n":12,"text":"이 문장은 이 글의 주제문이에요. 디자이너가 제품을 만들 때 명심해야 할 핵심 전제를 제시하고 있죠. 자신이 곧 사용자라는 착각에서 벗어나야 객관적인 설계가 가능하다는 점을 강조하고 있습니다.","hl":"mn"},{"n":13,"text":"어법 포인트 살펴볼게요. 첫 번째로, A simple truth that designers must embrace에서 that은 목적격 관계대명사예요. 선행사인 truth를 꾸며주는 절로, embrace의 목적어 역할을 하고 있죠. 두 번째로, in order to create에서는 목적을 명확히 나타내기 위해 in order가 to부정사 앞에 쓰였어요. 세 번째로, is the fact의 is는 수일치를 보여주는데요, 문장의 진짜 주어는 A simple truth이기 때문에 단수형 동사인 is가 쓰인 거랍니다. 네 번째로, the fact that we are not the user에서 that은 동격 접속사예요. 추상명사인 the fact의 구체적인 내용을 보충 설명하는 동격 접속사 that이 완전한 문장을 이끌고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 너무 가깝다\u003c/span>\u003cspan class=\"en\">We're much \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">close \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 만드는 것에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">build \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 객관적으로 보기에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">objectively \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이해하기에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용자들이 그것과 어떻게 상호 작용할지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">users \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">interact \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">it.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 우리가 만드는 것에 너무 가까워서 그것을 객관적으로 보고 사용자들이 그것과 어떻게 상호 작용할지 이해할 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 디자이너가 자신의 결과물을 \u003cb class=\"key\">객관화\u003c/b>하지 못하는 이유를 설명합니다. 자신이 만든 것에 지나치게 몰입해 있기 때문에, 실제 사용자의 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">작용\u003c/b> 방식을 제대로 예측할 수 없다는 문제점을 지적하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">too ~ to 구문\u003c/span> : too + 형용사/부사 + to + 동사원형 : \"우리가 만드는 것에 너무 가까워서 그것을 객관적으로 볼 수 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : 전치사(to) + what [선행사를 포함한 관계대명사] + 주어 + 동사 : \"우리가 만드는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : to + 동사원형 and 동사원형 : \"그것을 보고 이해하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사(how) + 주어(users) + 동사(will interact) : \"사용자들이 그것과 어떻게 상호 작용할지\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"We're much too close, 우리는 너무 가깝다. to what we build, 우리가 만드는 것에. to objectively see it, 그것을 객관적으로 보기에는. and understand, 그리고 이해하기에는. how users will interact with it, 사용자들이 그것과 어떻게 상호 작용할지. 이 문장 전체를 해석하면, 우리는 우리가 만드는 것에 너무 가까워서 그것을 객관적으로 보고 사용자들이 그것과 어떻게 상호 작용할지 이해할 수 없다.","hl":"m"},{"n":15,"text":"이 문장은 디자이너가 자신의 결과물을 객관화하지 못하는 이유를 설명하고 있어요. 자신이 만든 것에 지나치게 몰입해 있기 때문에, 실제 사용자의 상호 작용 방식을 제대로 예측할 수 없다는 문제점을 지적하고 있죠.","hl":"mn"},{"n":16,"text":"중요한 어법이 많이 나오는 문장이에요. 첫 번째로, too close to what we build to objectively see it 부분은 투투 구문이에요. 너무 가까워서 객관적으로 볼 수 없다는 부정의 의미를 담고 있죠. 두 번째로, what we build의 what은 선행사를 포함한 관계대명사로, 전치사 to의 목적어 역할을 하고 있어요. 세 번째로, see it and understand에서는 접속사 and가 투부정사에 걸리는 동사원형 see와 understand를 연결하며 병렬 구조를 이루고 있습니다. 마지막 네 번째로, how users will interact with it은 간접의문문이에요. understand의 목적어 역할을 하면서 의문사 주어 동사의 어순을 잘 따르고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 좋은 사용자 인터페이스들은\u003c/span>\u003cspan class=\"en\">The best user interfaces\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">것들이다\u003c/span>\u003cspan class=\"en\">are \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">those\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만들어져 온\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">shaped\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제 사용자들에 대한 관찰 결과들에 의해\u003c/span>\u003cspan class=\"en\">by \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">observations \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">real \u003c/span>\u003cspan class=\"tgt\">users \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그들의 그것들과의 상호 작용에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">interactions\u003c/span> with them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가장 좋은 사용자 인터페이스들은 실제 사용자들과 그들의 그것들과의 상호 작용에 대한 관찰 결과들에 의해 만들어져 온 것들이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 제기된 문제에 대한 \u003cb class=\"key\">해결 \u003c/b>\u003cb class=\"key\">방향\u003c/b>을 제시하는 문장입니다. 훌륭한 인터페이스는 디자이너의 직관이 아니라, 실제 사용자를 면밀히 \u003cb class=\"key\">관찰\u003c/b>한 결과물에서 나온다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사\u003c/span> : 대명사 : \"것들(인터페이스들)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사와 현재완료 수동태\u003c/span> : 명사 [선행사] + that [주격 관계대명사] + have been + p.p. : \"만들어져 온\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사의 목적어 병렬\u003c/span> : 명사구 and 명사구 : \"실제 사용자들과 그들의 상호 작용에 대한 관찰 결과들\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"The best user interfaces, 가장 좋은 사용자 인터페이스들은. are those, 것들이다. that have been shaped, 만들어져 온. by observations of real users, 실제 사용자들에 대한 관찰 결과들에 의해. and their interactions with them, 그리고 그들의 그것들과의 상호 작용에 대한. 이 문장 전체를 해석하면, 가장 좋은 사용자 인터페이스들은 실제 사용자들과 그들의 그것들과의 상호 작용에 대한 관찰 결과들에 의해 만들어져 온 것들이다.","hl":"m"},{"n":18,"text":"이 문장은 앞서 말한 문제점들을 어떻게 풀 수 있을지 해결 방향을 제시하고 있어요. 훌륭한 인터페이스는 디자이너 혼자만의 생각이 아니라, 실제 사용자를 꼼꼼하게 관찰한 결과물에서 비롯된다는 점을 알려주는 문장이랍니다.","hl":"mn"},{"n":19,"text":"여기서도 문법 포인트 세 가지 확인해 볼게요. 첫 번째로, are those의 those는 앞에 나온 복수 명사인 user interfaces를 대신 받는 지시대명사예요. 두 번째로, that have been shaped는 주격 관계대명사절 안에 현재완료 수동태가 쓰인 형태예요. 과거부터 지금까지 관찰에 의해 형성되어 왔다는 수동의 의미를 잘 전달하고 있죠. 세 번째로, 전치사 of 뒤에 real users와 their interactions가 and로 묶이면서 전치사의 목적어가 병렬 구조를 이루고 있다는 점도 놓치지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 디자이너들은 어떻게 자신의 작업을 만들 수 있을까\u003c/span>\u003cspan class=\"en\">So how can designers \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">shape \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 효과적일 수 있도록?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">effective\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 디자이너들은 어떻게 자신의 작업이 더 효과적일 수 있도록 만들 수 있을까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 말한 \u003cb class=\"key\">문제점\u003c/b>을 해결하기 위해 디자이너가 취해야 할 \u003cb class=\"key\">해결책\u003c/b>을 묻는 질문입니다. 다음 문장에서 그 답을 제시하기 위한 \u003cb class=\"key\">도입부\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 동사처럼 쓰인 shape\u003c/span> : shape [타동사] + their work [목적어] + to be [to부정사/결과적 의미의 보어] : \"자신의 작업이 더 효과적일 수 있도록 만들다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"So how can designers shape their work, 그러면 디자이너들은 어떻게 자신의 작업을 만들 수 있을까. to be more effective?, 더 효과적일 수 있도록?. 이 문장 전체를 해석하면, 그러면 디자이너들은 어떻게 자신의 작업이 더 효과적일 수 있도록 만들 수 있을까?","hl":"m"},{"n":21,"text":"이 문장은 디자이너가 객관성을 잃는 문제를 어떻게 극복할 수 있을지 해결책을 묻고 있어요. 바로 다음 문장에서 그 해답을 제시하기 위해 시선을 끄는 도입부 역할을 하죠.","hl":"mn"},{"n":22,"text":"문법을 볼까요. shape their work to be more effective 부분에서, shape는 목적어 their work 뒤에 to부정사 to be를 달고 와서 마치 5형식 구조처럼 쓰였어요. 목적어가 뭐뭐 하도록 모양을 잡다, 즉 자신의 작업이 더 효과적이 되도록 만들다 라고 해석하면 자연스럽답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 가지 엄청나게 효과적인 방법은\u003c/span>\u003cspan class=\"en\">An incredibly effective way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용성 테스트를 가지고 하는 것이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">usability \u003c/span>\u003cspan class=\"tgt\">testing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">한 가지 엄청나게 효과적인 방법은 사용성 테스트를 가지고 하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이전 문장의 질문에 대한 \u003cb class=\"key\">직접적인 \u003c/b>\u003cb class=\"key\">대답\u003c/b>입니다. 이 글의 핵심 소재인 \u003cb class=\"key\">사용성 \u003c/b>\u003cb class=\"key\">테스트\u003c/b>를 처음으로 명확히 제시하는 중요한 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전명구를 동반한 be동사\u003c/span> : is [be동사] + with [전치사] + usability testing [명사/동명사] : \"사용성 테스트를 가지고 (하는 것)이다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"An incredibly effective way, 한 가지 엄청나게 효과적인 방법은. is with usability testing, 사용성 테스트를 가지고 하는 것이다.. 이 문장 전체를 해석하면, 한 가지 엄청나게 효과적인 방법은 사용성 테스트를 가지고 하는 것이다.","hl":"m"},{"n":24,"text":"방금 전 질문에 대한 직접적인 대답을 주는 문장이에요. 이 글의 진짜 주인공이자 핵심 키워드인 사용성 테스트를 처음으로 꺼내어 보여주고 있답니다.","hl":"mn"},{"n":25,"text":"is with usability testing을 살펴볼게요. be동사 바로 뒤에 with 전치사로 시작하는 전명구가 와서, 방법이 바로 사용성 테스트를 가지고 하는 것이다 라고 설명해주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 방법의 목표는 ~이다\u003c/span>\u003cspan class=\"en\">The goal of this method is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디자인상의 물제들을 밝혀 내고,\u003c/span>\u003cspan class=\"en\">to uncover problems in a design,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현재 있는 가능성들을 발견하고,\u003c/span>\u003cspan class=\"en\">discover existing opportunities,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것\u003c/span>\u003cspan class=\"en\">and learn more about the behaviors and preferences of users\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">참가자들이 실제적인 활동들에 참여하도록 요청함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">asking \u003c/span>\u003cspan class=\"tgt\">participants \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">engage \u003c/span>\u003cspan class=\"tgt\">in\u003c/span> realistic activities.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 디자인상의 물제들을 밝혀 내고, 현재 있는 가능성들을 발견하고, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사용성 테스트가 구체적으로 어떤 \u003cb class=\"key\">목적\u003c/b>을 가지고 진행되는지 세 가지로 나열하여 설명합니다. 참가자에게 실제 활동을 시켜봄으로써 사용자 중심의 \u003cb class=\"key\">객관적인 \u003c/b>\u003cb class=\"key\">데이터\u003c/b>를 얻는 과정입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">by -ing 및 ask 5형식 구조\u003c/span> : by [전치사] + asking [동명사] + participants [목적어] + to engage in [to부정사/목적격 보어] : \"참가자들이 ~에 참여하도록 요청함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">to부정사의 명사적 용법 (보어) 및 병렬 구조\u003c/span> : to uncover [to부정사 1] ~, (to) discover [동사원형 2] ~, and (to) learn [동사원형 3] : \"밝혀 내고, 발견하고, 그리고 학습하는 것\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"The goal of this method is, 이 방법의 목표는 ~이다. to uncover problems in a design, 디자인상의 물제들을 밝혀 내고. discover existing opportunities, 현재 있는 가능성들을 발견하고. and learn more about the behaviors and preferences of users, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것. by asking participants to engage in realistic activities, 참가자들이 실제적인 활동들에 참여하도록 요청함으로써. 이 문장 전체를 해석하면, 이 방법의 목표는 참가자들이 실제적인 활동들에 참여하도록 요청함으로써 디자인상의 물제들을 밝혀 내고, 현재 있는 가능성들을 발견하고, 사용자들의 행동들과 선호하는 것들에 대해 더 많이 학습하는 것이다.","hl":"m"},{"n":27,"text":"이 문장은 앞서 나온 사용성 테스트가 도대체 무엇을 위해 하는 건지 구체적인 목적을 세 가지나 나열해서 설명해주고 있어요. 진짜 사용자가 제품을 쓰는 모습을 보면서 우리가 몰랐던 객관적인 데이터를 얻겠다는 뜻이죠.","hl":"mn"},{"n":28,"text":"문법적으로 아주 중요한 문장이라 서술형 대비도 해야 해요. 첫 번째 포인트, is 뒤에 나오는 to uncover 부분부터 보면, 이건 주어를 설명해주는 to부정사 명사적 용법의 보어예요. 그리고 콤마로 연결된 discover, 그리고 and 뒤의 learn까지 총 세 개의 동사원형이 병렬 구조로 깔끔하게 연결되어 있답니다. 두 번째 포인트, 문장 끝부분의 by asking participants to engage in을 보세요. by ing는 뭐뭐 함으로써 라는 수단을 나타내죠. 게다가 이 asking의 원형인 ask는 목적어인 참가자들 뒤에 목적격 보어로 반드시 to부정사를 데리고 다니는 5형식 동사랍니다. 그래서 to engage in 형태가 쓰인 것을 꼭 기억해두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 기술은 효과적이다\u003c/span>\u003cspan class=\"en\">This technique is effective\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이해하는 데\u003c/span>\u003cspan class=\"en\">for understanding\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">얼마나 디자인이 잘 작동할 것인지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">design \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">perform\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일단 그것이 손 안에 있을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">once \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> in the hands\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제 사용자들의\u003c/span>\u003cspan class=\"en\">of real users.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 기술은 디자인이 실제 사용자들의 손 안에 있을 때 얼마나 그것이 잘 작동할 것인지를 이해하는 데 효과적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 소개한 \u003cb class=\"key\">사용성 \u003c/b>\u003cb class=\"key\">테스트\u003c/b>의 구체적인 장점을 설명하고 있습니다. 디자이너의 의도가 아니라, 실제 사용자가 제품을 사용할 때의 \u003cb class=\"key\">실제 \u003c/b>\u003cb class=\"key\">성능\u003c/b>을 파악하게 해 준다는 핵심 역할을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사(how well) + 주어(a design) + 동사(will perform) : \"얼마나 디자인이 잘 작동할 것인지를\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 once\u003c/span> : once [접속사] + 주어 + 동사 : \"일단 그것이 ~있을 때\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"This technique is effective, 이 기술은 효과적이다. for understanding, 이해하는 데. how well a design will perform, 얼마나 디자인이 잘 작동할 것인지를. once it is in the hands, 일단 그것이 손 안에 있을 때. of real users, 실제 사용자들의. 이 문장 전체를 해석하면, 이 기술은 디자인이 실제 사용자들의 손 안에 있을 때 얼마나 그것이 잘 작동할 것인지를 이해하는 데 효과적이다.","hl":"m"},{"n":30,"text":"이 문장은요, 앞에서 말한 사용성 테스트가 왜 좋은지를 구체적으로 짚어주고 있어요. 디자이너의 머릿속이 아니라, 실제 사용자가 제품을 만졌을 때의 실제 성능을 미리 파악하게 해주는 훌륭한 도구라는 점을 강조하고 있죠.","hl":"mn"},{"n":31,"text":"어법 포인트 살펴볼게요. 첫 번째로, understanding 뒤에 나오는 how well a design will perform 부분을 보세요. 간접의문문이 쓰였는데요, 의문사 how well 뒤에 주어 a design 그리고 동사 will perform 순서로 나오는 의문사 주어 동사 어순을 꼭 기억하세요. 두 번째로, once it is에서 once는 부사처럼 보일 수 있지만 여기서는 접속사로 쓰였어요. 뒤에 주어 동사가 이어져서 일단 뭐뭐 하면, 혹은 뭐뭐 할 때라는 뜻의 부사절을 이끈다는 점 챙겨두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">디자이너들은 이 방법을 사용할 수 있다\u003c/span>\u003cspan class=\"en\">Designers can use this method\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 작업물을 개선하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">improve\u003c/span> their work\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차후의 수정들을 통해\u003c/span>\u003cspan class=\"en\">through subsequent revisions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">발견한 것들에 기반한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">based \u003c/span>\u003cspan class=\"tgt\">on\u003c/span> the findings\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대표적인 사용자들로부터의\u003c/span>\u003cspan class=\"en\">from representative users.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">디자이너들은 대표적인 사용자들로부터 발견한 것들에 기반한 차후의 수정들을 통해 그들의 작업물을 개선하기 위해 이 방법을 사용할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 \u003cb class=\"key\">결론\u003c/b>부에 해당하는 문장으로, 사용성 테스트 결과를 실제 작업에 어떻게 적용해야 하는지 보여줍니다. 테스트에서 얻은 발견을 바탕으로 끊임없이 \u003cb class=\"key\">수정 \u003c/b>\u003cb class=\"key\">및 \u003c/b>\u003cb class=\"key\">개선\u003c/b>을 해나가는 것이 디자이너의 올바른 태도임을 요약하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : use + 목적어 + [to improve (to부정사구/목적)] : \"개선하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구\u003c/span> : 명사(revisions) + [based on ~ (과거분사구)] : \"~에 기반한\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"Designers can use this method, 디자이너들은 이 방법을 사용할 수 있다. to improve their work, 그들의 작업물을 개선하기 위해. through subsequent revisions, 차후의 수정들을 통해. based on the findings, 발견한 것들에 기반한. from representative users, 대표적인 사용자들로부터의. 이 문장 전체를 해석하면, 디자이너들은 대표적인 사용자들로부터 발견한 것들에 기반한 차후의 수정들을 통해 그들의 작업물을 개선하기 위해 이 방법을 사용할 수 있다.","hl":"m"},{"n":33,"text":"이 지문의 마지막 결론 문장이네요. 디자이너가 사용성 테스트를 하고 끝내는 게 아니라, 그 결과를 실제 작업에 어떻게 써먹어야 하는지 알려주고 있어요. 대표 사용자들에게서 얻은 발견을 바탕으로 지속적인 수정 및 개선을 해나가라는 핵심 메시지를 담고 있습니다.","hl":"mn"},{"n":34,"text":"핵심 어법 두 가지 짚어볼게요. 첫 번째, 투 임프루브는 디자이너들이 이 방법을 사용하는 목적을 나타내죠. 뭐뭐 하기 위해라고 해석되는 투부정사의 부사적 용법입니다. 두 번째, 베이스드 온 더 파인딩스 부분을 볼까요? 차후의 수정이라는 뜻의 명사 리비전스가 스스로 기반을 두는 게 아니라 발견된 사실에 기반하게 되는 거니까 수동의 의미를 가진 과거분사 베이스드가 쓰여서 명사를 뒤에서 꾸며주는 후치 수식 구조를 만들고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>디자이너는 자신이 제품의 \u003cb class=\"key\">사용자\u003c/b>가 아니라는 사실을 깨닫고 받아들여야 합니다.\u003c/li>\u003cli>제품을 직접 만드는 사람들은 자신의 작업물에 너무 가까워 \u003cb class=\"key\">객관성\u003c/b>을 유지하기 어렵습니다.\u003c/li>\u003cli>따라서 실제 사용자를 관찰하여 문제점을 파악하는 \u003cb class=\"key\">사용성 \u003c/b>\u003cb class=\"key\">테스트\u003c/b>가 매우 효과적인 방법으로 제시됩니다.\u003c/li>\u003cli>이 방법을 통해 발견된 문제점들을 바탕으로 차후의 \u003cb class=\"key\">수정\u003c/b>을 거치면 제품을 크게 개선할 수 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Designers should use usability testing with real users to objectively evaluate and improve their products.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">디자이너는 자신이 사용자가 아님을 인정하고 객관성을 확보하기 위해 실제 \u003cb class=\"key\">사용성 \u003c/b>\u003cb class=\"key\">테스트\u003c/b>를 활용하여 제품을 개선해야 합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":35,"text":"오늘 지문은 디자이너가 빠지기 쉬운 주관성의 함정과 이를 극복하기 위한 사용성 테스트의 중요성을 아주 논리적으로 설명한 글이었어요. 여러분도 글을 읽을 때 필자가 제기하는 문제점이 무엇인지, 그리고 그 해결책이 어디서 등장하는지 꼭 확인하는 습관을 길러보세요. 복습 철저히 하시고, 우리는 다음 강의에서 뵙겠습니다! 수고하셨습니다.","hl":null}]}]});</script></body></html>
