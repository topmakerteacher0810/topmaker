<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 32번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 32번","audioDir":"32_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">32번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>The Negative Impact of Mass Culture on Traditional Judicial Institutions\u003c/h1>\u003ch2>대중문화가 전통적 사법 기관에 미치는 부정적 영향\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>소셜 네트워크와 같은 \u003cb class=\"key\">대중문화\u003c/b>가 법정과 같은 전통적 매개 제도의 역할을 축소시키고, 대중의 압박을 가하여 정상적인 \u003cb class=\"key\">사법 \u003c/b>\u003cb class=\"key\">작용\u003c/b>을 방해하는 것은 해로우며, 재판은 대중의 압박에 영향을 받지 않아야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Mass culture, particularly social networks, should not interfere with the judicial system, which must remain independent of popular pressure.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘 우리가 함께 분석할 지문은 대중문화, 특히 소셜 네트워크가 전통적인 사법 기관에 미치는 부정적인 영향을 다룬 글입니다. 이 글의 요약은 소셜 네트워크와 같은 대중문화가 법정과 같은 전통적 매개 제도의 역할을 축소시키고, 대중의 압박을 가하여 정상적인 사법 작용을 방해하는 것은 해로우며, 재판은 대중의 압박에 영향을 받지 않아야 한다는 것입니다. 요지는 영어로 Mass culture, particularly social networks, should not interfere with the judicial system, which must remain independent of popular pressure라고 할 수 있죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">현대 사회에서 소셜 네트워크(Social Networks)는 여론을 형성하는 강력한 \u003cb class=\"key\">대중문화\u003c/b>(Mass Culture)의 도구가 되었습니다. 하지만 이러한 대중의 목소리가 법의 판결에 개입하려 할 때 문제가 발생합니다. 법정(Court)은 사회의 질서를 유지하는 \u003cb class=\"key\">매개 \u003c/b>\u003cb class=\"key\">제도\u003c/b>(Intermediary Institution)로서 객관성과 독립성이 필수적이기 때문입니다. 이는 마치 축구 경기에서 관중들의 함성이 크다고 해서 \u003cb class=\"key\">심판\u003c/b>(Referee)이 규칙을 무시하고 판정을 번복해서는 안 되는 것과 같습니다. 민주적인 법치 국가에서는 사법적 결정이 \u003cb class=\"key\">대중의 \u003c/b>\u003cb class=\"key\">압박\u003c/b>(Popular Pressure)에 흔들리지 않고 오직 법정에 의해서만 독립적으로 이루어져야 합니다.\u003c/div>","segs":[{"n":2,"text":"배경지식을 잠깐 살펴볼까요? 현대 사회에서 소셜 네트워크는 여론을 형성하는 강력한 대중문화의 도구가 되었습니다. 하지만 이러한 대중의 목소리가 법의 판결에 개입하려 할 때 문제가 발생하죠. 법정은 사회의 질서를 유지하는 매개 제도로서 객관성과 독립성이 필수적이기 때문입니다. 이는 마치 축구 경기에서 관중들의 함성이 크다고 해서 심판이 규칙을 무시하고 판정을 번복해서는 안 되는 것과 같습니다. 민주적인 법치 국가에서는 사법적 결정이 대중의 압박에 흔들리지 않고 오직 법정에 의해서만 독립적으로 이루어져야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>대중문화의 영향\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>대중문화는 전통적 유대감을 약화시키고, 가족이나 학교 같은 사회의 \u003cb class=\"key\">매개 \u003c/b>\u003cb class=\"key\">제도\u003c/b>를 약화시켜 그 역할을 축소시킵니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>법정의 중요성\u003csmall>예시 · 문장 2\u003c/small>\u003c/h4>\u003cp>그 예로, 법정은 집단 생활의 정상적인 기능을 위해 매우 중요한 전통적 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">기관\u003c/b>임을 언급합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>소셜 네트워크의 개입\u003csmall>문제 제기 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>사람들이 소셜 네트워크를 통해 사법적 결정에 \u003cb class=\"key\">압박\u003c/b>을 가하는 관행은 대중화된 문화의 형태가 되어 매우 \u003cb class=\"key\">해로운\u003c/b> 결과를 낳는다고 비판합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사법부의 독립성\u003csmall>결론 및 주장 · 문장 5\u003c/small>\u003c/h4>\u003cp>따라서 민주적 법치 국가에서 정의 실현은 소셜 네트워크 같은 대중 광장이 아니라, 대중의 압박에 \u003cb class=\"key\">면역력\u003c/b>을 가진 독립된 \u003cb class=\"key\">법정\u003c/b>에서 이루어져야 한다고 결론을 내립니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 크게 네 단계로 나뉘어 대중문화의 문제점부터 법정의 독립성이라는 결론까지 자연스럽게 흘러갑니다.","hl":null},{"n":4,"text":"첫 번째 단계인 도입부에서는 대중문화의 영향을 설명합니다. 첫 번째 문장에서 대중문화는 전통적 유대감을 약화시키고, 가족이나 학교 같은 사회의 매개 제도를 축소시킨다고 말하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 예시입니다. 두 번째 문장을 보면, 그 예로 법정은 집단 생활의 정상적인 기능을 위해 매우 중요한 전통적 사회 기관이라고 언급합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 본격적으로 문제를 제기합니다. 세 번째와 네 번째 문장에 걸쳐 나오는데요, 사람들이 소셜 네트워크를 통해 사법적 결정에 압박을 가하는 것은 대중화된 문화의 형태가 되어 매우 해로운 결과를 낳는다고 비판합니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 결론 및 주장입니다. 다섯 번째 문장에서 민주적 법치 국가의 정의 실현은 소셜 네트워크 같은 대중 광장이 아니라, 대중의 압박에 면역력을 가진 독립된 법정에서 이루어져야 한다고 결론짓습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 대중문화가 전통적 제도를 약화시킨다는 일반적 사실을 도입한 후, 법정이라는 구체적 사례를 들어 소셜 네트워크의 사법적 개입이 가진 \u003cb class=\"key\">문제점\u003c/b>을 지적하고 있습니다. 이후 마지막 문장에서 사법적 결정은 대중의 압박에 영향을 받지 않는 \u003cb class=\"key\">법정\u003c/b>에서 이루어져야 한다는 명확한 \u003cb class=\"key\">해결책이자 \u003c/b>\u003cb class=\"key\">주장\u003c/b>을 제시하는 \u003cb class=\"key\">미괄식\u003c/b> 구조를 취하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (2)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>However (3)\u003c/b>\u003cspan>문제점 제시 및 흐름 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the intermediary institutions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">traditional social institutions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">courts\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>법정 (Courts)\u003c/th>\u003cth>소셜 네트워크 (Social Networks)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>전통적 사회 기관\u003c/td>\u003ctd>대중 광장 (가상의 차원)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>조화로운 집단 생활을 위해 기능\u003c/td>\u003ctd>정치화된 과정에서 압박을 가함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대중의 압박에 영향을 받지 않음 (독립성)\u003c/td>\u003ctd>대중화되고 습관적인 형태 (해로움)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 전형적인 문제와 해결 구조입니다. 소셜 네트워크의 압박이라는 문제점을 지적한 뒤, 법정의 독립성 유지라는 해결책을 제시하죠. 특히 마지막 문장에 사법적 결정은 대중의 압박에 영향을 받지 않는 법정에서 이루어져야 한다는 명확한 해결책이자 주장이 담겨 있기 때문에 미괄식 구조로 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"글의 구조를 파악하기 좋은 신호어들을 볼까요? 두 번째 문장의 For example로 예시가 시작됨을 알리고, 세 번째 문장의 However를 통해 분위기가 전환되며 문제점이 제시됩니다. 이 글에서는 법정과 대중문화가 뚜렷하게 대조되고 있는데요. 매개 기관, 전통적 사회 기관, 법정으로 이어지는 긍정적 개념들과 대중문화, 소셜 네트워크, 대중 광장, 대중의 압박으로 이어지는 부정적 개념들이 선명하게 나뉘어 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>mass\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대중의, 대규모의\u003c/span>\u003c/div>\u003cdiv>\u003cb>factor\u003c/b>\u003cem>명사\u003c/em>\u003cspan>요인\u003c/span>\u003c/div>\u003cdiv>\u003cb>tie\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유대, 끈\u003c/span>\u003c/div>\u003cdiv>\u003cb>unite\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결속시키다, 통합하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>intermediary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매개하는, 중간의\u003c/span>\u003c/div>\u003cdiv>\u003cb>institution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제도, 기관\u003c/span>\u003c/div>\u003cdiv>\u003cb>diminish\u003c/b>\u003cem>동사\u003c/em>\u003cspan>축소시키다, 줄어들다\u003c/span>\u003c/div>\u003cdiv>\u003cb>overlap\u003c/b>\u003cem>동사\u003c/em>\u003cspan>중첩되다, 겹치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>court\u003c/b>\u003cem>명사\u003c/em>\u003cspan>법정\u003c/span>\u003c/div>\u003cdiv>\u003cb>harmonious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>조화로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>functioning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기능, 작용\u003c/span>\u003c/div>\u003cdiv>\u003cb>collective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>집단의, 공동의\u003c/span>\u003c/div>\u003cdiv>\u003cb>turn to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 의존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>put pressure on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 압박을 가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>judicial\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사법의, 재판의\u003c/span>\u003c/div>\u003cdiv>\u003cb>mediated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>조정되는, 매개된\u003c/span>\u003c/div>\u003cdiv>\u003cb>politicize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>정치화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>popularize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대중화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>habitual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>습관적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>harmful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>해로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>justice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정의, 재판\u003c/span>\u003c/div>\u003cdiv>\u003cb>public square\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대중 광장\u003c/span>\u003c/div>\u003cdiv>\u003cb>convert\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전환하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>virtual dimension\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가상의 차원\u003c/span>\u003c/div>\u003cdiv>\u003cb>democratic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>민주적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>appropriate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>적절한\u003c/span>\u003c/div>\u003cdiv>\u003cb>immune to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 영향을 받지 않는, ~에 면역이 된\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문에 등장한 중요한 핵심 단어 몇 가지를 짚어보겠습니다. intermediary는 매개하는 혹은 중간의 라는 뜻이고, institution은 제도나 기관을 의미합니다. diminish는 축소시키다, judicial은 사법의 라는 뜻이니 꼭 기억해 두세요. 마지막 문장의 immune to는 어디어디에 면역이 된, 즉 영향을 받지 않는 이라는 뜻으로 아주 중요합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">weaken\u003c/b>\u003cspan class=\"m\">약화시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">undermine\u003c/span>\u003cspan class=\"s\">impair\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">strengthen\u003c/span>\u003cspan class=\"a\">reinforce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">diminish\u003c/b>\u003cspan class=\"m\">축소시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reduce\u003c/span>\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">expand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">traditional\u003c/b>\u003cspan class=\"m\">전통적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conventional\u003c/span>\u003cspan class=\"s\">customary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">modern\u003c/span>\u003cspan class=\"a\">unconventional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">harmful\u003c/b>\u003cspan class=\"m\">해로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">detrimental\u003c/span>\u003cspan class=\"s\">damaging\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">beneficial\u003c/span>\u003cspan class=\"a\">harmless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">appropriate\u003c/b>\u003cspan class=\"m\">적절한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">suitable\u003c/span>\u003cspan class=\"s\">proper\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inappropriate\u003c/span>\u003cspan class=\"a\">unsuitable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">immune\u003c/b>\u003cspan class=\"m\">영향을 받지 않는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">resistant\u003c/span>\u003cspan class=\"s\">unaffected\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">susceptible\u003c/span>\u003cspan class=\"a\">vulnerable\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 알아볼까요? weaken, 약화시키다의 동의어로는 undermine, impair가 있고, 반의어는 strengthen, reinforce가 있습니다. diminish, 축소시키다의 동의어는 reduce, decrease이고 반의어는 increase, expand입니다. harmful, 해로운의 동의어 detrimental, damaging과 반의어 beneficial도 자주 출제되니 챙겨두세요. 마지막으로 immune, 영향을 받지 않는의 동의어 resistant와 반의어 vulnerable도 꼭 외워두시기 바랍니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 우리가 대중문화를 이해한다면\u003c/span>\u003cspan class=\"en\">If we understand mass culture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문화적 유대감을 약화시키는 요인으로\u003c/span>\u003cspan class=\"en\">as a weakening factor of the cultural ties\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 전통들에 사람들을 결속시키는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">unite \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">traditions,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대중문화는 약화시킨다\u003c/span>\u003cspan class=\"en\">mass culture weakens\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회 내의 매개하는 제도들을\u003c/span>\u003cspan class=\"en\">the intermediary institutions in society\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(예를 들어 가족 또는 학교와 같은),\u003c/span>\u003cspan class=\"en\">(e.g. the family or the school),\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들의 역할을 축소시키고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">diminishing \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">role \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 제도들과 중첩된다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">overlapping \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">institutions.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 우리가 대중문화를 자신들의 전통들에 사람들을 결속시키는 문화적 유대감을 약화시키는 요인으로 이해한다면, 대중문화는 예를 들어 가족 또는 학교와 같은 사회 내의 매개하는 제도들을 약화시켜, 그것들의 역할을 축소시키고 이 제도들과 중첩된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">대중문화\u003c/b>가 사람과 전통을 이어주는 문화를 파괴한다고 볼 때 가족이나 학교 같은 \u003cb class=\"key\">매개 \u003c/b>\u003cb class=\"key\">제도\u003c/b>마저 약화시킨다는 글의 핵심 전제를 깔아줍니다. 대중문화의 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">기능\u003c/b>을 명확히 정의하며 글을 시작하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 명사(선행사) + [that (주격 관계대명사) + 동사 + 목적어] : \"자신들의 전통들에 사람들을 결속시키는,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (동시/연속 동작)\u003c/span> : 콤마(,) + [v-ing (현재분사) ~] and [v-ing (현재분사) ~] : \"그것들의 역할을 축소시키고 이 제도들과 중첩된다.\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"If we understand mass culture, 만약 우리가 대중문화를 이해한다면. as a weakening factor of the cultural ties, 문화적 유대감을 약화시키는 요인으로. that unite people to their traditions, 자신들의 전통들에 사람들을 결속시키는. mass culture weakens, 대중문화는 약화시킨다. the intermediary institutions in society, 사회 내의 매개하는 제도들을. (e.g. the family or the school), (예를 들어 가족 또는 학교와 같은). diminishing their role, 그것들의 역할을 축소시키고. and overlapping these institutions, 이 제도들과 중첩된다.. 이 문장 전체를 해석하면, 만약 우리가 대중문화를 자신들의 전통들에 사람들을 결속시키는 문화적 유대감을 약화시키는 요인으로 이해한다면, 대중문화는 예를 들어 가족 또는 학교와 같은 사회 내의 매개하는 제도들을 약화시켜, 그것들의 역할을 축소시키고 이 제도들과 중첩된다.","hl":"m"},{"n":13,"text":"이 문장은 대중문화가 사람과 전통을 이어주는 문화를 파괴한다고 볼 때 가족이나 학교 같은 매개 제도마저 약화시킨다는 글의 핵심 전제를 깔아줍니다. 대중문화의 부정적 기능을 명확히 정의하며 글을 시작하고 있어요.","hl":"mn"},{"n":14,"text":"어법 포인트 짚어볼게요. 첫 번째로 that unite 부분입니다. 여기서 that은 선행사인 the cultural ties를 수식하는 주격 관계대명사절을 이끌고 있어요. 선행사가 복수명사이기 때문에 뒤따르는 동사도 복수형인 unite가 쓰였다는 점 꼭 기억해 두세요. 두 번째 포인트는 맨 뒤에 나오는 diminishing과 overlapping입니다. 문장 주어인 mass culture가 직접 수행하는 능동의 동작을 나타내기 때문에 현재분사 형태를 썼고요. 이 두 개의 현재분사가 접속사 and로 예쁘게 연결된 병렬 구조랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">법정은 전통적인 사회기관이며\u003c/span>\u003cspan class=\"en\">courts \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">traditional \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">institutions \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중요하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">important\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정상적이고 조화로운 기능을 위해\u003c/span>\u003cspan class=\"en\">for the normal and harmonious functioning\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집단 생활의.\u003c/span>\u003cspan class=\"en\">of collective life.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 법정은 전통적인 사회기관이며 집단 생활의 정상적이고 조화로운 기능을 위해 중요하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 매개 제도의 구체적인 예시로 \u003cb class=\"key\">법정\u003c/b>을 제시하고 있습니다. 법정이 사회의 조화와 집단생활을 유지하는 데 \u003cb class=\"key\">필수적인 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 한다는 점을 강조하여 이후 대중문화가 이를 어떻게 위협하는지 대조하기 위한 \u003cb class=\"key\">배경지식\u003c/b>을 제공합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">보어의 병렬 구조\u003c/span> : 주어 + be동사 + [명사구 (주격보어 1)] and [형용사 (주격보어 2)] : \"전통적인 사회기관이며 중요하다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"For example, 예를 들어. courts are traditional social institutions, 법정은 전통적인 사회기관이며. and important, 중요하다. for the normal and harmonious functioning, 정상적이고 조화로운 기능을 위해. of collective life, 집단 생활의.. 이 문장 전체를 해석하면, 예를 들어, 법정은 전통적인 사회기관이며 집단 생활의 정상적이고 조화로운 기능을 위해 중요하다.","hl":"m"},{"n":16,"text":"이 문장은 앞서 언급한 매개 제도의 구체적인 예시로 법정을 제시하고 있습니다. 법정이 사회의 조화와 집단생활을 유지하는 데 필수적인 역할을 한다는 점을 강조하고 있죠. 이후에 대중문화가 이를 어떻게 위협하는지 대조해서 보여주기 위한 배경지식을 제공하는 역할을 합니다.","hl":"mn"},{"n":17,"text":"문법 살펴볼까요. 여기서는 병렬 구조 하나만 잘 보시면 됩니다. be동사인 are 뒤에 주격 보어가 두 개 연결되어 있어요. 하나는 명사구인 traditional social institutions이고 다른 하나는 형용사인 important입니다. 이렇게 명사와 형용사가 접속사 and를 통해 주격 보어 자리에서 대등하게 연결될 수 있다는 점을 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만,\u003c/span>\u003cspan class=\"en\">However,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 소셜 네트워크에 의존할 때\u003c/span>\u003cspan class=\"en\">when people turn to social networks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사법적 결정에 압박을 가하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">put \u003c/span>\u003cspan class=\"tgt\">pressure \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">judicial \u003c/span>\u003cspan class=\"tgt\">decisions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조정되고 정치화되는 어떤 과정에 있는,\u003c/span>\u003cspan class=\"en\">in certain mediated and politicized processes,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 관행은 대중화되고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">practice \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">popularized \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">습관적인 문화의 형태가 되며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">becomes\u003c/span> a habitual form of culture\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 해롭다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">harmful.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만, 조정되고 정치화되는 어떤 과정에 있는 사법적 결정에 압박을 가하기 위해 사람들이 소셜 네트워크에 의존할 때, 이러한 관행은 대중화되고 습관적인 문화의 형태가 되며, 이는 해롭다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대중문화의 일환인 소셜 네트워크가 법정의 판결에 부당한 압력을 가하는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 지적합니다. 전통적 제도를 훼손하는 이러한 대중의 개입이 \u003cb class=\"key\">습관적 \u003c/b>\u003cb class=\"key\">문화\u003c/b>로 굳어지는 것이 얼마나 \u003cb class=\"key\">해로운 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 낳는지 강하게 비판하고 있어요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : [to + 동사원형] + 목적어 + 전치사구 : \"사법적 결정에 압박을 가하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조 (수동태와 능동태)\u003c/span> : 주어 + [수동태 동사] and [능동태 동사] : \"이러한 관행은 대중화되고 ~가 되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : 콤마(,) + [which (주격 관계대명사) + 동사 + 보어] : \"이는 해롭다.\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"However, 하지만. when people turn to social networks, 사람들이 소셜 네트워크에 의존할 때. to put pressure on judicial decisions, 사법적 결정에 압박을 가하기 위해. in certain mediated and politicized processes, 조정되고 정치화되는 어떤 과정에 있는. this practice is popularized, 이러한 관행은 대중화되고. and becomes a habitual form of culture, 습관적인 문화의 형태가 되며. which is harmful, 이는 해롭다.. 이 문장 전체를 해석하면, 하지만, 조정되고 정치화되는 어떤 과정에 있는 사법적 결정에 압박을 가하기 위해 사람들이 소셜 네트워크에 의존할 때, 이러한 관행은 대중화되고 습관적인 문화의 형태가 되며, 이는 해롭다.","hl":"m"},{"n":19,"text":"이 문장은 대중문화의 일환인 소셜 네트워크가 법정의 판결에 부당한 압력을 가하는 구체적인 문제 상황을 꼬집고 있습니다. 전통적 제도를 훼손하는 이러한 대중의 개입이 습관적 문화로 굳어지는 것이 얼마나 해로운 결과를 낳는지 아주 강하게 비판하고 있는 거죠.","hl":"mn"},{"n":20,"text":"자 이 문장은 서술형으로도 나오기 좋은 아주 중요한 문장입니다. 어법 세 가지 정리해 볼게요. 첫 번째는 to put 부분입니다. 사람들이 소셜 네트워크에 왜 의존하는지 그 목적을 설명해주는 to부정사의 부사적 용법이에요. 무엇무엇 하기 위해라고 해석하시면 깔끔합니다. 두 번째는 동사 병렬 구조인데요. 주어인 this practice 뒤에 동사가 두 개 왔어요. 관행이 대중화되는 거니까 앞에는 수동태로 is popularized를 썼고 뒤에는 관행이 무언가가 된다는 능동적 변화니까 능동태인 becomes를 썼습니다. 태는 다르지만 주어에 맞게 잘 병렬된 거예요. 세 번째는 맨 끝에 콤마 뒤에 나온 which입니다. 계속적 용법으로 쓰였는데 여기서 선행사가 바로 앞의 문화가 아니라 앞 문장의 내용 전체라는 점이 아주 중요해요. 문장 전체를 선행사로 받기 때문에 단수 취급해서 동사 is가 왔다는 것 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재판은 집행되어서는 안 되며\u003c/span>\u003cspan class=\"en\">Justice \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">done\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대중 광장에서\u003c/span>\u003cspan class=\"en\">in the public square\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 오늘날 전환된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">which\u003c/span> today is converted\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가상의 차원,\u003c/span>\u003cspan class=\"en\">into \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">virtual \u003c/span>\u003cspan class=\"tgt\">dimension, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 소셜 네트워크로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">networks\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">재판은 대중 광장에서 집행되어서는 안 되며, 그것은 오늘날 가상의 차원, 즉 소셜 네트워크로 전환된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 재판이 여론에 휘둘리는 \u003cb class=\"key\">대중 \u003c/b>\u003cb class=\"key\">광장\u003c/b>에서 이루어져서는 안 된다는 점을 강조합니다. 여기서 대중 광장은 오늘날의 \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">네트워크\u003c/b>를 비유적으로 표현한 것입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 수동태\u003c/span> : must not [조동사 부정] + be done [be p.p. 수동태] : \"집행되어서는 안 된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : , [콤마] + which [주격 관계대명사] : \"그리고 그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격의 콤마\u003c/span> : 명사구 + , [동격의 콤마] + 명사구 : \"가상의 차원, 즉 소셜 네트워크\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Justice must not be done, 재판은 집행되어서는 안 되며. in the public square, 대중 광장에서. which today is converted, 그것은 오늘날 전환된다. into a virtual dimension, 가상의 차원. the social networks, 즉 소셜 네트워크로. 이 문장 전체를 해석하면, 재판은 대중 광장에서 집행되어서는 안 되며, 그것은 오늘날 가상의 차원, 즉 소셜 네트워크로 전환된다.","hl":"m"},{"n":22,"text":"이 문장은 재판이 여론에 휘둘리는 대중 광장에서 이루어져서는 안 된다는 점을 강조하고 있어요. 여기서 대중 광장은 오늘날의 소셜 네트워크를 비유적으로 표현한 거랍니다.","hl":"mn"},{"n":23,"text":"첫 번째로 must not be done을 볼게요. 재판은 스스로 하는 게 아니라 집행되는 거니까 조동사 뒤에 수동태 비 피피가 쓰였어요. 두 번째로 콤마 위치입니다. 콤마 뒤에 계속적 용법의 관계대명사 위치가 쓰여서 선행사인 더 퍼블릭 스퀘어에 대해 추가적인 설명을 해주고 있죠. 접속사 댓으로 바꿀 수 없다는 점 꼭 기억하세요. 세 번째로 어 버추얼 디멘션 뒤에 콤마가 있고 더 소셜 네트웍스가 나오는데, 이건 이 둘이 같다는 걸 나타내는 동격의 콤마랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">민주적인 법치 국가에서,\u003c/span>\u003cspan class=\"en\">In a democratic state of law,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적절한 장소는\u003c/span>\u003cspan class=\"en\">the appropriate place\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재판하고 정의를 실현하기에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">judge \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">justice\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">법정이며\u003c/span>\u003cspan class=\"en\">is the court\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방식이어야 한다\u003c/span>\u003cspan class=\"en\">and in a way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영향을 받지 않는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">immune\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대중의 압박에\u003c/span>\u003cspan class=\"en\">to popular pressure.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">민주적인 법치 국가에서, 재판하고 정의를 실현하기에 적절한 장소는 법정이며 대중의 압박에 영향을 받지 않는 방식이어야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 요지를 담은 결론 문장으로, 민주주의 사회에서 재판은 소셜 네트워크가 아닌 \u003cb class=\"key\">법정\u003c/b>에서 이루어져야 함을 강조합니다. 재판은 여론이라는 \u003cb class=\"key\">대중의 \u003c/b>\u003cb class=\"key\">압박\u003c/b>으로부터 철저히 독립되어야 한다는 핵심 주장을 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사 + to judge [to부정사] and make [동사원형] : \"재판하고 정의를 실현하기에 (적절한)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a way [선행사] + that [주격 관계대명사] + is [동사] : \"영향을 받지 않는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In a democratic state of law, 민주적인 법치 국가에서. the appropriate place, 적절한 장소는. to judge and make justice, 재판하고 정의를 실현하기에. is the court, 법정이며. and in a way, 방식이어야 한다. that is immune, 영향을 받지 않는. to popular pressure, 대중의 압박에. 이 문장 전체를 해석하면, 민주적인 법치 국가에서, 재판하고 정의를 실현하기에 적절한 장소는 법정이며 대중의 압박에 영향을 받지 않는 방식이어야 한다.","hl":"m"},{"n":25,"text":"글의 결론을 내리는 아주 중요한 요지 문장이네요. 민주주의 사회에서 재판은 소셜 네트워크가 아닌 오직 법정에서 이루어져야 함을 강조하고 있어요. 특히 재판은 여론이라는 대중의 압박으로부터 철저히 독립되어야 한다는 핵심 주장을 담고 있습니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 to judge and make justice입니다. 앞에 있는 명사 the appropriate place를 꾸며주는 to부정사의 형용사적 용법이에요. judge와 make가 and로 병렬 구조를 이루고 있죠. 두 번째 포인트는 that is immune입니다. 여기서 that은 a way를 선행사로 받는 주격 관계대명사예요. 덧붙여서 immune to는 무엇무엇에 영향을 받지 않는다는 뜻의 중요한 표현이니까 전치사 to와 함께 꼭 외워두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">대중문화\u003c/b>는 전통적 유대감을 약화시키고 사회 내의 매개 제도를 축소시킵니다.\u003c/li>\u003cli>법정은 조화로운 집단 생활을 위해 필수적인 전통적 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">기관\u003c/b>입니다.\u003c/li>\u003cli>소셜 네트워크를 통해 사법적 결정에 \u003cb class=\"key\">압박\u003c/b>을 가하는 것은 해로운 문화입니다.\u003c/li>\u003cli>재판은 대중 광장이 아닌, 대중의 압박에 \u003cb class=\"key\">영향을 \u003c/b>\u003cb class=\"key\">받지 \u003c/b>\u003cb class=\"key\">않는\u003c/b> 법정에서 독립적으로 이루어져야 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Mass culture, particularly social networks, should not interfere with the judicial system, which must remain independent of popular pressure.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">소셜 네트워크와 같은 \u003cb class=\"key\">대중문화\u003c/b>가 법정과 같은 전통적 매개 제도의 역할을 축소시키고, 대중의 압박을 가하여 정상적인 \u003cb class=\"key\">사법 \u003c/b>\u003cb class=\"key\">작용\u003c/b>을 방해하는 것은 해로우며, 재판은 대중의 압박에 영향을 받지 않아야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"자, 이렇게 해서 대중문화와 소셜 네트워크가 사법 시스템에 미치는 부정적 영향을 다룬 지문을 모두 분석해 보았습니다. 대중의 압박 속에서도 법정의 독립성이 유지되어야 한다는 필자의 주장을 꼭 기억해 주세요. 오늘 배운 단어와 구조를 다시 한번 복습하시기 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
