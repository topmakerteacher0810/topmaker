<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 18번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 18번","audioDir":"18_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">18번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>Proposals for Enhancing School Security and Privacy\u003c/h1>\u003ch2>학교 보안 및 사생활 보호 강화 제안\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>최근 인근 학교들의 안전 사건을 계기로, 학생회장이 교장 선생님께 \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">심기\u003c/b>와 \u003cb class=\"key\">CCTV \u003c/b>\u003cb class=\"key\">및 \u003c/b>\u003cb class=\"key\">경비원 \u003c/b>\u003cb class=\"key\">추가\u003c/b>를 통한 학교 보안 및 사생활 보호 강화를 제안하는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The student head proposes planting trees and adding CCTV cameras and security guards to improve students' privacy and safety.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 우리는 학교의 안전과 사생활 보호를 주제로 한 편지글을 함께 살펴보겠습니다. 이 글은 최근 발생한 인근 학교의 사건들을 계기로, 학생회장이 교장 선생님께 안전 강화 방안을 제안하는 내용이에요. 요점은 나무 심기와 CCTV, 경비원 배치를 통해 보안을 강화해 달라는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">최근 학교 안전(School Safety)은 매우 중요한 이슈로 떠오르고 있습니다. 외부인의 \u003cb class=\"key\">무단출입\u003c/b>(unauthorized access)으로 인한 불미스러운 사건들이 종종 발생하기 때문입니다. 이를 막기 위해 물리적인 \u003cb class=\"key\">보안 \u003c/b>\u003cb class=\"key\">조치\u003c/b>(security measures)가 필수적입니다. 마치 우리 집을 안전하게 지키기 위해 담장을 높이고 현관에 도어락을 설치하는 것과 같습니다. 본문에서 제안하는 나무 심기는 자연스러운 \u003cb class=\"key\">사생활 \u003c/b>\u003cb class=\"key\">보호\u003c/b>(privacy protection) 장벽 역할을 하며, CCTV와 경비원은 즉각적인 \u003cb class=\"key\">위협 \u003c/b>\u003cb class=\"key\">감지\u003c/b>(threat detection) 기능을 합니다.\u003c/div>","segs":[{"n":2,"text":"최근 학교 안전은 매우 중요한 이슈로 떠오르고 있습니다. 외부인의 무단출입으로 인한 불미스러운 사건들이 종종 발생하기 때문이죠. 이를 막기 위해 물리적인 보안 조치가 필수적입니다. 마치 우리 집을 안전하게 지키기 위해 담장을 높이고 현관에 도어락을 설치하는 것과 같아요. 본문에서 제안하는 나무 심기는 자연스러운 사생활 보호 장벽 역할을 하며, CCTV와 경비원은 즉각적인 위협 감지 기능을 한답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입 및 목적\u003csmall>문제 제기 및 도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>최근 인근 학교에서 발생한 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">사건\u003c/b>들로 인한 학생들의 우려를 전달하며 글을 시작합니다. 이에 대한 해결책으로 학생들의 \u003cb class=\"key\">사생활\u003c/b>과 안전을 강화하기 위한 구체적인 조치를 제안합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>제안 1\u003csmall>해결책 1 제시 · 문장 3\u003c/small>\u003c/h4>\u003cp>첫 번째 구체적인 제안으로 학교 주변에 \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">심기\u003c/b>를 언급합니다. 이는 외부인의 시선을 차단하여 학생들의 사생활을 보호하고 \u003cb class=\"key\">외부 \u003c/b>\u003cb class=\"key\">위험\u003c/b>으로부터의 노출을 줄여주는 역할을 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>제안 2\u003csmall>해결책 2 제시 · 문장 4\u003c/small>\u003c/h4>\u003cp>두 번째 제안으로 출입구 근처에 \u003cb class=\"key\">CCTV \u003c/b>\u003cb class=\"key\">카메라\u003c/b>와 \u003cb class=\"key\">경비원\u003c/b>을 추가할 것을 요청합니다. 이를 통해 무단출입을 감지하고 발생할 수 있는 사건에 \u003cb class=\"key\">신속하게 \u003c/b>\u003cb class=\"key\">대응\u003c/b>할 수 있다고 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론 및 마무리\u003csmall>결론 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>학생들을 대표하여 교장 선생님께서 이러한 \u003cb class=\"key\">제안\u003c/b>들을 긍정적으로 \u003cb class=\"key\">고려\u003c/b>해 주기를 당부하며 정중하게 편지를 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글이 어떤 순서로 쓰여 있는지 크게 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장입니다. 최근 인근 학교에서 발생한 안전 사건들로 인한 학생들의 우려를 전달하며 글을 시작해요. 이에 대한 해결책으로 학생들의 사생활과 안전을 강화하기 위한 구체적인 조치를 제안하고 있습니다.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 첫 번째 제안을 구체적으로 설명합니다. 학교 주변에 나무 심기를 통해서 외부인의 시선을 차단하자는 건데요. 이를 통해 학생들의 사생활을 보호하고 외부 위험으로부터의 노출을 줄일 수 있다고 강조합니다.","hl":"f1"},{"n":6,"text":"네 번째 문장은 두 번째 제안입니다. 출입구 근처에 CCTV 카메라와 경비원을 추가하자는 것이죠. 이렇게 하면 무단출입을 감지하고 발생할 수 있는 사건에 신속하게 대응할 수 있다는 장점을 설명합니다.","hl":"f2"},{"n":7,"text":"다섯 번째부터 일곱 번째 문장은 마무리 부분입니다. 학생들을 대표하여 교장 선생님께서 이러한 제안들을 긍정적으로 고려해 주기를 당부하며 아주 정중하게 편지를 끝맺고 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 서두에 인근 학교의 보안 문제라는 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 제시하고 있습니다. 곧바로 두 번째 문장에서 이를 해결하기 위한 \u003cb class=\"key\">방안 \u003c/b>\u003cb class=\"key\">제안\u003c/b>이라는 글의 목적을 분명히 밝히는 두괄식 구조입니다. 이후 구체적인 \u003cb class=\"key\">해결책\u003c/b> 두 가지를 병렬적으로 나열하며 주장을 뒷받침합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>propose (2)\u003c/b>\u003cspan>주장 및 목적 제시\u003c/span>\u003cb>First (3)\u003c/b>\u003cspan>첫 번째 해결책 제시\u003c/span>\u003cb>Additionally (4)\u003c/b>\u003cspan>두 번째 해결책 추가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">measures to increase students' privacy and safety\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">planting trees\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more CCTV cameras and security guards\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">these suggestions\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제와 해결 구조를 띠고 있습니다. 서두에 인근 학교의 보안 문제라는 문제 상황을 제시한 뒤, 바로 두 번째 문장에서 이를 해결하기 위한 방안 제안이라는 글의 목적을 분명히 밝히는 두괄식 구조예요. 이후 구체적인 해결책 두 가지를 나열하며 주장을 뒷받침하고 있죠.","hl":"ty"},{"n":9,"text":"글의 흐름을 알려주는 신호어를 볼까요? 두 번째 문장의 propose라는 단어를 통해 제안의 목적을 명확히 드러냅니다. 이어서 세 번째 문장의 First와 네 번째 문장의 Additionally를 통해 두 가지 구체적인 해결책을 차례대로, 그리고 추가적으로 제시하며 논리를 전개하고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>principal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교장\u003c/span>\u003c/div>\u003cdiv>\u003cb>head student\u003c/b>\u003cem>명사\u003c/em>\u003cspan>학생회장\u003c/span>\u003c/div>\u003cdiv>\u003cb>express\u003c/b>\u003cem>동사\u003c/em>\u003cspan>표현하다, 나타내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>concern\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우려, 걱정\u003c/span>\u003c/div>\u003cdiv>\u003cb>recent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최근의\u003c/span>\u003c/div>\u003cdiv>\u003cb>security\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안전, 보안\u003c/span>\u003c/div>\u003cdiv>\u003cb>incident\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사건\u003c/span>\u003c/div>\u003cdiv>\u003cb>nearby\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인근의, 가까운\u003c/span>\u003c/div>\u003cdiv>\u003cb>propose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제안하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>measure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방안, 조치\u003c/span>\u003c/div>\u003cdiv>\u003cb>increase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>증가시키다, 강화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>privacy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사생활\u003c/span>\u003c/div>\u003cdiv>\u003cb>safety\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안전\u003c/span>\u003c/div>\u003cdiv>\u003cb>plant\u003c/b>\u003cem>동사\u003c/em>\u003cspan>심다\u003c/span>\u003c/div>\u003cdiv>\u003cb>prevent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>막다, 예방하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>outsider\u003c/b>\u003cem>명사\u003c/em>\u003cspan>외부인\u003c/span>\u003c/div>\u003cdiv>\u003cb>protect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>줄이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>exposure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노출\u003c/span>\u003c/div>\u003cdiv>\u003cb>external\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>외부의\u003c/span>\u003c/div>\u003cdiv>\u003cb>risk\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위험\u003c/span>\u003c/div>\u003cdiv>\u003cb>additionally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>게다가, 또한\u003c/span>\u003c/div>\u003cdiv>\u003cb>security guard\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경비원\u003c/span>\u003c/div>\u003cdiv>\u003cb>entrance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>출입구\u003c/span>\u003c/div>\u003cdiv>\u003cb>detect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>감지하다, 발견하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unauthorized\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무단(의), 승인되지 않은\u003c/span>\u003c/div>\u003cdiv>\u003cb>access\u003c/b>\u003cem>명사\u003c/em>\u003cspan>출입, 접근\u003c/span>\u003c/div>\u003cdiv>\u003cb>respond\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대응하다, 반응하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>on behalf of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 대표하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggestion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제안\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 꼭 기억해야 할 단어들을 짚어볼게요. measure는 방안이나 조치라는 뜻으로 아주 자주 쓰입니다. unauthorized는 권한이 없거나 무단이라는 뜻으로, access와 함께 쓰여 무단출입을 의미하죠. on behalf of는 누구누구를 대표하여라는 중요한 숙어니까 꼭 외워두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">concern\u003c/b>\u003cspan class=\"m\">우려, 걱정\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">worry\u003c/span>\u003cspan class=\"s\">anxiety\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relief\u003c/span>\u003cspan class=\"a\">peace\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">propose\u003c/b>\u003cspan class=\"m\">제안하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">suggest\u003c/span>\u003cspan class=\"s\">offer\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">withdraw\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">increase\u003c/b>\u003cspan class=\"m\">강화하다, 증가시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"s\">boost\u003c/span>\u003cspan class=\"s\">raise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">decrease\u003c/span>\u003cspan class=\"a\">reduce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">prevent\u003c/b>\u003cspan class=\"m\">막다, 예방하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stop\u003c/span>\u003cspan class=\"s\">hinder\u003c/span>\u003cspan class=\"s\">block\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003cspan class=\"a\">permit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">reduce\u003c/b>\u003cspan class=\"m\">줄이다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">decrease\u003c/span>\u003cspan class=\"s\">diminish\u003c/span>\u003cspan class=\"s\">lessen\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">expand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">detect\u003c/b>\u003cspan class=\"m\">감지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discover\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"s\">spot\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 보겠습니다. 막다라는 뜻의 prevent는 stop이나 block과 같은 단어로 바꿔 쓸 수 있고, 반대말로는 allow나 permit이 있습니다. 줄이다라는 뜻의 reduce는 decrease나 lessen과 동의어이며, 반의어로는 increase가 있어요. 감지하다라는 뜻의 detect는 discover나 notice와 비슷한 의미로 쓰입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교장 선생님께,\u003c/span>\u003cspan class=\"en\">Dear Principal,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 학생회장으로서 이 글을 씁니다\u003c/span>\u003cspan class=\"en\">I am writing \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">head \u003c/span>\u003cspan class=\"tgt\">student\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 학생들이 우려를 표했기 때문에\u003c/span>\u003cspan class=\"en\">because many students \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">expressed\u003c/span> their concerns\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최근의 안전 사건들에 대해\u003c/span>\u003cspan class=\"en\">about the recent security incidents\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인근 학교들에서의\u003c/span>\u003cspan class=\"en\">at nearby schools.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">교장 선생님께, 저는 학생회장으로서 많은 학생들이 인근 학교들에서의 최근의 안전 사건들에 대해 우려를 표했기 때문에 이 글을 씁니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글을 쓰는 \u003cb class=\"key\">목적\u003c/b>과 글쓴이의 \u003cb class=\"key\">신분\u003c/b>을 밝히는 도입부입니다. 인근 학교의 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">문제\u003c/b>로 인해 학생들의 우려가 커진 상황을 전달하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 as (자격)\u003c/span> : as [전치사] + [명사] : \"학생회장으로서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재완료 시제\u003c/span> : have + pp (과거분사) : \"우려를 표했다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Dear Principal, 교장 선생님께. I am writing as the head student, 저는 학생회장으로서 이 글을 씁니다. because many students have expressed their concerns, 많은 학생들이 우려를 표했기 때문에. about the recent security incidents, 최근의 안전 사건들에 대해. at nearby schools, 인근 학교들에서의. 이 문장 전체를 해석하면, 교장 선생님께, 저는 학생회장으로서 많은 학생들이 인근 학교들에서의 최근의 안전 사건들에 대해 우려를 표했기 때문에 이 글을 씁니다.","hl":"m"},{"n":13,"text":"이 문장은 글을 쓴 목적과 글쓴이가 누구인지 밝히는 도입부예요. 근처 학교들에서 일어난 안전 문제 때문에 우리 학교 학생들도 걱정이 많아져서 글을 썼다는 상황을 보여주고 있죠.","hl":"mn"},{"n":14,"text":"어법 포인트 짚어볼게요. 첫 번째로 as the head student에서 as는 뭐뭐로서라는 자격을 나타내는 전치사로 쓰였어요. 두 번째로 have expressed를 보면 과거부터 지금까지 학생들이 우려를 나타내 왔다는 계속적 느낌을 살리기 위해 현재완료 시제가 쓰였답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 몇 가지 방안들을 제안합니다\u003c/span>\u003cspan class=\"en\">We propose a few measures\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들의 사생활과 안전을 강화하기 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">increase\u003c/span> students' privacy and safety.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저희는 학생들의 사생활과 안전을 강화하기 위한 몇 가지 방안들을 제안합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주장\u003c/b>을 담고 있습니다. 학생들의 프라이버시와 안전을 높이기 위해 구체적인 \u003cb class=\"key\">해결책\u003c/b>을 제시하겠다는 글의 전개 방향을 예고합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : 명사 + to + 동사원형 : \"강화하기 위한\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"We propose a few measures, 저희는 몇 가지 방안들을 제안합니다. to increase students' privacy and safety, 학생들의 사생활과 안전을 강화하기 위한. 이 문장 전체를 해석하면, 저희는 학생들의 사생활과 안전을 강화하기 위한 몇 가지 방안들을 제안합니다.","hl":"m"},{"n":16,"text":"이 문장은 이 편지의 핵심 주장을 말하고 있어요. 학생들의 사생활과 안전을 지키기 위한 구체적인 해결책을 이제부터 제안하겠다는 뜻이죠.","hl":"mn"},{"n":17,"text":"어법을 살펴볼게요. to increase에서 to부정사는 앞에 있는 명사 measures를 꾸며주고 있어요. 뭐뭐하기 위한 방안이라는 뜻을 만들어주는 형용사적 용법의 to부정사로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">먼저, 학교 주변에 나무를 심는 것이\u003c/span>\u003cspan class=\"en\">First, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">planting \u003c/span>\u003cspan class=\"tgt\">trees \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">외부인들이 학생들을 볼 수 없도록 막아 줄 것이고,\u003c/span>\u003cspan class=\"en\">would \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">prevent \u003c/span>\u003cspan class=\"tgt\">outsiders \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">watching\u003c/span> students\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 학생들의 사생활을 보호하는 것을 돕고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">which\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">helps \u003c/span>\u003cspan class=\"tgt\">protect\u003c/span> students' privacy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">외부 위험에 대한 그들의 노출을 줄입니다.\u003c/span>\u003cspan class=\"en\">and reduces their exposure to external risks.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">먼저, 학교 주변에 나무를 심는 것이 외부인들이 학생들을 볼 수 없도록 막아 줄 것이고, 이는 학생들의 사생활을 보호하는 것을 돕고 외부 위험에 대한 그들의 노출을 줄입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 제안하는 방안 중 첫 번째인 \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">심기\u003c/b>의 효과를 설명하는 문장입니다. 나무가 시야를 차단해 프라이버시를 보호하고 \u003cb class=\"key\">외부 \u003c/b>\u003cb class=\"key\">위험\u003c/b>을 줄여준다는 논리적 근거를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : V-ing + ... + 단수동사 : \"학교 주변에 나무를 심는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">prevent A from V-ing\u003c/span> : prevent + [목적어] + from + [V-ing (동명사)] : \"외부인들이 보는 것을 막다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : 콤마(,) + which : \"그리고 이는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">help + (to) 동사원형\u003c/span> : help + [동사원형/to부정사] : \"보호하는 것을 돕다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사 병렬 구조\u003c/span> : 단수동사 + and + 단수동사 : \"돕고 줄입니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"First, planting trees around the school, 먼저, 학교 주변에 나무를 심는 것이. would prevent outsiders from watching students, 외부인들이 학생들을 볼 수 없도록 막아 줄 것이고. which helps protect students' privacy, 이는 학생들의 사생활을 보호하는 것을 돕고. and reduces their exposure to external risks, 외부 위험에 대한 그들의 노출을 줄입니다.. 이 문장 전체를 해석하면, 먼저, 학교 주변에 나무를 심는 것이 외부인들이 학생들을 볼 수 없도록 막아 줄 것이고, 이는 학생들의 사생활을 보호하는 것을 돕고 외부 위험에 대한 그들의 노출을 줄입니다.","hl":"m"},{"n":19,"text":"첫 번째 해결책으로 나무 심기를 제안하고 있어요. 나무를 심으면 외부 사람들이 학생들을 마음대로 보는 걸 막을 수 있어서, 결과적으로 사생활도 지키고 외부 위험도 줄여준다는 구체적인 장점을 설명하는 중요한 문장이랍니다.","hl":"mn"},{"n":20,"text":"이 문장에는 중요한 어법이 아주 많아요. 첫 번째로 맨 앞의 planting은 동명사구로 문장의 주어 역할을 하고 있어요. 두 번째로 prevent outsiders from watching 구문은 목적어가 뭐뭐하는 것을 막다라는 아주 중요한 표현이에요. prevent 대신 stop이나 keep을 써도 같은 뜻이 된답니다. 세 번째로 콤마 뒤의 which는 앞 문장 전체를 선행사로 받아서 추가 설명을 하는 계속적 용법의 관계대명사예요. 앞 내용 전체를 받기 때문에 단수 취급해서 단수 동사가 와야 해요. 네 번째로 helps 뒤에 protect라는 동사원형이 바로 왔죠? help는 목적어로 to부정사도 되지만 동사원형을 바로 쓸 수 있는 특별한 동사랍니다. 마지막 다섯 번째로 which에 연결되는 동사 helps와 reduces가 and로 묶여서 단수형으로 병렬 구조를 이루고 있다는 점 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한,\u003c/span>\u003cspan class=\"en\">Additionally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 CCTV 카메라와 경비원들이\u003c/span>\u003cspan class=\"en\">more CCTV cameras and security guards\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">출입구 근처에 추가될 수 있을 것입니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">added\u003c/span> near the entrances\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무단출입을 감지하고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">detect\u003c/span> unauthorized access\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사건들에도 신속하게 대응하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">respond\u003c/span> quickly to any incidents.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">또한, 무단출입을 감지하고 어떤 사건들에도 신속하게 대응하기 위해 더 많은 CCTV 카메라와 경비원들이 출입구 근처에 추가될 수 있을 것입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이전 문장의 나무 심기에 이은 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">번째 \u003c/b>\u003cb class=\"key\">제안\u003c/b>입니다. 물리적인 보안 인력과 장비를 확충하여 실질적인 \u003cb class=\"key\">학교 \u003c/b>\u003cb class=\"key\">안전\u003c/b>을 강화하자는 목적을 구체적으로 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 수동태\u003c/span> : could + be + p.p.(added) : \"추가될 수 있을 것입니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + 동사원형 : \"감지하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : to + [동사원형1] and [동사원형2] : \"그리고 대응하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Additionally, 또한. more CCTV cameras and security guards, 더 많은 CCTV 카메라와 경비원들이. could be added near the entrances, 출입구 근처에 추가될 수 있을 것입니다. to detect unauthorized access, 무단출입을 감지하고. and respond quickly to any incidents, 어떤 사건들에도 신속하게 대응하기 위해. 이 문장 전체를 해석하면, 또한, 무단출입을 감지하고 어떤 사건들에도 신속하게 대응하기 위해 더 많은 CCTV 카메라와 경비원들이 출입구 근처에 추가될 수 있을 것입니다.","hl":"m"},{"n":22,"text":"이 문장은 앞서 말한 나무 심기에 이어지는 두 번째 제안이에요. CCTV 카메라와 경비원을 추가 배치해서 실질적인 학교 안전을 강화하자는 구체적인 목적을 담고 있죠.","hl":"mn"},{"n":23,"text":"어법 포인트를 짚어볼게요. 첫 번째로 could be added를 보세요. 주어인 카메라와 경비원들은 스스로 추가하는 게 아니라 추가되어지는 대상이잖아요? 그래서 조동사 뒤에 비동사 플러스 피피 형태인 조동사 수동태를 썼습니다. 두 번째로 to detect는 카메라와 경비원이 추가되는 목적을 설명하는 부사적 용법의 투부정사예요. 감지하기 위해서라고 해석하죠. 세 번째로 and 뒤에 나온 respond는 앞에 있는 투부정사의 detect와 짝을 이루는 병렬 구조랍니다. and 뒤에 to가 생략되었다고 보면 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">학생들을 대표하여\u003c/span>\u003cspan class=\"en\">On behalf of the students,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 바랍니다\u003c/span>\u003cspan class=\"en\">I hope\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교장선생님께서 부디 고려해 주시기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">kindly \u003c/span>\u003cspan class=\"tgt\">consider \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 제안들을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">suggestions\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">학생들을 대표하여 저는 교장선생님께서 부디 이 제안들을 고려해 주시기를 바랍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 서두에서 밝혔듯 학생 대표로서 글을 쓴다는 점을 다시 강조하며, 교장선생님께 \u003cb class=\"key\">제안 \u003c/b>\u003cb class=\"key\">수용\u003c/b>을 정중하게 요청하는 \u003cb class=\"key\">결론 \u003c/b>\u003cb class=\"key\">문장\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : hope [타동사] + [that + 주어 + 동사 ~ (명사절/목적어)] : \"교장선생님께서 부디 이 제안들을 고려해 주시기를\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"On behalf of the students, 학생들을 대표하여. I hope, 저는 바랍니다. that you will kindly consider, 교장선생님께서 부디 고려해 주시기를. these suggestions, 이 제안들을.. 이 문장 전체를 해석하면, 학생들을 대표하여 저는 교장선생님께서 부디 이 제안들을 고려해 주시기를 바랍니다.","hl":"m"},{"n":25,"text":"이 글을 마무리하는 결론 문장이네요. 자기가 학생 대표라는 입장을 한 번 더 밝히면서, 교장선생님께 지금까지 말한 제안 수용을 아주 정중하게 부탁하고 있어요.","hl":"mn"},{"n":26,"text":"여기서 짚고 넘어갈 어법은 that이 이끄는 절이에요. hope라는 타동사 뒤에서 목적어 역할을 하는 명사절을 이끌고 있죠. 이때 that은 명사절 접속사로 쓰였고 뒤에는 완전한 문장이 온답니다. 목적어로 쓰였으니 당연히 생략도 가능해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감사합니다.\u003c/span>\u003cspan class=\"en\">Thank you.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">감사합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지글의 전형적인 \u003cb class=\"key\">끝맺음 \u003c/b>\u003cb class=\"key\">인사\u003c/b>입니다.\u003c/div>","segs":[{"n":27,"text":"Thank you, 감사합니다.. 이 문장 전체를 해석하면, 감사합니다.","hl":"m"},{"n":28,"text":"격식을 갖춘 편지글에서 흔히 쓰는 아주 기본적인 끝맺음 인사예요.","hl":"mn"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진심을 담아,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Sincerely,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">David Miller 드림\u003c/span>\u003cspan class=\"en\">David Miller\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">David Miller 드림\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 편지의 \u003cb class=\"key\">끝맺음 \u003c/b>\u003cb class=\"key\">인사\u003c/b>와 발신자의 \u003cb class=\"key\">서명\u003c/b>입니다. 격식을 갖춘 편지에서 흔히 쓰이는 마무리 관용구입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">편지 맺음말 관용구\u003c/span> : Sincerely + [쉼표] + [발신자 이름] : \"진심을 담아, ~ 드림\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"Sincerely, 진심을 담아. David Miller, David Miller 드림. 이 문장 전체를 해석하면, David Miller 드림","hl":"m"},{"n":30,"text":"이 문장은 편지의 끝맺음 인사와 발신자의 서명입니다. 격식을 갖춘 편지나 이메일에서 흔히 쓰이는 아주 전형적인 마무리 관용구죠.","hl":"mn"},{"n":31,"text":"어법 포인트 짚어보겠습니다. 첫 번째로 Sincerely는 격식을 차린 편지 마지막에 쓰는 관용적인 맺음말입니다. 보통 뒤에 쉼표를 찍고 그 아래에 발신자 이름을 적어서 누구누구 올림 혹은 드림이라는 뜻을 나타내죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>최근 인근 학교에서 벌어진 \u003cb class=\"key\">안전 \u003c/b>\u003cb class=\"key\">사건\u003c/b>들로 인해 많은 학생들이 우려하고 있습니다.\u003c/li>\u003cli>학생회장으로서 학생들의 \u003cb class=\"key\">사생활\u003c/b>과 안전을 강화할 몇 가지 방안을 제안합니다.\u003c/li>\u003cli>먼저, 외부인의 시선을 차단하고 위험 노출을 줄이기 위해 학교 주변에 \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">심기\u003c/b>를 제안합니다.\u003c/li>\u003cli>또한, 무단출입을 막고 신속히 대응하기 위해 출입구에 \u003cb class=\"key\">CCTV\u003c/b>와 \u003cb class=\"key\">경비원\u003c/b>을 추가해 줄 것을 요청합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The student head proposes planting trees and adding CCTV cameras and security guards to improve students' privacy and safety.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">최근 인근 학교들의 안전 사건을 계기로, 학생회장이 교장 선생님께 \u003cb class=\"key\">나무 \u003c/b>\u003cb class=\"key\">심기\u003c/b>와 \u003cb class=\"key\">CCTV \u003c/b>\u003cb class=\"key\">및 \u003c/b>\u003cb class=\"key\">경비원 \u003c/b>\u003cb class=\"key\">추가\u003c/b>를 통한 학교 보안 및 사생활 보호 강화를 제안하는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":32,"text":"자, 이렇게 해서 학교 안전 강화를 위해 교장 선생님께 쓴 건의문을 모두 분석해 보았습니다. 제안의 목적과 두 가지 구체적인 방안이 무엇인지 정확히 이해하셨죠? 복습 철저히 하시고, 다음 시간에 또 다른 지문으로 만나겠습니다. 수고하셨습니다.","hl":null}]}]});</script></body></html>
