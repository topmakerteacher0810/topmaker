<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 22번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 22번","audioDir":"2026-10-g2-22_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">22번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>Ethical Responsibility of Content Creators for Social and Environmental Causes\u003c/h1>\u003ch2>콘텐츠 제작자들의 사회적, 환경적 대의를 위한 윤리적 책임\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>콘텐츠 제작자들은 자신의 플랫폼이 미치는 \u003cb class=\"key\">영향력\u003c/b>을 인식하고, 긍정적인 사회적 및 환경적 변화를 이끌어 내기 위해 \u003cb class=\"key\">윤리적 \u003c/b>\u003cb class=\"key\">책임\u003c/b>을 다해야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Content creators have an ethical responsibility to use their influential platforms to drive positive social and environmental change.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 함께 살펴볼 지문은 콘텐츠 제작자들의 역할에 대해 다루고 있어요. 현대 사회에서 이들이 갖춰야 할 '사회적, 환경적 대의를 위한 윤리적 책임'이 이 글의 주제입니다. 요약하자면, 콘텐츠 제작자들은 자신의 플랫폼이 미치는 영향력을 인식하고 긍정적인 변화를 이끌어 내기 위해 윤리적 책임을 다해야 한다는 내용이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">현대 사회에서는 물건을 살 때 단순한 가격이나 품질을 넘어 환경과 인권을 생각하는 \u003cb class=\"key\">윤리적 \u003c/b>\u003cb class=\"key\">소비주의\u003c/b>(ethical consumerism)가 매우 중요해지고 있습니다. 이에 따라 대중에게 엄청난 파급력을 미치는 \u003cb class=\"key\">콘텐츠 \u003c/b>\u003cb class=\"key\">제작자\u003c/b>(content creators)들의 사회적 책임도 덩달아 커졌습니다. 마치 학교에서 영향력 있는 친구의 행동 하나가 반 전체 분위기를 바꾸는 것과 비슷하죠. 예를 들어, 수백만 명의 구독자를 가진 유튜버가 친환경 제품을 사용하면 시청자들도 그 행동을 따라 하며 인식이 바뀔 수 있습니다. 따라서 이들은 자신의 플랫폼을 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">변화\u003c/b>(positive change)를 이끄는 도구로 사용할 책임을 지니게 됩니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 조금 쌓아볼까요? 현대 사회에서는 물건을 살 때 단순한 가격이나 품질을 넘어 환경과 인권을 생각하는 윤리적 소비주의가 중요해지고 있어요. 이에 따라 대중에게 엄청난 파급력을 미치는 콘텐츠 제작자들의 사회적 책임도 덩달아 커졌습니다. 마치 학교에서 영향력 있는 친구의 행동 하나가 반 전체 분위기를 바꾸는 것과 비슷하죠. 수백만 구독자를 가진 유튜버가 친환경 제품을 쓴다면, 시청자들의 인식과 행동도 긍정적인 방향으로 바뀔 수 있으니까요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>도입\u003csmall>배경 제시 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>콘텐츠 제작자에게 요구되는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">책임\u003c/b>의 대두를 설명합니다. 전 세계적으로 환경 및 지속가능성 문제에 대한 인식이 높아지면서 제작자들의 \u003cb class=\"key\">윤리적 \u003c/b>\u003cb class=\"key\">고려\u003c/b>가 중요해지고 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>전개 (주장)\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>콘텐츠가 가지는 \u003cb class=\"key\">영향력\u003c/b>과 그에 따른 막중한 책임을 강조합니다. 이들은 대중의 태도를 바꿀 수 있는 거대한 플랫폼을 가지고 있으므로, 이를 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 위해 사용할 책임이 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>예시\u003csmall>예시 · 문장 5\u003c/small>\u003c/h4>\u003cp>긍정적 변화를 이끄는 구체적 \u003cb class=\"key\">예시\u003c/b>를 보여줍니다. 친환경 제품을 홍보하거나 평등과 정의를 지지하는 행동은 대중의 인식을 높이고 의미 있는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 이끌어 낼 수 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>진정한 \u003cb class=\"key\">윤리적 \u003c/b>\u003cb class=\"key\">제작자\u003c/b>의 조건을 요약합니다. 이들은 단순히 제품을 홍보하는 것을 넘어, 자신의 콘텐츠가 본인의 사회적, 환경적 \u003cb class=\"key\">원칙\u003c/b>과 반드시 일치하게 해야 합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 시대적 배경을 먼저 제시하고, 이에 따른 콘텐츠 제작자의 책임과 구체적인 예시를 순서대로 보여줍니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장입니다. 전 세계적으로 사회적 문제나 환경 문제에 대한 인식이 커지면서, 콘텐츠 제작자들에게도 폭넓은 영향력을 고려하라는 요구가 생겨납니다. 즉, 이들에게 사회적 책임이라는 것이 아주 중요한 윤리적 고려 사항이 되었다는 점을 도입부에서 밝히고 있습니다.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장을 볼까요? 콘텐츠 제작자들은 기후 변화나 사회 정의 같은 무거운 주제들도 콘텐츠 안에서 다루어야 합니다. 왜냐하면 그들은 청중의 태도와 행동에 영향을 미칠 수 있는 커다란 플랫폼을 가지고 있기 때문이죠. 이 플랫폼을 긍정적인 변화를 위해 사용할 책임이 있다는 것이 글의 핵심입니다.","hl":"f1"},{"n":6,"text":"다섯 번째 문장에서는 이해를 돕기 위한 예시가 등장합니다. 환경적으로 지속가능한 제품을 홍보하거나 평등과 같은 대의명분을 지지하는 행동을 보여줍니다. 이런 행동들이 결국 대중의 인식을 높이고 의미 있는 사회적 영향을 이끌어 낼 수 있다고 설명하네요.","hl":"f2"},{"n":7,"text":"마지막 여섯 번째 문장입니다. 결론적으로 진정한 윤리적 콘텐츠 제작자는 어떤 사람일까요? 단순히 제품 홍보에만 열을 올리는 게 아니죠. 자신이 지지하는 가치를 고민하고, 자신의 콘텐츠가 본인의 사회적, 환경적 원칙과 반드시 일치하도록 꼼꼼히 확인하는 사람이라는 점을 강조하며 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 도입부에서 시대적 배경을 제시한 후, 중반부인 네 번째 문장에서 콘텐츠 제작자들이 자신의 플랫폼을 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 위해 사용해야 한다는 핵심 \u003cb class=\"key\">주장\u003c/b>을 던집니다. 이후 구체적인 \u003cb class=\"key\">예시\u003c/b>를 통해 주장을 뒷받침하고, 마지막 문장에서 윤리적 제작자의 태도를 요약하며 글을 \u003cb class=\"key\">마무리\u003c/b>합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>As (2)\u003c/b>\u003cspan>시대적 배경 제시\u003c/span>\u003cb>For example (5)\u003c/b>\u003cspan>구체적인 예시 시작\u003c/span>\u003cb>not only ~ but also (6)\u003c/b>\u003cspan>결론 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Social and environmental responsibility\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the broader impact of their work\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">addressing topics such as climate change, social justice, and ethical consumerism\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">responsibility to use that platform for positive change\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">meaningful social impact\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">values and causes they support\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 지문은 주장과 근거, 그리고 예시로 이루어진 구조를 취하고 있습니다. 전체적인 흐름으로 보면 글 한가운데인 네 번째 문장에서 글쓴이의 가장 핵심적인 주장이 등장하는 중괄식 구조라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"구조를 파악할 수 있는 신호어들을 짚어볼게요. 두 번째 문장의 As는 시대적 배경이 어떻게 변하고 있는지 자연스럽게 연결해 주는 역할을 합니다. 그리고 다섯 번째 문장의 For example은 주장을 뒷받침하는 구체적인 예시가 시작됨을 뚜렷하게 보여주죠. 마지막 문장의 not only A but also B 구문은 필자가 강조하고 싶은 결론을 강하게 전달하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>social\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사회적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>environmental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>환경적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>responsibility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>책임\u003c/span>\u003c/div>\u003cdiv>\u003cb>increasingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>점점 더\u003c/span>\u003c/div>\u003cdiv>\u003cb>ethical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>윤리적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>consideration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고려 사항\u003c/span>\u003c/div>\u003cdiv>\u003cb>awareness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인식\u003c/span>\u003c/div>\u003cdiv>\u003cb>sustainability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지속가능성\u003c/span>\u003c/div>\u003cdiv>\u003cb>call upon\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에게 요구하다, 요청하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>broader\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 폭넓은\u003c/span>\u003c/div>\u003cdiv>\u003cb>impact\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영향력, 충격\u003c/span>\u003c/div>\u003cdiv>\u003cb>address\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(문제, 주제를) 다루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>climate change\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기후 변화\u003c/span>\u003c/div>\u003cdiv>\u003cb>social justice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회 정의\u003c/span>\u003c/div>\u003cdiv>\u003cb>consumerism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소비주의\u003c/span>\u003c/div>\u003cdiv>\u003cb>platform\u003c/b>\u003cem>명사\u003c/em>\u003cspan>플랫폼, 기반\u003c/span>\u003c/div>\u003cdiv>\u003cb>influence\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영향을 미치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>audience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>청중\u003c/span>\u003c/div>\u003cdiv>\u003cb>attitude\u003c/b>\u003cem>명사\u003c/em>\u003cspan>태도\u003c/span>\u003c/div>\u003cdiv>\u003cb>behavior\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동\u003c/span>\u003c/div>\u003cdiv>\u003cb>positive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>긍정적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>promote\u003c/b>\u003cem>동사\u003c/em>\u003cspan>홍보하다, 촉진하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sustainable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지속가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대의명분, 원인\u003c/span>\u003c/div>\u003cdiv>\u003cb>equality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>평등\u003c/span>\u003c/div>\u003cdiv>\u003cb>meaningful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의미 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>align with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 일치하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>principle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원칙\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어 몇 개 확인해 보겠습니다. ethical은 윤리적인이라는 뜻으로, 이 글의 전체적인 성격을 규정하는 단어입니다. cause는 흔히 원인이라고 외우지만, 여기서는 지지해야 할 훌륭한 가치를 뜻하는 대의명분이라는 뜻으로 쓰였다는 점 꼭 기억해 두세요. align with는 무엇무엇과 일치하다라는 뜻으로 마지막 결론부에 등장합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">ethical\u003c/b>\u003cspan class=\"m\">윤리적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">moral\u003c/span>\u003cspan class=\"s\">righteous\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unethical\u003c/span>\u003cspan cl l}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적 그리고 환경적 책임은\u003c/span>\u003cspan class=\"en\">Social and environmental responsibility\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">되어 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">become\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 중요한 윤리적 고려 사항이\u003c/span>\u003cspan class=\"en\">an \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">increasingly \u003c/span>\u003cspan class=\"tgt\">important \u003c/span>\u003cspan class=\"tgt\">ethical \u003c/span>\u003cspan class=\"tgt\">consideration\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">콘텐츠 제작자들에게.\u003c/span>\u003cspan class=\"en\">for content creators.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사회적 그리고 환경적 책임은 콘텐츠 제작자들에게 점점 더 중요한 윤리적 고려 사항이 되어 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 핵심 소재를 도입합니다. 콘텐츠 제작자들이 단순히 결과물만 내는 것을 넘어, 이제는 \u003cb class=\"key\">윤리적 \u003c/b>\u003cb class=\"key\">책임\u003c/b>을 져야 한다는 시대적 흐름을 보여주며 전체 글의 방향을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 시제 (계속/결과)\u003c/span> : have/has + [p.p.] : \"되어 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사 수식 어순\u003c/span> : [부사] + [형용사] + [명사] : \"점점 더 중요한 윤리적 고려 사항\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Social and environmental responsibility, 사회적 그리고 환경적 책임은. has become, 되어 왔다. an increasingly important ethical consideration, 점점 더 중요한 윤리적 고려 사항이. for content creators, 콘텐츠 제작자들에게.. 이 문장 전체를 해석하면, 사회적 그리고 환경적 책임은 콘텐츠 제작자들에게 점점 더 중요한 윤리적 고려 사항이 되어 왔다.","hl":"m"},{"n":13,"text":"이 문장은 글의 핵심 소재를 던져주고 있어요. 콘텐츠 제작자들이 단순히 영상을 만드는 걸 넘어서서, 이제는 윤리적인 책임을 져야 한다는 시대적 배경을 설명하는 거죠. 이 글 전체의 방향을 잡아주는 아주 중요한 첫 번째 문장이랍니다.","hl":"mn"},{"n":14,"text":"어법을 살펴볼까요. 첫 번째로 has become을 보시면요, 과거 어느 시점부터 지금까지 쭉 그래왔다는 걸 보여주는 현재완료 시제가 쓰였어요. 시대의 흐름이 계속해서 변해왔음을 강조하는 거죠. 두 번째로 increasingly important ethical consideration 부분인데요. 점점 더라는 뜻의 부사 increasingly가 중요한이라는 형용사 important를 꾸며주고, 그 형용사가 다시 뒤의 명사를 꾸며주는 부사 형용사 명사의 수식 구조를 잘 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계적인 인식이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As\u003c/span> global awareness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적, 환경적, 그리고 지속가능성 문제들에 대한\u003c/span>\u003cspan class=\"en\">of social, environmental, and sustainability issues\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커짐에 따라,\u003c/span>\u003cspan class=\"en\">grows,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 콘텐츠 제작자들은\u003c/span>\u003cspan class=\"en\">many content creators\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요구받고 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">called \u003c/span>\u003cspan class=\"tgt\">upon\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 폭넓은 영향력을 고려하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">consider\u003c/span> the broader impact\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 작업의\u003c/span>\u003cspan class=\"en\">of their work.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사회적, 환경적, 그리고 지속가능성 문제들에 대한 전 세계적인 인식이 커짐에 따라, 많은 콘텐츠 제작자들은 자신의 작업의 더 폭넓은 영향력을 고려하도록 요구받고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 변화가 왜 일어나는지 그 원인을 설명합니다. 대중의 의식 수준이 높아짐에 따라, 창작자들도 자신의 콘텐츠가 미치는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">영향력\u003c/b>을 깊이 생각해야 한다는 인과 관계를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 (~함에 따라)\u003c/span> : As [주어] + [동사] : \"~함에 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재진행 수동태\u003c/span> : be동사 + being + [p.p.] : \"요구받고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사 (목적보어)\u003c/span> : be called upon + [to부정사] : \"고려하도록\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"As global awareness, 전 세계적인 인식이. of social, environmental, and sustainability issues, 사회적, 환경적, 그리고 지속가능성 문제들에 대한. grows, 커짐에 따라. many content creators, 많은 콘텐츠 제작자들은. are being called upon, 요구받고 있다. to consider the broader impact, 더 폭넓은 영향력을 고려하도록. of their work, 자신의 작업의. 이 문장 전체를 해석하면, 사회적, 환경적, 그리고 지속가능성 문제들에 대한 전 세계적인 인식이 커짐에 따라, 많은 콘텐츠 제작자들은 자신의 작업의 더 폭넓은 영향력을 고려하도록 요구받고 있다.","hl":"m"},{"n":16,"text":"대중들이 환경이나 사회 문제에 똑똑해지고 관심이 많아지니까, 콘텐츠를 만드는 사람들도 당연히 자기 영상이 미칠 사회적 영향력을 생각해야 한다는 뜻이에요. 앞 문장에서 말한 변화가 왜 일어나고 있는지 그 원인을 잘 설명해 주고 있죠.","hl":"mn"},{"n":17,"text":"어법 포인트 짚어드릴게요. 첫 번째로 맨 앞의 As는 뭐뭐함에 따라라는 뜻으로 변화의 비례를 나타내는 접속사예요. 인식이 커짐에 따라 이렇게 자연스럽게 해석되죠. 두 번째로 are being called upon을 별표 쳐주세요. 요구를 받고 있는 중이다라는 뜻으로, 비동사 플러스 비잉 플러스 피피 형태의 현재진행 수동태가 쓰였어요. 서술형으로 나오기 딱 좋은 부분입니다. 세 번째로 그 뒤에 붙은 to consider는 원래 구조에서 목적격 보어였던 투 부정사가 수동태가 되면서 그대로 남아 행위의 내용을 설명해 주는 거랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 포함한다\u003c/span>\u003cspan class=\"en\">This includes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주제들을 다루는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">addressing\u003c/span> topics\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기후 변화, 사회 정의, 그리고 윤리적 소비주의와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> climate change, social justice, and ethical consumerism\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 콘텐츠에서.\u003c/span>\u003cspan class=\"en\">in their content.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 그들의 콘텐츠에서 기후 변화, 사회 정의, 그리고 윤리적 소비주의와 같은 주제들을 다루는 것을 포함한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 '폭넓은 영향력을 고려하는 것'의 실제 사례를 제시합니다. 창작자들이 콘텐츠 속에 담아야 할 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">주제\u003c/b>들을 나열하여 이해를 돕습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 (목적어)\u003c/span> : include [타동사] + [동명사] : \"다루는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 (예시)\u003c/span> : such as + [명사(구)] : \"~와 같은\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"This includes, 이것은 포함한다. addressing topics, 주제들을 다루는 것을. such as climate change, social justice, and ethical consumerism, 기후 변화, 사회 정의, 그리고 윤리적 소비주의와 같은. in their content, 그들의 콘텐츠에서.. 이 문장 전체를 해석하면, 이것은 그들의 콘텐츠에서 기후 변화, 사회 정의, 그리고 윤리적 소비주의와 같은 주제들을 다루는 것을 포함한다.","hl":"m"},{"n":19,"text":"앞 문장에서 폭넓은 영향력을 고려하라고 했잖아요? 그게 구체적으로 뭔지 예시를 들어주는 문장이에요. 영상 속에서 기후 변화나 사회 정의 같은 묵직한 주제들을 실제로 다루는 것이 바로 그 책임감 있는 행동이라는 거죠.","hl":"mn"},{"n":20,"text":"문법 구조 볼게요. 첫 번째로 includes 뒤에 addressing이 나왔는데요. 동사 include는 목적어로 투 부정사가 아니라 동명사를 데리고 온다는 점을 꼭 기억해 두세요. 두 번째로 such as는 뭐뭐와 같은이라는 뜻으로, 앞에 나온 topics라는 넓은 의미의 단어를 구체적으로 설명해 주기 위해 예시를 쭉 나열할 때 쓰는 표현이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">콘텐츠 제작자들은 플랫폼을 가지고 있으며,\u003c/span>\u003cspan class=\"en\">Content creators have a platform\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영향을 미칠 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">influence\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 청중의 태도와 행동에\u003c/span>\u003cspan class=\"en\">their audience's attitudes and behaviors,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 책임을 지닌다\u003c/span>\u003cspan class=\"en\">and they have a responsibility\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 플랫폼을 사용할\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">use\u003c/span> that platform\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">긍정적인 변화를 위해.\u003c/span>\u003cspan class=\"en\">for positive change.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">콘텐츠 제작자들은 자신의 청중의 태도와 행동에 영향을 미칠 수 있는 플랫폼을 가지고 있으며, 그들은 그 플랫폼을 긍정적인 변화를 위해 사용할 책임을 지닌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 콘텐츠 제작자가 가진 영향력의 크기를 강조하며, 그에 따른 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">책임\u003c/b>을 명확히 제시합니다. 대중의 생각을 바꿀 수 있는 힘이 있으니, 그 힘을 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">방향\u003c/b>으로 써야 한다는 글의 핵심 논리가 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a platform [선행사] + that [주격 관계대명사] + can influence [동사] : \"영향을 미칠 수 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : a responsibility [명사] + to use [to부정사] : \"사용할\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Content creators have a platform, 콘텐츠 제작자들은 플랫폼을 가지고 있으며. that can influence, 영향을 미칠 수 있는. their audience's attitudes and behaviors, 자신의 청중의 태도와 행동에. and they have a responsibility, 그들은 책임을 지닌다. to use that platform, 그 플랫폼을 사용할. for positive change, 긍정적인 변화를 위해.. 이 문장 전체를 해석하면, 콘텐츠 제작자들은 자신의 청중의 태도와 행동에 영향을 미칠 수 있는 플랫폼을 가지고 있으며, 그들은 그 플랫폼을 긍정적인 변화를 위해 사용할 책임을 지닌다.","hl":"m"},{"n":22,"text":"이 문장은 콘텐츠 제작자가 가진 영향력이 얼마나 큰지 강조하면서, 그에 따른 사회적 책임을 명확하게 제시하고 있어요. 사람들의 태도와 행동을 바꿀 수 있는 힘이 있으니까, 그 힘을 반드시 긍정적인 방향으로 써야 한다는 글의 핵심 주장이 잘 담겨 있죠.","hl":"mn"},{"n":23,"text":"어법 포인트 짚어보겠습니다. 첫 번째로 that can influence에서 that은 선행사 a platform을 꾸며주는 주격 관계대명사절을 이끌어요. 바로 뒤에 동사 can influence가 나오는 걸 보면 주어가 빠져 있다는 걸 알 수 있죠. 두 번째로 a responsibility 뒤에 나온 to use는 명사인 책임을 꾸며주며 사용할 책임이라고 해석되는 형용사적 용법으로 쓰였답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어,\u003c/span>\u003cspan class=\"en\">For example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경적으로 지속가능한 제품들을 홍보하거나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">promoting \u003c/span>\u003cspan class=\"tgt\">environmentally \u003c/span>\u003cspan class=\"tgt\">sustainable \u003c/span>\u003cspan class=\"tgt\">products \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대의명분을 지지하는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">supporting\u003c/span> causes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평등과 정의에 관련된\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">related \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> equality and justice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인식을 높이고\u003c/span>\u003cspan class=\"en\">can help \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">raise \u003c/span>\u003cspan class=\"tgt\">awareness \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의미 있는 사회적 영향을 이끌어 내는 것을 도울 수 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">drive\u003c/span> meaningful social impact.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 환경적으로 지속가능한 제품들을 홍보하거나 평등과 정의에 관련된 대의명분을 지지하는 것은 인식을 높이고 의미 있는 사회적 영향을 이끌어 내는 것을 도울 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급된 '긍정적인 변화를 위한 플랫폼 사용'의 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 제시합니다. 환경 제품 홍보나 사회적 대의 지지 같은 행동이 어떻게 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>으로 이어지는지 잘 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어의 병렬 구조\u003c/span> : promoting [동명사] ~ or supporting [동명사] : \"홍보하거나 ~ 지지하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구\u003c/span> : causes [명사] + related to [과거분사구] : \"~에 관련된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동사원형의 병렬\u003c/span> : help [동사] + (to) raise [동사원형] ~ and (to) drive [동사원형] : \"높이고 ~ 이끌어 내는 것을\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"For example, 예를 들어. promoting environmentally sustainable products, 환경적으로 지속가능한 제품들을 홍보하거나. or supporting causes, 대의명분을 지지하는 것은. related to equality and justice, 평등과 정의에 관련된. can help raise awareness, 인식을 높이고. and drive meaningful social impact, 의미 있는 사회적 영향을 이끌어 내는 것을 도울 수 있다.. 이 문장 전체를 해석하면, 예를 들어, 환경적으로 지속가능한 제품들을 홍보하거나 평등과 정의에 관련된 대의명분을 지지하는 것은 인식을 높이고 의미 있는 사회적 영향을 이끌어 내는 것을 도울 수 있다.","hl":"m"},{"n":25,"text":"방금 전 문장에서 긍정적인 변화를 위해 노력해야 한다고 했잖아요? 이 문장은 그 구체적인 예시를 들어주는 부분이에요. 친환경 제품을 홍보하거나 평등 같은 가치를 지지하는 행동이 어떻게 의미 있는 사회적 영향으로 이어질 수 있는지를 아주 잘 설명해주고 있습니다.","hl":"mn"},{"n":26,"text":"문법적으로 중요한 게 많아요. 첫 번째로 문장의 주어가 아주 긴데, promoting과 supporting이라는 두 개의 동명사구가 or로 묶여서 주어 역할을 하고 있는 병렬 구조를 확인해야 해요. 두 번째로 causes 뒤에 나온 related to는 앞에 있는 명사인 대의명분을 뒤에서 꾸며주는 과거분사구로 수동의 뜻을 가집니다. 세 번째로 조동사 can help 뒤에 나오는 부분인데요. help는 목적어로 동사원형을 취할 수 있어서 raise와 drive라는 두 개의 동사원형이 and로 나란히 병렬 연결되어 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">윤리적인 콘텐츠 제작자들은\u003c/span>\u003cspan class=\"en\">Ethical content creators\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">홍보하는 데만 초점을 맞추는 것이 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">focus \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">promoting \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 제품이나 서비스를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">products \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">services \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고려하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">also \u003c/span>\u003cspan class=\"tgt\">consider\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신이 지지하는 가치와 대의명분도\u003c/span>\u003cspan class=\"en\">the values and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">causes \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">support\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 콘텐츠가 반드시 일치하게 한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">ensuring\u003c/span> that their content aligns\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 사회적 그리고 환경적 원칙과.\u003c/span>\u003cspan class=\"en\">with their social and environmental principles.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">윤리적인 콘텐츠 제작자들은 자신의 제품이나 서비스를 홍보하는 데만 초점을 맞추는 것이 아니라, 자신이 지지하는 가치와 대의명분도 고려하며, 자신의 콘텐츠가 자신의 사회적 그리고 환경적 원칙과 반드시 일치하게 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">결론\u003c/b>에 해당하는 문장입니다. 윤리적인 크리에이터란 단순히 돈을 버는 상업적 목적을 넘어, 자신이 지지하는 \u003cb class=\"key\">가치와 \u003c/b>\u003cb class=\"key\">원칙\u003c/b>을 콘텐츠에 녹여내는 사람임을 요약해서 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">상관접속사 병렬 구조\u003c/span> : not only A [동사구] but also B [동사구] : \"초점을 맞추는 것뿐만 아니라 ~ 고려하기도 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : causes [선행사] + (that/which) [목적격 관계대명사 생략] + they support [주어+동사] : \"자신이 지지하는 대의명분\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : , [콤마] + ensuring [현재분사] : \"반드시 ~하게 하다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Ethical content creators, 윤리적인 콘텐츠 제작자들은. not only focus on promoting, 홍보하는 데만 초점을 맞추는 것이 아니라. their products or services, 자신의 제품이나 서비스를. but also consider, 고려하며. the values and causes they support, 자신이 지지하는 가치와 대의명분도. ensuring that their content aligns, 자신의 콘텐츠가 반드시 일치하게 한다. with their social and environmental principles, 자신의 사회적 그리고 환경적 원칙과.. 이 문장 전체를 해석하면, 윤리적인 콘텐츠 제작자들은 자신의 제품이나 서비스를 홍보하는 데만 초점을 맞추는 것이 아니라, 자신이 지지하는 가치와 대의명분도 고려하며, 자신의 콘텐츠가 자신의 사회적 그리고 환경적 원칙과 반드시 일치하게 한다.","hl":"m"},{"n":28,"text":"이 글의 최종 결론을 맺는 아주 중요한 문장입니다. 진정으로 윤리적인 크리에이터라면 단지 물건을 팔아서 돈을 버는 데 그치지 않고, 자신이 굳게 믿는 가치와 원칙을 콘텐츠 속에 그대로 담아내야 한다는 점을 깔끔하게 요약해주고 있어요.","hl":"mn"},{"n":29,"text":"어법 살펴볼게요. 첫 번째로 아주 유명한 not only A but also B 구문이 쓰였죠. A자리에 focus on이라는 동사구가, B자리에 consider라는 동사구가 형태를 맞춰서 잘 병렬 연결되어 있습니다. 두 번째로 causes와 they support 사이에는 목적격 관계대명사가 생략되어서 뒤의 문장이 앞의 명사를 꾸며주게 됩니다. 세 번째로 콤마 뒤에 나오는 ensuring은 현재분사로 쓰인 분사구문인데요, 문장을 자연스럽게 이어주면서 그리고 반드시 일치하게 만든다는 연속적인 동작이나 결과를 나타내고 있어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>1. 현대 사회에서 환경 및 지속가능성 문제에 대한 전 세계적인 \u003cb class=\"key\">인식\u003c/b>이 커지고 있습니다.\u003c/li>\u003cli>2. 이에 따라 콘텐츠 제작자들에게 사회적, 환경적 \u003cb class=\"key\">책임\u003c/b>이 중요한 윤리적 고려 사항이 되었습니다.\u003c/li>\u003cli>3. 제작자들은 대중에게 영향을 미치는 자신의 플랫폼을 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 위해 사용할 책임이 있습니다.\u003c/li>\u003cli>4. 진정한 윤리적 제작자는 자신의 콘텐츠가 지지하는 가치와 사회적 \u003cb class=\"key\">원칙\u003c/b>에 일치하도록 해야 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Content creators have an ethical responsibility to use their influential platforms to drive positive social and environmental change.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">콘텐츠 제작자들은 자신의 플랫폼이 미치는 \u003cb class=\"key\">영향력\u003c/b>을 인식하고, 긍정적인 사회적 및 환경적 변화를 이끌어 내기 위해 \u003cb class=\"key\">윤리적 \u003c/b>\u003cb class=\"key\">책임\u003c/b>을 다해야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"자, 이렇게 해서 콘텐츠 제작자들의 막중한 윤리적 책임을 다룬 지문을 모두 분석해 보았습니다. 큰 영향력을 가진 만큼, 선한 목적을 위해 그 힘을 사용해야 한다는 필자의 메시지가 잘 와닿으셨나요? 복습하실 때 제가 짚어드린 핵심 어휘와 글의 논리 구조를 다시 한번 꼭 확인해 보시기 바랍니다. 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
