<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026년 고2 10모 34번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 34번","audioDir":"34_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">34번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>The Hidden Danger of a Hyper-Connected World\u003c/h1>\u003ch2>초연결 세계의 숨겨진 위험성\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>과거와 달리 현대 사회는 정보 기술 발달로 인한 깊은 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">연결성\u003c/b>을 띠고 있으며, 이로 인해 작은 실패가 즉각적으로 확산되는 새로운 \u003cb class=\"key\">취약성\u003c/b>을 지니게 되었습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Interconnectedness driven by information technology has made our modern systems highly vulnerable to complex, unpredictable failures.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 함께 살펴볼 지문은 정보 기술로 촘촘하게 엮인 현대 사회의 모습을 다루고 있습니다. 이 글의 제목을 붙인다면 초연결 세계의 숨겨진 위험성이라고 할 수 있겠네요. 요약하자면, 과거와 달리 현대 사회는 정보 기술 발달로 인한 깊은 상호 연결성을 띠고 있으며, 이로 인해 작은 실패가 즉각적으로 확산되는 새로운 취약성을 지니게 되었다는 내용입니다. 이 지문의 요지는 기술이 이끈 상호 연결성이 우리 사회를 복합적이고 예측하기 힘든 실패에 취약하게 만들었다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">현대 사회는 인터넷과 통신망의 발달로 모든 것이 촘촘히 연결된 \u003cb class=\"key\">초연결 \u003c/b>\u003cb class=\"key\">사회(Hyper-connected \u003c/b>\u003cb class=\"key\">society)\u003c/b>입니다. 과거에는 한 동네에 전기가 끊겨도 다른 동네는 멀쩡한 것처럼, 기관들이 서로 분리되어 있어 외부의 영향으로부터 \u003cb class=\"key\">보호(buffered)\u003c/b>받았습니다. 하지만 지금은 마치 도미노 게임처럼 한 곳이 무너지면 연쇄적으로 무너지는 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">의존성(interdependence)\u003c/b>을 가집니다. 예를 들어, 지구 반대편의 작은 은행 오류가 전 세계 주식 시장을 폭락하게 만들 수 있죠. 이렇게 시스템이 복잡하게 얽혀 있을수록 작은 실수가 큰 재앙으로 번지는 \u003cb class=\"key\">복합적 \u003c/b>\u003cb class=\"key\">실패(complex \u003c/b>\u003cb class=\"key\">failure)\u003c/b>의 위험이 커지게 됩니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 조금 쌓고 갈까요? 현대 사회는 인터넷과 통신망의 발달로 모든 것이 촘촘히 연결된 초연결 사회입니다. 영어로는 Hyper-connected society라고 하죠. 과거에는 한 동네에 전기가 끊겨도 다른 동네는 멀쩡한 것처럼, 기관들이 서로 분리되어 있어 외부의 영향으로부터 보호받았습니다. 하지만 지금은 마치 도미노 게임처럼 한 곳이 무너지면 연쇄적으로 무너지는 상호 의존성을 가집니다. 예를 들어, 지구 반대편의 작은 은행 오류가 전 세계 주식 시장을 폭락하게 만들 수 있죠. 이렇게 시스템이 복잡하게 얽혀 있을수록 작은 실수가 큰 재앙으로 번지는 복합적 실패의 위험이 커지게 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>현상 도입\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>소셜 미디어와 세계 금융 산업의 사례를 통해 현대 사회가 얼마나 깊게 연결되어 있는지 보여줍니다. 이런 연결성은 우리를 지구 반대편의 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">오류\u003c/b>에도 취약하게 만듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>과거와 현재\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>전략학 교수의 말을 인용하여, 과거에는 기관들이 서로 \u003cb class=\"key\">분리\u003c/b>되어 있어 외부 오류로부터 보호받았음을 설명합니다. 하지만 지금은 상황이 완전히 \u003cb class=\"key\">역전\u003c/b>되었다고 선언합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>변화의 원인\u003csmall>원인 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>컴퓨팅 비용 감소에 따른 \u003cb class=\"key\">디지털화\u003c/b>와 자율적으로 소통하는 스마트 시스템의 발달이 이러한 변화를 이끌었습니다. 이는 무한히 다양한 \u003cb class=\"key\">잠재적 \u003c/b>\u003cb class=\"key\">고장\u003c/b>의 원인이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>연결성과 취약성\u003csmall>주장 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>현대 시스템의 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">의존성\u003c/b>은 복합적 실패의 온상입니다. 서로 부딪치는 환경에서는 예측이 어렵고, \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">연결성\u003c/b>이 작은 실패를 즉각적으로 확산시켜 새로운 \u003cb class=\"key\">취약성\u003c/b>을 만들어냅니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 현상 도입부터 원인 분석, 그리고 최종적인 결과까지 논리적으로 매끄럽게 이어집니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 소셜 미디어와 세계 금융 산업의 사례를 통해 현대 사회가 얼마나 깊게 연결되어 있는지 보여줍니다. 이런 연결성은 우리를 지구 반대편의 인간의 오류에도 취약하게 만든다고 이야기하죠.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장에서는 전략학 교수의 말을 빌려, 과거에는 기관들이 서로 분리되어 있어 외부 오류로부터 보호받았음을 설명합니다. 하지만 지금은 상황이 완전히 역전되었다고 딱 잘라 선언합니다.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장에서는 왜 이런 변화가 생겼는지 원인을 말해줍니다. 컴퓨팅 비용 감소에 따른 디지털화와 자율적으로 소통하는 스마트 시스템의 발달이 그 주인공이죠. 이는 무한히 다양한 잠재적 고장의 원인이 됩니다.","hl":"f2"},{"n":7,"text":"일곱 번째 문장부터 마지막 아홉 번째 문장까지는 이 글의 핵심을 말합니다. 현대 시스템의 상호 의존성은 복합적 실패의 온상이라고 강조하죠. 서로 부딪치는 환경에서는 예측이 어렵고, 상호 연결성이 작은 실패를 즉각적으로 확산시켜 새로운 취약성을 만들어낸다는 결론을 내립니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">과거의 '분리된 상태'와 현재의 '연결된 상태'를 \u003cb class=\"key\">비교·대조\u003c/b>하여 글을 전개하고 있습니다. 기술의 발달이 가져온 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">연결성\u003c/b>이라는 원인이 어떻게 새로운 취약성이라는 \u003cb class=\"key\">결과\u003c/b>를 낳는지를 명확히 보여줍니다. 글의 후반부인 마지막 문장에 핵심 주장인 주제문이 등장하는 \u003cb class=\"key\">미괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>years ago (3)\u003c/b>\u003cspan>대조의 기준점 (과거)\u003c/span>\u003cb>That is no longer the case. (4)\u003c/b>\u003cspan>상황의 반전 및 전환\u003c/span>\u003cb>because (9)\u003c/b>\u003cspan>원인과 결과의 논리 연결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">links\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">communicate autonomously\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">interdependence\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">bump up against each other\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">interconnectedness\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>과거 (Years ago)\u003c/th>\u003cth>현재 (Now)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>기관들이 서로 분리됨 (separate)\u003c/td>\u003ctd>스마트 시스템이 자율적으로 소통함 (communicate autonomously)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>외부 오류의 영향으로부터 보호됨 (buffered)\u003c/td>\u003ctd>상호 의존성으로 인해 잠재적 고장 발생 (breakdowns)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>독립적 유지 (kept separate)\u003c/td>\u003ctd>작은 실패의 즉각적 확산 (spreads the impact of small failures)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 과거의 분리된 상태와 현재의 연결된 상태를 비교 대조하며 이야기를 전개하고 있어요. 그리고 기술 발달이 가져온 상호 연결성이 어떻게 새로운 취약성이라는 결과를 낳았는지 인과관계로 잘 보여주죠. 필자의 핵심 주장이 가장 마지막 문장에 명확히 등장하는 전형적인 미괄식 구조입니다.","hl":"ty"},{"n":9,"text":"흐름을 잡아주는 신호어들을 볼까요? 세 번째 문장의 years ago를 통해 과거의 기준점을 잡고, 네 번째 문장에서 That is no longer the case라며 상황을 반전시킵니다. 그리고 아홉 번째 문장의 because를 통해 원인과 결과의 논리를 단단하게 묶어주고 있죠. 이 글에서는 links, communicate autonomously, interdependence, interconnectedness 같은 단어들이 모두 상호 연결성이라는 하나의 개념을 다양하게 표현하며 이어지고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>alter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>변화시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>go viral\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>입소문이 나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>household\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일상적인, 가정의\u003c/span>\u003c/div>\u003cdiv>\u003cb>link\u003c/b>\u003cem>동사\u003c/em>\u003cspan>연결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vulnerable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>취약한\u003c/span>\u003c/div>\u003cdiv>\u003cb>error\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오류\u003c/span>\u003c/div>\u003cdiv>\u003cb>take place\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>institution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기관\u003c/span>\u003c/div>\u003cdiv>\u003cb>separate\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>분리된\u003c/span>\u003c/div>\u003cdiv>\u003cb>buffer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보호하다, 완충 작용을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>digitization\u003c/b>\u003cem>명사\u003c/em>\u003cspan>디지털화\u003c/span>\u003c/div>\u003cdiv>\u003cb>massive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>방대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>computing power\u003c/b>\u003cem>명사\u003c/em>\u003cspan>컴퓨팅 능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>autonomously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자율적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>give rise to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 초래하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>infinite\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>무한한\u003c/span>\u003c/div>\u003cdiv>\u003cb>potential\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잠재적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>breakdown\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고장, 붕괴\u003c/span>\u003c/div>\u003cdiv>\u003cb>interdependence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상호 의존성\u003c/span>\u003c/div>\u003cdiv>\u003cb>breeding ground\u003c/b>\u003cem>명사\u003c/em>\u003cspan>온상\u003c/span>\u003c/div>\u003cdiv>\u003cb>complex\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>복합적인, 복잡한\u003c/span>\u003c/div>\u003cdiv>\u003cb>failure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실패\u003c/span>\u003c/div>\u003cdiv>\u003cb>bump up against\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 부딪치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>predict\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예측하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vulnerability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>취약성\u003c/span>\u003c/div>\u003cdiv>\u003cb>interconnectedness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상호 연결성\u003c/span>\u003c/div>\u003cdiv>\u003cb>instantly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>즉각적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>impact\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영향\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문에서 눈여겨봐야 할 단어들을 짚어볼게요. vulnerable은 취약한이라는 뜻으로 이 글의 핵심어입니다. buffered는 완충 작용을 하다, 보호하다라는 뜻으로 쓰였고, interdependence는 상호 의존성을 의미합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">alter\u003c/b>\u003cspan class=\"m\">변화시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">change\u003c/span>\u003cspan class=\"s\">modify\u003c/span>\u003cspan class=\"s\">transform\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">maintain\u003c/span>\u003cspan class=\"a\">preserve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">vulnerable\u003c/b>\u003cspan class=\"m\">취약한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">susceptible\u003c/span>\u003cspan class=\"s\">weak\u003c/span>\u003cspan class=\"s\">exposed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">invulnerable\u003c/span>\u003cspan class=\"a\">immune\u003c/span>\u003cspan class=\"a\">secure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">separate\u003c/b>\u003cspan class=\"m\">분리된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">divided\u003c/span>\u003cspan class=\"s\">isolated\u003c/span>\u003cspan class=\"s\">detached\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">connected\u003c/span>\u003cspan class=\"a\">joined\u003c/span>\u003cspan class=\"a\">united\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">autonomously\u003c/b>\u003cspan class=\"m\">자율적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">independently\u003c/span>\u003cspan class=\"s\">spontaneously\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dependently\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">interdependence\u003c/b>\u003cspan class=\"m\">상호 의존성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mutualism\u003c/span>\u003cspan class=\"s\">interconnection\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">independence\u003c/span>\u003cspan class=\"a\">isolation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">predict\u003c/b>\u003cspan class=\"m\">예측하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">foresee\u003c/span>\u003cspan class=\"s\">forecast\u003c/span>\u003cspan class=\"s\">anticipate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">instantly\u003c/b>\u003cspan class=\"m\">즉각적으로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">immediately\u003c/span>\u003cspan class=\"s\">promptly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gradually\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 챙겨야죠! alter는 변화시키다라는 뜻인데, change나 modify로 바꿔 쓸 수 있어요. 반대로 유지하다라는 뜻의 maintain을 쓰면 틀리겠죠. vulnerable의 동의어로는 susceptible, weak가 있고, 반의어로는 안전하다는 느낌의 secure나 immune을 쓸 수 있습니다. separate는 분리된이라는 뜻이죠? divided나 isolated와 통하지만, connected로 바뀌어 나오면 반대말이 되니 조심하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소셜 미디어는 비즈니스, 정치, 친목을 변화시켰으며,\u003c/span>\u003cspan class=\"en\">Social media \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">altered\u003c/span> business, politics, and friendships\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘입소문이 나는 것’을 만들었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">viral \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상적인 용어로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">household \u003c/span>\u003cspan class=\"tgt\">term\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">소셜 미디어는 비즈니스, 정치, 친목을 변화시켰으며, ‘입소문이 나다’를 일상적인 용어로 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 현대 사회에서 \u003cb class=\"key\">소셜 \u003c/b>\u003cb class=\"key\">미디어\u003c/b>가 우리 삶의 여러 영역을 어떻게 변화시켰는지 도입부로 제시합니다. 특히 특정 정보가 순식간에 퍼지는 \u003cb class=\"key\">입소문 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이 이제는 흔한 일상이 되었다는 점을 강조하여, 앞으로 전개될 \u003cb class=\"key\">상호연결성\u003c/b>에 대한 글의 배경을 깔아줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료\u003c/span> : have/has + p.p. : \"변화시켰으며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (결과)\u003c/span> : , + V-ing : \"만들었다(만들면서)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">5형식 구조 (make + 목적어 + 목적격 보어)\u003c/span> : make [타동사] + [going viral (목적어/동명사구)] + [a household term (목적격 보어/명사)] : \"‘입소문이 나는 것’을 일상적인 용어로 만들다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Social media has altered business, politics, and friendships, 소셜 미디어는 비즈니스, 정치, 친목을 변화시켰으며. making going viral, ‘입소문이 나는 것’을 만들었다. a household term, 일상적인 용어로.. 이 문장 전체를 해석하면, 소셜 미디어는 비즈니스, 정치, 친목을 변화시켰으며, ‘입소문이 나다’를 일상적인 용어로 만들었다.","hl":"m"},{"n":13,"text":"이 문장은 현대 사회에서 소셜 미디어가 우리 삶을 어떻게 변화시켰는지를 보여주는 도입부예요. 특히 어떤 정보가 순식간에 퍼져나가는 입소문 현상이 이제는 아주 흔한 일상이 되었다는 점을 강조하죠. 앞으로 전개될 상호연결성에 대한 글의 배경을 든든하게 깔아주고 있어요.","hl":"mn"},{"n":14,"text":"어법 포인트 짚어볼게요. 첫 번째, has altered는 과거부터 지금까지 쭈욱 영향을 미치고 있다는 뜻의 현재완료 시제예요. 두 번째, 콤마 뒤에 나온 making은 앞 문장의 결과를 자연스럽게 이어주는 분사구문입니다. and it makes로 바꿔 쓸 수도 있죠. 세 번째, making 뒤를 잘 보세요. making은 5형식 동사라서 going viral이라는 동명사구 목적어를 취하고, 그 뒤에 a household term이라는 명사를 목적격 보어로 데리고 왔어요. 구조가 한눈에 들어와야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계 금융 산업은 연결한다\u003c/span>\u003cspan class=\"en\">The global financial industry links\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전 세계 각국의 모든 은행과 수많은 가정을,\u003c/span>\u003cspan class=\"en\">every bank and countless households in every country\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 취약해지게 만들면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003cspan class=\"tgt\">vulnerable\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 오류에\u003c/span>\u003cspan class=\"en\">to human \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">error \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세계의 다른 곳에서 발생하는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">place\u003c/span> on the other side of the world.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">세계 금융 산업은 모든 은행과 전 세계 각국의 수많은 가정을 연결하여, 우리를 세계의 다른 곳에서 발생한 인간의 오류에 취약해지게 만들었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 번째 문장의 소셜 미디어에 이어, 이번에는 \u003cb class=\"key\">세계 \u003c/b>\u003cb class=\"key\">금융 \u003c/b>\u003cb class=\"key\">산업\u003c/b>을 예로 들어 전 세계가 얼마나 촘촘하게 \u003cb class=\"key\">연결\u003c/b>되어 있는지 설명합니다. 이렇게 고도로 연결된 시스템 때문에 지구 반대편의 작은 \u003cb class=\"key\">오류\u003c/b> 하나가 우리에게도 직접적인 피해를 줄 수 있다는 점을 경고하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (결과)\u003c/span> : , + V-ing : \"~하여 만들었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 구조 (make + 목적어 + 목적격 보어)\u003c/span> : make [타동사] + [us (목적어)] + [vulnerable (목적격 보어/형용사)] : \"우리를 취약해지게 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사의 명사 후치 수식\u003c/span> : 명사 + V-ing : \"발생하는 오류\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"The global financial industry links, 세계 금융 산업은 연결한다. every bank and countless households in every country, 전 세계 각국의 모든 은행과 수많은 가정을. making us vulnerable, 우리를 취약해지게 만들면서. to human error, 인간의 오류에. taking place on the other side of the world, 세계의 다른 곳에서 발생하는.. 이 문장 전체를 해석하면, 세계 금융 산업은 모든 은행과 전 세계 각국의 수많은 가정을 연결하여, 우리를 세계의 다른 곳에서 발생한 인간의 오류에 취약해지게 만들었다.","hl":"m"},{"n":16,"text":"앞서 소셜 미디어 이야기를 했죠? 이번에는 세계 금융 산업을 예로 들어 전 세계가 얼마나 촘촘하게 연결되어 있는지 보여주는 문장이에요. 이렇게 고도로 연결된 시스템 때문에 지구 반대편에서 누군가 한 작은 실수나 오류 하나가 우리에게도 곧바로 피해를 줄 수 있다는 무서운 사실을 경고하고 있답니다.","hl":"mn"},{"n":17,"text":"어법 세 가지 확인해 볼게요. 첫 번째, 콤마 뒤의 making은 앞의 내용을 받아서 그 결과가 어떠한지 보여주는 분사구문이에요. 자연스럽게 이어서 해석하면 됩니다. 두 번째, 이 making은 5형식 동사로 쓰였어요. 그래서 목적어 us 뒤에 부사가 아니라 형용사인 vulnerable이 목적격 보어로 와야 한다는 점, 시험에 자주 나오니 꼭 기억하세요. 세 번째, human error 뒤에 나온 taking place는 명사인 오류를 뒤에서 꾸며주는 현재분사구예요. 발생하는 오류라고 해석하시면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Columbia University 전략학 교수 Rita McGrath가 설명하듯이,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As\u003c/span> Columbia University strategy professor Rita McGrath explains,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수년 전 우리의 기관들 중 대부분은 분리되어 있었고\u003c/span>\u003cspan class=\"en\">years ago most of our institutions \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">separate \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서 보호되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">thereby \u003c/span>\u003cspan class=\"tgt\">buffered\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들의 장벽 밖에 있는 오류들의 영향으로부터.\u003c/span>\u003cspan class=\"en\">from the effects of errors outside their walls.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Columbia University 전략학 교수 Rita McGrath가 설명하듯이, 수년 전 우리의 기관들 중 대부분은 서로 분리되어 있었고, 따라서 그것들의 장벽 밖에 있는 오류들의 영향으로부터 보호되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전문가의 입을 빌려 과거의 상황을 설명하며 현재와의 \u003cb class=\"key\">대비\u003c/b>를 이끌어내는 문장입니다. 과거에는 기관들이 서로 \u003cb class=\"key\">분리\u003c/b>되어 있었기 때문에, 외부에서 문제가 생겨도 마치 장벽이 있는 것처럼 그 \u003cb class=\"key\">영향\u003c/b>으로부터 안전하게 보호받았다는 점을 말하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 (양태)\u003c/span> : As + S + V : \"~가 설명하듯이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">보어 병렬 구조 및 수동태\u003c/span> : be동사 + [보어1(형용사)] + and + [보어2(과거분사)] : \"분리되어 있었고 따라서 보호되었다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"As Columbia University strategy professor Rita McGrath explains, Columbia University 전략학 교수 Rita McGrath가 설명하듯이. years ago most of our institutions were separate, 수년 전 우리의 기관들 중 대부분은 분리되어 있었고. and thereby buffered, 따라서 보호되었다. from the effects of errors outside their walls, 그것들의 장벽 밖에 있는 오류들의 영향으로부터.. 이 문장 전체를 해석하면, Columbia University 전략학 교수 Rita McGrath가 설명하듯이, 수년 전 우리의 기관들 중 대부분은 서로 분리되어 있었고, 따라서 그것들의 장벽 밖에 있는 오류들의 영향으로부터 보호되었다.","hl":"m"},{"n":19,"text":"이 문장은 전문가의 말을 인용해서 과거의 상황을 보여주고 있어요. 앞으로 나올 현재의 모습과 대비를 이루기 위해서죠. 옛날에는 기관들이 다 따로따로 분리되어 있었기 때문에, 외부에서 어떤 오류가 터져도 그 영향이 안으로 들어오지 못하게 안전하게 보호받았다는 이야기를 하고 있습니다.","hl":"mn"},{"n":20,"text":"어법 포인트 두 개 짚고 넘어갈게요. 첫 번째로 쓰인 As는 뒤에 주어 동사가 오는 접속사로, 여기서 주어가 동사 하듯이 라는 뜻으로 해석해 주면 아주 매끄럽습니다. 두 번째로, were 뒤에 형용사 separate와 부사 thereby를 지나서 나오는 과거분사 buffered가 접속사 and로 연결되어 있어요. 분리되어 있었고, 그래서 보호받았다는 뜻의 병렬 구조이자 수동태 형태라는 점 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은\u003c/span>\u003cspan class=\"en\">That is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 이상 ~아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">longer \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇지 (사실이)\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">case.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">더 이상은 그렇지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거에는 기관들이 분리되어 오류로부터 보호받았지만, 이제는 그런 시대가 끝났다는 선언입니다. 앞 문장의 내용을 받아 상황의 반전을 보여주며 \u003cb class=\"key\">상호의존성\u003c/b>에 대한 논의로 넘어가는 다리 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용표현\u003c/span> : be + no longer the case : \"더 이상 그렇지 않다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"That is, 그것은. no longer, 더 이상 ~아니다. the case, 그렇지 (사실이). 이 문장 전체를 해석하면, 더 이상은 그렇지 않다.","hl":"m"},{"n":22,"text":"과거에는 기관들이 서로 분리되어 외부의 오류로부터 보호받았지만, 이제는 그런 시대가 끝났다는 짧고 강렬한 선언이에요. 앞 문장의 내용을 싹 뒤집으면서 오늘날의 복잡하게 얽힌 세상을 설명하기 위해 분위기를 전환하고 있죠.","hl":"mn"},{"n":23,"text":"이 문장에서는 no longer the case라는 표현을 짚고 넘어갈게요. 여기서 the case는 어떠한 사실이나 진실을 뜻해요. 그래서 no longer the case라고 하면 더 이상 그렇지 않음, 즉 과거와 상황이 완전히 달라졌다는 것을 분명하게 나타내는 유용한 표현이랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~의 디지털화는\u003c/span>\u003cspan class=\"en\">The digitization of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방대한 양의 정보의\u003c/span>\u003cspan class=\"en\">massive amounts of information\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계속해서 엄청나게 증가해 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">continued\u003c/span> to grow enormously\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">컴퓨팅 능력의 비용이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cost \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">computing \u003c/span>\u003cspan class=\"tgt\">power \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감소함에 따라.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">decreased.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">컴퓨팅 능력의 비용이 감소함에 따라 방대한 양의 정보의 디지털화는 계속해서 엄청나게 증가해 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 정보의 디지털화가 폭발적으로 증가한 원인이 컴퓨팅 비용의 감소에 있음을 설명합니다. 이로 인해 세상의 시스템들이 더욱 복잡하게 얽히게 되었다는 \u003cb class=\"key\">상호의존성\u003c/b>의 기술적 배경을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 시제\u003c/span> : have/has + p.p. : \"계속해서 ~해 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 as (비례)\u003c/span> : as + S + V : \"~함에 따라\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The digitization of, ~의 디지털화는. massive amounts of information, 방대한 양의 정보의. has continued to grow enormously, 계속해서 엄청나게 증가해 왔다. as the cost of computing power, 컴퓨팅 능력의 비용이. has decreased, 감소함에 따라.. 이 문장 전체를 해석하면, 컴퓨팅 능력의 비용이 감소함에 따라 방대한 양의 정보의 디지털화는 계속해서 엄청나게 증가해 왔다.","hl":"m"},{"n":25,"text":"우리가 다루는 정보가 어떻게 이렇게 방대하게 디지털로 바뀌었는지 그 이유를 설명하는 문장이에요. 컴퓨터를 굴리는 비용이 저렴해지면서 모든 것이 빠르게 디지털화되었고, 이것이 세상이 촘촘하게 연결되는 기반이 되었다는 흐름을 보여줍니다.","hl":"mn"},{"n":26,"text":"첫 번째로 has continued를 볼게요. 과거부터 지금까지 계속해서 증가해 왔다는 동작의 계속을 보여주기 위해 현재완료 시제를 썼습니다. 두 번째로 접속사 as를 볼까요? 여기서 as는 시간의 흐름에 따른 비례, 즉 무엇무엇 함에 따라라는 뜻으로 쓰였어요. 컴퓨팅 비용이 감소함에 따라 디지털화가 증가했다는 두 가지 변화가 맞물려 돌아가는 모습을 아주 잘 보여주는 접속사랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스마트 시스템의 발달은\u003c/span>\u003cspan class=\"en\">The development of smart systems\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자율적으로 소통하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">communicate \u003c/span>\u003cspan class=\"tgt\">autonomously\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~를 초래했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">gave \u003c/span>\u003cspan class=\"tgt\">rise \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무한히 다양한\u003c/span>\u003cspan class=\"en\">an infinite variety of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">잠재적 고장들을.\u003c/span>\u003cspan class=\"en\">potential breakdowns.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장들을 초래했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기계들이 스스로 소통할 정도로 고도화되면서, 오히려 예상치 못한 \u003cb class=\"key\">잠재적 \u003c/b>\u003cb class=\"key\">고장\u003c/b>의 위험도 걷잡을 수 없이 커졌음을 지적합니다. 시스템 간의 완벽한 연결이 가져오는 치명적인 단점을 꼬집고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사절\u003c/span> : 선행사(복수명사) + that [주격 관계대명사] + V(복수형) : \"자율적으로 소통하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구\u003c/span> : give rise to + 명사(구) : \"~를 초래했다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The development of smart systems, 스마트 시스템의 발달은. that communicate autonomously, 자율적으로 소통하는. gave rise to, ~를 초래했다. an infinite variety of, 무한히 다양한. potential breakdowns, 잠재적 고장들을.. 이 문장 전체를 해석하면, 자율적으로 소통하는 스마트 시스템의 발달은 무한히 다양한 잠재적 고장들을 초래했다.","hl":"m"},{"n":28,"text":"사람이 굳이 개입하지 않아도 기계들끼리 알아서 소통하는 스마트 시스템이 발달했잖아요? 그런데 그럴수록 어딘가 하나 삐끗했을 때 고장 날 가능성도 무한히 많아졌다는 뜻이에요. 모든 것이 얽혀있는 복잡한 연결망이 얼마나 큰 위험을 품고 있는지 경고하는 아주 중요한 문장이죠.","hl":"mn"},{"n":29,"text":"첫 번째로 that communicate autonomously를 살펴볼까요? 여기서 that은 주격 관계대명사예요. 앞에 있는 선행사 smart systems를 꾸며주면서 자율적으로 소통하는 시스템이라는 뜻을 만들죠. 선행사가 복수니까 동사도 s를 빼고 복수형 communicate를 썼다는 점 꼭 기억해 두세요. 두 번째로 gave rise to는 무엇무엇을 초래하다, 발생시키다라는 뜻의 핵심 숙어입니다. 문장 전체를 이끌고 가는 진짜 동사 역할을 하고 있으니 형태와 뜻을 정확히 외워 두어야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 상호 의존성은 ~이다\u003c/span>\u003cspan class=\"en\">This interdependence is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온상\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">breeding \u003c/span>\u003cspan class=\"tgt\">ground \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">복합적 실패의.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">complex \u003c/span>\u003cspan class=\"tgt\">failure\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 상호 의존성은 복합적 실패의 온상이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 언급된 스마트 시스템들의 연결이 어떻게 문제를 일으키는지를 요약하는 \u003cb class=\"key\">주제문\u003c/b>입니다. 모든 것이 서로 얽혀 있는 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">의존성\u003c/b>이 결국 걷잡을 수 없는 복잡한 문제를 낳는 \u003cb class=\"key\">근원\u003c/b>이 됨을 강조하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for (목적, 대상)\u003c/span> : 명사구 + [for + 명사 (전치사구/수식어)] : \"복합적 실패를 위한 온상\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"This interdependence is, 이러한 상호 의존성은 ~이다. a breeding ground, 온상. for complex failure, 복합적 실패의.. 이 문장 전체를 해석하면, 이러한 상호 의존성은 복합적 실패의 온상이다.","hl":"m"},{"n":31,"text":"이 문장은 지문의 핵심을 관통하는 아주 중요한 주제문이에요. 모든 것이 서로 얽혀 있는 상호 의존성이 결국 걷잡을 수 없는 복잡한 문제를 낳는 근원이 됨을 콕 집어 설명하고 있죠.","hl":"mn"},{"n":32,"text":"이 문장은 구조가 아주 단순해요. 주어, 동사, 보어로 이루어져 있죠. 여기서 눈여겨볼 부분은 첫 번째로 a breeding ground for complex failure입니다. 전치사 for가 쓰여서 뒤에 나오는 복합적 실패가 자라나는 대상이나 목적이 됨을 나타내어 온상이라는 비유적 의미를 아주 자연스럽게 완성해 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Rita가 말하듯,\u003c/span>\u003cspan class=\"en\">As Rita puts it,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘분리되어 있던 것들이\u003c/span>\u003cspan class=\"en\">when &quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">used \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">kept \u003c/span>\u003cspan class=\"tgt\">separate\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로 부딪치게 될 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">bump \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">against \u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">other\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">훨씬 더 어려워진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">becomes \u003c/span>\u003cspan class=\"tgt\">far \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다음에 무슨 일이 일어날지를 예측하는 것은.’\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">predict\u003c/span> \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">what's \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">happen \u003c/span>\u003cspan class=\"tgt\">next\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Rita가 말하듯, ‘분리되어 있던 것들이 서로 부딪치게 될 때, 다음에 무슨 일이 일어날지를 예측하는 것은 훨씬 더 어려워진다.’\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전문가의 말을 인용하여 앞 문장의 주장을 \u003cb class=\"key\">뒷받침\u003c/b>하고 있습니다. 과거에는 독립적이어서 안전했던 것들이 하나로 \u003cb class=\"key\">연결\u003c/b>되면서, 문제의 파급력을 \u003cb class=\"key\">예측하기 \u003c/b>\u003cb class=\"key\">어려워졌다\u003c/b>는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사절과 used to\u003c/span> : things (선행사) + [that (주관대) + used to be + p.p (동사구)] : \"분리되어 있던 것들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">시간의 부사절 속 동사 일치\u003c/span> : when + [things (복수 주어) + ... + bump up (복수 동사)] : \"서로 부딪치게 되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">가주어·진주어와 비교급 강조\u003c/span> : it (가주어) + becomes + [far (비교급 강조) + more difficult (보어)] + [to predict (진주어)] : \"예측하는 것은 훨씬 더 어려워진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">간접의문문 (명사절)\u003c/span> : predict [타동사] + [what (의문사/주어) + is going to happen (동사구)] : \"다음에 무슨 일이 일어날지를\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"As Rita puts it, Rita가 말하듯. when \"things that used to be kept separate, ‘분리되어 있던 것들이. bump up against each other, 서로 부딪치게 될 때. it becomes far more difficult, 훨씬 더 어려워진다. to predict what's going to happen next.\", 다음에 무슨 일이 일어날지를 예측하는 것은.’. 이 문장 전체를 해석하면, Rita가 말하듯, ‘분리되어 있던 것들이 서로 부딪치게 될 때, 다음에 무슨 일이 일어날지를 예측하는 것은 훨씬 더 어려워진다.’","hl":"m"},{"n":34,"text":"이 문장은 전문가의 말을 인용해서 앞서 한 주장을 단단하게 뒷받침하고 있어요. 과거에는 독립적이어서 안전했던 것들이 하나로 연결되면서, 문제의 파급력을 예측하기 어려워졌다는 점을 다시 한번 강조하는 거죠.","hl":"mn"},{"n":35,"text":"이 문장은 서술형으로도 나오기 딱 좋은 핵심 어법들이 가득해요. 첫 번째로 things that used to be kept separate를 볼게요. 선행사 things를 수식하는 주격 관계대명사 that 뒤에 과거의 상태를 나타내는 used to와 수동태 be kept가 결합되어서 과거에는 분리된 상태로 유지되었음을 보여줍니다. 두 번째로 bump up against each other 인데요. 접속사 when이 이끄는 부사절의 본동사로 쓰여서 복수 주어인 things에 맞춰 복수형 동사 bump가 온 것을 확인하셔야 해요. 세 번째는 it becomes far more difficult to predict 입니다. 주어가 너무 길어지는 걸 막기 위해 가주어 it을 맨 앞에 쓰고 진주어 to부정사구를 뒤로 보냈어요. 게다가 부사 far가 비교급을 수식하면서 그 의미를 강조해 주고 있죠. 마지막 네 번째로 what's going to happen next 부분은 동사 predict의 목적어 역할을 하는 명사절이에요. 여기서 의문대명사 what이 절 안에서 주어 역할까지 동시에 찰떡같이 수행하고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정보 기술은 만들어 내는데,\u003c/span>\u003cspan class=\"en\">Information technology \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">creates \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 취약성을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">vulnerabilities \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 상호 연결성이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">interconnectedness \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉각적으로 확산시키기 때문이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">instantly \u003c/span>\u003cspan class=\"tgt\">spreads\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 실패들의 영향을.\u003c/span>\u003cspan class=\"en\">the impact of small failures.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">정보 기술은 새로운 취약성을 만들어 내는데, 왜냐하면 상호 연결성이 작은 실패들의 영향을 즉각적으로 확산시키기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 \u003cb class=\"key\">최종 \u003c/b>\u003cb class=\"key\">결론\u003c/b>을 내리는 문장입니다. 작은 실수가 정보 기술의 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">연결성\u003c/b>을 타고 눈덩이처럼 커져서, 전체 시스템에 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">위험\u003c/b>을 불러일으킨다는 핵심 요지를 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유의 부사절 접속사\u003c/span> : 주절 + [because (접속사) + S + V + O] : \"상호 연결성이 즉각적으로 확산시키기 때문에 취약성을 만들어 낸다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Information technology creates, 정보 기술은 만들어 내는데. new vulnerabilities, 새로운 취약성을. because interconnectedness, 왜냐하면 상호 연결성이. instantly spreads, 즉각적으로 확산시키기 때문이다. the impact of small failures, 작은 실패들의 영향을.. 이 문장 전체를 해석하면, 정보 기술은 새로운 취약성을 만들어 내는데, 왜냐하면 상호 연결성이 작은 실패들의 영향을 즉각적으로 확산시키기 때문이다.","hl":"m"},{"n":37,"text":"이 지문의 대미를 장식하는 최종 결론 문장이에요. 작은 실수가 정보 기술의 강력한 상호 연결성을 타고 순식간에 눈덩이처럼 커져서, 전체 시스템에 새로운 위험을 불러일으킨다는 핵심 요지를 완벽하게 정리해 주고 있죠.","hl":"mn"},{"n":38,"text":"이 문장은 문법적으로 크게 복잡하진 않아요. 핵심 포인트 하나만 짚고 갈게요. creates new vulnerabilities because interconnectedness instantly spreads 부분을 보면, 접속사 because가 뒤에 완전한 문장을 이끌고 오고 있어요. 그래서 정보 기술이 왜 새로운 취약성을 만들어 내는 지 그 원인이나 논리적 근거를 명확하게 연결해 주는 역할을 한답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>소셜 미디어와 금융 산업은 전 세계를 연결하여 우리를 세계 반대편의 \u003cb class=\"key\">오류\u003c/b>에 취약하게 만들었습니다.\u003c/li>\u003cli>과거에는 기관들이 서로 \u003cb class=\"key\">분리\u003c/b>되어 외부의 충격으로부터 잘 보호되었습니다.\u003c/li>\u003cli>하지만 지금은 기술 발달로 인해 스마트 시스템이 자율적으로 소통하며 거대한 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">의존성\u003c/b>을 형성했습니다.\u003c/li>\u003cli>이로 인해 분리되어 있던 것들이 충돌하며, 작은 실패가 즉각 확산되는 새로운 \u003cb class=\"key\">취약성\u003c/b>이 생겨났습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Interconnectedness driven by information technology has made our modern systems highly vulnerable to complex, unpredictable failures.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">과거와 달리 현대 사회는 정보 기술 발달로 인한 깊은 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">연결성\u003c/b>을 띠고 있으며, 이로 인해 작은 실패가 즉각적으로 확산되는 새로운 \u003cb class=\"key\">취약성\u003c/b>을 지니게 되었습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"자, 이렇게 해서 지문의 모든 구조와 내용을 꼼꼼하게 뜯어보았습니다. 과거의 분리와 현재의 연결성, 그리고 그로 인해 발생한 예측 불가능한 취약성이 이 글의 뼈대라는 점 꼭 기억하세요! 복습할 때 동의어와 반의어 체크하는 것도 잊지 마시고요. 다들 수고 많으셨습니다!","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
