</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2026년 고2 10모 37번","audioDir":"2026-10-g2-37_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">37번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2026년 고2 10모\u003c/div>\u003ch1>Reappraisal: The Key to Emotion Regulation and Resilience\u003c/h1>\u003ch2>재평가: 감정 조절과 회복 탄력성의 핵심\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">재평가\u003c/b>는 감정적 상황을 다르게 해석함으로써 부정적 감정을 줄이고 긍정적 감정을 이끌어내어, 궁극적으로 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">건강\u003c/b>과 \u003cb class=\"key\">회복 \u003c/b>\u003cb class=\"key\">탄력성\u003c/b>을 증진시킨다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Reappraisal effectively regulates short-term emotional responses and ultimately builds long-term resilience.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘 우리가 함께 분석할 지문은 감정 조절의 핵심 비결에 대해 이야기하고 있습니다. 이 글의 요약은 재평가는 감정적 상황을 다르게 해석함으로써 부정적 감정을 줄이고 긍정적 감정을 이끌어내어, 궁극적으로 심리적 건강과 회복 탄력성을 증진시킨다는 내용이에요. 영어 요지로는 Reappraisal effectively regulates short-term emotional responses and ultimately builds long-term resilience 라고 할 수 있겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인지 행동 심리학에서 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">재평가\u003c/b>(Cognitive Reappraisal)는 부정적인 감정을 유발하는 상황에 대해 새로운 관점을 부여하여 감정을 조절하는 방법입니다. 예를 들어, 비가 오는 날을 '소풍을 망친 날'로 볼 수도 있지만, '오랜만에 집에서 푹 쉴 수 있는 핑계가 생긴 날'로 생각할 수도 있죠. 이렇게 상황에 대한 \u003cb class=\"key\">해석 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 바꾸면, 우리가 느끼는 감정도 근본적으로 변화하게 됩니다. 이러한 긍정적인 감정 조절의 경험이 쌓이면, 역경을 딛고 일어설 수 있는 마음의 근력인 \u003cb class=\"key\">회복 \u003c/b>\u003cb class=\"key\">탄력성\u003c/b>(Resilience)이 길러집니다.\u003c/div>","segs":[{"n":2,"text":"글을 본격적으로 읽기 전에 먼저 배경지식을 조금 쌓고 갈게요. 심리학에는 인지적 재평가, 영어로는 Cognitive Reappraisal 이라는 개념이 있어요. 이건 어떤 부정적인 사건이 일어났을 때, 그 사건에 부여하는 의미나 해석 방식을 바꾸어서 내 감정을 조절하는 방법입니다. 예를 들어 비가 오는 날을 소풍을 망친 우울한 날로 볼 수도 있지만, 오랜만에 집에서 푹 쉴 수 있는 날로 생각할 수도 있잖아요? 이렇게 해석 방식을 바꾸는 훈련이 쌓이면, 웬만한 시련에도 쉽게 무너지지 않는 마음의 근력, 즉 회복 탄력성인 Resilience 가 길러진다는 것이 심리학자들의 공통된 의견입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>개념 및 주제 제시\u003csmall>도입 및 주장 · 문장 1\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">재평가\u003c/b>가 감정을 본질적으로 변화시켜 \u003cb class=\"key\">감정 \u003c/b>\u003cb class=\"key\">조절\u003c/b>에 특히 효과적인 방법을 제공한다는 글의 핵심 개념과 주제를 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>구체적 예시 도입\u003csmall>예시 · 문장 2–5\u003c/small>\u003c/h4>\u003cp>이혼이라는 부정적 사건을 예로 들어, 이를 '강렬한 \u003cb class=\"key\">상실\u003c/b>'로 보는 관점과 긍정적 \u003cb class=\"key\">결과\u003c/b>로 이어질 수 있다고 보는 관점을 대조하여 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>해석에 따른 감정 차이\u003csmall>결과 · 문장 6–9\u003c/small>\u003c/h4>\u003cp>서로 다른 \u003cb class=\"key\">해석\u003c/b>이 어떻게 다른 \u003cb class=\"key\">감정\u003c/b>을 유발하는지 보여줍니다. 재평가가 슬픔과 분노를 줄이고 희망이나 감사 같은 긍정적인 감정을 불러올 수 있음을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>장기적 효과와 결론\u003csmall>결론 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>재평가로 인한 단기적인 \u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>의 변화가 축적되면 궁극적으로 사람들의 심리적 건강을 형성하고, \u003cb class=\"key\">회복 \u003c/b>\u003cb class=\"key\">탄력성\u003c/b>의 핵심 해답이 됨을 결론짓습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 재평가라는 핵심 개념을 먼저 던진 후, 구체적인 예시를 거쳐, 장기적인 효과를 결론으로 도출하는 흐름으로 전개됩니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장에서는 재평가라는 개념을 바로 소개합니다. 재평가가 감정을 본질적으로 변화시켜서 감정 조절에 효과적이라는 글의 핵심 주제를 제시하고 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계인 두 번째 문장부터 다섯 번째 문장까지는 이혼이라는 아주 구체적인 예시가 나옵니다. 이 부정적 사건을 평생의 상실로 볼 것인지, 아니면 장기적으로 더 나은 결과를 위한 과정으로 볼 것인지 대조해서 보여주죠.","hl":"f1"},{"n":6,"text":"세 번째 단계인 여섯 번째 문장부터 아홉 번째 문장에서는 이런 해석의 차이가 어떤 결과를 가져오는지 설명합니다. 단순히 부정적인 사건으로만 보면 강렬한 슬픔이 오지만, 재평가를 거치면 긍정적인 감정까지도 이끌어낼 수 있다는 걸 알려줍니다.","hl":"f2"},{"n":7,"text":"마지막 단계인 열 번째 문장부터 열두 번째 문장까지는 결론을 내립니다. 단기적인 감정적 반응이 쌓이고 쌓이면, 결국 심리적 건강과 회복 탄력성의 핵심이 된다며 글을 훈훈하게 마무리하고 있습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시 및 인과\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">재평가\u003c/b>의 개념과 감정 조절의 효과를 \u003cb class=\"key\">도입\u003c/b>합니다. 이어서 이혼이라는 구체적인 \u003cb class=\"key\">예시\u003c/b>를 통해 두 가지 해석 방식과 그 결과를 대조하며 원리를 설명하고, 마지막으로 이러한 과정이 반복될 때 \u003cb class=\"key\">회복 \u003c/b>\u003cb class=\"key\">탄력성\u003c/b>으로 이어진다는 결론을 내리는 전형적인 양괄식 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Take, for example, (2)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>Alternatively, (5)\u003c/b>\u003cspan>대안적 관점 제시\u003c/span>\u003cb>As a result (6)\u003c/b>\u003cspan>인과 관계 도출\u003c/span>\u003cb>Crucially, (9)\u003c/b>\u003cspan>중요 내용 강조\u003c/span>\u003cb>Thereby, (12)\u003c/b>\u003cspan>최종 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Reappraisal\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">changing the way one thinks about emotional situations\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">construed in different ways\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">different construals\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>첫 번째 해석 (부정적 사건 유지)\u003c/th>\u003cth>두 번째 해석 (재평가)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>평생 흔적을 남길 강렬한 상실\u003c/td>\u003ctd>장기적으로 긍정적 결과를 이끌어낼 일\u003c/td>\u003c/tr>\u003ctr>\u003ctd>강렬한 슬픔과 분노\u003c/td>\u003ctd>낮은 수준의 슬픔과 분노, 희망/강인함/감사함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 첫 문장에 주제를 던지고 마지막 문장에 다시 결론을 강조하는 전형적인 양괄식 구조를 취하고 있어요. 추상적인 도입부를 먼저 말하고, 우리가 흔히 아는 예시로 원리를 설명한 뒤, 다시 일반적인 교훈으로 범위를 넓혀가는 논리적인 전개방식이 돋보입니다.","hl":"ty"},{"n":9,"text":"글의 흐름을 잡아주는 신호어들을 볼까요? 예시를 시작할 때는 Take, for example 이 쓰였고, 대안적인 관점을 제시할 때는 Alternatively 가 등장해서 시선을 돌려주죠. 또 원인과 결과를 묶어주는 As a result 와 결론을 이끄는 Thereby 같은 연결어들이 문장 사이의 징검다리 역할을 아주 잘 해주고 있습니다. 글 속에서 changing the way one thinks 나 construed in different ways 같은 표현들은 모두 재평가를 뜻하는 재진술 표현이니까 하나로 묶어서 기억해 두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>reappraisal\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재평가\u003c/span>\u003c/div>\u003cdiv>\u003cb>regulate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조절하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>root\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뿌리, 본질, 근원\u003c/span>\u003c/div>\u003cdiv>\u003cb>adverse\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부정적인, 불리한\u003c/span>\u003c/div>\u003cdiv>\u003cb>construe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해석하다, 이해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>overpowering\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>압도적인, 강렬한\u003c/span>\u003c/div>\u003cdiv>\u003cb>loss\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상실\u003c/span>\u003c/div>\u003cdiv>\u003cb>mark\u003c/b>\u003cem>동사\u003c/em>\u003cspan>흔적을 남기다, 표시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>alternatively\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그 대신에, 이와는 달리\u003c/span>\u003c/div>\u003cdiv>\u003cb>painful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고통스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>outcome\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the long run\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>장기적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>improve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>개선하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>intense\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>강렬한, 극심한\u003c/span>\u003c/div>\u003cdiv>\u003cb>crucially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>결정적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>gratitude\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감사함\u003c/span>\u003c/div>\u003cdiv>\u003cb>illustrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여 주다, 설명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>consequence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>accumulate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>축적되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>psychological\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>심리적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>thereby\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그렇게 함으로써\u003c/span>\u003c/div>\u003cdiv>\u003cb>resilience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>회복 탄력성\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어 몇 개만 짚어 볼게요. reappraisal 은 이 글의 핵심 소재인 재평가를 뜻합니다. 꼭 외워두셔야 해요. 그리고 construe 는 해석하다, 이해하다라는 뜻의 동사인데 명사형인 construal 도 본문에 여러 번 나오니 함께 알아두세요. 마지막으로 resilience 는 회복 탄력성이라는 뜻으로 모의고사에 정말 단골로 나오는 단어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">regulate\u003c/b>\u003cspan class=\"m\">조절하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">control\u003c/span>\u003cspan class=\"s\">adjust\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">adverse\u003c/b>\u003cspan class=\"m\">부정적인, 불리한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">negative\u003c/span>\u003cspan class=\"s\">unfavorable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">favorable\u003c/span>\u003cspan class=\"a\">beneficial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">construe\u003c/b>\u003cspan class=\"m\">해석하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">interpret\u003c/span>\u003cspan class=\"s\">understand\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misunderstand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">overpowering\u003c/b>\u003cspan class=\"m\">압도적인, 강렬한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">overwhelming\u003c/span>\u003cspan class=\"s\">intense\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">mild\u003c/span>\u003cspan class=\"a\">weak\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accumulate\u003c/b>\u003cspan class=\"m\">축적되다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">gather\u003c/span>\u003cspan class=\"s\">build up\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disperse\u003c/span>\u003cspan class=\"a\">scatter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">resilience\u003c/b>\u003cspan class=\"m\">회복 탄력성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">flexibility\u003c/span>\u003cspan class=\"s\">toughness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">vulnerability\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"알아두면 좋을 동의어와 반의어도 챙겨갈게요. 조절하다라는 뜻의 regulate 는 control 이나 adjust 로 바꿔 쓸 수 있고 반대말은 neglect 입니다. 부정적인이라는 뜻의 adverse 는 negative 나 unfavorable 과 같은 뜻이고, 반대말은 favorable 이에요. 강렬한이라는 뜻의 intense 는 extreme 이나 severe 로 바꿀 수 있고 반대말은 weak 이나 mild 가 되겠습니다. 꼼꼼히 필기해 두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재평가, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Reappraisal \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">― \u003c/span>\u003cspan class=\"tgt\">changing \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">way \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">thinks \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">emotional \u003c/span>\u003cspan class=\"tgt\">situations \u003c/span>\u003cspan class=\"tgt\">―\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특히 효과적인 방법을 제공할지도 모른다 \u003c/span>\u003cspan class=\"en\">might present a particularly effective avenue\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">감정을 조절하는 데 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">regulating \u003c/span>\u003cspan class=\"tgt\">emotions\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 감정을 본질적으로 변화시키기 때문에.\u003c/span>\u003cspan class=\"en\">because it transforms emotions at their root.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">재평가, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은 그것이 감정을 본질적으로 변화시키기 때문에 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 핵심 소재인 \u003cb class=\"key\">재평가(Reappraisal)\u003c/b>를 소개하며, 그것이 감정 조절에 매우 효과적이라고 주장하는 주제문입니다. 사건 자체를 바꾸는 것이 아니라 상황에 대한 \u003cb class=\"key\">생각의 \u003c/b>\u003cb class=\"key\">방식\u003c/b>을 바꿈으로써 감정을 근본적으로 다스릴 수 있다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 대시(―)\u003c/span> : 명사 A ― [동명사구 B] ― : \"재평가, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사의 생략\u003c/span> : the way + [완전한 문장] : \"누군가가 감정적인 상황들에 대해 생각하는 방식\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 to + 동명사\u003c/span> : avenue + to [전치사] + [regulating (동명사)] : \"감정을 조절하는 데\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Reappraisal, 재평가. ― changing the way one thinks about emotional situations ―, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은. might present a particularly effective avenue, 특히 효과적인 방법을 제공할지도 모른다. to regulating emotions, 감정을 조절하는 데. because it transforms emotions at their root, 그것이 감정을 본질적으로 변화시키기 때문에.. 이 문장 전체를 해석하면, 재평가, 즉 누군가가 감정적인 상황들에 대해 생각하는 방식을 바꾸는 것은 그것이 감정을 본질적으로 변화시키기 때문에 감정을 조절하는 데 특히 효과적인 방법을 제공할지도 모른다.","hl":"m"},{"n":13,"text":"이 문장은 이 글의 전체 주제를 던져주는 아주 중요한 첫 번째 문장이에요. 재평가라는 핵심 소재를 소개하고 있죠. 감정적인 상황에 대한 내 생각의 방식을 바꾸는 이 재평가가, 감정을 아주 근본적으로 변화시키기 때문에 감정 조절에 끝내주게 효과적이라는 겁니다.","hl":"mn"},{"n":14,"text":"중요한 어법 포인트 짚어볼게요. 첫 번째로, Reappraisal 뒤에 대시 기호가 양쪽에 있죠? 이건 동격의 대시라고 해요. 즉, 재평가가 무엇인지 동명사구 changing 이하로 구체적으로 풀어서 설명해주고 있어요. 두 번째로, the way one thinks about emotional situations를 보면 선행사 the way 뒤에 관계부사 how나 in which가 생략되어 있어요. the way와 how는 절대로 함께 쓸 수 없다는 거 꼭 기억하세요. 세 번째, avenue to regulating emotions에서 이 to는 to부정사가 아니라 전치사예요. 뭐뭐에 이르는 방법, 길이라는 뜻이죠. 전치사 뒤니까 당연히 동사원형이 아니라 동명사인 regulating이 와야 한다는 거, 시험에 아주 잘 나오니까 별표 쳐두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 생각해보자 \u003c/span>\u003cspan class=\"en\">Take, for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이혼을 겪고 있는 누군가를.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">someone \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">divorce\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 이혼을 겪고 있는 누군가를 생각해 보자.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 번째 문장에서 제시한 '재평가'의 개념을 쉽게 이해할 수 있도록 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 도입하는 문장입니다. '이혼'이라는 강력하고 부정적인 \u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 예시로 들어 설명을 시작합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : someone [선행사] + who [주격 관계대명사] + [동사] : \"이혼을 겪고 있는 누군가\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Take, for example, 예를 들어, 생각해보자. someone who is going through a divorce, 이혼을 겪고 있는 누군가를.. 이 문장 전체를 해석하면, 예를 들어, 이혼을 겪고 있는 누군가를 생각해 보자.","hl":"m"},{"n":16,"text":"이제 첫 번째 문장에서 말한 재평가가 뭔지 구체적인 사례를 들어 설명하려고 해요. 누구나 감정적으로 힘들다고 생각할 만한 상황, 즉 이혼이라는 강력한 감정적 상황을 예로 들면서 이야기를 시작하고 있습니다.","hl":"mn"},{"n":17,"text":"어법을 보면, someone who is going through a divorce에서 who는 주격 관계대명사죠. 앞에 있는 선행사 someone을 꾸며주고 있어요. 여기서 someone이 단수니까, 관계대명사 뒤에 오는 동사도 당연히 단수 동사인 is를 써야 한다는 점, 스위치에 주의해 주세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 보통 부정적인 사건이다, \u003c/span>\u003cspan class=\"en\">This is often an adverse event,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그럼에도 불구하고 그것은 다른 방식들로 해석될 수 있다.\u003c/span>\u003cspan class=\"en\">and yet, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">construed\u003c/span> in different ways.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 보통 부정적인 사건이지만, 그럼에도 불구하고 그것은 다른 방식들로 해석될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이혼이라는 사건 자체가 부정적(adverse)인 것은 맞지만, 상황을 바라보는 관점에 따라 얼마든지 \u003cb class=\"key\">다르게 \u003c/b>\u003cb class=\"key\">해석(construed)\u003c/b>될 수 있음을 보여줍니다. 이것이 바로 앞서 언급한 \u003cb class=\"key\">재평가\u003c/b>의 작동 원리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 수동태\u003c/span> : 조동사 + be + p.p. : \"그것은 해석될 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"This is often an adverse event, 이것은 보통 부정적인 사건이다. and yet, it can be construed in different ways, 하지만 그럼에도 불구하고 그것은 다른 방식들로 해석될 수 있다.. 이 문장 전체를 해석하면, 이것은 보통 부정적인 사건이지만, 그럼에도 불구하고 그것은 다른 방식들로 해석될 수 있다.","hl":"m"},{"n":19,"text":"이혼 자체는 당연히 안 좋고 부정적인 사건이 맞죠. 하지만 사건이 똑같아도 상황을 바라보는 방식에 따라서 다르게 해석될 수 있다는 뜻이에요. 이 문장에서 말하는 다르게 해석한다는 것이 바로 앞서 말한 재평가의 핵심 원리랍니다.","hl":"mn"},{"n":20,"text":"문법을 살펴볼게요. it can be construed에서 주어 it은 앞서 말한 이혼이라는 사건을 가리켜요. 사건은 스스로를 해석하는 게 아니라 사람들에 의해서 해석되는 대상이잖아요? 그래서 조동사 can 뒤에 수동태 형태인 be construed를 써서 '해석될 수 있다'라고 표현한 겁니다. 태를 결정할 때는 항상 주어와의 관계를 따져보는 거 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가는 그것을 여길지도 모른다\u003c/span>\u003cspan class=\"en\">One might \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">view \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강렬한 상실로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">overpowering \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">loss \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 가족에게 흔적을 남길\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">mark\u003c/span> one's family\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">평생.\u003c/span>\u003cspan class=\"en\">for life.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">누군가는 그것을 자신의 가족에게 평생 흔적을 남길 강렬한 상실로 여길지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이혼이라는 부정적 사건을 \u003cb class=\"key\">매우 \u003c/b>\u003cb class=\"key\">부정적으로 \u003c/b>\u003cb class=\"key\">해석\u003c/b>하는 첫 번째 방식을 보여줍니다. 사건 자체에 압도되어 회복 불가능한 \u003cb class=\"key\">상실\u003c/b>로 받아들이는 상황을 묘사하고 있죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">view A as B (A를 B로 여기다)\u003c/span> : view [목적어] + as [명사/형용사] : \"그것을 강렬한 상실로 여기다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : [선행사] + that [주격 관계대명사] + [동사] : \"흔적을 남길 상실\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"One might view it, 누군가는 그것을 여길지도 모른다. as an overpowering loss, 강렬한 상실로. that will mark one's family, 자신의 가족에게 흔적을 남길. for life, 평생.. 이 문장 전체를 해석하면, 누군가는 그것을 자신의 가족에게 평생 흔적을 남길 강렬한 상실로 여길지도 모른다.","hl":"m"},{"n":22,"text":"이 문장은 이혼이라는 사건을 매우 부정적으로 해석하는 첫 번째 방식을 보여줍니다. 이혼이라는 사건 자체에 완전히 압도되어서, 가족에게 씻을 수 없는 상처를 남기는 상실로 받아들이는 안타까운 상황을 묘사하고 있죠.","hl":"mn"},{"n":23,"text":"첫 번째로, view it as an overpowering loss를 볼게요. view A as B는 A를 B로 여기다라는 뜻의 아주 중요한 구문입니다. 여기서 it은 이혼을 가리키죠. 이것은 regard A as B나 see A as B로 바꿔 쓸 수도 있어요. 두 번째 포인트는 loss that will mark입니다. 명사인 overpowering loss 뒤에 주격 관계대명사 that이 와서 뒤에 있는 문장이 선행사를 꾸며주고 있어요. that 뒤에 주어 없이 바로 동사 will mark가 이어지는 것을 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이와는 달리,\u003c/span>\u003cspan class=\"en\">Alternatively,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가는 그것을 여길지도 모른다\u003c/span>\u003cspan class=\"en\">one might \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 일로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고통스럽기는 한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">painful \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 긍정적인 결과로 이어질 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">lead \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> positive outcomes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장기적으로는,\u003c/span>\u003cspan class=\"en\">in the long run,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개선된 관계와 같이.\u003c/span>\u003cspan class=\"en\">such as improved relationships.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이와는 달리, 누군가는 그것을 고통스럽기는 하지만 개선된 관계와 같이 장기적으로는 긍정적인 결과로 이어질 수 있는 일로 여길지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장과 대조적으로, 같은 사건인 이혼을 \u003cb class=\"key\">긍정적으로 \u003c/b>\u003cb class=\"key\">재평가\u003c/b>하는 두 번째 방식을 보여줍니다. 당장은 힘들어도 장기적으로는 성장의 발판이 될 수 있다고 생각하는 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">재해석\u003c/b>의 좋은 예시입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">see A as B (A를 B로 여기다)\u003c/span> : see [목적어] + as [명사] : \"그것을 어떤 일로 여기다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사절의 병렬 구조\u003c/span> : [선행사] + that절 + but + that절 : \"고통스럽기는 하지만 이어질 수 있는 어떤 일\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Alternatively, 이와는 달리. one might see it, 누군가는 그것을 여길지도 모른다. as something, 어떤 일로. that is painful, 고통스럽기는 한. but that might lead to positive outcomes, 하지만 긍정적인 결과로 이어질 수 있는. in the long run, 장기적으로는. such as improved relationships, 개선된 관계와 같이.. 이 문장 전체를 해석하면, 이와는 달리, 누군가는 그것을 고통스럽기는 하지만 개선된 관계와 같이 장기적으로는 긍정적인 결과로 이어질 수 있는 일로 여길지도 모른다.","hl":"m"},{"n":25,"text":"이 문장은 바로 앞 문장과는 정반대로, 이혼을 긍정적으로 재평가하는 두 번째 방식을 보여줍니다. 당장의 고통은 인정하지만, 멀리 보면 오히려 가족 관계가 좋아질 수도 있다고 생각하는 인지적 재해석의 아주 훌륭한 예시랍니다.","hl":"mn"},{"n":26,"text":"어법 포인트 짚어볼게요. 첫 번째로 see it as something 부분입니다. 윗 문장에서 배운 view it as와 똑같은 구조죠? 동일한 사건을 다르게 인지한다는 걸 보여주기 위해 동의어 see를 활용했어요. 두 번째가 정말 중요한데요, something that is painful but that might lead to 부분입니다. 여기서 that은 대명사 something을 꾸며주는 주격 관계대명사절인데, 등위접속사 but을 사이에 두고 두 개의 주격 관계대명사절이 병렬로 연결되어 선행사를 동시에 꾸며주고 있어요. 이 구조는 서술형으로 나오기 딱 좋으니 꼭 암기하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 다른 해석들의 결과로서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">result \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">construals\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가는 다른 감정들을 느낄지도 모른다.\u003c/span>\u003cspan class=\"en\">one might feel different emotions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 다른 해석들의 결과로서 누군가는 다른 감정들을 느낄지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 제시된 두 가지 해석 방식이 결국 \u003cb class=\"key\">다른 \u003c/b>\u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 낳는다는 점을 요약하고 있습니다. 상황을 어떻게 \u003cb class=\"key\">해석\u003c/b>하느냐가 감정을 결정한다는 글의 핵심 주제를 직관적으로 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : As a result of + [명사/명사구] : \"~의 결과로서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시형용사\u003c/span> : these + [복수명사] : \"이러한 다른 해석들\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"As a result of these different construals, 이러한 다른 해석들의 결과로서. one might feel different emotions, 누군가는 다른 감정들을 느낄지도 모른다.. 이 문장 전체를 해석하면, 이러한 다른 해석들의 결과로서 누군가는 다른 감정들을 느낄지도 모른다.","hl":"m"},{"n":28,"text":"이 문장은요, 방금 앞에서 본 부정적 해석과 긍정적 해석이 결국 사람에게 완전히 다른 감정적 결과를 가져온다는 걸 딱 잘라 요약해주고 있어요. 즉, 상황 자체보다 그 상황을 어떻게 해석하느냐가 내 감정을 결정한다는 이 글의 주제를 잘 보여주고 있죠.","hl":"mn"},{"n":29,"text":"문법도 꼼꼼히 챙겨볼까요? 첫 번째로 As a result of입니다. 뭐뭐의 결과로서라는 뜻을 가진 전치사구라서, 뒤에는 주어 동사가 있는 문장이 아니라 명사구가 와야 한다는 점을 기억하세요. 두 번째는 these different construals 부분입니다. 여기서 지시형용사 these는 바로 앞 문장들에서 언급된 두 가지 해석 방식을 가리킵니다. 셀 수 있는 명사의 복수형인 복수명사가 뒤에 왔기 때문에 this가 아니라 these를 쓴 점도 잊지 마시고요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫 번째 해석은\u003c/span>\u003cspan class=\"en\">The first construal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불러올 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">bring\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강렬한 슬픔과 분노를\u003c/span>\u003cspan class=\"en\">intense sadness and anger.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">첫 번째 해석은 강렬한 슬픔과 분노를 불러올 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 부정적인 첫 번째 해석이 가져오는 \u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 보여줍니다. 이혼을 평생의 상처로만 받아들이면 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">감정\u003c/b>이 극대화된다는 것을 의미합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사의 쓰임 (추측)\u003c/span> : may [조동사] + bring [동사원형] : \"불러올 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The first construal, 첫 번째 해석은. may bring, 불러올 수 있다. intense sadness and anger, 강렬한 슬픔과 분노를. 이 문장 전체를 해석하면, 첫 번째 해석은 강렬한 슬픔과 분노를 불러올 수 있다.","hl":"m"},{"n":31,"text":"이 문장은 앞서 말한 부정적인 관점이 가져오는 감정적 결과를 짚어줍니다. 이혼을 단순히 극복할 수 없는 상실로만 보는 첫 번째 해석을 하면, 슬픔과 분노 같은 부정적 감정이 아주 강하게 나타난다는 점을 설명하고 있어요.","hl":"mn"},{"n":32,"text":"여기서 may bring을 살펴볼까요. 조동사 may 뒤에 동사원형 bring이 와서 무엇 무엇을 불러올 수 있다라는 약한 추측의 의미를 전달하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 번째 해석 역시\u003c/span>\u003cspan class=\"en\">The second construal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">슬픔과 분노를 불러올지도 모르지만\u003c/span>\u003cspan class=\"en\">might also bring sadness and anger\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 더 낮은 강도로 그러할지도 모른다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">perhaps \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">lower \u003c/span>\u003cspan class=\"tgt\">levels\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">두 번째 해석 역시 슬픔과 분노를 불러올지도 모르지만, 아마도 더 낮은 강도로 그러할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 해석, 즉 \u003cb class=\"key\">상황 \u003c/b>\u003cb class=\"key\">재평가\u003c/b>를 했을 때의 결과를 대조하여 보여줍니다. 부정적 사건으로 인한 감정이 완전히 사라지는 것은 아니지만 그 \u003cb class=\"key\">강도가 \u003c/b>\u003cb class=\"key\">낮아진다\u003c/b>는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 뒤의 생략\u003c/span> : but perhaps + (it might bring them) + at lower levels : \"아마도 더 낮은 강도로 (그러할지도 모른다)\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"The second construal, 두 번째 해석 역시. might also bring sadness and anger, 슬픔과 분노를 불러올지도 모르지만. but perhaps at lower levels, 아마도 더 낮은 강도로 그러할지도 모른다.. 이 문장 전체를 해석하면, 두 번째 해석 역시 슬픔과 분노를 불러올지도 모르지만, 아마도 더 낮은 강도로 그러할지도 모른다.","hl":"m"},{"n":34,"text":"이 문장은 상황을 재평가하는 두 번째 해석을 했을 때의 결과를 보여줍니다. 이혼이라는 사건 자체의 아픔 때문에 슬픔과 분노가 아예 사라지지는 않지만, 그 감정의 강도를 훨씬 낮출 수 있다는 점을 강조하고 있죠.","hl":"mn"},{"n":35,"text":"문장 끝부분의 but perhaps at lower levels를 볼까요. 이 부분은 접속사 but 뒤에 주어와 동사인 it might bring them 정도가 생략된 형태입니다. 영어는 반복을 싫어하기 때문에 문맥상 뻔히 알 수 있는 앞부분의 구조를 생략하고 전명구인 at lower levels만 남겨서 간결하게 표현한 것이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결정적으로\u003c/span>\u003cspan class=\"en\">Crucially,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 또한 불러올지도 모른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it\u003c/span> might also bring\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 긍정적인 감정들을\u003c/span>\u003cspan class=\"en\">some positive emotions,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">희망, 강인함 또는 감사함과 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">hope, \u003c/span>\u003cspan class=\"tgt\">strength, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">gratitude\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">결정적으로 그것은 희망, 강인함 또는 감사함과 같은 어떤 긍정적인 감정들 또한 불러올지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 상황 재평가의 가장 중요한 효과인 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">감정\u003c/b>의 발현을 설명합니다. 관점의 변화가 단순히 부정적 감정을 줄이는 데 그치지 않고 새로운 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">에너지\u003c/b>를 만들어냄을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대명사 지칭\u003c/span> : it = The second construal : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 (예시)\u003c/span> : such as [전치사구] + A, B, or C [명사 병렬] : \"희망, 강인함 또는 감사함과 같은\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Crucially, 결정적으로. it might also bring, 그것은 또한 불러올지도 모른다. some positive emotions, 어떤 긍정적인 감정들을. such as hope, strength, or gratitude, 희망, 강인함 또는 감사함과 같은. 이 문장 전체를 해석하면, 결정적으로 그것은 희망, 강인함 또는 감사함과 같은 어떤 긍정적인 감정들 또한 불러올지도 모른다.","hl":"m"},{"n":37,"text":"이 문장은 재평가가 지니는 결정적인 장점을 말해줍니다. 상황을 긍정적으로 다시 해석하면, 부정적인 감정이 줄어드는 것을 넘어서서 희망이나 감사함 같은 긍정적인 감정까지 새롭게 얻을 수 있다는 글의 핵심 메시지를 담고 있습니다.","hl":"mn"},{"n":38,"text":"첫 번째로 대명사 it이 가리키는 것을 정확히 잡아야 해요. 여기서 it은 앞 문장에 나온 두 번째 해석을 뜻합니다. 두 번째로 positive emotions 뒤에 붙은 such as 구문을 볼게요. 전치사구 such as는 무엇 무엇과 같은 이라는 뜻으로, 뒤에 희망, 강인함, 감사함이라는 구체적인 예시들을 병렬 구조로 덧붙여서 부연 설명해주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 예시는 보여 준다\u003c/span>\u003cspan class=\"en\">This example illustrates\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 재평가가 강력하게 변화시킬 수 있을지를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">reappraisal \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">powerfully \u003c/span>\u003cspan class=\"tgt\">transform\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단기적인 감정적 반응들을.\u003c/span>\u003cspan class=\"en\">short­term emotional responses.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 예시는 재평가가 어떻게 단기적인 감정적 반응들을 강력하게 변화시킬 수 있을지를 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 든 이혼의 사례를 요약하며, \u003cb class=\"key\">재평가\u003c/b>가 감정 반응을 어떻게 바꾸는지 명확히 보여줍니다. 부정적인 상황이라도 긍정적인 면을 보는 시각의 변화가 결국 \u003cb class=\"key\">단기적 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 크게 바꿀 수 있음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 (명사절)\u003c/span> : 의문사 [how] + 주어 [reappraisal] + 동사 [might transform] : \"어떻게 재평가가 강력하게 변화시킬 수 있을지를\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"This example illustrates, 이 예시는 보여 준다. how reappraisal might powerfully transform, 어떻게 재평가가 강력하게 변화시킬 수 있을지를. short­term emotional responses, 단기적인 감정적 반응들을.. 이 문장 전체를 해석하면, 이 예시는 재평가가 어떻게 단기적인 감정적 반응들을 강력하게 변화시킬 수 있을지를 보여 준다.","hl":"m"},{"n":40,"text":"앞에서 이혼이라는 상황을 어떻게 바라보느냐에 따라 감정이 달라지는 것을 봤죠? 이 문장은 그 사례를 싹 정리해 주고 있어요. 상황에 대한 재평가가 우리의 단기적 감정을 얼마나 크게 바꿀 수 있는지 핵심을 딱 짚어주는 거죠.","hl":"mn"},{"n":41,"text":"여기서 꼭 알아둬야 할 문법 포인트가 하나 있어요. 바로 illustrates 뒤에 나오는 부분인데요. how reappraisal might powerfully transform 이 부분은 illustrates라는 동사의 목적어 역할을 하는 명사절이에요. 이때 how라는 의문사 뒤에 주어 그리고 동사 순서로 이어지는 간접의문문 어순이 쓰였다는 걸 꼭 기억해 두세요. 의문사 플러스 주어 플러스 동사, 이 순서가 시험에 자주 나오거든요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오랫동안 반복되면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">repeated\u003c/span> over time,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재평가의 이러한 단기적인 감정적 결과들이\u003c/span>\u003cspan class=\"en\">these short­term emotional consequences of reappraisal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">축적되어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">accumulate \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들의 심리적 건강을 형성할지도 모른다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">shape\u003c/span> people's psychological health.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오랫동안 반복되면, 재평가의 이러한 단기적인 감정적 결과들이 축적되어 사람들의 심리적 건강을 형성할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단기적인 감정 변화가 일회성으로 끝나지 않고 누적되었을 때의 결과를 설명합니다. 작은 \u003cb class=\"key\">감정적 \u003c/b>\u003cb class=\"key\">결과\u003c/b>들이 모여 결국 전반적인 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">건강\u003c/b>이라는 큰 변화를 만들어낸다는 글의 핵심 주장이 담겨 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사가 남은 분사구문\u003c/span> : 접속사 [When] + (주어 + be동사 생략) + 과거분사 [repeated] : \"반복되면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (결과)\u003c/span> : 동사 [accumulate] + to부정사 [to shape] : \"축적되어 (그 결과) ~을 형성할지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"When repeated over time, 오랫동안 반복되면. these short­term emotional consequences of reappraisal, 재평가의 이러한 단기적인 감정적 결과들이. might accumulate, 축적되어. to shape people's psychological health, 사람들의 심리적 건강을 형성할지도 모른다.. 이 문장 전체를 해석하면, 오랫동안 반복되면, 재평가의 이러한 단기적인 감정적 결과들이 축적되어 사람들의 심리적 건강을 형성할지도 모른다.","hl":"m"},{"n":43,"text":"방금 앞 문장에서 재평가가 단기적 감정을 바꾼다고 했잖아요? 이 문장에서는 그게 한 번으로 끝나는 게 아니라 길게 이어질 때를 이야기해요. 그런 단기적인 감정적 결과들이 매일매일 차곡차곡 쌓이면, 결국 우리 사람들의 전반적인 심리적 건강 자체를 튼튼하게 만들어준다는 아주 중요한 문장입니다.","hl":"mn"},{"n":44,"text":"이 문장에서는 두 가지 문법 포인트를 챙겨야 해요. 첫 번째는 When repeated 부분인데요. 의미를 분명하게 하려고 접속사 When을 살려둔 분사구문이에요. 주절의 주어인 단기적인 결과들이 스스로 반복하는 게 아니라 반복되는 거니까 수동 관계를 나타내는 과거분사 repeated가 쓰였다는 점 잊지 마세요. 두 번째는 might accumulate to shape 부분이에요. 여기서 to shape는 to부정사의 부사적 용법 중에서 결과적 용법으로 쓰였어요. 감정적 결과들이 먼저 축적되고, 그 결과로 결국 사람들의 심리적 건강을 형성하게 된다고 자연스럽게 이어서 해석해 주면 완벽해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 함으로써\u003c/span>\u003cspan class=\"en\">Thereby,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">재평가는 해답이 될지도 모른다\u003c/span>\u003cspan class=\"en\">reappraisal might be \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">key \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">회복 탄력성의.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">resilience\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇게 함으로써 재평가는 회복 탄력성의 해답이 될지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 최종 결론으로, 재평가가 결국 시련을 이겨내는 \u003cb class=\"key\">회복 \u003c/b>\u003cb class=\"key\">탄력성\u003c/b>의 핵심 열쇠가 됨을 단언합니다. 전체 지문의 \u003cb class=\"key\">주제문\u003c/b> 역할을 하는 아주 짧고 강력한 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 to\u003c/span> : 명사 [key] + 전치사 [to] + 명사 [resilience] : \"회복 탄력성의 해답 (회복 탄력성으로 가는 열쇠)\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Thereby, 그렇게 함으로써. reappraisal might be a key, 재평가는 해답이 될지도 모른다. to resilience, 회복 탄력성의.. 이 문장 전체를 해석하면, 그렇게 함으로써 재평가는 회복 탄력성의 해답이 될지도 모른다.","hl":"m"},{"n":46,"text":"이 글의 최종 결론이자 주제문이에요. 상황을 긍정적으로 다시 생각하는 재평가 덕분에 심리적 건강이 쌓이고, 결국 어떤 힘든 일이 있어도 훌훌 털고 일어나는 회복 탄력성을 갖게 된다는 거죠.","hl":"mn"},{"n":47,"text":"여기서 하나만 딱 짚고 넘어갈게요. a key to resilience에서 쓰인 to는 to부정사의 to가 아니라 어디로 향하는 방향을 나타내는 전치사랍니다. 그래서 이 전치사 뒤에는 반드시 동사원형이 아니라 resilience 같은 명사가 와야 한다는 점, 꼭 체크해 두세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">재평가\u003c/b>는 감정적인 상황에 대해 생각하는 방식을 바꾸는 것으로, 감정을 본질적으로 변화시켜 감정 조절에 매우 효과적이다.\u003c/li>\u003cli>이혼과 같은 동일한 부정적인 사건이라도, 이를 어떻게 \u003cb class=\"key\">해석\u003c/b>하느냐에 따라 우리가 느끼는 감정의 강도와 종류는 완전히 달라진다.\u003c/li>\u003cli>재평가를 통해 상황을 장기적인 관점에서 긍정적으로 바라보면 부정적 감정이 줄고 희망이나 감사 같은 \u003cb class=\"key\">긍정적인 \u003c/b>\u003cb class=\"key\">감정\u003c/b>이 유발될 수 있다.\u003c/li>\u003cli>이러한 단기적인 감정 조절의 결과들이 오랜 시간 축적되면 사람들의 심리적 건강을 형성하고 결국 \u003cb class=\"key\">회복 \u003c/b>\u003cb class=\"key\">탄력성\u003c/b>의 해답이 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Reappraisal effectively regulates short-term emotional responses and ultimately builds long-term resilience.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">재평가\u003c/b>는 감정적 상황을 다르게 해석함으로써 부정적 감정을 줄이고 긍정적 감정을 이끌어내어, 궁극적으로 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">건강\u003c/b>과 \u003cb class=\"key\">회복 \u003c/b>\u003cb class=\"key\">탄력성\u003c/b>을 증진시킨다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"자, 오늘 배운 내용을 한 줄로 정리하면, 상황을 어떻게 해석하느냐가 내 감정과 회복 탄력성을 결정한다는 겁니다. 여러분도 힘들고 스트레스 받는 상황이 오면 오늘 배운 재평가를 한 번 적용해 보시는 건 어떨까요? 복습 꼼꼼히 하시고, 우리는 다음 지문에서 만나요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
