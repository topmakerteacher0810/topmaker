</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 19번","audioDir":"19_audio","preview":false,"count":48,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">19번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>A Misspelled Reservation\u003c/h1>\u003ch2>오타로 사라진 예약\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>Katie는 호텔 체크인 중 \u003cb class=\"key\">예약\u003c/b>이 ‘Katie’가 아닌 \u003cb class=\"key\">K-A-T-Y\u003c/b>로 잘못 입력되어 잠시 당황했지만, 접수 담당자의 확인으로 \u003cb class=\"key\">오타\u003c/b>임을 알게 되어 안도하며 체크인을 마쳤다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A simple misspelling in a hotel reservation nearly caused Katie trouble, but the receptionist found the error and she checked in with relief.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 호텔에서 벌어진 작은 해프닝입니다. Katie가 체크인을 하려고 프런트 데스크에 갔는데 예약을 찾지 못하는 일이 생기죠. 결국 철자 오류가 원인이었고, Katie는 안도하며 체크인을 마칩니다. 이 이야기를 통해 사소한 실수가 어떤 영향을 주는지 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">호텔에서는 도착하면 가장 먼저 \u003cb class=\"key\">front \u003c/b>\u003cb class=\"key\">desk\u003c/b>에서 \u003cb class=\"key\">check-in\u003c/b>을 합니다. 예약은 보통 \u003cb class=\"key\">reservation\u003c/b> 시스템에 이름과 전화번호로 저장됩니다. 그런데 이름의 \u003cb class=\"key\">철자\u003c/b>가 한 글자만 달라도 컴퓨터는 전혀 다른 사람으로 인식할 수 있어요. Katie의 예약이 ‘Katie’가 아닌 ‘K-A-T-Y’로 저장된 것은 \u003cb class=\"key\">misspelling\u003c/b>의 전형적인 사례입니다. 일상에서도 음식점 예약이나 배달 주문 시 이름이나 주소를 잘못 적는 순간 문제가 생기죠. 그래서 예약 확인 시 이름뿐 아니라 \u003cb class=\"key\">전화번호\u003c/b>를 함께 확인하는 것이 중요합니다.\u003c/div>","segs":[{"n":2,"text":"호텔에서는 도착하면 제일 먼저 front desk에서 check-in을 합니다. 예약 정보는 보통 reservation 시스템에 이름과 전화번호로 저장되어 있어요. 그런데 이름의 철자가 한 글자만 달라도 컴퓨터는 전혀 다른 사람으로 인식할 수 있습니다. Katie의 예약이 Katie가 아니라 K-A-T-Y로 저장된 것은 misspelling의 전형적인 사례예요. 일상에서도 음식점 예약이나 배달 주문 때 이름을 한 글자 잘못 적으면 낭패를 보죠. 그래서 예약 확인에서는 이름뿐 아니라 전화번호를 함께 확인하는 게 중요합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>예상 못한 문제\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>Katie가 호텔 \u003cb class=\"key\">front \u003c/b>\u003cb class=\"key\">desk\u003c/b>에 다가가 \u003cb class=\"key\">check-in\u003c/b>을 하려던 순간, 예상하지 못한 사건이 벌어집니다. 접수 담당자는 ‘Katie’라는 이름으로 된 예약을 찾을 수 없었고, 그 이름으로는 예약을 찾을 수 없다고 말합니다. Katie의 계획에 첫 번째 \u003cb class=\"key\">차질\u003c/b>이 생긴 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>당황과 확인\u003csmall>전개 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>Katie는 전화로 분명히 예약했다고 \u003cb class=\"key\">말도 \u003c/b>\u003cb class=\"key\">안 \u003c/b>\u003cb class=\"key\">된다\u003c/b>며 어리둥절해합니다. 접수 담당자가 \u003cb class=\"key\">전화번호\u003c/b>를 묻자 Katie는 ‘무슨 일이지? 내가 실수를 저질렀나?’라고 \u003cb class=\"key\">불안\u003c/b>해하며 번호를 알려 줍니다. 문제의 원인을 찾기 위한 단서가 제공되는 순간입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>오타 발견\u003csmall>전환 · 문장 7–10\u003c/small>\u003c/h4>\u003cp>접수 담당자는 잠시만요라고 말하며 키보드를 \u003cb class=\"key\">신중하게\u003c/b> 칩니다. 곧 예약을 찾아냈고, \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">오타\u003c/b>가 있었던 것 같다고 설명합니다. Katie의 예약은 ‘Katie’가 아니라 \u003cb class=\"key\">K-A-T-Y\u003c/b>로 저장되어 있었던 것입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>안도하며 진행\u003csmall>결론 · 문장 11–12\u003c/small>\u003c/h4>\u003cp>Katie는 \u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">기분\u003c/b>으로 화면에 예약이 나타나는 것을 지켜봅니다. 심장이 \u003cb class=\"key\">완만한 \u003c/b>\u003cb class=\"key\">리듬\u003c/b>으로 느려지면서, 단순한 \u003cb class=\"key\">오타\u003c/b>가 자신의 계획을 망칠 뻔했다고 생각하며 체크인을 진행합니다. 사소한 철자 오류가 큰 불편으로 이어질 수 있음을 보여 줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 지문의 흐름을 단계별로 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 예상하지 못한 문제가 생기는 부분입니다. Katie가 프런트 데스크에 다가가 체크인을 하려던 순간, 접수 담당자는 Katie라는 이름으로 된 예약을 찾을 수 없다고 말해요. Katie의 계획에 처음으로 차질이 생긴 거죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 Katie가 당황하며 전화번호를 확인하는 장면입니다. Katie는 전화로 분명히 예약했다고 말하며 어리둥절해하죠. 접수 담당자가 전화번호를 묻자, Katie는 무슨 일이지 내가 실수를 저질렀나 하고 불안한 마음에 번호를 알려 줍니다. 이 장면에서 문제 해결의 단서가 나옵니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 오타를 발견하는 순간입니다. 접수 담당자는 잠시만요라고 말하며 키보드를 신중하게 칩니다. 곧 예약을 찾아냈고, 작은 오타가 있었던 것 같다고 설명하죠. Katie의 예약은 Katie가 아니라 K-A-T-Y로 저장되어 있었던 것입니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 안도하며 체크인을 진행하는 결말입니다. Katie는 편안한 기분으로 화면에 예약이 나타나는 것을 지켜봅니다. 심장이 완만한 리듬으로 느려지면서, 그녀는 단순한 오타가 자신의 계획을 망칠 뻔했다고 생각하며 체크인을 마무리해요. 이렇게 사소한 철자 오류가 큰 불편으로 이어질 수 있다는 걸 보여 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 12번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 Katie가 체크인을 시도하고, 문제가 생기고, 원인을 찾고, 해결하는 과정이 \u003cb class=\"key\">시간순\u003c/b>으로 제시됩니다. 마지막 문장에서 인물의 \u003cb class=\"key\">깨달음\u003c/b>이 드러나므로 \u003cb class=\"key\">미괄식\u003c/b> 구조로 볼 수 있습니다. 접수 담당자의 대화와 Katie의 속마음이 섞여 있어 이야기 흐름을 따라가기 쉽습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>but (1)\u003c/b>\u003cspan>반전·예상 밖 사건 도입\u003c/span>\u003cb>No way (4)\u003c/b>\u003cspan>부정·당황\u003c/span>\u003cb>Just a moment (7)\u003c/b>\u003cspan>전환·해결 시작\u003c/span>\u003cb>I found it (8)\u003c/b>\u003cspan>문제 해결\u003c/span>\u003cb>With a sense of ease (11)\u003c/b>\u003cspan>안도·결말\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">a reservation under the name 'Katie'\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a reservation under that name\u003c/span>\u003cspan class=\"a\">→\u003c/span ocate (to부정사구) : \"찾을 수 없는 것 같습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : under + that name : \"그 이름으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전달문의 주어와 동사\u003c/span> : ... , the receptionist said. : \"접수 담당자가 말했다.\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"\"I'm sorry, “죄송하지만. but I can't seem to locate a reservation, 저는 예약을 찾을 수 없는 것 같습니다. under that name,\", 그 이름으로,”. the receptionist said, 접수 담당자가 말했다.. 이 문장 전체를 해석하면, “죄송하지만, 그 이름으로 된 예약을 찾을 수 없는 것 같습니다.”라고 접수 담당자가 말했다.","hl":"m"},{"n":19,"text":"세 번째 문장은 접수 담당자가 죄송하다고 하면서 그 이름으로 예약을 찾을 수 없다고 말하는 부분입니다. I can't seem to locate는 단정하지 않고 완곡하게 표현하는 방식이에요. 이로써 Katie의 예약이 시스템에서 확인되지 않는다는 사실이 강조됩니다.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 I can't seem to locate입니다. seem 뒤에 to 부정사가 와서 찾을 수 없는 것 같다는 뜻을 만드는데 여기서 can't와 함께 쓰여 완곡한 부정이 됩니다. 두 번째 포인트는 under that name인데요, 여기서 under는 ~라는 이름으로라는 뜻의 전치사구를 이끕니다. 세 번째 포인트는 the receptionist said로 직접 인용문 뒤에 전달절이 오는 구조입니다. 주어 동사가 도치되지 않고 자연스럽게 인용문의 출처를 밝혀 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말도 안 돼요,\u003c/span>\u003cspan class=\"en\">&quot;No way,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 분명히 했어요\u003c/span>\u003cspan class=\"en\">I definitely \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예약을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">reservation\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전화로,\u003c/span>\u003cspan class=\"en\">on the phone,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Katie가 말했다,\u003c/span>\u003cspan class=\"en\">Katie said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어리둥절해하며.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">puzzled\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“말도 안 돼요, 저는 분명히 전화로 예약했어요.”라고 Katie가 어리둥절해하며 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Katie는 예약을 분명히 했다고 강하게 부정하며 \u003cb class=\"key\">어리둥절한 \u003c/b>\u003cb class=\"key\">상태\u003c/b>로 말하고 있습니다. 여기서 \u003cb class=\"key\">No \u003c/b>\u003cb class=\"key\">way\u003c/b>는 강한 부정의 감탄 표현이고, \u003cb class=\"key\">puzzled\u003c/b>는 말하는 순간 Katie의 감정을 묘사하는 과거분사입니다. 예약 착오 사건이 시작되는 긴장감을 보여 주는 대사입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현 (make a reservation)\u003c/span> : make + a reservation (예약하다) : \"예약을 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법 (주어 상태 설명)\u003c/span> : Katie said, p.p. (상태) : \"어리둥절해하며\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"\"No way, 말도 안 돼요. I definitely made, 저는 분명히 했어요. a reservation, 예약을. on the phone,\", 전화로. Katie said, Katie가 말했다. puzzled, 어리둥절해하며.. 이 문장 전체를 해석하면, “말도 안 돼요, 저는 분명히 전화로 예약했어요.”라고 Katie가 어리둥절해하며 말했다.","hl":"m"},{"n":22,"text":"이 문장은 Katie가 예약을 분명히 했다고 강하게 부정하면서 당황한 상태로 말하는 장면이에요. No way는 말도 안 된다는 뜻의 감탄 표현이고, puzzled는 Katie가 어리둥절한 상태임을 나타내는 과거분사예요.","hl":"mn"},{"n":23,"text":"첫 번째로 made a reservation은 make a reservation이라는 숙어로, 예약하다라는 뜻이에요. make가 단순히 만들다가 아니라는 점을 꼭 기억하세요. 두 번째로 문장 끝의 puzzled는 과거분사가 주어 Katie의 상태를 부가적으로 설명해 주는 형용사적 용법이에요. 똑같은 한국어 해석 어리둥절해하며처럼 주어의 상태를 덧붙여 주는 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">접수 담당자가 물어보았고,\u003c/span>\u003cspan class=\"en\">The receptionist asked,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“당신의 전화번호를 말해 주실 수 있을까요?”\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Can \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003cspan class=\"tgt\">me\u003c/span> your phone number?&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 Katie가 그에게 전화번호를 알려 주었다,\u003c/span>\u003cspan class=\"en\">and Katie \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">told \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">him\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘무슨 일이지?’라고 생각하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">thinking \u003c/span>\u003cspan class=\"tgt\">'What \u003c/span>\u003cspan class=\"tgt\">happened?\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">접수 담당자가 “당신의 전화번호를 말해 주실 수 있을까요?”라고 물어보았고, Katie가 ‘무슨 일이지?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 접수 담당자가 예약 이름 대신 전화번호를 확인하겠다고 합니다. Katie는 전화번호를 알려 주면서 속으로 사건 원인에 대한 \u003cb class=\"key\">의문\u003c/b>을 품기 시작합니다. 여기서 can은 요청의 의미로, thinking 이하는 Katie의 \u003cb class=\"key\">동시적 \u003c/b>\u003cb class=\"key\">생각\u003c/b>을 보여 주는 분사구문입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 can의 정중한 요청 (의문문)\u003c/span> : Can you + tell me + 목적어(~?) : \"~을 말해 주실 수 있을까요?\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수여동사 tell의 3형식 전환\u003c/span> : tell + it(사물) + to + him(사람) : \"그에게 그것을 알려 주다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사구문 (동시 동작)\u003c/span> : 주어 + 동사 + ..., thinking ... : \"~라고 생각하며\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"The receptionist asked, 접수 담당자가 물어보았고. \"Can you tell me your phone number?\", “당신의 전화번호를 말해 주실 수 있을까요?”. and Katie told it to him, 그리고 Katie가 그에게 전화번호를 알려 주었다. thinking 'What happened?, ‘무슨 일이지?’라고 생각하며. 이 문장 전체를 해석하면, 접수 담당자가 “당신의 전화번호를 말해 주실 수 있을까요?”라고 물어보았고, Katie가 ‘무슨 일이지?","hl":"m"},{"n":25,"text":"이 문장은 접수 담당자가 예약자 이름 대신 전화번호를 물어보고, Katie가 그것을 알려 주면서 속으로 의문을 품는 장면이에요. Can you tell me your phone number?에서 can은 정중한 요청을 나타내고, thinking은 말하면서 동시에 한 생각을 보여 줘요.","hl":"mn"},{"n":26,"text":"첫 번째로 Can you tell me는 능력이 아니라 상대에게 정중하게 요청하는 can의 용법이에요. 두 번째로 told it to him은 tell이라는 수여동사의 3형식 전환이에요. 원래 tell him it처럼 4형식으로 쓰던 것을 it을 앞에 두고 to him을 뒤에 붙여 말한 거예요. 세 번째로 thinking은 현재분사로, Katie가 전화번호를 알려 주면서 동시에 무슨 일이지 하고 생각했음을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 ~했나요?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Did \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실수를 저질렀나?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">mistake?\u003c/span>'\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 실수를 저질렀나?’라고 생각하며 전화번호를 그에게 알려 주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Katie는 예약 오류가 자신의 실수 때문인지 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">의심\u003c/b>을 합니다. 앞 문장의 thinking과 이어지는 \u003cb class=\"key\">내적 \u003c/b>\u003cb class=\"key\">독백\u003c/b>으로, What happened?와 Did I make a mistake?가 연결되어 혼란스러운 심리를 표현합니다. 짧은 의문문을 통해 사건이 Katie에게 주는 \u003cb class=\"key\">불안감\u003c/b>이 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사 과거 시제 의문문\u003c/span> : Did + 주어 + 동사원형 ~? : \"내가 실수를 저질렀나?\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Did I, 내가 ~했나요?. make a mistake?, 실수를 저질렀나?. 이 문장 전체를 해석하면, 내가 실수를 저질렀나?’라고 생각하며 전화번호를 그에게 알려 주었다.","hl":"m"},{"n":28,"text":"이 문장은 Katie가 혼자 속으로 내가 실수를 했나 하고 자책하며 의심하는 내적 독백이에요. 앞 문장의 thinking과 연결되어서 그녀가 얼마나 당황했는지를 짧은 의문문으로 보여 주고 있어요.","hl":"mn"},{"n":29,"text":"일반동사 make의 과거 의문문은 did를 주어 앞에 쓰고 본동사는 반드시 원형으로 씁니다. 그래서 Did I make a mistake?에서 시제는 did가 나타내고, make는 원형 그대로 쓰는 거예요. 이 점이 영문법에서 정말 중요해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“잠시만요.”라고\u003c/span>\u003cspan class=\"en\">&quot;Just a moment,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">접수 담당자가 말했다,\u003c/span>\u003cspan class=\"en\">the receptionist said,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신중하게 치면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">typing \u003c/span>\u003cspan class=\"tgt\">deliberately \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">키보드에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">keyboard\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“잠시만요.”라고 접수 담당자가 키보드를 신중하게 치면서 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 접수 담당자가 잠시 기다려 달라고 말하면서 동시에 키보드를 신중하게 두드리는 장면입니다. 말하는 동작과 키보드를 치는 동작이 \u003cb class=\"key\">동시에\u003c/b> 일어난다는 점을 분사구문으로 보여 줍니다. 예약을 찾기 위해 집중하는 인상을 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u00 으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~인 것 같습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">seems\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작은 오타가.\u003c/span>\u003cspan class=\"en\">a small misspelling.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">작은 오타가 있었던 것 같습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 예약이 없었던 이유를 설명하는 문장입니다. 확실히 단정하지 않고 \u003cb class=\"key\">It \u003c/b>\u003cb class=\"key\">seems\u003c/b>를 써서 짐작의 뜻을 나타냅니다. 작은 철자 오류 때문에 예약 확인이 어려웠음을 알려 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어-진주어 (It seems that)\u003c/span> : It seems (that) + S + V : \"~인 것 같다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">There + be 존재구문\u003c/span> : There + be + 주어 : \"~가 있었다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"It seems, ~인 것 같습니다. there was, 있었다. a small misspelling, 작은 오타가.. 이 문장 전체를 해석하면, 작은 오타가 있었던 것 같습니다.","hl":"m"},{"n":37,"text":"이 문장은 예약이 없는 이유가 작은 철자 오류 때문인 것 같다고 설명하는 장면입니다. It seems는 확실하지 않지만 그렇게 보인다는 뜻이에요. 이 문장이 상황의 원인을 짚어 줍니다.","hl":"mn"},{"n":38,"text":"문법 포인트는 두 가지입니다. 첫 번째, It seems는 가주어 It이 문장 앞을 채우고 진짜 주어인 that절이 뒤에 오는 구조예요. 여기서는 that이 생략되어 there was a small misspelling이 진주어 역할을 합니다. 두 번째, there was는 존재구문으로 어디에 무엇이 있다는 뜻을 나타냅니다. there는 의미 없는 유도부사이고 be 동사 뒤의 a small misspelling이 실질 주어입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신의 예약은\u003c/span>\u003cspan class=\"en\">Your reservation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~로 되어 있어요\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">under \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘K-A-T-Y’로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">'K-A-T-Y'\u003c/span>,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">접수 담당자가 설명했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">receptionist \u003c/span>\u003cspan class=\"tgt\">explained\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">당신의 예약은 ‘K-A-T-Y’로 되어 있어요.”라고 접수 담당자가 설명했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 접수 담당자가 예약이 ‘K-A-T-Y’로 되어 있다고 알려주는 직접 인용문입니다. Katie는 자신이 ‘Katie’로 예약했을 것이라 생각했지만, \u003cb class=\"key\">철자 \u003c/b>\u003cb class=\"key\">오류\u003c/b> 때문에 ‘K-A-T-Y’로 저장되어 있었음을 드러냅니다. 글 흐름에서 \u003cb class=\"key\">예약 \u003c/b>\u003cb class=\"key\">확인\u003c/b>이 이루어지는 전환점입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 전치사구 보어\u003c/span> : 주어 Your reservation + is + 보어 under 'K-A-T-Y' : \"당신의 예약은 K-A-T-Y로 되어 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">직접 인용문 뒤의 보도동사\u003c/span> : 인용문, the receptionist explained : \"접수 담당자가 설명했다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Your reservation, 당신의 예약은. is under, ~로 되어 있어요. 'K-A-T-Y',\", ‘K-A-T-Y’로. the receptionist explained, 접수 담당자가 설명했다.. 이 문장 전체를 해석하면, 당신의 예약은 ‘K-A-T-Y’로 되어 있어요.”라고 접수 담당자가 설명했다.","hl":"m"},{"n":40,"text":"이 문장은 접수 담당자가 예약이 K A T Y로 되어 있다고 알려주는 직접 인용문입니다. Katie는 자신이 Katie로 예약했다고 생각했지만 사실은 철자 오류 때문에 K A T Y로 저장되어 있었던 거죠. 이렇게 예약 확인이 되는 순간이 이야기의 전환점이 됩니다.","hl":"mn"},{"n":41,"text":"첫 번째 어법은 be동사 뒤에 전치사구가 보어로 오는 구조입니다. Your reservation is under K A T Y에서 is는 상태를 나타내고 under K A T Y가 주어 Your reservation을 설명하는 보어 역할을 해요. 그래서 예약이 어떤 이름으로 되어 있는지를 나타냅니다. 두 번째 어법은 직접 인용문 뒤에 보도동사인 the receptionist explained가 오는 구조입니다. 이때 인용문은 explained의 목적어처럼 기능하면서 대화를 전달하는 방식이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 12\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">편안한 기분으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">sense \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">ease\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Katie는 지켜봤다\u003c/span>\u003cspan class=\"en\">Katie \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">watched \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 예약이 나타나는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">reservation \u003c/span>\u003cspan class=\"tgt\">appearing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화면에.\u003c/span>\u003cspan class=\"en\">on the screen.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">편안한 기분으로 Katie는 그녀의 예약이 화면에 나타나는 것을 지켜봤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Katie가 예약 정보가 화면에 나타나는 것을 보며 \u003cb class=\"key\">안도\u003c/b>하는 모습을 보여줍니다. 앞선 혼란과 달리 \u003cb class=\"key\">편안한 \u003c/b>\u003cb class=\"key\">기분\u003c/b>으로 바뀌었음을 나타내며, 예약 문제가 해결되었음을 시각적으로 확인하는 장면입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(상황)\u003c/span> : with + 명사구 a sense of ease : \"편안한 기분으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지각동사 + 목적어 + 현재분사\u003c/span> : watch + her reservation + appearing : \"그녀의 예약이 나타나는 것을 지켜봤다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"With a sense of ease, 편안한 기분으로. Katie watched, Katie는 지켜봤다. her reservation appearing, 그녀의 예약이 나타나는 것을. on the screen, 화면에.. 이 문장 전체를 해석하면, 편안한 기분으로 Katie는 그녀의 예약이 화면에 나타나는 것을 지켜봤다.","hl":"m"},{"n":43,"text":"이 문장은 Katie가 예약 정보가 화면에 나타나는 것을 보며 편안한 기분을 느끼는 장면입니다. 앞선 혼란과 달리 이제 안도하는 상태로 바뀌었음을 보여줍니다. 화면에 예약이 나타나는 것은 문제가 해결되었다는 시각적 확인이죠.","hl":"mn"},{"n":44,"text":"첫 번째 어법은 with a sense of ease라는 전치사구입니다. with 다음에 감정을 나타내는 명사가 와서 편안한 기분으로라는 부사적 상황을 만들어 줍니다. 두 번째 어법은 지각동사 watched가 목적어 her reservation과 목적격 보어 appearing을 취하는 구조입니다. watch처럼 지각동사는 목적어 뒤에 동사원형이나 현재분사를 쓸 수 있는데, 예약이 스스로 나타나는 능동과 진행의 의미라 현재분사 appearing이 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 12\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 심장이 완만한 리듬으로 느려지면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">With \u003c/span>\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">heart \u003c/span>\u003cspan class=\"tgt\">slowing \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">gentle \u003c/span>\u003cspan class=\"tgt\">rhythm\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 진행했다\u003c/span>\u003cspan class=\"en\">she proceeded\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">체크인을\u003c/span>\u003cspan class=\"en\">with her check-in,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">thinking \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순한 오타가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">simple \u003c/span>\u003cspan class=\"tgt\">misspelling \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">망쳤을지도 모른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">ruined \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 계획들을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">her \u003c/span>\u003cspan class=\"tgt\">plans\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀의 심장이 완만한 리듬으로 느려지면서, 그녀는 단순한 오타가 그녀의 계획들을 망쳤을지도 모른다고 생각하며 체크인을 진행했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Katie가 심장이 \u003cb class=\"key\">안정\u003c/b>된 채 체크인을 진행하며, 단순한 철자 오타가 자신의 계획을 망쳤을지도 모른다고 생각하는 장면입니다. 글 전체의 주제인 \u003cb class=\"key\">사소한 \u003c/b>\u003cb class=\"key\">실수가 \u003c/b>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">영향을 \u003c/b>\u003cb class=\"key\">미칠 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있다\u003c/b>는 교훈을 Katie의 내적 독백으로 정리합니다. 마지막 문장으로 \u003cb class=\"key\">긴장에서 \u003c/b>\u003cb class=\"key\">이완\u003c/b>으로 이어지는 서사가 완결됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">with + 명사 + 현재분사 (부대상황)\u003c/span> : with + her heart + slowing : \"그녀의 심장이 완만한 리듬으로 느려지면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문 (주절의 의미상 주어와 능동)\u003c/span> : she + thinking + that절 : \"단순한 오타가 그녀의 계획들을 망쳤을지도 모른다고 생각하며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 + have + 과거분사 (과거 가능성 추측)\u003c/span> : might + have + ruined : \"망쳤을지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"With her heart slowing to a gentle rhythm, 그녀의 심장이 완만한 리듬으로 느려지면서. she proceeded, 그녀는 진행했다. with her check-in, 체크인을. thinking, 생각하면서. that a simple misspelling, 단순한 오타가. might have ruined, 망쳤을지도 모른다. her plans, 그녀의 계획들을.. 이 문장 전체를 해석하면, 그녀의 심장이 완만한 리듬으로 느려지면서, 그녀는 단순한 오타가 그녀의 계획들을 망쳤을지도 모른다고 생각하며 체크인을 진행했다.","hl":"m"},{"n":46,"text":"이 문장은 Katie가 심장이 완만한 리듬으로 느려지는 안정된 상태로 체크인을 진행하면서, 단순한 철자 오류가 계획을 망쳤을지도 모른다고 생각하는 장면입니다. 사소한 실수가 큰 영향을 미칠 수 있다는 교훈을 Katie의 내적 독백으로 정리하고 있어요. 이렇게 긴장에서 이완으로 이어지는 서사가 마무리됩니다.","hl":"mn"},{"n":47,"text":"첫 번째 어법은 with her heart slowing to a gentle rhythm에서 with 다음에 명사와 현재분사가 오는 부대상황 표현입니다. 심장이 느려지는 상태와 함께 그녀가 체크인을 진행했음을 나타내요. 두 번째 어법은 thinking that 이하의 분사구문입니다. thinking의 의미상 주어는 주절의 she이고 능동 관계라 현재분사를 썼어요. 세 번째 어법은 might have ruined입니다. 조동사 might에 have 과거분사가 결합하면 과거의 일에 대한 가능성을 추측하는 표현이 되는데, 여기서는 단순한 오타가 계획을 망쳤을지도 모른다는 뜻을 전달합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Katie는 호텔 \u003cb class=\"key\">front \u003c/b>\u003cb class=\"key\">desk\u003c/b>에서 체크인을 하려다 예상 못한 \u003cb class=\"key\">문제\u003c/b>에 부딪혔다.\u003c/li>\u003cli>접수 담당자는 ‘Katie’라는 이름으로 된 \u003cb class=\"key\">예약\u003c/b>을 찾지 못했고, Katie는 \u003cb class=\"key\">전화번호\u003c/b>를 알려 주며 당황했다.\u003c/li>\u003cli>확인 결과 예약은 \u003cb class=\"key\">K-A-T-Y\u003c/b>로 저장된 \u003cb class=\"key\">오타\u003c/b> 때문에 조회되지 않았던 것이었다.\u003c/li>\u003cli>Katie는 \u003cb class=\"key\">안도\u003c/b>하며 체크인을 마쳤고, 단순한 오타가 계획을 \u003cb class=\"key\">망칠\u003c/b> 뻔했음을 깨달았다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A simple misspelling in a hotel reservation nearly caused Katie trouble, but the receptionist found the error and she checked in with relief.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">Katie는 호텔 체크인 중 \u003cb class=\"key\">예약\u003c/b>이 ‘Katie’가 아닌 \u003cb class=\"key\">K-A-T-Y\u003c/b>로 잘못 입력되어 잠시 당황했지만, 접수 담당자의 확인으로 \u003cb class=\"key\">오타\u003c/b>임을 알게 되어 안도하며 체크인을 마쳤다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":48,"text":"오늘 지문은 호텔 체크인 중 벌어진 작은 철자 오류 이야기였습니다. Katie의 예약이 K-A-T-Y로 저장되어 예약을 찾지 못했지만, 전화번호 확인으로 문제를 해결하고 안도하게 됐죠. 일상에서도 이름이나 전화번호 같은 작은 정보가 큰 차이를 만든다는 점을 기억하면 좋겠습니다. 오늘 수업은 여기까지입니다. 모두 수고했어요.","hl":null}]}]});</script></body></html>
