</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}

  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 36번","audioDir":"36_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">36번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Why the Brain Prefers Shortcuts and General Patterns\u003c/h1>\u003ch2>뇌가 지름길과 일반적 패턴을 선호하는 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 이론적으로 뇌는 DVD 품질의 \u003cb class=\"key\">저장 \u003c/b>\u003cb class=\"key\">수용력\u003c/b>을 지녔지만 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">수요\u003c/b>로 인해 상쇄되므로, 뇌는 \u003cb class=\"key\">지름길\u003c/b>과 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>을 통해 정보를 단순화·일반화하여 에너지를 절약한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The brain uses shortcuts and general patterns to simplify and generalize information, saving energy rather than storing every detail.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"오늘 지문은 우리 뇌가 왜 모든 걸 세세하게 저장하지 않고 지름길을 쓰는지에 대한 이야기예요. 요약하면 뇌는 이론상 저장 용량이 크지만 에너지 수요 때문에 효율적인 전략과 일반적인 패턴으로 정보를 단순화하고 일반화해서 에너지를 절약한다는 내용이에요. 요지는 The brain uses shortcuts and general patterns to save energy rather than storing every detail 정도로 정리할 수 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리 뇌는 몸에서 차지하는 비율은 작지만 전체 에너지의 상당 부분을 사용할 정도로 에너지 소비가 큰 기관이에요. 기억을 저장하는 encoding과 다시 꺼내는 retrieval 과정은 혈당과 산소를 많이 요구하죠. 그래서 뇌는 \u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">부하\u003c/b>를 줄이기 위해 반복되는 정보를 pattern recognition으로 일반화하는 전략을 사용합니다. 일상에서 스마트폰 사진을 매번 초고화질로 저장하면 저장 공간과 배터리가 빨리 소모되지만, 자주 쓰는 얼굴만 자동 보정하여 저장하면 훨씬 효율적인 것과 비슷해요. 얼굴 인식 face recognition도 조명과 각도가 달라져도 같은 사람으로 판단할 수 있도록 뇌가 시각 정보를 일정한 틀로 바꿔 기억하는 대표 사례입니다. 이러한 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">효율\u003c/b> 전략은 인지 과정 전체를 빠르고 안정적으로 유지하는 핵심 원리예요.\u003c/div>","segs":[{"n":2,"text":"우리 뇌는 몸에서 차지하는 비율은 작지만 전체 에너지의 상당 부분을 사용할 정도로 에너지 소비가 큰 기관이에요. 기억을 저장하는 encoding과 다시 꺼내는 retrieval은 혈당과 산소를 많이 쓰죠. 그래서 뇌는 cognitive load를 줄이려고 반복되는 정보를 pattern recognition으로 일반화해요. 스마트폰 사진을 매번 초고화질로 저장하면 저장 공간과 배터리가 빨리 닳지만 자주 쓰는 얼굴만 자동 보정해서 저장하면 훨씬 효율적인 것과 비슷하죠. 얼굴 인식 face recognition도 조명과 각도가 달라도 같은 사람으로 판단하도록 뇌가 시각 정보를 일정한 틀로 바꿔 기억하는 사례예요. 이러한 에너지 효율 전략이 인지 과정 전체를 빠르고 안정적으로 유지하는 핵심 원리라고 볼 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이론적 저장 수용력과 에너지 한계\u003csmall>도입·전환 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>이론적으로는 뇌가 DVD 품질 수준으로 삶의 모든 경험을 저장할 수 있는 \u003cb class=\"key\">수용력\u003c/b>을 가졌다고 볼 수 있어요. 하지만 이 이론상의 수용력은 기억을 \u003cb class=\"key\">저장\u003c/b>하고 \u003cb class=\"key\">상기\u003c/b>하는 데 드는 에너지 수요로 상쇄되어요. 그래서 실제로는 무한정 저장하기 어렵다는 반전이 일어나죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>효율적 전략과 지름길 의존\u003csmall>주장 · 문장 3\u003c/small>\u003c/h4>\u003cp>그 결과 뇌는 \u003cb class=\"key\">효율적인 \u003c/b>\u003cb class=\"key\">전략\u003c/b>을 수립하고 \u003cb class=\"key\">지름길\u003c/b>에 의존하게 돼요. 저장과 인출의 에너지 비용을 줄이려는 방향으로 작동하는 거예요. 이것이 뒤에 나올 얼굴 인식 사례의 배경이 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>얼굴 인식의 가변성과 동일성\u003csmall>예시 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>얼굴을 볼 때 눈이 포착하는 시각적 이미지는 \u003cb class=\"key\">시점\u003c/b>, 조명 조건, 상황적 요인에 따라 매우 다양해요. 그런데도 우리는 근본적인 \u003cb class=\"key\">정체성\u003c/b>을 유지하면서 얼굴을 같은 것으로 인식해요. 세부 정보가 달라도 동일인이라는 판단이 유지되는 거죠.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>일반적 패턴 저장과 에너지 절약\u003csmall>근거·주장 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>뇌는 시각화의 세부 사항에 집중하기보다 다양한 상황에서 일관된 인식을 가능하게 하는 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>을 생성하고 저장해요. 이렇게 보이는 것과 일반적인 시각 기억 패턴을 \u003cb class=\"key\">일치\u003c/b>시키는 능력이 뇌 수행을 최적화하고 에너지를 절약해요. 효율성을 위한 핵심 기제인 셈이에요.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>단순화와 일반화의 결론\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>불필요한 노력에 자연스럽게 대항하는 뇌는 인지 과정을 돕기 위해 끊임없이 정보를 \u003cb class=\"key\">단순화\u003c/b>하고 \u003cb class=\"key\">일반화\u003c/b>하려 해요. 최소한의 에너지로 인지 과제를 처리하려는 뇌의 본성이 정리되는 결론이에요.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 이론적인 용량과 현실의 에너지 수요를 먼저 대비한 다음 얼굴 인식 사례를 거쳐 뇌의 일반화 전략으로 마무리되는 흐름이에요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 이론적으로 뇌가 DVD 품질에 도달할 정도로 삶의 모든 경험을 저장할 수 있다는 이야기에서 시작해요. 하지만 이 이론상의 수용력은 기억을 저장하고 상기하는 과정에 드는 에너지 수요로 상쇄되어요. 그래서 실제로는 무한정 저장하기 어렵다는 전환이 일어나죠.","hl":"f0"},{"n":5,"text":"그 결과 뇌는 효율적인 전략을 수립하고 지름길에 의존하게 돼요. 저장과 인출에 드는 에너지 비용을 줄이려는 방향으로 움직이는 거예요. 이 부분이 뒤에 나올 얼굴 인식 사례의 배경이 됩니다.","hl":"f1"},{"n":6,"text":"얼굴을 관찰할 때 눈에 포착되는 시각적 이미지는 시점과 조명 조건 같은 상황적 요인에 따라 아주 다양해요. 그럼에도 불구하고 우리는 근본적인 정체성을 유지하면서 얼굴을 같은 것으로 인식하죠. 세부 정보가 달라도 동일인이라는 판단이 유지되는 겁니다.","hl":"f2"},{"n":7,"text":"뇌는 시각화의 세부 사항에 집중하기보다 다양한 상황에서 일관된 인식을 가능하게 하는 일반적인 패턴을 생성하고 저장해요. 이렇게 보이는 것과 일반적인 시각 기억 패턴을 일치시키는 능력이 뇌 수행을 최적화하고 에너지를 절약하는 효과적인 기제가 되는 거죠. 효율성을 위한 핵심 장치인 셈이에요.","hl":"f3"},{"n":8,"text":"마지막으로 뇌는 불필요한 노력에 자연스럽게 대항하면서 인지 과정을 돕기 위해 끊임없이 정보를 단순화하고 일반화하려 한다고 정리해요. 최소한의 에너지로 인지 과제를 처리하려는 뇌의 본성이 드러나는 결론이에요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 8번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 이론상 모든 경험을 DVD 품질로 저장할 수 있다는 \u003cb class=\"key\">통념\u003c/b>을 제시한 뒤, However를 통해 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">수요\u003c/b>가 이를 상쇄한다고 반박해요. 그 결과 뇌가 \u003cb class=\"key\">효율적인 \u003c/b>\u003cb class=\"key\">전략\u003c/b>과 \u003cb class=\"key\">지름길\u003c/b>을 쓴다는 주장이 도출되고, 얼굴 인식 사례가 이를 뒷받침합니다. 마지막 문장에서 뇌의 \u003cb class=\"key\">단순화\u003c/b>·\u003cb class=\"key\">일반화\u003c/b> 성향이 결론으로 제시되므로 주제문은 마지막에 오는 \u003cb class=\"key\">미괄식\u003c/b> 구조예요.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Theoretically (1)\u003c/b>\u003cspan>이론적 전제 도입\u003c/span>\u003cb>However (2)\u003c/b>\u003cspan>반전·상쇄\u003c/span>\u003cb>As a result (3)\u003c/b>\u003cspan>결과적 전략 도출\u003c/span>\u003cb>When (4)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>Nevertheless (5)\u003c/b>\u003cspan>대조적 예외\u003c/span>\u003cb>rather than (6)\u003c/b>\u003cspan>선택적 대체\u003c/span>\u003cb>This ability (7)\u003c/b>\u003cspan>기제의 가치 강조\u003c/span>\u003cb>being naturally against (8)\u003c/b>\u003cspan>최종 일반화·결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the capacity to store all experiences throughout life\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">theoretical capacity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">efficient strategies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">shortcuts\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">general patterns\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">general visual memory patterns\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">simplify and generalize information\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>세부 저장·이론적 수용력\u003c/th>\u003cth>에너지 절약·일반 패턴\u003c/th>\u003c/tr>\u003ctr>\u003ctd>DVD 품질의 모든 경험 저장\u003c/td>\u003ctd>에너지 수요로 상쇄되고 지름길에 의존\u003c/td>\u003c/tr>\u003ctr>\u003ctd>시각화의 세부 사항에 집중\u003c/td>\u003ctd>다양한 상황에서 일관되게 인식하는 일반적 패턴 생성·저장\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 이론과 현실을 대비하는 통념 반박 구조로 볼 수 있어요. 처음에 이론상 저장 용량을 제시했다가 However로 에너지 수요 때문에 상쇄된다고 반박한 뒤 As a result로 효율 전략을 도출하죠. 결론인 뇌의 단순화 일반화 경향이 마지막 문장에 있어서 미괄식 구조예요. 그래서 초반의 이론적 가능성은 점점 좁혀지고 마지막에 뇌의 실제 작동 원리가 주제로 모이는 글이에요.","hl":"ty"},{"n":10,"text":"첫 문장의 Theoretically가 이론적 전제를 깔고, 두 번째 문장 However가 그 전제를 상쇄해요. As a result는 효율 전략과 지름길 의존이라는 결과를 이끌고, 얼굴 예시 안에서는 Nevertheless가 세부 정보의 가변성과 동일 인식의 안정성을 대조해요. 그리고 rather than과 This ability 같은 표현이 세부 시각화 대신 일반 패턴의 역할을 강조하면서 마지막 결론으로 연결돼요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>theoretically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>이론적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>capacity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수용력, 용량\u003c/span>\u003c/div>\u003cdiv>\u003cb>store\u003c/b>\u003cem>동사\u003c/em>\u003cspan>저장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>offset\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상쇄하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>energy demand\u003c/b>\u003cem>명사\u003c/em>\u003cspan>에너지 수요\u003c/span>\u003c/div>\u003cdiv>\u003cb>retrieve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상기하다, 회수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>memory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기억\u003c/span>\u003c/div>\u003cdiv>\u003cb>as a result\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>결과적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>develop\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발달시키다, 수립하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>efficient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효율적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>strategy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전략\u003c/span>\u003c/div>\u003cdiv>\u003cb>dependent on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 의존하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>shortcut\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지름길\u003c/span>\u003c/div>\u003cdiv>\u003cb>observe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관찰하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>visual image\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시각적 이미지\u003c/span>\u003c/div>\u003cdiv>\u003cb>variable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>변하기 쉬운\u003c/span>\u003c/div>\u003cdiv>\u003cb>depending on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 따라\u003c/span>\u003c/div>\u003cdiv>\u003cb>nevertheless\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그럼에도 불구하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>recognize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>identity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정체성\u003c/span>\u003c/div>\u003cdiv>\u003cb>rather than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다는, 대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>focus on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 집중하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>detail\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세부 사항\u003c/span>\u003c/div>\u003cdiv>\u003cb>general pattern\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일반적인 패턴\u003c/span>\u003c/div>\u003cdiv>\u003cb>match\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일치시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>optimize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>최적화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>save energy\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>에너지를 절약하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>simplify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>단순화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>generalize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일반화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>facilitate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>용이하게 하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이 지문에서 offset은 상쇄하다라는 뜻으로 이론상 수용력이 에너지 수요 때문에 깎인다는 걸 보여 줘요. dependent on은 의존하는이라는 뜻이고 shortcut은 지름길이라는 뜻으로 뇌의 효율 전략을 설명하는 핵심 표현이에요. 또 optimize와 save energy는 뇌 수행을 최적화하고 에너지를 절약한다는 글의 결론과 직결되죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">capacity\u003c/b>\u003cspan class=\"m\">수용력, 능력\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ability\u003c/span>\u003cspan class=\"s\">capability\u003c/span>\u003cspan class=\"s\">power\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inability\u003c/span>\u003cspan class=\" cspan class=\"s\">ease\u003c/span>\u003cspan class=\"s\">assist\u003c/span>\u003cspan class=\"s\">promote\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003cspan class=\"a\">obstruct\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"capacity는 ability, capability와 바꿔 쓸 수 있고 반대는 inability예요. efficient는 effective, productive와 유사하고 inefficient, wasteful가 반대죠. variable은 changeable, unstable과 통하고 constant, stable과 반대예요. optimize는 maximize, enhance와 유사하고 worsen, impair와 반대이며, facilitate는 ease, assist와 유사하고 hinder, obstruct와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이론적으로 우리의 뇌는 수용력을 가지고 있을 것이다.\u003c/span>\u003cspan class=\"en\">Theoretically, our brain \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">capacity\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶의 모든 경험들을 저장할.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">store \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">experiences \u003c/span>\u003cspan class=\"tgt\">throughout \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">DVD의 품질에 도달하면서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">reaching \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">quality \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">DVD\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이론적으로는 우리의 뇌는 DVD의 품질에 도달할 정도로, 삶의 모든 경험들을 저장할 수 있는 수용력을 가지고 있을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 뇌가 이론적으로는 삶의 모든 경험을 저장할 \u003cb class=\"key\">이론적 \u003c/b>\u003cb class=\"key\">수용력\u003c/b>을 가진다는 가정을 제시한다. would have는 과거의 will이 아니라 이론적 상황을 가정하는 \u003cb class=\"key\">가정과 \u003c/b>\u003cb class=\"key\">추측\u003c/b> 표현이다. 뒤에 에너지 문제로 이 수용력이 상쇄되는 내용과 대비되는 출발점 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 would의 가정과 추측 용법\u003c/span> : would + have + 명사구 : \"~을 가지고 있을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the capacity + to store (to부정사구) : \"삶의 모든 경험들을 저장할\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : ..., reaching + 명사구 : \"DVD의 품질에 도달하면서\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Theoretically, our brain would have the capacity, 이론적으로 우리의 뇌는 수용력을 가지고 있을 것이다.. to store all experiences throughout life, 삶의 모든 경험들을 저장할.. reaching the quality of a DVD, DVD의 품질에 도달하면서.. 이 문장 전체를 해석하면, 이론적으로는 우리의 뇌는 DVD의 품질에 도달할 정도로, 삶의 모든 경험들을 저장할 수 있는 수용력을 가지고 있을 것이다.","hl":"m"},{"n":14,"text":"이 문장은 뇌가 이론적으로는 모든 경험을 저장할 수 있는 이론적 수용력을 가진다는 가정을 먼저 제시하는 부분이에요. 여기서 would have는 과거의 will이 아니라 이론적인 가정과 추측을 나타내는 표현이죠. 뒤에서 에너지 수요 때문에 이 수용력이 상쇄된다는 내용과 대비되는 출발점이에요.","hl":"mn"},{"n":15,"text":"첫 번째 포인트는 would have the capacity입니다. 이때 would는 과거의 will이 아니라 이론적인 가정이나 추측을 나타내는 조동사예요. 두 번째로 to store는 앞에 나온 the capacity를 수식하는 to부정사의 형용사적 용법이에요. 세 번째로 reaching the quality of a DVD는 분사구문으로, 주절의 결과를 덧붙여 주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 이 이론상의 수용력은\u003c/span>\u003cspan class=\"en\">However, this theoretical capacity\u003c/span>\u003c/div> iv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사\u003c/span> : 전치사 of + 동명사구 : \"기억에 정보를 저장하고 상기하는 것\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"However, this theoretical capacity, 그러나 이 이론상의 수용력은. is offset by the energy demand, 에너지 수요에 의해 상쇄된다. associated with the process, 과정과 관련된. of storing and retrieving information in memory, 기억에 정보를 저장하고 상기하는. 이 문장 전체를 해석하면, 그러나, 이 이론상의 수용력은 기억에 정보를 저장하고 상기하는 과정과 관련된 에너지 수요로 인해 상쇄된다.","hl":"m"},{"n":17,"text":"이 문장은 앞에서 말한 이론적 수용력이 에너지 수요 때문에 현실에서는 상쇄된다는 것을 설명해요. 정보를 기억에 저장하고 다시 상기하는 과정에는 에너지가 많이 들기 때문에 뇌가 모든 경험을 저장하기 어렵다는 흐름으로 이어지죠.","hl":"mn"},{"n":18,"text":"첫 번째 포인트는 is offset by입니다. 주어 this theoretical capacity가 상쇄되는 대상이기 때문에 수동태로 표현됐어요. 두 번째로 associated with the process는 앞의 the energy demand를 뒤에서 수식하는 과거분사구예요. 세 번째로 storing and retrieving information in memory는 전치사 of의 목적어로 쓰인 동명사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 결과\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">result\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌는 효율적인 전략들을 수립하고\u003c/span>\u003cspan class=\"en\">the brain \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">develops \u003c/span>\u003cspan class=\"tgt\">efficient \u003c/span>\u003cspan class=\"tgt\">strategies\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지름길에 의존하게 된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">becoming \u003c/span>\u003cspan class=\"tgt\">dependent \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">shortcuts\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 결과, 뇌는 효율적인 전략들을 수립하고, 지름길에 의존하게 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 에너지 문제 때문에 뇌가 선택하는 \u003cb class=\"key\">효율적 \u003c/b>\u003cb class=\"key\">전략\u003c/b>이 무엇인지 구체화한다. 뇌는 모든 정보를 일일이 저장하기보다 \u003cb class=\"key\">지름길\u003c/b>에 의존하면서 에너지를 아끼려 한다는 핵심 주제를 제시한다. 이는 다음에 나오는 얼굴 인식의 예로 연결되는 중심 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속 부사\u003c/span> : As a result, + 문장 : \"그 결과\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">단순 현재\u003c/span> : 주어 + develops + 목적어 : \"효율적인 전략들을 수립한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : ..., becoming dependent on + 명사구 : \"지름길에 의존하게 되면서\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"As a result, 그 결과. the brain develops efficient strategies, 뇌는 효율적인 전략들을 수립하고. becoming dependent on shortcuts, 지름길에 의존하게 된다. 이 문장 전체를 해석하면, 그 결과, 뇌는 효율적인 전략들을 수립하고, 지름길에 의존하게 된다.","hl":"m"},{"n":20,"text":"이 문장은 에너지 문제 때문에 뇌가 선택하는 방법이 효율적 전략과 지름길이라는 것을 구체적으로 보여 줍니다. 뇌는 모든 정보를 세세하게 처리하기보다 단순하고 빠른 길을 택해서 에너지를 아끼려 한다는 핵심 주제를 제시해요. 바로 다음에 얼굴 인식의 예가 이어지는 중심 문장이에요.","hl":"mn"},{"n":21,"text":"첫 번째 포인트는 As a result입니다. 앞 문장의 결과를 이끄는 연결어예요. 두 번째로 develops efficient strategies는 일반적 사실을 나타내는 단순 현재 문장이에요. 세 번째로 becoming dependent on shortcuts는 분사구문으로, 주절의 결과를 덧붙여 주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 얼굴을 관찰할 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">observe \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">face\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈에 의해 포착되는 시각적 이미지는\u003c/span>\u003cspan class=\"en\">the visual image \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">captured \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">eyes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매우 다양하다,\u003c/span>\u003cspan class=\"en\">is highly variable,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시점, 조명 조건 및 기타 상황적 요인들에 따라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">depending \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">point \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">view, \u003c/span>\u003cspan class=\"tgt\">lighting \u003c/span>\u003cspan class=\"tgt\">conditions \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">contextual \u003c/span>\u003cspan class=\"tgt\">factors\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 얼굴을 관찰할 때, 눈에 의해 포착되는 시각적 이미지는 시점, 조명 조건 및 기타 상황적 요인들에 따라 매우 다양하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 얼굴을 볼 때 눈에 들어오는 이미지는 시점이나 \u003cb class=\"key\">조명 \u003c/b>\u003cb class=\"key\">조건\u003c/b> 같은 외부 요인에 따라 매번 달라질 수 있다는 뜻입니다. 즉 같은 얼굴이라도 보는 각도와 빛에 따라 시각 정보가 크게 달라진다는 \u003cb class=\"key\">가변성\u003c/b>을 말해요. 이 문장은 뒤에서 뇌가 \u003cb class=\"key\">일관된 \u003c/b>\u003cb class=\"key\">얼굴 \u003c/b>\u003cb class=\"key\">인식\u003c/b>을 해내는 것과 대비되는 전제 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절 (when)\u003c/span> : When + 주어 + 동사, 주절 : \"우리가 얼굴을 관찰할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구 (수동)\u003c/span> : [the visual image] + [captured by the eyes (과거분사구)] : \"눈에 의해 포착되는 (시각적 이미지)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문 (부대 상황)\u003c/span> : [주절], depending on + 명사구 : \"시점, 조명 조건 및 기타 상황적 요인들에 따라\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"When we observe a face, 우리가 얼굴을 관찰할 때.  the visual image captured by the eyes, 눈에 의해 포착되는 시각적 이미지는.  is highly variable, 매우 다양하다.  depending on the point of view, lighting conditions and other contextual factors, 시점, 조명 조건 및 기타 상황적 요인들에 따라. 이 문장 전체를 해석하면, 우리가 얼굴을 관찰할 때, 눈에 의해 포착되는 시각적 이미지는 시점, 조명 조건 및 기타 상황적 요인들에 따라 매우 다양하다.","hl":"m"},{"n":23,"text":"이 문장은 얼굴을 볼 때 눈에 들어오는 이미지가 보는 각도나 조명 조건 같은 외부 요인에 따라 매번 달라질 수 있다는 뜻이에요. 즉 같은 얼굴이라도 시각 정보 자체는 아주 가변적이라는 말이죠. 이렇게 시각 정보가 변하기 때문에 뒤에서 뇌가 일관된 얼굴 인식을 해내는 것이 더 두드러지는 거예요.","hl":"mn"},{"n":24,"text":"첫 번째 포인트는 When we observe a face라는 부분입니다. When이 이끄는 시간 부사절이 뒤 주절의 시점을 설정해 주고, 부사절이 앞에 오니까 comma로 주절과 구분해요. 두 번째 포인트는 captured by the eyes라는 부분입니다. 이 captured는 과거분사구로 앞의 the visual image를 수식해요. 이미지가 눈에 포착되는 수동 관계이기 때문에 과거분사가 쓰였죠. 세 번째 포인트는 depending on 이하 부분입니다. 주절 전체에 대한 부가 정보를 덧붙이는 분사구문으로, 시점과 조명 같은 조건에 따라 이미지가 달라진다는 뜻을 더해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그럼에도 불구하고,\u003c/span>\u003cspan class=\"en\">Nevertheless,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 얼굴을 인식할 수 있다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">recognize\u003c/span> the face\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">같은 것으로,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근본적인 정체성을 유지하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">maintaining \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">underlying \u003c/span>\u003cspan class=\"tgt\">identity\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그럼에도 불구하고, 우리는 근본적인 정체성을 유지하면서 얼굴을 같은 것으로 인식할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 시각 이미지가 크게 달라진다고 했지만, 그럼에도 우리는 얼굴을 같은 사람으로 알아본다는 뜻입니다. 그 핵심은 \u003cb class=\"key\">근본적인 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 유지한다는 점이며, 달라지는 겉모습 뒤에 변하지 않는 \u003cb class=\"key\">정체성\u003c/b>이 있다는 의미를 담고 있어요. 따라서 이 문장은 시각적 변동성에도 불구하고 \u003cb class=\"key\">일관된 \u003c/b>\u003cb class=\"key\">인식\u003c/b>이 가능하다는 전환점 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가능 표현 (be able to)\u003c/span> : be able to + 동사원형 : \"~할 수 있다, 인식할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as (동일)\u003c/span> : recognize + 목적어 + as + 보어 : \"같은 것으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문 (동시동작)\u003c/span> : [주절], + [~ing (분사구문)] : \"근본적인 정체성을 유지하면서\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Nevertheless, 그럼에도 불구하고.  we are able to recognize the face, 우리는 얼굴을 인식할 수 있다.  as the same, 같은 것으로.  maintaining the underlying identity, 근본적인 정체성을 유지하면서. 이 문장 전체를 해석하면, 그럼에도 불구하고, 우리는 근본적인 정체성을 유지하면서 얼굴을 같은 것으로 인식할 수 있다.","hl":"m"},{"n":26,"text":"이 문장은 앞에서 본 시각 이미지가 아무리 달라져도, 우리는 얼굴을 같은 사람으로 인식할 수 있다는 뜻이에요. 달라지는 겉모습 뒤에 변하지 않는 근본적인 정체성이 유지되기 때문이죠. 이 전환을 통해 뒤에 나올 뇌의 일반적인 패턴 이야기로 자연스럽게 이어져요.","hl":"mn"},{"n":27,"text":"첫 번째 포인트는 are able to recognize라는 표현입니다. be able to는 can과 비슷한 가능 표현인데, 여기서는 주어가 we이기 때문에 are able to로 쓰였어요. to 뒤에는 동사원형 recognize가 와서 인식할 수 있다는 능력의 의미를 만들어요. 두 번째 포인트는 as the same라는 부분입니다. recognize A as B 구문은 A를 B로 인식하다라는 뜻으로, 여기서 as 뒤의 the same이 목적어 the face를 설명하는 보어 역할을 해요. 세 번째 포인트는 maintaining the underlying identity라는 부분입니다. 주절의 동작과 동시에 정체성을 유지한다는 부대 상황을 나타내는 분사구문이고, 주어 we가 능동적으로 유지하는 것이므로 현재분사 maintaining을 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌는,\u003c/span>\u003cspan class=\"en\">The brain,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시각화의 세부 사항에 집중하기보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">focusing \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">details \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">visualization\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반적인 패턴을 생성하고 저장한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">creates \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">stores \u003c/span>\u003cspan class=\"tgt\">general \u003c/span>\u003cspan class=\"tgt\">patterns\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일관된 인식을 가능하게 하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">allow \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">consistent \u003c/span>\u003cspan class=\"tgt\">recognition \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 상황들에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">across \u003c/span>\u003cspan class=\"tgt\">diverse \u003c/span>\u003cspan class=\"tgt\">circumstances\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">뇌는 시각화의 세부 사항에 집중하기보다 다양한 상황들에서 일관된 인식을 가능하게 하는 일반적인 패턴을 생성하고 저장한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뇌는 시각적 세부 사항을 일일이 기억하기보다, 여러 상황에서도 같은 얼굴을 알아볼 수 있게 해 주는 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>을 만들어 저장한다는 뜻입니다. 이는 뇌가 에너지를 아끼기 위해 \u003cb class=\"key\">단순화와 \u003c/b>\u003cb class=\"key\">일반화\u003c/b> 전략을 쓴다는 글의 핵심 주장을 구체적으로 보여 줍니다. 특히 세부 사항보다 \u003cb class=\"key\">일관된 \u003c/b>\u003cb class=\"key\">인식\u003c/b>을 가능하게 하는 패턴에 집중한다는 점이 중요해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">rather than + 동명사 (대조)\u003c/span> : rather than + [focusing on ... (동명사구)] : \"시각화의 세부 사항에 집중하기보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조 (등위접속사 and)\u003c/span> : creates and stores + 목적어 : \"일반적인 패턴을 생성하고 저장한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : [선행사] + [that + 동사 + ~] : \"다양한 상황들에서 일관된 인식을 가능하게 하는\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"The brain, 뇌는.  rather than focusing on the details of visualization, 시각화의 세부 사항에 집중하기보다.  creates and stores general patterns, 일반적인 패턴을 생성하고 저장한다.  that allow for consistent recognition, 일관된 인식을 가능하게 하는.  across diverse circumstances, 다양한 상황들에서. 이 문장 전체를 해석하면, 뇌는 시각화의 세부 사항에 집중하기보다 다양한 상황들에서 일관된 인식을 가능하게 하는 일반적인 패턴을 생성하고 저장한다.","hl":"m"},{"n":29,"text":"이 문장은 뇌가 시각적 세부 사항을 일일이 기억하기보다는, 다양한 상황에서도 같은 얼굴을 알아볼 수 있게 해 주는 일반적인 패턴을 만들어 저장한다는 뜻이에요. 뇌가 에너지를 아끼기 위해 단순화와 일반화 전략을 쓴다는 글의 핵심 주장을 구체적으로 보여 주는 문장이죠. 세부 사항보다 일관된 인식을 가능하게 하는 패턴에 집중한다는 점이 중요해요.","hl":"mn"},{"n":30,"text":"첫 번째 포인트는 rather than focusing on the details of visualization 부분입니다. rather than 뒤에 동명사구 focusing이 와서 본동사 creates and stores와 대조되는 행동을 나타내요. 뒤의 내용을 부정하면서 앞의 선택을 강조하는 표현이에요. 두 번째 포인트는 creates and stores general patterns 부분입니다. 두 동사가 and로 병렬 연결되어 같은 주어 The brain과 목적어 general patterns를 공유하죠. 세 번째 포인트는 that allow for consistent recognition across diverse circumstances 부분입니다. 이 that은 선행사 general patterns를 수식하는 주격 관계대명사예요. allow for는 일관된 인식을 가능하게 하다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 보는 것을 일치시키는 이 능력은\u003c/span>\u003cspan class=\"en\">This ability \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">match \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반적인 시각 기억 패턴과\u003c/span>\u003cspan class=\"en\">with general visual memory patterns\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">효과적인 기제로 작용한다\u003c/span>\u003cspan class=\"en\">serves as an effective mechanism\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌 수행을 최적화하고 에너지를 절약하기 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">optimizing \u003c/span>\u003cspan class=\"tgt\">brain \u003c/span>\u003cspan class=\"tgt\">performance \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">saving \u003c/span>\u003cspan class=\"tgt\">energy\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 보는 것과 일반적인 시각 기억 패턴을 일치시키는 이 능력은 뇌의 수행을 최적화하고 에너지를 절약하는 효과적인 기제로 작용한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 우리가 보는 것을 일반적인 \u003cb class=\"key\">기억 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>과 일치시키는 능력이 뇌의 \u003cb class=\"key\">수행 \u003c/b>\u003cb class=\"key\">최적화\u003c/b>와 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">절약\u003c/b>을 위한 효과적인 기제라고 정리해요. 앞서 얼굴 인식 사례를 통해 설명한 뇌의 일반화 전략이 실제로는 에너지 수요를 줄이기 위한 효율적인 장치임을 보여 줍니다. 즉 세부 정보를 다 저장하지 않고 패턴을 활용하는 것이 낭비를 막는 핵심 방법이라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : ability [추상명사] + [to match what we see (to부정사구/형용사적 수식)] : \"우리가 보는 것을 일치시키는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : [what we see (관계대명사절/명사절)] : \"우리가 보는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사\u003c/span> : for [optimizing brain performance and saving energy (동명사구/전치사의 목적어)] : \"뇌 수행을 최적화하고 에너지를 절약하기 위한\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"This ability to match what we see, 우리가 보는 것을 일치시키는 이 능력은. with general visual memory patterns, 일반적인 시각 기억 패턴과. serves as an effective mechanism, 효과적인 기제로 작용한다. for optimizing brain performance and saving energy, 뇌 수행을 최적화하고 에너지를 절약하기 위한. 이 문장 전체를 해석하면, 우리가 보는 것과 일반적인 시각 기억 패턴을 일치시키는 이 능력은 뇌의 수행을 최적화하고 에너지를 절약하는 효과적인 기제로 작용한다.","hl":"m"},{"n":32,"text":"이 문장은 우리가 보는 것을 일반적인 기억 패턴과 일치시키는 능력이 뇌 수행 최적화와 에너지 절약을 위한 효과적인 기제라고 정리해 줍니다. 앞서 얼굴을 인식할 때 세부 정보보다 일반적인 패턴을 사용한다고 한 내용을 받아서, 그 전략이 에너지를 아끼기 위한 효율적인 장치임을 보여 줘요. 결국 세부 정보를 모두 저장하지 않고 패턴을 활용하는 것이 뇌의 낭비를 막는 핵심 방법이라는 뜻이에요.","hl":"mn"},{"n":33,"text":"어법 포인트는 세 가지예요. 첫째, ability to match에서 to match는 ability를 수식하는 to부정사의 형용사적 용법이에요. ability처럼 추상 명사 뒤에서 그 명사의 내용을 설명해 주죠. 둘째, what we see에서 what은 선행사를 포함한 관계대명사예요. 우리가 보는 것이라는 뜻으로 match의 목적어 자리에 명사절을 이끌어요. 셋째, for optimizing brain performance and saving energy에서 optimizing과 saving은 전치사 for의 목적어로 쓰인 동명사입니다. 전치사 뒤에는 명사 역할을 하는 동명사를 써야 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌는\u003c/span>\u003cspan class=\"en\">The brain,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불필요한 노력에 자연스럽게 대항하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">naturally \u003c/span>\u003cspan class=\"tgt\">against \u003c/span>\u003cspan class=\"tgt\">unnecessary \u003c/span>\u003cspan class=\"tgt\">effort\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끊임없이 정보를 단순화하고 일반화하는 것을 추구한다\u003c/span>\u003cspan class=\"en\">constantly \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">seeks \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">simplify \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">generalize \u003c/span>\u003cspan class=\"tgt\">information\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인지 과정을 돕기 위해서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">facilitate \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">cognitive \u003c/span>\u003cspan class=\"tgt\">process\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">불필요한 노력에 자연스럽게 대항하는 뇌는 인지 과정을 돕기 위해서 끊임없이 정보를 단순화하고 일반화하는 것을 추구한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 뇌가 원래 \u003cb class=\"key\">불필요한 \u003c/b>\u003cb class=\"key\">노력\u003c/b>을 싫어해서 인지 과정을 돕기 위해 정보를 \u003cb class=\"key\">단순화\u003c/b>하고 \u003cb class=\"key\">일반화\u003c/b>하려는 성향을 요약해요. 앞 문장에서 말한 에너지 절약 전략을 뇌의 본성과 연결하며 지문 전체의 결론을 제시합니다. 결국 뇌는 세부 정보를 모두 처리하기보다는 일반적인 패턴을 만들어 효율을 높이려는 것이죠.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : [being naturally against unnecessary effort (분사구문/주절 수식)] : \"불필요한 노력에 자연스럽게 대항하면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법\u003c/span> : seek [타동사] + [to simplify and generalize information (to부정사구/목적어)] : \"정보를 단순화하고 일반화하는 것을 추구한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : [to facilitate the cognitive process (to부정사구/목적)] : \"인지 과정을 돕기 위해서\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"The brain, 뇌는. being naturally against unnecessary effort, 불필요한 노력에 자연스럽게 대항하면서. constantly seeks to simplify and generalize information, 끊임없이 정보를 단순화하고 일반화하는 것을 추구한다. to facilitate the cognitive process, 인지 과정을 돕기 위해서. 이 문장 전체를 해석하면, 불필요한 노력에 자연스럽게 대항하는 뇌는 인지 과정을 돕기 위해서 끊임없이 정보를 단순화하고 일반화하는 것을 추구한다.","hl":"m"},{"n":35,"text":"이 문장은 뇌가 원래 불필요한 노력을 싫어해서 인지 과정을 돕기 위해 정보를 단순화하고 일반화하려는 성향을 요약해 주는 문장입니다. 앞 문장에서 말한 에너지 절약 전략을 뇌의 본성과 연결하면서 지문 전체의 결론을 제시해요. 즉 세부 정보를 다 처리하기보다는 일반적인 패턴을 만들어 효율을 높이려는 것이죠.","hl":"mn"},{"n":36,"text":"어법 포인트는 세 가지예요. 첫째, being naturally against unnecessary effort는 주절의 주어 The brain을 수식하는 분사구문이에요. 의미상 주어가 주절과 같아서 생략된 형태이고, 이유나 부대 상황을 나타냅니다. 둘째, seeks to simplify and generalize information에서 to simplify와 generalize는 seeks의 목적어 역할을 하는 to부정사의 명사적 용법이에요. seek는 to부정사를 목적어로 취하는 대표적인 동사입니다. 셋째, to facilitate the cognitive process에서 to facilitate는 목적을 나타내는 to부정사의 부사적 용법이에요. 인지 과정을 돕기 위해서라는 뜻으로 해석합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>뇌는 이론적으로 DVD 품질의 \u003cb class=\"key\">저장 \u003c/b>\u003cb class=\"key\">수용력\u003c/b>을 가지지만, 기억의 저장·상기에 필요한 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">수요\u003c/b> 때문에 실제로는 상쇄된다.\u003c/li>\u003cli>그 결과 뇌는 \u003cb class=\"key\">효율적인 \u003c/b>\u003cb class=\"key\">전략\u003c/b>을 수립하고 정보 처리의 \u003cb class=\"key\">지름길\u003c/b>에 의존하게 된다.\u003c/li>\u003cli>얼굴 인식에서는 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">이미지\u003c/b>가 달라도 \u003cb class=\"key\">근본적인 \u003c/b>\u003cb class=\"key\">정체성\u003c/b>을 유지하며, 뇌는 세부보다 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>을 저장한다.\u003c/li>\u003cli>이런 패턴 일치는 뇌 수행을 \u003cb class=\"key\">최적화\u003c/b>하고 에너지를 \u003cb class=\"key\">절약\u003c/b>하며, 뇌는 정보를 \u003cb class=\"key\">단순화\u003c/b>·\u003cb class=\"key\">일반화\u003c/b>하려는 경향을 보인다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The brain uses shortcuts and general patterns to simplify and generalize information, saving energy rather than storing every detail.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 이론적으로 뇌는 DVD 품질의 \u003cb class=\"key\">저장 \u003c/b>\u003cb class=\"key\">수용력\u003c/b>을 지녔지만 \u003cb class=\"key\">에너지 \u003c/b>\u003cb class=\"key\">수요\u003c/b>로 인해 상쇄되므로, 뇌는 \u003cb class=\"key\">지름길\u003c/b>과 \u003cb class=\"key\">일반적인 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>을 통해 정보를 단순화·일반화하여 에너지를 절약한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"오늘 지문은 뇌가 왜 세부적인 정보를 모두 저장하지 않는지를 이론과 에너지 수요의 대비로 설명했어요. 얼굴 인식 사례에서 보듯 뇌는 일반적인 패턴을 만들어 다양한 상황에서도 같은 대상을 인식하고 에너지를 아껴요. 결국 뇌는 불필요한 노력을 피하려고 정보를 단순화하고 일반화하는 방향으로 작동한다는 점을 기억해 두세요. 오늘 수업은 여기까지입니다.","hl":null}]}]});</script></body></html>
