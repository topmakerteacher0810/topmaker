  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}

}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 38번","audioDir":"38_audio","preview":false,"count":34,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">38번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Contrary Claims on Literature and Action\u003c/h1>\u003ch2>문학과 행동의 상반된 주장\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>문학과 행동의 관계에 대해 \u003cb class=\"key\">상반된 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이 존재한다. 문학이 \u003cb class=\"key\">고독한 \u003c/b>\u003cb class=\"key\">독서\u003c/b>와 \u003cb class=\"key\">수동성\u003c/b>을 부추긴다는 입장과, \u003cb class=\"key\">권위에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">의문\u003c/b>과 \u003cb class=\"key\">불의 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 일깨워 \u003cb class=\"key\">변화\u003c/b>를 이끈다는 입장이 대립하며, 『톰 아저씨의 오두막』이 그 예시이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Literature has been seen both as promoting solitary reflection and passivity and as encouraging the questioning of authority and a sense of injustice that can lead to social change, as exemplified by Uncle Tom's Cabin.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 살펴볼 지문은 문학이 행동에 미치는 영향에 대한 상반된 주장을 다룬 글입니다. 이 글은 문학이 고독한 독서와 수동성을 부추긴다는 입장과 권위에 대한 의문과 불의 감정을 일깨워 사회 변화를 이끌어 낸다는 입장이 대립한다는 내용을 담고 있어요. 요지는 문학이 개인을 현실에 안주하게 만들 수도 있지만, 동시에 사회 변화의 동력이 될 수도 있다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">문학과 사회 변화의 관계는 오래된 논쟁거리입니다. 어떤 학자들은 문학이 \u003cb class=\"key\">고독한 \u003c/b>\u003cb class=\"key\">성찰\u003c/b>을 불러일으켜 개인을 사회적 투쟁에서 멀어지게 한다고 보았습니다. 반대로 다른 학자들은 문학이 \u003cb class=\"key\">권위에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">의문\u003c/b>과 \u003cb class=\"key\">불의 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 일깨워 사회 변화의 도화선이 된다고 주장했습니다. 플라톤은 시인이 감정을 자극하고 이성을 흐린다며 이상 국가에서 시인을 추방해야 한다고 했으며, 이는 문학의 정치적 힘을 인정한 셈입니다. 『톰 아저씨의 오두막』 같은 소설이 여론을 바꾼 사례는 현대의 소설이 사회 운동에 미친 영향을 잘 보여 줍니다. 책은 \u003cb class=\"key\">거울\u003c/b>처럼 혼자 생각하게 할 수도, \u003cb class=\"key\">망치\u003c/b>처럼 사회를 깨우는 도구가 될 수도 있습니다.\u003c/div>","segs":[{"n":2,"text":"문학과 사회 변화의 관계는 오래된 논쟁거리예요. 어떤 이들은 문학이 고독한 성찰을 불러일으켜 사람들을 사회적 투쟁에서 멀어지게 한다고 보았어요. 반대로 다른 이들은 문학이 권위에 대한 의문과 불의에 대한 감정을 일깨워 사회 변화의 도화선이 된다고 주장했죠. 플라톤은 시인이 감정을 자극하고 이성을 흐린다며 이상 국가에서 시인을 추방해야 한다고 했는데, 이는 문학의 정치적 힘을 인정한 셈이에요. 톰 아저씨의 오두막 같은 소설이 여론을 바꾼 사례는 문학이 현실 변화에 개입할 수 있음을 잘 보여 줘요. 책은 거울처럼 혼자 생각하게 할 수도 있고, 망치처럼 사회를 깨우는 도구가 될 수도 있다는 비유로 기억하면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>상반된 주장의 제시\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>문학과 행동의 관계에 대해 \u003cb class=\"key\">상반된 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이 있음을 알리며 글을 시작한다. 이 문장은 글 전체의 \u003cb class=\"key\">주제문\u003c/b> 역할을 하면서 앞으로 두 입장을 대조할 것임을 예고한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>문학의 수동적 효과\u003csmall>통념/주장 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>이론가들은 문학이 \u003cb class=\"key\">고독한 \u003c/b>\u003cb class=\"key\">독서\u003c/b>와 성찰을 장려하고 사회적·정치적 활동을 \u003cb class=\"key\">거스른다\u003c/b>고 주장한다. 이 관점에서 문학은 기껏해야 \u003cb class=\"key\">단절\u003c/b>이나 복잡성에 대한 인정을, 최악의 경우 \u003cb class=\"key\">수동성\u003c/b>과 현실 수용을 낳는다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>문학의 위험한 효과\u003csmall>전환/대조 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>그러나 문학은 역사적으로 \u003cb class=\"key\">권위\u003c/b>와 사회적 합의에 대한 \u003cb class=\"key\">의문 \u003c/b>\u003cb class=\"key\">제기\u003c/b>를 촉진해 \u003cb class=\"key\">위험\u003c/b>하게 여겨져 왔다. 플라톤이 시인을 \u003cb class=\"key\">추방\u003c/b>했고, 소설은 사람들을 불만족스럽고 새로운 것을 \u003cb class=\"key\">갈망\u003c/b>하게 한다고 믿어졌다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>동일시의 양면성\u003csmall>양면성/보완 · 문장 6\u003c/small>\u003c/h4>\u003cp>책은 계급·성별·인종의 경계를 넘는 \u003cb class=\"key\">동일시\u003c/b>를 통해 투쟁을 단념시키는 \u003cb class=\"key\">동료 \u003c/b>\u003cb class=\"key\">의식\u003c/b>을 만들 수도 있다. 하지만 같은 동일시가 \u003cb class=\"key\">불의 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 일깨워 \u003cb class=\"key\">진보적 \u003c/b>\u003cb class=\"key\">투쟁\u003c/b>을 가능하게 할 수도 있다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>역사적 사례\u003csmall>예시/근거 · 문장 7\u003c/small>\u003c/h4>\u003cp>역사적으로 문학 작품은 변화를 만들어 낸다고 평가되어 왔다. 『톰 아저씨의 오두막』은 \u003cb class=\"key\">노예제\u003c/b>에 대한 \u003cb class=\"key\">혐오감\u003c/b>을 조성해 \u003cb class=\"key\">미국 \u003c/b>\u003cb class=\"key\">남북 \u003c/b>\u003cb class=\"key\">전쟁\u003c/b>을 가능하게 했다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 크게 도입, 수동적 효과, 위험한 효과, 동일시의 양면성, 역사적 사례의 다섯 단계로 흐름이 이어집니다.","hl":null},{"n":4,"text":"첫 번째 문장은 문학과 행동의 관계에 대한 상반된 주장이 있음을 알리며 글을 시작해요. 이 문장은 글 전체의 주제문 역할을 하면서 앞으로 두 입장을 대조할 것임을 예고합니다.","hl":"f0"},{"n":5,"text":"두 번째와 세 번째 문장에서는 이론가들의 주장을 소개해요. 문학이 고독한 독서와 성찰을 장려하고 사회적 정치적 활동을 거스른다는 것이 핵심이에요. 이 관점에서 문학은 기껏해야 단절이나 복잡성에 대한 인정을, 최악의 경우 수동성과 현실 수용을 낳는다고 합니다.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장은 분위기가 전환돼요. 문학은 역사적으로 권위와 사회적 합의에 대한 의문 제기를 촉진해 위험하게 여겨져 왔다는 두 번째 관점이 나옵니다. 플라톤이 시인을 이상 국가에서 추방했고, 소설은 사람들을 불만족스럽고 새로운 것을 갈망하게 한다고 믿어져 왔어요.","hl":"f2"},{"n":7,"text":"여섯 번째 문장에서는 동일시의 양면성을 짚어요. 책은 계급, 성별, 인종의 경계를 넘는 동일시를 통해 투쟁을 단념시키는 동료 의식을 만들 수도 있지만, 동시에 강한 불의 감정을 일깨워 진보적인 투쟁을 가능하게 할 수도 있습니다.","hl":"f3"},{"n":8,"text":"마지막 일곱 번째 문장은 역사적 사례를 들어요. 톰 아저씨의 오두막은 당대의 베스트셀러로서 노예제에 대한 혐오감을 조성했고, 그것이 미국 남북 전쟁을 가능하게 했다는 설명입니다. 이 사례는 문학이 실제로 변화를 만들어 낼 수 있다는 두 번째 관점을 강하게 뒷받침합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 첫 문장에서 문학과 행동의 관계에 대한 \u003cb class=\"key\">상반된 \u003c/b>\u003cb class=\"key\">주장\u003c/b>을 제시하며 시작한다. 이후 문장 2~3에서 문학이 \u003cb class=\"key\">고독한 \u003c/b>\u003cb class=\"key\">독서\u003c/b>와 \u003cb class=\"key\">수동성\u003c/b>을 부추긴다는 첫 번째 관점을, 문장 4~5에서 문학이 \u003cb class=\"key\">권위에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">의문\u003c/b>을 촉진한다는 두 번째 관점을 대조한다. 문장 6은 동일시의 \u003cb class=\"key\">양면성\u003c/b>, 문장 7은 역사적 사례를 제시하여 두 번째 관점에 무게를 싣는다. 주제가 첫머리에 제시되므로 \u003cb class=\"key\">두괄식\u003c/b> 구조로 볼 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But on the other hand (4)\u003c/b>\u003cspan>상반된 두 번째 관점으로 전환\u003c/span>\u003cb>Historically (7)\u003c/b>\u003cspan>역사적 근거·사례 제시\u003c/span>\u003cb>but (6)\u003c/b>\u003cspan>같은 동일시의 양면적 결과 대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">dangerous\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">questioning of authority and social arrangements\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">dissatisfied with their lives and eager for something new\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a keen sense of injustice\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">producing change\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>문학의 수동적 기능 (고독한 독서와 성찰)\u003c/th>\u003cth>문학의 능동적·사회적 기능 (권위에 대한 의문 제기)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>고독한 독서와 성찰을 장려함\u003c/td>\u003ctd>권위와 사회적 합의에 의문을 제기함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>단절·복잡성 인정·수동성을 낳음\u003c/td>\u003ctd>불만족과 새로운 것에 대한 갈망을 일으킴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>투쟁을 단념시키는 동료 의식을 만들 수 있음\u003c/td>\u003ctd>강한 불의 감정으로 진보적 투쟁을 가능하게 함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사회적·정치적 활동을 거스름\u003c/td>\u003ctd>역사적으로 변화를 만들어 냄\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 비교와 대조 방식으로 전개돼요. 첫 문장에서 상반된 주장을 제시하고, 두 번째와 세 번째 문장에서 첫 번째 관점을, 네 번째와 다섯 번째 문장에서 두 번째 관점을 대조했죠. 주제문이 첫 문장에 있으므로 두괄식 구조라고 할 수 있어요. 여섯 번째 문장은 동일시의 양면성을, 일곱 번째 문장은 역사적 사례를 덧붙여 두 번째 관점의 설득력을 높이고 있습니다.","hl":"ty"},{"n":10,"text":"신호어를 살펴보면, 네 번째 문장의 But on the other hand는 두 번째 관점으로 전환하는 강한 역접 신호예요. 여섯 번째 문장의 but은 같은 동일시가 상반된 결과를 낳을 수 있음을 대조해 주고요. 일곱 번째 문장의 Historically는 역사적 근거와 사례를 제시하는 표지로 볼 수 있어요. 또한 첫 번째 관점에서는 solitary reading and reflection, detachment, passivity 같은 표현이, 두 번째 관점에서는 questioning of authority, a keen sense of injustice, producing change 같은 표현이 같은 쪽의 의미를 반복하며 이어지고 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>contrary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상반된\u003c/span>\u003c/div>\u003cdiv>\u003cb>claim\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주장\u003c/span>\u003c/div>\u003cdiv>\u003cb>literature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>문학\u003c/span>\u003c/div>\u003cdiv>\u003cb>theorist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이론가\u003c/span>\u003c/div>\u003cdiv>\u003cb>maintain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>주장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>encourage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>장려하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>solitary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고독한\u003c/span>\u003c/div>\u003cdiv>\u003cb>reflection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>성찰\u003c/span>\u003c/div>\u003cdiv>\u003cb>engage with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 관계를 맺다\u003c/span>\u003c/div>\u003cdiv>\u003cb>counter\u003c/b>\u003cem>동사\u003c/em>\u003cspan>거스르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>at best\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기껏해야\u003c/span>\u003c/div>\u003cdiv>\u003cb>detachment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>단절, 거리두기\u003c/span>\u003c/div>\u003cdiv>\u003cb>complexity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>복잡성\u003c/span>\u003c/div>\u003cdiv>\u003cb>at worst\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>최악의 경우\u003c/span>\u003c/div>\u003cdiv>\u003cb>passivity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수동성\u003c/span>\u003c/div>\u003cdiv>\u003cb>acceptance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수용\u003c/span>\u003c/div>\u003cdiv>\u003cb>on the other hand\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다른 한편으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>dangerous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>위험한\u003c/span>\u003c/div>\u003cdiv>\u003cb>promote\u003c/b>\u003cem>동사\u003c/em>\u003cspan>조장하다, 촉진하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>questioning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의문 제기\u003c/span>\u003c/div>\u003cdiv>\u003cb>authority\u003c/b>\u003cem>명사\u003c/em>\u003cspan>권위\u003c/span>\u003c/div>\u003cdiv>\u003cb>ban\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추방하다, 금지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dissatisfied\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불만을 품은\u003c/span>\u003c/div>\u003cdiv>\u003cb>eager\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>갈망하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>identification\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동일시\u003c/span>\u003c/div>\u003cdiv>\u003cb>fellowship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동료 의식\u003c/span>\u003c/div>\u003cdiv>\u003cb>sense of injustice\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불의에 대한 감정\u003c/span>\u003c/div>\u003cdiv>\u003cb>struggle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>투쟁\u003c/span>\u003c/div>\u003cdiv>\u003cb>revulsion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>혐오감\u003c/span>\u003c/div>\u003cdiv>\u003cb>slavery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노예제\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"중요한 어휘를 몇 개 짚어 볼게요. contrary는 상반된, encourage는 장려하다, solitary는 고독한, detachment는 단절이나 거리두기, promote는 조장하다 또는 촉진하다라는 뜻이에요. on the other hand는 다른 한편으로라는 뜻으로 대조를 이끄는 연결 표현이고, identification은 동일시, sense of injustice는 불의에 대한 감정, revulsion은 혐오감을 의미해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">contrary\u003c/b>\u003cspan class=\"m\">상반된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">opposite\u003c/span>\u003cspan class=\"s\">conflicting\u003c/span>\u003cspan class=\"s\">opposed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">consistent\u003c/span>\u003cspan class=\"a\">compatible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">encourage\u003c/b>\u003cspan class=\"m\">장려하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">promote\u003c/span>\u003cspan class=\"s\">foster\u003c/span>\u003cspan class=\"s\">stimulate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discourage\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">solitary\u003c/b>\u003cspan class=\"m\">고독한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lonely\u003c/span>\u003cspan class=\"s\">isolated\u003c/span>\u003cspan class=\"s\">individual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">social\u003c/span>\u003cspan class=\"a\">collective\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">promote\u003c/b>\u003cspan class=\"m\">조장하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">encourage\u003c/span>\u003cspan class=\"s\">foster\u003c/span>\u003cspan class=\"s\">advance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discourage\u003c/span>\u003cspan class=\"a\">hinder\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dissatisfied\u003c/b>\u003cspan class=\"m\">불만족한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discontented\u003c/span>\u003cspan class=\"s\">unhappy\u003c/span>\u003cspan class=\"s\">frustrated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">satisfied\u003c/span>\u003cspan class=\"a\">content\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">keen\u003c/b>\u003cspan class=\"m\">강한, 예민한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">intense\u003c/span>\u003cspan class=\"s\">sharp\u003c/span>\u003cspan class=\"s\">acute\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weak\u003c/span>\u003cspan class=\"a\">dull\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">struggle\u003c/b>\u003cspan class=\"m\">투쟁\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conflict\u003c/span>\u003cspan class=\"s\">fight\u003c/span>\u003cspan class=\"s\">resistance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">peace\u003c/span>\u003cspan class=\"a\">surrender\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"시험에 자주 나오는 동의어와 반의어도 정리해 둡시다. contrary는 opposite, conflicting, opposed와 바꿔 쓸 수 있고, 반의어로는 consistent나 compatible이 있어요. encourage는 promote, foster, stimulate와 유사하고, discourage나 hinder와 반대예요. solitary는 lonely, isolated, individual과 가깝고, social이나 collective와 반대입니다. dissatisfied는 discontented, unhappy, frustrated와 통하고, satisfied나 content와 반대예요. keen은 intense, sharp, acute와 유사하고, weak이나 dull과 반대입니다. struggle은 conflict, fight, resistance와 연결되고, peace나 surrender와 대비돼요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 상반된 주장들을 마주한다\u003c/span>\u003cspan class=\"en\">We encounter contrary claims\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문학과 행동의 관계에 대한.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">relation \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">literature \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">action\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 문학과 행동의 관계에 대한 상반된 주장들과 마주한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 글 전체의 화제를 제시합니다. 문학과 행동의 관계에 대해 \u003cb class=\"key\">상반된 \u003c/b>\u003cb class=\"key\">주장들\u003c/b>이 있다는 것을 미리 알려 주며, 뒤에 이어질 \u003cb class=\"key\">반대 \u003c/b>\u003cb class=\"key\">관점\u003c/b> 두 가지를 포괄합니다. contrary claims가 이 글의 논의를 이끄는 중심 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : contrary claims [about the relation of literature to action] (전치사구가 명사 claims 수식) : \"문학과 행동의 관계에 대한\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"We encounter contrary claims, 우리는 상반된 주장들을 마주한다. about the relation of literature to action, 문학과 행동의 관계에 대한.. 이 문장 전체를 해석하면, 우리는 문학과 행동의 관계에 대한 상반된 주장들과 마주한다.","hl":"m"},{"n":14,"text":"첫 문장은 글 전체의 화제를 제시하는 도입 문장이에요. 문학과 행동의 관계에 대해 서로 반대되는 주장들이 있다는 것을 미리 알려 주고, 뒤에 그 상반된 주장들을 하나씩 펼쳐 나갈 것임을 암시합니다. 여기서 contrary claims가 이 글의 중심 축이에요.","hl":"mn"},{"n":15,"text":"첫 번째 문장에서는 about 이하가 앞에 있는 claims를 꾸며 주는 전치사구의 형용사적 용법을 짚어 둘게요. about the relation of literature to action이 claims를 뒤에서 수식해서 문학과 행동의 관계에 대한 상반된 주장들이라는 의미가 만들어져요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이론가들은 주장해 왔다\u003c/span>\u003cspan class=\"en\">Theorists have maintained\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문학이 고독한 독서와 성찰을 장려한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">literature \u003c/span>\u003cspan class=\"tgt\">encourages \u003c/span>\u003cspan class=\"tgt\">solitary \u003c/span>\u003cspan class=\"tgt\">reading \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">reflection\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상과 관계를 맺는 방법으로써\u003c/span>\u003cspan class=\"en\">as the way \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">engage \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 따라서 사회적이고 정치적인 활동들에 거스른다고\u003c/span>\u003cspan class=\"en\">and thus counters the social and political activities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회 변화를 일으킬 수 있을지도 모르는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">produce \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">change\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이론가들은 문학이 세상과 관계를 맺는 방법으로써 고독한 독서와 성찰을 장려하고 따라서 사회 변화를 일으킬 수 있을지도 모르는 사회적이고 정치적인 활동들에 거스른다고 주장해 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 문장은 문학이 행동을 방해한다는 첫 번째 관점을 제시합니다. 이론가들은 문학이 \u003cb class=\"key\">고독한 \u003c/b>\u003cb class=\"key\">독서\u003c/b>와 \u003cb class=\"key\">성찰\u003c/b>을 장려하여 사회 변화를 일으킬 수 있는 활동을 \u003cb class=\"key\">거스른다\u003c/b>고 봅니다. 즉 문학을 사회 변화에 소극적으로 작용하게 만든다는 시각입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : have maintained [that + 완전한 절] (목적어) : \"문학이 고독한 독서와 성찰을 장려한다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the way [to engage with the world] (to부정사구가 명사 the way 수식) : \"세상과 관계를 맺는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : activities [that might produce social change] (주격 관계대명사절) : \"사회 변화를 일으킬 수 있을지도 모르는\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Theorists have maintained, 이론가들은 주장해 왔다. that literature encourages solitary reading and reflection, 문학이 고독한 독서와 성찰을 장려한다고. as the way to engage with the world, 세상과 관계를 맺는 방법으로써. and thus counters the social and political activities, 그리고 따라서 사회적이고 정치적인 활동들에 거스른다고. that might produce social change, 사회 변화를 일으킬 수 있을지도 모르는.. 이 문장 전체를 해석하면, 이론가들은 문학이 세상과 관계를 맺는 방법으로써 고독한 독서와 성찰을 장려하고 따라서 사회 변화를 일으킬 수 있을지도 모르는 사회적이고 정치적인 활동들에 거스른다고 주장해 왔다.","hl":"m"},{"n":17,"text":"두 번째 문장은 문학이 행동을 오히려 막는다는 입장을 소개해요. 문학이 고독한 독서와 성찰을 장려해서 사회 변화를 만들 수도 있는 사회적 정치적 활동들에 반대로 작용한다는 주장이죠. 이 문장은 문학을 수동적으로 보는 관점의 대표적인 논거라고 이해하면 됩니다.","hl":"mn"},{"n":18,"text":"두 번째 문장에서는 세 가지 어법을 짚을게요. 첫 번째, maintained 다음에 오는 that절은 명사절 접속사 that으로 이론가들이 무엇을 주장했는지 나타내는 완전한 절이에요. 두 번째, the way 다음에 오는 to engage with the world는 to부정사의 형용사적 용법으로 앞에 있는 명사 the way를 꾸며 줘요. 세 번째, activities 다음에 오는 that might produce social change는 주격 관계대명사 that으로 선행사 activities를 꾸며 주는 절입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기껏해야\u003c/span>\u003cspan class=\"en\">At best\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 조장한다\u003c/span>\u003cspan class=\"en\">it encourages\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단절 또는 복잡성에 대한 인정을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">detachment \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">appreciation \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">complexity\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 최악의 경우\u003c/span>\u003cspan class=\"en\">and at worst\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수동성과 있는 그대로에 대한 수용을.\u003c/span>\u003cspan class=\"en\">passivity and acceptance of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기껏해야 이것은 단절 또는 복잡성에 대한 인정을, 최악의 경우 수동성과 있는 그대로에 대한 수용을 조장한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세 번째 문장은 문학이 행동을 방해한다는 앞선 주장의 결과를 요약합니다. 좋게 보면 \u003cb class=\"key\">단절\u003c/b>이나 \u003cb class=\"key\">복잡성에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">인정\u003c/b>을, 나쁘게 보면 \u003cb class=\"key\">수동성\u003c/b>과 현실 수용을 조장한다는 뜻이에요. 따라서 문학의 소극적 기능을 두 측면으로 정리한 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">등위접속사 or에 의한 병렬\u003c/span> : A or B (명사구 병렬) : \"단절 또는 복잡성에 대한 인정\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : acceptance of [what is] (what절이 전치사 of의 목적어) : \"있는 그대로에 대한\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"At best, 기껏해야. it encourages, 이것은 조장한다. detachment or appreciation of complexity, 단절 또는 복잡성에 대한 인정을. and at worst, 그리고 최악의 경우. passivity and acceptance of what is, 수동성과 있는 그대로에 대한 수용을.. 이 문장 전체를 해석하면, 기껏해야 이것은 단절 또는 복잡성에 대한 인정을, 최악의 경우 수동성과 있는 그대로에 대한 수용을 조장한다.","hl":"m"},{"n":20,"text":"세 번째 문장은 문학이 행동을 막는다는 주장의 결과를 정리하는 문장이에요. 가장 좋게 봐도 문학은 현실과의 단절이나 복잡성에 대한 인정을 부추기고, 가장 나쁘게 보면 수동성과 현실을 그대로 받아들이는 태도를 부추긴다는 거죠. 이 문장은 문학의 소극적 역할을 두 갈래로 요약한 핵심 문장으로 볼 수 있어요.","hl":"mn"},{"n":21,"text":"세 번째 문장에서는 두 가지 어법을 볼게요. 첫 번째, detachment or appreciation of complexity에서 등위접속사 or가 detachment와 appreciation을 대등하게 연결해서 단절 또는 복잡성에 대한 인정이라는 병렬 구조를 만들어요. 두 번째, what is는 선행사를 포함한 관계대명사 what이 쓰인 표현으로 있는 것, 즉 있는 그대로의 상태를 뜻하고 전치사 of의 목적어 자리에 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 다른 한편으로,\u003c/span>\u003cspan class=\"en\">But on the other hand,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문학은 역사적으로 위험한 것으로 여겨져 왔다:\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">literature \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">historically \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">seen \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">dangerous\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 의문을 제기하는 것을 조장한다\u003c/span>\u003cspan class=\"en\">it promotes \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">questioning \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">권위와 사회적 합의에 대한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">authority \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">arrangements\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 다른 한편으로, 문학은 역사적으로 권위와 사회적 합의에 대한 의문을 제기하는 것을 조장하므로 위험하다고 여겨져 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 문학이 \u003cb class=\"key\">권위\u003c/b>와 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">합의\u003c/b>에 의문을 품게 하므로 기존 질서에 도전하는 \u003cb class=\"key\">능동적 \u003c/b>\u003cb class=\"key\">성격\u003c/b>을 지닌다는 두 번째 시각을 제시한다. 앞 문장의 수동적 태도와 대비되며, 문학이 고정된 질서를 흔드는 존재임을 보여준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 수동태 + as 주격보어\u003c/span> : literature + has historically been seen + as dangerous : \"문학은 역사적으로 위험한 것으로 여겨져 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사의 명사적 용법\u003c/span> : the + questioning (동명사) + of + authority and social arrangements : \"권위와 사회적 합의에 대한 의문 제기\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"But on the other hand, 그러나 다른 한편으로. literature has historically been seen as dangerous, 문학은 역사적으로 위험한 것으로 여겨져 왔다:. it promotes the questioning, 그것은 의문을 제기하는 것을 조장한다. of authority and social arrangements, 권위와 사회적 합의에 대한. 이 문장 전체를 해석하면, 그러나 다른 한편으로, 문학은 역사적으로 권위와 사회적 합의에 대한 의문을 제기하는 것을 조장하므로 위험하다고 여겨져 왔다.","hl":"m"},{"n":23,"text":"이 문장은 문학이 역사적으로 권위와 사회적 합의에 대한 의문을 제기하기 때문에 위험하게 여겨져 왔다는 두 번째 시각을 제시해요. 앞에서 말한 문학의 수동적 태도와 달리, 문학은 기존 질서에 도전하는 능동적 성격을 지닌다는 점을 보여주죠. 그래서 문학은 고정된 사회 질서를 흔들 수 있는 존재로 묘사되는 거예요.","hl":"mn"},{"n":24,"text":"첫 번째, literature has historically been seen as dangerous는 현재완료 수동태입니다. have 또는 has와 been, 그리고 과거분사 seen이 결합해서 과거부터 현재까지 이어져 온 평가를 나타내요. as dangerous는 주어인 문학이 위험한 것으로 규정된다는 뜻을 더해 줘요. 두 번째, the questioning of authority and social arrangements에서 questioning은 동사 question을 동명사로 바꾼 명사적 용법이에요. 정관사 the와 전치사 of를 동반하며 권위와 사회적 합의에 대한 의문 제기라는 명사구를 만들어 냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">플라톤은 시인들을 추방했다\u003c/span>\u003cspan class=\"en\">Plato banned poets\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 이상적인 공화국에서\u003c/span>\u003cspan class=\"en\">from his ideal republic\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 해를 끼치는 것만 할 수 있기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">because \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">harm\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 소설은 오랫동안 ~라고 믿어져 왔다\u003c/span>\u003cspan class=\"en\">and novels \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">credited \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을 불만스럽게 만드는 것으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">dissatisfied \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 삶에 대해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">lives \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 새로운 무언가를 갈망하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">eager \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">new\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">플라톤은 그들이 해를 끼치는 것만 할 수 있기 때문에 그의 이상적인 공화국으로부터 시인들을 추방했고, 소설은 사람들이 그들의 삶에 불만을 품게 만들고 새로운 무언가를 갈망하도록 하는 것으로 오랫동안 믿어져 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 플라톤의 시인 추방과 소설의 영향력을 예로 들어 문학이 위험하다는 주장을 뒷받침한다. 플라톤은 시인이 해만 끼친다고 보았고, 소설은 사람들을 \u003cb class=\"key\">불만\u003c/b>에 빠뜨리고 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">것\u003c/b>을 갈망하게 한다고 여겨져 왔다. 문학이 현실에 안주하지 못하게 하는 힘을 보여준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">이유를 나타내는 부사절 (because)\u003c/span> : because + they + could only do harm : \"그들은 해를 끼치는 것만 할 수 있었기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be credited with + 동명사\u003c/span> : have long been credited with + [making people dissatisfied (동명사구)] : \"사람들을 불만스럽게 만든 것으로 오랫동안 여겨져 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">make + 목적어 + 목적격보어 (5형식)\u003c/span> : make + people + dissatisfied with their lives / eager for something new (형용사구 병렬) : \"사람들이 그들의 삶에 불만을 품고 새로운 무언가를 갈망하게 만드는 것\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Plato banned poets, 플라톤은 시인들을 추방했다. from his ideal republic, 그의 이상적인 공화국에서. because they could only do harm, 그들이 해를 끼치는 것만 할 수 있기 때문에. and novels have long been credited, 그리고 소설은 오랫동안 ~라고 믿어져 왔다. with making people dissatisfied, 사람들을 불만스럽게 만드는 것으로. with their lives, 그들의 삶에 대해. and eager for something new, 그리고 새로운 무언가를 갈망하도록. 이 문장 전체를 해석하면, 플라톤은 그들이 해를 끼치는 것만 할 수 있기 때문에 그의 이상적인 공화국으로부터 시인들을 추방했고, 소설은 사람들이 그들의 삶에 불만을 품게 만들고 새로운 무언가를 갈망하도록 하는 것으로 오랫동안 믿어져 왔다.","hl":"m"},{"n":26,"text":"이 문장은 문학이 위험하다는 주장을 뒷받침하는 대표적인 예 두 가지를 제시해요. 플라톤이 시인을 이상적인 공화국에서 추방한 이유는 시인이 해를 끼치는 것만 할 수 있다고 보았기 때문이에요. 그리고 소설은 사람들을 자신의 삶에 불만스럽게 만들고 새로운 무언가를 갈망하게 한다고 오랫동안 여겨져 왔어요. 그래서 문학은 현실에 안주하지 못하게 하는 힘을 가진 것으로 설명됩니다.","hl":"mn"},{"n":27,"text":"첫 번째, because they could only do harm은 이유를 나타내는 부사절입니다. because가 플라톤이 시인을 추방한 이유를 설명해 주죠. 두 번째, have long been credited with making people dissatisfied에서 be credited with 뒤에는 동명사 making이 왔습니다. be credited with는 어떤 일을 한 공적을 인정받는다는 뜻인데, 여기서는 소설이 사람들을 불만스럽게 만든 것으로 여겨져 왔다는 의미를 전해요. 세 번째, making people dissatisfied with their lives and eager for something new는 make가 목적어와 목적격 보어를 이끄는 5형식 구조예요. 목적격 보어 자리에 dissatisfied와 eager가 and로 병렬 연결되어 사람들이 어떤 상태가 되었는지를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동일시를 촉진함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">By \u003c/span>\u003cspan class=\"tgt\">promoting \u003c/span>\u003cspan class=\"tgt\">identification \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계급, 성별, 인종의 경계를 넘어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">across \u003c/span>\u003cspan class=\"tgt\">divisions \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">class, \u003c/span>\u003cspan class=\"tgt\">gender, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">race\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">책들은 동료 의식을 장려할 수 있다\u003c/span>\u003cspan class=\"en\">books may promote a fellowship\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">투쟁을 단념시키는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">discourages \u003c/span>\u003cspan class=\"tgt\">struggle\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그것들은 또한 일으킬 수 있다\u003c/span>\u003cspan class=\"en\">but they may also produce\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">강한 불의의 감정을\u003c/span>\u003cspan class=\"en\">a keen sense of injustice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진보적인 투쟁들을 가능하게 만드는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">progressive \u003c/span>\u003cspan class=\"tgt\">struggles \u003c/span>\u003cspan class=\"tgt\">possible\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">계급, 성별, 그리고 인종의 경계를 넘어 동일시를 촉진함으로써, 책들은 투쟁을 단념시키는 동료 의식을 장려할 수 있을지 모르지만, 이것들은 또한 진보적인 투쟁들을 가능하게 만드는 강한 불의의 감정을 일으킬 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문학의 두 가지 상반된 효과를 대비한다. 계급, 성별, 인종의 경계를 넘는 \u003cb class=\"key\">동일시\u003c/b>는 투쟁을 접게 만드는 동료 의식을 낳을 수 있지만, 동시에 \u003cb class=\"key\">불의\u003c/b>에 대한 예민한 감각을 일깨워 \u003cb class=\"key\">진보적 \u003c/b>\u003cb class=\"key\">투쟁\u003c/b>을 가능하게 한다. 앞 문장의 두 시각을 종합하는 핵심 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">by + 동명사 (수단)\u003c/span> : by + [promoting identification across divisions of class, gender, and race (동명사구)] : \"계급, 성별, 인종의 경계를 넘어 동일시를 촉진함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : a fellowship + [that + discourages + struggle] : \"투쟁을 단념시키는 동료 의식\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 that + make + 목적어 + 목적격보어\u003c/span> : that + makes + progressive struggles + possible : \"진보적인 투쟁들을 가능하게 만드는\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"By promoting identification, 동일시를 촉진함으로써. across divisions of class, gender, and race, 계급, 성별, 인종의 경계를 넘어. books may promote a fellowship, 책들은 동료 의식을 장려할 수 있다. that discourages struggle, 투쟁을 단념시키는. but they may also produce, 그러나 그것들은 또한 일으킬 수 있다. a keen sense of injustice, 강한 불의의 감정을. that makes progressive struggles possible, 진보적인 투쟁들을 가능하게 만드는. 이 문장 전체를 해석하면, 계급, 성별, 그리고 인종의 경계를 넘어 동일시를 촉진함으로써, 책들은 투쟁을 단념시키는 동료 의식을 장려할 수 있을지 모르지만, 이것들은 또한 진보적인 투쟁들을 가능하게 만드는 강한 불의의 감정을 일으킬 수 있다.","hl":"m"},{"n":29,"text":"이 문장은 문학이 책을 통한 동일시를 통해 투쟁을 단념시키는 동료 의식을 만들 수도 있고, 동시에 불의에 대한 강한 감정을 일깨워 진보적인 투쟁을 가능하게 할 수도 있다고 말해요. 문학의 효과가 한 방향으로만 작용하지 않는다는 점을 대비시켜 보여주는 문장이에요. 따라서 앞에서 제시된 문학의 수동적 측면과 능동적 측면을 종합하는 핵심 문장으로 볼 수 있죠.","hl":"mn"},{"n":30,"text":"첫 번째, By promoting identification across divisions of class, gender, and race는 전치사 by 뒤에 동명사 promoting이 와서 수단을 나타냅니다. 동일시를 촉진함으로써라는 의미죠. 두 번째, that discourages struggle는 선행사 a fellowship을 수식하는 주격 관계대명사절입니다. that이 주어 역할을 하니까 뒤에 동사 discourages가 바로 붙어요. 세 번째, that makes progressive struggles possible은 관계대명사 that이 선행사 a keen sense of injustice를 수식하면서, makes는 목적어 progressive struggles와 목적격 보어 possible을 이끄는 5형식 구조입니다. 진보적인 투쟁들을 가능하게 만드는 불의의 감정이라는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역사적으로, 문학 작품은\u003c/span>\u003cspan class=\"en\">Historically, works of literature\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변화를 만들어 내는 것으로 공로를 인정받는다:\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">credited \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">producing \u003c/span>\u003cspan class=\"tgt\">change\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 시대의 베스트셀러인 ‘톰 아저씨의 오두막’은\u003c/span>\u003cspan class=\"en\">Uncle Tom's Cabin, a best-seller in its day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노예제에 대한 혐오감을 만들어 내는 것을 도왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">helped \u003c/span>\u003cspan class=\"tgt\">create \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">revulsion \u003c/span>\u003cspan class=\"tgt\">against \u003c/span>\u003cspan class=\"tgt\">slavery\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 미국 남북 전쟁을 가능하게 했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">possible \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">American \u003c/span>\u003cspan class=\"tgt\">Civil \u003c/span>\u003cspan class=\"tgt\">War\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">역사적으로, 문학 작품은 변화를 만드는 것으로 믿어져 왔는데 그 시대의 베스트셀러인 ‘톰 아저씨의 오두막’은 미국 남북 전쟁을 가능하게 만든 노예제에 대한 혐오감을 조성하는 것을 도왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 문학이 실제로 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 만들어 낸다는 입장의 \u003cb class=\"key\">역사적 \u003c/b>\u003cb class=\"key\">증거\u003c/b>를 제시합니다. 당대 베스트셀러였던 \u003cb class=\"key\">『톰 \u003c/b>\u003cb class=\"key\">아저씨의 \u003c/b>\u003cb class=\"key\">오두막』\u003c/b>이 노예제에 대한 혐오감을 일으켜 남북 전쟁을 가능하게 한 사례를 들어 문학의 영향력을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태와 동명사 (be credited with + 동명사)\u003c/span> : be credited with + [producing change (동명사구)] : \"변화를 만들어 내는 것으로 공로를 인정받는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">원형부정사 (help + 동사원형)\u003c/span> : help + [create (동사원형)] + [a revulsion against slavery (목적어구)] : \"노예제에 대한 혐오감을 만들어 내는 것을 도왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사 that과 5형식 make의 목적보어 전치\u003c/span> : [a revulsion against slavery] that made [possible (목적보어)] [the American Civil War (목적어)] : \"미국 남북 전쟁을 가능하게 한\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Historically, works of literature, 역사적으로, 문학 작품은. are credited with producing change, 변화를 만들어 내는 것으로 공로를 인정받는다:. Uncle Tom's Cabin, a best-seller in its day, 그 시대의 베스트셀러인 ‘톰 아저씨의 오두막’은. helped create a revulsion against slavery, 노예제에 대한 혐오감을 만들어 내는 것을 도왔다. that made possible the American Civil War, 그것이 미국 남북 전쟁을 가능하게 했다.. 이 문장 전체를 해석하면, 역사적으로, 문학 작품은 변화를 만드는 것으로 믿어져 왔는데 그 시대의 베스트셀러인 ‘톰 아저씨의 오두막’은 미국 남북 전쟁을 가능하게 만든 노예제에 대한 혐오감을 조성하는 것을 도왔다.","hl":"m"},{"n":32,"text":"이 문장은 문학이 실제로 사회 변화를 만들어 낸다는 입장의 역사적 증거를 제시해요. 당대 베스트셀러였던 톰 아저씨의 오두막이 노예제에 대한 혐오감을 일으켜 미국 남북 전쟁을 가능하게 한 사례를 들어요. 문학의 사회적 영향력을 강조하는 핵심 문장이죠.","hl":"mn"},{"n":33,"text":"어법 포인트를 짚어 볼게요. 첫 번째, are credited with producing change는 be credited with 동명사 구조로, with 뒤에는 명사나 동명사가 와서 어떤 일을 한 공로를 인정받는다는 뜻이에요. 두 번째, helped create는 help 다음에 to 없이 동사원형이 바로 오는 원형부정사 용법으로, 무엇을 하는 것을 돕다는 의미가 됩니다. 세 번째, that made possible the American Civil War는 관계대명사 that이 선행사 revulsion을 받아서 수식하고, make의 목적어 the American Civil War가 길어서 목적보어 possible이 목적어 앞으로 나온 어순이에요. 원래는 made the American Civil War possible로 고쳐 볼 수 있죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>문학과 행동의 관계에 대한 \u003cb class=\"key\">상반된 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이 있다.\u003c/li>\u003cli>한쪽은 문학이 \u003cb class=\"key\">고독한 \u003c/b>\u003cb class=\"key\">독서\u003c/b>와 \u003cb class=\"key\">수동성\u003c/b>을 부추겨 사회 변화 활동을 막는다고 본다.\u003c/li>\u003cli>다른 쪽은 문학이 \u003cb class=\"key\">권위에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">의문\u003c/b>과 \u003cb class=\"key\">불의에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 불러일으켜 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 이끈다고 본다.\u003c/li>\u003cli>특히 『톰 아저씨의 오두막』은 \u003cb class=\"key\">노예제\u003c/b>에 대한 혐오감을 일으켜 \u003cb class=\"key\">미국 \u003c/b>\u003cb class=\"key\">남북 \u003c/b>\u003cb class=\"key\">전쟁\u003c/b>을 가능하게 한 예로 꼽힌다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Literature has been seen both as promoting solitary reflection and passivity and as encouraging the questioning of authority and a sense of injustice that can lead to social change, as exemplified by Uncle Tom's Cabin.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">문학과 행동의 관계에 대해 \u003cb class=\"key\">상반된 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이 존재한다. 문학이 \u003cb class=\"key\">고독한 \u003c/b>\u003cb class=\"key\">독서\u003c/b>와 \u003cb class=\"key\">수동성\u003c/b>을 부추긴다는 입장과, \u003cb class=\"key\">권위에 \u003c/b>\u003cb class=\"key\">대한 \u003c/b>\u003cb class=\"key\">의문\u003c/b>과 \u003cb class=\"key\">불의 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 일깨워 \u003cb class=\"key\">변화\u003c/b>를 이끈다는 입장이 대립하며, 『톰 아저씨의 오두막』이 그 예시이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":34,"text":"오늘 지문은 문학과 행동의 관계를 둘러싼 상반된 주장을 대조한 글이었어요. 문학은 고독한 성찰과 수동성을 부추긴다는 입장과 권위에 대한 의문과 불의 감정을 일깨워 사회 변화를 이끈다는 입장이 팽팽하게 맞서고 있었죠. 특히 톰 아저씨의 오두막은 문학이 실제로 사회 변화를 만들어 낼 수 있다는 강력한 예로 기억해 두세요. 오늘 내용을 정리하면서 본문을 다시 한번 읽어 보면 좋겠습니다. 수고했어요.","hl":null}]}]});</script></body></html>
