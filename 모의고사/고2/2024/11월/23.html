</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고2 11월","title":"2024년 고2 11모 23번","audioDir":"23_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">23번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고2 11모\u003c/div>\u003ch1>Why Pain Is Necessary for Balance\u003c/h1>\u003ch2>고통이 균형에 필요한 이유\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>쾌락과 고통은 뇌의 같은 영역에서 처리되고 \u003cb class=\"key\">항상성\u003c/b> 유지를 위해 함께 작동한다. 고통을 피하려는 시도는 오히려 우리를 더 비참하게 만들며, \u003cb class=\"key\">고통\u003c/b>을 허용하는 것이 내부 \u003cb class=\"key\">균형\u003c/b>을 회복하는 필수 요소이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Pain is an essential part of maintaining balance, and trying to escape it only makes us more miserable.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 전국연합학력평가 스물세 번째 지문을 함께 볼게요. 이 지문은 고통과 쾌락이 사실은 같은 뇌 영역에서 다뤄지고, 고통이 우리 몸의 균형을 되찾는 데 꼭 필요하다는 내용이에요. 요지는 고통은 균형 유지의 필수 요소이고, 고통을 피하려는 시도가 오히려 우리를 더 비참하게 만든다는 거예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리 뇌는 쾌락과 고통을 별개의 감정이 아니라 같은 신경 회로에서 처리합니다. 이를 뒷받침하는 개념이 \u003cb class=\"key\">항상성\u003c/b>(homeostasis)인데, 몸은 체온이나 혈당처럼 감정 상태도 일정하게 유지하려고 합니다. 보상 회로(reward system)에서 도파민(dopamine)이 분비되면 쾌락을 느끼지만, 그 후 뇌는 균형을 되찾기 위해 반대 방향으로 고통을 느끼게 하기도 합니다. 마치 시소에서 한쪽이 올라가면 다른 쪽이 내려가는 것과 같습니다. 따라서 쾌락만 계속 추구하면 뇌는 \u003cb class=\"key\">균형\u003c/b>을 맞추기 위해 더 큰 \u003cb class=\"key\">고통\u003c/b>을 불러올 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식부터 짚어 볼게요. 우리 뇌는 쾌락과 고통을 별개의 감정이 아니라 같은 신경 회로에서 처리해요. 여기서 중요한 개념이 homeostasis, 즉 항상성이에요. 몸은 체온이나 혈당처럼 감정 상태도 일정하게 유지하려고 하죠. 보상 회로 reward system에서 dopamine 같은 신경 전달 물질이 나오면 쾌락을 느끼지만, 뇌는 다시 균형을 맞추려고 반대 방향의 감정을 불러오기도 해요. 마치 시소에서 한쪽이 올라가면 다른 쪽이 내려가는 것과 같아요. 그래서 쾌락만 계속 추구하면 뇌는 균형을 맞추기 위해 더 큰 고통을 불러올 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>뇌의 처리와 항상성\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">뇌 \u003c/b>\u003cb class=\"key\">과학\u003c/b> 발견에 따르면 \u003cb class=\"key\">고통\u003c/b>과 \u003cb class=\"key\">쾌락\u003c/b>은 뇌의 같은 영역에서 형성되고 처리됩니다. 우리 몸은 \u003cb class=\"key\">항상성\u003c/b>을 추구하는데, 이는 신체 기능의 \u003cb class=\"key\">균형\u003c/b>입니다. 잠재적 변동을 완화하는 보상 기제가 없으면 생존할 수 없습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>동전의 양면과 저울 비유\u003csmall>비유 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">쾌락\u003c/b>과 \u003cb class=\"key\">고통\u003c/b>은 동전의 양면처럼 함께 작동하고 서로 의존하여 균형을 유지합니다. 두 감정을 저울의 반대 지점으로 상상하면, 한쪽이 올라가면 다른 쪽은 내려갑니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>고통 없이는 얻는 것도 없다\u003csmall>통념 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>우리는 ‘고통 없이는 얻는 것도 없다’는 표현을 자주 듣습니다. 정신과 의사 Anna Lembke에 따르면 이 말에는 어느 정도 \u003cb class=\"key\">진실\u003c/b>이 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>고통의 필수적 역할\u003csmall>주장 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>비참함에서 벗어나려는 시도는 오히려 우리를 더 \u003cb class=\"key\">비참\u003c/b>하게 만듭니다. \u003cb class=\"key\">고통\u003c/b>은 중립적 상태 유지에 필수적인 구성 요소이며, 이를 허용하면 내부 저울이 \u003cb class=\"key\">균형\u003c/b>으로 되돌아갑니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나눠서 볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 도입이에요. 뇌 과학 발견에 따르면 고통과 쾌락은 뇌의 같은 영역에서 형성되고 처리돼요. 우리 몸은 항상성을 추구하는데, 이는 신체 기능의 균형이에요. 잠재적 변동을 완화해 주는 보상 기제가 없다면 우리는 생존할 수 없어요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 비유예요. 쾌락과 고통은 동전의 양면처럼 함께 작동하고 서로 의존하면서 균형을 유지해요. 두 감정을 저울의 반대 지점으로 상상하면, 한쪽이 올라가면 다른 쪽은 내려간다는 걸 쉽게 이해할 수 있어요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 익숙한 표현이에요. 고통 없이는 얻는 것도 없다, No pain, no gain이라는 말을 우리 모두 들어 봤어요. 정신과 의사 Anna Lembke에 따르면 이 말에는 어느 정도 진실이 있어요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 이 글의 주장이에요. 비참함에서 벗어나려는 시도가 사실 우리를 훨씬 더 비참하게 만들어요. 고통은 중립적인 상태를 유지하는 데 필수적인 구성 요소이고, 고통을 허용하면 우리 내부의 저울이 균형 상태로 다시 맞춰져요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">과학적 배경과 비유를 거쳐 마지막 문장에서 핵심 주장을 제시합니다. 첫 문장부터 여섯 번째 문장까지는 \u003cb class=\"key\">고통\u003c/b>과 \u003cb class=\"key\">쾌락\u003c/b>의 관계를 설명하는 도입과 예시, 일곱 번째 문장에서 전문가 말을 인용한 뒤, 여덟 번째와 아홉 번째 문장에서 \u003cb class=\"key\">고통\u003c/b>의 필요성을 주장합니다. 따라서 주제문은 마지막 문장이며, \u003cb class=\"key\">미괄식\u003c/b> 구조입니다. 이 글은 단순한 정보 나열이 아니라 \u003cb class=\"key\">고통 \u003c/b>\u003cb class=\"key\">회피\u003c/b>라는 통념을 반박하며 \u003cb class=\"key\">균형\u003c/b>의 중요성을 강조하는 전개입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Without (3)\u003c/b>\u003cspan>조건·가정\u003c/span>\u003cb>like (4)\u003c/b>\u003cspan>비유\u003c/span>\u003cb>Well (7)\u003c/b>\u003cspan>전환·인용 도입\u003c/span>\u003cb>according to (7)\u003c/b>\u003cspan>전문가 인용\u003c/span>\u003cb>This is because (9)\u003c/b>\u003cspan>원인·근거\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">homeostasis\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the balance of bodily functions\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">keep balance\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a neutral state\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">back to balance\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>쾌락\u003c/th>\u003cth>고통\u003c/th>\u003c/tr>\u003ctr>\u003ctd>뇌의 같은 영역에서 처리됨\u003c/td>\u003ctd>뇌의 같은 영역에서 처리됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한쪽이 오르면 다른 쪽은 내려감\u003c/td>\u003ctd>한쪽이 오르면 쾌락은 내려감\u003c/td>\u003c/tr>\u003ctr>\u003ctd>균형 유지에 함께 작용함\u003c/td>\u003ctd>중립 상태 유지의 필수 요소\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장을 뒷받침하는 근거를 순서대로 제시하는 주장 근거 전개이고, 주제문이 마지막에 있는 미괄식 구조예요. 처음에는 과학적 배경과 비유로 핵심 개념을 설명하고, 중간에 전문가의 말을 인용한 뒤, 마지막 문장에서 고통의 필요성을 분명히 주장해요.","hl":"ty"},{"n":9,"text":"신호어를 보면 앞부분에서 without 같은 조건 표현과 like 같은 비유 표현이 나오죠. 일곱 번째 문장의 Well과 according to는 전문가 인용을 도입하는 신호예요. 마지막 문장의 This is because는 원인과 근거를 제시하면서 핵심 주장을 연결해 줘요. 또한 homeostasis가 the balance of bodily functions, keep balance, a neutral state, back to balance로 계속 바뀌어 표현되는 점도 잡아 두면 좋아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Based on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 근거하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>discovery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발견\u003c/span>\u003c/div>\u003cdiv>\u003cb>neuroscience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신경 과학\u003c/span>\u003c/div>\u003cdiv>\u003cb>pain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고통\u003c/span>\u003c/div>\u003cdiv>\u003cb>pleasure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>쾌락\u003c/span>\u003c/div>\u003cdiv>\u003cb>process\u003c/b>\u003cem>동사\u003c/em>\u003cspan>처리하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>constantly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>끊임없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>strive for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 추구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>homeostasis\u003c/b>\u003cem>명사\u003c/em>\u003cspan>항상성\u003c/span>\u003c/div>\u003cdiv>\u003cb>balance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>균형\u003c/span>\u003c/div>\u003cdiv>\u003cb>compensatory\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>보상하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>mechanism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기제, 메커니즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>cushion\u003c/b>\u003cem>동사\u003c/em>\u003cspan>완화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>potential\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>잠재적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>highs and lows\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기복, 고점과 저점\u003c/span>\u003c/div>\u003cdiv>\u003cb>survive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reliant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의존하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>keep balance\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>균형을 유지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opposite\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>반대의\u003c/span>\u003c/div>\u003cdiv>\u003cb>scale\u003c/b>\u003cem>명사\u003c/em>\u003cspan>저울\u003c/span>\u003c/div>\u003cdiv>\u003cb>rise\u003c/b>\u003cem>동사\u003c/em>\u003cspan>올라가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>correspondingly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>상응하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall\u003c/b>\u003cem>동사\u003c/em>\u003cspan>내려가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>No pain, no gain\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>고통 없이는 얻는 것도 없다\u003c/span>\u003c/div>\u003cdiv>\u003cb>psychiatrist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정신과 의사\u003c/span>\u003c/div>\u003cdiv>\u003cb>truth\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진실\u003c/span>\u003c/div>\u003cdiv>\u003cb>attempt\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시도\u003c/span>\u003c/div>\u003cdiv>\u003cb>escape\u003c/b>\u003cem>동사\u003c/em>\u003cspan>벗어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>miserable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>비참한\u003c/span>\u003c/div>\u003cdiv>\u003cb>essential\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>필수적인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개만 짚어 볼게요. homeostasis는 항상성, 즉 몸 기능의 균형이에요. compensatory mechanism은 보상 기제로, 잠재적인 기복을 완화해 주는 장치예요. No pain, no gain은 고통 없이는 얻는 것도 없다는 표현이고, essential은 필수적인이라는 뜻이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">pain\u003c/b>\u003cspan class=\" ss=\"s\">flee\u003c/span>\u003cspan class=\"s\">get away\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">face\u003c/span>\u003cspan class=\"a\">confront\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">maintain\u003c/b>\u003cspan class=\"m\">유지하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"s\">sustain\u003c/span>\u003cspan class=\"s\">keep\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003cspan class=\"a\">abandon\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 자주 나오는 어휘의 동의어와 반의어를 정리할게요. pain의 동의어는 suffering, distress, agony이고 반의어는 pleasure와 comfort예요. pleasure의 동의어는 delight, enjoyment, satisfaction, 반의어는 pain과 discomfort예요. balance의 동의어는 equilibrium, stability, 반의어는 imbalance와 instability예요. essential은 necessary, vital, indispensable과 바꿔 쓸 수 있고, optional이나 unnecessary와 반대예요. miserable은 unhappy나 wretched와 비슷하고 happy, joyful과 반대죠. escape는 avoid, flee와 비슷하고 face, confront와 반대예요. maintain은 preserve, sustain, keep과 비슷하고 neglect, abandon과 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌 과학의 발견들에 따르면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Based \u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">discoveries \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">neuroscience\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고통과 쾌락은\u003c/span>\u003cspan class=\"en\">pain and pleasure\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">형성되고 처리된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">formed \u003c/span>\u003cspan class= 3c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">must \u003c/span>\u003cspan class=\"tgt\">correspondingly \u003c/span>\u003cspan class=\"tgt\">fall\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약에 여러분이 쾌락과 고통을 저울 위의 두 반대 지점으로 상상한다면, 여러분은 두 지점 중 한 지점이 올라가면 다른 한 지점이 상응하여 틀림없이 내려갈 것임을 쉽게 이해할 수 있을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 저울 비유를 통해 쾌락과 고통이 \u003cb class=\"key\">반비례\u003c/b> 관계임을 설명한다. 한쪽이 올라가면 다른 쪽이 \u003cb class=\"key\">대응하여\u003c/b> 내려가도록 균형이 작동한다는 원리를 보여 주며, 다음에 나오는 ‘No pain, no gain’의 배경 논리가 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">if 조건 부사절\u003c/span> : If + 주어 + 동사 ~, 주어 + 동사 ~ : \"만약 여러분이 쾌락과 고통을 상상한다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that 명사절 (목적어)\u003c/span> : understand + that + 완전한 절 : \"두 지점 중 한 지점이 올라가면 다른 한 지점이 상응하여 틀림없이 내려간다는 것을 이해할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사 must\u003c/span> : must + 동사원형 : \"다른 한 지점은 상응하여 틀림없이 내려간다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"If you imagine pleasure and pain, 만약 여러분이 쾌락과 고통을 상상한다면. as the two opposite points on a scale, 저울 위의 두 반대 지점으로. you can easily understand that, 여러분은 쉽게 이해할 수 있다. as one of the two points rises, 두 지점 중 한 지점이 올라가면. the other must correspondingly fall, 다른 한 지점은 상응하여 틀림없이 내려간다는 것을. 이 문장 전체를 해석하면, 만약에 여러분이 쾌락과 고통을 저울 위의 두 반대 지점으로 상상한다면, 여러분은 두 지점 중 한 지점이 올라가면 다른 한 지점이 상응하여 틀림없이 내려갈 것임을 쉽게 이해할 수 있을 것이다.","hl":"m"},{"n":25,"text":"이 문장은 쾌락과 고통을 저울 위의 두 반대 지점으로 상상해 보라고 제안합니다. 한쪽 지점이 올라가면 다른 쪽 지점은 상응하여 틀림없이 내려간다고 하면서 균형의 원리를 쉽게 설명하죠. 이 반비례 관계가 다음에 나올 고통 없이는 얻는 것도 없다라는 말의 논리적 배경이 됩니다.","hl":"mn"},{"n":26,"text":"첫 번째, If you imagine pleasure and pain은 조건을 나타내는 부사절입니다. 뒤에 결과가 이어지는 구조죠. 두 번째, you can easily understand that 뒤에는 understand의 목적어로 쓰인 that 명사절이 왔습니다. 이 절 안에 as one of the two points rises라는 부사절이 포함되어 있어서 꽤 길어요. 세 번째, the other must correspondingly fall에서 must는 강한 필연을 나타내는 조동사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 모두는 그 표현을 들어본 적이 있고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We've \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">heard\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">expression, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘고통 없이는, 얻는 것도 없다.’\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">&quot;No \u003c/span>\u003cspan class=\"tgt\">pain, \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">gain.&quot;\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 ‘고통 없이는, 얻는 것도 없다.’라는 표현을 모두 들어본 적이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 누구나 아는 익숙한 \u003cb class=\"key\">속담\u003c/b>을 제시하여 다음 문장에서 정신과 의사가 그 표현에 일리가 있다고 말하는 전환점을 만든다. 여기서는 \u003cb class=\"key\">고통 \u003c/b>\u003cb class=\"key\">없이는 \u003c/b>\u003cb class=\"key\">얻는 \u003c/b>\u003cb class=\"key\">것도 \u003c/b>\u003cb class=\"key\">없다\u003c/b>는 말이 고통의 필요성을 강조하는 장치이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 (경험)\u003c/span> : have/has + 과거분사 : \"우리 모두는 들어본 적이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동격\u003c/span> : 명사, 동격 표현 : \"‘고통 없이는, 얻는 것도 없다.’라는 표현\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"We've all heard the expression, 우리 모두는 그 표현을 들어본 적이 있고. \"No pain, no gain.\", ‘고통 없이는, 얻는 것도 없다.’. 이 문장 전체를 해석하면, 우리는 ‘고통 없이는, 얻는 것도 없다.’라는 표현을 모두 들어본 적이 있다.","hl":"m"},{"n":28,"text":"이 문장은 우리 모두가 잘 알고 있는 속담 No pain, no gain을 소개합니다. 이 흔한 표현을 제시함으로써 다음 문장에서 정신과 의사가 이 말에 일리가 있다고 말하는 흐름으로 연결되죠. 여기서 고통과 이득의 관계가 다시 부각됩니다.","hl":"mn"},{"n":29,"text":"첫 번째, We've all heard는 현재완료 경험 용법입니다. 과거에 들어본 경험이 현재까지 영향을 미치는 상황을 나타내죠. 두 번째, the expression, No pain, no gain.에서 No pain, no gain은 앞에 나온 expression의 내용을 구체화하는 동격입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자,\u003c/span>\u003cspan class=\"en\">Well,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정신과 의사인 Dr. Anna Lembke에 따르면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">according \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">psychiatrist \u003c/span>\u003cspan class=\"tgt\">Dr. \u003c/span>\u003cspan class=\"tgt\">Anna \u003c/span>\u003cspan class=\"tgt\">Lembke,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 정도의 진실이 있을 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">some \u003c/span>\u003cspan class=\"tgt\">truth\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 말에는.\u003c/span>\u003cspan class=\"en\">to these words.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자, 정신과 의사인 Dr. Anna Lembke에 따르면, 이 말에는 어느 정도의 진실이 있을 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 인용한 \u003cb class=\"key\">No \u003c/b>\u003cb class=\"key\">pain, \u003c/b>\u003cb class=\"key\">no \u003c/b>\u003cb class=\"key\">gain\u003c/b>이라는 표현이 완전히 틀리지 않다는 가능성을 전문가의 말을 빌려 전합니다. there may be some truth는 \u003cb class=\"key\">가능성\u003c/b>을 조심스럽게 나타내고, to these words는 앞선 표현을 가리킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 according to\u003c/span> : according to + [psychiatrist Dr. Anna Lembke (명사구)] : \"정신과 의사인 Dr. Anna Lembke에 따르면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">There + be동사 구문 (조동사 may 포함)\u003c/span> : There + [may be] + [some truth (주어)] : \"어느 정도의 진실이 있을 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Well, 자. according to psychiatrist Dr. Anna Lembke, 정신과 의사인 Dr. Anna Lembke에 따르면. there may be some truth, 어느 정도의 진실이 있을 수 있다. to these words, 이 말에는.. 이 문장 전체를 해석하면, 자, 정신과 의사인 Dr. Anna Lembke에 따르면, 이 말에는 어느 정도의 진실이 있을 수 있다.","hl":"m"},{"n":31,"text":"앞 문장에서 우리가 No pain, no gain이라는 표현을 들었는데, 정신과 의사 Dr. Anna Lembke에 따르면 이 말에 어느 정도 진실이 있다고 합니다. 여기서 there may be some truth to these words는 이 표현이 완전히 틀리지 않다는 가능성을 조심스럽게 전달합니다.","hl":"mn"},{"n":32,"text":"첫 번째로 according to는 에 따르면이라는 뜻의 전치사구로, 정보나 주장의 출처를 나타낼 때 문장 앞에 씁니다. 두 번째로 there may be some truth는 there is 구문에 조동사 may가 들어간 형태입니다. 진짜 주어는 some truth이고 there는 유도부사이며, be동사 자리에 may가 들어가 가능성을 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 말한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">She \u003c/span>\u003cspan class=\"tgt\">says \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 시도가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">attempts\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비참함에서 벗어나려는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c 가 사실 우리를 훨씬 더 비참하게 만들고 있다고 말한다.","hl":"m"},{"n":34,"text":"Dr. Anna Lembke의 주장을 직접 인용한 문장입니다. 비참함에서 벗어나려는 시도가 오히려 우리를 더 비참하게 만든다는 역설적인 상황을 말해요. 여기서 escape being miserable은 비참한 상태를 피하는 것을 의미하고, even more miserable은 더 심한 상태를 강조합니다.","hl":"mn"},{"n":35,"text":"첫 번째로 She says that our attempts에서 that은 say의 목적어 역할을 하는 명사절을 이끄는 접속사입니다. that절 안에는 our attempts가 주어이고 are making이 동사입니다. 두 번째로 to escape being miserable은 attempts를 수식하는 to부정사 형용사적 용법이고, escape의 목적어로 동명사구 being miserable이 왔습니다. 세 번째로 are in fact making은 현재진행형이고, 부사구 in fact가 are와 making 사이에 삽입되어 사실은이라는 뜻을 더합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 왜냐하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">because\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고통은 실제로 필수적인 구성 요소이다\u003c/span>\u003cspan class=\"en\">pain is actually an essential component\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 능력의\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">ability \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중립적인 상태를 유지하기 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">maintain \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">neutral \u003c/span>\u003cspan class=\"tgt\">state\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것을 허용하는 것은\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">allowing \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결과적으로 다시 맞출 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">turn \u003c/span>\u003cspan class=\"tgt\">reset\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 내부 저울을 균형 상태로.\u003c/span>\u003cspan class=\"en\">our internal scale back to balance.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이는 고통이 실제로 중립적인 상태를 유지하기 위한 우리 능력의 필수적인 구성 요소이기 때문이고, 그것을 허용하는 것은 결과적으로 우리의 내부 저울을 균형 상태로 다시 맞출 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장의 역설적 주장에 대한 이유를 설명합니다. 고통은 \u003cb class=\"key\">중립 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 유지하는 데 필수적이며, 그것을 허용하면 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">저울\u003c/b>이 다시 균형으로 돌아옵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">This is because 관용 표현\u003c/span> : This + is + [because + 완전한 절] : \"이것은 왜냐하면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : ability + [to maintain (to부정사구)] + [a neutral state (목적어)] : \"중립적인 상태를 유지하기 위한 우리 능력\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [allowing it (동명사구)] + will reset ... : \"그것을 허용하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">조동사 will + 동사원형 reset\u003c/span> : will + [in turn (부사구)] + reset [동사원형] : \"결과적으로 다시 맞출 것이다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"This is because, 이것은 왜냐하면. pain is actually an essential component, 고통은 실제로 필수적인 구성 요소이다. of our ability, 우리 능력의. to maintain a neutral state, 중립적인 상태를 유지하기 위한. and allowing it, 그리고 그것을 허용하는 것은. will in turn reset, 결과적으로 다시 맞출 것이다. our internal scale back to balance, 우리의 내부 저울을 균형 상태로.. 이 문장 전체를 해석하면, 이는 고통이 실제로 중립적인 상태를 유지하기 위한 우리 능력의 필수적인 구성 요소이기 때문이고, 그것을 허용하는 것은 결과적으로 우리의 내부 저울을 균형 상태로 다시 맞출 것이다.","hl":"m"},{"n":37,"text":"앞 문장에서 말한 역설적인 주장의 이유를 설명하는 문장입니다. 고통은 피해야 할 대상이 아니라 중립 상태를 유지하는 데 꼭 필요한 구성 요소이며, 고통을 허용하면 우리 내부의 저울이 다시 균형으로 돌아온다는 것입니다. 여기서 internal scale은 쾌락과 고통의 저울 비유를 이어받은 표현입니다.","hl":"mn"},{"n":38,"text":"첫 번째로 This is because는 앞 문장의 이유를 설명하는 관용 표현입니다. because절이 is의 보어 역할을 하면서 이것은 왜냐하면 이라는 뜻이 됩니다. 두 번째로 our ability to maintain a neutral state에서 to maintain은 ability를 수식하는 to부정사 형용사적 용법입니다. 세 번째로 allowing it은 동명사구가 문장의 주어 역할을 합니다. 네 번째로 will in turn reset에서 조동사 will 다음에는 동사원형 reset이 왔고, 부사구 in turn이 그 사이에 삽입되어 결과적으로라는 뜻을 나타냅니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>\u003cb class=\"key\">쾌락\u003c/b>과 \u003cb class=\"key\">고통\u003c/b>은 뇌의 같은 영역에서 처리되며, 우리 몸은 \u003cb class=\"key\">항상성\u003c/b>을 통해 균형을 추구한다.\u003c/li>\u003cli>쾌락과 고통은 동전의 양면이나 저울의 반대 지점처럼 서로 의존하며 \u003cb class=\"key\">균형\u003c/b>을 유지한다.\u003c/li>\u003cli>‘\u003cb class=\"key\">No \u003c/b>\u003cb class=\"key\">pain, \u003c/b>\u003cb class=\"key\">no \u003c/b>\u003cb class=\"key\">gain\u003c/b>’이라는 말처럼 \u003cb class=\"key\">고통\u003c/b>은 얻음의 과정에서 필요한 요소일 수 있다.\u003c/li>\u003cli>\u003cb class=\"key\">고통 \u003c/b>\u003cb class=\"key\">회피\u003c/b>는 오히려 더 비참하게 만들므로, \u003cb class=\"key\">고통\u003c/b>을 허용해야 내부 \u003cb class=\"key\">균형\u003c/b>이 회복된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Pain is an essential part of maintaining balance, and trying to escape it only makes us more miserable.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">쾌락과 고통은 뇌의 같은 영역에서 처리되고 \u003cb class=\"key\">항상성\u003c/b> 유지를 위해 함께 작동한다. 고통을 피하려는 시도는 오히려 우리를 더 비참하게 만들며, \u003cb class=\"key\">고통\u003c/b>을 허용하는 것이 내부 \u003cb class=\"key\">균형\u003c/b>을 회복하는 필수 요소이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"정리하면, 쾌락과 고통은 같은 뇌 영역에서 처리되고 우리 몸은 항상성을 통해 균형을 유지해요. 고통은 저울의 한쪽을 다시 내려 균형을 되찾게 하는 필수 요소예요. 따라서 고통을 피하기만 하면 오히려 더 비참해질 수 있어요. 이 점을 꼭 기억하고 다음 지문으로 넘어가요. 수고했어요.","hl":null}]}]});</script></body></html>
