</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 36번","audioDir":"36_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">36번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Why Self-Esteem Feels Like It Comes from Within\u003c/h1>\u003ch2>자존감은 왜 내면에서 나오는 것처럼 느껴질까\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>집단이 나를 가치 있게 여기는지가 \u003cb class=\"key\">생존\u003c/b>과 번식에 직결되었기에, 진화적 압력은 타인의 시선을 \u003cb class=\"key\">무의식적\u003c/b>으로 감시하고 이를 \u003cb class=\"key\">자존감\u003c/b> 같은 감정으로 처리하는 경향을 만들었다. 이 감정은 사회적 압박에 대한 반응을 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">동기\u003c/b>처럼 느끼게 하여 행동의 \u003cb class=\"key\">설득력\u003c/b>을 높인다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Self-esteem evolved as an internalized, unconscious response to social evaluation that motivates us to act in ways that raise our standing.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 전국연합학력평가 서른여섯 번째 문제입니다. 자존감이 왜 우리 내면에서 나오는 것처럼 느껴지는지를 진화적 관점에서 설명하는 글이에요. 핵심은 집단의 평가가 생존에 직결되었고, 그 결과 타인의 시선을 무의식적으로 감시하는 마음의 장치가 자존감이라는 감정으로 자리 잡았다는 것입니다. 이 동기가 내부에서 나오는 것처럼 느껴질 때 행동의 설득력도 높아진다는 점까지 함께 살펴볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간은 오랫동안 무리 지어 살아왔고, 집단에서 받는 평가는 \u003cb class=\"key\">생존\u003c/b>과 번식에 직접적인 영향을 미쳤다. 이를 설명하는 대표적인 관점이 \u003cb class=\"key\">진화심리학(evolutionary \u003c/b>\u003cb class=\"key\">psychology)\u003c/b>이다. 진화심리학에서는 인간의 마음도 생존과 번식을 위해 설계된 \u003cb class=\"key\">적응적 \u003c/b>\u003cb class=\"key\">산물(adaptation)\u003c/b>이라고 본다. 특히 우리가 타인의 시선을 신경 쓰는 것은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">지위(social \u003c/b>\u003cb class=\"key\">status)\u003c/b>를 지키기 위한 무의식적 장치일 수 있다. 예를 들어, 친구들이 나를 어떻게 생각할지 신경 쓰이는 것은 집단에서 배제되지 않으려는 오래된 마음의 작동과 비슷하다. \u003cb class=\"key\">자존감(self-esteem)\u003c/b>은 이런 사회적 평가를 내면의 감정으로 바꾼 것이다.\u003c/div>","segs":[{"n":2,"text":"인간은 오랫동안 무리 지어 살아왔고, 집단에서 받는 평가는 생존과 번식에 직접적인 영향을 미쳤어요. 이런 현상을 설명하는 대표적인 관점이 진화심리학, evolutionary psychology예요. 진화심리학에서는 인간의 마음도 생존과 번식을 위해 설계된 적응적 산물, adaptation이라고 보죠. 우리가 타인의 시선을 신경 쓰는 것은 사회적 지위, social status를 지키기 위한 무의식적 장치일 수 있어요. 예를 들어 친구들이 나를 어떻게 생각할지 신경 쓰이는 것은 집단에서 배제되지 않으려는 오래된 마음의 작동과 비슷합니다. 자존감, self-esteem은 바로 이런 사회적 평가를 내면의 감정으로 바꾼 것이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>집단 내 관계와 생존\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>첫 문장에서 개인의 성공은 \u003cb class=\"key\">집단 \u003c/b>\u003cb class=\"key\">내 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 얼마나 잘 다루는지에 달려 있다고 말한다. 집단이 우리를 \u003cb class=\"key\">가치 \u003c/b>\u003cb class=\"key\">있게\u003c/b> 여겼다면 지원, 자원, 짝을 기대할 수 있었고, 그렇지 않으면 아무것도 얻지 못했다. 이것은 신체적·유전적 \u003cb class=\"key\">생존\u003c/b>의 문제였다. 즉 사회적 평가가 생존과 직결된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>진화적 압력과 무의식적 감시\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>수백만 년에 걸친 압박이 자신의 \u003cb class=\"key\">지위\u003c/b>를 최대화하는 데 민감하고 능숙한 사람들을 선택했다. 그 결과 공동체의 다른 사람들이 자신을 어떻게 인식하는지 \u003cb class=\"key\">무의식적\u003c/b>으로 관찰하는 경향이 발달했다. 사회적 평가에 대한 민감성은 진화의 산물이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>자존감과 감정의 작동\u003csmall>전환 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>관찰한 정보는 \u003cb class=\"key\">자존감\u003c/b>과 자존심, 수치심, 불안 같은 감정의 형태로 처리된다. 이 감정들은 공동체가 가치 있게 여기는 행동을 더 많이 하게 하고 그렇지 않은 행동을 덜 하게 \u003cb class=\"key\">강요한다\u003c/b>. 사회적 평가가 내면의 감정 신호로 바뀌는 것이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>내부 동기화와 설득력\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>이 감정들은 동기가 \u003cb class=\"key\">내부에서\u003c/b> 나오는 것처럼 느끼게 만들도록 되어 있다. 만약 사회적 압박에 반응하고 있음을 의식적으로 깨닫는다면 행동이 투덜대거나 냉소적으로 보여 \u003cb class=\"key\">설득력\u003c/b>이 떨어질 수 있다. 따라서 동기의 내면화가 중요하다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 집단 내 관계와 생존입니다. 첫 번째 문장부터 네 번째 문장까지에서는 개인의 성공이 집단 내 관계를 얼마나 잘 다루는지에 달려 있다고 말해요. 집단이 나를 가치 있게 여기면 지원과 자원, 짝을 기대할 수 있었지만, 그렇지 않으면 이런 이점을 얻지 못했죠. 곧 사회적 평가가 신체적, 유전적 생존의 문제였다는 뜻입니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 진화적 압력과 무의식적 감시입니다. 다섯 번째와 여섯 번째 문장에서는 수백만 년 동안의 압박이 자신의 지위를 최대화하는 데 민감하고 능숙한 사람들을 선택했다고 설명해요. 그 결과 공동체의 다른 사람들이 자신을 어떻게 인식하는지 무의식적으로 관찰하는 경향이 발달했습니다. 사회적 평가에 대한 민감성은 진화의 산물이라는 말이죠.","hl":"f1"},{"n":6,"text":"세 번째 단계는 자존감과 감정의 작동입니다. 일곱 번째와 여덟 번째 문장에서는 관찰한 정보를 자존감과 자존심, 수치심, 불안 같은 감정의 형태로 처리한다고 해요. 이 감정들은 공동체가 가치 있게 여기는 행동을 더 많이 하고 그렇지 않은 행동을 덜 하도록 강요합니다. 사회적 평가가 내면의 감정 신호로 바뀌는 거예요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 내부 동기화와 설득력입니다. 아홉 번째와 열 번째 문장에서는 이 감정들이 동기가 내부에서 나오는 것처럼 느끼게 만들도록 되어 있다고 말해요. 만약 우리가 사회적 압박에 반응하고 있다는 것을 의식적으로 깨닫는다면 행동이 투덜대거나 냉소적으로 보여 설득력이 떨어질 수 있죠. 그래서 동기의 내면화가 중요합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 집단 내 관계가 성공을 좌우한다는 핵심 주장을 제시하고, 이후 문장들은 \u003cb class=\"key\">진화적 \u003c/b>\u003cb class=\"key\">압력\u003c/b>이 \u003cb class=\"key\">자존감\u003c/b>이라는 내면의 감시 체계를 만들었다고 설명한다. 마지막까지 원인과 결과를 차례로 전개하므로 \u003cb class=\"key\">인과\u003c/b> 구조이며, 주제가 앞에 오는 \u003cb class=\"key\">두괄식\u003c/b>이다. The result, crucially 같은 신호어가 논리적 흐름을 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>If the group valued us (2)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>If it didn't (3)\u003c/b>\u003cspan>대조 조건\u003c/span>\u003cb>Over millions of years (5)\u003c/b>\u003cspan>시간적 배경\u003c/span>\u003cb>The result was (6)\u003c/b>\u003cspan>결과 도출\u003c/span>\u003cb>And, crucially (9)\u003c/b>\u003cspan>핵심 강조\u003c/span>\u003cb>If we realized (10)\u003c/b>\u003cspan>반대 조건\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">navigated relationships in a group\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">if the group valued us\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">our standing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">how other people in our community perceive us\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">self-esteem and such related emotions as pride, shame, or insecurity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">what makes our community value us\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">responding to social pressure\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>집단이 가치 있게 여김\u003c/th>\u003cth>집단이 가치 있게 여기지 않음\u003c/th>\u003c/tr>\u003ctr>\u003ctd>지원, 자원, 짝을 기대할 수 있음\u003c/td>\u003ctd>이점들을 얻지 못함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>생존과 번식에 유리\u003c/td>\u003ctd>생존과 번식에 불리\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 인과 구조이고 두괄식 전개입니다. 첫 문장에서 집단 내 관계가 성공을 좌우한다는 핵심 주장을 제시하고, 이후 문장들은 진화적 압력이 자존감이라는 내면의 감시 체계를 만들었다고 설명해요. 마지막까지 원인과 결과가 차례로 이어지고요. 주제가 앞에 오기 때문에 두괄식으로 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"신호어를 확인해 볼게요. 두 번째 문장의 If the group valued us와 세 번째 문장의 If it didn't는 조건을 대조하고요. 다섯 번째 문장의 Over millions of years는 시간적 배경을, 여섯 번째 문장의 The result was는 결과 도출을 알려 줍니다. 아홉 번째 문장의 And, crucially는 핵심을 강조하고, 열 번째 문장의 If we realized는 반대 조건을 제시하죠. 또 navigated relationships in a group이 our standing, how other people in our community perceive us, self-esteem and such related emotions, what makes our community value us, responding to social pressure로 계속 바뀌어 표현된 점도 눈여겨보세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>thrive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>번영하다, 성공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>depend on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 달려 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>navigate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(관계를) 잘 다루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>value\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가치 있게 여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>count on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기대하다, 의지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>resource\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원\u003c/span>\u003c/div>\u003cdiv>\u003cb>mate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>짝, 배우자\u003c/span>\u003c/div>\u003cdiv>\u003cb>merit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이점, 가치\u003c/span>\u003c/div>\u003cdiv>\u003cb>survival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생존\u003c/span>\u003c/div>\u003cdiv>\u003cb>genetically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>유전적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>pressure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>압박\u003c/span>\u003c/div>\u003cdiv>\u003cb>select for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 선택하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sensitive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>민감한\u003c/span>\u003c/div>\u003cdiv>\u003cb>maximize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>최대화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>standing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지위, 평판\u003c/span>\u003c/div>\u003cdiv>\u003cb>tendency\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경향\u003c/span>\u003c/div>\u003cdiv>\u003cb>unconsciously\u003c/b>\u003cem>부사\u003c/em>\u003cspan>무의식적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>monitor\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관찰하다, 감시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>perceive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-esteem\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자존감\u003c/span>\u003c/div>\u003cdiv>\u003cb>pride\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자존심\u003c/span>\u003c/div>\u003cdiv>\u003cb>shame\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수치심\u003c/span>\u003c/div>\u003cdiv>\u003cb>insecurity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불안, 자신감 없음\u003c/span>\u003c/div>\u003cdiv>\u003cb>compel\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강요하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>motivation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동기\u003c/span>\u003c/div>\u003cdiv>\u003cb>crucially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>결정적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>conscious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의식적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>come off as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 보이다, ~한 인상을 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>persuasive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>설득력 있는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘를 몇 개 짚어 볼게요. thrive는 번영하다, depend on은 달려 있다, navigate는 관계를 잘 다루다라는 뜻이에요. count on은 기대하다, standing은 지위, perceive는 인식하다, self-esteem은 자존감, compel은 강요하다, come off as는 어떤 인상을 주다라는 뜻으로 쓰였습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">thrive\u003c/b>\u003cspan class=\"m\">번영하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">succeed\u003c/span>\u003cspan class=\"s\">flourish\u003c/span>\u003cspan class=\"s\">prosper\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fail\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">value\u003c/b>\u003cspan class=\"m\">가치 있게 여기다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">esteem\u003c/span>\u003cspan class=\"s\">appreciate\u003c/span>\u003cspan class=\"s\">prize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">devalue\u003c/span>\u003cspan class=\"a\">disregard\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sensitive\u003c/b>\u003cspan class=\"m\">민감한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">responsive\u003c/span>\u003cspan class=\"s\">attuned\u003c/span>\u003cspan class=\"s\">perceptive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insensitive\u003c/span>\u003cspan class=\"a\">indifferent\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">perceive\u003c/b>\u003cspan class=\"m\">인식하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">discern\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">overlook\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">compel\u003c/b>\u003cspan class=\"m\">강요하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">force\u003c/span>\u003cspan class=\"s\">drive\u003c/span>\u003cspan class=\"s\">impel\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">allow\u003c/span>\u003cspan class=\"a\">deter\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">persuasive\u003c/b>\u003cspan class=\"m\">설득력 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">convincing\u003c/span>\u003cspan class=\"s\">compelling\u003c/span>\u003cspan class=\"s\">plausible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unconvincing\u003c/span>\u003cspan class=\"a\">weak\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 둡시다. thrive는 succeed, flourish와 비슷하고 fail, decline과 반대예요. value는 esteem, appreciate와 비슷하고 devalue, disregard와 반대입니다. sensitive는 responsive, attuned와 비슷하고 insensitive, indifferent와 반대예요. perceive는 recognize, discern과 비슷하고 ignore, overlook과 반대입니다. compel은 force, drive와 비슷하고 allow, deter와 반대고요. persuasive는 convincing, compelling과 비슷하고 unconvincing, weak와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인으로서,\u003c/span>\u003cspan class=\"en\">As individuals,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">성공하려는 우리의 능력은\u003c/span>\u003cspan class=\"en\">our ability \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">thrive\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 달려 있었다\u003c/span>\u003cspan class=\"en\">depended on\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 관계를 얼마나 잘 다루는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">navigated \u003c/span>\u003cspan class=\"tgt\">relationships\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">집단 내에서.\u003c/span>\u003cspan class=\"en\">in a group.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">개인으로서 성공하려는 우리의 능력은 우리가 집단 내에서 관계를 얼마나 잘 다루는지에 달려 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 문장은 글 전체의 핵심 전제로, 인간이 잘 살아가는 능력이 집단 안에서 관계를 \u003cb class=\"key\">능숙하게\u003c/b> 다루는 데 달려 있었다고 제시한다. thrive는 단순한 생존을 넘어 \u003cb class=\"key\">번성\u003c/b>을 뜻하고, navigated relationships는 배를 조종하듯 관계를 헤쳐 나가다로 풀이할 수 있다. 이는 뒤에 나올 집단의 평가와 자존감 논의로 이어지는 \u003cb class=\"key\">도입부\u003c/b> 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : our ability + [to thrive] : \"성공하려는/번성하려는 우리의 능력\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사 how + 주어 + 동사)\u003c/span> : depended on + [how well + 주어(we) + 동사(navigated) + 목적어(relationships)] : \"우리가 관계를 얼마나 잘 다루는지\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"As individuals, 개인으로서. our ability to thrive, 성공하려는 우리의 능력은. depended on, ~에 달려 있었다. how well we navigated relationships, 우리가 관계를 얼마나 잘 다루는지. in a group, 집단 내에서.. 이 문장 전체를 해석하면, 개인으로서 성공하려는 우리의 능력은 우리가 집단 내에서 관계를 얼마나 잘 다루는지에 달려 있었다.","hl":"m"},{"n":13,"text":"이 첫 번째 문장은 글 전체의 출발점이에요. 인간이 잘 살아가는 능력, 즉 thrive는 혼자만 잘하는 게 아니라 집단 안에서 관계를 얼마나 잘 다루느냐에 달려 있었다는 핵심 전제를 깔아 줘요. 그리고 navigated relationships는 배를 조종하듯 복잡한 인간관계를 능숙하게 헤쳐 나간다는 뜻이라서, 이 전제 덕분에 뒤에서 집단의 평가와 자존감 이야기가 자연스럽게 이어져요.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 to thrive입니다. ability를 뒤에서 꾸며 주는 to부정사의 형용사적 용법으로, ability 같은 추상 명사 뒤에 오면 어떤 능력인지 구체적으로 설명해 줘요. 두 번째 포인트는 how well we navigated relationships입니다. 의문사 how가 이끄는 절이 전치사 on의 목적어로 쓰인 간접의문문인데, 의문사 뒤에 주어 we와 동사 navigated가 오는 평서문 어순이 핵심이에요. 그래서 depended on how well we navigated relationships는 우리가 관계를 얼마나 잘 다루는지에 달려 있었다로 자연스럽게 이어집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그 집단이 우리를 가치 있게 여겼다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">group \u003c/span>\u003cspan class=\"tgt\">valued \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 기대할 수 있었을 것이다\u003c/span>\u003cspan class=\"en\">we could count on\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지원, 자원,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">support, \u003c/span>\u003cspan class=\"tgt\">resources, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 아마도 짝을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">probably \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">mate\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 그 집단이 우리를 가치 있게 여겼다면 우리는 지원, 자원, 그리고 아마도 짝을 기대할 수 있었을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 집단이 나를 가치 있게 여길 때 얻게 되는 이점을 \u003cb class=\"key\">지원\u003c/b>, \u003cb class=\"key\">자원\u003c/b>, \u003cb class=\"key\">짝\u003c/b>으로 구체화한 조건문이다. count on은 단순한 기대가 아니라 신뢰를 바탕으로 확실히 얻을 수 있다는 확신을 뜻하며, probably는 짝 선택에 불확실성이 있음을 보여 준다. 집단의 인정이 생존과 번식에 직결된다는 점을 드러낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건의 부사절 (직설법 if절, 가정법 아님)\u003c/span> : If + 주어(the group) + 과거동사(valued) + 목적어(us), 주어 + could + 동사원형 : \"만약 그 집단이 우리를 가치 있게 여겼다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사(구) 병렬 구조\u003c/span> : A(support), B(resources), and C(probably a mate) : \"지원, 자원, 그리고 아마도 짝\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"If the group valued us, 만약 그 집단이 우리를 가치 있게 여겼다면. we could count on, 우리는 기대할 수 있었을 것이다. support, resources, 지원, 자원. and probably a mate, 그리고 아마도 짝을.. 이 문장 전체를 해석하면, 만약 그 집단이 우리를 가치 있게 여겼다면 우리는 지원, 자원, 그리고 아마도 짝을 기대할 수 있었을 것이다.","hl":"m"},{"n":16,"text":"두 번째 문장은 집단이 나를 가치 있게 여겼을 때 얻게 되는 이점을 지원, 자원, 그리고 아마도 짝으로 정리해 줘요. 여기서 count on은 그냥 바라는 정도가 아니라 확실히 믿고 의지할 수 있다는 뜻이고, probably는 짝 선택에는 불확실성이 있다는 뉘앙스를 살려 줘요. 그래서 집단의 인정이 생존과 번식에 직결된다는 점을 보여 주는 셈이에요.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 If the group valued us입니다. 과거 시제가 쓰였지만 가정법이 아니라 실제 과거 상황을 나타내는 직설법 조건문이에요. 주절에서는 과거의 가능성을 나타내는 could와 동사원형 count on이 함께 쓰였죠. 두 번째 포인트는 support, resources, and probably a mate에 주목하세요. 세 개의 명사구가 and로 연결된 병렬 구조로, 집단이 가치 있게 여겼을 때 얻을 수 있는 이점을 선명하게 나열하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그렇지 않았다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">didn't\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 얻지 못했을 것이다\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">might \u003c/span>\u003cspan class=\"tgt\">get\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이점들 중 아무것도.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">none \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">merits\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 그렇지 않았다면, 우리는 그러한 이점들 중 아무것도 얻지 못했을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장과 대조되는 조건절로, 집단이 가치를 인정하지 않는 경우에는 지원, 자원, 짝 같은 이점을 전혀 얻지 못했을 것임을 말한다. these merits는 두 번째 문장에서 제시한 이점들을 가리키며, none of를 통해 \u003cb class=\"key\">완전한 \u003c/b>\u003cb class=\"key\">배제\u003c/b>를 강조한다. 생존과 유전적 번식의 관점에서 집단의 평가가 절박한 문제였음을 \u003cb class=\"key\">대비\u003c/b>로 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건절의 대동사 did (생략)\u003c/span> : If + 주어(it) + did + not [= didn't] : \"만약 그렇지 않았다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 might + 동사원형\u003c/span> : 주어(we) + might + [get] + 목적어(none of these merits) : \"얻지 못했을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">부정대명사 none of\u003c/span> : none of + [these merits] : \"이점들 중 아무것도\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"If it didn't, 만약 그렇지 않았다면. we might get, 우리는 얻지 못했을 것이다. none of these merits, 이점들 중 아무것도.. 이 문장 전체를 해석하면, 만약 그렇지 않았다면, 우리는 그러한 이점들 중 아무것도 얻지 못했을 것이다.","hl":"m"},{"n":19,"text":"세 번째 문장은 앞 문장과 정반대 조건을 제시해요. 집단이 나를 가치 있게 여기지 않으면 지원, 자원, 짝 같은 이점을 하나도 얻지 못했을 것이라고 말해요. these merits는 바로 앞 문장의 세 가지 이점을 가리키고, none of를 써서 전혀 얻지 못한다는 완전한 배제를 강조하고 있어요.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 If it didn't입니다. didn't는 앞 문장의 valued us를 대신하는 대동사라서, if it didn't만으로 만약 그 집단이 우리를 가치 있게 여기지 않았다면이라는 의미가 되어 반복을 피해 줘요. 두 번째 포인트는 might get입니다. might는 과거의 불확실한 가능성을 나타내는 조동사이고 뒤에 동사원형 get이 와서, 이점을 얻을 가능성이 거의 없다는 것을 완곡하게 표현해요. 세 번째 포인트는 none of these merits인데, none은 부정대명사로 of 뒤에 these merits라는 특정 범위를 써서 그 범위 안에서 하나도 없다는 뜻을 강조합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 생존의 문제였는데,\u003c/span>\u003cspan class=\"en\">It was \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">matter \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">survival\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신체적으로 그리고 유전적으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">physically \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">genetically\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 신체적으로 그리고 유전적으로 생존의 문제였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 집단이 나를 가치 있게 여기는지가 단순한 기분 문제가 아니라 \u003cb class=\"key\">생존의 \u003c/b>\u003cb class=\"key\">문제\u003c/b>였다고 정리한다. physically and genetically는 생존이 신체적·유전적 성공에 직결된다는 점을 강조한다. 이후 문장에서 이 \u003cb class=\"key\">자연선택\u003c/b> 압력이 어떤 사람을 선택했는지로 연결된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">a matter of ~ 관용 표현\u003c/span> : a matter of + 명사 = ~의 문제 : \"생존의 문제\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사 병렬 구조\u003c/span> : 부사(physically) + and + 부사(genetically) : \"신체적으로 그리고 유전적으로\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"It was a matter of survival, 그것은 생존의 문제였는데. physically and genetically, 신체적으로 그리고 유전적으로.. 이 문장 전체를 해석하면, 그것은 신체적으로 그리고 유전적으로 생존의 문제였다.","hl":"m"},{"n":22,"text":"이 문장은 앞에서 말한 집단이 나를 가치 있게 여기고 그렇지 않느냐가 단순한 기분 문제가 아니라 생존의 문제였다는 점을 정리해 줍니다. 신체적으로 그리고 유전적으로라는 부사구가 생존에 직결된다는 뜻을 분명히 해 줘요. 이제 다음 문장에서 그 생존 압력이 진화적으로 어떤 인간을 선택했는지로 자연스럽게 넘어갑니다.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 a matter of survival입니다. a matter of는 어떤 사안이나 문제라는 뜻의 관용 표현으로, 뒤에 survival을 붙여서 생존의 문제라고 해석합니다. 두 번째 포인트는 physically and genetically입니다. 두 부사가 and로 병렬 연결되어 앞의 생존의 문제를 신체적으로 또 유전적으로라고 수식합니다. 이처럼 and로 연결된 병렬 구조는 시험에서 자주 출제됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수백만 년 동안,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Over \u003c/span>\u003cspan class=\"tgt\">millions \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">years\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 압박은 사람들을 선택했다\u003c/span>\u003cspan class=\"en\">the pressure \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">selected \u003c/span>\u003cspan class=\"tgt\">for\u003c/span> people\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">민감한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">sensitive \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 능숙한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">skilled \u003c/span>\u003cspan class=\"tgt\">at\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 지위를 최대화하는 데.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">maximizing \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">standing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">수백만 년 동안 그러한 압박은 자신의 지위를 최대화하는 데 민감하고 능숙한 사람들을 선택했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">자연선택\u003c/b>의 압력이 오랜 세월에 걸쳐 자신의 \u003cb class=\"key\">지위\u003c/b>를 최대화하는 데 민감하고 능숙한 사람들을 선택했다는 진화적 원리를 제시한다. selected for는 단순한 선택이 아니라 그런 특성이 살아남도록 골라졌다는 뜻이다. 이는 다음 문장의 무의식적 관찰 경향 발달로 이어진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 부사적 용법(시간)\u003c/span> : Over + 기간 = ~ 동안 : \"수백만 년 동안\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사구\u003c/span> : select for + 명사 = ~을 선택하다 : \"~을 선택했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 + 형용사 병렬\u003c/span> : 선행사(people) + who + are + 형용사구 and 형용사구 : \"민감하고 능숙한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">동명사구\u003c/span> : 동명사(maximizing) + 목적어(their standing) : \"자신의 지위를 최대화하는 것\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Over millions of years, 수백만 년 동안. the pressure selected for people, 그 압박은 사람들을 선택했다. who are sensitive to, 민감한. and skilled at, 그리고 능숙한. maximizing their standing, 자신의 지위를 최대화하는 데.. 이 문장 전체를 해석하면, 수백만 년 동안 그러한 압박은 자신의 지위를 최대화하는 데 민감하고 능숙한 사람들을 선택했다.","hl":"m"},{"n":25,"text":"이 문장은 수백만 년에 걸친 자연선택의 압력이 어떤 사람들을 골랐는지 설명합니다. 자신의 지위를 최대화하는 데 민감하고 능숙한 사람들이 선택되었다는 거죠. selected for는 단순히 뽑았다가 아니라 진화적으로 살아남도록 선택했다는 의미로 봐야 합니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 Over millions of years입니다. 전치사구가 문장 맨 앞에서 시간을 나타내며, 수백만 년 동안이라고 해석합니다. 두 번째는 selected for입니다. selected for는 어떤 대상을 선택한다는 뜻의 동사구로, 여기서는 자연선택이 사람들을 골랐다는 의미를 전달합니다. 세 번째는 who are sensitive to and skilled at입니다. who는 선행사 people을 수식하는 주격 관계대명사이고, sensitive to와 skilled at이 and로 병렬 연결되어 민감하고 능숙한 사람들이라는 뜻을 만듭니다. 네 번째는 maximizing their standing입니다. maximizing은 동명사로 뒤에 목적어 their standing을 이끌고, 전치사 to와 at의 목적어 자리에 쓰인 동명사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 결과는 ~이었다\u003c/span>\u003cspan class=\"en\">The result was\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 경향의 발달이었다\u003c/span>\u003cspan class=\"en\">the development of a tendency\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무의식적으로 관찰하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">unconsciously \u003c/span>\u003cspan class=\"tgt\">monitor\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 공동체의 다른 사람들이 어떻게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">community \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리를 인식하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">perceive \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 결과는 우리 공동체의 다른 사람들이 우리를 어떻게 인식하는지 무의식적으로 관찰하는 경향의 발달이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자연선택의 결과로 사람들이 공동체의 다른 구성원이 나를 어떻게 보는지 \u003cb class=\"key\">무의식적\u003c/b>으로 관찰하는 경향을 갖게 되었음을 설명한다. monitor는 계속해서 \u003cb class=\"key\">관찰\u003c/b>하고 살피는 행위, perceive는 타인의 \u003cb class=\"key\">인식\u003c/b>이나 평가를 받아들이는 과정을 가리킨다. 이 정보가 자존감과 감정으로 처리된다는 다음 문장의 기반을 마련한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : a tendency + to + 동사원형 = ~하는 경향 : \"무의식적으로 관찰하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : how + 주어 + 동사 = 어떻게 ~하는지 : \"우리 공동체의 다른 사람들이 우리를 어떻게 인식하는지\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"The result was, 그 결과는 ~이었다. the development of a tendency, 어떤 경향의 발달이었다. to unconsciously monitor, 무의식적으로 관찰하는. how other people in our community, 우리 공동체의 다른 사람들이 어떻게. perceive us, 우리를 인식하는지. 이 문장 전체를 해석하면, 그 결과는 우리 공동체의 다른 사람들이 우리를 어떻게 인식하는지 무의식적으로 관찰하는 경향의 발달이었다.","hl":"m"},{"n":28,"text":"여기서는 그 선택의 결과로 사람들이 공동체의 다른 사람들이 자신을 어떻게 보는지 무의식적으로 관찰하는 경향이 생겼다고 말합니다. 이 관찰은 우리가 의식하지 못한 채 일어나고, 그 정보가 뒤에 나오는 자존감과 감정으로 처리된다는 흐름으로 이어집니다. monitor와 perceive는 각각 계속 살피는 관찰과 타인의 평가를 알아차리는 인식을 뜻합니다.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 to unconsciously monitor입니다. to부정사가 앞의 명사 a tendency를 수식하는 형용사적 용법으로, 무의식적으로 관찰하는 경향이라고 해석합니다. 부사 unconsciously가 to와 monitor 사이에 들어가 monitor를 꾸며 줍니다. 두 번째는 how other people in our community perceive us입니다. how가 이끄는 절이 monitor의 목적어로 쓰이는 간접의문문입니다. 간접의문문은 의문사 다음에 주어와 동사 순서로 오는 점이 중요합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 그 정보를 처리한다 자존감의 형태로 그리고 그러한 관련된 감정들 자존심, 수치심 또는 불안 같은\u003c/span>\u003cspan class=\"en\">We process that information in the form of self­esteem and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">related \u003c/span>\u003cspan class=\"tgt\">emotions \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">pride, \u003c/span>\u003cspan class=\"tgt\">shame, \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">insecurity\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 자존감 그리고 자존심, 수치심 또는 불안 같은 관련된 감정의 형태로 그 정보를 처리한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리는 타인의 평가라는 정보를 \u003cb class=\"key\">자존감\u003c/b>이나 \u003cb class=\"key\">관련 \u003c/b>\u003cb class=\"key\">감정\u003c/b>으로 변환해 처리한다는 뜻입니다. 즉, 사회적 평가가 머릿속에서 감정의 언어로 번역되는 것이죠. 이 문장은 앞서 제시된 감시 경향이 실제로 어떻게 작동하는지 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">such A as B (예시 나열)\u003c/span> : such + 명사구(A) + as + 예시(B) : \"자존심, 수치심, 불안 같은 관련된 감정들\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"We process that information, 우리는 그 정보를 처리한다. in the form of self-esteem, 자존감의 형태로. and such related emotions, 그리고 그러한 관련된 감정들. as pride, shame, or insecurity, 자존심, 수치심 또는 불안 같은. 이 문장 전체를 해석하면, 우리는 자존감 그리고 자존심, 수치심 또는 불안 같은 관련된 감정의 형태로 그 정보를 처리한다.","hl":"m"},{"n":31,"text":"여기서는 우리 뇌가 타인의 시선을 자존감이나 자존심 같은 감정으로 바꾼다는 뜻이에요. 평가 정보가 머릿속에서 감정의 언어로 번역되는 거죠. 그래서 우리는 사회적 평가를 직접 의식하지 않고도 느끼게 됩니다.","hl":"mn"},{"n":32,"text":"문장 후반부에 such related emotions as pride, shame, or insecurity가 나오는데요. 여기서 such A as B는 A와 같은 B라는 뜻으로, 뒤에 예시를 나열하는 표현이에요. pride, shame, insecurity는 related emotions의 구체적인 예시들이고요. such as가 떨어져 있지만 하나의 관용 표현으로 보면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 감정들은 우리를 강요한다\u003c/span>\u003cspan class=\"en\">These emotions \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">compel \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 공동체가 우리를 가치 있게 여기도록 만드는 것을 더 많이 하도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span> more of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">community \u003c/span>\u003cspan class=\"tgt\">value \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그렇지 않은 것을 덜 하도록\u003c/span>\u003cspan class=\"en\">and less of \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">doesn't\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 감정들은 우리에게 우리의 공동체가 우리를 가치 있게 여기도록 만드는 것을 더 많이 하고 그렇지 않은 것을 덜 하도록 강요한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 감정들은 \u003cb class=\"key\">행동\u003c/b>의 방향을 조종합니다. 공동체가 나를 \u003cb class=\"key\">가치 \u003c/b>\u003cb class=\"key\">있게 \u003c/b>\u003cb class=\"key\">여기게 \u003c/b>\u003cb class=\"key\">하는\u003c/b> 행동은 더 많이, 그렇지 않은 행동은 덜 하게 만든다는 의미예요. 따라서 사회적 평가가 감정을 통해 행동으로 이어지는 흐름이 드러납니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">compel + 목적어 + to부정사\u003c/span> : compel + 목적어(us) + to부정사(to do) : \"우리가 하도록 강요하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 what + 사역동사 make\u003c/span> : what + 불완전한 절 (makes의 주어 없음) / make + 목적어 + 동사원형 : \"우리 공동체가 우리를 가치 있게 여기도록 만드는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조동사로 대신한 생략 표현\u003c/span> : what + does not (makes our community value us 생략) : \"그렇지 않은 것\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"These emotions compel us, 이러한 감정들은 우리를 강요한다. to do more of what makes our community value us, 우리 공동체가 우리를 가치 있게 여기도록 만드는 것을 더 많이 하도록. and less of what doesn't, 그리고 그렇지 않은 것을 덜 하도록. 이 문장 전체를 해석하면, 이러한 감정들은 우리에게 우리의 공동체가 우리를 가치 있게 여기도록 만드는 것을 더 많이 하고 그렇지 않은 것을 덜 하도록 강요한다.","hl":"m"},{"n":34,"text":"이 감정들은 우리 행동을 조종하는 힘이에요. 공동체가 나를 인정해 주는 행동은 더 많이 하게 만들고, 그 반대 행동은 덜 하게 만든다는 뜻이죠. 결국 사회적 평가가 감정을 통해 행동의 방향을 정하는 겁니다.","hl":"mn"},{"n":35,"text":"첫 번째, compel us to do에서 compel은 목적어 us와 to부정사 to do를 데리고 와서 우리가 하도록 강요한다는 의미를 만듭니다. 두 번째, what makes our community value us에서 what은 makes의 주어가 없는 불완전한 절을 이끄는 관계대명사예요. 동시에 make our community value us는 사역동사 make가 목적어 our community와 동사원형 value를 취하는 구조입니다. 세 번째, more of what makes our community value us and less of what doesn't는 서로 대응하는 비교 병렬 구조인데요. 뒤의 what doesn't에는 makes our community value us가 반복되는 대신 does not으로 생략되어 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 결정적으로\u003c/span>\u003cspan class=\"en\">And, crucially,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 의도되어 있다\u003c/span>\u003cspan class=\"en\">they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">meant \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 동기를 느끼도록 만들도록\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">motivation \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 내부에서 나오고 있는 것처럼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">coming \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">within\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 결정적으로 그것들은 그 동기가 내부에서 나오고 있는 것처럼 그것을 느끼게 만들도록 되어 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 감정의 가장 중요한 역할을 말합니다. 동기가 \u003cb class=\"key\">외부 \u003c/b>\u003cb class=\"key\">압력\u003c/b>이 아니라 \u003cb class=\"key\">내부\u003c/b>에서 자발적으로 생긴 것처럼 느끼게 한다는 뜻이죠. 그래야 우리 행동이 사회적 요구에 의한 것이 아니라 진심에서 나온 것처럼 보입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be meant to부정사\u003c/span> : be meant + to부정사(to make) : \"~하도록 되어 있다, ~하도록 의도되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사 make + 목적어 + 동사원형\u003c/span> : make + 목적어(that motivation) + 동사원형(feel) : \"그 동기가 느끼도록 만들다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">feel like + 주어 + 동사\u003c/span> : feel like + 주어(it) + 동사(is coming) : \"그것이 내부에서 나오고 있는 것처럼 느끼다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"And, crucially, 그리고 결정적으로. they are meant, 그것들은 의도되어 있다. to make that motivation feel, 그 동기를 느끼도록 만들도록. like it is coming from within, 그것이 내부에서 나오고 있는 것처럼. 이 문장 전체를 해석하면, 그리고 결정적으로 그것들은 그 동기가 내부에서 나오고 있는 것처럼 그것을 느끼게 만들도록 되어 있다.","hl":"m"},{"n":37,"text":"이 문장은 감정의 가장 중요한 기능을 말해요. 우리가 사회적 압력에 반응한다는 사실을 의식하지 못하도록, 동기가 내 안에서 저절로 생긴 것처럼 느끼게 만든다는 거죠. 그래야 우리 행동이 사회적 요구에 의한 것이 아니라 자발적인 것처럼 보입니다.","hl":"mn"},{"n":38,"text":"첫 번째, are meant to make는 be meant to부정사 표현으로 무엇을 하도록 의도되다, 되어 있다는 의미입니다. 두 번째, make that motivation feel은 사역동사 make가 목적어 that motivation과 동사원형 feel을 취하는 구조예요. 목적어가 스스로 feel 하는 게 아니라 감정이 동기가 그렇게 느끼도록 만드는 거죠. 세 번째, feel like it is coming from within에서 feel like는 마치 무엇인가처럼 느끼다는 뜻이고, like 다음에 주어와 동사가 있는 절이 오는 구문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 우리가 깨달았다면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">realized\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의식적인 수준에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">on \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">conscious \u003c/span>\u003cspan class=\"tgt\">level\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 사회적 압박에 반응하고 있었다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">responding \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">pressure\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 행동은 나타날 수 있다\u003c/span>\u003cspan class=\"en\">our performance might come off\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">투덜대거나 냉소적인 것으로\u003c/span>\u003cspan class=\"en\">as grudging or cynical,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 덜 설득력 있게 만들면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">persuasive\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 사회적 압박에 반응하고 있었다는 것을 의식적인 수준에서 깨닫는다면, 우리의 행동은 그것(그 동기)을 설득력이 떨어지게 만들면서 투덜대거나 냉소적인 것으로 나타날 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 감정이 동기를 내면에서 나오는 것처럼 느끼게 해야 하는 이유를 설명한다. 만약 사회적 압박에 의식적으로 반응하고 있다는 사실을 깨달으면, 행동이 \u003cb class=\"key\">마지못해 \u003c/b>\u003cb class=\"key\">하는\u003c/b> 또는 \u003cb class=\"key\">냉소적인\u003c/b> 태도로 비치어 \u003cb class=\"key\">설득력\u003c/b>이 떨어지기 때문이다. 즉, 무의식적인 동기가 오히려 사회적 메시지를 더 효과적으로 전달하는 장치임을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가정법 과거\u003c/span> : If + 주어 + 과거동사, 주어 + might + 동사원형 : \"만약 우리가 깨달았다면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">삽입구\u003c/span> : 주절 사이에 콤마로 둘러싸인 부사구 : \"의식적인 수준에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">접속사 that (목적어를 이끄는 명사절)\u003c/span> : realized [타동사] + that + 완전한 절(목적어) : \"우리가 사회적 압박에 반응하고 있었다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : 주절, ~ing ... : \"그것을 덜 설득력 있게 만들면서\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"If we realized, 만약 우리가 깨달았다면. on a conscious level, 의식적인 수준에서. that we were responding to social pressure, 우리가 사회적 압박에 반응하고 있었다는 것을. our performance might come off, 우리의 행동은 나타날 수 있다. as grudging or cynical, 투덜대거나 냉소적인 것으로. making it less persuasive, 그것을 덜 설득력 있게 만들면서. 이 문장 전체를 해석하면, 우리가 사회적 압박에 반응하고 있었다는 것을 의식적인 수준에서 깨닫는다면, 우리의 행동은 그것(그 동기)을 설득력이 떨어지게 만들면서 투덜대거나 냉소적인 것으로 나타날 수 있다.","hl":"m"},{"n":40,"text":"이 문장은 바로 앞 문장에서 말한 동기가 내면에서 나오는 것처럼 느껴야 하는 이유를 설명합니다. 만약 우리가 사회적 압박에 반응하고 있다는 걸 의식적으로 깨달으면 우리 행동이 마지못해 하는 것처럼 보이거나 냉소적으로 보여서 설득력이 떨어진다는 거예요. 그래서 감정이 무의식적으로 작동하는 것이 더 효과적이라는 뜻입니다.","hl":"mn"},{"n":41,"text":"첫 번째로 If we realized에서 가정법 과거를 볼 수 있어요. 만약 우리가 깨달았다면 이라고 해석하고, 현재 사실이 아니거나 실현 가능성이 낮은 일을 가정할 때 if절에 과거형 동사를 씁니다. 두 번째로 on a conscious level은 콤마로 둘러싸인 삽입구예요. 없어도 문장 구조가 성립하는 추가 정보입니다. 세 번째로 that we were responding to social pressure는 realized의 목적어 자리에 온 명사절이에요. that은 명사절을 이끄는 접속사입니다. 네 번째로 문장 끝의 making it less persuasive는 분사구문이에요. 주절의 결과나 부대 상황을 나타내고, 의미상 주어가 our performance여서 능동인 현재분사 making을 썼습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>개인의 성공은 \u003cb class=\"key\">집단 \u003c/b>\u003cb class=\"key\">내 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 얼마나 잘 다루는지에 달려 있었고, 집단의 가치 평가는 \u003cb class=\"key\">생존\u003c/b>과 번식에 직결되었다.\u003c/li>\u003cli>수백만 년의 \u003cb class=\"key\">진화적 \u003c/b>\u003cb class=\"key\">압력\u003c/b>이 지위를 최대화하는 데 민감한 사람들을 선택하여 타인의 인식을 \u003cb class=\"key\">무의식적\u003c/b>으로 감시하는 경향을 만들었다.\u003c/li>\u003cli>이 정보는 \u003cb class=\"key\">자존감\u003c/b>과 자존심, 수치심, 불안 같은 감정으로 처리되어 공동체가 가치 있게 여기는 행동을 강화한다.\u003c/li>\u003cli>이 동기는 \u003cb class=\"key\">내부에서\u003c/b> 나오는 것처럼 느껴져야 하며, 사회적 압박에 반응하고 있음을 의식하면 행동이 투덜대거나 냉소적으로 보여 \u003cb class=\"key\">설득력\u003c/b>이 떨어진다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Self-esteem evolved as an internalized, unconscious response to social evaluation that motivates us to act in ways that raise our standing.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">집단이 나를 가치 있게 여기는지가 \u003cb class=\"key\">생존\u003c/b>과 번식에 직결되었기에, 진화적 압력은 타인의 시선을 \u003cb class=\"key\">무의식적\u003c/b>으로 감시하고 이를 \u003cb class=\"key\">자존감\u003c/b> 같은 감정으로 처리하는 경향을 만들었다. 이 감정은 사회적 압박에 대한 반응을 \u003cb class=\"key\">내부 \u003c/b>\u003cb class=\"key\">동기\u003c/b>처럼 느끼게 하여 행동의 \u003cb class=\"key\">설득력\u003c/b>을 높인다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 지문을 정리하면요. 집단의 평가는 생존과 번식에 직결되었고, 그래서 우리는 타인의 시선을 무의식적으로 살피는 존재가 되었어요. 그 정보는 자존감과 같은 감정으로 처리되어 행동을 조절하고, 이 동기는 내부에서 나오는 것처럼 느껴져야 설득력이 생깁니다. 자존감의 뿌리를 사회적 관계에서 찾은 점을 꼭 기억해 두세요. 오늘 수고 많았습니다.","hl":null}]}]});</script></body></html>
