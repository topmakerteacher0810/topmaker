}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 34번","audioDir":"34_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">34번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>The End of Climate Fiction\u003c/h1>\u003ch2>기후 픽션의 종말\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>기후 변화가 인간 삶의 \u003cb class=\"key\">주변적인 \u003c/b>\u003cb class=\"key\">특징\u003c/b>으로 여겨지는 동안에는 \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">픽션\u003c/b>이 성립하지만, 기온이 더 오르고 그 영향이 일상에 \u003cb class=\"key\">명백\u003c/b>해지면 기후 변화는 더 이상 \u003cb class=\"key\">이야기\u003c/b>가 되지 못한다. 지금의 기후 이야기는 \u003cb class=\"key\">현실 \u003c/b>\u003cb class=\"key\">도피\u003c/b>적 즐거움을 주지만, 기후 고통이 \u003cb class=\"key\">멀리\u003c/b> 있다고 느끼지 못하면 \u003cb class=\"key\">가장\u003c/b>의 방식이 달라진다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>As climate change becomes too large and obvious, it may cease to be a story, eliminating climate fiction and even the effort to narrate warming.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 전국연합학력평가 서른네 번째 지문입니다. 제목은 The End of Climate Fiction, 우리말로는 기후 픽션의 종말이라는 내용이에요. 이 글은 기후 변화가 너무 커지고 명백해지면 오히려 기후 변화를 다룬 이야기가 사라질 수 있다고 말합니다. 요지는 As climate change becomes too large and obvious, it may cease to be a story, eliminating climate fiction and even the effort to narrate warming. 정도로 정리할 수 있어요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">기후 변화나 환경 재난을 소재로 한 소설·영화 장르를 \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">픽션\u003c/b>(Climate Fiction)이라고 한다. 지금은 기후 변화가 나와 직접 연결된 문제라기보다는 먼 미래나 먼 지역의 일처럼 느껴져서, 공포를 오락처럼 즐기는 \u003cb class=\"key\">현실 \u003c/b>\u003cb class=\"key\">도피\u003c/b> 장치로 작동한다. 마치 폭우가 창밖에 보이기 전에는 재난 영화가 재미있는 것과 비슷하다. 그런데 기온이 몇 도 더 오르고 그 영향이 일상에 \u003cb class=\"key\">명백\u003c/b>해지면, 이야기보다 현실이 더 커져 버린다. 이 글은 그때 \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">픽션\u003c/b>이 \u003cb class=\"key\">서사\u003c/b>(narrative)로서 성립할 수 없게 된다고 말한다.\u003c/div>","segs":[{"n":2,"text":"여러분, climate fiction이라는 말 들어 봤죠? 기후 변화나 환경 재난을 소재로 한 소설이나 영화 장르를 보통 Climate Fiction이라고 해요. 지금은 기후 변화가 나와 직접 연결된 문제라기보다는 먼 미래나 먼 지역의 이야기처럼 느껴져서 공포를 오락처럼 즐기는 현실 도피 장치로 작동해요. 마치 폭우가 창밖에 보이기 전에는 재난 영화가 재미있는 것과 비슷하죠. 그런데 기온이 몇 도 더 오르고 그 영향이 일상에 뚜렷해지면 이야기보다 현실이 더 커져 버립니다. 이 글은 그때 기후 픽션이 사라질 수 있다고 말해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>기후 픽션의 소멸 가능성\u003csmall>주장 · 문장 1\u003c/small>\u003c/h4>\u003cp>온스크린에는 \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">재난\u003c/b>이 어디에나 있지만, 기후 변화의 범위가 \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">픽션\u003c/b> 장르와 온난화 \u003cb class=\"key\">이야기\u003c/b>를 하려는 노력까지 없앨 수 있다고 주장한다. 할리우드조차 감당할 수 없을 만큼 온난화가 \u003cb class=\"key\">너무 \u003c/b>\u003cb class=\"key\">크고 \u003c/b>\u003cb class=\"key\">명백\u003c/b>해질 것이다. 이 문장이 글 전체의 \u003cb class=\"key\">두괄식\u003c/b> 주장이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>이야기가 가능한 조건\u003csmall>전제 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>기후 변화가 여전히 인간 삶의 \u003cb class=\"key\">주변적인 \u003c/b>\u003cb class=\"key\">특징\u003c/b>처럼 보이는 동안에는 그것에 관한 이야기를 할 수 있다. 하지만 기온이 3도 혹은 4도 더 오르면 아무도 그 영향으로부터 \u003cb class=\"key\">고립\u003c/b>되었다고 느낄 수 없다. 이야기가 가능하려면 기후 변화가 \u003cb class=\"key\">주변적\u003c/b>이어야 한다는 조건이 제시된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>이야기의 종말\u003csmall>추론 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>기후 변화가 \u003cb class=\"key\">지평선\u003c/b>을 넘어 확장되면 그것은 \u003cb class=\"key\">이야기\u003c/b>가 되기를 멈춘다. 창밖으로 뚜렷하게 보이는 세상을 굳이 \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">픽션\u003c/b>으로 보거나 읽을 이유가 없다. 이야기는 현실과 \u003cb class=\"key\">거리\u003c/b>가 있을 때 성립한다는 추론이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>현재와 미래의 가장 방식\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>지금은 지구 온난화를 묘사하는 이야기가 \u003cb class=\"key\">현실 \u003c/b>\u003cb class=\"key\">도피\u003c/b>적인 즐거움을 제공하며, 그 즐거움은 종종 \u003cb class=\"key\">공포\u003c/b>의 형태로 온다. 하지만 기후 고통이 시간적으로나 장소적으로 \u003cb class=\"key\">멀리\u003c/b> 있다고 가장할 수 없게 되면, 그것에 대해 \u003cb class=\"key\">가장\u003c/b>하는 것을 멈추고 그것 내에서 가장하기 시작한다. 현재와 미래의 \u003cb class=\"key\">가장\u003c/b> 방식이 대조된다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 크게 네 단계로 흘러가요. 첫 문장에서 주장을 던지고, 이어서 이야기가 가능한 조건과 불가능한 조건을 나누고, 마지막으로 현재와 미래의 가장 방식을 대조합니다.","hl":null},{"n":4,"text":"첫 번째 문장에서는 온스크린에 기후 재난이 넘쳐 나지만, 기후 변화의 범위가 커지면 기후 픽션 장르 자체가 사라질 수 있다고 말해요. 할리우드조차 감당하기 어려울 만큼 온난화가 너무 크고 명백해질 거라는 거죠. 그러니까 지금의 기후 재난 서사가 오히려 기후 이야기의 종말을 앞당길 수 있다는 주장이에요. 이 부분이 글의 머리 주장입니다.","hl":"f0"},{"n":5,"text":"두 번째와 세 번째 문장에서는 그 주장의 조건을 설명해요. 기후 변화가 여전히 인간 삶의 주변적인 특징처럼 보이는 동안에는 기후 변화에 관한 이야기를 할 수 있어요. 하지만 기온이 섭씨 삼 도에서 사 도 이상 오르면 누구도 그 영향에서 고립되었다고 느낄 수 없게 됩니다. 기후 변화가 모두의 일상이 되면 이야기의 조건 자체가 흔들린다는 거예요.","hl":"f1"},{"n":6,"text":"네 번째와 다섯 번째 문장은 그다음 추론이에요. 기후 변화가 지평선을 넘어 확장되면 그것은 더 이상 이야기가 되지 않는다고 말해요. 창밖으로 뚜렷하게 보이는 세상을 굳이 기후 픽션으로 보거나 읽을 이유가 없어진다는 겁니다. 이야기는 현실과 거리가 있을 때 성립한다는 논리예요.","hl":"f2"},{"n":7,"text":"여섯 번째와 일곱 번째 문장은 현재와 미래를 대조해요. 지금은 지구 온난화를 묘사하는 이야기가 현실 도피적인 즐거움을 주는데, 그 즐거움이 공포의 형태로 오기도 하죠. 하지만 기후 고통이 시간적으로나 장소적으로 멀리 있다고 가장할 수 없게 되면, 기후 고통에 대해 가장하는 것을 멈추고 그 고통 안에서 가장하기 시작한다고 말합니다. 결국 기후 픽션의 성격이 완전히 바뀐다는 것이에요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 기후 픽션의 \u003cb class=\"key\">소멸\u003c/b> 가능성이라는 주장을 분명하게 제시한다. 이어서 두 번째와 세 번째 문장은 이야기가 가능한 \u003cb class=\"key\">조건\u003c/b>을, 네 번째와 다섯 번째 문장은 그 조건이 깨졌을 때의 \u003cb class=\"key\">추론\u003c/b>을 제시한다. 마지막 두 문장은 현재와 미래를 \u003cb class=\"key\">대조\u003c/b>하며 주장을 뒷받침하므로 \u003cb class=\"key\">두괄식\u003c/b> \u003cb class=\"key\">주장-근거\u003c/b> 구조이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>while (2)\u003c/b>\u003cspan>조건·대조\u003c/span>\u003cb>But when (3)\u003c/b>\u003cspan>반전·조건\u003c/span>\u003cb>And so (4)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>At the moment (6)\u003c/b>\u003cspan>현재 시점\u003c/span>\u003cb>But when (7)\u003c/b>\u003cspan>미래 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the story of warming\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">tell stories 'about' climate change\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">cease to be a story\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">climate fiction about the world\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">stories illustrating global warming\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>현재의 기후 변화\u003c/th>\u003cth>미래의 기후 변화\u003c/th>\u003c/tr>\u003ctr>\u003ctd>기후 변화가 주변적인 특징\u003c/td>\u003ctd>기후 변화가 지평선을 넘어 확장\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기후 픽션이 현실 도피의 즐거움 제공\u003c/td>\u003ctd>기후 픽션이 이야기로 성립하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기후 고통을 멀리 있다고 가장\u003c/td>\u003ctd>기후 고통 안에서 가장\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 두괄식 주장 근거 전개예요. 첫 번째 문장에서 기후 픽션의 소멸 가능성이라는 주장을 분명하게 제시하거든요. 그다음 문장들은 조건과 추론, 현재와 미래의 대조를 통해 그 주장을 뒷받침하고 있어요. 신호어 But과 And so를 따라가면서 조건의 반전과 결과를 잡아내면 글의 논리가 선명해져요. 마지막에 At the moment와 But when이 현재와 미래를 대조하는 장치라는 점도 기억해 두세요.","hl":"ty"},{"n":9,"text":"신호어를 살펴볼게요. 두 번째 문장의 while은 기후 변화가 여전히 주변적일 때 이야기가 가능하다는 조건을 달아 줘요. 세 번째 문장의 But when은 그 조건이 깨지는 반전을 보여 주고요. 네 번째 문장의 And so는 앞선 반전의 결과로 이야기가 끝난다는 결론을 이끌어요. 여섯 번째 문장의 At the moment는 현재를, 일곱 번째 문장의 But when은 미래를 대조하면서 가장의 방식이 바뀐다고 정리해 줍니다. 또한 the story of warming, climate fiction, stories illustrating global warming 같은 표현은 모두 같은 대상을 다시 말한 재진술이에요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>onscreen\u003c/b>\u003cem>부사\u003c/em>\u003cspan>화면상에\u003c/span>\u003c/div>\u003cdiv>\u003cb>disaster\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재난\u003c/span>\u003c/div>\u003cdiv>\u003cb>everywhere you look\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>어디를 봐도\u003c/span>\u003c/div>\u003cdiv>\u003cb>scope\u003c/b>\u003cem>명사\u003c/em>\u003cspan>범위\u003c/span>\u003c/div>\u003cdiv>\u003cb>transformation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>변화\u003c/span>\u003c/div>\u003cdiv>\u003cb>eliminate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>없애다, 제거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>genre\u003c/b>\u003cem>명사\u003c/em>\u003cspan>장르\u003c/span>\u003c/div>\u003cdiv>\u003cb>indeed\u003c/b>\u003cem>부사\u003c/em>\u003cspan>실제로\u003c/span>\u003c/div>\u003cdiv>\u003cb>effort\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노력\u003c/span>\u003c/div>\u003cdiv>\u003cb>warming\u003c/b>\u003cem>명사\u003c/em>\u003cspan>온난화\u003c/span>\u003c/div>\u003cdiv>\u003cb>obvious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>명백한\u003c/span>\u003c/div>\u003cdiv>\u003cb>marginal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주변적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>feature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특징\u003c/span>\u003c/div>\u003cdiv>\u003cb>isolated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>고립된\u003c/span>\u003c/div>\u003cdiv>\u003cb>impacts\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영향\u003c/span>\u003c/div>\u003cdiv>\u003cb>expand\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>horizon\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지평선\u003c/span>\u003c/div>\u003cdiv>\u003cb>cease\u003c/b>\u003cem>동사\u003c/em>\u003cspan>멈추다, 중단하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>plainly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>뚜렷하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>at the moment\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>지금 당장은\u003c/span>\u003c/div>\u003cdiv>\u003cb>illustrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>묘사하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>escapist\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>현실 도피적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>pleasure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>즐거움\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the form of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 형태로\u003c/span>\u003c/div>\u003cdiv>\u003cb>horror\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공포\u003c/span>\u003c/div>\u003cdiv>\u003cb>pretend\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>distant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>먼\u003c/span>\u003c/div>\u003cdiv>\u003cb>suffering\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고통\u003c/span>\u003c/div>\u003cdiv>\u003cb>within\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~의 내부에\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘도 몇 개만 짚고 갈게요. eliminate는 없애다, 제거하다라는 뜻이고요. marginal은 주변적인, 사소한이라는 뜻이에요. cease는 멈추다, 중단하다라는 뜻이고, escapist는 현실 도피적인이라는 뜻이죠. pretend는 가장하다, 인 척하다라는 뜻이니 시험에 자주 나오니까 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">eliminate\u003c/b>\u003cspan class=\"m\">없애다, 제거하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">remove\u003c/span>\u003cspan class=\"s\">eradicate\u003c/span>\u003cspan class=\"s\">wipe out\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">create\u003c/span>\u003cspan class=\"a\">produce\u003c/span>\u003cspan class=\"a\">establish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">marginal\u003c/b>\u003cspan class=\"m\">주변적인, 사소한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">peripheral\u003c/span>\u003cspan class=\"s\">minor\u003c/span>\u003cspan class=\"s\">insignificant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">central\u003c/span>\u003cspan class=\"a\">essential\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">isolated\u003c/b>\u003cspan class=\"m\">고립된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">separated\u003c/span>\u003cspan class=\"s\">detached\u003c/span>\u003cspan class=\"s\">remote\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">connected\u003c/span>\u003cspan class=\"a\">integrated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cease\u003c/b>\u003cspan class=\"m\">멈추다, 중단하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stop\u003c/span>\u003cspan class=\"s\">halt\u003c/span>\u003cspan class=\"s\">end\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">continue\u003c/span>\u003cspan class=\"a\">begin\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">obvious\u003c/b>\u003cspan class=\"m\">명백한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">apparent\u003c/span>\u003cspan class=\"s\">clear\u003c/span>\u003cspan class=\"s\">evident\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unclear\u003c/span>\u003cspan class=\"a\">obscure\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">escapist\u003c/b>\u003cspan class=\"m\">현실 도피적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">fantastical\u003c/span>\u003cspan class=\"s\">diversionary\u003c/span>\u003cspan class=\"s\">unreal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">realistic\u003c/span>\u003cspan class=\"a\">confronting\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distant\u003c/b>\u003cspan class=\"m\">먼, 먼 곳의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">remote\u003c/span>\u003cspan class=\"s\">faraway\u003c/span>\u003cspan class=\"s\">removed\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">near\u003c/span>\u003cspan class=\"a\">close\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리할게요. eliminate는 remove나 eradicate와 바꿔 쓸 수 있고, 반대말은 create나 establish예요. marginal은 peripheral이나 minor와 비슷하고, central이나 essential과 반대입니다. cease는 stop이나 halt와 비슷하고, continue나 begin과 반대예요. distant는 remote나 faraway와 비슷하고, near나 close와 반대입니다. 이렇게 묶어서 외우면 독해 지문에서 바뀐 표현이 나와도 바로 잡을 수 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영화상 기후 재난은 여러분이 보는 어디에나 있지만, 그러나 세계의 기후 변화의 범위는 그것만큼이나 빠르게 기후 픽션 장르를 없앨지도 모르고 실제로 온난화 이야기를 하고자 하는 노력도 없애 버리는데, 그것은 할리우드에서조차 너무 커지고 너무 명백해질 것이다.\u003c/span>\u003cspan class=\"en\">On­screen, climate disaster is everywhere you look, but the scope of the world's climate transformation \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">quickly \u003c/span>\u003cspan class=\"tgt\">eliminate\u003c/span> the climate­fiction genre ― indeed eliminate any effort \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">tell \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">story \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">warming\u003c/span>, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">grow \u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">large \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">obvious \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">Hollywood\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">영화상 기후 재난은 여러분이 보는 어디에나 있지만, 세계의 기후 변화의 범위는 그것만큼이나 빠르게 기후 픽션 장르를 없앨지도 모르고 실제로 온난화 이야기를 하고자 하는 노력도 없애 버리는데, 그것은 할리우드에서조차 너무 커지고 너무 명백해질 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 기후 재난이 영화 속에 넘쳐 나지만, 기후 변화가 커질수록 기후 픽션이 오히려 \u003cb class=\"key\">소재\u003c/b>로서 사라질 수 있다는 역설을 제시합니다. 화면의 재난이 너무 흔해지면 \u003cb class=\"key\">할리우드조차\u003c/b> 감당하기 어려울 만큼 이야기가 커질 것입니다. 즉 기후 변화가 \u003cb class=\"key\">일상\u003c/b>이 되면 기후 픽션 장르를 없앨 수 있다는 핵심 주장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may + 동사원형\u003c/span> : the scope + may + eliminate : \"그 범위는 그것만큼이나 빠르게 없앨지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : any effort + to tell the story of warming (to부정사구) : \"온난화 이야기를 하고자 하는 노력\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">계속적 용법의 관계대명사 which\u003c/span> : 선행사(warming) + , which + could grow : \"그리고 그것은 할리우드에서조차 너무 커지고 너무 명백해질 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Onscreen, climate disaster is everywhere you look, 영화상 기후 재난은 여러분이 보는 어디에나 있지만. but the scope of the world's climate transformation, 그러나 세계의 기후 변화의 범위는. may just as quickly eliminate the climate-fiction genre, 그것만큼이나 빠르게 기후 픽션 장르를 없앨지도 모르고. ― indeed eliminate any effort to tell the story of warming, 실제로 온난화 이야기를 하고자 하는 노력도 없애 버리는데. which could grow too large and too obvious even for Hollywood, 그것은 할리우드에서조차 너무 커지고 너무 명백해질 것이다.. 이 문장 전체를 해석하면, 영화상 기후 재난은 여러분이 보는 어디에나 있지만, 세계의 기후 변화의 범위는 그것만큼이나 빠르게 기후 픽션 장르를 없앨지도 모르고 실제로 온난화 이야기를 하고자 하는 노력도 없애 버리는데, 그것은 할리우드에서조차 너무 커지고 너무 명백해질 것이다.","hl":"m"},{"n":13,"text":"이 문장은 기후 재난이 영화 속에 넘쳐 보이지만, 기후 변화가 커질수록 오히려 그 이야기를 할 수 없게 될 것이라는 역설을 던집니다. 화면 속 재난이 너무 흔해지면 할리우드조차 감당하지 못할 만큼 이야기가 커져 버린다는 뜻이죠. 즉 기후 변화가 일상이 되면 기후 픽션이라는 장르가 사라질 수 있다는 주장입니다.","hl":"mn"},{"n":14,"text":"어법 포인트 첫 번째, may just as quickly eliminate에서 may는 추측의 조동사이고 뒤에 동사원형 eliminate가 왔습니다. 그래서 없앨지도 모른다로 해석합니다. 두 번째, to tell the story of warming은 to부정사의 형용사적 용법이에요. 앞의 명사 effort를 꾸며 주어서 어떤 노력인지 구체적으로 말해 줍니다. 세 번째, which could grow too large and too obvious even for Hollywood에서 which는 계속적 용법의 관계대명사입니다. 콤마 뒤에 which가 앞에 나온 story of warming을 받아서 덧붙여 설명하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 기후 변화에 관한 이야기를 할 수 있다\u003c/span>\u003cspan class=\"en\">You can tell stories 'about' climate change\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 여전히 ~처럼 보이는 동안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">still \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간 삶의 주변적인 특징처럼 보이는 동안에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">marginal \u003c/span>\u003cspan class=\"tgt\">feature \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">기후 변화가 여전히 인간 삶의 주변적인 특징처럼 보이는 동안에 여러분은 그것에 ‘관한’ 이야기를 할 수 있을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기후 변화가 아직 삶의 \u003cb class=\"key\">주변부\u003c/b>에 머물러 있는 동안에만 사람들이 그것에 관한 이야기를 만들 수 있다는 뜻입니다. 기후 변화가 \u003cb class=\"key\">중심 \u003c/b>\u003cb class=\"key\">문제\u003c/b>가 되기 전에는 소설이나 영화의 소재로 다룰 수 있지만, 일상이 되면 이야기하기 어려워진다는 흐름을 깔아 줍니다. 즉 현재 기후 픽션이 가능한 이유를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간을 나타내는 종속접속사 while\u003c/span> : 주절 + while + 주어 + 동사 : \"그것이 여전히 인간 삶의 주변적인 특징처럼 보이는 동안에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 동사 seem + 보어\u003c/span> : it + seems + a marginal feature (명사구 보어) : \"그것은 인간 삶의 주변적인 특징처럼 보인다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"You can tell stories 'about' climate change, 여러분은 기후 변화에 관한 이야기를 할 수 있다. while it still seems, 그것이 여전히 ~처럼 보이는 동안에. a marginal feature of human life, 인간 삶의 주변적인 특징처럼 보이는 동안에. 이 문장 전체를 해석하면, 기후 변화가 여전히 인간 삶의 주변적인 특징처럼 보이는 동안에 여러분은 그것에 ‘관한’ 이야기를 할 수 있을 것이다.","hl":"m"},{"n":16,"text":"이 문장은 기후 변화가 아직은 삶의 변두리에 있는 것처럼 보일 때만 기후 변화에 관한 이야기를 할 수 있다고 말합니다. 즉 기후 변화가 중심 문제가 되기 전에는 소설이나 영화의 소재로 다룰 수 있다는 뜻이죠. 지금은 기후 픽션이 성립한다는 이유를 설명해 줍니다.","hl":"mn"},{"n":17,"text":"어법 포인트 첫 번째, while it still seems a marginal feature of human life에서 while은 시간을 나타내는 종속접속사입니다. 그때는 아직도 주변적인 것처럼 보이는 동안이라는 시간 조건을 이끌죠. 두 번째, seems a marginal feature of human life에서 seem은 보어를 필요로 하는 불완전자동사예요. 뒤에 명사구 a marginal feature가 보어로 와서 그것이 주변적 특징처럼 보인다는 뜻을 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 기온이 상승할 때\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">temperature \u003c/span>\u003cspan class=\"tgt\">rises \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">3도 혹은 4도 더 상승하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">three \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">four \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">degrees\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 아무도 ~할 수 없을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">hardly \u003c/span>\u003cspan class=\"tgt\">anyone \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 영향으로부터 고립되었다고 느끼는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">feel \u003c/span>\u003cspan class=\"tgt\">isolated \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">impacts\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 기온이 3도 혹은 4도 이상 상승할 때는 아무도 그것의 영향으로부터 고립되었다고 느낄 수 없을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기온이 삼 도나 사 도 더 오르면 누구도 기후 변화의 영향에서 \u003cb class=\"key\">고립\u003c/b>되었다고 느끼지 못할 것이라고 말합니다. 영향이 \u003cb class=\"key\">일상\u003c/b>에 스며들어 모든 사람이 직접 체험하게 된다는 뜻입니다. 기후 변화가 더 이상 멀리 있는 이야기가 아니라 \u003cb class=\"key\">현실\u003c/b>이 된다는 전환을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절 when과 전치사 by\u003c/span> : when + 주어 + 동사 + by + 수치 차이 : \"기온이 3도 혹은 4도 더 상승할 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">준부정어 hardly + be able to\u003c/span> : hardly anyone + will be able to + feel : \"거의 아무도 고립되었다고 느낄 수 없을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">감각동사 feel + 형용사 보어\u003c/span> : feel + isolated (형용사/주격 보어) : \"그것의 영향으로부터 고립되었다고 느끼는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But when the temperature rises, 하지만 기온이 상승할 때. by three or four more degrees, 3도 혹은 4도 더 상승하면. hardly anyone will be able, 거의 아무도 ~할 수 없을 것이다. to feel isolated from its impacts, 그것의 영향으로부터 고립되었다고 느끼는 것을. 이 문장 전체를 해석하면, 하지만 기온이 3도 혹은 4도 이상 상승할 때는 아무도 그것의 영향으로부터 고립되었다고 느낄 수 없을 것이다.","hl":"m"},{"n":19,"text":"이 문장은 기온이 삼 도나 사 도 더 오르면 아무도 그 영향에서 벗어났다고 느끼지 못할 것이라고 말합니다. 즉 기후 변화의 영향이 너무 보편적이 되어 모든 사람이 직접 겪게 된다는 뜻이죠. 그래서 더 이상 기후 변화를 멀리 있는 이야기로 만들 수 없다는 걸 보여 줍니다.","hl":"mn"},{"n":20,"text":"어법 포인트 첫 번째, when the temperature rises by three or four more degrees에서 when은 시간 부사절을 이끄는 종속접속사입니다. by three or four more degrees에서 by는 정도 차이를 나타내는 전치사예요. 두 번째, hardly anyone will be able to feel isolated에서 hardly는 준부정어로 거의 아무도 아닌 이라는 부정 뜻을 만들어 줍니다. will be able to는 미래의 가능을 나타내죠. 세 번째, feel isolated from its impacts에서 feel은 감각동사이고 isolated가 형용사 보어로 주어의 상태를 서술합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그래서\u003c/span>\u003cspan class=\"en\">And so\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기후 변화가 지평선을 넘어 확장될 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">climate \u003c/span>\u003cspan class=\"tgt\">change \u003c/span>\u003cspan class=\"tgt\">expands \u003c/span>\u003cspan class=\"tgt\">across \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">horizon\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 멈출지도 모릅니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">cease \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이야기가 되는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">story\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 기후 변화가 지평선을 넘어 확장될 때 그것은 이야기가 되기를 멈출 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장들에서 기후 변화가 아직은 일상에서 동떨어진 이야기일 수 있다고 했는데, 이 문장은 그 반대 조건을 제시해요. 기후 변화가 \u003cb class=\"key\">지평선\u003c/b> 너머로 확장되어 모든 사람이 직접 겪게 되면 더 이상 \u003cb class=\"key\">이야기\u003c/b>로 남지 않는다는 뜻입니다. 이야기는 현실과 거리가 있을 때 성립하므로, 기후 변화가 너무 흔해지면 소설의 소재가 되기 어렵다는 논리예요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절 접속사 as\u003c/span> : as + [주어] + [동사구], [주절] : \"기후 변화가 지평선을 넘어 확장될 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 may + 동사원형 + to부정사\u003c/span> : may + [cease (동사원형)] + [to be a story (to부정사구)] : \"그것은 이야기가 되는 것을 멈출지도 모른다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"And so, 그리고 그래서. as climate change expands across the horizon, 기후 변화가 지평선을 넘어 확장될 때. it may cease, 그것은 멈출지도 모릅니다. to be a story, 이야기가 되는 것을. 이 문장 전체를 해석하면, 그리고 기후 변화가 지평선을 넘어 확장될 때 그것은 이야기가 되기를 멈출 것이다.","hl":"m"},{"n":22,"text":"이 문장은 기후 변화가 지평선 너머로 넓어지면 더 이상 이야기가 되기 어렵다는 핵심 주장을 담고 있어요. 지평선을 넘어 확장되는 것은 기후 변화가 모든 사람의 일상으로 들어오는 상황을 비유한 거죠. 이야기는 현실과 거리가 있어야 성립하는데, 기후 변화가 너무 일상적이 되면 소설의 소재로 쓰기 어렵다는 뜻이에요.","hl":"mn"},{"n":23,"text":"어법 포인트를 짚어 볼게요. 첫 번째, as climate change expands across the horizon은 시간의 부사절 접속사 as로 쓰였어요, as는 여기서 ~할 때라는 뜻이고, 뒤에 주어와 동사가 오는 절을 이끌어요. 두 번째, it may cease to be a story에서 may는 추측을 나타내는 조동사라서 뒤에 동사원형 cease가 왔고, cease는 to부정사 to be a story를 목적어로 취해 이야기가 되는 것을 그만둔다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜 보거나 읽겠는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Why \u003c/span>\u003cspan class=\"tgt\">watch \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">read\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기후 픽션을\u003c/span>\u003cspan class=\"en\">climate fiction\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상에 대한\u003c/span>\u003cspan class=\"en\">about \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신이 뚜렷하게 볼 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">plainly\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당신 자신의 창문 밖으로?\u003c/span>\u003cspan class=\"en\">out your own window?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">왜 여러분 자신의 창문 밖으로 뚜렷하게 볼 수 있는 세상에 대한 기후 픽션을 보거나 읽겠는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 '이야기가 아니게 된다'는 주장을 \u003cb class=\"key\">수사의문문\u003c/b>으로 강조해요. 창밖으로 기후 변화가 이미 뚜렷하게 보인다면, 굳이 기후 픽션을 보거나 읽을 이유가 없지 않겠느냐고 묻는 거예요. '자신의 창문 밖'은 기후 변화가 \u003cb class=\"key\">일상\u003c/b>이 된 상황을 비유적으로 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Why + 동사원형 (수사의문문)\u003c/span> : Why + [watch or read (동사원형)] ...? : \"왜 보거나 읽겠는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : 선행사 [the world] + (which/that) + [you] + [can see] + [plainly] : \"당신이 뚜렷하게 볼 수 있는 세상\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Why watch or read, 왜 보거나 읽겠는가. climate fiction, 기후 픽션을. about the world, 세상에 대한. you can see plainly, 당신이 뚜렷하게 볼 수 있는. out your own window?, 당신 자신의 창문 밖으로?. 이 문장 전체를 해석하면, 왜 여러분 자신의 창문 밖으로 뚜렷하게 볼 수 있는 세상에 대한 기후 픽션을 보거나 읽겠는가?","hl":"m"},{"n":25,"text":"이 문장은 Why로 시작하는 수사의문문이에요. 창밖으로 기후 변화가 이미 뚜렷하게 보인다면 기후 픽션을 보거나 읽을 이유가 없다는 뜻을 강조하고 있죠. 자신의 창문 밖은 기후 변화가 일상이 된 상황을 비유적으로 나타내요.","hl":"mn"},{"n":26,"text":"첫 번째, Why watch or read는 Why 다음에 동사원형이 오는 수사의문문 형태예요. 이유를 묻기보다는 그럴 필요가 없다는 뜻을 강조해요. 두 번째, the world you can see plainly는 선행사 the world 뒤에 목적격 관계대명사 which나 that이 생략된 구조예요. 타동사 see의 목적어가 없는 불완전한 절이 앞의 선행사를 수식합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지금 당장은\u003c/span>\u003cspan class=\"en\">At the moment,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지구 온난화를 묘사하는 이야기들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stories \u003c/span>\u003cspan class=\"tgt\">illustrating \u003c/span>\u003cspan class=\"tgt\">global \u003c/span>\u003cspan class=\"tgt\">warming\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여전히 제공할 수 있다\u003c/span>\u003cspan class=\"en\">can still offer\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현실 도피적인 즐거움을\u003c/span>\u003cspan class=\"en\">an escapist pleasure,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 그 즐거움이 종종 올지라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">if \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">pleasure \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">comes\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공포의 형태로\u003c/span>\u003cspan class=\"en\">in the form of horror.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">비록 그 즐거움이 종종 공포의 형태로 올지라도 지금 당장은 지구 온난화를 묘사하는 이야기가 현실 도피적인 즐거움을 여전히 제공할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 현재는 아직 기후 픽션이 가능한 이유를 설명해요. 지구 온난화 이야기가 \u003cb class=\"key\">현실 \u003c/b>\u003cb class=\"key\">도피\u003c/b>적인 즐거움을 준다는 건, 아직 기후 재난이 실제 일상과 거리가 있다는 뜻이에요. 그 즐거움이 \u003cb class=\"key\">공포\u003c/b>의 형태로 온다는 역설로, 기후 픽션의 장르적 특성을 짚어 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 명사 수식\u003c/span> : 명사 [stories] + [illustrating global warming (현재분사구)] : \"지구 온난화를 묘사하는 이야기들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">양보의 부사절 접속사 even if\u003c/span> : even if + [주어] + [동사] : \"비록 그 즐거움이 종종 올지라도\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"At the moment, 지금 당장은. stories illustrating global warming, 지구 온난화를 묘사하는 이야기들이. can still offer, 여전히 제공할 수 있다. an escapist pleasure, 현실 도피적인 즐거움을. even if that pleasure often comes, 비록 그 즐거움이 종종 올지라도. in the form of horror, 공포의 형태로. 이 문장 전체를 해석하면, 비록 그 즐거움이 종종 공포의 형태로 올지라도 지금 당장은 지구 온난화를 묘사하는 이야기가 현실 도피적인 즐거움을 여전히 제공할 수 있다.","hl":"m"},{"n":28,"text":"이 문장은 현재 시점에는 기후 픽션이 아직 가능한 이유를 설명해요. 지구 온난화 이야기가 주는 현실 도피적인 즐거움은 기후 재난이 아직 일상과 거리가 있다는 뜻이에요. 그 즐거움이 공포의 형태로 온다는 역설적인 표현을 통해 기후 픽션의 특성을 짚어 주죠.","hl":"mn"},{"n":29,"text":"첫 번째, stories illustrating global warming에서 현재분사 illustrating이 앞의 명사 stories를 뒤에서 수식해요. 따라서 지구 온난화를 묘사하는 이야기들이라고 해석하면 됩니다. 두 번째, even if that pleasure often comes는 양보의 부사절 접속사 even if가 쓰인 절이에요, 비록 그 즐거움이 종종 올지라도라는 뜻으로 주절의 내용을 양보해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 우리가 더 이상 가장할 수 없을 때\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">longer \u003c/span>\u003cspan class=\"tgt\">pretend\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기후 고통이 멀리 있다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">climate \u003c/span>\u003cspan class=\"tgt\">suffering \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">distant\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시간적으로 또는 장소적으로\u003c/span>\u003cspan class=\"en\">— in time or in place ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 그것에 대해 가장하는 것을 멈출 것이다\u003c/span>\u003cspan class=\"en\">we will \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">stop \u003c/span>\u003cspan class=\"tgt\">pretending \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것 내에서 가장하기 시작할 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">start \u003c/span>\u003cspan class=\"tgt\">pretending \u003c/span>\u003cspan class=\"tgt\">within \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 우리가 더 이상 기후 고통이 시간적으로 또는 장소적으로 멀리 있다고 가장할 수 없을 때 우리는 그것에 대해 가장하는 것을 멈추고 그것 내에서 가장하기 시작할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 마지막 문장으로, 기후 변화가 더 이상 먼 일이 아니게 되면 우리는 기후 소설을 통해 그것에 대해 상상하거나 이야기하는 것을 멈추고, 그 고통 속에서 어쩔 수 없이 살아가며 부정하거나 모르는 척하는 방식으로 바뀐다는 뜻입니다. 앞부분의 \u003cb class=\"key\">pretending \u003c/b>\u003cb class=\"key\">about \u003c/b>\u003cb class=\"key\">it\u003c/b>은 기후 위기를 바깥에서 바라보며 이야기로 소비하는 태도이고, 뒤의 \u003cb class=\"key\">pretending \u003c/b>\u003cb class=\"key\">within \u003c/b>\u003cb class=\"key\">it\u003c/b>은 그 현실 안으로 들어가 버린 뒤에도 부정하거나 적응하는 척하며 살아가는 태도를 대비시킵니다. 결국 \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">소설\u003c/b>이 성립하기 어려워지는 이유를 정리하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사절 접속사 when\u003c/span> : when + S + can no longer pretend, S + will stop ... : \"우리가 더 이상 가장할 수 없을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : pretend + that + 완전한 절 (S + V) : \"기후 고통이 멀리 있다고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사구 목적어와 병렬 구조\u003c/span> : stop + [pretending about it] and start + [pretending within it] : \"그것에 대해 가장하는 것을 멈추고 그것 내에서 가장하기 시작한다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"But when we can no longer pretend, 하지만 우리가 더 이상 가장할 수 없을 때. that climate suffering is distant, 기후 고통이 멀리 있다고. — in time or in place ―, 시간적으로 또는 장소적으로. we will stop pretending about it, 우리는 그것에 대해 가장하는 것을 멈출 것이다. and start pretending within it, 그리고 그것 내에서 가장하기 시작할 것이다. 이 문장 전체를 해석하면, 하지만 우리가 더 이상 기후 고통이 시간적으로 또는 장소적으로 멀리 있다고 가장할 수 없을 때 우리는 그것에 대해 가장하는 것을 멈추고 그것 내에서 가장하기 시작할 것이다.","hl":"m"},{"n":31,"text":"이 문장은 글 전체의 마지막 문장으로, 기후 변화가 더 이상 먼 일이 아니게 되면 우리는 기후 소설을 통해 그것에 대해 상상하거나 이야기하는 것을 멈추고, 그 고통 속에서 어쩔 수 없이 살아가며 부정하거나 모르는 척하는 방식으로 바뀐다는 뜻입니다. 앞부분의 pretending about it은 기후 위기를 바깥에서 바라보며 이야기로 소비하는 태도이고, 뒤의 pretending within it은 그 현실 안으로 들어가 버린 뒤에도 부정하거나 적응하는 척하며 살아가는 태도를 대비시킵니다. 결국 기후 소설이 성립하기 어려워지는 이유를 정리하는 문장으로 보면 됩니다.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 when이 이끄는 부사절입니다. when we can no longer pretend는 우리가 더 이상 가장할 수 없을 때라는 뜻인데, 시간이나 조건을 나타내는 부사절에서는 미래의 일이라도 will을 쓰지 않고 현재형인 can을 씁니다. 두 번째로 that climate suffering is distant는 pretend의 목적어 역할을 하는 명사절입니다. that은 해석하지 않고 이하가 ~라고의 내용을 이끌죠. 세 번째로 stop pretending about it and start pretending within it를 보면, stop과 start는 뒤에 동명사를 목적어로 취합니다. 그래서 그것에 대해 가장하는 것을 멈추고, 그것 안에서 가장하기 시작한다는 뜻이 되고, 두 동명사구가 and로 병렬 연결되어 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>온스크린 기후 재난은 어디에나 있지만, 기후 변화의 범위가 \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">픽션\u003c/b> 장르와 \u003cb class=\"key\">온난화 \u003c/b>\u003cb class=\"key\">서사\u003c/b>를 없앨 수 있다.\u003c/li>\u003cli>기후 변화가 \u003cb class=\"key\">주변적인 \u003c/b>\u003cb class=\"key\">특징\u003c/b>으로 느껴지는 동안에는 그것에 관한 이야기가 가능하다.\u003c/li>\u003cli>기온이 더 오르고 영향이 일상에 \u003cb class=\"key\">명백\u003c/b>해지면 기후 변화는 더 이상 \u003cb class=\"key\">이야기\u003c/b>가 되지 않는다.\u003c/li>\u003cli>지금은 기후 이야기가 \u003cb class=\"key\">현실 \u003c/b>\u003cb class=\"key\">도피\u003c/b>적 즐거움을 주지만, 기후 고통이 멀지 않다고 느끼면 \u003cb class=\"key\">가장\u003c/b>의 방식이 달라진다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>As climate change becomes too large and obvious, it may cease to be a story, eliminating climate fiction and even the effort to narrate warming.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">기후 변화가 인간 삶의 \u003cb class=\"key\">주변적인 \u003c/b>\u003cb class=\"key\">특징\u003c/b>으로 여겨지는 동안에는 \u003cb class=\"key\">기후 \u003c/b>\u003cb class=\"key\">픽션\u003c/b>이 성립하지만, 기온이 더 오르고 그 영향이 일상에 \u003cb class=\"key\">명백\u003c/b>해지면 기후 변화는 더 이상 \u003cb class=\"key\">이야기\u003c/b>가 되지 못한다. 지금의 기후 이야기는 \u003cb class=\"key\">현실 \u003c/b>\u003cb class=\"key\">도피\u003c/b>적 즐거움을 주지만, 기후 고통이 \u003cb class=\"key\">멀리\u003c/b> 있다고 느끼지 못하면 \u003cb class=\"key\">가장\u003c/b>의 방식이 달라진다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"오늘 글을 정리하면 이렇습니다. 기후 변화가 주변적일 때는 기후 픽션이 성립하지만, 기온이 더 오르고 그 영향이 명백해지면 기후 변화는 더 이상 이야기가 되지 못한다는 주장이에요. 지금은 기후 이야기가 현실 도피적 즐거움을 주지만, 기후 고통이 멀지 않다고 느끼면 가장의 방식이 완전히 달라진다는 것까지 연결해서 이해해야 해요. 이렇게 두괄식 주장과 조건 반전, 현재와 미래 대조를 잡아내면 문제가 쉬워질 거예요. 오늘 수업은 여기까지입니다, 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
