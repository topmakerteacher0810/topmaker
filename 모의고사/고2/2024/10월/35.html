}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 35번","audioDir":"35_audio","preview":false,"count":27,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">35번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Water Crisis: A Political Choice, Not an Inevitable Fate\u003c/h1>\u003ch2>물 위기: 불가피한 운명이 아닌 정치적 선택\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>오늘날 물 위기는 \u003cb class=\"key\">정치적 \u003c/b>\u003cb class=\"key\">선택\u003c/b>의 결과로 \u003cb class=\"key\">피할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 것이 아니며, \u003cb class=\"key\">풍족한 \u003c/b>\u003cb class=\"key\">자원\u003c/b>이 정부의 \u003cb class=\"key\">소홀함\u003c/b>과 열악한 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">기반 \u003c/b>\u003cb class=\"key\">시설\u003c/b>, 오염, 무분별한 \u003cb class=\"key\">도시화\u003c/b>로 부족해졌다. 그 결과 \u003cb class=\"key\">누수\u003c/b>와 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">부족\u003c/b>이 \u003cb class=\"key\">가진 \u003c/b>\u003cb class=\"key\">자와 \u003c/b>\u003cb class=\"key\">가지지 \u003c/b>\u003cb class=\"key\">못한 \u003c/b>\u003cb class=\"key\">자의 \u003c/b>\u003cb class=\"key\">불평등\u003c/b>을 심화시켜 수십억 명을 안전한 물과 위생 없이 남긴다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The water crisis is a politically elective scarcity caused by neglect, not an inevitable shortage, and it deepens global inequities.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분, 오늘 다룰 지문은 전국연합학력평가 서른다섯 번째 지문입니다. 물 위기가 단순한 자연재해가 아니라 정치적 선택의 결과라는 내용이에요. 요약하면, 풍족한 자원이 정부의 소홀함과 열악한 사회 기반 시설 때문에 부족해졌고, 그 결과 가진 자와 가지지 못한 자의 불평등이 심화된다는 것입니다. 핵심 요지는 water crisis is a politically elective scarcity caused by neglect, not an inevitable shortage, and it deepens global inequities입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">물 위기는 자연적 가뭄만의 문제가 아니라 \u003cb class=\"key\">정치적 \u003c/b>\u003cb class=\"key\">선택\u003c/b>의 결과라는 관점이 중요하다. water crisis는 수자원의 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">부족\u003c/b>(water scarcity)뿐 아니라 접근성과 관리의 문제인 water stress를 포함한다. 정부의 소홀함(governmental neglect)이나 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">기반 \u003c/b>\u003cb class=\"key\">시설\u003c/b>(infrastructure) 투자 부족은 깨끗한 물을 공급하지 못하게 만든다. 일상에서 \u003cb class=\"key\">수도관\u003c/b>이 낡아 물이 새는 것을 방치하면 아무리 비가 많이 와도 집에는 물이 부족한 것과 같다. 누수(leakage)와 \u003cb class=\"key\">오염\u003c/b>(contamination), \u003cb class=\"key\">무분별한 \u003c/b>\u003cb class=\"key\">도시화\u003c/b>(unplanned urbanization)는 가난한 지역일수록 더 심각한 \u003cb class=\"key\">불평등\u003c/b>(inequity)을 만든다. 그래서 물 문제는 기술만이 아니라 \u003cb class=\"key\">거버넌스\u003c/b>(governance)와 \u003cb class=\"key\">형평성\u003c/b>(equity)의 문제로 접근해야 한다.\u003c/div>","segs":[{"n":2,"text":"먼저 배경지식을 정리해 볼게요. 물 위기는 자연적 가뭄만의 문제가 아니라 정치적 선택의 결과라는 관점이 중요해요. water crisis는 수자원의 물리적 부족인 water scarcity뿐 아니라 접근성과 관리의 문제인 water stress를 포함합니다. 정부의 소홀함, 즉 governmental neglect이나 사회 기반 시설, infrastructure 투자 부족은 깨끗한 물을 공급하지 못하게 만들어요. 일상에서 수도관이 낡아 물이 새는 것을 방치하면 아무리 비가 많이 와도 집에는 물이 부족한 것과 같습니다. 누수 leakage와 오염 contamination, 무분별한 도시화 unplanned urbanization는 가난한 지역일수록 더 심각한 불평등 inequity를 만들어요. 그래서 물 문제는 기술만이 아니라 거버넌스 governance와 형평성 equity의 문제로 접근해야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>정치적 선택으로 규정\u003csmall>주장 · 문장 1\u003c/small>\u003c/h4>\u003cp>첫 문장은 물 위기가 \u003cb class=\"key\">정치적\u003c/b> 문제이며 \u003cb class=\"key\">피할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 것도, 우리의 \u003cb class=\"key\">능력 \u003c/b>\u003cb class=\"key\">밖\u003c/b>도 아니라고 규정한다. 여기서 \u003cb class=\"key\">기능적으로 \u003c/b>\u003cb class=\"key\">선택적\u003c/b>이라는 표현은 위기를 해결 가능한 \u003cb class=\"key\">선택\u003c/b>의 결과로 본다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>위기를 괴롭게 만드는 원인\u003csmall>원인 · 문장 2\u003c/small>\u003c/h4>\u003cp>둘째 문장은 그럼에도 불구하고 위기가 \u003cb class=\"key\">괴로운\u003c/b> 이유를 설명한다. \u003cb class=\"key\">풍족한 \u003c/b>\u003cb class=\"key\">자원\u003c/b>이 \u003cb class=\"key\">정부의 \u003c/b>\u003cb class=\"key\">소홀함\u003c/b>과 무관심, 열악한 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">기반 \u003c/b>\u003cb class=\"key\">시설\u003c/b>과 오염, 부주의한 \u003cb class=\"key\">도시화\u003c/b>로 \u003cb class=\"key\">부족\u003c/b>해졌다. 자연적 부족이 아니라 정치·행정적 \u003cb class=\"key\">방치\u003c/b>가 원인이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>위기는 불필요하지만 방치됨\u003csmall>문제 제기 · 문장 3\u003c/small>\u003c/h4>\u003cp>셋째 문장은 \u003cb class=\"key\">물 \u003c/b>\u003cb class=\"key\">위기가 \u003c/b>\u003cb class=\"key\">있어야 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">필요\u003c/b>가 없다는 점을 재확인한다. 그런데도 우리는 위기를 겪고 있고, \u003cb class=\"key\">해결\u003c/b>을 위해 많은 일을 하고 있지 않다. 즉 \u003cb class=\"key\">무대응\u003c/b>이 위기를 지속시킨다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>누수 손실과 불평등의 확대\u003csmall>예시·결론 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>넷째와 다섯째 문장은 구체적 \u003cb class=\"key\">누수\u003c/b> 손실 수치를 제시한다. 미국은 \u003cb class=\"key\">담수\u003c/b>의 16퍼센트, 브라질은 40퍼센트를 잃는다. 이런 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">부족\u003c/b>은 \u003cb class=\"key\">가진 \u003c/b>\u003cb class=\"key\">자와 \u003c/b>\u003cb class=\"key\">가지지 \u003c/b>\u003cb class=\"key\">못한 \u003c/b>\u003cb class=\"key\">자의 \u003c/b>\u003cb class=\"key\">불평등\u003c/b>을 강조하며 전 세계 수십억 명을 안전한 물과 위생 없이 남긴다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 글의 흐름을 한 문장으로 정리하면, 첫 문장에서 물 위기가 정치적 선택이라고 주장하고, 이어서 원인과 문제 상황, 누수 사례와 불평등의 결론을 제시하는 순서예요.","hl":null},{"n":4,"text":"첫 번째 단계에서는 첫 문장을 보며 물 위기가 정치적 선택이라고 규정합니다. 이 문장은 물 위기가 피할 수 없는 것도, 우리의 능력 밖도 아니라고 말해요. 그래서 기능적으로 선택적이라는 표현이 중요합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 그럼에도 불구하고 위기가 괴로운 이유를 설명해요. 풍족한 자원이 정부의 소홀함과 무관심, 열악한 사회 기반 시설과 오염, 부주의한 도시화로 부족해졌습니다. 자연적 부족이 아니라 정치와 행정의 방치가 원인이라는 점을 짚어야 해요.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 물 위기가 있어야 할 필요가 없다는 점을 다시 확인합니다. 그런데도 우리는 위기를 겪고 있고, 해결을 위해 많은 일을 하지 않고 있어요. 무대응이 위기를 지속시키고 있다는 문제 제기입니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 구체적 누수 손실 수치를 제시해요. 미국은 담수의 십육 퍼센트, 브라질은 사십 퍼센트를 잃는다고 합니다. 이런 선택적 부족은 가진 자와 가지지 못한 자의 불평등을 강조하며 전 세계 수십억 명을 안전한 물과 위생 없이 남깁니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글은 첫 문장에서 물 위기가 \u003cb class=\"key\">정치적 \u003c/b>\u003cb class=\"key\">선택\u003c/b>이며 \u003cb class=\"key\">불가피하지 \u003c/b>\u003cb class=\"key\">않다\u003c/b>는 핵심 주장을 제시한다. 이후 둘째 문장에서 구체적 원인, 넷째 문장에서 누수 사례를 들어 주장을 뒷받침한다. 마지막 문장은 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">부족\u003c/b>이 불평등을 낳는다는 결과로 마무리된다. 따라서 주장이 먼저 나오고 근거와 예시가 뒤따르는 전형적인 \u003cb class=\"key\">두괄식\u003c/b> 구조다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>That is one reason (2)\u003c/b>\u003cspan>앞 문장의 주장을 이유로 연결\u003c/span>\u003cb>in other words (3)\u003c/b>\u003cspan>재진술\u003c/span>\u003cb>even in the United States (4)\u003c/b>\u003cspan>강조와 예시 도입\u003c/span>\u003cb>Seen in both cases, as everywhere (5)\u003c/b>\u003cspan>일반화\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the water crisis is political\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">not inevitable or beyond our capacity to fix\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">functionally elective\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">no need for a water crisis\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">selective scarcity\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>물 위기를 정치적 선택으로 볼 수 있는 측면\u003c/th>\u003cth>실제로 방치되어 부족해진 현실\u003c/th>\u003c/tr>\u003ctr>\u003ctd>피할 수 있고 해결 가능한 위기\u003c/td>\u003ctd>정부의 소홀함과 무관심으로 초래된 부족\u003c/td>\u003c/tr>\u003ctr>\u003ctd>풍족한 자원으로 존재해야 할 물\u003c/td>\u003ctd>누수와 오염으로 손실되는 물\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 주장과 근거의 전개 방식이고, 두괄식 구조로 볼 수 있어요. 첫 문장에서 핵심 주장인 물 위기가 정치적 선택이며 불가피하지 않다는 점을 먼저 제시합니다. 이후 둘째 문장에서 원인, 넷째 문장에서 누수 사례를 들어 주장을 뒷받침하고, 마지막 문장에서 선택적 부족이 불평등을 낳는다는 결과로 마무리합니다. 그래서 주장이 먼저 나오고 근거와 예시가 뒤따르는 전형적인 두괄식 구조입니다.","hl":"ty"},{"n":9,"text":"신호어로는 둘째 문장의 That is one reason이 앞 문장의 주장을 이유로 연결해 줍니다. 셋째 문장의 in other words는 물 위기가 필요 없다는 점을 다시 말해 주는 재진술 신호예요. 넷째 문장의 even in the United States는 강조와 함께 예시를 도입합니다. 같은 개념을 바꿔 말한 표현으로는 the water crisis is political, not inevitable, functionally elective, no need for a water crisis, selective scarcity가 순서대로 이어져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>crisis\u003c/b>\u003cem>명사\u003c/em>\u003cspan>위기\u003c/span>\u003c/div>\u003cdiv>\u003cb>political\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정치적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>inevitable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>피할 수 없는\u003c/span>\u003c/div>\u003cdiv>\u003cb>beyond our capacity\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>우리 능력 밖의\u003c/span>\u003c/div>\u003cdiv>\u003cb>fix\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고치다, 해결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>therefore\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러므로\u003c/span>\u003c/div>\u003cdiv>\u003cb>functionally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>기능적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>elective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>선택적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>nevertheless\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그럼에도 불구하고\u003c/span>\u003c/div>\u003cdiv>\u003cb>distressing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>괴로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>abundant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>풍족한\u003c/span>\u003c/div>\u003cdiv>\u003cb>resource\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원\u003c/span>\u003c/div>\u003cdiv>\u003cb>scarce\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>부족한\u003c/span>\u003c/div>\u003cdiv>\u003cb>governmental neglect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정부의 소홀함\u003c/span>\u003c/div>\u003cdiv>\u003cb>indifference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무관심\u003c/span>\u003c/div>\u003cdiv>\u003cb>infrastructure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사회 기반 시설\u003c/span>\u003c/div>\u003cdiv>\u003cb>contamination\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오염\u003c/span>\u003c/div>\u003cdiv>\u003cb>urbanization\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도시화\u003c/span>\u003c/div>\u003cdiv>\u003cb>in other words\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 말해서\u003c/span>\u003c/div>\u003cdiv>\u003cb>address\u003c/b>\u003cem>동사\u003c/em>\u003cspan>해결하다, 다루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>leak\u003c/b>\u003cem>명사\u003c/em>\u003cspan>누수\u003c/span>\u003c/div>\u003cdiv>\u003cb>deliver\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공급하다, 배달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>account for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>차지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>freshwater\u003c/b>\u003cem>명사\u003c/em>\u003cspan>담수\u003c/span>\u003c/div>\u003cdiv>\u003cb>selective scarcity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선택적 부족\u003c/span>\u003c/div>\u003cdiv>\u003cb>highlight\u003c/b>\u003cem>동사\u003c/em>\u003cspan>강조하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inequity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불평등\u003c/span>\u003c/div>\u003cdiv>\u003cb>safe drinking water\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안전한 식수\u003c/span>\u003c/div>\u003cdiv>\u003cb>proper sanitation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>적절한 위생\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개 짚어 볼게요. inevitable은 피할 수 없는이라는 뜻이고, elective는 선택적인이라는 뜻입니다. governmental neglect는 정부의 소홀함, infrastructure는 사회 기반 시설, selective scarcity는 선택적 부족이라는 의미예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">crisis\u003c/b>\u003cspan class=\"m\">위기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">emergency\u003c/span>\u003cspan class=\"s\">catastrophe\u003c/span>\u003cspan class=\"s\">disaster\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">calm\u003c/span>\u003cspan class=\"a\">stability\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inevitable\u003c/b>\u003cspan class=\"m\">피할 수 없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unavoidable\u003c/span>\u003cspan class=\"s\">certain\u003c/span>\u003cspan class=\"s\">inescapable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">avoidable\u003c/span>\u003cspan class=\"a\">preventable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distressing\u003c/b>\u003cspan class=\"m\">괴로운\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">painful\u003c/span>\u003cspan class=\"s\">upsetting\u003c/span>\u003cspan class=\"s\">troubling\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">comforting\u003c/span>\u003cspan class=\"a\">pleasant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">abundant\u003c/b>\u003cspan class=\"m\">풍족한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">plentiful\u003c/span>\u003cspan class=\"s\">rich\u003c/span>\u003cspan class=\"s\">ample\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">scarce\u003c/span>\u003cspan class=\"a\">insufficient\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">neglect\u003c/b>\u003cspan class=\"m\">소홀함, 무시\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disregard\u003c/span>\u003cspan class=\"s\">negligence\u003c/span>\u003cspan class=\"s\">indifference\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">attention\u003c/span>\u003cspan class=\"a\">care\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">scarcity\u003c/b>\u003cspan class=\"m\">부족\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shortage\u003c/span>\u003cspan class=\"s\">lack\u003c/span>\u003cspan class=\"s\">deficiency\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">abundance\u003c/span>\u003cspan class=\"a\">plenty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inequity\u003c/b>\u003cspan class=\"m\">불평등\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inequality\u003c/span>\u003cspan class=\"s\">unfairness\u003c/span>\u003cspan class=\"s\">injustice\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">equality\u003c/span>\u003cspan class=\"a\">fairness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">address\u003c/b>\u003cspan class=\"m\">해결하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">tackle\u003c/span>\u003cspan class=\"s\">handle\u003c/span>\u003cspan class=\"s\">deal with\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003cspan class=\"a\">neglect\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"이제 시험에 자주 나오는 핵심 어휘의 동의어와 반의어를 정리할게요. crisis는 비슷한 말로 emergency, catastrophe, disaster가 있고, 반대말은 calm, stability예요. inevitable은 unavoidable, certain, inescapable과 비슷하고, avoidable, preventable과 반대입니다. distressing은 painful, upsetting, troubling과 비슷하고 comforting, pleasant와 반대예요. abundant는 plentiful, rich, ample과 비슷하고 scarce, insufficient과 반대입니다. neglect는 disregard, negligence, indifference와 비슷하고 attention, care와 반대예요. scarcity는 shortage, lack, deficiency와 비슷하고 abundance, plenty와 반대입니다. 마지막으로 address는 tackle, handle, deal with와 비슷하고 ignore, neglect와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날, 물 위기는 정치적이다\u003c/span>\u003cspan class=\"en\">Today, the water crisis is political\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉, 피할 수 없는 것이 아니라\u003c/span>\u003cspan class=\"en\">― \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">say\u003c/span>, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">inevitable \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 우리의 바로잡을 수 있는 능력을 넘어서지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">beyond \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">capacity \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">fix\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 따라서 기능적으로\u003c/span>\u003cspan class=\"en\">― and, therefore, functionally\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선택적이다.\u003c/span>\u003cspan class=\"en\">elective.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날, 물 위기는 피할 수 없는 것이 아니며 우리의 바로잡을 수 있는 능력을 넘어서지 않는, 즉 정치적인 것이고 따라서 기능적으로 선택적이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오늘날의 물 위기가 자연적 필연이 아니라 정치적 방치와 선택의 결과임을 선언하는 중심 문장입니다. \u003cb class=\"key\">정치적\u003c/b>이라는 말은 정부 정책과 사회적 선택에 달려 있다는 뜻이며, \u003cb class=\"key\">기능적으로 \u003c/b>\u003cb class=\"key\">선택적\u003c/b>이라는 표현은 필요하면 해결할 수 있는 문제라는 점을 강조합니다. 이 문장은 뒤에 나올 위기 해결 부족의 모순을 비판하는 토대가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 which의 계속적 용법 (관용적 삽입절)\u003c/span> : ..., which is to say, [앞 문장에 대한 부연 설명] : \"즉, 다시 말해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">not A or B (병렬 구조)\u003c/span> : not [A] + or [B] : \"피할 수 없는 것도 아니고 우리가 바로잡을 수 있는 능력을 넘어서지도 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법 (명사 수식)\u003c/span> : capacity [명사] + to fix [to부정사구] : \"바로잡을 수 있는 능력\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Today, the water crisis is political, 오늘날, 물 위기는 정치적이다. ― which is to say, not inevitable, 즉, 피할 수 없는 것이 아니라. or beyond our capacity to fix, 또는 우리의 바로잡을 수 있는 능력을 넘어서지 않는다. ― and, therefore, functionally, 그리고 따라서 기능적으로. elective, 선택적이다.. 이 문장 전체를 해석하면, 오늘날, 물 위기는 피할 수 없는 것이 아니며 우리의 바로잡을 수 있는 능력을 넘어서지 않는, 즉 정치적인 것이고 따라서 기능적으로 선택적이다.","hl":"m"},{"n":13,"text":"이 문장은 오늘날 물 위기가 자연적으로 피할 수 없는 것이 아니라 정치적 선택의 문제라고 선언합니다. 즉 정부와 사회가 어떻게 행동하느냐에 따라 충분히 해결할 수 있는 기능적으로 선택적인 문제라는 뜻이에요. 이 주장이 뒤에 이어지는 물 위기의 모순을 비판하는 기준이 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 which is to say예요. 이 표현은 앞 문장 전체를 받아서 다시 말해라는 뜻으로 쓰이는 삽입절이에요. 관계대명사 which의 계속적 용법이죠. 두 번째 포인트는 to fix인데요, 앞에 있는 capacity를 수식하는 to부정사의 형용사적 용법이라서 바로잡을 수 있는 능력이라는 뜻이 됩니다. to부정사가 명사 수식을 하는 거예요. 세 번째 포인트는 not inevitable or beyond our capacity to fix로, not A or B 병렬 구조예요. 피할 수 없는 것이 아니라 우리가 바로잡을 수 있는 능력을 넘어서지 않는다고 두 표현을 함께 부정해 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 한 가지 이유이다\u003c/span>\u003cspan class=\"en\">That is one reason\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그럼에도 불구하고 괴로운 것은\u003c/span>\u003cspan class=\"en\">it is nevertheless distressing:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">풍족한 자원이\u003c/span>\u003cspan class=\"en\">an abundant resource\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부족하게 되었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">scarce\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정부의 소홀함과 무관심\u003c/span>\u003cspan class=\"en\">through \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">governmental \u003c/span>\u003cspan class=\"tgt\">neglect \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">indifference, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열악한 사회 기반 시설과 오염\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">bad \u003c/span>\u003cspan class=\"tgt\">infrastructure \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">contamination, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 부주의한 도시화를 통해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">careless \u003c/span>\u003cspan class=\"tgt\">urbanization\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 그럼에도 불구하고 그것이 괴로운 한 가지 이유이다. 즉, 풍족한 자원이 정부의 소홀함과 무관심, 열악한 사회 기반 시설과 오염, 부주의한 도시화를 통해 부족하게 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물 위기가 특히 괴로운 이유를 설명하는 문장으로, 풍족한 물이 인간의 잘못된 관리로 부족해졌음을 지적합니다. \u003cb class=\"key\">정부의 \u003c/b>\u003cb class=\"key\">소홀함과 \u003c/b>\u003cb class=\"key\">무관심\u003c/b>, \u003cb class=\"key\">열악한 \u003c/b>\u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">기반 \u003c/b>\u003cb class=\"key\">시설\u003c/b>, \u003cb class=\"key\">부주의한 \u003c/b>\u003cb class=\"key\">도시화\u003c/b>라는 세 가지 원인을 병렬로 제시해 위기가 인위적임을 보여줍니다. 즉, 자연적 부족이 아니라 관리 실패의 결과라는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사(수동태) 후치수식\u003c/span> : an abundant resource [명사] + made scarce [과거분사구] : \"부족하게 된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">A, B, and C 병렬 구조\u003c/span> : [명사구 A] + , + [명사구 B] + , + and + [명사구 C] : \"정부의 소홀함과 무관심, 열악한 사회 기반 시설과 오염, 그리고 부주의한 도시화\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"That is one reason, 그것이 한 가지 이유이다. it is nevertheless distressing, 그럼에도 불구하고 괴로운 것은. an abundant resource, 풍족한 자원이. made scarce, 부족하게 되었다. through governmental neglect and indifference, 정부의 소홀함과 무관심. bad infrastructure and contamination, 열악한 사회 기반 시설과 오염. and careless urbanization, 그리고 부주의한 도시화를 통해. 이 문장 전체를 해석하면, 그것은 그럼에도 불구하고 그것이 괴로운 한 가지 이유이다. 즉, 풍족한 자원이 정부의 소홀함과 무관심, 열악한 사회 기반 시설과 오염, 부주의한 도시화를 통해 부족하게 되었다.","hl":"m"},{"n":16,"text":"이 문장은 물 위기가 왜 괴로운지 설명해요. 풍부한 물이 정부의 소홀함과 무관심, 열악한 사회 기반 시설과 오염, 부주의한 도시화라는 인위적 원인 때문에 부족해졌다는 거죠. 그래서 물 위기는 자연적 부족이 아니라 관리 실패의 결과라는 점이 강조됩니다.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 made scarce예요. 과거분사 made scarce가 앞의 명사 an abundant resource를 뒤에서 수식하는 후치수식 구조입니다. 풍족한 자원이 부족하게 되었다는 수동적 의미를 담고 있어요. 두 번째 포인트는 governmental neglect and indifference, bad infrastructure and contamination, and careless urbanization인데요. 세 개의 명사구를 A, B, and C로 병렬 연결해서 물 부족의 인위적 원인들을 나열하고 있습니다. 이 명사구들은 through의 목적어로 연결되어 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">필요가 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물 위기가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">crisis\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 말해서\u003c/span>\u003cspan class=\"en\">in other words,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 어쨌든 우리는 그것을 겪고 있다\u003c/span>\u003cspan class=\"en\">but we have one anyway,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 많은 일을 하고 있지 않다\u003c/span>\u003cspan class=\"en\">and aren't doing much\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 해결하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">address \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다시 말해서 물 위기가 있어야 할 필요가 없지만 어쨌든 우리는 그것을 겪고 있고 그것을 해결하기 위해 많은 일을 하고 있지 않다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물 위기가 불가피하지 않으며 당연히 없어야 할 문제인데도 방치되고 있다는 모순을 압축한 문장입니다. \u003cb class=\"key\">물 \u003c/b>\u003cb class=\"key\">위기가 \u003c/b>\u003cb class=\"key\">있어야 \u003c/b>\u003cb class=\"key\">할 \u003c/b>\u003cb class=\"key\">필요가 \u003c/b>\u003cb class=\"key\">없다\u003c/b>는 근본적인 문제 제기이고, \u003cb class=\"key\">해결하기 \u003c/b>\u003cb class=\"key\">위해 \u003c/b>\u003cb class=\"key\">많은 \u003c/b>\u003cb class=\"key\">일을 \u003c/b>\u003cb class=\"key\">하고 \u003c/b>\u003cb class=\"key\">있지 \u003c/b>\u003cb class=\"key\">않다\u003c/b>는 현재의 무책임한 태도를 비판합니다. 이 글의 문제의식과 논지를 다시 한 번 요약합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">there is no need for + 명사 (관용적 표현)\u003c/span> : There is no need for + [명사구] : \"물 위기가 필요하지 않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : aren't doing much [동사] + to address it [to부정사구/목적] : \"그것을 해결하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"There is no need, 필요가 없다. for a water crisis, 물 위기가. in other words, 다시 말해서. but we have one anyway, 하지만 어쨌든 우리는 그것을 겪고 있다. and aren't doing much, 그리고 많은 일을 하고 있지 않다. to address it, 그것을 해결하기 위해. 이 문장 전체를 해석하면, 다시 말해서 물 위기가 있어야 할 필요가 없지만 어쨌든 우리는 그것을 겪고 있고 그것을 해결하기 위해 많은 일을 하고 있지 않다.","hl":"m"},{"n":19,"text":"이 문장은 물 위기가 있어야 할 필요가 없는데도 우리가 겪고 있고 그것을 해결하기 위해 많은 일을 하고 있지 않다는 모순을 요약해요. 물 위기가 불가피하지 않다는 점과 무책임한 대응을 함께 비판하는 셈이죠. 글의 핵심 논지가 다시 한 번 정리되는 문장입니다.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 There is no need for a water crisis예요. 필요 없음을 나타내는 관용 표현으로, there는 의미 없는 유도부사고 진짜 주어는 no need입니다. 두 번째 포인트는 to address it인데요. 이 to부정사는 해결하기 위해라는 목적을 나타내는 부사적 용법으로 쓰였어요. 앞에 있는 aren't doing much를 수식해서 무엇을 위한 노력인지 설명해 주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일부 도시들은 누수로 인해 더 많은 물을 잃는다\u003c/span>\u003cspan class=\"en\">Some cities lose \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">leaks \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 주택으로 공급하는 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">deliver \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">homes\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국에서조차 누수와 도난은 담수의 16퍼센트의 추정된 손실을 차지하고\u003c/span>\u003cspan class=\"en\">even in the United States, leaks and theft account for \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">an \u003c/span>\u003cspan class=\"tgt\">estimated \u003c/span>\u003cspan class=\"tgt\">loss\u003c/span> of 16 percent of freshwater;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">브라질에서는 그 추정치가 40퍼센트이다\u003c/span>\u003cspan class=\"en\">in Brazil, the estimate is 40 percent.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일부 도시들은 그들이 주택으로 공급하는 것보다 누수로 인해 더 많은 물을 잃는다. 즉, 미국에서조차 누수와 도난은 담수의 16퍼센트의 추정된 손실을 차지하고 브라질에서는 그 추정치가 40퍼센트이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 구체적인 수치를 들어 물 문제가 자원의 절대적 부족보다 \u003cb class=\"key\">누수\u003c/b>와 \u003cb class=\"key\">도난\u003c/b> 같은 관리 실패에서 비롯된다는 점을 보여 줍니다. 미국에서도 16퍼센트, 브라질에서는 40퍼센트에 달해 \u003cb class=\"key\">물 \u003c/b>\u003cb class=\"key\">낭비\u003c/b>가 심각하며, 이는 앞 문장의 정부 소홀과 무관심을 뒷받침하는 예시입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 + than절\u003c/span> : more + 명사 + than + 주어 + 동사 : \"그들이 주택으로 공급하는 것보다 더 많은 물을 누수로 잃는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 명사 수식\u003c/span> : estimated(과거분사) + loss(명사) : \"추정된 손실\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Some cities lose more water to leaks, 일부 도시들은 누수로 인해 더 많은 물을 잃는다. than they deliver to homes, 그들이 주택으로 공급하는 것보다. even in the United States, leaks and theft account for an estimated loss of 16 percent of freshwater, 미국에서조차 누수와 도난은 담수의 16퍼센트의 추정된 손실을 차지하고. in Brazil, the estimate is 40 percent, 브라질에서는 그 추정치가 40퍼센트이다. 이 문장 전체를 해석하면, 일부 도시들은 그들이 주택으로 공급하는 것보다 누수로 인해 더 많은 물을 잃는다. 즉, 미국에서조차 누수와 도난은 담수의 16퍼센트의 추정된 손실을 차지하고 브라질에서는 그 추정치가 40퍼센트이다.","hl":"m"},{"n":22,"text":"이 문장은 물 부족이 자연적 현상이 아니라 관리 부실에서 비롯된다는 걸 구체적인 수치로 보여주는 예시입니다. 미국에서도 누수와 도난으로 담수의 십육퍼센트를 잃고 브라질은 사십퍼센트나 잃는다는 건 누수와 도난 같은 관리 실패가 얼마나 심각한지 보여줍니다.","hl":"mn"},{"n":23,"text":"첫 번째, more water to leaks than they deliver to homes에서 more가 water를 꾸미고 than이 비교 대상을 이끄는 비교급 than절입니다. 두 번째, an estimated loss에서 estimated는 estimate의 과거분사로 뒤의 loss를 수동의 의미로 수식합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">양쪽의 경우에서 보여지듯이 모든 곳에서처럼 선택적 부족이 가진 자와 가지지 못한 자의 불평등을 분명히 강조하고 21억 명을 안전한 식수 없이 남기고 그리고 전 세계적으로 45억 명을 적절한 위생 없이 남긴다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Seen \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">cases\u003c/span>, as everywhere, the selective scarcity clearly highlights have­and­have­not inequities, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">leaving \u003c/span>\u003cspan class=\"tgt\">2.1 \u003c/span>\u003cspan class=\"tgt\">billion \u003c/span>\u003cspan class=\"tgt\">people \u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">safe \u003c/span>\u003cspan class=\"tgt\">drinking \u003c/span>\u003cspan class=\"tgt\">water \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">4.5 \u003c/span>\u003cspan class=\"tgt\">billion \u003c/span>\u003cspan class=\"tgt\">without \u003c/span>\u003cspan class=\"tgt\">proper \u003c/span>\u003cspan class=\"tgt\">sanitation \u003c/span>\u003cspan class=\"tgt\">worldwide\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">양쪽의 경우에서 보여지듯이 모든 곳에서처럼 선택적 부족이 가진 자와 가지지 못한 자의 불평등을 분명히 강조하고 이것은 전 세계적으로 21억 명을 안전한 식수가 없고 45억 명을 적절한 위생이 없는 채로 둔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 예로 든 미국과 브라질뿐 아니라 전 세계적으로 물 부족이 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">부족\u003c/b>이며, 그 피해가 \u003cb class=\"key\">가진 \u003c/b>\u003cb class=\"key\">자와 \u003c/b>\u003cb class=\"key\">가지지 \u003c/b>\u003cb class=\"key\">못한 \u003c/b>\u003cb class=\"key\">자\u003c/b>의 불평등으로 나타난다는 결론입니다. leaving 이하는 그 결과로 지구촌 수십억 명이 깨끗한 물과 위생을 누리지 못하고 있음을 보여 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구문(수동)\u003c/span> : (Being) Seen in both cases, 주어 + 동사 : \"양쪽의 경우에서 보여지듯이\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구문(결과)\u003c/span> : 주절, leaving + 목적어 + 부사구 : \"21억 명을 안전한 식수 없이, 그리고 45억 명을 적절한 위생 없이 남기면서\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Seen in both cases, 양쪽의 경우에서 보여지듯이. as everywhere, 모든 곳에서처럼. the selective scarcity clearly highlights have-and-have-not inequities, 선택적 부족이 가진 자와 가지지 못한 자의 불평등을 분명히 강조하고. leaving 2.1 billion people without safe drinking water, 21억 명을 안전한 식수 없이 남기고. and 4.5 billion without proper sanitation worldwide, 그리고 전 세계적으로 45억 명을 적절한 위생 없이 남긴다. 이 문장 전체를 해석하면, 양쪽의 경우에서 보여지듯이 모든 곳에서처럼 선택적 부족이 가진 자와 가지지 못한 자의 불평등을 분명히 강조하고 이것은 전 세계적으로 21억 명을 안전한 식수가 없고 45억 명을 적절한 위생이 없는 채로 둔다.","hl":"m"},{"n":25,"text":"이 문장은 물 위기가 단순한 자원 문제가 아니라 사회적 불평등의 문제라는 핵심 주장을 요약합니다. 선택적 부족이 결국 가진 자와 가지지 못한 자의 불평등을 분명히 드러내고, 그 결과 전 세계적으로 이십일억 명이 안전한 식수 없이, 사십오억 명이 적절한 위생 없이 살아가고 있습니다.","hl":"mn"},{"n":26,"text":"첫 번째, Seen in both cases는 주어 the selective scarcity가 보여지는 대상이므로 수동의 과거분사 Seen으로 시작하는 분사구문입니다. 두 번째, leaving 이하는 앞 절의 결과를 나타내는 현재분사구문으로, and left로 바꿔 쓸 수 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>오늘날 물 위기는 \u003cb class=\"key\">정치적\u003c/b> 문제로, 피할 수 없는 것도 우리의 \u003cb class=\"key\">능력 \u003c/b>\u003cb class=\"key\">밖\u003c/b>도 아니다.\u003c/li>\u003cli>풍족한 자원이 \u003cb class=\"key\">정부의 \u003c/b>\u003cb class=\"key\">소홀함\u003c/b>과 무관심, 열악한 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">기반 \u003c/b>\u003cb class=\"key\">시설\u003c/b>과 오염, 부주의한 \u003cb class=\"key\">도시화\u003c/b>로 부족해졌다.\u003c/li>\u003cli>미국과 브라질의 \u003cb class=\"key\">누수\u003c/b> 손실 사례는 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">부족\u003c/b>이 현실임을 보여 준다.\u003c/li>\u003cli>이 선택적 부족은 \u003cb class=\"key\">가진 \u003c/b>\u003cb class=\"key\">자와 \u003c/b>\u003cb class=\"key\">가지지 \u003c/b>\u003cb class=\"key\">못한 \u003c/b>\u003cb class=\"key\">자의 \u003c/b>\u003cb class=\"key\">불평등\u003c/b>을 강조하며 수십억 명을 안전한 물과 위생 없이 남긴다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The water crisis is a politically elective scarcity caused by neglect, not an inevitable shortage, and it deepens global inequities.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">오늘날 물 위기는 \u003cb class=\"key\">정치적 \u003c/b>\u003cb class=\"key\">선택\u003c/b>의 결과로 \u003cb class=\"key\">피할 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 것이 아니며, \u003cb class=\"key\">풍족한 \u003c/b>\u003cb class=\"key\">자원\u003c/b>이 정부의 \u003cb class=\"key\">소홀함\u003c/b>과 열악한 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">기반 \u003c/b>\u003cb class=\"key\">시설\u003c/b>, 오염, 무분별한 \u003cb class=\"key\">도시화\u003c/b>로 부족해졌다. 그 결과 \u003cb class=\"key\">누수\u003c/b>와 \u003cb class=\"key\">선택적 \u003c/b>\u003cb class=\"key\">부족\u003c/b>이 \u003cb class=\"key\">가진 \u003c/b>\u003cb class=\"key\">자와 \u003c/b>\u003cb class=\"key\">가지지 \u003c/b>\u003cb class=\"key\">못한 \u003c/b>\u003cb class=\"key\">자의 \u003c/b>\u003cb class=\"key\">불평등\u003c/b>을 심화시켜 수십억 명을 안전한 물과 위생 없이 남긴다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":27,"text":"오늘 정리하면, 물 위기는 자연적 부족이 아니라 정치적 선택의 결과이고, 정부의 소홀함과 열악한 사회 기반 시설이 문제를 만들었다는 것입니다. 누수와 선택적 부족은 결국 가진 자와 가지지 못한 자의 불평등을 심화시켜요. 이 지문은 첫 문장의 주장을 잡고 뒤에 나오는 원인과 사례를 근거로 읽는 두괄식 독해가 중요합니다. 오늘 수업 여기까지입니다. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
