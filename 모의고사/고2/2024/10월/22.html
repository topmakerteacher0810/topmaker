</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 22번","audioDir":"22_audio","preview":false,"count":26,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">22번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>First Impressions versus Deliberation: The Power of the Unconscious\u003c/h1>\u003ch2>첫인상 대 신중한 숙고: 무의식의 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>본문은 목격자 증언과 행동경제학 연구를 통해, \u003cb class=\"key\">신중한 \u003c/b>\u003cb class=\"key\">숙고\u003c/b>보다 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">첫인상\u003c/b>이나 \u003cb class=\"key\">무의식적 \u003c/b>\u003cb class=\"key\">추측\u003c/b>이 더 정확할 수 있다는 점을 보여 준다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Our immediate unconscious first impressions are often more accurate than deliberate logical reasoning.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘 함께 볼 지문은 전국연합학력평가에서 나온 독해 문제로, 첫인상과 신중한 판단 중 무엇이 더 정확한지를 다룹니다. 요약하면, 신중한 숙고보다 즉각적인 첫인상이나 무의식적 추측이 더 정확할 수 있다는 내용이에요. 요지는 immediate unconscious first impressions are often more accurate than deliberate logical reasoning입니다. 이제 글의 흐름을 따라가 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람들은 보통 어떤 결정을 내릴 때 \u003cb class=\"key\">논리적 \u003c/b>\u003cb class=\"key\">판단\u003c/b>이 정확하다고 믿지만, 심리학과 행동 경제학 behavioral economics에서는 직관 intuition이나 \u003cb class=\"key\">첫인상\u003c/b> first impression이 더 나은 결과를 내는 사례가 많습니다. 예를 들어 시험에서 처음 찍은 답을 고치다가 틀리는 경험, 다들 있죠? 목격자 증언 eyewitness testimony처럼 기억을 떠올리는 과정이 반드시 신뢰할 만한 것은 아니에요. Malcolm Gladwell의 책 Blink는 그런 무의식적 판단의 힘을 다양한 연구로 보여 줍니다. 이 지문도 그 흐름 위에 있어요.\u003c/div>","segs":[{"n":2,"text":"사람들은 보통 어떤 결정을 내릴 때 논리적으로 따져 보고 신중하게 판단하는 것이 더 정확하다고 생각하죠. 하지만 심리학과 행동경제학에서는 직관이나 첫인상이 더 나은 판단으로 이어지는 경우가 자주 보고됩니다. 예를 들어 시험에서 처음 찍은 답을 고치다가 틀리는 경험, 다들 있죠? 목격자 증언에서도 eyewitness testimony처럼 기억을 떠올리는 과정이 반드시 신뢰할 만한 것은 아니에요. Malcolm Gladwell의 책 Blink는 그런 무의식적 판단의 힘을 다양한 연구로 보여 줍니다. 이 지문도 그 흐름 위에 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>신중한 숙고는 오히려 부정확 신호\u003csmall>도입·실험 근거 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>코넬 대학의 David Dunning 연구에서 목격자가 얼굴 특징을 \u003cb class=\"key\">신중하게 \u003c/b>\u003cb class=\"key\">숙고\u003c/b>하고 선택 절차를 상세히 논의하는 것이 오히려 \u003cb class=\"key\">부정확한 \u003c/b>\u003cb class=\"key\">식별\u003c/b>의 징후로 나타났어요. 반면 왜 그 사람을 알아보는지 설명하지 못하고 '얼굴이 그냥 떠올랐다'고 말하는 경우에 더 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">경향\u003c/b>을 보였습니다. 즉 설명 가능성이 정확도를 보장하지 않는다는 실험 근거가 제시됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>즉각적 첫 반응의 진실성\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>이를 일반화하면 상황에 대한 우리의 \u003cb class=\"key\">최초의 \u003c/b>\u003cb class=\"key\">즉각적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>이 마음이 말해 주는 가장 정확한 해석일 수 있습니다. 그 \u003cb class=\"key\">첫인상\u003c/b>은 신중하고 논리적인 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">서사\u003c/b>보다 세상에 대해 더 정확할 수 있어요. 이 부분이 글의 핵심 주장입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>Blink 연구로 뒷받침\u003csmall>근거·인용 · 문장 5\u003c/small>\u003c/h4>\u003cp>Malcolm Gladwell은 저서 'Blink'에서 심리학과 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">경제학\u003c/b> 연구들을 소개합니다. 이 연구들은 논리적인 \u003cb class=\"key\">단계적 \u003c/b>\u003cb class=\"key\">정당화\u003c/b>보다 상대적으로 \u003cb class=\"key\">무의식적인 \u003c/b>\u003cb class=\"key\">최초 \u003c/b>\u003cb class=\"key\">추측\u003c/b>의 수행이 더 우수함을 보여 줍니다. 이는 앞선 실험 결과를 다른 학문 영역에서 재확인해 주는 근거입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장 순서에 따라 글의 전개를 살펴보겠습니다.","hl":null},{"n":4,"text":"첫 번째 흐름은 코넬 대학의 David Dunning 실험입니다. 목격자가 얼굴 특징을 신중하게 숙고하고 선택 절차를 상세히 논의하는 것이 오히려 부정확한 식별의 징후일 수 있다는 증거가 나왔어요. 반대로 얼굴이 그냥 떠올랐다고 말할 때, 즉 설명하지 못할 때 더 정확한 경향을 보였죠. 정확도를 장담할 것 같은 신중한 검토가 실제로는 불안정한 신호라는 점을 기억하세요.","hl":"f0"},{"n":5,"text":"두 번째 흐름은 이 실험을 일반화한 주장입니다. 때때로 우리의 최초의 즉각적이고 자동적인 반응이 마음이 우리에게 말하는 내용의 가장 정확한 해석일 수 있어요. 바로 그 첫인상이 신중하고 논리적인 자기 서사보다 세상에 대해 더 정확할 수도 있습니다. 글쓴이의 핵심 주장이 여기서 드러나죠.","hl":"f1"},{"n":6,"text":"세 번째 흐름은 Malcolm Gladwell의 책 Blink를 활용한 근거입니다. 이 책에는 심리학과 행동경제학 연구들이 여러 개 나오는데, 논리적인 단계별 정당화보다 상대적으로 무의식적인 최초 추측이 더 우수하다는 결과를 보여 줍니다. 결국 실험실 증거와 대중적 연구가 같은 방향을 가리키는 거예요.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">근거\u003c/b>를 앞세워 \u003cb class=\"key\">즉각적 \u003c/b>\u003cb class=\"key\">첫인상\u003c/b>의 우수성을 주장하는 전개입니다. 첫째와 둘째 문장에서 실험 사례를, 셋째와 넷째 문장에서 핵심 주장을, 마지막 문장에서 책 근거를 제시해요. 따라서 주제문이 중간에 오는 \u003cb class=\"key\">중괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>can actually be (1)\u003c/b>\u003cspan>기대와 다른 결과 강조\u003c/span>\u003cb>It's when (2)\u003c/b>\u003cspan>조건 강조\u003c/span>\u003cb>Sometimes (3)\u003c/b>\u003cspan>일반화\u003c/span>\u003cb>also (4)\u003c/b>\u003cspan>첨가·강화\u003c/span>\u003cb>demonstrate (5)\u003c/b>\u003cspan>근거 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">his face just popped out at me\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">first, immediate, automatic reaction\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">that very first impression\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">relatively unconscious first guesses\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>신중한 숙고와 논리적 정당화\u003c/th>\u003cth>즉각적 첫인상과 무의식적 추측\u003c/th>\u003c/tr>\u003ctr>\u003ctd>careful deliberation of facial features\u003c/td>\u003ctd>his face just popped out at me\u003c/td>\u003c/tr>\u003ctr>\u003ctd>deliberative reasoned self-narrative\u003c/td>\u003ctd>first immediate automatic reaction\u003c/td>\u003c/tr>\u003ctr>\u003ctd>logical step-by-step justifications\u003c/td>\u003ctd>relatively unconscious first guesses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>sign of an inaccurate identification\u003c/td>\u003ctd>tend to be accurate more often\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 실험 근거와 책 근거를 통해 주장을 뒷받침하는 주장 근거 전개 방식입니다. 첫 번째와 두 번째 문장에서 실험 사례를 먼저 제시하고, 세 번째와 네 번째 문장에서 즉각적 반응이 신중한 서사보다 정확할 수 있다는 주장을 펼쳐요. 마지막 문장은 Blink 연구로 그 주장을 다시 확인해 주죠. 따라서 주제문이 중간에 있는 중괄식 구조로 볼 수 있습니다.","hl":"ty"},{"n":8,"text":"신호어를 보면 첫 번째 문장에서 can actually be가 기대와 다른 결과를 강조합니다. 두 번째 문장의 It's when은 정확한 경우의 조건을 집어 주고, 세 번째 문장의 Sometimes는 일반화를 시작합니다. 네 번째 문장의 also는 앞의 내용을 더 강화하고, 마지막 문장의 demonstrate는 연구가 무엇을 보여 주는지 알려 줘요. 또한 his face just popped out at me, first immediate automatic reaction, first impression, unconscious first guesses처럼 같은 개념이 반복되며 점점 일반화됩니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>eyewitness testimony\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목격 증언\u003c/span>\u003c/div>\u003cdiv>\u003cb>conduct\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deliberation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숙고\u003c/span>\u003c/div>\u003cdiv>\u003cb>facial features\u003c/b>\u003cem>명사\u003c/em>\u003cspan>얼굴 특징\u003c/span>\u003c/div>\u003cdiv>\u003cb>detailed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상세한\u003c/span>\u003c/div>\u003cdiv>\u003cb>selection procedures\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선택 절차\u003c/span>\u003c/div>\u003cdiv>\u003cb>sign\u003c/b>\u003cem>명사\u003c/em>\u 03cspan class=\"tgt\">features \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 선택 절차에 대한 상세한 논의가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">detailed \u003c/span>\u003cspan class=\"tgt\">discussion \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">selection \u003c/span>\u003cspan class=\"tgt\">procedures\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실제로 한 징후일 수 있다는\u003c/span>\u003cspan class=\"en\">can actually be a sign\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">부정확한 식별의\u003c/span>\u003cspan class=\"en\">of an inaccurate identification.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">David Dunning의 코넬 대학의 실험실에서, 그는 목격자 증언에 대한 실험을 수행했고, 얼굴 특징에 대한 신중한 숙고와 선택 절차에 대한 상세한 논의가 실제로는 ‘부정확한’ 식별의 징후일 수 있다는 증거를 발견했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Dunning의 실험에서 \u003cb class=\"key\">신중한 \u003c/b>\u003cb class=\"key\">숙고\u003c/b>와 상세한 논의가 오히려 \u003cb class=\"key\">부정확한 \u003c/b>\u003cb class=\"key\">식별\u003c/b>의 신호일 수 있다는 증거를 제시합니다. 사람들이 얼굴을 꼼꼼하게 따져 보고 절차를 길게 설명할수록 틀릴 가능성이 있다는 역설을 보여 줍니다. 글 흐름에서는 즉각적 반응이 더 정확하다는 주장의 실험적 근거 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 that (동격)\u003c/span> : evidence + that [완전한 절] : \"~라는 증거\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사구 병렬 (A and B)\u003c/span> : [명사구 A] and [명사구 B] : \"얼굴 특징에 대한 신중한 숙고와 선택 절차에 대한 상세한 논의\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"In his Cornell laboratory, David Dunning conducted experimental tests of eyewitness testimony, 그의 코넬 연구실에서 David Dunning은 목격자 증언에 대한 실험 검사를 수행했다. and found evidence, 그리고 증거를 발견했다. that a careful deliberation of facial features, 얼굴 특징에 대한 신중한 숙고가. and a detailed discussion of selection procedures, 그리고 선택 절차에 대한 상세한 논의가. can actually be a sign, 실제로 한 징후일 수 있다는. of an inaccurate identification, 부정확한 식별의. 이 문장 전체를 해석하면, David Dunning의 코넬 대학의 실험실에서, 그는 목격자 증언에 대한 실험을 수행했고, 얼굴 특징에 대한 신중한 숙고와 선택 절차에 대한 상세한 논의가 실제로는 ‘부정확한’ 식별의 징후일 수 있다는 증거를 발견했다.","hl":"m"},{"n":12,"text":"첫 번째 문장은 Dunning의 실험에서 신중한 숙고와 상세한 논의가 오히려 부정확한 식별의 신호일 수 있다는 증거를 제시해요. 사람들이 얼굴을 꼼꼼히 따져 보고 절차를 길게 설명할수록 오히려 틀릴 가능성이 있다는 역설을 보여 주죠. 글 흐름에서는 즉각적 반응이 더 정확하다는 주장의 실험적 근거 역할을 합니다.","hl":"mn"},{"n":13,"text":"첫 번째 문장의 어법 포인트를 설명해 드릴게요. 우선 evidence that 이하는 앞에 나온 evidence의 내용을 구체적으로 설명하는 동격의 that절이에요. 이때 that은 접속사이기 때문에 절 안에서 주어나 목적어 역할을 하지 않아요. 그리고 주어 자리에는 a careful deliberation of facial features와 a detailed discussion of selection procedures가 and로 병렬 연결되어 있어요. 두 개의 긴 명사구가 나란히 이어져서 동사 can과 복수 수일치하고 있다는 점도 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 왜 그 사람을 알아보는지 설명할 수 없는 자신을 발견하는 것은 바로 그때이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's \u003c/span>\u003cspan class=\"tgt\">when\u003c/span> people \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">find \u003c/span>\u003cspan class=\"tgt\">themselves \u003c/span>\u003cspan class=\"tgt\">unable \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">explain\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">recognize \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">person\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 얼굴이 그냥 나에게 탁 떠올랐다는 식으로 말하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">saying \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">&quot;his \u003c/span>\u003cspan class=\"tgt\">face \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">popped \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">me,&quot;\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 더 자주 정확한 경향이 있다\u003c/span>\u003cspan class=\"en\">that they tend to be accurate more often.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사람들이 “그의 얼굴이 그냥 나에게 탁 떠올랐다”라는 식으로 말하면서 왜 그 사람을 알아보는지 설명할 수 없는 스스로를 발견하는 바로 그때 그들은 더 자주 정확한 경향이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사람들이 왜 그 사람을 알아보는지 설명하지 못할 때, 즉 \u003cb class=\"key\">설명 \u003c/b>\u003cb class=\"key\">불가\u003c/b>한 즉각적 반응이 나올 때 오히려 정확도가 높아진다는 점을 말합니다. 'his face just popped out at me'처럼 이유 없이 떠오르는 반응이 신뢰할 만하다는 뜻이에요. 첫 문장의 실험 결과를 구체적 사례로 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">It is ... that 강조구문\u003c/span> : It is [강조할 부사절] that [주절] : \"바로 그때 ... 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">find의 다섯 형식 (목적격 보어)\u003c/span> : find [목적어] [목적격 보어] : \"자신이 설명할 수 없다는 것을 발견하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사 + [주어] + [동사] : \"왜 그 사람을 알아보는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">현재분사 구문 (부대상황)\u003c/span> : S+V..., ~ing : \"~라고 말하면서\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"It's when people find themselves unable to explain why they recognize the person, 사람들이 왜 그 사람을 알아보는지 설명할 수 없는 자신을 발견하는 것은 바로 그때이다. saying things like \"his face just popped out at me,\", 그의 얼굴이 그냥 나에게 탁 떠올랐다는 식으로 말하면서. that they tend to be accurate more often, 그들은 더 자주 정확한 경향이 있다. 이 문장 전체를 해석하면, 사람들이 “그의 얼굴이 그냥 나에게 탁 떠올랐다”라는 식으로 말하면서 왜 그 사람을 알아보는지 설명할 수 없는 스스로를 발견하는 바로 그때 그들은 더 자주 정확한 경향이 있다.","hl":"m"},{"n":15,"text":"두 번째 문장은 사람들이 왜 그 사람을 알아보는지 설명하지 못할 때 오히려 정확도가 높아진다는 점을 말해요. his face just popped out at me처럼 이유 없이 불쑥 떠오르는 설명 불가한 반응이 신뢰할 만하다는 뜻이에요. 첫 번째 문장의 실험 결과를 구체적인 사례로 뒷받침하는 문장입니다.","hl":"mn"},{"n":16,"text":"두 번째 문장의 어법 포인트예요. 첫 번째는 전체가 It is when people find themselves unable to explain why they recognize the person saying things like his face just popped out at me that they tend to be accurate more often의 구조인데, 이것은 It is that 강조구문이에요. when 이하 부사절을 강조해서 바로 그때라는 뜻을 만듭니다. 두 번째로 find는 목적어 themselves와 목적격 보어 unable to explain을 취하는 다섯 형식 동사예요. 자신이 설명할 수 없다는 의미상 주술 관계가 성립해요. 세 번째로 saying things like는 부대상황을 나타내는 현재분사구문으로, 말하면서라고 해석돼요. 네 번째로 why they recognize the person은 간접의문문인데, 의문사 뒤에 주어 동사가 오는 평서문 어순이라서 they recognize가 어순이 바뀌지 않았어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">때때로 상황에 대한 우리의 최초의, 즉각적인, 자동적인 반응은\u003c/span>\u003cspan class=\"en\">Sometimes our first, immediate, automatic reaction to a situation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가장 정확한 해석이다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">truest \u003c/span>\u003cspan class=\"tgt\">interpretation\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 마음이 우리에게 말하고 있는 것에 대한\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">mind \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">telling \u003c/span>\u003cspan class=\"tgt\">us\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">때때로 상황에 대한 우리의 최초의, 즉각적인, 자동적인 반응이 우리 마음이 우리에게 말하고 있는 것에 대한 가장 정확한 해석이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 \u003cb class=\"key\">최초의 \u003c/b>\u003cb class=\"key\">즉각적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>이 마음이 우리에게 말하는 신호를 \u003cb class=\"key\">가장 \u003c/b>\u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">해석\u003c/b>으로 제시하는 일반 원리로 나아갑니다. 의식적으로 따져 보기 전에 나오는 반응을 신뢰할 수 있다는 뜻이에요. 다음 문장에서 첫인상이 더 정확하다는 주장으로 이어지는 중심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">최상급\u003c/span> : the + 최상급 + 명사 : \"가장 정확한 해석\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">선행사 포함 관계대명사 what\u003c/span> : what + [주어 mind] + [동사 is telling] : \"우리 마음이 우리에게 말하고 있는 것\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"Sometimes our first, immediate, automatic reaction to a situation, 때때로 상황에 대한 우리의 최초의, 즉각적인, 자동적인 반응은. is the truest interpretation, 가장 정확한 해석이다. of what our mind is telling us, 우리 마음이 우리에게 말하고 있는 것에 대한. 이 문장 전체를 해석하면, 때때로 상황에 대한 우리의 최초의, 즉각적인, 자동적인 반응이 우리 마음이 우리에게 말하고 있는 것에 대한 가장 정확한 해석이다.","hl":"m"},{"n":18,"text":"세 번째 문장은 상황에 대한 최초의 즉각적이고 자동적인 반응이 마음이 우리에게 말하는 신호를 가장 정확하게 해석한 것일 수 있다는 일반 원리를 말해요. 의식적으로 따져 보기 전에 나오는 반응을 가장 정확한 해석으로 제시하고 있어요. 다음 문장에서 첫인상이 더 정확하다는 주장으로 자연스럽게 이어지는 중심 문장입니다.","hl":"mn"},{"n":19,"text":"세 번째 문장의 어법 포인트를 볼게요. the truest interpretation에서 truest는 true의 최상급이에요. the와 함께 쓰여 가장 정확한이라는 의미를 만듭니다. 그리고 of 뒤에 나오는 what our mind is telling us는 선행사를 포함한 관계대명사 what절로, 우리 마음이 우리에게 말하고 있는 것이라는 뜻이에요. 전치사 of의 목적어 자리에 명사절로 들어가 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 그 첫인상은 또한 ~일 수 있다 세상에 대해 더 정확할 신중하고 논리적인 자기 서사가 그럴 수 있는 것보다.\u003c/span>\u003cspan class=\"en\">That very first impression can also be \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">accurate \u003c/span>\u003cspan class=\"tgt\">about \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world\u003c/span> than the deliberative, reasoned self­narrative can be.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">바로 그 첫인상이 또한 신중하고 논리적인 자기 서사보다 세상에 대해 더 정확할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 바로 그 \u003cb class=\"key\">첫인상\u003c/b>이 \u003cb class=\"key\">논리적 \u003c/b>\u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">서사\u003c/b>보다 세상에 대해 더 정확할 수 있다는 주장입니다. 'deliberative, reasoned self-narrative'는 자신의 판단을 신중하게 따지고 합리화한 이야기를 뜻하며, 앞 문장의 'first, immediate, automatic reaction'과 대비됩니다. 즉각적인 직관이 숙고보다 우위에 있음을 강조하는 흐름입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 표현 (more + 형용사)\u003c/span> : more + accurate + about + the world : \"세상에 대해 더 정확한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">비교구문의 대동사 can be\u003c/span> : 비교급 + than + 주어 + can be : \"신중하고 논리적인 자기 서사가 그럴 수 있는 것보다\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"That very first impression, 바로 그 첫인상은. can also be, 또한 ~일 수 있다. more accurate about the world, 세상에 대해 더 정확할. than the deliberative, reasoned self-narrative can be, 신중하고 논리적인 자기 서사가 그럴 수 있는 것보다.. 이 문장 전체를 해석하면, 바로 그 첫인상이 또한 신중하고 논리적인 자기 서사보다 세상에 대해 더 정확할 수 있다.","hl":"m"},{"n":21,"text":"이 문장은 첫인상이 신중하고 논리적인 자기 서사보다 세상에 대해 더 정확할 수 있다는 뜻이에요. 여기서 deliberative, reasoned self-narrative는 우리가 머리로 따지고 합리화해서 만든 이야기를 말해요. 앞 문장의 즉각적이고 자동적인 반응이 더 정확하다는 흐름을 이어서 직관의 우위를 강조하고 있어요.","hl":"mn"},{"n":22,"text":"첫 번째 어법 포인트는 more accurate about the world에 쓰인 비교급 표현이에요. accurate처럼 긴 형용사는 more를 붙여 비교급을 만들고, 뒤에 about the world 같은 전치사구를 붙여 정확하다는 내용을 구체화하죠. 두 번째 어법 포인트는 than 이하에 can be만 남은 비교구문의 대동사예요. 앞에 나온 be accurate about the world를 반복하지 않기 위해 조동사 can과 be만 남겨서 비교 대상이 그럴 수 있다는 뜻을 대신 받아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 5\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 저서 Blink에서, Malcolm Gladwell은 다양한 연구들을 기술한다 심리학과 행동 경제학에서 우수성을 입증하는 상대적으로 무의식적인 최초 추측의 결정에 대한 논리적인 단계적 정당화와 비교해서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">book \u003c/span>\u003cspan class=\"tgt\">Blink,\u003c/span> Malcolm Gladwell describes a variety of studies in psychology and behavioral economics \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">demonstrate \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">superior \u003c/span>\u003cspan class=\"tgt\">performance\u003c/span> of relatively unconscious first guesses compared to logical step­by­step justifications for a decision.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Malcolm Gladwell은 그의 저서 ‘Blink’에서, 결정에 대한 논리적인 단계적 정당화에 비해서 상대적으로 무의식적인 최초 추측의 우수성을 보여 주는 심리학 및 행동 경제학의 다양한 연구를 기술한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Malcolm Gladwell의 저서 \u003cb class=\"key\">Blink\u003c/b>에서, \u003cb class=\"key\">무의식적인 \u003c/b>\u003cb class=\"key\">최초 \u003c/b>\u003cb class=\"key\">추측\u003c/b>이 \u003cb class=\"key\">논리적인 \u003c/b>\u003cb class=\"key\">단계적 \u003c/b>\u003cb class=\"key\">정당화\u003c/b>보다 우수함을 보여 주는 여러 연구를 소개합니다. 심리학과 행동 경제학의 연구를 근거로 제시해 앞 문장들의 직관 우위 주장을 뒷받침합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">문두 전치사구 (부사구)\u003c/span> : In + his book Blink : \"그의 저서 Blink에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 that\u003c/span> : 선행사 studies + that + 동사 demonstrate : \"우수성을 입증하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">과거분사구 (비교 표현)\u003c/span> : compared to + 명사구 : \"결정에 대한 논리적인 단계적 정당화와 비교해서\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"In his book Blink, 그의 저서 Blink에서. Malcolm Gladwell describes a variety of studies, Malcolm Gladwell은 다양한 연구들을 기술한다. in psychology and behavioral economics, 심리학과 행동 경제학에서. that demonstrate the superior performance, 우수성을 입증하는. of relatively unconscious first guesses, 상대적으로 무의식적인 최초 추측의. compared to logical step-by-step justifications for a decision, 결정에 대한 논리적인 단계적 정당화와 비교해서.. 이 문장 전체를 해석하면, Malcolm Gladwell은 그의 저서 ‘Blink’에서, 결정에 대한 논리적인 단계적 정당화에 비해서 상대적으로 무의식적인 최초 추측의 우수성을 보여 주는 심리학 및 행동 경제학의 다양한 연구를 기술한다.","hl":"m"},{"n":24,"text":"이 문장은 Malcolm Gladwell이 Blink라는 책에서 어떤 연구들을 소개하는지 설명해요. 심리학과 행동 경제학의 여러 연구가 무의식적인 최초 추측이 논리적인 단계적 정당화보다 더 우수하다는 것을 보여 준다는 거예요. 앞 문장들의 직관 우위 주장을 책의 연구로 뒷받침하는 흐름이에요.","hl":"mn"},{"n":25,"text":"첫 번째 어법 포인트는 문장 첫머리의 in his book Blink라는 전치사구예요. 장소나 출처를 나타내는 전치사구가 문장 앞에 오면 전체 문장의 배경을 제시해요. 두 번째 어법 포인트는 that demonstrate the superior performance에 쓰인 관계대명사 that이에요. 앞에 있는 studies를 선행사로 받아서 studies를 꾸며 주는 형용사절을 이끌고 있어요. 세 번째 어법 포인트는 compared to logical step-by-step justifications for a decision이에요. compared는 과거분사로 분사구를 이끌어서 비교 대상을 나타내고, ~와 비교할 때라고 해석해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>코넬대 실험에서 신중한 숙고와 상세한 논의가 오히려 \u003cb class=\"key\">부정확한 \u003c/b>\u003cb class=\"key\">식별\u003c/b>의 징후로 나타났다.\u003c/li>\u003cli>설명하지 못하고 얼굴이 그냥 떠오른 경우에 오히려 \u003cb class=\"key\">정확한 \u003c/b>\u003cb class=\"key\">경향\u003c/b>이 높았다.\u003c/li>\u003cli>따라서 \u003cb class=\"key\">최초의 \u003c/b>\u003cb class=\"key\">즉각적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>과 \u003cb class=\"key\">첫인상\u003c/b>이 논리적 자기 서사보다 정확할 수 있다.\u003c/li>\u003cli>Gladwell의 Blink는 \u003cb class=\"key\">무의식적 \u003c/b>\u003cb class=\"key\">추측\u003c/b>이 \u003cb class=\"key\">단계적 \u003c/b>\u003cb class=\"key\">정당화\u003c/b>보다 우수함을 보여 주며 이를 뒷받침한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Our immediate unconscious first impressions are often more accurate than deliberate logical reasoning.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">본문은 목격자 증언과 행동경제학 연구를 통해, \u003cb class=\"key\">신중한 \u003c/b>\u003cb class=\"key\">숙고\u003c/b>보다 \u003cb class=\"key\">즉각적인 \u003c/b>\u003cb class=\"key\">첫인상\u003c/b>이나 \u003cb class=\"key\">무의식적 \u003c/b>\u003cb class=\"key\">추측\u003c/b>이 더 정확할 수 있다는 점을 보여 준다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":26,"text":"오늘 지문은 신중한 논리가 항상 최선은 아니고, 즉각적이고 무의식적인 첫인상이 더 정확할 수 있다는 실험과 연구를 다뤘습니다. 겉으로는 설명이 안 되는 느낌이 오히려 더 진실한 판단일 수 있다는 점을 기억하세요. 시험장에서는 지문의 대조 구도를 잡으며 주장 문장을 확인하는 연습을 꼭 해 보세요. 오늘 수고 많았습니다.","hl":null}]}]});</script></body></html>
