  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}

}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 38번","audioDir":"38_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">38번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Psychology as an Evidence-Based Science\u003c/h1>\u003ch2>증거 기반 과학으로서의 심리학\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: 심리학은 사회에 떠도는 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">통념\u003c/b>이 아니라 \u003cb class=\"key\">증거\u003c/b>에 기반하여 인간을 이해하는 \u003cb class=\"key\">과학\u003c/b>이며, \u003cb class=\"key\">문화적·사회적 \u003c/b>\u003cb class=\"key\">다양성\u003c/b>과 모든 인간이 \u003cb class=\"key\">공유\u003c/b>하는 \u003cb class=\"key\">근본 \u003c/b>\u003cb class=\"key\">과정\u003c/b>과 \u003cb class=\"key\">원리\u003c/b>를 다룬다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Psychology is a science that relies on evidence to understand people and deals with fundamental processes and principles underlying both human diversity and what all humans share.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 분석할 지문은 심리학이 단순한 통념이 아니라 증거에 기반한 과학이라는 내용입니다. 요지는 psychology is a science that relies on evidence to understand people 입니다. 요약하면 심리학은 증거로 인간을 이해하는 과학이며, 문화적 사회적 다양성과 인간 보편성의 원리를 다룬다는 것이에요. 이제 본문을 함께 볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">사람들은 흔히 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">본성\u003c/b>에 대해 나름의 생각을 갖고 있지만, 이는 검증되지 않은 \u003cb class=\"key\">가정\u003c/b>과 이야기가 섞인 경우가 많다. 심리학(psychology)은 이런 상식을 넘어 과학적 방법(scientific method)으로 인간을 이해한다. 일상에서 “첫인상이 정확하다”는 속설이 있어도 심리학은 실험과 관찰로 실제 그러한지 \u003cb class=\"key\">증거\u003c/b>를 확인한다. 마치 여름 날씨를 속설로 예측하는 것과 기상청이 관측 데이터(data)로 예보하는 것의 차이와 비슷하다. 심리학은 기본 과정과 원리로 인간의 문화적 다양성과 모든 인간이 공유하는 특성을 설명한다.\u003c/div>","segs":[{"n":2,"text":"여러분, 심리학 하면 어떤 이미지가 떠오르죠? 흔히 사람들은 인간 본성에 대해 나름의 생각을 갖고 있지만, 이는 검증되지 않은 가정과 이야기가 섞인 경우가 많아요. 심리학 psychology는 이런 상식을 넘어 과학적 방법 scientific method으로 인간을 이해하는 학문입니다. 예를 들어 일상에서 첫인상이 정확하다는 속설이 있어도 심리학은 실험과 관찰로 실제 그러한지 증거를 확인하죠. 마치 여름 날씨를 속설로 예측하는 것과 기상청이 관측 데이터 data로 예보하는 것의 차이와 비슷합니다. 그래서 심리학은 기본 과정과 원리로 인간의 문화적 다양성과 모든 인간이 공유하는 특성을 설명해요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>흔한 통념의 문제\u003csmall>도입·전환 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>첫 문장은 사회에 떠도는 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">본성\u003c/b>에 대한 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">설명\u003c/b>이 가정과 이야기, 때로는 어리석음의 혼합이라고 말한다. 둘째 문장은 그러나 \u003cb class=\"key\">심리학\u003c/b>은 다르다고 전환한다. 이처럼 일반 상식과 심리학을 구분하며 논의를 연다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>과학으로서의 정의\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>셋째 문장은 심리학을 사람들의 행동, 지각, 상호 작용을 이해하는 데 전념하는 \u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">분야\u003c/b>로 정의한다. 넷째 문장은 핵심어가 \u003cb class=\"key\">과학\u003c/b>이라고 강조한다. 심리학이 단순한 이야기가 아니라 \u003cb class=\"key\">과학\u003c/b>임을 주장하는 단계이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>증거 기반 접근\u003csmall>근거 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>다섯째 문장은 심리학자들이 의견이나 소문, 사회의 일반적 견해, 심오한 사상가들의 숙고된 의견에 의존하지 않는다고 말한다. 여섯째 문장은 대신 \u003cb class=\"key\">증거\u003c/b>를 찾아 심리학적 개념이 \u003cb class=\"key\">확고하게 \u003c/b>\u003cb class=\"key\">기반\u003c/b>을 두도록 한다고 설명한다. 즉 \u003cb class=\"key\">증거 \u003c/b>\u003cb class=\"key\">기반 \u003c/b>\u003cb class=\"key\">접근\u003c/b>이 심리학의 방법임을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>보편성과 다양성\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>일곱째 문장은 심리학이 \u003cb class=\"key\">근본적인 \u003c/b>\u003cb class=\"key\">과정\u003c/b>과 \u003cb class=\"key\">원리\u003c/b>를 다루며, 이것이 문화적·사회적 다양성과 모든 인간이 공유하는 특성을 만들어 낸다고 설명한다. 여덟째 문장은 이것들이 바로 \u003cb class=\"key\">현대 \u003c/b>\u003cb class=\"key\">심리학\u003c/b>의 핵심이라고 결론짓는다. 이처럼 심리학은 증거 기반으로 인간의 보편성과 다양성을 모두 아우른다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 흔한 통념과 심리학을 대조하면서 심리학이 증거 기반 과학임을 보여 주는 흐름입니다.","hl":null},{"n":4,"text":"첫 번째 문장과 두 번째 문장에서는 사회에 떠도는 인간 본성에 대한 흔한 설명이 가정과 이야기, 어리석음의 혼합이라고 말해요. 그런데 그러나, 심리학은 다르다고 전환하죠. 이렇게 일반 상식과 심리학을 구분하면서 글을 시작합니다.","hl":"f0"},{"n":5,"text":"세 번째 문장은 심리학이 사람들의 행동과 상호 작용을 이해하는 데 전념하는 과학 분야라고 정의해요. 네 번째 문장에서 핵심어는 science라고 강조합니다. 심리학이 단순한 이야기가 아니라 과학이라는 주장이 이 부분에서 나옵니다.","hl":"f1"},{"n":6,"text":"다섯 번째 문장은 심리학자들이 의견이나 소문, 사회의 일반적인 견해, 사상가들의 숙고된 의견에 의존하지 않는다고 말해요. 여섯 번째 문장에서는 대신 evidence를 찾아 심리학적 개념이 확고하게 기반을 두도록 한다고 해요. 이 부분이 바로 증거 기반 접근의 핵심입니다.","hl":"f2"},{"n":7,"text":"일곱 번째 문장은 심리학이 근본적인 과정과 원리를 다루며, 이것이 문화적 사회적 다양성과 모든 인간이 공유하는 특성을 만들어 낸다고 설명해요. 여덟 번째 문장은 이것들이 현대 심리학의 핵심이라고 결론짓습니다. 이처럼 심리학은 증거 기반으로 인간의 보편성과 다양성을 모두 아우른다는 말로 마무리되죠.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">통념\u003c/b>을 제시하고, 두 번째 문장의 \u003cb class=\"key\">However\u003c/b>로 전환한 뒤 심리학이 \u003cb class=\"key\">과학\u003c/b>이라고 주장하므로 통념-반박 구조이다. 핵심 주장이 글 앞부분인 세 번째 문장에서 제시되어 \u003cb class=\"key\">두괄식\u003c/b>이다. 이후 다섯 번째와 여섯 번째 문장에서 \u003cb class=\"key\">증거\u003c/b>를 근거로 통념과 대비하고, 일곱 번째와 여덟 번째 문장에서 심리학의 연구 대상을 확장한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (2)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>The key word here is science (4)\u003c/b>\u003cspan>강조\u003c/span>\u003cb>Instead (6)\u003c/b>\u003cspan>대조·반박\u003c/span>\u003cb>In addition to (7)\u003c/b>\u003cspan>추가\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">common accounts of human nature\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">opinions and hearsay\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">generally accepted views of society\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">considered opinions of deep thinkers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">generally held beliefs or assumptions\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>흔한 통념·일반적 견해\u003c/th>\u003cth>심리학(과학)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>사회에 떠도는 가정·이야기·어리석음의 혼합\u003c/td>\u003ctd>사람을 이해하는 과학 분야\u003c/td>\u003c/tr>\u003ctr>\u003ctd>의견·소문·일반적 견해에 의존\u003c/td>\u003ctd>증거를 찾아 확고하게 기반\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일반적으로 받아들여지는 신념·가정에서 도출\u003c/td>\u003ctd>근본 과정과 원리를 다룸\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 통념과 반박이에요. 먼저 흔한 통념을 제시하고, However로 전환해서 심리학이 과학이라고 반박하죠. 핵심 주장이 글 앞부분인 세 번째 문장에서 제시되므로 두괄식 구조로 볼 수 있어요.","hl":"ty"},{"n":9,"text":"신호어도 중요한데요, 두 번째 문장의 However는 통념에서 심리학으로 전환을 알려 주고, 네 번째 문장에서 The key word here is science라고 강조해요. 여섯 번째 문장의 Instead는 의견이 아니라 증거라는 대조를 보여 주고, 일곱 번째 문장의 In addition to는 증거 기반 접근에 더해 심리학의 연구 대상을 추가해요. 또 common accounts of human nature, opinions and hearsay, generally accepted views, generally held beliefs는 모두 증거가 아닌 통념을 바꿔 말한 표현들입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>account\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설명, 기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>human nature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인간 본성\u003c/span>\u003c/div>\u003cdiv>\u003cb>float around\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>떠돌다, 퍼지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mixture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>혼합\u003c/span>\u003c/div>\u003cdiv>\u003cb>assumption\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가정, 추정\u003c/span>\u003c/div>\u003cdiv>\u003cb>tale\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이야기\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>branch\u003c/b>\u003cem>명사\u003c/em>\u003cspan>분야, 가지\u003c/span>\u003c/div>\u003cdiv>\u003cb>science\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과학\u003c/span>\u003c/div>\u003cdiv>\u003cb>be devoted to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 전념하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>interact\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상호 작용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>key\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>핵심의, 중요한\u003c/span>\u003c/div>\u003cdiv>\u003cb>depend on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 의존하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opinion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의견\u003c/span>\u003c/div>\u003cdiv>\u003cb>hearsay\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소문, 풍문\u003c/span>\u003c/div>\u003cdiv>\u003cb>accepted\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>받아들여진, 통용되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>view\u003c/b>\u003cem>명사\u003c/em>\u003cspan>견해\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead\u003c/b>\u003cem>부사\u003c/em>\u003cspan>대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>evidence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>증거\u003c/span>\u003c/div>\u003cdiv>\u003cb>derive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>도출하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>belief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신념\u003c/span>\u003c/div>\u003cdiv>\u003cb>in addition to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 더하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>evidence-based\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>증거 기반의\u003c/span>\u003c/div>\u003cdiv>\u003cb>approach\u003c/b>\u003cem>명사\u003c/em>\u003cspan>접근법\u003c/span>\u003c/div>\u003cdiv>\u003cb>fundamental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>근본적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>process\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과정\u003c/span>\u003c/div>\u003cdiv>\u003cb>principle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원리\u003c/span>\u003c/div>\u003cdiv>\u003cb>generate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>만들어 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>diversity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다양성\u003c/span>\u003c/div>\u003cdiv>\u003cb>shared\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공유된\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"어휘를 몇 개 짚어 볼게요. account는 설명이나 기술이라는 뜻이고, assumption은 가정, evidence는 증거, diversity는 다양성입니다. depend on은 의존하다, in addition to는 게다가 또는 에 더하여라는 뜻으로 시험에 자주 나와요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">evidence\u003c/b>\u003cspan class=\"m\">증거\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">proof\u003c/span>\u003cspan class=\"s\">data\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">assumption\u003c/span>\u003cspan class=\"a\">hearsay\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fundamental\u003c/b>\u003cspan class=\"m\">근본적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">basic\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">secondary\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">diversity\u003c/b>\u003cspan class=\"m\">다양성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">variety\u003c/span>\u003cspan class=\"s\">range\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">uniformity\u003c/span>\u003cspan class=\"a\">sameness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">shared\u003c/b>\u003cspan class=\"m\">공유된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"s\">collective\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">individual\u003c/span>\u003cspan class=\"a\">unique\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">accepted\u003c/b>\u003cspan class=\"m\">받아들여진\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">established\u003c/span>\u003cspan class=\"s\">recognized\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rejected\u003c/span>\u003cspan class=\"a\">controversial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">derive\u003c/b>\u003cspan class=\"m\">도출하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"s\">originate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">create\u003c/span>\u003cspan class=\"a\">invent\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 정리해 둘게요. evidence는 proof나 data와 비슷하고, assumption이나 hearsay와 반대되는 성격이에요. fundamental은 basic, essential과 비슷하고 secondary나 trivial과 반대예요. diversity는 variety, range와 비슷하고 uniformity나 sameness와 반대입니다. shared는 common, collective와 비슷하고 individual이나 unique와 반대예요. accepted는 established, recognized와 비슷하고 rejected, controversial과 반대입니다. derive는 obtain, originate과 비슷하고 create, invent와 반대 방향이에요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간 본성에 대한 흔한 설명\u003c/span>\u003cspan class=\"en\">The common accounts of human nature\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회에 떠도는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">float \u003c/span>\u003cspan class=\"tgt\">around \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">society\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반적으로 혼합이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">generally \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">mixture\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가정, 이야기\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">assumptions, \u003c/span>\u003cspan class=\"tgt\">tales \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 때로는 순전한 어리석음\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">sometimes \u003c/span>\u003cspan class=\"tgt\">plain \u003c/span>\u003cspan class=\"tgt\">silliness\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">사회에 떠도는 인간 본성에 대한 흔한 설명은 일반적으로 가정, 이야기, 그리고 때로는 순전한 어리석음의 혼합이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 사회에 떠도는 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">설명\u003c/b>이 실제로는 \u003cb class=\"key\">가정\u003c/b>이나 \u003cb class=\"key\">이야기\u003c/b>, 순전한 어리석음이 섞인 것이라고 말한다. 인간 본성에 대한 막연한 통념을 부정적으로 보여 주며, 다음 문장에서 심리학이 다르다는 대조를 이끌어 내는 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 + that + 동사 + 수식어 : \"사회에 떠도는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 + 명사 보어\u003c/span> : 주어 + be동사 + 명사 보어 : \"일반적으로 혼합이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 of + 등위 병렬\u003c/span> : of + [A, B and C] : \"가정, 이야기 그리고 때로는 순전한 어리석음의\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"The common accounts of human nature, 인간 본성에 대한 흔한 설명. that float around in society, 사회에 떠도는. are generally a mixture, 일반적으로 혼합이다. of assumptions, tales, 가정, 이야기. and sometimes plain silliness, 그리고 때로는 순전한 어리석음. 이 문장 전체를 해석하면, 사회에 떠도는 인간 본성에 대한 흔한 설명은 일반적으로 가정, 이야기, 그리고 때로는 순전한 어리석음의 혼합이다.","hl":"m"},{"n":13,"text":"이 문장은 흔한 설명이 사회에 떠돌지만 그 실체는 가정이나 이야기, 때로는 순전한 어리석음이 섞여 있다는 걸 지적하고 있어요. 여기서 말하는 흔한 설명은 증거 없이 믿는 가정과 같은 것들이죠. 뒤에서 심리학이 과학으로서 이와 다르다는 이야기를 끌어내는 역할을 해요.","hl":"mn"},{"n":14,"text":"첫 번째, that float around in society에서 that은 선행사 The common accounts를 수식하는 주격 관계대명사예요. 관계대명사절이 선행사 바로 뒤에서 사회에 떠도는 이라는 뜻을 덧붙여 줘요. 두 번째, are generally a mixture는 be동사 뒤에 명사 보어가 온 이형식 문장으로, 주어가 무엇인지 설명해 줘요. 세 번째, of assumptions, tales and sometimes plain silliness에서는 of 뒤에 명사구 세 개가 병렬되어 있어요. 여기서 plain은 순전한이라는 뜻으로 silliness를 강조하죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심리학은 다르다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">psychology \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">different\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나, 심리학은 다르다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장과 대조하며 \u003cb class=\"key\">심리학\u003c/b>은 사회에 떠도는 그런 설명과 \u003cb class=\"key\">다르다\u003c/b>는 전환점을 제시한다. 이후 문장들이 그 다른 이유를 \u003cb class=\"key\">과학\u003c/b>이라는 근거로 설명하도록 이어 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속부사 However + 2형식 문장\u003c/span> : However + S + be동사 + 형용사 보어 : \"그러나, 심리학은 다르다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"However, 그러나. psychology is different, 심리학은 다르다. 이 문장 전체를 해석하면, 그러나, 심리학은 다르다.","hl":"m"},{"n":16,"text":"이 문장은 앞에서 말한 인간 본성에 대한 흔한 설명과 대조하면서 심리학은 다르다고 전환점을 만들어요. 이후에 심리학이 과학이라는 근거를 제시할 수 있도록 짧게 길을 열어 주는 문장이에요.","hl":"mn"},{"n":17,"text":"However는 앞 문장과 반대 방향으로 이어 주는 접속부사예요. psychology is different는 주어 psychology에 대해 be동사 is와 형용사 different가 연결된 이형식 문장이에요. 앞의 흔한 설명과 심리학이 다르다는 대조를 만들어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 과학 분야이다\u003c/span>\u003cspan class=\"en\">It is the branch of science\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들을 이해하는 데 전념하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">devoted \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understanding \u003c/span>\u003cspan class=\"tgt\">people\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 어떻게 그리고 왜 행동하는 대로 행동하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">act \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">do; \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 왜 보는 대로 사물을 보는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">things \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">do; \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 우리가 어떻게 서로 상호 작용하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">interact \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">another\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 사람들을 이해하는, 즉 우리가 어떻게 그리고 왜 행동하는 대로 행동하는지, 우리가 왜 보는 대로 사물을 보는지, 그리고 우리가 어떻게 서로 상호 작용하는지를 이해하는 데 전념하는 과학 분야이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심리학을 사람을 이해하는 \u003cb class=\"key\">과학 \u003c/b>\u003cb class=\"key\">분야\u003c/b>로 정의한다. 특히 우리의 행동, 인식, 상호 작용의 방식을 이해하는 데 \u003cb class=\"key\">전념\u003c/b>한다는 점을 구체적으로 나열하여 심리학의 연구 대상을 보여 준다. 여기서 to가 전치사로 쓰여 뒤에 \u003cb class=\"key\">동명사\u003c/b> understanding이 온다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that + be devoted to -ing\u003c/span> : 선행사 + that + be devoted to + 동명사구 : \"사람들을 이해하는 데 전념하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문의 병렬\u003c/span> : 의문사절 A; 의문사절 B; and 의문사절 C : \"우리가 어떻게 그리고 왜 행동하는 대로 행동하는지, 우리가 왜 보는 대로 사물을 보는지, 그리고 우리가 어떻게 서로 상호 작용하는지\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"It is the branch of science, 그것은 과학 분야이다. that is devoted to understanding people, 사람들을 이해하는 데 전념하는. how and why we act as we do, 우리가 어떻게 그리고 왜 행동하는 대로 행동하는지. why we see things as we do, 우리가 왜 보는 대로 사물을 보는지. and how we interact with one another, 그리고 우리가 어떻게 서로 상호 작용하는지. 이 문장 전체를 해석하면, 그것은 사람들을 이해하는, 즉 우리가 어떻게 그리고 왜 행동하는 대로 행동하는지, 우리가 왜 보는 대로 사물을 보는지, 그리고 우리가 어떻게 서로 상호 작용하는지를 이해하는 데 전념하는 과학 분야이다.","hl":"m"},{"n":19,"text":"이 문장은 심리학을 사람을 이해하는 과학 분야로 정의해요. 우리가 어떻게 행동하고, 왜 그렇게 보며, 서로 어떻게 상호 작용하는지를 이해하는 데 전념한다는 구체적인 연구 대상을 나열하고 있죠. 이 정의가 바로 현대 심리학의 핵심을 소개하는 서술형 핵심 문장이에요.","hl":"mn"},{"n":20,"text":"첫 번째, that is devoted to understanding people에서 that은 선행사 the branch of science를 받는 주격 관계대명사예요. be devoted to는 전념하다는 뜻인데, 여기서 to는 전치사라서 뒤에 동명사 understanding이 왔어요. 두 번째, 콜론 뒤에 how and why we act as we do, why we see things as we do, and how we interact with one another는 세 개의 간접의문문이 병렬된 구조예요. 간접의문문은 의문사 뒤에 주어와 동사가 오는 어순이어서 평서문처럼 말해요. 이 병렬이 심리학이 이해하려는 대상을 구체적으로 나열해 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여기서 핵심어는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">key \u003c/span>\u003cspan class=\"tgt\">word \u003c/span>\u003cspan class=\"tgt\">here \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘과학’이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">'science.'\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여기서 핵심어는 ‘과학’이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 말한 심리학이 \u003cb class=\"key\">과학\u003c/b>이라는 사실을 강조한다. \u003cb class=\"key\">핵심어\u003c/b>는 science이며, 일반적인 가정이나 이야기와 구별되는 기준을 제시한다. 여기서 here는 장소가 아니라 이 논의에서라는 뜻으로 쓰였다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 보어(명사 보어)\u003c/span> : S(The key word here) + V(is) + C('science') : \"여기서 핵심어는 '과학'이다.\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"The key word here, 여기서 핵심어는. is 'science.', ‘과학’이다.. 이 문장 전체를 해석하면, 여기서 핵심어는 ‘과학’이다.","hl":"m"},{"n":22,"text":"이 문장은 심리학이 과학이라는 점을 분명히 해 줘요. 여기서 핵심어는 science이고, 앞에 나온 가정이나 이야기 같은 것과는 다른 증거 기반의 학문이라는 기준을 깔아 주는 역할을 해요.","hl":"mn"},{"n":23,"text":"이 문장에서는 주격 보어를 확인해야 해요. be동사 is 뒤에 나온 science가 주어인 The key word here를 설명하는 명사 보어이기 때문이에요. 이처럼 be동사 뒤에 주어를 풀이하는 명사가 오면 주격 보어라고 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심리학자들은\u003c/span>\u003cspan class=\"en\">Psychologists\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 의존하지 않는다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">depend \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의견과 소문,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">opinions \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">hearsay, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 일반적으로 받아들여지는 견해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">generally \u003c/span>\u003cspan class=\"tgt\">accepted \u003c/span>\u003cspan class=\"tgt\">views \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">당대의 사회에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">society \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">time, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">혹은 심지어 심오한 사상가들의 숙고된 의견\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">considered \u003c/span>\u003cspan class=\"tgt\">opinions \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">deep \u003c/span>\u003cspan class=\"tgt\">thinkers\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심리학자들은 의견과 소문, 혹은 당대의 사회에서 일반적으로 받아들여지는 견해, 혹은 심지어 심오한 사상가들의 숙고된 의견에 의존하지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 심리학자들이 의존하지 않는 대상을 셋으로 나열하며, \u003cb class=\"key\">의견\u003c/b>과 \u003cb class=\"key\">소문\u003c/b>, 당대의 통념, 사상가의 의견까지도 과학적 근거가 될 수 없다는 점을 보여 준다. 일반적으로 받아들여지는 것일수록 오히려 \u003cb class=\"key\">증거\u003c/b>가 필요하다는 흐름으로 이어진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 do의 부정과 전치사 on을 포함한 동사구 depend on\u003c/span> : S + do not + depend on + O : \"~에 의존하지 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">or를 이용한 병렬 구조\u003c/span> : A, or B, or C : \"의견과 소문, 혹은 일반적으로 받아들여지는 견해, 혹은 심오한 사상가들의 숙고된 의견\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법(수동 의미)\u003c/span> : the + generally accepted + views : \"일반적으로 받아들여지는 견해\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Psychologists, 심리학자들은. don't depend on, ~에 의존하지 않는다. opinions and hearsay, 의견과 소문. or the generally accepted views, 혹은 일반적으로 받아들여지는 견해. of society at the time, 당대의 사회에서. or even the considered opinions of deep thinkers, 혹은 심지어 심오한 사상가들의 숙고된 의견. 이 문장 전체를 해석하면, 심리학자들은 의견과 소문, 혹은 당대의 사회에서 일반적으로 받아들여지는 견해, 혹은 심지어 심오한 사상가들의 숙고된 의견에 의존하지 않는다.","hl":"m"},{"n":25,"text":"이 문장은 심리학자들이 의존하지 않는 대상을 구체적으로 나열하고 있어요. 의견이나 소문, 당대 사회에서 일반적으로 받아들여지는 견해, 그리고 깊이 생각하는 사람들의 의견까지도 과학적 근거가 될 수 없다고 선을 긋는 거예요. 결국 심리학은 널리 퍼진 믿음이나 권위 있는 의견보다 더 확실한 것을 요구한다는 뜻이에요.","hl":"mn"},{"n":26,"text":"첫 번째로 don't depend on을 볼게요. 일반동사 depend를 부정할 때 조동사 do를 써서 don't depend on으로 표현해요. depend는 자동사라서 뒤에 목적어를 붙일 때는 전치사 on이 꼭 필요하죠. 두 번째로 the generally accepted views에서 generally accepted가 views를 수식하는 과거분사 구조예요. views가 받아들여지는 수동 의미이기 때문에 accepted를 쓴 거예요. 세 번째로 opinions and hearsay, generally accepted views, considered opinions가 or로 병렬되어 있어요. 이렇게 세 가지를 나열하면서 모두 부정하는 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에 그들은 증거를 찾는다,\u003c/span>\u003cspan class=\"en\">Instead, they look for evidence,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확신하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">sure\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심리학적 개념이 확고하게 기반을 두고 있는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">psychological \u003c/span>\u003cspan class=\"tgt\">ideas \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">firmly \u003c/span>\u003cspan class=\"tgt\">based, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 일반적으로 받아들여지는 신념이나 가정에서 도출된 것이 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">derived\u003c/span> from \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">generally \u003c/span>\u003cspan class=\"tgt\">held \u003c/span>\u003cspan class=\"tgt\">beliefs\u003c/span> or assumptions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신에 그들은 심리학적 개념이 단지 일반적으로 받아들여지는 신념이나 가정에서 도출된 것이 아니라, 확고하게 기반을 두고 있는지 확신하기 위해 증거를 찾는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 심리학자들이 의견 대신 \u003cb class=\"key\">증거\u003c/b>를 찾는 이유를 직접 밝힌다. 심리학적 개념이 \u003cb class=\"key\">확고한 \u003c/b>\u003cb class=\"key\">기반\u003c/b> 위에 있는지, 그저 일반적인 신념이나 가정에서 나온 것이 아닌지를 확인하려는 것이다. 따라서 글의 핵심인 \u003cb class=\"key\">증거 \u003c/b>\u003cb class=\"key\">기반\u003c/b> 접근을 요약하는 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : look for evidence + to make sure + that절 : \"확신하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">make sure + that 명사절\u003c/span> : make sure + [that + S + V] : \"심리학적 개념이 확고하게 기반을 두고 있다는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태 병렬(be + p.p.)\u003c/span> : be + firmly based and not just derived : \"확고하게 기반을 두고 있고 단지 도출된 것이 아닌\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">과거분사의 형용사적 용법\u003c/span> : 부사 generally + p.p. held + 명사 beliefs : \"일반적으로 받아들여지는 신념\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Instead, they look for evidence, 대신에 그들은 증거를 찾는다. to make sure, 확신하기 위해. that psychological ideas are firmly based, 심리학적 개념이 확고하게 기반을 두고 있는지. and not just derived from generally held beliefs or assumptions, 단지 일반적으로 받아들여지는 신념이나 가정에서 도출된 것이 아니라. 이 문장 전체를 해석하면, 대신에 그들은 심리학적 개념이 단지 일반적으로 받아들여지는 신념이나 가정에서 도출된 것이 아니라, 확고하게 기반을 두고 있는지 확신하기 위해 증거를 찾는다.","hl":"m"},{"n":28,"text":"이 문장은 증거 기반 접근의 핵심을 보여 줘요. 심리학자들은 의견이나 소문 대신 증거를 찾는데, 그 이유는 심리학적 개념이 정말로 확고한 기반 위에 있는지, 그냥 흔한 신념이나 가정에서 나온 게 아닌지를 확인하기 위해서예요. 결국 이 문장이 현대 심리학의 과학적 태도를 요약해 주는 문장이에요.","hl":"mn"},{"n":29,"text":"첫 번째로 to make sure는 to부정사의 부사적 용법으로, 앞에 있는 they look for evidence의 목적을 나타내요. 그래서 증거를 찾는 이유가 무엇인지 설명해 주죠. 두 번째로 make sure 뒤에 that절이 오는데, 이 that절은 확신하는 내용을 나타내는 명사절이에요. 세 번째로 psychological ideas are firmly based, and not just derived 부분은 수동태가 병렬된 구조예요. 주어 psychological ideas가 기반이 되고 도출되는 수동의 의미이기 때문에 be동사와 과거분사가 쓰였어요. 네 번째로 generally held beliefs에서 held는 beliefs를 수식하는 과거분사로, 신념이 사람들에 의해 받아들여진다는 수동 의미를 담고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 증거 기반 접근법에 더하여 심리학은 다룬다 근본적인 과정과 원리를 우리의 풍부한 문화적 사회적 다양성을 만들어 내는 뿐만 아니라 그러한 것들을 모든 인간에 의해 공유되는\u003c/span>\u003cspan class=\"en\">In addition to this evidence­based approach, psychology deals with fundamental processes and principles \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">generate \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">rich \u003c/span>\u003cspan class=\"tgt\">cultural \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">social \u003c/span>\u003cspan class=\"tgt\">diversity\u003c/span>, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">those \u003c/span>\u003cspan class=\"tgt\">shared \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">human \u003c/span>\u003cspan class=\"tgt\">beings\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 증거 기반 접근법에 더하여 심리학은 모든 인간에 의해 공유되는 근본적인 과정과 원리뿐만 아니라, 우리의 풍부한 문화적 사회적 다양성을 만들어 내는 것들을 다룬다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞서 말한 증거 기반 접근법에 더해 심리학이 다루는 대상이 무엇인지 설명합니다. \u003cb class=\"key\">as \u003c/b>\u003cb class=\"key\">well \u003c/b>\u003cb class=\"key\">as\u003c/b>는 not only but also처럼 두 대상을 연결하는 표현이며, \u003cb class=\"key\">those\u003c/b>는 앞의 fundamental processes and principles를 가리킵니다. 모든 인간이 공유하는 기본 원리와 문화적·사회적 다양성을 만드는 원리를 모두 다룬다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : 선행사 + that + 동사 : \"우리의 풍부한 문화적 사회적 다양성을 만들어 내는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">as well as + 과거분사(수동)\u003c/span> : as well as + those + shared + by all human beings : \"뿐만 아니라 모든 인간에 의해 공유되는 그것들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">전치사구 (부가)\u003c/span> : In addition to + 명사구 : \"이러한 증거 기반 접근법에 더하여\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"In addition to this evidencebased approach, 이러한 증거 기반 접근법에 더하여. psychology deals with, 심리학은 다룬다. fundamental processes and principles, 근본적인 과정과 원리를. that generate our rich cultural and social diversity, 우리의 풍부한 문화적 사회적 다양성을 만들어 내는. as well as those, 뿐만 아니라 그러한 것들을. shared by all human beings, 모든 인간에 의해 공유되는. 이 문장 전체를 해석하면, 이러한 증거 기반 접근법에 더하여 심리학은 모든 인간에 의해 공유되는 근본적인 과정과 원리뿐만 아니라, 우리의 풍부한 문화적 사회적 다양성을 만들어 내는 것들을 다룬다.","hl":"m"},{"n":31,"text":"이 문장은 증거 기반 접근법에 더해 심리학이 무엇을 다루는지 설명해 줍니다. 모든 인간에게 공유되는 근본적인 과정과 원리, 그리고 우리의 풍부한 문화적 사회적 다양성을 만들어 내는 원리까지 다룬다는 뜻이에요. as well as는 not only but also처럼 추가 대상을 연결하는 표현이고, those는 앞에 나온 근본적인 과정과 원리를 가리킵니다.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 In addition to this evidencebased approach의 In addition to입니다. 이 전치사구는 앞에 나온 증거 기반 접근법에 무엇인가를 더해 준다는 추가 정보의 의미를 나타냅니다. 두 번째는 that generate our rich cultural and social diversity에서 that이 주격 관계대명사로 쓰였다는 점이에요. 선행사 processes and principles를 받아 generate의 주어 역할을 합니다. 세 번째는 as well as those shared by all human beings에서 as well as가 대상을 덧붙이는 말이고, shared by all human beings는 those를 수식하는 과거분사 수동 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것들은\u003c/span>\u003cspan class=\"en\">These are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현대 심리학이 무엇인지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">modern \u003c/span>\u003cspan class=\"tgt\">psychology \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">about\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것들은 현대 심리학이 무엇인지 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 설명한 것들이 바로 현대 심리학의 전부라는 결론을 내립니다. \u003cb class=\"key\">These\u003c/b>는 앞서 언급한 증거 기반 접근법과 근본적인 과정·원리, 문화적·사회적 다양성을 모두 가리킵니다. \u003cb class=\"key\">what \u003c/b>\u003cb class=\"key\">modern \u003c/b>\u003cb class=\"key\">psychology \u003c/b>\u003cb class=\"key\">is \u003c/b>\u003cb class=\"key\">all \u003c/b>\u003cb class=\"key\">about\u003c/b>는 현대 심리학의 본질을 나타내는 표현으로 글을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what절 (보어)\u003c/span> : These are + what + modern psychology + is all about : \"현대 심리학이 무엇에 관한 것인지\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"These are, 이것들은. what modern psychology is all about, 현대 심리학이 무엇인지. 이 문장 전체를 해석하면, 이것들은 현대 심리학이 무엇인지 보여 준다.","hl":"m"},{"n":34,"text":"이 문장은 앞에서 설명한 것들이 바로 현대 심리학의 전부라는 결론을 내려 줍니다. These는 앞서 언급한 증거 기반 접근법과 근본적인 과정과 원리, 문화적 사회적 다양성을 모두 가리켜요. what modern psychology is all about는 현대 심리학이 무엇인지, 즉 그 본질을 뜻하는 표현으로 글을 마무리합니다.","hl":"mn"},{"n":35,"text":"첫 번째 포인트는 what modern psychology is all about의 what절입니다. 이 what은 선행사 포함 관계대명사로 the thing which의 의미를 가져요. are 뒤에서 보어 자리에 쓰인 명사절을 이끌면서 현대 심리학이 무엇에 관한 것인지를 나타냅니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>사회에 떠도는 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">본성\u003c/b>에 대한 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">설명\u003c/b>은 가정과 이야기, 때로는 \u003cb class=\"key\">어리석음\u003c/b>의 혼합이다.\u003c/li>\u003cli>심리학은 사람의 \u003cb class=\"key\">행동\u003c/b>과 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">작용\u003c/b>을 이해하는 데 전념하는 \u003cb class=\"key\">과학\u003c/b> 분야이다.\u003c/li>\u003cli>심리학자들은 \u003cb class=\"key\">의견\u003c/b>이나 \u003cb class=\"key\">소문\u003c/b>에 의존하지 않고 \u003cb class=\"key\">증거\u003c/b>를 찾아 개념을 확고하게 기반을 둔다.\u003c/li>\u003cli>심리학은 \u003cb class=\"key\">근본적인 \u003c/b>\u003cb class=\"key\">과정\u003c/b>과 \u003cb class=\"key\">원리\u003c/b>를 다루며, 이것들은 \u003cb class=\"key\">현대 \u003c/b>\u003cb class=\"key\">심리학\u003c/b>의 핵심이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Psychology is a science that relies on evidence to understand people and deals with fundamental processes and principles underlying both human diversity and what all humans share.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: 심리학은 사회에 떠도는 \u003cb class=\"key\">흔한 \u003c/b>\u003cb class=\"key\">통념\u003c/b>이 아니라 \u003cb class=\"key\">증거\u003c/b>에 기반하여 인간을 이해하는 \u003cb class=\"key\">과학\u003c/b>이며, \u003cb class=\"key\">문화적·사회적 \u003c/b>\u003cb class=\"key\">다양성\u003c/b>과 모든 인간이 \u003cb class=\"key\">공유\u003c/b>하는 \u003cb class=\"key\">근본 \u003c/b>\u003cb class=\"key\">과정\u003c/b>과 \u003cb class=\"key\">원리\u003c/b>를 다룬다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"정리하면, 이 지문은 흔한 통념과 달리 심리학은 증거를 찾는 과학이며, 인간의 보편성과 문화적 사회적 다양성을 만드는 근본 원리를 다룬다는 내용입니다. evidence라는 단어가 글의 중심을 잡아 주는 핵심어이니 꼭 기억하세요. 오늘 분석은 여기까지입니다. 수고했어요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
