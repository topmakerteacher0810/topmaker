</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 37번","audioDir":"37_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">37번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Depression as a Disease of Consciousness\u003c/h1>\u003ch2>의식의 질환으로서의 우울증\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>전통적 \u003cb class=\"key\">신경전달물질 \u003c/b>\u003cb class=\"key\">불균형\u003c/b>설은 원인과 결과가 뒤집힌 설명이며, 우울증은 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">왜곡\u003c/b>에서 비롯된 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">질환\u003c/b>으로 봐야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Depression should be reframed as a disease of consciousness, not as a neurotransmitter imbalance.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요. 오늘 다룰 지문은 우울증의 원인에 대한 기존 의학의 통념을 뒤집고, 우울증을 의식의 문제로 재구성하는 글입니다. 요약하면, 뇌 속 신경전달물질 불균형은 우울증의 원인이 아니라 결과이며, 우울증은 의식의 왜곡에서 비롯된 질환이라는 내용이에요. 요지는 depression should be reframed not as a neurotransmitter imbalance but as a disease of consciousness입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우울증의 원인을 설명할 때 기존 의학은 뇌 속 \u003cb class=\"key\">신경전달물질\u003c/b>에 주목했어요. 신경전달물질은 세로토닌(serotonin), 노르아드레날린(noradrenaline)처럼 뉴런 사이에서 신호를 전달하는 물질입니다. 그런데 이 지문은 원인과 결과를 뒤집어, 물질 불균형은 우울증의 결과일 뿐이라고 봅니다. 대신 \u003cb class=\"key\">의식(consciousness)\u003c/b>이라는 더 근본적인 실체를 강조하고, 뇌는 의식의 기관일 뿐이라고 말하죠. 컴퓨터로 치면 하드웨어인 본체보다 사용자 의식이나 운영 방식이 문제라는 비유와 비슷합니다. 그래서 우울증은 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">왜곡\u003c/b>으로 나타나는 질환으로 재구성됩니다.\u003c/div>","segs":[{"n":2,"text":"우울증의 원인을 말할 때 전통 의학은 뇌 속 신경전달물질 neurotransmitter에 주목해 왔어요. 세로토닌 serotonin이나 노르아드레날린 noradrenaline 같은 물질이 뉴런 사이에서 신호를 전달하는데, 이 균형이 깨지면 우울증이 생긴다고 본 거죠. 그런데 이 지문은 원인과 결과를 뒤집어서, 이런 물질 불균형이 우울증의 결과일 뿐이라고 말합니다. 대신 의식 consciousness이라는 더 근본적인 실체를 강조하고, 뇌는 의식의 기관 organ일 뿐이라고 말하죠. 컴퓨터로 치면 본체 같은 하드웨어보다 사용자의 의식이나 운영 방식이 문제라는 비유와 비슷해요. 그래서 우울증을 의식의 왜곡이라는 질환으로 재구성하게 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>통념: 신경전달물질 불균형\u003csmall>통념 · 문장 1\u003c/small>\u003c/h4>\u003cp>전통 의학은 우울증이 뇌의 \u003cb class=\"key\">신경전달물질\u003c/b> 불균형 때문에 생긴다고 오랫동안 믿어 왔습니다. 이는 우울증을 뇌 속 물질 상태의 문제로 보는 입장입니다. 첫 번째 문장에서 conventional medicine이 그 주체로 등장합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>반박: 원인과 결과의 역전\u003csmall>반박 · 문장 2–4\u003c/small>\u003c/h4>\u003cp>그러나 이 설명에는 중대한 문제가 있습니다. 뇌 속 물질 불균형은 우울증의 원인이 아니라 \u003cb class=\"key\">결과\u003c/b>입니다. 다시 말해 우울증이 세로토닌과 노르아드레날린 같은 뇌 물질의 \u003cb class=\"key\">감소\u003c/b>를 유발하지, 그 반대가 아닙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>주장: 의식의 문제로 재구성\u003csmall>주장 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>수정된 인과 관계의 핵심은 우울증을 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">문제\u003c/b>로 재구성하는 것입니다. 의식은 뇌 기능을 넘어서는 더 \u003cb class=\"key\">근본적인 \u003c/b>\u003cb class=\"key\">실체\u003c/b>입니다. 뇌는 의식의 기관에 지나지 않습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>결론: 의식의 왜곡과 우울증\u003csmall>결론 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>우울증의 근본 원인은 \u003cb class=\"key\">자아감과 \u003c/b>\u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">의미\u003c/b>를 상실한 의식 상태의 왜곡입니다. 이러한 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">질환\u003c/b>이 우울증의 형태로 나타날 수 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 통념 제시, 반박, 의식 문제로의 재구성, 결론의 네 단계로 흐릅니다.","hl":null},{"n":4,"text":"첫 번째 문장에서 전통 의학은 우울증이 뇌의 신경전달물질 neurotransmitter 불균형 때문에 생긴다고 오랫동안 믿어 왔다고 말합니다. 이건 우울증을 뇌 속 물질 상태의 문제로 보는 기존 통념이에요. 이 단계는 글의 도입에서 반박할 대상을 제시하는 역할을 합니다.","hl":"f0"},{"n":5,"text":"그런데 두 번째 문장에서 However로 이 설명에 중대한 문제가 있다고 전환합니다. 세 번째와 네 번째 문장은 그 이유를 설명하는데, 뇌 속 물질 불균형은 우울증의 원인이 아니라 결과라는 거죠. 다시 말해서 우울증이 세로토닌 serotonin이나 노르아드레날린 noradrenaline 같은 뇌 물질의 감소를 유발하지, 뇌 물질 감소가 우울증을 유발하는 게 아니에요. 이렇게 원인과 결과가 뒤집힌 점이 핵심 반박입니다.","hl":"f1"},{"n":6,"text":"다섯 번째 문장에서 이 수정된 인과 관계의 핵심은 우울증을 의식의 문제로 재구성하는 것이라고 주장합니다. 여섯 번째 문장은 의식이 뇌의 기능을 넘어서는 더 근본적인 실체라고 말하고, 일곱 번째 문장은 뇌는 의식의 기관에 지나지 않는다고 못박죠. 이 부분은 주장을 뒷받침하는 근거에 해당합니다.","hl":"f2"},{"n":7,"text":"여덟 번째 문장은 우울증의 근본 원인이 자아감 sense of self과 삶의 의미 meaning of life를 상실한 의식 상태의 왜곡이라고 설명합니다. 아홉 번째 문장은 그러한 의식의 질환이 우울증의 형태로 나타날 수 있다고 결론을 내립니다. 이렇게 글은 의식의 왜곡이라는 새로운 틀로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 기존 의학의 통념을 제시한 뒤 However로 반박하고, \u003cb class=\"key\">수정된 \u003c/b>\u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 거쳐 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">문제\u003c/b>라는 새로운 주장을 펼칩니다. 주제문은 다섯 번째 문장에 있으며, 앞부분은 반박할 대상이고 뒷부분은 주제를 뒷받침하는 근거와 결론입니다. 따라서 \u003cb class=\"key\">통념-반박\u003c/b> 전개에 해당하고 구조상으로는 주제문이 중간에 있는 \u003cb class=\"key\">중괄식\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>However (2)\u003c/b>\u003cspan>반전 및 문제 제기\u003c/span>\u003cb>This is because (3)\u003c/b>\u003cspan>이유 설명\u003c/span>\u003cb>In other words (4)\u003c/b>\u003cspan>재진술\u003c/span>\u003cb>In this revised cause-and-effect (5)\u003c/b>\u003cspan>전환 및 주장\u003c/span>\u003cb>If it is not consciousness itself (8)\u003c/b>\u003cspan>조건 강조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">an imbalance of neurotransmitters in the brain\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">imbalance of substances in the brain\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a decrease in brain substances\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a problem of consciousness\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a disease of consciousness\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>기존 통념: 신경전달물질 불균형\u003c/th>\u003cth>수정된 관점: 의식의 왜곡\u003c/th>\u003c/tr>\u003ctr>\u003ctd>뇌 속 신경전달물질 불균형을 원인으로 봄\u003c/td>\u003ctd>의식의 왜곡을 근본 원인으로 봄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>뇌 물질 감소가 우울증을 유발\u003c/td>\u003ctd>우울증이 뇌 물질 감소를 유발\u003c/td>\u003c/tr>\u003ctr>\u003ctd>뇌를 물질적 기관으로만 봄\u003c/td>\u003ctd>뇌를 의식의 기관으로 봄\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전개 방식이 통념-반박입니다. 첫 부분에서 기존 의학의 통념을 제시하고, However 이후에 원인과 결과를 뒤집으며 반박한 뒤, 의식의 문제라는 새로운 주장을 펼치죠. 구조는 주제문이 다섯 번째 문장에 있는 중괄식으로 볼 수 있어요. 앞부분은 반박할 통념이고 뒷부분은 주제문을 뒷받침하는 근거와 결론입니다.","hl":"ty"},{"n":9,"text":"신호어를 보면, 두 번째 문장의 However가 통념에서 반박으로 전환을 알려 줍니다. 세 번째 문장의 This is because는 이유를 설명하고, 네 번째 문장의 In other words는 앞의 반박을 재진술해 주죠. 다섯 번째 문장의 In this revised cause-and-effect는 수정된 인과 관계로 넘어가는 전환 신호입니다. 또한 brain substances와 consciousness 같은 표현이 반복되면서 개념이 바뀌어 가는 걸 잡아야 해요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>conventional\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전통적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>depression\u003c/b>\u003cem>명사\u003c/em>\u003cspan>우울증\u003c/span>\u003c/div>\u003cdiv>\u003cb>be caused by\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 의해 유발되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>imbalance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불균형\u003c/span>\u003c/div>\u003cdiv>\u003cb>neurotransmitter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신경전달물질\u003c/span>\u003c/div>\u003cdiv>\u003cb>brain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뇌\u003c/span>\u003c/div>\u003cdiv>\u003cb>however\u003c/b>\u003cem>부사\u003c/em>\u003cspan>그러나\u003c/span>\u003c/div>\u003cdiv>\u003cb>explanation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>설명\u003c/span>\u003c/div>\u003cdiv>\u003cb>substance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물질\u003c/span>\u003c/div>\u003cdiv>\u003cb>consequence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결과\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원인\u003c/span>\u003c/div>\u003cdiv>\u003cb>in other words\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>다시 말해서\u003c/span>\u003c/div>\u003cdiv>\u003cb>decrease\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감소\u003c/span>\u003c/div>\u003cdiv>\u003cb>serotonin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세로토닌\u003c/span>\u003c/div>\u003cdiv>\u003cb>noradrenaline\u003c/b>\u003cem>명사\u003c/em>\u003cspan>노르아드레날린\u003c/span>\u003c/div>\u003cdiv>\u003cb>revised\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>수정된\u003c/span>\u003c/div>\u003cdiv>\u003cb>cause-and-effect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인과 관계\u003c/span>\u003c/div>\u003cdiv>\u003cb>key\u003c/b>\u003cem>명사\u003c/em>\u003cspan>핵심\u003c/span>\u003c/div>\u003cdiv>\u003cb>reframe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재구성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>consciousness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의식\u003c/span>\u003c/div>\u003cdiv>\u003cb>fundamental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>근본적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>entity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실체\u003c/span>\u003c/div>\u003cdiv>\u003cb>go beyond\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 넘어서다\u003c/span>\u003c/div>\u003cdiv>\u003cb>organ\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기관\u003c/span>\u003c/div>\u003cdiv>\u003cb>root cause\u003c/b>\u003cem>명사\u003c/em>\u003cspan>근본 원인\u003c/span>\u003c/div>\u003cdiv>\u003cb>distortion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>왜곡\u003c/span>\u003c/div>\u003cdiv>\u003cb>sense of self\u003c/b>\u003cem>명사구\u003c/em>\u003cspan>자아감\u003c/span>\u003c/div>\u003cdiv>\u003cb>meaning of life\u003c/b>\u003cem>명사구\u003c/em>\u003cspan>삶의 의미\u003c/span>\u003c/div>\u003cdiv>\u003cb>manifest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>명백히 나타나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the form of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 형태로\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번 지문에서 중요한 단어를 몇 개 짚어 볼게요. conventional은 전통적인, imbalance는 불균형, consequence는 결과, cause는 원인이라는 뜻이에요. reframe은 재구성하다, consciousness는 의식, distortion은 왜곡이라는 뜻으로 주제와 직결됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">conventional\u003c/b>\u003cspan class=\"m\">전통적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">traditional\u003c/span>\u003cspan class=\"s\">orthodox\u003c/span>\u003cspan class=\"s\">standard\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unconventional\u003c/span>\u003cspan class=\"a\">alternative\u003c/span>\u003cspan class=\"a\">innovative\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cause\u003c/b>\u003cspan class=\"m\">원인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reason\u003c/span>\u003cspan class=\"s\">source\u003c/span>\u003cspan class=\"s\">origin\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">effect\u003c/span>\u003cspan class=\"a\">result\u003c/span>\u003cspan class=\"a\">consequence\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consequence\u003c/b>\u003cspan class=\"m\">결과\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">result\u003c/span>\u003cspan class=\"s\">outcome\u003c/span>\u003cspan class=\"s\">effect\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">cause\u003c/span>\u003cspan class=\"a\">origin\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fundamental\u003c/b>\u003cspan class=\"m\">근본적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">basic\u003c/span>\u003cspan class=\"s\">essential\u003c/span>\u003cspan class=\"s\">primary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">secondary\u003c/span>\u003cspan class=\"a\">superficial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distortion\u003c/b>\u003cspan class=\"m\">왜곡\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">misrepresentation\u003c/span>\u003cspan class=\"s\">perversion\u003c/span>\u003cspan class=\"s\">deformation\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accuracy\u003c/span>\u003cspan class=\"a\">truth\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">manifest\u003c/b>\u003cspan class=\"m\">명백히 나타나다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reveal\u003c/span>\u003cspan class=\"s\">display\u003c/span>\u003cspan class=\"s\">demonstrate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">consciousness\u003c/b>\u003cspan class=\"m\">의식\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">awareness\u003c/span>\u003cspan class=\"s\">perception\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unconsciousness\u003c/span>\u003cspan class=\"a\">unawareness\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 정리해 둡시다. cause는 reason, source와 동의어이고 effect, result와 반의어예요. consequence는 result, outcome과 동의어이고 cause와 반대입니다. conventional은 traditional, orthodox와 동의어이고 unconventional과 반대되죠. fundamental은 basic, essential과 동의어이고 secondary와 반대입니다. distortion은 misrepresentation과 동의어이고 accuracy와 반대이며, manifest는 reveal, display와 동의어이고 conceal과 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전통적인 의학은\u003c/span>\u003cspan class=\"en\">Conventional medicine\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오랫동안 믿어 왔다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">believed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우울증이 발생한다는 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">depression \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">caused\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신경 전달 물질의 불균형에 의해\u003c/span>\u003cspan class=\"en\">by an imbalance of neurotransmitters\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌에서\u003c/span>\u003cspan class=\"en\">in the brain.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전통적인 의학은 우울증이 뇌의 신경 전달 물질의 불균형으로 인해 발생한다고 오랫동안 믿어 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전통 의학이 우울증의 원인을 \u003cb class=\"key\">뇌 \u003c/b>\u003cb class=\"key\">속 \u003c/b>\u003cb class=\"key\">신경 \u003c/b>\u003cb class=\"key\">전달 \u003c/b>\u003cb class=\"key\">물질의 \u003c/b>\u003cb class=\"key\">불균형\u003c/b>으로 보았다는 기존 통념을 제시한다. 글의 첫 문장으로서 뒤에서 반박할 대상을 깔아 주는 역할을 한다. 쉽게 말해, 예전부터 내려온 의학적 가설을 먼저 소개한 것이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 (have/has + 과거분사)\u003c/span> : has + long + believed(과거분사) : \"오랫동안 믿어 왔다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : believed + [that + S + V] : \"우울증이 발생한다는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태 (be + p.p.)\u003c/span> : be + caused(과거분사) + by + 행위자 : \"발생한다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Conventional medicine, 전통적인 의학은. has long believed, 오랫동안 믿어 왔다. that depression is caused, 우울증이 발생한다는 것을. by an imbalance of neurotransmitters, 신경 전달 물질의 불균형에 의해. in the brain, 뇌에서. 이 문장 전체를 해석하면, 전통적인 의학은 우울증이 뇌의 신경 전달 물질의 불균형으로 인해 발생한다고 오랫동안 믿어 왔다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 전통적인 의학이 우울증의 원인을 뇌 속 신경 전달 물질의 불균형으로 보았다고 말해요. 이 문장은 뒤에서 반박할 기존 통념을 먼저 제시하는 역할을 하죠. 핵심어는 신경 전달 물질의 불균형이에요.","hl":"mn"},{"n":14,"text":"첫 번째 어법은 has long believed 현재완료예요. 과거부터 지금까지 오랫동안 믿어 왔다는 계속 용법이에요. 두 번째 어법은 that절 명사절이에요. believed의 목적어로 쓰여 우울증이 발생한다는 것을 뜻해요. 세 번째 어법은 is caused 수동태예요. 우울증이 스스로 발생한 게 아니라 외부 요인에 의해 발생한다는 의미를 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">However,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중대한 문제가\u003c/span>\u003cspan class=\"en\">a major problem\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 설명에는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">explanation\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 이 설명에는 중대한 문제가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞에서 소개한 전통적 설명에 \u003cb class=\"key\">중대한 \u003c/b>\u003cb class=\"key\">문제\u003c/b>가 있음을 지적하며 반박을 시작한다. However는 문장 흐름을 반전시키는 \u003cb class=\"key\">접속 \u003c/b>\u003cb class=\"key\">부사\u003c/b>로, 기존 논지와 반대 방향으로 전환하는 신호다. 이 문장은 뒤에 구체적 이유가 이어지는 디딤돌 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속 부사 (역접)\u003c/span> : However, + S + V : \"그러나,\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">유도 there 구문\u003c/span> : There + be동사 + 실제 주어 + 부사구 : \"~가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사구 (관련 대상)\u003c/span> : with + 명사구 : \"이 설명에는\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"However, 그러나. there is, 있다. a major problem, 중대한 문제가. with this explanation, 이 설명에는. 이 문장 전체를 해석하면, 그러나 이 설명에는 중대한 문제가 있다.","hl":"m"},{"n":16,"text":"두 번째 문장은 앞 문장의 설명에 중대한 문제가 있다고 말하면서 반박을 시작해요. However는 그러나라는 뜻으로 흐름을 완전히 바꾸는 접속 부사예요. 여기서 this explanation은 첫 번째 문장에서 말한 전통적인 의학의 설명을 가리켜요.","hl":"mn"},{"n":17,"text":"첫 번째 어법은 However예요. 문장 맨 앞에서 앞뒤 흐름을 반전시키는 접속 부사로, 뒤에 쉼표를 써요. 두 번째 어법은 there is 유도 there 구문이에요. 실제 주어 a major problem이 be동사 뒤에 오고, 해석은 중대한 문제가 있다가 되죠. 세 번째 어법은 with this explanation 전치사구예요. 문제가 있는 대상을 이 설명에는이라고 덧붙여 줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은 왜냐하면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">This \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">because\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물질의 불균형은\u003c/span>\u003cspan class=\"en\">the imbalance of substances\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌 속의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">brain\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우울증의 결과이다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">consequence \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">depression, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 원인이 아니라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">cause\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 왜냐하면 뇌 속 물질의 불균형은 우울증의 원인이 아니라 그것의 결과이기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 문장에서 말한 문제가 왜 문제인지 이유를 제시한다. 핵심은 뇌 속 물질의 불균형이 우울증의 \u003cb class=\"key\">원인이 \u003c/b>\u003cb class=\"key\">아니라 \u003c/b>\u003cb class=\"key\">결과\u003c/b>라는 데 있다. 즉, 인과 관계가 뒤집혀 있다는 사실을 밝혀 전통적 설명의 오류를 구체적으로 지적한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">This is because 구문\u003c/span> : This is because + S + V : \"이것은 왜냐하면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 (형용사적 수식)\u003c/span> : 명사 + in + the brain : \"뇌 속의\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">not을 이용한 대조 구조\u003c/span> : A, not B : \"우울증의 결과이지, 원인이 아니다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"This is because, 이것은 왜냐하면. the imbalance of substances, 물질의 불균형은. in the brain, 뇌 속의. is a consequence of depression, 우울증의 결과이다. not its cause, 그것의 원인이 아니라. 이 문장 전체를 해석하면, 이것은 왜냐하면 뇌 속 물질의 불균형은 우울증의 원인이 아니라 그것의 결과이기 때문이다.","hl":"m"},{"n":19,"text":"세 번째 문장은 두 번째 문장에서 말한 문제가 왜 문제인지 이유를 설명해요. 뇌 속 물질의 불균형이 우울증의 원인이 아니라 결과라는 말이에요. 이 지점에서 원인과 결과가 뒤집혀 있다는 핵심 논리가 드러나요.","hl":"mn"},{"n":20,"text":"첫 번째 어법은 This is because 구문이에요. 이것은 왜냐하면이라고 해석하고 앞 문장에 대한 구체적인 이유를 제시해요. 두 번째 어법은 in the brain 전치사구예요. 앞의 물질의 불균형을 뒤에서 꾸며서 뇌 속의라고 해석해요. 세 번째 어법은 not 대조 구조예요. 우울증의 결과이지 원인이 아니다라고 읽어야 해요. 여기서 its는 depression을 받아요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 말해서,\u003c/span>\u003cspan class=\"en\">In other words,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우울증이 뇌의 물질의 감소를 유발한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">depression \u003c/span>\u003cspan class=\"tgt\">causes \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">decrease \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">brain \u003c/span>\u003cspan class=\"tgt\">substances\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세로토닌이나 노르아드레날린과 같은,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">serotonin \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">noradrenaline\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌의 물질의 감소가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">decrease \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">brain \u003c/span>\u003cspan class=\"tgt\">substances \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우울증을 유발하는 것은 아니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">causes \u003c/span>\u003cspan class=\"tgt\">depression\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다시 말해서, 우울증이 세로토닌이나 노르아드레날린과 같은 뇌의 물질의 감소를 유발하는 것이지 뇌의 물질의 감소가 우울증을 유발하는 것이 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장을 다시 풀어서, 뇌 속 물질 불균형이 우울증의 \u003cb class=\"key\">원인\u003c/b>이 아니라 \u003cb class=\"key\">결과\u003c/b>임을 분명히 합니다. 우울증이 세로토닌·노르아드레날린 같은 뇌 물질 감소를 일으키는 쪽이므로, 기존 통념의 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 완전히 뒤집는 역할을 합니다. not으로 이어지는 대조 구조로 원인과 결과를 맞바꾸어 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사 cause의 목적어\u003c/span> : depression + causes + [a decrease in brain substances (명사구/목적어)] : \"우울증이 뇌의 물질의 감소를 유발한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 such as (예시)\u003c/span> : such as + [serotonin and noradrenaline (명사구)] : \"세로토닌과 노르아드레날린과 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">not 부정문 (대조)\u003c/span> : not + [a decrease in brain substances causes depression (절)] : \"뇌의 물질의 감소가 우울증을 유발하는 것은 아니다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"In other words, 다시 말해서. depression causes a decrease in brain substances, 우울증이 뇌의 물질의 감소를 유발한다. such as serotonin and noradrenaline, 세로토닌이나 노르아드레날린과 같은. not a decrease in brain substances, 뇌의 물질의 감소가. causes depression, 우울증을 유발하는 것은 아니다.. 이 문장 전체를 해석하면, 다시 말해서, 우울증이 세로토닌이나 노르아드레날린과 같은 뇌의 물질의 감소를 유발하는 것이지 뇌의 물질의 감소가 우울증을 유발하는 것이 아니다.","hl":"m"},{"n":22,"text":"앞 문장에서 말한 인과 관계를 다시 풀어서 설명하는 문장이에요. 우울증이 세로토닌이나 노르아드레날린 같은 뇌 물질 감소를 일으키는 것이지, 뇌 물질 감소가 우울증을 일으키는 것이 아니라는 점을 분명히 해요. 기존 통념의 원인과 결과를 완전히 뒤집는 핵심 문장이죠.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 depression causes a decrease in brain substances 부분에서 cause가 타동사로 쓰인 점이에요. cause 뒤에 a decrease in brain substances라는 목적어가 와서 우울증이 뇌의 물질의 감소를 유발한다는 원인과 결과를 나타내요. 두 번째는 such as serotonin and noradrenaline에서 such as가 뒤에 예시를 나열하는 전치사라는 점이에요. 세로토닌과 노르아드레날린이라는 구체적 예를 병렬로 제시하고 있죠. 세 번째는 not a decrease in brain substances causes depression 부분이에요. 앞의 긍정문과 대조하기 위해 not으로 절 전체를 부정하면서 원인과 결과를 뒤집고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 수정된 인과 관계에서, 핵심은 우울증을 재구성하는 것 의식의 문제로.\u003c/span>\u003cspan class=\"en\">In this revised cause­and­effect, the key is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reframe \u003c/span>\u003cspan class=\"tgt\">depression\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">problem \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">consciousness\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 수정된 인과 관계에서, 핵심은 우울증을 의식의 문제로 재구성하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 뒤집은 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 바탕으로, 우울증을 뇌의 화학 문제가 아니라 \u003cb class=\"key\">의식\u003c/b>의 문제로 바라봐야 한다고 핵심을 제시합니다. reframe A as B는 A를 B로 \u003cb class=\"key\">재구성\u003c/b>한다는 뜻으로, 기존의 의학적 틀을 버리고 새로운 해석 틀을 도입하는 전환점입니다. 글 전체의 주장 방향을 의식 쪽으로 잡아 주는 중심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(주격 보어)\u003c/span> : The key is + [to reframe depression (to부정사구/보어)] : \"우울증을 재구성하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 as (자격)\u003c/span> : reframe depression + [as a problem of consciousness (전치사구)] : \"의식의 문제로서\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"In this revised cause-and-effect, 이 수정된 인과 관계에서. the key is, 핵심은. to reframe depression, 우울증을 재구성하는 것. as a problem of consciousness, 의식의 문제로.. 이 문장 전체를 해석하면, 이 수정된 인과 관계에서, 핵심은 우울증을 의식의 문제로 재구성하는 것이다.","hl":"m"},{"n":25,"text":"이 문장은 우울증을 바라보는 새로운 틀을 제시해요. 우울증을 단순한 뇌의 화학 문제가 아니라 의식의 문제로 다시 정의하는 것이 핵심이라고 말하고 있죠. 그래서 글의 논점이 뇌 물질에서 의식으로 전환되는 중요한 전환점이에요.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 the key is to reframe depression 부분이에요. be동사 is 뒤에 to부정사구가 와서 주어 the key의 내용을 설명하는 주격 보어 역할을 해요. 두 번째는 as a problem of consciousness에서 as가 ~로서라는 뜻으로 쓰였다는 점이에요. 우울증을 의식의 문제라는 틀로 바꾸어 해석하는 의미를 더해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 의식은\u003c/span>\u003cspan class=\"en\">Our consciousness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 근본적인 실체이다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">fundamental \u003c/span>\u003cspan class=\"tgt\">entity\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">넘어서는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">goes \u003c/span>\u003cspan class=\"tgt\">beyond \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌의 기능을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">functioning \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">brain\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 의식은 뇌의 기능을 넘어서는 보다 근본적인 실체이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우울증을 의식의 문제로 보는 이유를 뒷받침합니다. 의식이 뇌의 기능을 \u003cb class=\"key\">넘어서는\u003c/b> 더 \u003cb class=\"key\">근본적\u003c/b>인 실체라고 정의함으로써, 뇌 물질 변화보다 더 깊은 차원의 문제임을 강조합니다. entity는 '실체'라는 뜻으로, 의식이 단순한 뇌 활동 산물이 아님을 보여 주는 표현입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 + 주격 보어\u003c/span> : Our consciousness + is + [a more fundamental entity (명사구/주격 보어)] : \"보다 근본적인 실체이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급\u003c/span> : more + [fundamental (형용사)] : \"더 근본적인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 that\u003c/span> : a more fundamental entity + [that goes beyond the functioning of the brain (주격 관계대명사절)] : \"뇌의 기능을 넘어서는\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Our consciousness, 우리의 의식은. is a more fundamental entity, 더 근본적인 실체이다. that goes beyond, 넘어서는. the functioning of the brain, 뇌의 기능을.. 이 문장 전체를 해석하면, 우리의 의식은 뇌의 기능을 넘어서는 보다 근본적인 실체이다.","hl":"m"},{"n":28,"text":"이 문장은 의식이 왜 우울증의 핵심인지를 설명해 줘요. 의식은 뇌의 기능을 넘어서는 더 근본적인 실체라고 정의하고 있죠. 따라서 뇌의 물질 변화보다 더 깊은 차원의 문제라는 점을 강조해요.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 is a more fundamental entity 부분이에요. be동사 is 뒤에 명사구가 와서 주어 Our consciousness를 설명하는 주격 보어 역할을 해요. 두 번째는 more fundamental에서 비교급 표현이에요. fundamental처럼 긴 형용사는 more를 붙여 비교급을 만들어요. 세 번째는 that goes beyond the functioning of the brain 부분이에요. that이 선행사 entity를 수식하는 주격 관계대명사이고, 절 안에서 주어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌는\u003c/span>\u003cspan class=\"en\">The brain\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 지나지 않는다\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의식의 기관\u003c/span>\u003cspan class=\"en\">an organ of consciousness.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">뇌는 의식의 기관에 지나지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 뇌의 역할을 축소한다. 뇌는 의식 그 자체가 아니라 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">기관\u003c/b>일 뿐임을 강조한다. 이로써 뒤에 나올 우울증의 원인을 의식의 왜곡에서 찾는 논리적 토대를 마련한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현\u003c/span> : no more than + 명사 : \"~에 지나지 않는다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"The brain, 뇌는. is no more than, ~에 지나지 않는다. an organ of consciousness, 의식의 기관. 이 문장 전체를 해석하면, 뇌는 의식의 기관에 지나지 않는다.","hl":"m"},{"n":31,"text":"이 문장은 뇌의 역할을 굉장히 제한하고 있어요. 뇌가 의식 그 자체가 아니라 의식의 기관일 뿐이라는 거죠. 그래서 우울증의 근본 원인을 뇌가 아니라 의식의 왜곡에서 찾아야 한다는 흐름을 만드는 문장이에요.","hl":"mn"},{"n":32,"text":"어법 포인트는 no more than이에요. no more than은 단지 에 불과하다, 에 지나지 않는다라는 뜻으로 뒤에 명사나 수량이 옵니다. 여기서는 the brain is no more than an organ of consciousness라고 하여 뇌가 의식의 기관에 불과하다는 점을 강조하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 그것이 의식 그 자체가 아니라면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">If \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">consciousness \u003c/span>\u003cspan class=\"tgt\">itself\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우울증의 근본 원인은\u003c/span>\u003cspan class=\"en\">then the root cause of depression\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역시 ~이다\u003c/span>\u003cspan class=\"en\">is also\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 의식 상태의 왜곡이다\u003c/span>\u003cspan class=\"en\">a distortion of our state of consciousness:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉 의식이다\u003c/span>\u003cspan class=\"en\">a consciousness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자아감과 삶의 의미를 상실한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">lost \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">sense \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">self \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">meaning \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">life\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 그것이 의식 그 자체가 아니라면, 우울증의 근본 원인 역시 우리의 의식 상태의 왜곡이며 즉, 자아감과 삶의 의미를 상실한 의식이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 우울증의 \u003cb class=\"key\">근본 \u003c/b>\u003cb class=\"key\">원인\u003c/b>을 의식의 왜곡으로 다시 정의한다. 뇌가 의식 자체가 아니라면, 자아감과 삶의 의미를 상실한 \u003cb class=\"key\">의식\u003c/b>이 우울증의 뿌리라는 것이다. 우울증을 신경전달물질의 문제가 아니라 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">질환\u003c/b>으로 보는 핵심 전환 문장이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조건 부사절\u003c/span> : If + 주어 + 동사, 주어 + 동사 : \"만약 ~가 아니라면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사 + that + has lost : \"자아감과 삶의 의미를 상실한\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"If it is not consciousness itself, 만약 그것이 의식 그 자체가 아니라면. then the root cause of depression, 우울증의 근본 원인은. is also, 역시 ~이다. a distortion of our state of consciousness, 우리 의식 상태의 왜곡이다. a consciousness, 즉 의식이다. that has lost its sense of self and the meaning of life, 자아감과 삶의 의미를 상실한. 이 문장 전체를 해석하면, 만약 그것이 의식 그 자체가 아니라면, 우울증의 근본 원인 역시 우리의 의식 상태의 왜곡이며 즉, 자아감과 삶의 의미를 상실한 의식이다.","hl":"m"},{"n":34,"text":"이 문장은 우울증의 원인을 완전히 뒤집어서 보여줘요. 뇌가 의식 그 자체가 아니므로, 우울증의 근본 원인은 의식의 왜곡, 즉 자아감과 삶의 의미를 잃어버린 의식이라는 거예요. 그래서 우울증은 단순한 뇌의 문제가 아니라 의식의 질환으로 다시 규정되는 핵심 문장입니다.","hl":"mn"},{"n":35,"text":"어법 포인트를 순서대로 짚어 볼게요. 첫 번째는 If it is not consciousness itself입니다. if가 이끄는 조건 부사절이고, 뒤에 then 이하 주절이 옵니다. it은 뇌를 가리키고, 뇌가 의식 그 자체가 아니라는 상황을 가정하는 거예요. 두 번째는 that has lost its sense of self and the meaning of life입니다. that은 선행사 a consciousness를 수식하는 주격 관계대명사이고, 뒤에 동사 has lost가 왔어요. has lost는 현재완료 형태라서 상실한 상태가 지금까지 이어지고 있음을 나타내요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 의식의 질환이\u003c/span>\u003cspan class=\"en\">Such a disease of consciousness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명백히 나타날 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">manifest \u003c/span>\u003cspan class=\"tgt\">itself\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우울증의 형태로\u003c/span>\u003cspan class=\"en\">in the form of depression.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러한 의식의 질환이 우울증의 형태로 명백히 나타날 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 규정한 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">질환\u003c/b>이 구체적으로 \u003cb class=\"key\">우울증\u003c/b>이라는 모습으로 드러날 수 있음을 말한다. 의식의 왜곡이 실제 생활에서 관찰 가능한 증상, 즉 우울증으로 나타난다는 \u003cb class=\"key\">연결 \u003c/b>\u003cb class=\"key\">고리\u003c/b>이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 may\u003c/span> : may + 동사원형 : \"~할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사\u003c/span> : 동사 + itself : \"그 자체를 나타내다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Such a disease of consciousness, 그러한 의식의 질환이. may manifest itself, 명백히 나타날 수 있다. in the form of depression, 우울증의 형태로. 이 문장 전체를 해석하면, 그러한 의식의 질환이 우울증의 형태로 명백히 나타날 수 있다.","hl":"m"},{"n":37,"text":"이 문장은 의식의 질환이 그냥 머릿속에만 있는 게 아니라 실제로는 우울증이라는 구체적인 모습으로 나타날 수 있다고 말해요. 그러니까 의식의 왜곡과 우울증 증상을 연결해 주는 문장이에요.","hl":"mn"},{"n":38,"text":"어법 포인트는 may manifest와 manifest itself입니다. 먼저 may는 가능성을 나타내는 조동사이고 뒤에 동사원형 manifest가 왔어요. 이 질환이 명백히 나타날 수 있다는 가능성을 표현해요. manifest itself에서 itself는 재귀대명사인데, 주어인 Such a disease of consciousness와 목적어 itself가 같은 대상을 가리킵니다. 그래서 질환이 스스로를 우울증의 형태로 드러낸다는 뜻이 돼요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>전통 의학은 우울증을 \u003cb class=\"key\">신경전달물질 \u003c/b>\u003cb class=\"key\">불균형\u003c/b> 때문이라고 보았지만, 이 설명에는 중대한 문제가 있다.\u003c/li>\u003cli>뇌 속 물질 불균형은 우울증의 \u003cb class=\"key\">원인\u003c/b>이 아니라 \u003cb class=\"key\">결과\u003c/b>이며, 우울증이 세로토닌과 노르아드레날린 감소를 유발한다.\u003c/li>\u003cli>핵심은 우울증을 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">문제\u003c/b>로 \u003cb class=\"key\">재구성\u003c/b>하는 것이며, 뇌는 의식의 기관에 지나지 않는다.\u003c/li>\u003cli>우울증의 근본 원인은 \u003cb class=\"key\">자아감과 \u003c/b>\u003cb class=\"key\">삶의 \u003c/b>\u003cb class=\"key\">의미를 \u003c/b>\u003cb class=\"key\">상실한 \u003c/b>\u003cb class=\"key\">의식\u003c/b>의 왜곡이고, 이러한 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">질환\u003c/b>이 우울증으로 나타난다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Depression should be reframed as a disease of consciousness, not as a neurotransmitter imbalance.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">전통적 \u003cb class=\"key\">신경전달물질 \u003c/b>\u003cb class=\"key\">불균형\u003c/b>설은 원인과 결과가 뒤집힌 설명이며, 우울증은 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">왜곡\u003c/b>에서 비롯된 \u003cb class=\"key\">의식의 \u003c/b>\u003cb class=\"key\">질환\u003c/b>으로 봐야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 지문의 핵심을 다시 정리하면, 전통 의학의 신경전달물질 불균형설은 원인과 결과를 혼동한 설명입니다. 우울증은 뇌 물질 감소가 원인이 아니라 결과이고, 진짜 근본 원인은 자아감과 삶의 의미를 상실한 의식의 왜곡이에요. 따라서 우울증은 의식의 질환으로 재구성해서 봐야 합니다. 오늘도 수고했어요.","hl":null}]}]});</script></body></html>
