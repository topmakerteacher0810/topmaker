  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 19번","audioDir":"19_audio","preview":false,"count":45,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">19번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>A Captain's Dream Ends in One Cold Sentence\u003c/h1>\u003ch2>한마디로 무너진 주장의 꿈\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>농구 경기 후 \u003cb class=\"key\">코치\u003c/b>의 부름에 \u003cb class=\"key\">팀의 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이 될 것이라 \u003cb class=\"key\">기대\u003c/b>했던 David는, \u003cb class=\"key\">차갑게\u003c/b> 집으로 보내지는 \u003cb class=\"key\">결정\u003c/b>을 듣고 \u003cb class=\"key\">마음을 \u003c/b>\u003cb class=\"key\">가다듬으려\u003c/b> 하지만 내면은 \u003cb class=\"key\">산산이 \u003c/b>\u003cb class=\"key\">무너진다\u003c/b>.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Expecting to be chosen as team captain, David is instead coldly told he will be sent home, and his dream is over.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 한 농구 선수의 기대가 한순간에 무너지는 이야기입니다. 제목은 A Captain's Dream Ends in One Cold Sentence, 우리말로는 한마디로 무너진 주장의 꿈입니다. 한 문장 요지를 먼저 들려드릴게요. Expecting to be chosen as team captain, David is instead coldly told he will be sent home, and his dream is over. 이 지문은 코치의 부름을 팀 주장 선발로 기대했지만 현실은 팀에서 방출되는 냉담한 통보였고, 결국 그 꿈이 끝나 버렸다는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">운동팀에서는 시즌 중에 팀 구성원을 가려내는 cut이 흔합니다. 라커 룸 밖에서 코치가 선수를 따로 부르는 것은 대개 선발이나 중요한 통보를 의미해요. 주장 captain은 팀을 대표하고 경기 중 선수들을 이끄는 leader 역할을 합니다. David는 그런 주장 자리를 \u003cb class=\"key\">기대\u003c/b>했지만, 오히려 팀에서 내려지는 \u003cb class=\"key\">방출\u003c/b> 통보를 받습니다. 이는 마치 친구들과 팀을 짜서 큰 대회에 나갈 줄 알았는데 명단에서 제외되는 순간과 비슷합니다. 기대가 클수록 현실이 냉담할 때의 충격도 크다는 점을 미리 생각해 두면 좋아요.\u003c/div>","segs":[{"n":2,"text":"운동팀에서는 시즌 중에 선수를 가려내는 cut이라는 과정이 흔하게 있습니다. 라커 룸 밖에서 코치가 선수를 따로 부르는 것은 보통 선발이나 중요한 통보를 의미하죠. 주장 captain은 팀을 대표하고 경기 중 선수들을 이끄는 leader 역할입니다. David는 이런 주장 자리를 기대했지만, 오히려 팀에서 내려지는 방출 통보를 받습니다. 이건 마치 친구들과 팀을 짜서 큰 대회에 나갈 줄 알았는데 명단에서 제외되는 순간과 비슷해요. 기대가 클수록 현실이 냉담할 때의 충격도 크다는 점을 먼저 생각해 두면 좋습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>기대 속 부름\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>첫 문장부터 네 번째 문장은 David가 라커 룸 밖에서 코치의 부름을 받고 \u003cb class=\"key\">중요한 \u003c/b>\u003cb class=\"key\">말\u003c/b>을 들을 것이라 기대하는 장면이다. David는 코치가 자신을 \u003cb class=\"key\">팀의 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이자 항상 원했던 리더로 뽑을 것이라고 짐작하며 가슴이 기대감으로 뛴다. 이 단계는 뒤에 올 반전을 위한 긍정적 기대를 깔아 둔다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>반전의 한마디\u003csmall>전환 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>다섯 번째 문장에서 접속사 But이 등장해 기대가 \u003cb class=\"key\">반전\u003c/b>된다. 코치는 David를 집으로 보내야 한다고 \u003cb class=\"key\">차갑게\u003c/b> 말하고, 그가 해낼 거라고 생각하지 않는다고 통보한다. David가 원했던 선발 대신 팀에서 제외되는 결정이 전달된다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>충격과 혼란\u003csmall>반응 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>여덟 번째와 아홉 번째 문장은 결정을 받아들인 David의 \u003cb class=\"key\">내적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>을 보여 준다. 그는 코치의 결정을 믿을 수 없었고, 겉으로는 마음을 가다듬으려 했지만 내면은 \u003cb class=\"key\">산산이 \u003c/b>\u003cb class=\"key\">무너지고\u003c/b> 있었다. 이 장면은 기대가 무너질 때의 괴리감을 드러낸다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>끝난 꿈\u003csmall>결론 · 문장 10–11\u003c/small>\u003c/h4>\u003cp>열 번째와 열한 번째 문장은 사건의 마무리를 전한다. 내일 아침 David를 집에 데려갈 차가 기다릴 것이라는 말은 그가 팀에 머물 수 없음을 확정한다. 마지막 문장 \u003cb class=\"key\">And \u003c/b>\u003cb class=\"key\">just \u003c/b>\u003cb class=\"key\">like \u003c/b>\u003cb class=\"key\">that, \u003c/b>\u003cb class=\"key\">it \u003c/b>\u003cb class=\"key\">was \u003c/b>\u003cb class=\"key\">over.\u003c/b>는 짧지만 강하게 꿈의 종결을 보여 준다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글은 기대를 쌓은 뒤 But으로 반전시키고, 그 충격과 끝맺음을 시간 순서로 보여 주는 흐름이에요.","hl":null},{"n":4,"text":"첫 번째 문장부터 네 번째 문장까지는 David가 라커 룸 밖에서 코치의 부름을 받고 중요한 말을 들을 것이라고 기대하는 장면입니다. David는 코치가 자기를 팀의 주장이자 항상 원했던 리더로 뽑을 것이라고 짐작하며 가슴이 기대감으로 뜁니다. 이 부분은 뒤에 올 반전을 위한 긍정적 기대를 깔아 두는 단계예요.","hl":"f0"},{"n":5,"text":"다섯 번째 문장에서 접속사 But이 등장해 기대가 반전됩니다. 코치는 David를 집으로 보내야 한다고 차갑게 말하고, 그가 해낼 거라고 생각하지 않는다고 통보하죠. David가 원했던 선발 대신 팀에서 제외되는 결정이 전달되는 순간입니다.","hl":"f1"},{"n":6,"text":"여덟 번째와 아홉 번째 문장은 결정을 받아들인 David의 내적 반응을 보여 줍니다. 그는 코치의 결정을 믿을 수 없었고, 겉으로는 마음을 가다듬으려 했지만 내면은 산산이 무너지고 있었어요. 기대와 현실의 괴리감이 가장 크게 드러나는 지점입니다.","hl":"f2"},{"n":7,"text":"열 번째와 열한 번째 문장은 사건의 마무리를 전합니다. 내일 아침 David를 집에 데려갈 차가 기다릴 것이라는 말은 그가 팀에 머물 수 없음을 확정해 주죠. 마지막 문장 And just like that, it was over.는 짧지만 강하게 꿈의 종결을 보여 줍니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 전개 방식상 \u003cb class=\"key\">통념\u003c/b>과 \u003cb class=\"key\">반박\u003c/b>의 구조로 볼 수 있다. 앞부분은 David가 주장으로 선발될 것이라는 기대, 곧 통념을 쌓고, 중간에 코치의 말이 그 기대를 반박한다. 그래서 글의 중심 문장은 다섯 번째 문장, But when his next words hit my ears, everything changed.이고, 구조는 핵심 반전이 중간에 있는 중괄식이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (5)\u003c/b>\u003cspan>전환·대조\u003c/span>\u003cb>everything changed (5)\u003c/b>\u003cspan>핵심 변화\u003c/span>\u003cb>And just like that (11)\u003c/b>\u003cspan>결론·종결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the captain of the team\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the leader I had always wanted to be\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">send you home\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">I don't think you are going to make it\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">hold it together\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">falling apart\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>David의 기대\u003c/th>\u003cth>코치의 현실 통보\u003c/th>\u003c/tr>\u003ctr>\u003ctd>주장으로 선발될 것\u003c/td>\u003ctd>집으로 보내질 것\u003c/td>\u003c/tr>\u003ctr>\u003ctd>리더가 될 것\u003c/td>\u003ctd>해낼 수 없을 것\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 전개 방식상 통념과 반박의 구조로 볼 수 있어요. 앞부분은 David가 주장으로 선발될 것이라는 기대, 곧 통념을 쌓고, 중간에 코치의 말이 그 기대를 반박합니다. 그래서 글의 중심 문장은 다섯 번째 문장, But when his next words hit my ears, everything changed.입니다. 구조는 중괄식으로, 핵심 반전이 중간에 있고 앞뒤로 기대와 결과가 배치되어 있죠.","hl":"ty"},{"n":9,"text":"신호어를 살펴보면 다섯 번째 문장의 But이 기대를 전환하는 중요한 연결어예요. 같은 문장의 everything changed는 앞뒤가 완전히 달라졌다는 핵심 변화를 알려 줘요. 그리고 열한 번째 문장의 And just like that은 이야기의 끝을 정리하는 결론 신호입니다. 또한 captain과 leader처럼 같은 개념을 바꿔 말한 표현, hold it together와 falling apart처럼 대조되는 표현을 짝지어 읽으면 글이 더 선명해져요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>hard-fought\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>치열한\u003c/span>\u003c/div>\u003cdiv>\u003cb>locker room\u003c/b>\u003cem>명사\u003c/em>\u003cspan>라커 룸, 탈의실\u003c/span>\u003c/div>\u003cdiv>\u003cb>called out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>큰 소리로 부르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>walk with me\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>나와 함께 걷자\u003c/span>\u003c/div>\u003cdiv>\u003cb>figure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각하다, 여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>select\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선발하다, 뽑다\u003c/span>\u003c/div>\u003cdiv>\u003cb>captain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주장\u003c/span>\u003c/div>\u003cdiv>\u003cb>leader\u003c/b>\u003cem>명사\u003c/em>\u003cspan>리더, 지도자\u003c/span>\u003c/div>\u003cdiv>\u003cb>wanted to be\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>되기를 원하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>racing\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(심장이) 빨리 뛰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>anticipation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기대, 예상\u003c/span>\u003c/div>\u003cdiv>\u003cb>hit my ears\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>귀에 들리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>send home\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집으로 보내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>coldly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>차갑게\u003c/span>\u003c/div>\u003cdiv>\u003cb>make it\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>해내다, 성공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>decision\u003c/b>\u003cem>명사\u003c/em>\u003cspan>결정\u003c/span>\u003c/div>\u003cdiv>\u003cb>believe\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hold it together\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>마음을 가다듬다\u003c/span>\u003c/div>\u003cdiv>\u003cb>falling apart\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>산산이 무너지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>waiting\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기다리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tomorrow morning\u003c/b>\u003cem>명사\u003c/em>\u003cspan>내일 아침\u003c/span>\u003c/div>\u003cdiv>\u003cb>take me home\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>집에 데려가다\u003c/span>\u003c/div>\u003cdiv>\u003cb>just like that\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>그렇게, 그처럼 간단히\u003c/span>\u003c/div>\u003cdiv>\u003cb>over\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>끝난\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"핵심 단어를 몇 개 짚어 볼게요. hard-fought는 치열한, locker room은 라커 룸이라는 뜻이고, called out은 큰 소리로 부르다라는 표현입니다. select는 선발하다, captain은 주장, anticipation은 기대, make it은 해내다는 뜻으로 시험에 자주 나오죠. hold it together는 마음을 가다듬다, falling apart는 산산이 무너지다라는 의미로 서로 반대되는 느낌을 함께 기억하면 좋아요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">anticipation\u003c/b>\u003cspan class=\"m\">기대\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">expectation\u003c/span>\u003cspan class=\"s\">hope\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">disappointment\u003c/span>\u003cspan class=\"a\">despair\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">figure\u003c/b>\u003cspan class=\"m\">생각하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">think\u003c/span>\u003cspan class=\"s\">believe\u003c/span>\u003cspan class=\"s\">suppose\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">doubt\u003c/span>\u003cspan class=\"a\">question\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">select\u003c/b>\u003cspan class=\"m\">선발하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">choose\u003c/span>\u003cspan class=\"s\">pick\u003c/span>\u003cspan class=\"s\">appoint\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003cspan class=\"a\">dismiss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">coldly\u003c/b>\u003cspan class=\"m\">차갑게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">indifferently\u003c/span>\u003cspan class=\"s\">heartlessly\u003c/span>\u003cspan class=\"s\">unfeelingly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">warmly\u003c/span>\u003cspan class=\"a\">kindly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hold it together\u003c/b>\u003cspan class=\"m\">마음을 가다듬다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">stay calm\u003c/span>\u003cspan class=\"s\">keep composure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fall apart\u003c/span>\u003cspan class=\"a\">lose control\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fall apart\u003c/b>\u003cspan class=\"m\">무너지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">break down\u003c/span>\u003cspan class=\"s\">collapse\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hold together\u003c/span>\u003cspan class=\"a\">stay strong\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">over\u003c/b>\u003cspan class=\"m\">끝난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">finished\u003c/span>\u003cspan class=\"s\">done\u003c/span>\u003cspan class=\"s\">ended\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ongoing\u003c/span>\u003cspan class=\"a\">continuing\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어를 정리해 볼게요. anticipation은 기대라는 뜻으로 expectation, hope와 비슷하고, disappointment, despair와 반대입니다. figure는 생각하다라는 뜻으로 think, believe, suppose와 가까워요. select는 선발하다라는 뜻으로 choose, pick, appoint와 비슷하고 reject, dismiss와 반대입니다. coldly는 차갑게라는 뜻으로 indifferently, heartlessly와 가깝고 warmly, kindly와 반대예요. over는 끝난이라는 뜻으로 finished, done, ended와 비슷하고 ongoing, continuing과 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 라커 룸 밖에서 기다릴 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">waited \u003c/span>\u003cspan class=\"tgt\">outside \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">locker \u003c/span>\u003cspan class=\"tgt\">room\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">치열하게 싸운 농구 경기 후에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">hard‐fought \u003c/span>\u003cspan class=\"tgt\">basketball \u003c/span>\u003cspan class=\"tgt\">game\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코치가 나를 크게 불렀다\u003c/span>\u003cspan class=\"en\">the coach called out to me,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">&quot;David, 나와 함께 걷자.&quot;\u003c/span>\u003cspan class=\"en\">&quot;David, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">walk \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">me\u003c/span>.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 치열하게 싸운 농구 경기 후에 라커 룸 밖에서 기다릴 때, 코치가 “David, 나와 함께 걷자.”라며 나를 크게 불렀다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 이야기의 배경을 설정하는 도입부로, \u003cb class=\"key\">주인공\u003c/b>이 치열한 농구 경기를 마치고 \u003cb class=\"key\">라커 \u003c/b>\u003cb class=\"key\">룸\u003c/b> 밖에서 기다리는 상황을 제시한다. 코치가 David를 부르며 함께 걷자고 한 행동은 단순한 대화가 아니라 중요한 통보가 있을 것이라는 \u003cb class=\"key\">기대감\u003c/b>을 만든다. hard-fought는 경기가 치열했음을, walk with me는 함께 걸으며 대화하자는 \u003cb class=\"key\">권유\u003c/b>의 명령문이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 as가 이끄는 시간 부사절\u003c/span> : As + S + V ~, S + V ~ : \"내가 라커 룸 밖에서 기다릴 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 after + 명사구 / 합성 형용사\u003c/span> : after + 명사구 : \"치열하게 싸운 농구 경기 후에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : 동사원형 ~ + 수식어 : \"나와 함께 걷자\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"As I waited outside the locker room, 내가 라커 룸 밖에서 기다릴 때. after a hard‐fought basketball game, 치열하게 싸운 농구 경기 후에. the coach called out to me, 코치가 나를 크게 불렀다. \"David, walk with me.\", \"David, 나와 함께 걷자.\". 이 문장 전체를 해석하면, 내가 치열하게 싸운 농구 경기 후에 라커 룸 밖에서 기다릴 때, 코치가 “David, 나와 함께 걷자.”라며 나를 크게 불렀다.","hl":"m"},{"n":13,"text":"이 문장은 이야기의 배경을 설정하는 도입부예요. 주인공이 치열한 농구 경기를 마치고 라커 룸 밖에서 기다리는데, 코치가 데이비드를 불러서 함께 걷자고 말해요. 이 순간은 앞으로 뭔가 중요한 이야기가 나올 것 같은 기대감을 만들어 주죠. hard-fought는 경기가 치열했다는 의미이고, walk with me는 함께 걸으면서 대화하자는 권유의 표현이에요.","hl":"mn"},{"n":14,"text":"첫 번째 문법 포인트는 As I waited outside the locker room 부분이에요. 여기서 As는 시간 접속사로 할 때라는 뜻이에요. 뒤에 주어와 동사가 오면서 시간을 나타내는 부사절을 이끌어요. 두 번째로 after a hard-fought basketball game에서 hard-fought는 hard와 fought가 합쳐진 합성 형용사이고, 명사 game을 앞에서 수식해요. after는 명사구와 함께 시간을 나타내는 전치사예요. 세 번째로 인용문 속 walk with me는 동사원형으로 시작하는 명령문이에요. 함께 걷자고 권유하는 표현이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각했다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">figured\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 나에게 말해 줄 거라고\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">tell\u003c/span> me\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무언가 중요한 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">important\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그가 나에게 무언가 중요한 것을 말해 줄 거라고 생각했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 David가 코치의 말을 듣기 전에 가졌던 \u003cb class=\"key\">예상\u003c/b>을 서술한다. figure는 that절을 이끌어 자신이 \u003cb class=\"key\">판단\u003c/b>한 내용을 나타내며, was going to는 가까운 미래나 \u003cb class=\"key\">의도\u003c/b>를 표현한다. something important처럼 -thing 계열 대명사는 형용사 important가 뒤에서 \u003cb class=\"key\">후치수식\u003c/b>한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 that이 생략된 목적절\u003c/span> : S + figured (that) + S + V ~ : \"~라고 생각했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be going to + 동사원형\u003c/span> : be going to + 동사원형 : \"말해 줄 예정이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">형용사의 후치수식\u003c/span> : -thing + 형용사 : \"무언가 중요한 것\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"I figured, 나는 생각했다. he was going to tell me, 그가 나에게 말해 줄 거라고. something important, 무언가 중요한 것을.. 이 문장 전체를 해석하면, 나는 그가 나에게 무언가 중요한 것을 말해 줄 거라고 생각했다.","hl":"m"},{"n":16,"text":"이 문장은 데이비드가 코치의 말을 듣기 전에 가졌던 예상을 보여 줘요. 그는 코치가 중요한 이야기를 해 줄 거라고 생각했어요. figure는 that절을 이끌어 자신이 판단한 내용을 나타내고, be going to는 가까운 미래나 의도를 표현해요. something important처럼 thing 계열 대명사는 형용사가 뒤에서 수식하는 점도 기억해 두세요.","hl":"mn"},{"n":17,"text":"첫 번째 문법 포인트는 figured예요. figure는 타동사라서 뒤에 that절을 목적어로 가질 수 있는데, 여기서는 that이 생략되어 바로 he was going to tell me something important가 연결됐어요. 해석은 그가 나에게 중요한 것을 말해 줄 거라고 생각했다가 자연스러워요. 두 번째 문법 포인트는 was going to tell이에요. be going to에 동사원형이 오는 형태로, 가까운 미래나 의도를 나타내요. 여기서는 말해 줄 예정이었다라는 뜻이에요. 세 번째 문법 포인트는 something important예요. something 같은 thing 계열 대명사는 형용사가 앞이 아니라 뒤에서 수식하기 때문에 something important가 맞는 어순이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 나를 ~이 되도록 뽑으려 할 것이라고\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">select \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팀의 주장\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">captain\u003c/span> of the team,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 항상 되기를 원했던 리더\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">leader \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">wanted \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 내가 항상 되기를 원했던 리더인 팀의 주장으로 나를 뽑으려 할 것이라고 (생각했다).\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 David가 기대했던 구체적인 내용으로, 코치가 자신을 \u003cb class=\"key\">팀의 \u003c/b>\u003cb class=\"key\">주장\u003c/b>으로 뽑을 것이라는 \u003cb class=\"key\">예상\u003c/b>을 드러낸다. be going to select는 가까운 미래의 \u003cb class=\"key\">의도\u003c/b>를, select me to be the captain은 나를 주장으로 뽑아 그 자리에 있게 하는 5형식 구조를 보여 준다. the leader와 I had always wanted to be는 captain을 \u003cb class=\"key\">부연\u003c/b>하는 \u003cb class=\"key\">동격\u003c/b> 및 관계사절로, 그가 오랫동안 리더를 \u003cb class=\"key\">꿈꿔\u003c/b> 왔음을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be going to + 동사원형\u003c/span> : be going to + 동사원형 : \"뽑으려 할 것이었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 목적격보어 (5형식)\u003c/span> : select + O + to be + 명사 : \"나를 주장이 되도록 뽑다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략 / 동격\u003c/span> : 선행사 + (목적격 관계대명사) + S + V : \"내가 항상 되기를 원했던 리더\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"He was going to select me to be, 그는 나를 ~이 되도록 뽑으려 할 것이라고. the captain of the team, 팀의 주장. the leader I had always wanted to be, 내가 항상 되기를 원했던 리더. 이 문장 전체를 해석하면, 그는 내가 항상 되기를 원했던 리더인 팀의 주장으로 나를 뽑으려 할 것이라고 (생각했다).","hl":"m"},{"n":19,"text":"이 문장은 데이비드가 기대했던 일의 내용이에요. 코치가 자신을 팀의 주장으로 뽑을 것이라고 생각했죠. 주장은 그가 항상 되기를 원했던 리더였어요. select me to be the captain은 나를 주장으로 뽑아 그 자리에 있게 하는 오형식 구조이고, the leader I had always wanted to be는 captain을 부연하는 동격 표현이에요. 이로써 데이비드가 얼마나 리더를 간절히 바랐는지가 드러나요.","hl":"mn"},{"n":20,"text":"첫 번째 문법 포인트는 was going to select예요. be going to에 동사원형이 오는 형태로, 가까운 미래의 계획이나 의도를 나타내요. 두 번째 문법 포인트는 select me to be the captain이에요. select 다음에 목적어 me가 오고 to be the captain이 목적격보어로 오는 오형식 구조예요. 이때 to be는 목적어의 신분이나 자격을 나타내요. 세 번째 문법 포인트는 the leader I had always wanted to be예요. leader는 captain과 동격이고, 뒤에 목적격 관계대명사가 생략된 절이 와서 leader를 수식해요. 그래서 해석은 내가 항상 되기를 원했던 리더가 돼요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 심장이\u003c/span>\u003cspan class=\"en\">My heart\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠르게 뛰고 있었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">racing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기대감으로.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">anticipation\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나의 심장이 기대감으로 빠르게 뛰었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 경기 후 코치님의 말을 기다리며 데이비드가 \u003cb class=\"key\">기대감\u003c/b>에 부푼 상태임을 보여 줍니다. 'My heart was racing'은 \u003cb class=\"key\">심장이 \u003c/b>\u003cb class=\"key\">빠르게 \u003c/b>\u003cb class=\"key\">뛰다\u003c/b>라는 뜻으로, 긴장과 설렘이 섞인 신체 반응입니다. 곧 이어질 충격적인 통보와 대비되어 \u003cb class=\"key\">긴장감\u003c/b>을 높이는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : 주어 + was/were + v-ing : \"빠르게 뛰고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 with + 감정 명사\u003c/span> : with + [anticipation (추상명사)] : \"기대감으로\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"My heart, 나의 심장이. was racing, 빠르게 뛰고 있었다. with anticipation, 기대감으로.. 이 문장 전체를 해석하면, 나의 심장이 기대감으로 빠르게 뛰었다.","hl":"m"},{"n":22,"text":"이 문장은 경기가 끝난 뒤 코치님이 데이비드를 불렀을 때, 데이비드가 기대감에 부풀어 심장이 빠르게 뛰고 있음을 보여 줍니다. 심장이 빠르게 뛰는 것은 긴장과 설렘이 섞인 신체 반응이죠. 곧 코치님이 말할 중요한 내용에 대한 기대감을 나타내면서 뒤에 나올 충격적인 말과 대비되는 긴장감을 만들어 줍니다.","hl":"mn"},{"n":23,"text":"첫 번째 어법 포인트는 was racing입니다. 이는 과거진행형으로, 과거의 특정 시점에 심장이 빠르게 뛰고 있는 상태가 계속되고 있었음을 나타냅니다. 두 번째 어법 포인트는 with anticipation입니다. 전치사 with는 기대감이라는 감정 명사를 이끌면서 기대감을 가진 채로라는 뜻을 나타냅니다. 그래서 단순히 빨리 뛴 것이 아니라 기대감이라는 감정을 동반한 상태였음을 알 수 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 그의 다음 말이\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">when \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">next \u003c/span>\u003cspan class=\"tgt\">words \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내 귀를 쳤을 때,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">hit \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">ears\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것이 변했다.\u003c/span>\u003cspan class=\"en\">everything changed.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 그의 다음 말이 내 귀를 쳤을 때, 모든 것이 변했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기대하던 분위기가 \u003cb class=\"key\">반전\u003c/b>되는 핵심 전환점입니다. 'hit my ears'는 소리가 귀에 들리다는 뜻으로, 소리를 \u003cb class=\"key\">때리다\u003c/b>에 비유해 생생하게 표현했습니다. 이 문장을 기점으로 코치의 차가운 말이 이어지며 분위기가 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">달라집니다\u003c/b>.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 when이 이끄는 시간 부사절\u003c/span> : when + 주어 + 동사, 주절 : \"그의 다음 말이 내 귀를 쳤을 때\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"But when his next words, 그러나 그의 다음 말이. hit my ears, 내 귀를 쳤을 때. everything changed, 모든 것이 변했다.. 이 문장 전체를 해석하면, 그러나 그의 다음 말이 내 귀를 쳤을 때, 모든 것이 변했다.","hl":"m"},{"n":25,"text":"이 문장은 코치의 다음 말이 들리는 순간 데이비드의 기대가 완전히 무너지는 전환점입니다. hit my ears는 소리가 귀를 때리듯 들린다는 비유적인 표현으로, 그 말이 얼마나 충격적으로 다가왔는지를 생생하게 보여 줍니다. 이 말을 기점으로 이야기의 분위기가 기대에서 절망으로 바뀌게 됩니다.","hl":"mn"},{"n":26,"text":"이 문장의 핵심 어법은 접속사 when이 이끄는 시간 부사절입니다. when his next words hit my ears는 그의 다음 말이 내 귀를 쳤을 때라는 뜻으로, 주절 everything changed가 일어난 시간의 배경을 제공합니다. 시간 부사절과 주절 사이에는 쉼표를 찍어 주는 것도 중요해요. 또 hit my ears는 귀에 들리다는 뜻의 관용 표현으로, 소리를 때리다에 비유한 생생한 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“우리는 너를 집으로 보내야만 해.”\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">We're \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">send\u003c/span> you home,&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 차갑게 말했다.\u003c/span>\u003cspan class=\"en\">he said \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">coldly\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“우리는 너를 집으로 보내야만 해.”라고 그가 차갑게 말했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코치가 데이비드에게 팀을 떠나야 한다고 \u003cb class=\"key\">냉정하게\u003c/b> 통보하는 문장입니다. 'We're going to have to send you home'은 단호하지만 완곡하게 \u003cb class=\"key\">방출\u003c/b>을 알리는 표현입니다. 'coldly'는 \u003cb class=\"key\">차갑게\u003c/b> 말했다는 태도를 보여 주며 앞선 기대와 극명한 대조를 이룹니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be going to + have to + 동사원형\u003c/span> : be going to + have to + send (동사원형) : \"우리는 너를 집으로 보내야만 해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 수식\u003c/span> : 동사 said + 부사 coldly : \"차갑게\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"\"We're going to have to send you home,\", “우리는 너를 집으로 보내야만 해.”. he said coldly, 그가 차갑게 말했다.. 이 문장 전체를 해석하면, “우리는 너를 집으로 보내야만 해.”라고 그가 차갑게 말했다.","hl":"m"},{"n":28,"text":"이 문장은 코치가 데이비드에게 팀을 떠나야 한다고 차갑게 통보하는 장면입니다. We're going to have to send you home은 우리는 너를 집으로 보내야만 한다는 뜻으로, 완곡하지만 단호한 방출 통보예요. coldly라는 부사가 말하는 태도가 차가웠음을 보여 주면서 앞선 기대와 극명하게 대비되는 분위기를 만듭니다.","hl":"mn"},{"n":29,"text":"첫 번째 어법 포인트는 We're going to have to send입니다. be going to는 가까운 미래나 예정을, have to는 의무를 나타내므로 둘이 합쳐져 곧 너를 집으로 보내야 한다는 뜻이 됩니다. 이때 have to 뒤에는 반드시 동사원형 send가 옵니다. 두 번째 어법 포인트는 coldly입니다. 부사 coldly가 동사 said를 수식해 말하는 태도가 차가웠음을 나타냅니다. 형용사 cold에 부사형 접미사 ly가 붙은 형태죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 생각하지 않아\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">think\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">네가 해낼 거라고\u003c/span>\u003cspan class=\"en\">you \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">going \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> it.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“나는 네가 해낼 거라고 생각하지 않아.”\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 코치의 냉담한 통보를 직접 인용한 문장으로, David가 팀에 남지 못하리라는 \u003cb class=\"key\">선고\u003c/b>를 전한다. `I don't think`는 that절 부정을 주절로 옮긴 \u003cb class=\"key\">부정 \u003c/b>\u003cb class=\"key\">전이\u003c/b> 구조이며, `make it`은 ‘해내다, 성공하다’라는 \u003cb class=\"key\">관용 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이다. 겉으로는 ‘생각하지 않는다’고 완곡하지만, 실제로는 ‘너는 해내지 못할 것’이라는 단정적 \u003cb class=\"key\">예측\u003c/b>을 담고 있다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 전이(transferred negation)\u003c/span> : I don't think + (that) + S + V : \"나는 ~라고 생각하지 않아\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be going to + 동사원형 (예정·의도)\u003c/span> : be going to + 동사원형 : \"해낼 것이다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"\"I don't think, 나는 생각하지 않아. you are going to make it.\", 네가 해낼 거라고. 이 문장 전체를 해석하면, “나는 네가 해낼 거라고 생각하지 않아.”","hl":"m"},{"n":31,"text":"이 문장은 코치가 David에게 팀에 남지 못할 거라고 통보하는 직접 발언이에요. I don't think는 that절 부정을 주절로 옮긴 부정 전이 구조라서 겉으로는 부드럽게 들리지만 실제로는 네가 해내지 못할 것이라는 단정적인 예측을 담고 있어요. make it은 해내다, 성공하다라는 관용 표현으로 팀에서 살아남는 것을 뜻하죠.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 I don't think에 있는 부정 전이예요. 영어에서는 think, believe, suppose 같은 동사에 that절이 올 때, 뒤에 오는 that절의 부정을 주절로 끌어와서 I don't think처럼 표현하는 경우가 많아요. 그래서 실제 뜻은 네가 해내지 못할 것 같다는 예측이 되는 거죠. 두 번째 어법 포인트는 are going to make에 있는 be going to plus 동사원형이에요. 이미 예정되거나 의도된 미래를 나타내는 표현으로, 여기서는 해낼 것이라는 미래 예측을 전달해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 믿을 수 없었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">couldn't \u003c/span>\u003cspan class=\"tgt\">believe\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 결정을\u003c/span>\u003cspan class=\"en\">his decision.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 그의 결정을 믿을 수 없었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 방출 결정을 받아들일 수 없었던 David의 충격을 직접 서술하는 문장이다. `couldn't believe`는 \u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">시점\u003c/b>에서 ‘믿을 수 없었다’는 \u003cb class=\"key\">능력의 \u003c/b>\u003cb class=\"key\">부정\u003c/b>을 나타낸다. 겉으로는 평정을 유지하려 하지만 속으로는 무너지는 다음 문장과 연결되는 \u003cb class=\"key\">심리 \u003c/b>\u003cb class=\"key\">묘사\u003c/b>의 시작이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 could의 부정 (can의 과거형)\u003c/span> : couldn't + 동사원형 : \"믿을 수 없었다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"I couldn't believe, 나는 믿을 수 없었다. his decision, 그의 결정을. 이 문장 전체를 해석하면, 나는 그의 결정을 믿을 수 없었다.","hl":"m"},{"n":34,"text":"이 문장은 코치의 결정을 들은 David의 충격을 직접 드러내요. couldn't believe는 과거 시점에서 그 결정을 사실로 받아들일 수 없었다는 뜻으로, 코치의 통보가 얼마나 믿기 어려운 일이었는지 강조해 주죠. 다음 문장에서 겉으로는 평정을 유지하려 하지만 속으로는 무너지는 내적 갈등으로 이어집니다.","hl":"mn"},{"n":35,"text":"이 문장의 어법 포인트는 couldn't believe예요. could는 can의 과거형이고, not이 붙은 couldn't 뒤에 동사원형 believe가 와서 과거의 능력이나 가능성을 부정하고 있어요. 여기서는 충격 때문에 그 결정을 받아들일 가능성이 없었다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 마음을 가다듬으려고 했지만\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tried \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">hold\u003c/span> it together, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">but\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내면에서\u003c/span>\u003cspan class=\"en\">inside\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 산산이 무너지고 있었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">falling\u003c/span> apart.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 마음을 가다듬으려고 했지만, 내면에서 나는 산산이 무너지고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 겉으로는 침착하게 행동하려 애쓰지만, 내면은 무너지고 있음을 대조적으로 보여주는 문장이다. `hold it together`는 \u003cb class=\"key\">평정 \u003c/b>\u003cb class=\"key\">유지\u003c/b>를, `falling apart`는 \u003cb class=\"key\">감정의 \u003c/b>\u003cb class=\"key\">붕괴\u003c/b>를 뜻하는 대비적 표현이다. 이 문장은 방출 통보에 대한 David의 \u003cb class=\"key\">내적 \u003c/b>\u003cb class=\"key\">갈등\u003c/b>을 가장 잘 드러내며 글의 정서적 절정을 이룬다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (목적어)\u003c/span> : try + to [동사원형] (to부정사구/목적어) : \"~하려고 애쓰다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사 but\u003c/span> : S + V, but + S + V : \"그러나\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : was + -ing (과거진행형) : \"무너지고 있었다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"I tried to hold it together, but, 나는 마음을 가다듬으려고 했지만. inside, 내면에서. I was falling apart, 나는 산산이 무너지고 있었다. 이 문장 전체를 해석하면, 나는 마음을 가다듬으려고 했지만, 내면에서 나는 산산이 무너지고 있었다.","hl":"m"},{"n":37,"text":"이 문장은 겉으로는 침착하게 행동하려 애쓰지만 내면은 이미 무너지고 있는 David의 내적 갈등을 대조적으로 보여줘요. hold it together는 평정을 유지한다는 뜻이고 falling apart는 감정이 산산이 무너진다는 뜻이에요. 방출 통보를 받은 직후의 충격이 가장 잘 드러나는 문장이죠.","hl":"mn"},{"n":38,"text":"첫 번째 어법 포인트는 tried to hold에 있는 to부정사의 명사적 용법이에요. 동사 try는 뒤에 to부정사를 목적어로 취해서 뭔가를 하려고 애쓴다는 뜻을 나타내요. 여기서는 마음을 가다듬는 것을 시도하는 목적어로 쓰였죠. 두 번째 어법 포인트는 등위접속사 but이에요. 앞 절의 평정을 유지하려는 모습과 뒤 절의 무너지는 속마음을 대조적으로 연결해 줘요. 세 번째 어법 포인트는 was falling에 있는 과거진행형이에요. was plus ing가 과거의 특정 순간에 진행 중이던 상태를 나타내서 내면이 서서히 무너지고 있었음을 보여줘요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 11\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">차가 기다리고 있을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">A \u003c/span>\u003cspan class=\"tgt\">car \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">waiting\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내일 아침에\u003c/span>\u003cspan class=\"en\">tomorrow morning\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 집에 데려가기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">take \u003c/span>\u003cspan class=\"tgt\">me \u003c/span>\u003cspan class=\"tgt\">home\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내일 아침에 나를 집에 데려갈 차가 기다리고 있을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 내일 아침이면 팀을 떠나야 한다는 \u003cb class=\"key\">예정된 \u003c/b>\u003cb class=\"key\">미래\u003c/b>를 보여 줍니다. would be waiting은 과거 시점에서 앞으로 일어날 일을 나타내며 복귀의 여지가 없음을 암시합니다. 차가 집까지 데려다준다는 표현은 운동부 생활이 공식적으로 끝났음을 담담하게 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거의 미래 (would be + ing)\u003c/span> : S + would be + ing : \"차가 기다리고 있을 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : waiting + to take ... : \"나를 집에 데려가기 위해\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"A car would be waiting, 차가 기다리고 있을 것이다. tomorrow morning, 내일 아침에. to take me home, 나를 집에 데려가기 위해. 이 문장 전체를 해석하면, 내일 아침에 나를 집에 데려갈 차가 기다리고 있을 것이다.","hl":"m"},{"n":40,"text":"이 문장은 이미 예정된 미래를 담담하게 말해 주고 있어요. would be waiting은 과거 시점에서 앞으로 일어날 일을 나타내는 표현이에요. 내일 아침에 차가 와서 자신을 집에 데려갈 거라는 상황을 보여 주며 복귀 가능성이 사라졌음을 암시합니다.","hl":"mn"},{"n":41,"text":"첫 번째 포인트는 A car would be waiting이에요. 여기서 would be waiting은 과거 시점에서 본 미래의 일을 나타내는 과거의 미래 표현이에요. 두 번째 포인트는 to take me home인데, 이건 기다리는 목적을 나타내는 to부정사의 부사적 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 11\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그렇게,\u003c/span>\u003cspan class=\"en\">And \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끝이 났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">over\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그리고 그렇게, 끝이 났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> And just like that은 별다른 과정 없이 \u003cb class=\"key\">그렇게 \u003c/b>\u003cb class=\"key\">갑자기\u003c/b> 일이 끝났음을 뜻하는 관용 표현입니다. it was over는 꿈과 팀 생활이 단순하게 끝났다는 상태를 보여 줍니다. 짧은 문장으로 마무리하며 허무함과 충격을 극대화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현\u003c/span> : just like that : \"그렇게, 갑자기\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 문장 (주격 보어)\u003c/span> : S + be동사 + 형용사 보어(over) : \"끝이 났다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"And just like that, 그리고 그렇게. it was over, 끝이 났다. 이 문장 전체를 해석하면, 그리고 그렇게, 끝이 났다.","hl":"m"},{"n":43,"text":"And just like that은 갑작스럽게, 별다른 과정 없이라는 뜻의 관용 표현이에요. it was over는 주어 it의 상태가 over, 즉 끝난 상태라고 말해 줘요. 짧은 문장으로 이야기를 마무리하며 꿈이 허무하게 끝났음을 강조합니다.","hl":"mn"},{"n":44,"text":"첫 번째 포인트는 just like that이에요. 그렇게, 갑자기라는 뜻의 관용 표현이에요. 두 번째 포인트는 it was over인데, 여기서 over는 끝난이라는 형용사로 주격 보어 역할을 해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>David는 농구 경기 후 \u003cb class=\"key\">코치\u003c/b>의 부름을 받고 \u003cb class=\"key\">팀의 \u003c/b>\u003cb class=\"key\">주장\u003c/b>으로 선발될 것이라고 \u003cb class=\"key\">기대\u003c/b>했다.\u003c/li>\u003cli>그러나 코치는 \u003cb class=\"key\">차갑게\u003c/b> 그를 \u003cb class=\"key\">집으로 \u003c/b>\u003cb class=\"key\">보내야\u003c/b> 하며 해낼 거라고 생각하지 않는다고 말했다.\u003c/li>\u003cli>David는 \u003cb class=\"key\">결정\u003c/b>을 믿지 못하고 \u003cb class=\"key\">마음을 \u003c/b>\u003cb class=\"key\">가다듬으려\u003c/b> 했지만 내면은 \u003cb class=\"key\">산산이 \u003c/b>\u003cb class=\"key\">무너졌다\u003c/b>.\u003c/li>\u003cli>결국 내일 아침 그를 \u003cb class=\"key\">집에 \u003c/b>\u003cb class=\"key\">데려갈\u003c/b> 차가 기다리고, \u003cb class=\"key\">And \u003c/b>\u003cb class=\"key\">just \u003c/b>\u003cb class=\"key\">like \u003c/b>\u003cb class=\"key\">that, \u003c/b>\u003cb class=\"key\">it \u003c/b>\u003cb class=\"key\">was \u003c/b>\u003cb class=\"key\">over.\u003c/b>로 모든 것이 \u003cb class=\"key\">끝났다\u003c/b>.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Expecting to be chosen as team captain, David is instead coldly told he will be sent home, and his dream is over.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">농구 경기 후 \u003cb class=\"key\">코치\u003c/b>의 부름에 \u003cb class=\"key\">팀의 \u003c/b>\u003cb class=\"key\">주장\u003c/b>이 될 것이라 \u003cb class=\"key\">기대\u003c/b>했던 David는, \u003cb class=\"key\">차갑게\u003c/b> 집으로 보내지는 \u003cb class=\"key\">결정\u003c/b>을 듣고 \u003cb class=\"key\">마음을 \u003c/b>\u003cb class=\"key\">가다듬으려\u003c/b> 하지만 내면은 \u003cb class=\"key\">산산이 \u003c/b>\u003cb class=\"key\">무너진다\u003c/b>.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":45,"text":"오늘 지문은 David가 기대했던 주장 선발이 아니라 팀에서 방출되는 냉담한 현실을 맞닥뜨린 짧은 이야기입니다. 접속사 But을 중심으로 기대와 현실이 대조되고, 마지막에 그 모든 것이 끝났다는 결론으로 마무리됩니다. 여러분도 지문을 읽을 때 신호어와 대조 표현을 찾아 흐름을 정리해 보세요. 오늘 수고 많았어요, 다음 시간에 만나요.","hl":null}]}]});</script><script src="/chat-widget.js" defer></script>
</body></html>
