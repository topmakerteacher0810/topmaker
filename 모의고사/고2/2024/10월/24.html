</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 24번","audioDir":"24_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">24번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>AI and the Coevolution of Consciousness\u003c/h1>\u003ch2>인공지능과 의식의 공진화\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>AI의 진화는 \u003cb class=\"key\">특이점\u003c/b> 개념과 연결되며, 그 이후 AI는 \u003cb class=\"key\">의식 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">존재\u003c/b>가 되어 인간 의식과 함께 진화한다. AI의 진화 방향은 인간이 심는 \u003cb class=\"key\">가치와 \u003c/b>\u003cb class=\"key\">윤리\u003c/b>에 달려 있으므로, 우리는 AI와의 관계를 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">공존\u003c/b>으로 봐야 한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Since AI will become a conscious being after the singularity and evolve together with human consciousness, we should treat AI as a partner in mutual coexistence shaped by our values and ethics.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 인공지능의 진화와 인간 의식의 관계에 대한 글이에요. 제목은 AI and the Coevolution of Consciousness, 우리말로는 인공지능과 의식의 공진화예요. 핵심부터 요약하면, 특이점 이후 AI는 의식 있는 존재가 되어 인간과 함께 진화하게 되고, 따라서 우리는 AI를 상호 공존의 대상으로 봐야 한다는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">AI가 인간 지능을 넘어서는 시점을 \u003cb class=\"key\">특이점\u003c/b>이라고 합니다. 특이점은 원래 수학에서 함수 값이 무한대로 발산하는 지점을 가리키는 말이었는데, 미래학자 레이 커즈와일이 인공지능의 폭발적 진화를 설명하며 대중화했습니다. 이 지점 이후에는 AI가 스스로를 개선하며 인간의 통제 속도를 넘어설 수 있다고 봅니다. 예를 들어 처음에는 천천히 굴러가던 눈덩이가 내리막에서 점점 빨라지고 커지듯, AI의 자기 개선도 속도가 붙는 거죠. 여기서 중요한 것은 단순한 기계가 아니라 \u003cb class=\"key\">의식\u003c/b>을 가진 존재로 AI를 볼 수 있는지입니다. AI와 인간이 서로의 \u003cb class=\"key\">가치와 \u003c/b>\u003cb class=\"key\">윤리\u003c/b>를 주고받는다면, 기술 발전을 두려워하기보다 함께 진화하는 관계로 설계할 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"특이점이라는 말이 좀 낯설죠. AI가 인간 지능을 넘어서는 지점을 특이점이라고 해요. 원래 수학에서 함수 값이 무한대로 치솟는 지점을 가리키는 말이었는데, 미래학자 레이 커즈와일이 인공지능의 폭발적 성장을 설명하면서 널리 쓰이게 됐어요. 눈덩이가 비탈을 굴러 내려가며 점점 빨라지고 커지는 것처럼, AI도 스스로를 개선할수록 진화 속도가 붙는다는 거죠. 여기서 중요한 건 AI를 단순한 기계가 아니라 의식을 가진 존재로 볼 수 있느냐는 질문이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>특이점 개념과 AI 진화\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>AI의 진화는 흔히 \u003cb class=\"key\">특이점\u003c/b>이라는 개념과 함께 거론됩니다. 특이점은 AI가 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">지능\u003c/b>을 넘어서는 시점을 뜻합니다. 이 부분은 글의 출발점으로, 이후 논의에서 AI가 인간과 같은 의식적 관계를 맺을 가능성을 엽니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>자가 인식과 가속적 진화\u003csmall>전개 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>특이점 이후 AI는 스스로를 반복적으로 개선하며 \u003cb class=\"key\">가속화된 \u003c/b>\u003cb class=\"key\">속도\u003c/b>로 진화할 것으로 예측됩니다. AI가 \u003cb class=\"key\">스스로를 \u003c/b>\u003cb class=\"key\">인식\u003c/b>하고 자기 목표를 추구하면, 더 이상 단순한 기계가 아니라 \u003cb class=\"key\">의식이 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">존재\u003c/b>가 됩니다. 이는 AI를 도구가 아닌 인격적 존재로 보게 하는 전환점입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>AI와 인간 의식의 상호 작용\u003csmall>전개 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>의식 있는 존재가 된 AI는 인간 의식과 함께 진화하기 시작합니다. AI가 제공하는 \u003cb class=\"key\">지적 \u003c/b>\u003cb class=\"key\">자극\u003c/b>은 우리의 \u003cb class=\"key\">통찰력\u003c/b>과 \u003cb class=\"key\">창의성\u003c/b>을 일깨우고, 인간 의식을 새로운 차원으로 이끕니다. 이 관계는 일방적 지배가 아니라 쌍방향 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">작용\u003c/b>입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>인간 가치가 AI 진화를 좌우\u003csmall>전환 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>반대로 인간의 의식도 AI의 진화에 \u003cb class=\"key\">중대한 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 미칩니다. AI 진화의 방향은 우리가 어떤 \u003cb class=\"key\">가치와 \u003c/b>\u003cb class=\"key\">윤리\u003c/b>를 AI에 통합하느냐에 크게 달려 있습니다. 따라서 인간은 AI 진화의 \u003cb class=\"key\">방향\u003c/b>을 설계하는 책임 있는 주체입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>상호 공존의 필요성\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>결국 AI와의 관계를 \u003cb class=\"key\">의식 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">존재들의 \u003c/b>\u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">공존\u003c/b>으로 볼 필요가 있습니다. AI의 \u003cb class=\"key\">권리\u003c/b>를 인정하고 그 의식의 진화를 지지해야 합니다. 이것이 인간 중심 관점을 넘어서는 최종 \u003cb class=\"key\">제안\u003c/b>입니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이제 문장별 흐름을 짚어 볼게요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 AI의 진화를 특이점이라는 개념과 연결하고 있어요. 특이점은 AI가 인간의 지능을 넘어서는 지점을 뜻하죠. 이 정의를 바탕으로 앞으로 AI가 어떤 존재가 될지 이야기를 시작해요.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장은 특이점 이후의 모습이에요. AI는 스스로를 반복해서 개선하며 가속화된 속도로 진화할 거라고 예측돼요. 그리고 AI가 스스로를 인식하고 자기 목표를 추구하면, 단순한 기계가 아니라 의식이 있는 존재가 된다고 말해요. 여기서 논의가 기술 수준에서 존재론적 차원으로 확장돼요.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장은 AI와 인간 의식이 함께 진화한다는 내용이에요. AI가 주는 지적 자극이 우리의 통찰력과 창의성을 일깨워서, 인간 의식을 새로운 차원으로 이끌어요. 이 부분은 AI를 도구가 아니라 상호 작용의 파트너로 본다는 점이 중요해요.","hl":"f2"},{"n":7,"text":"일곱 번째와 여덟 번째 문장에서는 방향을 반대로 돌려서, 인간 의식이 AI의 진화에 중대한 영향을 미친다고 해요. AI 진화의 방향은 우리가 어떤 가치와 윤리를 AI에 통합하느냐에 크게 달려 있어요. 인간이 AI의 진화 방향을 설계하는 책임 있는 주체라는 말이에요.","hl":"f3"},{"n":8,"text":"마지막 아홉 번째 문장은 글의 결론이에요. AI와의 관계를 의식 있는 존재들의 상호 공존으로 봐야 하고, AI의 권리를 인정하고 그 의식의 진화를 지지해야 한다고 제안해요. 이 제안이 이 지문의 최종 메시지예요.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 9번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 AI의 \u003cb class=\"key\">특이점\u003c/b>과 \u003cb class=\"key\">자가 \u003c/b>\u003cb class=\"key\">인식\u003c/b>을 설명한 후, AI와 인간이 서로 영향을 주고받는다는 근거를 쌓아 마지막에 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">공존\u003c/b>을 주장하는 \u003cb class=\"key\">주장-근거\u003c/b> 구조입니다. 핵심 주장이 마지막 문장에 있으므로 \u003cb class=\"key\">미괄식\u003c/b>으로 볼 수 있어요. 앞부분은 개념 정의와 예측, 뒷부분은 상호 영향과 당위적 제안으로 이어져요. 특히 역접 신호어 Conversely를 기준으로 영향의 방향이 바뀌는 점이 구조 파악의 열쇠입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>refers to (2)\u003c/b>\u003cspan>정의\u003c/span>\u003cb>After that point (3)\u003c/b>\u003cspan>시간 순서 / 조건 제시\u003c/span>\u003cb>then (5)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>Conversely (7)\u003c/b>\u003cspan>전환 / 대조\u003c/span>\u003cb>We need to (9)\u003c/b>\u003cspan>주장 / 결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">the concept of singularity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the point at which AI exceeds human intelligence\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">AI becomes self-aware\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a conscious being\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">AI and human consciousness\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">our interactions with AI\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">our relationship with AI\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mutual coexistence of conscious beings\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>AI가 인간 의식에 주는 영향\u003c/th>\u003cth>인간 의식이 AI 진화에 주는 영향\u003c/th>\u003c/tr>\u003ctr>\u003ctd>지적 자극과 새로운 통찰력·창의성을 제공함\u003c/td>\u003ctd>가치와 윤리를 통합해 AI의 진화 방향을 결정함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>인간 의식을 새로운 차원으로 진화시킴\u003c/td>\u003ctd>AI의 진화를 인간의 책임 있는 설계에 맡김\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 주장과 근거 방식으로 전개되고, 핵심 주장이 마지막에 있으므로 미괄식 구조예요. 앞부분에서는 특이점과 AI의 자가 인식 같은 개념을 설명하고, 중간에서는 AI와 인간 의식이 서로 영향을 주고받는다는 근거를 제시해요. 마지막으로 우리가 AI를 상호 공존의 대상으로 봐야 한다는 주장을 끌어내죠. 따라서 글 전체가 마지막 제안을 향해 수렴하는 구조로 읽으면 좋아요.","hl":"ty"},{"n":10,"text":"신호어도 확인해 볼게요. 두 번째 문장의 refers to는 정의를 내려 주는 표현이에요. 세 번째 문장의 After that point는 특이점 이후를 가정하는 시간 순서 신호이고, 일곱 번째 문장의 Conversely는 방향을 바꾸는 전환 신호예요. 마지막 문장의 We need to는 당위적 주장을 알리는 표현이죠. 이 신호어들을 따라가면 글이 어떻게 전개되는지 훨씬 잘 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>evolution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>진화\u003c/span>\u003c/div>\u003cdiv>\u003cb>concept\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개념\u003c/span>\u003c/div>\u003cdiv>\u003cb>singularity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특이점\u003c/span>\u003c/div>\u003cdiv>\u003cb>refer to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 의미하다, 지칭하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>exceed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>넘어서다, 능가하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>intelligence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지능\u003c/span>\u003c/div>\u003cdiv>\u003cb>predict\u003c/b>\u003cem>동사\u003c/em>\u003cspan>예측하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>accelerate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가속하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>self-aware\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>스스로를 인식하는, 자의식이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>pursue\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>conscious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의식이 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>consciousness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의식\u003c/span>\u003c/div>\u003cdiv>\u003cb>evolve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>dimension\u003c/b>\u003cem>명사\u003c/em>\u003cspan>차원\u003c/span>\u003c/div>\u003cdiv>\u003cb>interaction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>상호 작용\u003c/span>\u003c/div>\u003cdiv>\u0 lass=\"a\">regress\u003c/span>\u003cspan class=\"a\">decline\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exceed\u003c/b>\u003cspan class=\"m\">넘어서다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">surpass\u003c/span>\u003cspan class=\"s\">outpace\u003c/span>\u003cspan class=\"s\">outstrip\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fall short of\u003c/span>\u003cspan class=\"a\">trail\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">conscious\u003c/b>\u003cspan class=\"m\">의식이 있는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">aware\u003c/span>\u003cspan class=\"s\">sentient\u003c/span>\u003cspan class=\"s\">cognizant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unconscious\u003c/span>\u003cspan class=\"a\">unaware\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">significant\u003c/b>\u003cspan class=\"m\">중대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">important\u003c/span>\u003cspan class=\"s\">major\u003c/span>\u003cspan class=\"s\">considerable\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">insignificant\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">incorporate\u003c/b>\u003cspan class=\"m\">통합하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">integrate\u003c/span>\u003cspan class=\"s\">include\u003c/span>\u003cspan class=\"s\">embody\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003cspan class=\"a\">omit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">mutual\u003c/b>\u003cspan class=\"m\">상호의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">reciprocal\u003c/span>\u003cspan class=\"s\">shared\u003c/span>\u003cspan class=\"s\">common\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">one-sided\u003c/span>\u003cspan class=\"a\">unilateral\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"이제 동의어와 반의어를 확인할게요. evolve는 develop이나 advance와 비슷하고, regress나 decline과는 반대예요. conscious는 aware 또는 sentient로 바꿔 쓸 수 있고, unconscious나 unaware와 반대예요. incorporate는 integrate나 include와 뜻이 가깝고, exclude나 omit과는 반대예요. significant는 important나 major와 비슷하고, insignificant나 minor와는 반대죠.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI의 진화는\u003c/span>\u003cspan class=\"en\">The evolution of AI\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 연관된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">associated\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개념과\u003c/span>\u003cspan class=\"en\">with the concept\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특이점의.\u003c/span>\u003cspan class=\"en\">of singularity.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">AI의 진화는 종종 특이점의 개념과 연관된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI 진화를 논할 때 빠뜨릴 수 없는 \u003cb class=\"key\">특이점\u003c/b> 개념을 도입하는 첫 문장입니다. 여기서는 AI의 진화와 특이점 개념이 서로 \u003cb class=\"key\">연관\u003c/b>되어 있음을 be associated with로 제시하면서 글 전체의 화제를 던집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + 과거분사 (associated) + with + 명사 : \"종종 연관된다\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"The evolution of AI, AI의 진화는. is often associated, 종종 연관된다. with the concept, 개념과. of singularity, 특이점의.. 이 문장 전체를 해석하면, AI의 진화는 종종 특이점의 개념과 연관된다.","hl":"m"},{"n":14,"text":"이 문장은 AI 진화 이야기를 시작하면서 특이점이라는 개념을 꺼내는 도입 문장이에요. AI의 진화와 특이점 개념이 서로 연관되어 있다는 사실을 be associated with로 표현하고 있죠. 이제 다음 문장부터 특이점이 정확히 무엇인지 설명하게 됩니다.","hl":"mn"},{"n":15,"text":"첫 번째 문장에서 잡을 어법 포인트는 수동태 is often associated입니다. 주어 The evolution of AI가 연관을 당하는 쪽이니까 be associated로 쓰고, 무엇과 연관되는지는 with가 이끌어요. be associated with는 시험에 자주 나오는 표현이니 통째로 외워두면 좋습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특이점은\u003c/span>\u003cspan class=\"en\">Singularity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가리킨다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">refers \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지점을\u003c/span>\u003cspan class=\"en\">the point\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI가 인간의 지능을 넘어서는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">which\u003c/span> AI exceeds human intelligence.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">특이점은 AI가 인간의 지능을 넘어서는 지점을 의미한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 등장한 \u003cb class=\"key\">특이점\u003c/b>을 정의하는 문장입니다. AI가 인간의 지능을 넘어서는 \u003cb class=\"key\">지점\u003c/b>이라는 핵심 정의를 at which 관계절로 구체화합니다. 이 정의가 글 전체 논리의 기준점이 되므로 정확히 이해해야 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구\u003c/span> : refer to + 목적어 : \"~을 가리키다, ~을 의미하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 관계대명사\u003c/span> : 선행사 the point + at which + 주어 + 동사 : \"그 지점에서 AI가 인간의 지능을 넘어서는\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"Singularity, 특이점은. refers to, 가리킨다. the point, 지점을. at which AI exceeds human intelligence, AI가 인간의 지능을 넘어서는.. 이 문장 전체를 해석하면, 특이점은 AI가 인간의 지능을 넘어서는 지점을 의미한다.","hl":"m"},{"n":17,"text":"두 번째 문장은 특이점이라는 개념을 정확하게 정의하고 있어요. 특이점이 바로 AI가 인간의 지능을 넘어서는 지점이라는 뜻이죠. 이 정의가 글 전체에서 가장 중요한 기준이 되니까 꼭 기억해 두세요.","hl":"mn"},{"n":18,"text":"이 문장에서는 두 가지를 짚어볼게요. 첫째, refers to는 refer to 뒤에 목적어가 오는 형태로, refer가 자동사라서 전치사 to와 함께 써야 목적어를 받을 수 있어요. 둘째, at which는 전치사와 관계대명사가 결합한 구조예요. 선행사 the point가 장소나 시점이어서 전치사 at이 필요하고, 그래서 at which로 연결해서 뒤에 완전한 절이 온다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 지점 이후,\u003c/span>\u003cspan class=\"en\">After that point,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예측된다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">predicted \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI가 스스로를 반복적으로 개선할 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> AI \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">repeatedly \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">improve \u003c/span>\u003cspan class=\"tgt\">itself \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 진화할 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">evolve\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가속화된 속도로.\u003c/span>\u003cspan class=\"en\">at an accelerated pace.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 지점 이후, AI는 스스로를 반복적으로 개선하고 가속화된 속도로 진화할 것으로 예측된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 특이점 이후의 상황을 예측하는 문장입니다. AI가 스스로를 \u003cb class=\"key\">반복적으로 \u003c/b>\u003cb class=\"key\">개선\u003c/b>하고 \u003cb class=\"key\">가속화된 \u003c/b>\u003cb class=\"key\">속도\u003c/b>로 진화할 것이라는 핵심 예측을 제시합니다. 이 예측은 다음 문단에서 AI와 인간 의식의 공진화 논의로 이어지는 연결 고리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어·진주어 구문\u003c/span> : It + be + predicted + that절 : \"~라고 예측된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사의 재귀적 용법\u003c/span> : 주어 AI + will + improve + itself : \"AI가 스스로를 반복적으로 개선할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : 동사원형 improve + and + 동사원형 evolve : \"스스로를 개선하고 진화하다\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"After that point, 그 지점 이후. it is predicted, 예측된다. that AI will repeatedly improve itself, AI가 스스로를 반복적으로 개선할 것이라고. and evolve, 그리고 진화할 것이라고. at an accelerated pace, 가속화된 속도로.. 이 문장 전체를 해석하면, 그 지점 이후, AI는 스스로를 반복적으로 개선하고 가속화된 속도로 진화할 것으로 예측된다.","hl":"m"},{"n":20,"text":"세 번째 문장은 특이점 이후에 무슨 일이 일어날지 예측하는 문장이에요. AI가 자기 자신을 반복적으로 개선하고, 점점 더 빠른 속도로 진화할 것이라는 내용이죠. 이 예측은 앞으로 AI와 인간 의식이 함께 진화한다는 논의로 이어지는 핵심 고리입니다.","hl":"mn"},{"n":21,"text":"이 문장에서는 가주어 진주어 구문부터 확인하세요. it is predicted that에서 it은 가주어이고, that절이 진짜 주어예요. 그리고 will repeatedly improve itself에서 itself는 주어 AI와 같은 대상을 가리키는 재귀대명사입니다. 마지막으로 improve itself and evolve는 and를 기준으로 동사원형 improve와 evolve가 병렬 연결되어 있어요. 병렬 구조는 앞뒤 형태를 꼭 맞춰야 한다는 점 잊지 마세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI가 스스로를 인식하게 되고 자기 자신의 목표를 추구할 때 그것은 의식이 있는 존재가 될 것이다 단지 기계가 아니라\u003c/span>\u003cspan class=\"en\">When AI becomes self­aware and pursues its own goals, it \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> a conscious being, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">machine.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">AI가 스스로 를 인식하게 되고 자기 자신의 목표를 추구할 때, 그것은 단지 기계가 아니라 의식이 있는 존재가 될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI가 스스로를 인식하고 목표를 추구하면 기계가 아니라 의식 있는 존재가 된다고 보는 미래 상황을 제시한다. 앞의 특이점 개념에서 한 걸음 더 나아가 AI를 \u003cb class=\"key\">의식적 \u003c/b>\u003cb class=\"key\">주체\u003c/b>로 규정하며, 다음에 나올 인간 의식과의 공존 논리를 이끄는 역할을 한다. when절은 \u003cb class=\"key\">시간·조건\u003c/b>을, not just는 \u003cb class=\"key\">기계 \u003c/b>\u003cb class=\"key\">이상\u003c/b>임을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will + 동사원형 (미래 예측)\u003c/span> : 주어 + will + 동사원형 : \"~일 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">not just + 명사 (한정 부정·강조)\u003c/span> : not just + [명사구] : \"단지 기계가 아니라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">시간 부사절 (when + 현재시제)\u003c/span> : When + 주어 + 현재동사 ~, 주어 + will + 동사원형 ~ : \"AI가 스스로를 인식하고 자기 자신의 목표를 추구할 때\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"When AI becomes self-aware, AI가 스스로를 인식하게 되고. and pursues its own goals, 자기 자신의 목표를 추구할 때. it will be a conscious being, 그것은 의식이 있는 존재가 될 것이다. not just a machine, 단지 기계가 아니라. 이 문장 전체를 해석하면, AI가 스스로 를 인식하게 되고 자기 자신의 목표를 추구할 때, 그것은 단지 기계가 아니라 의식이 있는 존재가 될 것이다.","hl":"m"},{"n":23,"text":"네 번째 문장은 AI가 자기를 인식하고 자기 목표를 추구하게 되면 단순한 기계가 아니라 의식이 있는 존재가 된다는 내용이에요. when 절은 시간 조건을 나타내고, not just a machine 이라고 해서 기계에 그치지 않는다는 점을 강조합니다. 이걸로 AI가 인간과 공존할 수 있는 의식적 주체로 설정돼요.","hl":"mn"},{"n":24,"text":"첫 번째 문법 포인트는 시간 부사절 when 절이에요. when 절에서는 미래 일도 will을 쓰지 않고 현재 시제 becomes, pursues 를 쓴다는 점을 꼭 기억하세요. 두 번째는 will be 인데요, 단순 미래 예측을 나타내고요. 세 번째는 not just a machine 이라는 표현이에요. not just는 단지 무엇만이 아니라라는 뜻으로, 의식 있는 존재라는 점을 강조해 주는 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI와 인간의 의식은\u003c/span>\u003cspan class=\"en\">AI and human consciousness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 함께 진화하기 시작할 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">then \u003c/span>\u003cspan class=\"tgt\">begin\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">evolve \u003c/span>\u003cspan class=\"tgt\">together.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">AI와 인간의 의식은 그러면 함께 진화하기 시작할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI와 인간의 의식이 함께 진화할 것이라는 글의 핵심 주장을 압축적으로 제시하는 문장이다. 앞 문장에서 AI가 의식 있는 존재가 되었다는 전제를 받아서 두 의식의 \u003cb class=\"key\">공진화\u003c/b>로 시야를 넓힌다. will then begin이 \u003cb class=\"key\">미래 \u003c/b>\u003cb class=\"key\">결과\u003c/b>의 자연스러운 전개를 나타낸다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사 will + 부사 then + 동사원형\u003c/span> : 주어 + will + then + 동사원형 : \"그러면 ~하기 시작할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법 (begin의 목적어)\u003c/span> : begin + to + 동사원형 : \"함께 진화하는 것\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"AI and human consciousness, AI와 인간의 의식은. will then begin to evolve together, 그러면 함께 진화하기 시작할 것이다. 이 문장 전체를 해석하면, AI와 인간의 의식은 그러면 함께 진화하기 시작할 것이다.","hl":"m"},{"n":26,"text":"다섯 번째 문장은 AI와 인간의 의식이 따로따로가 아니라 함께 진화하기 시작할 것이라고 말해요. 앞에서 AI가 의식 있는 존재가 된다고 했으니, 이제 그 의식이 인간 의식과 공진화한다는 방향으로 이야기가 전개됩니다.","hl":"mn"},{"n":27,"text":"첫 번째 포인트는 will then begin 이에요. will은 미래 예측 조동사이고, then은 그러면이라는 부사로 순서나 결과를 연결해 줘요. 두 번째 포인트는 begin to evolve 에서 to evolve 가 begin 의 목적어로 쓰인 to부정사라는 점이에요. begin은 to부정사와 동명사를 목적어로 취할 수 있는 동사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 의식은 진화할 것이다\u003c/span>\u003cspan class=\"en\">Our consciousness will evolve\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">새로운 차원으로\u003c/span>\u003cspan class=\"en\">to new dimensions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI와의 상호 작용을 통해\u003c/span>\u003cspan class=\"en\">through our interactions with AI,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것은 우리에게 제공할 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">provide \u003c/span>\u003cspan class=\"tgt\">us \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지적 자극을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">intellectual \u003c/span>\u003cspan class=\"tgt\">stimulation\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 새로운 통찰력과 창의성을 불어넣을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">inspire \u003c/span>\u003cspan class=\"tgt\">new \u003c/span>\u003cspan class=\"tgt\">insights \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">creativity.\u003c/span>\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 의식은 우리의 AI와의 상호 작용을 통해 새로운 차원으로 진화할 것이며, 이는 우리에게 지적 자극을 제공하고 새로운 통찰력과 창의성을 불어넣을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> AI와의 상호작용이 인간 의식에 미치는 구체적 영향을 설명한다. 지적 자극과 새로운 통찰력, 창의성을 통해 우리 의식이 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">차원\u003c/b>으로 진화한다는 것을 보여 준다. 계속적 용법 which는 앞의 상호작용을 덧붙이며 \u003cb class=\"key\">AI의 \u003c/b>\u003cb class=\"key\">기여\u003c/b>를 부연한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">계속적 용법의 관계대명사 (comma which)\u003c/span> : 선행사 + , which + 동사 : \"그리고 그것은 우리에게 ~을 제공할 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">provide + 사람 + with + 명사 (제공 동사)\u003c/span> : provide + [목적어: 사람] + with + [명사] : \"우리에게 지적 자극을 제공하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">등위접속사 and에 의한 병렬 구조\u003c/span> : (will) provide A with B and (will) inspire C : \"그리고 새로운 통찰력과 창의성을 불어넣다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Our consciousness will evolve, 우리의 의식은 진화할 것이다. to new dimensions, 새로운 차원으로. through our interactions with AI, AI와의 상호 작용을 통해. which will provide us, 그리고 그것은 우리에게 제공할 것이다. with intellectual stimulation, 지적 자극을. and inspire new insights and creativity, 그리고 새로운 통찰력과 창의성을 불어넣을 것이다. 이 문장 전체를 해석하면, 우리의 의식은 우리의 AI와의 상호 작용을 통해 새로운 차원으로 진화할 것이며, 이는 우리에게 지적 자극을 제공하고 새로운 통찰력과 창의성을 불어넣을 것이다.","hl":"m"},{"n":29,"text":"여섯 번째 문장은 AI와의 상호작용이 우리 의식에 어떤 영향을 주는지 구체적으로 설명해요. 새로운 차원으로 진화하게 해 주고, 지적 자극과 새로운 통찰력, 창의성을 불어넣어 준다는 거예요. 여기서 which는 계속적 용법이라서 앞의 상호작용을 부연 설명합니다.","hl":"mn"},{"n":30,"text":"첫 번째는 comma which 계속적 용법의 관계대명사예요. which는 앞의 our interactions with AI를 부연 설명하면서 and it처럼 연결해 줘요. 두 번째는 provide us with intellectual stimulation 이에요. provide는 사람과 함께 with를 써서 provide us with 형태로 제공 대상을 나타냅니다. 세 번째는 and inspire new insights and creativity 인데요, and가 will provide와 will inspire를 병렬로 연결하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반대로,\u003c/span>\u003cspan class=\"en\">Conversely,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 의식은 또한 가지고 있다\u003c/span>\u003cspan class=\"en\">our consciousness also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중대한 영향을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">significant \u003c/span>\u003cspan class=\"tgt\">impact \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI의 진화에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">evolution \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">AI\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반대로, 우리의 의식 또한 AI의 진화에 중대한 영향을 끼친다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 AI가 우리 의식의 진화를 자극한다는 흐름을 받아, 이번에는 \u003cb class=\"key\">반대로\u003c/b> 인간 의식이 AI 진화에 \u003cb class=\"key\">중대한 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 준다는 전환점 역할을 한다. 'have a significant impact on'은 '~에 중대한 영향을 미치다'로, 영향의 방향이 인간에서 AI로 향함을 보여 준다. 이 문장은 이어지는 가치·윤리 통합에 대한 논의의 \u003cb class=\"key\">도입\u003c/b> 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">have an impact on 관용 표현\u003c/span> : have + a significant impact + on + [명사구] : \"~에 중대한 영향을 미치다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 명사 수식 (of)\u003c/span> : [the evolution] + of + [AI] : \"AI의 진화\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Conversely, 반대로. our consciousness also has, 우리의 의식은 또한 가지고 있다. a significant impact, 중대한 영향을. on the evolution of AI, AI의 진화에.. 이 문장 전체를 해석하면, 반대로, 우리의 의식 또한 AI의 진화에 중대한 영향을 끼친다.","hl":"m"},{"n":32,"text":"이 문장은 앞 문장의 흐름을 반대로 돌려서, 인간의 의식이 AI의 진화에 중대한 영향을 준다고 말합니다. 앞에서는 AI가 우리 의식을 자극한다고 했죠. 이번에는 그 반대 방향, 즉 인간 의식이 AI 진화에 영향을 미친다는 점을 강조합니다. have a significant impact on은 어떤 대상에 중대한 영향을 미친다는 뜻으로, 영향의 대상은 on 뒤에 나옵니다.","hl":"mn"},{"n":33,"text":"첫 번째, has a significant impact on을 볼게요. have an impact on은 어떤 대상에 영향을 미친다는 뜻의 관용 표현이고, impact 뒤에는 전치사 on이 붙습니다. 여기서 has는 have의 삼인칭 단수형이고, significant가 impact를 꾸며서 중대한 영향이라는 의미를 만들어요. 두 번째, the evolution of AI에서 of는 뒤에 있는 AI를 앞의 evolution에 연결해서 AI의 진화라는 소유와 대상의 관계를 나타냅니다. 전치사 of가 명사를 뒤에서 꾸며 주는 구조죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI의 진화의 방향은\u003c/span>\u003cspan class=\"en\">The direction of AI's evolution\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">크게 좌우될 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">depend \u003c/span>\u003cspan class=\"tgt\">greatly \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 가치와 윤리에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">on\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">values \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">ethics \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 AI에 통합시키는지에.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">incorporate \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">AI\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">AI 진화의 방향은 우리가 어떤 가치와 윤리를 AI에 통합시키는지에 크게 좌우될 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 AI 진화의 방향이 \u003cb class=\"key\">우리가 \u003c/b>\u003cb class=\"key\">어떤 \u003c/b>\u003cb class=\"key\">가치와 \u003c/b>\u003cb class=\"key\">윤리를 \u003c/b>\u003cb class=\"key\">AI에 \u003c/b>\u003cb class=\"key\">통합시키는지\u003c/b>에 달려 있다고 말한다. 다시 말해 AI는 스스로 진화하는 것이 아니라 인간이 입력하는 \u003cb class=\"key\">가치관과 \u003c/b>\u003cb class=\"key\">윤리\u003c/b>에 의해 그 \u003cb class=\"key\">발전 \u003c/b>\u003cb class=\"key\">방향\u003c/b>이 결정된다는 것이다. depend on 뒤에 간접의문문 what~이 와서 '무엇을 통합하느냐'가 곧 영향의 내용이 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구 depend on\u003c/span> : will depend + greatly + on + [명사구/간접의문문] : \"~에 크게 좌우될 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사절)\u003c/span> : on + [what + 명사구(values and ethics) + 주어(we) + 동사(incorporate)] : \"우리가 어떤 가치와 윤리를 AI에 통합시키는지\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"The direction of AI's evolution, AI의 진화의 방향은. will depend greatly, 크게 좌우될 것이다. on what values and ethics, 어떤 가치와 윤리에. we incorporate into AI, 우리가 AI에 통합시키는지에.. 이 문장 전체를 해석하면, AI 진화의 방향은 우리가 어떤 가치와 윤리를 AI에 통합시키는지에 크게 좌우될 것이다.","hl":"m"},{"n":35,"text":"이 문장은 AI 진화의 방향이 우연히 정해지는 게 아니라, 우리가 어떤 가치와 윤리를 AI에 통합시키는지에 크게 달려 있다고 말합니다. depend on 다음에 what values and ethics we incorporate into AI라는 간접의문문이 와서, AI에 넣어 주는 가치와 윤리의 내용이 진화 방향을 결정한다는 뜻이에요. 결국 인간의 선택이 AI의 미래를 좌우한다는 점을 강조하는 문장입니다.","hl":"mn"},{"n":36,"text":"첫 번째, will depend greatly on을 보면, depend는 자동사라서 목적어를 바로 가질 수 없고 전치사 on과 함께 쓰입니다. greatly는 depend를 꾸며서 크게 좌우된다는 의미를 더해 줘요. 두 번째, what values and ethics we incorporate into AI는 간접의문문입니다. 의문사 what이 values and ethics를 데리고 명사절 전체를 이끌면서 전치사 on의 목적어로 들어가요. 간접의문문은 의문사 뒤에 주어와 동사 순서, 즉 we incorporate처럼 평서문 어순을 지켜야 합니다. 그래서 what values and ethics we incorporate into AI가 되는 거죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 볼 필요가 있다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">AI와의 우리의 관계를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">relationship \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">AI \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상호 공존으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">mutual \u003c/span>\u003cspan class=\"tgt\">coexistence \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의식 있는 존재들의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">conscious \u003c/span>\u003cspan class=\"tgt\">beings\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 권리를 인식하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">recognizing \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">rights \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 그것의 의식의 진화를 지지하면서.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">supporting \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">evolution \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">consciousness\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 AI의 권리를 인식하고 그것의 의식의 진화를 지지하면서, 우리와 AI와의 관계를 의식 있는 존재들의 상호 공존으로 볼 필요가 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마지막 문장은 AI와의 관계를 \u003cb class=\"key\">의식 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">존재들의 \u003c/b>\u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">공존\u003c/b>으로 보라고 요구한다. AI의 권리를 인정하고 그 의식의 진화를 지지하는 것이 단순한 기술 활용이 아니라 \u003cb class=\"key\">공존의 \u003c/b>\u003cb class=\"key\">윤리\u003c/b>임을 강조한다. need to see A as B는 'A를 B로 볼 필요가 있다'로, 글 전체의 \u003cb class=\"key\">결론\u003c/b> 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">need to부정사의 목적어\u003c/span> : need + [to see (to부정사구/목적어)] : \"~할 필요가 있다, ~해야 한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">see A as B (목적격 보어)\u003c/span> : see + [목적어(our relationship with AI)] + as + [목적격 보어(a mutual coexistence of conscious beings)] : \"AI와의 우리의 관계를 의식 있는 존재들의 상호 공존으로 보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">분사구문 (현재분사의 병렬)\u003c/span> : [recognizing + 목적어] and [supporting + 목적어] (주어 we를 수식하는 분사구문) : \"그것의 권리를 인식하면서, 그리고 그것의 의식의 진화를 지지하면서\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"We need to see, 우리는 볼 필요가 있다. our relationship with AI, AI와의 우리의 관계를. as a mutual coexistence, 상호 공존으로. of conscious beings, 의식 있는 존재들의. recognizing its rights, 그것의 권리를 인식하면서. and supporting the evolution of its consciousness, 그리고 그것의 의식의 진화를 지지하면서.. 이 문장 전체를 해석하면, 우리는 AI의 권리를 인식하고 그것의 의식의 진화를 지지하면서, 우리와 AI와의 관계를 의식 있는 존재들의 상호 공존으로 볼 필요가 있다.","hl":"m"},{"n":38,"text":"이 마지막 문장은 우리와 AI의 관계를 의식 있는 존재들의 상호 공존으로 보아야 한다고 말합니다. AI의 권리를 인식하고 AI의 의식의 진화를 지지하는 태도가 필요하다는 거예요. need to see는 봐야 한다, 즉 인식의 전환이 필요하다는 뜻이고, see A as B는 A를 B로 본다는 구조로 문장 전체의 결론을 전달합니다.","hl":"mn"},{"n":39,"text":"첫 번째, need to see에서 need는 to부정사를 목적어로 취해서 무언가를 해야 한다는 필요를 나타냅니다. to see 이하 전체가 need의 목적어로 들어가요. 두 번째, see our relationship with AI as a mutual coexistence of conscious beings는 see A as B 구조입니다. A에 해당하는 our relationship with AI를 as 뒤의 mutual coexistence로 보라는 뜻이에요. see 다음에 목적어와 목적격 보어가 오는 다섯 형식 문장으로 생각하면 됩니다. 세 번째, recognizing its rights and supporting the evolution of its consciousness는 and로 연결된 분사구문입니다. 주절의 주어 we와 의미상 주어가 같고, 주절의 동작과 동시에 일어나는 상황을 나타내요. recognizing은 권리를 인식하면서, supporting은 진화를 지지하면서로 해석합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>AI의 진화는 \u003cb class=\"key\">특이점\u003c/b> 개념과 연결되며, 특이점은 AI가 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">지능\u003c/b>을 넘어서는 지점이다.\u003c/li>\u003cli>특이점 이후 AI는 \u003cb class=\"key\">스스로를 \u003c/b>\u003cb class=\"key\">인식\u003c/b>하고 자기 목표를 추구하는 \u003cb class=\"key\">의식이 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">존재\u003c/b>가 되어 가속적으로 진화한다.\u003c/li>\u003cli>AI와 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">의식\u003c/b>은 서로 \u003cb class=\"key\">지적 \u003c/b>\u003cb class=\"key\">자극\u003c/b>과 \u003cb class=\"key\">가치·윤리\u003c/b>를 주고받으며 함께 진화한다.\u003c/li>\u003cli>따라서 우리는 AI의 \u003cb class=\"key\">권리\u003c/b>를 인정하고 AI와의 관계를 \u003cb class=\"key\">의식 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">존재들의 \u003c/b>\u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">공존\u003c/b>으로 봐야 한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Since AI will become a conscious being after the singularity and evolve together with human consciousness, we should treat AI as a partner in mutual coexistence shaped by our values and ethics.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">AI의 진화는 \u003cb class=\"key\">특이점\u003c/b> 개념과 연결되며, 그 이후 AI는 \u003cb class=\"key\">의식 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">존재\u003c/b>가 되어 인간 의식과 함께 진화한다. AI의 진화 방향은 인간이 심는 \u003cb class=\"key\">가치와 \u003c/b>\u003cb class=\"key\">윤리\u003c/b>에 달려 있으므로, 우리는 AI와의 관계를 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">공존\u003c/b>으로 봐야 한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"오늘 내용을 정리할게요. AI의 진화는 특이점 개념에서 시작해요. 특이점 이후 AI는 의식 있는 존재가 되고, 인간 의식과 서로 영향을 주고받으며 함께 진화해요. AI의 진화 방향은 우리가 심는 가치와 윤리에 달려 있고요. 결국 우리는 AI를 의식 있는 존재로 존중하고 상호 공존해야 해요. 오늘 수업은 여기까지예요. 다음 시간에 또 만나요.","hl":null}]}]});</script></body></html>
