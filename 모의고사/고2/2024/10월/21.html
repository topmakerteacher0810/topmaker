</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 21번","audioDir":"21_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">21번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Seeing Is Not Believing: Reconstructing Our Memories\u003c/h1>\u003ch2>보는 것이 믿는 것은 아니다: 기억의 재구성\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>인간의 지각과 기억은 영상을 재생하는 것이 아니라 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">표상\u003c/b>으로 \u003cb class=\"key\">재구성\u003c/b>되며, 이는 효율적이지만 세상을 있는 그대로 보지 못하게 한다. 따라서 \u003cb class=\"key\">목격자 \u003c/b>\u003cb class=\"key\">증언\u003c/b>의 법적 신뢰성은 약화되고, 보는 것이 곧 믿는 것은 아니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Our memories are reconstructed through abstract representations rather than retrieved like a video, so seeing is not believing.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 지문은 Seeing Is Not Believing, 즉 보는 것이 믿는 것은 아니라는 주제입니다. 이 글은 우리의 지각과 기억이 영상 재생이 아니라 추상적 재구성이라는 점을 다룹니다. 핵심 요지는 우리 기억이 추상적인 표상으로 재구성되기 때문에 보는 것을 그대로 믿을 수 없다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">우리 뇌는 눈으로 받아들인 정보를 그대로 \u003cb class=\"key\">저장\u003c/b>하지 않고, 기존 지식과 경험을 바탕으로 \u003cb class=\"key\">능동적으로 \u003c/b>\u003cb class=\"key\">재구성\u003c/b>합니다. 인지심리학에서는 이를 \u003cb class=\"key\">스키마\u003c/b>라고 부르는데, 새로운 정보를 해석하는 틀로 작동합니다. 컴퓨터에 비유하면, 무거운 \u003cb class=\"key\">비트맵\u003c/b> 파일보다 JPG 같은 \u003cb class=\"key\">압축 \u003c/b>\u003cb class=\"key\">알고리즘\u003c/b>으로 저장하는 것과 비슷합니다. 스마트폰 사진을 JPG로 저장하면 용량이 줄지만 세부 디테일이 일부 손실되는 것처럼, 기억도 효율성을 위해 왜곡될 수 있습니다. 그래서 목격자의 기억도 완벽한 증거가 아니라 \u003cb class=\"key\">재구성된 \u003c/b>\u003cb class=\"key\">표상\u003c/b>일 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 우리 뇌는 눈으로 받아들인 정보를 그대로 저장하지 않습니다. 기존 지식과 경험을 바탕으로 능동적으로 재구성하는데, 인지심리학에서는 이런 틀을 스키마라고 부릅니다. 컴퓨터에 비유하면 무거운 비트맵 파일보다 JPG 같은 압축 알고리즘으로 저장하는 것과 비슷합니다. 스마트폰 사진을 JPG로 저장하면 용량은 줄지만 세부 디테일이 일부 손실되듯이, 기억도 효율성을 위해 왜곡될 수 있습니다. 그래서 목격자의 기억도 완벽한 증거가 아니라 재구성된 표상일 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>보는 것은 재구성이다\u003csmall>주장 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>우리는 무언가를 볼 때 \u003cb class=\"key\">교육을 \u003c/b>\u003cb class=\"key\">통해 \u003c/b>\u003cb class=\"key\">배운\u003c/b> 모양, 색깔, 개념으로 자연스럽게 해체합니다. 그리고 아는 모든 것의 렌즈로 \u003cb class=\"key\">재부호화\u003c/b>합니다. 기억에서 영상을 꺼내는 것이 아니라 \u003cb class=\"key\">기억을 \u003c/b>\u003cb class=\"key\">재구성\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>효율적 저장 방식\u003csmall>근거 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>이런 능력은 \u003cb class=\"key\">유용한 \u003c/b>\u003cb class=\"key\">특성\u003c/b>입니다. JPG 같은 \u003cb class=\"key\">압축 \u003c/b>\u003cb class=\"key\">알고리즘\u003c/b>처럼 정보를 효율적으로 저장합니다. 완벽한 세부 기억을 가진 사람들은 \u003cb class=\"key\">일반화\u003c/b>와 연결에 어려움을 겪습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>대가: 있는 그대로 못 봄\u003csmall>전환 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>그러나 세상을 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">생각과 \u003c/b>\u003cb class=\"key\">특징\u003c/b>으로 재현하면 세상을 있는 그대로 보지 못하는 대가가 따릅니다. 대신 우리는 \u003cb class=\"key\">가정, \u003c/b>\u003cb class=\"key\">동기, \u003c/b>\u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">경험\u003c/b>을 통해 세상을 봅니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>목격자 증언의 신뢰성 붕괴\u003csmall>결론 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>기억이 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">재현\u003c/b>으로 재구성된다는 발견은 \u003cb class=\"key\">목격자 \u003c/b>\u003cb class=\"key\">증언\u003c/b>의 법적 우위성을 완전히 손상시켰습니다. 이제 법정에서 목격자의 기억을 완벽한 증거로 보기 어렵습니다. \u003cb class=\"key\">보는 \u003c/b>\u003cb class=\"key\">것이 \u003c/b>\u003cb class=\"key\">믿는 \u003c/b>\u003cb class=\"key\">것은 \u003c/b>\u003cb class=\"key\">아닙니다\u003c/b>.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름을 네 단계로 나눠서 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계는 우리가 보는 것을 그대로 저장하지 않고 재구성한다는 주장입니다. 첫 문장에서 우리는 본 것을 교육을 통해 배운 모양과 색깔과 개념으로 해체한다고 말합니다. 두 번째 문장에서 아는 모든 것의 렌즈로 재부호화한다고 하고, 세 번째 문장에서 기억을 영상으로 꺼내는 것이 아니라 재구성한다고 정리합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계는 이런 재구성이 유용한 특성이라는 점을 설명합니다. 네 번째 문장의 This는 앞서 말한 재구성 능력을 가리키면서 유용한 특성이라고 말합니다. 다섯 번째 문장은 JPG 같은 최적의 이미지 압축 알고리즘에 비유해 정보를 효율적으로 저장한다고 합니다. 여섯 번째 문장은 완벽한 세부 기억을 가진 사람들이 일반화하고 학습한 것들을 연결하는 데 어려움을 겪는다고 말합니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 전환점입니다. 일곱 번째 문장에서 But으로 방향을 바꿔 추상적 생각과 특징으로 세상을 재현하는 데는 세상을 있는 그대로 보지 못하는 대가가 따른다고 말합니다. 여덟 번째 문장에서는 대신 우리가 가정과 동기와 과거 경험을 통해 세상을 바라본다고 설명합니다.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 결론입니다. 아홉 번째 문장은 기억이 영화처럼 재생되는 것이 아니라 추상적 재현으로 재구성된다는 발견이 목격자 증언의 법적 우위성을 완전히 손상시켰다고 말합니다. 열 번째 문장에서 보는 것이 믿는 것은 아니라는 말로 글을 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째부터 세 번째 문장에서 우리가 보는 것을 교육을 통해 배운 요소로 \u003cb class=\"key\">재부호화\u003c/b>하고 기억을 \u003cb class=\"key\">재구성\u003c/b>한다는 핵심 주장을 제시합니다. 네 번째 문장의 This가 앞선 주장을 받으며, 다섯 번째 문장에서 \u003cb class=\"key\">JPG \u003c/b>\u003cb class=\"key\">압축 \u003c/b>\u003cb class=\"key\">알고리즘\u003c/b>에 비유해 효율성을 근거로 듭니다. 일곱 번째 문장의 But이 전환점이 되어 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">재현\u003c/b>의 대가를 말하고, 마지막 문장에서 Seeing is not believing으로 결론을 맺습니다. 따라서 주제를 먼저 제시하고 이를 뒷받침하는 \u003cb class=\"key\">두괄식\u003c/b> 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>This (4)\u003c/b>\u003cspan>앞선 재구성 능력을 받는 지시어, 근거 제시\u003c/span>\u003cb>But (7)\u003c/b>\u003cspan>역접 전환\u003c/span>\u003cb>Instead (8)\u003c/b>\u003cspan>대체·재진술\u003c/span>\u003cb>Seeing is not believing (10)\u003c/b>\u003cspan>결론 신호\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">break it up into shapes, colors, and concepts\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">recode what we see through the lens of everything we know\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reconstruct memories\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">representing the world as abstract ideas and features\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">assumptions, motivations, and past experiences\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">abstract representations\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>생생한 원본 영상 기억\u003c/th>\u003cth>추상적 재구성 기억\u003c/th>\u003c/tr>\u003ctr>\u003ctd>영상 파일로 재생\u003c/td>\u003ctd>추상적 표상으로 재구성\u003c/td>\u003c/tr>\u003ctr>\u003ctd>비트맵 이미지처럼 비효율적\u003c/td>\u003ctd>JPG처럼 효율적 압축\u003c/td>\u003c/tr>\u003ctr>\u003ctd>세상을 있는 그대로 봄\u003c/td>\u003ctd>가정·동기·경험으로 봄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>목격자 증언 신뢰 유지\u003c/td>\u003ctd>목격자 증언 신뢰 손상\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 첫 부분에서 재구성이라는 주제를 제시하고, 이어서 효율성 근거와 한계를 제시한 뒤 결론을 맺는 두괄식 구조입니다. 세 번째 문장이 글의 주제문으로, 기억은 영상을 꺼내는 것이 아니라 재구성한다는 핵심 주장을 담고 있습니다. 먼저 주장을 제시하고 나머지 문장들이 이를 뒷받침하기 때문에 두괄식이라고 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"네 번째 문장의 This는 앞서 나온 재구성 능력을 가리키면서 근거를 시작하는 신호입니다. 일곱 번째 문장의 But은 흐름을 전환하는 역접 신호이고, 여덟 번째 문장의 Instead는 가정과 동기와 경험으로 대체하는 재진술입니다. 열 번째 문장의 Seeing is not believing은 글 전체를 요약하는 결론 신호로 볼 수 있습니다. 이 신호어들을 잡으면 글의 구조가 선명해집니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>automatically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>자동적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>break up into\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~으로 해체하다, 분해하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>concept\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개념\u003c/span>\u003c/div>\u003cdiv>\u003cb>recode\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재부호화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lens\u003c/b>\u003cem>명사\u003c/em>\u003cspan>렌즈\u003c/span>\u003c/div>\u003cdiv>\u003cb>reconstruct\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재구성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>retrieve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>생각해 내다, 검색하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>efficient\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효율적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>optimal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>최적의\u003c/span>\u003c/div>\u003cdiv>\u003cb>image compression algorithm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이미지 압축 알고리즘\u003c/span>\u003c/div>\u003cdiv>\u003cb>raw\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가공되지 않은\u003c/span>\u003c/div>\u003cdiv>\u003cb>bitmap image file\u003c/b>\u003cem>명사\u003c/em>\u003cspan>비트맵 이미지 파일\u003c/span>\u003c/div>\u003cdiv>\u003cb>lack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~이 없다, 부족하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ability\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>in perfect detail\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>완벽히 세세하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>struggle\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고군분투하다, 애쓰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>generalize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일반화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>represent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재현하다, 나타내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>abstract\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>추상적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>feature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특징, 특성\u003c/span>\u003c/div>\u003cdiv>\u003cb>come at a cost\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>희생을 치르다, 대가가 따르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>assumption\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가정, 추정\u003c/span>\u003c/div>\u003cdiv>\u003cb>motivation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동기\u003c/span>\u003c/div>\u003cdiv>\u003cb>past experience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>과거 경험\u003c/span>\u003c/div>\u003cdiv>\u003cb>discovery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발견\u003c/span>\u003c/div>\u003cdiv>\u003cb>representation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재현, 표상\u003c/span>\u003c/div>\u003cdiv>\u003cb>undermine\u003c/b>\u003cem>동사\u003c/em>\u003cspan>약화시키다, 손상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>legal primacy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>법적 우위성\u003c/span>\u003c/div>\u003cdiv>\u003cb>eyewitness testimony\u003c/b>\u003cem>명사\u003c/em>\u003cspan>목격자 증언\u003c/span>\u003c/div>\u003cdiv>\u003cb>Seeing is not believing\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>보는 것이 믿는 것은 아니다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번 지문에서 중요한 단어를 몇 개 짚어 볼게요. recode는 다시 부호화하다, reconstruct는 재구성하다, abstract representation은 추상적 재현이라는 뜻입니다. eyewitness testimony는 목격자 증언이고, undermine은 약화시키다 또는 손상시키다라는 뜻으로 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">reconstruct\u003c/b>\u003cspan class=\"m\">재구성하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rebuild\u003c/span>\u003cspan class=\"s\">reassemble\u003c/span>\u003cspan class=\"s\">restore\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">destroy\u003c/span>\u003cspan class=\"a\">demolish\u003c/span>\u003cspan class=\"a\">dismantle\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">efficient\u003c/b>\u003cspan class=\"m\">효율적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">effective\u003c/span>\u003cspan class=\"s\">productive\u003c/span>\u003cspan class=\"s\">economical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inefficient\u003c/span>\u003cspan class=\"a\">wasteful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">abstract\u003c/b>\u003cspan class=\"m\">추상적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conceptual\u003c/span>\u003cspan class=\"s\">theoretical\u003c/span>\u003cspan class=\"s\">intangible\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">concrete\u003c/span>\u003cspan class=\"a\">actual\u003c/span>\u003cspan class=\"a\">tangible\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">generalize\u003c/b>\u003cspan class=\"m\">일반화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">universalize\u003c/span>\u003cspan class=\"s\">infer\u003c/span>\u003cspan class=\"s\">broaden\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">specialize\u003c/span>\u003cspan class=\"a\">particularize\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">undermine\u003c/b>\u003cspan class=\"m\">약화시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">weaken\u003c/span>\u003cspan class=\"s\">damage\u003c/span>\u003cspan class=\"s\">impair\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">strengthen\u003c/span>\u003cspan class=\"a\">reinforce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">assumption\u003c/b>\u003cspan class=\"m\">가정\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">presumption\u003c/span>\u003cspan class=\"s\">supposition\u003c/span>\u003cspan class=\"s\">premise\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fact\u003c/span>\u003cspan class=\"a\">proof\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">represent\u003c/b>\u003cspan class=\"m\">재현하다, 나타내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">depict\u003c/span>\u003cspan class=\"s\">portray\u003c/span>\u003cspan class=\"s\">symbolize\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">misrepresent\u003c/span>\u003cspan class=\"a\">distort\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">retrieve\u003c/b>\u003cspan class=\"m\">생각해 내다, 검색하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recover\u003c/span>\u003cspan class=\"s\">recall\u003c/span>\u003cspan class=\"s\">fetch\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">forget\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 함께 정리해 둡시다. reconstruct는 rebuild나 reassemble과 동의어이고, destroy나 demolish와 반대입니다. efficient는 productive나 economical과 비슷하고, inefficient나 wasteful과 반대입니다. undermine은 weaken이나 damage와 비슷하고, strengthen이나 reinforce와 반대입니다. assumption은 presumption이나 premise와 비슷하고, fact나 proof와 반대입니다. 이렇게 묶어서 기억하면 어휘 문제에 강해져요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 무언가를 볼 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">see \u003c/span>\u003cspan class=\"tgt\">something,\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 그것을 자연스럽게 그리고 자동적으로 해체한다\u003c/span>\u003cspan class=\"en\">we naturally and automatically break it up\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모양, 색깔, 그리고 개념들로\u003c/span>\u003cspan class=\"en\">into shapes, colors, and concepts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 교육을 통해 배운\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">learned\u003c/span> through education.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 무언가를 볼 때, 우리는 그것을 자연스럽게 그리고 자동적으로 우리가 교육을 통해 배운 모양, 색깔, 그리고 개념들로 해체한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리의 지각이 단순한 녹화가 아니라 이미 배운 모양, 색깔, 개념으로 자동 분해되는 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">재부호화\u003c/b> 과정임을 보여 준다. break it up은 대상을 낱낱의 정보 조각으로 \u003cb class=\"key\">분해\u003c/b>한다는 뜻이다. 뒤에 나올 기억 재구성 논의의 \u003cb class=\"key\">도입부\u003c/b> 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 부사절\u003c/span> : [When + 주어 + 동사], [주절] : \"우리가 무언가를 볼 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사 that (목적격)\u003c/span> : [선행사 shapes, colors, and concepts] + [that + 주어 + 동사] : \"우리가 배운 (모양, 색깔, 개념들)\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"When we see something, 우리가 무언가를 볼 때. we naturally and automatically break it up, 우리는 그것을 자연스럽게 그리고 자동적으로 해체한다. into shapes, colors, and concepts, 모양, 색깔, 그리고 개념들로. that we have learned through education, 우리가 교육을 통해 배운. 이 문장 전체를 해석하면, 우리가 무언가를 볼 때, 우리는 그것을 자연스럽게 그리고 자동적으로 우리가 교육을 통해 배운 모양, 색깔, 그리고 개념들로 해체한다.","hl":"m"},{"n":13,"text":"이 문장은 우리가 사물을 볼 때 그냥 보는 게 아니라 이미 배운 모양과 색깔, 개념으로 자동 분해한다는 뜻이에요. 여기서 break it up은 대상을 작은 정보 조각으로 나눈다는 의미고, 뒤에 이어질 기억 재구성 논의의 도입부 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 When we see something, 이에요. when이 이끄는 부사절이 주절의 시간적 배경을 나타내고, 우리가 무언가를 볼 때라는 뜻으로 뒤에 오는 주절의 상황을 이끌어요. 두 번째 포인트는 that we have learned 인데요. that이 앞의 모양 색깔 개념들을 꾸미는 관계대명사절을 이끌고, 여기서 that은 learn의 목적어 자리라 생략할 수 있어요. 이 부분은 우리가 배운 이라는 뜻으로 선행사를 뒤에서 수식합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 우리가 보는 것을 재부호화한다\u003c/span>\u003cspan class=\"en\">We recode \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">see\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">렌즈를 통해\u003c/span>\u003cspan class=\"en\">through the lens\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 알고 있는 모든 것의\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">everything \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 우리가 알고 있는 모든 것의 렌즈를 통해 우리가 보는 것을 재부호화한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 번째 문장을 \u003cb class=\"key\">일반화\u003c/b>해, 우리가 보는 모든 것을 이미 아는 지식의 \u003cb class=\"key\">렌즈\u003c/b>로 다시 부호화한다고 말한다. through the lens of everything we know는 세상을 선입견이나 배경지식으로 해석한다는 \u003cb class=\"key\">비유\u003c/b>다. 이 문장에서 세 번째 문장의 기억 재구성으로 자연스럽게 이어진다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what (명사절)\u003c/span> : [what + 주어 + 동사] = the thing which + 주어 + 동사 : \"우리가 보는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : everything [(that) + 주어 + 동사] : \"우리가 알고 있는 모든 것\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"We recode what we see, 우리는 우리가 보는 것을 재부호화한다. through the lens, 렌즈를 통해. of everything we know, 우리가 알고 있는 모든 것의. 이 문장 전체를 해석하면, 우리는 우리가 알고 있는 모든 것의 렌즈를 통해 우리가 보는 것을 재부호화한다.","hl":"m"},{"n":16,"text":"이 문장은 앞의 내용을 일반화해서 우리가 보는 모든 것을 이미 알고 있는 지식의 렌즈로 다시 부호화한다고 말해요. through the lens of everything we know는 세상을 기존 지식과 경험이라는 틀로 해석한다는 비유예요. 이렇게 재부호화된 정보가 다음 문장의 기억 재구성으로 이어집니다.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 what we see 입니다. what은 선행사를 포함한 관계대명사라서 the thing which we see로 바꿔 이해할 수 있고, 문장에서는 recode의 목적어 역할을 해요. 두 번째 포인트는 everything we know 인데요. everything 뒤에 목적격 관계대명사 that이 생략된 구조로 우리가 알고 있는 모든 것이라는 뜻으로 앞의 everything을 수식합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 기억을 재구성한다\u003c/span>\u003cspan class=\"en\">We reconstruct memories\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각해 내기보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">retrieving\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영상을\u003c/span>\u003cspan class=\"en\">the video\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기억에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">memory\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 기억에서 영상을 생각해 내기보다 기억을 재구성한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 기억을 꺼내는 일은 비디오를 재생하는 것이 아니라 \u003cb class=\"key\">기억의 \u003c/b>\u003cb class=\"key\">재구성\u003c/b>이라고 선언한다. retrieving the video from memory라는 \u003cb class=\"key\">비유\u003c/b>를 통해 기억이 원본 보관이 아님을 강조한다. 이후 목격 증언의 신뢰성을 흔드는 논의의 핵심 전제가 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">rather than + 동명사구\u003c/span> : [rather than + 동명사구] : \"생각해 내기보다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 (출처)\u003c/span> : [from + 명사구] : \"기억에서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"We reconstruct memories, 우리는 기억을 재구성한다. rather than retrieving, 생각해 내기보다. the video, 영상을. from memory, 기억에서. 이 문장 전체를 해석하면, 우리는 기억에서 영상을 생각해 내기보다 기억을 재구성한다.","hl":"m"},{"n":19,"text":"이 문장은 기억은 비디오를 재생하는 것처럼 꺼내는 것이 아니라 재구성한다는 핵심 주장이에요. retrieving the video from memory라는 비유를 통해 기억이 마치 원본 영상처럼 보관되는 게 아니라는 점을 강조합니다. 이 주장은 뒤에서 목격 증언의 한계를 설명하는 전제가 됩니다.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 rather than retrieving 이에요. rather than은 뒤에 동명사구를 취해서 reconstruct memories와 retrieving the video from memory를 대조하고, 기억을 영상으로 인출하는 대신 재구성한다는 뜻을 만듭니다. 두 번째 포인트는 from memory 인데요. 기억 저장소에서라는 출처를 나타내는 전치사구로, retrieving the video from memory 전체가 비유적으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것은\u003c/span>\u003cspan class=\"en\">This\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유용한 특성\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">useful \u003c/span>\u003cspan class=\"tgt\">trait\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이것은 유용한 특성이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞에서 설명한 기억 재구성이 \u003cb class=\"key\">유용한 \u003c/b>\u003cb class=\"key\">특성\u003c/b>임을 간결하게 단정한다. 뒤에 이어지는 다섯 번째 문장에서 그 이유를 \u003cb class=\"key\">효율적인 \u003c/b>\u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">저장\u003c/b>으로 설명해 주므로, 네 번째 문장은 원인보다 결론을 먼저 제시하는 역할을 한다. 쉬운 문장이지만 지문 전체의 논지를 받아들이는 전환점이 된다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사구 주격보어\u003c/span> : This is + [a useful trait] (주격보어) : \"유용한 특성\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"This, 이것은. is, ~이다. a useful trait, 유용한 특성. 이 문장 전체를 해석하면, 이것은 유용한 특성이다.","hl":"m"},{"n":22,"text":"네 번째 문장은 앞서 설명한 기억 재구성 능력이 유용한 특성이라고 정리하는 문장이에요. 이 문장 자체는 아주 짧지만 뒤에서 효율적인 정보 저장 방식이라는 구체적 이유가 이어지기 때문에 논지 전환점 역할을 하죠. This는 앞 문장 내용을 가리키는 지시대명사예요.","hl":"mn"},{"n":23,"text":"어법 포인트는 주격보어입니다. be동사 is 뒤에 a useful trait라는 명사구가 와서 주어 This를 설명하는 이 형식 문장이에요. This가 앞서 나온 기억 재구성 방식을 가리키므로 자연스럽게 앞뒤가 연결됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 더 효율적인 방법이다\u003c/span>\u003cspan class=\"en\">It's a more efficient way\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정보를 저장하기 위한\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">store \u003c/span>\u003cspan class=\"tgt\">information\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약간 최적의 이미지 압축 알고리즘과 비슷한\u003c/span>\u003cspan class=\"en\">― a bit like an optimal image compression algorithm\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">JPG와 같은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">JPG\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가공되지 않은 비트맵 이미지 파일을 저장하기보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">storing\u003c/span> a raw bitmap image file.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 가공되지 않은 비트맵 이미지 파일을 저장하기보다 JPG와 같은 최적의 이미지 압축 알고리즘과 약간 비슷하게 정보를 저장하기 위한 더 효율적인 방법이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 네 번째 문장의 \u003cb class=\"key\">유용한 \u003c/b>\u003cb class=\"key\">특성\u003c/b>을 구체적으로 설명한다. 기억을 있는 그대로 저장하지 않고 JPG처럼 \u003cb class=\"key\">압축\u003c/b>해서 저장하는 것이 더 \u003cb class=\"key\">효율적\u003c/b>이라는 비유가 핵심이다. 특히 다섯 번째 문장의 대시 이하에서 추상적 재구성이 원본 파일 저장보다 효율적임을 비교해 보여 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : a way + to store information (to부정사구) : \"정보를 저장하기 위한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">such as + 예시\u003c/span> : such as + JPG (명사구) : \"JPG와 같은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">rather than + 동명사\u003c/span> : rather than + storing (동명사구) : \"저장하기보다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"It's a more efficient way, 그것은 더 효율적인 방법이다. to store information, 정보를 저장하기 위한. ― a bit like an optimal image compression algorithm, 약간 최적의 이미지 압축 알고리즘과 비슷한. such as JPG, JPG와 같은. rather than storing a raw bitmap image file, 가공되지 않은 비트맵 이미지 파일을 저장하기보다. 이 문장 전체를 해석하면, 그것은 가공되지 않은 비트맵 이미지 파일을 저장하기보다 JPG와 같은 최적의 이미지 압축 알고리즘과 약간 비슷하게 정보를 저장하기 위한 더 효율적인 방법이다.","hl":"m"},{"n":25,"text":"다섯 번째 문장은 기억 재구성이 왜 유용한지를 정보 저장의 효율성으로 설명해요. JPG라는 최적의 이미지 압축 알고리즘처럼 우리 뇌도 정보를 압축해서 저장한다는 비유가 핵심이에요. 가공되지 않은 비트맵 이미지 파일 저장과 비교하면서 효율성을 강조하고 있어요.","hl":"mn"},{"n":26,"text":"첫 번째 어법 포인트는 to store information에서 to부정사의 형용사적 용법입니다. 앞에 있는 명사 a more efficient way를 뒤에서 꾸며서 정보를 저장하기 위한 더 효율적인 방법이라고 해석해요. 두 번째 포인트는 such as JPG로, such as는 뒤에 예시를 붙여 JPG와 같은이라는 뜻을 나타냅니다. 세 번째 포인트는 rather than storing에서 rather than 뒤에 동명사 storing이 온 구조예요. 앞의 to store information과 대비하면서 가공되지 않은 비트맵 이미지 파일을 저장하기보다라는 비교를 만들어 냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 능력이 부족한 사람들은\u003c/span>\u003cspan class=\"en\">People \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">lack \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">ability\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 모든 것을 기억하는\u003c/span>\u003cspan class=\"en\">and remember everything\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완벽히 세세하게\u003c/span>\u003cspan class=\"en\">in perfect detail\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일반화하고 배우려고 고군분투한다\u003c/span>\u003cspan class=\"en\">struggle \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">generalize, \u003c/span>\u003cspan class=\"tgt\">learn, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 연결을 만든다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">make \u003c/span>\u003cspan class=\"tgt\">connections\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 배운 것들 사이에서\u003c/span>\u003cspan class=\"en\">between \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">learned\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 능력이 부족하고 완벽히 세세하게 모든 것을 기억하는 사람들은 일반화하고, 학습하고, 자신들이 학습한 것들 사이를 연결하려고 고군분투한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞선 효율성 설명과 대비되는 부작용을 보여 준다. \u003cb class=\"key\">모든 \u003c/b>\u003cb class=\"key\">것을 \u003c/b>\u003cb class=\"key\">완벽히 \u003c/b>\u003cb class=\"key\">기억\u003c/b>하는 사람들이 오히려 \u003cb class=\"key\">일반화\u003c/b>와 \u003cb class=\"key\">학습의 \u003c/b>\u003cb class=\"key\">연결\u003c/b>에 어려움을 겪는다는 것이다. 즉 기억을 재구성하는 능력이 없으면 정보는 많아도 학습과 사고에 불리할 수 있음을 알려 준다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사 who\u003c/span> : People + who + lack this ability (관계대명사절) : \"이런 능력이 부족한\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)과 병렬 구조\u003c/span> : struggle + to V1, V2, and V3 : \"일반화하고, 배우고, 연결을 만들기 위해 고군분투한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">선행사를 포함한 관계대명사 what\u003c/span> : between + what + they have learned (명사절) : \"그들이 배운 것들\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"People who lack this ability, 이런 능력이 부족한 사람들은. and remember everything, 그리고 모든 것을 기억하는. in perfect detail, 완벽히 세세하게. struggle to generalize, learn, 일반화하고 배우려고 고군분투한다. and make connections, 그리고 연결을 만든다. between what they have learned, 그들이 배운 것들 사이에서. 이 문장 전체를 해석하면, 이런 능력이 부족하고 완벽히 세세하게 모든 것을 기억하는 사람들은 일반화하고, 학습하고, 자신들이 학습한 것들 사이를 연결하려고 고군분투한다.","hl":"m"},{"n":28,"text":"여섯 번째 문장은 기억 재구성 능력이 부족한 사람들의 반대 사례를 제시해요. 모든 것을 완벽하게 기억하는 사람들은 오히려 일반화하거나 배운 것들을 연결하는 데 어려움을 겪는다고 말해요. 따라서 정보 저장의 효율성만 보여 준 다섯 번째 문장과 대비되면서 추상적 재구성이 학습에 꼭 필요하다는 점을 강조합니다.","hl":"mn"},{"n":29,"text":"첫 번째 포인트는 who lack this ability에서 주격 관계대명사 who입니다. 선행사 People을 수식하면서 who가 주어 역할을 하고 뒤에 lack라는 동사가 와요. 두 번째 포인트는 to generalize, learn, and make connections에서 to부정사의 부사적 용법입니다. struggle 뒤에 to부정사가 와서 애쓰는 목적을 나타내고 세 동사가 병렬로 연결되어 있어요. 세 번째 포인트는 what they have learned에서 선행사를 포함한 관계대명사 what입니다. what은 그들이 배운 것들이라는 뜻의 명사절을 만들어 전치사 between의 목적어 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 세상을 추상적 생각과 특징으로 재현하는 것은\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">representing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">abstract \u003c/span>\u003cspan class=\"tgt\">ideas \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">features\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">희생하여 나온다\u003c/span>\u003cspan class=\"en\">comes at a cost\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상을 있는 그대로 보는 것을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">seeing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">world \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 세상을 추상적 생각과 특징으로 재현하는 것은 세상을 있는 그대로 보는 것을 희생하여 나온다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 긍정적으로 설명한 추상적 재현의 효율성에 But으로 역접을 걸며, 세상을 추상화하면 정보 저장의 효율을 얻는 대신 \u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">그대로\u003c/b> 보는 것을 희생하게 된다고 지적합니다. comes at a cost of는 어떤 이득에 따른 \u003cb class=\"key\">희생\u003c/b>을 뜻하는 표현으로, 압축 저장의 장점 뒤에 \u003cb class=\"key\">인식의 \u003c/b>\u003cb class=\"key\">왜곡\u003c/b>이 따라온다는 글의 전환점이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [representing the world as abstract ideas and features (동명사구)] + [comes] : \"세상을 추상적 생각과 특징으로 재현하는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 of의 목적어로 쓰인 동명사구\u003c/span> : [of] + [seeing the world as it is (동명사구)] : \"세상을 있는 그대로 보는 것의\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"But representing the world as abstract ideas and features, 그러나 세상을 추상적 생각과 특징으로 재현하는 것은. comes at a cost, 희생하여 나온다. of seeing the world as it is, 세상을 있는 그대로 보는 것을.. 이 문장 전체를 해석하면, 그러나 세상을 추상적 생각과 특징으로 재현하는 것은 세상을 있는 그대로 보는 것을 희생하여 나온다.","hl":"m"},{"n":31,"text":"여기서는 앞에서 말한 추상적 재현의 효율성에 대해 But으로 방향을 전환해요. 세상을 추상적 생각과 특징으로 재현하는 것은 정보를 효율적으로 저장하는 이득을 얻는 대신, 세상을 있는 그대로 보는 것을 희생하고 나온다는 뜻이에요. comes at a cost of가 어떤 이득에 따른 희생을 나타내는 중요한 표현이에요.","hl":"mn"},{"n":32,"text":"첫 번째, representing the world as abstract ideas and features는 동명사구가 주어로 쓰였어요. 이 전체가 주어이기 때문에 단수 동사 comes가 왔어요. 두 번째, of seeing the world as it is에서 of 뒤에는 명사가 필요하므로 seeing을 동명사로 썼어요. as it is는 있는 그대로라는 관용 표현으로 묶어서 외워 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대신에,\u003c/span>\u003cspan class=\"en\">Instead,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 세상을 바라본다\u003c/span>\u003cspan class=\"en\">we see the world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 가정, 동기 그리고 과거 경험을 통해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">assumptions, \u003c/span>\u003cspan class=\"tgt\">motivations, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">past \u003c/span>\u003cspan class=\"tgt\">experiences\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대신에, 우리는 우리의 가정, 동기 그리고 과거 경험을 통해 세상을 바라본다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 내용을 Instead로 이어받아, 우리가 세상을 객관적으로 보지 못하고 \u003cb class=\"key\">가정\u003c/b>, \u003cb class=\"key\">동기\u003c/b>, \u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">경험\u003c/b>이라는 주관적 통로를 통해 본다고 설명합니다. 이는 우리의 지각이 사실 자체가 아니라 이미 \u003cb class=\"key\">해석된 \u003c/b>\u003cb class=\"key\">현실\u003c/b>임을 보여 주는 역할을 해요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구(through)의 수단·방법 용법\u003c/span> : [see] + [through + 명사구] : \"우리의 가정, 동기 그리고 과거 경험을 통해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">A, B, and C 병렬 구조\u003c/span> : [A], [B], and [C] : \"가정, 동기 그리고 과거 경험\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Instead, 대신에. we see the world, 우리는 세상을 바라본다. through our assumptions, motivations, and past experiences, 우리의 가정, 동기 그리고 과거 경험을 통해.. 이 문장 전체를 해석하면, 대신에, 우리는 우리의 가정, 동기 그리고 과거 경험을 통해 세상을 바라본다.","hl":"m"},{"n":34,"text":"앞 문장과 대조하면서 우리가 세상을 있는 그대로 보는 것이 아니라 우리의 가정, 동기, 과거 경험이라는 주관적인 통로를 통해 본다는 뜻이에요. through가 그 통로나 수단을 나타내고, 세 개의 명사가 병렬로 연결되어 있어요.","hl":"mn"},{"n":35,"text":"첫 번째, through our assumptions, motivations, and past experiences는 전치사 through가 이끄는 전치사구로, 세상을 바라보는 수단이나 방법을 나타내요. 두 번째, assumptions, motivations, and past experiences는 A, B, and C 형태의 병렬 구조예요. 같은 자리에 있는 명사 세 개가 and로 연결되어 리듬을 만들고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 발견은\u003c/span>\u003cspan class=\"en\">The discovery\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 기억이 추상적 재현을 통해 재구성된다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">memories \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">reconstructed \u003c/span>\u003cspan class=\"tgt\">through \u003c/span>\u003cspan class=\"tgt\">abstract \u003c/span>\u003cspan class=\"tgt\">representations \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영화처럼 재생되기보다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">played \u003c/span>\u003cspan class=\"tgt\">back \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">movie\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 손상시켰다\u003c/span>\u003cspan class=\"en\">completely undermined\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">목격자 증언의 법적 우위성을.\u003c/span>\u003cspan class=\"en\">the legal primacy of eyewitness testimony.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리의 기억이 영화처럼 재생되기보다는 추상적 재현을 통해 재구성된다는 발견은 목격자 증언의 법적 우위성을 완전히 손상시켰다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 기억이 영화처럼 재생되는 것이 아니라 추상적 재현을 통해 \u003cb class=\"key\">재구성\u003c/b>된다는 발견이 \u003cb class=\"key\">목격자 \u003c/b>\u003cb class=\"key\">증언\u003c/b>의 법적 우위성을 완전히 손상시켰다고 결론짓습니다. completely undermined는 \u003cb class=\"key\">법적 \u003c/b>\u003cb class=\"key\">우위성\u003c/b>을 완전히 무너뜨렸다는 뜻으로, 목격자의 기억도 재구성되므로 법정에서 절대적 증거로 보기 어렵다는 핵심 주장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격 that절\u003c/span> : The discovery + [that + S + V ~] : \"우리의 기억이 추상적 재현을 통해 재구성되기보다는 영화처럼 재생된다는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">준동사 병렬(과거분사)\u003c/span> : [be] + [reconstructed ~] rather than [played back ~] : \"추상적 재현을 통해 재구성되기보다는 영화처럼 재생되는\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"The discovery, 그 발견은. that our memories are reconstructed through abstract representations, 우리의 기억이 추상적 재현을 통해 재구성된다는. rather than played back like a movie, 영화처럼 재생되기보다는. completely undermined, 완전히 손상시켰다. the legal primacy of eyewitness testimony, 목격자 증언의 법적 우위성을.. 이 문장 전체를 해석하면, 우리의 기억이 영화처럼 재생되기보다는 추상적 재현을 통해 재구성된다는 발견은 목격자 증언의 법적 우위성을 완전히 손상시켰다.","hl":"m"},{"n":37,"text":"이 문장은 우리의 기억이 영화처럼 재생되는 것이 아니라 추상적 재현을 통해 재구성된다는 발견이 목격자 증언의 법적 우위성을 완전히 무너뜨렸다고 말해요. completely undermined는 완전히 손상시켰다는 뜻으로, 법정에서 목격자 증언을 절대적 진실로 보기 어렵게 만들었다는 핵심 결론이에요.","hl":"mn"},{"n":38,"text":"첫 번째, that our memories are reconstructed through abstract representations rather than played back like a movie는 앞의 The discovery의 내용을 설명하는 동격 that절이에요. 이 that은 명사절 접속사로 절 안에서 주어나 목적어 역할을 하지 않아요. 두 번째, reconstructed through abstract representations rather than played back like a movie는 are reconstructed와 are played back이 rather than으로 병렬 연결된 것인데, 뒤에 반복되는 are는 생략되고 과거분사 played만 남은 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Seeing\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">믿는 것이 아니다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">not\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">believing\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">보는 것이 믿는 것은 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글의 마지막 결론으로, 우리가 세상을 있는 그대로 보는 것이 아니라 \u003cb class=\"key\">재구성된 \u003c/b>\u003cb class=\"key\">기억\u003c/b>과 추상적 표상을 통해 본다는 앞선 논의를 한 문장으로 압축한다. 원래 속담 Seeing is believing을 뒤집어 '보는 것이 곧 믿는 것은 아니다'라고 반전시킴으로써 \u003cb class=\"key\">목격 \u003c/b>\u003cb class=\"key\">증언\u003c/b>의 신뢰가 약화된다는 주장을 강조한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : Seeing [동명사 주어] + is not [be동사 부정] + believing [동명사 보어] : \"보는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 부정문\u003c/span> : Seeing [주어] + is not [be동사 + not] + believing [보어] : \"~이 아니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동명사 주격 보어\u003c/span> : Seeing [주어] + is not [be동사 부정] + believing [동명사 주격 보어] : \"믿는 것\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"Seeing, 보는 것은. is not believing, 믿는 것이 아니다.. 이 문장 전체를 해석하면, 보는 것이 믿는 것은 아니다.","hl":"m"},{"n":40,"text":"이 문장은 글 전체를 마무리하는 결론 역할을 해요. 앞에서 우리의 기억이 원본 영상을 재생하는 게 아니라 추상적 표상으로 재구성된다고 했죠. 그래서 직접 눈으로 봤다고 해도 그것을 그대로 믿을 수는 없다는 뜻이에요. 원래 속담 Seeing is believing을 뒤집어 Seeing is not believing이라고 말하면서 목격 증언의 법적 권위가 무너졌다는 앞 문장을 강조하고 있습니다.","hl":"mn"},{"n":41,"text":"이 문장에서 문법 포인트는 세 가지 정도 짚어 볼게요. 첫 번째로 Seeing은 see에 ing가 붙은 동명사인데, 문장의 주어 자리에 왔어요. 동명사는 단수로 취급하니까 뒤에 is가 왔죠. 두 번째로 is not은 be동사 뒤에 not을 붙인 부정 표현이에요. 일반동사와 달리 be동사는 do 없이 not만으로 부정할 수 있어요. 세 번째로 believing은 believe에 ing가 붙은 동명사고, be동사 is 뒤에서 주어 Seeing을 설명하는 주격 보어 역할을 해요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>우리가 볼 때 사물을 교육으로 배운 \u003cb class=\"key\">모양·색깔·개념\u003c/b>으로 해체하고 \u003cb class=\"key\">재부호화\u003c/b>한다.\u003c/li>\u003cli>기억은 영상을 꺼내는 것이 아니라 \u003cb class=\"key\">재구성\u003c/b>이며, 이는 \u003cb class=\"key\">JPG \u003c/b>\u003cb class=\"key\">압축\u003c/b>처럼 효율적이다.\u003c/li>\u003cli>완벽한 세부 기억을 가진 사람은 \u003cb class=\"key\">일반화\u003c/b>와 \u003cb class=\"key\">연결\u003c/b>에 어려움을 겪는다.\u003c/li>\u003cli>이러한 재구성은 세상을 있는 그대로 보지 못하게 하여 \u003cb class=\"key\">목격자 \u003c/b>\u003cb class=\"key\">증언\u003c/b>의 법적 신뢰성을 \u003cb class=\"key\">손상\u003c/b>시켰다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Our memories are reconstructed through abstract representations rather than retrieved like a video, so seeing is not believing.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">인간의 지각과 기억은 영상을 재생하는 것이 아니라 \u003cb class=\"key\">추상적 \u003c/b>\u003cb class=\"key\">표상\u003c/b>으로 \u003cb class=\"key\">재구성\u003c/b>되며, 이는 효율적이지만 세상을 있는 그대로 보지 못하게 한다. 따라서 \u003cb class=\"key\">목격자 \u003c/b>\u003cb class=\"key\">증언\u003c/b>의 법적 신뢰성은 약화되고, 보는 것이 곧 믿는 것은 아니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 지문을 정리하면, 우리의 지각과 기억은 영상이 아니라 추상적 표상으로 재구성됩니다. 이 방식은 JPG처럼 효율적이지만 세상을 있는 그대로 보지 못하게 하고, 결국 목격자 증언의 신뢰성을 약화시킵니다. 보는 것이 믿는 것은 아니라는 마지막 문장을 꼭 기억하세요. 다음 시간에 다시 만나요.","hl":null}]}]});</script></body></html>
