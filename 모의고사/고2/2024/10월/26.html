</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 26번","audioDir":"26_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">26번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Douglas Kirkland: From Life Magazine to Iconic Portraits\u003c/h1>\u003ch2>더글라스 커클랜드: Life 잡지에서 상징적인 인물 사진까지\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">더글라스 \u003c/b>\u003cb class=\"key\">커클랜드\u003c/b>는 \u003cb class=\"key\">Life\u003c/b> 잡지 사진에 매료된 어린 시절을 거쳐 미국으로 건너가 \u003cb class=\"key\">사진작가\u003c/b>로 성장했고, \u003cb class=\"key\">Marilyn \u003c/b>\u003cb class=\"key\">Monroe\u003c/b> 사진으로 유명해졌으며 그의 \u003cb class=\"key\">포토 \u003c/b>\u003cb class=\"key\">에세이\u003c/b>는 미국인 절반 이상이 볼 정도로 큰 영향력을 가졌다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Douglas Kirkland, whose early fascination with Life magazine's photographs led him to become a photographer, gained fame for his iconic portraits of Marilyn Monroe and his photo essays that reached a vast American audience.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 전국연합학력평가 스물여섯 번째 지문을 함께 분석해 볼게요. 이 글은 사진작가 더글라스 커클랜드의 삶과 성공을 시간 순서로 보여 주는 지문이에요. 핵심은 그가 어린 시절 사진에 대한 관심을 바탕으로 미국에서 경력을 쌓아 상징적인 사진과 포토 에세이로 큰 영향력을 가지게 되었다는 거예요. 그럼 본격적으로 시작해 볼까요?","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">할리우드\u003c/b>는 미국 영화 산업의 중심지로, 유명 배우들의 초상 사진을 찍는 \u003cb class=\"key\">사진작가\u003c/b>들은 스타의 이미지를 만드는 중요한 역할을 했어요. \u003cb class=\"key\">Life\u003c/b> 잡지는 20세기 중반 미국에서 가장 영향력 있는 \u003cb class=\"key\">사진 \u003c/b>\u003cb class=\"key\">저널리즘\u003c/b> 잡지로, 전국적인 사진 보도를 통해 많은 사람들에게 시각적 경험을 제공했죠. \u003cb class=\"key\">포토 \u003c/b>\u003cb class=\"key\">에세이\u003c/b>는 여러 장의 사진을 연속적으로 배치해 하나의 이야기를 전달하는 형식으로, 단순한 스냅 사진보다 깊은 의미를 담을 수 있습니다. 당시 \u003cb class=\"key\">Marilyn \u003c/b>\u003cb class=\"key\">Monroe\u003c/b>는 할리우드를 대표하는 최고의 \u003cb class=\"key\">스타\u003c/b>였고, 그녀를 찍은 사진은 곧 대중의 관심을 끌 수 있었어요. 사진작가를 \u003cb class=\"key\">화가\u003c/b>에 비유하자면, 화가가 붓으로 그림을 그리듯 사진작가는 카메라로 빛과 구도를 조절해 인물의 \u003cb class=\"key\">개성\u003c/b>을 담아내는 거죠. 이런 배경 속에서 커클랜드는 자신의 재능을 펼칠 기회를 찾아 미국으로 향했답니다.\u003c/div>","segs":[{"n":2,"text":"이 지문을 이해하려면 먼저 할리우드와 사진 잡지의 배경을 알아두면 좋아요. 할리우드는 미국 영화 산업의 중심지로 유명 배우들의 초상 사진을 찍는 사진작가들이 스타의 이미지를 만드는 중요한 역할을 했어요. Life 잡지는 이십 세기 중반 미국에서 가장 영향력 있는 사진 저널리즘 잡지였고, 많은 사람들이 이 잡지를 통해 세상을 봤죠. 포토 에세이는 여러 장의 사진으로 하나의 이야기를 전달하는 형식이에요. 그리고 마릴린 먼로는 당시 할리우드를 대표하는 최고의 스타였기 때문에 그녀를 찍은 사진은 곧 대중의 관심을 끌 수 있었어요. 사진작가를 화가에 비유하자면 화가가 붓으로 그림을 그리듯 사진작가는 카메라로 빛과 구도를 조절해 인물의 개성을 담아내는 거예요. 이런 배경 속에서 커클랜드는 자신의 재능을 펼칠 기회를 찾아 미국으로 향했답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>어린 시절과 사진과의 만남\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>커클랜드는 캐나다 \u003cb class=\"key\">토론토\u003c/b>에서 태어나 할리우드 유명 인사의 \u003cb class=\"key\">예술적인 \u003c/b>\u003cb class=\"key\">인물 \u003c/b>\u003cb class=\"key\">사진\u003c/b>으로 알려지게 되었어요. 어렸을 때 그는 매주 도착하는 \u003cb class=\"key\">Life\u003c/b> 잡지를 \u003cb class=\"key\">간절히 \u003c/b>\u003cb class=\"key\">기다렸고\u003c/b>, 잡지에 실린 \u003cb class=\"key\">사진\u003c/b>에 대해 아버지와 \u003cb class=\"key\">토의\u003c/b>했습니다. 이는 그가 일찍부터 사진에 깊은 \u003cb class=\"key\">관심\u003c/b>을 가지게 된 배경을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>미국 이주와 경력 시작\u003csmall>전환 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>그는 더 나은 \u003cb class=\"key\">직업 \u003c/b>\u003cb class=\"key\">전망\u003c/b>이 있을 것이라고 \u003cb class=\"key\">믿고\u003c/b>, 고등학교 졸업 후 \u003cb class=\"key\">미국\u003c/b>으로 이주하여 \u003cb class=\"key\">사진 \u003c/b>\u003cb class=\"key\">스튜디오\u003c/b>에서 일자리를 찾았습니다. \u003cb class=\"key\">Look\u003c/b> 잡지사가 24세의 그를 \u003cb class=\"key\">고용\u003c/b>하면서 그는 역대 두 번째로 어린 \u003cb class=\"key\">사진작가\u003c/b>가 되었어요. 이는 그의 \u003cb class=\"key\">경력\u003c/b>이 본격적으로 시작되었음을 의미합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>상징적 사진과 다양한 촬영\u003csmall>성과 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>그가 1961년에 찍은 \u003cb class=\"key\">Marilyn \u003c/b>\u003cb class=\"key\">Monroe\u003c/b> 사진은 거의 즉시 \u003cb class=\"key\">상징적인\u003c/b> 것이 되었습니다. 그는 \u003cb class=\"key\">미국 \u003c/b>\u003cb class=\"key\">전역\u003c/b>에서 주중을 보내며 \u003cb class=\"key\">일상의 \u003c/b>\u003cb class=\"key\">삶\u003c/b>을 찍었고, \u003cb class=\"key\">이국적인 \u003c/b>\u003cb class=\"key\">장소\u003c/b>에서 주말을 보냈습니다. 이는 그의 활동이 \u003cb class=\"key\">유명 \u003c/b>\u003cb class=\"key\">인사\u003c/b> 초상뿐 아니라 \u003cb class=\"key\">다양한\u003c/b> 분야로 확장되었음을 보여 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>포토 에세이의 영향력\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>그의 \u003cb class=\"key\">포토 \u003c/b>\u003cb class=\"key\">에세이\u003c/b>는 최대 \u003cb class=\"key\">12페이지\u003c/b>에 달했고, \u003cb class=\"key\">전체 \u003c/b>\u003cb class=\"key\">미국인\u003c/b> 중 절반이 넘는 사람들이 그것을 보았습니다. 이는 그의 작업이 \u003cb class=\"key\">대중적\u003c/b>으로 얼마나 큰 \u003cb class=\"key\">영향력\u003c/b>을 가졌는지를 나타냅니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 커클랜드의 삶을 네 단계로 나누어 볼 수 있어요.","hl":null},{"n":4,"text":"첫 번째 단계는 어린 시절과 사진과의 만남이에요. 커클랜드는 캐나다 토론토에서 태어났고, 할리우드 유명 인사의 예술적인 인물 사진으로 알려지게 되었어요. 어렸을 때 그는 매주 도착하는 Life 잡지를 간절히 기다렸고, 잡지에 실린 사진에 대해 아버지와 토의했어요. 이를 통해 그가 일찍부터 사진에 깊은 관심을 가지게 되었다는 걸 알 수 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계는 미국 이주와 경력 시작이에요. 그는 더 나은 직업 전망이 있을 것이라고 믿고, 고등학교 졸업 후 미국으로 이주하여 사진 스튜디오에서 일자리를 찾았어요. Look 잡지사가 스물네 살의 그를 고용하면서 그는 역대 두 번째로 어린 사진작가가 되었죠. 이제 그의 경력이 본격적으로 시작된 거예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 상징적 사진과 다양한 촬영이에요. 그가 천구백육십일 년에 찍은 마릴린 먼로 사진은 거의 즉시 상징적인 것이 되었어요. 그는 미국 전역에서 주중을 보내며 일상의 삶을 찍었고, 이국적인 장소에서 주말을 보냈어요. 그의 활동이 유명 인사 초상뿐 아니라 다양한 분야로 확장된 거죠.","hl":"f2"},{"n":7,"text":"네 번째 단계는 포토 에세이의 영향력이에요. 그의 포토 에세이는 최대 열두 페이지에 달했고, 전체 미국인 중 절반이 넘는 사람들이 그것을 보았어요. 이를 통해 그의 작업이 대중적으로 얼마나 큰 영향력을 가졌는지 알 수 있어요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장이 주제문으로 커클랜드의 정체성과 명성을 제시하고, 이후 문장들이 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">순서\u003c/b>에 따라 그의 성장 과정과 성과를 구체적으로 서술합니다. 'When he was young', 'after graduating', 'at age 24', 'in 1961'과 같은 \u003cb class=\"key\">시간 \u003c/b>\u003cb class=\"key\">표현\u003c/b>이 반복되며 이야기가 전개됩니다. 따라서 이 글은 \u003cb class=\"key\">두괄식\u003c/b> 구조의 \u003cb class=\"key\">시간순\u003c/b> 서사입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When he was young (2)\u003c/b>\u003cspan>시간 배경\u003c/span>\u003cb>after graduating from high school (3)\u003c/b>\u003cspan>시간 순서\u003c/span>\u003cb>at age 24 (4)\u003c/b>\u003cspan>나이\u003c/span>\u003cb>in 1961 (5)\u003c/b>\u003cspan>연도\u003c/span>\u003cb>his weeks / his weekends (6)\u003c/b>\u003cspan>시간 분배\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">portraits\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">photographs\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">photos\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">photo essays\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간순 서사 구조이고, 첫 번째 문장이 주제문인 두괄식 구조예요. 첫 번째 문장에서 커클랜드의 정체성과 명성을 제시하고, 이후 문장들이 시간 순서에 따라 그의 성장 과정과 성과를 구체적으로 서술하고 있어요. When he was young, after graduating, at age 24, in 1961 같은 시간 표현이 반복되면서 이야기가 전개되죠.","hl":"ty"},{"n":9,"text":"신호어를 살펴볼게요. 두 번째 문장의 When he was young는 시간 배경을 나타내고, 세 번째 문장의 after graduating from high school는 시간 순서를 보여 줘요. 네 번째 문장의 at age 24는 나이를 나타내고, 다섯 번째 문장의 in 1961은 연도를 나타내죠. 여섯 번째 문장의 his weeks와 his weekends는 시간 분배를 보여 줍니다. 그리고 같은 개념을 바꿔 말한 표현으로 portraits에서 photographs, photos, photo essays로 이어지는 걸 볼 수 있어요. 이렇게 사진 관련 어휘가 점점 확장되면서 그의 작업 범위가 넓어지는 걸 알 수 있어요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>known for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 알려진\u003c/span>\u003c/div>\u003cdiv>\u003cb>portraits\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인물 사진\u003c/span>\u003c/div>\u003cdiv>\u003cb>celebrity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유명 인사\u003c/span>\u003c/div>\u003cdiv>\u003cb>eagerly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>간절히\u003c/span>\u003c/div>\u003cdiv>\u003cb>awaited\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기다렸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>weekly\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매주의\u003c/span>\u003c/div>\u003cdiv>\u003cb>arrival\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도착\u003c/span>\u003c/div>\u003cdiv>\u003cb>contained\u003c/b>\u003cem>동사\u003c/em>\u003cspan>담고 있었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>discussed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>토의했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>believing\u003c/b>\u003cem>동사\u003c/em>\u003cspan>믿으면서\u003c/span>\u003c/div>\u003cdiv>\u003cb>career prospects\u003c/b>\u003cem>명사\u003c/em>\u003cspan>직업 전망\u003c/span>\u003c/div>\u003cdiv>\u003cb>moved\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이주했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>graduating\u003c/b>\u003cem>동사\u003c/em>\u003cspan>졸업하면서\u003c/span>\u003c/div>\u003cdiv>\u003cb>found work\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>일자리를 찾았다\u003c/span>\u003c/div>\u003cdiv>\u003cb>photography studio\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사진 스튜디오\u003c/span>\u003c/div>\u003cdiv>\u003cb>hired\u003c/b>\u003cem>동사\u003c/em>\u003cspan>고용했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>second-you c과 비슷하고, reluctant, indifferent와 반대예요. await는 기다리다로 expect, anticipate와 동의어이고, ignore, disregard와는 반대 의미예요. discuss는 토의하다로 talk over, debate와 비슷하고, ignore, avoid와 반대예요. believe는 믿다로 trust, think와 동의어이고, doubt, disbelieve와 반대예요. hire는 고용하다로 employ, recruit와 동의어이고, fire, dismiss와 반대예요. iconic은 상징적인으로 symbolic, emblematic과 동의어이고, ordinary, unremarkable과 반대예요. exotic은 이국적인으로 foreign, unusual과 동의어이고, native, familiar와 반대예요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Douglas Kirkland는\u003c/span>\u003cspan class=\"en\">Douglas Kirkland,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">할리우드 유명 인사의 매우 예술적인 인물 사진으로 알려진\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">known \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">his \u003c/span>\u003cspan class=\"tgt\">highly \u003c/span>\u003cspan class=\"tgt\">artistic \u003c/span>\u003cspan class=\"tgt\">portraits \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Hollywood \u003c/span>\u003cspan class=\"tgt\">celebrities\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">캐나다 토론토에서 태어났다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">born \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">Toronto, \u003c/span>\u003cspan class=\"tgt\">Canada\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그의 할리우드 유명 인사의 매우 예술적인 인물 사진으로 알려진 Douglas Kirkland는 캐나다 토론토에서 태어났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 뒤에 이어질 Kirkland의 성장 과정을 소개하기 위한 \u003cb class=\"key\">도입 \u003c/b>\u003cb class=\"key\">문장\u003c/b>입니다. \u003cb class=\"key\">할리우드 \u003c/b>\u003cb class=\"key\">유명 \u003c/b>\u003cb class=\"key\">인사\u003c/b>의 \u003cb class=\"key\">예술적인 \u003c/b>\u003cb class=\"key\">인물 \u003c/b>\u003cb class=\"key\">사진\u003c/b>으로 잘 알려졌다는 점과 \u003cb class=\"key\">캐나다 \u003c/b>\u003cb class=\"key\">토론토\u003c/b> 출신이라는 기본 정보를 제시해요. known for...는 수동의 의미를 지닌 \u003cb class=\"key\">과거분사구\u003c/b>로 주어인 Douglas Kirkland를 수식합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구 (수식)\u003c/span> : [known (과거분사)] + [for + 명사구] : \"할리우드 유명 인사의 매우 예술적인 인물 사진으로 알려진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : [be동사] + [born (과거분사)] : \"캐나다 토론토에서 태어났다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Douglas Kirkland, Douglas Kirkland는. known for his highly artistic portraits of Hollywood celebrities, 할리우드 유명 인사의 매우 예술적인 인물 사진으로 알려진. was born in Toronto, Canada, 캐나다 토론토에서 태어났다.. 이 문장 전체를 해석하면, 그의 할리우드 유명 인사의 매우 예술적인 인물 사진으로 알려진 Douglas Kirkland는 캐나다 토론토에서 태어났다.","hl":"m"},{"n":13,"text":"이 문장은 앞으로 이야기할 Douglas Kirkland라는 인물을 처음 소개하는 도입 문장이에요. 할리우드 유명 인사들의 예술적인 인물 사진으로 잘 알려졌다는 점과 캐나다 토론토 출신이라는 기본 정보를 주고 있죠. known for로 시작하는 부분은 수동의 의미를 가진 과거분사구로 Douglas Kirkland를 뒤에서 수식합니다.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 known for his highly artistic portraits of Hollywood celebrities입니다. known은 know의 과거분사로 수동의 뜻을 담고 있으며, 뒤에 있는 for와 함께 앞의 Douglas Kirkland를 수식해요. 그래서 그의 할리우드 유명 인사의 매우 예술적인 인물 사진으로 알려진이라고 해석합니다. 두 번째 어법 포인트는 was born in Toronto, Canada 부분인데요. 이건 수동태 표현으로, 태어나다는 영어에서 be born으로 씁니다. born은 과거분사이고 was born은 그 자체로 태어났다는 의미로 굳어진 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 어렸을 때\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">young\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 매주 Life 잡지의 도착을 간절히 기다렸고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">eagerly \u003c/span>\u003cspan class=\"tgt\">awaited \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">weekly \u003c/span>\u003cspan class=\"tgt\">arrival \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">Life \u003c/span>\u003cspan class=\"tgt\">magazine \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 잡지가 담고 있는 사진에 대해 토의했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">discussed\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">photographs \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">magazine \u003c/span>\u003cspan class=\"tgt\">contained\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아버지와 함께.\u003c/span>\u003cspan class=\"en\">with his father.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그가 어렸을 때 그는 매주 “Life” 잡지의 도착을 간절히 기다렸고 그 잡지에 실린 사진에 대해 아버지와 함께 토의했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어린 Kirkland가 \u003cb class=\"key\">Life\u003c/b> 잡지를 \u003cb class=\"key\">간절히 \u003c/b>\u003cb class=\"key\">기다리며\u003c/b> 아버지와 사진을 이야기했다는 일화입니다. 잡지 사진에 대한 관심이 이후 사진작가가 되는 동기가 되었음을 암시해요. \u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">magazine \u003c/b>\u003cb class=\"key\">contained\u003c/b>에서 목적격 관계대명사가 생략된 점도 어법적으로 중요한 포인트입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간 부사절\u003c/span> : [When + 주어 + be동사 + 보어] : \"그가 어렸을 때\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : [주어 + 동사구 A] + [and] + [동사구 B] : \"그는 매주 Life 잡지의 도착을 간절히 기다렸고 ... 토의했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사 생략\u003c/span> : [선행사 the photographs] + [(목적격 관계대명사 that/which 생략) + the magazine + contained] : \"잡지가 담고 있는 사진\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"When he was young, 그가 어렸을 때. he eagerly awaited the weekly arrival of Life magazine, 그는 매주 Life 잡지의 도착을 간절히 기다렸고. and discussed the photographs the magazine contained, 그 잡지가 담고 있는 사진에 대해 토의했다. with his father, 아버지와 함께.. 이 문장 전체를 해석하면, 그가 어렸을 때 그는 매주 “Life” 잡지의 도착을 간절히 기다렸고 그 잡지에 실린 사진에 대해 아버지와 함께 토의했다.","hl":"m"},{"n":16,"text":"이 문장은 Kirkland가 어린 시절에 Life 잡지를 얼마나 좋아했는지 보여주는 일화입니다. 매주 잡지가 도착하기를 간절히 기다렸고 아버지와 사진에 대해 이야기했다는 내용이에요. 이 경험이 훗날 사진작가로서의 꿈을 키우는 밑거름이 되었을 거예요.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 When he was young입니다. when은 시간을 나타내는 접속사로 뒤에 완전한 절을 이끌어 그가 어렸을 때라는 시간의 부사절을 만들어요. 두 번째 어법 포인트는 awaited와 discussed가 and로 연결된 병렬 구조입니다. 같은 주어 he 뒤에 두 동사가 대등하게 이어져서 기다렸고 토의했다라고 해석해요. 세 번째 어법 포인트는 the photographs the magazine contained입니다. photographs라는 선행사 뒤에 목적격 관계대명사 that이나 which가 생략되어 있고, the magazine contained가 그 사진을 수식하는 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 나은 직업 전망이 있을 것이라고 믿으면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Believing \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">better \u003c/span>\u003cspan class=\"tgt\">career \u003c/span>\u003cspan class=\"tgt\">prospects\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Kirkland가 미국으로 이주했다\u003c/span>\u003cspan class=\"en\">Kirkland moved to the United States\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고등학교 졸업 후\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">after \u003c/span>\u003cspan class=\"tgt\">graduating \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">high \u003c/span>\u003cspan class=\"tgt\">school\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사진 스튜디오에서 일자리를 찾았다.\u003c/span>\u003cspan class=\"en\">and found work at a photography studio.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Kirkland는 더 나은 직업 전망이 있을 것이라고 믿으면서, 고등학교 졸업 후 그는 미국으로 이주하여 사진 스튜디오에서 일자리를 찾았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Kirkland가 미국으로 \u003cb class=\"key\">이주\u003c/b>하게 된 계기와 첫 직장을 구한 과정을 서술해요. 앞의 \u003cb class=\"key\">Believing\u003c/b> 분사구문은 '그렇게 믿어서'라는 \u003cb class=\"key\">원인\u003c/b>의 의미를 나타내고, 주어는 Kirkland입니다. \u003cb class=\"key\">after \u003c/b>\u003cb class=\"key\">graduating\u003c/b>은 전치사 after에 동명사가 결합한 표현으로 '고등학교 졸업 후'라는 뜻이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사구문\u003c/span> : [Believing (현재분사)] + [that절] : \"더 나은 직업 전망이 있을 것이라고 믿으면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">that절 (명사절)\u003c/span> : [Believing + that + 주어 + 조동사 + 동사원형] : \"더 나은 직업 전망이 있을 것이라는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : [after (전치사)] + [graduating (동명사구)] : \"고등학교 졸업 후\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Believing that he would have better career prospects, 더 나은 직업 전망이 있을 것이라고 믿으면서. Kirkland moved to the United States, Kirkland가 미국으로 이주했다. after graduating from high school, 고등학교 졸업 후. and found work at a photography studio, 사진 스튜디오에서 일자리를 찾았다.. 이 문장 전체를 해석하면, Kirkland는 더 나은 직업 전망이 있을 것이라고 믿으면서, 고등학교 졸업 후 그는 미국으로 이주하여 사진 스튜디오에서 일자리를 찾았다.","hl":"m"},{"n":19,"text":"이 문장은 Kirkland가 미국으로 이주하게 된 이유와 그 후의 행동을 설명합니다. Believing으로 시작하는 현재분사구문은 그가 더 나은 직업 전망이 있을 것이라고 믿었다는 원인이나 동시 상황을 나타내요. after graduating from high school은 고등학교 졸업 후라는 시간 표현입니다.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 Believing that he would have better career prospects입니다. 주어 Kirkland가 능동적으로 믿는 것이므로 현재분사 Believing을 썼고, 그가 더 나은 직업 전망이 있을 것이라고 믿으면서라는 뜻이에요. 두 번째 어법 포인트는 that절입니다. that이 이끄는 절이 Believing의 목적어 역할을 하며 더 나은 직업 전망이 있을 것이라는 내용을 전달해요. 세 번째 어법 포인트는 after graduating from high school입니다. after가 전치사로 쓰여서 뒤에 동명사 graduating이 왔고, 고등학교 졸업 후라는 시간의 의미를 나타냅니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Look 잡지사가 24살 나이의 그를 고용했을 때, 그는 그들의 역대 사진작가 중 두 번째로 어렸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">When \u003c/span>\u003cspan class=\"tgt\">Look \u003c/span>\u003cspan class=\"tgt\">magazine \u003c/span>\u003cspan class=\"tgt\">hired \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">at \u003c/span>\u003cspan class=\"tgt\">age \u003c/span>\u003cspan class=\"tgt\">24,\u003c/span> he became their second­youngest photographer ever.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">“Look” 잡지사가 24살 나이의 그를 고용했을 때 그는 그들의 역대 사진작가 중 두 번째로 어렸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Kirkland가 24세에 Look 잡지사에 고용되어 그 회사의 역대 \u003cb class=\"key\">두 \u003c/b>\u003cb class=\"key\">번째로 \u003c/b>\u003cb class=\"key\">어린\u003c/b> 사진작가가 되었다는
