    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;

}
lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 30번","audioDir":"30_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">30번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Collective Brains: Dividing the Giant Calculation\u003c/h1>\u003ch2>집단 두뇌: 거대한 계산 나누기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>우리는 \u003cb class=\"key\">정보, \u003c/b>\u003cb class=\"key\">시간, \u003c/b>\u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">능력\u003c/b>의 한계로 인해 모든 것을 혼자 계산할 수 없으므로, 거대한 계산을 \u003cb class=\"key\">인구 \u003c/b>\u003cb class=\"key\">전체에 \u003c/b>\u003cb class=\"key\">분배\u003c/b>하고 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">학습\u003c/b>을 통해 답을 얻는다. 각 개인은 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">계산의 \u003c/b>\u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">조각\u003c/b>을 맡아 \u003cb class=\"key\">사회의 \u003c/b>\u003cb class=\"key\">집합적 \u003c/b>\u003cb class=\"key\">두뇌\u003c/b>에 기여한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>We overcome our cognitive limitations by distributing computation across society and socially learning only how to interact with technologies, so each of us contributes a small part to society's collective brain.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘 함께 볼 지문은 전국연합학력평가 영어 독해 지문입니다. 이 글은 우리가 가진 정보와 시간과 인지 능력의 한계 때문에 계산을 사회 전체에 분배하고 올바른 답을 사회적으로 배운다는 내용을 다룹니다. 전체 요지를 한 문장으로 말하면, 인간은 정보와 시간과 인지 능력의 한계를 극복하기 위해 거대한 계산을 나누고 각자 작은 부분을 담당한다는 것입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">허버트 사이먼(Herbert Simon)은 인간이 \u003cb class=\"key\">정보\u003c/b>, \u003cb class=\"key\">시간\u003c/b>, \u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">능력\u003c/b>에서 한계를 지닌 존재임을 강조했어요. 이런 관점을 \u003cb class=\"key\">제한된 \u003c/b>\u003cb class=\"key\">합리성\u003c/b>(bounded rationality)이라고 부릅니다. 인간은 세상의 모든 지식을 혼자 담을 수 없기 때문에 사회 전체가 하나의 \u003cb class=\"key\">집단 \u003c/b>\u003cb class=\"key\">두뇌\u003c/b>(collective brain)처럼 기능합니다. 예를 들어 스마트폰의 내부 회로를 몰라도 터치 화면과 버튼만 누르면 원하는 기능을 쓸 수 있고, 변기 구조를 몰라도 물만 내리면 되는 것과 같습니다. 이처럼 각자가 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">계산\u003c/b>을 나누어 맡고, 그 결과를 \u003cb class=\"key\">세대\u003c/b>를 거쳐 전수하는 방식으로 지식이 축적됩니다.\u003c/div>","segs":[{"n":2,"text":"허버트 사이먼은 제한된 합리성, 영어로 bounded rationality 개념으로 유명한 학자예요. 인간은 정보와 시간과 인지 용량이 한정되어 있기 때문에 모든 것을 혼자 계산할 수 없습니다. 그래서 인간 사회는 집단 두뇌, collective brain처럼 작동합니다. 예를 들어 우리는 스마트폰 내부 회로를 몰라도 터치 화면과 버튼만 누르면 되고, 변기 구조를 몰라도 물만 내리면 되죠. 이처럼 사회 구성원 각자가 작은 계산을 나누어 맡고 그 결과를 세대를 거쳐 전수하면서 지식이 쌓입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>한계 인정과 계산 분배\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>사이먼은 \u003cb class=\"key\">정보\u003c/b>, \u003cb class=\"key\">시간\u003c/b>, \u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">능력\u003c/b>의 한계를 인정했다. 우리는 독립적으로 답을 계산할 \u003cb class=\"key\">자원\u003c/b>이 부족하므로 \u003cb class=\"key\">계산을 \u003c/b>\u003cb class=\"key\">인구 \u003c/b>\u003cb class=\"key\">전체에 \u003c/b>\u003cb class=\"key\">분배\u003c/b>하고 세대를 거쳐 천천히 답을 푼다. 이는 개인의 한계가 사회적 분업의 출발점임을 보여 준다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>사회적 학습과 인터페이스\u003csmall>주장 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>그러면 우리가 할 일은 \u003cb class=\"key\">올바른 \u003c/b>\u003cb class=\"key\">해답\u003c/b>을 \u003cb class=\"key\">사회적으로 \u003c/b>\u003cb class=\"key\">배우는\u003c/b> 것이다. 컴퓨터나 변기의 작동 원리를 이해할 필요 없이 \u003cb class=\"key\">인터페이스\u003c/b>를 사용하고 물만 내리면 된다. 전달될 것은 \u003cb class=\"key\">어떤 \u003c/b>\u003cb class=\"key\">버튼\u003c/b>을 눌러야 하는지, 곧 기술과 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">작용하는 \u003c/b>\u003cb class=\"key\">방법\u003c/b>이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>작은 조각에 두뇌 집중\u003csmall>전환 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>따라서 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">수용 \u003c/b>\u003cb class=\"key\">능력\u003c/b>보다 많은 정보를 담는 대신 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">두뇌\u003c/b>를 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">계산의 \u003c/b>\u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">조각\u003c/b>에 바칠 수 있다. 우리는 사물을 이득을 얻을 만큼 이해하면서도 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">전체\u003c/b>에 기여하는 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">계산\u003c/b>을 한다. 개인의 이해는 완전하지 않아도 전체 계산에는 충분하다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>집단 두뇌의 일부\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>결국 우리는 \u003cb class=\"key\">사회의 \u003c/b>\u003cb class=\"key\">집합적 \u003c/b>\u003cb class=\"key\">두뇌\u003c/b>를 위한 더 큰 계산에서 \u003cb class=\"key\">우리의 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 하고 있을 뿐이다. 개인의 작은 계산이 사회 전체의 지능에 연결된다. 이것이 바로 인간 협력과 지식 축적의 핵심 원리이다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 한계를 인정하고 계산을 분배한 뒤 사회적 학습을 거쳐 집단 두뇌로 이어지는 흐름이에요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 허버트 사이먼이 정보와 시간과 인지 능력의 한계를 인식한 점이 나옵니다. 우리는 스스로 답을 계산할 자원이 부족하기 때문에 계산을 인구 전체에 분배하고 세대에 걸쳐 천천히 답을 풀어요. 한계가 오히려 사회적 분업의 출발점이 되는 거죠.","hl":"f0"},{"n":5,"text":"세 번째 문장부터 다섯 번째 문장까지는 올바른 해답을 사회적으로 배우면 된다고 말합니다. 컴퓨터나 변기가 어떻게 작동하는지 알 필요 없이 인터페이스를 사용하고 물만 내리면 됩니다. 여기서 전달되어야 할 것은 어떤 버튼을 눌러야 하는지, 곧 기술과 상호 작용하는 방법이에요.","hl":"f1"},{"n":6,"text":"여섯 번째와 일곱 번째 문장에서는 우리의 정신적 수용 능력보다 많은 정보를 담는 대신 큰 두뇌를 거대한 계산의 작은 조각에 바칠 수 있다고 해요. 우리는 이득을 얻을 만큼 사물을 이해하지만 동시에 더 큰 전체에 기여하는 작은 계산을 하고 있죠. 개인의 이해가 완전하지 않아도 전체 계산에는 충분하다는 뜻입니다.","hl":"f2"},{"n":7,"text":"여덟 번째 문장은 결론으로 우리는 사회의 집합적 두뇌를 위한 더 큰 계산에서 각자의 역할을 하고 있을 뿐이라고 정리해 줍니다. 개인의 작은 계산이 사회 전체의 지능에 연결되는 거예요. 이것이 인간 협력과 지식 축적의 핵심 원리입니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 \u003cb class=\"key\">Herbert \u003c/b>\u003cb class=\"key\">Simon\u003c/b>의 수상 이유로 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">한계\u003c/b>를 제시하고, 두 번째 문장에서 \u003cb class=\"key\">계산의 \u003c/b>\u003cb class=\"key\">분배\u003c/b>라는 핵심 해결책을 바로 밝힌다. 이후 문장들은 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">학습\u003c/b>과 \u003cb class=\"key\">인터페이스\u003c/b>의 예시, 작은 조각 기여라는 부연이므로 \u003cb class=\"key\">두괄식\u003c/b>으로 볼 수 있다. 전체적으로 한계라는 문제에 대한 해결책을 제시하는 \u003cb class=\"key\">문제-해결\u003c/b> 구조이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>As (2)\u003c/b>\u003cspan>원인·이유\u003c/span>\u003cb>Then (3)\u003c/b>\u003cspan>결과·순서\u003c/span>\u003cb>essentially (5)\u003c/b>\u003cspan>환언·설명\u003c/span>\u003cb>rather than (5)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>And so (6)\u003c/b>\u003cspan>결과\u003c/span>\u003cb>but (7)\u003c/b>\u003cspan>대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">distribute the computation across the population\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">socially learn the right answers\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">how to interact with technologies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a small piece of a giant calculation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">small calculations that contribute to a larger whole\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a larger computation for our societies' collective brains\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>모든 정보를 개인이 이해·보유\u003c/th>\u003cth>계산을 분배하고 상호작용만 학습\u003c/th>\u003c/tr>\u003ctr>\u003ctd>정신적 수용 능력보다 많은 정보를 보유\u003c/td>\u003ctd>거대한 계산의 작은 조각에 두뇌를 집중\u003c/td>\u003c/tr>\u003ctr>\u003ctd>기술 작동 원리(how they work)\u003c/td>\u003ctd>버튼·인터페이스 사용(how to interact)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 문제 해결 구조에 가깝습니다. 앞부분에서 인간의 인지적 한계라는 문제를 제시하고 계산의 분배와 사회적 학습이라는 해결책을 제시하거든요. 주제문은 두 번째 문장이에요. 핵심 주장이 앞부분에 등장하고 뒤에서 예시와 부연을 하므로 두괄식으로 볼 수 있습니다.","hl":"ty"},{"n":9,"text":"신호어를 보면 As는 원인을, Then과 And so는 결과를 나타내요. essentially와 rather than은 앞의 표현을 바꿔 말하거나 대조를 보여 줍니다. 이 신호어들을 따라가면 문제에서 해결로 이어지는 논리를 놓치지 않아요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>win\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수상하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recognize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>limitation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>한계\u003c/span>\u003c/div>\u003cdiv>\u003cb>cognitive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인지적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>capacity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력, 수용 능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>lack\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부족하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>resource\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자원\u003c/span>\u003c/div>\u003cdiv>\u003cb>compute\u003c/b>\u003cem>동사\u003c/em>\u003cspan>계산하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>independently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>독립적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>distribute\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분배하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>computation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>계산, 연산\u003c/span>\u003c/div>\u003cdiv>\u003cb>population\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인구, 집단\u003c/span>\u003c/div>\u003cdiv>\u003cb>generation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세대\u003c/span>\u003c/div>\u003cdiv>\u003cb>socially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>사회적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>interface\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인터페이스, 접점\u003c/span>\u003c/div>\u003cdiv>\u003cb>flush\u003c/b>\u003cem>동사\u003c/em>\u003cspan>물을 내리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>transmit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>전달하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>button\u003c/b>\u003cem>명사\u003c/em>\u003cspan>버튼\u003c/span>\u003c/div>\u003cdiv>\u003cb>essentially\u003c/b>\u003cem>부사\u003c/em>\u003cspan>본질적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>interact\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상호 작용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rather than\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~보다는\u003c/span>\u003c/div>\u003cdiv>\u003cb>technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>instead of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~대신에\u003c/span>\u003c/div>\u003cdiv>\u003cb>hold\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보유하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정신적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>dedicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바치다\u003c/span>\u003c/div>\u003cdiv>\u003cb>giant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>거대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>calculation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>계산\u003c/span>\u003c/div>\u003cdiv>\u003cb>contribute\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>collective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>집합적인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"이번 지문에서 중요한 어휘를 몇 개 짚어 볼게요. limitation은 한계, cognitive capacity는 인지 능력입니다. distribute는 분배하다, computation은 계산이라는 뜻이고 transmit은 전달하다예요. contribute는 기여하다이니 결론 부분에서 꼭 잡아야 합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">limitation\u003c/b>\u003cspan class=\"m\">한계\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">restriction\u003c/span>\u003cspan class=\"s\">constraint\u003c/span>\u003cspan class=\"s\">drawback\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">advantage\u003c/span>\u003cspan class=\"a\">strength\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">capacity\u003c/b>\u003cspan class=\"m\">능력\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ability\u003c/span>\u003cspan class=\"s\">capability\u003c/span>\u003cspan class=\"s\">power\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inability\u003c/span>\u003cspan class=\"a\">weakness\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">distribute\u003c/b>\u003cspan class=\"m\">분배하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">allocate\u003c/span>\u003cspan class=\"s\">divide\u003c/span>\u003cspan class=\"s\">dispense\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">collect\u003c/span>\u003cspan class=\"a\">gather\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">transmit\u003c/b>\u003cspan class=\"m\">전달하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">convey\u003c/span>\u003cspan class=\"s\">pass on\u003c/span>\u003cspan class=\"s\">communicate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">receive\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">dedicate\u003c/b>\u003cspan class=\"m\">바치다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">devote\u003c/span>\u003cspan class=\"s\">commit\u003c/span>\u003cspan class=\"s\">assign\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">contribute\u003c/b>\u003cspan class=\"m\">기여하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">add\u003c/span>\u003cspan class=\"s\">provide\u003c/span>\u003cspan class=\"s\">donate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">withhold\u003c/span>\u003cspan class=\"a\">subtract\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"시험에 자주 나오는 동의어와 반의어도 정리해 둡시다. limitation은 restriction이나 constraint와 의미가 비슷하고 advantage와 strength가 반대 개념이에요. distribute는 allocate나 divide와 통하고 collect나 gather와 반대입니다. transmit은 convey나 pass on과 비슷하고 receive와 반대되죠. contribute는 add나 provide와 가깝고 withhold와 반대입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Herbert Simon은 그의 노벨상을 받았다\u003c/span>\u003cspan class=\"en\">Herbert Simon won his Nobel Prize\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 한계를 인지한 것으로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">recognizing \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">limitations\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정보, 시간, 그리고 인지적 능력에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">information, \u003c/span>\u003cspan class=\"tgt\">time, \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">cognitive \u003c/span>\u003cspan class=\"tgt\">capacity\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Herbert Simon은 정보, 시간, 그리고 인지적인 능력에서 우리의 한계를 인지한 것으로 그의 노벨상을 받았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 Herbert Simon이 노벨상을 받은 이유가 인간의 \u003cb class=\"key\">정보, \u003c/b>\u003cb class=\"key\">시간, \u003c/b>\u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">능력\u003c/b>에서의 한계를 인지했기 때문임을 밝힌다. 이는 뒤에서 인간이 계산을 분배하고 사회적으로 배우는 논의의 출발점이 된다. recognizing our limitations는 단순히 한계를 아는 것을 넘어 학문적으로 규명한 것을 뜻한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 for의 목적어로 쓰인 동명사구\u003c/span> : [for + recognizing our limitations (동명사구)] : \"우리의 한계를 인지한 것 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 in과 A, B, and C 병렬 구조\u003c/span> : [in + information, time, and cognitive capacity] : \"정보, 시간, 그리고 인지적 능력에서\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Herbert Simon won his Nobel Prize, Herbert Simon은 그의 노벨상을 받았다. for recognizing our limitations, 우리의 한계를 인지한 것으로. in information, time, and cognitive capacity, 정보, 시간, 그리고 인지적 능력에서. 이 문장 전체를 해석하면, Herbert Simon은 정보, 시간, 그리고 인지적인 능력에서 우리의 한계를 인지한 것으로 그의 노벨상을 받았다.","hl":"m"},{"n":13,"text":"이 문장은 Herbert Simon이 노벨상을 받은 이유가 인간이 정보, 시간, 인지적 능력에서 한계를 가지고 있다는 점을 인지했기 때문임을 말해 줘요. 여기서 recognizing our limitations는 단순히 아는 것을 넘어 학문적으로 규명한 것을 뜻하죠. 이 문장은 뒤에 나올 분배와 사회적 학습 논의의 출발점 역할을 합니다.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 for recognizing our limitations입니다. 전치사 for 뒤에 동명사 recognizing our limitations가 왔고, 우리의 한계를 인지한 것 때문에라는 이유를 나타내요. 동명사는 명사 역할을 하기 때문에 전치사의 목적어로 쓰일 수 있어요. 두 번째 포인트는 in information, time, and cognitive capacity입니다. 전치사 in이 한계가 존재하는 영역을 나타내고, 세 개의 명사가 and로 병렬 연결되어 있어요. 마지막 요소 앞에만 and를 쓰는 A, B, and C 구조라는 점을 기억하면 좋겠죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 독립적으로 해답을 계산하기 위한 자원이 부족하기 때문에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">lack \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">resources\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">compute \u003c/span>\u003cspan class=\"tgt\">answers \u003c/span>\u003cspan class=\"tgt\">independently\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 전체 인구에 걸쳐 그 계산을 분배하고\u003c/span>\u003cspan class=\"en\">we \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">distribute \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">computation \u003c/span>\u003cspan class=\"tgt\">across \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">population \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 세대에 걸쳐 해답을 천천히 풀어 낸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">solve \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">answer \u003c/span>\u003cspan class=\"tgt\">slowly\u003c/span>, generation by generation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 독립적으로 해답을 계산하기 위한 자원이 부족하기 때문에 우리는 전체 인구에 걸쳐 복잡한 계산을 분배하고 세대에 걸쳐 해답을 천천히 풀어 낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 인간이 각자 답을 계산할 \u003cb class=\"key\">자원\u003c/b>이 부족하기 때문에 \u003cb class=\"key\">계산을 \u003c/b>\u003cb class=\"key\">분배\u003c/b>하고 \u003cb class=\"key\">세대에 \u003c/b>\u003cb class=\"key\">걸쳐\u003c/b> 천천히 답을 풀어 낸다고 말한다. 자원 부족이 원인이고 계산 분배와 세대를 통한 해결이 결과라는 인과 구조를 잡는 것이 중요하다. 이 문장이 바로 집단적 계산이라는 글 전체 논리의 핵심 메커니즘을 제시한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">원인·이유의 부사절을 이끄는 접속사 As\u003c/span> : [As + 주어 + 동사 ~, 주절] : \"우리가 자원이 부족하기 때문에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : [the resources + to compute answers independently] : \"독립적으로 해답을 계산하기 위한 자원\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">and에 의한 동사구 병렬\u003c/span> : [distribute ... and solve ...] : \"계산을 분배하고 해답을 풀다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"As we lack the resources to compute answers independently, 우리가 독립적으로 해답을 계산하기 위한 자원이 부족하기 때문에. we distribute the computation across the population, 우리는 전체 인구에 걸쳐 그 계산을 분배하고. and solve the answer slowly, generation by generation, 그리고 세대에 걸쳐 해답을 천천히 풀어 낸다. 이 문장 전체를 해석하면, 우리는 독립적으로 해답을 계산하기 위한 자원이 부족하기 때문에 우리는 전체 인구에 걸쳐 복잡한 계산을 분배하고 세대에 걸쳐 해답을 천천히 풀어 낸다.","hl":"m"},{"n":16,"text":"이 문장은 인간이 각자 답을 계산할 자원이 부족하기 때문에 계산을 인구 전체에 분배하고 여러 세대에 걸쳐 천천히 답을 풀어 낸다고 말해요. 자원 부족이 원인이고 계산 분배와 세대를 통한 해결이 결과라는 인과 구조를 잡는 게 중요하죠. 이 문장이 바로 집단적 계산이라는 글 전체 논리의 핵심 메커니즘을 제시해요.","hl":"mn"},{"n":17,"text":"첫 번째 포인트는 문장 맨 앞의 As입니다. As는 여기서 이유를 나타내는 접속사로, 우리가 자원이 부족하기 때문에라는 뜻을 이끌어요. 두 번째 포인트는 to compute answers independently입니다. 이 to부정사는 앞의 the resources를 꾸며 주는 형용사적 용법으로, 독립적으로 해답을 계산하기 위한 자원이라는 뜻이에요. 세 번째 포인트는 and로 연결된 distribute와 solve입니다. 주어 we가 두 동작을 병렬로 하고 있는 구조로, 계산을 분배하고 해답을 풀어 낸다로 끊어서 보면 됩니다. generation by generation은 세대에 걸쳐라는 의미로, 천천히라는 부사 slowly와 함께 시간적 축적을 강조해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 우리가 해야 하는 모든 것은\u003c/span>\u003cspan class=\"en\">Then \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">do\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">올바른 해답을 사회적으로 배우는 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">socially \u003c/span>\u003cspan class=\"tgt\">learn\u003c/span> the right answers.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러면 우리가 해야 하는 모든 것은 올바른 해답을 사회적으로 배우는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 계산을 분배하고 세대에 걸쳐 답을 푼 결과, 개인이 할 일은 올바른 해답을 \u003cb class=\"key\">사회적으로 \u003c/b>\u003cb class=\"key\">배우는 \u003c/b>\u003cb class=\"key\">것\u003c/b>뿐이라고 말한다. 모든 것을 직접 이해할 필요 없이 사회적으로 검증된 정답을 받아들이면 된다는 뜻이다. 바로 뒤에 나오는 컴퓨터나 변기 사용 예시로 이어지는 연결 고리 역할을 한다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 that의 생략\u003c/span> : [all (that) we have to do] : \"우리가 해야 하는 모든 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">be동사 뒤의 원형부정사\u003c/span> : [All + S + have to do + is + (to) 동사원형] : \"사회적으로 배우는 것이다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Then all we have to do is, 그러면 우리가 해야 하는 모든 것은. socially learn the right answers, 올바른 해답을 사회적으로 배우는 것이다. 이 문장 전체를 해석하면, 그러면 우리가 해야 하는 모든 것은 올바른 해답을 사회적으로 배우는 것이다.","hl":"m"},{"n":19,"text":"이 문장은 앞 문장에서 계산을 분배하고 세대에 걸쳐 답을 푼 결과, 개인이 할 일은 올바른 해답을 사회적으로 배우는 것뿐이라고 말해요. 모든 것을 직접 이해할 필요 없이 사회적으로 검증된 정답을 받아들이면 된다는 뜻이죠. 바로 뒤에 나오는 컴퓨터나 변기 사용 예시로 이어지는 연결 고리 역할을 합니다.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 all we have to do입니다. 선행사 all 뒤에 관계대명사 that이 생략된 형태로, 우리가 해야 하는 모든 것이라는 뜻이에요. 두 번째 포인트는 is socially learn입니다. 주어가 All we have to do처럼 해야 하는 모든 것일 때, be동사 뒤에 to부정사 대신 원형부정사를 쓸 수 있어요. 그래서 to learn이 아니라 to가 생략된 learn이 오는 거죠. socially는 사회적으로라는 부사로 learn을 꾸며 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 이해할 필요가 없다\u003c/span>\u003cspan class=\"en\">You \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">understand\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 컴퓨터 혹은 변기가 어떻게 작동하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">computer \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">toilet \u003c/span>\u003cspan class=\"tgt\">works\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 단지 사용할 수 있기만 하면 된다\u003c/span>\u003cspan class=\"en\">you just need to \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">use \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인터페이스와 (변기의) 물 내림\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">interface \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">flush\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 여러분의 컴퓨터 혹은 변기가 어떻게 작동하는지 이해할 필요가 없고 여러분은 단지 인터페이스를 사용할 수 있고 (변기의) 물을 내릴 수 있기만 하면 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 컴퓨터나 변기처럼 익숙한 사례를 들어, \u003cb class=\"key\">작동 \u003c/b>\u003cb class=\"key\">원리\u003c/b>를 이해할 필요 없이 \u003cb class=\"key\">인터페이스\u003c/b>를 사용하고 변기 물을 내리는 \u003cb class=\"key\">사용법\u003c/b>만 알면 된다는 점을 보여 줍니다. 앞 문장에서 사회적으로 정답을 배운다는 말을 구체화하여, 전수되는 것은 기술 내부 지식이 아니라 상호 작용 방법임을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">need + to부정사 (to부정사의 명사적 용법)\u003c/span> : need [타동사] + to understand [to부정사구/목적어] : \"~할 필요가 없다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문 (의문사절)\u003c/span> : how + your computer or toilet [주어] + works [동사] : \"여러분의 컴퓨터 혹은 변기가 어떻게 작동하는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">be able to + 동사원형\u003c/span> : be able to + use [동사원형] : \"사용할 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">병렬 구조 (동사 병렬)\u003c/span> : use [V1] + the interface and flush [V2] : \"인터페이스를 사용하고 물을 내리다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"You don't need to understand, 여러분은 이해할 필요가 없다. how your computer or toilet works, 여러분의 컴퓨터 혹은 변기가 어떻게 작동하는지. you just need to be able to use, 여러분은 단지 사용할 수 있기만 하면 된다. the interface and flush, 인터페이스와 (변기의) 물 내림. 이 문장 전체를 해석하면, 여러분은 여러분의 컴퓨터 혹은 변기가 어떻게 작동하는지 이해할 필요가 없고 여러분은 단지 인터페이스를 사용할 수 있고 (변기의) 물을 내릴 수 있기만 하면 된다.","hl":"m"},{"n":22,"text":"이 문장은 컴퓨터나 변기처럼 우리가 쓰는 기술의 작동 원리를 다 이해할 필요는 없고 그저 인터페이스를 사용하고 물을 내리는 법만 알면 된다고 말해요. 앞 문장에서 사회적으로 정답을 배운다고 했는데 그 예로 기술 사용법만 전수받으면 충분하다는 겁니다.","hl":"mn"},{"n":23,"text":"첫 번째, need to understand에서 to부정사는 need의 목적어 역할을 해요. 두 번째, how your computer or toilet works는 의문사 how가 이끄는 간접의문문으로 how 다음에 주어 your computer or toilet, 동사 works 순서로 와요. 세 번째, be able to use는 able to 다음에 동사원형 use가 와서 능력을 나타내요. 네 번째, use the interface and flush는 use와 flush가 and로 병렬 연결된 동사 병렬 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전달될 필요가 있는 모든 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">All \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">needs \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">transmitted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 버튼을 눌러야 하는지\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">button \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">push\u003c/span> ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근본적으로 기술과 상호 작용하는 방법이다\u003c/span>\u003cspan class=\"en\">essentially how to interact with technologies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 작동하는 방법보다는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">they \u003c/span>\u003cspan class=\"tgt\">work\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">전달될 필요가 있는 모든 것은 어떤 버튼을 눌러야 하는지, 근본적으로 어떻게 그것들이 작동하는지보다는 기술과 상호 작용하는 방법이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞의 예시를 일반화해, 전달될 필요가 있는 것은 \u003cb class=\"key\">어떤 \u003c/b>\u003cb class=\"key\">버튼을 \u003c/b>\u003cb class=\"key\">눌러야 \u003c/b>\u003cb class=\"key\">하는지\u003c/b> 같은 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">작용 \u003c/b>\u003cb class=\"key\">방법\u003c/b>이지 \u003cb class=\"key\">작동 \u003c/b>\u003cb class=\"key\">원리\u003c/b>가 아니라고 정리합니다. 대시를 경계로 구체적 행동과 본질적 의미를 연결하며, 세대 간 전승의 핵심이 사용법임을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 that (주격)\u003c/span> : All + that [관계대명사/주격] + needs [동사] : \"전달될 필요가 있는 모든 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">need + to부정사의 수동태\u003c/span> : need + to be transmitted [to be + p.p.] : \"전달될 필요가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">의문사 + to부정사\u003c/span> : which button [의문사+명사] + to push [to부정사] : \"어떤 버튼을 눌러야 하는지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">rather than + 절 (대조)\u003c/span> : rather than + how they work [의문사절] : \"그것들이 작동하는 방법보다는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"All that needs to be transmitted, 전달될 필요가 있는 모든 것은. is, ~이다. which button to push ―, 어떤 버튼을 눌러야 하는지. essentially how to interact with technologies, 근본적으로 기술과 상호 작용하는 방법이다. rather than how they work, 그것들이 작동하는 방법보다는. 이 문장 전체를 해석하면, 전달될 필요가 있는 모든 것은 어떤 버튼을 눌러야 하는지, 근본적으로 어떻게 그것들이 작동하는지보다는 기술과 상호 작용하는 방법이다.","hl":"m"},{"n":25,"text":"이 문장은 전달되어야 할 내용이 기술 내부 작동 원리가 아니라 어떤 버튼을 눌러야 하는지 즉 기술과 상호 작용하는 방법이라고 정리해줘요. 앞 문장의 컴퓨터나 변기 예시를 일반화해서 세대를 거쳐 전수되는 것은 결국 사용법이라는 점을 분명히 해요.","hl":"mn"},{"n":26,"text":"첫 번째, All that needs to be transmitted에서 that은 선행사 All을 수식하는 관계대명사예요. 두 번째, needs to be transmitted는 need 다음에 to be transmitted가 와서 전달될 필요가 있다는 수동태 의미를 나타내요. 세 번째, which button to push와 how to interact with technologies는 의문사 which와 how 뒤에 to부정사가 연결된 의문사 더 to부정사 구조로 명사구 역할을 해요. 네 번째, rather than how they work는 그것들이 작동하는 방법보다는이라는 뜻으로 앞의 상호 작용 방법과 대조를 이뤄요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서\u003c/span>\u003cspan class=\"en\">And so\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 많은 정보를 가지는 것 대신에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">instead \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">holding \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">information \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 정신적 수용을 할 수 있는 것보다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">have \u003c/span>\u003cspan class=\"tgt\">mental \u003c/span>\u003cspan class=\"tgt\">capacity \u003c/span>\u003cspan class=\"tgt\">for\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 정말로 알아야 할 필요가 있는 것보다\u003c/span>\u003cspan class=\"en\">and indeed \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">need \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">know\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 우리의 큰 두뇌를 바칠 수 있다\u003c/span>\u003cspan class=\"en\">we could \u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"tgt\">dedicate \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">large \u003c/span>\u003cspan class=\"tgt\">brains \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거대한 계산의 작은 조각에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">piece\u003c/span> of a giant calculation.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇다면 우리가 정신적 수용을 할 수 있는 것보다 그리고 정말로 알아야 할 필요가 있는 것보다 더 많은 정보를 가지는 것 대신에 우리는 우리의 큰 두뇌를 거대한 계산의 작은 조각에 바칠 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전체 결론으로서, 감당 가능한 수준보다 더 많은 정보를 보유하기보다는 우리의 큰 두뇌를 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">계산\u003c/b>의 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">조각\u003c/b>에 바칠 수 있다고 말합니다. 이는 사회 전체가 거대한 계산을 나누어 수행하고 개인은 그중 일부를 맡는 \u003cb class=\"key\">분업\u003c/b> 구조를 함축합니다. 앞서 말한 기술 사용처럼 모든 것을 알 필요 없이 집단적 계산의 일부만 담당하면 된다는 글의 핵심을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 instead of + 동명사\u003c/span> : instead of + holding [동명사] + more information : \"더 많은 정보를 가지는 것 대신에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 more ~ than + 주어 + 동사\u003c/span> : more information than + we have mental capacity for : \"우리가 정신적 수용을 할 수 있는 것보다 더 많은 정보\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">need + to부정사\u003c/span> : need + to know [to부정사/목적어] : \"알아야 할 필요가 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">4\u003c/span>\u003cspan class=\"gn\">dedicate A to B (A를 B에 바치다)\u003c/span> : dedicate + our large brains [A] + to + a small piece [B] : \"우리의 큰 두뇌를 작은 조각에 바치다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"And so, 그래서. instead of holding more information, 더 많은 정보를 가지는 것 대신에. than we have mental capacity for, 우리가 정신적 수용을 할 수 있는 것보다. and indeed need to know, 그리고 정말로 알아야 할 필요가 있는 것보다. we could dedicate our large brains, 우리는 우리의 큰 두뇌를 바칠 수 있다. to a small piece of a giant calculation, 거대한 계산의 작은 조각에. 이 문장 전체를 해석하면, 그렇다면 우리가 정신적 수용을 할 수 있는 것보다 그리고 정말로 알아야 할 필요가 있는 것보다 더 많은 정보를 가지는 것 대신에 우리는 우리의 큰 두뇌를 거대한 계산의 작은 조각에 바칠 수 있다.","hl":"m"},{"n":28,"text":"이 문장은 전체 글의 결론으로 우리가 감당할 수 있는 것보다 더 많은 정보를 머릿속에 다 넣으려 하지 말고 우리의 큰 두뇌를 거대한 계산의 작은 조각 하나에 바칠 수 있다고 말해요. 즉 사회 전체로 보면 거대한 계산을 나눠서 하고 개인은 그중 작은 한 부분을 맡아 기여한다는 뜻이에요. 정보를 다 알 필요 없이 일부만 알아도 집단적 계산에 참여할 수 있다는 거죠.","hl":"mn"},{"n":29,"text":"첫 번째, instead of holding more information에서 instead of는 전치사이므로 뒤에 동명사 holding이 왔어요. 두 번째, more information than we have mental capacity for에서는 more than 비교구문이 쓰였고 뒤에 for는 목적어가 앞의 information과 같아서 생략되어 홀로 남은 전치사예요. 세 번째, need to know는 need 다음에 to부정사 know가 목적어로 온 구조예요. 네 번째, dedicate our large brains to a small piece는 dedicate A to B 즉 A를 B에 바치다라는 구동사 구조로 큰 두뇌를 작은 조각에 바친다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 사물을 충분히 잘 이해한다\u003c/span>\u003cspan class=\"en\">We understand things \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">well \u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들로부터 이득을 얻을 만큼\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">benefit \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">them\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그동안 내내\u003c/span>\u003cspan class=\"en\">but \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">while\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 작은 계산을 하고 있다\u003c/span>\u003cspan class=\"en\">we are making \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">small \u003c/span>\u003cspan class=\"tgt\">calculations \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 큰 전체에 기여하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">contribute \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">larger \u003c/span>\u003cspan class=\"tgt\">whole\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 그것들로부터 이득을 얻기에 충분할 정도로 사물을 잘 이해하지만 그러면서 우리는 더 큰 전체에 기여하는 작은 계산을 하고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리가 사물을 완벽히 이해하지는 못해도 \u003cb class=\"key\">이득을 \u003c/b>\u003cb class=\"key\">얻기에 \u003c/b>\u003cb class=\"key\">충분할 \u003c/b>\u003cb class=\"key\">정도\u003c/b>로만 이해하면 된다는 뜻이에요. 그와 동시에 우리의 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">계산\u003c/b>들이 모여 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">전체\u003c/b>에 기여한다고 말하고 있어요. 앞 문장에서 말한 큰 계산의 일부를 우리 뇌가 담당하는 흐름을 이어 주는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">enough + to부정사의 부사적 용법(정도)\u003c/span> : enough(부사) + to부정사구 : \"이득을 얻을 만큼 충분히 잘\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관용 부사구\u003c/span> : all + the + while : \"그동안 내내\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사 + that + 동사 : \"더 큰 전체에 기여하는 작은 계산\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"We understand things well enough, 우리는 사물을 충분히 잘 이해한다. to benefit from them, 그것들로부터 이득을 얻을 만큼. but all the while, 하지만 그동안 내내. we are making small calculations, 우리는 작은 계산을 하고 있다. that contribute to a larger whole, 더 큰 전체에 기여하는. 이 문장 전체를 해석하면, 우리는 그것들로부터 이득을 얻기에 충분할 정도로 사물을 잘 이해하지만 그러면서 우리는 더 큰 전체에 기여하는 작은 계산을 하고 있다.","hl":"m"},{"n":31,"text":"이 문장은 우리가 사물을 완벽히 이해하지 못해도 그로부터 이득을 얻을 만큼만 이해하면 된다는 이야기예요. 그러면서도 우리가 하는 작은 계산들이 모여 더 큰 전체에 기여한다는 뜻이에요. 결국 개인의 한정된 이해가 집단적 계산의 일부로 이어진다는 흐름을 보여줘요.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 well enough to benefit from them이에요. enough가 well을 수식하고 to benefit은 부사적 용법의 to부정사라서 이득을 얻을 만큼 충분히 잘이라는 뜻이 돼요. 두 번째는 all the while이라는 관용 표현인데 그동안 내내라는 뜻으로 두 절을 자연스럽게 연결해 줘요. 세 번째는 that contribute to a larger whole에 나오는 관계대명사 that이에요. that은 선행사 calculations를 받으면서 뒤에 동사 contribute가 오는 주격 관계대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 단지 우리의 역할을 하고 있다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">doing \u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">part\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 큰 복잡한 계산에서\u003c/span>\u003cspan class=\"en\">in a larger computation\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 사회의 집합적인 두뇌를 위한\u003c/span>\u003cspan class=\"en\">for \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">our \u003c/span>\u003cspan class=\"tgt\">societies' \u003c/span>\u003cspan class=\"tgt\">collective \u003c/span>\u003cspan class=\"tgt\">brains\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 우리 사회의 집합적인 두뇌를 위한 더 큰 복잡한 계산에서 단지 우리의 역할을 하고 있는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 우리 개개인은 \u003cb class=\"key\">집합적인 \u003c/b>\u003cb class=\"key\">두뇌\u003c/b>라는 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">계산\u003c/b> 속에서 \u003cb class=\"key\">자기 \u003c/b>\u003cb class=\"key\">역할\u003c/b>만 하면 된다는 결론을 정리하는 문장이에요. 사회 전체가 하나의 두뇌처럼 계산을 나눠 수행한다는 비유를 마무리해요. 에세이의 핵심 주제를 압축해서 제시하는 문장이에요.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재진행형\u003c/span> : be동사 + doing : \"단지 우리의 역할을 하고 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">복수 명사의 소유격\u003c/span> : 복수명사 + 어포스트로피(') : \"우리 사회들의 집합적인 두뇌\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"We are just doing our part, 우리는 단지 우리의 역할을 하고 있다. in a larger computation, 더 큰 복잡한 계산에서. for our societies' collective brains, 우리 사회의 집합적인 두뇌를 위한. 이 문장 전체를 해석하면, 우리는 우리 사회의 집합적인 두뇌를 위한 더 큰 복잡한 계산에서 단지 우리의 역할을 하고 있는 것이다.","hl":"m"},{"n":34,"text":"이 문장은 우리 개개인이 집합적인 두뇌라는 더 큰 계산 속에서 자기 역할만 하면 된다는 결론을 정리해요. 사회 전체가 하나의 두뇌처럼 계산을 나눠 수행한다는 비유를 마무리하고 있어요. 에세이의 핵심 주제를 압축해서 제시하는 문장이죠.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 are just doing our part에요. be동사와 doing이 함께 쓰인 현재진행형이라서 우리가 역할을 하고 있는 중이라는 의미를 전달해요. 두 번째는 our societies' collective brains에 나오는 소유격이에요. societies가 s로 끝나는 복수 명사라서 어포스트로피만 붙여 소유격을 만들었어요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>인간은 \u003cb class=\"key\">정보\u003c/b>, \u003cb class=\"key\">시간\u003c/b>, \u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">능력\u003c/b>에서 한계를 지닌다.\u003c/li>\u003cli>따라서 우리는 \u003cb class=\"key\">계산을 \u003c/b>\u003cb class=\"key\">인구 \u003c/b>\u003cb class=\"key\">전체에 \u003c/b>\u003cb class=\"key\">분배\u003c/b>하고 \u003cb class=\"key\">세대에 \u003c/b>\u003cb class=\"key\">걸쳐\u003c/b> 답을 푼다.\u003c/li>\u003cli>우리가 할 일은 \u003cb class=\"key\">올바른 \u003c/b>\u003cb class=\"key\">해답\u003c/b>을 \u003cb class=\"key\">사회적으로 \u003c/b>\u003cb class=\"key\">배우고\u003c/b> 기술은 \u003cb class=\"key\">인터페이스\u003c/b>만 사용하는 것이다.\u003c/li>\u003cli>각자의 \u003cb class=\"key\">큰 \u003c/b>\u003cb class=\"key\">두뇌\u003c/b>는 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">계산의 \u003c/b>\u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">조각\u003c/b>을 맡아 \u003cb class=\"key\">사회의 \u003c/b>\u003cb class=\"key\">집합적 \u003c/b>\u003cb class=\"key\">두뇌\u003c/b>에 기여한다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>We overcome our cognitive limitations by distributing computation across society and socially learning only how to interact with technologies, so each of us contributes a small part to society's collective brain.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">우리는 \u003cb class=\"key\">정보, \u003c/b>\u003cb class=\"key\">시간, \u003c/b>\u003cb class=\"key\">인지 \u003c/b>\u003cb class=\"key\">능력\u003c/b>의 한계로 인해 모든 것을 혼자 계산할 수 없으므로, 거대한 계산을 \u003cb class=\"key\">인구 \u003c/b>\u003cb class=\"key\">전체에 \u003c/b>\u003cb class=\"key\">분배\u003c/b>하고 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">학습\u003c/b>을 통해 답을 얻는다. 각 개인은 \u003cb class=\"key\">거대한 \u003c/b>\u003cb class=\"key\">계산의 \u003c/b>\u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">조각\u003c/b>을 맡아 \u003cb class=\"key\">사회의 \u003c/b>\u003cb class=\"key\">집합적 \u003c/b>\u003cb class=\"key\">두뇌\u003c/b>에 기여한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"지금까지 이 글의 핵심을 정리하면 우리는 인지적 한계 때문에 모든 정보를 알 필요가 없습니다. 대신 계산을 사회 전체에 분배하고 인터페이스만 배워서 작은 조각을 담당하면 됩니다. 그렇게 각자의 작은 계산이 사회의 집합적 두뇌에 기여합니다. 오늘 수업 여기까지입니다, 수고 많았어요.","hl":null}]}]});</script></body></html>
