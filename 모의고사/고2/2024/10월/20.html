</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"2024년 고1 10월","title":"2024년 고1 10모 20번","audioDir":"20_audio","preview":false,"count":39,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">20번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2024년 고1 10모\u003c/div>\u003ch1>Work Out While You Work: Exercise in Household Chores\u003c/h1>\u003ch2>일상 집안일 속 짧은 운동의 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>운동할 시간을 내는 것은 계속되는 도전이지만, 집안일을 단순한 의무로 보지 말고 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">활동을 \u003c/b>\u003cb class=\"key\">위한 \u003c/b>\u003cb class=\"key\">기회\u003c/b>로 활용하여 \u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">운동\u003c/b>을 일상의 집안일에 포함시키면 \u003cb class=\"key\">건강을 \u003c/b>\u003cb class=\"key\">향상\u003c/b>시킬 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>You can improve your health by seizing inevitable household chores as opportunities to incorporate quick exercises into your daily routine.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"여러분 안녕하세요. 오늘은 전국연합학력평가 지문 하나를 함께 분석해 볼게요. 이 글은 운동할 시간이 부족한 우리에게 집안일 속에서 짧은 운동을 실천하자고 제안하는 글이에요. 핵심은 별도 운동 시간을 내기 어려울 때 일상의 집안일을 신체 활동 기회로 바꾸는 것이죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">현대인은 앉아서 생활하는 시간이 길어지면서 \u003cb class=\"key\">좌식 \u003c/b>\u003cb class=\"key\">생활방식\u003c/b>이 건강을 위협해요. 별도로 운동 시간을 내지 않고 일상 활동에서 소비하는 에너지를 \u003cb class=\"key\">비운동성 \u003c/b>\u003cb class=\"key\">활동 \u003c/b>\u003cb class=\"key\">열생산\u003c/b>, 즉 NEAT라고 해요. 집안일, 계단 오르기, 장보기 같은 움직임이 여기에 해당하죠. 본문의 짧은 운동 통합은 마치 끼니 대신 간식을 조금씩 챙겨 먹는 것과 같아요. 작은 활동이라도 자주 쌓이면 건강에 도움이 된다는 \u003cb class=\"key\">누적 \u003c/b>\u003cb class=\"key\">효과\u003c/b>가 중요해요.\u003c/div>","segs":[{"n":2,"text":"여러분도 아침부터 학원까지 앉아만 있는 날이 많을 거예요. 활동량이 줄면 건강에 좋지 않다는 건 다 알죠. 그래서 굳이 헬스장에 가지 않아도 생활 속 움직임을 늘리는 게 중요한데요. 이런 일상 속 활동을 비운동성 활동 열생산, 즉 NEAT라고 부릅니다. 집안일이나 계단 오르기, 장보기 같은 움직임이 여기에 해당해요. 마치 시간이 없어 밥을 거르기 어려울 때 간식을 조금씩 챙겨 먹는 것처럼, 짧은 운동을 틈틈이 쌓는 게 도움이 돼요. 본문은 바로 이 점을 활용한 조언이에요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>운동 시간의 부족\u003csmall>도입·통념 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>우리 중 다수에게 운동할 시간을 내는 것은 \u003cb class=\"key\">계속되는 \u003c/b>\u003cb class=\"key\">도전\u003c/b>이다. 업무에 대한 전념과 가족 의무 사이에서 일정이 빡빡해 \u003cb class=\"key\">전념할 \u003c/b>\u003cb class=\"key\">운동\u003c/b>을 넣을 여유가 없다고 느낀다. 이는 많은 사람이 공감하는 현실이다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>일상 속 운동 제안\u003csmall>전환·주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>하지만 운동이 일상 한가운데로 찾아온다면 어떨까 하고 질문을 던진다. 바로 \u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">운동을 \u003c/b>\u003cb class=\"key\">집안일에 \u003c/b>\u003cb class=\"key\">통합\u003c/b>하는 아름다움이 작동하는 지점이다. 별도 시간을 내지 않고 일상 속에서 움직일 방법을 제안한다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>집안일의 불가피성\u003csmall>근거·현실 인정 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>현실적으로 집안일은 \u003cb class=\"key\">불가피\u003c/b>하다. 설거지나 쓰레기 버리기는 일상생활의 \u003cb class=\"key\">필수적인 \u003c/b>\u003cb class=\"key\">부분\u003c/b>이다. 누구나 반드시 해야 하는 일이라는 점을 짚는다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>기회로 전환과 건강 효과\u003csmall>해결·적용·예시 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>집안일을 의무로만 보지 말고 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">활동 \u003c/b>\u003cb class=\"key\">기회\u003c/b>로 삼자고 제안한다. 주전자가 끓기를 기다리며 스쿼트나 벽에 대고 하는 팔굽혀펴기를 하는 것이 예이다. 짧은 운동을 일상 집안일에 포함시키면 \u003cb class=\"key\">건강을 \u003c/b>\u003cb class=\"key\">향상\u003c/b>시킬 수 있다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 운동 시간 부족이라는 문제에서 시작해 집안일을 운동 기회로 바꾸는 해결책으로 흘러가요.","hl":null},{"n":4,"text":"첫 번째 단계는 첫 문장부터 두 번째 문장까지예요. 우리 중 많은 사람에게 운동할 시간을 내는 것은 계속되는 도전이라고 말해요. 업무에 대한 전념과 가족 의무 사이에서 빡빡한 일정에 전념할 운동이 들어갈 자리가 없다고 느끼는 거죠. 많은 직장인과 학생이 공감할 만한 현실이에요.","hl":"f0"},{"n":5,"text":"두 번째 단계는 세 번째 문장부터 네 번째 문장까지예요. 여기서 But이라는 전환어가 나오면서 운동이 일상 한가운데로 찾아온다면 어떨까 질문을 던져요. 그 답이 바로 짧은 운동을 집안일에 통합하는 아름다움이 작동하는 지점이라고 하죠. 별도의 운동 시간을 만들지 말고 일상 속에서 움직임을 확보하자는 주장이에요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 다섯 번째 문장부터 여섯 번째 문장까지예요. 이제 현실을 인정하는데요. 집안일은 불가피하다고 말해요. 설거지를 하든 쓰레기를 내다 버리든 이런 일들은 일상생활의 필수적인 부분이라는 거예요. 누구나 해야 하는 일이니 그 시간을 활용하자는 논리로 이어져요.","hl":"f2"},{"n":7,"text":"마지막 네 번째 단계는 일곱 번째 문장부터 아홉 번째 문장까지예요. 집안일을 순전히 의무적인 행위로 보지 말고 신체 활동을 위한 기회로 잘 이용해 보라고 제안해요. 예를 들어 아침 주전자가 끓기를 기다리면서 스쿼트를 연습하거나 벽에 대고 하는 팔굽혀펴기 몇 개를 시작해 보라고 하죠. 이렇게 짧은 운동을 일상 집안일에 포함시키면 건강을 향상시킬 수 있다고 마무리해요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 4번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 운동할 시간 부족이라는 \u003cb class=\"key\">문제\u003c/b>를 제기하고, 집안일에 짧은 운동을 통합하는 \u003cb class=\"key\">해결책\u003c/b>을 제시한다. 주제문은 네 번째 문장으로, 일상 속에서 운동을 만나는 핵심 아이디어가 중간에 등장한다. 앞부분은 문제와 전환을, 뒷부분은 근거와 예시를 더해 결론으로 마무리하는 \u003cb class=\"key\">중괄식\u003c/b> 구조이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>전환\u003c/span>\u003cb>rather than (7)\u003c/b>\u003cspan>대조·제안\u003c/span>\u003cb>For instance (8)\u003c/b>\u003cspan>예시\u003c/span>\u003cb>Incorporating (9)\u003c/b>\u003cspan>결론\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">making time for exercise\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">a dedicated workout\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">the workout\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mini-exercises\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">physical activity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">squats or wall push-ups\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">quick exercises\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>집안일을 의무로만 보는 관점\u003c/th>\u003cth>집안일을 운동 기회로 보는 관점\u003c/th>\u003c/tr>\u003ctr>\u003ctd>purely obligatory activities\u003c/td>\u003ctd>opportunities for physical activity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>해야만 하는 부담\u003c/td>\u003ctd>건강을 위한 투자\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 문제 해결 구조예요. 운동할 시간이 부족하다는 문제를 제기하고 집안일에 짧은 운동을 통합하는 해결책을 제시하죠. 주제문은 네 번째 문장으로 글의 중간에 자리 잡고 있어요. 앞부분에서 문제를 던지고 뒷부분에서 근거와 예시를 더해 결론을 내리는 중괄식 구조라고 할 수 있어요.","hl":"ty"},{"n":9,"text":"신호어를 살펴보면 세 번째 문장의 But이 문제를 해결책으로 전환하는 역할을 해요. 일곱 번째 문장의 rather than은 집안일을 의무로 보는 관점과 기회로 보는 관점을 대조해 주죠. 그리고 여덟 번째 문장의 For instance는 스쿼트와 벽에 대고 하는 팔굽혀펴기라는 구체적 예시를 소개해요. 이렇게 전환어와 예시 신호어를 잡으면 글의 흐름이 훨씬 잘 보여요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>make time for\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~할 시간을 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>continuing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>계속되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>challenge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도전, 어려운 일\u003c/span>\u003c/div>\u003cdiv>\u003cb>work commitments\u003c/b>\u003cem>명사\u003c/em>\u003cspan>업무 책임\u003c/span>\u003c/div>\u003cdiv>\u003cb>family obligations\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가족 의무\u003c/span>\u003c/div>\u003cdiv>\u003cb>packed schedules\u003c/b>\u003cem>명사\u003c/em>\u003cspan>빽빽한 일정\u003c/span>\u003c/div>\u003cdiv>\u003cb>dedicated workout\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전념하는 운동\u003c/span>\u003c/div>\u003cdiv>\u003cb>in the midst of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 한가운데에\u003c/span>\u003c/div>\u003cdiv>\u003cb>daily routine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일상\u003c/span>\u003c/div>\u003cdiv>\u003cb>beauty\u003c/b>\u003cem>명사\u003c/em>\u003cspan>아름다움, 장점\u003c/span>\u003c/div>\u003cdiv>\u003cb>integrate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>통합하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>mini-exercises\u003c/b>\u003cem>명사\u003c/em>\u003cspan>짧은 운동\u003c/span>\u003c/div>\u003cdiv>\u003cb>household chores\u003c/b>\u003cem>명사\u003c/em>\u003cspan>집안일\u003c/span>\u003c/div>\u003cdiv>\u003cb>come into play\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>작동하다, 효과를 내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>realistic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>현실적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>inevitable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불가피한\u003c/span>\u003c/div>\u003cdiv>\u003cb>essential\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>필수적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>obligatory\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의무적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>seize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잡다, 이용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>physical activity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신체 활동\u003c/span>\u003c/div>\u003cdiv>\u003cb>for instance\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>예를 들어\u003c/span>\u003c/div>\u003cdiv>\u003cb>squats\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스쿼트\u003c/span>\u003c/div>\u003cdiv>\u003cb>engage in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>wall push-ups\u003c/b>\u003cem>명사\u003c/em>\u003cspan>벽에 대고 하는 팔굽혀펴기\u003c/span>\u003c/div>\u003cdiv>\u003cb>incorporate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함시키다, 통합하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quick exercises\u003c/b>\u003cem>명사\u003c/em>\u003cspan>짧은 운동\u003c/span>\u003c/div>\u003cdiv>\u003cb>daily chores\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일상적인 집안일\u003c/span>\u003c/div>\u003cdiv>\u003cb>improve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>향상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>health\u003c/b>\u003cem>명사\u003c/em>\u003cspan>건강\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 어휘를 몇 개 짚어 볼게요. make time for는 누구를 위해 시간을 내다는 뜻이고, challenge는 도전이나 어려운 일이에요. household chores는 집안일이고, inevitable은 불가피한, obligatory는 의무적인 뜻이에요. seize는 잡다, 이용하다인데 여기서는 기회를 잘 이용하라는 의미로 쓰였어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">challenge\u003c/b>\u003cspan class=\"m\">도전, 어려운 일\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">difficulty\u003c/span>\u003cspan class=\"s\">obstacle\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ease\u003c/span>\u003cspan class=\"a\">comfort\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">integrate\u003c/b>\u003cspan class=\"m\">통합하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">combine\u003c/span>\u003cspan class=\"s\">merge\u003c/span>\u003cspan class=\"s\">incorporate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">separate\u003c/span>\u003cspan class=\"a\">divide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inevitable\u003c/b>\u003cspan class=\"m\">불가피한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unavoidable\u003c/span>\u003cspan class=\"s\">certain\u003c/span>\u003cspan class=\"s\">necessary\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">avoidable\u003c/span>\u003cspan class=\"a\">optional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">essential\u003c/b>\u003cspan class=\"m\">필수적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">necessary\u003c/span>\u003cspan class=\"s\">vital\u003c/span>\u003cspan class=\"s\">crucial\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">optional\u003c/span>\u003cspan class=\"a\">unnecessary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">obligatory\u003c/b>\u003cspan class=\"m\">의무적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">mandatory\u003c/span>\u003cspan class=\"s\">required\u003c/span>\u003cspan class=\"s\">compulsory\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">optional\u003c/span>\u003cspan class=\"a\">voluntary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">seize\u003c/b>\u003cspan class=\"m\">잡다, 이용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">grab\u003c/span>\u003cspan class=\"s\">take\u003c/span>\u003cspan class=\"s\">capture\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">release\u003c/span>\u003cspan class=\"a\">miss\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">improve\u003c/b>\u003cspan class=\"m\">향상시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">enhance\u003c/span>\u003cspan class=\"s\">boost\u003c/span>\u003cspan class=\"s\">better\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">worsen\u003c/span>\u003cspan class=\"a\">diminish\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 함께 정리해 둘게요. challenge는 difficulty나 obstacle과 바꿔 쓸 수 있고, 반대말은 ease 정도가 있어요. integrate는 combine이나 merge와 유사하고, separate와 반대예요. inevitable은 unavoidable과 뜻이 같고, avoidable이나 optional과 반대예요. obligatory는 mandatory나 required와 같고, voluntary와 반대가 되죠. seize는 grab이나 take와 유사하고, release나 miss와 반대예요. improve는 enhance나 boost와 뜻이 같고, worsen과 반대가 돼요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리 중 다수에게\u003c/span>\u003cspan class=\"en\">For many of us,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운동할 시간을 내는 것은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">time \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">exercise\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~이다\u003c/span>\u003cspan class=\"en\">is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">계속되는 도전\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">continuing \u003c/span>\u003cspan class=\"tgt\">challenge\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리 중 다수에게, 운동할 시간을 내는 것은 계속되는 도전이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 운동 시간을 내는 것이 많은 사람에게 계속되는 \u003cb class=\"key\">도전\u003c/b>임을 말하며, 글 서두에서 문제 상황을 제시합니다. 'making time for exercise'는 \u003cb class=\"key\">동명사구\u003c/b>로 주어 역할을 하고, 'a continuing challenge'는 \u003cb class=\"key\">현재분사\u003c/b> continuing이 challenge를 수식합니다. 추상적인 시간 부족 문제를 challenge로 압축해 독자의 공감을 이끕니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [making time for exercise] + [is] + [a continuing challenge] : \"운동할 시간을 내는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사의 형용사적 용법\u003c/span> : [a continuing] + [challenge] : \"계속되는 도전\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"For many of us, 우리 중 다수에게. making time for exercise, 운동할 시간을 내는 것은. is, ~이다. a continuing challenge, 계속되는 도전. 이 문장 전체를 해석하면, 우리 중 다수에게, 운동할 시간을 내는 것은 계속되는 도전이다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 많은 사람이 운동 시간을 내는 것을 계속되는 도전이라고 말합니다. making time for exercise가 주어이고 is가 동사, a continuing challenge가 보어입니다. 직장과 가정 일로 운동 시간이 부족한 현실을 도입부에서 제시하는 거죠.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 making time for exercise입니다. 여기서 making은 동명사구를 이끌어 문장의 주어 역할을 해요. 동사 make에 ing가 붙었고 뒤에 목적어 time과 전치사구 for exercise가 함께 와서 전체가 주어가 됩니다. 두 번째 어법 포인트는 a continuing challenge입니다. continuing은 현재분사로 뒤 명사 challenge를 수식하는 형용사 역할을 해요. 같은 ing라도 주어 자리의 making은 동명사, 명사 앞 continuing은 현재분사라는 점을 구별해야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">업무에 대한 전념과 가족 의무 사이에서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Between \u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003cspan class=\"tgt\">commitments \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">family \u003c/span>\u003cspan class=\"tgt\">obligations\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 ~처럼 느껴진다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">feels \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여유가 없다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">there's \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">room\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리의 빽빽한 일정들에는\u003c/span>\u003cspan class=\"en\">in our packed schedules\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전념하는 운동을 위한\u003c/span>\u003cspan class=\"en\">for a dedicated workout.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">업무에 대한 전념과 가족 의무 사이에서, 우리의 빽빽한 일정들에는 운동에 전념할 여유가 없는 것처럼 종종 느껴진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 직장 일과 가족 의무 때문에 \u003cb class=\"key\">운동할 \u003c/b>\u003cb class=\"key\">여유\u003c/b>가 없다는 느낌을 구체화합니다. \u003cb class=\"key\">Between \u003c/b>\u003cb class=\"key\">A \u003c/b>\u003cb class=\"key\">and \u003c/b>\u003cb class=\"key\">B\u003c/b> 전치사구가 배경을 제시하고, \u003cb class=\"key\">there \u003c/b>\u003cb class=\"key\">is \u003c/b>\u003cb class=\"key\">구문\u003c/b>과 no room이 일정의 포화 상태를 강조합니다. 이는 앞 문장의 continuing challenge에 대한 원인으로 기능합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">Between A and B 전치사구\u003c/span> : [Between A and B] + [it often feels like] + [there's no room] : \"업무에 대한 전념과 가족 의무 사이에서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비인칭 주어 it\u003c/span> : [it] + [feels like] + [절] : \"종종 ~처럼 느껴진다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">there is 구문\u003c/span> : [there] + [is] + [no room] : \"여유가 없다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Between work commitments and family obligations, 업무에 대한 전념과 가족 의무 사이에서. it often feels like, 종종 ~처럼 느껴진다. there's no room, 여유가 없다. in our packed schedules, 우리의 빽빽한 일정들에는. for a dedicated workout, 전념하는 운동을 위한. 이 문장 전체를 해석하면, 업무에 대한 전념과 가족 의무 사이에서, 우리의 빽빽한 일정들에는 운동에 전념할 여유가 없는 것처럼 종종 느껴진다.","hl":"m"},{"n":16,"text":"두 번째 문장은 직장 일과 가족 의무 사이에서 운동할 시간이 없다는 느낌을 구체적으로 설명합니다. it often feels like는 무엇이 그렇게 느껴지는지 뒤에 there is 구문으로 제시하고, no room과 packed schedules를 통해 일정이 가득 차 있음을 강조합니다. 결과적으로 첫 번째 문장의 continuing challenge를 구체적 원인으로 뒷받침하는 역할을 합니다.","hl":"mn"},{"n":17,"text":"첫 번째 어법 포인트는 Between work commitments and family obligations입니다. Between A and B 구조로 A와 B가 병렬 연결된 전치사구가 문장 앞에서 배경을 제시해요. 두 번째는 it often feels like인데, 여기서 it은 특정한 것을 가리키지 않는 비인칭 주어입니다. feel like 다음에 절을 붙여 어떤 느낌인지 설명합니다. 세 번째는 there's no room입니다. there is 구문으로 존재 여부를 나타내고, no room은 전혀 여유가 없다는 뜻이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003  + [in the midst of] + [your daily routine] : \"여러분의 일상 바로 한가운데에서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"But, 그러나. what if the workout came to you, 만약 운동이 여러분을 찾아온다면 어떨까. right in the midst, 바로 한가운데에서. of your daily routine?, 여러분의 일상. 이 문장 전체를 해석하면, 그러나 만약 여러분의 일상 바로 한가운데에서 운동이 여러분을 찾아온다면 어떨까?","hl":"m"},{"n":19,"text":"세 번째 문장은 그러나 하고 반전을 일으키면서, 운동이 우리 일상의 한가운데로 직접 찾아온다면 어떨까 하고 질문합니다. what if 다음에 과거 시제 came을 써서 실제가 아닌 가정의 상황을 상상하게 만들죠. 이 물음은 앞에서 말한 시간 부족 문제에 대한 해결 가능성을 열어 주는 역할을 합니다.","hl":"mn"},{"n":20,"text":"첫 번째 어법 포인트는 what if the workout came to you입니다. What if 다음에 과거형 came을 쓰는 것은 가정법 과거로, 현실이 아니라 상상 속 상황을 나타냅니다. 두 번째는 right in the midst of your daily routine입니다. in the midst of는 무엇의 한가운데에라는 뜻이고, right가 그 위치를 강조합니다. 따라서 운동이 일상 한복판으로 찾아오는 장면을 생생하게 그려 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 바로 ~한 지점이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">That's \u003c/span>\u003cspan class=\"tgt\">where\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">간단한 운동을 집안일에 통합시키는 아름다움이\u003c/span>\u003cspan class=\"en\">the beauty of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">integrating \u003c/span>\u003cspan class=\"tgt\">mini­exercises \u003c/span>\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">household \u003c/span>\u003cspan class=\"tgt\">chores\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">작동한다\u003c/span>\u003cspan class=\"en\">comes into play.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것이 바로 간단한 운동을 집안일에 통합시키는 아름다움이 작동하는 지점이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장의 질문, 즉 운동이 나를 찾아온다면 어떨까에 대한 답으로, 운동을 일상으로 끌어들이는 핵심이 바로 \u003cb class=\"key\">집안 할 수 없는 현실임을 인정하며 논의를 \u003cb class=\"key\">현실적\u003c/b>으로 만든다. Let's be realistic은 '현실적이 되자'라는 제안으로, 독자를 설득하는 역할을 한다. inevitable은 '\u003cb class=\"key\">불가피한\u003c/b>'이라는 뜻이다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">let's + 동사원형 (제안·권유의 명령문)\u003c/span> : Let's [= let us] + [동사원형] : \"현실적이 되자\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Let's be realistic, 현실적이 되자. chores are inevitable, 집안일은 불가피하다. 이 문장 전체를 해석하면, 현실적이 되자. 집안일은 불가피하다.","hl":"m"},{"n":25,"text":"이 문장은 집안일이 피할 수 없는 현실이라는 점을 인정하고 있어요. Let's be realistic은 현실적이 되자라는 제안으로, 독자에게 현실을 직시하게 만드는 역할을 해요. inevitable은 불가피한, 피할 수 없다는 뜻이에요.","hl":"mn"},{"n":26,"text":"여기서 기억할 어법은 Let's be realistic이에요. Let's는 let us의 줄임말이고, 뒤에는 항상 동사원형이 와야 해요. be realistic은 형용사 realistic이 보어로 쓰여 현실적이 되라는 상태를 나타내요. 세미콜론은 앞뒤 절을 대등하게 연결해 주는 역할을 하고요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 설거지하는 것이든 쓰레기를 내다 버리는 것이든지 간에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Whether \u003c/span>\u003cspan class=\"tgt\">it's \u003c/span>\u003cspan class=\"tgt\">washing \u003c/span>\u003cspan class=\"tgt\">dishes \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">taking \u003c/span>\u003cspan class=\"tgt\">out \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">trash\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 일들은\u003c/span>\u003cspan class=\"en\">these tasks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상생활의 필수적인 부분이다\u003c/span>\u003cspan class=\"en\">are an essential part of daily life.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것이 설거지하는 것이든 쓰레기를 내다 버리는 것이든지 간에, 이런 일들은 일상생활의 필수적인 부분이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 말한 집안일의 구체적인 예를 \u003cb class=\"key\">설거지\u003c/b>와 \u003cb class=\"key\">쓰레기 \u003c/b>\u003cb class=\"key\">내다 \u003c/b>\u003cb class=\"key\">버리기\u003c/b>로 제시하며, 그것이 일상생활의 \u003cb class=\"key\">필수적인 \u003c/b>\u003cb class=\"key\">부분\u003c/b>임을 강조한다. Whether A or B는 'A이든 B이든'이라는 뜻으로 예시를 나열할 때 쓰인다. these tasks는 앞서 말한 집안일들을 가리킨다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">whether A or B (양보의 부사절)\u003c/span> : Whether + 절 + or + 절 : \"그것이 설거지하는 것이든 쓰레기를 내다 버리는 것이든지 간에\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Whether it's washing dishes or taking out the trash, 그것이 설거지하는 것이든 쓰레기를 내다 버리는 것이든지 간에. these tasks, 이런 일들은. are an essential part of daily life, 일상생활의 필수적인 부분이다. 이 문장 전체를 해석하면, 그것이 설거지하는 것이든 쓰레기를 내다 버리는 것이든지 간에, 이런 일들은 일상생활의 필수적인 부분이다.","hl":"m"},{"n":28,"text":"이 문장은 집안일의 구체적인 예를 설거지와 쓰레기 내다 버리기로 들어요. 이 두 가지는 무엇이든 간에 일상생활에서 꼭 필요한 일이라는 점을 강조하고 있어요. whether A or B는 A이든 B이든이라는 뜻으로 예시를 나열할 때 쓰는 표현이에요.","hl":"mn"},{"n":29,"text":"이 문장의 핵심 어법은 whether A or B 구문이에요. whether가 이끄는 부사절에서 A와 B를 or로 연결해서, 어떤 경우든 상관없다는 양보의 의미를 만들어요. 여기서는 설거지를 하든 쓰레기를 내다 버리든, 그런 일들이 일상생활의 필수적인 부분이라는 뜻이 되죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 집안일을 간주하기보다는\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">viewing \u003c/span>\u003cspan class=\"tgt\">chores\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">순전히 의무적인 행위로\u003c/span>\u003cspan class=\"en\">as purely obligatory activities,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 순간들을 잘 이용하는 것이 어떨까\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">why \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">seize \u003c/span>\u003cspan class=\"tgt\">these \u003c/span>\u003cspan class=\"tgt\">moments\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신체 활동을 위한 기회로?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">opportunities \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">physical \u003c/span>\u003cspan class=\"tgt\">activity\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 집안일을 순전히 의무적인 행위로 간주하기보다는, 이런 순간들을 신체 활동을 위한 기회로 잘 이용하는 것이 어떨까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 집안일을 \u003cb class=\"key\">의무\u003c/b>로만 보지 말고 그 순간들을 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">활동\u003c/b>의 기회로 바꾸자고 제안하는 글의 핵심 논리입니다. \u003cb class=\"key\">rather \u003c/b>\u003cb class=\"key\">than\u003c/b>이 의무적 행위라는 시각을 부정하고, \u003cb class=\"key\">why \u003c/b>\u003cb class=\"key\">not\u003c/b>이 부드러운 \u003cb class=\"key\">제안\u003c/b>을 이끌어 자연스럽게 설득합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">rather than + 동명사(구)\u003c/span> : rather than + [viewing chores as purely obligatory activities (동명사구)] : \"집안일을 순전히 의무적인 행위로 간주하기보다는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">Why not + 동사원형? (관용적 제안)\u003c/span> : Why not + [seize these moments (동사원형+목적어)]? : \"이런 순간들을 잘 이용하는 것이 어떨까\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">as + 명사(구) (자격·용도)\u003c/span> : as + [opportunities for physical activity (명사구)] : \"신체 활동을 위한 기회로\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"But rather than viewing chores, 하지만 집안일을 간주하기보다는. as purely obligatory activities, 순전히 의무적인 행위로. why not seize these moments, 이런 순간들을 잘 이용하는 것이 어떨까. as opportunities for physical activity?, 신체 활동을 위한 기회로?. 이 문장 전체를 해석하면, 하지만 집안일을 순전히 의무적인 행위로 간주하기보다는, 이런 순간들을 신체 활동을 위한 기회로 잘 이용하는 것이 어떨까?","hl":"m"},{"n":31,"text":"이 문장은 집안일을 순전히 의무적인 행위로만 보지 말고, 그 순간들을 신체 활동을 위한 기회로 잘 이용하자고 제안하는 문장입니다. rather than이 의무로 보는 시각을 부정하고, why not이 부드럽게 권유하는 표현이죠. seize는 기회를 잡아 활용하다라는 뜻으로 쓰였습니다.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 rather than viewing chores as purely obligatory activities입니다. rather than 뒤에 동명사구 viewing chores as purely obligatory activities가 와서 뒤의 seize these moments와 대조되는 구조예요. 두 번째 포인트는 why not seize these moments입니다. why not 뒤에는 동사원형 seize가 오는 관용적 제안 표현이라 꼭 기억해 두세요. 세 번째로 as opportunities for physical activity에서 as는 신체 활동을 위한 기회로라고 해석되는 전치사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어, 스쿼트를 연습하거나 벽에 대고 하는 팔 굽혀 펴기 몇 개를 시작해 보라 여러분이 기다리면서 여러분의 아침 주전자가 끓기를\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">For \u003c/span>\u003cspan class=\"tgt\">instance\u003c/span>, practice squats or engage in some wall push­ups \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">wait \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">morning \u003c/span>\u003cspan class=\"tgt\">kettle \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">boil\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어, 여러분의 아침 주전자가 끓기를 기다리면서 스쿼트를 연습하거나 벽에 대고 하는 팔 굽혀 펴기 몇 개를 시작해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞 문장에서 제안한 내용을 \u003cb class=\"key\">For \u003c/b>\u003cb class=\"key\">instance\u003c/b>로 구체화한 예시입니다. \u003cb class=\"key\">as \u003c/b>\u003cb class=\"key\">you \u003c/b>\u003cb class=\"key\">wait\u003c/b>가 시간을 나타내어 아침 주전자가 끓기를 기다리는 \u003cb class=\"key\">자투리 \u003c/b>\u003cb class=\"key\">시간\u003c/b>에 스쿼트나 벽 팔굽혀펴기를 하라고 권유합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용적 연결 표현\u003c/span> : For instance + [문장] : \"예를 들어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">as 시간 부사절\u003c/span> : as + [you wait for your morning kettle to boil (주어+동사)] : \"여러분의 아침 주전자가 끓기를 기다리면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">wait for + 목적어 + to부정사\u003c/span> : wait for + [your morning kettle (목적어)] + [to boil (to부정사)] : \"여러분의 아침 주전자가 끓기를 기다리다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">명령문(동사원형 시작)과 or 병렬\u003c/span> : [practice (동사원형)] + [squats (목적어)] or [engage (동사원형)] + [in some wall push-ups (전치사구)] : \"스쿼트를 연습하거나 벽에 대고 하는 팔 굽혀 펴기를 하라\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"For instance, 예를 들어. practice squats, 스쿼트를 연습하거나. or engage in some wall push-ups, 벽에 대고 하는 팔 굽혀 펴기 몇 개를 시작해 보라. as you wait, 여러분이 기다리면서. for your morning kettle to boil, 여러분의 아침 주전자가 끓기를. 이 문장 전체를 해석하면, 예를 들어, 여러분의 아침 주전자가 끓기를 기다리면서 스쿼트를 연습하거나 벽에 대고 하는 팔 굽혀 펴기 몇 개를 시작해 보라.","hl":"m"},{"n":34,"text":"이 문장은 일상에서 실천할 수 있는 구체적인 운동 예시를 제시합니다. For instance로 앞 문장의 제안을 예를 들어 설명하고, as you wait라는 시간 표현을 통해 기다리는 자투리 시간을 활용하라고 말하죠. practice와 engage는 동사원형으로 시작하는 명령문이라 바로 행동을 권유하는 느낌을 줍니다.","hl":"mn"},{"n":35,"text":"첫 번째 어법 포인트는 For instance입니다. 이것은 앞 문장을 구체적인 예로 풀어 주는 연결 표현으로 우리말로 예를 들어로 해석합니다. 두 번째 포인트는 practice squats or engage in some wall push-ups에서 practice와 engage가 동사원형으로 시작하는 명령문이라는 점입니다. 상대방에게 바로 해 보라고 권유하는 형태죠. 세 번째 포인트는 as you wait의 as입니다. 여기서 as는 시간을 나타내는 부사절 접속사로 여러분이 기다리는 동안이라고 해석합니다. 네 번째로 wait for your morning kettle to boil은 wait for 다음에 목적어와 to부정사를 써서 아침 주전자가 끓기를 기다린다는 뜻을 만듭니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">짧은 운동을 포함시키는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Incorporating \u003c/span>\u003cspan class=\"tgt\">quick \u003c/span>\u003cspan class=\"tgt\">exercises \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 일상적인 집안일에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">into \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">daily \u003c/span>\u003cspan class=\"tgt\">chores\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">향상시킬 수 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">improve \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 건강을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">health\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">짧은 운동을 여러분의 일상적인 집안일에 포함시키는 것이 여러분의 건강을 향상시킬 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 앞의 논의를 정리하는 \u003cb class=\"key\">결론\u003c/b>으로, 짧은 운동을 일상 집안일에 통합하는 행동이 건강에 긍정적 효과를 준다는 핵심 주장입니다. 문장 맨 앞에 \u003cb class=\"key\">동명사구\u003c/b>가 주어로 온 것이 중요하며, \u003cb class=\"key\">can \u003c/b>\u003cb class=\"key\">improve\u003c/b>가 가능성을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어\u003c/span> : [[Incorporating (동명사) + quick exercises (목적어) + into your daily chores (전치사구)]] + can improve ... : \"짧은 운동을 여러분의 일상적인 집안일에 포함시키는 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 can + 동사원형\u003c/span> : can + [improve (동사원형)] + [your health (목적어)] : \"여러분의 건강을 향상시킬 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Incorporating quick exercises, 짧은 운동을 포함시키는 것이. into your daily chores, 여러분의 일상적인 집안일에. can improve, 향상시킬 수 있다. your health, 여러분의 건강을. 이 문장 전체를 해석하면, 짧은 운동을 여러분의 일상적인 집안일에 포함시키는 것이 여러분의 건강을 향상시킬 수 있다.","hl":"m"},{"n":37,"text":"이 문장은 글 전체의 핵심을 정리하는 결론입니다. 동명사구 Incorporating quick exercises into your daily chores가 주어로 와서 짧은 운동을 일상 집안일에 포함시키는 행동이 건강을 향상시킬 수 있다는 긍정적 효과를 말해 줍니다. can improve에서 can은 가능성을 나타내고 improve는 건강을 좋아지게 한다는 뜻이죠.","hl":"mn"},{"n":38,"text":"첫 번째 어법 포인트는 문장 맨 앞의 Incorporating quick exercises into your daily chores입니다. 동사 incorporate에 ing가 붙은 동명사구가 주어 자리에 와서 짧은 운동을 일상적인 집안일에 포함시키는 것이라고 해석합니다. 두 번째 포인트는 can improve입니다. 조동사 can 뒤에는 반드시 동사원형 improve가 와서 향상시킬 수 있다는 가능성을 나타내죠. 이 문장 전체가 이 글의 핵심 주장이기 때문에 서술형에서 주어를 동명사구로 바꾸어 쓰는 문제가 자주 출제됩니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>운동할 시간을 내는 것은 \u003cb class=\"key\">계속되는 \u003c/b>\u003cb class=\"key\">도전\u003c/b>으로 느껴진다.\u003c/li>\u003cli>집안일은 \u003cb class=\"key\">불가피\u003c/b>하고 일상생활의 필수적인 부분이다.\u003c/li>\u003cli>집안일을 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">활동 \u003c/b>\u003cb class=\"key\">기회\u003c/b>로 삼아 짧은 운동을 통합하면 건강을 향상시킬 수 있다.\u003c/li>\u003cli>주전자가 끓기를 기다리며 \u003cb class=\"key\">스쿼트\u003c/b>나 벽 팔굽혀펴기를 하는 것이 예이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>You can improve your health by seizing inevitable household chores as opportunities to incorporate quick exercises into your daily routine.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">운동할 시간을 내는 것은 계속되는 도전이지만, 집안일을 단순한 의무로 보지 말고 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">활동을 \u003c/b>\u003cb class=\"key\">위한 \u003c/b>\u003cb class=\"key\">기회\u003c/b>로 활용하여 \u003cb class=\"key\">짧은 \u003c/b>\u003cb class=\"key\">운동\u003c/b>을 일상의 집안일에 포함시키면 \u003cb class=\"key\">건강을 \u003c/b>\u003cb class=\"key\">향상\u003c/b>시킬 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":39,"text":"오늘 지문 정리해 볼게요. 운동할 시간을 내기 어려운 우리에게 집안일은 피할 수 없는 일이지만, 그 시간을 신체 활동의 기회로 바꾸면 짧은 운동도 건강에 도움이 된다는 내용이에요. 주전자가 끓기를 기다리며 하는 스쿼트처럼 사소한 실천이 쌓이면 큰 변화를 만들 수 있다는 거죠. 오늘 분석한 표현과 구조를 잘 복습하고 다음 문제에서 만나면 자신 있게 풀어 보세요. 여러분 수고했어요.","hl":null}]}]});</script></body></html>
