\"><div class=\"lec-stage-head\">01현상 관찰과 이론 도입<\/div><ul><li>선거 기간 중 사람들이 인기 없는 의견을 숨기고 침묵하는 현상을 관찰하여 새로운 이론을 제시했다.<\/li><li>노엘-노이만(Noelle-Neumann)의 선거 캠페인 관찰<\/li><li>자신의 의견이 비인기(unpopular)라고 인식하면 의견을 숨김(muted)<\/li><li>이를 침묵의 나선(spiral of silence)이라고 명명함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02이론의 작동 원리<\/div><ul><li>개인이 자신의 의견이 대중적인지 여부를 어떻게 인식하느냐에 따라 표현 방식이 달라진다.<\/li><li>대중적(popular)이라고 인식하는 사람: 의견을 적극적으로 표출함(express)<\/li><li>대중적이지 않다고 생각하는 사람: 조용히 머무름(remain quiet)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03나선형 과정의 결과<\/div><ul><li>의견 표출과 침묵의 과정이 나선형으로 반복되면서 여론의 불균형이 발생한다.<\/li><li>이러한 과정이 나선(spiral) 형태로 지속됨<\/li><li>한쪽 의견은 상당한 대중성(considerable publicity)을 얻게 됨<\/li><li>반대쪽 의견은 대중성을 거의 잃게 됨<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04일상생활에서의 적용<\/div><ul><li>일상에서 사람들의 다양한 의견 표출 행동 역시 타인의 동조 여부에 따라 결정된다.<\/li><li>대화, 배지, 스티커, 소셜 미디어(social media) 등 다양한 표현 방식 존재<\/li><li>타인이 자신의 의견을 공유(share)한다고 인식할 때 표현할 가능성이 더 높음(more apt to)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get more play<\/td><td class=\"m\">더 주목받다, 더 많이 다뤄지다<\/td><\/tr><tr><td class=\"w\">mute<\/td><td class=\"m\">(의견 등을) 억누르다, 소리를 줄이다<\/td><\/tr><tr><td class=\"w\">rather than<\/td><td class=\"m\">~하기보다는, ~대신에<\/td><\/tr><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 여기다<\/td><\/tr><tr><td class=\"w\">spiral<\/td><td class=\"m\">나선형, 소용돌이<\/td><\/tr><tr><td class=\"w\">end up with<\/td><td class=\"m\">결국 ~을 갖게 되다, 결국 ~한 상태가 되다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">considerable<\/td><td class=\"m\">상당한, 많은<\/td><\/tr><tr><td class=\"w\">publicity<\/td><td class=\"m\">널리 알려짐, 주목, 언론의 관심<\/td><\/tr><tr><td class=\"w\">a variety of<\/td><td class=\"m\">다양한, 여러 가지의<\/td><\/tr><tr><td class=\"w\">post<\/td><td class=\"m\">(온라인에) 게시하다, 올리다<\/td><\/tr><tr><td class=\"w\">be apt to<\/td><td class=\"m\">~하는 경향이 있다, ~하기 쉽다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>As a political researcher in Germany,<\/b><\/span><span class=\"ko\">독일의 정치 연구자로서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Noelle-Neumann observed<\/b><\/span><span class=\"ko\">Noelle-Neumann은 목격했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that during election campaigns,<\/b><\/span><span class=\"ko\">선거 운동 기간 동안<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>certain views <span class=\"grammar-hl\">seemed to get<\/span> more play<\/b><\/span><span class=\"ko\">특정 견해들이 더 많이 다뤄지는 것처럼 보이고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than others,<\/b><\/span><span class=\"ko\">다른 견해들보다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and sometimes people muted their opinions<\/b><\/span><span class=\"ko\">때로는 사람들이 자신들의 의견들을 표현하지 않는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>rather than <span class=\"grammar-hl\">talking<\/span> about them,<\/b><\/span><span class=\"ko\">그것들에 대해 말하기보다는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>especially if those opinions <span class=\"grammar-hl\">were perceived to be<\/span> unpopular.<\/b><\/span><span class=\"ko\">특히 그러한 의견들이 인기 없는 것으로 인식되는 경우<\/span><\/div><\/div><div class=\"lec-sent-ko\">독일의 정치 연구자로서 NoelleNeumann은 선거 운동 기간 동안 특정 견해들이 다른 견해들보다 더 많이 다뤄지는 것처럼 보이고, 때로는 특히 그러한 의견들이 인기 없는 것으로 인식되는 경우 사람들이 그것들에 대해 말하기보다는 자신들의 의견들을 표현하지 않는 것을 목격했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로서 정치학자인 노엘-노이만의 핵심 관찰 결과를 제시합니다. get more play는 미디어나 대중 사이에서 특정 주제나 주장이 더 많이 다뤄지고 주목받는 현상을 가리킵니다. muted their opinions는 사람들이 다른 이들의 시선을 의식하여 스스로 입을 다물고 의견을 숨기는 행동을 의미합니다. 대중의 지지를 받지 못할 것 같으면 나서서 말하지 않게 되는 인간의 심리를 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">seemed to get seem to V 구문: 주어(certain views) 뒤에 쓰여 &#39;~인 것 같다&#39;는 의미를 나타내는 구조로, 명사/형용사/부사적 용법 이름을 억지로 붙이지 않고 &#39;seem to V 구문&#39;으로 따로 취급한다.<\/div><div class=\"lec-gr-item\">talking (동명사(명사적)): -ing가 전치사적 성격을 띠는 rather than의 목적어 자리에 쓰여 행위나 동작을 나타내는 명사적 기능으로 쓰였다.<\/div><div class=\"lec-gr-item\">were perceived to be 수동태 및 목적격보어(to부정사): be동사(were) + p.p.(perceived) 구조. perceive는 타동사로 &#39;perceive + O + to V&#39;(5형식) 기본구조인데, 뒤에 목적어가 없어서(주어로 올라가서) 수동구조 were perceived 형태로 쓰고, 뒤의 to V(to be)는 수동태 뒤에 남은 목적격보어이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get more play<\/td><td class=\"m\">더 주목받다, 더 많이 다뤄지다<\/td><\/tr><tr><td class=\"w\">mute<\/td><td class=\"m\">(의견 등을) 억누르다, 소리를 줄이다<\/td><\/tr><tr><td class=\"w\">rather than<\/td><td class=\"m\">~하기보다는, ~대신에<\/td><\/tr><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 여기다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Noelle-Neumann <span class=\"grammar-hl\">calls this<\/span><\/b><\/span><span class=\"ko\">Noelle-Neumann은 이것을 부른다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">the spiral of silence<\/span>.<\/b><\/span><span class=\"ko\">&#39;침묵의 나선&#39;이라고<\/span><\/div><\/div><div class=\"lec-sent-ko\">NoelleNeumann은 이것을 ‘침묵의 나선’이라고 부른다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 설명한 관찰된 현상을 학술적 용어로 정의합니다. the spiral of silence는 사람들이 다수의 의견에 동조하고 소수의 의견은 감추게 되어, 결국 소수의 의견이 점점 더 사라지게 되는 사회적 현상을 일컫는 핵심 이론명입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">calls this the spiral of silence 5형식(SVOC) 구조: 주어(Noelle-Neumann) + 동사(calls) + 목적어(this) + 목적격보어(the spiral of silence) 형태. 타동사 call은 &#39;call + O + C&#39; 기본구조를 취하여 목적어를 보어라고 부르다라는 구조를 만든다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spiral<\/td><td class=\"m\">나선형, 소용돌이<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The spiral of silence occurs<\/b><\/span><span class=\"ko\">침묵의 나선은 발생한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when individuals <span class=\"grammar-hl\">who perceive<\/span> that their opinions are popular<\/b><\/span><span class=\"ko\">자신들의 의견이 대중적이라고 인식하는 개인들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>express them,<\/b><\/span><span class=\"ko\">그것들을 표현할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>whereas those <span class=\"grammar-hl\">who do not think<\/span> their opinions are popular<\/b><\/span><span class=\"ko\">반면에 자신들의 의견이 대중적이라고 생각하지 않는 사람들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>remain quiet.<\/b><\/span><span class=\"ko\">조용히 있을 때<\/span><\/div><\/div><div class=\"lec-sent-ko\">자신들의 의견이 대중적이라고 인식하는 개인들은 그것들을 표현하지만, 자신들의 의견이 대중적이라고 생각하지 않는 개인들은 조용히 있을 때 침묵의 나선이 발생한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 명명한 &#39;침묵의 나선&#39; 이론의 구체적인 작동 원리를 설명합니다. 대중의 동조 여부에 따라 의견 표출과 침묵이라는 상반된 행동이 나타남을 명확히 대조하여 보여 줍니다. 자신의 생각이 주류에 속한다고 믿는 사람들은 목소리를 높이고, 비주류에 속한다고 느끼는 사람들은 스스로 입을 닫는 과정을 서술하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who perceive (관계대명사): 주격 관계대명사 who가 이끄는 관계사절이 앞의 선행사 individuals를 수식한다. 절 내부에서 주어 역할을 하여 빠진 자리가 존재한다.<\/div><div class=\"lec-gr-item\">who do not think (관계대명사): 주격 관계대명사 who가 이끄는 관계사절이 앞의 선행사 대명사 those를 수식한다. 절 내부에서 주어 역할을 하여 빠진 자리가 존재한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 여기다<\/td><\/tr><tr><td class=\"w\">spiral<\/td><td class=\"m\">나선형, 소용돌이<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This process occurs<\/b><\/span><span class=\"ko\">이 과정은 일어난다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in a spiral,<\/b><\/span><span class=\"ko\">나선형으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">so that<\/span> one side of an issue<\/b><\/span><span class=\"ko\">그래서 문제에 대한 한 쪽 입장은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">ends up with<\/span> considerable publicity<\/b><\/span><span class=\"ko\">결국 상당한 주목을 받게 되고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">the other side with very little<\/span>.<\/b><\/span><span class=\"ko\">다른 쪽 입장은 거의 주목받지 않게 된다<\/span><\/div><\/div><div class=\"lec-sent-ko\">이 과정은 나선형으로 일어나 문제에 대한 한 쪽 입장은 상당한 주목을 받게 되고, 다른 쪽 입장은 거의 주목받지 않게 된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 작동 원리가 반복되면서 나타나는 최종적인 결과를 제시합니다. occurs in a spiral은 소용돌이가 좁아지며 빨려 들어가는 것처럼, 주류 의견은 점점 더 커지고 비주류 의견은 갈수록 줄어드는 가속화 과정을 시각적으로 비유한 표현입니다. ends up with considerable publicity는 다수의 지지를 받는 의견이 결국 여론을 완전히 장악하고 널리 알려지게 되는 상태를 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">so that 접속사: &#39;so that + S + V&#39; 구조로 결과를 나타내는 부사절을 이끈다.<\/div><div class=\"lec-gr-item\">ends up with (관용표현): 문법 규칙으로 풀 수 없는 굳어진 숙어로 &#39;결국 ~하게 되다&#39;라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">the other side with very little 생략 구문: 등위접속사 and 뒤에 주어(the other side)와 전치사구(with very little) 사이에 앞 절과 중복되는 동사구(ends up) 및 명사(publicity)가 생략된 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spiral<\/td><td class=\"m\">나선형, 소용돌이<\/td><\/tr><tr><td class=\"w\">end up with<\/td><td class=\"m\">결국 ~을 갖게 되다, 결국 ~한 상태가 되다<\/td><\/tr><tr><td class=\"w\">considerable<\/td><td class=\"m\">상당한, 많은<\/td><\/tr><tr><td class=\"w\">publicity<\/td><td class=\"m\">널리 알려짐, 주목, 언론의 관심<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In everyday life,<\/b><\/span><span class=\"ko\">일상생활에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>people express their opinions<\/b><\/span><span class=\"ko\">사람들은 자신들의 의견들을 표현한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in <span class=\"grammar-hl\">a variety of<\/span> ways:<\/b><\/span><span class=\"ko\">다양한 방식들로:<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">they talk about them,<\/span><\/b><\/span><span class=\"ko\">그들은 그것들에 대해 말하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">they wear buttons,<\/span><\/b><\/span><span class=\"ko\">배지들을 달고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">they put bumper stickers on their cars,<\/span><\/b><\/span><span class=\"ko\">자동차에 범퍼 스티커들을 붙이고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and they post their views on social media<\/span>.<\/b><\/span><span class=\"ko\">그리고 소셜 미디어에 자신들의 견해들을 게시한다<\/span><\/div><\/div><div class=\"lec-sent-ko\">일상생활에서 사람들은 다양한 방식들로 자신들의 의견들을 표현한다. 그들은 그것들에 대해 말하고, 배지들을 달고, 자동차에 범퍼 스티커들을 붙이고, 소셜 미디어에 자신들의 견해들을 게시한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 시점을 선거판이나 추상적 이론에서 일상생활로 전환하여, 여론 형성 과정에서 나타나는 의견 표출의 구체적 예시를 나열합니다. 버튼 달기, 스티커 붙이기, SNS 게시 등의 다양한 일상적 활동들이 모두 자신의 정치적·사회적 입장을 밖으로 드러내는 적극적인 행위임을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">a variety of (관용표현): 문법 규칙으로 풀 수 없는 숙어로 &#39;다양한&#39;이라는 의미를 가지며 뒤에 복수 명사(ways)가 온다.<\/div><div class=\"lec-gr-item\">they talk about them, they wear buttons, they put bumper stickers on their cars, and they post their views on social media 병렬 구조: 등위접속사 and에 의해 4개의 주어+동사 절이 나란히 동일한 비중으로 연결된 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">a variety of<\/td><td class=\"m\">다양한, 여러 가지의<\/td><\/tr><tr><td class=\"w\">post<\/td><td class=\"m\">(온라인에) 게시하다, 올리다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>According to this theory,<\/b><\/span><span class=\"ko\">이 이론에 따르면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>people are more apt <span class=\"grammar-hl\">to do<\/span> these kinds of things<\/b><\/span><span class=\"ko\">사람들은 이런 종류의 행동들을 더 많이 하는 경향이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when they perceive<\/b><\/span><span class=\"ko\">그들이 인식할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that others share their opinions<\/span>.<\/b><\/span><span class=\"ko\">다른 사람들이 자신들의 의견들과 뜻을 같이한다고<\/span><\/div><\/div><div class=\"lec-sent-ko\">이 이론에 따르면 사람들은 다른 사람들이 자신들의 의견들과 뜻을 같이한다고 인식할 때 이런 종류의 행동들을 더 많이 하는 경향이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 일상적 예시들을 다시 &#39;침묵의 나선&#39; 이론과 연결하여 글을 마무리합니다. are more apt to do these kinds of things는 사람들이 자신의 견해가 주변 사람들과 같다고 느낄 때 기꺼이 앞서 말한 배지 달기나 SNS 글쓰기처럼 밖으로 의견을 드러내는 성향이 있음을 확인해 줍니다. 다수의 지지라는 심리적 안정감이 주어질 때만 사람들은 일상에서도 적극적으로 목소리를 낸다는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to do (to부정사(부사적)): to V 바로 앞에 형용사(apt)가 있어 형용사를 수식하는 부사적 용법이다.<\/div><div class=\"lec-gr-item\">that others share their opinions 명사절 접속사 that: 타동사 perceive의 목적어 역할을 하는 명사절을 이끄는 접속사로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">perceive<\/td><td class=\"m\">인식하다, 여기다<\/td><\/tr><tr><td class=\"w\">be apt to<\/td><td class=\"m\">~하는 경향이 있다, ~하기 쉽다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>독일의 정치 연구원 노엘-노이만은 선거 기간에 특정 의견만 부각되고 비인기 의견은 스스로 감추어지는 현상을 관찰했다.<\/li><li>그녀는 이를 &#39;침묵의 나선&#39; 이론이라고 명명했다.<\/li><li>이 이론은 주류 의견을 가진 사람은 목소리를 내고 비주류 의견을 가진 사람은 침묵하면서, 한쪽 의견만 일방적으로 여론을 장악하는 과정을 설명한다.<\/li><li>일상생활에서 배지를 달거나 SNS에 글을 올리는 등의 다양한 의견 표출 행위 역시, 사람들이 타인과 의견이 같다고 느껴 다수의 지지를 확신할 때 더 활발하게 일어난다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">People actively express their opinions when they believe others share them, whereas they tend to remain silent when perceiving their views as unpopular.<\/div>\n              <div class=\"lec-final-sum-ko\">사람들은 다른 이들이 자신의 의견을 공유한다고 믿을 때 이를 적극적으로 표현하는 반면, 자신의 견해가 비대중적이라고 인식할 때는 침묵을 지키는 경향이 있다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./34_audio/1.mp3","hl":null}],[{"audio":"./34_audio/2.mp3","hl":null}],[{"audio":"./34_audio/3.mp3","hl":null},{"audio":"./34_audio/4.mp3","hl":"stage-0"},{"audio":"./34_audio/5.mp3","hl":"stage-1"},{"audio":"./34_audio/6.mp3","hl":"stage-2"}, 구원 노엘-노이만은 선거 기간에 특정 의견만 부각되고 비인기 의견은 스스로 감추어지는 현상을 관찰했다. 그녀는 이를 '침묵의 나선' 이론이라고 명명했다. 이 이론은 주류 의견을 가진 사람은 목소리를 내고 비주류 의견을 가진 사람은 침묵하면서, 한쪽 의견만 일방적으로 여론을 장악하는 과정을 설명한다. 일상생활에서 배지를 달거나 SNS에 글을 올리는 등의 다양한 의견 표출 행위 역시, 사람들이 타인과 의견이 같다고 느껴 다수의 지지를 확신할 때 더 활발하게 일어난다.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 34번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 34번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 독일의 정치 연구원 노엘-노이만은 선거 기간에 특정 의견만 부각되고 비인기 의견은 스스로 감추어지는 현상을 관찰했습니다. 그녀는 이를 '침묵의 나선' 이론이라고 명명했습니다. 이 이론은 주류 의견을 가진 사람은 목소리를 내고 비주류 의견을 가진 사람은 침묵하면서, 한쪽 의견만 일방적으로 여론을 장악하는 과정을 설명합니다. 일상생활에서 배지를 달거나 SNS에 글을 올리는 등의 다양한 의견 표출 행위 역시, 사람들이 타인과 의견이 같다고 느껴 다수의 지지를 확신할 때 더 활발하게 일어납니다. 마지막으로 이 글을 한 문장으로 요약하면 이렇습니다. 사람들은 다른 이들이 자신의 의견을 공유한다고 믿을 때 이를 적극적으로 표현하는 반면, 자신의 견해가 비대중적이라고 인식할 때는 침묵을 지키는 경향이 있습니다. 오늘도 정말 수고 많았습니다!"}]}</script><script>var D=JSON.parse(document.getElementById("enpLecData").textContent);var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function"){c.scrollTop=to;return;}var t0=0;var step=function(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/260);var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.scrollTop=fr+(to-fr)*e;if(k<1)requestAnim
