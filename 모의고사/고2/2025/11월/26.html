이는 마치 학교 교실에서 아무런 잘못이 없는 특정 학생들만 억지로 맨 뒷자리에 앉히고 부당하게 대우하는 것과 같은 상황이었죠. 이에 맞서 1950~60년대에 흑인들의 기본적 인권을 되찾고자 일어난 거대한 사회적 저항이 바로 민권 운동이며, 이때 많은 예술가들이 저항 음악(Protest Music)을 통해 이 운동에 동참했습니다. 당시의 저항 음악은 마치 오늘날 부당한 일을 세상에 알리고 연대를 구하는 SNS 해시태그 캠페인처럼, 사람들의 마음을 하나로 모으고 폭력에 맞서는 강력한 평화적 무기 역할을 해냈답니다. 이러한 시대적 배경을 머릿속에 그리면서, 지문에 등장하는 인물이 겪은 부당한 일화와 그녀가 왜 자신의 음악을 사회를 향한 목소리로 바꾸게 되었는지 따라가 보시면 훨씬 더 깊이 있게 글에 몰입하실 수 있을 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01유년 시절과 차별 경험<\/div><ul><li>어릴 적부터 뛰어난 음악적 재능을 보였으나 백인 중심 사회의 부당한 차별을 겪었다.<\/li><li>12세 첫 독주회(recital)에서 부모님의 좌석이 강제로 뒤로 밀려남<\/li><li>백인(white people)에게 자리를 내주어야 했던 인종 차별 경험<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02진학 좌절과 새로운 시작<\/div><ul><li>음악 학교 진학에 실패한 후 예명을 사용하며 새로운 공연 활동을 시작했다.<\/li><li>커티스 음악원 오디션 탈락(rejected)을 인종 차별(racial discrimination)로 인식<\/li><li>개인 레슨비 마련을 위해 애틀랜틱 시티에서 공연을 시작함<\/li><li>&#39;니나 시몬&#39;이라는 예명(stage name)을 새롭게 채택<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03음악을 통한 인권 운동<\/div><ul><li>1960년대에 음악을 무기로 삼아 흑인 인권 운동에 적극적으로 동참했다.<\/li><li>인권 운동(Civil Rights Movement)의 헌신적인 지지자(supporter)로 활동<\/li><li>미국 남부의 인종 차별주의(racism)와 폭력에 저항하는 노래를 작곡하고 공연함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04망명 생활과 영원한 유산<\/div><ul><li>미국의 차별적 현실에 지쳐 고국을 떠났지만, 그녀의 음악과 명성은 굳건히 남았다.<\/li><li>미국의 차별에 좌절(frustrated)하여 1970년 출국 후 프랑스에 정착<\/li><li>2003년 사망했으나 그녀의 강력한 음악(powerful music)을 통해 명성(reputation)이 이어짐<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">activist<\/td><td class=\"m\">운동가, 활동가<\/td><\/tr><tr><td class=\"w\">display<\/td><td class=\"m\">보여 주다, 드러내다<\/td><\/tr><tr><td class=\"w\">recital<\/td><td class=\"m\">발표회, 독주회<\/td><\/tr><tr><td class=\"w\">against one&#39;s will<\/td><td class=\"m\">~의 의지에 반하여, 억지로<\/td><\/tr><tr><td class=\"w\">graduate from<\/td><td class=\"m\">~을 졸업하다<\/td><\/tr><tr><td class=\"w\">prepare for<\/td><td class=\"m\">~을 준비하다, 대비하다<\/td><\/tr><tr><td class=\"w\">application<\/td><td class=\"m\">지원서, 신청서<\/td><\/tr><tr><td class=\"w\">reject<\/td><td class=\"m\">거절하다, 거부하다<\/td><\/tr><tr><td class=\"w\">attribute to<\/td><td class=\"m\">~의 탓으로 돌리다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">discrimination<\/td><td class=\"m\">차별<\/td><\/tr><tr><td class=\"w\">fund<\/td><td class=\"m\">자금을 대다<\/td><\/tr><tr><td class=\"w\">adopt<\/td><td class=\"m\">(이름 등을) 채택하다, 쓰다<\/td><\/tr><tr><td class=\"w\">compose<\/td><td class=\"m\">작곡하다<\/td><\/tr><tr><td class=\"w\">frustrated<\/td><td class=\"m\">좌절한, 불만을 품은<\/td><\/tr><tr><td class=\"w\">settle<\/td><td class=\"m\">정착하다<\/td><\/tr><tr><td class=\"w\">pass away<\/td><td class=\"m\">사망하다, 돌아가시다<\/td><\/tr><tr><td class=\"w\">reputation<\/td><td class=\"m\">평판, 명성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Eunice Kathleen Waymon <span class=\"grammar-hl\">was<\/span><\/b><\/span><span class=\"ko\">Eunice Kathleen Waymon은 ~였다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>an American musician and civil rights activist.<\/b><\/span><span class=\"ko\">미국의 음악가이자 인권 운동가<\/span><\/div><\/div><div class=\"lec-sent-ko\">Eunice Kathleen Waymon은 미국의 음악가이자 인권 운동가였다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 글의 주인공인 니나 시몬(본명 유니스 캐슬린 웨이먼)을 소개하며 글을 시작합니다. civil rights activist는 인종 차별에 맞서 평등한 권리를 요구하는 사회 운동에 참여한 사람이라는 의미입니다. 앞으로 그녀의 음악적 삶과 민권 운동이 어떻게 연결되는지 설명할 것임을 암시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was 2형식 동사: 주어(Eunice Kathleen Waymon)와 주격 보어(an American musician and civil rights activist)를 연결하여 주어의 신분과 상태를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">activist<\/td><td class=\"m\">운동가, 활동가<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>She <span class=\"grammar-hl\">displayed<\/span> musical talent<\/b><\/span><span class=\"ko\">그녀는 음악적 재능을 보였다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from an early age.<\/b><\/span><span class=\"ko\">어린 나이부터<\/span><\/div><\/div><div class=\"lec-sent-ko\">그녀는 어린 나이부터 음악적 재능을 보였다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 음악가라고 소개한 주인공의 어린 시절로 돌아가 배경을 설명합니다. from an early age를 통해 그녀가 일찍부터 뛰어난 소질을 지니고 있었으며, 이 재능이 훗날 그녀의 인생과 활동의 바탕이 됨을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">displayed 3형식 동사: 주어(She) 뒤에서 목적어(musical talent)를 취하는 타동사 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">display<\/td><td class=\"m\">보여 주다, 드러내다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>At 12,<\/b><\/span><span class=\"ko\">12살에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>during her first classical recital,<\/b><\/span><span class=\"ko\">그녀의 첫 클래식 독주회에서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>her parents’ seats,<\/b><\/span><span class=\"ko\">그녀의 부모님의 자리가,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>originally near the front,<\/b><\/span><span class=\"ko\">원래는 앞쪽에 가까웠던,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">were moved<\/span> to the back<\/b><\/span><span class=\"ko\">뒤로 밀려났다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">against their will<\/span><\/b><\/span><span class=\"ko\">그들의 의지에 반하여<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to make<\/span> seats for white people.<\/b><\/span><span class=\"ko\">백인들에게 자리를 만들어 주기 위해<\/span><\/div><\/div><div class=\"lec-sent-ko\">12살에 그녀의 첫 클래식 독주회에서 원래는 앞쪽에 가까웠던 그녀의 부모님의 자리가 백인들에게 자리를 만들어 주기 위해 그들의 의지에 반하여 뒤로 밀려났다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 어린 시절 겪은 충격적인 차별 사건을 구체적으로 제시합니다. against their will은 부모님이 원하지 않았음에도 흑인이라는 이유로 강제로 앞자리를 빼앗겼다는 의미입니다. 이 사건은 그녀가 훗날 부당한 현실에 눈을 뜨고 저항하게 되는 중요한 계기를 마련해 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">were moved (수동태): be동사(were) + p.p.(moved) 구조. move는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 were moved 형태로 쓴다. 기본구조: move + O (목적어를 옮기다).<\/div><div class=\"lec-gr-item\">against their will (관용표현): &#39;그들의 의지에 반하여&#39;라는 의미를 나타내는 전치사구 관용표현이다.<\/div><div class=\"lec-gr-item\">to make (to부정사(부사적): 목적): in order to make로 바꿔도 뜻이 같으므로 부사적 용법(목적)이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recital<\/td><td class=\"m\">발표회, 독주회<\/td><\/tr><tr><td class=\"w\">against one&#39;s will<\/td><td class=\"m\">~의 의지에 반하여, 억지로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>After <span class=\"grammar-hl\">graduating<\/span> from high school,<\/b><\/span><span class=\"ko\">고등학교를 졸업한 뒤,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>she prepared for an audition<\/b><\/span><span class=\"ko\">그녀는 오디션을 준비했지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at the Curtis Institute of Music,<\/b><\/span><span class=\"ko\">Curtis Institute of Music에서의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but her application <span class=\"grammar-hl\">was rejected,<\/span><\/b><\/span><span class=\"ko\">그녀의 지원은 거부되었고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> she attributed to racial discrimination.<\/b><\/span><span class=\"ko\">그녀는 이를 인종 차별 때문이라고 여겼다<\/span><\/div><\/div><div class=\"lec-sent-ko\">고등학교를 졸업한 뒤, 그녀는 Curtis Institute of Music의 오디션을 준비했지만, 그녀의 지원은 거부되었고, 그녀는 이를 인종 차별 때문이라고 여겼다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에 이어 청년기가 되어서도 차별의 장벽이 계속되었음을 보여 줍니다. attributed to racial discrimination은 자신의 실력이 부족해서가 아니라 단지 유색 인종이라는 이유로 학교 측이 부당하게 입학을 거절했다고 여겼다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">graduating (동명사(명사적)): 전치사 After 뒤에 쓰여 전치사의 목적어 역할을 한다.<\/div><div class=\"lec-gr-item\">was rejected (수동태): be동사(was) + p.p.(rejected) 구조. reject는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 was rejected 형태로 쓴다. 기본구조: reject + O (목적어를 거절하다).<\/div><div class=\"lec-gr-item\">, which 관계대명사(계속적 용법): 콤마(,) 뒤에 쓰여 앞 절의 내용(지원이 거절당한 것)을 선행사로 받는 계속적 용법이다. 뒤에는 목적어(which)가 빠진 불완전한 절이 오며, 여기서는 attribute A to B(A를 B의 탓으로 돌리다) 구조에서 목적어 A 자리를 대신한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">graduate from<\/td><td class=\"m\">~을 졸업하다<\/td><\/tr><tr><td class=\"w\">prepare for<\/td><td class=\"m\">~을 준비하다, 대비하다<\/td><\/tr><tr><td class=\"w\">application<\/td><td class=\"m\">지원서, 신청서<\/td><\/tr><tr><td class=\"w\">reject<\/td><td class=\"m\">거절하다, 거부하다<\/td><\/tr><tr><td class=\"w\">attribute to<\/td><td class=\"m\">~의 탓으로 돌리다<\/td><\/tr><tr><td class=\"w\">discrimination<\/td><td class=\"m\">차별<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">To fund<\/span> her private lessons,<\/b><\/span><span class=\"ko\">자신의 개인 레슨비를 마련하기 위해,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>she began <span class=\"grammar-hl\">performing<\/span><\/b><\/span><span class=\"ko\">그녀는 공연을 시작했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in Atlantic City,<\/b><\/span><span class=\"ko\">Atlantic City에서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">adopting<\/span> the stage name “Nina Simone.”<\/b><\/span><span class=\"ko\">‘Nina Simone’이라는 예명을 택하면서<\/span><\/div><\/div><div class=\"lec-sent-ko\">자신의 개인 레슨비를 마련하기 위해, 그녀는 Atlantic City에서 공연을 시작하면서 ‘Nina Simone’이라는 예명을 택했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 음악원에 진학하지 못했지만 포기하지 않고 스스로 길을 개척하는 과정을 설명합니다. To fund her private lessons는 정규 학교의 지원 없이 개인적으로 음악 공부를 이어 가기 위해 직접 돈을 벌어야만 했던 상황을 보여 줍니다. 이때 우리가 잘 아는 &#39;니나 시몬&#39;이라는 이름이 탄생했음을 알려 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">To fund (to부정사(부사적): 목적): in order to fund로 바꿔도 뜻이 같으므로 부사적 용법(목적)이다.<\/div><div class=\"lec-gr-item\">performing (동명사(명사적)): 타동사 began의 목적어 자리에서 명사 역할을 한다.<\/div><div class=\"lec-gr-item\">adopting (분사구문): 부사적 기능으로 쓰인 현재분사. 원래 절인 &#39;and she adopted&#39; 또는 &#39;while she adopted&#39; (접속사 + 대명사(she) + 동사)로 변환할 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fund<\/td><td class=\"m\">자금을 대다<\/td><\/tr><tr><td class=\"w\">adopt<\/td><td class=\"m\">(이름 등을) 채택하다, 쓰다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In the 1960s,<\/b><\/span><span class=\"ko\">1960년대에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>she became a supporter of the Civil Rights Movement<\/b><\/span><span class=\"ko\">그녀는 Civil Rights Movement의 지지자가 되었고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">composed and performed<\/span> songs<\/b><\/span><span class=\"ko\">노래들을 작곡하고 공연했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as a response to<\/span> racism and violence<\/b><\/span><span class=\"ko\">인종 차별과 폭력에 대응하여<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the Southern United States.<\/b><\/span><span class=\"ko\">미국 남부의<\/span><\/div><\/div><div class=\"lec-sent-ko\">1960년대에 그녀는 Civil Rights Movement의 지지자가 되었고, 미국 남부의 인종 차별과 폭력에 대응하는 노래들을 작곡하고 공연했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 1번 문장에서 언급했던 &#39;민권 운동가&#39;로서의 활약상이 본격적으로 등장합니다. as a response to racism and violence는 흑인들을 향한 억압과 폭력적인 상황에 침묵하거나 외면하지 않고, 자신의 음악적 재능을 무기로 삼아 적극적으로 저항의 목소리를 냈다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">composed and performed (병렬구조): 등위접속사 and에 의해 과거형 동사 composed와 performed가 동일한 주어 she에 나란히 연결되어 있다.<\/div><div class=\"lec-gr-item\">as a response to (전치사구): &#39;~에 대한 대응(반응)으로&#39;라는 의미를 나타내는 구조로, 전치사 to 뒤에 명사(racism and violence)가 이어지는 형태이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">compose<\/td><td class=\"m\">작곡하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Frustrated<\/span> by the racism in the United States,<\/b><\/span><span class=\"ko\">미국에서의 인종 차별에 좌절하여,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>she left the country<\/b><\/span><span class=\"ko\">그녀는 그 나라를 떠났다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in 1970,<\/b><\/span><span class=\"ko\">1970년에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">living<\/span> in various places<\/b><\/span><span class=\"ko\">여러 지역들에서 살았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">before settling<\/span> in France.<\/b><\/span><span class=\"ko\">프랑스에 정착하기 전에<\/span><\/div><\/div><div class=\"lec-sent-ko\">미국에서의 인종 차별에 좌절하여, 그녀는 1970년에 그 나라를 떠나 프랑스에 정착하기 전에 여러 지역들에서 살았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 치열하게 저항했지만 결국 변하지 않는 조국의 현실에 지쳐버린 상황으로 이어집니다. Frustrated by the racism은 평생에 걸쳐 겪고 맞서 싸웠던 차별의 견고한 벽 앞에서 깊은 절망감과 무력감을 느꼈음을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Frustrated (분사구문): 부사적 기능으로 쓰인 과거분사. 주어(she)가 좌절감을 느끼게 된 수동 관계이므로 과거분사가 쓰였으며, 원래 절인 &#39;Because she was frustrated&#39; (접속사 + 대명사(she) + be동사 + p.p.)로 변환할 수 있다.<\/div><div class=\"lec-gr-item\">living (분사구문): 부사적 기능으로 쓰인 현재분사. 원래 절인 &#39;and she lived&#39; (접속사 + 대명사(she) + 동사)로 변환할 수 있다.<\/div><div class=\"lec-gr-item\">before settling (동명사(명사적)): 전치사 before 뒤에 쓰여 전치사의 목적어 역할을 하는 동명사 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">frustrated<\/td><td class=\"m\">좌절한, 불만을 품은<\/td><\/tr><tr><td class=\"w\">settle<\/td><td class=\"m\">정착하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>She <span class=\"grammar-hl\">passed away<\/span><\/b><\/span><span class=\"ko\">그녀는 세상을 떠났다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in 2003<\/b><\/span><span class=\"ko\">2003년에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but her reputation <span class=\"grammar-hl\">continues<\/span><\/b><\/span><span class=\"ko\">하지만 그녀의 명성은 계속 이어지고 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>through her powerful music.<\/b><\/span><span class=\"ko\">그녀의 감동적인 음악을 통해<\/span><\/div><\/div><div class=\"lec-sent-ko\">그녀는 2003년에 세상을 떠났지만, 그녀의 명성은 그녀의 감동적인 음악을 통해 계속 이어지고 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글을 마무리하며 그녀가 남긴 유산을 평가합니다. her reputation continues는 그녀가 몸은 떠났어도 인종 차별에 맞서 불렀던 노래와 성취가 오늘날까지 사람들에게 깊은 울림을 주고 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">passed away (관용표현): &#39;사망하다, 돌아가시다&#39;라는 의미로 쓰이는 구동사(숙어)이다.<\/div><div class=\"lec-gr-item\">continues 1형식 동사: 주어(her reputation) 뒤에 목적어나 보어 없이 쓰여 &#39;(명성이) 지속되다&#39;라는 의미를 나타내는 자동사이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pass away<\/td><td class=\"m\">사망하다, 돌아가시다<\/td><\/tr><tr><td class=\"w\">reputation<\/td><td class=\"m\">평판, 명성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>니나 시몬(유니스 캐슬린 웨이먼)은 뛰어난 음악적 재능을 가졌으나, 어린 시절부터 가혹한 인종 차별을 겪었다.<\/li><li>음악원 입학마저 차별로 좌절된 후, 그녀는 스스로 돈을 벌며 예명으로 활동을 개척했다.<\/li><li>1960년대에는 자신의 음악을 무기로 삼아 흑인 민권 운동에 적극적으로 참여하며 저항했다.<\/li><li>비록 인종 차별의 벽에 지쳐 미국을 떠났지만, 그녀가 남긴 강력한 음악과 정신은 오늘날까지 이어지고 있다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Nina Simone established herself as a great musician despite continuous racial discrimination, and she actively supported the Civil Rights Movement through her powerful songs.<\/div>\n              <div class=\"lec-final-sum-ko\">니나 시몬은 지속적인 인종차별에도 불구하고 위대한 음악가로 확고히 자리 잡았으며, 그녀의 강력한 노래를 통해 민권 운동을 적극적으로 지원했다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./26_audio/1.mp3","hl":null}],[{"audio":"./26_audio/2.mp3","hl":null}],[{"audio":"./26_audio/3.mp3","hl":null},{"audio":"./26_audio/4.mp3","hl":"stage-0"},{"audio":"./26_audio/5.mp3","hl":"stage-1"},{"audio":"./26_audio/6.mp3","hl":"stage-2"},{"audio":"./26_audio/7.mp3","hl":"stage-3"}],[{"audio":"./26_audio/8.mp3","hl":null}],[{"audio":"./26_audio/9.mp3","hl":"main"},{"audio":"./26_audio/10.mp3","hl":"meaning"},{"audio":"./26_audio/11.mp3","hl":"grammar"}],[{"audio":"./26_audio/12.mp3","hl":"main"},{"audio":"./26_audio/13.mp3","hl":"meaning"},{"audio":"./26_audio/14.mp3","hl":"grammar"}],[{"audio":"./26_audio/15.mp3","hl":"main"},{"audio":"./26_audio/16.mp3","hl":"meaning"},{"audio":"./26_audio/17.mp3","hl":"grammar"}],[{"audio":"./26_audio/18.mp3","hl":"main"},{"audio":"./26_audio/19.mp3","hl":"meaning"},{"audio":"./26_audio/20.mp3","hl":"grammar"}],[{"audio":"./26_audio/21.mp3","hl":"main"},{"audio":"./26_audio/22.mp3","hl":"meaning"},{"audio":"./26_audio/23.mp3","hl":"grammar"}],[{"audio":"./26_audio/24.mp3","hl":"main"},{"audio":"./26_audio/25.mp3","hl":"meaning"},{"audio":"./26_audio/26.mp3","hl":"grammar"}],[{"audio":"./26_audio/27.mp3","hl":"main"},{"audio":"./26_audio/28.mp3","hl":"meaning"},{"audio":"./26_audio/29.mp3","hl":"grammar"}],[{"audio":"./26_audio/30.mp3","hl":"main"},{"audio":"./26_audio/31.mp3","hl":"meaning"},{"audio":"./26_audio/32.mp3","hl":"grammar"}],[{"audio":"./26_audio/33.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_26번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10
