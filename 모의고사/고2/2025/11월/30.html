 울타리 안에서 서로 돌보며 살아가는 것 자체를 인간 삶의 근본적인 번영(Flourishing)으로 봅니다. 즉, 가정환경 때문에 출발선이 달라져서 생기는 사회적 불평등(Societal inequalities)을 국가가 전부 통제하고 평등하게 맞출 것인지, 아니면 가족 고유의 가치를 인정하고 복지의 일차적 역할을 가족에게 맡길 것인지에 대한 두 세계관의 차이를 염두에 두시면 글의 맥락이 훨씬 쉽게 다가오실 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01자유주의 문화의 가치관<\/div><ul><li>자유주의 문화에서는 개인의 공정한 기회균등이 가족의 보존보다 우선순위를 가진다.<\/li><li>개인의 공정한 기회균등(fair equality of opportunity)을 가장 중시함<\/li><li>가족의 온전성(family&#39;s integrity) 유지보다 개인의 가치를 우선함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02유교 문화의 가치관<\/div><ul><li>유교 문화에서는 기회균등도 중요하지만 가족 제도가 인간 삶의 필수적이고 근본적인 역할을 한다고 본다.<\/li><li>개인을 시민보다 가족 구성원(family members)으로 먼저 인식함<\/li><li>사회적 불평등을 초래하더라도 가족의 내재적 가치(inherent value)를 포기하지 않음<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03자유주의 문화의 정책 방향<\/div><ul><li>자유주의 사회는 공정한 기회를 추구하기 위해 가족의 역할을 제한하고 국가의 개입을 늘린다.<\/li><li>가족의 역할에 대한 제한(restrictions) 부과를 선택함<\/li><li>교육과 의료 등을 위한 평등주의적인 정부 프로그램(egalitarian government programs)을 실행함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04유교 문화의 정책 방향<\/div><ul><li>유교 사회는 기본권만 보장된다면 불평등을 일부 수용하며 가족에게 복지 책임을 맡기는 것을 선호한다.<\/li><li>사회적 복지 책임(welfare responsibilities)을 주로 가족에게 할당함<\/li><li>가족의 존재로 인해 발생하는 불평등(inequalities)을 기꺼이 용인함<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">liberal<\/td><td class=\"m\">자유주의의<\/td><\/tr><tr><td class=\"w\">outweigh<\/td><td class=\"m\">~보다 더 크다, ~보다 더 중요하다<\/td><\/tr><tr><td class=\"w\">integrity<\/td><td class=\"m\">온전함, 완전성<\/td><\/tr><tr><td class=\"w\">in contrast<\/td><td class=\"m\">대조적으로<\/td><\/tr><tr><td class=\"w\">assume<\/td><td class=\"m\">(역할이나 책임을) 맡다<\/td><\/tr><tr><td class=\"w\">be regarded as<\/td><td class=\"m\">~로 여겨지다, ~로 간주되다<\/td><\/tr><tr><td class=\"w\">inherent<\/td><td class=\"m\">고유한, 내재된<\/td><\/tr><tr><td class=\"w\">abandon<\/td><td class=\"m\">버리다, 포기하다<\/td><\/tr><tr><td class=\"w\">result in<\/td><td class=\"m\">~을 초래하다, ~라는 결과를 낳다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">impose restrictions on<\/td><td class=\"m\">~에 제한을 가하다<\/td><\/tr><tr><td class=\"w\">implement<\/td><td class=\"m\">실행하다, 실시하다<\/td><\/tr><tr><td class=\"w\">egalitarian<\/td><td class=\"m\">평등주의의<\/td><\/tr><tr><td class=\"w\">in the pursuit of<\/td><td class=\"m\">~을 추구하여<\/td><\/tr><tr><td class=\"w\">on the other hand<\/td><td class=\"m\">반면에, 다른 한편으로는<\/td><\/tr><tr><td class=\"w\">assign<\/td><td class=\"m\">할당하다, 부여하다<\/td><\/tr><tr><td class=\"w\">stem from<\/td><td class=\"m\">~에서 비롯되다, ~에서 기인하다<\/td><\/tr><tr><td class=\"w\">as long as<\/td><td class=\"m\">~하는 한, ~하기만 하면<\/td><\/tr><tr><td class=\"w\">safeguard<\/td><td class=\"m\">보호하다, 지키다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Within liberal culture,<\/b><\/span><span class=\"ko\">자유주의 문화 내에서는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the value of fair equality of opportunity for individuals<\/b><\/span><span class=\"ko\">개인들을 위한 기회의 공정한 평등이라는 가치가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">outweighs<\/span><\/b><\/span><span class=\"ko\">더 중대하다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the preservation of the family’s integrity.<\/b><\/span><span class=\"ko\">가족의 온전함을 보존하는 것보다<\/span><\/div><\/div><div class=\"lec-sent-ko\">자유주의 문화 내에서는, 개인들을 위한 기회의 공정한 평등이라는 가치가 가족의 온전함을 보존하는 것보다 중대하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 자유주의 문화의 특징을 먼저 제시하며 글을 엽니다. outweighs the preservation은 개인의 평등한 기회를 보장하는 것이 가족이라는 집단이 유지되는 것보다 더 중요하게 취급된다는 의미입니다. 개인주의적 가치관이 지배적인 사회의 특징을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">outweighs (타동사): 주어(the value)가 3인칭 단수이므로 동사에 -s가 붙었으며, 뒤에 목적어(the preservation ~)를 취하는 기본구조(V + O)를 이룬다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">liberal<\/td><td class=\"m\">자유주의의<\/td><\/tr><tr><td class=\"w\">outweigh<\/td><td class=\"m\">~보다 더 크다, ~보다 더 중요하다<\/td><\/tr><tr><td class=\"w\">integrity<\/td><td class=\"m\">온전함, 완전성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In contrast,<\/b><\/span><span class=\"ko\">이에 반해,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for Confucian culture,<\/b><\/span><span class=\"ko\">유교 문화에서는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>while <span class=\"grammar-hl\">seeking<\/span> fair equality of opportunity for individuals is important,<\/b><\/span><span class=\"ko\">개인들을 위한 기회의 공정한 평등을 추구하는 것이 중요하지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the family assumes a fundamental role<\/b><\/span><span class=\"ko\">가족은 근본적인 역할을 맡으며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in human flourishing,<\/b><\/span><span class=\"ko\">인간의 번영에 있어,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">living<\/span> within a family institution<\/b><\/span><span class=\"ko\">그리고 가족 제도 안에서 사는 것이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">is considered<\/span><\/b><\/span><span class=\"ko\">간주된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the essential way of life.<\/b><\/span><span class=\"ko\">삶의 본질적인 방식으로<\/span><\/div><\/div><div class=\"lec-sent-ko\">이에 반해 유교 문화에서는, 개인들을 위한 기회의 공정한 평등을 추구하는 것이 중요하지만, 가족은 인간의 번영에 있어 근본적인 역할을 맡으며, 가족 제도 안에서 사는 것이 삶의 본질적인 방식으로 간주된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장과 대조되는 유교 문화의 관점을 소개합니다. assumes a fundamental role은 가족이 사람이 잘살아가는 데 바탕이 되는 역할을 떠맡는다는 의미입니다. 개인의 기회 균등도 중요하지만, 그보다 가족이라는 테두리 안에서 살아가는 것을 삶의 가장 핵심적인 조건으로 본다는 뜻입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">seeking (동명사(명사적)): 접속사 while이 이끄는 부사절 내에서 주어 자리에 쓰였다.<\/div><div class=\"lec-gr-item\">living (동명사(명사적)): 등위접속사 and 뒤에 이어지는 절에서 주어 자리에 쓰였다.<\/div><div class=\"lec-gr-item\">is considered (수동태): be동사(is)+p.p.(considered) 구조. consider는 타동사로 기본구조는 consider A B(5형식, A를 B로 여기다)인데, 목적어(A)가 주어로 올라가면서 뒤에 목적어가 없어져 수동구조 is considered가 되고 목적격 보어(B, the essential way of life)는 그대로 남는다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in contrast<\/td><td class=\"m\">대조적으로<\/td><\/tr><tr><td class=\"w\">assume<\/td><td class=\"m\">(역할이나 책임을) 맡다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Individuals are primarily understood<\/b><\/span><span class=\"ko\">개인들은 우선적으로 이해된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as family members<\/b><\/span><span class=\"ko\">가족 구성원으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>before they <span class=\"grammar-hl\">are regarded<\/span><\/b><\/span><span class=\"ko\">그들이 여겨지기 전에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as state citizens.<\/b><\/span><span class=\"ko\">국가의 시민으로<\/span><\/div><\/div><div class=\"lec-sent-ko\">개인들은 국가의 시민으로 여겨지기 전에 우선적으로 가족 구성원으로 이해된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 유교 문화에서 가족이 왜 그렇게 중요한지 이유를 뒷받침합니다. primarily understood as family members는 사람의 정체성을 규정할 때 국가라는 거대한 공동체의 일원(시민)이기보다, 자신이 속한 가족의 일원이라는 점을 가장 먼저 떠올리고 중시한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are understood (수동태): be동사(are)+p.p.(understood) 구조. understand는 타동사인데 뒤에 목적어가 없어서 수동구조 are understood 형태로 쓴다. 기본구조: understand A as B (A를 B로 이해하다).<\/div><div class=\"lec-gr-item\">are regarded (수동태): be동사(are)+p.p.(regarded) 구조. regard는 타동사인데 뒤에 목적어가 없어서 수동구조 are regarded 형태로 쓴다. 기본구조: regard A as B (A를 B로 간주하다).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be regarded as<\/td><td class=\"m\">~로 여겨지다, ~로 간주되다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Therefore,<\/b><\/span><span class=\"ko\">그러므로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for Confucians,<\/b><\/span><span class=\"ko\">유교를 따르는 사람들에게는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the family possesses inherent value<\/b><\/span><span class=\"ko\">가족은 내재적인 가치를 지닌다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> <span class=\"grammar-hl\">should never be abandoned<\/span>,<\/b><\/span><span class=\"ko\">결코 포기되어서는 안 되는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>even if it <span class=\"grammar-hl\">results<\/span><\/b><\/span><span class=\"ko\">비록 그것이 초래할지라도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">in<\/span> certain societal inequalities.<\/b><\/span><span class=\"ko\">어떤 사회적 불평등을<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러므로 유교를 따르는 사람들에게는, 가족은 그것이 어떤 사회적 불평등을 초래할지라도, 결코 포기되어서는 안 되는 내재적인 가치를 지닌다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 유교 문화의 특징에 대한 결론을 내립니다. possesses inherent value는 가족이라는 집단 자체가 다른 어떤 목적을 위한 수단이 되지 않고 그 자체로 소중하여 지켜야 할 가치를 가진다는 의미입니다. 가족을 지키기 위해 사회 전체적으로 약간의 불평등이 생겨나는 것쯤은 감수할 수 있다는 확고한 태도를 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that 주격 관계대명사: 선행사 inherent value를 수식하는 관계사절을 이끌며, 절 내부에서 주어 역할을 한다.<\/div><div class=\"lec-gr-item\">should never be abandoned (수동태): 조동사(should)+be동사(be)+p.p.(abandoned) 구조. abandon은 타동사인데 뒤에 목적어가 없어서 수동구조 be abandoned 형태로 쓴다. 기본구조: abandon + O (목적어를 버리다).<\/div><div class=\"lec-gr-item\">results in (관용표현): &#39;~을 초래하다&#39; 또는 &#39;~라는 결과를 낳다&#39;라는 의미로 굳어진 동사구 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">inherent<\/td><td class=\"m\">고유한, 내재된<\/td><\/tr><tr><td class=\"w\">abandon<\/td><td class=\"m\">버리다, 포기하다<\/td><\/tr><tr><td class=\"w\">result in<\/td><td class=\"m\">~을 초래하다, ~라는 결과를 낳다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Some cultures, like <span class=\"grammar-hl\">the liberal one<\/span>,<\/b><\/span><span class=\"ko\">자유주의 문화와 같은 일부 문화들은,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>may choose<\/b><\/span><span class=\"ko\">택할지도 모른다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to impose<\/span> <span class=\"grammar-hl\">increasing<\/span> restrictions<\/b><\/span><span class=\"ko\">점점 더 많은 제약들을 부과하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on the role of families<\/b><\/span><span class=\"ko\">가족의 역할에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">implement<\/span> more egalitarian government programs<\/b><\/span><span class=\"ko\">그리고 더 인류 평등주의의 정부 프로그램들을 실행하기를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for education, healthcare, and other positive rights<\/b><\/span><span class=\"ko\">교육, 의료, 그리고 다른 적극적 권리들에 대한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in society<\/b><\/span><span class=\"ko\">사회에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the pursuit of fair equality of opportunity.<\/b><\/span><span class=\"ko\">기회의 공정한 평등을 추구하면서<\/span><\/div><\/div><div class=\"lec-sent-ko\">자유주의 문화와 같은 일부 문화들은, 가족의 역할에 점점 더 많은 제약들을 부과하고, 기회의 공정한 평등을 추구하면서 교육, 의료, 그리고 다른 적극적 권리들에 대한 더 인류 평등주의의 정부 프로그램들을 사회에서 실행하기를 택할지도 모른다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 다시 자유주의 문화로 돌아와, 이들이 공평한 기회를 위해 현실에서 어떤 제도를 택하는지 구체적으로 예시를 듭니다. impose increasing restrictions on the role of families는 가정의 경제력이나 배경이 자녀의 기회에 불평등한 영향을 주지 않도록, 육아나 교육 같은 역할을 가족 대신 국가가 통제하고 맡으려 한다는 의미입니다. 국가는 교육이나 의료 등에서 누구나 평등하게 누릴 수 있는 정책을 펼치는 데 집중합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">the liberal one 대명사: one은 앞에 나온 명사 culture의 반복을 피하기 위해 쓰인 부정대명사이다.<\/div><div class=\"lec-gr-item\">to impose (to부정사(명사적)): 타동사 choose의 목적어 자리(choose to V)에 쓰였다.<\/div><div class=\"lec-gr-item\">increasing (현재분사(형용사)): increasing이 뒤의 명사 restrictions를 수식(= &#39;증가하는/가중되는 제한&#39;).<\/div><div class=\"lec-gr-item\">implement (to부정사(명사적)): 등위접속사 and로 연결되어 앞의 (to) impose와 병렬구조를 이루며, choose의 목적어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">liberal<\/td><td class=\"m\">자유주의의<\/td><\/tr><tr><td class=\"w\">impose restrictions on<\/td><td class=\"m\">~에 제한을 가하다<\/td><\/tr><tr><td class=\"w\">implement<\/td><td class=\"m\">실행하다, 실시하다<\/td><\/tr><tr><td class=\"w\">egalitarian<\/td><td class=\"m\">평등주의의<\/td><\/tr><tr><td class=\"w\">in the pursuit of<\/td><td class=\"m\">~을 추구하여<\/td><\/tr><tr><td class=\"w\">on the other hand<\/td><td class=\"m\">반면에, 다른 한편으로는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>On the other hand,<\/b><\/span><span class=\"ko\">반면,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>other cultures, like <span class=\"grammar-hl\">the Confucian one<\/span>,<\/b><\/span><span class=\"ko\">유교 문화와 같은 다른 문화들은,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>may prefer<\/b><\/span><span class=\"ko\">선호할지도 모른다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to primarily assign<\/span> welfare responsibilities<\/b><\/span><span class=\"ko\">복지에 대한 책임을 우선적으로 부여하는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to the family,<\/b><\/span><span class=\"ko\">가족에게,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">tolerating<\/span> inequalities<\/b><\/span><span class=\"ko\">불평등을 용인하며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">stemming from<\/span> the existence of the family<\/b><\/span><span class=\"ko\">가족의 존재로 인해 발생하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as long as everyone’s basic freedoms and rights <span class=\"grammar-hl\">are safeguarded<\/span><\/b><\/span><span class=\"ko\">모든 사람의 기본적 자유와 권리들이 보장되는 한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the state.<\/b><\/span><span class=\"ko\">국가에서<\/span><\/div><\/div><div class=\"lec-sent-ko\">반면 유교 문화와 같은 다른 문화들은, 국가에서 모든 사람의 기본적 자유와 권리들이 보장되는 한, 가족의 존재로 인해 발생하는 불평등을 용인하며 복지에 대한 책임을 우선적으로 가족에게 부여하는 것을 선호할지도 모른다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 마지막으로 유교 문화의 구체적인 현실 제도를 자유주의와 비교하며 글을 맺습니다. primarily assign welfare responsibilities는 아프거나 늙은 가족 구성원을 돌보는 일을 국가 기관이 아닌 가족 내부의 책임으로 맡긴다는 의미입니다. 국가가 사람들의 최소한의 인권만 지켜준다면, 부유한 가족과 가난한 가족 사이에서 발생하는 삶의 질 차이 정도는 가족 중심의 삶을 유지하기 위해 받아들일 수 있다고 여깁니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">the Confucian one 대명사: one은 앞에 나온 명사 culture를 대신하는 부정대명사로 쓰였다.<\/div><div class=\"lec-gr-item\">to primarily assign (to부정사(명사적)): 타동사 prefer의 목적어 역할을 한다. 부사 primarily가 to와 동사원형 사이에 들어간 분리부정사 구조이다.<\/div><div class=\"lec-gr-item\">tolerating (분사구문): 접속사 없이 -ing 형태가 부사적 기능으로 쓰였다. 문맥상 동시동작이나 연속상황을 나타내며, 원래 절은 &#39;while they(other cultures) tolerate ...&#39; 또는 &#39;and they tolerate ...&#39;로 변환할 수 있다.<\/div><div class=\"lec-gr-item\">stemming from (현재분사(형용사)): stemming from이 앞의 명사 inequalities를 수식(= &#39;가족의 존재로부터 비롯되는 불평등&#39;).<\/div><div class=\"lec-gr-item\">are safeguarded (수동태): be동사(are)+p.p.(safeguarded) 구조. safeguard는 타동사인데 뒤에 목적어가 없어서 수동구조 are safeguarded 형태로 쓴다. 기본구조: safeguard + O (목적어를 보호하다).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">on the other hand<\/td><td class=\"m\">반면에, 다른 한편으로는<\/td><\/tr><tr><td class=\"w\">assign<\/td><td class=\"m\">할당하다, 부여하다<\/td><\/tr><tr><td class=\"w\">stem from<\/td><td class=\"m\">~에서 비롯되다, ~에서 기인하다<\/td><\/tr><tr><td class=\"w\">as long as<\/td><td class=\"m\">~하는 한, ~하기만 하면<\/td><\/tr><tr><td class=\"w\">safeguard<\/td><td class=\"m\">보호하다, 지키다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>자유주의 문화는 가족의 온전한 유지보다 개인의 공정한 기회 평등을 우선시하여 국가 주도의 평등한 복지 정책을 실행한다.<\/li><li>반면 유교 문화는 가족 안에서 살아가는 것을 인간 삶의 근본으로 보아 가족 구성원으로서의 정체성을 가장 중시한다.<\/li><li>유교 사회는 최소한의 인권이 보장되는 한, 약간의 사회적 불평등이 생기더라도 가족 자체의 가치를 지키는 쪽을 택한다.<\/li><li>따라서 복지나 돌봄의 책임 역시 국가보다는 가족에게 주로 맡기는 성향을 보인다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Liberal cultures promote egalitarian programs to ensure individual equality of opportunity, whereas Confucian cultures preserve the fundamental role of the family despite potential societal inequalities.<\/div>\n              <div class=\"lec-final-sum-ko\">자유주의 문화는 개인의 기회균등을 보장하기 위해 평등주의적 프로그램을 촉진하는 반면, 유교 문화는 잠재적인 사회적 불평등에도 불구하고 가족의 근본적인 역할을 보존한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./30_audio/1.mp3","hl":null}],[{"audio":"./30_audio/2.mp3","hl":null}],[{"audio":"./30_audio/3.mp3","hl":null},{"audio":"./30_audio/4.mp3","hl":"stage-0"},{"audio":"./30_audio/5.mp3","hl":"stage-1"},{"audio":"./30_audio/6.mp3","hl":"stage-2"},{"audio":"./30_audio/7.mp3","hl":"stage-3"}],[{"audio":"./30_audio/8.mp3","hl":null}],[{"audio":"./30_audio/9.mp3","hl":"main"},{"audio":"./30_audio/10.mp3","hl":"meaning"},{"audio":"./30_audio/11.mp3","hl":"grammar"}],[{"audio":"./30_audio/12.mp3","hl":"main"},{"audio":"./30_audio/13.mp3","hl":"meaning"},{"audio":"./30_audio/14.mp3","hl":"grammar"}],[{"audio":"./30_audio/15.mp3","hl":"main"},{"audio":"./30_audio/16.mp3","hl":"meaning"},{"audio":"./30_audio/17.mp3","hl":"grammar"}],[{"audio":"./30_audio/18.mp3","hl":"main"},{"audio":"./30_audio/19.mp3","hl":"meaning"},{"audio":"./30_audio/20.mp3","hl":"grammar"}],[{"audio":"./30_audio/21.mp3","hl":"main"},{"audio":"./30_audio/22.mp3","hl":"meaning"},{"audio":"./30_audio/23.mp3","hl":"grammar"}],[{"audio":"./30_audio/24.mp3","hl":"main"},{"audio":"./30_audio/25.mp3","hl":"meaning"},{"audio":"./30_audio/26.mp3","hl":"grammar"}],[{"audio":"./30_audio/27.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_30번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 30번","titleEn":"Liberal vs. Confucian Perspectives on Equality and Family","titleKo":"평등과 가족에 대한 자유주의와 유교주의의 관점","imageUrl":"__enpImg__","stages":[{"label":"01자유주의 문화의 가치관","items":["자유주의 문화에서는 개인의 공정한 기회균등이 가족의 보존보다 우선순위를 가진다.","개인의 공정한 기회균등(fair equality of opportunity)을 가장 중시함","가족의 온전성(family's integrity) 유지보다 개인의 가치를 우선함"]},{"label":"02유교 문화의 가치관","items":["유교 문화에서는 기회균등도 중요하지만 가족 제도가 인간 삶의 필수적이고 근본적인 역할을 한다고 본다.","개인을 시민보다 가족 구성원(family members)으로 먼저 인식함","사회적 불평등을 초래하더라도 가족의 내재적 가치(inherent value)를 포기하지 않음"]},{"label":"03자유주의 문화의 정책 방향","items":["자유주의 사회는 공정한 기회를 추구하기 위해 가족의 역할을 제한하고 국가의 개입을 늘린다.","가족의 역할에 대한 제한(restrictions) 부과를 선택함","교육과 의료 등을 위한 평등주의적인 정부 프로그램(egalitarian government programs)을 실행함"]},{"label":"04유교 문화의 정책 방향","items":["유교 사회는 기본권만 보장된다면 불평등을 일부 수용하며 가족에게 복지 책임을 맡기는 것을 선호한다.","사회적 복지 책임(welfare responsibilities)을 주로 가족에게 할당함","가족의 존재로 인해 발생하는 불평등(inequalities)을 기꺼이 용인함"]}],"bkg":"이 지문을 깊이 있게 이해하시려면 개인의 권리를 중시하는 자유주의(Liberalism)와 가족 및 공동체의 가치를 우선하는 유교주의(Confucianism)의 철학적 배경 차이를 아시는 것이 좋습니다. 자유주의 사회에서는 마치 달리기 경주에서 모두가 똑같은 출발선과 운동화를 가져야 한다는 공정한 기회균등(Fair equality of opportunity)을 가장 중요하게 생각하기 때문에, 불평등을 없애고자 국가가 나서서 교육이나 의료 같은 적극적 권리(Positive rights)를 강력하게 보장하려고 합니다. 반면 유교 문화에서는 개인이 국가의 시민이기 이전에 가족의 일원이라는 점을 강조하며, 설령 누군가 부모님의 지원으로 조금 더 좋은 운동화를 신고 뛰더라도 가족이라는 울타리 안에서 서로 돌보며 살아가는 것 자체를 인간 삶의 근본적인 번영(Flourishing)으로 봅니다. 즉, 가정환경 때문에 출발선이 달라져서 생기는 사회적 불평등(Societal inequalities)을 국가가 전부 통제하고 평등하게 맞출 것인지, 아니면 가족 고유의 가치를 인정하고 복지의 일차적 역할을 가족에게 맡길 것인지에 대한 두 세계관의 차이를 염두에 두시면 글의 맥락이 훨씬 쉽게 다가오실 거예요.","ttsText":"이 지문을 깊이 있게 이해하시려면 개인의 권리를 중시하는 자유주의(Liberalism)와 가족 및 공동체의 가치를 우선하는 유교주의(Confucianism)의 철학적 배경 차이를 아시는 것이 좋습니다. 자유주의 사회에서는 마치 달리기 경주에서 모두가 똑같은 출발선과 운동화를 가져야 한다는 공정한 기회균등(Fair equality of opportunity)을 가장 중요하게 생각하기 때문에, 불평등을 없애고자 국가가 나서서 교육이나 의료 같은 적극적 권리(Positive rights)를 강력하게 보장하려고 합니다. 반면 유교 문화에서는 개인이 국가의 시민이기 이전에 가족의 일원이라는 점을 강조하며, 설령 누군가 부모님의 지원으로 조금 더 좋은 운동화를 신고 뛰더라도 가족이라는 울타리 안에서 서로 돌보며 살아가는 것 자체를 인간 삶의 근본적인 번영(Flourishing)으로 봅니다. 즉, 가정환경 때문에 출발선이 달라져서 생기는 사회적 불평등(Societal inequalities)을 국가가 전부 통제하고 평등하게 맞출 것인지, 아니면 가족 고유의 가치를 인정하고 복지의 일차적 역할을 가족에게 맡길 것인지에 대한
