<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 30번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 30번","audioDir":"30_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">30번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>Individual Equality vs. Family Integrity: A Cultural Comparison\u003c/h1>\u003ch2>개인의 평등 대 가족의 온전함: 문화적 비교\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>자유주의 문화는 개인의 \u003cb class=\"key\">기회의 \u003c/b>\u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">평등\u003c/b>을 가족의 온전함보다 중시하는 반면, 유교 문화는 \u003cb class=\"key\">가족의 \u003c/b>\u003cb class=\"key\">내재적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 인간 번영의 근간으로 보아 이를 지키기 위해 일부 사회적 불평등을 감수한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>While liberal culture prioritizes individual equality over family integrity, Confucian culture views the family as a fundamental institution whose inherent value outweighs total societal equality.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 2025년 10월 고2 모의고사 서른 번째 지문을 함께 분석해 보겠습니다. 이 지문은 자유주의와 유교라는 서로 다른 문화적 배경이 개인의 평등과 가족의 가치를 어떻게 다르게 바라보는지 비교하는 글이에요. 자유주의는 개인의 평등을, 유교는 가족의 보존을 더 중시한다는 핵심 요지만 기억해도 글 전체가 쉽게 읽힐 겁니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">서구의 \u003cb class=\"key\">자유주의(Liberalism)\u003c/b>는 개인의 자율성과 평등한 기회를 사회의 가장 중요한 정의로 간주합니다. 이와 대조적으로 \u003cb class=\"key\">유교(Confucianism)\u003c/b>는 개인을 독립된 개체가 아닌 관계의 중심인 가족의 일원으로 먼저 파악합니다. 마치 \u003cb class=\"key\">오케스트라\u003c/b>에서 개별 연주자의 기량도 중요하지만 전체 화음이 깨지지 않는 것을 더 중시하는 것과 비슷합니다. 이러한 가치관의 차이는 국가가 교육이나 의료 같은 \u003cb class=\"key\">복지(Welfare)\u003c/b>의 책임을 개인에게 직접 줄 것인지, 아니면 가족을 통해 실현할 것인지 결정하는 근거가 됩니다.\u003c/div>","segs":[{"n":2,"text":"우리가 흔히 서구적 가치라고 부르는 자유주의는 개인이 사회로부터 공정한 기회를 받는 것을 정의라고 생각해요. 하지만 유교 문화권은 조금 다릅니다. 개인을 독립된 섬이 아니라 가족이라는 커다란 유기체의 일부분으로 보죠. 마치 축구 경기에서 선수 개인의 기록보다 팀 전체의 승리와 결속을 더 중시하는 것과 비슷해요. 이런 철학적 차이가 결국 한 나라의 복지 정책까지 바꾼다는 점이 참 흥미롭습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>자유주의의 우선순위\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">자유주의 \u003c/b>\u003cb class=\"key\">문화\u003c/b>에서는 개인의 공정한 기회 평등이 가족의 보존보다 더 큰 가치를 지닌다고 설명하며 글을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>유교 문화의 가치관\u003csmall>대조 · 문장 2–3\u003c/small>\u003c/h4>\u003cp>이와 반대로 \u003cb class=\"key\">유교 \u003c/b>\u003cb class=\"key\">문화\u003c/b>에서는 가족을 인간 번영의 근간으로 보며, 개인을 국가 시민이기 전에 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">구성원\u003c/b>으로 먼저 이해합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>가족의 내재적 가치\u003csmall>강조 · 문장 4\u003c/small>\u003c/h4>\u003cp>유교적 관점에서는 사회적 불평등이 발생하더라도 결코 포기할 수 없는 \u003cb class=\"key\">내재적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>가 가족에게 있음을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>정책적 실행의 차이\u003csmall>결론 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>결과적으로 자유주의는 \u003cb class=\"key\">정부 \u003c/b>\u003cb class=\"key\">프로그램\u003c/b>을 통한 평등을 추구하고, 유교 문화는 가족에게 \u003cb class=\"key\">복지 \u003c/b>\u003cb class=\"key\">책임\u003c/b>을 부여하는 쪽을 선호합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 지문이 어떤 순서로 이 두 관점을 대조하는지 차근차근 살펴볼까요?","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장에서는 자유주의 문화의 특징을 보여줍니다. 여기서는 개인의 기회 평등이라는 가치가 가족의 온전함을 지키는 것보다 더 무겁고 중요하다고 명시하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 두 번째와 세 번째 문장에서는 In contrast를 사용해 유교 문화를 소개합니다. 유교에서는 가족이 인간 번영의 근본이며, 사람은 국가의 시민이기 전에 가족의 구성원으로 먼저 존재한다는 점을 강조해요.","hl":"f1"},{"n":6,"text":"세 번째 단계인 네 번째 문장에서는 유교의 결론적인 태도가 나옵니다. 사회에 불평등이 생기더라도 가족이 가진 내재적 가치는 절대 포기할 수 없는 것이라고 단언하고 있습니다.","hl":"f2"},{"n":7,"text":"마지막 단계인 다섯 번째와 여섯 번째 문장은 구체적인 정책의 차이를 보여줍니다. 자유주의는 정부 주도의 평등주의 프로그램을 선호하는 반면, 유교 문화는 복지의 책임을 가족에게 맡기는 것을 선호한다고 정리하며 끝을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 지문은 자유주의와 유교라는 두 가지 상반된 문화적 관점을 \u003cb class=\"key\">비교·대조\u003c/b>하는 전형적인 구조입니다. 첫 문장에서 자유주의의 핵심 가치를 제시한 뒤, \u003cb class=\"key\">In \u003c/b>\u003cb class=\"key\">contrast\u003c/b>를 기점으로 유교 문화의 특수성을 상세히 설명하며 논리를 전개합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>In contrast (2)\u003c/b>\u003cspan>대조 시작\u003c/span>\u003cb>Therefore (4)\u003c/b>\u003cspan>인과 및 주장 강화\u003c/span>\u003cb>On the other hand (6)\u003c/b>\u003cspan>정책적 측면의 대조\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">fair equality of opportunity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">human flourishing\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">essential way of life\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">inherent value\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">welfare responsibilities\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>자유주의 문화\u003c/th>\u003cth>유교 문화\u003c/th>\u003c/tr>\u003ctr>\u003ctd>개인의 기회 평등이 가족 보존보다 우위\u003c/td>\u003ctd>가족이 인간 번영과 삶의 본질적 기초\u003c/td>\u003c/tr>\u003ctr>\u003ctd>정부의 평등주의 정책(교육·의료) 강조\u003c/td>\u003ctd>가족 중심의 복지 책임 및 불평등 용인\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글의 전개 방식은 전형적인 비교 대조 구조입니다. 첫 번째 문장에서 자유주의라는 한쪽의 입장을 먼저 밝히는 두괄식 구성을 취하고 있죠. 그 이후에는 유교 문화라는 반대되는 관점을 가져와서 두 가치관이 어떻게 충돌하고 다른 선택을 하는지 보여줍니다.","hl":"ty"},{"n":9,"text":"글의 흐름을 잡아주는 신호어들이 아주 명확해요. 두 번째 문장의 In contrast는 분위기를 반전시키며 유교의 관점을 도입하죠. 네 번째 문장의 Therefore는 유교적 가치관에 따른 결론을 이끌어냅니다. 마지막으로 여섯 번째 문장의 On the other hand는 두 문화의 복지 정책 차이를 다시 한번 대조하며 글을 마무리합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>liberal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>자유주의의\u003c/span>\u003c/div>\u003cdiv>\u003cb>fair\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>공정한\u003c/span>\u003c/div>\u003cdiv>\u003cb>equality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>평등\u003c/span>\u003c/div>\u003cdiv>\u003cb>opportunity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기회\u003c/span>\u003c/div>\u003cdiv>\u003cb>outweigh\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~보다 중요하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>preservation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>보존\u003c/span>\u003c/div>\u003cdiv>\u003cb>integrity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>온전함\u003c/span>\u003c/div>\u003cdiv>\u003cb>Confucian\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>유교의\u003c/span>\u003c/div>\u003cdiv>\u003cb>seek\u003c/b>\u003cem>동사\u003c/em>\u003cspan>추구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>assume\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(역할을) 맡다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fundamental\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>근본적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>flourishing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>번영\u003c/span>\u003c/div>\u003cdiv>\u003cb>institution\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제도\u003c/span>\u003c/div>\u003cdiv>\u003cb>essential\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>본질적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>primarily\u003c/b>\u003cem>부사\u003c/em>\u003cspan>우선적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>regard\u003c/b>\u003cem>동사\u003c/em>\u003cspan>여기다\u003c/span>\u003c/div>\u003cdiv>\u003cb>possess\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inherent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>내재적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>abandon\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포기하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>societal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>사회적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>inequality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불평등\u003c/span>\u003c/div>\u003cdiv>\u003cb>impose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부과하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>restriction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제약\u003c/span>\u003c/div>\u003cdiv>\u003cb>implement\u003c/b>\u003cem>동사\u003c/em>\u003cspan>실행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>egalitarian\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인류 평등주의의\u003c/span>\u003c/div>\u003cdiv>\u003cb>assign\u003c/b>\u003cem>동사\u003c/em>\u003cspan>부여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>welfare\u003c/b>\u003cem>명사\u003c/em>\u003cspan>복지\u003c/span>\u003c/div>\u003cdiv>\u003cb>stem from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 발생하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>safeguard\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보장하다, 보호하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"지문에서 중요한 단어들을 볼까요? outweigh라는 표현은 한 가치가 다른 것보다 더 중요하다는 뜻으로 핵심 논리를 설명할 때 쓰였습니다. 그리고 inherent라는 단어는 유교가 가족에 대해 부여하는 내재적인 가치를 표현할 때 아주 중요하게 쓰였으니 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">outweigh\u003c/b>\u003cspan class=\"m\">~보다 중요하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">surpass\u003c/span>\u003cspan class=\"s\">override\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">integrity\u003c/b>\u003cspan class=\"m\">온전함\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wholeness\u003c/span>\u003cspan class=\"s\">unity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fragmentation\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">inherent\u003c/b>\u003cspan class=\"m\">내재적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">intrinsic\u003c/span>\u003cspan class=\"s\">innate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">acquired\u003c/span>\u003cspan class=\"a\">extrinsic\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">abandon\u003c/b>\u003cspan class=\"m\">포기하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discard\u003c/span>\u003cspan class=\"s\">relinquish\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">retain\u003c/span>\u003cspan class=\"a\">uphold\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">implement\u003c/b>\u003cspan class=\"m\">실행하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">execute\u003c/span>\u003cspan class=\"s\">carry out\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">safeguard\u003c/b>\u003cspan class=\"m\">보장하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">protect\u003c/span>\u003cspan class=\"s\">ensure\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">endanger\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어 정리도 잊지 마세요. outweigh는 surpass나 prevail over와 바꿔 쓸 수 있고, 온전함을 뜻하는 integrity는 wholeness나 unity로 이해할 수 있습니다. 내재적인을 뜻하는 inherent의 반대말은 겉으로 드러나거나 나중에 얻어진 것을 뜻하는 extrinsic이나 acquired가 있다는 점도 챙겨두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자유주의 문화 내에서는,\u003c/span>\u003cspan class=\"en\">Within liberal culture,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인들을 위한 기회의 공정한 평등이라는 가치가\u003c/span>\u003cspan class=\"en\">the value of fair equality of opportunity for individuals\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보다 중대하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">outweighs\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족의 온전함을 보존하는 것보다.\u003c/span>\u003cspan class=\"en\">the preservation of the family's integrity.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자유주의 문화 내에서는, 개인들을 위한 기회의 공정한 평등이라는 가치가 가족의 온전함을 보존하는 것보다 중대하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 도입부로, \u003cb class=\"key\">자유주의\u003c/b> 문화가 \u003cb class=\"key\">개인의 \u003c/b>\u003cb class=\"key\">기회 \u003c/b>\u003cb class=\"key\">평등\u003c/b>을 가족의 결속보다 더 중요하게 여긴다는 핵심 가치를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : the value [단수 주어] + outweighs [3인칭 단수 동사] : \"~보다 더 중대하다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Within liberal culture, 자유주의 문화 내에서는. the value of fair equality of opportunity for individuals, 개인들을 위한 기회의 공정한 평등이라는 가치가. outweighs, 보다 중대하다. the preservation of the family's integrity, 가족의 온전함을 보존하는 것보다.. 이 문장 전체를 해석하면, 자유주의 문화 내에서는, 개인들을 위한 기회의 공정한 평등이라는 가치가 가족의 온전함을 보존하는 것보다 중대하다.","hl":"m"},{"n":13,"text":"이 문장은 자유주의 문화의 우선순위를 보여줍니다. 가족이라는 집단의 가치보다는 개인에게 주어지는 공정한 기회를 더 중요하게 생각한다는 내용이죠.","hl":"mn"},{"n":14,"text":"첫 번째 포인트는 동사 outweighs의 형태입니다. 문장의 주어가 the value라는 단수 명사이기 때문에 동사에 s를 붙여서 주어와 동사의 수 일치를 시켜준 것이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이에 반해 유교 문화에서는,\u003c/span>\u003cspan class=\"en\">In contrast, for Confucian culture,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인들을 위한 기회의 공정한 평등을 추구하는 것이 중요하지만,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">while \u003c/span>\u003cspan class=\"tgt\">seeking \u003c/span>\u003cspan class=\"tgt\">fair \u003c/span>\u003cspan class=\"tgt\">equality \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">opportunity \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">individuals \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> important,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족은 인간의 번영에 있어 근본적인 역할을 맡으며,\u003c/span>\u003cspan class=\"en\">the family assumes a fundamental role in human flourishing,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족 제도 안에서 사는 것이\u003c/span>\u003cspan class=\"en\">and living within a family institution\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삶의 본질적인 방식으로 간주된다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">considered\u003c/span> the essential way of life.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이에 반해 유교 문화에서는, 개인들을 위한 기회의 공정한 평등을 추구하는 것이 중요하지만, 가족은 인간의 번영에 있어 근본적인 역할을 맡으며, 가족 제도 안에서 사는 것이 삶의 본질적인 방식으로 간주된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자유주의와 대조되는 \u003cb class=\"key\">유교 \u003c/b>\u003cb class=\"key\">문화\u003c/b>의 관점을 설명하며, 가족이 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">번영\u003c/b>과 삶의 방식에서 갖는 절대적 위상을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사구 주어의 수 일치\u003c/span> : while [접속사] + seeking [동명사구/S] + is [V] : \"추구하는 것이 ~이지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be + considered [p.p.] : \"간주된다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"In contrast, for Confucian culture, 이에 반해 유교 문화에서는. while seeking fair equality of opportunity for individuals is important, 개인들을 위한 기회의 공정한 평등을 추구하는 것이 중요하지만. the family assumes a fundamental role in human flourishing, 가족은 인간의 번영에 있어 근본적인 역할을 맡으며. and living within a family institution, 가족 제도 안에서 사는 것이. is considered the essential way of life, 삶의 본질적인 방식으로 간주된다.. 이 문장 전체를 해석하면, 이에 반해 유교 문화에서는, 개인들을 위한 기회의 공정한 평등을 추구하는 것이 중요하지만, 가족은 인간의 번영에 있어 근본적인 역할을 맡으며, 가족 제도 안에서 사는 것이 삶의 본질적인 방식으로 간주된다.","hl":"m"},{"n":16,"text":"유교 문화도 기회의 평등을 무시하지는 않지만, 그보다 가족이라는 틀 안에서 인간이 성장하고 살아가는 것을 훨씬 더 본질적이고 근본적으로 본다는 설명입니다.","hl":"mn"},{"n":17,"text":"첫 번째로 while 절 내부를 보면 seeking이라는 동명사구가 주어 역할을 하고 있어요. 동명사구 주어는 항상 단수 취급을 하기 때문에 동사로 is를 썼습니다. 두 번째로 마지막 부분의 is considered는 수동태 표현이에요. 가족 제도 안에서 사는 것이 삶의 방식으로 여겨지는 대상이기 때문에 be동사와 과거분사 형태를 쓴 것이죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인들은 우선적으로 가족 구성원으로 이해된다\u003c/span>\u003cspan class=\"en\">Individuals \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">primarily \u003c/span>\u003cspan class=\"tgt\">understood \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> family members\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국가의 시민으로 여겨지기 전에.\u003c/span>\u003cspan class=\"en\">before they are regarded as state citizens.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">개인들은 국가의 시민으로 여겨지기 전에 우선적으로 가족 구성원으로 이해된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유교적 관점에서 개인의 정체성은 국가보다 \u003cb class=\"key\">가족\u003c/b>에 먼저 뿌리를 두고 있음을 명확히 하여, \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">구성원\u003c/b>으로서의 존재감을 부각합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태와 전치사 as\u003c/span> : be + understood [p.p.] + as [전치사] : \"우선적으로 ~로 이해된다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Individuals are primarily understood as family members, 개인들은 우선적으로 가족 구성원으로 이해된다. before they are regarded as state citizens, 국가의 시민으로 여겨지기 전에.. 이 문장 전체를 해석하면, 개인들은 국가의 시민으로 여겨지기 전에 우선적으로 가족 구성원으로 이해된다.","hl":"m"},{"n":19,"text":"유교 문화에서 사람을 볼 때 가장 먼저 떠올리는 정체성은 바로 가족의 일원이라는 점입니다. 국가의 시민이라는 신분보다 가족 안에서의 역할이 더 앞선다는 뜻이죠.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 are understood as입니다. 개인들이 타인에 의해 가족 구성원으로 이해되고 정의되는 것이라 수동태를 썼습니다. 전치사 as는 여기서 뭐뭐로서라는 자격을 나타내는 표현으로 쓰였네요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로, \u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유교를 따르는 사람들에게는, \u003c/span>\u003cspan class=\"en\">for Confucians,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족은 내재적인 가치를 지닌다 \u003c/span>\u003cspan class=\"en\">the family possesses inherent value\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결코 포기되어서는 안 되는, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">never \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">abandoned\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 초래할지라도 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">if\u003c/span> it results in\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사회적 불평등을.\u003c/span>\u003cspan class=\"en\">certain societal inequalities.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 유교를 따르는 사람들에게는, 가족은 그것이 어떤 사회적 불평등을 초래할지라도, 결코 포기되어서는 안 되는 내재적인 가치를 지닌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유교적 관점에서 가족은 사회적 공정성보다 더 우선시되는 \u003cb class=\"key\">내재적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 지닌 존재임을 강조하며, 가족의 유지가 \u003cb class=\"key\">불평등\u003c/b>보다 중요함을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : inherent value [선행사] + that [주격 관계대명사] + should [조동사] + be abandoned [수동태] : \"결코 포기되어서는 안 되는 (가치)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">양보의 접속사\u003c/span> : even if [접속사] + it [주어] + results in [동사] : \"~할지라도\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Therefore, 그러므로. for Confucians, 유교를 따르는 사람들에게는. the family possesses inherent value, 가족은 내재적인 가치를 지닌다. that should never be abandoned, 결코 포기되어서는 안 되는. even if it results in, 그것이 초래할지라도. certain societal inequalities, 어떤 사회적 불평등을.. 이 문장 전체를 해석하면, 그러므로 유교를 따르는 사람들에게는, 가족은 그것이 어떤 사회적 불평등을 초래할지라도, 결코 포기되어서는 안 되는 내재적인 가치를 지닌다.","hl":"m"},{"n":22,"text":"앞선 내용을 요약하는 문장이에요. 유교 문화권에서는 가족이 그 자체로 바꿀 수 없는 소중한 가치를 가지기 때문에, 사회적 불평등이 조금 생기더라도 가족이라는 틀을 포기하지 않는다는 뜻이죠.","hl":"mn"},{"n":23,"text":"첫 번째 포인트는 inherent value 뒤에 나온 주격 관계대명사 that입니다. 가족의 가치가 수동적으로 포기되면 안 되는 것이라 be abandoned라는 수동태를 썼어요. 두 번째는 양보의 접속사 even if입니다. 뒤에 부정적인 결과가 와도 앞의 주절을 지키겠다는 의지를 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자유주의 문화와 같은 일부 문화들은, \u003c/span>\u003cspan class=\"en\">Some cultures, like the liberal one,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">택할지도 모른다 \u003c/span>\u003cspan class=\"en\">may choose to\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점점 더 많은 제약들을 부과하고 \u003c/span>\u003cspan class=\"en\">impose \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">increasing\u003c/span> restrictions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족의 역할에 \u003c/span>\u003cspan class=\"en\">on the role of families\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 인류 평등주의의 정부 프로그램들을 실행하기를 \u003c/span>\u003cspan class=\"en\">and implement more egalitarian government programs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">교육, 의료, 그리고 다른 적극적 권리들에 대한 \u003c/span>\u003cspan class=\"en\">for education, healthcare, and other positive rights in society\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기회의 공정한 평등을 추구하면서.\u003c/span>\u003cspan class=\"en\">in the pursuit of fair equality of opportunity.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자유주의 문화와 같은 일부 문화들은, 가족의 역할에 점점 더 많은 제약들을 부과하고, 기회의 공정한 평등을 추구하면서 교육, 의료, 그리고 다른 적극적 권리들에 대한 더 인류 평등주의의 정부 프로그램들을 사회에서 실행하기를 택할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자유주의 문화에서는 공정한 \u003cb class=\"key\">기회의 \u003c/b>\u003cb class=\"key\">평등\u003c/b>을 위해 가족의 영향력을 제한하고, 대신 정부 차원의 \u003cb class=\"key\">평등주의 \u003c/b>\u003cb class=\"key\">정책\u003c/b>을 도입하려 한다는 내용입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사\u003c/span> : increasing [분사] + restrictions [명사] : \"증가하는 (제약들)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">to부정사의 병렬 구조\u003c/span> : choose [동사] + to [impose (V1) ... and implement (V2)] : \"부과하고 실행하기를 택하다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Some cultures, like the liberal one, 자유주의 문화와 같은 일부 문화들은. may choose to, 택할지도 모른다. impose increasing restrictions, 점점 더 많은 제약들을 부과하고. on the role of families, 가족의 역할에. and implement more egalitarian government programs, 더 인류 평등주의의 정부 프로그램들을 실행하기를. for education, healthcare, and other positive rights in society, 교육, 의료, 그리고 다른 적극적 권리들에 대한. in the pursuit of fair equality of opportunity, 기회의 공정한 평등을 추구하면서.. 이 문장 전체를 해석하면, 자유주의 문화와 같은 일부 문화들은, 가족의 역할에 점점 더 많은 제약들을 부과하고, 기회의 공정한 평등을 추구하면서 교육, 의료, 그리고 다른 적극적 권리들에 대한 더 인류 평등주의의 정부 프로그램들을 사회에서 실행하기를 택할지도 모른다.","hl":"m"},{"n":25,"text":"자유주의 사회의 특징을 설명하는 문장이에요. 기회의 평등이 중요하니까, 가족 배경에 따라 차이가 나지 않도록 가족의 역할을 줄이고 정부가 직접 교육이나 의료를 챙기겠다는 말입니다.","hl":"mn"},{"n":26,"text":"첫 번째로 보실 부분은 choose to 뒤에 연결된 병렬 구조예요. impose와 implement가 and로 묶여서 둘 다 선택의 내용이 됩니다. 두 번째는 restrictions 앞에 쓰인 increasing인데, 제약이 늘어나고 있다는 능동의 느낌을 주는 현재분사로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면, \u003c/span>\u003cspan class=\"en\">On the other hand,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유교 문화와 같은 다른 문화들은, \u003c/span>\u003cspan class=\"en\">other cultures, like the Confucian one,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">복지에 대한 책임을 우선적으로 가족에게 부여하는 것을 선호할지도 모른다, \u003c/span>\u003cspan class=\"en\">may prefer to primarily assign welfare responsibilities to the family,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">불평등을 용인하며 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tolerating\u003c/span> inequalities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가족의 존재로 인해 발생하는 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stemming \u003c/span>\u003cspan class=\"tgt\">from\u003c/span> the existence of the family\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">as\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국가에서 모든 사람의 기본적 자유와 권리들이 보장되는.\u003c/span>\u003cspan class=\"en\">everyone's basic freedoms and rights are safeguarded in the state.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반면 유교 문화와 같은 다른 문화들은, 국가에서 모든 사람의 기본적 자유와 권리들이 보장되는 한, 가족의 존재로 인해 발생하는 불평등을 용인하며 복지에 대한 책임을 우선적으로 가족에게 부여하는 것을 선호할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유교 문화는 개인의 기본권만 국가가 보장해준다면, 가족으로 인한 어느 정도의 \u003cb class=\"key\">불평등을 \u003c/b>\u003cb class=\"key\">수용\u003c/b>하면서 \u003cb class=\"key\">가족 \u003c/b>\u003cb class=\"key\">중심의 \u003c/b>\u003cb class=\"key\">복지\u003c/b>를 선호한다는 대조적 입장을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : [주절] + , [쉼표] + tolerating [현재분사/분사구문] : \"용인하며 / 용인하면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구\u003c/span> : inequalities [명사] + stemming from [분사구] : \"~에서 기인하는 (불평등)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">조건의 접속사\u003c/span> : as long as [접속사] + [S + V] : \"~하는 한\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"On the other hand, 반면. other cultures, like the Confucian one, 유교 문화와 같은 다른 문화들은. may prefer to primarily assign welfare responsibilities to the family, 복지에 대한 책임을 우선적으로 가족에게 부여하는 것을 선호할지도 모른다. tolerating inequalities, 불평등을 용인하며. stemming from the existence of the family, 가족의 존재로 인해 발생하는. as long as, 한. everyone's basic freedoms and rights are safeguarded in the state, 국가에서 모든 사람의 기본적 자유와 권리들이 보장되는.. 이 문장 전체를 해석하면, 반면 유교 문화와 같은 다른 문화들은, 국가에서 모든 사람의 기본적 자유와 권리들이 보장되는 한, 가족의 존재로 인해 발생하는 불평등을 용인하며 복지에 대한 책임을 우선적으로 가족에게 부여하는 것을 선호할지도 모른다.","hl":"m"},{"n":28,"text":"자유주의와 정반대인 유교 문화의 관점입니다. 여기서는 국가보다 가족이 복지를 책임지는 걸 좋아해요. 다만 조건이 하나 있는데, 국가가 아주 기본적인 자유는 지켜줘야 한다는 거예요.","hl":"mn"},{"n":29,"text":"첫 번째는 쉼표 뒤에 나온 tolerating으로, 주어가 불평등을 견딘다는 동시 상황을 나타내는 분사구문이에요. 두 번째 stemming from은 앞에 있는 inequalities를 꾸며주는데, 어디서 온 불평등인지 출처를 밝혀줍니다. 세 번째 as long as는 조건을 거는 접속사예요. 국가가 기본권을 보장하는 한에서만 불평등을 참겠다는 뜻이죠.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>자유주의는 개인의 \u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">기회 \u003c/b>\u003cb class=\"key\">평등\u003c/b>을 가족의 보존보다 우선적인 가치로 여깁니다.\u003c/li>\u003cli>유교 문화는 가족을 \u003cb class=\"key\">인간 \u003c/b>\u003cb class=\"key\">번영의 \u003c/b>\u003cb class=\"key\">근간\u003c/b>이자 삶의 본질적인 방식으로 간주합니다.\u003c/li>\u003cli>유교적 관점에서는 사회적 불평등이 발생하더라도 가족의 \u003cb class=\"key\">내재적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 포기하지 않습니다.\u003c/li>\u003cli>두 문화는 복지의 주체를 \u003cb class=\"key\">정부 \u003c/b>\u003cb class=\"key\">프로그램\u003c/b>으로 볼 것인지, 아니면 \u003cb class=\"key\">가족\u003c/b>으로 볼 것인지에 대해 서로 다른 태도를 보입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>While liberal culture prioritizes individual equality over family integrity, Confucian culture views the family as a fundamental institution whose inherent value outweighs total societal equality.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">자유주의 문화는 개인의 \u003cb class=\"key\">기회의 \u003c/b>\u003cb class=\"key\">공정한 \u003c/b>\u003cb class=\"key\">평등\u003c/b>을 가족의 온전함보다 중시하는 반면, 유교 문화는 \u003cb class=\"key\">가족의 \u003c/b>\u003cb class=\"key\">내재적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 인간 번영의 근간으로 보아 이를 지키기 위해 일부 사회적 불평등을 감수한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"자, 오늘은 자유주의와 유교의 문화적 가치관 차이에 대해 알아보았습니다. 개인과 가족 중 무엇을 우선하느냐에 따라 사회 제도가 달라질 수 있다는 점이 이 글의 핵심이었죠. 오늘 배운 대조의 틀을 잘 기억해 두면 비슷한 주제의 다른 지문을 읽을 때도 큰 도움이 될 거예요. 고생 많으셨습니다!","hl":null}]}]});</script></body></html>
