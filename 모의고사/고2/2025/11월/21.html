<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 21번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 21번","audioDir":"21_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">21번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>Your Tongue as a Window to Your Health: The Power of Taste\u003c/h1>\u003ch2>건강을 비추는 창, 미각: 혀가 결정하는 당신의 운명\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>간단한 실험으로 확인하는 \u003cb class=\"key\">미각 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>은 단순한 선호도를 넘어 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">장애\u003c/b>나 건강 상태를 예측하는 중요한 지표가 될 수 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>One's taste sensitivity profile is significantly correlated with behavioral patterns and health risks.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 우리가 매일 느끼는 미각이 단순한 입맛을 넘어 우리의 인생 경로까지 결정할 수 있다는 흥미로운 지문을 살펴볼 거예요. 이 글의 요지는 미각의 민감도가 우리의 행동 방식과 건강 상태에 깊은 연관이 있다는 것입니다. 우리가 어떤 음식을 좋아하고 피하는지가 사실은 우리 몸의 화학적 설계도 때문일 수 있다는 거죠.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">인간은 혀에 있는 \u003cb class=\"key\">미뢰(taste \u003c/b>\u003cb class=\"key\">buds)\u003c/b>의 밀도에 따라 맛을 느끼는 정도가 다릅니다. 이를 연구한 심리학자 린다 바토슈크는 미각을 크게 '초미각자', '보통 미각자', '미각 둔감자'로 분류했습니다. 이는 단순히 편식을 결정하는 것이 아니라, \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">전략\u003c/b>과 직결됩니다. 예를 들어, 쓴맛에 민감한 것은 독성 물질을 피하기 위함이지만 현대 사회에서는 이것이 \u003cb class=\"key\">영양 \u003c/b>\u003cb class=\"key\">불균형\u003c/b>으로 이어지기도 하죠. 마치 \u003cb class=\"key\">고해상도 \u003c/b>\u003cb class=\"key\">카메라\u003c/b>로 세상을 보는 사람과 흐릿한 렌즈로 보는 사람의 차이가 삶의 방식에 영향을 주는 것과 같습니다.\u003c/div>","segs":[{"n":2,"text":"본격적인 시작에 앞서 배경지식을 좀 알아볼까요? 우리 혀에는 맛을 느끼는 미뢰라는 조직이 있는데, 이 개수는 사람마다 천차만별이에요. 미뢰가 아주 많은 사람을 초미각자, 즉 Super-tasters라고 부르고 반대로 적은 사람을 미각 둔감자, Non-tasters라고 부릅니다. 이 차이가 단순히 편식을 만드느냐고요? 아닙니다. 건강과 중독 성향까지 결정하는 아주 중요한 지표가 된답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>미각 실험 방법\u003csmall>도입 · 문장 1–5\u003c/small>\u003c/h4>\u003cp>소금, 설탕, 레몬, 커피를 이용해 혀의 부위별 \u003cb class=\"key\">미각 \u003c/b>\u003cb class=\"key\">반응\u003c/b>을 측정하고 친구들과 비교하는 \u003cb class=\"key\">자가 \u003c/b>\u003cb class=\"key\">실험\u003c/b> 단계를 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>미각과 행동의 연결\u003csmall>전환 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>미각 패턴이 단순한 선호도가 아닌 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">장애\u003c/b> 및 \u003cb class=\"key\">미각자 \u003c/b>\u003cb class=\"key\">위계\u003c/b>와 관련이 있다는 연구 결과를 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>유형별 특징 분석\u003csmall>예시 · 문장 8–9\u003c/small>\u003c/h4>\u003cp>미각 둔감자의 \u003cb class=\"key\">알코올 \u003c/b>\u003cb class=\"key\">중독\u003c/b> 성향과 초미각자의 \u003cb class=\"key\">영양 \u003c/b>\u003cb class=\"key\">불균형\u003c/b> 가능성을 대조하며 구체적인 사례를 듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>미각의 중요성\u003csmall>결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>입안의 \u003cb class=\"key\">화학 \u003c/b>\u003cb class=\"key\">작용\u003c/b>이 삶의 경로를 결정하는 운명이 될 수 있으므로 미각에 \u003cb class=\"key\">세심한 \u003c/b>\u003cb class=\"key\">주의\u003c/b>를 기울여야 한다고 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름을 보면, 직접 해볼 수 있는 실험 방법에서 시작해서 구체적인 건강 사례로 논의를 확장하고 있어요.","hl":null},{"n":4,"text":"첫 번째부터 다섯 번째 문장까지는 자신의 미각을 테스트하는 실험 과정을 아주 자세히 설명해 줍니다. 소금, 설탕, 레몬, 커피를 면봉에 묻혀서 혀의 여러 곳에 대 보고 친구들과 그 반응을 비교해 보라고 권하고 있죠.","hl":"f0"},{"n":5,"text":"여섯 번째와 일곱 번째 문장은 이 글의 핵심적인 전환점입니다. 미각 패턴이 단순히 취향을 보여주는 게 아니라, 미각자의 상태와 행동 장애 사이의 연관성을 암시한다는 연구 결과를 소개하고 있어요.","hl":"f1"},{"n":6,"text":"여덟 번째와 아홉 번째 문장에서는 구체적인 예시로 대조를 보여줍니다. 술이 덜 쓰게 느껴지는 미각 둔감자는 알코올 중독에 걸리기 쉽고, 반대로 초미각자는 몸에 좋은 쓴 채소를 피하다가 영양 불균형을 겪을 수 있다는 내용이죠.","hl":"f2"},{"n":7,"text":"마지막 열 번째 문장에서는 미각이 다른 감각만큼 화려해 보이진 않아도, 입안의 화학 작용이 곧 우리의 운명이 될 수 있으니 미각에 더 주의를 기울여야 한다고 결론을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 10번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 전반부는 \u003cb class=\"key\">미각 \u003c/b>\u003cb class=\"key\">실험\u003c/b> 방법으로 독자의 흥미를 유발하고, 후반부에서 \u003cb class=\"key\">미각 \u003c/b>\u003cb class=\"key\">민감도\u003c/b>에 따른 두 집단의 특성을 \u003cb class=\"key\">대조\u003c/b>하며 결론을 도출합니다. 마지막 문장에서 '화학 작용이 곧 운명'이라는 비유를 통해 \u003cb class=\"key\">주제\u003c/b>를 강력하게 전달합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>For example (8)\u003c/b>\u003cspan>예시 시작\u003c/span>\u003cb>Conversely (9)\u003c/b>\u003cspan>대조 관계 형성\u003c/span>\u003cb>So (10)\u003c/b>\u003cspan>최종 결론 유도\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">taste pattern\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">taster status\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">non-tasters\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">super-tasters\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">chemistry in your mouth\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Non-tasters (미각 둔감자)\u003c/th>\u003cth>Super-tasters (초미각자)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>쓴맛을 덜 느낌\u003c/td>\u003ctd>쓴맛에 매우 예민함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>알코올 중독 위험 높음\u003c/td>\u003ctd>쓴 채소 기피로 영양 불균형\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 미각 둔감자와 초미각자의 특징을 대조하는 비교 대조 방식을 취하고 있습니다. 그리고 글의 마지막 부분에 핵심 주제를 담고 있는 전형적인 미괄식 구조를 보여주고 있죠.","hl":"ty"},{"n":9,"text":"문장 중간의 For example을 통해 구체적인 사례를 들기 시작하고, Conversely라는 연결어를 사용해 앞선 사례와 반대되는 성향을 아주 명확하게 대비시키고 있어요. 마지막 문장의 So는 이 모든 분석을 바탕으로 필자가 하고 싶은 최종적인 주장을 이끌어냅니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>coat\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입히다, 묻히다\u003c/span>\u003c/div>\u003cdiv>\u003cb>swab\u003c/b>\u003cem>명사\u003c/em>\u003cspan>면봉\u003c/span>\u003c/div>\u003cdiv>\u003cb>gently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>부드럽게\u003c/span>\u003c/div>\u003cdiv>\u003cb>spot\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부위, 장소\u003c/span>\u003c/div>\u003cdiv>\u003cb>gargle\u003c/b>\u003cem>동사\u003c/em>\u003cspan>입을 헹구다\u003c/span>\u003c/div>\u003cdiv>\u003cb>thoroughly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완전히, 철저히\u003c/span>\u003c/div>\u003cdiv>\u003cb>reaction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>반응\u003c/span>\u003c/div>\u003cdiv>\u003cb>reveal\u003c/b>\u003cem>동사\u003c/em>\u003cspan>드러내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>preference\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선호도\u003c/span>\u003c/div>\u003cdiv>\u003cb>suggest\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여주다, 암시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>link\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연관성\u003c/span>\u003c/div>\u003cdiv>\u003cb>taster status\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미각자의 위계\u003c/span>\u003c/div>\u003cdiv>\u003cb>behavioral disorder\u003c/b>\u003cem>명사\u003c/em>\u003cspan>행동 장애\u003c/span>\u003c/div>\u003cdiv>\u003cb>incidence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>발생률\u003c/span>\u003c/div>\u003cdiv>\u003cb>alcoholism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>알코올 중독\u003c/span>\u003c/div>\u003cdiv>\u003cb>bitter\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>쓴\u003c/span>\u003c/div>\u003cdiv>\u003cb>conversely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>반대로\u003c/span>\u003c/div>\u003cdiv>\u003cb>nutritious\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>영양가 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>deprive A of B\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>A에게서 B를 주지 않다, 박탈하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>balanced diet\u003c/b>\u003cem>명사\u003c/em>\u003cspan>균형 잡힌 식단\u003c/span>\u003c/div>\u003cdiv>\u003cb>glamorous\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>화려한\u003c/span>\u003c/div>\u003cdiv>\u003cb>vision\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시각\u003c/span>\u003c/div>\u003cdiv>\u003cb>make sense\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>타당하다, 이치에 맞다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pay attention to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>주의를 기울이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chemistry\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화학 작용\u003c/span>\u003c/div>\u003cdiv>\u003cb>destiny\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운명\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 중요한 표현들을 좀 볼까요? Taster status는 미각의 예민도에 따른 계급이나 상태를 뜻하고, Incidence of alcoholism은 알코올 중독의 발생률을 의미해요. 마지막에 나온 Destiny라는 단어는 미각이 삶에 미치는 영향력을 아주 강렬하게 표현한 단어죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">reveal\u003c/b>\u003cspan class=\"m\">드러내다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disclose\u003c/span>\u003cspan class=\"s\">unveil\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">conceal\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">incidence\u003c/b>\u003cspan class=\"m\">발생률\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">occurrence\u003c/span>\u003cspan class=\"s\">frequency\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">conversely\u003c/b>\u003cspan class=\"m\">반대로\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">on the contrary\u003c/span>\u003cspan class=\"s\">in contrast\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">similarly\u003c/span>\u003cspan o\">새로운 젖은 면봉에 소금을 묻히고 여러분의 미각이 가장 강렬하다고 느껴지는 곳을 기록하면서, 혀의 다양한 부위들에 부드럽게 대 보아라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미각 분포를 확인하기 위한 첫 번째 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">절차\u003c/b>를 설명하며, 소금을 이용해 혀의 어느 부위에서 짠맛이 가장 강한지 \u003cb class=\"key\">데이터 \u003c/b>\u003cb class=\"key\">기록\u003c/b>을 지시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : 동사원형 (Coat) ~ : \"~을 묻혀라(대 보아라)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구문\u003c/span> : V-ing (recording) ~ : \"기록하면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문 (명사절)\u003c/span> : 의문사(where) + 주어(your taste) + 동사(seems) + 보어(strongest) : \"여러분의 미각이 어디에서 가장 강하게 느껴지는지\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Coat a fresh, wet swab in salt, 새로운 젖은 면봉에 소금을 묻히고. and gently touch various spots on your tongue, 여러분의 혀의 다양한 부위들에 부드럽게 대 보아라. recording where your taste seems strongest, 여러분의 미각이 가장 강렬하다고 느껴지는 곳을 기록하면서.. 이 문장 전체를 해석하면, 새로운 젖은 면봉에 소금을 묻히고 여러분의 미각이 가장 강렬하다고 느껴지는 곳을 기록하면서, 혀의 다양한 부위들에 부드럽게 대 보아라.","hl":"m"},{"n":13,"text":"미각 테스트를 시작하는 첫 단계를 설명하는 문장이에요. 소금을 묻힌 면봉으로 혀 곳곳을 대보며 어느 부위에서 짠맛이 가장 잘 느껴지는지 스스로 관찰하고 기록해보라는 뜻입니다.","hl":"mn"},{"n":14,"text":"첫 번째로 문장이 Coat라는 동사원형으로 시작하는 명령문 구조를 확인하세요. 두 번째로 recording은 분사구문으로 사용되어 실험과 동시에 기록하라는 의미를 더해줍니다. 세 번째로 recording의 목적어로 쓰인 where your taste seems strongest는 의문사 주어 동사의 순서를 따르는 간접의문문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 다음, 물로 헹구고\u003c/span>\u003cspan class=\"en\">Then, gargle with water\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 혀를 완전히 씻어 내기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">thoroughly \u003c/span>\u003cspan class=\"tgt\">clean\u003c/span> your tongue,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">설탕이 묻은 면봉을 같은 부위들에 사용하고,\u003c/span>\u003cspan class=\"en\">use a swab \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">coated \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">sugar\u003c/span> on the same spots,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 결과들을 기록하라.\u003c/span>\u003cspan class=\"en\">and record those results.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그런 다음, 여러분의 혀를 완전히 씻어 내기 위해 물로 헹구고, 설탕이 묻은 면봉을 같은 부위들에 사용하고, 그 결과들을 기록하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 실험의 잔여물을 제거하는 \u003cb class=\"key\">세척 \u003c/b>\u003cb class=\"key\">과정\u003c/b>과 단맛에 대한 \u003cb class=\"key\">비교 \u003c/b>\u003cb class=\"key\">실험\u003c/b> 단계를 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + [부사] + 동사원형 : \"완전히 씻어 내기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구\u003c/span> : 명사(swab) + p.p.(coated) + 전치사구 : \"설탕으로 코팅된(묻은)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">병렬 구조\u003c/span> : A, B, and C (동사원형의 병렬) : \"헹구고, 사용하고, 기록하라\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Then, gargle with water, 그런 다음, 물로 헹구고. to thoroughly clean your tongue, 여러분의 혀를 완전히 씻어 내기 위해. use a swab coated with sugar on the same spots, 설탕이 묻은 면봉을 같은 부위들에 사용하고. and record those results, 그 결과들을 기록하라.. 이 문장 전체를 해석하면, 그런 다음, 여러분의 혀를 완전히 씻어 내기 위해 물로 헹구고, 설탕이 묻은 면봉을 같은 부위들에 사용하고, 그 결과들을 기록하라.","hl":"m"},{"n":16,"text":"소금 테스트가 끝나고 다음 테스트인 설탕으로 넘어가기 전의 과정이에요. 이전 맛이 남아있지 않게 혀를 깨끗이 헹구는 것이 정확한 실험을 위해 중요하다는 점을 보여줍니다.","hl":"mn"},{"n":17,"text":"첫 번째로 to thoroughly clean은 씻어 내기 위한 목적을 나타내는 부사적 용법입니다. 두 번째로 coated with sugar는 수동의 의미를 가진 과거분사구로 앞에 있는 면봉을 꾸며주고 있어요. 마지막으로 세 개의 동사원형 gargle, use, record가 and로 연결되어 하나의 명령문 세트를 이루고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다시 헹구고\u003c/span>\u003cspan class=\"en\">Gargle again,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그런 다음 레몬주스를 면봉으로 혀에 발라라.\u003c/span>\u003cspan class=\"en\">and then \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">swab\u003c/span> with lemon juice.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다시 헹구고 그런 다음 레몬주스를 면봉으로 혀에 발라라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동일한 방식을 신맛에 적용하여 \u003cb class=\"key\">실험의 \u003c/b>\u003cb class=\"key\">일관성\u003c/b>을 유지하며 미각 정보를 추가로 수집하는 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 명령법\u003c/span> : swab [동사원형] : \"바르다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Gargle again, 다시 헹구고. and then swab with lemon juice, 그런 다음 레몬주스를 면봉으로 혀에 발라라.. 이 문장 전체를 해석하면, 다시 헹구고 그런 다음 레몬주스를 면봉으로 혀에 발라라.","hl":"m"},{"n":19,"text":"짠맛과 단맛에 이어 신맛을 테스트하는 세 번째 단계입니다. 앞선 과정과 마찬가지로 입안을 헹구어 깨끗하게 만든 뒤 실험하라는 간단한 지시사항입니다.","hl":"mn"},{"n":20,"text":"여기서 주목할 점은 swab이라는 단어예요. 앞 문장에서는 면봉이라는 명사로 쓰였지만, 이 문장에서는 동사원형의 위치에 와서 면봉으로 바르라는 명령의 의미를 전달하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마지막 헹굼 이후에\u003c/span>\u003cspan class=\"en\">After a final gargle,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">커피로 해 보아라.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">try\u003c/span> coffee.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마지막 헹굼 이후에 커피로 해 보아라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 소금, 설탕, 레몬 실험에 이어 마지막으로 쓴맛을 테스트하는 \u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">절차\u003c/b>를 안내합니다. 입을 깨끗이 헹군 뒤 새로운 맛을 시도하여 \u003cb class=\"key\">미각 \u003c/b>\u003cb class=\"key\">측정\u003c/b>의 정확도를 높이려는 의도입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문\u003c/span> : [동사원형] + [목적어] : \"해 보아라\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"After a final gargle, 마지막 헹굼 이후에. try coffee, 커피로 해 보아라.. 이 문장 전체를 해석하면, 마지막 헹굼 이후에 커피로 해 보아라.","hl":"m"},{"n":22,"text":"자, 이제 미각 실험의 마지막 단계에 왔어요. 소금, 설탕, 레몬에 이어서 커피까지 맛보며 미각 테스트를 마무리하는 부분입니다.","hl":"mn"},{"n":23,"text":"이 문장은 문장의 맨 앞에 동사원형 try가 나왔죠? 상대방에게 실험 절차를 지시하는 명령문 구조로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 반응을\u003c/span>\u003cspan class=\"en\">Compare your reactions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">친구들의 것들과 비교하라.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">friends'\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분의 반응을 친구들의 것들과 비교하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 자신의 미각 실험 결과를 타인의 결과와 대조하여 \u003cb class=\"key\">개인차\u003c/b>를 확인하라는 단계입니다. 이 과정을 통해 사람마다 \u003cb class=\"key\">미각 \u003c/b>\u003cb class=\"key\">감수성\u003c/b>이 다르다는 것을 깨닫게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">소유대명사\u003c/span> : [명사's / s'] : \"친구들의 것들과\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Compare your reactions, 여러분의 반응을. with your friends', 친구들의 것들과 비교하라.. 이 문장 전체를 해석하면, 여러분의 반응을 친구들의 것들과 비교하라.","hl":"m"},{"n":25,"text":"나만의 데이터에 머물지 말고 다른 친구들의 결과와 대조해 보세요. 사람마다 같은 맛에 대해서도 얼마나 다르게 반응하는지 확인해보라는 것이죠.","hl":"mn"},{"n":26,"text":"중요한 포인트는 문장 끝에 있는 your friends'입니다. 영어는 반복을 정말 싫어해요. 그래서 앞에 나온 reactions를 또 쓰지 않고 소유대명사 형태를 썼는데, friends가 이미 복수형 s로 끝나니까 뒤에 어포스트로피 기호 하나만 붙여서 친구들의 반응들이라는 의미를 완성했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 미각 패턴은\u003c/span>\u003cspan class=\"en\">Your taste pattern\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">드러낼지도 모른다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may\u003c/span> reveal\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순히 ~보다 더 많은 것을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">just\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">맛에 대한 선호도\u003c/span>\u003cspan class=\"en\">taste preferences.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분의 미각 패턴은 단순히 맛에 대한 선호도보다 더 많은 것을 드러낼지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 주제가 확장되는 \u003cb class=\"key\">전환점\u003c/b>입니다. 미각이 단순히 무엇을 먹고 싶어 하는지를 넘어 \u003cb class=\"key\">행동적 \u003c/b>\u003cb class=\"key\">특성\u003c/b>이나 건강 상태를 암시할 수 있다는 점을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사\u003c/span> : may + [동사원형] : \"~일지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교 표현\u003c/span> : more than + [명사] : \"단순히 ~보다 더 많은\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Your taste pattern, 여러분의 미각 패턴은. may reveal, 드러낼지도 모른다. more than just, 단순히 ~보다 더 많은 것을. taste preferences, 맛에 대한 선호도. 이 문장 전체를 해석하면, 여러분의 미각 패턴은 단순히 맛에 대한 선호도보다 더 많은 것을 드러낼지도 모른다.","hl":"m"},{"n":28,"text":"이 문장은 이 글의 아주 중요한 전환점이에요. 지금까지는 실험이었지만, 이제부터는 미각이 우리에 대해 더 깊은 정보를 알려준다는 상관관계를 본격적으로 설명하겠다고 선언하는 부분입니다.","hl":"mn"},{"n":29,"text":"두 가지 포인트를 짚어볼게요. 첫 번째로 may는 가능성을 열어두는 추측의 의미를 담고 있고요, 두 번째로 more than just는 단순히 무엇 그 이상이라는 의미예요. 단순한 선호도를 뛰어넘는 더 큰 가치가 있음을 강조하고 싶을 때 쓰는 비교 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">최근의 연구들은\u003c/span>\u003cspan class=\"en\">Recent studies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">연관성을 보여준다\u003c/span>\u003cspan class=\"en\">suggest links\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미각자의 위계와\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">between \u003c/span>\u003cspan class=\"tgt\">taster \u003c/span>\u003cspan class=\"tgt\">status \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">행동 장애 사이의\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">behavioral \u003c/span>\u003cspan class=\"tgt\">disorders\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">최근의 연구들은 미각자의 위계와 행동 장애 사이의 연관성을 보여준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 단순한 미각 실험에서 더 나아가 과학적 발견으로 \u003cb class=\"key\">주제 \u003c/b>\u003cb class=\"key\">전환\u003c/b>을 알리는 역할을 합니다. 미각이 단순한 취향의 문제가 아니라 인간의 \u003cb class=\"key\">미각 \u003c/b>\u003cb class=\"key\">상태\u003c/b>가 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">장애\u003c/b>와 연결되어 있다는 핵심 정보를 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">between A and B\u003c/span> : between [A] and [B] : \"미각자의 위계와 행동 장애 사이의\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Recent studies, 최근의 연구들은. suggest links, 연관성을 보여준다. between taster status, 미각자의 위계와. and behavioral disorders, 행동 장애 사이의. 이 문장 전체를 해석하면, 최근의 연구들은 미각자의 위계와 행동 장애 사이의 연관성을 보여준다.","hl":"m"},{"n":31,"text":"이제 글의 흐름이 바뀝니다. 미각 실험의 결과를 넘어서 최근 연구들이 발견한 미각 상태와 행동 장애 사이의 상관관계라는 주제 전환을 보여주고 있어요.","hl":"mn"},{"n":32,"text":"첫 번째로 보실 부분은 between A and B 구조입니다. taster status라는 에이와 behavioral disorders라는 비를 연결해서 그 사이의 연관성이라는 의미의 형용사적 용법으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어 ‘미각 둔감자’는\u003c/span>\u003cspan class=\"en\">For example, &quot;non­tasters&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가지는 경향이 있는데\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tend \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">have\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 높은 알코올 중독 발생률을\u003c/span>\u003cspan class=\"en\">a higher incidence of alcoholism,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아마도 술이\u003c/span>\u003cspan class=\"en\">perhaps because liquor\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들에게 덜 쓰다고 느껴지기 때문일 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">seems \u003c/span>\u003cspan class=\"tgt\">less \u003c/span>\u003cspan class=\"tgt\">bitter\u003c/span> to them.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">예를 들어 ‘미각 둔감자’는 더 높은 알코올 중독 발생률을 가지는 경향이 있는데, 아마도 술이 그들에게 덜 쓰다고 느껴지기 때문일 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">미각 \u003c/b>\u003cb class=\"key\">둔감자\u003c/b>가 겪는 건강상의 위험을 구체적인 사례로 설명합니다. 쓴맛을 덜 느끼는 신체적 특징이 \u003cb class=\"key\">알코올 \u003c/b>\u003cb class=\"key\">중독\u003c/b>이라는 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>로 이어질 수 있음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">tend to + 동사원형\u003c/span> : tend [자동사] + to [to부정사구] : \"가지는 경향이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">2형식 감각동사의 보어와 비교급\u003c/span> : seem [불완전 자동사] + less bitter [형용사 보어/비교급] : \"덜 쓰게 보인다(느껴진다)\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"For example, \"non­tasters\", 예를 들어 ‘미각 둔감자’는. tend to have, 가지는 경향이 있는데. a higher incidence of alcoholism, 더 높은 알코올 중독 발생률을. perhaps because liquor, 아마도 술이. seems less bitter to them, 그들에게 덜 쓰다고 느껴지기 때문일 것이다. 이 문장 전체를 해석하면, 예를 들어 ‘미각 둔감자’는 더 높은 알코올 중독 발생률을 가지는 경향이 있는데, 아마도 술이 그들에게 덜 쓰다고 느껴지기 때문일 것이다.","hl":"m"},{"n":34,"text":"미각 둔감자의 사례를 들고 있네요. 쓴맛에 무디다 보니 술을 거부감 없이 마시게 되고 결국 알코올 중독 발생률이 높아진다는 인과 관계를 설명하고 있습니다.","hl":"mn"},{"n":35,"text":"첫 번째로 tend to have는 미각 둔감자들의 일반적인 통계적 특성을 나타내는 경향성 표현이고요. 두 번째로 seems less bitter는 감각동사 뒤에 형용사 보어를 쓰면서 less를 통해 쓴맛을 덜 느낀다는 상대적 감각을 잘 보여주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반대로 ‘초미각자’는\u003c/span>\u003cspan class=\"en\">Conversely, &quot;super­tasters&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영양가 있는 음식들을 피할지도 모르고\u003c/span>\u003cspan class=\"en\">may avoid \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">nutritious \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 약간 쓴\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">but \u003c/span>\u003cspan class=\"tgt\">mildly \u003c/span>\u003cspan class=\"tgt\">bitter\u003c/span> foods\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">브로콜리와 같이\u003c/span>\u003cspan class=\"en\">such as broccoli,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로 스스로에게 주지 않을 수도 있다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">thus \u003c/span>\u003cspan class=\"tgt\">depriving \u003c/span>\u003cspan class=\"tgt\">themselves \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">균형 잡힌 식단을\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">of\u003c/span> a balanced diet.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반대로 ‘초미각자’는 브로콜리와 같이 영양가 있지만 약간 쓴 음식들을 피할지도 모르고, 그러므로 스스로에게 균형 잡힌 식단을 주지 않을 수도 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장과 대조되는 \u003cb class=\"key\">초미각자\u003c/b>의 문제를 다룹니다. 쓴맛에 과도하게 예민하여 건강한 채소조차 거부하게 되고, 이것이 결국 \u003cb class=\"key\">영양 \u003c/b>\u003cb class=\"key\">불균형\u003c/b>이라는 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 초래한다는 내용입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사의 병렬 연결\u003c/span> : A [형용사] + but [접속사] + B [형용사] : \"영양가 있지만 약간 쓴\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문과 deprive A of B\u003c/span> : thus [부사] + depriving [현재분사] + [목적어] + of [전치사] : \"그러므로 스스로에게서 ~을 박탈하면서\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Conversely, \"super­tasters\", 반대로 ‘초미각자’는. may avoid nutritious, 영양가 있는 음식들을 피할지도 모르고. but mildly bitter foods, 하지만 약간 쓴. such as broccoli, 브로콜리와 같이. thus depriving themselves, 그러므로 스스로에게 주지 않을 수도 있다. of a balanced diet, 균형 잡힌 식단을. 이 문장 전체를 해석하면, 반대로 ‘초미각자’는 브로콜리와 같이 영양가 있지만 약간 쓴 음식들을 피할지도 모르고, 그러므로 스스로에게 균형 잡힌 식단을 주지 않을 수도 있다.","hl":"m"},{"n":37,"text":"앞의 내용과 정반대되는 초미각자의 사례입니다. 쓴맛에 너무 예민해서 몸에 좋은 채소까지 안 먹게 되니까 결국 영양 불균형이라는 부정적 영향이 생긴다는 거죠.","hl":"mn"},{"n":38,"text":"첫 번째로 nutritious but mildly bitter는 브로콜리가 영양가는 높지만 쓰다는 상반된 특징을 잘 연결해주고 있고요. 두 번째로 thus depriving themselves of 구문은 분사구문으로 결과적인 상황을 나타내며 영양소를 박탈한다는 의미를 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서, 비록 미각이 거의 그만큼 화려하지는 않지만\u003c/span>\u003cspan class=\"en\">So, although taste is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">nearly \u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">glamorous \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시각, 청각, 또는 심지어 촉각만큼,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">as\u003c/span> vision, hearing, or even touch,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 그것에 좀 더 세심한 주의를 기울이는 것이 타당하다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">makes \u003c/span>\u003cspan class=\"tgt\">sense \u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">pay\u003c/span> closer attention to it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왜냐하면 화학 작용이, 적어도 여러분의 입안에서는, 운명이 될 수 있기 때문이다.\u003c/span>\u003cspan class=\"en\">because chemistry, at least in your mouth, could be destiny.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그래서 비록 미각이 시각, 청각, 또는 심지어 촉각만큼 화려하지는 않지만, 적어도 여러분의 입안에서는, 화학 작용이 운명이 될 수 있기 때문에 여러분이 그것에 좀 더 세심한 주의를 기울이는 것이 타당하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미각은 시각이나 청각에 비해 덜 중요해 보일 수 있지만, 타고난 \u003cb class=\"key\">미각\u003c/b>의 특징이 식습관과 \u003cb class=\"key\">건강\u003c/b>에 영향을 미친다는 결론입니다. 입안의 \u003cb class=\"key\">화학 \u003c/b>\u003cb class=\"key\">작용\u003c/b>인 맛을 느끼는 방식이 결국 우리 삶의 \u003cb class=\"key\">운명\u003c/b>을 결정할 만큼 중요하다는 비유적 표현을 사용했습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">원급 비교 강조\u003c/span> : not nearly + as + [형용사/부사 원형] + as : \"~만큼 결코 화려하지 않은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가주어·진주어와 의미상 주어\u003c/span> : it (가주어) + for [의미상 주어] + to [진주어] : \"여러분이 주의를 기울이는 것이 타당하다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"So, although taste is not nearly as glamorous, 그래서, 비록 미각이 거의 그만큼 화려하지는 않지만. as vision, hearing, or even touch, 시각, 청각, 또는 심지어 촉각만큼. it makes sense for you to pay closer attention to it, 여러분이 그것에 좀 더 세심한 주의를 기울이는 것이 타당하다. because chemistry, at least in your mouth, could be destiny, 왜냐하면 화학 작용이, 적어도 여러분의 입안에서는, 운명이 될 수 있기 때문이다.. 이 문장 전체를 해석하면, 그래서 비록 미각이 시각, 청각, 또는 심지어 촉각만큼 화려하지는 않지만, 적어도 여러분의 입안에서는, 화학 작용이 운명이 될 수 있기 때문에 여러분이 그것에 좀 더 세심한 주의를 기울이는 것이 타당하다.","hl":"m"},{"n":40,"text":"이 문장은 글 전체의 내용을 요약하는 결론이에요. 우리가 흔히 무시하기 쉬운 미각이 실제로는 우리의 식습관과 건강에 직접적인 영향을 주어 결국 삶의 운명을 결정짓는 중요한 요소가 될 수 있다는 점을 강조하고 있습니다. 입안의 화학 작용이 곧 우리의 건강 상태라는 운명과 연결된다는 점이 핵심이에요.","hl":"mn"},{"n":41,"text":"중요한 어법 두 가지를 살펴볼게요. 첫 번째로 not nearly as glamorous as 부분을 보면 as와 as 사이에 형용사가 들어간 원급 비교 구문인데, nearly를 앞에 써서 원급 비교 강조를 했어요. 미각이 다른 감각에 비해 전혀 화려하지 않다는 점을 강하게 부정하며 강조하고 있죠. 두 번째로 it makes sense for you to pay 부분은 가짜 주어 it과 진짜 주어 to pay 그리고 그 사이에 투부정사의 행위 주체인 의미상 주어 for you가 결합된 가주어 진주어 구문이라는 점에 꼭 주목하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>면봉과 여러 맛의 용액을 이용한 실험을 통해 개인의 \u003cb class=\"key\">미각 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>을 확인할 수 있다.\u003c/li>\u003cli>이러한 미각의 민감도는 단순한 취향을 넘어 개인의 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">장애\u003c/b>나 건강 특성과 긴밀히 연결되어 있다.\u003c/li>\u003cli>\u003cb class=\"key\">미각 \u003c/b>\u003cb class=\"key\">둔감자\u003c/b>는 알코올 중독 위험이 높고, \u003cb class=\"key\">초미각자\u003c/b>는 쓴맛 채소를 피해 영양 불균형을 겪을 수 있다.\u003c/li>\u003cli>미각은 시각이나 청각만큼 화려하진 않지만 우리 삶의 \u003cb class=\"key\">운명\u003c/b>을 좌우할 수 있는 중요한 화학 작용이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>One's taste sensitivity profile is significantly correlated with behavioral patterns and health risks.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">간단한 실험으로 확인하는 \u003cb class=\"key\">미각 \u003c/b>\u003cb class=\"key\">패턴\u003c/b>은 단순한 선호도를 넘어 \u003cb class=\"key\">행동 \u003c/b>\u003cb class=\"key\">장애\u003c/b>나 건강 상태를 예측하는 중요한 지표가 될 수 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 수업 어떠셨나요? 여러분의 혀 끝에서 일어나는 작은 화학 반응이 여러분의 식습관과 건강, 심지어 행동 양식까지 결정한다는 사실이 놀랍지 않나요? 지문의 마지막 문장처럼 Chemistry could be destiny라는 말을 꼭 기억하면서 오늘 공부 마치겠습니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
