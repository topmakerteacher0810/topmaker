턴이 당신에 대해 드러내는 것<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">우리가 매일 느끼는 미각(Taste)은 단순히 음식을 즐기는 것을 넘어 우리의 건강과 행동에 깊은 영향을 미칠 수 있습니다. 사람들은 유전적인 요인에 따라 쓴맛을 거의 느끼지 못하는 무미각자(Nontaster)와 아주 예민하게 느끼는 초미각자(Supertaster) 등으로 나뉘는데, 이는 마치 매운맛을 전혀 못 먹는 &#39;맵찔이&#39;와 매운맛을 즐기는 사람이 있는 것과 비슷한 이치랍니다. 관련 연구에 따르면 무미각자는 술의 쓴맛을 덜 느껴 알코올 의존증(Alcoholism)에 빠질 위험이 높은 반면, 초미각자는 브로콜리처럼 약간 쓴맛이 나는 건강한 채소를 극도로 피하는 경향이 있다고 해요. 따라서 이 지문을 읽기 전에 미각 민감도(Taste sensitivity)가 단순한 입맛 차이를 넘어선 유전적이고 화학적인 반응이라는 점을 미리 기억해 두시면, 왜 입안의 화학 작용이 우리의 식습관이나 행동 장애로까지 이어질 수 있는지 훨씬 더 재미있고 쉽게 이해하실 수 있을 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01미각 테스트 실험<\/div><ul><li>여러 가지 맛을 활용해 혀의 부위별 반응을 확인하고 비교하는 실험을 소개한다.<\/li><li>소금, 설탕, 레몬, 커피로 미각(taste) 반응 기록<\/li><li>개인 고유의 미각 패턴(taste pattern) 확인<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02새로운 연구 결과<\/div><ul><li>미각 상태가 단순한 입맛을 넘어 행동 문제와 연결될 수 있다는 최신 연구가 있다.<\/li><li>미각 상태(taster status)의 중요성 부각<\/li><li>행동 장애(behavioral disorders)와의 연관성 제시<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03미각 둔감자의 사례<\/div><ul><li>미각에 둔감한 사람은 술의 쓴맛을 덜 느껴 알코올 중독 위험이 상대적으로 높다.<\/li><li>미각 둔감자(nontasters)의 특징<\/li><li>알코올 중독(alcoholism) 발생률 증가<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04초미각자의 사례<\/div><ul><li>미각이 매우 예민한 사람은 약간 쓴맛이 나는 건강한 음식을 피하는 경향이 있다.<\/li><li>초미각자(supertasters)의 쓴맛 민감성<\/li><li>영양가 높은 음식을 기피하여 균형 잡힌 식단(balanced diet) 방해<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-4\"><div class=\"lec-stage-head\">05결론<\/div><ul><li>미각이 우리의 건강과 운명에 직결될 수 있으므로 더 큰 주의를 기울여야 한다.<\/li><li>미각은 시각이나 청각보다 덜 화려함(glamorous)<\/li><li>입안의 화학 작용(chemistry)이 곧 운명(destiny)이 될 수 있음<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">coat<\/td><td class=\"m\">입히다, 묻히다<\/td><\/tr><tr><td class=\"w\">swab<\/td><td class=\"m\">면봉<\/td><\/tr><tr><td class=\"w\">gargle<\/td><td class=\"m\">입을 헹구다, 양치질하다<\/td><\/tr><tr><td class=\"w\">thoroughly<\/td><td class=\"m\">철저하게, 완전히<\/td><\/tr><tr><td class=\"w\">reveal<\/td><td class=\"m\">드러내다, 밝히다<\/td><\/tr><tr><td class=\"w\">preference<\/td><td class=\"m\">선호, 기호<\/td><\/tr><tr><td class=\"w\">disorder<\/td><td class=\"m\">장애, 질환<\/td><\/tr><tr><td class=\"w\">tend to<\/td><td class=\"m\">~하는 경향이 있다<\/td><\/tr><tr><td class=\"w\">incidence<\/td><td class=\"m\">발생률, 발생 정도<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">liquor<\/td><td class=\"m\">술, 독주<\/td><\/tr><tr><td class=\"w\">conversely<\/td><td class=\"m\">반대로, 역으로<\/td><\/tr><tr><td class=\"w\">nutritious<\/td><td class=\"m\">영양가 있는<\/td><\/tr><tr><td class=\"w\">deprive<\/td><td class=\"m\">빼앗다, 박탈하다<\/td><\/tr><tr><td class=\"w\">glamorous<\/td><td class=\"m\">매력적인, 화려한<\/td><\/tr><tr><td class=\"w\">make sense<\/td><td class=\"m\">타당하다, 이치에 맞다<\/td><\/tr><tr><td class=\"w\">pay attention to<\/td><td class=\"m\">~에 주의를 기울이다<\/td><\/tr><tr><td class=\"w\">destiny<\/td><td class=\"m\">운명<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Coat a fresh, wet swab in salt,<\/b><\/span><span class=\"ko\">새로운 젖은 면봉에 소금을 묻히고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and gently touch various spots on your tongue,<\/b><\/span><span class=\"ko\">그리고 혀의 다양한 부위들에 부드럽게 대 보아라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">recording<\/span> <span class=\"grammar-hl\">where your taste seems strongest<\/span>.<\/b><\/span><span class=\"ko\">여러분의 미각이 가장 강렬하다고 느껴지는 곳을 기록하면서<\/span><\/div><\/div><div class=\"lec-sent-ko\">새로운 젖은 면봉에 소금을 묻히고 여러분의 미각이 가장 강렬하다고 느껴지는 곳을 기록하면서, 혀의 다양한 부위들에 부드럽게 대 보아라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글을 시작하면서 독자가 직접 해볼 수 있는 간단한 미각 테스트 방법을 안내합니다. where your taste seems strongest는 혀의 어느 부위에서 짠맛을 가장 예민하게 감지하는지 찾아내라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">recording (분사구문): 현재분사가 부사적 기능으로 쓰인 분사구문이다. 동시동작을 나타내며, 원래 절인 &#39;while you record&#39;로 변환할 수 있다.<\/div><div class=\"lec-gr-item\">where your taste seems strongest (간접의문문): 의문사(where) + 주어(your taste) + 동사(seems) 어순으로 명사절 역할을 하여, 앞의 현재분사 recording의 목적어가 된다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">coat<\/td><td class=\"m\">입히다, 묻히다<\/td><\/tr><tr><td class=\"w\">swab<\/td><td class=\"m\">면봉<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Then,<\/b><\/span><span class=\"ko\">그런 다음<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>gargle with water<\/b><\/span><span class=\"ko\">물로 입을 헹구어라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to thoroughly clean<\/span> your tongue,<\/b><\/span><span class=\"ko\">여러분의 혀를 완전히 씻어 내기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>use a swab <span class=\"grammar-hl\">coated<\/span> with sugar<\/b><\/span><span class=\"ko\">설탕이 묻은 면봉을 사용하라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on the same spots,<\/b><\/span><span class=\"ko\">같은 부위들에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and record those results.<\/b><\/span><span class=\"ko\">그리고 그 결과들을 기록하라<\/span><\/div><\/div><div class=\"lec-sent-ko\">그런 다음, 여러분의 혀를 완전히 씻어 내기 위해 물로 헹구고, 설탕이 묻은 면봉을 같은 부위들에 사용하고, 그 결과들을 기록하라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 소금 테스트에 이어 설탕을 이용해 같은 과정을 반복하도록 지시합니다. gargle with water to thoroughly clean your tongue은 이전의 맛이 다음 맛을 느끼는 데 방해가 되지 않도록 입안을 완전히 헹구라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to thoroughly clean (to부정사(부사적): 목적): in order to thoroughly clean으로 바꿔도 뜻이 같으므로 부사적 용법(목적)이다. 부사 thoroughly가 to와 동사원형 사이에 위치하여 동사를 수식하는 분리부정사 형태이다.<\/div><div class=\"lec-gr-item\">coated (과거분사(형용사적)): 과거분사 coated가 앞의 명사 a swab을 수식한다. 명사 뒤에서 수식하는 N + p.p. 구조로 &#39;설탕이 입혀진 면봉&#39;이라는 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">coat<\/td><td class=\"m\">입히다, 묻히다<\/td><\/tr><tr><td class=\"w\">swab<\/td><td class=\"m\">면봉<\/td><\/tr><tr><td class=\"w\">gargle<\/td><td class=\"m\">입을 헹구다, 양치질하다<\/td><\/tr><tr><td class=\"w\">thoroughly<\/td><td class=\"m\">철저하게, 완전히<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Gargle again,<\/span><\/b><\/span><span class=\"ko\">다시 헹구고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and then swab<\/span> with lemon juice.<\/b><\/span><span class=\"ko\">그러고 나서 레몬주스를 면봉으로 혀에 발라라<\/span><\/div><\/div><div class=\"lec-sent-ko\">다시 헹구고 그런 다음 레몬주스를 면봉으로 혀에 발라라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 계속해서 세 번째로 신맛을 테스트하는 단계입니다. 이전과 마찬가지로 맛이 섞이지 않게 가글을 먼저 해야 한다는 점을 일러 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Gargle again, and then swab (명령문): 주어(you)가 생략되고 동사원형 Gargle과 swab으로 시작하여 지시나 권고를 나타내는 명령문 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">swab<\/td><td class=\"m\">면봉<\/td><\/tr><tr><td class=\"w\">gargle<\/td><td class=\"m\">입을 헹구다, 양치질하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>After a final gargle,<\/b><\/span><span class=\"ko\">마지막 헹굼 이후에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">try coffee<\/span>.<\/b><\/span><span class=\"ko\">커피로 해 보아라<\/span><\/div><\/div><div class=\"lec-sent-ko\">마지막 헹굼 이후에 커피로 해 보아라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 미각 테스트의 마지막 단계로 쓴맛을 확인해 보라고 합니다. 이렇게 소금, 설탕, 레몬, 커피를 통해 사람이 느낄 수 있는 대표적인 네 가지 맛에 대한 혀의 반응을 모두 알아보는 과정이 마무리됩니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">try coffee (명령문): 주어(you)가 생략되고 동사원형 try로 시작하여 특정 행동을 해보라고 권하는 명령문 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gargle<\/td><td class=\"m\">입을 헹구다, 양치질하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Compare your reactions<\/span><\/b><\/span><span class=\"ko\">여러분의 반응들을 비교하라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">with<\/span> your <span class=\"grammar-hl\">friends<\/span>’.<\/b><\/span><span class=\"ko\">친구들의 것들과<\/span><\/div><\/div><div class=\"lec-sent-ko\">여러분의 반응들을 친구들의 것들과 비교하라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 지금까지 개인이 기록한 맛의 감지 결과를 다른 사람들과 대조해 보도록 유도합니다. 사람마다 맛을 강하게 느끼는 부위나 강도가 다를 수 있다는 사실을 자연스럽게 깨닫게 하려는 의도입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Compare your reactions with (동사구문): 주어가 생략된 동사원형 Compare로 시작하며, &#39;compare A with B(A를 B와 비교하다)&#39; 구조로 쓰였다.<\/div><div class=\"lec-gr-item\">friends&#39; (소유대명사): &#39;friends&#39; reactions&#39;(친구들의 반응들)의 반복을 피하기 위해 쓰인 소유대명사(친구들의 것)이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 6 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Your taste pattern <span class=\"grammar-hl\">may reveal<\/span><\/b><\/span><span class=\"ko\">여러분의 미각 패턴은 드러낼지도 모른다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>more than just taste preferences.<\/b><\/span><span class=\"ko\">단순히 맛에 대한 선호도보다 더 많은 것을<\/span><\/div><\/div><div class=\"lec-sent-ko\">여러분의 미각 패턴은 단순히 맛에 대한 선호도보다 더 많은 것을 드러낼지도 모른다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞의 실험 결과를 바탕으로 글의 핵심 주제로 넘어가는 전환점 역할을 합니다. more than just taste preferences는 사람마다 미각이 다르게 반응하는 것이 단순히 어떤 음식을 좋아하고 싫어하는 문제를 넘어, 개인의 특성에 훨씬 더 깊은 영향을 미친다는 것을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">may reveal 조동사 구문: 조동사 may 뒤에 동사원형 reveal이 이어져 &#39;~을 드러낼지도 모른다&#39;는 추측의 의미를 나타내는 서술부 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reveal<\/td><td class=\"m\">드러내다, 밝히다<\/td><\/tr><tr><td class=\"w\">preference<\/td><td class=\"m\">선호, 기호<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Recent studies suggest links<\/b><\/span><span class=\"ko\">최근의 연구들은 연관성을 보여 준다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">between taster status and behavioral disorders<\/span>.<\/b><\/span><span class=\"ko\">미각자의 상태와 행동 장애 사이의<\/span><\/div><\/div><div class=\"lec-sent-ko\">최근의 연구들은 미각자의 위계와 행동 장애 사이의 연관성을 보여 준다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 6번 문장에서 언급한 깊은 영향이 구체적으로 무엇인지 밝히는 부분입니다. links between taster status and behavioral disorders는 맛을 얼마나 예민하게 느끼는지가 특정한 문제 행동이나 건강상의 위험으로 이어질 수 있다는 사실을 뒷받침합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">between taster status and behavioral disorders (전치사구): 전치사 between과 &#39;A and B&#39; 구조가 결합되어 앞의 명사 links를 뒤에서 수식하는 형용사적 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">disorder<\/td><td class=\"m\">장애, 질환<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>For example,<\/b><\/span><span class=\"ko\">예를 들어<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“nontasters” <span class=\"grammar-hl\">tend to have<\/span> a higher incidence of alcoholism,<\/b><\/span><span class=\"ko\">‘미각 둔감자’는 더 높은 알코올 중독 발생률을 가지는 경향이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>perhaps because liquor <span class=\"grammar-hl\">seems less bitter<\/span> to them.<\/b><\/span><span class=\"ko\">아마도 술이 그들에게 덜 쓰다고 느껴지기 때문에<\/span><\/div><\/div><div class=\"lec-sent-ko\">예를 들어 ‘미각 둔감자’는 더 높은 알코올 중독 발생률을 가지는 경향이 있는데, 아마도 술이 그들에게 덜 쓰다고 느껴지기 때문일 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 7번 문장에 대한 첫 번째 구체적인 예시입니다. tend to have a higher incidence of alcoholism은 맛을 잘 느끼지 못하는 사람들이 알코올의 쓴맛을 덜 불쾌하게 받아들여 술을 더 자주 마시게 되고, 결과적으로 중독에 빠질 위험이 커진다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">tend to have (to부정사(명사적)): 동사 tend는 to부정사를 목적어로 취하며, to have는 tend의 목적어 자리에 쓰인 명사적 용법이다.<\/div><div class=\"lec-gr-item\">seems less bitter 2형식 구조: 불완전자동사 seems 뒤에 주격보어로 형용사구(less bitter)가 와서 주어인 liquor의 상태를 설명하는 2형식(SVC) 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tend to<\/td><td class=\"m\">~하는 경향이 있다<\/td><\/tr><tr><td class=\"w\">incidence<\/td><td class=\"m\">발생률, 발생 정도<\/td><\/tr><tr><td class=\"w\">liquor<\/td><td class=\"m\">술, 독주<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Conversely,<\/b><\/span><span class=\"ko\">반대로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“supertasters” may avoid nutritious but mildly bitter foods<\/b><\/span><span class=\"ko\">‘초미각자’는 영양가 있지만 약간 쓴 음식들을 피할지도 모른다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>such as broccoli,<\/b><\/span><span class=\"ko\">브로콜리와 같은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>thus <span class=\"grammar-hl\">depriving themselves of<\/span> a balanced diet.<\/b><\/span><span class=\"ko\">그리하여 스스로에게 균형 잡힌 식단을 주지 않을 수도 있다<\/span><\/div><\/div><div class=\"lec-sent-ko\">반대로 ‘초미각자’는 브로콜리와 같이 영양가 있지만 약간 쓴 음식들을 피할지도 모르고, 그러므로 스스로에게 균형 잡힌 식단을 주지 않을 수도 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 8번 문장과 대조되는 두 번째 예시입니다. depriving themselves of a balanced diet는 미각이 너무 예민해서 채소 특유의 약한 쓴맛조차 견디지 못하고 편식을 하게 되어, 결국 건강 유지에 필요한 영양소를 골고루 섭취하지 못하는 상태에 이른다는 것을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">depriving (분사구문): 현재분사가 부사적 기능으로 쓰인 분사구문이다. 문맥상 결과를 나타내며, 원래 절인 &#39;and they deprive&#39;로 변환할 수 있다.<\/div><div class=\"lec-gr-item\">depriving themselves of (관용표현): &#39;deprive A of B(A에게서 B를 빼앗다/박탈하다)&#39; 구조로 쓰였다. 규칙만으로 풀리지 않는 굳어진 동사구이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conversely<\/td><td class=\"m\">반대로, 역으로<\/td><\/tr><tr><td class=\"w\">nutritious<\/td><td class=\"m\">영양가 있는<\/td><\/tr><tr><td class=\"w\">deprive<\/td><td class=\"m\">빼앗다, 박탈하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>So,<\/b><\/span><span class=\"ko\">그래서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>although taste is not nearly as glamorous<\/b><\/span><span class=\"ko\">비록 미각이 거의 화려하지는 않지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as vision, hearing, or even touch,<\/b><\/span><span class=\"ko\">시각, 청각, 또는 심지어 촉각만큼<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">it makes sense<\/span><\/b><\/span><span class=\"ko\">타당하다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">for you to pay<\/span> closer attention to it<\/b><\/span><span class=\"ko\">여러분이 그것에 좀 더 세심한 주의를 기울이는 것이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because chemistry,<\/b><\/span><span class=\"ko\">화학 작용이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at least in your mouth,<\/b><\/span><span class=\"ko\">적어도 여러분의 입안에서는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>could be destiny.<\/b><\/span><span class=\"ko\">운명이 될 수 있기 때문에<\/span><\/div><\/div><div class=\"lec-sent-ko\">그래서 비록 미각이 시각, 청각, 또는 심지어 촉각만큼 화려하지는 않지만, 적어도 여러분의 입안에서는, 화학 작용이 운명이 될 수 있기 때문에 여러분이 그것에 좀 더 세심한 주의를 기울이는 것이 타당하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 전체 글을 마무리하며 미각의 중요성을 강조하는 결론입니다. chemistry, at least in your mouth, could be destiny — 글쓴이는 여기서 힘주어 말합니다. 입안에서 맛을 느끼는 선천적인 감각 차이가 앞서 말한 알코올 중독이나 영양 불균형처럼 개인의 건강과 삶의 방향을 결정짓는 중대한 요인이 될 수 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">it makes sense for you to pay (가주어): 진주어: it이 가주어이고, to pay 이하가 진주어이다. for you는 전치사 for를 사용하여 to부정사의 의미상 주어를 나타낸다.<\/div><div class=\"lec-gr-item\">to pay (to부정사(명사적)): It is ... to V 구조에서 진주어 자리에 쓰인 명사적 용법이다.<\/div><div class=\"lec-gr-item\">pay closer attention to (관용표현): &#39;pay attention to(~에 주의를 기울이다)&#39; 구조의 관용표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">glamorous<\/td><td class=\"m\">매력적인, 화려한<\/td><\/tr><tr><td class=\"w\">make sense<\/td><td class=\"m\">타당하다, 이치에 맞다<\/td><\/tr><tr><td class=\"w\">pay attention to<\/td><td class=\"m\">~에 주의를 기울이다<\/td><\/tr><tr><td class=\"w\">destiny<\/td><td class=\"m\">운명<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>여러 가지 맛을 이용해 혀의 반응을 알아보는 실험을 해보면 사람마다 미각 패턴이 다르다는 것을 알 수 있다.<\/li><li>이러한 미각의 차이는 단순한 호불호를 넘어 개인의 행동 특성이나 질병과도 깊은 연관이 있다.<\/li><li>미각이 둔한 사람은 술의 쓴맛을 덜 느껴 알코올 중독에 빠지기 쉽고, 미각이 너무 예민한 사람은 채소의 쓴맛을 기피해 영양 불균형을 겪기 쉽다.<\/li><li>따라서 입안의 미각 작용이 건강과 삶의 방향을 좌우할 수 있으므로 미각에 주의를 기울여야 한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Individual taste patterns may seem like mere sensory preferences, but they actually reveal significant biological links to human behavioral disorders and overall health.<\/div>\n              <div class=\"lec-final-sum-ko\">개인의 미각 패턴은 단순한 감각적 선호처럼 보일 수 있지만, 실제로는 인간의 행동 장애 및 전반적인 건강과의 중대한 생물학적 연관성을 드러낸다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./21_audio/1.mp3","hl":null}],[{"audio":"./21_audio/2.mp3","hl":null}],[{"audio":"./21_audio/3.mp3","hl":null},{"audio":"./21_audio/4.mp3","hl":"stage-0"},{"audio":"./21_audio/5.mp3","hl":"stage-1"},{"audio":"./21_audio/6.mp3","hl":"stage-2"},{"audio":"./21_audio/7.mp3","hl":"stage-3"},{"audio":"./21_audio/8.mp3","hl":"stage-4"}],[{"audio":"./21_audio/9.mp3","hl":null}],[{"audio":"./21_audio/10.mp3","hl":"main"},{"audio":"./21_audio/11.mp3","hl":"meaning"},{"audio":"./21_audio/12.mp3","hl":"grammar"}],[{"audio":"./21_audio/13.mp3","hl":"main"},{"audio":"./21_audio/14.mp3","hl":"meaning"},{"audio":"./21_audio/15.mp3","hl":"grammar"}],[{"audio":"./21_audio/16.mp3","hl":"main"},{"audio":"./21_audio/17.mp3","hl":"meaning"},{"audio":"./21_audio/18.mp3","hl":"grammar"}],[{"audio":"./21_audio/19.mp3","hl":"main"},{"audio":"./21_audio/20.mp3","hl":"meaning"},{"audio":"./21_audio/21.mp3","hl":"grammar"}],[{"audio":"./21_audio/22.mp3","hl":"main"},{"audio":"./21_audio/23.mp3","hl":"meaning"},{"audio":"./21_audio/24.mp3","hl":"grammar"}],[{"audio":"./21_audio/25.mp3","hl":"main"},{"audio":"./21_audio/26.mp3","hl":"meaning"},{"audio":"./21_audio/27.mp3","hl":"grammar"}],[{"audio":"./21_audio/28.mp3","hl":"main"},{"audio":"./21_audio/29.mp3","hl":"meaning"},{"audio":"./21_audio/30.mp3","hl":"grammar"}],[{"audio":"./21_audio/31.mp3","hl":"main"},{"audio":"./21_audio/32.mp3","hl":"meaning"},{"audio":"./21_audio/33.mp3","hl":"grammar"}],[{"audio":"./21_audio/34.mp3","hl":"main"},{"audio":"./21_audio/35.mp3","hl":"meaning"},{"audio":"./21_audio/36.mp3","hl":"grammar"}],[{"audio":"./21_audio/37.mp3","hl":"main"},{"audio":"./21_audio/38.mp3","hl":"meaning"},{"audio":"./21_audio/39.mp3","hl":"grammar"}],[{"audio":"./21_audio/40.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_21번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 21번","titleEn":"Beyond Preference: What Your Taste Patterns Reveal About You","titleKo":"선호를 넘어서: 미각 패턴이 당신에 대해 드러내는 것","imageUrl":"__enpImg__","stages":[{"label":"01미각 테스트 실험","items":["여러 가지 맛을 활용해 혀의 부위별 반응을 확인하고 비교하는 실험을 소개한다.","소금, 설탕, 레몬, 커피로 미각(taste) 반응 기록","개인 고유의 미각 패턴(taste pattern) 확인"]},{"label":"02새로운 연구 결과","items":["미각 상태가 단순한 입맛을 넘어 행동 문제와 연결될 수 있다는 최신 연구가 있다.","미각 상태(taster status)의 중요성 부각","행동 장애(behavioral disorders)와의 연관성 제시"]},{"label":"03미각 둔감자의 사례","items":["미각에 둔감한 사람은 술의 쓴맛을 덜 느껴 알코올 중독 위험이 상대적으로 높다.","미각 둔감자(nontasters)의 특징","알코올 중독(alcoholism) 발생률 증가"]},{"label":"04초미각자의 사례","items":["미각이 매우 예민한 사람은 약간 쓴맛이 나는 건강한 음식을 피하는 경향이 있다.","초미각자(supertasters)의 쓴맛 민감성","영양가 높은 음식을 기피하여 균형 잡힌 식단(balanced diet) 방해"]},{"label":"05결론","items":["미각이 우리의 건강과 운명에 직결될 수 있으므로 더 큰 주의를 기울여야 한다.","미각은 시각이나 청각보다 덜 화려함(glamorous)","입안의 화학 작용(chemistry)이 곧 운명(destiny)이 될 수 있음"]}],"bkg":"우리가 매일 느끼는 미각(Taste)은 단순히 음식을 즐기는 것을 넘어 우리의 건강과 행동에 깊은 영향을 미칠 수 있습니다. 사람들은 유전적인 요인에 따라 쓴맛을 거의 느끼지 못하는 무미각자(Nontaster)와 아주 예민하게 느끼는 초미각자(Supertaster) 등으로 나뉘는데, 이는 마치 매운맛을 전혀 못 먹는 '맵찔이'와 매운맛을 즐기는 사람이 있는 것과 비슷한 이치랍니다. 관련 연구에 따르면 무미각자는 술의 쓴맛을 덜 느껴 알코올 의존증(Alcoholism)에 빠질 위험이 높은 반면, 초미각자는 브로콜리처럼 약간 쓴맛이 나는 건강한 채소를 극도로 피하는 경향이 있다고 해요. 따라서 이 지문을 읽기 전에 미각 민감도(Taste sensitivity)가 단순한 입맛 차이를 넘어선 유전적이고 화학적인 반응이라는 점을 미리 기억해 두시면, 왜 입안의 화학 작용이 우리의 식습관이나 행동 장애로까지 이어질 수 있는지 훨씬 더 재미있고 쉽게 이해하실 수 있을 거예요.","ttsText":"우리가 매일 느끼는 미각(Taste)은 단순히 음식을 즐기는 것을 넘어 우리의 건강과 행동에 깊은 영향을 미칠 수 있습니다. 사람들은 유전적인 요인에 따라 쓴맛을 거의 느끼지 못하는 무미각자(Nontaster)와 아주 예민하게 느끼는 초미각자(Supertaster) 등으로 나뉘는데, 이는 마치 매운맛을 전혀 못 먹는 '맵찔이'와 매운맛을 즐기는 사람이 있는 것과 비슷한 이치랍니다. 관련 연구에 따르면 무미각자는 술의 쓴맛을 덜 느껴 알코올 의존증(Alcoholism)에 빠질 위험이 높은 반면, 초미각자는 브로콜리처럼 약간 쓴맛이 나는 건강한 채소를 극도로 피하는 경향이 있다고 해요. 따라서 이 지문을 읽기 전에 미각 민감도(Taste sensitivity)가 단순한 입맛 차이를 넘어선 유전적이고 화학적인 반응이라는 점을 미리 기억해 두시면, 왜 입안의 화학 작용이 우리의 식습관이나 행동 장애로까지 이어질 수 있는지 훨씬 더 재미있고 쉽게 이해하실 수 있을 거예요.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 21번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 21번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 한 요인이 될 수 있다는 의미입니다.. it makes sense for you to pay (가주어): 진주어: it이 가주어이고, to pay 이하가 진주어이다. for you는 전치사 for를 사용하여 to부정사의 의미상 주어를 나타낸다. to pay (to부정사(명사적)): It is ... to V 구조에서 진주어 자리에 쓰인 명사적 용법이다. pay closer attention to (관용표현): 'pay attention to(~에 주의를 기울이다)' 구조의 관용표현이다.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 21번","passageName":"모의고사 / 고2 / 2025년 / 10월 / 21번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 21번"},{"kind":"summary","passageName":"모의고사 / 고2 / 2025년 / 10월 / 21번","imageUrl":"__enpImg__","sumEn":"Individual taste patterns may seem like mere sensory preferences, but they actually reveal significant biological links to human behavioral disorders and overall health.","sumKo":"개인의 미각 패턴은 단순한 감각적 선호처럼 보일 수 있지만, 실제로는 인간의 행동 장애 및 전반적인 건강과의 중대한 생물학적 연관성을 드러낸다.","bullets":[],"overall":["여러 가지 맛을 이용해 혀의 반응을 알아보는 실험을 해보면 사람마다 미각 패턴이 다르다는 것을 알 수 있다.","이러한 미각의 차이는 단순한 호불호를 넘어 개인의 행동 특성이나 질병과도 깊은 연관이 있다.","미각이 둔한 사람은 술의 쓴맛을 덜 느껴 알코올 중독에 빠지기 쉽고, 미각이 너무 예민한 사람은 채소의 쓴맛을 기피해 영양 불균형을 겪기 쉽다.","따라서 입안의 미각 작용이 건강과 삶의 방향을 좌우할 수 있으므로 미각에 주의를 기울여야 한다."],"compare":{"headers":["구분","둔감한 미각 소유자(nontasters)","예민한 미각 소유자(supertasters)"],"rows":[["미각 감지 차이","쓴맛을 상대적으로 덜 느낌","채소 등의 약한 쓴맛도 매우 강하게 느낌"],["행동 특성","쓴 술에 대한 거부감이 적어 자주 마심","브로콜리 등 영양가 있는 쓴 채소를 기피함"],["건강상의 결과","알코올 중독 발생률이 높음","영양소를 골고루 섭취하지 못해 식단 불균형 초래"]]},"ttsText":"여러 가지 맛을 이용해 혀의 반응을 알아보는 실험을 해보면 사람마다 미각 패턴이 다르다는 것을 알 수 있다. 이러한 미각의 차이는 단순한 호불호를 넘어 개인의 행동 특성이나 질병과도 깊은 연관이 있다. 미각이 둔한 사람은 술의 쓴맛을 덜 느껴 알코올 중독에 빠지기 쉽고, 미각이 너무 예민한 사람은 채소의 쓴맛을 기피해 영양 불균형을 겪기 쉽다. 따라서 입안의 미각 작용이 건강과 삶의 방향을 좌우할 수 있으므로 미각에 주의를 기울여야 한다.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 21번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 21번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 여러 가지 맛을 이용해 혀의 반응을 알아보는 실험을 해보면 사람마다 미각 패턴이 다르다는 것을 알 수 있습니다. 이러한 미각의 차이는 단순한 호불호를 넘어 개인의 행동 특성이나 질병과도 깊은 연관이 있습니다. 미각이 둔한 사람은 술의 쓴맛을 덜 느껴 알코올 중독에 빠지기 쉽고, 미각이 너무 예민한 사람은 채소의 쓴맛을 기피해 영양 불균형을 겪기 쉽습니다. 따라서 입안의 미각 작용이 건강과 삶의 방향을 좌우할 수 있으므로 미각에 주의를 기울여야 합니다. 마지막으로 이 글을 한 문장으로 요약하면 이렇습니다. 개     const scrollsHorizontally = target => {

        if (el.scrollWidth > el.clientWidth + 2 && /^(auto|scroll)$/.test(getComputedStyle(el).overflowX)) return true;
        if (el === root) break;
      }
      return false;
    };
    root.addEventListener('touchstart', e => {
      gesture = null;
      if (e.touches.length !== 1 || zoomed() || selected() || interactive(e.target) || scrollsHorizontally(e.target)) return;
      const t = e.touches[0];
      // 화면 가장자리는 휴대폰 브라우저의 뒤로/앞으로 제스처에 맡긴다.
      if (t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
      gesture = { id: t.identifier, x: t.clientX, y: t.clientY, time: Date.now(), page: pageIndex(), horizontal: false };
