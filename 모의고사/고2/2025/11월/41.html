ether<small>근육의 역설: 상반된 요소들이 함께 작용하는 방식<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">이 지문을 더 깊이 있게 이해하시려면, 우리 몸의 근육이 마치 자동차의 가속 페달과 브레이크처럼 짝을 이루어 움직이는 길항작용(Antagonism)의 원리를 아시면 좋아요. 예를 들어 우리가 팔을 굽힐 때 앞쪽의 이두근(Biceps)은 짧아지며 수축(Contraction)하지만 뒤쪽의 삼두근(Triceps)은 길어지며 이완(Relaxation)하는 것처럼, 신체의 움직임은 한쪽 근육이 &#39;하는 일&#39;만큼이나 반대쪽 근육이 &#39;하지 않는 일(힘을 빼주는 것)&#39;이 필수적이죠. 또한 근육의 발달이 유전인지 후천적 노력인지 묻는 천성 대 양육(Nature versus Nurture)이라는 생물학의 오랜 논쟁도 이 글을 관통하는 핵심 배경지식입니다. 흔히 사람들은 무겁고 가벼운 운동 방식이나 타고남과 만들어짐을 완전히 대립하는 양극성(Polarity)으로 생각하기 쉽지만, 인체 생리학에서는 이 상반된 개념들이 사실 서로를 보완하고 반드시 필요로 한다는 역설(Paradox)적인 특징을 가진다는 점을 미리 기억해 두시면 글의 메시지가 훨씬 흥미롭게 다가올 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01근육의 수축과 이완<\/div><ul><li>팔을 올리고 내릴 때 반대되는 근육들이 서로 역할을 바꾸며 움직임을 만듭니다.<\/li><li>팔을 구부릴 때 이두근(biceps)은 수축하고 삼두근(triceps)은 이완함<\/li><li>동작을 반대로 할 때 근육의 역할이 역전됨(reverse roles)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02근육 움직임의 역설<\/div><ul><li>근육의 움직임은 근육이 하는 것뿐만 아니라 하지 않는 것에도 의존하는 역설적 성격을 가집니다.<\/li><li>움직임은 조율된 긴장(orchestrated tension)에 의해 관리되는 시스템<\/li><li>신체 활동은 역설적(paradoxical)이며 수축과 이완 모두 필수적임<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03근육 관련 개념의 양극화<\/div><ul><li>근육에 대해 이야기할 때 사용되는 대립적 개념들도 종종 하나의 정답만 있는 것처럼 보입니다.<\/li><li>선천성(nature) 대 후천성(nurture), 빠름 대 느림 등의 이분법적 질문 존재<\/li><li>이러한 대립(oppositions)은 관점을 양극화(polarize)할 수 있음<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04대립의 역설적 상호 의존성<\/div><ul><li>근육과 관련된 대립적 개념들은 실제로는 완전한 양극단이 아니라 서로를 필요로 하는 역설적 관계입니다.<\/li><li>대부분의 대립은 진정한 양극성(true polarities)이 아님<\/li><li>선천성과 후천성 등 대립되는 것들(opposites)은 실제로 서로를 필요로 함(require each other)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opposing<\/td><td class=\"m\">서로 대립하는, 반대되는<\/td><\/tr><tr><td class=\"w\">contract<\/td><td class=\"m\">수축하다<\/td><\/tr><tr><td class=\"w\">relax<\/td><td class=\"m\">이완하다, 풀어지다<\/td><\/tr><tr><td class=\"w\">reverse<\/td><td class=\"m\">뒤바꾸다, 반대로 하다<\/td><\/tr><tr><td class=\"w\">coordination<\/td><td class=\"m\">협동, 조정<\/td><\/tr><tr><td class=\"w\">orchestrate<\/td><td class=\"m\">조직하다, 치밀하게 구성하다<\/td><\/tr><tr><td class=\"w\">tension<\/td><td class=\"m\">긴장, 팽팽함<\/td><\/tr><tr><td class=\"w\">rotate<\/td><td class=\"m\">회전하다<\/td><\/tr><tr><td class=\"w\">activate<\/td><td class=\"m\">활성화하다, 작동시키다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deactivate<\/td><td class=\"m\">비활성화하다, 정지시키다<\/td><\/tr><tr><td class=\"w\">paradoxical<\/td><td class=\"m\">역설적인, 모순된<\/td><\/tr><tr><td class=\"w\">in this sense<\/td><td class=\"m\">이런 의미에서<\/td><\/tr><tr><td class=\"w\">depend on<\/td><td class=\"m\">~에 의존하다, ~에 달려있다<\/td><\/tr><tr><td class=\"w\">the same is true of<\/td><td class=\"m\">~의 경우에도 마찬가지다<\/td><\/tr><tr><td class=\"w\">nature versus nurture<\/td><td class=\"m\">유전 대 환경, 천성 대 양육<\/td><\/tr><tr><td class=\"w\">muscular<\/td><td class=\"m\">근육이 발달한, 근육질의<\/td><\/tr><tr><td class=\"w\">inborn<\/td><td class=\"m\">타고난, 선천적인<\/td><\/tr><tr><td class=\"w\">latter<\/td><td class=\"m\">후자의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When your hand <span class=\"grammar-hl\">is hanging<\/span><\/b><\/span><span class=\"ko\">손이 늘어져 있다가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at your side<\/b><\/span><span class=\"ko\">여러분의 옆에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and then you lift it,<\/b><\/span><span class=\"ko\">그런 다음 여러분이 그것을 올릴 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">opposing<\/span> muscles on your upper arm<\/b><\/span><span class=\"ko\">여러분의 상완에 있는 대립하는 근육들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>shorten and lengthen<\/b><\/span><span class=\"ko\">짧아지고 길어진다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>― contract and relax ―<\/b><\/span><span class=\"ko\">즉, 수축하고 이완한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to bend<\/span> the elbow.<\/b><\/span><span class=\"ko\">팔꿈치를 굽히기 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">손이 여러분의 옆에 늘어져 있다가 여러분이 그것을 올릴 때, 여러분의 상완에 있는 대립하는 근육들은 팔꿈치를 굽히기 위해 짧아지고 길어진다. 즉, 수축하고 이완한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 팔을 들어 올리는 일상적인 동작을 예로 들어, 우리 몸이 움직일 때 서로 반대되는 역할을 하는 근육들이 동시에 작용한다는 점을 보여주며 글을 시작합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is hanging (현재진행): be동사(is) + -ing(hanging) 형태로 주어(your hand)가 현재 진행 중인 동작을 나타낸다.<\/div><div class=\"lec-gr-item\">opposing (현재분사(형용사)): opposing이 뒤의 명사 muscles를 수식(= 반대 작용을 하는 근육). -ing + N 형태로 동작이나 특성을 나타낸다.<\/div><div class=\"lec-gr-item\">to bend (to부정사(부사적): 목적): in order to로 바꿔도 뜻이 같다. 팔꿈치를 구부리기 위해 동작을 한다는 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">opposing<\/td><td class=\"m\">서로 대립하는, 반대되는<\/td><\/tr><tr><td class=\"w\">contract<\/td><td class=\"m\">수축하다<\/td><\/tr><tr><td class=\"w\">relax<\/td><td class=\"m\">이완하다, 풀어지다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Biceps <span class=\"grammar-hl\">contract<\/span>,<\/b><\/span><span class=\"ko\">이두근은 수축하고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and triceps relax.<\/b><\/span><span class=\"ko\">삼두근은 이완한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">‘이두근은 수축하고, 삼두근은 이완한다.’<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 1번 문장의 동작을 더 구체적으로 설명합니다. 팔꿈치를 굽힐 때 앞쪽 근육은 힘을 주고 뒤쪽 근육은 힘을 빼는 과정을 묘사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">contract (일반동사): 주어 Biceps(이두근)의 동작을 나타내는 1형식 자동사로 쓰여 &#39;수축하다&#39;라는 의미를 완성한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">contract<\/td><td class=\"m\">수축하다<\/td><\/tr><tr><td class=\"w\">relax<\/td><td class=\"m\">이완하다, 풀어지다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Reversing<\/span> the motion,<\/b><\/span><span class=\"ko\">그 동작을 반대로 하여,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when you drop your hand back down,<\/b><\/span><span class=\"ko\">여러분이 손을 다시 아래로 떨어뜨릴 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>muscles reverse roles.<\/b><\/span><span class=\"ko\">근육들이 역할을 뒤바꾼다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 동작을 반대로 하여 여러분이 손을 다시 아래로 떨어뜨릴 때는, 근육들이 역할을 뒤바꾼다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 팔을 굽힐 때와 반대로 펼칠 때는, 앞서 힘을 주었던 근육과 힘을 뺐던 근육의 역할이 교대된다는 점을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Reversing (분사구문): 현재분사. 원래 절로의 변환 = when(또는 as/while) + you + reverse ... 부사절이 축약된 형태로, 주절의 주어(you)와 능동 관계이므로 현재분사로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reverse<\/td><td class=\"m\">뒤바꾸다, 반대로 하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Triceps <span class=\"grammar-hl\">contract<\/span>,<\/b><\/span><span class=\"ko\">삼두근은 수축하고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and biceps relax.<\/b><\/span><span class=\"ko\">이두근은 이완한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">‘삼두근은 수축하고, 이두근은 이완한다.’<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 3번 문장의 상황을 구체화하여, 팔을 내릴 때는 뒤쪽 근육이 힘을 내고 앞쪽 근육이 힘을 푸는 물리적 현상을 짚어 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">contract (일반동사): 주어 Triceps(삼두근)의 동작을 나타내는 1형식 자동사이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">contract<\/td><td class=\"m\">수축하다<\/td><\/tr><tr><td class=\"w\">relax<\/td><td class=\"m\">이완하다, 풀어지다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Lift your hand or drop it,<\/span><\/b><\/span><span class=\"ko\">여러분의 손을 올리거나 떨어뜨리면,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and<\/span> muscle shows<\/b><\/span><span class=\"ko\">근육은 보여 준다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">what it is<\/span>:<\/b><\/span><span class=\"ko\">그것이 무엇인지를 즉<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a system of coordination,<\/b><\/span><span class=\"ko\">조정 체계를,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">managed<\/span> by <span class=\"grammar-hl\">orchestrated<\/span> tension.<\/b><\/span><span class=\"ko\">조화롭게 편성된 긴장에 의해 관리되는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">여러분의 손을 올리거나 떨어뜨리면, 근육은 그것이 무엇인지를 보여 주는데, 즉 조화롭게 편성된 긴장에 의해 관리되는 조정 체계를 보여 준다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞의 예시들을 종합하여 결론을 내리는 문장입니다. orchestrated tension은 마치 오케스트라 연주자들이 정교하게 합을 맞추듯, 서로 반대되는 근육들이 긴장과 이완을 적절히 분배하여 뼈의 움직임을 통제한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Lift your hand or drop it, and 명령문 + and: &#39;A 해라, 그러면 B할 것이다&#39;의 구조로, 여기서는 &#39;손을 들어 올리거나 떨어뜨려 보아라, 그러면...&#39;이라는 연속된 조건과 결과를 나타낸다.<\/div><div class=\"lec-gr-item\">what it is (간접의문문): 의문대명사(what) + S(it) + V(is) 어순으로 명사절을 이끌어 타동사 shows의 목적어 역할을 한다.<\/div><div class=\"lec-gr-item\">managed (과거분사(형용사)): managed가 앞의 명사 a system of coordination을 수식(= 조직화된 긴장에 의해 관리되는 시스템). N + p.p. 형태.<\/div><div class=\"lec-gr-item\">orchestrated (과거분사(형용사)): orchestrated가 뒤의 명사 tension을 수식(= 조직화된 긴장). p.p. + N 형태.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">coordination<\/td><td class=\"m\">협동, 조정<\/td><\/tr><tr><td class=\"w\">orchestrate<\/td><td class=\"m\">조직하다, 치밀하게 구성하다<\/td><\/tr><tr><td class=\"w\">tension<\/td><td class=\"m\">긴장, 팽팽함<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">As<\/span> arms and legs rotate<\/b><\/span><span class=\"ko\">팔과 다리가 회전할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>around joints,<\/b><\/span><span class=\"ko\">관절들의 주위를,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>muscles activate and deactivate,<\/b><\/span><span class=\"ko\">근육들은 활성화되고 비활성화되며,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>contract and relax.<\/b><\/span><span class=\"ko\">수축하고 이완한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">팔과 다리가 관절들의 주위를 회전할 때, 근육들은 활성화되고 비활성화되며 즉, 수축하고 이완한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 팔꿈치뿐만 아니라 우리 몸의 모든 관절이 움직일 때 근육의 수축과 이완이라는 원리가 똑같이 적용됨을 알려 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">As 접속사: &#39;~함에 따라&#39; 또는 &#39;~할 때&#39;라는 의미로 시간을 나타내는 부사절을 이끈다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">contract<\/td><td class=\"m\">수축하다<\/td><\/tr><tr><td class=\"w\">relax<\/td><td class=\"m\">이완하다, 풀어지다<\/td><\/tr><tr><td class=\"w\">rotate<\/td><td class=\"m\">회전하다<\/td><\/tr><tr><td class=\"w\">activate<\/td><td class=\"m\">활성화하다, 작동시키다<\/td><\/tr><tr><td class=\"w\">deactivate<\/td><td class=\"m\">비활성화하다, 정지시키다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>All physical activity is paradoxical,<\/b><\/span><span class=\"ko\">모든 신체 활동은 역설적이다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in this sense:<\/b><\/span><span class=\"ko\">이런 의미에서 즉<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Movement depends<\/b><\/span><span class=\"ko\">움직임은 의존한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on <span class=\"grammar-hl\">what muscles don’t do<\/span>,<\/b><\/span><span class=\"ko\">근육들이 하지 않는 일에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as much as<\/span> it depends<\/b><\/span><span class=\"ko\">의존하는 것만큼이나<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on what they do.<\/b><\/span><span class=\"ko\">근육들이 하는 일에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이런 의미에서 모든 신체 활동은 역설적이다. 즉, 움직임은 근육들이 하는 일에 의존하는 만큼이나 근육들이 하지 ‘않는’ 일에 의존한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> what muscles don’t do는 한쪽 근육이 수축하며 힘을 낼 때 반대쪽 근육이 저항하지 않고 부드럽게 이완하며 힘을 빼 주는 상태를 가리킵니다. 움직임은 힘을 쓰는 것과 힘을 빼는 것이 함께 어우러져야 가능함을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">what muscles don’t do (관계대명사): 선행사를 포함하는 관계대명사 what이 이끄는 명사절로 &#39;~하는 것&#39;의 의미를 지니며, 전치사 on의 목적어 역할을 한다.<\/div><div class=\"lec-gr-item\">as much as 원급 비교: A as much as B 구조를 사용하여 뒤의 절(it depends on...)만큼이나 앞의 사실에도 동일하게 의존한다는 동등 비교를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">paradoxical<\/td><td class=\"m\">역설적인, 모순된<\/td><\/tr><tr><td class=\"w\">in this sense<\/td><td class=\"m\">이런 의미에서<\/td><\/tr><tr><td class=\"w\">depend on<\/td><td class=\"m\">~에 의존하다, ~에 달려있다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Both are necessary,<\/b><\/span><span class=\"ko\">둘 다 필수적이다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>each in its time<\/b><\/span><span class=\"ko\">각각의 때에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>― and the same is true<\/b><\/span><span class=\"ko\">― 그리고 마찬가지이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of each side of the pairs of concepts<\/b><\/span><span class=\"ko\">개념들의 쌍의 각각의 측면에도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">shaping<\/span> <span class=\"grammar-hl\">how we talk<\/span> of muscles.<\/b><\/span><span class=\"ko\">우리가 근육들에 대해 말하는 방식을 형성하는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">각각의 때에 둘 다 필수적이며, 우리가 근육들에 대해 말하는 방향을 형성하는 쌍을 이루는 개념들의 각각에도 마찬가지이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 근육의 수축과 이완이라는 물리적 현상에서, 이제부터 이야기할 근육에 관한 다양한 개념적 논쟁으로 주제를 확장하고 연결하는 징검다리 역할을 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">shaping (현재분사(형용사)): shaping이 앞의 명사 concepts를 수식(= 방식들을 형성하는 개념들). N + -ing 형태로 능동의 동작을 나타낸다.<\/div><div class=\"lec-gr-item\">how we talk (간접의문문): 의문부사(how) + S(we) + V(talk) 어순으로 명사절을 이끌어 현재분사 shaping의 목적어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">the same is true of<\/td><td class=\"m\">~의 경우에도 마찬가지다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Start<\/b><\/span><span class=\"ko\">시작해 보라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with nature versus nurture:<\/b><\/span><span class=\"ko\">유전 대 환경으로 즉<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Some people are stronger or more muscular<\/b><\/span><span class=\"ko\">어떤 사람들은 더 강하거나 더 근육이 많다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than others;<\/b><\/span><span class=\"ko\">다른 사람들보다;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is the difference inborn,<\/b><\/span><span class=\"ko\">그 차이는 타고난 것인가,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or does it depend<\/b><\/span><span class=\"ko\">아니면 의존하는가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on <span class=\"grammar-hl\">what people do<\/span>?<\/b><\/span><span class=\"ko\">사람들이 하는 행동에?<\/span><\/div><\/div><div class=\"lec-sent-ko\">유전 대 환경으로 시작해 보라. 어떤 사람들은 다른 사람들보다 더 강하거나 더 근육이 많다. 그 차이는 타고난 것인가, 아니면 사람들이 하는 행동에 달려 있는가?<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 8번 문장에서 언급한 &#39;개념 쌍&#39;의 첫 번째 사례입니다. 근육 발달이 선천적인 유전자 덕분인지, 후천적인 노력의 결과인지 묻는 흔한 논쟁을 제시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">what people do (관계대명사): 선행사를 포함하는 관계대명사 what으로 &#39;~하는 것&#39;의 의미를 지니며, 전치사 on의 목적어로 쓰인 명사절을 이끈다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">depend on<\/td><td class=\"m\">~에 의존하다, ~에 달려있다<\/td><\/tr><tr><td class=\"w\">nature versus nurture<\/td><td class=\"m\">유전 대 환경, 천성 대 양육<\/td><\/tr><tr><td class=\"w\">muscular<\/td><td class=\"m\">근육이 발달한, 근육질의<\/td><\/tr><tr><td class=\"w\">inborn<\/td><td class=\"m\">타고난, 선천적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>To the latter question:<\/b><\/span><span class=\"ko\">후자의 질문에 대해 말하자면 즉<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">What do you do?<\/span><\/b><\/span><span class=\"ko\">여러분은 무엇을 하는가?<\/span><\/div><\/div><div class=\"lec-sent-ko\">후자의 질문에 대해 말하자면, 여러분은 무엇을 ‘하는가’?<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 타고나는 것이 아니라 노력으로 만들어진다는 관점에 집중하여, 근육을 키우기 위해 구체적으로 어떤 훈련을 하는지 파고듭니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">What do you do? (의문문): 의문대명사 What을 목적어로 취하는 일반동사 do의 직접의문문 구조로, 조동사 do가 주어 you 앞에 위치하였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">latter<\/td><td class=\"m\">후자의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 11 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Do you have to lift weights,<\/b><\/span><span class=\"ko\">중량 운동을 해야 하는가,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or is <span class=\"grammar-hl\">walking<\/span> enough exercise?<\/b><\/span><span class=\"ko\">아니면 걷기가 충분한 운동인가?<\/span><\/div><\/div><div class=\"lec-sent-ko\">중량 운동을 해야 하는가, 아니면 걷기가 충분한 운동인가?<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 노력의 방식을 둘러싼 상반된 개념 쌍(무산소 운동과 유산소 운동)을 구체적인 질문 형태로 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">walking (동명사(명사적)): -ing가 주어 자리에 쓰여 &#39;걷는 것&#39;이라는 명사적 개념을 나타낸다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 12 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">How should you do<\/span> the exercise?<\/b><\/span><span class=\"ko\">그 운동을 어떻게 해야 하는가?<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 운동을 어떻게 해야 하는가?<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 운동의 종류를 넘어, 운동을 수행하는 구체적인 방식에 대한 논의로 질문을 이어갑니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">How should you do (도치): 의문사가 있는 의문문에서 조동사(should)가 주어(you) 앞으로 도치된 구조이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 13 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Should you move <span class=\"grammar-hl\">fast<\/span><\/b><\/span><span class=\"ko\">빠르게 움직여야 하는가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">or slowly<\/span>?<\/b><\/span><span class=\"ko\">아니면 천천히?<\/span><\/div><\/div><div class=\"lec-sent-ko\">빠르게, 아니면 천천히 움직여야 하는가?<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 운동 속도라는 또 다른 상반된 개념 쌍(빠름과 느림)을 던집니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">fast or slowly 부사 병렬 구조: 부사 fast와 slowly가 접속사 or로 대등하게 연결되어 동사 move를 수식한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 14 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Lift heavy weights<\/b><\/span><span class=\"ko\">무거운 중량을 들어야 하는가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or lighter <span class=\"grammar-hl\">ones<\/span>?<\/b><\/span><span class=\"ko\">아니면 더 가벼운 것을?<\/span><\/div><\/div><div class=\"lec-sent-ko\">무거운 것, 아니면 더 가벼운 것을 들어야 하는가?<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 중량과 관련된 상반된 개념 쌍(무거움과 가벼움)을 연달아 제시하며, 근육 훈련에 관한 여러 가지 선택지를 나열합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">ones 대명사: 앞서 언급된 복수 명사 weights를 반복을 피하기 위해 대신 받는 부정대명사이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 15 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Put<\/span> like that,<\/b><\/span><span class=\"ko\">그렇게 본다면,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>basic questions about muscle<\/b><\/span><span class=\"ko\">근육에 대한 기본적인 질문들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>may sound<\/b><\/span><span class=\"ko\">들릴지도 모른다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>like they have one right answer.<\/b><\/span><span class=\"ko\">단 하나의 정답을 가진 것처럼.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그렇게 본다면, 근육에 대한 기본적인 질문들이 단 하나의 정답을 가진 것처럼 들릴지도 모른다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> Put like that은 앞서 나열한 질문들처럼 대립하는 두 가지 선택지를 제시할 경우, 사람들은 흔히 둘 중 하나만 맞고 다른 하나는 틀렸다고 생각하기 쉽다는 통념을 짚어 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Put (분사구문): 과거분사. 원래 절로의 변환 = if + they(basic questions) + are put ... &#39;표현하다/말하다&#39;라는 뜻의 타동사 put이 조건의 부사절에서 축약되며 수동의 의미를 지닌 과거분사 형태로 남은 구문이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 16 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Oppositions <span class=\"grammar-hl\">can polarize<\/span>.<\/b><\/span><span class=\"ko\">반대 개념들은 양극화될 수 있다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">반대 개념들은 양극화될 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 두 가지 선택지가 타협할 수 없는 극단적인 반대 개념으로 여겨져, 사람들이 어느 한쪽 편만 고집하게 될 수 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">can polarize 조동사 + 동사원형: 조동사 can 뒤에 동사원형이 쓰여 가능성이나 경향(~할 수 있다)을 나타낸다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 17 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But where muscle <span class=\"grammar-hl\">is concerned<\/span>,<\/b><\/span><span class=\"ko\">하지만 근육에 관해서는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>few oppositions are true polarities.<\/b><\/span><span class=\"ko\">진정으로 양극성인 반대 개념들은 거의 없다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 근육에 관해서는, 진정으로 양극성인 반대 개념들은 거의 없다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 15번과 16번의 통념을 뒤집는 전환 문장입니다. 근육을 다룰 때 등장하는 대립 개념들은 배타적으로 둘 중 하나만 선택해야 하는 문제가 아님을 밝힙니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is concerned (수동태): be동사(is)+p.p.(concerned) 구조. concern은 타동사인데 뒤에 목적어가 없어서 수동구조 is concerned 형태로 쓴다. 기본구조: concern + O (O를 관련시키다/관여하게 하다). (문맥상 관용구 &#39;where N is concerned&#39; 형태이기도 함)<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 18 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Look<\/span> closely,<\/b><\/span><span class=\"ko\">자세히 보라,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and most prove<\/b><\/span><span class=\"ko\">그러면 대부분이 판명된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to be<\/span> paradoxes.<\/b><\/span><span class=\"ko\">역설인 것으로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">자세히 보면, 대부분이 역설인 것으로 판명된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 7번 문장에서 신체 활동이 역설적이라고 했던 것과 마찬가지로, 근육에 관한 여러 상반된 질문들도 사실은 서로 떨어질 수 없는 얽힌 관계임을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Look 명령문 + and: &#39;자세히 보아라, 그러면...&#39;의 의미로 쓰이는 구문이다. 조건문(If you look closely, ...)과 같은 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">to be (to부정사(명사적)): 주어·목적어·보어 자리에 들어가는 명사적 용법으로, 2형식 동사 prove의 주격보어 자리에 쓰여 주어를 서술한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 19 / 19<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Born and made<\/span>,<\/b><\/span><span class=\"ko\">타고난 것과 만들어진 것,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>heavy and light,<\/b><\/span><span class=\"ko\">무거운 것과 가벼운 것,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>fast and slow:<\/b><\/span><span class=\"ko\">빠른 것과 느린 것 즉<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Those opposites actually require<\/b><\/span><span class=\"ko\">그러한 반대 개념들은 실제로 필요로 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>each other.<\/b><\/span><span class=\"ko\">서로를.<\/span><\/div><\/div><div class=\"lec-sent-ko\">타고난 것과 만들어진 것, 무거운 것과 가벼운 것, 빠른 것과 느린 것, 즉, 그러한 반대 개념들은 실제로 서로를 필요로 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 최종 결론입니다. 팔을 굽히고 펼 때 수축과 이완이 조화롭게 동시에 이루어져야 하듯, 근육을 둘러싼 다양한 대립 개념들도 결국 서로 보완하며 함께 작동해야 함을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Born and made (분사구문): 과거분사. 원래 절로의 변환 = whether + they(opposites) + are born + and + made ... 양보의 부사절이 축약된 형태로, 주절의 주어와 수동 관계이므로 과거분사로 시작한다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>근육은 수축하고 이완하는 상반된 작용을 통해 움직임을 만들어내는 조화로운 시스템이다.<\/li><li>즉, 근육이 무언가를 하는 것뿐만 아니라 하지 않고 힘을 빼는 것 역시 필수적인 역설적 관계를 가진다.<\/li><li>이런 역설적인 성격은 선천성 vs 후천성, 빠름 vs 느림 같은 근육에 관한 다양한 논의 방식에도 동일하게 적용된다.<\/li><li>우리는 이런 반대되는 질문들 중 하나의 정답만 있다고 흔히 오해하지만, 실제로는 이 상반된 개념들이 서로를 보완하고 필요로 한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Physical movement relies on the paradoxical coordination of opposing muscle actions, and similarly, the principles of muscle development require the integration of contrasting concepts.<\/div>\n              <div class=\"lec-final-sum-ko\">신체 움직임은 상반된 근육 작용의 역설적 조화에 의존하며, 이와 유사하게 근육 발달의 원리도 대조적인 개념들의 통합을 필요로 한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./41_audio/1.mp3","hl":null}],[{"audio":"./41_audio/2.mp3","hl":null}],[{"audio":"./41_audio/3.mp3","hl":null},{"audio":"./41_audio/4.mp3","hl":"stage-0"},{"audio":"./41_audio/5.mp3","hl":"stage-1"},{"audio":"./41_audio/6.mp3","hl":"stage-2"},{"audio":"./41_audio/7.mp3","hl":"stage-3"}],[{"audio":"./41_audio/8.mp3","hl":null}],[{"au ence","idx":19,"total":19,"english":"Born and made, heavy and light, fast and slow: Those opposites actually require each other.","korean":"타고난 것과 만들어진 것, 무거운 것과 가벼운 것, 빠른 것과 느린 것, 즉, 그러한 반대 개념들은 실제로 서로를 필요로 한다.","chunks":[{"english":"Born and made,","englishHtml":"<b><span class=\"grammar-hl\">Born and made<\/span>,<\/b>","korean":"타고난 것과 만들어진 것,"},{"english":"heavy and light,","englishHtml":"<b>heavy and light,<\/b>","korean":"무거운 것과 가벼운 것,"},{"english":"fast and slow:","englishHtml":"<b>fast and slow:<\/b>","korean":"빠른 것과 느린 것 즉"},{"english":"Those opposites actually require","englishHtml":"<b>Those opposites actually require<\/b>","korean":"그러한 반대 개념들은 실제로 필요로 한다"},{"english":"each other.","englishHtml":"<b>each other.<\/b>","korean":"서로를."}],"meaning":"글의 최종 결론입니다. 팔을 굽히고 펼 때 수축과 이완이 조화롭게 동시에 이루어져야 하듯, 근육을 둘러싼 다양한 대립 개념들도 결국 서로 보완하며 함께 작동해야 함을 강조합니다.","grammar":"Born and made (분사구문): 과거분사. 원래 절로의 변환 = whether + they(opposites) + are born + and + made ... 양보의 부사절이 축약된 형태로, 주절의 주어와 수동 관계이므로 과거분사로 시작한다.","grammarItems":["Born and made (분사구문): 과거분사. 원래 절로의 변환 = whether + they(opposites) + are born + and + made ... 양보의 부사절이 축약된 형태로, 주절의 주어와 수동 관계이므로 과거분사로 시작한다."],"vocab":[],"ttsText":"타고난 것과 만들어진 것, 무거운 것과 가벼운 것, 빠른 것과 느린 것, 즉, 그러한 반대 개념들은 실제로 서로를 필요로 한다.. 글의 최종 결론입니다. 팔을 굽히고 펼 때 수축과 이완이 조화롭게 동시에 이루어져야 하듯, 근육을 둘러싼 다양한 대립 개념들도 결국 서로 보완하며 함께 작동해야 함을 강조합니다.. Born and made (분사구문): 과거분사. 원래 절로의 변환 = whether + they(opposites) + are born + and + made ... 양보의 부사절이 축약된 형태로, 주절의 주어와 수동 관계이므로 과거분사로 시작한다.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 41-42번","passageName":"모의고사 / 고2 / 2025년 / 10월 / 41-42번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 41-42번"},{"kind":"summary","passageName":"모의고사 / 고2 / 2025년 / 10월 / 41-42번","imageUrl":"__enpImg__","sumEn":"Physical movement relies on the paradoxical coordination of opposing muscle actions, and similarly, the principles of muscle development require the integration of contrasting concepts.","sumKo":"신체 움직임은 상반된 근육 작용의 역설적 조화에 의존하며,       gesture = { id: t.identifier, x: t.clientX, y: t.clientY, time: Date.now(), page: pageIndex(), horizontal: false };
