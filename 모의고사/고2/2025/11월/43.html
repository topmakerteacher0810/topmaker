age-head\">02과거의 시련과 참가 결심<\/div><ul><li>제이슨은 무릎 부상으로 달리기를 쉬고 있었지만 샘을 위해 마라톤 참가를 다짐한다.<\/li><li>과거 학교에서 가장 빠른 달리기 선수(The Speedster)로 불림<\/li><li>무릎 부상(knee injury)으로 인해 오랫동안 달리지 못한 상태<\/li><li>마라톤이 상징하는 희망(hope)을 떠올리며 참가를 결심함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03준비 과정과 대회 당일<\/div><ul><li>의사의 허락을 받아 코스에 등록하고, 대회 당일 샘의 응원을 받으며 동기부여를 얻는다.<\/li><li>회복에 집중한 뒤 3마일 초보자 코스(beginner route)에 등록<\/li><li>마라톤 당일 응원 팻말(sign)을 들고 있는 샘을 군중 속에서 발견함<\/li><li>샘의 미소가 제이슨에게 완벽한 동기부여(motivation)가 됨<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04한계 극복과 완주<\/div><ul><li>체력적 한계를 극복하고 결승선을 통과한 제이슨은 큰 성취감과 보람을 느낀다.<\/li><li>오랜 공백기로 인해 달리며 매 걸음마다 고비(struggle)를 겪음<\/li><li>샘이 기뻐할 모습을 떠올리며 결승선(finish line)을 통과함<\/li><li>완주 후 자부심(pride), 안도감(relief), 감사함(gratitude)을 느낌<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stare at<\/td><td class=\"m\">~을 응시하다, ~을 빤히 쳐다보다<\/td><\/tr><tr><td class=\"w\">annual<\/td><td class=\"m\">매년의, 연례의<\/td><\/tr><tr><td class=\"w\">charity<\/td><td class=\"m\">자선, 자선 단체<\/td><\/tr><tr><td class=\"w\">stir<\/td><td class=\"m\">(감정을) 불러일으키다, 동요시키다<\/td><\/tr><tr><td class=\"w\">dream of<\/td><td class=\"m\">~을 꿈꾸다, ~을 상상하다<\/td><\/tr><tr><td class=\"w\">rare<\/td><td class=\"m\">희귀한, 드문<\/td><\/tr><tr><td class=\"w\">condition<\/td><td class=\"m\">질환, 병<\/td><\/tr><tr><td class=\"w\">injury<\/td><td class=\"m\">부상, 상처<\/td><\/tr><tr><td class=\"w\">represent<\/td><td class=\"m\">상징하다, 나타내다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recover<\/td><td class=\"m\">회복하다, 낫다<\/td><\/tr><tr><td class=\"w\">deadline<\/td><td class=\"m\">마감일, 기한<\/td><\/tr><tr><td class=\"w\">sign up for<\/td><td class=\"m\">~에 등록하다, ~을 신청하다<\/td><\/tr><tr><td class=\"w\">pound<\/td><td class=\"m\">(가슴이) 쿵쾅거리다, 심하게 뛰다<\/td><\/tr><tr><td class=\"w\">motivation<\/td><td class=\"m\">동기 부여, 자극<\/td><\/tr><tr><td class=\"w\">fade<\/td><td class=\"m\">희미해지다, 서서히 사라지다<\/td><\/tr><tr><td class=\"w\">struggle<\/td><td class=\"m\">고군분투, 힘든 일<\/td><\/tr><tr><td class=\"w\">push forward<\/td><td class=\"m\">앞으로 나아가다, 계속 밀고 나아가다<\/td><\/tr><tr><td class=\"w\">catch one&#39;s breath<\/td><td class=\"m\">숨을 고르다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Jason <span class=\"grammar-hl\">stared at<\/span> the banner<\/b><\/span><span class=\"ko\">Jason은 현수막을 응시했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>across the high school gym wall:<\/b><\/span><span class=\"ko\">고등학교 체육관 벽에 걸린<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“Annual Charity Marathon ― Run for Sam.”<\/b><\/span><span class=\"ko\">‘연간 자선 마라톤 ― Sam을 위해 달리세요’<\/span><\/div><\/div><div class=\"lec-sent-ko\">Jason은 고등학교 체육관 벽에 걸린 ‘연간 자선 마라톤 ― Sam을 위해 달리세요’라고 쓰인 현수막을 응시했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 체육관에 들어선 제이슨의 시선이 어디에 꽂혔는지 보여 주며, 앞으로 전개될 이야기의 중심 소재인 자선 마라톤을 소개하는 문장입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">stared at (관용표현): 문법 규칙으로 풀리지 않고 굳어진 구동사로 &#39;...을 빤히 쳐다보다/응시하다&#39;라는 의미로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stare at<\/td><td class=\"m\">~을 응시하다, ~을 빤히 쳐다보다<\/td><\/tr><tr><td class=\"w\">annual<\/td><td class=\"m\">매년의, 연례의<\/td><\/tr><tr><td class=\"w\">charity<\/td><td class=\"m\">자선, 자선 단체<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The slogan <span class=\"grammar-hl\">stirred<\/span> something<\/b><\/span><span class=\"ko\">그 슬로건이 무언가를 요동치게 했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in him.<\/b><\/span><span class=\"ko\">그의 마음속에서<\/span><\/div><\/div><div class=\"lec-sent-ko\">그 슬로건이 그의 마음을 요동치게 했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> stirred something in him은 그 문구를 보고 마음속 깊은 곳에서 형언하기 힘든 감동이나 동기가 솟아났다는 의미입니다. 현수막의 문구가 제이슨에게 단순한 글귀 이상의 특별한 의미로 다가왔음을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">stirred 일반동사 과거형: 주어 뒤에서 과거 시제를 나타내기 위해 규칙 변화인 -ed가 붙은 형태다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stir<\/td><td class=\"m\">(감정을) 불러일으키다, 동요시키다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Sam, a cheerful seven-year-old<\/b><\/span><span class=\"ko\">명랑한 일곱 살 아이인 Sam은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who<\/span> loved <span class=\"grammar-hl\">to draw<\/span> and dreamed of being an artist,<\/b><\/span><span class=\"ko\">그림 그리기를 좋아하고 화가가 되기를 꿈꿨던<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>had a rare heart condition.<\/b><\/span><span class=\"ko\">희귀 심장 질환을 가지고 있었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그림 그리기를 좋아하고 화가가 되기를 꿈꿨던 명랑한 일곱 살 아이인 Sam은 희귀 심장 질환을 가지고 있었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 마라톤의 목적이 왜 &#39;샘&#39;을 향해 있는지 그 배경을 설명합니다. a rare heart condition이라는 안타까운 상황이 화가를 꿈꾸는 밝은 아이의 모습과 겹쳐져 독자의 연민을 자아냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who (관계대명사(주격)): 선행사 a cheerful seven-year-old를 수식하는 관계대명사절을 이끌며, 절 내부에서 주어 역할을 한다. 주어가 빠진 상태로 동사 loved와 dreamed가 이어진다.<\/div><div class=\"lec-gr-item\">to draw (to부정사(명사적)): 동사 loved의 목적어 자리에 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dream of<\/td><td class=\"m\">~을 꿈꾸다, ~을 상상하다<\/td><\/tr><tr><td class=\"w\">rare<\/td><td class=\"m\">희귀한, 드문<\/td><\/tr><tr><td class=\"w\">condition<\/td><td class=\"m\">질환, 병<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Sam wasn’t just anyone —<\/b><\/span><span class=\"ko\">Sam은 그저 아무나가 아니었다 —<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he was the little boy <span class=\"grammar-hl\">living<\/span> next door<\/b><\/span><span class=\"ko\">그는 옆집에 사는 어린 소년이었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> Jason had babysat every summer break.<\/b><\/span><span class=\"ko\">Jason이 여름 방학마다 돌보았던<\/span><\/div><\/div><div class=\"lec-sent-ko\">Sam은 그저 아무나가 아니었다. 그는 Jason이 여름 방학마다 돌보았던 옆집에 사는 어린 소년이었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> wasn’t just anyone은 샘이 제이슨과 아주 각별하고 친밀한 인연을 맺고 있는 특별한 존재임을 강조합니다. 왜 제이슨이 그 현수막을 보고 마음이 움직였는지 구체적인 이유가 드러납니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">living (현재분사(형용사적)): living이 명사 the little boy를 수식(= &#39;옆집에 사는 소년&#39;). the little boy that was living... 과 같은 의미로, 명사가 &#39;...하는&#39; 동작의 주체임을 나타낸다.<\/div><div class=\"lec-gr-item\">that (관계대명사(목적격)): 선행사 the little boy를 수식하는 관계대명사절을 이끈다. 절 내부에서 타동사 babysat의 목적어가 빠진 자리가 존재한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 5 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He <span class=\"grammar-hl\">had played<\/span><\/b><\/span><span class=\"ko\">그는 놀았었고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the park<\/b><\/span><span class=\"ko\">공원에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and spent summer afternoons<\/b><\/span><span class=\"ko\">여름 오후를 보냈었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">chasing<\/span> ice cream trucks<\/b><\/span><span class=\"ko\">아이스크림 트럭을 쫓아다니며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with Sam.<\/b><\/span><span class=\"ko\">Sam과 함께<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 Sam과 함께 공원에서 놀았었고 아이스크림 트럭을 쫓아다니며 여름 오후를 보냈었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> spent summer afternoons chasing은 여름날 동네에서 아이스크림 트럭을 뒤쫓으며 함께 웃고 즐겼던 과거의 구체적인 추억을 꺼내어, 두 사람이 얼마나 따뜻한 시간을 공유했는지 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">had played (과거완료): had + p.p. 형태. 기준이 되는 과거 시점보다 더 이전에 일어난 동작을 나타낸다.<\/div><div class=\"lec-gr-item\">chasing (현재분사): spend + 시간 + -ing 구문에서 시간을 보내며 &#39;...하는 중인&#39; 동작을 나타내는 부사적 기능으로 쓰였다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 6 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Seeing<\/span> Sam’s name on the banner<\/b><\/span><span class=\"ko\">현수막에 적힌 Sam의 이름을 보는 것이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">made everything feel<\/span> personal.<\/b><\/span><span class=\"ko\">모든 것을 개인적으로 느껴지게 했다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">현수막에 적힌 Sam의 이름을 보는 것이 모든 것을 개인적으로 느껴지게 했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> made everything feel personal — 글쓴이는 여기서 힘주어 말합니다. 이 마라톤 대회가 단순히 남을 돕는 흔한 행사가 아니라, 제이슨 자신이 직접 나서서 챙겨야만 하는 중요한 문제로 마음 깊이 다가왔다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Seeing (동명사): 명사 역할을 하여 문장의 주어 자리에 쓰였다.<\/div><div class=\"lec-gr-item\">made everything feel 5형식(SVOC) 구조: 사역동사 made + 목적어 everything + 목적격보어 자리에 동사원형 feel이 온 구조로, 목적어가 ~하게 만들다라는 의미를 갖는다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 7 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Jason had always been the fastest runner in school,<\/b><\/span><span class=\"ko\">Jason은 항상 학교에서 가장 빠른 달리기 주자였고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">known<\/span> among his friends<\/b><\/span><span class=\"ko\">그의 친구들 사이에서 알려져 있었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as “The Speedster.”<\/b><\/span><span class=\"ko\">‘빠르게 달리는 아이’로<\/span><\/div><\/div><div class=\"lec-sent-ko\">Jason은 항상 학교에서 가장 빠른 달리기 주자였고, 그의 친구들 사이에서 ‘빠르게 달리는 아이’로 알려져 있었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> known among his friends as는 제이슨이 과거에 달리기 실력이 뛰어나 별명까지 얻을 정도였음을 알려주며, 그가 마라톤에 참여할 만한 훌륭한 재능을 가졌던 인물임을 제시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">known (분사구문): 부사적 기능으로 쓰인 과거분사 구문이다. 원래 절인 as he was known among his friends에서 접속사와 주어가 생략되고, be동사가 being이 되어 생략된 후 과거분사 known만 남았다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 8 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But since his knee injury,<\/b><\/span><span class=\"ko\">하지만 그의 무릎 부상 이후,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he hadn’t been able <span class=\"grammar-hl\">to run<\/span><\/b><\/span><span class=\"ko\">그는 달릴 수 없었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for quite a long time.<\/b><\/span><span class=\"ko\">꽤 오랜 시간 동안<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 그의 무릎 부상 이후, 그는 꽤 오랜 시간 동안 달리지 못했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> for quite a long time은 예전의 화려한 모습과 대비되는 제이슨의 뼈아픈 현재 상태를 설명하며, 그가 다시 달리는 것이 육체적으로 큰 도전과 극복의 과정이 될 것임을 암시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to run (to부정사(부사적): 형용사 수식): to run 바로 앞의 형용사 able을 수식하여 &#39;~할 수 있는&#39;의 의미를 더해준다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">injury<\/td><td class=\"m\">부상, 상처<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Still,<\/b><\/span><span class=\"ko\">그럼에도 불구하고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when Jason thought about Sam<\/b><\/span><span class=\"ko\">Jason이 Sam에 대해 생각했을 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and the hope <span class=\"grammar-hl\">this marathon represented<\/span>,<\/b><\/span><span class=\"ko\">그리고 이 마라톤이 나타내는 희망에 대해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he knew he had to try.<\/b><\/span><span class=\"ko\">그는 자신이 도전해 봐야 한다는 것을 알았다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그럼에도 불구하고 Jason이 Sam과 이 마라톤이 나타내는 희망에 대해 생각했을 때, 그는 자신이 도전해 봐야 한다는 것을 알았다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> the hope this marathon represented는 이 행사가 심장병을 앓는 샘에게 줄 수 있는 긍정적인 에너지와 응원의 마음을 가리킵니다. 부상이라는 핑계 뒤에 숨지 않고 용기를 내게 되는 결정적 계기입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">this marathon represented 관계대명사(목적격 생략): 선행사 the hope 뒤에 목적격 관계대명사 that 또는 which가 생략되어 있다. 절 내부에 타동사 represented의 목적어가 빠져 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">represent<\/td><td class=\"m\">상징하다, 나타내다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Jason did everything <span class=\"grammar-hl\">he could<\/span><\/b><\/span><span class=\"ko\">Jason은 자신이 할 수 있는 모든 것을 했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to recover<\/span>,<\/b><\/span><span class=\"ko\">회복하기 위해,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">following<\/span> his doctor’s advice.<\/b><\/span><span class=\"ko\">의사의 조언을 따라<\/span><\/div><\/div><div class=\"lec-sent-ko\">Jason은 의사의 조언을 따라 회복하기 위해 자신이 할 수 있는 모든 것을 했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> did everything he could는 제이슨이 달리기를 다시 시작하기 위해 철저하게 재활에 매달리며 엄청난 노력을 기울였음을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">he could 관계대명사(목적격 생략): 선행사 everything 뒤에 목적격 관계대명사 that이 생략된 구조로, could 뒤에 대동사 do가 생략되어 목적어 자리가 비어 있다.<\/div><div class=\"lec-gr-item\">to recover (to부정사(부사적): 목적): in order to recover로 바꿔도 뜻이 같으며, &#39;~하기 위해&#39;라는 목적을 나타낸다.<\/div><div class=\"lec-gr-item\">following (분사구문): 부사적 기능으로 쓰인 현재분사 구문이다. 원래 절인 as he followed his doctor&#39;s advice에서 접속사와 주어(대명사)가 생략되고 동사가 -ing 형태로 바뀐 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">recover<\/td><td class=\"m\">회복하다, 낫다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 11 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>A day before the registration deadline,<\/b><\/span><span class=\"ko\">등록 마감 하루 전날,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>his doctor <span class=\"grammar-hl\">said<\/span><\/b><\/span><span class=\"ko\">그의 의사는 말했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">a 3-mile run would be<\/span> fine.<\/b><\/span><span class=\"ko\">3마일 달리기는 괜찮을 것이라고<\/span><\/div><\/div><div class=\"lec-sent-ko\">등록 마감 하루 전날, 그의 의사는 3마일 달리기는 괜찮을 것이라고 말했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> registration deadline 직전에 극적으로 의사의 허락이 떨어지는 상황을 연출하여, 무사히 대회에 나갈 수 있게 된 기쁨과 다행스러움을 전해 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">said a 3-mile run would be 명사절 접속사 생략: 타동사 said의 목적어 역할을 하는 명사절을 이끄는 접속사 that이 생략되어, 뒤에 완전한 절 구조인 주어(a 3-mile run)와 동사(would be)가 이어진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">deadline<\/td><td class=\"m\">마감일, 기한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 12 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Jason <span class=\"grammar-hl\">signed up for<\/span> the 3-mile beginner route,<\/b><\/span><span class=\"ko\">Jason은 3마일 초보자 코스에 등록했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">hoping<\/span> <span class=\"grammar-hl\">to run<\/span><\/b><\/span><span class=\"ko\">달리기를 희망하면서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for Sam.<\/b><\/span><span class=\"ko\">Sam을 위해<\/span><\/div><\/div><div class=\"lec-sent-ko\">Jason은 Sam을 위해 달리기를 희망하면서, 3마일 초보자 코스에 등록했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> beginner route를 선택한 것은 무릎 부상에서 갓 회복한 상태이기에 무리하지 않고 자신이 무사히 끝마칠 수 있는 현실적인 목표를 세워 대회에 임하기로 했음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">signed up for (관용표현): 문법 규칙으로 풀리지 않는 구동사로 &#39;~에 등록하다&#39;라는 의미를 가진다.<\/div><div class=\"lec-gr-item\">hoping (분사구문): 부사적 기능으로 쓰인 현재분사 구문이다. 원래 절인 as he hoped to run...에서 접속사와 주어(대명사)가 생략되고 동사원형에 -ing가 붙은 형태다.<\/div><div class=\"lec-gr-item\">to run (to부정사(명사적)): 동사 hoping(hope)의 목적어 자리에 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sign up for<\/td><td class=\"m\">~에 등록하다, ~을 신청하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 13 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>On marathon morning,<\/b><\/span><span class=\"ko\">마라톤 당일 아침,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Jason stood<\/b><\/span><span class=\"ko\">Jason은 섰다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>among the runners,<\/b><\/span><span class=\"ko\">달리기 주자들 사이에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">heart pounding<\/span>.<\/b><\/span><span class=\"ko\">가슴이 쿵쿵 뛰는 채로<\/span><\/div><\/div><div class=\"lec-sent-ko\">마라톤 당일 아침, Jason은 가슴이 쿵쿵 뛰는 채로 달리기 주자들 사이에 섰다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> heart pounding은 오랫동안 뛰지 못하다가 마침내 출발선에 서게 된 제이슨의 벅찬 긴장감과 벅찬 설렘을 생생하게 전달합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">heart pounding (분사구문): 분사의 의미상 주어인 heart가 주절 주어 Jason과 달라서 생략 없이 명시된 구문이다. 원래 절인 as his heart was pounding에서 접속사가 생략되고 동사가 현재분사 pounding으로 남은 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pound<\/td><td class=\"m\">(가슴이) 쿵쾅거리다, 심하게 뛰다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 14 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In the crowd,<\/b><\/span><span class=\"ko\">군중 속에서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Sam <span class=\"grammar-hl\">was holding<\/span> a sign:<\/b><\/span><span class=\"ko\">Sam이 팻말을 들고 있었다:<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“Thank you, Runners!”<\/b><\/span><span class=\"ko\">‘감사해요, 러너분들!’<\/span><\/div><\/div><div class=\"lec-sent-ko\">군중 속에서 Sam이 ‘감사해요, 러너분들!’이라고 쓰인 팻말을 들고 있었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> In the crowd 속에서 자신들을 위해 달려주는 사람들에게 감사 인사를 전하는 샘의 모습을 통해, 제이슨이 오늘 달려야 할 명확한 목표가 눈앞에 실체로 나타납니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was holding (과거진행): be동사 과거형(was)과 일반동사의 -ing형태가 결합하여 과거의 특정 시점에 진행 중이던 동작을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sign up for<\/td><td class=\"m\">~에 등록하다, ~을 신청하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 15 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Jason <span class=\"grammar-hl\">smiled<\/span>.<\/b><\/span><span class=\"ko\">Jason은 미소 지었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Jason은 미소 지었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 샘의 건강한 모습을 본 안도감과, 오늘 반드시 끝까지 달려내고야 말겠다는 결의가 내면에서 조용히 다져지는 순간을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">smiled 일반동사 과거형: 규칙 동사 smile에 -d가 붙어 과거 시제를 나타낸다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 16 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He was all the motivation <span class=\"grammar-hl\">needed<\/span>.<\/b><\/span><span class=\"ko\">그는 필요한 동기의 전부였다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 필요한 동기의 전부였다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> all the motivation needed는 샘의 표지판과 그의 존재 자체만으로도 제이슨이 겪게 될 모든 고통을 이겨낼 완벽한 원동력이 되었다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">needed (과거분사(형용사적)): needed가 명사 motivation을 수식(= &#39;필요한 동기&#39;). motivation that is/was needed와 같이 수식받는 명사 기준으로 수동/완료의 의미를 지닌다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">motivation<\/td><td class=\"m\">동기 부여, 자극<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 17 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When the whistle blew,<\/b><\/span><span class=\"ko\">호각이 울리자,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Jason started strong,<\/b><\/span><span class=\"ko\">Jason은 힘차게 출발했지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but since he hadn’t run for so long,<\/b><\/span><span class=\"ko\">너무 오랫동안 달리지 않았기 때문에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>his energy faded quickly.<\/b><\/span><span class=\"ko\">그의 힘은 빠르게 사라졌다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">호각이 울리자 Jason은 힘차게 출발했지만, 너무 오랫동안 달리지 않았기 때문에 그의 힘은 빠르게 사라졌다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> started strong, but은 초반에는 의욕 넘치게 나아갔지만, 긴 공백기와 부상 후유증 탓에 체력이 금세 바닥나 버리는 현실의 뼈저린 한계를 묘사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">hadn&#39;t run (과거완료): had + p.p. 형태의 부정문으로, 기준 과거 시점(faded) 이전부터 오랫동안 달리지 못했던 상태를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fade<\/td><td class=\"m\">희미해지다, 서서히 사라지다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 18 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Every step was a struggle,<\/b><\/span><span class=\"ko\">매 걸음이 힘든 일이었지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but he pushed forward,<\/b><\/span><span class=\"ko\">그는 앞으로 나아갔다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">encouraged<\/span> by the thought<\/b><\/span><span class=\"ko\">생각에 힘을 얻어<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">of how happy Sam would be<\/span>.<\/b><\/span><span class=\"ko\">Sam이 얼마나 기쁠까라는<\/span><\/div><\/div><div class=\"lec-sent-ko\">매 걸음이 힘든 일이었지만 그는 Sam이 얼마나 기쁠까라는 생각에 힘을 얻어 앞으로 나아갔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> encouraged by the thought of는 매 걸음을 떼는 것조차 고통스러운 한계 상황에 부딪혔음에도, 오직 샘의 미소를 떠올리는 굳건한 정신력으로 육체의 한계를 버텨내고 있음을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">encouraged (분사구문): 부사적 기능으로 쓰인 과거분사 구문이다. 원래 절인 as he was encouraged by... 에서 접속사와 주어가 생략되고 be동사가 being으로 바뀐 후 생략되어 과거분사만 남은 구조다.<\/div><div class=\"lec-gr-item\">of how happy Sam would be (간접의문문): 전치사 of의 목적어 자리에 쓰인 명사절이다. 의문사(how) + 형용사(happy) + 주어(Sam) + 동사(would be) 어순으로 구성되었다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">struggle<\/td><td class=\"m\">고군분투, 힘든 일<\/td><\/tr><tr><td class=\"w\">push forward<\/td><td class=\"m\">앞으로 나아가다, 계속 밀고 나아가다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 19 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Finally,<\/b><\/span><span class=\"ko\">마침내,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>he <span class=\"grammar-hl\">crossed<\/span> the finish line.<\/b><\/span><span class=\"ko\">그는 결승선을 넘었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">마침내 그는 결승선을 넘었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> crossed the finish line은 극심한 육체적 고통을 이겨내고 자신이 목표했던 3마일 코스를 끝까지 달려내어 완주에 성공했음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">crossed 일반동사 과거형: 타동사 cross의 과거 시제 형태로 뒤에 목적어 the finish line을 취했다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 20 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>As he <span class=\"grammar-hl\">was sitting<\/span><\/b><\/span><span class=\"ko\">그가 앉아 있었을 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to catch<\/span> his breath,<\/b><\/span><span class=\"ko\">자신의 숨을 고르기 위해,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>Sam came over<\/b><\/span><span class=\"ko\">Sam이 다가와<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">handed him bottled water<\/span>.<\/b><\/span><span class=\"ko\">그에게 병에 든 물을 건네주었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">자신의 숨을 고르기 위해 그가 앉아 있었을 때, Sam이 다가와 그에게 병에 든 물을 건네주었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> to catch his breath는 완주 후 기진맥진하여 가쁜 숨을 몰아쉬는 제이슨의 상태와, 그를 위해 다가와 따뜻하게 보답하는 샘의 교감이 아름답게 그려지는 장면입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was sitting (과거진행): be동사 과거형(was)과 일반동사의 -ing형태(sitting)가 결합하여 과거 특정 시점의 진행 중인 동작을 나타낸다.<\/div><div class=\"lec-gr-item\">to catch (to부정사(부사적): 목적): in order to catch로 바꿔도 뜻이 같으며, &#39;~하기 위해&#39;라는 목적을 나타낸다.<\/div><div class=\"lec-gr-item\">handed him bottled water 4형식(SVOO) 구조: 수여동사 handed 뒤에 간접목적어(him)와 직접목적어(bottled water)가 순서대로 온 구조다.<\/div><div class=\"lec-gr-item\">bottled (과거분사(형용사적)): bottled가 명사 water를 수식(= &#39;병에 든 물&#39;). water that is/was bottled의 축약된 의미를 지닌다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">catch one&#39;s breath<\/td><td class=\"m\">숨을 고르다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 21 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He <span class=\"grammar-hl\">felt<\/span> pride, relief, and gratitude.<\/b><\/span><span class=\"ko\">그는 자부심, 안도감, 그리고 감사함을 느꼈다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 자부심, 안도감, 그리고 감사함을 느꼈다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> felt pride, relief, and gratitude는 포기하지 않고 끝마쳤다는 긍지, 무릎이 덧나지 않고 무사히 끝냈다는 다행스러움, 그리고 이 벅찬 순간을 만들어 준 샘에 대한 고마움이 뒤섞인 깊은 감정을 표현합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">felt 일반동사 과거형: feel의 불규칙 과거형으로, 뒤에 명사가 목적어로 이어지는 3형식 구조다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 22 / 22<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>He finally <span class=\"grammar-hl\">finished<\/span> ―<\/b><\/span><span class=\"ko\">그는 마침내 완주했다 ―<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for Sam.<\/b><\/span><span class=\"ko\">Sam을 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그는 마침내 Sam을 위해 완주했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> finally finished는 오랜 공백과 부상이라는 거대한 장애물을 넘어오직 사랑하는 이웃집 동생을 위해 달리겠다는 숭고한 목표를 끝내 이루어 낸 훈훈한 결말을 맺어 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">finished 일반동사 과거형: 주어가 동작을 마쳤다는 사실을 나타내는 자동사로 쓰였다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>제이슨은 과거 뛰어난 달리기 선수였으나 무릎 부상으로 오랫동안 달리지 못하고 있었다.<\/li><li>어느 날, 그가 아끼는 이웃집 동생 샘을 위한 심장병 자선 마라톤 현수막을 보고 참가를 결심한다.<\/li><li>철저한 재활 끝에 의사의 허락을 받고 초보자 코스에 나서지만, 긴 공백 탓에 마라톤 도중 극심한 체력적 한계에 부딪힌다.<\/li><li>하지만 응원하는 샘의 모습을 떠올리며 고통을 이겨내고, 마침내 무사히 완주하여 벅찬 감동을 누린다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Jason struggles to run due to a past knee injury, but he successfully finishes the charity marathon to support his sick neighbor.<\/div>\n              <div class=\"lec-final-sum-ko\">제이슨은 과거의 무릎 부상으로 인해 달리는 데 어려움을 겪지만, 아픈 이웃을 응원하기 위해 자선 마라톤을 성공적으로 완주한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./43_audio/1.mp3","hl":null}],[{"audio":"./43_audio/2.mp3","hl":null}],[{"audio":"./43_audio/3.mp3","hl":null},{"audio":"./43_audio/4.mp3","hl":"stage-0"},{"audio":"./43_audio/5.mp3","hl":"stage-1"},{"audio":"./43_audio/6.mp3","hl":"stage-2"},{"audio":"./43_audio/7.mp3","hl":"stage-3"}],[{"audio":"./43_audio/8.mp3","hl":null}],[{"audio":"./43_audio/9.mp3","hl":"main"},{"audio":"./43_audio/10.mp3","hl":"meaning"},{"audio":"./43_audio/11.mp3","hl":"grammar"}],[{"audio":"./43_audio/12.mp3","hl":"main"},{"audio":"./43_audio/13.mp3","hl":"meaning"},{"au otivation)와 역경을 딛고 일어서는 회복탄력성 (Resilience)이라는 심리학적 개념을 미리 알아두시면 좋습니다. 마치 우리가 사랑하는 가족이 아프거나 무거운 짐을 든 이웃을 볼 때 평소에는 없던 초인적인 힘을 발휘하는 것처럼, 인간은 누군가를 진심으로 위할 때 자신의 신체적 한계를 뛰어넘는 놀라운 에너지를 얻게 됩니다. 지문의 배경이 되는 자선 마라톤 (Charity Marathon) 역시 단순히 개인의 기록 단축을 위해 달리는 것이 아니라, 특정 질환을 앓는 환자를 돕고 대중의 인식을 높이기 위해 후원금을 모으는 대표적인 나눔의 실천 방식이지요. 신체적 부상이라는 깊은 좌절을 겪었던 사람이 이러한 이타적인 목표를 통해 어떻게 고통을 이겨내고 다시 달리게 되는지에 대한 심리적 메커니즘을 염두에 두고 읽어보시면, 주인공이 겪는 감정선이 훨씬 더 생생하고 감동적으로 와닿을 거예요.","ttsText":"이 글을 더 깊이 이해하기 위해서는 타인을 돕고자 하는 친사회적 동기 (Prosocial Motivation)와 역경을 딛고 일어서는 회복탄력성 (Resilience)이라는 심리학적 개념을 미리 알아두시면 좋습니다. 마치 우리가 사랑하는 가족이 아프거나 무거운 짐을 든 이웃을 볼 때 평소에는 없던 초인적인 힘을 발휘하는 것처럼, 인간은 누군가를 진심으로 위할 때 자신의 신체적 한계를 뛰어넘는 놀라운 에너지를 얻게 됩니다. 지문의 배경이 되는 자선 마라톤 (Charity Marathon) 역시 단순히 개인의 기록 단축을 위해 달리는 것이 아니라, 특정 질환을 앓는 환자를 돕고 대중의 인식을 높이기 위해 후원금을 모으는 대표적인 나눔의 실천 방식이지요. 신체적 부상이라는 깊은 좌절을 겪었던 사람이 이러한 이타적인 목표를 통해 어떻게 고통을 이겨내고 다시 달리게 되는지에 대한 심리적 메커니즘을 염두에 두고 읽어보시면, 주인공이 겪는 감정선이 훨씬 더 생생하고 감동적으로 와닿을 거예요.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 43-45번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 43-45번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고2 / 2025년 / 10월 / 43-45번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고2 / 2025년 / 10월 / 43-45번","titleEn":"Running for Sam: Overcoming an Injury with a Warm Heart","titleKo":"샘을 위한 달리기: 따뜻한 마음으로 이뤄낸 부상 극복","imageUrl":"__enpImg__","stages":[{"label":"01도입 및 동기 발견","items":["제이슨은 희귀 심장병을 앓는 이웃 동생 샘을 위한 자선 마라톤 현수막을 보게 된다.","희귀 심장병(rare heart condition)을 앓는 7살 소년 샘","제이슨이 여름 방학마다 돌보던 친근한 이웃","자선 마라톤(charity marathon) 현수막을 보고 개인적인 사명감을 느낌"]},{"label":"02과거의 시련과 참가 결심","items":["제이슨은 무릎 부상으로 달리기를 쉬고 있었지만 샘을 위해 마라톤 참가를 다짐한다.","과거 학교에서 가장 빠른 달리기 선수(The Speedster)로 불림","무릎 부상(knee injury)으로 인해 오랫동안 달리지 못한 상태","마라톤이 상징하는 희망(hope)을 떠올리며 참가를 결심함"]},{"label":"03준비 과정과 대회 당일","items":["의사의 허락을 받아 코스에 등록하고, 대회 당일 샘의 응원을 받으며 동기부여를 얻는다.","회복에 집중한 뒤 3마일 초보자 코스(beginner route)에 등록","마라톤 당일 응원 팻말(sign)을 들고 있는 샘을 군중 속에서 발견함","샘의 미소가 제이슨에게 완벽한 동기부여(motivation)가
