<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 43~45번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp-chunk+.lp-chunk{padding-left:10px;border-left:2px solid #D6EAE9}
.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

.lp-qn{display:grid;place-items:center;text-align:center;overflow:hidden;word-break:keep-all}

.lp-lb{background:none;border:0;border-bottom:2px solid var(--am);border-radius:0;padding:0 2px;color:var(--pk-t);font-weight:700}

@media (max-width:700px){.lp-qn{flex:0 0 72px;height:72px;font-size:18px}}
</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 43~45번","audioDir":"43_audio","preview":false,"count":79,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.707em\">43~45번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>A Race of Heart: Running for Sam's Hope\u003c/h1>\u003ch2>마음으로 달리는 경주: Sam의 희망을 향한 질주\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>요약: \u003cb class=\"key\">무릎 \u003c/b>\u003cb class=\"key\">부상\u003c/b>을 겪었던 Jason이 옆집 소년 Sam을 돕기 위한 \u003cb class=\"key\">자선 \u003c/b>\u003cb class=\"key\">마라톤\u003c/b>에 참여하여 신체적 한계를 극복하고 \u003cb class=\"key\">완주\u003c/b>하는 감동적인 이야기입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Jason overcomes his physical limitation and completes a charity marathon to support a neighbor boy with a heart condition.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 따뜻한 감동이 담긴 이야기 한 편을 함께 읽어볼 거예요. 바로 이천이십오년 십월 고등학교 이학년 모의고사에 출제된 지문입니다. 부상을 딛고 누군가를 위해 달리는 한 소년의 이야기를 통해, 진정한 동기 부여가 무엇인지 생각해보는 시간을 갖겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">미국의 \u003cb class=\"key\">자선 \u003c/b>\u003cb class=\"key\">마라톤\u003c/b>(Charity Marathon) 문화는 특정 질병을 앓는 환자나 소외 계층을 위해 기금을 모으는 행사로 흔히 열립니다. 이 지문에서는 \u003cb class=\"key\">희귀 \u003c/b>\u003cb class=\"key\">심장 \u003c/b>\u003cb class=\"key\">질환\u003c/b>(Rare Heart Condition)을 앓는 Sam을 돕기 위한 행사가 배경입니다. 부상을 입은 운동선수가 역경을 딛고 일어서는 서사는 고등 영어 독해에서 자주 등장하는 \u003cb class=\"key\">극복 \u003c/b>\u003cb class=\"key\">서사\u003c/b>(Overcoming Narrative)의 전형입니다. 마치 축구 선수가 큰 부상 후에 복귀전을 치르는 것처럼, Jason에게 이 경주는 단순한 운동이 아닌 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">치유\u003c/b>와 연대의 과정입니다.\u003c/div>","segs":[{"n":2,"text":"혹시 여러분은 누군가를 돕기 위해 무언가에 도전해 본 적이 있나요? 미국에서는 특정 질병을 앓는 사람들을 지원하기 위해 자선 마라톤, 즉 Charity Marathon을 정말 자주 열어요. 오늘 지문에 나오는 Sam도 희귀 심장 질환을 앓고 있는 어린 소년인데요. 주인공 Jason이 이 소년을 위해 자신의 신체적 한계인 무릎 부상을 극복해가는 과정이 핵심입니다. 스포츠 영화에서 부상당한 선수가 복귀하는 극복 서사를 상상하며 읽으면 훨씬 이해가 잘 될 거예요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>동기 형성\u003csmall>도입 · 문장 1–6\u003c/small>\u003c/h4>\u003cp>Jason은 학교 체육관에서 \u003cb class=\"key\">자선 \u003c/b>\u003cb class=\"key\">마라톤\u003c/b> 현수막을 발견합니다. 주인공은 현수막에 적힌 Sam이 자신이 예전에 돌보던 \u003cb class=\"key\">옆집 \u003c/b>\u003cb class=\"key\">소년\u003c/b>임을 깨닫고 정서적 연결을 느낍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>내적 갈등과 결심\u003csmall>전환 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>한때 우수한 달리기 선수였으나 \u003cb class=\"key\">무릎 \u003c/b>\u003cb class=\"key\">부상\u003c/b>으로 오래 뛰지 못했던 Jason은 고민에 빠집니다. 하지만 Sam에게 전할 \u003cb class=\"key\">희망\u003c/b>을 떠올리며 마침내 도전을 결심합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>준비와 등록\u003csmall>전개 · 문장 10–12\u003c/small>\u003c/h4>\u003cp>의사의 조언에 따라 \u003cb class=\"key\">회복\u003c/b>에 전념한 Jason은 마감 직전 허락을 받습니다. 그는 Sam을 위해 3마일 \u003cb class=\"key\">초보자 \u003c/b>\u003cb class=\"key\">코스\u003c/b>에 정식으로 등록합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>마라톤의 시련\u003csmall>사건 · 문장 13–18\u003c/small>\u003c/h4>\u003cp>경주 당일, Sam의 응원을 받은 Jason은 힘차게 출발하지만 곧 \u003cb class=\"key\">체력 \u003c/b>\u003cb class=\"key\">저하\u003c/b>로 고통을 겪습니다. 매 걸음이 힘겨운 싸움이었지만 Sam을 생각하며 \u003cb class=\"key\">한계\u003c/b>를 밀어붙입니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>완주와 감동\u003csmall>결론 · 문장 19–22\u003c/small>\u003c/h4>\u003cp>마침내 \u003cb class=\"key\">결승선\u003c/b>을 넘은 Jason은 Sam이 건네준 물을 마시며 깊은 보람을 느낍니다. 그는 자신을 위한 경기가 아닌 \u003cb class=\"key\">타인을 \u003c/b>\u003cb class=\"key\">위한\u003c/b> 완주를 성공적으로 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 Jason이 마라톤 현수막을 보는 것부터 시작해서 실제 경주를 마치기까지의 과정을 시간 순서대로 보여줍니다.","hl":null},{"n":4,"text":"첫 번째 단계는 도입부예요. Jason이 체육관 벽에서 자선 마라톤 현수막을 발견하고, 그 대상인 Sam이 자신이 돌보던 옆집 아이라는 것을 알게 되는 장면입니다. 지문에서 Sam의 이름을 본 것이 모든 것을 개인적으로 느껴지게 했다는 표현이 나오죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 Jason의 내적 갈등이 나타납니다. 그는 학교에서 가장 빠른 주자였지만 무릎 부상 때문에 오랫동안 뛰지 못했어요. 하지만 Sam에게 희망을 주고 싶다는 마음에 도전을 결심하게 됩니다.","hl":"f1"},{"n":6,"text":"세 번째 단계는 준비 과정입니다. 의사의 조언을 충실히 따르며 회복에 힘썼고, 결국 마감 직전에 3마일 코스에 등록하게 됩니다. 여기서 의사가 3마일 정도는 괜찮다고 말해준 것이 결정적인 계기가 되었네요.","hl":"f2"},{"n":7,"text":"네 번째 단계는 대망의 마라톤 당일입니다. 초반에는 힘차게 나갔지만 체력이 금방 바닥나고 말아요. 하지만 매 걸음이 고통스러운 순간에도 Sam의 미소를 생각하며 끝까지 포기하지 않고 발을 내딛습니다.","hl":"f3"},{"n":8,"text":"마지막 단계는 완주와 결말입니다. 결승선을 통과한 Jason에게 Sam이 다가와 물을 건네줍니다. Jason은 단순한 피로가 아니라 자부심과 안도감, 그리고 깊은 감사함을 느끼며 이야기를 마무리합니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 22번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 Jason이 마라톤 계획을 보고, 준비하고, 실행하는 과정을 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 전개합니다. 주인공이 신체적 고통을 이겨내는 \u003cb class=\"key\">극복 \u003c/b>\u003cb class=\"key\">과정\u003c/b>이 묘사되며, 마지막에 완주의 의미를 강조하는 \u003cb class=\"key\">감동적 \u003c/b>\u003cb class=\"key\">결말\u003c/b>로 이어집니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But since (8)\u003c/b>\u003cspan>과거 실력과 현재 부상 상태의 대조\u003c/span>\u003cb>Still (9)\u003c/b>\u003cspan>역경에도 불구하고 결심하는 전환점\u003c/span>\u003cb>Finally (19)\u003c/b>\u003cspan>사건의 마무리 단계 암시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">The Speedster\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">knee injury\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">recover\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">3-mile run\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">pushed forward\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">finished\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 지문의 전개 방식은 전형적인 시간 순서에 따른 구성입니다. 주인공이 처한 상황과 과거의 제약 조건이 먼저 제시되고, 이를 극복해 나가는 과정이 순차적으로 그려지고 있죠. 결말 부분에 주인공의 감정이 집중적으로 나타나는 미괄식 구조라고 볼 수 있습니다.","hl":"ty"},{"n":10,"text":"글의 흐름을 바꿔주는 신호어들에 주목해 보세요. 여덟 번째 문장의 But since는 주인공의 과거 실력과 현재의 부상 상태를 대조해 줍니다. 아홉 번째 문장의 Still은 그런 어려움에도 불구하고 마음을 다잡는 전환점이 되죠. 그리고 열아홉 번째 문장의 Finally는 고난 끝에 마침내 목표를 달성했음을 알려주는 중요한 신호입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>banner\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현수막\u003c/span>\u003c/div>\u003cdiv>\u003cb>annual\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>연례의\u003c/span>\u003c/div>\u003cdiv>\u003cb>charity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자선\u003c/span>\u003c/div>\u003cdiv>\u003cb>stir\u003c/b>\u003cem>동사\u003c/em>\u003cspan>요동치게 하다, 휘젓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rare\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>희귀한\u003c/span>\u003c/div>\u003cdiv>\u003cb>condition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>질환, 상태\u003c/span>\u003c/div>\u003cdiv>\u003cb>babysit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>아이를 돌보다\u003c/span>\u003c/div>\u003cdiv>\u003cb>chase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>쫓아다니다\u003c/span>\u003c/div>\u003cdiv>\u003cb>personal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>개인적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>speedster\u003c/b>\u003cem>명사\u003c/em>\u003cspan>빠르게 달리는 사람\u003c/span>\u003c/div>\u003cdiv>\u003cb>injury\u003c/b>\u003cem>명사\u003c/em>\u003cspan>부상\u003c/span>\u003c/div>\u003cdiv>\u003cb>represent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타내다, 상징하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recover\u003c/b>\u003cem>동사\u003c/em>\u003cspan>회복하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>registration\u003c/b>\u003cem>명사\u003c/em>\u003cspan>등록\u003c/span>\u003c/div>\u003cdiv>\u003cb>deadline\u003c/b>\u003cem>명사\u003c/em>\u003cspan>마감 기한\u003c/span>\u003c/div>\u003cdiv>\u003cb>pounding\u003c/b>\u003cem>동사\u003c/em>\u003cspan>쿵쿵 뛰는\u003c/span>\u003c/div>\u003cdiv>\u003cb>motivation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동기\u003c/span>\u003c/div>\u003cdiv>\u003cb>whistle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>호각, 휘슬\u003c/span>\u003c/div>\u003cdiv>\u003cb>fade\u003c/b>\u003cem>동사\u003c/em>\u003cspan>사라지다, 약해지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>struggle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>힘든 일, 고군분투\u003c/span>\u003c/div>\u003cdiv>\u003cb>encourage\u003c/b>\u003cem>동사\u003c/em>\u003cspan>격려하다, 힘을 북돋우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>catch one's breath\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>숨을 고르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pride\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자부심\u003c/span>\u003c/div>\u003cdiv>\u003cb>relief\u003c/b>\u003cem>명사\u003c/em>\u003cspan>안도감\u003c/span>\u003c/div>\u003cdiv>\u003cb>gratitude\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감사\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"여기서 중요한 단어 몇 가지만 짚어볼게요. 질환이나 상태를 뜻하는 condition, 그리고 등록 마감일을 의미하는 registration deadline은 고등 영어에서 자주 쓰이는 표현입니다. 또 Jason의 감정을 나타내는 relief와 gratitude는 마지막에 주인공의 심경 변화를 묻는 문제에서 자주 출제되는 핵심 어휘니 꼭 기억해 두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">rare\u003c/b>\u003cspan class=\"m\">희귀한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">uncommon\u003c/span>\u003cspan class=\"s\">scarce\u003c/span>\u003cspan class=\"s\">unusual\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">ordinary\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">cheerful\u003c/b>\u003cspan class=\"m\">명랑한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">joyful\u003c/span>\u003cspan class=\"s\">bright\u003c/span>\u003cspan class=\"s\">upbeat\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">gloomy\u003c/span>\u003cspan class=\"a\">depressed\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">motivation\u003c/b>\u003cspan class=\"m\">동기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">incentive\u003c/span>\u003cspan class=\"s\">inspiration\u003c/span>\u003cspan class=\"s\">drive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discouragement\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fade\u003c/b>\u003cspan class=\"m\">약해지다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">diminish\u003c/span>\u003cspan class=\"s\">wane\u003c/span>\u003cspan class=\"s\">decline\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">increase\u003c/span>\u003cspan class=\"a\">flourish\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gratitude\u003c/b>\u003cspan class=\"m\">감사\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">appreciation\u003c/span>\u003cspan class=\"s\">thankfulness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ungratefulness\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 볼까요? 희귀한이라는 뜻의 rare는 uncommon이나 scarce와 바꿔 쓸 수 있지만, 반대말은 흔한이라는 뜻의 common입니다. 동기라는 뜻의 motivation은 영감을 주는 inspiration과 비슷하고, 약해지다라는 뜻의 fade는 사라지다인 vanish나 감소하다인 wane과 비슷한 맥락에서 쓰일 수 있습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jason은 응시했다\u003c/span>\u003cspan class=\"en\">Jason \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stared \u003c/span>\u003cspan class=\"tgt\">at\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고등학교 체육관 벽에 걸린 현수막을\u003c/span>\u003cspan class=\"en\">the banner \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">across \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">high \u003c/span>\u003cspan class=\"tgt\">school \u003c/span>\u003cspan class=\"tgt\">gym \u003c/span>\u003cspan class=\"tgt\">wall\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘연간 자선 마라톤 ― Sam을 위해 달리세요’라고 쓰인\u003c/span>\u003cspan class=\"en\">&quot;Annual Charity Marathon ― Run for Sam.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Jason은 고등학교 체육관 벽에 걸린 ‘연간 자선 마라톤 ― Sam을 위해 달리세요’라고 쓰인 현수막을 응시했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이야기의 배경을 설정하는 문장으로, Jason이 Sam을 돕기 위한 마라톤 행사를 발견하며 \u003cb class=\"key\">동기 \u003c/b>\u003cb class=\"key\">부여\u003c/b>의 시작점을 보여줍니다. 현수막의 구체적인 문구인 'Run for Sam'은 작품 전체를 관통하는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b>를 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(자동사+전치사)\u003c/span> : stare [자동사] + at [전치사] + 목적어 : \"~을 응시했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 형용사적 용법\u003c/span> : the banner [명사] + across [전치사] ~ wall [전치사구] : \"체육관 벽에 걸린 현수막\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Jason stared at, Jason은 응시했다. the banner across the high school gym wall, 고등학교 체육관 벽에 걸린 현수막을. \"Annual Charity Marathon ― Run for Sam.\", ‘연간 자선 마라톤 ― Sam을 위해 달리세요’라고 쓰인. 이 문장 전체를 해석하면, Jason은 고등학교 체육관 벽에 걸린 ‘연간 자선 마라톤 ― Sam을 위해 달리세요’라고 쓰인 현수막을 응시했다.","hl":"m"},{"n":14,"text":"이 문장은 주인공 Jason이 Sam을 돕기 위한 행사를 처음 발견하는 장면이에요. 현수막에 적힌 문구는 Jason에게 동기 부여가 되는 아주 중요한 핵심 주제를 담고 있죠.","hl":"mn"},{"n":15,"text":"첫 번째로 stare at 표현을 보세요. stare는 자동사라서 뒤에 전치사 at이 있어야만 목적어를 데려올 수 있어요. 두 번째로 across로 시작하는 전치사구가 앞에 있는 명사 banner를 꾸며주어 현수막이 어디에 있는지 위치를 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 슬로건이\u003c/span>\u003cspan class=\"en\">The slogan\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 마음을 요동치게 했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">stirred\u003c/span> something in him.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 슬로건이 그의 마음을 요동치게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마라톤의 구호가 Jason의 내면에 강한 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>을 일으켰음을 나타냅니다. 이는 Jason이 마라톤에 참여하게 되는 결정적인 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">계기\u003c/b>가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">타동사의 과거형\u003c/span> : subject [The slogan] + stirred [동사(과거형)] + object [something] : \"요동치게 했다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"The slogan, 그 슬로건이. stirred something in him, 그의 마음을 요동치게 했다. 이 문장 전체를 해석하면, 그 슬로건이 그의 마음을 요동치게 했다.","hl":"m"},{"n":17,"text":"현수막에서 본 문구가 Jason의 마음을 강하게 흔들었다는 뜻이에요. 단순히 읽고 지나친 게 아니라 감정적인 변화를 느꼈음을 보여주죠.","hl":"mn"},{"n":18,"text":"여기서 동사 stirred는 원래 휘젓다는 뜻이지만, 마음이나 감정을 목적어로 취해서 마음을 뒤흔들다라는 비유적인 의미로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Sam은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Sam, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명랑한 일곱 살 아이인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">cheerful \u003c/span>\u003cspan class=\"tgt\">seven­year­old\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그림 그리기를 좋아하고 화가가 되기를 꿈꿨던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">loved \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">draw \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">dreamed \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> being an artist,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">희귀 심장 질환을 가지고 있었다\u003c/span>\u003cspan class=\"en\">had a rare heart condition.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그림 그리기를 좋아하고 화가가 되기를 꿈꿨던 명랑한 일곱 살 아이인 Sam은 희귀 심장 질환을 가지고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Sam의 밝은 성격과 꿈을 언급한 뒤 심장병을 앓고 있다는 사실을 대조시켜, 독자에게 \u003cb class=\"key\">안타까움\u003c/b>을 유발합니다. 이러한 \u003cb class=\"key\">인물 \u003c/b>\u003cb class=\"key\">묘사\u003c/b>를 통해 Jason이 달리고자 하는 이유를 더 설득력 있게 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 콤마\u003c/span> : Sam [명사1] + , [동격] + a cheerful seven­year­old [명사구2] : \"명랑한 일곱 살 아이인 Sam\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 한정적 용법 및 병렬 구조\u003c/span> : seven­year­old [선행사] + who [주격 관계대명사] + V1 [loved] + and + V2 [dreamed] : \"좋아하고 꿈꿨던\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"Sam, Sam은. a cheerful seven­year­old, 명랑한 일곱 살 아이인. who loved to draw and dreamed of being an artist, 그림 그리기를 좋아하고 화가가 되기를 꿈꿨던. had a rare heart condition, 희귀 심장 질환을 가지고 있었다. 이 문장 전체를 해석하면, 그림 그리기를 좋아하고 화가가 되기를 꿈꿨던 명랑한 일곱 살 아이인 Sam은 희귀 심장 질환을 가지고 있었다.","hl":"m"},{"n":20,"text":"밝고 꿈 많은 일곱 살 아이 Sam이 사실은 심장이 아픈 상태라는 걸 설명하고 있어요. 이런 대조적인 상황이 Jason의 마음을 움직이게 한 거죠.","hl":"mn"},{"n":21,"text":"첫 번째로 Sam 뒤의 콤마는 동격을 나타내서 샘이 일곱 살 아이라는 걸 설명해요. 두 번째로 관계대명사 who 뒤를 보면 loved와 dreamed라는 과거형 동사가 and로 연결된 병렬 구조를 확인할 수 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Sam은 그저 아무나가 아니었다\u003c/span>\u003cspan class=\"en\">Sam wasn't just anyone\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">— 그는 어린 소년이었다\u003c/span>\u003cspan class=\"en\">— he was the little boy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">옆집에 사는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">living\u003c/span> next door\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jason이 돌보았던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> Jason \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">babysat\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여름 방학마다.\u003c/span>\u003cspan class=\"en\">every summer break.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Sam은 그저 아무나가 아니었다. 그는 Jason이 여름 방학마다 돌보았던 옆집에 사는 어린 소년이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Sam이 Jason에게 단순한 이웃 이상의 특별하고 소중한 존재라는 \u003cb class=\"key\">유대감\u003c/b>을 강조합니다. Jason이 이 마라톤에 참여하게 되는 핵심적인 \u003cb class=\"key\">동기 \u003c/b>\u003cb class=\"key\">부여\u003c/b>가 되는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 후치 수식\u003c/span> : the little boy [명사] + living [현재분사구] : \"사는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사\u003c/span> : the little boy [선행사] + that [관계사] + Jason had babysat [S+V] : \"Jason이 ~했던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거완료\u003c/span> : had + p.p. (past participle) : \"돌보았었다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Sam wasn't just anyone, Sam은 그저 아무나가 아니었다. — he was the little boy, — 그는 어린 소년이었다. living next door, 옆집에 사는. that Jason had babysat, Jason이 돌보았던. every summer break, 여름 방학마다.. 이 문장 전체를 해석하면, Sam은 그저 아무나가 아니었다. 그는 Jason이 여름 방학마다 돌보았던 옆집에 사는 어린 소년이었다.","hl":"m"},{"n":23,"text":"Sam이 Jason에게 얼마나 특별한 존재인지를 보여주는 대목이에요. 단순한 이웃 아이가 아니라 매 여름 정성껏 돌보며 쌓아온 소중한 유대감이 잘 드러나 있죠. 이런 깊은 관계가 Jason을 움직이는 강력한 동기 부여가 됩니다.","hl":"mn"},{"n":24,"text":"세 가지 포인트를 볼게요. 첫 번째 living은 능동의 의미로 소년을 수식하는 현재분사예요. 두 번째 that은 목적격 관계대명사로 Jason이 돌봤던 소년임을 연결해주죠. 세 번째 had babysat은 과거 시점보다 더 앞선 일을 말하는 과거완료 시제입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 공원에서 놀았었다\u003c/span>\u003cspan class=\"en\">He had played in the park\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 여름 오후를 보냈었다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">spent \u003c/span>\u003cspan class=\"tgt\">summer \u003c/span>\u003cspan class=\"tgt\">afternoons \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아이스크림 트럭을 쫓아다니며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">chasing\u003c/span> ice cream trucks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Sam과 함께.\u003c/span>\u003cspan class=\"en\">with Sam.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그(Jason)는 Sam과 함께 공원에서 놀았었고 아이스크림 트럭을 쫓아다니며 여름 오후를 보냈었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Jason과 Sam이 공유했던 즐거운 \u003cb class=\"key\">과거의 \u003c/b>\u003cb class=\"key\">기억\u003c/b>을 구체적으로 묘사합니다. \u003cb class=\"key\">친밀한 \u003c/b>\u003cb class=\"key\">추억\u003c/b>을 통해 독자가 Jason의 감정에 더 몰입하게 만듭니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">spend + 시간 + v-ing\u003c/span> : spend [동사] + summer afternoons [시간/목적어] + chasing [현재분사] : \"쫓아다니며 여름 오후를 보내다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">과거완료의 병렬 구조\u003c/span> : had + [played (p.p. 1)] + and + [spent (p.p. 2)] : \"놀았었고 보냈었다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"He had played in the park, 그는 공원에서 놀았었다. and spent summer afternoons, 그리고 여름 오후를 보냈었다. chasing ice cream trucks, 아이스크림 트럭을 쫓아다니며. with Sam, Sam과 함께.. 이 문장 전체를 해석하면, 그(Jason)는 Sam과 함께 공원에서 놀았었고 아이스크림 트럭을 쫓아다니며 여름 오후를 보냈었다.","hl":"m"},{"n":26,"text":"두 사람이 함께 보낸 구체적인 과거의 장면들이에요. 아이스크림 트럭을 쫓던 순수한 추억은 이들의 친밀한 추억을 시각적으로 잘 보여줍니다. Jason의 마음속에 남아있는 따뜻한 기억들이죠.","hl":"mn"},{"n":27,"text":"첫 번째로 had played와 spent가 and를 사이에 두고 병렬 구조를 이루며 과거완료 시제를 완성하고 있어요. 두 번째는 spend 시간 v-ing 구문인데, summer afternoons라는 시간 뒤에 chasing이라는 현재분사가 오는 형태를 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Sam의 이름을 보는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Seeing\u003c/span> Sam's name\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">현수막에 적힌\u003c/span>\u003cspan class=\"en\">on the banner\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 것을 만들었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">made \u003c/span>\u003cspan class=\"tgt\">everything \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개인적으로 느껴지게.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">feel\u003c/span> personal.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">현수막에 적힌 Sam의 이름을 보는 것이 모든 것을 개인적으로 느껴지게 했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 마라톤이 단순한 봉사 활동이 아니라 자신과 직결된 \u003cb class=\"key\">개인적인 \u003c/b>\u003cb class=\"key\">사건\u003c/b>이 되었음을 깨닫는 순간입니다. \u003cb class=\"key\">심경 \u003c/b>\u003cb class=\"key\">변화\u003c/b>의 결정적인 계기를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : Seeing [동명사/주어] + made [동사] : \"보는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">사역동사의 목적격 보어\u003c/span> : made [사역동사] + everything [목적어] + feel [원형부정사/보어] : \"모든 것이 느껴지게 만들었다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"Seeing Sam's name, Sam의 이름을 보는 것이. on the banner, 현수막에 적힌. made everything, 모든 것을 만들었다. feel personal, 개인적으로 느껴지게.. 이 문장 전체를 해석하면, 현수막에 적힌 Sam의 이름을 보는 것이 모든 것을 개인적으로 느껴지게 했다.","hl":"m"},{"n":29,"text":"막연했던 자선 행사가 Sam의 이름을 보는 순간 Jason에게 아주 특별하고 개인적인 사건으로 변하게 됩니다. 이 일에 전력을 다하게 될 것이라는 복선이 깔리는 중요한 장면이에요.","hl":"mn"},{"n":30,"text":"첫 번째로 문장 맨 앞에 나온 Seeing은 주어로 쓰인 동명사예요. 두 번째 포인트가 아주 중요한데, 사역동사 made 뒤에 목적어 everything이 오고 그 뒤에 보어로 동사원형인 feel이 쓰였다는 점을 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jason은 항상 ~였다 학교에서 가장 빠른 달리기 주자 그의 친구들 사이에서 알려진 ‘빠르게 달리는 아이’로\u003c/span>\u003cspan class=\"en\">Jason \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">always \u003c/span>\u003cspan class=\"tgt\">been\u003c/span> the fastest runner in school, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">known\u003c/span> among his friends as &quot;The Speedster.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Jason은 항상 학교에서 가장 빠른 달리기 주자였고, 그의 친구들 사이에서 ‘빠르게 달리는 아이’로 알려져 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> Jason이 과거에 가졌던 뛰어난 달리기 실력과 그에 따른 \u003cb class=\"key\">과거의 \u003c/b>\u003cb class=\"key\">명성\u003c/b>을 설명합니다. 이후 언급될 부상이라는 시련과 \u003cb class=\"key\">대조적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 이루기 위한 배경 정보입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료 (대과거/계속)\u003c/span> : had + p.p. (past participle) : \"항상 ~였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구 (후치 수식)\u003c/span> : noun + (which was) [known (p.p.)] + as ... : \"알려진\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Jason had always been, Jason은 항상 ~였다. the fastest runner in school, 학교에서 가장 빠른 달리기 주자. known among his friends, 그의 친구들 사이에서 알려진. as 'The Speedster.', ‘빠르게 달리는 아이’로. 이 문장 전체를 해석하면, Jason은 항상 학교에서 가장 빠른 달리기 주자였고, 그의 친구들 사이에서 ‘빠르게 달리는 아이’로 알려져 있었다.","hl":"m"},{"n":32,"text":"Jason이 과거부터 쭉 뛰어난 주자였음을 과거완료 시제로 보여줍니다. 친구들 사이에서 불렸던 별명을 언급해 그의 실력을 강조하고 있죠.","hl":"mn"},{"n":33,"text":"첫 번째 포인트인 had always been은 과거의 특정 시점까지 계속된 상태를 나타내는 과거완료 시제예요. 두 번째 known은 앞에 being이나 who was가 생략된 분사구문 형태로 앞에 나온 주자를 보충 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 그의 무릎 부상 이후\u003c/span>\u003cspan class=\"en\">But since his knee injury,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 달릴 수 없었다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hadn't \u003c/span>\u003cspan class=\"tgt\">been \u003c/span>\u003cspan class=\"tgt\">able \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">run\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">꽤 오랜 시간 동안\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">quite \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">long \u003c/span>\u003cspan class=\"tgt\">time\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 그의 무릎 부상 이후, 그는 꽤 오랜 시간 동안 달리지 못했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 실력이 좋았던 Jason이 처한 \u003cb class=\"key\">현재의 \u003c/b>\u003cb class=\"key\">한계\u003c/b>와 시련을 보여줍니다. 마라톤 참여 결정이 결코 쉽지 않은 \u003cb class=\"key\">결단\u003c/b>이었음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료 부정형 + 조동사 대용어\u003c/span> : had + not + been + [able to + v-root] : \"달릴 수 없었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">기간의 전치사\u003c/span> : for + [기간을 나타내는 명사구] : \"꽤 오랜 시간 동안\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"But since his knee injury, 하지만 그의 무릎 부상 이후. he hadn't been able to run, 그는 달릴 수 없었다. for quite a long time, 꽤 오랜 시간 동안. 이 문장 전체를 해석하면, 하지만 그의 무릎 부상 이후, 그는 꽤 오랜 시간 동안 달리지 못했다.","hl":"m"},{"n":35,"text":"무릎 부상이라는 부정적 상황이 지속되어 온 기간을 강조합니다. 실력이 좋았던 과거와 대조를 이루는 부분이죠.","hl":"mn"},{"n":36,"text":"첫 번째 had not been able to는 과거 시점보다 더 이전부터 그때까지 할 수 없었다는 부정형 과거완료예요. 두 번째 for는 숫자가 명확하지 않아도 꽤 긴 기간을 나타낼 때 쓰여요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그럼에도 불구하고 Jason이 Sam에 대해 생각했을 때\u003c/span>\u003cspan class=\"en\">Still, when Jason thought about Sam\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 이 마라톤이 나타내는 희망에 대해\u003c/span>\u003cspan class=\"en\">and the \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hope \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">marathon \u003c/span>\u003cspan class=\"tgt\">represented\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 자신이 도전해 봐야 한다는 것을 알았다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">knew \u003c/span>\u003cspan class=\"tgt\">he \u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">try\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그럼에도 불구하고 Jason이 Sam과 이 마라톤이 나타내는 희망에 대해 생각했을 때, 그는 자신(Jason)이 도전해 봐야 한다는 것을 알았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부상이라는 장애물에도 불구하고 Sam에 대한 \u003cb class=\"key\">사랑과 \u003c/b>\u003cb class=\"key\">연민\u003c/b>이 Jason을 움직였습니다. 이 감정이 강력한 \u003cb class=\"key\">동기 \u003c/b>\u003cb class=\"key\">부여\u003c/b>가 되었음을 보여주는 핵심 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">목적격 관계대명사의 생략\u003c/span> : the hope + [(which/that) + S + V] : \"이 마라톤이 나타내는 희망\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 that의 생략\u003c/span> : knew + [(that) + S + V] : \"도전해 봐야 한다는 것을 알았다\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"Still, when Jason thought about Sam, 그럼에도 불구하고 Jason이 Sam에 대해 생각했을 때. and the hope this marathon represented, 그리고 이 마라톤이 나타내는 희망에 대해. he knew he had to try, 그는 자신이 도전해 봐야 한다는 것을 알았다. 이 문장 전체를 해석하면, 그럼에도 불구하고 Jason이 Sam과 이 마라톤이 나타내는 희망에 대해 생각했을 때, 그는 자신(Jason)이 도전해 봐야 한다는 것을 알았다.","hl":"m"},{"n":38,"text":"육체적 고통보다 Sam을 향한 마음이 더 컸음을 보여주는 전환점인 문장입니다. 부상을 이겨내려는 Jason의 의지가 돋보입니다.","hl":"mn"},{"n":39,"text":"첫 번째 represented 앞에는 목적격 관계대명사가 생략되어 marathon이 어떤 희망인지 꾸며주고 있고요, 두 번째 knew 뒤에도 접속사 that이 생략되어 그가 깨달은 사실을 목적절로 이끌고 있습니다 존재가 가진 \u003cb class=\"key\">강력한 \u003c/b>\u003cb class=\"key\">동기\u003c/b> 부여 효과를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : 명사(motivation) + [p.p.(needed)] : \"필요한\"\u003c/div>\u003c/div>","segs":[{"n":58,"text":"He was, 그(Sam)는 ~였다. all the motivation needed, 필요한 동기의 전부. 이 문장 전체를 해석하면, 그(Sam)는 필요한 동기의 전부였다.","hl":"m"},{"n":59,"text":"Jason이 힘들 때 Sam을 보며 다시 힘을 내는 장면이에요. Sam이라는 존재 자체가 Jason에게는 끝까지 달려야 할 가장 큰 이유이자 강력한 동기였다는 것을 나타내고 있죠.","hl":"mn"},{"n":60,"text":"여기서 motivation 뒤에 쓰인 needed를 주의 깊게 보세요. 동기가 필요로 하는 것이 아니라 필요해지는 대상이기 때문에 과거분사를 써서 뒤에서 꾸며주고 있어요. 첫 번째 문법 포인트인 과거분사의 후치 수식 구조를 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호각이 울리자,\u003c/span>\u003cspan class=\"en\">When the whistle blew,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Jason은 힘차게 출발했지만,\u003c/span>\u003cspan class=\"en\">Jason started strong,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 오랫동안 달리지 않았기 때문에,\u003c/span>\u003cspan class=\"en\">but since he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">hadn't \u003c/span>\u003cspan class=\"tgt\">run\u003c/span> for so long,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 힘은 빠르게 사라졌다.\u003c/span>\u003cspan class=\"en\">his energy faded quickly.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">호각이 울리자 Jason은 힘차게 출발했지만, 너무 오랫동안 달리지 않았기 때문에 그의 힘은 빠르게 사라졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 부상 회복 후 첫 레이스에서 겪는 \u003cb class=\"key\">체력적 \u003c/b>\u003cb class=\"key\">한계\u003c/b>를 묘사하며, 의욕과는 다른 Jason의 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 대비시킵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료 시제\u003c/span> : had + [not] + [p.p.(run)] : \"달리지 않았었다\"\u003c/div>\u003c/div>","segs":[{"n":61,"text":"When the whistle blew, 호각이 울리자. Jason started strong, Jason은 힘차게 출발했지만. but since he hadn't run for so long, 너무 오랫동안 달리지 않았기 때문에. his energy faded quickly, 그의 힘은 빠르게 사라졌다.. 이 문장 전체를 해석하면, 호각이 울리자 Jason은 힘차게 출발했지만, 너무 오랫동안 달리지 않았기 때문에 그의 힘은 빠르게 사라졌다.","hl":"m"},{"n":62,"text":"의욕 넘치게 시작했지만, 무릎 부상으로 인해 오랫동안 쉬었던 공백이 체력적인 한계로 드러나는 안타까운 순간을 묘사하고 있습니다.","hl":"mn"},{"n":63,"text":"세 번째 조각에 쓰인 hadn't run을 주목해 보세요. 에너지가 고갈된 과거 시점보다 훨씬 이전부터 계속 달리지 못했던 상태를 말하기 때문에 대과거인 과거완료 시제를 사용했습니다. 시제의 선후 관계를 나타내는 아주 중요한 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매 걸음이 힘든 일이었지만,\u003c/span>\u003cspan class=\"en\">Every step was a struggle,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 앞으로 나아갔다,\u003c/span>\u003cspan class=\"en\">but he pushed forward,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각에 힘을 얻어\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">encouraged\u003c/span> by the thought\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Sam이 얼마나 기쁠까 하는\u003c/span>\u003cspan class=\"en\">of \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">how \u003c/span>\u003cspan class=\"tgt\">happy \u003c/span>\u003cspan class=\"tgt\">Sam \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">매 걸음이 힘든 일이었지만 그는 Sam이 얼마나 기쁠까 하는 생각에 힘을 얻어 앞으로 나아갔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신체적 고통을 이겨내는 Jason의 정신적인 \u003cb class=\"key\">의지\u003c/b>를 보여주며, 타인을 향한 \u003cb class=\"key\">이타심\u003c/b>이 주는 힘을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문 (수동)\u003c/span> : [, (Being) + p.p.(encouraged)] : \"힘을 얻어\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사(how + 형용사) + 주어(Sam) + 동사(would be) : \"Sam이 얼마나 기쁠지\"\u003c/div>\u003c/div>","segs":[{"n":64,"text":"Every step was a struggle, 매 걸음이 힘든 일이었지만. but he pushed forward, 그는 앞으로 나아갔다. encouraged by the thought, 생각에 힘을 얻어. of how happy Sam would be, Sam이 얼마나 기쁠까 하는. 이 문장 전체를 해석하면, 매 걸음이 힘든 일이었지만 그는 Sam이 얼마나 기쁠까 하는 생각에 힘을 얻어 앞으로 나아갔다.","hl":"m"},{"n":65,"text":"체력은 바닥났지만, Sam의 미소를 생각하며 고통을 참아내고 전진하는 감동적인 장면입니다. Jason의 따뜻한 마음이 잘 느껴지는 문장이에요.","hl":"mn"},{"n":66,"text":"두 가지 포인트를 짚어볼게요. 첫 번째로 세 번째 조각의 encouraged는 Jason이 힘을 받은 상태임을 나타내는 수동 분사구문입니다. 두 번째로 마지막 부분인 how happy Sam would be는 의문사, 주어, 동사의 어순을 따르는 간접의문문으로 쓰였다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마침내,\u003c/span>\u003cspan class=\"en\">Finally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 넘었다\u003c/span>\u003cspan class=\"en\">he \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">crossed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결승선을.\u003c/span>\u003cspan class=\"en\">the finish line.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마침내 그는 결승선을 넘었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 신체적 한계와 무릎 부상이라는 역경을 이겨내고 \u003cb class=\"key\">목표 \u003c/b>\u003cb class=\"key\">달성\u003c/b>을 이루는 순간으로, Sam을 향한 진심이 \u003cb class=\"key\">결실\u003c/b>을 맺는 장면입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제 동사\u003c/span> : cross [동사 원형] + -ed [과거형 어미] : \"넘었다\"\u003c/div>\u003c/div>","segs":[{"n":67,"text":"Finally, 마침내. he crossed, 그는 넘었다. the finish line, 결승선을.. 이 문장 전체를 해석하면, 마침내 그는 결승선을 넘었다.","hl":"m"},{"n":68,"text":"온갖 고난을 뚫고 마침내 결승선을 통과하는 감동적인 순간이에요. Jason의 노력이 목표 달성이라는 결실을 맺는 장면이죠.","hl":"mn"},{"n":69,"text":"첫 번째 포인트로 동사 crossed를 보세요. 이미 일어난 완료된 사건을 나타내기 위해 과거시제를 썼습니다. 단순하지만 이야기의 마무리를 짓는 중요한 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 20 / 22\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그가 앉아 있었을 때\u003c/span>\u003cspan class=\"en\">As he was sitting\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 숨을 고르기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">catch\u003c/span> his breath,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Sam이 다가와\u003c/span>\u003cspan class=\"en\">Sam came over\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그에게 병에 든 물을 건네주었다.\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">handed \u003c/span>\u003cspan class=\"tgt\">him \u003c/span>\u003cspan class=\"tgt\">bottled \u003c/span>\u003cspan class=\"tgt\">water\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자신(Jason)의 숨을 고르기 위해 그가 앉아 있었을 때, Sam이 다가와 그에게 병에 든 물을 건네주었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 완주 직후의 힘든 상태에서 Sam과의 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">교감\u003c/b>이 일어나는 장면으로, Sam의 행동은 Jason의 노력에 대한 \u003cb class=\"key\">따뜻한 \u003c/b>\u003cb class=\"key\">보상\u003c/b>을 상징합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : sit [동사] + to-v [목적] : \"숨을 고르기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">4형식 수여동사 구문\u003c/span> : handed [동사] + him [간접목적어] + bottled water [직접목적어] : \"그에게 병에 든 물을 건네주었다\"\u003c/div>\u003c/div>","segs":[{"n":70,"text":"As he was sitting, 그가 앉아 있었을 때. to catch his breath, 자신의 숨을 고르기 위해. Sam came over, Sam이 다가와. and handed him bottled water, 그에게 병에 든 물을 건네주었다.. 이 문장 전체를 해석하면, 자신(Jason)의 숨을 고르기 위해 그가 앉아 있었을 때, Sam이 다가와 그에게 병에 든 물을 건네주었다.","hl":"m"},{"n":71,"text":"경기를 마친 Jason과 그를 응원한 Sam이 직접 만나는 장면이에요. 두 사람 사이의 따뜻한 정서적 교감과 보상이 느껴지죠.","hl":"mn"},{"n":72,"text":"첫 번째로 to catch를 주목하세요. Jason이 왜 앉아 있었는지 그 이유나 목적을 설명하는 부사적 용법입니다. 두 번째는 handed him bottled water 부분인데요. 그에게 물을 주었다는 의미로, 간접목적어와 직접목적어를 나란히 쓰는 수여동사 구문이 사용되었습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 21 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 느꼈다\u003c/span>\u003cspan class=\"en\">He felt\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자부심, 안도감,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">pride, \u003c/span>\u003cspan class=\"tgt\">relief, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 감사함을.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">gratitude\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 자부심, 안도감, 그리고 감사함을 느꼈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 완주 후 밀려오는 복합적인 감정들을 나열하여, 육체적 고통을 이겨낸 뒤의 \u003cb class=\"key\">내적 \u003c/b>\u003cb class=\"key\">성장\u003c/b>과 \u003cb class=\"key\">정서적 \u003c/b>\u003cb class=\"key\">충족\u003c/b>을 드러냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사의 병렬 구조\u003c/span> : A, B, and C [명사 나열] : \"자부심, 안도감, 그리고 감사함\"\u003c/div>\u003c/div>","segs":[{"n":73,"text":"He felt, 그는 느꼈다. pride, relief, 자부심, 안도감. and gratitude, 그리고 감사함을.. 이 문장 전체를 해석하면, 그는 자부심, 안도감, 그리고 감사함을 느꼈다.","hl":"m"},{"n":74,"text":"마라톤을 마친 후 Jason이 느끼는 세 가지 핵심 감정을 보여줘요. 단순한 기쁨을 넘어 내적으로 크게 성장했음을 알 수 있습니다.","hl":"mn"},{"n":75,"text":"여기서는 pride, relief, and gratitude라는 세 단어의 연결을 보세요. and를 사용하여 성격이 같은 명사들을 나란히 배치한 병렬 구조입니다. Jason이 느낀 다양한 감정들을 효과적으로 나열하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 22 / 22\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그는 마침내 완주했다\u003c/span>\u003cspan class=\"en\">He \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">finally \u003c/span>\u003cspan class=\"tgt\">finished\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">― Sam을 위해.\u003c/span>\u003cspan class=\"en\">― \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">for \u003c/span>\u003cspan class=\"tgt\">Sam\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그는 마침내 Sam을 위해 완주했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 제이슨이 신체적 고통을 이겨내고 마침내 \u003cb class=\"key\">완주\u003c/b>에 성공하며 이야기가 마무리됩니다. 이 문장은 그가 달린 이유가 개인적인 기록 단축이 아니라 Sam을 향한 \u003cb class=\"key\">이타적인 \u003c/b>\u003cb class=\"key\">마음\u003c/b>이었음을 다시 한번 상기시키며 감동을 줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 과거동사 수식\u003c/span> : 부사(finally) + 과거시제 동사(finished) : \"마침내 완주했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구의 목적·대상 표현\u003c/span> : 전치사(for) + 명사(Sam) : \"Sam을 위해\"\u003c/div>\u003c/div>","segs":[{"n":76,"text":"He finally finished, 그는 마침내 완주했다. ― for Sam, ― Sam을 위해.. 이 문장 전체를 해석하면, 그는 마침내 Sam을 위해 완주했다.","hl":"m"},{"n":77,"text":"이 문장은 지문의 마지막 부분으로 제이슨이 자신의 한계를 이겨내고 완주에 성공하며 감동적으로 마무리됩니다. 끝까지 포기하지 않았던 원동력이 바로 Sam에 대한 이타적인 마음이었음을 강조하고 있어요.","hl":"mn"},{"n":78,"text":"첫 번째로, 부사가 동사를 꾸며주는 구조인 finally finished를 보세요. 무릎 부상이라는 긴 역경 끝에 드디어 동작이 완료되었음을 강조하고 있습니다. 두 번째로, 전치사 for가 쓰인 부분은 행위의 수혜자나 목적을 나타내는 표현이에요. 제이슨의 모든 노력이 오로지 Sam을 위한 것이었다는 점을 분명히 전달해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Jason은 옆집 소년 Sam을 위한 \u003cb class=\"key\">자선 \u003c/b>\u003cb class=\"key\">마라톤\u003c/b> 소식을 접하고 참가하고 싶어 합니다.\u003c/li>\u003cli>\u003cb class=\"key\">무릎 \u003c/b>\u003cb class=\"key\">부상\u003c/b> 때문에 우려가 있었으나 의사의 허락을 받아 \u003cb class=\"key\">3마일 \u003c/b>\u003cb class=\"key\">코스\u003c/b>에 등록합니다.\u003c/li>\u003cli>경주 도중 \u003cb class=\"key\">체력적 \u003c/b>\u003cb class=\"key\">한계\u003c/b>를 느끼지만 Sam의 응원을 떠올리며 포기하지 않고 달립니다.\u003c/li>\u003cli>결국 \u003cb class=\"key\">완주\u003c/b>에 성공한 Jason은 Sam에게 물을 건네받으며 진정한 \u003cb class=\"key\">성취감\u003c/b>을 느낍니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Jason overcomes his physical limitation and completes a charity marathon to support a neighbor boy with a heart condition.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">요약: \u003cb class=\"key\">무릎 \u003c/b>\u003cb class=\"key\">부상\u003c/b>을 겪었던 Jason이 옆집 소년 Sam을 돕기 위한 \u003cb class=\"key\">자선 \u003c/b>\u003cb class=\"key\">마라톤\u003c/b>에 참여하여 신체적 한계를 극복하고 \u003cb class=\"key\">완주\u003c/b>하는 감동적인 이야기입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":79,"text":"자, 오늘 우리는 Sam이라는 어린 소년을 위해 무릎 통증을 참고 달린 Jason의 감동적인 이야기를 함께 공부했습니다. 진심 어린 마음이 우리를 얼마나 강하게 만드는지 느낄 수 있었나요? 오늘 배운 표현들과 흐름을 다시 한번 복습하면서 여러분만의 것으로 만드시길 바랍니다. 수고 많으셨어요!","hl":null}]}]});</script></body></html>
