팎으로 물이 끊임없이 이동하게 되며, 해양 생물들이 생존을 위해 체내 수분과 염분의 균형을 일정하게 유지하려는 과정을 삼투압 조절(Osmoregulation)이라고 부릅니다. 만약 이러한 조절이 제대로 이루어지지 않으면, 세포가 주변의 물을 과도하게 흡수해 팽창하거나 반대로 수분을 강제로 빼앗겨 치명적인 탈수(Dehydration) 상태에 빠질 위험이 있죠. 따라서 이번 지문을 읽으실 때, 주변 환경의 염분 농도에 따라 생물체의 몸집이 어떻게 부풀거나 쪼그라들 수 있는지 이 보이지 않는 물의 이동 법칙을 떠올려보시면 내용이 훨씬 흥미롭고 쉽게 다가올 것입니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01해양 생물의 수분 섭취<\/div><ul><li>해양 생물은 생존을 위해 수분을 섭취해야 하며, 이때 함께 들어온 잉여 염분을 배출해야 한다.<\/li><li>정상적인 신체 기능을 위해 수분(water) 섭취 필수<\/li><li>수분과 함께 유입된 잉여 염분(extra salt)의 제거 필요<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02염분의 수분 흡수 원리<\/div><ul><li>소금은 스펀지처럼 주변의 수분을 빨아들여 부피가 커지는 성질을 가진다.<\/li><li>소금은 스펀지(sponge)처럼 수분을 흡수하는 원리(principle)를 가짐<\/li><li>수분을 흡수한 소금은 크기가 증가함(increased in size)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03체액의 염분이 더 높은 경우<\/div><ul><li>해양 생물의 체액이 바닷물보다 짤 경우, 체내의 염분이 주변 수분을 과도하게 흡수한다.<\/li><li>생물의 체액(body fluids)이 바닷물(seawater)보다 더 짠(saltier) 상황<\/li><li>체내 염분이 수분을 흡수하여 몸이 부어오름(swell up)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04바닷물의 염분이 더 높은 경우<\/div><ul><li>바닷물이 체액보다 짤 경우, 바닷물의 잉여 염분이 생물 몸속의 수분을 밖으로 빼앗아 간다.<\/li><li>바닷물의 염분량이 체액보다 높은(higher) 상황<\/li><li>몸 밖으로 수분을 빼앗겨 생물이 탈수(dehydrate) 상태가 되고 몸이 쪼그라듦(shrink)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take in<\/td><td class=\"m\">섭취하다, 빨아들이다<\/td><\/tr><tr><td class=\"w\">function<\/td><td class=\"m\">기능하다, 작용하다<\/td><\/tr><tr><td class=\"w\">properly<\/td><td class=\"m\">제대로, 적절히<\/td><\/tr><tr><td class=\"w\">get rid of<\/td><td class=\"m\">~을 제거하다, 없애다<\/td><\/tr><tr><td class=\"w\">absorb<\/td><td class=\"m\">흡수하다, 빨아들이다<\/td><\/tr><tr><td class=\"w\">make sure<\/td><td class=\"m\">반드시 ~하도록 하다, 확인하다<\/td><\/tr><tr><td class=\"w\">pile<\/td><td class=\"m\">더미, 무더기<\/td><\/tr><tr><td class=\"w\">increase<\/td><td class=\"m\">증가하다, 커지다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">principle<\/td><td class=\"m\">원리, 원칙<\/td><\/tr><tr><td class=\"w\">apply to<\/td><td class=\"m\">~에 적용되다, ~에 해당되다<\/td><\/tr><tr><td class=\"w\">fluid<\/td><td class=\"m\">액체, 체액<\/td><\/tr><tr><td class=\"w\">swell up<\/td><td class=\"m\">부풀어 오르다, 팽창하다<\/td><\/tr><tr><td class=\"w\">on the other hand<\/td><td class=\"m\">반면에, 다른 한편으로는<\/td><\/tr><tr><td class=\"w\">draw out<\/td><td class=\"m\">~을 빼내다, 뽑아내다<\/td><\/tr><tr><td class=\"w\">dehydrate<\/td><td class=\"m\">탈수 상태가 되다, 건조해지다<\/td><\/tr><tr><td class=\"w\">shrink<\/td><td class=\"m\">수축하다, 줄어들다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Even though sea creatures live in it,<\/b><\/span><span class=\"ko\">비록 해양 생물들이 물에 살지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they still need <span class=\"grammar-hl\">to take in<\/span> water<\/b><\/span><span class=\"ko\">그럼에도 그것들은 물을 섭취할 필요가 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">for their bodies to function<\/span> properly.<\/b><\/span><span class=\"ko\">자신들의 몸이 적절하게 기능하기 위해<\/span><\/div><\/div><div class=\"lec-sent-ko\">비록 해양 생물들이 물에 살지만, 그럼에도 그것들은 자신들의 몸이 적절하게 기능하기 위해 물을 섭취할 필요가 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 바다 생물들이 이미 물속에 둘러싸여 살고 있음에도 불구하고 생명 유지를 위해 수분을 흡수해야 한다는 도입부입니다. live in it의 it은 주변의 바닷물을 가리킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to take in (to부정사(명사적)): 주어·목적어·보어 자리에 쓰이는 명사적 용법으로, 동사 need의 목적어 자리에 쓰였다.<\/div><div class=\"lec-gr-item\">for their bodies to function (to부정사(부사적): 목적): &#39;in order to&#39;로 바꿔도 뜻이 유지되므로 부사적(목적) 용법이다. to부정사(to function) 앞에 있는 전치사구(for their bodies)는 to부정사의 동작을 수행하는 의미상 주어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">take in<\/td><td class=\"m\">섭취하다, 빨아들이다<\/td><\/tr><tr><td class=\"w\">function<\/td><td class=\"m\">기능하다, 작용하다<\/td><\/tr><tr><td class=\"w\">properly<\/td><td class=\"m\">제대로, 적절히<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>They just need <span class=\"grammar-hl\">to get rid of<\/span> any extra <span class=\"grammar-hl\">salt<\/span><\/b><\/span><span class=\"ko\">다만 그것들은 여분의 소금을 제거할 필요가 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">it might bring<\/span> with it.<\/b><\/span><span class=\"ko\">그것(물)이 함께 가져올 수 있는<\/span><\/div><\/div><div class=\"lec-sent-ko\">다만 그것들은 그것(물)이 함께 가져올 수 있는 여분의 소금을 제거할 필요가 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에 이어, 바닷물을 섭취할 때 물과 함께 들어오는 불필요한 소금기를 배출해야 생명을 유지할 수 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to get rid of (to부정사(명사적)): 주어·목적어·보어 자리에 쓰이는 명사적 용법으로, 동사 need의 목적어 자리에 쓰였다.<\/div><div class=\"lec-gr-item\">get rid of (관용표현): &#39;~을 제거하다, 없애다&#39;라는 의미로 굳어져 쓰이는 어구이다.<\/div><div class=\"lec-gr-item\">salt it might bring (관계대명사): 선행사 salt 뒤에 목적격 관계대명사(that/which)가 생략된 구조이다. 절 내부에 주어(it)와 동사(might bring)가 갖춰져 있으나 bring의 목적어가 빠진 불완전한 절이 앞의 명사 salt를 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">get rid of<\/td><td class=\"m\">~을 제거하다, 없애다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Salt <span class=\"grammar-hl\">absorbs water<\/span><\/b><\/span><span class=\"ko\">소금은 물을 흡수한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>like a sponge.<\/b><\/span><span class=\"ko\">스펀지처럼<\/span><\/div><\/div><div class=\"lec-sent-ko\">소금은 스펀지처럼 물을 흡수한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 소금의 물리적 특성을 스펀지에 비유하여 설명하며, 왜 바다 생물이 여분의 염분을 배출해야 하는지에 대한 근본적인 원리를 제시하기 시작합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">absorbs water 3형식 구조: 주어(Salt) + 타동사(absorbs) + 목적어(water)로 이루어진 3형식 문장이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">absorb<\/td><td class=\"m\">흡수하다, 빨아들이다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If you put a tiny mountain of salt<\/b><\/span><span class=\"ko\">만약 여러분이 조그만 소금 더미를 쌓고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on a small plate,<\/b><\/span><span class=\"ko\">작은 접시 위에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>then add enough water<\/b><\/span><span class=\"ko\">그러고 나서 충분한 물을 붓고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to the side,<\/b><\/span><span class=\"ko\">그 옆에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">making sure<\/span> an edge touches the salt,<\/b><\/span><span class=\"ko\">가장자리가 소금에 확실히 닿게 하면,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the salt will absorb the water.<\/b><\/span><span class=\"ko\">그 소금은 물을 흡수할 것이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 여러분이 작은 접시 위에 조그만 소금 더미를 쌓고, 그러고 나서 그 옆에 충분한 물을 부어 가장자리가 소금에 확실히 닿게 하면, 그 소금은 물을 흡수할 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 말한 소금의 수분 흡수 성질을 독자가 눈앞에 그리듯 쉽게 상상할 수 있는 구체적인 실험 예시로 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">making sure (분사구문): 현재분사 making이 부사적 기능으로 쓰여 부대상황(동시동작)을 나타낸다. 주절의 주어(you)가 능동적으로 동작을 수행하며, 원래 절인 &#39;while you make sure&#39;로 바꿀 수 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">absorb<\/td><td class=\"m\">흡수하다, 빨아들이다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Now you have <span class=\"grammar-hl\">a pile of<\/span> wet salt.<\/b><\/span><span class=\"ko\">이제 여러분은 젖은 소금 더미를 가지게 된다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이제 여러분은 젖은 소금 더미를 가지게 된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 실험의 결과를 시각적으로 묘사합니다. 물을 빨아들여 축축해진 덩어리가 만들어진 상태를 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">a pile of (관용표현): &#39;한 무더기의, 많은&#39;이라는 의미로 굳어져 쓰이는 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">pile<\/td><td class=\"m\">더미, 무더기<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Notice<\/span><\/b><\/span><span class=\"ko\">주목하라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> it has increased in size.<\/b><\/span><span class=\"ko\">그것의 부피가 커진 것에<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것의 부피가 커진 것에 주목하라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 젖은 소금 더미의 부피가 커진다는 점을 짚어줍니다. 이 부피 증가 현상이 곧 이어질 바다 생물 체내 변화를 이해하는 핵심 단서가 됩니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Notice that 명사절 접속사 that: 뒤에 주어와 동사가 갖춰진 완전한 문장(it has increased in size)을 이끌어, 타동사 Notice의 목적어 역할을 하는 명사절을 구성한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">increase<\/td><td class=\"m\">증가하다, 커지다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The same principle <span class=\"grammar-hl\">applies<\/span><\/b><\/span><span class=\"ko\">동일한 원리가 적용된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to<\/span> sea creatures.<\/b><\/span><span class=\"ko\">해양 생물들에게<\/span><\/div><\/div><div class=\"lec-sent-ko\">동일한 원리가 해양 생물들에게 적용된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 접시 위 소금 실험의 원리를 글의 원래 주제인 바다 생물로 다시 끌어와 연결하는 전환 역할을 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">applies to (관용표현): 동사 apply가 전치사 to와 함께 쓰여 &#39;~에 적용되다&#39;라는 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">principle<\/td><td class=\"m\">원리, 원칙<\/td><\/tr><tr><td class=\"w\">apply to<\/td><td class=\"m\">~에 적용되다, ~에 해당되다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If the body fluids in a sea animal<\/b><\/span><span class=\"ko\">만약 어떤 해양 동물의 체액이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are saltier<\/b><\/span><span class=\"ko\">더 짜다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than the <span class=\"grammar-hl\">seawater it lives in<\/span>,<\/b><\/span><span class=\"ko\">그것이 사는 바닷물보다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>then the extra salt in the creature’s body<\/b><\/span><span class=\"ko\">그러면 그 생물의 몸 안의 여분 소금이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>will absorb seawater.<\/b><\/span><span class=\"ko\">바닷물을 흡수할 것이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 어떤 해양 동물의 체액이 그것이 사는 바닷물보다 더 짜다면, 그러면 그 생물의 몸 안의 여분 소금이 바닷물을 흡수할 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 생물의 체액이 주변 바닷물보다 염분이 높은 경우를 가정하여, 앞서 본 소금의 수분 흡수 원리가 체내에서 어떻게 작동하는지 구체적인 상황을 제시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">seawater it lives in (관계대명사): 선행사 seawater 뒤에 목적격 관계대명사(that/which)가 생략된 구조이다. 절 내부에 주어(it)와 동사(lives)가 있지만 전치사 in의 목적어가 빠진 불완전한 절이 앞의 명사를 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">absorb<\/td><td class=\"m\">흡수하다, 빨아들이다<\/td><\/tr><tr><td class=\"w\">fluid<\/td><td class=\"m\">액체, 체액<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This can <span class=\"grammar-hl\">cause them to swell up<\/span>.<\/b><\/span><span class=\"ko\">이것은 그것들이 부풀어 오르게 하는 원인이 될 수 있다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이것은 그것들이 부풀어 오르게 하는 원인이 될 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 결과로, 몸속의 짠 성분이 외부의 수분을 빨아들여 생물의 몸이 빵빵하게 커지는 현상을 설명합니다. swell up은 &#39;부풀어 오르다&#39;라는 의미로, 앞서 소금 더미의 크기가 커진 것과 같은 맥락입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">cause them to swell up 5형식(SVOC) 구조: 주어 + 동사(cause) + 목적어(them) + 목적격보어(to swell up) 형태를 취하여 &#39;목적어가 ~하게 하다&#39;는 구조를 형성한다.<\/div><div class=\"lec-gr-item\">to swell up (to부정사(목적격보어)): 동사 + 목적어 + to V 구조로, 5형식 동사 cause의 목적격보어 자리에 쓰였다. 명사 수식이 아니므로 형용사적 용법이 아니다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">swell up<\/td><td class=\"m\">부풀어 오르다, 팽창하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>On the other hand,<\/b><\/span><span class=\"ko\">반대로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>if the amount of salt in the seawater<\/b><\/span><span class=\"ko\">만약 바닷물 속 소금의 함유량이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is higher<\/b><\/span><span class=\"ko\">더 높다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than the amount of salt<\/b><\/span><span class=\"ko\">소금의 함유량보다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the body fluids of a sea animal,<\/b><\/span><span class=\"ko\">해양 동물의 체액 안의,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the extra salt in the water<\/b><\/span><span class=\"ko\">바닷물 속의 여분 소금이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>will draw fluids out<\/b><\/span><span class=\"ko\">체액을 끌어내게 되고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of the creature’s body,<\/b><\/span><span class=\"ko\">생물의 몸으로부터,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">causing it to dehydrate and shrink<\/span>.<\/b><\/span><span class=\"ko\">그것이 수분이 빠져 쪼그라들게 하는 원인이 된다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">반대로, 만약 바닷물 속 소금의 함유량이 해양 동물의 체액 안의 소금의 함유량보다 더 높다면, 바닷물 속의 여분 소금이 생물의 몸으로부터 체액을 끌어내게 되고, 그것이 수분이 빠져 쪼그라들게 하는 원인이 된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞의 상황과 정반대의 경우를 가정하여 비교합니다. 바닷물이 더 짤 때는 반대로 바닷물이 생물 체내의 수분을 빼앗아가서 몸이 마르고 수축하게 된다는 점을 명확히 보여줍니다. 삼투압 현상의 원리를 draw fluids out of라는 표현으로 직관적으로 묘사하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">causing it to dehydrate and shrink (분사구문): 현재분사 causing이 부사적 기능으로 쓰여 앞 절의 결과로 이어지는 상황을 나타낸다. 앞 문장의 주어(the extra salt)를 의미상 주어로 받아 원래 절인 &#39;and it causes it to dehydrate and shrink&#39;로 바꿀 수 있다.<\/div><div class=\"lec-gr-item\">cause it to dehydrate and shrink 5형식(SVOC) 구조: 분사구문 내부에서 동사(cause) + 목적어(it) + 목적격보어(to dehydrate and shrink)의 5형식 뼈대를 이루고 있다.<\/div><div class=\"lec-gr-item\">to dehydrate and shrink (to부정사(목적격보어)): 동사 + 목적어 + to V 구조로, cause의 목적격보어 자리에 쓰였다. to 뒤에 동사원형 dehydrate와 shrink가 병렬로 연결되어 있다. 명사 수식이 아니므로 형용사적 용법이 아니다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">fluid<\/td><td class=\"m\">액체, 체액<\/td><\/tr><tr><td class=\"w\">on the other hand<\/td><td class=\"m\">반면에, 다른 한편으로는<\/td><\/tr><tr><td class=\"w\">draw out<\/td><td class=\"m\">~을 빼내다, 뽑아내다<\/td><\/tr><tr><td class=\"w\">dehydrate<\/td><td class=\"m\">탈수 상태가 되다, 건조해지다<\/td><\/tr><tr><td class=\"w\">shrink<\/td><td class=\"m\">수축하다, 줄어들다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>바다 생물은 생존을 위해 바닷물을 흡수하되 체내에 들어온 여분의 염분을 배출해야 한다.<\/li><li>소금은 스펀지처럼 수분을 강하게 흡수하여 부피를 키우는 물리적 성질을 지닌다.<\/li><li>만약 생물의 체액이 바닷물보다 짜면, 체내 염분이 수분을 흡수해 생물의 몸이 팽창한다.<\/li><li>반대로 바닷물이 체액보다 짜면, 바닷물의 염분이 체내 수분을 빼앗아 생물의 몸이 수축한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Sea creatures need to regulate their internal salt levels, because an imbalance of salt concentration with the surrounding seawater causes them to either swell or shrink.<\/div>\n              <div class=\"lec-final-sum-ko\">해양 생물은 주변 바닷물과의 염분 농도 불균형이 몸을 팽창시키거나 수축하게 만들기 때문에, 체내 염분 수치를 조절해야 한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./36_audio/1.mp3","hl":null}],[{"audio":"./36_audio/2.mp3","hl":null}],[{"audio":"./36_audio/3.mp3","hl":null},{"audio":"./36_audio/4.mp3","hl":"stage-0"},{"audio":"./36_audio/5.mp3","hl":"stage-1"},{"audio":"./36_audio/6.mp3","hl":"stage-2"},{"audio":"./36_audio/7.mp3","hl":"stage-3"}],[{"audio":"./36_audio/8.mp3","hl":null}],[{"audio":"./36_audio/9.mp3","hl":"main"},{"audio":"./36_audio/10.mp3","hl":"meaning"},{"audio":"./36_audio/11.mp3","hl":"grammar"}],[{"audio":"./36_audio/12.mp3","hl":"main"},{"audio":"./36_audio/13.mp3","hl":"meaning"},{"audio":"./36_audio/14.mp3","hl":"grammar"}],[{"audio":"./36_audio/15.mp3","hl":"main"},{"audio":"./36_audio/16.mp3","hl":"meaning"},{"audio":"./36_audio/17.mp3","hl":"grammar"}],[{"audio":"./36_audio/18.mp3","hl":"main"},{"audio":"./36_audio/19.mp3","hl":"meaning"},{"audio":"./36_audio/20.mp3","hl":"grammar"}],[{"audio":"./36_audio/21.mp3","hl":"main"},{"audio":"./36_audio/22.mp3","hl":"meaning"},{"audio":"./36_audio/23.mp3","hl":"grammar"}],[{"audio":"./36_audio/24.mp3","hl":"main"},{"audio":"./36_audio/25.mp3","hl":"meaning"},{"audio":"./36_audio/26.mp3","hl":"grammar"}],[{"audio":"./36_audio/27.mp3","hl":"main"},{"audio":"./36_audio/28.mp3","hl":"meaning"},{"audio":"./36_audio/29.mp3","hl":"grammar"}],[{"audio":"./36_audio/30.mp3","hl":"main"},{"audio":"./36_audio/31.mp3","hl":"meaning"},{"audio":"./36_audio/32.mp3","hl":"grammar"}],[{"audio":"./36_audio/33.mp3","hl":"main"},{"audio":"./36_audio/34.mp3","hl":"meaning"},{"audio":"./36_audio/35.mp3","hl":"grammar"}],[{"audio":"./36_audio/36.mp3","hl":"main"},{"audio":"./36_audio/37.mp3","hl":"meaning"},{"audio":"./36_audio/38.mp3","hl":"grammar"}],[{"audio":"./36_audio/39.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_36번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 36번","titleEn":"The Impact of Salt Concentration on Sea Creatures","titleKo":"염분 농도가 해양 생물에 미치는 영향","imageUrl":"__enpImg__","stages":[{"label":"01해양 생물의 수분 섭취","items":["해양 생물은 생존을 위해 수분을 섭취해야 하며, 이때 함께 들어온 잉여 염분을 배출해야 한다.","정상적인 신체 기능을 위해 수분(water) 섭취 필수","수분과 함께 유입된 잉여 염분(extra salt)의 제거 필요"]},{"label":"02염분의 수분 흡수 원리","items":["소금은 스펀지처럼 주변의 수분을 빨아들여 부피가 커지는 성질을 가진다.","소금은 스펀지(sponge)처럼 수분을 흡수하는 원리(principle)를 가짐","수분을 흡수한 소금은 크기가 증가함(increased in size)"]},{"label":"03체액의 염분이 더 높은 경우","items":["해양 생물의 체액이 바닷물보다 짤 경우, 체내의 염분이 주변 수분을 과도하게 흡수한다.","생물의 체액(body fluids)이 바닷물(seawater)보다 더 짠(saltier) 상황","체내 염분이 수분을 흡수하여 몸이 부어오름(swell up)"]},{"label":"04바닷물의 염분이 더 높은 경우","items":["바닷물이 체액보다 짤 경우, 바닷물의 잉여 염분이 생물 몸속의 수분을 밖으로 빼앗아 간다.","바닷물의 염분량이 체액보다 높은(higher) 상황","몸 밖으로 수분을 빼앗겨 생물이 탈수(dehydrate) 상태가 되고 몸이 쪼그라듦(shrink)"]}],"bkg":"바다 생물들이 짠 바닷물 속에서도 살아갈 수 있는 원리를 깊이 이해하려면 먼저 삼투 현상(Osmosis)이라는 중요한 과학적 개념을 아는 것이 좋습니다. 삼투 현상이란 물이 세포막을 사이에 두고 농도가 낮은 곳에서 높은 곳으로 이동하려는 성질을 말하는데, 일상생활에서 우리가 김장을 할 때 배추에 소금을 뿌리면 배추 속 수분이 밖으로 빠져나와 쪼그라드는 것과 똑같은 원리랍니다. 이처럼 염분의 농도(Concentration) 차이 때문에 생명체 안팎으로 물이 끊임없이 이동하게 되며, 해양 생물들이 생존을 위해 체내 수분과 염분의 균형을 일정하게 유지하려는 과정을 삼투압 조절(Osmoregulation)이라고 부릅니다. 만약 이러한 조절이 제대로 이루어지지 않으면, 세포가 주변의 물을 과도하게 흡수해 팽창하거나 반대로 수분을 강제로 빼앗겨 치명적인 탈수(Dehydration) 상태에 빠질 위험이 있죠. 따라서 이번 지문을 읽으실 때, 주변 환경의 염분 농도에 따라 생물체의 몸집이 어떻게 부풀거나 쪼그라들 수 있는지 이 보이지 않는 물의 이동 법칙을 떠올려보시면 내용이 훨씬 흥미롭고 쉽게 다가올 것입니다.","ttsText":"바다 생물들이 짠 바닷물 속에서도 살아갈 수 있는 원리를 깊이 이해하려면 먼저 삼투 현상(Osmosis)이라는 중요한 과학적 개념을 아는 것이 좋습니다. 삼투 현상이란 물이 세포막을 사이에 두고 농도가 낮은 곳에서 높은 곳으로 이동하려는 성질을 말하는데, 일상생활에서 우리가 김장을 할 때 배추에 소금을 뿌리면 배추 속 수분이 밖으로
