ated position) 강조<\/li><li>백성: 통치자를 올려다보며 경외심(awe)과 거리감 형성<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03절대 권력의 시각화 사례<\/div><ul><li>베르사유 궁전의 거울의 방은 유리가 왕의 권력을 어떻게 극대화하는지 보여줍니다.<\/li><li>베르사유 궁전의 거울의 방(Hall of Mirrors) 활용<\/li><li>공간의 웅장함을 키우고 왕의 절대 권력(absolute authority)을 강화<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04감시와 사회적 통제<\/div><ul><li>유리는 단순한 미적 요소가 아니라 감시를 통해 사회적 행동을 규제하는 전략적 도구였습니다.<\/li><li>개방된 시야를 통한 감시(surveillance)와 안전 확보<\/li><li>관찰당하고 있음을 의식하게 하여 방문자의 복종(obedience) 유도<\/li><li>유리가 권력 역학(power dynamic)의 무언의 집행자로 작용<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intimidate<\/td><td class=\"m\">위협하다, 겁주다<\/td><\/tr><tr><td class=\"w\">permanence<\/td><td class=\"m\">영구함, 영속성<\/td><\/tr><tr><td class=\"w\">visibility<\/td><td class=\"m\">가시성, 눈에 보임<\/td><\/tr><tr><td class=\"w\">look down upon<\/td><td class=\"m\">~을 내려다보다<\/td><\/tr><tr><td class=\"w\">subject<\/td><td class=\"m\">백성, 신하<\/td><\/tr><tr><td class=\"w\">conversely<\/td><td class=\"m\">반대로, 역으로<\/td><\/tr><tr><td class=\"w\">gaze up at<\/td><td class=\"m\">~을 올려다보다<\/td><\/tr><tr><td class=\"w\">awe<\/td><td class=\"m\">경외심<\/td><\/tr><tr><td class=\"w\">grandeur<\/td><td class=\"m\">웅장함, 장엄함<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">reinforce<\/td><td class=\"m\">강화하다<\/td><\/tr><tr><td class=\"w\">absolute<\/td><td class=\"m\">절대적인, 완전한<\/td><\/tr><tr><td class=\"w\">aesthetic<\/td><td class=\"m\">미적인, 심미적인<\/td><\/tr><tr><td class=\"w\">strategic<\/td><td class=\"m\">전략적인<\/td><\/tr><tr><td class=\"w\">surveillance<\/td><td class=\"m\">감시<\/td><\/tr><tr><td class=\"w\">be aware of<\/td><td class=\"m\">~을 알다, ~을 인지하다<\/td><\/tr><tr><td class=\"w\">contribute to<\/td><td class=\"m\">~에 기여하다, ~의 원인이 되다<\/td><\/tr><tr><td class=\"w\">obedience<\/td><td class=\"m\">복종, 순종<\/td><\/tr><tr><td class=\"w\">dictate<\/td><td class=\"m\">좌우하다, 지시하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Historically,<\/b><\/span><span class=\"ko\">역사적으로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>palaces weren’t just homes;<\/b><\/span><span class=\"ko\">궁전들은 단순한 거처가 아니었다;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they were carefully <span class=\"grammar-hl\">constructed<\/span> stages<\/b><\/span><span class=\"ko\">그것들은 주의 깊게 만들어진 무대들이었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">designed<\/span> <span class=\"grammar-hl\">to impress and intimidate<\/span>.<\/b><\/span><span class=\"ko\">깊은 인상을 주고 위협하기 위해 설계된<\/span><\/div><\/div><div class=\"lec-sent-ko\">역사적으로 궁전들은 단순한 거처가 아니었다. 그것들은 깊은 인상을 주고 위협하기 위해 설계된 주의 깊게 만들어진 무대들이었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로 궁전이 세워진 진짜 목적을 제시합니다. carefully constructed stages는 권력을 과시하고 신하와 백성들에게 경외심을 불러일으키기 위해 의도적으로 연출된 공간이라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">constructed (과거분사(형용사)): constructed가 명사 stages를 수식(= 지어진 무대)한다. p.p. + N 형태로 쓰였다.<\/div><div class=\"lec-gr-item\">designed (과거분사(형용사)): designed가 앞의 명사 stages를 뒤에서 수식(= 인상을 주고 위협하도록 설계된 무대)한다. N + p.p. 형태의 축약 관계절(stages that were designed...) 구조다.<\/div><div class=\"lec-gr-item\">to impress and intimidate (to부정사(부사적): 목적): in order to V로 바꿔도 뜻이 같다. &#39;인상을 주고 위협하기 위해&#39;로 해석된다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">intimidate<\/td><td class=\"m\">위협하다, 겁주다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>While stone symbolized permanence and strength,<\/b><\/span><span class=\"ko\">돌은 영속성과 힘을 상징했던 반면에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>glass offered <span class=\"grammar-hl\">something equally powerful<\/span>: visibility.<\/b><\/span><span class=\"ko\">유리는 동등하게 강력한 어떤 것, 즉 가시성을 제공했다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">돌은 영속성과 힘을 상징했고, 유리는 동등하게 강력한 어떤 것, 즉 가시성을 제공했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 건축 소재의 변화를 통해 &#39;유리&#39;라는 새로운 권력 도구를 소개하는 문장입니다. 건축사에서 돌이 물리적인 권력을 나타냈다면, visibility는 시선을 주고받는 과정을 통한 새로운 차원의 통제력을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">something equally powerful 형용사 후위 수식: -thing으로 끝나는 대명사(something)는 형용사(powerful)가 뒤에서 수식하는 구조를 취한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">permanence<\/td><td class=\"m\">영구함, 영속성<\/td><\/tr><tr><td class=\"w\">visibility<\/td><td class=\"m\">가시성, 눈에 보임<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The introduction of large windows in palaces<\/b><\/span><span class=\"ko\">궁전들에 대형 창문들의 도입은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">allowed rulers<\/span><\/b><\/span><span class=\"ko\">통치자들로 하여금 가능하게 해 줬다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to literally look down upon<\/span> their subjects,<\/b><\/span><span class=\"ko\">문자 그대로 자신들의 국민들을 내려다보는 것을,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">emphasizing<\/span> their <span class=\"grammar-hl\">elevated<\/span> position.<\/b><\/span><span class=\"ko\">그들의 높은 지위를 강조하면서<\/span><\/div><\/div><div class=\"lec-sent-ko\">궁전들에 대형 창문들의 도입은 통치자들로 하여금 문자 그대로 자신들의 국민들을 내려다볼 수 있게 해 줬고, 그들의 높은 지위를 강조했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 유리가 권력을 강화하는 첫 번째 방식(위에서 아래로 보는 시선)을 구체적으로 설명합니다. literally look down upon은 비유적으로 무시한다는 뜻을 넘어, 물리적으로 높은 곳에서 사람들을 내려다보며 위계질서를 시각적으로 분명히 보여 주었다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">allowed rulers to literally look down upon 5형식(SVOC) 구조 / to부정사(목적격보어): allow + 목적어 + to V 구조로, to literally look down upon이 목적격보어로 쓰였다.<\/div><div class=\"lec-gr-item\">emphasizing (분사구문): 현재분사(-ing)로 시작하는 능동 분사구문이다. 원래 절로 변환하면 and it emphasized their elevated position 이다.<\/div><div class=\"lec-gr-item\">elevated (과거분사(형용사)): elevated가 명사 position을 수식(= 높아진/격상된 지위)한다. p.p. + N 형태로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look down upon<\/td><td class=\"m\">~을 내려다보다<\/td><\/tr><tr><td class=\"w\">subject<\/td><td class=\"m\">백성, 신하<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Conversely,<\/b><\/span><span class=\"ko\">반대로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it also <span class=\"grammar-hl\">allowed subjects<\/span><\/b><\/span><span class=\"ko\">그것은 또한 국민들이 가능하게 했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to gaze up at<\/span> their leaders,<\/b><\/span><span class=\"ko\">자신들의 통치자를 위로 올려다보는 것을,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">creating<\/span> a sense of awe and distance.<\/b><\/span><span class=\"ko\">경외심과 거리감을 만들어 내면서<\/span><\/div><\/div><div class=\"lec-sent-ko\">반대로 그것은 또한 국민들이 자신들의 통치자를 ‘위로’ 올려다보게 했고, 경외심과 거리감을 만들어 냈다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장과 대조되는 두 번째 방식(아래에서 위로 우러러보는 시선)을 덧붙입니다. creating a sense of awe and distance는 백성들이 감히 범접할 수 없는 존재로 통치자를 인식하게 만들어 심리적인 격차를 크게 벌렸다는 것을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">allowed subjects to gaze up at 5형식(SVOC) 구조 / to부정사(목적격보어): allow + 목적어 + to V 구조로, to gaze up at이 목적격보어로 쓰였다.<\/div><div class=\"lec-gr-item\">creating (분사구문): 현재분사(-ing)로 시작하는 능동 분사구문이다. 원래 절로 변환하면 and it created a sense of awe and distance 이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">subject<\/td><td class=\"m\">백성, 신하<\/td><\/tr><tr><td class=\"w\">conversely<\/td><td class=\"m\">반대로, 역으로<\/td><\/tr><tr><td class=\"w\">gaze up at<\/td><td class=\"m\">~을 올려다보다<\/td><\/tr><tr><td class=\"w\">awe<\/td><td class=\"m\">경외심<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Consider the Palace of Versailles:<\/b><\/span><span class=\"ko\">베르사유 궁전을 생각해 보라:<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>its Hall of Mirrors,<\/b><\/span><span class=\"ko\">그것의 거울의 방은,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">lined<\/span> with reflective surfaces,<\/b><\/span><span class=\"ko\">반사되는 표면들로 둘러싸인,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>not only magnified the grandeur of the space<\/b><\/span><span class=\"ko\">공간의 웅장함을 극대화했을 뿐 아니라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but also placed the king<\/b><\/span><span class=\"ko\">또한 왕을 두었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>at the center of a <span class=\"grammar-hl\">dazzling<\/span> display,<\/b><\/span><span class=\"ko\">눈부신 장식의 중심에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">reinforcing<\/span> his absolute authority.<\/b><\/span><span class=\"ko\">그의 절대 권위를 강화하면서<\/span><\/div><\/div><div class=\"lec-sent-ko\">베르사유 궁전을 생각해 보라. 반사되는 표면들로 일렬로 둘러싸인 그것의 거울의 방은 공간의 웅장함을 극대화했을 뿐 아니라, 왕을 눈부신 장식의 중심에 두어 그의 절대 권위를 강화했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 설명한 시각적 권력 과시의 구체적 사례로 베르사유 궁전을 제시합니다. reinforcing his absolute authority는 수많은 거울에 반사된 빛과 화려함 속에서 왕이 가장 돋보이게끔 연출하여 절대군주의 힘을 시각적으로 각인시켰다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">lined (분사구문): 과거분사(p.p.)로 시작하는 수동 분사구문이다. 원래 절로 변환하면 as it was lined with reflective surfaces 이며, 주절의 주어와 같아 주어(it)가 생략되고 접속사와 be동사(was)가 생략된 후 과거분사만 남은 구조다.<\/div><div class=\"lec-gr-item\">not only magnified ... but also placed (상관접속사): &#39;not only A but also B (A뿐만 아니라 B도)&#39; 구조가 동사구인 magnified와 placed를 병렬로 연결하고 있다.<\/div><div class=\"lec-gr-item\">dazzling (현재분사(형용사)): dazzling이 명사 display를 수식(= 눈부신 전시)한다. -ing + N 형태로 쓰였다.<\/div><div class=\"lec-gr-item\">reinforcing (분사구문): 현재분사(-ing)로 시작하는 능동 분사구문이다. 원래 절로 변환하면 and it reinforced his absolute authority 이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">grandeur<\/td><td class=\"m\">웅장함, 장엄함<\/td><\/tr><tr><td class=\"w\">reinforce<\/td><td class=\"m\">강화하다<\/td><\/tr><tr><td class=\"w\">absolute<\/td><td class=\"m\">절대적인, 완전한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The use of glass in palaces<\/b><\/span><span class=\"ko\">궁전들에서의 유리의 용도는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">wasn’t merely aesthetic;<\/span><\/b><\/span><span class=\"ko\">단순히 미적인 것이 아니었다;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">it was strategic<\/span>.<\/b><\/span><span class=\"ko\">그것은 전략적이었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">궁전들에서의 유리의 용도는 단순히 미적인 것이 아니었다. 그것은 전략적이었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 화려함이라는 미적 요소를 넘어선 유리의 실질적인 목적을 강조하며 화제를 전환합니다. merely aesthetic은 단순히 궁전을 아름답게 꾸미기 위한 장식용 기능만을 뜻합니다. 글쓴이는 유리가 지배층의 고도의 정치적 계산이 깔린 도구였음을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">wasn’t merely aesthetic; it was strategic 문장 구조: 세미콜론(;)이 등위접속사 역할을 하여 두 개의 독립된 절을 연결하며, 대조적인 의미(단순히 미적인 것이 아니라 전략적이었다)를 이어준다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">aesthetic<\/td><td class=\"m\">미적인, 심미적인<\/td><\/tr><tr><td class=\"w\">strategic<\/td><td class=\"m\">전략적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Open sightlines<\/b><\/span><span class=\"ko\">열린 시야는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>allowed for better surveillance and control,<\/b><\/span><span class=\"ko\">더 나은 감시와 통제를 가능하게 했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">ensuring<\/span> the safety and security of the <span class=\"grammar-hl\">ruling<\/span> family.<\/b><\/span><span class=\"ko\">통치 가문의 안전과 보안을 보장하면서<\/span><\/div><\/div><div class=\"lec-sent-ko\">열린 시야는 더 나은 감시와 통제를 가능하게 했고, 통치 가문의 안전과 보안을 보장했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 &#39;전략적&#39; 목적이 구체적으로 무엇인지(감시와 통제) 설명합니다. Open sightlines는 시야를 가리는 장애물이 없어 사각지대가 없음을 의미합니다. 이를 통해 지배층이 궁전 내부의 사람들을 쉽게 지켜보며 잠재적인 위험을 사전에 차단할 수 있었습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">ensuring (분사구문): 현재분사(-ing)로 시작하는 능동 분사구문이다. 원래 절로 변환하면 and they ensured the safety and security of the ruling family 이다. (주어 they는 복수명사인 sightlines를 가리킨다)<\/div><div class=\"lec-gr-item\">ruling (현재분사(형용사)): ruling이 명사 family를 수식(= 통치하는 가문)한다. -ing + N 형태로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">surveillance<\/td><td class=\"m\">감시<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Courtiers and visitors<\/b><\/span><span class=\"ko\">신하들과 방문자들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>were constantly aware of <span class=\"grammar-hl\">being observed<\/span>,<\/b><\/span><span class=\"ko\">끊임없이 관찰되고 있는 것을 의식했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">contributing<\/span> to an atmosphere of careful obedience and respect.<\/b><\/span><span class=\"ko\">조심스러운 복종과 존경의 분위기를 조성하면서<\/span><\/div><\/div><div class=\"lec-sent-ko\">신하들과 방문자들은 끊임없이 관찰되고 있는 것을 의식했고, 그것은 조심스러운 복종과 존경의 분위기를 조성했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 감시를 당하는 사람들의 심리와 그에 따른 행동 변화를 설명합니다. constantly aware of being observed는 항상 누군가 자신을 지켜보고 있다는 사실을 인식하게 만들어, 스스로 행동을 조심하고 복종할 수밖에 없는 환경을 조성했다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">being observed (동명사(명사적)): 전치사 of의 목적어 역할을 하는 동명사다. observe는 타동사인데 목적어가 없어 수동의 의미를 지니게 되었으며, 이에 따라 동명사의 수동형인 being p.p.(being observed) 구조로 쓰였다.<\/div><div class=\"lec-gr-item\">contributing (분사구문): 현재분사(-ing)로 시작하는 능동 분사구문이다. 원래 절로 변환하면 and it contributed to an atmosphere of careful obedience and respect 이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be aware of<\/td><td class=\"m\">~을 알다, ~을 인지하다<\/td><\/tr><tr><td class=\"w\">contribute to<\/td><td class=\"m\">~에 기여하다, ~의 원인이 되다<\/td><\/tr><tr><td class=\"w\">obedience<\/td><td class=\"m\">복종, 순종<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The very architecture dictated social behavior,<\/b><\/span><span class=\"ko\">건축물 그 자체가 사회적 행동을 지배했다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with glass <span class=\"grammar-hl\">acting<\/span><\/b><\/span><span class=\"ko\">유리가 역할을 하면서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as a silent enforcer of the power dynamic.<\/b><\/span><span class=\"ko\">권력 역학 관계의 조용한 집행자로서<\/span><\/div><\/div><div class=\"lec-sent-ko\">유리가 권력 역학 관계의 조용한 집행자로서 역할을 하면서 건축물 그 자체가 사회적 행동을 지배했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 전체 글의 결론으로, 유리를 활용한 건축이 사회적 행동을 통제했다는 핵심 주제를 마무리합니다. a silent enforcer of the power dynamic에서 글쓴이는 건축물 자체가 입 밖으로 명령을 내리지 않고도 사람들의 복종을 이끌어 내며 권력 관계를 공고히 다지는 역할을 했다는 점을 짚어 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">acting (분사구문): &#39;with + 명사 + 분사&#39; 형태의 부대상황 분사구문이다. 명사인 glass가 능동적으로 act(역할을 하다)하는 주체이므로 현재분사(-ing) acting이 쓰였다. 원래 절로 변환하면 while it acted as a silent enforcer 와 같다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">dictate<\/td><td class=\"m\">좌우하다, 지시하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>역사적으로 궁전은 단순한 거주지가 아니라 지배층의 권력을 과시하는 통치 수단이었다.<\/li><li>과거에는 돌이 물리적인 힘을 상징했다면, 유리는 가시성이라는 새로운 권력을 제공했다.<\/li><li>커다란 유리창과 거울 등은 통치자의 권위를 높여 주고 백성들에게는 경외심을 심어 주었다.<\/li><li>유리를 통한 트인 시야는 감시와 통제를 쉽게 만들어, 건축물 자체가 사람들의 복종을 이끌어 내는 권력의 집행자 역할을 했다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Historical palaces incorporated glass to visually emphasize the ruler&#39;s elevated status, and it functioned as a strategic tool for surveillance to enforce absolute authority.<\/div>\n              <div class=\"lec-final-sum-ko\">역사적인 궁전들은 통치자의 높은 지위를 시각적으로 강조하기 위해 유리를 활용했으며, 이는 절대 권력을 강제하기 위한 감시의 전략적 도구로 기능했다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./33_audio/1.mp3","hl":null}],[{"audio":"./33_audio/2.mp3","hl":null}],[{"audio":"./33_audio/3.mp3","hl":null},{"audio":"./33_audio/4.mp3","hl":"stage-0"},{"audio":"./33_audio/5.mp3","hl":"stage-1"},{"audio":"./33_audio/6.mp3","hl":"stage-2"},{"audio":"./33_audio/7.mp3","hl":"stage-3"}],[{"audio":"./33_audio/8.mp3","hl":null}],[{"audio":"./33_audio/9.mp3","hl":"main"},{"audio":"./33_audio/10.mp3","hl":"meaning"},{"audio":"./33_audio/11.mp3","hl":"grammar"}],[{"audio":"./33_audio/12.mp3","hl":"main"},{"audio":"./33_audio/13.mp3","hl":"meaning"},{"audio":"./33_audio/14.mp3","hl":"grammar"}],[{"audio":"./33_audio/15.mp3","hl":"main"},{"audio":"./33_audio/16.mp3","hl":"meaning"},{"audio":"./33_audio/17.mp3","hl":"grammar"}],[{"audio":"./33_audio/18.mp3","hl":"main"},{"audio":"./33_audio/19.mp3","hl":"meaning"},{"audio":"./33_audio/20.mp3","hl":"grammar"}],[{"audio":"./33_audio/21.mp3","hl":"main"},{"audio":"./33_audio/22.mp3","hl":"meaning"},{"audio":"./33_audio/23.mp3","hl":"grammar"}],[{"audio":"./33_audio/24.mp3","hl":"main"},{"audio":"./33_audio/25.mp3","hl":"meaning"},{"audio":"./33_audio/26.mp3","hl":"grammar"}],[{"audio":"./33_audio/27.mp3","hl":"main"},{"audio":"./33_audio/28.mp3","hl":"meaning"},{"audio":"./33_audio/29.mp3","hl":"grammar"}],[{"audio":"./33_audio/30.mp3","hl":"main"},{"audio":"./33_audio/31.mp3","hl":"meaning"},{"audio":"./33_audio/32.mp3","hl":"grammar"}],[{"audio":"./33_audio/33.mp3","hl":"main"},{"audio":"./33_audio/34.mp3","hl":"meaning"},{"audio":"./33_audio/35.mp3","hl":"grammar"}],[{"audio":"./33_audio/36.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_33번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 33번","titleEn":"Glass in Palaces: A Strategic Tool for Absolute Authority","titleKo":"궁전의 유리: 절대 권력을 위한 전략적 도구","imageUrl":"__enpImg__","stages":[{"label":"01궁전과 유리의 도입","items":["궁전은 권력을 과시하는 무대였으며, 유리는 가시성이라는 강력한 수단을 제공했습니다.","궁전은 인상을 주고 위협하기 위해 설계된 무대(stages)","돌이 영속성을 상징한다면 유리는 가시성(visibility)을 제공"]},{"label":"02시각을 통한 위계질서","items":["큰 창문을 통해 통치자와 백성의 시선이 교차하며 권위와 거리감을 형성했습니다.","통치자: 백성을 내려다보며 높은 지위(elevated position) 강조","백성: 통치자를 올려다보며 경외심(awe)과 거리감 형성"]},{"label":"03절대 권력의 시각화 사례","items":["베르사유 궁전의 거울의 방은 유리가 왕의 권력을 어떻게 극대화하는지 보여줍니다.","베르사유 궁전의 거울의 방(Hall of Mirrors) 활용","공간의 웅장함을 키우고 왕의 절대 권력(absolute authority)을 강화"]},{"label":"04감시와 사회적 통제","items":["유리는 단순한 미적 요소가 아니라 감시를 통해 사회적 행동을 규제하는 전략적 도구였습니다.","개방된 시야를 통한 감시(surveillance)와 안전 확보","관찰당하고 있음을 의식하게 하여 방문자의 복종(obedience) 유도","유리가 권력 역학(power dynamic)의 무언의 집행자로 작용"]}],"bkg":"본격적인 지문을 읽기 전에 건축과 권력(Architecture and Power)의 관계를 먼저 생각해보면 좋은데, 마치 학교에서 교장 선생님의 집무실 유리창 너머로 운동장이 훤히 내다보이는 구조처럼 건축물은 단순한 거주 공간을 넘어 권력을 통제하는 도구가 되기도 합니다. 특히 17세기 유럽의 절대 왕정(Absolute Monarchy) 시대에는 지문에 등장하는 베르사유 궁전(Palace of Versailles)처럼 거대한 건축물이 통치자의 절대적인 힘을 과시하는 무대 역할을 했어요. 당시 매우 귀했던 건축 자재인 유리는 공간을 화려하게 만드는 것을 넘어, 지배자가 피지배자를 한눈에 파악하는 시각적 감시(Visual Surveillance)의 수단으로 전략적으로 활용되었습니다. 이는 철학자 미셸 푸코가 권력과 통제를 설명하기 위해 차용한 판옵티콘(Panopticon)이라는 일망 감시 시설 이론과도 깊이 연결되는데, 누군가 항상 자신을 지켜보고 있다는 가시성(Visibility)이 사람들의 순종(Obedience)을 자연스럽게 이끌어내기 때문이지요. 이처럼 건축물의 구조와 유리가 어떻게 사람들의 행동을 조종하고 권력 역학(Power Dynamic)을 형성하는지 그 철학적, 역사적 배경을 염두에 두고 글을 읽어보시면 숨은 의미를 훨씬 흥미롭게 이해하실 수 있을 거예요.","ttsText":"본격적인 지문을 읽기 전에 건축과 권력(Architecture and Power)의 관계를 먼저 생각해보면 좋은데, 마치 학교에서 교장 선생님의 집무실 유리창 너머로 운동장이 훤히 내다보이는 구조처럼 건축물은 단순한 거주 공간을 넘어 권력을 통제하는 도구가 되기도 합니다. 특히 17세기 유럽의 절대 왕정(Absolute Monarchy) 시대에는 지문에 등장하는 베르사유 궁전(Palace of Versailles)처럼 거대한 건축물이 통치자의 절대적인 힘을 과시하는 무대 역할을 했어요. 당시 매우 귀했던 건축 자재인 유리는 공간을 화려하게 만드는 것을 넘어, 지배자가 피지배자를 한눈에 파악하는 시각적 감시(Visual Surveillance)의 수단으로 전략적으로 활용되었습니다. 이는 철학자 미셸 푸코가 권력과 통제를 설명하기 위해 차용한 판옵티콘(Panopticon)이라는 일망 감시 시설 이론과도 깊이 연결되는데, 누군가 항상 자신을 지켜보고 있다는 가시성(Visibility)이 사람들의 순종(Obedience)을 자연스럽게 이끌어내기 때문이지요. 이처럼 건축물의 구조와 유리가 어떻게 사람들의 행동을 조종하고 권력 역학(Power Dynamic)을 형성하는지 그 철학적, 역사적 배경을 염두에 두고 글을 읽어보시면 숨은 의미를 훨씬 흥미롭게 이해하실 수 있을 거예요.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 33번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 33번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고2 / 2025년 / 10월 / 33번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고2 / 2025년 / 10월 / 33번","titleEn":"Glass in Palaces: A Strategic Tool for Absolute Authority","titleKo":"궁전의 유리: 절대 권력을 위한 전략적 도구","imageUrl":"__enpImg__","stages":[{"label":"01궁전과 유리의 도입","items":["궁전은 권력을 과시하는 무대였으며, 유리는 가시성이라는 강력한 수단을 제공했습니다.","궁전은 인상을 주고 위협하기 위해 설계된 무대(stages)","돌이 영속성을 상징한다면 유리는 가시성(visibility)을 제공"]},{"label":"02시각을 통한 위계질서","items":["큰 창문을 통해 통치자와 백성의 시선이 교차하며 권위와 거리감을 형성했습니다.","통치자: 백성을 내려다보며 높은 지위(elevated position) 강조","백성: 통치자를 올려다보며 경외심(awe)과 거리감 형성"]},{"label":"03절대 권력의 시각화 사례","items":["베르사유 궁전의 거울의 방은 유리가 왕의 권력을 어떻게 극대화하는지 보여줍니다.","베르사유 궁전의 거울의 방(Hall of Mirrors) 활용","공간의 웅장함을 키우고 왕의 절대 권력(absolute authority)을 강화"]},{"label":"04감시와 사회적 통제","items":["유리는 단순한 미적 요소가 아니라 감시를 통해 사회적 행동을 규제하는 전략적 도구였습니다.","개방된 시야를 통한 감시(surveillance)와 안전 확보","관찰당하고 있음을 의식하게 하여 방문자의 복종(obedience) 유도","유리가 권력 역학(power dynamic)의 무언의 집행자로 작용"]}],"bkg":"본격적인 지문을 읽기 전에 건축과 권력(Architecture and Power)의 관계를
