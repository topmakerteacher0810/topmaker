@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 29번","audioDir":"29_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">29번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>The Genetic Recipe for Evolution: Mutation and Natural Selection\u003c/h1>\u003ch2>진화의 유전적 처방전: 돌연변이와 자연 선택\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>세포 분열 시 발생하는 \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">변이\u003c/b>가 생존과 번식 가능성에 미치는 영향에 따라 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">선택\u003c/b>됨으로써 생명체가 진화한다는 원리를 설명하고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Evolution is driven by a continuous cycle of genetic mutations and natural selection, where beneficial or neutral changes persist while harmful ones are eliminated.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 생명 과학의 핵심 원리인 진화가 어떻게 일어나는지 아주 명쾌하게 설명해 주는 지문을 함께 공부할 거예요. 이 글은 세포가 분열할 때 생기는 작은 실수들이 어떻게 거대한 진화의 역사를 만드는지 보여줍니다. 오늘 수업을 통해 돌연변이와 자연 선택이라는 두 가지 핵심 키워드를 완벽하게 잡아볼게요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">세포가 자신과 똑같은 복사본을 만드는 복제 과정은 완벽하지 않아서 때때로 \u003cb class=\"key\">유전체\u003c/b>(genome)에 오류가 생기는데, 이를 \u003cb class=\"key\">돌연변이\u003c/b>(mutation)라고 합니다. 이 과정은 마치 요리 레시피를 손으로 베껴 쓰다가 오타가 나는 것과 비슷한데, 이 오타가 맛을 더 좋게 할 수도 있고 아무런 영향을 주지 않을 수도 있지만 때로는 요리를 완전히 망치기도 합니다. 생물학에서는 이렇게 우연히 발생한 변화 중 생존에 유리한 특징들이 다음 세대로 전달되는 과정을 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">선택\u003c/b>(natural selection)이라고 부릅니다. 이러한 과정이 수없이 반복되면서 생물은 환경에 더 잘 적응하는 방향으로 \u003cb class=\"key\">진화\u003c/b>(evolution)하게 됩니다. 즉, 무작위적인 실수가 생명의 다양성과 발전을 이끄는 원동력이 되는 셈입니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 시작하기 전에 배경지식을 조금 쌓아볼까요? 우리 몸의 세포는 계속해서 복제되지만, 복사기가 늘 완벽할 수는 없죠. 이때 생기는 오류를 전문 용어로 Mutation, 즉 돌연변이라고 해요. 대부분의 돌연변이는 아무런 영향이 없거나 해롭지만, 아주 드물게 생존에 유리한 변화를 만들기도 합니다. 이렇게 무작위로 생긴 변화들 중에서 환경에 적응하기 유리한 것들만 살아남아 다음 세대로 이어지는 것을 바로 Natural Selection, 자연 선택이라고 부릅니다. 이 과정이 수만 년 동안 반복되면 우리가 아는 진화가 일어나는 것이죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>유전적 오류의 발생\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>세포 분열 시 발생하는 \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">오류\u003c/b>를 소개하며, 이것이 세포에 미치는 세 가지 가능성(이로운 변화, 무해한 변화, 치명적인 손상)을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>변이의 영속성 결정\u003csmall>전개 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>각 유형의 실수가 대물림되는 \u003cb class=\"key\">영속성\u003c/b>의 차이를 설명하며, 이로운 변화는 번식 가능성을 높이고 해로운 변화는 소멸된다는 점을 \u003cb class=\"key\">대조\u003c/b>합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>진화의 메커니즘\u003csmall>결론 · 문장 7\u003c/small>\u003c/h4>\u003cp>변이와 자연 선택의 반복을 통해 유기체가 환경에 적응하고 \u003cb class=\"key\">진화\u003c/b>하는 최종적인 결과를 도출합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 세포 분열의 오류로 시작해서 그 오류가 어떤 운명을 맞이하는지, 그리고 마지막에 그것이 진화로 어떻게 연결되는지 순서대로 설명하고 있어요.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장부터 세 번째 문장까지는 세포 분열 시 발생하는 유전적 오류의 세 가지 가능성을 보여줍니다. 딸세포의 유전체가 모세포와 완전히 똑같지 않다는 사실을 짚어준 뒤, 그것이 이로운 변화일 수도, 별 차이가 없을 수도, 혹은 핵심 단백질 서열을 망가뜨리는 심각한 손상일 수도 있다고 설명하죠.","hl":"f0"},{"n":5,"text":"두 번째 단계인 네 번째 문장에서 여섯 번째 문장에서는 이 오류들이 다음 세대로 이어지는 영속성에 대해 이야기해요. 생존과 번식에 유리한 첫 번째 유형은 당연히 계속 유지되겠지만, 중립적인 유형은 운에 따르고, 심각한 손상을 주는 유형은 세포가 죽어버리면서 자손 없이 사라지게 된다는 점을 대조해서 보여주고 있네요.","hl":"f1"},{"n":6,"text":"마지막 단계인 일곱 번째 문장은 이 글의 결론이에요. 이러한 돌연변이와 자연 선택의 순환이 끊임없이 반복되면서 유기체가 진화한다는 점을 강조합니다. 결국 유전적 특성이 변화하면서 환경을 더 잘 활용하고 경쟁에서 살아남아 번식할 수 있는 새로운 길을 찾게 되는 것이죠.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과 및 분류\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">세포 분열 중 생기는 실수의 유형을 세 가지로 \u003cb class=\"key\">분류\u003c/b>하여 그 결과를 설명한 뒤, 이러한 과정의 반복이 \u003cb class=\"key\">진화\u003c/b>를 만든다는 인과적 결론을 내리고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (3)\u003c/b>\u003cspan>심각한 손상의 경우로 화제 전환\u003c/span>\u003cb>because (4)\u003c/b>\u003cspan>이로운 변화가 지속되는 이유 설명\u003c/span>\u003cb>Through (7)\u003c/b>\u003cspan>앞서 언급된 모든 과정의 수단적 요약 및 결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">error\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mistakes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Changes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mutation\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>이로운/중립적 변화\u003c/th>\u003cth>심각한 손상(해로운 변화)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>번식 가능성 증가 또는 유지\u003c/td>\u003ctd>세포 사망 및 자손 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>다음 세대로 영속됨\u003c/td>\u003ctd>어느 곳에도 닿지 못함(소멸)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글의 전개 방식은 크게 두 가지로 볼 수 있어요. 먼저 돌연변이의 결과를 세 가지 유형으로 나누어 설명하는 분류의 방식이 쓰였고요. 마지막 문장에서 그 모든 과정의 결과를 진화로 연결하는 인과 구조를 취하고 있습니다. 글의 결론이 마지막에 강조되는 미괄식 구성이라고 할 수 있죠.","hl":"ty"},{"n":8,"text":"문장 간의 연결 고리를 보면, 세 번째 문장의 But은 앞서 말한 긍정적이거나 중립적인 변화와는 다른 심각한 손상의 경우를 소개합니다. 네 번째 문장의 because는 왜 이로운 변화가 지속되는지 이유를 친절하게 설명해 주죠. 마지막 일곱 번째 문장의 Through는 앞선 모든 과정을 도구 삼아 진화라는 최종 결론을 이끌어내는 강력한 신호어 역할을 합니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>divide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>분열하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>genome\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유전체\u003c/span>\u003c/div>\u003cdiv>\u003cb>identical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>일치하는, 동일한\u003c/span>\u003c/div>\u003cdiv>\u003cb>parent cell\u003c/b>\u003cem>명사\u003c/em>\u003cspan>모세포\u003c/span>\u003c/div>\u003cdiv>\u003cb>rare occasion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>드문 경우\u003c/span>\u003c/div>\u003cdiv>\u003cb>represent\u003c/b>\u003cem>동사\u003c/em>\u003cspan>나타내다, 의미하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>for the better\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>더 나은 쪽으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>probably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>아마도, 높은 확률로\u003c/span>\u003c/div>\u003cdiv>\u003cb>significant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중대한, 상당한\u003c/span>\u003c/div>\u003cdiv>\u003cb>prospect\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전망\u003c/span>\u003c/div>\u003cdiv>\u003cb>disrupt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>방해하다, 망가뜨리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>coding sequence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>코딩 서열\u003c/span>\u003c/div>\u003cdiv>\u003cb>tend to\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~하는 경향이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>perpetuate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>영속시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>altered\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>변화된\u003c/span>\u003c/div>\u003cdiv>\u003cb>likelihood\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가능성\u003c/span>\u003c/div>\u003cdiv>\u003cb>reproduce\u003c/b>\u003cem>동사\u003c/em>\u003cspan>복제하다, 번식하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>neutral\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>중립적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>matter of chance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>운의 문제\u003c/span>\u003c/div>\u003cdiv>\u003cb>suffer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>겪다, 고통받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>progeny\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자손\u003c/span>\u003c/div>\u003cdiv>\u003cb>mutation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>돌연변이\u003c/span>\u003c/div>\u003cdiv>\u003cb>natural selection\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자연 선택\u003c/span>\u003c/div>\u003cdiv>\u003cb>evolve\u003c/b>\u003cem>동사\u003c/em>\u003cspan>진화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>specification\u003c/b>\u003cem>명사\u003c/em>\u003cspan>명세(서), 특성\u003c/span>\u003c/div>\u003cdiv>\u003cb>exploit\u003c/b>\u003cem>동사\u003c/em>\u003cspan>활용하다, 이용하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>environment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경\u003c/span>\u003c/div>\u003cdiv>\u003cb>competition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경쟁\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"여기서 중요한 단어 몇 개만 짚어볼게요. genome은 유전체라는 뜻이고요. perpetuate는 어떤 상태를 영속시키다, 즉 계속 이어지게 한다는 아주 중요한 동사입니다. 그리고 progeny는 자손이라는 뜻인데, 이 단어가 쓰인 문맥을 통해 생존과 번식의 중요성을 이해할 수 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">identical\u003c/b>\u003cspan class=\"m\">동일한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">alike\u003c/span>\u003cspan class=\"s\">same\u003c/span>\u003cspan class=\"s\">equal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">different\u003c/span>\u003cspan class=\"a\">distinct\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">perpetuate\u003c/b>\u003cspan class=\"m\">영속시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">maintain\u003c/span>\u003cspan class=\"s\">preserve\u003c/span>\u003cspan class=\"s\">sustain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discontinue\u003c/span>\u003cspan class=\"a\">halt\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">significant\u003c/b>\u003cspan class=\"m\">중대한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">considerable\u003c/span>\u003cspan class=\"s\">substantial\u003c/span>\u003cspan class=\"s\">important\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">minor\u003c/span>\u003cspan class=\"a\">trivial\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">disrupt\u003c/b>\u003cspan class=\"m\">망가뜨리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disturb\u003c/span>\u003cspan class=\"s\">interrupt\u003c/span>\u003cspan class=\"s\">upset\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">organize\u003c/span>\u003cspan class=\"a\">assist\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">exploit\u003c/b>\u003cspan class=\"m\">활용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">utilize\u003c/span>\u003cspan class=\"s\">employ\u003c/span>\u003cspan class=\"s\">harness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">waste\u003c/span>\u003cspan class=\"a\">ignore\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어와 반의어도 함께 정리해 봐요. identical은 동일하다는 뜻이라 same이나 equal과 바꿔 쓸 수 있지만, different와는 반대말이겠죠. exploit은 활용하다라는 뜻으로 utilize나 employ와 같은 맥락에서 쓰입니다. perpetuate라는 단어는 지속시킨다는 뜻이니 maintain이나 sustain과 비슷하고, 중단하다라는 뜻의 discontinue와는 반대되는 개념입니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세포가 분열할 때,\u003c/span>\u003cspan class=\"en\">When a cell divides,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 두 딸세포들의 유전체들은\u003c/span>\u003cspan class=\"en\">the genomes of its two daughters\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 완전히 일치하지는 않는다\u003c/span>\u003cspan class=\"en\">are often \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">quite \u003c/span>\u003cspan class=\"tgt\">identical\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로 간에도, 또는 그것과도\u003c/span>\u003cspan class=\"en\">to each other or to \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모세포의.\u003c/span>\u003cspan class=\"en\">of the parent cell.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">세포가 분열할 때, 그것의 두 딸세포들의 유전체들은 종종 서로 간에도, 또는 모세포의 그것과도 완전히 일치하지는 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 세포 분열 시 발생하는 \u003cb class=\"key\">복제 \u003c/b>\u003cb class=\"key\">오류\u003c/b>로 인해 자손 세포의 유전자가 부모와 달라질 수 있음을 설명합니다. 이 문장은 글 전체의 주제인 \u003cb class=\"key\">돌연변이\u003c/b>의 발생 원인을 제시하는 도입부 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부분 부정\u003c/span> : not [부정어] + quite [전체/완전 의미 부사] : \"완전히 일치하지는 않는다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">지시대명사\u003c/span> : that [단수 명사 반복 회피] : \"그것 (유전체)\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"When a cell divides, 세포가 분열할 때. the genomes of its two daughters, 그것의 두 딸세포들의 유전체들은. are often not quite identical, 종종 완전히 일치하지는 않는다. to each other or to that, 서로 간에도, 또는 그것과도. of the parent cell, 모세포의.. 이 문장 전체를 해석하면, 세포가 분열할 때, 그것의 두 딸세포들의 유전체들은 종종 서로 간에도, 또는 모세포의 그것과도 완전히 일치하지는 않는다.","hl":"m"},{"n":12,"text":"세포가 복제될 때 완벽하게 똑같이 복사되지 않고 복제 오류가 발생할 수 있다는 점을 강조하는 문장이에요. 이 사소한 차이가 나중에 진화의 밑거름이 되는 돌연변이의 시작점이 된다는 사실을 기억하세요.","hl":"mn"},{"n":13,"text":"첫 번째 포인트는 not quite identical 입니다. 완전히 똑같지는 않다는 부분 부정을 써서 어느 정도의 차이가 발생함을 나타냈죠. 두 번째는 that 입니다. 반복을 싫어하는 영어의 특성상 앞의 the genome을 다시 쓰지 않고 지시대명사 that으로 아주 깔끔하게 처리했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">드물게\u003c/span>\u003cspan class=\"en\">On rare occasions,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 오류가 더 나은 것으로의 변화를 나타낼 수도 있지만;\u003c/span>\u003cspan class=\"en\">the error \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">represent\u003c/span> a change for the better;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 높은 확률로,\u003c/span>\u003cspan class=\"en\">more probably,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 큰 차이를 일으키지 않을 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">it\u003c/span> will cause no significant difference\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세포의 전망에.\u003c/span>\u003cspan class=\"en\">in the cell's prospects.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">드물게 그 오류가 더 나은 것으로의 변화를 나타낼 수도 있지만, 더 높은 확률로 그것은 세포의 전망에 큰 차이를 일으키지 않을 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 복제 과정의 오류가 생존에 \u003cb class=\"key\">유리한 \u003c/b>\u003cb class=\"key\">영향\u003c/b>을 주거나, 혹은 별다른 영향을 주지 않는 \u003cb class=\"key\">중립적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 될 수 있음을 보여줍니다. 대부분의 변이는 생명 활동에 큰 지장이 없는 수준에서 머무른다는 점을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">추측의 조동사\u003c/span> : may [조동사] + represent [동사원형] : \"나타낼 수도 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사\u003c/span> : it [앞 문장의 명사 지칭] : \"그것 (그 오류)\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"On rare occasions, 드물게. the error may represent a change for the better, 그 오류가 더 나은 것으로의 변화를 나타낼 수도 있지만;. more probably, 더 높은 확률로. it will cause no significant difference, 그것은 큰 차이를 일으키지 않을 것이다. in the cell's prospects, 세포의 전망에.. 이 문장 전체를 해석하면, 드물게 그 오류가 더 나은 것으로의 변화를 나타낼 수도 있지만, 더 높은 확률로 그것은 세포의 전망에 큰 차이를 일으키지 않을 것이다.","hl":"m"},{"n":15,"text":"오류가 나서 더 좋아지는 경우는 아주 희박하다는 뜻이에요. 보통은 아무 일도 안 일어나거나 별 차이가 없는 중립적인 상태로 남는 경우가 훨씬 많다는 현실적인 상황을 설명하고 있죠.","hl":"mn"},{"n":16,"text":"첫 번째로 may represent를 볼게요. 조동사 may를 써서 그럴 수도 있다는 약한 추측을 표현했는데, 이는 이로운 변화가 아주 가끔 일어난다는 점을 잘 보여줍니다. 두 번째 it은 앞에서 말한 복제 과정의 error를 가리키는 대명사라는 점에 유의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 어떤 경우에는\u003c/span>\u003cspan class=\"en\">But in some cases,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 오류가 심각한 손상을 초래할 것이다\u003c/span>\u003cspan class=\"en\">the error will cause serious damage;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예를 들어\u003c/span>\u003cspan class=\"en\">for example,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">코딩 서열을 망가뜨림으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">disrupting\u003c/span> the coding sequence\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">핵심 단백질의.\u003c/span>\u003cspan class=\"en\">for a key protein.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 어떤 경우에는 그 오류가 심각한 손상을 초래할 것이다. 예를 들어 핵심 단백질의 코딩 서열을 망가뜨림으로써 그렇게 할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오류가 항상 무해한 것은 아니며, 생존에 필수적인 \u003cb class=\"key\">단백질 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 파괴하는 \u003cb class=\"key\">치명적인 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 초래할 수 있음을 경고합니다. 이는 나중에 언급될 '자연 선택'에 의해 제거될 대상을 설명하는 근거가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수단·방법의 전치사구\u003c/span> : by [전치사] + disrupting [동명사] : \"망가뜨림으로써\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"But in some cases, 그러나 어떤 경우에는. the error will cause serious damage, 그 오류가 심각한 손상을 초래할 것이다. for example, 예를 들어. by disrupting the coding sequence, 코딩 서열을 망가뜨림으로써. for a key protein, 핵심 단백질의.. 이 문장 전체를 해석하면, 그러나 어떤 경우에는 그 오류가 심각한 손상을 초래할 것이다. 예를 들어 핵심 단백질의 코딩 서열을 망가뜨림으로써 그렇게 할 것이다.","hl":"m"},{"n":18,"text":"앞선 문장들과 반대로 이번에는 오류가 아주 치명적일 때를 설명해요. 생명 유지에 꼭 필요한 단백질 정보가 꼬여버리면 세포 자체가 위험해질 수 있다는 무서운 경고를 담고 있습니다.","hl":"mn"},{"n":19,"text":"중요한 포인트는 by disrupting입니다. 수단이나 방법을 나타내는 전치사 by 뒤에 동명사 disrupting을 써서, 어떻게 손상을 입히는지를 구체적으로 묘사했죠. 단백질 설계도인 서열을 엉망으로 만든다는 의미를 생생하게 전달합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">첫 번째 유형의 실수로 인한 변화들은\u003c/span>\u003cspan class=\"en\">Changes due to mistakes of the first type\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영속되는 경향이 있을 것인데,\u003c/span>\u003cspan class=\"en\">will tend to \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">perpetuated\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변화가 일어난 세포가\u003c/span>\u003cspan class=\"en\">because the altered cell\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">높아진 가능성을 가지고 있기 때문이다\u003c/span>\u003cspan class=\"en\">has an increased likelihood\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">스스로를 복제할\u003c/span>\u003cspan class=\"en\">of reproducing \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">itself\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">첫 번째 유형의 실수로 인한 변화들은 영속되는 경향이 있을 것인데, 변화가 일어난 세포가 스스로를 복제할 높아진 가능성을 가지고 있기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유리한 돌연변이인 첫 번째 유형은 세포의 생존과 복제에 도움을 주어, 그 특성이 사라지지 않고 후대에 계속 전달되는 \u003cb class=\"key\">영속성\u003c/b>을 갖게 됨을 의미합니다. 이는 생물학적 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">선택\u003c/b>의 과정을 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 수동태\u003c/span> : tend + to be p.p. : \"영속되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사의 재귀적 용법\u003c/span> : reproduce [타동사] + itself [목적어] : \"스스로를\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Changes due to mistakes of the first type, 첫 번째 유형의 실수로 인한 변화들은. will tend to be perpetuated, 영속되는 경향이 있을 것인데. because the altered cell, 변화가 일어난 세포가. has an increased likelihood, 높아진 가능성을 가지고 있기 때문이다. of reproducing itself, 스스로를 복제할. 이 문장 전체를 해석하면, 첫 번째 유형의 실수로 인한 변화들은 영속되는 경향이 있을 것인데, 변화가 일어난 세포가 스스로를 복제할 높아진 가능성을 가지고 있기 때문이다.","hl":"m"},{"n":21,"text":"유리한 돌연변이가 일어나면 세포가 더 잘 생존하고 복제됩니다. 그래서 이 유익한 변화는 사라지지 않고 다음 세대로 영원히 이어지는 영속성을 갖게 된다는 의미예요.","hl":"mn"},{"n":22,"text":"첫 번째로 be perpetuated는 수동태 부정사로 변화가 영속되는 대상임을 나타냅니다. 두 번째로 itself는 주어인 세포가 다시 자기 자신을 복제하는 것이므로 재귀대명사를 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 번째 유형의 실수로 인한 변화들,\u003c/span>\u003cspan class=\"en\">Changes due to mistakes of the second type\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉, ‘중립적인’ 변화들은\u003c/span>\u003cspan class=\"en\">― neutral changes ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영속될 수도 있고 아닐 수도 있다.\u003c/span>\u003cspan class=\"en\">may be perpetuated or not:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">운의 문제이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">matter \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">chance \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">변화가 일어난 세포나 그것의 사촌들이 성공할지는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">whether \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">altered \u003c/span>\u003cspan class=\"tgt\">cell \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">its \u003c/span>\u003cspan class=\"tgt\">cousins\u003c/span> will succeed.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">두 번째 유형의 실수로 인한 변화들, 즉, ‘중립적인’ 변화들은 영속될 수도 있고 아닐 수도 있다. 변화가 일어난 세포나 그것의 사촌들이 성공할지는 운의 문제이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 중립적인 변화는 이득도 손해도 주지 않기 때문에, 그 특성이 보존될지 여부는 생물학적 적응도가 아닌 순수한 \u003cb class=\"key\">우연\u003c/b>이나 \u003cb class=\"key\">운의 \u003c/b>\u003cb class=\"key\">문제\u003c/b>에 달려 있다는 뜻입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어-진주어 구문\u003c/span> : it [가주어] + is ~ + whether 절 [진주어] : \"~할지는 운의 문제이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">접속사 whether (A or B)\u003c/span> : whether + A + or + B : \"세포나 그것의 사촌들이 ~할지\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Changes due to mistakes of the second type, 두 번째 유형의 실수로 인한 변화들. ― neutral changes ―, 즉, ‘중립적인’ 변화들은. may be perpetuated or not, 영속될 수도 있고 아닐 수도 있다.. it is a matter of chance, 운의 문제이다. whether the altered cell or its cousins will succeed, 변화가 일어난 세포나 그것의 사촌들이 성공할지는. 이 문장 전체를 해석하면, 두 번째 유형의 실수로 인한 변화들, 즉, ‘중립적인’ 변화들은 영속될 수도 있고 아닐 수도 있다. 변화가 일어난 세포나 그것의 사촌들이 성공할지는 운의 문제이다.","hl":"m"},{"n":24,"text":"중립적인 변화는 생존에 이득도 해도 되지 않아요. 그래서 이 특징이 계속 남을지는 생물학적 우수성이 아니라 단순히 운의 문제에 달려 있다는 설명입니다.","hl":"mn"},{"n":25,"text":"첫 번째로 it은 가주어이고 whether 이하가 진주어로 쓰인 명사절입니다. 두 번째로 whether A or B 구조는 에이 또는 비라는 선택의 의미를 나타내죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 심각한 손상을 초래하는 변화들은\u003c/span>\u003cspan class=\"en\">But \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">changes \u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">cause\u003c/span> serious damage\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어느 곳에도 닿지 못한다.\u003c/span>\u003cspan class=\"en\">lead nowhere:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들을 겪는 세포는 죽고,\u003c/span>\u003cspan class=\"en\">the cell that suffers them dies,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자손을 남기지 않기 때문이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">leaving \u003c/span>\u003cspan class=\"tgt\">no \u003c/span>\u003cspan class=\"tgt\">progeny\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 심각한 손상을 초래하는 변화들은 어느 곳에도 닿지 못한다. 그것들을 겪는 세포는 죽고, 자손을 남기지 않기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 해로운 변화는 세포를 죽게 하여 대가 끊기게 하므로, 그 유전 정보는 후대에 전달되지 못하고 진화적 \u003cb class=\"key\">막다른 \u003c/b>\u003cb class=\"key\">길\u003c/b>에 이르게 됨을 \u003cb class=\"key\">lead \u003c/b>\u003cb class=\"key\">nowhere\u003c/b>라는 표현으로 비유했습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : changes [선행사] + that [관계사/주어] + cause [동사] : \"초래하는 변화들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : [주절] , + [v-ing (분사)] : \"자손을 남기지 않으며\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"But changes that cause serious damage, 그러나 심각한 손상을 초래하는 변화들은. lead nowhere, 어느 곳에도 닿지 못한다.. the cell that suffers them dies, 그것들을 겪는 세포는 죽고. leaving no progeny, 자손을 남기지 않기 때문이다.. 이 문장 전체를 해석하면, 그러나 심각한 손상을 초래하는 변화들은 어느 곳에도 닿지 못한다. 그것들을 겪는 세포는 죽고, 자손을 남기지 않기 때문이다.","hl":"m"},{"n":27,"text":"해로운 변화는 세포를 죽게 만듭니다. 결국 그 유전적 결함은 다음 세대로 전달되지 못하고 진화적 막다른 길에 다다르게 된다는 뜻이에요.","hl":"mn"},{"n":28,"text":"첫 번째로 that은 주격 관계대명사로 변화를 수식하고 있어요. 두 번째로 leaving은 분사구문으로 세포가 죽은 결과 자손을 남기지 못하게 됨을 부연 설명합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 ‘돌연변이’와 ‘자연 선택’의 순환의 끊임없는 반복을 통해\u003c/span>\u003cspan class=\"en\">Through endless repetition of this cycle of mutation and natural selection\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유기체들은 진화한다:\u003c/span>\u003cspan class=\"en\">organisms evolve:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 유전적 특성들은 변화해서,\u003c/span>\u003cspan class=\"en\">their genetic specifications change,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유기체에게 새로운 길들을 때로는 제공한다\u003c/span>\u003cspan class=\"en\">sometimes \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">giving\u003c/span> organisms new ways\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">환경을 더 효과적으로 활용하고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">exploit \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">environment \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">effectively, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 것들과의 경쟁 속에서 살아남으며,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">survive \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">competition \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">others, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그리고 성공적으로 번식할 수 있는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">reproduce \u003c/span>\u003cspan class=\"tgt\">successfully\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 ‘돌연변이’와 ‘자연 선택’의 순환의 끊임없는 반복을 통해 유기체들은 진화한다. 그들의 유전적 특성들은 변화해서, 유기체에게 환경을 더 효과적으로 활용하고, 다른 것들과의 경쟁 속에서 살아남으며, 그리고 성공적으로 번식할 수 있는 새로운 길들을 때로는 제공한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급한 세포 분열 시 발생하는 오류인 \u003cb class=\"key\">돌연변이\u003c/b>와 그 결과가 생존에 유리할 때 살아남는 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">선택\u003c/b>이 반복되며 진화가 일어난다는 결론입니다. 유전적 변화가 환경에 적응하고 \u003cb class=\"key\">번식\u003c/b>하는 데 도움을 주어 생명체가 발전하게 됨을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 분사구문 (결과)\u003c/span> : 주절, + giving [분사/v-ing] : \"제공하면서 (제공한다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법과 병렬 구조\u003c/span> : new ways + [to exploit ... , to survive ... , and to reproduce ...] : \"활용하고, 살아남으며, 번식할 수 있는 (새로운 길들)\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"Through endless repetition of this cycle of mutation and natural selection, 이러한 ‘돌연변이’와 ‘자연 선택’의 순환의 끊임없는 반복을 통해. organisms evolve, 유기체들은 진화한다:. their genetic specifications change, 그들의 유전적 특성들은 변화해서. sometimes giving organisms new ways, 유기체에게 새로운 길들을 때로는 제공한다. to exploit the environment more effectively, 환경을 더 효과적으로 활용하고. to survive in competition with others, 다른 것들과의 경쟁 속에서 살아남으며. and to reproduce successfully, 그리고 성공적으로 번식할 수 있는.. 이 문장 전체를 해석하면, 이러한 ‘돌연변이’와 ‘자연 선택’의 순환의 끊임없는 반복을 통해 유기체들은 진화한다. 그들의 유전적 특성들은 변화해서, 유기체에게 환경을 더 효과적으로 활용하고, 다른 것들과의 경쟁 속에서 살아남으며, 그리고 성공적으로 번식할 수 있는 새로운 길들을 때로는 제공한다.","hl":"m"},{"n":30,"text":"이 문장은 전체 지문의 결론에 해당합니다. 앞에서 본 돌연변이와 자연 선택이라는 사이클이 무수히 반복되면서 결국 생명체는 진화라는 것을 하게 되죠. 유전 정보가 바뀌면서 환경에 더 잘 적응하고 경쟁에서 이겨 번식까지 성공하는 유리한 고지를 점하게 된다는 진화의 핵심 원리를 정리하고 있습니다.","hl":"mn"},{"n":31,"text":"중요한 어법 포인트를 짚어볼게요. 첫 번째로 giving은 콤마 뒤에 나온 분사구문으로 앞선 유전적 변화가 가져온 결과를 보충 설명합니다. 제공하면서 혹은 제공하여 라고 해석하면 자연스러워요. 두 번째로 new ways라는 명사 뒤에 세 개의 to부정사가 나열되어 있어요. to exploit, to survive, 그리고 마지막 to reproduce가 and로 묶인 병렬 구조입니다. 이 세 가지 모두가 유기체가 살아남는 새로운 길들을 수식하고 있답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>세포 분열 시 유전체는 모세포나 다른 딸세포와 완벽히 일치하지 않는 \u003cb class=\"key\">돌연변이\u003c/b>가 자주 발생합니다.\u003c/li>\u003cli>유전적 오류는 이로운 변화, 차이가 없는 \u003cb class=\"key\">중립적 \u003c/b>\u003cb class=\"key\">변화\u003c/b>, 혹은 심각한 손상을 주는 변화로 나뉩니다.\u003c/li>\u003cli>이로운 변화는 번식 가능성을 높여 \u003cb class=\"key\">영속성\u003c/b>을 갖게 되지만, 해로운 변화는 자손을 남기지 못하고 사라집니다.\u003c/li>\u003cli>변이와 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">선택\u003c/b>의 무수한 반복을 통해 유기체는 환경에 적응하며 \u003cb class=\"key\">진화\u003c/b>하게 됩니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Evolution is driven by a continuous cycle of genetic mutations and natural selection, where beneficial or neutral changes persist while harmful ones are eliminated.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">세포 분열 시 발생하는 \u003cb class=\"key\">유전적 \u003c/b>\u003cb class=\"key\">변이\u003c/b>가 생존과 번식 가능성에 미치는 영향에 따라 \u003cb class=\"key\">자연 \u003c/b>\u003cb class=\"key\">선택\u003c/b>됨으로써 생명체가 진화한다는 원리를 설명하고 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":32,"text":"자, 오늘 내용을 정리해 볼까요? 진화는 결코 우연히 한 번에 일어나는 것이 아닙니다. 세포 분열의 작은 실수인 Mutation이 발생하고, 그것이 생존에 유리한지 아닌지에 따라 Natural Selection이 작동하는 과정이 반복된 결과물이죠. 여러분도 공부할 때 한 번의 완벽함보다는 작은 시도와 수정을 반복하며 발전해 나가는 진화의 과정을 겪으시길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
