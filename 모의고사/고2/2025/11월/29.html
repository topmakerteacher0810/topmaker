g\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01세포 분열과 오류 발생<\/div><ul><li>세포가 분열할 때 유전체가 완전히 동일하지 않은 유전적 오류가 발생한다.<\/li><li>세포 분열(cell division) 시 유전체(genomes) 차이 발생<\/li><li>부모 세포와 자식 세포 간의 불일치 발생<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02유전적 오류의 세 가지 유형<\/div><ul><li>발생한 오류는 세포의 생존 전망에 미치는 영향에 따라 세 가지로 나뉜다.<\/li><li>더 나은 긍정적 변화(change for the better)<\/li><li>큰 차이가 없는 중립적 변화(neutral changes)<\/li><li>핵심 단백질 서열을 망치는 심각한 손상(serious damage)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03오류 유형에 따른 생존 결과<\/div><ul><li>돌연변이의 성격에 따라 세포가 생존하여 유전될 가능성이 결정된다.<\/li><li>긍정적 변화: 번식 가능성이 커져 유전적 특성이 영구화(perpetuated)됨<\/li><li>중립적 변화: 유전 여부가 전적으로 우연(chance)에 좌우됨<\/li><li>심각한 손상: 세포가 죽어 자손(progeny)을 남기지 못하고 소멸함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04자연선택과 생물의 진화<\/div><ul><li>돌연변이와 자연선택의 과정이 끊임없이 반복되며 생물체는 진화한다.<\/li><li>돌연변이(mutation)와 자연선택(natural selection)의 무한한 순환<\/li><li>유전적 특성의 변화로 생물이 진화(evolve)함<\/li><li>환경 활용, 생존 경쟁(competition), 성공적 번식 능력이 향상됨<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">divide<\/td><td class=\"m\">분열하다, 나누어지다<\/td><\/tr><tr><td class=\"w\">genome<\/td><td class=\"m\">유전체, 게놈<\/td><\/tr><tr><td class=\"w\">identical<\/td><td class=\"m\">동일한, 똑같은<\/td><\/tr><tr><td class=\"w\">change for the better<\/td><td class=\"m\">더 나은 쪽으로의 변화, 개선<\/td><\/tr><tr><td class=\"w\">prospect<\/td><td class=\"m\">가망, 전망, 가능성<\/td><\/tr><tr><td class=\"w\">disrupt<\/td><td class=\"m\">지장을 주다, 방해하다<\/td><\/tr><tr><td class=\"w\">perpetuate<\/td><td class=\"m\">영구화하다, 지속시키다<\/td><\/tr><tr><td class=\"w\">likelihood<\/td><td class=\"m\">가능성<\/td><\/tr><tr><td class=\"w\">neutral<\/td><td class=\"m\">중립적인, 영향을 미치지 않는<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">a matter of chance<\/td><td class=\"m\">운의 문제, 우연의 문제<\/td><\/tr><tr><td class=\"w\">lead nowhere<\/td><td class=\"m\">아무런 결과도 낳지 못하다, 무의미하다<\/td><\/tr><tr><td class=\"w\">progeny<\/td><td class=\"m\">자손, 후손<\/td><\/tr><tr><td class=\"w\">mutation<\/td><td class=\"m\">돌연변이<\/td><\/tr><tr><td class=\"w\">natural selection<\/td><td class=\"m\">자연 선택<\/td><\/tr><tr><td class=\"w\">organism<\/td><td class=\"m\">유기체, 생물<\/td><\/tr><tr><td class=\"w\">evolve<\/td><td class=\"m\">진화하다, 발달하다<\/td><\/tr><tr><td class=\"w\">specification<\/td><td class=\"m\">특성, 명세<\/td><\/tr><tr><td class=\"w\">exploit<\/td><td class=\"m\">이용하다, 활용하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When a cell divides,<\/b><\/span><span class=\"ko\">세포가 분열할 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the genomes of its two daughters<\/b><\/span><span class=\"ko\">그것의 두 딸세포들의 유전체들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are often not quite identical<\/b><\/span><span class=\"ko\">종종 완전히 일치하지는 않는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to each other<\/b><\/span><span class=\"ko\">서로 간에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or to <span class=\"grammar-hl\">that of the parent cell<\/span>.<\/b><\/span><span class=\"ko\">또는 모세포의 그것과도<\/span><\/div><\/div><div class=\"lec-sent-ko\">세포가 분열할 때, 그것의 두 딸세포들의 유전체들은 종종 서로 간에도, 또는 모세포의 그것과도 완전히 일치하지는 않는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로서 세포 분열 시 발생하는 돌연변이(유전적 오류)를 소개합니다. the genomes of its two daughters는 부모 세포에서 분열되어 나온 두 개의 새로운 세포가 가진 전체 유전자 집합을 가리킵니다. 세포가 복제될 때 원본과 완벽하게 똑같지 않은 상태로 태어나는 현상이 진화의 출발점이 됨을 알려줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that of the parent cell 대명사 that: 앞에 나온 명사의 반복을 피하기 위해 쓰인 대명사이다. 딸세포들은 두 개이므로 복수형 genomes를 썼으나, 부모 세포의 유전체는 단수 개념이므로 단수형 대명사 that(the genome)으로 받았다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">divide<\/td><td class=\"m\">분열하다, 나누어지다<\/td><\/tr><tr><td class=\"w\">genome<\/td><td class=\"m\">유전체, 게놈<\/td><\/tr><tr><td class=\"w\">identical<\/td><td class=\"m\">동일한, 똑같은<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>On rare occasions,<\/b><\/span><span class=\"ko\">드물게,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the error<\/b><\/span><span class=\"ko\">그 오류가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>may represent a change <span class=\"grammar-hl\">for the better<\/span>;<\/b><\/span><span class=\"ko\">더 나은 것으로의 변화를 나타낼 수도 있지만;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>more probably,<\/b><\/span><span class=\"ko\">더 높은 확률로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it<\/b><\/span><span class=\"ko\">그것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>will cause no significant difference<\/b><\/span><span class=\"ko\">큰 차이를 일으키지 않을 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the cell’s prospects.<\/b><\/span><span class=\"ko\">세포의 전망에<\/span><\/div><\/div><div class=\"lec-sent-ko\">드물게 그 오류가 더 나은 것으로의 변화를 나타낼 수도 있지만, 더 높은 확률로 그것은 세포의 전망에 큰 차이를 일으키지 않을 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급된 &#39;복제 오류&#39;가 가져오는 세 가지 결과 중 두 가지를 설명합니다. a change for the better는 환경에 더 잘 적응하게 만드는 긍정적인 돌연변이를 의미하며, cause no significant difference in the cell’s prospects는 세포가 살아가는 데 유리하지도 불리하지도 않은 중립적인 변화라는 뜻입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">for the better (관용표현): &#39;더 나은 방향으로, 호전되어&#39;라는 의미로 쓰이는 굳어진 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">change for the better<\/td><td class=\"m\">더 나은 쪽으로의 변화, 개선<\/td><\/tr><tr><td class=\"w\">prospect<\/td><td class=\"m\">가망, 전망, 가능성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But in some cases,<\/b><\/span><span class=\"ko\">그러나 어떤 경우에는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the error<\/b><\/span><span class=\"ko\">그 오류가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>will cause serious damage;<\/b><\/span><span class=\"ko\">심각한 손상을 초래할 것이다;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for example,<\/b><\/span><span class=\"ko\">예를 들어,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">by disrupting<\/span> the coding sequence for a key protein.<\/b><\/span><span class=\"ko\">핵심 단백질의 코딩 서열을 망가뜨림으로써<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러나 어떤 경우에는 그 오류가 심각한 손상을 초래할 것이다. 예를 들어 핵심 단백질의 코딩 서열을 망가뜨림으로써 그렇게 할 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> &#39;오류&#39;가 가져오는 마지막 세 번째 결과인 치명적인 돌연변이를 소개합니다. disrupting the coding sequence for a key protein은 생존에 필수적인 단백질을 만들어내는 유전 암호 체계를 망가뜨려 세포가 정상적으로 기능하지 못하게 만든다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">by disrupting (동명사): -ing가 전치사 by의 목적어 역할을 하는 명사적 개념으로 쓰였다. &#39;by + 동명사&#39; 구조로 &#39;~함으로써&#39;를 뜻한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">disrupt<\/td><td class=\"m\">지장을 주다, 방해하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Changes due to mistakes of the first type<\/b><\/span><span class=\"ko\">첫 번째 유형의 실수로 인한 변화들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>will tend <span class=\"grammar-hl\">to be perpetuated<\/span>,<\/b><\/span><span class=\"ko\">영속되는 경향이 있을 것인데,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because the <span class=\"grammar-hl\">altered<\/span> cell<\/b><\/span><span class=\"ko\">변화가 일어난 세포가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>has an <span class=\"grammar-hl\">increased<\/span> likelihood <span class=\"grammar-hl\">of reproducing<\/span> itself.<\/b><\/span><span class=\"ko\">스스로를 복제할 높아진 가능성을 가지고 있기 때문이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">첫 번째 유형의 실수로 인한 변화들은 영속되는 경향이 있을 것인데, 변화가 일어난 세포가 스스로를 복제할 높아진 가능성을 가지고 있기 때문이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 2번 문장 앞부분에서 언급한 긍정적 변화의 결과를 자세히 서술합니다. mistakes of the first type은 생존과 번식에 유리하게 작용한 오류를 가리키며, 이런 오류를 가진 세포가 살아남아 새끼를 많이 치기 때문에 그 유전적 특징이 자손 대대로 이어진다는 뜻을 tend to be perpetuated로 표현했습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to be perpetuated to부정사(명사적) 및 수동태: 동사 tend의 목적어 자리에 쓰였으므로 명사적 용법이다. perpetuate는 타동사(기본구조: perpetuate + O(목적어))인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.)인 to be perpetuated 형태로 쓴다.<\/div><div class=\"lec-gr-item\">altered (과거분사(형용사적)): altered가 뒤의 명사 cell을 수식하여 &#39;변화된 세포(= cell that is altered)&#39;라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">increased (과거분사(형용사적)): increased가 뒤의 명사 likelihood를 수식하여 &#39;증가된 가능성&#39;이라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">of reproducing (동명사): -ing가 전치사 of의 목적어 역할을 하는 명사적 개념으로 쓰여 likelihood의 내용을 동격처럼 설명한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">change for the better<\/td><td class=\"m\">더 나은 쪽으로의 변화, 개선<\/td><\/tr><tr><td class=\"w\">perpetuate<\/td><td class=\"m\">영구화하다, 지속시키다<\/td><\/tr><tr><td class=\"w\">likelihood<\/td><td class=\"m\">가능성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Changes due to mistakes of the second type<\/b><\/span><span class=\"ko\">두 번째 유형의 실수로 인한 변화들<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>― neutral changes ―<\/b><\/span><span class=\"ko\">즉, 중립적인 변화들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">may be perpetuated<\/span> or not:<\/b><\/span><span class=\"ko\">영속될 수도 있고 아닐 수도 있다:<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">it is a matter of chance<\/span><\/b><\/span><span class=\"ko\">운의 문제이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">whether the altered cell or its cousins<\/span><\/b><\/span><span class=\"ko\">변화가 일어난 세포나 그것의 사촌들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">will succeed<\/span>.<\/b><\/span><span class=\"ko\">성공할지는<\/span><\/div><\/div><div class=\"lec-sent-ko\">두 번째 유형의 실수로 인한 변화들, 즉, ‘중립적인’ 변화들은 영속될 수도 있고 아닐 수도 있다. 변화가 일어난 세포나 그것의 사촌들이 성공할지는 운의 문제이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 2번 문장 뒷부분에서 언급한 중립적 변화의 결과를 다룹니다. 이 유전적 변화는 생존율에 아무런 영향을 주지 않으므로, 이 특징이 살아남아 후대에 전해질지 여부는 순전히 a matter of chance, 곧 생명체의 우수성과 무관하게 환경적 운과 우연에 의해 결정된다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">may be perpetuated (수동태): be동사(be) + p.p.(perpetuated) 구조. perpetuate는 타동사(기본구조: perpetuate + O(목적어))인데 뒤에 목적어가 없어서 수동구조 be perpetuated 형태로 쓴다.<\/div><div class=\"lec-gr-item\">it is a matter of chance whether the altered cell or its cousins will succeed (가주어): 진주어: it은 구조상 주어 자리를 채우는 가주어이고, whether 이하의 명사절이 문장의 진짜 주어(진주어) 역할을 한다.<\/div><div class=\"lec-gr-item\">altered (과거분사(형용사적)): altered가 뒤의 명사 cell을 수식하여 &#39;변화된 세포&#39;라는 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">change for the better<\/td><td class=\"m\">더 나은 쪽으로의 변화, 개선<\/td><\/tr><tr><td class=\"w\">perpetuate<\/td><td class=\"m\">영구화하다, 지속시키다<\/td><\/tr><tr><td class=\"w\">neutral<\/td><td class=\"m\">중립적인, 영향을 미치지 않는<\/td><\/tr><tr><td class=\"w\">a matter of chance<\/td><td class=\"m\">운의 문제, 우연의 문제<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But changes <span class=\"grammar-hl\">that cause serious damage<\/span><\/b><\/span><span class=\"ko\">그러나 심각한 손상을 초래하는 변화들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>lead nowhere:<\/b><\/span><span class=\"ko\">어느 곳에도 닿지 못한다:<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the cell <span class=\"grammar-hl\">that suffers them<\/span><\/b><\/span><span class=\"ko\">그것들을 겪는 세포는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>dies,<\/b><\/span><span class=\"ko\">죽는다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">leaving no progeny<\/span>.<\/b><\/span><span class=\"ko\">자손을 남기지 않고<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러나 심각한 손상을 초래하는 변화들은 어느 곳에도 닿지 못한다. 그것들을 겪는 세포는 죽고, 자손을 남기지 않기 때문이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 3번 문장에서 언급한 치명적 변화의 결과를 서술합니다. lead nowhere는 그 유전적 변화가 다음 세대로 전달되지 못하고 그 대에서 완전히 끊겨버린다는 뜻입니다. 해로운 유전자가 자연스럽게 도태되는 과정을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that cause serious damage (관계대명사): that은 주격 관계대명사로 앞의 선행사 changes를 수식하며, 관계대명사절 내부에서 주어 역할을 한다.<\/div><div class=\"lec-gr-item\">that suffers them (관계대명사): that은 주격 관계대명사로 앞의 선행사 the cell을 수식하며, 관계대명사절 내부에서 주어 역할을 한다.<\/div><div class=\"lec-gr-item\">leaving no progeny (분사구문): leaving은 부사적 기능으로 쓰인 현재분사(분사구문)이다. 원래 절인 &#39;and it leaves no progeny&#39;에서 접속사(and)와 주어(it)가 생략되고 동사가 -ing 형태로 변환된 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">change for the better<\/td><td class=\"m\">더 나은 쪽으로의 변화, 개선<\/td><\/tr><tr><td class=\"w\">lead nowhere<\/td><td class=\"m\">아무런 결과도 낳지 못하다, 무의미하다<\/td><\/tr><tr><td class=\"w\">progeny<\/td><td class=\"m\">자손, 후손<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Through endless repetition<\/b><\/span><span class=\"ko\">끊임없는 반복을 통해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of this cycle of mutation and natural selection<\/b><\/span><span class=\"ko\">이러한 돌연변이와 자연 선택의 순환의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>organisms evolve:<\/b><\/span><span class=\"ko\">유기체들은 진화한다:<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>their genetic specifications change,<\/b><\/span><span class=\"ko\">그들의 유전적 특성들은 변화해서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>sometimes <span class=\"grammar-hl\">giving<\/span> organisms new ways<\/b><\/span><span class=\"ko\">때로는 유기체에게 새로운 길들을 제공한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to exploit the environment more effectively<\/span>,<\/b><\/span><span class=\"ko\">환경을 더 효과적으로 활용하고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to survive in competition with others<\/span>,<\/b><\/span><span class=\"ko\">다른 것들과의 경쟁 속에서 살아남으며,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">to reproduce successfully<\/span>.<\/b><\/span><span class=\"ko\">그리고 성공적으로 번식할 수 있는<\/span><\/div><\/div><div class=\"lec-sent-ko\">이러한 ‘돌연변이’와 ‘자연 선택’의 순환의 끊임없는 반복을 통해 유기체들은 진화한다. 그들의 유전적 특성들은 변화해서, 유기체에게 환경을 더 효과적으로 활용하고, 다른 것들과의 경쟁 속에서 살아남으며, 그리고 성공적으로 번식할 수 있는 새로운 길들을 때로는 제공한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 전체 글의 결론입니다. 앞서 설명한 세 가지 오류의 결과들이 누적되고 선택되는 과정을 통해 결국 진화가 일어남을 요약합니다. cycle of mutation and natural selection은 생물학적 진화의 핵심 원리로, 유전자 복제 과정에서 무작위로 오류가 발생한 뒤 살아남기에 유리한 것만 대를 이어 번식하는 전체 과정을 통틀어 가리킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">giving (분사구문): giving은 부사적 기능으로 쓰인 현재분사(분사구문)이다. 원래 절인 &#39;and they give organisms new ways&#39;에서 접속사(and)와 주어(they)가 생략되고 동사가 -ing 형태로 변환된 구조이다. give는 &#39;give + IO + DO&#39;의 4형식 구조로 쓰였다.<\/div><div class=\"lec-gr-item\">to exploit the environment more effectively (to부정사(형용사적)): 명사 ways의 내용을 한정하여 &#39;~할 방법&#39;으로 수식하는 형용사적 용법이다. ways + to V 구조로 형용사 역할을 한다.<\/div><div class=\"lec-gr-item\">to survive in competition with others (to부정사(형용사적)): 앞의 명사 ways를 한정하여 수식하는 형용사적 용법으로, 뒤의 to reproduce와 병렬 구조를 이룬다.<\/div><div class=\"lec-gr-item\">to reproduce successfully (to부정사(형용사적)): 앞의 명사 ways를 한정하여 수식하는 형용사적 용법으로, 접속사 and로 연결되어 앞선 to부정사들과 병렬 구조를 이룬다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">change for the better<\/td><td class=\"m\">더 나은 쪽으로의 변화, 개선<\/td><\/tr><tr><td class=\"w\">mutation<\/td><td class=\"m\">돌연변이<\/td><\/tr><tr><td class=\"w\">natural selection<\/td><td class=\"m\">자연 선택<\/td><\/tr><tr><td class=\"w\">organism<\/td><td class=\"m\">유기체, 생물<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evolve<\/td><td class=\"m\">진화하다, 발달하다<\/td><\/tr><tr><td class=\"w\">specification<\/td><td class=\"m\">특성, 명세<\/td><\/tr><tr><td class=\"w\">exploit<\/td><td class=\"m\">이용하다, 활용하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>세포 분열 과정에서 유전체가 완전히 동일하게 복제되지 않는 오류(돌연변이)가 발생한다.<\/li><li>이 오류는 생존에 유리한 변화, 아무 영향이 없는 중립적 변화, 치명적인 손상이라는 세 가지 결과를 낳는다.<\/li><li>생존에 유리한 변화는 번식을 통해 후대로 계속 이어지지만, 치명적 손상을 입은 세포는 죽어 자손을 남기지 못한다.<\/li><li>생명체는 이렇게 유전적 오류가 무작위로 발생하고 환경에 적합한 것만 살아남는 과정을 끝없이 반복하며 진화한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Through the endless cycle of genetic mutations and natural selection, organisms evolve by perpetuating beneficial changes and eliminating harmful ones.<\/div>\n              <div class=\"lec-final-sum-ko\">유전자 돌연변이와 자연선택의 끝없는 순환을 통해, 생명체는 유익한 변화를 보존하고 해로운 것을 제거함으로써 진화한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./29_audio/1.mp3","hl":null}],[{"audio":"./29_audio/2.mp3","hl":null}],[{"audio":"./29_audio/3.mp3","hl":null},{"audio":"./29_audio/4.mp3","hl":"stage-0"},{"audio":"./29_audio/5.mp3","hl":"stage-1"},{"audio":"./29_audio/6.mp3","hl":"stage-2"},{"audio":"./29_audio/7.mp3","hl":"stage-3"}],[{"audio":"./29_audio/8.mp3","hl":null}],[{"audio":"./29_audio/9.mp3","hl":"main"},{"audio":"./29_audio/10.mp3","hl":"meaning"},{"audio":"./29_audio/11.mp3","hl":"grammar"}],[{"audio":"./29_audio/12.mp3","hl":"main"},{"audio":"./29_audio/13.mp3","hl":"meaning"},{"audio":"./29_audio/14.mp3","hl":"grammar"}],[{"audio":"./29_audio/15.mp3","hl":"main"},{"audio":"./29_audio/16.mp3","hl":"meaning"},{"audio":"./29_audio/17.mp3","hl":"grammar"}],[{"audio":"./29_audio/18.mp3","hl":"main"},{"audio":"./29_audio/19.mp3","hl":"meaning"},{"audio":"./29_audio/20.mp3","hl":"grammar"}],[{"audio":"./29_audio/21.mp3","hl":"main"},{"audio":"./29_audio/22.mp3","hl":"meaning"},{"audio":"./29_audio/23.mp3","hl":"grammar"}],[{"audio":"./29_audio/24.mp3","hl":"main"},{"audio":"./29_audio/25.mp3","hl":"meaning"},{"audio":"./29_audio/26.mp3","hl":"grammar"}],[{"audio":"./29_audio/27.mp3","hl":"main"},{"audio":"./29_audio/28.mp3","hl":"meaning"},{"audio":"./29_audio/29.mp3","hl":"grammar"}],[{"audio":"./29_audio/30.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_29번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 29번","titleEn":"Evolution: The Endless Cycle of Mutation and Natural Selection","titleKo":"진화: 돌연변이와 자연선택의 끝없는 순환","imageUrl":"__enpImg__","stages":[{"label":"01세포 분열과 오류 발생","items":["세포가 분열할 때 유전체가 완전히 동일하지 않은 유전적 오류가 발생한다.","세포 분열(cell division) 시 유전체(genomes) 차이 발생","부모 세포와 자식 세포 간의 불일치 발생"]},{"label":"02유전적 오류의 세 가지 유형","items":["발생한 오류는 세포의 생존 전망에 미치는 영향에 따라 세 가지로 나뉜다.","더 나은 긍정적 변화(change for the better)","큰 차이가 없는 중립적 변화(neutral changes)","핵심 단백질 서열을 망치는 심각한 손상(serious damage)"]},{"label":"03오류 유형에 따른 생존 결과","items":["돌연변이의 성격에 따라 세포가 생존하여 유전될 가능성이 결정된다.","긍정적 변화: 번식 가능성이 커져 유전적 특성이 영구화(perpetuated)됨","중립적 변화: 유전 여부가 전적으로 우연(chance)에 좌우됨","심각한 손상: 세포가 죽어 자손(progeny)을 남기지 못하고 소멸함"]},{"label":"04자연선택과 생물의 진화","items":["돌연변이와 자연선택의 과정이 끊임없이 반복되며 생물체는 진화한다.","돌연변이(mutation)와 자연선택(natural selection)의 무한한 순환","유전적 특성의 변화로 생물이 진화(evolve)함","환경 활용, 생존 경쟁(competition), 성공적 번식 능력이 향상됨"]}],"bkg":"이 지문을 완벽하게 이해하시려면 생명체의 설계도라 할 수 있는 유전체(Genome)가 복제되는 과정에서 발생하는 돌연변이(Mutation)의 개념을 알아두시면 좋은데, 이는 마치 요리 레시피를 손으로 베껴 쓰다가 우연히 글자를 잘못 적는 실수와 같습니다. 이 작은 실수 때문에 음식을 완전히 망칠 수도 있고 맛에 아무런 변화가 없을 수도 있지만, 아주 가끔은 실수 덕분에 오히려 전보다 훨씬 더 맛있는 기적의 레시피가 탄생하기도 하죠. 생물학에서는 이러한 현상을 바탕으로 환경에 유리한 특징을 가진 개체만이 살아남아 자손을 퍼뜨린다는 자연선택(Natural Selection) 이론을 설명합니다. 결국 찰스 다윈이 정립한 이 위대한 개념은 오랜 시간 동안 이러한 우연한 복제 오류와 생존 경쟁이 끊임없이 반복
