ec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01측정 단위의 도입<\/div><ul><li>물리학에서 사용하는 측정 단위는 대상을 설명하기 위한 도구 중 하나이다.<\/li><li>설명적 장치(descriptive device)로서의 측정 단위(units of measure)<\/li><li>물리학(physics)에서 현상을 기술할 때 흔히 사용됨<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02공간 거리의 사례<\/div><ul><li>거리를 측정할 때 어떤 단위를 쓰든 물리적 법칙은 동일하게 유지된다.<\/li><li>피트(feet)나 미터(meters) 등 편의(convenience)에 따라 단위 선택 가능<\/li><li>측정된 특정 수치(numerical value)는 단위 선택의 결과일 뿐임<\/li><li>세상에 독립적으로 존재하는 절대적 수치가 아님<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03온도 척도의 사례<\/div><ul><li>온도 역시 거리 측정과 마찬가지로 척도를 바꾸어도 물리학적 본질은 변하지 않는다.<\/li><li>화씨, 섭씨, 켈빈 척도(scale) 등 다양하게 적용 가능<\/li><li>척도를 전환해도 물리학에는 아무런 변화가 없음(nothing changes)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04단위와 척도의 결론<\/div><ul><li>물리학에서 척도를 선택하는 것은 현상 설명을 위한 임의적인 결정이다.<\/li><li>척도 선택은 설명에 있어서의 자의적 선택(arbitrary choice)에 불과함<\/li><li>단위에 따라 결정되는 모든 특징들은 척도 의존적(scale-dependent)임<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">descriptive<\/td><td class=\"m\">서술하는, 묘사적인<\/td><\/tr><tr><td class=\"w\">device<\/td><td class=\"m\">방법, 방책, 도구<\/td><\/tr><tr><td class=\"w\">be familiar with<\/td><td class=\"m\">~에 익숙하다, ~을 잘 알다<\/td><\/tr><tr><td class=\"w\">spatial<\/td><td class=\"m\">공간적인, 공간의<\/td><\/tr><tr><td class=\"w\">in terms of<\/td><td class=\"m\">~의 단위로, ~의 관점에서<\/td><\/tr><tr><td class=\"w\">regardless<\/td><td class=\"m\">상관없이, 개의치 않고<\/td><\/tr><tr><td class=\"w\">conclude<\/td><td class=\"m\">결론을 내리다<\/td><\/tr><tr><td class=\"w\">prefer<\/td><td class=\"m\">선호하다<\/td><\/tr><tr><td class=\"w\">convenience<\/td><td class=\"m\">편의, 편리<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">feature<\/td><td class=\"m\">특징, 특성<\/td><\/tr><tr><td class=\"w\">depend on<\/td><td class=\"m\">~에 의존하다, ~에 달려 있다<\/td><\/tr><tr><td class=\"w\">numerical<\/td><td class=\"m\">수적인, 수로 나타낸<\/td><\/tr><tr><td class=\"w\">assign<\/td><td class=\"m\">부여하다, 할당하다<\/td><\/tr><tr><td class=\"w\">out there<\/td><td class=\"m\">저기 바깥에, 세상에 존재하는<\/td><\/tr><tr><td class=\"w\">apart from<\/td><td class=\"m\">~와는 별개로, ~을 제외하고<\/td><\/tr><tr><td class=\"w\">likewise<\/td><td class=\"m\">마찬가지로<\/td><\/tr><tr><td class=\"w\">scale<\/td><td class=\"m\">척도, 눈금<\/td><\/tr><tr><td class=\"w\">arbitrary<\/td><td class=\"m\">임의적인, 자의적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Consider units of measure,<\/b><\/span><span class=\"ko\">측정 단위들을 생각해 보라,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>one kind of descriptive device<\/b><\/span><span class=\"ko\">서술 장치의 한 종류인<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">we are familiar with using<\/span><\/b><\/span><span class=\"ko\">우리가 사용하는 것으로 익숙한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">in physics<\/span>.<\/b><\/span><span class=\"ko\">물리학에서<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리가 물리학에서 사용하는 것으로 익숙한 서술 장치의 한 종류인 측정 단위들을 생각해 보라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 글의 도입부로, 독자의 주의를 환기하며 &#39;측정 단위&#39;라는 핵심 주제를 제시합니다. descriptive device를 &#39;서술 장치&#39;라고 옮기면 어렵게 느껴집니다. 쉽게 말해 물리적 현상을 숫자로 나타내어 소통하기 위해 사람들이 만들어 낸 도구라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">we are familiar with using in physics 목적격 관계대명사 생략: 앞의 명사 device 뒤에 목적격 관계대명사 which나 that이 생략된 구조다. 생략된 관계대명사는 뒤에 이어지는 동명사 using의 목적어 역할을 하며, 절 전체가 device를 수식한다.<\/div><div class=\"lec-gr-item\">using 동명사(전치사의 목적어): 전치사 with의 목적어 역할을 하는 명사적 기능의 동명사다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">descriptive<\/td><td class=\"m\">서술하는, 묘사적인<\/td><\/tr><tr><td class=\"w\">device<\/td><td class=\"m\">방법, 방책, 도구<\/td><\/tr><tr><td class=\"w\">be familiar with<\/td><td class=\"m\">~에 익숙하다, ~을 잘 알다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Spatial distances <span class=\"grammar-hl\">can be given<\/span><\/b><\/span><span class=\"ko\">공간적인 거리는 주어질 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">in terms of<\/span> feet or meters or some other unit,<\/b><\/span><span class=\"ko\">피트, 미터 또는 어떤 다른 단위로 환산하여,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and the physics will be the same<\/b><\/span><span class=\"ko\">그리고 물리적 원리는 동일할 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>regardless.<\/b><\/span><span class=\"ko\">그와 관계없이<\/span><\/div><\/div><div class=\"lec-sent-ko\">공간적인 거리는 피트, 미터 또는 어떤 다른 단위로 환산하여 주어질 수 있으며, 그와 관계없이 물리적 원리는 동일할 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 제시한 측정 단위의 첫 번째 구체적인 예시(거리)입니다. 길이를 재는 단위를 다르게 쓴다고 해서 대상의 물리적 본질이 변하지 않는다는 점을 설명합니다. given in terms of는 &#39;~라는 기준으로 나타내다&#39;, 곧 &#39;~ 단위로 측정되어 표시되다&#39;라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">can be given (수동태): 조동사(can) + be동사(be) + p.p.(given) 구조. give는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 can be given 형태로 쓴다. 기본구조: give + O (O를 제시하다/나타내다).<\/div><div class=\"lec-gr-item\">in terms of (관용표현): &#39;~의 단위로, ~의 관점에서&#39;라는 뜻을 나타내는 전치사구다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spatial<\/td><td class=\"m\">공간적인, 공간의<\/td><\/tr><tr><td class=\"w\">in terms of<\/td><td class=\"m\">~의 단위로, ~의 관점에서<\/td><\/tr><tr><td class=\"w\">regardless<\/td><td class=\"m\">상관없이, 개의치 않고<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We conclude<\/b><\/span><span class=\"ko\">우리는 결론 내린다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from this<\/b><\/span><span class=\"ko\">이로부터<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> physics does not prefer one unit of length<\/b><\/span><span class=\"ko\">물리학이 하나의 길이 단위를 선호하지 않는다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>over any other,<\/b><\/span><span class=\"ko\">다른 어떤 것보다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and we may choose any one <span class=\"grammar-hl\">we like<\/span><\/b><\/span><span class=\"ko\">그리고 우리는 우리가 좋아하는 어떤 단위든 선택할 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for reasons of convenience.<\/b><\/span><span class=\"ko\">편의상의 이유로<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리는 이로부터 물리학이 하나의 길이 단위를 다른 어떤 것보다 선호하지 않는다고 결론 내리고, 그래서 편의상의 이유로 우리는 좋아하는 어떤 단위든 선택할 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 두 번째 문장의 거리 예시에서 도출한 첫 번째 결론입니다. 측정 단위는 자연이 정해준 것이 아니므로 우리가 편한 대로 골라 쓸 수 있다는 논리를 전개합니다. prefer one unit of length over any other는 자연의 법칙 자체가 특정 단위를 특별하게 취급하지 않고 모든 단위에 대해 동등하게 작동한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that 명사절 접속사: 타동사 conclude의 목적어 역할을 하는 완전한 명사절을 이끄는 접속사 that이다.<\/div><div class=\"lec-gr-item\">we like 목적격 관계대명사 생략: 대명사 any one 뒤에 목적격 관계대명사 which나 that이 생략된 구조다. 생략된 관계대명사는 타동사 like의 목적어 역할을 하며, 뒤의 절이 any one을 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conclude<\/td><td class=\"m\">결론을 내리다<\/td><\/tr><tr><td class=\"w\">prefer<\/td><td class=\"m\">선호하다<\/td><\/tr><tr><td class=\"w\">convenience<\/td><td class=\"m\">편의, 편리<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We further conclude<\/b><\/span><span class=\"ko\">우리는 더 나아가 결론짓는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> any feature <span class=\"grammar-hl\">depending on that choice<\/span>,<\/b><\/span><span class=\"ko\">그 선택에 따른 어떠한 특성도,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>such as the particular numerical value<\/b><\/span><span class=\"ko\">특정한 수치적 값과 같이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">assigned<\/span> to the spatial separation between two locations,<\/b><\/span><span class=\"ko\">두 지점 사이의 공간적 분리에 부여된,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is not out there<\/b><\/span><span class=\"ko\">존재하는 것이 아니라고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the world<\/b><\/span><span class=\"ko\">세상 어딘가에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">apart from<\/span> a choice of unit.<\/b><\/span><span class=\"ko\">단위의 선택과 동떨어져<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리는 더 나아가 두 지점 사이의 공간적 분리에 부여된 특정한 수치적 값과 같이 그 선택에 따른 어떠한 특성도 단위의 선택과 동떨어져 세상 어딘가에 존재하는 것이 아니라고 결론짓는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 세 번째 문장에서 한 걸음 더 나아간 심화 결론입니다. 우리가 자로 재어 얻은 &#39;숫자&#39; 그 자체는 절대적인 진리가 아니라, 단지 우리가 고른 단위에 따라 결정된 결과물일 뿐임을 강조합니다. is not out there in the world는 어떤 수치가 객관적인 물리적 실체로서 자연계에 독립적으로 존재하는 것이 아님을 뜻합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that 명사절 접속사: 타동사 conclude의 목적어 역할을 하는 완전한 명사절을 이끄는 접속사 that이다.<\/div><div class=\"lec-gr-item\">depending on that choice (현재분사(형용사)): depending이 앞의 명사 feature를 수식(= 그 선택에 좌우되는 특징). 의미상 &#39;feature that depends&#39;의 구조가 축약된 형태다.<\/div><div class=\"lec-gr-item\">assigned (과거분사(형용사)): assigned가 앞의 명사 numerical value를 수식(= 할당된 특정 수치). 의미상 &#39;value that is/was assigned&#39;의 구조가 축약된 형태다.<\/div><div class=\"lec-gr-item\">apart from (관용표현): &#39;~와는 별개로, ~외에도&#39;라는 뜻을 나타내는 전치사구다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">spatial<\/td><td class=\"m\">공간적인, 공간의<\/td><\/tr><tr><td class=\"w\">conclude<\/td><td class=\"m\">결론을 내리다<\/td><\/tr><tr><td class=\"w\">feature<\/td><td class=\"m\">특징, 특성<\/td><\/tr><tr><td class=\"w\">depend on<\/td><td class=\"m\">~에 의존하다, ~에 달려 있다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">numerical<\/td><td class=\"m\">수적인, 수로 나타낸<\/td><\/tr><tr><td class=\"w\">assign<\/td><td class=\"m\">부여하다, 할당하다<\/td><\/tr><tr><td class=\"w\">out there<\/td><td class=\"m\">저기 바깥에, 세상에 존재하는<\/td><\/tr><tr><td class=\"w\">apart from<\/td><td class=\"m\">~와는 별개로, ~을 제외하고<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Temperatures <span class=\"grammar-hl\">can likewise be given<\/span><\/b><\/span><span class=\"ko\">온도도 마찬가지로 주어질 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">in terms of<\/span> the Fahrenheit or Celsius or Kelvin scale,<\/b><\/span><span class=\"ko\">화씨, 섭씨 또는 켈빈 척도로 환산하여,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and nothing in the physics changes<\/b><\/span><span class=\"ko\">그리고 물리적 원리의 어떠한 것도 변화하지 않는다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when we switch<\/b><\/span><span class=\"ko\">우리가 바꿀 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from one scale to another.<\/b><\/span><span class=\"ko\">하나의 척도에서 다른 것으로<\/span><\/div><\/div><div class=\"lec-sent-ko\">온도도 마찬가지로 화씨, 섭씨 또는 켈빈 척도로 환산하여 주어질 수 있으며, 우리가 하나의 척도에서 다른 것으로 바꾸더라도 물리적 원리의 어떠한 것도 변화하지 않는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 길이의 예시(문장 2)에 이어 온도라는 새로운 예시를 나란히 제시하여 앞선 논리를 단단하게 뒷받침합니다. likewise be given은 앞서 말한 거리 단위처럼 온도 역시 여러 가지 기준(척도)으로 측정되고 표시된다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">can likewise be given (수동태): 조동사(can) + 부사(likewise) + be동사(be) + p.p.(given) 구조. give는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 can likewise be given 형태로 쓴다. 기본구조: give + O (O를 제시하다/나타내다).<\/div><div class=\"lec-gr-item\">in terms of (관용표현): &#39;~의 단위로, ~의 관점에서&#39;라는 뜻을 나타내는 전치사구다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in terms of<\/td><td class=\"m\">~의 단위로, ~의 관점에서<\/td><\/tr><tr><td class=\"w\">likewise<\/td><td class=\"m\">마찬가지로<\/td><\/tr><tr><td class=\"w\">scale<\/td><td class=\"m\">척도, 눈금<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We conclude<\/b><\/span><span class=\"ko\">우리는 결론 내린다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that the choice<\/span> of scale is an arbitrary choice<\/b><\/span><span class=\"ko\">척도의 선택이 임의적인 선택이라는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in description,<\/b><\/span><span class=\"ko\">서술상의,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and that any feature<\/b><\/span><span class=\"ko\">그리고 어떠한 특성도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that depends<\/span> on that choice<\/b><\/span><span class=\"ko\">그 선택에 달린<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is scale-dependent.<\/b><\/span><span class=\"ko\">척도에 의존한다는 것을<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리는 척도의 선택이 서술상의 임의적인 선택이며, 그 선택에 달린 어떤 특성이든 척도에 의존한다는 결론을 내린다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 거리와 온도의 예시를 모두 아울러 글을 마무리하는 최종 결론입니다. 물리 현상을 나타내는 단위나 척도는 사람이 임의로 정한 것이고, 측정된 수치 역시 그 척도에 따라 좌우된다는 핵심 주장을 요약합니다. an arbitrary choice in description — 학술 글에서 이 어구는 자연 법칙이나 필연적인 이유가 있어서가 아니라, 단순히 사람들이 현상을 설명하기 위해 자의적으로 정한 방식임을 가리킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that the choice 명사절 접속사: 타동사 conclude의 목적어 역할을 하는 명사절을 이끄는 접속사 that이다. 문장 뒤에 나오는 &#39;and that any feature...&#39; 절과 목적어로서 병렬 구조를 이룬다.<\/div><div class=\"lec-gr-item\">that depends 주격 관계대명사: 뒤에 주어 없이 동사 depends가 이어지며, 앞의 선행사 any feature를 수식하는 관계대명사절을 이끈다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">conclude<\/td><td class=\"m\">결론을 내리다<\/td><\/tr><tr><td class=\"w\">feature<\/td><td class=\"m\">특징, 특성<\/td><\/tr><tr><td class=\"w\">depend on<\/td><td class=\"m\">~에 의존하다, ~에 달려 있다<\/td><\/tr><tr><td class=\"w\">scale<\/td><td class=\"m\">척도, 눈금<\/td><\/tr><tr><td class=\"w\">arbitrary<\/td><td class=\"m\">임의적인, 자의적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>물리학에서 사용하는 측정 단위나 척도는 현상을 설명하기 위해 인간이 만들어 낸 도구일 뿐이다.<\/li><li>거리(피트, 미터)나 온도(화씨, 섭씨)를 어떤 단위로 재든 물리적인 본질 자체는 전혀 바뀌지 않는다.<\/li><li>따라서 단위를 고르는 것은 그저 인간의 편의에 따른 자의적인 선택에 불과하다.<\/li><li>결국 측정된 구체적인 숫자(수치)는 자연계에 절대적으로 존재하는 실체가 아니라, 우리가 선택한 척도에 따라 달라지는 &#39;단위(척도) 의존적&#39;인 특징이다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Although physical reality remains unchanged regardless of the chosen measurement units, the specific numerical values describing it are entirely scale-dependent.<\/div>\n              <div class=\"lec-final-sum-ko\">선택된 측정 단위와 관계없이 물리적 현실은 변하지 않지만, 이를 설명하는 구체적인 수치는 전적으로 척도에 의존한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./35_audio/1.mp3","hl":null}],[{"audio":"./35_audio/2.mp3","hl":null}],[{"audio":"./35_audio/3.mp3","hl":null},{"audio":"./35_audio/4.mp3","hl":"stage-0"},{"audio":"./35_audio/5.mp3","hl":"stage-1"},{"audio":"./35_audio/6.mp3","hl":"stage-2"},{"audio":"./35_audio/7.mp3","hl":"stage-3"}],[{"audio":"./35_audio/8.mp3","hl":null}],[{"audio":"./35_audio/9.mp3","hl":"main"},{"audio":"./35_audio/10.mp3","hl":"meaning"},{"audio":"./35_audio/11.mp3","hl":"grammar"}],[{"audio":"./35_audio/12.mp3","hl":"main"},{"audio":"./35_audio/13.mp3","hl":"meaning"},{"audio":"./35_audio/14.mp3","hl":"grammar"}],[{"audio":"./35_audio/15.mp3","hl":"main"},{"audio":"./35_audio/16.mp3","hl":"meaning"},{"audio":"./35_audio/17.mp3","hl":"grammar"}],[{"audio":"./35_audio/18.mp3","hl":"main"},{"audio":"./35_audio/19.mp3","hl":"meaning"},{"audio":"./35_audio/20.mp3","hl":"grammar"}],[{"audio":"./35_audio/21.mp3","hl":"main"},{"audio":"./35_audio/22.mp3","hl":"meaning"},{"audio":"./35_audio/23.mp3","hl":"grammar"}],[{"audio":"./35_audio/24.mp3","hl":"main"},{"audio":"./35_audio/25.mp3","hl":"meaning"},{"audio":"./35_audio/26.mp3","hl":"grammar"}],[{"audio":"./35_audio/27.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_35번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 35번","titleEn":"Units of Measure: Arbitrary Choices in Describing Physical Reality","titleKo":"측정 단위: 물리적 현실을 설명하는 임의의 선택","imageUrl":"__enpImg__","stages":[{"label":"01측정 단위의 도입","items":["물리학에서 사용하는 측정 단위는 대상을 설명하기 위한 도구 중 하나이다.","설명적 장치(descriptive device)로서의 측정 단위(units of measure)","물리학(physics)에서 현상을 기술할 때 흔히 사용됨"]},{"label":"02공간 거리의 사례","items":["거리를 측정할 때 어떤 단위를 쓰든 물리적 법칙은 동일하게 유지된다.","피트(feet)나 미터(meters) 등 편의(convenience)에 따라 단위 선택 가능","측정된 특정 수치(numerical value)는 단위 선택의 결과일 뿐임","세상에 독립적으로 존재하는 절대적 수치가 아님"]},{"label":"03온도 척도의 사례","items":["온도 역시 거리 측정과 마찬가지로 척도를 바꾸어도 물리학적 본질은 변하지 않는다.","화씨, 섭씨, 켈빈 척도(scale) 등 다양하게 적용 가능","척도를 전환해도 물리학에는 아무런 변화가 없음(nothing changes)"]},{"label":"04단위와 척도의 결론","items":["물리학에서 척도를 선택하는 것은 현상 설명을 위한 임의적인 결정이다.","척도 선택은 설명에 있어서의 자의적 선택(arbitrary choice)에 불과함","단위에 따라 결정되는 모든 특징들은 척도 의존적(scale-dependent)임"]}],"bkg":"우리가 일상이나 과학에서 흔히 사용하는 측정 단위(Units of measure)는 대상의 본질을 바꾸지 않는 기술 장치(Descriptive device)에 불과하다는 사실을 알고 계신가요? 예를 들어, 여러분의 몸무게를 킬로그램(kg)으로 재든 파운드(lb)로 재든 실제 내 몸이라는 물리적 실재(Physical reality)는 전혀 변하지 않는 것처럼, 과학에서는 어떤 측정 체계를 선택하든 그것은 인간의 편의에 따른 임의적 선택(Arbitrary choice)일 뿐입니다. 따라서 특정 단위에 따라 달라지는 수치는 대상이 가진 우주적이고 고유한 성질이 아니라 단순히 우리가 선택한 기준에 기대고 있는 척도 의존성(Scale-dependent)을 띠게 됩니다. 마치 똑같은 양의 음료를 '그란데 사이즈'라고 부르든 '473밀리리터'라고 부르든 컵 안에 담긴 음료의 절대적인 양 자체는 그대로인 것과 같죠. 이 지문을 읽으실 때, 자연의 절대적인 현상과 인간이 세상을 묘사하기 위해 만든 관습적인 측정 도구 사이의 차이점을 미리 떠올려보시면 물리학에서 단위를 바라보는 철학적 관점을 훨씬 깊이 있게 이해하실 수 있을 거예요.","ttsText":"우리가 일상이나 과학에서 흔히 사용하는 측정 단위(Units of measure)는 대상의 본질을 바꾸지 않는 기술 장치(Descriptive device)에 불과하다는 사실을 알고 계신가요? 예를 들어, 여러분의 몸무게를 킬로그램(kg)으로 재든 파운드(lb)로 재든 실제 내 몸이라는 물리적 실재(Physical reality)는 전혀 변하지 않는 것처럼, 과학에서는 어떤 측정 체계를 선택하든 그것은 인간의 편의에 따른 임의적 선택(Arbitrary choice)일 뿐입니다. 따라서 특정 단위에 따라 달라지는 수치는 대상이 가진 우주적이고 고유한 성질이 아니라 단순히 우리가 선택한 기준에 기대고 있는 척도 의존성(Scale-dependent)을 띠게 됩니다. 마치 똑같은 양의 음료를 '그란데 사이즈'라고 부르든 '473밀리리터'라고 부르든 컵 안에 담긴 음료의 절대적인 양 자체는 그대로인 것과 같죠. 이 지문을 읽으실 때, 자연의 절대적인 현상과 인간이 세상을 묘사하기 위해 만든 관습적인 측정 도구 사이의 차이점을 미리 떠올려보시면 물리학에서 단위를 바라보는 철학적 관점을 훨씬 깊이 있게 이해하실 수 있을 거예요.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 35번","
