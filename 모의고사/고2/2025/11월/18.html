 신속한(promptly) 해결을 기대함<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">purchase<\/td><td class=\"m\">구매하다, 사다<\/td><\/tr><tr><td class=\"w\">a set of<\/td><td class=\"m\">일련의, 한 세트의<\/td><\/tr><tr><td class=\"w\">match<\/td><td class=\"m\">어울리다, 맞다<\/td><\/tr><tr><td class=\"w\">delivery<\/td><td class=\"m\">배달, 배송<\/td><\/tr><tr><td class=\"w\">ensure<\/td><td class=\"m\">반드시 ~하게 하다, 보장하다<\/td><\/tr><tr><td class=\"w\">available<\/td><td class=\"m\">시간이 있는, 이용할 수 있는<\/td><\/tr><tr><td class=\"w\">delay<\/td><td class=\"m\">지연, 지체<\/td><\/tr><tr><td class=\"w\">cause<\/td><td class=\"m\">야기하다, 초래하다<\/td><\/tr><tr><td class=\"w\">considerable<\/td><td class=\"m\">상당한, 많은<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">inconvenience<\/td><td class=\"m\">불편, 애로<\/td><\/tr><tr><td class=\"w\">specific<\/td><td class=\"m\">구체적인, 명확한<\/td><\/tr><tr><td class=\"w\">issue<\/td><td class=\"m\">문제, 쟁점<\/td><\/tr><tr><td class=\"w\">address<\/td><td class=\"m\">(문제를) 다루다, 해결하다<\/td><\/tr><tr><td class=\"w\">promptly<\/td><td class=\"m\">신속하게, 즉시<\/td><\/tr><tr><td class=\"w\">so that<\/td><td class=\"m\">~할 수 있도록, ~하기 위하여<\/td><\/tr><tr><td class=\"w\">reorganize<\/td><td class=\"m\">재조정하다, 재편성하다<\/td><\/tr><tr><td class=\"w\">confusion<\/td><td class=\"m\">혼란, 혼동<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">To the Customer Service Team,<\/span><\/b><\/span><span class=\"ko\">고객 서비스 팀께,<\/span><\/div><\/div><div class=\"lec-sent-ko\">고객 서비스 팀께,<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 글을 받는 대상을 밝히며 공식적인 항의나 요청을 위한 편지(이메일)를 시작하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">To the Customer Service Team, (전치사구): &#39;전치사(To) + 명사구&#39; 형태로 편지의 수신인을 나타내는 부사구 역할을 한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">About a month ago<\/span>,<\/b><\/span><span class=\"ko\">약 한 달 전,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>my wife and I purchased<\/b><\/span><span class=\"ko\">제 아내와 저는 구입했습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a set of bookshelves<\/b><\/span><span class=\"ko\">책장 한 세트를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from your store.<\/b><\/span><span class=\"ko\">귀하의 매장에서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">저희는 약 한 달 전 귀하의 매장에서 책장 한 세트를 구입했습니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 수신자를 밝힌 뒤, 자신이 매장의 고객임을 알리며 글을 쓰는 계기가 된 과거의 구매 사실을 제시하여 상황을 도입합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">About a month ago (부사구): 문장 맨 앞에 위치하여 과거의 특정 시점을 나타낸다. ago가 쓰였으므로 주절은 과거시제(purchased)를 취한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">purchase<\/td><td class=\"m\">구매하다, 사다<\/td><\/tr><tr><td class=\"w\">a set of<\/td><td class=\"m\">일련의, 한 세트의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I was truly <span class=\"grammar-hl\">excited<\/span><\/b><\/span><span class=\"ko\">저는 정말 기뻤습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to find<\/span> furniture<\/b><\/span><span class=\"ko\">가구를 찾게 되어<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that perfectly matched<\/span> our new home.<\/b><\/span><span class=\"ko\">저희의 새집에 완벽하게 어울리는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">저와 제 아내는 새 집에 완벽하게 어울리는 가구를 찾게 되어 매우 기뻤습니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 언급한 구매 당시의 긍정적인 감정을 드러냅니다. perfectly matched our new home은 새 집에 딱 맞는 가구를 구했다는 만족감을 보여주며, 이후에 벌어질 실망스러운 상황과 분명한 대비를 이룹니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">excited to find (to부정사(부사적): 감정의 원인): to V 바로 앞이 감정 형용사(excited)이므로 부사적 용법(감정의 원인)으로 쓰였다.<\/div><div class=\"lec-gr-item\">that perfectly matched (관계대명사): that절이 앞 명사(furniture)를 수식하며, 절 내부에서 that이 주어 역할을 하는 주격 관계대명사이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">match<\/td><td class=\"m\">어울리다, 맞다<\/td><\/tr><tr><td class=\"w\">so that<\/td><td class=\"m\">~할 수 있도록, ~하기 위하여<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">When we bought<\/span> the bookshelves,<\/b><\/span><span class=\"ko\">저희가 책장을 샀을 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the manager <span class=\"grammar-hl\">said<\/span><\/b><\/span><span class=\"ko\">매니저는 말했습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">it would take<\/span> four weeks<\/b><\/span><span class=\"ko\">4주가 걸릴 것이라고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for delivery,<\/b><\/span><span class=\"ko\">배송에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which was last weekend<\/span>.<\/b><\/span><span class=\"ko\">그리고 그때는 지난 주말이었습니다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">책장을 구입할 당시 매니저께서 배송에 4주가 걸릴 것이라고 말씀하셨고, 그 시점은 지난 주말이었습니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 구매 당시 매장 측이 약속한 배송 기한을 명확히 밝히며, 그 기한이 이미 지났음을 지적합니다. 이 글의 핵심적인 문제 상황을 꺼내기 위한 배경 설정입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">When we bought 부사절 접속사: When이 주어와 동사를 갖춘 절을 이끌어 시간을 나타내는 부사절을 구성한다.<\/div><div class=\"lec-gr-item\">said it would take 명사절 접속사(생략): 타동사 said의 목적어 역할을 하는 명사절을 이끄는 접속사 that이 said와 it 사이에 생략된 구조이다.<\/div><div class=\"lec-gr-item\">which was last weekend 관계대명사(계속적 용법): 콤마(,) 뒤에 위치하여 앞 내용 일부를 부연 설명하며, 절 내부에서 주어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">delivery<\/td><td class=\"m\">배달, 배송<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We <span class=\"grammar-hl\">had set<\/span> our plans<\/b><\/span><span class=\"ko\">저희는 일정을 조정해 두었습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to ensure<\/span> someone would be <span class=\"grammar-hl\">available<\/span><\/b><\/span><span class=\"ko\">누군가가 시간이 되도록 확실히 하기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to receive<\/span> the delivery;<\/b><\/span><span class=\"ko\">배송을 받기 위해;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>however,<\/b><\/span><span class=\"ko\">하지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>no one came<\/b><\/span><span class=\"ko\">아무도 오지 않았습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with the bookshelves<\/b><\/span><span class=\"ko\">책장을 가지고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that day.<\/b><\/span><span class=\"ko\">그날.<\/span><\/div><\/div><div class=\"lec-sent-ko\">저희는 누군가가 배송을 받을 수 있도록 일정을 조정해 두었으나, 그날 아무도 책장을 가져오지 않았습니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> to ensure someone would be available은 배송 기한에 맞춰 가족 중 누군가가 집에 머물도록 일정을 미리 조정해 두었다는 의미입니다. 매장 측의 약속을 믿고 대비했으나 결국 물건이 오지 않았다는 구체적인 피해 사실을 말하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">had set (과거완료): 기준이 되는 과거 시점(그날 배송 오기로 한 시점)보다 이전에 발생하여 완료된 동작을 나타내기 위해 &#39;had + p.p.&#39; 형태로 쓰였다.<\/div><div class=\"lec-gr-item\">to ensure (to부정사(부사적): 목적): in order to ensure로 바꿔도 뜻이 같으므로 부사적 용법(목적)으로 쓰였다.<\/div><div class=\"lec-gr-item\">ensure someone would be 명사절 접속사(생략): 타동사 ensure의 목적어 역할을 하는 명사절을 이끄는 접속사 that이 ensure 뒤에 생략된 구조이다.<\/div><div class=\"lec-gr-item\">available to receive (to부정사(부사적): 형용사 수식): to V 바로 앞이 형용사(available)이므로 이를 수식하는 부사적 용법으로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">a set of<\/td><td class=\"m\">일련의, 한 세트의<\/td><\/tr><tr><td class=\"w\">delivery<\/td><td class=\"m\">배달, 배송<\/td><\/tr><tr><td class=\"w\">ensure<\/td><td class=\"m\">반드시 ~하게 하다, 보장하다<\/td><\/tr><tr><td class=\"w\">available<\/td><td class=\"m\">시간이 있는, 이용할 수 있는<\/td><\/tr><tr><td class=\"w\">so that<\/td><td class=\"m\">~할 수 있도록, ~하기 위하여<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This delay<\/b><\/span><span class=\"ko\">이 지연은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">has caused us<\/span><\/b><\/span><span class=\"ko\">저희에게 일으켰습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">considerable inconvenience<\/span>.<\/b><\/span><span class=\"ko\">상당한 불편을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이 지연으로 인해 저희는 상당한 불편을 겪고 있습니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 설명한 배송 누락 사태가 단순히 물건을 받지 못한 것을 넘어, 고객의 일정과 생활에 실질적인 피해를 주었음을 강조합니다. 매장 측의 책임을 묻고 다음 문장의 요구를 정당화하는 논리적 근거가 됩니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">has caused us considerable inconvenience 4형식 구조: 수여동사(has caused) 뒤에 간접목적어(us)와 직접목적어(considerable inconvenience)가 연이어 오는 4형식 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">delay<\/td><td class=\"m\">지연, 지체<\/td><\/tr><tr><td class=\"w\">cause<\/td><td class=\"m\">야기하다, 초래하다<\/td><\/tr><tr><td class=\"w\">considerable<\/td><td class=\"m\">상당한, 많은<\/td><\/tr><tr><td class=\"w\">inconvenience<\/td><td class=\"m\">불편, 애로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Therefore,<\/b><\/span><span class=\"ko\">따라서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">please provide<\/span><\/b><\/span><span class=\"ko\">제공해 주십시오<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a clear and specific delivery date.<\/b><\/span><span class=\"ko\">명확하고 구체적인 배송 날짜를.<\/span><\/div><\/div><div class=\"lec-sent-ko\">따라서 명확하고 구체적인 배송 날짜를 알려주시기 바랍니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 피해 상황을 바탕으로, 고객 서비스 팀이 해결해야 할 구체적인 요구 사항을 제시합니다. 막연한 기다림 대신 확실한 약속을 다시 해 달라는 단호한 요청입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">please provide (명령문): 주어 없이 동사원형(provide)으로 시작하며, 앞에 please를 붙여 정중하게 요청하는 구조를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">delivery<\/td><td class=\"m\">배달, 배송<\/td><\/tr><tr><td class=\"w\">specific<\/td><td class=\"m\">구체적인, 명확한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We <span class=\"grammar-hl\">expect this issue<\/span><\/b><\/span><span class=\"ko\">저희는 이 문제가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to be addressed<\/span> promptly,<\/b><\/span><span class=\"ko\">신속히 처리되기를 기대합니다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">so that we can reorganize<\/span> our schedule<\/b><\/span><span class=\"ko\">저희가 일정을 다시 조정할 수 있도록<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to receive<\/span> the delivery<\/b><\/span><span class=\"ko\">배송을 받기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>without any confusion.<\/b><\/span><span class=\"ko\">아무런 혼란 없이.<\/span><\/div><\/div><div class=\"lec-sent-ko\">저희가 혼란 없이 배송을 받을 수 있도록 일정을 다시 조정할 수 있게, 이 문제가 신속히 처리되기를 기대합니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> to be addressed promptly는 앞서 요구한 배송일 확정이 빨리 이루어지기를 바란다는 의미입니다. 글쓴이가 이 편지를 쓴 최종적인 목적이 일상생활의 혼선을 줄이고 배송 일정을 다시 맞추기 위함임을 밝히며 글을 마무리하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">expect this issue to be addressed 5형식(SVOC) 구조 및 to부정사(목적격보어): 동사(expect) + 목적어(this issue) + to V(목적격보어) 구조이다. 목적격보어 자리에 온 address는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) to be addressed 형태로 쓴다. 기본구조: address + O(목적어)<\/div><div class=\"lec-gr-item\">so that we can reorganize 부사절 접속사: &#39;so that + S + can/may/will + V&#39; 형태로 &#39;~할 수 있도록&#39;이라는 목적을 나타내는 부사절을 이끈다.<\/div><div class=\"lec-gr-item\">to receive (to부정사(부사적): 목적): in order to receive로 바꿔도 뜻이 같으므로 부사적 용법(목적)으로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">delivery<\/td><td class=\"m\">배달, 배송<\/td><\/tr><tr><td class=\"w\">issue<\/td><td class=\"m\">문제, 쟁점<\/td><\/tr><tr><td class=\"w\">address<\/td><td class=\"m\">(문제를) 다루다, 해결하다<\/td><\/tr><tr><td class=\"w\">promptly<\/td><td class=\"m\">신속하게, 즉시<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">so that<\/td><td class=\"m\">~할 수 있도록, ~하기 위하여<\/td><\/tr><tr><td class=\"w\">reorganize<\/td><td class=\"m\">재조정하다, 재편성하다<\/td><\/tr><tr><td class=\"w\">confusion<\/td><td class=\"m\">혼란, 혼동<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>한 달 전 새 집에 어울리는 책장을 기쁜 마음으로 구매했다.<\/li><li>매니저가 약속한 4주 뒤 배송일에 맞춰 일정을 비워두었으나 물건이 오지 않았다.<\/li><li>이 지연으로 상당한 불편을 겪었으므로, 명확하고 구체적인 배송 날짜를 다시 알려 달라고 요구하고 있다.<\/li><li>일정을 재조정할 수 있도록 고객 서비스 팀의 신속한 문제 해결을 바라는 항의 편지이다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">The customer experienced significant inconvenience from a delayed delivery, so they are requesting a clear delivery schedule to reorganize their plans.<\/div>\n              <div class=\"lec-final-sum-ko\">고객은 배송 지연으로 인해 큰 불편을 겪었으므로, 계획을 재조정하기 위해 명확한 배송 일정을 요청하고 있다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./18_audio/1.mp3","hl":null}],[{"audio":"./18_audio/2.mp3","hl":null}],[{"audio":"./18_audio/3.mp3","hl":null},{"audio":"./18_audio/4.mp3","hl":"stage-0"},{"audio":"./18_audio/5.mp3","hl":"stage-1"},{"audio":"./18_audio/6.mp3","hl":"stage-2"},{"audio":"./18_audio/7.mp3","hl":"stage-3"}],[{"audio":"./18_audio/8.mp3","hl":null}],[{"audio":"./18_audio/9.mp3","hl":"main"},{"audio":"./18_audio/10.mp3"
