ss=\"lec-stage-head\">01이론의 대체 조건<\/div><ul><li>과학 이론은 기존의 증거를 더 잘 설명할 수 있는 방법이 있을 때만 폐기되거나 대체될 수 있다.<\/li><li>과학적 이론(scientific theory)의 대체 가능 조건 제시<\/li><li>기존 이론을 지지하는 증거(evidence)에 대한 더 나은 설명력 필요<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02뉴턴 이론의 한계와 불일치<\/div><ul><li>뉴턴의 중력 이론은 방대한 증거의 지지를 받았으나, 점차 관찰 결과와 맞지 않는 사례들이 발견되었다.<\/li><li>뉴턴의 중력 이론(theory of gravity)을 뒷받침하는 방대한 증거 존재<\/li><li>19세기 후반 예측과 관찰(observations)이 완벽히 일치하지 않는 불일치(discrepancies) 발견<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03아인슈타인 이론의 수용<\/div><ul><li>아인슈타인의 상대성 이론은 새로운 불일치뿐만 아니라 기존 뉴턴 이론의 성공 사례도 모두 설명해 내며 새롭게 인정받았다.<\/li><li>일반 상대성 이론(general theory of relativity)이 불일치 문제를 해결함<\/li><li>뉴턴 이론의 기존 성공(successes)을 동일하게 잘 설명하여 수용(acceptance)됨<\/li><li>기존보다 더 폭넓은 이론(broader theory)으로 평가받음<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04미래 이론의 과제<\/div><ul><li>아인슈타인의 이론을 넘어설 새로운 중력 이론 역시 기존의 성공과 새로운 영역을 동시에 설명해야만 인정받을 수 있다.<\/li><li>오늘날 과학자들은 아인슈타인을 넘어설 새로운 이론 모색 중<\/li><li>필수 조건 1: 아인슈타인 이론의 모든 성공 사례에 부합해야 함<\/li><li>필수 조건 2: 기존 이론이 통하지 않는 새로운 영역(new realms)에서도 작동해야 함<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">discard<\/td><td class=\"m\">버리다, 폐기하다<\/td><\/tr><tr><td class=\"w\">replace<\/td><td class=\"m\">대체하다<\/td><\/tr><tr><td class=\"w\">evidence<\/td><td class=\"m\">증거<\/td><\/tr><tr><td class=\"w\">support<\/td><td class=\"m\">뒷받침하다, 지지하다<\/td><\/tr><tr><td class=\"w\">a vast body of<\/td><td class=\"m\">방대한 양의, 엄청난 양의<\/td><\/tr><tr><td class=\"w\">gravity<\/td><td class=\"m\">중력<\/td><\/tr><tr><td class=\"w\">prediction<\/td><td class=\"m\">예측<\/td><\/tr><tr><td class=\"w\">match<\/td><td class=\"m\">일치하다, 부합하다<\/td><\/tr><tr><td class=\"w\">observation<\/td><td class=\"m\">관측, 관찰 결과<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">discrepancy<\/td><td class=\"m\">불일치, 차이<\/td><\/tr><tr><td class=\"w\">ignore<\/td><td class=\"m\">무시하다<\/td><\/tr><tr><td class=\"w\">gain acceptance<\/td><td class=\"m\">인정받다, 수용되다<\/td><\/tr><tr><td class=\"w\">view as<\/td><td class=\"m\">~을 ~로 여기다, ~을 ~로 간주하다<\/td><\/tr><tr><td class=\"w\">broad<\/td><td class=\"m\">폭넓은, 포괄적인<\/td><\/tr><tr><td class=\"w\">seek<\/td><td class=\"m\">찾다, 추구하다<\/td><\/tr><tr><td class=\"w\">go beyond<\/td><td class=\"m\">~을 넘어서다, 초월하다<\/td><\/tr><tr><td class=\"w\">as well as<\/td><td class=\"m\">~뿐만 아니라<\/td><\/tr><tr><td class=\"w\">realm<\/td><td class=\"m\">영역, 범위<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We can discard or replace a scientific theory<\/b><\/span><span class=\"ko\">우리는 과학 이론을 버리거나 대신할 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>only if we have a better way<\/b><\/span><span class=\"ko\">오직 우리가 더 나은 방법이 있을 때에만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">of explaining<\/span> the evidence <span class=\"grammar-hl\">that supports it<\/span>.<\/b><\/span><span class=\"ko\">그것을 뒷받침하는 증거를 설명하는<\/span><\/div><\/div><div class=\"lec-sent-ko\">단지 우리가 그것을 뒷받침하는 증거를 설명하는 더 나은 방법이 있을 때에만 우리는 과학 이론을 버리거나 대신할 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 주제를 제시하는 첫 문장입니다. 과학에서 새로운 이론이 받아들여지려면 단순히 새로운 아이디어가 나오는 것을 넘어, 기존 이론이 설명하던 증거들을 더 잘 다룰 수 있어야만 기존 이론을 밀어내고 자리를 잡을 수 있다는 점을 분명히 하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that supports it (관계대명사(주격)): that절이 앞의 선행사 the evidence를 수식하는 구조이며, 절 내부에서 that이 주어 역할을 한다.<\/div><div class=\"lec-gr-item\">of explaining (동명사): 전치사 of의 목적어로 쓰인 동명사구이다. explaining이 뒤의 목적어 the evidence를 취하고 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">discard<\/td><td class=\"m\">버리다, 폐기하다<\/td><\/tr><tr><td class=\"w\">replace<\/td><td class=\"m\">대체하다<\/td><\/tr><tr><td class=\"w\">evidence<\/td><td class=\"m\">증거<\/td><\/tr><tr><td class=\"w\">support<\/td><td class=\"m\">뒷받침하다, 지지하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The theories of Newton and Einstein<\/b><\/span><span class=\"ko\">뉴턴과 아인슈타인의 이론들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">offer<\/span> great examples.<\/b><\/span><span class=\"ko\">훌륭한 예시들을 제공한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">뉴턴과 아인슈타인의 이론들이 훌륭한 예시들을 제공한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 제시한 주제에 대한 구체적인 예시로 들어가는 문장입니다. 독자가 이해하기 쉽도록 과학사에서 가장 유명한 두 이론을 끌어와 첫 문장의 원리를 증명하려 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">offer (일반동사): 주어 The theories가 복수 명사이므로, 동사 역시 복수형인 offer가 쓰인 핵심 서술어 구조이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>A vast body of evidence<\/b><\/span><span class=\"ko\">방대한 양의 증거가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>supports Newton’s theory of gravity,<\/b><\/span><span class=\"ko\">뉴턴의 중력 이론을 뒷받침해 주지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but by the late nineteenth century<\/b><\/span><span class=\"ko\">19세기 후반에 이르러<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>scientists had begun <span class=\"grammar-hl\">to discover<\/span> cases<\/b><\/span><span class=\"ko\">과학자들은 경우들을 발견하기 시작했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">where its predictions did not perfectly match observations<\/span>.<\/b><\/span><span class=\"ko\">그것의 예측들이 관찰 결과와 완벽하게 일치하지 않는<\/span><\/div><\/div><div class=\"lec-sent-ko\">방대한 양의 증거가 뉴턴의 중력 이론을 뒷받침해 주지만, 19세기 후반에 이르러 과학자들은 그것의 예측들이 관찰 결과와 완벽하게 일치하지 않는 경우들을 발견하기 시작했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 뉴턴 이론의 한계가 드러나기 시작한 역사적 배경을 설명합니다. did not perfectly match observations는 실제 우주를 관측한 결과가 뉴턴의 공식으로 계산해 낸 결괏값과 어긋나는 현상들이 나타나면서 기존 이론에 의문이 생기기 시작했다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to discover (to부정사(명사적)): 동사 begun의 목적어 자리에 쓰여 &#39;~하는 것을&#39;이라는 의미를 나타내는 명사적 용법이다.<\/div><div class=\"lec-gr-item\">where its predictions did not perfectly match observations (관계부사): 선행사 cases를 수식하는 관계부사 where가 이끄는 절이다. 뒤에 주어(its predictions)와 동사(did not perfectly match) 및 목적어(observations)를 갖춘 완전한 절이 온다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">evidence<\/td><td class=\"m\">증거<\/td><\/tr><tr><td class=\"w\">support<\/td><td class=\"m\">뒷받침하다, 지지하다<\/td><\/tr><tr><td class=\"w\">a vast body of<\/td><td class=\"m\">방대한 양의, 엄청난 양의<\/td><\/tr><tr><td class=\"w\">gravity<\/td><td class=\"m\">중력<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">prediction<\/td><td class=\"m\">예측<\/td><\/tr><tr><td class=\"w\">match<\/td><td class=\"m\">일치하다, 부합하다<\/td><\/tr><tr><td class=\"w\">observation<\/td><td class=\"m\">관측, 관찰 결과<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>These discrepancies <span class=\"grammar-hl\">were explained<\/span><\/b><\/span><span class=\"ko\">이러한 불일치들은 설명되었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>only when Einstein developed his general theory of relativity,<\/b><\/span><span class=\"ko\">오직 아인슈타인이 자신의 일반 상대성 이론을 전개했을 때에만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which was able to match the observations<\/span>.<\/b><\/span><span class=\"ko\">그리고 그것은 관찰 결과와 일치할 수 있었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이러한 불일치들은 아인슈타인이 자신의 일반 상대성 이론을 전개했을 때 비로소 설명될 수 있었고, 그것은 관찰 결과와 일치할 수 있었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 제기된 문제(관측 불일치)가 새로운 이론을 통해 어떻게 해결되었는지 보여 줍니다. 글쓴이는 여기서 only when 구문을 사용하여, 아인슈타인의 이론이 등장하고 나서야 비로소 뉴턴 이론으로 풀리지 않던 현상들이 명쾌하게 설명되었음을 강조합니다. 첫 문장에서 말한 &#39;더 나은 방법&#39;이 실제로 등장한 상황입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">were explained (수동태): be동사(were)+p.p.(explained) 구조. explain은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 were explained 형태로 쓴다. 기본구조: explain + O(목적어)<\/div><div class=\"lec-gr-item\">which was able to match the observations 관계대명사(주격, 계속적 용법): 콤마 뒤에 쓰여 앞의 선행사 his general theory of relativity를 부연 설명하며, 절 내부에서 주어 역할을 한다.<\/div><div class=\"lec-gr-item\">to match to부정사(부사적, 형용사 수식): to부정사 바로 앞의 형용사 able 뒤에 위치하여 이를 수식하는 부사적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">match<\/td><td class=\"m\">일치하다, 부합하다<\/td><\/tr><tr><td class=\"w\">observation<\/td><td class=\"m\">관측, 관찰 결과<\/td><\/tr><tr><td class=\"w\">discrepancy<\/td><td class=\"m\">불일치, 차이<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Still,<\/b><\/span><span class=\"ko\">그럼에도 불구하고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the many successes of Newton’s theory<\/b><\/span><span class=\"ko\">뉴턴의 이론의 많은 성과는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">could not be ignored<\/span>,<\/b><\/span><span class=\"ko\">무시될 수 없었고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and Einstein’s theory <span class=\"grammar-hl\">would not have gained acceptance<\/span><\/b><\/span><span class=\"ko\">그리고 아인슈타인의 이론은 인정을 받지 못했을 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">if it had not been able to explain<\/span> these successes equally well.<\/b><\/span><span class=\"ko\">만약 이러한 성과를 똑같이 잘 설명할 수 없었다면.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그럼에도 불구하고, 뉴턴의 이론의 많은 성과는 무시될 수 없었고, 아인슈타인의 이론이 만약 이러한 성과를 똑같이 잘 설명할 수 없었다면 인정을 받지 못했을 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 새로운 이론이 갖추어야 할 필수 조건을 재차 확인하는 문장입니다. the many successes of Newton’s theory could not be ignored는 뉴턴 이론이 일부 한계를 드러냈음에도 여전히 수많은 물리적 현상을 훌륭하게 설명하고 있었음을 나타냅니다. 따라서 아인슈타인의 이론이 인정받으려면 새로운 문제만 푸는 수준을 넘어, 기존에 뉴턴이 풀었던 문제들까지 모두 똑같이 설명해 내야만 했다는 점을 짚어 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">could not be ignored (수동태): 조동사 + be동사(be)+p.p.(ignored) 구조. ignore는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 be ignored 형태로 쓴다. 기본구조: ignore + O(목적어)<\/div><div class=\"lec-gr-item\">would not have gained acceptance if it had not been able to explain 가정법 과거완료: &#39;if + S + had p.p., S + 조동사 과거형 + have p.p.&#39;의 구조로, 과거 사실과 반대되는 가정을 나타낸다.<\/div><div class=\"lec-gr-item\">to explain to부정사(부사적, 형용사 수식): to부정사 바로 앞의 형용사 able 뒤에 위치하여 이를 수식하는 부사적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">ignore<\/td><td class=\"m\">무시하다<\/td><\/tr><tr><td class=\"w\">gain acceptance<\/td><td class=\"m\">인정받다, 수용되다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>It <span class=\"grammar-hl\">did<\/span>,<\/b><\/span><span class=\"ko\">그것은 그렇게 했고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and that is <span class=\"grammar-hl\">why we now view<\/span> Einstein’s theory<\/b><\/span><span class=\"ko\">그리고 그것이 우리가 오늘날 아인슈타인의 이론을 보는 이유이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as a broader theory of gravity<\/b><\/span><span class=\"ko\">더 포괄적인 중력 이론으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>than Newton’s theory.<\/b><\/span><span class=\"ko\">뉴턴의 이론보다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것은 그렇게 했고, 그것이 우리가 오늘날 아인슈타인의 이론을 뉴턴의 이론보다 더 포괄적인 중력 이론으로 보는 이유이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 조건이 충족된 결과를 보여 줍니다. It did는 아인슈타인의 이론이 기존 뉴턴 이론의 성공 사례들까지 모두 포용하고 설명해 냈다는 의미입니다. 그 결과 아인슈타인의 이론은 뉴턴의 이론을 완전히 폐기하는 차원을 넘어, 그것을 포함하면서 더 넓은 범위의 현상까지 다루는 이론으로 확고히 자리 잡게 되었습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">did (대동사): 앞 문장의 일반동사구(gained acceptance)를 대신하는 대동사이다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.<\/div><div class=\"lec-gr-item\">why we now view (관계부사): 선행사 the reason이 생략된 형태로 보어 역할을 하는 명사절을 이끈다. 뒤에 주어(we)와 동사(view)를 갖춘 완전한 절이 온다.<\/div><div class=\"lec-gr-item\">view Einstein’s theory as (관용표현): &#39;view A as B&#39; 구조로 &#39;A를 B로 간주하다, 보다&#39;라는 의미를 나타내는 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gravity<\/td><td class=\"m\">중력<\/td><\/tr><tr><td class=\"w\">view as<\/td><td class=\"m\">~을 ~로 여기다, ~을 ~로 간주하다<\/td><\/tr><tr><td class=\"w\">broad<\/td><td class=\"m\">폭넓은, 포괄적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Some scientists today<\/b><\/span><span class=\"ko\">오늘날 몇몇의 과학자들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are seeking a theory of gravity<\/b><\/span><span class=\"ko\">중력 이론을 찾고 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that will go beyond Einstein’s<\/span>.<\/b><\/span><span class=\"ko\">아인슈타인의 이론을 넘어설.<\/span><\/div><\/div><div class=\"lec-sent-ko\">오늘날 몇몇의 과학자들은 아인슈타인의 이론을 넘어설 중력 이론을 찾고 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 과거의 사례(뉴턴에서 아인슈타인으로)를 다루던 내용에서 현재의 상황으로 시점을 전환합니다. 과학의 발전은 멈추지 않으며, 현재 가장 포괄적인 아인슈타인의 이론조차 한계가 있을 수 있기에 이를 뛰어넘을 또 다른 이론을 모색하고 있음을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that will go beyond Einstein’s (관계대명사(주격)): that절이 앞의 선행사 a theory of gravity를 수식하는 구조이며, 절 내부에서 that이 주어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">gravity<\/td><td class=\"m\">중력<\/td><\/tr><tr><td class=\"w\">seek<\/td><td class=\"m\">찾다, 추구하다<\/td><\/tr><tr><td class=\"w\">go beyond<\/td><td class=\"m\">~을 넘어서다, 초월하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If any new theory ever gains acceptance,<\/b><\/span><span class=\"ko\">만약 어떤 새로운 이론이 언젠가 인정을 받는다면,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it will have to match all the successes of Einstein’s theory<\/b><\/span><span class=\"ko\">그것은 아인슈타인의 이론의 모든 성과에 필적해야 할 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as well as<\/span> work<\/b><\/span><span class=\"ko\">작동할 뿐만 아니라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in new realms<\/b><\/span><span class=\"ko\">새로운 영역에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">where Einstein’s theory does not<\/span>.<\/b><\/span><span class=\"ko\">아인슈타인의 이론이 작동하지 않는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 어떤 새로운 이론이 언젠가 인정을 받는다면, 그것은 아인슈타인의 이론이 작동하지 않는 새로운 영역에서 작동할 뿐만 아니라 아인슈타인의 이론의 모든 성과에 필적해야 할 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글 전체의 결론이자 첫 문장의 원리를 미래에도 동일하게 적용하는 문장입니다. work in new realms where Einstein’s theory does not은 아인슈타인의 이론으로 설명되지 않는 미지의 현상들을 풀어내는 것을 가리킵니다. 미래에 등장할 새로운 이론 역시 기존 이론(아인슈타인)의 성과를 모두 포용하면서 새로운 문제까지 해결할 수 있어야만 과학계의 인정을 받을 수 있다는 점을 최종적으로 요약하고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">where Einstein’s theory does not (관계부사): 선행사 new realms를 수식하는 관계부사 where가 이끄는 절이다. 뒤에 주어와 동사를 갖춘 완전한 절 구조를 취한다.<\/div><div class=\"lec-gr-item\">does not (대동사): 앞의 일반동사(work)를 대신하는 대동사이다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.<\/div><div class=\"lec-gr-item\">as well as (관용표현): &#39;B as well as A&#39; 형태로 &#39;A뿐만 아니라 B도&#39;라는 의미를 가지며, 조동사 have to 뒤에서 동사원형 match와 work를 병렬 구조로 연결한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">match<\/td><td class=\"m\">일치하다, 부합하다<\/td><\/tr><tr><td class=\"w\">gain acceptance<\/td><td class=\"m\">인정받다, 수용되다<\/td><\/tr><tr><td class=\"w\">as well as<\/td><td class=\"m\">~뿐만 아니라<\/td><\/tr><tr><td class=\"w\">realm<\/td><td class=\"m\">영역, 범위<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>과학 이론은 기존 이론을 뒷받침하던 증거들을 더 잘 설명할 수 있는 새로운 이론이 등장할 때만 대체된다.<\/li><li>뉴턴의 중력 이론은 훌륭했지만 실제 관찰과 어긋나는 현상들이 발견되었고, 이를 아인슈타인의 일반 상대성 이론이 해결했다.<\/li><li>아인슈타인의 이론이 인정받은 것은 새로운 현상뿐만 아니라 뉴턴이 설명했던 성공적인 사례들까지 모두 포괄했기 때문이다.<\/li><li>앞으로 아인슈타인의 이론을 넘어설 새로운 중력 이론이 등장하더라도, 이와 동일하게 기존 이론의 성과를 모두 설명하면서 새로운 영역까지 다룰 수 있어야 한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">A scientific theory is replaced only if a new theory explains new discoveries while maintaining the valid evidence of the previous theory.<\/div>\n              <div class=\"lec-final-sum-ko\">과학 이론은 새로운 이론이 새로운 발견을 설명하는 동시에 이전 이론의 타당한 증거를 유지할 때만 대체된다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./23_audio/1.mp3","hl":null}],[{"audio":"./23_audio/2.mp3","hl":null}],[{"audio":"./23_audio/3.mp3","hl":null},{"audio":"./23_audio/4.mp3","hl":"stage-0"},{"audio":"./23_audio/5.mp3","hl":"stage-1"},{"audio":"./23_audio/6.mp3","hl":"stage-2"},{"audio":"./23_audio/7.mp3","hl":"stage-3"}],[{"audio":"./23_audio/8.mp3","hl":null}],[{"audio":"./23_audio/9.mp3","hl":"main"},{"audio":"./23_audio/10.mp3","hl":"meaning"},{"audio":"./23_audio/11.mp3","hl":"grammar"}],[{"audio":"./23_audio/12.mp3","hl":"main"},{"audio":"./23_audio/13.mp3","hl":"meaning"},{"audio":"./23_audio/14.mp3","hl":"grammar"}],[{"audio":"./23_audio/15.mp3","hl":"main"},{"audio":"./23_audio/16.mp3","hl":"meaning"},{"audio":"./23_audio/17.mp3","hl":"grammar"}],[{"audio":"./23_audio/18.mp3","hl":"main"},{"audio":"./23_audio/19.mp3","hl":"meaning"},{"audio":"./23_audio/20.mp3","hl":"grammar"}],[{"audio":"./23_audio/21.mp3","hl":"main"},{"audio":"./23_audio/22.mp3","hl":"meaning"},{"audio":"./23_audio/23.mp3","hl":"grammar"}],[{"audio":"./23_audio/24.mp3","hl":"main"},{"audio":"./23_audio/25.mp3","hl":"meaning"},{"audio":"./23_audio/26.mp3","hl":"grammar"}],[{"audio":"./23_audio/27.mp3","hl":"main"},{"audio":"./23_audio/28.mp3","hl":"meaning"},{"audio":"./23_audio/29.mp3","hl":"grammar"}],[{"audio":"./23_audio/30.mp3","hl":"main"},{"audio":"./23_audio/31.mp3","hl":"meaning"},{"audio":"./23_audio/32.mp3","hl":"grammar"}],[{"audio":"./23_audio/33.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_23번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 23번","titleEn":"The Evolution of Scientific Theories: Embracing the Old and the New","titleKo":"과학 이론의 진화: 과거와 새로운 증거의 포용","imageUrl":"__enpImg__","stages":[{"label":"01이론의 대체 조건","items":["과학 이론은 기존의 증거를 더 잘 설명할 수 있는 방법이 있을 때만 폐기되거나 대체될 수 있다.","과학적 이론(scientific theory)의 대체 가능 조건 제시","기존 이론을 지지하는 증거(evidence)에 대한 더 나은 설명력 필요"]},{"label":"02뉴턴 이론의 한계와 불일치","items":["뉴턴의 중력 이론은 방대한 증거의 지지를 받았으나, 점차 관찰 결과와 맞지 않는 사례들이 발견되었다.","뉴턴의 중력 이론(theory of gravity)을 뒷받침하는 방대한 증거 존재","19세기 후반 예측과 관찰(observations)이 완벽히 일치하지 않는 불일치(discrepancies) 발견"]},{"label":"03아인슈타인 이론의 수용","items":["아인슈타인의 상대성 이론은 새로운 불일치뿐만 아니라 기존 뉴턴 이론의 성공 사례도 모두 설명해 내며 새롭게 인정받았다.","일반 상대성 이론(general theory of relativity)이 불일치 문제를 해결함","뉴턴 이론의 기존 성공(successes)을 동일하게 잘 설명하여 수용(acceptance)됨","기존보다 더 폭넓은 이론(broader theory)으로 평가받음"]},{"label":"04미래 이론의 과제","items":["아인슈타인의 이론을 넘어설 새로운 중력 이론 역시 기존의 성공과 새로운 영역을 동시에 설명해야만 인정받을 수 있다.","오늘날 과학자들은 아인슈타인을 넘어설 새로운 이론 모색 중","필수 조건 1: 아인슈타인 이론의 모든 성공 사례에 부합해야 함","필수 조건 2: 기존 이론이 통하지 않는 새로운 영역(new realms)에서도 작동해야 함"]}],"bkg":"이 글을 더 깊이 이해하기 위해서는 과학 철학에서 말하는 패러다임의 전환(Paradigm Shift)과 물리학의 핵심인 중력(Gravity)에 대한 배경지식이 필요해요. 우리가 매일 땅에 발을 딛고 사는 것을 설명하는 뉴턴의 만유인력의 법칙(Law of Universal Gravitation)은 오랫동안 절대적인 진리로 여겨졌지만, 우주처럼 매우 거대한 세계에서는 관측 결과와 맞지 않는 미세한 오차들이 발생했지요. 이러한 빈틈을 완벽히 메우면서 등장한 것이 바로 아인슈타인의 일반 상대성이론(General Theory of Relativity)인데, 이는 마치 최신 스마트폰이 이전 모델의 기본 기능은 전부 완벽하게 지원하면서도 기존에 없던 새로운 혁신 기능을 추가한 것과 같은 원리랍니다. 즉, 과학계에서 새로운 과학적 이론(Scientific Theory)이 인정받으려면 단순히 새로운 현상을 발견하는 것을 넘어 과거 이론이 거둔 성공적인 증거들까지 모두 포용하고 설명할 수 있어야 한다는 점을 염두에 두고 지문을 읽어보시면 훨씬 이해가 쉬울 거예요!","ttsText":"이 글을 더 깊이 이해하기 위해서는 과학 철학에서 말하는 패러다임의 전환(Paradigm Shift)과 물리학의 핵심인 중력(Gravity)에 대한 배경지식이 필요해요         if (el.scrollWidth > el.clientWidth + 2 && /^(auto|scroll)$/.test(getComputedStyle(el).overflowX)) return true;
