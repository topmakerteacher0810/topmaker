">적극적 관리와 소극적 관리라는\u003c/span>\u003cspan class=\"en\">active management and inactive management.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">야생 생물이 관리되는 수많은 방법들이 있지 만, 그것들은 모두 관리 책임을 수반하고 적극적 관리와 소극적 관리라는 두 가지 넓은 범주로 분류될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 야생 생물 관리의 공통 특성인 \u003cb class=\"key\">관리 \u003c/b>\u003cb class=\"key\">책임\u003c/b>을 언급하며, 관리 방식을 \u003cb class=\"key\">적극적\u003c/b> 관리와 \u003cb class=\"key\">소극적\u003c/b> 관리라는 두 가지 큰 틀로 제시하는 도입부 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계부사의 생략\u003c/span> : [명사(선행사)] + [주어 + 동사 (완전한 문장)] : \"야생 생물이 관리되는 방법들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사 수동태\u003c/span> : can + be + [과거분사(p.p.)] : \"분류될 수 있다\"\u003c/div>\u003c/div>","segs":[{"n":2,"text":"There are numerous ways, 수많은 방법들이 있다. wildlife is managed, 야생 생물이 관리되는. but they all imply stewardship, 하지만 그것들은 모두 관리 책임을 수반하고. and can be classified, 분류될 수 있다. into two broad categories, 두 가지 넓은 범주로. active management and inactive management, 적극적 관리와 소극적 관리라는. 이 문장 전체를 해석하면, 야생 생물이 관리되는 수많은 방법들이 있지 만, 그것들은 모두 관리 책임을 수반하고 적극적 관리와 소극적 관리라는 두 가지 넓은 범주로 분류될 수 있다.","hl":"m"},{"n":3,"text":"이 글은 야생 생물을 관리하는 수많은 방법이 있지만, 결국은 관리 책임이라는 공통점이 있다는 말로 시작해요. 그리고 그 방식들을 적극적 관리와 소극적 관리라는 두 부류로 나누며 글의 방향을 잡고 있죠.","hl":"mn"},{"n":4,"text":"첫 번째로 ways와 wildlife 사이에는 관계부사 how가 생략되어 있어요. 둘은 같이 쓸 수 없기 때문이죠. 두 번째로 can be classified는 조동사가 포함된 수동태예요. 주어인 방법들이 분류되는 대상이기 때문에 수동태 형식을 썼어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적극적 관리는 무언가를 한다\u003c/span>\u003cspan class=\"en\">Active management does something\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개체군에\u003c/span>\u003cspan class=\"en\">to the population ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">규모를 증가시키거나 감소시키는 것과 같이\u003c/span>\u003cspan class=\"en\">such as \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">increasing \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">decreasing\u003c/span> its size ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">직접적인 방식으로\u003c/span>\u003cspan class=\"en\">in a direct manner\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거주지 이전이나 사냥과 같은 전략을 통해, 각각\u003c/span>\u003cspan class=\"en\">through strategies like translocations or hunting, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">respectively\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">적극적 관리는 거주지 이전이나 사냥과 같은 전략을 통해, 각각 규모를 증가시키거나 감소시키는 것과 같이 무언가를 직접적인 방식으로 개체군에 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">적극적 \u003c/b>\u003cb class=\"key\">관리\u003c/b>의 핵심인 \u003cb class=\"key\">직접적인 \u003c/b>\u003cb class=\"key\">개입\u003c/b>을 설명하며, 인위적인 전략을 통해 \u003cb class=\"key\">개체 \u003c/b>\u003cb class=\"key\">수\u003c/b>를 조절하는 구체적인 예시를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사의 병렬 구조\u003c/span> : such as + [~ing] + or + [~ing] : \"증가시키거나 감소시키는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 용법\u003c/span> : 명사1, 명사2 ... + respectively : \"각각\"\u003c/div>\u003c/div>","segs":[{"n":5,"text":"Active management does something, 적극적 관리는 무언가를 한다. to the population ―, 개체군에. such as increasing or decreasing its size ―, 규모를 증가시키거나 감소시키는 것과 같이. in a direct manner, 직접적인 방식으로. through strategies like translocations or hunting, respectively, 거주지 이전이나 사냥과 같은 전략을 통해, 각각. 이 문장 전체를 해석하면, 적극적 관리는 거주지 이전이나 사냥과 같은 전략을 통해, 각각 규모를 증가시키거나 감소시키는 것과 같이 무언가를 직접적인 방식으로 개체군에 한다.","hl":"m"},{"n":6,"text":"이제 적극적 관리가 무엇인지 구체적으로 알려주네요. 핵심은 직접적인 방식이라는 거예요. 사람이 직접 개입해서 동물의 수를 늘리거나 줄이는 걸 말하죠.","hl":"mn"},{"n":7,"text":"첫 번째로 increasing or decreasing은 전치사 such as 뒤에 오는 동명사들의 병렬 구조예요. 두 번째로 문장 끝의 respectively는 아주 중요한데, 앞에서 말한 증가와 감소가 뒤에 나오는 이전과 사냥에 각각 짝지어진다는 걸 의미해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개체군들은 또한 ~될 수 있다\u003c/span>\u003cspan class=\"en\">Populations can also be\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적극적으로 관리\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">actively \u003c/span>\u003cspan class=\"tgt\">managed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서식지를 변경함으로써\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">altering\u003c/span> the habitat\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개체군에게 유리하거나 불리하게\u003c/span>\u003cspan class=\"en\">to the benefit or disadvantage of a population.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">개체군들은 또한 서식지를 개체군에게 유리하거나 불리하게 변경함으로써 적극적으로 관리될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동물 자체를 직접 다루는 것 외에, \u003cb class=\"key\">서식지 \u003c/b>\u003cb class=\"key\">환경\u003c/b>을 변화시키는 것도 \u003cb class=\"key\">적극적 \u003c/b>\u003cb class=\"key\">관리\u003c/b>의 한 방법임을 추가로 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 분사 수식\u003c/span> : [부사] + [과거분사(p.p.)] : \"적극적으로 관리되는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : by + [~ing] : \"변경함으로써\"\u003c/div>\u003c/div>","segs":[{"n":8,"text":"Populations can also be, 개체군들은 또한 ~될 수 있다. actively managed, 적극적으로 관리. by altering the habitat, 서식지를 변경함으로써. to the benefit or disadvantage of a population, 개체군에게 유리하거나 불리하게. 이 문장 전체를 해석하면, 개체군들은 또한 서식지를 개체군에게 유리하거나 불리하게 변경함으로써 적극적으로 관리될 수 있다.","hl":"m"},{"n":9,"text":"직접 개체 수를 조절하는 것 말고도 다른 방법이 또 있다는 거죠. 바로 서식지 환경을 바꿔서 동물들에게 유리하게 만들거나 불리하게 만드는 것도 적극적 관리에 포함됩니다.","hl":"mn"},{"n":10,"text":"첫 번째로 actively managed는 부사가 과거분사를 수식하는 형태예요. 어떤 방식으로 관리되는지를 강조하죠. 두 번째로 by altering은 수단이나 방법을 나타내는 표현으로, 무엇을 함으로써라는 의미를 전달할 때 씁니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">만약 개체 수가 너무 적으면\u003c/span>\u003cspan class=\"en\">If population numbers are too low\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관리 기관들의 목표보다\u003c/span>\u003cspan class=\"en\">for the goal of management agencies,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 적극적 관리가 포함될 수 있다,\u003c/span>\u003cspan class=\"en\">other active management \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">incorporated\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포식자 통제나\u003c/span>\u003cspan class=\"en\">such as predator control\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갓 태어난 개체의 사망을 최소화하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">minimize\u003c/span> neonatal deaths\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서식지 개선과 같은\u003c/span>\u003cspan class=\"en\">or habitat improvement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">포식자로부터 갓 태어난 새끼들을 위해 필요한 은신처를 제공하는\u003c/span>\u003cspan class=\"en\">to provide required cover for neonates from predators.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 개체 수가 관리 기관들의 목표보다 너무 적으면 갓 태어난 개체의 사망을 최소화하는 포식자 통제나 포식자로부터 갓 태어난 새끼들을 위해 필요한 은신처를 제공하는 서식지 개선과 같은 다른 적극적 관리가 포함될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 개체 수가 목표치에 미달할 때 수행하는 구체적인 \u003cb class=\"key\">적극적 \u003c/b>\u003cb class=\"key\">관리\u003c/b> 사례들을 나열하며, \u003cb class=\"key\">생존율\u003c/b>을 높이기 위한 인위적 개입의 필요성을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (조동사 + be p.p.)\u003c/span> : can [조동사] + be incorporated [be + 과거분사] : \"포함될 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : predator control [명사] + to minimize [to부정사] : \"최소화하는\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"If population numbers are too low, 만약 개체 수가 너무 적으면. for the goal of management agencies, 관리 기관들의 목표보다. other active management can be incorporated, 다른 적극적 관리가 포함될 수 있다. such as predator control, 포식자 통제나. to minimize neonatal deaths, 갓 태어난 개체의 사망을 최소화하는. or habitat improvement, 서식지 개선과 같은. to provide required cover for neonates from predators, 포식자로부터 갓 태어난 새끼들을 위해 필요한 은신처를 제공하는. 이 문장 전체를 해석하면, 만약 개체 수가 관리 기관들의 목표보다 너무 적으면 갓 태어난 개체의 사망을 최소화하는 포식자 통제나 포식자로부터 갓 태어난 새끼들을 위해 필요한 은신처를 제공하는 서식지 개선과 같은 다른 적극적 관리가 포함될 수 있다.","hl":"m"},{"n":12,"text":"이 문장은 적극적 관리의 구체적인 예시들을 보여줘요. 개체 수가 너무 적을 때 관리 기관이 개입해서 포식자를 줄이거나 살 곳을 개선해서 새끼들의 생존율을 높이는 적극적 관리 방식을 설명하고 있습니다.","hl":"mn"},{"n":13,"text":"첫 번째로 can be incorporated는 수동태 표현이에요. 관리 기법이 주어니까 수동형으로 쓰였죠. 두 번째로 to minimize와 문장 끝부분의 to provide는 앞에 나온 명사들을 꾸며주는 형용사적 용법으로 쓰여서 어떤 목적인지 자세히 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 노력들은\u003c/span>\u003cspan class=\"en\">These efforts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나타낸다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">represent\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관리에 대한 적극적인 접근법을\u003c/span>\u003cspan class=\"en\">active approaches to management.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 노력들은 관리에 대한 적극적인 접근법을 나타낸다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장에서 언급된 통제나 개선 노력들이 결국 글의 전반부에서 정의한 \u003cb class=\"key\">적극적 \u003c/b>\u003cb class=\"key\">접근법\u003c/b>에 해당함을 확인해 주는 \u003cb class=\"key\">요약\u003c/b> 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재 시제 동사\u003c/span> : These efforts [복수 주어] + represent [동사 원형] : \"나타낸다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"These efforts, 이러한 노력들은. represent, 나타낸다. active approaches to management, 관리에 대한 적극적인 접근법을. 이 문장 전체를 해석하면, 이러한 노력들은 관리에 대한 적극적인 접근법을 나타낸다.","hl":"m"},{"n":15,"text":"네 번째 문장에서 말한 여러 가지 구체적인 행동들을 이러한 노력들이라는 말로 받아서, 이것이 바로 적극적 접근법이라는 것을 다시 한번 정리해 주는 문장이에요.","hl":"mn"},{"n":16,"text":"여기서 represent는 현재 시제 동사로 쓰였어요. 주어인 These efforts가 복수이기 때문에 동사에 s를 붙이지 않은 원형 그대로를 썼다는 점에 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 개체군들은\u003c/span>\u003cspan class=\"en\">Other populations\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">적극적으로 관리 되지 않을지도 모른다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">may \u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">actively \u003c/span>\u003cspan class=\"tgt\">managed\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국립 공원들의 개체군들처럼\u003c/span>\u003cspan class=\"en\">like \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">those\u003c/span> in national parks.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">국립 공원들의 개체군들처럼 다른 개체군들은 적극적으로 관리 되지 않을지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이제 화제를 전환하여 인위적 개입을 최소화하는 \u003cb class=\"key\">소극적 \u003c/b>\u003cb class=\"key\">관리\u003c/b>의 사례로 국립 공원을 소개하며, \u003cb class=\"key\">대조\u003c/b>의 흐름을 형성합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 수동태\u003c/span> : may [조동사] + not [부정어] + be managed [be p.p.] : \"관리 되지 않을지도 모른다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대명사\u003c/span> : those [대명사] = populations [명사] : \"개체군들\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"Other populations, 다른 개체군들은. may not be actively managed, 적극적으로 관리 되지 않을지도 모른다. like those in national parks, 국립 공원들의 개체군들처럼. 이 문장 전체를 해석하면, 국립 공원들의 개체군들처럼 다른 개체군들은 적극적으로 관리 되지 않을지도 모른다.","hl":"m"},{"n":18,"text":"앞부분에서는 적극적인 관리를 설명했다면, 이제는 반대 사례를 들기 시작해요. 국립 공원처럼 인간이 굳이 개입하지 않고 그대로 두는 경우를 보여주고 있습니다.","hl":"mn"},{"n":19,"text":"첫 번째로 may not be actively managed는 관리되지 않을 수도 있다는 추측의 수동태예요. 조동사 may 뒤에 부정어 not이 오고 be managed가 이어지는 순서를 잘 보세요. 두 번째로 those는 앞에 나온 복수 명사인 populations를 대신해서 쓰인 대명사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 상황들에서,\u003c/span>\u003cspan class=\"en\">In such situations,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관리 활동 들은 최소화하는데,\u003c/span>\u003cspan class=\"en\">management activities \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">minimize\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">개체군들과 서식지에 대한 외부 영향력을,\u003c/span>\u003cspan class=\"en\">external influences on populations and habitat\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 대체로 포함한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">which\u003c/span> often involves\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동물들이 아닌 인간들에 대한 관리를.\u003c/span>\u003cspan class=\"en\">management of humans and not animals.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러한 상황들에서 관리 활동 들은 개체군들과 서식지에 대한 외부 영향력을 취소하는데, 그것은 대체로 동물들이 아닌 인간들에 대한 관리를 포함한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 비개입적 관리가 이루어지는 국립공원 같은 곳에서는 동물을 직접 조절하기보다 \u003cb class=\"key\">외부 \u003c/b>\u003cb class=\"key\">간섭\u003c/b>을 줄이는 데 집중합니다. 결국 생태계 보존을 위해 관리의 대상을 동물이 아닌 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">행동\u003c/b>으로 설정한다는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어와 동사의 수 일치\u003c/span> : management activities [복수 주어] + minimize [복수 동사] : \"최소화하다 (취소하다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : [선행 문장 내용] + [, which + 동사] : \"그런데 그것은 (~을 포함한다)\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"In such situations, 그러한 상황들에서. management activities minimize, 관리 활동 들은 최소화하는데. external influences on populations and habitat, 개체군들과 서식지에 대한 외부 영향력을. which often involves, 그것은 대체로 포함한다. management of humans and not animals, 동물들이 아닌 인간들에 대한 관리를.. 이 문장 전체를 해석하면, 그러한 상황들에서 관리 활동 들은 개체군들과 서식지에 대한 외부 영향력을 취소하는데, 그것은 대체로 동물들이 아닌 인간들에 대한 관리를 포함한다.","hl":"m"},{"n":21,"text":"국립공원처럼 인위적인 개입을 하지 않는 곳에서는 동물을 직접 건드리지 않아요. 대신 자연을 그대로 두기 위해 외부 영향을 줄이려 노력하는데, 그 결과 관리의 대상이 동물이 아니라 바로 인간의 출입이나 행동이 된다는 의미입니다.","hl":"mn"},{"n":22,"text":"첫 번째 포인트는 주어와 동사의 수 일치입니다. 주어가 management activities라는 복수 형태라서 동사 minimize에 s를 붙이지 않았어요. 두 번째는 콤마 뒤에 나온 which인데요. 이것은 관계대명사의 계속적 용법으로, 앞에서 말한 관리 방식이 구체적으로 어떤 특징을 갖는지 추가 설명을 덧붙여 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":23,"text":"오늘 강의는 여기까지입니다.","hl":null}]}]});</script></body></html>
