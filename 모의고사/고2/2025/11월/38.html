14/IUm5fUd+47de/bv6d6TcuOo6gc/Xjr+f/wBei67huOopu5R1YdSOuOnX8u/v6dKNw9QfxHHr3/kKBXX4217+V/0F9j9f1z+OOP6gUYGMf5/z/wDq6UZHqOM+nGODn6Z56Y79aTcCSMjjH1Of6dvXr0oGLn8v6jtj8KX26/5PJ/L86aGXOAQcZ756dRnPUdwelLkeo/MdqAuu/wDX9NfeL/n/AOt+FFJkZ+8MkkAZGeOo98E8+maMj1H50v6/Ht+t9AFopu5c4yOh7jscEfh39OhoLYGeOvPI6eo5+n0p/gA6ik49fXvjpzzj09PzpAy9iOec5Ht79+Mf/roAU5Of8/qP8+xFLTQynOCOuOooLDnnp9Ofp/n1oAdRTd4AGeOcYzk8dfU8d88+tBZR1IH4+v8Aj1oD9B1IBj8eT9f8/wD6qMjrkenUUm9c4yM/X/Pv6gY5IoAdTWPytjsGz17A8dvzozk8EHjjp1/w4z3+owKacAOQedp5PzDgHAx1OME4688UAf/Z\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">Two Categories of Wildlife Management: Active and Inactive<small>야생동물 관리의 두 가지 범주: 적극적 관리와 소극적 관리<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">이 글을 본격적으로 읽기 전에 생태계를 보호하기 위한 인간의 야생동물 관리(Wildlife management) 개념을 미리 알아두시면 훨씬 이해하기 수월하실 거예요. 자연보호의 책임을 지는 청지기 정신(Stewardship)을 바탕으로, 현대의 환경 당국은 동물의 개체 수나 서식지에 직접 개입하는 적극적 관리(Active management)와 자연 상태를 그대로 유지하는 소극적 관리(Inactive management)라는 두 가지 주요 개입 전략(Intervention strategies)을 사용한답니다. 이는 마치 우리가 예쁜 정원을 가꿀 때, 잡초를 직접 뽑고 씨앗을 뿌려 적극적으로 개입하는 것과 아예 외부 울타리를 쳐서 사람들이 함부로 식물을 밟지 못하도록 사람의 행동만 통제하는 것의 차이와 같아요. 이러한 배경을 바탕으로, 생태계의 균형을 맞추기 위해 때로는 천적을 통제하거나 반대로 인간의 출입을 막는 등 다양한 생태학적 접근법(Ecological approaches)이 실제 자연 현장에서 어떻게 나뉘어 적용되는지 머릿속에 그려보며 지문을 읽어보세요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01야생동물 관리의 분류<\/div><ul><li>야생동물 관리는 보호와 관리의 책임을 수반하며 크게 두 가지 범주로 나뉜다.<\/li><li>야생동물 관리(wildlife is managed)는 관리 책임(stewardship)을 의미함<\/li><li>두 가지 주요 범주: 적극적 관리(active management)와 소극적 관리(inactive management)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02적극적 관리 - 직접적 개입<\/div><ul><li>적극적 관리는 개체군에 직접적인 조치를 취해 그 규모를 조절하는 방식이다.<\/li><li>직접적인 방식(direct manner)으로 개체군(population)의 크기를 증감시킴<\/li><li>주요 전략: 강제 이주(translocations) 및 사냥(hunting)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03적극적 관리 - 환경 및 포식자 개입<\/div><ul><li>직접적인 조절 외에도 서식지를 변경하거나 포식자를 통제하여 개체군을 관리할 수 있다.<\/li><li>서식지(habitat)를 변경하여 개체군에 이익 또는 불이익을 줌<\/li><li>개체수가 적을 경우: 포식자 통제(predator control) 및 서식지 개선 실시<\/li><li>포식자로부터 갓 태어난 새끼(neonates)를 보호하기 위한 은신처(cover) 제공<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04소극적 관리<\/div><ul><li>국립공원과 같은 환경에서는 동물에 대한 직접 개입 없이 외부 영향을 최소화하는 관리가 이루어진다.<\/li><li>개체군과 서식지에 대한 외부 영향(external influences) 최소화<\/li><li>동물이 아닌 사람을 관리(management of humans and not animals)하는 방식<\/li><li>대표적 적용 사례: 국립공원(national parks) 내의 야생동물<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">numerous<\/td><td class=\"m\">수많은, 다양한<\/td><\/tr><tr><td class=\"w\">wildlife<\/td><td class=\"m\">야생 동물<\/td><\/tr><tr><td class=\"w\">imply<\/td><td class=\"m\">의미하다, 수반하다<\/td><\/tr><tr><td class=\"w\">stewardship<\/td><td class=\"m\">관리, 보호<\/td><\/tr><tr><td class=\"w\">classify<\/td><td class=\"m\">분류하다<\/td><\/tr><tr><td class=\"w\">active<\/td><td class=\"m\">적극적인, 능동적인<\/td><\/tr><tr><td class=\"w\">population<\/td><td class=\"m\">개체군, 개체 수<\/td><\/tr><tr><td class=\"w\">respectively<\/td><td class=\"m\">각각, 각기<\/td><\/tr><tr><td class=\"w\">translocation<\/td><td class=\"m\">이동, 이주<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">alter<\/td><td class=\"m\">변경하다, 바꾸다<\/td><\/tr><tr><td class=\"w\">habitat<\/td><td class=\"m\">서식지<\/td><\/tr><tr><td class=\"w\">incorporate<\/td><td class=\"m\">통합하다, 도입하다<\/td><\/tr><tr><td class=\"w\">predator<\/td><td class=\"m\">포식자, 천적<\/td><\/tr><tr><td class=\"w\">minimize<\/td><td class=\"m\">최소화하다<\/td><\/tr><tr><td class=\"w\">neonatal<\/td><td class=\"m\">신생아의, 갓 태어난 새끼의<\/td><\/tr><tr><td class=\"w\">cover<\/td><td class=\"m\">은신처, 피난처<\/td><\/tr><tr><td class=\"w\">represent<\/td><td class=\"m\">해당하다, 나타내다<\/td><\/tr><tr><td class=\"w\">external<\/td><td class=\"m\">외부의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>There are numerous <span class=\"grammar-hl\">ways<\/span><\/b><\/span><span class=\"ko\">수많은 방법들이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">wildlife is managed<\/span>,<\/b><\/span><span class=\"ko\">야생 생물이 관리되는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but they all imply stewardship<\/b><\/span><span class=\"ko\">하지만 그것들은 모두 관리 책임을 수반한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">can be classified<\/span><\/b><\/span><span class=\"ko\">그리고 분류될 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>into two broad categories:<\/b><\/span><span class=\"ko\">두 가지 넓은 범주로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>active management and inactive management.<\/b><\/span><span class=\"ko\">즉 적극적 관리와 소극적 관리로<\/span><\/div><\/div><div class=\"lec-sent-ko\">야생 생물이 관리되는 수많은 방법들이 있지만, 그것들은 모두 관리 책임을 수반하고 적극적 관리와 소극적 관리라는 두 가지 넓은 범주로 분류될 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 문장은 글의 도입부로, 야생동물 관리의 두 가지 주요 방식을 소개하며 앞으로 이어질 내용의 방향을 제시합니다. imply stewardship은 인간이 야생동물과 자연 생태계에 대해 책임감을 가지고 돌보며 관리한다는 의미입니다. 앞으로 적극적 관리와 소극적 관리가 각각 어떻게 이루어지는지 구체적인 설명이 이어집니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is managed (수동태): be동사(is) + p.p.(managed) 구조. manage는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 is managed 형태로 쓴다. (기본구조: manage + O)<\/div><div class=\"lec-gr-item\">ways wildlife is managed (관계부사): 선행사 ways 뒤에 관계부사 how(또는 that)가 생략된 구조로, 뒤에 주어와 수동태 동사가 갖춰진 완전한 절(wildlife is managed)이 와서 선행사를 수식한다.<\/div><div class=\"lec-gr-item\">can be classified (수동태): 조동사(can) + be동사(be) + p.p.(classified) 구조. classify는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 can be classified 형태로 쓴다. (기본구조: classify A into B - A를 B로 분류하다)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">numerous<\/td><td class=\"m\">수많은, 다양한<\/td><\/tr><tr><td class=\"w\">wildlife<\/td><td class=\"m\">야생 동물<\/td><\/tr><tr><td class=\"w\">imply<\/td><td class=\"m\">의미하다, 수반하다<\/td><\/tr><tr><td class=\"w\">stewardship<\/td><td class=\"m\">관리, 보호<\/td><\/tr><tr><td class=\"w\">classify<\/td><td class=\"m\">분류하다<\/td><\/tr><tr><td class=\"w\">active<\/td><td class=\"m\">적극적인, 능동적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Active management does something<\/b><\/span><span class=\"ko\">적극적 관리는 무언가를 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to the population<\/b><\/span><span class=\"ko\">개체군에게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>― such as <span class=\"grammar-hl\">increasing or decreasing<\/span> its size ―<\/b><\/span><span class=\"ko\">― 그 규모를 증가시키거나 감소시키는 것과 같이 ―<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in a direct manner<\/b><\/span><span class=\"ko\">직접적인 방식으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>through strategies<\/b><\/span><span class=\"ko\">전략을 통해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>like translocations or hunting,<\/b><\/span><span class=\"ko\">거주지 이전이나 사냥과 같은,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>respectively.<\/b><\/span><span class=\"ko\">각각<\/span><\/div><\/div><div class=\"lec-sent-ko\">적극적 관리는 거주지 이전이나 사냥과 같은 전략을 통해, 각각 규모를 증가시키거나 감소시키는 것과 같이 무언가를 직접적인 방식으로 개체군에게 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 언급된 두 가지 범주 중 첫 번째인 적극적 관리에 대해 구체적으로 설명하는 문장입니다. in a direct manner는 인간이 적극적으로 개입하여 동물의 수를 조절한다는 의미입니다. 즉, 특정 종을 다른 곳으로 옮겨서 개체 수를 늘리거나, 사냥을 허용해서 수를 줄이는 식으로 야생동물의 규모에 직접적인 변화를 일으키는 행동을 뜻합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">increasing or decreasing (동명사(명사적)): 전치사 such as의 목적어 역할을 하는 동명사로, 등위접속사 or에 의해 increasing과 decreasing이 병렬 구조를 이루고 있다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">active<\/td><td class=\"m\">적극적인, 능동적인<\/td><\/tr><tr><td class=\"w\">population<\/td><td class=\"m\">개체군, 개체 수<\/td><\/tr><tr><td class=\"w\">respectively<\/td><td class=\"m\">각각, 각기<\/td><\/tr><tr><td class=\"w\">translocation<\/td><td class=\"m\">이동, 이주<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Populations <span class=\"grammar-hl\">can also be actively managed<\/span><\/b><\/span><span class=\"ko\">개체군들은 또한 적극적으로 관리될 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">by altering<\/span> the habitat<\/b><\/span><span class=\"ko\">서식지를 변경함으로써<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to the benefit or disadvantage of a population.<\/b><\/span><span class=\"ko\">개체군에게 유리하거나 불리하게<\/span><\/div><\/div><div class=\"lec-sent-ko\">개체군들은 또한 서식지를 개체군에게 유리하거나 불리하게 변경함으로써 적극적으로 관리될 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 적극적 관리의 또 다른 방식을 추가로 설명합니다. 앞 문장에서는 동물의 수를 직접 조절하는 방법을 말했다면, 여기서는 동물이 사는 환경을 바꾸어 간접적으로 영향을 미치는 방법을 제시합니다. altering the habitat은 동물이 더 잘 살 수 있게 먹이나 은신처를 늘려주거나 특정 동물이 번식하기 어렵게 환경을 열악하게 만드는 등 서식 조건 자체에 인간이 손을 댄다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">can also be actively managed (수동태): 조동사(can) + be동사(be) + p.p.(managed) 구조. manage는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 be managed 형태로 쓴다. 부사 actively가 동사구 사이에서 수식한다. (기본구조: manage + O)<\/div><div class=\"lec-gr-item\">by altering (동명사(명사적)): 전치사 by의 목적어로 쓰인 동명사로, &#39;~함으로써&#39;라는 수단이나 방법의 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">active<\/td><td class=\"m\">적극적인, 능동적인<\/td><\/tr><tr><td class=\"w\">population<\/td><td class=\"m\">개체군, 개체 수<\/td><\/tr><tr><td class=\"w\">alter<\/td><td class=\"m\">변경하다, 바꾸다<\/td><\/tr><tr><td class=\"w\">habitat<\/td><td class=\"m\">서식지<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>If population numbers are too low<\/b><\/span><span class=\"ko\">만약 개체 수가 너무 적다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for the goal of management agencies,<\/b><\/span><span class=\"ko\">관리 기관들의 목표에 비해,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>other active management <span class=\"grammar-hl\">can be incorporated<\/span>,<\/b><\/span><span class=\"ko\">다른 적극적 관리가 포함될 수 있다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>such as predator control<\/b><\/span><span class=\"ko\">포식자 통제와 같은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to minimize<\/span> neonatal deaths<\/b><\/span><span class=\"ko\">갓 태어난 개체의 사망을 최소화하기 위한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or habitat improvement<\/b><\/span><span class=\"ko\">또는 서식지 개선과 같은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to provide<\/span> <span class=\"grammar-hl\">required cover<\/span> for neonates<\/b><\/span><span class=\"ko\">갓 태어난 새끼들을 위해 필요한 은신처를 제공하기 위한<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from predators.<\/b><\/span><span class=\"ko\">포식자로부터<\/span><\/div><\/div><div class=\"lec-sent-ko\">만약 개체 수가 관리 기관들의 목표보다 너무 적으면 갓 태어난 개체의 사망을 최소화하는 포식자 통제나 포식자로부터 갓 태어난 새끼들을 위해 필요한 은신처를 제공하는 서식지 개선과 같은 다른 적극적 관리가 포함될 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 설명한 서식지 변경 외에, 특정 개체군을 보호하기 위해 동원할 수 있는 적극적 관리의 구체적인 예시를 들어줍니다. other active management can be incorporated는 동물의 수가 관리 목표치보다 부족할 때 포식자의 수를 줄이거나 새끼들이 숨을 곳을 만들어주는 등 여러 개입 방식을 함께 사용하여 동물의 생존율을 높인다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">can be incorporated (수동태): 조동사(can) + be동사(be) + p.p.(incorporated) 구조. incorporate는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 can be incorporated 형태로 쓴다. (기본구조: incorporate + O)<\/div><div class=\"lec-gr-item\">to minimize (to부정사(부사적): 목적): in order to minimize로 바꾸어도 뜻이 같으며, &#39;최소화하기 위해&#39;라는 목적의 의미로 앞의 동사적 개념을 수식하는 부사적 용법이다.<\/div><div class=\"lec-gr-item\">required cover (과거분사(형용사)): 과거분사 required가 뒤의 명사 cover(은신처)를 수식하여 &#39;요구되는(필요한) 은신처&#39;라는 수동 및 완료의 의미를 나타낸다. (형태: p.p. + N)<\/div><div class=\"lec-gr-item\">to provide (to부정사(부사적): 목적): in order to provide로 바꾸어도 뜻이 같으며, &#39;제공하기 위해&#39;라는 목적을 나타내는 부사적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">active<\/td><td class=\"m\">적극적인, 능동적인<\/td><\/tr><tr><td class=\"w\">population<\/td><td class=\"m\">개체군, 개체 수<\/td><\/tr><tr><td class=\"w\">habitat<\/td><td class=\"m\">서식지<\/td><\/tr><tr><td class=\"w\">incorporate<\/td><td class=\"m\">통합하다, 도입하다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">predator<\/td><td class=\"m\">포식자, 천적<\/td><\/tr><tr><td class=\"w\">minimize<\/td><td class=\"m\">최소화하다<\/td><\/tr><tr><td class=\"w\">neonatal<\/td><td class=\"m\">신생아의, 갓 태어난 새끼의<\/td><\/tr><tr><td class=\"w\">cover<\/td><td class=\"m\">은신처, 피난처<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>These efforts <span class=\"grammar-hl\">represent<\/span> active approaches to management.<\/b><\/span><span class=\"ko\">이러한 노력들은 관리에 대한 적극적인 접근법을 나타낸다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이러한 노력들은 관리에 대한 적극적인 접근법을 나타낸다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 2번 문장부터 4번 문장까지 나열된 구체적인 방법들을 하나로 묶어 정리하며 적극적 관리에 대한 설명을 마무리하는 문장입니다. These efforts는 개체 수를 직접 조절하거나 서식지를 바꾸고 포식자를 통제하는 등 인간이 자연에 구체적인 목적을 가지고 개입했던 앞선 활동들을 모두 가리킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">represent 3형식 동사: 주어(These efforts) 뒤에 위치한 타동사(represent)로, 목적어(active approaches)를 취하여 &#39;나타내다, 의미하다&#39;라는 3형식 문장 구조를 이룬다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">active<\/td><td class=\"m\">적극적인, 능동적인<\/td><\/tr><tr><td class=\"w\">represent<\/td><td class=\"m\">해당하다, 나타내다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Other populations <span class=\"grammar-hl\">may not be actively managed<\/span>,<\/b><\/span><span class=\"ko\">다른 개체군들은 적극적으로 관리되지 않을지도 모른다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>like <span class=\"grammar-hl\">those<\/span> in national parks.<\/b><\/span><span class=\"ko\">국립 공원들의 개체군들처럼<\/span><\/div><\/div><div class=\"lec-sent-ko\">국립 공원들의 개체군들처럼 다른 개체군들은 적극적으로 관리되지 않을지도 모른다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 흐름이 전환되는 지점으로, 1번 문장에서 언급했던 두 번째 범주인 소극적 관리(inactive management)로 화제를 돌립니다. may not be actively managed는 국립공원과 같이 자연 상태를 있는 그대로 보존하는 것을 목표로 하는 곳에서는 인간이 동물의 수나 환경에 인위적으로 손을 대지 않고 그대로 둔다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">may not be actively managed (수동태): 조동사(may) + 부정어(not) + be동사(be) + p.p.(managed) 구조. manage는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 be managed 형태로 쓴다. (기본구조: manage + O)<\/div><div class=\"lec-gr-item\">those 대명사: 앞서 언급된 복수 명사(populations)의 반복을 피하기 위해 쓰인 지시대명사로, 뒤에 오는 전치사구(in national parks)의 수식을 받는다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">active<\/td><td class=\"m\">적극적인, 능동적인<\/td><\/tr><tr><td class=\"w\">population<\/td><td class=\"m\">개체군, 개체 수<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In such situations,<\/b><\/span><span class=\"ko\">그러한 상황들에서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>management activities minimize external influences<\/b><\/span><span class=\"ko\">관리 활동들은 외부 영향력을 최소화한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on populations and habitat,<\/b><\/span><span class=\"ko\">개체군들과 서식지에 대한,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> often involves management of humans<\/b><\/span><span class=\"ko\">그런데 그것은 대체로 인간에 대한 관리를 포함한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and not animals.<\/b><\/span><span class=\"ko\">동물들이 아니라<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러한 상황들에서 관리 활동들은 개체군들과 서식지에 대한 외부 영향력을 최소화하는데, 그것은 대체로 동물들이 아닌 인간들에 대한 관리를 포함한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 소개한 소극적 관리가 구체적으로 어떻게 이루어지는지 설명하며 글을 맺습니다. minimize external influences는 사람들이 자연을 훼손하지 못하도록 출입과 활동을 통제하여 인간의 행동을 규제함으로써 자연을 간접적으로 보호한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">which 관계대명사(계속적 용법): 콤마(,) 뒤에 이어지는 주격 관계대명사로, 앞 절의 내용 전체(management activities minimize ~ habitat)를 선행사로 받아 부연 설명한다. 절 내부에서 주어 역할을 하므로 뒤에는 주어가 빠진 채 동사(involves)가 바로 이어진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">population<\/td><td class=\"m\">개체군, 개체 수<\/td><\/tr><tr><td class=\"w\">habitat<\/td><td class=\"m\">서식지<\/td><\/tr><tr><td class=\"w\">minimize<\/td><td class=\"m\">최소화하다<\/td><\/tr><tr><td class=\"w\">external<\/td><td class=\"m\">외부의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>야생동물 관리는 크게 적극적 관리와 소극적 관리로 나뉜다.<\/li><li>적극적 관리는 동물의 개체 수를 직접 조절하거나 서식지 환경을 바꾸고 포식자를 통제하는 등 인간이 자연에 인위적으로 개입하는 방식이다.<\/li><li>반면 국립공원 등에서 이루어지는 소극적 관리는 동물의 수나 서식지를 직접 통제하지 않는다.<\/li><li>대신 사람들이 자연에 미치는 외부 영향을 최소화하기 위해 동물이 아닌 사람의 활동을 통제하고 규제하는 방식으로 야생동물을 보호한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Wildlife management employs active methods to directly control animal populations and habitats, whereas inactive methods focus on minimizing human interference.<\/div>\n              <div class=\"lec-final-sum-ko\">야생동물 관리는 동물 개체수와 서식지를 직접 통제하기 위해 적극적인 방법을 사용하는 반면, 소극적인 방법은 인간의 간섭을 최소화하는 데 중점을 둔다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./38_audio/1.mp3","hl":null}],[{"audio":"./38_audio/2.mp3","hl":null}],[{"audio":"./38_audio/3.mp3","hl":null},{"audio":"./38_audio/4.mp3","hl":"stage-0"},{"audio":"./38_audio/5.mp3","hl":"stage-1"},{"audio":"./38_audio/6.mp3","hl":"stage-2"},{"audio":"./38_audio/7.mp3","hl":"stage-3"}],[{"audio":"./38_audio/8.mp3","hl":null} 물에 대한 직접 개입 없이 외부 영향을 최소화하는 관리가 이루어진다.","개체군과 서식지에 대한 외부 영향(external influences) 최소화","동물이 아닌 사람을 관리(management of humans and not animals)하는 방식","대표적 적용 사례: 국립공원(national parks) 내의 야생동물"]}],"bkg":"이 글을 본격적으로 읽기 전에 생태계를 보호하기 위한 인간의 야생동물 관리(Wildlife management) 개념을 미리 알아두시면 훨씬 이해하기 수월하실 거예요. 자연보호의 책임을 지는 청지기 정신(Stewardship)을 바탕으로, 현대의 환경 당국은 동물의 개체 수나 서식지에 직접 개입하는 적극적 관리(Active management)와 자연 상태를 그대로 유지하는 소극적 관리(Inactive management)라는 두 가지 주요 개입 전략(Intervention strategies)을 사용한답니다. 이는 마치 우리가 예쁜 정원을 가꿀 때, 잡초를 직접 뽑고 씨앗을 뿌려 적극적으로 개입하는 것과 아예 외부 울타리를 쳐서 사람들이 함부로 식물을 밟지 못하도록 사람의 행동만 통제하는 것의 차이와 같아요. 이러한 배경을 바탕으로, 생태계의 균형을 맞추기 위해 때로는 천적을 통제하거나 반대로 인간의 출입을 막는 등 다양한 생태학적 접근법(Ecological approaches)이 실제 자연 현장에서 어떻게 나뉘어 적용되는지 머릿속에 그려보며 지문을 읽어보세요.","ttsText":"이 글을 본격적으로 읽기 전에 생태계를 보호하기 위한 인간의 야생동물 관리(Wildlife management) 개념을 미리 알아두시면 훨씬 이해하기 수월하실 거예요. 자연보호의 책임을 지는 청지기 정신(Stewardship)을 바탕으로, 현대의 환경 당국은 동물의 개체 수나 서식지에 직접 개입하는 적극적 관리(Active management)와 자연 상태를 그대로 유지하는 소극적 관리(Inactive management)라는 두 가지 주요 개입 전략(Intervention strategies)을 사용한답니다. 이는 마치 우리가 예쁜 정원을 가꿀 때, 잡초를 직접 뽑고 씨앗을 뿌려 적극적으로 개입하는 것과 아예 외부 울타리를 쳐서 사람들이 함부로 식물을 밟지 못하도록 사람의 행동만 통제하는 것의 차이와 같아요. 이러한 배경을 바탕으로, 생태계의 균형을 맞추기 위해 때로는 천적을 통제하거나 반대로 인간의 출입을 막는 등 다양한 생태학적 접근법(Ecological approaches)이 실제 자연 현장에서 어떻게 나뉘어 적용되는지 머릿속에 그려보며 지문을 읽어보세요.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 38번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 38번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고2 / 2025년 / 10월 / 38번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고2 / 2025년 / 10월 / 38번","titleEn":"Two Categories of Wildlife Management: Active and Inactive","titleKo":"야생동물 관리의 두 가지 범주: 적극적 관리와 소극적 관리","imageUrl":"__enpImg__","stages":[{"label":"01야생동물 관리의 분류","items":["야생동물 관리는 보호와 관리의 책임을 수반하며 크게 두 가지 범주로 나뉜다.","야생동물 관리(wildlife is managed)는 관리 책임(stewardship)을 의미함","두 가지 주요 범주: 적극적 관리(active management)와 소극적 관리(inactive management)"]},{"label":"02적극적 관리 - 직접적 개입","items":["적극적 관리는 개체군에 직접적인 조치를 취해 그 규모
