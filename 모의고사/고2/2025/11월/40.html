g/iXk4+8v8Aj/8AXobstOllrd9vV/g90Nq2+4//AD/n/P8A9c4H4/5P+fX3NM8xMkbl7fxDofqeefTPUDrR5iZHzKPXJA7E49Mjvz2xQ+2nbf0/z7a6dwtZ6j/6+9NHI5wT0OPrj+n6Z7Um5Sfvr/30vTjOc9Bxzz+PooZOm5e56ge/XI98+vf3Lr8/w3+4Qo/Qcf5zzx2/wxTckcnkEYAHr+ZHPrz2pd6H+JcEf3h3/HNIZEGfmHHPUfzzj9aFvo7t20v+KXmG2/8AkPo/z/n/AD+VM8xP7y9M53DAHPvj/wDVxQZEH8Q/MHHuef8AP50en/D7fntdh/w/y+Xqh9H+f89aaHQjIZcf7w4+vP8Ak0hkVc/MoK4zkj9MZ+oABz070a7Pdb+vb+v87A/8Mfl/T1qJ3G1l49jn05OB7HHT0zTXcE9R3x8wwfXGQD/M9O9QO23cx7Iw65A43YBwBjOOnHvyacbXjtfRu+/2fS7X2uncIptrR30vbdWffT/L9f/Z\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">Man-Made Time vs. Natural Time: An Unyielding Reality<small>인위적 시간 대 자연적 시간: 굴복하지 않는 현실<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">우리가 매일 스마트폰으로 확인하는 시간은 1초의 오차도 없이 규칙적이지만, 실제 우주와 자연의 시간은 그렇지 않다는 사실을 아시나요? 이 지문을 깊이 이해하시려면 인위적인 시간과 자연의 시간 사이의 오차를 줄여주는 윤초(Leap second)라는 핵심 개념을 미리 알아두시면 좋습니다. 인간이 만든 시계가 한 치의 오차도 없는 정밀한 메트로놈이라면, 우주의 시간인 지구 자전(Earth&#39;s rotation)은 달의 중력이나 태평양의 기후 변화 현상인 엘니뇨(El Niño) 등의 외부 요인에 영향을 받아 마치 바닥이 울퉁불퉁한 곳에서 도는 팽이처럼 미세하게 느려지거나 불규칙해지거든요. 세계의 과학자들은 이렇게 어긋나는 두 시간의 보폭을 맞추기 위해 자연의 주기에 맞춰 인위적으로 1초를 더하거나 빼는 조치를 취하게 됩니다. 따라서 이 글을 읽으실 때는 우리가 쓰는 시계의 시간은 자연의 섭리를 억지로 규격화한 인간의 발명품일 뿐이라는 과학적 배경을 머릿속에 그려보시면 글쓴이의 의도를 훨씬 쉽게 파악하실 수 있을 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입<\/div><ul><li>인간은 시간을 일관된 것으로 여기는 인위적인 관념을 가졌으나, 종종 이것이 오류임을 깨닫게 된다.<\/li><li>시간을 구매 가능하고 일관된 상품(consistent product)으로 간주함<\/li><li>인위적 관점(artificial views)이 인간의 정신에 굳어짐<\/li><li>이러한 생각이 오류(mistake)임을 강제로 깨닫는 순간들이 존재함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02자연적 시간의 변화 원인<\/div><ul><li>지구의 자전 속도는 기후 변화나 달의 중력 같은 자연적 요인에 의해 미세하게 변동한다.<\/li><li>엘니뇨와 같은 기후 현상이 지구의 자전(rotation)을 늦춤<\/li><li>달의 중력(moon&#39;s gravity)이 끌어당기는 힘으로 작용해 하루가 길어짐<\/li><li>지구의 흔들림과 자전 속도 변화(rate of its spin changing)가 발생함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03인위적 조정<\/div><ul><li>자연의 유연한 시간과 인간이 만든 시간의 괴리를 메우기 위해 인간은 임의로 시간을 조정한다.<\/li><li>인위적 시간(man-made time)과 유연한 시간(flexible time) 간의 유사성이 깨짐<\/li><li>인간들이 모르게 하루에 작은 시간의 조각(small slice of time)을 추가함<\/li><li>지난 50년간 26번에 걸쳐 1초(a second)를 임의로 더해옴<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론<\/div><ul><li>고정된 시간 관념을 자연에 억지로 맞추려는 인간의 시도는 결국 자연에 의해 좌절된다.<\/li><li>고정된 인위적 시각(fixed, man-made view)을 자연(nature)에 강요(force)하려 함<\/li><li>자연이 굴복할 것이라는 헛된 희망(false hope)을 가짐<\/li><li>결론: 자연은 결코 인간의 뜻대로 굴복하지 않음(It doesn&#39;t)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consistent<\/td><td class=\"m\">일관된, 한결같은<\/td><\/tr><tr><td class=\"w\">cement<\/td><td class=\"m\">굳건하게 하다, 결속시키다<\/td><\/tr><tr><td class=\"w\">artificial<\/td><td class=\"m\">인위적인, 인공적인<\/td><\/tr><tr><td class=\"w\">psyche<\/td><td class=\"m\">정신, 마음<\/td><\/tr><tr><td class=\"w\">every now and again<\/td><td class=\"m\">가끔, 때때로<\/td><\/tr><tr><td class=\"w\">be forced to<\/td><td class=\"m\">어쩔 수 없이 ~하다, 강요받다<\/td><\/tr><tr><td class=\"w\">acknowledge<\/td><td class=\"m\">인정하다<\/td><\/tr><tr><td class=\"w\">adjust for<\/td><td class=\"m\">~에 맞춰 조정하다, ~을 고려하여 조정하다<\/td><\/tr><tr><td class=\"w\">wobble<\/td><td class=\"m\">흔들리다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rotation<\/td><td class=\"m\">자전, 회전<\/td><\/tr><tr><td class=\"w\">act as<\/td><td class=\"m\">~의 역할을 하다<\/td><\/tr><tr><td class=\"w\">drag<\/td><td class=\"m\">끌어당기는 힘, 저항<\/td><\/tr><tr><td class=\"w\">disturb<\/td><td class=\"m\">어지럽히다, 방해하다<\/td><\/tr><tr><td class=\"w\">flexible<\/td><td class=\"m\">유연한, 신축성 있는<\/td><\/tr><tr><td class=\"w\">based on<\/td><td class=\"m\">~에 근거하여, ~에 바탕을 둔<\/td><\/tr><tr><td class=\"w\">without one&#39;s knowledge<\/td><td class=\"m\">~도 모르게, ~가 모르는 사이에<\/td><\/tr><tr><td class=\"w\">force on<\/td><td class=\"m\">~을 억지로 강요하다<\/td><\/tr><tr><td class=\"w\">yield<\/td><td class=\"m\">굴복하다, 항복하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Viewing<\/span> time as a purchasable and consistent product<\/b><\/span><span class=\"ko\">시간을 구매 가능하고 불변하는 상품으로 보는 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>cemented artificial views on time<\/b><\/span><span class=\"ko\">시간에 대한 인위적인 관점을 굳혔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>into our psyche,<\/b><\/span><span class=\"ko\">우리의 정신 속에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but <span class=\"grammar-hl\">every now and again<\/span><\/b><\/span><span class=\"ko\">하지만 때때로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we <span class=\"grammar-hl\">are forced to acknowledge<\/span> this mistake.<\/b><\/span><span class=\"ko\">우리는 이러한 실수를 인정하지 않을 수 없다<\/span><\/div><\/div><div class=\"lec-sent-ko\">시간을 구매 가능하고 불변하는 상품으로 보는 것은 시간에 대한 인위적인 관점을 우리의 정신 속에 굳혔지만, 때때로 우리는 이러한 실수를 인정하지 않을 수 없다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 문장은 글의 주제를 제시하며, 우리가 시간을 돈으로 살 수 있고 변하지 않는 규칙적인 것으로 착각하고 있음을 지적합니다. cemented artificial views on time into our psyche는 우리가 만든 1분 1초라는 기계적이고 인위적인 시간 개념이 우리 머릿속에 아주 단단히 박혀 당연한 진리처럼 여겨지게 되었다는 의미입니다. 글쓴이는 이것을 &#39;오류&#39;라고 부르며, 앞으로 우리가 왜 이 착각을 깨닫게 되는지 구체적인 사례로 이어집니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Viewing (동명사(명사적)): 문장의 주어 역할을 하는 명사적 개념이다. &#39;view A as B (A를 B로 간주하다)&#39; 구조가 명사화되었다.<\/div><div class=\"lec-gr-item\">are forced to acknowledge (수동태): be동사(are) + p.p.(forced) 구조. force는 타동사로 force + O + to V (5형식) 구조인데, 목적어가 주어로 올라가 수동구조 are forced가 되고, 뒤의 보어인 부정사(to acknowledge)는 구조가 그대로 남는다. 타동사인데 뒤에 목적어가 없어서 수동구조 are forced 형태로 쓴다. 이 안의 to acknowledge는 목적격보어(to부정사)이며, 명사 수식이 아니므로 형용사적이라 하지 않는다.<\/div><div class=\"lec-gr-item\">every now and again (관용표현): &#39;가끔, 때때로&#39;를 의미하는 굳어진 부사구 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">consistent<\/td><td class=\"m\">일관된, 한결같은<\/td><\/tr><tr><td class=\"w\">cement<\/td><td class=\"m\">굳건하게 하다, 결속시키다<\/td><\/tr><tr><td class=\"w\">artificial<\/td><td class=\"m\">인위적인, 인공적인<\/td><\/tr><tr><td class=\"w\">psyche<\/td><td class=\"m\">정신, 마음<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">every now and again<\/td><td class=\"m\">가끔, 때때로<\/td><\/tr><tr><td class=\"w\">be forced to<\/td><td class=\"m\">어쩔 수 없이 ~하다, 강요받다<\/td><\/tr><tr><td class=\"w\">acknowledge<\/td><td class=\"m\">인정하다<\/td><\/tr><tr><td class=\"w\">force on<\/td><td class=\"m\">~을 억지로 강요하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>On twenty-six occasions in the last fifty years,<\/b><\/span><span class=\"ko\">지난 50년 동안 26회에 걸쳐,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a second <span class=\"grammar-hl\">has been added<\/span><\/b><\/span><span class=\"ko\">1초가 추가되어 왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to everyone’s day<\/b><\/span><span class=\"ko\">모든 사람의 하루에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to adjust<\/span> for the Earth <span class=\"grammar-hl\">wobbling<\/span><\/b><\/span><span class=\"ko\">지구가 흔들리는 것에 맞추기 위해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and the rate of its spin changing.<\/b><\/span><span class=\"ko\">그리고 그것의 자전 속도가 변하는 것에<\/span><\/div><\/div><div class=\"lec-sent-ko\">지난 50년 동안 26회에 걸쳐 지구가 흔들리는 것과 그것의 자전 속도가 변하는 것에 맞추기 위해 모든 사람의 하루에 1초가 추가되어 왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 말한 우리가 착각을 깨닫는 구체적인 첫 번째 사례를 제시합니다. 지구는 완벽하게 일정한 속도로 도는 것이 아니라 미세하게 흔들리거나 자전 속도가 변하기 때문에, 우리가 만든 시계와 실제 자연의 시간 사이에 차이가 생기게 됩니다. a second has been added to everyone’s day는 이 오차를 메우기 위해 전 세계적으로 공식 시계에 1초를 멈추거나 더해 넣는 &#39;윤초(leap second)&#39; 제도를 설명하는 것입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">has been added (수동태): be동사(been) + p.p.(added)가 결합된 현재완료 수동태이다. 기본구조: add + O + to B (O를 B에 더하다). add는 타동사인데 뒤에 목적어가 없어서 수동구조 has been added 형태로 쓴다.<\/div><div class=\"lec-gr-item\">to adjust (to부정사(부사적): 목적): in order to adjust로 바꿔도 뜻이 같으므로 부사적(목적) 용법이다.<\/div><div class=\"lec-gr-item\">wobbling (동명사(명사적)): 전치사 for의 목적어로 쓰인 -ing 명사 개념이다. 바로 앞의 the Earth는 이 동명사의 의미상 주어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">adjust for<\/td><td class=\"m\">~에 맞춰 조정하다, ~을 고려하여 조정하다<\/td><\/tr><tr><td class=\"w\">wobble<\/td><td class=\"m\">흔들리다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>For instance,<\/b><\/span><span class=\"ko\">예를 들어,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>when El Niño, a climatic system in the Pacific,<\/b><\/span><span class=\"ko\">태평양의 한 기후 체계인 엘니뇨가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">causes wind speed to change<\/span> dramatically,<\/b><\/span><span class=\"ko\">바람의 속도가 극적으로 바뀌는 것을 유발할 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it can slow the rotation of the Earth slightly.<\/b><\/span><span class=\"ko\">그것은 지구의 자전을 약간 느리게 할 수 있다<\/span><\/div><\/div><div class=\"lec-sent-ko\">예를 들어 태평양의 한 기후 체계인 엘니뇨가 바람의 속도가 극적으로 바뀌는 것을 유발할 때, 그것은 지구의 자전을 약간 느리게 할 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 문장에서 언급한 지구 자전 속도 변화의 구체적인 원인 중 하나를 예를 들어 설명합니다. can slow the rotation of the Earth slightly는 대기의 움직임이나 날씨 변화 같은 자연 현상조차 거대한 지구의 도는 속도에 영향을 미쳐, 결과적으로 하루라는 자연의 시간을 미세하게 늘어나게 만든다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">causes wind speed to change 5형식(SVOC) 구조: 동사(causes) + 목적어(wind speed) + 목적격보어(to change) 형태이다. cause는 목적격보어로 to부정사를 취하며, 이 때 to change는 목적격보어(to부정사)이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rotation<\/td><td class=\"m\">자전, 회전<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Indeed,<\/b><\/span><span class=\"ko\">실제로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the Earth’s spin is generally slowing<\/b><\/span><span class=\"ko\">지구의 자전은 일반적으로 느려지고 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because the moon’s gravity is <span class=\"grammar-hl\">acting as a drag<\/span>,<\/b><\/span><span class=\"ko\">달의 중력이 끌어당기는 힘으로 작용하고 있기 때문에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so days are <span class=\"grammar-hl\">getting longer<\/span><\/b><\/span><span class=\"ko\">그래서 하루는 점점 더 길어지고 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by about 1.7 milliseconds per century.<\/b><\/span><span class=\"ko\">한 세기마다 약 1.7밀리세컨드씩<\/span><\/div><\/div><div class=\"lec-sent-ko\">실제로 지구의 자전은 일반적으로 느려지고 있는데 이는 달의 중력이 끌어당기는 힘으로 작용하고 있기 때문이고, 그래서 하루는 한 세기마다 약 1.7밀리세컨드씩 점점 더 길어지고 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 지구 자전 속도를 늦추는 또 다른, 그리고 더 지속적인 원인인 달의 중력을 덧붙여 설명합니다. is acting as a drag는 달이 지구를 당기는 힘이 마치 브레이크처럼 작용하여 지구가 도는 것을 방해하고 있다는 의미입니다. 이 때문에 자연이 만들어내는 진짜 하루의 길이는 우리가 시계로 정해둔 24시간보다 눈에 띄지 않게 계속 늘어나고 있음을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is slowing (현재진행): be동사(is) + -ing(slowing) 형태로, 동명사나 현재분사가 아니라 &#39;현재 진행 중인 동작&#39;을 나타내는 서술어 구조이다.<\/div><div class=\"lec-gr-item\">acting as a drag (관용표현): act as(~의 역할을 하다, ~로 작용하다)라는 굳어진 표현이 현재진행형(is acting)으로 쓰였다.<\/div><div class=\"lec-gr-item\">getting longer 2형식 구조: get(상태변화 동사) + 형용사 보어(longer) 형태로 구성되어 주어의 상태 변화를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">act as<\/td><td class=\"m\">~의 역할을 하다<\/td><\/tr><tr><td class=\"w\">drag<\/td><td class=\"m\">끌어당기는 힘, 저항<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Such events disturb the similarity<\/b><\/span><span class=\"ko\">그러한 사건들은 유사성을 깨뜨린다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>between <span class=\"grammar-hl\">man-made<\/span> time and more flexible time<\/b><\/span><span class=\"ko\">인간이 만든 시간과 더 유연한 시간 사이의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">based on<\/span> the Earth’s naturally <span class=\"grammar-hl\">occurring<\/span> rotation.<\/b><\/span><span class=\"ko\">지구의 자연적으로 발생하는 자전에 기반한<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러한 사건들은 인간이 만든 시간과 지구의 자연적으로 발생하는 자전에 기반한 더 유연한 시간 사이의 유사성을 깨뜨린다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 지금까지 설명한 자연 현상들(엘니뇨, 달의 중력 등)을 하나로 묶어, 이것이 인간의 시간과 자연의 시간 사이에 틈을 만든다고 결론짓습니다. disturb the similarity를 &#39;유사성을 방해하다&#39;라고 직역하면 어렵게 느껴집니다. 쉽게 말해 시계가 가리키는 기계적인 시간과 지구가 도는 실제 자연의 시간이 똑같이 흘러가야 하는데, 이 둘의 박자가 어긋나게 만든다는 뜻입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">man-made (과거분사(형용사)): p.p. 형태가 뒤의 명사 time을 수식하는 형용사적 기능이다. p.p. + N = &#39;p.p.된 N&#39;의 구조를 가진다.<\/div><div class=\"lec-gr-item\">based on (과거분사(형용사)): based on ... 구문 전체가 앞의 명사 time을 수식한다. N + p.p. 구조로 &#39;N that is/was p.p.&#39;의 축약 관계절과 같다. (명사 수식 분사이므로 수동태 고정문구를 쓰지 않는다).<\/div><div class=\"lec-gr-item\">occurring (현재분사(형용사)): -ing가 N을 수식하는 형용사적 기능으로, occurring이 뒤의 명사 rotation을 수식(= &#39;발생하는 회전&#39;)한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">rotation<\/td><td class=\"m\">자전, 회전<\/td><\/tr><tr><td class=\"w\">disturb<\/td><td class=\"m\">어지럽히다, 방해하다<\/td><\/tr><tr><td class=\"w\">flexible<\/td><td class=\"m\">유연한, 신축성 있는<\/td><\/tr><tr><td class=\"w\">based on<\/td><td class=\"m\">~에 근거하여, ~에 바탕을 둔<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When events like this happen,<\/b><\/span><span class=\"ko\">이런 일이 발생할 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a bunch of humans make the decision<\/b><\/span><span class=\"ko\">몇몇 사람들은 결정을 내린다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to add<\/span> a small slice of time<\/b><\/span><span class=\"ko\">아주 짧은 시간 조각을 추가하기로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to your day,<\/b><\/span><span class=\"ko\">여러분의 하루에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>without your knowledge.<\/b><\/span><span class=\"ko\">여러분도 모르는 사이에<\/span><\/div><\/div><div class=\"lec-sent-ko\">이런 일이 발생할 때, 몇몇 사람들은 여러분도 모르는 사이에 여러분의 하루에 아주 짧은 시간 조각을 추가하기로 결정한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 시계와 자연의 시간이 어긋날 때 인간이 어떻게 대처하는지 보여줍니다. without your knowledge는 평범한 우리는 시계가 절대적이라고 믿으며 살아가지만, 실제로는 시간 표준을 정하는 소수의 전문가들이 인위적으로 시곗바늘을 조작해 자연과의 오차를 몰래 덮어버린다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to add (to부정사(형용사적)): 앞의 명사 the decision을 수식한다. decision + to V 형태로, to add를 빼면 decision이 갈 곳을 잃고 &#39;~할 결정&#39;으로 해석되므로 형용사적 용법이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">without one&#39;s knowledge<\/td><td class=\"m\">~도 모르게, ~가 모르는 사이에<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>We try <span class=\"grammar-hl\">to force<\/span> our <span class=\"grammar-hl\">fixed<\/span>, man-made view of time<\/b><\/span><span class=\"ko\">우리는 우리의 고정된, 인간이 만든 시간에 대한 관점을 강요하려고 노력한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on to nature<\/b><\/span><span class=\"ko\">자연에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in <span class=\"grammar-hl\">the false hope<\/span><\/b><\/span><span class=\"ko\">헛된 희망을 지니고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that it will yield<\/span>.<\/b><\/span><span class=\"ko\">자연이 굴복할 것이라는<\/span><\/div><\/div><div class=\"lec-sent-ko\">우리는 자연이 굴복할 것이라는 헛된 희망을 지니고 우리의 고정된, 인간이 만든 시간에 대한 관점을 자연에 강요하려고 노력한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글쓴이는 자연의 시간을 통제하려는 인간의 오만함을 꼬집습니다. in the false hope that it will yield — 글쓴이는 여기서 힘주어 말합니다. 자연은 결코 우리 시계에 맞춰서 규칙적으로 돌아주지 않는데도, 우리는 자연이 인간의 수학적이고 기계적인 규칙에 순응해 줄 것이라 착각하며 억지를 부리고 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">fixed (과거분사(형용사)): p.p.가 형용사적 기능으로 쓰여 뒤의 명사 view를 수식(= &#39;고정된 시각&#39;)한다.<\/div><div class=\"lec-gr-item\">to force (to부정사(명사적)): 동사 try의 목적어 자리에 쓰였으므로 명사적 용법이다.<\/div><div class=\"lec-gr-item\">the false hope that it will yield 동격의 that: 명사(hope) + that + S(it) + V(will yield) 형태로, 뒤 that절이 앞 명사(hope)의 내용을 구체화/설명(그것이 양보할 것이라는 희망)하므로 동격의 that이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be forced to<\/td><td class=\"m\">어쩔 수 없이 ~하다, 강요받다<\/td><\/tr><tr><td class=\"w\">force on<\/td><td class=\"m\">~을 억지로 강요하다<\/td><\/tr><tr><td class=\"w\">yield<\/td><td class=\"m\">굴복하다, 항복하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>It <span class=\"grammar-hl\">doesn’t<\/span>.<\/b><\/span><span class=\"ko\">자연은 그러지 않는다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러나 자연은 그러지 않는다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 헛된 희망에 대한 단호한 대답이자 글의 결론입니다. 아무리 인간이 시계를 정밀하게 맞추고 인위적인 규칙을 만들어도, 대자연의 흐름과 우주의 변화는 결코 인간의 통제나 기계적인 기준에 얽매이지 않는다는 점을 짧고 강력하게 전달합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">doesn’t 대동사(do/does/did): does(doesn&#39;t)가 앞 문장의 일반동사(yield)를 대신해 반복을 피하는 대동사(pro-verb)로 쓰였다. 앞의 동사가 be동사이면 be동사, 일반동사이면 do[does,did], be동사+p.p.(수동)이면 be동사를 쓴다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>인간은 시간을 1분 1초가 정확히 맞아떨어지는 규칙적인 상품처럼 생각하며 인위적인 잣대를 들이댄다.<\/li><li>하지만 엘니뇨나 달의 중력 같은 거대한 자연 현상으로 인해 지구의 자전 속도는 미세하게 계속 변한다.<\/li><li>이렇게 인간의 시계와 진짜 자연의 시간이 어긋날 때마다, 전문가들이 시계에 1초를 추가해 억지로 오차를 맞춘다.<\/li><li>인간은 자신들이 만든 기계적인 시간에 자연을 맞추려 하지만, 대자연은 결코 그런 인위적인 규칙에 굴복하지 않는다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Although people attempt to force a consistent and artificial time system onto nature, they are inevitably required to adjust it to accommodate the Earth&#39;s natural variations.<\/div>\n              <div class=\"lec-final-sum-ko\">사람들은 일관되고 인위적인 시간 체계를 자연에 강요하려고 시도하지만, 지구의 자연적인 변화를 수용하기 위해 불가피하게 그것을 조정해야만 한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./40_audio/1.mp3","hl":null}],[{"audio":"./40_audio/2.mp3","hl":null}],[{"audio":"./40_audio/3.mp3","hl":null},{"audio":"./40_audio/4.mp3","hl":"stage-0"},{"audio":"./40_audio/5.mp3","hl":"stage-1"},{"audio":"./40_audio/6.mp3","hl":"stage-2"},{"audio":"./40_audio/7.mp3","hl":"stage-3"}],[{"audio":"./40_audio/8.mp3","hl":null}],[{"audio":"./40_audio/9.mp3","hl":"main"},{"audio":"./40_audio/10.mp3","hl":"meaning"},{"audio":"./40_audio/11.mp3","hl":"grammar"}],[{"audio":"./40_audio/12.mp3","hl":"main"},{"audio":"./40_audio/13.mp3","hl":"meaning"},{"audio":"./40_audio/14.mp3","hl":"grammar"}],[{"audio":"./40_audio/15.mp3","hl":"main"},{"audio":"./40_audio/16.mp3","hl":"meaning"},{"audio":"./40_audio/17.mp3","hl":"grammar"}],[{"audio":"./40_audio/18.mp3","hl":"main"},{"audio":"./40_audio/19.mp3","hl":"meaning"},{"audio":"./40_audio/20.mp3","hl":"grammar"}],[{"audio":"./40_audio/21.mp3","hl":"main"},{"audio":"./40_audio/22.mp3","hl":"meaning"},{"audio":"./40_audio/23.mp3","hl":"grammar"}],[{"audio":"./40_audio/24.mp3","hl":"main"},{"audio":"./40_audio/25.mp3","hl":"meaning"},{"audio":"./40_audio/26.mp3","hl":"grammar"}],[{"audio":"./40_audio/27.mp3","hl":"main"},{"audio":"./40_audio/28.mp3","hl":"meaning"},{"audio":"./40_audio/29.mp3","hl":"grammar"}],[{"audio":"./40_audio/30.mp3","hl":"main"},{"audio":"./40_audio/31.mp3","hl":"meaning"},{"audio":"./40_audio/32.mp3","hl":"grammar"}],[{"audio":"./40_audio/33.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_40번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 40번","titleEn":"Man-Made Time vs. Natural Time: An Unyielding Reality","titleKo":"인위적 시간 대 자연적 시간: 굴복하지 않는 현실","imageUrl":"__enpImg__","stages":[{"label":"01도입","items":["인간은 시간을 일관된 것으로 여기는 인위적인 관념을 가졌으나, 종종 이것이 오류임을 깨닫게 된다.","시간을 구매 가능하고 일관된 상품(consistent product)으로 간주함","인위적 관점(artificial views)이 인간의 정신에 굳어짐","이러한 생각이 오류(mistake)임을 강제로 깨닫는 순간들이 존재함"]},{"label":"02자연적 시간의 변화 원인","items":["지구의 자전 속도는 기후 변화나 달의 중력 같은 자연적 요인에 의해 미세하게 변동한다.","엘니뇨와 같은 기후 현상이 지구의 자전(rotation)을 늦춤","달의 중력(moon's gravity)이 끌어당기는 힘으로 작용해 하루가 길어짐","지구의 흔들림과 자전 속도 변화(rate of its spin changing)가 발생함"]},{"label":"03인위적 조정","items":["자연의 유연한 시간과 인간이 만든 시간의 괴리를 메우기 위해 인간은 임의로 시간을 조정한다.","인위적 시간(man-made time)과 유연한 시간(flexible time) 간의 유사성이 깨짐","인간들이 모르게 하루에 작은 시간의 조각(small slice of time)을 추가함","지난 50년간 26번에 걸쳐 1초(a second)를 임의로 더해옴"]},{"label":"04결론","items":["고정된 시간 관념을 자연에 억지로 맞추려는 인간의 시도는 결국 자연에 의해 좌절된다.","고정된 인위적 시각(fixed, man-made view)을 자연(nature)에 강요(force)하려 함","자연이 굴복할 것이라는 헛된 희망(false hope)을 가짐","결론: 자연은 결코 인간의 뜻대로 굴복하지 않음(It doesn't)"]}],"bkg":"우리가 매일 스마트폰으로 확인하는 시간은 1초의 오차도 없이 규칙적이지만, 실제 우주와 자연의 시간은 그렇지 않다는 사실을 아시나요? 이 지문을 깊이 이해하시려면 인위적인 시간과 자연의 시간 사이의 오차를 줄여주는 윤초(Leap second)라는 핵심 개념을 미리 알아두시면 좋습니다. 인간이 만든 시계가 한 치의 오차도 없는 정밀한 메트로놈이라면, 우주의 시간인 지구 자전(Earth's rotation)은 달의 중력이나 태평양의 기후 변화 현상인 엘니뇨(El Niño) 등의 외부 요인에 영향을 받아 마치 바닥이 울퉁불퉁한 곳에서 도는 팽이처럼 미세하게 느려지거나 불규칙해지거든요. 세계의 과학자들은 이렇게 어긋나는 두 시간의 보폭을 맞추기 위해 자연의 주기에 맞춰 인위적으로 1초를 더하거나 빼는 조치를 취하게 됩니다. 따라서 이 글을 읽으실 때는 우리가 쓰는 시계의 시간은 자연의 섭리를 억지로 규격화한 인간의 발명품일 뿐이라는 과학적 배경을 머릿속에 그려보시면 글쓴이의 의도를 훨씬 쉽게 파악하실 수 있을 거예요.","ttsText":"우리가 매일 스마트폰으로 확인하는 시간은 1초의 오차도 없이 규칙적이지만, 실제 우주와 자연의 시간은 그렇지 않다는 사실을 아시나요? 이 지문을 깊이 이해하시려면 인위적인 시간과 자연의 시간 사이의 오차를 줄여주는 윤초(Leap second)라는 핵심 개념을 미리 알아두시면 좋습니다. 인간이 만든 시계가 한 치의 오차도 없는 정밀한 메트로놈이라면, 우주의 시간인 지구 자전(Earth's rotation)은 달의 중력이나 태평양의 기후 변화 현상인 엘니뇨 ":"wobble","meaning":"흔들리다"},{"word":"rotation","meaning":"자전, 회전"},{"word":"act as","meaning":"~의 역할을 하다"},{"word":"drag","meaning":"끌어당기는 힘, 저항"},{"word":"disturb","meaning":"어지럽히다, 방해하다"},{"word":"flexible","meaning":"유연한, 신축성 있는"},{"word":"based on","meaning":"~에 근거하여, ~에 바탕을 둔"},{"word":"without one's knowledge","meaning":"~도 모르게, ~가 모르는 사이에"},{"word":"force on","meaning":"~을 억지로 강요하다"},{"word":"yield","meaning":"굴복하다, 항복하다"}],"ttsText":"","__passage":"모의고사 / 고2 / 2025년 / 10월 / 40번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 40번","__script":"문장을 보기 전에, 이 지문의 핵심 단어들을 빠르게 짚고 갈게요. consistent, 일관된, 한결같은. cement, 굳건하게 하다, 결속시키다. artificial, 인위적인, 인공적인. psyche, 정신, 마음. every now and again, 가끔, 때때로. be forced to, 어쩔 수 없이 ~하다, 강요받다. acknowledge, 인정하다. adjust for, ~에 맞춰 조정하다, ~을 고려하여 조정하다. wobble, 흔들리다. rotation, 자전, 회전. act as, ~의 역할을 하다. drag, 끌어당기는 힘, 저항. disturb, 어지럽히다, 방해하다. flexible, 유연한, 신축성 있는. 이 단어들은 꼭 기억해 두세요."},{"kind":"sentence","idx":1,"total":8,"english":"Viewing time as a purchasable and consistent product cemented artificial views on time into our psyche, but every now and again we are forced to acknowledge this mistake.","korean":"시간을 구매 가능하고 불변하는 상품으로 보는 것은 시간에 대한 인위적인 관점을 우리의 정신 속에 굳혔지만, 때때로 우리는 이러한 실수를 인정하지 않을 수 없다.","chunks":[{"english":"Viewing time as a purchasable and consistent product","englishHtml":"<b><span class=\"grammar-hl\">Viewing<\/span> time as a purchasable and consistent product<\/b>","korean":"시간을 구매 가능하고 불변하는 상품으로 보는 것은"},{"english":"cemented artificial views on time","englishHtml":"<b>cemented artificial views on time<\/b>","korean":"시간에 대한 인위적인 관점을 굳혔다"},{"english":"into our psyche,","englishHtml":"<b>into our psyche,<\/b>","korean":"우리의 정신 속에,"},{"english":"but every now and again","englishHtml":"<b>but <span class=\"grammar-hl\">every now and again<\/span><\/b>","korean":"하지만 때때로"},{"english":"we are forced to acknowledge this mistake.","englishHtml":"<b>we <span class=\"grammar-hl\">are forced to acknowledge<\/span> this mis
