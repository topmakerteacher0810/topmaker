=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">의료 현장에서는 환자와 치료자 사이에 형성되는 전문적 관계(Professional relationship)가 성공적인 치료의 핵심적인 역할을 합니다. 이 글을 더 깊이 이해하기 위해서는 심리학 및 의료 윤리에서 매우 강조하는 자기 경계(Self-boundaries), 즉 전문적 경계(Professional boundaries)라는 개념을 미리 알아두시면 좋은데, 이는 마치 학교에서 선생님과 학생이 다정하게 지내면서도 결코 &#39;사적인 동네 친구&#39;가 될 수는 없는 것과 비슷한 이치입니다. 만약 의료진이 환자와 지나치게 가까운 사적 친구(Friend)가 되어버리면, 환자는 수치심 때문에 꼭 말해야 할 민감한 건강 문제를 숨기게 되는 역할 혼란(Role confusion) 현상이 발생할 수 있습니다. 따라서 이 지문은 단순한 대인관계 조언을 넘어서, 환자의 안전과 정확한 진단을 위해 의료진이 반드시 지켜야 할 치료적 경계선 유지라는 필수적인 직업윤리를 다루고 있다는 점을 염두에 두고 읽어보시기를 추천해 드립니다.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01도입 및 핵심 원칙<\/div><ul><li>의료 종사자는 환자와 탄탄한 전문적 관계를 맺고 자아 경계를 설정해야 한다.<\/li><li>의료(healthcare) 분야에서는 전문적 관계(professional relationship) 구축이 중요함<\/li><li>현실적인 자아 경계(self-boundaries)를 통해 이 관계를 보호할 수 있음<\/li><li>관계의 초점(focus)을 항상 환자에게 맞춰야 함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02발생 가능한 문제 상황<\/div><ul><li>자주 접하는 환자를 친구로 생각하게 되면 부적절한 상황이 발생할 수 있다.<\/li><li>자주 보는 환자를 친구(friends)로 여기기 쉬움<\/li><li>친구로 여기면 환자에게 부적절한(not appropriate) 개인 정보(personal information)를 공유할 위험이 있음<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03문제의 부정적 결과<\/div><ul><li>사적인 관계는 환자의 중요한 건강 정보 공유를 방해할 수 있다.<\/li><li>환자가 의료 종사자를 친구로 여기면 중요한 건강 관련 정보(health-related information)를 말하지 못할 수 있음<\/li><li>친구에게 그런 정보를 공유하는 것을 부끄러워함(embarrassing)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 실천 방안<\/div><ul><li>환자에게 친절하되 존중을 바탕으로 전문적인 경계를 유지해야 한다.<\/li><li>자아 경계는 곧 전문적 경계(professional boundaries)와 같음<\/li><li>환자를 존중(respect)하고 전문적인 관계를 유지해야 함<\/li><li>친절하게 대하되 항상 환자에게 초점(focus on the patient)을 유지할 것<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">healthcare<\/td><td class=\"m\">의료, 보건<\/td><\/tr><tr><td class=\"w\">solid<\/td><td class=\"m\">탄탄한, 확고한<\/td><\/tr><tr><td class=\"w\">professional<\/td><td class=\"m\">직업적인, 공적인<\/td><\/tr><tr><td class=\"w\">establish<\/td><td class=\"m\">설정하다, 확립하다<\/td><\/tr><tr><td class=\"w\">realistic<\/td><td class=\"m\">현실적인<\/td><\/tr><tr><td class=\"w\">boundary<\/td><td class=\"m\">경계, 경계선<\/td><\/tr><tr><td class=\"w\">frequently<\/td><td class=\"m\">자주, 빈번하게<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">think of A as B<\/td><td class=\"m\">A를 B로 생각하다, A를 B로 여기다<\/td><\/tr><tr><td class=\"w\">be likely to<\/td><td class=\"m\">~할 가능성이 있다, ~하기 쉽다<\/td><\/tr><tr><td class=\"w\">appropriate<\/td><td class=\"m\">적절한, 알맞은<\/td><\/tr><tr><td class=\"w\">embarrassing<\/td><td class=\"m\">난처한, 당혹스러운<\/td><\/tr><tr><td class=\"w\">treat<\/td><td class=\"m\">대하다, 취급하다<\/td><\/tr><tr><td class=\"w\">respect<\/td><td class=\"m\">존중, 존경<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When you <span class=\"grammar-hl\">are working<\/span><\/b><\/span><span class=\"ko\">여러분이 일할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in healthcare,<\/b><\/span><span class=\"ko\">의료 분야에서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">it is important<\/span><\/b><\/span><span class=\"ko\">중요합니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to develop<\/span> a solid professional relationship<\/b><\/span><span class=\"ko\">견고한 직업적인 관계를 발전시키는 것이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with your patients.<\/b><\/span><span class=\"ko\">여러분의 환자들과.<\/span><\/div><\/div><div class=\"lec-sent-ko\">여러분이 의료 분야에서 일할 때, 여러분의 환자들과 견고한 직업적인 관계를 발전시키는 것이 중요하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로서 주제를 제시합니다. 의료 종사자로서 환자를 대할 때 사적인 감정이 얽히지 않은 공적인 태도로 임해야 함을 강조합니다. develop a solid professional relationship은 단순히 친해지는 것을 넘어, 의료진과 환자라는 각자의 역할에 충실한 신뢰 관계를 쌓는다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are working (현재진행): be동사(are) + -ing(working) 형태로 현재 진행 중인 동작을 나타낸다.<\/div><div class=\"lec-gr-item\">it is important to develop (가주어): 진주어: it이 가주어, to develop 이하가 진주어 역할을 한다.<\/div><div class=\"lec-gr-item\">to develop (to부정사(명사적)): 주어 자리에 쓰인 It is ~ to V 구문의 진주어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">healthcare<\/td><td class=\"m\">의료, 보건<\/td><\/tr><tr><td class=\"w\">solid<\/td><td class=\"m\">탄탄한, 확고한<\/td><\/tr><tr><td class=\"w\">professional<\/td><td class=\"m\">직업적인, 공적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>By <span class=\"grammar-hl\">establishing<\/span> realistic self-boundaries,<\/b><\/span><span class=\"ko\">현실적인 자기 경계를 설정함으로써,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you can protect that relationship.<\/b><\/span><span class=\"ko\">여러분은 그 관계를 보호할 수 있습니다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">현실적인 자기 경계를 설정함으로써, 여러분은 그 관계를 보호할 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 직업적 관계를 건강하게 유지하는 구체적인 방법을 제시합니다. establishing realistic self-boundaries는 환자에게 지나치게 감정적으로 몰입하거나 자신의 사생활을 털어놓지 않도록 의료진 스스로 지켜야 할 선을 긋는 것을 뜻합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">establishing (동명사): 전치사 By의 목적어 역할을 하는 명사적 기능을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">establish<\/td><td class=\"m\">설정하다, 확립하다<\/td><\/tr><tr><td class=\"w\">realistic<\/td><td class=\"m\">현실적인<\/td><\/tr><tr><td class=\"w\">boundary<\/td><td class=\"m\">경계, 경계선<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">It is important<\/span><\/b><\/span><span class=\"ko\">중요합니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to keep<\/span> the focus<\/b><\/span><span class=\"ko\">초점을 두는 것이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on the patient.<\/b><\/span><span class=\"ko\">환자에게.<\/span><\/div><\/div><div class=\"lec-sent-ko\">초점을 환자에게 두는 것이 중요하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 자기 경계 설정의 가장 핵심적인 원칙을 설명합니다. 진료 상황에서 대화나 관심의 중심이 항상 의료진 자신이 아닌 환자의 상태와 치료 자체에 머물러 있어야 한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It is important to keep (가주어): 진주어: it이 가주어, to keep 이하가 진주어 역할을 한다.<\/div><div class=\"lec-gr-item\">to keep (to부정사(명사적)): 주어 자리에 쓰인 It is ~ to V 구문의 진주어 역할을 한다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 4 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">When working<\/span><\/b><\/span><span class=\"ko\">일할 때<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with patients<\/b><\/span><span class=\"ko\">환자들을 상대로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who<\/span> <span class=\"grammar-hl\">are seen<\/span> frequently,<\/b><\/span><span class=\"ko\">자주 보게 되는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">it is easy<\/span><\/b><\/span><span class=\"ko\">쉽습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to start<\/span> <span class=\"grammar-hl\">to think of<\/span> them<\/b><\/span><span class=\"ko\">그들을 생각하기 시작하는 것이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as friends.<\/b><\/span><span class=\"ko\">친구로서.<\/span><\/div><\/div><div class=\"lec-sent-ko\">자주 보게 되는 환자들을 상대로 일할 때는, 그들을 친구처럼 여기기 시작하기 쉽다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞의 원칙을 지키기 어려운 구체적인 상황, 즉 만성질환 등으로 꾸준히 내원하는 환자와 흔히 겪게 되는 함정을 짚어줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">When working (분사구문): 접속사(When)를 명시한 부사적 기능의 분사구문이다. 원래 절인 when + you + are working ... 에서 주어(you)가 같아 생략되고 동사가 분사로 바뀐 구조이다.<\/div><div class=\"lec-gr-item\">who (관계대명사): 선행사 patients를 수식하는 주격 관계대명사이다. 뒤에 주어가 빠진 구조의 절이 이어진다.<\/div><div class=\"lec-gr-item\">are seen (수동태): be동사(are) + p.p.(seen) 구조. see는 타동사인데 뒤에 목적어가 없어서 수동구조 are seen 형태로 쓴다. (기본구조: see + O)<\/div><div class=\"lec-gr-item\">it is easy to start (가주어): 진주어: it이 가주어, to start 이하가 진주어 역할을 한다.<\/div><div class=\"lec-gr-item\">to start (to부정사(명사적)): 주어 자리에 쓰인 It is ~ to V 구문의 진주어 역할을 한다.<\/div><div class=\"lec-gr-item\">to think of (to부정사(명사적)): 동사 start의 목적어 자리에 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">frequently<\/td><td class=\"m\">자주, 빈번하게<\/td><\/tr><tr><td class=\"w\">think of A as B<\/td><td class=\"m\">A를 B로 생각하다, A를 B로 여기다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>With a friend,<\/b><\/span><span class=\"ko\">친구와는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you are likely <span class=\"grammar-hl\">to share<\/span><\/b><\/span><span class=\"ko\">여러분은 공유할 가능성이 있습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>personal information<\/b><\/span><span class=\"ko\">개인 정보를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> is not appropriate<\/b><\/span><span class=\"ko\">적절하지 않은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with a patient.<\/b><\/span><span class=\"ko\">환자와는.<\/span><\/div><\/div><div class=\"lec-sent-ko\">여러분은 환자와는 공유하기 적절하지 않은 개인 정보를 친구와 공유할 가능성이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 환자를 친구로 착각할 때 발생하는 구체적인 부작용을 설명합니다. 의료진이 자신의 개인적인 이야기를 자꾸 꺼내게 되면 진료라는 본래의 공적인 목적이 흐려질 수 있음을 경고합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to share (to부정사(부사적): 형용사 수식): to V 바로 앞의 형용사 likely를 수식한다.<\/div><div class=\"lec-gr-item\">that (관계대명사): 선행사 personal information을 수식하는 주격 관계대명사이다. 뒤에 주어가 빠진 구조의 절이 이어진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be likely to<\/td><td class=\"m\">~할 가능성이 있다, ~하기 쉽다<\/td><\/tr><tr><td class=\"w\">appropriate<\/td><td class=\"m\">적절한, 알맞은<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Patients may feel<\/b><\/span><span class=\"ko\">환자들은 느낄 수도 있습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> they cannot share important health-related information<\/b><\/span><span class=\"ko\">그들이 중요한 건강 관련 정보를 공유할 수 없다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>because you are their friend,<\/b><\/span><span class=\"ko\">여러분이 자신들의 친구이기 때문에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">it would be embarrassing<\/span><\/b><\/span><span class=\"ko\">그리고 난처할 수 있습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to share<\/span> <span class=\"grammar-hl\">that<\/span> information.<\/b><\/span><span class=\"ko\">그 정보를 공유하는 것은.<\/span><\/div><\/div><div class=\"lec-sent-ko\">환자들은 여러분이 자신들의 친구이기 때문에 중요한 건강 관련 정보를 자신들이 공유할 수 없다고 느낄 수도 있고, 그 정보를 공유하는 것이 난처할 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 사적인 관계가 형성될 경우 정작 환자의 치료에 치명적인 악영향을 줄 수 있음을 다룹니다. it would be embarrassing to share that information — 환자가 의료진을 허물없는 사람으로 여기게 되면, 오히려 남에게 말하기 부끄러운 신체적 증상이나 생활 습관을 솔직하게 말하지 못해 정확한 진단을 방해할 수 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that 접속사: 동사 feel의 목적어 역할을 하는 명사절을 이끄는 접속사이다.<\/div><div class=\"lec-gr-item\">it would be embarrassing to share (가주어): 진주어: it이 가주어, to share 이하가 진주어 역할을 한다.<\/div><div class=\"lec-gr-item\">embarrassing (현재분사(형용사)): 주격보어로 쓰여 감정을 유발하는 원인(진주어 to share...)의 상태를 설명한다.<\/div><div class=\"lec-gr-item\">to share (to부정사(명사적)): 주어 자리에 쓰인 It is ~ to V 구문의 진주어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">embarrassing<\/td><td class=\"m\">난처한, 당혹스러운<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Self-boundaries<\/b><\/span><span class=\"ko\">자기 경계는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can also <span class=\"grammar-hl\">be thought of<\/span><\/b><\/span><span class=\"ko\">또한 여겨질 수 있습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as<\/span> professional boundaries.<\/b><\/span><span class=\"ko\">직업적인 경계로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">자기 경계는 직업적인 경계로 여겨질 수도 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 문제점들을 해결하기 위해 다시 두 번째 문장의 핵심 개념으로 돌아와 내용을 정리합니다. professional boundaries는 개인적인 선을 긋는 일이 결국 의료진으로서의 공적인 책임을 다하기 위한 필수적인 장치임을 짚어줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">be thought of as (수동태): be동사(be) + p.p.(thought) 구조. think of는 타동사구인데 뒤에 목적어가 없어서 수동구조 be thought of 형태로 쓴다. (기본구조: think of A as B - A를 B로 여기다)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">professional<\/td><td class=\"m\">직업적인, 공적인<\/td><\/tr><tr><td class=\"w\">boundary<\/td><td class=\"m\">경계, 경계선<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>You need <span class=\"grammar-hl\">to treat<\/span> patients<\/b><\/span><span class=\"ko\">여러분은 환자들을 대할 필요가 있습니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with respect<\/b><\/span><span class=\"ko\">존중으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">keep the relationship<\/span><\/b><\/span><span class=\"ko\">그리고 그 관계를 유지할 (필요가 있습니다)<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">professional<\/span>.<\/b><\/span><span class=\"ko\">직업적으로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">여러분은 환자들을 존중으로 대하고 그 관계를 직업적으로 유지할 필요가 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 결론부에 해당하며, 환자를 대하는 올바른 태도를 다시 한번 당부합니다. treat patients with respect는 환자를 사적인 친구처럼 편하게 대하는 것을 넘어, 도움을 받으러 온 존중받아야 할 대상으로 대우한다는 뜻입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to treat (to부정사(명사적)): 동사 need의 목적어 자리에 쓰였다.<\/div><div class=\"lec-gr-item\">keep the relationship professional 5형식(SVOC) 구조: 동사(keep) + 목적어(the relationship) + 목적격보어(professional) 형태이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">professional<\/td><td class=\"m\">직업적인, 공적인<\/td><\/tr><tr><td class=\"w\">treat<\/td><td class=\"m\">대하다, 취급하다<\/td><\/tr><tr><td class=\"w\">respect<\/td><td class=\"m\">존중, 존경<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 9<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Be friendly<\/b><\/span><span class=\"ko\">친절하게 대하십시오<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to patients<\/b><\/span><span class=\"ko\">환자들에게<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and always <span class=\"grammar-hl\">keep<\/span> the focus<\/b><\/span><span class=\"ko\">그리고 항상 초점을 두어라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on the patient.<\/b><\/span><span class=\"ko\">환자에게.<\/span><\/div><\/div><div class=\"lec-sent-ko\">환자들에게 친절하고 항상 환자에게 초점을 두어라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 마지막으로 핵심 메시지를 요약하며 글을 맺습니다. Be friendly to patients — 글쓴이는 여기서 힘주어 말합니다. 환자를 대하는 태도 자체는 다정하고 친절해야 하지만, 관계의 본질은 철저히 공적이어야 하며 모든 과정의 중심은 환자의 건강이어야 한다는 점을 분명히 합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">keep (병렬구조): 등위접속사 and에 의해 앞의 동사원형 Be와 병렬구조를 이루어 명령문 형태를 띤다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>의료계에서 일할 때는 환자와 공고한 직업적 관계를 맺는 것이 중요하다.<\/li><li>자주 보는 환자와 사적으로 친해질 경우, 의료진은 부적절한 사생활을 나누게 되고 환자는 민망함에 중요 건강 정보를 숨기게 되어 치료에 방해가 될 수 있다.<\/li><li>이를 방지하기 위해 의료진은 현실적인 자기 경계를 세워 사적인 친분과 직업적 역할을 분리해야 한다.<\/li><li>따라서 환자에게 친절하게 대하되 관계는 공적으로 유지하고, 항상 환자 중심의 태도를 지켜야 한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">By establishing professional boundaries, healthcare workers can maintain the proper focus on patients and encourage them to share crucial health information.<\/div>\n              <div class=\"lec-final-sum-ko\">전문적인 경계를 설정함으로써, 의료 종사자는 환자에게 적절한 집중을 유지하고 그들이 중요한 건강 정보를 공유하도록 장려할 수 있다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./20_audio/1.mp3","hl":null}],[{"audio":"./20_audio/2.mp3","hl":null}],[{"audio":"./20_audio/3.mp3","hl":null},{"audio":"./20_audio/4.mp3","hl":"stage-0"},{"audio":"./20_audio/5.mp3","hl":"stage-1"},{"audio":"./20_audio/6.mp3","hl":"stage-2"},{"audio":"./20_audio/7.mp3","hl":"stage-3"}],[{"audio":"./20_audio/8.mp3","hl":null}],[{"audio":"./20_audio/9.mp3","hl":"main"},{"audio":"./20_audio/10.mp3","hl":"meaning"},{"audio":"./20_audio/11.mp3","hl":"grammar"}],[{"audio":"./20_audio/12.mp3","hl":"main"},{"audio":"./20_audio/13.mp3","hl":"meaning"},{"audio":"./20_audio/14.mp3","hl":"grammar"}],[{"audio":"./20_audio/15.mp3","hl":"main"},{"audio":"./20_audio/16.mp3","hl":"meaning"},{"audio":"./20_audio/17.mp3","hl":"grammar"}],[{"audio":"./20_audio/18.mp3","hl":"main"},{"audio":"./20_audio/19.mp3","hl":"meaning"},{"audio":"./20_audio/20.mp3","hl":"grammar"}],[{"audio":"./20_audio/21.mp3","hl":"main"},{"audio":"./20_audio/22.mp3","hl":"meaning"},{"audio":"./20_audio/23.mp3","hl":"grammar"}],[{"audio":"./20_audio/24.mp3","hl":"main"},{"audio":"./20_audio/25.mp3","hl":"meaning"},{"audio":"./20_audio/26.mp3","hl":"grammar"}],[{"audio":"./20_audio/27.mp3","hl":"main"},{"audio":"./20_audio/28.mp3","hl":"meaning"},{"audio":"./20_audio/29.mp3","hl":"grammar"}],[{"audio":"./20_audio/30.mp3","hl":"main"},{"audio":"./20_audio/31.mp3","hl":"meaning"},{"audio":"./20_audio/32.mp3","hl":"grammar"}],[{"audio":"./20_audio/33.mp3","hl":"main"},{"audio":"./20_audio/34.mp3","hl":"meaning"},{"audio":"./20_audio/35.mp3","hl":"grammar"}],[{"audio":"./20_audio/36.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_20번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 20번","titleEn":"Professional Boundaries: Keeping Patient Relationships Focused and Effective","titleKo":"전문적 경계: 환자와의 관계를 집중적이고 효과적으로 유지하기","imageUrl":"__enpImg__","stages":[{"label":"01도입 및 핵심 원칙","items":["의료 종사자는 환자와 탄탄한 전문적 관계를 맺고 자아 경계를 설정해야 한다.","의료(healthcare) 분야에서는 전문적 관계(professional relationship) 구축이 중요함","현실적인 자아 경계(self-boundaries)를 통해 이 관계를 보호할 수 있음","관계의 초점(focus)을 항상 환자에게 맞춰야 함"]},{"label":"02발생 가능한 문제 상황","items":["자주 접하는 환자를 친구로 생각하게 되면 부적절한 상황이 발생할 수 있다.","자주 보는 환자를 친구(friends)로 여기기 쉬움","친구로 여기면 환자에게 부적절한(not appropriate) 개인 정보(personal information)를 공유할 위험이 있음"]},{"label":"03문제의 부정적 결과","items":["사적인 관계는 환자의 중요한 건강 정보 공유를 방해할 수 있다.","환자가 의료 종사자를 친구로 여기면 중요한 건강 관련 정보(health-related information)를 말하지 못할 수 있음","친구에게 그런 정보를 공유하는 것을 부끄러워함(embarrassing)"]},{"label":"04결론 및 실천 방안","items":["환자에게 친절하되 존중을 바탕으로 전문적인 경계를 유지해야 한다.","자아 경계는 곧 전문적 경계(professional boundaries)와 같음","환자를 존중(respect)하고 전문적인 관계를 유지해야 함","친절하게 대하되 항상 환자에게 초점(focus on the patient)을 유지할 것"]}],"bkg":"의료 현장에서는 환자와 치료자 사이에 형성되는 전문적 관계(Professional relationship)가 성공적인 치료의 핵심적인 역할을 합니다. 이 글을 더 깊이 이해하기 위해서는 심리학 및 의료 윤리에서 매우 강조하는 자기 경계(Self-boundaries), 즉 전문적 경계(Professional boundaries)라는 개념을 미리 알아두시면 좋은데, 이는 마치 학교에서 선생님과 학생이 다정하게 지내면서도 결코 '사적인 동네 친구'가 될 수는 없는 것과 비슷한 이치입니다. 만약 의료진이 환자와 지나치게 가까운 사적 친구(Friend)가 되어버리면, 환자는 수치심 때문에 꼭 말해야 할 민감한 건강 문제를 숨기게 되는 역할 혼란(Role confusion) 현상이 발생할 수 있습니다. 따라서 이 지문은 단순한 대인관계 조언을 넘어서, 환자의 안전과 정확한 진단을 위해 의료진이 반드시 지켜야 할 치료적 경계선 유지라는 필수적인 직업윤리를 다루고 있다는 점을 염두에 두고 읽어보시기를 추천해 드립니다.","ttsText":"의료 현장에서는 환자와 치료자 사이에 형성되
