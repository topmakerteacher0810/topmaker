europlasticity) 이론에 바탕을 두고 있으며, 마치 우거진 숲속에서 평소 다니지 않던 낯선 길을 걸으며 새로운 오솔길을 개척하는 과정과 비슷해요. 예를 들어, 실생활에서 평소 사용하지 않는 비우세 손(Nondominant hand)으로 양치질을 하거나 밥을 먹는 사소한 행동만으로도 평소 쓰지 않던 뇌 신경망이 자극을 받아 활성화됩니다. 이러한 뇌과학적 원리를 염두에 두고 지문을 읽어보시면, 왜 바쁜 일상 속에서 색다른 자극을 주는 짧은 휴식이 우리의 인지 피로(Cognitive tiredness)를 날려버리고 뇌를 활기차게 리셋해 주는지 훨씬 재미있고 쉽게 이해하실 수 있을 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01낮 휴식의 중요성<\/div><ul><li>바쁜 하루 중 잠시 휴식을 취하는 것은 뇌의 활력을 되찾고 생산성을 높이는 데 필수적이다.<\/li><li>일상에서 벗어나 인지적 피로(cognitive tiredness) 예방<\/li><li>남은 하루 동안의 일상 및 업무 생산성(productivity) 향상<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02뉴로빅 운동의 도입<\/div><ul><li>휴식 시간에 뇌를 자극하기 위해 단순하지만 효과적인 뇌 운동법을 활용할 수 있다.<\/li><li>핵심 개념: 뉴로빅 운동(neurobic exercises)<\/li><li>뇌의 다양한 영역을 자극하여 기민함(agile)과 각성 상태(alert) 유지<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03전략적 휴식의 효과<\/div><ul><li>뉴로빅 운동을 곁들인 전략적인 휴식은 단순한 쉼을 넘어 뇌 기능을 끌어올린다.<\/li><li>오후의 도전에 대비하는 정신적 오아시스(mental oasis) 창출<\/li><li>인지 능력(cognitive capabilities)을 높여 날카롭고 집중된 상태 유지<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04실생활 적용과 원리<\/div><ul><li>식사나 글쓰기 등 일상적인 작업에 잘 쓰지 않는 손을 사용하는 것만으로도 뇌를 단련할 수 있다.<\/li><li>비우세 손(nondominant hand)을 사용하는 간단한 변화 시도<\/li><li>평소 쓰지 않는 신경 경로(pathways) 활성화<\/li><li>사고의 유연성(flexibility) 촉진<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">refresh<\/td><td class=\"m\">생기를 되찾게 하다, 상쾌하게 하다<\/td><\/tr><tr><td class=\"w\">recharge<\/td><td class=\"m\">재충전하다<\/td><\/tr><tr><td class=\"w\">underestimate<\/td><td class=\"m\">과소평가하다<\/td><\/tr><tr><td class=\"w\">break away from<\/td><td class=\"m\">~에서 벗어나다, ~에서 탈피하다<\/td><\/tr><tr><td class=\"w\">stimulate<\/td><td class=\"m\">자극하다, 활성화하다<\/td><\/tr><tr><td class=\"w\">cognitive<\/td><td class=\"m\">인지의, 인지적인<\/td><\/tr><tr><td class=\"w\">enhance<\/td><td class=\"m\">향상시키다, 높이다<\/td><\/tr><tr><td class=\"w\">productivity<\/td><td class=\"m\">생산성<\/td><\/tr><tr><td class=\"w\">target<\/td><td class=\"m\">목표로 삼다, 겨냥하다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">agile<\/td><td class=\"m\">민첩한, 명민한<\/td><\/tr><tr><td class=\"w\">alert<\/td><td class=\"m\">기민한, 주의 깊은<\/td><\/tr><tr><td class=\"w\">strategic<\/td><td class=\"m\">전략적인<\/td><\/tr><tr><td class=\"w\">boost<\/td><td class=\"m\">증대시키다, 끌어올리다<\/td><\/tr><tr><td class=\"w\">experiment with<\/td><td class=\"m\">~을 실험해 보다, ~을 시도하다<\/td><\/tr><tr><td class=\"w\">work wonders<\/td><td class=\"m\">기적을 낳다, 놀라운 효과를 내다<\/td><\/tr><tr><td class=\"w\">nondominant<\/td><td class=\"m\">우세하지 않은, 주로 쓰지 않는<\/td><\/tr><tr><td class=\"w\">activate<\/td><td class=\"m\">활성화하다, 작동시키다<\/td><\/tr><tr><td class=\"w\">engage<\/td><td class=\"m\">작동시키다, 사용하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Imagine <span class=\"grammar-hl\">pausing<\/span><\/b><\/span><span class=\"ko\">상상해 보라 멈추는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the middle of a busy day,<\/b><\/span><span class=\"ko\">바쁜 하루의 중간에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">taking a moment<\/span><\/b><\/span><span class=\"ko\">잠시 시간을 가지는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to refresh your mind and recharge your energy<\/span>.<\/b><\/span><span class=\"ko\">정신을 새롭게 하고 에너지를 재충전하기 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">바쁜 하루의 중간에 잠시 멈춰서, 정신을 새롭게 하고 에너지를 재충전하는 순간을 가지는 것을 상상해 보라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글을 시작하며 독자의 상황을 가정해 주의를 환기합니다. 바쁘게 일하는 와중에 잠시 쉬면서 기력을 회복하는 휴식 시간을 머릿속에 그려보게 유도합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">pausing (동명사): imagine은 동명사를 목적어로 취하는 동사로, -ing가 목적어 자리에 쓰여 명사 역할을 한다.<\/div><div class=\"lec-gr-item\">taking a moment (분사구문): taking이 부사적 기능으로 쓰인 분사구문. 원래 절 변환: and you take a moment...<\/div><div class=\"lec-gr-item\">to refresh your mind and recharge your energy (to부정사(형용사적)): to refresh와 (to) recharge가 병렬로 연결되어 앞 명사(a moment)를 수식하는 형용사적 용법이다. moment(시간) + to V 구조로 명사의 내용을 한정한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">refresh<\/td><td class=\"m\">생기를 되찾게 하다, 상쾌하게 하다<\/td><\/tr><tr><td class=\"w\">recharge<\/td><td class=\"m\">재충전하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This power of a midday break<\/b><\/span><span class=\"ko\">이러한 한낮의 휴식의 힘은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">is often underestimated<\/span>.<\/b><\/span><span class=\"ko\">종종 과소평가된다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이러한 한낮의 휴식의 힘은 종종 과소평가된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 낮 시간의 휴식을 사람들이 별로 중요하게 생각하지 않는다는 점을 지적하며, 실제로는 꽤 중요한 의미가 있음을 암시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is often underestimated (수동태): be동사(is) + p.p.(underestimated) 구조. underestimate는 타동사인데, 뒤에 목적어가 없어서 수동구조 is underestimated 형태로 쓴다. 기본구조: underestimate + O(목적어)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">underestimate<\/td><td class=\"m\">과소평가하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>When you break away from routine,<\/b><\/span><span class=\"ko\">여러분이 일상에서 벗어날 때,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>especially with activities<\/b><\/span><span class=\"ko\">특히 활동들을 가지고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">designed<\/span> <span class=\"grammar-hl\">to stimulate<\/span> your brain,<\/b><\/span><span class=\"ko\">두뇌를 자극하도록 설계된,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you prevent cognitive tiredness<\/b><\/span><span class=\"ko\">여러분은 인지적 피로를 예방하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and enhance productivity<\/b><\/span><span class=\"ko\">생산성을 높인다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for the rest of the day.<\/b><\/span><span class=\"ko\">남은 하루 동안.<\/span><\/div><\/div><div class=\"lec-sent-ko\">여러분이 특히 여러분의 두뇌를 자극하도록 설계된 활동들을 가지고 일상에서 벗어날 때 여러분은 인지적 피로를 예방하고 남은 하루 동안의 생산성을 높인다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 말한 낮 휴식의 구체적인 효과를 설명합니다. break away from routine은 늘 하던 뻔한 일에서 잠시 떨어져 나와 뇌에 자극을 주면, 머리가 지치는 것을 막고 오후 업무 효율을 높여 준다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">designed (과거분사(형용사)): designed가 앞의 명사(activities)를 수식(= &#39;설계된 활동&#39;). N + p.p. 형태의 축약 관계절(activities that are designed)의 의미를 나타내며 수동태로 설명하지 않는다.<\/div><div class=\"lec-gr-item\">to stimulate (to부정사(부사적): 목적): in order to stimulate로 바꿔도 뜻이 같으므로 부사적(목적) 용법으로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">break away from<\/td><td class=\"m\">~에서 벗어나다, ~에서 탈피하다<\/td><\/tr><tr><td class=\"w\">stimulate<\/td><td class=\"m\">자극하다, 활성화하다<\/td><\/tr><tr><td class=\"w\">cognitive<\/td><td class=\"m\">인지의, 인지적인<\/td><\/tr><tr><td class=\"w\">enhance<\/td><td class=\"m\">향상시키다, 높이다<\/td><\/tr><tr><td class=\"w\">productivity<\/td><td class=\"m\">생산성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Neurobic exercises<\/b><\/span><span class=\"ko\">뉴로빅 운동이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>― <span class=\"grammar-hl\">simple yet effective<\/span> ―<\/b><\/span><span class=\"ko\">― 간단하지만 효과적인 ―<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are perfect<\/b><\/span><span class=\"ko\">꼭 알맞다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for such breaks.<\/b><\/span><span class=\"ko\">그러한 휴식 시간에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">간단하지만 효과적인 뉴로빅 운동이 그러한 휴식 시간에 꼭 알맞다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 뇌를 자극하는 활동의 구체적인 예시로 &#39;뉴로빅 운동&#39;이라는 개념을 처음 제시합니다. 이 운동이 앞서 말한 생산성을 높이는 휴식 방법에 아주 알맞다고 연결합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">simple yet effective (형용사구): 삽입되어 앞의 명사(Neurobic exercises)를 부연 설명하고 상태를 나타내는 형용사구이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 5 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>They target different areas of your brain,<\/b><\/span><span class=\"ko\">그것들은 여러분의 뇌의 다른 영역들을 겨냥하여,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">keeping it agile and alert<\/span>.<\/b><\/span><span class=\"ko\">그것을 기민하고 민첩하게 유지한다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것들은 여러분의 뇌의 다른 영역들을 겨냥하여, 그것을 기민하고 민첩하게 유지한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 뉴로빅 운동이 왜 효과적인지 그 원리를 밝힙니다. 뇌의 여러 부분을 자극해서 머리가 빠릿빠릿하게 잘 돌아가도록 만들어 준다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">keeping (분사구문): keeping이 부사적 기능으로 쓰인 분사구문. 원래 절 변환: and they keep...<\/div><div class=\"lec-gr-item\">keeping it agile and alert 5형식(SVOC) 구조: keep(동사) + it(목적어) + agile and alert(목적격보어, 형용사) 구조로, 목적어를 보어 상태로 유지하게 한다는 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">target<\/td><td class=\"m\">목표로 삼다, 겨냥하다<\/td><\/tr><tr><td class=\"w\">agile<\/td><td class=\"m\">민첩한, 명민한<\/td><\/tr><tr><td class=\"w\">alert<\/td><td class=\"m\">기민한, 주의 깊은<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>These exercises create a mental oasis<\/b><\/span><span class=\"ko\">이러한 운동들은 정신적 오아시스를 만들어 준다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that refreshes and prepares<\/span> you<\/b><\/span><span class=\"ko\">여러분을 기운 나게 하고 준비시켜 주는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for the afternoon’s challenges.<\/b><\/span><span class=\"ko\">오후의 힘든 일들을 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이러한 운동들은 오후의 힘든 일들을 위해 여러분을 기운 나게 하고 준비시켜 주는 정신적 오아시스를 만들어 준다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 뉴로빅 운동이 주는 이점을 비유적으로 표현합니다. a mental oasis는 삭막하고 지친 일과 속에서 정신적으로 숨을 돌리고 새 힘을 얻을 수 있는 쾌적한 피난처 역할을 한다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that refreshes and prepares (관계대명사): that절이 앞 명사(a mental oasis)를 수식하고, 절 내부에서 that이 주어 역할을 함(= 빠진 자리 존재).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">refresh<\/td><td class=\"m\">생기를 되찾게 하다, 상쾌하게 하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This strategic pause<\/b><\/span><span class=\"ko\">이 전략적인 멈춤은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is not just a break;<\/b><\/span><span class=\"ko\">단순한 휴식이 아니며;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>it boosts your cognitive capabilities,<\/b><\/span><span class=\"ko\">그것은 여러분의 인지 능력을 증대시키고,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">ensuring<\/span> your mind remains sharp and <span class=\"grammar-hl\">focused<\/span>.<\/b><\/span><span class=\"ko\">여러분의 정신이 또렷하고 집중된 상태가 유지되도록 보장해 준다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이 전략적인 멈춤은 단순한 휴식이 아니며, 그것은 여러분의 인지 능력을 증대시키고 여러분의 정신이 또렷하고 집중된 상태가 유지되도록 보장해 준다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 지금까지의 내용을 종합하며 한낮의 휴식이 가진 가치를 다시 한번 강조합니다. This strategic pause는 뇌를 쉬게 하면서도 활성화하려는 뚜렷한 목적을 가지고 의도적으로 취하는 휴식을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">ensuring (분사구문): ensuring이 부사적 기능으로 쓰인 분사구문. 원래 절 변환: and it ensures...<\/div><div class=\"lec-gr-item\">focused (과거분사(형용사)): remain의 보어로 쓰여 주어(your mind)가 집중된 상태를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cognitive<\/td><td class=\"m\">인지의, 인지적인<\/td><\/tr><tr><td class=\"w\">strategic<\/td><td class=\"m\">전략적인<\/td><\/tr><tr><td class=\"w\">boost<\/td><td class=\"m\">증대시키다, 끌어올리다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Even briefly <span class=\"grammar-hl\">experimenting<\/span> with neurobic exercises<\/b><\/span><span class=\"ko\">짧게 뉴로빅 운동들을 시도하는 것만으로도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can <span class=\"grammar-hl\">work wonders<\/span><\/b><\/span><span class=\"ko\">기적 같은 효과를 낳을 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for your cognitive state<\/b><\/span><span class=\"ko\">여러분의 인지 상태에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>during lunch.<\/b><\/span><span class=\"ko\">점심시간 동안.<\/span><\/div><\/div><div class=\"lec-sent-ko\">짧게 뉴로빅 운동들을 시도하는 것만으로도 점심시간 동안 여러분의 인지 상태에 기적 같은 효과를 낳을 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이제 독자가 일상에서 바로 적용할 수 있도록 점심시간이라는 구체적인 상황을 제시합니다. 잠깐의 시도만으로도 머리가 맑아지는 큰 효과를 볼 수 있다고 권유합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">experimenting (동명사): -ing가 문장의 주어 자리에 쓰여 명사 역할을 한다.<\/div><div class=\"lec-gr-item\">work wonders (관용표현): &#39;기적을 낳다, 큰 효과를 내다&#39;라는 의미의 굳어진 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">cognitive<\/td><td class=\"m\">인지의, 인지적인<\/td><\/tr><tr><td class=\"w\">experiment with<\/td><td class=\"m\">~을 실험해 보다, ~을 시도하다<\/td><\/tr><tr><td class=\"w\">work wonders<\/td><td class=\"m\">기적을 낳다, 놀라운 효과를 내다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 9 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Start<\/b><\/span><span class=\"ko\">시작하라<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with <span class=\"grammar-hl\">using<\/span> your nondominant hand<\/b><\/span><span class=\"ko\">여러분의 주되지 않은 손을 사용하는 것으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for routine tasks like <span class=\"grammar-hl\">writing or eating<\/span>.<\/b><\/span><span class=\"ko\">글쓰기 또는 식사와 같은 일상적인 과업들을 위해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">글쓰기 또는 식사와 같은 일상적인 과업들을 위해 여러분의 주되지 않은 손을 사용하는 것으로 시작하라.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에 이어 뉴로빅 운동의 아주 구체적인 실천 방법을 제안합니다. 오른손잡이가 밥을 먹을 때 왼손을 써보는 식으로, 늘 하던 뻔한 동작을 조금 바꿔보라는 행동 지침입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">using (동명사): 전치사 with의 목적어 자리에 쓰여 명사 역할을 한다.<\/div><div class=\"lec-gr-item\">writing or eating (동명사): 전치사 like의 목적어 자리에 쓰여 명사 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nondominant<\/td><td class=\"m\">우세하지 않은, 주로 쓰지 않는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 10<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This simple switch challenges your brain,<\/b><\/span><span class=\"ko\">이 간단한 전환이 여러분의 뇌를 자극하여,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">activating pathways<\/span><\/b><\/span><span class=\"ko\">경로들을 활성화시키고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that aren’t typically engaged<\/span><\/b><\/span><span class=\"ko\">전형적으로 사용되지 않는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">promoting<\/span> greater flexibility<\/b><\/span><span class=\"ko\">더 큰 유연성을 촉진시킨다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in <span class=\"grammar-hl\">thinking<\/span>.<\/b><\/span><span class=\"ko\">사고에서의.<\/span><\/div><\/div><div class=\"lec-sent-ko\">이 간단한 전환이 여러분의 뇌를 자극하여, 전형적으로 사용되지 않는 경로들을 활성화시키고 사고에서의 더 큰 유연성을 촉진시킨다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글을 마무리하며 앞서 제안한 작은 행동의 결과를 설명합니다. This simple switch는 평소 쓰지 않는 손을 사용하는 등의 작은 변화를 가리키며, 이를 통해 뇌가 새로운 방식으로 작동하고 생각의 틀이 말랑말랑해진다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">activating pathways (분사구문): activating이 부사적 기능으로 쓰인 분사구문. 원래 절 변환: and it activates pathways...<\/div><div class=\"lec-gr-item\">that aren’t typically engaged (관계대명사): that절이 앞 명사(pathways)를 수식하고, 절 내부에서 that이 주어 역할을 함(= 빠진 자리 존재).<\/div><div class=\"lec-gr-item\">aren’t typically engaged (수동태): be동사(are) + p.p.(engaged) 구조. engage는 타동사인데, 뒤에 목적어가 없어서 수동구조 aren&#39;t engaged 형태로 쓴다. 기본구조: engage + O(목적어)<\/div><div class=\"lec-gr-item\">promoting (분사구문): promoting이 activating과 병렬로 연결되어 부사적 기능으로 쓰인 분사구문. 원래 절 변환: and it promotes...<\/div><div class=\"lec-gr-item\">thinking (동명사): 전치사 in의 목적어 자리에 쓰여 명사 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">activate<\/td><td class=\"m\">활성화하다, 작동시키다<\/td><\/tr><tr><td class=\"w\">engage<\/td><td class=\"m\">작동시키다, 사용하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>바쁜 하루 중 한낮의 휴식은 인지적 피로를 막고 오후의 생산성을 높이는 데 무척 중요하다.<\/li><li>특히 두뇌를 자극하는 단순하고 효과적인 &#39;뉴로빅 운동&#39;을 휴식 시간에 접목하면 좋다.<\/li><li>이런 의도적인 휴식은 뇌의 여러 영역을 깨워 정신을 맑게 하고 집중력을 끌어올린다.<\/li><li>점심시간에 평소 안 쓰던 손으로 밥을 먹는 등 아주 간단한 시도만으로도 평소 안 쓰던 뇌 신경을 자극해 사고의 유연성을 기를 수 있다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">People can prevent cognitive tiredness and enhance afternoon productivity by engaging in brain-stimulating exercises during a midday break.<\/div>\n              <div class=\"lec-final-sum-ko\">사람들은 한낮의 휴식 시간에 두뇌를 자극하는 운동을 함으로써 인지적 피로를 예방하고 오후의 생산성을 향상시킬 수 있다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./24_audio/1.mp3","hl":null}],[{"audio":"./24_audio/2.mp3","hl":null}],[{"audio":"./24_audio/3.mp3","hl":null},{"audio":"./24_audio/4.mp3","hl":"stage-0"},{"audio":"./24_audio/5.mp3","hl":"stage-1"},{"audio":"./24_audio/6.mp3","hl":"stage-2"},{"audio":"./24_audio/7.mp3","hl":"stage-3"}],[{"audio":"./24_audio/8.mp3","hl":null}],[{"audio":"./24_audio/9.mp3","hl":"main"},{"audio":"./24_audio/10.mp3","hl":"meaning"},{"audio":"./24_audio/11.mp3","hl":"grammar"}],[{"audio":"./24_audio/12.mp3","hl":"main"},{"audio":"./24_audio/13.mp3","hl":"meaning"},{"audio":"./24_audio/14.mp3","hl":"grammar"}],[{"audio":"./24_audio/15.mp3","hl":"main"},{"audio":"./24_audio/16.mp3","hl":"meaning"},{"audio":"./24_audio/17.mp3","hl":"grammar"}],[{"audio":"./24_audio/18.mp3","hl":"main"},{"audio":"./24_audio/19.mp3","hl":"meaning"},{"audio":"./24_audio/20.mp3","hl":"grammar"}],[{"audio":"./24_audio/21.mp3","hl":"main"},{"audio":"./24_audio/22.mp3","hl":"meaning"},{"audio":"./24_audio/23.mp3","hl":"grammar"}],[{"audio":"./24_audio/24.mp3","hl":"main"},{"audio":"./24_audio/25.mp3","hl":"meaning"},{"audio":"./24_audio/26.mp3","hl":"grammar"}],[{"audio":"./24_audio/27.mp3","hl":"main"},{"audio":"./24_audio/28.mp3","hl":"meaning"},{"audio":"./24_audio/29.mp3","hl":"grammar"}],[{"audio":"./24_audio/30.mp3","hl":"main"},{"audio":"./24_audio/31.mp3","hl":"meaning"},{"audio":"./24_audio/32.mp3","hl":"grammar"}],[{"audio":"./24_audio/33.mp3","hl":"main"},{"audio":"./24_audio/34.mp3","hl":"meaning"},{"audio":"./24_audio/35.mp3","hl":"grammar"}],[{"audio":"./24_audio/36.mp3","hl":"main"},{"audio":"./24_audio/37.mp3","hl":"meaning"},{"audio":"./24_audio/38.mp3","hl":"grammar"}],[{"audio":"./24_audio/39.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_24번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 24번","titleEn":"Boo
