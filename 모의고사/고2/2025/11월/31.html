chnology for State Authority<small>공식 통계: 국가 권력을 위한 사회적 기술<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">이 지문을 더 깊이 이해하시려면 숫자가 사회에 미치는 영향을 탐구하는 통계사회학(Sociology of statistics)이라는 흥미로운 학문적 배경을 알아두시면 좋습니다. 학자인 시어도어 포터(Theodore Porter)는 정량화(Quantification)를 단순한 숫자 세기가 아니라, 마치 우리가 마트에서 &#39;판매량 1위&#39; 딱지가 붙은 상품을 무의식적으로 믿고 구매하듯 국가가 대중의 신뢰를 얻기 위해 사용하는 사회적 기술(Social technology)이라고 보았어요. 또한 알랭 데스로지에(Alain Desrosières)의 연구에 따르면, 우리가 매일 뉴스로 접하는 물가나 실업률 같은 통계(Statistics)는 자연적으로 존재하는 절대적 진리가 아니라 국가의 목적에 맞춰 인위적으로 만들어진 분류 기준(Convention)에 불과합니다. 즉, 20세기의 현대 국가들이 복잡한 사회를 통제하고 정책을 펼치기 위해 숫자라는 객관적인 가면을 통해 어떻게 국가 권위(State authority)를 구축했는지 그 숨겨진 의도를 떠올리며 글을 읽어보시면 내용이 훨씬 쉽고 재미있게 다가올 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01근대 국가와 통계의 등장<\/div><ul><li>20세기에 통계학은 근대 국가로 발전하기 위해 필수적인 양적 정보의 체계적 수집 수단이 되었다.<\/li><li>국가가 필요로 하는 양적 정보(quantitative information)의 체계적 수집<\/li><li>모든 산업화된 국가가 근대 국가(modern states)가 되는 핵심 과정<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02통계적 측정의 역설적 본질<\/div><ul><li>통계로 측정되는 대상은 현실에 실재하는 동시에 인위적으로 만들어진 관습이라는 이중적 성격을 지닌다.<\/li><li>측정되는 대상이 실제로 존재함(really do exist)<\/li><li>동시에 통계적 측정은 단지 관습(convention)일 뿐이라는 사실<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03국가 목적을 위한 분류 체계<\/div><ul><li>가격이나 상품 같은 실제 현상을 수집하고 조직하는 통계적 틀은 결국 국가의 정책적 필요에 의해 만들어진 것이다.<\/li><li>공식 통계의 범주와 분류 틀(classification frameworks)은 인위적으로 고안됨(devised)<\/li><li>거시경제(macroeconomic) 또는 사회 정책(social policies) 등 국가 목적에 복무<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04권위 창출을 위한 사회적 기술<\/div><ul><li>통계를 통한 수량화는 주관적 결정을 객관적인 것처럼 포장하여 국가 권위에 대한 신뢰를 만들어낸다.<\/li><li>수량화(quantification)는 결정하는 것처럼 보이지 않으면서 결정을 내리는 방법<\/li><li>국가 권위(state authority)에 대한 신뢰를 구축하려는 의도를 가진 사회적 기술(social technology)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">systematic<\/td><td class=\"m\">체계적인<\/td><\/tr><tr><td class=\"w\">quantitative<\/td><td class=\"m\">양적인, 정량적인<\/td><\/tr><tr><td class=\"w\">state<\/td><td class=\"m\">국가, 정부<\/td><\/tr><tr><td class=\"w\">industrialised<\/td><td class=\"m\">산업화된<\/td><\/tr><tr><td class=\"w\">simultaneously<\/td><td class=\"m\">동시에<\/td><\/tr><tr><td class=\"w\">convention<\/td><td class=\"m\">관례, 사회적 약속<\/td><\/tr><tr><td class=\"w\">be the case<\/td><td class=\"m\">사실이 그러하다, 사실이다<\/td><\/tr><tr><td class=\"w\">phenomenon<\/td><td class=\"m\">현상<\/td><\/tr><tr><td class=\"w\">classification<\/td><td class=\"m\">분류<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">framework<\/td><td class=\"m\">뼈대, 체제, 틀<\/td><\/tr><tr><td class=\"w\">aggregation<\/td><td class=\"m\">집계, 취합<\/td><\/tr><tr><td class=\"w\">devise<\/td><td class=\"m\">고안하다, 창안하다<\/td><\/tr><tr><td class=\"w\">serve the purpose of<\/td><td class=\"m\">~의 목적에 부합하다, ~의 목적을 달성하다<\/td><\/tr><tr><td class=\"w\">macroeconomic<\/td><td class=\"m\">거시 경제의<\/td><\/tr><tr><td class=\"w\">authority<\/td><td class=\"m\">권위, 권력<\/td><\/tr><tr><td class=\"w\">quantification<\/td><td class=\"m\">정량화, 수량화<\/td><\/tr><tr><td class=\"w\">characterise<\/td><td class=\"m\">특징짓다, 규정하다<\/td><\/tr><tr><td class=\"w\">intend to<\/td><td class=\"m\">~할 의도이다, ~하려고 의도하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Statistics in the twentieth century<\/b><\/span><span class=\"ko\">20세기의 통계 자료는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>became the systematic collection of quantitative information<\/b><\/span><span class=\"ko\">정량적인 정보의 체계적인 모음집이 되었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">needed<\/span> by the state.<\/b><\/span><span class=\"ko\">국가에 의해서 요구되는<\/span><\/div><\/div><div class=\"lec-sent-ko\">20세기의 통계 자료는 국가에 의해서 요구되는 정량적인 정보의 체계적인 모음집이 되었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 글의 도입부로, 20세기에 들어서 통계가 단순한 숫자 모음에서 국가 운영을 위한 필수적인 도구로 자리 잡았음을 밝힙니다. the systematic collection of quantitative information needed by the state는 국가가 정책을 세우고 통치하기 위해 인구, 경제 등의 데이터를 의도적이고 체계적으로 모으기 시작했다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">needed (과거분사(형용사)): needed가 information을 수식(= 국가에 의해 필요해진/필요한 정보)한다. N + p.p. ≈ &#39;N that is/was p.p.&#39;(축약 관계절) 구조로 명사를 수식한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">systematic<\/td><td class=\"m\">체계적인<\/td><\/tr><tr><td class=\"w\">quantitative<\/td><td class=\"m\">양적인, 정량적인<\/td><\/tr><tr><td class=\"w\">state<\/td><td class=\"m\">국가, 정부<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>This process occurred<\/b><\/span><span class=\"ko\">이러한 과정은 생겨났다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in all the <span class=\"grammar-hl\">industrialised<\/span> countries<\/b><\/span><span class=\"ko\">모든 산업 국가에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as a key part of their <span class=\"grammar-hl\">becoming<\/span> modern states.<\/b><\/span><span class=\"ko\">그것들이 근대 국가가 되는 것의 핵심적인 요소로<\/span><\/div><\/div><div class=\"lec-sent-ko\">이러한 과정은 모든 산업 국가에서 그것들이 근대 국가가 되는 것의 핵심적인 요소로 생겨났다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급된 국가의 통계 수집이 전 세계적인 흐름이었음을 설명합니다. as a key part of their becoming modern states는 산업화된 나라들이 효율적인 통치 체제를 갖춘 현대적 국가로 발전하기 위해 체계적인 통계 시스템 구축을 필수적인 과정으로 거쳤다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">industrialised (과거분사(형용사)): industrialised가 뒤의 명사 countries를 수식(= 산업화된 국가)한다. p.p. + N ≈ &#39;p.p.된 N&#39; 구조로 수식한다.<\/div><div class=\"lec-gr-item\">becoming (동명사(명사적)): 전치사 of의 목적어 역할을 하는 동명사이며, 바로 앞의 their는 이 동명사의 의미상 주어이다. becoming은 명사적 개념을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">state<\/td><td class=\"m\">국가, 정부<\/td><\/tr><tr><td class=\"w\">industrialised<\/td><td class=\"m\">산업화된<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Desrosières writes:<\/b><\/span><span class=\"ko\">Desrosières는 쓴다:<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“<span class=\"grammar-hl\">It is difficult<\/span><\/b><\/span><span class=\"ko\">“어렵다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to think<\/span> simultaneously<\/b><\/span><span class=\"ko\">동시에 생각하기는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that the objects being measured<\/span><\/b><\/span><span class=\"ko\">측정되는 대상들이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">really do exist<\/span><\/b><\/span><span class=\"ko\">실제로 확실히 존재한다는 것과<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and that this is only a convention<\/span>”.<\/b><\/span><span class=\"ko\">이것이 단지 하나의 관행이라는 것을”.<\/span><\/div><\/div><div class=\"lec-sent-ko\">Desrosieres는 ‘측정되는 대상들이 실제로 확실히 존재한다는 것과 이것이 단지 하나의 관행이라는 것을 동시에 생각하기는 어렵다’라고 쓴다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 학자의 말을 인용하여 통계를 바라보는 사람들의 모순적인 인식을 꼬집습니다. the objects being measured really do exist는 통계 수치가 현실의 실제 대상을 있는 그대로 반영한다고 믿는 것을 뜻하고, this is only a convention은 통계를 내는 기준이 사람들이 편의상 만들어 낸 인위적인 약속에 불과하다는 사실을 가리킵니다. 사람들은 이 두 가지 사실을 머릿속에서 동시에 받아들이기 힘들어합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It is difficult to think (가주어): 진주어: It은 문장의 형식적인 가주어 역할을 하며, 뒤의 to think 이하가 문장의 진짜 주어인 진주어이다.<\/div><div class=\"lec-gr-item\">to think (to부정사(명사적)): It is ... to V 구조에서 진주어(주어) 자리에 쓰였으므로 명사적 용법이다.<\/div><div class=\"lec-gr-item\">that the objects being measured really do exist and that this is only a convention 명사절 접속사 that 병렬: think의 목적어 역할을 하는 두 개의 that절이 접속사 and를 통해 병렬 구조로 연결되어 있다.<\/div><div class=\"lec-gr-item\">being measured (현재분사(형용사)): being measured가 앞의 명사 objects를 수식(= 측정되는 중인 대상)한다. 수동과 진행의 의미가 결합되어 있으며, N + -ing ≈ &#39;...하는 중인 N&#39; 구조이다.<\/div><div class=\"lec-gr-item\">do exist 강조의 do: 일반동사 exist 앞에 조동사 do를 두어 &#39;정말로 존재한다&#39;라는 동사의 의미를 구조적으로 강조한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">simultaneously<\/td><td class=\"m\">동시에<\/td><\/tr><tr><td class=\"w\">convention<\/td><td class=\"m\">관례, 사회적 약속<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Yet this <span class=\"grammar-hl\">is the case<\/span>.<\/b><\/span><span class=\"ko\">그러나 이는 사실이다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">그러나 이는 사실이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 제기한 모순적인 상황이 사실은 통계의 진짜 본질임을 짚어주며 글의 방향을 전환합니다. this is the case는 우리가 측정 대상이 실재한다고 믿으면서도 동시에 그 측정 방식은 인위적인 약속에 불과하다는 그 어려운 양립이 현실의 통계에서 그대로 일어나고 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is the case (관용표현): &#39;사실이다, 실정이다&#39;라는 의미를 나타내는 굳어진 표현이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be the case<\/td><td class=\"m\">사실이 그러하다, 사실이다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Phenomena<\/b><\/span><span class=\"ko\">현상들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>such as prices <span class=\"grammar-hl\">being charged<\/span> and products <span class=\"grammar-hl\">being sold<\/span><\/b><\/span><span class=\"ko\">가격이 부과되는 것이나 제품이 판매되는 것과 같은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>exist,<\/b><\/span><span class=\"ko\">존재하지만,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but the categories and classification frameworks<\/b><\/span><span class=\"ko\">범주들과 분류 체계들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">supporting<\/span> the collection, aggregation, and organisation of official statistics<\/b><\/span><span class=\"ko\">공식 통계 자료의 수집, 집계, 그리고 조직화를 뒷받침하는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">are devised<\/span><\/b><\/span><span class=\"ko\">고안된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to serve<\/span> the purposes of the state,<\/b><\/span><span class=\"ko\">국가의 목적들에 기여하도록,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>for macroeconomic or for social policies.<\/b><\/span><span class=\"ko\">거시 경제 또는 사회 정책들을 위한<\/span><\/div><\/div><div class=\"lec-sent-ko\">가격이 부과되는 것이나 제품이 판매되는 것과 같은 현상들은 존재하지만, 공식 통계 자료의 수집, 집계, 그리고 조직화를 뒷받침하는 범주들과 분류 체계들은 거시 경제 또는 사회 정책들을 위한 국가의 목적들에 기여하도록 고안된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 &#39;실재함&#39;과 &#39;인위적 관습&#39;이 어떻게 공존하는지 구체적으로 풀어냅니다. 물건을 사고파는 현상 자체는 분명히 현실에 존재하지만, devised to serve the purposes of the state에서 알 수 있듯이 이 현상들을 묶고 나누어 통계로 만드는 기준은 국가가 정책을 펴기 좋게 입맛대로 만들어 낸 인위적인 틀이라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">being charged (현재분사(형용사)): being charged가 prices를 수식(= 청구되는 가격)한다. 수동의 의미를 지니며, N + -ing ≈ &#39;...되는 중인/되는 N&#39; 구조이다.<\/div><div class=\"lec-gr-item\">being sold (현재분사(형용사)): being sold가 products를 수식(= 판매되는 제품)한다. N + -ing ≈ &#39;...되는 중인/되는 N&#39; 구조이다.<\/div><div class=\"lec-gr-item\">supporting (현재분사(형용사)): supporting이 앞의 명사 frameworks를 수식(= 체계를 지원하는 분류 틀)한다. N + -ing ≈ &#39;...을 하는 N&#39; 구조이다.<\/div><div class=\"lec-gr-item\">are devised to serve 수동태 및 to부정사(목적격보어): be동사(are) + p.p.(devised) 구조. devise는 타동사로 기본구조가 devise + O + to V(5형식)인데, 목적어가 주어로 올라가 수동구조 are devised가 되고 뒤의 보어인 toV(to serve)는 구조가 그대로 남는다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">state<\/td><td class=\"m\">국가, 정부<\/td><\/tr><tr><td class=\"w\">classification<\/td><td class=\"m\">분류<\/td><\/tr><tr><td class=\"w\">framework<\/td><td class=\"m\">뼈대, 체제, 틀<\/td><\/tr><tr><td class=\"w\">aggregation<\/td><td class=\"m\">집계, 취합<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">devise<\/td><td class=\"m\">고안하다, 창안하다<\/td><\/tr><tr><td class=\"w\">serve the purpose of<\/td><td class=\"m\">~의 목적에 부합하다, ~의 목적을 달성하다<\/td><\/tr><tr><td class=\"w\">macroeconomic<\/td><td class=\"m\">거시 경제의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Theodore Porter described the use of statistics<\/b><\/span><span class=\"ko\">Theodore Porter는 통계 자료의 사용을 묘사했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to create<\/span> state authority:<\/b><\/span><span class=\"ko\">국가의 권위를 만들기 위한:<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“Quantification is a way <span class=\"grammar-hl\">of making<\/span> decisions<\/b><\/span><span class=\"ko\">“정량화는 결정을 내리는 방법이라고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>without <span class=\"grammar-hl\">seeming to decide<\/span>”,<\/b><\/span><span class=\"ko\">결정하는 것처럼 보이지 않으면서”,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">characterising<\/span> it as a “social technology”<\/b><\/span><span class=\"ko\">그것을 “사회적 기술”로 특징지었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">intended to build<\/span> trust in authority.<\/b><\/span><span class=\"ko\">권위에 대한 신뢰를 구축하기 위해 의도된<\/span><\/div><\/div><div class=\"lec-sent-ko\">Theodore Porter는 국가의 권위를 만들기 위한 통계 자료의 사용을, ‘정량화는 결정하는 것처럼 보이지 않으면서 결정을 내리는 방법’이라고 묘사했고, 그것을 권위에 대한 신뢰를 구축하기 위해 의도된 ‘사회적 기술’로 특징지었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 통계가 국가의 권위를 어떻게 세우는지 최종적으로 결론을 내립니다. making decisions without seeming to decide는 국가가 통계라는 객관적인 숫자를 내세움으로써, 자신들의 자의적인 정치적 결정을 마치 과학적이고 중립적인 결과인 것처럼 포장하여 대중의 반발을 피하고 통치에 대한 신뢰를 얻어 낸다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to create (to부정사(부사적): 목적): in order to create로 바꿔도 뜻이 같으므로 부사적 용법(목적)이다.<\/div><div class=\"lec-gr-item\">of making (동명사(명사적)): 전치사 of의 목적어 자리에서 명사 역할을 하는 동명사이다.<\/div><div class=\"lec-gr-item\">seeming to decide seem to V 구문: 동명사 seeming 뒤에 to decide가 결합되어 &#39;~처럼 보이다&#39;의 의미를 이루며, to부정사 용법 이름을 별도로 붙이지 않는 seem to V 구문이다.<\/div><div class=\"lec-gr-item\">characterising (분사구문): 부사적 기능으로 쓰인 현재분사구문이다. 원래 절로의 변환(= while + he + characterised ... 또는 and + he + characterised ...) 구조로 설명할 수 있다.<\/div><div class=\"lec-gr-item\">intended to build 과거분사(형용사) 및 to부정사(목적격보어): intended가 a social technology를 수식(= 신뢰를 구축하도록 의도된 사회 기술)하며, N + p.p. ≈ &#39;N that is/was p.p.&#39; 구조이다. intend는 기본구조가 intend + O + to V(5형식)인데, 수동 의미의 과거분사 intended로 축약되면서 목적어는 생략되고 목적격보어인 to build가 그대로 뒤에 남은 구조이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">state<\/td><td class=\"m\">국가, 정부<\/td><\/tr><tr><td class=\"w\">authority<\/td><td class=\"m\">권위, 권력<\/td><\/tr><tr><td class=\"w\">quantification<\/td><td class=\"m\">정량화, 수량화<\/td><\/tr><tr><td class=\"w\">characterise<\/td><td class=\"m\">특징짓다, 규정하다<\/td><\/tr><tr><td class=\"w\">intend to<\/td><td class=\"m\">~할 의도이다, ~하려고 의도하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>20세기에 산업화된 국가들은 현대 국가로 발전하면서 정책에 필요한 정보를 얻기 위해 통계를 적극적으로 수집하기 시작했다.<\/li><li>사람들은 통계가 현실에 실재하는 대상을 측정한다고 믿는 동시에 그것이 인위적인 틀이라는 사실을 함께 떠올리기 어려워하지만, 실제 통계의 본질은 이 두 가지를 모두 포함한다.<\/li><li>시장에서 일어나는 현상 자체는 실재하지만, 그것을 모아 공식 통계로 만드는 분류 기준은 국가의 정책 목적을 위해 의도적으로 만들어진 것이다.<\/li><li>국가는 이러한 통계적 수치화를 통해 자신들의 결정을 객관적인 것처럼 포장하여 권위에 대한 대중의 신뢰를 확보한다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Although official statistics appear to be objective measurements of reality, they are actually constructed conventions used by modern states to establish authority.<\/div>\n              <div class=\"lec-final-sum-ko\">공식 통계는 현실에 대한 객관적인 측정처럼 보이지만, 실제로는 현대 국가들이 권력을 확립하기 위해 사용하는 인위적인 관습이다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./31_audio/1.mp3","hl":null}],[{"audio":"./31_audio/2.mp3","hl":null}],[{"audio":"./31_audio/3.mp3","hl":null},{"audio":"./31_audio/4.mp3","hl":"stage-0"},{"audio":"./31_audio/5.mp3","hl":"stage-1"},{"audio":"./31_audio/6.mp3","hl":"stage-2"},{"audio":"./31_audio/7.mp3","hl":"stage-3"}],[{"audio":"./31_audio/8.mp3","hl":null}],[{"audio":"./31_audio/9.mp3","hl":"main"},{"audio":"./31_audio/10.mp3","hl":"meaning"},{"audio":"./31_audio/11.mp3","hl":"grammar"}],[{"audio":"./31_audio/12.mp3","hl":"main"},{"audio":"./31_audio/13.mp3","hl":"meaning"},{"audio":"./31_audio/14.mp3","hl":"grammar"}],[{"audio":"./31_audio/15.mp3","hl":"main"},{"audio":"./31_audio/16.mp3","hl":"meaning"},{"audio":"./31_audio/17.mp3","hl":"grammar"}],[{"audio":"./31_audio/18.mp3","hl":"main"},{"audio":"./31_audio/19.mp3","hl":"meaning"},{"audio":"./31_audio/20.mp3","hl":"grammar"}],[{"audio":"./31_audio/21.mp3","hl":"main"},{"audio":"./31_audio/22.mp3","hl":"meaning"},{"audio":"./31_audio/23.mp3","hl":"grammar"}],[{"audio":"./31_audio/24.mp3","hl":"main"},{"audio":"./31_audio/25.mp3","hl":"meaning"},{"audio":"./31_audio/26.mp3","hl":"grammar"}],[{"audio":"./31_audio/27.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_31번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 31번","titleEn":"Official Statistics: A Social Technology for State Authority","titleKo":"공식 통계: 국가 권력을 위한 사회적 기술","imageUrl":"__enpImg__","stages":[{"label":"01근대 국가와 통계의 등장","items":["20세기에 통계학은 근대 국가로 발전하기 위해 필수적인 양적 정보의 체계적 수집 수단이 되었다.","국가가 필요로 하는 양적 정보(quantitative information)의 체계적 수집","모든 산업화된 국가가 근대 국가(modern states)가 되는 핵심 과정"]},{"label":"02통계적 측정의 역설적 본질","items":["통계로 측정되는 대상은 현실에 실재하는 동시에 인위적으로 만들어진 관습이라는 이중적 성격을 지닌다.","측정되는 대상이 실제로 존재함(really do exist)","동시에 통계적 측정은 단지 관습(convention)일 뿐이라는 사실"]},{"label":"03국가 목적을 위한 분류 체계","items":["가격이나 상품 같은 실제 현상을 수집하고 조직하는 통계적 틀은 결국 국가의 정책적 필요에 의해 만들어진 것이다.","공식 통계의 범주와 분류 틀(classification frameworks)은 인위적으로 고안됨(devised)","거시경제(macroeconomic) 또는 사회 정책(social policies) 등 국가 목적에 복무"]},{"label":"04권위 창출을 위한 사회적 기술","items":["통계를 통한 수량화는 주관적 결정을 객관적인 것처럼 포장하여 국가 권위에 대한 신뢰를 만들어낸다.","수량화(quantifi chnology”","englishHtml":"<b><span class=\"grammar-hl\">characterising<\/span> it as a “social technology”<\/b>","korean":"그것을 “사회적 기술”로 특징지었다"},{"english":"intended to build trust in authority.","englishHtml":"<b><span class=\"grammar-hl\">intended to build<\/span> trust in authority.<\/b>","korean":"권위에 대한 신뢰를 구축하기 위해 의도된"}],"meaning":"통계가 국가의 권위를 어떻게 세우는지 최종적으로 결론을 내립니다. making decisions without seeming to decide는 국가가 통계라는 객관적인 숫자를 내세움으로써, 자신들의 자의적인 정치적 결정을 마치 과학적이고 중립적인 결과인 것처럼 포장하여 대중의 반발을 피하고 통치에 대한 신뢰를 얻어 낸다는 의미입니다.","grammar":"to create (to부정사(부사적): 목적): in order to create로 바꿔도 뜻이 같으므로 부사적 용법(목적)이다. of making (동명사(명사적)): 전치사 of의 목적어 자리에서 명사 역할을 하는 동명사이다. seeming to decide seem to V 구문: 동명사 seeming 뒤에 to decide가 결합되어 '~처럼 보이다'의 의미를 이루며, to부정사 용법 이름을 별도로 붙이지 않는 seem to V 구문이다. characterising (분사구문): 부사적 기능으로 쓰인 현재분사구문이다. 원래 절로의 변환(= while + he + characterised ... 또는 and + he + characterised ...) 구조로 설명할 수 있다. intended to build 과거분사(형용사) 및 to부정사(목적격보어): intended가 a social technology를 수식(= 신뢰를 구축하도록 의도된 사회 기술)하며, N + p.p. ≈ 'N that is/was p.p.' 구조이다. intend는 기본구조가 intend + O + to V(5형식)인데, 수동 의미의 과거분사 intended로 축약되면서 목적어는 생략되고 목적격보어인 to build가 그대로 뒤에 남은 구조이다.","grammarItems":["to create (to부정사(부사적): 목적): in order to create로 바꿔도 뜻이 같으므로 부사적 용법(목적)이다.","of making (동명사(명사적)): 전치사 of의 목적어 자리에서 명사 역할을 하는 동명사이다.","seeming to decide seem to V 구문: 동명사 seeming 뒤에 to decide가 결합되어 '~처럼 보이다'의 의미를 이루며, to부정사 용법 이름을 별도로 붙이지 않는 seem to V 구문이다.","characterising (분사구문): 부사적 기능으로 쓰인 현재분사구문이다. 원래 절로의 변환(= while + he + characterised ... 또는 and + he + characterised ...) 구조로 설명할 수 있다.","intended to build 과거분사(형용사) 및 to부정사(목적격보어): intended가 a social technology를 수식(= 신뢰를 구축하도록 의도된 사회 기술)하며, N + p.p. ≈ 'N that is/was p.p.' 구조이다. intend는 기본구조가 intend + O + to V(5형식)인데, 수동 의미의 과거분사 intended로 축약되면서 목적어는 생략되고 목적격보어인 to build가 그대로 뒤에 남은 구조이다."],"vocab":[{"word":"state","meaning":"국가, 정부"},{"word":"authority","meaning":"권위, 권력"},{"word":"quantification","meaning":"정량화, 수량화"},{"word":"characte ["구체적 사례","가격 청구, 제품 판매 현상","데이터를 수집, 집계, 조직화하는 범주"],["목적","객관적 사실처럼 보이는 역할","국가의 거시 경제 및 사회 정책 목적에 복무"]]},"ttsText":"20세기에 산업화된 국가들은 현대 국가로 발전하면서 정책에 필요한 정보를 얻기 위해 통계를 적극적으로 수집하기 시작했다. 사람들은 통계가 현실에 실재하는 대상을 측정한다고 믿는 동시에 그것이 인위적인 틀이라는 사실을 함께 떠올리기 어려워하지만, 실제 통계의 본질은 이 두 가지를 모두 포함한다. 시장에서 일어나는 현상 자체는 실재하지만, 그것을 모아 공식 통계로 만드는 분류 기준은 국가의 정책 목적을 위해 의도적으로 만들어진 것이다. 국가는 이러한 통계적 수치화를 통해 자신들의 결정을 객관적인 것처럼 포장하여 권위에 대한 대중의 신뢰를 확보한다.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 31번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 31번","__script":"자, 오늘 배운 내용을 마지막으로 정리해 볼게요. 20세기에 산업화된 국가들은 현대 국가로 발전하면서 정책에 필요한 정보를 얻기 위해 통계를 적극적으로 수집하기 시작했습니다. 사람들은 통계가 현실에 실재하는 대상을 측정한다고 믿는 동시에 그것이 인위적인 틀이라는 사실을 함께 떠올리기 어려워하지만, 실제 통계의 본질은 이 두 가지를 모두 포함합니다. 시장에서 일어나는 현상 자체는 실재하지만, 그것을 모아 공식 통계로 만드는 분류 기준은 국가의 정책 목적을 위해 의도적으로 만들어진 것입니다. 국가는 이러한 통계적 수치화를 통해 자신들의 결정을 객관적인 것처럼 포장하여 권위에 대한 대중의 신뢰를 확보합니다. 마지막으로 이 글을 한 문장으로 요약하면 이렇습니다. 공식 통계는 현실에 대한 객관적인 측정처럼 보이지만, 실제로는 현대 국가들이 권력을 확립하기 위해 사용하는 인위적인 관습입니다. 오늘도 정말 수고 많았습니다!"}]}</script><script>var D=JSON.parse(document.getElementById("enpLecData").textContent);var i=0,j=0,playing=false,rate=1,tmr=null;var a=new Audio();var s=document.getElementById("s"),c=document.getElementById("c"),pp=document.getElementById("pp"),fill=document.getElementById("fill"),tl=document.getElementById("tl");function segsOf(k){return (D.segs&&D.segs[k])||[];}function clearHl(){var e=s.querySelectorAll(".lec-hl");for(var k=0;k<e.length;k++)e[k].classList.remove("lec-hl");}function scrollerOf(el){var p=el.parentNode;while(p&&p.nodeType===1){if(p.scrollHeight-p.clientHeight>4){var ov=getComputedStyle(p).overflowY;if(ov==="auto"||ov==="scroll")return p;}if(p===s)break;p=p.parentNode;}return s;}function scrollHl(el){try{var c=scrollerOf(el);var max=c.scrollHeight-c.clientHeight;var to=Math.max(0,Math.min(max,el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-12));var fr=c.scrollTop;if(Math.abs(to-fr)<2)return;if(document.hidden||typeof requestAnimationFrame!=="function )();var ED=false,EDIRTY=false;var pn=document.querySelector(".top .pname");function edcommit(){if(!ED)return;var k=s.cloneNode(true);var h=k.querySelectorAll(".lec-hl");for(var q=0;q<h.length;q++)h[q].classList.remove("lec-hl");D.slides[i]=k.innerHTML;}function edsync(){var te=document.getElementById("tge"),ts=document.getElementById("tgs");s.contentEditable=ED?"true":"false";if(pn)pn.contentEditable=ED?"true":"false";if(te)te.classList.toggle("off",!ED);if(ts)ts.hidden=!(ED||EDIRTY);}function edserial(){edcommit();if(window.__lectureAuthoring&&window.__lectureAuthoring.serialize)return window.__lectureAuthoring.serialize();var k=document.documentElement.cloneNode(true);var v=k.querySelector("#s");if(v){v.innerHTML="";v.removeAttribute("contenteditable");}var p2=k.querySelector(".top .pname");if(p2)p2.removeAttribute("contenteditable");var dt=k.querySelector("#enpLecData");if(dt)dt.textContent=JSON.stringify(D).replace(/</g,"\\u003c");return "<!DOCTYPE html>\n"+k.outerHTML;};(function(){var te=document.getElementById("tge"),ts=document.getElementById("tgs");var mark=function(){if(!ED)return;EDIRTY=true;edcommit();edsync();};if(te)te.onclick=function(){if(!ED&&playing){toggle();}ED=!ED;if(!ED)edcommit();edsync();};if(ts)ts.onclick=function(){var html=edserial();var b=new Blob([html],{type:"text/html;charset=utf-8"});var u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download=D.fileName||((document.title||"\uac15\uc758").replace(/[\\/:*?"<>|]/g," ")+".html");document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u);},30000);EDIRTY=false;edsync();};s.addEventListener("input",mark);if(pn)pn.addEventListener("input",mark);window.addEventListener("beforeunload",function(e){if(EDIRTY){e.preventDefault();e.returnValue="";}});})();function show(){s.innerHTML=D.slides[i]||"";s.scrollTop=0;c.textContent=(i+1)+" / "+D.slides.length;j=0;kosync();setSeg();}a.ontimeupdate=function(){fill.style.width=(a.duration?(a.currentTime/a.duration*100):0)+"%";};function go(d){var n=Math.max(0,Math.min(D.slides.length-1,i+d));if(n===i)return;a.pause();edcommit();i=n;show();}function toggle(){playing=!playing;pp.textContent=playing?"\u23f8 \uc77c\uc2dc\uc815\uc9c0":"\u25b6 \uc7ac\uc0dd";if(playing){if(!a.src){setSeg();}else{a.play().catch(function(){});}}else{clrTmr();a.pause();}}tl.onclick=function(e){if(!a.duration)return;var r=tl.getBoundingClientRect();a.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*a.duration;};a.onended=segEnd;(function lecBindSwipeNavigation(root, go, pageIndex) {
    let gesture = null;
    const zoomed = () => window.visualViewport && window.visualViewport.scale > 1.01;

    const interactive = el => el && el.closest('a,button,input,textarea,select,video,audio,canvas,[contenteditable="true"],[role="slider"]');
    const scrollsHorizontally = target => {
      for (let el = target; el && root.contains(el); el = el.parentElement) {
        if (el.scrollWidth > el.clientWidth + 2 && /^(auto|scroll)$/.test(getComputedStyle(el).overflowX)) return true;
        if (el === root) break;
      }

    };
    root.addEventListener('touchstart', e => {
      gesture = null;
      if (e.touches.length !== 1 || zoomed() || selected() || interactive(e.target) || scrollsHorizontally(e.target)) return;
      const t = e.touches[0];
      // 화면 가장자리는 휴대폰 브라우저의 뒤로/앞으로 제스처에 맡긴다.
      if (t.clientX < 24 || t.clientX > window.innerWidth - 24) return;
      gesture = { id: t.identifier, x: t.clientX, y: t.clientY, time: Date.now(), page: pageIndex(), horizontal: false };
    }, { passive: true });
    root.addEventListener('touchmove', e => {

      if (e.touches.length !== 1 || zoomed() || selected()) { gesture = null; return; }
      const t = e.touches[0];
