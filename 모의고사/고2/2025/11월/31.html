<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 31번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 31번","audioDir":"31_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">31번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>Statistics as a Social Technology for State Governance\u003c/h1>\u003ch2>국가 통치를 위한 사회적 기술로서의 통계\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>20세기의 통계는 단순히 객관적 사실을 측정하는 것을 넘어, \u003cb class=\"key\">국가의 \u003c/b>\u003cb class=\"key\">목적\u003c/b>과 권위를 확립하기 위해 정량화라는 틀로 고안된 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">기술\u003c/b>이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Statistics in the twentieth century served as a systematic tool and social technology to establish state authority and achieve policy goals.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 이십세기 통계학이 단순히 숫자를 세는 것을 넘어 어떻게 국가의 힘이 되었는지를 다룬 지문을 함께 공부할 거예요. 통계가 객관적인 사실처럼 보이지만, 그 이면에는 국가의 통치 목적이 숨어 있다는 요지를 잘 파악해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">근대 국가가 형성되면서 통계학(Statistics)이라는 용어 자체가 '국가(State)'에서 유래했습니다. 통계는 세금을 징수하고 군대를 모집하는 등 국가의 \u003cb class=\"key\">행정적 \u003c/b>\u003cb class=\"key\">통치\u003c/b>를 위해 정량적 정보를 수집하는 도구로 발전했습니다. 이를 \u003cb class=\"key\">통치성\u003c/b>(Governmentality)이라는 개념으로 설명하기도 하는데, 수치는 객관적으로 보이지만 사실은 국가가 정한 \u003cb class=\"key\">분류 \u003c/b>\u003cb class=\"key\">체계\u003c/b>에 따라 가공된 결과물입니다. 예를 들어 '실업자'라는 개념도 국가가 어떤 기준을 세우느냐에 따라 통계 수치가 달라지는 것과 같습니다. 이처럼 통계는 \u003cb class=\"key\">객관성의 \u003c/b>\u003cb class=\"key\">수사학\u003c/b>을 통해 국가의 결정에 신뢰를 부여하는 역할을 합니다.\u003c/div>","segs":[{"n":2,"text":"통계라는 단어인 Statistics의 어원을 보면 국가를 뜻하는 State가 들어 있어요. 옛날 국가들은 세금을 걷고 전쟁에 나갈 군인을 파악하기 위해 숫자가 필요했죠. 단순히 있는 그대로를 기록하는 게 아니라, 국가가 통치하기 편하게 세상을 숫자로 분류하는 과정이 바로 근대 통계의 시작입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>근대 통계의 정의\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>20세기 통계가 국가에 필요한 \u003cb class=\"key\">정량적 \u003c/b>\u003cb class=\"key\">정보\u003c/b>의 체계적 수집으로 정의되었음을 밝힙니다. 이러한 과정은 산업 국가들이 \u003cb class=\"key\">근대 \u003c/b>\u003cb class=\"key\">국가\u003c/b>로 발전하는 핵심적인 과정이었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>통계의 이중성\u003csmall>통념에 대한 성찰 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>통계로 측정되는 대상이 \u003cb class=\"key\">실재\u003c/b>한다는 믿음과 그것이 하나의 사회적 \u003cb class=\"key\">관행\u003c/b>이라는 사실을 동시에 인식하기 어렵다는 점을 지적합니다. 그러나 필자는 이것이 사실임을 강조하며 논의를 전개합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>분류 체계의 목적\u003csmall>근거 · 문장 5\u003c/small>\u003c/h4>\u003cp>현상 자체는 존재하지만, 통계의 수집과 조직화를 뒷받침하는 \u003cb class=\"key\">분류 \u003c/b>\u003cb class=\"key\">체계\u003c/b>는 철저히 \u003cb class=\"key\">국가의 \u003c/b>\u003cb class=\"key\">목적\u003c/b>에 기여하기 위해 고안되었음을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>사회적 기술로서의 통계\u003csmall>결론 · 문장 6\u003c/small>\u003c/h4>\u003cp>정량화는 결정의 주체를 가리면서 \u003cb class=\"key\">객관성\u003c/b>을 가장해 결정을 내리는 방법입니다. 이는 권위에 대한 \u003cb class=\"key\">신뢰 \u003c/b>\u003cb class=\"key\">구축\u003c/b>을 위해 의도된 '사회적 기술'로 정의됩니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름을 보면 통계의 정의에서 시작해서 그 이면의 정치적 의도까지 단계별로 깊어집니다.","hl":null},{"n":4,"text":"첫 번째 단계에서는 이십세기 통계가 국가에 필요한 정보를 모으는 체계적인 과정으로 자리 잡으며 근대 국가의 핵심이 되었다고 설명합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 통계가 실제 대상을 측정하는 것 같으면서도 실상은 약속된 관행이라는 두 가지 성격을 동시에 가지고 있다는 점을 지적하죠.","hl":"f1"},{"n":6,"text":"세 번째 단계에서는 통계의 분류 기준들이 거시 경제나 사회 정책 같은 국가의 구체적인 목적을 위해 만들어진 것임을 명확히 합니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 정량화라는 기술이 국가가 직접 결정하는 것처럼 보이지 않게 하면서 권위를 세우고 신뢰를 얻는 교묘한 방법임을 밝힙니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">통계가 국가 형성에 필수적이었다는 도입을 지나, 통계가 단순한 사실 수집이 아닌 \u003cb class=\"key\">국가의 \u003c/b>\u003cb class=\"key\">의도\u003c/b>가 반영된 틀임을 설명합니다. 마지막 문장에서 통계가 \u003cb class=\"key\">국가의 \u003c/b>\u003cb class=\"key\">권위\u003c/b>를 세우고 신뢰를 구축하는 '사회적 기술'이라는 핵심 주장을 명시하며 마무리하는 \u003cb class=\"key\">미괄식 \u003c/b>\u003cb class=\"key\">구조\u003c/b>입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Yet (4)\u003c/b>\u003cspan>전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">quantitative information\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">objects being measured\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">official statistics\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Quantification\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>현상 (Phenomena)\u003c/th>\u003cth>분류 체계 (Frameworks)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>실제로 존재함\u003c/td>\u003ctd>국가 목적을 위해 고안됨\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 통계의 이중성을 먼저 보여준 뒤 마지막에 그 본질을 정의하는 미괄식 구조를 취하고 있습니다. 처음에는 일반적인 통계 수집을 말하지만 끝으로 갈수록 사회적 기술이라는 필자의 주장을 강조하는 전개방식이에요.","hl":"ty"},{"n":9,"text":"네 번째 문장의 Yet이라는 신호어를 통해 통계가 단순한 측정이 아니라 관행이라는 점을 반전시키며 강조하고 있죠. 또한 quantitative information이 official statistics를 거쳐 Quantification으로 이어지는 재진술의 흐름을 따라가면 글의 핵심을 놓치지 않을 수 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Statistics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통계, 통계학\u003c/span>\u0 003cspan>거시 경제의\u003c/span>\u003c/div>\u003cdiv>\u003cb>authority\u003c/b>\u003cem>명사\u003c/em>\u003cspan>권위\u003c/span>\u003c/div>\u003cdiv>\u003cb>quantification\u003c/b>\u003cem>명사\u003c/em>\u003cspan>정량화\u003c/span>\u003c/div>\u003cdiv>\u003cb>characterising\u003c/b>\u003cem>동사\u003c/em>\u003cspan>특징짓다\u003c/span>\u003c/div>\u003cdiv>\u003cb>technology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>기술\u003c/span>\u003c/div>\u003cdiv>\u003cb>intended\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의도된\u003c/span>\u003c/div>\u003cdiv>\u003cb>trust\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신뢰\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여러분, devised라는 단어는 단순히 만든 게 아니라 목적을 가지고 고안했다는 뉘앙스예요. 그리고 classification framework는 국가가 세상을 바라보는 분류 체계를 뜻한다는 점도 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">systematic\u003c/b>\u003cspan class=\"m\">체계적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">organized\u003c/span>\u003cspan class=\"s\">methodical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">chaotic\u003c/span>\u003cspan class=\"a\">random\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">convention\u003c/b>\u003cspan class=\"m\">관행, 약속\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">custom\u003c/span>\u003cspan class=\"s\">practice\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">anomaly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">devised\u003c/b>\u003cspan class=\"m\">고안된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">invented\u003c/span>\u003cspan class=\"s\">formulated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">authority\u003c/b>\u003cspan class=\"m\">권위\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">power\u003c/span>\u003cspan class=\"s\">command\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">impotence\ eeded)] : \"국가에 의해서 요구되는\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Statistics in the twentieth century, 20세기의 통계 자료는. became the systematic collection, 체계적인 모음집이 되었다. of quantitative information, 정량적인 정보의. needed by the state, 국가에 의해서 요구되는.. 이 문장 전체를 해석하면, 20세기의 통계 자료는 국가에 의해서 요구되는 정량적인 정보의 체계적인 모음집이 되었다.","hl":"m"},{"n":13,"text":"이 문장은 20세기에 들어서 통계라는 것이 단순한 숫자의 나열이 아니라 국가 운영이라는 특정한 목적을 위해 국가 통치를 위한 필수적인 도구가 되었음을 보여줍니다.","hl":"mn"},{"n":14,"text":"명사인 quantitative information을 뒤에서 꾸며주는 표현을 봐주세요. 정보가 필요로 하는 게 아니라 국가에 의해 필요해지는 것이니까 수동의 의미를 담은 과거분사 needed를 써서 표현했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 과정은 생겨났다\u003c/span>\u003cspan class=\"en\">This process occurred\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 산업 국가에서\u003c/span>\u003cspan class=\"en\">in all the industrialised countries\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">핵심적인 요소로\u003c/span>\u003cspan class=\"en\">as a key part of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 근대 국가가 되는 것의.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">becoming\u003c/span> modern states.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 과정은 모든 산업 국가에서 그것들이 근대 국가가 되는 것의 핵심적인 요소로 생겨났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 산업화된 국가들이 \u003cb class=\"key\">근대 \u003c/b>\u003cb class=\"key\">국가\u003c/b>로 변모하는 과정에서 통계 체제 구축이 \u003cb class=\"key\">핵심적인 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 했음을 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사의 의미상 주어\u003c/span> : [Possessive (their)] + [Gerund (becoming)] : \"그것들이 되는 것의\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"This process occurred, 이러한 과정은 생겨났다. in all the industrialised countries, 모든 산업 국가에서. as a key part of, 핵심적인 요소로. their becoming modern states, 그것들이 근대 국가가 되는 것의.. 이 문장 전체를 해석하면, 이러한 과정은 모든 산업 국가에서 그것들이 근대 국가가 되는 것의 핵심적인 요소로 생겨났다.","hl":"m"},{"n":16,"text":"통계 데이터의 수집이 특정 국가만의 현상이 아니라 산업화된 국가들이 근대 국가라는 새로운 체제로 나아가기 위한 핵심적인 과정이었다는 설명입니다.","hl":"mn"},{"n":17,"text":"전치사 of 뒤에 동명사 becoming이 왔는데요. 그 앞에 있는 their는 그 행동을 하는 주체를 나타내는 의미상 주어라고 해석하면 됩니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Desrosières는 쓴다\u003c/span>\u003cspan class=\"en\">Desrosières writes:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동시에 생각하기는 어렵다\u003c/span>\u003cspan class=\"en\">&quot;\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">difficult \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">think\u003c/span> simultaneously\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">측정되는 대상들이 실제로 확실히 존재한다는 것과\u003c/span>\u003cspan class=\"en\">that the objects being measured \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">really \u003c/span>\u003cspan class=\"tgt\">do \u003c/span>\u003cspan class=\"tgt\">exist\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것이 단지 하나의 관행이라는 것을.\u003c/span>\u003cspan class=\"en\">and that this is only a convention&quot;.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Desrosières는 ‘측정되는 대상들이 실제로 확실히 존재한다는 것과 이것이 단지 하나의 관행이라는 것을 동시에 생각하기는 어렵다’라고 쓴다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 통계 수치가 \u003cb class=\"key\">객관적 \u003c/b>\u003cb class=\"key\">실체\u003c/b>인 동시에 인위적인 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">관행\u003c/b>이라는 두 가지 상충되는 성격을 동시에 수용하기 어렵다는 통계의 역설적 특징을 언급합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어-진주어 구문\u003c/span> : It [가주어] + is difficult + to think [진주어] : \"생각하는 것은 어렵다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사 강조의 do\u003c/span> : do [조동사] + exist [동사원형] : \"실제로 확실히 존재한다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">명사절 접속사 that의 병렬 구조\u003c/span> : think [타동사] + [that 절 (목적어 1)] + and + [that 절 (목적어 2)] : \"~라는 것과 ~라는 것을\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Desrosières writes, Desrosières는 쓴다. \"It is difficult to think simultaneously, 동시에 생각하기는 어렵다. that the objects being measured really do exist, 측정되는 대상들이 실제로 확실히 존재한다는 것과. and that this is only a convention\", 이것이 단지 하나의 관행이라는 것을.. 이 문장 전체를 해석하면, Desrosières는 ‘측정되는 대상들이 실제로 확실히 존재한다는 것과 이것이 단지 하나의 관행이라는 것을 동시에 생각하기는 어렵다’라고 쓴다.","hl":"m"},{"n":19,"text":"통계 데이터가 가리키는 대상이 실제로 존재하는 사실이기도 하지만, 한편으로는 사람이 정한 사회적인 약속인 관행이기도 하다는 이중적인 성격을 잘 보여주는 문장입니다.","hl":"mn"},{"n":20,"text":"첫 번째로 문장 앞부분의 It은 해석하지 않는 가주어이고 진짜 주어는 뒤에 있는 to think 부분입니다. 두 번째로 exist 앞에 쓰인 do는 존재한다는 사실을 정말로 그렇다고 강조해 주는 강조의 do예요. 마지막 세 번째로 think라는 동사의 목적어로 두 개의 that 절이 나란히 병렬 구조를 이루고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나\u003c/span>\u003cspan class=\"en\">Yet\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이는 사실이다.\u003c/span>\u003cspan class=\"en\">this is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">case\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러나 이는 사실이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 3번 문장에서 언급한 모순된 상황, 즉 측정되는 대상의 \u003cb class=\"key\">실재성\u003c/b>과 그것이 단순한 \u003cb class=\"key\">관습\u003c/b>이라는 점을 동시에 생각하기 어렵다는 것이 실제 통계의 본질임을 강조합니다. 통계가 실재를 반영하면서도 동시에 인위적인 틀이라는 점을 인정하는 글의 \u003cb class=\"key\">전환점\u003c/b> 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용적 표현(사실/실정)\u003c/span> : be [동사] + the case [형용사적 명사구] : \"사실인, 실제 상황인\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Yet, 그러나. this is the case, 이는 사실이다.. 이 문장 전체를 해석하면, 그러나 이는 사실이다.","hl":"m"},{"n":22,"text":"앞선 문장에서 통계 대상이 진짜 존재하는 것인지 아니면 약속된 관습인지 동시에 생각하기 어렵다고 했죠. 하지만 이 문장은 그 두 가지 성격이 모두 공존하는 것이 실제 통계의 사실이라는 점을 강조하고 있어요.","hl":"mn"},{"n":23,"text":"첫 번째로 the case라는 표현은 단순히 상자라는 뜻이 아니라 어떤 주장이 사실임을 나타내는 관용적인 표현으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~와 같은 현상들은\u003c/span>\u003cspan class=\"en\">Phenomena such as\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가격이 부과되는 것이나 제품이 판매되는 것\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">prices \u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">charged\u003c/span> and products being sold\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">존재하지만, 범주들과 분류 체계들은\u003c/span>\u003cspan class=\"en\">exist, but the categories and classification frameworks\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공식 통계 자료의 수집, 집계, 그리고 조직화를 뒷받침하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">supporting\u003c/span> the collection, aggregation, and organisation of official statistics\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국가의 목적들에 기여하도록 고안된다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">devised\u003c/span> to serve the purposes of the state,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거시 경제 또는 사회 정책들을 위한.\u003c/span>\u003cspan class=\"en\">for macroeconomic or for social policies.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">가격이 부과되는 것이나 제품이 판매되는 것과 같은 현상들은 존재하지만, 공식 통계 자료의 수집, 집계, 그리고 조직화를 뒷받침하는 범주들과 분류 체계들은 거시 경제 또는 사회 정책들을 위한 국가의 목적들에 기여하도록 고안된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거래 자체는 \u003cb class=\"key\">객관적 \u003c/b>\u003cb class=\"key\">현상\u003c/b>이지만, 이를 통계로 묶는 분류 틀은 \u003cb class=\"key\">국가적 \u003c/b>\u003cb class=\"key\">목적\u003c/b>에 따라 만들어진 \u003cb class=\"key\">인위성\u003c/b>을 띠고 있음을 대조하여 보여줍니다. 통계가 순수하게 중립적인 데이터가 아니라 정책을 위한 도구임을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 수동 형태\u003c/span> : prices [의미상 주어] + being charged [현재분사(수동)] : \"가격이 부과되는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 (명사 수식)\u003c/span> : frameworks [명사] + supporting [현재분사구] : \"뒷받침하는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : categories and classification frameworks [복수 주어] + are devised [be p.p.] : \"고안된다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Phenomena such as, ~와 같은 현상들은. prices being charged and products being sold, 가격이 부과되는 것이나 제품이 판매되는 것. exist, but the categories and classification frameworks, 존재하지만, 범주들과 분류 체계들은. supporting the collection, aggregation, and organisation of official statistics, 공식 통계 자료의 수집, 집계, 그리고 조직화를 뒷받침하는. are devised to serve the purposes of the state, 국가의 목적들에 기여하도록 고안된다. for macroeconomic or for social policies, 거시 경제 또는 사회 정책들을 위한.. 이 문장 전체를 해석하면, 가격이 부과되는 것이나 제품이 판매되는 것과 같은 현상들은 존재하지만, 공식 통계 자료의 수집, 집계, 그리고 조직화를 뒷받침하는 범주들과 분류 체계들은 거시 경제 또는 사회 정책들을 위한 국가의 목적들에 기여하도록 고안된다.","hl":"m"},{"n":25,"text":"우리가 실제로 물건을 사고파는 행위 자체는 실재하는 객관적 현상이지만, 이를 국가 통계로 정리할 때 사용하는 분류 틀은 국가의 정책적 이익을 위해 만들어진 결과물이라는 뜻입니다.","hl":"mn"},{"n":26,"text":"첫 번째로 being charged는 가격이라는 의미상 주어가 부과되는 수동의 상황이므로 현재분사의 수동형을 썼어요. 두 번째로 supporting은 분류 체계가 통계를 뒷받침한다는 능동의 의미로 앞의 명사를 수식하는 현재분사입니다. 세 번째로 are devised는 주어인 틀이 사람에 의해 고안되었다는 수동태 표현으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Theodore Porter는 통계 자료의 사용을 묘사했다\u003c/span>\u003cspan class=\"en\">Theodore Porter described the use of statistics\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">국가의 권위를 만들기 위한:\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">create\u003c/span> state authority:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">“정량화는 결정하는 방법이다\u003c/span>\u003cspan class=\"en\">&quot;Quantification is a way of making decisions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">결정하는 것처럼 보이지 않으면서”,\u003c/span>\u003cspan class=\"en\">without seeming to decide&quot;,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 ‘사회적 기술’로 특징지었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">characterising\u003c/span> it as a &quot;social technology&quot;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">권위에 대한 신뢰를 구축하기 위해 의도된.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">intended\u003c/span> to build trust in authority.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Theodore Porter는 국가의 권위를 만들기 위한 통계 자료의 사용을, ‘정량화는 결정하는 것처럼 보이지 않으면서 결정을 내리는 방법’이라고 묘사했고, 그것을 권위에 대한 신뢰를 구축하기 위해 의도된 ‘사회적 기술’로 특징지었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 통계 수치(정량화)를 이용하면 국가가 주관적인 결정을 내리는 것이 아니라 수치가 대신 결정하는 것처럼 보이게 하여, 국민에게 \u003cb class=\"key\">객관성\u003c/b>에 대한 믿음을 주고 \u003cb class=\"key\">국가 \u003c/b>\u003cb class=\"key\">권위\u003c/b>를 강화한다는 내용입니다. 통계는 정치적 결정을 중립적으로 보이게 포장하는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">기술\u003c/b>이라는 비유를 사용했습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법\u003c/span> : the use of statistics [명사] + to create [to부정사] : \"만들기 위한, 만드는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : S + V ~, characterising [v-ing] ~ : \"특징지으면서, 특징지었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사 (명사 수식)\u003c/span> : social technology [명사] + intended [과거분사구] : \"의도된\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Theodore Porter described the use of statistics, Theodore Porter는 통계 자료의 사용을 묘사했다. to create state authority, 국가의 권위를 만들기 위한:. \"Quantification is a way of making decisions, “정량화는 결정하는 방법이다. without seeming to decide\", 결정하는 것처럼 보이지 않으면서”. characterising it as a \"social technology\", 그것을 ‘사회적 기술’로 특징지었다. intended to build trust in authority, 권위에 대한 신뢰를 구축하기 위해 의도된.. 이 문장 전체를 해석하면, Theodore Porter는 국가의 권위를 만들기 위한 통계 자료의 사용을, ‘정량화는 결정하는 것처럼 보이지 않으면서 결정을 내리는 방법’이라고 묘사했고, 그것을 권위에 대한 신뢰를 구축하기 위해 의도된 ‘사회적 기술’로 특징지었다.","hl":"m"},{"n":28,"text":"통계라는 정량화된 도구는 마치 사람이 직접 결정하는 주관성을 배제하고 객관적 수치에 따라 결정되는 것처럼 보이게 합니다. 이렇게 객관적인 도구인 척하는 성질 때문에 사람들은 국가 권위를 더 신뢰하게 되고, 그래서 통계를 일종의 사회적 기술이라고 부르는 것이죠.","hl":"mn"},{"n":29,"text":"첫 번째로 to create는 권위를 만들기 위한 통계의 사용이라는 뜻으로 앞의 명사를 꾸며주는 형용사적 용법이에요. 두 번째로 characterising은 묘사한 내용에 이어지는 부연 설명을 나타내는 분사구문입니다. 세 번째로 intended는 그 사회적 기술이 신뢰 구축을 위해 의도되었다는 수동의 의미를 담아 기술을 수식해주는 과거분사입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>20세기 통계는 국가 운영에 필요한 \u003cb class=\"key\">정량적 \u003c/b>\u003cb class=\"key\">정보\u003c/b>의 체계적 수집으로 정의되었습니다.\u003c/li>\u003cli>통계는 측정 대상의 실재성과 사회적 \u003cb class=\"key\">관행\u003c/b>이라는 이중적인 성격을 동시에 지닙니다.\u003c/li>\u003cli>통계의 분류 체계는 순수한 관찰이 아니라 \u003cb class=\"key\">국가의 \u003c/b>\u003cb class=\"key\">목적\u003c/b>을 달성하기 위해 설계되었습니다.\u003c/li>\u003cli>정량화는 결정을 객관적으로 보이게 함으로써 \u003cb class=\"key\">국가의 \u003c/b>\u003cb class=\"key\">권위\u003c/b>와 신뢰를 높이는 기술입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Statistics in the twentieth century served as a systematic tool and social technology to establish state authority and achieve policy goals.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">20세기의 통계는 단순히 객관적 사실을 측정하는 것을 넘어, \u003cb class=\"key\">국가의 \u003c/b>\u003cb class=\"key\">목적\u003c/b>과 권위를 확립하기 위해 정량화라는 틀로 고안된 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">기술\u003c/b>이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"오늘 우리는 통계가 단순한 숫자가 아니라 국가의 권위를 세우는 사회적 기술임을 배웠습니다. 수치 뒤에 숨겨진 의도를 읽어내는 눈을 키우는 것이 독해의 핵심이에요. 고생 많으셨고 다음 시간에 만나요.","hl":null}]}]});</script></body></html>
