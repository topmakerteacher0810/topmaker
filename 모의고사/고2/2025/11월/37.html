@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 37번","audioDir":"37_audio","preview":false,"count":35,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">37번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>Beyond Appearance: The Reality of Butterflies and Moths\u003c/h1>\u003ch2>외양을 넘어선 나비와 나방의 실체\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>나비와 나방은 \u003cb class=\"key\">더듬이\u003c/b>와 \u003cb class=\"key\">날개 \u003c/b>\u003cb class=\"key\">자세\u003c/b> 등의 신체적 특징으로 구별되기도 하지만, 화려함이나 활동 시간으로 이들을 나누는 \u003cb class=\"key\">정형화된 \u003c/b>\u003cb class=\"key\">통념\u003c/b>은 사실과 다르다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>While butterflies and moths can be distinguished by physical traits like antennae and wing posture, common stereotypes regarding their appearance and behavior are often incorrect.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 2025년 10월 고등학교 2학년 모의고사 서른일곱 번째 지문을 함께 공부해보겠습니다. 이 글은 우리가 흔히 헷갈려 하는 나비와 나방의 차이점에 대해 다루고 있어요. 외형적인 구별법뿐만 아니라 우리가 가진 고정관념이 실제로는 틀릴 수 있다는 점을 짚어주는 아주 흥미로운 지문입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">곤충학(Entomology)에서 나비와 나방은 모두 나비목(Lepidoptera)이라는 한 울타리 안에 속하는 아주 가까운 친척입니다. 진화적으로는 나방이 먼저 나타났고, 그중 일부가 낮에 활동하는 형태로 진화한 것이 나비라고 볼 수 있어 둘을 엄격히 나누기는 어렵습니다. 마치 우리가 \u003cb class=\"key\">진돗개와 \u003c/b>\u003cb class=\"key\">셰퍼드\u003c/b>를 보고 종은 다르지만 같은 개라고 인식하는 것과 비슷한 이치입니다. 지문에서는 더듬이(Antennae) 모양이나 날개를 접는 방식 같은 \u003cb class=\"key\">형태적 \u003c/b>\u003cb class=\"key\">특징\u003c/b>을 제시하며 식별법을 설명합니다. 하지만 자연계에는 화려한 나방이나 밤에 다니는 나비 같은 \u003cb class=\"key\">예외\u003c/b>가 아주 많기 때문에 이분법적 사고를 경계해야 합니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 좀 쌓아볼까요? 나비와 나방은 곤충 분류학상 같은 그룹에 속합니다. 우리가 흔히 나비는 예쁘고 낮에 다니고, 나방은 칙칙하고 밤에 다닌다고 생각하죠? 하지만 이건 마치 모든 강아지가 귀엽고 순하다고 생각하는 것과 비슷한 편견일 수 있어요. 실제 생물학적 세계에서는 낮에 활동하는 화려한 나방도 정말 많답니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>신체적 식별 기준\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>외양으로 나비와 나방을 구별하는 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">기준\u003c/b>인 더듬이 모양, 날개 자세, 날개 연결 갈고리 등을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>통념에 대한 반박\u003csmall>전환 · 문장 5–7\u003c/small>\u003c/h4>\u003cp>나방은 칙칙하고 나비는 화려하다는 \u003cb class=\"key\">정형화된 \u003c/b>\u003cb class=\"key\">고정관념\u003c/b>이 실제 데이터와 일치하지 않음을 지적합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>통합적 관점\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>두 생물 사이의 엄격한 구별보다 둘 다 \u003cb class=\"key\">매혹적인 \u003c/b>\u003cb class=\"key\">곤충\u003c/b>으로 바라보는 합리적인 태도를 제안합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름은 크게 세 단계로 나누어 볼 수 있습니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장부터 네 번째 문장까지는 나비와 나방을 구별하는 물리적인 기준들을 나열합니다. Antennae 즉 더듬이의 모양이나 날개를 접는 방식, 그리고 나방에게만 있는 날개 갈고리 같은 특징들을 설명하고 있어요.","hl":"f0"},{"n":5,"text":"두 번째 단계인 다섯 번째 문장부터 일곱 번째 문장에서는 분위기가 반전됩니다. 우리가 흔히 나방을 칙칙하고 야행성인 사촌으로 묘사하는 Stereotypical differences 즉 정형화된 차이들이 단순히 틀렸다고 강하게 비판하고 있죠.","hl":"f1"},{"n":6,"text":"마지막 세 번째 단계인 여덟 번째 문장에서는 결론을 내립니다. 두 곤충을 굳이 나누기보다는 둘 다 아름답고 매혹적인 곤충으로 함께 생각하는 것이 더 합리적이라는 따뜻한 시선으로 마무리됩니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 5번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 전반부는 나비와 나방의 \u003cb class=\"key\">차이점\u003c/b>을 열거하며 정보를 제공하지만, 중반부인 다섯 번째 문장에서 그러한 차이점에 대한 \u003cb class=\"key\">고정관념\u003c/b>이 틀렸음을 명시하며 반전시킵니다. 마지막에는 두 대상을 \u003cb class=\"key\">하나의 \u003c/b>\u003cb class=\"key\">범주\u003c/b>로 묶어 결론을 내리는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Distinguishing (1)\u003c/b>\u003cspan>주제 제시\u003c/span>\u003cb>whereas (2)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>simply wrong (5)\u003c/b>\u003cspan>반박\u003c/span>\u003cb>Equally (7)\u003c/b>\u003cspan>추가 증거\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Distinguishing moths from butterflies\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">rules of thumb\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">stereotypical differences\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">simply wrong\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">think of them together\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Butterflies\u003c/th>\u003cth>Moths\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Club-shaped antennae\u003c/td>\u003ctd>Feathery or narrow antennae\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wings held shut above body\u003c/td>\u003ctd>Wings on full view (spread)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No hook between wings\u003c/td>\u003ctd>Tiny hook joins wings\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글의 전개 방식은 전반부에서 대조를 보여주다가 중반부에서 통념을 반박하는 중괄식 구조를 취하고 있습니다. 다섯 번째 문장이 이 글의 핵심적인 주제문이라고 할 수 있죠.","hl":"ty"},{"n":8,"text":"문장 곳곳에 신호어가 숨어 있어요. 두 번째 문장의 Whereas는 대조를 나타내고, 다섯 번째 문장의 Simply wrong은 필자의 강력한 비판을 보여줍니다. 일곱 번째 문장의 Equally는 통념에 반대되는 사례가 나비에게도 똑같이 적용됨을 알려주는 힌트입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>Distinguishing\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구별하는 것\u003c/span>\u003c/div>\u003cdiv>\u003cb>outward appearance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>외적 생김새\u003c/span>\u003c/div>\u003cdiv>\u003cb>rule of thumb\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>경험적 방법, 어림잡은 원칙\u003c/span>\u003c/div>\u003cdiv>\u003cb>antennae\u003c/b>\u003cem>명사\u003c/em>\u003cspan>더듬이\u003c/span>\u003c/div>\u003cdiv>\u003cb>club-shaped\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>곤봉 모양의\u003c/span>\u003c/div>\u003cdiv>\u003cb>swelling\u003c/b>\u003cem>명사\u003c/em>\u003cspan>혹, 부어오른 부분\u003c/span>\u003c/div>\u003cdiv>\u003cb>whereas\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>반면에\u003c/span>\u003c/div>\u003cdiv>\u003cb>feathery\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>깃털 모양의\u003c/span>\u003c/div>\u003cdiv>\u003cb>narrow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가늘어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fine tip\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미세한 끝부분\u003c/span>\u003c/div>\u003cdiv>\u003cb>tend to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 경향이 있다\u003c/span>\u003c/div>\u003cdiv>\u003cb>shut\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>닫힌\u003c/span>\u003c/div>\u003cdiv>\u003cb>on full view\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>완전히 드러나는 상태로\u003c/span>\u003c/div>\u003cdiv>\u003cb>distinction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구별, 차이\u003c/span>\u003c/div>\u003cdiv>\u003cb>hook\u003c/b>\u003cem>명사\u003c/em>\u003cspan>갈고리\u003c/span>\u003c/div>\u003cdiv>\u003cb>forewing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>앞날개\u003c/span>\u003c/div>\u003cdiv>\u003cb>hindwing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>뒷날개\u003c/span>\u003c/div>\u003cdiv>\u003cb>present\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>존재하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>stereotypical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>정형화된\u003c/span>\u003c/div>\u003cdiv>\u003cb>cast as\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~로 묘사된, ~의 역할을 맡긴\u003c/span>\u003c/div>\u003cdiv>\u003cb>gloomy\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>칙칙한, 우울한\u003c/span>\u003c/div>\u003cdiv>\u003cb>nocturnal\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>야행성의\u003c/span>\u003c/div>\u003cdiv>\u003cb>sun-loving\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>해를 좋아하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>active\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>활동적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>throughout\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>내내\u003c/span>\u003c/div>\u003cdiv>\u003cb>equally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마찬가지로, 똑같이\u003c/span>\u003c/div>\u003cdiv>\u003cb>shades\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조, 색조\u003c/span>\u003c/div>\u003cdiv>\u003cb>sensible\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>합리적인, 현명한\u003c/span>\u003c/div>\u003cdiv>\u003cb>fascinating\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>매혹적인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"중요한 단어들을 살펴볼까요? Outward appearance는 겉모습을 뜻하고, Rule of thumb은 경험에서 나온 원칙을 말해요. 그리고 Stereotypical이라는 단어는 정형화된, 즉 고정관념이 박힌이라는 뜻으로 이 글에서 아주 중요하게 쓰였습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">distinguish\u003c/b>\u003cspan class=\"m\">구별하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">differentiate\u003c/span>\u003cspan class=\"s\">discern\u003c/span>\u003cspan class=\"s\">separate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">confuse\u003c/span>\u003cspan class=\"a\">mix up\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">outward\u003c/b>\u003cspan class=\"m\">외적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">external\u003c/span>\u003cspan class=\"s\">exterior\u003c/span>\u003cspan class=\"s\">surface\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">inward\u003c/span>\u003cspan class=\"a\">internal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stereotypical\u003c/b>\u003cspan class=\"m\">정형화된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">conventional\u003c/span>\u003cspan class=\"s\">clichéd\u003c/span>\u003cspan class=\"s\">standardized\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unique\u003c/span>\u003cspan class=\"a\">unconventional\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">nocturnal\u003c/b>\u003cspan class=\"m\">야행성의\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">nightly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">diurnal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sensible\u003c/b>\u003cspan class=\"m\">합리적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">rational\u003c/span>\u003cspan class=\"s\">reasonable\u003c/span>\u003cspan class=\"s\">logical\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">foolish\u003c/span>\u003cspan class=\"a\">irrational\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어 공부도 해봅시다. Distinguish는 구별하다라는 뜻으로 differentiate나 discern으로 바꿔 쓸 수 있어요. 반대로 섞여서 헷갈리게 하는 것은 confuse라고 합니다. Nocturnal은 야행성이라는 뜻인데, 반대말인 주행성은 diurnal이라고 부른다는 점도 꼭 기억하세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나방들과 나비들을 구별하는 것이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Distinguishing \u003c/span>\u003cspan class=\"tgt\">moths \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">butterflies\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">외적 생김새로\u003c/span>\u003cspan class=\"en\">on outward appearance\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">항상 쉬운 일은 아니지만,\u003c/span>\u003cspan class=\"en\">is not always easy,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">몇 가지 경험적 방법들이 있다\u003c/span>\u003cspan class=\"en\">but there are a few rules of thumb\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도움이 될 수 있는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">help\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">외적 생김새로 나비들과 나방들을 구별하는 것이 항상 쉬운 일은 아니지만, 도움이 될 수 있는 몇 가지 경험적 방법들이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> \u003cb class=\"key\">외적 \u003c/b>\u003cb class=\"key\">생김새\u003c/b>만으로 나방과 나비를 구분하는 것은 어렵지만, 이를 돕는 유용한 \u003cb class=\"key\">경험적 \u003c/b>\u003cb class=\"key\">방법\u003c/b>들이 존재함을 알리는 도입부 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사 주어\u003c/span> : Distinguishing [동명사] + [moths (목적어)] : \"구별하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">구문(Distinguish A from B)\u003c/span> : distinguish [A] from [B] : \"나방과 나비를 구별하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : rules of thumb [선행사] + that [관계대명사] + can help [동사] : \"도움이 될 수 있는\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Distinguishing moths from butterflies, 나방들과 나비들을 구별하는 것이. on outward appearance, 외적 생김새로. is not always easy, 항상 쉬운 일은 아니지만. but there are a few rules of thumb, 몇 가지 경험적 방법들이 있다. that can help, 도움이 될 수 있는.. 이 문장 전체를 해석하면, 외적 생김새로 나비들과 나방들을 구별하는 것이 항상 쉬운 일은 아니지만, 도움이 될 수 있는 몇 가지 경험적 방법들이 있다.","hl":"m"},{"n":12,"text":"이 글의 시작으로, 나비와 나방을 겉모습만 보고 구분하는 게 쉽지만은 않다고 말하고 있어요. 하지만 우리가 실생활에서 바로 써먹을 수 있는 유용한 경험적 방법들이 있다는 걸 예고하며 호기심을 자극하죠.","hl":"mn"},{"n":13,"text":"첫 번째로 문장 맨 앞의 Distinguishing은 문장의 주어 역할을 하는 동명사예요. 주어 자리에 온 동명사는 항상 단수 취급하기 때문에 뒤에 동사 is가 온 걸 확인하세요. 두 번째로 Distinguish A from B 구문은 A와 B를 구별한다는 아주 중요한 표현이고요. 마지막 세 번째로 that can help에서 that은 앞에 있는 경험적 방법들을 꾸며주는 주격 관계대명사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분의 나비들의 경우 더듬이들은 끝나는 작은 곤봉 모양의 혹으로 반면 나방들의 경우 그것들은 보통 깃털 모양이거나 미세한 끝부분으로 점점 가늘어진다.\u003c/span>\u003cspan class=\"en\">In most butterflies \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">antennae \u003c/span>\u003cspan class=\"tgt\">end\u003c/span> with a small club­shaped swelling, \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">whereas\u003c/span> in moths they are usually feathery or narrow to a fine tip.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">대부분의 나비들의 경우 더듬이들은 작은 곤봉 모양의 혹으로 끝나는 반면, 나방들의 경우 그것들은 보통 깃털 모양이거나 미세한 끝부분으로 점점 가늘어진다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 첫 번째 구분 기준으로 \u003cb class=\"key\">더듬이 \u003c/b>\u003cb class=\"key\">모양\u003c/b>을 제시하며, 나비의 \u003cb class=\"key\">곤봉형\u003c/b> 끝부분과 나방의 \u003cb class=\"key\">깃털형\u003c/b> 또는 뾰족한 형태를 대조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : the antennae [복수 주어] + end [동사] : \"더듬이들은 끝난다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대조의 접속사\u003c/span> : S + V, whereas [접속사] + S + V : \"반면에\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"In most butterflies, 대부분의 나비들의 경우. the antennae end, 더듬이들은 끝나는. with a small club-shaped swelling, 작은 곤봉 모양의 혹으로. whereas in moths, 반면 나방들의 경우. they are usually feathery, 그것들은 보통 깃털 모양이거나. or narrow to a fine tip, 미세한 끝부분으로 점점 가늘어진다.. 이 문장 전체를 해석하면, 대부분의 나비들의 경우 더듬이들은 작은 곤봉 모양의 혹으로 끝나는 반면, 나방들의 경우 그것들은 보통 깃털 모양이거나 미세한 끝부분으로 점점 가늘어진다.","hl":"m"},{"n":15,"text":"나비와 나방을 나누는 구체적인 첫 번째 증거는 바로 더듬이예요. 나비는 끝이 몽둥이처럼 뭉툭하게 부풀어 있고, 나방은 깃털처럼 생겼거나 끝으로 갈수록 아주 가늘어진다는 차이점을 보여주고 있습니다.","hl":"mn"},{"n":16,"text":"첫 번째로 주어인 antennae는 더듬이의 복수형 단어예요. 그래서 동사 end에 s를 붙이지 않고 복수 동사 그대로 썼다는 걸 눈여겨봐야 합니다. 두 번째로 whereas는 두 대상의 차이를 강조할 때 쓰는 대조의 접속사로, 나비와 나방의 생김새를 갈라주는 역할을 해요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나비들은 쉬는 경향이 있지만\u003c/span>\u003cspan class=\"en\">Butterflies \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tend \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">rest\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 날개들이 닫힌 채로\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">wings \u003c/span>\u003cspan class=\"tgt\">held \u003c/span>\u003cspan class=\"tgt\">shut\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 몸 위에\u003c/span>\u003cspan class=\"en\">above their body,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면 나방들은 더 흔히 쉰다\u003c/span>\u003cspan class=\"en\">whereas moths more usually rest\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">날개들의 윗면이\u003c/span>\u003cspan class=\"en\">with the upper sides of the wings\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 드러나는 상태로.\u003c/span>\u003cspan class=\"en\">on full view.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나비들은 자신의 날개들이 자신의 몸 위에 닫힌 채 쉬는 경향이 있지만, 나방들은 더 흔히 날개들의 윗면이 완전히 드러나는 상태로 쉰다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 두 번째 구분 기준으로 \u003cb class=\"key\">날개 \u003c/b>\u003cb class=\"key\">자세\u003c/b>를 제시하며, 나비는 \u003cb class=\"key\">접은 \u003c/b>\u003cb class=\"key\">상태\u003c/b>로, 나방은 \u003cb class=\"key\">펼친 \u003c/b>\u003cb class=\"key\">상태\u003c/b>로 휴식한다는 점을 대조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">tend to 부정사\u003c/span> : tend [동사] + to rest [to부정사/목적어] : \"쉬는 경향이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">with 부대상황 구문\u003c/span> : with [전치사] + their wings [목적어] + held [과거분사] : \"날개가 닫힌 채로\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"Butterflies tend to rest, 나비들은 쉬는 경향이 있지만. with their wings held shut, 자신의 날개들이 닫힌 채로. above their body, 자신의 몸 위에. whereas moths more usually rest, 반면 나방들은 더 흔히 쉰다. with the upper sides of the wings, 날개들의 윗면이. on full view, 완전히 드러나는 상태로.. 이 문장 전체를 해석하면, 나비들은 자신의 날개들이 자신의 몸 위에 닫힌 채 쉬는 경향이 있지만, 나방들은 더 흔히 날개들의 윗면이 완전히 드러나는 상태로 쉰다.","hl":"m"},{"n":18,"text":"두 번째 차이점은 쉴 때 날개를 어떻게 하느냐예요. 나비는 몸 위로 날개를 딱 접고 쉬는 반면에, 나방은 날개 윗면이 다 보이도록 쫙 펼쳐서 쉬는 경우가 많다는 특징을 설명하고 있죠.","hl":"mn"},{"n":19,"text":"첫 번째로 tend to rest는 뭐뭐하는 경향이 있다는 뜻으로 나비의 습성을 나타내요. 두 번째로 이 문장의 핵심인 with their wings held shut을 보세요. 부대 상황을 나타내는 with 구문인데, 날개 입장에서는 닫히는 것이기 때문에 과거분사 held를 쓴 것이 시험에 아주 잘 나오는 포인트입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 이상의 구별들이 가능하다 아주 작은 갈고리를 찾아봄으로써 앞날개와 뒷날개를 연결해 주는 나방들에게만 존재하는 특징인\u003c/span>\u003cspan class=\"en\">Further distinctions \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">made\u003c/span> by looking for a tiny hook \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">joins\u003c/span> fore­ and hindwings, \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">feature\u003c/span> only present in moths.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나방들에게만 존재하는 특징인, 앞날개와 뒷날개를 연결해 주는 아주 작은 갈고리를 찾아봄으로써 그 이상의 구별들이 가능하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 나비와 나방을 구분하는 구체적이고 물리적인 \u003cb class=\"key\">식별 \u003c/b>\u003cb class=\"key\">방법\u003c/b>을 제시합니다. 나방에게만 있는 독특한 신체적 특징인 \u003cb class=\"key\">갈고리\u003c/b>의 존재를 통해 둘을 확실히 구분할 수 있음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 수동태\u003c/span> : can [조동사] + be [be동사] + made [과거분사] : \"이루어질 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a tiny hook [선행사] + that [관계대명사] + joins [동사] : \"연결해 주는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">동격의 명사구\u003c/span> : a tiny hook [명사], a feature [명사] : \"특징인\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"Further distinctions can be made, 그 이상의 구별들이 가능하다. by looking for a tiny hook, 아주 작은 갈고리를 찾아봄으로써. that joins fore- and hindwings, 앞날개와 뒷날개를 연결해 주는. a feature only present in moths, 나방들에게만 존재하는 특징인. 이 문장 전체를 해석하면, 나방들에게만 존재하는 특징인, 앞날개와 뒷날개를 연결해 주는 아주 작은 갈고리를 찾아봄으로써 그 이상의 구별들이 가능하다.","hl":"m"},{"n":21,"text":"네 번째 문장에서는 나방과 나비를 구별하는 또 다른 신체적 특징을 설명하고 있어요. 앞날개와 뒷날개를 이어주는 아주 작은 갈고리가 나방에게만 있다는 점을 강조하며 글의 흐름을 구체적인 식별 방법으로 이어가죠.","hl":"mn"},{"n":22,"text":"어법을 보면 첫 번째로 can be made는 조동사가 포함된 수동태로 구별이 이루어질 수 있다는 의미고요. 두 번째로 that joins는 앞의 hook을 꾸며주는 주격 관계대명사예요. 마지막으로 a feature는 앞 문장의 갈고리를 다시 한번 설명해 주는 동격의 명사구로 쓰여 추가 정보를 전달하고 있답니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정형화된 차이들은 나방들이 칙칙하고 야행성인 사촌으로 묘사되는 색이 화려하고 해를 좋아하는 나비들의 그야말로 잘못된 것이다.\u003c/span>\u003cspan class=\"en\">The stereotypical differences, \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">moths \u003c/span>\u003cspan class=\"tgt\">cast \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> the gloomy, nocturnal cousins of colourful sun­loving butterflies \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are\u003c/span> simply wrong.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">색이 화려하고 해를 좋아하는 나비들의 칙칙하고 야행성인 사촌으로 나방들이 묘사되는 정형화된 차이들은 그야말로 잘못된 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대중이 흔히 가진 나방에 대한 \u003cb class=\"key\">부정적 \u003c/b>\u003cb class=\"key\">고정관념\u003c/b>을 정면으로 반박합니다. 나방은 어둡고 나비는 밝다는 이분법적 사고가 \u003cb class=\"key\">사실이 \u003c/b>\u003cb class=\"key\">아님\u003c/b>을 명시하며 글의 논조를 전환합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">with + 목적어 + 과거분사 (부대상황)\u003c/span> : with + moths [목적어] + cast [과거분사] : \"나방들이 ~로 묘사되는 상태로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수일치\u003c/span> : The stereotypical differences [복수 주어] ... are [복수 동사] : \"~이다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"The stereotypical differences, 정형화된 차이들은. with moths cast as the gloomy, nocturnal cousins, 나방들이 칙칙하고 야행성인 사촌으로 묘사되는. of colourful sun-loving butterflies, 색이 화려하고 해를 좋아하는 나비들의. are simply wrong, 그야말로 잘못된 것이다.. 이 문장 전체를 해석하면, 색이 화려하고 해를 좋아하는 나비들의 칙칙하고 야행성인 사촌으로 나방들이 묘사되는 정형화된 차이들은 그야말로 잘못된 것이다.","hl":"m"},{"n":24,"text":"다섯 번째 문장은 이 글의 핵심적인 반전이 시작되는 곳이에요. 우리가 흔히 나방은 칙칙하고 나비는 화려하다고 생각하는 그 부정적 고정관념이 틀렸다고 선언하며 통념을 비판하고 있죠.","hl":"mn"},{"n":25,"text":"어법 첫 번째 포인트는 with moths cast as인데, 나방이 사촌으로 묘사된 채라는 의미의 분사구문이에요. 여기서 cast는 과거분사로 쓰였죠. 두 번째는 문장의 주어인 differences가 복수라서 동사로 are를 썼다는 점인데, 수식어가 길어서 주어와 동사 거리가 머니 수일치를 꼭 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">밝은색을 가진 나방들이 많고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">There \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> many brightly coloured moths\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">활동적인 나방들이 많이 있다\u003c/span>\u003cspan class=\"en\">and many \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">active\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">낮 동안 내내\u003c/span>\u003cspan class=\"en\">throughout the day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">밝은색을 가진 나방들이 많고 낮 동안 내내 활동적인 나방들이 많이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장의 주장을 뒷받침하는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 제시합니다. 나방 역시 나비처럼 \u003cb class=\"key\">화려한 \u003c/b>\u003cb class=\"key\">색상\u003c/b>과 \u003cb class=\"key\">주행성\u003c/b>을 가질 수 있음을 보여주어 고정관념을 깹니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 구문의 도치와 수일치\u003c/span> : There [유도부사] + are [복수 동사] + moths [복수 주어] : \"~들이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : many [선행사] + which [관계대명사] + are [동사] : \"활동적인\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"There are many brightly coloured moths, 밝은색을 가진 나방들이 많고. and many which are active, 활동적인 나방들이 많이 있다. throughout the day, 낮 동안 내내. 이 문장 전체를 해석하면, 밝은색을 가진 나방들이 많고 낮 동안 내내 활동적인 나방들이 많이 있다.","hl":"m"},{"n":27,"text":"여섯 번째 문장은 앞서 말한 고정관념이 왜 틀렸는지에 대한 구체적인 근거를 제시해요. 나방 중에도 화려한 색이 있고 낮에 활동하는 종류가 많다는 사실을 들어서 반박하고 있거든요.","hl":"mn"},{"n":28,"text":"어법을 살펴보면 첫 번째로 There are 구문이 쓰여서 실제 주어인 moths에 맞춰 복수 동사를 썼고요. 두 번째로 which are active는 대명사 many를 뒤에서 꾸며주는 주격 관계대명사절로 쓰여 낮에 활동하는 나방들이 많다는 점을 구체적으로 설명하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">마찬가지로,\u003c/span>\u003cspan class=\"en\">Equally,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">야행성의 나비들이 몇몇 있고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">there \u003c/span>\u003cspan class=\"tgt\">are\u003c/span> a few nocturnal butterflies\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">많은 것들이 있다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">plenty \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">갈색과 회색 조를 띠는 것들이.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> come \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">clothed\u003c/span> in shades of brown and grey.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">마찬가지로, 야행성의 나비들이 몇몇 있고, 갈색과 회색 조를 띠는 것들이 많이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장의 내용과 대등하게 나비에게서 발견되는 \u003cb class=\"key\">예외적인 \u003c/b>\u003cb class=\"key\">사례\u003c/b>를 제시합니다. 나비와 나방을 가르는 \u003cb class=\"key\">활동 \u003c/b>\u003cb class=\"key\">시간\u003c/b>이나 \u003cb class=\"key\">색채\u003c/b>에 대한 고정관념이 절대적이지 않음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">유도부사 도치 구문\u003c/span> : There [부사] + are [동사] + a few nocturnal butterflies [주어] : \"~들이 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : plenty [선행사] + that [주격 관계대명사] + come [동사] : \"~하는 많은 것들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 보어 역할\u003c/span> : come [동사] + clothed [과거분사/보어] : \"입혀진 상태로 (띠는 상태로)\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"Equally, 마찬가지로. there are a few nocturnal butterflies, 야행성의 나비들이 몇몇 있고. and plenty, 많은 것들이 있다. that come clothed in shades of brown and grey, 갈색과 회색 조를 띠는 것들이.. 이 문장 전체를 해석하면, 마찬가지로, 야행성의 나비들이 몇몇 있고, 갈색과 회색 조를 띠는 것들이 많이 있다.","hl":"m"},{"n":30,"text":"앞 문장에서 나방의 예외를 말했으니, 이번에는 나비의 예외를 말할 차례죠. 나비 중에도 밤에 활동하거나 칙칙한 색을 가진 경우가 많다는 점을 들어 고정관념이 틀렸음을 다시 한번 확인해 주는 문장이에요.","hl":"mn"},{"n":31,"text":"첫 번째로 there are 구문에서 진짜 주어는 뒤에 나오는 butterflies이므로 복수 동사를 써야 합니다. 두 번째로 that은 앞의 plenty를 꾸며주는 주격 관계대명사로 쓰였고요. 마지막으로 clothed는 옷을 입은 듯한 상태를 나타내는 과거분사로 쓰여서 갈색이나 회색을 띠고 있다는 점을 묘사하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 합리적이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It's \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">sensible \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들을 함께 묶어 생각하는 것이;\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">think\u003c/span> of them together;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나비와 나방 둘 다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">both \u003c/span>\u003cspan class=\"tgt\">butterflies \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">moths \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아름답고 매혹적인 곤충이기 때문이다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">are\u003c/span> beautiful and fascinating insects.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그들을 함께 묶어 생각하는 것이 더 합리적이다. 나비와 나방 둘 다 아름답고 매혹적인 곤충이기 때문이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 엄격한 구분에 집착하기보다 두 생명체의 \u003cb class=\"key\">공통된 \u003c/b>\u003cb class=\"key\">가치\u003c/b>에 주목하라는 필자의 결론입니다. 두 곤충을 모두 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">관점\u003c/b>에서 포용하며 글을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">가주어-진주어 구문\u003c/span> : It [가주어] + is + sensible [형용사] + to think [진주어] : \"생각하는 것이 더 합리적이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상관접속사 주어와 수 일치\u003c/span> : both A and B + 복수 동사 : \"나비와 나방 둘 다 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":32,"text":"It's more sensible, 더 합리적이다. to think of them together, 그들을 함께 묶어 생각하는 것이;. both butterflies and moths, 나비와 나방 둘 다. are beautiful and fascinating insects, 아름답고 매혹적인 곤충이기 때문이다.. 이 문장 전체를 해석하면, 그들을 함께 묶어 생각하는 것이 더 합리적이다. 나비와 나방 둘 다 아름답고 매혹적인 곤충이기 때문이다.","hl":"m"},{"n":33,"text":"결국 나비와 나방을 억지로 나누려고 애쓰기보다는, 둘 다 훌륭한 생물이라는 통합적 관점을 가지는 게 좋다는 결론이에요. 차이점보다는 그들이 가진 본질적인 아름다움에 집중하자는 따뜻한 마무리죠.","hl":"mn"},{"n":34,"text":"첫 번째 포인트로 It은 가짜 주어이고 진짜 주어는 뒤에 있는 to부정사인 to think 이하예요. 해석할 때 주의해야겠죠. 두 번째로 both A and B 표현은 언제나 복수 취급을 하기 때문에 동사 자리에 are가 왔다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>나비와 나방은 \u003cb class=\"key\">더듬이\u003c/b> 형태와 날개를 쉬는 \u003cb class=\"key\">자세\u003c/b>를 통해 외형적으로 구별될 수 있습니다.\u003c/li>\u003cli>나방만이 가진 \u003cb class=\"key\">날개 \u003c/b>\u003cb class=\"key\">갈고리\u003c/b> 구조는 두 곤충을 나누는 중요한 해부학적 특징입니다.\u003c/li>\u003cli>나방은 칙칙하고 나비는 화려하다는 생각은 실제와 다른 \u003cb class=\"key\">정형화된 \u003c/b>\u003cb class=\"key\">편견\u003c/b>입니다.\u003c/li>\u003cli>두 곤충 모두 화려한 색상과 활동 시간을 공유하는 \u003cb class=\"key\">매혹적인 \u003c/b>\u003cb class=\"key\">존재\u003c/b>로 통합하여 보아야 합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>While butterflies and moths can be distinguished by physical traits like antennae and wing posture, common stereotypes regarding their appearance and behavior are often incorrect.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">나비와 나방은 \u003cb class=\"key\">더듬이\u003c/b>와 \u003cb class=\"key\">날개 \u003c/b>\u003cb class=\"key\">자세\u003c/b> 등의 신체적 특징으로 구별되기도 하지만, 화려함이나 활동 시간으로 이들을 나누는 \u003cb class=\"key\">정형화된 \u003c/b>\u003cb class=\"key\">통념\u003c/b>은 사실과 다르다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":35,"text":"자, 오늘 지문을 통해 나비와 나방에 대한 새로운 시각을 갖게 되었나요? 겉모습만으로 대상을 판단하는 것이 위험하다는 교훈도 함께 얻을 수 있었던 지문이었습니다. 복습할 때 더듬이와 날개의 구체적인 차이점들을 영어 표현으로 꼭 다시 확인해보세요. 오늘 수업 여기서 마칠게요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
