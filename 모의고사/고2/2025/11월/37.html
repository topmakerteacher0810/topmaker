P5c+3TH44P8n29fQf5Aouu6+9DAYAAx0P8Akdx/Pv1zTWOFJGAQCRn9fw6Z/CjI9RyPXkfX2I+h79DSEH5iPvYOD/LAww46nIx1zxUSqK101qr3f3313807Wdt72Ruv6/T80f/Z\" alt=\"\"><\/div>","<div class=\"lec-cover-title\">Moths and Butterflies: Beyond Outward Appearances and Stereotypes<small>나방과 나비: 겉모습과 고정관념을 넘어서<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">나비와 나방은 생물학적으로 같은 나비목(Lepidoptera)에 속하는 가까운 친척이라서 겉모습만으로 완벽하게 구분하기가 쉽지 않답니다. 이 둘을 구별하려면 곤충의 핵심 감각 기관인 더듬이(Antennae)의 끝부분 모양이나 쉴 때 날개(Wings)를 두는 방식을 관찰하는 것이 좋은데, 이는 마치 우리가 사람을 구별할 때 그 사람 특유의 머리 스타일이나 평소 서 있는 자세를 유심히 살펴보는 것과 비슷하죠. 특히 나방에게만 존재하는 앞날개와 뒷날개를 연결해 주는 작은 갈고리(Hook)는 비행 시 두 날개가 퍼즐 조각처럼 단단히 맞물려 효율적으로 움직이게 돕는 아주 중요한 해부학적 구조입니다. 더불어 우리는 흔히 나비는 낮에 활동하는 화려한 주행성(Diurnal)이고 나방은 밤에 활동하는 우울한 야행성(Nocturnal) 곤충이라는 고정관념을 품기 쉽습니다. 하지만 실제 생태계에는 낮에 날아다니는 화려한 나방이나 밤에 활동하는 칙칙한 나비 등 예외적인 생태적 다양성(Ecological diversity)이 훨씬 많다는 사실을 미리 알아두시면 이 지문을 한층 더 입체적이고 흥미롭게 이해하실 수 있을 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01외형적 특징을 통한 구분<\/div><ul><li>나방과 나비는 외형적인 특징, 특히 더듬이의 모양을 통해 일차적으로 구분할 수 있다.<\/li><li>나비: 더듬이 끝이 곤봉 모양(club-shaped)으로 부풀어 있음<\/li><li>나방: 더듬이가 깃털 모양(feathery)이거나 끝이 가늘고 뾰족함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02휴식 자세와 날개 구조<\/div><ul><li>휴식할 때의 날개 자세와 날개를 잇는 구조물의 유무로 추가적인 구분이 가능하다.<\/li><li>나비: 날개를 위로 접은(shut) 상태로 휴식함<\/li><li>나방: 날개 윗면을 완전히 펴고 휴식함<\/li><li>앞뒷날개를 연결하는 작은 고리(hook)는 나방에게만 존재함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03색상과 생태에 대한 편견<\/div><ul><li>나방은 어둡고 야행성인 반면 나비는 화려하고 주행성이라는 고정관념은 사실이 아니다.<\/li><li>밝고 화려하며 낮에 활동하는 나방(moths)도 많음<\/li><li>어두운색을 띠고 야행성(nocturnal)인 나비도 존재함<\/li><li>색과 활동 시간에 대한 잘못된 고정관념(stereotypical differences)을 지적함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04두 곤충에 대한 올바른 인식<\/div><ul><li>두 곤충을 극단적으로 대비시키기보다는 함께 아울러서 생각하는 것이 합리적이다.<\/li><li>나방과 나비 모두 아름답고 흥미로운 곤충(fascinating insects)임<\/li><li>편견을 버리고 이들을 함께(together) 묶어서 인식하는 태도가 필요함<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">distinguish<\/td><td class=\"m\">구별하다, 분간하다<\/td><\/tr><tr><td class=\"w\">outward<\/td><td class=\"m\">겉보기의, 외형의<\/td><\/tr><tr><td class=\"w\">rule of thumb<\/td><td class=\"m\">경험 법칙, 어림짐작<\/td><\/tr><tr><td class=\"w\">swelling<\/td><td class=\"m\">부풀어 오른 부분, 팽창<\/td><\/tr><tr><td class=\"w\">narrow<\/td><td class=\"m\">좁아지다, 가늘어지다<\/td><\/tr><tr><td class=\"w\">fine<\/td><td class=\"m\">가는, 뾰족한<\/td><\/tr><tr><td class=\"w\">tend to<\/td><td class=\"m\">~하는 경향이 있다, ~하기 쉽다<\/td><\/tr><tr><td class=\"w\">on full view<\/td><td class=\"m\">완전히 다 보이는, 시야에 다 들어오는<\/td><\/tr><tr><td class=\"w\">distinction<\/td><td class=\"m\">차이, 구별<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">look for<\/td><td class=\"m\">~을 찾다, ~을 구하다<\/td><\/tr><tr><td class=\"w\">feature<\/td><td class=\"m\">특징, 특성<\/td><\/tr><tr><td class=\"w\">present<\/td><td class=\"m\">존재하는, 있는<\/td><\/tr><tr><td class=\"w\">stereotypical<\/td><td class=\"m\">틀에 박힌, 진부한<\/td><\/tr><tr><td class=\"w\">cast as<\/td><td class=\"m\">~로 묘사하다, ~로 간주하다<\/td><\/tr><tr><td class=\"w\">gloomy<\/td><td class=\"m\">우중충한, 우울한<\/td><\/tr><tr><td class=\"w\">nocturnal<\/td><td class=\"m\">야행성의, 밤의<\/td><\/tr><tr><td class=\"w\">sensible<\/td><td class=\"m\">합리적인, 분별 있는<\/td><\/tr><tr><td class=\"w\">fascinating<\/td><td class=\"m\">대단히 흥미로운, 매력적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Distinguishing<\/span> moths from butterflies<\/b><\/span><span class=\"ko\">나방들을 나비들과 구별하는 것이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on outward appearance<\/b><\/span><span class=\"ko\">외적 생김새로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is not always easy,<\/b><\/span><span class=\"ko\">항상 쉬운 일은 아니다,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>but there are a few <span class=\"grammar-hl\">rules of thumb<\/span><\/b><\/span><span class=\"ko\">하지만 몇 가지 경험적 방법들이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that can help<\/span>.<\/b><\/span><span class=\"ko\">도움이 될 수 있는<\/span><\/div><\/div><div class=\"lec-sent-ko\">외적 생김새로 나비들과 나방들을 구별하는 것이 항상 쉬운 일은 아니지만, 도움이 될 수 있는 몇 가지 경험적 방법들이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 첫 문장으로, 앞으로 나방과 나비를 구분하는 방법을 설명할 것을 예고합니다. rules of thumb은 사람들의 경험을 통해 얻은 대충의 방식이라는 의미입니다. 여기서는 엄격한 생물학적 분류 기준보다 겉모습을 보고 쉽게 구별할 수 있는 실용적인 방법들을 알려주겠다는 뜻입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Distinguishing (동명사): 문장의 주어 역할을 하는 명사적 쓰임으로, &#39;구별하는 것&#39;으로 해석된다. 구/절 주어이므로 뒤에 단수 동사 is가 이어진다.<\/div><div class=\"lec-gr-item\">rules of thumb (관용표현): &#39;경험 법칙&#39;, &#39;대략적인 방법&#39;이라는 뜻으로, 문법 규칙만으로는 해석되지 않는 굳어진 표현이다.<\/div><div class=\"lec-gr-item\">that can help (관계대명사): that은 주격 관계대명사로 선행사 a few rules of thumb을 수식하며, 뒤에 주어가 빠진 동사(can help)로 시작하는 불완전한 절이 이어진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">distinguish<\/td><td class=\"m\">구별하다, 분간하다<\/td><\/tr><tr><td class=\"w\">outward<\/td><td class=\"m\">겉보기의, 외형의<\/td><\/tr><tr><td class=\"w\">rule of thumb<\/td><td class=\"m\">경험 법칙, 어림짐작<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In most butterflies<\/b><\/span><span class=\"ko\">대부분의 나비들의 경우<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>the antennae end<\/b><\/span><span class=\"ko\">더듬이들은 끝난다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with a small <span class=\"grammar-hl\">club-shaped<\/span> swelling,<\/b><\/span><span class=\"ko\">작은 곤봉 모양의 혹으로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>whereas in moths<\/b><\/span><span class=\"ko\">반면 나방들의 경우<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they are usually feathery<\/b><\/span><span class=\"ko\">그것들은 보통 깃털 모양이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or narrow to a fine tip.<\/b><\/span><span class=\"ko\">또는 미세한 끝부분으로 점점 가늘어진다<\/span><\/div><\/div><div class=\"lec-sent-ko\">대부분의 나비들의 경우 더듬이들은 작은 곤봉 모양의 혹으로 끝나는 반면, 나방들의 경우 그것들은 보통 깃털 모양이거나 미세한 끝부분으로 점점 가늘어진다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 언급한 경험 법칙의 첫 번째 예시입니다. 나비와 나방을 더듬이의 생김새로 구별할 수 있다는 점을 구체적으로 보여줍니다. 더듬이 끝이 둥글고 뭉툭하면 나비, 깃털처럼 풍성하거나 뾰족하게 빠지면 나방으로 알아볼 수 있다는 설명입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">club-shaped (과거분사(형용사)): club-shaped(곤봉 모양을 한)가 뒤의 명사 swelling을 수식(= 곤봉 모양의 부풀어오름). p.p. + N ≈ p.p.된 N 구조로 명사를 꾸민다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">swelling<\/td><td class=\"m\">부풀어 오른 부분, 팽창<\/td><\/tr><tr><td class=\"w\">narrow<\/td><td class=\"m\">좁아지다, 가늘어지다<\/td><\/tr><tr><td class=\"w\">fine<\/td><td class=\"m\">가는, 뾰족한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Butterflies tend <span class=\"grammar-hl\">to rest<\/span><\/b><\/span><span class=\"ko\">나비들은 쉬는 경향이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">with their wings held shut<\/span><\/b><\/span><span class=\"ko\">자신의 날개들이 닫힌 채로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>above their body,<\/b><\/span><span class=\"ko\">자신의 몸 위에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>whereas moths more usually rest<\/b><\/span><span class=\"ko\">반면 나방들은 더 흔히 쉰다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with the upper sides of the wings on full view.<\/b><\/span><span class=\"ko\">날개들의 윗면이 완전히 드러나는 상태로<\/span><\/div><\/div><div class=\"lec-sent-ko\">나비들은 자신의 날개들이 자신의 몸 위에 닫힌 채 쉬는 경향이 있는 반면, 나방들은 더 흔히 날개들의 윗면이 완전히 드러나는 상태로 쉰다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 두 번째 구별 방법을 제시하며 앞의 내용을 뒷받침합니다. with the upper sides of the wings on full view는 직역하면 날개 윗면이 시야에 꽉 찬다는 뜻으로, 곧 날개를 활짝 펴서 윗면 무늬가 훤히 보이게 둔다는 의미입니다. 앉아 있을 때 날개를 접어 올리는지 쫙 펴고 있는지로 둘을 나눌 수 있다는 설명입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to rest (to부정사(명사적)): tend의 목적어 자리에 쓰여 &#39;~하는 경향이 있다&#39;는 의미를 나타내는 명사적 용법이다.<\/div><div class=\"lec-gr-item\">with their wings held shut (분사구문): with + 명사(their wings) + 과거분사(held) 구조로 부대상황(동시동작)을 나타낸다. 원래 절인 while they are held shut 형태로 변환할 수 있다.<\/div><div class=\"lec-gr-item\">held (과거분사(형용사)): held가 their wings를 수식(= 접힌 채로 유지되는 날개). N + p.p. ≈ N that is/was p.p. (축약 관계절) 구조를 이룬다.<\/div><div class=\"lec-gr-item\">held shut 5형식(SVOC) 구조: hold는 목적어와 목적격 보어를 취하는 5형식 동사(기본구조: hold + O + C)이다. 여기서는 목적어가 with 뒤의 명사로 나가고 수동 관계의 분사형(held)으로 쓰이면서, 목적격 보어인 shut이 뒤에 그대로 남아 구조를 이룬다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">tend to<\/td><td class=\"m\">~하는 경향이 있다, ~하기 쉽다<\/td><\/tr><tr><td class=\"w\">on full view<\/td><td class=\"m\">완전히 다 보이는, 시야에 다 들어오는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Further distinctions <span class=\"grammar-hl\">can be made<\/span><\/b><\/span><span class=\"ko\">그 이상의 구별들이 가능하다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by <span class=\"grammar-hl\">looking<\/span> for a tiny hook<\/b><\/span><span class=\"ko\">아주 작은 갈고리를 찾아봄으로써<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that joins<\/span> fore- and hindwings,<\/b><\/span><span class=\"ko\">앞날개와 뒷날개를 연결해 주는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a feature only present in moths.<\/b><\/span><span class=\"ko\">나방들에게만 존재하는 특징인<\/span><\/div><\/div><div class=\"lec-sent-ko\">나방들에게만 존재하는 특징인, 앞날개와 뒷날개를 연결해 주는 아주 작은 갈고리를 찾아봄으로써 그 이상의 구별들이 가능하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 세 번째 구별 기준을 추가로 덧붙입니다. Further distinctions can be made — 글쓴이는 여기서 외형이나 자세 외에도 자세히 들여다볼 수 있는 또 다른 확인 방법이 있다는 점을 힘주어 말합니다. 앞뒤 날개를 묶어주는 미세한 구조물이 나방에게만 달려 있어 헷갈릴 때 확실한 기준이 된다는 뜻입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">can be made (수동태): 조동사(can) + be동사(be) + p.p.(made) 구조. make는 타동사(기본구조: make + O)인데, 뒤에 목적어가 없어서 수동구조 can be made 형태로 쓴다.<\/div><div class=\"lec-gr-item\">looking (동명사): 전치사 by의 목적어 역할을 하는 명사적 쓰임이다.<\/div><div class=\"lec-gr-item\">that joins (관계대명사): that은 주격 관계대명사로 선행사 a tiny hook을 수식하며, 뒤에 동사 joins가 이어지는 불완전한 절을 이끈다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">distinction<\/td><td class=\"m\">차이, 구별<\/td><\/tr><tr><td class=\"w\">look for<\/td><td class=\"m\">~을 찾다, ~을 구하다<\/td><\/tr><tr><td class=\"w\">feature<\/td><td class=\"m\">특징, 특성<\/td><\/tr><tr><td class=\"w\">present<\/td><td class=\"m\">존재하는, 있는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The stereotypical differences,<\/b><\/span><span class=\"ko\">정형화된 차이들은,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">with moths cast<\/span><\/b><\/span><span class=\"ko\">나방들이 묘사되는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as the gloomy, nocturnal cousins<\/b><\/span><span class=\"ko\">칙칙하고 야행성인 사촌으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>of colourful <span class=\"grammar-hl\">sun-loving<\/span> butterflies,<\/b><\/span><span class=\"ko\">색이 화려하고 해를 좋아하는 나비들의,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>are simply wrong.<\/b><\/span><span class=\"ko\">그야말로 잘못된 것이다<\/span><\/div><\/div><div class=\"lec-sent-ko\">색이 화려하고 해를 좋아하는 나비들의 칙칙하고 야행성인 사촌으로 나방들이 묘사되는 정형화된 차이들은 그야말로 잘못된 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 흐름이 전환되는 문장입니다. 앞서 겉모습의 차이를 설명했다면, 이제는 사람들이 두 곤충의 색깔이나 활동 시간대에 대해 흔히 가지는 편견을 정면으로 반박합니다. cast as는 &#39;~의 역할을 맡기다&#39;, 곧 사람들의 머릿속에 기정사실로 규정짓는다는 의미입니다. 나방은 칙칙하고 밤에만 다니며 나비는 화려하고 낮에만 다닌다는 널리 퍼진 생각이 사실과 다름을 꼬집습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">with moths cast (분사구문): with + 명사(moths) + 과거분사(cast) 구조로 부대상황을 나타내는 분사구문이다. 원래 절인 while they are cast as ... 형태로 변환할 수 있다.<\/div><div class=\"lec-gr-item\">cast (과거분사(형용사)): cast가 moths를 수식(= 묘사된 나방). N + p.p. ≈ N that is/was p.p. (축약 관계절) 구조로, 나방이 간주되는 수동 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">sun-loving (현재분사(형용사)): sun-loving이 뒤의 명사 butterflies를 수식(= 태양을 사랑하는 나비). -ing + N 구조로 능동의 의미로 명사를 꾸민다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stereotypical<\/td><td class=\"m\">틀에 박힌, 진부한<\/td><\/tr><tr><td class=\"w\">cast as<\/td><td class=\"m\">~로 묘사하다, ~로 간주하다<\/td><\/tr><tr><td class=\"w\">gloomy<\/td><td class=\"m\">우중충한, 우울한<\/td><\/tr><tr><td class=\"w\">nocturnal<\/td><td class=\"m\">야행성의, 밤의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>There are many brightly <span class=\"grammar-hl\">coloured<\/span> moths<\/b><\/span><span class=\"ko\">밝은색을 가진 나방들이 많이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and many<\/b><\/span><span class=\"ko\">그리고 많은 것들이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which are active<\/span><\/b><\/span><span class=\"ko\">활동적인<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>throughout the day.<\/b><\/span><span class=\"ko\">낮 동안 내내<\/span><\/div><\/div><div class=\"lec-sent-ko\">밝은색을 가진 나방들이 많고 낮 동안 내내 활동적인 나방들이 많이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 반박을 뒷받침하는 첫 번째 근거입니다. 나방에 대한 흔한 오해를 깨뜨리기 위해 자연계에는 나비처럼 화려한 무늬를 뽐내고 환한 대낮에 날아다니는 나방의 종류도 무수히 많다는 사실을 제시합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">coloured (과거분사(형용사)): coloured가 뒤의 명사 moths를 수식(= 색깔을 띤 나방). p.p. + N ≈ p.p.된 N 구조로 명사를 꾸민다.<\/div><div class=\"lec-gr-item\">which are active (관계대명사): which는 주격 관계대명사로 선행사인 대명사 many를 수식하며, 문장의 주어 역할을 하여 뒤에 동사 are가 이어진다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Equally,<\/b><\/span><span class=\"ko\">마찬가지로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>there are a few nocturnal butterflies<\/b><\/span><span class=\"ko\">야행성의 나비들이 몇몇 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and plenty<\/b><\/span><span class=\"ko\">그리고 많은 것들이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that come clothed<\/span><\/b><\/span><span class=\"ko\">띠는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in shades of brown and grey.<\/b><\/span><span class=\"ko\">갈색과 회색조를<\/span><\/div><\/div><div class=\"lec-sent-ko\">마찬가지로, 야행성의 나비들이 몇몇 있고, 갈색과 회색조를 띠는 것들이 많이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 나방에 대한 반증에 이어 나비에 대한 고정관념도 깨뜨립니다. come clothed in은 동물이 특정한 색이나 무늬로 덮여 있는 모습을 비유적으로 나타낸 것입니다. 어두운 밤에 주로 날아다니거나 칙칙한 흙빛을 가진 나비도 얼마든지 있다는 점을 보여주어, 둘을 색깔이나 활동 시간만으로 칼같이 나눌 수 없음을 증명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that come clothed (관계대명사): that은 주격 관계대명사로 앞의 대명사 plenty를 선행사로 받아 수식하며, 주어 역할을 한다.<\/div><div class=\"lec-gr-item\">clothed (과거분사(형용사)): clothed가 주격 관계대명사 that(선행사 plenty)의 상태를 설명하는 보어 역할을 하며, 옷을 입은(색으로 덮인) 수동의 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">nocturnal<\/td><td class=\"m\">야행성의, 밤의<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">It’s more sensible<\/span><\/b><\/span><span class=\"ko\">더 합리적이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to think<\/span> of them together;<\/b><\/span><span class=\"ko\">그들을 함께 묶어 생각하는 것이;<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>both butterflies and moths are beautiful and <span class=\"grammar-hl\">fascinating<\/span> insects.<\/b><\/span><span class=\"ko\">나비와 나방 둘 다 아름답고 매혹적인 곤충이다<\/span><\/div><\/div><div class=\"lec-sent-ko\">그들을 함께 묶어 생각하는 것이 더 합리적이다. 나비‘와’ 나방 둘 다 아름답고 매혹적인 곤충이기 때문이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 글의 최종 결론입니다. 겉모습에 몇 가지 차이가 있기는 해도 통념처럼 극단적으로 다른 존재들이 아니므로, 굳이 선을 긋고 차별하기보다는 같은 무리의 흥미로운 생물들로 함께 바라보는 것이 합리적이라는 글쓴이의 주장을 담고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It’s more sensible to think (가주어): 진주어: It은 형식상의 주어(가주어)이고, to think 이하가 문장의 진짜 주어(진주어) 역할을 하는 구조이다.<\/div><div class=\"lec-gr-item\">to think (to부정사(명사적)): It is ... to V 구문에서 진주어 자리에 쓰인 명사적 용법이다.<\/div><div class=\"lec-gr-item\">fascinating (현재분사(형용사)): fascinating이 뒤의 명사 insects를 수식(= 매혹적인 곤충). -ing + N 구조로 능동의 의미로 명사를 꾸민다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sensible<\/td><td class=\"m\">합리적인, 분별 있는<\/td><\/tr><tr><td class=\"w\">fascinating<\/td><td class=\"m\">대단히 흥미로운, 매력적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>더듬이 생김새나 쉴 때 날개를 접는 방식 등 나비와 나방의 외형을 구별하는 몇 가지 방법이 있다.<\/li><li>그러나 나비는 화려하고 낮에 활동하며, 나방은 칙칙하고 밤에 활동한다는 사람들의 편견은 사실과 다르다.<\/li><li>실제로는 대낮에 활동하는 화려한 나방도 많고, 밤에 날아다니는 칙칙한 색깔의 나비도 흔하게 존재한다.<\/li><li>따라서 이들을 극단적으로 나누기보다는 모두 아름답고 매력적인 곤충 무리로 묶어서 생각하는 것이 타당하다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">While there are physical rules to distinguish moths from butterflies, their stereotypical differences regarding colors and habits are largely incorrect.<\/div>\n              <div class=\"lec-final-sum-ko\">나방과 나비를 구별하는 신체적인 규칙들이 존재하는 반면에, 색깔과 습성에 관한 고정관념적인 차이는 대체로 부정확하다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./37_audio/1.mp3","hl":null}],[{"audio":"./37_audio/2.mp3","hl":null}],[{"audio":"./37_audio/3.mp3","hl":null},{"audio":"./37_audio/4.mp3","hl":"st  생태에 대한 편견","items":["나방은 어둡고 야행성인 반면 나비는 화려하고 주행성이라는 고정관념은 사실이 아니다.","밝고 화려하며 낮에 활동하는 나방(moths)도 많음","어두운색을 띠고 야행성(nocturnal)인 나비도 존재함","색과 활동 시간에 대한 잘못된 고정관념(stereotypical differences)을 지적함"]},{"label":"04두 곤충에 대한 올바른 인식","items":["두 곤충을 극단적으로 대비시키기보다는 함께 아울러서 생각하는 것이 합리적이다.","나방과 나비 모두 아름답고 흥미로운 곤충(fascinating insects)임","편견을 버리고 이들을 함께(together) 묶어서 인식하는 태도가 필요함"]}],"bkg":"나비와 나방은 생물학적으로 같은 나비목(Lepidoptera)에 속하는 가까운 친척이라서 겉모습만으로 완벽하게 구분하기가 쉽지 않답니다. 이 둘을 구별하려면 곤충의 핵심 감각 기관인 더듬이(Antennae)의 끝부분 모양이나 쉴 때 날개(Wings)를 두는 방식을 관찰하는 것이 좋은데, 이는 마치 우리가 사람을 구별할 때 그 사람 특유의 머리 스타일이나 평소 서 있는 자세를 유심히 살펴보는 것과 비슷하죠. 특히 나방에게만 존재하는 앞날개와 뒷날개를 연결해 주는 작은 갈고리(Hook)는 비행 시 두 날개가 퍼즐 조각처럼 단단히 맞물려 효율적으로 움직이게 돕는 아주 중요한 해부학적 구조입니다. 더불어 우리는 흔히 나비는 낮에 활동하는 화려한 주행성(Diurnal)이고 나방은 밤에 활동하는 우울한 야행성(Nocturnal) 곤충이라는 고정관념을 품기 쉽습니다. 하지만 실제 생태계에는 낮에 날아다니는 화려한 나방이나 밤에 활동하는 칙칙한 나비 등 예외적인 생태적 다양성(Ecological diversity)이 훨씬 많다는 사실을 미리 알아두시면 이 지문을 한층 더 입체적이고 흥미롭게 이해하실 수 있을 거예요.","ttsText":"나비와 나방은 생물학적으로 같은 나비목(Lepidoptera)에 속하는 가까운 친척이라서 겉모습만으로 완벽하게 구분하기가 쉽지 않답니다. 이 둘을 구별하려면 곤충의 핵심 감각 기관인 더듬이(Antennae)의 끝부분 모양이나 쉴 때 날개(Wings)를 두는 방식을 관찰하는 것이 좋은데, 이는 마치 우리가 사람을 구별할 때 그 사람 특유의 머리 스타일이나 평소 서 있는 자세를 유심히 살펴보는 것과 비슷하죠. 특히 나방에게만 존재하는 앞날개와 뒷날개를 연결해 주는 작은 갈고리(Hook)는 비행 시 두 날개가 퍼즐 조각처럼 단단히 맞물려 효율적으로 움직이게 돕는 아주 중요한 해부학적 구조입니다. 더불어 우리는 흔히 나비는 낮에 활동하는 화려한 주행성(Diurnal)이고 나방은 밤에 활동하는 우울한 야행성(Nocturnal) 곤충이라는 고정관념을 품기 쉽습니다. 하지만 실제 생태계에는 낮에 날아다니는 화려한 나방이나 밤에 활동하는 칙칙한 나비 등 예외적인 생태적 다양성(Ecological diversity)이 훨씬 많다는 사실을 미리 알아두시면 이 지문을 한층 더 입체적이고 흥미롭게 이해하실 수 있을 거예요.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 37번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 37번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고2 / 2025년 / 10월 / 37번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고2 / 2025년 / 10월 / 37번","titleEn":"Moths and Butterflies: Beyond Outward Appearances and Stereotypes","titleKo":"나방과 나비: 겉모습과 고정관념을 넘어서","imageUrl":"__enpImg__","stages":[{"label":"01외형적 특징을 통한 구분","items":["나방과 나비는 외형적인
