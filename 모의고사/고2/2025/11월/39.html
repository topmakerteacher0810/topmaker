이나 가전제품이 일정 기간이 지나면 귀신같이 고장 나거나 구형이 되어 어쩔 수 없이 새로 사야만 했던 경험이 다들 한 번쯤 있으실 텐데요, 이는 기업이 의도적으로 제품의 수명을 단축해 지속적인 소비를 유도하는 계획적 구식화(Planned Obsolescence)라는 개념과 깊은 관련이 있습니다. 전통적인 산업 구조에서는 이렇게 물건이 버려지고 새것으로 대체되는 과정이 경제를 굴리는 필수 원동력으로 여겨졌지만, 최근에는 정수기 렌탈이나 자동차 공유 서비스처럼 물건을 &#39;소유&#39;하는 대신 빌려 쓰는 서비스형 제품(Products as a Service) 모델이 새로운 대안으로 떠오르고 있어요. 이러한 변화는 자원을 단순히 쓰고 버리는 것이 아니라 수리 및 재제조를 통해 끝없이 활용하는 순환 경제(Circular Economy) 이론에 바탕을 두고 있으며, 이 모델 안에서 기업은 제품 판매가 아닌 유지보수(Maintenance) 서비스를 통해 새로운 수익을 창출하게 됩니다. 따라서 이 지문을 읽으실 때는 단순한 환경 보호나 쓰레기 문제를 넘어서, 제품의 소유권이 소비자에서 기업으로 넘어갈 때 제품의 수명과 비즈니스 모델이 어떻게 긍정적으로 변화하는지에 초점을 맞추시면 글의 맥락을 훨씬 더 깊이 있게 이해하실 수 있을 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01전통적 경제와 폐기물<\/div><ul><li>역사적으로 폐기물은 경제를 이끄는 필수적인 원동력으로 여겨졌습니다.<\/li><li>매출(sales)은 제품의 공급 및 수요(demand)에 직결됨<\/li><li>제품이 결국 버려지도록 설계하여 지속적인 수요를 확보함<\/li><li>핵심 키워드: 원동력(driver)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02폐기를 유도하는 제품 설계<\/div><ul><li>기업들은 필연적인 폐기를 유도하기 위해 다양한 설계 전략을 도입했습니다.<\/li><li>계획적 구식화(planned obsolescence) 및 저렴한 소재(cheap materials) 사용<\/li><li>수리 도구에 대한 접근 제한<\/li><li>소비자가 결국 대체품(replacement)을 구매하도록 유도함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03새로운 패러다임의 등장<\/div><ul><li>폐기물 제거를 우선시하면 서비스로서의 제품이라는 새로운 수요가 창출됩니다.<\/li><li>수리와 재제조(remanufacturing)를 통한 폐기물 제거(elimination of waste)<\/li><li>전통적 관점의 지지자들은 이 새로운 수요 창출 방식을 깨닫지 못함<\/li><li>핵심 개념: 서비스형 제품(products as a service)<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04소유권 전환과 이윤 유지<\/div><ul><li>기업은 제품을 판매하는 대신 임대하고 유지보수 서비스를 제공하여 이윤을 유지합니다.<\/li><li>판매 대신 제품 임대(lease)를 통한 소유권 전환(transition of ownership)<\/li><li>유지보수 및 수리(maintenance and repair) 서비스로 이윤 창출<\/li><li>오래 지속되는 제품(long-lasting products)의 개발을 장려함<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">driver<\/td><td class=\"m\">원동력, 동인<\/td><\/tr><tr><td class=\"w\">be tied to<\/td><td class=\"m\">~에 결부되다, ~와 관련되다<\/td><\/tr><tr><td class=\"w\">be dependent on<\/td><td class=\"m\">~에 의존하다, ~에 좌우되다<\/td><\/tr><tr><td class=\"w\">sustain<\/td><td class=\"m\">지속시키다, 유지하다<\/td><\/tr><tr><td class=\"w\">incorporate<\/td><td class=\"m\">통합하다, 포함시키다<\/td><\/tr><tr><td class=\"w\">inevitable<\/td><td class=\"m\">불가피한, 필연적인<\/td><\/tr><tr><td class=\"w\">planned obsolescence<\/td><td class=\"m\">계획적 구식화<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">replacement<\/td><td class=\"m\">대체품, 교환물<\/td><\/tr><tr><td class=\"w\">prioritize<\/td><td class=\"m\">우선시하다, 우선순위를 매기다<\/td><\/tr><tr><td class=\"w\">elimination<\/td><td class=\"m\">제거, 배제<\/td><\/tr><tr><td class=\"w\">lease out<\/td><td class=\"m\">~을 임대하다, 대여하다<\/td><\/tr><tr><td class=\"w\">transition<\/td><td class=\"m\">전환, 이행<\/td><\/tr><tr><td class=\"w\">maintenance<\/td><td class=\"m\">유지보수, 관리<\/td><\/tr><tr><td class=\"w\">long-lasting<\/td><td class=\"m\">오래 지속되는, 내구성이 있는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Waste <span class=\"grammar-hl\">has historically been seen<\/span><\/b><\/span><span class=\"ko\">폐기는 역사적으로 여겨져 왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">as<\/span> a necessary driver of the economy.<\/b><\/span><span class=\"ko\">경제의 필수적인 동인으로<\/span><\/div><\/div><div class=\"lec-sent-ko\">폐기는 역사적으로 경제의 필수적인 동인으로 여겨져 왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이 글의 도입부로, 과거부터 경제 체제에서 쓰레기(낭비)를 어떤 시각으로 바라보았는지 제시합니다. a necessary driver는 쓰레기가 버려져야만 새로운 물건을 사게 되어 경제가 돌아간다고 믿었던 기존의 통념을 보여 주는 표현입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">has historically been seen as (수동태): be동사(been) + p.p.(seen) 구조. see는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 been seen 형태로 쓴다. 기본구조: see A as B (A를 B로 보다/간주하다).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">driver<\/td><td class=\"m\">원동력, 동인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Sales <span class=\"grammar-hl\">are tied<\/span><\/b><\/span><span class=\"ko\">판매량은 결부된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to<\/span> the amount of a product <span class=\"grammar-hl\">supplied<\/span>,<\/b><\/span><span class=\"ko\">어떤 제품의 공급량에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">which<\/span> is directly dependent<\/b><\/span><span class=\"ko\">그리고 그것은 직접적으로 의존한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>on the demand for that product.<\/b><\/span><span class=\"ko\">그 제품에 대한 수요량에<\/span><\/div><\/div><div class=\"lec-sent-ko\">판매량은 어떤 제품의 공급량에 결부되고, 그것은 그 제품에 대한 수요량에 직접적으로 의존한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장에서 쓰레기가 경제의 원동력이라는 통념의 이유를 논리적으로 뒷받침합니다. 기업의 매출을 올리려면 제품 공급이 많아야 하고, 공급은 결국 소비자가 물건을 사려는 수요가 있어야만 가능하다는 기본적인 경제 원리를 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are tied to (수동태): be동사(are) + p.p.(tied) 구조. tie는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are tied 형태로 쓴다. 기본구조: tie A to B (A를 B에 묶다/결부시키다).<\/div><div class=\"lec-gr-item\">supplied (과거분사(형용사)): supplied가 명사 product를 수식(= 공급된 제품). N + p.p. 형태의 수식 구조다.<\/div><div class=\"lec-gr-item\">which (관계대명사): 주격 관계대명사 계속적 용법으로 쓰여, 앞의 구(the amount of a product supplied)를 부연 설명한다. 뒤에 주어가 빠진 완전하지 않은 절이 온다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be tied to<\/td><td class=\"m\">~에 결부되다, ~와 관련되다<\/td><\/tr><tr><td class=\"w\">be dependent on<\/td><td class=\"m\">~에 의존하다, ~에 좌우되다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Therefore,<\/b><\/span><span class=\"ko\">따라서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>if you design the product<\/b><\/span><span class=\"ko\">만약 여러분이 그 제품을 설계한다면<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to eventually be wasted<\/span>,<\/b><\/span><span class=\"ko\">결국에는 폐기되도록,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>you can ensure<\/b><\/span><span class=\"ko\">여러분은 보장할 수 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that the demand for more products <span class=\"grammar-hl\">will be sustained<\/span>.<\/b><\/span><span class=\"ko\">더 많은 제품에 대한 수요량이 지속될 것을<\/span><\/div><\/div><div class=\"lec-sent-ko\">따라서, 만약 여러분이 그 제품을 결국에는 폐기되도록 설계한다면, 여러분은 더 많은 제품에 대한 수요량이 지속될 것을 보장할 수 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 수요 원리를 바탕으로 도출된 과거 기업들의 판단입니다. 소비자가 물건을 계속 사게 만들려면 애초에 물건이 일정 기간 후 고장 나거나 버려지게끔 만들어, 끊임없는 신규 수요를 창출해 내는 방식을 택했음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to eventually be wasted (to부정사(목적격보어)): design + 목적어 + to V(5형식) 구조에서 목적격보어로 쓰였다. 내부는 be동사(be) + p.p.(wasted)의 수동태 구조로, waste는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 be wasted 형태로 쓴다. 기본구조: waste + O(목적어).<\/div><div class=\"lec-gr-item\">will be sustained (수동태): be동사(be) + p.p.(sustained) 구조. sustain은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 be sustained 형태로 쓴다. 기본구조: sustain + O(목적어).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">sustain<\/td><td class=\"m\">지속시키다, 유지하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Many strategies <span class=\"grammar-hl\">have been incorporated<\/span><\/b><\/span><span class=\"ko\">많은 전략들은 포함되어 왔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">into<\/span> product design and use<\/b><\/span><span class=\"ko\">제품 설계와 사용에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to ensure<\/span><\/b><\/span><span class=\"ko\">보장하기 위해서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that waste is inevitable,<\/b><\/span><span class=\"ko\">폐기가 불가피하다는 것을,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>such as <span class=\"grammar-hl\">planned<\/span> obsolescence, <span class=\"grammar-hl\">limited<\/span> access to tools for repairs, and use of cheap materials.<\/b><\/span><span class=\"ko\">계획적 노후화, 수리 도구들에 대한 제한된 접근, 그리고 저렴한 자재들의 사용과 같은<\/span><\/div><\/div><div class=\"lec-sent-ko\">계획적 노후화, 수리 도구들에 대한 제한된 접근, 그리고 저렴한 자재들의 사용과 같은 많은 전략들은 폐기가 불가피하다는 것을 보장하기 위해서 제품 설계와 사용에 포함되어 왔다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 바로 앞 문장에서 언급한 &#39;버려지도록 설계하는&#39; 구체적인 방법들을 예시로 나열합니다. planned obsolescence는 일정 시간이 지나면 제품 성능이 떨어지거나 유행에 뒤처지게 의도적으로 기획하는 산업 관행을 가리킵니다. 고치기 힘들게 만들거나 금방 망가지는 재료를 쓰는 등 제품의 수명을 인위적으로 단축하는 모든 수단을 말합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">have been incorporated into (수동태): be동사(been) + p.p.(incorporated) 구조. incorporate는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 been incorporated 형태로 쓴다. 기본구조: incorporate A into B (A를 B에 통합시키다).<\/div><div class=\"lec-gr-item\">to ensure (to부정사(부사적): 목적): in order to ensure로 바꿔도 뜻이 같으며, &#39;~을 확실하게 하기 위해&#39;라는 목적을 나타낸다.<\/div><div class=\"lec-gr-item\">planned (과거분사(형용사)): planned가 명사 obsolescence를 수식(= 계획된 진부화). p.p. + N 형태의 수식 구조다.<\/div><div class=\"lec-gr-item\">limited (과거분사(형용사)): limited가 명사 access를 수식(= 제한된 접근). p.p. + N 형태의 수식 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">incorporate<\/td><td class=\"m\">통합하다, 포함시키다<\/td><\/tr><tr><td class=\"w\">inevitable<\/td><td class=\"m\">불가피한, 필연적인<\/td><\/tr><tr><td class=\"w\">planned obsolescence<\/td><td class=\"m\">계획적 구식화<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>All these strategies ensure<\/b><\/span><span class=\"ko\">이 모든 전략들은 보장한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that the consumer will have <span class=\"grammar-hl\">limited<\/span> access<\/b><\/span><span class=\"ko\">소비자가 제한된 접근을 하게 될 것이고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to the product in use<\/b><\/span><span class=\"ko\">사용 중인 제품에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and will eventually require a replacement.<\/b><\/span><span class=\"ko\">결국에는 교체를 필요로 할 것을<\/span><\/div><\/div><div class=\"lec-sent-ko\">이 모든 전략들은 소비자가 사용 중인 제품에 제한된 접근을 하게 될 것이고 결국에는 교체를 필요로 할 것을 보장한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 4번 문장에서 나열한 수명 단축 전략들의 궁극적인 결과입니다. 소비자는 자신의 물건이라도 오래 쓰거나 마음대로 고쳐 쓰지 못하게 되며, 결국 쓰던 것을 버리고 새 물건을 다시 사야만 하는 상황으로 내몰린다는 점을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">limited (과거분사(형용사)): limited가 명사 access를 수식(= 제한된 접근). p.p. + N 형태의 수식 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">replacement<\/td><td class=\"m\">대체품, 교환물<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Those<\/b><\/span><span class=\"ko\">사람들은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">who<\/span> supported <span class=\"grammar-hl\">the idea<\/span><\/b><\/span><span class=\"ko\">생각을 지지했던<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that waste is necessary<\/span><\/b><\/span><span class=\"ko\">폐기가 필수적이라는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to drive<\/span> demand<\/b><\/span><span class=\"ko\">수요를 촉진하는 데<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>failed <span class=\"grammar-hl\">to realize<\/span><\/b><\/span><span class=\"ko\">깨닫는 데 실패했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that <span class=\"grammar-hl\">prioritizing<\/span> the elimination of waste via repair and remanufacturing<\/b><\/span><span class=\"ko\">수리와 재제조를 통해 폐기의 제거를 우선시하는 것이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>creates a different kind of demand: products as a service.<\/b><\/span><span class=\"ko\">서비스로서의 상품이라는 다른 종류의 수요를 창출한다는 것을<\/span><\/div><\/div><div class=\"lec-sent-ko\">폐기가 수요를 촉진하는 데 필수적이라는 생각을 지지했던 사람들은 수리와 재제조를 통해 폐기의 제거를 우선시하는 것이 서비스로서의 상품이라는 다른 종류의 수요를 창출한다는 것을 깨닫는 데 실패했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 흐름이 크게 전환되는 문장으로, 기존 통념의 한계를 지적하며 새로운 대안을 제시합니다. 물건이 버려져야만 돈을 번다고 믿었던 기업들은, 오히려 물건을 오래 쓰게 고쳐 주고 다시 만들어 주는 과정에서 새로운 시장이 열린다는 점을 놓쳤음을 지적합니다. products as a service는 소비자가 물건을 소유하는 대신 사용하는 동안의 기능과 혜택만을 대여받는 비즈니스 모델을 가리킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">who (관계대명사): 주격 관계대명사로 선행사 Those를 수식한다. 뒤에 주어가 빠진 불완전한 절이 온다.<\/div><div class=\"lec-gr-item\">the idea that waste is necessary 동격의 that: 명사(idea) + that + S + V 형태로, 뒤 that절이 앞 명사의 내용을 구체화/설명하는 동격 구조다.<\/div><div class=\"lec-gr-item\">to drive (to부정사(부사적): 형용사 수식): to V 바로 앞이 형용사(necessary)이므로 부사적(형용사 수식) 용법으로 쓰여 형용사를 꾸며준다.<\/div><div class=\"lec-gr-item\">to realize (to부정사(명사적)): 동사 fail의 목적어 자리(fail to V)에 쓰여 명사적 역할을 한다.<\/div><div class=\"lec-gr-item\">prioritizing (동명사): 명사적 역할로 쓰여 that절 안에서 주어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">prioritize<\/td><td class=\"m\">우선시하다, 우선순위를 매기다<\/td><\/tr><tr><td class=\"w\">elimination<\/td><td class=\"m\">제거, 배제<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Through this setup,<\/b><\/span><span class=\"ko\">이러한 구조를 통해,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>companies simply lease out products<\/b><\/span><span class=\"ko\">기업들은 단순히 제품들을 임대한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> <span class=\"grammar-hl\">were once sold<\/span> directly to the customer.<\/b><\/span><span class=\"ko\">한때 소비자에게 직접적으로 판매되었던<\/span><\/div><\/div><div class=\"lec-sent-ko\">이러한 구조를 통해 기업들은 한때 소비자에게 직접적으로 판매되었던 제품들을 단순히 임대한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 6번 문장에서 소개한 &#39;서비스로서의 제품&#39;이 실제로 어떻게 작동하는지 구체적으로 설명합니다. 과거에는 물건의 소유권을 고객에게 완전히 넘겼다면, 이제는 기업이 물건의 소유권을 가진 채 고객에게 빌려주고 사용료를 받는 방식으로 거래 형태가 바뀌었음을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that (관계대명사): 주격 관계대명사로 선행사 products를 수식한다. 뒤에 주어가 빠진 불완전한 절이 온다.<\/div><div class=\"lec-gr-item\">were once sold (수동태): be동사(were) + p.p.(sold) 구조. sell은 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 were sold 형태로 쓴다. 기본구조: sell + O(목적어) + to B.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lease out<\/td><td class=\"m\">~을 임대하다, 대여하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 8<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>With this transition of ownership,<\/b><\/span><span class=\"ko\">이러한 소유권의 이전으로,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>companies maintain profit<\/b><\/span><span class=\"ko\">기업들은 수익을 유지하고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by <span class=\"grammar-hl\">offering<\/span> maintenance and repair services<\/b><\/span><span class=\"ko\">유지와 수리 서비스들을 제공함으로써<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and <span class=\"grammar-hl\">are encouraged<\/span><\/b><\/span><span class=\"ko\">장려된다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to develop<\/span> long-<span class=\"grammar-hl\">lasting<\/span> products.<\/b><\/span><span class=\"ko\">더 오래 지속되는 제품들을 개발하도록<\/span><\/div><\/div><div class=\"lec-sent-ko\">이러한 소유권의 이전으로 기업들은 유지와 수리 서비스들을 제공함으로써 수익을 유지하고 더 오래 지속되는 제품들을 개발하도록 장려된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 제품 대여 방식으로 인해 기업과 환경 모두에 긍정적인 변화가 일어남을 보여주는 결론입니다. 기업은 더 이상 새 물건을 계속 팔아서 돈을 버는 것이 아니라 물건을 관리해 주며 수익을 얻기 때문에, 애초에 고장이 덜 나고 수명이 긴 튼튼한 제품을 만들 유인이 생겼음을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">offering (동명사): 명사적 역할로 쓰여 전치사 by의 목적어 역할을 한다.<\/div><div class=\"lec-gr-item\">are encouraged to develop 수동태 및 목적격보어(to부정사): be동사(are) + p.p.(encouraged) 구조. encourage는 타동사(목적어를 취하는 동사)인데, 뒤에 목적어가 없어서 수동구조 are encouraged 형태로 쓴다. 기본구조: encourage + O(목적어) + to V(5형식). 목적어가 주어로 올라가 수동구조가 되고 목적격보어였던 to develop은 뒤에 그대로 남는다.<\/div><div class=\"lec-gr-item\">lasting (현재분사(형용사)): lasting이 명사 products를 수식(= 지속되는 제품). -ing + N 형태의 수식 구조다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">transition<\/td><td class=\"m\">전환, 이행<\/td><\/tr><tr><td class=\"w\">maintenance<\/td><td class=\"m\">유지보수, 관리<\/td><\/tr><tr><td class=\"w\">long-lasting<\/td><td class=\"m\">오래 지속되는, 내구성이 있는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>과거에는 물건이 빨리 버려져야 새 물건을 팔아 경제가 돌아간다고 믿었다.<\/li><li>그래서 기업들은 의도적으로 물건의 수명을 짧게 만들고 수리하기 어렵게 설계했다.<\/li><li>하지만 오늘날에는 물건을 판매하는 대신 대여해 주는 &#39;서비스로서의 제품&#39;이라는 새로운 비즈니스 모델이 등장했다.<\/li><li>이제 기업은 소유권을 유지한 채 수리 및 관리로 수익을 내므로, 오히려 튼튼하고 오래가는 물건을 만들게 되었다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Businesses historically relied on intentional product waste to drive economic demand, but they are now shifting toward a service-based model focusing on maintenance and longevity.<\/div>\n              <div class=\"lec-final-sum-ko\">기업들은 역사적으로 경제적 수요를 촉진하기 위해 의도적인 제품 폐기에 의존했지만, 현재는 유지보수와 수명 연장에 중점을 둔 서비스 기반 모델로 전환하고 있다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./39_audio/1.mp3","hl":null}],[{"audio":"./39_audio/2.mp3","hl":null}],[{"audio":"./39_audio/3.mp3","hl":null},{"audio":"./39_audio/4.mp3","hl":"stage-0"},{"audio":"./39_audio/5.mp3","hl":"stage-1"},{"audio":"./39_audio/6.mp3","hl":"stage-2"},{"audio":"./39_audio/7.mp3","hl":"stage-3"}],[{"audio":"./39_audio/8.mp3","hl":null}],[{"audio":"./39_audio/9.mp3","hl":"main"},{"audio":"./39_audio/10.mp3","hl":"meaning"},{"audio":"./39_audio/11.mp3","hl":"grammar"}],[{"audio":"./39_audio/12.mp3","hl":"main"},{"audio":"./39_audio/13.mp3","hl":"meaning"},{"audio":"./39_audio/14.mp3","hl":"grammar"}],[{"audio":"./39_audio/15.mp3","hl":"main"},{"audio":"./39_audio/16.mp3","hl":"meaning"},{"audio":"./39_audio/17.mp3","hl":"grammar"}],[{"audio":"./39_audio/18.mp3","hl":"main"},{"audio":"./39_audio/19.mp3","hl":"meaning"},{"audio":"./39_audio/20.mp3","hl":"grammar"}],[{"audio":"./39_audio/21.mp3","hl":"main"},{"audio":"./39_audio/22.mp3","hl":"meaning"},{"audio":"./39_audio/23.mp3","hl":"grammar"}],[{"audio":"./39_audio/24.mp3","hl":"main"},{"audio":"./39_audio/25.mp3","hl":"meaning"},{"audio":"./39_audio/26.mp3","hl":"grammar"}],[{"audio":"./39_audio/27.mp3","hl":"main"},{"audio":"./39_audio/28.mp3","hl":"meaning"},{"audio":"./39_audio/29.mp3","hl":"grammar"}],[{"audio":"./39_audio/30.mp3","hl":"main"},{"audio":"./39_audio/31.mp3","hl":"meaning"},{"audio":"./39_audio/32.mp3","hl":"grammar"}],[{"audio":"./39_audio/33.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_39번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 39번","titleEn":"From Waste to Service: A New Economic Paradigm for Products","titleKo":"폐기물에서 서비스로: 제품에 대한 새로운 경제 패러다임","imageUrl":"__enpImg__","stages":[{"label":"01전통적 경제와 폐기물","items":["역사적으로 폐기물은 경제를 이끄는 필수적인 원동력으로 여겨졌습니다.","매출(sales)은 제품의 공급 및 수요(demand)에 직결됨","제품이 결국 버려지도록 설계하여 지속적인 수요를 확보함","핵심 키워드: 원동력(driver)"]},{"label":"02폐기를 유도하는 제품 설계","items":["기업들은 필연적인 폐기를 유도하기 위해 다양한 설계 전략을 도입했습니다.","계획적 구식화(planned obsolescence) 및 저렴한 소재(cheap materials) 사용","수리 도구에 대한 접근 제한","소비자가 결국 대체품(replacement)을 구매하도록 유도함"]},{"label":"03새로운 패러다임의 등장","items":["폐기물 제거를 우선시하면 서비스로서의 제품이라는 새로운 수요가 창출됩니다.","수리와 재제조(remanufacturing)를 통한 폐기물 제거(elimination of waste)","전통적 관점의 지지자들은 이 새로운 수요 창출 방식을 깨닫지 못함","핵심 개념: 서비스형 제품(products as a service)"]},{"label":"04소유권 전환과 이윤 유지","items":["기업은 제품을 판매하는 대신 임대하고 유지보수 서비스를 제공하여 이윤을 유지합니다.","판매 대신 제품 임대(lease)를 통한 소유권 전환(transition of ownership)","유지보수 및 수리(maintenance and repair) 서비스로 이윤 창출","오래 지속되는 제품(long-lasting products)의 개발을 장려함"]}],"bkg":"우리가 매일 쓰는 스마트폰이나 가전제품이 일정 기간이 지나면 귀신같이 고장 나거나 구형이 되어 어쩔 수 없이 새로 사야만 했던 경험이 다들 한 번쯤 있으실 텐데요, 이는 기업이 의도적으로 제품의 수명을 단축해 지속적인 소비를 유도하는 계획적 구식화(Planned Obsolescence)라는 개념과 깊은 관련이 있습니다. 전통적인 산업 구조에서는 이렇게 물건이 버려지고 새것으로 대체되는 과정이 경제를 굴리는 필수 원동력으로 여겨졌지만, 최근에는 정수기 렌탈이나 자동차 공유 서비스처럼 물건을 '소유'하는 대신 빌려 쓰는 서비스형 제품(Products as a Service) 모델이 새로운 대안으로 떠오르고 있어요. 이러한 변화는 자원을 단순히 쓰고 버리는 것이 아니라 수리 및 재제조를 통해 끝없이 활용하는 순환 경제(Circular Economy) 이론에 바탕을 두고 있으며, 이 모델 안에서 기업은 제품 판매가 아닌 유지보수(Maintenance) 서비스를 통해 새로운 수익을 창출하게 됩니다. 따라서 이 지문을 읽으실 때는 단순한 환경 보호나 쓰레기 문제를 넘어서, 제품의 소유권이 소비자에서 기업으로 넘어갈 때 제품의 수명과 비즈니스 모델이 어떻게 긍정적으로 변화하는지에 초점을 맞추시면 글의 맥락을 훨씬 더 깊이 있게 이해하실 수 있을 거예요.","ttsText":"우리가 매일 쓰는 스마트폰이나 가전제품이 일정 기간이 지나면 귀신같이 고장 나거나 구형이 되어 어쩔 수 없이 새로 사야만 했던 경험이 다들 한 번쯤 있으실 텐데요, 이는 기업이 의도적으로 제품의 수명을 단축해 지속적인 소비를 유도하는 계획적 구식화(Planned Obsolescence)라는 개념과 깊은 관련이 있습니다. 전통적인 산업 구조에서는 이렇게 물건이 버려지고 새것으로 대체되는 과정이 경제를 굴리는 필수 원동력으로 여겨졌지만, 최근에는 정수기 렌탈이나 자동차 공유 서비스처럼 물건을 '소유'하는 대신 빌려 쓰는 서비스형 제품(Products as a Service) 모델이 새로운 대안으로 떠오르고 있어요. 이러한 변화는 자원을 단순히 쓰고 버리는 것이 아니라 수리 및 재제조를 통해 끝없이 활용하는 순환 경제(Circular Economy) 이론에 바탕을 두고 있으며, 이 모델 안에서 기업은 제품 판매가 아닌 유지보수(Maintenance) 서비스를 통해 새로운 수익을 창출하게 됩니다. 따라서 이 지문을 읽으실 때는 단순한 환경 보호나 쓰레기 문제를 넘어서, 제품의 소유권이 소비자에서 기업으로 넘어갈 때 제품의 수명과 비즈니스 모델이 어떻게 긍정적으로 변화하는지에 초점을 맞추시면 글의 맥락을 훨씬 더 깊이 있게 이해하실 수 있을 거예요.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 39번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 39번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고2 / 2025년 / 10월 / 39번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고2 / 2025년 / 10월 / 39번","titleEn":"From Waste to Service: A New Economic Paradigm for Products","titleKo":"폐기물에서 서비스로: 제품에 대한 새로운 경제 패러다임","imageUrl":"__enpImg__","stages":[{"label":"01전통적 경제와 폐기물","i
