al Contrast)를 통해 극적인 심리적 안정감을 느끼게 됩니다. 이 지문은 단순한 길 잃음의 묘사를 넘어, 인간이 위기 상황에서 절망(Despair)과 안도(Relief) 사이를 오갈 때 나타나는 심리적, 생리적 변화를 생생하게 보여주고 있습니다. 주인공이 시각을 잃은 패닉 상태에서 어떻게 후각과 미세한 시각적 단서에 의존해 심리적 구원을 얻게 되는지 이러한 개념들을 떠올리며 읽어보시면 훨씬 더 깊이 있게 몰입하실 수 있을 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01숲에서의 조난<\/div><ul><li>집으로 향하던 중 갑자기 빛이 전혀 없는 어둠에 갇히게 된다.<\/li><li>집으로 가는 숲길(forest road)로 향함<\/li><li>갑자기 빛이 없는 검은 숲(black forest)에 홀로 남겨짐<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02절망과 부상<\/div><ul><li>길을 잃고 헤매다 상처를 입고 깊은 절망감에 빠진다.<\/li><li>길을 잃은 채 비틀거리며 언덕에서 넘어짐(stumbled)<\/li><li>다쳐서 나무에 기댄 채 극심한 절망(desperation)을 느낌<\/li><li>누군가 자신의 부재를 알아챌지 두려워함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03희망의 단서<\/div><ul><li>절망적인 순간에 어둠 속에서 요리 냄새와 불빛을 발견한다.<\/li><li>어둠 속에서 희미한 요리 냄새(scent of cooking)를 맡음<\/li><li>냄새를 따라가 숲속에서 노란 불빛(yellowish light)을 발견함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04오두막 발견과 안도<\/div><ul><li>삼촌의 오두막을 발견하고 모든 고난이 끝났음에 깊이 감사한다.<\/li><li>불빛의 정체는 크룰 삼촌의 오두막(cabin)이었음<\/li><li>도움(help)을 청할 수 있다는 사실에 말로 다 할 수 없이 감사함<\/li><li>마침내 모든 고난(hardship)이 끝났음을 깨닫고 안도함<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">head<\/td><td class=\"m\">향하다<\/td><\/tr><tr><td class=\"w\">switch off<\/td><td class=\"m\">~을 끄다<\/td><\/tr><tr><td class=\"w\">lost<\/td><td class=\"m\">길을 잃은<\/td><\/tr><tr><td class=\"w\">stumble<\/td><td class=\"m\">비틀거리다, 발을 헛디디다<\/td><\/tr><tr><td class=\"w\">tear<\/td><td class=\"m\">찢다<\/td><\/tr><tr><td class=\"w\">injure<\/td><td class=\"m\">다치게 하다, 상처를 입히다<\/td><\/tr><tr><td class=\"w\">fall down<\/td><td class=\"m\">넘어지다, 굴러떨어지다<\/td><\/tr><tr><td class=\"w\">in desperation<\/td><td class=\"m\">절망하여, 자포자기하여<\/td><\/tr><tr><td class=\"w\">lean against<\/td><td class=\"m\">~에 기대다<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">have no idea<\/td><td class=\"m\">전혀 모르다<\/td><\/tr><tr><td class=\"w\">faint<\/td><td class=\"m\">희미한<\/td><\/tr><tr><td class=\"w\">aroma<\/td><td class=\"m\">향기<\/td><\/tr><tr><td class=\"w\">drift<\/td><td class=\"m\">떠돌다, 서서히 이동하다<\/td><\/tr><tr><td class=\"w\">scent<\/td><td class=\"m\">냄새, 향기<\/td><\/tr><tr><td class=\"w\">glow<\/td><td class=\"m\">빛나다, 은은한 빛을 내다<\/td><\/tr><tr><td class=\"w\">beyond words<\/td><td class=\"m\">말로 다 할 수 없는, 이루 말할 수 없는<\/td><\/tr><tr><td class=\"w\">ask for<\/td><td class=\"m\">~을 요청하다<\/td><\/tr><tr><td class=\"w\">hardship<\/td><td class=\"m\">고난, 어려움<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I was heading<\/b><\/span><span class=\"ko\">나는 향하고 있었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the direction of a forest road<\/b><\/span><span class=\"ko\">숲길의 방향으로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> I knew would take me home.<\/b><\/span><span class=\"ko\">나를 집으로 데려다줄 것이라고 내가 알고 있던<\/span><\/div><\/div><div class=\"lec-sent-ko\">나를 집으로 데려다줄 것이라고 내가 알고 있던 숲길 방향으로 나는 향하고 있었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이야기의 도입부로, 주인공이 익숙한 길을 통해 안전하게 집으로 가고 있다는 상황을 설정합니다. that I knew would take me home은 글쓴이가 이 길이 집으로 가는 올바른 길이라고 굳게 믿고 있었음을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that (관계대명사): that은 선행사 a forest road를 수식하는 주격 관계대명사이다. 뒤의 I knew는 삽입절이며, 이를 제외하면 that이 동사 would take의 주어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">head<\/td><td class=\"m\">향하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>But<\/b><\/span><span class=\"ko\">하지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>almost <span class=\"grammar-hl\">as though someone had switched off<\/span> all the lights<\/b><\/span><span class=\"ko\">마치 누군가가 모든 불을 꺼 버린 것처럼<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I was suddenly<\/b><\/span><span class=\"ko\">나는 갑자기 있었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in a black forest<\/b><\/span><span class=\"ko\">암흑의 숲속에<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>with no light of any kind.<\/b><\/span><span class=\"ko\">어떤 종류의 빛도 없는<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 마치 누군가가 모든 불을 꺼 버린 것처럼 나는 갑자기 어떤 종류의 빛도 없는 암흑의 숲속에 있었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 평온한 상황에서 갑작스러운 위기로 넘어가는 전환점입니다. almost as though someone had switched off all the lights를 통해 해가 저물거나 날씨가 변해 순식간에 앞이 전혀 보이지 않게 된 당혹스러운 상황을 실감 나게 묘사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">as though someone had switched off as though(접속사): as though + S + V(절) 구조이다. 주어(someone) 뒤에 과거완료(had switched off)가 쓰여 과거 사실의 반대를 가정하는 가정법 과거완료 구문이다. 의미는 &#39;마치 ~했던 것처럼&#39;이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">switch off<\/td><td class=\"m\">~을 끄다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Feeling lost,<\/span><\/b><\/span><span class=\"ko\">어찌할 바를 모른 채,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I stumbled.<\/b><\/span><span class=\"ko\">나는 비틀거리며 걸었다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">어찌할 바를 모른 채 나는 비틀거리며 걸었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 갑작스러운 어둠 속에서 방향 감각을 잃고 신체적으로도 중심을 잡지 못하는 상황입니다. Feeling lost는 단순히 길을 잃었다는 물리적 사실뿐만 아니라, 어찌할 바를 몰라 심리적으로 당황하고 두려워하는 상태를 함께 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Feeling lost, (분사구문): 접속사 + 주어 + 동사 구조로 변환하면 because I felt lost가 된다. 주절의 주어(I)와 같아 생략되고 동사에 -ing가 붙은 현재분사 구문이다.<\/div><div class=\"lec-gr-item\">lost (과거분사(보어)): lost는 feel의 주격 보어로 쓰여 &#39;길을 잃은&#39;이라는 상태를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">lost<\/td><td class=\"m\">길을 잃은<\/td><\/tr><tr><td class=\"w\">stumble<\/td><td class=\"m\">비틀거리다, 발을 헛디디다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I <span class=\"grammar-hl\">fell<\/span>.<\/b><\/span><span class=\"ko\">나는 넘어졌다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 넘어졌다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 비틀거리던 앞 문장의 행동이 결국 넘어지는 결과로 이어짐을 보여 줍니다. 매우 짧은 문장을 사용하여 주인공이 겪는 급박하고 혼란스러운 상황의 속도감을 더해 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">fell 1형식 동사: 주어(I)와 동사(fell)로 완전한 문장을 이루며, 목적어나 보어가 필요 없는 1형식 구조이다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 5 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I tore my clothes and injured myself<\/b><\/span><span class=\"ko\">나는 옷이 찢어지고 다쳤다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">falling down<\/span> a hill.<\/b><\/span><span class=\"ko\">언덕에서 굴러 떨어지며.<\/span><\/div><\/div><div class=\"lec-sent-ko\">언덕에서 굴러 떨어져 옷이 찢어지고 다쳤다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 넘어진 이후의 피해 상황을 구체적으로 설명합니다. falling down a hill은 평지가 아닌 비탈길에서 구르며 찰과상과 같은 육체적 고통을 입게 된 구체적인 과정을 보여 줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">falling down (분사구문): 접속사 + 주어 + 동사 구조로 변환하면 while I was falling(또는 as I fell)이 된다. 주절의 주어(I)와 같아 생략되고 동사에 -ing가 붙어 동시동작(~하면서)을 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">injure<\/td><td class=\"m\">다치게 하다, 상처를 입히다<\/td><\/tr><tr><td class=\"w\">fall down<\/td><td class=\"m\">넘어지다, 굴러떨어지다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>In desperation<\/b><\/span><span class=\"ko\">자포자기한 채<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I <span class=\"grammar-hl\">stopped<\/span><\/b><\/span><span class=\"ko\">나는 멈춰 섰다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">and leaned<\/span><\/b><\/span><span class=\"ko\">그리고 기대었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>against a tree.<\/b><\/span><span class=\"ko\">나무에.<\/span><\/div><\/div><div class=\"lec-sent-ko\">자포자기한 채 나는 멈춰서서 나무에 기대었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 계속 움직이다가는 더 다칠 수 있다는 것을 깨닫고 행동을 멈추는 장면입니다. In desperation은 육체적 부상과 어둠 속에서 탈출구를 찾지 못한 채 모든 희망을 잃어버린 주인공의 극심한 좌절감을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">stopped and leaned (병렬구조): 등위접속사 and를 중심으로 과거형 동사 stopped와 leaned가 주어 I에 연결되어 병렬구조를 이룬다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">in desperation<\/td><td class=\"m\">절망하여, 자포자기하여<\/td><\/tr><tr><td class=\"w\">lean against<\/td><td class=\"m\">~에 기대다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I have no idea<\/b><\/span><span class=\"ko\">나는 전혀 모르겠다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">where I am now<\/span>.<\/b><\/span><span class=\"ko\">내가 지금 어디에 있는지.<\/span><\/div><\/div><div class=\"lec-sent-ko\">‘내가 지금 어디에 있는지 전혀 모르겠어.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 나무에 기댄 채 주인공이 속으로 생각하는 내용을 직접적으로 드러냅니다. 현재 시제를 사용하여 독자가 주인공의 현재 두려운 마음속에 함께 있는 것처럼 느끼게 만듭니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">where I am now (간접의문문): 의문사(where) + 주어(I) + 동사(am)의 평서문 어순으로 쓰여, 동사구(have no idea)의 목적어 역할을 하는 명사절이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">have no idea<\/td><td class=\"m\">전혀 모르다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 8 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Will anyone even notice<\/b><\/span><span class=\"ko\">누군가 알아차리기라도 할까<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that I’m gone<\/span>?<\/b><\/span><span class=\"ko\">내가 사라진 것을?<\/span><\/div><\/div><div class=\"lec-sent-ko\">내가 사라진 것을 누군가 알아차리기는 할까?’<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞선 공간적 고립감에 더해 심리적 고립감까지 극한에 달했음을 보여 주는 문장입니다. notice that I’m gone은 자신이 이 어두운 숲속에서 구조받지 못하고 영영 잊힐지도 모른다는 극도의 공포심을 가리킵니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">that I’m gone 명사절 접속사 that: 뒤에 완전한 절이 오며, 동사 notice의 목적어 역할을 하는 명사절을 이끈다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 9 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">It was then<\/span><\/b><\/span><span class=\"ko\">바로 그때였다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that<\/span> a faint aroma<\/b><\/span><span class=\"ko\">희미한 향이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>drifted<\/b><\/span><span class=\"ko\">실려 온 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>through the darkness: the scent of <span class=\"grammar-hl\">cooking<\/span>.<\/b><\/span><span class=\"ko\">어둠을 통해: 요리 냄새인.<\/span><\/div><\/div><div class=\"lec-sent-ko\">바로 그때 어둠을 통해 희미한 향이 바람에 실려왔다. 요리 냄새였다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 절망의 극치에 달했던 분위기가 희망으로 반전되는 결정적인 순간입니다. 글쓴이는 It was then that을 써서 여기서 힘주어 말합니다. 아무것도 보이지 않고 두려움만 가득하던 상황에서, 누군가 근처에 있다는 결정적인 단서를 코로 먼저 감지했음을 강조합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">It was then that (강조구문): &#39;It is/was ~ that&#39; 강조구문이다. 원래 문장(A faint aroma drifted through the darkness then)에서 부사어 then을 It was와 that 사이에 두어 강조한 구조이다.<\/div><div class=\"lec-gr-item\">cooking (동명사(명사적)): 전치사 of의 목적어 자리에 쓰여 &#39;요리하기&#39;라는 명사적 개념을 나타내는 동명사이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">faint<\/td><td class=\"m\">희미한<\/td><\/tr><tr><td class=\"w\">aroma<\/td><td class=\"m\">향기<\/td><\/tr><tr><td class=\"w\">drift<\/td><td class=\"m\">떠돌다, 서서히 이동하다<\/td><\/tr><tr><td class=\"w\">scent<\/td><td class=\"m\">냄새, 향기<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 10 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>I <span class=\"grammar-hl\">stumbled<\/span><\/b><\/span><span class=\"ko\">나는 비틀거리며 걸어갔다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">towards it<\/span>,<\/b><\/span><span class=\"ko\">그것을 향해,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and soon,<\/b><\/span><span class=\"ko\">그리고 곧,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>a faint, yellowish light<\/b><\/span><span class=\"ko\">희미한 누르스름한 빛이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>glowed<\/b><\/span><span class=\"ko\">반짝였다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>through the trees.<\/b><\/span><span class=\"ko\">나무 사이로.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나는 비틀거리며 그것을 향해 걸어갔고, 곧 희미한 누르스름한 빛이 나무 사이로 반짝였다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 후각적 단서에 이어 시각적 단서까지 발견하며 희망이 구체화되는 과정입니다. stumbled towards it은 아직 어둡고 다친 상태라서 걷는 폼은 엉성하지만, 살기 위해 냄새가 나는 쪽으로 필사적으로 몸을 움직이는 장면을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">stumbled towards it (전치사구): 전치사 towards 뒤에 대명사 it이 와서 동작의 방향을 나타내는 부사구 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">stumble<\/td><td class=\"m\">비틀거리다, 발을 헛디디다<\/td><\/tr><tr><td class=\"w\">faint<\/td><td class=\"m\">희미한<\/td><\/tr><tr><td class=\"w\">glow<\/td><td class=\"m\">빛나다, 은은한 빛을 내다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 11 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>It was Uncle Krull’s cabin<\/b><\/span><span class=\"ko\">그것은 Krull 삼촌의 오두막이었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and I <span class=\"grammar-hl\">could see<\/span> him<\/b><\/span><span class=\"ko\">그리고 나는 그를 볼 수 있었다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>through the window!<\/b><\/span><span class=\"ko\">창문을 통해!<\/span><\/div><\/div><div class=\"lec-sent-ko\">그것은 Krull 삼촌의 오두막이었고 나는 창문을 통해 그를 볼 수 있었다!<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 발견한 희미한 빛의 정체가 지인의 집으로 밝혀지는 절정의 순간입니다. 아는 사람의 모습을 확인하면서 구조될 수 있다는 확신을 얻고 극도로 안도하는 심정이 느낌표를 통해 잘 전달됩니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">could see 조동사 + 동사원형: 주절의 시제가 과거(was)이므로 능력과 가능을 나타내는 조동사 can의 과거형 could 뒤에 동사원형 see가 쓰였다.<\/div><\/div>\n        ","<div class=\"lec-sent-no\">문장 12 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">Thankful beyond words,<\/span><\/b><\/span><span class=\"ko\">말로 표현할 수 없을 정도로 감사하며,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I knew<\/b><\/span><span class=\"ko\">나는 알았다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>I could finally <span class=\"grammar-hl\">ask<\/span><\/b><\/span><span class=\"ko\">내가 마침내 요청할 수 있다는 것을<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">for<\/span> help.<\/b><\/span><span class=\"ko\">도움을.<\/span><\/div><\/div><div class=\"lec-sent-ko\">말로 표현할 수 없을 정도로 감사하며 나는 마침내 도움을 요청할 수 있다는 것을 알게 되었다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 구조에 대한 확신과 생존의 기쁨을 정리하는 문장입니다. Thankful beyond words는 &#39;말로 표현할 수 없을 만큼 감사하다&#39;는 직역 그대로, 칠흑 같은 어둠과 부상의 공포에서 벗어났을 때 밀려오는 거대한 안도감을 의미합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Thankful beyond words, (분사구문): 접속사 + 주어 + 동사 구조로 변환하면 because I was thankful beyond words가 된다. 분사구문으로 전환되면서 Being이 생략되고 형용사 Thankful만 남아 부사절 역할을 하는 구조이다.<\/div><div class=\"lec-gr-item\">ask for (관용표현): ask for는 &#39;~을 요청하다&#39; 혹은 &#39;~을 부탁하다&#39;라는 의미의 숙어로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">beyond words<\/td><td class=\"m\">말로 다 할 수 없는, 이루 말할 수 없는<\/td><\/tr><tr><td class=\"w\">ask for<\/td><td class=\"m\">~을 요청하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 13 / 13<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>My hardship <span class=\"grammar-hl\">was over<\/span>.<\/b><\/span><span class=\"ko\">나의 고난이 끝났다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">나의 고난이 끝났다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이야기의 결론으로, 모든 위기 상황이 종료되었음을 선언합니다. 길을 잃고 다쳐서 겪은 두려움과 육체적 고통이 이제 완전히 과거의 일이 되었음을 짧고 분명하게 맺고 있습니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">was over (관용표현): be over는 &#39;끝나다&#39;라는 의미를 나타내는 숙어 표현으로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">hardship<\/td><td class=\"m\">고난, 어려움<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>주인공은 익숙한 숲길로 집을 향해 가고 있었다.<\/li><li>갑자기 칠흑 같은 어둠이 깔리면서 길을 잃고 굴러떨어져 다친다.<\/li><li>깊은 절망 속에서 요리하는 냄새를 맡고 희미한 빛을 따라간다.<\/li><li>아는 사람의 오두막을 발견하고 마침내 구조될 수 있다는 안도감을 느끼며 고난이 끝난다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">The narrator falls into deep despair while wandering lost in a dark forest, but ultimately feels profound relief upon discovering a safe shelter.<\/div>\n              <div class=\"lec-final-sum-ko\">화자는 어두운 숲에서 길을 잃고 헤매며 깊은 절망에 빠지지만, 마침내 안전한 피난처를 발견하고 깊은 안도감을 느낀다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./19_audio/1.mp3","hl":null}],[{"audio":"./19_audio/2.mp3","hl":null}],[{"audio":"./19_audio/3.mp3","hl":null},{"audio":"./19_audio/4.mp3","hl":"stage-0"},{"audio":"./19_audio/5.mp3","hl":"stage-1"},{"audio":"./19_audio/6.mp3","hl":"stage-2"},{"audio":"./19_audio/7.mp3","hl":"stage-3"}],[{"audio":"./19_audio/8.mp3","hl":null}],[{"audio":"./19_audio/9.mp3","hl":"main"},{"audio":"./19_audio/10.mp3","hl":"meaning"},{"audio":"./19_audio/11.mp3","hl":"grammar"}],[{"audio":"./19_audio/12.mp3","hl":"main"},{"audio":"./19_audio/13.mp3","hl":"meaning"},{"audio":"./19_audio/14.mp3","hl":"grammar"}],[{"audio":"./19_audio/15.mp3","hl":"main"},{"audio":"./19_audio/16.mp3","hl":"meaning"},{"audio":"./19_audio/17.mp3","hl":"grammar"}],[{"audio":"./19_audio/18.mp3","hl":"main"},{"audio":"./19_audio/19.mp3","hl":"meaning"},{"audio":"./19_audio/20.mp3","hl":"grammar"}],[{"audio":"./19_audio/21.mp3","hl":"main"},{"audio":"./19_audio/22.mp3","hl":"meaning"},{"audio":"./19_audio/23.mp3","hl":"grammar"}],[{"audio":"./19_audio/24.mp3","hl":"main"},{"audio":"./19_audio/25.mp3","hl":"meaning"},{"audio":"./19_audio/26.mp3","hl":"grammar"}],[{"audio":"./19_audio/27.mp3","hl":"main"},{"audio":"./19_audio/28.mp3","hl":"meaning"},{"audio":"./19_audio/29.mp3","hl":"grammar"}],[{"audio":"./19_audio/30.mp3","hl":"main"},{"audio":"./19_audio/31.mp3","hl":"meaning"},{"audio":"./19_audio/32.mp3","hl":"grammar"}],[{"audio":"./19_audio/33.mp3","hl":"main"},{"audio":"./19_audio/34.mp3","hl":"meaning"},{"audio":"./19_audio/35.mp3","hl":"grammar
