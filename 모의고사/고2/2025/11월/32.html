있는 전문화는 과학 발전에 크게 기여했지만, 부작용으로 각 연구 공동체가 자신만의 전문 분야에 갇혀 타 분야와 소통하지 못하는 학문적 칸막이 현상(Silo effect)을 낳기도 했습니다. 특히 생물학이나 의학에서 미생물(Microorganism)이나 특정 세포 단위의 미세한 구성 요소(Component)에만 집중하다 보면, 정작 그것들이 전체 시스템 속에서 어떻게 유기적으로 상호작용하는지 놓치기가 무척 쉽죠. 따라서 이 글을 읽으실 때는 오래전부터 제기되어 온 지식의 파편화 현상을 염두에 두시고, 다양한 과학적 관점들이 왜 서로 소통하기 어려운지, 그리고 인체라는 복잡한 대상을 제대로 이해하기 위해 왜 전체를 보는 시각이 중요한지 생각해보시면 글의 맥락을 훨씬 깊이 있게 이해하실 수 있을 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01이상적인 융합<\/div><ul><li>신체에 대한 다양한 학문적 관점은 서로 결합하여 전체적인 이해를 높일 수 있다.<\/li><li>와인 전문가가 화학(chemistry) 지식을 통해 이득을 얻는 상황과 유사함<\/li><li>각각의 관점(perspective)은 서로의 연구를 향상시킬 잠재력이 있음<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02현실의 한계<\/div><ul><li>과학 도구와 인체 연구는 깊은 전문성을 요구하여 오히려 학문적 단절을 초래한다.<\/li><li>학자들이 학문적 고립(silos) 상태에서 인체를 연구하는 경향이 발생함<\/li><li>각 연구 집단이 고유의 전문 어휘(specialised vocabulary)를 사용하여 서로 분리됨<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03극단적 전문화<\/div><ul><li>연구 공동체는 특정 과학 도구나 단일 세포 같은 세부적인 요소에만 집중하게 되었다.<\/li><li>세포(cell) 간의 소통 방식조차 완전히 독립된 전문 주제로 다뤄짐<\/li><li>극도로 복잡한 인체는 물론, 단순한 생명체(simple forms of life)조차 전체로서 연구되는 일이 드묾<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04결론 및 함의<\/div><ul><li>지식의 양이 통제 불가능할 정도로 방대해져 전체를 이해하는 것은 불가능해졌다.<\/li><li>과거부터 이미 지식이 감당하기 어려울 정도로 방대(vast)해졌다는 지적이 있었음<\/li><li>오늘날 그 어떤 분야에서도 전체(the whole)를 아우르는 전문가는 존재하지 않음<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be aware of<\/td><td class=\"m\">~을 알다, ~을 인지하다<\/td><\/tr><tr><td class=\"w\">underlie<\/td><td class=\"m\">~의 기저를 이루다, ~의 기초가 되다<\/td><\/tr><tr><td class=\"w\">perspective<\/td><td class=\"m\">관점, 시각<\/td><\/tr><tr><td class=\"w\">enhance<\/td><td class=\"m\">향상시키다, 높이다<\/td><\/tr><tr><td class=\"w\">expertise<\/td><td class=\"m\">전문 지식, 전문성<\/td><\/tr><tr><td class=\"w\">tend to<\/td><td class=\"m\">~하는 경향이 있다, ~하기 쉽다<\/td><\/tr><tr><td class=\"w\">in silos<\/td><td class=\"m\">고립되어, 단절되어<\/td><\/tr><tr><td class=\"w\">section<\/td><td class=\"m\">분리하다, 구획을 나누다<\/td><\/tr><tr><td class=\"w\">specialised<\/td><td class=\"m\">전문화된, 전문적인<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be dedicated to<\/td><td class=\"m\">~에 전념하다, ~에 헌신하다<\/td><\/tr><tr><td class=\"w\">component<\/td><td class=\"m\">구성 요소, 부품<\/td><\/tr><tr><td class=\"w\">communicate with<\/td><td class=\"m\">~와 소통하다, ~와 연락하다<\/td><\/tr><tr><td class=\"w\">as a whole<\/td><td class=\"m\">전체적으로, 통째로<\/td><\/tr><tr><td class=\"w\">evidently<\/td><td class=\"m\">분명히, 명백하게<\/td><\/tr><tr><td class=\"w\">complex<\/td><td class=\"m\">복잡한<\/td><\/tr><tr><td class=\"w\">vast<\/td><td class=\"m\">방대한, 엄청난<\/td><\/tr><tr><td class=\"w\">manageable<\/td><td class=\"m\">감당할 수 있는, 관리할 수 있는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Just as an expert<\/b><\/span><span class=\"ko\">마치 전문가가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the taste and colour of wine<\/b><\/span><span class=\"ko\">와인의 맛과 색의<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>will gain much<\/b><\/span><span class=\"ko\">많은 것을 얻듯이<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by <span class=\"grammar-hl\">being<\/span> aware of the chemistry<\/b><\/span><span class=\"ko\">화학을 알게 됨으로써<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">that underlies those qualities<\/span>,<\/b><\/span><span class=\"ko\">그러한 특성들의 기저에 있는,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>so each perspective on the body<\/b><\/span><span class=\"ko\">마찬가지로 신체에 대한 각각의 관점은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>can potentially enhance the others.<\/b><\/span><span class=\"ko\">아마도 다른 관점들을 향상시킬지도 모른다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">와인의 맛과 색의 전문가가 그러한 특성들의 기저에 있는 화학을 알게 됨으로써 많은 것을 얻듯이, 마찬가지로 신체에 대한 각각의 관점은 아마도 다른 관점들을 향상시킬지도 모른다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 도입부로 와인 전문가의 비유를 사용하여 인체 연구의 이상적인 방향성을 제시합니다. &#39;Just as ~, so ~&#39; 구문을 통해 여러 관점(화학, 생물학 등)을 융합할 때 전체적인 이해도가 높아진다는 점을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Just as ..., so ... (관용표현): &#39;Just as A, so B&#39; 구문으로 &#39;A하는 것과 마찬가지로, 그렇게 B하다&#39;라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">being (동명사(명사적)): 전치사 by의 목적어 자리에 쓰여 명사적 역할을 하는 동명사이다.<\/div><div class=\"lec-gr-item\">that underlies those qualities (관계대명사): that은 선행사 the chemistry를 수식하는 주격 관계대명사이며, that절 내부에서 주어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be aware of<\/td><td class=\"m\">~을 알다, ~을 인지하다<\/td><\/tr><tr><td class=\"w\">underlie<\/td><td class=\"m\">~의 기저를 이루다, ~의 기초가 되다<\/td><\/tr><tr><td class=\"w\">perspective<\/td><td class=\"m\">관점, 시각<\/td><\/tr><tr><td class=\"w\">enhance<\/td><td class=\"m\">향상시키다, 높이다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>And yet every scientific tool,<\/b><\/span><span class=\"ko\">하지만 모든 과학적 도구와,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from microscopes to mathematics,<\/b><\/span><span class=\"ko\">현미경에서부터 수학에 이르기까지의,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and every aspect of the body,<\/b><\/span><span class=\"ko\">그리고 신체의 모든 측면은,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>from the brain to the microorganism,<\/b><\/span><span class=\"ko\">뇌에서부터 미생물에 이르기까지의,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>requires such depth of expertise<\/b><\/span><span class=\"ko\">너무 깊은 전문 지식을 필요로 해서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that this tends <span class=\"grammar-hl\">not to happen<\/span>:<\/b><\/span><span class=\"ko\">이런 일은 잘 발생하지 않는 경향이 있다:<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>we tend <span class=\"grammar-hl\">to study<\/span> the human body<\/b><\/span><span class=\"ko\">우리는 인간의 신체를 연구하는 경향이 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in silos,<\/b><\/span><span class=\"ko\">개별적으로 분리해서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">each community sectioned from the others<\/span><\/b><\/span><span class=\"ko\">각각의 공동체가 나머지 다른 것들과는 구분된 채<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by its own <span class=\"grammar-hl\">specialised<\/span> vocabulary.<\/b><\/span><span class=\"ko\">그것 자신의 전문적인 어휘에 의해.<\/span><\/div><\/div><div class=\"lec-sent-ko\">하지만 현미경에서부터 수학에 이르기까지의 모든 과학적 도구와 뇌에서부터 미생물에 이르기까지의 신체의 모든 측면은 너무 깊은 전문 지식을 필요로 해서 이런 일은 잘 발생하지 않는 경향이 있다. 즉, 우리는 각각의 공동체가 그것 자신의 전문적인 어휘에 의해 나머지 다른 것들과는 구분된 채, 인간의 신체를 개별적으로 분리해서 연구하는 경향이 있다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞서 언급된 이상적인 융합이 실제로는 어렵다는 점을 지적하며 상황을 반전시킵니다. 각 분야의 전문성이 너무 깊어 학자들이 &#39;사일로(silos)&#39;처럼 자신들의 좁은 영역에 갇혀 소통하지 못하는 현실을 묘사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">not to happen (to부정사(명사적)): tend의 목적어 자리에 쓰인 명사적 용법이며, to부정사를 부정하기 위해 not이 to 바로 앞에 위치했다.<\/div><div class=\"lec-gr-item\">to study (to부정사(명사적)): tend의 목적어 자리에 쓰인 명사적 용법이다.<\/div><div class=\"lec-gr-item\">each community sectioned from the others (과거분사(분사구문)): 부사적 기능으로 쓰인 독립분사구문이다. 주절의 주어(we)와 분사구문의 의미상 주어(each community)가 달라 주어가 생략되지 않고 남았다. 원래 절로 변환하면 while each community is sectioned from the others 이다.<\/div><div class=\"lec-gr-item\">specialised (과거분사(형용사)): specialised가 뒤의 명사 vocabulary를 수식하는 구조로, &#39;전문화된 어휘&#39;라는 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">expertise<\/td><td class=\"m\">전문 지식, 전문성<\/td><\/tr><tr><td class=\"w\">tend to<\/td><td class=\"m\">~하는 경향이 있다, ~하기 쉽다<\/td><\/tr><tr><td class=\"w\">in silos<\/td><td class=\"m\">고립되어, 단절되어<\/td><\/tr><tr><td class=\"w\">section<\/td><td class=\"m\">분리하다, 구획을 나누다<\/td><\/tr><tr><td class=\"w\">specialised<\/td><td class=\"m\">전문화된, 전문적인<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Research communities <span class=\"grammar-hl\">may be dedicated<\/span><\/b><\/span><span class=\"ko\">연구 공동체는 전념할지도 모른다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>to one type of scientific tool<\/b><\/span><span class=\"ko\">한 종류의 과학적 도구<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>or a specific component of the body,<\/b><\/span><span class=\"ko\">또는 신체의 특정한 한 구성 요소에,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>such as one type of cell.<\/b><\/span><span class=\"ko\">한 종류의 세포와 같은.<\/span><\/div><\/div><div class=\"lec-sent-ko\">연구 공동체는 한 종류의 과학적 도구 또는 한 종류의 세포와 같은 신체의 특정한 한 구성 요소에 전념할지도 모른다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 이전 문장에서 지적한 고립된 연구 방식의 구체적인 예를 보여줍니다. 연구자들이 전체를 보지 못하고 특정 도구나 단일 세포와 같은 매우 세분화된 영역에만 집중하는 현상을 설명합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">may be dedicated (수동태): 조동사(may) + be동사(be) + p.p.(dedicated) 구조. dedicate는 타동사인데 뒤에 목적어가 없어서 수동구조 be dedicated 형태로 쓴다. 기본구조: dedicate A to B (A를 B에 전념하게 하다/바치다).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">be dedicated to<\/td><td class=\"m\">~에 전념하다, ~에 헌신하다<\/td><\/tr><tr><td class=\"w\">component<\/td><td class=\"m\">구성 요소, 부품<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">How different types of cell communicate<\/span><\/b><\/span><span class=\"ko\">다른 유형의 세포들이 어떻게 소통하는지가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">with one another<\/span><\/b><\/span><span class=\"ko\">서로<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>becomes its own specialist topic.<\/b><\/span><span class=\"ko\">그 자체의 전문적인 주제가 된다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">다른 유형의 세포들이 서로 어떻게 소통하는지가 그 자체의 전문적인 주제가 된다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 학문의 분절화가 심화되는 모습을 강조합니다. 세포 간의 상호작용을 연구하는 것조차 기존 분야에 통합되지 않고 또 다른 독립된 세부 전공으로 나뉘어 학문 간 장벽이 높아지는 상황을 나타냅니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">How different types of cell communicate with one another (간접의문문): 의문사(How) + 주어(different types of cell) + 동사(communicate)의 평서문 어순을 취하여, 문장 전체에서 주어 역할을 하는 명사절을 이끈다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">communicate with<\/td><td class=\"m\">~와 소통하다, ~와 연락하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Even simple forms of life on Earth<\/b><\/span><span class=\"ko\">심지어 지구상에 있는 단순한 형태의 생명체조차도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">are now rarely studied<\/span><\/b><\/span><span class=\"ko\">이제는 연구되는 경우가 드물며<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as a whole,<\/b><\/span><span class=\"ko\">전체로서,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>and the human body<\/b><\/span><span class=\"ko\">그리고 인간의 신체는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>is evidently much more complex.<\/b><\/span><span class=\"ko\">분명히 훨씬 더 복잡하다.<\/span><\/div><\/div><div class=\"lec-sent-ko\">심지어 지구상에 있는 단순한 형태의 생명체조차도 이제는 전체로서 연구되는 경우가 드물며, 인간의 신체는 분명히 훨씬 더 복잡하다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 단순한 생명체조차 전체적으로 연구하기 힘든 현실을 들어, 훨씬 복잡한 인체를 하나의 통합된 시스템으로 이해하는 것은 현대 과학에서 더욱 불가능에 가깝다는 점을 설득력 있게 전달합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">are now rarely studied (수동태): be동사(are) + p.p.(studied) 구조. study는 타동사인데 뒤에 목적어가 없어서 수동구조 are studied 형태로 쓴다. 기본구조: study + O (O를 연구하다).<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">as a whole<\/td><td class=\"m\">전체적으로, 통째로<\/td><\/tr><tr><td class=\"w\">evidently<\/td><td class=\"m\">분명히, 명백하게<\/td><\/tr><tr><td class=\"w\">complex<\/td><td class=\"m\">복잡한<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>As long ago as 1890,<\/b><\/span><span class=\"ko\">오래전인 1890년에도,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>The Times newspaper commented<\/b><\/span><span class=\"ko\">‘The Times’ 신문은 논평했다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>that knowledge ‘had already become too vast <span class=\"grammar-hl\">to be manageable<\/span>’.<\/b><\/span><span class=\"ko\">지식이 ‘이미 너무 방대해져서 다루기 어렵게 되었다’라고.<\/span><\/div><\/div><div class=\"lec-sent-ko\">오래전인 1890년에도 ‘The Times’ 신문은 지식이 ‘이미 너무 방대해져서 다루기 어렵게 되었다’라고 논평했다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 과거의 신문 기사를 인용하여 지식의 방대함으로 인한 학문의 파편화가 오래전부터 진행되어 온 피할 수 없는 역사적 흐름이었음을 뒷받침합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">to be manageable (to부정사(부사적)): to V 바로 앞이 형용사(vast)이므로, 형용사를 수식하는 부사적 용법이다. (too ~ to V 구문과 결합하여 &#39;너무 ~해서 ...할 수 없다&#39;의 의미로 쓰임)<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">vast<\/td><td class=\"m\">방대한, 엄청난<\/td><\/tr><tr><td class=\"w\">manageable<\/td><td class=\"m\">감당할 수 있는, 관리할 수 있는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 7 / 7<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Today,<\/b><\/span><span class=\"ko\">오늘날,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>nobody <span class=\"grammar-hl\">is an expert<\/span><\/b><\/span><span class=\"ko\">아무도 전문가가 아니다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the whole of anything.<\/b><\/span><span class=\"ko\">어떤 것의 전체에 대한.<\/span><\/div><\/div><div class=\"lec-sent-ko\">오늘날 아무도 어떤 것의 전체에 대한 전문가가 아니다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 결론으로, 오랜 기간 누적된 지식의 팽창과 극심한 전문화로 인해 현대에는 어떤 분야에서든 전체적인 시스템을 완벽히 이해하는 통합적인 전문가는 존재할 수 없음을 강조하며 마무리합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">is an expert 기본 구조: 주어(nobody) + 2형식 동사(is) + 주격보어(an expert)로 이루어진 2형식 문장이다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">as a whole<\/td><td class=\"m\">전체적으로, 통째로<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>인체에 대한 다양한 연구 관점을 서로 결합하면 전체적인 이해도를 크게 높일 수 있다.<\/li><li>하지만 각 분야마다 요구하는 전문 지식이 너무 깊고 방대하여, 실제로는 학자들이 자기 분야에만 고립되어 연구하는 현상이 발생한다.<\/li><li>그 결과, 세포 하나나 특정 도구 하나만 연구할 정도로 학문이 극도로 세분화되고 파편화되었다.<\/li><li>지식의 양이 감당할 수 없이 팽창함에 따라, 오늘날에는 어떤 분야든 전체 시스템을 온전히 파악하는 전문가는 존재할 수 없게 되었다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">While integrating different scientific perspectives is highly beneficial, modern researchers study the human body in isolated fields due to the overwhelming vastness of knowledge.<\/div>\n              <div class=\"lec-final-sum-ko\">다양한 과학적 관점을 통합하는 것은 매우 유익하지만, 현대의 연구자들은 압도적으로 방대한 지식 때문에 고립된 분야에서 인체를 연구한다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./32_audio/1.mp3","hl":null}],[{"audio":"./32_audio/2.mp3","hl":null}],[{"audio":"./32_audio/3.mp3","hl":null},{"audio":"./32_audio/4.mp3","hl":"stage-0"},{"audio":"./32_audio/5.mp3","hl":"stage-1"},{"audio":"./32_audio/6.mp3","hl":"stage-2"},{"audio":"./32_audio/7.mp3","hl":"stage-3"}],[{"audio":"./32_audio/8.mp3","hl":null}],[{"audio":"./32_audio/9.mp3","hl":"main"},{"audio":"./32_audio/10.mp3","hl":"meaning"},{"audio":"./32_audio/11.mp3","hl":"grammar"}],[{"audio":"./32_audio/12.mp3","hl":"main"},{"audio":"./32_audio/13.mp3","hl":"meaning"},{"audio":"./32_audio/14.mp3","hl":"grammar"}],[{"audio":"./32_audio/15.mp3","hl":"main"},{"audio":"./32_audio/16.mp3","hl":"meaning"},{"audio":"./32_audio/17.mp3","hl":"grammar"}],[{"audio":"./32_audio/18.mp3","hl":"main"},{"audio":"./32_audio/19.mp3","hl":"meaning"},{"audio":"./32_audio/20.mp3","hl":"grammar"}],[{"audio":"./32_audio/21.mp3","hl":"main"},{"audio":"./32_audio/22.mp3","hl":"meaning"},{"audio":"./32_audio/23.mp3","hl":"grammar"}],[{"audio":"./32_audio/24.mp3","hl":"main"},{"audio":"./32_audio/25.mp3","hl":"meaning"},{"audio":"./32_audio/26.mp3","hl":"grammar"}],[{"audio":"./32_audio/27.mp3","hl":"main"},{"audio":"./32_audio/28.mp3","hl":"meaning"},{"audio":"./32_audio/29.mp3","hl":"grammar"}],[{"audio":"./32_audio/30.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_32번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 32번","titleEn":"The Fragmented Study of the Human Body: The Era of Hyper-Specialization","titleKo":"인체 연구의 파편화: 초전문화 시대","imageUrl":"__enpImg__","stages":[{"label":"01이상적인 융합","items":["신체에 대한 다양한 학문적 관점은 서로 결합하여 전체적인 이해를 높일 수 있다.","와인 전문가가 화학(chemistry) 지식을 통해 이득을 얻는 상황과 유사함","각각의 관점(perspective)은 서로의 연구를 향상시킬 잠재력이 있음"]},{"label":"02현실의 한계","items":["과학 도구와 인체 연구는 깊은 전문성을 요구하여 오히려 학문적 단절을 초래한다.","학자들이 학문적 고립(silos) 상태에서 인체를 연구하는 경향이 발생함","각 연구 집단이 고유의 전문 어휘(specialised vocabulary)를 사용하여 서로 분리됨"]},{"label":"03극단적 전문화","items":["연구 공동체는 특정 과학 도구나 단일 세포 같은 세부적인 요소에만 집중하게 되었다.","세포(cell) 간의 소통 방식조차 완전히 독립된 전문 주제로 다뤄짐","극도로 복잡한 인체는 물론, 단순한 생명체(simple forms of life)조차 전체로서 연구되는 일이 드묾"]},{"label":"04결론 및 함의","items":["지식의 양이 통제 불가능할 정도로 방대해져 전체를 이해하는 것은 불가능해졌다.","과거부터 이미 지식이 감당하기 어려울 정도로 방대(vast)해졌다는 지적이 있었음","오늘날 그 어떤 분야에서도 전체(the whole)를 아우르는 전문가는 존재하지 않음"]}],"bkg":"현대 과학에서는 복잡한 대상을 연구할 때 전체를 작은 조각으로 나누어 분석하는 환원주의(Reductionism) 방식을 주로 사용하는데, 이는 마치 자동차를 온전히 이해하기 위해 엔진, 타이어, 나사 하나하나를 따로 떼어 각자 전문가들이 연구하는 것과 같아요. 이러한 깊이 있는 전문화는 과학 발전에 크게 기여했지만, 부작용으로 각 연구 공동체가 자신만의 전문 분야에 갇혀 타 분야와 소통하지 못하는 학문적 칸막이 현상(Silo effect)을 낳기도 했습니다. 특히 생물학이나 의학에서 미생물(Microorganism)이나 특정 세포 단위의 미세한 구성 요소(Component)에만 집중하다 보면, 정작 그것들이 전체 시스템 속에서 어떻게 유기적으로 상호작용하는지 놓치기가 무척 쉽죠. 따라서 이 글을 읽으실 때는 오래전부터 제기되어 온 지식의 파편화 현상을 염두에 두시고, 다양한 과학적 관점들이 왜 서로 소통하기 어려운지, 그리고 인체라는 복잡한 대상을 제대로 이해하기 위해 왜 전체를 보는 시각이 중요한지 생각해보시면 글의 맥락을 훨씬 깊이 있게 이해하실 수 있을 거예요.","ttsText":"현대 과학에서는 복잡한 대상을 연구할 때 전체를 작은 조각으로 나누어 분석하는 환원주의(Reductio en: we tend to study the human body in silos, each community sectioned from the others by its own specialised vocabulary.","korean":"하지만 현미경에서부터 수학에 이르기까지의 모든 과학적 도구와 뇌에서부터 미생물에 이르기까지의 신체의 모든 측면은 너무 깊은 전문 지식을 필요로 해서 이런 일은 잘 발생하지 않는 경향이 있다. 즉, 우리는 각각의 공동체가 그것 자신의 전문적인 어휘에 의해 나머지 다른 것들과는 구분된 채, 인간의 신체를 개별적으로 분리해서 연구하는 경향이 있다.","chunks":[{"english":"And yet every scientific tool,","englishHtml":"<b>And yet every scientific tool,<\/b>","korean":"하지만 모든 과학적 도구와,"},{"english":"from microscopes to mathematics,","englishHtml":"<b>from microscopes to mathematics,<\/b>","korean":"현미경에서부터 수학에 이르기까지의,"},{"english":"and every aspect of the body,","englishHtml":"<b>and every aspect of the body,<\/b>","korean":"그리고 신체의 모든 측면은,"},{"english":"from the brain to the microorganism,","englishHtml":"<b>from the brain to the microorganism,<\/b>","korean":"뇌에서부터 미생물에 이르기까지의,"},{"english":"requires such depth of expertise","englishHtml":"<b>requires such depth of expertise<\/b>","korean":"너무 깊은 전문 지식을 필요로 해서"},{"english":"that this tends not to happen:","englishHtml":"<b>that this tends <span class=\"grammar-hl\">not to happen<\/span>:<\/b>","korean":"이런 일은 잘 발생하지 않는 경향이 있다:"},{"english":"we tend to study the human body","englishHtml":"<b>we tend <span class=\"grammar-hl\">to study<\/span> the human body<\/b>","korean":"우리는 인간의 신체를 연구하는 경향이 있다"},{"english":"in silos,","englishHtml":"<b>in silos,<\/b>","korean":"개별적으로 분리해서,"},{"english":"each community sectioned from the others","englishHtml":"<b><span class=\"grammar-hl\">each community sectioned from the others<\/span><\/b>","korean":"각각의 공동체가 나머지 다른 것들과는 구분된 채"},{"english":"by its own specialised vocabulary.","englishHtml":"<b>by its own <span class=\"grammar-hl\">specialised<\/span> vocabulary.<\/b>","korean":"그것 자신의 전문적인 어휘에 의해."}],"meaning":"앞서 언급된 이상적인 융합이 실제로는 어렵다는 점을 지적하며 상황을 반전시킵니다. 각 분야의 전문성이 너무 깊어 학자들이 '사일로(silos)'처럼 자신들의 좁은 영역에 갇혀 소통하지 못하는 현실을 묘사합니다.","grammar":"not to happen (to부정사(명사적)): tend의 목적어 자리에 쓰인 명사적 용법이며, to부정사를 부정하기
