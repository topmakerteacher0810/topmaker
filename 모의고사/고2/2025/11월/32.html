<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 32번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 32번","audioDir":"32_audio","preview":false,"count":33,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">32번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>The Paradox of Specialization: Why Holistic Knowledge is Fading\u003c/h1>\u003ch2>전문화의 역설: 왜 전체론적 지식이 사라지고 있는가\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>신체의 각 관점은 서로 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">보완\u003c/b>되어야 마땅하지만, 연구의 극단적 \u003cb class=\"key\">전문화\u003c/b>와 방대한 지식의 양으로 인해 각 분야가 고립된 \u003cb class=\"key\">사일로(silos)\u003c/b> 속에 갇혀 전체를 보지 못하고 있습니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The increasing depth of scientific specialization and the vastness of knowledge isolate research communities into silos, preventing a holistic understanding of the human body.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 이천이십오년 십월 고등학교 이학년 모의고사 서른두 번째 지문을 함께 분석해 보겠습니다. 이 글은 현대 과학의 전문화가 가져온 그림자, 즉 지식의 고립 현상에 대해 다루고 있어요. 우리가 왜 신체의 전체 모습을 보기 힘들어졌는지 그 이유를 함께 찾아봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">현대 과학은 대상을 가장 작은 단위까지 쪼개어 분석하는 \u003cb class=\"key\">환원주의(reductionism)\u003c/b>를 바탕으로 발전해 왔습니다. 마치 자동차의 구조를 이해하기 위해 수만 개의 부품을 따로 공부하는 것과 같은데, 이를 과학에서는 \u003cb class=\"key\">전문화(specialization)\u003c/b>라고 부릅니다. 하지만 전문성이 깊어질수록 연구자들은 자신들만의 특수한 용어를 사용하게 되어 다른 분야와 소통하기 어려워지는 \u003cb class=\"key\">사일로 \u003c/b>\u003cb class=\"key\">효과(silo \u003c/b>\u003cb class=\"key\">effect)\u003c/b>에 빠지게 됩니다. 이는 오케스트라의 각 연주자가 자신의 악보에만 집착하느라 전체 교향곡의 화음을 놓치는 상황에 비유할 수 있습니다. 결과적으로 오늘날의 지식 체계는 너무나 \u003cb class=\"key\">방대해져서(vast)\u003c/b> 어느 누구도 전체를 완벽히 파악하기 힘든 구조가 되었습니다.\u003c/div>","segs":[{"n":2,"text":"혹시 사일로 효과라는 말을 들어보셨나요? 원래 사일로는 곡식을 저장하는 높은 굴뚝 모양의 창고를 말하는데요, 경제나 과학에서는 자기 부서나 분야에만 갇혀 소통하지 않는 현상을 뜻합니다. 현대 과학은 세상을 작게 쪼개어 연구하는 환원주의를 통해 발전했지만, 그 대가로 전체를 보는 시야를 잃어가고 있죠. 마치 나무 하나하나의 세포는 완벽히 알지만 정작 숲이 어떻게 생겼는지는 아무도 모르는 상황과 비슷하다고 할 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이상적 관점\u003csmall>도입 · 문장 1\u003c/small>\u003c/h4>\u003cp>와인 전문가의 비유를 통해, 신체의 각 관점이 서로를 \u003cb class=\"key\">향상시킬 \u003c/b>\u003cb class=\"key\">수 \u003c/b>\u003cb class=\"key\">있음\u003c/b>을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>현실적 장벽\u003csmall>전환 · 문장 2\u003c/small>\u003c/h4>\u003cp>하지만 전문 지식의 깊이가 너무 깊어 연구가 개별적인 \u003cb class=\"key\">사일로(silos)\u003c/b>에 갇히는 경향이 있습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>전문화의 사례\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>세포나 특정 도구에만 전념하며, 단순한 생명체조차 \u003cb class=\"key\">전체로서\u003c/b> 연구되지 못하는 실태를 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>지식의 한계\u003csmall>결론 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>이미 19세기부터 지식은 \u003cb class=\"key\">다루기 \u003c/b>\u003cb class=\"key\">힘들 \u003c/b>\u003cb class=\"key\">정도로\u003c/b> 방대해졌으며, 오늘날 전체를 아는 전문가는 없습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 이상적인 기대에서 시작해 차가운 현실의 문제점으로 이어지는 구조를 가지고 있습니다.","hl":null},{"n":4,"text":"첫 번째 문장에서는 와인 전문가의 비유를 들고 있어요. 와인의 화학적 성질을 알면 맛을 더 잘 이해하듯, 신체에 대한 다양한 관점도 서로를 향상시킬 수 있다는 이상적인 기대를 보여줍니다.","hl":"f0"},{"n":5,"text":"두 번째 문장에서 분위기가 반전되죠. And yet이라는 표현과 함께, 실제로는 전문 지식의 깊이가 너무 깊어서 연구자들이 사일로, 즉 고립된 창고 속에 갇혀 각자의 전문 용어로만 소통하게 된다는 문제를 지적합니다.","hl":"f1"},{"n":6,"text":"세 번째부터 다섯 번째 문장은 그 구체적인 예시입니다. 연구자들이 세포 하나나 특정 도구에만 매몰되다 보니, 단순한 생명체조차 전체로서 연구되지 못하고 인간 신체는 더욱더 파편화되어 연구된다고 설명합니다.","hl":"f2"},{"n":7,"text":"마지막 여섯 번째와 일곱 번째 문장에서는 역사적인 맥락을 짚어줍니다. 이미 백 년도 더 전부터 지식은 개인이 다루기 힘들 만큼 방대해졌고, 오늘날에는 그 어떤 것의 전체를 아는 전문가는 존재하지 않는다는 결론을 내립니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-원인\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 문장에서 관점 간 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">보완\u003c/b>이라는 이상적인 방향을 제시하지만, 두 번째 문장에서 \u003cb class=\"key\">And \u003c/b>\u003cb class=\"key\">yet\u003c/b>을 통해 전문화로 인한 고립이라는 핵심 문제를 제기합니다. 이후 이러한 분절화가 일어나는 구체적인 이유와 사례를 들고, 마지막에 지식의 \u003cb class=\"key\">방대함\u003c/b> 때문에 전체 전문가가 존재할 수 없다는 현실을 다시 한번 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Just as... so (1)\u003c/b>\u003cspan>비유를 통한 도입\u003c/span>\u003cb>And yet (2)\u003c/b>\u003cspan>역접 및 문제 제기\u003c/span>\u003cb>such... that (2)\u003c/b>\u003cspan>인과 관계 강조\u003c/span>\u003cb>Even (5)\u003c/b>\u003cspan>심화된 사례 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">each perspective on the body\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">depth of expertise\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">silos\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sectioned from the others\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">specialist topic\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">too vast to be manageable\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>통합적 연구 (Ideal)\u003c/th>\u003cth>사일로 연구 (Reality)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>관점 간의 상호 보완\u003c/td>\u003ctd>특수 어휘로 인한 단절\u003c/td>\u003c/tr>\u003ctr>\u003ctd>전체로서의 연구\u003c/td>\u003ctd>특정 성분/도구에 전념\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음에 이상적인 가능성을 제시한 뒤 곧바로 현실적인 문제를 제기하는 문제 원인 구조를 취하고 있습니다. 특히 첫 문장과 마지막 문장이 지식의 통합과 불가능이라는 주제를 대조하며 보여주는 양괄식 구성이라고 볼 수 있어요.","hl":"ty"},{"n":9,"text":"문장 연결 고리를 잘 보셔야 합니다. 두 번째 문장의 And yet은 이 글의 가장 중요한 전환점이에요. 또한 such depth of expertise that이라는 인과 구문을 통해 전문성이 오히려 소통의 단절을 가져온 원인임을 강조하고 있습니다. silos나 sectioned 같은 단어들이 지식의 고립을 나타내는 핵심 키워드들입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>underlie\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기저를 이루다\u003c/span>\u003c/div>\u003cdiv>\u003cb>quality\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특성, 자질\u003c/span>\u003c/div>\u003cdiv>\u003cb>perspective\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관점, 시각\u003c/span>\u003c/div>\u003cdiv>\u003cb>enhance\u003c/b>\u003cem>동사\u003c/em>\u003cspan>향상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>microscope\u003c/b>\u003cem>명사\u003c/em>\u003cspan>현미경\u003c/span>\u003c/div>\u003cdiv>\u003cb>microorganism\u003c/b>\u003cem>명사\u003c/em>\u003cspan>미생물\u003c/span>\u003c/div>\u003cdiv>\u003cb>expertise\u003c/b>\u003cem>명사\u003c/em>\u003cspan>전문 지식\u003c/span>\u003c/div>\u003cdiv>\u003cb>silo\u003c/b>\u003cem>명사\u003c/em>\u003cspan>사일로(외부와 소통하지 않는 고립된 부서/분야)\u003c/span>\u003c/div>\u003cdiv>\u003cb>sectioned\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>구분된, 분할된\u003c/span>\u003c/div>\u003cdiv>\u003cb>specialised\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전문화된\u003c/span>\u003c/div>\u003cdiv>\u003cb>vocabulary\u003c/b>\u003cem>명사\u003c/em>\u003cspan>어휘\u003c/span>\u003c/div>\u003cdiv>\u003cb>dedicated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전념하는, 헌신하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>component\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구성 요소\u003c/span>\u003c/div>\u003cdiv>\u003cb>cell\u003c/b>\u003cem>명사\u003c/em>\u003cspan>세포\u003c/span>\u003c/div>\u003cdiv>\u003cb>communicate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>소통하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>rarely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>드물게\u003c/span>\u003c/div>\u003cdiv>\u003cb>as a whole\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전체로서\u003c/span>\u003c/div>\u003cdiv>\u003cb>evidently\u003c/b>\u003cem>부사\u003c/em>\u003cspan>분명히\u003c/span>\u003c/div>\u003cdiv>\u003cb>comment\u003c/b>\u003cem>동사\u003c/em>\u003cspan>논평하다, 언급하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>vast\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>방대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>manageable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>다룰 수 있는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 quality는 품질이 아니라 특성이라는 뜻으로 쓰였고, underlying은 기저를 이루는이라는 의미로 전문 지식의 토대를 나타냅니다. silos라는 단어는 원래 저장고라는 뜻이지만 여기서는 고립된 연구 환경을 비유하는 아주 중요한 단어이니 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">enhance\u003c/b>\u003cspan class=\"m\">향상시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">improve\u003c/span>\u003cspan class=\"s\">boost\u003c/span>\u003cspan class=\"s\">augment\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">diminish\u003c/span>\u003cspan class=\"a\">deteriorate\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">expertise\u003c/b>\u003cspan class=\"m\">전문 지식\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">proficiency\u003c/span>\u003cspan class=\"s\">mastery\u003c/span>\u003cspan class=\"s\">know-how\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">incompetence\u003c/span>\u003cspan class=\"a\">ignorance\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sectioned\u003c/b>\u003cspan class=\"m\">구분된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">divided\u003c/span>\u003cspan class=\"s\">separated\u003c/span>\u003cspan class=\"s\">segregated\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">integrated\u003c/span>\u003cspan class=\"a\">unified\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">rarely\u003c/b>\u003cspan class=\"m\">드물게\u003c/span>\u00 ss=\"en\">can potentially enhance the others.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">와인의 맛과 색의 전문가가 그러한 특성들의 기저에 있는 화학을 알게 됨으로써 많은 것을 얻듯이, 마찬가지로 신체에 대한 각각의 관점은 아마도 다른 관점들을 향상시킬지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 와인 전문가의 비유를 통해 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">보완\u003c/b>의 중요성을 설명합니다. 여러 관점이 합쳐질 때 신체에 대한 이해가 \u003cb class=\"key\">잠재적 \u003c/b>\u003cb class=\"key\">향상\u003c/b>을 이룰 수 있다는 글의 도입부입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : qualities [선행사] + that [주격 관계대명사] + underlies [동사] : \"기저에 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">\u003c/span> : Just as [주어+동사], so [주어+동사] : \"~인 것과 마찬가지로, 그렇게 ...하다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Just as an expert in the taste and colour of wine, 와인의 맛과 색의 전문가가 그러하듯. will gain much by being aware of, 알게 됨으로써 많은 것을 얻을 것이다. the chemistry that underlies those qualities, 그러한 특성들의 기저에 있는 화학을. so each perspective on the body, 마찬가지로 신체에 대한 각각의 관점은. can potentially enhance the others, 아마도 다른 관점들을 향상시킬지도 모른다.. 이 문장 전체를 해석하면, 와인의 맛과 색의 전문가가 그러한 특성들의 기저에 있는 화학을 알게 됨으로써 많은 것을 얻듯이, 마찬가지로 신체에 대한 각각의 관점은 아마도 다른 관점들을 향상시킬지도 모른다.","hl":"m"},{"n":13,"text":"이 문장은 와인 전문가가 화학적 원리를 알면 더 깊이 이해하듯 우리 몸도 다양한 관점을 합쳐야 더 잘 이해할 수 있다는 상호 보완의 원리를 설명합니다. 글 전체의 주제를 던지는 비유 부분이에요.","hl":"mn"},{"n":14,"text":"첫 번째 어법 포인트는 Just as 와 so 구문입니다. 두 문장을 연결해서 유사성을 강조하며 비유를 완성하죠. 두 번째는 that underlies입니다. 주격 관계대명사로서 특성들의 기초가 되는 근본 원리를 설명하는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 현미경에서부터 수학에 이르기까지의 모든 과학적 도구와\u003c/span>\u003cspan class=\"en\">And yet every scientific tool, from microscopes to mathematics,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뇌에서부터 미생물에 이르기까지의 신체의 모든 측면은\u003c/span>\u003cspan class=\"en\">and every aspect of the body, from the brain to the microorganism,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 깊은 전문 지식을 필요로 해서\u003c/span>\u003cspan class=\"en\">requires \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">such \u003c/span>\u003cspan class=\"tgt\">depth \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">expertise \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 일은 잘 발생하지 않는 경향이 있다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> this tends not to happen:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉, 우리는 인간의 신체를 개별적으로 분리해서 연구하는 경향이 있다.\u003c/span>\u003cspan class=\"en\">we tend to study the human body in silos,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각각의 공동체가 나머지 다른 것들과는 구분된 채\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">community \u003c/span>\u003cspan class=\"tgt\">sectioned\u003c/span> from the others\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것 자신의 전문적인 어휘에 의해\u003c/span>\u003cspan class=\"en\">by its own specialised vocabulary.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 현미경에서부터 수학에 이르기까지의 모든 과학적 도구와 뇌에서부터 미생물에 이르기까지의 신체의 모든 측면은 너무 깊은 전문 지식을 필요로 해서 이런 일은 잘 발생하지 않는 경향이 있다. 즉, 우리는 각각의 공동체가 그것 자신의 전문적인 어휘에 의해 나머지 다른 것들과는 구분된 채, 인간의 신체를 개별적으로 분리해서 연구하는 경향이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현실적인 제약을 지적합니다. \u003cb class=\"key\">전문성\u003c/b>이 너무 깊어지다 보니 통합되지 못하고 각 분야가 \u003cb class=\"key\">고립된 \u003c/b>\u003cb class=\"key\">형태\u003c/b>로 연구되는 문제점을 비판합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\ ool\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 신체의 특정한 한 구성 요소에\u003c/span>\u003cspan class=\"en\">or a specific component of the body,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한 종류의 세포와 같은\u003c/span>\u003cspan class=\"en\">such as one type of cell.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">연구 공동체는 한 종류의 과학적 도구 또는 한 종류의 세포와 같은 신체의 특정한 한 구성 요소에 전념할지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 연구가 세분화되는 구체적인 방식을 예로 듭니다. 도구나 대상이 \u003cb class=\"key\">극도로 \u003c/b>\u003cb class=\"key\">국한\u003c/b>되어 전체를 보지 못하는 \u003cb class=\"key\">전문화의 \u003c/b>\u003cb class=\"key\">단면\u003c/b>을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : be [동사] + dedicated [과거분사] + to [전치사] : \"~에 전념하다, 바쳐지다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Research communities may be dedicated to, 연구 공동체는 전념할지도 모른다. one type of scientific tool, 한 종류의 과학적 도구. or a specific component of the body, 또는 신체의 특정한 한 구성 요소에. such as one type of cell, 한 종류의 세포와 같은. 이 문장 전체를 해석하면, 연구 공동체는 한 종류의 과학적 도구 또는 한 종류의 세포와 같은 신체의 특정한 한 구성 요소에 전념할지도 모른다.","hl":"m"},{"n":19,"text":"과학 연구가 얼마나 좁은 분야에 집중하고 있는지를 구체적인 예시로 설명합니다. 세포 하나나 도구 하나에만 몰두하다 보면 몸 전체를 보는 시각을 잃을 수 있다는 맥락입니다.","hl":"mn"},{"n":20,"text":"여기서는 be dedicated to 표현을 꼭 기억하세요. 어디어디에 전념하다라는 뜻으로, 이때의 to는 전치사이기 때문에 뒤에 명사나 동명사 형태가 온다는 것이 특징입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 유형의 세포들이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">different \u003c/span>\u003cspan class=\"tgt\">types \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">cell \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로 어떻게 소통하는지가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">communicate \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">another\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 자체의 전문적인 주제가 된다.\u003c/span>\u003cspan class=\"en\">becomes its own specialist topic.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">다른 유형의 세포들이 서로 어떻게 소통하는지가 그 자체의 전문적인 주제가 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과학적 지식이 매우 세분화되어 있어, 세포 간의 소통이라는 지엽적인 부분조차 하나의 독립된 \u003cb class=\"key\">전문 \u003c/b>\u003cb class=\"key\">분야\u003c/b>가 되었다는 예시입니다. 연구가 개별적으로 \u003cb class=\"key\">분리\u003c/b>되어 전체를 보기 힘든 상황을 구체화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문 명사절 주어\u003c/span> : [의문사(How) + 주어(different types of cell) + 동사(communicate)] : \"다른 유형의 세포들이 서로 어떻게 소통하는지\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"How different types of cell, 다른 유형의 세포들이. communicate with one another, 서로 어떻게 소통하는지가. becomes its own specialist topic, 그 자체의 전문적인 주제가 된다.. 이 문장 전체를 해석하면, 다른 유형의 세포들이 서로 어떻게 소통하는지가 그 자체의 전문적인 주제가 된다.","hl":"m"},{"n":22,"text":"앞선 문장에서 연구 공동체가 특정 구성 요소에만 전념한다고 했죠. 그에 대한 구체적인 예시로, 세포들이 서로 대화하는 방식조차도 아주 좁고 깊은 전문 분야가 되어버렸다는 내용이에요.","hl":"mn"},{"n":23,"text":"문장의 주어가 꽤 길죠? How different types of cell communicate with one another 전체가 하나의 덩어리로 주어 역할을 하고 있어요. 이렇게 의문사가 이끄는 절이 주어일 때는 하나의 묶음으로 보아 단수 취급하기 때문에, 동사로 become이 아니라 s가 붙은 becomes가 온 것입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">심지어 지구상에 있는 단순한 형태의 생명체조차도\u003c/span>\u003cspan class=\"en\">Even simple forms of life on Earth\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제는 드물게 연구되며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">now \u003c/span>\u003cspan class=\"tgt\">rarely \u003c/span>\u003cspan class=\"tgt\">studied\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전체로서\u003c/span>\u003cspan class=\"en\">as a whole,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인간의 신체는\u003c/span>\u003cspan class=\"en\">and the human body is\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분명히 훨씬 더 복잡하다.\u003c/span>\u003cspan class=\"en\">evidently \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">more \u003c/span>\u003cspan class=\"tgt\">complex\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">심지어 지구상에 있는 단순한 형태의 생명체조차도 이제는 전체로서 연구되는 경우가 드물며, 인간의 신체는 분명히 훨씬 더 복잡하다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단순한 생물조차 \u003cb class=\"key\">전체론적\u003c/b> 관점에서 연구하기 어려울 정도로 지식이 방대해졌는데, 훨씬 복잡한 인체는 더욱 \u003cb class=\"key\">부분적\u003c/b>으로 연구될 수밖에 없음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태와 빈도부사\u003c/span> : [be동사(are) + 빈도부사(rarely) + 과거분사(studied)] : \"이제는 드물게 연구된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교급 강조\u003c/span> : [much + 비교급(more complex)] : \"훨씬 더 복잡한\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Even simple forms of life on Earth, 심지어 지구상에 있는 단순한 형태의 생명체조차도. are now rarely studied, 이제는 드물게 연구되며. as a whole, 전체로서. and the human body is, 인간의 신체는. evidently much more complex, 분명히 훨씬 더 복잡하다.. 이 문장 전체를 해석하면, 심지어 지구상에 있는 단순한 형태의 생명체조차도 이제는 전체로서 연구되는 경우가 드물며, 인간의 신체는 분명히 훨씬 더 복잡하다.","hl":"m"},{"n":25,"text":"지식이 너무 세분화되다 보니, 아주 간단한 생물도 전체적으로 파악하기 힘든 세상이 되었어요. 그런데 인간의 몸은 그보다 훨씬 더 복잡하니, 한 사람이 인간 몸 전체를 다 알기란 불가능하다는 이야기를 하고 있습니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트로 are now rarely studied 부분을 보세요. 생명체가 스스로를 연구하는 게 아니라 연구되는 것이니 수동태를 썼고, 거의 연구되지 않는다는 의미를 위해 rarely라는 단어를 넣었습니다. 두 번째로 much more complex에서 much는 비교급인 more complex를 강조해서 훨씬 더 복잡하다는 뜻을 만들어줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오래전인 1890년에도\u003c/span>\u003cspan class=\"en\">As long ago as 1890,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘The Times’ 신문은 논평했다\u003c/span>\u003cspan class=\"en\">The Times newspaper commented\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">지식이 ‘이미 되었다’라고\u003c/span>\u003cspan class=\"en\">that knowledge '\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">already \u003c/span>\u003cspan class=\"tgt\">become\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">너무 방대해져서 다루기 어렵게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">too \u003c/span>\u003cspan class=\"tgt\">vast \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">manageable\u003c/span>'.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오래전인 1890년에도 ‘The Times’ 신문은 지식이 ‘이미 너무 방대해져서 다루기 어렵게 되었다’라고 논평했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 현대의 지식 파편화 현상이 최근의 일만이 아니라, 이미 \u003cb class=\"key\">19세기 \u003c/b>\u003cb class=\"key\">말\u003c/b>부터 지식이 개인이 감당하기 힘들 정도로 \u003cb class=\"key\">팽창\u003c/b>했음을 역사적 근거로 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료\u003c/span> : [had + 과거분사(p.p.)] : \"이미 ~가 되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">too ~ to 구문\u003c/span> : [too + 형용사 + to부정사] : \"너무 방대해서 다룰 수 없는\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"As long ago as 1890, 오래전인 1890년에도. The Times newspaper commented, ‘The Times’ 신문은 논평했다. that knowledge 'had already become, 지식이 ‘이미 되었다’라고. too vast to be manageable', 너무 방대해져서 다루기 어렵게. 이 문장 전체를 해석하면, 오래전인 1890년에도 ‘The Times’ 신문은 지식이 ‘이미 너무 방대해져서 다루기 어렵게 되었다’라고 논평했다.","hl":"m"},{"n":28,"text":"이런 지식의 파편화 문제는 아주 오래전부터 시작되었어요. 무려 1890년의 신문 기사에서도 이미 지식의 양이 개인이 다룰 수 있는 수준을 넘어서서 너무 많아졌다고 걱정했다는 사실을 보여줍니다.","hl":"mn"},{"n":29,"text":"첫 번째로 had already become을 주목하세요. 신문이 과거에 말하기 그 이전부터 이미 지식이 많아진 상태였기 때문에 대과거를 나타내는 과거완료를 썼습니다. 두 번째로 핵심 표현인 too vast to be manageable은 너무 방대해서 관리할 수 없다는 부정의 의미를 담고 있는 too to 구문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날,\u003c/span>\u003cspan class=\"en\">Today,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아무도 전문가가 아니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">nobody\u003c/span> is an expert\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 것의 전체에 대한.\u003c/span>\u003cspan class=\"en\">in \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">whole \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">anything\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날 아무도 어떤 것의 전체에 대한 전문가가 아니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 지식이 너무나 방대해지고 분절된 현대 사회에서 한 분야의 \u003cb class=\"key\">전체 \u003c/b>\u003cb class=\"key\">내용\u003c/b>을 완벽히 통달하는 것은 불가능해졌음을 시사합니다. 앞서 언급된 \u003cb class=\"key\">지식의 \u003c/b>\u003cb class=\"key\">세분화\u003c/b> 현상으로 인해 발생하는 불가피한 결과를 \u003cb class=\"key\">결론적으로 \u003c/b>\u003cb class=\"key\">요약\u003c/b>하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부정 주어의 단수 취급\u003c/span> : [Nobody (부정 대명사/주어)] + [is (단수 동사)] : \"아무도 ~않다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전체 범위를 나타내는 표현\u003c/span> : [the whole of (전체)] + [anything (무엇이든)] : \"어떤 것의 전체\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Today, 오늘날. nobody is an expert, 아무도 전문가가 아니다. in the whole of anything, 어떤 것의 전체에 대한.. 이 문장 전체를 해석하면, 오늘날 아무도 어떤 것의 전체에 대한 전문가가 아니다.","hl":"m"},{"n":31,"text":"이 문장은 이 글의 마지막 결론이에요. 현대 사회는 지식이 너무나도 방대하고 복잡하게 쪼개져 있어서, 이제는 한 분야의 모든 내용 즉 모든 전체를 다 아는 전문가가 존재할 수 없다는 현실적 한계를 요약해서 보여주고 있죠.","hl":"mn"},{"n":32,"text":"중요한 어법 포인트 두 가지를 살펴볼게요. 첫 번째로 문장의 주어인 nobody입니다. 영어에서 nobody는 단수 취급을 하기 때문에 뒤에 동사 is가 온 것이 보이죠. 또한 문장에 별도의 not이 없더라도 주어 자체에 부정의 의미가 담겨 있으므로 문장 전체를 부정으로 해석해야 합니다. 두 번째는 the whole of anything이라는 표현입니다. 이것은 무엇이든 그 전체라는 뜻으로 쓰였는데요, 현대 지식이 얼마나 포괄적이고 넓은지 강조하는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>신체를 바라보는 다양한 관점은 이론적으로 서로의 이해를 도울 수 있는 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">보완적\u003c/b> 관계입니다.\u003c/li>\u003cli>현실에서는 연구 분야의 극심한 \u003cb class=\"key\">전문화\u003c/b>로 인해 각 공동체가 고립된 사일로 안에서 개별적으로 존재합니다.\u003c/li>\u003cli>각 분야만의 \u003cb class=\"key\">전문 \u003c/b>\u003cb class=\"key\">어휘\u003c/b>와 지식의 깊이는 학문 간의 소통을 방해하고 연구를 파편화시킵니다.\u003c/li>\u003cli>지식의 총량이 너무 \u003cb class=\"key\">방대해져서\u003c/b> 오늘날 어떤 분야에서도 전체를 조망하는 전문가를 찾기 어렵습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The increasing depth of scientific specialization and the vastness of knowledge isolate research communities into silos, preventing a holistic understanding of the human body.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">신체의 각 관점은 서로 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">보완\u003c/b>되어야 마땅하지만, 연구의 극단적 \u003cb class=\"key\">전문화\u003c/b>와 방대한 지식의 양으로 인해 각 분야가 고립된 \u003cb class=\"key\">사일로(silos)\u003c/b> 속에 갇혀 전체를 보지 못하고 있습니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":33,"text":"결국 현대 과학의 비극은 너무 많이 알게 되어서 정작 전체를 볼 수 없게 되었다는 점에 있습니다. 전문 용어라는 벽에 갇히지 말고 통합적인 시각을 갖는 것이 얼마나 중요한지 생각하게 만드는 지문이었네요. 오늘 배운 사일로와 전문화의 개념을 잘 복습해 두시기 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
