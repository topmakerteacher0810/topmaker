Embracing Ignorance: The Role of Curiosity in Science<small>무지의 수용: 과학에서 호기심의 역할<\/small><\/div>\n        <div class=\"lec-bkg-only\"><b class=\"lec-gr-h\">배경지식<\/b><div class=\"lec-cover-bkg-txt\">우리가 흔히 과학이라고 하면 완벽한 이론을 바탕으로 가설 검증(Hypothesis Testing)을 하는 엄격한 과정을 떠올리지만, 과학철학(Philosophy of Science)에서는 때때로 순수한 호기심 자체가 훌륭한 연구의 원동력이 된다고 봅니다. 과거에는 불필요한 의심으로 여겨졌던 인간의 호기심이 근대에 들어서며 실험철학(Experimental Philosophy)의 발전과 함께 과학적 탐구의 핵심적이고 가치 있는 요소로 자리 잡게 되었죠. 이는 마치 요리사가 정해진 완벽한 레시피만 고집하기보다 &#39;이 두 가지 엉뚱한 재료를 섞으면 과연 무슨 맛이 날까?&#39;라는 단순한 궁금증으로 새로운 요리를 시도(Experiment)해 보는 것과 같습니다. 이언 해킹(Ian Hacking)과 같은 저명한 학자들은 뻔한 결과를 미리 다 안다고 착각하는 것보다 무지(Ignorance)를 기꺼이 인정하고 일단 부딪혀보는 태도가 과학의 본질이라고 강조합니다. 따라서 이 지문을 읽으실 때, 정해진 방법론의 틀을 깨고 실패할 확률이 높은 무모한 실험(Crazy experiment)을 시도하는 것조차도 과학을 발전시키는 위대한 발걸음이 될 수 있다는 철학적 맥락을 염두에 두시면 글을 이해하는 데 큰 도움이 되실 거예요.<\/div><\/div>","<div class=\"lec-section-tag\">글의 흐름<\/div><div class=\"lec-flow lec-flow-only\"><div class=\"lec-stage\" data-hl=\"stage-0\"><div class=\"lec-stage-head\">01과학과 무지의 수용<\/div><ul><li>과학적 실험은 우리가 모든 것을 알지 못한다는 사실을 인정하는 데서 출발한다.<\/li><li>과학이 무지(ignorance)를 수용한다는 것을 실험이 증명함<\/li><li>과학자의 최악의 태도: 확인 과정 없이 결과를 안다고 가정(suppose)하는 것<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-1\"><div class=\"lec-stage-head\">02실험 철학과 호기심<\/div><ul><li>실험 중심의 철학이 등장하면서 호기심이 긍정적인 가치로 인정받게 되었다.<\/li><li>실험 철학(experimental philosophy)의 부상<\/li><li>호기심(curiosity)이 부정적인 것에서 가치 있는 속성으로 해방(liberation)됨<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-2\"><div class=\"lec-stage-head\">03방법론과 순수한 호기심<\/div><ul><li>엄격한 가설 검증 방법론이 없더라도 단순한 호기심만으로 실험을 진행할 수 있다.<\/li><li>통념: 가설 설정과 검증이라는 승인된 방법론(approved methodology)이 필수적임<\/li><li>실제: 무슨 일이 일어날지 보기 위한 순수한 호기심만으로도 실험 수행이 가능함<\/li><\/ul><\/div><div class=\"lec-stage\" data-hl=\"stage-3\"><div class=\"lec-stage-head\">04엉뚱한 실험의 가치<\/div><ul><li>결과가 보장되지 않더라도 무모한 시도를 해보는 것 자체가 과학적 의의를 지닌다.<\/li><li>성과가 없을(fruitless)지라도 완전히 미친 실험(crazy experiment)을 시도할 가치가 있음<\/li><li>핵심 교훈: 직접 시도해 보기 전에는 결과를 절대 알 수 없음(never know until you try)<\/li><\/ul><\/div><\/div>","<div class=\"lec-section-tag\">단어 정리<\/div><div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">testify to<\/td><td class=\"m\">~을 증명하다, ~을 보여주다<\/td><\/tr><tr><td class=\"w\">embrace<\/td><td class=\"m\">수용, 포용<\/td><\/tr><tr><td class=\"w\">ignorance<\/td><td class=\"m\">무지, 모름<\/td><\/tr><tr><td class=\"w\">suppose<\/td><td class=\"m\">가정하다, 추측하다<\/td><\/tr><tr><td class=\"w\">scenario<\/td><td class=\"m\">상황, 시나리오<\/td><\/tr><tr><td class=\"w\">bother<\/td><td class=\"m\">신경 쓰다, 애를 쓰다<\/td><\/tr><tr><td class=\"w\">coincide with<\/td><td class=\"m\">~과 동시에 일어나다, ~과 일치하다<\/td><\/tr><tr><td class=\"w\">liberation<\/td><td class=\"m\">해방, 자유<\/td><\/tr><tr><td class=\"w\">questionable<\/td><td class=\"m\">의심스러운, 미심쩍은<\/td><\/tr><\/tbody><\/table><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">attribute<\/td><td class=\"m\">특성, 속성<\/td><\/tr><tr><td class=\"w\">for all<\/td><td class=\"m\">~에도 불구하고<\/td><\/tr><tr><td class=\"w\">framework<\/td><td class=\"m\">틀, 체제<\/td><\/tr><tr><td class=\"w\">methodology<\/td><td class=\"m\">방법론<\/td><\/tr><tr><td class=\"w\">hypothesis<\/td><td class=\"m\">가설<\/td><\/tr><tr><td class=\"w\">conduct<\/td><td class=\"m\">수행하다, 실시하다<\/td><\/tr><tr><td class=\"w\">once in a while<\/td><td class=\"m\">가끔, 때때로<\/td><\/tr><tr><td class=\"w\">be likely to<\/td><td class=\"m\">~할 가능성이 있다, ~할 것 같다<\/td><\/tr><tr><td class=\"w\">fruitless<\/td><td class=\"m\">성과 없는, 결실 없는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 1 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Experiments <span class=\"grammar-hl\">testify<\/span><\/b><\/span><span class=\"ko\">실험들은 증명한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to<\/span> science’s embrace of ignorance.<\/b><\/span><span class=\"ko\">과학의 무지에 대한 수용을<\/span><\/div><\/div><div class=\"lec-sent-ko\">실험들은 과학의 무지에 대한 수용을 증명한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 글의 주제를 제시하는 첫 문장입니다. testify to science’s embrace of ignorance는 과학이 자신이 모든 것을 알지 못한다는 사실을 흔쾌히 인정하고 받아들인다는 점을 보여준다는 의미입니다. 실험이라는 행위 자체가 &#39;나는 결과를 모른다&#39;는 전제에서 출발함을 시사합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">testify to (관용표현): 문법 규칙으로 풀 수 없는 굳어진 어구로 &#39;~을 증명하다, ~의 증거가 되다&#39;라는 의미를 나타낸다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">testify to<\/td><td class=\"m\">~을 증명하다, ~을 보여주다<\/td><\/tr><tr><td class=\"w\">embrace<\/td><td class=\"m\">수용, 포용<\/td><\/tr><tr><td class=\"w\">ignorance<\/td><td class=\"m\">무지, 모름<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 2 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Arguably <span class=\"grammar-hl\">the worst thing a scientist can do<\/span><\/b><\/span><span class=\"ko\">거의 틀림없이 과학자가 할 수 있는 가장 최악의 것은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">is to suppose<\/span><\/b><\/span><span class=\"ko\">가정하는 것이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>they know<\/b><\/span><span class=\"ko\">그들이 안다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">what will happen<\/span><\/b><\/span><span class=\"ko\">무슨 일이 일어날지를<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in a <span class=\"grammar-hl\">given<\/span> scenario<\/b><\/span><span class=\"ko\">주어진 시나리오에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">without bothering<\/span> <span class=\"grammar-hl\">to check<\/span>.<\/b><\/span><span class=\"ko\">확인하려는 수고를 들이지 않고<\/span><\/div><\/div><div class=\"lec-sent-ko\">거의 틀림없이 과학자가 할 수 있는 가장 최악의 것은 그들이 확인하려는 수고를 들이지 않고 주어진 시나리오에서 일어날 일을 그들이 안다고 가정하는 것이다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 앞 문장의 &#39;무지의 수용&#39;과 반대되는 태도를 비판하며 주제를 뒷받침합니다. without bothering to check는 직접 실험해보는 최소한의 노력도 기울이지 않은 채 지레짐작하는 태도를 가리킵니다. 과학에서 가장 경계해야 할 태도는 다 안다고 착각하여 실험조차 시도하지 않는 오만함이라는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">the worst thing a scientist can do 관계대명사(목적격 생략): 명사 the worst thing 뒤에 목적격 관계대명사(that)가 생략되어 주어(a scientist) + 동사(can do) 형태의 절이 앞 명사를 수식하는 구조이다.<\/div><div class=\"lec-gr-item\">is to suppose (to부정사(명사적)): to suppose가 be동사(is) 뒤의 주격 보어 자리에 쓰여 명사적 용법으로 기능한다.<\/div><div class=\"lec-gr-item\">suppose they know 접속사(that 생략): 타동사 suppose의 목적어 역할을 하는 명사절을 이끄는 접속사 that이 생략된 구조이다.<\/div><div class=\"lec-gr-item\">what will happen (간접의문문): 의문대명사 what이 이끄는 절이 의문사 겸 주어 + 동사(will happen)의 어순을 취하여 타동사 know의 목적어 역할을 한다.<\/div><div class=\"lec-gr-item\">given (과거분사(형용사)): given이 뒤의 명사 scenario를 수식(= 주어진 시나리오). p.p. + N 형태의 축약된 수식 구조이다.<\/div><div class=\"lec-gr-item\">without bothering (동명사): -ing(bothering)가 전치사 without 뒤에서 목적어 역할을 하는 명사적 개념으로 쓰였다.<\/div><div class=\"lec-gr-item\">to check (to부정사(명사적)): 동사 bother의 목적어 자리에 쓰여 명사적 용법으로 기능한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">suppose<\/td><td class=\"m\">가정하다, 추측하다<\/td><\/tr><tr><td class=\"w\">scenario<\/td><td class=\"m\">상황, 시나리오<\/td><\/tr><tr><td class=\"w\">bother<\/td><td class=\"m\">신경 쓰다, 애를 쓰다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 3 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>The rise of the experimental philosophy<\/b><\/span><span class=\"ko\">실험 철학의 등장은<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">coincided<\/span><\/b><\/span><span class=\"ko\">동시에 일어났다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">with<\/span> the liberation of curiosity<\/b><\/span><span class=\"ko\">호기심의 해방과<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as a valuable rather than a questionable attribute.<\/b><\/span><span class=\"ko\">의심스러운 특성이 아닌 가치 있는 특성으로서의<\/span><\/div><\/div><div class=\"lec-sent-ko\">실험 철학의 등장은 의심스러운 특성이 아닌 가치 있는 특성으로서의 호기심의 해방과 동시에 일어났다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 과거의 철학적 배경을 언급하며 실험의 토대가 된 &#39;호기심&#39;의 중요성을 설명합니다. the liberation of curiosity는 과거에 쓸데없는 것으로 여겨지거나 억압받던 호기심이 비로소 과학 발전의 원동력으로 인정받고 자유롭게 발휘되기 시작했다는 의미입니다. 이를 통해 실험이 인간의 자연스러운 호기심에서 뻗어 나온 결과물임을 보여줍니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">coincided with (관용표현): 규칙으로 풀리지 않는 굳어진 어구로 &#39;~과 동시에 일어나다, 일치하다&#39;라는 의미를 가진다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">coincide with<\/td><td class=\"m\">~과 동시에 일어나다, ~과 일치하다<\/td><\/tr><tr><td class=\"w\">liberation<\/td><td class=\"m\">해방, 자유<\/td><\/tr><tr><td class=\"w\">questionable<\/td><td class=\"m\">의심스러운, 미심쩍은<\/td><\/tr><tr><td class=\"w\">attribute<\/td><td class=\"m\">특성, 속성<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 4 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">For all that<\/span> experimental science today <span class=\"grammar-hl\">is often assumed<\/span><\/b><\/span><span class=\"ko\">오늘날의 실험 과학은 종종 여겨지지만<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to be supported<\/span><\/b><\/span><span class=\"ko\">뒷받침되고 있다고<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>by a philosophical framework and an <span class=\"grammar-hl\">approved<\/span> methodology<\/b><\/span><span class=\"ko\">철학적 틀과 승인된 방법론에 의해<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>(“state your hypothesis and then test it”),<\/b><\/span><span class=\"ko\">(‘가설을 세우고 나서 그것을 검증하라’는)<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">the fact is that<\/span>,<\/b><\/span><span class=\"ko\">사실은 ~이다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>as philosopher of science Ian Hacking says,<\/b><\/span><span class=\"ko\">과학 철학자 Ian Hacking이 말하듯이,<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>“One can conduct an experiment<\/b><\/span><span class=\"ko\">‘누군가는 실험을 수행할 수도 있다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>simply <span class=\"grammar-hl\">out of<\/span> curiosity<\/b><\/span><span class=\"ko\">그저 호기심에서<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to see<\/span> <span class=\"grammar-hl\">what will happen<\/span>.”<\/b><\/span><span class=\"ko\">무슨 일이 일어날 것인지를 알아보기 위해’<\/span><\/div><\/div><div class=\"lec-sent-ko\">오늘날의 실험 과학은 철학적 틀과 승인된 방법론(‘가설을 세우고 나서 그것을 검증하라’)에 의해 뒷받침되고 있다고 종종 여겨지지만, 사실은 과학 철학자 Ian Hacking이 말하듯이, ‘누군가는 무슨 일이 일어날 것인지를 알아보기 위해 그저 호기심에서 실험을 수행할 수도 있다’.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 현대 과학에 대한 일반적인 통념을 짚고, 앞서 강조한 &#39;호기심&#39;이 여전히 실험의 핵심 동기임을 재차 강조합니다. For all that은 흔히 실험 과학이 딱딱한 규칙과 체계적인 가설 검증 과정만을 엄격하게 따른다고 생각하는 통념을 나타내는 구문입니다. 이어지는 내용은 촘촘한 규칙이나 체계적인 가설이 없더라도, 그저 순수한 호기심만으로 훌륭한 실험을 시작할 수 있다는 의미입니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">For all that (관용표현): 규칙으로 풀리지 않는 굳어진 어구로 &#39;~라는 사실에도 불구하고&#39;라는 의미의 접속사적 역할을 한다.<\/div><div class=\"lec-gr-item\">is often assumed to be supported (수동태): be동사(is)+p.p.(assumed) 및 to be+p.p.(supported) 구조. assume은 타동사(목적어를 취하는 동사)로 &#39;assume + O + to V&#39;의 5형식 기본구조인데 목적어가 주어로 올라가면서 수동구조(be동사+p.p.) is assumed 형태로 쓴다. 이때 뒤의 보어인 to V(to be supported)는 구조가 남는다. support 또한 타동사(목적어를 취하는 동사, 기본구조: support + O)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) to be supported(수동부정사) 형태로 쓴다.<\/div><div class=\"lec-gr-item\">approved (과거분사(형용사)): approved가 뒤의 명사 methodology를 수식(= 승인된 방법론). p.p. + N 형태의 축약된 수식 구조이다.<\/div><div class=\"lec-gr-item\">the fact is that 명사절 접속사: that이 이끄는 완전한 절이 be동사(is)의 주격 보어 역할을 하는 명사절로 쓰였다.<\/div><div class=\"lec-gr-item\">out of (관용표현): 규칙으로 풀리지 않는 숙어로 &#39;~으로부터, ~의 동기로&#39;라는 의미의 전치사구 역할을 한다.<\/div><div class=\"lec-gr-item\">to see (to부정사(부사적): 목적): in order to see로 바꿔도 뜻이 같으며, 앞의 구조에 이어져 &#39;~을 알아보기 위해&#39;라는 목적의 의미를 나타내는 부사적 용법이다.<\/div><div class=\"lec-gr-item\">what will happen (간접의문문): 의문대명사 what이 이끄는 절이 의문사 겸 주어 + 동사(will happen)의 어순을 취하여 타동사 see의 목적어 역할을 한다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">for all<\/td><td class=\"m\">~에도 불구하고<\/td><\/tr><tr><td class=\"w\">framework<\/td><td class=\"m\">틀, 체제<\/td><\/tr><tr><td class=\"w\">methodology<\/td><td class=\"m\">방법론<\/td><\/tr><tr><td class=\"w\">hypothesis<\/td><td class=\"m\">가설<\/td><\/tr><tr><td class=\"w\">conduct<\/td><td class=\"m\">수행하다, 실시하다<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 5 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>Indeed,<\/b><\/span><span class=\"ko\">게다가<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>in the view of <span class=\"grammar-hl\">Charles Darwin’s son, the astronomer George Darwin<\/span>,<\/b><\/span><span class=\"ko\">Charles Darwin의 아들인 천문학자 George Darwin의 관점에서는<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">once in a while<\/span><\/b><\/span><span class=\"ko\">가끔<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b>one should do a completely crazy experiment,<\/b><\/span><span class=\"ko\">누군가는 완전히 무모한 실험을 해야 한다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">even if<\/span> it is most likely<\/b><\/span><span class=\"ko\">비록 그것이 가능성이 대단히 크더라도<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">to prove<\/span> fruitless.<\/b><\/span><span class=\"ko\">효과 없는 것으로 증명될<\/span><\/div><\/div><div class=\"lec-sent-ko\">게다가 Charles Darwin의 아들인 천문학자 George Darwin의 관점에서는 비록 그것이 효과 없는 것으로 증명될 가능성이 대단히 크더라도 가끔 누군가는 완전히 무모한 실험을 해야 한다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 순수한 호기심에서 비롯된 실험의 구체적인 예시이자 극단적인 형태를 소개하며 앞 문장의 논리를 더욱 확장합니다. a completely crazy experiment는 기존의 이론이나 가설로는 도저히 말이 안 되는, 무모해 보일 정도로 엉뚱하고 기발한 실험을 가리킵니다. 실패할 확률이 높더라도 결과를 미리 단정 짓지 말고 일단 시도해보는 태도의 중요성을 역설합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">Charles Darwin’s son, the astronomer George Darwin (동격): 명사구(Charles Darwin’s son)와 명사구(the astronomer George Darwin)가 콤마로 연결되어 서로 같은 대상을 가리키며 보충 설명하는 구조이다.<\/div><div class=\"lec-gr-item\">once in a while (관용표현): 문법 규칙으로 풀 수 없는 굳어진 어구로 &#39;가끔, 때때로&#39;라는 의미를 나타낸다.<\/div><div class=\"lec-gr-item\">even if 접속사: 양보를 나타내는 부사절을 이끄는 접속사로 뒤에 주어+동사의 완전한 절이 이어진다.<\/div><div class=\"lec-gr-item\">to prove (to부정사(부사적): 형용사 수식): to prove 바로 앞이 형용사(likely)이므로 형용사를 수식하는 부사적 용법으로 쓰였다.<\/div><\/div>\n        <div class=\"lec-voca-wrap\"><table class=\"lec-voca-tbl\"><tbody><tr><td class=\"w\">once in a while<\/td><td class=\"m\">가끔, 때때로<\/td><\/tr><tr><td class=\"w\">be likely to<\/td><td class=\"m\">~할 가능성이 있다, ~할 것 같다<\/td><\/tr><tr><td class=\"w\">fruitless<\/td><td class=\"m\">성과 없는, 결실 없는<\/td><\/tr><\/tbody><\/table><\/div>","<div class=\"lec-sent-no\">문장 6 / 6<\/div>\n        <div data-hl=\"main\"><div class=\"lec-chunks\"><div class=\"lec-chunk\"><span class=\"en\"><b>You never know<\/b><\/span><span class=\"ko\">여러분은 절대 알 수 없다<\/span><\/div><div class=\"lec-chunk\"><span class=\"en\"><b><span class=\"grammar-hl\">until you try<\/span>.<\/b><\/span><span class=\"ko\">여러분이 시도하기 전까지는<\/span><\/div><\/div><div class=\"lec-sent-ko\">여러분은 여러분이 시도하기 전까지는 절대 알 수 없다.<\/div><\/div>\n        <div class=\"lec-grammar lec-meaning\" data-hl=\"meaning\"><b class=\"lec-gr-h\" style=\"color:#ffd9a0;\">의미<\/b> 전체 글의 메시지를 짧고 강렬한 속담으로 요약하며 마무리하는 결론입니다. 철저한 가설이나 확신이 없더라도, 과학의 본질은 일단 부딪혀보고 직접 눈으로 확인하는 실험 정신에 있다는 핵심 주제를 명쾌하게 전달합니다.<\/div>\n        <div class=\"lec-grammar\" data-hl=\"grammar\"><b class=\"lec-gr-h\">문법<\/b><div class=\"lec-gr-item\">until you try 접속사: until이 시간의 부사절 접속사로 쓰여 뒤에 주어(you) + 동사(try)가 오는 완전한 절을 이끈다.<\/div><\/div>\n        ","<div class=\"lec-section-tag\">최종 정리<\/div><div class=\"lec-final\"><div class=\"lec-overall\"><b class=\"lec-gr-h\">전체글 정리<\/b><ul class=\"lec-overall-list\"><li>과학의 바탕에는 자신이 모른다는 사실을 솔직하게 인정하는 태도가 깔려 있으며, 확인도 안 하고 다 안다고 착각하는 것이 가장 위험하다.<\/li><li>실험 과학은 과거 억눌려 있던 호기심이 긍정적인 가치로 인정받으면서 함께 발전했다.<\/li><li>현대 과학이 엄격한 가설과 체계적인 방법론에만 얽매여 있는 것 같지만, 실은 그저 결과가 궁금해서 해보는 순수한 호기심도 실험에서 아주 중요한 역할을 한다.<\/li><li>실패할 것이 뻔해 보이는 엉뚱한 실험조차도 의미가 있으며, 과학의 본질은 일단 부딪혀 확인해보는 데 있기 때문이다.<\/li><\/ul><\/div><div class=\"lec-final-sum\"><b class=\"lec-gr-h\">요약<\/b>\n              <div class=\"lec-final-sum-en\">Scientists embrace ignorance to explore the unknown, so conducting experiments out of pure curiosity is considered highly valuable.<\/div>\n              <div class=\"lec-final-sum-ko\">과학자들은 미지의 것을 탐구하기 위해 무지를 수용하므로, 순수한 호기심으로 실험을 진행하는 것은 매우 가치 있게 여겨진다.<\/div><\/div><\/div>"],"segs":[[{"audio":"./22_audio/1.mp3","hl":null}],[{"audio":"./22_audio/2.mp3","hl":null}],[{"audio":"./22_audio/3.mp3","hl":null},{"audio":"./22_audio/4.mp3","hl":"stage-0"},{"audio":"./22_audio/5.mp3","hl":"stage-1"},{"audio":"./22_audio/6.mp3","hl":"stage-2"},{"audio":"./22_audio/7.mp3","hl":"stage-3"}],[{"audio":"./22_audio/8.mp3","hl":null}],[{"audio":"./22_audio/9.mp3","hl":"main"},{"audio":"./22_audio/10.mp3","hl":"meaning"},{"audio":"./22_audio/11.mp3","hl":"grammar"}],[{"audio":"./22_audio/12.mp3","hl":"main"},{"audio":"./22_audio/13.mp3","hl":"meaning"},{"audio":"./22_audio/14.mp3","hl":"grammar"}],[{"audio":"./22_audio/15.mp3","hl":"main"},{"audio":"./22_audio/16.mp3","hl":"meaning"},{"audio":"./22_audio/17.mp3","hl":"grammar"}],[{"audio":"./22_audio/18.mp3","hl":"main"},{"audio":"./22_audio/19.mp3","hl":"meaning"},{"audio":"./22_audio/20.mp3","hl":"grammar"}],[{"audio":"./22_audio/21.mp3","hl":"main"},{"audio":"./22_audio/22.mp3","hl":"meaning"},{"audio":"./22_audio/23.mp3","hl":"grammar"}],[{"audio":"./22_audio/24.mp3","hl":"main"},{"audio":"./22_audio/25.mp3","hl":"meaning"},{"audio":"./22_audio/26.mp3","hl":"grammar"}],[{"audio":"./22_audio/27.mp3","hl":null}]],"fileName":"모의고사_고2_2025년_10월_22번_강의.html"}</script><script type="application/json" id="enpLecSource">{"app":"enpro-06","v":1,"slides":[{"kind":"cover","passageName":"모의고사 / 고2 / 2025년 / 10월 / 22번","titleEn":"Embracing Ignorance: The Role of Curiosity in Science","titleKo":"무지의 수용: 과학에서 호기심의 역할","imageUrl":"__enpImg__","stages":[{"label":"01과학과 무지의 수용","items":["과학적 실험은 우리가 모든 것을 알지 못한다는 사실을 인정하는 데서 출발한다.","과학이 무지(ignorance)를 수용한다는 것을 실험이 증명함","과학자의 최악의 태도: 확인 과정 없이 결과를 안다고 가정(suppose)하는 것"]},{"label":"02실험 철학과 호기심","items":["실험 중심의 철학이 등장하면서 호기심이 긍정적인 가치로 인정받게 되었다.","실험 철학(experimental philosophy)의 부상","호기심(curiosity)이 부정적인 것에서 가치 있는 속성으로 해방(liberation)됨"]},{"label":"03방법론과 순수한 호기심","items":["엄격한 가설 검증 방법론이 없더라도 단순한 호기심만으로 실험을 진행할 수 있다.","통념: 가설 설정과 검증이라는 승인된 방법론(approved methodology)이 필수적임","실제: 무슨 일이 일어날지 보기 위한 순수한 호기심만으로도 실험 수행이 가능함"]},{"label":"04엉뚱한 실험의 가치","items":["결과가 보장되지 않더라도 무모한 시도를 해보는 것 자체가 과학적 의의를 지닌다.","성과가 없을(fruitless)지라도 완전히 미친 실험(crazy experiment)을 시도할 가치가 있음","핵심 교훈: 직접 시도해 보기 전에는 결과를 절대 알 수 없음(never know until you try)"]}],"bkg":"우리가 흔히 과학이라고 하면 완벽한 이론을 바탕으로 가설 검증(Hypothesis Testing)을 하는 엄격한 과정을 떠올리지만, 과학철학(Philosophy of Science)에서는 때때로 순수한 호기심 자체가 훌륭한 연구의 원동력이 된다고 봅니다. 과거에는 불필요한 의심으로 여겨졌던 인간의 호기심이 근대에 들어서며 실험철학(Experimental Philosophy)의 발전과 함께 과학적 탐구의 핵심적이고 가치 있는 요소로 자리 잡게 되었죠. 이는 마치 요리사가 정해진 완벽한 레시피만 고집하기보다 '이 두 가지 엉뚱한 재료를 섞으면 과연 무슨 맛이 날까?'라는 단순한 궁금증으로 새로운 요리를 시도(Experiment)해 보는 것과 같습니다. 이언 해킹(Ian Hacking)과 같은 저명한 학자들은 뻔한 결과를 미리 다 안다고 착각하는 것보다 무지(Ignorance)를 기꺼이 인정하고 일단 부딪혀보는 태도가 과학의 본질이라고 강조합니다. 따라서 이 지문을 읽으실 때, 정해진 방법론의 틀을 깨고 실패할 확률이 높은 무모한 실험(Crazy experiment)을 시도하는 것조차도 과학을 발전시키는 위대한 발걸음이 될 수 있다는 철학적 맥락을 염두에 두시면 글을 이해하는 데 큰 도움이 되실 거예요.","ttsText":"우리가 흔히 과학이라고 하면 완벽한 이론을 바탕으로 가설 검증(Hypothesis Testing)을 하는 엄격한 과정을 떠올리지만, 과학철학(Philosophy of Science)에서는 때때로 순수한 호기심 자체가 훌륭한 연구의 원동력이 된다고 봅니다. 과거에는 불필요한 의심으로 여겨졌던 인간의 호기심이 근대에 들어서며 실험철학(Experimental Philosophy)의 발전과 함께 과학적 탐구의 핵심적이고 가치 있는 요소로 자리 잡게 되었죠. 이는 마치 요리사가 정해진 완벽한 레시피만 고집하기보다 '이 두 가지 엉뚱한 재료를 섞으면 과연 무슨 맛이 날까?'라는 단순한 궁금증으로 새로운 요리를 시도(Experiment)해 보는 것과 같습니다. 이언 해킹(Ian Hacking)과 같은 저명한 학자들은 뻔한 결과를 미리 다 안다고 착각하는 것보다 무지(Ignorance)를 기꺼이 인정하고 일단 부딪혀보는 태도가 과학의 본질이라고 강조합니다. 따라서 이 지문을 읽으실 때, 정해진 방법론의 틀을 깨고 실패할 확률이 높은 무모한 실험(Crazy experiment)을 시도하는 것조차도 과학을 발전시키는 위대한 발걸음이 될 수 있다는 철학적 맥락을 염두에 두시면 글을 이해하는 데 큰 도움이 되실 거예요.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 22번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 22번","__script":"자, 오늘 우리가 함께 공부할 지문은 '모의고사 / 고2 / 2025년 / 10월 / 22번' 입니다. 화면의 그림을 먼저 한번 볼까요? 이 글이 어떤 이야기일지 머릿속에 그려 보세요."},{"kind":"bkg","passageName":"모의고사 / 고2 / 2025년 / 10월 / 22번","titleEn":"Embracing Ignorance: The Role of Curiosity in Science","titleKo":"무지의 수용: 과학에서 호기심의 역할","imageUrl":"__enpImg__","stages":[{"label":"01과학과 무지의 수용","items":["과학적 실험은 우리가 모든 것을 알지 못한다는 사실을 인정하는 데서 출발한다.","과학이 무지(ignorance)를 수용한다는 것을 실험이 증명함","과학자의 최악의 태도: 확인 과정 없이 결과를 안다고 가정(suppose)하는 것"]},{"label":"02실험 철학과 호기심","items":["실험 중심의 철학이 등장하면서 호기심이 긍정적인 가치로 인정받게 되었다.","실험 철학(experimental philosophy)의 부상","호기심(curiosity)이 부정적인 것에서 가치 있는 속성으로 해방(liberation)됨"]},{"label":"03방법론과 순수한 호기심"," ionable attribute.","englishHtml":"<b>as a valuable rather than a questionable attribute.<\/b>","korean":"의심스러운 특성이 아닌 가치 있는 특성으로서의"}],"meaning":"과거의 철학적 배경을 언급하며 실험의 토대가 된 '호기심'의 중요성을 설명합니다. the liberation of curiosity는 과거에 쓸데없는 것으로 여겨지거나 억압받던 호기심이 비로소 과학 발전의 원동력으로 인정받고 자유롭게 발휘되기 시작했다는 의미입니다. 이를 통해 실험이 인간의 자연스러운 호기심에서 뻗어 나온 결과물임을 보여줍니다.","grammar":"coincided with (관용표현): 규칙으로 풀리지 않는 굳어진 어구로 '~과 동시에 일어나다, 일치하다'라는 의미를 가진다.","grammarItems":["coincided with (관용표현): 규칙으로 풀리지 않는 굳어진 어구로 '~과 동시에 일어나다, 일치하다'라는 의미를 가진다."],"vocab":[{"word":"coincide with","meaning":"~과 동시에 일어나다, ~과 일치하다"},{"word":"liberation","meaning":"해방, 자유"},{"word":"questionable","meaning":"의심스러운, 미심쩍은"},{"word":"attribute","meaning":"특성, 속성"}],"ttsText":"실험 철학의 등장은 의심스러운 특성이 아닌 가치 있는 특성으로서의 호기심의 해방과 동시에 일어났다.. 과거의 철학적 배경을 언급하며 실험의 토대가 된 '호기심'의 중요성을 설명합니다. the liberation of curiosity는 과거에 쓸데없는 것으로 여겨지거나 억압받던 호기심이 비로소 과학 발전의 원동력으로 인정받고 자유롭게 발휘되기 시작했다는 의미입니다. 이를 통해 실험이 인간의 자연스러운 호기심에서 뻗어 나온 결과물임을 보여줍니다.. coincided with (관용표현): 규칙으로 풀리지 않는 굳어진 어구로 '~과 동시에 일어나다, 일치하다'라는 의미를 가진다.","__passage":"모의고사 / 고2 / 2025년 / 10월 / 22번","passageName":"모의고사 / 고2 / 2025년 / 10월 / 22번","__sourcePassage":"모의고사 / 고2 / 2025년 / 10월 / 22번"},{"kind":"sentence","idx":4,"total":6,"english":"For all that experimental science today is often assumed to be supported by a philosophical framework and an approved methodology (“state your hypothesis and then test it”), the fact is that, as philosopher of science Ian Hacking says, “One can conduct an experiment simply out of curiosity to see what will happen.”","korean":"오늘날의 실험 과학은 철학적 틀과 승인된 방법론(‘가설을 세우고 나서 그것을 검증하라’)에 의해 뒷받침되고 있다고 종종 여겨지지만, 사실은 과학 철학자 Ian Hacking이 말하듯이, ‘누군가는 무슨 일이 일어날 것인지를 알아보기 위해 그저 호기심에서 실험을 수행할 수도 있다’.","chunks":[{"english":"For all that experimental science today is often assumed","englishHtml":"<b><span class=\"grammar-hl\">For all that<\/span> experimental science today <span class=\"grammar-hl\">is often assumed<\/span><\/b>","korean":"오늘날의 실험 과학은 종종 여겨지지만"},{"english":"to be supported","englishHtml":"<b><span class=\"grammar-hl\">to be supported<\/span><\/b>","korean":"뒷받침되고 있다고"},{"english":"by a philosophical framework and an approved methodology","englishHtml":"<b>by a philosophical framework and an <span class=\"grammar-hl\">approved<\/span> methodology<\/b>","korean":"철학적 틀과 승인된 방법론에 의해"},{"english":"(“state your hypothesis and then test it”),","englishHtml":"<b>(“state your hypothesis and then test it”),<\/b>","korean":"(‘가설을 세우고 나서 그것을 검증하라’는)"},{"english":"the fact is that,","englishHtml":"<b><span class=\"grammar-hl\">the fact is that<\/span>,<\/b>","korean":"사실은 ~이다"},{"english":"as philosopher of science Ian Hacking says,","englishHtml":"<b>as philosopher of science Ian Hacking says,<\/b>","korean":"과학 철학자 Ian Hacking이 말하듯이,"},{"english":"“One can conduct an experiment","englishHtml":"<b>“One can conduct an experiment<\/b>","korean":"‘누군가는 실험을 수행할 수도 있다"},{"english":"simply out of curiosity","englishHtml":"<b>simply <span class=\"grammar-hl\">out of<\/span> curiosity<\/b>","korean":"그저 호기심에서"},{"english":"to see what will happen.”","englishHtml":"<b><span class=\"grammar-hl\">to see<\/span> <span class=\"grammar-hl\">what will happen<\/span>.”<\/b>","korean":"무슨 일이 일어날 것인지를 알아보기 위해’"}],"meaning":"현대 과학에 대한 일반적인 통념을 짚고, 앞서 강조한 '호기심'이 여전히 실험의 핵심 동기임을 재차 강조합니다. For all that은 흔히 실험 과학이 딱딱한 규칙과 체계적인 가설 검증 과정만을 엄격하게 따른다고 생각하는 통념을 나타내는 구문입니다. 이어지는 내용은 촘촘한 규칙이나 체계적인 가설이 없더라도, 그저 순수한 호기심만으로 훌륭한 실험을 시작할 수 있다는 의미입니다.","grammar":"For all that (관용표현): 규칙으로 풀리지 않는 굳어진 어구로 '~라는 사실에도 불구하고'라는 의미의 접속사적 역할을 한다. is often assumed to be supported (수동태): be동사(is)+p.p.(assumed) 및 to be+p.p.(supported) 구조. assume은 타동사(목적어를 취하는 동사)로 'assume + O + to V'의 5형식 기본구조인데 목적어가 주어로 올라가면서 수동구조(be동사+p.p.) is assumed 형태로 쓴다. 이때 뒤의 보어인 to V(to be supported)는 구조가 남는다. support 또한 타동사(목적어를 취하는 동사, 기본구조: support + O)인데, 뒤에 목적어가 없어서 수동구조(be동사+p.p.) to be supported(수동부정사) 형태로 쓴다. approved (과거분사(형용사)): approved가 뒤의 명사 methodology를 수식(= 승인된 방법론). p.p. + N 형태의
