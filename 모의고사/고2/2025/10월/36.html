<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 36번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 36번","audioDir":"36_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">36번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>Osmosis: How Sea Creatures Balance Water and Salt\u003c/h1>\u003ch2>삼투 현상: 해양 생물이 수분과 소금의 균형을 맞추는 법\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>\u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">생물\u003c/b>이 생존을 위해 수분을 섭취하고 여분의 소금을 조절하며, 체액과 바닷물의 \u003cb class=\"key\">염도 \u003c/b>\u003cb class=\"key\">차이\u003c/b>에 따라 수분이 이동하는 \u003cb class=\"key\">삼투 \u003c/b>\u003cb class=\"key\">현상\u003c/b>의 원리를 설명한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Sea creatures manage their internal water levels based on the principle of osmosis, where water moves toward higher salt concentrations.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분, 오늘은 해양 생물이 바다라는 짠물 속에서 어떻게 수분 균형을 유지하며 살아가는지에 대해 배워볼 거예요. 물속에 살면서도 물을 섭취해야 하는 해양 생물의 독특한 생존 전략을 요약과 요지를 통해 먼저 정리해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문은 생물학의 \u003cb class=\"key\">삼투 \u003c/b>\u003cb class=\"key\">현상\u003c/b>(Osmosis) 원리를 다루고 있습니다. 농도가 낮은 쪽에서 높은 쪽으로 \u003cb class=\"key\">용매\u003c/b>(물)가 이동하는 현상인데, 마치 마른 \u003cb class=\"key\">스펀지\u003c/b>가 물을 빨아들이는 것과 비슷합니다. 바다에 사는 동물들은 주변의 \u003cb class=\"key\">염분\u003c/b>(Salinity) 농도에 따라 체내 수분량이 변하는 도전에 직면합니다. 만약 체액보다 바닷물이 더 짜다면 수분을 뺏기게 되는데, 이를 방지하기 위해 정교한 \u003cb class=\"key\">수분 \u003c/b>\u003cb class=\"key\">조절\u003c/b> 기제를 갖추고 있습니다. 마치 배추를 소금에 절일 때 배추 속의 물이 밖으로 빠져나오는 것과 같은 원리입니다.\u003c/div>","segs":[{"n":2,"text":"이 글을 완벽히 이해하려면 삼투 현상이라는 과학적 원리를 알아야 해요. 소금의 농도가 높은 곳이 스펀지처럼 주변의 물을 끌어당기는 성질인데, 우리가 김장할 때 배추를 소금에 절이면 물이 빠져나오는 것과 동일한 원리라고 이해하면 아주 쉽습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>물 섭취와 소금 조절\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>해양 생물이 살기 위해 물을 마셔야 하지만, 동시에 물과 함께 들어오는 \u003cb class=\"key\">여분의 \u003c/b>\u003cb class=\"key\">소금\u003c/b>을 제거해야 함을 강조하며 \u003cb class=\"key\">글의 \u003c/b>\u003cb class=\"key\">소재\u003c/b>를 던집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>소금의 흡수 성질 예시\u003csmall>예시 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>소금이 마치 \u003cb class=\"key\">스펀지\u003c/b>처럼 물을 흡수한다는 점을 보여주기 위해, 접시 위 소금 더미가 물을 흡수해 \u003cb class=\"key\">부피가 \u003c/b>\u003cb class=\"key\">커지는\u003c/b> 실험적 비유를 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>동일 원리의 생물학적 적용\u003csmall>전환 및 적용 · 문장 7–9\u003c/small>\u003c/h4>\u003cp>앞선 비유를 \u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">생물\u003c/b>에게 적용하여, 체액이 바닷물보다 짤 경우 \u003cb class=\"key\">수분 \u003c/b>\u003cb class=\"key\">흡수\u003c/b>로 인해 몸이 \u003cb class=\"key\">부풀어 \u003c/b>\u003cb class=\"key\">오름\u003c/b>을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>반대 상황의 대조\u003csmall>대조 및 결론 · 문장 10\u003c/small>\u003c/h4>\u003cp>반대로 바닷물의 염도가 더 높을 때, 몸에서 수분이 빠져나가는 \u003cb class=\"key\">탈수 \u003c/b>\u003cb class=\"key\">현상\u003c/b>과 그로 인한 \u003cb class=\"key\">수축\u003c/b>을 대조하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 소금의 물 흡수 성질을 보여주는 일상적인 비유에서 시작해서, 이를 실제 해양 생물의 두 가지 대조적인 상황에 적용하는 방식으로 흐릅니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 해양 생물이 물을 마셔야 한다는 생존 조건과 동시에 소금 제거라는 숙제를 안고 있다는 점을 언급하며 도입합니다.","hl":"f0"},{"n":5,"text":"세 번째부터 여섯 번째 문장에서는 접시 위 소금 더미가 물을 만나 부피가 커지는 과정을 상세히 묘사하여 소금의 물리적 특성을 예시로 보여주죠.","hl":"f1"},{"n":6,"text":"일곱 번째부터 아홉 번째 문장에서는 이 원리를 생물에게 적용하여, 체액이 더 짤 때 주변 바닷물을 수분 흡수해서 몸이 부풀어 오름을 설명합니다.","hl":"f2"},{"n":7,"text":"마지막 열 번째 문장에서는 반대로 바닷물이 더 짤 때 몸에서 물이 빠져나가는 탈수와 수축 현상을 대조하며 내용을 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 7번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">전반부에서 소금의 \u003cb class=\"key\">물 \u003c/b>\u003cb class=\"key\">흡수 \u003c/b>\u003cb class=\"key\">성질\u003c/b>을 일상적인 비유로 설명한 뒤, 일곱 번째 문장을 기점으로 이를 \u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">생물\u003c/b>에게 적용합니다. 특히 마지막 문장에서 \u003cb class=\"key\">On \u003c/b>\u003cb class=\"key\">the \u003c/b>\u003cb class=\"key\">other \u003c/b>\u003cb class=\"key\">hand\u003c/b>를 사용하여 체액과 바닷물의 농도 차이에 따른 \u003cb class=\"key\">상반된 \u003c/b>\u003cb class=\"key\">결과\u003c/b>를 명확히 대조하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Now (5)\u003c/b>\u003cspan>비유적 실험의 결과 제시\u003c/span>\u003cb>The same principle applies to (7)\u003c/b>\u003cspan>비유를 실제 생물학적 원리로 연결\u003c/span>\u003cb>On the other hand (10)\u003c/b>\u003cspan>대조적인 농도 상황 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">sea creatures\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">sea animal\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">creature's body\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">them\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>체액의 염도가 더 높을 때\u003c/th>\u003cth>바닷물의 염도가 더 높을 때\u003c/th>\u003c/tr>\u003ctr>\u003ctd>체내 여분 소금이 바닷물 흡수\u003c/td>\u003ctd>바닷물 소금이 체액을 끌어냄\u003c/td>\u003c/tr>\u003ctr>\u003ctd>몸이 부풀어 오름 (swell up)\u003c/td>\u003ctd>탈수 및 쪼그라듬 (dehydrate and shrink)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 지문은 소금의 성질이라는 일반적 사실을 생물학적 현상과 연결 짓는 비교와 대조의 형식을 취하고 있어요. 특히 전반부의 비유가 후반부의 실제 원리로 이어지는 중괄식 구조를 보여주고 있습니다.","hl":"ty"},{"n":9,"text":"다섯 번째 문장의 Now는 실험의 결과를 도출하고, 일곱 번째 문장의 The same principle applies to는 비유를 실체에 적용하는 신호예요. 특히 마지막 문장의 On the other hand는 상황이 완전히 반전되는 대조의 핵심 열쇠입니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>sea creature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해양 생물\u003c/span>\u003c/div>\u003cdiv>\u003cb>take in\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>섭취하다, 흡수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>function\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기능하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>properly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>적절하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>get rid of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>제거하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>extra\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>여분의\u003c/span>\u003c/div>\u003cdiv>\u003cb>absorb\u003c/b>\u003cem>동사\u003c/em>\u003cspan>흡수하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sponge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>스펀지\u003c/span>\u003c/div>\u003cdiv>\u003cb>tiny\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>조그만, 아주 작은\u003c/span>\u003c/div>\u003cdiv>\u003cb>mountain\u003c/b>\u003cem>명사\u003c/em>\u003cspan>더미, 산\u003c/span>\u003c/div>\u003cdiv>\u003cb>plate\u003c/b>\u003cem>명사\u003c/em>\u003cspan>접시\u003c/span>\u003c/div>\u003cdiv>\u003cb>edge\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가장자리\u003c/span>\u003c/div>\u003cdiv>\u003cb>pile\u003c/b>\u003cem>명사\u003c/em>\u003cspan>더미\u003c/span>\u003c/div>\u003cdiv>\u003cb>increase\u003c/b>\u003cem>동사\u003c/em>\u003cspan>증가하다, 커지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>principle\u003c/b>\u003cem>명사\u003c/em>\u003cspan>원리\u003c/span>\u003c/div>\u003cdiv>\u003cb>apply to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>적용되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>body fluid\u003c/b>\u003cem>명사\u003c/em>\u003cspan>체액\u003c/span>\u003c/div>\u003cdiv>\u003cb>swell up\u003c/b>\u003cem>숙어\u003c/em>\u0 lass=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">making \u003c/span>\u003cspan class=\"tgt\">sure\u003c/span> an edge touches the salt,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 소금은 물을 흡수할 것이다.\u003c/span>\u003cspan class=\"en\">the salt will absorb the water.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">만약 여러분이 작은 접시 위에 조그만 소금 더미를 쌓고, 그러고, 나서 그 옆에 충분한 물을 부어 가장자리가 소금에 확실히 닿게 하면, 그 소금은 물을 흡수할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소금이 주변의 물을 빨아들이는 성질을 독자가 이해하기 쉽게 일상적인 \u003cb class=\"key\">소금 \u003c/b>\u003cb class=\"key\">실험\u003c/b>을 예로 들어 설명합니다. 본격적인 \u003cb class=\"key\">삼투 \u003c/b>\u003cb class=\"key\">현상\u003c/b> 원리를 제시하기 전 시각적 이미지를 제공하는 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : V-ing + (that) + S + V : \"확실히 ~하게 하면서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : If + S + V1(put) ... then + V2(add) : \"놓고 ... 그리고 부으면\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"If you put a tiny mountain of salt, 만약 여러분이 조그만 소금 더미를 쌓고. on a small plate, 작은 접시 위에. then add enough water to the side, 그러고, 나서 그 옆에 충분한 물을 부어. making sure an edge touches the salt, 가장자리가 소금에 확실히 닿게 하면. the salt will absorb the water, 그 소금은 물을 흡수할 것이다.. 이 문장 전체를 해석하면, 만약 여러분이 작은 접시 위에 조그만 소금 더미를 쌓고, 그러고, 나서 그 옆에 충분한 물을 부어 가장자리가 소금에 확실히 닿게 하면, 그 소금은 물을 흡수할 것이다.","hl":"m"},{"n":22,"text":"소금이 물을 빨아들이는 성질을 우리가 주변에서 해볼 수 있는 소금 실험 예시로 보여주고 있어요. 삼투 현상이라는 어려운 개념을 설명하기 전에 독자가 이해를 돕도록 시각화하는 과정이죠.","hl":"mn"},{"n":23,"text":"이 문장에는 접속사 If에 연결된 동사 put과 add가 병렬 구조를 이루고 있어요. 그리고 making sure는 분사구문으로 쓰여서 확실히 그렇게 되게 하라는 부수적인 상황을 나타내 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이제 여 03c/div>\u003cdiv class=\"lp-ko\">이것은 그것들이 부풀어 오르게 하는 원인이 될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물이 체내로 과도하게 유입된 직접적인 \u003cb class=\"key\">결과\u003c/b>로 인해 세포나 몸이 \u003cb class=\"key\">팽창\u003c/b>하게 됨을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문형 (cause + 목적어 + to부정사)\u003c/span> : cause + [목적어] + [to부정사(목적격 보어)] : \"그것들이 부풀어 오르게 원인이 되다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"This, 이것은. can cause them, 그것들이 원인이 될 수 있다. to swell up, 부풀어 오르게 하는.. 이 문장 전체를 해석하면, 이것은 그것들이 부풀어 오르게 하는 원인이 될 수 있다.","hl":"m"},{"n":37,"text":"앞 문장에서 바닷물을 흡수한다고 했죠? 그 결과로 인해 몸 안에 물이 가득 차면서 생물의 몸이 빵빵하게 부풀어 오르는 결과가 생긴다는 뜻이에요.","hl":"mn"},{"n":38,"text":"여기서 핵심은 cause입니다. 동사 cause는 목적어 다음에 오는 보어 자리에 반드시 to swell up처럼 to부정사를 써야 한다는 문법 규칙을 꼭 기억해야 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반대로, 만약 바닷물 속 소금의 함유량이\u003c/span>\u003cspan class=\"en\">On the other hand, if the amount of salt in the seawater\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">해양 동물의 체액 안의 소금의 함유량보다 더 높다면,\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">higher \u003c/span>\u003cspan class=\"tgt\">than\u003c/span> the amount of salt in the body fluids of a sea animal,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바닷물 속의 여분 소금이 생물의 몸으로부터 체액을 끌어내게 되고,\u003c/span>\u003cspan class=\"en\">the extra salt in the water will draw fluids out of the creature's body,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 수분이 빠져 쪼그라들게 하는 원인이 된다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">causing\u003c/span> it to dehydrate and shrink.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반대로, 만약 바닷물 속 소금의 함유량이 해양 동물의 체액 안의 소금의 함유량보다 더 높다면, 바닷물 속의 여분 소금이 생물의 몸으로부터 체액을 끌어내게 되고, 그것이 수분이 빠져 쪼그라들게 하는 원인이 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주변 바닷물의 염분 농도가 동물의 체액보다 더 높을 때 일어나는 \u003cb class=\"key\">삼투 \u003c/b>\u003cb class=\"key\">현상\u003c/b>의 반대 사례를 설명합니다. 소금이 수분을 흡수하는 성질 때문에 생명체 내부의 수분을 뺏겨 \u003cb class=\"key\">탈수\u003c/b>와 \u003cb class=\"key\">수축\u003c/b>이 일어나는 과정을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">비교급 형용사\u003c/span> : higher [비교급 형용사] + than [비교 대상] : \"~보다 더 높은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문의 결과 용법\u003c/span> : [앞 문장], + [causing (현재분사구)] : \"그것이 ~하는 원인이 된다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">5형식 구문 (cause + 목적어 + to부정사)\u003c/span> : cause [동사] + it [목적어] + to dehydrate [목적격 보어] : \"그것이 수분이 빠지게 하다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"On the other hand, if the amount of salt in the seawater, 반대로, 만약 바닷물 속 소금의 함유량이. is higher than the amount of salt in the body fluids of a sea animal, 해양 동물의 체액 안의 소금의 함유량보다 더 높다면. the extra salt in the water will draw fluids out of the creature's body, 바닷물 속의 여분 소금이 생물의 몸으로부터 체액을 끌어내게 되고. causing it to dehydrate and shrink, 그것이 수분이 빠져 쪼그라들게 하는 원인이 된다.. 이 문장 전체를 해석하면, 반대로, 만약 바닷물 속 소금의 함유량이 해양 동물의 체액 안의 소금의 함유량보다 더 높다면, 바닷물 속의 여분 소금이 생물의 몸으로부터 체액을 끌어내게 되고, 그것이 수분이 빠져 쪼그라들게 하는 원인이 된다.","hl":"m"},{"n":40,"text":"앞선 내용과는 반대로 주변의 소금 농도가 동물의 몸 안보다 더 높을 때 발생하는 삼투 현상을 설명하고 있어요. 바깥쪽의 높은 염분이 몸 안의 수분을 밖으로 빼앗아 가면서 생기는 탈수와 수축 과정을 보여주는 문장입니다.","hl":"mn"},{"n":41,"text":"첫 번째로 higher than은 비교급 표현으로 바닷물과 체액의 소금 농도를 비교하고 있습니다. 두 번째로 문장 끝에 나오는 causing은 분사구문으로 앞 문장 전체의 결과를 나타내며, 세 번째로 cause 뒤에 목적어 it과 목적격 보어 to dehydrate가 쓰인 오형식 구조에서 반드시 to부정사를 써야 한다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>해양 생물은 생존을 위해 물을 \u003cb class=\"key\">섭취\u003c/b>해야 하지만 수반되는 과도한 소금을 \u003cb class=\"key\">제거\u003c/b>하는 과정이 필수적입니다.\u003c/li>\u003cli>소금은 \u003cb class=\"key\">스펀지\u003c/b>와 같이 주변의 물을 빨아들이는 성질이 있어 수분의 \u003cb class=\"key\">이동 \u003c/b>\u003cb class=\"key\">방향\u003c/b>을 결정합니다.\u003c/li>\u003cli>해양 동물의 체액이 바닷물보다 더 짜면, 체내 소금이 물을 흡수하여 몸이 \u003cb class=\"key\">부풀어\u003c/b> 오르게 됩니다.\u003c/li>\u003cli>반대로 바닷물의 염도가 더 높으면 체액이 밖으로 빠져나가 \u003cb class=\"key\">탈수\u003c/b>와 \u003cb class=\"key\">수축\u003c/b>이 일어납니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Sea creatures manage their internal water levels based on the principle of osmosis, where water moves toward higher salt concentrations.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">\u003cb class=\"key\">해양 \u003c/b>\u003cb class=\"key\">생물\u003c/b>이 생존을 위해 수분을 섭취하고 여분의 소금을 조절하며, 체액과 바닷물의 \u003cb class=\"key\">염도 \u003c/b>\u003cb class=\"key\">차이\u003c/b>에 따라 수분이 이동하는 \u003cb class=\"key\">삼투 \u003c/b>\u003cb class=\"key\">현상\u003c/b>의 원리를 설명한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"결국 소금 농도가 높은 곳으로 물이 이동한다는 간단한 원리가 해양 생물의 형태를 결정한다는 사실이 흥미롭지 않나요? 염도 차이에 따른 수분의 이동 방향을 머릿속에 꼭 저장해 두시기 바랍니다. 오늘 강의 여기서 마칠게요.","hl":null}]}]});</script></body></html>
