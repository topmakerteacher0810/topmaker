<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 19번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 19번","audioDir":"19_audio","preview":false,"count":51,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">19번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>Lost in the Dark Forest, Saved by a Scent\u003c/h1>\u003ch2>어둠 속의 방황, 향기가 이끈 구원\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>집으로 가던 중 \u003cb class=\"key\">암흑의 \u003c/b>\u003cb class=\"key\">숲\u003c/b>에서 길을 잃고 부상을 입어 \u003cb class=\"key\">절망\u003c/b>에 빠졌으나, 우연히 맡게 된 \u003cb class=\"key\">요리 \u003c/b>\u003cb class=\"key\">냄새\u003c/b>를 따라가 삼촌의 오두막을 발견하고 안도하게 되는 과정입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A terrifying experience of being lost in a dark forest turns into relief and hope when the narrator finds a familiar cabin guided by a scent.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요! 오늘은 한 사람의 긴박한 조난 상황과 극적인 반전을 다룬 지문을 공부해 볼 거예요. 이 글은 주인공이 어두운 숲에서 길을 잃었다가 삼촌의 오두막을 발견하며 안도하는 과정을 담고 있죠. 위기에서 희망으로 변하는 심경 변화에 주목해 봅시다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">숲에서 길을 잃는 상황은 고립과 \u003cb class=\"key\">생존 \u003c/b>\u003cb class=\"key\">본능\u003c/b>(survival instinct)을 자극하는 전형적인 문학적 장치입니다. 빛이 전혀 없는 \u003cb class=\"key\">완전한 \u003c/b>\u003cb class=\"key\">어둠\u003c/b>(pitch darkness)은 인간에게 심리적 \u003cb class=\"key\">공포\u003c/b>(terror)와 방향 감각 상실을 일으킵니다. 이는 마치 잘 아는 동네에서 갑자기 \u003cb class=\"key\">정전\u003c/b>(blackout)이 일어나 아무것도 보이지 않는 상황과 비슷합니다. 이때 시각이 차단되면 인간의 \u003cb class=\"key\">감각\u003c/b>(senses)은 후각이나 청각에 더 의존하게 되는데, 본 지문에서도 \u003cb class=\"key\">후각\u003c/b>이 구원의 결정적 실마리가 됩니다.\u003c/div>","segs":[{"n":2,"text":"여러분, 숲속에서 갑자기 전등이 꺼진 듯한 암흑을 만난다고 상상해 보세요. 이런 고립된 상황에서는 시각이 마비되면서 누구나 큰 공포를 느끼게 됩니다. 이때 우리 몸의 생존 본능은 시각 대신 후각 같은 다른 감각에 의존하게 되는데, 오늘 지문이 딱 그런 상황을 묘사하고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>갑작스러운 암흑\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>집으로 가던 중 예기치 못한 \u003cb class=\"key\">완전한 \u003c/b>\u003cb class=\"key\">어둠\u003c/b>을 만나 숲속에 갇히게 됩니다. 익숙한 길이 갑자기 \u003cb class=\"key\">공포의 \u003c/b>\u003cb class=\"key\">공간\u003c/b>으로 변하는 전환점을 보여줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>시련과 절망\u003csmall>전개 · 문장 3–6\u003c/small>\u003c/h4>\u003cp>비틀거리다 넘어져 \u003cb class=\"key\">부상\u003c/b>을 입게 되고, 육체적 고통과 함께 심한 \u003cb class=\"key\">자포자기\u003c/b> 상태에 빠집니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>심화되는 고립\u003csmall>심화 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>자신의 위치를 전혀 알 수 없는 \u003cb class=\"key\">방향 \u003c/b>\u003cb class=\"key\">상실\u003c/b>과 아무도 자신을 찾지 않을 것이라는 \u003cb class=\"key\">두려움\u003c/b>을 토로합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>구원의 발견\u003csmall>결론 · 문장 9–13\u003c/small>\u003c/h4>\u003cp>어둠 속에서 \u003cb class=\"key\">요리 \u003c/b>\u003cb class=\"key\">냄새\u003c/b>를 발견하고 이를 따라가 삼촌의 \u003cb class=\"key\">오두막\u003c/b>에 도착하며 마침내 고난을 끝냅니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"자, 주인공이 겪는 감정의 변화를 네 단계로 나누어 따라가 볼게요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 평온하게 집으로 향하던 주인공이 갑자기 빛이 하나도 없는 암흑의 숲에 갇히게 되는 당혹스러운 상황을 보여줍니다.","hl":"f0"},{"n":5,"text":"세 번째부터 여섯 번째 문장까지는 주인공이 비틀거리다 넘어져 부상을 입고, 나무에 기댄 채 깊은 절망감에 빠지는 과정을 묘사하고 있어요.","hl":"f1"},{"n":6,"text":"일곱 번째와 여덟 번째 문장은 주인공이 자신의 위치를 전혀 모른다는 고립감과 아무도 자신을 찾지 않을지도 모른다는 불안감을 독백으로 표현합니다.","hl":"f2"},{"n":7,"text":"아홉 번째 문장부터 마지막까지는 요리 냄새와 빛을 따라가 삼촌의 오두막에 도착하며 마침내 고난이 끝났음을 선언하며 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 13번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">이 글은 주인공이 겪는 조난 상황부터 해결까지 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 서술하고 있습니다. 초반의 부정적인 상황이 후반부에 \u003cb class=\"key\">반전\u003c/b>되며 해결되는 구조이며, 마지막 문장에서 모든 \u003cb class=\"key\">고난의 \u003c/b>\u003cb class=\"key\">종료\u003c/b>를 선언하며 주제를 완성합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>But (2)\u003c/b>\u003cspan>상황의 급변\u003c/span>\u003cb>It was then that (9)\u003c/b>\u003cspan>새로운 국면의 시작\u003c/span>\u003cb>soon (10)\u003c/b>\u003cspan>진행 속도감\u003c/span>\u003cb>finally (12)\u003c/b>\u003cspan>최종 해결\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">black forest\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">no idea where I am\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">desperation\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">hardship\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">scent of cooking\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">yellowish light\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Uncle Krull's cabin\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 시간의 흐름에 따라 상황이 전개되는 시간순 구성을 취하고 있어요. 처음에는 문제가 발생했다가 마지막에 해결되는 미괄식 구조로, 주인공의 심리가 극적으로 바뀝니다.","hl":"ty"},{"n":9,"text":"두 번째 문장의 But은 분위기의 급격한 반전을, 아홉 번째 문장의 It was then은 구원의 시작을 알리는 중요한 신호어입니다. 또한 faint aroma와 scent of cooking은 주인공을 살리는 결정적 단서로 재진술되고 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>heading\u003c/b>\u003cem>동사\u003c/em>\u003cspan>향하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>direction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방향\u003c/span>\u003c/div>\u003cdiv>\u003cb>forest road\u003c/b>\u003cem>명사\u003c/em>\u003cspan>숲길\u003c/span>\u003c/div>\u003cdiv>\u003cb>switch off\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>불을 끄다\u003c/span>\u003c/div>\u003cdiv>\u003cb>black forest\u003c/b>\u003cem>명사\u003c/em>\u003cspan>암흑의 숲\u003c/span>\u003c/div>\u003cdiv>\u003cb>lost\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>길을 잃은\u003c/span>\u003c/div>\u003cdiv>\u003cb>stumble\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비틀거리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>fall\u003c/b>\u003cem>동사\u003c/em>\u003cspan>넘어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>tore\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찢다 (tear의 과거)\u003c/span>\u003c/div>\u003cdiv>\u003cb>injure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>다치게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>hill\u003c/b>\u003cem>명사\u003c/em>\u003cspan>언덕\u003c/span>\u003c/div>\u003cdiv>\u003cb>desperation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>자포자기, 절망\u003c/span>\u003c/div>\u003cdiv>\u003cb>lean against\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 기대다\u003c/span>\u003c/div>\u003cdiv>\u003cb>no idea\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>전혀 모르다\u003c/span>\u003c/div>\u003cdiv>\u003cb>notice\u003c/b>\u003cem>동사\u003c/em>\u003cspan>알아차리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>faint\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>희미한\u003c/span>\u003c/div>\u003cdiv>\u003cb>aroma\u003c/b>\u003cem>명사\u003c/em>\u003cspan>향기\u003c/span>\u003c/div>\u003cdiv>\u003cb>drift\u003c/b>\u003cem>동사\u003c/em>\u003cspan>떠돌다, 떠내려오다\u003c/span>\u003c/div>\u003cdiv>\u003cb>darkness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>어둠\u003c/span>\u003c/div>\u003cdiv>\u003cb>scent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>냄새, 향기\u003c/span>\u003c/div>\u003cdiv>\u003cb>yellowish\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>누르스름한\u003c/span>\u003c/div>\u003cdiv>\u003cb>glow\u003c/b>\u003cem>동사\u003c/em>\u003cspan>빛나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cabin\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오두막\u003c/span>\u003c/div>\u003cdiv>\u003cb>thankful\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>감사하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>beyond words\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>말로 표현할 수 없을 정도로\u003c/span>\u003c/div>\u003cdiv>\u003cb>hardship\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고난\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 stumble은 비틀거린다는 뜻이고, aroma나 scent는 기분 좋은 향기를 뜻합니다. 절망을 뜻하는 desperation이 마지막에 hardship이 over되었다는 표현과 대조를 이루는 것도 확인하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">stumble\u003c/b>\u003cspan class=\"m\">비틀거리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">lurch\u003c/span>\u003cspan class=\"s\">stagger\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stride\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">desperation\u003c/b>\u003cspan class=\"m\">절망\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">despair\u003c/span>\u003cspan class=\"s\">hopelessness\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">hope\u003c/span>\u003cspan class=\"a\">optimism\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">faint\u003c/b>\u003cspan class=\"m\">희미한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">dim\u003c/span>\u003cspan class=\"s\">vague\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">bright\u003c/span>\u003cspan class=\"a\">clear\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">aroma\u003c/b>\u003cspan class=\"m\">향기\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">scent\u003c/span>\u003cspan class=\"s\">fragrance\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">stench\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">thankful\u003c/b>\u003cspan class=\"m\">감사하는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">grateful\u003c/span>\u003cspan class=\"s\">appreciative\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">ungrateful\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">hardship\u003c/b>\u003cspan class=\"m\">고난\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adversity\u003c/span>\u003cspan class=\"s\">ordeal\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">comfort\u003c/span>\u003cspan class=\"a\">ease\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"stumble의 동의어로는 stagger가 있고, 반대말로는 씩씩하게 걷는 stride를 기억하세요. 고난을 뜻하는 hardship의 동의어로는 adversity가 자주 출제되니 꼭 함께 외워둡시다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 향하고 있었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">heading\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">방향으로\u003c/span>\u003cspan class=\"en\">in the direction of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">숲길\u003c/span>\u003cspan class=\"en\">a forest road\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 알고 있던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">knew\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나를 집으로 데려다줄 것이라고\u003c/span>\u003cspan class=\"en\">would take me home.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나를 집으로 데려다줄 것이라고 내가 알고 있던 숲길 방향으로 나는 향하고 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공이 집으로 가기 위해 익숙하다고 믿는 길을 선택하여 이동하는 \u003cb class=\"key\">목적지\u003c/b>와 \u003cb class=\"key\">방향성\u003c/b>을 보여주는 시작 부분입니다. '내가 알고 있었다'는 표현은 이후 벌어질 예상치 못한 상황과 \u003cb class=\"key\">대조\u003c/b>를 이룹니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거진행형\u003c/span> : be동사 과거형(was/were) + [heading (v-ing)] : \"향하고 있었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : [a forest road (선행사)] + that + [V...] : \"~하는 (숲길)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">삽입절\u003c/span> : [관계대명사] + [I knew (S+V)] + [V...] : \"내가 알기에 / 내가 알고 있던\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"I was heading, 나는 향하고 있었다. in the direction of, 방향으로. a forest road, 숲길. that I knew, 내가 알고 있던. would take me home, 나를 집으로 데려다줄 것이라고. 이 문장 전체를 해석하면, 나를 집으로 데려다줄 것이라고 내가 알고 있던 숲길 방향으로 나는 향하고 있었다.","hl":"m"},{"n":13,"text":"이 문장은 주인공이 집으로 가기 위해 자신이 잘 안다고 생각하는 숲길로 들어서는 장면입니다. 여기서 주인공이 가진 확신은 나중에 겪게 될 공포감과 큰 대비를 이루는 장치가 됩니다.","hl":"mn"},{"n":14,"text":"첫 번째로 I was heading은 비 동사의 과거형과 현재분사가 결합한 과거진행형으로 당시의 동작을 강조합니다. 두 번째로 that은 선행사인 a forest road를 설명하는 주격 관계대명사예요. 세 번째로 I knew는 관계대명사 절 안에 쏙 들어간 삽입절로, 내가 그렇게 알고 있었다는 주관적 확신을 더해줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만 마치 ~인 것처럼\u003c/span>\u003cspan class=\"en\">But almost \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">though\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가가 꺼 버린 것처럼\u003c/span>\u003cspan class=\"en\">someone \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">switched \u003c/span>\u003cspan class=\"tgt\">off\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 불을\u003c/span>\u003cspan class=\"en\">all the lights\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 갑자기 있었다\u003c/span>\u003cspan class=\"en\">I was suddenly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">암흑의 숲속에\u003c/span>\u003cspan class=\"en\">in a black forest\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 종류의 빛도 없는\u003c/span>\u003cspan class=\"en\">with no light of any kind.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 마치 누군가가 모든 불을 꺼 버린 것처럼 나는 갑자기 어떤 종류의 빛도 없는 암흑의 숲속에 있었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 순식간에 주변이 어두워진 상황을 '누군가 불을 끈 것'에 비유하여 \u003cb class=\"key\">공포감\u003c/b>과 \u003cb class=\"key\">급격한 \u003c/b>\u003cb class=\"key\">변화\u003c/b>를 극적으로 묘사합니다. 'no light of any kind'는 완벽한 \u003cb class=\"key\">고립감\u003c/b>을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사(가정법)\u003c/span> : as though + [S + V] : \"마치 ~인 것처럼\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거완료\u003c/span> : had + [switched (p.p.)] : \"꺼 버린 것\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"But almost as though, 하지만 마치 ~인 것처럼. someone had switched off, 누군가가 꺼 버린 것처럼. all the lights, 모든 불을. I was suddenly, 나는 갑자기 있었다. in a black forest, 암흑의 숲속에. with no light of any kind, 어떤 종류의 빛도 없는. 이 문장 전체를 해석하면, 하지만 마치 누군가가 모든 불을 꺼 버린 것처럼 나는 갑자기 어떤 종류의 빛도 없는 암흑의 숲속에 있었다.","hl":"m"},{"n":16,"text":"상황이 급격하게 변하는 부분이죠. 누군가 의도적으로 불을 끈 것처럼 묘사해서 주인공이 느끼는 당혹감과 무거운 어둠을 강조하고 있습니다.","hl":"mn"},{"n":17,"text":"첫 번째로 as though는 마치 무엇인 것처럼이라는 뜻의 접속사로 as if와 바꿔 쓸 수 있습니다. 두 번째로 had switched off는 과거완료 시제로 어두워진 시점보다 불을 끈 동작이 앞선다는 것을 가정해서 표현한 것입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어찌 할 바를 모른 채\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Feeling \u003c/span>\u003cspan class=\"tgt\">lost\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 비틀거리며 걸었다.\u003c/span>\u003cspan class=\"en\">I stumbled.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어찌 할 바를 모른 채 나는 비틀거리며 걸었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 길을 잃었다는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">충격\u003c/b>이 '비틀거리다'라는 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">반응\u003c/b>으로 이어지는 과정을 간결하게 보여줍니다. 짧은 문장을 통해 긴박하고 \u003cb class=\"key\">불안한 \u003c/b>\u003cb class=\"key\">심리\u003c/b>를 효과적으로 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : [Feeling (v-ing)] ..., [S + V] : \"어찌 할 바를 모른 채로\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Feeling lost, 어찌 할 바를 모른 채. I stumbled, 나는 비틀거리며 걸었다.. 이 문장 전체를 해석하면, 어찌 할 바를 모른 채 나는 비틀거리며 걸었다.","hl":"m"},{"n":19,"text":"어둠 속에서 길을 잃었다는 공포가 몸의 움직임에 그대로 나타납니다. 당황해서 제대로 걷지 못하는 주인공의 처절한 상태를 짧지만 강렬하게 보여줍니다.","hl":"mn"},{"n":20,"text":"여기서 문장 앞에 나온 Feeling lost는 분사구문입니다. 주어인 내가 길을 잃었다고 느끼는 상태를 설명하면서 비틀거렸다는 주절의 내용을 꾸며주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는\u003c/span>\u003cspan class=\"en\">I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">넘어졌다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">fell\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 넘어졌다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 칠흑 같은 어둠 속에서 길을 잃고 헤매다 겪게 된 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">고난\u003c/b>을 짧고 강렬하게 보여줍니다. 짧은 문장을 배치하여 주인공의 \u003cb class=\"key\">다급함과 \u003c/b>\u003cb class=\"key\">절망감\u003c/b>을 효과적으로 전달합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거형 자동사\u003c/span> : fall (현재) - fell (과거) - fallen (과거분사) : \"넘어졌다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"I, 나는. fell, 넘어졌다.. 이 문장 전체를 해석하면, 나는 넘어졌다.","hl":"m"},{"n":22,"text":"아주 짧은 문장이죠? 칠흑 같은 어둠 속에서 아무것도 보이지 않아 결국 넘어지는 상황을 묘사하고 있어요. 주인공의 처절한 심경이 느껴지네요.","hl":"mn"},{"n":23,"text":"여기서 fell은 fall의 과거형으로 쓰였어요. 별도의 목적어가 필요 없는 자동사로 쓰여서 주인공의 동작 그 자체를 강조하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 옷이 찢어지고\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">tore \u003c/span>\u003cspan class=\"tgt\">my \u003c/span>\u003cspan class=\"tgt\">clothes \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다쳤다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">injured \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">myself\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">언덕에서 굴러떨어져\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">falling\u003c/span> down a hill.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">언덕에서 굴러떨어져 나는 옷이 찢어지고 다쳤다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단순히 넘어진 것에서 그치지 않고 옷이 찢기고 부상을 입는 등 상황이 \u003cb class=\"key\">최악의 \u003c/b>\u003cb class=\"key\">상태\u003c/b>로 치닫고 있음을 나타냅니다. 구체적인 동작 동사를 사용하여 주인공이 처한 \u003cb class=\"key\">신체적 \u003c/b>\u003cb class=\"key\">위기\u003c/b>를 생생하게 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거동사 병렬 구조\u003c/span> : [동사1] + and + [동사2] : \"옷을 찢고 나 자신을 다치게 했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">재귀대명사 (재귀 용법)\u003c/span> : 주어(I) = 목적어(myself) : \"나 자신을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사 (부대상황)\u003c/span> : falling [현재분사구] : \"떨어지면서\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"I tore my clothes, 나는 옷이 찢어지고. and injured myself, 다쳤다. falling down a hill, 언덕에서 굴러떨어져. 이 문장 전체를 해석하면, 언덕에서 굴러떨어져 나는 옷이 찢어지고 다쳤다.","hl":"m"},{"n":25,"text":"단순히 넘어진 게 아니라 언덕을 구르며 부상까지 당한 긴박한 장면이에요. 옷이 찢어질 정도로 험난한 상황이라는 걸 알 수 있죠.","hl":"mn"},{"n":26,"text":"첫 번째로 동사 tore와 injured가 접속사 and로 연결된 병렬 구조를 확인하세요. 두 번째로 주어인 내가 스스로에게 부상을 입힌 것이니 재귀대명사 myself를 썼고요. 마지막으로 falling은 언덕을 내려가던 도중에 일어난 일을 설명하는 분사구문의 역할을 하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자포자기한 채\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">In \u003c/span>\u003cspan class=\"tgt\">desperation\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 멈춰서서\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">stopped \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기대었다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">leaned\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무에\u003c/span>\u003cspan class=\"en\">against a tree.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 자포자기한 채 멈춰서서 나무에 기대었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 더 이상 움직일 기력도, 방향 감각도 상실한 \u003cb class=\"key\">절망적인 \u003c/b>\u003cb class=\"key\">심리\u003c/b> 상태를 보여줍니다. 이후 희망의 냄새를 맡기 직전의 가장 \u003cb class=\"key\">어두운 \u003c/b>\u003cb class=\"key\">시점\u003c/b>을 상징합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구 (상태 묘사)\u003c/span> : In + 추상명사 : \"절망 속에서 (자포자기한 채)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거동사 병렬 구조\u003c/span> : [동사1] + and + [동사2] : \"멈춰서서 기대었다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"In desperation, 자포자기한 채. I stopped, 나는 멈춰서서. and leaned, 기대었다. against a tree, 나무에. 이 문장 전체를 해석하면, 나는 자포자기한 채 멈춰서서 나무에 기대었다.","hl":"m"},{"n":28,"text":"이제는 정말 포기하고 싶은 심리 상태가 잘 드러나죠. 나무에 기대었다는 건 더 이상 걸을 힘조차 없다는 뜻이에요.","hl":"mn"},{"n":29,"text":"첫 번째로 문장 맨 앞의 In desperation은 주인공의 현재 상태를 나타내는 전치사구입니다. 자포자기한 채로 해석하면 자연스러워요. 두 번째로 동사인 stopped와 leaned가 나란히 연결된 과거동사 병렬 구조도 꼭 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 전혀 모르겠어\u003c/span>\u003cspan class=\"en\">I have no idea\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 지금 어디에 있는지.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">am \u003c/span>\u003cspan class=\"tgt\">now\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 지금 어디에 있는지 전혀 모르겠어.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 길을 잃고 고립된 상황에서 느끼는 필자의 \u003cb class=\"key\">절망적인 \u003c/b>\u003cb class=\"key\">심경\u003c/b>을 직접적으로 보여줍니다. 현재 위치조차 파악할 수 없는 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">혼란\u003c/b> 상태를 나타냅니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : 의문사(where) + 주어(I) + 동사(am) : \"내가 지금 어디에 있는지\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"I have no idea, 나는 전혀 모르겠어. where I am now, 내가 지금 어디에 있는지.. 이 문장 전체를 해석하면, 내가 지금 어디에 있는지 전혀 모르겠어.","hl":"m"},{"n":31,"text":"주인공이 숲속에서 완전히 길을 잃고 자신의 위치를 알 수 없는 절망적인 심경을 드러내는 장면이에요. 여기서 혼란스러운 심리 상태가 잘 나타나죠.","hl":"mn"},{"n":32,"text":"어법 포인트는 하나예요. where I am now 부분은 know의 목적어 자리에 들어간 간접의문문이에요. 질문하는 문장이 아니기 때문에 where am I처럼 도치하지 않고 의문사, 주어, 동사의 평서문 어순을 써야 한다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가 알아차리기나 할까\u003c/span>\u003cspan class=\"en\">Will anyone even notice\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 사라진 것을?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">I'm \u003c/span>\u003cspan class=\"tgt\">gone\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">내가 사라진 것을 누군가 알아차리기는 할까?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 아무도 자신을 구하러 오지 않을까 봐 두려워하는 \u003cb class=\"key\">소외감\u003c/b>과 \u003cb class=\"key\">불안감\u003c/b>을 표현합니다. 스스로에게 던지는 질문을 통해 극한의 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">위기\u003c/b>를 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : notice [타동사] + that [접속사] + S + V [완전한 문장] : \"내가 사라진 것을\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Will anyone even notice, 누군가 알아차리기나 할까. that I'm gone?, 내가 사라진 것을?. 이 문장 전체를 해석하면, 내가 사라진 것을 누군가 알아차리기는 할까?","hl":"m"},{"n":34,"text":"아무도 자신이 없어진 걸 모를지도 모른다는 생각에 더 깊은 두려움과 소외감에 빠진 주인공의 모습을 보여줘요. 자조적인 질문으로 긴장감을 높이고 있어요.","hl":"mn"},{"n":35,"text":"여기서 notice 뒤에 나온 that은 명사절을 이끄는 접속사예요. 내가 사라졌다는 사실 전체를 notice의 목적어로 만들어 주는 역할을 하죠. that 뒤에는 빠진 것 없는 완전한 문장이 온다는 것이 특징이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바로 그때였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It \u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">then \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">희미한 향이 바람에 날려 온 것은\u003c/span>\u003cspan class=\"en\">a faint aroma \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">drifted\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어둠을 통해\u003c/span>\u003cspan class=\"en\">through the darkness:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">요리 냄새였다.\u003c/span>\u003cspan class=\"en\">the scent of cooking.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">어둠을 통해 희미한 향이 바람에 날려 온 것은 바로 그때였다. 요리 냄새였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 공포스러운 상황에서 구조의 실마리를 발견하는 \u003cb class=\"key\">분위기 \u003c/b>\u003cb class=\"key\">반전\u003c/b>의 순간입니다. 시각이 차단된 어둠 속에서 \u003cb class=\"key\">후각적 \u003c/b>\u003cb class=\"key\">심상\u003c/b>을 통해 희망이 시작됨을 알립니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">It ~ that 강조구문\u003c/span> : It is/was + [강조어구(then)] + that + [나머지 성분] : \"바로 그때였다 ~한 것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사와 혼동하기 쉬운 과거동사\u003c/span> : a faint aroma [주어] + drifted [동사] : \"날려 왔다\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"It was then that, 바로 그때였다. a faint aroma drifted, 희미한 향이 바람에 날려 온 것은. through the darkness, 어둠을 통해. the scent of cooking, 요리 냄새였다.. 이 문장 전체를 해석하면, 어둠을 통해 희미한 향이 바람에 날려 온 것은 바로 그때였다. 요리 냄새였다.","hl":"m"},{"n":37,"text":"절망의 끝에서 드디어 희망의 증거를 찾는 아주 중요한 장면이에요. 보이지 않는 어둠 속에서 맡게 된 음식 냄새는 분위기를 완전히 뒤바꿔 놓죠.","hl":"mn"},{"n":38,"text":"두 가지 포인트를 잡아볼게요. 첫 번째, It was then that은 강조구문이에요. 바로 그 순간이라는 시간의 의미를 강조하고 있어요. 두 번째, drifted는 이 문장의 동사로, 향기가 바람을 타고 흘러온다는 뜻의 과거형 동사입니다. 분사 형태와 헷갈리지 않게 주의하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 비틀거리며 걸어갔고,\u003c/span>\u003cspan class=\"en\">I stumbled\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 향해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">towards \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">곧,\u003c/span>\u003cspan class=\"en\">and soon,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">희미한 누르스름한 빛이\u003c/span>\u003cspan class=\"en\">a faint, yellowish light\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나무 사이로 반짝였다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">glowed\u003c/span> through the trees.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나는 비틀거리며 그것을 향해 걸어갔고, 곧 희미한 누르스름한 빛이 나무 사이로 반짝였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 문장의 냄새를 따라 이동하며 드디어 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">실마리\u003c/b>를 찾는 장면입니다. 어둠 속에서 \u003cb class=\"key\">희망\u003c/b>을 상징하는 빛을 발견하여 분위기가 반전되기 시작합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구의 대상\u003c/span> : towards + [명사/대명사] : \"그것을 향해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 시제\u003c/span> : 주어 + [동사(과거형)] : \"반짝였다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"I stumbled, 나는 비틀거리며 걸어갔고. towards it, 그것을 향해. and soon, 곧. a faint, yellowish light, 희미한 누르스름한 빛이. glowed through the trees, 나무 사이로 반짝였다.. 이 문장 전체를 해석하면, 나는 비틀거리며 그것을 향해 걸어갔고, 곧 희미한 누르스름한 빛이 나무 사이로 반짝였다.","hl":"m"},{"n":40,"text":"길을 잃고 헤매던 주인공이 요리 냄새가 나는 쪽으로 비틀거리며 향하는 장면이에요. 여기서 yellowish light, 즉 누르스름한 빛은 주인공이 곧 구제받을 것임을 암시하는 시각적 실마리가 됩니다.","hl":"mn"},{"n":41,"text":"첫 번째로 towards it에서 it은 앞에서 언급된 요리 냄새를 가리킵니다. 두 번째로 glowed는 과거의 특정한 순간에 빛이 났던 상황을 보여주는 과거 시제 동사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 Krull 삼촌의 오두막이었고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">It\u003c/span> was Uncle Krull's cabin\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 그를 볼 수 있었다\u003c/span>\u003cspan class=\"en\">and I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">could \u003c/span>\u003cspan class=\"tgt\">see\u003c/span> him\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">창문을 통해!\u003c/span>\u003cspan class=\"en\">through the window!\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것은 Krull 삼촌의 오두막이었고 나는 창문을 통해 그를 볼 수 있었다!\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 빛의 정체가 지인인 삼촌의 집임을 알게 되며 \u003cb class=\"key\">안도감\u003c/b>이 극대화됩니다. 주인공이 처했던 \u003cb class=\"key\">고립 \u003c/b>\u003cb class=\"key\">상황\u003c/b>이 해소되는 결정적인 순간입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">지시대명사\u003c/span> : It [주어] + was [동사] : \"그것은\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">조동사의 과거형\u003c/span> : could [조동사] + see [동사원형] : \"볼 수 있었다\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"It was Uncle Krull's cabin, 그것은 Krull 삼촌의 오두막이었고. and I could see him, 나는 그를 볼 수 있었다. through the window!, 창문을 통해!. 이 문장 전체를 해석하면, 그것은 Krull 삼촌의 오두막이었고 나는 창문을 통해 그를 볼 수 있었다!","hl":"m"},{"n":43,"text":"희미한 빛의 정체가 밝혀지는 순간이죠. 아는 사람인 Krull 삼촌의 오두막을 발견하면서 공포가 안도감으로 바뀌는 감정의 변화를 느낄 수 있습니다.","hl":"mn"},{"n":44,"text":"첫 번째로 문장의 주어 It은 앞 문장의 누르스름한 빛을 지칭하고 있어요. 두 번째로 see 앞에 조동사 could를 사용하여 그 당시 삼촌의 모습을 창문 너머로 볼 수 있었던 상황을 표현했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 13\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">말로 표현할 수 없을 정도로 감사하며\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Thankful \u003c/span>\u003cspan class=\"tgt\">beyond \u003c/span>\u003cspan class=\"tgt\">words\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나는 알게 되었다\u003c/span>\u003cspan class=\"en\">I \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">knew \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">내가 마침내\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">I \u003c/span>\u003cspan class=\"tgt\">could\u003c/span> finally\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">도움을 요청할 수 있다는 것을\u003c/span>\u003cspan class=\"en\">ask for help.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">말로 표현할 수 없을 정도로 감사하며 내가 마침내 도움을 요청할 수 있다는 것을 나는 알게 되었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 주인공의 심경이 \u003cb class=\"key\">감사함\u003c/b>으로 가득 차 있으며, 이제 안전하다는 \u003cb class=\"key\">확신\u003c/b>을 보여줍니다. 서술형 대비가 필요한 중요한 구조의 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사구 분사구문\u003c/span> : (Being) + Thankful [형용사] ~ : \"말로 표현할 수 없을 정도로 감사하며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">명사절 접속사의 생략\u003c/span> : knew [타동사] + (that) [접속사] + I [주어] ~ : \"~라는 것을 알았다\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"Thankful beyond words, 말로 표현할 수 없을 정도로 감사하며. I knew, 나는 알게 되었다. I could finally, 내가 마침내. ask for help, 도움을 요청할 수 있다는 것을. 이 문장 전체를 해석하면, 말로 표현할 수 없을 정도로 감사하며 내가 마침내 도움을 요청할 수 있다는 것을 나는 알게 되었다.","hl":"m"},{"n":46,"text":"말로는 다 할 수 없을 만큼 큰 고마움을 느끼는 장면이에요. 이제 더 이상 혼자가 아니고 도움을 받을 수 있다는 사실을 깨닫고 안심하고 있습니다.","hl":"mn"},{"n":47,"text":"첫 번째로 문장 맨 앞의 Thankful beyond words는 원래 Being이 생략된 분사구문 형태로 주어의 감정 상태를 설명해 줍니다. 두 번째로 knew와 I 사이에는 목적어 절을 이끄는 접속사 that이 생략되어 있다는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 13\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나의 고난은\u003c/span>\u003cspan class=\"en\">My hardship\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끝났다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">over\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">나의 고난이 끝났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 숲에서 길을 잃고 다치며 느꼈던 신체적, 심리적 \u003cb class=\"key\">시련\u003c/b>이 해결되었음을 선언하는 문장입니다. 삼촌의 오두막을 발견함으로써 마침내 \u003cb class=\"key\">안도감\u003c/b>을 찾으며 이야기가 마무리되는 결말부입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be over (상태의 종료)\u003c/span> : be [동사] + over [형용사/보어] : \"끝났다\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"My hardship, 나의 고난은. was over, 끝났다.. 이 문장 전체를 해석하면, 나의 고난이 끝났다.","hl":"m"},{"n":49,"text":"주인공이 숲에서 길을 잃고 헤매며 겪은 모든 시련과 두려움이 삼촌의 집을 발견하면서 마침내 끝났음을 보여줍니다. 이 문장은 사건의 해결과 함께 커다란 안도감을 주는 결말 역할을 하고 있어요.","hl":"mn"},{"n":50,"text":"이 문장은 주어와 동사 그리고 보어로 이루어진 아주 명료한 구조입니다. 첫 번째로 살펴볼 포인트는 was over라는 표현이에요. 어떤 일이 완전히 종료되었음을 나타낼 때 자주 쓰이죠. 여기서는 과거 시제를 사용해서 그 당시에 고난이 마무리된 상태였다는 것을 설명하고 있네요.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>어두운 숲에서 \u003cb class=\"key\">방향 \u003c/b>\u003cb class=\"key\">감각\u003c/b>을 잃고 조난당하는 위기 상황이 발생함.\u003c/li>\u003cli>부상과 고립으로 인해 극심한 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">고통\u003c/b>과 절망을 경험함.\u003c/li>\u003cli>우연히 맡게 된 \u003cb class=\"key\">음식 \u003c/b>\u003cb class=\"key\">냄새\u003c/b>가 구원의 이정표 역할을 함.\u003c/li>\u003cli>친척의 오두막을 발견하며 모든 \u003cb class=\"key\">고난\u003c/b>이 해결되고 안도함.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A terrifying experience of being lost in a dark forest turns into relief and hope when the narrator finds a familiar cabin guided by a scent.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">집으로 가던 중 \u003cb class=\"key\">암흑의 \u003c/b>\u003cb class=\"key\">숲\u003c/b>에서 길을 잃고 부상을 입어 \u003cb class=\"key\">절망\u003c/b>에 빠졌으나, 우연히 맡게 된 \u003cb class=\"key\">요리 \u003c/b>\u003cb class=\"key\">냄새\u003c/b>를 따라가 삼촌의 오두막을 발견하고 안도하게 되는 과정입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":51,"text":"어둠 속의 공포가 따뜻한 오두막의 안도로 바뀌는 과정, 잘 이해되셨나요? 감각의 변화와 심경 형용사를 연결해서 복습하는 것 잊지 마세요. 오늘 수업은 여기까지입니다!","hl":null}]}]});</script></body></html>
