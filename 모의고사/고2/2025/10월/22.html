</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");

  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}

  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;

    att=0;playAudio(s);}

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 22번","audioDir":"22_audio","preview":false,"count":30,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">22번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>Science: The Courage to Embrace Ignorance and Curiosity\u003c/h1>\u003ch2>과학: 무지를 수용하고 호기심을 따르는 용기\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>과학은 자신의 \u003cb class=\"key\">무지\u003c/b>를 인정하는 것에서 시작하며, 정해진 \u003cb class=\"key\">방법론\u003c/b>에 얽매이기보다 순수한 \u003cb class=\"key\">호기심\u003c/b>에 기반한 실험을 통해 발전합니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Scientific progress is driven by embracing ignorance and conducting experiments out of pure curiosity rather than just following rigid methodologies.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분 오늘은 이천이십오년 십월 고등학교 이학년 모의고사 이십이번 지문을 함께 공부할 거예요. 이 글은 과학이 어떻게 발전하는지 그 핵심 동력인 무지의 수용과 호기심에 대해 다루고 있어요. 우리가 완벽하다고 믿는 과학의 이면에는 모른다는 것을 인정하는 용기가 있다는 것이 이 글의 요지예요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">\u003cb class=\"key\">실험 \u003c/b>\u003cb class=\"key\">철학\u003c/b>(Experimental Philosophy)의 역사를 이해하는 것이 중요합니다. 과거에는 지식이 고정된 것으로 여겨졌지만, 근대 과학은 우리가 모른다는 \u003cb class=\"key\">무지의 \u003c/b>\u003cb class=\"key\">수용\u003c/b>(Embrace of Ignorance)을 전제로 시작되었습니다. 이는 마치 아이가 \u003cb class=\"key\">장난감 \u003c/b>\u003cb class=\"key\">상자\u003c/b>를 열어보기 전까지 무엇이 들어있는지 모르는 상태에서 호기심을 갖는 것과 비슷합니다. 현대 과학은 \u003cb class=\"key\">가설 \u003c/b>\u003cb class=\"key\">검증\u003c/b>(Hypothesis Testing)이라는 엄격한 절차를 강조하지만, 실제로는 무엇이 일어날지 모르는 상태에서 시도하는 \u003cb class=\"key\">순수한 \u003c/b>\u003cb class=\"key\">탐구\u003c/b>가 많은 역사적 발견을 이끌어냈습니다.\u003c/div>","segs":[{"n":2,"text":"여러분은 과학이라고 하면 철저한 계산과 정답만 떠올리나요. 하지만 과학의 진짜 시작은 실험 철학 즉 Experimental Philosophy의 등장과 함께 우리가 아무것도 모른다는 사실을 받아들이는 것에서 시작되었어요. 마치 어린아이가 선물 상자 속에 무엇이 들어있을까 궁금해하며 열어보는 것처럼 Curiosity라는 특성이 가치 있게 여겨지기 시작한 거죠.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>무지의 수용\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>과학이 자신의 \u003cb class=\"key\">무지\u003c/b>를 받아들인다는 점을 강조하며, 확인 없이 미리 결과를 \u003cb class=\"key\">가정\u003c/b>하는 태도의 위험성을 경고합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>호기심의 가치\u003csmall>근거 · 문장 3\u003c/small>\u003c/h4>\u003cp>실험 철학의 발전이 \u003cb class=\"key\">호기심\u003c/b>을 의심스러운 것이 아닌 \u003cb class=\"key\">가치 \u003c/b>\u003cb class=\"key\">있는 \u003c/b>\u003cb class=\"key\">특성\u003c/b>으로 여기게 된 역사적 배경을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>방법론 너머의 실험\u003csmall>반전 및 확장 · 문장 4\u003c/small>\u003c/h4>\u003cp>엄격한 \u003cb class=\"key\">방법론\u003c/b>도 중요하지만, 단지 어떤 일이 일어날지 보고 싶은 \u003cb class=\"key\">순수한 \u003c/b>\u003cb class=\"key\">호기심\u003c/b>만으로도 실험은 가능합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>무모한 시도의 필요성\u003csmall>주장 및 결론 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>결과가 없을지라도 때로는 \u003cb class=\"key\">무모한 \u003c/b>\u003cb class=\"key\">실험\u003c/b>을 해야 하며, 직접 \u003cb class=\"key\">시도\u003c/b>하기 전에는 결코 알 수 없다는 결론을 내립니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"자 그럼 이 글이 어떤 순서로 우리의 생각을 확장해 주는지 네 단계로 나누어 살펴볼게요.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째와 두 번째 문장에서는 과학의 기본이 Ignorance를 수용하는 것이며 확인도 안 하고 아는 척하는 게 얼마나 위험한지 경고해요.","hl":"f0"},{"n":5,"text":"두 번째 단계인 세 번째 문장에서는 역사적으로 호기심이 어떻게 의심스러운 것이 아닌 긍정적인 특성으로 해방되었는지를 설명하죠.","hl":"f1"},{"n":6,"text":"세 번째 단계인 네 번째 문장에서는 오늘날의 고정된 Methodology를 넘어선 순수한 Curiosity에 의한 실험의 가치를 강조하고요.","hl":"f2"},{"n":7,"text":"마지막 단계인 다섯 번째와 여섯 번째 문장에서는 때로는 무모해 보이는 Crazy experiment도 직접 시도해 보는 것이 중요하다는 결론을 내려요.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 과학이 \u003cb class=\"key\">무지\u003c/b>를 수용한다는 핵심 주제를 던지고, 이후 역사적 배경과 학자의 견해를 \u003cb class=\"key\">근거\u003c/b>로 제시합니다. 마지막 문장에서 직접 \u003cb class=\"key\">시도\u003c/b>해야 알 수 있다는 결론을 통해 주제를 다시 한번 강조합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Arguably (2)\u003c/b>\u003cspan>강조\u003c/span>\u003cb>Indeed (5)\u003c/b>\u003cspan>부연 설명\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">embrace of ignorance\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">curiosity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">experiment simply out of curiosity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">crazy experiment\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">try\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 글은 처음과 끝에서 주제를 강조하는 양괄식 구조를 취하고 있어요. 첫 번째 문장에서 무지의 수용이라는 화두를 던지고 마지막 문장에서 시도하기 전까진 모른다는 실천적 메시지로 마무리하죠. 전반적으로 주장을 먼저 하고 다양한 인물들의 견해를 근거로 제시하는 전개 방식입니다.","hl":"ty"},{"n":9,"text":"두 번째 문장의 Arguably는 필자의 확신을 보여주고 다섯 번째 문장의 Indeed는 다윈의 아들인 George Darwin의 구체적인 예시를 강조하며 내용을 덧붙여줘요. 이런 단어들을 통해 필자가 무엇을 중요하게 여기는지 알 수 있죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>experiment\u003c/b>\u003cem>명사\u003c/em>\u003cspan>실험\u003c/span>\u003c/div>\u003cdiv>\u003cb>testify to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~을 증명하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>embrace\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수용, 포용\u003c/span>\u003c/div>\u003cdiv>\u003cb>ignorance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무지\u003c/span>\u003c/div>\u003cdiv>\u003cb>arguably\u003c/b>\u003cem>부사\u003c/em>\u003cspan>거의 틀림없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>suppose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>given\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주어진\u003c/span>\u003c/div>\u003cdiv>\u003cb>scenario\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시나리오\u003c/span>\u003c/div>\u003cdiv>\u003cb>bother to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 수고를 들이다\u003c/span>\u003c/div>\u003cdiv>\u003cb>coincide with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~와 동시에 일어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>philosophy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>철학\u003c/span>\u003c/div>\u003cdiv>\u003cb>liberation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>해방\u003c/span>\u003c/div>\u003cdiv>\u003cb>curiosity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>호기심\u003c/span>\u003c/div>\u003cdiv>\u003cb>valuable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>가치 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>questionable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>의심스러운\u003c/span>\u003c/div>\u003cdiv>\u003cb>attribute\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특성\u003c/span>\u003c/div>\u003cdiv>\u003cb>assume\u003c/b>\u003cem>동사\u003c/em>\u003cspan>가정하다, 생각하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>framework\u003c/b>\u003cem>명사\u003c/em>\u003cspan>틀\u003c/span>\u003c/div>\u003cdiv>\u003cb>approved\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>승인된\u003c/span>\u003c/div>\u003cdiv>\u003cb>methodology\u003c/b>\u003cem>명사\u003c/em>\u003cspan>방법론\u003c/span>\u003c/div>\u003cdiv>\u003cb>hypothesis\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가설\u003c/span>\u003c/div>\u003cdiv>\u003cb>conduct\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>astronomer\u003c/b>\u003cem>명사\u003c/em>\u003cspan>천문학자\u003c/span>\u003c/div>\u003cdiv>\u003cb>fruitless\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효과 없는, 결실 없는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 Embrace라는 단어는 껴안다라는 뜻도 있지만 무지를 수용한다는 맥락으로 쓰였어요. 그리고 Methodology 즉 방법론이라는 단어는 과학의 체계적인 측면을 보여주는 아주 중요한 표현이니 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">embrace\u003c/b>\u003cspan class=\"m\">수용하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">accept\u003c/span>\u003cspan class=\"s\">welcome\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003cspan class=\"a\">exclude\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ignorance\u003c/b>\u003cspan class=\"m\">무지\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unawareness\u003c/span>\u003cspan class=\"s\">oblivion\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">knowledge\u003c/span>\u003cspan class=\"a\">wisdom\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">liberation\u003c/b>\u003cspan class=\"m\">해방\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">release\u003c/span>\u003cspan class=\"s\">freedom\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">restriction\u003c/span>\u003cspan class=\"a\">confinement\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">fruitless\u003c/b>\u003cspan class=\"m\">효과 없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unproductive\u003c/span>\u003cspan class=\"s\">useless\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fruitful\u003c/span>\u003cspan class=\"a\">productive\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">conduct\u003c/b>\u003cspan class=\"m\">수행하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">perform\u003c/span>\u003cspan class=\"s\">carry out\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Ignorance는 무지라는 뜻으로 Unawareness와 비슷하고 반대말로는 Knowledge가 있겠네요. Fruitless는 열매가 없다는 뜻이니까 효과가 없다는 의미로 쓰였고 반대말은 Fruitful이 됩니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실험들은\u003c/span>\u003cspan class=\"en\">Experiments\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">증명한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">testify \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학의 무지에 대한 수용을\u003c/span>\u003cspan class=\"en\">science's embrace of ignorance.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실험들은 과학의 무지에 대한 수용을 증명한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과학이 단순히 지식을 쌓는 것만이 아니라, 본래 우리가 아무것도 모른다는 사실인 \u003cb class=\"key\">무지\u003c/b>를 기꺼이 받아들이고 이를 실험으로 확인하려 한다는 뜻입니다. 과학의 진정한 힘은 모르는 것을 인정하는 \u003cb class=\"key\">수용\u003c/b>의 태도에서 나옵니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(자동사+전치사)\u003c/span> : testify [자동사] + to [전치사] + 명사(구) : \"~을 증명한다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Experiments, 실험들은. testify to, 증명한다. science's embrace of ignorance, 과학의 무지에 대한 수용을. 이 문장 전체를 해석하면, 실험들은 과학의 무지에 대한 수용을 증명한다.","hl":"m"},{"n":13,"text":"이 문장은 과학의 핵심이 우리가 모른다는 사실을 인정하는 데 있다는 점을 짚어줍니다. 실험은 과학자들이 자신의 무지를 숨기지 않고 기꺼이 수용한다는 것을 보여주는 증거라는 뜻이죠.","hl":"mn"},{"n":14,"text":"첫 번째로 자동사 testify가 전치사 to와 결합해 무엇을 증명하는지 나타내는 표현을 잘 봐두세요. 주어인 실험들이 과학의 어떤 태도를 보여주는지 설명하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 틀림없이 가장 최악의 것은\u003c/span>\u003cspan class=\"en\">Arguably the worst thing\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학자가 할 수 있는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">scientist \u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가정하는 것이다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">suppose\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 일어날 일을 안다고\u003c/span>\u003cspan class=\"en\">they know \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">happen\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">주어진 시나리오에서\u003c/span>\u003cspan class=\"en\">in a given scenario\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">확인하려는 수고를 들이지 않고\u003c/span>\u003cspan class=\"en\">without bothering to check.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">거의 틀림없이 과학자가 할 수 있는 가장 최악의 것은 그들이 확인하려는 수고를 들이지 않고 주어진 시나리오에서 일어날 일을 그들이 안다고 가정하는 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 직접 실험해보는 \u003cb class=\"key\">수고\u003c/b> 없이 결과를 미리 예측하고 안다고 믿는 것이 과학자에게 가장 위험한 태도임을 강조합니다. 즉, 실제 \u003cb class=\"key\">검증\u003c/b> 과정이 없는 지식은 과학적이지 않다는 비판입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사의 생략\u003c/span> : the worst thing [선행사] + (that) [목적격 관계대명사 생략] + a scientist [S] + can do [V] : \"과학자가 할 수 있는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 명사적 용법(보어)\u003c/span> : is [동사] + to suppose [to부정사구/보어] : \"가정하는 것이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">간접의문문(명사절)\u003c/span> : know [타동사] + what [의문사/S] + will happen [V] : \"무슨 일이 일어날지를\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Arguably the worst thing, 거의 틀림없이 가장 최악의 것은. a scientist can do, 과학자가 할 수 있는. is to suppose, 가정하는 것이다. they know what will happen, 그들이 일어날 일을 안다고. in a given scenario, 주어진 시나리오에서. without bothering to check, 확인하려는 수고를 들이지 않고. 이 문장 전체를 해석하면, 거의 틀림없이 과학자가 할 수 있는 가장 최악의 것은 그들이 확인하려는 수고를 들이지 않고 주어진 시나리오에서 일어날 일을 그들이 안다고 가정하는 것이다.","hl":"m"},{"n":16,"text":"과학자가 저지를 수 있는 가장 큰 실수는 확인도 안 해보고 결과를 다 안다고 자만하는 거예요. 실험이라는 수고로운 검증 과정을 생략하는 것이 얼마나 위험한지를 경고하는 문장입니다.","hl":"mn"},{"n":17,"text":"첫 번째로 thing 뒤에 목적격 관계대명사가 생략되어 과학자가 할 수 있는 일을 꾸며주고 있고요. 두 번째로 주어의 상태를 설명하는 to부정사 보어가 쓰였습니다. 마지막으로 know의 목적어로 쓰인 명사절 what을 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">실험 철학의 등장은\u003c/span>\u003cspan class=\"en\">The rise of the experimental philosophy\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">동시에 일어났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">coincided \u003c/span>\u003cspan class=\"tgt\">with\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">호기심의 해방과\u003c/span>\u003cspan class=\"en\">the liberation of curiosity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">의심스러운 특성이 아닌 가치 있는 특성으로서의\u003c/span>\u003cspan class=\"en\">as a valuable \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than\u003c/span> a questionable attribute.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">실험 철학의 등장은 의심스러운 특성이 아닌 가치 있는 특성으로서의 호기심의 해 방과 동시에 일어났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과거에는 부정적으로 여겨졌던 \u003cb class=\"key\">호기심\u003c/b>이 실험 철학의 발전과 함께 긍정적인 가치로 인정받기 시작했음을 설명합니다. 즉, 실험 정신이 호기심을 사회적으로 \u003cb class=\"key\">정당화\u003c/b>해주었다는 역사적 배경을 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사구\u003c/span> : Subject + coincided with + Object : \"~와 동시에 일어났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">병렬 구조/대조\u003c/span> : A [valuable] + rather than + B [questionable] : \"~라기보다는\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"The rise of the experimental philosophy, 실험 철학의 등장은. coincided with, 동시에 일어났다. the liberation of curiosity, 호기심의 해방과. as a valuable rather than a questionable attribute, 의심스러운 특성이 아닌 가치 있는 특성으로서의. 이 문장 전체를 해석하면, 실험 철학의 등장은 의심스러운 특성이 아닌 가치 있는 특성으로서의 호기심의 해 방과 동시에 일어났다.","hl":"m"},{"n":19,"text":"실험을 중시하는 철학이 나타나면서 호기심에 대한 시각이 완전히 바뀌었어요. 예전에는 의심스럽게 보던 호기심이 이제는 아주 가치 있는 특성으로 대접받게 되었다는 역사적 변화를 보여줍니다.","hl":"mn"},{"n":20,"text":"첫 번째로 두 사건이 동시에 일어났음을 뜻하는 과거 동사 표현을 잘 챙기시고요. 두 번째로 가치 있는 것과 의심스러운 것을 대조하는 표현인 rather than이 어떻게 명사를 수식하는지 눈여겨보세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날의 실험 과학은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">For \u003c/span>\u003cspan class=\"tgt\">all \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> experimental science today\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뒷받침되고 있다고 종종 여겨지지만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">assumed \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">supported\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">철학적 틀과 승인된 방법론에 의해\u003c/span>\u003cspan class=\"en\">by a philosophical framework and an approved methodology\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">(‘가설을 세우고 나서 그것을 검증하라’)\u003c/span>\u003cspan class=\"en\">(&quot;state your hypothesis and then test it&quot;),\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사실은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">fact \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학 철학자 Ian Hacking이 말하듯이\u003c/span>\u003cspan class=\"en\">as philosopher of science Ian Hacking says,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘누군가는 무슨 일이 일어날 것인지를 알아보기 위해 그저 호기심에서 실험을 수행할 수도 있다’\u003c/span>\u003cspan class=\"en\">&quot;One can conduct an experiment simply out of curiosity to see what will happen.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날의 실험 과학은 철학 적 틀과 승인된 방법론(‘가설을 세우고 나서 그것을 검증하라’)에 의해 뒷받침되고 있다고 종종 여겨지지만, 사실은 과학 철학자 Ian Hacking이 말하듯이, ‘누군가는 무슨 일이 일어날 것인지를 알아보기 위해 그저 호기심에서 실험을 수행할 수도 있다’.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 오늘날의 과학이 엄격한 \u003cb class=\"key\">방법론\u003c/b>에 얽매여 있다는 편견을 깨고, 순수한 \u003cb class=\"key\">호기심\u003c/b>이 실험의 근본적인 동기가 될 수 있음을 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 접속사구\u003c/span> : [For all that] + [주어 + 동사] : \"~임에도 불구하고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태와 to부정사 목적보어\u003c/span> : [be assumed] + [to be p.p.] : \"뒷받침된다고 여겨지다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : [주어] + [be동사] + [that + 완전한 절] : \"사실은 ~이다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"For all that experimental science today, 오늘날의 실험 과학은. is often assumed to be supported, 뒷받침되고 있다고 종종 여겨지지만. by a philosophical framework and an approved methodology, 철학적 틀과 승인된 방법론에 의해. (\"state your hypothesis and then test it\"), (‘가설을 세우고 나서 그것을 검증하라’). the fact is that, 사실은. as philosopher of science Ian Hacking says, 과학 철학자 Ian Hacking이 말하듯이. \"One can conduct an experiment simply out of curiosity to see what will happen.\", ‘누군가는 무슨 일이 일어날 것인지를 알아보기 위해 그저 호기심에서 실험을 수행할 수도 있다’. 이 문장 전체를 해석하면, 오늘날의 실험 과학은 철학 적 틀과 승인된 방법론(‘가설을 세우고 나서 그것을 검증하라’)에 의해 뒷받침되고 있다고 종종 여겨지지만, 사실은 과학 철학자 Ian Hacking이 말하듯이, ‘누군가는 무슨 일이 일어날 것인지를 알아보기 위해 그저 호기심에서 실험을 수행할 수도 있다’.","hl":"m"},{"n":22,"text":"오늘날 실험 과학이 흔히 엄격한 가설 검증의 틀 안에 있다고들 생각하지만, 사실은 그저 호기심 때문에 무슨 일이 생길까 궁금해서 하는 실험도 많다는 뜻이에요. 과학의 본질이 정해진 방법론보다는 모르는 것을 알고 싶어 하는 순수한 마음에 있다는 걸 보여줍니다.","hl":"mn"},{"n":23,"text":"첫 번째로 For all that은 비록 무엇임에도 불구하고라는 뜻의 양보 접속사구예요. 뒤에 주어와 동사가 오는 절이 붙어서 문장 앞뒤가 대조적임을 보여주죠. 두 번째로 is often assumed to be supported는 수동태 표현인데요. 과학이 뒷받침되고 있다고 생각되는 수동의 상태를 나타내기 위해 과거분사 형태를 썼습니다. 세 번째로 the fact is that에서 접속사 that은 보어 자리에 완전한 문장을 데려와서 사실이 무엇인지 구체적으로 설명해 주는 역할을 합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">게다가 Charles Darwin의 아들인 천문학자 George Darwin의 관점에서는\u003c/span>\u003cspan class=\"en\">Indeed, in the view of Charles Darwin's son, the astronomer George Darwin,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가끔 누군가는 해야 한다\u003c/span>\u003cspan class=\"en\">once in a while one should do\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완전히 무모한 실험을\u003c/span>\u003cspan class=\"en\">a completely crazy experiment,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">비록 그것이 가능성이 대단히 크더라도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">even \u003c/span>\u003cspan class=\"tgt\">if\u003c/span> it \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">most \u003c/span>\u003cspan class=\"tgt\">likely \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">효과 없는 것으로 증명될\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to\u003c/span> prove fruitless.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">게다가 Charles Darwin의 아들인 천문학자 George Darwin의 관점에서는 비록 그것이 효과 없는 것으로 증명될 가능성이 대단히 크더라도 가끔 누군가는 완전히 무모한 실험을 해야 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 성공 가능성이 낮아 보이는 \u003cb class=\"key\">무모한\u003c/b> 시도라 할지라도, 새로운 발견을 위해서는 때때로 그러한 \u003cb class=\"key\">도전\u003c/b>이 필요하다는 관점을 제시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">양보의 부사절 접속사\u003c/span> : [even if] + [주어 + 동사] : \"비록 ~일지라도\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">가능성의 형용사 구문\u003c/span> : [be likely to] + [동사원형] : \"~할 가능성이 크다\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Indeed, in the view of Charles Darwin's son, the astronomer George Darwin, 게다가 Charles Darwin의 아들인 천문학자 George Darwin의 관점에서는. once in a while one should do, 가끔 누군가는 해야 한다. a completely crazy experiment, 완전히 무모한 실험을. even if it is most likely, 비록 그것이 가능성이 대단히 크더라도. to prove fruitless, 효과 없는 것으로 증명될. 이 문장 전체를 해석하면, 게다가 Charles Darwin의 아들인 천문학자 George Darwin의 관점에서는 비록 그것이 효과 없는 것으로 증명될 가능성이 대단히 크더라도 가끔 누군가는 완전히 무모한 실험을 해야 한다.","hl":"m"},{"n":25,"text":"진화론으로 유명한 다윈의 아들도 가끔은 정말 말도 안 되는 무모한 실험을 해봐야 한다고 주장했다는 내용이에요. 아무런 결실이 없을 것 같아 보여도 그 도전 자체가 가치 있다는 뜻이죠.","hl":"mn"},{"n":26,"text":"첫 번째로 even if는 비록 무엇일지라도라는 뜻의 접속사입니다. 실험이 실패할 것 같은 상황을 가정하면서도 실험을 해야 한다는 주장을 뒷받침해요. 두 번째로 is most likely to는 무엇을 할 가능성이 매우 크다는 뜻의 표현인데요. 여기서는 열매가 없을 확률이 높다는 의미로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 절대 알 수 없다\u003c/span>\u003cspan class=\"en\">You never know\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 시도하기 전까지는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">until\u003c/span> you try.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분은 여러분이 시도하기 전까지는 절대 알 수 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞선 내용들을 종합하여, 직접 \u003cb class=\"key\">시도\u003c/b>하기 전에는 그 결과를 예측할 수 없다는 과학의 \u003cb class=\"key\">불확실성\u003c/b>과 실험의 가치를 요약합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">시간의 접속사\u003c/span> : [not ... until] : \"~할 때까지는 (않다)\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"You never know, 여러분은 절대 알 수 없다. until you try, 여러분이 시도하기 전까지는. 이 문장 전체를 해석하면, 여러분은 여러분이 시도하기 전까지는 절대 알 수 없다.","hl":"m"},{"n":28,"text":"이 지문의 마지막 문장으로, 결국 직접 해보기 전에는 아무것도 알 수 없다는 아주 단순하지만 강력한 진리를 말하고 있어요. 실험과 도전의 중요성을 최종적으로 정리하는 부분입니다.","hl":"mn"},{"n":29,"text":"여기서 until은 무엇을 할 때까지라는 뜻의 시간 접속사예요. never와 함께 쓰여서 여러분이 시도라는 행동을 하기 전까지는 절대 알 수 없다는 강한 부정과 강조의 의미를 전달하고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>과학의 본질은 자신이 모른다는 \u003cb class=\"key\">무지\u003c/b>를 기꺼이 인정하고 받아들이는 태도에 있습니다.\u003c/li>\u003cli>확인하지 않고 결과를 미리 \u003cb class=\"key\">가정\u003c/b>하는 것은 과학자에게 가장 경계해야 할 태도입니다.\u003c/li>\u003cli>현대 과학은 정해진 \u003cb class=\"key\">방법론\u003c/b>뿐만 아니라 순수한 \u003cb class=\"key\">호기심\u003c/b>에 의한 실험을 통해서도 발전합니다.\u003c/li>\u003cli>결과가 불확실하더라도 직접 \u003cb class=\"key\">시도\u003c/b>해 보는 도전적인 정신이 과학적 탐구의 핵심입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Scientific progress is driven by embracing ignorance and conducting experiments out of pure curiosity rather than just following rigid methodologies.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">과학은 자신의 \u003cb class=\"key\">무지\u003c/b>를 인정하는 것에서 시작하며, 정해진 \u003cb class=\"key\">방법론\u003c/b>에 얽매이기보다 순수한 \u003cb class=\"key\">호기심\u003c/b>에 기반한 실험을 통해 발전합니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":30,"text":"결국 과학은 정해진 가설을 검증하는 것뿐만 아니라 Curiosity 즉 호기심을 따라 직접 부딪혀 보는 과정이에요. 여러분도 공부할 때 모른다는 것을 부끄러워하지 말고 이 글처럼 당당하게 질문하며 시도해 보길 바라요. 오늘 수업은 여기서 마칠게요 고생 많았어요.","hl":null}]}]});</script></body></html>
