@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 39번","audioDir":"39_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">39번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>From Waste-Driven Economy to Product-as-a-Service\u003c/h1>\u003ch2>폐기 주도 경제에서 서비스로서의 상품으로의 전환\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>과거에는 수요 창출을 위해 \u003cb class=\"key\">계획적 \u003c/b>\u003cb class=\"key\">노후화\u003c/b> 등 폐기를 의도적으로 유도했으나, 현대에는 수리와 임대를 통한 \u003cb class=\"key\">서비스로서의 \u003c/b>\u003cb class=\"key\">상품\u003c/b> 모델이 새로운 수요와 수익을 창출하고 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The economic paradigm is shifting from creating demand through intentional product waste to generating value through maintenance and product-as-a-service models.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 경제학의 아주 흥미로운 변화를 다룬 지문을 함께 공부해보겠습니다. 예전에는 물건이 빨리 망가져야 경제가 산다고 믿었는데요, 이제는 그 반대라고 합니다. 오늘 배울 지문의 요지는 폐기가 수요를 만든다는 기존의 생각을 깨고, 수리와 서비스를 통해 새로운 가치를 창출하는 모델로 경제가 변화하고 있다는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">전통적인 자본주의 경제에서는 제품이 빨리 망가져야 소비자가 새 제품을 사게 되어 경제가 돌아간다고 믿었습니다. 이를 \u003cb class=\"key\">계획적 \u003c/b>\u003cb class=\"key\">노후화\u003c/b>(Planned Obsolescence)라고 부르는데, 마치 멀쩡한 \u003cb class=\"key\">전구\u003c/b>의 수명을 일부러 짧게 만들어 계속 팔리게 하는 전략과 같습니다. 하지만 최근에는 환경 문제와 자원 고갈로 인해 이러한 방식이 한계에 부딪혔습니다. 이제 기업들은 제품을 파는 대신 \u003cb class=\"key\">소유권\u003c/b>(Ownership)을 갖고 서비스만 제공하는 '제품 서비스 시스템(PSS)'에 주목합니다. 이는 물건을 많이 파는 것보다 하나의 제품을 \u003cb class=\"key\">오래 \u003c/b>\u003cb class=\"key\">유지\u003c/b>(Long-lasting)하는 것이 기업에 더 이득이 되는 구조로의 변화를 의미합니다.\u003c/div>","segs":[{"n":2,"text":"혹시 계획적 노후화라는 말을 들어보셨나요? 일부러 제품을 약하게 만들어서 소비자가 새것을 사게 만드는 전략이에요. 예를 들어, 전구 수명을 아주 길게 만들 수 있는데도 일부러 짧게 만드는 식이죠. 하지만 요즘은 환경을 생각하는 순환 경제가 중요해졌어요. 이제는 제품을 파는 게 아니라, 그 제품을 빌려주고 관리해주는 서비스로서의 상품 개념이 등장하게 된 배경입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>경제와 폐기의 관계\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>역사적으로 폐기는 \u003cb class=\"key\">수요\u003c/b>를 창출하여 경제를 움직이는 필수적인 요소로 간주되어 왔음을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>의도적 폐기 전략\u003csmall>근거 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>계획적 노후화나 저렴한 자재 사용 등 소비자가 \u003cb class=\"key\">교체\u003c/b>를 할 수밖에 없게 만드는 구체적인 설계 전략들을 제시합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>새로운 수요의 발견\u003csmall>전환 · 문장 6\u003c/small>\u003c/h4>\u003cp>폐기를 없애는 \u003cb class=\"key\">수리와 \u003c/b>\u003cb class=\"key\">재제조\u003c/b>가 오히려 '서비스로서의 상품'이라는 새로운 수요를 만든다는 핵심 주장이 등장합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>서비스 모델의 작동\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>기업이 제품을 \u003cb class=\"key\">임대\u003c/b>하고 유지보수 서비스를 제공함으로써 수익을 내며, 자연스럽게 \u003cb class=\"key\">내구성\u003c/b> 있는 제품을 만들게 된다는 결과를 보여줍니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 먼저 과거의 방식인 폐기 주도 경제를 설명하고, 그 다음 새로운 대안인 서비스 주도 경제로 화제를 전환합니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장은 경제의 전통적인 모습을 보여줍니다. 폐기를 경제 성장의 동력으로 보고, 판매량이 수요와 직결된다는 점을 짚어주고 있네요.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장까지는 기업들이 폐기를 보장하기 위해 썼던 꼼수들을 설명해요. 계획적 노후화나 수리 도구 차단 같은 전략으로 소비자가 제품을 바꿀 수밖에 없게 만들었죠.","hl":"f1"},{"n":6,"text":"여섯 번째 문장이 이 글의 핵심인 반전입니다. 수리와 재제조를 통해 폐기를 없애는 노력이 오히려 서비스로서의 상품이라는 새로운 수요를 만든다는 사실을 사람들은 몰랐다는 거예요.","hl":"f2"},{"n":7,"text":"일곱 번째와 여덟 번째 문장에서는 그 결과로 나타난 임대 모델을 설명합니다. 이제 기업은 물건을 파는 게 아니라 빌려주면서, 유지 보수 서비스를 통해 지속적인 수익을 얻고 더 튼튼한 제품을 만들게 됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">통념-반박\u003c/span>\u003cspan class=\"lp-pill\">중괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">초반부에는 폐기가 경제 발전에 필요하다는 \u003cb class=\"key\">전통적 \u003c/b>\u003cb class=\"key\">통념\u003c/b>을 설명합니다. 여섯 번째 문장에서 '실패했다(failed to realize)'는 표현을 통해 분위기를 반전시키며 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">대안\u003c/b>을 제시합니다. 마지막에는 소유권 이전이라는 구체적인 \u003cb class=\"key\">비즈니스 \u003c/b>\u003cb class=\"key\">모델\u003c/b>을 통해 주장을 뒷받침합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Therefore (3)\u003c/b>\u003cspan>폐기 전략의 논리적 귀결\u003c/span>\u003cb>failed to realize (6)\u003c/b>\u003cspan>기존 관점의 한계 지적 및 전환\u003c/span>\u003cb>Through this setup (7)\u003c/b>\u003cspan>새로운 모델의 구체화\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Waste\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">planned obsolescence\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">replacement\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">elimination of waste\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">products as a service\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">lease out\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">maintenance and repair services\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Traditional Waste-driven Model\u003c/th>\u003cth>Modern Product-as-a-Service Model\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Waste is necessary for demand\u003c/td>\u003ctd>Elimination of waste creates demand\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Planned obsolescence\u003c/td>\u003ctd>Long-lasting products\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Selling products directly\u003c/td>\u003ctd>Leasing and offering services\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 지문은 통념과 반박의 구조를 가지고 있어요. 처음에는 폐기가 필요하다는 일반적인 생각을 보여주다가 중간에 그 생각이 틀렸음을 지적하는 중괄식 구조입니다. 핵심 주장이 담긴 여섯 번째 문장을 기준으로 글의 흐름이 완전히 바뀝니다.","hl":"ty"},{"n":9,"text":"세 번째 문장의 Therefore는 폐기 전략이 왜 생겼는지 논리적으로 연결해 줍니다. 가장 중요한 신호는 여섯 번째 문장의 failed to realize인데요, 기존 지지자들이 무언가를 깨닫지 못했다는 표현을 통해 필자의 새로운 주장을 강조하고 있어요. 마지막에 Through this setup은 앞에서 말한 서비스 모델이 구체적으로 어떻게 돌아가는지 설명해 줍니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>waste\u003c/b>\u003cem>명사\u003c/em>\u003cspan>폐기, 쓰레기\u003c/span>\u003c/div>\u003cdiv>\u003cb>historically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>역사적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>driver\u003c/b>\u003cem>명사\u003c/em>\u003cspan>동인, 원동력\u003c/span>\u003c/div>\u003cdiv>\u003cb>be tied to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 결부되다\u003c/span>\u003c/div>\u003cdiv>\u003cb>amount\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양\u003c/span>\u003c/div>\u003cdiv>\u003cb>dependent on\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 의존하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>demand\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수요\u003c/span>\u003c/div>\u003cdiv>\u003cb>ensure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보장하다, 확실히 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sustained\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>지속되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>incorporate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>포함하다, 통합하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>inevitable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>불가피한\u003c/span>\u003c/div>\u003cdiv>\u003cb>planned obsolescence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>계획적 노후화\u003c/span>\u003c/div>\u003cdiv>\u003cb>access\u003c/b>\u003cem>명사\u003c/em>\u003cspan>접근\u003c/span>\u003c/div>\u003cdiv>\u003cb>replacement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>교체, 대체물\u003c/span>\u003c/div>\u003cdiv>\u003cb>prioritize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>우선순위를 두다\u003c/span>\u003c/div>\u003cdiv>\u003cb>elimination\u003c/b>\u003cem>명사\u003c/em>\u003cspan>제거\u003c/span>\u003c/div>\u003cdiv>\u003cb>remanufacturing\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재제조\u003c/span>\u003c/div>\u003cdiv>\u003cb>setup\u003c/b>\u003cem>명사\u003c/em>\u003cspan>구조, 설정\u003c/span>\u003c/div>\u003cdiv>\u003cb>lease out\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>임대하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>transition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이전, 이행\u003c/span>\u003c/div>\u003cdiv>\u003cb>ownership\u003c/b>\u003cem>명사\u003c/em>\u003cspan>소유권\u003c/span>\u003c/div>\u003cdiv>\u003cb>maintenance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유지, 보수\u003c/span>\u003c/div>\u003cdiv>\u003cb>long-lasting\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>오래 지속되는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"여기서 planned obsolescence라는 표현은 꼭 기억해두세요. 계획적 노후화라는 뜻으로 경제 지문에서 자주 나옵니다. 그리고 lease out은 임대하다라는 뜻인데, 판매와 대조되는 서비스 모델의 핵심 단어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">inevitable\u003c/b>\u003cspan class=\"m\">불가피한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">unavoidable\u003c/span>\u003cspan class=\"s\">inescapable\u003c/span>\u003cspan class=\"s\">certain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">avoidable\u003c/span>\u003cspan class=\"a\">evadable\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">sustained\u003c/b>\u003cspan class=\"m\">지속되는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">maintained\u003c/span>\u003cspan class=\"s\">continued\u003c/span>\u003cspan class=\"s\">prolonged\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">interrupted\u003c/span>\u003cspan class=\"a\">ceased\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">elimination\u003c/b>\u003cspan class=\"m\">제거\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan clas 으로 여겨져 왔다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 폐기가 단순히 버려지는 쓰레기가 아니라 경제를 움직이는 \u003cb class=\"key\">핵심적인 \u003c/b>\u003cb class=\"key\">동력\u003c/b>이었다는 통념을 제시합니다. 경제 활성화를 위해 소비와 폐기가 \u003cb class=\"key\">반복\u003c/b>되어야 한다는 시각을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료 수동태\u003c/span> : has + been + p.p. (과거분사) : \"여겨져 왔다\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Waste, 폐기는. has historically been seen, 역사적으로 여겨져 왔다. as a necessary driver, 필수적인 동인으로. of the economy, 경제의.. 이 문장 전체를 해석하면, 폐기는 역사적으로 경제의 필수적인 동인으로 여겨져 왔다.","hl":"m"},{"n":13,"text":"첫 번째 문장은 폐기를 바라보는 전통적인 경제적 관점을 소개하고 있어요. 폐기가 단순한 쓰레기가 아니라 경제 성장을 이끄는 아주 중요한 원동력이라는 점을 짚어주고 있죠.","hl":"mn"},{"n":14,"text":"여기서 has been seen 부분에 주목해 보세요. 폐기라는 주어가 스스로 보는 게 아니라 사람들로부터 그렇게 여겨져 온 것이니까 현재완료 수동태를 썼어요. 중간에 부사 historically가 들어가서 역사적으로 계속 그래왔다는 의미를 강조하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">판매량은 결부된다 \u003c/span>\u003cspan class=\"en\">Sales \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">tied \u003c/span>\u003cspan class=\"tgt\">to\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 제품의 공급량에, \u003c/span>\u003cspan class=\"en\">the amount of a product \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">supplied\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 직접적으로 의존한다 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">is\u003c/span> directly dependent on\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 제품에 대한 수요량에.\u003c/span>\u003cspan class=\"en\">the demand for that product.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">판매량은 어떤 제품의 공급량에 결부되고, 그것은 그 제품에 대한 수요량에 직접적으로 의존한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 판매와 공급, 그리고 수요 사이의 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 설명합니다. 결국 판매가 유지되려면 제품에 대한 \u003cb class=\"key\">지속적인 \u003c/b>\u003cb class=\"key\">수요\u003c/b>가 뒷받침되어야 함을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 + p.p. + to : \"~에 결부되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : 명사 + p.p. : \"공급된\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : comma(,) + which + 동사 : \"그런데 그것은\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Sales are tied to, 판매량은 결부된다. the amount of a product supplied, 어떤 제품의 공급량에. which is directly dependent on, 그것은 직접적으로 의존한다. the demand for that product, 그 제품에 대한 수요량에.. 이 문장 전체를 해석하면, 판매량은 어떤 제품의 공급량에 결부되고, 그것은 그 제품에 대한 수요량에 직접적으로 의존한다.","hl":"m"},{"n":16,"text":"두 번째 문장은 경제의 순환 논리를 보여줍니다. 물건이 얼마나 팔리느냐는 공급량과 연결되고, 그 공급량은 다시 사람들이 얼마나 원하는지, 즉 수요에 따라 결정된다는 기초적인 상관관계를 말하고 있어요.","hl":"mn"},{"n":17,"text":"첫 번째로 are tied to는 수동태로 쓰여서 판매량이 공급량과 묶여 있다는 걸 나타내고요. 두 번째로 supplied는 앞에 있는 product를 꾸며주는 과거분사예요. 공급된 제품이라는 뜻이죠. 마지막으로 콤마 찍고 나온 which는 계속적 용법의 관계대명사로, 앞의 상황이 수요에 의존하고 있다는 사실을 자연스럽게 이어줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">따라서, 만약 여러분이 그 제품을 설계한다면 \u003c/span>\u003cspan class=\"en\">Therefore, if you design the product\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u 비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생각을 지지했던 사람들은 \u003c/span>\u003cspan class=\"en\">Those who supported \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">idea \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">폐기가 수요를 촉진하는 데 필수적이라는 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> waste is necessary to drive demand\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깨닫는 데 실패했다 \u003c/span>\u003cspan class=\"en\">failed to realize\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">폐기의 제거를 우선시하는 것이 \u003c/span>\u003cspan class=\"en\">that prioritizing the elimination of waste\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수리와 재제조를 통해 \u003c/span>\u003cspan class=\"en\">via repair and remanufacturing\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 종류의 수요를 창출한다는 것을: \u003c/span>\u003cspan class=\"en\">creates a different kind of demand:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서비스로서의 상품이라는\u003c/span>\u003cspan class=\"en\">products as a service.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">폐기가 수요를 촉진하는 데 필수적이라는 생각을 지지했던 사람들은 수리와 재제조를 통해 폐기의 제거를 우선시하는 것이 서비스로서의 상품이라는 다른 종류의 수요를 창출한다는 것을 깨닫는 데 실패했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 글의 핵심 \u003cb class=\"key\">반전\u003c/b> 문장입니다. 폐기가 있어야 경제가 돌아간다고 믿는 사람들의 통념과 달리, \u003cb class=\"key\">재사용\u003c/b>을 중시하는 모델에서도 '서비스'라는 형태의 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">수요\u003c/b>가 생겨날 수 있음을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 접속사 that\u003c/span> : 추상명사(the idea) + that + 완전한 문장 : \"~라는 생각\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동명사 주어와 수의 일치\u003c/span> : [prioritizing (동명사 주어)] + [단수 동사 (creates)] : \"제거를 우선시하는 것이 ... 창출한다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"Those who supported the idea, 생각을 지지했던 사람들은. that waste is necessary to drive demand, 폐기가 수요를 촉진하는 데 필수적이라는. failed to realize, 깨닫는 데 실패했다. that prioritizing the elimination of waste, 폐기의 제거를 우선시하는 것이. via repair and remanufacturing, 수리와 재제조를 통해. creates a different kind of demand, 다른 종류의 수요를 창출한다는 것을:. products as a service, 서비스로서의 상품이라는. 이 문장 전체를 해석하면, 폐기가 수요를 촉진하는 데 필수적이라는 생각을 지지했던 사람들은 수리와 재제조를 통해 폐기의 제거를 우선시하는 것이 서비스로서의 상품이라는 다른 종류의 수요를 창출한다는 것을 깨닫는 데 실패했다.","hl":"m"},{"n":28,"text":"이 문장은 글의 흐름을 바꾸는 아주 중요한 문장이에요. 물건을 버려야 경제가 산다고 믿는 사람들은, 오히려 안 버리고 고쳐 쓰는 방식이 서비스 중심의 새로운 경제 시장을 만든다는 점을 몰랐다는 내용입니다.","hl":"mn"},{"n":29,"text":"첫 번째로 the idea 뒤에 나오는 that은 동격의 접속사입니다. 아이디어의 내용을 보충 설명해주죠. 두 번째로 realize의 목적어절 안에서 주어는 prioritizing이라는 동명사구예요. 그래서 동사를 복수가 아닌 단수형 creates로 썼다는 점이 중요합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 구조를 통해 \u003c/span>\u003cspan class=\"en\">Through this setup,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기업들은 제품들을 단순히 임대한다 \u003c/span>\u003cspan class=\"en\">companies simply lease out products\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">한때 판매되었던 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">once \u003c/span>\u003cspan class=\"tgt\">sold\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소비자에게 직접적으로.\u003c/span>\u003cspan class=\"en\">directly to the customer.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 구조를 통해 기업들은 한때 소비자에게 직접적으로 판매되었던 제품들을 단순히 임대한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 '제품의 서비스화'가 구체적으로 어떻게 운영되는지 보여줍니다. 제품을 판매하여 소유권을 넘기는 대신 \u003cb class=\"key\">임대 \u003c/b>\u003cb class=\"key\">모델\u003c/b>을 통해 기업이 제품의 제어권을 계속 보유하게 된다는 의미입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : products [선행사] + that [관계대명사] + were [동사] : \"~한 (제품들)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거 수동태\u003c/span> : be동사 과거(were) + 과거분사(sold) : \"판매되었던\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Through this setup, 이러한 구조를 통해. companies simply lease out products, 기업들은 제품들을 단순히 임대한다. that were once sold, 한때 판매되었던. directly to the customer, 소비자에게 직접적으로.. 이 문장 전체를 해석하면, 이러한 구조를 통해 기업들은 한때 소비자에게 직접적으로 판매되었던 제품들을 단순히 임대한다.","hl":"m"},{"n":31,"text":"이 문장은 제품을 파는 대신 빌려주는 방식으로의 변화를 설명하고 있어요. 물건을 한 번 팔고 끝내는 게 아니라 기업이 계속 관리하는 임대 모델로 바뀐다는 핵심적인 내용이죠.","hl":"mn"},{"n":32,"text":"첫 번째로 products 뒤에 나온 that은 주격 관계대명사로 쓰여서 한때 판매되었던 제품들이라고 뒤에서 꾸며주고 있어요. 두 번째로 were once sold 부분은 제품이 판매되는 대상임을 분명히 하기 위해 수동태를 사용했습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 소유권의 이전으로 \u003c/span>\u003cspan class=\"en\">With this transition of ownership,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기업들은 수익을 유지하고 \u003c/span>\u003cspan class=\"en\">companies maintain profit\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유지와 수리 서비스들을 제공함으로써 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">offering\u003c/span> maintenance and repair services\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">장려된다 \u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">encouraged \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 오래 지속되는 제품들을 개발하도록.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">develop\u003c/span> long­lasting products.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 소유권의 이전으로 기업들은 유지와 수리 서비스들을 제공 함으로써 수익을 유지하고 더 오래 지속되는 제품들을 개발하도록 장려된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 소유권이 소비자에게 넘어가지 않기 때문에, 기업은 수리 비용을 줄이고 수익을 높이기 위해 \u003cb class=\"key\">내구성\u003c/b> 있는 제품을 만들려는 \u003cb class=\"key\">경제적 \u003c/b>\u003cb class=\"key\">동기\u003c/b>를 갖게 된다는 내용입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사 + 동명사\u003c/span> : by [전치사] + offering [동명사] : \"제공함으로써\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 수동태\u003c/span> : be [동사] + encouraged [과거분사] + to-v [목적격 보어] : \"개발하도록 장려된다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"With this transition of ownership, 이러한 소유권의 이전으로. companies maintain profit, 기업들은 수익을 유지하고. by offering maintenance and repair services, 유지와 수리 서비스들을 제공함으로써. and are encouraged, 장려된다. to develop long­lasting products, 더 오래 지속되는 제품들을 개발하도록.. 이 문장 전체를 해석하면, 이러한 소유권의 이전으로 기업들은 유지와 수리 서비스들을 제공 함으로써 수익을 유지하고 더 오래 지속되는 제품들을 개발하도록 장려된다.","hl":"m"},{"n":34,"text":"소유권이 소비자에게 넘어가지 않고 기업에 남아있기 때문에 나타나는 긍정적인 변화를 다루고 있어요. 기업들이 수리비를 아끼기 위해 일부러 제품을 튼튼하게 만들게 된다는 논리적인 흐름을 이해해야 합니다.","hl":"mn"},{"n":35,"text":"첫 번째로 by offering은 수단을 나타내는 전치사구로 서비스를 제공함으로써라고 해석하세요. 두 번째로 are encouraged to develop은 오형식 수동태 구조로 목적격 보어였던 to부정사가 수동태 뒤에 붙어 무엇을 하도록 장려되는지 설명해주고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>역사적으로 \u003cb class=\"key\">폐기\u003c/b>는 경제 성장을 위해 새로운 수요를 창출하는 필수적인 수단으로 여겨져 왔다.\u003c/li>\u003cli>기업들은 \u003cb class=\"key\">계획적 \u003c/b>\u003cb class=\"key\">노후화\u003c/b>나 저렴한 자재 사용 등의 전략으로 제품의 빠른 교체를 의도적으로 유도해 왔다.\u003c/li>\u003cli>하지만 수리와 재제조를 통해 폐기를 없애는 것이 오히려 \u003cb class=\"key\">서비스로서의 \u003c/b>\u003cb class=\"key\">상품\u003c/b>이라는 새로운 시장을 만든다.\u003c/li>\u003cli>소유권이 기업에 남는 \u003cb class=\"key\">임대 \u003c/b>\u003cb class=\"key\">모델\u003c/b>로 전환되면, 기업은 수익을 위해 더 튼튼하고 오래가는 제품을 개발하게 된다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The economic paradigm is shifting from creating demand through intentional product waste to generating value through maintenance and product-as-a-service models.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">과거에는 수요 창출을 위해 \u003cb class=\"key\">계획적 \u003c/b>\u003cb class=\"key\">노후화\u003c/b> 등 폐기를 의도적으로 유도했으나, 현대에는 수리와 임대를 통한 \u003cb class=\"key\">서비스로서의 \u003c/b>\u003cb class=\"key\">상품\u003c/b> 모델이 새로운 수요와 수익을 창출하고 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"결국 이 글은 물건을 한 번 팔고 끝내는 것이 아니라, 지속적인 서비스를 통해 수익을 창출하는 더 나은 경제 모델을 제시하고 있어요. 소유권이 기업에 있을 때 제품이 더 튼튼해진다는 점이 참 역설적이면서도 재미있죠? 오늘 배운 서비스로서의 상품이라는 개념을 잘 정리해두시길 바랍니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
