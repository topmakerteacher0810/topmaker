<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 41~42번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}
.lp .mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pk);color:#fff;font-size:11.5px;font-weight:800;margin:0 3px;vertical-align:4px;line-height:1}
.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}
.lp-ap{font-size:14.5px;line-height:1.6;border:1px solid #BFE8E5;border-radius:10px;padding:9px 14px}
.lp-ap h5{margin:0 0 4px;display:inline-block;background:var(--pk);color:#fff;font-size:12px;border-radius:4px;padding:1px 9px}
.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}
.lp-top{border-bottom:1.5px solid var(--pk)}

.lp-name{font-family:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;font-weight:700;color:var(--pk-t)}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 41~42번","audioDir":"41_audio","preview":false,"count":69,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:0.707em\">41~42번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>The Paradox of Muscle: Harmony in Opposing Forces\u003c/h1>\u003ch2>근육의 역설: 대립하는 힘들의 조화\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>근육은 수축과 이완이라는 \u003cb class=\"key\">대립하는 \u003c/b>\u003cb class=\"key\">작용\u003c/b>의 조화를 통해 움직임을 만들어내며, 신체 활동과 관련된 이분법적 개념들은 실제로는 서로를 필요로 하는 \u003cb class=\"key\">역설적 \u003c/b>\u003cb class=\"key\">관계\u003c/b>에 있다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Muscle movement and related physical concepts are defined by the interdependence of opposing forces and paradoxical coordination.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요 여러분! 오늘은 우리 몸의 근육이 움직이는 신비로운 방식과 그 속에 담긴 철학적 역설을 다룬 지문을 함께 공부해 보겠습니다. 이 글은 근육의 수축과 이완이라는 구체적 사례를 통해, 대립하는 개념들이 어떻게 서로를 완성하는지 보여줍니다. 요지는 근육의 움직임과 운동 개념들이 반대되는 힘들의 상호 의존과 역설적 조화로 정의된다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">근육의 움직임은 주동근이 수축할 때 길항근이 이완하는 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">억제\u003c/b>(Reciprocal Inhibition) 원리로 작동합니다. 마치 \u003cb class=\"key\">시소\u003c/b>가 한쪽이 내려가야 다른 쪽이 올라가는 것과 비슷하죠. 운동학에서는 이를 \u003cb class=\"key\">협응\u003c/b>(Coordination)이라고 부르며, 단순히 힘을 쓰는 것뿐만 아니라 힘을 빼는 과정도 똑같이 중요합니다. 이 글은 이러한 생물학적 메커니즘을 \u003cb class=\"key\">유전과 \u003c/b>\u003cb class=\"key\">환경\u003c/b>(Nature vs Nurture)이나 운동 방식 같은 철학적, 실천적 질문으로 확장하여 설명하고 있습니다.\u003c/div>","segs":[{"n":2,"text":"우리가 팔을 굽힐 때 이두근은 단단해지지만 삼두근은 힘을 빼고 늘어나야 합니다. 이걸 생물학에서는 상호 억제라고 부르는데, 쉽게 말해 시소의 한쪽이 내려가야 반대쪽이 올라가는 것과 같죠. 단순히 힘을 주는 것뿐만 아니라 힘을 빼는 것 역시 움직임의 필수 요소입니다. 이 글은 이런 신체적 원리를 유전과 환경, 빠름과 느림 같은 더 넓은 개념의 조화로 연결해서 설명하고 있어요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>근육의 상반된 작용\u003csmall>도입 · 문장 1–4\u003c/small>\u003c/h4>\u003cp>팔의 움직임에 따라 이두근과 삼두근이 번갈아 \u003cb class=\"key\">수축하고 \u003c/b>\u003cb class=\"key\">이완\u003c/b>하며 역할을 뒤바꾸는 과정을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>근육의 역설적 본질\u003csmall>주장 · 문장 5–8\u003c/small>\u003c/h4>\u003cp>모든 신체 활동은 근육이 하는 일과 \u003cb class=\"key\">하지 \u003c/b>\u003cb class=\"key\">않는 \u003c/b>\u003cb class=\"key\">일\u003c/b>이 조화를 이루는 \u003cb class=\"key\">역설적 \u003c/b>\u003cb class=\"key\">체계\u003c/b>임을 밝힙니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>운동에 관한 질문들\u003csmall>예시 · 문장 9–14\u003c/small>\u003c/h4>\u003cp>유전, 환경, 강도, 속도 등 운동과 관련된 다양한 \u003cb class=\"key\">이분법적 \u003c/b>\u003cb class=\"key\">질문\u003c/b>들을 제시하며 독자의 관심을 유도합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>대립항의 상호의존\u003csmall>결론 · 문장 15–19\u003c/small>\u003c/h4>\u003cp>겉보기에는 양극화된 반대 개념들이 실제로는 \u003cb class=\"key\">서로를 \u003c/b>\u003cb class=\"key\">필요\u003c/b>로 하는 역설임을 강조하며 마무리합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"먼저 근육의 구체적인 작동 방식에서 시작해, 신체 활동의 역설적 본질을 지나 대립 개념들의 상호 의존성으로 나아갑니다.","hl":null},{"n":4,"text":"첫 번째 단계인 첫 번째 문장에서 네 번째 문장까지는 팔의 움직임에 따라 이두근과 삼두근이 번갈아 수축하고 이완하며 역할을 뒤바꾸는 과정을 상세히 설명합니다.","hl":"f0"},{"n":5,"text":"두 번째 단계인 다섯 번째 문장에서 여덟 번째 문장은 신체 활동이 근육이 하는 일뿐만 아니라 하지 않는 일에도 의존한다는 역설적 체계라는 주장을 펼쳐요.","hl":"f1"},{"n":6,"text":"세 번째 단계인 아홉 번째 문장에서 열네 번째 문장은 유전, 환경, 강도, 속도 등 운동과 관련된 여러 이분법적 질문들을 예시로 던지며 생각을 확장합니다.","hl":"f2"},{"n":7,"text":"마지막 단계인 열다섯 번째 문장에서 열아홉 번째 문장은 겉보기에는 양극화된 반대 개념들이 실제로는 서로를 필요로 하는 역설임을 강조하며 마무리합니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시-주장\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 19번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">초반부에는 팔 근육의 생물학적 메커니즘을 구체적인 \u003cb class=\"key\">예시\u003c/b>로 들어 독자의 이해를 돕습니다. 이후 이를 신체 활동 전반의 \u003cb class=\"key\">역설적 \u003c/b>\u003cb class=\"key\">성격\u003c/b>으로 일반화하며 논의를 확장합니다. 마지막에는 운동과 관련된 여러 대립 개념들이 결국 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">보완적\u003c/b>임을 강조하며 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>Reversing the motion (3)\u003c/b>\u003cspan>대조적 상황 제시\u003c/span>\u003cb>But (17)\u003c/b>\u003cspan>반전 및 핵심 주장 암시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">opposing muscles\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">contract and relax\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">system of coordination\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">paradoxical\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">paradoxes\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">require each other\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Nature (Born)\u003c/th>\u003cth>Nurture (Made)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Inborn difference\u003c/td>\u003ctd>Depends on what people do\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Stationary state\u003c/td>\u003ctd>Active exercise\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 초반에 팔 근육의 움직임을 예시로 드는 예시형 구조를 취하고 있습니다. 구체적인 사례에서 시작해 일반적인 원리로 나아가는 귀납적 추론 방식도 엿보이죠. 주제문이 마지막 열아홉 번째 문장에 위치한 전형적인 미괄식 구성이에요.","hl":"ty"},{"n":9,"text":"세 번째 문장의 Reversing the motion은 동작의 반전을 나타내며 역할의 변화를 보여줍니다. 열일곱 번째 문장의 But은 앞서 말한 이분법적 사고에 제동을 걸며 진짜 하고 싶은 말인 역설의 개념을 도입하는 중요한 전환점 역할을 하죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>hanging\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>늘어져 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>side\u003c/b>\u003cem>명사\u003c/em>\u003cspan>옆구리, 옆면\u003c/span>\u003c/div>\u003cdiv>\u003cb>opposing\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대립하는\u003c/span>\u003c/div>\u003cdiv>\u003cb>shorten\u003c/b>\u003cem>동사\u003c/em>\u003cspan>짧아지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>lengthen\u003c/b>\u003cem>동사\u003c/em>\u003cspan>길어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>contract\u003c/b>\u003cem>동사\u003c/em>\u003cspan>수축하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>relax\u003c/b>\u003cem>동사\u003c/em>\u003cspan>이완하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>biceps\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이두근\u003c/span>\u003c/div>\u003cdiv>\u003cb>triceps\u003c/b>\u003cem>명사\u003c/em>\u003cspan>삼두근\u003c/span>\u003c/div>\u003cdiv>\u003cb>reversing\u003c/b>\u003cem>동사\u003c/em>\u003cspan>반대로 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>role\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역할\u003c/span>\u003c/div>\u003cdiv>\u003cb>coordination\u003c/b>\u003cem>명사\u003c/em>\u003cspan>조정, 협응\u003c/span>\u003c/div>\u003cdiv>\u003cb>managed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>관리되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>orchestrated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>조화롭게 편성된\u003c/span>\u003c/div>\u003cdiv>\u003cb>tension\u003c/b>\u003cem>명사\u003c/em>\u003cspan>긴장\u003c/span>\u003c/div>\u003cdiv>\u003cb>activate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>활성화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>deactivate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>비활성화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>paradoxical\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>역설적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>nurture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>환경, 양육\u003c/span>\u003c/div>\u003cdiv>\u003cb>inborn\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>타고난\u003c/span>\u003c/div>\u003cdiv>\u003cb>weights\u003c/b>\u003cem>명사\u003c/em>\u003cspan>중량, 역기\u003c/span>\u003c/div>\u003cdiv>\u003cb>polarize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>양극화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>polarities\u003c/b>\u003cem>명사\u003c/em>\u003cspan>양극성\u003c/span>\u003c/div>\u003cdiv>\u003cb>paradoxes\u003c/b>\u003cem>명사\u003c/em>\u003cspan>역설\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"contract와 relax는 이 지문의 핵심 짝꿍 단어이니 꼭 외워두세요. 특히 paradoxical이라는 단어는 이 글의 주제를 관통하는 키워드로, 모순되어 보이지만 실제로는 진리인 상태를 말합니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">contract\u003c/b>\u003cspan class=\"m\">수축하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">shrink\u003c/span>\u003cspan class=\"s\">compress\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">relax\u003c/span>\u003cspan class=\"a\">expand\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">coordination\u003c/b>\u003cspan class=\"m\">조정, 협응\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">harmony\u003c/span>\u003cspan class=\"s\">integration\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">imbalance\u003c/span>\u003cspan class=\"a\">disarray\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">paradoxical\u003c/b>\u003cspan class=\"m\">역설적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">contradictory\u003c/span>\u003cspan class=\"s\">inconsistent\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">consistent\u003c/span>\u003cspan class=\"a\">logical\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">nurture\u003c/b>\u003cspan class=\"m\">환경, 양육\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">upbringing\u003c/span>\u003cspan class=\"s\">training\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">nature\u003c/span>\u003cspan class=\"a\">heredity\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">polarize\u003c/b>\u003cspan class=\"m\">양극화하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">divide\u003c/span>\u003cspan class=\"s\">separate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">unite\u003c/span>\u003cspan class=\"a\">combine\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어를 살펴볼까요? paradoxical과 비슷한 의미로는 contradictory가 있고, 반대말로는 logical이 있습니다. polarize는 양극화하다라는 뜻인데, 이 글에서는 이런 양극화된 시각을 경계하고 서로 필요로 하는 관계를 강조하고 있어요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손이 여러분의 옆에 늘어져 있다가\u003c/span>\u003cspan class=\"en\">When your hand is hanging at your side\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 그것을 올릴 때,\u003c/span>\u003cspan class=\"en\">and then you lift it,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 상완에 있는 대립하는 근육들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">opposing \u003c/span>\u003cspan class=\"tgt\">muscles\u003c/span> on your upper arm\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">짧아지고 길어진다. 즉, 수축하고 이완한다.\u003c/span>\u003cspan class=\"en\">shorten and lengthen ― contract and relax ―\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팔꿈치를 굽히기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">bend\u003c/span> the elbow.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">손이 여러분의 옆에 늘어져 있다가 여러분이 그것을 올릴 때, 여러분의 상완에 있는 대립하는 근육들은 팔꿈치를 굽히기 위해 짧아지고 길어진다. 즉, 수축하고 이완한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 팔꿈치를 굽히는 동작이 단독 근육이 아닌 \u003cb class=\"key\">대립하는 \u003c/b>\u003cb class=\"key\">근육\u003c/b> 쌍의 상호작용으로 발생함을 설명합니다. 한쪽이 짧아지면 다른 쪽이 길어지는 \u003cb class=\"key\">수축과 \u003c/b>\u003cb class=\"key\">이완\u003c/b>의 조화를 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 명사 수식\u003c/span> : 현재분사(~ing) + 명사 : \"대립하는 근육들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형 : \"굽히기 위해\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"When your hand is hanging at your side, 손이 여러분의 옆에 늘어져 있다가. and then you lift it, 여러분이 그것을 올릴 때. opposing muscles on your upper arm, 여러분의 상완에 있는 대립하는 근육들은. shorten and lengthen ― contract and relax ―, 짧아지고 길어진다. 즉, 수축하고 이완한다.. to bend the elbow, 팔꿈치를 굽히기 위해. 이 문장 전체를 해석하면, 손이 여러분의 옆에 늘어져 있다가 여러분이 그것을 올릴 때, 여러분의 상완에 있는 대립하는 근육들은 팔꿈치를 굽히기 위해 짧아지고 길어진다. 즉, 수축하고 이완한다.","hl":"m"},{"n":13,"text":"우리가 팔을 들어 올릴 때 일어나는 생물학적 과정을 설명하고 있어요. 단순히 근육 하나가 움직이는 게 아니라 서로 반대되는 역할을 하는 대립하는 근육 쌍이 수축과 이완을 함께 하며 조화를 이룬다는 게 핵심이에요.","hl":"mn"},{"n":14,"text":"첫 번째로 명사 muscles를 꾸며주는 opposing을 보세요. 근육이 서로 대항하여 작용한다는 능동의 의미를 담은 현재분사 형용사예요. 두 번째로 마지막 부분의 to bend는 근육들이 왜 수축하고 이완하는지 그 동작의 목적을 나타내는 부사적 용법으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이두근은 수축하고,\u003c/span>\u003cspan class=\"en\">Biceps \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">contract, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삼두근은 이완한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">triceps \u003c/span>\u003cspan class=\"tgt\">relax\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘이두근은 수축하고, 삼두근은 이완한다.’\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 설명한 근육의 상호작용을 이두근과 삼두근이라는 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">예시\u003c/b>로 제시합니다. 두 근육이 \u003cb class=\"key\">동시에 \u003c/b>\u003cb class=\"key\">반대\u003c/b>로 움직임을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">병렬 구조\u003c/span> : 주어1 + 동사1, and + 주어2 + 동사2 : \"수축하고, 삼두근은 이완한다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"Biceps contract, 이두근은 수축하고. and triceps relax, 삼두근은 이완한다.. 이 문장 전체를 해석하면, ‘이두근은 수축하고, 삼두근은 이완한다.’","hl":"m"},{"n":16,"text":"팔을 굽힐 때 실제로 어떤 근육이 어떻게 변하는지 구체적인 예시를 들어주고 있어요. 이두근이 짧아지며 힘을 쓸 때 삼두근은 반대로 길어지며 이완한다는 구체적인 현상을 보여주는 문장입니다.","hl":"mn"},{"n":17,"text":"이 문장은 아주 단순한 병렬 구조예요. 접속사 and를 사이에 두고 이두근의 동작과 삼두근의 동작이 대칭을 이루면서 두 근육의 상반된 상태를 효과적으로 대조하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 동작을 반대로 하여\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Reversing \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">motion\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 손을 다시 아래로 떨어뜨릴 때는,\u003c/span>\u003cspan class=\"en\">when you drop your hand back down,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근육들이 역할을 뒤바꾼다.\u003c/span>\u003cspan class=\"en\">muscles reverse roles.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 동작을 반대로 하여 여러분이 손을 다시 아래로 떨어뜨릴 때는, 근육들이 역할을 뒤바꾼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 동작의 방향이 바뀌면 근육의 \u003cb class=\"key\">기능적 \u003c/b>\u003cb class=\"key\">역할\u003c/b> 또한 정반대로 전환됨을 설명합니다. 상황에 맞춰 근육이 \u003cb class=\"key\">유연하게 \u003c/b>\u003cb class=\"key\">조절\u003c/b>된다는 점이 포인트입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">분사구문\u003c/span> : v-ing ~, 주어 + 동사 : \"동작을 반대로 하면서\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"Reversing the motion, 그 동작을 반대로 하여. when you drop your hand back down, 여러분이 손을 다시 아래로 떨어뜨릴 때는. muscles reverse roles, 근육들이 역할을 뒤바꾼다.. 이 문장 전체를 해석하면, 그 동작을 반대로 하여 여러분이 손을 다시 아래로 떨어뜨릴 때는, 근육들이 역할을 뒤바꾼다.","hl":"m"},{"n":19,"text":"앞서 팔을 올릴 때와는 반대로, 이제 팔을 내리는 상황을 가정합니다. 이때는 이두근과 삼두근의 역할이 서로 뒤바뀌면서 상황에 맞춰 유연하게 조절된다는 점을 설명하고 있어요.","hl":"mn"},{"n":20,"text":"문장 맨 앞의 Reversing the motion을 주목하세요. 주절의 주어인 근육들이 동작을 반대로 바꾸는 주체이기 때문에 능동을 의미하는 현재분사 구문으로 시작한 거예요. 접속사 As나 When을 넣은 부사절로도 바꿀 수 있는 형태입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">삼두근은 수축하고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Triceps \u003c/span>\u003cspan class=\"tgt\">contract, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이두근은 이완한다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">biceps \u003c/span>\u003cspan class=\"tgt\">relax\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">‘삼두근은 수축하고, 이두근은 이완한다.’\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 팔을 아래로 내릴 때 일어나는 근육의 상반된 작용을 설명합니다. 앞서 나온 팔을 올릴 때와 비교하여 근육이 서로 \u003cb class=\"key\">역할\u003c/b>을 바꾸어 움직임을 조절하는 과정을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">절과 절의 병렬 구조\u003c/span> : [주어1 + 동사1], and [주어2 + 동사2] : \"삼두근은 수축하고, 이두근은 이완한다\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Triceps contract, 삼두근은 수축하고. and biceps relax, 이두근은 이완한다.. 이 문장 전체를 해석하면, ‘삼두근은 수축하고, 이두근은 이완한다.’","hl":"m"},{"n":22,"text":"팔을 다시 아래로 내릴 때 일어나는 작용을 설명하는 문장이에요. 앞 문장에서 팔을 올릴 때와는 정반대로 두 근육이 역할을 바꾸어 움직임을 만든다는 것을 보여주죠.","hl":"mn"},{"n":23,"text":"문장 구조는 아주 간단합니다. Triceps와 biceps라는 주어 뒤에 각각 contract와 relax라는 자동사가 쓰여서 대칭을 이루는 병렬 구조로 이루어져 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">손을 올리거나 그것을 떨어뜨려라,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Lift \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">hand \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">drop \u003c/span>\u003cspan class=\"tgt\">it, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면 근육은 보여준다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and\u003c/span> muscle shows\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것이 무엇인지를:\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">is\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조정의 체계인,\u003c/span>\u003cspan class=\"en\">a system of coordination,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조화롭게 편성된 긴장에 의해 관리되는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">managed \u003c/span>\u003cspan class=\"tgt\">by\u003c/span> orchestrated tension.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분의 손을 올리거나 떨어뜨리면, 근육은 그것이 무엇인지를 보여 주는데, 즉 조화롭게 편성된 긴장에 의해 관리되는 조정 체계를 보여 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 근육의 본질을 정의하는 문장입니다. 근육은 단순히 움직이는 덩어리가 아니라, 정교하게 \u003cb class=\"key\">계획된 \u003c/b>\u003cb class=\"key\">긴장\u003c/b>을 통해 신체를 조절하는 \u003cb class=\"key\">조정 \u003c/b>\u003cb class=\"key\">체계\u003c/b>임을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문, and ~\u003c/span> : [동사원형(명령문)] ~, and [주어 + 동사] : \"손을 올리거나 떨어뜨려라, 그러면 ~\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">간접의문문\u003c/span> : [의문사(what)] + [주어(it)] + [동사(is)] : \"그것이 무엇인지\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사의 후치 수식\u003c/span> : [명사(system)] + [과거분사(managed)] : \"~에 의해 관리되는\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"Lift your hand or drop it, 손을 올리거나 그것을 떨어뜨려라. and muscle shows, 그러면 근육은 보여준다. what it is, 그것이 무엇인지를:. a system of coordination, 조정의 체계인. managed by orchestrated tension, 조화롭게 편성된 긴장에 의해 관리되는.. 이 문장 전체를 해석하면, 여러분의 손을 올리거나 떨어뜨리면, 근육은 그것이 무엇인지를 보여 주는데, 즉 조화롭게 편성된 긴장에 의해 관리되는 조정 체계를 보여 준다.","hl":"m"},{"n":25,"text":"근육이 단순히 힘만 쓰는 게 아니라, 정교한 계획에 따라 움직이는 시스템이라는 사실을 알려주는 문장이에요. 조화롭게 편성된 긴장이라는 표현이 핵심입니다.","hl":"mn"},{"n":26,"text":"첫 번째로 문장 맨 앞에 동사원형으로 시작하는 명령문 뒤에 and가 붙어서 그러면이라고 해석되는 명령문 and 구문이 쓰였어요. 두 번째는 show의 목적어 자리에 what it is라는 의문사 주어 동사 어순의 간접의문문이 왔습니다. 마지막으로 managed는 앞에 있는 명사를 꾸며주는 과거분사입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">팔과 다리가 회전함에 따라\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">As\u003c/span> arms and legs rotate\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관절 주위를,\u003c/span>\u003cspan class=\"en\">around joints,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근육들은 활성화되고 비활성화되며,\u003c/span>\u003cspan class=\"en\">muscles \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">activate \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">deactivate\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">수축하고 이완한다.\u003c/span>\u003cspan class=\"en\">contract and relax.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">팔과 다리가 관절들의 주위를 회전할 때, 근육들은 활성화되고 비활성화되며 즉, 수축하고 이완한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 관절을 중심으로 한 모든 신체 운동의 보편적인 원리를 설명합니다. 근육이 \u003cb class=\"key\">상반된 \u003c/b>\u003cb class=\"key\">작용\u003c/b>인 활성화와 비활성화를 반복하며 \u003cb class=\"key\">신체 \u003c/b>\u003cb class=\"key\">회전\u003c/b>을 만들어낸다는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">접속사 As\u003c/span> : As + [주어 + 동사] : \"~할 때, ~함에 따라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : [동사1] and [동사2] : \"활성화되고 비활성화되다\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"As arms and legs rotate, 팔과 다리가 회전함에 따라. around joints, 관절 주위를. muscles activate and deactivate, 근육들은 활성화되고 비활성화되며. contract and relax, 수축하고 이완한다.. 이 문장 전체를 해석하면, 팔과 다리가 관절들의 주위를 회전할 때, 근육들은 활성화되고 비활성화되며 즉, 수축하고 이완한다.","hl":"m"},{"n":28,"text":"우리 몸의 팔다리가 어떻게 움직이는지 일반적인 원리를 보여주는 문장이에요. 관절을 축으로 해서 근육이 켜지고 꺼지는 과정이 반복된다는 뜻이죠.","hl":"mn"},{"n":29,"text":"첫 번째로 문장 앞에 나온 접속사 As는 때나 함에 따라라는 의미로 상황을 설명해 줍니다. 그리고 activate와 deactivate처럼 반대되는 뜻의 동사들이 병렬 구조로 연결되어 근육의 상반된 움직임을 명확하게 표현하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">모든 신체 활동은\u003c/span>\u003cspan class=\"en\">All physical activity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 의미에서 역설적이다.\u003c/span>\u003cspan class=\"en\">is paradoxical, in this sense:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">즉, 움직임은 ~에 의존한다\u003c/span>\u003cspan class=\"en\">Movement depends on\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근육들이 하지 않는 일에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">what \u003c/span>\u003cspan class=\"tgt\">muscles \u003c/span>\u003cspan class=\"tgt\">don't \u003c/span>\u003cspan class=\"tgt\">do\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~에 의존하는 만큼이나\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">as \u003c/span>\u003cspan class=\"tgt\">much \u003c/span>\u003cspan class=\"tgt\">as\u003c/span> it depends on\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 하는 일에\u003c/span>\u003cspan class=\"en\">what they do.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이런 의미에서 모든 신체 활동은 역설적이다. 즉, 움직임은 근육들이 하는 일에 의존하는 만큼이나 근육들이 하지 ‘않는’ 일에 의존한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 움직임이 근육의 수축(하는 일)뿐만 아니라 이완(하지 않는 일)에도 똑같이 의존한다는 \u003cb class=\"key\">역설적\u003c/b> 특성을 설명합니다. 근육의 작동 원리가 단순히 힘을 쓰는 것에만 있지 않음을 강조하는 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">주제\u003c/b> 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관계대명사 what\u003c/span> : depend on [전치사] + what [관계대명사] + muscles [주어] + don't do [타동사] : \"근육들이 하지 않는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">원급 비교\u003c/span> : A + as much as + B : \"~만큼이나 많이\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"All physical activity, 모든 신체 활동은. is paradoxical, in this sense, 이런 의미에서 역설적이다.. Movement depends on, 즉, 움직임은 ~에 의존한다. what muscles don't do, 근육들이 하지 않는 일에. as much as it depends on, ~에 의존하는 만큼이나. what they do, 그것들이 하는 일에. 이 문장 전체를 해석하면, 이런 의미에서 모든 신체 활동은 역설적이다. 즉, 움직임은 근육들이 하는 일에 의존하는 만큼이나 근육들이 하지 ‘않는’ 일에 의존한다.","hl":"m"},{"n":31,"text":"신체 활동이 왜 역설적일까요? 근육이 힘을 주는 수축도 중요하지만, 반대로 힘을 빼는 이완도 움직임에 똑같이 기여하기 때문입니다. 그래서 이 문장은 근육의 상호 보완적 작용이라는 역설적 특성을 주제로 던지고 있어요.","hl":"mn"},{"n":32,"text":"첫 번째 포인트는 what muscles don't do입니다. 여기서 what은 선행사를 포함한 관계대명사로, 전치사 on의 목적어 역할을 하는 명사절을 이끌고 있어요. 두 번째는 as much as를 활용한 원급 비교입니다. 근육이 하는 일과 하지 않는 일의 중요성이 똑같다는 것을 강조하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">둘 다 필수적이며,\u003c/span>\u003cspan class=\"en\">Both are necessary,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">각각의 때에\u003c/span>\u003cspan class=\"en\">each in its time\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">― ~에도 마찬가지이다\u003c/span>\u003cspan class=\"en\">― and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">same \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">true \u003c/span>\u003cspan class=\"tgt\">of\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">쌍을 이루는 개념들의 각각의 측면\u003c/span>\u003cspan class=\"en\">each side of the pairs of concepts\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 근육에 대해 말하는 방식을 형성하는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">shaping\u003c/span> how we talk of muscles.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">각각의 때에 둘 다 필수적이며, 우리가 근육들에 대해 말하는 방향을 형성하는 쌍을 이루는 개념들의 각각에도 마찬가지이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 수축과 이완이라는 물리적 작용을 넘어, 우리가 근육을 논할 때 사용하는 \u003cb class=\"key\">이분법적 \u003c/b>\u003cb class=\"key\">개념\u003c/b>들에도 같은 원리가 적용됨을 보여줍니다. 즉, 반대되는 개념들이 서로 \u003cb class=\"key\">공존\u003c/b>해야 함을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현\u003c/span> : the same + is true + of + 명사(구) : \"~에도 마찬가지이다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사\u003c/span> : concepts [명사] + shaping [현재분사구] : \"형성하는\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Both are necessary, 둘 다 필수적이며. each in its time, 각각의 때에. ― and the same is true of, ― ~에도 마찬가지이다. each side of the pairs of concepts, 쌍을 이루는 개념들의 각각의 측면. shaping how we talk of muscles, 우리가 근육에 대해 말하는 방식을 형성하는. 이 문장 전체를 해석하면, 각각의 때에 둘 다 필수적이며, 우리가 근육들에 대해 말하는 방향을 형성하는 쌍을 이루는 개념들의 각각에도 마찬가지이다.","hl":"m"},{"n":34,"text":"앞서 말한 수축과 이완처럼, 근육을 설명하는 여러 쌍의 개념들도 어느 한쪽만 중요한 게 아니라 상황에 따라 둘 다 필요하다는 뜻입니다. 이제부터 구체적인 개념들의 쌍을 예로 들겠다는 신호이기도 해요.","hl":"mn"},{"n":35,"text":"첫 번째로 the same is true of라는 표현을 보세요. 앞에 나온 역설의 논리가 뒤에 나올 개념들의 쌍에도 똑같이 적용된다는 뜻입니다. 두 번째로 shaping은 현재분사로 쓰여서 앞에 있는 concepts를 수식하고 있어요. 개념들이 우리가 말하는 방식을 형성하고 있다는 능동의 의미를 담고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유전 대 환경으로 시작해 보라.\u003c/span>\u003cspan class=\"en\">Start with \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">nature \u003c/span>\u003cspan class=\"tgt\">versus \u003c/span>\u003cspan class=\"tgt\">nurture\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떤 사람들은 더 강하다\u003c/span>\u003cspan class=\"en\">Some people are stronger\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또는 다른 사람들보다 더 근육이 많다\u003c/span>\u003cspan class=\"en\">or more muscular than others;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 차이는 타고난 것인가,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">difference \u003c/span>\u003cspan class=\"tgt\">inborn, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니면 그것은 ~에 달려 있는가?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">does \u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">depend \u003c/span>\u003cspan class=\"tgt\">on\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 하는 행동에\u003c/span>\u003cspan class=\"en\">what people do?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유전 대 환경으로 시작해 보라. 어떤 사람들은 다른 사람들보다 더 강하거나 더 근육이 많다. 그 차이는 타고난 것인가, 아니면 사람들이 하는 행동에 달려 있는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 근육의 차이가 유전적인지 혹은 노력의 결과인지를 묻는 \u003cb class=\"key\">이분법적 \u003c/b>\u003cb class=\"key\">질문\u003c/b>을 던집니다. 이 질문은 나중에 이 두 요소가 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">보완적\u003c/b>이라는 결론으로 이어집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대조 표현\u003c/span> : A versus B : \"유전 대 환경\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">의문문의 병렬 구조\u003c/span> : is [be동사] + 주어 + 보어, or does [조동사] + 주어 + 동사원형 : \"그 차이는 타고난 것인가, 아니면 ~에 달려 있는가?\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Start with nature versus nurture, 유전 대 환경으로 시작해 보라.. Some people are stronger, 어떤 사람들은 더 강하다. or more muscular than others, 또는 다른 사람들보다 더 근육이 많다. is the difference inborn, 그 차이는 타고난 것인가. or does it depend on, 아니면 그것은 ~에 달려 있는가?. what people do?, 사람들이 하는 행동에. 이 문장 전체를 해석하면, 유전 대 환경으로 시작해 보라. 어떤 사람들은 다른 사람들보다 더 강하거나 더 근육이 많다. 그 차이는 타고난 것인가, 아니면 사람들이 하는 행동에 달려 있는가?","hl":"m"},{"n":37,"text":"근육의 발달이 부모님께 물려받은 유전 덕분인지, 아니면 후천적인 노력 덕분인지 묻고 있습니다. 우리가 흔히 생각하는 유전과 환경이라는 대립하는 두 개념을 통해 이야기를 풀어나가고 있어요.","hl":"mn"},{"n":38,"text":"첫 번째 포인트인 nature versus nurture는 유전과 환경이라는 고전적인 대립 구도를 보여줍니다. 두 번째로 의문문 두 개가 or로 연결된 병렬 구조를 확인하세요. 차이가 타고난 것인지, 아니면 행동에 달린 것인지 두 가지 가능성을 대등하게 질문하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">후자의 질문에 대해 말하자면: \u003c/span>\u003cspan class=\"en\">To \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">latter\u003c/span> question:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 무엇을 ‘하는가’?\u003c/span>\u003cspan class=\"en\">What do you do?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">후자의 질문에 대해 말하자면, 여러분은 무엇을 ‘하는가’?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞서 언급된 유전과 환경 중 \u003cb class=\"key\">후자\u003c/b>인 후천적 노력에 초점을 맞추어, 우리가 실제로 근육을 위해 어떤 \u003cb class=\"key\">행동\u003c/b>을 취하는지 질문을 던집니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전자와 후자\u003c/span> : the former (전자) vs the latter (후자) : \"후자(의)\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"To the latter question, 후자의 질문에 대해 말하자면:. What do you do?, 여러분은 무엇을 ‘하는가’?. 이 문장 전체를 해석하면, 후자의 질문에 대해 말하자면, 여러분은 무엇을 ‘하는가’?","hl":"m"},{"n":40,"text":"이 문장은 앞서 나온 유전과 환경이라는 두 가지 선택지 중에서 환경이나 노력에 해당하는 후자의 질문을 구체화하는 문장이에요. 우리가 근육을 위해 어떤 노력을 하는지에 대해 본격적으로 논의를 시작하는 도입부 역할을 합니다.","hl":"mn"},{"n":41,"text":"첫 번째 어법 포인트는 the latter예요. 앞에서 언급된 두 가지 중 뒤쪽을 가리킬 때 쓰는 표현으로, 여기서는 타고난 것이 아닌 우리가 무엇을 하는지에 대한 질문을 후자로 지칭하고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 11 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중량 운동을 해야 하는가, \u003c/span>\u003cspan class=\"en\">Do you have to lift weights,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니면 걷기가 \u003c/span>\u003cspan class=\"en\">or is walking\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">충분한 운동인가?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">enough \u003c/span>\u003cspan class=\"tgt\">exercise\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">중량 운동을 해야 하는가, 아니면 걷기가 충분한 운동인가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 근육 발달을 위한 행동의 \u003cb class=\"key\">강도\u003c/b>를 두고, 고강도인 \u003cb class=\"key\">중량 \u003c/b>\u003cb class=\"key\">운동\u003c/b>과 저강도인 \u003cb class=\"key\">걷기\u003c/b>를 대조하여 질문하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사 enough의 위치\u003c/span> : enough [형용사] + 명사 : \"충분한 운동\"\u003c/div>\u003c/div>","segs":[{"n":42,"text":"Do you have to lift weights, 중량 운동을 해야 하는가. or is walking, 아니면 걷기가. enough exercise?, 충분한 운동인가?. 이 문장 전체를 해석하면, 중량 운동을 해야 하는가, 아니면 걷기가 충분한 운동인가?","hl":"m"},{"n":43,"text":"이 문장은 근육 성장을 위해 필요한 운동의 강도에 대해 묻고 있어요. 무거운 것을 드는 힘든 운동이 꼭 필요한지, 아니면 가벼운 걷기만으로도 충분한지에 대한 이분법적인 의문을 제시합니다.","hl":"mn"},{"n":44,"text":"여기서 주의할 점은 enough exercise의 어순이에요. enough가 형용사로 쓰여서 명사인 exercise를 꾸며줄 때는 반드시 명사 앞에 위치해야 한다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 12 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떻게 해야 하는가 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">How \u003c/span>\u003cspan class=\"tgt\">should \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 운동을?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">do\u003c/span> the exercise?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그 운동을 어떻게 해야 하는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 운동의 종류를 넘어, 운동을 수행하는 \u003cb class=\"key\">방법론\u003c/b>과 구체적인 \u003cb class=\"key\">방식\u003c/b>에 대해 의문을 제기하며 논의를 심화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문사 How 의문문\u003c/span> : How + 조동사(should) + 주어 + 동사원형 : \"어떻게 해야 하는가\"\u003c/div>\u003c/div>","segs":[{"n":45,"text":"How should you, 어떻게 해야 하는가. do the exercise?, 그 운동을?. 이 문장 전체를 해석하면, 그 운동을 어떻게 해야 하는가?","hl":"m"},{"n":46,"text":"앞선 문장에서 운동의 종류를 물었다면, 이번에는 그 운동을 수행하는 구체적인 방법에 대해 질문하고 있어요. 이후에 나올 속도나 무게 설정에 대한 논의로 자연스럽게 이어주는 징검다리 문장입니다.","hl":"mn"},{"n":47,"text":"방법을 묻는 의문사 How로 시작하는 의문문이에요. 조동사 should가 주어인 you 앞으로 위치해서 무엇이 올바른 방법인지 묻는 구조를 만들고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 13 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 움직여야 하는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Should \u003c/span>\u003cspan class=\"tgt\">you \u003c/span>\u003cspan class=\"tgt\">move\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">빠르게, 아니면 천천히?\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">fast \u003c/span>\u003cspan class=\"tgt\">or \u003c/span>\u003cspan class=\"tgt\">slowly\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">빠르게, 아니면 천천히 움직여야 하는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 운동을 수행하는 방식에 있어서 \u003cb class=\"key\">속도\u003c/b>라는 측면의 선택지를 제시하는 문장입니다. 앞선 질문들과 이어져 운동의 \u003cb class=\"key\">방법론\u003c/b>에 대한 의문을 구체화합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">의문문의 어순\u003c/span> : Should [조동사] + you [주어] + move [동사원형] : \"여러분은 움직여야 하는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부사의 병렬 구조\u003c/span> : fast [부사] + or [접속사] + slowly [부사] : \"빠르게 혹은 천천히\"\u003c/div>\u003c/div>","segs":[{"n":48,"text":"Should you move, 여러분은 움직여야 하는가. fast or slowly?, 빠르게, 아니면 천천히?. 이 문장 전체를 해석하면, 빠르게, 아니면 천천히 움직여야 하는가?","hl":"m"},{"n":49,"text":"이 문장은 운동을 할 때 속도를 어떻게 조절해야 하는지에 대한 질문을 던지고 있어요. 앞서 나온 운동의 종류에 이어 운동의 구체적인 방법론을 고민하게 만드는 단계죠.","hl":"mn"},{"n":50,"text":"첫 번째 포인트로 Should you move 부분은 조동사 Should를 주어 앞으로 보내서 의문문 순서를 만들고 뒤에 동사원형을 쓴 형태예요. 두 번째로 fast or slowly는 move라는 동사를 꾸며주는 두 부사가 병렬 구조를 이루고 있다는 점에 주목하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 14 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">무거운 무게를 들어야 하는가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Lift\u003c/span> heavy weights\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아니면 더 가벼운 것들을?\u003c/span>\u003cspan class=\"en\">or lighter \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ones\u003c/span>?\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">무거운 것, 아니면 더 가벼운 것을 들어야 하는가?\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 운동의 \u003cb class=\"key\">강도\u003c/b>와 관련된 선택지를 제시하며, 이전 문장과 마찬가지로 \u003cb class=\"key\">이분법적\u003c/b>인 질문 형태를 띠고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">생략 구문\u003c/span> : (Should you) + Lift [동사원형] : \"들어야 하는가\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정대명사\u003c/span> : ones [부정대명사/복수] : \"것들\"\u003c/div>\u003c/div>","segs":[{"n":51,"text":"Lift heavy weights, 무거운 무게를 들어야 하는가. or lighter ones?, 아니면 더 가벼운 것들을?. 이 문장 전체를 해석하면, 무거운 것, 아니면 더 가벼운 것을 들어야 하는가?","hl":"m"},{"n":52,"text":"이번에는 운동의 강도 즉, 무게 설정에 대한 질문이에요. 무거운 것이냐 가벼운 것이냐 하는 이분법적인 선택 상황을 보여주고 있습니다.","hl":"mn"},{"n":53,"text":"첫 번째로 문장 맨 앞의 Lift는 앞 문장에 나온 Should you가 반복이라서 생략된 형태라는 걸 알아야 해요. 두 번째로 문장 끝의 ones는 앞에 나온 weights라는 명사를 대신 받아주는 부정대명사예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 15 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그렇게 본다면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Put \u003c/span>\u003cspan class=\"tgt\">like \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근육에 대한 기본적인 질문들이\u003c/span>\u003cspan class=\"en\">basic questions about muscle\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~처럼 들릴지도 모른다\u003c/span>\u003cspan class=\"en\">may \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">sound \u003c/span>\u003cspan class=\"tgt\">like\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들이 단 하나의 정답을 가진 것\u003c/span>\u003cspan class=\"en\">they have one right answer.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그렇게 본다면, 근육에 대한 기본적인 질문들이 단 하나의 정답을 가진 것처럼 들릴지도 모른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 질문을 단순한 대조군으로 제시했을 때 생기는 \u003cb class=\"key\">오해\u003c/b>를 언급합니다. 세상사가 그렇듯 근육 문제도 단순한 \u003cb class=\"key\">단일 \u003c/b>\u003cb class=\"key\">정답\u003c/b>이 있는 것처럼 보일 수 있다는 통념을 제시하며 \u003cb class=\"key\">반전\u003c/b>을 준비하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구(분사구문)\u003c/span> : Put [과거분사] + like that : \"그렇게 놓여진다면(그렇게 본다면)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">감각동사의 표현\u003c/span> : sound [감각동사] + like [전치사/접속사] + clause [절] : \"~처럼 들리다\"\u003c/div>\u003c/div>","segs":[{"n":54,"text":"Put like that, 그렇게 본다면. basic questions about muscle, 근육에 대한 기본적인 질문들이. may sound like, ~처럼 들릴지도 모른다. they have one right answer, 그것들이 단 하나의 정답을 가진 것. 이 문장 전체를 해석하면, 그렇게 본다면, 근육에 대한 기본적인 질문들이 단 하나의 정답을 가진 것처럼 들릴지도 모른다.","hl":"m"},{"n":55,"text":"앞에서 던진 질문들처럼 이분법적으로 상황을 놓고 보면, 마치 정답이 딱 하나만 정해져 있는 것처럼 착각하기 쉽다는 뜻이에요. 이제부터 이 통념을 뒤집는 이야기가 나올 거라는 신호이기도 하죠.","hl":"mn"},{"n":56,"text":"첫 번째 어법인 Put like that은 질문들이 그렇게 표현되는 수동의 상황이라 과거분사로 시작하는 분사구문이에요. 두 번째로 sound like 뒤에는 문장이 나와서, 전체가 하나의 거대한 정답이 있는 것처럼 들린다는 의미를 완성합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 16 / 19\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반대 개념 들은\u003c/span>\u003cspan class=\"en\">Oppositions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">양극화될 수 있다.\u003c/span>\u003cspan class=\"en\">can \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">polarize\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반대 개념 들은 양극화될 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 근육을 설명할 때 사용되는 대조적인 용어들이 마치 서로 \u003cb class=\"key\">완전히 \u003c/b>\u003cb class=\"key\">분리\u003c/b>된 두 극단처럼 인식될 수 있음을 시사합니다. 사람들이 대상을 이해할 때 흔히 빠지기 쉬운 \u003cb class=\"key\">이분법적 \u003c/b>\u003cb class=\"key\">사고\u003c/b>를 언급하며 뒤에 올 반박을 준비하는 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">자동사로서의 쓰임\u003c/span> : [주어] + polarize [자동사] : \"양극화되다\"\u003c/div>\u003c/div>","segs":[{"n":57,"text":"Oppositions, 반대 개념 들은. can polarize, 양극화될 수 있다.. 이 문장 전체를 해석하면, 반대 개념 들은 양극화될 수 있다.","hl":"m"},{"n":58,"text":"우리가 근육의 움직임을 설명할 때 쓰는 여러 반대 개념들이 있죠? 그런 개념들이 마치 서로 전혀 상관없는 양극단처럼 보일 수 있다는 점을 언급하고 있어요. 즉 이분법적으로 생각하기 쉽다는 뜻이죠.","hl":"mn"},{"n":59,"text":"여기서 polarize라는 단어는 자동사로 쓰였어요. 주어인 Oppositions가 스스로 극과 극으로 나뉘는 상태가 된다는 의미를 깔끔하게 전달하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 17 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">하지만\u003c/span>\u003cspan class=\"en\">But\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">근육에 관해서는,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">where \u003c/span>\u003cspan class=\"tgt\">muscle \u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">concerned\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진정으로 양극성인 반대 개념들은 거의 ~하지 않다,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">few\u003c/span> oppositions are\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">진정으로 양극성인 것이다.\u003c/span>\u003cspan class=\"en\">true polarities.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">하지만 근육에 관해서는, 진정으로 양극성인 반대 개념들은 거의 없다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 글의 핵심적인 반전이 일어나는 문장으로, 근육의 작용에 있어 반대되는 개념들은 서로 \u003cb class=\"key\">배타적이지 \u003c/b>\u003cb class=\"key\">않음\u003c/b>을 강조합니다. 즉, 이두근과 삼두근처럼 반대되는 것들이 사실은 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">보완적\u003c/b>인 관계라는 필자의 주장을 담고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">관용 표현(where ~ is concerned)\u003c/span> : where + [명사] + is concerned : \"근육에 관해서는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정 형용사\u003c/span> : few + [복수명사] + [긍정동사] : \"거의 없는\"\u003c/div>\u003c/div>","segs":[{"n":60,"text":"But, 하지만. where muscle is concerned, 근육에 관해서는. few oppositions are, 진정으로 양극성인 반대 개념들은 거의 ~하지 않다. true polarities, 진정으로 양극성인 것이다.. 이 문장 전체를 해석하면, 하지만 근육에 관해서는, 진정으로 양극성인 반대 개념들은 거의 없다.","hl":"m"},{"n":61,"text":"앞에서 말한 이분법적 생각이 근육에는 통하지 않는다는 필자의 핵심 주장이에요. 근육의 반대되는 성질들은 서로 완전히 갈라진 양극단이 아니라는 점을 분명히 하고 있습니다.","hl":"mn"},{"n":62,"text":"두 가지 포인트를 볼게요. 첫 번째로 where muscle is concerned는 무엇무엇에 관해서는 이라는 뜻의 유용한 관용구예요. 두 번째로 few는 부정어라는 게 핵심이에요. 동사가 긍정문처럼 보여도 해석은 거의 없다라고 부정으로 해야 문맥이 정확해집니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 18 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자세히 보면,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Look \u003c/span>\u003cspan class=\"tgt\">closely, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러면\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">대부분이 ~인 것으로 판명된다,\u003c/span>\u003cspan class=\"en\">most \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">prove \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역설인 것으로.\u003c/span>\u003cspan class=\"en\">paradoxes.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자세히 보면, 대부분이 역설인 것으로 판명된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 근육의 운동을 깊이 관찰하면, 서로 반대되는 요소들이 \u003cb class=\"key\">동시에 \u003c/b>\u003cb class=\"key\">작용\u003c/b>하거나 서로를 필요로 하는 \u003cb class=\"key\">역설적 \u003c/b>\u003cb class=\"key\">성격\u003c/b>을 띠고 있음을 밝힙니다. 단순한 대립을 넘어선 \u003cb class=\"key\">상호의존적 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 paradox라는 단어로 집약했습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문 + and\u003c/span> : 명령문, + and + [주어] + [동사] : \"자세히 보아라, 그러면\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">판명 동사 구문\u003c/span> : prove + [to be + 명사/형용사] : \"~임이 판명되다\"\u003c/div>\u003c/div>","segs":[{"n":63,"text":"Look closely, 자세히 보면. and, 그러면. most prove to be, 대부분이 ~인 것으로 판명된다. paradoxes, 역설인 것으로.. 이 문장 전체를 해석하면, 자세히 보면, 대부분이 역설인 것으로 판명된다.","hl":"m"},{"n":64,"text":"근육을 대충 보지 말고 세심하게 관찰하라는 뜻이에요. 그렇게 하면 겉으론 반대 같아 보였던 것들이 사실은 서로 긴밀하게 연결된 역설적인 관계라는 게 드러난다는 거죠.","hl":"mn"},{"n":65,"text":"여기서도 두 가지를 기억하세요. 첫 번째로 명령문 다음에 나온 and는 그리고가 아니라 그러면 이라고 해석하는 게 논리적입니다. 두 번째로 prove to be는 결과적으로 무엇무엇임이 밝혀지다라는 뜻으로 사실을 확인해 주는 표현입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 19 / 19\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">타고난 것과 만들어진 것, 무거운 것과 가벼운 것, 빠른 것과 느린 것:\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Born \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">made\u003c/span>, heavy and light, fast and slow:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 반대 개념들은 실제로\u003c/span>\u003cspan class=\"en\">Those opposites actually\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서로를 필요로 한다.\u003c/span>\u003cspan class=\"en\">require \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">each \u003c/span>\u003cspan class=\"tgt\">other\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">타고난 것과 만들어진 것, 무거운 것과 가벼운 것, 빠른 것과 느린 것, 즉, 그러한 반대 개념들은 실제로 서로를 필요로 한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 글 전체의 주제를 갈무리하며, 겉보기에 상반된 가치들이 사실은 긴밀히 연결된 \u003cb class=\"key\">역설적 \u003c/b>\u003cb class=\"key\">상호보완성\u003c/b>을 가짐을 설명합니다. 근육의 수축과 이완처럼 모든 대립항은 분리될 수 없이 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">의존적\u003c/b>임을 강조하며 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 병렬 구조 및 명사적 활용\u003c/span> : [Past Participle] + [and] + [Past Participle] : \"타고난 것과 만들어진 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">상호 대명사\u003c/span> : [subject] + [verb] + [each other] : \"서로를\"\u003c/div>\u003c/div>","segs":[{"n":66,"text":"Born and made, heavy and light, fast and slow, 타고난 것과 만들어진 것, 무거운 것과 가벼운 것, 빠른 것과 느린 것:. Those opposites actually, 그러한 반대 개념들은 실제로. require each other, 서로를 필요로 한다.. 이 문장 전체를 해석하면, 타고난 것과 만들어진 것, 무거운 것과 가벼운 것, 빠른 것과 느린 것, 즉, 그러한 반대 개념들은 실제로 서로를 필요로 한다.","hl":"m"},{"n":67,"text":"이 문장은 글 전체의 결론을 담고 있어요. 우리가 흔히 완전히 다르다고 생각하는 개념들이 사실은 역설적 상호보완성을 띠고 있다는 거죠. 근육의 발달과 움직임에서 이 대립하는 요소들은 따로 노는 게 아니라 상호 의존적인 관계라는 걸 아주 강하게 보여주고 있네요.","hl":"mn"},{"n":68,"text":"첫 번째로 Born and made 부분을 보세요. 과거분사들이 짝을 지어 나열되면서 근육의 성격을 설명하는 대조적 개념들을 명사처럼 활용한 표현이에요. 두 번째로 문장 끝의 each other는 상호 대명사라고 불러요. 반대되는 두 개념이 각자 따로 존재하는 게 아니라 서로에게 꼭 필요한 짝꿍 같은 관계임을 강조하는 핵심적인 표현입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>근육은 이두근과 삼두근처럼 대립하는 쌍이 \u003cb class=\"key\">수축하고 \u003c/b>\u003cb class=\"key\">이완\u003c/b>하며 신체 움직임을 조절합니다.\u003c/li>\u003cli>모든 신체 활동은 근육이 하는 일과 하지 않는 일이 균형을 이루는 \u003cb class=\"key\">역설적 \u003c/b>\u003cb class=\"key\">체계\u003c/b>에 기반합니다.\u003c/li>\u003cli>유전과 환경, 운동 강도 등 운동과 관련된 질문들은 종종 \u003cb class=\"key\">이분법적인 \u003c/b>\u003cb class=\"key\">정답\u003c/b>이 있는 것처럼 보입니다.\u003c/li>\u003cli>하지만 근육에 관한 대립 개념들은 실제로는 서로를 보완하며 \u003cb class=\"key\">상호 \u003c/b>\u003cb class=\"key\">의존\u003c/b>하는 역설적 관계입니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Muscle movement and related physical concepts are defined by the interdependence of opposing forces and paradoxical coordination.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">근육은 수축과 이완이라는 \u003cb class=\"key\">대립하는 \u003c/b>\u003cb class=\"key\">작용\u003c/b>의 조화를 통해 움직임을 만들어내며, 신체 활동과 관련된 이분법적 개념들은 실제로는 서로를 필요로 하는 \u003cb class=\"key\">역설적 \u003c/b>\u003cb class=\"key\">관계\u003c/b>에 있다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":69,"text":"오늘 수업 어떠셨나요? 우리 근육이 수축과 이완을 반복하며 조화를 이루듯, 공부도 집중과 휴식의 역설적 조화가 필요합니다. 대립하는 것들이 서로를 필요로 한다는 이 글의 결론을 꼭 기억하세요. 오늘도 수고 많았습니다!","hl":null}]}]});</script></body></html>
