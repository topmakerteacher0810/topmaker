<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 18번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}
.lp{--pk:#0E8A8C;--pk-t:#0A5F61;--pk-l:#DDF2F1;--pk-ll:#F3FAFA;--bl-l:#E9EEFB;--bl-t:#3A4FA3;height:100%;min-height:540px;background:#fff;color:#1B2733;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;font-family:"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.08);outline:none}

.lp .tgt{background:#FFF0C7;border-bottom:2.5px solid var(--pk);padding:0}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gi{margin:3px 0}
.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 18번","audioDir":"18_audio","preview":false,"count":32,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">18번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>Request for a Specific Delivery Date Following a Delay\u003c/h1>\u003ch2>배송 지연에 따른 명확한 배송 날짜 요청\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>구매한 책장의 배송이 약속된 \u003cb class=\"key\">4주\u003c/b>를 넘겨 지연되자, 고객이 \u003cb class=\"key\">불편함\u003c/b>을 호소하며 구체적인 \u003cb class=\"key\">배송 \u003c/b>\u003cb class=\"key\">날짜\u003c/b> 확답과 신속한 처리를 요구하는 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The writer is requesting a definitive delivery date because the promised furniture delivery has been delayed, causing inconvenience.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 2025년 10월 고2 모의고사 열여덟 번째 지문을 함께 공부해보겠습니다. 이 글은 배송 지연에 대해 항의하고 해결책을 요구하는 전형적인 실용문이에요. 가구 배송이 늦어져서 겪고 있는 불편함과 이에 대한 구체적인 요청 사항을 담고 있습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">가구 매장과 고객 간의 \u003cb class=\"key\">매매 \u003c/b>\u003cb class=\"key\">계약\u003c/b>에서 배송(delivery)은 서비스의 핵심적인 부분입니다. 고객은 약속된 날짜를 기준으로 본인의 \u003cb class=\"key\">일정(schedule)\u003c/b>을 관리하는데, 이를 어기면 신뢰 문제가 발생하죠. 보통 이런 서신을 \u003cb class=\"key\">불만 \u003c/b>\u003cb class=\"key\">제기 \u003c/b>\u003cb class=\"key\">서신(complaint \u003c/b>\u003cb class=\"key\">letter)\u003c/b>이라고 부르며, 육하원칙에 따라 상황을 설명하고 해결책을 요구하는 것이 일반적입니다. 마치 택배가 오기로 한 날 오지 않아 하루 종일 집에서 기다린 \u003cb class=\"key\">허탈한 \u003c/b>\u003cb class=\"key\">마음\u003c/b>과 비슷하다고 볼 수 있습니다. 여기서는 명확한 \u003cb class=\"key\">납기일(deadline)\u003c/b> 준수의 중요성을 강조하고 있습니다.\u003c/div>","segs":[{"n":2,"text":"우리가 가전이나 가구를 사면 보통 배송 날짜를 정하게 되죠. 이걸 영어로는 delivery date라고 합니다. 고객은 이 날짜에 맞춰서 다른 일정을 조정하기 때문에, 약속된 날짜를 어기면 상당한 불편함, 즉 considerable inconvenience를 겪게 됩니다. 오늘 지문은 이런 상황에서 고객 서비스팀에 보내는 정중하지만 단호한 요청서라고 보시면 됩니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>구매 사실과 배송 약속\u003csmall>도입 · 문장 1–3\u003c/small>\u003c/h4>\u003cp>아내와 함께 새집에 어울리는 \u003cb class=\"key\">책장 \u003c/b>\u003cb class=\"key\">세트\u003c/b>를 구매했으며, 매니저로부터 \u003cb class=\"key\">4주 \u003c/b>\u003cb class=\"key\">이내\u003c/b> 배송을 약속받았음을 상기시킵니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>약속 위반과 불편함\u003csmall>문제 · 문장 4–5\u003c/small>\u003c/h4>\u003cp>배송을 받기 위해 계획을 세웠으나 지켜지지 않았고, 이로 인해 \u003cb class=\"key\">상당한 \u003c/b>\u003cb class=\"key\">불편함\u003c/b>이 발생했음을 \u003cb class=\"key\">불만\u003c/b>으로 제기합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>명확한 정보 및 처리 요구\u003csmall>주장 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>명확하고 구체적인 \u003cb class=\"key\">배송 \u003c/b>\u003cb class=\"key\">날짜\u003c/b>를 알려줄 것과, 일정을 재조정할 수 있도록 이 문제를 \u003cb class=\"key\">신속히 \u003c/b>\u003cb class=\"key\">처리\u003c/b>해 줄 것을 요구합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"글의 흐름은 구매 약속에서 시작해 문제 발생, 그리고 마지막 해결 요구로 이어지는 삼단계 구조입니다.","hl":null},{"n":4,"text":"첫 번째부터 세 번째 문장까지는 배경 설명입니다. 아내와 함께 가구점에서 새집에 딱 맞는 bookshelves를 샀고, 매니저가 4주 안에 배송해 주기로 약속했다는 점을 언급하며 시작하고 있어요.","hl":"f0"},{"n":5,"text":"네 번째와 다섯 번째 문장에서는 본격적인 문제가 나옵니다. 배송을 받으려고 시간까지 비워뒀는데 however, 아무도 오지 않았죠. 이 delay 때문에 아주 큰 불편을 겪고 있다는 점을 강조하고 있습니다.","hl":"f1"},{"n":6,"text":"마지막 여섯 번째와 일곱 번째 문장이 이 글의 핵심입니다. 그래서 Therefore, 정확히 언제 배송해 줄 건지 구체적인 날짜를 달라는 것이죠. 신속하게 해결해 달라는 promptly라는 단어가 핵심 요구 사항을 잘 보여줍니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">문제-해결\u003c/span>\u003cspan class=\"lp-pill\">미괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 6번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">글의 앞부분에서는 배송 약속이 지켜지지 않은 \u003cb class=\"key\">문제 \u003c/b>\u003cb class=\"key\">상황\u003c/b>을 상세히 설명하고 있습니다. 이후 이 문제로 인한 불편함을 언급하며, 독자(고객 서비스팀)에게 \u003cb class=\"key\">해결책\u003c/b>으로 구체적인 날짜를 요구하는 구조입니다. 가장 중요한 요구 사항이 \u003cb class=\"key\">글의 \u003c/b>\u003cb class=\"key\">후반부\u003c/b>에 집중되어 있어 독자의 행동을 촉구합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>however (4)\u003c/b>\u003cspan>대조 및 문제 발생 지점\u003c/span>\u003cb>Therefore (6)\u003c/b>\u003cspan>인과 및 최종 요구 사항\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">purchased a set of bookshelves\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">take four weeks for delivery\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">no one came\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">this delay\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">specific delivery date\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":7,"text":"이 글의 전개 방식은 전형적인 문제와 해결 구조입니다. 처음에는 지연이라는 문제를 제시하고, 뒤에서는 배송 날짜 확정이라는 해결책을 요구하고 있어요. 주제문이 뒤쪽에 위치한 미괄식 구성이라고 볼 수 있습니다.","hl":"ty"},{"n":8,"text":"신호어를 잘 보세요. 네 번째 문장의 however는 기대와 다른 상황이 발생했음을 알려주는 전환점입니다. 여섯 번째 문장의 Therefore는 앞의 문제들을 바탕으로 글쓴이가 진짜 하고 싶은 말을 이끌어내는 인과 응보의 신호어죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>customer service team\u003c/b>\u003cem>명사\u003c/em>\u003cspan>고객 서비스팀\u003c/span>\u003c/div>\u003cdiv>\u003cb>purchased\u003c/b>\u003cem>동사\u003c/em>\u003cspan>구매했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>a set of\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>한 세트의\u003c/span>\u003c/div>\u003cdiv>\u003cb>bookshelves\u003c/b>\u003cem>명사\u003c/em>\u003cspan>책장\u003c/span>\u003c/div>\u003cdiv>\u003cb>truly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>진심으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>excited\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>들뜬, 신이 난\u003c/span>\u003c/div>\u003cdiv>\u003cb>furniture\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가구\u003c/span>\u003c/div>\u003cdiv>\u003cb>perfectly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>완벽하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>matched\u003c/b>\u003cem>동사\u003c/em>\u003cspan>어울렸다\u003c/span>\u003c/div>\u003cdiv>\u003cb>take\u003c/b>\u003cem>동사\u003c/em>\u003cspan>(시간이) 걸리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>delivery\u003c/b>\u003cem>명사\u003c/em>\u003cspan>배송\u003c/span>\u003c/div>\u003cdiv>\u003cb>set plans\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>계획을 세우다\u003c/span>\u003c/div>\u003cdiv>\u003cb>ensure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확실히 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>available\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>시간이 되는, 이용 가능한\u003c/span>\u003c/div>\u003cdiv>\u003cb>receive\u003c/b>\u003cem>동사\u003c/em>\u003cspan>받다\u003c/span>\u003c/div>\u003cdiv>\u003cb>delay\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지연\u003c/span>\u003c/div>\u003cdiv>\u003cb>caused\u003c/b>\u003cem>동사\u003c/em>\u003cspan>초래했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>considerable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상당한\u003c/span>\u003c/div>\u003cdiv>\u003cb>inconvenience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불편함\u003c/span>\u003c/div>\u003cdiv>\u003cb>provide\u003c/b>\u003cem>동사\u003c/em>\u003cspan>제공하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>specific\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>구체적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>expect\u003c/b>\u003cem>동사\u003c/em>\u003cspan>기대하다, 요구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>addressed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>처리되다, 다루어지다\u003c/span>\u003c/div>\u003cdiv>\u003cb>promptly\u003c/b>\u003cem>부사\u003c/em>\u003cspan>신속하게\u003c/span>\u003c/div>\u003cdiv>\u003cb>reorganize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재조정하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>confusion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>혼란\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"가구라는 뜻의 furniture는 대표적인 불가산 명사라 항상 단수형으로 쓴다는 점 기억하세요. 그리고 delivery라는 단어는 배송이라는 뜻인데, 이 글 전체를 관통하는 핵심 소재입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">purchase\u003c/b>\u003cspan class=\"m\">구매하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">buy\u003c/span>\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">sell\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">considerable\u003c/b>\u003cspan class=\"m\">상당한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"s\">substantial\u003c/span>\u003cspan class=\"s\">ample\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slight\u003c/span>\u003cspan class=\"a\">insignificant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">promptly\u003c/b>\u003cspan class=\"m\">신속하게\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">immediately\u003c/span>\u003cspan class=\"s\">quickly\u003c/span>\u003cspan class=\"s\">swiftly\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slowly\u003c/span>\u003cspan class=\"a\">belatedly\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">specific\u003c/b>\u003cspan class=\"m\">구체적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">definite\u003c/span>\u003cspan class=\"s\">particular\u003c/span>\u003cspan class=\"s\">explicit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">vague\u003c/span>\u003cspan class=\"a\">general\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">ensure\u003c/b>\u003cspan class=\"m\">확실히 하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">guarantee\u003c/span>\u003cspan class=\"s\">assure\u003c/span>\u003cspan class=\"s\">confirm\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어도 챙겨볼까요? 상당한이라는 뜻의 considerable은 significant나 substantial로 바꿔 쓸 수 있습니다. 신속하게라는 뜻의 promptly는 immediately와 같은 의미로 시험에 자주 등장하니 꼭 외워두세요.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고객 서비스팀께\u003c/span>\u003cspan class=\"en\">To the Customer Service Team,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">약 한 달 전,\u003c/span>\u003cspan class=\"en\">About a month ago,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">제 아내와 저는\u003c/span>\u003cspan class=\"en\">my wife and I\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">책장 한 세트를 구입했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">purchased\u003c/span> a set of bookshelves\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">귀하의 매장에서\u003c/span>\u003cspan class=\"en\">from your store.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고객 서비스팀께 약 한 달 전, 제 아내와 저는 귀하의 매장에서 책장 한 세트를 구입했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 배송 지연에 대한 항의를 시작하기 위해 언제, 무엇을 샀는지 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">정보\u003c/b>를 밝히며 글을 시작하는 \u003cb class=\"key\">도입부\u003c/b>입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거시제\u003c/span> : 주어 + [동사-ed (과거형)] : \"구입했습니다\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"To the Customer Service Team, 고객 서비스팀께. About a month ago, 약 한 달 전. my wife and I, 제 아내와 저는. purchased a set of bookshelves, 책장 한 세트를 구입했습니다. from your store, 귀하의 매장에서. 이 문장 전체를 해석하면, 고객 서비스팀께 약 한 달 전, 제 아내와 저는 귀하의 매장에서 책장 한 세트를 구입했습니다.","hl":"m"},{"n":12,"text":"본격적인 용건을 말하기 전에 고객으로서 어떤 물건을 언제 샀는지 거래의 구체적 정보를 알려주는 도입부 문장이에요.","hl":"mn"},{"n":13,"text":"이 문장의 동사는 purchased예요. 약 한 달 전이라는 분명한 과거 시점이 문장 앞에 나왔기 때문에 현재완료가 아닌 과거시제를 써야 한다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저는 진심으로 들떴습니다\u003c/span>\u003cspan class=\"en\">I was truly excited\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가구를 찾게 되어서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">find\u003c/span> furniture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">완벽하게 어울리는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">perfectly \u003c/span>\u003cspan class=\"tgt\">matched\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희의 새집에\u003c/span>\u003cspan class=\"en\">our new home.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저는 저희의 새집에 완벽하게 어울리는 가구를 찾게 되어서 진심으로 들떴습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 구매 당시의 \u003cb class=\"key\">긍정적 \u003c/b>\u003cb class=\"key\">감정\u003c/b>을 언급하여, 이후에 겪게 되는 \u003cb class=\"key\">배송 \u003c/b>\u003cb class=\"key\">지연\u003c/b>으로 인한 실망감을 더욱 강조하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (원인)\u003c/span> : 감정 형용사(excited) + [to-v] : \"찾게 되어서\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : 선행사(furniture) + [that(주관대) + 동사] : \"완벽하게 어울리는\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"I was truly excited, 저는 진심으로 들떴습니다. to find furniture, 가구를 찾게 되어서. that perfectly matched, 완벽하게 어울리는. our new home, 저희의 새집에. 이 문장 전체를 해석하면, 저는 저희의 새집에 완벽하게 어울리는 가구를 찾게 되어서 진심으로 들떴습니다.","hl":"m"},{"n":15,"text":"새집 인테리어에 딱 맞는 가구를 찾았을 때의 기쁨을 표현하고 있어요. 이렇게 기대를 많이 했는데 배송이 안 왔으니 얼마나 속상했을지 보여주는 거죠.","hl":"mn"},{"n":16,"text":"첫 번째로 to find는 들뜬 감정의 이유를 설명하는 투부정사의 부사적 용법이에요. 두 번째로 that 이하는 가구를 꾸며주는 주격 관계대명사절로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희가 책장을 구입했을 때,\u003c/span>\u003cspan class=\"en\">When we bought the bookshelves,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">매니저가 말했습니다\u003c/span>\u003cspan class=\"en\">the manager said\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배송에 4주가 걸릴 것이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">it \u003c/span>\u003cspan class=\"tgt\">would \u003c/span>\u003cspan class=\"tgt\">take\u003c/span> four weeks for delivery\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">, \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 지난 주말이었습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">which\u003c/span> was last weekend.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저희가 책장을 구입했을 때, 매니저가 배송에 4주가 걸릴 것이라고 말했고 그것은 지난 주말이었습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 매장에서 약속한 \u003cb class=\"key\">배송 \u003c/b>\u003cb class=\"key\">기한\u003c/b>이 이미 지났음을 지적하며 항의의 \u003cb class=\"key\">정당성\u003c/b>을 입증하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that의 생략\u003c/span> : said + [(that) + S + V] : \"~할 것이라고 말했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : 선행사(four weeks) + [, which] : \"그리고 그것은 (~였다)\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"When we bought the bookshelves, 저희가 책장을 구입했을 때. the manager said, 매니저가 말했습니다. it would take four weeks for delivery, 배송에 4주가 걸릴 것이라고. which was last weekend, 그것은 지난 주말이었습니다. 이 문장 전체를 해석하면, 저희가 책장을 구입했을 때, 매니저가 배송에 4주가 걸릴 것이라고 말했고 그것은 지난 주말이었습니다.","hl":"m"},{"n":18,"text":"매니저가 약속했던 4주의 배송 기간이 바로 지난 주말까지였다는 사실을 짚어주며 배송 약속이 어겨졌음을 강조하고 있어요.","hl":"mn"},{"n":19,"text":"첫 번째로 said 뒤에는 접속사 that이 생략되어 문장이 이어지고 있어요. 두 번째로 콤마 뒤의 which는 계속적 용법의 관계대명사로, 앞에서 말한 4주라는 기간이 언제였는지를 덧붙여 설명합니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 저희의 계획을 세웠었습니다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">had \u003c/span>\u003cspan class=\"tgt\">set\u003c/span> our plans\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">누군가 배송을 받을 수 있도록 확실히 하기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">ensure\u003c/span> someone would be available\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배송을 받기 위해;\u003c/span>\u003cspan class=\"en\">to receive the delivery;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러나 아무도 오지 않았습니다\u003c/span>\u003cspan class=\"en\">however, no one came\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그날 책장을 가지고.\u003c/span>\u003cspan class=\"en\">with the bookshelves that day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저희는 누군가 배송을 받을 수 있도록 확실히 하기 위해 저희의 계획을 세웠었습니다. 그러나 그날 아무도 책장을 가지고 오지 않았습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 배송일에 맞춰 미리 \u003cb class=\"key\">일정을 \u003c/b>\u003cb class=\"key\">조정\u003c/b>해 두었음에도 불구하고 배송이 이루어지지 않아 발생한 상황을 설명합니다. 상대방의 잘못으로 인해 \u003cb class=\"key\">계획에 \u003c/b>\u003cb class=\"key\">차질\u003c/b>이 생겼음을 명확히 짚어주는 단계입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료(대과거)\u003c/span> : had + p.p. (과거분사) : \"세웠었습니다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + 동사원형 (ensure) : \"확실히 하기 위해\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"We had set our plans, 저희는 저희의 계획을 세웠었습니다. to ensure someone would be available, 누군가 배송을 받을 수 있도록 확실히 하기 위해. to receive the delivery, 배송을 받기 위해;. however, no one came, 그러나 아무도 오지 않았습니다. with the bookshelves that day, 그날 책장을 가지고.. 이 문장 전체를 해석하면, 저희는 누군가 배송을 받을 수 있도록 확실히 하기 위해 저희의 계획을 세웠었습니다. 그러나 그날 아무도 책장을 가지고 오지 않았습니다.","hl":"m"},{"n":21,"text":"배송을 받으려고 미리 일정을 다 비워두었다는 점을 강조하며 약속이 지켜지지 않은 것에 대해 강한 유감을 표현하고 있습니다. 단순히 기다린 것이 아니라 배송 수령을 위해 철저한 계획을 세웠음을 언급해서 뒤에 나올 불만 제기에 정당성을 부여하고 있죠.","hl":"mn"},{"n":22,"text":"첫 번째로 had set은 배송 실패라는 과거 사건보다 더 이전에 이미 계획을 세워두었음을 나타내는 대과거 시제예요. 두 번째로 to ensure는 누군가 배송을 받을 수 있게 확실히 하려는 부사적 용법의 목적으로 사용되었습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 지연은\u003c/span>\u003cspan class=\"en\">This delay\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희에게 초래했습니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">has \u003c/span>\u003cspan class=\"tgt\">caused\u003c/span> us\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상당한 불편함을.\u003c/span>\u003cspan class=\"en\">considerable inconvenience.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 지연은 저희에게 상당한 불편함을 초래했습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 배송 지연이 단순한 기다림을 넘어 화자에게 \u003cb class=\"key\">실질적인 \u003c/b>\u003cb class=\"key\">피해\u003c/b>를 주고 있음을 호소합니다. 고객의 \u003cb class=\"key\">불만 \u003c/b>\u003cb class=\"key\">사항\u003c/b>을 명확하게 규정하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재완료\u003c/span> : have/has + p.p. (과거분사) : \"초래했습니다\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"This delay, 이 지연은. has caused us, 저희에게 초래했습니다. considerable inconvenience, 상당한 불편함을.. 이 문장 전체를 해석하면, 이 지연은 저희에게 상당한 불편함을 초래했습니다.","hl":"m"},{"n":24,"text":"배송이 늦어짐으로 인해 일상생활이나 계획에 큰 차질이 생겼음을 직접적으로 드러냅니다. 상당하다는 표현을 써서 문제가 심각하다는 점을 전달하고 있어요.","hl":"mn"},{"n":25,"text":"여기서 has caused는 과거에 발생한 지연이 지금까지도 계속해서 불편을 주고 있다는 결과나 완료의 상태를 나타내기 위해 현재완료 시제를 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 7\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러므로,\u003c/span>\u003cspan class=\"en\">Therefore,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">알려 주시기 바랍니다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">please \u003c/span>\u003cspan class=\"tgt\">provide\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">명확하고 구체적인 배송 날짜를.\u003c/span>\u003cspan class=\"en\">a clear and specific delivery date.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그러므로 명확하고 구체적인 배송 날짜를 알려 주시기 바랍니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 문제 해결을 위한 필자의 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">요구\u003c/b>를 제시합니다. 막연한 사과보다는 확실한 \u003cb class=\"key\">정보 \u003c/b>\u003cb class=\"key\">제공\u003c/b>을 원한다는 단호한 태도를 보입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명령문(정중한 요청)\u003c/span> : Please + 동사원형 (provide) : \"알려 주시기 바랍니다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"Therefore, 그러므로. please provide, 알려 주시기 바랍니다. a clear and specific delivery date, 명확하고 구체적인 배송 날짜를.. 이 문장 전체를 해석하면, 그러므로 명확하고 구체적인 배송 날짜를 알려 주시기 바랍니다.","hl":"m"},{"n":27,"text":"앞서 언급한 불편함에 대한 해결책으로 배송 날짜를 확실히 알려달라고 요구하는 문장입니다. 이 글을 쓴 핵심적인 목적이 잘 드러나 있죠.","hl":"mn"},{"n":28,"text":"문장 맨 앞에 please를 붙여서 정중하게 표현하고 있지만 기본적으로 동사원형 provide로 시작하는 명령문 형식을 갖추어 필자의 요구사항을 강력하게 전달하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 7\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희는 이 문제가 \u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">expect \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">issue \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신속하게 처리되기를 기대합니다, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">addressed\u003c/span> promptly,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">저희가 저희의 일정을 재조정할 수 있도록 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> we can reorganize our schedule\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">배송을 받을 수 있게 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">receive\u003c/span> the delivery\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어떠한 혼란도 없이.\u003c/span>\u003cspan class=\"en\">without any confusion.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">저희가 어떠한 혼란도 없이 배송을 받을 수 있게 저희의 일정을 재조정할 수 있도록 이 문제가 신속하게 처리되기를 기대합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 배송 지연 문제를 해결해달라는 강력한 요청과 함께, 정확한 일정이 필요한 이유를 \u003cb class=\"key\">일정 \u003c/b>\u003cb class=\"key\">재조정\u003c/b>과 \u003cb class=\"key\">혼란 \u003c/b>\u003cb class=\"key\">방지\u003c/b>를 들어 설명하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문형과 수동태 부정사\u003c/span> : expect [동사] + this issue [목적어] + to be addressed [목적격 보어(to부정사의 수동태)] : \"이 문제가 처리되기를 기대하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">목적을 나타내는 접속사\u003c/span> : so that + 주어 + can + 동사원형 : \"~할 수 있도록\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법(목적)\u003c/span> : to + receive [동사원형] : \"받기 위해서 / 받을 수 있게\"\u003c/div>\u003c/div>","segs":[{"n":29,"text":"We expect this issue, 저희는 이 문제가. to be addressed promptly, 신속하게 처리되기를 기대합니다. so that we can reorganize our schedule, 저희가 저희의 일정을 재조정할 수 있도록. to receive the delivery, 배송을 받을 수 있게. without any confusion, 어떠한 혼란도 없이.. 이 문장 전체를 해석하면, 저희가 어떠한 혼란도 없이 배송을 받을 수 있게 저희의 일정을 재조정할 수 있도록 이 문제가 신속하게 처리되기를 기대합니다.","hl":"m"},{"n":30,"text":"이 문장은 배송 지연에 대한 마지막 요구사항을 담고 있어요. 단순히 기다리겠다는 게 아니라, 신속한 해결을 통해 더 이상의 혼란 없이 일정을 재조정하고 싶다는 단호한 의도를 보여주고 있죠.","hl":"mn"},{"n":31,"text":"중요한 어법 세 가지만 짚어볼게요. 첫 번째로 expect 목적어 to be addressed 구조에서 목적어인 문제는 처리되는 대상이기 때문에 처리되는 대상이라는 의미를 살려 수동태 부정사를 썼습니다. 두 번째는 so that 구문인데요, 뭐뭐 할 수 있도록이라는 목적을 나타내는 접속사입니다. 세 번째로 to receive는 앞의 동작을 왜 하는지 설명해주는 목적의 의미를 더해줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>한 달 전 구매한 책장의 \u003cb class=\"key\">배송 \u003c/b>\u003cb class=\"key\">약속 \u003c/b>\u003cb class=\"key\">기간\u003c/b>인 4주가 지난 상황입니다.\u003c/li>\u003cli>배송을 받기 위해 \u003cb class=\"key\">일정\u003c/b>을 비워두었으나 가구가 도착하지 않아 문제가 발생했습니다.\u003c/li>\u003cli>이러한 \u003cb class=\"key\">지연(delay)\u003c/b>은 고객에게 상당한 \u003cb class=\"key\">불편함\u003c/b>을 끼치고 있습니다.\u003c/li>\u003cli>고객은 원활한 일정 조정을 위해 명확한 \u003cb class=\"key\">배송 \u003c/b>\u003cb class=\"key\">날짜\u003c/b>와 신속한 문제 해결을 요구합니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The writer is requesting a definitive delivery date because the promised furniture delivery has been delayed, causing inconvenience.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">구매한 책장의 배송이 약속된 \u003cb class=\"key\">4주\u003c/b>를 넘겨 지연되자, 고객이 \u003cb class=\"key\">불편함\u003c/b>을 호소하며 구체적인 \u003cb class=\"key\">배송 \u003c/b>\u003cb class=\"key\">날짜\u003c/b> 확답과 신속한 처리를 요구하는 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":32,"text":"자, 오늘은 배송 지연에 대한 요청 글을 분석해 봤습니다. 실생활에서도 유용한 표현들이 많으니 복습할 때 표현들을 입으로 따라 읽어보세요. 고생 많으셨습니다. 다음 시간에 만나요!","hl":null}]}]});</script></body></html>
