<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 35번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 35번","audioDir":"35_audio","preview":false,"count":29,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">35번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>The Arbitrary Nature of Measuring Units in Physics\u003c/h1>\u003ch2>물리학 측정 단위의 임의성과 기술적 선택\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>물리학적 원리는 \u003cb class=\"key\">측정 \u003c/b>\u003cb class=\"key\">단위\u003c/b>의 선택과 무관하게 동일하게 유지되며, 관찰되는 수치는 객관적 실체가 아니라 인간의 \u003cb class=\"key\">임의적 \u003c/b>\u003cb class=\"key\">선택\u003c/b>에 따른 결과일 뿐이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Physical principles remain invariant regardless of the units used, meaning the numerical values we assign are arbitrary descriptive choices rather than inherent properties of the world.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분. 오늘은 물리학에서 사용하는 측정 단위가 과연 어떤 의미를 갖는지에 대해 다룬 고등학교 이학년 모의고사 지문을 함께 공부해 보겠습니다. 이 글은 우리가 당연하게 여기는 숫자 데이터들이 사실은 인간이 정한 임의적인 선택의 결과물이라는 점을 강조하고 있어요. 물리 법칙의 불변성과 기술 방식의 임의성이라는 두 가지 핵심 요지를 잘 기억하며 따라오세요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">물리학은 우주의 법칙을 탐구하는 학문이지만, 이를 표현하기 위해서는 \u003cb class=\"key\">서술 \u003c/b>\u003cb class=\"key\">장치(descriptive \u003c/b>\u003cb class=\"key\">device)\u003c/b>인 측정 단위가 필요합니다. 예를 들어, 한 컵의 물을 '200ml'라고 부르든 '0.2리터'라고 부르든 물의 양이라는 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">본질\u003c/b>은 변하지 않습니다. 이처럼 물리 법칙은 특정 단위에 얽매이지 않는 \u003cb class=\"key\">불변성(invariance)\u003c/b>을 가집니다. 우리가 측정값으로 얻는 숫자 자체는 자연에 원래 존재하는 것이 아니라, 우리가 어떤 \u003cb class=\"key\">척도(scale)\u003c/b>를 사용하기로 했느냐에 따라 달라지는 '약속'의 결과입니다. 즉, 과학적 데이터는 객관적 사실과 인간의 \u003cb class=\"key\">임의적 \u003c/b>\u003cb class=\"key\">선택\u003c/b>이 결합된 형태임을 이해해야 합니다.\u003c/div>","segs":[{"n":2,"text":"우리가 길이를 잴 때 한국에서는 미터를 주로 쓰지만 미국에서는 피트를 쓰기도 하죠. 여기서 중요한 질문은, 단위를 바꾼다고 해서 물건의 실제 길이가 변하느냐는 것입니다. 당연히 아니죠. 물리 법칙은 어떤 언어로 말하든 그 내용이 변하지 않는 진리와 같습니다. 배경지식으로 불변의 법칙과 척도라는 개념을 이해해 두면 좋습니다. 비유를 들자면, 같은 양의 주스를 작은 컵에 담으면 세 컵이 되고 큰 컵에 담으면 한 컵이 되지만 주스의 총량은 변하지 않는 것과 같습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>측정 단위의 특징\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>우리가 익숙한 \u003cb class=\"key\">서술 \u003c/b>\u003cb class=\"key\">장치\u003c/b>인 측정 단위를 예로 들어, 단위가 달라져도 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">원리\u003c/b>는 변하지 않는다는 점을 설명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>물리학의 중립성\u003csmall>주장 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>물리학은 특정 단위를 \u003cb class=\"key\">선호\u003c/b>하지 않으며, 측정된 수치 값은 단위 선택을 떠나 \u003cb class=\"key\">객관적으로 \u003c/b>\u003cb class=\"key\">존재\u003c/b>하는 것이 아니라고 결론 내립니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>온도 척도의 사례와 결론\u003csmall>결론 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>온도 척도 역시 \u003cb class=\"key\">임의적 \u003c/b>\u003cb class=\"key\">선택\u003c/b>이며, 모든 측정 특성은 결국 선택한 척도에 \u003cb class=\"key\">의존\u003c/b>한다는 일반 원칙을 재확인합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 친숙한 측정 단위에서 시작해서 물리학의 일반 원칙으로, 그리고 다시 온도의 예시로 이어지는 논리적인 흐름을 가지고 있습니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 우리가 물리학에서 흔히 사용하는 서술 장치인 측정 단위를 소개합니다. 공간적 거리를 피트로 말하든 미터로 말하든 물리적 원리는 관계없이 동일하다는 점을 명시하며 논의를 시작하고 있네요.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장이 이 글의 핵심적인 주장 단계입니다. 물리학은 특정 단위를 선호하지 않으며 우리가 편의에 따라 선택할 뿐이라고 설명합니다. 특히 측정된 수치적 값은 단위 선택과 동떨어져 객관적으로 존재하는 것이 아니라는 통찰을 보여줍니다.","hl":"f1"},{"n":6,"text":"마지막 다섯 번째와 여섯 번째 문장에서는 온도라는 새로운 예시를 가져와서 앞서 한 주장을 강화합니다. 화씨나 섭씨 중 무엇을 선택하든 물리적 실체는 변하지 않으며, 결국 모든 수치는 척도 의존적이라는 결론을 내리며 글을 마칩니다.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시를 통한 일반화\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">거리와 온도라는 구체적인 \u003cb class=\"key\">예시\u003c/b>를 통해 측정 단위의 \u003cb class=\"key\">임의성\u003c/b>이라는 일반적인 물리적 원리를 이끌어내는 구조입니다. 첫 부분에서 물리적 원리의 \u003cb class=\"key\">불변성\u003c/b>을 언급하고, 마지막에 모든 수치는 \u003cb class=\"key\">척도 \u003c/b>\u003cb class=\"key\">의존적\u003c/b>이라는 결론으로 마무리합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>regardless (2)\u003c/b>\u003cspan>단위 선택과 무관함을 강조\u003c/span>\u003cb>likewise (5)\u003c/b>\u003cspan>새로운 예시를 통한 유추\u003c/span>\u003cb>conclude (6)\u003c/b>\u003cspan>최종 결론 제시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">units of measure\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">descriptive device\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">any one we like\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">arbitrary choice\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">scale-dependent\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Physics (Laws)\u003c/th>\u003cth>Descriptive Choice (Units)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Same regardless of units\u003c/td>\u003ctd>Changes based on scale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Not preferring any unit\u003c/td>\u003ctd>Arbitrary for convenience\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 예시를 통해 일반적인 원리를 도출하고 다시 다른 예시로 확인하는 예시와 결론의 전개 방식을 취하고 있습니다. 글의 시작과 끝에서 일관된 메시지를 전달하고 있어 양괄식 구조로 볼 수 있으며, 세 번째 문장이 전체의 주제를 잘 담고 있습니다.","hl":"ty"},{"n":8,"text":"두 번째 문장의 regardless는 단위에 상관없는 물리의 독립성을 보여주는 중요한 신호어입니다. 다섯 번째 문장의 likewise는 거리에 적용된 논리가 온도에도 똑같이 적용됨을 알려주죠. 또한 conclude라는 단어가 반복되면서 필자가 유도하는 논리적 결론을 명확히 짚어주고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>unit of measure\u003c/b>\u003cem>명사\u003c/em>\u003cspan>측정 단위\u003c/span>\u003c/div>\u003cdiv>\u003cb>descriptive device\u003c/b>\u003cem>명사\u003c/em>\u003cspan>서술 장치\u003c/span>\u003c/div>\u003cdiv>\u003cb>be familiar with\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에 익숙하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>physics\u003c/b>\u003cem>명사\u003c/em>\u003cspan>물리학\u003c/span>\u003c/div>\u003cdiv>\u003cb>spatial distance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공간적 거리\u003c/span>\u003c/div>\u003cdiv>\u003cb>in terms of\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~의 면에서, ~로 환산하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>regardless\u003c/b>\u003cem>부사\u003c/em>\u003cspan>관계없이\u003c/span>\u003c/div>\u003cdiv>\u003cb>conclude\u003c/b>\u003cem>동사\u003c/em>\u003cspan>결론을 내리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>prefer\u003c/b>\u003cem>동사\u003c/em>\u003cspan>선호하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>convenience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>편의\u003c/span>\u003c/div>\u003cdiv>\u003cb>feature\u003c/b>\u003cem>명사\u003c/em>\u003cspan>특성, 특징\u003c/span>\u003c/div>\u003cdiv>\u003cb>numerical value\u003c/b>\u003cem>명사\u003c/em>\u003cspan>수치적 값\u003c/span>\u003c/div>\u003cdiv>\u003cb>assign\u003c/b>\u003cem>동사\u003c/em>\u003cspan>할당하다, 부여하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>spatial separation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>공간적 분리\u003c/span>\u003c/div>\u003cdiv>\u003cb>apart from\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~와 별개로, ~와 동떨어져\u003c/span>\u003c/div>\u003cdiv>\u003cb>likewise\u003c/b>\u003cem>부사\u003c/em>\u003cspan>마찬가지로\u003c/span>\u003c/div>\u003cdiv>\u003cb>Fahrenheit\u003c/b>\u003cem>명사\u003c/em>\u003cspan>화씨\u003c/span>\u003c/div>\u003cdiv>\u003cb>Celsius\u003c/b>\u003cem>명사\u003c/em>\u003cspan>섭씨\u003c/span>\u003c/div>\u003cdiv>\u003cb>Kelvin scale\u003c/b>\u003cem>명사\u003c/em>\u003cspan>켈빈 척도\u003c/span>\u003c/div>\u003cdiv>\u003cb>switch\u003c/b>\u003cem>동사\u003c/em>\u003cspan>바꾸다, 전환하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>arbitrary\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>임의적인, 독단적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>description\u003c/b>\u003cem>명사\u003c/em>\u003cspan>서술, 묘사\u003c/span>\u003c/div>\u003cdiv>\u003cb>scale-dependent\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>척도 의존적인\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"중요한 단어들을 살펴볼까요. descriptive device는 현상을 설명하는 도구를 의미하고, arbitrary는 인간의 편의에 따른 임의적인 선택을 뜻합니다. 마지막에 나온 scale-dependent는 이 글의 주제를 관통하는 척도 의존적이라는 아주 중요한 표현입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">arbitrary\u003c/b>\u003cspan class=\"m\">임의적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">random\u003c/span>\u003cspan class=\"s\">optional\u003c/span>\u003cspan class=\"s\">subjective\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">fixed\u003c/span>\u003cspan class=\"a\">objective\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">regardless\u003c/b>\u003cspan class=\"m\">관계없이\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">anyway\u003c/span>\u003cspan class=\"s\">nevertheless\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">assign\u003c/b>\u003cspan class=\"m\">부여하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">allocate\u003c/span>\u003cspan class=\"s\">attribute\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">apart from\u003c/b>\u003cspan class=\"m\">~와 동떨어져\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">independent of\u003c/span>\u003cspan class=\"s\">separate from\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dependent on\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">conclude\u003c/b>\u003cspan class=\"m\">결론 내리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">deduce\u003c/span>\u003cspan class=\"s\">infer\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어와 반의어도 정리해 봅시다. 임의적이라는 뜻의 arbitrary는 random이나 subjective로 바꿔 쓸 수 있고, 반대말로는 fixed나 objective가 있습니다. 부여하다라는 뜻의 assign은 allocate와 의미가 통하며, apart from은 독립적이라는 의미에서 independent of와 유사한 맥락으로 쓰였습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">측정 단위들을 생각해 보라,\u003c/span>\u003cspan class=\"en\">Consider units of measure,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">서술 장치의 한 종류인\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">kind \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">descriptive \u003c/span>\u003cspan class=\"tgt\">device\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 물리학에서 사용하는 것으로 익숙한.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">we \u003c/span>\u003cspan class=\"tgt\">are \u003c/span>\u003cspan class=\"tgt\">familiar \u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">using\u003c/span> in physics.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리가 물리학에서 사용하는 것으로 익숙한 서술 장치의 한 종류인 측정 단위들을 생각해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물리학에서 사용하는 \u003cb class=\"key\">측정 \u003c/b>\u003cb class=\"key\">단위\u003c/b>를 소재로 제시하며, 이를 현상을 설명하는 하나의 \u003cb class=\"key\">서술 \u003c/b>\u003cb class=\"key\">장치\u003c/b>로 정의하고 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 명사구\u003c/span> : N(units of measure), N(one kind of...) : \"서술 장치의 한 종류인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 생략\u003c/span> : N(device) + [S + V] : \"우리가 사용하는 것으로 익숙한\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"Consider units of measure, 측정 단위들을 생각해 보라.  one kind of descriptive device, 서술 장치의 한 종류인.  we are familiar with using in physics, 우리가 물리학에서 사용하는 것으로 익숙한.. 이 문장 전체를 해석하면, 우리가 물리학에서 사용하는 것으로 익숙한 서술 장치의 한 종류인 측정 단위들을 생각해 보라.","hl":"m"},{"n":12,"text":"이 글은 우리가 물리학에서 흔히 쓰는 측정 단위를 소재로 시작합니다. 단위를 단순히 숫자가 아니라 세상을 설명하는 하나의 서술 장치로 바라보라는 제안을 던지고 있어요.","hl":"mn"},{"n":13,"text":"첫 번째 포인트는 units of measure 뒤에 쉼표와 함께 나온 명사구입니다. 이것은 앞의 단어와 같은 대상을 가리키는 동격 표현이에요. 두 번째로 device 뒤에는 목적격 관계대명사가 생략되어 있어서, 우리가 사용하는 데 익숙한 장치라고 뒤에서 앞으로 수식해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공간적인 거리는 주어질 수 있으며\u003c/span>\u003cspan class=\"en\">Spatial distances \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">given\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">피트, 미터 또는 어떤 다른 단위로 환산하여,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">terms \u003c/span>\u003cspan class=\"tgt\">of\u003c/span> feet or meters or some other unit,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그와 관계없이 물리적 원리는 동일할 것이다.\u003c/span>\u003cspan class=\"en\">and the physics will be the same regardless.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">공간적인 거리는 피트, 미터 또는 어떤 다른 단위로 환산하여 주어질 수 있으며, 그와 관계없이 물리적 원리는 동일할 것이다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 거리를 어떤 단위로 표현하든 수치만 달라질 뿐, 그 안에 담긴 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>이나 원리는 \u003cb class=\"key\">불변\u003c/b>함을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 수동태\u003c/span> : can + be + p.p.(past participle) : \"주어질 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">전치사구 표현\u003c/span> : in terms of + N : \"~로 환산하여, ~의 관점에서\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"Spatial distances can be given, 공간적인 거리는 주어질 수 있으며.  in terms of feet or meters or some other unit, 피트, 미터 또는 어떤 다른 단위로 환산하여.  and the physics will be the same regardless, 그와 관계없이 물리적 원리는 동일할 것이다.. 이 문장 전체를 해석하면, 공간적인 거리는 피트, 미터 또는 어떤 다른 단위로 환산하여 주어질 수 있으며, 그와 관계없이 물리적 원리는 동일할 것이다.","hl":"m"},{"n":15,"text":"거리를 잴 때 피트를 쓰든 미터를 쓰든 숫자만 바뀔 뿐이죠. 그 뒤에 숨어 있는 물리적인 본질은 단위 선택과 상관없이 항상 일정하다는 점을 강조하고 있습니다.","hl":"mn"},{"n":16,"text":"첫 번째로 주어인 거리가 주어지는 대상이므로 can 뒤에 be given이라는 수동태를 썼습니다. 두 번째로 in terms of는 어떤 수단이나 단위를 나타낼 때 아주 자주 쓰이는 숙어이니 꼭 기억해 두세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 이로부터 결론 내린다\u003c/span>\u003cspan class=\"en\">We \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">conclude \u003c/span>\u003cspan class=\"tgt\">from \u003c/span>\u003cspan class=\"tgt\">this \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물리학이 하나의 길이 단위를 다른 어떤 것보다 선호하지 않는다고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> physics does not \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">prefer \u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">unit \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">length \u003c/span>\u003cspan class=\"tgt\">over \u003c/span>\u003cspan class=\"tgt\">any \u003c/span>\u003cspan class=\"tgt\">other\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그래서 우리는 좋아하는 어떤 단위든 선택할 수 있다\u003c/span>\u003cspan class=\"en\">and we may choose any one we like\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">편의상의 이유로.\u003c/span>\u003cspan class=\"en\">for reasons of convenience.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 이로부터 물리학이 하나의 길이 단위를 다른 어떤 것보다 선호하지 않는다고 결론 내리고, 그래서 편의상의 이유로 우리는 좋아하는 어떤 단위든 선택할 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물리학 자체는 특정 단위를 편애하지 않으므로, 단위 선택은 인간의 \u003cb class=\"key\">편의성\u003c/b>에 따른 \u003cb class=\"key\">임의적\u003c/b>인 결정임을 밝힙니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : V + [that + S + V] : \"~라는 점을 결론짓다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">비교 표현\u003c/span> : prefer A over B : \"B보다 A를 선호하다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"We conclude from this, 우리는 이로부터 결론 내린다.  that physics does not prefer one unit of length over any other, 물리학이 하나의 길이 단위를 다른 어떤 것보다 선호하지 않는다고.  and we may choose any one we like, 그래서 우리는 좋아하는 어떤 단위든 선택할 수 있다.  for reasons of convenience, 편의상의 이유로.. 이 문장 전체를 해석하면, 우리는 이로부터 물리학이 하나의 길이 단위를 다른 어떤 것보다 선호하지 않는다고 결론 내리고, 그래서 편의상의 이유로 우리는 좋아하는 어떤 단위든 선택할 수 있다.","hl":"m"},{"n":18,"text":"물리학 법칙 입장에서는 미터법이든 야드파운드법이든 상관없다는 뜻입니다. 결국 어떤 단위를 쓸지는 순전히 우리가 쓰기 편한가 하는 인간의 편리함에 달려 있다는 결론입니다.","hl":"mn"},{"n":19,"text":"첫 번째로 conclude 뒤에 나오는 that은 결론의 내용을 연결하는 명사절 접속사입니다. 두 번째로 prefer A over B 구조가 쓰였는데요, 이때 전치사 over는 무엇보다 더라는 비교의 의미를 담고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 더 나아가 ~라고 결론짓는다\u003c/span>\u003cspan class=\"en\">We further conclude \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그 선택에 따른 어떠한 특성도,\u003c/span>\u003cspan class=\"en\">any feature \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">depending \u003c/span>\u003cspan class=\"tgt\">on\u003c/span> that choice,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특정한 수치적 값과 같이,\u003c/span>\u003cspan class=\"en\">such as the particular numerical value\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">두 지점 사이의 공간적 분리에 부여된,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">assigned\u003c/span> to the spatial separation between two locations,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">세상 어딘가에 존재하는 것이 아니라고,\u003c/span>\u003cspan class=\"en\">is not out there in the world\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단위의 선택과 동떨어져.\u003c/span>\u003cspan class=\"en\">apart from a choice of unit.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 더 나아가 두 지점 사이의 공간적 분리에 부여된 특정한 수치적 값과 같이 그 선택에 따른 어떠한 특성도 단 위의 선택과 동떨어져 세상 어딘가에 존재하는 것이 아니라고 결론짓는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 측정 단위의 선택은 객관적 실재가 아니라 인간의 \u003cb class=\"key\">임의적 \u003c/b>\u003cb class=\"key\">결정\u003c/b>임을 강조합니다. 즉, 수치 데이터는 단위라는 \u003cb class=\"key\">인간의 \u003c/b>\u003cb class=\"key\">선택\u003c/b> 없이는 세상에 홀로 존재할 수 없다는 논리입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : conclude [동사] + [that + 주어 + 동사 (목적어절)] : \"~라는 것을\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구\u003c/span> : any feature [명사] + [depending on (현재분사구)] : \"~에 따른\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">과거분사\u003c/span> : value [명사] + [assigned (과거분사)] : \"부여된\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"We further conclude that, 우리는 더 나아가 ~라고 결론짓는다. any feature depending on that choice, 그 선택에 따른 어떠한 특성도. such as the particular numerical value, 특정한 수치적 값과 같이. assigned to the spatial separation between two locations, 두 지점 사이의 공간적 분리에 부여된. is not out there in the world, 세상 어딘가에 존재하는 것이 아니라고. apart from a choice of unit, 단위의 선택과 동떨어져.. 이 문장 전체를 해석하면, 우리는 더 나아가 두 지점 사이의 공간적 분리에 부여된 특정한 수치적 값과 같이 그 선택에 따른 어떠한 특성도 단 위의 선택과 동떨어져 세상 어딘가에 존재하는 것이 아니라고 결론짓는다.","hl":"m"},{"n":21,"text":"우리가 길이를 피트로 잴지 미터로 잴지 정하는 것은 인간의 선택이죠. 그래서 그 선택에 따라 나오는 구체적인 숫자 값은 단위라는 인간의 선택 없이는 세상에 그냥 존재하는 게 아니라는 결론입니다.","hl":"mn"},{"n":22,"text":"첫 번째로 동사 conclude 뒤에 나오는 that은 목적어 절을 이끄는 접속사예요. 두 번째로 depending on은 앞에 있는 명사를 수식하는 현재분사구로 쓰였습니다. 세 번째로 assigned는 수치가 부여되는 수동의 의미라 과거분사 형태를 쓰고 있죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">온도도 마찬가지로 주어질 수 있으며,\u003c/span>\u003cspan class=\"en\">Temperatures \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">can \u003c/span>\u003cspan class=\"tgt\">likewise \u003c/span>\u003cspan class=\"tgt\">be \u003c/span>\u003cspan class=\"tgt\">given\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">화씨, 섭씨 또는 켈빈 척도로 환산하여,\u003c/span>\u003cspan class=\"en\">in terms of the Fahrenheit or Celsius or Kelvin scale,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">물리적 원리의 어떠한 것도 변화하지 않는다,\u003c/span>\u003cspan class=\"en\">and nothing in the physics changes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리가 하나의 척도에서 다른 것으로 바꾸더라도.\u003c/span>\u003cspan class=\"en\">when we switch from \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">one \u003c/span>\u003cspan class=\"tgt\">scale \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">another\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">온도도 마찬가지로 화씨, 섭씨 또는 켈빈 척도로 환산하여 주어질 수 있으며, 우리가 하나의 척도에서 다른 것으로 바꾸더라도 물리적 원리의 어떠한 것도 변화하지 않는다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 길이 단위와 마찬가지로 \u003cb class=\"key\">온도 \u003c/b>\u003cb class=\"key\">체계\u003c/b> 역시 물리적 본질을 바꾸지 않는다는 사례를 제시합니다. 단위가 바뀌어도 그 바탕에 있는 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">법칙\u003c/b> 자체는 불변한다는 점이 핵심입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">조동사가 포함된 수동태\u003c/span> : can [조동사] + [be + given (p.p.)] : \"주어질 수 있다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">부정대명사 표현\u003c/span> : from one [명사] to another [명사 생략] : \"하나의 척도에서 다른 것으로\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"Temperatures can likewise be given, 온도도 마찬가지로 주어질 수 있으며. in terms of the Fahrenheit or Celsius or Kelvin scale, 화씨, 섭씨 또는 켈빈 척도로 환산하여. and nothing in the physics changes, 물리적 원리의 어떠한 것도 변화하지 않는다. when we switch from one scale to another, 우리가 하나의 척도에서 다른 것으로 바꾸더라도.. 이 문장 전체를 해석하면, 온도도 마찬가지로 화씨, 섭씨 또는 켈빈 척도로 환산하여 주어질 수 있으며, 우리가 하나의 척도에서 다른 것으로 바꾸더라도 물리적 원리의 어떠한 것도 변화하지 않는다.","hl":"m"},{"n":24,"text":"길이 단위뿐만 아니라 온도 체계도 같은 원리가 적용된다는 뜻이에요. 섭씨를 쓰든 화씨를 쓰든 척도를 바꾼다고 해서 진짜 물리적인 열의 법칙이 변하는 건 아니니까요.","hl":"mn"},{"n":25,"text":"첫 번째로 can be given은 온도가 주어지는 대상임을 나타내는 수동태 표현입니다. 두 번째로 one scale to another는 하나의 척도에서 또 다른 척도로 옮겨가는 대조적인 상황을 잘 보여주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 ~라고 결론을 내린다 척도의 선택이 서술상의 임의적인 선택이며, 그리고 어떤 특성이든 그 선택에 달린 (특성이) 척도에 의존한다는.\u003c/span>\u003cspan class=\"en\">We conclude that the choice of scale is an arbitrary choice in description, and that any feature \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">depends \u003c/span>\u003cspan class=\"tgt\">on\u003c/span> that choice is scale­dependent.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">우리는 척도의 선택이 서술상의 임의적인 선택이며, 그 선택에 달린 어떤 특성이든 척도에 의존한다는 결론을 내린다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단위 선택이 순전히 설명 방식에서의 \u003cb class=\"key\">임의적 \u003c/b>\u003cb class=\"key\">선택\u003c/b>임을 최종 결론짓습니다. 측정된 수치는 결국 우리가 택한 \u003cb class=\"key\">척도에 \u003c/b>\u003cb class=\"key\">의존\u003c/b>하여 결정된 특성일 뿐이라는 통찰입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : any feature [선행사] + [that (주격 관대) + depends (동사)] : \"~에 달린 특성\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">접속사의 병렬 구조\u003c/span> : conclude + [that 절 1] + and + [that 절 2] : \"~라는 점과 ~라는 점을\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"We conclude that, 우리는 ~라고 결론을 내린다. the choice of scale is an arbitrary choice in description, 척도의 선택이 서술상의 임의적인 선택이며. and that any feature, 그리고 어떤 특성이든. that depends on that choice is scale-dependent, 그 선택에 달린 (특성이) 척도에 의존한다는.. 이 문장 전체를 해석하면, 우리는 척도의 선택이 서술상의 임의적인 선택이며, 그 선택에 달린 어떤 특성이든 척도에 의존한다는 결론을 내린다.","hl":"m"},{"n":27,"text":"마지막 결론입니다. 어떤 척도를 쓸지는 그냥 설명하기 편하게 고른 임의적 선택일 뿐이고, 그 결과로 나온 수치적 특징들은 당연히 우리가 고른 그 척도에 의존할 수밖에 없다는 의미예요.","hl":"mn"},{"n":28,"text":"첫 번째로 conclude 뒤에 that절 두 개가 and로 묶여 병렬 구조를 이루고 있습니다. 두 번째로 features 뒤의 that은 주어 자리가 비어 있는 주격 관계대명사로 선행사를 수식해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>물리학에서 \u003cb class=\"key\">측정 \u003c/b>\u003cb class=\"key\">단위\u003c/b>는 현상을 설명하기 위해 우리가 사용하는 하나의 \u003cb class=\"key\">서술 \u003c/b>\u003cb class=\"key\">장치\u003c/b>일 뿐이다.\u003c/li>\u003cli>거리 측정에서 어떤 단위를 쓰든 \u003cb class=\"key\">물리적 \u003c/b>\u003cb class=\"key\">원리\u003c/b>는 동일하게 유지되며, 특정 단위에 대한 \u003cb class=\"key\">선호\u003c/b>는 없다.\u003c/li>\u003cli>두 지점 사이의 \u003cb class=\"key\">수치적 \u003c/b>\u003cb class=\"key\">값\u003c/b>은 세상에 객관적으로 존재하는 것이 아니라, 단위의 \u003cb class=\"key\">선택\u003c/b>에 따라 결정되는 것이다.\u003c/li>\u003cli>온도 척도의 사례처럼 모든 측정의 수치는 \u003cb class=\"key\">임의적인 \u003c/b>\u003cb class=\"key\">선택\u003c/b>이며, 결과값은 모두 \u003cb class=\"key\">척도 \u003c/b>\u003cb class=\"key\">의존적\u003c/b>이다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Physical principles remain invariant regardless of the units used, meaning the numerical values we assign are arbitrary descriptive choices rather than inherent properties of the world.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">물리학적 원리는 \u003cb class=\"key\">측정 \u003c/b>\u003cb class=\"key\">단위\u003c/b>의 선택과 무관하게 동일하게 유지되며, 관찰되는 수치는 객관적 실체가 아니라 인간의 \u003cb class=\"key\">임의적 \u003c/b>\u003cb class=\"key\">선택\u003c/b>에 따른 결과일 뿐이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":29,"text":"오늘 수업에서는 물리학의 측정 단위가 가진 임의적 성격에 대해 배워보았습니다. 우리가 보는 숫자가 절대적인 실체가 아니라 우리가 선택한 척도에 의존한다는 점을 꼭 기억하세요. 이 지문은 과학 철학적인 내용을 담고 있어 내신이나 수능에서 변형 문제로 나오기 아주 좋으니 꼼꼼히 복습하시기 바랍니다. 수고하셨습니다.","hl":null}]}]});</script></body></html>
