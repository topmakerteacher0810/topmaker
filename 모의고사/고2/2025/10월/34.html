<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 34번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 34번","audioDir":"34_audio","preview":false,"count":29,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">34번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>The Spiral of Silence: How Perceived Popularity Shapes Public Opinion\u003c/h1>\u003ch2>침묵의 나선: 인식된 대중성이 여론 형성에 미치는 영향\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>자신의 의견이 \u003cb class=\"key\">대중적\u003c/b>이라고 믿을 때는 적극적으로 목소리를 내지만, \u003cb class=\"key\">소수 \u003c/b>\u003cb class=\"key\">의견\u003c/b>이라 판단될 때는 사회적 고립을 피해 침묵함으로써 특정 견해만 지배적으로 보이는 \u003cb class=\"key\">침묵의 \u003c/b>\u003cb class=\"key\">나선\u003c/b> 현상을 설명한다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>The 'spiral of silence' occurs because individuals tend to voice their opinions when they feel they are in the majority but remain silent when they perceive themselves as the minority.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 사회 심리학과 정치학에서 아주 중요한 개념인 Spiral of Silence, 즉 '침묵의 나선' 이론에 대해 배워볼 거예요. 우리가 왜 때로는 내 생각을 당당하게 말하고, 또 어떤 때는 입을 꾹 다물게 되는지에 대한 흥미로운 분석이 담긴 지문입니다. 이 글의 요지는 사람들이 자신의 의견이 대중적이라고 느낄 때만 목소리를 높인다는 것이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 이론은 1974년 독일의 사회과학자 엘리자베스 노엘레 노이만(Elisabeth Noelle-Neumann)이 발표한 \u003cb class=\"key\">침묵의 \u003c/b>\u003cb class=\"key\">나선\u003c/b>(Spiral of Silence) 이론입니다. 사람들은 본능적으로 사회적 \u003cb class=\"key\">고립\u003c/b>을 두려워하기 때문에, 자신의 의견이 다수와 일치하는지 주변을 살피는 경향이 있습니다. 만약 내 생각이 \u003cb class=\"key\">소수 \u003c/b>\u003cb class=\"key\">의견\u003c/b>이라고 느껴지면 비난받거나 소외당하지 않기 위해 입을 닫게 되죠. 마치 눈덩이가 굴러가며 커지듯, 우세한 목소리는 더 커지고 작은 목소리는 점점 사라지는 \u003cb class=\"key\">여론 \u003c/b>\u003cb class=\"key\">형성\u003c/b> 과정을 비유적으로 표현한 것입니다. 일상에서 식당 메뉴를 정할 때 다수가 원하는 메뉴에 내 의견을 숨기고 따르는 상황과 비슷합니다.\u003c/div>","segs":[{"n":2,"text":"이 이론을 만든 노엘레 노이만은 독일의 학자인데요, 인간은 사회적 동물이라서 집단에서 소외되는 것을 굉장히 무서워한다는 점에 주목했습니다. 여러분도 친구들 사이에서 나만 다른 의견을 가졌을 때 소외될까 봐 조용히 있었던 경험이 있죠? 그런 심리가 모여서 사회 전체의 여론을 어떻게 바꾸는지 설명하는 것이 바로 이 침묵의 나선 이론입니다. 마치 눈덩이가 구르듯 한쪽 목소리만 점점 커지는 과정을 떠올려 보세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>현상 관찰\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>독일의 연구자 노엘레 노이만이 선거 운동 기간 중 \u003cb class=\"key\">인기 \u003c/b>\u003cb class=\"key\">없는\u003c/b> 의견을 가진 사람들이 침묵하는 현상을 관찰하고 이를 \u003cb class=\"key\">침묵의 \u003c/b>\u003cb class=\"key\">나선\u003c/b>이라 명명합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>작동 원리\u003csmall>근거 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>자신의 의견이 다수의 지지를 받는다고 느끼면 표현하고, 그렇지 않으면 \u003cb class=\"key\">침묵\u003c/b>함으로써 한쪽 입장은 \u003cb class=\"key\">주목\u003c/b>받고 다른 쪽은 쇠퇴하는 나선 구조가 형성됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>일상 적용\u003csmall>예시 및 결론 · 문장 5–6\u003c/small>\u003c/h4>\u003cp>사람들은 \u003cb class=\"key\">타인의 \u003c/b>\u003cb class=\"key\">생각\u003c/b>이 자신과 같다고 느낄 때 소셜 미디어나 배지 등 다양한 방식으로 의견을 더 적극적으로 드러내는 \u003cb class=\"key\">경향\u003c/b>이 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"그럼 이제 글의 내용을 구체적으로 살펴보면서 어떤 흐름으로 이야기가 전개되는지 확인해 봅시다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 이 이론의 탄생 배경을 설명해요. 노엘레 노이만은 독일의 선거 기간을 관찰하면서, 특정 견해가 더 많이 들리고 인기 없는 의견은 사람들이 스스로 입을 닫는 모습을 발견했죠. 그녀는 이 현상을 Spiral of Silence라고 불렀습니다.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장은 이 현상의 구체적인 작동 원리를 다룹니다. 자신의 의견이 Popular, 즉 대중적이라고 느끼면 자신 있게 말하지만, 그렇지 않으면 Quiet, 조용히 있게 되죠. 결국 이 과정이 나선형으로 반복되면서 한쪽은 엄청난 Publicity를 얻고 다른 쪽은 거의 사라지게 되는 거예요.","hl":"f1"},{"n":6,"text":"다섯 번째와 여섯 번째 문장에서는 우리 일상생활의 예시를 들어 마무리합니다. 배지를 달거나 소셜 미디어에 글을 올리는 행동들이 사실은 타인이 내 의견에 Share, 즉 공유하고 동의한다는 인식이 있을 때 더 Apt to, 하는 경향이 있다는 결론을 내려주죠.","hl":"f2"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">인과\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 2번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">두 번째 문장에서 핵심 개념인 \u003cb class=\"key\">침묵의 \u003c/b>\u003cb class=\"key\">나선\u003c/b>을 명확히 제시하고 있습니다. 이후 문장들은 왜 이런 현상이 발생하는지(원인)와 그로 인해 여론이 어떻게 한쪽으로 쏠리는지(결과)를 \u003cb class=\"key\">인과 \u003c/b>\u003cb class=\"key\">관계\u003c/b>로 설명하며 뒷받침합니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>so that (4)\u003c/b>\u003cspan>결과를 나타내는 접속사\u003c/span>\u003cb>According to this theory (6)\u003c/b>\u003cspan>앞서 설명한 이론을 바탕으로 결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">unpopular\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">spiral of silence\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">remain quiet\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">very little publicity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">more apt to do these kinds of things\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Popular Opinions\u003c/th>\u003cth>Unpopular Opinions\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Express them actively\u003c/td>\u003ctd>Mute their opinions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Considerable publicity\u003c/td>\u003ctd>Very little publicity\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":7,"text":"이 글은 특정 현상에 대한 원인과 결과를 보여주는 인과 구조로 되어 있습니다. 글의 도입부인 두 번째 문장에서 주제가 바로 등장하는 두괄식 구성을 취하고 있죠. 침묵이라는 선택이 어떻게 나선형 여론 형성을 만들어내는지 논리적으로 설명하고 있습니다.","hl":"ty"},{"n":8,"text":"문장 속 신호어들을 잘 보세요. 네 번째 문장의 so that은 앞선 행동이 가져오는 결과를 연결해 줍니다. 그리고 마지막 문장의 According to this theory는 앞에서 설명한 침묵의 나선 이론을 바탕으로 최종적인 인간의 행동 경향을 정리해 주는 역할을 하죠.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>researcher\u003c/b>\u003cem>명사\u003c/em>\u003cspan>연구자\u003c/span>\u003c/div>\u003cdiv>\u003cb>observed\u003c/b>\u003cem>동사\u003c/em>\u003cspan>목격했다, 관찰했다\u003c/span>\u003c/div>\u003cdiv>\u003cb>election campaign\u003c/b>\u003cem>명사\u003c/em>\u003cspan>선거 운동\u003c/span>\u003c/div>\u003cdiv>\u003cb>muted\u003c/b>\u003cem>동사\u003c/em>\u003cspan>표현하지 않았다, 약화시켰다\u003c/span>\u003c/div>\u003cdiv>\u003cb>opinion\u003c/b>\u003cem>명사\u003c/em>\u003cspan>의견, 견해\u003c/span>\u003c/div>\u003cdiv>\u003cb>perceived\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인식되었다\u003c/span>\u003c/div>\u003cdiv>\u003cb>unpopular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인기 없는, 비대중적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>spiral of silence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>침묵의 나선\u003c/span>\u003c/div>\u003cdiv>\u003cb>occurs\u003c/b>\u003cem>동사\u003c/em>\u003cspan>발생한다\u003c/span>\u003c/div>\u003cdiv>\u003cb>individual\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인\u003c/span>\u003c/div>\u003cdiv>\u003cb>express\u003c/b>\u003cem>동사\u003c/em>\u003cspan>표현하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>popular\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>대중적인, 인기 있는\u003c/span>\u003c/div>\u003cdiv>\u003cb>whereas\u003c/b>\u003cem>접속사\u003c/em>\u003cspan>~하는 반면에\u003c/span>\u003c/div>\u003cdiv>\u003cb>remain\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~한 상태로 남다\u003c/span>\u003c/div>\u003cdiv>\u003cb>considerable\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>상당한\u003c/span>\u003c/div>\u003cdiv>\u003cb>publicity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>주목, 홍보, 알려짐\u003c/span>\u003c/div>\u003cdiv>\u003cb>variety\u003c/b>\u003cem>명사\u003c/em>\u003cspan>다양성\u003c/span>\u003c/div>\u003cdiv>\u003cb>bumper sticker\u003c/b>\u003cem>명사\u003c/em>\u003cspan>범퍼 스티커\u003c/span>\u003c/div>\u003cdiv>\u003cb>theory\u003c/b>\u003cem>명사\u003c/em>\u003cspan>이론\u003c/span>\u003c/div>\u003cdiv>\u003cb>apt to\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~하는 경향이 있는\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"여기서 중요한 단어들을 짚어볼게요. Perceived는 '인식된'이라는 뜻으로, 실제 인기보다 내 마음속의 판단이 중요하다는 걸 보여줍니다. Publicity는 대중에게 알려지는 주목도나 홍보를 의미하고, Apt to는 무엇을 하는 경향이 있다는 핵심 숙어니까 꼭 기억하세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">express\u003c/b>\u003cspan class=\"m\">표현하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">voice\u003c/span>\u003cspan class=\"s\">articulate\u003c/span>\u003cspan class=\"s\">convey\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">suppress\u003c/span>\u003cspan class=\"a\">hide\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">unpopular\u003c/b>\u003cspan class=\"m\">인기 없는\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">disliked\u003c/span>\u003cspan class=\"s\">out of favor\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">common\u003c/span>\u003cspan class=\"a\">popular\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">considerable\u003c/b>\u003cspan class=\"m\">상당한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">substantial\u003c/span>\u003cspan class=\"s\">significant\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">slight\u003c/span>\u003cspan class=\"a\">insignificant\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">quiet\u003c/b>\u003cspan class=\"m\">조용한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">silent\u003c/span>\u003cspan class=\"s\">mute\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">loud\u003c/span>\u003cspan class=\"a\">vocal\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">perceive\u003c/b>\u003cspan class=\"m\">인식하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">recognize\u003c/span>\u003cspan class=\"s\">notice\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"동의어와 반의어도 정리해 볼까요? Express, 즉 표현하다라는 단어는 voice나 articulate로 바꿔 쓸 수 있지만, 반대로 suppress처럼 억누르다라는 단어와는 반대 의미가 됩니다. Unpopular와 반대되는 popular, 그리고 상당한이라는 뜻의 considerable과 반대되는 slight 같은 단어들도 함께 챙겨두면 좋습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">독일의 정치 연구자로서,\u003c/span>\u003cspan class=\"en\">As a political researcher in Germany,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Noelle­Neumann은 ~을 목격했다.\u003c/span>\u003cspan class=\"en\">Noelle­Neumann \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">observed \u003c/span>\u003cspan class=\"tgt\">that\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">선거 운동 기간 동안 특정 견해들이 ~인 것처럼 보이는 것을\u003c/span>\u003cspan class=\"en\">during election campaigns, certain views seemed to\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 견해들보다 더 많이 다뤄지고, 때로는\u003c/span>\u003cspan class=\"en\">get more play than others, and sometimes\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들이 자신들의 의견들을 표현하지 않는 것을\u003c/span>\u003cspan class=\"en\">people muted their opinions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들에 대해 말하기보다는, 특히 ~하는 경우에\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">rather \u003c/span>\u003cspan class=\"tgt\">than \u003c/span>\u003cspan class=\"tgt\">talking\u003c/span> about them, especially if\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그러한 의견들이 인기 없는 것으로 인식되는 경우\u003c/span>\u003cspan class=\"en\">those opinions \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">perceived \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">be\u003c/span> unpopular.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">독일의 정치 연구자로서 Noelle­Neumann은 선거 운동 기간 동안 특정 견해들이 다른 견해들보다 더 많이 다뤄지는 것처럼 보이고, 때로는 특히 그러한 의견들이 인기 없는 것으로 인식되는 경우 사람들이 그것들에 대해 말하기보다는 자신들의 의견들을 표현하지 않는 것을 목격했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 선거 기간 중 주류와 다른 \u003cb class=\"key\">소수의 \u003c/b>\u003cb class=\"key\">의견\u003c/b>이 억제되는 현상을 관찰한 도입부입니다. 사람들은 고립되지 않으려고 자신의 의견이 대중적이지 않다고 느끼면 입을 닫는 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">심리\u003c/b>를 보입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절 접속사 that\u003c/span> : observed [동사] + that [접속사] + 문장 [목적어] : \"~라는 것을 목격했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">동명사 관용 표현\u003c/span> : rather than + talking [동명사] : \"말하는 것보다는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">수동태와 to부정사\u003c/span> : be [perceived (과거분사)] + to be [to부정사] : \"인식되는 경우\"\u003c/div>\u003c/div>","segs":[{"n":11,"text":"As a political researcher in Germany, 독일의 정치 연구자로서. Noelle­Neumann observed that, Noelle­Neumann은 ~을 목격했다.. during election campaigns, certain views seemed to, 선거 운동 기간 동안 특정 견해들이 ~인 것처럼 보이는 것을. get more play than others, and sometimes, 다른 견해들보다 더 많이 다뤄지고, 때로는. people muted their opinions, 사람들이 자신들의 의견들을 표현하지 않는 것을. rather than talking about them, especially if, 그것들에 대해 말하기보다는, 특히 ~하는 경우에. those opinions were perceived to be unpopular, 그러한 의견들이 인기 없는 것으로 인식되는 경우. 이 문장 전체를 해석하면, 독일의 정치 연구자로서 Noelle­Neumann은 선거 운동 기간 동안 특정 견해들이 다른 견해들보다 더 많이 다뤄지는 것처럼 보이고, 때로는 특히 그러한 의견들이 인기 없는 것으로 인식되는 경우 사람들이 그것들에 대해 말하기보다는 자신들의 의견들을 표현하지 않는 것을 목격했다.","hl":"m"},{"n":12,"text":"선거 기간 중에 사람들이 자신의 의견이 주류가 아니라고 느끼면 비난받을까 봐 말을 아끼는 현상을 설명하고 있어요. 바로 소수의 의견이 사라지는 사회적 심리를 보여주는 도입부입니다.","hl":"mn"},{"n":13,"text":"첫 번째로 observed 뒤의 that은 문장에서 목적어 역할을 하는 절을 이끄는 접속사예요. 두 번째로 rather than 뒤에 talking이 온 것은 비교하는 대상을 동명사로 맞춘 구조이고요. 마지막으로 were perceived는 의견이 타인에 의해 인식되는 것이라 수동태로 썼습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Noelle­Neumann은 부른다\u003c/span>\u003cspan class=\"en\">Noelle­Neumann \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">calls \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이것을 ‘침묵의 나선’이라고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">this \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">spiral \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">silence\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Noelle­Neumann 은 이것을 ‘침묵의 나선’이라고 부른다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 앞 문장에서 언급한 현상을 \u003cb class=\"key\">침묵의 \u003c/b>\u003cb class=\"key\">나선\u003c/b>이라는 구체적인 학술 용어로 정의합니다. 이 글의 주제이자 \u003cb class=\"key\">핵심 \u003c/b>\u003cb class=\"key\">개념\u003c/b>을 명시하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">5형식 문장(call A B)\u003c/span> : call [동사] + this [목적어] + the spiral of silence [목적격 보어] : \"이것을 침묵의 나선이라고 부른다\"\u003c/div>\u003c/div>","segs":[{"n":14,"text":"Noelle­Neumann calls, Noelle­Neumann은 부른다. this the spiral of silence, 이것을 ‘침묵의 나선’이라고. 이 문장 전체를 해석하면, Noelle­Neumann 은 이것을 ‘침묵의 나선’이라고 부른다.","hl":"m"},{"n":15,"text":"앞에서 길게 설명했던 현상을 침묵의 나선이라는 한 단어로 깔끔하게 정리하고 있어요. 이 용어는 이 글 전체를 꿰뚫는 핵심 개념이 됩니다.","hl":"mn"},{"n":16,"text":"이 문장은 오형식 구조로 쓰였어요. 목적어인 this와 목적격 보어인 the spiral of silence가 서로 일치하는 관계를 보여주죠.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">침묵의 나선이 발생한다\u003c/span>\u003cspan class=\"en\">The spiral of silence occurs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">~라고 인식하는 개인들이 ~할 때\u003c/span>\u003cspan class=\"en\">when \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">individuals \u003c/span>\u003cspan class=\"tgt\">who \u003c/span>\u003cspan class=\"tgt\">perceive\u003c/span> that\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 의견이 대중적이라고 그것들을 표현하면,\u003c/span>\u003cspan class=\"en\">their opinions are popular express them,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반면에 ~라고 생각하지 않는 개인들은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">whereas\u003c/span> those who do not think\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 의견이 대중적이라고 생각하지 않을 때 조용히 있을 때\u003c/span>\u003cspan class=\"en\">their opinions are popular \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">remain \u003c/span>\u003cspan class=\"tgt\">quiet\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자신들의 의견이 대중적이라고 인식하는 개인들은 그것들을 표현하지만, 자신들의 의견이 대중적이라고 생각하지 않는 개인들은 조용히 있을 때 침묵의 나선이 발생한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이론의 메커니즘을 설명하며, \u003cb class=\"key\">다수와 \u003c/b>\u003cb class=\"key\">소수\u003c/b>의 태도 차이를 보여줍니다. 대중적이라고 믿는 쪽은 당당하게 말하고, 그렇지 않은 쪽은 위축되는 현상이 \u003cb class=\"key\">대조\u003c/b>를 이룹니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : individuals [선행사] + who [관계대명사] + perceive [동사] : \"인식하는 개인들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">대조의 접속사\u003c/span> : [문장], whereas [접속사] [문장] : \"반면에\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">2형식 동사와 형용사 보어\u003c/span> : remain [상태 동사] + quiet [형용사 보어] : \"조용히 있다\"\u003c/div>\u003c/div>","segs":[{"n":17,"text":"The spiral of silence occurs, 침묵의 나선이 발생한다. when individuals who perceive that, ~라고 인식하는 개인들이 ~할 때. their opinions are popular express them, 자신들의 의견이 대중적이라고 그것들을 표현하면. whereas those who do not think, 반면에 ~라고 생각하지 않는 개인들은. their opinions are popular remain quiet, 자신들의 의견이 대중적이라고 생각하지 않을 때 조용히 있을 때. 이 문장 전체를 해석하면, 자신들의 의견이 대중적이라고 인식하는 개인들은 그것들을 표현하지만, 자신들의 의견이 대중적이라고 생각하지 않는 개인들은 조용히 있을 때 침묵의 나선이 발생한다.","hl":"m"},{"n":18,"text":"여론의 형성 과정을 다수와 소수의 심리적 차이로 설명합니다. 다수는 더 크게 목소리를 내고 소수는 위축되는 과정이 반복되며 나선 구조를 만들게 됩니다.","hl":"mn"},{"n":19,"text":"첫 번째로 who는 선행사 individuals를 꾸며주는 주격 관계대명사예요. 두 번째로 whereas는 앞뒤의 서로 다른 두 상황을 대조하기 위해 쓰였습니다. 세 번째로 remain 뒤에는 형용사 quiet가 와서 주어의 상태를 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 과정은\u003c/span>\u003cspan class=\"en\">This process\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">나선형으로 일어나,\u003c/span>\u003cspan class=\"en\">occurs in a spiral,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문제에 대한 한쪽 입장은\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">so \u003c/span>\u003cspan class=\"tgt\">that\u003c/span> one side of an issue\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상당한 주목을 받게 되고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ends \u003c/span>\u003cspan class=\"tgt\">up \u003c/span>\u003cspan class=\"tgt\">with\u003c/span> considerable publicity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 쪽 입장은\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">other \u003c/span>\u003cspan class=\"tgt\">side \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">거의 주목받지 않게 된다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">very \u003c/span>\u003cspan class=\"tgt\">little\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 과정은 나선형으로 일어나 문제에 대한 한쪽 입장은 상당한 주목을 받게 되고, 다른 쪽 입장은 거의 주목받지 않게 된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 침묵의 나선이 진행되는 구체적인 \u003cb class=\"key\">결과\u003c/b>를 묘사합니다. 다수 의견은 더욱 \u003cb class=\"key\">강화\u003c/b>되고 소수 의견은 점차 \u003cb class=\"key\">소외\u003c/b>되는 현상을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">결과의 부사절\u003c/span> : [문장], so that [주어] + [동사] : \"그 결과 ~하게 되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">결과적 표현\u003c/span> : end up with + [명사/형용사/분사] : \"결국 ~하게 되다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">병렬 구조와 생략\u003c/span> : one side [ends up with] ..., the other side [ends up] with ... : \"다른 쪽은 거의 없는 상태로 (끝나다)\"\u003c/div>\u003c/div>","segs":[{"n":20,"text":"This process, 이 과정은. occurs in a spiral, 나선형으로 일어나. so that one side of an issue, 문제에 대한 한쪽 입장은. ends up with considerable publicity, 상당한 주목을 받게 되고. and the other side, 다른 쪽 입장은. with very little, 거의 주목받지 않게 된다.. 이 문장 전체를 해석하면, 이 과정은 나선형으로 일어나 문제에 대한 한쪽 입장은 상당한 주목을 받게 되고, 다른 쪽 입장은 거의 주목받지 않게 된다.","hl":"m"},{"n":21,"text":"이 문장은 침묵의 나선 이론이 실제로 어떤 결과를 만들어내는지 보여주는 핵심적인 대목이에요. 한쪽의 의견만 점점 커지는 결과가 생기죠.","hl":"mn"},{"n":22,"text":"첫 번째로 so that은 이 과정의 결과를 나타내는 연결어예요. 두 번째로 end up with는 결국 어떤 상태에 이르게 된다는 뜻의 중요한 숙어입니다. 세 번째로 the other side 뒤에는 앞서 나온 동사구가 반복을 피하기 위해 생략된 형태라는 점을 꼭 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 6\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">일상생활에서,\u003c/span>\u003cspan class=\"en\">In everyday life,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 자신들의 의견들을 표현한다\u003c/span>\u003cspan class=\"en\">people express their opinions\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다양한 방식들로:\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">variety \u003c/span>\u003cspan class=\"tgt\">of \u003c/span>\u003cspan class=\"tgt\">ways\u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">:\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들은 그것들에 대해 말하고, 배지들을 달고,\u003c/span>\u003cspan class=\"en\">they talk about them, they wear buttons,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자동차에 범퍼 스티커들을 붙이고,\u003c/span>\u003cspan class=\"en\">they put bumper stickers on their cars,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">소셜 미디어에 자신들의 견해들을 게시한다.\u003c/span>\u003cspan class=\"en\">and they post their views on social media.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">일상생활에서 사람들은 다양한 방식들로 자신들의 의견들을 표현한다. 그들은 그것들에 대해 말하고, 배지들을 달고, 자동차에 범 퍼 스티커들을 붙이고, 소셜 미디어에 자신들의 견해 들을 게시한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이론적인 개념을 우리가 일상에서 흔히 볼 수 있는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">사례\u003c/b>로 연결합니다. 의견 표현의 \u003cb class=\"key\">다양한 \u003c/b>\u003cb class=\"key\">수단\u003c/b>들을 나열하여 독자의 이해를 돕습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">전치사구\u003c/span> : in a variety of + [복수명사] : \"다양한 방식으로\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">콜론(Colon)\u003c/span> : [일반적 진술] : [구체적 예시] : \"즉, 다시 말해\"\u003c/div>\u003c/div>","segs":[{"n":23,"text":"In everyday life, 일상생활에서. people express their opinions, 사람들은 자신들의 의견들을 표현한다. in a variety of ways, 다양한 방식들로:. they talk about them, they wear buttons, 그들은 그것들에 대해 말하고, 배지들을 달고. they put bumper stickers on their cars, 자동차에 범퍼 스티커들을 붙이고. and they post their views on social media, 소셜 미디어에 자신들의 견해들을 게시한다.. 이 문장 전체를 해석하면, 일상생활에서 사람들은 다양한 방식들로 자신들의 의견들을 표현한다. 그들은 그것들에 대해 말하고, 배지들을 달고, 자동차에 범 퍼 스티커들을 붙이고, 소셜 미디어에 자신들의 견해 들을 게시한다.","hl":"m"},{"n":24,"text":"앞서 설명한 이론이 우리 삶에서 실제로 어떻게 나타나는지 구체적인 행동들을 보여주고 있어요. 말하기부터 SNS까지 아주 다양하죠.","hl":"mn"},{"n":25,"text":"첫 번째로 in a variety of ways는 다양한 방법으로라는 뜻의 관용구예요. 두 번째로 콜론은 앞의 포괄적인 내용을 뒤에서 조목조목 나열해줄 때 사용하는 문장 부호랍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 6\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 이론에 따르면,\u003c/span>\u003cspan class=\"en\">According to this theory,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사람들은 더 ~하는 경향이 있다\u003c/span>\u003cspan class=\"en\">people are more apt to\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이런 종류의 행동들을 하는 (경향이)\u003c/span>\u003cspan class=\"en\">do these kinds of things\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들이 인식할 때\u003c/span>\u003cspan class=\"en\">when they \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">perceive \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">다른 사람들이 자신들의 의견들과 뜻을 같이한다고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">that\u003c/span> others share their opinions.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 이론에 따르면 사람들은 다른 사람들이 자신들의 의견들과 뜻을 같이한다고 인식할 때 이런 종류의 행동들을 더 많이 하는 경향이 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 언제 더 적극적으로 의견을 표현하는지에 대한 \u003cb class=\"key\">조건\u003c/b>을 명시합니다. 타인의 \u003cb class=\"key\">동조\u003c/b> 여부가 개인의 의견 표출에 결정적 \u003cb class=\"key\">영향\u003c/b>을 미친다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사절을 이끄는 접속사\u003c/span> : perceive [타동사] + that [접속사] + [완전한 문장] : \"~라고 인식하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">준동사 관용 표현\u003c/span> : be apt to + [동사원형] : \"~하기 쉽다, ~하는 경향이 있다\"\u003c/div>\u003c/div>","segs":[{"n":26,"text":"According to this theory, 이 이론에 따르면. people are more apt to, 사람들은 더 ~하는 경향이 있다. do these kinds of things, 이런 종류의 행동들을 하는 (경향이). when they perceive, 그들이 인식할 때. that others share their opinions, 다른 사람들이 자신들의 의견들과 뜻을 같이한다고. 이 문장 전체를 해석하면, 이 이론에 따르면 사람들은 다른 사람들이 자신들의 의견들과 뜻을 같이한다고 인식할 때 이런 종류의 행동들을 더 많이 하는 경향이 있다.","hl":"m"},{"n":27,"text":"이 문장은 침묵의 나선 이론의 핵심 심리를 설명해요. 내 편이 많다고 느낄 때만 사람들은 목소리를 낸다는 거죠.","hl":"mn"},{"n":28,"text":"첫 번째 포인트인 be apt to는 무엇을 하는 경향이 있다는 뜻으로 꼭 외워야 할 숙어예요. 두 번째로 perceive 뒤에 나오는 that은 무엇을 인식하는지 그 내용을 연결하는 접속사입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>노엘레 노이만은 선거 기간에 \u003cb class=\"key\">비대중적\u003c/b>이라고 생각되는 의견을 가진 사람들이 침묵하는 현상을 관찰했다.\u003c/li>\u003cli>이 현상은 자신의 의견이 다수의 지지를 받는다고 인식할 때만 \u003cb class=\"key\">의사 \u003c/b>\u003cb class=\"key\">표현\u003c/b>을 하기 때문에 발생한다.\u003c/li>\u003cli>의견 표명의 불균형은 나선형 구조를 형성하여 \u003cb class=\"key\">여론의 \u003c/b>\u003cb class=\"key\">양극화\u003c/b> 또는 한쪽의 독주를 초래한다.\u003c/li>\u003cli>사람들은 타인이 자신의 생각에 \u003cb class=\"key\">동의\u003c/b>한다고 느낄 때 더 적극적으로 다양한 매체를 통해 의견을 드러낸다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>The 'spiral of silence' occurs because individuals tend to voice their opinions when they feel they are in the majority but remain silent when they perceive themselves as the minority.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">자신의 의견이 \u003cb class=\"key\">대중적\u003c/b>이라고 믿을 때는 적극적으로 목소리를 내지만, \u003cb class=\"key\">소수 \u003c/b>\u003cb class=\"key\">의견\u003c/b>이라 판단될 때는 사회적 고립을 피해 침묵함으로써 특정 견해만 지배적으로 보이는 \u003cb class=\"key\">침묵의 \u003c/b>\u003cb class=\"key\">나선\u003c/b> 현상을 설명한다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":29,"text":"오늘 배운 침묵의 나선 이론, 어떠셨나요? 우리가 소셜 미디어에 의견을 올리는 사소한 행동 뒤에도 이런 사회 심리적 메커니즘이 숨어 있다는 게 놀랍지 않나요? 지문의 흐름과 핵심 단어들을 다시 한번 복습하면서, 여러분의 독해 실력을 쑥쑥 키워보길 바랍니다. 수고하셨어요!","hl":null}]}]});</script></body></html>
