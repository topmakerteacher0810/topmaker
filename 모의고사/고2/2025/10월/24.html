<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 24번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.lp-mn{font-size:15px;line-height:1.65;background:#FFF8E8;border:1px solid #F0D9A5;border-radius:10px;padding:9px 14px;margin-bottom:8px;color:#444}

.lp-ap .gn{color:var(--pk-t);font-weight:800}
.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}
.lp-hl{box-shadow:0 0 0 3px #7CCBC8,0 0 22px 4px rgba(14,138,140,.28)!important;border-radius:12px;transition:box-shadow .2s}
@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 24번","audioDir":"24_audio","preview":false,"count":42,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">24번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>Recharge Your Brain: The Power of Neurobic Midday Breaks\u003c/h1>\u003ch2>두뇌를 재충전하라: 뉴로빅 한낮 휴식의 힘\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>바쁜 일상 중 \u003cb class=\"key\">뉴로빅 \u003c/b>\u003cb class=\"key\">운동\u003c/b>을 활용한 전략적 휴식은 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">피로\u003c/b>를 막고 두뇌의 \u003cb class=\"key\">유연성\u003c/b>과 생산성을 증대시킨다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Strategic midday breaks incorporating neurobic exercises can prevent cognitive fatigue and enhance mental agility and productivity.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 2025년 10월 고2 모의고사 스물네 번째 지문을 함께 공부해보겠습니다. 이 글은 우리가 바쁜 일상 속에서 무심코 지나치는 한낮의 휴식이 얼마나 중요한지, 특히 뇌를 자극하는 Neurobic exercises가 우리 정신에 어떤 기적을 일으키는지 다루고 있어요. 요약하자면, 전략적인 휴식이 인지적 피로를 막고 사고의 유연성을 높여준다는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">뇌 과학에서는 뇌가 새로운 자극에 반응하여 스스로를 변화시키는 성질을 \u003cb class=\"key\">뇌 \u003c/b>\u003cb class=\"key\">가소성(Neuroplasticity)\u003c/b>이라고 부릅니다. 이 지문에 등장하는 \u003cb class=\"key\">뉴로빅(Neurobic)\u003c/b>은 신경세포인 뉴런(Neuron)과 에어로빅(Aerobics)의 합성어로, 평소 사용하지 않는 방식으로 뇌를 자극하는 훈련법입니다. 우리가 매일 같은 길로 등교하거나 늘 쓰는 손으로 밥을 먹는 것은 뇌를 '자동 항법 장치' 모드로 두는 것과 같습니다. 이는 마치 \u003cb class=\"key\">안 \u003c/b>\u003cb class=\"key\">쓰던 \u003c/b>\u003cb class=\"key\">근육\u003c/b>을 자극해 몸을 유연하게 만드는 스트레칭처럼, 익숙한 루틴을 깨뜨려 뇌의 잠자는 영역을 깨우는 원리입니다. 고등학생 여러분도 공부 중에 펜을 반대쪽 손으로 잡아보는 것만으로도 \u003cb class=\"key\">집중력 \u003c/b>\u003cb class=\"key\">회복\u003c/b>의 효과를 얻을 수 있습니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 전에 배경지식을 하나 알아둘까요? 뉴로빅이라는 말은 신경 세포인 Neuron과 에어로빅의 합성어예요. 우리 뇌는 쓰던 길만 계속 쓰려는 경향이 있는데, 이걸 깨뜨려주는 게 바로 뉴로빅입니다. 뇌 가소성이라는 원리에 따라 새로운 자극을 주면 뇌의 신경망이 더 튼튼해지거든요. 마치 우리가 안 쓰던 근육을 운동시켜서 몸을 유연하게 만드는 것과 똑같은 원리라고 생각하면 이해하기 쉽습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>휴식의 필요성\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>바쁜 하루 중 잠시 멈춰 에너지를 \u003cb class=\"key\">재충전\u003c/b>하는 상상을 유도하며, 흔히 \u003cb class=\"key\">과소평가\u003c/b>되는 한낮 휴식의 중요성을 강조합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>뉴로빅 운동의 제안\u003csmall>주장 · 문장 3–5\u003c/small>\u003c/h4>\u003cp>일상에서 벗어나 뇌를 자극하는 \u003cb class=\"key\">뉴로빅 \u003c/b>\u003cb class=\"key\">운동\u003c/b>이 인지적 피로를 예방하고 두뇌를 \u003cb class=\"key\">민첩한\u003c/b> 상태로 유지해 준다고 제안합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>전략적 휴식의 효과\u003csmall>근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>이러한 전략적 멈춤이 정신적 \u003cb class=\"key\">오아시스\u003c/b> 역할을 하여, 인지 능력을 증대시키고 오후의 집중력을 \u003cb class=\"key\">보장\u003c/b>해 줍니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>구체적인 실천 방법\u003csmall>예시 · 문장 9–10\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">주되지 \u003c/b>\u003cb class=\"key\">않은 \u003c/b>\u003cb class=\"key\">손\u003c/b>을 사용하는 것과 같은 간단한 변화가 사용되지 않던 \u003cb class=\"key\">경로를 \u003c/b>\u003cb class=\"key\">활성화\u003c/b>하여 사고의 유연성을 높인다는 구체적 사례를 제시합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 휴식의 필요성에서 시작해 뉴로빅 운동이라는 구체적인 해결책과 그 효과, 그리고 실천 방법 순으로 이어집니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 바쁜 하루 중 잠시 멈춰 에너지를 recharge하는 상황을 상상해보라고 하죠. 하지만 안타깝게도 이런 midday break의 힘은 보통 underestimated, 즉 과소평가되는 경우가 많다고 짚어줍니다.","hl":"f0"},{"n":5,"text":"세 번째부터 다섯 번째 문장이 이 글의 핵심입니다. 일상에서 벗어나 뇌를 stimulate하도록 설계된 활동을 하면 인지적 피로를 막고 productivity를 높일 수 있다고 해요. 여기서 Neurobic exercises가 등장하는데, 이게 뇌를 agile하고 alert하게 유지해준다고 설명합니다.","hl":"f1"},{"n":6,"text":"여섯 번째부터 여덟 번째 문장은 그 효과를 더 자세히 설명해요. 이런 운동이 정신적인 oasis가 되어 오후의 도전을 준비하게 해준다는 거죠. 단순히 쉬는 게 아니라 cognitive capabilities를 증대시켜 집중력을 sharp하게 유지해주는 아주 strategic pause라고 강조합니다.","hl":"f2"},{"n":7,"text":"마지막 아홉 번째와 열 번째 문장에서는 구체적인 방법을 알려줍니다. 평소 안 쓰는 손, 즉 non-dominant hand를 사용해 보라는 거예요. 이런 simple switch가 평소 쓰지 않던 뇌의 pathway를 활성화해서 사고의 flexibility를 키워준다는 결론으로 마무리됩니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">주장-근거\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 3번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">한낮 휴식의 중요성을 언급한 후, 세 번째 문장에서 \u003cb class=\"key\">뉴로빅 \u003c/b>\u003cb class=\"key\">운동\u003c/b>이라는 구체적인 해결책을 통해 인지적 피로를 막을 수 있다는 핵심 주장을 펼칩니다. 이후 이 활동의 장점을 나열하다가 마지막 문장에서 다시 한번 \u003cb class=\"key\">뇌 \u003c/b>\u003cb class=\"key\">자극\u003c/b>을 통한 사고의 유연성 확보라는 결론으로 마무리하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>When you break away from routine (3)\u003c/b>\u003cspan>조건 및 핵심 주장 시작\u003c/span>\u003cb>Neurobic exercises (4)\u003c/b>\u003cspan>구체적인 해결책 제시\u003c/span>\u003cb>This strategic pause (7)\u003c/b>\u003cspan>개념 재정의 및 강조\u003c/span>\u003cb>Start with (9)\u003c/b>\u003cspan>구체적 실천 예시 도입\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">midday break\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Neurobic exercises\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">mental oasis\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">strategic pause\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">using your non-dominant hand\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">simple switch\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":8,"text":"이 지문은 전형적인 주장과 근거의 구조를 따르고 있어요. 특히 세 번째 문장에서 핵심 주장을 던지고 마지막에 다시 한번 강조하는 양괄식 구성을 취하고 있습니다.","hl":"ty"},{"n":9,"text":"문장 연결 고리를 볼까요? 네 번째 문장의 such breaks는 앞 문장의 휴식을 가리키고, 여섯 번째 문장의 These exercises는 뉴로빅 운동을 받아줍니다. 일곱 번째 문장의 This strategic pause 역시 앞에서 말한 활동들을 요약해주는 아주 중요한 신호어니까 꼭 챙겨두세요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>pause\u003c/b>\u003cem>동사\u003c/em>\u003cspan>잠시 멈추다\u003c/span>\u003c/div>\u003cdiv>\u003cb>refresh\u003c/b>\u003cem>동사\u003c/em>\u003cspan>새롭게 하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>recharge\u003c/b>\u003cem>동사\u003c/em>\u003cspan>재충전하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>underestimated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>과소평가된\u003c/span>\u003c/div>\u003cdiv>\u003cb>break away from\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~에서 벗어나다\u003c/span>\u003c/div>\u003cdiv>\u003cb>routine\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일상\u003c/span>\u003c/div>\u003cdiv>\u003cb>stimulate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자극하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>cognitive\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>인지적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>tiredness\u003c/b>\u003cem>명사\u003c/em>\u003cspan>피로\u003c/span>\u003c/div>\u003cdiv>\u003cb>enhance\u003c/b>\u003cem>동사\u003c/em>\u003cspan>높이다, 향상시키다\u003c/span>\u003c/div>\u003cdiv>\u003cb>productivity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>생산성\u003c/span>\u003c/div>\u003cdiv>\u003cb>Neurobic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>뉴로빅의(신경 자극의)\u003c/span>\u003c/div>\u003cdiv>\u003cb>effective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>효과적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>agile\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>민첩한\u003c/span>\u003c/div>\u003cdiv>\u003cb>alert\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>기민한\u003c/span>\u003c/div>\u003cdiv>\u003cb>oasis\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오아시스\u003c/span>\u003c/div>\u003cdiv>\u003cb>strategic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전략적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>capabilities\u003c/b>\u003cem>명사\u003c/em>\u003cspan>능력\u003c/span>\u003c/div>\u003cdiv>\u003cb>ensure\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보장하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>sharp\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>또렷한, 날카로운\u003c/span>\u003c/div>\u003cdiv>\u003cb>experimenting\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시도, 실험\u003c/span>\u003c/div>\u003cdiv>\u003cb>work wonders\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>기적 같은 효과를 낳다\u003c/span>\u003c/div>\u003cdiv>\u003cb>non-dominant\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>주되지 않은\u003c/span>\u003c/div>\u003cdiv>\u003cb>activating\u003c/b>\u003cem>동사\u003c/em>\u003cspan>활성화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pathway\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경로\u003c/span>\u003c/div>\u003cdiv>\u003cb>typically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>전형적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>engaged\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>관여된, 사용된\u003c/span>\u003c/div>\u003cdiv>\u003cb>flexibility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>유연성\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어 몇 개만 볼게요. agile은 민첩하다는 뜻인데 뇌가 빠릿빠릿하게 돌아가는 상태를 말해요. 그리고 non-dominant hand는 오른손잡이에게는 왼손을 의미하는 표현으로 지문에서 아주 중요한 예시로 쓰였습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">enhance\u003c/b>\u003cspan class=\"m\">높이다, 향상시키다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">improve\u003c/span>\u003cspan class=\"s\">boost\u003c/span>\u003cspan class=\"s\">elevate\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">diminish\u003c/span>\u003cspan class=\"a\">reduce\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">agile\u003c/b>\u003cspan class=\"m\">민첩한, 기민한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">nimble\u003c/span>\u003cspan class=\"s\">quick\u003c/span>\u003cspan class=\"s\">sharp\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">clumsy\u003c/span>\u003cspan class=\"a\">slow\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">underestimated\u003c/b>\u003cspan class=\"m\">과소평가된\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">undervalued\u003c/span>\u003cspan class=\"s\">overlooked\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">overestimated\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">stimulate\u003c/b>\u003cspan class=\"m\">자극하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">activate\u003c/span>\u003cspan class=\"s\">invigorate\u003c/span>\u003cspan class=\"s\">provoke\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">dampen\u003c/span>\u003cspan class=\"a\">suppress\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">flexibility\u003c/b>\u003cspan class=\"m\">유연성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">adaptability\u003c/span>\u003cspan class=\"s\">elasticity\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">rigidity\u003c/span>\u003cspan class=\"a\">stiffness\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어 정리해볼까요? 향상시키다라는 뜻의 enhance는 boost나 improve로 바꿔 쓸 수 있습니다. 민첩한이라는 뜻의 agile은 sharp나 nimble과 비슷하고요. 반대로 유연성을 뜻하는 flexibility의 반대말은 rigidity, 즉 딱딱함이나 경직성이라는 단어를 기억해두면 좋습니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">상상해 보라 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Imagine \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">바쁜 하루의 중간에 잠시 멈추는 것을, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">pausing\u003c/span> in the middle of a busy day,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">순간을 가지는 것을 \u003c/span>\u003cspan class=\"en\">taking a moment\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정신을 새롭게 하고 \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">refresh \u003c/span>\u003cspan class=\"tgt\">your \u003c/span>\u003cspan class=\"tgt\">mind \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">에너지를 재충전하는.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">recharge\u003c/span> your energy.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">바쁜 하루의 중간에 잠시 멈춰서, 정신을 새롭게 하고 에너지를 재충전하는 순간을 가지는 것을 상상해 보라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 독자에게 바쁜 일상 속 \u003cb class=\"key\">휴식\u003c/b>의 장면을 상상하게 함으로써 글의 주제를 도입합니다. \u003cb class=\"key\">명령문\u003c/b>을 사용하여 독자의 참여를 유도하며, 휴식의 목적인 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">재충전\u003c/b>을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동명사를 목적어로 취하는 동사\u003c/span> : Imagine [타동사] + [pausing (동명사/목적어)] : \"멈추는 것을 상상해 보라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">to부정사의 형용사적 용법과 병렬 구조\u003c/span> : a moment [명사] + [to refresh (to부정사/형용사적) + and + recharge (to 생략 병렬)] : \"정신을 새롭게 하고 재충전하는 순간\"\u003c/div>\u003c/div>","segs":[{"n":12,"text":"Imagine, 상상해 보라. pausing in the middle of a busy day, 바쁜 하루의 중간에 잠시 멈추는 것을. taking a moment, 순간을 가지는 것을. to refresh your mind, 정신을 새롭게 하고. and recharge your energy, 에너지를 재충전하는.. 이 문장 전체를 해석하면, 바쁜 하루의 중간에 잠시 멈춰서, 정신을 새롭게 하고 에너지를 재충전하는 순간을 가지는 것을 상상해 보라.","hl":"m"},{"n":13,"text":"여러분, 이 문장은 우리에게 잠시 멈추는 휴식의 장면을 그려보게 하면서 시작하고 있어요. 바쁜 일상에서 정신을 새롭게 하고 에너지를 채우는 이런 재충전의 시간이 왜 필요한지 생각해보게 하죠.","hl":"mn"},{"n":14,"text":"첫 번째로 주목할 부분은 Imagine pausing입니다. Imagine은 뒤에 동명사를 목적어로 써서 무엇을 하는 것을 상상하다라는 의미를 만들어요. 두 번째는 to refresh와 recharge가 병렬 구조를 이루고 있다는 점입니다. 둘 다 앞의 a moment를 꾸며주는 형용사적 용법으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 한낮의 휴식의 힘은 \u003c/span>\u003cspan class=\"en\">This power of a midday break\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">종종 과소 평가된다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">is \u003c/span>\u003cspan class=\"tgt\">often \u003c/span>\u003cspan class=\"tgt\">underestimated\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 한낮의 휴식의 힘은 종종 과소 평가된다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 사람들이 흔히 간과하는 \u003cb class=\"key\">휴식의 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 지적하며 글의 본격적인 논의를 시작합니다. 휴식이 단순히 노는 것이 아니라 강력한 \u003cb class=\"key\">힘\u003c/b>을 가지고 있음을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : [be동사(is)] + often [부사] + [underestimated (과거분사)] : \"종종 과소 평가된다\"\u003c/div>\u003c/div>","segs":[{"n":15,"text":"This power of a midday break, 이러한 한낮의 휴식의 힘은. is often underestimated, 종종 과소 평가된다.. 이 문장 전체를 해석하면, 이러한 한낮의 휴식의 힘은 종종 과소 평가된다.","hl":"m"},{"n":16,"text":"한낮에 잠깐 쉬는 게 얼마나 큰 힘이 있는지 우리는 자주 잊고 살아요. 작가는 바로 그 점을 꼬집으면서 휴식의 진정한 가치를 다시 강조하고 싶은 거예요.","hl":"mn"},{"n":17,"text":"여기서 is often underestimated 부분을 보세요. 휴식의 힘이라는 주어는 평가를 하는 주체가 아니라 평가를 받는 대상이죠. 그래서 be동사와 과거분사를 결합한 수동태 형식을 쓴 것이 핵심입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분이 일상에서 벗어날 때, \u003c/span>\u003cspan class=\"en\">When you break away from routine,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">특히 활동들을 가지고 \u003c/span>\u003cspan class=\"en\">especially with activities\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 두뇌를 자극하도록 설계된, \u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">designed \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">stimulate\u003c/span> your brain,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분은 인지적 피로를 예방하고 \u003c/span>\u003cspan class=\"en\">you prevent cognitive tiredness\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">생산성을 높인다 \u003c/span>\u003cspan class=\"en\">and enhance productivity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">남은 하루 동안의.\u003c/span>\u003cspan class=\"en\">for the rest of the day.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">여러분이 특히 여러분의 두뇌를 자극하도록 설계된 활동들을 가지고 일상에서 벗어날 때 여러분은 인지적 피로를 예방하고 남은 하루 동안의 생산성을 높인다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 휴식의 구체적인 \u003cb class=\"key\">방법과 \u003c/b>\u003cb class=\"key\">효과\u003c/b>를 제시합니다. 특히 \u003cb class=\"key\">두뇌 \u003c/b>\u003cb class=\"key\">자극\u003c/b> 활동을 곁들인 휴식이 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">피로\u003c/b>를 막고 업무 효율을 높여준다는 원리를 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : activities [명사] + [designed (과거분사)] + to stimulate [목적] : \"자극하기 위해 설계된 활동들\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : you [주어] + [prevent (동사1)] + ... + and + [enhance (동사2)] : \"예방하고 ... 높인다\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"When you break away from routine, 여러분이 "lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">형용사구의 삽입\u003c/span> : 명사(주어) [― 형용사구 ―] + 동사 : \"간단하지만 효과적인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주어-동사 수 일치\u003c/span> : Neurobic exercises [복수 주어] + are [복수 동사] : \"~이다 (~에 알맞다)\"\u003c/div>\u003c/div>","segs":[{"n":21,"text":"Neurobic exercises, 뉴로빅 운동이. ― simple yet effective ―, ― 간단하지만 효과적인 ―. are perfect, 꼭 알맞다. for such breaks, 그러한 휴식 시간에. 이 문장 전체를 해석하면, 간단하지만 효과적인 뉴로빅 운동이 그러한 휴식 시간에 꼭 알맞다.","hl":"m"},{"n":22,"text":"뉴로빅 운동은 복잡하지 않으면서도 효과가 아주 좋아서 잠깐의 휴식 시간에 활용하기에 최적이라는 내용이에요. 여기서 뉴로빅은 뇌 신경을 자극하는 일종의 두뇌 체조라고 이해하면 됩니다.","hl":"mn"},{"n":23,"text":"첫 번째로 문장 중간에 대시 기호가 쓰인 부분을 보세요. 주어인 Neurobic exercises를 보충 설명해 주는 형용사구가 삽입되어 있습니다. 두 번째로 동사 are는 멀리 떨어져 있는 복수 주어 exercises에 수 일치를 시켜준 형태예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 겨냥하여\u003c/span>\u003cspan class=\"en\">They target\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 뇌의 다른 영역들을\u003c/span>\u003cspan class=\"en\">different areas of your brain,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 유지한다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">keeping\u003c/span> it\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기민하고 민첩하게\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">agile \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">alert\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그것들은 여러분의 뇌의 다른 영역들을 겨냥하여, 그것을 기민하고 민첩하게 유지한다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뉴로빅 운동이 구체적으로 뇌의 어떤 작용을 하는지 설명하며, 뇌의 여러 부위를 자극해 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">활성도\u003c/b>를 높여준다는 원리를 보여줍니다. 이를 통해 뇌가 \u003cb class=\"key\">최상의 \u003c/b>\u003cb class=\"key\">상태\u003c/b>를 유지하게 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사구문의 결과/부대상황\u003c/span> : 동사1 + 목적어, [v-ing (분사구문)] : \"유지하며 (유지한다)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">5형식 동사의 목적격 보어\u003c/span> : keep + it [목적어] + agile and alert [형용사 보어] : \"기민하고 민첩하게\"\u003c/div>\u003c/div>","segs":[{"n":24,"text":"They target, 그것들은 겨냥하여. different areas of your brain, 여러분의 뇌의 다른 영역들을. keeping it, 그것을 유지한다. agile and alert, 기민하고 민첩하게. 이 문장 전체를 해석하면, 그것들은 여러분의 뇌의 다른 영역들을 겨냥하여, 그것을 기민하고 민첩하게 유지한다.","hl":"m"},{"n":25,"text":"이 운동들이 뇌의 다양한 부위를 골고루 자극해 준다는 뜻이에요. 그렇게 하면 뇌가 멍하지 않고 아주 빠릿빠릿하고 예리하게 깨어 있게 된다는 원리를 설명하고 있습니다.","hl":"mn"},{"n":26,"text":"첫 번째 포인트는 콤마 뒤에 나온 keeping입니다. 분사구문으로서 앞의 동작에 이어지는 결과를 나타내죠. 두 번째로 목적격 보어 자리에 쓰인 agile and alert를 보세요. 상태를 설명하기 때문에 부사가 아닌 형용사를 써야 한다는 점이 시험에 자주 나옵니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 운동들은 만들어 준다\u003c/span>\u003cspan class=\"en\">These exercises create\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">정신적 오아시스를\u003c/span>\u003cspan class=\"en\">a mental oasis\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분을 기운 나게 하고 준비시켜 주는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">refreshes \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">prepares\u003c/span> you\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오후의 힘든 일들을 위해\u003c/span>\u003cspan class=\"en\">for the afternoon's challenges.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이러한 운동들은 오후의 힘든 일 들을 위해 여러분을 기운 나게 하고 준비시켜 주는 정신적 오아시스를 만들어 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뉴로빅 운동을 \u003cb class=\"key\">정신적 \u003c/b>\u003cb class=\"key\">오아시스\u003c/b>라는 비유적 표현을 통해 묘사하며, 휴식 후 닥쳐올 오후의 업무나 학습에 대한 \u003cb class=\"key\">대처 \u003c/b>\u003cb class=\"key\">능력\u003c/b>을 높여준다는 점을 강조합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a mental oasis [선행사] + that [관계사] + 동사 : \"기운 나게 하고 준비시켜 주는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사에 의한 병렬 구조\u003c/span> : that [주어 역할] + refreshes [동사1] + and + prepares [동사2] : \"기운 나게 하고 준비시켜 주는\"\u003c/div>\u003c/div>","segs":[{"n":27,"text":"These exercises create, 이러한 운동들은 만들어 준다. a mental oasis, 정신적 오아시스를. that refreshes and prepares you, 여러분을 기운 나게 하고 준비시켜 주는. for the afternoon's challenges, 오후의 힘든 일들을 위해. 이 문장 전체를 해석하면, 이러한 운동들은 오후의 힘든 일 들을 위해 여러분을 기운 나게 하고 준비시켜 주는 정신적 오아시스를 만들어 준다.","hl":"m"},{"n":28,"text":"뉴로빅 운동이 마치 사막의 오아시스처럼 우리 정신을 맑게 해준다는 비유예요. 이 짧은 자극 덕분에 우리는 오후에 닥칠 어려운 일들도 거뜬히 해낼 준비를 마칠 수 있게 됩니다.","hl":"mn"},{"n":29,"text":"첫 번째로 주목할 부분은 주격 관계대명사 that입니다. 선행사인 oasis를 꾸며주는 형용사절을 이끌고 있어요. 두 번째는 refreshes와 prepares의 병렬 구조입니다. 관계대명사 절 안에서 두 동사가 and로 연결되어 똑같이 단수형으로 쓰였습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 전략적인 멈춤은\u003c/span>\u003cspan class=\"en\">This strategic pause\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순한 휴식이 아니며,\u003c/span>\u003cspan class=\"en\">is \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">not \u003c/span>\u003cspan class=\"tgt\">just \u003c/span>\u003cspan class=\"tgt\">a \u003c/span>\u003cspan class=\"tgt\">break\u003c/span>;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 여러분의 인지 능력을 증대시키고,\u003c/span>\u003cspan class=\"en\">it boosts your cognitive capabilities,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 정신이\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ensuring\u003c/span> your mind\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또렷하고 집중된 상태가 유지되도록 보장해 준다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">remains \u003c/span>\u003cspan class=\"tgt\">sharp \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">focused\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 전략적인 멈춤은 단순한 휴식이 아니며, 그것은 여러분의 인지 능력을 증대시키고 여러분의 정신이 또렷하고 집중된 상태가 유지되도록 보장해 준다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 휴식을 단순한 쉼이 아닌 뇌 기능을 최적화하는 \u003cb class=\"key\">전략적 \u003c/b>\u003cb class=\"key\">접근\u003c/b>으로 정의합니다. 업무 효율을 높이기 위해 정신을 \u003cb class=\"key\">날카롭게 \u003c/b>\u003cb class=\"key\">유지\u003c/b>시키는 필수적인 장치임을 강조하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : not just [A] (but also B) : \"단순한 휴식이 아닌\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">\u003c/span> : [분사구문] (,) + [v-ing] : \"보장해 주며\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">\u003c/span> : remain [상태유지동사] + [형용사 보어] : \"또렷하고 집중된 상태가 유지되다\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"This strategic pause, 이 전략적인 멈춤은. is not just a break, 단순한 휴식이 아니며. it boosts your cognitive capabilities, 그것은 여러분의 인지 능력을 증대시키고. ensuring your mind, 여러분의 정신이. remains sharp and focused, 또렷하고 집중된 상태가 유지되도록 보장해 준다.. 이 문장 전체를 해석하면, 이 전략적인 멈춤은 단순한 휴식이 아니며, 그것은 여러분의 인지 능력을 증대시키고 여러분의 정신이 또렷하고 집중된 상태가 유지되도록 보장해 준다.","hl":"m"},{"n":31,"text":"일곱 번째 문장은 우리가 가지는 이 멈춤이 그냥 노는 게 아니라 뇌를 더 똑똑하게 쓰기 위한 전략적 접근이라는 점을 짚어주고 있어요. 정신을 날카롭게 유지해서 오후 업무에 대비하게 해 준다는 거죠.","hl":"mn"},{"n":32,"text":"첫 번째 어법 포인트는 not just A 구문인데, A뿐만 아니라 뒤에 나오는 내용까지 강조하는 상관접속사 표현입니다. 두 번째로 쉼표 뒤의 ensuring은 분사구문으로 앞 문장의 행동이 어떤 결과를 가져오는지 보충 설명해요. 세 번째로 remain 뒤에는 sharp와 focused 같은 형용사가 보어로 와서 정신의 상태를 표현하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">짧게\u003c/span>\u003cspan class=\"en\">Even briefly\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뉴로빅 운동들을 시도하는 것만으로도\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">experimenting\u003c/span> with neurobic exercises\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">기적 같은 효과를 낳을 수 있다\u003c/span>\u003cspan class=\"en\">can \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">work \u003c/span>\u003cspan class=\"tgt\">wonders\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 인지 상태에\u003c/span>\u003cspan class=\"en\">for your cognitive state\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">점심시간 동안.\u003c/span>\u003cspan class=\"en\">during lunch.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">짧게 뉴로빅 운동들을 시도하는 것만으로도 점심시간 동안 여러분의 인지 상태에 기적 같은 효과를 낳을 수 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뉴로빅 운동이 긴 시간을 필요로 하지 않으며 \u003cb class=\"key\">점심시간\u003c/b> 같은 짧은 틈에도 충분히 \u003cb class=\"key\">가치\u003c/b>가 있음을 보여줍니다. 작은 \u003cb class=\"key\">시도\u003c/b>가 뇌 건강에 큰 변화를 줄 수 있다는 메시지입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : [동명사 주어] v-ing : \"시도하는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">\u003c/span> : work wonders [관용구] : \"기적 같은 효과를 낳다\"\u003c/div>\u003c/div>","segs":[{"n":33,"text":"Even briefly, 짧게. experimenting with neurobic exercises, 뉴로빅 운동들을 시도하는 것만으로도. can work wonders, 기적 같은 효과를 낳을 수 있다. for your cognitive state, 여러분의 인지 상태에. during lunch, 점심시간 동안.. 이 문장 전체를 해석하면, 짧게 뉴로빅 운동들을 시도하는 것만으로도 점심시간 동안 여러분의 인지 상태에 기적 같은 효과를 낳을 수 있다.","hl":"m"},{"n":34,"text":"여덟 번째 문장에서는 뉴로빅 운동이 거창한 게 아니라고 말해요. 점심시간에 아주 잠깐만 시도해 봐도 우리 머리 상태에 기적 같은 변화가 일어날 수 있다는 거죠.","hl":"mn"},{"n":35,"text":"첫 번째로 주어 자리에 온 experimenting은 동명사로 시도하는 것이라는 의미를 만듭니다. 두 번째 포인트인 work wonders는 통째로 외워두면 좋은데, 정말 놀라운 효과가 있다는 강력한 표현이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 10\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">시작하라 여러분의 주되지 않은 손을 사용하는 것으로 일상적인 과업들을 위해 글쓰기 또는 식사와 같은.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Start\u003c/span> with \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">using\u003c/span> your non­dominant hand for routine tasks like writing or eating.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">글쓰기 또는 식사와 같은 일상적인 과업들을 위해 여러분의 주되지 않은 손을 사용하는 것으로 시작하라.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뉴로빅 운동의 \u003cb class=\"key\">구체적인 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 들어줍니다. 평소 쓰지 않는 손을 사용하는 것만으로도 뇌에 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">자극\u003c/b>을 주어 \u003cb class=\"key\">사고의 \u003c/b>\u003cb class=\"key\">유연성\u003c/b>을 기를 수 있음을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">\u003c/span> : [명령문] 동사원형 : \"시작하라\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">\u003c/span> : with [전치사] + using [동명사/목적어] : \"사용하는 것\"\u003c/div>\u003c/div>","segs":[{"n":36,"text":"Start with, 시작하라. using your non-dominant hand, 여러분의 주되지 않은 손을 사용하는 것으로. for routine tasks, 일상적인 과업들을 위해. like writing or eating, 글쓰기 또는 식사와 같은.. 이 문장 전체를 해석하면, 글쓰기 또는 식사와 같은 일상적인 과업들을 위해 여러분의 주되지 않은 손을 사용하는 것으로 시작하라.","hl":"m"},{"n":37,"text":"아홉 번째 문장은 구체적으로 뭘 해야 할지 알려줍니다. 밥 먹거나 글 쓸 때 평소 안 쓰던 손을 써보라는 건데, 이게 바로 뇌를 자극하는 아주 쉬운 방법인 거죠.","hl":"mn"},{"n":38,"text":"첫 번째로 문장이 Start라는 동사원형으로 시작하는 명령문 형식을 취하고 있습니다. 독자에게 실천해 보라고 권유하는 거죠. 두 번째로 전치사 with 뒤에 using이라는 동명사가 와서 구체적인 방법의 내용을 채워주고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 10 / 10\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이 간단한 전환이\u003c/span>\u003cspan class=\"en\">This simple switch\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러분의 뇌를 자극하여,\u003c/span>\u003cspan class=\"en\">challenges your brain,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경로들을 활성화시키고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">activating\u003c/span> pathways\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">전형적으로 사용되지 않는\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">aren't \u003c/span>\u003cspan class=\"tgt\">typically \u003c/span>\u003cspan class=\"tgt\">engaged\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 큰 유연성을 촉진시킨다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">promoting\u003c/span> greater flexibility\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사고에서의\u003c/span>\u003cspan class=\"en\">in thinking.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">이 간단한 전환이 여러분의 뇌를 자극하여, 전형적으로 사용되지 않는 경로들을 활성화시키고 사고에서의 더 큰 유연성을 촉진시킨다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 이 문장은 뉴로빅 연습의 구체적 사례인 '안 쓰는 손 사용하기'가 뇌에 어떤 실질적 변화를 주는지 설명합니다. 익숙하지 않은 자극이 잠들어 있던 \u003cb class=\"key\">신경 \u003c/b>\u003cb class=\"key\">경로\u003c/b>를 깨워 사고의 \u003cb class=\"key\">유연성\u003c/b>을 높이는 메커니즘을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">현재분사의 결과적 용법\u003c/span> : challenges [동사] ..., [v-ing (분사구문)] : \"활성화시키고\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">주격 관계대명사절\u003c/span> : pathways [선행사] + that [주격 관계대명사] + aren't engaged [수동태] : \"전형적으로 사용되지 않는\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">현재분사의 병렬 구조\u003c/span> : [activating ~] + and + [promoting ~] : \"촉진시킨다\"\u003c/div>\u003c/div>","segs":[{"n":39,"text":"This simple switch, 이 간단한 전환이. challenges your brain, 여러분의 뇌를 자극하여. activating pathways, 경로들을 활성화시키고. that aren't typically engaged, 전형적으로 사용되지 않는. and promoting greater flexibility, 더 큰 유연성을 촉진시킨다. in thinking, 사고에서의. 이 문장 전체를 해석하면, 이 간단한 전환이 여러분의 뇌를 자극하여, 전형적으로 사용되지 않는 경로들을 활성화시키고 사고에서의 더 큰 유연성을 촉진시킨다.","hl":"m"},{"n":40,"text":"이 문장은 안 쓰는 손을 사용하는 것과 같은 작은 변화가 우리 뇌에 어떤 영향을 미치는지 보여줍니다. 평소 사용하지 않던 신경 회로를 깨워서 우리의 사고를 더 유연하게 만들어준다는 점이 이 글의 핵심이에요.","hl":"mn"},{"n":41,"text":"첫 번째로 activating은 주절의 동작 뒤에 자연스럽게 이어지는 결과를 나타내는 분사구문입니다. 두 번째로 that이 이끄는 부분은 앞의 명사를 꾸며주는 관계대명사절로, 수동태를 써서 평소에 사용되지 않던 경로라는 점을 강조하고 있죠. 세 번째로 접속사 and 뒤에 나온 promoting은 앞에 있는 activating과 나란히 연결되어 뇌의 긍정적인 변화를 추가로 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>한낮의 짧은 휴식은 생산성을 높이는 데 필수적이지만 자주 \u003cb class=\"key\">과소평가\u003c/b>되곤 한다.\u003c/li>\u003cli>\u003cb class=\"key\">뉴로빅 \u003c/b>\u003cb class=\"key\">운동\u003c/b>은 뇌의 평소 안 쓰는 부위를 자극하여 인지적 피로를 방지한다.\u003c/li>\u003cli>전략적 멈춤은 정신적 오아시스처럼 작용해 인지 능력과 \u003cb class=\"key\">집중력\u003c/b>을 증대시킨다.\u003c/li>\u003cli>안 쓰는 손을 사용하는 등의 \u003cb class=\"key\">작은 \u003c/b>\u003cb class=\"key\">변화\u003c/b>가 뇌 경로를 활성화해 사고의 유연성을 키운다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Strategic midday breaks incorporating neurobic exercises can prevent cognitive fatigue and enhance mental agility and productivity.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">바쁜 일상 중 \u003cb class=\"key\">뉴로빅 \u003c/b>\u003cb class=\"key\">운동\u003c/b>을 활용한 전략적 휴식은 \u003cb class=\"key\">인지적 \u003c/b>\u003cb class=\"key\">피로\u003c/b>를 막고 두뇌의 \u003cb class=\"key\">유연성\u003c/b>과 생산성을 증대시킨다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":42,"text":"오늘 배운 내용을 정리하자면, 오후에 머리가 멍할 때 무작정 버티지 말고 뉴로빅 운동 같은 전략적 휴식을 취하라는 것입니다. 여러분도 지금 당장 펜을 반대쪽 손으로 쥐어보는 건 어떨까요? 작은 시도가 여러분의 인지 상태에 큰 기적을 불러올 거예요. 고생 많으셨습니다!","hl":null}]}]});</script></body></html>
