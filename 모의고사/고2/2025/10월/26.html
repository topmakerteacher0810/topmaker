<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 26번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

.lp-ko{font-size:16px;font-weight:700;background:var(--pk-ll);border-radius:10px;padding:9px 14px;margin-bottom:8px}

.lp-fin ul{margin:0 0 12px;padding-left:20px;font-size:16px;line-height:1.75}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 26번","audioDir":"26_audio","preview":false,"count":37,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">26번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>Nina Simone: A Harmonious Fight Against Racial Discrimination\u003c/h1>\u003ch2>니나 시몬: 인종 차별에 맞선 조화로운 투쟁\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>음악적 재능을 타고났으나 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">차별\u003c/b>의 벽에 부딪혔던 Nina Simone이 예명으로 활동하며 \u003cb class=\"key\">인권 \u003c/b>\u003cb class=\"key\">운동\u003c/b>과 저항 음악에 헌신한 일대기를 다룬 글입니다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Eunice Kathleen Waymon, known as Nina Simone, overcame racial prejudice to become a legendary musician and a passionate civil rights activist.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 2025년 10월 고2 모의고사 스물여섯 번째 지문을 함께 공부해 보겠습니다. 이 글은 전설적인 음악가이자 인권 운동가였던 Nina Simone의 삶을 다루고 있어요. 차별이라는 거대한 벽 앞에서 그녀가 어떻게 음악으로 자신의 길을 개척했는지 그 놀라운 일대기를 요약과 요지를 중심으로 살펴보겠습니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">Nina Simone의 본명은 Eunice Kathleen Waymon으로, 20세기 미국의 극심한 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">차별(racial \u003c/b>\u003cb class=\"key\">discrimination)\u003c/b> 시대를 관통하며 살았던 예술가입니다. 당시 미국 사회에는 흑인과 백인을 분리하고 차별하는 \u003cb class=\"key\">분리 \u003c/b>\u003cb class=\"key\">정책(segregation)\u003c/b>이 공공연하게 존재했으며, 이는 예술과 교육의 기회마저 박탈했습니다. 마치 실력이 뛰어난 요리사가 단지 특정 출신이라는 이유로 식당 취업을 거절당하는 것과 같은 불공정을 그녀는 매 순간 마주해야 했습니다. 그녀는 이러한 사회적 모순에 맞서 \u003cb class=\"key\">시민권 \u003c/b>\u003cb class=\"key\">운동(Civil \u003c/b>\u003cb class=\"key\">Rights \u003c/b>\u003cb class=\"key\">Movement)\u003c/b>에 투신하며 자신의 음악을 투쟁의 도구로 사용했습니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 전에 당시 시대 배경을 조금 알아볼까요? Nina Simone이 활동하던 시기 미국은 흑인과 백인을 엄격히 구분하는 인종 차별이 매우 심했습니다. 교육, 예술, 심지어 공연장 좌석까지도 인종에 따라 차별을 받았죠. 이런 불합리한 사회 분위기 속에서 그녀가 겪었을 분노와 좌절이 어떻게 인권 운동이라는 행동으로 이어졌는지 생각하며 지문을 읽으면 훨씬 깊이 있게 이해할 수 있습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>출생과 재능\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>미국의 음악가이자 인권 운동가인 \u003cb class=\"key\">Eunice \u003c/b>\u003cb class=\"key\">Kathleen \u003c/b>\u003cb class=\"key\">Waymon\u003c/b>을 소개하며, 그녀가 어린 시절부터 \u003cb class=\"key\">음악적 \u003c/b>\u003cb class=\"key\">재능\u003c/b>을 보였음을 언급합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>차별의 상처\u003csmall>시련 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>열두 살 때 부모님이 겪은 \u003cb class=\"key\">좌석 \u003c/b>\u003cb class=\"key\">차별\u003c/b>과 대학 오디션에서의 \u003cb class=\"key\">낙방 \u003c/b>\u003cb class=\"key\">이유\u003c/b>를 인종 차별로 여기며 겪은 고통을 서술합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>니나 시몬의 탄생\u003csmall>전환 · 문장 5\u003c/small>\u003c/h4>\u003cp>학비를 벌기 위해 'Nina Simone'이라는 \u003cb class=\"key\">예명(stage \u003c/b>\u003cb class=\"key\">name)\u003c/b>을 사용하며 본격적인 프로 공연 활동을 시작합니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>인권 운동 투신\u003csmall>활동 · 문장 6–7\u003c/small>\u003c/h4>\u003cp>\u003cb class=\"key\">시민권 \u003c/b>\u003cb class=\"key\">운동\u003c/b>에 참여하며 인종 차별과 폭력에 대응하는 곡들을 쓰고, 결국 차별에 환멸을 느껴 \u003cb class=\"key\">미국을 \u003c/b>\u003cb class=\"key\">떠나게\u003c/b> 됩니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>음악적 유산\u003csmall>결론 · 문장 8\u003c/small>\u003c/h4>\u003cp>그녀의 죽음 이후에도 강력한 음악을 통해 그녀의 \u003cb class=\"key\">명성(reputation)\u003c/b>이 전 세계적으로 지속되고 있음을 강조합니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 한 인물의 일생을 시간 순서대로 보여주는 전형적인 전기문의 구조를 따르고 있습니다.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 그녀의 본명인 Eunice Kathleen Waymon을 소개하며 시작합니다. 그녀는 미국 음악가이자 인권 운동가였고, 아주 어린 시절부터 남다른 음악적 재능을 보여주었음을 강조하고 있죠.","hl":"f0"},{"n":5,"text":"세 번째와 네 번째 문장은 그녀가 겪은 시련을 보여줍니다. 열두 살 때 독주회에서 부모님이 백인들 때문에 뒤로 밀려난 사건과, 실력이 아닌 인종 차별 때문에 음악 대학 입학이 거절된 아픈 기억을 서술하고 있어요.","hl":"f1"},{"n":6,"text":"다섯 번째 문장은 분위기가 전환되는 지점입니다. 개인 레슨비를 마련하기 위해 무대 이름을 Nina Simone으로 바꾸고 프로 활동을 시작하게 됩니다. 바로 이 이름이 우리가 기억하는 전설의 시작인 셈이죠.","hl":"f2"},{"n":7,"text":"여섯 번째와 일곱 번째 문장은 그녀의 사회적 헌신을 다룹니다. 1960년대 인권 운동의 지지자가 되어 폭력과 차별에 저항하는 곡들을 발표했고, 이후 계속되는 차별에 지쳐 결국 미국을 떠나 프랑스로 이주하게 된 과정을 설명합니다.","hl":"f3"},{"n":8,"text":"마지막 여덟 번째 문장은 그녀의 죽음과 그 이후의 유산을 다룹니다. 이천삼년에 세상을 떠났지만, 그녀가 남긴 강력한 음악들은 오늘날에도 여전히 큰 울림을 주며 그녀의 명성을 이어가고 있다는 감동적인 결말입니다.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">시간순\u003c/span>\u003cspan class=\"lp-pill\">두괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">한 인물의 일생을 다루는 \u003cb class=\"key\">전기문(biography)\u003c/b> 형식으로, 출생부터 사후의 영향력까지 \u003cb class=\"key\">시간의 \u003c/b>\u003cb class=\"key\">흐름\u003c/b>에 따라 구성되었습니다. 첫 번째 문장에서 인물의 정체성을 정의하고 이후 구체적인 \u003cb class=\"key\">일화와 \u003c/b>\u003cb class=\"key\">사건\u003c/b>들을 나열하고 있습니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>At 12 (3)\u003c/b>\u003cspan>특정 시점 표시\u003c/span>\u003cb>After graduating (4)\u003c/b>\u003cspan>시간 순서 연결\u003c/span>\u003cb>In the 1960s (6)\u003c/b>\u003cspan>시대 배경 변화\u003c/span>\u003cb>in 1970 (7)\u003c/b>\u003cspan>특정 연도 명시\u003c/span>\u003cb>in 2003 (8)\u003c/b>\u003cspan>마지막 시점 표시\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">Eunice Kathleen Waymon\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">American musician\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">civil rights activist\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">She\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Nina Simone\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">supporter of the Civil Rights Movement\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":9,"text":"이 지문의 전개 방식은 시간의 흐름에 따른 나열이에요. 글의 첫 문장에서 주제를 제시하는 전형적인 두괄식 패턴을 보여주고 있습니다. 도입부에서 인물의 정의를 내리고 시간 순서에 따라 그녀의 인생에서 중요한 사건들을 배치했습니다.","hl":"ty"},{"n":10,"text":"문장 곳곳에 시간을 나타내는 신호어들이 가득합니다. 세 번째 문장의 At 12, 네 번째 문장의 After graduating, 여섯 번째 문장의 In the 1960s 같은 표현들을 잘 따라가야 합니다. 또한 Eunice라는 본명에서 Nina Simone이라는 예명으로 이름이 바뀌는 과정도 중요한 흐름의 지표가 됩니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>musician\u003c/b>\u003cem>명사\u003c/em>\u003cspan>음악가\u003c/span>\u003c/div>\u003cdiv>\u003cb>civil rights activist\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인권 운동가\u003c/span>\u003c/div>\u003cdiv>\u003cb>display\u003c/b>\u003cem>동사\u003c/em>\u003cspan>보여주다, 나타내다\u003c/span>\u003c/div>\u003cdiv>\u003cb>talent\u003c/b>\u003cem>명사\u003c/em>\u003cspan>재능\u003c/span>\u003c/div>\u003cdiv>\u003cb>classical recital\u003c/b>\u003cem>명사\u003c/em>\u003cspan>클래식 독주회\u003c/span>\u003c/div>\u003cdiv>\u003cb>originally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>원래\u003c/span>\u003c/div>\u003cdiv>\u003cb>against one's will\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>~의 의지에 반하여\u003c/span>\u003c/div>\u003cdiv>\u003cb>white people\u003c/b>\u003cem>명사\u003c/em>\u003cspan>백인\u003c/span>\u003c/div>\u003cdiv>\u003cb>graduate from\u003c/b>\u003cem>동사\u003c/em>\u003cspan>~을 졸업하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>audition\u003c/b>\u003cem>명사\u003c/em>\u003cspan>오디션\u003c/span>\u003c/div>\u003cdiv>\u003cb>application\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지원(서)\u003c/span>\u003c/div>\u003cdiv>\u003cb>reject\u003c/b>\u003cem>동사\u003c/em>\u003cspan>거부하다, 거절하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>attribute A to B\u003c/b>\u003cem>동사\u003c/em>\u003cspan>A를 B의 탓으로 돌리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>racial discrimination\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인종 차별\u003c/span>\u003c/div>\u003cdiv>\u003cb>fund\u003c/b>\u003cem>동사\u003c/em>\u003cspan>자금을 대다\u003c/span>\u003c/div>\u003cdiv>\u003cb>private lesson\u003c/b>\u003cem>명사\u003c/em>\u003cspan>개인 레슨\u003c/span>\u003c/div>\u003cdiv>\u003cb>perform\u003c/b>\u003cem>동사\u003c/em>\u003cspan>공연하다, 수행하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>adopt\u003c/b>\u003cem>동사\u003c/em>\u003cspan>채택하다, 취하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>stage name\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예명\u003c/span>\u003c/div>\u003cdiv>\u003cb>supporter\u003c/b>\u003cem>명사\u003c/em>\u003cspan>지지자\u003c/span>\u003c/div>\u003cdiv>\u003cb>Civil Rights Movement\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인권 운동, 시민권 운동\u003c/span>\u003c/div>\u003cdiv>\u003cb>compose\u003c/b>\u003cem>동사\u003c/em>\u003cspan>작곡하다, 구성하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>response\u003c/b>\u003cem>명사\u003c/em>\u003cspan>대응, 응답\u003c/span>\u003c/div>\u003cdiv>\u003cb>violence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>폭력\u003c/span>\u003c/div>\u003cdiv>\u003cb>frustrated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>좌절한\u003c/span>\u003c/div>\u003cdiv>\u003cb>settle\u003c/b>\u003cem>동사\u003c/em>\u003cspan>정착하다, 해결하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>pass away\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>세상을 떠나다, 사망하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>reputation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>명성, 평판\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"여기서 꼭 기억할 단어는 racial discrimination 즉 인종 차별입니다. 그리고 결과나 원인을 나타낼 때 쓰는 표현인 attribute A to B도 중요해요. 여기서는 자신의 지원 거절을 차별 탓으로 돌렸다는 의미로 쓰였죠. stage name은 연예인들이 쓰는 예명을 뜻한다는 것도 챙겨두세요.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">reject\u003c/b>\u003cspan class=\"m\">거부하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">refuse\u003c/span>\u003cspan class=\"s\">decline\u003c/span>\u003cspan class=\"s\">deny\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">accept\u003c/span>\u003cspan class=\"a\">approve\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">attribute\u003c/b>\u003cspan class=\"m\">탓으로 돌리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">ascribe\u003c/span>\u003cspan class=\"s\">assign\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">adopt\u003c/b>\u003cspan class=\"m\">채택하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">take up\u003c/span>\u003cspan class=\"s\">embrace\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">discard\u003c/span>\u003cspan class=\"a\">reject\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">frustrated\u003c/b>\u003cspan class=\"m\">좌절한\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">discouraged\u003c/span>\u003cspan class=\"s\">disheartened\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">encouraged\u003c/span>\u003cspan class=\"a\">satisfied\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">powerful\u003c/b>\u003cspan class=\"m\">강력한, 감동적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">influential\u003c/span>\u003cspan class=\"s\">moving\u003c/span>\u003cspan class=\"s\">impactful\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">weak\u003c/span>\u003cspan class=\"a\">powerless\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어 공부도 해볼까요? reject는 거절하다라는 뜻으로 refuse나 decline과 바꿔 쓸 수 있고, 반대말은 accept입니다. 좌절했다는 뜻의 frustrated는 discouraged와 의미가 비슷하죠. 마지막 문장의 powerful은 단순히 힘이 세다는 게 아니라 감동적이라는 의미에서 moving과 통합니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Eunice Kathleen Waymon은\u003c/span>\u003cspan class=\"en\">Eunice Kathleen Waymon\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국의 음악가\u003c/span>\u003cspan class=\"en\">an American musician\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이자 인권 운동가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">and\u003c/span> civil rights activist.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">Eunice Kathleen Waymon은 미국의 음악가 이자 인권 운동가였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전설적인 예술가 니나 시몬의 본명을 밝히며 그녀의 직업적 정체성을 소개하는 \u003cb class=\"key\">도입부\u003c/b>입니다. 단순한 음악가를 넘어 \u003cb class=\"key\">인권 \u003c/b>\u003cb class=\"key\">운동가\u003c/b>로서의 삶이 이 글의 핵심 주제임을 암시합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">be동사 과거형\u003c/span> : 주어(단수) + was + 보어 : \"였다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">등위접속사의 병렬 구조\u003c/span> : A(musician) + and + B(activist) : \"이자\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Eunice Kathleen Waymon, Eunice Kathleen Waymon은. was, 였다. an American musician, 미국의 음악가. and civil rights activist, 이자 인권 운동가. 이 문장 전체를 해석하면, Eunice Kathleen Waymon은 미국의 음악가 이자 인권 운동가였다.","hl":"m"},{"n":14,"text":"이 글의 주인공인 니나 시몬의 본명과 그녀의 두 가지 주요 정체성을 소개하는 도입부예요. 그녀가 단순히 노래만 부른 것이 아니라 인권 운동가로도 활동했다는 점이 이 글에서 아주 중요하게 다뤄질 핵심 포인트죠.","hl":"mn"},{"n":15,"text":"첫 번째 포인트는 단수 주어 뒤에 쓰인 과거형 동사 was 예요. 두 번째는 접속사 and 로 연결된 병렬 구조예요. 음악가와 인권 운동가라는 두 명사를 대등하게 연결해서 그녀의 두 가지 면모를 모두 보여주고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는\u003c/span>\u003cspan class=\"en\">She\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">보였다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">displayed\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">음악적 재능을\u003c/span>\u003cspan class=\"en\">musical talent\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">어린 나이부터\u003c/span>\u003cspan class=\"en\">from an early age.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 어린 나이부터 음악적 재능을 보였다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그녀가 타고난 \u003cb class=\"key\">음악적 \u003c/b>\u003cb class=\"key\">천재성\u003c/b>을 가지고 있었음을 설명합니다. 나중에 겪게 될 사건들과 대비되어 그녀의 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>를 강조하는 역할을 합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">일반동사의 과거형\u003c/span> : 주어 + display-ed (규칙 변화) : \"보였다\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"She, 그녀는. displayed, 보였다. musical talent, 음악적 재능을. from an early age, 어린 나이부터. 이 문장 전체를 해석하면, 그녀는 어린 나이부터 음악적 재능을 보였다.","hl":"m"},{"n":17,"text":"그녀가 아주 어릴 때부터 남다른 음악적 소질이 있었다는 점을 언급하고 있어요. 이런 천재성이 나중에 인종 차별이라는 벽에 부딪혔을 때 그녀가 느꼈을 상실감이 더 컸을 것임을 짐작하게 하죠.","hl":"mn"},{"n":18,"text":"첫 번째 포인트는 과거 시제를 나타내는 displayed 예요. 규칙 변화를 하는 동사라서 뒤에 ed 가 붙었죠. 이 문장은 주어, 동사, 목적어로 이루어진 깔끔한 삼형식 구조예요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">12살에\u003c/span>\u003cspan class=\"en\">At 12,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 첫 클래식 독주회에서\u003c/span>\u003cspan class=\"en\">during her first classical recital,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 부모님의 자리가\u003c/span>\u003cspan class=\"en\">her parents' seats,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">원래는 앞쪽에 가까웠던\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">originally \u003c/span>\u003cspan class=\"tgt\">near \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">front\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">뒤로 밀려났다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">moved\u003c/span> to the back\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 의지에 반하여\u003c/span>\u003cspan class=\"en\">against their will\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">백인들에게 자리를 만들어 주기 위해\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">make\u003c/span> seats for white people.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">12살에 그녀의 첫 클래식 독주회에서 원래는 앞쪽에 가까웠던 그녀의 부모님의 자리가 백인들에게 자리를 만들어 주기 위해 그들의 의지에 반하여 뒤로 밀려났다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 어린 예술가의 첫 무대에서 벌어진 부당한 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">차별\u003c/b> 사건을 묘사합니다. 부모님이 겪은 수모는 그녀가 나중에 \u003cb class=\"key\">사회 \u003c/b>\u003cb class=\"key\">운동\u003c/b>에 뛰어들게 된 결정적인 계기가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동격의 삽입구\u003c/span> : 명사(seats), [부사 + 전치사구], : \"원래는 앞쪽에 가까웠던\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">수동태\u003c/span> : be동사 과거형(were) + 과거분사(moved) : \"밀려났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">3\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : to + 동사원형(make) : \"만들어 주기 위해\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"At 12, 12살에. during her first classical recital, 그녀의 첫 클래식 독주회에서. her parents' seats, 그녀의 부모님의 자리가. originally near the front, 원래는 앞쪽에 가까웠던. were moved to the back, 뒤로 밀려났다. against their will, 그들의 의지에 반하여. to make seats for white people, 백인들에게 자리를 만들어 주기 위해. 이 문장 전체를 해석하면, 12살에 그녀의 첫 클래식 독주회에서 원래는 앞쪽에 가까웠던 그녀의 부모님의 자리가 백인들에게 자리를 만들어 주기 위해 그들의 의지에 반하여 뒤로 밀려났다.","hl":"m"},{"n":20,"text":"어린 시절 가장 소중했을 첫 독주회 무대에서 겪은 충격적인 인종 차별 사건을 보여주는 문장이에요. 부모님이 강제로 뒷자리로 밀려난 이 경험이 그녀의 마음속에 큰 상처와 함께 사회를 바꾸겠다는 의지를 심어주었겠죠.","hl":"mn"},{"n":21,"text":"첫 번째 포인트는 콤마 사이에 들어간 originally near the front 라는 삽입구예요. 좌석의 원래 위치를 설명해서 나중에 뒷자리로 옮겨진 사실을 더 비극적으로 보여주죠. 두 번째는 were moved 라는 수동태예요. 자리가 누군가에 의해 강제로 옮겨졌음을 나타내요. 세 번째는 to make 예요. 자리를 옮긴 목적이 무엇인지를 설명하는 투부정사의 부사적 용법입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">고등학교를 졸업한 뒤,\u003c/span>\u003cspan class=\"en\">After graduating from high school,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 오디션을 준비했지만,\u003c/span>\u003cspan class=\"en\">she prepared for an audition\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">Curtis Institute of Music의\u003c/span>\u003cspan class=\"en\">at the Curtis Institute of Music,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 지원은 거부되었고,\u003c/span>\u003cspan class=\"en\">but her application \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">was \u003c/span>\u003cspan class=\"tgt\">rejected\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 이를 인종 차별 때문이라고 여겼다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">which \u003c/span>\u003cspan class=\"tgt\">she \u003c/span>\u003cspan class=\"tgt\">attributed \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> racial discrimination.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">고등학교를 졸업한 뒤, 그녀는 Curtis Institute of Music의 오디션을 준비했지만, 그녀의 지원은 거부되었고, 그녀는 이를 인종 차별 때문이라고 여겼다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 재능이 뛰어났음에도 불구하고 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">차별\u003c/b>이라는 사회적 장벽에 부딪힌 Nina Simone의 인생 전환점을 보여줍니다. 자신의 실패 원인을 개인의 능력이 아닌 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">불평등\u003c/b>에서 찾으며 이후 활동가로서의 삶에 영향을 주는 계기가 됩니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 (과거)\u003c/span> : be동사 과거(was) + 과거분사(rejected) : \"거부되었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계대명사의 계속적 용법\u003c/span> : 접속사(and) + 대명사(it) : \"그리고 그것을 ~의 탓으로 돌렸다\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"After graduating from high school, 고등학교를 졸업한 뒤. she prepared for an audition, 그녀는 오디션을 준비했지만. at the Curtis Institute of Music, Curtis Institute of Music의. but her application was rejected, 그녀의 지원은 거부되었고. which she attributed to racial discrimination, 그녀는 이를 인종 차별 때문이라고 여겼다.. 이 문장 전체를 해석하면, 고등학교를 졸업한 뒤, 그녀는 Curtis Institute of Music의 오디션을 준비했지만, 그녀의 지원은 거부되었고, 그녀는 이를 인종 차별 때문이라고 여겼다.","hl":"m"},{"n":23,"text":"이 문장은 그녀가 겪은 큰 시련을 다루고 있어요. 아주 실력 있는 음악가였지만 단순히 인종이 다르다는 이유로 거절당했다는 점이 그녀의 가치관 형성에 큰 영향을 주게 됩니다.","hl":"mn"},{"n":24,"text":"첫 번째로 was rejected 부분을 보세요. 지원서가 스스로 거절하는 게 아니라 거절당하는 것이니까 수동태를 썼지요. 두 번째로 which는 콤마와 함께 쓰여서 앞의 상황 전체를 가리키고 있습니다. attribute A to B 구문에서 목적어인 A 자리가 비어 있는 것을 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신의 개인 레슨비를 마련하기 위해,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">To \u003c/span>\u003cspan class=\"tgt\">fund\u003c/span> her private lessons,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 Atlantic City에서 공연을 시작하면서\u003c/span>\u003cspan class=\"en\">she began performing in Atlantic City,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">예명을 택했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">adopting\u003c/span> the stage name\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">‘Nina Simone’이라는\u003c/span>\u003cspan class=\"en\">&quot;Nina Simone.&quot;\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">자신의 개인 레슨비를 마련하기 위해, 그녀는 Atlantic City에서 공연을 시작하면서 ‘Nina Simone’이라는 예명을 택했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 경제적인 어려움을 해결하기 위해 \u003cb class=\"key\">대중 \u003c/b>\u003cb class=\"key\">공연\u003c/b>의 길로 들어서게 되는 과정을 설명합니다. 이 과정에서 우리가 알고 있는 Nina Simone이라는 \u003cb class=\"key\">예명\u003c/b>이 탄생하게 된 배경을 알 수 있습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">to부정사의 부사적 용법 (목적)\u003c/span> : To + 동사원형 : \"자금을 마련하기 위해\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사 (분사구문)\u003c/span> : 동사원형 + ~ing : \"택하면서\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"To fund her private lessons, 자신의 개인 레슨비를 마련하기 위해. she began performing in Atlantic City, 그녀는 Atlantic City에서 공연을 시작하면서. adopting the stage name, 예명을 택했다. \"Nina Simone.\", ‘Nina Simone’이라는. 이 문장 전체를 해석하면, 자신의 개인 레슨비를 마련하기 위해, 그녀는 Atlantic City에서 공연을 시작하면서 ‘Nina Simone’이라는 예명을 택했다.","hl":"m"},{"n":26,"text":"레슨비를 벌기 위해 시작한 일이 결국 그녀의 전설적인 커리어의 시작이 되었네요. 이 문장은 그녀의 이름이 바뀐 시점과 그 이유를 설명하고 있습니다.","hl":"mn"},{"n":27,"text":"첫 번째로 To fund는 목적을 나타내는 표현입니다. 무엇을 하기 위해라고 해석하면 자연스러워요. 두 번째로 끝에 나오는 adopting은 분사구문입니다. 주어인 그녀가 이름을 택하면서 동시에 공연을 했다는 부수적인 상황을 보여줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">1960년대에\u003c/span>\u003cspan class=\"en\">In the 1960s,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 Civil Rights Movement의 지지자가 되었고,\u003c/span>\u003cspan class=\"en\">she became a supporter of the Civil Rights Movement\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">노래들을 작곡하고 공연했다\u003c/span>\u003cspan class=\"en\">and \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">composed \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">performed\u003c/span> songs\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">인종 차별과 폭력에 대응하는\u003c/span>\u003cspan class=\"en\">as a response to racism and violence\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국 남부의\u003c/span>\u003cspan class=\"en\">in the Southern United States.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">1960년대에 그녀는 Civil Rights Movement의 지지자가 되었고, 미국 남부의 인종 차별과 폭력에 대응하는 노래들을 작곡하고 공연했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 단순한 음악가를 넘어 사회 문제를 해결하려는 \u003cb class=\"key\">활동가\u003c/b>로 거듭나는 모습입니다. 자신의 예술적 재능을 \u003cb class=\"key\">저항\u003c/b>의 도구로 삼아 사회적 목소리를 내기 시작했음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">동사의 병렬 구조\u003c/span> : 과거동사 1 + and + 과거동사 2 : \"작곡하고 공연했다\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"In the 1960s, 1960년대에. she became a supporter of the Civil Rights Movement, 그녀는 Civil Rights Movement의 지지자가 되었고. and composed and performed songs, 노래들을 작곡하고 공연했다. as a response to racism and violence, 인종 차별과 폭력에 대응하는. in the Southern United States, 미국 남부의. 이 문장 전체를 해석하면, 1960년대에 그녀는 Civil Rights Movement의 지지자가 되었고, 미국 남부의 인종 차별과 폭력에 대응하는 노래들을 작곡하고 공연했다.","hl":"m"},{"n":29,"text":"단순히 노래만 부르는 것이 아니라 사회적인 메시지를 담기 시작한 시기입니다. 미국 남부의 인종 차별에 맞선 그녀의 용기 있는 행동을 묘사하고 있어요.","hl":"mn"},{"n":30,"text":"중간에 composed and performed 부분을 보세요. 과거형 동사 두 개가 나란히 연결되어 있죠. 주어인 she가 한 두 가지 동작을 동등하게 나열하는 병렬 구조입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">미국에서의 인종 차별에 좌절하여,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">Frustrated \u003c/span>\u003cspan class=\"tgt\">by \u003c/span>\u003cspan class=\"tgt\">the \u003c/span>\u003cspan class=\"tgt\">racism\u003c/span> in the United States,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 1970년에 그 나라를 떠나\u003c/span>\u003cspan class=\"en\">she left the country in 1970,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">여러 지역들에서 살았다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">living \u003c/span>\u003cspan class=\"tgt\">in \u003c/span>\u003cspan class=\"tgt\">various \u003c/span>\u003cspan class=\"tgt\">places\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">프랑스에 정착하기 전에.\u003c/span>\u003cspan class=\"en\">before settling in France.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">미국에서의 인종 차별에 좌절하여, 그녀는 1970년에 그 나라를 떠나 프랑스에 정착하기 전에 여러 지역들에서 살았다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 미국 내 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">차별\u003c/b>에 대한 깊은 환멸이 그녀로 하여금 조국을 떠나게 만든 결정적 원인이었음을 설명합니다. 유럽 등지에서의 방랑 끝에 프랑스에 정착하며 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">여정\u003c/b>을 시작했음을 보여주는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구문(이유)\u003c/span> : [(Being) Frustrated (p.p.)] + [by + 대상] : \"미국에서의 인종 차별에 좌절하여\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구문(연속동작)\u003c/span> : [주절], + [living (v-ing)] : \"여러 지역들에서 살았다\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Frustrated by the racism in the United States, 미국에서의 인종 차별에 좌절하여. she left the country in 1970, 그녀는 1970년에 그 나라를 떠나. living in various places, 여러 지역들에서 살았다. before settling in France, 프랑스에 정착하기 전에.. 이 문장 전체를 해석하면, 미국에서의 인종 차별에 좌절하여, 그녀는 1970년에 그 나라를 떠나 프랑스에 정착하기 전에 여러 지역들에서 살았다.","hl":"m"},{"n":32,"text":"미국 내의 심각한 인종 차별이 그녀를 떠나게 만든 근본적인 이유였음을 알 수 있어요. 타국을 떠돌며 살다가 결국 프랑스에 정착하게 된 그녀의 삶의 궤적을 설명하고 있습니다.","hl":"mn"},{"n":33,"text":"첫 번째로 문장 맨 앞의 Frustrated는 주인공인 그녀가 좌절을 느낀 수동의 상태를 나타내는 과거분사구문입니다. 두 번째로 쉼표 뒤의 living은 나라를 떠난 이후의 상황을 부드럽게 이어주는 분사구문의 연속 동작으로 쓰였어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀는 2003년에 세상을 떠났지만,\u003c/span>\u003cspan class=\"en\">She \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">passed \u003c/span>\u003cspan class=\"tgt\">away\u003c/span> in 2003\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 명성은 계속 이어지고 있다\u003c/span>\u003cspan class=\"en\">but her reputation \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">continues \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그녀의 감동적인 음악을 통해.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">through\u003c/span> her powerful music.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">그녀는 2003년에 세상을 떠났지만, 그녀의 명성은 그녀의 감동적인 음악을 통해 계속 이어지고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 그녀의 물리적인 생애는 끝났지만, 그녀가 남긴 \u003cb class=\"key\">예술적 \u003c/b>\u003cb class=\"key\">가치\u003c/b>는 시대를 초월하여 존재함을 강조합니다. 그녀의 음악이 가진 \u003cb class=\"key\">영향력\u003c/b>이 오늘날까지도 여전히 강력함을 시사하며 글을 마무리합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사(완곡어법)\u003c/span> : [pass (동사)] + [away (부사)] : \"세상을 떠났다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재 시제\u003c/span> : [reputation (주어)] + [continues (단수 동사)] : \"~을 통해 계속되고 있다\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"She passed away in 2003, 그녀는 2003년에 세상을 떠났지만. but her reputation continues, 그녀의 명성은 계속 이어지고 있다. through her powerful music, 그녀의 감동적인 음악을 통해.. 이 문장 전체를 해석하면, 그녀는 2003년에 세상을 떠났지만, 그녀의 명성은 그녀의 감동적인 음악을 통해 계속 이어지고 있다.","hl":"m"},{"n":35,"text":"그녀의 생애는 이천삼 년에 끝이 났지만 음악가로서의 이름값은 여전하다는 뜻이죠. 그녀가 만든 강렬하고 감동적인 곡들이 오늘날까지도 우리 곁에 남아 있다는 점을 강조하며 글을 맺고 있습니다.","hl":"mn"},{"n":36,"text":"첫 번째로 passed away는 die라는 단어보다 훨씬 격식 있고 정중하게 죽음을 표현하는 완곡한 표현입니다. 두 번째로 명성이 계속된다는 의미의 continues는 그녀의 영향력이 현재까지 지속되고 있다는 사실을 현재형 시제로 생생하게 전달하고 있습니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>Eunice Kathleen Waymon은 어려서부터 \u003cb class=\"key\">음악적 \u003c/b>\u003cb class=\"key\">재능\u003c/b>이 뛰어났으나 성장 과정에서 부당한 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">차별\u003c/b>을 경험했습니다.\u003c/li>\u003cli>학비를 벌기 위해 ‘Nina Simone’이라는 \u003cb class=\"key\">예명\u003c/b>으로 활동을 시작하며 대중적인 인지도를 쌓았습니다.\u003c/li>\u003cli>1960년대에는 \u003cb class=\"key\">인권 \u003c/b>\u003cb class=\"key\">운동\u003c/b>에 적극적으로 참여하며 사회적 폭력에 저항하는 노래를 \u003cb class=\"key\">작곡\u003c/b>하고 발표했습니다.\u003c/li>\u003cli>미국 내 차별에 실망하여 유럽 등으로 이주했으나, 사후에도 그녀의 \u003cb class=\"key\">음악적 \u003c/b>\u003cb class=\"key\">명성\u003c/b>은 강력하게 이어지고 있습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Eunice Kathleen Waymon, known as Nina Simone, overcame racial prejudice to become a legendary musician and a passionate civil rights activist.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">음악적 재능을 타고났으나 \u003cb class=\"key\">인종 \u003c/b>\u003cb class=\"key\">차별\u003c/b>의 벽에 부딪혔던 Nina Simone이 예명으로 활동하며 \u003cb class=\"key\">인권 \u003c/b>\u003cb class=\"key\">운동\u003c/b>과 저항 음악에 헌신한 일대기를 다룬 글입니다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":37,"text":"오늘 우리는 차별에 맞서 음악으로 투쟁한 Nina Simone의 삶을 살펴보았습니다. 한 인물의 연대기를 다룬 글인 만큼 사건의 인과관계와 시간 순서를 잘 정리해 두시길 바랍니다. 그녀의 음악처럼 여러분의 공부도 강력한 울림이 있기를 응원하며 수업 마치겠습니다. 수고하셨습니다!","hl":null}]}]});</script></body></html>
