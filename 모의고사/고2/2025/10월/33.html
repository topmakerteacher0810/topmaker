<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 33번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

.lp{--pk-b:#B5DEDC;--am:#E0952B;--am-l:#FFF3DC;--am-b:#F0D9A5;--am-d:#8A5A00}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();

}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 33번","audioDir":"33_audio","preview":false,"count":40,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">33번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>The Architecture of Power: How Glass Shaped Social Control\u003c/h1>\u003ch2>권력의 건축: 유리가 사회적 통제를 형성한 방식\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>궁전은 단순히 거주하는 공간을 넘어 \u003cb class=\"key\">가시성\u003c/b>을 제공하는 유리를 전략적으로 활용하여 통치자의 \u003cb class=\"key\">절대 \u003c/b>\u003cb class=\"key\">권위\u003c/b>를 과시하고 백성을 \u003cb class=\"key\">감시와 \u003c/b>\u003cb class=\"key\">통제\u003c/b> 아래 두는 건축적 무대였다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>Palaces utilized the transparency of glass as a strategic architectural tool to reinforce the ruler's absolute authority and ensure social obedience through surveillance.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘 우리는 건축이 단순히 사람이 사는 집을 넘어 어떻게 권력의 도구로 쓰였는지 보여주는 흥미로운 지문을 공부해 볼 거예요. 2025년 10월 고2 모의고사 서른세 번째 지문인데요. 이 글의 요지는 궁전이 유리의 가시성을 활용해 통치자의 절대 권위를 강화하고 사람들을 감시하며 통제했다는 내용입니다.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">이 지문을 이해하기 위해서는 17세기 유럽의 \u003cb class=\"key\">절대왕정\u003c/b> 시대를 떠올려야 합니다. 당시 왕들은 자신의 권력이 신으로부터 부여받았음을 증명하기 위해 화려한 건축물을 지었는데, 이를 \u003cb class=\"key\">권력의 \u003c/b>\u003cb class=\"key\">시각화\u003c/b>라고 합니다. 유리는 당시 매우 비싼 재료였으며, 단순히 아름다움을 넘어 \u003cb class=\"key\">파놉티콘\u003c/b>처럼 누군가를 지켜보고 있다는 압박감을 주는 도구로 쓰였습니다. 마치 우리가 투명한 \u003cb class=\"key\">유리관\u003c/b> 속에 갇힌 것처럼, 사방이 트인 구조는 보는 이와 보이는 이 사이의 엄격한 계급을 만듭니다. 이 글은 건축이 어떻게 인간의 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">복종\u003c/b>을 이끌어내는지 설명합니다.\u003c/div>","segs":[{"n":2,"text":"강의에 들어가기 앞서 배경지식을 좀 쌓아볼까요? 17세기 유럽의 절대왕정 시대를 상상해 보세요. 왕은 자신이 신과 같은 존재임을 사람들에게 시각적으로 보여줘야 했어요. 그래서 선택한 방법이 바로 권력의 시각화입니다. 특히 유리는 당시에 아주 귀하고 비싼 재료였는데, 이를 통해 투명하게 안팎을 볼 수 있게 만든 것은 파놉티콘 효과, 즉 언제 어디서든 감시받고 있다는 느낌을 주려는 고도의 전략이었습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>궁전의 본질\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>역사적으로 궁전은 단순한 집이 아니라 권위를 드러내는 \u003cb class=\"key\">정교한 \u003c/b>\u003cb class=\"key\">무대\u003c/b>였습니다. 돌이 힘을 상징했다면, 유리는 \u003cb class=\"key\">가시성\u003c/b>이라는 강력한 힘을 제공했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>시각적 위계\u003csmall>전개 · 문장 3–4\u003c/small>\u003c/h4>\u003cp>대형 창문은 통치자가 백성을 \u003cb class=\"key\">내려다보게\u003c/b> 하여 지위를 강조했습니다. 반대로 백성은 통치자를 \u003cb class=\"key\">우러러보며\u003c/b> 거리감을 느끼게 되었습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>베르사유 사례\u003csmall>예시 · 문장 5\u003c/small>\u003c/h4>\u003cp>베르사유 궁전의 '거울의 방'은 \u003cb class=\"key\">공간의 \u003c/b>\u003cb class=\"key\">웅장함\u003c/b>을 극대화했습니다. 이는 왕을 화려함의 중심에 두어 그의 \u003cb class=\"key\">절대 \u003c/b>\u003cb class=\"key\">권위\u003c/b>를 강화했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>전략적 감시\u003csmall>근거 · 문장 6–8\u003c/small>\u003c/h4>\u003cp>유리 사용은 미적인 목적보다 \u003cb class=\"key\">전략적 \u003c/b>\u003cb class=\"key\">목적\u003c/b>이 컸습니다. 열린 시야는 \u003cb class=\"key\">감시와 \u003c/b>\u003cb class=\"key\">통제\u003c/b>를 가능하게 하여 신하들의 복종을 이끌어냈습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f4\">\u003ch4>\u003ci>05\u003c/i>건축과 행동\u003csmall>결론 · 문장 9\u003c/small>\u003c/h4>\u003cp>결국 건축물 자체가 사회적 행동을 \u003cb class=\"key\">지배하는 \u003c/b>\u003cb class=\"key\">도구\u003c/b>가 되었습니다. 유리는 권력 역학 관계를 조용히 \u003cb class=\"key\">강제하는 \u003c/b>\u003cb class=\"key\">역할\u003c/b>을 수행했습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"자, 그럼 이 지문이 어떤 순서로 논리를 펼치고 있는지 단계별로 살펴봅시다.","hl":null},{"n":4,"text":"첫 번째 단계인 도입부에서는 궁전의 본질을 정의합니다. 궁전은 단순한 거처가 아니라 사람들에게 깊은 인상을 주고 위협하기 위해 정교하게 만들어진 무대였다고 설명하며, 돌과 유리가 가진 서로 다른 힘을 대조하고 있죠.","hl":"f0"},{"n":5,"text":"두 번째 단계에서는 유리가 만든 시각적 위계를 보여줍니다. 대형 창문을 통해 왕은 백성을 내려다보고 백성은 왕을 올려다보게 되는데, 이런 시선의 방향이 경외심과 거리감을 만들어 냈다는 거예요.","hl":"f1"},{"n":6,"text":"세 번째 단계는 구체적인 예시로 베르사유 궁전의 거울의 방이 나옵니다. 반사되는 표면들이 공간의 웅장함을 극대화했고, 그 중심에 선 왕의 절대 권위를 더욱 눈부시게 강화했다는 점을 강조합니다.","hl":"f2"},{"n":7,"text":"네 번째 단계에서는 유리의 전략적 기능을 설명합니다. 유리를 통한 열린 시야는 더 나은 감시와 통제를 가능하게 했고, 이로 인해 신하들은 늘 관찰당한다는 의식을 하며 복종하게 되었습니다.","hl":"f3"},{"n":8,"text":"마지막 단계인 결론에서는 건축물 그 자체가 사회적 행동을 지배했다고 정리합니다. 유리가 권력 역학 관계의 조용한 집행자 역할을 하면서 건축이 통치 도구가 된 것이죠.","hl":"f4"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">비교·대조 및 예시\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 궁전이 \u003cb class=\"key\">의도된 \u003c/b>\u003cb class=\"key\">무대\u003c/b>임을 밝히며 주제를 던집니다. 이후 돌과 유리를 \u003cb class=\"key\">대조\u003c/b>하고 베르사유 궁전이라는 \u003cb class=\"key\">구체적 \u003c/b>\u003cb class=\"key\">예시\u003c/b>를 통해 논거를 강화합니다. 마지막에 건축이 \u003cb class=\"key\">사회적 \u003c/b>\u003cb class=\"key\">행동\u003c/b>을 결정한다는 결론으로 마무리하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>While (2)\u003c/b>\u003cspan>대조\u003c/span>\u003cb>Conversely (4)\u003c/b>\u003cspan>대조적 결과\u003c/span>\u003cb>Consider (5)\u003c/b>\u003cspan>예시 도입\u003c/span>\u003cb>merely... strategic (6)\u003c/b>\u003cspan>강조점 전환\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">stages designed to impress and intimidate\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">visibility\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">large windows\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">looking down\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">gazing up\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">reflective surfaces\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">strategic\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">open sightlines\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">surveillance\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">architecture dictated social behavior\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Stone (돌)\u003c/th>\u003cth>Glass (유리)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>영속성과 힘 상징\u003c/td>\u003ctd>가시성 및 전략적 통제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>물리적 견고함\u003c/td>\u003ctd>시각적 위계 형성\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":9,"text":"이 글은 전형적인 양괄식 구조를 취하고 있어요. 첫 문장에서 궁전이 설계된 무대라는 주제를 던지고, 마지막 문장에서 건축이 행동을 지배한다는 결론으로 마무리하죠. 중간에는 돌과 유리를 비교하는 대조 방식과 베르사유 궁전이라는 예시 방식을 섞어 사용했습니다.","hl":"ty"},{"n":10,"text":"문장 곳곳에 단서들이 숨어 있습니다. 두 번째 문장의 While은 돌과 유리를 대조하기 시작하고, 네 번째 문장의 Conversely는 시선의 방향이 바뀔 때 사용되었죠. 다섯 번째 문장의 Consider는 예시를 들 때 쓰는 전형적인 신호입니다. 또한 단순히 미적인 것이 아니라 전략적이었다는 표현을 통해 글의 핵심 의도를 강조하고 있습니다.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>historically\u003c/b>\u003cem>부사\u003c/em>\u003cspan>역사적으로\u003c/span>\u003c/div>\u003cdiv>\u003cb>palace\u003c/b>\u003cem>명사\u003c/em>\u003cspan>궁전\u003c/span>\u003c/div>\u003cdiv>\u003cb>constructed\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>만들어진, 건설된\u003c/span>\u003c/div>\u003cdiv>\u003cb>stage\u003c/b>\u003cem>명사\u003c/em>\u003cspan>무대\u003c/span>\u003c/div>\u003cdiv>\u003cb>impress\u003c/b>\u003cem>동사\u003c/em>\u003cspan>인상을 주다\u003c/span>\u003c/div>\u003cdiv>\u003cb>intimidate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>위협하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>symbolize\u003c/b>\u003cem>동사\u003c/em>\u003cspan>상징하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>permanence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영속성\u003c/span>\u003c/div>\u003cdiv>\u003cb>visibility\u003c/b>\u003cem>명사\u003c/em>\u003cspan>가시성\u003c/span>\u003c/div>\u003cdiv>\u003cb>introduction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>도입\u003c/span>\u003c/div>\u003cdiv>\u003cb>subject\u003c/b>\u003cem>명사\u003c/em>\u003cspan>국민, 피통치자, 신하\u003c/span>\u003c/div>\u003cdiv>\u003cb>elevated\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>높은, 높아진\u003c/span>\u003c/div>\u003cdiv>\u003cb>conversely\u003c/b>\u003cem>부사\u003c/em>\u003cspan>반대로\u003c/span>\u003c/div>\u003cdiv>\u003cb>gaze\u003c/b>\u003cem>동사\u003c/em>\u003cspan>응시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>awe\u003c/b>\u003cem>명사\u003c/em>\u003cspan>경외심\u003c/span>\u003c/div>\u003cdiv>\u003cb>reflective\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>반사되는\u003c/span>\u003c/div>\u003cdiv>\u003cb>magnify\u003c/b>\u003cem>동사\u003c/em>\u003cspan>확대하다, 극대화하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>grandeur\u003c/b>\u003cem>명사\u003c/em>\u003cspan>웅장함\u003c/span>\u003c/div>\u003cdiv>\u003cb>absolute authority\u003c/b>\u003cem>숙어\u003c/em>\u003cspan>절대 권위\u003c/span>\u003c/div>\u003cdiv>\u003cb>aesthetic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>미적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>strategic\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>전략적인\u003c/span>\u003c/div>\u003cdiv>\u003cb>sightline\u003c/b>\u003cem>명사\u003c/em>\u003cspan>시선, 시야\u003c/span>\u003c/div>\u003cdiv>\u003cb>surveillance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>감시\u003c/span>\u003c/div>\u003cdiv>\u003cb>ruling family\u003c/b>\u003cem>명사\u003c/em>\u003cspan>통치 가문\u003c/span>\u003c/div>\u003cdiv>\u003cb>courtier\u003c/b>\u003cem>명사\u003c/em>\u003cspan>신하\u003c/span>\u003c/div>\u003cdiv>\u003cb>obedience\u003c/b>\u003cem>명사\u003c/em>\u003cspan>복종\u003c/span>\u003c/div>\u003cdiv>\u003cb>dictate\u003c/b>\u003cem>동사\u003c/em>\u003cspan>지배하다, 규정하다\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"여기서 중요한 단어들을 몇 개 짚어볼게요. intimidate는 위협하다라는 뜻으로 권력의 속성을 잘 보여줍니다. subjects는 여기서 주제가 아니라 국민이나 피통치자를 뜻한다는 점에 주의하세요. surveillance라는 단어는 감시라는 뜻으로 이 글의 핵심적인 기능어입니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">intimidate\u003c/b>\u003cspan class=\"m\">위협하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">frighten\u003c/span>\u003cspan class=\"s\">threaten\u003c/span>\u003cspan class=\"s\">menace\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">reassure\u003c/span>\u003cspan class=\"a\">encourage\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">permanence\u003c/b>\u003cspan class=\"m\">영속성\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">durability\u003c/span>\u003cspan class=\"s\">stability\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">transience\u003c/span>\u003cspan class=\"a\">impermanence\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">elevated\u003c/b>\u003cspan class=\"m\">높은\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">raised\u003c/span>\u003cspan class=\"s\">lofty\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lowered\u003c/span>\u003cspan class=\"a\">humble\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">grandeur\u003c/b>\u003cspan class=\"m\">웅장함\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">magnificence\u003c/span>\u003cspan class=\"s\">splendor\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">simplicity\u003c/span>\u003cspan class=\"a\">modesty\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">obedience\u003c/b>\u003cspan class=\"m\">복종\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">compliance\u003c/span>\u003cspan class=\"s\">submission\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">defiance\u003c/span>\u003cspan class=\"a\">rebellion\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":12,"text":"동의어와 반의어도 정리해 봅시다. 위협하다라는 뜻의 intimidate는 frighten이나 threaten과 바꿔 쓸 수 있고, 안심시키다라는 뜻의 reassure가 반대말이 됩니다. 웅장함이라는 뜻의 grandeur는 magnificence와 비슷하며, 단순함을 뜻하는 simplicity와는 반대되는 개념입니다. 복종이라는 뜻의 obedience는 submission과 동의어이며 rebellion과는 반대되죠.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">역사적으로,\u003c/span>\u003cspan class=\"en\">Historically,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">궁전들은 단순한 거처가 아니었다;\u003c/span>\u003cspan class=\"en\">palaces weren't just homes;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것들은 주의 깊게 만들어진 무대들이었다\u003c/span>\u003cspan class=\"en\">they were \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">carefully \u003c/span>\u003cspan class=\"tgt\">constructed\u003c/span> stages\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">깊은 인상을 주고 위협하기 위해 설계된.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">designed \u003c/span>\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">impress \u003c/span>\u003cspan class=\"tgt\">and \u003c/span>\u003cspan class=\"tgt\">intimidate\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">역사적으로 궁전들은 단순한 거처가 아니었다. 그것들은 깊은 인상을 주고 위협하기 위해 설계된 주의 깊게 만들어진 무대들이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 궁전이 단순한 주거 공간을 넘어 \u003cb class=\"key\">권력 \u003c/b>\u003cb class=\"key\">과시\u003c/b>와 타인을 압도하기 위한 \u003cb class=\"key\">정치적 \u003c/b>\u003cb class=\"key\">수단\u003c/b>이자 사회적 장치로 기능했음을 설명하는 도입부입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사의 수식\u003c/span> : 부사 + 과거분사(p.p.) + 명사(stages) : \"주의 깊게 만들어진\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">과거분사구의 후치 수식\u003c/span> : 명사(stages) + [designed (p.p.) + to부정사구] : \"깊은 인상을 주고 위협하기 위해 설계된\"\u003c/div>\u003c/div>","segs":[{"n":13,"text":"Historically, 역사적으로. palaces weren't just homes, 궁전들은 단순한 거처가 아니었다;. they were carefully constructed stages, 그것들은 주의 깊게 만들어진 무대들이었다. designed to impress and intimidate, 깊은 인상을 주고 위협하기 위해 설계된.. 이 문장 전체를 해석하면, 역사적으로 궁전들은 단순한 거처가 아니었다. 그것들은 깊은 인상을 주고 위협하기 위해 설계된 주의 깊게 만들어진 무대들이었다.","hl":"m"},{"n":14,"text":"이 문장은 궁전이 단순한 집이 아니라고 말해요. 타인에게 깊은 인상을 주고 권위를 보여주는 정치적 수단이라는 점을 강조하는 핵심 도입부입니다.","hl":"mn"},{"n":15,"text":"첫 번째 문법 포인트는 명사 stages를 앞에서 꾸며주는 carefully constructed예요. 무대가 만들어진 수동의 상태니까 과거분사를 썼죠. 두 번째 포인트는 designed to로 시작하는 덩어리예요. 이 부분 역시 명사 뒤에서 무대의 설계 목적을 구체적으로 설명하는 과거분사구입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 2 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">돌은 상징했고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">While\u003c/span> stone symbolized\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">영속성과 힘을,\u003c/span>\u003cspan class=\"en\">permanence and strength,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유리는 동등하게 강력한 어떤 것을 제공했다:\u003c/span>\u003cspan class=\"en\">glass offered \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">something \u003c/span>\u003cspan class=\"tgt\">equally \u003c/span>\u003cspan class=\"tgt\">powerful\u003c/span>:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">가시성.\u003c/span>\u003cspan class=\"en\">visibility.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">돌은 영속성과 힘을 상징했고, 유리는 동등하게 강력한 어떤 것, 즉 가시성을 제공했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 전통적 소재인 돌과 새로운 소재인 \u003cb class=\"key\">유리\u003c/b>를 대조하여, 유리만이 가진 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">특성\u003c/b>이 권력의 새로운 원천이 되었음을 보여줍니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">대조의 접속사\u003c/span> : While [주어+동사], [주어+동사] : \"~한 반면에, ~했지만\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">형용사의 후치 수식\u003c/span> : -thing [명사] + 형용사(powerful) : \"동등하게 강력한 어떤 것\"\u003c/div>\u003c/div>","segs":[{"n":16,"text":"While stone symbolized, 돌은 상징했고. permanence and strength, 영속성과 힘을. glass offered something equally powerful, 유리는 동등하게 강력한 어떤 것을 제공했다:. visibility, 가시성.. 이 문장 전체를 해석하면, 돌은 영속성과 힘을 상징했고, 유리는 동등하게 강력한 어떤 것, 즉 가시성을 제공했다.","hl":"m"},{"n":17,"text":"과거에는 돌이 힘의 상징이었지만, 이제는 유리 덕분에 생긴 가시성이 그에 못지않은 새로운 힘이 되었다는 대조의 내용입니다.","hl":"mn"},{"n":18,"text":"첫 번째로 쓰인 While은 여기서 반면에라는 뜻으로 돌과 유리의 특징을 대조해요. 두 번째로 something equally powerful을 보세요. something처럼 씽으로 끝나는 대명사는 powerful 같은 형용사가 반드시 뒤에서 앞으로 꾸며줘야 한다는 점을 기억하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 3 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">궁전들에 대형 창문들의 도입은\u003c/span>\u003cspan class=\"en\">The introduction of large windows in palaces\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통치자들로 하여금 ~하게 해 줬고\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">allowed \u003c/span>\u003cspan class=\"tgt\">rulers \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">문자 그대로 자신들의 국민들을 내려다볼 수 있게,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">literally \u003c/span>\u003cspan class=\"tgt\">look \u003c/span>\u003cspan class=\"tgt\">down\u003c/span> upon their subjects,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그들의 높은 지위를 강조했다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">emphasizing \u003c/span>\u003cspan class=\"tgt\">their \u003c/span>\u003cspan class=\"tgt\">elevated \u003c/span>\u003cspan class=\"tgt\">position\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">궁전들에 대형 창문들의 도입은 통치자들로 하여금 문자 그대로 자신들의 국민들을 내려다볼 수 있게 해 줬고, 그들의 높은 지위를 강조했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 대형 유리창이라는 건축적 요소가 통치자와 피통치자 사이의 \u003cb class=\"key\">수직적 \u003c/b>\u003cb class=\"key\">관계\u003c/b>를 시각적으로 확인시켜주는 \u003cb class=\"key\">권력의 \u003c/b>\u003cb class=\"key\">도구\u003c/b>가 되었음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">allow의 목적격 보어\u003c/span> : allow [타동사] + 목적어 + to부정사(to look down) : \"통치자들이 내려다보는 것을 허용하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문(결과/연속동작)\u003c/span> : [문장], + 현재분사(V-ing) : \"그들의 높은 지위를 강조하면서\"\u003c/div>\u003c/div>","segs":[{"n":19,"text":"The introduction of large windows in palaces, 궁전들에 대형 창문들의 도입은. allowed rulers, 통치자들로 하여금 ~하게 해 줬고. to literally look down upon their subjects, 문자 그대로 자신들의 국민들을 내려다볼 수 있게. emphasizing their elevated position, 그들의 높은 지위를 강조했다.. 이 문장 전체를 해석하면, 궁전들에 대형 창문들의 도입은 통치자들로 하여금 문자 그대로 자신들의 국민들을 내려다볼 수 있게 해 줬고, 그들의 높은 지위를 강조했다.","hl":"m"},{"n":20,"text":"큰 창문 덕분에 왕이 위에서 아래를 내려다보게 되었고, 이게 자연스럽게 왕의 높은 권위를 시각적으로 보여주게 되었다는 뜻이에요.","hl":"mn"},{"n":21,"text":"첫 번째로 allowed rulers to look down 부분을 보면 allow라는 동사의 특징이 보여요. 목적어 뒤에 반드시 to부정사를 써서 누가 무엇을 하는지 나타내죠. 두 번째로 강조했다라고 해석되는 emphasizing은 콤마 뒤에 나온 분사구문이에요. 내려다보는 행동이 결국 어떤 결과를 낳았는지 자연스럽게 연결해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반대로,\u003c/span>\u003cspan class=\"en\">Conversely,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 또한 국민들이 ~하게 했고,\u003c/span>\u003cspan class=\"en\">it also \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">allowed \u003c/span>\u003cspan class=\"tgt\">subjects \u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">자신들의 통치자를 위로 올려다보게,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"tgt\">to \u003c/span>\u003cspan class=\"tgt\">gaze\u003c/span> up at their leaders,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">경외심과 거리감을 만들어냈다.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">creating\u003c/span> a sense of awe and distance.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">반대로 그것은 또한 국민들이 자신들의 통치자를 ‘위로’ 올려다보게 했고, 경외심과 거리감을 만들어냈다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 3번 문장의 '통치자가 내려다보는 상황'과 대조를 이루며, 피통치자가 느끼는 \u003cb class=\"key\">심리적 \u003c/b>\u003cb class=\"key\">압도감\u003c/b>을 설명합니다. 유리를 통해 형성된 시각적 구도가 통치자와 국민 사이의 \u003cb class=\"key\">위계질서\u003c/b>를 공고히 함을 의미합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">allow + 목적어 + to부정사\u003c/span> : allow [타동사] + subjects [목적어] + to gaze [목적격 보어(to부정사)] : \"국민들이 올려다보게 허용했다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">분사구문(결과)\u003c/span> : [앞 문장 내용], + [현재분사(v-ing)] : \"만들어내면서(만들어냈다)\"\u003c/div>\u003c/div>","segs":[{"n":22,"text":"Conversely, 반대로. it also allowed subjects, 그것은 또한 국민들이 ~하게 했고. to gaze up at their leaders, 자신들의 통치자를 위로 올려다보게. creating a sense of awe and distance, 경외심과 거리감을 만들어냈다.. 이 문장 전체를 해석하면, 반대로 그것은 또한 국민들이 자신들의 통치자를 ‘위로’ 올려다보게 했고, 경외심과 거리감을 만들어냈다.","hl":"m"},{"n":23,"text":"앞 문장에서는 왕이 내려다보는 권력을 말했다면, 이번에는 국민이 왕을 올려다볼 때 느끼는 심리적 압도감에 대해 말하고 있어요. 이 시각적 구조가 둘 사이의 위계질서를 명확하게 만들어 주는 것이죠.","hl":"mn"},{"n":24,"text":"첫 번째 포인트는 allow 동사의 쓰임이에요. 목적어 뒤에 반드시 to부정사 형태의 보어를 써야 해서 to gaze가 왔죠. 두 번째는 콤마 뒤의 creating인데, 앞 문장의 결과로 경외심이 생겨났음을 보여주는 분사구문의 결과 용법이에요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 5 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">베르사유 궁전을 생각해 보라:\u003c/span>\u003cspan class=\"en\">Consider the Palace of Versailles:\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것의 거울의 방은,\u003c/span>\u003cspan class=\"en\">its Hall of Mirrors,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">반사되는 표면들로 일렬로 둘러싸인,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">lined \u003c/span>\u003cspan class=\"tgt\">with\u003c/span> reflective surfaces,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">공간의 웅장함을 극대화했을 뿐 아니라\u003c/span>\u003cspan class=\"en\">not only magnified the grandeur of the space\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">또한 왕을 두었다\u003c/span>\u003cspan class=\"en\">but also placed the king\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">눈부신 장식의 중심에,\u003c/span>\u003cspan class=\"en\">at the center of a dazzling display,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그의 절대 권위를 강화하며.\u003c/span>\u003cspan class=\"en\">reinforcing his absolute authority.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">베르사유 궁전을 생각해 보라. 반사되는 표면들로 일렬로 둘러싸인 그것의 거울의 방은 공간의 웅장함을 극대화했을 뿐 아니라, 왕을 눈부신 장식의 중심에 두어 그의 절대 권위를 강화했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유리를 활용한 대표적인 예시로 베르사유 궁전을 들며, 거울이 \u003cb class=\"key\">시각적 \u003c/b>\u003cb class=\"key\">웅장함\u003c/b>과 왕의 \u003cb class=\"key\">절대 \u003c/b>\u003cb class=\"key\">권위\u003c/b>를 어떻게 시각화했는지 구체적으로 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거분사구(후치 수식)\u003c/span> : Hall of Mirrors [명사] + lined [과거분사] + with [전치사] : \"~로 둘러싸인\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"gn\">상관접속사 (병렬 구조)\u003c/span> : not only [A: 동사1] ... but also [B: 동사2] : \"~했을 뿐 아니라 ~했다\"\u003c/div>\u003c/div>","segs":[{"n":25,"text":"Consider the Palace of Versailles, 베르사유 궁전을 생각해 보라:. its Hall of Mirrors, 그것의 거울의 방은. lined with reflective surfaces, 반사되는 표면들로 일렬로 둘러싸인. not only magnified the grandeur of the space, 공간의 웅장함을 극대화했을 뿐 아니라. but also placed the king, 또한 왕을 두었다. at the center of a dazzling display, 눈부신 장식의 중심에. reinforcing his absolute authority, 그의 절대 권위를 강화하며.. 이 문장 전체를 해석하면, 베르사유 궁전을 생각해 보라. 반사되는 표면들로 일렬로 둘러싸인 그것의 거울의 방은 공간의 웅장함을 극대화했을 뿐 아니라, 왕을 눈부신 장식의 중심에 두어 그의 절대 권위를 강화했다.","hl":"m"},{"n":26,"text":"베르사유 궁전의 거울의 방은 단순히 화려한 게 아니에요. 거울을 통해 공간의 시각적 웅장함을 키우고, 그 중심에 왕을 배치해서 절대 권위를 아주 효과적으로 시각화한 것이죠.","hl":"mn"},{"n":27,"text":"첫 번째로 명사 Hall of Mirrors 뒤에 온 lined는 거울에 의해 둘러싸인 상태를 나타내는 과거분사 수식어예요. 두 번째는 not only A but also B 구문인데, magnified와 placed라는 과거동사 두 개가 병렬 구조로 연결되어 있으니 형태를 잘 확인하세요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 6 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">궁전들에서의 유리의 용도는\u003c/span>\u003cspan class=\"en\">The use of glass in palaces\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단순히 미적인 것이 아니었다;\u003c/span>\u003cspan class=\"en\">wasn't \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">merely\u003c/span> aesthetic;\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것은 전략적이었다.\u003c/span>\u003cspan class=\"en\">it was strategic.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">궁전들에서의 유리의 용도는 단순히 미적인 것이 아니었다. 그것은 전략적이었다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유리가 단순한 장식(미적 요소)을 넘어, 통치와 지배를 위한 \u003cb class=\"key\">정치적 \u003c/b>\u003cb class=\"key\">의도\u003c/b>가 담긴 \u003cb class=\"key\">전략적 \u003c/b>\u003cb class=\"key\">수단\u003c/b>이었음을 선언하는 문장입니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">부사의 형용사 수식\u003c/span> : merely [부사] + aesthetic [형용사] : \"단순히 ~한\"\u003c/div>\u003c/div>","segs":[{"n":28,"text":"The use of glass in palaces, 궁전들에서의 유리의 용도는. wasn't merely aesthetic, 단순히 미적인 것이 아니었다;. it was strategic, 그것은 전략적이었다.. 이 문장 전체를 해석하면, 궁전들에서의 유리의 용도는 단순히 미적인 것이 아니었다. 그것은 전략적이었다.","hl":"m"},{"n":29,"text":"궁전에서 유리를 쓴 게 그냥 보기 좋으라고 그런 게 아니라는 뜻이에요. 거기엔 아주 치밀한 정치적 의도와 전략적 수단이 숨어 있었다는 걸 강조하고 있습니다.","hl":"mn"},{"n":30,"text":"여기서 merely는 aesthetic이라는 형용사를 꾸며주는 부사예요. not merely라고 하면 단순히 미적이기만 한 건 아니라는 강한 부정을 나타내서 뒤에 나오는 strategic을 더욱 돋보이게 해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">열린 시야는\u003c/span>\u003cspan class=\"en\">Open sightlines\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">더 나은 감시와 통제를 가능하게 했고,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">allowed \u003c/span>\u003cspan class=\"tgt\">for\u003c/span> better surveillance and control,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">안전과 보안을 보장했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">ensuring\u003c/span> the safety and security\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">통치 가문의.\u003c/span>\u003cspan class=\"en\">of the ruling family.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">열린 시야는 더 나은 감시와 통제를 가능하게 했고, 통치 가문의 안전과 보안을 보장했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 유리의 투명성을 이용한 탁 트인 시야가 단순한 디자인이 아니라 권력자를 위한 \u003cb class=\"key\">감시와 \u003c/b>\u003cb class=\"key\">통제\u003c/b>의 수단으로 활용되어 \u003cb class=\"key\">안보\u003c/b>를 강화했음을 설명합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">구동사 allow for\u003c/span> : allow for [목적어] : \"~을 가능하게 하다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구문 (결과)\u003c/span> : [앞 문장], [v-ing (분사구문)] : \"보장하면서\"\u003c/div>\u003c/div>","segs":[{"n":31,"text":"Open sightlines, 열린 시야는. allowed for better surveillance and control, 더 나은 감시와 통제를 가능하게 했고. ensuring the safety and security, 안전과 보안을 보장했다. of the ruling family, 통치 가문의.. 이 문장 전체를 해석하면, 열린 시야는 더 나은 감시와 통제를 가능하게 했고, 통치 가문의 안전과 보안을 보장했다.","hl":"m"},{"n":32,"text":"이 문장은 궁전에서 유리를 사용한 것이 단순히 예뻐서가 아니라 전략적인 이유였다는 점을 보여줍니다. 탁 트인 시야를 확보함으로써 권력자가 사람들을 더 잘 감시하고 통제하여 자신의 가문을 안전하게 지킬 수 있었다는 내용이죠.","hl":"mn"},{"n":33,"text":"두 가지 포인트를 볼게요. 첫 번째로 allowed for는 어떤 상황을 가능하게 하다는 뜻의 구동사입니다. 두 번째로 쉼표 뒤에 나온 ensuring은 현재분사구문으로, 앞선 감시와 통제가 결과적으로 안전을 보장해 주었다는 결과를 나타내고 있어요.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 8 / 9\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">신하들과 방문자들은\u003c/span>\u003cspan class=\"en\">Courtiers and visitors\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">끊임없이 의식했고\u003c/span>\u003cspan class=\"en\">were constantly aware of\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">관찰되고 있는 것을,\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">being \u003c/span>\u003cspan class=\"tgt\">observed\u003c/span>,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">분위기를 조성했다\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">contributing \u003c/span>\u003cspan class=\"tgt\">to\u003c/span> an atmosphere\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">조심스러운 복종과 존경의.\u003c/span>\u003cspan class=\"en\">of careful obedience and respect.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">신하들과 방문자들은 끊임없이 관찰되고 있는 것을 의식했고, 그것은 조심스러운 복종과 존경의 분위기를 조성했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 누군가 자신을 보고 있다는 \u003cb class=\"key\">시선의 \u003c/b>\u003cb class=\"key\">압박\u003c/b>이 사람들의 심리에 영향을 주어, 권력자에게 자발적으로 \u003cb class=\"key\">복종\u003c/b>하게 만드는 심리적 기제를 묘사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">수동태 동명사\u003c/span> : of [전치사] + being [be동사] + observed [p.p.] : \"관찰되고 있는 것\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">현재분사구문\u003c/span> : [절], [v-ing] : \"조성하면서 (기여하면서)\"\u003c/div>\u003c/div>","segs":[{"n":34,"text":"Courtiers and visitors, 신하들과 방문자들은. were constantly aware of, 끊임없이 의식했고. being observed, 관찰되고 있는 것을. contributing to an atmosphere, 분위기를 조성했다. of careful obedience and respect, 조심스러운 복종과 존경의.. 이 문장 전체를 해석하면, 신하들과 방문자들은 끊임없이 관찰되고 있는 것을 의식했고, 그것은 조심스러운 복종과 존경의 분위기를 조성했다.","hl":"m"},{"n":35,"text":"궁전 안의 사람들은 투명한 유리창을 통해 자신이 항상 감시받고 있다는 사실을 뼈저리게 느꼈어요. 이런 심리적 압박감이 결국 왕에게 조심스럽게 행동하고 복종하는 분위기를 자연스럽게 만들어낸 것입니다.","hl":"mn"},{"n":36,"text":"중요한 어법 두 가지를 짚어볼게요. 첫 번째로 being observed는 수동태 동명사입니다. 신하들이 누군가를 보는 게 아니라 남에 의해 관찰되는 상태이기 때문에 수동형을 썼죠. 두 번째로 쉼표 뒤의 contributing to는 앞 문장의 상황이 복종의 분위기를 만들었다는 결과를 보여주는 분사구문입니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 9 / 9\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">건축물 그 자체가\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">The \u003c/span>\u003cspan class=\"tgt\">very\u003c/span> architecture\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">사회적 행동을 지배했다,\u003c/span>\u003cspan class=\"en\">dictated social behavior,\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">유리가 도구로서 역할을 하면서\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">with \u003c/span>\u003cspan class=\"tgt\">glass \u003c/span>\u003cspan class=\"tgt\">serving\u003c/span> as a tool\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">왕이 자신을 성찰하기 위한.\u003c/span>\u003cspan class=\"en\">for a king to reflect on himself.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">유리가 권력 역학 관계의 조용한 집행자로서 역할을 하면서 건축물 그 자체가 사회적 행동을 지배했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 물리적인 \u003cb class=\"key\">건축 \u003c/b>\u003cb class=\"key\">구조\u003c/b>가 단순히 건물을 넘어 사람들의 행동을 규정하는 힘을 가졌으며, 유리가 그 핵심적인 \u003cb class=\"key\">권력 \u003c/b>\u003cb class=\"key\">도구\u003c/b>였음을 결론짓습니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">명사 강조 형용사\u003c/span> : the very + [명사] : \"바로 그 (자체)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">with 분사구문\u003c/span> : with + [목적어] + [v-ing] : \"유리가 역할을 하면서\"\u003c/div>\u003c/div>","segs":[{"n":37,"text":"The very architecture, 건축물 그 자체가. dictated social behavior, 사회적 행동을 지배했다. with glass serving as a tool, 유리가 도구로서 역할을 하면서. for a king to reflect on himself, 왕이 자신을 성찰하기 위한.. 이 문장 전체를 해석하면, 유리가 권력 역학 관계의 조용한 집행자로서 역할을 하면서 건축물 그 자체가 사회적 행동을 지배했다.","hl":"m"},{"n":38,"text":"마지막 결론입니다. 건물이라는 물리적인 틀이 사람들의 행동 방식을 결정해버렸다는 거예요. 특히 유리는 왕의 권위를 비추고 사람들을 통제하는 핵심적인 도구로서 이 모든 권력 역학 관계를 조용히 집행하는 역할을 했습니다.","hl":"mn"},{"n":39,"text":"문법을 보면, 첫 번째로 명사 앞에 쓰인 the very는 바로 그라는 뜻으로 건축물 자체를 강조하고 있습니다. 두 번째로 with glass serving 부분은 목적어가 분사 동작을 하는 부대상황을 나타내요. 유리가 도구로서 역할을 하는 능동 관계이기 때문에 현재분사 serving을 쓴 것이 핵심입니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>궁전은 권력을 시각적으로 과시하기 위해 설계된 \u003cb class=\"key\">전략적 \u003c/b>\u003cb class=\"key\">무대\u003c/b>였다.\u003c/li>\u003cli>유리의 \u003cb class=\"key\">가시성\u003c/b>은 통치자와 백성 사이에 심리적 거리감과 경외심을 조성했다.\u003c/li>\u003cli>베르사유의 거울처럼 유리는 공간의 \u003cb class=\"key\">웅장함\u003c/b>을 키우고 절대 권위를 강화하는 도구였다.\u003c/li>\u003cli>궁전 건축은 단순한 미적 건물이 아니라 \u003cb class=\"key\">감시와 \u003c/b>\u003cb class=\"key\">통제\u003c/b>를 통해 사회적 행동을 규정했다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>Palaces utilized the transparency of glass as a strategic architectural tool to reinforce the ruler's absolute authority and ensure social obedience through surveillance.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">궁전은 단순히 거주하는 공간을 넘어 \u003cb class=\"key\">가시성\u003c/b>을 제공하는 유리를 전략적으로 활용하여 통치자의 \u003cb class=\"key\">절대 \u003c/b>\u003cb class=\"key\">권위\u003c/b>를 과시하고 백성을 \u003cb class=\"key\">감시와 \u003c/b>\u003cb class=\"key\">통제\u003c/b> 아래 두는 건축적 무대였다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":40,"text":"오늘 우리는 유리가 어떻게 단순한 건축 재료를 넘어 권력을 유지하는 전략적 도구가 되었는지 배웠습니다. 건축이 인간의 심리와 행동에 미치는 영향력을 보여주는 아주 좋은 지문이었어요. 복습할 때 베르사유 궁전의 이미지를 떠올리며 글의 흐름을 다시 한번 정리해 보세요. 수고 많으셨습니다!","hl":null}]}]});</script></body></html>
