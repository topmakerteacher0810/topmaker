<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2025년 10월 고2 모의고사 23번 — Lesson</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%;background:#F3F3F5}#app{width:min(1040px,94vw);height:92vh;margin:4vh auto}@media (max-width:700px){#app{width:100vw;height:auto;margin:0}}

@media (max-width:700px){.lp{min-height:0;height:100vh;height:100dvh;border-radius:0}.lp-slide{padding:18px 16px}.lp-cover{flex-direction:column}.lp-qn{flex:0 0 64px}.lp-cv h1{font-size:21px}.lp-chunk .en{font-size:18px}.lp-vg,.lp-sa{grid-template-columns:1fr}.lp-box{font-size:15px}.lp-big{font-size:21px}}

</style></head><body><div id="app"></div><script>function lecturePlayer(root,D){
  root.innerHTML='<div class="lp" tabindex="0"><div class="lp-top"><span class="lp-brand"></span><span class="lp-name"></span></div><div class="lp-warn" hidden></div><div class="lp-slide"></div><div class="lp-cap" hidden></div><div class="lp-bar"><div class="lp-tl" title="슬라이드 이동"><i></i></div><span class="lp-cnt"></span><button class="lp-cc">자막</button><select class="lp-rate" title="재생 속도"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option><option value="1.4">1.4x</option><option value="1.6">1.6x</option><option value="2">2.0x</option></select><button class="lp-prev" aria-label="이전 슬라이드">◀</button><button class="lp-play">▶ 재생</button><button class="lp-next" aria-label="다음 슬라이드">▶</button></div></div>';
  var q=function(s){return root.querySelector(s);},box=q(".lp"),sl=q(".lp-slide"),cap=q(".lp-cap"),cnt=q(".lp-cnt"),fill=q(".lp-tl>i"),tl=q(".lp-tl"),pp=q(".lp-play"),cc=q(".lp-cc"),warn=q(".lp-warn");
  q(".lp-brand").textContent=D.brand;q(".lp-name").textContent=D.title;
  var i=0,j=0,playing=false,rate=1,timer=null,tick=null,capOn=!!D.preview,noAudio=!!D.preview&&!D.blobs,a=new Audio();
  if(D.preview){cc.classList.add("on");}
  function segs(){return D.slides[i].segs||[];}
  function setFill(f){var s=segs(),n=D.slides.length,sf=s.length?(j+(f||0))/s.length:0;fill.style.width=Math.min(100,(i+sf)/n*100)+"%";}
  function showCap(){var s=segs()[j];cap.textContent=s?s.text:"";cap.hidden=!(capOn&&s&&s.text.trim());cc.classList.toggle("on",capOn);}
  function clearHl(){var e=sl.querySelectorAll(".lp-hl");for(var x=0;x<e.length;x++)e[x].classList.remove("lp-hl");}
  function hl(k){clearHl();if(!k)return;var e=sl.querySelector('[data-hl="'+k+'"]');if(e){e.classList.add("lp-hl");try{e.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(_){}}}
  function stopAll(){if(timer){clearTimeout(timer);timer=null;}if(tick){clearInterval(tick);tick=null;}try{a.pause();}catch(_){}}
  function silent(s){var dur=Math.max(1800,s.text.length*130/rate+700),t0=Date.now();if(!capOn){capOn=true;showCap();}
    tick=setInterval(function(){setFill(Math.min(1,(Date.now()-t0)/dur));},200);timer=setTimeout(function(){stopAll();segEnd();},dur);}
  var bases=null,bi=0,okBase=false,att=0;
  function cands(){if(bases)return bases;var out=[];function add(x){x=String(x||"").replace(/\/+$/,"");if(x&&out.indexOf(x)<0)out.push(x);}
    add(D.audioDir);try{var f=decodeURIComponent(location.pathname.split("/").pop()||""),nm=f.replace(/\.html?$/i,"");if(nm){add(nm+"_audio");add(nm.replace(/_AI강의$/,"")+"_audio");}}catch(_){}
    add("audio");bases=out;return out;}
  function playAudio(s){a.src=(D.blobs&&D.blobs[s.n])||(encodeURI(cands()[bi])+"/"+s.n+".mp3");a.playbackRate=rate;a.play().catch(function(){});}
  function runSeg(){stopAll();var s=segs()[j];clearHl();setFill(0);showCap();if(!s)return;hl(s.hl);if(!playing)return;
    if(noAudio){silent(s);return;}
    att=0;playAudio(s);}
  a.onloadeddata=function(){okBase=true;};
  a.onerror=function(){if(!playing)return;var s=segs()[j];if(!s)return;var L=cands().length;if(!okBase&&att<L-1){att++;bi=(bi+1)%L;playAudio(s);return;}if(!okBase)bi=(bi+1)%L;warn.hidden=false;warn.textContent="음성 파일("+cands()[bi]+"/"+s.n+".mp3)을 찾지 못해 자막으로 진행합니다.";silent(s);};
  a.ontimeupdate=function(){if(a.duration)setFill(a.currentTime/a.duration);};
  a.onended=function(){var s=segs()[j];if(s&&s.pause&&playing){timer=setTimeout(function(){timer=null;segEnd();},s.pause/rate);}else segEnd();};
  function segEnd(){if(!playing)return;if(j<segs().length-1){j++;runSeg();}else if(i<D.slides.length-1){i++;show();}else{playing=false;pp.textContent="▶ 재생";clearHl();fill.style.width="100%";}}
  function show(){stopAll();sl.innerHTML=D.slides[i].html;sl.scrollTop=0;cnt.textContent=(i+1)+" / "+D.slides.length;j=0;runSeg();}
  function go(d){i=Math.max(0,Math.min(D.slides.length-1,i+d));show();}
  function toggle(){playing=!playing;pp.textContent=playing?"⏸ 일시정지":"▶ 재생";if(playing){if(!noAudio&&a.src&&a.currentTime>0&&!a.ended&&a.paused&&!timer){a.play().catch(function(){});}else runSeg();}else stopAll();}
  q(".lp-prev").onclick=function(){go(-1);};q(".lp-next").onclick=function(){go(1);};pp.onclick=toggle;
  cc.onclick=function(){capOn=!capOn;showCap();};
  q(".lp-rate").onchange=function(e){rate=parseFloat(e.target.value)||1;a.playbackRate=rate;};
  tl.onclick=function(e){var r=tl.getBoundingClientRect();i=Math.max(0,Math.min(D.slides.length-1,Math.floor((e.clientX-r.left)/r.width*D.slides.length)));show();};
  box.addEventListener("keydown",function(e){if(e.target.tagName==="SELECT")return;if(e.key===" "){e.preventDefault();toggle();}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);});
  show();
  return {stop:function(){playing=false;pp.textContent="▶ 재생";stopAll();}};
}
lecturePlayer(document.getElementById("app"),{"brand":"Lesson","title":"2025년 10월 고2 모의고사 23번","audioDir":"23_audio","preview":false,"count":36,"slides":[{"html":"\u003cdiv class=\"lp-cover\">\u003cdiv class=\"lp-qn\">\u003cspan class=\"qt\" style=\"font-size:1.000em\">23번\u003c/span>\u003c/div>\u003cdiv class=\"lp-cv\">\u003cdiv class=\"src\">2025년 10월 고2 모의고사\u003c/div>\u003ch1>Requirements for Scientific Theory Replacement: From Newton to Einstein and Beyond\u003c/h1>\u003ch2>과학 이론 교체의 요건: 뉴턴에서 아인슈타인, 그리고 그 너머로\u003c/h2>\u003cdiv data-hl=\"sum\" style=\"padding:4px 0\">\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">핵심 요약\u003c/span>\u003cspan>과학 이론은 기존의 \u003cb class=\"key\">증거\u003c/b>를 더 잘 설명하고 이전 이론의 \u003cb class=\"key\">성공\u003c/b>을 포괄할 수 있을 때만 교체되며, 뉴턴에서 아인슈타인으로의 전환이 그 대표적인 \u003cb class=\"key\">진보\u003c/b>의 예이다.\u003c/span>\u003c/div>\u003cdiv class=\"lp-row\">\u003cspan class=\"lp-lb\">영문 요지\u003c/span>\u003cspan>A new scientific theory can replace an old one only if it explains existing evidence better and incorporates all previous successes while expanding into new realms.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":1,"text":"안녕하세요, 여러분! 오늘은 과학 이론이 어떤 과정을 거쳐 발전하고 교체되는지에 대해 다룬 지문을 함께 공부해보겠습니다. 이 글의 요지는 새로운 과학 이론이 인정받으려면 단순히 새로운 발견만으로는 부족하고, 이전 이론의 모든 성공적인 결과들을 포괄하면서도 더 넓은 증거를 설명해야 한다는 내용이에요.","hl":"sum"}]},{"html":"\u003cspan class=\"lp-tag\">배경지식\u003c/span>\u003cdiv class=\"lp-box\">과학적 지식은 단순히 쌓이기만 하는 것이 아니라, 기존 이론이 설명하지 못하는 \u003cb class=\"key\">변칙 \u003c/b>\u003cb class=\"key\">사례(Anomaly)\u003c/b>가 나타날 때 새로운 이론으로 대체됩니다. 이를 과학철학에서는 \u003cb class=\"key\">패러다임 \u003c/b>\u003cb class=\"key\">전환(Paradigm \u003c/b>\u003cb class=\"key\">Shift)\u003c/b>이라고 부르기도 합니다. 마치 구형 스마트폰에서 신형으로 바꿀 때, 기존 앱과 데이터를 모두 그대로 쓸 수 있으면서도 새로운 기능이 추가되어야 하는 것과 비슷합니다. 뉴턴의 \u003cb class=\"key\">만유인력 \u003c/b>\u003cb class=\"key\">법칙\u003c/b>은 거시 세계를 잘 설명했지만, 미세한 관찰 오차를 해결하기 위해 아인슈타인의 \u003cb class=\"key\">상대성 \u003c/b>\u003cb class=\"key\">이론\u003c/b>이 등장하게 된 것입니다.\u003c/div>","segs":[{"n":2,"text":"본격적으로 들어가기 전에 배경지식을 좀 쌓아볼까요? 과학의 역사는 기존 이론이 설명하지 못하는 변칙 사례들이 나타나면서 발전해왔어요. 이걸 전문 용어로 패러다임 전환이라고 하죠. 우리가 쓰는 스마트폰 앱이 업데이트될 때, 기존 기능은 그대로 유지하면서 새로운 기능이 추가되는 것과 비슷해요. 오늘 지문은 바로 뉴턴의 고전 역학이 아인슈타인의 상대성 이론으로 확장되는 과정을 통해 이 원리를 설명해줍니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">글의 흐름\u003c/span>\u003cdiv class=\"lp-st\" data-hl=\"f0\">\u003ch4>\u003ci>01\u003c/i>이론 교체의 전제 조건\u003csmall>도입 · 문장 1–2\u003c/small>\u003c/h4>\u003cp>과학 이론은 증거를 설명하는 \u003cb class=\"key\">더 \u003c/b>\u003cb class=\"key\">나은 \u003c/b>\u003cb class=\"key\">방법\u003c/b>이 있을 때만 교체될 수 있으며, 그 예로 \u003cb class=\"key\">뉴턴\u003c/b>과 \u003cb class=\"key\">아인슈타인\u003c/b>을 듭니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f1\">\u003ch4>\u003ci>02\u003c/i>뉴턴 이론의 한계 발생\u003csmall>예시 · 문장 3\u003c/small>\u003c/h4>\u003cp>뉴턴의 중력 이론은 훌륭했으나, 19세기 말 관찰 결과와 일치하지 않는 \u003cb class=\"key\">불일치(discrepancies)\u003c/b>가 나타나기 시작했습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f2\">\u003ch4>\u003ci>03\u003c/i>아인슈타인 이론의 등판\u003csmall>해결 · 문장 4–6\u003c/small>\u003c/h4>\u003cp>아인슈타인은 이 불일치를 해결했고, 뉴턴의 \u003cb class=\"key\">과거 \u003c/b>\u003cb class=\"key\">성공\u003c/b>까지 똑같이 잘 설명해냄으로써 더 \u003cb class=\"key\">포괄적인 \u003c/b>\u003cb class=\"key\">이론\u003c/b>으로 인정받았습니다.\u003c/p>\u003c/div>\u003cdiv class=\"lp-st\" data-hl=\"f3\">\u003ch4>\u003ci>04\u003c/i>미래 이론의 과제\u003csmall>결론 · 문장 7–8\u003c/small>\u003c/h4>\u003cp>앞으로 등장할 새로운 이론 또한 아인슈타인의 성과를 계승하면서 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">영역\u003c/b>에서도 작동해야만 \u003cb class=\"key\">인정\u003c/b>받을 수 있습니다.\u003c/p>\u003c/div>","segs":[{"n":3,"text":"이 글은 이론 교체의 대전제를 먼저 던지고, 구체적인 사례를 통해 그 원리를 증명한 뒤 미래의 전망으로 마무리하고 있어요.","hl":null},{"n":4,"text":"첫 번째와 두 번째 문장에서는 과학 이론 교체의 엄격한 조건을 제시해요. 단지 더 나은 설명 방법이 있을 때만 기존 이론을 discard하거나 replace할 수 있다는 거죠. 뉴턴과 아인슈타인이 그 가장 훌륭한 예시라고 소개합니다.","hl":"f0"},{"n":5,"text":"세 번째 문장에서는 뉴턴 이론의 위기와 한계를 보여줘요. 19세기 후반에 이르러 뉴턴의 예측과 실제 관찰 결과가 일치하지 않는 불일치, 즉 discrepancies가 발견되기 시작한 상황을 설명합니다.","hl":"f1"},{"n":6,"text":"네 번째부터 여섯 번째 문장까지는 해결 과정입니다. 아인슈타인의 일반 상대성 이론이 등장해서 그 불일치를 해결했죠. 중요한 건 아인슈타인의 이론이 뉴턴 이론의 과거 성공들도 똑같이 잘 설명해냈기 때문에, 우리는 이것을 더 포괄적인 broader theory로 받아들이게 된 거예요.","hl":"f2"},{"n":7,"text":"마지막 일곱 번째와 여덟 번째 문장은 미래를 내다봅니다. 앞으로 아인슈타인을 넘어설 새로운 이론이 나온다면, 그 역시 아인슈타인의 모든 성공을 match함과 동시에 새로운 영역에서도 제대로 작동해야 한다는 조건을 강조하며 끝을 맺습니다.","hl":"f3"}]},{"html":"\u003cspan class=\"lp-tag\">구조와 전개방식\u003c/span>\u003cdiv class=\"lp-box\" data-hl=\"ty\">\u003cspan class=\"lp-big\">예시 및 비교·대조\u003c/span>\u003cspan class=\"lp-pill\">양괄식\u003c/span>\u003cspan class=\"lp-pill\">주제문 1번\u003c/span>\u003cdiv style=\"margin-top:8px;font-size:15.5px\">첫 번째 문장에서 과학 이론 교체의 \u003cb class=\"key\">필요조건\u003c/b>을 제시하고, 마지막 문장에서 미래의 이론도 같은 \u003cb class=\"key\">조건\u003c/b>을 충족해야 함을 강조하고 있습니다. 뉴턴과 아인슈타인의 사례를 통해 \u003cb class=\"key\">포괄성\u003c/b>이라는 핵심 개념을 구체화하는 구조입니다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-box\" data-hl=\"sg\" style=\"margin-top:12px;background:#fff;border:1px solid #D6EAE9\">\u003cdiv class=\"lp-sig\">\u003cb>only if (1)\u003c/b>\u003cspan>조건 제시\u003c/span>\u003cb>but (3)\u003c/b>\u003cspan>이론의 한계점 암시\u003c/span>\u003cb>Still (5)\u003c/b>\u003cspan>반전 및 기존 성과 강조\u003c/span>\u003cb>that is why (6)\u003c/b>\u003cspan>결과 및 결론 도출\u003c/span>\u003c/div>\u003cdiv class=\"lp-chain\">\u003cspan class=\"c\">scientific theory\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Newton's theory of gravity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">Einstein's general theory of relativity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">broader theory of gravity\u003c/span>\u003cspan class=\"a\">→\u003c/span>\u003cspan class=\"c\">any new theory\u003c/span>\u003c/div>\u003ctable class=\"lp-ct\">\u003ctr>\u003cth>Newton's Theory\u003c/th>\u003cth>Einstein's Theory\u003c/th>\u003c/tr>\u003ctr>\u003ctd>19세기 이전까지의 방대한 증거 지지\u003c/td>\u003ctd>19세기 말 발견된 불일치까지 설명\u003c/td>\u003c/tr>\u003ctr>\u003ctd>특정 영역에서의 성공\u003c/td>\u003ctd>더 포괄적인(broader) 중력 이론\u003c/td>\u003c/tr>\u003c/table>\u003c/div>","segs":[{"n":8,"text":"이 글은 양괄식 구조를 취하고 있어요. 첫 번째 문장에서 이론 교체의 전제 조건을 제시하고, 마지막 여덟 번째 문장에서 다시 한번 미래 이론이 갖춰야 할 조건을 언급하며 주제를 굳히고 있죠. 전개 방식으로는 뉴턴과 아인슈타인을 대조하고 비교하는 예시 방식이 쓰였습니다.","hl":"ty"},{"n":9,"text":"글의 흐름을 잡아주는 신호어들에 주목해 보세요. 세 번째 문장의 but은 뉴턴 이론의 한계를 암시하고, 다섯 번째 문장의 Still은 그럼에도 불구하고 이전 이론의 성공을 무시할 수 없다는 논리적 반전을 보여줍니다. 또한 broader라는 단어를 통해 아인슈타인 이론의 특징을 한 단어로 요약해주고 있네요.","hl":"sg"}]},{"html":"\u003cspan class=\"lp-tag\">핵심 어휘\u003c/span>\u003cdiv class=\"lp-vg\">\u003cdiv>\u003cb>discard\u003c/b>\u003cem>동사\u003c/em>\u003cspan>버리다\u003c/span>\u003c/div>\u003cdiv>\u003cb>replace\u003c/b>\u003cem>동사\u003c/em>\u003cspan>대신하다, 대체하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>evidence\u003c/b>\u003cem>명사\u003c/em>\u003cspan>증거\u003c/span>\u003c/div>\u003cdiv>\u003cb>support\u003c/b>\u003cem>동사\u003c/em>\u003cspan>뒷받침하다, 지지하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>gravity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>중력\u003c/span>\u003c/div>\u003cdiv>\u003cb>vast\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>방대한\u003c/span>\u003c/div>\u003cdiv>\u003cb>prediction\u003c/b>\u003cem>명사\u003c/em>\u003cspan>예측\u003c/span>\u003c/div>\u003cdiv>\u003cb>match\u003c/b>\u003cem>동사\u003c/em>\u003cspan>일치하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>observation\u003c/b>\u003cem>명사\u003c/em>\u003cspan>관찰\u003c/span>\u003c/div>\u003cdiv>\u003cb>discrepancy\u003c/b>\u003cem>명사\u003c/em>\u003cspan>불일치\u003c/span>\u003c/div>\u003cdiv>\u003cb>general theory of relativity\u003c/b>\u003cem>명사\u003c/em>\u003cspan>일반 상대성 이론\u003c/span>\u003c/div>\u003cdiv>\u003cb>ignore\u003c/b>\u003cem>동사\u003c/em>\u003cspan>무시하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>acceptance\u003c/b>\u003cem>명사\u003c/em>\u003cspan>인정, 수용\u003c/span>\u003c/div>\u003cdiv>\u003cb>equally\u003c/b>\u003cem>부사\u003c/em>\u003cspan>똑같이\u003c/span>\u003c/div>\u003cdiv>\u003cb>broader\u003c/b>\u003cem>형용사\u003c/em>\u003cspan>더 포괄적인, 더 넓은\u003c/span>\u003c/div>\u003cdiv>\u003cb>seek\u003c/b>\u003cem>동사\u003c/em>\u003cspan>찾다, 추구하다\u003c/span>\u003c/div>\u003cdiv>\u003cb>beyond\u003c/b>\u003cem>전치사\u003c/em>\u003cspan>~을 넘어서\u003c/span>\u003c/div>\u003cdiv>\u003cb>realm\u003c/b>\u003cem>명사\u003c/em>\u003cspan>영역\u003c/span>\u003c/div>\u003c/div>","segs":[{"n":10,"text":"중요한 단어들을 살펴볼까요? discard는 버리다, replace는 대체하다라는 뜻으로 이론의 교체를 의미해요. 관찰 결과와 예측이 어긋나는 것을 discrepancy, 즉 불일치라고 표현했고, 이를 극복하는 것을 match, 일치시킨다고 표현했습니다.","hl":null}]},{"html":"\u003cspan class=\"lp-tag\">동의어 · 반의어\u003c/span>\u003cdiv class=\"lp-sa\">\u003cdiv>\u003cb class=\"w\">discard\u003c/b>\u003cspan class=\"m\">버리다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">abandon\u003c/span>\u003cspan class=\"s\">reject\u003c/span>\u003cspan class=\"s\">dispose of\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">keep\u003c/span>\u003cspan class=\"a\">retain\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">match\u003c/b>\u003cspan class=\"m\">일치하다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">correspond\u003c/span>\u003cspan class=\"s\">coincide\u003c/span>\u003cspan class=\"s\">fit\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">differ\u003c/span>\u003cspan class=\"a\">disagree\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">discrepancy\u003c/b>\u003cspan class=\"m\">불일치\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">inconsistency\u003c/span>\u003cspan class=\"s\">gap\u003c/span>\u003cspan class=\"s\">divergence\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">consistency\u003c/span>\u003cspan class=\"a\">agreement\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">gain\u003c/b>\u003cspan class=\"m\">얻다\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">acquire\u003c/span>\u003cspan class=\"s\">obtain\u003c/span>\u003cspan class=\"s\">attain\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">lose\u003c/span>\u003cspan class=\"a\">forfeit\u003c/span>\u003c/div>\u003c/div>\u003cdiv>\u003cb class=\"w\">broader\u003c/b>\u003cspan class=\"m\">더 포괄적인\u003c/span>\u003cdiv class=\"lp-chips\">\u003cspan class=\"s\">wider\u003c/span>\u003cspan class=\"s\">more comprehensive\u003c/span>\u003cspan class=\"s\">more inclusive\u003c/span>\u003cspan class=\"x\">⇄\u003c/span>\u003cspan class=\"a\">narrower\u003c/span>\u003cspan class=\"a\">limited\u003c/span>\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":11,"text":"동의어와 반의어도 챙겨보죠. discard는 abandon이나 reject로 바꿔 쓸 수 있고 반대말은 keep이에요. discrepancy는 inconsistency와 같은 말이며, agreement와는 반대되는 개념입니다. broader는 더 포괄적이라는 의미로 more comprehensive라고 이해하면 완벽합니다.","hl":null}]},{"html":"\u003cdiv class=\"lp-sno\">문장 1 / 8\u003cspan class=\"es\">서술형 대비\u003c/span>\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">우리는 버리거나 대신할 수 있다\u003c/span>\u003cspan class=\"en\">We can discard or replace\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">과학 이론을\u003c/span>\u003cspan class=\"en\">a scientific theory\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">단지 우리가 ~을 가질 때에만\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">only \u003c/span>\u003cspan class=\"tgt\">if\u003c/span> we have\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">설명하는 더 나은 방법을\u003c/span>\u003cspan class=\"en\">a better way of explaining\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">그것을 뒷받침하는 증거를\u003c/span>\u003cspan class=\"en\">the evidence \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">supports \u003c/span>\u003cspan class=\"tgt\">it\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">단지 우리가 그것을 뒷받침하는 증거를 설명하는 더 나은 방법이 있을 때에만 우리는 과학 이론을 버리거나 대신할 수 있다.\u003c/div>\u003c/di  증거가 뉴턴의 중력 이론을 뒷받침해 주지만, 19세기 후반에 이르러 과학자들은 그것의 예측들이 관찰 결과와 완벽하게 일치하지 않는 경우들을 발견하기 시작했다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 뉴턴 역학이 오랫동안 성공적이었으나, 기술의 발전으로 기존 이론으로는 설명 불가능한 \u003cb class=\"key\">불일치\u003c/b> 사례들이 나타나기 시작했다는 \u003cb class=\"key\">한계점\u003c/b>을 서술합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">과거완료 시제\u003c/span> : had + 과거분사(begun) : \"시작했었다\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">관계부사\u003c/span> : 선행사(cases) + where + 완전한 문장 : \"하는 (경우들)\"\u003c/div>\u003c/div>","segs":[{"n":18,"text":"A vast body of evidence, 방대한 양의 증거가. supports Newton's theory of gravity, 뉴턴의 중력 이론을 뒷받침해 주지만. but by the late nineteenth century, 19세기 후반에 이르러. scientists had begun to discover cases, 과학자들은 경우들을 발견하기 시작했다. where its predictions did not perfectly match observations, 그것의 예측들이 관찰 결과와 완벽하게 일치하지 않는. 이 문장 전체를 해석하면, 방대한 양의 증거가 뉴턴의 중력 이론을 뒷받침해 주지만, 19세기 후반에 이르러 과학자들은 그것의 예측들이 관찰 결과와 완벽하게 일치하지 않는 경우들을 발견하기 시작했다.","hl":"m"},{"n":19,"text":"뉴턴의 이론은 엄청난 증거가 있을 정도로 아주 훌륭했죠. 하지만 시간이 흐르면서 실제 관찰되는 모습과 이론상의 예측이 서로 맞지 않는 결정적인 한계 상황이 생겨나기 시작했다는 내용입니다.","hl":"mn"},{"n":20,"text":"첫 번째 포인트는 had begun입니다. 십구 세기 후반이라는 과거 시점 이전에 일어난 일을 말하려고 과거완료 시제를 썼어요. 두 번째는 관계부사 where인데요. 앞에 있는 cases를 상황적인 장소로 보고 그 안에서 어떤 일이 벌어졌는지를 완전한 문장으로 설명해 줍니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 4 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">이러한 불일치들은 설명되었습니다\u003c/span>\u003cspan class=\"en\">These discrepancies \u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">were \u003c/span>\u003cspan class=\"tgt\">explained\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아인슈타인이 개발했을 때 비로소\u003c/span>\u003cspan class=\"en\">only when Einstein developed\u003c/span>\u003 하는 더 넓은 개념으로 받아들인다는 결론입니다.","hl":"mn"},{"n":29,"text":"문장 맨 앞의 did는 대동사라고 해요. 앞 문장에서 언급된 '성과를 설명하다'라는 의미를 한 단어로 대신한 것이죠. 그리고 view A as B 구문이 쓰여서 아인슈타인의 이론을 더 포괄적인 이론으로 간주한다는 의미를 완성하고 있습니다.","hl":"gr"}]},{"html":"\u003cdiv class=\"lp-sno\">문장 7 / 8\u003c/div>\u003cdiv data-hl=\"m\">\u003cdiv class=\"lp-chunks\">\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">오늘날 몇몇의 과학자들은\u003c/span>\u003cspan class=\"en\">Some scientists today\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">찾고 있다\u003c/span>\u003cspan class=\"en\">are seeking\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">중력 이론을\u003c/span>\u003cspan class=\"en\">a theory of gravity\u003c/span>\u003c/div>\u003cdiv class=\"lp-chunk\">\u003cspan class=\"ko\">아인슈타인의 이론을 넘어설.\u003c/span>\u003cspan class=\"en\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"tgt\">that \u003c/span>\u003cspan class=\"tgt\">will \u003c/span>\u003cspan class=\"tgt\">go \u003c/span>\u003cspan class=\"tgt\">beyond\u003c/span> \u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"tgt\">Einstein's\u003c/span>.\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"lp-ko\">오늘날 몇몇의 과학자들은 아인슈타인의 이론을 넘어설 중력 이론을 찾고 있다.\u003c/div>\u003c/div>\u003cdiv class=\"lp-mn\" data-hl=\"mn\">\u003cb>의미\u003c/b> 과학적 지식은 고정된 것이 아니라 \u003cb class=\"key\">연속적인 \u003c/b>\u003cb class=\"key\">발전\u003c/b> 과정에 있음을 보여줍니다. 기존의 가장 완벽해 보이는 아인슈타인의 이론조차 \u003cb class=\"key\">대체 \u003c/b>\u003cb class=\"key\">가능성\u003c/b>을 가진 연구의 대상임을 시사합니다.\u003c/div>\u003cdiv class=\"lp-ap\" data-hl=\"gr\">\u003ch5>✓ 어법 체크\u003c/h5>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">1\u003c/span>\u003cspan class=\"gn\">주격 관계대명사\u003c/span> : a theory [선행사] + that [주격 관계대명사] + will go [동사] : \"넘어설 (중력 이론)\"\u003c/div>\u003cdiv class=\"gi\">\u003cspan class=\"mk\">2\u003c/span>\u003cspan class=\"gn\">소유대명사\u003c/span> : Einstein's [Einstein + 's] : \"아인슈타인의 이론\"\u003c/div>\u003c/div>","segs":[{"n":30,"text":"Some scientists today, 오 의 모든 성과에 필적해야 할 것이다.","hl":"m"},{"n":34,"text":"새로운 이론이 왕좌를 차지하려면 아주 까다로운 조건을 통과해야 해요. 기존 아인슈타인 이론이 이룬 성공을 그대로 재현하면서 동시에 기존 이론이 설명 못한 미지의 영역까지 해결해야 하거든요.","hl":"mn"},{"n":35,"text":"첫 번째로 if 절에서는 미래의 일이라도 현재시제인 gains를 써야 한다는 점을 기억하세요. 두 번째로 as well as는 뒤에 있는 것뿐만 아니라 앞에 있는 것도 해야 한다는 뜻으로 동사 match와 work를 병렬로 연결합니다. 세 번째로 where는 장소를 나타내는 realms를 수식하는 관계부사이고, 문장 끝의 does not 뒤에는 work가 생략되어 있답니다.","hl":"gr"}]},{"html":"\u003cspan class=\"lp-tag\">최종 정리\u003c/span>\u003cdiv class=\"lp-fin\">\u003cul>\u003cli>과학 이론은 기존 증거를 더 잘 설명하는 \u003cb class=\"key\">대안\u003c/b>이 있을 때만 교체될 수 있습니다.\u003c/li>\u003cli>뉴턴 이론의 한계는 아인슈타인의 \u003cb class=\"key\">일반 \u003c/b>\u003cb class=\"key\">상대성 \u003c/b>\u003cb class=\"key\">이론\u003c/b>에 의해 설명되며 해결되었습니다.\u003c/li>\u003cli>새로운 이론은 이전 이론이 가졌던 \u003cb class=\"key\">성공적인 \u003c/b>\u003cb class=\"key\">결과\u003c/b>들을 동일하게 설명해내야 합니다.\u003c/li>\u003cli>미래의 새로운 이론은 현재의 성과를 유지하면서 \u003cb class=\"key\">새로운 \u003c/b>\u003cb class=\"key\">영역\u003c/b>까지 포괄해야 인정을 받습니다.\u003c/li>\u003c/ul>\u003cdiv class=\"lp-box\">\u003cb>A new scientific theory can replace an old one only if it explains existing evidence better and incorporates all previous successes while expanding into new realms.\u003c/b>\u003cdiv style=\"color:#0A5F61;margin-top:4px\">과학 이론은 기존의 \u003cb class=\"key\">증거\u003c/b>를 더 잘 설명하고 이전 이론의 \u003cb class=\"key\">성공\u003c/b>을 포괄할 수 있을 때만 교체되며, 뉴턴에서 아인슈타인으로의 전환이 그 대표적인 \u003cb class=\"key\">진보\u003c/b>의 예이다.\u003c/div>\u003c/div>\u003c/div>","segs":[{"n":36,"text":"정리하자면, 과학의 진보는 이전의 것을 완전히 부정하는 것이 아니라, 이전의 성과를 품으면서 더 넓은 영역으로 나아가는 과정이라는 것을 배웠습니다. 아인슈타인처럼 더 포괄적인 시각을 갖는 것이 과학적 발전의 핵심이라는 점 꼭 기억하세요. 수고하셨습니다!","hl":null}]}]});</script></body></html>
